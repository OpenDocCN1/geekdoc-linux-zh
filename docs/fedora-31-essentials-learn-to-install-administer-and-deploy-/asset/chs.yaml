  \ GNOME 上的应用程序位于窗口中。当打开了多个应用程序窗口时，`Super + Tab` 键盘快捷键将显示切换器面板（图 6-7），允许选择不同的窗口作为当前活动窗口（`Super`\
  \ 键可以是 Windows 键，或者在 Mac 键盘上是 `Cmd` 键）：\n\n![](img/fedora_31_gnome_app_tab.png)\n\
  \n图 6-7\n\n如果某个应用程序打开了多个窗口，切换器将在第二个面板中显示这些窗口，以便选择特定的窗口：\n\n![](img/fedora_31_gnome_app_tab_multiple.png)\n\
  \n图 6-8\n\n若要在切换器中的图标之间反向循环，请使用 `Shift + Tab` 键盘快捷键。\n\n要最大化窗口以填满整个屏幕，请点击标题栏并将窗口拖动到屏幕顶部。要将窗口恢复到原始大小，点击标题栏并向下拖动。或者，简单地双击标题栏即可在窗口大小之间切换。同样，将窗口拖到屏幕左侧或右侧将使窗口填充屏幕的半部分。\n\
  \n### 6.5 使用工作空间\n\n应用程序窗口出现的屏幕区域称为工作空间，GNOME 3 允许配置多个工作空间。要创建新的工作空间，请显示“活动”概览并将鼠标指针移动到屏幕最右侧显示工作空间面板（图\
  \ 6-9）：\n\n![](img/fedora_31_gnome_workspaces.png)\n\n图 6-9\n\n要切换到不同的面板，只需从列表中选择即可。要将窗口从一个工作空间移动到另一个工作空间，显示工作空间面板并将应用程序窗口（当前工作空间中的实际窗口或工作空间面板中的缩略窗口）拖放到目标工作空间。当窗口被添加到空白工作空间时，工作空间面板会添加另一个空白工作空间，从而创建多个工作空间。\n\
  \n要删除工作空间，可以关闭该空间上的所有窗口，或将它们移动到另一个工作空间。\n\n### 6.6 日历与通知\n\n当系统需要通知你事件时（例如系统或应用程序更新的可用性），弹出面板将出现在工作区的顶部。点击顶部栏上的日期和时间即可访问日历和任何之前的通知，如\
  \ 图 6-10 所示：\n\n![](img/fedora_31_gnome_notifications.png)\n\n图 6-10\n\n### 6.7\
  \ 桌面设置\n\n要访问“设置”（Settings）应用程序，点击顶部栏最右侧的向下箭头，并选择带有工具图标的按钮，如 图 6-11 所示：\n\n![](img/fedora_31_gnome_settings_menu.png)\n\
  \n图 6-11\n\n`Settings` 应用程序提供了许多选项，如 图 6-11 所示：\n\n![](img/fedora_31_gnome_settings_menu.png)\n\
  \n图 6-11\n\n（注：由于原文存在大量重复内容，此处已去重合并翻译）\n\n### 6.8 总结\n\n`Cockpit` 是一个轻量级的 Web 界面，允许远程执行通用管理任务。安装并配置后，系统管理员只需打开浏览器窗口并导航到\
  \ Cockpit 端口。在后台，`Cockpit` 使用与通常在命令行操作时相同的工具，并自动更新以反映系统其他地方发生的变化。这允许 `Cockpit` 与其他管理工具和技术配合，而无担心一种方法覆盖另一种方法的风险。`Cockpit`\
  \ 还可以配置为访问多个服务器，允许通过单个浏览器会话对多个服务器进行管理和监控。\n\n`Cockpit` 默认安装并包含一系列内置工具。然而，`Cockpit`\
  \ 也允许根据需要安装额外的插件。`Cockpit` 的设计还允许您使用 HTML 和 JavaScript 的组合创建自己的扩展，以添加缺失或自定义的功能。\n\
  \n`Cockpit` 的模块化设计还允许许多功能嵌入其他 Web 应用程序中。\n\n### 7.2 安装并启用 Cockpit\n\n`Cockpit` 在\
  \ Fedora 31 上通常默认安装，但可以通过几个简单的步骤进行设置和启用。第一步按如下方式安装 `Cockpit` 包：\n\n```\ndnf install\
  \ cockpit\n```\n\n接下来，需要启用 `cockpit.socket` 服务：\n\n```\nsystemctl enable --now cockpit.socket\n\
  ```\n\n最后，需要在防火墙上打开必要的端口，以允许远程浏览器连接到 `Cockpit`。\n\n\n\n\n建立连接后，浏览器可能会发出警告，提示连接是不安全的。这是因为\
  \ `Cockpit` 服务正在使用自签名证书。您可以选择继续访问网站，或者为了以后避免出现此消息，可以选择高级选项并为服务器地址添加异常。\n\n一旦连接成功，浏览器将加载下方\
  \ 图 7-1 所示的日志页面：\n\n![](img/fedora_31_cockpit_login.png)\n图 7-1\n\n使用 `root` 或您的用户账户凭据登录\
  \ `Cockpit` 界面。请注意，当作为用户登录时，由于权限限制，`Cockpit` 界面中的某些任务将受到限制。登录后，`Cockpit` 将显示系统（System）屏幕。\n\
  \n### 7.4 系统\n\n系统屏幕提供了当前系统的概览，包括 CPU、内存、磁盘 I/O 和网络使用的实时性能指标。此屏幕还包含有关系统的信息，包括底层硬件、主机名、系统时间以及系统软件是否为最新。还提供了重启或关闭系统的选项。\n\
  \n例如，图 7-2 显示了 `Cockpit` 界面的系统监控页：\n\n![](img/fedora_31_cockpit_system.png)\n图 7-2\n\
  \n### 7.5 日志\n\n当选择“日志”（Logs）类别时，`Cockpit` 会显示 `systemd` 日志内容。选择一个日志条目将显示整个日志消息。日志条目按从新到旧排序，并包含菜单用于根据不同的时间范围和消息严重程度过滤日志。\n\
  \n![](img/fedora_31_cockpit_logs.png)\n图 7-3\n\n### 7.6 存储\n\n选择“存储”（Storage）选项来查看和管理系统的存储，包括磁盘、分区和卷组、网络文件系统\
  \ (NFS) 挂载以及 RAID 存储。此屏幕还允许实时监控磁盘 I/O 活动，并列出系统 `udisksd` 服务的输出，该服务用于查询和管理存储设备。\n\
  \n![](img/fedora_31_cockpit_storage.png)\n图 7-4\n\n### 7.7 网络\n\n“网络”（Network）屏幕提供了各种网络相关配置和服务的相关信息，包括网络接口和防火墙设置，并允许进行配置更改，例如创建网络桥接或设置虚拟网络。\n\
  \n![](img/fedora_31_cockpit_networks.png)\n图 7-5\n\n### 7.8 账户\n\n选择此选项查看系统上配置的当前用户账户，并为额外用户创建账户。用户管理主题将在本章标题为\
  \ 管理 Fedora 31 用户和组的章节中介绍。\n\n![](img/fedora_31_cockpit_accounts.png)\n图 7-6\n\n\
  点击现有账户以查看详情并进行更改。用户账户详情页还可以用于为用户账户查看和添加公钥 `SSH` 密钥，以便远程访问服务器，这在标题为 在 Fedora 31 上配置基于密钥的身份验证的章节中有概述。\n\
  \n### 7.9 服务\n\n此屏幕显示运行在服务器上的系统服务列表，并允许对这些服务进行添加、删除、停止和启动。\n\n![](img/fedora_31_cockpit_services.png)\n\
  图 7-7\n\n服务主题将在标题为 配置 Fedora 31 systemd 单元的章节中详细介绍。\n\n### 7.10 应用程序\n\n如前所述，可以通过扩展的形式为\
  \ `Cockpit` 添加附加功能。这些扩展可以是自开发的扩展，也可以是第三方提供的扩展。“应用程序”（Applications）屏幕列出了已安装的扩展，并允许添加或删除扩展。\n\
  \n![](img/fedora_31_cockpit_apps.png)\n图 7-8\n\n### 7.11 虚拟机\n\n虚拟化允许多个操作系统实例在单台计算机系统上同时运行，每个系统运行在自己的虚拟机内部。`Cockpit`\
  \ 的“虚拟机”（Virtual Machines）扩展提供了一种创建和管理安装在服务器上的虚拟机客端的方法。\n\n![](img/fedora_31_cockpit_virtual_machines.png)\n\
  图 7-9\n\n“虚拟机”扩展默认不安装，但可以通过“Cockpit 应用程序”（Cockpit Applications）屏幕或运行以下命令进行添加：\n\n\
  ```\ndnf install cockpit-machines\n```\n\n在 Fedora 31 中使用虚拟化将从标题为 虚拟化技术概述的章节开始介绍。\n\
  \n### 7.12 Podman 容器\n\nLinux 容器提供在单台计算机上运行多个操作系统实例的方法，它们都共享宿主系统的内核，为虚拟化提供了一种轻量且高效的替代方案。`Podman`\
  \ 是 Fedora 31 提供的工具集之一，用于创建和管理 Linux 容器，而 `Cockpit` 的“Podman 容器”屏幕提供了一个用户友的环境，用于下载和创建容器镜像。\n\
  \n![](img/fedora_31_cockpit_podman.png)\n图 7-10\n\n`Podman` 扩展默认不安装，但可以通过“Cockpit\
  \ 应用程序”（Cockpit Applications）屏幕或运行以下命令进行添加：\n\n```\ndnf install cockpit-podman\n\
  ```\n\nLinux 容器将在对应的 Linux 容器简介介绍。\n\n### 7.13 诊断报告\n\n选择此选项时，可以生成诊断报告并下载到本地进行分析。生成的报告是一个包含服务器上所有日志文件的压缩包。\n\
  \n![](img/fedora_31_cockpit_diagnostics.png)\n图 7-11\n\n如果未安装“诊断报告”扩展，可以通过“Cockpit\
  \ 应用程序”（Cockpit Applications）屏幕或运行以下命令进行添加：\n\n```\ndnf install sosreport\n```\n\
  \n### 7.14 内核转储\n\n此屏幕仅显示 Kdump 服务的状态，并在内核崩溃时指示内核转储文件的位置。该转储文件可以用于识别崩溃原因。提供了一个触发内核崩溃以测试内核转储的按钮，但不建议在生产服务器上使用此选项：\n\
  \n![](img/fedora_31_cockpit_kernel_dump.png)\n图 7-12\n\n内核转储扩展可能未安装，但可以通过“Cockpit\
  \ 应用程序”（Cockpit Applications）屏幕或运行以下命令进行添加：\n\n```\ndnf install kdump\n```\n\n###\
  \ 7.15 SELinux\n\n选择 SELinux 将指示 SELinux 策略是否正在执行，并显示该系统生成的任何警报。\n\n![](img/fedora_31_cockpit_seliniux.png)\n\
  图 7-13\n\nSELinux 扩展默认不安装，但可以通过“Cockpit 应用程序”（Cockpit Applications）屏幕或运行以下命令进行添加：\n\
  \n```\ndnf install cockpit-selinux\n```\n\n### 7.16 软件更新\n\n如果系统有任何可用软件更新，将列在此屏幕上。如果有可用更新，可以从此处进行安装。\n\
  \n![](img/fedora_31_cockpit_updates.png)\n图 7-14\n\n### 7.17 终端\n\n如名所示，“终端”（Terminal）屏幕提供了命令行提示符访问。\n\
  \n![](img/fedora_31_cockpit_terminal.png)\n图 7-15\n\n### 7.18 连接到多台服务器\n\n可以将 `Cockpit`\
  \ 配置为在一个会话中管理多个服务器。这需要在主系统上安装 `Cockpit dashboard`（即建立初始 Cockpit 会话的系统）。要安装 `cockpit-dashboard`\
  \ 包，请运行以下命令：\n\n```\ndnf install cockpit-dashboard\n```\n\n\n\n\n\n安装仪表板后，请退出 Cockpit\
  \ 并重新登录。仪表板现在将显示在 Cockpit 界面中，如图 7-16 所示：\n\n![](img/fedora_31_cockpit_dashboard.png)\n\
  图 7-16\n\n选中仪表板后，仪表板页面将显示当前系统的性能图表，并提供当前已连接系统的列表：\n\n![](img/fedora_31_cockpit_performance.png)\n\
  图 7-17\n\n要添加另一个系统，点击上方图 7-17 所示亮起的 `+` 按钮，输入另一个系统的 IP 地址或主机名，并选择一种颜色将此服务器与之前添加到\
  \ Cockpit 的任何服务器区分开，然后点击 `Add`（添加）按钮：\n\n![](img/rhel_8_cockpit_dashboard_add_server.png)\n\
  图 7-18\n\n输入连接到另一个系统时使用的用户名和密码，然后点击登录按钮。新添加的服务器现在将列在 Cockpit 仪表板中，并出现在由之前选择颜色表示的图中：\n\
  \n![](img/fedora_31_cockpit_perfromace_two_servers.png)\n图 7-19\n\n在使用 Cockpit 时在系统之间切换，只需使用下方图\
  \ 7-20 所示的下拉菜单：\n\n![](img/fedora_31_cockpit_switch_server.png)\n图 7-20\n\n### 7.19\
  \ 启用存储的指标\n\n在标准安装中，Cockpit 不会保留图表覆盖的短时间窗口之外的任何性能指标数据。为了保留 Cockpit 收集的数据，需要安装“存储的指标（stored\
  \ metrics）”功能。首先按照以下方式安装 `cockpit-pcp` 软件包：\n\n```bash\ndnf install cockpit-pcp\n\
  ```\n\n要启用指标持久化，显示“系统（System）”屏幕并点击图 7-21 所示亮起的 `Enable stored metrics...`（启用存储的指标...）链接：\n\
  \n![](img/fedora_31_cockpit_enable_stored_metrics.png)\n图 7-21\n\n一旦选择此选项，Cockpit\
  \ 将请求权限安装 `cockpit-pcp`、`pcp-libs` 和 `pcp-selinux` 软件包。一旦安装这些软件包，`Enable persistent\
  \ metrics`（启用持久指标）链接将被标记为 `Store Metrics`（存储指标）的控件取代。启用此选项后，性能图表将包含额外的控件，允许你在时间上前后移动查看历史数据，并更改从\
  \ 5 分钟到 1 周的时间范围。\n\n![](img/fedora_31_cockpit_store_5_minutes.png)\n图 7-22\n\n\
  ### 7.20 总结\n\nCockpit Web 界面允许从浏览器内部可视化地执行远程系统管理任务，无需依赖命令行提示符和命令行工具。一旦安装并启用，系统管理员只需打开浏览器，连接到远程服务器并登录\
  \ Cockpit 界面。在后台，Cockpit 使用与命令行提示符提供的相同的命令行工具，因此可以同时使用这两种方案而没有配置冲突的风险。Cockpit 使用模块化框架，允许添加额外的扩展，并允许开发和集成自定义扩展。一个\
  \ Cockpit 会话可以用于管理单个服务器，也可以配置为同时访问多个服务器。\n\n## 8. 在 Fedora 31 上使用 Bash Shell\n\n\
  学习如何操作 Fedora 31（以及一般的 Linux 发行版）的重要部分包括熟练地在 Shell 环境中工作。虽然 Linux 自带的 GNOME 等图形桌面环境为操作系统提供了用户友好的界面，但在实践中，Shell\
  \ 环境提供了比图形桌面工具能实现的多得的能力、灵活性和自动化程度。Shell 环境还为没有桌面环境的情况提供了与操作系统交互的手段；这在处理如 Fedora\
  \ 31 这样的基于服务器的操作系统或无法完全启动的损坏系统时是常见情况。\n\n因此，本章的目标是概述 Fedora 31 上的默认 shell 环境（专门指\
  \ `Bash` shell）。\n\n### 8.1 什么是 Shell？\n\nShell 是一个交互式命令解释器环境，在该环境中，你可以在提示符处输入命令，或者以脚本的形式输入文件并执行。Shell\
  \ 的起源可以追溯到 UNIX 操作系统的早期阶段。事实上，在引入图形桌面的之前的 Linux 早期，Shell 是用户与操作系统交互的唯一方式。\n\n多年来开发了多种\
  \ Shell 环境。第一个被广泛使用的 Shell 是由 Stephen Bourne 在贝尔实验室编写的 Bourne shell。\n\n另一个早期产物是\
  \ C shell，它与 C 语言语言在语法上具有某些相似之处，并引入了如命令行编辑和历史记录等易用性增强功能。\n\nKorn shell（由 David Korn\
  \ 在贝尔实验室开发）基于 Bourne shell 和 C shell 提供的特性。\n\nFedora 31 上的默认 shell 是 `Bash` `shell`（Bourne\
  \ Again SHell 的缩写）。这种 shell 起始于 Bourne shell 的开源版本，由 Brian Fox 为 GNU 项目开发，并基于 Bourne\
  \ shell 和 C shell 提供的特性。\n\n### 8.2 获取 Shell 访问\n\n在 GNOME 桌面环境中，可以通过选择顶栏中的“活动（Activities）”、输入\
  \ Terminal 并点击图标来访问 shell 提示符。\n\n当远程登录 Fedora 31 服务器时（例如使用 `SSH`），用户也会看到 shell\
  \ 提示符。关于使用 `SSH` 访问服务器的细节将在在 Fedora 31 上配置基于密钥的认证 章节中介绍。当启动未安装桌面环境的基于服务器的系统时，用户在完成登录程序后立即进入\
  \ shell。\n\n### 8.3 在提示符输入命令\n\n在 shell 提示符处只需输入命令并按回车键即可。虽然有些命令静默执行，但大多数命令在返回提示符之前会显示某种形式的输出。例如，可以使用\
  \ `ls` 命令显示当前目录下的文件和文件夹：\n\n```bash\n$ ls\nDesktop Downloads Music Public Templates\
  \ Videos\n```\n\n可用的命令要么内置在 shell 中，要么位于物理文件系统中。可以使用 `which` 命令识别命令在文件系统中的位置。例如，查找\
  \ `ls` 可执行文件在文件系统的位置：\n\n```bash\n$ which ls\nalias ls='ls --color=auto'\n/usr/bin/ls\n\
  ```\n\n显然 `ls` 命令位于 `/usr/bin` 目录。注意到配置了别名，该主题将在本章稍后介绍。使用 `which` 命令定位内置命令的路径将导致提示找不到可执行文件。例如，尝试查找\
  \ `history` 命令（它实际上内置在 shell 中，而不是作为文件系统上的可执行文件）的位置将产生类似下面的输出：\n\n```bash\n$ which\
  \ history\n/usr/bin/which: no history in (/home/demo/.local/bin:/home/demo/bin:/usr/share/Modules/bin:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin)\n\
  ```\n\n### 8.4 获取命令信息\n\nLinux shell 可用的许多命令最初看起来可能晦涩。要获取有关命令功能以及如何使用的详细信息，请使用 `man`\
  \ 命令并将命令名称作为参数。例如，更多关于 `pwd` 命令的信息：\n\n```bash\n$ man pwd\n```\n\n\n\n当执行上述命令时，将显示\
  \ `pwd` 命令的详细说明。许多命令在带有 `--help` 命令行选项运行时也会提供额外信息：\n\n```bash\n$ wc --help\n```\n\
  \n### 8.5 Bash 命令行编辑\n\n早期的 shell 环境不提供任何形式的行编辑功能。这意味着如果你在输入的长命令行开头处发现错误，你必须删除其之后的所有字符，纠正错误，然后重新输入命令的剩余部分。幸运的是，Bash\
  \ 提供了丰富的命令行编辑选项，如下表所示：\n\n| 组合键序列 | 动作 |\n| --- | --- |\n| Ctrl-b 或 左方向键 | 光标向后移动一位\
  \ |\n| Ctrl-f 或 右方向键 | 光标向前移动一位 |\n| Delete | 删除光标下方的字符 |\n| Backspace（退格） | 删除光标左侧字符\
  \ |\n| Ctrl-_ | 撤销上一次更改（可以重复以撤销所有之前的更改） |\n| Ctrl-a | 将光标移动到行首 |\n| Ctrl-e | 将光标移动到行尾\
  \ |\n| Meta-f 或 Esc 后接 f | 光标向前移动一个单词 |\n| Meta-b 或 Esc 后接 b | 光标向后移动一个单词 |\n| Ctrl-l\
  \ | 清除屏幕上当前命令以外的所有 |\n| Ctrl-k | 从当前光标位置删除到行尾 |\n| Meta-d 或 Esc 后接 d | 删除到当前单词末尾\
  \ |\n| Meta-DEL 或 Esc 后接 DEL | 从开头删除到当前单词 |\n| Ctrl-w | 从当前光标位置删除到上一个空白符 |\n\n表\
  \ 8-1\n\n### 8.6 使用 Shell 历史记录\n\n除了命令行编辑功能，Bash shell 还提供命令行历史支持。可以使用 `history`\
  \ 命令查看之前执行过的命令列表：\n\n```bash\n$ history\n    1 ps\n    2 ls\n    3 ls –l /\n   \
  \ 4 ls\n    5 man pwd\n    6 man apropos\n```\n\n此外，可以使用 `Ctrl-p`（或上方向键）和 `Ctrl-n`（或下方向键）在之前输入的命令之间来回滚动。当历史记录中显示出所需的命令时，按\
  \ Enter 键执行。\n\n另一种选项是输入 `!` 字符，后跟要重复执行命令的前几个字符，然后按 Enter 键。\n\n### 8.7 文件名简写\n\n\
  许多 shell 命令接受一个或多个文件名作为参数。例如，要显示名为 `list.txt` 的文本文件内容，可以使用以下 `cat` 命令：\n\n```bash\n\
  $ cat list.txt\n```\n\n同样，通过指定所有文件名作为参数，可以显示多个文本文件的内容：\n\n```bash\n$ cat list.txt\
  \ list2.txt list3.txt list4.txt\n```\n\n与其输入每个名称，可以使用模式匹配来指定所有符合特定标准的文件。例如，可以使用\
  \ `*` 通配符来简化上面的示例：\n\n```bash\n$ cat *.txt\n```\n\n上述命令将显示所有以 `.txt` 扩展结尾的文件内容。可以进一步限制为任何以\
  \ `list` 开头并以 `.txt` 结尾的文件：\n\n```bash\n$ cat list*.txt\n```\n\n可以使用 `?` 字符指定单字符匹配：\n\
  \n```bash\n$ cat list?.txt\n```\n\n### 8.8 文件名和路径补全\n\n与其输入整个文件名或路径，或使用模式匹配来减少输入量，shell\
  \ 提供了文件名补全功能。要使用文件名补全，只需输入文件或路径名的前几个字符，然后按两次 Esc 键。shell 将根据你输入的字符，用目录中匹配的第一个文件或路径名为你补全文件名。要获取可能的匹配项列表，在输入前几个字符后按\
  \ `Esc =`。\n\n### 8.9 输入和输出重定向\n\n如前所述，许多 shell 命令在执行时会输出信息。默认情况下，这些输出去向名为 `stdout`\
  \ 的设备文件，它本质上是运行 shell 的终端窗口或控制台。相反，shell 从名为 `stdin` 的设备文件获取输入，默认是键盘。\n\n可以使用 `>`\
  \ 字符将命令的输出从 `stdout` 重定向到文件系统上的物理文件。例如，要将 `ls` 命令的输出重定向到名为 `files.txt` 的文件，需要以下命令：\n\
  \n```bash\n$ ls *.txt > files.txt\n```\n\n完成后，`files.txt` 将包含当前目录下的文件列表。同样，可以将文件的内容作为\
  \ `stdin` 输入到命令中。例如，将文件的内容重定向为命令的输入：\n\n```bash\n$ wc –l < files.txt\n```\n\n上述命令将显示\
  \ `files.txt` 文件中的行数。\n\n需要注意的是，`>` 重定向运算符在使用时会创建一个新文件，或截断现有文件。若要向现有文件追加内容，请使用 `>>`\
  \ 运算符：\n\n```bash\n$ ls *.dat >> files.txt\n```\n\n除了标准输出外，shell 还使用 `stderr` 提供标准错误输出。当命令的输出被定向到\
  \ `stdout` 时，命令生成的任何错误信息都将定向到 `stderr`。这意味着如果 `stdout` 被重定向到文件，错误信息仍然显示在终端上。这通常是期望的行为，但如果需要，也可以\
  \ `2>` 运算符重定向 `stderr`：\n\n```bash\n$ ls 2> error.log\n```\n\n执行完成后，报告文件的错误将包含在\
  \ `stderr` 中。可以使用 `&>` 运算符将 `stderr` 和 `stdout` 重定向到同一个文件：\n\n```bash\n$ ls &> output\n\
  ```\n\n执行完成后，`output` 将包含两者。\n\n### 8.10 在 Shell 中使用管道\n\n除了 I/O 重定向外，shell 还允许将一个命令的输出直接管道到另一个命令的输入。管道操作通过在两个多个命令之间放置\
  \ `|` 字符实现。例如，要统计系统中运行的进程数量，可以将 `ps` 命令的输出通过 `wc` 命令：\n\n```bash\n$ ps –ef | wc\
  \ –l\n```\n\n命令行上执行管道操作的数量没有限制。例如，查找文件中包含 `Smith` 的行数：\n\n```bash\n$ cat file |\
  \ grep Smith | wc –l\n```\n\n### 8.11 配置别名\n\n随着你熟悉 shell 环境，可能会发现自己频繁使用带有参数的命令。例如，你可能经常带\
  \ `l` 和 `t` 参数使用 `ls` 命令：\n\n```bash\n$ ls –lt\n```\n\n为了减少执行命令时的输入量，可以创建一个映射到命令和参数的别名。例如，要让字母\
  \ `l` 执行 `ls –lt` 命令，可以使用以下语句：\n\n```bash\n$ alias l=\"ls –lt\"\n```\n\n现在提示符处输入\
  \ `l` 将执行原始语句。\n\n### 8.12 环境变量\n\nShell 环境变量提供了数据和配置的临时存储。shell 自身了一些环境变量，用户可以更改这些变量来修改\
  \ shell 的行为。可以使用 `env` 命令获取当前定义的变量列表：\n\n```bash\n$ env\n```\n\n\n或许最有用的环境变量是 `PATH`。它定义了\
  \ shell 在命令行提示符下搜索命令的目录路径，以及搜索的顺序。在新安装的 Fedora 31 系统上，用户账户的 `PATH` 环境变量可能配置如下：\n\
  \n```bash\n$ echo $PATH\n/home/demo/.local/bin:/home/demo/bin:/usr/share/Modules/bin:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin\n\
  ```\n\n另一个有用的变量是 `HOME`，它指定当前用户的家目录。例如，如果你想让 shell 也在你家目录下的 `scripts` 目录中查找命令，你可以按照如下方式修改\
  \ `PATH` 变量：\n\n```bash\n$ export PATH=$PATH:$HOME/scripts\n```\n\n可以使用 `echo` 命令显示现有环境变量的当前值：\n\
  \n```bash\n$ echo $PATH\n```\n\n你可以使用 `export` 命令创建自己的环境变量。例如：\n\n```bash\n$ export\
  \ DATAPATH=/data/files\n```\n\n将命令的输出赋值给环境变量的一个实用技巧是在命令周围使用反引号（`` ` ``）。例如，将当前日期和时间赋值给名为\
  \ `NOW` 的环境变量：\n\n```bash\n$ export NOW=`date`\n$ echo $NOW\nTue Apr 2 13:48:40\
  \ EDT 2019\n```\n\n如果你有每次进入 shell 环境时需要配置的环境变量或别名设置，可以将它们添加到家目录下一个名为 `.bashrc` 的文件中。例如，以下\
  \ `.bashrc` 文件配置了设置 `DATAPATH` 环境变量和一个别名：\n\n```bash\n# .bashrc\n\n# 加载全局定义\nif\
  \ [ -f /etc/bashrc ]; then\n  . /etc/bashrc\nfi\n\n# 用户特定环境\nPATH=\"$HOME/.local/bin:$HOME/bin:$PATH\"\
  \nexport PATH\n\n# 如果不喜欢 systemctl 的自动分页功能，请取消下行的注释：\n# export SYSTEMD_PAGER=\n\n\
  # 用户特定别名和函数\nexport DATAPATH=/data/files\nalias l=\"ls -lt\"\n```\n\n### 8.13 编写\
  \ Shell 脚本\n\n到为止，我们一直关注 `Bash` shell 的交互式特性。交互式是指在提示符处逐个手动输入命令并执行。事实上，这只是 shell\
  \ 能力的一小部分。可以认为，shell 最强大的方面之一就是创建 shell 脚本的能力。shell 脚本本质上是包含一系列语句的文本文件，这些语句可以在 shell\
  \ 环境中执行以完成任务。除了执行命令的能力，shell 还提供了许多编程结构，如你可能会在脚本语言中理预期找到的 `for` 和 `do` 循环以及 `if`\
  \ 语句。\n\n遗憾的是，shell 脚本的详细概述超出了本章的范围。然而，有很多专门介绍 shell 脚本的书籍和网络资源对该主题的描述比我们在这里提供的深入得多。因此，在本节中，我们仅提供\
  \ shell 脚本的一个小尝试。\n\n创建 shell 脚本的第一步创建一个文件（在本例中我们将其命名为 `simple.sh`），并将以下内容作为第一行：\n\
  \n```bash\n#!/bin/sh\n```\n\n`#!` 被称为“shebang”，是一个特殊的字符序列，表示执行脚本所需的解释器路径是该行中的下一个项目（在本例中，位于\
  \ `/bin` 的 `sh` 可执行文件）。如果 `/bin/csh` 或 `/bin/ksh` 是你想要使用的解释器，也可以同样使用它们。\n\n下一步是编写一个简单的脚本：\n\
  \n```bash\n#!/bin/sh\nfor i in *\ndo\n    echo $i\ndone\n```\n\n该脚本所做的只是遍历当前目录下的所有文件并显示每个文件的名称。可以通过将脚本名称作为参数传递给\
  \ `sh` 来执行：\n\n```bash\n$ sh simple.sh\n```\n\n为了使文件变为可执行文件（从而不再需要将其传递给 `sh` 命令），可以使用\
  \ `chmod` 命令：\n\n```bash\n$ chmod +x simple.sh\n```\n\n一旦在文件的权限上设置了执行位，就可以直接执行它。例如：\n\
  \n```bash\n$ ./simple.sh\n```\n\n### 8.14 总结\n\n在《Fedora 31 精要》的这一章中，我们简要游览了 `Bash`\
  \ shell 环境。在图形化桌面环境中，人们很容易忘记，操作系统的真正力量和灵活性往往只有跳过用户友桌面界面并使用 shell 环境才能充分利用。此外，当需要管理和维护没有安装桌面的服务器系统，或者当尝试修复损坏到桌面或\
  \ `Cockpit` 界面都无法启动的系统时，熟悉 shell 是必须的。\n\nshell 的能力远超本章涵盖的领域。如果你是 shell 新手，我们强烈建议你寻找额外的资源。一旦熟悉了这些概念，你很快发现，在终端窗口中使用\
  \ shell 执行许多任务比在桌面上穿过菜单和对话框要快。\n\n## 9. 管理 Fedora 31 用户和组\n\n在 Fedora 31 安装期间，安装程序创建了一个\
  \ `root`（或超级用户）账户，并要求配置密码。安装程序还提供了创建用户账户的机会。我们不应忽视 Fedora 31 实际上是一个多用户多任务操作系统。为了充分利用\
  \ Fedora 31 的功能，可能需要给多个用户访问权限。\n\n用户被进一步分为组以便于管理，这些组可以具有不同的权限。例如，所有销售人员可能属于一个销售组，而财务人员可能属于账户组，以此类推。用户被添加到一个。\n\
  \n在本章中我们将涵盖添加、删除用户和组的步骤。在 Fedora 31 系统上管理用户组的方法有很多，最常见的是命令行工具和 `Cockpit` 界面。在本章中我们将查看这两种方法。\n\
  \n### 9.1 通过命令行管理用户\n\n可以通过命令行使用 `useradd` 工具向 Fedora 31 系统添加新用户。要创建一个新用户账户，输入类似下面的命令：\n\
  \n```bash\n# useradd john\n```\n\n默认情况下，这会在 `/home` 目录下为用户创建一个家目录（在本例中为 `/home/john`）。要指定不同的家目录，在创建账户时使用\
  \ `-d` 命令行选项：\n\n```bash\n# useradd -d /users/johnsmith john\n```\n\n账户创建后，需要使用\
  \ `passwd` 工具分配密码才能登录系统：\n\n```bash\n# passwd john\n更改用户 john 的密码。\n新密码：\n重新输入密码：\n\
  passwd: 所有身份令牌更新成功。\n```\n\n可以通过命令行使用 `userdel` 工具删除现有用户：\n\n```bash\n# userdel\
  \ john\n```\n\n也可以在删除过程中移除用户的家目录和邮件池：\n\n```bash\n# userdel --remove john\n```\n\
  \nFedora 31 系统上的所有用户都是组的成员。默认情况下，新用户会被添加到一个与用户名相同的私有组（在上面的示例中，为用户 john 创建的账户属于同样名为\
  \ `john` 的私有组）。作为管理员，将用户组织成更有逻辑的组是有意义的。例如，所有销售人员可能属于一个销售组，而财务人员可能属于 `accounts` 组，以此类推。新组通过命令行使用\
  \ `groupadd` 命令行工具添加，例如：\n\n```bash\n# groupadd accounts\n```\n\n\n\n\n使用 `usermod`\
  \ 工具从命令行将现有用户添加到现有用户组中：\n\n```bash\nusermod -G accounts john\n```\n\n要将现有用户添加到多个现有用户组，请运行带有\
  \ `-G` 选项的 `usermod` 命令：\n\n```bash\nusermod -G accounts,sales,support john\n```\n\
  \n请注意，上述命令会将用户从任何 `-G` 之后未列出的辅助辅助组中移除，即使该用户目前是这些组的成员。若要保留任何现有的组成员关系，请使用 `-a` 标记追加新的组成员关系：\n\
  \n```bash\nusermod -aG accounts,sales,support john\n```\n\n可以使用 `groupdel` 实用程序从系统中删除现有组：\n\
  \n```bash\ngroupdel accounts\n```\n\n请注意，如果要删除的组是任何用户的主组或初始组，则无法将其删除。在删除该组之前，必须先删除该用户，或者使用\
  \ `usermod` 命令为其分配一个新的主组。可以使用 `usermod -g` 选项为用户分配新的主组：\n\n```bash\nusermod -g sales\
  \ john\n```\n\n```bash\ngroupdel accounts\n```\n\n要查找用户所属的组，只需运行 `groups` 命令。例如：\n\
  \n```bash\ngroups john\n```\n\njohn : john accounts support\n\n默认情况下，除非用户知道 root\
  \ 密码，否则用户账户将无法执行需要超级用户（root）权限的任务。但是，可以配置用户账户，以便使用 `sudo` 命令执行特权任务。这涉及到将用户账户作为 `wheel`\
  \ 组的成员，例如：\n\n```bash\nusermod -aG wheel john\n```\n\n一旦加入 `wheel` 组，用户将能够按照如下方式使用\
  \ `sudo` 执行其他情况下受限的任务：\n\n```bash\nsudo dnf update\n```\n\n[sudo] password for demo:\n\
  \n正在更新订阅管理存储库。\n\n.\n\n.\n\n可以通过编辑 `/etc/sudoers` 文件并找到以下部分来修改 `wheel` 组的 sudo 能力：\n\
  \n### 允许 wheel 组中的人员运行所有命令\n\n```text\n%wheel ALL=(ALL) ALL\n```\n\n### 同样的操作但无需密码\n\
  \n```text\n%wheel ALL=(ALL) NOPASSWD: ALL\n```\n\n要禁用所有 `wheel` 组成员的 `sudo`，请如下注释第二行：\n\
  \n### 允许 wheel 组中的人员运行所有命令\n\n```text\n# %wheel ALL=(ALL) ALL\n```\n\n要允许 `wheel`\
  \ 组成员在无需输入密码的情况下使用 `sudo`（出于安全考虑，不建议这样做），请取消 sudoers 文件相应行的注释：\n\n### 同样的操作但无需密码\n\
  \n```text\n%wheel ALL=(ALL) NOPASSWD: ALL\n```\n\n这里值得注意的是，在后台，所有这些命令仅仅都是对系统上的 `/etc/passwd`、`/etc/group`\
  \ 和 `/etc/shadow` 进行修改。\n\n# 9.2 使用 Cockpit 进行用户管理\n\n如果系统中安装并启用了 `Cockpit` Web\
  \ 界面（该主题在 Fedora 31 Cockpit Web 界面概述所示的账户屏幕中执行许多用户管理任务：\n\n![](img/fedora_31_cockpit_user_accounts.png)\n\
  \n图 9-1\n\n屏幕将显示系统上的任何现有用户账户，并提供一个添加额外账户的按钮。要创建新账户，点击 `Create New Account` 按钮并在弹出的对话框中输入所需信息（图\
  \ 9-2）。请注意，该选项还允许创建账户但在稍后锁定它：\n\n![](img/fedora_31_cockpit_accounts_new_user.png)\n\
  \n图 9-2\n\n要修改用户账户，请从主屏幕选择该账户并对账户详情进行任何修改：\n\n![](img/fedora_31_cockpit_accounts_edit_user.png)\n\
  \n图 9-3\n\n此屏幕允许执行各种任务，包括锁定或解锁账户、更改密码或强制用户配置新密码。如果选择了“Server Administrator”（服务器管理员）选项，则用户将被添加到\
  \ `wheel` 组，并允许使用 `sudo` 执行管理任务。系统还提供了一个从系统中删除该用户的按钮。\n\n如果用户将使用带有密钥加密的 `SSH` 连接远程访问系统，则可以在此屏幕内添加用户的公钥。`SSH`\
  \ 访问和认证将在后文在 Fedora 31 上配置基于密钥的认证中介绍。\n\n### 9.3 总结\n\n作为一个多用户操作系统，Fedora 31 的设计设计旨在支持对多个用户的受控访问。在安装期间，创建了\
  \ root 用户账户并分配了密码，同时还提供了创建用户账户的选项。可以使用一组命令行工具或通过 `Cockpit` Web 界面向系统添加额外的用户账户。除了用户账户外，Linux\
  \ 还实现了组的概念。可以使用命令行工具添加新组并将用户分配到这些组，且每个用户必须至少属于一个组。默认情况下，标准非 root 用户没有执行特权任务的权限。然而，特殊\
  \ `wheel` 组的成员可以使用 `sudo` 命令执行特权任务。\n\n# 10 理解 Fedora 31 软件安装与管理\n\n新安装的 Fedora\
  \ 31 系统极可能包含执行某些任务所需的所有软件包。即使已经安装了所有软件，在系统的生命周期内，几乎可以确定许多此类软件包将发布新版本。在某些情况下，可能需要在系统中保留特定软件包的旧版本。\n\
  \n本章介绍了 Fedora 31 软件管理的基本概念，解释了如何解决这些问题，引入了存储库、软件包和 Fedora 模块的概念，并探索了如何列出、安装和删除\
  \ Fedora 31 的软件包。\n\n### 10.1 存储库\n\nLinux 由一组提供操作系统核心功能的软件包以及一系列在基础操作系统之上添加功能的软件包和模块组成。\n\
  \n当首次安装 Fedora 31 时，根据安装阶段的选择将安装许多不同的软件包。然而，一旦系统运行，就可以需要安装额外的软件。通常，所有属于 Fedora 31\
  \ 的软件（即不是由第三方提供的软件）都使用 `dnf` 命令下载并安装到系统上。正如我们在前面的章节中看到的，这通常涉及在提示符处输入类似的命令：\n\n```bash\n\
  dnf install httpd\n```\n\n\n\n\n\n# `dnf config-manager --add-repo https://url/of/repo/file`\n\
  \n## 10.2 fedora 仓库\n\nfedora 仓库包含了构成操作系统核心运行的软件包。这些软件元素以红帽软件包管理器（RPM）包文件的形式下载，然后安装在系统上。一个典型的\
  \ Fedora 31 系统将安装大约 1500 个 RPM 软件包。要查看系统当前安装的所有 RPM 软件包列表，只需如下所示运行 `rpm` 命令：\n\n\
  ```bash\nrpm -qa | more\n```\n\nelfutils-0.177-1.fc31.x86_64\nipcalc-0.3.0-1.fc31.x86_64\n\
  libreport-filesystem-2.11.3-1.fc31.noarch\nlibluksmeta-9-fc31.x86_64\n\n运行如下所示的\
  \ `dnf` 命令可以获取从 fedora 仓库中可安装的软件包列表：\n\n```bash\ndnf list\n```\n\n若要获取匹配搜索字符串的软件包列表，请如下方式使用\
  \ `dnf`：\n\n```bash\ndnf search \"search string\"\n```\n\n还可以识别哪个软件包包含某个特定文件：\n\n\
  ```bash\ndnf provides filename\n```\n\n例如：\n\n```bash\ndnf provides /etc/httpd/conf/httpd.conf\n\
  ```\n\n上一次元数据过期检查：0:27:55 前（2019 年 12 月 19 日周四 下午 02:56:23 EST）。\nhttpd-2.4.41-5.fc31.x86_64\
  \ : Apache HTTP Server\nRepo : fedora\n匹配项：\nFilename : /etc/httpd/conf/httpd.conf\n\
  httpd-2.4.41-9.fc31.x86_64 : Apache HTTP Server\nRepo : updates\n匹配项：\nFilename\
  \ : /etc/httpd/conf/httpd.conf\n\n要安装软件包，请运行以下命令：\n\n```bash\ndnf install packagename\n\
  ```\n\n同样，要删除软件包：\n\n```bash\ndnf delete packagename\n```\n\n当可用新版本的软件包时，它将在下次更新系统时下载并安装，通常通过\
  \ `dnf` 命令进行：\n\n```bash\ndnf update\n```\n\n任何更新的软件包将替换系统上当前安装的旧版本。虽然在处理基础操作系统软件包时这通常是理想情况，但在处理编程环境或开发库等软件包时，这并非所需的行为，因为升级到新版本可能会导致与系统中安装的其他软件包产生兼容性问题。这个问题通过\
  \ `fedora-modular` 仓库解决了。\n\n## 10.3 fedora-modular 仓库\n\nAppStream 仓库以软件包、模块（modules）、流（streams）和配置文件（profiles）来管理软件。正如在前一节描述\
  \ BaseOS 时所述，AppStream 软件包再次是 RPM 软件包。另一方面，Fedora 模块是共同属于一组或之间存在依赖关系的软件包组（例如，构建\
  \ Web 服务器时需要一起安装的软件包组）。每个模块可以有多个流，其中每个模块流代表软件模块的不同版本。\n\n例如，考虑一个托管依赖于 7.1 版本 PHP\
  \ 脚本语言网站的 Fedora 31 系统。服务器仍然需要接收 PHP 7.1 的任何更新以从补丁和错误修复中受益，但与最新版本的 PHP（版本 7.2）不兼容。在引入\
  \ AppStream 之前，当发布新版本时，要继续接收版本 7.1 的更新是非常的。\n\n为了解决这个问题，Fedora 软件管理工具可以使用 `fedora-modular`\
  \ 仓库仅为特定模块订阅特定的流（在本例中为 PHP 模块的 7.1 流）。\n\n除了流之外，模块还可以通过模块配置文件（module profile）进行子分类。模块配置文件根据系统要求提供构成待安装模块软件包的不同配置。例如，`nodejs`\
  \ JavaScript 运行时环境模块可以使用开发配置（development profile）或精简配置（minimal profile）进行安装。在运行\
  \ `nodejs` 进行开发的系统上，最可能会使用开发配置。当部署使用 `nodejs` 开发的软件时，可能会安装只包含运行时的精简系统。\n\n要查看可安装的模块列表，请如下所示使用\
  \ `dnf` 命令：\n\n```bash\ndnf module list\n```\n\nFedora Modular 31 - x86_64\n名称 模块\
  \ 流 配置文件 摘要\nafterburn rolling [d] default [d] 简易云提供商代理\nant 1.10 [d] default [d]\
  \ Java 构建工具\naskalono-cli rolling [d] default [d] 检测许可证文件内容的工具\navocado latest [d]\
  \ default [d], minimal 带有自动化测试工具和库的框架\navocado 69lts [d] default [d], minimal 带有自动化测试工具和库的框架\n\
  bat latest [d] default [d] 带有翅角的 cat(1) 克隆\ncbindgen rolling [d] default [d] 生成\
  \ Rust 代码 C 绑定的工具\n\n列表的第一列是模块名称，第二列是流名称（通常是模块的版本）。流名称后的字母（`[d]`）表示该流是否为默认流（即如果没有引用特定流，则将使用该流进行安装），或者它在执行安装时是否已启用。\n\
  \n要查看可安装的模块列表，使用如下所示命令：\n\n```bash\ndnf module list\n```\n\n\n\n\n\n可以使用以下 `dnf`\
  \ 命令识别模块的附加信息：\n\n```\ndnf module info modulename\n```\n\n要查找哪些 RPM 包构成了特定模块和流（stream）组合的不同配置（profiles），请如下所示使用\
  \ `dnf`：\n\n```\ndnf module info --profile modulename:stream\n```\n\n例如：\n\n```\n\
  dnf module info --profile perl:5.30\n```\n\n上次元数据过期检查：0:53:06 之前（2019 年 12 月 20\
  \ 日周五 上午 10:09:44 EST）。\n\nName : perl:5.30:3120190918075438:a9ea5770:x86_64\ncommon\
  \ : perl\ndefault : perl\nminimal : perl-interpreter\n\nName : perl:5.30:3120191129151030:a9ea5770:x86_64\n\
  common : perl\ndefault : perl\nminimal : perl-interpreter\n\n最后，要从一个模块流切换到另一个流，只需运行引用新流的安装命令即可：\n\
  \n```\ndnf install @modulename:otherstream\n```\n\n此命令将下载新流的包，并将现有包升级或降级到指定的版本。一旦完成此过程，请重新同步新流的模块包：\n\
  \n```\ndnf distro-sync\n```\n\n### 10.4 总结\n\nFedora 31 系统由 RPM 格式的软件软件包组成，这些软件包从\
  \ Fedora 的 `fedora` 和 `fedora-modular` 仓库下载并安装。根据需要，可以为系统添加额外的安装包所需的仓库。\n\n`fedora`\
  \ 仓库包含了实现操作系统基础核心功能的包。另一方面，`fedora-modular` 包提供了额外的特性和功能，这些功能将根据配置系统的目的选择性地安装。在这样一个复杂的系统中，可能会存在大量的包间依赖关系，部分系统可能需要另一个软件包的特定版本才能正常运行。Fedora\
  \ 的模块化允许创建模块（modules）和配置（profiles），它们包含所有安装特定功能所需的依赖包，并确保它们在正确的版本级别上一起安装。模块化还允许已安装的包更新到当前版本，而无需下载下一个主版本，从而避免破坏其他包的依赖。\n\
  \n# 11. 配置 Fedora 31 systemd 单元\n\n为了精通 Fedora 31 系统管理，理解 `systemd` 单元的概念非常重要，特别是两种特定类型：目标（targets）和服务单元（services）。因此，本章的目标是提供\
  \ Fedora 31 支持的各种 `systemd` 单元的基本概述，并对如何配置运行中 Linux 系统后台的许多服务进行概述。\n\n## 11.1 理解\
  \ Fedora 31 systemd Target\n\nFedora 31 可以配置为启动到若干状态之一（称为目标），每个状态都旨在提供特定层面的操作系统功能。系统默认启动的目标由系统管理员根据系统的用途进行配置。例如，桌面系统最可能被配置为使用图形用户界面目标启动，而云端服务器系统则更有可能启动到多用户（multi-user）目标级别。\n\
  \n在启动序列期间，名为 `systemd` 的进程会在 `/etc/systemd/system` 文件夹中查找默认目标设置。识别默认目标后，它将启动与该目标相关的\
  \ `systemd` 单元，以便系统在所有必要进程运行的情况下启动。\n\n对于熟悉之前 Fedora 版本的用户，`systemd` 目标是旧的运行级别（runlevel）系统的替代品。\n\
  \n## 11.2 理解 Fedora 31 systemd 服务\n\n服务本质上是一个进程，通常运行在后台，提供特定的功能。例如，`sshd` 服务是提供系统安全\
  \ shell 访问的后台进程（也称为守护进程）。不同的 `systemd` 目标被配置为自动启动不同的服务集合，取决于该目标要提供的功能。\n\n目标和服务是\
  \ `systemd` 单元的类型，该主题将在本章稍后介绍。\n\n## 11.3 Fedora 31 systemd Target 描述\n\n如前所述，Fedora\
  \ 31 可以启动到若干目标级别之一。系统配置的默认目标将反过来决定启动哪些 `systemd` 单元。专门与系统启动和关机的目标可以总结如下：\n\n* `poweroff.target`\
  \ - 系统关机的目标。出于显而原因，你不太可能将其作为默认目标。\n* `rescue.target` – 导致系统以单用户模式启动，此时只有 root 用户可以登录。在这种模式下，系统不会启动任何网络、图形用户界面或多用户服务。此运行级别是系统管理员执行系统维护或修复操作的理想选择。\n\
  * `multi-user.target` - 将系统启动到具有文本控制台登录能力的多用户模式。\n* `graphical.target` - 将系统启动到具有\
  \ X Window System 能力的联网多用户状态。默认情况下，图形桌面环境将在启动过程结束时启动。这是桌面或工作站最常用的运行级别。\n* `reboot.target`\
  \ - 重启系统。另一个目标，出于显而见的原因，你不太可能将其作为默认目标。\n\n除了上述目标外，系统还包含了约 70 个其他目标，其中许多是上述目标的子目标。在后台，例如，`multi-user.target`\
  \ 还会启动一个名为 `basic.target` 的目标，该目标反过来会启动 `sockets.target` 单元，用于不同进程之间的通信。这确保了多用户目标所依赖的所有服务在启动过程中也会启动。\n\
  \n通过在终端窗口运行以下命令，可以查看指定目标依赖的目标和包列表：\n\n```\nsystemctl list-dependencies <target>\n\
  ```\n\n例如，图 11-1 显示了 `multi-user` 目标的部分 systemd 依赖列表（全功能系统包含 120 多个目标和服务）：\n\n![](img/rhel_8_target_dependencies.png)\n\
  \n图 11-1\n\n列表以层次树的形式呈现，说明了某些依赖具有子依赖。例如，滚动到列表底部会发现多用户目标依赖两个网络文件系统目标（即 `nfs-client.target`\
  \ 和 `remote-fs.target`），每个目标都有自己的服务目标子依赖：\n\n![](img/rhel_8_target_sub_dependencies.png)\n\
  \n图 11-2\n\n列表每项左侧的彩色点表示该服务或目标的当前状态：\n\n* 绿色 - 服务或目标已激活并运行。\n* 白色 - 服务或目标未激活（通常尚未启用、由于某些原因停止或未满足其依赖条件）。\n\
  * 红色 - 服务或目标由于致命错误未能启动。\n\n要获取有关 systemd 单元状态的详细信息，请使用 `systemctl status` 命令后跟单元名称：\n\
  \n```\nsystemctl status systemd-machine-id-commit.service\n```\n\n```\nsystemd-machine-id-commit.service\
  \ - 在磁盘上提交临时 machine-id\nLoaded: loaded (/usr/lib/systemd/system/systemd-machine-id-commit.service;\
  \ static; vendor preset: disabled)\nActive: inactive (dead)\nCondition: start condition\
  \ failed at Thu 2019-02-14 15:27:47 EST; 1h 14min \n```\n\n\n\n\n\n`ConditionPathIsMountPoint=/etc/machine-id`\
  \ 未未满足\n\n文档：`man:systemd-machine-id-commit.service(8)`\n\n### 11.4 识别和配置默认目标\n\n\
  Fedora 31 系统的当前默认目标可以使用 `systemctl` 命令进行如下识别：\n\n```bash\nsystemctl get-default\n\
  ```\n\n`multi-user.target`\n\n在上述情况下，系统配置为默认使用 `multi-user.target` 启动。可以使用 `systemctl`\
  \ 命令配合 `set-default` 选项随时更改默认设置。以下示例将默认目标更改为在系统下次启动时启动图形化用户界面：\n\n```bash\nsystemctl\
  \ set-default graphical.target\n```\n\n已删除 `/etc/systemd/system/default.target`。\n\
  \n创建了符号链接 `/etc/systemd/system/default.target` → `/usr/lib/systemd/system/graphical.target`。\n\
  \n默认更改操作的输出显示了 `systemctl` 命令在后台执行以实施更改的步骤。当前默认配置是通过从 `/etc/systemd/system` 目录下的\
  \ `default.target` 文件建立符号链接，指向 `/usr/lib/systemd/system` 文件夹中相应的目标文件（在本例中为 `graphical.target`\
  \ 文件）来实现。\n\n## 11.5 理解 systemd 单元和单元类型\n\n如前所述，目标和服务单元都是 systemd 单元的类型。`/usr/lib/systemd/system`\
  \ 文件夹内的所有文件都被称为 systemd 单元配置文件，每个文件都代表一个 systemd 单元。每个单元又被归类为特定的单元类型。Fedora 31 支持\
  \ 12 种不同的单元类型，包括本章已涵盖的目标和服务单元类型。\n\n单元文件的类型由下表 11-1 所示的文件扩展名表示：\n\n| 单元类型 | 文件名扩展名\
  \ | 类型描述 |\n| :--- | :--- | :--- |\n| Service | `.service` | 系统服务。 |\n| Target |\
  \ `.target` | systemd 单元组。 |\n| Automount | `.automount` | 文件系统自动挂载点。 |\n| Device\
  \ | `.device` | 内核识别的设备文件。 |\n| Mount | `.mount` | 文件系统挂载点。 |\n| Path | `.path`\
  \ | 文件系统中的文件或目录。 |\n| Scope | `.scope` | 外部创建的进程。 |\n| Slice | `.slice` | 管理系统进程的分级单元组。\
  \ |\n| Snapshot | `.snapshot` | systemd 管理器的保存状态。 |\n| Socket | `.socket` | 进程间通信套接字。\
  \ |\n| Swap | `.swap` | 交换设备或交换文件。 |\n| Timer | `.timer` | systemd 器。 |\n\n表 11-1\n\
  \n注意，目标单元类型与其他类型的区别在于，它本质上是由一组 systemd 单元（如服务或其他目标）组成的。\n\n## 11.6 动态更改当前目标\n\n\
  上述步骤指定系统下次启动时使用的目标，但不会更改正在运行的状态的状态。要动态切换到不同的目标，请再次使用 `systemctl` 命令，这次使用 `isolate`\
  \ 选项。例如，要在不重启的情况下将当前系统切换到图形目标，可以使用以下命令：\n\n```bash\nsystemctl isolate graphical.target\n\
  ```\n\n执行后，系统将启动图形化桌面环境。\n\n## 11.7 启用、禁用和屏蔽 systemd 单元\n\n新安装的 Fedora 31 系统将包含基础\
  \ systemd 服务单元，但可能不会包含系统进入生产环境后最终需要的所有服务。例如，基础 Fedora 31 安装通常不包含运行 Apache Web 服务器所需的包，其关键元素之一是\
  \ `httpd.service` 单元。\n\n系统管理员将通过使用以下命令安装必要的 `httpd` 包来解决这个问题：\n\n```bash\ndnf install\
  \ httpd\n```\n\n配置好 Web 服务器后，下一个任务是检查 `httpd.service` 单元的状态，以识别它是否作为安装过程的一部分被激活：\n\
  \n```bash\nsystemctl status httpd.service\n```\n\n```\nhttpd.service - The Apache\
  \ HTTP Server\n    Loaded: loaded (/usr/lib/systemd/system/httpd.service; disabled;\
  \ vendor preset: disabled)\n    Active: inactive (dead)\n      Docs: man:httpd.service(8)\n\
  ```\n\n注意，服务已加载但处于非活动状态，因为厂商预设置为在首次安装时禁用。要启动该服务，可以使用以下命令：\n\n```bash\nsystemctl\
  \ start httpd.service\n```\n\n现在状态检查将显示服务处于活动状态：\n\n```\nhttpd.service - The Apache\
  \ HTTP Server\n    Loaded: loaded (/usr/lib/systemd/system/httpd.service; disabled;\
  \ vendor preset: disabled)\n    Active: active (running) since Fri 2019-02-15 11:13:26\
  \ EST; 8s ago\n      Docs: man:httpd.service(8)\n    Main PID: 10721 (httpd)\n \
  \   Status: \"Started, listening on: port 80\"\n    Tasks: 21 (limit: 13923)\n```\n\
  \n状态检查现在显示服务是禁用的（disabled）。这意味着在下次系统重启时它不会启动。要配置服务在每次系统启动时自动运行，必须启用它：\n\n```bash\n\
  systemctl enable httpd.service\n```\n\n一旦启用，状态输出将显示为：\n\n`Loaded: loaded (/usr/lib/systemd/system/httpd.service;\
  \ enabled; vendor preset: disabled)`\n\n现在它已启用，系统下次重启到该目标时，httpd 服务将自动启动。假设在系统运行多用户目标时启用了该服务，httpd\
  \ 服务已作为另一个依赖被添加。\n\n在后台，`systemctl` 通过在 `/etc/systemd/system` 中的 `.wants` 文件夹中创建符号链接来为目标添加依赖。例如，`multi-user.target`\
  \ 单元在 `/etc/systemd/system` 中有一个名为 `multi-user.target.wants` 的文件夹，包含了 `/usr/lib/systemd/system`\
  \ 中它所依赖的所有单元。查看该文件夹将与 `systemctl list-dependencies` 命令列出的依赖项相关。\n\n要禁用作为目标依赖的服务，只需禁用它：\n\
  \n```bash\nsystemctl disable httpd.service\n```\n\n此命令将从 `.wants` 目录删除指向 `httpd.service`\
  \ 文件的符号链接，使其不再成为依赖，因此下次启动系统时不会启动它。\n\n`.wants` 文件夹包含在不可用时不会阻止单元启动运行的依赖。强制依赖（即如果不可用会导致单元失败的依赖）应该放在\
  \ `.requires` 文件夹中（例如 `multi-user.target.requires`）。\n\n除了启用和禁用，还可以屏蔽 systemd 单元：\n\
  \n```bash\nsystemctl mask httpd.service\n```\n\n被屏蔽的 systemd 单元即使被列为其他单元的依赖，在任何情况下都无法启用、禁用或启动。事实上，对于系统而言，被屏蔽的\
  \ systemd 单元就像不存在一样。恢复服务的唯一方法是取消屏蔽：\n\n```bash\nsystemctl unmask httpd.service\n\
  ```\n\n## 11.8 在 Cockpit 中处理 systemd 单元\n\n\n\n\n\n除了本章目前概述的命令行技术外，还可以从 Cockpit\
  \ Web 界面内部查看和管理 systemd 单元。假设 Cockpit 已按照“Fedora 31 Cockpit Web 界面概览”章节所述的方法进行了安装和设置，可以通过登录\
  \ Cockpit 并选择图 11-3 左侧导航面板中标记为 A 的 `Services` 选项来访问系统上的 systemd 单元列表：\n\n![](img/fedora_31_cockpit_services1.png)\n\
  \n图 11-3\n\n标记为 B 的按钮在标记为 C 的区域显示特定类型的单元，其中每个单元的当前状态列在 `State` 列。\n\n从列表中选择一个单元将显示详细信息。例如，图\
  \ 11-4 显示了 `httpd.service` 实例的详细界面，包括服务日志 (A) 和用于执行启动、停止、启用/禁用以及掩蔽/取消掩蔽单元任务的菜单选项\
  \ (B)。\n\n![](img/fedora_31_cockpit_httpd_service.png)\n\n图 11-4\n\n### 11.9 总结\n\
  \n新安装的 Fedora 31 系统包含一组基础 systemd 单元，其中许多单元在后台运行以提供系统的大部分功能。这些单元按类型分类，最常见的是目标 (targets)\
  \ 和服务 (services)。目标单元仅仅是一个要共同启动的其他单元组。系统有一个默认目标单元，它定义了每次系统启动时要启动的其他单元。最常用的目标是引导系统启动到多用户模式或图形模式的目标。`systemctl`\
  \ 命令行工具提供了许多执行 systemd 单元配置任务的选项，其中许多选项也可以通过 Cockpit Web 界面使用。\n\n## 12. Fedora\
  \ 31 网络管理\n\n很难想象一个没有至少一个网络连接的 Fedora 31 系统，而想象这样一个孤立系统如何产生多大的实际用途就更加困难。事实是，Fedora\
  \ 31 设计用于通过网络和互联网连接提供企业级服务。学习如何管理 Fedora 31 系统的关键部分之一是学习如何配置和管理安装在系统上的网络接口。\n\n\
  本章旨在提供 Fedora 31 上网络管理的概述，包括 `NetworkManager` 服务和工具以及其他实用程序。\n\n### 12.1 NetworkManager\
  \ 简介\n\n`NetworkManager` 是一个服务和一组工具，专门设计用于简化 Linux 系统上的网络配置，它是 Fedora 31 上默认的网络管理服务。\n\
  \n除了在后台运行的服务外，`NetworkManager` 还包含以下工具：\n\n- `nmcli` - 一个通过命令行与 `NetworkManager`\
  \ 工作的工具。该工具在无法访问图形环境时有用，也可以在脚本中使用更改网络配置。\n- `nmtui` - 用于管理 `NetworkManager` 的基础文本用户界面。该工具可以在任何终端窗口中运行，允许通过选择菜单和输入数据进行更改。虽然\
  \ `nmtui` 对于执行基本任务很有用，但它缺少 `nmcli` 工具提供的许多功能。\n- `nm-connection-editor` - 一个全图形化管理工具，提供了访问大多数\
  \ `NetworkManager` 配置选项的。\n- `GNOME Settings` - GNOME 桌面设置应用程序的网络屏幕允许执行基本的网络管理任务。\n\
  - `Cockpit Network Settings` - Cockpit Web 界面的网络屏幕允许执行一系列网络管理任务。\n\n虽然有多种方法可以管理\
  \ Fedora 31 上的网络环境，但为了本章，我们将关注 `nmcli` 命令。虽然在拥有桌面环境或启用了 Cockpit 时图形化工具无疑非常有用，但在只有命令行提示符的情况下，理解命令行界面是至关重要的。此外，图形化工具（包括\
  \ Cockpit）并不包含 `nmcli` 工具的所有功能。最后，一旦你熟悉了 `NetworkManager` 和 `nmcli`，这些技能在这些更直观的工具选项时可以轻松转换。图形化工具选项则不能如此。例如，如果你只用过\
  \ `nm-connection-editor`，那么使用 `nmcli` 就会很困难。\n\n### 12.2 安装并启用 NetworkManager\n\n\
  对于大多数 Fedora 31 安装，`NetworkManager` 应该默认安装。使用 `rpm` 命令查看它是否需要安装：\n\n```bash\n# rpm\
  \ -q NetworkManager\n```\n\n`NetworkManager-1.14.0-14.el8.x86_64`\n\n如有必要，按照以下方式安装包：\n\
  \n```bash\n# dnf install NetworkManager\n```\n\n一旦安装了包，就需要启用 `NetworkManager` 守护进程，以便在每次系统启动时启动：\n\
  \n```bash\n# systemctl enable NetworkManager\n```\n\n最后，启动服务并检查状态以验证启动成功：\n\n```bash\n\
  # systemctl start NetworkManager\n# systemctl status NetworkManager\n```\n\n● `NetworkManager.service`\
  \ - Network Manager\nLoaded: loaded (/usr/lib/systemd/system/NetworkManager.service;\
  \ enabled; vendor >\nDrop-In: /usr/lib/systemd/system/NetworkManager.service.d\n\
  └─NetworkManager-ovs.conf\nActive: active (running) since Tue 2019-04-09 10:07:22\
  \ EDT\n\n### 12.3  nmcli 命令\n\n`nmcli` 命令将作为 `Networkmanager` 包的一部分安装，并可以使用以下语法从命令行执行：\n\
  \n```bash\n# nmcli [Options] Object {Command | help}\n```\n\n在上述语法中，`Object` 将是\
  \ `general`、`networking`、`radio`、`connection`、`monitor`、`device` 或 `agent` 之一，所有都可以缩写为单词的几个字母（例如\
  \ connection 对应 `con`，甚至只是字母 `c`）。例如，以下所有命令都将输出与 `device` 对象相关的帮助信息：\n\n```bash\n\
  # nmcli device help\n# nmcli dev help\n# nmcli d help\n```\n\n要检查系统上 `NetworkManager`\
  \ 的整体状态，使用以下命令：\n\n```bash\n# nmcli general status\n```\n\nSTATE CONNECTIVITY WIFI-HW\
  \ WWAN-HW\nconnected full enabled enabled\n\n要检查系统上安装的设备状态，可以使用以下命令：\n\n```bash\n\
  # nmcli dev status\n```\n\nDEVICE TYPE STATE CONNECTION\neno1 ethernet connected\
  \ eno1\nwlp0s26u1u2 wifi connected zoneone\nvirbr0 bridge connected virbr0\nlo loopback\
  \ unmanaged --\nvirbr0-nic tun unmanaged --\n\n还可以通过 `-p` 选项修改输出使其符合人类习惯：\n\n```bash\n\
  # nmcli -p dev status\n```\n\n=====================\nStatus of devices\n=====================\n\
  DEVICE TYPE STATE CONNECTION\n-------------------------------------------------------------------\n\
  eno1 ethernet connected eno1\nwlp0s26u1u2 wifi connected zoneone\nvirbr0 bridge\
  \ connected virbr0\nlo loopback unmanaged --\nvirbr0-nic tun unmanaged --\n\n相反，可以使用\
  \ `-t` 选项使输出更简练，适用于自动化处理：\n\n```bash\n# nmcli -t dev status\n```\n\neno1:ethernet:connected:eno1\n\
  wlp0s26u1u2:wifi:connected:emilyzone\nvirbr0:bridge:connected:virbr0\nlo:loopback:unmanaged:\n\
  virbr0-nic:tun:unmanaged:\n\n从状态输出可以看出，系统安装了两个物理设备，一个是以太网，另一个是 Wi-Fi 设备。\n\n\n\n\
  \n\n网桥 (`virbr`) 条目是用于为虚拟机提供网络服务的虚拟设备（虚拟化主题将从名为虚拟化技术概述 的章节开始介绍）。回环接口是一个特殊的虚拟设备，允许系统与自身进行通信，通常用于执行网络诊断。\n\
  \n在与 `NetworkManager` 工作时，理解设备（device）和连接（connection）之间的区别非常重要。如上所述，设备是指物理或虚拟网络设备，而连接是设备所连接的网络配置。\n\
  \n以下命令显示系统上配置的连接信息：\n\n```bash\nnmcli con show\n\nNAME UUID TYPE DEVICE\nzoneone\
  \ 2abecafa-4ea2-47f6-b20f-4fb0c0fd5e94 wifi wlp0s26u1u2\neno1 99d40009-6bb1-4182-baad-a103941c90ff\
  \ ethernet eno1\nvirbr0 e13e9552-1765-42d1-b739-ff981668fbee bridge virbr0\nzonetwo\
  \ f940a2d1-8c18-4a9e-bf29-817702429b8a wifi --\nzonethree fd65c5e5-3e92-4e9e-b924-1b0b07b70032\
  \ wifi --\n```\n\n从上述输出中，我们可以看到 Wi-Fi 设备 (`wlp0s26u1u2`) 连接到了名为 `zoneone` 的无线网络，而以太网设备\
  \ (`eno1`) 连接到了名为 `eno1` 的连接。除了 `zoneone` 之外，`NetworkManager` 还列出了两个名为 `zonetwo`\
  \ 和 `zonethree` 的 Wi-Fi 连接，它们目前都没有连接设备。\n\n要查找分配给连接的 IP 地址，可以使用 `ip` 工具配合 `address`\
  \ 选项：\n\n```bash\nip address\n```\n\n这也可以简写为：\n\n```bash\nip a\n```\n\n```text\n\
  .\n.\n3: wlp0s26u1u2: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc mq state\
  \ UP group default qlen 1000\n    link/ether 74:da:38:ee:be:50 brd ff:ff:ff:ff:ff:ff\n\
  \    inet 192.168.1.121/24 brd 192.168.1.255 scope global dynamic noprefixroute\
  \ wlp0s26u1u2\n      valid_lft 57584sec preferred_lft 57584sec\n.\n.\n```\n\n`ip`\
  \ 命令将输出系统上检测到的所有设备的信息。上述输出显示 Wi-Fi 设备被分配了 IP 地址 `192.168.1.121`。\n\n如果我们只想列出活跃的连接，可以使用\
  \ `nmcli` 命令配合 `-a` 选项：\n\n```bash\nnmcli con show -a\n\nNAME UUID TYPE DEVICE\n\
  emilyzone 2abecafa-4ea2-47f6-b20f-4fb0c0fd5e94 wifi wlp0s26u1u2\neno1 99d40009-6bb1-4182-baad-a103941c90ff\
  \ ethernet eno1\nvirbr0 e13e9552-1765-42d1-b739-ff981668fbee bridge virbr0\n```\n\
  \n要将 Wi-Fi 设备连接从 `zoneone` 切换到 `zonetwo`，我们可以运行以下命令：\n\n```bash\nnmcli device wifi\
  \ connect zonetwo -ask\n```\n\nPassword:`\n\n`-ask` 标志会导致 `nmcli` 提示用户输入 Wi-Fi 密码。要在命令行中包含\
  \ Wi-Fi 密码（在脚本中执行命令时特别有用），请使用 `password` 选项：\n\n```bash\nnmcli device wifi connect\
  \ zonetwo password <password here>\n```\n\n还可以如下使用 `nmcli` 工具扫描可用的 Wi-Fi 网络：\n\n\
  ```bash\nnmcli device wifi list\n\nIN-USE SSID MODE CHAN RATE SIGNAL BARS SECURITY\n\
  \    zoneone Infra 6 195 Mbit/s 80 WPA2\n* zonetwo Infra 11 130 Mbit/s 74 WPA1 WPA2\n\
  ```\n\n可以通过如下方式禁用当前活跃的连接：\n\n```bash\nnmcli con down <connection name>\n```\n\n\
  同样，可以随时恢复一个非活跃连接的启用：\n\n```bash\nnmcli con up <connection name>\n```\n\n当一个连接断开时，`NetworkManager`\
  \ 会自动搜索另一个连接，激活它并将其分配到之前建立连接的设备。为了防止在这种情况下使用连接，可以按如下方式禁用 `autoconnect` 选项：\n\n```bash\n\
  nmcli con mod <connection name> connection.autoconnect no\n```\n\n可以使用以下命令获取关于特定连接的附加信息。这包括所有连接属性的当前值：\n\
  \n```bash\nnmcli con show eno1\n```\n\n```text\nconnection.id: eno1\n```\n\n\n\n\
  \n\n```bash\nnmcli con add type ethernet con-name static_ip ifname eno0 ip4 192.168.1.200/24\
  \ gw4 192.168.1.1\n```\n\n连接 `static_ip` (3fccafb3-e761-4271-b310-ad0f28ee8606)\
  \ 已成功添加。\n\n对应的 `ifcg-static_ip` 文件内容将如下：\n\n```ini\nTYPE=Ethernet\nPROXY_METHOD=none\n\
  BROWSER_ONLY=no\nBOOTPROTO=none\nIPADDR=192.168.1.200\nPREFIX=24\nGATEWAY=192.168.1.1\n\
  DEFROUTE=yes\nIPV4_FAILURE_FATAL=no\nIPV6INIT=yes\nIPV6_AUTOCONF=yes\nIPV6_DEFROUTE=yes\n\
  IPV6_FAILURE_FATAL=no\nIPV6_ADDR_GEN_MODE=stable-privacy\nNAME=static_ip\nUUID=3fccafb3-e761-4271-b310-ad0f28ee8606\n\
  DEVICE=eno2\nONBOOT=yes\n```\n\n添加新连接的命令可以稍作修改，以同时分配 IPv4 和 IPv6 静态地址：\n\n```bash\n\
  nmcli con add type ethernet con-name static_ip ifname eno0 ip4 192.168.1.200/24\
  \ gw4 192.168.1.1 gw4 192.168.1.1 ip6 cabf::4532 gw6 2010:dfa::1\n```\n\n### 12.5\
  \ 交互式编辑\n\n除了带有命令行选项的 `nmcli` 外，该工具还包含一个用于创建和修改连接文件的交互模式。例如，以下轨迹显示了如何使用交互模式创建一个名为\
  \ `demo_con` 的新以太网连接：\n\n```bash\nnmcli con edit\n```\n\n有效的连接类型：6lowpan, 802-11-olpc-mesh\
  \ (olpc-mesh), 802-11-wireless (wifi), 802-3-ethernet (ethernet), adsl, bluetooth,\
  \ bond, bridge, cdma, dummy, generic, gsm, infiniband, ip-tunnel, macsec, macvlan,\
  \ ovs-bridge, ovs-interface, ovs-port, pppoe, team, tun, vlan, vpn, vxlan, wimax,\
  \ wpan, bond-slave, bridge-slave, team-slave\n\n输入连接类型: ethernet\n\n```\n===| nmcli\
  \ interactive connection editor |===\n正在添加新的‘802-3-ethernet’连接\n\n输入‘help’或‘？’查看可用命令。\n\
  输入‘print’ 显示所有连接属性。\n输入‘describe [<setting>.<prop>]’ 获取详细属性描述。\n你可以编辑以下设置：connection,\
  \ 802-3-ethernet (ethernet), 802-1x, dcb, sriov, ethtool, match, ipv4, ipv6, tc,\
  \ proxy\n\nnmcli> set connection.id demo_con\nnmcli> set connection.interface eno1\n\
  nmcli> set connection.autoconnect yes\nnmcli> set ipv4.method auto\nnmcli> set 802-3-ethernet.mtu\
  \ auto\nnmcli> set ipv6.method auto\nnmcli> save\n\n正在保存带有‘autoconnect=yes’的连接。这可能会导致连接立即激活。\n\
  你仍然要保存吗？(yes/no) [yes] yes\n\n连接‘demo_con’ (cb837408-6c6f-4572-9548-4932f88b9275)\
  \ 已成功保存。\nnmcli> quit\n```\n\n另一方面，以下轨迹修改了之前创建的 `static_ip` 连接配置文件，使用与原始指定的不同的静态\
  \ IP 地址：\n\n```bash\nnmcli con edit static_ip\n```\n\n```\n===| nmcli interactive\
  \ connection editor |===\n正在编辑现有'802-3-ethernet'连接：'static_ip'\n\n输入'help'或'?'查看可用命令。\n\
  输入'print' 显示所有连接属性。\n输入'describe [<setting>.<prop>]' 获取详细属性描述。\n你可以编辑以下设置：connection,\
  \ 802-3-ethernet (ethernet), 802-1x, dcb, sriov, ethtool, match, ipv4, ipv6, tc,\
  \ proxy\n\nnmcli> print ipv4.addresses\nipv4.addresses: 192.168.1.200/24\nnmcli>\
  \ set ipv4.addresses 192.168.1.201/24\nnmcli> save\n\n连接'static_ip' (3fccafb3-e761-4271-b310-ad0f28ee8606)\
  \ 已成功更新。\nnmcli> quit\n```\n\n在修改现有连接后，请指示 NetworkManager 重新加载配置文件：\n\n```bash\n\
  nmcli con reload\n```\n\n在使用交互模式时，了解有一个广泛的内置帮助系统可供学习如何使用该工具是非常有用的。可以通过输入以下命令访问帮助主题：\n\
  \n## 12.6 配置 NetworkManager 权限\n\n除了使用命令行选项使用 `nmcli` 外，该工具还允许设置权限。例如，以下命令将连接限制为\
  \ root：\n\n```bash\nnmcli con mod static_ip permissions root\n```\n\n一旦重新加载了配置文件，连接将仅对\
  \ root 可。当最后一个此类用户注销时，连接将关闭。\n\n### 12.7 总结\n\nFedora 的网络管理由 NetworkManager 服务处理。NetworkManager\
  \ 将网络视为由设备和连接组成。网络设备可以是物理以太网或 Wi-Fi 设备，也可以是虚拟机使用的设备。连接代表设备所属的网络，并通过配置文件进行配置。配置文件将定义连接的静态还是动态\
  \ IP 地址、网关的 IP 地址以及系统启动时是否建立连接。\n\n## 13. 使用 firewalld 进行基础 Fedora 防火墙配置\n\n防火墙是保护计算机系统或网络不受外部攻击（通常来自通过互联网连接的外部）的关键组件。任何直接连接互联网的计算机都必须运行防火墙以防止恶意活动。同样，任何内部网络与其外部互联网连接之间都应该有一定的形式的防火墙。\n\
  \n所有 Linux 发行版都提供了某种形式的防火墙解决方案。在 Fedora 中，这以名为 `firewalld` 的服务形式存在。\n\n虽然防火墙配置主题可能很复杂，幸运的是\
  \ Fedora 提供了命令行、基于 Web 和图形化的工具来简化防火墙配置过程。本章将介绍 `firewalld` 的基本概念，并涵盖使用操作系统提供的工具配置防火墙所需的步骤。\n\
  \n### 13.1 firewalld 简介\n\n`firewalld` 服务使用一组规则来控制进入的网络流量，并定义哪些流量应被拦截，哪些允许通过系统，它是构建在更复杂的防火墙工具\
  \ `iptables` 之上的。\n\n\n\n\n\n遵循常见的安全实践，默认安装的 `firewalld` 被配置为阻止所有访问，但 SSH 远程登录和系统用于获取动态\
  \ IP 地址的 DHCP 服务除外（这两者对于系统管理员在安装完成后能够访问系统至关重要）。\n\nFedora 31 上防火墙配置的关键元素是区域（zones）、接口（interfaces）、服务（services）和端口（ports）。\n\
  \n### 13.1.1 区域 (Zones)\n\n默认情况下，`firewalld` 安装时带有一系列预配置的区域。区域是一组预配置的规则，可以随时应用于系统，以便快速实现特定场景的防火墙配置。例如，`block`\
  \ 区域阻止所有入站流量，而 `home` 区域在假设系统运行在更安全的环境中（期望有更高信任度）实施较不严格的规则。可以向系统添加新区域，并修改现有区域以添加或删除规则。也可以完全从系统中删除区域。表\
  \ 13-1 列出了在 Fedora 31 系统上默认可用的区域集：\n\n| 区域 (Zone) | 说明 (Description) |\n| --- |\
  \ --- |\n| drop | 最安全的区域。仅允许出站连接，所有入站连接都被丢弃且不向连接客户端发送任何通知。 |\n| block | 与 `drop`\
  \ 区域类似，不同之处在于入站连接会被拒绝并发送 `icmp-host-prohibited` 或 `icmp6-adm-prohibited` 通知。 |\n\
  | public | 用于连接到公共网络或互联网时，此时其他计算机不认为是可信的。允许某些特定的入站连接。 |\n| external | 当系统作为计算机网络的互联网网关时，`external`\
  \ 区域应用于连接到互联网的接口。该区域与 `internal` 区域配合使用，用于实现本章后面介绍的伪装或网络地址转换（NAT）。允许某些特定的入站连接。 |\n\
  | internal | 与 `external` 区域配合使用，应用于连接到内网的接口。假设内网上的计算机是受信任的。允许某些特定的入站连接。 |\n| dmz\
  \ | 用于系统运行在非军事化区（DMZ）时。这些通常是公开可访问但与你的内部网络其他部分隔离的计算机。允许某些特定的入站连接。 |\n| work | 用于在工作环境网络上运行系统，此时其他计算机是受信任的。允许某些特定的入站连接。\
  \ |\n| home | 用于在家庭网络上运行系统，此时其他计算机是受信任的。允许某些特定的入站连接。 |\n| trusted | 最不区域。接受所有入站连接。\
  \ |\n| FedoraServer | 为 Fedora Server 安装配置的一组默认防火墙规则。允许某些特定的入站连接，且与 `public` 区域相同。\
  \ |\n| FedoraWorkstation | 为 Fedora Workstation 安装配置推荐的防火墙规则集。允许某些特定的入站连接。 |\n\n\
  表 13-1\n\n要查看区域的特定设置，请参考位于系统 `/usr/lib/firewalld/zones` 目录下的相应 XML 文件。例如，以下列出了 `public.xml`\
  \ 区域配置文件的内容：\n\n```xml\n<?xml version=”1.0” encoding=”utf-8\"?>\n<zone>\n  <short>Public</short>\n\
  \  <description>用于公共区域。你不信任网络上的其他计算机不会伤害你的计算机。只接受特定的入站连接。</description>\n  <service\
  \ name=”ssh”/>\n  <service name=”mdns”/>\n  <service name=”dhcpv6-client”/>\n</zone>\n\
  ```\n\n### 13.1.2 接口 (Interfaces)\n\n任何连接到互联网或网络（或两者都有）的 Fedora 31 系统都包含至少一个物理或虚拟网络设备形式的接口。当\
  \ `firewalld` 激活时，这些接口每一个都被分配到一个区域，允许为不同的接口分配不同级别的防火墙安全。考虑一个包含两个接口的服务器，一个连接到外部互联网，另一个连接到内网。在这种情况下，面向外部的接口可能会被分配到限制较多的\
  \ `external` 区域，而内部接口可能会使用 `internal` 区域。\n\n### 13.1.3 服务 (Services)\n\nTCP/IP\
  \ 定义了一组在标准端口上通信的服务。例如，安全的 HTTPS Web 连接使用端口 `443` `，而 SMTP 邮件服务使用端口 `25` `。为了选择性地启用特定服务的入站流量，可以在区域中添加\
  \ `firewalld` 规则。例如，`home` 区域默认不允许入站 HTTPS 连接。可以通过向区域添加规则来允许入站 HTTPS 连接，而无需引用特定的端口号。\n\
  \n### 13.1.4 端口 (Ports)\n\n尽管在添加 `firewalld` 规则时可以引用常见的 TCP/IP 服务，但也会出现需要在未分配给服务的特定端口上允许入站连接的情况。可以通过添加引用特定端口而非服务的规则来实现。这种技术在标题为“Fedora\
  \ 31 Cockpit Web 界面概述” 的章节中使用，当时开启了端口 `9090` 以允许访问 Cockpit Web 界面。\n\n### 13.2 检查\
  \ firewalld 状态\n\n`firewalld` 服务在所有 Fedora 31 安装中默认安装并启用。可以通过以下命令检查服务的状态：\n\n```bash\n\
  # systemctl status firewalld\n```\n\n```\nfirewalld.service - dynamic firewall daemon\n\
  \    Loaded: loaded (/usr/lib/systemd/system/firewalld.service; enabled; preset:\
  \ enabled)\n    Active: active (running) since Thu 2019-02-14 14:24:31 EST; 3 days\
  \ ago\n      Docs: manfirewalld(1)\n    Main PID: 816 (firewalld)\n    Tasks: 2\
  \ (limit: 25026)\n    Memory: 30.6M\n    CGroup: /system.slice/firewalld.service\n\
  \              816 /usr/libexec/platform-python -s /usr/sbin/firewalld --nofork\
  \ --nopid\n```\n\n如有需要，可以通过以下命令安装 `firewalld` 服务：\n\n```bash\n# dnf install firewalld\n\
  ```\n\n该服务默认是启用的，因此在安装完成后和每次系统启动时都会运行。\n\n### 3.3 `firewall-cmd` 命令行工具允许在终端窗口中查看\
  \ `firewalld` 配置并对区域和规则进行更改。\n\n在更改防火墙设置时，了解运行时（runtime）和永久（permanent）配置的概念非常重要。默认情况下，任何规则更改都被视为运行时配置更改。这意味着更改将立即生效，但在下次系统重启或\
  \ `firewalld` 服务重载时将会丢失，例如通过执行以下命令：\n\n```bash\n# firewall-cmd --reload\n```\n\n\
  要使更改永久化，必须使用 `--permanent` 命令行选项。永久更改在 `firewalld` 服务重载之前不会生效，但在手动更改之前将一直保留。\n\n\
  #### 3.3.1 识别和更改默认区域\n\n要识别默认区域（即除非显式选择不同的区域，否则所有接口都将分配到的区域），请如下使用 `firewall-` 工具：\n\
  \n```bash\n# firewall-cmd --get-default-zone\npublic\n```\n\n将默认区域更改为另一个：\n\n```bash\n\
  # firewall-cmd --set-default-zone=home\nsuccess\n```\n\n#### 3.3.2 显示区域信息\n\n列出系统上所有可用的区域：\n\
  \n```bash\n# firewall-cmd --get-zones\nblock dmz drop external home internal libvirt\
  \ public trusted work\n```\n\n如下获取当前活跃区域及其分配的接口列表：\n\n```bash\n# firewall-cmd --get-active-zones\n\
  external\n```\n\n\n\n\n\n接口：`eth0`\n\n内部\n\n接口：`eth1`\n\n当前为特定区域配置的所有规则列如下：\n\n\
  ```bash\nfirewall-cmd --zone=home --list-all\n```\n\nhome (active)\n  target: default\n\
  \  icmp-block-inversion: no\n  interfaces: `eth0`\n  sources:\n  services: cockpit\
  \ dhcpv6-client http mdns samba-client ssh\n  ports:\n  protocols:\n  masquerade:\
  \ no\n  forward-ports:\n  source-ports:\n  icmp-blocks:\n  rich rules:\n\n使用以下命令列出当前可包含在\
  \ firewalld 规则中的服务：\n\n```bash\nfirewall-cmd --get-services\n```\n\nRH-Satellite-6\
  \ amanda-client amanda-k5-client amqp amqps apcupsd audit bacula bacula-client bgp\
  \ bitcoin bitcoin-rpc bitcoin-testnet bitcoin-testnet-rpc ceph ceph-mon cfengine\
  \ cockpit ...\n\n要列出当前为某个区域启用的服务：\n\n```bash\nfirewall-cmd --zone=public --list-services\n\
  ```\n\ncockpit dhcpv6-client ssh\n\n端口规则列表可以如下获取：\n\n```bash\nfirewall-cmd --zone=public\
  \ --list-ports\n```\n\n9090/tcp\n\n### 13.3 添加和删除区域服务\n\n要向区域添加服务（在本例中，即向 public\
  \ 区域添加 HTTPS），将使用以下命令：\n\n```bash\nfirewall-cmd --zone=public --add-service=https\n\
  ```\n\n成功 (success)\n\n默认情况下，这是一个运行时更改，因此添加的规则将在系统重启后丢失。要永久添加服务以使其在下次系统重启时仍然生效，请使用\
  \ `--permanent` 标记：\n\n```bash\nfirewall-cmd --zone=public --permanent --add-service=https\n\
  ```\n\n成功 (success)\n\n要验证服务是否已永久添加，在请求服务列表时请务必包含 `--permanent` 标记：\n\n```bash\n\
  firewall-cmd --zone=public --permanent --list-services\n```\n\ncockpit dhcpv6-client\
  \ http https ssh\n\n请注意，作为永久更改，此新规则在系统重启或重载 firewalld 之前不会生效：\n\n```bash\nfirewall-cmd\
  \ --reload\n```\n\n使用 `--remove-service` 选项从区域删除服务。由于这是一个运行时更改，规则将在下次系统重启时重新恢复：\n\
  \n```bash\nfirewall-cmd --zone=public --remove-service=https\n```\n\n要永久删除服务，请使用\
  \ `--permanent` 标记，并如果需要更改立即生效，请重载 firewalld：\n\n```bash\nfirewall-cmd --zone=public\
  \ --permanent --remove-service=https\n```\n\n### 13.3.4 使用基于端口的规则\n\n要启用特定端口，请使用\
  \ `--add-port` 选项。注意，在手动定义端口时，需要提供端口号和协议（`TCP` 或 `UDP`）：\n\n```bash\nfirewall-cmd\
  \ --zone=public --permanent --add-port=5000/tcp\n```\n\n在向区域添加规则时，也可以指定端口范围：\n\n\
  ```bash\nfirewall-cmd --zone=public --permanent --add-port=5900-5999/udp\n```\n\n\
  ### 13.3.5 创建新区域\n\n可以通过运行以下命令创建一个全新的区域。一旦创建，就可以像管理任何预定义区域一样管理该区域：\n\n```bash\n\
  firewall-cmd --permanent --new-zone=myoffice\n```\n\n成功 (success)\n\n在添加新区域后，需要重启\
  \ firewalld 之后区域才能可用：\n\n```bash\nfirewall-cmd --reload\n```\n\n成功 (success)\n\n\
  ### 13.3.6 更改区域/接口分配\n\n如前所述的，系统上的每个接口都必须分配给一个区域。也可以使用 `firewall-cmd` 工具更改接口所属的区域。在以下示例中，`eth0`\
  \ 接口被分配给 public 区域：\n\n```bash\nfirewall-cmd --zone=public --change-interface=eth0\n\
  ```\n\n成功 (success)\n\n### 13.3.7 伪装 (Masquerading)\n\n伪装在网络管理领域中更广为人知的名称是网络地址转换\
  \ (NAT)。当使用 Fedora 31 系统作为计算机网络访问的网关时，伪装允许所有内部系统在通过互联网通信时使用该 Fedora 31 系统的 IP 地址。这样做的好处可以向恶意外部实体隐藏任何系统的内部\
  \ IP 地址，并避免了为网络上的每台计算机分配公网 IP 地址的性。\n\n使用以下命令检查防火墙是否已启用了伪装：\n\n```bash\nfirewall-cmd\
  \ --zone=external --query-masquerade\n```\n\n使用以下命令启用伪装（如果是永久更改，请使用 `--permanent`\
  \ 标记）：\n\n```bash\nfirewall-cmd --zone=external --add-masquerade\n```\n\n### 13.3.8\
  \ 添加 ICMP 规则\n\n互联网控制消息协议 (ICMP) 用于网络上的客户端系统之间相互发送错误消息等信息。它也是 `ping` 命令的基础，网络管理员和用户用它来检测特定客户端在网络上是否活跃。ICMP\
  \ 类别允许阻止特定的 ICMP 消息类型。例如，管理员可能会选择阻止特定的 ping 消息以防止基于 ping 的拒绝服务 (DoS) 攻击（服务器被大量的\
  \ ping 消息冲击导致无法响应）。\n\n要查看包含在 firewalld 规则中的 ICMP 类型，运行以下命令：\n\n```bash\nfirewall-cmd\
  \ --get-icmp\n```\n\n例如，以下命令永久添加 echo-reply 规则：\n\n```bash\nfirewall-cmd --zone=public\
  \ --permanent --add-icmp=echo-reply\n```\n\n### 13.3.9 实现端口转发 (Port Forwarding)\n\
  \n当 Fedora 31 系统作为内部网络的网关时，端口转发与伪装配合使用。端口转发允许到达防火墙的端口流量转发到特定系统。\n\n假设 Fedora 31\
  \ 系统作为内部网络的防火墙，网络上的某一个系统被配置为 Web 服务器。假设该 Web 服务器系统的 IP 地址为 `192.168.2.20`。该网站的域名记录配置了\
  \ Fedora 31 系统背后的公网 IP 地址。当 HTTP 页面到达端口 80 时，作为防火墙的 Fedora 31 系统需要知道如何处理。通过配置端口转发，可以将流量引导至内部系统（继续使用\
  \ 80 或引导到不同端口）。事实上，端口转发甚至可以配置为转发到同一系统的不同端口（被称为本地转发）。\n\n要使用端口转发，首先按照如下方式启用伪装（此处假设连接互联网的接口已分配给\
  \ `external` 区域）：\n\n```bash\nfirewall-cmd --zone=external --add-masquerade\n```\n\
  \n要从端口转发到不同的本地端口，可以使用类似下面的命令：\n\n```bash\nfirewall-cmd --zone=external --add-forward-port=port=22:proto=tcp:toport=2750\n\
  ```\n\n在上述示例中，到达端口 22 的任何 `TCP` 流量将被转发到本地端口 2750。相反，下面的命令将本地系统的端口 20 转发到 IP 地址为\
  \ `192.168.0.19` 的系统的端口 22：\n\n```bash\nfirewall-cmd --zone=external \\\n  --add-forward-port=port=20:proto=tcp:toport=22:toaddr=192.168.0.19\n\
  ```\n\n同样，以下命令将本地端口 20 转发到 IP 地址为 `192.168.0.18` 的系统的端口 2750：\n\n```bash\nfirewall-cmd\
  \ --zone=external --add-forward-port=port=20:proto=tcp:toport=2750:toaddr=192.168.0.18\n\
  ```\n\n\n\n\n到目前为止，本章节提供了 `firewalld` 的概述，并探索了使用 `firewall-cmd` 命令行工具来管理防火墙区域和接口。虽然\
  \ `firewall-cmd` 提供了管理 `firewalld` 配置的最灵活方式，但也可以在 `Cockpit` Web 控制台中查看和管理默认区域的服务。\n\
  \n要访问 `firewalld` 设置，请登录 `Cockpit` 界面并从导航面板中选择 `Networking`（网络）。在网络页面上，选择下方图 13-1\
  \ 所示的高亮的 `Firewall`（防火墙）选项：\n\n![](img/fedora_cockpit_firewall_button.png)\n\n图\
  \ 13-1\n\n`Firewall` 页面显示了为默认区域配置的当前服务规则（并允许使用垃圾桶按钮删除服务）、向区域添加新服务，以及开启和关闭防火墙：\n\n\
  ![](img/fedora_cockpit_firewall.png)\n\n图 13-2\n\n### 13.5 使用 firewall-config 管理\
  \ firewalld\n\n如果你可以访问图形化桌面环境，也可以使用 `firewall-config` 工具配置防火墙。虽然它不是默认安装的，但可以通过以下方式安装\
  \ `firewall-config`：\n\n```bash\ndnf install firewall-config\n```\n\n启动后，会出现主 `firewall-config`\
  \ ，如图 13-3 所示：\n\n![](img/rhel_8_firewall-config.png)\n\n图 13-3\n\n该工具的关键区域可以总结如下：\n\
  \n- **A** - 显示所有当前激活的接口以及它们所属的区域。要将接口分配到不同的区域，请从此面板中选择它，点击 `Change Zone`（更改区域）按钮，并在弹出的对话框中选择所需的区域。\n\
  - **B** - 控制显示的信息以及在工具内进行的任何更改是应用于运行时规则还是永久规则。\n- **C** - 系统上配置的区域、服务或 `IPets` 列表。此面板中列出的信息取决于从工具栏\
  \ F 进行的选择。从此面板列表中选择项目将更新标记为 D 的主面板。\n- **D** - 包含工具栏 E 中当前选择类别信息的主面板。在本示例中，面板正在显示\
  \ public（公共）区域的服务。每个服务旁边的复选框控制该服务在防火墙中是否启用。在这些类别面板中可以添加新规则或配置或删除现有规则。\n- **E** -\
  \ 控制面板 D 中显示的内容。从此栏中选择项目将显示所选类别的当前规则。\n- **F** - 控制面板 C 中显示的列表。\n\n`firewall-config`\
  \ 工具使用起来简单且直观，允许许多许多可以使用 `firewall-cmd` 执行的任务在视觉化环境中完成。\n\n### 13.6 总结\n\n一个精心规划和实施的防火墙是任何安全系统的至关组成部分。对于\
  \ Fedora 31 而言，`firewalld` 服务提供了一个既灵活又易管理的防火墙系统。\n\n`firewalld` 服务使用“区域（zones）”的概念将一组防火墙规则组合，并包含了一系列预定义的区域，旨在满足各种防火墙保护需求。这些区域可以被修改以添加或删除规则，也可以创建并配置全新的区域。系统上连接到网络或互联网的网络设备称为接口（interfaces）。每个接口反都被分配给一个区域。用于\
  \ `firewalld` 的主要工具是 `firewall-cmd` 命令行工具和 `firewall-config` 图形实用程序。`Cockpit` Web\
  \ 界面提供了基本的防火墙管理选项。\n\n## 14. 在 Fedora 31 上配置基于密钥的 SSH 身份验证\n\n安装 Fedora 31 系统时，默认配置允许通过\
  \ Secure Shell (SSH) 连接进行远程命令行访问。这为 root 账户（如果账户已启用）以及安装期间添加的任何其他用户提供了密码保护和加密的系统访问。这种级别的安全性远不足，应尽快升级为基于\
  \ SSH 密钥的身份验证。\n\n本章将概述通过实施基于密钥的 SSH 身份验证提高 Fedora 31 系统安全性的步骤。\n\n### 14.1 Secure\
  \ Shell (SSH) 概述\n\n`SSH` 设计用于安全远程访问系统，以获取 shell 访问并传输文件和数据。正如“使用 VNC 进行 Fedora\
  \ 31 远程桌面访问” 中提到的，`SSH` 还可以提供一个安全隧道，通过该隧道可以在网络连接上实现对 GNOME 桌面的远程访问。\n\n基础的 `SSH`\
  \ 配置由一个客户端（用于建立连接的计算机）和一个服务器（运行在要建立连接的系统上）组成。例如，用户可以使用运行在 Linux、Windows 或 macOS\
  \ 系统上的 `SSH` 客户端连接到运行在 Fedora 31 系统上的 `SSH` 服务器，以访问 shell 命令行提示符或执行文件传输。客户端和服务器之间的所有通信（包括为了访问而输入的密码）都经过加密，防止外部人员截获数据。\n\
  \n基础 `SSH` 实现的固有弱点是它完全依赖于分配给系统账户的密码强度。如果恶意第三方能够识别出账户的密码，系统就会变得脆弱。可以通过实施基于密钥的身份验证来解决这一问题。\n\
  \n### 14.2 基于密钥的身份验证\n\n基于密钥的 `SSH` 验证利用非对称公钥加密为远程访问增加额外的安全性。公钥加密的概念于 1975 年由 Whitfield\
  \ Diffie 和 Martin Hellman 发明，基于使用一对密钥（私钥和一个公钥）的概念。\n\n在公钥加密系统中，公钥用于加密数据，只有私钥的所有者才能解密。\n\
  \n在 `SSH` 基于密钥的身份验证情况下，私钥由运行 SSH 客户端的主机持有，而相应的公钥位于运行 `SSH` 服务器的系统上。保护私钥非常重要，因为拥有密钥任何人都可以登录远程系统。因此，作为额外的保护层，私钥也可以被加密并由密码保护，每次与服务器连接时都需要输入。\n\
  \n### 14.3 设置基于密钥的身份验证\n\n设置基于密钥的 SSH 验证有四个步骤，总结如下：\n\n1. 生成公钥和私钥。\n2. 将公钥安装在服务器上。\n\
  3. 测试身份验证。\n4. 在服务器上禁用密码身份验证。\n\n本章的剩余部分将为 Linux、macOS 和基于 Windows 的客户端操作系统详细说明这些步骤。\n\
  \n### 14.4 安装并启动 SSH 服务\n\n如果系统上尚未安装并运行 SSH 服务，可以通过以下命令添加：\n\n```bash\ndnf install\
  \ openssh-server\nsystemctl start sshd.service\nsystemctl enable sshd.service\n\
  ```\n\n### 14.5 从 Linux 和 macOS 客户端进行基于密钥的身份验证\n\n设置基于密钥身份验证的第一步是在客户端系统上生成密钥对。如果客户端系统运行\
  \ Linux 或 macOS，则使用 `ssh-keygen` 工具实现这一点：\n\n```bash\nssh-keygen\n```\n\n这将产生类似下面的输出：\n\
  \n```text\nGenerating public/private rsa key pair.\n\nEnter file in which to save\
  \ the key (/home/<username>/.ssh/id_rsa):\n```\n\n\n\n按下回车键以接受密钥文件的默认位置。这将在当前用户主目录的\
  \ `.ssh` 子目录中放置两个文件。私钥将存储在名为 `id_rsa` 的文件中，而公钥将保存在名为 `id_rsa.pub` 的文件中。\n\n接下来，`ssh-keygen`\
  \ 将提示输入一个短语（passphrase）用以保护私钥。如果提供了短语，私钥将在本地磁盘上进行加密，并在访问远程系统时需要该短语。为了更高的安全，建议使用短语。\n\
  \n输入短语（留空表示不使用短语）：\n\n最后，`ssh-keygen` 工具将生成以下输出，表示密钥已生成：\n\n```\nYour identification\
  \ has been saved in /home/neil/.ssh/id_rsa.\nYour public key has been saved in /home/neil/.ssh/id_rsa.pub.\n\
  \nThe key fingerprint is:\n\nSHA256:FOLGWEEGFIjWnCT5wtTOv5VK4hdimzWghZizUEMYbfo\
  \ <username>@<hostname>\n\nThe key’s randomart image is:\n\n+---[RSA 2048]----+\n\
  |.BB+=+*.. |\n|o+B= * . . |\n|===.. + . |\n|*+ * . . |\n|.++ o S |\n|..E+ * o |\n\
  | o B * |\n| + + |\n| . |\n+----[SHA256]-----+\n```\n\n下一步是将公钥安装到远程服务器系统。可以使用 `ssh-copy-id`\
  \ 工具如下来实现：\n\n```\n$ ssh-copy-id username@remote_hostname\n```\n\n例如：\n\n```\n$\
  \ ssh-copy-id neil@192.168.1.100\n/usr/bin/ssh-copy-id: INFO: Source of key(s) to\
  \ be installed: \"/home/neil/.ssh/id_rsa.pub\"\n/usr/bin/ssh-copy-id: INFO: attempting\
  \ to log in with the new key(s), to filter out any that are already installed\n\
  /usr/bin/ssh-copy-id: INFO: 1 key(s) remain to be installed -- if you are prompted\
  \ now it is to install the new keys\nneil@192.168.1.100’s password:\nNumber of key(s)\
  \ added: 1\n```\n\n现在尝试登录机器，使用：`\"ssh ‘neil@192.168.1.100’\"` 并确保只添加了你想要的密钥。\n\n\
  密钥安装完成后，尝试使用 `ssh` 客户端进行远程登录以测试身份验证工作：\n\n```\n$ ssh -l <username> <hostname>\n\
  ```\n\n如果私钥已加密并用短语保护，在提示时输入该短语以完成身份验证并建立到 Fedora 31 系统的远程访问：\n\n```\nEnter passphrase\
  \ for key ‘/home/neil/.ssh/id_rsa’:\nLast login: Thu Feb 21 13:41:23 2019 from 192.168.1.101\n\
  [neil@demosystem02 ~]$\n```\n\n对服务器上任何需要远程访问的账户重复这些步骤。如果其他客户端系统也需要访问，只需将 `id_rsa`\
  \ 私钥文件复制到其他系统主文件夹的 `.ssh` 子目录中。\n\n按照目前的配置，仍然可以使用安全性较低的密码验证访问远程系统。一旦你验证了基于密钥的身份验证有效，登录远程系统，编辑\
  \ `/etc/ssh/ssh_config` 文件并将 `PasswordAuthentication` 设置为 `no`：\n\n```\nPasswordAuthentication\
  \ no\n```\n\n保存文件并重启 `sshd` 服务：\n\n```bash\n# systemctl restart sshd\n```\n\n从现在起，将仅允许通过基于密钥的身份验证远程访问系统。\n\
  \n### 14.6 管理多个密钥\n\n在客户端系统中存在多个私钥（每个密钥提供对不同服务器的访问）并不罕见。在建立连接时，有多种选项可以选择特定的密钥。例如，可以在启动\
  \ `ssh` 客户端时如下所示指定要使用的私钥文件：\n\n```\n$ ssh -l neilsmyth -i ~/.ssh/id_work\n```\n\n\
  或者，可以使用 `ssh` 客户端配置文件将密钥文件与服务器关联。名为 `config` 的配置文件必须位于用户主目录的 `.ssh` 目录中，并用于配置各种选项，包括私钥文件、使用的默认端口、默认用户以及用于引用服务器的简短别名。以下\
  \ `config` 文件为两个服务器定义了不同的密钥文件，并允许通过别名 `home` 和 `work` 进行引用：\n\n```\nHost work\n\
  \    HostName <hostname>\n    IdentityFile ~/.ssh/id_work\nHost home\n    HostName\
  \ <hostname>\n    IdentityFile ~/.ssh/home\n```\n\n在设置配置文件之前，用户会使用以下命令连接到 `work`：\n\
  \n```\n$ ssh -l neilsmyth -i ~/.ssh/id_work\n```\n\n现在命令可以缩短为：\n```\n$ ssh work\n\
  ```\n\n通过运行以下命令可以找到 `config` 文件选项的完整列表：\n\n```\n$ man ssh_config\n```\n\n### 14.7\
  \ 从 Windows 10 进行基于密钥的身份验证\n\n最近版本的 Windows 10 包含了 OpenSSH 子集，这使得可以在 Windows 10\
  \ 客户端上设置基于密钥的身份验证。在 Windows 系统上，通过按下 `Win+X` 并选择 PowerShell，可以使用与 Linux 和 macOS\
  \ 类似的步骤来设置基于密钥的身份验证。\n\n如果你已经有了现有的密钥，只需将 `id_rsa` 私钥文件复制到其他系统主文件夹的 `.ssh` 子目录中。按照目前的配置，仍然可以使用安全性较低的密码验证访问远程系统。一旦你验证了基于密钥的身份验证有效，登录远程系统，编辑\
  \ `/etc/ssh/ssh_config` 文件并将 `PasswordAuthentication` 设置为 `no`。\n\n在 PowerShell\
  \ 窗口中，使用以下命令测试身份验证工作：\n\n```\n$ ssh -l <username> <hostname>\n```\n\n在 Windows 10\
  \ 客户端上，使用以下命令：\n\n```\nPS C:\\Users\\neil> ssh -l <username> <hostname>\n```\n\n\
  例如：\n\n```\nPS C:\\Users\\neil> ssh -l neil 192.168.1.100\nEnter passphrase for\
  \ key ‘C:\\Users\\neil\\.ssh\\id_rsa’:\n```\n\n在提示时输入短语以完成身份验证。如果不存在私钥，请在 PowerShell\
  \ 窗口中使用 `ssh-keygen` 工具生成新的密钥对。一旦生成了密钥，它们将再次位于主目录的 `.ssh` 目录，并且需要将 Windows 10 系统的公钥文件\
  \ `id_rsa.pub` 安装到 Fedora 31 系统。遗憾的是，Windows PowerShell 不包含 `ssh-copy-id` 工具，因此此任务需要手动执行。\n\
  \n在 PowerShell 窗口中，进入 `.ssh` 目录并显示 `id_rsa.pub` 文件的内容：\n\n```\nPS C:\\Users\\neil>\
  \ cd .ssh\nPS C:\\Users\\neil\\.ssh> type id_rsa.pub\n```\n\n高亮文件内容并使用 `Ctrl-C`\
  \ 快捷键复制。留在 PowerShell 窗口中，使用密码验证登录远程系统：\n\n```\nPS C:\\Users\\neil\\.ssh> ssh -l\
  \ <username> <hostname>\n```\n\n登录后，检查 `.ssh` 子目录是否存在。如果不存在，使用如下命令创建它：\n\n```\n\
  $ mkdir .ssh\n```\n\n进入 `.ssh` 目录并检查是否存在名为 `authorized_keys` 文件。如果不存在，创建它并将来自 Windows\
  \ 10 系统的公钥内容粘贴其中。\n\n如果 `authorized_keys` 文件已存在，它很可能包含了其他密钥。如果是这样，编辑该文件并将新的公钥粘贴在文件末尾。例如，以下文件包含了两个密钥：\n\
  \n\n\n\n\n```text\nssh-rsa \
  \ neil@localhost.localdomain\n\nssh-rsa \
  \ neil@DESKTOP-S8P8D3N\n```\n\n一旦公钥安装在服务器上，请通过从 Windows 10 PowerShell 窗口登录服务器来测试身份验证，例如：\n\
  \n```bash\nPS C:\\Users\\neil\\.ssh> ssh -l neil 192.168.1.100\n```\n\n```\nEnter\
  \ passphrase for key 'C:\\Users\\neil/.ssh/id_rsa':\n```\n\n当所有账户都设置并验证了基于密钥的身份验证后，按照上一节末尾所述，在\
  \ Fedora 31 系统上禁用密码身份验证。\n\n### 14.8 使用 PuTTY 进行 SSH 密钥认证\n\n对于没有提供 OpenSSH 的 Windows\
  \ 系统，或者作为使用 PowerShell 更灵活的替代方案，`PuTTY` 工具是一个被广泛使用的替代方案。使用 `PuTTY` 的第一步是在任何需要 SSH\
  \ 客户端的 Windows 系统上下载并安装它。`PuTTY` 是一个免费的实用程序，可以通过以下链接下载：\n\n[`www.chiark.greenend.org.uk/~sgtatham/putty/latest.html`](https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html)\n\
  \n下载与你的 Windows 系统匹配的 Windows 安装可执行文件（提供 32 位和 64 位版本），然后运行安装程序完成安装。\n\n如果另一个系统上已存在私钥，请在当前用户的家目录中创建\
  \ `.ssh` 文件夹，并将私钥 `id_rsa` 密钥复制其中。\n\n接下来，需要使用 `PuTTYgen` 工具将私钥文件转换为 `PuTTY` 私钥格式文件。在\
  \ Windows 开始菜单中找到此实用程序并启动它：\n\n![](img/windows_puttygen_main.png)\n\n图 14-2\n\n\
  启动后，点击位于 `Actions` 区域的 `Load` 按钮，并导航到之前复制到 `.ssh` 文件夹中的私钥文件（请注意，可能需要将文件类型过滤器改为 `All\
  \ Files (*.*)` 才能看到密钥文件）。找到后，选择该文件并加载到 `PuttyGen` 中。在提示时，输入最初用于加密该文件的短语。导入私钥后，点击\
  \ `Save Private Key` 按钮将其保存为 `PuTTY` 密钥文件。为了一致性，将密钥文件保存到 `.ssh` 文件夹，但赋予它不同的名称以区别于原始密钥文件。\n\
  \n从开始菜单启动 `PuTTY`，在主屏幕上输入远程服务器的 IP 地址或主机名，然后选择左侧面板中的 `Connection -> SSH -> Auth`\
  \ 类别，如[图 14-3]中所示：\n\n![](img/windows_putty_ssh_auth.png)\n\n图 14-3\n\n点击 `Private\
  \ key for authentication` 字段旁边的 `Browse` 按钮，导航并选择之前保存的 `PuTTY` 私钥文件。可选情况下，滚动到左侧面板的顶部，选择\
  \ `Session` 条目，并在点击 `Save` 按钮之前在 `Saved Sessions` 字段中为会话输入名称。这将保存会话配置，以便以后使用而无需重复操作。最后，点击\
  \ `Open` 按钮即可建立连接。\n\n### 14.9 使用 PuTTY 生成私钥\n\n如果 Windows 系统上没有可用的 OpenSSH，或者作为使用\
  \ PowerShell 更灵活的替代方案，`PuTTY` 工具是一个被广泛使用的替代方案。使用 `PuTTY` 的第一步是在任何需要 SSH 客户端的 Windows\
  \ 系统上下载并安装它。`PuTTY` 是一个免费的实用程序，可以通过以下链接下载：\n\n[`www.chiark.greenend.org.uk/~sgtatham/putty/latest.html`](https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html)\n\
  \n下载与你的 Windows 系统匹配的 Windows 安装可执行文件（提供 32 位和 64 位版本），然后运行安装程序完成安装。\n\n如果另一个系统上已存在私钥，请在当前用户的家目录中创建\
  \ `.ssh` 文件夹，并将私钥 `id_rsa` 密钥复制其中。\n\n接下来，需要使用 `PuTTYgen` 工具将私钥文件转换为 `PuTTY` 私钥格式文件。在\
  \ Windows 开始菜单中找到此实用程序并启动它：\n\n![](img/windows_puttygen_main.png)\n\n图 14-2\n\n\
  启动后，点击位于 `Actions` 区域的 `Load` 按钮，并导航到之前复制到 `.ssh` 文件夹中的私钥文件（请注意，可能需要将文件类型过滤器改为 `All\
  \ Files (*.*)` 才能看到密钥文件）。找到后，选择该文件并加载到 `PuttyGen` 中。在提示时，输入最初用于加密该文件的短语。导入私钥后，点击\
  \ `Save Private Key` 按钮将其保存为 `PuTTY` 密钥文件。为了一致性，将密钥文件保存到 `.ssh` 文件夹，但赋予它不同的名称以区别于原始密钥文件。\n\
  \n从开始菜单启动 `PuTTY`，在主屏幕上输入远程服务器的 IP 地址或主机名，然后选择左侧面板中的 `Connection -> SSH -> Auth`\
  \ 类别，如[图 14-3]中所示：\n\n![](img/windows_putty_ssh_auth.png)\n\n图 14-3\n\n点击 `Private\
  \ key for authentication` 字段旁边的 `Browse` 按钮，导航并选择之前保存的 `PuTTY` 私钥文件。可选情况下，滚动到左侧面板的顶部，选择\
  \ `Session` 条目，并在点击 `Save` 按钮之前在 `Saved Sessions` 字段中为会话输入名称。这将保存会话配置，以便以后使用而无需重复操作。最后，点击\
  \ `Open` 按钮即可建立连接。\n\n### 14.10 为 Google Cloud 安装公钥\n\n如果你的 Fedora 31 系统托管在 Google\
  \ Cloud 上，例如 Compute Engine 实例，有多种使用元数据进行 SSH 的方法。要添加公钥，登录 Google Cloud 控制台，选择左侧导航中的\
  \ `Metadata` 选项，如图 14-5 所示：\n\n![](img/google_cloud_key_list.png)\n\n图 14-5\n\n\
  在 `SSH Keys` 屏幕上，点击 `Edit` 按钮进行编辑。滚动到底部并点击 `+ Add Item` 按钮。将出现一个新字段，你需要在其中粘贴 `id_rsa.pub`\
  \ 文件中的完整公钥。输入密钥后，点击 `Save` 按钮。\n\n公钥出现在 `SSH Keys` 列表中。注意密钥条目还包括登录任何虚拟机时必须使用的用户名：\n\
  \n![](img/google_cloud_key_added.png)\n\n图 14-6\n\n一旦公钥添加到元数据，就可以从任何安装了相应私钥的客户端访问虚拟机。\n\
  \n事实上，Google Cloud 在此方面所做的所有工作是将公钥添加到虚拟机用户家目录下的 `.ssh/authorized_keys` 文件中。\n\n\
  ### 14.11 总结\n\n确保对 Fedora 31 系统的任何远程访问都以高安全级别的方式是非常重要的。默认情况下，Fedora 31 系统允许使用密码身份验证进行\
  \ SSH 访问。这使得系统容易受到通过猜解密码或其他方式获取密码的影响。因此，建议使用基于密钥的认证来保护系统访问。密钥认证使用了涉及公钥和私钥的公钥加密概念。实施后，用户只有在使用与服务器上公钥匹配的私钥时才能连接服务器。作为额外的安全层，私钥也可以进行加密和密码保护。一旦实施了密钥加密，服务器系统将配置为禁用这种不安全的密码身份认证。\n\
  \n本章概述了 SSH 密钥认证，并概述了在 macOS、Linux 和 Windows 上生成密钥和配置客户端的步骤，以及在 Fedora 31 服务器上安装和管理公钥。\n\
  \n## 15\\. 使用 VNC 进行 Fedora 31 远程桌面访问\n\n\n\n\nFedora 31 可以配置为通过网络或互联网连接提供图形化桌面环境的远程访问。虽然默认未启用，但从网络或互联网上的任何其他系统显示并访问\
  \ Fedora 31 桌面是相对直接的。无论该系统运行的是 Linux、Windows 还是 macOS，都可以实现这一目标。事实上，Android 和 iOS\
  \ 上甚至也有可用的应用程序，可以让你从几乎任何有数据信号的地方访问你的 Fedora 31 桌面。\n\n远程桌面访问在许多场景下都非常有用。例如，它允许你或其他人从同一网络或通过互联网上的另一台计算机系统查看并与你的\
  \ Fedora 31 桌面环境进行交互。当你离开座位（例如旅行期间）需要使用电脑工作时，这非常有用。当同事或 IT 支持人员需要访问你的桌面来解决问题时，它也很有用。\n\
  \n在 Fedora 31 系统运行在云服务器上的情况下，它还允许访问桌面环境，作为使用命令行提示符或 `Cockpit` Web 控制台执行管理任务的替代方案。\n\
  \nFedora 31 的远程桌面功能基于称为虚拟网络计算（VNC）的技术，在本章中，我们将涵盖在 Fedora 31 中配置和使用远程桌面的关键方面。\n\n\
  ### 15.1 安全与不安全的远程桌面访问\n\n在本章中，我们将涵盖安全和不安全的远程桌面访问方法。假设你是在安全内部网络的环境下从一个系统访问另一个系统，那么通常使用不安全的访问方法是安全的。另一方面，如果你计划通过任何种类的公共网络远程访问桌面，则必须使用安全的访问方法，以避免你的系统和数据受到损害。\n\
  \n### 15.2 安装 GNOME 桌面环境\n\n当然，只有在安装了桌面本身的情况下，才可能访问桌面环境。例如，如果系统最初配置为服务器，那么很可能没有安装桌面包。运行\
  \ GNOME 桌面所需的软件包，最简单的方法是执行组安装（group install）。安装软件包包组以启用特定功能的关键在于知道组的名称。在编写本文时，Fedora\
  \ 31 上安装桌面环境的组名为“Fedora Workstation”。由于组名称倾向于在不同的 Fedora 版本之间发生变化，因此使用 `dnf` 工具按照如下方式获取已安装或可安装的组列表是有用的：\n\
  \n```bash\ndnf grouplist\n```\n\n可用的环境组：\n- Fedora 自定义操作系统\n- 最小安装 (Minimal Install)\n\
  - Fedora Workstation\n- Fedora 云服务器\n- KDE Plasma 工作空间\n- Xfce 桌面\n- LXDE 桌面\n-\
  \ LXQt 桌面\n- Cinnamon 桌面\n- MATE 桌面\n- Sugar 桌面环境\n- Deepin 桌面\n- 开发与创意工作站\n- Web\
  \ 服务器\n- 基础设施服务器\n- 基础桌面\n\n在上面的示例中，Fedora Workstation 环境组列为可用（因此尚未安装）。若要在安装前获取有关组内容的更多信息，请使用以下命令：\n\
  \n```bash\ndnf groupinfo \"fedora workstation\"\n```\n\n最后元数据过期检查：2020 年 1 月 2 日周四上午\
  \ 10:59:36 EST， 18 分钟前。\n环境组：Fedora Workstation\n描述：Fedora Workstation 是一个适用于笔记本电脑和\
  \ PC 的友好桌面系统。\n强制组：\n- 通用 NetworkManager 子模块\n- 容器管理\n- Core\n- Fedora Workstation\
  \ 产品核心\n- Firefox 浏览器\n- 字体\n- GNOME\n- 访客桌面代理\n- 硬件支持\n- LibreOffice\n- 多媒体\n-\
  \ 打印支持\n- base-x\n\n可选组：\n- ARM 工具\n\n确认是正确的组后，可以按照如下方式安装：\n\n```bash\ndnf groupinstall\
  \ \"fedora workstation\"\n```\n\n安装完成后，并假设系统已添加了显示器，可以使用以下命令启动桌面：\n\n```bash\nstartx\n\
  ```\n\n相反，如果系统是没有直接连接显示器的服务器，运行和访问桌面的唯一方法将是在系统上配置 VNC 支持。\n\n### 15.3 在 Fedora 31\
  \ 上安装 VNC\n\n访问远程桌面需要在远程系统上安装 VNC 服务器，在建立访问的系统上安装 VNC 查看器，并且可选需要一个安全的 SSH 连接。虽然有多种\
  \ VNC 服务器和查看器实现，但 Fedora 已经统一采用 TigerVNC，它为基于 Linux 的操作系统提供了服务器端和查看器组件。非 Linux 平台的\
  \ VNC 查看器客户端包括 RealVNC 和 TightVNC。\n\n要在 Fedora 31 上安装 TigerVNC 服务器包，只需运行以下命令：\n\
  \n```bash\ndnf install tigervnc-server\n```\n\n如果需要，也可以按照如下方式安装 TigerVNC 查看器：\n\n\
  ```bash\ndnf install tigervnc\n```\n\n服务器安装完成后，系统需要配置为运行一个或多个 VNC 服务，并在防火墙上打开相应的端口。\n\
  \n### 15.4 配置 VNC 服务器\n\n安装 VNC 服务器包后，下一步是配置服务器。第一步是为访问远程桌面环境的用户指定密码。以 root 身份登录时，执行以下命令（假设用户名为\
  \ demo）：\n\n```bash\nsu - demo\n[demo@demoserver ~]$ vncpasswd\nPassword:\nVerify:\n\
  您想输入一个只读密码吗 (y/n)? n\n不使用只读密码\n[demo@demoserver ~]$ exit\n```\n\n接下来，需要在 `/etc/systemd/system`\
  \ 目录下创建一个名为 `vncserver@.service` 的 VNC 服务器配置文件。该文件的内容如下，其中所有的 `<USER>` 替换为用户名：\n\
  \n```ini\n[Unit]\nDescription=远程桌面服务 (VNC)\nAfter=syslog.target network.target\n\
  \n[Service]\nType=forking\nWorkingDirectory=/home/<USER>\nUser=<USER>\nGroup=<USER>\n\
  ExecStartPre=/bin/sh -c '/usr/bin/vncserver -kill %i > /dev/null 2>&1 || :'\nExecStart=/usr/bin/vncserver\
  \ -autokill %i\nExecStop=/usr/bin/vncserver -kill %i\nRestart=on-success\nRestartSec=15\n\
  \n[Install]\nWantedBy=multi-user.target\n```\n\n接下来，需要配置防火墙以允许外部访问 VNC 服务器，例如：\n\
  \n```bash\nfirewall-cmd --permanent --zone=public --add-port=5901/tcp\nfirewall-cmd\
  \ --reload\n```\n\n服务配置完成后，需要如下所示启用并启动服务：\n\n```bash\nsystemctl daemon-reload\n\
  systemctl start vncserver@:1.service\nsystemctl enable vncserver@:1.service\n```\n\
  \n注意服务名中的 `:1` 表示这是显示器 1 的服务。这与之前在防火墙中打开的端口 5901 相匹配。\n\n如下所示检查服务是否成功启动：\n\n```bash\n\
  systemctl status vncserver@:1.service\n```\n\n如果服务启动失败，运行以下命令检查错误信息：\n\n```bash\n\
  journalctl -xe\n```\n\n同时在重启系统后再次尝试。如果服务持续失败，可以通过登录指定用户并运行以下命令手动启动 VNC 服务器：\n\n\
  ```bash\nvncserver :1\n```\n\n### 15.5 连接到 VNC 服务器\n\n各种操作系统都有 VNC 查看器实现，快速搜索互联网可能会提供许多有关如何在所选平台上获取和安装此工具的详细链接。\n\
  \n在安装了 TigerVNC 等 VNC 查看器的 Linux 系统桌面上，可以从终端窗口如下所示建立远程桌面连接：\n\n```bash\nvncviewer\
  \ <hostname>:<display number>\n```\n\n\n\n在上面的示例中，`<hostname>` 是远程系统的主机名或 IP 地址，`<display\
  \ number>` 是 VNC 服务器桌面的显示数字，例如：\n\n```\n$ vncviewer 192.168.1.115:1\n```\n\n或者，在不带任何选项的情况下运行命令，以提示你输入远程服务器的详情：\n\
  \n![](img/rhel_8_vnc_viewer.png)\n\n图 15-1\n\n在 VNC 服务器字段中输入主机名或 IP 地址，后跟显示数字（例如\
  \ `192.168.1.115:1`），然后点击“连接”（Connect）按钮。查看器将提示输入用户的 VNC 密码以完成连接，此时将出现一个包含远程桌面的新窗口。\n\
  \n本节假设是从 Linux 或 UNIX 系统访问远程桌面，相同的步骤也适用于大多数其他操作系统。\n\n使用本节中列出的的步骤连接到远程 VNC 服务器将导致客户端和服务器之间建立不安全的、未加密的连接。这意味着在远程会话期间传输的数据极易被拦截。要建立安全且加密的连接，需要额外的几个步骤。\n\
  \n### 15.6 建立安全的远程桌面会话\n\n在本章中为止探索的远程桌面配置被认为是不安全的，因为没有使用加密。当远程连接不需要到防火墙保护的内部网络之外时，这是可以的。然而，当需要在互联网连接上进行远程会话时，就需要更安全的选项。这通过安全外壳（SSH）连接隧道远程桌面来实现。本节将介绍如何在\
  \ Linux、UNIX 和 macOS 客户端系统上执行此操作。\n\nFedora 31 系统通常默认安装并激活了 SSH 服务器。如果你的系统上不是如此，请参阅标题为“在\
  \ Fedora 31 上配置基于密钥的身份验证”的章节。\n\n假设 SSH 服务器已安装并激活，是时候到另一个系统了。在另一个系统上，使用以下命令登录远程系统，这将在两个系统之间建立安全隧道：\n\
  \n```\n$ ssh -l <username> -L 5901:localhost:5901 <remotehost>\n```\n\n在上面的示例中，`<username>`\
  \ 指向远程系统上配置了 VNC 访问的用户账户，`<remotehost>` 是远程系统的主机名或 IP 地址，例如：\n\n```\n$ ssh -l neilsmyth\
  \ -L 5901:localhost:5901 192.168.1.115\n```\n\n在提示时，使用账户密码登录。建立安全连接后，是时候启动 `vncviewer`\
  \ 以使其使用安全隧道。在另一个终端窗口中保持 SSH 会话运行，启动另一个终端并输入以下命令：\n\n```\n$ vncviewer localhost:5901\n\
  ```\n\n如果需要密码，`vncviewer` 会话将提示输入密码，然后启动 VNC 查看器，为你的桌面环境提供安全访问。\n\n尽管连接现在是安全且加密的，但\
  \ VNC 查看器可能仍会报告连接是不安全的。例如，图 15-2 显示了运行在 macOS 系统上的 RealVNC 查看器显示的警告对话框：\n\n![](img/rhel_8_vnc_viewer_not_encrypted.png)\n\
  \n图 15-2\n\n遗憾的是，尽管连接现在是安全的，但 VNC 查看器软件无法知晓这一点，并继续发出警告。请放心，只要使用 SSH 隧道，连接确实是安全的。\n\
  \n在上面的示例中，我们将 SSH 隧道会话留在了终端窗口中运行。如果你希望在后台运行会话，可以通过启动连接时使用 `-f` 和 `-N` 标志来实现：\n\n\
  ```\n$ ssh -l <username> -f -N -L 5901:localhost:5901 <remotehost>\n```\n\n上述命令将提示输入远程服务器的密码，然后在后台建立连接，留出终端窗口供其他任务使用。\n\
  \n如果你是从防火墙外连接到远程桌面，请记住 SSH 连接的 IP 地址将是你的 ISP 或云托管提供商提供的外部 IP 地址，而不是远程系统的 LAN IP\
  \ 地址（因为该 IP 地址对于防火墙外的人来说是不可见的）。你还需要配置防火墙，将端口 `22`（用于 SSH 连接）转发到运行桌面的系统 IP 地址。没有必要转发端口\
  \ `5900`。执行端口转发的步骤在不同防火墙之间有所不同，请参考你的防火墙、路由器或无线基站的文档以获取针对你配置的细节。\n\n### 15.7 使用 PuTTY\
  \ 在 Windows 上建立安全隧道\n\n从 Windows 系统到 Fedora 31 服务器建立安全桌面会话也采用了类似的方法。假设你已经安装了如 `TightVNC`\
  \ 等 VNC 客户端，剩下的唯一要求是 Windows SSH 客户端（在这种情况下为 `PuTTY`）。\n\n一旦下载并安装了 `PuTTY`，第一步是配置适当的隧道，在\
  \ Windows 系统和远程 Fedora 31 系统之间建立安全连接。启动 `PuTTY` 时，它会显示以下屏幕：\n\n![](img/rhel_8_vnc_putty_main.png)\n\
  \n图 15-3\n\n输入远程主机的 IP 地址或主机名（如果从防火墙外连接，输入外部 IP 地址）。下一步是设置隧道。点击左侧分类树中的 `SSH` 旁的\
  \ `+` 号，然后点击 `Tunnels`。随后应出现：\n\n![](img/rhel_8_vnc_putty_tunnels.png)\n\n图 15-4\n\
  \n输入 `5901` 作为源端口，`localhost:5901` 作为目的地并点击 `Add` 按钮。最后通过点击 `Session` 返回主界面。在 `Saved\
  \ Sessions` 字段中为会话输入名称并按 `Save`。点击 `Open` 建立连接。终端窗口将出现远程系统的登录提示。输入相应的用户登录和密码。\n\n\
  SSH 连接已建立。启动 `TightVNC` 查看器并在 VNC Server 字段输入 `localhost:5901` 然后点击 `Connect`。查看器将建立连接、提示密码并显示桌面。你现在通过\
  \ SSH 隧道从 Windows 访问 Linux 桌面。\n\n### 15.8 关闭桌面会话\n\n要关闭 VNC 服务器托管的桌面会话，请使用 `vncserver\
  \ -kill` 命令结合终止的桌面数字。例如，杀死桌面 `:1`：\n\n```\n# vncserver -kill :1\n```\n\n## 15.9\
  \ 连接 NC 连接\n\n由于后台有很多操作，VNC 有时看起来很模糊，特别是当出现问题无法启动或远程尝试产生错误消息时。然而，有很多技术可以跟踪并解决 VNC\
  \ 问题：\n\n如果 VNC 服务启动失败，检查服务的 `systemctl status` 并检查错误消息：\n\n```\n# systemctl status\
  \ vncserver@:1.service\n```\n\n要获取更详细的信息，通过运行以下命令检查 systemd 日志：\n\n```\n# journalctl\
  \ -xe\n```\n\n额外信息可能位于以下位置的日志文件中：\n\n`/home/<username>/.vnc/<hostname>.<domain>:<display\
  \ number>.log`\n\n例如：\n\n`/home/neilsmyth/.vnc/fedoraserver01.localdomain:1.log`\n\
  \n如果 systemd VNC 服务仍然无法启动 VNC 服务器，尝试使用以下命令手动启动：\n\n```\n# vncserver :<display number>\n\
  ```\n\n例如：\n\n```\n# vncserver :1\n```\n\n检查输出和日志文件，是否有任何有助于识别问题的错误。如果服务器成功启动，请尝试使用\
  \ VNC 查看器重新连接。\n\n\n\n\n如果 VNC 服务器似乎正在运行，但从查看器尝试连接时失败，可能需要检查是否打开了正确的防火墙端口。首先通过以下方式识别默认区域：\n\
  \n```bash\nfirewall-cmd --get-default-zone\n```\n\npublic\n\n获取默认区域后，检查必要的端口已打开：\n\
  \n```bash\nfirewall-cmd --permanent --zone=public --list-ports\n```\n\n5901/tcp\
  \ 5900/tcp\n\n如果 VNC 使用的端口未打开，请按照以下方式添加端口：\n\n```bash\nfirewall-cmd --permanent\
  \ --zone=public --add-port=<port number>/tcp\n```\n\n### 15.1 总结\n\n通过使用虚拟网络计算（VNC），可以对\
  \ Fedora 31 系统的 GNOME 桌面环境进行远程访问。VNC 由运行在远程服务器上的 VNC 服务器和本地主机上相应的客户端组成，它允许远程访问服务器上运行的多个桌面实例。\n\
  \n当在公共连接上使用 VNC 连接时，建议使用 SSH 隧道，以确保客户端和服务器之间的通信是加密且安全的。\n\n# 16 远程显示 Fedora 31 应用程序（X11\
  \ 转发）\n\n在上一章中，我们查看了如何在远程计算机上显示整个 Fedora 31 桌面。虽然当你实际上需要远程显示整个桌面时这种方法效果良好，但如果你只想显示单个应用程序，这可能就大材小用了。因此，在本章中，我们将查看如何在远程系统上显示单个应用程序。\n\
  \n### 16.1 远程显示 Fedora 31 应用程序的要求\n\n为了在一个 Fedora 31 系统上运行应用程序并使其在另一个系统中显示，有几个前提条件。首先，显示应用程序的系统必须运行\
  \ X 服务器。如果该系统是运行桌面环境的 Linux 或类 Unix 系统，则没有问题。但如果系统运行的是 Windows 或 macOS，则你必须在从远程系统显示应用程序之前对其安装\
  \ X 服务器。为此有许多商业和免费的基于 Windows 的 X 服务器供选择，通过网络搜索可以提供选项列表。\n\n其次，运行应用程序的系统（而不是显示应用程序的系统）必须配置为允许\
  \ SSH 访问。在 Fedora 31 系统上配置 SSH 的细节可以参阅标题为“在 Fedora 31 上配置基于密钥的身份验证”的章节。该系统还必须运行来自\
  \ X.org 的 X Window 系统而不是 Wayland。要确定使用的是哪种系统，打开终端窗口并运行以下命令：\n\n```bash\necho $XDG_SESSION_TYPE\n\
  ```\n\nx11\n\n如果上述命令输出为“wayland”而不是“x11”，请编辑 `/etc/gdm/custom.conf` 文件并按如下所示取消 `WaylandEnable`\
  \ 行的注释并重启系统：\n\n```bash\n# 取消下面行的注释以强制登录界面使用 Xorg\nWaylandEnable=false\n```\n\n\
  最后，必须配置 SSH 以允许 X11 转发。这是通过在发生转发的系统的 SSH 配置中添加以下指令来实现的。在 Fedora 31 默认情况下，`/etc/ssh_config`\
  \ 文件包含一个包含 `/etc/ssh/ssh_config.d` 目录下所有配置文件的指令：\n\n```text\nInclude /etc/ssh/ssh_config.d/*.conf\n\
  ```\n\n在新安装的系统中，`/etc/ssh/ssh_config.d` 目录内的唯一文件名为为 `05-redhat.conf`。编辑此文件并添加一行以启用\
  \ X11 转发，如下：\n\n```text\nHost *\n      GSSAPIAuthentication yes\n      X11Forwarding\
  \ yes\n```\n\n进行更改后，保存文件并重启 SSH 服务：\n\n```bash\nsystemctl restart sshd\n```\n\n\
  一旦满足上述要求，就就可以远程显示基于 X 的桌面应用程序了。\n\n### 16.2 远程显示 Fedora 31 应用程序\n\n远程显示应用程序的第一步是移动到显示应用程序的系统。在该系统中，建立到远程系统的\
  \ SSH 连接以获得命令行提示符。这可以使用 `ssh` 命令实现。当使用 `ssh` 命令时，我们需要使用 `-X` 标记来告诉它我们计划通过连接隧道 X11\
  \ 流量：\n\n```bash\nssh -X user@hostname\n```\n\n在上面的示例中，`user` 是用于登录远程系统的用户名，`hostname`\
  \ 是远程系统的主机名或 IP 地址。在登录提示符处输入密码，登录成功后，运行以下命令查看 `DISPLAY` 设置：\n\n```bash\necho $DISPLAY\n\
  ```\n\n该命令的输出应该类似于以下内容：\n\n```text\nlocalhost:10.0\n```\n\n要显示应用程序，只需从命令行提示符运行它。例如：\n\
  \n```bash\ngedit\n```\n\n执行上述命令时，该命令将在远程系统上运行 `gedit` 工具，但在本地系统上显示用户界面。\n\n### 16.3\
  \ 可信 X11 转发\n\n如果远程系统上的 `/etc/ssh/ssh_config.d/05-redhat.conf` 文件包含以下行，则可以使用可信的\
  \ X11 转发：\n\n```text\nForwardX11Trusted yes\n```\n\n可信 X11 转发比不可信转发快一点，但安全性较低，因为它不启用\
  \ X11 安全控制。使用可信 X11 转发时需要 `-Y` ：\n\n```bash\nssh -Y user@hostname\n```\n\n### 16.4\
  \ 压缩 X11 转发\n\n在使用较慢连接时，可以使用 `-C` 标记压缩 X11 数据以提高性能：\n\n```bash\nssh -C user@hostname\n\
  ```\n\n### 16.5 在 Windows 上显示远程 Fedora 31 应用\n\n要在 Windows 上显示 Fedora 31 应用，需要在\
  \ Windows 上安装 SSH 客户端和 X 服务器。PuTTY 的安装和使用已在之前的在 Fedora 31 上配置基于密钥的身份验证章节中介绍。如果你尚未安装\
  \ PuTTY，请参阅该章节。至于 X 服务器，有很多选项，但受欢迎的选择是 VcXsrv，可以通过以下 URL 免费获取：\n\n`https://sourceforge.net/projects/vcxsrv/`\n\
  \n一旦安装了 VcXsrv X 服务器，桌面和开始菜单会出现一个名为 XLaunch 的应用程序。启动 XLaunch 并选择显示选项（最灵活的是 Multiple\
  \ windows，允许每个客户端应用出现在自己的窗口中）：\n\n![image/win_10_configure_windows_x_server.png](img/16-1)\n\
  \n点击 Next 按钮继续剩余屏幕。在最后一个屏幕上，点击 Finish 按钮启动 X 服务器。如果出现 Windows Defender 对话框，点击按钮允许所选网络。\n\
  \n运行后，XLaunch 将出现在任务栏中，可以通过右键点击图标并选择 Exit... 菜单进行退出：\n\n![image/win_10_x_server_running.png](img/16-2)\n\
  \n安装并运行 X 服务器后，启动 PuTTY 并输入远程主机的连接信息或加载之前保存的会话配置。但在建立连接之前，需要启用 X11 转发。在 PuTTY 主窗口中，向下滚动左面板中的选项，展开\
  \ SSH 部分并选择 X11 选项，如图 16-3 所示：\n\n![image/win_10_putty_ssh.png](img/16-3)\n\n开启图\
  \ 16-4 中高亮显示的 Enable X11 forwarding 复选框，返回会话屏幕并打开连接（如果计划再次使用，请先保存会话）。\n\n![image/win_10_putty_X11_settings.png](img/16-4)\n\
  \n\n\n在 `PuTTY` 会话窗口中登录 Fedora 31 系统并运行一个桌面应用。稍等后，该应用将以其自身的窗口出现在 Windows 桌面上。应用打开的任何对话框也会出现在独立的窗口中，就就像它们在\
  \ Fedora 31 GNOME 面上显示一样。例如，图 16-5 显示了在 Windows 10 系统上显示的 Fedora 31 `nm-connection-editor`\
  \ 工具：\n\n![](img/win_10_xserver_app_displayed.png)\n\n图 16-5\n\n### 16.6 总结\n\n\
  对于需要远程访问单个 Fedora 31 桌面应用程序而非整个 GNOME 桌面的情况，X11 转发为远程显示图形化应用程序提供了一个轻量级解决方案。用于显示应用程序的系统必须运行基于\
  \ X Window 系统的桌面环境（如 GNOME），或者安装并运行了 X 服务器。一旦在远程服务器上启用了 X11 转发，并从本地系统使用 X11 转发选项建立了安全的\
  \ SSH 连接，大多数应用程序就可以在本地 X 服务器上远程显示。\n\n## 17. 使用 NFS 与远程系统共享 Fedora 31 文件\n\nFedora\
  \ 31 提供了两种与网络上的其他系统共享文件和文件夹的机制。一种是使用名为 `Samba` 的技术。Samba 基于 Microsoft Windows 文件夹共享，允许\
  \ Linux 系统让 Windows 系统可以访问文件夹，并允许从 Linux 访问 Windows 的文件夹共享。这种方法也可以用于在其他 Linux 和\
  \ UNIX 系统之间共享文件夹，只要它们也安装并配置了 Samba 支持。这目前是异构网络环境中共享文件夹最流行的方法。使用 Samba 共享文件夹的主题在“使用\
  \ Samba 在 Fedora 31 和 Windows 系统之间共享文件” 中有所介绍。\n\n另一个专门针对 Linux 和 UNIX 系统之间共享文件夹的选项使用了名为网络文件系统\
  \ (NFS) 的技术。NFS 允许另一台 Linux 或 UNIX 系统通过网络连接访问一台 Linux 计算机上的文件系统。NFS 最初由太阳微系统公司（现为\
  \ Oracle 公司的一部分）于 20 世纪 80 年代开发，至今仍然是远程 Linux/UNIX 文件系统共享的标准机制。\n\nNFS 与 Samba 使用的\
  \ Windows SMB 资源共享技术非常不同。在本章中，我们将研究使用 NFS 在 Fedora 31 与其他 UNIX/Linux 系统之间基于网络的文件夹共享。\n\
  \n### 17.1 确保 Fedora 31 上的 NFS 服务运行\n\n首要任务是验证你的 Fedora 31 系统上是否安装并运行了 NFS 服务。可以通过命令行或使用\
  \ `Cockpit` 界面来实现。\n\n在后台，NFS 使用远程过程调用 (RPC) 以 `rpcbind` 服务的形式在不同计算机之间通过网络共享文件系统。首先，通过通过在终端窗口中运行以下命令来安装\
  \ `rpcbind` 和 `NFS` 服务：\n\n```bash\ndnf install rpcbind nfs-utils\n```\n\n接下来，配置这些服务以便它们在启动时自动启动：\n\
  \n```bash\nsystemctl enable rpcbind\nsystemctl enable nfs-server\n```\n\n一旦启用了服务，按照如下方式启动它们：\n\
  \n```bash\nsystemctl start rpcbind\nsystemctl start nfs-server\n```\n\n### 17.2\
  \ 配置 Fedora 31 火墙允许 NFS 流量\n\n接下来，需要配置防火墙以允许 NFS 流量。为了实现这一点，运行以下 `firewall-cmd`\
  \ 命令，并将 `<zone>` 替换为适用于你的防火墙和系统的配置区域：\n\n```bash\nfirewall-cmd --zone=<zone> --permanent\
  \ --add-service=mountd\nfirewall-cmd --zone=<zone> --permanent --add-service=nfs\n\
  firewall-cmd --zone=<zone> --permanent --add-service=rpc-bind\nfirewall-cmd --reload\n\
  ```\n\n### 17.3 指定要共享的文件夹\n\n现在 NFS 已经运行且防火墙已配置完成，我们需要指定远程 Linux 或 UNIX 系统可以访问 Fedora\
  \ 31 文件系统的哪些部分。这些设置可以在 `/etc/exports` 文件中声明，需要修改该文件以导出目录以便通过 NFS 进行远程访问。该文件中导出行（export\
  \ line）的语法如下：\n\n`<export> <host1>(<options>) <host2>(<options>)...`\n\n在上述行中，`<export>`\
  \ 被替换为要导出的目录，`<host1>` 是被授予访问权限的系统名称或 IP 地址，`<options>` 代表对该访问施加的限制（只读、读写等）。如果需要，可以在同一行中放置多个主机和选项项。例如，下行向\
  \ IP 地址为 `192.168.2.38` 的主机授予 `/datafiles` 目录的只读权限：\n\n```text\n/datafiles 192.168.2.38(ro)\n\
  ```\n\n允许使用通配符将导出应用到多个主机。例如，下行允许所有外部主机对 `/home/demo` 进行读写访问：\n\n```text\n/home/demo\
  \ *(rw)\n```\n\n通过阅读 exports 帮助页可以找到 exports 文件支持的所有选项列表：\n\n```bash\nman exports\n\
  ```\n\n出于本章的目的，我们将如下配置 `/etc/exports` 文件：\n\n```text\n/tmp *(rw)\n/vol1 192.168.2.21(ro)\n\
  ```\n\n配置完成后，需要使用 `exportfs` 命令更新由 NFS 远程访问的导出文件系统表：\n\n```bash\nexportfs -a\n```\n\
  \n也可以使用 `exportfs` 查看当前的导出设置：\n\n```bash\nexportfs\n```\n上述命令将生成以下输出：\n\n```text\n\
  /tmp\n/vol1\n```\n\n### 17.4 访问共享的 Fedora 31 文件夹\n\n可以通过手动从命令行从客户端系统挂载共享文件夹。在尝试挂载远程文件夹之前，应先在客户端系统上安装\
  \ `nfs-utils` 包：\n\n```bash\ndnf install nfs-utils\n```\n\n要从命令行挂载远程文件夹，打开终端窗口并在你想挂载远程文件夹的地方创建一个：\n\
  \n```bash\nmkdir /home/demo/tmp\n```\n\n接下来，使用远程服务器的 IP 地址或主机名输入挂载远程文件夹的命令，例如：\n\
  \n```bash\nmount -t nfs 192.168.1.115:/tmp /home/demo/tmp\n```\n\n远程 `/tmp` 文件夹将被挂载到本地系统。挂载后，`/home/demo/tmp`\
  \ 文件夹将包含远程的内容。\n\n挂载远程 NFS 文件系统也可以指定选项。例如，以下命令挂载相同的文件夹，但将其配置为只读：\n\n```bash\nmount\
  \ -t nfs -o ro 192.168.1.115:/tmp /home/demo/tmp\n```\n\n### 17.5 在系统启动时挂载 NFS 文件系统\n\
  \n也可以通过编辑 `/etc/fstab` 文件，配置 Fedora 31 系统在每次启动时自动挂载远程文件系统。加载到编辑器后，它可能类似于如下：\n\n\
  ```text\n/dev/mapper/fedora_localhost--live-root / xfs defaults 0 0\nUUID=4b7174c5-8250-400f-b5dd-1a52b2cdf4a3\
  \ /boot xfs defaults 0 0\n/dev/mapper/fedora_localhost--live-swap none swap defaults\
  \ 0 0\n```\n\n例如，为了将位于 IP 地址 `192.168.1.115` 的系统上的 `/tmp` 文件夹挂载到本地路径 `/home/demo/tmp`注意此文件夹必须已存在），请向\
  \ `/etc/fstab` 文件添加以下行：\n\n```text\n192.168.1.115:/tmp /home/demo/tmp nfs rw 0 0\n\
  ```\n\n下次重启系统时，远程系统上的 `/tmp` 文件夹将挂载到本地 `/home/demo/tmp` 挂载点。此时，远程文件夹中的所有文件都可以像位于本地硬盘驱动器上一样被访问。\n\
  \n### 17.6 卸载 NFS 挂载点\n\n\n\n\n一旦使用 `NFS` 挂载了远程文件系统，就可以使用 `umount` 命令并将本地挂载点作为命令行参数来将其卸载。例如，以下命令将卸载我们的示例文件系统挂载点：\n\
  \n```bash\numount /home/demo/tmp\n```\n\n## 17.7 在 Cockpit 中访问 NFS 文件系统\n\n除了使用命令行在客户端上挂载远程\
  \ NFS 文件系统外，也可以在 Cockpit Web 界面内执行挂载操作。假设 Cockpit 已经在客户端系统上安装并配置妥当，请从 Web 浏览器中登录\
  \ Cockpit 界面，并从左侧导航面板选择 `Storage`（存储）选项。如果没有列出 `Storage` 选项，则需要安装 `cockpit-storaged`\
  \ 软件包并按照如下方式重启 cockpit 服务：\n\n```bash\ndnf install cockpit-storaged\nsystemctl restart\
  \ cockpit.socket\n```\n\n一旦 Cockpit 服务重启完成，重新登录 Cockpit 界面，此时 `Storage` 选项应该是可见的。\n\
  \n选择该选项后，主存储页面将包含一个列出所有当前挂载的 NFS 文件系统的部分，如图 17-1 所示：\n\n![](img/fedora_cockpit_nfs_mounts.png)\n\
  图 17-1\n\n要挂载远程文件系统，点击上方高亮的“+”按钮，并在生成的对话框中输入远程 NFS 服务器和文件系统共享的信息，以及本地挂载点和任何必要的选项，然后点击\
  \ `Add`（添加）按钮：\n\n![](img/fedora_cockpit_new_nfs_mount.png)\n图 17-2\n\n要修改、卸载或删除\
  \ NFS 文件系统共享，请在 NFS 挂载列表中选择相应的挂载项（见上方图 17-1），以显示下方图 17-3 所示的页面：\n\n![](img/fedora_cockpit_nfs_modify_mount.png)\n\
  \n图 17-3\n\n在此屏幕内执行各项任务，如更改服务器或挂载点，或卸载文件系统。`Remove`（移除）选项会卸载文件系统并从 `/etc/fstab`\
  \ 文件中删除该条目，因此在下次系统重启时不会重新挂载。\n\n### 17.8 总结\n\n网络文件系统 (`NFS`) 是一种基于客户端/服务器的系统，最初由\
  \ Sun Microsystems 开发，为 Linux 和 Unix 系统提供了通过网络共享文件系统的方法。`NFS` 允许客户端系统访问（在权限允许的情况下）修改位于远程服务器上的文件，就好像这些文件存储在本地文件系统上一样。本章提供了\
  \ `NFS` 的概述，并概述了使用命令行或 Cockpit Web 界面配置客户端和服务器系统的可用选项。\n\n## 18. 使用 Samba 在 Fedora\
  \ 31 和 Windows 系统之间共享文件\n\n尽管 Linux 在桌面市场取得了一足足进展，但它的起源和未来在很大程度上仍然基于服务器的。因此，Fedora\
  \ 31 能够作为文件服务器并不意外。在网络化环境中，Fedora 和 Windows 系统并肩使用也是极其常见的。因此，一个常见的需求是 Fedora 31\
  \ 系统上的文件能够通过网络连接被 Linux、UNIX 和基于 Windows 的系统访问。同样，位于 Windows 系统上的共享文件夹和打印机也可能需要被基于\
  \ Fedora 31 的系统访问。\n\nWindows 系统使用名为 Server Message Block (`SMB`) 的协议共享文件系统和打印机等资源。为了让\
  \ Fedora 31 系统能够向 Windows 系统提供此类资源，反之亦然，它必须支持 `SMB`。这是通过名为 `Samba` 的技术实现的。`Samba`\
  \ 除了提供 Linux 和 Windows 系统之间的集成外，还可以用于提供 Linux 系统之间的文件夹共享（作为上一章介绍的 `NFS` 的替代方案）。\n\
  \n在本章中，我们将查看在 Fedora 31 系统上与远程 Windows 和 Linux 系统共享文件系统资源和打印机的必要步骤，以及从 Fedora 31\
  \ 访问 Windows 资源。\n\n### 18.1 Samba 和 Samba 客户端\n\n`Samba` 允许 Fedora 31 资源与 Windows\
  \ 系统共享，同时也允许 Windows 资源与 Fedora 31 系统共享。Fedora 使用 `Samba` 客户端访问 Windows 资源。另一方面，Fedora\
  \ 资源是通过安装和配置 `Samba` 服务来与 Windows 系统共享的。\n\n### 18.2 在 Fedora 31 系统上安装 Samba\n\n\
  Fedora 31 安装过程中使用的默认设置通常不会安装必要的 `Samba` 软件包。除非你特别要求安装 `Samba`，否则你的系统中可能没有安装 `Samba`。要检查是否安装了\
  \ `Samba`，请打开终端窗口并运行以下 `rpm` 命令：\n\n```bash\nrpm -q samba samba-common samba-client\n\
  ```\n\n如果没有安装任何 `Samba` 软件包，`rpm` 将返回“package is not installed”。在这种情况下，可以使用 `dnf`\
  \ 命令行工具进行安装：\n\n```bash\ndnf install samba samba-common samba-client\n```\n\n###\
  \ 18.3 配置 Fedora 31 防火墙启用 Samba\n\n接下来，需要配置当前保护 Fedora 31 系统的防火墙以允许 `Samba` 流量。要实现这一点，请如下所示运行\
  \ `firewall-cmd` 命令：\n\n```bash\nfirewall-cmd --permanent --add-port={139/tcp,445/tcp}\n\
  firewall-cmd --reload\n```\n\n在启动 `Samba` 服务之前，需要进行若干配置步骤来定义 Fedora 如何向 Windows\
  \ 系统显示，以及共享哪些资源。大多数配置任务都在 `/etc/samba/` 内完成。\n\n### 18.4 配置 Samba 文件\n\n早期的 Fedora\
  \ 版本包含一个名为 `system-config-samba` 的用户友好工具来辅助配置 Samba。在较新的版本中，该工具已被移除。这意味着 `Samba`\
  \ 环境必须在 `/etc/samba/` 内手动配置，并使用 `smbpasswd` 命令行工具。虽然那些依赖它的人可能会怀念 system-config-samba，但该工具的简单性实际上掩盖了\
  \ Samba 的许多高级功能。实践中，花时间理解 `smb.conf` 文件的细节可以实现更多。\n\n`Samba` 是一个高度灵活且可配置的系统，为网络资源共享提供了许多不同的选项。这种灵活性可能会让人认为\
  \ `Samba` 操作起来非常复杂。然而实际上，并不需要许多配置选项，设置基础配置的学习曲线非常短。\n\n对于本章而言，我们将查看将 Fedora 31 系统加入\
  \ Windows 工作组，并设置一个目录作为供特定用户访问的共享资源。这种配置被称为独立 `Samba` 服务器。更高级的配置（例如将 Samba 集成到 Active\
  \ Directory 环境中）也是可能的，但这些超出了本书的范围。\n\n配置 Samba 的第一步是编辑 `/etc/samba/smb.conf` 文件。\n\
  \n#### 18.4.1 配置 [global] 部分\n\n`smb.conf` 文件被分为多个部分。第一部分是 `[global]` 部分，可以在其中指定适用于整个\
  \ Samba 配置的设置。虽然这些设置是全局的，但每个选项都可以在配置的其他部分被覆盖。\n\n第一个任务是定义共享 Fedora 31 资源的 Windows\
  \ 工作组名称。这是通过 `[global]` 部分的 `workgroup =` 指令控制的，其默认配置如下：\n\n`workgroup = SAMBA`\n\
  \n首先将其更改为实际的工作组名称。例如，如果工作组名为 `WORKGROUP`（大多数 Windows 网络的默认值）：\n\n```ini\n[global]\n\
         workgroup = WORKGROUP\n```\n\n\n\n\n```\nsecurity = user\npassdb backend\
  \ = tdbsam\n```\n\n除了工作组（workgroup）设置外，其他设置表明这是一个独立服务器，共享资源将由用户密码保护。在继续配置要共享的资源之前，还需要如下所示向\
  \ `[global]` 部分添加其他一些其他参数：\n\n```ini\n[global]\nworkgroup = WORKGROUP\nsecurity\
  \ = user\nnetbios name = LinuxServer\npassdb backend = tdbsam\nlog file = /var/log/samba/%m.log\n\
  log level = 1\n```\n\n`netbios name` 属性指定了服务器在网络上其他系统可见的名称，而日志设置则指定了记录日志输出的文件位置。\n\
  \n## 18.4.2 配置共享资源\n\n下一步是配置共享的资源（换句话说，就是从 Windows 网络上的其他系统访问的资源）。为了实现这一点，需要为该部分指定一个名称，在共享时将通过该名称进行引用。例如，如果我们计划共享\
  \ Fedora 31 系统的 `/sampleshare` 目录，我们可以将该部分命名为 `[sampleshare]`。在此部分中可以使用各种配置选项。然而，为了本示例的目的，我们只需定义要共享的目录，指示该目录既可浏览又可写，并声明该资源为公共，以便访客用户能够访问：\n\
  \n```ini\n[sampleshare]\ncomment = Example Samba share\npath = /sampleshare\nbrowseable\
  \ = Yes\npublic = yes\nwritable = yes\n```\n\n若要限制特定用户的访问，可以使用 `valid users` 属性，例如：\n\
  \n```ini\nvalid users = demo, bobyoung, marcewing\n```\n\n## 18.4.3 移除不必要的共享\n\n\
  `smb.conf` 文件预先配置了用于共享打印机和系统用户主目录的节。如果不需要共享这些资源，可以将相应的部分注释掉，以便 Samba 忽略它们。在下面的示例中，`[homes]`\
  \ 部分已被注释掉：\n\n```ini\n#[homes]\n# comment = Home Directories\n# valid users = %S,\
  \ %D%w%S\n# browseable = No\n# read only = No\n# inherit acls = Yes\n```\n\n## 18.5\
  \ 为 Samba 配置 SELinux\n\nSELinux 是一个默认集成到所有 Fedora 31 系统 Linux 内核中的系统，它为操作系统和用户文件提供了额外的安全层和保护。\n\
  \n传统上，Linux 的安全性基于允许用户决定谁可以访问其拥有所有权的文件和其他资源的概念。例如，考虑一个位于特定用户主目录并由该用户拥有的文件。用户能够控制该文件的访问权限，即系统上的其他用户是否能够读取、写入该文件，或者在脚本或二进制文件的情况下执行该文件。这种安全性被称为**酌情访问控制**（discretionary\
  \ access control），因为对资源的访问取决于用户的主意。\n\n然而，通过 SELinux，访问由系统管理员控制，且无法被用户覆盖。这被称为**强制访问控制**（mandatory\
  \ access control），由管理员使用 SELinux 策略定义。继续上一个例子，文件所有者只有在系统默认或管理员定义的 SELinux 策略允许的情况下，才能对该文件执行操作。\n\
  \n可以使用 `sestatus` 工具按照如下所示识别 Fedora 31 系统上 SELinux 的当前状态：\n\n```bash\n# sestatus\n\
  SELinux status: enabled\nSELinuxfs mount: /sys/fs/selinux\nSELinux root directory:\
  \ /etc/selinux\nLoaded policy name: targeted\nCurrent mode: enforcing\nMode from\
  \ config file: enforcing\nPolicy MLS status: enabled\nPolicy deny_unknown status:\
  \ allowed\nMemory protection checking: actual (secure)\nMax kernel policy version:\
  \ 31\n```\n\nSELinux 可以以强制模式（enforcing）或许可模式（permissive）运行。当启用强制模式时，它会拒绝所有未被 SELinux\
  \ 策略允许的操作。另一方面，许可模式允许通常会被拒绝的操作继续，但会将违规行为记录在日志文件中。\n\nSELinux 的安全性基于上下文标签（context\
  \ labels）的概念。系统上的所有资源（包括进程和文件）都被分配了由用户、角色、类型和可选安全级别的 SELinux 上文标签。例如，文件或文件夹的 SELinux\
  \ 上文可以如下所示：\n\n```bash\n$ ls -Z /home/demo\nunconfined_u:object_r:user_home_t:s0\
  \ Desktop\nunconfined_u:object_r:user_home_t:s0 Documents\n```\n\n同样，可以使用 `ps` 命令识别运行进程的上下文，在此例中为\
  \ `ls` 命令：\n\n```bash\n$ ps -eZ | grep ls\nunconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023\
  \ 14311 tty1 00:00:18 ls\n```\n\n当进程（如上述 `ls` 命令）尝试访问文件或文件夹时，SELinux 系统将检查策略以识别是否允许访问。现在考虑\
  \ Samba 服务的上下文：\n\n```bash\n$ ps -eZ | grep smb\nsystem_u:system_r:smbd_t:s0 14129\
  \ ? 00:00:00 smbd\nsystem_u:system_r:smbd_t:s0 14132 ? 00:00:00 smbd-notifyd\n```\n\
  \nSELinux 通过多种方式实现安全，最常见的是被称为**类型强制**（type enforcement）。简单来说，当进程尝试对对象执行任务（例如向文件写入）时，SELinux\
  \ 会检查进程和对象的上下文类型并验证该操作。SELinux 和 Samba 之间的问题在于，SELinux 策略并未被配置为允许类型为 `smbd_t` 的进程对非\
  \ `smbd_t` 类型的文件执行操作。\n\n### 18.5.1\n\n为了让系统上的文件或文件夹可被 Samba 服务访问，必须将这些资源的强制类型更改为\
  \ `samba_share_t`。\n\n为了本示例，我们将之前在 `smb.conf` 中引用的 `/sampleshare` 目录并更改其强制类型以便 Samba\
  \ 服务访问。首先创建目录：\n\n```bash\n# mkdir /sampleshare\n```\n\n接下来，检查目录的 SELinux 上文：\n\n\
  ```bash\n$ ls -aZ /sampleshare/\nunconfined_u:object_r:default_t:s0 .\n```\n\n在这种情况下，文件夹的上下文被分配了\
  \ `default_t` 类型。为了让文件夹能够被 Samba 共享，需要使用 `semanage` 工具将强制类型设置为 `samba_share_t`：\n\
  \n```bash\n# semanage fcontext -a -t samba_share_t \"/sampleshare(/)?\"\n```\n\n\
  注意 `semanage` 命令中通配符的使用，以确保该类型应用到 `/sampleshare` 目录内的任何子目录和文件。添加后，需要使用 `restorecon`\
  \ 命令应用更改，并利用 `-R` 标志递归处理所有子目录：\n\n```bash\n# restorecon -R -v /sampleshare\nRelabeled\
  \ /sampleshare from unconfined_u:object_r:default_t:s0 to unconfined_u:object_r:samba_share_t:s0\n\
  ```\n\n完成这些更改后，该文件夹已配置符合 `smbd` 进程的 SELinux 策略，并可以由 Samba 共享。\n\n### 18.6 创建 Samba\
  \ 用户\n\n\n\n\n任何需要访问 Samba 共享资源的用户都必须配置为 Samba 用户并分配密码。此任务通过使用 `smbpasswd` 命令行工具完成。例如，假设一个名为\
  \ `demo` 的用户需要从 Windows 系统访问我们 Fedora 31 系统的 `/sampleshare` 目录。为了满足这一需求，我们必须按照如下方式将\
  \ `demo` 添加为 Samba 用户：\n\n```\nsmbpasswd -a demo\n```\n\n新 SMB 密码：\n\n再次输入新 SMB\
  \ 密码：\n\n已添加用户 demo。\n\n现在我们已经完成了一个非常基础的 Samba 服务器的配置，是时候测试我们的配置文件并启动 Samba 服务了。\n\
  \n### 18.7 测试 `smb.conf` 文件\n\n可以使用 `testparm` 命令行工具按照如下方式检查 `smb.conf` 文件中的设置是否存在错误：\n\
  \n```\ntestparm\n```\n\n从 `/etc/samba/smb.conf` 加载 smb 配置文件\n\nrlimit_max: 将 rlimit_max\
  \ (1024) 增加到 Windows 限制 (16384)\n\n正在处理部分 \"[sampleshare]\"\n\n正在处理部分 \"[homes]\"\
  \n\n正在处理部分 \"[printers]\"\n\n正在处理部分 \"[print$]\"\n\n加载服务文件 OK。\n\n服务器角色：ROLE_STANDALONE\n\
  \n按回车查看服务定义转储\n\n```\n# Global parameters\n\n[global]\nlog file = /var/log/samba/%m.log\n\
  netbios name = LINUXSERVER\nprintcap name = cups\nsecurity = USER\nwins support\
  \ = Yes\nidmap config * : backend = tdb\ncups options = raw\n\n[sampleshare]\ncomment\
  \ = Example Samba share\nguest ok = Yes\npath = /sampleshare\nread only = No\n\n\
  [homes]\nbrowseable = No\ncomment = Home Directories\ninherit acls = Yes\nread only\
  \ = No\nvalid users = %S %D%w%S\n\n[printers]\nbrowseable = No\ncomment = All Printers\n\
  create mask = 0600\npath = /var/tmp\nprintable = Yes\n\n[print$]\ncomment = Printer\
  \ Drivers\ncreate mask = 0664\ndirectory mask = 0775\nforce group = @printadmin\n\
  path = /var/lib/samba/drivers\nwrite list = @printadmin root\n```\n\n### 18.8 启动\
  \ Samba 和 NetBIOS 名称服务\n\n为了 Fedora 31 服务器能够在 Windows 网络中运行，必须启动 Samba (SMB) 和 NetBIOS\
  \ 名称服务 (NMB)。作为可选，还可以启用这些服务，以便它们在每次系统启动时自动启动：\n\n```\nsystemctl enable smb\nsystemctl\
  \ start smb\nsystemctl enable nmb\nsystemctl start nmb\n```\n\n在尝试从 Windows 系统连接之前，使用\
  \ `smbclient` 实用程序验证共享已配置：\n\n```\nsmbclient -U demo -L localhost\n```\n\n输入 WORKGROUP\\\
  demo 的密码：\n\n共享名 类型 注\n--------- ---- -------\nsampleshare Disk Example Samba share\n\
  print$ Disk Printer Drivers\nIPC$ IPC IPC Service (Samba 4.9.1)\ndemo Disk Home\
  \ Directories\n\n正在使用 SMB1 重新连接以列出工作组。\n\n服务器 注\n--------- -------\nWorkgroup Master\n\
  --------- -------\nWORKGROUP LINUXSERVER\n\n### 18.9 访问 Samba 共享\n\n现在 Samba 资源配置完成且服务正在运行，是时候从\
  \ Windows 系统访问共享资源了。在与 Fedora 31 系统处于同一工作组的合适 Windows 系统上，打开 Windows 资源管理器并导航到“网络”面板。此时，资源管理器应该搜索网络并列出它找到的所有使用\
  \ SMB 协议的系统。下图说明如何在 Windows 10 系统上使用 Windows 资源管理器找到名为 `LINUXSERVER` 的 Fedora 31\
  \ 系统：\n\n![](img/rhel_8_samba_share_on_windows.png)\n\n图 18-1\n\n双击 `LINUXSERVER`\
  \ 主机将提示具有访问权限的用户名和密码。在这种情况下，是我们使用 `smbpasswd` 工具配置的 `demo` 账户：\n\n![](img/rhel_8_samba_windows_login.png)\n\
  \n图 18-2\n\n输入用户名和密码后，该用户配置的共享资源将出现在资源管理器中，包括之前配置的 `/sampleshare` 资源：\n\n![](img/rhel_8_samba_folder_on_windows.png)\n\
  \n图 18-3\n\n双击 `/sampleshare` 共享资源将显示其中包含的文件和目录列表。\n\n### 18.10 从 Fedora 31 访问 Windows\
  \ 共享\n\n如前所述，Samba 是双向的，它不仅允许 Windows 系统访问托管在 Fedora 31 系统上的文件和打印机，还允许 Fedora 31\
  \ 系统访问 Windows 系统上的共享资源。这是通过在本章开始时安装的 `samba-client` 包实现的。如果尚未安装，请从终端窗口按照如下方式安装：\n\
  \n```\ndnf install samba-client\n```\n\n可以从 Fedora 桌面环境使用“文件”应用程序访问 Windows 系统上的共享资源，也可以从命令行提示符使用\
  \ `smbclient` 和 `mount` 工具访问。本节中的步骤假设 Windows 系统上已启用了适当的网络共享设置。\n\n要使用桌面环境访问 Windows\
