  ```\n\n## 24. 使用 virsh 工具管理 KVM\n\n在之前的章节中，我们涵盖了 KVM 的安装和配置。本章专门探讨 `virsh` 的一些额外领域。\n\
  \n### 24.1 virsh Shell 和命令行\n\n`virsh` 工具既是命令行工具，也是交互式 shell。当以命令行模式使用时，直接在提示符处输入适用于任务的选项。要以命令行方式使用，请在终端执行：\n\
  \n```\nvirsh <option>\n```\n\n`virsh` 工具在以 shell 模式使用时，提供了一个交互式环境来执行命令序列。运行以下：\n\
  \n```\nvirsh\nWelcome to virsh, the virtualization terminal.\nType: ‘help’ for help\
  \ with commands, 'quit' to exit\n```\n\n在 `virsh #` 提示符处输入要运行的选项。以下示例列出了虚拟机，启动名为\
  \ `FedoraVM` 的虚拟机，然后获取另一个列表以验证虚拟机正在运行：\n\n```\nlist\nId Name State\n------------------------------------\n\
  8 RHEL8VM running\n9 CentOS7VM running\n\nstart FedoraVM\nDomain FedoraVM started\n\
  \nlist\nId Name State\n------------------------------------\n8 RHEL8VM running\n\
  9 CentOS7VM running\n10 FedoraVM running\n```\n\n`virsh` 工具支持广泛的命令，可以使用 help 选项获取其完整列表：\n\
  \n```bash\nvirsh help\n```\n\n关于每个命令语法的更多详细信息可以通过 help 指令后指定命令来获取：\n\n```\nvirsh\
  \ help restore\n```\n\n\n\n\n\n### 24.2 列出客户系统状态\n\n在 Fedora 31 虚拟化主机上，可以随时使用 `virsh`\
  \ 工具的 `list` 选项查看客户系统的状态。例如：\n\n```bash\nvirsh list\n```\n\n上述命令将显示输出，其中每个客户系统都占一行，类似于下所示：\n\
  \n```\nvirsh # list\n\n Id Name State\n----------------------------------------------------\n\
  \ 8 RHEL8VM running\n 9 CentOS7VM running\n10 FedoraVM running\n```\n\n### 24.3\
  \ 启动客户系统\n\n可以使用 `virsh` 工具结合 `start` 选项以及后跟要启动的客户操作系统名称来启动客户操作系统。例如：\n\n```bash\n\
  virsh start myGuestOS\n```\n\n### 24.4 关闭客户系统\n\n正如其名所示，`virsh` 工具的 `shutdown` 选项用于关闭客户操作系统：\n\
  \n```bash\nvirsh shutdown guestName\n```\n\n注意，`shutdown` 选项允许客户操作系统在接收到关闭指令时执行有序关机。若要立即停止客户操作系统，可以使用\
  \ `destroy` 选项（这将伴随着文件系统损坏和数据丢失的所有相关风险）：\n\n```bash\nvirsh destroy guestName\n```\n\
  \n### 24.5 挂起和恢复客户系统\n\n可以使用 `virsh` 工具的 `suspend` 和 `resume` 选项挂起和恢复客户系统。例如，挂起一个特定系统：\n\
  \n```bash\nvirsh suspend guestName\n```\n\n同样，恢复已暂停的系统：\n\n```bash\nvirsh resume\
  \ guestName\n```\n\n注意，如果主机系统重启，挂起的会话将会丢失。此外，请注意挂起的系统仍然驻留在内存中。要保存会话使其不再占用内存并能够恢复到其精确状态（即使在重启后也是如此），必须保存并恢复客户系统。\n\
  \n### 24.6 保存和恢复客户系统\n\n可以使用 `virsh` 实用程序保存和恢复运行中的客户操作系统。保存时，客户操作系统的当前状态会被写入磁盘并从系统内存中移除。保存的系统随后可以随时恢复（包括在主机系统重启后）。\n\
  \n保存客户系统：\n\n```bash\nvirsh save guestName path_to_save_file\n```\n\n恢复已保存的客户操作系统会话：\n\
  \n```bash\nvirsh restore path_to_save_file\n```\n\n### 24.7 重启客户系统\n\n重启客户操作系统：\n\
  \n```bash\nvirsh reboot guestName\n```\n\n### 24.8 配置分配给客户操作系统的内存\n\n要配置分配给客户系统的内存，使用\
  \ `virsh` 命令的 `setmem` 选项。例如，以下命令将分配给客户系统的内存减少到 256Mb：\n\n```bash\nvirsh setmem\
  \ guestName 256\n```\n\n注意，可接受的内存设置必须位于当前 `Domain`（域）可用内存范围内。可以使用 `setmaxmem` 选项增加此限制。\n\
  \n### 24.9 总结\n\n`virsh` 工具为创建、监控和管理客户虚拟机提供了广泛选项。正如本章概述的，该工具可以在命令行模式或交互模式下使用。\n\n\
  ## 25. Linux 容器简介\n\n前面的章节涵盖了虚拟化概念，特别强调了使用 `KVM` 创建和管理虚拟机。本章将以 Linux 容器（Linux Containers）的形式介绍一种相关技术。虽然虚拟机和容器之间存在相似之处，但本章将概述它们的一些关键区别，并介绍\
  \ Linux 容器的概念和优势。本章还将提供一些 Fedora 31 容器管理工具的概述。在本章涵盖容器基础知识后，下一章将通过在 Fedora 31 上创建和运行容器的一些实际示例来进行。\n\
  \n### 25.1 Linux 容器与内核共享\n\n简单来说，Linux 容器可以看作是虚拟化的轻量级替代方案。在虚拟化环境中，会创建一个包含并运行整个客户操作系统的虚拟机。虚拟机运行在诸如虚拟机程序（hypervisor）的环境之上，虚拟机程序管理对主机系统物理资源的访问。\n\
  \n容器的工作原理是使用“内核共享”的概念，这利用了 Linux 和基于 UNIX 的操作系统的架构设计。\n\n为了理解内核共享和容器如何工作，首先理解 Linux\
  \ 或 UNIX 操作系统的两个主要组件会有帮助。操作系统的核心是 `kernel`（内核）。简单来说，内核处理操作系统与物理硬件之间的所有交互。第二个关键组件是根文件系统，它包含了操作系统运行所需的所有库、文件和实用程序。利用这种结构，每个容器都有自己的根文件系统，但共享主机操作系统的\
  \ `kernel`。这种结构在下方的图 25-1 架构图中所示。\n\n这种资源共享的实现是因为 `kernel` 能够动态地将当前根文件系统（该概念称为更改根或\
  \ `chroot`）更改到不同的根文件系统，而无需重启整个系统。Linux 容器本质上是这种能力的扩展，并结合了容器运行时，其职责是为在主机系统上执行和管理容器提供接口。有许多容器运行时可用，包括\
  \ `Docker`、`lxd`、`containerd` 和 `CRI-O`。早期的 Fedora 默认使用 `Docker`，但在 Fedora 31 中，这已被\
  \ `Podman` 取代。\n\n![](img/linux_container_diagram.png)\n\n图 25-1\n\n### 25.2 容器的用途和优势\n\
  \n容器的主要优势是它们比虚拟化需要的少多的资源开销，允许在单台服务器上同时运行许多容器实例，并根据需求快速高效地启动和停止。容器在主机系统上原生运行，提供了虚拟机无法比拟的性能。\n\
  \n容器还具有极的可移植性，可以在系统之间快速方便地迁移。与 `Docker`、`OpenShift` 和 `Kubernetes` 等容器管理系统相结合时，可以在跨越多个服务器和云平台的大规模范围内部署和管理数千个容器。\n\
  \n容器经常用于为应用程序创建轻量级执行环境。在这种情况下，每个容器都提供了一个隔离环境，包含了应用程序以及该运行所需的所有运行时和支持文件。然后可以将容器部署到任何其他支持容器执行的兼容主机系统，而无需担心目标系统可能缺少应用程序所需的运行时配置——应用程序的所有依赖已在容器中。\n\
  \n容器在桥接开发和生产环境之间的差距也很有用。通过在容器中进行开发和测试工作，可以将这些容器传递到生产环境并启动，放心地应用程序运行在与其开发和测试时相同的容器环境中。\n\
  \n容器还促进了大型复杂解决方案的模块化部署方法。与其将应用程序开发为单个单体实体，可以使用容器将应用程序设计为一组相互作用的模块，每个模块运行在独立的容器中。\n\
  \n\n\n\n容器的一个可能缺点是，客户操作系统必须与正在共享的内核版本兼容。例如，无法在 Linux 系统的容器中运行 Microsoft Windows。同样，为\
  \ 2.6 版本内核设计的 Linux 客户系统也无法共享 2.4 内核。然而，这些要求并不是容器的设计初衷。因此，这些限制不应被视为局限性，而应该被视为在提供简单、可扩展且可靠的部署平台方面的优势之一。\n\
  \n### 25.3 Fedora 31 容器工具\n\nFedora 31 提供了许多创建、检查和管理容器的工具。主要工具如下：\n\n- `buildah`\
  \ – 用于构建容器镜像的命令行工具。\n- `podman` – 基于命令行的容器运行时和管理工具。执行诸如从远程仓库下载容器镜像，以及检查、启动和停止镜像等任务。\n\
  - `skopeo` – 命令行实用程序，用于转换容器镜像、在仓库之间复制镜像，以及在无需下载的情况下检查存储在仓库中的镜像。\n- `runc` – 一种轻级容器运行时，用于从命令行启动和运行容器。\n\
  \n上述所有工具都符合开放容器标准 (OCI)，这是一系列旨在确保不同竞争工具和平台之间的容器遵循相同标准的规范。\n\n### 25.4 Docker 仓库\
  \ (Docker Registry)\n\n尽管 Fedora 提供了一套旨在替代 Docker 工具的工具，但这些工具在构建容器时仍需要访问 Fedora\
  \ 镜像。为此，Fedora 项目在 Docker Hub 内部维护了一套 Fedora 容器镜像。Docker Hub 是一个由多个仓库组成的在线容器仓库，每个仓库都包含多种在构建容器时可供下载的容器镜像。仓库中的每个镜像都分配有一个仓库标签（例如\
  \ 30、31、latest 等），在执行镜像下载时可以引用这些标签。例如，是 Docker Hub 中包含的 Fedora 31 镜像的 URL：\n\n```\n\
  docker://docker.io/library/fedora:31\n```\n\n除了从 Docker 和其他第三方托管仓库下载（容器术语中称为“拉取”，pulling”）容器镜像外，您还可以使用仓库存储您自己的镜像。这可以通过托管自己的仓库，或者利用现有的服务来实现，例如\
  \ Docker、Amazon AWS、Google Cloud、Microsoft Azure 和 IBM Cloud 等提供的众多选项之一。\n\n###\
  \ 25.5 容器网络\n\n默认情况下，容器使用容器网络接口 (CNI) 桥接网络栈连接到网络。在桥接配置中，运行在服务器上的所有容器属于同一个子网（默认是\
  \ 10.88.0.0/16），因此能够相互通信。容器通过桥接主机系统的网络连接连接到外部网络。同样，主机可以通过虚拟网络接口（通常命名为 `cni0`）访问容器，该接口是在容器工具安装过程中创建的。\n\
  \n### 25.6 总结\n\nLinux Containers（Linux Containers）提供了虚拟化的轻量级替代方案，并利用了 Linux 和 Unix\
  \ 操作系统的结构。Linux 容器本质上共享宿主机操作系统的内核，每个容器都有自己的根文件系统，其中包含文件、库和应用程序。容器非常高效且可扩展，为构建和部署模块化的企业级解决方案提供了理想平台。有很多工具和平台可用于构建容器，包括第三方解决方案和\
  \ Fedora 提供的工具。\n\n# 26. 在 Fedora 31 上使用容器\n\n在上一章介绍了 Linux 容器的基础知识后，本章将演示如何使用 Fedora\
  \ 31 包含的 `Podman`、`Skopeo` 和 `Buildah` 工具来创建和管理容器。其目的是让你在本章结束时，你将更清晰地理解如何在 Fedora\
  \ 31 上创建和管理容器，并获得继续探索 Linux 容器力量的知识基础。\n\n### 26.1 安装容器工具\n\n在开始容器之前，第一步是使用以下命令安装上一章列出的所有容器工具：\n\
