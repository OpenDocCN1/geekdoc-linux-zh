  \      \"99-modular\",\n        \"latest\"\n    ],\n    \"Created\": \"2019-10-29T03:37:62Z\"\
  ,\n    \"DockerVersion\": \"18.6\",\n    \"Labels\": {\n        \"maintainer\":\
  \ \"fedora@fedaproject.org\"\n    },\n    \"Architecture\": \"amd64\",\n    \"Os\"\
  : \"linux\",\n    \"Layers\": [\n        \"sha256:d318c91bf2a8\",\n        \"sha256:f085ad3fed45\"\
  ,\n        \"sha256:bb2e5501cb459fface008179eaa43608c369bd46\"\n    ],\n    \"Env\"\
  : [\n        \"PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\
  ,\n        \"DISTTAG=31-candidate\"\n    ],\n    \"FBR=31-candidate\"\n}\n```\n\n\
  确认仓库中有镜像后，可以使用以下语法下载镜像，其中 `<RepoTag>` 替换为 `skopeo` 输出显示的标签：\n\n```bash\n$ podman\
  \ pull docker://docker.io/library/fedora:<RepoTag>\n```\n\n例如，拉取最新的 Fedora 镜像：\n\
  \n```bash\n$ podman pull docker://docker.io/library/fedora:latest\n```\n\n```\n\
  Trying to pull docker://docker.io/library/fedora:latest...\nGetting image source\n\
  Copying blob d318c91bf2a skipped: already exists\nCopying config f085ad3fe done\n\
  Writing manifest to image destination\nStoring signatures\nf0858ad3fed45bb2e5501cb459fface008179eaa436085c369bd46\n\
  ```\n\n让 `podman` 列出所有本地镜像来验证镜像已存储：\n\n```bash\n$ podman images\n```\n\n```\nREPOSITORY\
  \               TAG       ID             CREATED           SIZE\ndocker.io/library/fedora\
  \  latest    f0858ad3febd   2 months ago   201 MB\n```\n\n可以通过运行 `podman inspect`\
  \ 命令获取本地镜像详情：\n\n```bash\n$ podman inspect fedora:latest\n```\n\n此命令输出的信息与在本章较早对远程镜像执行的\
  \ skopeo 命令相同。\n\n### 在容器中运行\n\n要运行镜像，使用 `podman run` 命令。在这种情况下，将指定 `--rm` 选项，表示我们要在容器中运行镜像，执行一个命令然后让容器退出。在本情况下，将使用\
  \ `cat` 工具输出位于容器根文件系统上的 `/etc/passwd` 文件内容：\n\n```bash\n$ podman run --rm fedora:latest\
  \ cat /etc/passwd\n```\n\n```\nroot:x:0:0:root:/root:/bin/bash\nbin:x:1:1:bin:/bin:/sbin/nologin\n\
  daemon:x:2:2:daemon:/sbin:/sbin/nologin\nadm:x:3:4:adm:/var/adm:/sbin/nologin\n\
  lp:x:4:7:lp:/var/spool/lpd:/sbin/nologin\nsync:x:5:0:sync:/sbin:/bin/sync\n```\n\
  \n\n\n\n\n```text\nshutdown:x:6:0:shutdown:/sbin:/sbin/shutdown\nhalt:x:7:0:halt:/sbin:/sbin/halt\n\
  mail:x:8:12:mail:/var/spool/mail:/sbin/nologin\noperator:x:11:0:operator:/root:/sbin/nologin\n\
  games:x:12:100:games:/usr/games:/sbin/nologin\nftp:x:14:50:FTP User:/var/ftp:/sbin/nologin\n\
  nobody:x:65534:65534:Kernel Overflow User:/:/sbin/nologin\nsystemd-coredump:x:999:997:systemd\
  \ Core Dumper:/:/sbin/nologin\nsystemd-network:x:192:192:systemd Network Management:/:/sbin/nologin\n\
  systemd-resolve:x:193:193:systemd Resolver:/:/sbin/nologin\ndbus:x:81:81:System\
  \ message bus:/:/sbin/nologin\nsystemd-timesync:x:996:996:systemd Time Synchronization:/:/usr/sbin/nologin\n\
  ```\n\n比较容器内的 `/etc/passwd` 文件与宿主机系统上的 `/etc/passwd` 文件内容，你会发现它缺少宿主机上存在的所有额外用户，这证明了\
  \ `cat` 命令是在容器环境中执行的。同时请注意，容器的启动、运行命令到退出整个过程在几秒钟内就完成了。将其与启动一个完整的操作系统、执行任务并关闭虚拟机所需的时间进行对比，你就会体会容器的快速和高效。\n\
  \n要启动容器、保持其运行并访问其 shell，可以使用以下命令：\n\n```bash\n$ podman run --name=mycontainer -it\
  \ fedora:latest /bin/bash\n```\n\n```\n[root@03c8e8ac8fd5 /]#\n```\n\n在这种情况下，使用了额外的命令行选项为容器分配了名称\
  \ `mycontainer`。虽然这是可选的，但相较于使用自动生成的容器 ID，这使得容器更容易识别和引用。\n\n在容器运行时，在另一个终端窗口中运行 `podman`\
  \ 可以查看系统上所有容器的状态：\n\n```bash\n$ podman ps -a\n```\n\n```\nCONTAINER ID IMAGE COMMAND\
  \ CREATED STATUS PORTS NAMES\n03c8e8ac8fd5 docker.io/library/fedora:latest /bin/bash\
  \ 50 seconds ago Up About a minute ago mycontainer\n```\n\n要从宿主机在运行的容器中执行命令，只需使用\
  \ `podman exec` 命令，并引用运行容器的名称和要执行的命令即可。例如，以下命令会在名为 `mycontainer` 的容器中启动第二个 bash\
  \ 会话：\n\n```bash\n$ podman exec -it mycontainer /bin/bash\n```\n\n```\n[root@03c8e8ac8fd5\
  \ /]#\n```\n\n注意，尽管上面的示例引用了容器名称，但使用 `podman ps -a` 命令列出的容器 ID 也可以实现相同的结果：\n\n```bash\n\
  $ podman exec -it 03c8e8ac8fd5 /bin/bash\n```\n\n```\n[root@03c8e8ac8fd5 /]#\n```\n\
  \n或者，`podman attach` 命令也会连接到运行中的容器并访问 shell 提示符：\n\n```bash\n$ podman attach mycontainer\n\
  ```\n\n```\n[root@03c8e8ac8fd5 /]#\n```\n\n一旦容器启动并运行，就可以像处理任何其他 Fedora 31 系统一样进行任何额外的配置更改并安装软件包。\n\
  \n### 26.4 管理容器\n\n容器一旦启动，将将持续运行，直到通过 `podman` 停止它，或者在运行容器时启动的命令退出为止。例如，在宿主机上运行以下命令将导致容器退出：\n\
  \n```bash\n$ podman stop mycontainer\n```\n\n或者，在容器内最后一个留的 bash shell 中按下 `Ctrl-D`\
  \ 键序列将导致 shell 和容器同时退出。一旦它退出，容器的状态将发生相应变化：\n\n```bash\n$ podman ps -a\n```\n\n```\n\
  CONTAINER ID IMAGE COMMAND CREATED STATUS PORTS NAMES\n03c8e8ac8fd5 docker.io/library/fedora:latest\
  \ /bin/bash 7 minutes ago Exited (0) About a minute ago mycontainer\n```\n\n尽管容器不再运行，但它仍然存在，并包含了对配置和文件系统进行的所有更改。如果你安装了软件包、进行了配置更改或添加了文件，这些更改将持久存在\
  \ `mycontainer` 中。要验证这一点，只需按照如下方式重启容器：\n\n```bash\n$ podman start mycontainer\n\
  ```\n\n启动容器后，再次使用 `podman exec` 命令如前所述在容器内执行命令。例如，再次访问 shell 提示符：\n\n```bash\n$\
  \ podman exec -it mycontainer /bin/bash\n```\n\n运行中的容器还可以按照如下方式使用 `podman pause`\
  \ 和 `unpause` 命令暂停和恢复：\n\n```bash\n$ podman pause mycontainer\n$ podman unpause\
  \ mycontainer\n```\n\n## 26.5 将容器保存为镜像\n\n一旦容器客户系统按照你的要求配置完成，你很有可能想要将它保存为镜像。为了实现这一点，使用\
  \ `podman commit` 命令结合容器的名称或 ID 将其保存为镜像，例如：\n\n```bash\n$ podman commit mycontainer\
  \ myfedora_image\n```\n\n一旦保存保存，可以使用该镜像如前所述在容器内执行命令。检查该镜像现在是否出现在镜像列表中：\n\n```bash\n\
  $ podman images\n```\n\n```\nREPOSITORY TAG ID CREATED SIZE\nlocalhost/myfedora_image\
  \ latest aef2443d 7 seconds ago 201 MB\ndocker.io/library/fedora latest 2 months\
  \ ago 201 MB\n```\n\n该镜像现在可以用于创建相同的容器：\n\n```bash\n$ podman run --name=container2\
  \ -it localhost/myfedora_image /bin/bash\n```\n\n## 26.6 从本地存储中删除镜像\n\n当镜像不再需要时，只需运行\
  \ `podman rmi` 命令将其删除。例如，删除镜像 `myfedora_image`：\n\n```bash\n$ podman rmi localhost/myfedora_image\n\
  ```\n\n注意，在删除镜像之前，必须先移除基于它的容器。\n\n### 26.7 移除容器\n\n即使容器已经退出，它仍然存在并且可以随时重启。如果容器不再需要，可以使用\
  \ `podman rm` 命令将其删除：\n\n```bash\n# podman rm container2\n```\n\n### 26.8 使用 Buildah\
  \ 构建容器\n\nBuildah 允许从现有容器、镜像或完全从零构建新的容器。Buildah 还提供了挂载容器文件系统的功能，以便从宿主机对其进行访问。\n\n\
  以下 buildah 命令将从 Fedora 31 基础镜像构建容器（如果镜像尚未从注册表中拉取，buildah 将先下载它）：\n\n```bash\n$ buildah\
  \ from docker://docker.io/library/fedora:31\n```\n\n运行此命令的结果将是一个名为 `fedora-working-container`\
  \ 的就绪运行的容器：\n\n```bash\n$ buildah run fedora-working-container cat /etc/passwd\n\
  \n## 26.9 从零构建容器\n\n从零构建容器本质上创建一个空容器。一旦创建，就可以安装软件包以满足容器的需求。这种方法在创建只需要最少软件包的容器时非常有用。\n\
  \n从零构建的第一步是运行以下命令来构建空容器：\n\n```bash\n# buildah from scratch\n```\n\n构建完成后，将创建一个名为\
  \ `working-container` 的容器：\n\n```\n# buildah containers\nCONTAINER ID BUILDER IMAGE\
  \ ID NAME CONTAINER NAME\n9b138eee7fa6 * scratch working-container\n```\n\n空容器现在准备好安装软件包。遗憾的是，这无法在容器内进行，因为此时甚至还没有\
  \ bash 或 `dnf` 工具。相反，需要将容器文件系统挂载到宿主机系统，并使用 `dnf` 将系统根设置为挂载的容器文件系统来执行软件包。通过如下方式挂载容器文件系统开始此过程：\n\
  \n```bash\n# buildah mount working-container\n```\n\n\n\n\n\n`/var/lib/containers/storage/overlay/20b46cf0e2994d1ecdc4487b89f93f6ccf41f72788da63866b6bf80984081d9a/merged\n\
  \n[/content]\n\n如果文件系统已成功挂载，`buildah` 将输出容器文件系统的挂载点。现在我们已经访问了容器文件系统，可以使用 `dnf` 命令通过\
  \ `--installroot` 选项指向已挂载的容器文件系统，向容器内安装包。例如，以下命令在容器文件系统中安装了 `bash`、`CoreUtils` 和\
  \ `dnf` 软件包（其中 `<container_fs_mount>` 是之前 `buildah mount` 命令输出的挂载路径）：\n\n```bash\n\
  dnf install --releasever=31 --installroot <container_fs_mount> bash coreutils dnf\n\
  ```\n\n注意，`--releasever` 用于指示 `dnf` 在容器内安装 Fedora 31 的软件包。\n\n安装完成后，按照以下方式卸载临时文件系统：\n\
  \n```bash\nbuildah umount working-container\n```\n\n一旦 `dnf` 完成包安装，即可运行容器并按如下访问\
  \ `bash` 提示符：\n\n```bash\nbuildah run working-container bash\n```\n\n`bash-5.0#`\n\
  \n## 26.10 容器桥接网络\n\n如上一章所述，容器网络是使用容器网络接口（CNI）桥接网络栈实现的。以下命令显示了运行容器的宿主机系统的典型网络配置：\n\
  \n```bash\nip a\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN\
  \ group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \    inet 127.0.0.1/8 scope host lo\n        valid_lft forever preferred_lft forever\n\
  \    inet6 ::1/128 scope host\n        valid_lft forever preferred_lft forever\n\
  2: enp0s3: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel state UP group\
  \ default qlen 1000\n    link/ether 08:00:27:20:dc:2f brd ff:ff:ff:ff:ff:ff\n  \
  \  inet 192.168.0.33/24 brd 192.168.0.255 scope global dynamic noprefixroute enp0s3\n\
  \        valid_lft 3453sec preferred_lft 3453sec\n    inet6 2606:a000:4307:f000:aa6:6da1:f8a9:5f95/64\
  \ scope global dynamic noprefixroute\n        valid_lft 3599sec preferred_lft 3599sec\n\
  \    inet6 fe80::4275:e186:85e2:d81f/64 scope link noprefixroute\n        valid_lft\
  \ forever preferred_lft forever\n3: cni-podman0: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc noqueue state UP group default qlen 1000\n    link/ether 7e:b6:04:22:4f:22\
  \ brd ff:ff:ff:ff:ff:ff\n    inet 10.88.0.1/16 scope global cni0\n        valid_lft\
  \ forever preferred_lft forever\n    inet6 fe80::7cb6:4ff:fe22:4f22/64 scope link\n\
  \        valid_lft forever preferred_lft forever\n12: veth2a07dc55@if3: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc noqueue master cni0 state UP group default\n    link/ether 42:0d:69:13:89:af\
  \ brd ff:ff:ff:ff:ff:ff link-netns cni-61ba825e-e596-b2ef-a59f-b0743025e448\n  \
  \  inet6 fe80::400d:69ff:fe13:89af/64 scope link\n        valid_lft forever preferred_lft\
  \ forever\n```\n\n在上述示例中，宿主机有一个名为 `enp0s3` 的接口，连接到外部网络，IP 地址为 `192.168.0.33`。此外，创建了一个名为\
  \ `cni-podman0` 的虚拟接口并分配了 IP 地址 `10.88.0.1`。在宿主机上的容器上运行相同的 `ip` 命令可能会得到如下输出：\n\n\
  ```bash\nip a\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN\
  \ group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \    inet 127.0.0.1/8 scope host lo\n        valid_lft forever preferred_lft forever\n\
  \    inet6 ::1/128 scope host\n        valid_lft forever preferred_lft forever\n\
  3: eth0@if2: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue state UP group\
  \ default\n    link/ether 42:0d:69:13:89:af brd ff:ff:ff:ff:ff:ff net-ns 0\n   \
  \ inet 10.88.0.28/16 scope global eth0\n        valid_lft forever preferred_lft\
  \ forever\n    inet6 fe80::c52:2ff:fe4b:e0d8/64 scope link\n        valid_lft forever\
  \ preferred_lft```\n\n在这种情况下，容器的 IP 地址为 `10.88.0.28`。在宿主机上运行 `ping` 命令可以验证宿主机和容器确实处于同一个子网：\n\
  \n```bash\nping 10.88.0.28\nPING 10.88.0.28 (10.88.0.28) 56(84) bytes of data.\n\
  64 bytes from 10.88.0.28: icmp_seq=1 ttl=64 time=0.056 ms\n64 bytes from 10.88.0.28:\
  \ icmp_seq=2 ttl=64 time=0.039 ms\n```\n\nCNI 配置设置可以在宿主机系统的 `/etc/cni/net.d/87-podman-bridge.conflist`\
  \ 文件找到，默认情况下的内容如下：\n\n```json\n{\n  \"cniVersion\": \"0.4.0\",\n  \"name\": \"podman\"\
  ,\n  \"plugins\": [\n    {\n      \"type\": \"bridge\",\n      \"bridge\": \"cni-podman0\"\
  ,\n      \"isGateway\": true,\n      \"ipMasq\": true,\n      \"ipam\": {\n    \
  \    \"type\": \"host-local\",\n        \"routes\": [\n          {\n           \
  \ \"dst\": \"0.0.0.0/0\"\n          }\n        ],\n        \"ranges\": [\n     \
  \     {\n            \"subnet\": \"10.88.0.0/16\",\n            \"gateway\": \"\
  10.88.0.1\"\n          }\n        ]\n      }\n    }\n  ]\n}\n```\n\n\n\n\n一旦运行，容器将如上所示显示在列表中。图\
  \ 26-5 中的按钮允许执行诸如启动、停止、暂停和保存容器等操作。现在，您已经可以使用本章前面概述的步骤从命令行访问并管理容器了。\n\n### 26.12\
  \ 总结\n\n本章详细介绍了如何在 Fedora 31 上使用 `podman`、`skopeo` 和 `buildah` 工具结合 `Cockpit` Web\
  \ 界面创建和管理 Linux 容器（Linux Containers），包括使用从存储库获取的容器镜像，以及创建一个完全从零构建的新镜像。\n\n## 27.\
  \ 设置 Fedora 31 Web 服务器\n\n在构成 Fedora 31 操作系统的许多软件包中，包含了 `Apache` Web 服务器。事实上，Fedora\
  \ 31 的可扩展性和容错性使其成为托管即使是流量最大的网站的理想平台。\n\n在本章中，我们将解释如何使用 `Apache` 配置 Fedora 31 系统以作为\
  \ Web 服务器，包括安全（`HTTPS`）和不安全（`HTTP`）配置。\n\n### 27.1 配置 Fedora 31 Web 服务器的要求\n\n要建立您自己的网站，您需要一台计算机（或云服务器实例）、一个操作系统、Web\
  \ 服务器、域名、名称服务器和一个 IP 地址。\n\n在操作系统方面，我们当然假设您正在使用 Fedora 31。如前提到的，Fedora 31 支持 `Apache`\
  \ Web 服务器，一旦操作系统运行，就可以轻松地安装。域名可以在任何域名注册服务处注册。\n\n如果您在云实例上运行 Fedora 31，由提供商分配的 IP\
  \ 地址将列在服务器概览信息中。如果您正在托管自己的服务器，并且您的互联网服务提供商（ISP）分配了静态 IP 地址，那么您将需要将域名与该地址关联。这通过使用名称服务器来实现，所有的域名注册服务都将为您提供此服务。\n\
  \n如果您没有静态 IP 地址（即您的 ISP 为您提供经常变化的动态地址），则可以使用若干免费的动态 DNS（简称 `DDNS` 或 `DynDNS`）服务之一，这些服务可以将您的动态\
  \ IP 地址映射到您的域名。\n\n一旦您配置了域名和名称服务器，下一步是安装并配置您的 Web 服务器。\n\n### 27.2 安装 Apache Web\
  \ 服务器软件包\n\nFedora 的当前版本通常不会默认安装 `Apache` Web 服务器。要检查服务器是否已安装，请运行以下命令：\n\n```bash\n\
  rpm -q httpd\n```\n\n如果 `rpm` 生成了类似下面的输出，则说明 `apache` 服务器已安装：\n\n```\nhttpd-2.4.41-9.fc31.x86_64\n\
  ```\n\n或者，如果 `rpm` 生成了“package httpd is not installed”的消息，那么下一步显然是安装它。要安装 `Apache`，请在提示符处运行以下命令：\n\
  \n```bash\ndnf install httpd\n```\n\n### 27.3 配置防火墙\n\n在启动和测试 `Apache` Web 服务器之前，需要修改防火墙以允许\
  \ Web 服务器与外界通信。默认情况下，`HTTP` 和 `HTTPS` 协议分别使用端口 80 和 443，因此，根据所使用的协议，需要打开这些端口中的一个或两个。打开端口时，请务必指定适用于互联网的网络连接的防火墙区域：\n\
  \n```bash\nfirewall-cmd --permanent --zone=<zone> --add-port=80/tcp\n```\n\n```bash\n\
  firewall-cmd --permanent --zone=<zone> --add-port=443/tcp\n```\n\n打开必要的端口后，请务必重载防火墙设置：\n\
  \n```bash\nfirewall-cmd --reload\n```\n\n在云托管服务器上，可能还需要在云控制台中为服务器实例启用相应的端口。请查看云提供商的文档以获取如何执行此步骤。\n\
  \n### 27.4 端口转发\n\n如果托管 Web 服务器的 Fedora 31 系统位于受防火墙保护的网络上（可以是另一台运行防火墙的计算机，或者是内置防火墙保护的路由器或无线基站），您将需要配置防火墙将端口\
  \ 80 和/或端口 443 转发到您的 Web 服务器系统。执行此操作的机制在防火墙和设备之间不同，请检查您的文档以了解如何配置端口转发。\n\n### 27.5\
  \ 启动 Apache Web 服务器\n\n一旦安装了 Apache 服务器并配置了防火墙，下一步是验证服务器正在运行并在并在启动它。\n\n要从命令行检查\
  \ `Apache- httpd` 服务的状态，请在提示符输入以下内容：\n\n```bash\nsystemctl status httpd\n```\n\n\
  如果上述命令表明 `httpd` 服务未运行，则可以如下所示从命令行启动它：\n\n```bash\nsystemctl start httpd\n```\n\n\
  如果您希望 `Apache- httpd` 服务在系统启动时自动启动，请运行以下命令：\n\n```bash\nsystemctl enable httpd\n\
  ```\n\n### 27.6 测试 Web 服务器\n\n安装完成后，下一步是验证 Web 服务器是否已启动。\n\n如果您可以访问（本地或远程）服务器的桌面环境，只需启动\
  \ 浏览器并在地址栏中输入 `http://127.0.0.1`（`127.0.0.1` 是回环网络地址，告诉系统连接到本地）。如果一切设置正确，浏览器应该加载图\
  \ 27-1 所示的页面：\n\n![](img/fedora_web_test.png)\n\n图 1\n\n如果没有桌面环境，请使用本地网络上的另一个系统或分配给系统的外部\
  \ IP 地址进行连接。\n\n### 27.7 为域名配置 Apache Web 服务器\n\n设置 Web 服务器的下一步是为您的域名进行配置。要配置 Web\
  \ 服务器，首先更改目录到 `/etc/httpd`，该目录包含许多子目录。进入 `conf` 子目录，您将在那里找到一个名为 `httpd.conf` 的文件。\n\
  \n使用具有超级用户权限的编辑器编辑 `httpd.conf` 文件以确保您具有写入权限。一旦加载，许多设置需要更改以匹配环境。\n\n为特定域名配置 `Apache`\
  \ 的常用方法是在 `httpd.conf` 文件中添加虚拟主机项。这种方法的优点是可以通过为每个站点域名添加虚拟主机项，允许单个 Apache 服务器支持多个网站。在\
  \ `httpd.conf` 文件中，如下为您的域名添加虚拟主机项：\n\n```\n<VirtualHost *:80>\n  ServerAdmin feedback@myexample.com\n\
  \  ServerName www.myexample.com\n  DocumentRoot /var/www/myexample\n  ErrorLog logs/myexample_error_log\n\
  \  CustomLog logs/myexample_access_log combined\n</VirtualHost>\n```\n\n上述虚拟主机项中的\
  \ `ServerAdmin` 指令定义了联系网站管理员的管理员电子邮件地址。将其更改为相应的电子邮件地址。\n\n接下来，声明 `ServerName`，以便\
  \ Web 服务器知道与此虚拟主机关联的域名。\n\n由于服务器支持的每个网站将都有自己的组文件，`DocumentRoot` 设置用于指定此网站域名文件的位置。传统上使用\
  \ `/var/www/域名名称`，例如：\n\n`DocumentRoot /var/www/myexample`\n\n最后，添加访问历史和错误日志文件的条目。\n\
  \n创建 `httpd.conf` 文件中声明的 `/var/www/<域名>` 目录，并在其中放置一个包含基础 HTML 的 `index.html` 文件。例如：\n\
  \n```html\n<html>\n<title>Sample Web Page</title>\n<body>\nWelcome to MyExample.com\n\
  </body>\n</html>\n```\n\n\n\n最后一步是重启 `httpd` 服务以确保它加载了我们新的设置：\n\n```\nsystemctl\
  \ restart httpd\n```\n\n最后，通过打开浏览器窗口并使用域名而不是 IP 地址访问该站点，检查服务器配置是否正常工作。加载的网页应该是您之前创建的\
  \ `index.html` 文件中定义的那个页面。\n\n# 27.8 安全网站的基础\n\n本章到目前为止创建的 Web 服务器和网站使用基于 80 端口的\
  \ HTTP 协议，因此被认为是不安全的。问题在于 Web 服务器与客户端（通常是用户的 Web 浏览器）之间的流量是以明文形式传输的。换句话说，数据未经过加密，且容易被拦截。虽然对于一般的\
  \ Web 浏览来说这不是问题，但在执行诸如登录网站或传输身份或信用卡详情等敏感信息等任务时，这是一个严重的弱点。\n\n如今，网站被要求使用 HTTPS，它使用安全套字层（SSL）或传输层安全协议（TLS）在\
  \ Web 服务器和客户端之间建立安全的加密通信。这种安全性是通过结合使用公钥、私钥、会话加密以及证书建立的。\n\n为了支持 HTTPS，网站必须拥有由受信任机构颁发的证书，该机构被称为证书颁发机构（CA）。当浏览器连接到安全网站时，Web\
  \ 服务器会返回一份网站的 SSL 证书副本，该证书还包含站点公钥的副本。随后浏览器通过受信任的证书颁发机构验证证书的真实性。\n\n如果发现证书有效，浏览器将使用服务器发送的公钥加密会话密钥并将其传递给服务器。服务器使用私钥解密会话密钥，并使用它向浏览器发送加密确认。一旦完成此过程，浏览器和服务器将使用会话密钥加密所有后续数据传输，直到会话结束。\n\
  \n# 27.9 为 Apache 配置 HTTPS\n\n默认情况下，Apache 服务器不包含实现安全 HTTPS 网站所需的模块。因此，第一步是在服务器系统中安装\
  \ Apache `mod_ssl` 模块，命令如下：\n\n```\ndnf install mod_ssl\n```\n\n安装完成后重启 `httpd`\
  \ 以将新模块加载到 Apache 服务器中：\n\n```\nsystemctl restart httpd\n```\n\n使用以下命令检查模块是否已加载到服务器：\n\
  \n```\napachectl -M | grep ssl_module\n```\n\n`ssl_module (shared)`\n\n假设模块已安装，下一步是为网站生成\
  \ SSL 证书。\n\n# 27.10 获取 SSL 证书\n\n网站的证书必须从证书颁发机构获取。有多种不同价格的选择。然而，到目前为止最好的选项是从以下\
  \ URL 从 Let’s Encrypt 获取免费证书：\n\nhttps://letsencrypt.org/\n\n从 Let’s Encrypt 获取证书的过程简单来说就是涉及安装和运行\
  \ `Certbot` 工具。该工具将扫描服务器上的 `httpd.conf` 文件，并提供为系统上配置的任何虚拟主机生成证书的选项。随后，它将生成证书并在 Apache\
  \ 配置中专门为相应的网站添加虚拟主机条目。\n\n按照 Let’s Encrypt 网站上的步骤在您的 Fedora 31 系统上下载并安装 Certbot，然后按照如下方式运行\
  \ `certbot-auto` 工具来生成并安装证书：\n\n```\ncertbot-auto --apache\n```\n\n在请求电子邮件地址并寻求接受服务条款后，Certbot\
  \ 将列出 `httpd.conf` 文件中找到的域名，并提供选择一个或多个站点以安装证书的选项。随后，Certbot 在获取并在系统上安装证书之前执行一些检查：\n\
  \n您想为哪些名称激活 HTTPS？\n\n- - - - - - - - - - - - - - - - - - - - - - - - - - - - -\
  \ - - - - - - - - - - -\n\n1: www.myexample.com\n\n- - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - - - - -\n\n选择用逗号和/或空格分隔的相应数字，或留空输入以选择显示的所有选项（输入\
  \ ‘c’ 取消）：1\n\n正在获取新证书\n\n正在执行以下挑战：\n\nhttp-01 challenge for www.myexample.com\n\
  \n等待验证中...\n\n清理挑战\n\n在 `/etc/httpd/conf/httpd-le-ssl.conf` 创建了 SSL 虚拟主机\n\n将证书部署到虚拟主机\
  \ `/etc/httpd/conf/httpd-le-ssl.conf`\n\n通过在根配置中添加 Include 来启用站点 `/etc/httpd/conf/httpd-le-ssl.conf`\n\
  \nCertbot 还会在 `/etc/httpd/conf/` 目录下创建一个名为 `httpd-le-ssl.conf` 的新文件，其中包含每个已生成证书的域名的安全虚拟主机条目。这些条目将类似于：\n\
  \n```\n<IfModule mod_ssl.c>\n<VirtualHost *:443>\n    ServerAdmin feedback@myexample.com\n\
  \    ServerName www.myexample.com\n    DocumentRoot /var/www/myexample\n    ErrorLog\
  \ logs/myexample_error_log\n    CustomLog logs/myexample_access_log combined\nSSLCertificateFile\
  \ /etc/letsencrypt/live/www.myexample.com/fullchain.pem\nSSLCertificateKeyFile /etc/letsencrypt/live/www.myexample.com/privkey.pem\n\
  Include /etc/letsencrypt/options-ssl.conf\n</VirtualHost>\n</IfModule>\n```\n\n\
  最后，Certbot 将询问是否将未来的 HTTP 请求重定向到 HTTPS。换句话说，如果用户访问 `http://www.myexample.com`，Web\
  \ 服务器将其重定向到 `https://www.myexample.com`：\n\n- - - - - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - -\n\n1: 不重定向 - 对 Web 配置不做任何进一步更改。\n\n\
  2: 重定向 - 将所有请求重定向到 HTTPS。对于新站点或如果您确定站点在 HTTPS 上正常请选择此项。可以通过编辑服务器配置来撤销此更改。\n\n- -\
  \ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -\n\n\
  选择相应的数字 [1-2] 然后回车（输入 ‘c’ 取消）：2\n\n如果您正在测试 HTTPS 配置并希望保留 HTTP 版本，请选择不重定向选项。否则，通常建议重定向到\
  \ HTTPS。\n\n一旦安装了证书，可以在浏览器通过以下 URL 进行测试（将 myexample.com 替换为您的域名）：\n\nhttps://www.ssllabs.com/ssltest/analyze.html?d=www.myexample.com\n\
  \n如果证书配置成功，SSL Labs 将提供如图 27-2 所示的高评分：\n\n![SSL Labs Report](img/rehel_8_ssl_labs_report.png)\n\
  \n图 27-2 \n\n作为最后的测试，打开浏览器窗口并使用 `https://` 前缀访问您的域名。页面应像以前一样加载，浏览器应显示浏览器与服务器之间的连接是安全的（通常由地址栏中的锁头图标指示，点击它可以获取更多信息）：\n\
  \n![](img/rehel_8_web_site_secure.png)\n\n图 27-3\n\n### 27.11 总结\n\n可以通过安装 Apache\
  \ Web 服务器使用 Fedora 31 系统托管网站。在 Fedora 31 上可以部署不安全的（HTTP）和安全的（HTTPS）网站。安全网站使用安全套字层（SSL）或传输层安全协议（TLS），通过受信任证书颁发机构颁发的证书，在\
  \ Web 服务器和客户端之间建立加密通信。\n\n## 28. 为 Fedora 31 配置 Postfix 邮件服务器\n\n\n\n\n除了作为 Web\
  \ 服务器外，电子邮件也是 Fedora 31 系统的主要用途之一，特别是在业务环境中。鉴于电子邮件的重要性和流行程度，一些人发现 Linux 系统上的电子邮件结构如此复杂会感到惊讶，而这种复杂性对于\
  \ Fedora 31 的初学者来说往往让他们有些无从从。\n\n好消息是，大部分复杂性是为了让经验丰富的电子邮件管理员为大型企业部署实施复杂的配置。事实是，对于大多数\
  \ Linux 管理员来说，建立一个基础电子邮件系统使用户能够发送和接收邮件是相对简单的。\n\n在《Fedora 31 精要》的这一章中，我们将解释基于 Linux\
  \ 的电子邮件配置的基础知识，并逐步介绍配置基础电子邮件环境。为了提供核心内容，我们将电子邮件系统的复杂性留给关于该主题的进阶书籍。\n\n## 28.1 电子邮件系统的结构\n\
  \n一个完整的电子邮件系统由多个组件组成。以下是对每个组件的简单描述：\n\n### 28.1.1 邮件用户代理 (Mail User Agent)\n\n这是普通用户可能最熟悉的系统部分。邮件用户代理（`MUA`），或邮件客户端，是用于编写、发送和读取电子邮件消息的应用程序。任何在任何计算机上编写并发送过消息的人都使用过某种类型的邮件用户代理。\n\
  \nLinux 上典型的图形化 MUA 有 Evolution、Thunderbird 和 KMail。对于那些偏好基于文本的邮件客户端的用户，还有更传统的 `pine`\
  \ 和 `mail` 工具。\n\n### 28.1.2 邮件传输代理 (Mail Transfer Agent)\n\n邮件传输代理（`MTA`）是电子邮件系统的一部分，负责大部分将电子邮件消息从一台计算机传输到另一台计算机的工作（在本地局域网内或通过互联网传输到远程系统）。一旦正确配置，除非用户出于某种原因重新配置它，否则大多数用户不会与其选择的\
  \ MTA 有任何直接交互。Linux 有许多 MTA 可选择，包括 `sendmail`、`Postfix`、`Fetchmail`、`Qmail` 和 `Exim`。\n\
  \n### 28.1.3 邮件投递代理 (Mail Delivery Agent)\n\n基础设施的另一个通常对用户隐藏的部分——邮件投递代理（`MDA`），在后台运行并在邮件传输代理和邮件客户端（`MUA`）之间对电子邮件消息进行过滤。MDA\
  \ 最常见的形式是垃圾邮件过滤器，在所有不需要的电子邮件消息到达用户邮件客户端（`MUA`）收件箱之前将其从系统中移除。流行的 MDA 有 `Spamassin`\
  \ 和 `Procmail`。要注意，某些邮件用户代理应用程序（如 Evolution、Thunderbird 和 KMail）包含了自身的 MDA 过滤。而其他的如\
  \ `Pine` 和 `Basla` 则没有。这可能成为 Linux 初学者的困惑来源。\n\n### 28.1.4 SMTP\n\nSMTP 是简单邮件传输协议（Simple\
  \ Mail Transport Protocol）的缩写。这是电子邮件系统用于将邮件从一个服务器传输到另一个服务器的协议。该协议本质上是 MTA 用于通信和往返消息的语言。\n\
  \n### 28.1.5 SMTP 中继 (SMTP Relay)\n\nSMTP 中继是一种允许使用外部 SMTP 服务器来发送电子邮件而不是托管本地 SMTP\
  \ 服务器的协议。这通常涉及使用如 `MailJet`、`SendGrid` 或 `MailGun` 等服务。这些服务避免了配置和维护自己 SMTP 服务器的必要，并通常提供分析等额外收益。\n\
  \n### 28.2 配置 Fedora 31 电子邮件服务器\n\n许多系统使用 `Sendmail` MTA 来传输电子邮件消息，在许多 Linux 发行版中，它是默认的邮件传输代理。然而，`Sendmail`\
  \ 是一个复杂的系统，对于初学者和经验丰富的用户来说都难以理解和配置。它也正在失去青睐，因为它被认为处理电子邮件消息的速度比许多较新的 MTA 慢。\n\n许多系统管理员现在正使用\
  \ `Postfix` 或 `Qmail` 来处理电子邮件。这两者都比 `Sendmail` 更快且更容易配置。\n\n因此，为了本章的目的，我们将 `Postfix`\
  \ 视为 MTA，因为它简单且流行。如果你更倾向于使用 `Sendmail`，有很多专门研究该主题的书，它们比我们在本章中的讲解深入得多。\n\n作为第一步，本章将涵盖\
  \ Fedora 31 系统作为完整电子邮件服务器的配置。在章节后半部分，还将涵盖使用 SMTP 中继服务的步骤。\n\n### 28.3 Postfix 安装前的步骤\n\
  \n在安装 `Postfix` 之前的第一步是确保 `Sendmail` 已经在你的系统上运行。你可以使用以下命令检查此项：\n\n```bash\nsystemctl\
  \ status sendmail\n```\n\n如果未安装 `sendmail`，工具将显示类似下面的消息：\n\n```\nUnit sendmail.service\
  \ could not be found.\n```\n\n如果 `sendmail` 在你的系统上运行，则在安装和配置 Postfix 之前必须停止它。停止\
  \ `sendmail` 请运行以下命令：\n\n```bash\nsystemctl stop sendmail\n```\n\n下一步是确保 `sendmail`\
  \ 在系统重启时不会自动重启：\n\n```bash\nsystemctl disable sendmail\n```\n\n`Sendmail` 现在已关闭并配置为在系统启动时不自动启动。可选地，若要从系统中完全删除\
  \ `sendmail`，请运行以下命令：\n\n```bash\ndnf remove sendmail\n```\n\n## 28.4 防火墙/路由器配置\n\
  \n由于电子邮件的发送和接收涉及网络连接，需要使用 `firewall-cmd` 工具将 `smtp` 服务添加到防火墙中：\n\n```bash\nfirewall-cmd\
  \ --permanent --add-service=smtp\n```\n\n配置服务器与互联网之间的任何防火墙或路由器允许 25、143 和 587 端口的连接也是重要的，如果需要的话。\n\
  \n完成这些初始操作后，我们现在开始安装 Postfix。\n\n### 28.5 在 Fedora 31 上安装 Postfix\n\n默认情况下，Fedora\
  \ 31 的安装过程为大多数配置安装 Postfix。要验证是否已安装 Postfix，使用以下 `rpm` 命令：\n\n```bash\nrpm -q postfix\n\
  ```\n\n如果 `rpm` 报告未安装 postfix，可以通过以下方式安装：\n\n```bash\ndnf install postfix\n```\n\
  \n`dnf` 工具将下载并安装 Postfix，并在 `/etc/passwd` 文件中配置特殊的 postfix 用户。\n\n### 28.6 配置 Postfix\n\
  \nPostfix 的主配置设置位于 `/etc/postfix/main.cf` 文件。互联网上有许多资源提供 Postfix 的详细信息，因此本节将重点介绍运行电子邮件所需的\
  \ {选项。\n\n`main.cf` 文件中的关键选项有：\n\n```ini\nmyhostname = mta1.domain.com\nmydomain\
  \ = domain.com\nmyorigin = $mydomain\nmydestination = $myhostname, localhost.$mydomain,\
  \ localhost, $mydomain\ninet_interfaces = $myhostname\nmynetworks = subnet\n```\n\
  \n其他设置已由安装过程为你设置，除非你想冒险并配置更复杂的电子邮件系统，否则不需要它们。\n\n`myhostname` 的格式为 `host.domain.extension`。例如，如果你的\
  \ Linux 系统名为 `MyLinuxHost` 且互联网域名为 `MyDomain.com`，则应如下设置 `myhostname` 选项：\n\n```ini\n\
  myhostname = mylinuxhost.mydomain.com\n```\n\n`mydomain` 设置只是上述设置中的域名部分。例如：\n\n\
  ```ini\nmydomain = mydomain.com\n```\n\n`myorigin` 设置定义了输出邮件到达收件人收件箱时看起来来自哪个域名称，并应设置为你的域名：\n\
  \n```ini\nmyorigin = $mydomain\n```\n\n\n\n\n\n也许是最关键的参数之一 `mydestination` 与入的的消息有关，它声明了此服务器作为最终投递地地的域名。任何发送至此列表中域名的入站邮件都将被视为中继请求，根据\
  \ `mynetworks` 设置（下文将概述），中继请求通常将导致投递失败。\n\n`inet_interfaces` 设置定义了系统上允许 postfix\
  \ 接收电子邮件的网络接口，通常被设置为 `all`：\n\n```\ninet_interfaces = all\n```\n\n`mynetworks` 设置定义了哪些外部系统被信任可以使用该服务器作为\
  \ SMTP 中继器。该设置的可能值如下：\n\n- `host` - 仅信任本地系统。所有外部客户端尝试使用服务器作为中继的尝试都将被拒绝。\n- subnet\
  \ - 仅允许位于同一网络子网的系统使用服务器作为中继。例如，如果服务器的 IP 地址为 `192.168.1.29`，则 IP 地址为 `192.168.1.30`\
  \ 的客户端系统将能够使用该服务器作为中继。\n- `class` - 同一 IP 地址类（A、B 和 C）内的任何系统均可以使用该服务器作为中继。\n\n信任的\
  \ IP 地址也可以通过指定子网、地址范围或引用模式文件来手动定义。以下示例将本地主机和子网 `192.168.0.0/24` 声明为信任 IP 地址。\n\n\
  ```\nmynetworks = 192.168.0.0/24, 127.0.0.0/8\n```\n\n对于此示例，将属性设置为 `subnet`，这样与服务器同一本地网络上的任何其他系统都能通过\
  \ SMTP 中继发送电子邮件，同时防止外部系统这样做。\n\n```\nmynetworks = subnet\n```\n\n## 28.7 配置 DNS\
  \ MX 记录\n\n当你在注册商处注册并配置你的域名时，DNS 设置中将已经配置了一系列默认值。其中之一就是所谓的邮件交换器（MX 记录）记录。该记录从根本上定义了发送至你域名的邮件应该发送到何处，通常默认设置为由注册商提供的邮件服务器。如果你在托管自己的邮件服务器，MX\
  \ 记录应设置为你的域名或你邮件服务器的地址。如何进行此更改的步骤将取决于你的域名注册商，但通常涉及编辑域名的 DNS 信息，并进行添加或编辑现有的 MX 记录，使其指向你的邮件服务器。\n\
  \n### 28.8 在 Fedora 31 系统上启动 Postfix\n\n一旦 `/etc/postfix/main.cf` 文件配置了正确的设置，现在是启动\
  \ postfix 的时候了。可以通过以下命令行方式实现：\n\n```\n# systemctl start postfix\n```\n\n若要配置 postfix\
  \ 在系统启动时自动启动，请运行以下命令：\n\n```\n# systemctl enable postfix\n```\n\npostfix 进程现在应该已经启动。验证一切运行正常的良好方法是检查你的邮件日志。这通常在\
  \ `/var/log/maillog` 文件中，现在应该包含一条类似于输出的条目：\n\n```\nMar 25 11:21:48 demo-server postfix/postfix-script[5377]:\
  \ starting the Postfix mail system\nMar 25 11:21:48 demo-server postfix/master[5379]:\
  \ daemon started -- version 3.3.1, configuration /etc/postfix\n```\n\n只要没有记录错误信息，你就成功安装并启动了\
  \ postfix，并准备好测试 postfix 配置了。\n\n### 28.9 测试 Postfix\n\n测试 postfix 配置的一种简单方法是在系统上的本地用户之间发送邮件消息。要进行快速测试，请按如下所示使用\
  \ `mail` 工具（其中 `name` 和 `mydomain` 分别替换为系统上的用户名和你的域名）：\n\n```\n# mail name@mydomain.com\n\
  ```\n\n在收到提示时，为邮件消息输入主题，然后输入正文文本。要发送邮件消息，只需按 `Ctrl-D`。例如：\n\n```\n# mail neil@mydomain.com\n\
  \nSubject: Test email message\n\nThis is a test message.\n\nEOT\n```\n\n再次运行 `mail`\
  \ 命令，这次使用另一个用户，并验证消息是否已发送并接收：\n\n```\n$ mail\nHeirloom Mail version 12.5 7/5/10\\\
  . Type ? for help.\n\"/var/spool/mail/neilsmyth\": 1 message 1 new\n>N 1 root Mon\
  \ Mar 25 13:36 18/625 \"Test email message\"\n&\n```\n\n如果消息没有出现，请检查日志文件（`/var/log/maillog`）中的错误。成功的邮件投递将如下所示出现在日志文件中：\n\
  \n```\nMar 25 13:41:37 demo-server postfix/pickup[7153]: 94FAF61E8F4A: uid=0 from=<root>\n\
  Mar 25 13:41:37 demo-server postfix/cleanup[7498]: 94FAF61E8F4A: message-id=<20190325174137.94FAF61E8F4A@demo-server.mydomain.com>\n\
  Mar 25 13:41:37 demo-server postfix/qmgr[7154]: 94FAF61E8F4A: from=<root@mydomain.com>,\
  \ size=450, nrcpt=1 (queue active) status=sent\n```\n\n### 28.10 通过 SMTP 中继发送邮件\n\
  \n配置邮件服务器来处理出邮件的另一种方法是使用 SMTP 中继服务。正如之前讨论的，有很多服务可用，大多数可以通过搜索“SMTP Relay”来找到。本节剩余部分假设\
  \ postfix 已经安装在你的系统上，并且已完成所选 SMTP Relay 需要的所有步骤。\n\n从编辑 `/etc/postfix/main.cf` 文件并使用域名配置\
  \ `myhostname` 参数开始：\n\n```\nmyhostname = mydomain.com\n```\n\n接下来，在 `/etc/postfix/`\
  \ 创建名为 `sasl_passwd` 的新文件，并添加包含中继服务提供的邮件主机、用户名和密码的行。例如：\n\n```\n[smtp.myprovider.com]:587\
  \ neil@mydomain.com:password\n```\n\n注意上述条目中也指定了端口 587。如果没有此设置，postfix 将默认使用大多数\
  \ SMTP Relay 服务拦截的端口 25。\n\n密码文件创建后，使用 `postmap` 工具生成包含邮件凭据的哈希数据库：\n\n```\n# postmap\
  \ /etc/postfix/sasl_passwd\n```\n\n采取额外的步骤保护你的 postfix 凭据：\n\n```\n# chown root:root\
  \ /etc/postfix/sasl_passwd /etc/postfix/sasl_passwd.db\n# chmod 0600 /etc/postfix/sasl_passwd\
  \ /etc/postfix/sasl_passwd.db\n```\n\n再次编辑 `main.cf` 文件并添加指定中继服务器的条目：\n\n```\nrelayhost\
  \ = [smtp.myprovider.com]:587\n```\n\n在 `main.cf` 文件中，添加以下行以配置 SMTP 服务器的身份验证设置：\n\
  \n```\nsmtp_use_tls = yes\nsmtp_sasl_auth_enable = yes\nsmtp_sasl_password_maps\
  \ = hash:/etc/postfix/sasl_passwd\nsmtp_tls_CAfile = /etc/ssl/certs/ca-bundle.crt\n\
  smtp_sasl_security_options = noanonymous\nsmtp_sasl_tls_security_options = noanonymous\n\
  ```\n\n最后，重启 postfix 服务：\n\n```\n# systemctl restart postfix\n```\n\n一旦服务重启，使用 `mail`\
  \ 工具或你喜欢的邮件客户端尝试发送和接收邮件。\n\n### 28.11 总结\n\n\n\n\n\n一个完整的端到端邮件系统由邮件用户代理（MUA）、邮件传输代理（MTA）、邮件传递代理（MDA）和\
  \ SMTP 协议组成。Fedora 31 在 MTA 解决方案方面提供了多种选择，其中最流行的之一是 Postfix。本章概述了如何在 Fedora 31 系统上安装、配置和测试\
  \ postfix，使其既可以作为邮件服务器运行，也可以使用第三方 SMTP 中继服务器发送和接收电子邮件。\n\n# 29. 为 Fedora 31 系统添加新硬盘驱动\n\
  \n如今用户和系统管理员面临的首要问题之一是，系统往往会耗尽用于存储数据的磁盘空间。幸运的是，磁盘空间现在是是最廉价的 IT 通用商品之一。在接下来的两个章节中，我们将介绍配置\
  \ Fedora 31 以使用通过安装新物理或虚拟硬盘驱动器提供空间的必要步骤。\n\n### 29.1 挂载的文件系统或逻辑卷\n\n在 Fedora 31\
  \ 系统上配置新硬盘驱动有两种方法。一种非常简单的方法是在新硬盘上创建一个或多个 Linux 分区，在这些分区上创建 Linux 文件系统，然后将它们挂载到特定的挂载点以便访问。本章将涵盖这种方法。\n\
  \n另一种方法是将新空间添加到现有的卷组或创建一个新的卷组。当安装 Fedora 31 时，会创建一个命名为 `.` 的卷组。该卷组中有三个命名为 `root`、`home`\
  \ 和 `swap` 的逻辑卷，分别用于存储 `/` 和 `/home` 文件系统以及交换分区。通过将新磁盘配置为卷组的一部分，我们能够增加现有逻辑卷的可用磁盘空间。因此，使用这种方法，我们可以通过将新硬盘上的部分或全部空间分配给\
  \ home 卷，来增加 `/home` 文件系统的大小。此主题将在“向 Fedora 31 卷组和逻辑卷添加新硬盘”中进行详细讨论。\n\n## 29.2 查找新硬盘\n\
  \n本教程假设系统已安装了新的物理或虚拟硬盘，并且对操作系统可见的。一旦添加，新硬盘应该被操作系统自动检测到。通常，系统中的硬盘驱动器被分配为以 `hd` 或\
  \ `sd` 开头的设备名称，后跟着一个字母来指示设备号。例如，第一个设备可能是 `/dev/sda`，第二个可能是 `/dev/sdb`，以此此类推。\n\n\
  以下是一个仅连接到 SATA 控制器的系统输出：\n\n```bash\nls /dev/sd*\n/dev/sda /dev/sda1 /dev/sda2\n\
  ```\n\n这显示由 `/dev/sda` 表示的硬盘驱动器本身被分为 2 个分区，分别由 `/dev/sda1` 和 `/dev/sda2` 表示。\n\n\
  以下是安装第二个硬盘驱动器后同一系统的输出：\n\n```bash\nls /dev/sd*\n/dev/sda /dev/sda1 /dev/sda2 /dev/sdb\n\
  ```\n\n如上所示，新硬盘已被分配给设备文件 `/dev/sdb`。目前该硬盘没有显示任何分区（因为我们还没有创建任何分区）。\n\n此时，我们有两种选择：在新硬盘上创建分区和文件系统并挂载它们访问，或者将磁盘作为物理卷作为卷组的一部分。要执行前者，请继续阅读本章；否则请阅读“向\
  \ Fedora 31 卷组和逻辑卷添加新硬盘”以获取配置逻辑卷的详细信息。\n\n### 29.3 创建 Linux 分区\n\n下一步是在新硬盘驱动器上创建一个或多个\
  \ Linux 分区。这是通过 `fdisk` 工具实现的，该工具接受命令行参数接收需要分区的设备：\n\n```bash\nfdisk /dev/sdb\n\
  Welcome to fdisk (util-linux 2.32.1).\nChanges will remain in memory only, until\
  \ you decide to write them.\n在使用 write 命令前要小心。\nDevice does not contain a recognized\
  \ partition table.\nCreated a new DOS disklabel with disk identifier 0xbd09c991.\n\
  Command (m for help):\n```\n\n为了查看磁盘上的当前分区，输入 `p` 命令：\n\n```bash\nCommand (m for\
  \ help): p\nDisk /dev/sdb: 8 GiB, 8589934592 bytes, 16777216 sectors\nUnits: sectors\
  \ of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes / 512 bytes\n\
  I/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel type: dos\nDisk identifier:\
  \ 0xbd09c991\n```\n\n从上面的 `fdisk` 输出中可以看到，磁盘目前没有分区，因为它是一个之前未使用的磁盘。下一步是在磁盘上创建一个新新分区，该任务通过输入\
  \ `n`（新建分区）和 `p`（主分区）来完成：\n\n```bash\nCommand (m for help): n\nPartition type\n\
  \    p primary (0 primary, 0 extended, 4 free)\n    e extended (container for logical\
  \ partitions)\nSelect (default p): p\n```\n\n在这个示例中，我们只计划创建一个分区，它将是分区 `1`。接下来我们需要指定分区从哪里开始和结束。由于这是第一个分区，我们需要它从第一个可用扇区开始，由于我们想使用整个磁盘，我们指定最后一个扇区。\n\
  \n```bash\nPartition number (1-4, default 1): 1\nFirst sector (2048-1677215, default\
  \ 2048): 2048\nLast sector, +size{K,M,G}: 1677215\nCreated a new partition 1 of\
  \ ‘Linux’ and size 8 GiB.\n```\n\n现在我们指定了分区，需要使用 `w` 命令将其写入磁盘：\n\n```bash\nCommand\
  \ (m for help): w\nThe partition table has been altered.\nCalling ioctl() to re-read\
  \ partition table.\nSyncing disks.\n```\n\n如果我们现在查看设备，将看到新分区为 `/dev/sdb1`：\n\n```bash\n\
  ls /dev/sd*\n/dev/sda /dev/sda1 /dev/sda2 /dev/sdb /dev/sdb1\n```\n\n下一步是在我们的分区上创建文件系统。\n\
  \n### 29.4 在 Fedora 31 磁盘上创建文件系统\n\n我们现在有一个安装好的磁盘，它对 Fedora 31 可见，并且我们在磁盘上配置了一个分区。下一步是在分区上创建一个文件系统，以便操作系统可以使用。在分区上创建文件系统的简单方法是使用\
  \ `mkfs.xfs` 工具：\n\n```bash\nmkfs.xfs /dev/sdb1\nmeta-data=/dev/sdb1 isize=512 agcount=4\
  \ agsize=524224 blks\n    sectsz=512 attr=2 projid32bit=1\n    crc=1 finobt=1 sparse=1\
  \ rmapbt=0\n    reflink=1\ndata = bsize=4096 blocks=2096896, imaxpct=25\n    sunit=0\
  \ swidth=0 blks\nnaming =version 2 bsize=4096 ascii-ci=0, ftype=1\nlog =internal\
  \ log bsize=4096 blocks=2560, version=2\n    sectsz=512 sunit=0 blks, lazy-count=1\n\
  realtime =none extsz=4096 blocks=0, rtextents=0\n```\n\n在这种情况下，我们创建一个 XFS 文件系统。XFS\
  \ 是一种高性能文件系统，是 Fedora 31 的默认文件系统类型，并在并行 I/O 性能和日志的使用方面有很多优势。\n\n## 29.5 日志文件系统概述\n\
  \n日志文件系统记录了磁盘写入期间对文件系统所做更改的日志或记录，这些记录可以快速恢复由于系统崩溃或停电等事件可能导致的损坏。\n\n\n\n\n使用日志文件系统有许多优点。多年来，磁盘驱动器存储的数据大小和容量都呈指数级增长。非日志文件系统的问题在于，在崩溃发生后必须运行\
  \ `fsck`（文件系统一致性检查）工具。`fsck` 工具将扫描整个文件系统，验证所有条目，并确保块被正确分配和引用。如果它发现损坏的条目，它将尝试修复问题。这里的问题有两方面：首先，`fsck`\
  \ 工具并不总是能够修复损坏，你最终会在 `lost+found` 目录中发现数据。这些数据是某个应用程序正在使用的数据，但系统不再知道它们是从哪里引用的。另一个问题是时间问题。在大型文件系统上完成\
  \ `fsck` 过程可能花费长时间，这可能导致无法接受的停机时间。\n\n另一方面，日志文件系统在每次写入期间都会在磁盘上的日志区域记录信息（日志和日志记录（log）不需要在同一块设备上）。这本质上是向文件系统提交的“提交意图”数据。记录的信息量是可以配置的，范围从不记录任何内容，到记录所谓的“元数据”（例如所有权、时间戳信息等），再到记录“元数据”以及要写入文件的数据块。一旦日志更新，系统随后会将实际数据写入文件系统的相应区域，并在日志中标记条目以表示数据已提交。\n\
  \n崩溃发生后，可以使用日志记录快速地将文件系统恢复上线，从而将使用 `fsck` 可能需要几分钟的操作缩短到几秒，额外的优点是数据丢失或损坏的概率大大降低。\n\
  \n### 29.6 挂载文件系统\n\n现在我们已经已经在新磁盘驱动器的 Linux 分区上创建了新的文件系统，我们需要挂载它以便对其进行访问和使用。为了实现这一点，我们需要创建一个挂载点。挂载点简单来说就是挂载文件系统的目录或文件夹。为了本示例的目的，我们将创建一个\
  \ `/backup` 目录以匹配我们的文件系统标签（尽管这些值并不一定匹配）：\n\n```\nmkdir /backup\n```\n\n然后可以使用 `mount`\
  \ 命令手动挂载文件系统：\n\n```\nmount /dev/sdb1 /backup\n```\n\n运行不带参数的 `mount` 命令将向我们显示所有当前已挂载的文件系统（包括我们的新文件系统）：\n\
  \n```\nmount\n```\nsysfs on /sys type sysfs (rw,nosuid,nodev,noexec,relatime,seclabel)\n\
  proc on /proc type proc (rw,nosuid,nodev,noexec,relatime)\n.\n.\n/dev/sdb1 on /backup\
  \ type xfs (rw,relatime,seclabel,attr2,inode64,noquota)\n```\n\n### 29.7 配置 Fedora\
  \ 31 自动挂载文件系统\n\n为了设置系统在启动时自动挂载新文件系统，需要在 `/etc/fstab` 文件中添加一个条目。`fstab` 条目的格式如下：\n\
  \n`<device> <dir> <type> <options> <dump> <fsck>`\n\n这些条目可以总结如下：\n\n- `<device>`\
  \ - 要挂载文件系统的设备。\n- `<dir>` - 用作文件系统挂载点的目录。\n- `<type>` - 文件系统类型（xfs, ext4 等）。\n\
  - `<options>` - 附加的物理文件系统挂载选项，例如将文件系统设为只读或控制任何用户是否可以挂载该文件系统。运行 `man mount` 以查看完整的选项列表。将此值设置法默认值将使用文件系统的默认设置（rw,\
  \ suid, dev, exec, auto, nouser, async）。\n- `<dump>` - 决定文件系统内容是否包含在 `dump` 工具执行的任何备份中。此设置很少使用，可以使用\
  \ 0 值禁用。\n- `<fsck>` - 在系统崩溃后是否由 `fsck` 检查文件系统，以及检查文件系统的顺序。对于像 XFS 这样带有日志的文件系统，应将其设置为\
  \ 0，表示不需要检查。\n\n接下来的示例显示了配置了的 `fstab` 文件，该文件用于在 `/dev/sdb1` 分区上自动挂载我们的 `/backup`\
  \ 分区：\n\n```\n/dev/mapper/fedora-root / xfs defaults 0 0\nUUID=59e0179f-33ba-4362-be0f-2ca29b147a4b\
  \ /boot xfs defaults 0 0\n/dev/mapper/fedora-swap none swap defaults 0 0\n/dev/sdb1\
  \ /backup xfs defaults 0 0\n```\n\n`/backup` 文件系统现在每次系统重启时都会自动挂载。\n\n### 29.8 使用\
  \ Cockpit 添加磁盘\n\n除了使用本章概述的命令行工具处理存储工作外，还可以使用 Cockpit Web 控制台配置新的存储设备。要查看当前存储配置，登录\
  \ Cockpit 控制台并选择“Storage”（存储）选项，如图 29-1 所示：\n\n![](img/fedora_cockpit_storage.png)\n\
  图 29-1\n\n要找到新添加的存储，滚动到 Storage 页面底部直到显示 Drives（驱动器）部分：\n\n![](img/fedora_cockpit_storage_drives.png)\n\
  图 29-2\n\n在上述图形中，新磁盘是 8 GiB 磁盘。选择新磁盘以显示如图 29-3 所示的界面：\n\n![](img/fedora_cockpit_storage_info.png)\n\
  图 29-3\n\n点击 Create Table（创建表格）按钮，并在弹出的对话框中接受设置：\n\n![](img/fedora_cockpit_storage_table.png)\n\
  图 29-4\n\n点击 Create Partition（创建分区）按钮，并在对话框中指定分配给此分区的空间、文件系统类型（推荐 XFS）以及可选标签、挂载点挂载选项。注意，如果此分区没有使用所有空间，随后可以添加分区。要更改文件系统是否只读或在启动时挂载等设置，将\
  \ Mounting 选项更改为 Custom 并调整切换按钮设置：\n\n![](img/fedora_cockpit_storage_partition.png)\n\
  图 29-5\n\n一旦选好设置，点击 Create partition 按钮提交更改。创建过程完成后，新分区将添加到磁盘，创建的文件系统将挂载到指定的挂载点。\n\
  \n### 29.9 总结\n\n本章介绍了向现有 Fedora 31 系统添加附加物理或虚拟磁盘驱动器的主题。这是一个相对简单的过程，包括确保操作系统检测到新驱动器、在驱动器上创建分区，然后在分区上创建文件系统。虽然\
  \ Fedora 31 有多种不同的文件系统类型，但 XFS 通常是推荐选项。一旦文件系统准备就绪，可以使用 `mount` 命令进行挂载。为了让新创建的文件系统在系统启动时自动挂载，可以修改\
  \ `/etc/fstab` 配置文件。\n\n## 30. 向 Fedora 31 卷组和逻辑卷添加新磁盘\n\n在上一章中，我们查看了向 Fedora 31\
  \ 系统添加新磁盘驱动器、创建分区和文件系统并挂载该文件系统以便访问磁盘。创建固定分区和文件系统的替代方案是使用逻辑卷管理（LVM）创建一个或多个物理或虚拟磁盘或分区空间组成的逻辑磁盘。使用\
  \ LVM 的优势是可以根据需要向逻辑卷中添加或删除空间，而无需将数据分散在多个文件系统上。\n\n\n\n让我们以基于 Fedora 31 的服务器根目录（`/`）文件系统为例。如果没有\
  \ LVM，该文件系统在安装操作系统时将以特定的尺寸创建。如果安装了新的磁盘驱动器，则没有方法将该空间的任何部分分配给 `/` 文件系统。唯一的选择是在新磁盘上创建新的文件系统，并将它们挂载到特定的挂载点。在这种情况下，你会在新文件系统上拥有充足的空间，但\
  \ `/` 文件系统仍然几乎是满的。唯一的选择是将文件移动到新的文件系统。通过 LVM，可以将新磁盘（或其部分内容）分配给包含根文件系统的逻辑卷，从而动态地扩展可用空间。\n\
  \n在本章中，我们将介绍为了给 Fedora 31 系统的根文件系统添加额外空间，而向卷组和逻辑卷均添加新磁盘空间的必要步骤。\n\n### 30.1 逻辑卷管理\
  \ (LVM) 概述\n\n`LVM` 提供了一种灵活且高层的方法来管理磁盘空间。它不是将每个磁盘驱动器划分为固定大小的分区并在上面创建固定大小的文件系统，`LVM`\
  \ 提供了一种将磁盘空间组合为逻辑卷的方法，这些逻辑卷可以轻松地调整大小和移动。此外，`LVM` 允许管理员通过为这些用户分配不同的卷组或逻辑卷，仔细控制分配给不同用户组的磁盘空间。当分配给卷的空间耗尽时，管理员可以简单地增加更多空间，无需将用户文件移动到不同的文件系统。\n\
  \n`LVM` 由以下组件组成：\n\n### 30.1.1 卷组 (VG)\n`卷组` 是高层容器，容纳一个或多个逻辑卷和物理卷。\n\n### 30.1.2\
  \ 物理卷 (PV)\n`物理卷`代表存储设备，如磁盘驱动器或其他存储介质。\n\n### 30.1.3 逻辑卷 (LV)\n`逻辑卷`等同于磁盘分区，和磁盘分区一样，它可以包含文件系统。\n\
  \n### 30.1.4 物理区 (PE)\n每个物理卷 (`PV`) 被划分为等大小的块，称为物理区。\n\n### 30.1.5 逻辑区 (LE)\n每个逻辑卷\
  \ (`LV`) 被划分为等大小的块，称为逻辑区。\n\n假设我们正在创建一个名为 `VolGroup001` 的新卷组。该卷组运行需要物理磁盘空间，因此我们分配了三个磁盘分区\
  \ `/dev/sda1`、`/dev/sdb1` 和 `/dev/sdb2`。这些成为 `VolGroup001` 中的物理卷。然后我们在由这三个物理卷组成的卷组中创建一个名为\
  \ `LogVol001` 的逻辑卷。\n\n如果 `LogVol001` 的空间耗尽，我们只需添加更多磁盘分区作为物理卷，并将它们分配给卷组和逻辑卷。\n\n\
  ### 30.2 获取逻辑卷信息\n\n作为在 Fedora 31 中使用 `LVM` 的示例，我们将通过为标准 Fedora 31 安装的 `/` 文件系统添加空间的示例。考虑到根分区大小灵活性的需求，Fedora\
  \ 31 将 `/` 文件系统设置为名为 `fedora` 的卷组内的逻辑卷（称为 `root`）。在对 `LVM` 设置进行任何更改之前，首先收集信息是重要的。\n\
  \n运行 `mount` 命令将输出关于挂载点的信息，包括根文件系统的以下条目：\n\n```\n/dev/mapper/fedora-root on / type\
  \ xfs (rw,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k,noquota)\n```\n\
  \n可以使用 `vgdisplay` 命令获取有关卷组的信息：\n\n```bash\nvgdisplay\n\n  --- Volume group ---\n\
  \n  VG Name fedora\n  System ID\n  Format lvm2\n  Metadata Areas 1\n  Metadata Sequence\
  \ No 3\n  VG Access read/write\n  VG Status resizable\n  MAX LV 0\n  Cur LV 2\n\
  \  Open LV 2\n  Max PV 0\n  Cur PV 1\n  Act PV 1\n  VG Size <49.00 GiB\n  PE Size\
  \ 4.00 MiB\n  Total PE 12543\n  Alloc PE / Size 12543 / <49.00 GiB\n  Free PE /\
  \ Size 0 / 0\n  VG UUID h0TESz-3YJd-wsMl-T2GL-dHOp-rSPu-I4uxJO\n```\n\n如我们在上面的示例所示，`fedora`\
  \ 卷组的物理区大小为 `4.00MB`，总共有 49GB 可分配给逻辑卷。目前分配了 12542 个物理区，等于总容量。因此，如果我们想增加分配给 `fedora`\
  \ 卷组中任何逻辑卷的空间，我们需要添加一个或多个物理卷。`vgs` 工具也用于快速显示系统中卷组可用空间的概览：\n\n```bash\nvgs\n\n  VG\
  \ #PV #LV #SN Attr VSize VFree\n  fedora 1 2 0 wz--n- <49.00g 0\n```\n\n卷组中逻辑卷的信息同样可以使用\
  \ `lvdisplay` 命令获取：\n\n```bash\nlvdisplay\n\n  --- Logical volume ---\n  LV Name\
  \ root\n  attr -wi-a\n  VG Name fedora\n  LV Size 49.00Gi\n  PE Size 4.00MiB\n \
  \ Total PE 12542\n  Alloc PE / Size 12542 / 49.00Gi\n  Free PE / Size 0 / 0\n  LV\
  \ UUID h0TESz-3YJd-wsMl-T2GL-dHOp-rSPu-I4uxJO\n```\n\n\n\n在使用 `write` 命令之前请务必小心。\n\
  \n命令（m 获取帮助）：`d`\n\n分区编号（1,2，默认为 2）：`1`\n\n分区 1 已删除。\n\n命令（m 获取帮助）：`d`\n\n已选择分区\
  \ 2\n\n分区 2 已删除。\n\n命令（m 获取帮助）：`w`\n\n分区表已已修改。\n\n正在调用 `ioctl()` 重新读取分区表。\n\n正在同步磁盘。\n\
  \n在继续后续步骤之前，请务必删除 `/etc/fstab` 文件中针对这些文件系统的任何条目，以便系统在下次重启时不会尝试挂载它们。\n\n一旦磁盘准备就绪，下一步是使用\
  \ `pvcreate` 命令将此磁盘转换为物理卷（如果存在 dos 签名，则一并将其擦除）：\n\n```bash\npvcreate /dev/sdb\n\
  ```\n\n物理卷 `/dev/sdb` 已成功创建。\n\n如果创建失败并显示消息“Device /dev/<device> excluded by a filter”（设备被过滤器排除），则可能需要在创建物理卷之前使用\
  \ `wipefs` 命令擦除磁盘：\n\n```bash\nwipefs -a /dev/sdb\n```\n\n```\n/dev/sdb: 8 bytes\
  \ were erased at offset 0x00000200 (gpt): 45 46 49 20 50 41 52 54\n/dev/sdb: 8 bytes\
  \ were erased at offset 0x1fffffe00 (gpt): 45 46 49 20 50 41 52 54\n/dev/sdb: 2\
  \ bytes were erased at offset 0x000001fe (PMBR): 55 aa\n/dev/sdb: calling ioctl\
  \ to re-read partition table: Success\n```\n\n物理卷创建完成后，我们现在需要使用 `vgextend` 命令将其添加到卷组（在这种情况下为\
  \ fedora）：\n\n```bash\nvgextend fedora /dev/sdb\n```\n\n卷组 \"fedora\" 已成功扩展\n\n\
  新的物理卷现在已添加到卷组中，并准备好分配给逻辑卷。要执行此，我们运行 `lvextend` 工具，并提供我们想要扩展卷的大小。在本例中，我们希望将逻辑卷 root\
  \ 扩展 7 GB。注意，我们需要提供逻辑卷的路径，该路径可以通过 `lvdisplay` 命令获取（在本例中为 `/dev/fed/root`）：\n\n```bash\n\
  lvextend -L+7G /dev/fedora/root\n```\n\n```\nSize of logical volume fedora/root\
  \ changed from 15.00 GiB (3840 extents) to 22.00 GiB (5632 extents).\nLogical volume\
  \ fedora/root successfully resized.\n```\n\n该过程的最后一步是调整逻辑卷所在文件系统的大小，以便使用额外的空间。由于我们假设使用的是默认的\
  \ Fedora 31 安装以及 XFS 文件系统，可以使用 `xfs_growfs` 实用程序：\n\n```bash\nxfs_growfs /\n```\n\
  \n```\nmeta-data=/dev/mapper/fedora-root isize=512 agcount=4, agsize=983040 blks\n\
  \          = sectsz=512 attr=2, projid32bit=1\n          = crc=1 finobt=1, sparse=1,\
  \ rmapbt=0\n          = reflink=1\ndata = bsize=4096 blocks=3932160, imaxpct=25\n\
  \          = sunit=0 swidth=0 blks\nnaming =version 2 bsize=4096 ascii-ci=0, ftype=1\n\
  log =internal log bsize=4096 blocks=2560, version=2\n          = sectsz=512 sunit=0\
  \ blks, lazy-count=1\nrealtime =none extsz=4096 blocks=0, rtextents=0\ndata blocks\
  \ changed from 3932160 to 5767168\n```\n\n相反，如果文件系统类型为 ext2、ext3 或 ext4，在执行文件系统大小调整时应使用\
  \ `resize2fs` 实用程序：\n\n```bash\nresize2fs /dev/fedora/root\n```\n\n一旦调整完成，文件系统将扩展以以由新硬盘驱动器提供的额外空间。这一切都是在不移动任何文件甚至不需要重启服务器的情况下实现的。对于系统上的任何用户来说，什么都没有改变（当然，除了现在有更多的磁盘空间了）。\n\
  \n### 30.4 使用 Cockpit 为卷组添加额外空间\n\n除了本章目前概述的命令行工具外，还可以通过 Cockpit Web 界面中的 Storage（存储）页面如图\
  \ 30-1 所示，访问逻辑卷信息并对卷组和逻辑卷进行更改：\n\n![](img/fedora_lvm_cockpit.png)\n\n图 30-1\n\n\
  如果没有列出 Storage 选项，需要安装 `cockpit-storaged` 包并重启 cockpit 服务：\n\n```bash\ndnf install\
  \ cockpit-storaged\nsystemctl restart cockpit.socket\n```\n\n一旦 cockpit 服务重启，登录\
  \ Cockpit，此时 Storage 选项应该是可见的。登录 Cockpit 后，在 Storage 页面中向卷组添加新磁盘，点击图 30-2 所示的磁盘：\n\
  \n![](img/fedora_lvm_cockpit.png)\n\n图 30-2\n\n要扩展逻辑卷，滚动到图 30-3 所示的逻辑卷：\n\n![](img/fedora_lvm_cockpit.png)\n\
  \n图 30-3\n\n在生成的屏幕上，点击图 30-4 所示的 Add 按钮以选择磁盘：\n\n![](img/fedora_lvm_cockpit.png)\n\
  \n图 30-4\n\n要提交更改，使用滑块选择应添加的空间，并点击图 30-5 所示的 Grow 按钮：\n\n![](img/fedora_lvm_cockpit.png)\n\
  \n图 30-5\n\n完成这些步骤后，卷组将配置为使用空间。\n\n### 30.5 总结\n\n卷组和逻辑卷在存储设备之上提供了一个抽象层，提供了灵活分配空间的方法。本章概述了卷组、逻辑卷和物理卷的基础。\n\
  \n### 31 添加和管理交换空间\n\n维护系统性能的一部分是确保有足够的交换空间对应内存需求。因此，本章的目标是提供概述。\n\n### 31.1 什么是交换空间？\n\
  \n计算机系统具有有限的物理内存供操作系统使用。当操作系统接近内存限制时，它通过将内存页写入磁盘来释放空间。当操作系统需要任何这些页面时，会将它们读回内存。用于此任务的磁盘区域称为交换空间。\n\
  \n### 31.2 Fedora 31 的推荐交换空间\n\n为 Fedora 31 推荐的交换空间取决于多个因素，包括系统的内存量、对内存的负载以及系统是否需要支持休眠。目前\
  \ Fedora 31 交换空间的指南如下：\n\n| 安装内存量 | 推荐交换空间 | 启用休眠时的推荐交换空间 |\n| :--- | :--- | :---\
  \ |\n| 2GB 或少 | 内存 x 2 | 内存 x 3 |\n| 2GB - 8GB | 内存 x 1 | 内存 x 2 |\n| 8GB - 64GB\
  \ | 至少 4GB | 内存 x 1.5 |\n| 64GB 或更多 | 至少 4GB | 不建议休眠 |\n\n表 31-1\n\n当系统进入休眠时，当前系统状态被写入硬盘并关闭主机电源。当随后打开电源时，系统状态将从硬盘器恢复。这与挂起不同，挂起时系统状态存储在\
  \ RAM 中。机器进入睡眠状态，为系统 RAM 供电同时关闭其他设备。\n\n\n\n\n\n### 31.3 识别当前交换空间的使用情况\n\n可以通过多种方法识别\
  \ Fedora 31 系统当前使用的交换空间量。一种方法是输出 `/proc/swaps` 文件：\n\n```bash\ncat /proc/swaps\n\
  ```\nFilename Type Size Used Priority\n/dev/dm-1 partition 4169724 41484 -2\n\n\
  或者，可以使用 `swapon` 命令：\n\n```bash\nswapon\n```\nNAME TYPE SIZE USED PRIO\n/dev/dm-1\
  \ partition 4G 40.5M -2\n\n要查看交换空间相对于总体可用 RAM 的大小，可以使用 `free` 命令：\n\n```bash\nfree\n\
  ```\n      total used free shared buff/cache available\nMem: 4035436 1428276 2224596\
  \ 21968 382564 2360172\nSwap: 4169724 41484 41282400\n\n### 31.4 向 Fedora 31 系统添加交换文件\n\
  \n可以通过创建一个文件并将其分配为交换来为系统添加额外的交换空间。首先使用 `dd` 命令创建交换文件。可以通过调整 `count=` 变量更改文件的大小。例如，以下命令行创建了一个\
  \ 2.0 GB 的文件：\n\n```bash\ndd if=/dev/zero of=/newswap bs=1024 count=2000000\n```\n\
  2000000+0 records in\n2000000+0 records out\n2048000000 bytes (2.0 GB, 1.9 GiB)\
  \ copied, 3.62697 s, 565 MB/s\n\n在将该文件转换为交换文件之前，确保该文件设置了安全的权限至关重要：\n\n```bash\n\
  chmod 0600 /newswap\n```\n\n一旦创建了合适的文件，就需要使用 `mkswap` 命令将其转换为交换文件：\n\n```bash\n\
  mkswap /newswap\n```\nSetting up swapspace version 1, size = 1.9 GiB (2047995904\
  \ bytes)\nno label, UUID=4ffc238d-7fde-4367-bd98-c5c46407e535\n\n交换文件创建并配置后，可以使用\
  \ `swapon` 实用程序将其添加到系统中：\n\n```bash\nswapon /newswap\n```\n\n现在重新运行 `swapon` 应该报告新文件正被用作交换：\n\
  \n```bash\nswapon\n```\nNAME TYPE SIZE USED PRIO\n/dev/dm-1 partition 4G 0B -2\n\
  /newswap file 1.9G 0B -3\n\n```\n\n可以使用 `swapoff` 实用动态地移除交换空间，如下：\n\n```bash\nswapoff\
  \ /newswap\n```\n\n最后，修改 `/etc/fstab` 文件，通过添加以下行在系统启动时自动添加新交换空间：\n\n`/newswap swap\
  \ swap defaults 0 0`\n\n### 31.5 将分区作为交换空间\n\n作为指定文件为交换空间的替代方案，也可以将整个磁盘分区指定为交换。实现此目的的步骤与添加交换文件的步骤大部分相同。然而，在分配分区给交换之前，请确保相应文件系统上的任何现有数据已备份或不再需要，并且该文件系统已卸载。\n\
  \n假设在由 `/dev/sdb1` 表示的磁盘驱动器上存在分区，第一步将再次使用 `mkswap` 实用程序将其转换为交换分区：\n\n```bash\nmkswap\
  \ /dev/sdb1\n```\nmkswap: /dev/sdb1: warning: wiping old xfs signature.\nSetting\
  \ up swapspace version 1, size = 8 GiB (8587833344 bytes)\nno label, UUID=a899c8ec-c410-4569-ba18-ddea03370c7f\n\
  \n接下来，将新分区添加到系统交换空间并验证其确实已添加：\n\n```bash\nswapon /dev/sdb1\nswapon\n```\nNAME TYPE\
  \ SIZE USED PRIO\n/dev/dm-1 partition 4G 0B -2\n/dev/sdb1 partition 8G 0B -3\n\n\
  ```\n\n再次，可以如下修改 `/etc/fstab` 文件以在启动时自动添加交换分区：\n\n`/dev/sdb1 swap swap defaults\
  \ 0 0`\n\n### 31.6 为 Fedora 31 LVM 交换卷添加空间\n\n默认情况下，Fedora 31 使用逻辑卷管理 (LVM) 配置交换空间。因此，通过文件或磁盘分区添加交换的替代方案是扩展用于交换空间的逻辑卷。\n\
  \n第一步是使用 `lvdisplay` 实用程序识别当前的可用交换量以及用于交换空间的卷组和逻辑卷（有关 LVM 的更多信息，请参阅标题为[向 Fedora\
  \ 31 卷组和逻辑卷添加新磁盘]的章节）：\n\n```bash\nlvdisplay\n```\n  --- Logical volume ---\n  LV\
  \ Path /dev/fedora/swap\n  LV Name swap\n  VG Name fedora\n  LV UUID nJP0-Q6dx-Mfe3-4Aao-swa-ZiPd\n\
  \  LV Write Access read/write\n  LV Creation host, demoser,2020-01-16\n  LV Status\
  \ available#2\n  LV Size 5.00 GiB\n  Current LE 1280\n  Segments 1\n  Allocation\
  \ inherit Read ahead auto- set to 256\n\n显然，交换位于名为 `swap` 的逻辑卷上，它是 `fedora` 卷组的一部分。下一步是验证卷组是否有可以分配给交换的空间：\n\
  \n```bash\nvgs\n```\nVG #PV #LV #SN Attr VSize VFree\nfedora 2 3 0 wz--n- 197.66g\
  \ <2.00g\n\n如果可用空间满足交换需求，关闭交换并扩展逻辑卷以使用可用空间满足系统需求：\n\n```bash\nswapoff /dev/fedora/swap\n\
  lvextend -L+8GB /dev/fedora/swap\n```\n\n接下来，格式化交换卷并开启交换：\n\n```bash\nmkswap /dev/fedora/swap\n\
  ```\nmkswap: /dev/fedora/swap: warning: wiping signature.\nSetting up swapspace\
  \ version 1, size = 12 GiB (1275487368 bytes)\nno label, UUID=241a4818-e51c-4b8c-9bc9-1697fc226e\n\
  swapon /dev/fedora/swap\n\n```\n\n做出更改后，检查交换空间是否增加：\n\n```bash\nswapon\n```\nNAME\
  \ TYPE SIZE USED PRIO\n/dev/dm-1 partition 12G 0B\n\n#31.7 向卷组添加交换空间\n\n在上面的部分，我们扩展了交换卷以使用卷组中已有的空间。如果卷组没有可用空间，则在扩展交换之前需要添加空间。\n\
  \n开始检查卷组状态：\n\n```bash\nvgs\n```\nVG #PV #LV #SN Attr VSize VFree\nfedora 1 3 0\
  \ wz--n- <189.67g\n\n上面的输出表明卷组内没有可用空间。然而，假设我们需要为系统交换添加 8 GB。这显然需要向卷组添加更多空间。为了本示例，假设有一个大小为\
  \ 8 GB 且由 `/dev/sdb` 表示的磁盘添加到卷组。第一步是将此分区转换为物理卷：\n\n```bash\npvcreate /dev/sdb\n\
  ```\nPhysical volume \"/dev/sdb\" successfully created.\n\n如果创建失败并出现类似“Device /dev/sdb\
  \ excluded by a filter”的消息，则可能在创建物理卷之前需要擦除磁盘：\n\n```bash\nwipefs -a /dev/sdb\n```\n\
  /dev/sdb: 8 bytes were erased at offset 0x00000200 (gpt): 45 46 49 20 50 41 52 54\n\
  /dev/sdb: 8 bytes were erased at offset 0xfffffe00 (gpt): 45 46 49 20 50 41 52 54\n\
  /dev/sdb: 2 bytes were erased at offset 0x000001fe (PMBR): 55 aa\n/dev/sdb: calling\
  \ ioctl to re-read partition table: Success\n\n接下来，需要扩展卷组以使用此额外的物理卷：\n\n```bash\n\
  vgextend fedora /dev/sdb\n```\nVolume group \"fedora\" successfully extended\n\n\
  此时，`vgs` 命令应报告卷组增加了 8 GB 空间：\n\n```bash\nvgs\n```\nVG #PV #LV #SN Attr VSize VFree\n\
  fedora 2 3 0 wz--n- 197.66g <8.00g\n\n现在卷组中有了可用空间，可以扩展交换卷以利用该空间。首先，使用 `swapoff`\
  \ 实用程序关闭交换：\n\n```bash\nswapoff /dev/fedora/swap\n```\n\n接下来，扩展逻辑卷使用新空间：\n\n```bash\n\
  lvextend -L+7.9GB /dev/fedora/swap\n```\nRounding size to boundary between physical\
  \ extents: 7.90 GiB.\nSize of logical volume `/dev/fedora/swap` changed from <3.98\
  \ GiB (1018 extents) to <11.88 GiB (3041 extents).\nLogical volume `/dev/fedora/swap`\
  \ successfully resized.\n\n在逻辑卷上重新创建交换：\n\n```bash\nmkswap /dev/fedora/swap\n```\n\
  mkswap: /dev/fedora/swap: warning: wiping old swap signature.\nSetting up swapspace\
  \ version 1, size = 11.9 GiB (1275487368 bytes)\nno label, UUID=241a4818-e51c-4b8c-9bc9-1697fc226e\n\
  \n接下来，重新开启交换：\n\n```bash\nswapon /dev/fedora/swap\n```\n\n最后，使用 `swapon` 命令验证交换空间已添加到系统中。\n\
  \n\n\n\n\n# swapon\n\n```\nNAME TYPE SIZE USED PRIO\n/dev/dm-1 partition 11.9G 0B\
  \ -2\n```\n\n### 31.8 摘要\n\n### 交换空间 (Swap space)\n交换空间是几乎任何操作系统在处理内存资源受限情况时的至关组件。通过将内存区域交换到磁盘，系统能够继续运行并满足在其上的进程和应用程序的需求。\n\
  \nFedora 31 提供了一套指南，建议根据系统安装的 RAM 数量来分配基于磁盘的交换空间。。当这些建议证明不足时，可以为系统添加额外的交换空间，通常不需要重启。正如本章概述所示，交换空间可以通过文件、磁盘或磁盘分区的形式添加，也可以通过扩展已配置为交换空间的现有逻辑卷来添加。\n\
