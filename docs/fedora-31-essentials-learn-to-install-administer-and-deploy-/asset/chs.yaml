  \n  6-11\n\n \n\n### 7.2 Installing and Enabling Cockpit\n\n`Cockpit` is generally\
  \ not installed on Fedora 31 by default, but can be set up and enabled in a few\
  \ simple steps. The first step is to install the `Cockpit` package as follows:\n\
  \n```\ndnf install cockpit\n```\n\nNext, the `cockpit.socket` service needs to be\
  \ enabled:\n\n```\nsystemctl enable --now cockpit.socket\n```\n\nFinally, the necessary\
  \ ports need to be opened on the firewall to allow remote browser connections to\
  \ reach `Cockpit`:\n\n### 7.1 An Overview of Cockpit\n\n`Cockpit` is a light-weight,\
  \ web-based interface that allows general system administrative tasks to be performed\
  \ remotely. When installed and configured, the system administrator simply opens\
  \ a browser window and navigates to the Cockpit port. Behind the scenes, `Cockpit`\
  \ uses the same tools to perform tasks as would normally be used at the command-line,\
  \ and updates automatically to reflect changes occurring elsewhere on the system.\
  \ This allows `Cockpit` to be used in conjunction with other administration tools\
  \ and techniques without the risk of one approach overriding another. `Cockpit`\
  \ can also be configured to access more than one server, allowing multiple servers\
  \ to be administered and monitored simultaneously through a single browser session.\n\
  \n`Cockpit` is installed by default with a wide range of tools already bundled.\
  \ `Cockpit` also, however, allows additional extension plugins to be installed as\
  \ needed. `Cockpit` is also designed so that you can create your own extensions\
  \ using a combination of HTML and JavaScript to add missing or custom functionality.\n\
  \n`Cockpit`’s modular design also allows many features to be embedded into other\
  \ web-based applications.\n\n### 6.8 Summary\n\nAs with other desktop environments,\
  \ applications run on GNOME in windows. When multiple application windows are open,\
  \ the `Super + Tab` keyboard shortcut will display the switcher panel (Figure 6-7)\
  \ allowing a different window to be chosen as the currently active window (the `Super`\
  \ key is either the Windows key or, in the case of a Mac keyboard, the `Cmd` key):\n\
  \n![](img/fedora_31_gnome_app_tab.png)\n\nFigure 6-7\n\nIf a single application\
  \ has more than one window open, the switcher will display those windows in a second\
  \ panel so that a specific window can be selected:\n\n![](img/fedora_31_gnome_app_tab_multiple.png)\n\
  \nFigure 6-8\n\nTo cycle backwards through the icons in the switcher, use the `Shift\
  \ + Tab` keyboard shortcut.\n\nTo maximize a window so that it fills the entire\
  \ screen click the title bar and drag the window to the top of the screen. To return\
  \ the window to its original size, click on the title bar and drag downwards. Alternatively,\
  \ simply double-click on the title bar to toggle between window sizes. Similarly,\
  \ dragging a window to the left or right side of the screen will cause the window\
  \ to fill that half of the screen.\n\n### 6.5 Using Workspaces\n\nThe area of the\
  \ screen where the application windows appear is referred to as the workspace and\
  \ GNOME 3 allows multiple workspaces to be configured. To create a new workspace,\
  \ display the Activities overview and move the mouse pointer to the far right of\
  \ the screen to display the workspaces panel (Figure 6-9):\n\n![](img/fedora_31_gnome_workspaces.png)\n\
  \nFigure 6-9\n\nTo switch to a different panel, simply select it from the list.\
  \ To move a window from one workspace to another, display the workspaces panel and\
  \ drag and drop the application window (either the actual window from the current\
  \ workspace or the thumbnail window in the workspaces panel) onto the destination\
  \ workspace. When a window is added to a blank workspace, another blank workspace\
  \ is added to the workspace panel, allowing multiple workspaces to be created.\n\
  \nTo remove a workspace either close all the windows on that workspace, or move\
  \ them to another workspace.\n\n### 6.6 Calendar and Notifications\n\nWhen the system\
  \ needs to notify you of an event (such as the availability of system or application\
  \ updates), a popup panel will appear at the top of the workspace. Access to the\
  \ calendar and any previous notifications is available by clicking on the day and\
  \ time in the top bar as shown in Figure 6-10:\n\n![](img/fedora_31_gnome_notifications.png)\n\
  \nFigure 6-10\n\n### 6.7 Desktop Settings\n\nTo access the `Settings` application,\
