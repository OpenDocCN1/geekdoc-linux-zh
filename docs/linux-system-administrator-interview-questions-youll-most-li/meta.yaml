- md: '## 36: Have you ever been in a situation where one of your strengths became
    a weakness in an alternate setting?

    **Answer:** It''s important to show an awareness of yourself by having an answer
    for this question, but you want to make sure that the weakness is relatively minor,
    and that it would still remain a strength in most settings. For instance, you
    may be an avid reader who reads anything and everything you can find, but reading
    billboards while driving to work may be a dangerous idea.


    ## 37: Who has been the most influential person in your life?

    **Answer:** Give a specific example (and name) to the person who has influenced
    your life greatly, and offer a relevant anecdote about a meaningful exchange the
    two of you shared. It''s great if their influence relates to your professional
    life, but this particular question opens up the possibility to discuss inspiration
    in your personal life as well. The interviewer wants to see that you''re able
    to make strong connections with other individuals, and to work under the guiding
    influence of another person.


    ## 38: Do you consider yourself to be a "detailed" or "big picture" type of person?

    **Answer:** Both of these are great qualities, and it''s best if you can incorporate
    each into your answer. Choose one as your primary type, and relate it to experience
    or specific items from your resume. Then, explain how the other type fits into
    your work as well.


    ## 39: What is your greatest fear?

    **Answer:** Disclosing your greatest fear openly and without embarrassment is
    a great way to show your confidence to an employer. Choose a fear that you are
    clearly doing work to combat, such as a fear of failure that will seem impossible
    to the interviewer for someone such as yourself, with such clear goals and actions
    plans outlined. As tempting as it may be to stick with an easy answer such as
    spiders, stay away from these, as they don''t really tell the interviewer anything
    about yourself that''s relevant.


    ## 40: What sort of challenges do you enjoy?

    **Answer:** The challenges you enjoy should demonstrate some sort of initiative
    or growth potential on your part, and should also be in line with your career
    objectives. Employers will evaluate consistency here, as they analyze critically
    how the challenges you look forward to are related to your ultimate goals.


    ## 41: Tell me about a time you were embarrassed. How did you handle it?

    **Answer:** No one wants to bring up times they were embarrassed in a job interview,
    and it''s probably best to avoid an anecdote here. However, don''t shy away from
    offering a brief synopsis, followed by a display of your ability to laugh it off.
    Show the interviewer that it was not an event that impacted you significantly.


    ## 42: What is your greatest weakness?

    **Answer:** This is another one of the most popular questions asked in job interviews,
    so you should be prepared with an answer already. Try to come up with a weakness
    that you have that can actually be a strength in an alternate setting – such as,
    "I''m very detail-oriented and like to ensure that things are done correctly,
    so I sometimes have difficulty in delegating tasks to others." However, don''t
    try to mask obvious weaknesses – if you have little practical experience in the
    field, mention that you''re looking forward to great opportunities to further
    your knowledge.


    ## 43: What are the three best adjectives to describe you in a work setting?

    **Answer:** While these three adjectives probably already appear somewhere on
    your resume, don''t be afraid to use them again in order to highlight your best
    qualities. This is a chance for you to sell yourself to the interviewer, and to
    point out traits you possess that other candidates do not. Use the most specific
    and accurate words you can think of, and elaborate shortly on how you embody each.


    ## 44: What are the three best adjectives to describe you in your personal life?

    **Answer:** Ideally, the three adjectives that describe you in your personal life
    should be similar to the adjectives that describe you in your professional life.
    Employers appreciate consistency, and while they may be understanding of you having
    an alternate personality outside of the office, it''s best if you employ similar
    principles in your actions both on and off the clock.


    ## 45: What type of worker are you?

    **Answer:** This is an opportunity for you to highlight some of your greatest
    assets. Characterize some of your talents such as dedicated, self-motivated, detail-oriented,
    passionate, hard-working, analytical, or customer service focused. Stay away from
    your weaker qualities here, and remain on the target of all the wonderful things
    that you can bring to the company.


    ## 46: Tell me about your happiest day at work.

    **Answer:** Your happiest day at work should include one of your greatest professional
    successes, and how it made you feel. Stay focused on what you accomplished, and
    be sure to elaborate on how rewarding or satisfying the achievement was for you.


    ## 47: Tell me about your worst day at work.

    **Answer:** It may have been the worst day ever because of all the mistakes you
    made, or because you''d just had a huge argument with your best friend, but make
    sure to keep this answer professionally focused. Try to use an example in which
    something uncontrollable happened in the workplace (such as an important member
    of a team quit unexpectedly, which ruined your team''s meeting with a client),
    and focus on the frustration of not being in control of the situation. Keep this
    answer brief, and be sure to end with a reflection on what you learned from the
    day.


    ## 48: What are you passionate about?

    **Answer:** Keep this answer professionally-focused where possible, but it may
    also be appropriate to discuss personal issues you are passionate about as well
    (such as the environment or volunteering at a soup kitchen). Stick to issues that
    are non-controversial, and allow your passion to shine through as you explain
    what inspires you about the topic and how you stay actively engaged in it. Additionally,
    if you choose a personal passion, make sure it is one that does not detract from
    your availability to work or to be productive.


    ## 49: What is the piece of criticism you receive most often?

    **Answer:** An honest, candid answer to this question can greatly impress an interviewer
    (when, of course, it is coupled with an explanation of what you''re doing to improve),
    but make sure the criticism is something minimal or unrelated to your career.


    ## 50: What type of work environment do you succeed the most in?

    **Answer:** Be sure to research the company and the specific position before heading
    into the interview. Tailor your response to fit the job you''d be working in,
    and explain why you enjoy that type of environment over others. However, it''s
    also extremely important to be adaptable, so remain flexible to other environments
    as well.


    ## 51: Are you an emotional person?

    **Answer:** It''s best to focus on your positive emotions – passion, happiness,
    motivations – and to stay away from other extreme emotions that may cause you
    to appear unbalanced. While you want to display your excitement for the job, be
    sure to remain level-headed and cool at all times, so that the interviewer knows
    you''re not the type of person who lets emotions take you over and get in the
    way of your work.


    And Finally Good Luck!


