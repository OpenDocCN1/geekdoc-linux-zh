    **Answer:** The Linux tool `shuf` allows you to create permutations of file and
    shuffle the lines, which will allow you to create new distinctive files - `shuf
    myfile > mynewfile`.


    # 32: You have moved a file from one server to another, but you are not sure that
    the file has been perfectly moved, how can you verify that the file has not been
    corrupted?

    **Answer:** You can use the `md5sum` tool on both sides (both servers) on the
    file and match the result, if it is the same, the file has not been corrupted.


    # 33: How would you copy the file "file.txt" owned by root using secure ftp from
