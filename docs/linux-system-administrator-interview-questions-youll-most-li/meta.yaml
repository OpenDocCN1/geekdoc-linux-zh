    **Answer:** The /etc/exports allows you to create *nfs* exports and expose them\
    \ to the world.\n\n## Scripts\n### 186: How can you create a script that will\
    \ wait for specific output and will act according to it? - for instance, wait\
    \ for \"username:\" before sending the username.\n**Answer:** Linux provides a\
