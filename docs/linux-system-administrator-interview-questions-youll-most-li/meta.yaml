    # 34: What are some positive character traits that you don''t possess?


    **Answer:** If an interviewer asks you a tough question about your weaknesses,
    or lack of positive traits, it''s best to keep your answer light-hearted and simple
    – for instance, express your great confidence in your own abilities, followed
    by a (rather humble) admittance that you could occasionally do to be more humble.


    # 35: What is the greatest lesson you''ve ever learned?


    **Answer:** While this is a very broad question, the interviewer will be more
    interested in hearing what kind of emphasis you place on this value. Your greatest
    lesson may tie in with something a mentor, parent, or professor once told you,
    or you may have gleaned it from a book written by a leading expert in your field.
    Regardless of what the lesson is, it is most important that you can offer an example
