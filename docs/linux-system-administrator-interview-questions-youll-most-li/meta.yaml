    答案：你可以通过`hwclock`命令操作硬件时钟，要同步两者的话，可以使用`hwclock --systohc`命令将系统时钟同步到硬件时钟，或者使用`hwclock
    --hctosys`命令将硬件时钟同步到系统时钟。

    ### 139：如何检查硬盘上的坏块状态？

