    ## Linux System Administrator Questions

    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    This page is intentionally left blank


    ## General Questions

    ### 1: What is the difference between Telnet and SSH?

    Although Telnet and SSH are both communication protocols to manage a remote system,
    SSH is the secured version of Telnet, and requires key exchange, unlike Telnet
    which sends data in clear text.

    ### 2: When you need to edit a file opened by a system command (like `crontab
    -e`), how do you change the default editor that the system uses to nano?

    The system will use the editor defined in your `EDITOR` environment variable,
    which can be set by running `export EDITOR=nano`.

    ### 3: While using X, you encounter issues and cannot quit the X server, how can
    you force it to restart?

    You can force X to restart by pressing the key combination `Alt+Ctrl+Backspace`.

    ### 4: What would be the result of pressing the key combination `ALT+9` followed
    by pressing `m`?

    This would input the letter `m` 9 times into your STDIN.

    ### 5: Which TCP ports do you need to keep open for FTP, SSH, SMTP, POP3, HTTP
    and HTTPS respectively?

    Answer: For the aforementioned services, you need to keep the following TCP ports
    open: 21, 22, 25, 110, 80, 443.

    ### 6: What is the difference between the commands `ping` and `ping6`?

    Answer: Commands ending with `6` (such as `ping6`, `traceroute6`, `tracepath6`)
    have the same functions as their non-`6` counterparts, but are intended to be
    used with IPv6 addresses.

    ### 7: What does an open mail relay server mean?

    Answer: An open mail relay server is a server that allows anyone to send emails
    through it without first identifying themselves or being part of the domain group.


    *This page is intentionally left blank*


    ## General Tools

    ### 8: You want to find all of the “.tmp” files in `/home/*` and delete them,
    how can you do it with a single command?

    Answer: First locate the files using `find`, then delete them with `rm`:

    ```bash

    find /home/ -name ''*.tmp'' | xargs rm -rf

    ```

    ### 9: How can you add an "auto-correction" feature that automatically fixes typos
    like `cd /homr` to `cd /home`?

    Answer: You can enable the `cdspell` shell option by running `shopt -s cdspell`.

    ### 10: How do you get additional information about a command, for example, information
    about the `mail` command?

    Answer: You can use `man mail` or `info mail` to view detailed documentation for
    the `mail` command.

    ### 11: You are running a command via crontab and don''t want the command to send
    output to the crontab service, how can you handle this?

    Answer: You can redirect all command output (both STDOUT and STDERR) to `/dev/null`:

    ```bash

    commandName 2>&1 >/dev/null

    ```

    ### 12: How can you list the ARP cache table of the current machine?

    Answer: You can use the `arp` command to view and control the ARP table.

    ### 13: How can you eject your CD-ROM drive from the console?

    Answer: You can use the `eject` command to eject the CD-ROM drive.

    ### 14: You see a process `../myApplication` with PID 44556, how can you find
    the path from which this process was executed?

    Answer: You can identify the execution path of the PID by running `pwdx 44556`,
    which will output the working directory of the process.

    ### 15: You are performing an installation and want to record your commands and
    outputs for later review, how can you do this?

    Answer: You can use the `script` utility for this purpose. Run the following command
    to start recording your terminal session to `mysession.log`:

    ```bash

    script -a mysession.log

    ```

    When you want to stop recording, type `exit`.

    ### 16: How can you view the calendar for January 2004 on a Linux console?

    Answer: You can use the `cal` command to view a monthly/yearly calendar:

    ```bash

    cal 01 2004

    ```

    ### 17: You have 100 `.txt` files in a directory and want to find which files
    contain the string `"Error Found"`, how can you do this?

    Answer: You can use the `grep` command to search for content in files:

    ```bash

    grep "Error Found" *.txt

    ```

    ### 18: What command is used to get the IP address(es) of the domain name `Google.com`
    in Linux?

    Answer: You can use `nslookup google.com` to find the associated IP address(es)
    of the domain.

    ### 19: What is the outcome of running the command `touch -m myFile`?

    Answer: If the file exists, this command will only update its modification time;
    if the file does not exist, it will create a new empty file with that name.

    ### 20: Given the directory `myImportantFiles`, how can you create a tar file
    `myImportantTar.tar` that contains this folder?

    Answer: You need to use the `tar` command:

    ```bash

    tar -cf myImportantTar.tar myImportantFiles

    ```

    ### 21: How can you check which kernel version is currently loaded on the system
    without viewing the logs?

    Answer: The `uname` tool can retrieve various system information; to get only
    kernel-related data, you can run `uname -rsv`.

    ### 22: What is the equivalent of "Norton Commander" or "Windows Commander" for
    the Linux console?

    Answer: Linux provides `mc` (Midnight Commander), a tool that offers an interactive
    interface for file management in the Linux console.

    ### 23: How can you change the password of a different user (john) when you have
    root access?

    Answer: You can use the `passwd` command followed by the target username: `passwd
    john`

    ### 24: How do you ensure that your computer''s date and time are always synchronized?

    Answer: You need to connect your server to an NTP server using `ntpd`, or'
