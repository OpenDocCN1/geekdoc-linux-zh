    ## HR Questions

    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    ## **1:** What is the best way for a company to advertise?

    **Answer:** If you''re going for a position in any career other than marketing,
    this question is probably intended to demonstrate your ability to think critically
    and to provide reflective support for your answers. As such, the particular method
    you choose is not so important as why you''ve chosen it. For example, word of
    mouth advertising is important because customers will inherently trust the source,
    and social media advertising is important as it reaches new customers quickly
    and cheaply.


    ## **2:** Is it better to gain a new customer or to keep an old one?

    **Answer:** In almost every case, it is better to keep an old customer, and it''s
    important that you are able to articulate why this is. First, new customers generally
    cost companies more than retaining old ones does, and new customers are more likely
    to switch to a different company. Additionally, keeping old customers is a great
    way to provide a stable backbone for the company, as well as to also gain new
    customers as they are likely to recommend your company to friends.


    ## **3:** What is the best way to win clients from competitors?

    **Answer:** There are many schools of thought on the best way to win clients from
    competitors, and unless you know that your interviewer adheres to a specific thought
    or practice, it''s best to keep this question general. Rather than using absolute
    language, focus on the benefits of one or two strategies and show a clear, critical
    understanding of how these ways can succeed in a practical application.


    ## **4:** How do you feel about companies monitoring internet usage?

    **Answer:** Generally speaking, most companies will monitor some degree of internet
    usage over their employees – and during an interview is not the best time to rebel
    against this practice. Instead, focus on positive aspects such as the way it can
    lead to increased productivity for some employees who may be easily lost in the
    world of resourceful information available to them.


    ## **5:** What is your first impression of our company?

    **Answer:** Obviously, this should be a positive answer! Pick out a couple key
    components of the company''s message or goals that you especially identify with
    or that pertain to your experience, and discuss why you believe these missions
    are so important.


    ## **6:** Tell me about your personal philosophy on business.

    **Answer:** Your personal philosophy on business should be well-thought out, and
    in line with the missions and objectives of the company. Stay focused on positive
    aspects such as the service it can provide, and the lessons people gain in business,
    and offer insight as to where your philosophy has come from.


    ## **7:** What''s most important in a business model: sales, customer service,
    marketing, management, etc.?

    **Answer:** For many positions, it may be a good strategy to tailor this answer
    to the type of field you''re working in, and to explain why that aspect of business
    is key. However, by explaining that each aspect is integral to the function as
    a whole, you can display a greater sense of business savvy to the interviewer
    and may stand out in his or her mind as a particularly aware candidate.


    ## **8:** How do you keep up with news and emerging trends in the field?

    **Answer:** The interviewer wants to see that you are aware of what''s currently
    going on in your field. It is important that your education does not stop after
    college, and the most successful candidates will have a list of resources they
    regularly turn to already in place, so that they may stay aware and engaged in
    developing trends.


    ## **9:** Would you have a problem adhering to company policies on social media?

    **Answer:** Social concerns in the workplace have become a greater issue, and
    many companies now outline policies for the use of social media. Interviewers
    will want to be assured that you won''t have a problem adhering to company standards,
    and that you will maintain a consistent, professional image both in the office
    and online.


    ## **10:** Tell me about one of the greatest problems facing *X industry* today.

    **Answer:** If you''re involved in your career field, and spend time on your own
    studying trends and new developments, you should be able to display an awareness
    of both problems and potential solutions coming up in the industry. Research some
    of the latest news before heading into the interview, and be prepared to discuss
    current events thoroughly.


    ## **11:** What do you think it takes to be successful in our company?

    **Answer:** Research the company prior to the interview. Be aware of the company''s
    mission and main objectives, as well as some of the biggest names in the company,
    and also keep in mind how they achieved success. Keep your answer focused on specific
    objectives you could reach in order to help the company achieve its goals.


    ## **12:** What is your favorite part of working in this career field?

    **Answer:** This question is an opportunity to discuss some of your favorite aspects
    of the job, and to highlight why you are a great candidate for the particular
    position. Choose elements of the work you enjoy that are related to what you would
    do if hired for the position. Remember to remain enthusiastic and excited for
    the opportunities you could attain in the job.


    ## **13:** What do you see happening to your career in the next 10 years?

    **Answer:** If you''re plugged in to what''s happening in your career now, and
    are making an effort to stay abreast of emerging trends in your field, you should
    be able to offer the interviewer several predictions as to where your career or
    field may be heading. This insight and level of awareness shows a level of dedication
    and interest that is important to employers.


    ## **14:** Describe a time when you communicated a difficult or complicated idea
    to a coworker.

    **Answer:** Start by explaining the idea briefly to the interviewer, and then
    give an overview of why it was necessary to break it down further to the coworker.
    Finally, explain the idea in succinct steps, so the interviewer can see your communication
    abilities and skill in simplification.


    ## **15:** What situations do you find it difficult to communicate in?

    **Answer:** Even great communicators will often find particular situations that
    are more difficult to communicate effectively in, so don''t be afraid to answer
    this question honestly. Be sure to explain why the particular situation you name
    is difficult for you, and try to choose an uncommon answer such as language barrier
    or in time of hardship, rather than a situation such as speaking to someone of
    higher authority.


    ## **16:** What are the key components of good communication?

    **Answer:** Some of the components of good communication include an environment
    that is free from distractions, feedback from the listener, and revision or clarification
    from the speaker when necessary. Refer to basic communication models where necessary,
    and offer to go through a role-play sample with the interviewer in order to show
    your skills.


    ## **17:** Tell me about a time when you solved a problem through communication?

    **Answer:** Solving problems through communication is key in the business world,
    so choose a specific situation from your previous job in which you navigated a
    messy situation by communicating effectively through the conflict. Explain the
    basis of the situation, as well as the communication steps you took, and end with
    a discussion of why communicating through the problem was so important to its
    resolution.


    ## **18:** Tell me about a time when you had a dispute with another employee.
    How did you resolve the situation?

    **Answer:** Make sure to use a specific instance, and explain step-by-step the
    scenario, what you did to handle it, and how it was finally resolved. The middle
    step, how you handled the dispute, is clearly the most definitive – describe the
    types of communication you used, and how you used compromise to reach a decision.
    Conflict resolution is an important skill for any employee to have, and is one
    that interviewers will search for to determine both how likely you are to be involved
    in disputes, and how likely they are to be forced to become involved in the dispute
    if one arises.'
