- md: "## Services & Daemons\n### 172: What is the purpose of an exim service on a\
    \ server?\n**Answer:** The *exim* service is an SMTP service that can replace\
    \ the regular *sendmail* service that comes with the Linux installation.\n\n###\
    \ 173: What solution will you use for a reverse proxy in Linux?\n**Answer:** In\
    \ Linux, the two main solutions are Squid and Apache reverse proxy, the most common\
    \ is the Squid and it is mostly recommended.\n\n### 174: What is the purpose of\
    \ a NIS server?\n**Answer:** A NIS server is a Network Information Service and\
    \ it provides the user the possibility to login to different system with the same\
    \ credentials.\n\n### 175: If you would like to use the apache tools in order\
    \ to benchmark your apache service that holds www.google.com using 5 concurrent\
    \ requests over 20 overall requests, what tool would you use and how?\n**Answer:**\
    \ You can use the *ab (apache benchmarking)* tool on *localhost*\n```bash\nab\
    \ http://google.com -n 20 -c 5\n```\n\n### 176: What does each of the error codes\
    \ 200, 300, 400 and 500 in apache mean?\n**Answer:** 2xx are successful requests,\
    \ 3xx are redirection, 4xx are client error and 5xx are server error codes.\n\n\
    ### 177: Create a new Apache VirtualHost configuration for the host www.google.com\
    \ that sits at /home/google/public_html/ and default logs on /var/log/httpd/\n\
    **Answer:**\n```apache\n<VirtualHost *:80>\n    DocumentRoot /home/google/public_html\n\
    \    ServerName www.google.com\n    ServerAlias google.com\n    CustomLog /var/log/httpd/google.com.log\
    \ combined\n    ErrorLog /var/log/httpd/google.com.error.log\n</VirtualHost>\n\
    ```\n\n### 178: How do you stop the Apache HTTPD service, through its control\
    \ script?\n**Answer:** The apache control script is called *apachectl* and you\
    \ can stop the apache using `apachectl stop`\n\n### 179: How can you enable, on\
    \ a default Linux installation, root remote access through SSH?\n**Answer:** Edit\
