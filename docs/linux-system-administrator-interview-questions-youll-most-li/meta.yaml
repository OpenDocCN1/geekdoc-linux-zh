    \ 1 ]; then\n    echo \"Previous $cmd is still running.\"\n    exit 1\nfi\n```\n\
    \n### 195: create a Fibonacci function (F(n) = F(n-1) + F(n-2)) using awk (until\
    \ F20).\n**Answer:**\n```awk\nBEGIN {\n    fa = 1\n    fb = 1\n    while (++i\
    \ <= 20) {\n        print fa\n        ft = fa\n        fa = fa + fb\n        fb\
    \ = ft\n    }\n}\n```\n\n### 196: Write a script that will go over all the users\
    \ on the system and will write the last login date of the user - if we don't have\
