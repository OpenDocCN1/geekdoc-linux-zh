    ### 141：如何查看内存和分页状态（空闲、已用、缓存）？

    答案：使用*free -m命令*可以获取当前内存状态，包括物理内存和交换空间的空闲、已用、缓存情况。

    ### 142：如何获取CPU和硬盘活动的平均报告？

    答案：*iostat工具*可以返回系统CPU和硬盘I/O的相关信息及平均值。

    ### 143：如果要获取服务器过去数天的统计信息，该如何操作？

    答案：你可以使用*sar工具*获取服务器的统计信息。

    ### 144：如何获取每个CPU或核心的统计信息？

