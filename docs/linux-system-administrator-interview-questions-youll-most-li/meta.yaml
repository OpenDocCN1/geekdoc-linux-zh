    \ got a problem!\"。\n**答案：**\n```bash\n#!/bin/bash\nFILE=$1\nif [ -f $FILE ];\
    \ then\n    echo \"Roger that!\"\nelse\n    echo \"Houston we've got a problem\"\
    \nfi\n```\n### 193：编写一个脚本，检查传入参数的文件行数是否超过10行——如果超过则输出\"Over 10\"，否则输出\"Less than\
    \ 10\"。\n**答案：**\n```bash\n#!/bin/bash\ncount=$(cat $1 | wc -l)\nif [ \"$count\"\
    \ -gt \"10\" ]; then\n    echo \"Over 10\"\nelse\n    echo \"Less than 10\"\n\
    fi\n```\n### 194：你想创建一个名为\"backupMyFiles\"的备份脚本，每小时运行一次，要如何确保运行该脚本时它没有已经在后台运行？请编写一个简短的脚本处理该问题，如果脚本已在后台运行则输出提示信息\"\
    Previous <command> is still running\"并退出。\n**答案：** 你需要检查脚本当前是否在系统中运行，可以使用 *ps*\
    \ 命令实现：\n```bash\n#!/bin/bash\ncmd=namedScript\nrunningProcs=$(ps --no-headers\
    \ -C \"${cmd}\")\ncount=$(echo \"$runningProcs\" | wc -l)\nif [ \"$count\" -gt\
    \ 1 ]; then\n    echo \"Previous $cmd is still running.\"\n    exit 1\nfi\n```\n\
    ### 195：使用awk编写斐波那契函数（F(n) = F(n-1) + F(n-2)），计算到F20。\n**答案：**\n```awk\nBEGIN\
    \ {\n    fa = 1\n    fb = 1\n    while (++i <= 20) {\n        print fa\n     \
    \   ft = fa\n        fa = fa + fb\n        fb = ft\n    }\n}\n```\n### 196：编写一个脚本，遍历系统所有用户，输出用户最近一次登录日期——如果没有最近登录记录，则输出\"\
    No data for `<username>`\"。\n**答案：**\n```bash\n#!/bin/sh\nfor i in $(cat /etc/passwd\
    \ | awk -F: '{print $1}'); do\n    last=$(last \"$i\" | head -n 1)\n    if [ -n\
    \ \"$last\" ]; then\n        echo \"$last\"\n    else\n        echo \"No data\
    \ for $i\"\n    fi\ndone\n```\n### 197：如何查看你在Linux shell中最常使用的命令有哪些？\n**答案：**\
    \ 你可以从history命令中获取该信息，并按使用频率排序：`history | awk '{h[$2]++}END{for(c in h){print\
    \ h[c] \" \" c}}' | sort -nr | head`\n### 198：编写一个脚本，访问http://www.whatismyip.org/并输出“Your\
    \ IP is: <网站返回结果>”。\n**答案：**\n```bash\n#!/bin/sh\nip=$(links --source http://www.whatismyip.org/)\n\
    echo -n \"Your IP is: \"\necho \"$ip\"\n```\n### 199：用bash脚本编写一个简易计算器，内部包含名为\"\
    dosomething\"的函数，该函数接收数学表达式作为输入，例如执行mycalc 4+4*4。\n**答案：**\n```bash\n#!/bin/bash\n\
    function dosomething {\n    echo \"$1\" | bc -l\n}\ndosomething \"$1\"\n```\n"
