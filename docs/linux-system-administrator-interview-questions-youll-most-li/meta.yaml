    # **1: What is the best way for a company to advertise?**


    # **Answer:**


    If you''re going for a position in any career other than marketing, this question
    is probably intended to demonstrate your ability to think critically and to provide
    reflective support for your answers. As such, the particular method you choose
    is not so important as why you''ve chosen it. For example, word of mouth advertising
    is important because customers will inherently trust the source, and social media
    advertising is important as it reaches new customers quickly and cheaply.


    # **2: Is it better to gain a new customer or to keep an old one?**


    # **Answer:**


    In almost every case, it is better to keep an old customer, and it''s important
    that you are able to articulate why this is. First, new customers generally cost
    companies more than retaining old ones does, and new customers are more likely
    to switch to a different company. Additionally, keeping old customers is a great
    way to provide a stable backbone for the company, as well as to also gain new
    customers as they are likely to recommend your company to friends.


    # **3: What is the best way to win clients from competitors?**


    # **Answer:**


    There are many schools of thought on the best way to win clients from competitors,
    and unless you know that your'
  - '[PAGE 78]


    interviewer adheres to a specific thought or practice, it''s best to<br>keep this
    question general. Rather than using absolute<br>language, focus on the benefits
    of one or two strategies and<br>show a clear, critical understanding of how these
    ways can<br>succeed in a practical application.


    # 4: How do you feel about companies monitoring internet usage?


    **Answer:**


    Generally speaking, most companies will monitor some degree<br>of internet usage
    over their employees – and during an<br>interview is not the best time to rebel
    against this practice.<br>Instead, focus on positive aspects such as the way it
    can lead to<br>increased productivity for some employees who may be easily<br>lost
    in the world of resourceful information available to them.


    # 5: What is your first impression of our company?


    **Answer:**


    Obviously, this should be a positive answer! Pick out a couple<br>key components
    of the company''s message or goals that you<br>especially identify with or that
    pertain to your experience, and<br>discuss why you believe these missions are
    so important.


    # 6: Tell me about your personal philosophy on business.


    **Answer:**


    Your personal philosophy on business should be well-thought'
  - '[PAGE 79]


    out, and in line with the missions and objectives of the company. Stay focused
    on positive aspects such as the service it can provide, and the lessons people
    gain in business, and offer insight as to where your philosophy has come from.


    # 7: What''s most important in a business model: sales, customer service, marketing,
    management, etc.?


    Answer: For many positions, it may be a good strategy to tailor this answer to
    the type of field you''re working in, and to explain why that aspect of business
    is key. However, by explaining that each aspect is integral to the function as
    a whole, you can display a greater sense of business savvy to the interviewer
    and may stand out in his or her mind as a particularly aware candidate.


    # 8: How do you keep up with news and emerging trends in the field?


    Answer: The interviewer wants to see that you are aware of what''s currently going
    on in your field. It is important that your education does not stop after college,
    and the most successful candidates will have a list of resources they regularly
    turn to already in place, so that they may stay aware and engaged in developing
    trends.'
  - '[PAGE 80]


    # ### 9: Would you have a problem adhering to company policies on social media?


    # **Answer:**


    Social concerns in the workplace have become a greater issue, and many companies
    now outline policies for the use of social media. Interviewers will want to be
    assured that you won''t have a problem adhering to company standards, and that
    you will maintain a consistent, professional image both in the office and online.


    # ### 10: Tell me about one of the greatest problems facing *X industry* today.


    # **Answer:**


    If you''re involved in your career field, and spend time on your own studying
    trends and new developments, you should be able to display an awareness of both
    problems and potential solutions coming up in the industry. Research some of the
    latest news before heading into the interview, and be prepared to discuss current
    events thoroughly.


    # ### 11: What do you think it takes to be successful in our company?


    # **Answer:**


    Research the company prior to the interview. Be aware of the company''s mission
    and main objectives, as well as some of the biggest names in the company, and
    also keep in mind how they'
  - '[PAGE 81]


    achieved success. Keep your answer focused on specific objectives you could reach
    in order to help the company achieve its goals.


    # 12: What is your favorite part of working in this career field?


    # Answer:


    This question is an opportunity to discuss some of your favorite aspects of the
    job, and to highlight why you are a great candidate for the particular position.
    Choose elements of the work you enjoy that are related to what you would do if
    hired for the position. Remember to remain enthusiastic and excited for the opportunities
    you could attain in the job.


    # 13: What do you see happening to your career in the next 10 years?


    # Answer:


    If you''re plugged in to what''s happening in your career now, and are making
    an effort to stay abreast of emerging trends in your field, you should be able
    to offer the interviewer several predictions as to where your career or field
    may be heading. This insight and level of awareness shows a level of dedication
    and interest that is important to employers.


    # 14: Describe a time when you communicated a difficult or complicated idea to
    a coworker.'
  - '[PAGE 82]


    # **Answer:**


    Start by explaining the idea briefly to the interviewer, and then give an overview
    of why it was necessary to break it down further to the coworker. Finally, explain
    the idea in succinct steps, so the interviewer can see your communication abilities
    and skill in simplification.


    # **15: What situations do you find it difficult to communicate in?**


    # **Answer:**


    Even great communicators will often find particular situations that are more difficult
    to communicate effectively in, so don''t be afraid to answer this question honestly.
    Be sure to explain why the particular situation you name is difficult for you,
    and try to choose an uncommon answer such as language barrier or in time of hardship,
    rather than a situation such as speaking to someone of higher authority.


    # **16: What are the key components of good communication?**


    # **Answer:**


    Some of the components of good communication include an environment that is free
    from distractions, feedback from the listener, and revision or clarification from
    the speaker when necessary. Refer to basic communication models where necessary,
    and offer to go through a role-play sample with the interviewer in order to show
    your skills.'
  - '[PAGE 83]


    # **17: Tell me about a time when you solved a problem through communication?**


    **Answer:**


    Solving problems through communication is key in the business world, so choose
    a specific situation from your previous job in which you navigated a messy situation
    by communicating effectively through the conflict. Explain the basis of the situation,
    as well as the communication steps you took, and end with a discussion of why
    communicating through the problem was so important to its resolution.


    # **18: Tell me about a time when you had a dispute with another employee. How
    did you resolve the situation?**


    **Answer:**


    Make sure to use a specific instance, and explain step-by-step the scenario, what
    you did to handle it, and how it was finally resolved. The middle step, how you
    handled the dispute, is clearly the most definitive – describe the types of communication
    you used, and how you used compromise to reach a decision. Conflict resolution
    is an important skill for any employee to have, and is one that interviewers will
    search for to determine both how likely you are to be involved in disputes, and
    how likely they are to be forced to become involved in the dispute if one arises.'
- md: '## 19: Do you build relationships quickly with people, or take more time to
    get to know them?


    Either of these options can display good qualities, so determine which style is
    more applicable to you. Emphasize the steps you take in relationship-building
    over the particular style, and summarize briefly why this works best for you.


    ## 20: Describe a time when you had to work through office politics to solve a
    problem.


    Try to focus on the positives in this question, so that you can use the situation
    to your advantage. Don''t portray your previous employer negatively, and instead
    use a minimal instance (such as paperwork or a single individual), to highlight
    how you worked through a specific instance resourcefully. Give examples of communication
    skills or problem-solving you used in order to achieve a resolution.


    ## 21: Tell me about a time when you persuaded others to take on a difficult task?


    This question is an opportunity to highlight both your leadership and communication
    skills. While the specific situation itself is important to offer as background,
    focus on how you were able to persuade the others, and what tactics worked the
    best.


    ## 22: Tell me about a time when you successfully persuaded a group to accept
    your proposal?


    This question is designed to determine your resourcefulness and your communication
    skills. Explain the ways in which you took into account different perspectives
    within the group, and created a presentation that would be appealing and convincing
    to all members. Additionally, you can pump up the proposal itself by offering
    details about it that show how well-executed it was.


    ## 23: Tell me about a time when you had a problem with another person, that,
    in hindsight, you wished you had handled differently.


    The key to this question is to show your capabilities of reflection and your learning
    process. Explain the situation, how you handled it at the time, what the outcome
    of the situation was, and finally, how you would handle it now. Most importantly,
    tell the interviewer why you would handle it differently now – did your previous
    solution create stress on the relationship with the other person, or do you wish
    that you had stood up more for what you wanted? While you shouldn''t elaborate
    on how poorly you handled the situation before, the most important thing is to
    show that you''ve grown and reached a deeper level of understanding as a result
    of the conflict.


    ## 24: Tell me about a time when you negotiated a conflict between other employees?


    An especially important question for those interviewing for a supervisory role
    – begin with a specific situation, and explain how you communicated effectively
    to each individual. For example, did you introduce a compromise? Did you make
    an executive decision? Or, did you perform as a mediator and encourage the employees
    to reach a conclusion on their own?


    ## 25: What has been your biggest success?


    Your biggest success should be something that was especially meaningful to you,
    and that you can talk about passionately – your interviewer will be able to see
    this. Always have an answer prepared for this question, and be sure to explain
    how you achieved success, as well as what you learned from the experience.


    ## 26: What motivates you?


    It''s best to focus on a key aspect of your work that you can target as a "driving
    force" behind your everyday work. Whether it''s customer service, making a difference,
    or the chance to further your skills and gain experience, it''s important that
    the interviewer can see the passion you hold for your career and the dedication
    you have to the position.


    ## 27: What do you do when you lose motivation?


    The best candidates will answer that they rarely lose motivation, because they
    already employ strategies to keep themselves inspired, and because they remain
    dedicated to their objectives. Additionally, you may impress the interviewer by
    explaining that you are motivated by achieving goals and advancing, so small successes
    are always a great way to regain momentum.


    ## 28: What do you like to do in your free time?


    What you do answer here is not nearly as important as what you don''t answer –
    your interviewer does not want to hear that you like to drink, party, or revel
    in the nightlife. Instead, choose a few activities to focus on that are greater
    signs of stability and maturity, and that will not detract from your ability to
    show up to work and be productive, such as reading, cooking, or photography. This
    is also a great opportunity to show your interviewer that you are a well-rounded,
    interesting, and dynamic personality that they would be happy to hire.


    ## 29: What sets you apart from other workers?


    This question is a great opportunity to highlight the specific skill sets and
    passion you bring to the company that no one else can. If you can''t outline exactly
    what sets you apart from other workers, how will the interviewer see it? Be prepared
    with a thorough outline of what you will bring to the table, in order to help
    the company achieve their goals.


    ## 30: Why are you the best candidate for that position?


    Have a brief response prepared in advance for this question, as this is another
    very common theme in interviews (variations of the question include: "Why should
    I hire you, above Candidate B?" and "What can you bring to our company that Candidate
    B cannot?"). Make sure that your statement does not sound rehearsed, and highlight
    your most unique qualities that show the interviewer why he or she must hire you
    above all the other candidates. Include specific details about your experience
    and special projects or recognition you''ve received that set you apart, and show
    your greatest passion, commitment, and enthusiasm for the position.


    ## 31: What does it take to be successful?


    Hard work, passion, motivation, and a dedication to learning – these are all potential
    answers to the ambiguous concept of success. It doesn''t matter so much which
    of these values you choose as the primary means to success, or if you choose a
    combination of them. It is, however, absolutely key that whichever value you choose,
    you must clearly display in your attitude, experience, and goals.


    ## 32: What would be the biggest challenge in this position for you?


    Keep this answer positive, and remain focused on the opportunities for growth
    and learning that the position can provide. Be sure that no matter what the challenge
    is, it''s obvious that you''re ready and enthusiastic to tackle it, and that you
    have a full awareness of what it will take to get the job done.


    ## 33: Would you describe yourself as an introvert or an extrovert?


    There are beneficial qualities to each of these, and your answer may depend on
    what type of work you''re involved in. However, a successful leader may be an
    introvert or extrovert, and similarly, solid team members may also be either.
    The important aspect of this question is to have the level of self-awareness required
    to accurately describe yourself.


    ## 34: What are some positive character traits that you don''t possess?


    If an interviewer asks you a tough question about your weaknesses, or lack of
    positive traits, it''s best to keep your answer light-hearted and simple – for
    instance, express your great confidence in your own abilities, followed by a (rather
    humble) admittance that you could occasionally do to be more humble.


    ## 35: What is the greatest lesson you''ve ever learned?


    While this is a very broad question, the interviewer will be more interested in
    hearing what kind of emphasis you place on this value. Your greatest lesson may
    tie in with something a mentor, parent, or professor once told you, or you may
    have gleaned it from a book written by a leading expert in your field. Regardless
    of what the lesson is, it is most important that you can offer an example of how
    you''ve incorporated it into your life.'
