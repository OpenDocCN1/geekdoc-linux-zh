    ```bash\n#!/bin/sh\nfor i in $(cat /etc/passwd | awk -F: '{print $1}'); do\n \
    \   last=$(last \"$i\" | head -n 1)\n    if [ -n \"$last\" ]; then\n        echo\
    \ \"$last\"\n    else\n        echo \"No data for $i\"\n    fi\ndone\n```\n\n\
    ### 197: How can you check what are the most common commands that you have used\
