    tell the interviewer why you would handle it differently now – did your previous
    solution create stress on the relationship with the other person, or do you wish
    that you had stood up more for what you wanted? While you shouldn''t'
  - '[PAGE 86]


    elaborate on how poorly you handled the situation before, the most important thing
    is to show that you''ve grown and reached a deeper level of understanding as a
    result of the conflict.


    # 24: Tell me about a time when you negotiated a conflict between other employees.


    # Answer:


    An especially important question for those interviewing for a supervisory role
    – begin with a specific situation, and explain how you communicated effectively
    to each individual. For example, did you introduce a compromise? Did you make
    an executive decision? Or, did you perform as a mediator and encourage the employees
    to reach a conclusion on their own?


    # 25: What has been your biggest success?


    # Answer:


    Your biggest success should be something that was especially meaningful to you,
    and that you can talk about passionately – your interviewer will be able to see
    this. Always have an answer prepared for this question, and be sure to explain
