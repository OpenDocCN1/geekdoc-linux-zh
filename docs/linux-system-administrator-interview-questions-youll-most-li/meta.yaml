    FILE=$1\nif [ -f $FILE ]; then\n    echo \"Roger that!\"\nelse\n    echo \"Houston\
    \ we've got a problem\"\nfi\n```\n\n### 193: Write a script that checks if a file,\
    \ given as an argument, has more than 10 lines or not, if it does - print \"Over\
    \ 10\", else print \"Less than 10\".\n**Answer:**\n```bash\n#!/bin/bash\ncount=$(cat\
