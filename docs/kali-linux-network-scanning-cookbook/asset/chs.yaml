  \n# 第 1 章\n\n接下来，你需要为 root 账户设置密码。建议使用相当复杂的密码，使其不易被破解。请看下面的截图：\n\n接下来，你将被要求提供你所在的时区。系统将使用\
  \ IP\n\n\n\n地理定位将提供对你位置的最佳推测。如果此不正确，请手动选择正确的时区：\n\n要设置磁盘分区，使用默认方法和分区方案对于实验目的来说足够了：\n\
  \n29\n\n![](img/index-43_1.jpg)\n\n![](img/index-43_2.jpg)\n\n![](img/index-43_3.jpg)\n\
  \n## 入门\n\n建议你使用镜像以确保你的 Kali Linux 软件保持最新状态：\n\n接下来，系统会要求你提供 HTTP 代理地址。本书中所涉及的任何练习都不需要外部\
  \ HTTP 代理，因此此处可以留空：\n\n最后，选择 `Yes` 安装 `GRUB` 引导程序，然后按 `Enter` 完成安装过程。当系统加载时，您可以使用安装期间提供的\
  \ `root` 账户和密码进行登录：\n\n### 工作原理……\n\nKali Linux 是一种基于 Debian 的 Linux 发行版，它预装了大量的第三方渗透工具。虽然所有这些工具都可以独立获取和安装，但\
  \ Kali Linux 提供的组织和实现使其对于任何严肃的渗透测试人员来说都是一个非常有用的工具。\n\n30\n\n![](img/index-44_1.jpg)\n\
  \n# 第 1 章\n\n## 配置和使用 SSH\n\n同时处理多个虚拟机可能会变得乏味、耗时且令人沮丧。为了减少在各个 VMware 窗口之间跳转的需求并增加虚拟系统之间通信的便利性，在每台虚拟机上配置并启用\
  \ SSH 非常有用。本食谱将讨论你如何在每台 Linux 虚拟机上使用 SSH。\n\n### 准备工作\n\n要在虚拟机上使用 SSH，你必须首先在主机系统上安装\
  \ SSH 客户端。SSH 客户端集成在大多数 Linux 和 OS X 系统中，并可以通过终端界面访问。如果你使用的是 `Windows` 主机，你将需要下载并安装一个\
  \ Windows 终端服务客户端。一个免费且易用的工具是 `PuTTY`。可以在 http://www.putty.org/ 下载 `PuTTY`。\n\n\
  ### 如何操作……\n\n起初，你将直接从图形桌面界面的终端启用 SSH。此命令需要在虚拟机客户端中直接运行。除了 Windows XP 虚拟机，实验中的所有其他虚拟机都是\
  \ Linux 发行版，应该原生支持 SSH。启用此项的技术在几乎所有 Linux 发行版中都是相同的，所示如下：\n\n`/etc/init.d/ssh start`\
  \ 命令将启动服务。如果你不是以 `root` 身份登录，则需要在该命令前加上 `sudo`。如果收到错误，可能是设备上尚未安装 SSH 守护进程。如果是这样，可以使用命令\
  \ `apt-get install ssh` 安装 SSH 守护进程。然后可以使用 `ifconfig` 获取系统的 IP 地址，该地址将用于建立 SSH 连接。一旦激活，现在就可以从主机系统通过\
  \ SSH 访问 VMware 客户系统。要这样做，最小化虚拟机并打开主机的 SSH 客户端。\n\n31\n\n## 入门\n\n如果你使用 Mac OSX\
  \ 或 Linux 作为主机系统，可以直接从终端调用客户端。或者，如果你在 Windows 主机上运行虚拟机，将需要使用如 `PuTTY` 等终端模拟器。在下面的示例中，通过提供\
  \ Kali 虚拟机的 IP 地址建立 SSH 会话：\n\n```\nDEMOSYS:~ jhutchens$ ssh root@172.16.36.244\n\
  The authenticity of host '172.16.36.244 (172.16.36.244)' can't be\nestablished.\n\
  RSA key fingerprint is c7:13:ed:c4:71:4f:89:53:5b:ee:cf:1f:40:06:d9:11.\nAre you\
  \ sure you want to continue connecting (yes/no)? yes\nWarning: Permanently added\
  \ '172.16.36.244' (RSA) to the list of known\nhosts.\nroot@172.16.36.244's password:\n\
  Linux kali 3.7-trunk-686-pae #1 SMP Debian 3.7.2-0+kali5 i686\nThe programs included\
  \ with the Kali GNU/Linux system are free software;\nthe exact distribution terms\
  \ for each program are described in the\nindividual files in /usr/share/doc/*/copyright.\n\
  Kali GNU/Linux comes with ABSOLUTELY NO WARRANTY, to the extent\npermitted by applicable\
  \ law.\nroot@kali:~#\n```\n\n### 下载示例代码\n\n你可以从 http://www.packtpub.com 账户下载你购买的所有\
  \ Packt 书籍的示例代码文件。如果你在其他地方购买了这本书，可以访问 http://www.packtpub.com/support 并注册，以便文件直接通过电子邮件发送给你。\n\
  \nSSH 客户端的正确用法是 `ssh [user]@[IP address]`。在提供的示例中，SSH 将使用 `root` 账户访问 Kali 系统（通过提供的\
  \ IP 地址识别）。由于主机不在你的已知主机列表中，在第一次连接时你将会被提示确认连接。要这样做，输入单词 `yes`。然后你将会被提示输入 `root` 账户的密码。输入后，你应该获得对系统的远程\
  \ shell 访问。在 Windows 中也可以通过 `PuTTY` 完成相同的过程。\n\n你可以在本食谱“准备工作”部分提供的链接中下载它。下载后，打开\
  \ `PuTTY` 并在 Host Name 字段中输入虚拟机的 IP 地址，并确保选中了 SSH 单选按钮，如下截图所示：32\n\n![](img/index-46_1.jpg)\n\
  \n![](img/index-46_2.jpg)\n\n# 第 1 章\n\n一旦设置好连接，点击 `Open` 按钮启动会话。我们会被提示输入用户名和密码。我们应该输入要连接的系统的凭据。一旦身份验证完成，我们将获得系统的远程终端访问权限，如下截图所示：\n\
  \n33\n\n## 入门\n\n通过在远程主机的 `authorized_keys` 文件中提供你的公钥，可以避免每次都进行身份验证。此过程如下：\n\n```\n\
  root@kali:~# ls .ssh\nls: cannot access .ssh: No such file or directory\nroot@kali:~#\
  \ mkdir .ssh\nroot@kali:~# cd .ssh\nroot@kali/.ssh# nano authorized_keys\n```\n\n\
  首先，确保 root 目录下已存在 `.ssh` 隐藏目录。要做到这一点，请使用 `ls` 和目录名。如果不存在，使用 `mkdir` 创建目录。然后，使用 `cd`\
  \ 命令将当前位置切换到该目录。接着，使用 `Nano` 或 `VIM` 创建名为 `authorized_keys` 的文件。在该文件中，你应该按照如下格式粘贴\
  \ SSH 客户端所使用的公钥：\n\n```\nDEMOSYS:~ jhutchens$ ssh root@172.16.36.244\nLinux kali\
  \ 3.7-trunk-686-pae #1 SMP Debian 3.7.2-0+kali5 i686\nLast login: Sat May 10 22:38:31\
  \ 2014 from 172.16.36.1\nroot@kali:~#\n```\n\n\n\n\n在 Kali Linux 中尝试安装 Nessus 漏洞扫描器之前，您需要获取一个插件馈源激活码。该激活码用于获取\
  \ Nessus 用于评估网络系统的审计插件。如果您打算在家里或仅在实验室中使用 Nessus，可以免费获取家庭版馈源密钥（Home Feed Key）。或者，如果您打算使用\
  \ Nessus 审计生产系统，则需要获取专业版馈源密钥（Professional Feed Key）。无论哪种情况，您都 http://www.tenable.com/products/nessus/nessus-plugins/obtain-an-activation-code\
  \ 获取此激活码。\n\n### 如何操作…\n\n一旦获取了插件馈源激活码，您将需要从 http://www.tenable.com/products/nessus/select-your-operating-system\
  \ 下载 Nessus 安装包。以下截图显示了 Nessus 可以运行的各种平台列表及其相应的安装包：\n\n35\n\n![](img/index-49_1.jpg)\n\
  \n### 开始上手\n\n根据您已安装的操作系统架构选择合适的安装包。选择完成后，阅读并同意 Tenable 提供的订阅协议。随后您的系统将下载安装包。点击“保存文件”（Save\
  \ File），然后浏览到您想要保存的位置：\n\n在提供的示例中，我将安装包保存到了根目录。下载完成后，您可以通过命令行完成安装。这可以通过 SSH 或通过图形化桌面上的终端按如下方式进行：\n\
