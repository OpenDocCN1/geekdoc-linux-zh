  \ 256 个 256 个主机 (100% 完成)\n[*] 辅助模块执行完成\n\n为了演示如何执行 SYN 扫描，我们使用 Scapy 构造一个 TCP SYN\
  \ 请求，并识别与开放端口相关的响应。为了演示如何执行 SYN 扫描，我们使用 Scapy 构造一个 TCP SYN 请求，并识别与开放端口相关的响应。为了演示如何执行\
  \ SYN 扫描，我们使用 Scapy 构造一个 TCP SYN 请求，并识别与开放端口相关的响应。\n\n```\n[*] 发向 172.16.36.135\
  \ 的 SYN 请求\n[+] 172.16.36.0 -> 172.16.36.135\n172.16.36.135 -> 172.16.36.0\n```\n\
  [*] 收到来自 172.16.36.135 的 SYN/ACK 响应\n[*] 端口 111 是开放的\n[*] 发送 RST 包关闭连接\n\n\n\n\n\
  请注意，当 `SYN` 数据包发送到目标 Web 服务器的 TCP 端口 `80` 时（该服务器在该端口上运行 `HTTP` 服务），其响应的 TCP 标志值为\
  \ `SA`，这表示 `SYN` 和 `ACK` 标志位均已激活。此响应表示指定的目标端口是开放的并接受连接。如果将相同类型的数据包发送到不接受连接的端口，将返回不同的响应：\n\
  \n```python\n>>> response = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=4444))\n\n..Begin\
  \ emission:\n\n.Finished to send 1 packets.\n...\nReceived 7 packets, got 1 answers,\
  \ remaining 0 packets\n\n>>> response.display()\n\n###[ IP ]###\nversion= 4L\nihl=\
  \ 5L\ntos= 0x0\nlen= 40\nid= 0\nflags= DF\nfrag= 0L\nttl= 64\nproto= tcp\nchksum=\
  \ 0x9974\nsrc= 172.16.36.135\ndst= 172.16.36.180\n\\options\\\n###[ TCP ]###\nsport=\
  \ 4444\ndport= ftp_data\nseq= 0\nack= 1\ndataofs= 5L\nreserved= 0L\nflags= RA\n\
  window= 0\nchksum= 0xfd03\nurgptr= 0\noptions= {}\n###[ Padding ]###\nload= '\\\
  x00\\x00\\x00\\x00\\x00\\x00'\n```\n\n当 `SYN` 请求发送到关闭的端口时，返回的响应的 TCP 标志值为 `RA`，这表示\
  \ `RST` 和 `ACK` 标志位均已激活。`ACK` 位仅用于确认已收到请求，而 `RST` 位则用于停止通信，因为该端口不接受连接。或者，如果将 `SYN`\
  \ 数据包发送到已关机或处于过滤此类请求的防火墙后的系统，可能无法收到任何响应。由于这种情况，在脚本中使用 `sr1` 函数时，应始终使用超时（timeout）选项，以确保脚本不会挂在无响应的主机上：\n\
  \n```python\n>>> response = sr1(IP(dst=\"172.16.36.136\")/TCP(dport=4444),timeout=1,verbose=1)\n\
  \nBegin emission:\nFinished to send 1 packets.\nReceived 15 packets, got 0 answers,\
  \ remaining 1 packets\n```\n\n如果在对无响应主机使用此函数时未指定超时值，该函数将无限运行。在演示中，提供了 `1` 秒的超时值来完成函数，可以通过如下评估响应值来判断是否收到了回复：\n\
  \n```python\nroot@KaliLinux:~# python\nPython 2.7.3 (default, Jan 2 2013, 16:53:07)\n\
  [GCC 4.7.2] on linux2\nType \"help\", \"copyright\", \"credits\" or \"license\"\
  \ for more information.\n>>> from scapy.all import *\n>>> response = sr1(IP(dst=\"\
  172.16.36.136\")/TCP(dport=4444),timeout=1,verbose=1)\n\nBegin emission:\nWARNING:\
  \ Mac address to reach destination not found. Using broadcast.\nFinished to send\
  \ 1 packets.\nReceived 15 packets, got 0 answers, remaining 1 packets\n\n>>> if\
  \ response == None:\n...     print \"No Response!!!\"\n...\nNo Response!!!\n```\n\
  \n使用 Python 可以轻松地测试变量，以识别 `sr1` 函数是否为其赋值了值。这可以作为初步检查，以确定是否收到了任何响应。对于收到的响应，可以进行后续检查以判断响应指示的端口是开放还是关闭。\n\
  \n所有这些都可以很容易地在 Python 脚本中排序，如下：\n\n```python\n#!/usr/bin/python\nimport logging\n\
  logging.getLogger(\"scapy.runtime\").setLevel(logging.ERROR)\nfrom scapy.all import\
  \ *\nimport sys\n\nif len(sys.argv) != 4:\n    print \"Usage - ./syn_scan.py [Target-IP]\
  \ [First Port] [Last Port]\"\n    print \"Example - ./syn_scan.py 10.0.0.5 1 100\"\
  \n    print \"Example will TCP SYN scan ports 1 through 100 on 10.0.0.5\"\n    sys.exit()\n\
  \nip = sys.argv[1]\nstart = int(sys.argv[2])\nend = int(sys.argv[3])\n\nfor port\
  \ in range(start,end):\n    ans = sr1(IP(dst=ip)/TCP(dport=port),timeout=1,verbose=0)\n\
  \    if ans == None:\n        pass\n    else:\n        if int(ans[TCP].flags) ==\
  \ 18:\n            print port\n        else:\n            pass\n```\n\n在提供的 Python\
  \ 脚本中，用户会被提示输入 IP 地址，然后脚本会对定义的端口序列执行 SYN 扫描。脚本随后评估每次连接尝试的响应，以确定响应是否激活了 `SYN` 和 `ACK`\
  \ TCP 标志。如果响应中存在且仅存在这些标志，则输出收到的相应端口号：\n\n```bash\nroot@KaliLinux:~# chmod 777 syn_scan.py\n\
  root@KaliLinux:~# ./syn_scan.py\nUsage - ./syn_scan.py [Target-IP] [First Port]\
  \ [Last Port]\nExample - ./syn_scan.py 10.0.0.5 1 100\nExample will TCP SYN scan\
  \ ports 1 through 100 on 10.0.0.5\nroot@KaliLinux:~# ./syn_scan.py 172.16.36.135\
  \ 1 100\n21\n22\n23\n25\n53\n80\n```\n\n运行脚本后，输出将通过提供 IP 地址来指示系统上开放的前 100 个端口中的任何一个。\n\
  \n### 工作原理\n这种扫描是通过通过向远程系统的目标 TCP 端口发送初始的 `SYN` 数据包请求来实现的，该端口的状态由返回的响应类型来确定。如果远程系统返回\
  \ `SYN+ACK` 响应，则它已准备好建立连接，可以假设端口是开放的。如果服务返回 `RST` 数据包，则表示端口已关闭且不接受连接。此外，如果没有返回任何响应，则扫描系统和远程系统之间可能存在丢弃此类请求的防火墙。这可能表明机器已关机，或者目标\
  \ IP 地址没有关联的系统。\n\n### 使用 Nmap 进行隐身扫描\nNmap 也有一种对远程系统进行 SYN 扫描的模式。本教程演示了我们如何使用 Nmap\
  \ 执行 TCP 隐身扫描。\n\n### 准备工作\n要使用 Nmap 执行 TCP 隐身扫描，你需要一个通过 TCP 运行着可访问网络服务的远程系统。在提供的示例中，使用了\
  \ `Metasploitable2` 实例来执行此任务。有关如何设置 `Metasploitable2` 的更多信息，请参阅第 1 章“入门指南”。\n\n\
  ### 如何操作\n与大多数扫描需求一样，Nmap 有一个选项可以简化并优化执行 TCP 隐身扫描的过程。要使用 Nmap 执行 TCP 隐身扫描，应使用 `-sS`\
  \ 选项配合要扫描的 IP 地址：\n\n```bash\nroot@KaliLinux:~# nmap -sS 172.16.36.135 -p 80\nStarting\
  \ Nmap 6.25 ( http://nmap.org ) at 2013-12-17 21:47 EST\nNmap scan report for 172.16.36.135\n\
  Host is up (0.00043s latency).\nPORT STATE SERVICE\n80/tcp open http\nMAC Address:\
  \ 00:0C:29:3D:84:32 (VMware)\nNmap done: 1 IP address (1 host up) scanned in 13.05\
  \ seconds\n```\n\n在提供的示例中，对指定 IP 地址的 TCP 端口 80 执行了 SYN 扫描。与 Scapy 的方法类似，Nmap 监听响应并通过分析激活的\
  \ TCP 标志来识别开放端口。我们也可以通过传递逗号分隔的端口列表使用 Nmap 扫描多个指定端口，如下：\n\n```bash\nroot@KaliLinux:~#\
