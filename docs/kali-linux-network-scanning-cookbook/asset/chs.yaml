  \n\n`Amap` 执行服务识别的底层原理与 `Nmap` 采用的原理相似。通过注入一系列探测请求，尝试获取唯一的响应，这些响应可用于识别特定端口上运行的服务软件及其版本。然而需要注意的是，虽然\
  \ `Amap` 是服务识别的替代方案，但它不像 `Nmap` 那样经过频繁更新和维护。因此，`Amap` 产生可靠结果的可能性较低。\n\n# 指纹识别\n\n\
  ## 使用 Scapy 识别操作系统\n\n有许多技术可以尝试对通信的设备进行操作系统指纹识别。真正有效的操作系统识别工具是健壮的，并且会在分析中考虑大量的因素。\n\
  \n然而，可以使用 `Scapy` 单独分析这些因素中的任何一个。本配方将演示如何通过检查返回的 `TTL` 值使用 `Scapy` 进行操作系统识别。\n\n\
  ### 准备工作\n\n为了使用 `Scapy` 识别 `TTL` 响应中的差异，你需要一个运行 Linux/Unix 操作系统的远程系统以及另一个运行 Windows\
  \ 操作系统的远程系统以供分析。在提供的示例中，使用了安装了 `Metasploitable2` 和 `Windows XP` 的系统。有关在本地实验室环境中设置系统的更多信息，请参考第\
  \ 1 章“入门指南”中的`安装 Metasploitable2` 和 `安装 Windows Server` 配方。此外，本节还需要使用如 `VIM` 或 `Nano`\
  \ 等文本编辑器向文件系统编写脚本。关于编写脚本的更多信息，请参考第 1 章“入门指南”中的`使用文本编辑器 (VIM and Nano)` 配方。\n\n###\
  \ 如何操作……\n\nWindows 和 Linux/Unix 操作系统默认使用不同的 `TTL` 初始值。该因素可以尝试识别与你通信的操作系统类型。这些值总结在下表中：\n\
  \n| 操作系统 | 标准 TTL 值 |\n| :--- | :--- |\n| Microsoft Windows OS | 128 |\n| Linux/Unix\
  \ OS | 64 |\n\n某些基于 Unix 的系统默认 `TTL` 值为 255；但为了练习的简单起见，我们将使用提供的值作为本配方中涉及的任务的前提。要分析远程系统响应的\
  \ `TTL` 值，我们首先需要构建一个请求。在本示例中，我们将使用互联网控制消息协议 (`ICMP`) 回显请求。为了发送 `ICMP` 请求，我们必须首先构建该请求的各个层。我们需要构建的第一层是\
  \ IP 层：\n\n```\nroot@KaliLinux:~# scapy\nWelcome to Scapy (2.2.0)\n>>> linux = \"\
  172.16.36.135\"\n>>> windows = \"172.16.36.134\"\n>>> i = IP()\n>>> i.display()\n\
  [ IP ]\nversion= 4\nihl = None\ntos = 0x0\nlen = None\nid = 1\nflags = 0\nttl =\
  \ 64\nproto = ip\nchksum = None\nsrc = 127.0.0.1\ndst = 127.0.0.1\n>>> i.dst = linux\n\
  >>> i.display()\n[ IP ]\nversion= 4\nihl = None\ntos = 0x0\nlen = None\nid = 1\n\
  flags = 0\nttl = 64\nproto = ip\nchksum = None\nsrc = 172.16.36.180\ndst = 172.16.36.135\n\
  ```\n\n为了构建请求的 IP 层，我们应该将 IP 对象赋值给变量 `i`。通过调用 `display()` 函数，我们可以识别该对象的属性配置。默认情况下，发送地址和接收地址都设置为环回地址\
  \ `127.0.0.1`。可以通过更改目标地址，将 `i.dst` 设置为我们想要扫描的地址的字符串值来修改这些值。\n\n再次调用 `display()`\
  \ 函数，我们可以看到不仅目标地址已更新，`Scapy` 还会将源 IP 地址自动更新为默认接口。现在我们构建了 IP 层，应该继续 ICMP 层：\n\n```\n\
  >>> ping = ICMP()\n>>> ping.display()\n[ ICMP ]\ntype= echo-request\ncode = 0\n\
  chksum = None\nid = 0\nseq = 0\n```\n\n为了构建请求的 ICMP 层，我们将使用与构建 IP 层相同的技术。在提供的示例中，`ICMP`\
  \ 对象被赋值给变量 `ping`。如前所述，可以通过调用 `display()` 函数识别默认配置。默认情况下，`ICMP` 类型已设置为 `echo-request`。现在我们已经创建了\
  \ `IP` 和 `ICMP` 层，我们需要通过堆叠这些层来构建请求：\n\n```\n>>> request = i/ping\n>>> request.display()\n\
  [ IP ]\nversion= 4\nihl = None\ntos = 0x0\nlen = None\nid = 1\nflags = 0\nttl =\
  \ 64\nproto = ip\nchksum = None\nsrc = 172.16.36.180\ndst = 172.16.36.135\n[ ICMP\
  \ ]\ntype= echo-request\ncode = 0\nchksum = None\nid = 0\nseq = 0\n```\n\n可以通过正斜杠分隔变量来堆叠\
  \ `IP` 和 `ICMP` 层。然后可以将这些层设置为一个新变量，该变量将代表整个请求。然后可以调用 `display()` 函数查看请求的配置。请求构建完成后，可以将其传递给\
  \ `sr1` 函数，以便我们可以分析响应：\n\n```\n>>> ans = sr1(request)\nBegin emission:\nFinished\
  \ to send 1 packets.\nReceived 5 packets, got 1 answers, remaining 0 packets\n>>>\
  \ ans.display()\n[ IP ]\nversion= 4\nihl = 5\ntos = 0x0\nlen = 28\nid = 64067\n\
  flags = 0\nttl = 64\nproto = icmp\nchksum = 0xdf41\nsrc = 172.16.36.135\ndst = 172.16.36.180\n\
  [ ICMP ]\ntype= echo-reply\ncode = 0\nchksum = 0xffff\nid = 0\nseq = 0\n[ Padding\
  \ ]\nload=\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\n```\n\n这种请求可以在不独立构建和堆叠每一层的情况下完成。相反，可以直接调用函数并向它们传递适当的参数来使用单行命令：\n\
  \n```\n>>> ans = sr1(IP(dst=linux)/ICMP())\nBegin emission:\nFinished to send 1\
  \ packets.\nReceived 5 packets, got 1 answers, remaining 0 packets\n>>> ans\n<IP\
  \ version=4 ihl=5 tos=0x0 len=28 id=64068 flags= frag=0 ttl=64 proto=icmp chksum=0xdf40\
  \ src=172.16.36.135 dst=172.16.36.180 options=[] |<ICMP type=echo-reply code=0 chksum=0xffff\
  \ id=0x0 seq=0x0 |<Padding load='\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00'>\n```\n\n注意来自 Linux 系统的响应 `TTL` 值为\
  \ `64`。对 Windows 系统的 IP 地址进行相同的测试，并应注意响应 `TTL` 值的差异：\n\n```\n>>> ans = sr1(IP(dst=windows)/ICMP())\n\
  Begin emission:\nFinished to send 1 packets.\nReceived 12 packets, got 1 answers,\
  \ remaining 0 packets\n>>> ans\n<IP version=4 ihl=5 tos=0x0 len=28 id=24714 flags=\
  \ frag=0 ttl=128 proto=icmp chksum=0x38fc src=172.16.36.134 dst=172.16.36.180 options=[]\
  \ |<ICMP type=echo-reply code=0 chksum=0xffff id=0x0 seq=0x0 |<Padding load='\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00'>\n```\n\n这种变变响应可以在 Python 中轻松测试：\n\n```\nroot@KaliLinux:~# python\nPython\
  \ 2.7.3 (default, Jan 2 2013, 16:53:07)\n[GCC 4.7.2] on linux2\n```\n\n\n\n\n输入\
  \ \"help\", \"copyright\", \"credits\" 或 \"license\" 获取更多信息。\n\n>>> `from scapy.all\
  \ import *`\n\n234\n\n第 4 章\n\n警告: 未找到 IPv6 目的路由 ::（没有默认路由？）\n\n>>> `ans = sr1(IP(dst=\"\
  172.16.36.135\")/ICMP())`\n开始发送：\n............完成发送 1 个包。\n....\n接收 18 个包，得到 1 个答案，剩余\
  \ 0 个包\n>>> `if int(ans[IP].ttl) <= 64:`\n... print \"Host is Linux\"\n... else:\n\
  ... print \"Host is Windows\"\n...\nHost is Linux\n\n>>> `ans = sr1(IP(dst=\"172.16.36.134\"\
  )/ICMP())`\n开始发送:\n.......完成发送 1 个包。\n....\n接收 13 个包，得到 1 个答案，剩余 0 个包\n>>> `if int(ans[IP].ttl)\
  \ <= 64:`\n... print \"Host is Linux\"\n... else:\n... print \"Host is Windows\"\
  \n...\nHost is Windows\n\n通过发送相同的请求，可以测试 TTL 值的整数等值以判断其是否小于或等于 64。如果是，我们可以假设该设备可能运行\
  \ Linux/Unix 操作系统。否则，如果该值小于或等于 64，我们可以假设该设备最可能运行 Windows 操作系统。整个过程可以使用可执行的 Python\
  \ 脚本自动化：\n\n```python\n#!/usr/bin/python\n\nfrom scapy.all import *\nimport logging\n\
  \nlogging.getLogger(\"scapy.runtime\").setLevel(logging.ERROR)\nimport sys\n\nif\
  \ len(sys.argv) != 2:\n    print \"Usage - ./ttl_id.py [IP Address]\"\n    print\
  \ \"Example - ./ttl_id.py 10.0.0.5\"\n    sys.exit()\n\nprint \"Example will perform\
  \ ttl analysis to attempt to determine whether the system is Windows or Linux/Unix\"\
  \n\nip = sys.argv[1]\nans = sr1(IP(dst=str(ip))/ICMP(),timeout=1,verbose=0)\n\n\
  if ans == None:\n    print \"No response was returned\"\nelif int(ans[IP].ttl) <=\
  \ 64:\n    print \"Host is Linux/Unix\"\nelse:\n    print \"Host is Windows\"\n\
  ```\n\n235\n\n指纹识别\n\n提供的 Python 脚本将接受一个单一参数，即要扫描的 IP 地址。根据返回响应的 TTL 值，脚本将对远程操作系统进行最佳推测。可以通过\
  \ `chmod` 更改文件权限，然后直接从写入脚本的目录调用它：`root@KaliLinux:~# chmod 777 ttl_id.py`\n\n`root@KaliLinux:~#\
  \ ./ttl_id.py`\nUsage - ./ttl_id.py [IP Address]\nExample - ./ttl_id.py 10.0.0.5\n\
  Example will perform ttl analysis to attempt to determine whether the system is\
  \ Windows or Linux/Unix\n`root@KaliLinux:~# ./ttl_id.py 172.16.36.134`\nHost is\
  \ Windows\n\n`root@KaliLinux:~# ./ttl_id.py 172.16.36.135`\nHost is Linux/Unix\n\
  \n### 工作原理……\n\nWindows 操作系统传统上传输网络流量的起始 TTL 值为 128，而 Linux/Unix 操作系统传统上传输网络流量的起始\
  \ TTL 值为 64。通过假设从一个设备到另一个设备的跳数不超过 64 次，可以安全地假设 Windows 系统将传输 TTL 值在 65 到 128 之间的回复，而\
  \ Linux/Unix 系统将传输 TTL 范围在 1 到 64 之间的回复。当扫描系统和远程目标之间存在拦截请求并重新封装包的设备时，这种识别方法可能会变得不再那么有用。\n\
  \n236\n\n第 4 章\n\n### 使用 Nmap 进行操作系统识别\n\n虽然 TTL 分析对识别远程操作系统有所帮助，但更全面的解决方案更为理想。Nmap\
  \ 具有远超简单 TTL 分析的操作系统识别功能。本特定教程将演示如何使用 Nmap 基于探测-响应分析进行操作系统识别。\n\n### 准备工作\n\n要使用\
  \ Nmap 进行操作系统识别，你需要一个运行着可以探测和检查的网络服务的远程系统。在提供的示例中，使用了 Windows XP 安装版来执行此任务。有关设置\
  \ Windows 系统的更多信息，请参阅第 1 章*入门*中的*安装 Windows Server*配方。\n\n### 如何操作……\n\n要执行 Nmap\
  \ 操作系统识别扫描，调用 Nmap 时应指定 IP 地址和 `-O` 选项：\n\n`root@KaliLinux:~# nmap 172.16.36.134\
  \ -O`\n\n```\nStarting Nmap 6.25 ( http://nmap.org ) at 2013-12-19 10:59 EST\nNmap\
  \ scan report for 172.16.36.134\nHost is up (0.00044s latency).\nNot shown: 991\
  \ closed ports\nPORT STATE SERVICE\n22/tcp open ssh\n135/tcp open msrpc\n139/tcp\
  \ open netbios-ssn\n445/tcp open microsoft-ds\n4444/tcp open krb524\n8080/tcp open\
  \ http-proxy\n8081/tcp open blackice-icecap\n15003/tcp open unknown\n15004/tcp open\
  \ unknown\nMAC Address: 00:0C:29:18:11:FB (VMware)\nDevice type: general purpose\n\
  Running: Microsoft Windows XP|2003\nOS CPE: cpe:/o:microsoft:windows_xp::sp2:professional\n\
  cpe:/o:microsoft:windows_server_2003\nOS details: Microsoft Windows XP Professional\
  \ SP2 or Windows Server 2003\nNetwork Distance: 1 hop\nOS detection performed. Please\
  \ report any incorrect results at http://nmap.org/submit/ .\nNmap done: 1 IP address\
  \ (1 host up) scanned in 15.67 seconds\n```\n\n在提供的输出中，Nmap 将指示运行的操作系统，或者提供几个可能的操作系统列表。在这种情况下，Nmap\
  \ 指出远程系统运行的是 Windows XP 或 Windows Server 2003。\n\n### 工作原理……\n\nNmap 操作系统识别会发送系列全面的探测请求，然后分析这些请求的响应，尝试根据特定特定的签名和预期行为来识别底层操作系统。此外，你可以在操作系统识别输出的底部看到\
  \ Nmap 依赖用户的反馈，以确保其服务指纹的持续可靠性。\n\n### 使用 xProbe2 进行操作系统识别\n\nxProbe2 是一个为了识别远程操作系统设计的全面工具。本特定教程将演示如何使用\
  \ xProbe2 基于探测-响应分析进行操作系统识别。\n\n### 准备工作\n\n要使用 xProbe2 进行操作系统识别，你需要一个运行着可以探测和检查的网络服务的远程系统。在提供的示例中，使用了\
  \ Metploitable2 实例来执行此任务。有关设置 Metploitable2 的更多信息，请参阅第 1 章*入门*中的*安装 Metploitable2*配方。\n\
  \n238\n\n第 4 章\n\n### 如何操作……\n\n要使用 xProbe2 对远程系统执行操作系统识别扫描，需要向程序传递一个单一参数，即要扫描系统的\
