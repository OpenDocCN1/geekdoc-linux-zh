  \ (VMware)\n\nNmap done: 4 IP addresses (4 hosts up) scanned in 13.27 seconds\n\n\
  在提供的示例中，执行了一项扫描以确定执行目录下 `iplist.txt` 文件中的任何系统是否在 `123` 端口上运行了 NTP 服务。\n\n### 工作原理……\n\
  \n虽然 Nmap 仍然需要应对与 UDP 扫描相关的许多相同挑战，但它仍然是一个非常有效的解决方案，因为它经过了优化，结合了最有效且最快速的技术来识别存活服务。\n\
  \n### 使用 Metasploit 进行 UDP 扫描\n\nMetasploit 拥有一个辅助模块（auxiliary module），可以用于扫描特定的常用的\
  \ UDP 端口。此教程演示了我们如何使用该辅助模块来扫描单个系统或多个运行 UDP 服务的系统。\n\n### 准备工作\n\n要使用 Metasploit\
  \ 执行 UDP 扫描，你需要一个通过 UDP 运行网络服务的远程系统。在提供的示例中，使用了 `Metasploitable2` 实例来执行此任务。有关有关如何设置\
  \ `Metasploitable2` 的更多信息，请参考*第 1 章，入门*。\n\n### 如何操作……\n\n在定义要运行的模块之前，需要打开 Metasploit。在\
  \ Kali Linux 中打开 Metasploit，我们在终端会话中按所示使用 `msfconsole` 命令：\n\n```\nroot@KaliLinux:~#\
  \ msfconsole\n# cowsay++\n____________\n< metasploit >\n------------\n\\ ,__,\n\\\
  \ (oo)____\n(__) )\\\n||--|| ***\nLarge pentest? List, sort, group, tag and search\
  \ your hosts and services in Metasploit Pro -- type 'go_pro' to launch it now.\n\
  =[ metasploit v4.6.0-dev [core:4.6 api:1.0]\n+ -- --=[ 1053 exploits - 590 auxiliary\
  \ - 174 post\n+ -- --=[ 275 payloads - 28 encoders - 8 nops\nmsf > use auxiliary/scanner/udp_sweep\n\
  msf auxiliary(udp_sweep) > show options\n```\n\nModule options:\nName Current Setting\
  \ Required Description\n---- --------------- -------- -----------\nBATCHSIZE 256\
  \ yes The number of hosts to probe in each set\nCHOST no The local client address\n\
  RHOSTS yes The target address range or CIDR identifier\nTHREADS 1 yes The number\
  \ of concurrent threads\n\n在在提供的示例中，`RHOSTS` 值被更改为想要扫描的远程系统的 IP 地址。此外，线程数已更改为 `20`。`THREADS`\
  \ 值定义了后台执行的并发任务数量。确定线程值是为了找到一个平衡点，既能显著提高速度，又不会过度消耗系统资源。对于大多数系统而言，20 个线程是一个快速且安全的并发数量。在更新必要的变量后，可以再次使用\
  \ `show options` 命令验证配置：\n\n```\nmsf auxiliary(udp_sweep) > set RHOSTS 172.16.36.135\n\
  RHOSTS => 172.16.36.135\nmsf auxiliary(udp_sweep) > set THREADS 20\nTHREADS => 20\n\
  msf auxiliary(udp_sweep) > show options\n```\n\nModule options (auxiliary/scanner/udp_sweep):\n\
  Name Current Setting Required Description\n---- --------------- -------- -----------\n\
  BATCHSIZE 256 yes The number of hosts to probe in each set\nCHOST no The local client\
  \ address\nRHOSTS 172.16.36.135 yes The target address range or CIDR identifier\n\
  THREADS 20 yes The number of concurrent threads\n\n一旦验证了所需的配置，就可以启动扫描：\n\n```\n\
  msf auxiliary(udp_sweep) > run\n```\n\n\n\n\n\n## ---- --------------- --------\
