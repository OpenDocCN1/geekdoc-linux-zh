  \ complete)\n[*] Auxiliary module execution completed\n```\n\n### 工作原理……\n\n使用 Metasploit\
  \ 辅助模块进行 UDP 扫描不如使用 Nmap 进行 UDP 扫描那样全面。它只针对有限数量的服务，但在识别这些端口上的活跃服务方面非常有效，且速度比大多数其他可用的\
  \ UDP 扫描方案都快。\n\n## 使用 Scapy 进行隐蔽扫描\n\n执行 TCP 端口扫描的一种方法是对目标端口进行部分 TCP 三次握手，以识别这些端口是否接受连接。这种扫描被称为隐蔽扫描、SYN\
  \ 扫描或半开放扫描。本特定配方将演示如何使用 Scapy 执行 TCP 隐蔽扫描。\n\n### 准备工作\n\n要使用 Scapy 执行 TCP 隐蔽扫描，你将需要一个通过\
  \ TCP 运行可访问网络服务的远程系统。在提供的示例中，使用了 Metasploitable2 实例来执行此任务。有关如何设置 Metasploitable2\
  \ 的更多信息，请参阅`第 1 章`，`入门指南`。此外，本节将要求使用文本编辑器（如 `VIM` 或 `Nano`）向文件系统写入脚本。有关如何编写脚本的更多信息，请参阅`第\
  \ 1 章$，`入门指南`中的`使用文本编辑器 (VIM and Nano)`配方。\n\n### 如何操作……\n\n为了演示如何执行 SYN 扫描，我们使用\
