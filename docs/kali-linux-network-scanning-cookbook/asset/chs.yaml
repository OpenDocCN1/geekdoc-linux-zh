  \ hosts (092% complete)\n[*] Scanned 256 of 256 hosts (100% complete)\n[*] Auxiliary\
  \ module execution completed\n\n### 工作原理……\n\nMetasploit 执行 TCP 建立扫描的底层原理与之前与其他工具所讨论的原理是相同的。使用\
  \ Metasploit 执行此类扫描的优势在于，它可以减少用户需要熟悉的工具总数。\n\n## 使用 Dmitry 进行连接扫描\n\n另一个可以用于对远程系统执行\
  \ TCP 建立扫描的备备选工具是 Dmitry。与 Nmap 和 Metasploit 不同，Dmitry 是一个非常简单的工具，我们可以用它进行快速方便的扫描，而无需管理配置的开销。本特定示例演示了如何使用\
  \ Dmitry 执行 TCP 建立扫描。\n\n### 准备工作\n\n要使用 Dmitry 执行全连接扫描，你将一个通过 TCP 运行网络服务的远程系统。在提供的示例中，使用了\
  \ Metasploitable2 实例来执行此任务。有关如何设置 Metasploitable2 的更多信息，请参阅第 1 章“入门”。\n\n192\n\n\
  第 3 章\n\n### 如何操作……\n\nDmitry 是一个多功能工具，可对目标系统执行 TCP 扫描。它的功能相当有限，但它是一个可以快速有效使用的简单工具。要查看\
  \ Dmitry 可用的选项，我们在终端中不带带任何参数地执行以下程序：\n\n```bash\nroot@KaliLinux:~# dmitry\n```\n\
  \nDeepmagic 信息收集工具\n“这里正在发生一些深奥魔法”\n用法: dmitry [-winsepfb] [-t 0-9] [-o %host.txt]\
  \ host\n\n-o 将输出保存到 %host.txt 或由 -o 指定的文件\n-i 对主机的 IP 地址进行 whois 查询\n-w 对主机的域名进行\
  \ whois 查询\n-n 获取主机的 Netcraft.com 信息\n-s 搜索可能的子域名\n-e 搜索可能的电子邮件地址\n-p 对主机执行 TCP\
  \ 端口扫描\n-f 对主机执行 TCP 端口扫描，并显示报告过滤端口的输出\n-b 读取从扫描端口接收到的 banner（标志标志）\n-t 0-9 设置扫描\
  \ TCP 端口时以秒为单位的 TTL（默认 2）\n*需要传递 -p 标记\n\n如用法输出所示，可以使用 -p 选项执行 TCP 端口扫描。执行此操作，我们使用此选项配合要扫描系统的\
  \ IP 地址。Dmitry 有 150 个常用的预配置端口将进行扫描。在这些端口中，它将显示任何发现的开放端口。考虑以下示例：\n\n```bash\nroot@KaliLinux:~#\
  \ dmitry -p 172.16.36.135\n```\n\nDeepmagic 信息收集工具\n“这里正在发生一些深奥魔法”\n错误：无法为 172.16.36.135\
  \ 定位主机名\n继续使用有限模块\nHostIP:172.16.36.135\nHostName:\n\n193\n\n端口扫描\n为 172.16.36.135\
  \ 收集了 TCP 端口信息\n---------------------------------\n端口 状态\n21/tcp open\n22/tcp open\n\
  23/tcp open\n25/tcp open\n53/tcp open\n80/tcp open\n111/tcp open\n139/tcp open\n\
  端口扫描完成：扫描了 150 个端口，141 个端口处于关闭状态\n\n使用 Dmitry 进行 TCP 端口扫描没有太多的自定义空间，但它是评估单个主机上常用服务的快速且有效的方法。我们还可以使用\
  \ -o 选项将 Dmitry 扫描的结果输出到文本文件，并在执行目录中指定输出的文件名：\n\n```bash\nroot@KaliLinux:~# dmitry\
  \ -p 172.16.36.135 -o output\nroot@KaliLinux:~# ls\noutput.txt\nroot@KaliLinux:~#\
  \ cat output.txt\n```\n\n错误：无法为 172.16.36.135 定位主机名\n继续使用有限模块\nHostIP:172.16.36.135\n\
  HostName:\n为 172.16.36.135 收集了 TCP 端口信息\n---------------------------------\n端口 状态\n\
  21/tcp open\n22/tcp open\n23/tcp open\n25/tcp open\n\n194\n\n第 3 章\n53/tcp open\n\
  80/tcp open\n111/tcp open\n139/tcp open\n端口扫描完成：扫描了 150 个端口，141 个端口处于关闭状态\n\n###\
  \ 工作原理……\n\nMetasploit 执行 TCP 建立扫描的底层原理与之前与其他工具所讨论的原理是相同的。使用 Metasploit 执行此类扫描的优势在于，它可以减少用户需要熟悉的工具总数。\n\
  \n## 使用 Netcat 进行端口扫描\n\n由于 Netcat 是一个套接字连接和管理工具，它可以很容易转换为 TCP 端口扫描工具。本特定示例演示了如何使用\
  \ Netcat 执行 TCP 建立扫描。\n\n### 准备工作\n\nNetcat 是一个极其实用的多功能网络工具，可用于多种用途。一个一个有效用法是执行端口扫描。要识别用法选项，应带\
  \ -h 选项调用 nc (Netcat)，如下：\n\n```bash\nroot@KaliLinux:~# nc -h\n```\n\n[v1.10-40]\n\
  连接到某处: nc [-options] hostname port[s] [ports] ...\n监听输入: nc -l -p port [-options]\
  \ [hostname] [port]\n\n选项:\n-c 将 shell 命令作为 `-e`；使用 /bin/sh 执行 [危险!!]\n-e 连接后执行文件名程序\
  \ [危险!!]\n-b 允许广播\n\n\n\n\n\n- `-g 网关源路由跳点[s]，最多 8 个`\n- `-G 源路由指针数量: 4, 8, 12,\
  \ ...`\n- `-h 此杂项说明`\n- `-i 发送行和扫描端口的延迟间隔（秒）\n- `-k 在 socket 上设置 keepalive 选项`\n\
  - `-l 监听模式，用于入站连接`\n- `-n 仅使用数字 IP 地址，不进行 DNS 解析\n- `-o 流量的十六进制转储文件`\n- `-p 本地端口号`\n\
  - `-r 随机本地和远程端口`\n- `-q 在标准输入遇到 EOF 后退出，并等待若干秒（秒）\n- `-s addr 本地源地址`\n- `-T tos\
  \ 设置服务类型 (Type Of Service)`\n- `-t 回答 TELNET 协商`\n- `-u UDP 模式`\n- `-v 详细模式 [使用两次可更详细]`\n\
  - `-w 连接和最终网络读取的超时时间（秒）\n- `-z 零 I/O 模式 [用于扫描]`\n- `port numbers` 可以是单个或范围：`lo-hi\
  \ [包含边界];`\n- 端口名中的 `hyphens` 必须用反斜杠转义（例如 `'ftp\\-data'`）。\n\n如用法输出所示，`-z` 选项可以有效地用于扫描。要扫描目标系统的\
  \ TCP 80 端口，我们使用 `-n` 选项表示使用 IP 地址，`-v` 选项用于详细输出，以及 `-z` 选项进行扫描，如下：\n\n```bash\n\
  root@KaliLinux:~# nc -nvz 172.16.36.135 80\n(UNKNOWN) [172.16.36.135] 80 (http)\
  \ open\nroot@KaliLinux:~# nc -nvz 172.16.36.135 443\n(UNKNOWN) [172.16.36.135] 443\
  \ (https) : Connection refused\n```\n\n对开放端口执行扫描尝试将返回 IP 地址、端口地址和端口状态。对存活主机上的关闭端口执行相同的扫描将指示连接被拒绝。我们可以像下面的命令所示，在循环中实现此过程：\n\
  \n```bash\nroot@KaliLinux:~# for x in $(seq 20 30); do nc -nvz 172.16.36.135 $x;\n\
  done\n(UNKNOWN) [172.16.36.135] 20 (ftp-data) : Connection refused\n(UNKNOWN) [172.16.36.135]\
  \ 21 (ftp) open\n(UNKNOWN) [172.16.36.135] 22 (ssh) open\n(UNKNOWN) [172.16.36.135]\
  \ 23 (telnet) open\n(UNKNOWN) [172.16.36.135] 24 (?) : Connection refused\n(UNKNOWN)\
  \ [172.16.36.135] 25 (smtp) open\n(UNKNOWN) [172.16.36.135] 26 (?) : Connection\
  \ refused\n(UNKNOWN) [172.16.36.135] 27 (?) : Connection refused\n(UNKNOWN) [172.16.36.135]\
  \ 28 (?) : Connection refused\n(UNKNOWN) [172.16.36.135] 29 (?) : Connection refused\n\
  (UNKNOWN) [172.16.36.135] 30 (?) : Connection refused\n```\n\n一组连续的端口号可以通过循环传递，从而轻松、快速地扫描所有端口。然而，在提供的示例中，输出结果包含了开放端口和关闭端口的输出。这只有在扫描少量端口时是可以接受的。\n\
  \n但是，如果正在扫描大量端口，通过筛选所有关闭端口来寻找开放端口可能会很不方便。因此，我们可以直觉地尝试将输出通过管道传递并使用 grep 过滤出开放端口相关的行，如下：\n\
  \n```bash\nroot@KaliLinux:~# for x in $(seq 20 30); do nc -nvz 172.16.36.135 $x;\n\
  done | grep open\n(UNKNOWN) [172.16.36.135] 20 (ftp-data) : Connection refused\n\
  (UNKNOWN) [172.16.36.135] 21 (ftp) open\n(UNKNOWN) [172.16.36.135] 22 (ssh) open\n\
  (UNKNOWN) [172.16.36.135] 23 (telnet) open\n(UNKNOWN) [172.16.36.135] 24 (?) : Connection\
  \ refused\n(UNKNOWN) [172.16.36.135] 25 (smtp) open\n(UNKNOWN) [172.16.36.135] 26\
  \ (?) : Connection refused\n(UNKNOWN) [172.16.36.135] 27 (?) : Connection refused\n\
  (UNKNOWN) [172.16.36.135] 28 (?) : Connection refused\n(UNKNOWN) [172.16.36.135]\
  \ 29 (?) : Connection refused\n(UNKNOWN) [172.16.36.135] 30 (?) : Connection refused\n\
  ```\n\n然而，在尝试对输出进行管道处理并 grep 时，总输出仍然被返回。这是因为 Netcat 输出到 `STDERR` 而不是 `STDOUT`。要有效地从该工具的输出中\
  \ grep，必须使用 `2>&1` 将输出重定向到 `STDOUT`，如下：\n\n```bash\nroot@KaliLinux:~# for x in $(seq\
  \ 20 30); do nc -nvz 172.16.36.135 $x;\ndone 2>&1 | grep open\n(UNKNOWN) [172.16.36.135]\
  \ 21 (ftp) open\n(UNKNOWN) [172.16.36.135] 22 (ssh) open\n(UNKNOWN) [172.16.36.135]\
  \ 23 (telnet) open\n(UNKNOWN) [172.16.36.135] 25 (smtp) open\n```\n\n通过将输出传递到 `STDOUT`\
  \ 然后从该输出中 grep，我们能够隔离出提供开放端口详细信息的输出行。我们可以变得更加简洁，只从这些行中提取我们需要的信息。如果扫描的是单个主机，我们可能只从第三和第四字段中受益：\n\
  \n```bash\nroot@KaliLinux:~# for x in $(seq 20 30); do nc -nvz 172.16.36.135 $x;\n\
  done 2>&1 | grep open | cut -d \" \" -f 3-4\n21 (ftp)\n22 (ssh)\n23 (telnet)\n25\
  \ (smtp)\n```\n\n要从输出中提取这些字段，可以使用 `cut` 函数按空格分隔符拆分行，然后指定输出的字段。然而，在 Netcat 中还有一种有效方法可以在不通过循环工具的情况下指定端口范围。\n\
  \n通过将 `nc` 以一系列连续的端口地址值进行传递，Netcat 将自动仅显示开放端口：\n\n```bash\nroot@KaliLinux:~# nc\
  \ 172.16.36.135 -nvz 20-30\n(UNKNOWN) [172.16.36.135] 25 (smtp) open\n(UNKNOWN)\
  \ [172.16.36.135] 23 (telnet) open\n(UNKNOWN) [172.16.36.135] 22 (ssh) open\n(UNKNOWN)\
  \ [172.16.36.135] 21 (ftp) open\n```\n\n同样，我们需要将它的输出传递到 `STDOUT`，以便将其传递给 `cut` 函数。通过显示第\
  \ 2 到第 4 个字段，我们将输出限制为 IP 地址、端口地址和关联服务，如下：\n\n```bash\nroot@KaliLinux:~# nc 172.16.36.135\
  \ -nvz 20-30\n21 (ftp)\n22 (ssh)\n23 (telnet)\n25 (smtp)\n```\n\n\n\n所有 IP 数据包中都存在一个值：ID\
  \ 号。根据系统的不同，此 ID 号可能是随机生成的、可能始终置零，或者在每次发送 IP 数据包时递增 1。如果发现一个具有增量 IPID 序列的主机，且该主机未与其他网络系统交互，则可以作为识别其他系统上开放端口的手段。我们可以通过发送一系列\
  \ IP 包并分析响应来识别远程系统的 IPID 序列模式：\n\n```python\n>>> reply1 = sr1(IP(dst=\"172.16.36.134\"\
  )/TCP(flags=\"SA\"),timeout=2,verbose=0)\n>>> reply2 = sr1(IP(dst=\"172.16.36.134\"\
  )/TCP(flags=\"SA\"),timeout=2,verbose=0)\n>>> reply1.display()\n```\n\n199\n\n*端口扫描*\n\
  \n### [ IP ]\n\nversion= 4L\nihl= 5L\ntos= 0x0\nlen= 40\nid= 61\nflags=\nfrag= 0L\n\
  ttl= 128\nproto= tcp\nchksum= 0x9938\nsrc= 172.16.36.134\ndst= 172.16.36.180\noptions=\n\
  \n### [ TCP ]\n\nsport= http\ndport= ftp_data\nseq= 0\nack= 0\ndataofs= 5L\nreserved=\
  \ 0L\nflags= R\nwindow= 0\nchksum= 0xe22\nurgptr= 0\noptions= {}\n\n### [ Padding\
  \ ]\n\nload= '\\x00\\x00\\x00\\x00\\x00\\x00'\n\n```python\n>>> reply2.display()\n\
  ```\n\n### [ IP ]\n\nversion= 4L\nihl= 5L\ntos= 0x0\nlen= 40\nid= 62\nflags=\n\n\
  200\n\n*第 3 章*\n\nfrag= 0L\nttl= 128\nproto= tcp\nchksum= 0x992d\nsrc= 172.16.36.134\n\
  dst= 172.16.36.180\noptions=\n\n### [ TCP ]\n\nsport= http\ndport= ftp_data\nseq=\
  \ 0\nack= 0\ndataofs= 5L\nreserved= 0L\nflags= R\nwindow= 0\nchksum= 0xe22\nurgptr=\
  \ 0\noptions= {}\n\n### [ Padding ]\n\nload= '\\x00\\x00\\x00\\x00\\x00\\x00'\n\n\
  如果我们向一个空闲的 Windows 系统发送两个 IP 包，可以检查响应中 IP 层下 ID 属性的整数值。注意，第一个请求的响应 ID 为 61，而第二个请求的响应\
  \ ID 为 62。该主机确实具有增量 IPID 序列，假设假设它保持空闲，则可以作为僵尸扫描（zombie scanning）的有效僵尸。要执行僵尸扫描，必须先向僵尸系统发送一个初始\
  \ SYN+ACK 请求，以确定返回的 RST 包中的当前 IPID 值。然后，向扫描目标发送一个伪造的 SYN 包，源 IP 地址为僵尸系统。如果端口开放，扫描目标将向僵尸发送一个\
  \ SYN+ACK 响应。由于僵尸实际上并没有发送初始 SYN 请求，它会将 SYN+ACK 请求解释为未经请求的连接并向目标发送 RST 包，从而使其 IPID\
  \ 递增 1。最后，应向僵尸发送另一个 SYN+ACK 包，它将返回一个 RST 包并再次使 IPID 增加。如果 IPID 比初始响应增加了 2，说明所有这些事件已发生，且扫描系统上的目标端口是开放的。\n\
  \n201\n\n*端口扫描*\n\n相反，如果扫描目标上的端口是关闭的，将发生另一系列事件，这将导致最终的 RST 响应仅增加了 1。如果扫描目标上的目标端口关闭，则会对初始伪造的\
  \ SYN 包向僵尸系统发送一个 RST 包。由于 RST 包不需要任何响应，僵尸系统的 IPID 值不会增加。因此，响应 SYN+ACK 包时返回给扫描系统的最终\
  \ RST 包仅增加了 1。\n\n为了简化这一过程，可以使用 Python 编写以下脚本，该脚本既能识别可用的僵尸系统，又能对扫描目标执行僵尸扫描：\n\n\
  ```python\n#!/usr/bin/python\n\nimport logging\nlogging.getLogger(\"scapy.runtime\"\
  ).setLevel(logging.ERROR)\nfrom scapy.all import *\n\ndef ipid(zombie):\n    reply1\
  \ = sr1(IP(dst=\"172.16.36.134\")/TCP(flags=\"SA\"),timeout=2,verbose=0)\n    reply2\
  \ = sr1(IP(dst=\"172.16.36.134\")/TCP(flags=\"SA\"),timeout=2,verbose=0)\n    if\
  \ reply2.id == reply1.id + 2:\n        return True\n    return False\n\ndef zombiescan(target,\
  \ zombie):\n    print(f\"Scanning {target} with zombie {zombie}\")\n    print(\"\
  Open Ports on Target--------\")\n    for port in range(1, 1024):\n        try:\n\
  \            start_val = sr1(IP(dst=zombie)/TCP(flags=\"SA\", dport=port), timeout=2,\
  \ verbose=0)\n            if start_val:\n                end_val = sr1(IP(dst=zombie)/TCP(flags=\"\
  ACK\", dport=port), timeout=2, verbose=0)\n                if end_val and end_val.id\
  \ == start_val.id + 1:\n                    print(port)\n        except:\n     \
  \       pass\n\nif __name__ == \"__main__\":\n    zombie = input(\"Enter zombie\
  \ IP: \")\n    if ipid(zombie):\n        print(\"Zombie is incremental and idle.\"\
  )\n        target = input(\"Enter target IP: \")\n        zombiescan(target, zombie)\n\
  \    else:\n        print(\"Zombie is not incremental or not idle.\")\n```\n\n\n\
  \n\n要在本地实验室环境中启动系统，请参考`第 1 章` `Getting Started` 中的 `Installing Metasploitable2`\
  \ 和 `Installing Windows Server` 菜方。此外，本节将要求使用文本编辑器（如 `VIM` 或 `Nano`）将脚本写入文件系统。有关如何编写脚本的更多信息，请参考`第\
  \ 1 章` `Getting Started` 中的 `Using text editors (VIM and Nano)` 菜方。\n\n### 如何操作……\n\
  \n也可以通过 `Nmap` 的一个选项来执行僵尸扫描。然而，在使用 `Nmap` 僵尸扫描之前，我们可以通过扫描整个地址范围并使用 `Metasploit`\
  \ 评估 IPID 序列模式，快速找到任何可用的僵尸候选主机。要执行此操作，我们需要使用 `msfconsole` 命令打开 `Metasploit`，然后按照如下方式选择\
  \ IPID 序列辅助模块：\n\n```\nroot@KaliLinux:~# msfconsole\n\n+-------------------------------------------------------+\n\
  | METASPLOIT by Rapid7 |\n+---------------------------+---------------------------+\n\
