  \ Nessus，可以通过浏览器通过 https://127.0.0.1:8834/ 访问它。\n\n或者，您也可以通过远程系统（例如您的主机操作系统）使用 Kali\
  \ Linux 虚拟机的 IP 地址通过 浏览器访问它。在提供的示例中，从主机操作系统访问 Nessus 服务的正确 URL 是 https://172.16.36.244:8834：\n\
  \n默认情况下，Nessus 服务使用自签名 SSL 证书，因此您将收到不可信连接的警告。对于安全实验室用途，您可以忽略此警告并继续。可以通过展开如下截图所示的“我理解风险”（I\
  \ Understand the Risks）选项来实现：\n\n37\n\n![](img/index-51_1.jpg)\n\n![](img/index-51_2.jpg)\n\
