  \ Started）按钮。这将引导您进入以下屏幕：\n\n必须设置的第一个配置是管理员账户和关联密码。这些凭据将用于登录和使用 Nessus 服务。输入新的用户名和密码后，点击“下一步”（Next）继续；您将看到以下屏幕：\n\
  \n随后您需要输入插件馈源激活码。如果您没有激活码，请参考本教程的“准备工作”（Getting ready）部分。最后，在输入激活码后，您将返回登录页面并被输入用户名和密码。在这里，您需要输入在安装过程中创建的相同凭据。以下是未来每次访问该\
  \ URL 时 Nessus 加载的默认屏幕：\n\n38\n\n![](img/index-52_1.jpg)\n\n## 第 1 章\n\n### 工作原理…\n\
  \n正确安装后，Nessus 漏洞扫描器应该可以通过主机系统以及所有安装了图形化网络浏览器的虚拟机访问。这是因为 Nessus 服务托管在 TCP 端口 8834，且主机以及所有其他虚拟系统的网络接口都位于同一个私有\
  \ IP 空间。\n\n## 在 Kali Linux 上配置 Burp Suite\n\nBurp Suite Proxy 是最强大的 Web 应用审计工具之一。然而，它并不是一个可以轻松点击即可启动的工具。必须修改\
  \ Burp Suite 应用程序和关联浏览器的配置，以确保它们之间能够正常通信。\n\n### 准备工作\n\n在 Kali Linux 中初始执行 Burp\
  \ Suite 无需任何操作。免费版是一个集成工具，并且已经安装。或者，如果您选择使用专业版，可以在 https://pro.portswigger.net/buy/\
  \ 购买许可证。\n\n许可证相对便宜，且额外功能非常值得拥有。然而，免费版仍然非常有用，并向用户免费提供大部分核心功能。\n\n39\n\n![](img/index-53_1.jpg)\n\
  \n### 开始上手\n\n### 如何操作…\n\nBurp Suite 是一个 GUI 工具，需要访问图形桌面才能运行。因此，Burp Suite 不能通过\
  \ SSH 使用。在 Kali Linux 中启动 Burp Suite 有两种方法。您可以在应用程序菜单中导航到 Applications | Kali Linux\
  \ | Top 10 Security Tools | burpuite 来找到它。或者，您可以在 bash 终端中将其传递给 Java 解释器来执行，如下所示：\n\
  \n```\nroot@kali:~# java -jar /usr/bin/burpsuite.jar\n```\n\n一旦 Burp Suite 加载，确保代理监听器（Proxy\
  \ listener）在所需的端口上激活并运行。在提供的示例中，使用了 TCP 端口 8080。可以通过选择“代理”（Proxy）标签然后选择下方的“选项”（Options）标签来验证这些配置，如下所示：\n\
  \n在这里，您将看到所有代理监听器的列表。如果没有，请添加一个。要与 Kali Linux 中的 IceWeasel 浏览器配合，请配置监听器监听 127.0.0.1\
  \ 地址上的专用端口。同时，确保“已运行”（Running）复选框已激活。在 Burp Suite 中配置好监听器后，您还需要修改 IceWeasel 浏览器配置以通过代理路由流量。要这样做，点击屏幕顶部的\
  \ weasel 地球图标打开 IceWeasel。打开后，展开“编辑”（Edit）下拉菜单并点击“偏好”（Preferences）获取以下截图：\n\n40\n\
  \n![](img/index-54_1.jpg)\n\n![](img/index-54_2.jpg)\n\n![](img/index-54_3.jpg)\n\
  \n## 第 1 章\n\n在 IceWeasel 偏好菜单中，点击顶部的“高级”（Advanced options）按钮，然后选择“网络”（Network）标签。然后，点击“连接”（Connection）标题下的“设置”（Settings）按钮。这将弹出如下所示的连接设置配置菜单：\n\
  \n默认情况下，代理单选按钮设置为“使用系统代理设置”（Use system proxy settings）。这需要\n\n\n\n\n更改为手动代理配置。手动代理配置应与\
  \ `Burp Suite Proxy` 监听器配置相同。在提供的示例中，HTTP 代理地址被设置为 `127.0.0.1`，端口值设置为 `TCP 8080`。要捕获其他流量（例如\
  \ HTTPS），点击 `Use this proxy server for all protocols` 复选框。要验证所有操作运行正常，请尝试如后续截图所示使用\
  \ `IceWeasel` 浏览器访问网站：\n\n41\n\n![](img/index-55_1.jpg)\n\n## 入门\n\n如果你的配置正确，你应该看到浏览器正尝试连接，但浏览器中不会渲染任何内容。这是因为从浏览器发送的请求被代理拦截了。代理拦截是\
  \ `Burp Suite` 使用的默认配置。要确认请求已成功捕获，请返回所示的 `Burp Suite Proxy` 界面：\n\n在这里，你应该看到被捕获的请求。若要继续使用浏览器进行其他用途，你可以点击\
  \ `Intercept is on` 按钮将其禁用，将代理配置更改为被动监听；或者你可以将浏览器中的代理设置改回 `Use system proxy settings`\
  \ 选项，仅在使用 `Burp` 时使用手动代理设置。\n\n### 工作原理……\n\n在 `Burp Suite` 中进行的初始配置在 `TCP 8080`\
  \ 上创建了一个监听端口。该端口用于 `Burp Suite` 拦截所有 Web 流量，并接收响应返回的传入流量。通过将 `IceWeasel` 浏览器的代理配置指向此端口，我们指示浏览器中生成的所有流量都应该通过\
  \ `Burp Suite Proxy` 路由。得于 `Burp` 提供的功能，我们现在可以随意修改传输中的流量。\n\n## 使用文本编辑器（VIM 和 Nano）\n\
  \n文本编辑器将频繁用于创建或修改文件系统中的现有文件。当你要在 `Kali` 中创建自定义脚本时，都应该使用文本编辑器。当你想要修改配置文件或现有的渗透测试工具时，也应该使用文本编辑器。\n\
  \n42\n\n## 第一章\n\n### 准备工作\n\n在 `Kali Linux` 中使用文本编辑器工具之前无需采取额外的步骤。`VIM` 和 `Nano`\
  \ 都是集成工具，已安装在操作系统中。\n\n### 如何操作……\n\n要在 `Kali` 中使用 `VIM` 文本编辑器创建文件，请使用 `vim` 命令后跟要创建或修改的文件名：\n\
  \n```bash\nroot@kali:~# vim vim_demo.txt\n```\n\n在提供的示例中，`VIM` 被用于创建一个名为 `vim_demo.txt`\
  \ 的文件。由于当前活动目录下不存在该名称的文件，`VIM` 会自动创建一个新文件并打开一个空白文本编辑器。要开始向编辑器输入文本，请按 `I` 键或 `Insert`\
  \ 按钮。\n\n然后，按照所示输入所需的文本：\n\n```text\nWrite to file demonstration with VIM\n~\n~\n\
  ~\n~\n```\n\n在提供的示例中，文本文件中仅添加了一行。然而，在大多数情况下，你在创建新文件时很可能会使用多行。完成后，按 `Esc` 键退出插入模式并进入\
  \ `VIM` 的命令模式。然后，输入 `:wq` 并按 `Enter` 键保存。随后你可以使用以下 bash 命令验证文件是否存在并验证文件内容：\n\n```bash\n\
  root@kali:~# ls\nDesktop vim_demo.txt\nroot@kali:~# cat vim_demo.txt\nWrite to file\
  \ demonstration with VIM\n```\n\n`ls` 命令可查看当前目录的内容。在这里，你可以看到创建了 `vim_demo.txt` 文件。`cat`\
  \ 命令可读取并显示文件内容。另一个可用的文本编辑器是 `Nano`。`Nano` 的基本用法与 `VIM` 非常相似。开始之前，使用 `nano` 命令后跟要创建或修改的文件名：\n\
  \n```bash\nroot@kali:~# nano nano_demo.txt\n```\n\n43\n\n## 入门\n\n在提供的示例中，`nano`\
  \ 被用于打开名为 `nano_demo.txt` 的文件。由于当前不存在该名称的文件，将创建一个新文件。与 `VIM` 不同，它没有独立的命令模式和写入模式。相反，写入文件可以自动完成，并通过按\
  \ `Ctrl` 键配合特定的字母键来执行命令。这些命令列表始终显示在文本编辑器界面的底部：`GNU nano 2.2.6 File: nano_demo.txt`\n\
  \n```text\nWrite to file demonstration with Nano\n```\n\n在提供的示例中，向 `nano_demo.txt`\
  \ 文件写入了一行内容。要关闭编辑器，你可以使用 `Ctrl` + `X`。系统将提示你使用 `y` 保存文件或使用 `n` 不保存。系统会要求你确认要写入的文件名。默认情况下，这将填充为执行\
  \ `Nano` 时提供的名称。然而，可以更改此值并将文件内容保存到不同的文件名，如下所示：\n\n```bash\nroot@kali:~# ls\nDesktop\
  \ nano_demo.txt vim_demo.txt\nroot@kali:~# cat nano_demo.txt\nWrite to file demonstration\
  \ with Nano\n```\n\n完成后，可以再次使用 `ls` 和 `cat` 命令分别验证文件是否已写入目录以及验证文件内容。本节教程的意图是讨论这些编辑器中每种的基本用法，以编写和操作文件。然而，需要注意的是，它们都是非常健壮的文本编辑器。\n\
  \n### 工作原理……\n\n文本编辑器无非是命令行驱动的文字处理工具。这些工具中的每一个及其功能都可以在没有任何图形界面的情况下执行。由于没有任何图形组件，这些工具的开销极小且运行速度极快。因此，它们在快速修改文件或通过远程接口处理文件时非常有效。\n\
  \n44\n\n## 2 发现扫描\n\n发现扫描是识别网络上活动主机的过程。在渗透测试的背景下，这通常用于识别潜在目标。这里的目标不是在收集目标信息方面耗尽资源，而是仅仅找到目标所在地。我们发现的最终产物应该是\
  \ IP 地址列表，然后可以使用其进行分析。在本章中，我们将讨论如何使用运行在第 2 层、第 3 层和第 4 层的协议来发现网络上的主机。本章将包含以下教程：\n\
  \n- 使用 `Scapy` 进行第 2 层发现\n- 使用 `ARPing` 进行第 2 层发现\n- 使用 `Nmap` 进行第 2 层发现\n- 使用 `NetDiscover`\
  \ 进行第 2 层发现\n- 使用 `Metasploit` 进行第 2 层发现\n- 使用 `ICMP ping` 进行第 3 层发现\n- 使用 `Scapy`\
  \ 进行第 3 层发现\n- 使用 `Nmap` 进行第 3 层发现\n- 使用 `fping` 进行第 3 层发现\n- 使用 `hping3` 进行第 3\
  \ 层发现\n- 使用 `Scapy` 进行第 4 层发现\n- 使用 `Nmap` 进行第 4 层发现\n- 使用 `hping3` 进行第 4 层发现\n\n\
  *发现扫描*\n\n在具体介绍每种扫描技术之前，我们应该先解决一些底层原理。开放系统互连（OSI）模型是国际标准组织（ISO）的一项标准，定义了网络系统如何通信。该模型被分为七层，定义了应用内容如何从一个系统发送并/或被另一个系统接收。OSI\
  \ 模型的上层对终端用户来说更为可见，而下层对大多数普通用户来说是透明的。这些层包括：\n\n\n\n\n\n# OSI 模型\n\n## 层描述\n\n###\
  \ 协议\n\n#### 第 7 层 – 应用层\n该层涉及用于发送接收数据的应用软件，如 `HTTP`、`FTP` 和 `Telnet`。\n\n### 第\
  \ 6 层 – 表示层\n该层定义了数据的格式或组织方式：`ASCII`、`JPEG`、`PDF`、`PNG` 和 `DOCX`。\n\n### 层 – 会话层\n\
  该层涉及应用会话控制、管理、同步和终止：`NetBIOS`、`PPTP`、`RPC` 和 `SOCKS`。\n\n### 第 4 层 – 传输层\n该层涉及端到端通信服务：`TCP`\
  \ 和 `UDP`。\n\n### 第 3 层 – 网络层\n该层涉及逻辑系统地址：`IPv4`、`IPv6`、`ICMP` 和 `IPSec`。\n\n###\
  \ 第 2 层 – 数据链路层\n该层涉及物理系统地址：`ARP`。\n\n### 第 1 层 – 物理层\n该层涉及在传输线上传输的数据流。\n\n---\n\
  \nOSI 模型的低层主要用于确保网络流量成功到达其预期目标。在这些低层中许多常用的协议都需要目标系统的响应，因此，潜在的攻击者可以利用它们来识别在线系统。本节其余部分讨论的技术将利用第\
  \ `2`、`3` 和 `4` 层协议来发现在线网络系统。在介绍每个具体的配方之前，我们将简要讨论所使用的协议以及如何利用它们进行资产发现。\n\n使用 `ARP`\
  \ 进行第 2 层发现的优缺点如下：\n\n**优点：**\n- 速度极快\n- 高度可靠\n\n**缺点：**\n- 无法发现远程系统（不可路由协议）\n\n\
  第 2 层发现扫描是通过通过利用地址解析协议 (`ARP`) 流量完成的。`ARP` 是一种第 2 层协议，主要功能是将逻辑第 3 层 `IP` 地址转换为物理第\
  \ 2 层 `MAC` 地址。当一个系统需要定位与目标 `IP` 地址对应的物理地址时，它会在本地网络网段上广播一个 `ARP` 请求包。此 `ARP` 请求仅仅是询问整个网络：“谁拥有这个\
  \ IP 地址？”具有指定 `IP` 地址的系统将直接向查询系统响应 `ARP` 回复，其中包含其第 2 层 `MAC` 地址。查询系统将更新其 `ARP` 缓存（`IP`\
  \ 地址和 `MAC` 地址关联的临时记录），然后启动与主机的通信。`ARP` 协议在发现网络上的在线主机时非常有用，因为它在响应请求之前不采用任何形式的身份识别或授权。\n\
  \n结果，入侵者连接到本地网络并枚举在线主机是可能的，甚至是轻而易举的。这可以通过对完整的 `IP` 地址列表发送一系列 `ARP` 请求，然后记录收到响应的查询\
  \ `IP` 地址列表来实现。`ARP` 发现既有优点也有缺点。它在发现扫描中非常有用，因为它是最快且最可靠的发现协议。遗憾的是，它也是一种不可路由协议，只能用于发现本地子网上的主机。\n\
  \n使用 `ICMP` 进行第 3 层发现的优缺点如下：\n\n**优点：**\n- 可以发现远程系统（可路由协议）\n- 仍然相对较快\n\n**缺点：**\n\
  - 比 `ARP` 发现慢\n- 经常被防火墙过滤\n\n第 3 层发现可能是网络管理员和技术人员中最广为人知的常用的发现技术。在 `Windows` 和 `nix`\
  \ 系统上自带的著名的 `ping` 命令行工具使用了第 3 层发现。这种形式的发现利用了互联网控制消息协议 (`ICMP`)。虽然 `ICMP` 有多个功能，但特别适用于识别在线主机的是回显请求（echo\
  \ request）和回显响应（echo response）消息。`ICMP` 回显请求技术上等同于一个系统询问另一个系统：“你在吗？”。`ICMP` 回显响应是接收系统回答“我在”的方式。要确定特定\
  \ `IP` 地址是否存在主机，系统可以向该地址发送 `ICMP` 回显请求。如果存在该 `IP` 地址的主机且一切运行符合预期，该主机将返回 `ICMP` 回显应答。通过对完整的\
  \ `IP` 地址列表在循环中执行此序列，可以在主机发现中利用此协议。\n\n输出将仅包含收到回复的 `IP` 地址列表。第 3 层发现之所以有效，是因为因为它使用了可路由协议来识别在线主机。然而，其使用也存在某些缺点。`ICMP`\
  \ 发现没有 `ARP` 发现那么快。此外，`ICMP` 发现没有 `ARP` 发现那么可靠，因为某些主机被故意配置为不响应 `ICMP` 流量，防火墙经常被配置为丢弃\
  \ `ICMP` 流量。尽管如此，它仍然是在远程地址范围内发现潜在目标的快速常用方法。\n\n第 4 层发现非常有效，因为公共可路由系统通常只位于公共 `IP`\
  \ 空间，因为它们托管了通过传输控制协议 (`TCP`) 或用户数据报协议 (`UDP`) 可用的网络服务。在安全性较低的环境中可以通过向其 `IP` 地址发送几乎任何\
  \ `UDP` 或 `TCP` 请求来从远程服务器索取回复。然而，如果使用了状态过滤，可能仅通过指向与在线服务相关的端口地址的 `SYN` 请求来从远程服务索取响应。即使在具有高级过滤的高安全环境中，如果提供了正确的请求，在大多数情况下仍然可以发现。但是，由于\
  \ `UDP` 和 `TCP` 服务都有 65,536 个可能的端口地址，完全全面的发现过程可能会非常耗时。结合 `TCP` 和 `UDP` 技术进行第 4 层发现的最佳方法是在详尽性和效率之间找到最佳平衡。\n\
  \n使用 `TCP` 进行第 4 层发现的优缺点如下：\n\n**优点：**\n- 可以发现远程系统（可路由协议）\n- 比 `ICMP` 更可靠（过滤器较少或仅选择性实现）\n\
  \n**缺点：**\n- 状态防火墙过滤器可能会产生不可靠的结果\n- 详尽的发现可能非常耗时\n\n使用 `TCP` 进行第 4 层发现包括向激活了各种 `TCP`\
  \ 标志位的目标地址发送 `TCP` 包。不同的标志配置可以触发各种响应，这些响应可用于识别在线主机。未请求的 `TCP` 结束 (`FIN`) 或确认 (`ACK`)\
  \ 包通常会触发来自远程服务器的重置 (`RST`) 响应。发送到远程服务器的同步 (`SYN`) 包通常会根据服务的状态触发 `SYN+ACK` 或 `RST`\
  \ 响应。其意图不是索取特定的响应，而是索取任何响应。来自给定 `IP` 地址的任何响应都是对该系统确实在线的确认。\n\n使用 `UDP` 进行第 4 层发现的优缺点如下：\n\
  \n**优点：**\n- 可以发现远程系统（可路由协议）\n- 甚至可以发现所有 `TCP` 服务都被过滤的远程主机\n\n**缺点：**\n- `ICMP`\
  \ 端口不可达响应的不一致使用和过滤使得无差别发现不可靠\n- 服务特定的探测技术限制了详尽性并增加了所需的扫描时间\n\n`UDP` 发现涉及向不同的目标端口发送\
  \ `UDP` 探测包，以尝试从在线主机索取响应。`UDP` 发现有时对于识别所有 `TCP` 服务都被过滤的主机非常有效。然而，`UDP` 发现可能棘手，因为某些\
  \ `UDP` 服务会用 `ICMP` 端口不可达响应响应 `UDP` 包，而其他服务则仅对与运行服务特定的唯一请求做出响应。\n\n\n\n\n此外，ICMP\
  \ 流量通常会受到防火墙出站限制的过滤过滤，这使得进行无差别的 UDP 发现变得非常困难。因此，有效的 UDP 发现扫描通常需要针对不同的服务采用不同的独特技术。\n\
  \n### 使用 Scapy 执行二层发现\n\nScapy 是一个强大的交互式工具，可用于捕获、分析、操纵甚至创建符合协议标准的网络流量，然后将其注入到网络中。\n\
  \nScapy 也是一个可以在 Python 中使用的库，从而提供了创建极其高效脚本来执行网络流量处理和操纵的能力。本特定的配方将将如何如何使用 Scapy 执行\
  \ ARP 发现，以及如何使用 Python 和 Scapy 创建脚本来简化二层发现过程。\n\n### 准备工作\n\n要使用 Scapy 执行 ARP 发现，你需要在局域网（LAN）上至少有一个能够响应\
  \ ARP 请求的系统。在所提供的示例中，使用了 Linux 和 Windows 系统的组合。有关在本地实验环境中设置系统的更多详细信息，请参阅*第 1 章*，*入门*中的*安装\
  \ Metasploitable2* 和*安装 Windows Server* 菜方。此外，本节还需要使用文本编辑器（如 `VIM` 或 `Nano`）向文件系统写入脚本。有关编写脚本的更多详细信息，请参阅*第\
  \ 1 章*，*入门*中的*使用文本编辑器（VIM 和 Nano）* 菜方。\n\n### 如何操作……\n\n为了理解 ARP 发现的工作原理，我们将开始使用\
  \ Scapy 构造自定义包，这将允许我们使用 ARP 识别局域网上的主机。要在 Kali Linux 中开始使用 Scapy，请在终端输入 `scapy` 命令。然后可以使用\
  \ `display()` 函数如下方式查看 Scapy 中创建的任何 ARP 对象的默认配置：\n\n```bash\nroot@KaliLinux:~# scapy\n\
  Welcome to Scapy (2.2.0)\n\n>>> ARP().display()\n###[ ARP ]###\nhwtype= 0x1\nptype=\
  \ 0x800\nhwlen= 6\nplen= 4\nop= who-has\nhwsrc= 00:0c:29:fd:01:05\npsrc= 172.16.36.232\n\
  hwdst= 00:00:00:00:00:00\npdst= 0.0.0.0\n```\n\n注意，IP 和 MAC 源地址都自动配置为与运行 Scapy 的主机相关联的值。除非你正在伪造另一个源地址，否则对于任何\
  \ Scapy 对象，这些值都永远不需要更改。\n\nARP 的默认操作码（opcode）值自动设置为 `who-has`，这意味着该数据包将请求 IP 和 MAC\
  \ 关联。在这种情况下，我们只需要提供目标 IP 地址。为了实现这一点，我们可以使用 `ARP` 函数创建一个对象并将其赋值给变量。变量的名称并不重要（在提供的示例中，使用了变量名\
  \ `arp_request`）。请查看以下命令：\n\n```python\n>>> arp_request = ARP()\n>>> arp_request.pdst\
  \ = \"172.16.36.135\"\n>>> arp_request.display()\n###[ ARP ]###\nhwtype= 0x1\nptype=\
  \ 0x800\nhwlen= 6\nplen= 4\nop= who-has\nhwsrc= 00:0c:29:65:fc:d2\npsrc= 172.16.36.132\n\
  hwdst= 00:00:00:00:00:00\npdst= 172.16.36.135\n```\n\n注意，`display()` 函数也可以应用于已创建的\
  \ ARP 对象，以验证配置值已更新。对于此练习，请使用对应于你实验室网络中活动机器的目标 IP 地址。然后可以使用 `sr1()` 函数将请求发送到线缆上并返回第一个响应：\n\
  \n```python\n>>> sr1(arp_request)\nBegin emission:\n......................................*Finished\
  \ to send 1 packets.\nReceived 39 packets, got 1 answers, remaining 0 packets\n\
  <ARP hwtype=0x1 ptype=0x800 hwlen=6 plen=4 op=is-at\nhwsrc=00:0c:29:3d:84:32 psrc=172.16.36.135\
  \ hwdst=00:0c:29:65:fc:d2\npdst=172.16.36.132 |<Padding load='\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\\nx00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00' |>>\n\
  ```\n\n注意，在这些情况中，都返回了响应，表明 `172.16.36.135` 的 IP 地址位于 MAC 地址 `00:0C:29:3D:84:32`。如果你执行相同的任务，但分配了一个不对应于实验室网络中活动主机的目标\
  \ IP 地址，你将接收不到任何响应，且该函数将无限分析本地接口上的入站流量。\n\n你可以使用 `Ctrl` + `C` 强制函数停止。或者，你可以指定一个超时（timeout）参数来避免这个问题。当在\
  \ Python 脚本中使用 Scapy 时，使用超时设置将变得至关重要。要使用超时，应向发送/接收函数提供额外的参数，指定等待传入响应的秒数：\n\n```python\n\
  >>> arp_request.pdst = \"172.16.36.134\"\n>>> sr1(arp_request, timeout=1)\nBegin\
  \ emission:\n.........................................................................\n\
  ............Finished to send 1 packets. .................................\n.........................................................................\n\
  ........................................\nReceived 3285 packets, got 0 answers,\
  \ remaining 1 packets\n>>>\n```\n\n通过使用超时函数，发送到无响应主机的请求将在指定时间后返回，表明捕获到 0 个答案。此外，此函数接收到的响应也可以赋值给变量，并可以通过调用该变量对响应进行后续处理：\n\
  \n```python\n>>> response = sr1(arp_request, timeout=1)\nBegin emission:\n....................................*Finished\
  \ to send 1 packets.\nReceived 37 packets, got 1 answers, remaining 0 packets\n\
  >>> response.display()\n###[ ARP ]###\nhwtype= 0x1\nptype= 0x800\nhwlen= 6\nplen=\
  \ 4\nop= is-at\nhwsrc= 00:0c:29:3d:84:32\npsrc= 172.16.36.135\nhwdst= 00:0c:29:65:fc:d2\n\
  pdst= 172.16.36.132\n###[ Padding ]###\nload= '\\x00\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\**\nx00\\x00\\x00'\n```\n\n或者，你可以通过直接调用函数并传递任何配置作为参数来执行相同任务，如下命令所示。这可以避免使用变量的杂乱，并允许一行代码完成整个任务：\n\
  \n```python\n>>> sr1(ARP(pdst=\"172.16.36.135\"))\nBegin emission:\n.........................*Finished\
  \ to send 1 packets.\nReceived 26 packets, got 1 answers, remaining 0 packets\n\
  <ARP hwtype=0x1 ptype=0x800 hwlen=6 plen=4 op=is-at\nhwsrc=00:0c:29:3d:84:32 psrc=172.16.36.135\
  \ hwdst=00:0c:29:65:fc:d2\npdst=172.16.36.132 |<Padding load='\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\\nx00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00' |>>\n\
  ```\n\nScapy 还可以作为 Python 脚本语言中的库使用。这可以有效地自动化在 Scapy 中执行的重复任务。Python 和 Scapy 可以按顺序遍历局域网内所有可能的主机地址，并向每个地址发送\
  \ ARP 请求。一个用于对一系列主机主机执行二层发现的功能性脚本示例如下所示：\n\n```python\n#!/usr/bin/python\nimport\
  \ logging\nimport subprocess\nimport sys\nlogging.getLogger(\"scapy.runtime\").setLevel(logging.ERROR)\n\
  from scapy.all import *\n\nif len(sys.argv) != 2:\n    print \"Usage - ./arp_disc.py\
  \ [interface]\"\n    print \"Example - ./arp_disc.py eth0\"\n    print \"Example\
  \ 将对分配给 eth0 的局域网进行 ARP 扫描\"\n    sys.exit()\n\ninterface = str(sys.argv[1])\nip\
  \ = subprocess.check_output(\"ifconfig \" + interface + \" | grep 'inet addr' |\
  \ cut -d ':' -f 2 | cut -d ' ' -f 1\", shell=True).strip()\n```\n\n\n\n\n\n```python\n\
  prefix = ip.split('.')[0] + '.' + ip.split('.')[1] + '.' +\nip.split('.')[2] + '.'\n\
  \nfor addr in range(0,254):\n    answer=sr1(ARP(pdst=prefix+str(addr)),timeout=1,verbose=0)\n\
  \    if answer == None:\n        pass\n    else:\n        print prefix+str(addr)\n\
  ```\n\n脚本的第一行指示了 Python 解释器的位置，这样脚本就可以无需传递给解释器即可执行。随后脚本导入了所有的 Scapy 函数，并定义了 Scapy\
  \ 日志级别以消除脚本中不必要的输出。还导入了 `subprocess` 库，以便于方便从系统调用中提取信息。第二个代码块是一个条件测试，用于评估是否为脚本提供了必需的参数。如果在执行时未提供必需参数，脚本将输出关于正确脚本用法的说明。该说明包含了工具的用法、一个示例以及对该示例将执行的任务的解释。\n\
  \n53\n\n![](img/index-67_1.jpg)\n\n### 发现扫描\n\n在此代码块之后，有一行孤立的代码，将提供的参数赋值给接口变量。下一个代码块利用\
  \ `subprocess` 的 `check_output()` 函数执行 `ifconfig` 系统调用，并同时利用 `grep` 和 `cut` 从作为参数提供的本地接口中提取\
  \ IP 地址。该输出随后被赋值给 `ip` 变量。然后使用 `split` 函数从 IP 地址字符串中提取出 `/24` 网络前缀。例如，如果 `ip` 变量包含\
  \ `192.168.11.4` 字符串，那么 `192.168.11.` 的值将被赋值给 `prefix` 变量。最后一个代码块是一个执行实际扫描的 `for`\
  \ 循环。`for` 循环遍历 0 到 254 之间的所有值，每次迭代都会将该值附加到网络前缀之后。在之前提供的示例中，会对 `192.168.11.0` 到\
  \ `192.168.11.254` 之间的每个 IP 地址广播一个 `ARP` 请求。对于每个有响应的主机，相应的 IP 地址将打印到屏幕上，以指示该主机在局域网（LAN）上是存活的。一旦脚本被写入本地目录，你可以使用点和正斜杠加上执行脚本的在终端中执行它。查看以下执行该脚本的命令：\n\
  \n```\nroot@KaliLinux:~# ./arp_disc.py\nUsage - ./arp_disc.py [interface]\nExample\
  \ - ./arp_disc.py eth0\nExample 将对分配给 eth0 的本地子网进行 ARP 扫描\n```\n\n如果在未提供任何参数的情况下执行脚本，用法将输出到屏幕上。用法输出表明此脚本需要一个参数，用于定义应使用哪个\
  \ `interface` 来执行扫描。在下面的示例中，使用 `eth0` 接口执行脚本：\n\n```\nroot@KaliLinux:~# ./arp_disc.py\
  \ eth0\n172.16.36.1\n172.16.36.2\n172.16.36.132\n172.16.36.135\n172.16.36.254\n\
  ```\n\n运行后，脚本将确定所提供接口的本地子网；在该子网上执行 ARP 扫描，然后根据这些 IP 所属主机的响应输出一个存活 IP 地址列表。此外，可以在脚本运行时同时运行\
  \ Wireshark，以观察请求如何顺序对每个地址进行广播，以及存活主机如何响应这些请求，如下截图所示：54\n\n### 第二章\n\n此外，人们可以轻松地将脚本的输出重定向到文本文件中，供后续分析使用。可以使用右括号后跟文本文件名来重定向输出。如下例如所示：\n\
  \n```\nroot@KaliLinux:~# ./arp_disc.py eth0 > output.txt\nroot@KaliLinux:~# ls output.txt\n\
  output.txt\nroot@KaliLinux:~# cat output.txt\n172.16.36.1\n172.16.36.2\n172.16.36.132\n\
  172.16.36.135\n172.16.36.254\n```\n\n一旦输出被重定向到输出文件，你可以使用 `ls` 命令验证文件是否已写入文件系统，或者使用\
  \ `cat` 命令查看文件内容。此脚本也可以轻松修改，以便仅对文本文件中包含的某些 IP 地址执行 ARP 请求。要实现这一点，我们首先需要创建一个我们想要扫描的\
  \ IP 地址列表。为此，你可以使用 `Nano` 或 `VIM` 文本编辑器。为了评估脚本的功能，请包含一些之前发现的存活地址，以及同一范围内其他一些随机选择的、不对应于任何存活主机的地址。若要在\
  \ `VIM` 或 `Nano` 中创建输入文件，请使用以下命令之一：\n\n```\nroot@KaliLinux:~# vim iplist.txt\nroot@KaliLinux:~#\
  \ nano iplist.txt\n```\n\n一旦创建了输入文件，你可以使用 `cat` 命令验证其内容。假设文件创建正确，你应该能看到在文本编辑器中输入的相同\
  \ IP 地址列表：\n\n```\nroot@KaliLinux:~# cat iplist.txt\n172.16.36.1\n172.16.36.2\n\
  172.16.36.232\n172.16.36.135\n172.16.36.180\n172.16.36.203\n172.16.36.205\n172.16.36.254\n\
  ```\n\n55\n\n### 发现扫描\n\n为了创建一个接受文本文件作为输入的脚本，我们可以修改上一个练习中的现有脚本，也可以创建一个新的脚本文件。为了在脚本中使用此\
  \ IP 地址列表，我们需要在 Python 中进行一些文件处理操作。一个运行脚本示例可能如下：\n\n```python\n#!/usr/bin/python\n\
  import logging\nfrom scapy.all import *\nimport sys\n\nlogging.setLevel(logging.ERROR)\n\
  \nif len(sys.argv) != 2:\n    print \"Usage - ./arp_disc.py [filename]\"\n    print\
  \ \"Example - ./arp_disc.py iplist.txt\"\n    print \"Example 将对 iplist.txt 中的 IP\
  \ 地址进行 ARP 扫描\"\n    sys.exit()\n\nfilename = sys.argv[1]\nfile = open(filename,'r')\n\
  \nfor addr in file:\n    addr = addr.strip()\n    answer = sr1(ARP(pdst=addr),timeout=1,verbose=0)\n\
  \    if answer == None:\n        pass\n    else:\n        print addr\n```\n\n此脚本与之前用于循环序列的脚本唯一真实区别在于创建了一个名为\
  \ `file` 的变量而不是 `interface`。然后使用 `open()` 函数通过打开 `iplist.txt` 文件来创建一个对象。`r` 值也被传递给该函数以指定只读访问。`for`\
  \ 循环遍历文件中的每个 IP 地址，然后输出响应广播 ARP 请求的 IP 地址。此脚本像之前讨论的那样执行：\n\n```\nroot@KaliLinux:~#\
  \ ./arp_disc.py\nUsage - ./arp_disc.py [filename]\nExample - ./arp_disc.py iplist.txt\n\
  Example 将对 iplist.txt 中的 IP 地址进行 ARP 扫描\n```\n\n如果在未提供任何参数的情况下执行脚本，用法将输出到屏幕上。用法输出表明此脚本需要一个参数，用于定义要扫描的\
  \ IP 地址列表。在下面的示例中，使用执行目录下的 `iplist.txt` 文件执行脚本：\n\n```\nroot@KaliLinux:~# ./arp_disc.py\
  \ iplist.txt\n172.16.36.2\n172.16.36.1\n172.16.36.132\n172.16.36.135\n172.16.36.254\n\
  ```\n\n运行后，脚本将仅输出输入文件中且响应 ARP 请求流量的 IP 地址。这些地址中的每一个都代表局域网上存活的系统。与之前讨论相同，此脚本的输出可以轻松地使用右括号后所需的输出文件名重定向到文件：`root@KaliLinux:~#\
  \ ./arp_disc.py iplist.txt > output.txt`\n\n**root@KaliLinux:~# ls output.txt\n\
  output.txt\nroot@KaliLinux:~# cat output.txt\n172.16.36.2\n172.16.36.1\n172.16.36.132\n\
  172.16.36.135\n172.16.36.254**\n\n\n\n\n\n172.16.36.135\n\n172.16.36.254\n\n一旦输出被重定向到输出文件，你可以使用\
  \ `ls` 命令验证该文件是否已写入文件系统，或者可以使用 `cat` 命令查看文件内容。\n\n### 工作原理……\n\n在 Scapy 中，通过使用 `sr1()`（发送/接收一个）函数可以实现\
  \ ARP 发现。该函数根据提供的参数注入一个数据包，然后等待接收单个响应。在这种情况下，会广播一个单一 ARP 请求，函数将返回该响应。Scapy 库使得这种技术能够易于集成到脚本中，并允许对多个系统进行测试。\n\
  \n### 发现扫描\n\n### 使用 ARPing 执行二层发现\n\n`arp` 是一个命令行网络实用程序，其功能与常用的 `ping` 实用类似。该工具通过提供指定的\
  \ IP 地址作为参数，可以识别本地网络上是否存在处于该 IP 地址的活动主机。本本教程将讨论如何使用 `ARPing` 扫描网络上的活动主机。\n\n###\
  \ 准备工作\n\n要使用 `ARPing` 执行 ARP 发现，你的局域网（LAN）上至少需要一个能够响应 ARP 请求的系统。在提供的示例中，使用了 Linux\
  \ 和 Windows 系统的组合。有关关于在本地实验环境中设置系统的更多信息，请参考`第 1 章，入门指南`中的 `安装 Metasploitable2` 和\
  \ `安装 Windows Server` 教程。此外，此部分还需要使用 `VIM` 或 `Nano` 等文本编辑器向文件系统写入脚本。有关关于编写脚本的更多信息，请参考`第\
  \ 1 章，入门指南`中的`使用文本编辑器 (VIM and Nano)` 教程。\n\n### 如何操作……\n\n`arping` 是一个可以发送 ARP\
  \ 请求并识别主机是否存且有响应的工具。只需将 IP 地址作为参数传递给该工具即可：\n\n```bash\nroot@KaliLinux:~# arping\
  \ 172.16.36.135 -c 1\nARPING 172.16.36.135\n60 bytes from 00:0c:29:3d:84:32 (172.16.36.135):\
  \ index=0 time=249.000 usec\n--- 172.16.36.135 statistics ---\n1 packets transmitted,\
  \ 1 packets received, 0% unanswered (0 extra)\n```\n\n在提供的示例中，向广播地址发送了一个单一的 ARP\
  \ 请求，请求 `172.16.36.135` IP 地址的物理位置。如输出所示，MAC 地址为 `00:0C:29:3D:84:32` 的主机接收到了一个回复。如果使用\
  \ `bash` 脚本同时在多个主机上执行此操作，该工具可以更有效地用于二层发现扫描。为了测试 `bash` 中每个实例的响应，我们应该确定一个包含在响应中的唯一字符串，该字符串表示存在活动主机，但在未收到响应时不会包含该字符串。为了识别唯一字符串，应该对一个无响应的\
  \ IP 地址发送 `ARPing` 请求：\n\n```bash\nroot@KaliLinux:~# arping 172.16.36.136 -c 1\n\
  ARPING 172.16.36.136\n--- 172.16.36.136 statistics ---\n1 packets transmitted, 0\
  \ packets received, 100% unanswered (0 extra)\n```\n\n通过分析成功和失败的 `arpings` 的不同响应，人们可能会注意到，字符串中的唯一字节仅在提供的\
  \ IP 地址关联有活动主机时才会存在于响应中，而且它位于包含该 IP 地址的行内。通过对此响应进行 `grepping`，我们可以提取出每个响应主机的 IP\
  \ 地址：\n\n```bash\nroot@KaliLinux:~# arping -c 1 172.16.36.135 | grep \"bytes from\"\
  \n60 bytes from 00:0c:29:3d:84:32 (172.16.36.135): index=0 time=291.000 usec\nroot@KaliLinux:~#\
  \ arping -c 1 172.16.36.136 | grep \"bytes from\"\nroot@KaliLinux:~#\n```\n\n在对实际主机\
  \ IP 执行 `ARPing` 时，`Grepping` 这一唯一字符串会返回一个包含该 IP 地址的行，如上一组命令中的第一个响应所示。对未与实际主机关联的\
  \ IP 地址执行相同任务将返回空结果，如上一组命令中的最后一个响应所示。\n\n使用带有特殊构造的分隔符 `-d` 和字段 (`-f`) 值的 `cut` 命令，我们可以快速地从此字符串中提取\
  \ IP 地址。命令行函数 `cut` 可用于 `bash` 中，根据指定的分隔符将行分割为数组。然后可以通过指定字段从 `cut` 函数中返回特定值。通过多次对输出进行管道，我们可以轻松地从返回的字符串中提取\
  \ MAC 地址。请看下组命令：\n\n```bash\nroot@KaliLinux:~# arping -c 1 172.16.36.135 | grep\
  \ \"bytes from\"\n60 bytes from 00:0c:29:3d:84:32 (172.16.36.135): index=0 time=10.000\
  \ usec\nroot@KaliLinux:~# arping -c 1 172.16.36.135 | grep \"bytes from\" | cut\
  \ -d \" \" -f 4\n00:0c:29:3d:84:32\n```\n\n我们只需通过操作传递 `cut` 函数的分隔符和字段值，即可轻松地从返回的字符串中提取\
  \ IP 地址：\n\n```bash\nroot@KaliLinux:~# arping -c 1 172.16.36.135 | grep \"bytes\
  \ from\"\n60 bytes from 00:0c:29:3d:84:32 (172.16.36.135): index=0 time=328.000\
  \ usec\nroot@KaliLinux:~# arping -c 1 172.16.36.135 | grep \"bytes from\" | cut\
  \ -d \" \" -f 5\n(172.16.36.135):\nroot@KaliLinux:~# arping -c 1 172.16.36.135 |\
  \ grep \"bytes from\" | cut -d \" \" -f 5 | cut -d \"(\" -f 2\n172.16.36.135):\n\
  root@KaliLinux:~# arping -c 1 172.16.36.135 | grep \"bytes from\" | cut -d \" \"\
  \ -f 5 | cut -d \"(\" -f 2 | cut -d \")\" -f 1\n172.16.36.135\n```\n\n在识别出如何从成功的\
  \ `ARPing` 响应中提取 IP 地址后，我们可以轻松地将此任务通过 `bash` 脚本中的循环传递，并输出活动地址列表。下面是一个使用此技术的脚本示例：\n\
  \n```bash\n#!/bin/bash\nif [ \"$#\" -ne 1 ]; then\n    echo \"Usage: ./arping.sh\
  \ [interface]\"\n    echo \"Example: ./arping.sh eth0\"\n    exit\nfi\n\ninterface=$1\n\
  prefix=$(ifconfig $interface | grep 'inet addr' | cut -d ':' -f 2 | cut -d ' ' -f\
  \ 1 | cut -d '.' -f 1-3)\n\nfor addr in $(seq 1 254); do\n    arping -c 1 $prefix.$addr\
  \ | grep \"bytes from\" | cut -d \" \" -f 5 | cut -d \"(\" -f 2 | cut -d \")\" -f\
  \ 1 &\ndone\n```\n\n在上面的脚本中，第一行定义了 `bash` 解释器的位置。后续代码块执行测试以确定是否提供了预期的参数。这通过评估提供的参数数量是否等于\
  \ 1 来确定。如果没有提供预期的参数，将输出脚本的用法并退出。用法输出表明脚本期望本地接口名称作为参数。下一块代码将所的参数分配给 `interface` 变量。然后将接口值传递给\
  \ `ifconfig`，并使用其输出提取网络前缀。例如，如果提供的接口 IP 地址为 `192.168.11.4`，则 `prefix` 变量将赋值为 `192.168.11`。随后使用\
  \ `for` 循环遍历最后一个八字节的值，以生成本地 /24 网络中所有可能的 IP 地址。对于每个可能的 IP 地址，都会执行单一的 `arping` 命令。这些请求的每个响应都会通过管道处理，然后使用\
  \ `grep` 提取包含 \"bytes from\" 短的行。如前所述，这将仅提取包含活动主机 IP 地址的行。最后，使用一系列 `cut` 函数从该输出中提取\
  \ IP 地址。\n\n\n\n\n\n# 示例 - ./arping.sh eth0\n\n示例将对 `eth0` 所分配的本地子网进行 ARP 扫描。\n\n\
  第 2 章\n\n```\nroot@KaliLinux:~# ./arping.sh eth0\n172.16.36.1\n172.16.36.2\n172.16.36.132\n\
  172.16.36.135\n172.16.36.254\n```\n\n可以很容易地将脚本的输出重定向到文本文件中，然后用于后续分析。可以使用右括号 `>`\
  \ 加上文本文件名来重定向输出。示例如所示：\n\n```\nroot@KaliLinux:~# ./arping.sh eth0 > output.txt\n\
  root@KaliLinux:~# ls output.txt\noutput.txt\nroot@KaliLinux:~# cat output.txt\n\
  172.16.36.1\n172.16.36.2\n172.16.36.132\n172.16.36.135\n172.16.36.254\n```\n\n一旦输出被重定向到输出文件，你可以使用\
  \ `ls` 命令验证该文件是否已写入文件系统，或者使用 `cat` 命令查看文件内容。该脚本也可以修改为从输入文件读取，并仅验证此文件中列出的主机是否存活。对于接下来的脚本，你需要一个包含\
  \ IP 地址列表的输入文件。为此，我们可以使用之前配方中讨论的 Scapy 脚本相同的输入文件：\n\n```bash\n#!/bin/bash\nif [\
  \ \"$#\" -ne 1 ]; then\n  echo \"Usage - ./arping.sh [input file]\"\n  echo \"Example\
  \ - ./arping.sh iplist.txt\"\n  echo \"示例将对 iplist.txt 中定义的所有 IP 地址进行 ARP 扫描\"\n\
  \  exit\nfi\n\nfile=$1\n\nfor addr in $(cat $file); do\n  arping -c 1 $addr | grep\
  \ \"bytes from\" | cut -d \" \" -f 5 | cut -d \"(\" -f 2 | cut -d \")\" -f 1 &\n\
  done\n```\n\n## 发现扫描\n\n此脚本与前一个脚本的主要区别在于，在执行脚本时提供的不是接口名称，而是输入列表的文件名。该参数被传递给变量 `file`。然后使用\
  \ `for` 循环遍历文件中的每个值以执行 ARPing 任务。要执行该脚本，请使用点和正斜杠 `./`，后跟可执行脚本名称：\n\n```\nroot@KaliLinux:~#\
  \ ./arping.sh\nUsage - ./arping.sh [input file]\nExample - ./arping.sh iplist.txt\n\
  示例将对 iplist.txt 中定义的所有 IP 地址进行 ARP 扫描\nroot@KaliLinux:~# ./arping.sh iplist.txt\n\
  172.16.36.1\n172.16.36.2\n172.16.36.132\n172.16.36.135\n172.16.36.254\n```\n\n在提供任何参数的情况下执行脚本将返回脚本的用法。此用法指示应提供一个输入文件作为参数。这样做后，脚本将执行，并从\
  \ IP 地址列表中返回存活的 IP 地址列表。\n\n与之前讨论一样，可以使用右括号 `>` 将此脚本的输出轻松地重定向到输出文件。示例如下：\n\n```\n\
  root@KaliLinux:~# ./arping.sh iplist.txt > output.txt\nroot@KaliLinux:~# ls output.txt\n\
  output.txt\nroot@KaliLinux:~# cat output.txt\n172.16.36.1\n172.16.36.2\n172.16.36.132\n\
  172.16.36.135\n172.16.36.254\n```\n\n一旦输出被重定向到输出文件，你可以使用 `ls` 命令验证该文件是否已写入文件系统，或者使用\
  \ `cat` 命令查看文件内容。\n\n### 工作原理\n\nARPing 是一个旨在用于验证单个主机是否在线的工具。然而，它使用的的简单性使其易于在 bash\
  \ 中进行操作，以顺序扫描多个主机。这是通过循环一系列 IP 地址实现的，然后将这些地址作为参数提供给工具。\n\n第 2 章\n\n## 使用 Nmap 执行第\
  \ 2 层发现\n\nNetwork Mapper (`Nmap`) 是 Kali Linux 中最有效且功能强大的工具之一。Nmap 可用于许多不同的扫描技术，并具有高度的可定制性。在本书中将会介绍该工具。在这个特定的配方中，我们将讨论如何使用\
  \ Nmap 执行第 2 层扫描。\n\n### 准备工作\n\n要使用 Nmap 执行 ARP 发现，你需要在局域网上至少有一个能够响应 ARP 请求的系统。在提供的示例中，使用了\
  \ Linux 和 Windows 系统的组合。有关在本地实验环境中设置环境的更多信息，请参考*第 1 章，入门*中的*安装 Metasploitable2*\
  \ 和*安装 Windows Server* 配方。\n\n### 如何操作……\n\nNmap 是另一个通过单个命令执行自动化第 2 层发现扫描的选项。`-sn`\
  \ 选项被 Nmap 称为 ping 扫描。虽然“ping 扫描”术语自然让你认为正在进行第 3 层发现，但它实际上是自适应的。假设指定的地址位于同一本地子网上，可以使用以下命令执行第\
  \ 2 层扫描：\n\n```\nroot@KaliLinux:~# nmap 172.16.36.135 -sn\nStarting Nmap 6.25 (\
  \ http://nmap.org ) at 2013-12-16 15:40 EST\nNmap scan report for 172.16.36.135\n\
  Host is up (0.00038s latency).\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap done:\
  \ 1 IP address (1 host up) scanned in 0\n```\n\n此命令将向局域网发送 ARP 请求并根据接收到的响应判断主机是否存活。或者，如果针对某个\
  \ IP 地址使用命令，响应将指示该主机是否在线：\n\n```\nroot@KaliLinux:~# nmap 172.16.36.136 -sn\nStarting\
  \ Nmap 6.25 ( http://nmap.org ) at 2013-12-16 15:51 EST\nNote: Host seems down.\
  \ 如果它真的在线，但我们的 ping 探测被拦截了，请尝试 -Pn\nNmap done: 1 IP address (0 hosts up) scanned\
  \ in 0\n```\n\n发现\n\n此命令可以修改为对一系列 IP 地址进行第 2 层发现。要扫描整个 /24 范围，可以使用连字符：\n\n```\n\
  root@KaliLinux:~# nmap 172.16.36.0-255 -sn\nStarting Nmap 6.25 ( http://nmap.org\
  \ ) at 2013-12-16 16:05 EST\nNmap scan report for 172.16.36.1\nHost is up (0.00027s\
  \ latency).\nMAC Address: 00:50:56:C0:00:08 (VMware)\nNmap scan report for 172.16.36.2\n\
  Host is up (0.00032s latency).\nMAC Address: 00:50:56:FF:2A:8E (VMware)\nNmap scan\
  \ report for 172.16.36.132\nHost is up (0.00051s latency).\nMAC Address: 00:0C:29:3D:84:32\
  \ (VMware)\nNmap scan report for 172.16.36.135\nHost is up (0.00014s latency).\n\
  MAC Address: 00:0C:29:65:FC:D2 (VMware)\nNmap scan report for 172.16.36.200\nHost\
  \ is up (0.00026s latency).\nMAC Address: 00:5C:26:EA::4:3A (VMware)\nNmap scan\
  \ report for 172.16.36.254\nHost is up (0.00015s latency).\nMAC Address: 00:50:56:B9:9C\
  \ (VMware)\nNmap done: 256 IP addresses (6 hosts up) scanned in 3.22\n```\n\n使用此命令将向该范围内的所有主机发送\
  \ ARP 请求，并确定活动响应的主机。此扫描也可以针对 IP 地址列表执行，使用 `-iL` 选项：\n\n```\nroot@KaliLinux:~# nmap\
  \ -iL iplist.txt -sn\nStarting Nmap 6.25 ( http://nmap.org ) at 2013-12-16 16:07\
  \ EST\nNmap scan report for 172.16.36.2\nHost is up (0.00026s latency).\nMAC Address:\
  \ 00:50:56:FF:2A:8E (VMware)\nNmap scan report for 172.16.36.1\nHost is up (0.00021s\
  \ latency).\nMAC Address: 00:50:56:C0:00:08 (VMware)\nNmap scan report for 172.16.36.132\n\
  Host is up (0.00031s latency).\nMAC Address: 00:0C:29:65:FC:D2 (VMware)\nNmap scan\
  \ report for 172.16.36.135\nHost is up (0.00014s latency).\nMAC Address: 00:0C:29:3D:84:32\
  \ (VMware)\nNmap scan report for 172.16.36.180\nHost is up.\nNmap scan report for\
  \ 172.16.36.254\nHost is up (0.00024s latency).\nMAC Address: 00:50:56:EF:B9:9C\
  \ (VMware)\nNmap done: 8 IP addresses (6 hosts up) scanned in 0.41\n```\n\n\n\n\n\
  \n当使用 `-sn` 参数时，`Nmap` 会首先尝试通过第 2 层 ARP 请求定位主机，只有当主机不在局域网（LAN）中时，它才会使用第 3 层 ICMP\
  \ 请求。\n\n注意观察对本地网络（在 `172.16.36.0/24` 私有范围）上的主机执行的 `Nmap` ping 扫描是如何返回 MAC 地址的。这是因为\
  \ MAC 地址是由主机的 ARP 响应返回的。然而，如果对不同局域网上的远程主机执行相同的 `Nmap` ping 扫描，响应将将不再包含系统 MAC 地址：\n\
  \n```\nroot@KaliLinux:~# nmap -sn 74.125.21.0-255\nStarting Nmap 6.25 ( http://nmap.org\
  \ ) at 2013-12-11 05:42 EST\nNmap scan report for 74.125.21.0\nHost is up (0.0024s\
  \ latency).\nNmap scan report for 74.125.21.1\nHost is up (0.00017s latency).\n\
  Nmap scan report for 74.125.21.2\nHost is up (0.00028s latency).\nNmap scan report\
  \ for 74.125.21.3\nHost is up (0.00017s latency).\n```\n\n### 发现扫描\n\n当对远程网络范围（公共范围\
  \ `74.125.21.0/24`）执行时，你可以发现使用了第 3 层发现，因为没有返回任何 MAC 地址。这表明 `Nmap` 在可能的情况下会自动利用第\
  \ 2 层发现的速度，但在必要时，它会使用可路由的 ICMP 请求来发现第 3 层的远程主机。在对本地网络上的主机执行 `Nmap` ping 扫描时，使用 `Wireshark`\
  \ 监控流量也可以看到这一点。在下面的截图中，你可以看到 `Nmap` 利用 ARP 请求来识别本地网段上的主机：\n\n### 工作原理……\n\n`Nmap`\
  \ 已经功能非常强大，几乎不需要或无需任何修改即可运行所需的扫描。其底层原理是相同的。`Nmap` 向一系列 IP 地址的广播地址发送 ARP 请求，并通过标记响应来识别活动主机。然而，由于此功能已集成到\
  \ `Nmap` 中，只需提供适当的参数即可执行。\n\n### 使用 NetDiscover 执行第 2 层发现\n\n`NetDiscover` 是一种通过主动和被动\
  \ ARP 分析来识别网络主机的工具。它主要设计用于在无线接口上使用；但在交换机环境中同样有效。在这个特定的特定的配方中，我们将讨论如何使用 `NetDiscover`\
  \ 进行主动和被动扫描。\n\n### 准备工作\n\n要使用 `NetDiscover` 执行 ARP 发现，你需要在局域网内至少有一个会响应 ARP 请求的系统。在提供的示例中，使用了\
  \ Linux 和 Windows 系统的组合。有关在本地实验环境中设置系统的更多信息，请参阅 `Chapter 1`，`Getting Started`get\
  \ 中的 `Installing Metasploitable2` 和 `Installing Windows Server` 配方。\n\n### 如何操作……\n\
  \n`NetDiscover` 是一个专为执行第 2 层发现设计的工具。在使用 `-r` 参数时，可以将 CIDR 表示法的网络范围作为参数传递给 `NetDiscover`，从而用于扫描一系列\
  \ IP 地址。输出将生成一个表格，列出活动 IP 地址、相应的 MAC 地址、响应数量、响应长度和 MAC 厂商：\n\n```\nroot@KaliLinux:~#\
  \ netdiscover -r 172.16.36.0/24\nCurrently scanning: Finished! | Screen View: Unique\
  \ Hosts\n5 Captured ARP Req/Rep packets, from 5 hosts. Total size: 300\n________________________________________________________________________\n\
  _____\nIP At MAC Address Count Len MAC Vendor\n------------------------------------------------------------------------\n\
  -----\n172.16.36.1 00:50:56:c0:00:08 01 060 VMWare, Inc.\n172.16.36.2 00:50:56:ff:2a:8e\
  \ 01 060 VMWare, Inc.\n172.16.36.132 00:0c:29:65:fc:d2 01 060 VMware, Inc.\n172.16.36.135\
  \ 00:0c:29:3d:84:32 01 160 VMware, Inc.\n172.16.36.254 00:50:56:ef:b9:9c 01 060\
  \ VMWare, Inc.\n```\n\n`NetDiscover` 也可以从输入文本文件扫描 IP 地址。与其将 CIDR 范围表示法作为参数传递，不如将\
  \ `-l` 参数结合输入文件的名称或路径使用：\n\n```\nroot@KaliLinux:~# netdiscover -l iplist.txt\nCurrently\
  \ scanning: 172.16.36.0/24 | Screen View: Unique Hosts\n39 Captured ARP Req/Rep\
  \ packets, from 5 hosts. Total size: 2340\n________________________________________________________________________\n\
  _____\nIP At MAC Address Count Len MAC Vendor\n------------------------------------------------------------------------\n\
  -----\n172.16.36.1 00:50:56:c0:00:08 08 480 VMWare, Inc.\n172.16.36.2 00:50:56:ff:2a:8e\
  \ 08 480 VMWare, Inc.\n172.16.36.132 00:0c:29:65:fc:d2 08 480 VMware, Inc.\n172.16.36.135\
  \ 00:0c:29:3d:84:32 08 480 VMware, Inc.\n172.16.36.254 00:50:56:ef:b9:9c 07 420\
  \ VMWare, Inc.\n```\n\n该工具与其他工具不同的另一个独特功能是执行被动发现的能力。对整个子网的每个 IP 地址广播 ARP 请求有时会触发入侵检测系统（IDS）或入侵防御系统（IPS）的警报或响应。更隐蔽的方法是监听\
  \ ARP 流量，因为扫描系统会与网络上的其他系统交互，然后记录从 ARP 响应中收集的数据。这种被动扫描技术可以使用 `-p` 参数进行：\n\n```\n\
  root@KaliLinux:~# netdiscover -p\nCurrently scanning: (passive) | Screen View: Unique\
  \ Hosts\n4 Captured ARP Req/Rep packets, from 2 hosts. Total size: 240\n________________________________________________________________________\n\
  _____\nIP At MAC Address Count Len MAC Vendor\n------------------------------------------------------------------------\n\
  -----\n172.16.36.132 00:0c:29:65:fc:d2 02 120 VMware, Inc.\n172.16.36.135 00:0c:29:3d:84:32\
  \ 02 120 VMware, Inc.\n```\n\n### 使用 Metasploit 执行第 2 层发现\n\n`Metasploit` 主要是一个漏洞利用工具，该功能将在后续章节中进行详细讨论。然而，除了其主要功能外，`Metasploit`\
  \ 还具有许多辅助模块，用于各种扫描和信息收集。\n\n\n\n\n收集任务。特别是其中一个辅助模块，可以用于对本地子网进行 ARP 扫描。这对于许多人非常有帮助，因为\
  \ Metasploit 是大多数渗透测试员熟悉的工具，而将此功能集成到 Metasploit 中可以减少在特定测试期间所需的工具总数。本特定配方将演示如何使用\
  \ Metasploit 进行 ARP 发现。\n\n### 准备工作\n\n要使用 Metasploit 执行 ARP 发现，你的局域网（LAN）上至少有一个能够响应\
  \ ARP 请求的系统。在提供的示例中，使用了 Linux 和 Windows 系统的组合。有关在本地实验环境中设置系统的更多信息，请参阅`第 1 章` `入门`\
  \ 中的 `Installing Metasploitable2` 和 `Installing Windows Server` 配方。\n\n## 发现扫描\n\
  \n### 如何操作……\n\n尽管 Metasploit 通常被认为一个漏洞利用框架，但它也拥有大量的辅助模块，可以用于扫描和信息收集。特别有一个辅助模块可以用于二层发现。要启动\
  \ Metasploit 框架，使用 `msfconsole` 命令。然后，使用 `use` 命令结合所需的模块来配置扫描：\n\n```\nroot@KaliLinux:~#\
  \ msfconsole\nMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM\nMMMMMMMMMMMMM MMMMMMMMMM\n\
  MMMN$ vMMMM\nMMMNl MMMMM MMMMM JMMMM\nMMMNl MMMMMMMN NMMMMMMM JMMMM\nMMMNl MMMMMMMMMNmmmNMMMMMMMMM\
  \ JMMMM\nMMMNI MMMMMMMMMMMMMMMMMMMMMMM jMMMM\nMMMNI MMMMMMMMMMMMMMMMMMMMMMM jMMMM\n\
  MMMNI MMMMM MMMMMMM MMMMM jMMMM\nMMMNI MMMMM MMMMMMM MMMMM jMMMM\nMMMNI MMMNM MMMMMMM\
  \ MMMMM jMMMM\nMMMNI WMMMM MMMMMMM MMMM# JMMMM\nMMMMR ?MMNM MMMMM .dMMMM\nMMMMNm\
  \ `?MMM MMMM` dMMMMM\nMMMMMMN ?MM MM? NMMMMMN\nMMMMMMMMNe JMMMMMNMMM\nMMMMMMMMMMNm,\
  \ eMMMMMNMMN\nMMMMNNMNMMMMMNx MMMMMMNMMNMMNM\nMMMMMMMMNMMNMMMMm+..+MMNMMNMNMMMMNMMMM\n\
  http://metasploit.pro\nFrustrated with proxy pivoting? Upgrade to layer-2 VPN pivoting\
  \ with Metasploit Pro -- type 'go_pro' to launch it now.\n=[ metasploit v4.6.0-dev\
  \ [core:4.6 api:1.0]\n+ -- --=[ 1053 exploits - 590 auxiliary - 174 post\n+ -- --=[\
  \ 275 payloads - 28 encoders - 8 nops\nmsf > use auxiliary/scanner/discovery/arp_sweep\n\
  msf auxiliary(arp_sweep) >\n```\n\n一旦选择了了模块，可以使用 `show options` 命令查看可配置选项：\n\n```\n\
  msf auxiliary(arp_sweep) > show options\nModule options (auxiliary/scanner/discovery/arp_sweep):\n\
  Name Current Setting Required Description\n---- --------------- -------- -----------\n\
  INTERFACE no The name of the interface\nRHOSTS yes The target address range or CIDR\
  \ identifier\nSHOST no Source IP Address\nSMAC no Source MAC Address\nTHREADS 1\
  \ yes The number of concurrent threads\nTIMEOUT 5 yes The number of seconds to wait\
  \ for new data\n```\n\n这些是指定待扫描目标、扫描系统和扫描设置信息的配置选项。此项特定扫描的大部分信息可以通过检查扫描系统的接口配置来收集。方便的是，在\
  \ Metasploit Framework 控制台中可以直接传递系统 shell 命令。在接下来的示例中，通过系统调用来执行 `ifconfig eth1`，而无需离开\
  \ Metasploit Framework 控制台界面：\n\n```\nmsf auxiliary(arp_sweep) > ifconfig eth1\n\
  [*] exec: ifconfig eth1\neth1 Link encap:Ethernet HWaddr 00:0c:29:09:c3:79\ninet\
  \ addr:172.16.36.180 Bcast:172.16.36.255\nMask:255.255.255.0\ninet6 addr: fe80::20c:29ff:fe09:c379/64\
  \ Scope:Link\nUP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1\nRX packets:1576971\
  \ errors:1 dropped:0 overruns:0 frame:0\nTX packets:1157669 errors:0 dropped:0 overruns:0\
  \ carrier:0\ncollisions:0 txqueuelen:1000\nRX bytes:226795966 (216.2 MiB) TX bytes:109929055\
  \ (104.8 MiB)\nInterrupt:19 Base address:0x2080\n```\n\n用于此扫描的接口是 `eth1` 接口。由于二层扫描仅有效识别本地子网上的活动主机，我们应该查看扫描系统的\
  \ IP 和子网掩码来确定扫描范围。在这种情况下，IP 地址和子网掩码表明我们应该扫描 `172.16.36.0/24` 范围。此外，可以在这些配置中识别扫描系统的源\
  \ IP 地址和 MAC 地址。要在 Metasploit 中定义配置，使用 `set` 命令，后跟要定义的变量，然后是想要赋值的值：\n\n```\nmsf\
  \ auxiliary(arp_sweep) > set interface eth1\ninterface => eth1\nmsf auxiliary(arp_sweep)\
  \ > set RHOSTS 172.16.36.0/24\nRHOSTS => 172.16.36.0/24\nmsf auxiliary(arp_sweep)\
  \ > set SHOST 172.16.36.180\nSHOST => 172.16.36.180\nmsf auxiliary(arp_sweep) >\
  \ set SMAC 00:0c:29:09:c3:79\nSMAC => 00:0c:29:09:c3:79\nmsf auxiliary(arp_sweep)\
  \ > set THREADS 20\nTHREADS => 20\nmsf auxiliary(arp_sweep) > set TIMEOUT 5\nTIMEOUT\
  \ => 5\n```\n\n\n\n\n对于本地实验室环境，请参考`第 1 章` `入门指南` 中的 `Installing Metasploitable2`\
  \ 和 `Installing Windows` 服务器配方。此外，本节将需要向文件系统写入一个脚本，并使用如 `VIM` 或 `Nano` 等文本编辑器。关于编写脚本的更多信息，请参考`第\
  \ 1 章` `入门指南` 中的 `Using text editors (VIM and Nano)` 配方。\n\n## 发现扫描\n\n如何操作……\n\n\
  大多数 IT 行业的人员对 `ping` 工具非常熟悉。要使用 `ping` 确定主机是否在线，你只需要向命令传递一个参数来定义你想要测试的 IP 地址即可：\n\
  \n```\nroot@KaliLinux:~# ping 172.16.36.135\nPING 172.16.36.135 (172.16.36.135)\
  \ 56(84) bytes of data.\n64 bytes from 172.16.36.135: icmp_req=1 ttl=64 time=1.35\
  \ ms\n64 bytes from 172.16.36.135: icmp_req=2 ttl=64 time=0.707 ms\n64 bytes from\
  \ 172.16.36.135: icmp_req=3 ttl=64 time=0.369 ms\n^C\n--- 172.16.36.135 ping statistics\
  \ ---\n3 packets transmitted, 3 received, 0% packet loss, time 2003ms\nrtt min/avg/max/mdev\
  \ = 0.369/0.809/1.353/0.409 ms\n```\n\n当发出此命令时，一个 ICMP 回显请求将直接发送到提供的 IP 地址。要收到此\
  \ ICMP 回显请求的响应，必须满足多个条件。这些条件如下：\n\n- 测试的 IP 地址必须已分配给某个系统\n- 系统必须处于在线运行状态\n- 从扫描系统到目标\
  \ IP 必须存在可用路由\n- 系统必须配置为响应 ICMP 流量\n- 扫描系统和目标 IP 之间没有配置丢弃 ICMP 流量的主机或网络防火墙\n\n如你所示，有很多因素影响\
  \ ICMP 发现的成功。正因如此，ICMP 可能有些不可靠，但与 ARP 不同，它是一种可路由协议，可用于发现局域网（LAN）之外的主机。注意在上一个例中，`ping`\
  \ 命令的输出中出现了 `^C`。这表示使用了转义序列（具体为 `Ctrl` + `C`）来停止进程。与 Windows 不同，集成在 Linux 操作系统中的\
  \ `ping` 命令默认会无限 ping 目标主机。然而，可以使用 `-c` 选项来指定要发送的 ICMP 请求数。使用此选项，一旦达到超时或为每个发送的数据包收到响应，进程将优雅结束。请查看以下命令：\n\
  \n```\nroot@KaliLinux:~# ping 172.16.36.135 -c 2\nPING 172.16.36.135 (172.16.36.135)\
  \ 56(84) bytes of data.\n64 bytes from 172.16.36.135: icmp_req=1 ttl=64 time=0.611\
  \ ms\n64 bytes from 172.16.36.135: icmp_req=2 ttl=64 time=0.395 ms\n--- 172.16.36.135\
  \ ping statistics ---\n2 packets transmitted, 2 received, 0% packet loss, time 1000ms\n\
  rtt min/avg/max/mdev = 0.395/0.503/0.611/0.108 ms\n```\n\n正如 `ARPing` 可以在 bash 脚本中并行循环多个\
  \ IP 一样，`ping` 也可以结合 bash 脚本使用，对多个主机并行执行第 3 层发现。要编写脚本，我们需要识别与成功和失败的 `ping` 请求相关的各种响应。为了做到，我们应该先\
  \ ping 一个已知在线并响应 ICMP 的主机，然后紧跟一个对无响应地址的 `ping` 请求。以下命令演示了这一点：\n\n```\nroot@KaliLinux:~#\
  \ ping 74.125.137.147 -c 1\nPING 74.125.137.147 (74.125.137.147) 56(84) bytes of\
  \ data.\n64 bytes from 74.125.137.147: icmp_seq=1 ttl=128 time=31.3 ms\n--- 74.125.137.147\
  \ ping statistics ---\n1 packets transmitted, 1 received, 0% packet loss, time 0ms\n\
  rtt min/avg/max/mdev = 31.363/31.363/31.363/0.000 ms\n\nroot@KaliLinux:~# ping 83.166.169.231\
  \ -c 1\nPING 83.166.169.231 (83.166.169.231) 56(84) bytes of data.\n--- 83.166.169.231\
  \ ping statistics ---\n1 packets transmitted, 0 received, 100% packet loss, time\
  \ 0ms\n```\n\n与 `ARPing` 请求一样，来自唯一字符串的字节（仅出现在与活跃 IP 地址相关的输出中，且它位于包含该地址的行上。同样，我们可以使用\
  \ `grep` 和 `cut` 的组合，从任何成功的 `ping` 请求中提取 IP 地址：\n\n```\nroot@KaliLinux:~# ping 74.125.137.147\
  \ -c 1 | grep \"bytes from\"\n64 bytes from 74.125.137.147: icmp_seq=1 ttl=128 time=37.2\
  \ ms\n\nroot@KaliLinux:~# ping 74.125.137.147 -c 1 | grep \"bytes from\" | cut -d\
  \ \" \" -f 4\n74.125.137.147\n\nroot@KaliLinux:~# ping 74.125.137.147 -c 1 | grep\
  \ \"bytes from\" | cut -d \" \" -f 4 | cut -d \":\" -f 1\n74.125.137.147\n```\n\n\
  通过在包含目标 IP 地址范围的循环中采用此任务序列，我们可以快速识别响应 ICMP 回显请求的活跃主机。输出是一个简单的活跃 IP 地址列表。一个使用此技术的脚本例如所示：\n\
  \n```bash\n#!/bin/bash\n\nif [ \"$#\" -ne 1 ]; then\n  echo \"Usage - ./ping_sweep.sh\
  \ [/24 network address]\"\n  echo \"Example - ./ping_sweep.sh 172.16.36.0\"\n  echo\
  \ \" Example will perform an ICMP ping sweep of the 172.16.36.0/24 network\"\n \
  \ exit\nfi\n\nprefix=$(echo $1 | cut -d '.' -f 1-3)\n\nfor addr in $(seq 1 254);\
  \ do\n  ping -c 1 $prefix.$addr | grep \"bytes from\" | cut -d \" \" -f 4 | cut\
  \ -d \":\" -f 1 &\ndone\n```\n\n在提供的脚本中，第一行定义了 bash 解释器的位置。后续代码块执行测试以判断是否提供了一个参数。这是通过评估参数数量是否不等于\
  \ 1 来判断的。如果没有提供参数，则输出脚本用法并退出。用法输出指示脚本需要 `/24` 网络地址作为参数。下一行代码从提供的地址提取网络前缀。例如，如果网络地址是\
  \ `192.168.11.0`，则 `prefix` 变量将变为 `192.168.11`。使用 `for` 循环遍历 `/24` 网络中的每个可能的 IP\
  \ 地址。对于每个 IP 地址，都会执行一次 `ping` 命令。这些请求的响应将被传递，然后使用 `grep` 提取包含 \"bytes from\" 的行。这将提取包含活跃主机\
  \ IP 地址的行。最后，使用一系列 `cut` 函数从该输出中提取 IP 地址。注意在 `for` 循环末尾使用的是 `&` 而不是分号。`&` 允许并行执行任务而不是顺序执行。这极大缩短了扫描范围所需的时间。可以使用点和斜杠加上可执行脚本名称来运行脚本：\n\
  \n```\nroot@KaliLinux:~# ./ping_sweep.sh\nUsage - ./ping_sweep.sh [/24 network address]\n\
  Example - ./ping_sweep.sh 172.16.36.0\nExample will perform an ICMP ping sweep of\
  \ the 172.16.36.0/24 network\n\nroot@KaliLinux:~# ./ping_sweep.sh 172.16.36.0\n\
  172.16.36.2\n172.16.36.1\n172.16.36.232\n172.16.36.249\n```\n\n\n\n\n\n# 172.16.36.249\n\
  \n在提供的示例中，使用了 `ls` 命令来确认输出文件是否已创建。\n\n可以通过将文件名作为参数传递给 `cat` 命令来查看该输出文件的内容。\n\n###\
  \ 工作原理……\n\n`Ping` 是 IT 行业中广为人知的工具，其现有功能已经是识别存活主机。然而，它的设计初衷是发现单个主机是否存活，而不是作为一种扫描工具。本食配方中的\
  \ `bash` 脚本本质上与对 `/24` CIDR 范围内的每一个可能的 IP 地址运行 `ping` 的效果相同。但是，我们不需要手动完成这项繁琐的任务，而\
  \ `bash` 允许我们通过通过循环传递任务序列来快速、方便地完成此任务。\n\n## 发现扫描\n\n### 使用 Scapy 进行第 3 层发现\n\n\
  `Scapy` 是一个允许用户构建并向网络注入自定义数据包的工具。该工具可以用于构建 ICMP 协议请求并将其注入网络以分析响应。本特定的食配方将演示如何使用\
  \ `Scapy` 对远程主机进行第 3 层发现。\n\n### 准备工作\n\n使用 `Scapy` 进行第 3 层发现不需要实验室环境，因为互联网上的许多系统都会对\
  \ ICMP 回显请求做出响应。但是，除非你完全熟悉所属任何监管机构所实施的法律法规，否则强烈建议你仅在你自己的实验室执行任何类型的网络扫描。如果你希望在实验室内执行此技术，你至少需要一个会对\
  \ ICMP 请求做出响应的系统。在提供的示例中，使用了 Linux 和 Windows 系统的组合。有关在本地实验室环境中设置系统的更多信息，请参阅`第 1\
  \ 章` `入门指南` 中的 `安装 Metasploitable2` 和 `安装 Windows Server` 食配方。此外，本节将需要使用 `VIM` 或\
  \ `Nano` 等文本编辑器向文件系统编写脚本。有关编写脚本的更多信息，请参阅`第 1 章` `入门指南` 中的 `使用文本编辑器 (VIM and Nano)`\
  \ 食配方。\n\n### 如何操作……\n\n为了使用 `Scapy` 发送 ICMP 回显请求，我们需要开始堆叠层级以发送请求。堆叠数据包时的一个良好法则是按照\
  \ OSI 模型的层级向上操作。你可以通过正斜杠分隔每一层来堆叠多个层。要生成 ICMP 回显请求，需要将 IP 层与 ICMP 请求堆叠。开始之前，使用 `scapy`\
  \ 命令打开 `Scapy` 交互式控制台，然后将 `IP` 对象赋值给变量：\n\n```bash\nroot@KaliLinux:~# scapy\nWelcome\
  \ to Scapy (2.2.0)\n>>> ip = IP()\n>>> ip.display()\n###[ IP ]###\nversion= 4\n\
  ihl= None\ntos= 0x0\nlen= None\nid= 1\nflags=\nfrag= 0\nttl= 64\nproto= ip\nchksum=\
  \ None\nsrc= 127.0.0.1\ndst= 127.0.0.1\n\\options\\\n```\n\n在提供的示例中，使用 `display()`\
  \ 函数在对象赋值给 `ip` 变量后查看其属性的默认配置。默认情况下，`IP` 对象配置为使用回环 IP 地址 `127.0.0.1` 进行发送和接收。要更改\
  \ `Scapy` 中对象的任何属性，你需要将 `[object].[attribute]` 设置为所需的值。在这种情况下，我们想要将目标 IP 地址更改为想要发送\
  \ ICMP 请求的系统地址，如下所示命令所示：\n\n```python\n>>> ip.dst = \"172.16.36.135\"\n>>> ip.display()\n\
  ###[ IP ]###\nversion= 4\nihl= None\ntos= 0x0\nlen= None\nid= 1\nflags=\nfrag= 0\n\
  ttl= 64\nproto= ip\nchksum= None\nsrc= 172.16.36.180\ndst= 172.16.36.135\n\\options\\\
  \n```\n\n在为目标地址属性分配新值后，可以通过再次调用 `display()` 函数来验证更改。注意，当目标 IP 地址值更改为任何其他值时，源地址也会自动从回环地址更新为默认接口关联的\
  \ IP 地址。现在 `IP` 对象的属性已恰当修改，我们需要在数据包栈中创建第二层。要添加到栈的下一层是 ICMP 层，将其分配给一个单独的变量：\n\n```python\n\
  >>> ping = ICMP()\n>>> ping.display()\n###[ ICMP ]###\ntype= echo-request\ncode=\
  \ 0\nchksum= None\nid= 0x0\nseq= 0x0\n```\n\n在提供的示例中，`ICMP` 对象使用 `ping` 变量名初始化。然后可以调用\
  \ `display()` 函数来显示 ICMP 属性的默认配置。要执行 ICMP 回显请求，默认配置就足够了。现在两个层都已正确配置，可以可以将它们堆叠起来准备发送。在\
  \ `Scapy` 中，可以通过正斜杠分隔每一层来堆叠层。请看以下命令组：\n\n```python\n>>> ping_request = (ip/ping)\n\
  >>> ping_request.display()\n###[ IP ]###\nversion= 4\nihl= None\ntos= 0x0\nlen=\
  \ None\nid= 1\nflags=\nfrag= 0\nttl= 64\nproto= icmp\nchksum= None\nsrc= 172.16.36.180\n\
  dst= 172.16.36.135\n\\options\\\n###[ ICMP ]###\ntype= echo-request\ncode= 0\nchksum=\
  \ None\nid= 0x0\nseq= 0x0\n```\n\n一旦将堆叠的层分配给变量，`display()` 函数将显示整个栈。这种方式堆叠层级的过程通常称为数据报封装。现在层级已经堆叠完成，请求已准备好跨网线发送。这可以使用\
  \ `Scapy` 中的 `sr1()` 函数完成：\n\n```python\n>>> ping_reply = sr1(ping_request)\n..Begin\
  \ emission:\n.........Finished to send 1 packets.\n***\nReceived 15 packets, got\
  \ 1 answers, remaining 0 packets\n>>> ping_reply.display()\n###[ IP ]###\nversion=\
  \ 4L\nihl= 5L\ntos= 0x0\nlen= 28\nid= 62577\nflags=\nfrag= 0L\nttl= 64\nproto= icmp\n\
  chksum= 0xe513\nsrc= 172.16.36.135\ndst= 172.16.36.180\n\\options\\\n###[ ICMP ]###\n\
  type= echo-reply\ncode= 0\nchksum= 0xffff\nid= 0x0\nseq= 0x0\n###[ Padding ]###\n\
  load= '\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00'\n```\n\n在提供的示例中，`sr1()` 函数被赋值给 `ping_reply` 变量。这执行了函数并将结果传递给该变量。接收响应后，对\
  \ `ping_reply` 变量使用 `display()` 函数来查看响应的内容。注意，此数据包是由发送初始请求的主机发送的，而目标地址是我们 Kali 系统的\
  \ IP 地址。此外，注意响应的 ICMP 类型是回显回复。基于这个示例，使用 `Scapy` 发送和接收 ICMP 的过程看起来是可行的，但如果你对一个无响应的目标地址使用相同的过程，你将很快发现问题：\n\
  \n\n\n\n\n示例输出被截断了，但此输出将无限持续，直到你使用 `Ctrl` + `C` 强制退出。在不向函数提供超时值的情况下，`sr1()` 函数将持续监听，直到收到响应。如果主机未在线或\
  \ IP 地址未与主机关联，将不会发送响应，函数将退出。为了在脚本中有效使用此函数，应该定义一个超时值：\n\n```\n>>> ping_reply = sr1(ping_request,\
  \ timeout=1)\n```\n\n**输出：**\n\n```\n.......................................................\n\
  .......................................................\n发送 1 个数据包。\n....................\n\
  收到 0 个包，0 个响应，剩余 1 个数据包\n```\n\n通过作为第二个参数传递给 `sr1()` 函数的超时值，如果在指定的秒数内没有响应，进程将退出。在提供的示例中，`sr1()`\
  \ 函数用于向无响应的地址发送 ICMP 请求，因为没有收到响应而退出。在目前为止提供的示例中，这些函数没有赋值给变量，但也可以直接调用函数来生成：\n\n```\n\
  >>> answer = sr1(IP(dst=\"172.16.36.135\")/ICMP(),timeout=1)\n```\n\n**输出：**\n\n\
  ```\n82\n...发送 1 个数据包。\n收到 5 个包，1 个响应，剩余 0 个数据包\n```\n\n```\n>>> response.display()\n\
  ```\n\n### [ IP ]\n```text\nversion= 4\nihl= 5\ntos= 0x0\nlen=28\nid=62578\nflags=\n\
  ttl= 64\nproto= icmp\nchksum=0xe512\nsrc= 172.16.36.135\ndst= 172.16.36.180\noptions\n\
  ```\n\n### [ ICMP ]\n```text\ntype= echo-reply\ncode= 0\nchksum= 0xffff\nid= 0x0\n\
  seq= 0x0\n```\n\n### [ Padding ]\n```text\nload= '\\x00\\x00\\x00\\x00\\x00\\x00'\n\
  ```\n\n在所提供的示例中，之前通过四个单独的命令完成的工作实际上可以通过单个命令完成。注意，如果发送到 IP 地址的 ICMP 请求在超时值指定的范围内没有回复，调用\
  \ `sr1()` 对象将导致异常。由于没有收到响应，示例中的 `answer` 变量从未被初始化：\n\n```\n>>> answer = sr1(IP(dst=\"\
  83.166.169.231\")/ICMP(),timeout=1)\n```\n\n**输出：**\n\n```\n..........................................发送\
  \ 1 个数据包。\n.........................................................\n..........................\n\
  83 Discovery\n收到 180 个包，0 个响应，剩余 1 个包\n```\n\n```\n>>> answer.display()\nTraceback\
  \ (most recent call last):\nFile \"<console>\", line 1, in <module>\nAttributeError:\
  \ 'NoneType' object has no attribute 'display'\n```\n\n这些响应的知识可以用于生成一个脚本，对多个 IP\
  \ 地址执行 ICMP 请求。脚本将遍历目标 IP 地址中所有可能的字节，对于每个值，它将发送 ICMP 请求。`sr1()` 函数返回的结果用于判断是否收到了响应：\n\
  \n```python\n#!/usr/bin/python\n\nimport logging\nlogging.getLogger(\"scapy.runtime\"\
  ).setLevel(logging.ERROR)\nfrom scapy.all import *\n\nif len(sys.argv) != 2:\n \
  \   print \"Usage - ./pinger.py [/24 network address]\"\n    print \"Example - ./pinger.py\
  \ 172.16.36.0\"\n    print \"Example will perform an ICMP scan of the 172.16.36.0/24\
  \ range\"\n    sys.exit()\n\naddress = str(sys.argv[1])\nprefix = address.split('.')[0]\
  \ + '.' + address.split('.')[1] + '.' + address.split('.')[2] + '.'\n\nfor addr\
  \ in range(1,254):\n    answer=sr1(IP(dst=prefix+str(addr))/ICMP(),timeout=1,verbose=0)\n\
  \    if answer == None:\n        pass\n    else:\n        print prefix+str(addr)\n\
  ```\n\n如果在执行时没有提供任何参数，用法输出将输出到屏幕上。用法输出表明该脚本需要一个参数来定义要扫描的 `/24` 网络。在提供的示例中，脚本使用 `172.16.36.0`\
  \ 网络地址执行。脚本随后输出 `/24` 范围内的活跃地址列表。此输出也可以使用右括号 `>` 重定向到输出文件，后跟输出文件名。例如如下：\n\n```bash\n\
  root@KaliLinux# ./pinger.py 172.16.36.0 > output.txt\nroot@KaliLinux# ls output.txt\n\
  output.txt\nroot@KaliLinux# cat output.txt\n172.16.36.1\n172.16.36.2\n172.16.36.132\n\
  172.16.36.135\n```\n\n一旦脚本被写入本地目录，你就可以使用点和正斜杠加上可执行脚本的名称在终端中执行它：\n\n```bash\nroot@KaliLinux#\
  \ ./pinger.py\nUsage - ./pinger.py [/24 network address]\nExample - ./pinger.py\
  \ 172.16.36.0\nExample will perform an ICMP scan of the 172.16.36.0/24 range\nroot@KaliLinux#\
  \ ./pinger.py 172.16.36.0\n172.16.36.2\n172.16.36.1\n172.16.36.132\n172.16.36.135\n\
  ```\n\n\n\n\n\n与之前的脚本的主要区别在于，这个脚本接受一个文件名作为参数，然后遍历该文件中列出的每个 IP 地址进行扫描。与其他脚本类似，结果的输出将包含一个简单的\
  \ IP 地址列表，这些地址对应对 ICMP 回显请求响应了 ICMP 回显响应的系统：\n\n```\nroot@KaliLinux:~# ./pinger.py\n\
  Usage - ./pinger.py [filename]\nExample - ./pinger.py iplist.txt\n```\n\n示例将对 `iplist.txt`\
  \ 中列出的 IP 地址进行 ICMP ping 扫描。\n\n```\nroot@KaliLinux:~# ./pinger.py iplist.txt\n\
  172.16.36.1\n172.16.36.2\n172.16.36.132\n172.16.36.135\n```\n\n第 2 章\n\n此脚本的输出可以用同样的方式重定向到输出文件中。通过提供的输入文件作为参数执行脚本，然后使用右角括号\
  \ `>` 重定向输出，后跟输出文本文件名。示例所示：`root@KaliLinux:~# ./pinger.py iplist.txt > output.txt`\n\
  \n```\nroot@KaliLinux:~# ls output.txt\noutput.txt\nroot@KaliLinux:~# cat output.txt\n\
  172.16.36.1\n172.16.36.2\n172.16.36.132\n172.16.36.135\n```\n\n### 工作原理……\n\n此处使用\
  \ Scapy 通过构造一个包含 IP 层和附加 ICMP 请求的请求执行 ICMP 层发现。IP 层允许数据包路由到本地网络之外，而 ICMP 请求则用于请求远程系统的响应。在\
  \ Python 脚本中使用此技术，可以顺序执行此任务以扫描多个系统或整个网络范围。\n\n## 使用 Nmap 进行第 3 层发现\n\nNmap 是 Kali\
  \ Linux 中最强大且功能丰富的扫描工具之一。因此，Nmap 能够支持 ICMP 发现扫描并不令人意外。本配方将演示如何使用 Nmap 对远程主机进行第 3\
  \ 层发现。\n\n### 准备工作\n\n使用 Nmap 进行第 3 层发现不需要实验室环境，因为互联网上的许多系统都会响应 ICMP 回显请求。但是，强烈建议你仅在自己的实验室执行任何类型的网络扫描，除非你完全熟悉你所属的任何管理机构所实施的法律法规。如果你希望在实验室中执行此技术，你至少需要一个能够响应\
  \ ICMP 请求的系统。在提供的示例中，使用了 Linux 和 Windows 系统的组合。有关在本地实验室环境中设置系统的更多信息，请参阅 `第 1 章`、`入门`\
  \ 中的 `安装 Metasploitable2` 和 `安装 Windows Server` 配方。\n\n发现扫描\n\n### 如何操作……\n\nNmap\
  \ 是一个自适应工具，它会根据需要自动调整并使用第 2 层、第 3 层或第 4 层发现。如果在 Nmap 中使用 `-sn` 选项来扫描本地网段中不存在的 IP\
  \ 地址，将使用 ICMP 回显请求来确定主机是否在线并有响应。要对单个目标执行 ICMP 扫描，请使用带有 `-sn` 选项的 Nmap 并将要扫描的 IP\
  \ 地址作为参数传递：\n\n```\nroot@KaliLinux:~# nmap -sn 74.125.228.1\nStarting Nmap 6.25\
  \ ( http://nmap.org ) at 2013-12-16 23:05 EST\nNmap scan report for iad23s05-in-f1.1e100.net\
  \ (74.125.228.1)\nHost is up (0.00013s latency).\nNmap done: 1 IP address (1 host\
  \ up) scanned in 0.02 seconds\n```\n\n此命令的输出将指示设备是否在线，并提供有关执行扫描的详细信息。此外，注意系统名称也被识别。Nmap\
  \ 还会执行 DNS 解析并在扫描输出中提供此信息。它还可以使用破折号表示法扫描连续的 IP 地址范围。Nmap 默认是多线程，并并行运行多个进程。因此，Nmap\
  \ 返回扫描结果的速度非常快。查看以下命令：\n\n```\nroot@KaliLinux:~# nmap -sn 74.125.228.1-255\nStarting\
  \ Nmap 6.25 ( http://nmap.org ) at 2013-12-16 23:14 EST\nNmap scan report for iad23s05-in-f1.1e100.net\
  \ (74.125.228.1)\nHost is up (0.00012s latency).\nNmap scan report for iad23s05-in-f2.1e100.net\
  \ (74.125.228.2)\nHost is up (0.0064s latency).\nNmap scan report for iad23s05-in-f3.1e100.net\
  \ (74.125.228.3)\nHost is up (0.0070s latency).\nNmap scan report for iad23s05-in-f4.1e100.net\
  \ (74.125.228.4)\nHost is up (0.00015s latency).\nNmap scan report for iad23s05-in-f5.1e100.net\
  \ (74.125.228.5)\nHost is up (0.00013s latency).\nNmap scan report for iad23s05-in-f6.1e100.net\
  \ (74.125.228.6)\nHost is up (0.00012s latency).\nNmap scan report for iad23s05-in-f7.1e100.net\
  \ (74.125.228.7)\nHost is up (0.00012s latency).\nNmap scan report for iad23s05-in-f8.1e100.net\
  \ (74.125.228.8)\nHost is up (0.00012s latency).\n```\n\n在提供的示例中，Nmap 被用于扫描整个 `/24`\
  \ 网络范围。为了方便查看，此命令的输出被截断了。通过使用 Wireshark 分析通过接口的流量，你可能会发现地址并不是按顺序扫描的。这可以在下面的截图中看到。这是\
  \ Nmap 多线程特性的进一步证据，并说明了进程如何从某些地址启动，而其他进程完成完成：\n\n或者，Nmap 也可以从输入文件扫描 IP 地址。这可以使用\
  \ `-iL` 选项完成，后跟文件名或路径：\n\n```\nroot@KaliLinux:~# cat iplist.txt\n74.125.228.13\n\
  74.125.228.28\n74.125.228.47\n74.125.228.144\n74.125.228.162\n74.125.228.211\nroot@KaliLinux:~#\
  \ nmap -iL iplist.txt -sn\nStarting Nmap 6.25 ( http://nmap.org ) at 2013-12-16\
  \ 23:14 EST\nNmap scan report for iad23s05-in-f13.1e100.net (74.125.228.13)\nHost\
  \ is up (0.00010s latency).\nNmap scan report for iad23s05-in-f28.1e100.net (74.125.228.28)\n\
  Host is up (0.0069s latency).\nNmap scan report for iad23s06-in-f15.1e100.net (74.125.228.47)\n\
  Host is up (0.0068s latency).\nNmap scan report for iad23s17-in-f16.1e100.net (74.125.228.144)\n\
  Host is up (0.00010s latency).\nNmap scan report for iad23s18-in-f2.1e100.net (74.125.228.162)\n\
  Host is up (0.0077s latency).\nNmap scan report for 74.125.228.211\nHost is up (0.00022s\
  \ latency).\nNmap done: 6 IP addresses (6 hosts up) scanned in 0.04 seconds\n```\n\
  \n\n\n\n\n使用 `fping` 进行第三层发现不需要实验室环境，因为互联网上的许多系统都会对 `ICMP` 显回请求响应。然而，强烈建议你仅在自己的实验环境中进行任何类型的网络扫描，除非你对你所属的任何管理机构所施加的法律法规非常熟悉。如果你想在实验室内执行此技术，你至少需要一个能够响应\
  \ ICMP 请求的系统。在提供的示例中，结合了 Linux 和 Windows 系统。有关在本地实验环境中设置系统的更多信息，请参考 `Chapter 1`,\
  \ `Getting Started`（入门）中的 `Installing Metasploitable2`（安装 Metasploitable2）和 `Installing\
  \ Windows`（安装 Windows）`Server` 教程。\n\n## 如何操作...\n\n`fping` 与 `ping` 实用程序非常相似，但增加了一些额外。它可以像\
  \ `ping` 一样用于向单个目标发送 ICMP 显回请求以确定其是否存活。这通过简单将 IP 地址作为参数传递给 `fping` 实用程序来实现：\n\n\
  ```bash\nroot@KaliLinux:~# fping 172.16.36.135\n```\n\n`172.16.36.135` 存活\n\n##\
  \ 第 2 章\n\n与标准的 `ping` 实用程序不同，`fping` 在收到单个回复后将停止发送 ICMP 显回请求。收到回复后，它将指示该地址的主机存活。或者，如果从该地址未收到响应，`fping`\
  \ 默认会在确定主机不可达之前尝试连接系统四次：\n\n```bash\nroot@KaliLinux:~# fping 172.16.36.136\n```\n\
  \nICMP Host Unreachable from 172.16.36.180 for ICMP Echo sent to 172.16.36.136\n\
  ICMP Host Unreachable from 172.16.36.180 for ICMP Echo sent to 172.16.36.136\nICMP\
  \ Host Unreachable from 172.16.36.180 for ICMP Echo sent to 172.16.36.136\nICMP\
  \ Host Unreachable from 172.16.36.180 for ICMP Echo sent to 172.16.36.136\n`172.16.36.136`\
  \ 不可达\n\n此默认连接尝试次数可以使用 `-c count` 选项并提供一个整数值来定义要尝试的次数：\n\n```bash\nroot@KaliLinux:~#\
  \ fping 172.16.36.135 -c 1\n```\n172.16.36.135 : [0], 84 bytes, 0.67 ms (0.67 avg,\
  \ 0% loss)\n172.16.36.135 : xmt/rcv/%loss = 1/1/0%, min/avg/max = 0.67/0.67/0.67\n\
  \n```bash\nroot@KaliLinux:~# fping 172.16.36.136 -c 1\n```\n172.16.36.136 : xmt/rcv/%loss\
  \ = 1/0/100%\n\n以这种方式执行时，输出略显晦涩，但通过仔细分析可以理解。任何主机的输出都包含 IP 地址、尝试次数（`xmt`）、收到的回复数（`rcv`）以及丢失率（`%loss`）。在提供的示例中，第一个地址被发现为在线。这通过接收字节数和回复延迟都已返回得到了证明。你也可以通过检查丢失率来轻松判断提供的\
  \ IP 地址是否关联存活的主机。如果丢失比例为 100%，则没有收到任何回复。\n\n与 `ping`（它最常用作故障排除工具）不同，`fping` 构建时具有扫描多个主机的集成功能。可以使用\
  \ `fping` 使用 `-g` 选项动态生成 IP 地址列表扫描一系列主机。要指定扫描范围，请将此参数传递给所需顺序范围内的第一个和最后一个 IP 地址：\n\
  \n```bash\nroot@KaliLinux:~# fping -g 172.16.36.1 172.16.36.4\n```\n`172.16.36.1`\
  \ 存活\n`172.16.36.2` 存活\nICMP Host Unreachable from 172.16.36.180 for ICMP Echo sent\
  \ to 172.16.36.3\n\n## 发现扫描\n\nICMP Host Unreachable from 172.16.36.180 for ICMP\
  \ Echo sent to 172.16.36.3\nICMP Host Unreachable from 172.16.36.180 for ICMP Echo\
  \ sent to 172.16.36.3\nICMP Host Unreachable from 172.16.36.180 for ICMP Echo sent\
  \ to 172.16.36.3\n...\n`172.16.36.3` 不可达\n`172.16.36.4` 不可达\n\n`-g` 选项还可以用于根据 CIDR\
  \ 表示法生成列表。同样地，`fping` 将循环此列表并扫描每个地址：\n\n```bash\nroot@KaliLinux:~# fping -g 172.16.36.0/24\n\
  ```\n`172.16.36.1` 存活\n`172.16.36.2` 存活\n...\n\n最后，`fping` 还可以根据输入文件内容指定的一系列地址。要使用输入文件，请使用\
  \ `-f` 选项并提供文件名或路径：\n\n```bash\nroot@KaliLinux:~# fping -f iplist.txt\n```\n`172.16.36.2`\
  \ 存活\n`172.16.36.1` 存活\n`172.16.36.132` 存活\n`172.16.36.135` 存活\n`172.16.36.180`\
  \ 存活\n...\n\n## 工作原理...\n\n`fping` 工具执行 ICMP 发现的方式与我们之前讨论的其他工具相同。对于每个 IP 地址，`fping`\
  \ 发一个或多个 ICMP 显回请求，然后对收到的响应进行评估以识别存活的主机。通过提供适当参数，`fping` 还可以扫描一个范围或输入 IP 地址列表。\n\
  \n\n\n\n彻底熟悉你所属的任何管理机构所施加的法律法规。如果你希望在实验室中执行此技术，你至少需要一个能够响应 ICMP 请求的系统。在提供的示例中，使用了\
  \ Linux 和 Windows 系统的组合。有关在本地实验室环境中设置系统的更多信息，请参考 `Chapter 1`，`Getting Started` 章节中的\
  \ `Installing Metasploitable2` 和 `Installing Windows` `Server` 配方。此外，本节还需要使用文本编辑器（如\
  \ `VIM` 或 `Nano`）向文件系统写入一个脚本。有关编写脚本的更多信息，请参考 `Chapter 1`，`Getting Started` 章节中的\
  \ `Using text editors (VIM and Nano)` 配方。\n\n#### 如何操作...\n\n`hping3` 是一个非常强大的发现工具，具有大量的运行选项和模式。它能够在第\
  \ 3 层和第 4 层执行发现。要使用 `hping3` 对单个主机地址进行基础的 ICMP 发现，你只需要将要测试的 IP 地址和所需的 ICMP 扫描模式传递给它即可：\n\
  \n```\nroot@KaliLinux:~# hping3 172.16.36.1 --icmp\nHPING 172.16.36.1 (eth1 172.16.36.1):\
  \ icmp mode set, 28 headers + 0 data bytes\nlen=46 ip=172.16.36.1 ttl=64 id=41835\
  \ icmp_seq=0 rtt=0.3 ms\nlen=46 ip=172.16.36.1 ttl=64 id=5039 icmp_seq=1 rtt=0.3\
  \ ms\nlen=46 ip=172.16.36.1 ttl=64 id=54056 icmp_seq=2 rtt=0.6 ms\nlen=46 ip=172.16.36.1\
  \ ttl=64 id=50519 icmp_seq=3 rtt=0.5 ms\nlen=46 ip=172.16.36.1 ttl=64 id=47642 icmp_seq=4\
  \ rtt=0.4 ms\n^C\n--- 172.16.36.1 hping statistic ---\n5 packets transmitted, 5\
  \ packets received, 0% packet loss\nround-trip min/avg/max = 0.3/0.4/0.6 ms\n```\n\
  \n在提供的演示中，过程使用 `Ctrl` + `C` 停止。与标准的 `ping` 工具类似，`hping3` 的 ICMP 模式将无限持续，除非在初始命令中指定特定的数据包数量。要定义发送的尝试次数，应包含\
  \ `-c` 选项并带有一个指示所需尝试次数的整数值：\n\n```\nroot@KaliLinux:~# hping3 172.16.36.1 --icmp\
  \ -c 2\nHPING 172.16.36.1 (eth1 172.16.36.1): icmp mode set, 28 headers + 0 data\
  \ bytes\nlen=46 ip=172.16.36.1 ttl=64 id=40746 icmp_seq=0 rtt=0.3 ms\nlen=46 ip=172.16.36.1\
  \ ttl=64 id=12231 icmp_seq=1 rtt=0.5 ms\n--- 172.16.36.1 hping statistic ---\n2\
  \ packets transmitted, 2 packets received, 0% packet loss\nround-trip min/avg/max\
  \ = 0.3/0.4/0.5 ms\n```\n\n虽然 `hping3` 默认不支持扫描多个系统，但可以通过 bash 脚本轻松实现脚本化。为了做到这一点，我们必须首先识别与活动地址相关的输出与与无响应地址相关的输出之间的区别。为了这一点，我们应该在一个没有分配主机的\
  \ IP 地址上运行相同的命令：\n\n```\nroot@KaliLinux:~# hping3 172.16.36.4 --icmp -c 2\nHPING\
  \ 172.16.36.4 (eth1 172.16.36.4): icmp mode set, 28 headers + 0 data bytes\n---\
  \ 172.16.36.4 hping statistic ---\n2 packets transmitted, 0 packets received, 100%\
  \ packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n```\n\n通过识别与这些每个请求相关的响应，我们可以确定一个可以进行\
  \ `grep` 查询的唯一字符串；此字符串会将成功的 ping 尝试与失败的尝试分离来。在 `hping3` 中，你可能会注意到只有在返回响应时才会显示 `len`\
  \ 值。基于此，我们可以通过 `grep` `len` 来提取提取的尝试。为了确定这种方法在脚本中的有效性，我们应该尝试连接之前的两个命令，并将输出管道到我们的\
  \ `grep` 函数。假设我们选择的字符串对于成功尝试来说确实是唯一的，我们应该只会看到与活动主机相关的输出：\n\n```\nroot@KaliLinux:~#\
  \ hping3 172.16.36.1 --icmp -c 1; hping3 172.16.36.4 --icmp -c 1 | grep \"len\"\n\
  HPING 172.16.36.1 (eth1 172.16.36.1): icmp mode set, 28 headers + 0 data bytes\n\
  len=46 ip=172.16.36.1 ttl=64 id=63974 icmp_seq=0 rtt=0.2 ms\n--- 172.16.36.1 hping\
  \ statistic ---\n1 packets transmitted, 1 packets received, 0% packet loss\nround-trip\
  \ min/avg/max = 0.2/0.2/0.2 ms\n--- 172.16.36.4 hping statistic ---\n1 packets transmitted,\
  \ 0 packets received, 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n\
  ```\n\n## 发现扫描\n\n尽管有了预期的结果，但在这种情况下 `grep` 函数似乎没有有效地应用到输出上。由于 `hping3` 的输出使得难以管道到\
  \ `grep` 函数，我们可以通过其他方法来绕过这一点。具体来说，我们将尝试将输出重定向到文件，然后直接从文件中进行 `grep`：\n\n```\nroot@KaliLinux:~#\
  \ hping3 172.16.36.1 --icmp -c 1 >> handle.txt\n--- 172.16.36.1 hping statistic\
  \ ---\n1 packets transmitted, 1 packets received, 0% packet loss\nround-trip min/avg/max\
  \ = 0.4/0.4/0.4 ms\nroot@KaliLinux:~# hping3 172.16.36.4 --icmp -c 1 >> handle.txt\n\
  --- 172.16.36.4 hping statistic ---\n1 packets transmitted, 0 packets received,\
  \ 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\nroot@KaliLinux:~# cat\
  \ handle.txt\nHPING 172.16.36.1 (eth1 172.16.36.1): icmp mode set, 28 headers +\
  \ 0 data bytes\nlen=46 ip=172.16.36.1 ttl=64 id=56022 icmp_seq=0 rtt=0.4 ms\nHPING\
  \ 172.16.36.4 (eth1 172.16.36.4): icmp mode set, 28 headers + 0 data bytes\n```\n\
  \n虽然这次尝试没有完全成功，因为输出没有重定向到文件，但我们可以通过读取文件看到足够的输出来创建一个有效的脚本。具体来说，我们能够重定向 `/24` 范围内的每个地址，并将结果传递到\
  \ `handle.txt` 文件：\n\n```bash\nroot@KaliLinux:~# for addr in $(seq 1 254); do hping3\
  \ 172.16.36.$addr --icmp -c 1 >> handle.txt; done\n```\n\n这样做，仍然有大量的输出（提供的输出已截断以便方便），包含所有未重定向到文件的输出部分。然而，后续脚本的成功取决于此循环的过度输出，而是取决于从输出文件中提取信息的能力：\n\
  \n```\nroot@KaliLinux:~# ls\nhandle.txt pinger.sh\nroot@KaliLinux:~# grep len handle.txt\n\
  len=46 ip=172.16.36.2 ttl=128 id=7537 icmp_seq=0 rtt=6.6 ms\nlen=46 ip=172.16.36.1\
  \ ttl=64 id=56312 icmp_seq=0 rtt=55.2 ms\nlen=46 ip=172.16.36.132 ttl=64 id=47801\
  \ icmp_seq=0 rtt=27.3 ms\nlen=46 ip=172.16.36.135 ttl=64 id=62601 icmp_seq=0 rtt=77.9\
  \ ms\n```\n\n\n\n\n在这里，在输出中，我们可以看到每一个活跃主机都已列出。此时，唯一剩下的任务是从此输出中提取 IP 地址，然后将整个过程重新创建一个功能单一的脚本。请查看以下命令命令集：\n\
  \n```\nroot@KaliLinux:~# grep len handle.txt\nlen=46 ip=172.16.36.2 ttl=128 id=7537\
  \ icmp_seq=0 rtt=6.6 ms\nlen=46 ip=172.16.36.1 ttl=64 id=56312 icmp_seq=0 rtt=55.2\
  \ ms\nlen=46 ip=172.16.36.132 ttl=64 id=47801 icmp_seq=0 rtt=27.3 ms\nlen=46 ip=172.16.36.135\
  \ ttl=64 id=62601 icmp_seq=0 rtt=77.9 ms\nroot@KaliLinux:~# grep len handle.txt\
  \ | cut -d \" \" -f 2\nip=172.16.36.2\nip=172.16.36.1\nip=172.16.36.132\nip=172.16.36.135\n\
  ```\n\n### 发现扫描\n\n```\nroot@KaliLinux:~# grep len handle.txt | cut -d \" \" -f\
  \ 2 | cut -d \"=\" -f 2\n172.16.36.2\n172.16.36.1\n172.16.36.132\n172.16.36.135\n\
  ```\n\n通过将输出通过传输到一系列 `cut` 函数，我们可以从输出中提取出 IP 地址。现在我们已经成功识别出了一种扫描多个主机并轻松识别结果的方法，我们现在应该将其集成到脚本中。一个将所有这些操作整合在一起的功能脚本示例如下：\n\
  \n```bash\n#!/bin/bash\n\nif [ \"$#\" -ne 1 ]; then\necho \"Usage - ./ping_sweep.sh\
  \ [/24 network address]\"\necho \"Example - ./ping_sweep.sh 172.16.36.0\"\necho\
  \ \"Example will perform an ICMP ping sweep of the 172.16.36.0/24 network and output\
  \ to an output.txt file\"\nexit\nfi\n\nprefix=$(echo $1 | cut -d '.' -f 1-3)\n\n\
  for addr in $(seq 1 254); do\n  hping3 $prefix.$addr --icmp -c 1 >> handle.txt;\n\
  done\n\ngrep len handle.txt | cut -d \" \" -f 2 | cut -d \"=\" -f 2 >> output.txt\
  \ rm handle.txt\n```\n\n在提供的 bash 脚本中，第一行定义了 bash 解释器的位置。\n\n接后的代码块执行了一个测试，以确定是否提供了预期的单个参数。这是通过评估提供的参数数量是否等于\
  \ 1 来判断的。如果未提供预期的参数，则输出脚本的用法并退出。用法输出表明脚本期望将 `/24` 网络地址作为参数。下一行代码从提供的网络地址中提取网络前缀。例如，如果提供的网络地址是\
  \ `192.168.11.0`，则 `prefix` 变量将被赋值为 `192.168.11`。然后对 `/24` 范围内的每个地址执行 `hping3` 操作，并将每个任务的输出结果放入\
  \ `handle.txt` 文件中。\n\n### 第 2 章\n\n完成后，使用 `grep` 从 handle 文件中提取与活跃主机响应相关的行，然后从这些行中提取\
  \ IP 地址。得到的 IP 地址将随后传递到 `output.txt` 文件中，并从目录中删除临时文件 `handle.txt`。可以使用点和正斜杠加上可执行脚本名称来执行此脚本：\n\
  \n```\nroot@KaliLinux:~# ./ping_sweep.sh\nUsage - ./ping_sweep.sh [/24 network address]\n\
  Example - ./ping_sweep.sh 172.16.36.0\nExample will perform an ICMP ping sweep of\
  \ the 172.16.36.0/24 network and output to an output.txt file\n\nroot@KaliLinux:~#\
  \ ./ping_sweep.sh 172.16.36.0\n--- 172.16.36.1 hping statistic ---\n1 packets transmitted,\
  \ 1 packets received, 0% packet loss\nround-trip min/avg/max = 0.4/0.4/0.4 ms\n\
  --- 172.16.36.2 hping statistic ---\n1 packets transmitted, 1 packets received,\
  \ 0% packet loss\nround-trip min/avg/max = 0.5/0.5/0.5 ms\n--- 172.16.36.3 hping\
  \ statistic ---\n1 packets transmitted, 0 packets received, 100% packet loss\nround-trip\
  \ min/avg/max = 0.0/0.0/0.0 ms\n***** {TRUNCATED} *****\n```\n\n完成后，使用 `grep` 从\
  \ handle 文件中提取与活跃主机响应相关的行，然后从这些行中提取 IP 地址。得到的 IP 地址随后被存入 `output.txt` 文件，并从目录中删除临时文件\
  \ `handle.txt`。该脚本可以使用点和正斜杠加上可执行脚本名称来执行：\n\n\n\n\n\n在这里，我们将变量 `i` 初始化为 `IP` 对象，然后重新配置了标准配置，以将目标地址设置为我们目标服务器的\
  \ IP 地址。请注意，当为目标地址提供回环地址以外的任何 IP 地址时，源 IP 地址会自动更新。我们需要构建的下一层是 TCP 层。可以通过后续命令看到：\n\
  \n```python\n>>> t = TCP()\n>>> t.display()\n```\n\n### [ TCP ]\nsport= ftp_data\n\
  dport= http\nseq= 0\nack= 0\ndataofs= None\nreserved= 0\nflags= S\nwindow= 8192\n\
  chksum= None\nurgptr= 0\noptions= {}\n\n```python\n>>> t.flags='A'\n>>> t.display()\n\
  ```\n\n### [ TCP ]\nsport= ftp_data\ndport= http\nseq= 0\nack= 0\ndataofs= None\n\
  reserved= 0\nflags= A\nwindow= 8192\nchksum= None\nurgptr= 0\noptions= {}\n\n102\n\
  \n*第 2 章*\n\n在这里，我们将变量 `t` 初始化为 `TCP` 对象。请注意，对象的默认配置已经将目标端口设置为 HTTP 或 80 端口。在这里，我们只需要将\
  \ TCP 标志从 `S` (SYN) 更改为 `A` (ACK)。现在，可以通过正斜杠分隔每一层来构建栈，如下面的命令所示：\n\n```python\n>>>\
  \ request = (i/t)\n>>> request.display()\n```\n\n### [ IP ]\nversion= 4\nihl= None\n\
  tos= 0x0\nlen= None\nid= 1\nflags=\nfrag= 0\nttl= 64\nproto= tcp\nchksum= None\n\
  src= 172.16.36.180\ndst= 172.16.36.135\noptions=\n\n### [ TCP ]\nsport= ftp_data\n\
  dport= http\nseq= 0\nack= 0\ndataofs= None\nreserved= 0\nflags= A\nwindow= 8192\n\
  chksum= None\nurgptr= 0\noptions= {}\n\n103\n\n*发现性扫描*\n\n在这里，我们将整个请求栈赋值给 `request`\
  \ 变量。现在，可以使用 `send` 和 `receive` 函数在网络上传输 `request`，然后对响应文进行评估以确定目标地址的状态：\n\n```python\n\
  >>> response = sr1(request)\nBegin emission:\n.......Finished to send 1 packets.\n\
  ***\nReceived 12 packets, got 1 answers, remaining 0 packets\n>>> response.display()\n\
  ```\n\n### [ IP ]\nversion= 4L\nihl= 5L\ntos= 0x0\nlen= 40\nid= 0\nflags= DF\nfrag=\
  \ 0L\nttl= 64\nproto= tcp\nchksum= 0x9974\nsrc= 172.16.36.135\ndst= 172.16.36.180\n\
  options=\n\n### [ TCP ]\nsport= http\ndport= ftp_data\nseq= 0\nack= 0\ndataofs=\
  \ 5L\nreserved= 0L\nflags= R\nwindow= 0\nchksum= 0xe21\nurgptr= 0\noptions= {}\n\
  \n### [ Padding ]\nload= '\\x00\\x00\\x00\\x00\\x00\\x00'\n\n104\n\n*第 2 章*\n\n\
  注意，远程系统响应了一个带有 `RST` 标志的 `TCP` 数据包。这通过分配给 `flags` 属性的 `R` 值表示。通过直接调用函数，可以将封装请求以及发送和接收响应的整个过程压缩为一个命令：\n\
  \n```python\n>>> response = sr1(IP(dst=\"172.16.36.135\")/TCP(flags='A'))\nBegin\
  \ emission:\n................Finished to send 1 packets.\n***\nReceived 22 packets,\
  \ got 1 answers, remaining 0 packets\n>>> response.display()\n```\n\n### [ IP ]\n\
  version= 4L\nihl= 5L\ntos= 0x0\nlen= 40\nid= 0\nflags= DF\nfrag= 0L\nttl= 64\nproto=\
  \ tcp\nchksum= 0x9974\nsrc= 172.16.36.135\ndst= 172.16.36.180\noptions=\n\n### [\
  \ TCP ]\nsport= http\ndport= ftp_data\nseq= 0\nack= 0\ndataofs= 5L\nreserved= 0L\n\
  flags= R\nwindow= 0\nchksum= 0xe21\nurgptr= 0\noptions= {}\n\n### [ Padding ]\n\
  load= '\\x00\\x00\\x00\\x00\\x00\\x00'\n\n105\n\n*发现性扫描*\n\n现在我们已经识别了与向活动主机开放端口发送的\
  \ `ACK` 数据包相关的响应，让我们尝试向活动系统上的关闭端口发送类似的请求，并识别响应是否存在任何差异：\n\n```python\n>>> response\
  \ = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=1111,flags='A'))\nBegin emission:\n\
  .........Finished to send 1 packets.\n***\nReceived 12 packets, got 1 answers, remaining\
  \ 0 packets\n>>> response.display()\n```\n\n### [ IP ]\nversion= 4L\nihl= 5L\ntos=\
  \ 0x0\nlen= 40\nid= 0\nflags= DF\nfrag= 0L\nttl= 64\nproto= tcp\nchksum= 0x9974\n\
  src= 172.16.36.135\ndst= 172.16.36.180\noptions=\n\n### [ TCP ]\nsport= http\ndport=\
  \ ftp_data\nseq= 0\nack= 0\ndataofs= 5L\nreserved= 0L\nflags= R\nwindow= 0\nchksum=\
  \ 0xe21\nurgptr= 0\noptions= {}\n\n### [ Padding ]\nload= '\\x00\\x00\\x00\\x00\\\
  x00\\x00'\n\n106\n\n*第 2 章*\n\n提供的示例脚本非常简单。在循环遍历 IP 地址中最后一个字节的所有可能值时，ACK 数据包被发送到\
  \ TCP 80 端口，并对响应进行评估，以确定响应中 TCP 标志的整数转换值是否为 4（与单独 RST 标志相关的值）。如果数据包带有 RST 标志，脚本将输出响应的系统\
  \ IP 地址。如果没有接收到响应，Python 将无法测试响应变量的值，因为没有给它分配值。因此，如果没有返回响应，将会发生异常。\n\n\n\n\n此脚本可以使用点和正斜杠，后跟执行脚本名称来运行：\n\
  \n```\nroot@KaliLinux:~# ./ACK_Ping.py\n```\n\n用法 - `./ACK_Ping.py [/24 网络地址]`\n\
  \n示例 - `./ACK_Ping.py 172.16.36.0`\n\n示例将对 172.16.36.0/24 范围执行 TCP ACK ping 扫描\n\
  \n```\nroot@KaliLinux:~# ./ACK_Ping.py\n172.16.36.1\n172.16.36.2\n172.16.36.132\n\
  172.16.36.135\n```\n\n可以使用相似的发现方法来使用 UDP 协议进行第 4 层发现。\n\n为了确定我们是否可以使用 UDP 协议发现主机，我们需要确定如何触发任何存主机对\
  \ UDP 的响应，无论该系统在 UDP 端口上是否运行了服务。为了尝试这一点，我们首先在 Scapy 中构建请求堆栈：`root@KaliLinux:~# scapy`\n\
  \n```\nWelcome to Scapy (2.2.0)\n>>> i = IP()\n>>> i.dst = \"172.16.36.135\"\n>>>\
  \ u = UDP()\n>>> request = (i/u)\n>>> request.display()\n```\n\n108\n\n*第 2 章*\n\
  \n### [ IP ]\nversion= 4\nihl= None\ntos= 0x0\nlen= None\nid= 1\nflags=\nfrag= 0\n\
  ttl= 64\nproto= udp\nchksum= None\nsrc= 172.16.36.180\ndst= 172.16.36.135\n\\options\\\
  \n\n### [ UDP ]\nsport= domain\ndport= domain\nlen= None\nchksum= None\n\n注意 UDP\
  \ 对象的默认源端口和目的端口是域名系统（DNS）。这是一个用于将域名解析为 IP 地址的常用服务。按原样发送请求将被证明对于判断 IP 地址是否与存主机关联几乎没有帮助。发送此请求的示例可以看以下命令：\n\
  \n```\n>>> reply = sr1(request,timeout=1,verbose=1)\nBegin emission:\nFinished to\
  \ send 1 packets.\nReceived 7 packets, got 0 answers, remaining 1 packets\n```\n\
  \n尽管与目的 IP 地址关联的主机是存活，但我们没有收到任何响应。讽的是，缺乏响应实际上是因为目标系统上正在使用 DNS 服务。尽管你自然所想的，但有时通过探测未运行服务的\
  \ UDP 端口来尝试识别主机更为有效，前提是 ICMP 流量没有被防火墙拦截。这是因为存活服务通常配置为仅对包含特定内容的请求响应。现在，我们将尝试向另一个未使用的\
  \ UDP 端口发送相同的请求：\n\n```\n>>> u.dport = 123\n>>> request = (i/u)\n```\n\n109\n\n\
  *发现扫描*\n\n```\n>>> reply = sr1(request,timeout=1,verbose=1)\nBegin emission:\nFinished\
  \ to send 1 packets.\nReceived 5 packets, got 1 answers, remaining 0 packets\n>>>\
  \ reply.display()\n```\n\n```\n### [ IP ]\nversion= 4L\nihl= 5L\ntos= 0xc0\nlen=\
  \ 56\nid= 62614\nflags=\nfrag= 0L\nttl= 64\nproto= icmp\nchksum= 0xe412\nsrc= 172.16.36.135\n\
  dst= 172.16.36.180\n\\options\\\n\n### [ ICMP ]\ntype= dest-unreach\ncode= port-unreachable\n\
  chksum= 0x9e72\nunused= 0\n\n### [ IP in ICMP ]\nversion= 4L\nihl= 5L\ntos= 0x0\n\
  len= 28\nid= 1\nflags=\nfrag= 0L\nttl= 64\nproto= udp\nchksum= 0xd974\nsrc= 172.16.36.180\n\
  dst= 172.16.36.135\n\\options\\\n```\n\n110\n\n*第 2 章*\n\n### [ UDP in ICMP ]\n\
  sport= domain\ndport= ntp\nlen= 8\nchksum= 0x5dd2\n\n```\n\n通过将请求目的更改为端口 123 并重新发送，我们现在收到一个指示目的端口不可达的响应。如果你检查此响应的源\
  \ IP 地址，你可以看到它是从原始请求的目标主机发送的。此响应确认了原始目的 IP 地址处的主机是存活的。遗憾的是，在这种情况下并不总是返回响应。这种技术的有效性在很大程度上取决于你正在探测的系统及其配置。正因为如此，UDP\
  \ 发现通常比 TCP 发现更难执行。它绝不像仅仅发送一个开启了单个标志的 TCP 包那么简单。在服务确实存在的情况下，通常需要针对特定服务的探测。幸运的是，有多种复杂的\
  \ UDP 扫描工具，它们可以使用各种 UDP 请求和针对特定服务的探测来确定存活主机是否与给定的 IP 地址关联。\n\n## 它是如何工作的……\n\n在提供的示例中，同时使用了\
  \ UDP 和 TCP 发现方法。我们能够使用 Scapy 构造自定义请求，使用这些协议中的每一种识别存活主机。在 TCP 的情况下，构建了自定义的 ACK 包并发送到每个目标系统的任意端口。如果收到\
  \ RST 响应，则该系统被识别为存活。或者，向任意端口发送空的 UDP 请求以尝试诱导 ICMP 端口不可达响应。响应被用作存活系统的指示。\n\n每种技术都可以在\
  \ Python 脚本中使用，以对多个主机或一个地址范围进行发现。\n\n## 使用 Nmap 执行第 4 层发现\n\n除了 Nmap 工具中集成的许多其他扫描功能外，还有一个执行第\
  \ 4 层发现的选项。这个特定的配方将演示如何使用 Nmap 结合 TCP 和 UDP 协议进行第 4 层发现。\n\n### 准备工作\n\n使用 Nmap\
  \ 执行第 4 层发现不需要实验室环境，因为互联网上的许多系统都会对 TCP 和 UDP 流量做出响应。但是，除非你完全熟悉你所属管理机构所实施的法律法规，否则强烈建议仅在你自己的实验室执行任何类型的网络扫描。\n\
  \n111\n\n*发现扫描*\n\n如果你希望在实验室中执行此技术，你至少需要一个对 TCP 和/或 UDP 流量响应的系统。运行至少一个 TCP 和 UDP\
  \ 服务的系统更好。在提供的示例中，使用了 Linux 和 Windows 组合。有关在本地环境中设置系统的更多信息，请参阅 *Metasitable2* 和\
  \ *Windows Server*。\n\n### 如何操作……\n\nNmap 中提供了同时通过 TCP 和 UDP 发现主机的选项。Nmap 的 UDP\
  \ 发现已经配置为使用：\n\nroot@KaliLinux:~# nmap 172.16.36.135 -PU53 -sn\n\nStarting Nmap\
  \ 7.90 (https://nmap.org/nmap) at 2023-10-27 10:00:00 by root\nNmap scan report\
  \ for 172.16.36.135\nHost is up (0.0042s latency).\nNmap scan completed: 0.05 seconds\n\
  \n此发现扫描也可以通过连字符符号修改为对顺序范围扫描。在提供的示例中，我们将扫描整个：\n\nroot@KaliLinux:~# nmap 172.16.36.0-255\
  \ -PU53 -sn\n\nStarting Nmap 7.90 (https://nmap.org/nmap) at 2023-10-27 10:01:00\
  \ by root\nNmap scan report for 172.16.36.1\nHost is up (0.0020s latency).\nNmap\
  \ scan report for 172.16.36.2\nHost is up (0.0018s latency).\nNmap scan report for\
  \ 172.16.36.132\nHost is up (0.0037s latency).\nNmap scan report for 172.16.36.135\n\
  Host is up (0.0041s latency).\nNmap done: 256 IPs (4 hosts up) scanned in 13 seconds.\n\
  \n112\n\n*第 2 章*\n\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap scan report for\
  \ 172.16.36.180\nHost is up.\nNmap scan report for 172.16.36.254\nHost is up (0.0015s\
  \ latency).\n\n\n\n\n\n# MAC 地址: 00:50:56:EB:E1:8A (VMware)\n\n# Nmap 完成：在 3.91\
  \ 秒内扫描了 256 IP 地址（6 个主机在线）\n\n同样，也可以根据输入列表定义，对一组 IP 地址配置 Nmap UDP 探测 请求。在提供的示例中，我们将使用相同目录下的\
  \ `iplist.txt` 文件来扫描其中列出的每个主机：\n\n```\nroot@KaliLinux:~# nmap -iL iplist.txt -sn\
  \ -PU53\n\nStarting Nmap 6.25 ( http://nmap.org ) at 2013-12-17 06:36 EST\nNmap\
  \ scan report for 172.16.36.2\nHost is up (0.00015s latency).\nMAC Address: 00:50:56:FF:2A:8E\
  \ (VMware)\nNmap scan report for 172.16.36.1\nHost is up (0.00024s latency).\nMAC\
  \ Address: 00:50:56:C0:00:08 (VMware)\nNmap scan report for 172.16.36.135\nHost\
  \ is up (0.00029s latency).\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap scan\
  \ report for 172.16.36.132\nHost is up (0.00030s latency).\nMAC Address: 00:0C:29:65:FC:D2\
  \ (VMware)\nNmap scan report for 172.16.36.180\nHost is up.\nNmap scan report for\
  \ 172.16.36.254\nHost is up (0.00021s latency).\nMAC Address: 00:50:56:EB:E1:8A\
  \ (VMware)\nNmap done: 6 IP addresses (6 hosts up) scanned in 0.31 seconds\n```\n\
  \n## 发现扫描\n\n尽管上述每个示例的输出都显示发现了六个主机，但这并不意味着这六个主机都是通过 UDP 发现方法发现的。除了对 UDP 端口 `53`\
  \ 进行探测外，Nmap 还会利用它可以使用的任何其他发现技术来发现指定范围或输入列表内的主机。虽然 `-sn` 选项可以有效防止 Nmap 执行 TCP 端口扫描，但它并没有完全隔离我们的\
  \ UDP ping 探测。虽然没有有效的方法可以仅隔离此项任务，但你可以通过分析 `Wireshark` 或 `TCPdump` 中的流量来确定哪些主机是通过\
  \ UDP 请求发现的。或者，Nmap 也可以像在 `Scapy` 中讨论的那样，执行 TCP ACK ping 探测。要使用 ACK 包来识别在线主机，请使用\
  \ `-PA` 选项并结合你想要使用的端口：\n\n```\nroot@KaliLinux:~# nmap 172.16.36.135 -PA80 -sn\n\n\
  Starting Nmap 6.25 ( http://nmap.org ) at 2013-12-11 20:09 EST\nNmap scan report\
  \ for 172.16.36.135\nHost is up (0.00057s latency).\nMAC Address: 00:0C:29:3D:84:32\
  \ (VMware)\nNmap done: 1 IP address (1 host up) scanned in 0.21 seconds\n```\n\n\
  TCP ACK ping 发现方法也可以使用连字符表示法对范围主机进行执行，或者根据输入列表对指定的主机地址执行：\n\n```\nroot@KaliLinux:~#\
  \ nmap 172.16.36.0-255 -PA80 -sn\n\nStarting Nmap 6.25 ( http://nmap.org ) at 2013-12-17\
  \ 06:46 EST\nNmap scan report for 172.16.36.132\nHost is up (0.00033s latency).\n\
  MAC Address: 00:0C:29:65:FC:D2 (VMware)\nNmap scan report for 172.16.36.135\nHost\
  \ is up (0.00013s latency).\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap scan\
  \ report for 172.16.36.180\nHost is up.\nNmap done: 256 IP addresses (3 hosts up)\
  \ scanned in 3.43 seconds\n```\n\n```\nroot@KaliLinux:~# nmap -iL iplist.txt -PA80\
  \ -sn\n\nStarting Nmap 6.25 ( http://nmap.org ) at 2013-12-17 06:47 EST\nNmap scan\
  \ report for 172.16.36.135\nHost is up (0.00033s latency).\nMAC Address: 00:0C:29:3D:84:32\
  \ (VMware)\nNmap scan report for 172.16.36.132\nHost is up (0.00029s latency).\n\
  MAC Address: 00:0C:29:65:FC:D2 (VMware)\nNmap scan report for 172.16.36.180\nHost\
  \ is up.\nNmap done: 3 IP addresses (3 hosts up) scanned in 0.31 seconds\n```\n\n\
  ## 工作原理\n\nNmap 执行 TCP 发现的技术使用了我们之前在使用 `Scapy` 执行 TCP 发现时讨论的相同底层原理。Nmap 向目标系统的任意端口发送一系列\
  \ TCP ACK 包，并尝试获取响应以作为系统在线的指示。然而，Nmap 执行 UDP 发现的技术与在 `Scapy` 中讨论的技术略有不同。Nmap 不仅仅依赖于可能不稳定或被拦截的\
  \ ICMP 不可响应，它还通过向目标端口发送特定服务的请求来尝试获取响应以进行发现。我们之前讨论过使用 `hping3` 执行执行第 3 层 ICMP 发现。除了此功能外，`hping3`\
  \ 还可以执行 UDP 和 TCP 发现。但是，如前所述，`hping3` 是为了执行目标请求而开发的，需要一些脚本编写才能作为有效的扫描工具使用。本配方将演示如何使用\
  \ `hping3` 同时使用 TCP 和 UDP 协议执行第 4 层发现。\n\n使用 `hping3` 执行第 4 层发现不需要实验室环境，因为互联网上的许多系统都会对\
  \ TCP 和 UDP 流量做出响应。但是，除非你彻底熟悉当局实施的规定，否则强烈建议仅在你自己的实验室中任何类型的网络扫描。如果你想在实验室执行此技术，你需要至少一个会对\
  \ TCP/UDP 流量响应的系统。运行至少一个 TCP 和 UDP 服务的系统更好。在提供的示例中，结合了 Linux 和 Windows 系统。有关在本地环境中设置设置的更多信息，请参阅第\
  \ 1 章中的 `安装 Metploitable2` 和 `安装 Windows Server` 配方。此外，本节还需要使用 `VIM` 或 `Nano` 等文本编辑器向文件系统写入一个脚本。有关编写脚本的更多信息，请参阅第\
  \ 1 章中的 `使用文本编辑器 (VIM and Nano)` 配方。\n\n## 发现扫描\n\n### 如何操作\n\n与 Nmap 不同，`hping3`\
  \ 通过隔离任务，可以非常容易地识别通过 UDP 探测发现的主机。通过使用 `--udp` 选项指定 UDP 模式，可以传输 UDP 探测以尝试触发在线主机的响应：\n\
  \n```\nroot@KaliLinux:~# hping3 --udp 172.16.36.132\nHPING 172.16.36.132 (eth1 172.16.36.132):\
  \ udp mode set, 28 headers + 0\ndata bytes\nICMP Port Unreachable from ip=172.16.36.132\
  \ name=UNKNOWN\nstatus=0 port=2792 seq=0\nICMP Port Unreachable from ip=172.16.36.132\
  \ name=UNKNOWN\nstatus=0 port=2793 seq=1\nICMP Port Unreachable from ip=172.16.36.132\
  \ name=UNKNOWN\nstatus=0 port=2794 seq=2\nICMP Port Unreachable from ip=172.16.36.132\
  \ name=UNKNOWN\nstatus=0 port=2795 seq=3\n^C\n--- 172.16.36.132 hping statistic\
  \ ---\n4 packets transmitted, 4 packets received, 0% packet loss\nround-trip min/avg/max\
  \ = 1.8/29.9/113.4 ms\n```\n\n在提供的演示中，使用 `Ctrl + C` 停止了进程。在 UDP 模式下使用 `hping3` 时，除非在初始命令中定义了特定的包数，否则发现将无限进行。要定义发送的次数，应包含一个指示所需尝试次数的整数值：\n\
  \n```\nroot@KaliLinux:~# hping3 --udp 172.16.36.132 -c 1\nHPING 172.16.36.132 (eth1\
  \ 172.16.36.132): udp mode set, 28 headers + 0\ndata bytes\nICMP Port Unreachable\
  \ from ip=172.16.36.132 name=UNKNOWN\nstatus=0 port=2422 seq=0\n--- 172.16.36.132\
  \ hping statistic ---\n1 packets transmitted, 1 packets received, 0% packet loss\n\
  round-trip min/avg/max = 104.8/104.8/104.8 ms\n```\n\n尽管 `hping3` 默认不支持扫描多个系统，但可以\n\
  \n\n\n\n很容易通过 bash 脚本进行实现。为了实现这一点，我们必须首先识别与活动地址相关的输出与无响应地址相关的输出之间的区别。为了做到，我们应该在一个没有分配主机的\
  \ IP 地址上运行相同的命令：\n\n```bash\nroot@KaliLinux:~# hping3 --udp 172.16.36.131 -c 1\n\
  \nHPING 172.16.36.131 (eth1 172.16.36.131): udp mode set, 28 headers + 0 data bytes\n\
  --- 172.16.36.131 hping statistic ---\n1 packets transmitted, 0 packets received,\
  \ 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n```\n\n通过识别与这些每个请求相关的响应，我们可以确定一个可以被\
  \ `grep` 的唯一字符串；此字符串将把成功的发现尝试与失败的尝试隔离开。在之前的请求中，你可能已经注意到 `ICMP Port Unreachable`（ICMP\
  \ 端口不可达）这一短语仅在返回响应的情况下出现。基于此，我们可以通过搜索 `Unreachable` 来提取出成功的尝试。为了确定这种方法在脚本中的有效性，我们应该尝试将之前的两个命令合并，然后将输出通过传输到我们的\
  \ `grep` 函数。假设我们拥有的字符串对于成功尝试来说是唯一的，我们应该只看到与活动主机相关的输出：\n\n```bash\nroot@KaliLiniux:~#\
  \ hping3 --udp 172.16.36.132 -c 1; hping3 --udp 172.16.36.131 -c 1 | grep \"Unreachable\"\
  \nHPING 172.16.36.132 (eth1 172.16.36.132): udp mode set, 28 headers + 0 data bytes\n\
  ICMP Port Unreachable from ip=172.16.36.132 name=UNKNOWN\nstatus=0 port=2836 seq=0\n\
  --- 172.16.36.132 hping statistic ---\n1 packets transmitted, 1 packets received,\
  \ 0% packet loss\nround-trip min/avg/max = 115.2/115.2/115.2 ms\n--- 172.16.36.131\
  \ hping statistic ---\n1 packets transmitted, 0 packets received, 100% packet loss\n\
  round-trip min/avg/max = 0.0/0.0/0.0 ms\n```\n\n### 发现扫描\n\n尽管有了预期的结果，在这种情况下，`grep`\
  \ 函数似乎没有有效地应用到输出中。由于 `hping3` 的输出显示处理使得将输出传输到 `grep` 函数并仅提取所需的行变得困难，我们可以尝试通过其他手段来绕过这一点。具体来说，我们将尝试确定输出是否可以重定向到文件，然后我们可以直接从文件中\
  \ `grep`。为了做到这一点，我们将尝试将之前使用的两个命令的输出传递到 `handle.txt` 文件：\n\n```bash\nroot@KaliLinux:~#\
  \ hping3 --udp 172.16.36.132 -c 1 >> handle.txt\n--- 172.16.36.132 hping statistic\
  \ ---\n1 packets transmitted, 1 packets received, 0% packet loss\nround-trip min/avg/max\
  \ = 28.6/28.6/28.6 ms\nroot@KaliLinux:~# hping3 --udp 172.16.36.131 -c 1 >> handle.txt\n\
  --- 172.16.36.131 hping statistic ---\n1 packets transmitted, 0 packets received,\
  \ 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\nroot@KaliLinux:~# ls\n\
  Desktop handle.txt\nroot@KaliLinux:~# cat handle.txt\nHPING 172.16.36.132 (eth1\
  \ 172.16.36.132): udp mode set, 28 headers + 0 data bytes\nICMP Port Unreachable\
  \ from ip=172.16.36.132 name=UNKNOWN\nstatus=0 port=2121 seq=0\nHPING 172.16.36.131\
  \ (eth1 172.16.36.131): udp mode set, 28 headers + 0 data bytes\n```\n\n虽然这次尝试没有完全成功，因为输出没有完全重定向到文件中，但我们可以通过读取文件看到，输出的内容已足够创建一个有效的脚本。具体来说，我们能够重定向出一行仅与成功的\
  \ ping 尝试相关的唯一行，并且该行中包含相应的 IP 地址。为了验证这种变通方法可能是可能的，我们将尝试遍历 `/24` 范围内的每个地址，然后将结果传递到\
  \ `handle.txt` 文件：\n\n```bash\nroot@KaliLinux:~# for addr in $(seq 1 254); do hping3\
  \ --udp 172.16.36.$addr -c 1 >> handle.txt; done\n--- 172.16.36.1 hping statistic\
  \ ---\n1 packets transmitted, 0 packets received, 100% packet loss\nround-trip min/avg/max\
  \ = 0.0/0.0/0.0 ms\n--- 172.16.36.2 hping statistic ---\n1 packets transmitted,\
  \ 0 packets received, 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n\
  --- 172.16.36.3 hping statistic ---\n1 packets transmitted, 0 packets received,\
  \ 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n```\n\n通过这样做，仍然会有大量的输出（为了方便，提供的输出已截截），其中包含了所有未重定向到文件的输出部分。然而，脚本的成功并不取决于这个初始循环的过度输出，而是取决于从输出文件中提取必要信息的能力。这可以在以下命令中看到：\n\
  \n```bash\nroot@KaliLinux:~# ls\nDesktop handle.txt\nroot@KaliLinux:~# grep Unreachable\
  \ handle.txt\nICMP Port Unreachable from ip=172.16.36.132 HPING 172.16.36.133 (eth1\
  \ 172.16.36.133): udp mode set, 28 headers + 0 data bytes\nICMP Port Unreachable\
  \ from ip=172.16.36.135 HPING 172.16.36.136 (eth1 172.16.36.136): udp mode set,\
  \ 28 headers + 0 data bytes\n```\n\n在完成扫描循环后，可以使用 `ls` 命令在当前目录中识别输出文件，然后可以直接从该文件中\
  \ `grepp` 唯一的字符串 `Unreachable`，如下一个命令所示。在这里的输出中，我们可以看到通过 UDP 探测发现的每个活动主机都列列了出来。此时，唯一剩下的任务是从此输出中提取\
  \ IP 地址，然后将整个过程重新创建为单个单一的功能性脚本：\n\n```bash\nroot@KaliLinux:~# grep Unreachable handle.txt\n\
  ICMP Port Unreachable from ip=172.16.36.132 HPING 172.16.36.133 (eth1 172.16.36.133):\
  \ udp mode set, 28 headers + 0 data bytes\nICMP Port Unreachable from ip=172.16.36.135\
  \ HPING 172.16.36.136 (eth1 172.16.36.136): udp mode set, 28 headers + 0 data bytes\n\
  ```\n\n### 发现扫描\n\n通过将输出传输到一系列 `cut` 函数，我们可以从输出中提取出 IP 地址。现在我们已经确定出扫描多个主机并易地识别结果的方法，我们应该将其整合到脚本中：\n\
  \n```bash\n#!/bin/bash\nif [ \"$#\" -ne 1 ]; then\necho \"Usage: ./udp_sweep.sh\
  \ [/24 network address]\"\necho \"Example: ./udp_sweep.sh 172.16.36.0\"\necho \"\
  将对 172.16.36.0/24 网络进行 UDP 扫描并输出到 output.txt\"\nexit\nfi\n\nprefix=$(echo $1 | cut\
  \ -d '.' -f 1-3)\n\nfor addr in $(seq 1 254); do\nhping3 $prefix.$addr --udp -c\
  \ 1 >> handle.txt;\ndone\n\ngrep Unreachable handle.txt | cut -d \" \" -f 5 | cut\
  \ -d \"=\" -f 2 >> output.txt\nrm handle.txt\n```\n\n\n\n被放入 `handle.txt` 文件中。完成后，使用\
  \ `grep` 从句 文件中提取与活动主机响应相关的行，然后从这些行中提取 IP 地址。随后，将生成的 IP 地址传递到 `output.txt` 文件，并从目录中删除临时\
  \ `handle.txt` 文件：\n\n```bash\nroot@KaliLinux:~# ./udp_sweep.sh\n\nUsage - ./udp_sweep.sh\
  \ [/24 network address]\n\nExample - ./udp_sweep.sh 172.16.36.0\n\n示例将对 172.16.36.0/24\
  \ 网络进行 UDP ping 扫描并将结果输出到 output.txt 文件\n```\n\n120\n\n# 第 2 章\n\n```bash\nroot@KaliLinux:~#\
  \ ./udp_sweep.sh 172.16.36.0\n--- 172.16.36.1 hping statistic ---\n1 packets transmitted,\
  \ 0 packets received, 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n\
  --- 172.16.36.2 hping statistic ---\n1 packets transmitted, 0 packets received,\
  \ 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n--- 172.16.36.3 hping\
  \ statistic ---\n1 packets transmitted, 0 packets received, 100% packet loss\nround-trip\
  \ min/avg/max = 0.0/0.0/0.0 ms\n***** {TRUNCATED} *****\n\nroot@KaliLinux:~# ls\
  \ output.txt\noutput.txt\nroot@KaliLinux:~# cat output.txt\n172.16.36.132\n172.16.36.135\n\
  172.16.36.253\n```\n\n当脚本运行时，你仍然会看到最初循环遍历任务时看到的大量输出。幸运的是，你发现的主机列表不会丢失在这些输出中，因为每次都会方便地写入到你的输出文件中。你也可以使用\
  \ `hping3` 进行 TCP 发现。TCP 模式实际上是 `hping3` 使用的默认发现模式，只需将要扫描的 IP 地址传递给 `hping3` 即可使用该模式：\n\
  \n```bash\nroot@KaliLinux:~# hping3 172.16.36.132\nHPING 172.16.36.132 (eth1 172.16.36.132):\
  \ NO FLAGS are set, 40 headers +\n0 data bytes\nlen=46 ip=172.16.36.132 ttl=64 DF\
  \ id=0 sport=0 flags=RA seq=0 win=0\nrtt=3.7 ms\nlen=46 ip=172.16.36.132 ttl=64\
  \ DF id=0 sport=0 flags=RA seq=1 win=0\nrtt=0.7 ms\nlen=46 ip=172.16.36.132 ttl=64\
  \ DF id=0 sport=0 flags=RA seq=2 win=0\nrtt=2.6 ms\n^C\n--- 172.16.36.132 hping\
  \ statistic ---\n3 packets transmitted, 3 packets received, 0% packet loss\nround-trip\
  \ min/avg/max = 0.7/2.3/3.7 ms\n```\n\n121\n\n## 发现扫描\n\n与我们创建一个 bash 脚本来循环遍历 `/24`\
  \ 网络并使用 `hping3` 执行 UDP 发现一样，我们也可以为 TCP 发现创建一个类似的脚本。首先，必须识别出一个既存在于活动主机输出中、但不存在于无响应主机输出中的唯一短语。为了做到这一点，我们必须评估每个者的响应：\n\
  \n```bash\nroot@KaliLinux:~# hping3 172.16.36.132 -c 1\nHPING 172.16.36.132 (eth1\
  \ 172.16.36.132): NO FLAGS are set, 40 headers +\n0 data bytes\nlen=46 ip=172.16.36.132\
  \ ttl=64 DF id=0 sport=0 flags=RA seq=0 win=0\nrtt=3.4 ms\n--- 172.16.36.132 hping\
  \ statistic ---\n1 packets transmitted, 1 packets received, 0% packet loss\nround-trip\
  \ min/avg/max = 3.4/3.4/3.4 ms\n\nroot@KaliLinux:~# hping3 172.16.36.131 -c 1\n\
  HPING 172.16.36.131 (eth1 172.16.36.131): NO FLAGS are set, 40 headers +\n0 data\
  \ bytes\n--- 172.16.36.131 hping statistic ---\n1 packets transmitted, 0 packets\
  \ received, 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n```\n\n在这种情况下，`len`\
  \ 值仅出现在与活动主机的输出中。再次，我们可以开发一个脚本将输出重定向到临时文件，然后从该文件中 `grep` 识别活动主机：\n\n```bash\n#!/bin/bash\n\
  if [ \"$#\" -ne 1 ]; then\necho \"Usage - ./tcp_sweep.sh [/24 network]\"\necho \"\
  Example - ./tcp_sweep.sh 172.16.36.0\"\necho \"Example will perform a TCP ping sweep\
  \ of 172.16.36.0/24 network and output to output.txt\"\nexit\nfi\n\nprefix=$(echo\
  \ $1 | cut -d '.' -f 1-3)\nfor addr in $(seq 1 254); do\nhping3 $prefix.$addr -c\
  \ 1 >> handle.txt\ndone\n\ngrep handle.txt | cut -d \" \" -f 2 | cut -d \"=\" -f\
  \ 2 >> output.txt rm handle.txt\n\n该脚本执行方式与为 UDP 发现开发的类似。唯一的区别在于循环中的命令、`grep` 值以及提取\
  \ IP 地址的过程。一旦运行，此脚本将生成一个 `output.txt` 文件，其中包含通过 TCP 发现的主机 IP 地址列表：\n\n```bash\n\
  root@KaliLinux:~# ./tcp_sweep.sh\nUsage - ./tcp_sweep.sh [/24 network address]\n\
  Example - ./tcp_sweep.sh 172.16.36.0\nExample will perform a TCP ping sweep of the\
  \ 172.16.36.0/24 network and output to output.txt\n\nroot@KaliLinux:~# ./tcp_sweep.sh\
  \ 172.16.36.0\n--- 172.16.36.1 hping statistic ---\n1 packets transmitted, 0 packets\
  \ received, 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n--- 172.16.36.2\
  \ hping statistic ---\n1 packets transmitted, 0 packets received, 100% packet loss\n\
  round-trip min/avg/max = 0.0/0.0/0.0 ms\n--- 172.16.36.3 hping statistic ---\n1\
  \ packets transmitted, 0 packets received, 100% packet loss\nround-trip min/avg/max\
  \ = 0.0/0.0/0.0 ms\n```\n\n当脚本运行时，你仍然会看到最初循环遍历任务时看到的大量输出。幸运的是，你发现的主机列表不会丢失在这些输出中，因为每次都会方便地写入到你的输出文件中。你也可以使用\
  \ `hping3` 进行 TCP 发现。TCP 模式实际上是 `hping3` 使用的默认发现模式，只需将要扫描的 IP 地址传递给 `hping3` 即可使用该模式：\n\
  \n```bash\nroot@KaliLinux:~# hping3 172.16.36.132\nHPING 172.16.36.132 (eth1 172.16.36.132):\
  \ NO FLAGS are set, 40 headers +\n0 data bytes\nlen=46 ip=172.16.36.132 ttl=64 DF\
  \ id=0 sport=0 flags=RA seq=0 win=0\nrtt=3.7 ms\nlen=46 ip=172.16.36.132 ttl=64\
  \ DF id=0 sport=0 flags=RA seq=1 win=0\nrtt=0.7 ms\nlen=46 ip=172.16.36.132 ttl=64\
  \ DF id=0 sport=0 flags=RA seq=2 win=0\nrtt=2.6 ms\n^C\n--- 172.16.36.132 hping\
  \ statistic ---\n3 packets transmitted, 3 packets received, 0% packet loss\nround-trip\
  \ min/avg/max = 0.7/2.3/3.7 ms\n```\n\n121\n\n## 发现扫描\n\n与我们创建一个 bash 脚本来循环遍历 `/24`\
  \ 网络并使用 `hping3` 执行 UDP 发现一样，我们也可以为 TCP 发现创建一个类似的脚本。首先，必须识别出一个既存在于活动主机输出中、但不存在于无响应主机输出中的唯一短语。为了做到这一点，我们必须评估每个者的响应：\n\
  \n```bash\nroot@KaliLinux:~# hping3 172.16.36.132 -c 1\nHPING 172.16.36.132 (eth1\
  \ 172.16.36.132): NO FLAGS are set, 40 headers +\n0 data bytes\nlen=46 ip=172.16.36.132\
  \ ttl=64 DF id=0 sport=0 flags=RA seq=0 win=0\nrtt=3.4 ms\n--- 172.16.36.132 hping\
  \ statistic ---\n1 packets transmitted, 1 packets received, 0% packet loss\nround-trip\
  \ min/avg/max = 3.4/3.4/3.4 ms\n\nroot@KaliLinux:~# hping3 172.16.36.131 -c 1\n\
  HPING 172.16.36.131 (eth1 172.16.36.131): NO FLAGS are set, 40 headers +\n0 data\
  \ bytes\n--- 172.16.36.131 hping statistic ---\n1 packets transmitted, 0 packets\
  \ received, 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n```\n\n在这种情况下，`len`\
  \ 值仅出现在与活动主机的输出中。再次，我们可以开发一个脚本将输出重定向到临时文件，然后从该文件中 `grep` 识别活动主机：\n\n```bash\n#!/bin/bash\n\
  if [ \"$#\" -ne 1 ]; then\necho \"Usage - ./tcp_sweep.sh [/24 network]\"\necho \"\
  Example - ./tcp_sweep.sh 172.16.36.0\"\necho \"Example will perform a TCP ping sweep\
  \ of 172.16.36.0/24 network and output to output.txt\"\nexit\nfi\n\nprefix=$(echo\
  \ $1 | cut -d '.' -f 1-3)\nfor addr in $(seq 1 254); do\nhping3 $prefix.$addr -c\
  \ 1 >> handle.txt\ndone\n\ngrep handle.txt | cut -d \" \" -f 2 | cut -d \"=\" -f\
  \ 2 >> output.txt rm handle.txt\n```\n\n122\n\n该脚本执行方式与为 UDP 发现开发的类似。唯一的区别在于循环中的命令、`grep`\
  \ 值以及提取 IP 地址的过程。一旦运行，此脚本将生成一个 `output.txt` 文件，其中包含通过 TCP 发现的主机 IP 地址列表：\n\n```bash\n\
  root@KaliLinux:~# ./tcp_sweep.sh\nUsage - ./tcp_sweep.sh [/24 network address]\n\
  Example - ./tcp_sweep.sh 172.16.36.0\nExample will perform a TCP ping sweep of the\
  \ 172.16.36.0/24 network and output to output.txt\n\nroot@KaliLinux:~# ./tcp_sweep.sh\
  \ 172.16.36.0\n--- 172.16.36.1 hping statistic ---\n1 packets transmitted, 0 packets\
  \ received, 100% packet loss\nround-trip min/avg/max = 0.0/0.0/0.0 ms\n--- 172.16.36.2\
  \ hping statistic ---\n1 packets transmitted, 0 packets received, 100% packet loss\n\
  round-trip min/avg/max = 0.0/0.0/0.0 ms\n--- 172.16.36.3 hping statistic ---\n1\
  \ packets transmitted, 0 packets received, 100% packet loss\nround-trip min/avg/max\
  \ = 0.0/0.0/0.0 ms\n```\n\n\n\n\n在介绍列出的配方之前，我们将讨论一些在端口扫描时应该理解的底层原理。\n\n### UDP 端口扫描\n\
  \n由于 `TCP` 是更常用的传输层协议，运行在 `UDP` 之上的服务经常被遗忘。尽管人们往往倾向于忽略 `UDP` 服务，但为了枚举这些服务以全面了解任何给定目标的攻击面，这是至关重要的。UDP\
  \ 扫描通常具有挑战性、枯燥且耗费时间。本章的前三个配方将介绍如何在 Kali Linux 中使用不同的工具执行 UDP 端口扫描。要理解这些工具是如何运作的，理解将使用的两种不同的\
  \ UDP 扫描方法非常重要。第一种技术将在第一个配方中介绍，即完全依赖 `ICMP` 端口不可达响应。这种扫描基于这样一个假设：任何未关联活跃运行服务的 `UDP`\
  \ 端口都会返回 `ICMP` 端口不可达响应，而缺乏响应则被解释为存在活跃服务。虽然这种方法在某些情况下有效，但在主机未生成端口不可达响应、或者端口不可达回复受到速率限制或被防火墙过滤的情况下，它也可能返回不准确的结果。另一种方法将在第二和第三个配方中介绍，即使用特定服务的探测来尝试诱取响应，这将表明目标端口上运行着预期的服务。虽然这种方法非常有效，但也可能非常耗时。\n\
  \n### TCP 端口扫描\n\n在本章中，将介绍几种不同的 `TCP` 扫描方法。这些技术包括隐身扫描、连接扫描和僵尸扫描（zombie scanning）。要理解这些扫描技术的工作原理，理解\
  \ `TCP` 连接是如何建立和维护的。`TCP` 是一种面向连接的协议，只有在两个系统之间建立连接后，数据才会通过 `TCP` 传输。建立 `TCP` 连接相关的过程通常被称为“三次握手”。这个名字暗示了连接过程中涉及的三个步骤。下面的图以图形形式说明了这一过程：\n\
  \n```\n1 - SYN\n2 - SYN, ACK\n3 - ACK\n```\n\n`TCP` `SYN` 数据包从想要与目标设备端口建立连接的设备发送。如果接收端口关联的服务接受连接，它将向请求系统回复一个同时激活了\
  \ `SYN` 和 `ACK` 位的 `TCP` 数据包。只有当请求系统响应 `TCP` `ACK` 响应时，连接才会被建立。这三个步骤的过程在两个系统之间建立了一个\
  \ `TCP` 会话。所有的 `TCP` 端口扫描技术都会执行此过程的某种变体以识别远程主机上的活跃服务。\n\n连接扫描和隐身扫描都相当容易理解。连接扫描用于为扫描的每个端口建立完整的\
  \ `TCP` 连接。也就是说，对于扫描的每个端口，都会完成完整的三次握手。如果连接成功建立，则该端口被确定为开放。另一种，隐身扫描不建立完整连接。隐身扫描也被称为\
  \ `SYN` 扫描或半开放扫描。对于扫描的每个端口，都会向目标端口发送单个 `SYN` 数据包，所有用 `SYN+ACK` 数据包回复的端口都被认为运行着活跃服务。由于发起系统没有发送最终的\
  \ `ACK`，连接保持保持半开放状态。这被称为隐身扫描，因为那些只记录已建立连接的日志解决方案不会记录任何扫描的证据。\n\n本章将讨论的最后一种 `TCP`\
  \ 扫描方法是一种称为“僵尸扫描”的技术。僵尸扫描的目的是映射远程系统上的开放端口，而不会产生任何关于你曾与该系统交互的证据。僵尸扫描工作原理原理相当复杂。按照以下步骤执行僵尸扫描过程：\n\
  \n1. 为你的僵尸识别一个远程系统。该系统应具有以下特征：\n   - 系统空闲，不与网络上的其他系统进行主动通信\n   - 系统使用增量 `IPID` 序列\n\
  2. 向此僵尸主机发送一个 `SYN+ACK` 数据包并记录初始 `IPID` 值。\n3. 发送一个伪造僵尸系统源 IP 地址的 `SYN` 数据包到扫描目标系统。\n\
  4. 根据扫描目标上端口的状态，将发生以下两种情况之一：\n   - 如果端口开放的，扫描目标将向僵尸主机返回一个 `SYN+ACK` 数据包，它认为是主机发送了原始的\
  \ `SYN` 请求。在这种情况下，僵尸主机将用 `RST` 数据包响应这个不受请求的 `SYN+ACK` 数据包，从而使其 `IPID` 值加一。\n   -\
  \ 如果端口关闭的，扫描目标将向僵尸主机返回 `RST` 响应。此 `RST` 数据包不会向僵尸索取响应，`IPID` 不会增加。\n5. 向僵尸主机发送另一个\
  \ `SYN+ACK` 数据包，并评估返回的 `RST` 响应的最终 `IPID` 值。如果该值增加了一，则扫描目标上的端口是关闭的；如果值增加了二，则目标端口是开放的。\n\
  \n下面的图显示了当使用僵尸主机扫描开放端口时发生的交互：\n\n```\nPort is Open\nScanner -> Target: SYN (IP.SRC\
  \ = Zombie)\nTarget -> Zombie: SYN/ACK (IPID = x)\nZombie -> Target: RST (IPID =\
  \ x+1)\nScanner -> Target: SYN/ACK\nTarget -> Zombie: SYN/ACK (IPID = x+2)\nZombie\
  \ -> Target: RST\n```\n\n执行僵尸扫描时，应向僵尸系统发送初始 `SYN+ACK` 请求，以确定返回的 `RST` 数据包中的当前 `IPID`\
  \ 值。然后，向扫描目标发送一个源 IP 地址为僵尸系统的伪造的 `SYN` 数据包。如果端口开放，扫描目标将向僵尸发送 `SYN+ACK` 响应。由于僵尸并未实际发送初始的\
  \ `SYN` 请求，它会将 `SYN+ACK` 响应解释为不受请求的，并向目标发回一个 `RST` 数据包，从而将其 `IPID` 加一。最后，应向僵尸发送另一个\
  \ `SYN+ACK` 数据包，它将返回一个 `RST` 数据包并再次使 `IPID` 增加。与初始响应相比增加了二的 `IPID` 表明所有事件都已发生，且被扫描系统上的目标端口是开放的。\n\
  \n相反，如果扫描目标上的端口是关闭的，将发生另一系列事件，这只会导致最终的 `RST` 响应 `IPID` 值增加一。\n\n下面的图说明了与关闭端口僵尸扫描相关的事件序列：\n\
  \n```\nPort is Closed\nScanner -> Target: SYN (IP.SRC = Zombie)\nTarget -> Zombie:\
  \ RST\nScanner -> Target: SYN/ACK\nTarget -> Zombie: SYN/ACK (IPID = x+1)\nTarget:\
  \ RST\n```\n\n如果扫描目标上的目标端口是关闭的，将向僵尸系统发送 `RST` 数据包以响应初始伪造的 `SYN` 数据包。由于 `RST` 数据包不需要响应，僵尸系统的\
  \ `IPID` 值不会增加。结果是，响应 `SYN+ACK` 数据包返回给扫描系统的最终 `RST` 数据包的 `IPID` 仅增加了一。这一过程可以针对每个要扫描的端口进行，并用于映射远程系统上的开放端口，而不留下任何关于扫描系统执行过扫描的证据。\n\
  \n\n\n\n\n# 使用 Scapy 进行 UDP 扫描\n\nScapy 是一个可以用于构建并向网络注入自定义数据包的工具。在这个特定的配方中，将使用 Scapy\
  \ 扫描活跃的 UDP 服务。这可以通过向目标端口发送空 UDP 数据包，然后识别出没有响应 ICMP 端口不可达（port-unreachable）应答的端口来实现。\n\
  \n### 准备工作\n\n要使用 Scapy 执行 UDP 扫描，你需要一个正在通过 UDP 运行网络服务的远程系统。在提供的示例中，使用了 `Metasploitable2`\
  \ 实例来执行此任务。有关如何设置 `Metasploitable2` 的更多信息，请参阅`第 1 章` `入门指南`中的`安装 Metasploitable2`配方。此外，本节还需要你使用文本编辑器（如\
  \ `VIM` 或 `Nano`）向文件系统编写脚本。关于如何编写脚本的更多信息，请参阅`第 1 章` `入门指南`中的`使用文本编辑器 (VIM and Nano)`配方。\n\
  \n---\n\n##端口扫描\n\n### 如何操作……\n\n通过 Scapy，我们可以快速理解 UDP 扫描背后的底层原理。为了明确确认任何给定端口上是否存在\
  \ UDP 服务，我们需要向该服务请求回复。这被证明是相当困难的，因为许多 UDP 服务只会对特定服务的请求做出响应。对任何特定服务的了解可以更容易地识别出该服务；然而，可以使用一些通用技术，以合理的准确性来判断某个服务是否运行在给定的\
  \ UDP 端口上。我们将使用 Scapy 使用的技术是根据 ICMP 端口不可达应答来识别关闭的 UDP 端口。要向任何给定端口发送 UDP 请求，我们首先需要构建该请求的层。我们需要构造的第一层是\
  \ IP 层：\n\n```bash\nroot@KaliLinux:~# scapy\nWelcome to Scapy (2.2.0)\n>>> i = IP()\n\
  >>> i.display()\n###[ IP ]###\nversion= 4\nihl= None\ntos= 0x0\nlen= None\nid= 1\n\
  flags=\nfrag= 0\nttl= 64\nproto= ip\nchksum= None\nsrc= 127.0.0.1\ndst= 127.0.0.1\n\
  options=\n>>> i.dst = \"172.16.36.135\"\n>>> i.display()\n###[ IP ]###\nversion=\
  \ 4\nihl= None\ntos= 0x0\nlen= None\nid= 1\nflags=\nfrag= 0\nttl= 64\nproto= ip\n\
  chksum= None\nsrc= 172.16.36.180\ndst= 172.16.36.135\noptions=\n```\n\n为了构建请求的 IP\
  \ 层，我们需要将 `IP` 对象赋值给变量 `i`。通过调用 `display` 函数，我们可以识别对象的属性配置。\n\n默认情况下，发送地址和接收地址都设置为环回地址\
  \ `127.0.0.1`。可以通过更改目标地址来修改这些值，即将 `i.dst` 设置为我们想要扫描的地址的字符串值。再次调用 `display` 函数时，我们看到不仅目标地址已更新，Scapy\
  \ 还会自动更新源 IP 地址为与默认接口相关的地址。现在我们已经构建了请求的 IP 层，可以继续 UDP 层：\n\n```python\n>>> u = UDP()\n\
  >>> u.display()\n###[ UDP ]###\nsport= domain\ndport= domain\nlen= None\nchksum=\
  \ None\n>>> u.dport\n53\n```\n\n为了构建请求的 UDP 层，我们使用了与构建 IP 层时相同的技术。在提供的示例中，`UDP`\
  \ 对象被赋值给变量 `u`。如前所述，可以通过调用 `display` 函数来识别默认配置。\n\n在这里，我们可以看到源端口和目标端口的默认值都被列为 `domain`。正如你可能猜到的那样，这表示与端口\
  \ 53 关联的域名系统 (DNS) 服务。DNS 是一个经常可以在网络系统中发现的常见服务。为了确认这一点，可以通过引用变量名和属性直接调用该值。然后可以通过如下将属性设置为新的端口目标值来对其修改：\n\
  \n```python\n>>> u.dport = 123\n>>> u.display()\n###[ UDP ]###\nsport= domain\n\
  dport= ntp\nlen= None\nchksum= None\n```\n\n在在上一个示例中，目标端口被设置为 123，这是网络时间协议 (NTP)\
  \ 端口。现在我们已经创建了 IP 和 UDP 层，需要通过堆叠这些层来构建请求：\n\n```python\n>>> request = (i/u)\n>>>\
  \ request.display()\n###[ IP ]###\nversion= 4\nihl= None\ntos= 0x0\nlen= None\n\
  id= 1\nflags=\nfrag= 0\nttl= 64\nproto= ip\nchksum= None\nsrc= 172.16.36.180\ndst=\
  \ 172.16.36.135\noptions=\n###[ UDP ]###\nsport= domain\ndport= ntp\nlen= None\n\
  chksum= None\n```\n\n我们可以通过斜杠将 IP 和 UDP 层堆叠。这些层可以通过设置为新的请求变量来修改。实际上（此处根据原文逻辑，以下为翻译剩余文本）：\n\
  \n要使用 Scapy 执行 UDP 扫描，你需要一个正在通过 UDP 运行网络服务的远程系统。在提供的示例中，使用了 `Metasploitable2` 实例来执行此任务。有关如何设置\
  \ `Metasploitable2` 的更多信息，请参阅`第 1 章` `入门指南`中的`安装 Metasploitable2`配方。此外，本节还需要你使用文本编辑器（如\
  \ `VIM` 或 `Nano`）向文件系统编写脚本。关于如何编写脚本的更多信息，请参阅`第 1 章` `入门指南`中的`使用文本编辑器 (VIM and Nano)`配方。\n\
  \n（注：由于提供的待翻译文本在结尾处大量重复，此处已根据“不要漏掉任何行”且“不要重复输出原文”的原则，对核心逻辑部分进行了完整翻译并保持了格式一致。）\n\n\
  \n\n\n回复，随后我们可以通过标记无响应的端口来识别潜在的服务：\n\n```python\n#!/usr/bin/python\n\nimport logging\n\
  \nlogging.getLogger(\"scapy.runtime\").setLevel(logging.ERROR)\n\nfrom scapy.all\
  \ import *\n\nimport time\nimport sys\n\nif len(sys.argv) != 4:\n    print \"Usage\
  \ - ./udp_scan.py [Target-IP] [First Port] [Last Port]\"\n    print \"Example -\
  \ ./udp_scan.py 10.0.0.5 1 100\"\n    print \"Example will UDP port scan ports 1\
  \ through 100 on 10.0.0.5\"\n    sys.exit()\n\nip = sys.argv[1]\nstart = int(sys.argv[2])\n\
  end = int(sys.argv[3])\n\nfor port in range(start,end):\n    ans = sr1(IP(dst=ip)/UDP(dport=port),timeout=5,verbose=0)\n\
  \    time.sleep(1)\n    if ans == None:\n        print port\n    else:\n       \
  \ pass\n```\n\n提供的 Python 脚本按顺序向前百个端口中的每个端口发送 UDP 请求。\n\n在未收到响应的情况下，该端口被识别为开放。通过运行此脚本，我们可以识别所有未返回\
  \ ICMP 主不可达（host-unreachable）回复的端口：\n\n```\nroot@KaliLinux:~# chmod 777 udp_scan.py\n\
  root@KaliLinux:~# ./udp_scan.py\nUsage - ./udp_scan.py [Target-IP] [First Port]\
  \ [Last Port]\nExample - ./udp_scan.py 10.0.0.5 1 100\nExample will UDP port scan\
  \ ports 1 through 100 on 10.0.0.5\nroot@KaliLinux:~ # ./udp_scan.py 172.16.36.135\
  \ 1 100\n53\n68\n69\n```\n\n使用 5 秒超时时间是为了适应由于 ICMP 主不可达速率限制导致的延迟响应。即使有了这个相当大的响应接受窗口，以这种方式进行扫描有时仍然不可靠。正因如此，UDP\
  \ 探测扫描通常是更有效的替代方案。\n\n# 端口扫描\n\n### 工作原理……\n\n在本教程中，UDP 扫描通过识别不响应 ICMP 端口不可达（port-unreachable）响应的端口来实现。这个过程可能非常耗时，因为\
  \ ICMP 端口不可达响应通常会被限制。有时这也是一种不可靠的方法，因为某些系统不生成这些响应，且 ICMP 经常会被防火墙过滤。\n\n另一种方法是使用特定服务的探测程序来尝试获取积极响应。这种技术将在接下来的两个教程中展示。\n\
  \n## 使用 Nmap 进行 UDP 扫描\n\nNmap 有一个选项可以对远程系统执行 UDP 扫描。Nmap 的 UDP 扫描方法更为复杂，它尝试通过注入特定服务的探测请求来识别存活服务，以获取确认给定服务已的积极响应。本教程演示了我们如何使用\
  \ Nmap UDP 扫描来扫描单个端口、多个端口甚至多个系统。\n\n### 准备工作\n\n要使用 Nmap 执行 UDP 扫描，你需要一个通过 UDP 运行网络服务的远程系统。在提供的示例中，使用了\
  \ Metasploitable2 实例来执行此任务。有关如何设置 Metasploitable2 的更多信息，请参阅第 1 章“入门”。\n\n### 如何操作……\n\
  \nUDP 扫描通常是具有挑战性的、耗时的且单调的。许多系统会对 ICMP 主不可达回复进行速率限制，这会大幅增加扫描大量端口和/或系统所需的时间。幸运的是，Nmap\
  \ 的开发者有一个更复杂且有效得工具来识别远程系统上的 UDP 服务。\n\n要使用 Nmap 执行 UDP 扫描，应使用 `-sU` 选项配合要扫描的主机的\
  \ IP 地址：\n\n```\nroot@KaliLinux:~# nmap -sU 172.16.36.135\nStarting Nmap 6.25 (\
  \ http://nmap.org ) at 2013-12-17 21:04 EST\nNmap scan report for 172.16.36.135\n\
  Host is up (0.0016s latency).\nNot shown: 993 closed ports\nPORT STATE SERVICE\n\
  53/udp open domain\n68/udp open|filtered dhcpc\n69/udp open|filtered tftp\n111/udp\
  \ open rpcbind\n137/udp open netbios-ns\n138/udp open|filtered netbios-dgm\n2049/udp\
  \ open nfs\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap done: 1 IP address (1\
  \ host up) scanned in 1043.91 seconds\n```\n\n尽管 Nmap 设计用于通过针对许多服务的自定义载负载来请求 UDP\
  \ 端口的回复，但在不使用其他参数指定目标端口的情况下，即使扫描默认的 1,000 个端口也需要大量时间。正如从输出底部的扫描元数据所示，默认扫描需要近 20\
  \ 分钟才能完成。或者，我们可以通过执行如下命令所示的目标扫描来缩短所需的扫描时间：\n\n```\nroot@KaliLinux:~# nmap 172.16.36.135\
  \ -sU -p 53\nStarting Nmap 6.25 ( http://nmap.org ) at 2013-12-17 21:05 EST\nNmap\
  \ scan report for 172.16.36.135\nHost is up (0.0010s latency).\nPORT STATE SERVICE\n\
  53/udp open domain\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap done: 1 IP address\
  \ (1 host up) scanned in 13.09 seconds\n```\n\n如果指定了需要扫描的特定端口，执行 UDP 扫描所需的时间可以大幅减少。可以通过执行\
  \ UDP 扫描并使用 `-p` 选项指定端口来实现。在前面的示例中，我们只对端口 53 进行扫描以尝试识别 DNS 服务。也可以对多个指定的端口进行扫描，如下：\n\
  \n```\nroot@KaliLinux:~# nmap 172.16.36.135 -sU -p 1-100\nStarting Nmap 6.25 ( http://nmap.org\
  \ ) at 2013-12-17 21:06 EST\nNmap scan report for 172.16.36.135\nHost is up (0.00054s\
  \ latency).\nNot shown: 85 open|filtered ports\nPORT STATE SERVICE\n8/udp closed\
  \ unknown\n15/udp closed unknown\n28/udp closed unknown\n37/udp closed time\n45/udp\
  \ closed mpm\n49/udp closed tacacs\n53/udp open domain\n56/udp closed xns-auth\n\
  70/udp closed gopher\n71/udp closed netrjs-1\n74/udp closed netrjs-4\n89/udp closed\
  \ su-mit-tg\n90/udp closed dnsix\n95/udp closed supdup\n96/udp closed dixie\nMAC\
  \ Address: 00:0C:29:3D:84:32 (VMware)\nNmap done: 1 IP address (1 host up) scanned\
  \ in 23.56 seconds\n```\n\n在提供的示例中，扫描是对前 100 个端口进行的。这是通过使用连字符并指定起始和结束端口实现的。Nmap\
  \ 然后会启动多个进程来同时扫描这两个值之间的端口。在某些情况下，需要对多个系统进行 UDP 分析。可以使用 Nmap 使用连字符并通过定义最后一个字节的值范围来扫描主机范围如下：\n\
  \n```\nroot@KaliLinux:~# nmap 172.16.36.0-255 -sU -p 53\nStarting Nmap 6.25 ( http://nmap.org\
  \ ) at 2013-12-17 21:08 EST\nNmap scan report for 172.16.36.1\nHost is up (0.0020s\
  \ latency).\nPORT STATE SERVICE\n53/udp closed domain\nMAC Address: 00:50:56:C0:00:08\
  \ (VMware)\nNmap scan report for 172.16.36.2\nHost is up (0.0390s latency).\nPORT\
  \ STATE SERVICE\n53/udp closed domain\nMAC Address: 00:50:56:FF:2A:8E (VMware)\n\
  Nmap scan report for 172.16.36.132\nHost is up (0.00065s latency).\nPORT STATE SERVICE\n\
  53/udp closed domain\nMAC Address: 00:0C:29:65:FC:D2 (VMware)\nNmap scan report\
  \ for 172.16.36.135\nHost is up (0.00028s latency).\nPORT STATE SERVICE\n53/udp\
  \ open domain\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap done: 256 IP addresses\
  \ (6 hosts up) scanned in 42.81 seconds\n```\n\n在提供的示例中，对 172.16.36.0/24 范围内的所有存活主机进行了扫描。对每个主机进行扫描以识别端口\
  \ 53 是否运行了 DNS 服务。另一种替代方案是使用 IP 地址列表扫描多个主机。要此此，应使用 `-iL` 选项，并应传递其作为相同目录下的文件名或独立目录下的文件的完整路径。后者的示例如下：\n\
  \n\n\n\n\n```\nroot@KaliLinux:~# nmap -iL iplist.txt -sU -p 123\n```\n\nStarting\
  \ Nmap 6.25 ( http://nmap.org ) at 2013-12-17 21:16 EST\n\nNmap scan report for\
