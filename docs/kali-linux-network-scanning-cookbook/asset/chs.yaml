  `[+] 主机 172.16.36.135 运行操作系统: \"Linux Kernel 2.4.24\" (猜测概率: 100%）`\n`[+] 主机 172.16.36.135\
  \ 运行操作系统: \"Linux Kernel 2.4.25\" (猜测概率: 100%）`\n`[+] 主机 172.16.36.135 运行操作系统: \"\
  Linux Kernel 2.4.26\" (猜测概率: 100%）`\n`[+] 主机 172.16.36.135 运行操作系统: \"Linux Kernel\
  \ 2.4.27\" (猜测概率: 100%）`\n`[+] 主机 172.16.36.135 运行操作系统: \"Linux Kernel 2.4.28\"\
