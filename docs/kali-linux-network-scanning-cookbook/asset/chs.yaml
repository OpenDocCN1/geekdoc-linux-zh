  \ 0`\n\n`arcount= 0`\n\n`qd`\n\n| DNS 查询记录 |\n| qname= 'google.com' |\n| qtype=\
  \ ALL |\n| qclass= IN |\n`an= None`\n\n`ns= None`\n\n`ar= None`\n\n可以通过用正斜杠分隔变量来堆叠\
  \ IP、UDP 和 DNS 层。然后可以将这些层赋值给一个新变量，该变量将代表整个请求。随后可以调用 `display()` 函数来查看请求的配置。在发送此请求之前，我们应该以与响应相同的显示格式查看它。通过这种方式，我们可以直直地理解请求和响应之间发生的放大效应。这可以通过直接调用变量来实现：\n\
  \n`>>> request`\n\n`<IP frag=0 proto=udp dst=208.67.220.220 |<UDP sport=domain |<DNS\
