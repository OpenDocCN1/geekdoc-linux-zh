  \ rpcbind 2 (RPC #100000)`\n`139/tcp open netbios-ssn Samba smbd 3.X (workgroup:\
  \ WORKGROUP)`\n`445/tcp open netbios-ssn Samba smbd 3.X (workgroup: WORKGROUP)`\n\
  `512/tcp open exec netkit-rsh rexecd`\n`513/tcp open login?`\n`514/tcp open tcpwrapped`\n\
  \n### 指纹识别\n\n`1099/tcp open rmiregistry GNU Classpath grmiregistry`\n`1524/tcp\
  \ open ingreslock?`\n`2049/tcp open nfs 2-4 (RPC #100003)`\n`2121/tcp open ftp ProFTPD\
  \ 1.3.1`\n`3306/tcp open mysql MySQL 5.0.51a-3ubuntu5`\n`5432/tcp open postgresql\
  \ PostgreSQL DB 8.3.0 - 8.3.7`\n`5900/tcp open vnc VNC (protocol 3.3)`\n`6000/tcp\
  \ open X11 (access denied)`\n`6667/tcp open irc Unreal ircd`\n`8009/tcp open ajp13\
  \ Apache Jserv (Protocol v1.3)`\n`8180/tcp open http Apache Tomcat/Coyote JSP engine\
  \ 1.1`\n\n`MAC Address: 00:0C:29:3D:84:32 (VMware)`\n`Service Info: Hosts: metasploitable.localdomain,\
  \ localhost,`\n`irc.Metasploitable.LAN; OSs: Unix, Linux; CPE:`\n`cpe:/o:linux:linux_kernel`\n\
  \n`服务检测完成。请在 http://nmap.org/submit/ 报告任何不准确的结果。`\n\n`Nmap done: 1 IP address (1\
  \ host up) scanned in 161.49 seconds`\n\n## 工作原理…\n\nNmap 服务识别会发送一系列全面的探测请求，然后对这些请求的响应进行分析，尝试根据服务唯一的指纹和预期行为来识别服务。此外，你可以在服务识别输出的底部看到\
  \ Nmap 依赖于用户的反馈，以确保其服务指纹库的持续可靠性。\n\n## 使用 Amap 进行服务识别\n\nAmap 是 `Nmap` 的表兄弟，专门设计用于识别网络服务而设计。在本特定的教程中，我们将解释如何使用\
  \ `Amap` 执行服务识别。\n\n### 准备工作\n\n要使用 `Amap` 执行服务识别，你需要一个运行着可以被探测和检查的网络服务的远程系统。在提供的示例中，使用了\
  \ `Metasploitable2` 实例来执行此任务。有关设置 `Metasploitable2` 的更多信息，请参阅`第 1 章` `入门`（Getting\
  \ Started）中的 `安装 Metasploitable2` 教程。\n\n### 如何操作…\n\n要对单个端口执行服务识别，请带有 IP 地址和端口号运行\
  \ `Amap`：\n\n```\nroot@KaliLinux:~# amap 172.16.36.135 80\namap v5.4 (www.thc.org/thc-amap)\
  \ started at 2013-12-19 05:26:13 -\nAPPLICATION MAPPING mode\nProtocol on 172.16.36.135:80/tcp\
  \ matches http\nProtocol on 172.16.36.135:80/tcp matches http-apache-2\nUnidentified\
  \ ports: none.\namap v5.4 finished at 2013-12-19 05:26:19\n```\n\n`Amap` 还可以使用破折号表示法扫描连续的端口号。要执行此操作，请带有\
  \ IP 地址规范执行 `amap`，并指定范围内的第一个端口号、一个破折号，然后是范围内的最后一个端口号：\n\n```\nroot@KaliLinux:~#\
  \ amap 172.16.36.135 20-30\namap v5.4 (www.thc.org/thc-amap) started at 2013-12-19\
  \ 05:28:16 -\nAPPLICATION MAPPING mode\nProtocol on 172.16.36.135:25/tcp matches\
  \ smtp\nProtocol on 172.16.36.135:21/tcp matches ftp\nProtocol on 172.16.36.135:25/tcp\
  \ matches nntp\nProtocol on 172.16.36.135:22/tcp matches ssh\nProtocol on 172.16.36.135:22/tcp\
  \ matches ssh-openssh\nProtocol on 172.16.36.135:23/tcp matches telnet\nUnidentified\
  \ ports: 172.16.36.135:20/tcp 172.16.36.135:24/tcp 172.16.36.135:26/tcp 172.16.36.135:27/tcp\
  \ 172.16.36.135:28/tcp 172.16.36.135:29/tcp 172.16.36.135:30/tcp (total 7).\namap\
  \ v5.4 finished at 2013-12-19 05:28:17\n```\n\n### 指纹识别\n\n除了识别任何服务外，它还在输出末尾生成一个未识别端口的列表。此列表不仅包含了无法识别的运行服务，还包含了所有扫描的端口。当只扫描\
  \ 10 个端口时，输出是可以接受的，但当扫描较大范围时会非常烦。要抑制未识别端口的信息可以使用 `-q` 参数：\n\n```\nroot@KaliLinux:~#\
  \ amap 172.16.36.135 1-100 -q\namap v5.4 (www.thc.org/thc-amap) started at 2013-12-19\
  \ 05:29:27 -\nAPPLICATION MAPPING mode\nProtocol on 172.16.36.135:21/tcp matches\
  \ ftp\nProtocol on 172.16.36.135:25/tcp matches smtp\nProtocol on 172.16.36.135:22/tcp\
  \ matches ssh\nProtocol on 172.16.36.135:22/tcp matches ssh-openssh\nProtocol on\
  \ 172.16.36.135:23/tcp matches telnet\nProtocol on 172.16.36.135:80/tcp matches\
  \ http\nProtocol on 172.16.36.135:80/tcp matches http-apache-2\nProtocol on 172.16.36.135:53/tcp\
  \ matches dns\namap v5.4 finished at 2013-12-19 05:29:39\n```\n\n注意 `Amap` 会指示通用和更具体的指纹。在示例中，运行在端口\
  \ 22 的服务被识别为匹配 `SSH` 指纹，但也匹配了更具体的 `openssh` 指纹。显示服务的横幅（banners）可能很有帮助。可以使用 `-b`\
  \ 参数将横幅添加到输出中：\n\n```\nroot@KaliLinux:~# amap 172.16.36.135 1-100 -qb\namap v5.4\
  \ (www.thc.org/thc-amap) started at 2013-12-19 05:32:11 -\nAPPLICATION MAPPING mode\n\
  Protocol on 172.16.36.135:21/tcp matches ftp - banner: 220 (vsFTPd 2.3.4) 530 Login\
  \ with USER and PASS.\nProtocol on 172.16.36.135:22/tcp matches ssh - banner: SSH-2.0-OpenSSH_4.7p1-ubuntu8\n\
  Protocol on 172.16.36.135:22/tcp matches ssh-openssh - banner: SSH-2.0-OpenSSH_4.7p1-ubuntu8\n\
  Protocol on 172.16.36.135:25/tcp matches smtp - banner: 220 metasploitable.localdomain\
  \ ESMTP (Postfix/Ubuntu) 221 2.7.0 Error can break rules, too. Goodbye.\nProtocol\
  \ on 172.16.36.135:23/tcp matches telnet - banner: #\nProtocol on 172.16.36.135:80/tcp\
  \ matches http - banner: HTTP/1.1 200 OK Date 26 Oct 2013 014818 GMT Server/2.2.8\
  \ (Ubuntu) DAV/2 X-Powered-By PHP/5.2.4-2ubuntu5.10 Content-Length 891 Connection\
  \ close Content-Type: text/html <html><head><title>Metasploitable2 - Linux</title>\n\
  Protocol on 172.16.36.135:80/tcp matches http-apache-2 - banner: HTTP/1.1 200 OK\
  \ Date 26 Oct 2013 014818 GMT Server/2.2.8 (Ubuntu) DAV/2 X-Powered-By PHP/5.2.4-2ubuntu5.10\
  \ Content-Length 891 Connection close Content-Type: text/html <html><head><title>Metasploitable2\
  \ - Linux</title>\nProtocol on 172.16.36.135:53/tcp matches dns - banner: \\f\n\
  ```\n\n如果对每个服务都使用所有可能的指纹探测，大量端口的服务识别或对所有 65536 个端口的全面扫描可能会花费异常的时间。为了加快服务识别扫描，可以使用\
  \ `-1` 参数在匹配到指纹后停止对特定服务的分析：\n\n```\nroot@KaliLinux:~# amap 172.16.36.135 1-100 -q1\n\
  amap v5.4 (www.thc.org/thc-amap) started at 2013-12-19 05:33:16 -\nAPPLICATION MAPPING\
  \ mode\nProtocol on 172.16.36.135:21/tcp matches ftp\nProtocol on 172.16.36.135:22/tcp\
  \ matches ssh\nProtocol on 172.16.36.135:25/tcp matches smtp\nProtocol on 172.16.36.135:23/tcp\
  \ matches telnet\nProtocol on 172.16.36.135:80/tcp matches http\nProtocol on 172.16.36.135:80/tcp\
  \ matches http-apache-2\nProtocol on 172.16.36.135:53/tcp matches dns\n```\n[/content]\n\
