  Host is up (0.00040s latency).\n\nPORT STATE SERVICE\n123/udp closed ntp\nMAC Address:\
  \ 00:0C:29:65:FC:D2 (VMware)\n\nNmap scan report for 172.16.36.135.\nHost is up\
