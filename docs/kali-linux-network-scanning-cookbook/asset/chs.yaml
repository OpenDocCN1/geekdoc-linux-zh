  \ 172.16.36.0/24 yes 目标地址范围或 CIDR\n\n`identifier`\n\n`THREADS` 20 yes 并发线程数\n\n\
  `msf auxiliary(udp_sweep) > run`\n\n```\n[*] Sending 12 probes to 172.16.36.0->172.16.36.255\
