  \ Python DoS 脚本，但排除了针对 Windows 7 平台的脚本。`grep` 中的 `-v` 选项可以从结果中排除内容。通常最好是将所需的漏洞复制到另一个位置，以免修改漏洞数据库目录的内容：\n\
  \n```bash\nroot@KaliLinux:~# mkdir smb_exploit\nroot@KaliLinux:~# cd smb_exploit/\n\
  root@KaliLinux:~/smb_exploit# cp /usr/share/exploitdb/platforms/windows/dos/14607.py\
  \ /root/smb_exploit/\nroot@KaliLinux:~/smb_exploit# ls\n14607.py\n```\n\n在提供的示例中，为脚本创建了一个新目录。然后根据漏洞数据库目录位置可以推断出的绝对路径以及\
  \ `files.csv` 文件中定义的相对路径复制了脚本。一旦移动完成后，可以使用 `cat` 命令从上到下读取脚本，然后将脚本内容管道到 `more` 实用程序：\n\
  \n```bash\nroot@KaliLinux:~/smb_exploit# cat 14607.py | more\n```\n\n```python\n\
  #!/usr/bin/env python\nimport sys,struct,socket\nfrom socket import ***\nif len(sys.argv)<=2:\n\
  \    print '###############################################################'\n \
  \   print '########'\n    print '# MS10-054 Proof Of Concept by Laurent Gaffie'\n\
  \    print '# Usage: python '+sys.argv[0]+' TARGET SHARE-NAME (Nobackslash)'\n \
  \   print '# Example: python '+sys.argv[0]+' 192.168.8.101 users'\n    print '#\
  \ http://g-laurent.blogspot.com/'\n    print '# http://twitter.com/laurentgaffie'\n\
  \    print '# Email: laurent.gaffie{at}gmail{dot}com'\n    print '###############################################################'\n\
  \    print '################################'\n```\n\n与 NSE 脚本和 Metasploit 辅助模块不同，漏洞数据库中的脚本没有统一的格式。因此，处理漏洞有时会很棘手。尽管如此，简单查看脚本内容的注释或用法说明通常会有帮助。在提供的示例中，我们可以看到脚本中列出了用法，并且如果没有提供足够的参数，还会将其打印给用户。评估之后，就可以执行该脚本。\n\
  \n```bash\nroot@KaliLinux:~/smb_exploit# ./14607.py\n```\n\n```text\n./14607.py:\
  \ line 1: ?#!/usr/bin/env: No such file or directory\nimport.im6: unable to open\
  \ X server `' @ error/import.c/**ImportImageCommand/368.\nfrom: can't read /var/mail/socket\n\
  ./14607.py: line 4: $'\\r': command not found\n./14607.py: line 5: syntax error\
  \ near unexpected token `sys.argv'\n'/14607.py: line 5: ìf len(sys.argv)<=2:\n```\n\
  \n然而，在尝试执行脚本后由于缺乏标准且某些脚本只是概念证明，通常需要对这些脚本进行调整。我们需要返回文本编辑器并尝试确定来源。第一个错误指示脚本开头列出的 Python\
  \ 解释器位置存在问题。必须将其更改为 Kali Linux 文件系统中的解释器：\n\n```python\n#!/usr/bin/python\nimport\
  \ sys,struct,socket\n```\n\n\n\n\n在解决每个问题后，尝试重新运行脚本通常是一个好主意，因为有时修复一个问题就会消除多个执行错误。在这种情况下，在更改\
  \ Python 解释器的位置后，我们能够成功运行脚本：\n\n```\nroot@KaliLinux:~/smb_exploit# ./14607.py 172.16.36.134\
  \ users\n```\n\n[+]Negotiate Protocol Request sent\n[+]Malformed Trans2 packet sent\n\
  [+]The target should be down now\n\n当脚本运行时，会返回几消息以标识脚本执行的进度。最后的消息表示恶意负载已送达，服务器应该已经崩溃。可以通过查看\
  \ Windows 服务器来验证脚本的成功，该服务器现在已经崩溃并显示蓝屏（BSOD）：\n\n357\n\n### 拒绝服务\n\n### 工作原理……\n\
  本练习中演示的漏洞数据库 DoS 脚本是缓冲区溢出攻击的一个示例。通常来说，缓冲区溢出能够导致拒绝服务，因为它们会导致任意数据被加载到内存的非预期段中。这可能会破坏执行流并导致服务或操作系统的崩溃。\n\
  \n358\n\n7\n\n### Web 应用扫描\n在过去的几年里，我们看到有关大型企业和政府数据泄露的媒体报道日益增加。而且，随着人们安全意识的提高，通过利用标准边界服务渗透组织的网络变得越来越困难。与这些服务相关的已知漏洞通常很快就会被修复，留的攻击面很小。相反，Web\
  \ 应用程序通常包含自定义代码，这些代码通常不会像独立供应商提供的网络服务那样经历同样的公开审查。Web 应用程序通常是组织边界最薄弱的环节，因此对这些服务进行适当的扫描和评估至关重要。本章将包含执行\
  \ Web 应用漏洞扫描的以下方案：\n\n- 使用 Nikto 进行 Web 应用扫描\n- 使用 SSLScan 进行 SSL/TLS 扫描\n- 使用 SSLyze\
  \ 进行 SSL/TLS 扫描\n- 使用 Burp Suite 定义 Web 应用目标\n- 使用 Burp Suite 渗透工具\n- 使用 Burp Suite\
  \ Proxy\n- 使用 Burp Suite 蜘蛛\n- 使用 Burp Suite Web 应用扫描器\n- 使用 Burp Suite Intruder\n\
  - 使用 Burp Suite Comparer\n- 使用 Burp Suite Repeater\n- 使用 Burp Suite Decoder\n- Web\
  \ 应用扫描\n- 使用 Burp Suite Sequencer\n- 使用 Burp Suite Extender\n- 使用 sqlmap 进行 GET\
  \ 方法 SQL 注入\n- 使用 sqlmap 进行 POST 方法 SQL 注入\n- 使用 sqlmap 进行请求捕获 SQL 注入\n- 自动化 CSRF\
  \ 测试\n- 使用 HTTP 流量验证命令注入漏洞\n- 使用 ICMP 流量验证命令注入漏洞\n\n在具体介绍列出的每个方案之前，我们将讨论关于 Burp\
  \ Suite 和 `sqlmap` 的一些通用信息，因为这两个每个工具在本章的多个方案中都会被提到。Burp Suite 是 Kali Linux 中一个基于\
  \ Java 的图形化工具，用于记录、拦截和操作客户端浏览器与远程 Web 服务之间的请求和响应。它可能是 Web 应用渗透测试最强大的工具之一，因为它允许攻击者完全控制其系统与远程\
  \ Web 服务器的通信方式。这允许操纵原本由用户浏览器或会话定义的大量信息。`Sqlmap` 是 Kali Linux 中的一个集成命令行工具，通过自动化整个过程极大地减少了利用\
  \ SQL 注入漏洞所需的工作。`Sqlmap` 的工作原理是从大量的已知 SQL 注入查询列表中提交请求。多年来经过高度优化，可以根据之前查询的响应智能地修改注入尝试。\n\
  \n### 使用 Nikto 进行 Web 应用扫描\nNikto 是 Kali Linux 中的一个命令行工具，可用于评估 Web 应用的已知安全问题。Nikto\
  \ 会爬取目标应用程序，还会发送许多预配置的请求，尝试识别应用程序上存在的潜在危险脚本和文件。在本方案中，我们将讨论如何针对 Web 应用运行 `Nikto`\
  \ 以及如何解释结果。\n\n### 准备工作\n要使用 `Nikto` 对目标进行 Web 应用分析，你需要一个运行着一个或多个 Web 应用的远程系统。在提供的示例中，使用了一个\
  \ `Metasploitable2` 实例来执行此任务。`Metasploitable2` 在 TCP 端口 `80` 上运行了几个预装的漏洞 Web 应用程序。有关设置\
  \ `Metasploitable2` 的更多信息，请参考本书第一章“入门”中的“*安装 Metasploitable2*”方案。\n\n360\n\n*第 7\
  \ 章*\n\n### 如何操作……\n运行 `Nikto` 相关的语法和使用复杂性很大程度上取决于所针对的应用类型。要查看该工具用法和语法的概述，请使用 `nikto\
  \ -help` 命令。在提供的第一个示例中，对 `google.com` 执行了扫描。`-host` 参数可以指定被扫描目标的主机机值。`-port` 定义了\
  \ Web 服务运行的端口。`-ssl` 指示 `Nikto` 在扫描之前与目标 Web 服务器建立 SSL/TLS 会话，如下：\n\n```\nroot@KaliLinux:~#\
  \ nikto -host google.com -port 443 -ssl\n- Nikto v2.1.4\n------------------------------------------------------------------------\n\
  ---\n+ Target IP: 74.125.229.161\n+ Target Hostname: google.com\n+ Target Port:\
  \ 443\n------------------------------------------------------------------------\n\
  ---\n+ SSL Info: Subject: /C=US/ST=California/L=Mountain View/O=Google\n/CN=*.google.com\n\
  Ciphers: ECDHE-RSA-AES128-GCM-SHA256\nIssuer: /C=US/O=Google Inc/CN=Google Internet\n\
  Authority G2\n+ Start Time: 2014-03-30 02:30:10\n------------------------------------------------------------------------\n\
  ---\n+ Server: gws\n+ Root page / redirects to: https://www.google.com/\n+ Server\
  \ banner has changed from gws to GFE/2.0, this may suggest a WAF\nor load balancer\
  \ is in place\n****TRUNCATED} ****\n```\n\n或者，`-host` 参数也可以用于定义被扫描目标系统的 IP 地址。`-nossl`\
  \ 参数可以指示 `Nikto` 不使用任何传输层安全。`-vhost` 参数可以指定 HTTP 请求中 host 标头的值。这在单个 IP 地址上托管了多个虚拟主机名的情况下，这特别有帮助。请看以下示例：\n\
  \n```\nroot@KaliLinux:~# nikto -host 83.166.169.228 -port 80 -nossl -vhost packtpub.com\n\
  - Nikto v2.1.4\n------------------------------------------------------------------------\n\
  ---\n+ Target IP: 83.166.169.228\n+ Target Hostname: packtpub.com\n+ Target Port:\
  \ 80\n+ Start Time: 2014-03-30 02:40:29\n------------------------------------------------------------------------\n\
  ---\n+ Server: Varnish\n+ Root page / redirects to: http://www.packtpub.com/\n+\
  \ No CGI Directories found (use '-C all' to force check all possible dirs)\n+ OSVDB-5737:\
  \ WebLogic may reveal its internal IP or hostname in the Location header. The value\
  \ is \"http://www.packtpub.com.\"\n```\n\n在前面的示例中，针对托管在 `Metasploitable2` 系统上的 Web\
  \ 服务执行了 `Nikto` 扫描。没有使用 `-port` 参数是因为该 Web 服务托管在\n\n\n\n\n在 `TCP` 端口 `80` 上，这是 `Nikto`\
  \ 的默认扫描端口。此外，没有使用 `-nossl` 参数，因为默认情况下，`Nikto` 不会尝试端口 `80` 上尝试 SSL/TLS 连接。\n\n考虑以下示例：\n\
  \n```\nroot@KaliLinux:~# nikto -host 172.16.36.135\n- Nikto v2.1.4\n------------------------------------------------------------------------\n\
  ---\n+ Target IP: 172.16.36.135\n+ Target Hostname: 172.16.36.135\n+ Target Port:\
  \ 80\n+ Start Time: 2014-03-29 23:54:28\n------------------------------------------------------------------------\n\
  ---\n+ Server: Apache/2.2.8 (Ubuntu) DAV/2\n+ Retrieved x-powered-by header: PHP/5.2.4-2ubuntu5.10\n\
  + Apache/2.2.8 appears to be outdated (current is at least Apache/2.2.17). Apache\
  \ 1.3.42 (final release) and 2.0.64 are also current.\n+ DEBUG HTTP verb may show\
  \ server debugging information. See http://msdn.microsoft.com/en-us/library/e8z01xdh%28VS.80%29.aspx\
  \ for details.\n+ OSVDB-877: HTTP TRACE method is active, suggesting the host is\
  \ vulnerable to XST\n+ OSVDB-3233: /phpinfo.php: Contains PHP configuration information\n\
  + OSVDB-3268: /doc/: Directory indexing found.\n+ OSVDB-48: /doc/: The /doc/ directory\
  \ is browsable. This may be /usr/doc.\n+ OSVDB-12184: /index.php?=PHPB8B5F2A-3C92-11d3-A3A9-4C7B08C10000:\
  \ PHP reveals potentially sensitive information via certain HTTP requests that contain\
  \ specific QUERY strings.\n+ OSVDB-3092: /phpMyAdmin/: phpMyAdmin is for managing\
  \ MySQL databases, and should be protected or limited to authorized hosts.\n+ OSVDB-3268:\
  \ /test/: Directory indexing found.\n+ OSVDB-3092: /test/: This might be interesting...\n\
  + OSVDB-3268: /icons/: Directory indexing found.\n+ OSVDB-3233: /icons/README: Apache\
  \ default file found.\n+ 6448 items checked: 1 error(s) and 13 item(s) reported\
  \ on remote host\n+ End Time: 2014-03-29 23:55:00 (32 seconds)\n------------------------------------------------------------------------\n\
  ---\n+ 1 host(s) tested\n```\n\n`Nikto` 对 Metasploitable2 Web 扫描结果显示了某些 `Nikto`\
  \ 经常识别出的项目。这些项目包括风险的 HTTP 方法、默认安装文件、暴露的目录列表、敏感信息泄露以及应该限制访问的文件。了解这些文件通常对于寻找获取服务器权限的方法或识别漏洞非常有帮助。\n\
  \n### 工作原理……\n\n`Nikto` 通过引用 `robots.txt` 文件、爬取应用程序表面以及循环遍历已知文件列表来识别潜在感兴趣的文件，这些文件包含敏感信息、易漏洞内容，或者由于其呈现的内容和/或功能特性而应该被限制访问。\n\
  \n### 使用 SSLScan 进行 SSL/TLS 扫描\n\n`SSLScan` 是 Kali Linux 中的一个集成命令行工具，可评估远程 Web 服务的\
  \ SSL/TLS 支持的安全性。在本教程中，我们将讨论如何针对 Web 运行 `SSLScan`，以及如何解释和/或处理输出结果。\n\n### 准备工作\n\
  \n要使用 `SSLScan` 对目标进行 SSL/TLS 分析，你需要一个运行启用 SSL 或 TLS 的 Web 服务的远程系统。在提供的示例中，使用了 Google\
  \ 和 Metasploitable2 实例的组合来执行此任务。有关如何设置 Metasploitable2 的更多信息，请参阅本书书中*第 1 章* *入门*\
  \ 部分中的*安装 Metasploitable2* 教程。\n\n### 如何操作……\n\n`SSLScan` 可以是对目标 Web 服务器的 SSL/TLS\
  \ 配置进行精简分析的有效工具。要对具有注册域名的 Web 服务器进行基本扫描，只需将域名作为参数传递给它，如下：\n\n```\nroot@KaliLinux:~#\
  \ sslscan google.com\n```\n\n```\n___ ___| |___ ___ __ _ _ __\n/ __/ __| / __|/\
  \ __/ _` | '_ \\\n\\__ \\__ \\ \\__ \\ (_| (_| | | | |\n|___/___/_|___/\\___\\__,_|_|\
  \ |_|\nVersion 1.8.2\nhttp://www.titania.co.uk\nCopyright Ian Ventura-Whiting 2009\n\
  Testing SSL server google.com on port 443\nSupported Server Cipher(s):\nFailed SSLv3\
  \ 256 bits ECDHE-RSA-AES256-GCM-SHA384\nFailed SSLv3 256 bits ECDHE-ECDSA-AES256-GCM-SHA384\n\
  Failed SSLv3 256 bits ECDHE-RSA-AES256-SHA384\nFailed SSLv3 256 bits ECDHE-ECDSA-AES256-SHA384\n\
  Accepted SSLv3 256 bits ECDHE-RSA-AES256-SHA\nRejected SSLv3 256 bits ECDHE-ECDSA-AES256-SHA\n\
  Rejected SSLv3 256 bits SRP-DSS-AES-256-CBC-SHA\nRejected SSLv3 256 bits SRP-RSA-AES-256-CBC-SHA\n\
  Failed SSLv3 256 bits DHE-DSS-AES256-GCM-SHA384\nFailed SSLv3 256 bits DHE-RSA-AES256-GCM-SHA384\n\
  Failed SSLv3 256 bits DHE-RSA-AES256-SHA256\nFailed SSLv3 256 bits DHE-DSS-AES256-SHA256\n\
  Rejected SSLv3 256 bits DHE-RSA-AES256-SHA\nRejected SSLv3 256 bits DHE-DSS-AES256-SHA\n\
  Rejected SSLv3 256 bits DHE-RSA-CAMELLIA256-SHA\nRejected SSLv3 256 bits DHE-DSS-CAMELLIA256-SHA\n\
  **** {TRUNCATED} ****\n```\n\n执行时，`SSLScan` 将快速循环到目标服务器的连接，并枚举接受的加密算法、首选加密套件和 SSL\
  \ 证书信息。可以使用 `grep` 将输出限制为所需的信息。在下面的示例中，使用 `grep` 仅查看接受的加密算法：\n\n```\nroot@KaliLinux:~#\
  \ sslscan google.com | grep Accepted\nAccepted SSLv3 256 bits ECDHE-RSA-AES256-SHA\n\
  Accepted SSLv3 256 bits AES256-SHA\nAccepted SSLv3 168 bits ECDHE-RSA-DES-CBC3-SHA\n\
  Accepted SSLv3 168 bits DES-CBC3-SHA\nAccepted SSLv3 128 bits ECDHE-RSA-AES128-SHA\n\
  Accepted SSLv3 128 bits AES128-SHA\nAccepted SSLv3 128 bits ECDHE-RSA-RC4-SHA\n\
  Accepted SSLv3 128 bits RC4-SHA\nAccepted SSLv3 128 bits RC4-MD5\nAccepted TLSv1\
  \ 256 bits ECDHE-RSA-AES256-SHA\nAccepted TLSv1 256 bits AES256-SHA\nAccepted TLSv1\
  \ 168 bits ECDHE-RSA-DES-CBC3-SHA\nAccepted TLSv1 168 bits DES-CBC3-SHA\nAccepted\
  \ TLSv1 128 bits ECDHE-RSA-AES128-SHA\nAccepted TLSv1 128 bits AES128-SHA\nAccepted\
  \ TLSv1 128 bits ECDHE-RSA-RC4-SHA\nAccepted TLSv1 128 bits RC4-SHA\nAccepted TLSv1\
  \ 128 bits RC4-MD5\n```\n\n可以将多个 `grep` 函数通过管道组合，以根据需要限制输出。通过使用多个 `grep` 请求，下例示例中的输出被限制为目标接受的\
  \ 256 位加密算法：\n\n```\nroot@KaliLinux:~# sslscan google.com | grep Accepted | grep\
  \ \"256 bits\"\nAccepted SSLv3 256 bits ECDHE-RSA-AES256-SHA\nAccepted SSLv3 256\
  \ bits AES256-SHA\nAccepted TLSv1 256 bits ECDHE-RSA-AES256-SHA\nAccepted TLSv1\
  \ 256 bits AES256-SHA\n```\n\n`SSLScan` 提供的一个独特功能是实现了 SMTP 中的 STARTTLS 请求。这允许 `SSLScan`\
  \ 通过使用 `--starttls` 参数并指定目标 地址和端口，轻松有效地测试邮件服务的传输层安全性。在下面的示例中，我们使用 `SSLScan` 来判断\
  \ Metasploitable2 集成的 SMTP 服务是否支持任何弱的 40 位加密算法：\n\n```\nroot@KaliLinux:~# sslscan\
  \ --starttls 172.16.36.135:25 | grep Accepted |\ngrep \"40 bits\"\nAccepted TLSv1\
  \ 40 bits EXP-EDH-RSA-DES-CBC-SHA\nAccepted TLSv1 40 bits EXP-ADH-DES-CBC-SHA\n\
  Accepted TLSv1 40 bits EXP-DES-CBC-SHA\nAccepted TLSv1 40 bits EXP-RC2-CBC-MD5\n\
  Accepted TLSv1 40 bits EXP-ADH-RC4-MD5\nAccepted TLSv1 40 bits EXP-RC4-MD5\n```\n\
  \n### 工作原理……\n\nSSL/TLS 会话通常通过客户端和服务器之间的协商来建立。这些协商会考虑双方配置的加密偏好，并尝试确定双方都支持的最安全的解决方案。`SSLScan`\
  \ 通过\n\n\n\n\n遍历已知的加密算法和密钥长度，并尝试使用每种配置与远程服务器协商会话。这使得 `SSLScan` 能够枚举出支持的加密算法和密钥。\n\
  \n# 使用 SSLyze 进行 SSL/TLS 扫描\n\nSSLyze 是 Kali Linux 中的一个集成命令行工具，用于评估远程 Web 服务对 SSL/TLS\
  \ 支持的安全性。在本教程中，我们将讨论如何针对 Web 应用运行 `SSLyze`，以及如何解释和/或处理输出结果。\n\n### 准备工作\n要使用 `SSLyze`\
  \ 对目标进行 SSL/TLS 分析，你需要一个运行着已启用 SSL 或 TLS Web 服务的远程系统。在提供的示例中，使用了 Google 和 `Metasploitable2`\
  \ 实例的组合来执行此任务。关于设置 `Metasploitable2` 的更多信息，请参阅本书第 1 章 **入门* 部分中的 **安装 Metasploitable2**\
  \ 教程。\n\n### 如何操作……\n另一个对目标服务进行彻底扫描并分析其 SSL/TLS 配置的工具是 `SSLyze`。要执行 `SSLyze` 中的大部分基础测试，参数应包含目标服务器和\
  \ `--regular` 参数。这包括对 SSLv2、SSLv3、TLSv1、重协商、恢复、证书信息、HTTP GET 响应状态码以及压缩支持的测试，如下：\n\
  \n```bash\nroot@KaliLinux:~# sslyze google.com --regular\n```\n\n**注册可用插件**\n-----------------------------\n\
  PluginSessionResumption\nPluginCertInfo\nPluginOpenSSLCipherSuites\nPluginSessionRenegotiation\n\
  PluginCompression\n\n检查主机可用性\n-----------------------------\ngoogle.com:443 => 74.125.226.166:443\n\
  \nGOOGLE.COM:443 - 74.125.226.166:443 的扫描结果\n----------------------------------------------------\n\
  *** 压缩：\n压缩支持：禁用 (Disabled)\n\n*** 证书：\n使用 Mozilla CA 存储库验证：证书受信任\n主机名验证：OK - 备用名称\n\
  匹配\nSHA1 指纹：\nEF8845009EED2B2FE95D23318C8CF30F1052B596\n通用名称：*.google.com\n颁发者：/C=US/O=Google\
  \ Inc/CN=Google\nInternet Authority G2\n序列号：5E0EFAF2A99854BD\n生效日期：2014 年 3 月 12\
  \ 日 09:53:40 GMT\n失效时间：2014 年 6 月 10 日 00:00:00 GMT\n签名算法：sha1WithRSAEncryption\n\
  密钥长度：2048\nX509v3 备用名称：DNS:*.google.com, DNS:*.\nandroid.com, DNS:*.appengine.google.com,\
  \ DNS:*.cloud.google.com, DNS:*.\ngoogle-analytics.com, DNS:*.google.ca, DNS:*.google.cl,\
  \ DNS:*.google.\nco.in, DNS:*.google.co.jp, DNS:*.google.co.uk, DNS:*.google.com.ar,\n\
  DNS:*.google.com.au, DNS:*.google.com.br, DNS:*.google.com.co, DNS:*.\ngoogle.com.mx,\
  \ DNS:*.google.com.tr, DNS:*.google.com.vn, DNS:*.google.\nde, DNS:*.google.es,\
  \ DNS:*.google.fr, DNS:*.google.hu, DNS:*.google.\nit, DNS:*.google.nl, DNS:*.google.pl,\
  \ DNS:*.google.pt, DNS:*.googleapis.\ncn, DNS:*.googlecommerce.com, DNS:*.googlevideo.com,\
  \ DNS:*.gstatic.com,\nDNS:*.gvt1.com, DNS:*.urchin.com, DNS:*.url.google.com, DNS:*.youtube-\n\
  nocookie.com, DNS:*.youtube.com, DNS:*.youtubeeducation.com, DNS:*.ytimg.\ncom,\
  \ DNS:android.com, DNS:g.co, DNS:goo.gl, DNS:google-analytics.com,\nDNS:google.com,\
  \ DNS:googlecommerce.com, DNS:urchin.com, DNS:youtu.be,\nDNS:youtube.com, DNS:youtubeeducation.com\n\
  **** {截断} ****\n\n或者，可以测试单个版本的 TLS 或 SSL 以枚举与该版本相关的加密算法。在下面的示例中，使用 `SSLyze` 枚举支持的\
  \ TLSv1.2 加密算法，然后使用 `grep` 仅提取 256 位的加密算法：\n\n```bash\nroot@KaliLinux:~# sslyze\
  \ google.com --tlsv1_2 | grep \"256 bits\"\nECDHE-RSA-AES256-SHA384 256 bits\nECDHE-RSA-AES256-SHA\
  \ 256 bits\nECDHE-RSA-AES256-GCM-SHA384256 bits\nAES256-SHA256 256 bits\nAES256-SHA\
  \ 256 bits\nAES256-GCM-SHA384 256 bits\n```\n\n`SSLyze` 支持的一个非常有帮助的特性是测试 Zlib 压缩。这种压缩如果被启用，将与一种名为“*压缩率信息泄露变得简单（CRIME）*”的信息泄露漏洞直接相关。可以使用\
  \ `--compression` 参数进行如下测试：\n\n```bash\nroot@KaliLinux:~# sslyze google.com --compression\n\
  ```\n\n检查主机可用性\n-----------------------------\ngoogle.com:443 => 173.194.43.40:443\n\
  GOOGLE.COM:443 - 173.194.43.40:443 的扫描结果\n---------------------------------------------------\n\
  *** 压缩：\n压缩支持：禁用 (Disabled)\n**** {截断} ****\n\n### 工作原理……\nSSL/TLS 会话通常通过客户端和服务器之间的协商建立。这些协商会考虑双方各自配置的加密算法偏好，并尝试确定双方都支持的最安全解决方案。`SSLyze`\
  \ 的工作是通过遍历已知加密算法和密钥长度列表，并尝试使用每种配置与远程服务器协商会话。这使得 `SSLyze` 能够枚举出支持的加密算法和密钥。\n\n# 使用\
  \ Burp Suite 定义 Web 应用目标\n在进行渗透测试时，确保攻击仅针对预期的系统是非常重要的。针对非预期目标进行的攻击可能会导致法律责任。为了尽地降低这种风险，在\
  \ `Burp Suite` 中定义你的范围至关重要。在本教程中，我们将讨论如何使用 `Burp Suite` 代理定义范围内的目标。\n\n### 准备工作\n\
  要使用 `Burp Suite` 对目标进行 Web 应用分析，你需要一个运行着一个或多个 Web 应用的远程系统。在提供的示例中，使用了 `Metasploitable2`\
  \ 实例执行此任务。`Metasploitable2` 在 TCP `80` 端口运行着几个预装的漏洞 Web 应用。关于设置 `Metasploitable2`\
  \ 的更多信息，请参阅本书第 1 章 **入门* 部分中的 **安装 Metasploitable2** 教程。此外，你的 Web 浏览器需要配置为通过本地 `Burp\
  \ Suite` 实例代理 Web 流量。关于如何通过 Burp Suite 配置浏览器的更多信息，请参阅本书第 1 章 **入门* 部分中的 **在 Kali\
  \ Linux 上配置 Burp Suite** 教程。\n\n### 如何操作……\n`Burp Suite` 界面最左侧的标签是 `Target`（目标）。该标签下方有两个标签，分别是\
  \ `Site Map`（站点地图）和 `Scope`（范围）。当通过代理浏览器访问内容时，`Site Map` 标签将自动填充。`Scope` 标签允许用户配置站点和站点内容将其包含或排除在范围之外。要向评估范围添加新站点，请点击\
  \ `Include in Scope`（包含在范围内）表格下的 `Add` 按钮。添加范围内的内容可以泛指 IP 地址范围，也可以具体到单个文件。`Protocol`\
  \ 选项提供下拉菜单，包含 `ANY`、`HTTP` 或 `HTTPS` 值。`Host or IP range` 字段可以包含单个主机名、单个 IP 或 IP\
  \ 地址范围。此外，还存在用于 `Port` 和 `File` 的文本字段。字段可以留空以限制范围的精确性。字段应使用正则表达式填充。在提供的示例中，脱字符符号\
  \ `^` 打开每个正则表达式的开头，美元符号 `$` 结束，而反斜杠 `\\` 用于转义 IP 地址中点的特殊含义。本书的内容未涵盖正则表达式的使用，但互联网上有许多公开资源可以解释其用法。一个可以帮助熟悉正则表达式的良好网页入门指南是\
  \ http://www.regular-expressions.info/。\n\n\n\n\n正则表达式在逻辑上定义了特定的主机、端口或文件可被视为在范围（scope）内的条件。在\
  \ Burp Suite 中定义评估范围会影响它与 Web 内容交互时的运行方式。Burp Suite 的配置将定义对于定义范围之内或之外的对象，可以执行和不能执行哪些操作。\n\
  \n370\n\n![](img/index-384_1.jpg)\n\n*第 7 章*\n\n# 使用 Burp Suite 爬虫 (Spider)\n\n\
  为了有效攻击 应用程序，意识到服务器上托管的所有 Web 内容至关重要。可以使用多种技术来发现 应用程序的完整攻击面。Spider 工具是一种可以快速识别目标网站网页中引用的链接内容的工具。在本教程中，我们将讨论如何使用\
  \ Burp Suite 对 Web 进行爬取，以识别在范围内的内容。\n\n### 准备工作\n\n要使用 Burp Suite 对目标进行 应用程序分析，你需要一个运行一个或多个\
  \ 应用程序的远程系统。在提供的示例中，使用了一个 `Metasploitable2` 实例来执行此任务。`Metasploitable2` 具有多个运行在 `TCP\
  \ port 80` 上的预装漏洞 应用程序。有关设置 `Metasploitable2` 的更多信息，请参考此书第 1 章“入门指南”中的 `Installing\
  \ Metasploitable2` 教程。此外，你的 Web 浏览器需要配置为通过本地 Burp Suite 实例代理 Web 流量。有关如何使用 Burp\
  \ Suite 配置浏览器的更多信息，请参考此书第 1 章“入门指南”中的 `Configuring Burp Suite on Kali Linux` 教程。\n\
  \n### 如何操作…\n\n要开始自动爬取你之前定义的范围内的 Web 内容，请点击屏幕顶部的 `Spider` 标签页。在下方有两个额外的标签页，包含 `Control`\
  \ 和 `Options`。`Options` 标签页允许用户定义执行爬取方式的配置。这包括详细设置、深度、节流、表单提交等。考虑自动爬虫的配置是非常重要的，因为它将向所有在范围内的\
  \ Web 内容发送请求。这可能会对某些 Web 内容产生干扰甚至造成破坏。一旦配置完成，可以选择 `Control` 标签页来开始自动爬取。默认情况下，`Spider`\
  \ 标签页是暂停的。通过点击指示此类状态的按钮可以启动爬虫。`Target` 标签页下的 `Site Map` 标签页将随着爬虫的进展自动更新。请查看以下截图：\n\
  \n371\n\n![](img/index-385_1.jpg)\n\n![](img/index-385_2.jpg)\n\n*Web 应用程序扫描*\n\n\
  根据定义的配置，Burp Suite 可能会要求对爬取过程中遇到的任何表单进行交互。为识别出的任何表单输入参数，或通过选择 `Ignore Form` 按钮跳过表单，如下截图所示：\n\
  \n或者，你也可以通过在 `Site Map` 标签页中右键点击任何特定位置，然后点击 `Spider` 来从该位置开始爬取。这将递归地爬取所选对象以及包含其中的任何文件或目录。请查看以下截图：\n\
  \n## 工作原理…\n\nBurp Suite Spider 工具通过解析所有已知的 HTML 内容并提取指向 Web 上其他内容的链接来工作。然后对链接内容进行分析，以发现其中包含的链接内容。此过程将无限持续，仅限于内容本身。\n\
  \n372\n\n![](img/index-386_1.jpg)\n\n*第 7 章*\n\n# 使用 Burp Suite 工具\n\nBurp Suite\
  \ 还有许多可以用于信息收集和分析的工具。这些工具被称为渗透测试工具（engagement tools）。在本教程中，我们将讨论如何使用 Burp Suite。\n\
  \n### 准备工作\n\n要使用 Burp Suite 对目标进行 应用程序分析，你需要一个运行一个或多个 Web 应用程序的远程系统。在提供的示例中，使用了一个\
  \ `Metasploitable2` 实例来执行此任务。`Metasploitable2` 具有多个运行在 `TCP port 80` 上的预装漏洞 应用程序。有关设置\
  \ `Metasploitable2` 的更多信息，请参考此书第 1 章“入门指南”中的 `Installing Metasploitable2` 教程。此外，你的\
  \ Web 浏览器需要配置为通过本地 Burp Suite 实例代理 Web 流量。有关如何使用 Burp Suite 配置浏览器的更多信息，请参考此书第 1\
  \ 章“入门指南”中的 `Configuring Burp Suite on Kali Linux` 教程。\n\n### 如何操作…\n\n通过右键点击 `Site\
  \ Map` 标签页中的任何对象并向下滚动到扩展菜单，可以访问渗透测试工具。默认情况下，选中的工具将以此为目标。请考虑以下截图：\n\n373\n\n*Web\
  \ 应用程序扫描*\n\n我们将按照呈现的顺序处理每个渗透测试工具。为了方便起见，我认为通过以下要点介绍这些工具最好：\n\n- **Search (搜索)**：此工具可用于搜索术语、短语或正则表达式。它将返回任何包含查询词的\
  \ HTTP 请求或响应。对于返回的每个条目，查询词将在请求或响应中高亮显示。\n- **Find comments (查找注释)**：此工具搜索整个 Web\
  \ 内容中所有的 JavaScript、HTML 和其他源代码，并定位所有注释。这些注释也可以导出以备日后审查。这在某些时候特别有用，因为某些开发者经常会在他们编写的注释中留下敏感信息。\n\
  - **Find scripts (查找脚本)**：此工具将识别 Web 内容中的所有客户端和服务器端脚本。\n- **Find references (查找引用)**：此工具将解析所有\
  \ HTML 内容并识别其他引用的内容。\n- **Analyze target (分析目标)**：此工具将识别指定 Web 内容中的所有动态内容、静态内容和参数。对于具有大量参数和动态内容的\
  \ 应用程序进行组织测试特别有用。\n- **Discover content (发现内容)**：此工具可以通过循环遍历字典列表和定义的扩展扩展名来暴力破解目录和文件名。\n\
  - **Schedule task (调度任务)**：此工具允许用户定义启动和停止 Burp Suite 中各种任务的时间和日期。\n- **Simulate\
  \ manual testing (模拟手动测试)**：此工具提供了一种极佳的方式，让你看起来正在对 应用程序进行手动分析，而实际上你去喝咖啡吃甜甜圈了。除了欺骗老板，此工具完全没有任何实际功能。\n\
  \n## 工作原理…\n\nBurp Suite 渗透测试工具以多种不同的方式工作，取决于所使用的工具。许多渗透测试工具执行搜索功能并检查已收到的响应。Discover\
  \ content 工具通过暴力破解文件和目录名提供了发现新 Web 内容的功能。\n\n\n\n\n要使用 `Burp Suite` 对目标进行 Web 应用程序分析，你需要一个运行着一个或多个\
  \ Web 应用程序的远程系统。在提供的示例中，使用了 `Metasploitable2` 实例来执行此任务。`Metasploitable2` 在 `TCP`\
  \ 端口 `80` 上运行着几个预装的带有漏洞的 Web 应用程序。有关设置 `Metasploitable2` 的更多信息，请参阅本书第 `1` 章 `入门`\
  \ 中的 `Installing Metasploitable2` 章节。此外，你的 Web 浏览器需要配置为将 Web 流量通过本地 `Burp Suite`\
  \ 实例进行代理。有关如何使用 `Burp Suite` 配置浏览器的更多信息，请参阅本书第 `1` 章 `入门` 中的 `Configuring Burp Suite\
  \ on Kali Linux` 章节。\n\n### 如何操作…\n\n`Burp Suite Proxy` 功能可以在被动或拦截模式下使用。如果禁用了拦截，所有请求和响应将仅记录在\
  \ `HTTP history` 选项卡中。可以通过导航这些项，并从列表中选择任何请求/响应来查看详细信息，如下所示：\n\n375\n![](img/index-389_1.jpg)\n\
  \n#### Web 应用程序扫描\n\n或者，可以点击 `Intercept` 按钮捕获发往服务器的流量。这些请求可以在 `Proxy` 选项卡中进行处理，然后转发到目标或丢。通过选择\
  \ `Options` 选项卡，可以重新配置拦截代理以定义拦截的请求类型，或者在响应于浏览器渲染之前进行拦截，如下所示：\n\n#### 工作原理\n\n`Burp\
  \ Suite Proxy` 通过拦截或被动记录浏览器与任何远程设备之间的流量工作，因为它逻辑上位于两者之间。浏览器被配置为将所有请求发送到 `Burp proxy`，然后将其转发到任何外部主机。由于此配置，`Burp`\
  \ 可以捕获路径上的请求和响应，或者记录来自客户端的所有通信。\n\n### 使用 Burp Suite Web 扫描器\n\n`Burp Suite` 还可以作为有效的\
  \ Web 应用程序扫描器。此功能可用于被动分析和主动扫描。在本章节中，我们将讨论如何使用 `Burp Suite scanner` 执行被动和主动扫描。\n\n\
  ### 准备工作\n\n要使用 `Burp Suite` 对目标进行 Web 应用程序分析，你需要一个运行着一个或多个 Web 应用程序的远程系统。在提供的示例中，使用了\
  \ `Metasploitable2` 实例来执行此任务。`Metasploitable2` 在 `TCP` 端口 `80` 上运行着几个预装的带有漏洞的 Web\
  \ 应用程序。有关设置 `Metasploitable2` 的更多信息，请参阅本书第 `1` 章 `入门` 中的 `Installing Metasploitable2`\
  \ 章节。\n\n376\n![](img/index-390_1.jpg)\n![](img/index-390_2.jpg)\n\n*第 7 章*\n\n\
  此外，你的 Web 浏览器需要配置为将 Web 流量通过本地 `Burp Suite` 实例进行代理。有关如何使用 `Burp Suite` 配置器的更多信息，请参阅本书第\
  \ `1` 章 `入门` 中的 `Configuring Burp Suite on Kali Linux` 章节。\n\n### 如何操作…\n\n默认情况下，当连接到代理时，`Burp\
  \ Suite` 将被动扫描浏览器访问的所有范围内的内容。“被动扫描”一词是指 `Burp Suite` 被动观察发往和来自服务器的请求和响应，并检查这些内容是否存在漏洞证据。被动扫描不涉及注入任何探测或其他尝试来确认漏洞。请查看下面的截图：\n\
  \n主动扫描可以通过右键点击站点中的任何对象或 `proxy HTTP history` 中的任何请求，并分别选择 `Actively scan this branch`\
  \ 或 `Do an active scan` 来执行，如下所示：\n\n377\n![](img/index-391_1.jpg)\n\n*Web 应用程序扫描*\n\
  \n可以通过 `Scanner` 下的 `Scan queue` 选项卡查看所有主动扫描的结果。通过双击任何扫描条目，你可以查看与该扫描相关的发现，如下所示：\n\
  \n可以通过选择 `Options` 选项卡处理主动扫描配置。在这里，你可以定义执行的测试类型、执行速度以及这些测试的彻底程度。\n\n#### 工作原理…\n\
  \n`Burp Suite` 的被动扫描仅通过评估浏览器与其通信的任何远程服务器之间的流量工作。这对于识别某些显而易见的漏洞有用，但不足以验证如今 Web 服务器上许多更严重的漏洞。主动扫描通过向请求中识别出的参数发送一系列探测来工作。这些探测可以识别许多常见的\
  \ Web 应用程序漏洞，如目录遍历、跨站脚本和 SQL 注入。\n\n### 使用 Burp Suite Intruder\n\n`Burp Suite` 中的另一个非常有用的工具是\
  \ `Intruder` 功能。此功能允许通过在请求中处理定义的负载位置的同时提交大量请求来执行快速攻击。在本章节中，我们将讨论如何使用 `Burp Suite\
  \ Intruder` 自动处理请求内容。\n\n### 准备工作\n\n要使用 `Burp Suite` 对目标进行 Web 应用程序分析，你需要一个运行着一个或多个\
  \ Web 应用程序的远程系统。在提供的示例中，使用了 `Metasploitable2` 实例来执行此任务。`Metasploitable2` 在 `TCP`\
  \ 端口 `80` 上运行着几个预装的带有漏洞的 Web 应用程序。有关设置 `Metasploitable2` 的更多信息，请参阅本书第 `1` 章 `入门`\
  \ 中的 `Installing Metasploitable2` 章节。此外，你的 Web 浏览器需要配置为将 Web 流量通过本地 `Burp Suite`\
  \ 实例进行代理。有关如何使用 `Burp Suite` 配置浏览器的更多信息，请参阅本书第 `1` 章 `入门` 中的 `Configuring Burp Suite\
  \ on Kali Linux` 章节。\n\n378\n![](img/index-392_1.jpg)\n![](img/index-392_2.jpg)\n\
  \n*第 7 章*\n\n### 如何操作…\n\n要使用 `Burp Suite Intruder`，需要从拦截的路径捕获或代理历史记录将请求发送到它。对于其中任一请求，右键点击请求，然后选择\
  \ `Send to Intruder`，如下所示：\n\n在提供的示例中，在 `DVWA` 的 `Brute Force` 应用程序登录门户输入了用户名和密码。发送到\
  \ `Intruder` 后，可以通过 `Positions` 选项卡设置负载。要尝试破解管理员账户，唯一需要设置负载位置的是 `password` 参数的值，如下所示：\n\
  \n379\n![](img/index-393_1.jpg)\n![](img/index-393_2.jpg)\n\n*Web 应用程序扫描*\n\n\n\n\
  一旦完全配置攻击，你可以点击屏幕顶部的 `Intuder` 菜单，然后点击 `start attack`。这将通过将列表中的每个值替换到有效负载（payload）位置，来快速提交一系列请求。通常可以通过响应的差异来识别成功的尝试。要确定是否存在任何一个请求生成了截然不同的响应，可以按长度对结果进行排序。这可以通过点击\
  \ `Length` 表头来实现。通过按长度对表格进行降序排序，我们可以识别出其中一个特定的响应比其他响应都长。这个响应就是与正确密码（恰好是 `password`）相关的响应。下方的截图所示。这一成功的登录尝试在接下来的讨论使用\
  \ `Comparer` 的配方中得到了进一步确认。\n\n### 工作原理……\n\nBurp Suite `Intuder` 的工作原理是自动处理有效负载的操控。它允许用户在请求中指定一个或多个有效负载位置，然后提供大量的选项，用于配置提供给这些有效负载位置的值在每次迭代之间如何变化。\n\
  \n380\n\n![](img/index-394_1.jpg)\n\n*第 7 章*\n\n## 使用 Burp Suite Comparer\n\n在进行\
  \ Web 应用程序评估时，能够轻松识别 HTTP 请求或响应的差异通常是非常重要的。`Comparer` 功能通过提供差异的图形化概述来简化这一过程。在本文配方中，我们将讨论如何使用\
  \ Burp Suite `Comparer` 来识别和评估不同的服务器响应。\n\n### 准备工作\n\n要使用 Burp Suite 对目标进行 Web\
  \ 应用程序分析，你需要一个运行一个或多个 Web 应用程序的远程系统。在提供的示例中，使用一个 `Metasploitable2` 实例来执行此任务。`Metasploitable2`\
  \ 有多个预装在 TCP 端口 80 上的漏洞 Web 应用程序。关于设置 Metasploitable2 的更多信息，请参阅本书第 1 章 `Getting\
  \ Started` 中的 `Installing Metasploitable2` 配方。此外，你的 Web 浏览器需要配置为通过本地 Burp Suite\
  \ 实例代理 Web 流量。关于如何通过 Burp Suite 配置浏览的更多信息，请参阅本书第 1 章 `Getting Started` 中的 `Configuring\
  \ Burp Suite on Kali Linux` 配方。\n\n### 如何操作……\n\n任何与原本一致的响应相比的异常异常都值得调查。响应的差异通常是有效负载产生了某些预期结果的可靠指示。在之前使用\
  \ Burp Suite `Intuder` 对 `DVWA` 登录进行暴力破解的演示中，有一个特定的有效负载生成的响应比所有其他响应都长。\n\n要评估响应的差异，右键点击该事件，然后点击\
  \ `Send to Comparer (response)`，如下方的所示。对其中一个控制示例也执行相同的操作。\n\n381\n\n![](img/index-395_1.jpg)\n\
  \n![](img/index-395_2.jpg)\n\n*Web 应用程序扫描*\n\n将每个事件发送到 `Comparer` 后，你可以通过选择屏幕顶部的\
  \ `Comparer` 标签来对其进行评估。确保为 `item 1` 选择了之前的响应之一，为 `item 2` 选择了另一个，如下方的所示：\n\n在屏幕底部，有一个选项可以选择\
  \ `compare words`比较单词）或 `compare bytes`比较字节）。在这种情况下，我们选择 `compare words`。通过这样做，我们可以看到响应之间的差异被高亮显示。这有助于识别出哪个响应包含了所需的数据。\n\
  \n### 工作原理……\n\nBurp Suite `Comparer` 的工作原理是分析响应之间的差异。它允许用户比较两个或多个响应，并高亮显示不同的区域。这对于识别不同有效负载对服务器响应的影响特别有用。\n\
  \n## 使用 Burp Suite Repeater\n\n在进行 Web 应用程序评估时，能够轻松识别 HTTP 请求或响应的差异通常是非常重要的。`Repeater`\
  \ 功能通过允许用户单独修改并重新发送请求来简化这一过程。在配方中，我们将讨论如何使用 Burp Suite Repeater。\n\n382\n\n![](img/index-396_1.jpg)\n\
  \n![](img/index-396_2.jpg)\n\n*第 7 章*\n\n### 准备工作\n\n要使用 Burp Suite 对目标进行 Web 应用程序分析，你需要一个运行一个或多个\
  \ Web 应用程序的远程系统。在提供的示例中，使用一个 `Metasploitable2` 实例来执行此任务。`Metasploitable2` 有多个预装在\
  \ TCP 端口 80 上的漏洞 Web 应用程序。关于设置 Metasploitable2 的更多信息，请参阅本书第 1 章 `Getting Started`\
  \ 中的 `Installing Metasploitable2` 配方。此外，你的 Web 浏览器需要配置为通过本地 Burp Suite 实例代理 Web\
  \ 流量。关于如何通过 Burp Suite 配置浏览的更多信息，请参阅本书第 1 章 `Getting Started` 中的 `Configuring Burp\
  \ Suite on Kali Linux` 配方。\n\n### 如何操作……\n\n要使用 Burp Suite Repeater，需要通过拦截捕（intercept）或代理历史（proxy\
  \ history）向其发送一个请求。通过其中任一方式，右键点击请求，然后选择 `Send to Repeater`，如下方的所示：在提供的示例中，请求要求用户提供一个名称，服务器在\
  \ HTML 响应中返回提供的输入。为了测试跨站脚本（XSS）的可能性，我们应该首先在此类攻击中注入一系列常用的字符，如下方的所示：\n\n383\n\n![](img/index-397_1.jpg)\n\
  \n![](img/index-397_2.jpg)\n\n![](img/index-397_3.jpg)\n\n*Web 应用程序扫描*\n\n在发送该系列字符后，我们可以看到所有字符都返回在\
  \ HTML 内容中，且没有任何字符被转义。这强烈表明该函数容易受到跨站脚本攻击。为了测试该漏洞的可利用性，我们可以输入标准的令牌请求 `<script>alert('xss')</script>`，如下方的所示：\n\
  \n通过查看返回的 HTML 内容，我们可以看到被标记的起始脚本已从响应中移除。这很可能是黑名单的指示，禁止在输入中使用 `<script>` 标签。黑名单的问题在于，通常可以通过微调输入来绕过它。在这种情况下，我们可以尝试通过修改起始标签中几个字符的大小写来绕过黑名单，如下方的所示：\n\
  \n通过使用起始标签 `<ScRiPt>`，我们可以看到实施的限制已被绕过，且起始和结束标签都包含在响应中。这可以通过在浏览器中发出请求来确认，如下方的所示：384\n\
  \n![](img/index-398_1.jpg)\n\n![](img/index-398_2.jpg)\n\n*第 7 章*\n\n\n\n\n要在客户端浏览器中评估响应，请右键点击该请求，然后在浏览器中选择\
  \ `Request`。这将生成一个 URL，该 URL 可用于在连接到 Burp 代理的浏览器中重新发送该请求，如下截图所示：我们可以手动复制提供的 URL，也可以点击\
  \ `Copy` 按钮。然后将此 URL 粘贴到浏览器中，请求将在浏览器中发出。假设跨站脚本攻击成功，客户端 JavaScript 代码将在浏览器中渲染，屏幕上将弹出一个警框，如下截图所示：\n\
  \n### 工作原理……\n\nBurp Suite Repeater 的工作原理是为 Web 提供一个基于文本的界面。Repeater 允许用户通过直接操作请求与远程\
  \ Web 服务进行交互，而不是通过 Web 浏览器。在测试某些实际 HTML 输出比在浏览器中的渲染方式更重要的用例时，这非常有用。\n\n385\n\n![](img/index-399_1.jpg)\n\
  \n*Web Application Scanning*\n\n### 使用 Burp Suite Decoder\n\n在处理 Web 应用流量时，你经常会注意到为了混淆或功能原因而编码的内容。Burp\
  \ Suite Decoder 允许根据对请求和响应内容进行解码或编码。在本教程中，我们将讨论如何使用 Burp Suite Decoder 对内容进行编解码。\n\
  \n### 准备工作\n\n要使用 Burp Suite 对目标进行 Web 应用分析，你需要一个运行一个或多个 Web 应用的远程系统。在提供的示例中，使用\
  \ `Metasploitable2` 实例来执行此任务。`Metasploitable2` 在 TCP 端口 80 上运行着几个预装的易漏洞 Web 应用。有关设置\
  \ `Metasploitable2` 的更多信息，请参阅本书第 1 章 *Getting Started*get 中的 *Installing Metasploitable2*\
