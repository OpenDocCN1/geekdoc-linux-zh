  \ 破解\n424\n\n### 使用创建管理员账户进行多线程 `MSF` 破解\n426\n\n# 前言\n在过去的几十年里，黑客攻击和网络犯罪的面貌发生了巨大的变化。在\
  \ 20 世纪末，很多人不知道什么是网络犯罪。那些人认为黑客是躲在昏暗地下室里、用二进制语言说话的邪恶数学天才。但直到最近，我们看到了一类全新黑客的兴起。由于黑客软件和工具的公开，新时代的黑客可能就是你的邻居、当地的加油站服务员，甚至是你\
  \ 12 岁的孩子。诸如低轨道离子炮（`LOIC`）之类的脚本小子工具已被用于对大型公司和组织发起大规模分布式拒绝服务（DDoS）攻击。这个免费的 Windows\
  \ 下载程序只需要求输入目标 URL，其图形界面与太空时代的视频游戏惊地相似。\n\n在一个黑客攻击变得如此简单、以至于小孩子都能做的世界里，组织通过使用网络犯罪分子攻击他们时相同的工具测试自己的网络来验证自身的防护水平是至关重要的。但是，仅仅掌握这些工具的基本用法不足以成为一名有效的信息安全专业人员。信息安全专业人员必须理解这些工具所采用的技术，以及为什么这些技术能够利用网络或系统中的各种漏洞。了解解释这些常用攻击工具工作原理的基础底层原理，使人能够有效地使用它们，但更重要的是，这也有助于人们有效地识别并防御此类攻击。\n\
  \n本书的意图是列举并解释 `Kali Linux` 平台中常用攻击工具的使用，但更重要的是，本书还旨在解决定义这些工具为何有效的底层原理。除了介绍集成到 `Kali\
  \ Linux` 中的高功能工具外，我们还将创建大量的 `Python` 和 `bash` 脚本，这些脚本可以用于执行类似的功能和/或简化现有工具流程。\n\n\
  最终，本书的意图是通过通过地理解对手，帮助培养出更强大的安全专业人员。\n\n## 前言：本书内容\n\n`第 1 章` `入门` 介绍了全书其余部分将使用的底层原理和概念。\n\
  \n`第 2 章` `发现扫描` 涵盖了用于识别目标网络上的活动系统的技术和扫描工具，通过执行二层、三层和四层发现来实现。\n\n`第 3 章` `端口扫描`\
  \ 包含了用于枚举目标系统上运行的 UDP 和 TCP 服务的技术和扫描工具。\n\n`第 4 章` `指纹识别` 解释了用于识别目标系统运行的操作系统和服务的技术和扫描工具。\n\
  \n`第 5 章` `漏洞扫描` 涵盖了用于识别和枚举目标系统上潜在漏洞的技术和扫描工具。\n\n`第 6 章` `拒绝服务` 介绍了用于利用目标系统上识别出的拒绝服务漏洞的技术和攻击工具。\n\
  \n\n\n\n\n# 第 7 章：Web 应用程序扫描\n提供了用于识别和利用目标系统上 Web 应用程序漏洞的技术和工具。\n\n# 第 8 章：Kali\
  \ 工具自动化\n介绍了脚本技术，这些技术可用于简化和自动化 Kali Linux 中现有工具的使用。\n\n## 阅读此书所需的准备\n\n为了完成书中提到的练习或进行更深入的探索，你将需要以下组件：\n\
  \n- 一台配置充足的单个人电脑（Mac、Windows 或 Linux），其资源需要足够，并可以在多个虚拟机之间共享。你至少应该拥有 2 GB 内存。为了获得最佳性能，建议使用\
  \ 8 到 16 GB 内存的系统。还建议使用多处理器和/或多核心。\n- 如果你在资源有限的系统上运行，请尝试在完成练习时尽量减少同时运行的虚拟机数量。\n\
  - 一个虚拟化软件，用于运行你的安全实验室环境。一些可用选项包括：\n    - VMware Fusion (Mac OS X)\n    - VMware\
  \ Player (Windows)\n    - Oracle VirtualBox (Windows, Mac OS X, 或 Linux)\n- 多个要在安全实验室环境中运行的操作系统。每个操作系统的获取和安装都将在`第\
  \ 1 章，入门指南`中详细讨论。需要的操作系统包括：\n    - Kali Linux\n    - Metasploitable2\n    - 一个 Ubuntu\
  \ 服务器\n    - Windows OS（建议使用 Windows XP SP2）\n\n## 本书适用读者\n\n本书适用于以下用户：\n- 信息技术专业人士\n\
  - 信息安全专业人士\n- 业余安全或技术爱好者\n\n本书假设读者对渗透测试、Linux、脚本和 TCP/IP 网络了解很少或完全没有。书中的每个章节在讨论应用这些技术之前，都会先介绍底层原理。\n\
  \n## 惯例\n\n在书中，你会发现多种风格的文本，以区分不同类型的信息。以下是这些风格的示例及其含义。\n\n文本中的代码单词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚位\
  \ URL、用户输入和 Twitter 句柄显示如下：\n“可以使用 `ls` 命令来查看当前目录的内容。”\n\n代码块设置如下：\n```python\n\
  #! /usr/bin/python\nname = raw_input(\"What is your name?\\n\")\nprint \"Hello \"\
  \ + name\n```\n\n任何命令行输入或输出如下所示：\n```bash\n# root@KaliLinux:~# ./test.py\nWhat is\
  \ your name?\nJustin\nHello Justin\n```\n\n新术语和重要词汇将加粗显示。你在屏幕上、菜单或对话框中看到的单词将以这种形式出现在文中：“一旦你打开了\
  \ VMware Player，就可以选择‘新建虚拟机’来开始。”\n\n警告或重要注释将以此类框的形式出现。提示和技巧如下所示。\n\n## 读者反馈\n\n\
