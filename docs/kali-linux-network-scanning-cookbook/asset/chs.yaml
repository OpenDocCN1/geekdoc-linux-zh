  \ 100021 v1 UDP(34241), 100021 v3 UDP(34241), 100021 v4 UDP(34241), 100003 v2 TCP(2049),\
  \ 100003 v3 TCP(2049), 100003 v4 TCP(2049), 100021 v1 TCP(50333), 100021 v3 TCP(50333),\
  \ 100021 v4 TCP(50333), 100005 v1 UDP(47083), 100005 v1 TCP(57385), 100005 v2 UDP(47083),\
  \ 100005 v2 TCP(57385), 100005 v3 UDP(47083), 100005 v3 TCP(57385))\n[*] 在 172.16.36.135:137\
