  \n\n# POST 方法请求参数\n\n### 准备工作\n\n要使用 `sqlmap` 对目标执行 SQL 注入，你需要一个运行一个或多个易受 SQL 注入漏洞\
  \ Web 应用的远程系统。在提供的示例中，使用了 `Metasploitable2` 实例来执行此任务。`Metasploitable2` 在 TCP 端口\
