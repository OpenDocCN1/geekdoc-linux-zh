  ### 问题\n如果你在书的任何方面遇到问题，可以通过 `questions@packtpub.com` 联系我们。\n\n# 第 1 章：入门指南\n\n第一章涵盖设置和配置虚拟安全实验室的基础知识，该实验室可用于练习书中提到的大部分场景和练习。\n\
  \n本章涵盖的主题包括虚拟化软件的安装、在虚拟环境中安装各种系统，以及练习将使用的某些工具的配置。本章将涵盖以下配方：\n- 使用 VMware Player\
  \ (Windows) 配置安全实验室\n- 使用 VMware Fusion (Mac OS X) 配置安全实验室\n- 安装 Ubuntu Server\n\
  - 安装 Metasploitable2\n- 安装 Windows Server\n- 增加 Windows 攻击面\n- 安装 Kali Linux\n-\
  \ 配置和使用 SSH\n- 在 Kali Linux 上安装 Nessus\n- 在 Kali Linux 上配置 Burp Suite\n- 使用文本编辑器（VIM\
  \ 和 Nano）\n\n## 使用 VMware Player (Windows) 配置安全实验室\n\n你可以通过在 Windows 工作站上安装 VMware\
  \ Player，在可用资源相对较少的 Windows PC 上运行虚拟安全实验室。你可以免费获取 VMware Player，或者以低价获取功能更强大的替代品\
  \ VMware Player Plus。\n\n### 准备工作\n要在你的 Windows 工作站上安装 VMware Player，你首先需要下载该软件。免费版\
  \ VMware Player 的下载地址可以在 `https://my.vmware.com/web/vmware/free` 找到。从该页面向下滚动到 VMware\
  \ Player 链接并点击下载。在下一个页面上，选择 Windows 32 位或 64 位安装包，然后点击下载。也有适用于 Linux 32 位和 64 位系统的安装包可用。\n\
  \n### 如何操作……\n一旦下载了软件包，你应该应该在默认下载目录中找到它。双击该目录中的可执行文件以开始安装过程。一旦启动，只需按照屏幕上的指示即可完成安装。\n\
  \n\n\n\n\n安装完成后，你应该可以通过访问桌面图标、快速启动图标或在“所有程序”中浏览来启动 VMware Player。加载后，你将看到虚拟机库。此库此时不会包含任何虚拟机，但当你从屏幕左侧创建它们时，它们就会填充在其中，如下截图所示：\n\
  \n8\n\n![](img/index-22_1.jpg)\n![](img/index-22_2.jpg)\n\n# 第 1 章\n\n一旦打开 VMware\
  \ Player，你就可以选择`Create a New Virtual Machine`（创建虚拟机）来开始。这将初始化一个非常易用的虚拟机安装向导：\n\n\
  你在安装向导中需要执行的第一项任务是定义安装介质。你可以选择直接从宿主机的光驱器安装，也可以使用 ISO 镜像文件。本节讨论的大部分安装都将使用 ISO 文件，获取这些文件的地方将在每个具体的配方中提到。现在，假设我们已经浏览到一个现有的\
  \ ISO 文件并点击了`Next`（下一步），如下截图所示：\n\n9\n\n![](img/index-23_1.jpg)\n![](img/index-23_2.jpg)\n\
  \n## 入门\n\n接下来，你需要为虚拟机分配一个名称。虚拟机名称仅仅是一个任意值，作为标签来识别并将其与库中的其他虚拟机区分来。由于安全实验室通常根据多种不同的操作系统进行分类，因此将操作系统作为虚拟机名称的一部分可能会很有。下面的截图显示了`Specify\
  \ Disk Capacity`（指定磁盘容量）窗口：\n\n下一个屏幕请求输入安装的最大大小值。虚拟机将仅根据需要消耗硬盘空间，但不会超过此处指定的值。\n\n\
  此外，你还可以定义虚拟机是包含在单个文件中，还是分布在多个文件中。一旦你指定了磁盘容量，你就会得到下面的截图：\n\n10\n\n![](img/index-24_1.jpg)\n\
  \n# 第 1 章\n\n最后一步提供了配置的摘要。你可以选择`Finish`（完成）按钮来完成虚拟机的创建，或者选择`Customize Hardware…`（自定义硬件…）按钮来操作更高级的配置。请查看以下截图以了解高级配置：\n\
  \n11\n\n![](img/index-25_1.jpg)\n\n## 入门\n\n高级配置设置让你对共享资源、虚拟硬件配置和网络进行完全控制。绝大多数默认配置对于你的安全实验室来说已经足够了，但如果以后需要更改，可以通过访问虚拟机设置来重新调整这些配置。当你完成高级配置设置后，你会得到下面的截图：\n\
  \n安装向导完成后，你应该会在虚拟机库中看到列出的新虚拟机。从这里，现在可以通过点击播放按钮启动它。\n\n通过打开多个 VMware Player 实例并在每个实例中运行一个唯一的虚拟机，可以同时运行多个虚拟机。\n\
  \n### 工作原理……\n\nVMware 创建了一个虚拟化环境，在该环境中，单个宿主系统的资源可以共享以创建一个整个网络环境。像 VMware 这样的虚拟化软件已让为个人独立学习构建安全实验室变得更加容易且廉价了。\n\
  \n12\n\n![](img/index-26_1.jpg)\n\n# 第 1 章\n\n## 使用 VMware Fusion 配置安全实验室 (Mac OS\
  \ X)\n\n你也可以通过在 Mac 上安装 VMware Fusion 在 Mac OS X 上相对轻松地运行虚拟安全实验室。VMware Fusion 确实需要购买许可证，但它的价格非常合理。\n\
  \n### 准备工作\n\n要在 Mac 上安装 VMware Player，你首先需要下载该软件。要下载免费试用版或购买软件，请访问以下 URL：`https://www.vmware.com/products/fusion/`。\n\
  \n### 如何操作……\n\n软件包下载完成后，你应该在默认下载目录中找到它。运行 `.dmg` 安装文件，然后按照屏幕上的指示进行安装。安装完成后，你可以从\
  \ Dock 栏或 Finder 中的“应用程序”目录启动 VMware Fusion。加载后，你将看到虚拟机库。此库此时不会包含任何虚拟机，但当你从屏幕左侧创建它们时，它们就会填充在其中。下面的截图显示了虚拟机库：\n\
  \n13\n\n![](img/index-27_1.jpg)\n\n## 入门\n\n要开始，点击屏幕左角的`Add`（添加）按钮，然后点击`New`（新建）。这将启动虚拟机安装向导。安装向导是一个简单的引导过程，用于设置你的虚拟机，如下截图所示：第一步要求你选择安装方法。VMware\
  \ Fusion 提供了从磁盘或镜像（ISO 文件）安装的选项，或者提供了将现有系统迁移到新虚拟机的技术。对于本节讨论的所有虚拟机，你将选择第一个选项。\n\n\
  在选择第一个选项`Install from disc or image`（从磁盘或镜像安装）后，系统将提示选择要使用的安装磁盘或镜像。如果没有自动填充，或者自动填充的不是你想要安装的镜像，请点击`Use\
  \ another disc or disc image`（使用其他磁盘或磁盘镜像）按钮。这将打开 Finder，允许你浏览并选择使用的镜像。获取特定系统镜像文件的地方将在本节后续的配方中讨论。最后，我们进入了`Finish`（完成）窗口：14\n\
  \n![](img/index-28_1.jpg)\n![](img/index-28_2.jpg)\n\n# 第 1 章\n\n选择好要使用的镜像文件后，点击`Continue`（继续）按钮，将进入摘要屏幕。这将提供你所选配置的概述。如果你想更改这些设置，点击`Customize\
  \ Settings`（自定义设置）按钮。否则，点击`Finish`（完成）按钮创建虚拟机。当你点击它时，会被要求保存与虚拟机关联的文件。你用于保存的名称将是虚拟机的名称，并显示在你的虚拟机库中，如下截图所示：\n\
  \n15\n\n## 入门\n\n随着你添加更多虚拟机，你会在左侧的虚拟机库中看到它们。通过选择任何虚拟机，可以通过顶部的`Start Up`（启动）按钮启动它。此外，你可以使用`Settings`（设置）按钮修改配置，或使用`Snapshots`（快照）按钮在不同时刻保存虚拟机。你可以通过从库中独立启动每个虚拟机来同时运行多个虚拟机。\n\
  \n### 工作原理……\n\n通过在 Mac OS X 操作系统中使用 VMware Fusion，你可以创建一个虚拟化实验室环境，在 Apple 宿主机上创建一个整个网络环境。像\
  \ VMware 这样的虚拟化软件已让为个人独立学习构建安全实验室变得更加容易且廉价了。\n\n## 安装 Ubuntu Server\n\nUbuntu Server\
  \ 是一个易用的 Linux 发行版，可用于在安全实验室托管网络服务和/或测试漏洞软件。如果你有，，可以使用其他 Linux 发行版；然而，Ubuntu 是初学者的良好选择，因为有很多公开的参考资料和资源。\n\
  \n### 准备工作\n\n在 VMware 中安装 Ubuntu Server 之前，你需要下载镜像磁盘（ISO 文件）。该文件可以通过 Ubuntu 网站的以下\
  \ URL 下载：`http://www.ubuntu.com/server`。\n\n### 如何操作……\n\n\n\n\n在镜像文件加载并从其启动虚拟机后，你将看到如下截图所示的默认\
  \ 菜单。这包含了多个安装和诊断选项。可以使用键盘导航菜单。\n\n对于标准安装，请确保 `Install Ubuntu Server` 选项被选中并按 `Enter`。\n\
  \n![](img/index-30_1.jpg)\n![](img/index-30_2.jpg)\n![](img/index-30_3.jpg)\n\n\
  # 第 1 章\n\n当安装过程开始时，你将被要求回答一系列问题，以定义系统配置。前两个选项要求你指定语言和居住国家。在回答这些问题后，你将被要求按照如下截图所示定义键盘布局配置：\n\
  \n有多种选项可以定义键盘布局。其中一种选项是“检测”（detection），系统会提示你按下一系列按键，以便 Ubuntu 检测到你正在使用的键盘布局。你可以通过点击\
  \ `Yes` 来使用键盘检测。或者，你也可以点击 `No` 手动选择键盘布局。系统会根据你的国家和语言默认选择最可能的选项，从而简化这一过程。定义键盘布局后，系统要求你为系统输入一个主机名（hostname）。如果你将把系统加入域，请确保主机名是唯一的。接下来，系统会要求输入新用户的全名和用户名。与用户全名不同，用户名应由单串小写字母组成。用户名中也可以包含数字，但数字不能作为开头。请看以下截图：17\n\
  \n![](img/index-31_1.jpg)\n![](img/index-31_2.jpg)\n![](img/index-31_3.jpg)\n\n\
  ## 入门\n\n在提供新账户的用户名后，你将被要求提供密码。请确保密码是你能够记住的，因为你以后可能需要访问此系统来修改配置。请看以下截图：\n\n提供密码后，系统将要求你决定是否对每个用户的家目录进行加密。虽然这提供了额外的安全保护层，但在实验室环境中并不是必需的，因为系统不会持有任何真实的敏感数据。接下来，你将被要求按照如下截图所示配置系统时钟：\n\
  \n尽管你的系统使用的是内部 IP 地址，但它会尝试确定其路由出去的公网 IP 地址，并利用此信息推测你所在的时区。如果 Ubuntu 提供的猜测正确，请选择\
  \ `Yes`；否则，请选择 `No` 手动选择时区。选择时区后，你将被要求按照如下截图所示定义磁盘分区配置：\n\n18\n\n![](img/index-32_1.jpg)\n\
  ![](img/index-32_2.jpg)\n\n# 第 1 章\n\n如果没有特殊理由选择其他，建议选择默认选项。在安全实验室中，你可能不需要进行手动分区，因为每台虚拟机通常都会使用单一专用分区。选择分区方法后，系统将要求你选择磁盘。除非你为虚拟机添加了额外的磁盘，否则你在这里只会看到以下选项：\n\
  \n选择磁盘后，系统将要求你检查配置。核实一切无误后即可确认安装。在安装过程之前，你将被要求配置 HTTP 代理。就本书的而言，不需要单独的代理，你可以将此字段留空。最后，你将被要求按照如下截图所示，决定你是否想在操作系统上安装任何软件：\n\
  \n要选择任何特定软件，请使用 `Space` 键。为了增加攻击面，我包含了多个服务，仅排除了虚拟托管和额外的手动包选择。一旦你选择了所需的软件包，按 `Enter`\
  \ 完成该过程。\n\n### 工作原理……\n\nUbuntu Server 没有 GUI，完全由命令行驱动。为了有效使用它，建议你使用 `SSH`。要配置并使用\
  \ `SSH`，请参阅本节后面的 `Configuring and using SSH` 教程。\n\n19\n\n![](img/index-33_1.jpg)\n\
  \n## 入门\n\n# 安装 Metasploitable2\n\nMetasploitable2 是一个故意存在漏洞的 Linux 发行版，也是一种非常高效的安全训练工具。它预装了大量的漏洞网络服务，还包含了几个漏洞\
  \ Web 应用程序。\n\n### 准备工作\n\n在你的虚拟安全实验室中安装 Metasploitable2 之前，你首先需要从网上下载它。有很多镜像站点和种子链接可以下载。获取\
  \ Metasploitable 的一种相对简单的方法是从以下 URL 从 SourceForge 下载：`http://sourceforge.net/projects/metasploitable/files/Metasploitable2/`。\n\
  \n### 如何操作\n\n安装 Metasploitable2 可能是你在安全实验室中执行的最简单的安装之一。这是因为在从 SourceForge 下载时，它已经作为一个\
  \ VMware 虚拟机准备好了。一旦下载了 `ZIP` 文件，你可以分别在 Windows 的 `Explorer` 或 Mac OS X 的 `Finder`\
  \ 中通过双击文件来轻松提取内容。请看以下截图：\n\n解压后，`ZIP` 文件将返回一个包含五个额外文件的目录。这些文件中包含了 VMware 的 `VMX`\
  \ 文件。要在 VMware 中使用 Metasploitable，只需点击 `File` 下拉菜单并点击 `Open`。然后，浏览到由 `ZIP` 解压过程创建的目录，并如下所示打开\
  \ `Metasploitable.vmx`：\n\n20\n\n![](img/index-34_1.jpg)\n![](img/index-34_2.jpg)\n\
  \n# 第 1 章\n\n打开 `VMX` 文件后，它应该包含在你的虚拟机库中。从库中选中并点击 `Run` 启动虚拟机进入如下屏幕：虚拟机加载后，将出现启动界面并请求登录凭据。默认登录用户名和密码均为\
  \ `msfadmin`。此机器也可以通过 `SSH` 访问，详见本节后面的 `Configuring and using SSH` 教程。\n\n### 工作原理……\n\
  \nMetasploitable 的设计初衷是安全测试教育。这是一个非常高效的工具，但必须小心处理。Metasploitable 系统绝不能暴露在任何不可信的网络中。它不应被分配公共路由的\
  \ IP 地址，并且不应使用端口转发来通过网络地址转换 (`NAT`) 接口使服务可用。\n\n21\n\n![](img/index-35_1.jpg)\n\n\
  ## 入门\n\n## 安装 Windows Server\n\n在你的测试中有一个 Windows 操作系统对于学习安全技能至关重要，因为它是生产系统中最常用的操作系统环境。在提供的场景中，使用了\
  \ `Windows XP SP2`（服务包 2）的安装版本。由于 `Windows XP` 是一个较旧的操作系统，在测试环境中有很多可以被利用的缺陷和漏洞。\n\
  \n### 准备工作\n\n为了完成本教程讨论的任务以及书中后的一些练习，你需要获取一个 Windows 操作系统的副本。如果可能，应使用 `Windows XP\
  \ SP2`，因为这是在编写本书时正在使用的操作系统。选择该操作系统的原因之一是微软不再支持它，并且可以相对容易且以几乎没有成本的方式获取。然而，由于它不再受支持，你需要从第三方供应商处购买或通过其他方法获取。获取该产品的任务交由你决定。\n\
  \n### 如何操作……\n\n\n\n\n从 Windows XP 镜像文件启动后，将加载蓝色菜单屏幕，它将向你提出一系列问题以引导你完成安装过程。首先，你将被要求定义操作系统将安装的分区。除非你对虚拟机进行了自定义更改，否则你在这里只会看到一个选项。你可以选择快速格式化或全盘格式化。对于虚拟机来说，任何一个选项都足够了。一旦你回答了这些初步问题，你将收到一系列关于操作系统配置的问题。然后，你将被引导到以下屏幕：22\n\
  \n![](img/index-36_1.jpg)\n\n![](img/index-36_2.jpg)\n\n# 第 1 章\n\n首先，你将被要求提供名称和组织。该名称被分配给创建的初始账户，但组织名称仅用于元数据目的，对操作系统的性能没有影响。接下来，你将被要求提供计算机名称和管理员密码，如下截图所示：\n\
  \n如果你将把系统加入网域，建议使用唯一的计算机名称。管理员密码应该是你能够记住的密码，因为你需要登录到此系统来测试或配置更改。然后，你将被要求设置日期、时间和时区。这些内容可能会自动填充，但请确保它们是正确的，因为日期和时间的配置错误可能会影响系统性能。请看下面的截图：\n\
  \n23\n\n![](img/index-37_1.jpg)\n\n## 入手\n\n配置好时间和日期后，你将被要求将系统分配到工作组或网域。书中讨论的大多数练习可以使用任何一种配置进行。然而，还有一些远程\
  \ SMB 审计任务（将在后续讨论），这些任务需要系统加入网域。下面的截图显示了“保护你的电脑”（Protect your PC）窗口：\n\n安装过程完成后，将提示你通过自动更新帮助保护你的电脑。此的默认选择是启用自动更新。然而，由于我们希望增加可用的测试机会，我们将选择“现在不”（Not\
  \ right now）选项。\n\n### 工作原理……\n\nWindows XP SP2 是任何新手安全实验室的极佳补充。由于它是一个旧的操作系统，它提供了许多可以测试和利用的漏洞。然而，随着你在渗透测试领域变得越来越精通，通过引入更新、更安全的操作系统（如\
  \ Windows 7）来进一步磨练你的技能是非常重要的。\n\n## 增加 Windows 攻击面\n\n为了进一步增加 Windows 操作系统上攻击面的可用性，添加漏洞软件并启用或禁用某些集成组件是非常重要的。\n\
  \n### 准备工作\n\n在修改 Windows 配置以增加攻击面之前，你需要在其中一台虚拟机上安装操作系统。如果尚未完成此操作，请参阅本章中的“安装 Windows\
  \ Server”配方。\n\n24\n\n![](img/index-38_1.jpg)\n\n![](img/index-38_2.jpg)\n\n# 第\
  \ 1 章\n\n### 如何操作\n\n启用远程服务，尤其是未补丁的远程服务，通常是向系统中引入某些漏洞的有效方法。首先，你需要在 Windows 系统上启用简单网络管理协议（`SNMP`）。要此操作，打开左下角的开始菜单，然后点击控制面板。双击“添加或删除程序”图标，然后点击屏幕左侧的“启用或禁用\
  \ Windows 组件”链接以进入以下屏幕：\n\n从这里，你将看到可以在操作系统上启用或禁用的组件列表。滚动到“管理和监控工具”（Management and\
  \ Monitoring Tools）并双击它以打开其中的选项，如下截图所示：\n\n25\n\n![](img/index-39_1.jpg)\n\n![](img/index-39_2.jpg)\n\
  \n# 入手\n\n打开后，确保 `SNMP` 和 `WMI SNMP Provider` 的两个复选框都已勾选。这将允许对系统执行远程 `SNMP` 查询。点击确定后，这些服务的安装将开始。这些服务的安装需要\
  \ Windows XP 镜像盘，VMware 可能在虚拟机镜像完成后删除了该光盘。\n\n如果是这种情况，你将收到弹窗请求插入光盘，如下截图所示：\n\n要执行此操作，请访问虚拟机设置。确保启用虚拟光驱驱动器，然后浏览到主机文件系统中的\
  \ ISO 文件以添加光盘：\n\n一旦检测到光盘，`SNMP` 服务的安装将自动完成。\n\nWindows 组件向将在安装完成后通知你。除了添加服务外，你还应该删除操作系统包含的一些默认服务。要执行此操作，再次打开控制面板并双击“安全中心”图标。滚动到页面底部，点击“Windows\
  \ 防火墙”链接并确保该功能已关闭，如下截图所示：\n\n26\n\n![](img/index-40_1.jpg)\n\n# 第 1 章\n\n关闭 Windows\
  \ 防火墙功能后，点击确定返回上一个菜单。再次滚动到底部，然后点击“自动更新”链接并确保它也已关闭。\n\n### 工作原理……\n\n在操作系统上启用功能性服务并禁用安全服务会极大增加被破解的风险。通过增加操作系统上存在的漏洞数量，我们也增加了学习攻击模式和利用漏洞的机会。这个特定的配方仅涉及了通过操纵\
  \ Windows 中的集成组件来增加攻击面。然而，安装具有已知漏洞的各种第三方软件包也是很有用的。\n\n你可以在以下 URL 找到漏洞性软件包包：\n\n\
  - http://www.exploit-db.com/\n- http://www.oldversion.com/\n\n## 安装 Kali Linux\n\
  \nKali Linux 是整套渗透测试工具军库，还将作为书中讨论的许多扫描脚本的开发环境。\n\n27\n\n![](img/index-41_1.jpg)\n\
  \n![](img/index-41_2.jpg)\n\n# 入手\n\n### 准备工作\n\n在你的虚拟机安全测试实验室中安装 Kali Linux 之前，你需要从可靠源获取\
