  \ `sqlmap` 的使用，可以使用来自 Burp Suite 截获的请求。\n\n要让 `sqlmap` 使用请求拦截，必须将其保存为文本格式。为此，在 Burp\
  \ Suite 中右键点击请求内容，然后选择“Copy to file”（复制到文件）。保存后，你可以浏览目录并使用 `cat` 命令验证文件内容，如下：\n\n\
