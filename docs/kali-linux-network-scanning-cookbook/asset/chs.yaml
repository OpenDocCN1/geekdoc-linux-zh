  All plugins loaded\n- 您可以通过输入 /etc/init.d/nessusd start 来启动 nessusd\n- 然后访问 https://kali:8834/\
  \ 配置您的扫描器\nroot@kali:~# /etc/init.d/nessusd start\n$Starting Nessus : .\n```\n\n\
  36\n\n![](img/index-50_1.jpg)\n\n![](img/index-50_2.jpg)\n\n## 第 1 章\n\n使用 `ls`\
  \ 命令验证安装包是否存在于当前目录。您应该会在响应中看到它。然后可以使用 Debian 包管理器 (`dpkg`) 工具安装该服务。`-i` 参数告诉管理器安装指定的包。安装完成后，可以使用命令\
