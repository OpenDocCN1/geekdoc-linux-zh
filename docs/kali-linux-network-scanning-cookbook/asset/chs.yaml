  \ SYN 数据包，并利用 SYN+ACK 响应来识别活跃的服务。使用 Metasploit 可能对某些人更有吸引力，因为它具有交互式控制台，而且它是大多数渗透测试人员都熟知的工具。\n\
  \n## 使用 hping3 进行隐蔽扫描\n\n除了我们之前学的发现技术外，`hping3` 也可以用于端口扫描。此特定示例演示了我们如何使用 `hping3`\
  \ 执行 TCP 隐蔽扫描。\n\n### 准备工作\n\n要使用 `hping3` 执行 TCP 隐蔽扫描，你需要一个通过 TCP 运行可访问网络服务的远程系统。在提供的示例中，使用了\
  \ `Metasploitable2` 实例来执行此任务。有关如何设置 `Metasploitable2` 的更多信息，请参阅第 1 章“入门”。\n\n###\
  \ 如何操作……\n\n除了已经提到的发现能力外，`hping3` 还可以执行 TCP 端口扫描。要使用 `hping3` 执行端口扫描，我们需要使用 `--scan`\
  \ 模式并配合整数值来指示要扫描的端口号：\n\n```bash\nroot@KaliLinux:~# hping3 172.16.36.135 --scan\
  \ 80 -S\nScanning 172.16.36.135 (172.16.36.135), port 80\n1 ports to scan, use -V\
  \ to see all the replies\n+----+-----------+---------+---+-----+-----+-----+\n|port|\
  \ serv name | flags |ttl| id | win | len |\n+----+-----------+---------+---+-----+-----+-----+\n\
  80 http : .S..A... 64 0 5840 46\nAll replies received. Done.\n```\n\n### 未响应的端口：\n\
  \n在提供的示例中，针对指定 IP 地址的 TCP 80 端口执行了 SYN 扫描。`-S` 选项标识发送到远程系统的数据包中激活的 TCP 标志。表格显示了响应数据包的属性。如输出所示，收到了\
  \ SYN+ACK 响应，表明目标主机上的 80 端口是开放的。\n\n此外，我们可以通过传递逗号分隔的端口号序列来扫描多个端口：\n\n```bash\nroot@KaliLinux:~#\
  \ hping3 172.16.36.135 --scan 22,80,443 -S\nScanning 172.16.36.135 (172.16.36.135),\
  \ port 22,80,443\n3 ports to scan, use -V to see all the replies\n+----+-----------+---------+---+-----+-----+-----+\n\
  |port| serv name | flags |ttl| id | win | len |\n+----+-----------+---------+---+-----+-----+-----+\n\
  22 ssh : .S..A... 64 0 5840 46\n80 http : .S..A... 64 0 5840 46\nAll replies received.\
  \ Done.\n```\n\n### 扫描范围和详细程度\n\n在提供的扫描输出中，你可以看到结果仅在收到 SYN+ACK 响应时才会显示。请注意，发送到 443\
  \ 端口的 SYN 请求相关的响应并未显示。如输出所示，我们可以通过使用 `-v` 选项增加详细程度来查看所有响应。此外，可以通过传递以连字符分隔的起始和结束端口地址来扫描连续端口范围：\n\
  \n```bash\nroot@KaliLinux:~# hping3 172.16.36.135 --scan 0-100 -S\nScanning 172.16.36.135\
  \ (172.16.36.135), port 0-100\n101 ports to scan, use -V to see all the replies\n\
  +----+-----------+---------+---+-----+-----+-----+\n|port| serv name | flags |ttl|\
  \ id | win | len |\n+----+-----------+---------+---+-----+-----+-----+-----+\n21\
  \ ftp : .S..A... 64 0 5840 46\n22 ssh : .S..A... 64 0 5840 46\n23 telnet : .S..A...\
  \ 64 0 5840 46\n25 smtp : .S..A... 64 0 5840 46\n53 domain : .S..A... 64 0 5840\
  \ 46\n80 http : .S..A... 64 0 5840 46\n```\n\n\n\n\n\n`hping3` 与之前提到的某些工具不同，因为它没有\
  \ SYN 扫描模式，而是允许你指定在发送 TCP 数据包时激活的 TCP 标志位（flag bits）。在本教程提供的示例中，`-S` 选项指示 `hping3`\
  \ 为发送的 TCP 数据包使用 SYN 标志位。\n\n## 使用 Scapy 进行连接扫描\n\n对于大多数扫描工具来说，TCP 连接扫描（TCP connect\
  \ scanning）比 SYN 扫描更容易实现。这是因为 TCP 连接扫描不需要生成和注入 SYN 扫描中使用的原始数据包（raw packets）所需的提升权限。`Scapy`\
  \ 是此中的一个大例外。实际上，使用 `Scapy` 执行完整的 TCP 三次握手是非常困难且不切实际的。然而，为了更好地理解这一过程，我们将在本教程中介绍如何使用\
  \ `Scapy` 执行连接扫描。\n\n### 准备工作\n\n要使用 `Scapy` 执行完整的连接扫描，你需要一个运行着 TCP 网络服务的远程系统。在本文提供的示例中，使用了\
  \ `Metasploitable2` 实例来执行此任务。有关如何设置 `Metasploitable2` 的更多信息，请参阅第 1 章《入门指南》。此外，本节还需要使用文本编辑器（如\
  \ `VIM` 或 `Nano`）向文件系统编写脚本。有关如何编写脚本的更多信息，请参阅第 1 章《入门指南》中的“使用文本编辑器 (VIM 和 Nano)”教程。\n\
  \n### 如何操作……\n\n使用 `Scapy` 运行完整的连接扫描可能会困难，因为系统内核感知你在 `Scapy` 中对数据包的操作，并尝试阻止你与远程系统建立完整的三次握手。你可以通过发送\
  \ SYN 请求并使用 `Wireshark` 或 `tcpdump` 嗅探相关流量来观察这一活动。当你收到来自远程系统的 SYN-ACK 响应时，Linux\
  \ 内核将其解释为未请求的响应，因为它并不知道你在 `Scapy` 中发出的请求，系统会自动响应 TCP RST 数据包，从而中断握手过程。考虑以下示例：\n\n\
  ```\n#!/usr/bin/python\n\nimport logging\n\nlogging.getLogger(\"scapy.runtime\"\
  ).setLevel(logging.ERROR)\n\nfrom scapy.all import *\n\nresponse = sr1(IP(dst=\"\
  172.16.36.135\")/TCP(dport=80,flags='S'))\n\nreply = sr1(IP(dst=\"172.16.36.135\"\
  )/TCP(dport=80,flags='A',ack=(response[TCP].seq + 1)))\n```\n\n该 Python 脚本可以作为概念验证，用于演示系统破坏三次握手的问题。该脚本假设你正将其指向一个具有开放端口的活动系统，因此假设会收到响应初始\
  \ SYN 请求的 SYN+ACK 复。尽管发送了最终的 ACK 响应以以完成握手，但 RST 数据包阻止了连接的建立。\n\n我们可以通过查看发送和接收的数据包来进一步演示这一点：\n\
  \n```python\n#!/usr/bin/python\n\nimport logging\n\nlogging.getLogger(\"scapy.runtime\"\
  ).setLevel(logging.ERROR)\n\nfrom scapy.all import *\n\nSYN = IP(dst=\"172.16.36.135\"\
  )/TCP(dport=80,flags='S')\n\nprint \"-- SENT --\"\n\nSYN.display()\n\nprint \"\\\
  n\\n-- RECEIVED --\"\n\nresponse = sr1(SYN,timeout=1,verbose=0)\n\nresponse.display()\n\
  \nif int(response[TCP].flags) == 18:\n    print \"\\n\\n-- SENT --\"\n    ACK =\
  \ IP(dst=\"172.16.36.135\")/TCP(dport=80,flags='A',ack=(response[TCP].seq + 1))\n\
  \    response2 = sr1(ACK,timeout=1,verbose=0)\n    ACK.display()\n    print \"\\\
  n\\n-- RECEIVED --\"\n    response2.display()\nelse:\n    print \"SYN-ACK not returned\"\
  \n```\n\n在随后的 Python 脚本中，每个发送的数据包在传输前显示，每个接收的数据包在到达时显示。通过检查每个数据包中激活的 TCP 标志，可以明显看到三次握手失败。\n\
  \n考虑脚本生成的输出：\n\n```\nroot@KaliLinux:~# ./tcp_connect.py\n-- SENT --\n###[ IP ]###\n\
  version = 4\nihl = None\ntos = 0x0\nlen = None\nid = 1\nflags =\nfrag = 0\nttl =\
  \ 64\nproto = tcp\nchksum = None\nsrc = 172.16.36.180\ndst = 172.16.36.135\n\\options\
  \ \\\n###[ TCP ]###\nsport = ftp_data\ndport = http\nseq = 0\nack = 0\ndataofs =\
  \ None\nreserved = 0\nflags = S\nwindow = 8192\nchksum = None\nurgptr = 0\noptions\
  \ = {}\n-- RECEIVED --\n###[ IP ]###\nversion = 4L\nihl = 5L\ntos = 0x0\nlen = 44\n\
  id = 0\nflags = DF\nfrag = 0L\nttl = 64\nproto = tcp\nchksum = 0x9970\nsrc = 172.16.36.135\n\
  dst = 172.16.36.180\n\\options \\\n###[ TCP ]###\nsport = http\ndport = ftp_data\n\
  seq = 3013979073L\nack = 1\ndataofs = 6L\nreserved = 0L\nflags = SA\nwindow = 5840\n\
  chksum = 0x801e\nurgptr = 0\noptions = [('MSS', 1460)]\n###[ Padding ]###\nload\
  \ = '\\x00\\x00'\n-- SENT --\n###[ IP ]###\nversion = 4\nihl = None\ntos = 0x0\n\
  len = None\nid = 1\nflags =\nfrag = 0\nttl = 64\nproto = tcp\nchksum = None\nsrc\
  \ = 172.16.36.180\ndst = 172.16.36.135\n\\options \\\n###[ TCP ]###\nsport = ftp_data\n\
  dport = http\nseq = 0\nack = 3013979074L\ndataofs = None\nreserved = 0\nflags =\
  \ A\nwindow = 8192\nchksum = None\nurgptr = 0\noptions = {}\n-- RECEIVED --\n###[\
  \ IP ]###\nversion = 4L\nihl = 5L\ntos = 0x0\nlen = 44\nid = 0\nflags = DF\nfrag\
  \ = 0L\nttl = 64\nproto = tcp\nchksum = 0x9970\nsrc = 172.16.36.135\ndst = 172.16.36.180\n\
  \\options \\\n###[ TCP ]###\nsport = http\ndport = ftp_data\nseq = 3013979073L\n\
  ack = 1\ndataofs = 6L\nreserved = 0L\nflags = SA\nwindow = 5840\nchksum = 0x801e\
  \ (根据原文为了简进行了截断)\n...\n```\n\n在脚本的输出中，可以看到四个数据包。正是这最后一个数据包表明在建立连接时遇到了问题。使用 `Scapy`\
  \ 执行完整的三次握手是可能的，但这需要对系统的本地 IP 表进行一些修改。具体来说，只有当你抑制发送到尝试连接的远程系统的 RST 数据包时，才能完成握手。通过使用\
  \ IP 表建立过滤规则，可以丢弃 RST 数据包，从而在没有系统干扰的情况下完成三次握手（此配置不建议用于持续功能使用）。为了演示完整三次握手的成功完成，我们使用\
  \ `Netcat` 建立一个监听服务，然后尝试使用 `Scapy` 连接到开放端口：\n\n```\nadmin@ubuntu:~$ nc -lvp 4444\n\
  listening on [any] 4444 ...\n```\n\n在提供的示例中，在 TCP 端口 4444 上开启了监听服务。我们可以修改之前讨论过的脚本，尝试连接到端口\
  \ `4444` 上的 Netcat TCP 服务，如下：\n\n```python\n#!/usr/bin/python\n\nimport logging\n\
  \nlogging.getLogger(\"scapy.runtime\").setLevel(logging.ERROR)\n\nfrom scapy.all\
  \ import *\n\nresponse = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=4444,flags='S'))\n\
  \nreply = sr1(IP(dst=\"172.16.36.135\")/TCP(dport=4444,flags='A',ack=(response[TCP].seq\
  \ + 1)))\n```\n\n\n\n\n在此脚本中，我们向监听端口发送了一个 SYN 请求，然后针对预期的 SYN+ACK 回复发送了 ACK 回复。为了验证连接尝试仍然被系统生成的\
  \ RST 数据包中断，应在运行 Wireshark 时执行此脚本，以捕获请求序列。我们在 Wireshark 中应用了过滤器来隔离连接尝试序列。使用的过滤器为\
  \ `tcp && (ip.src == 172.16.36.135 || ip.dst == 172.16.36.135)`。该过滤器用于仅显示发往或来自被扫描系统的\
  \ TCP 流量。如下截图所示：\n\n现在我们已经确定了精确的问题，可以建立一个过滤器来抑制这种系统生成的 RST 响应。可以通过以下方式修改本地 IP 表来建立此过滤器：\n\
  \n以如下方式修改本地 IP 表将通过阻塞所有出站 RST 响应，损害系统处理与目标系统 TCP/IP 事务的方式。确保在完成此操作后删除创建的 `iptables`\
  \ 规则，或者之后使用以下命令刷新 `iptables`：\n\n```bash\niptables --flush\nroot@KaliLinux:~# iptables\
  \ -A OUTPUT -p tcp --tcp-flags RST RST -d 172.16.36.135 -j DROP\nroot@KaliLinux:~#\
  \ iptables --list\n```\n\n\n```Chain INPUT (policy ACCEPT)\ntarget prot opt source\
  \ destination\nChain FORWARD (policy ACCEPT)\ntarget prot opt source destination\n\
  Chain OUTPUT (policy ACCEPT)\ntarget prot opt source destination\nDROP tcp -- anywhere\
  \ 172.16.36.135 tcp\nflags:RST/RST\n```\n\n176\n![](img/index-190_1.jpg)\n\n第 3\
  \ 章\n\n在提供的示例中，修改了本地 IP 表，以抑制所有发往扫描主机目标地址的 TCP RST 数据包。随后可以使用 `list` 选项查看 IP 表条目并验证配置已发生更改。要进行另一次连接尝试，我们需要确保\
  \ `Netcat` 仍在目标机的 `4444` 端口监听，如下：\n\n```bash\nadmin@ubuntu:~$ nc -lvp 4444\nlistening\
  \ on [any] 4444 ...\n```\n\n应再次运行之前引入的 Python 脚本，并让 Wireshark 在后台捕获流量。使用之前讨论的显示过滤器，我们可以轻松地关注所需的流量。注意，三次握手的所有步骤现在已完成，且没有受到系统生成的\
  \ RST 数据包中断，如下截图所示：\n\n此外，如果我们查看运行在目标系统上的 `Netcat` 服务，会注意到连接已经建立。这是确认成功建立连接的进一步证据。如下输出所示：\n\
  \n```bash\nadmin@ubuntu:~$ nc -lvp 4444\nlistening on [any] 4444 ...\n172.16.36.132:\
  \ inverse host lookup failed: No address associated with name\nconnect to [172.16.36.135]\
  \ from (UNKNOWN) [172.16.36.132]\n```\n\n4209\n虽然这是理解 TCP 连接的一个非常有用的练习，但不要遗留 IP\
  \ 表条目。RST 数据包是通信中的重要组成部分，完全抑制这些响应会严重损害正常功能。可以使用以下命令刷新我们的 `iptables` 规则并验证刷新是否成功：\n\
  \n```bash\nroot@KaliLinux:~# iptables --flush\nroot@KaliLinux:~# iptables --list\n\
  Chain INPUT (policy ACCEPT)\ntarget prot opt source destination\nChain FORWARD (policy\
  \ ACCEPT)\ntarget prot opt source destination\nChain OUTPUT (policy ACCEPT)\ntarget\
  \ prot opt source destination\n```\n\n177 端口扫描\n如提供的示例所示，应使用 `flush` 选项来清除创建的 IP\
  \ 表条目。我们可以再次使用 `list` 选项验证 IP 表条目已删除。执行 TCP 连接扫描的工具通过执行完整的三次握手，与远程系统上的所有扫描端口建立连接来工作。端口的状态根据是否建立了连接来确定。如果无法建立连接，则该端口被确定为关闭状态。TCP\
  \ 连接扫描通过与远程主机上的每个扫描端口建立完整的 TCP 连接完成的。本特定操作演示了我们如何使用 `Nmap` 执行 TCP 扫描。\n\n准备工作\n\
  要使用 `Nmap` 执行全连接扫描，你需要一个运行着基于 TCP 服务的远程系统。在提供的示例中，使用了一个 `Metasplo2` 实例来执行此任务。有关如何设置\
  \ `Metasplo2` 的更多信息，请参阅第 1 章中的“安装 Metasplo2”操作。\n\n如何操作……\nNmap 有一个选项可以简化并流化执行 TCP\
  \ 连接扫描的过程。要使用 `Nmap` 执行 TCP 连接扫描，应使用 `-sT` 选项配合被扫描主机的 IP 地址，如下：\n\n```bash\nroot@KaliLinux:~#\
  \ nmap -sT 172.16.36.135 -p 80\nStarting Nmap 6.25 ( http://nmap.org ) at 2013-12-17\
  \ 22:03 EST\nNmap scan report for 172.16.36.135\nHost is up (0.0072s latency).\n\
  PORT STATE SERVICE\n80/tcp open http\nMAC Address: 00:0C:29:3D:84:32 (VMware)\n\
  Nmap done: 1 IP address (1 host up) scanned in 13.05 seconds\n```\n\n在提供的示例中，对指定\
  \ IP 地址的 TCP 端口 `80` 执行了 TCP 连接扫描。与使用 `Scapy` 使用的技术类似，`Nmap` 监听响应，并通过分析在任何接收响应中激活的\
  \ TCP 标志来识别开放端口。我们还可以通过传递逗号分隔的端口号列表使用 `Nmap` 对多个指定端口进行扫描，如下：\n\n```bash\nroot@KaliLinux:~#\
  \ nmap -sT 172.16.36.135 -p 21,80,443\nStarting Nmap 6.25 ( http://nmap.org ) at\
  \ 2013-12-17 22:03 EST\nNmap scan report for 172.16.36.135\nHost is up (0.0012s\
  \ latency).\nPORT STATE SERVICE\n21/tcp open ftp\n80/tcp open http\n443/tcp closed\n\
  MAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap done: 1 IP address (1 host up) scanned\
  \ in 13.05 seconds\n```\n\n在提供的示例中，对目标 IP 地址的端口 `21`、`80` 和 `443` 执行了 TCP 连接扫描。我们还可以通过指示要扫描的第一个和最后一个端口来使用\
  \ `Nmap` 扫描一系列主机，如下：\n\n```bash\nroot@KaliLinux:~# nmap -sT 172.16.36.135 -p 20-25\n\
  Starting Nmap 6.25 ( http://nmap.org ) at 2013-12-17 22:04 EST\nNmap scan report\
  \ for 172.16.36.135\nHost is up (0.0019s latency).\nPORT STATE SERVICE\n20/tcp closed\
  \ ftp-data\n21/tcp open ftp\n22/tcp open ssh\n23/tcp open telnet\n24/tcp closed\
  \ priv-mail\n25/tcp open smtp\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap done:\
  \ 1 IP address (1 host up) scanned in 13.05 seconds\n```\n\n在提供的示例中，对 TCP 端口 `20`\
  \ 到 `25` 执行了 TCP 连接扫描。除了提供指定扫描端口的能力外，`Nmap` 还有一个预配置的 1000 个常用端口列表。我们可以通过运行 `Nmap`\
  \ 而不提供任何端口规格来扫描这些端口：\n\n```bash\nroot@KaliLinux:~# nmap -sT 172.16.36.135\nStarting\
  \ Nmap 6.25 ( http://nmap.org ) at 2013-12-17 22:13 EST\nNmap scan report for 172.16.36.135\n\
  Host is up (0.0025s latency).\nNot shown: 977 closed ports\nPORT STATE SERVICE\n\
  21/tcp open ftp\n22/tcp open ssh\n23/tcp open telnet\n25/tcp open smtp\n53/tcp open\
  \ domain\n80/tcp open http\n111/tcp open rpcbind\n139/tcp open netbios-ssn\n445/tcp\
  \ open microsoft-ds\n512/tcp open exec\n513/tcp open login\n```\n\n\n\n\n`514/tcp\
  \ open shell`\n\n`1099/tcp open rmiregistry`\n\n`1524/tcp open ingreslock`\n\n`2049/tcp\
  \ open nfs`\n\n`2121/tcp open ccproxy-ftp`\n\n`3306/tcp open mysql`\n\n`5432/tcp\
  \ open postgresql`\n\n180\n\n# 第 3 章\n\n`5900/tcp open vnc`\n\n`6000/tcp open X11`\n\
  \n`6667/tcp open irc`\n\n`8009/tcp open ajp13`\n\n`8180/tcp open unknown`\n\n`MAC\
  \ Address: 00:0C:29:3D:84:32 (VMware)`\n\n`Nmap done: 1 IP address (1 host up) scanned\
  \ in 13.13 seconds`\n\n在提供的示例中，扫描了 `Nmap` 定义的 1,000 个常用端口，以识别 Metasploitable2 系统上的大量开放端口。虽然这种技术在识别大多数服务时非常有效，但它可能无法识别晦涩的服务或不常见的端口关联。为了扫描所有可能的\
  \ TCP 端口，必须扫描所有可能的端口地址值。TCP 头部中定义源端口和目的端口地址的部分长度均为 16 位。此外，每个位可以保留 1 或 0 的值。因此，有\
  \ `2¹⁶` 或 65,536 个可能的 TCP 端口地址。为了扫描所有可能的总地址空间，需要提供 0 到 65535 的端口范围，如下：\n\n```\n\
  root@KaliLinux:~# nmap -sT 172.16.36.135 -p 0-65535\nStarting Nmap 6.25 ( http://nmap.org\
  \ ) at 2013-12-17 22:14 EST\nNmap scan report for 172.16.36.135\nHost is up (0.00076s\
  \ latency).\nNot shown: 65506 closed ports\nPORT STATE SERVICE\n21/tcp open ftp\n\
  22/tcp open ssh\n23/tcp open telnet\n25/tcp open smtp\n53/tcp open domain\n80/tcp\
  \ open http\n111/tcp open rpcbind\n139/tcp open netbios-ssn\n445/tcp open microsoft-ds\n\
  512/tcp open exec\n513/tcp open login\n514/tcp open shell\n1099/tcp open rmiregistry\n\
  ```\n\n181\n\n# 端口扫描\n\n`1524/tcp open ingreslock`\n\n`2049/tcp open nfs`\n\n`2121/tcp\
  \ open ccproxy-ftp`\n\n`3306/tcp open mysql`\n\n`3632/tcp open distccd`\n\n`5432/tcp\
  \ open postgresql`\n\n`5900/tcp open vnc`\n\n`6000/tcp open X11`\n\n`6667/tcp open\
  \ irc`\n\n`6697/tcp open unknown`\n\n`8009/tcp open ajp13`\n\n`8180/tcp open unknown`\n\
  \n`8787/tcp open unknown`\n\n`34789/tcp open unknown`\n\n`50333/tcp open unknown`\n\
  \n`56375/tcp open unknown`\n\n`57385/tcp open unknown`\n\n`MAC Address: 00:0C:29:3D:84:32\
  \ (VMware)`\n\n`Nmap done: 1 IP address (1 host up) scanned in 17.05 seconds`\n\n\
  在提供的示例中，Metasploitable2 系统上扫描了所有可能的 65,536 个 TCP 地址。请注意，本次扫描识别出的服务比标准的 `Nmap` 1,000\
  \ 端口扫描要多。这证明了在尝试识别目标上所有可能的攻击面时，全扫描始终是最佳实践。`Nmap` 还可以使用破折号符号对一系列连续主机上的 TCP 端口进行扫描：\n\
  \n```\nroot@KaliLinux:~# nmap -sT 172.16.36.0-255 -p 80\nStarting Nmap 6.25 ( http://nmap.org\
  \ ) at 2013-12-17 22:16 EST\nNmap scan report for 172.16.36.1\nHost is up (0.00026s\
  \ latency).\nPORT STATE SERVICE\n80/tcp closed http\nMAC Address: 00:50:56:C0:00:08\
  \ (VMware)\nNmap scan report for 172.16.36.2\nHost is up (0.00056s latency).\nPORT\
  \ STATE SERVICE\n80/tcp closed http\nMAC Address: 00:50:56:FF:2A:8E (VMware)\nNmap\
  \ scan report for 172.16.36.132\nHost is up (0.00042s latency).\nPORT STATE SERVICE\n\
  80/tcp closed http\nMAC Address: 00:0C:29:65:D2 (VMware)\nNmap scan report for 172.16.36.135\n\
  Host is up (0.00061s latency).\nPORT STATE SERVICE\n80/tcp open http\nMAC Address:\
  \ 00:0C:29:3D:84:32 (VMware)\nNmap scan report for 172.16.36.180\nHost is up (0.0021s\
  \ latency).\nPORT STATE SERVICE\n80/tcp open http\nNmap done: 256 IP addresses (5\
  \ hosts up) scanned in 42.55\n```\n\n在提供的示例中，对所有主机执行了端口 80 的扫描。虽然扫描是针对单个端口的，但 `Nmap`\
  \ 也可以根据列表扫描多个端口，如下：\n\n```\nroot@KaliLinux:~# nmap -sT -iL iplist.txt -p 80\nStarting\
  \ Nmap 6.25 ( http://nmap.org ) at 2013-12-17 22:14 EST\nNmap scan report for 172.16.36.1\n\
  Host is up (0.00076s latency).\nPORT STATE SERVICE\n80/tcp closed http\nMAC Address:\
  \ 00:50:56:C0:00:08 (VMware)\nNmap scan report for 172.16.36.2\nHost is up (0.00056s\
  \ latency).\nPORT STATE SERVICE\n80/tcp closed http\nMAC Address: 00:50:56:FF:2A:8E\
  \ (VMware)\nNmap scan report for 172.16.36.132\nHost is up (0.00042s latency).\n\
  PORT STATE SERVICE\n80/tcp closed http\nMAC Address: 00:0C:29:65:D2 (VMware)\nNmap\
  \ scan report for 172.16.36.135\nHost is up (0.00061s latency).\nPORT STATE SERVICE\n\
  80/tcp open http\nMAC Address: 00:0C:29:3D:84:32 (VMware)\nNmap scan report for\
  \ 172.16.36.180\nHost is up (0.0021s latency).\nPORT STATE SERVICE\n80/tcp open\
  \ http\nNmap done: 256 IP addresses (5 hosts up) scanned in 42.55\n```\n\nTCP 连接扫描通过执行三次握手来工作。如果建立了连接，则端口是开放的。如果没有，则端口是关闭的。除了其他工具外，`Metasploit`\
  \ 有一个辅助模块可以扫描端口。使用 Metasploit 进行扫描可以减少所需的工具总数。\n\n184\n\n# 第 3 章：准备工作\n\n要使用 Metasploit\
  \ 执行全扫描，你需要一个运行着服务的远程系统。在提供的示例中，使用了 Metasploitable 实例。有关如何设置 Metasploitable 的更多信息，请参阅第\
  \ 1 章。\n\n`Metasploit` 有一个辅助模块可以扫描指定的 TCP 端口。要在 Kali 中打开 Metasploit，请在终端会话中使用 `msfconsole`\
  \ 命令，如下：\n\n```\nroot@KaliLinux:~# msfconsole\n```\n\n\n\n\n\n### 模块选项 (auxiliary/scanner/portscan/tcp)\n\
  \n| 名称 | 当前设置 | 是否 | 描述 |\n| :--- | :--- | :--- | :--- |\n| CONCURRENCY | 10 | yes\
  \ | 每个主机检查的并发端口数 |\n| PORTS | 1-10000 | yes | 要扫描的端口（例如 22-25,80,110-900） |\n| RHOSTS\
  \ | | yes | 目标地址范围或 CIDR 标识符 |\n| THREADS | 1 | yes | 并发线程数 |\n| TIMEOUT | 1000\
  \ | yes | socket 连接超时时间（单位：毫秒） |\n\n在 Metasploit 中调用 TCP 连接扫描模块时，请使用 `use` 命令并带有辅助模块的相对路径。一旦选择了该模块，可以使用\
  \ `show options` 命令来识别和/或修改扫描配置。该命令将显示四个列标题，包括 Name（名称）、Current Setting（当前设置）、Required（是否）和\
  \ Description（描述）。`Name` 列标识每个可配置变量的名称。`Current Setting` 列列出给定变量的现有配置。`Required`\
  \ 列标识给定变量是否需要值。此外，`Description` 列描述了每个变量的功能。我们可以使用 `set` 命令并提供新值作为参数来更改任何变量的值，如下：\n\
  \n```bash\nmsf auxiliary(tcp) > set RHOSTS 172.16.36.135\nRHOSTS => 172.16.36.135\n\
  msf auxiliary(tcp) > set PORTS 80\nPORTS => 80\nmsf auxiliary(tcp) > show options\n\
  ```\n\n模块选项 (auxiliary/scanner/portscan/tcp):\n\n| 名称 | 当前设置 | 是否 | 描述 |\n| :---\
  \ | :--- | :--- | :--- |\n| CONCURRENCY | 10 | yes | 每个主机检查的并发端口数 |\n| PORTS | 80\
  \ | yes | 要扫描的端口（例如 22-25,80,110-900） |\n| RHOSTS | 172.16.36.135 | yes | 目标地址范围或\
  \ CIDR 标识符 |\n| THREADS | 1 | yes | 并发线程数 |\n| TIMEOUT | 1000 | yes | socket 连接超时时间（单位：毫秒）\
  \ |\n\n```bash\nmsf auxiliary(tcp) > run\n[*] 172.16.36.135:80 - TCP OPEN\n[*] Scanned\
  \ 1 of 1 hosts (100% complete)\n[*] Auxiliary module execution completed\n```\n\n\
  在提供的示例中，`RHOSTS` 值被更改为我们想要扫描的远程系统的 IP 地址。`PORTS` 值设置为 TCP 端口 80 (HTTP)。在更新了必要的变量后，可以使用\
  \ `show options` 命令再次验证配置。一旦验证了所需的配置，即可启动扫描。Metasploit 中使用 `run` 命令来执行选定的辅助模块。在提供的示例中，`run`\
  \ 命令对指定 IP 地址的 80 端口执行了 TCP 连接扫描。通过提供由破折号分隔的第一个和最后一个值，也可以对连续的 TCP 端口执行此 TCP 连接扫描：\n\
  \n```bash\nmsf auxiliary(tcp) > set PORTS 0-100\nPORTS => 0-100\nmsf auxiliary(tcp)\
  \ > set THREADS 20\nTHREADS => 20\nmsf auxiliary(tcp) > show options\n```\n\n模块选项\
  \ (auxiliary/scanner/portscan/tcp):\n\n| 名称 | 当前设置 | 是否 | 描述 |\n| :--- | :--- |\
  \ :--- | :--- |\n| CONCURRENCY | 10 | yes | 每个主机检查的并发端口数 |\n| PORTS | 0-100 | yes\
  \ | 要扫描的端口（例如 22-25,80,110-900） |\n| RHOSTS | 172.16.36.135 | yes | 目标地址范围或 CIDR\
  \ 标识符 |\n| THREADS | 20 | yes | 并发线程数 |\n| TIMEOUT | 1000 | yes | socket 连接超时时间（单位：毫秒）\
  \ |\n\n```bash\nmsf auxiliary(tcp) > run\n[*] 172.16.36.135:25 - TCP OPEN\n[*] 172.16.36.135:23\
  \ - TCP OPEN\n[*] 172.16.36.135:22 - TCP OPEN\n[*] 172.16.36.135:21 - TCP OPEN\n\
  [*] 172.16.36.135:53 - TCP OPEN\n[*] 172.16.36.135:80 - TCP OPEN\n[*] Scanned 1\
  \ of 1 hosts (100% complete)\n[*] Auxiliary module execution\n```\n\n在提供的示例中，设置了扫描前\
  \ 100 个 TCP 端口。此外，线程数被更改为 20。`THREADS` 值定义了后台执行的并发任务数。确定一个良好的线程值将显著提高速度而不会过度消耗系统资源。对于大多数系统，20\
  \ 个线程是一个快速且安全的并发数。虽然此扫描识别了目标系统上的服务，但无法确定是所有服务。TCP 头部定义的源和目的端口长度均为 16 位。因此，有 $2^{16}$\
  \ 或 65536 个可能的端口地址。为了扫描所有可能的地址空间，需要提供 0 到 65535 的端口范围，如下：\n\n```bash\nmsf auxiliary(tcp)\
  \ > set PORTS 0-65535\nPORTS => 0-65535\nmsf auxiliary(tcp) > show options\n```\n\
  \n模块选项 (auxiliary/scanner/portscan/tcp):\n\n| 名称 | 当前设置 | 是否 | 描述 |\n| :--- | :---\
