  \ |\n+---------------------------+---------------------------+\n| o O o | \\'\\\
  /\\/\\/'/ |\n| o O | )======( |\n| o | .' LOOT '. |\n| |^^^^^^^^^^^^^^|l___ | /\
  \ _||__ \\ |\n| | PAYLOAD |\"\"\\___, | / (_||_ \\ |\n| |________________|__|)__|\
  \ | | __||_) | |\n| |(@)(@)\"\"\"|(@)(@)**|(@) | \" || \" |\n| = = = = = = = = =\
  \ = = = | '--------------' |\n+---------------------------+---------------------------+\n\
  使用 `notepad` 跟踪渗透测试？让 Metasploit Pro 报告主机、服务、会话和证据——输入 'go_pro' 立即启动。\n=[ metasploit\
  \ v4.6.0-dev [core:4.6 api:1.0]\n+ -- --=[ 1053 exploits - 590 auxiliary - 174 post\n\
  + -- --=[ 275 payloads - 28 encoders - 8 nops\nmsf > use auxiliary/scanner/ip/ipidseq\n\
  msf auxiliary(ipidseq) > show options\nModule options (auxiliary/scanner/ip/ipidseq):\n\
  Name Current Setting Required Description\n---- --------------- -------- -----------\n\
  INTERFACE no 接口名称\nRHOSTS yes 目标地址范围或 CIDR 标识符\nRPORT 80 yes 目标端口\n205\n*端口扫描*\n\
  SNAPLEN 65535 yes 要捕获的字节数\nTHREADS 1 yes 并发线程数\nTIMEOUT 500 yes 响应读取超时（单位：毫秒）\n\
  ```\n\n该辅助模块可用于对连续的主机地址或由 `CIDR` 表示法定义的网络范围进行扫描。为了提高扫描速度，应将 `THREADS` 变量增加到所需的并发任务数量，如下：\n\
  \n```\nmsf auxiliary(ipidseq) > set RHOSTS 172.16.36.0/24\nRHOSTS => 172.16.36.0/24\n\
  msf auxiliary(ipidseq) > set THREADS 25\nTHREADS => 25\nmsf auxiliary(ipidseq) >\
  \ show options\nModule options (auxiliary/scanner/ip/ipidseq):\nName Current Setting\
  \ Required Description\n---- --------------- -------- -----------\nINTERFACE no\
  \ 接口名称\nRHOSTS 172.16.36.0/24 yes 目标地址范围或 CIDR 标识符\nRPORT 80 yes 目标端口\nSNAPLEN 65535\
  \ yes 要捕获的字节数\nTHREADS 25 yes 并发线程数\nTIMEOUT 500 yes 响应读取超时（单位：毫秒）\n```\n\n一旦填充了所需变量的期望值，我们就可以使用\
  \ `show options` 命令再次验证扫描配置。然后可以使用 `run` 命令执行 IPID 序列扫描：\n\n```\nmsf auxiliary(ipidseq)\
  \ > run\n[*] 172.16.36.1's IPID sequence class: Randomized\n[*] 172.16.36.2's IPID\
  \ sequence class: Incremental!\n[*] Scanned 026 of 256 hosts (010% complete)\n[*]\
  \ Scanned 052 of 256 hosts (020% complete)\n[*] Scanned 077 of 256 hosts (030% complete)\n\
  206\n*第 3 章*\n[*] Scanned 103 of 256 hosts (040% complete)\n[*] Scanned 128 of 256\
  \ hosts (050% complete)\n[*] 172.16.36.134's IPID sequence class: Incremental!\n\
  [*] 172.16.36.135's IPID sequence class: All zeros\n[*] Scanned 154 of 256 hosts\
  \ (060% complete)\n[*] Scanned 180 of 256 hosts (070% complete)\n[*] Scanned 205\
  \ of 256 hosts (080% complete)\n[*] Scanned 231 of 256 hosts (090% complete)\n[*]\
  \ Scanned 256 of 256 hosts (100% complete)\n[*] Auxiliary module execution completed\n\
  ```\n\n当 IPID 序列扫描模块遍历提供的网络范围时，它将识别发现主机的 IPID 序列模式，并指示它们是全零、随机还是增量。僵尸扫描的理想候选主机是既具有增量\
  \ IPID 序列又与网络上其他系统没有频繁交互的主机。\n\n一旦识别出增量型空闲主机，我们可以使用 `Nmap` 中的 `-sI` 选项执行僵尸扫描，并传递需要用于扫描的僵尸主机\
  \ IP 地址：\n\n```\nroot@KaliLinux:~# nmap 172.16.36.135 -sI 172.16.36.134 -Pn -p 0-100\n\
  Starting Nmap 6.25 ( http://nmap.org ) at 2014-01-26 14:05 CST\nIdle scan using\
  \ zombie 172.16.36.134 (172.16.36.134:80); Class:\nIncremental\nNmap scan report\
  \ for 172.16.36.135\nHost is up (0.045s latency).\nNot shown: 95 closed|filtered\
  \ ports\nPORT STATE SERVICE\n21/tcp open ftp\n22/tcp open ssh\n23/tcp open telnet\n\
  25/tcp open smtp\n53/tcp open domain\n80/tcp open http\nMAC Address: 00:0C:29:3D:84:32\
  \ (VMware)\nNmap done: 1 IP address (1 host up) scanned in 2.75 seconds\n```\n\n\
  207\n*端口扫描*\n\n在提供的示例中，对扫描目标 `172.16.36.135` 的前 100 个 TCP 端口执行了僵尸扫描。`172.16.36.134`\
  \ 的空闲主机被用作僵尸，并使用 `-Pn` 选项防止 `Nmap` 尝试 ping 目标。在此演示中，我们识别并枚举了所有列出的端口，而从未与扫描目标直接交互。\n\
  \n### 工作原理……\n\n僵尸扫描的底层原理与上一个菜方中使用 `Scapy` 执行相同任务时的讨论相同。然而，使用 `Nmap` 僵尸模式允许我们使用集成著名的工具来执行相同的任务。\n\
  \n208\n4\n指纹识别\n\n在识别目标范围内的活动系统并枚举这些系统的开放端口后，开始收集它们以及与开放端口的服务是非常是非常。在本章中，我们将讨论使用\
  \ Kali Linux 对系统和服务进行指纹识别的不同技术。这些技术将包括 Banner 获取、服务探测识别、操作系统识别、SNMP 信息收集和防火墙识别。本章具体的菜方包括：\n\
  \n- 使用 `Netcat` 获取 Banner\n- 使用 `Python` 套接字获取 Banner\n- 使用 `Dmitry` 获取 Banner\n\
  - 使用 `Nmap` NSE 获取 Banner\n- 使用 `Amap` 获取 Banner\n- 使用 `Nmap` 进行服务识别\n- 使用 `Amap`\
  \ 进行服务识别\n- 使用 `Scapy` 进行操作系统识别\n- 使用 `Nmap` 进行操作系统识别\n- 使用 `xProbe2` 进行操作系统识别\n\
  - 使用 `p0f` 进行被动操作系统识别\n- 使用 `Onesixtyone` 进行 SNMP 分析\n- 使用 `SNMPwalk` 进行 SNMP 分析\n\
  - 使用 `Scapy` 进行防火墙识别\n- 使用 `Nmap` 进行防火墙识别\n- 使用 `Metasploit` 进行防火墙识别\n\n\n\n\n在处理上述提到的特定配方之前，我们应该首先讨论在本章剩余部分将涉及的一些底层原理。本章中的每个配方都将介绍用于执行某些特定任务的工具。\n\
  \n这些任务包括横幅获取（banner grabbing）、服务识别、操作系统识别、SNMP 分析和防火墙识别。这些任务服务于一个共同目标，即尽可能地收集有关目标系统的信息，以便快速高效地攻击该系统。\n\
  \n在投入大量时间和资源尝试识别远程服务之前，我们应该首先确定该远程服务是否会向我们标识自身。服务横幅（Service banners）是由在与远程服务建立连接时立即返回的输出文本。在历史上，网络服务在服务横幅中披露制造商、软件名称、服务类型甚至版本号是一种非常常见的做法。幸运的是，对于渗透测试人员来说，这些信息在识别软件已知的缺陷、缺陷和漏洞方面极其有用。只需连接到远程终端服务即可轻松读取横幅。然而，为了使其成为一个有效的信息收集工具，它应该是自动化的，这样我们无需手动连接到远程主机上的每一个单独服务。本章横幅获取配方中涉及的工具将完成自动化获取横幅的任务，以识别尽可能多的开放服务。\n\
  \n如果远程服务不自愿披露其上运行的软件和/或版本，我们只需要付出更大的努力来识别该服务。通常可以识别独特的行为或获取独特的响应，这些响应可以用于确定某项服务。由于响应或行为的细微差异，通常甚至可以识别特定服务的版本。然而，对于任何人类来说，记住所有这些独特特征都是困难的。幸运的是，已经创建了许多工具，可以向远程服务发送大量探测，用以分析这些目标服务的响应和行为。同样，响应变异也可以用于识别运行在远程服务器或工作站上的底层操作系统。这些工具将在涉及服务识别和操作系统识别的配方中讨论。\n\
  \n简单网络管理协议（`SNMP`）是一种设计为各种类型网络设备提供远程管理服务的协议。使用 `SNMP` 进行管理时使用团体字符串（community strings）进行身份验证。设备部署默认团体字符串的情况非常常见。当这种情况发生时，攻击者通常可以远程地收集有关目标设备配置的大量信息，在某些情况下甚至可以重新配置设备。利用\
  \ `SNMP` 进行信息收集的技术将在涉及 `SNMP` 分析的配方中讨论。\n\n在收集有关潜在目标的信息时，了解任何可能影响侦察或攻击成功的障碍也同样重要。防火墙是网络设备或软件，选择性地限制流向或离开特定目的地的网络流量。防火墙通常被配置为防止访问特定服务。对防火墙的感知（其正在修改你的攻击系统与目标地之间的流量）对于尝试识别规避或绕过其过滤器的方法至关重要。识别防火墙设备服务的服务的将在涉及防火墙识别的配方中讨论。\n\
  \n## 使用 Netcat 获取横幅\n\n`Netcat` 是一种多功能网络工具，可以配合 Kali Linux 执行多种信息收集和扫描任务。本特定配方将演示如何使用\
  \ `Netcat` 获取服务横幅，以便识别与目标系统开放端口相关的服务。\n\n### 准备工作\n\n要使用 `Netcat` 获取服务横幅，你需要一个运行网络服务的远程系统，该系统在客户端设备连接到它时会披露信息。在提供的示例中，使用了\
  \ `Metasploitable2` 实例来执行此任务。有关设置 `Metasploitable2` 的更多信息，请参考`第 1 章` `Getting Started`\
  \ 中的 `Installing Metasploitable2` 配方。\n\n### 如何操作……\n\n要使用 `Netcat` 获取服务横幅，必须在远程系统上的目标端口上建立\
  \ socket 连接。为了快速理解 `Netcat` 的用法以及它如何用于此目的，可以调用其用法输出。这可以通过 `-h` 选项来实现：\n\n```\nroot@KaliLinux:~#\
  \ nc -h\n```\n\n```\n[v1.10-40]\nconnect to somewhere: nc [-options] hostname port[s]\
  \ [ports] ...\nlisten for inbound: nc -l -p port [-options] [hostname] [port]\n\n\
  options:\n-c shell commands as `-e`; 使用 /bin/sh 执行 [危险!!]\n-e filename program 在连接后执行程序\
  \ [危险!!]\n-b 允许广播\n-g gateway 源路由跳跃点[s], 最多 8 个\n-G num 源路由指针: 4, 8, 12, ...\n-h\
  \ 此处杂项信息\n-i secs 发送的行、扫描端口的秒延迟间隔\n-k 在 socket 上设置保持活动选项\n-l 监听模式，用于入站连接\n-n 仅限数字\
  \ IP 地址，不进行 DNS\n-o 流量的十六进制转储\n-p port 本地端口号\n-r 随机本地和远程端口\n-q secs 在 stdin 的 EOF\
  \ 后退出并延迟 secs 秒\n-s addr 本地源地址\n-T tos 设置服务类型\n-t 回答 TELNET 协商\n-u UDP 模式\n-v 详细信息\
  \ [使用两次以获得更多详细信息]\n-w secs 连接和最终的秒超时时间\n-z 零 I/O 模式 [用于扫描]\n```\n\n通过查看该工具提供的各种选项，我们可以确定通过指定选项、IP\
  \ 地址，然后端口号来建立到目标端口的连接：\n\n```\nroot@KaliLinux:~# nc -vn 172.16.36.135 22\n```\n\n\
  ```\n(UNKNOWN) [172.16.36.135] 22 (ssh) open\nSSH-2.0-OpenSSH_4.7p1 Debian-8ubuntu1\n\
  ```\n\n在提供的示例中，已建立到 `Metasploitable2` 系统的端口 22 的连接。使用了 `-v` 选项提供详细输出，使用了 `-n` 选项在不通过\
  \ DNS 的情况下连接 IP 地址。在这里，我们可以看到远程主机返回的横幅标识服务为 SSH，供应商为 OpenSSH，甚至精确版本为 4.7。`Netcat`\
  \ 保持连接打开，因此在读取横幅后，你可以用 `Ctrl` + `C` 强制关闭连接：\n\n```\nroot@KaliLinux:~# nc -vn 172.16.36.135\
  \ 21\n```\n\n```\n(UNKNOWN) [172.16.36.135] 21 (ftp) open\n220 (vsFTPd 2.3.4)\n\
  ```\n\n对同一系统的端口 21 执行类似的扫描，我们可以轻松获取运行的 FTP 服务及其版本信息。在这些情况下，都泄露了许多有用信息。系统上运行的服务和版本通常是漏洞的关键指标，可用于利用和攻破系统。\n\
  \n### 工作原理……\n\n`Netcat` 能够获取这些服务的横幅，是因为这些服务被配置为当客户端服务连接到它们时自动披露这些信息。\n\n\n\n\n\
  确保客户端正在连接到预期的目标。随着开发者对安全意识的增强，这种做法正变得越来越常见。尽管如此，遇到开发水平较低或旧的遗留服务并不罕见，它们会以服务 banner\
  \ 的形式提供过多的信息。\n\n## 使用 Python sockets 获取 Banner\n\nPython 中的 `socket` 模块可用于连接运行在远程端口上的网络服务。本特定配方将演示如何使用\
  \ Python sockets 获取服务 banner（服务标识），以便识别与目标系统上开放端口相关的服务。\n\n### 准备工作\n\n要使用 Python\
  \ 收集服务 banner，你需要一个运行网络服务的远程系统，该系统在客户端设备连接其时会披露信息。在提供的示例中，使用了 `Metasploitable2`\
  \ 实例来执行此任务。有关设置 `Metasploitable2` 的更多信息，请参阅`第 1 章` `入门` 中的`安装 Metasploitable2` 配方。此外，此配方还需要使用\
  \ `VIM` 或 `Nano` 等文本编辑器向文件系统编写一个脚本。有关编写脚本的更多信息，请参考`第 1 章` `入门` 中的`使用文本编辑器 (VIM and\
  \ Nano)` 配方。\n\n### 如何操作……\n\n可以使用 Python 交互式解释器直接与远程网络服务交互。你可以通过直接调用它开始使用 Python\
  \ 解释器。在这里，你可以导入任何想要使用的特定模块。在这种情况下，我们将导入 `socket` 模块：\n\n```python\nroot@KaliLinux:~#\
  \ python\nPython 2.7.3 (default, Jan 2 2013, 16:53:07)\n[GCC 4.7.2] on linux2\n\
  Type \"help\", \"copyright\", \"credits\" or \"license\" for more information.\n\
  >>> import socket\n>>> bangrab = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
  >>> bangrab.connect((\"172.16.36.135\", 21))\n\n# Fingerprinting\n>>> bangrab.recv(4096)\n\
  '220 (vsFTPd 2.3.4)\\r\\n'\n>>> bangrab.close()\n>>> exit()\n```\n\n在提供的示例中，创建了一个名为\
  \ `bangrab` 的新 socket。`AF_INET` 参数用于指示 socket 将采用 IPv4 地址，`SOCK_STREAM` 参数用于指示将使用\
  \ TCP 传输。一旦创建了 socket，可以使用 `connect` 函数初始化连接。在示例中，`bangrab` socket 连接到位于 `172.16.36.135`\
  \ 的远程主机 `Metasploitable2` 的 21 端口。连接后，可以使用 `recv` 函数从 socket 连接的服务接收内容。假设有可用信息，它将作为输出打印。在这里，我们可以看到运行在\
  \ `Metasploitable2` 服务器上的 FTP 服务提供的 banner。最后，可以使用 `close` 函数优雅地结束与远程服务的连接。如果我们尝试连接到一个不接受连接的服务，Python\
  \ 解释器将返回一个错误：\n\n```python\nroot@KaliLinux:~# python\nPython 2.7.3 (default, Jan\
  \ 2 2013, 16:53:07)\n[GCC 4.7.2] on linux2\nType \"help\", \"copyright\", \"credits\"\
  \ or \"license\" for more information.\n>>> import socket\n>>> bangrab = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\n>>> bangrab.connect((\"172.16.36.135\", 443))\nTraceback\
  \ (most recent call last):\nFile \"<stdin>\", line 1, in <module>\nFile \"/usr/lib/python2.7/socket.py\"\
  , line 224, in meth\nreturn getattr(self._sock,name)(*args)\nsocket.error: [Errno\
  \ 111] Connection refused\n>>> exit()\n```\n\n如果尝试连接 `Metasploitable2` 系统上的 TCP\
  \ 端口 443，将返回一个指示连接被拒绝的错误。这是因为该远程端口上没有运行服务。然而，即使目标端口上运行了服务，也不意味着一定有可服务的 banner。通过与\
  \ `Metasploitable2` 系统上的 TCP 端口 80 连接可以看到这一点：\n\n```python\nroot@KaliLinux:~# python\n\
  Python 2.7.3 (default, Jan 2 2013, 16:53:07)\n[GCC 4.7.2] on linux2\nType \"help\"\
  , \"copyright\", \"credits\" or \"license\" for more information.\n# Chapter 4\n\
  >>> import socket\n>>> bangrab = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
  >>> bangrab.connect((\"172.16.36.135\", 80))\n>>> bangrab.recv(4096)\n```\n\n运行在该系统端口\
  \ 80 上的服务正在接受连接，但不会向连接的客户端提供服务 banner。如果使用了 `recv` 函数但没有可接收的数据，该函数将保持挂起状态。为了在 Python\
  \ 中自动化收集 banner 的实践，我们可以使用以下脚本：\n\n```python\n#!/usr/bin/python\nimport socket\n\
  import select\nimport sys\n\nif len(sys.argv) != 4:\n    print(\"Usage - ./banner_grab.py\
  \ [Target-IP] [First Port] [Last Port]\")\n    print(\"Example - ./banner_grab.py\
  \ 10.0.5 1 100\")\n    sys.exit()\n\nip = sys.argv[1]\nstart = int(sys.argv[2])\n\
  end = int(sys.argv[3])\n\nfor port in range(start,end):\n    try:\n        bangrab\
  \ = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n        bangrab.connect((ip,\
  \ port))\n        ready = select.select([bangrab],[],[],1)\n        if ready[0]:\n\
  \            print(\"TCP Port \" + str(port) + \" - \" + bangrab.recv(4096))\n \
  \       bangrab.close()\n    except:\n        pass\n```\n\n要执行该脚本，请修改文件权限并直接调用：\n\
  \n```bash\nroot@KaliLinux:~# chmod 777 banner_grab.py\nroot@KaliLinux:~# ./banner_grab.py\
  \ 172.16.36.135 1 65535\n```\n\n输出将如下：\n\n```text\nTCP Port 21 - 220 (vsFTPd 2.3.4)\n\
  TCP Port 22 - SSH-2.0-OpenSSH_4.7p1 Debian-8ubuntu1\nTCP Port 23 - ??????#'\nTCP\
  \ Port 25 - 220 metasploitable.localdomain ESMTP Postfix (Ubuntu)\nTCP Port 512\
  \ - Where are you?\nTCP Port 514 - \nTCP Port 1524 - root@metasploitable:/#\n```\n\
  \n\n\n\n5.0.51a-3ubuntu5?bo,(${c\\,#934JYb⁴'fM**\n\n### TCP 端口 5900 - RFB 003.003\n\
  \n### TCP 端口 6667 - :irc.Metasploitable.LAN NOTICE AUTH :*** 正在查找您的主机名...\n\n:irc.Metasploitable.LAN\
  \ NOTICE AUTH :*** 无法解析您的主机名；改用您的 IP 地址\n\n### TCP 端口 6697 - :irc.Metasploitable.LAN\
  \ NOTICE AUTH :*** 正在查找您的主机名...\n\n### 工作原理……\n\n本配方介绍的 Python 脚本通过利用 `socket` 库来工作。该脚本遍历每个指定的特定端口地址，并尝试与特定端口初始化\
  \ TCP 连接。如果建立了连接并从目标服务接收到横幅（banner），则该横幅将打印在脚本的输出中。如果无法与远程端口建立连接，脚本将移动到循环中的下一个端口地址。同样，如果建立了连接但没有返回横幅，则将关闭连接并让脚本继续循环到下一个值。\n\
  \n#### 使用 Dmitry 获取横幅\n\nDmitry 是一个简单且精简的工具，用于连接运行在远程端口上的网络服务。本特定配方将演示如何使用 Dmitry\
  \ 扫描来获取服务横幅，以识别目标系统上开放端口相关的服务。\n\n### 准备工作\n\n要使用 Dmitry 服务横幅，您需要一个运行网络服务的远程系统，该服务在客户端设备连接时会泄露信息。在提供的示例中，使用了一个\
  \ Metasploitable2 实例来执行此任务。有关设置 Metasploitable2 的更多信息，请参阅*第 1 章*、*入门*中的*安装 Metasploitable2*配方。\n\
  \n#### 指纹识别\n\n### 如何操作……\n\n正如本书之前的端口扫描配方中所讨论的那样，Dmitry 可对 150 个最常用的服务运行快速 TCP\
  \ 端口扫描。这可以使用 `-p` 选项完成：\n\n```bash\nroot@KaliLinux:~# dmitry -p 172.16.36.135\n\
  ```\n\nDeepmagic 信息收集工具\n\"正在发生一些深奥魔法\"\nERROR: 无法定位 172.16.36.135 的主机名\n正在带有限制模块继续\n\
  HostIP:172.16.36.135\nHostName:\n已收集 172.16.36.135 的 TCP 端口信息\n---------------------------------\n\
  Port State\n21/tcp open\n22/tcp open\n23/tcp open\n25/tcp open\n53/tcp open\n80/tcp\
  \ open\n111/tcp open\n139/tcp open\n端口扫描完成：已扫描 150 个端口，141 个端口处于关闭状态\n\n为了使用 Dmitry\
  \ 执行横幅获取，需要此端口扫描选项。也可以在尝试连接这 150 个端口中的每一个时，让 Dmitry 获取任何可用的横幅。这可以使用 `-b` 选项结合 `-p`\
  \ 选项来实现：\n\n```bash\nroot@KaliLinux:~# dmitry -pb 172.16.36.135\n```\n\nDeepmagic\
  \ 信息收集工具\n\"正在发生一些深奥魔法\"\nERROR: 无法定位 172.16.36.135 的主机名\n正在带有限制模块继续\nHostIP:172.16.36.135\n\
  HostName:\n已收集 172.16.36.135 的 TCP 端口信息\n---------------------------------\nPort\
  \ State\n21/tcp open\n>> 220 (vsFTPd 2.3.4)\n22/tcp open\n>> SSH-2.0-OpenSSH_4.7p1\
  \ Debian-8ubuntu1\n23/tcp open\n>> ???? ??#??'\n25/tcp open\n>> 220 metasploitable.localdomain\
  \ ESMTP Postfix (Ubuntu)\n53/tcp open\n80/tcp open\n111/tcp open\n139/tcp open\n\
  端口扫描完成：已扫描 150 个端口，141 个端口处于关闭状态\n\n### 工作原理……\n\nDmitry 是一个非常简单的命令行工具，可以以极小的开销执行横幅获取任务。Dmitry\
  \ 无需指定尝试获取横幅的端口，它可以通过仅对一小部分预定义且常用的端口尝试获取横幅来简化流程。从运行在这些端口地址上的服务接收到的横幅将在脚本的终端输出中返回。\n\
  \n指纹识别\n\n#### 使用 Nmap NSE 获取横幅\n\nNmap 有一个集成的 Nmap 脚本引擎（NSE）脚本，可从运行在远程端口的网络服务读取横幅。本特定配方将演示如何使用\
  \ Nmap NSE 获取服务横幅，以识别目标系统上开放端口相关的服务。\n\n### 准备工作\n\n要使用 Nmap NSE 服务横幅，您需要一个运行网络服务的远程系统，该服务在客户端设备连接时会泄露信息。在提供的示例中，使用了一个\
  \ Metasploitable2 实例来执行此任务。有关设置 Metasploitable2 的更多信息，请参阅*第 1 章*、*入门*中的*安装 Metasploitable2*配方。\n\
  \n### 如何操作……\n\n可以使用 Nmap 中的 `--script` 选项调用 Nmap NSE 脚本，然后指定所需的脚本名称。对于此特定脚本，应使用\
  \ `-sT full-connect` 扫描，因为只有在建立完全 TCP 连接时才能收集服务横幅。脚本将应用于与 Nmap 请求扫描的相同的端口：\n\n```bash\n\
  root@KaliLinux:~# nmap -sT 172.16.36.135 -p 22 --script=banner\n```\n\nStarting\
  \ Nmap 6.25 ( http://nmap.org ) at 2013-12-19 04:56 EST\nNmap scan for 172.16.36.135\n\
  Host is up (0.0003s latency).\nPORT STATE SERVICE\n22/tcp open ssh-2.0-OpenSSH_4.7p1\
  \ Debian-8ubuntu1\nNmap scan complete: 识别了 1 个 目标 (1 个主机在线)\n耗时 0.07 秒\n\n为了使用 Dmitry\
  \ 执行横幅获取，需要此端口扫描选项。也可以在尝试连接这 150 个端口中的每一个时，让 Dmitry 获取任何可用的横幅。这可以使用 `-b` 选项结合 `-p`\
  \ 选项来实现：\n\n```bash\nroot@KaliLinux:~# nmap -sT 172.16.36.135 -p 1-100 --script=banner\n\
  ```\n\n\n\n\n\n关于设置 Metasploitable2 的信息，请参阅 `Chapter 1`、`Getting Started` 中的 `Installing\
  \ Metasploitable2` 配方。\n\n## 指纹识别 (Fingerprinting)\n\n### 如何操作……\n`amap` 中的 `-B`\
  \ 选项可用于以扫描模式（banner mode）运行应用程序。这将为指定的 IP 地址和（端口（s）收集 banner。`amap` 可以通过指定远程 IP\
  \ 地址和服务端口号来收集单个服务的 banner：\n\n```\nroot@KaliLinux:~# amap -B 172.16.36.135 21\n\
  amap v5.4 (www.thc.org/thc-amap) started at 2013-12-19 05:04:58 -\nBANNER mode\n\
  Banner on 172.16.36.135:21/tcp : 220 (vsFTPd 2.3.4)\\r\\n\namap v5.4 finished at\
  \ 2013-12-19 05:04:58\n```\n\n在提供的示例中，Amap 已经从 172.16.36.135 上 Metasploitable2 系统的\
  \ 21 端口获取了服务 banner。此命令也可以修改为扫描连续的端口范围。要扫描所有可能的 TCP 端口，必须扫描所有可能的端口地址值。TCP 头中定义源端口和目的端口地址的部分长度均为\
  \ 16 位，每个位可以保留 1 或 0 的值。因此，有 $2^{16}$ 或 65,536 种可能的 TCP 端口地址。要扫描总可能的地址空间，必须提供 1\
  \ 到 65535 的端口范围：\n\n```\nroot@KaliLinux:~# amap -B 172.16.36.135 1-65535\namap v5.4\
  \ (www.thc.org/thc-amap) started at 2014-01-24 15:54:28 -\nBANNER mode\nBanner on\
  \ 172.16.36.135:22/tcp : SSH-2.0-OpenSSH_4.7p1 Debian-8ubuntu1\\n\nBanner on 172.16.36.135:21/tcp\
  \ : 220 (vsFTPd 2.3.4)\\r\\n\nBanner on 172.16.36.135:25/tcp : 220 metasploitable.localdomain\
  \ ESMTPTP Postfix (Ubuntu)\\r\\n\nBanner on 172.16.36.135:23/tcp : #'\nBanner on\
  \ 172.16.36.135:512/tcp : Where are you?\\n\nBanner on 172.16.36.135:1524/tcp :\
  \ root@metasploitable/#\nBanner on 172.16.36.135:2121/tcp : 220 ProFTPD 1.3.1 Server\
  \ (Debian) [ffff172.16.36.135]\\r\\n\nBanner on 172.16.36.135:3306/tcp : >\\n5.0.51a-3ubuntu5dJ$t?xdj,fCYxm=)Q=~$5\n\
  Banner on 172.16.36.135:5900/tcp : RFB 003.003\\n\nBanner on 172.16.36.135:6667/tcp\
  \ : irc.Metasploitable.LAN NOTICE AUTH *** Looking up your hostname...\\r\\n\nBanner\
  \ on 172.16.36.135:6697/tcp : irc.Metasploitable.LAN NOTICE AUTH *** Looking up\
  \ your hostname...\\r\\n\namap v5.4 finished at 2014-01-24 15:54:35\n```\n\nAmap\
  \ 产生的标准输出包含一些不需要且冗余的信息，可以从输出中提取出来。具体来说，移除扫描的元数据、`Banner on` 短语以及在整个扫描过程中不变的 IP 地址可能会很有帮助。要移除扫描元数据，我们必须对输出进行\
  \ `grep`，寻找特定输出条目唯一且在扫描元数据描述中的短语。为了做到这一点，我们可以 `grep` 单词 `on`：\n\n```\nroot@KaliLinux:~#\
  \ amap -B 172.16.36.135 1-65535 | grep \"on\"\nBanner on 172.16.36.135:22/tcp :\
  \ SSH-2.0-OpenSSH_4.7p1 Debian-8ubuntu1\\n\nBanner on 172.16.36.135:21/tcp : 220\
  \ (vsFTPd 2.3.4)\\r\\n\nBanner on 172.16.36.135:25/tcp : 220 metasploitable.localdomain\
  \ ESMTP Postfix (Ubuntu)\\r\\n\nBanner on 172.16.36.135:512/tcp : Where are you?\\\
  n\nBanner on 172.16.36.135:1524/tcp : root@metasploitable/#\nBanner on 172.16.36.135:2121/tcp\
  \ : 220 ProFTPD 1.3.1 Server (Debian) [ffff172.16.36.135]\\r\\n\nBanner on 172.16.36.135:3306/tcp\
  \ : >\\n5.0.51a-3ubuntu5\nBanner on 172.16.36.135:5900/tcp : RFB 003.003\\n\nBanner\
  \ on 172.16.36.135:6697/tcp : irc.Metasploitable.LAN NOTICE AUTH *** Looking up\
  \ your hostname...\\r\\n\n```\n\n通过对输出进行处理，可以从输出中提取 `Banner on` 短语和在整个扫描过程中保持不变的\
  \ IP 地址。我们可以通过 `cut` 冒号和 `on` 单词来提取这些：\n\n```\nroot@KaliLinux:~# amap -B 172.16.36.135\
  \ 1-65535 | grep \"on\" | cut -d \":\" -f 2\n172.16.36.135:22/tcp : SSH-2.0-OpenSSH_4.7p1\
  \ Debian-8ubuntu1\\n\n172.16.36.135:21/tcp : 220 (vsFTPd 2.3.4)\\r\\n\n172.16.36.135:25/tcp\
  \ : 220 metasploitable.localdomain ESMTP Postfix (Ubuntu)\\r\\n\n172.16.36.135:512/tcp\
  \ : Where are you?\\n\n172.16.36.135:1524/tcp : root@metasploitable/#\n172.16.36.135:2121/tcp\
  \ : 220 ProFTPD 1.3.1 Server (Debian) [ffff172.16.36.135]\\r\\n\n172.16.36.135:3306/tcp\
  \ : >\\n5.0.51a-3ubuntu5\n172.16.36.135:5900/tcp : RFB 003.003\\n\n172.16.36.135:6697/tcp\
  \ : irc.Metasploitable.LAN NOTICE AUTH *** Looking up your hostname...\\r\\n\n```\n\
