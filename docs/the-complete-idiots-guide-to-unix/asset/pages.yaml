    # Focal Chords: Managing Multiple Windows


    Once you get down to business with UNIX, you''ll undoubtedly run several windows
    at once. For example, you might open an Xterm window, an instance of Netscape
    Communicator, a file manager, and a text editor simultaneously. Managing all those
    windows can be confusing. That''s what this next section is all about.


    # Killing Can Be Costly


    You should kill processes very spartingly. Killing a process can mean losing your
    work. Moreover, some processes (such as your window manager, for example) are
    essential to certain operations. If you kill a vital process, your system could
    fail. Then, you would be forced to restart.


    # The Current Window


    No matter how many windows you open, only one can be the current window. When
    a window is current, it is said to have focus. While a window has focus, you can
    access objects inside of it using your mouse or keyboard. However, when a window
    loses focus, you can see objects inside of it, you''ll not be able to use them.
    In order to reclaim your ability to use them, you need to give that window focus
    again (or make it the current window). The trick is to know which window is current.


    focus, even though you can see objects inside of it, you''ll not be able to use
    them. In order to reclaim your ability to use them, you need to give that window
    focus again (or make it the current window). The trick is to know which window
    is current.


    In X, the current window''s title bar is highlighted. (It will therefore be distinct
    from the other bars. Typically, it''s a lighter and crisper color than the others.)
    In contrast, windows without focus have a shaded title bar. (See the figure for
    example.)


    In this figure, the current window is the Xgetfile application. There are two
    ways you can quickly identify it as the current window:


    +   - It''s currently on top

    - Its title bar is highlighted


    In contrast, the Crisp text editor window has been shuffled to the back and its
    title bar is shaded.


