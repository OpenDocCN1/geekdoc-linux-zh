  md: 'Eventually, the system will generate an error, complaining about the transceiver
    cable, the boot server, or some other obscure problem. Here''s an example:


    No carrier - transceiver cable problem?


    There can be several reasons for this. One is that the network cable has been
    knocked loose or disconnected. Check to see that the network cable is properly
    attached.


    Another common problem with network boots occurs when the boot server is unavailable.
    Someone may have turned off the machine that runs the boot server or that machine
    may be down for other reasons. To find out, contact the machine''s owner or your
    system administrator.


    Finally, rare instances exist in which the route between you and the boot server
    is down, or the transport hardware is malfunctioning. (From another angle, the
    packets from the boot server might be corrupted or have invalid checksum values.)
    In these cases, contact your network administrator.


    # The Least You Need to Know


    Booting UNIX is usually a pretty simple affair, but it varies, depending on your
    system''s specific configuration. Here are some quick tips on the boot process:


    +   Dumb terminals are usually wired directly to the server. Therefore, to access
    UNIX, you merely need to turn the terminal on.


    +   To start UNIX on an X terminal, give the terminal a nudge by moving the mouse,
    clicking the Start button, pressing the spacebar, or entering the command bt.


    +   To start UNIX on a workstation or PC, turn on the machine and wait 60 seconds
    or so.'
