  md: '# Chapter 18 ► The WWW: Browsers for UNIX


    Communicator''s major drawback is that it''s a very large package and takes well
    over an hour to download standard dial-up lines. However, Communicator''s extended
    features more make up for this minor shortcoming. Netscape Navigator and Communicator
    are available at http://home.netscape.com.


    Pros: Free, user friendly, comprehensive, convenient, and up-to-date.


    Cons: Large in size, takes awhile to download, and eats up a lot of disk space.


    # Lynx


    The University of Kansas

    Distributed Computing Group

    Lawrence, KS 66045

    http://www.ukans.edu/about_lynx/


    Lynx is a text-based browser for UNIX that also runs on the following systems:


    +   - Windows 95

    - Windows NT

    - VMS

    - OS/2


    Now, you may wonder why anyone would develop and maintain a text-based browser.
    After all, with Mosaic, Netscape Navigator, and other graphical browsers available,
    text browsers seem pathetically obsolete. Nevertheless, there are certain instances
    in which text-based browsers are valuable tools.


    For example, many public libraries offer Internet access but only through dumb
    terminals connected to a UNIX server. Effectively, library patrons are using UNIX
    shell accounts. In such an environment, a text-based browser may be the only alternative.


    Also, in environments where onsite developers generate all their help documentation
    in plain HTML, text-based browsers can offer fast, cost-efficient access.


    # Using Lynx


    To use Lynx, issue the lynx command along with a WWW destination address, like
    this:


    ```

    lynx http://www.mcp.com.

    ```


    Lynx will load the requested page, and you can begin surfing. (See the following
    figure.)


