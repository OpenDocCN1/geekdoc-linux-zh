  md: '# # The 20 Most Common Error Messages and Their Causes


    +   ### In This Chapter

    * Common error messages and how to recover from them


    UNIX error messages are in a class by themselves. They''re probably the most cryptic
    error messages you''ll ever encounter. In this chapter, the most common error
    messages are unraveled for your viewing pleasure.


    # ## Command Not Found


    Command not found is probably the most common UNIX error message. What does it
    mean? You invoked a command but UNIX can''t find it. Here are some possible reasons
    why:


    +   * You misspelled the command name.

    * The program is in a different directory (not one in the path). To learn how
    to set your path, refer to Chapter 5, "Surviving Shell Shock."

    * The program you want is missing.


    You can find the problem through the process of elimination. First, check your
    spelling. Better than half of all errors are caused by typos. If that doesn''t
    work, try issuing the command with the full absolute path. For example, instead
    of using this:


    ```

    pico filename

    ```


    Try using this instead:'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Part 6 Troubleshooting


    /usr/local/bin/pico filename


    If you don''t know the full path, try finding it. If the file is a system binary,
    for example, you can probably find it quickly using the following command:


    ```

    whereis command

    ```


    If the whereis database hasn''t been built (or if whereis cannot find the file),
    try searching the entire disk:


    ```

    cd /

    find . -name "command"

    ```


    If you search the entire disk and still can''t find the command, it probably doesn''t
    exist or has been deleted.


    ![](img/b0bfb2d724c393178bf462832858a65d_349_0.png)


    > Relax and Take a Break


    If you use the find command as described, you should pull up a chair and relax.
    On many systems, a full find search can take up to three minutes. In fact, if
    you try this over a modem connection to your Internet Service Provider, you could
    be waiting five minutes or more. Many ISPs have hard disk drives that are dozens
    of gigabytes in size. find can take a while to traverse all those directories.
    Additionally, conducting find queries over a network can take forever, depending
    on the target host''s system load.


    # No Such File or Directory


    If you receive the No such file or directory error, you requested statistics on
    a file UNIX can''t find. Here are a few possible reasons why:


    +   You misspelled the filename.

    * The file is located in a different directory.

    * The file doesn''t exist.

    * UNIX doesn''t like you. (Just kidding.)


    First, retyping your command, being careful to spell the filename correctly (be
    sure to check for case, as well). If that doesn''t work, try locating the file
    and using the absolute path when calling it.


    326'
