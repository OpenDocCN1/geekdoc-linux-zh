    # Boot Problems


    When working with computers (even when performing relatively simple tasks), you
    can encounter problems. These problems are most frustrating when they occur at
    boot time. This next section gives hints on various boot problems and their solutions.


    # Problems Booting from a Floppy Disk


    Problems when booting from a floppy are pretty rare. They can happen, though,
    for several reasons:


    +   - The floppy disk isn''t working.

    - The floppy disk is corrupted or not bootable.

    - You specified the wrong directory or disk volume.


    First, check to see whether the floppy disk is installed correctly. In particular,
    you should check for the flamflam problem (Couldn''t I have thought up a more
    technical-sounding term? Probably, but I think this term describes the problem
    perfectly.) The flamflam occurs when the floppy drive is inserted upside down
    into the drive. On PCs, this will be pretty obvious, because the floppy drive''s
    light will stay on indefinitely. The solution is to take out the cable, flip it
    upside down, and reinsert it.


    On the other hand, if you''ve used the box before and the floppy suddenly crops
    up, the disk itself may be corrupted or simply not bootable. If you have another
    machine nearby, verifying the disk helps. If there are no errors on the disk,
    the disk might not be bootable. (These conditions are an excellent argument for
    always having more than one backup boot disk. That way, if your original boot
    disk is damaged, you can still use your system without having to reinstall or
    boot from installation.)


    Finally, if the boot procedure requires you to enter boot parameters, you might
    fumble these miserably. (Don''t take it to heart, though. I do it all the time.
    It''s very easy to make typos, and even the slightest typo can produce catastrophic
    results.) Check to see that you specified the right directory or target disk volume.'
