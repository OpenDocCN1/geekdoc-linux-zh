    # In This Chapter


    +   - Processing text in UNIX

    - Learning about different UNIX text editors


    Back when Bell Labs engineers were designing UNIX, word processors didn''t exist.
    In fact, the closest thing to a word processor probably wore a suit and tie (or
    a skirt and stockings) and packed a mean set of typing fingers. (Have Smith-Corona,
    will travel.) Seriously, though. In those days, even tasks such as formatting
    and printing a book were done largely by human hands.


    Similarly, windowing systems didn''t exist, so users had to interface with their
    computers in a command-line, plain text environment. It was in this climate that
    UNIX flourished; hence, many UNIX utilities still rely on plain text databases,
    log files, and configuration files. Therefore, as you use UNIX, you''ll find yourself
    dealing with plain text more and more.


    In this chapter, you''ll learn about tools that can help you process plain text
    effectively.


    # Text Support


    UNIX has very extensive support for text processing. So extensive, in fact, that
    modern distributions of UNIX still include a line editor. (A line editor is a
    text-editing tool that can operate on one line at a time from the line editor.)
    Such tools have faded from existence on most platforms, having been replaced by
    powerful word processors'
