  md: '# The Least You Need to Know


    Windows in X can provide you with a very friendly work environment. Controlling
    them with your mouse and keyboard is easy once you master the simple tricks listed
    here:


    +   - To quickly gain control of a window, click the window menu.

    - To move a window, grab its title bar and drag it.

    - To resize a window, grab a border and drag it.

    - To minimize or maximize a window, click the appropriate buttons in the window''s
    upper-right corner.

    - To destroy a window that refuses to leave, get a process list (ps -a) and send
    a kill signal to that process (kill process_number).'
