  md: 'For example, suppose you wanted to search your directory for all filenames
    ending in txt. To do so, you use ls in combination with the asterisk symbol (*),
    like this:


    ```

    ls *txt

    ```


    Here, the asterisk represents an unknown quantity. This command tells UNIX to
    get all files that begin with anything but end in txt, for example:


    +   * Files.txt

    * address_book_txt

    * poem-txt


    You can also use "nest" asterisks in you search. For example, suppose you issue
    the following command:


    ```

    ls t*x*

    ```


    This will match any of the following filenames:


    +   * mytext

    * toxic

    * texan


    Use the asterisk to represent any characters that might appear in a filename.


    # The Question Mark (?)


    The question mark is a little less precise. It matches any single character. For
    example, suppose your directory has these files:


    +   * mc6800

    * mc6800

    * mc680


    On a search, the command ls mc6?? would match only mc680. Likewise, ls mc6???
    would match only mc6800, and ls mc6???? would match only mc68000.


    Therefore, use the ? symbol to restrict your wildcard to matching a finite number
    of characters. (Use one for each character.)


    # ! The Bang Character: Matches? Not!


    The bang character (AKA the exclamation point) also serves a special function.
    In many programming languages (including shell language), the bang character is
    used to express the word "not". In filename pattern matching, the bang character
    does just just that.'
