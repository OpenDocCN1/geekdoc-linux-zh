  md: '# mail


    Purpose: mail allows you to send and receive email.


    **Example:** cat myfile.txt ; mail bwagner. This will mail me the contents of
    myfile.txt. (mail can also be used interactively, simply by issuing the command
    mail. To learn more about mail, see Chapter 18.)


