    # Can''t We All Just Get Along?


    You only need to speak with a few computer users to recognize this: they''re very
    cliquish. Every user thinks that his or her operating system is the best. In fact,
    on the Internet, this debate has sparked extensive ideological lines. (For many
    folks, comput-er use isn''t just a hobby—it''s a way of life.)


    Typically, ideological lines are drawn along system architectures. Eloquent Internet
    warriors often coin or stock phrases to sum up their feelings about this or that
    operating system: “Mac rule and PCs drool” and “WinDoze sucks.” The deratory comments
    are as endless as they are colorful.


    In the operating system wars, however, the strangest participants are UNIX users.
    Here''s why: In addition to warring with Mac, Windows, and OS/2 users, UNIX adv-ocates
    also war with themselves. You see, all the various flavors of UNIX are different.
    In this chapter, I''ll attempt to explain the rather convoluted world of UNIX
    flavors.'
