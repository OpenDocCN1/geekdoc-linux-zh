    # Logging Out


    So far, you learned the following tasks:


    +   - How to log in


    +   - How to identify your hardware and software


    +   - How to identify and locate yourself and others


    What remains learning how to log out. You''ll be happy to know that logging out
    is much easier than logging in. You can log out in three ways. One is to issue
    the logout command:


    ```

    logout

    ```


    Another is to issue the exit command:


    ```

    exit

    ```


    And finally, you can also log out using the key combination CTRL+D.


    # Limiting the Output of last


    If a user logs in frequently, her last report can be many pages long. You podrás
    only want the most recent entries, which are listed first. To limit the number
    of entries you receive, add a dash (-) and a number after your command, like this:


    ```

