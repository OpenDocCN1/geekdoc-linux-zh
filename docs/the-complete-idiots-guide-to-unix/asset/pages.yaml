  md: '# Chapter 7 Regular and Not-So-Regular Expressions


    # Metacharacter


    # Purpose


    The pipe is used to separate alternate regular expressions. Essentially, this
    symbol is used as an OR operator. (You can stack pipes, too. For example, to find
    the words mary, had, little, or lamb, you can “pipe” them together, like this:
    mary|had|little|lamb.)


    The plus metacharacter matches any instance of the preceding character.


    Not only can you search for strings in files, you can also specify their position.
    For example, you can specify that you only want matches the string appears at
    the beginning or end of a line. Let''s briefly take a look at how this works.


    # Matching Strings at the Beginning of a Line


    To find a text string at the beginning of a line, use the ^ (caret) metacharacter.
    Here''s an example:


    ```

    grep ''^Harry'' *

    ```


    This will match all lines that begin with Harry.


    Additionally, you can mix and match with wildcards. For example, suppose you want
    to search for lines that begin with either Harry or Harold. You would issue this
    command:


    ```

    grep ''^Har.*''

    ```


    This will match all lines that begin with Har followed by any characters. Note
    the use of the period (.) symbol, which will match any character. Furthermore,
    you can position several wildcards in your search. For example, this command will
    also match Harry and Harold at the beginning of a line:


    ```

    grep ''^.ar.* *

    ```


    Unfortunately, however, grep ''^.ar.*'' is a little too broad, because it will
    also match many other strings, including these:


    +   - Cars

    - Mars

    - Bars


    Therefore, you should exercise restraint when using wildcard metacharacters. The
    purpose of regular expression searching is to eliminate all but the most relevant
    matches. Wildcards can expand your search a little or a lot, depending on how
    many you use and how you position them.'
