  md: '# Chapter 24 ➤ The 20 Most Common Error Messages and Their Causes


    # Argument List Too Long


    Almost every UNIX command will take multiple command-line arguments. For example,
    cat will display a list of files if you issue the following command:


    ```

    cat file1 file2 file3

    ```


    However, since UNIX commands limits the number of arguments you can use. If you
    receive the Argument list too long error, you exceeded the maximum allowable number
    of arguments. For this, a simple solution is: Use fewer arguments.


    # Cannot Access (Cannot Open, No Such File or Directory)


    If you receive the Cannot access error (or any variation of it), UNIX cannot find
    the specified file. Here are some possible reasons why:


    +   - You misspelled the file''s name.

    - The file exists, but it''s in another directory.

    - The specified file doesn''t exist.


    First, check your spelling and case; then try again. If that doesn''t work, try
    using the file''s absolute path. If this also fails, the file may be missing,
    or you might not have the necessary permissions to view the file.


    # Cross-device Link (Different File System)


    If you receive the Cross-device link error, in ln cannot link the specified directory.


    You receive the Cross-device link error when you try to create a link but UNIX
    can''t find the source directory. Here are a few possible reasons why:


    +   - You misspelled the source or destination directory name.

    - The specified file system doesn''t exist.

    - The source directory doesn''t exist

    - Your system doesn''t support linking


    As always, you should check your spelling and try again. If that doesn''t work,
    make sure the source directory exists and that your system supports linking. First,
    though, you should make sure you have adequate permissions to create the link.


    # Login Incorrect


    You receive the Login incorrect error when UNIX cannot verify your identity. Here
    are some possible reasons why:'
