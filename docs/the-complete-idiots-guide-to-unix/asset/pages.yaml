  md: '# Part 5 > System Administration


    # vipw: An Editor for passwd


    ![](img/b0bfb2d724c393178bf462832858a65d_329_0.png)


    vipw is a simple tool for editing the passwd file. Its advantage is this: vipw
    will not save a passwd file that has a corrupted root entry. Because of this,
    vipw guards against root passwd lockouts. This is very important (This can prevent
    you from doing really silly, like accidentally bungling the root entry.)


    Warning


    vipw behaves just like vi. If you don''t know how to use vi, do not use vipw to
    edit the passwd file. There''s a strong chance that if you have no experience
    with vi, you could potentially mangle the passwd entries. Also, vipw only checks
    for root entry integrity, you might accidentally lock out others.


    Whichever editor you ultimately use, the procedure goes like this: The jump to
    the end of the passwd file is to add a new line. That new line will be constructed
    as follows:


    ```

    username:blank-password:userid:groupid:real-

    name:home-directory:shell

    ```


    During this process, you have to carefully choose both the user ID (UID) and group
    ID (GID). Let''s


    briefly discuss those now.


    # The User ID: UID


    The UID can be any number between 0 and 32767. However, in general, you should
    make the UID greater than 100 but less than 19000. As long as the number is unique,
    however, it will suffice.


    # The Group ID: GID


    Likewise, the GID can be any number between 0 and 32767. However, you should check
    /etc/groups to see which groups already exist. It''s best to add new users to
    a group that already exists. This way, you can make changes to that group, the
    changes affect all users in the group (This makes your life much easier.) Here
    are the contents of a typical /etc/group file:


    ```

    root::0

    other::1:

    bin::2:root,bin,daemon

    sys::3:root,bin,sys,adm

    adm::4:root,adm,daemon

    uucp::5:root,uucp

    mail::6:root

    tty::7:root,tty,adm

    lp::8:root,lp,adm

    nuucp::9:root,nuucp

    staff::10:

    daemon::12:root,daemon

    ```


    # 306'
