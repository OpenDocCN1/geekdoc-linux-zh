    files to controlling a wild X session, the advice you need is here. You''ll also
    find the meaning of life ... or at least how to live in the land of the cryptic
    UNIX error message. Twenty of the most common are deciphered here for you. So,
    brave pilgrim, you may continue on your journey with confidence.


