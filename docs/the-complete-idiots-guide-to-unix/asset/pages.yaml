    # Advanced awk


    Simple awk commands are useful when you want a quick view of static data. However,
    suppose you want to actually derive reports from that data. For this, you should
    learn the fundamentals of awk scripting. Although this might sound very intimidating,
    you''ll be pleasantly surprised to discover that no magic is involved (at least,
    not when scripting simple tasks).


    Suppose you had a file called records.txt in which you kept track of four values:


    +   Each department in your company

    How many workstations each department has

    How many employees each department has

    How many hours a week the workstations are used


    Assume that records.txt has the following contents:


    | Accounting | 5 | 5 | 30 |

    | Development | 17 | 20 | 40 |

    | Marketing | 5 | 3 | 10 |


    To extract a report from records.txt, you create an awk script. This is a plain
    text file that holds multiple awk commands. For example, let''s suppose you want
    to extract report from records.txt in tabular form. You want the data to be formatted
    in nice, clean tables, like this:


    | Department: | Accounting |

    | Workstations: | 5 |

    | Employees: | 5 |

    | Hours: | 30 |


    92'
  merge: -1
