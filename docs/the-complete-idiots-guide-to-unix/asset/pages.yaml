- img_proc: true
  md: '# Table 13.1. Some Xterm command-line options


    | Option | Purpose |

    | -b border-width | Use the -b option to set the Xterm''s inner border width (the
    space between the inside border and the text that appears in the Xterm window).
    The border width is assigned with a number. For example, xterm -b sets a border
    width of 5. (The default is 2.) |

    | -bg color | -bg stands for background. Use the -bg option to set your Xterm''s
    background color. For example, to create an Xterm with a white foreground and
    a black background, issue the following command: xterm -fg white -bg black. |

    | -C | -C stands for console. Use the -C option when you''re using your Xterm
    to monitor system measures. (Any Xterm created with the -C receives console output.)
    |

    | -e program | The -e option is probably the most important option of all. Use
    the -e option to execute and run an application inside an Xterm window. For example,
    to run pine in an Xterm window, issue the following command: xterm -e pine. One
    important note, though: this option must be the last Xterm option specified on
    the command line. (Any arguments or options that follow -e program will be interpreted
    as arguments to program, not to Xterm.) |

    | -fb font | -fb stands for bold font. Use the -fb switch to specify which font
    Xterm should use when displaying bolded text. Here''s an example: xterm -fb 7x14.
    |

    | -fg color | -fg option stands for foreground color. For example, to produce
    an Xterm with red text, issue the following command: xterm -fg red. |

    | -font font-name | Use the -font option to set your Xterm''s font. For example,
    to set a relatively large font, issue the following command: xterm -font 7x14.
    The -font option is equivalent to the -fn option. Both specify which font is used
    in regular display text. |

    | -geometry # | Use the -geometry option to set your Xterm''s size. For example,
    to set a relatively small Xterm window, issue the following command: xterm -geometry
    200x200. |

    | -help | The -help calls Xterm''s usage summary. This is a listing of possible
    options and how you should use them. (When you use this command-line option, no
    Xterm is actually spawned.) To get Xterm help, here, issue the following command:
    xterm -help. |'
