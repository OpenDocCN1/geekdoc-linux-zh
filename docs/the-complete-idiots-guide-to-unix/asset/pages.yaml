    ![](img/b0bfb2d724c393178bf462832858a65d_271_0.png)


    # What the Heck Is an API?


    API stands for application program interface. APIs specify all the allowable rules
    and function calls available to a programmer. Using these rules and function calls,
    the programmer can request an application (or operating system) to perform a particular
    task. In most proprietary software packages, at least some (probably not all)
    of the API is published and publicly available. By making their APIs publicly
    available, software manufacturers allow programmers and users to access special
    functions that enhance the software''s functionality. (These enhancements typically
    exceed the application''s off-the-shelf functionality.)


