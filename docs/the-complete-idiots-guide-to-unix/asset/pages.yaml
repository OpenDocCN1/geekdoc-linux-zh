- img_proc: true
  md: '# Part 4 > UNIX''s Net Worth


    That''s just one example of many. Since 1974, UNIX has been used to internetwork
    almost anything you can think of.


    # Why Use UNIX?


    Because UNIX and the Internet developed together, UNIX is an excellent platform
    from which to access the Net. There are several reasons for this.


    First, most UNIX distributions provide both clients and servers for all the following
    information services:


    +   - Email

    - FTP

    - Gopher

    - HTTP

    - IRC

    - Telnet

    - TFTP


    In addition, UNIX provides the means for running programs remotely, both from
    command-line mode and in X. (This is something that still hasn''t been perfected
    in the Windows/Mac OS world.)


    Finally—and this is a major plus—UNIX can provide excellent Internet connectivity
    while still meager system resources (in other words, if you have an older machine,
    you can still enjoy fast, efficient Internet access).


    Moreover, although you might not appreciate it right now, you''ll eventually discover
    that UNIX is absolutely unmatched when it comes to automating online tasks.


    # Connecting to the Internet


    UNIX provides several types of Internet connectivity and several ways to achieve
    it. These are the most common:


    +   - Direct connection—This is a 24-hour-a-day connection, usually achieved through
    high-speed digital lines. For example, your connection may be via Ethernet through
    a T1 (1.5Mbps) or T3 (10Mbps to 45Mbps) digital telephone line. This is common
    in corporate environments. Other connections include ISDN, fiber optics, Asynchronous
    Digital Subscriber Line (ASDL), and wireless. Using a direct connection means
    you have a permanent, or static, IP address and perhaps a hostname.

    - Point-to-Point connection—This is typically a PPP connection over analog telephone
    lines. This is the most common connection type and is often offered by Internet
    Service Providers. With most PPP connections, you''re assigned a temporary, or
    dynamic, IP address. This address is only yours while you''re connected.


    214'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Chapter 16 > UNIX and the Internet


    +   Dial-up connection—Dial-up connections are rare nowadays. In a dial-up connection,
    you dial a UNIX server and connect to one of its serial ports. For all purposes,
    this type of connection behaves precisely like stringing a serial cable from your
    machine to the remote host. This is the oldest and least desirable way to hook
    up.


    The process of configuring these connections works differently on different UNIX
    flavors. For this reason, it''s possible for me to provide a generic description
    of connecting. However, the next section provides some tips that might help.


    # Direct Connections


    In a direct connection, you''ll invariably be connected via Ethernet. Usually,
    this involves a cable running from your machine to a hub. The cable will have
    an end resembling a television cable wire (BNC) or an oversized telephone jack
    (RJ45). In either case, if you have a connection, rejoice. It''s probably very
    fast.


    In direct connections, you need to do very little (and perhaps nothing) to get
    up and running. In most cases, your system administrator has already assigned
    your workstation IP address. The only problem you might run into is that you may
    need to identify your name server.


    Name servers are machines that translate hostnames (www.somewhere.net) to IP addresses
    (207.171.0.111). If your workstation cannot reach a name server, your host lookups
    will fail. This is a critical problem.


    To find out whether a name server has been specified, check the /etc/resolv.conf
    file, like:


    ```

    more /resolv.conf

    ```


    If the /etc/resolv.conf file is empty or missing, contact your system administrator.
    He she will fix it for you. On the other hand, if you are the system administrator,
    you can fix it yourself. To do so, edit the /etc/resolv.conf file and enter the
    name server''s address.


    # PPP Connections


    PPP connections are notoriously difficult to establish using the default tools
    available on most UNIX flavors. Therefore, I recommend getting ppp.


    # ppp


    ppp greatly simplifies connecting to the Internet and currently supports the following
    platforms:


    215'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Part 4 > UNIX''s Net Worth


    +   > AIX 4.x

    > Digital UNIX

    > Linux

    > NetBSD, FreeBSD

    > NeXTStep

    > OSF/1

    > Solaris 2

    > SunOS 4.x

    > Ultrix 4.x


    ppp automate the process of logging on and reduces the time you''ll spend configuring
    your machine. Certainly, most of the listed platforms have their own PPP services,
    but they''re notoriously difficult to configure.


    For example, getting PPP running on older Solaris boxes encompasses a document
    some 30 pages long. During the process of configuration, you will need to alter
    many files that are difficult to understand. To avoid this, you should use ppp.


    # Getting ppp


    Now I''m going to do something that authors do all the time: propose an impossible
    proposition. Authors routinely write about tools for connecting to the Net. The
    problem is, they tell you that you need to get these tools from the Net. That''s
    a bit silly, isn''t it? After all, if you were already connected, you wouldn''t
    need the tools in the first place, right?


    In any event, ppp is available at http://cs.anu.edu.au/pub/software/ppp/


    # Setting Up ppp


    Setting up ppp is very simple. In the ppp distribution, there''s an executable
    file pppd, which is used to automate logons. Here''s a sample pppd login script,
    which I call ppp-on:


    ```

    pppd /dev/cua1 38400 connect "chat -v " ATDT5555555 CONNECT "

    -login: "username" "word: "myppassword" modem defaultroutte

    ```


    Let''s break the script down, by bit by.


    First, the script calls the program pppd and specifies the device to use for dialing:


    ```

    pppd /dev/cua1

    ```


    In this case, /dev/cua1 is the first modem. (The device node for your modem may
    differ from this. Check your system configuration to determine the correct device
    file.)


    # 216'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Chapter 16 > UNIX and the Internet


    Next, the script specifies the modem speed and signals that this is a connection
    process:


    38400 connect


    Next, the script starts chat " " (verbose mode) and handles the dial-up and logon:


    ```

    chat -v ATDT5555555 CONNECT " "ogin": "username" "word:"

    mypassword"

    ```


    Finally, the script specifies that the route should be used. (This signals the
    system to use whatever IP addresses are assigned at connection time).


    If this seems complicated, don''t use the script, follow these instructions:


    +   1. Copy the script verbatim into a plain text file named ppp-on.

    2. Replace username with your login name.

    3. Replace mypassword with your login password.

    4. Replace 5555555 with your own dial-up number.

    5. Make ppp-on executable (chmod +x ppp-on).

    6. Run ppp-on (ppp-on &).


    > Note

    in this script, "Login" and "Password" have been truncated to "ogin" and "word,"
    because some servers issue login and password prompts with the first letter capitalized
    (Login, Password) and some don''t (login, password).


    That''s it. You''ll hear your modem dial out and connect. Several moments will
    pass and your hard disk drive will will fall silent. At this point, you can check
    to see whether your connection is ready. Try this command:


    ```

    ping 198.41.0.8

    ```


    If your connection is up, you''ll see a message very similar to this:


    ```

    Reply from 198.41.0.8: bytes=32 time=238ms TTL=249

    Reply from 198.41.0.8: bytes=32 time=260ms TTL=249

    Reply from 198.41.0.8: bytes=32 time=243ms TTL=249

    Reply from 198.41.0.8: bytes=32 time=231ms TTL=249

    ```


    Or even this:


    ```

    198.41.0.8 is alive.

    ```


    Now you know your connection is alive.


    # 217'
