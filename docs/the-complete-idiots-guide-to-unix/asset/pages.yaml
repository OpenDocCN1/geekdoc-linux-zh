  md: '# Part 2 > Nuts and Bolts


    Now, you could use grep to find out how many hours an employee worked, like this:


    ```

    grep Jack hours.txt

    ```


    Here''s the output:


    ```

    Jack, Programming Department, 43

    ```


    That''s great. However, suppose you need different information. For example, suppose
    you want to extract only the hours worked. In this case, grep wouldn''t be very
    useful. You''d be better off using awk.


    awk splits lines of input or output into fields automatically, provided those
    fields are separated by some common denominator. For example, suppose you want
    to pull all current processes. You might issue this command:


    ```

    ps -a

    ```


    Here''s the output:


    | PID TTY | CMD |

    |---|---|

    | 15529 pts/26 | 0:00 sz |

    | 19013 pts/1 | 0:00 telnet |

    | 19249 pts/3 | 0:00 pine |

    | 19264 pts/0 | 0:00 ps |

    | 17804 pts/4 | 0:06 pine |


    In this output, four fields are separated by whitespace. This whitespace consistently
    separates all fields and is therefore your common denominator.


    Suppose you only want the last field. You could use awk to extract it, like this:


    ```

    ps -a | awk ''{print $4}''

    ```


    Now, instead of a full listing, you would get this:


    ```

    CMD

    sz

    telnet

    pine

    ps

    mv

    sh

    pine

    ```


    In fact, you could even trim the CMD header by issuing the following command:


    ```

    ps -a | awk ''{print $4}'' | grep -v CMD

    ```


    90'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Chapter 7 > Regular and Not-So-Regular Expressions


    Here’s the output:


    ```

    sz

    telnet

    pine

    vi

    ps

    sh

    pine

    ```


    So, awk automatically breaks words separated by whitespace into fields—but that’s
    just the beginning, awk doesn’t necessarily have to read whitespace as a field
    delimiter. You can tell awk to use any character as a delimiter by using the -F
    flag.


    Let’s go back to the employee hour database. Here’s what it looks like:


    ```

    Jack, Programming Department, 43

    Susan, Marketing Department, 20

    Jonathan, Vice President, 5

    ```


    Note that the file has a uniform structure—it contains three fields and a comma
    separates each. To extract those fields, you must take three steps.


    First, you will tell awk to use commas as field delimiters, like this:


    ```

    awk -F,

    ```


    Next, you specify the field you want to print (in this case, the hours), like
    this:


    ```

    ''{print $3}''

    ```


    Lastly, you specify the filename:


    ```

    hours.txt

    ```


    The entire command line looks like this:


    ```

    awk -F, ''{print $3}'' hours.txt

    ```


    Here’s the output:


    ```

    43

    20

    5

    ```


    Also, you can choose different fields. For example, to extract employee names,
    you’d switch to field 1:


    ```

    awk -F, ''{print $1}'' hours.txt

    ```


