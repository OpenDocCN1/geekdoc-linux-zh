- img_proc: true
  md: '# The Least You Need to Know


    UNIX is a very powerful and complex operating system. In order to avoid as much
    frustration as possible when you''re learning it, here''s the least you need to
    know:


    +   - Perform backups regularly to avoid data loss.

    - Always preserve a copy of your passwd file.

    - Be extremely careful when using destructive commands.

    - Use asterisks or other wildcards sparingly and carefully.

    - Always try to ascertain foreign terminal types.

    - Don''t panic!'
