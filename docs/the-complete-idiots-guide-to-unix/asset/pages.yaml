    To bring any window into focus, simply click its title bar. (In some window managers,
    you can either single- or double-click its border).


    ![](img/b0bfb2d724c393178bf462832858a65d_187_0.png)


    # We''re Not Quite Out of Focus Yet


    There are other methods for giving a window focus. In Motif, you can place your
    mouse cursor over the desired window and hit Alt+F1. On Sparc systems (where you''re
    using OpenWindows), you can place your cursor over the desired window and press
    Front key on your keyboard. On first examination, it might seem silly to include
    these extra methods. After, if you were too lazy to click a window''s title bar,
    you''d hardly go through the laborious process of using Function keys. these extra
    means of focusing windows have a very practical application. If your mouse fails
    for any reason, you can still catch a window and try to save your work by continuing
    with Function keys.


    # Special Situations: Windows and Focus


    In some instances, you don''t have to click the title bar of a window to bring
    it into focus. In one instance is where you have two windows side by side. As
    long as these windows don''t overlap, you can make either of them current by moving
    your mouse over them.


    Finally, to give a window focus, you can also click (or double-click) its borders.


    ![](img/b0bfb2d724c393178bf462832858a65d_187_1.png)


    # Using Your Mouse to Focus


    Moving your mouse over nonoverlapping windows will generally change window focus.
    However, in a minority of cases, this may not work. Here''s why: Window manager
    configurations are very flexible. It''s possible to set this option in the configuration
    files. The two settings are click-to-focus and mouse-focus. In click-to-focus,
    you cannot make a window current without clicking it. In mouse-focus, merely moving
    your mouse into a window''s work area will do the trick. Most default window manager
    configurations adhere to mouse-focus possible. If you try this and it doesn''t
    work, you''ll have to revert to clicking for focus.


