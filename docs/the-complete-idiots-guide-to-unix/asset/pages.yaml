    # When Is a Good Time to Back Up?


    You''re probably wondering how often you should perform a backup. That depends
    on.

    You''re using UNIX for business purposes, you should back up every day, archiving

    ith these resources:


    +   * User directories and files

    * Any changes to your business documents and databases

    * All logs


    I recommend having several copies: for example, one for the office, one for the
    safe,

    and for safekeeping elsewhere. (Fire safes are not secure. In a fire, your backup

    tapes will melt, even when deposited in a fire safe.)


    In addition, these days, better solutions than backup tapes or backup floppies
    exist.

    Instead, you should consider write-once media as CD-ROMs or floptical drives.

    Not only are these more durable and more reliable (tapes can break or get stretched

    out), but write-once media guarantees against tampering. If you have any security

    concerns, this is a must.


    If, on the other hand, you''re not using UNIX for business purposes, you should
    still

    back up weekly.


    # Corrupting the passwd file


    The next most critical mistake you can make is to corrupt the /etc/passwd file.
    Here

    why: Anytime a login takes place, UNIX checks the passwd file to verify the user''s

    identity. If it is corrupted, UNIX will refuse to let that user in (Even booting

    ing single user mode may not work.)


    Most often, corruption takes place when you edit the passwd file and accidentally

    a typographical error. (Other possibilities include deleting the file, replacing
    it,

    or inadvertently damaging it.)


    To hedge against this, you should be extra careful when editing the passwd file.

    Moreover, you should always retain at least one backup copy. (Store this backup
    copy

    on a floppy disk in a safe place.)


    If you have no backup of your passwd file, don''t panic. You can still restore
    a basic\passwd file using your installation media. (All installation packages
    contain a very

    sparse passwd file.) The problem is that you have to find the passwd file.


    # 314'
