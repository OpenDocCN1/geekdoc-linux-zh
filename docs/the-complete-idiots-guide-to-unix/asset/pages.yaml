  md: '# ### In This Chapter


    +   - Getting command-line help

    - Getting real help

    - Manipulating text


    It never fails. No matter how much computing experience you have, eventually you''ll
    find yourself staring blankly at the screen. Usually, this happens when you can''t
    remember how to use a particular command (or when you receive a cryptic error
    that doesn''t even remotely explain the problem). At that precise moment, you
    need help. That''s what this chapter is all about.


    # Help on UNIX


    By now, you''ve probably discovered that UNIX is a little different than any other
    operating system. UNIX programmers are often busy folks, so when UNIX reports
    an error, the explanation can be pretty bare. Let''s try to remedy that.


    Most UNIX commands have a built-in help mechanism, sometimes referred to as the
    *usage summary*. A typical usage summary explains what command-line flags exist
    and how to use them.


    In a pinch, usage summaries can refresh your memory about how a particular command
    works. However, getting a usage summary is sometimes more complicated than you''d
    think.'
