    ![](img/b0bfb2d724c393178bf462832858a65d_205_0.png)


    Newer Monitors Will Warn You Before They Blow Up


    Many modern monitors give you some indication that something''s amiss. For example,
    if you set your frequency and resolution incorrectly, X will not start and the
    monitor will go into a protective mode. From there, a message will flash on the
    screen repeatedly. Usually, it says something like: "Out of Range! or "Danger,
    Will Robinson Danger!" (Additionally, some monitors will beep loudly if they''re
    equipped with speakers).


    # Troubleshooting Applications in X


    From time to time, you may encounter problems with X applications. This listing
    covers some common problems and how to solve them:


    +   Application lock—If an application locks up (and remains unresponsive), try
    killing it by invoking its window menu and choosing Quit, Delete, or Destroy.
    If this doesn''t work, pull a process (ps), and kill the process.


    +   Color problems—Linux and SolarisX86 users beware: Both Linux and SolarisX86
    (especially older versions) support only a limited number of video adapters. If
    yours is not supported, you may be forced to install with only 8-bit color (or
    generic VGA). If so, many applications will either not load or they''ll warn that
    the driver cannot generate all the colors for the current application. In such
    cases, your display may look odd in some applications. (Netscape Navigator is
    a good example. With lower resolutions, though will appear grainy or washed out.)
    This is not a problem with your computer; you have limited color capabilities.
    The only real cure for this is to purchase a supported video card.


    +   Complete freeze-up—X may freeze up. You''ll know it, too, because none of
    your windows will respond to either mouse events or keyboard strokes. If you encounter
    this situation, hold down the Ctrl key and press the backspace key. X will immediately
    die, and you''ll find yourself at a shell prompt. From there, you can investigate
    further.


    182'
