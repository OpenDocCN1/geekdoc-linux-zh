  md: '# Chapter 14 > Cool Programs for


    # Wasn''t Archie a Cartoon Character?


    Archie is an archiving service. Here''s how it works: FTP server administrators
    from all over the world report their drive contents to centralized Archie servers.
    You can search these servers to find files in different countries. Although Archie
    servers are less prevalent in the United States, they remain a mainstay of Internet
    computing in many countries.


    Of course, Archie wouldn''t be complete unless accompanied by Veronica and Jughead.
    Veronica is the Gopher equivalent to Archie. Using Veronica, you can search Gopher
    servers (although Jughead is not quite as powerful). The difference is this: Veronica
    is generally used to search many Gopher servers simultaneously. In contrast, Jughead
    is most often used to search a single Gopher server.


    For example, suppose you need to find a program that was once freeware and is
    now commercial. Or, you need an old version of a particular program or programming
    language. You could spend hours or even days to find it on the Web. Therefore,
    you should use Archie instead.


    Here''s one of the most valuable tips you''ll ever get in a book: Whereas Americans
    routinely discard programs for the latest and greatest versions, many other folks
    don''t. Particularly in Eastern Europe and Asia, users may lack the necessary
    resources to purchase brand-spanning-new software. Therefore they archive useful,
    older software on their FTP sites. If you''t find an antiquated software version
    on the Web, there''s a four out of five chance you''ll find it in Archie.


    The problem with Archie servers, however, is that accessing them is a pain. The
    archaic method is to Telnet to Archie. sura.net and connect your query in a text-based
    environment. It is no longer true. Archie simplifies the process considerably.


    Archie was built using the old Athena Widget and is therefore light-weight. Furthermore,
    its interface is simple and easy to understand. (See the following.)


    Finding a file takes just seconds. What''s more, Archie is loaded with dozens
    of Archie addresses from all over the world. Therefore, if you can''t find your
    file in England, Finland, Taiwan, Korea, and so on. Eventually, you''ll find the
    right server. In all in, Archie is an excellent tool. You can find Archie at http://sunsite.nc.edu/pub/X11/contrib/applications/xarchie-2.0.10.tar.gz.


