  md: '# Chapter 4 > Getting In


    The Unix Shell Prompt


    ![](img/b0bfb2d724c393178bf462832858a65d_64_0.png)


    # The whoami Command: Finding Yourself


    After you log on, you''ll probably want to do something useful. A good start is
    to answer that philosophical question that has plagued humans since time began:
    "Who am I?" Can UNIX help you do this? You bet.


    To find yourself on a UNIX system, issue the following command:


    ```

    $ whoami

    ```


    The answer you receive will look like this:


    ```

    bwagner

    ```


    The whoami command displays your username. Initially, this doesn''t seem very
    useful. After all, you know who you are (unless you''re suffering from amnesia,
    a problem that''s beyond the scope of this book). However, you might sometimes
    use more than one username. When you do, it''s useful to know who you are at any
    particular moment. (You might also want to know who is hanging around—the who
    and finger commands are great for this, so look for them later in the chapter).


    # Who''s Hosting This Party, Anybody?


    Now that you know who you are, you should get acquainted with your machine. On
    UNIX networks, it''s not just users that have names. Machines have names, too.
    (This helps networks to differentiate between them.) UNIX machines are called
    hosts and every machine has a hostname.


    If you''ve used the Internet, you''ve seen hostnames before. Most WWW addresses
    are expressed in hostname form. For example, Macmillan Computer Publishing can
    be reached at this address:


    www.mcp.com


