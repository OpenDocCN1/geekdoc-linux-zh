  md: '# Getting In


    ![](img/b0bfb2d724c393178bf462832858a65d_62_0.png)


    # In This Chapter


    +   - Logging in

    - Identifying your hardware and software

    - Identifying yourself and other users

    - Logging out

    - Changing your password


    # Logging In


    If you ever used a computer before, you probably noticed that most operating systems
    are friendly when approached. (Some even greet you at startup.) UNIX is a little
    different. The following section illustrates how to log in.


    # The login Prompt: Halt! Who Goes There?


    When you first approach a UNIX system, you''re confronted by the login prompt.
    It looks like this:


    ```

    Login:

    ```


    That''s a pretty cryptic salutation if you ask me, but it basically says it all.
    The login prompt is UNIX''s way of saying "Halt! Who goes there?" In other words,
    UNIX is asking you to identify yourself.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'You might wonder why UNIX needs to know your name. (After all, that seems a
    little nosey). There''s a perfectly reasonable explanation: UNIX is a multiuser
    system. Therefore, many different people can use the same machine simultaneously.
    To keep track of all those users (and their files), UNIX requires that each user
    have a name. In UNIX lingo, this name is called your *username* or *UserID*.


    # Entering Your Username


    To log on, you must provide your username followed by a carriage return, like
    this:


    ```

    Login: bwagner <ENTER>

    ```


    ![](img/b0bfb2d724c393178bf462832858a65d_63_0.png)


    # Obtaining a Username and Password


    You receive your username from your system administrator. (Unless of course, you''re
    the system administrator. In that case, you must create your own username, password,
    and even your own account.) More on system administration in Part 5, System Administration.


    # Entering Your Password


    After you provide your password, UNIX will respond with the following prompt:


    Password:


    Here, you enter your password followed by a carriage return. As you do that, you''ll
    notice that even though you type, the text does not appear on the screen. Don''t
    be alarmed. It is a security feature. In UNIX, passwords are never echoed to the
    screen. (This prevents busybodies from peering over your shoulder and discovering
    your password.)


    ![](img/b0bfb2d724c393178bf462832858a65d_63_1.png)


    This feature has a major drawback, though: if you mistype your password, you won''t
    know it until it''s too late. In case, UNIX reverts to the login prompt and you
    have to start again.


    # Typing Your Login and Password


    UNIX is case sensitive. (It differentiates between uppercase and lower case letters.)
    Therefore, BWAGNER is interpreted differently than Bagner or bwagner. If your
    username is lowercase and you enter in uppercase, your login will fail.


    However, when you eventually provide your correct password, you''ll be dropped
    into the UNIX system. At that point, you''ll see the UNIX prompt ($) illustrated
    here.


    Some UNIX systems display a % prompt instead. That''s because they use a different
    command


    interpreter or shell. I''m getting too far ahead. For at least simple tasks, it
    doesn''t matter whether you have a $ prompt or a % prompt.'
