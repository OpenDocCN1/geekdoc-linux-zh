  md: '# # Part 1


    # ## Just the Basic Facts


    You''ve picked up this book, so presumably you have a need to know what UNIX is
    and just what you''ll be dealing with. This beginning section is just the place
    to show you that,, while UNIX can seem intimidating to new users, it doesn''t
    have to overwhelm you.


    Chapter 1 explains what UNIX is, shares a little of its history, and tells you
    just what it''s good for. Chapter 2 breaks down the different versions of UNIX
    that are available, lists the kinds of computer equipment you''ll need to run
    them, and finally shows you where (and how) you can get your own copy of UNIX.
    So if you''re ready, take off your coat and let''s get started!


