  md: '# Chapter 20 > Chatting


    # IRC Commands


    IRC supports an obscene number of commands. Table 20.1 summarizes only the most
    important ones.


    # Table 20.1. Some important IRC commands


    | IRC Command | Purpose |

    |--- |--- |

    | /bye | Use the /bye command to exit IRC. (This is functionally equivalent to
    /quit.) |

    | /clear | Use the /clear command to clear your screen. This is useful when a
    lot of residual text is onscreen (or dozens of messages from different folks make
    it difficult to assimilate the discussion). |

    | /help | Use the /help command to get a list of commands currently available.
    (This doesn''t always give you the full list of IRC commands. Instead, it often
    give you a context-based list, depending on what mode you''re currently in.) |

    | /ignore [user] | The /ignore command is the bozo and knuckle option. Use this
    if you''re being harassed by bozo on the network. To issue the /ignore command
    issue the nickname of the offending party, like this: /ignore joe_stalker. |

    | /invite [user] | Use the /invite command when you want to invite a user to engage
    in a private conversation. To do so, issue the /invite command plus the name of
    the user to converse with, like this: /invite bwagner. |

    | /join [channel] | Use the /join command to join a particular channel. For example,
    to join #unix, issue the following: /join unix |

    | /list | Use the /list command to list all available channels. (Note that on
    many systems, this will only list those available locally. Only on large systems—notably
    university IRC servers—will this list truly available.) Typically, the server
    will list the channels, followed by their discussion topics. |

    | /msg [user] [message] | Use the /msg command to send private messages to a particular
    user. (Private messages are only viewable by the specified recipient.) For example,
    suppose you wanted to tell user1 was a knucklehead. You would issue this command:
    /msg user2 is a real knucklehead, don''t you think? |


    continues


    275'
