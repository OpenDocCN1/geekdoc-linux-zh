  md: '# Part 4 ► UNIX'' Net Worth


    # Replying to a message


    To reply to a message, choose the Reply button on the main menu bar. In response,
    Communicator will spawn a new Compose window. (See the following.)


    The Compose window is for responding to a message.


    ![](img/b0bfb2d724c393178bf462832858a65d_289_0.png)


    Type your response in this window. When you''re done, choose Send. Communicator
    will deliver your message immediately (or nearly immediately).


    # Get the Picture?


    Netscape Communicator''s newsreader makes reading and sending news as easy as
    reading and sending email. But that''s not all. Netscape Communicator''s newsreader
    reads HTML and even can load images. Therefore, when folks see out fancy USENET
    news messages, you''ll be able to see their handiwork. (Many newsreaders interpret
    HTML and cannot load graphics.)


    # Welcome to the Jungle: A USENET Primer


    USENET, if nothing else, is uniquely American. As you''ll see, it''s one of the
    few places where folks actually speak their mind without hesitation. This has
    advantages and disadvantages.


    Free speech is practiced in grand form on USENET. There are no police, there are
    no rules, and USENET junkies take no prisoners. This means that you may often
    encounter people who express radically different from your own. Moreover, they
    may express these views in a rather militant fashion.


    These influences, however, are in the minority. Most USENET traffic is either
    focused (participants have serious, legitimate interests in the subject discussed)
    or fun


    266'
