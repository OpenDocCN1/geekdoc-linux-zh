    # The vi Editing Environment


    The vi screen is divided into two sections. The work area (where you enter and
    edit text) occupies over 90 percent of the screen. In contrast, the status line
    (where statistics are reported and your commands are echoed) is a single line
    at the bottom of the screen.


    When vi first loads, it begins in command mode. While in command mode, vi recognizes
    a wide range of commands to perform searching, cutting, deleting, and inserting.
    You''ll learn those commands momentarily. However, to immediately start typing,
    enter the letter a, like this:


    +   a


    As a result, vi will exit command mode, and you can begin editing your file. While
    you finish editing your file, issue the :wq command, like this:


    ```

    :wq

    ```


    vi will respond by saving your changes and returning you to a prompt.


    # The Power of vi


    Initially, you might think that the only advantage of vi (over ed, for example)
    is that you can see your file''s contents (which doesn''t seem like too much to
    ask.) However, under the hood, vi is extremely powerful.


    At any point, you can enter command mode (by pressing the Esc key) and perform
    a wide range of operations on your file. Table 8.2 lists some important vi commands
    and what they do.'
