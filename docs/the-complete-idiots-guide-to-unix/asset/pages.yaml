    you want to change.

    3. Release the left mouse button

    4. Grab a menu (either from the main menu bar or by right-clicking the screen).

    5. Choose the desired operation.


    # Other textedit Functions


    Table 8.8 describes some more common textedit functions and how to perform them.


    # Table 8.8. textedit functions and how to perform them


