  md: '**working directory** The directory you''re currently in. (You can determine
    your working directory using the command pwd.)


    **workstation** A computer system designed specifically to run UNIX.


    **WWW** The World Wide Web. A worldwide network of computers that are connected
    to the Internet and support HTTP: (See HTTP.)


    **X** A window system (and also a networking protocol) developed by the Massachusetts
    Institute of Technology. X is platform independent and provides highspeed network
    access through the client/server model.


    **Xterm** A terminal window that functions as an X server.


    **XENIX** A name referring to several versions of UNIX, including ones owned by
    Microsoft, Santa Cruz Operation, and Trusted Information Systems.


    **xman** A program for viewing man pages in X. To start xman, open a terminal
    window and issue the following command: xman &.'
