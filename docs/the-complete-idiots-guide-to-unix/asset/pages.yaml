  md: 'Additionally, some versions of UNIX can read (or in certain cases, execute)
    files created on other operating systems. For example, most commercial UNIX distributions
    support files created in MSDOS, and there is even technology that allows you to
    run Microsoft Windows applications in UNIX.


    # What Are Some Advantages of Using UNIX?


    One major advantage of UNIX is that you can reduce your total cost of ownership
    or TCO. TCO is the total amount a computer will cost you in its lifetime.(Machines
    don''t really have lifetimes, cost of use. At least, not that we know of. We use
    that term as a reference. The “lifetime” of a machine when the machine blows up,
    shuts down, or otherwise becomes permanently inoperable.)


    If you used computers for any length of time, you''re familiar with the upgrade
    game. This is a game where your software vendors update their software every year
    or so. When they do, they make that previous versions are rendered obsolete (because
    they can''t decode documents or files created by the new version). Therefore,
    you''re forced to purchase the upgrade. The game is good and has some software
    vendors billions of dollars. (By far, the world champion of the upgrade game is
    Microsoft.)


    ![](img/b0bfb2d724c393178bf462832858a65d_38_0.png)


    PCs for Under $1000? Not!


    What''s the average TCO of a PC? According to Gartner Group (an industry authority),
    your PC will cost you approximately $9,784 before it dies. This figure encompasses
    all the following costs: purchase-administration, technical support, upgrades,
    and repair.(What that figure doesn''t account for is lost productivity. Some studies
    suggest that productivity drops as much as 200 percent when a PC is introduced.)


    In the UNIX world, things work a little different. For the most part, big UNIX
    customers are the government, Internet service providers, and universities. These
    folks don''t like the upgrade game. When they operate an operating system, they
    want that operating system as little as possible. Hence, UNIX vendors ensure stability
    and longevity in their product lines. This leads to cost savings for you.


    UNIX also has other advantages. One is that UNIX can perform most tasks with fewer
    resources than other operating systems. For example, suppose you want to establish
    a mail server on your office network. You can throw UNIX on an old 486 with 8MB
    of RAM and you''re good to go in. Contrast, Windows won''t even install on a machine
    with less 12MB of RAM.


    Finally, UNIX has one last advantage. The UNIX community has always been just
    a little radical. It has a long-standing history of taking commercial applications
    and making free clones. Therefore, on the Internet, you can gain access to thousands
    of free programs that perform as well (or sometimes better) than commercial applications.'
