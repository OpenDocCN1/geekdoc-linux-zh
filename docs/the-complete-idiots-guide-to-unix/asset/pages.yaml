  md: '# Chapter 22 ► So You Want To Run a UNIX Server


    # Table 22.1. The chmod permissions


    | chmod Permission | Explanation |

    |---|---|

    | r | The r character adds or subtracts read permissions. For example, chmod +r
    filename adds the read permission to filename. |

    | w | The w character adds or subtracts write permissions. For example, chmod
    -w filename takes away write permissions from filename. |

    | x | The x character adds or subtracts execute permissions. For example, chmod
    +x filename adds the execute permission to filename. |


    Using letters (r, w, x) to assign permissions on individual files and directories
    is fine. However, sometimes, you''ll want to set permissions for everyone at the
    same time. For example, you may want to set permissions for the file''s owner,
    the owner''s group, and, finally, the rest of the world. For this, it''s easier
    to use the octal system. Let''s discuss how that works.


    # chmod and the Octal System


    In the octal system, permissions are represented by number. Table 22.2 summarizes
    the octal number scheme and what each number represents.


    # Table 22.2. The chmod octal permissions


    | chmod Octal Permission | Explanation |

    |---|---|

    | 0 | The octal value 0 is equivalent to -- (or no permissions at all). |

    | 1 | The octal value 1 is equivalent to --x, (or only execute permissions). |

    | 2 | The octal value 2 is equivalent to -w-, (or only write permissions). |

    | 3 | The octal value 3 is equivalent to r--, (or only read permissions). |

    | 4 | The octal value 4 is equivalent to -wx, (or only write and execute permissions).
    |

    | 5 | The octal value 5 is equivalent to r-x, (or only read and execute permissions).
    |

    | 6 | The octal value 6 is equivalent to rw-, (or only read and write permissions).
    |

    | 7 | The octal value 7 is the whole shebang: it''s equivalent to rwx (or read,
    write, and execute permissions). |


    303'
