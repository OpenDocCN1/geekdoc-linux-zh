  md: '# Chapter 21 > Other Network Services


    +   > ASCII (American Standard Code for Information Interchange)

    mode—This mode is suitable for plain-text files (including HTML files).


    +   > Binary mode—This mode is for files that contain data (such as graphics files
    or compressed programs).


    You need to set the proper mode prior to transfer. If you don''t, you may experience
    unexpected results later. For example, if you transfer a shell script or Perl
    script in binary mode, it may not work correctly when executed. Similarly, if
    you transfer a program file in ASCII mode, it may later fail when executed.


    Most UNIX FTP servers are set to ASCII transfer mode by default. However, to interactively
    set the transfer mode to ASCII, enter the following command at the ftp prompt:


    ```

    ascii

    ```


    Conversely, to set the transfer mode to binary, enter the following command at
    the ftp prompt:


    ```

    bin

    ```


