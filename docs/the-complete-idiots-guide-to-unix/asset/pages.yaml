  md: '# Chapter 13 > Running X and X Applications


    As you can see, menu specifications start with Popup and end with EndPopup. Everything
    in between describes the menu. For example, consider this entry:


    Exec "Big Xterm" exec xterm -fg black -bg white -font 7x14 &


    This places a menu item called Big Xterm on the main menu. When clicked, Big Xterm
    executes the following command:


    ```

    xterm -fg black -bg white -font 7x14 &

    ```


    To add a menu item, simply insert a new line that describes the program. For example,
    you want to run pico in an Xterm window. You might call that menu item PicoWindow.
    To add this to the menu, simply add the following line to the Utilities:


    ```

    Exec "PicoWindow" exec xterm -e pico &

    ```


    Now, your new menu structure has the new PicoWindow entry. Here''s what it looks
    like:


    ```

    # This menu will fire up some common utilities

    Popup "Utilities"

    Title "Utilities"

    Exec "Netscape" exec netscape &

    Exec "PicoWindow" exec xterm -e pico &

    Exec "Xterm" exec xterm -e tcsh &

    Exec "Big Xterm" exec xterm -fg black -bg white -font 7x14 &

    Exec "Top" exec rxvt -T Top -n Top -e top &

    Exec "Calculator" exec xcalc

    Exec "Xman" exec man &

    Nop ""

    Popup "Modules" Module-Popup

    Nop ""

    Popup "Exit Fwm" Quit-Verify

    EndPopup

    ```


    When you restart X, the new PicoWindow menu item will be visible on the menu.
    Click it, and X will load an Xterm with pico running inside. This looks pretty
    simple (and for the most part, it is). However, there are some rules you should
    follow rigorously:


    +   Make backups of original system files—Even before you try to edit a menu configuration
    file, make a backup. This entails nothing more complex than copying the original
    file. For example, if the file is system.fwwmrc issue this command: cp system.fwwmrc
    system.fwwmrc.my-backup. This will store the original system.fwwmrc in system.fwwmrc.my-backup.
    This way, if anything goes wrong, you simply copy the original back again and
    restart X.


    # 179'
