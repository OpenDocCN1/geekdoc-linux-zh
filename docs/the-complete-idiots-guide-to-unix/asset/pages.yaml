  md: '# Copying Files: the cp Command


    To copy a file, use the cp command (which is the UNIX equivalent of the DOS command
    COPY). To do so, you must supply two values: the name of the file you want to
    copy and where you want to copy it to:


    ```

    cp filename1 filename2

    ```


    For example, suppose I wanted to copy the file into a file called tom.backup.
    I would issue the following command:


    ```

    cp tom tom.backup

    ```


    In response, UNIX would create an exact copy of tom. This would be stored in tom.backup
    in the current directory.


    However, you can also use cp to copy files from directory to directory. For example,
    suppose I wanted to copy tom to /usr. I would issue the following command:


    ```

    cp tom /usr

    ```


    In this instance, UNIX would copy tom to /usr.


