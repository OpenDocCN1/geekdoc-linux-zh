  md: '# Part 7 > Reference


    mail The standard UNIX mail program.

    man manual page. Man pages are help files that describe how to use UNIX commands.
    You can obtain man pages by issuing the man command. For example, to obtain the
    man page on the command ls, issue the command man ls.


    mkdir A UNIX command that creates directories. For example, to create a directory
    called /home/mydirectory, issue the command mkdir /home/mydirectory (See the mkdir
    man page for more information.)


    more A UNIX program that displays file contents one screen at a time. To use more,
    issue the command plus the file you want to view. For example, to view the contents
    of your_address_list.txt, issue the command my_address_list.txt. (See the more
    man page for details. Also, compare with Jess.)


    Motif A commercial windowing system and set of programming libraries used to create
    window applications in X. (See mom.)


    mount A UNIX command used to access file systems by mounting them. (You can also
    use mount without arguments to report currently mounted file systems. See the
    mount man page for details.)


    multitasking In the general sense, multitasking is the process of performing multiple
    tasks simultaneously. (For example, reading this book and eating dinner.) In computer
    terminology, multitasking is the process of running multiple programs or processes
    simultaneously.


    multiuser An operating system is "multiuser" if many users can work on the same
    computer simultaneously.


    mv A UNIX command used to move files from one directory to another. To move a
    file using mv, issue the mv command plus the destination directory. For example:
    mv myfile /home/bwagner/myfile. (See the mv man page for more details.)


    mkdir A UNIX command used to move directories. To move a directory using mv, issue
    the mv command plus the destination directory. For example: mv /mydirectory /home/bwagner/mydirectory.
    (See the mv man page for more details.)


    mwm The Motif Window Manager. mwm is a window manager for UNIX. It has a very
    slick look and feel. You can create, size, move, hide, and destroy Motif windows
    using your mouse. mwm was created with Motif, a set of programming libraries that
    produce clean, attractive interfaces.


    news This generally refers to USENET news.


    NFS Network File System. A system that allows you to transparently import files
    from remote hosts. These files appear and as though they were installed on your
    local machine.


    # 374'
