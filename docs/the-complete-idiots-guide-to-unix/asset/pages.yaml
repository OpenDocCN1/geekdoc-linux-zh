- img_proc: true
  md: '# Part 6 ➤ Troubleshooting


    # Terminal Type Unknown


    You receive the Terminal type unknown error when a remote UNIX system doesn''t
    recognize your current terminal emulation. A possible reason is that you are connected
    to another UNIX system and forgot to set your terminal type.


    Most UNIX systems recognize a wide range of terminals. However, terminal support
    can occasionally vary. In any event, terminal emulation is very important when
    you''re connected via telnet.


    Your best bet is to disconnect and reset your terminal type to VT100, which is
    recognized by most UNIX systems.


    To set your terminal to VT100 in bash (or sh), issue the following command:


    ```

    TERM=vt100

    ```


    In csh, issue this command:


    ```

    set TERM vt100

    ```


    Once you set your terminal to VT100, you can reconnect.


    # Not a Directory


    You receive the Not a directory error when you try to access a file or directory
    but Unix can''t do it.


    The most probable cause is that your target is not a directory. For example, if
    you try to delete a file using mkdir (or try to change the directory to a file
    using cd), you''ll receive this error. Try using a command that works on files
    instead.


    # Insufficient Arguments


    UNIX couldn''t complete the command because you failed to provide all the necessary
    information. Most UNIX commands will accept multiple command-line arguments and
    nearly all UNIX programs accept at least one.


    The solution to this problem is very simple: Try your command again, but this
    time provide at least one command-line argument.


    # Not Enough Space


    You receive the Not enough space error when your system is busy. This error usually
    arises when processes have eaten up all available memory. This can sometimes occur
    when you share your machine with others. (For example, perhaps your box serves
    as a shell access box for everyone in the office.)


    332'
