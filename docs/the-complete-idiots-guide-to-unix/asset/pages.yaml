  md: '# Chapter 16


    # UNIX and the

    Internet


    ![](img/b0bfb2d724c393178bf462832858a65d_234_0.png)


    # In This Chapter


    +   - How the Internet came about

    - Some of UNIX''s networking features

    - Types of Internet connections

    - Connecting to the Internet with UNIX


    In Chapter 1, “I Thought UNIX Lived in Harems,” I explained that the Internet’s
    early

    design was based almost exclusively on UNIX. In this chapter, I want to expand
    on

    that bit.


    # Out of the Ashes of a War That Never Happened


    The date was October 22, 1962. After weeks of aerial surveillance, American intelligence

    offfficials had confirmed the worst: The Soviet Union was shipping missiles to
    Cuba. On

    that date, anticipating the eventuality of a Soviet first nuclear strike, President
    Kennedy

    ordered a naval blockade. Within hours, American warships surrounded Cuba.


    Kennedy''s aim was to place a strangle on Cuban ports while he delivered an omi-

    nous message to the Soviet Union: Cease the shipment of missiles to Cuba and dismantle

    The Soviet-engineered missile bases there. In those first few hours, Nikita Khrushchev,

    the Soviet Premier, pondered his options. In the interim, the world waited breathlessly
    and

    pondered it''s own question: Would the United States and USSR engage in nuclear
    war?'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'Looking back, these events seemed distant and implausible. At the time, however,
    American military strategists considered nuclear engagement a very real possibility.
    Therefore, they began projections of how far the destruction would reach. Not
    surprisingly, one chief concern was how that damage could affect the U.S. communication
    infrastructure.


    Based on research, the U.S. Air Force commissioned several tanks to develop a
    revolutionary concept: a means of communication that could withstand and survive
    a nuclear war. In 1962, a fellow named Paul Baran (then with the Rand Corporation)
    provided an answer.


    Baran took a long, hard look at how our computer networks were designed. What
    he saw wasn''t promising. You, in those days, important databases were kept exclusively
    on mainframes.


    Mainframes are designed primarily for large enterprises. Integrated into mainframe
    design is complex security architecture. Here there are, many controls to prevent
    unauthorized persons from accessing sensitive, classified, secret, or top-secret
    data. So, from this, you would probably draw the conclusion that mainframe-based
    networks were extremely secure. Unfortunately, that wasn''t true.


    Instead, the contemporary mainframe model was exceptionally vulnerable to attack.
    Here''s why: In mainframe environments, all information on the mainframe, and
    dumb terminals are used to connect to this centralized database. If you knock
    out the mainframe, terminals cannot access this centralized data. Therefore, for
    all purposes, that particular network could be destroyed. (Remember that dumb
    terminals don''t store data, they simply access it from a centralized source.)


    The solution was simple enough: Instead of populating networks with dumb terminals
    that couldn''t replicate data, why not have a network where all stations (whether
    they were mainframes, terminals, or whatever) store store forward data?


    In 1963, these ideas were presented to the Department of Defense. However, some
    bright folks determined that the idea was ludicrous. (No one had ever heard of
    such a thing!) So the concept was scrapped. Scrapped, that is, until 1969.


    In 1969, after mulling it for awhile, the Defense Department took a different
    view. Something had to be done, after all, they went with Baran''s rather off
    idea. From then, engineers at various corporations and institutions took the idea
    and ran with it.


    These folks started with four machines. After many months of effort, they managed
    quite a feat: The four machines could communicate and even replicate data redundantly.
    Imagine their excitement they realized that they had overlooked one minor detail:
    They needed a common language by which all networked could communicate. They needed
    a set of standardized rules by which communication was conducted. In order to
    achieve that, they had to pick a suitable operating system.


    212'
