  md: '# Part 4 > UNIX''s Net Worth


    # I''m In!


    The remote server will notify you when you''ve officially been logged in. Typically,
    it will display a message similar to this one:


    ```

    230 Guest login ok, access restrictions apply.

    Remote system type is UNIX.

    Using binary mode to transfer files.

    ```


    At this point, you can reassume control of the session. The ftp > prompt becomes
    available and you can begin navigating the FTP site.


    ![](img/b0bfb2d724c393178bf462832858a65d_305_0.png)


    # You''re Being Watched!


    A short, cautionary note: Many FTP servers log your activity. (Some announce when
    you first log in.) There are several reasons for this practice. For example, the
    site''s system administrator may be trying to gather access statistics. More likely,
    however, it''s a security precaution. Either way, you shouldn''t feel uncomfortable
    about it. These days, logging is a pretty standard procedure.


    To navigate a remote FTP site, you can use the same commands you use to navigate
    your own UNIX system. For example, when you first log in, you want to know what
    files and directories are available. Therefore, you begin by issuing the command
    1:


    +   1 ls


    In response, the remote server will display a directory listing. (See the following
    figure.)


    Similarly, to change from directory to directory on a remote FTP server, use the
    cd command,


    ```

    cd security

    ```


    This command changes the current directory to security. At this point, the remote
    FTP server will print a message indicating that the directory has been successfully
    changed.


    ```

    230 CWD command successful

    ```


    # 282'
