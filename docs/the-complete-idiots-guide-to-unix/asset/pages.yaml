  md: '# Working with Applications


    ![](img/b0bfb2d724c393178bf462832858a65d_148_0.png)


    +   ### In This Chapter

    * Unpacking files

    * Installing software


    It happens to the best of us. Sooner or later, you’re bound to get “download happy.”
    This condition usually sets in shortly after you discover that there are thousands
    of free programs available for UNIX. (Sunsite at University of North Chapel Hill
    is enough to keep you busy for decades. Sunsite can be reached at http://sunsite.unc.edu.)


    The problem is, once you download all that good stuff, you need to know how to
    unpack it, install it, and run it. That’s what this chapter is all about.


    # Before You Start: Is It Really Your Cup of Tea?


    When you first stumble across a UNIX software archive, you''ll be shocked to see
    the amazing range of free programs available. However, before you actually download
    any, you must first ascertain a few:


    +   * Whether the software will run on your UNIX flavor

    * Whether the software is in binary or source form

    * Whether you have the necessary tools to run it'
