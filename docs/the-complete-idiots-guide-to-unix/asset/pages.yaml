    from the scene. These days, Mac/UNIX users favor Quellen, instead. However, here''s
    a list of several good A/UX links:


    +   - A/UX Glossary of Terms—This document was reportedly generated by the Support
    Information Services at Apple. It defines terms that you''ll encounter while installing
    and using A/UX.


    ```

    http://www.geo.tu-freiberberg.de/docs/apple/aux/aux_glossary.html

    ```'
