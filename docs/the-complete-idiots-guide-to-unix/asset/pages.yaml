    ```


    access control Any system that controls user access to files, directories, or
    system resources. (For example, you can specify that users can only access your
    machine at certain hours.) There are two types of access control: discretionary
    (DAC) and manda- ory (MAC). In DAC, humans set the access controls. In MAC, access
    controls are writ- ten into the operating system (in other words, the machine
    sets controls).


    AIX A flavor of UNIX created by International Business Machines (IBM). AI runs
    on RISC workstations and the PowerPC.


    alias Short nicknames for commands. You use these to save time or to customize
    your system. For example, suppose you use Xdir and prefer your windows with a
    gray background and black. Every time you start Xdir, you would have to input
    the following command: /usr/X11/bin/xdir -fg -bg black. You can avoid this by
    setting an alias for the command: alias xdir="/usr/X11/bin/xdir -fg -bg black".
    From then, you could just type xdir.


    Alpha A proprietary architecture, workstation, and processor developed by Digital
    Equipment Corporation. Alpha are extremely fast and capable of 64-bit processing.


    anonymous An FTP service available to the public that allows anonymous logins.
    Any user can access anonymous FTP with the username “anonymous” and his or her
    email as password.


    ANSI The American National Standards Institute. ANSI develops data processing
    standards. Visit ANSI at http://www.ansi.org.


    argument A command-line value you pass to a program. Arguments always appear after
    the specified command, for example, suppose you want to delete files in your home
    directory: hickory, hickory, and dock. To delete them, you would use the command
    rm hickory hickory dock. These filenames are arguments for rm. (The argu- ment
    can also be what Unix and Windows do when faced with one another.)


    APRANET Advanced Research Projects Network. This was the original Internet.


    array A list used to store values that have similar characteristics. For example,
    you could create an array called @fruits. Inside of @fruits, you could store apples,
    oranges, pears, and so on.


    ASCII American Standard Code for Information Interchange. ASCII is a common standard
    by which all operating systems treat simple text.


    awk A pattern-scanning language named after its inventors: Alfred Abo, Peter Weiner,
    and Brian Kernighan. awk is fast, lightweight, and powerful. It allows you to
    scan and manipulate text, as well as conditionally execute commands depending
    on what appears in a file.


    368'
