  md: '# So You Want to Run a UNIX Server


    # In This Chapter


    +   * Learning about permissions

    * Learning about assigning permissions

    * Adding and removing users


    It''s unlikely that you''ll be managing a UNIX server anytime soon. However, here
    at Que, we like to be thorough. Therefore, this chapter briefly touches on system
    administration.


    A system administrator (that''s you) is responsible for adding and removing users,
    maintaining system security, and, basically, running the entire show. A lot of
    responsibility is attached to this post. In fact, if you run a UNIX system, you''ll
    spend your days answering silly questions posed by other users. (I hope you can
    answer some of those questions using this book.)


    A system administrator must know—at a minimum—how to manage system permissions
    and add and remove users. This chapter, therefore, focuses on these tasks.


    # Getting to the Root of the Problem


    Your first step to successful system administration is understanding how UNIX
    privileges are assigned. We''ll start there.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# System Administration


    UNIX is a multiuser system, meaning that many folks can use the same machine simultaneously.
    To keep track of multiple users, UNIX employs a very structured approach.


    Each user has an account, which consists of a username, a password, and a home
    directory (for example, /home/bouncer). When users first log in, they’re positioned
    in their home directories. On a typical UNIX box in a corporate environment, there
    can be as many as 200 accounts and hence, about 200 home directories.


    To manage these accounts, UNIX makes use of a special or privileged account. This
    account is called root (and is often referred to as the super-user, because you
    can access it by logging in under the user ID “su”). Let’s discuss that account
    now.


    # It’s a Bird, It’s a Plane, It’s Super-User!


    What makes such a super user? Here is it in a nutshell: Whereas regular users
    generally only make changes to their own files, root can make changes to any file.
    At least, in the most basic sense, this is the concept of root. In the larger
    picture, however, root is much, much more. To understand root and the power it
    wields, you need a crash course in computer security.


    In shared, networked environments such as UNIX, users can run around the system,
    checking out files, directories, and other resources at will. To prevent that,
    UNIX employs a technique called Discretionary Access Control (or DAC).


    DAC is present in any system that allows a centralized, human authority to permit
    or deny users access (and to do so incisively, based on file, directory, or machine).


    At root, you enforce these rules through something called permissions. Here are
    the different types of permissions:


    +   - Execute—Allows users to execute the specified file.

    - Read—Allows users to read the specified file.

    - Write—Allows users to alter the specified file.


    These permissions are attached to files, directories, and devices. Each permission
    is represented by a token. Here are the permission tokens:


    +   - r (read access)

    - w (write access)

    - x (execute access)


    To ascertain the permissions on a file or directory, list it in long format, like
    this:


    ```

    ls -1

    ```'
