  md: '# Approaching the Beast


    Your first UNIX encounter will happen in one of four ways:


    +   * At a workstation or PC

    * At a dumb terminal

    * At an X terminal

    * Over a network connection


    Each of these devices work slightly differently (but can be equally baffling),
    so I''ll briefly describe them.


    # Workstations and PCs


    Workstations and PCs look very similar. Their chief characteristics include a
    chassis, a monitor, a keyboard, and a mouse. (See the following figure.)


    A typical workstation or PC layout.


    ![](img/b0bfb2d724c393178bf462832858a65d_53_0.png)


    Additionally, most workstations and PCs also have a CD-ROM, a floppy disk drive,
    and a color screen. (These machines are integrated packages that provide everything
    you need to do serious computing. If you see an incomprehensible snare of cables
    coming from the chassis, you''re probably dealing with a workstation or PC.)


    Workstations always run UNIX flavors designed specially for them. (In other words,
    the same company that made the workstation also makes the software for it.) Therefore,
    Sun Microsystems workstations generally run SunOS or Solaris, whereas HP 9000
    series workstations (from Hewlett Packard) run HP-UX.


    In contrast, PCs can run several different flavors of UNIX, including Solaris,
    BSD, Linux, UNIXWare, and even XENIX. (In Chapter 4, “Getting In,” you’ll learn
    how to identify which UNIX flavor you have.)'
  merge: -1
