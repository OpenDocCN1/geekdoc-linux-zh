    \n# Illegal Option\n\nYou receive the Illegal option error when you try to use\
    \ an unsupported command-line switch. If you know switch is bad, you can reissue\
    \ your command with the corrected option. On the other hand, if you're completely\
    \ mystified as to why the command failed, check the man page.\n\nValid command-line\
    \ switches are always identified at the beginning of every man page. For example,\
    \ the is man page opens with a list of available command-line switches:\n\n```\n\
    \ /usr/bin/ls [ -aBbCcDffgIllmnqrStux1 ] [ file... \n```\n\nIs that an incredible\
    \ list of switches, or what? Can you use this to refresh your memory. To display\
    \ this information quickly, you should issue the command man command -15. This\
    \ will fill half the screen with the switches but still leave you ample room to\
    \ retype your command.\n\nIf you need further information, read the entire man\
    \ page.\n\n# Read-only File System\n\nYou receive the Read-only file system error\
    \ when you try to access a read-only file system. There's no real solution to\
    \ this. Try contacting your system administrator.\n\n# The Least You Need to Know\n\
    \nThis chapter quickly covered common UNIX errors. However, there are hundreds\
    \ more. Whenever you're faced with an error message not covered in this chapter,\
    \ remember these two rules:\n\n+   When doubt, first check your spelling and case.\
    \ These are the most common causes of errors.\n\n+   Always check whether the\
    \ command you want is in the path. If it's not, put it there.\n\nIf you always\
    \ observe these two rules, you'll often be able to avoid problems with UNIX.\n\
    \n333"
