  md: '# Chapter 23 Common Mistakes


    > rmd (the remove directory command)—rmdir removes directories.

    Although rmd will not automatically remove a directory that has files, know this:
    Some directories are essential, even if they''re currently empty. (A good example
    is /tmp. Many programs use /tmp, and the code to access /tmp is hardcoded into
    these applications. As an interesting experiment, remove /tmp for a day; you will
    discover which programs can live without it and which can''t.)


    However, this list is by no means inclusive. There are many, UNIX commands that,
    when used improperly or rashly, can render a system either temporarily or permanently
    unusable. To avoid complete disaster, here''s a good rule: For the first six months
    of your UNIX experience, use asterisks as seldom as possible (if at all). Coupling
    asterisks with destructive commands can cause widespread damage. Only when you''re
    absolutely certain that your asterisks are placed safely should you use them.


    For instance, never use asterisks in UNIX as you would in DOS. Here''s an example:


    ```

    rm *

    ```


    Remember that the . symbol can represent any character. The above command could
    potentially destroy many, many files.


    Additionally, "power" switches are available that can override certain behaviors
    of programs. For example, consider this command:


    ```

    rm -f [something]

    ```


    The -f switch instructs rm to operate recursively. In other words, if [something]
    is a directory, that directory, all its subdirectories, and all its files will
    be removed. This command could be devastating. Therefore, try to avoid using power
    switches until you have more experience.


    # Terminal Problems


    One of the most common problems you''ll encounter involves terminal types and
    terminal emulation. The problem, in a nutshell, is this: When you connect to a
    remote machine, chances are, you may not know its make and manufacturer. In many
    cases, you don''t need to know this information; however, occasionally, making
    a world of difference.


    You see, not all computers display data in precisely the same manner. For example,
    some terminals display data in vertical columns, like this:


    | Item | Item No. | Description | Price |

    |---|---|---|--|

    | CDROM | 1233 | CDROM Disk Drive | $100.00 |

    | Floppy | 1234 | Floppy diskette drive | $30.00 |'
