  md: '# Appendix C Speak Like a Geek: The UNIX Bible


    shell A command interpreter or program that passes your instructions to the operating
    system. (It also reports back from the operating system when required.)


    shell script A program written in plain text that can be executed by a shell.


    Solaris A version of UNIX from Sun Microsystems, Inc. Solaris was preceded by
    SunOS.


    sort A UNIX utility for sorting, merging, and sequencing file contents.


    source code Raw, uncompiled program code that, when compiled, will constitute
    an application or program.


    standard error (stderr) Error output from programs. This is usually printed to
    your terminal screen. You can redirect this output elsewhere you choose.


    standard input (stdin) Your commands are standard input. UNIX reads commands (which
    are expressed in text) from your terminal and keyboard.


    standard output (stdout) Output from computer programs. This is usually printed
    to your terminal. For example, when you issue the ls command, UNIX responds with
    standard output of which files exists in your directory. This list of files is
    standard output.


    subdirectory Any directory below / any directory below the working directory.


    super-user (See root.).


    tail A UNIX program that, by default, displays the last ten lines of the specified
    file. You can manipulate output from tail by specifying a number of lines. For
    example, to view the last 30 lines of a file, issue the following command: tail
    -30 myfile.


    tar A UNIX program that creates tape archives of your directories and files.


    tsh A shell that resembles bash. tsh has some advanced features, including command-line
    completion.


    telnet A protocol and an application that allows you to log in and control your
    system from remote locations. During a telnet session, your machine responds precisely
    as if you were actually working on its console.


    WISE A version of UNIX that has been owned by both Novell and Sco.


    uwp UNIX-to-Unix copy. A program often used to transport news and mail across
    the Internet. (See the uwp man page for more details.)


    uencode A format commonly used to transport binary files over email. (Email is
    plain text, binary files are not text. Therefore, uencode is used to convert binary
    files to text suitable for transport via email.)


    vi A text editor that comes with UNIX distributions. vi is controlled mainly through
    control keys and is not particularly user friendly. (vi might be a better choice
    until you get more UNIX experience.)


    # 377'
