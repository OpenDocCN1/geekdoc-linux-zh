  md: '# Part 3 Working in the UNIX GUI


    ![](img/b0bfb2d724c393178bf462832858a65d_201_0.png)


    CDE Menu Customization

    If you’re using CDE, you can customize your menus using the menusetup command.
    This utility allows you to replace the default /dt/dtwmrc file with one of your
    own design. Although this doesn''t make menu customization a snap, it does help
    considerably. If you want to try it, copy the original /dt/dtwmrc file to your
    home directory and study it carefully. Only after you understand how the menu
    structure works should you try to add menu entries. I recommend trying one menu
    entry at a time. In any event, the great thing about menusetup is this: If you
    completely bungle your customization attempt, you can use menusetup to reset the
    menus and recover a working system. To do so, start menusetup and choose Option
    2, Revert to Default CDE Menus. Voila! Your menus will return to normal.


    To customize menus, you must first find the default menu configuration file. For
    example, on systems using fwm, the file is system.fwmrc. The system.fwmrc defines
    menus in structures that are surprisingly easy to read. For example, here’s an
    entry for a typical Utilities menu:


    ```

    # This menu will fire up some very common utilities

    Popup "Utilities"

    Title "Utilities"

    Exec "Netscape" exec netscape &

    Exec "Xterm" exec xterm -e tcsh &\nExec "Big Xterm" exec xterm -fg black -white
    -font 7x14 &

    Exec "Top" exec rxvt -T Top -n Top -e &

    Exec "Calculator" exec xcalc &

    Exec "Xman" exec xman &

    Nop ""

    Popup "Modules" Module-Popup

    Nop ""

    Popup "Exit Fwm" Quit-Verify

    EndPopup

    ```


