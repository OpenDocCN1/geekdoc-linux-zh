  md: '# Working in the UNIX GUI


    +   Avoid creating new menus—Until you become more familiar with menu customization,
    avoid trying to make new menus. Instead, add your desired programs to menus that
    already exist. This, you only need to know the program''s name, command line,
    and what you want to call it. After you''ve used X a (and customized a few menus),
    then you can make much fancy stuff.


    ![](img/b0bfb2d724c393178bf462832858a65d_203_0.png)


    +   Don''t delete existing menus—Avoiding deleting existing menus, even if you
    think you''ll never use them. (You may later wish you didn''t delete them!) Instead
    of deleting existing menus, comment them out. This is done by placing the # symbol
    at the beginning of the line, like this #Exec "Xman" execman & Any line with the
    # symbol is ignored, and for all purposes, that menu choice is disabled. If you
    need it later, simply remove the # symbol at the beginning of the line. Presto!
    The menu choice is back.


    There are certain menus you shouldn''t change. These include all menus that specify
    choices on window controls, such as Minimize, Restore, Maximize, Shuffle Up, Shuffle
    Down, Destroy, Delete, and Quit. Don''t futz with these, because if you could
    potentially disable important functions. For example, imagine if you accidentally
    mangle the Delete or Quit function. You''d have a hard time destroying windows.
    Similarly, avoid the temptation to change key bindings. (Key bindings are sometimes
    specified in the menu configuration file.) If you accidentally mangle the key
    bindings, you may lose access to important Function operations.


    +   Test your command lines first!Before you commit a menu addition to record,
    test the command you provide to execute the application. If the command line is
    bad or malformed, the menu choice will not work.


    Also, watch closely for wrapped lines. (Wrapped lines occur when your message
    is so long that your editor breaks the line somewhere before the end.) For example,
    suppose you posed a menu choice that executes this:


    ```

    xterm -fg bg -bg white -font 7x14 -b 5 -fb 7x14bold -geometry --200x400 -T MyLogFile
    -e pico my-log-file.txt

    ```


    That''s a fairly command line. If you edit your menu configuration file in pico
    (or another editor that wraps long lines), the line will be wrapped as it is in
    the example. Consequently, the command will not work. There''s a simple solution
    to this: Dont use an editor that wraps lines. If you do, prior to saving the file,
    unwrap the line. (In the example, the break occurs immediately after the -geometry
    option.)


    # 183'
