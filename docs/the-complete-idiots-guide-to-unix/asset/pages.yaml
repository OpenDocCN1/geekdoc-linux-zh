    # Why Is My Window Cut in Half?


    Some applications—such as Netscape Navigator—will open in odd positions. Often,
    much of the window is hidden because it expands beyond the borders of your viewable
    screen. (This happens frequently when you use 640x480 resolution or application
    that was originally designed in 800x600 or higher.) In cases, the maximize control
    button comes in very handy. Instead of trying to capture the window and resize
    it, just use the maximize button. When you do, the application will automatically
    snap to attention, filling up only the entire screen''s area.


    Lastly, if you''re going to maximize a window, you should generally do so before
    working in it. Here''s why: Sometimes when you maximize a window, the position
    of text within that window will change. That was previously visible won''t be,
    and vice versa.


    # The Incredible Shrinking Window: The Minimize Control


    The problem with windows is that they can get in the way (in other words, one
    window may block your view of another). Whenever you have more than two windows
    on the screen, it''s often easier to minimize the obstructive window than move
    to it. By taking this approach, you effectively make the obstructive window temporarily
    disappear without killing it. You should kill seldom as possible; otherwise, you
    may get a visit from the ASPCW (the American Society for Prevention of Cruelty
    to Windows). Believe me, you don''t want to tangle with them.


    To minimize (or iconize) a window, click the minimize control button, located
    in the upper-right corner of the window. (See the following figure.)


    When you minimize a window, its icon is placed on the desktop and will remain
    until you click it. Clicking the icon will return the window to its original state.
    (Some window managers demand that you double-click it to restore it. The easiest
    way to find out which method is used to try it out.)


