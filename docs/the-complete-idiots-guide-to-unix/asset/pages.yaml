  md: '# What Do I Get When I Purchase UNIX?


    Most UNIX distributions come with a wide range of programs and resources, including
    the following


    +   - Text processing and editing tools

    - Programming tools

    - Internet tools

    - Tools to manipulate graphics

    - Help documentation and examples


    In this respect, commercial UNIX distributions differ little from Microsoft Windows
    or Mac OS. Bundled applications include a notepad, a calculator, a personal calendar,
    a graphics viewer, a CD player, and so on.


    Similarly, basic UNIX installations include a help system. Help documentation
    can generally be accessed in both plain and hypertext text.


    > Most proprietary UNIX systems also come with board sound and Ethernet. (A good
    number also include on-board ISDN. However, that''s becoming less and less prevalent.
    When it first emerged, ISDN seemed like a great solution for high-speed Internet
    access. Since that time, other technologies emerged that offer much higher transfer
    rates at much lower prices. One good example is Asynchronous Digital Subscriber
    Lines or ASDL.)


    ![](img/b0bfb2d724c393178bf462832858a65d_37_0.png)


    # What Is Hypertext?


    Hypertext is a text display format commonly used on Web pages. Hypertext is distinct
    from regular text because it''s interactive. In a hypertext document, when you
    click or choose any highlighted word, or associated text appears. This allows
    cross-referencing and permits you to navigate a document. Help documentation displayed
    with hypertext is therefore extremely user-friendly. If you ever traversed the
    World Wide Web, you''re probably an expert at navigating hypertext-and you just
    don''t know it. Every time you click a link for a Web page, you''re navigating
    hypertext.


    Finally, as you''ll learn in Chapter 11, UNIX window systems work much like other
    window systems, with a little extra functionality. In fact, the learning curve
    in UNIX systems is short if you ever used Mac OS or Microsoft Windows.


    # Is UNIX Compatible with Other Systems?


    UNIX is highly compatible with other systems. In fact, most commercial UNIX distributions
    have servers for Novell NetWare, Microsoft Windows 95 and NT, and even AppleTalk.
    In addition, UNIX interfaces seamlessly with a number of commercial and noncommercial
    database packages including Oracle, Informix, CA Unicenter, and common Ingres.'
