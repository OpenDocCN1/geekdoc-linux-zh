  md: '# Troubleshooting Your Print Jobs


    You may occasionally encounter problems with your print jobs. Here are a few possible
    reasons:


    +   - The printer is not available—If you send a print job but it never prints,
    check to see whether the printer is on. If so, perhaps the cable was knocked loose.


    +   - You chose a printer that doesn''t exist—If you receive an error reporting
    that the specified printer is unavailable, check /etc/printcap. Are you sure you
    specified the right printer? (You might have misspelled the printer name.)


    +   - You don''t have the necessary privileges—You might be sending print jobs
    to a printer for you have no access privileges. Try the local printer instead.


    +   - UNIX reports that it cannot print the file and refers to stdin—Sometimes,
    certain files simply won''t print because their format is mangled. For example,
    when you redirect man output to a file, it sometimes retain nonprintable characters.
    If so, it won''t print. Check the file by opening it in an editor. If it contains
    nonprintable characters, you may have to regenerate the file.


    +   - The printer is looking for PostScript, not text—On rare occasion, you may
    encounter this problem. If so, you have two options: You can have your system
    administrator install a text filter or the appropriate ASCII-to-PostScript filter.


    However, by far, the most common problem is that your print job is last in line.
    Remember that UNIX is a networked operating system. Many folks may have printing
    privileges on your printer. Therefore, before you go tracing down the printer
    wires, always check the print queue with lpstat or lpq first. In all probability,
    many users are ahead of you. For this, the only cure is patience.


    # The Least You Need to Know


    When printing in UNIX, the least you need to know is this:


    +   - To print, use lp or lpq.


    +   - To cancel a print job, use cancel or lprm.


    +   - To check the status of a print job, use lpstat or lpq.


    +   - To identify supported printers, check /etc/printcap.'
  merge: -1
  pgno: 146
