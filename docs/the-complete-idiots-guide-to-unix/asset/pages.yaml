  md: '![](img/b0bfb2d724c393178bf462832858a65d_262_0.png)


    # # The WWW: Browsers for UNIX


    +   In This Chapter

    - Various WWW browsers for UNIX


    After a hard day''s work with UNIX, you''ll probably want to relax and have some
    fun. There''s no better way to have fun with your system than cruising the World
    Wide Web.


    In this chapter, you''ll learn about popular Web browsers for UNIX, as well as
    their advantages and disadvantages.


    # ## A Few Words about Standards


    Sometimes, as progress marches on, it inadvertently complicates things so that
    an original idea is lost in the shuffle. This is the case with the WWW.


    In 1991, a physicist named Tim Berners-Lee implemented hypertext as a medium by
    which users on disparate machines could view documentation. With rare exceptions,
    that documentation would look almost identical to Mac users, IBM users, and UNIX
    users. In effect, Berners-Lee''s WWW served all users equally, regardless of the
    architecture or software used.


    When the Web became more commercially viable, however, software vendors sought
    to extend their browsers'' capabilities. To do so, they introduced special, proprietary
    extensions to HTML—extensions that only their browsers could understand. As a
    result, pages built expressly for Microsoft Internet Explorer would not work well
    with Netscape Navigator, and vice versa. This trend continued until the differences
    were'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'great that even basic page elements (such as buttons and list boxes) would
    only be visible if you used the "right" browser.


    One HTML extension in particular that the users use see the Web tables. Tables
    allow Webmasters to specify near-absolute positioning of elements such as text
    and graphics on the webpage. In this respect, tables greatly enhanced the user''s
    Web experience, because more beautiful and functional pages could be created.
    However, not all browsers support tables.


    Table support (or lack of it) is probably the chief disparity among browsers.
    Browsers that don''t support tables display plain text and graphics in odd positions.
    Because tables are now used regularly on the Web, using a browser that''s not
    compliant places you at a distinct disadvantage.


    To demonstrate the difference between a table-compliant and a non-table-compliant
    browser, I loaded both Netscape Communicator and NCSA Mosaic and downloaded the
    home page of Macmillan Computer Publishing on each.


    Netscape Communicator is table compliant; it interpreted the MCP home page properly.
    (See the following figure.)


    Netscape Communicator to access MCP''s Web site.


    ![](img/b0bfb2d724c393178bf462832858a65d_263_0.png)


    However, NCSA Mosaic, a non-table-compliant browser, was only able to load a small
    portion of the MCP site. (See the following figure.)


    # 240'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Chapter 18 ► The WWW: Browsers for UNIX


    ![](img/b0bfb2d724c393178bf462832858a65d_264_0.png)


    Using NCSA Mosaic to access MCP''s Web site.


    As you can see, Mosaic missed quite a bit. Today, the vast majority of sites implement
    tables in their Web pages.


    Table 18.1 summarizes tables support for various UNIX browsers (as well as several
    important disparities).


    # Table 18.1. Browser/tables compatibility


    | Browser | Status |

    | --- | --- |

    | Amaya | Amaya has table support, Java support, and graphics support. However,
    Amaya does not support JavaScript, VScript, video, and sound. |

    | Chimera | Chimera supports tables and graphics but does not support JavaScript,
    VScript, sound, and video. |

    | Lynx | Lynx does not support tables. Moreover, Lynx does not support JavaScript,
    graphics, sound, and video. |

    | Mosaic for X | NCSA Mosaic does not support JavaScript, VScript, tables, and
    video. |

    | Navigator/Communicator | Netscape Navigator and Communicator both support JavaScript,
    tables, graphics, sound, and video. |


    The browser you use will depend on why you use the WWW. If you''re in research
    and are seeking mostly text, it doesn''t really matter which browser you use.
    However, if


    241'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Part 4 > UNIX''s Net Worth


    you cruise the Web for personal enjoyment and entertainment, your best choice
    is probably Netscape Navigator or Communicator. Both products support most of
    the latest technologies in Web media.


    # About Availability


    You''re probably wondering whether your system already has a Web browser installed.
    That''s very possible. Newer UNIX distributions (particularly those released after
    1997) are likely to have at least one browser included. For example, UNIXWare
    Netscape Navigator, and all versions of Linux have at least one browser installed
    (and sometimes several).


    If you cannot immediately determine whether your UNIX system has a Web browser,
    consult your system administrator.


    # The Browsers


    The following sections cover the UNIX-based browsers you''ll most likely encounter.
    About a dozen other Web browsers for UNIX are in various stages of development.
    (Even Microsoft has developed a version of Internet Explorer for UNIX. To, date,
    it only supports two very specific configurations.)


    # NCSA Mosaic


    National Center for Supercomputing Applications

    University of Illinois at Urbana-Champaign

    Champaign, IL 61820

    http://www.ncsa.uiuc.edu/


    NCSA Mosaic for X is one of the oldest WWW browsers. It was designed at the National
    Center for Supercomputing Applications by Marc Andreessen and Eric Bina. You might
    recognize Marc Andreessen''s name—he founded Netscape Communications Corporation.
    (Andreesen''s success story is now a matter of Internet folklore. When Andreessen
    designed Mosaic, he was making approximately $6.50 an hour. However, less than
    one week after he founded Netscape, he became an instant millionaire.


    In any event, Mosaic for X is a long-time favorite of super-geeks. Its design
    is extremely friendly. In fact, it was Mosaic that opened the WWW to nontechnical
    users. Prior to Mosaic''s 1993 release, the WWW was intimidating and difficult
    to use (primarily because the Net was text based). Mosaic changed all this by
    making navigation of the WWW point-and-click affair.


    In appearance, Mosaic for X closely resembles any Windows or Macintosh application.
    (See the following figure.)


    # 244'
  merge: -1
