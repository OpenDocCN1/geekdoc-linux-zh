  md: '# Configuring pine as Your Newsreader


    To configure pine as your newsreader, start it and choose Setup. (See the following
    figure.)


    Use the arrow keys to navigate to the Setup option.


    ![](img/b0bfb2d724c393178bf462832858a65d_279_0.png)


    Once in setup mode, choose Config (enter the c on your keyboard). This will bring
    you to the pine Setup Configuration screen. (See the following figure.)


    The pine Setup Configuration screen is where you set your options.


    ![](img/b0bfb2d724c393178bf462832858a65d_279_1.png)


    In your setup configuration, enter your server''s name into the nntp-server field.
    (See the following figure.)


    Once you''re your news server has been set, save your changes and restart pine.
    Congratulations! You''re ready to connect to the USENET news network.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Chapter 19 > USENET News


    The nntp-server field


    The nntp-server field is set up to specify your news server.


    # Subscribing to Newsgroups


    Your next step is to subscribe to some newsgroups. Before you can do this, however,
    you must first pine to collect all the available newsgroups. For this, restart
    pine and choose Folder or Newsgroup to View. (See the following.)


    ![](img/b0bfb2d724c393178bf462832858a65d_280_0.png)


    NNTP is the Network News Transfer Protocol, the protocol by which USENET news
    messages are transported across the Internet. A NNTP server is any machine configured
    specifically to collect and distribute news. To learn more about NNTP, go to http://info.internet.isi.edu:80/in-notes/rfc/rfc977.txt.


    This will bring you to the Folder List window. Here, under the News header, choose
    Select Here to see an Expanded List. (See the following.)


    Now, you need to wait awhile. During this time, pine will collect all available
    newsgroups. (This will take 2 to 30 minutes, depending on your connection speed.)
    Finally, pine will finish this task. When it comes, you can subscribe to any newsgroup
    by issuing a command plus the name of the group. Here''s an example:


    ```

    comp.UNIX.aix

    ```


