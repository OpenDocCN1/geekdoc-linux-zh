  md: '# Printing


    # In This Chapter


    +   * Printing in UNIX

    * Checking printer status

    * Canceling print jobs

    * Formatting print output

    * Determining supported printers


    Printing seems like such an easy task; you''re probably wondering why we need
    a chapter about it. Here''s the scoop: Printing from UNIX is different than printing
    from other operating systems. There are a wide range of options and, as you might
    expect, many little programs are involved. (UNIX is teeming with little programs
    that do big jobs. This is just one of the advantages of using an operating system
    that was designed while Bill Gates was still in high school. UNIX geeks demanded
    low overhead, and that''s exactly what they get.)


    Therefore, this chapter addresses all those little points, such as how to stop
    a printer when it runs amok, how to find out what happened to your print job,
    and so on.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# Printing from X


    Printing from applications in X is pretty straightforward, especially if those
    applications are commercial. For example, to print a Web page from Netscape Navigator
    or Communicator, simply choose FilePrint. Navigator will do the rest. Nearly all
    applications in X either have their own printer drivers or utilize standard printing
    commands. Either way, these applications require little tweaking.


    In contrast, printing from a command line involves several different commands.
    That''s what this chapter is all about.


    # Command-Line Printing


    In UNIX, the printing commands you''ll most often use are as follows:


    +   * 1p

    * lpr

    * cancel

    * lprm

    * pr

    * lpstat

    * lpq


    Let''s look at how each command is used and what it does.


    # Using 1p to Send a Print Request


    For many UNIX flavors, 1p is the favored print command. (1p stands for line printer).
    Using 1p, you can send files to the local printer, like this:


    ```

    lp myfile.txt

    ```


    This sends myfile.txt to the printer to be processed. (How long this takes depend
    on how many other print jobs are currently queued as well as their priority over
    your own. Printer job priority—or rank—is discussed later in this chapter, in
    the sections on lpstat and 1pq.)


    Note that 1p is an AT&T/System V command. BSD-based systems, you may need to use
    lpr instead. Some UNIX distributions have 1p, some have 1pr, and some have both.)
    1pr is also discussed later in this chapter.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Using 1p to Print Data Not Contained in Files


    You can also use 1p to print data that''s normal-ly to standard output. For example,
    suppose you want to print a list of all GIF files in your directories and subdirectories.
    You could issue the following command:


    ```

    find -name "*gif" 1p

    ```


    To print the contents of the current directory, you could issue this command:


    ```

    ls -1 | 1p

    ```


    A quick warning about redirecting data to the printer: Watch your syntax! If you
    accidentally make a typo, you could inadvertently send many megabytes of data
    to your printer. Always examine your command line before you press Enter.


    The 1p command has many command-line switches through which to manipulate printed
    output. The more important ones are summarized in Table 9.1.


    # Table 9.1. Some 1p command-line switches


    | 1p Switch | Purpose |

    | - | The number switch specifies how many copies to print. For example, 1p -3
    myfile.txt will print three copies of myfile.txt. |

    | -c | The -c option specifies that the file should be copied prior to printing.
    This adds a link to the file. This way, if you make changes to the file before
    the print request is actually executed, those changes will be reflected in the
    final printed product. (This is good when the printed material is derived from
    logs or other files that are constantly being updated.) |'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Table 9.1. Some 1p command-line switches CONTINUED


    | 1p Switch | Purpose |

    | :--- | :--- |

    | **-d [\`destination`\]** | Use the -d option when you want to direct your print
    request to a particular printer or device. For example, 1p -dMondofile.txt sends
    myfile.txt to be printed on the printer Mondo. (This is useful when the default
    printer is unsuitable for your needs. For example, suppose the default printer
    is a Laserjet and you want to print a spreadsheet. You''ll probably want to redirect
    that print job to an IBM ProPrinter or some other contact/dot-matrix printer suited
    for wide-format pages.) |

    | **-m** | The -m option sends mail after the print job has been completed. |

    | **-P [\`range`\]** | Use the -P option to print a range or series of pages.
    For example, 1p -P 2-4 myfile.txt will print 2 through 4 of myfile.txt. |

    | **-q [\`number`\]** | Use the -q switch to specify a priority for the print
    job. Values range from 0 (the very highest priority) to 39 (the lowest). Note
    depending on your system configuration, your system administrator may have limits
    on how high a priority you can set on your jobs. |

    | **-t [\`title`\]** | Use the -t switch to add a title to your pages. (Note that
    if the title contains whitespace, you must enclose the title in quotes. Otherwise,
    1p will interpret additional words as command-line arguments.) |

    | **-w** | Use the -w option to write a message to the terminal when the print
    job is finally printed. (This is like the -m switch in that it provides a way
    to notify you that the job was successfully completed.) |


    # 1pr: Printing with BSD Commands


    On many systems, you have to use 1pr instead. If this is your case, don''t worry:
    1pr works much like 1p. To print a file using 1pr, issue the 1pr command plus
    the name of the file you want to print, like this:


    ```

    1pr myfile.txt

    ```


    1pr has several command-line switches through which to manipulate print output.
    The more important ones are summarized in Table 9.2.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Table 9.2. Some lpr command-line switches


    | lpr Switch | Purpose |

    |--- | --- |

    | -# | The number switch specifies how many copies to print. For example, lpr
    -3 myfile.txt will print three copies of myfile.txt. |

    | -c | The -c option specifies that the file should be copied prior to printing.
    This adds a link to the file. This way, if you make changes to the file before
    the print request is actually executed, those changes will be reflected in the
    final printed product. |

    | -m | The -m option tells lpr to send mail after the print job has completed.
    |

    | -P [destination] | Use the -P option when you want to direct your print request
    to a particular printer or device. For example, lpr -Mondo myfile.txt sends myfile.txt
    to be printed on the printer Mondo. |

    | -r | Use the -r switch when you want to remove the file after printing it. For
    example, lpr -r myfile.txt tells lpr to print myfile.txt and then delete it. (Be
    careful if something goes wrong and you lose your printout, the data will be gone.
    Unless the data is of throwaway variety, you shouldn''t use the -r.) |

    | -T [title] | Use the -T switch to add a title to your pages. (Note that if the
    title contains whitespace, you must enclose the title in quotes. Otherwise, lpr
    will attempt to interpret the words as arguments.)


    Finally, note that you can also print to a file if you want. This is done using
    the lpr command with the -v switch, like this:


    ```

    lpr -v myfile

    ```


    This will produce a PostScript file named myfile.


    # Canceling Print Jobs with the cancel Command


    So, you accidentally sent a 25MB file to the printer, eh? It happens to me all
    the time. Don''t sweat it; UNIX has excellent print job control.


    To cancel a printer job, issue the cancel command plus the job number of the job
    you want to cancel, like this:


    ```

    cancel print-request-id

    ```'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Part 2 > Nuts and Bolts


    To cancel a job that was sent to a specific printer, add the destination:


    ```

    cancel print-request-id destination

    ```


    ![](img/b0bfb2d724c393178bf462832858a65d_141_0.png)


    # Check This Out


    Except in rare cases, you can only cancel your own print requests (and then only
    on the local host). If you have accounts on several machines and plan to print
    from more than one, tell your system administrator. He or she can configure the
    system to allow you to cancel your print requests on any host on the network.


    # Canceling: The lprm Command


    Still another canceling command (common to all BSD variants) is l1prm. To kill
    a print job using this command, issue the l1prm command plus the print job number,
    like this:


    ```

    l1prm 312

    ```


    To cancel a job on a particular printer, use the l1prm command and the -P switch
    to identify the printer:


    ```

    l1prm -PMondo 312

    ```


    # Formatting Display Output with the pr command


    Sometimes, simply printing a file can produce strange results. For example, the
    text may not be justified or, worse, it may print in odd positions on the page.
    Therefore, you may occasionally need to format the information. For this, the
    pr command is very useful.


    The pr command is for formatting output. pr formats pages neatly, paginates them,
    and prints a header on each page. Use the pr command to clean up output before
    printing it, like this:


    ```

    pr myfile.txt | lp

    ```


    pr has several command-line switches. The more important ones are summarized in
    Table 9.3.


    | Table 9.3. Some pr command-line switches |

    | pr Switch | Purpose |

    | -d | Use the -d switch to force double-spaced output. This will add an extra
    newline for every newline found. (This can make output easier to read. log files
    often have thousands of lines that look very similar. Sometimes, they are easier
    to read when they''re double-spaced.) |'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Chapter 9 > Printing


    | Switch | Purpose |

    | --- | --- |

    | -h [header-text] | Use the -h switch to customize your header. |

    | -l [number-of-lines] | Use the -l switch to change the number of lines displayed
    per page. (The default value is 66.) |

    | -m [file1 file2] | The -m option tells to pr merge the output of file1 and file2.
    Their contents will be displayed in columns, side by side. (This is good primarily
    for examining word lists or other files that have only one or two words per line.)
    |

    | -s [character] | Use the -s option when you want to specify a particular delimiter
    for columns. For example, to separate columns by commas, enter the command pr
    -s: filename. |

    | -t | Use the -r switch to suppress headers and footers.


    # # Using lpstat to See What Happened to a Print Job


    On occasion, you may want to check the status of the print service. For example,
    maybe your print job hasn''t finished yet and you''re wondering why. To check
    the printer service status, use the lpstat command, like this:


    lpstat


    lpstat has several command-line switches. The more important ones are summarized
    in Table 9.4.


    # ## Table 9.4. Some lpstat command-line switches


    | lpstat Switch | Purpose |

    | --- | --- |

    | -R | Use the -R switch to find out where your print job is in the process queue.
    (This tells you whose jobs are ahead of yours. From this information, you can
    ascertain how long you have to wait.) |

    | -s | Use the -s switch to get a summary of all print service information, including
    available printers, their names, and their default settings. Here''s some sample
    output:

    scheduler is running

    system default destination: myprinter

    device for myprinter: /dev/tty00

    system for myprinter: myprinter-system

    character set ascii

    character set iso-88591

    character set iso-88592

    character set iso-88597


    continues


    119'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Table 9.4. Some lpstat command-line switches CONTINUED


    | Switch | Purpose |

    | --- | --- |

    | -m | The -m option tells lpr to send mail after the print job has been completed.
    |

    | -P [destination] | Use the -P option when you want to direct your print request
    to a particular printer or device. For example, lpr -PMondo myfile.txt sends myfile.txt
    to be printed on the printer. |

    | -r | Use the -r switch when you want to remove the file printing it. For example,
    lpr -r myfile.txt tells lpr to print myfile.txt and then delete it. |

    | -T [title] | Use the -T switch to add a title to your pages. (Note that if the
    title contains whitespace, you must enclose the title in quotes. Otherwise, lpr
    will attempt to interpret the words as arguments.) |


    # Getting Print Job Status Using l1q


    Another tool you can use to check your print job status (especially on Linux and
    BSD-type systems) is l1q. To determine the status of all print jobs, issue the
    l1q command without arguments, like this:


    l1q


    +   l1q reports the following values:


    * The rank of the print request—This tells you the current progress of the job.

    * The owner—This identifies the user who issued the request.

    * The job number—This reports the job number.

    * The files being printed—This could be a filename (or filenames) or standard
    input or output.

    * The job''s size—This reports the size of the current print job.


    Here''s some sample l1q output from a Sparc system:


    | Rank Owner Job Files Total Size |

    | --- | --- | --- | --- | --- |

    | active bwagner 312 | standard input | 5940 bytes |


    On different systems, l1q output might look slightly different. For example, here''s
    a l1q report from a Linux box:


    ```

    Printer: ps@linuxbox1

    Queue: 2 printable jobs

    Server: pid 398 active, Spooler: pid 399 active

    ```'
