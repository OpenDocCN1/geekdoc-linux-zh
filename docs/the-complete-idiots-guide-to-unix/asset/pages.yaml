  md: '# # Appendix B


    ![](img/b0bfb2d724c393178bf462832858a65d_380_0.png)


    For the price, this book isn''t bad. However, there will come a time (probably
    fairly soon) when you''ll need more information about UNIX. When that time comes,
    you should turn to the Internet. The Net houses the world''s largest collection
    of UNIX information, and much of that information is free.


    This appendix is all about getting supplemental information.


    # ## Documentation on Various UNIX Distributions


    You can never have enough sources about your operating system. This next section
    provides links to a variety of sources, including the following:


    +   - Technical support centers

    - Software archives

    - Searchable knowledge bases and document archives


    # ## A/UX


