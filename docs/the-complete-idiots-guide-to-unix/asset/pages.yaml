    | -rw-rw-rw- | 1 bwagner | other | 46188 Aug 11 16:33 pppd-man.txt |

    | -rw-rw-rw- | 1 bwagner | other | 58 Aug 11 20:43 pppkill |

    | drwxxrxrwx | 8 bwagner | other | 512 Aug 1 01:32 public_html |


    For purposes of clarity, let''s extract the fourth line:


    +   - -rw-rw-rw- | 1 bwagner | other | 324 Aug 11 16:34 ppp-off


    Notice that the line is broken into fields. Here, you''re concerned only with
    the first field:


    +   - -rw-rw-rw- | 1 bwagner | other | 324 Aug 11 16:34 ppp-off


    The first field consists of ten characters: -rw-rw-rw-. Let''s break down what
    those ten characters mean.


    The first character tells you the type of file you''re dealing with. There are
    two tokens or:


    +   - (represents a file)

    - d (represents a directory)


    In the example, the first character is - .. Therefore, you know that you''re dealing
    with a file:


    ```

    [-rw-rw-rw-

    ```


    The remaining nine characters are actually three sets of three. Let''s break them
    down, three at a time. The first set (reading from left to right) represents the
    permissions of the current user:


    ```

    [-rw]-rw-rw-

    ```


    In this case, the current user (that''s me) has read and write but not not execute
    permissions. In contrast, the second set (reading from left to right) represents
    the permissions of the current group:


    ```

    -rw-[rw]-rw-

    ```


    # 301'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Part 5 System Administration


    Again, group users have read and write access. Finally, the last set represents
    what per-missions the rest of the world has:


    ```

    -rw- rw- [rw]-

    ```


    As you can see, the rest of the world also has read and write access. That''s
    easy enough, because everybody has the same permissions on this file. Suppose,
    however, that the permission table looked like this:


    ```

    drwxr-xr-x 2 root sys 512 May 21 1997 cron

    ```


    This is a different situation altogether. First, you know that this resource is
    a directory, because the first character is a d:


    ```

    drwxr-xr-x 2 root sys 512 May 21 1997 cron

    ```


    Also, you can see that root (the owner) has read, write, and execute privileges:


    ```

    drwxr-xr-x 2 root sys 512 May 21 1997 cron

    ```


    However, both the current group (sys) and world can only read and execute—they
    cannot write:


    ```

    drwxr-xr-x 2 root sys 512 May 21 1997 cron

    ```


    To reiterate, here are the key points:


    +   * The first character tells you the type of file you''re dealing with (typically,
    a regular file or directory).

    * The next three characters tell you the owner''s privileges.

    * The second set of three tells you the group''s privileges.

    * The last set of three tells you the world''s privileges.


    Now, let''s briefly cover how you establish these permissions.


    # Setting Permissions: The chmod Command


    To set permissions on an individual file or directory, use the chmod command.
    chmod accepts three operators: -, +, =. Each performs a different function:


    +   * The - symbol removes permissions.

    * The + symbol adds permissions.

    * The = symbol assigns permissions.


    Table 22.1 summarizes what permissions these operators can remove, add, or assign.


    302'
