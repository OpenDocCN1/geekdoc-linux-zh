    an email message can take as little as 80 seconds. Amazing.


    Is email going to put the U.S. Postal Service out of business? Not likely. Email
    is very impersonal and lacks the warmth of a hand-written letter. However, email
    is an excellent medium of communication for quick notes.


    In this chapter, you''ll learn how to send and receive email on your UNIX system.


