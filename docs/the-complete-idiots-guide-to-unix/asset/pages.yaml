  md: "# Part 2 > Nuts and Bolts\n\n# Binary or Source?\n\nUNIX software comes in\
    \ two formats:\n\n+   - Binary\n- Source\n\nThere's a big difference between the\
    \ two—a difference that can greatly influence whether you can run a particular\
    \ software package.\n\nBinary distributions are prepackaged executables already\
    \ prepared to run on your system. In this respect, binary packages closely resemble\
    \ the software you download for Windows or Mac OS. To use them, you simply unpack\
    \ them and run them. In most cases, you'll have no problems. (Provided, of course,\
    \ the binary was designed to run on your particular UNIX flavor).\n\nIn contrast,\
    \ source distributions come with source code. Source code is what a program consists\
    \ of before it has been packaged into machine language. I realize this doesn't\
    \ make much sense, so I'll illustrate the difference.\n\n# Source Code\n\nOn more\
    \ than occasion, you've probably wondered how programmers create programs. (After\
    \ all, it can't be that difficult. There's a lot of software floating around.)\
    \ In this section, I'll give you an inside look at this process.\n\nAt its inception,\
    \ the process starts with the programmer's notion of what the program will do.\
    \ Once he knows that, he can begin writing the program in a computer programming\
    \ language. (A computer programming language is a collection of instructions and\
    \ functions that can be expressed in plain English).\n\nIn UNIX, most programs\
    \ are written in the C programming language. (In fact, UNIX itself is written\
    \ in C.) Here's a typical C program in source form:\n\n```\n#include <stdio.h>\n\
    \nvoid main() {\n    printf(\"This is a typical C program in source form.\\\\\
    n\");\n}\n```\n\nWhat does this program do? It displays the following message:\n\
    \nThis is a typical C program in source form.\n\nThis is a pretty lame program,\
    \ but it serves our purposes. Take a look at the source code. Notice that you\
    \ can read it. Also, if you needed to change something, you can open the file\
    \ and edit it. That's great. Unfortunately, however, a computer can't read source\
    \ code, so programmers have to convert it into another language machine language.\
    \ To do that, they use a tool called a compiler.\n\n# 122"
