    many ISPs use Linux as an inexpensive alternative to commercial UNIX. Some reports
    state that Linux is now being chosen over Microsoft Windows NT for intranets.
    But that''s not all. In almost every computing environment, Linux has gained tremendous
    ground. For example, Linux was recently used to generate special effects for the
    immensely successful film Titanic.


    So, if all this is true, why hasn''t Linux taken the entire world by storm? Until
    very recently, if you choose Linux, you were choosing a life without technical
    support. If something went wrong, you had no one to call. Although that''s okay
    for hobbyists and programmers, the business world simply couldn''t take that.


    This has changed. Today, commercial Linux vendors (who sell the operating system
    for a relatively nominal fee) offer technical support.


    Noncommercial versions of Linux (without technical support) are listed here:


    +   * Slack—Available at http://www.cdrom.com/

    * Debian—Available at http://www.debian.org

    * MKLinux (for Macs)—Available at http://www.mklinux.apple.com/

    * Yggdrasil—Available at http://www.yggdrasil.com/


    Commercial versions of Linux include the following:


    +   * Calder OpenLinux

    * RedLinux

    * LinuxWare


    These versions are more expensive, but they typically include commercial applications
    that greatly enhance Linux''s power. (For example, Calder OpenLinux offers Looking
    Glass, a desktop manager that has all the functionality of Microsoft Windows NT.
    This makes Calder''s Linux very easy to use.)


