  md: '# Chapter 5 ➤ Surviving Shell Shock


    # The C Shell: csh


    The C Shell (csh) was created at the University of California at Berkeley. For
    many years, csh was the only alternative to sh. csh differs in several ways, the
    most fundamental being that the csh command language is different. (In other words,
    many commands and programs expressed in csh language are not sh-compatible.)


    # Big Trouble in Shell Paradise


    You''re probably wondering anyone would introduce a new command language for a
    shell. (Especially since the central goal has always been standardization.) Well,
    in the C Shell''s case, there was good reason: almost all UNIX utilities are written
    in the C programming language. In fact, the UNIX operating system is written in
    C. Since most UNIX developers worked with C on a daily basis, it seemed reasonable
    to create a shell that closely resembled C. And that''s exactly what csh.


    The problem is, while csh introduced some new concepts that made general tasks
    easier, it was not as suited for shell programming. (Shell programming, as you''ll
    see soon, where many shell commands are stored in text files for later execution.)
    Therefore, throughout UNIX history, UNIX vendors have shipped sh, csh, or both.


    This created a schism in the UNIX community. Some users stayed with sh, some migrated
    to csh, and some continued to use both (using csh for general tasks and sh for
    programming.) Since then, various shells have emerged. All are based on sh, csh,
    or both. Let''s quickly take a look at those shells.


    +   - Automated spelling correction. (If you spell a file or a directory name
    incorrectly, csh attempts to correct that.)

    - Scheduling. (You can use csh to time command execution.)

    - Command-line editing. (tcsh allows you to edit your command line.)


    tcsh is a csh-compatible shell with many features not found in csh. You could
    say that tcsh is on steroids. Advantages that tcsh has over csh include


    tcsh was considered a vast improvement over csh. However, for reasons unknown,
    commercial UNIX vendors did not adopt tcsh. Hence, for a long time, sh and csh
    were still the only choices...until the emergence of the Korn Shell.


