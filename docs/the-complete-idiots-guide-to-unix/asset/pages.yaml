    # Getting Multiple Files: The mget command


    The mget command is quite suitable for retrieving a single file. However, if you''re
    downloading multiple files, you should use the mget command instead.


    mget expects a filename list. (This is a space-delimited list of the name of all
    files you want to download.) In this list, you can specify exact filenames, like
    this:


    ```

    mget myfile.txt yourfile.txt

    ```


    Or, you can use wildcards, like this:


    ```

    mget *.txt

    ```


    # Uploading Files: The put command


    To upload a file, use the put command plus the name of the file you want to upload,
    like this:


    ```

    put inet.worm

    ```


    In response, ftp will transfer the file to the remote server.


    # About Transfer Modes


    Finally, to transferring files, you should check the transfer mode. The transfer
    mode controls the way the data is written during transfer. You''ll use one of
    two modes when transferring files:'
