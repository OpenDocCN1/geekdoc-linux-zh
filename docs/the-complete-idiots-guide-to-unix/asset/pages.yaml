    # Grep on Yourself, for Goodness Sake


    Because UNIX stores accounting, process, and configuration information in plain
    text, you''ll often seek out text patterns (regular expressions) in files. One
    program designed expressly for this purpose is grep.


    # Using grep to Search for Regular Expressions


    grep searches out regular expression in files and prints all lines that contain
    a match. (grep is one of the most useful UNIX utilities ever created.)


    At a minimum, grep takes two arguments: the regular expression you want and the
    file you like to search. For example, I have a file on my drive named guys. In
    it, I describe some characteristics about Tom, Dick, and Harry, three guys I racquet-ball
    with. Here''s the content of guys:


    +   - Dick has 2 nose rings.

    - Tom has 1 nose ring.

    - Harry has 3 nose rings, 1 pair of goggles, and 1 unicycle.


    Suppose I wanted to find out which these guys (if any) wears goggles. I would
    use grep, like this:


    ```

    grep goggles guys

    ```


    Here''s the output:


    Harry has 3 nose rings, 1 pair of goggles, and 1 unicycle.


    As you can see, grep dutifully grabbed line 3, the only line containing the string
    "goggles".


    Whenever you want to isolate an unbroken string of text, use grep in precisely
    this manner: grep string file.'
