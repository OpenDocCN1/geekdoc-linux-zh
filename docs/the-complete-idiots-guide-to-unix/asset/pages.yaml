  md: '# Part 6 ➤ Troubleshooting


    # About Backups and UNIX


    UNIX has two main backup tools:


    +   - cpio

    - tar


    These are available on every UNIX system and are not third-party tools. Third-party
    solutions exist, but they cost extra.


    Because I cover tar in Chapter 10, "Working With Applications," I’ll concentrate
    on cpio here.


    # A Backup Tool: The cpio Command


    cpio is an archiving tool. It creates archives of your files and directories for
    storage or transport. (cpio actually stands for copy in, copy out.)


    To use cpio for basic backups, issue this command:


    ```

    ls / -o [device]

    ```


    Here’s what this command does:


    +   - It gets a directory listing.

    - The listing is piped to cpio.

    - cpio copies the information to standard output.

    - Standard output is redirected to [device].


    Which device you actually send the data to depends on your hardware and the size
    of the device media. For example, for simple backups, you could send data to a
    floppy disk. (Devices are discussed in the following section.)


    # cpio Command-Line Switches


    cpio accepts several command line switches that control the data flow and how
    that data is written. These switches are summarized in Table 23.1.


    | Table 23.1. Selected cpio command-line switches |

    | cpio Switch | Purpose |

    | -d | This option instructs cpio to create directories within the archive (or
    in extracting an archive) as needed. |

    | -E [source-file] | This option instructs cpio to get filenames (for inclusion
    in the archive). That source file should contain one filename per line. |


    312'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Chapter 23 > Common Mistakes


    | cpio Switch | Purpose |

    |---|---|

    | -f [pattern] | This option notifies cio that you''ll supply a pattern and that
    any files matching that pattern should not be copied. |

    | -i | This option instructs cio to copy files from standard input. This is used
    when extracting files from a cpio archive. |

    | -L | This option instructs cio to follow symbolic links to get the files associated
    with those links. (This option must be set at backup time. Otherwise, by default,
    cio will not follow symbolic links.) |

    | -0 | This option instructs cio to copy files from standard output. (Files are
    also copied to standard output.) |

    | -r | This switch instructs cio to interactively query whether you want to change
    filenames. (In other words, whether you want to rename the files being copied.)
    This is useful when you''re unpacking an archive that might conceivably have filenames
    that already exist locally.|


    Regardless of how you decide to perform your backup, you''ll need to specify a
    backup device. This is a hardware device that has media to record your backup
    (for example, a tape or floppy drive). Table 23.2 lists a few common device types
    and their filenames.


    # Table 23.2. Some typical backup target devices


    | Name | Device |

    |---|---|

    | /dev/cdrom | CD-ROM drive (possibly a write-once or WORM) |

    | /dev/ffd0 | Floppy disk drive |

    | /dev/mnt0 | BPI tape drive (9-track) |

    | /dev/rfd0 | Floppy disk drive |

    | /dev/rst0 | SCSI tape drive |

    | /dev/rxt0 | Exabyte 8mm tape (NeXt) |

    | /dev/sdx2 | Optical disk drive (or other SCSI drive) |

    | /dev/sr0 | CD-ROM (NeXt) |

    | /dev/st0 | SCSI tape drive |

    | /dev/tape | SCSI tape drive |


    Check to see which devices actually exist on your system. (You may want to consult
    with your system administrator if you are unfamiliar with backup hardware.) For
    example, to back up a file list using tape, you could issue this command:


    ```

    tar -cf /dev/rst0 filelist

    ```


