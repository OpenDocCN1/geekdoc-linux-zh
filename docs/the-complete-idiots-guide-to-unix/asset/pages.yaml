  md: '# The End of the Line: The $ Metacharacter


    To find a text string at the end of a line, use the $ metacharacter. Here''s an
    example:


    ```

    grep cycle.$ *

    ```


    This will match any line that ends with cycle. Additionally, you can use wildcards
    in your search, like this:


    ```

    grep ''cy...$'' *

    ```


    This will also match cysts.


    # Egad! It''s egrep! Specifying Alternate Searches


    In addition to searching for exact (or sometimes vague) matches at the beginning
    or end of lines, you can also search for several different strings at once. For
    this, use the egrep program.


    The egrep program searches full regular expressions. You can therefore use egrep
    as a more fastidious egrep (egrep will match all alphanumeric and special characters).


    You can use egrep (coupled with the pipe symbol) to perform alternate searches
    or searches where you''re looking for more than just one string. For example,
    suppose you want to find all files that contain either cycle or cysts. To do so,
    enclose your terms in quotes and separate them by a pipe symbol, like this:


    ```

    grep "cycle|cysts" *

    ```


    This instructs egrep to match all lines where either cycle or cysts appear. However,
    suppose you only know of the words you''re looking for. Can you still use egrep
    to search for both? Absolutely. To do so, enclose your terms in quotes and isolate
    any unique characters in parentheses, separated by a pipe symbol, like this:


    ![](img/b0bfb2d724c393178bf462832858a65d_109_0.png)


    ```

    egrep "cy(cl.|st)." *

    ```


    In this case, egrep will only match lines that have either cycle or cyst followed
    by some other characters.


    Note that egrep''s searches are case sensitive. Additionally, I should mention
    that while egrep is quite powerful, you''ll probably use it less than plain, old
    grep. (In most cases, grep will suffice in the pattern you seek. Fall back on
    egrep if grep fails in that regard.)'
