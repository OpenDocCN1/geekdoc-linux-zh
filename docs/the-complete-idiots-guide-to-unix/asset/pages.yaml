  md: '# Chapter 1


    # I Thought UNIX Lived in Harems


    +   - Learn what UNIX is

    - A brief history of UNIX

    - Learn what UNIX is good for


    It happens in offices all over the world and has probably happened in yours: Folks
    gather around the water cooler and share war stories about their operating systems.
    “Last week, my registry got corrupted and I had to reinstall Windows.” “Oh Yeah!
    That’s nothing, I booted my Mac yesterday and the Control Panels disappeared?”
    The tales get taller and taller and then suddenly, a soft-spoken guy walks up
    and says he uses UNIX. Beads of sweat appear on the brows of your coworkers, who
    scurry away, muttering under their breath. In that moment, even if you never tried
    UNIX, you feel like a complete idiot.


    Rest easy. The truth is, UNIX isn''t nearly as difficult to learn as its reputation
    would suggest. Oh, it has its quirks, like any operating system. However, UNIX
    is based on fundamental principles. So, let''s start with a few of those fundamentals
    right now.


    # What Is UNIX?


    UNIX can be different things to different people. For example, ask a geek what
    UNIX is, and you''ll get an answer like this:'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'UNIX is 32- or 64-bit, highly portable, multiuser, multitasking operating system
    with a hierarchical file system based on abstract file descriptors, logical partitioning,
    compatible file, device, and interprocess I/O, asynchronous processing, copy-systems,
    a complete suite of TCP/IP clients and servers, and multiple command language
    interpreters.


    That makes perfect sense, right? Sure it does. What the geek is really trying
    to say is this:


    +   - UNIX is fast.

    - UNIX is powerful.

    - UNIX can accommodate many users simultaneously.

    - UNIX can manage many tasks simultaneously.

    - UNIX is the ideal system for the Internet.


    At its most basic, UNIX is an operating system, very much like Mac OS or Microsoft
    Windows NT. UNIX manages the day-to-day operation of your computer and provides
    you with a wide range of services, including data storage and data transfer.


    To illustrate what UNIX is (and its various uses), I offer a little UNIX history.


    # A Brief UNIX History


    UNIX has ancient roots. In 1964, MIT, General Electric, and Bell Labs (then a
    division of AT&T) collaborated to create a new operating system. It was called
    the Multiplexed Information and Computing System or MULTICS. The MULTICS project,
    I am sorry to say, was a complete disaster. MULTICS was large, unwieldy, and worst
    of all, buggy.


    Despite early failure, good things emerged from the MULTICS project. Ken Thompson
    (a programmer from Bell Labs) felt that he could do it. And, with assistance from
    fellow programmers Dennis Ritchie and Joseph Ossanna, Thompson did just that.


    The year was 1969. Marvin Gaye had a hit (I Heard It Through the Grapevine), we
    were at war, and if you were cool, you were driving a Dodge Charger. It was against
    this backdrop that Thompson did his work.


    Thompson''s first version of UNIX was shaky at best, but that quickly changed.
    UNIX was rewritten in the C programming language a year later. The result was
    a quicker, more stable operating system.


    What happened next was critical. In the early 1970s, UNIX was distributed to universities.
    There, students and educators alike found UNIX practical, versatile, and easy-to-use.
    UNIX was therefore incorporated into the basic computer science curriculum. As
    a result, an entire generation of computer science graduates had UNIX experience.
    When they took that experience to the marketplace, they brought UNIX into the'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Chapter 1 ► I Thought UNIX Lived in Harems


    However, the events that made UNIX the world''s most popular networked operating
    system elsewhere. At the time, the U.S. government was bent on establishing an
    internet for sometime communication. This network was designed to be impervious
    to a Soviet first nuclear strike.


    At the time, the concept was revolutionary. Mainframes housed centralized data
    that was doled out to terminals here and there. Because of this centralization,
    if our enemies knocked out a mainframe, they could incapacitate an entire network.


    ![](img/b0bfb2d724c393178bf462832858a65d_32_0.png)


    Other factors contributed to UNIX''s popularity, the most important of which was
    this: UNIX was a network operating system. Thus, users could access UNIX system
    simultaneously. This made it ideal for academic and business environments where
    folks shared printers and other resources.


    To remedy this, researchers studied ways to create a network where all workstations
    communicate with one another. And, through a theory they dubbed data redundancy,
    workstations had each access to the same information. Hence, if the Soviets knocked
    out one, ten, or one hundred servers, it would still not matter; the network would
    continue to operate.


    The idea looked good on paper, but there was a problem: Although the government
    had a conduit for electronic communication (the telephone system), it had no operating
    system to match. Enter UNIX.


    Engineers working on the internet chose UNIX as their operating system based on
    several factors. First, by then (roughly 1974), UNIX already had powerful working
    capabilities. For example, thanks to Ray Tomlinson of Bolt, Beranek, and Newman,
    UNIX already had an electronic mail system. Other networking services and protocols
    would soon follow, and by 1978, UNIX was jam-packed full of networking software.
    So, the U.S. government got its internet network after all. (In those days, the
    network was called the Advanced Research Projects Network or ARPANet. Today, we
    call it the Internet). From these modest beginnings, UNIX became a phenomenon.


    Because the Internet was a government project, UNIX had to adhere to certain standards.
    Hence, throughout its history, UNIX has been standard-based, and this has only
    increased the operating system''s popularity. Between 1978 and 1998, nearly every
    major computer company developed their own version of UNIX. (Microsoft even gave
    UNIX a spin, creating XENIX. However, the software giant couldn''t make a buck.
    Bill Gates thereafter changed his focus to the desktop market. That was 17 years
    and $50 billion ago.)


    Since then, UNIX has gone through many changes. Today, there are millions of UNIX
    users in dozens of different fields. Let''s briefly examine those fields now.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# What Is UNIX Good For?


    You might have heard that UNIX is for super-nerds, and to a limited degree, that''s
    true. UNIX is often used for scientific research and in highly technical fields.
    (For example, UNIX sent Pathfinder to Mars.)


    However, UNIX is also used for other tasks. For example, UNIX offers precision
    math and graphics, and therefore, it''s a favorite of the film industry. (Here''s
    a little known fact: It wasn''t an iceberg that sank James Cameron''s Titanic;
    it was UNIX.) In fact, UNIX was used to generate eye-popping special effects in
    all the following films:


    +   * Starship Trooper

    * Jurassic Park

    * The Mask

    * Toy Story


    ![](img/b0bfb2d724c393178bf462832858a65d_33_0.png)


    Here''s a fact: It''s estimated that in 1990, better than 90 percent of all Internet
    servers were running UNIX. (VAX/VMS, an operating system developed by Digital
    Equipment Corporation, trailed close behind.) Today, Microsoft Windows has made
    substantial inroads in this area. Most information managers find that UNIX is
    a suitable Web server platform. Therefore, UNIX''s monopoly on Web servers has
    dwindled considerably, although it still accounts for almost half of all Web servers.


    ![](img/b0bfb2d724c393178bf462832858a65d_33_1.png)


    How many UNIX boxes does it take to create an alien insect race? Ask Tippett Studio,
    the company that provided special effects for Starship Trooper. They reportedly
    130 Silicon Graphics workstations. (Compare with that 400 UNIX workstations used
    to sink the Titanic. Amazingly, 100 of those machines were running Linux, a free
    version of UNIX. More on Linux in Chapter 2, "UNIX Flavors.")


    George Lucas (the creator of Star Wars) is also a big UNIX fan. Interviewers ask
    him why he chooses Silicon Graphics UNIX machines over cheaper hardware and software.
    His answer is simple: He enjoyed exceptional success with UNIX so why he should
    switch?


    Beyond the film industry, UNIX is used for statistical analysis, aeronautics design,
    astrophysics, artificial intelligence, simulation, medical imaging, satellite
    tracking, and even DNA research.


    +   * Text and word processing

    * Accounting and general record keeping

    * Playing games

    * Cruising the Net

    * Establishing your own Web server


    So, does this mean you have to be a geek to use it? No in way, you can use UNIX
    to perform every everyday tasks, including the following:


    UNIX, therefore, is good for any task that demands precision computing. However,
    UNIX truly excels in one special area: networking. No operating system is'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'more suited to this purpose. Whether you''re creating a local area network
    (LAN) or building a Web server, UNIX is an excellent choice. It''s exceptionally
    stable and designed to handle high-speed network traffic flawlessly.


    In particular, UNIX is now being used for intranets. (These are small networks
    that run on Internet protocols. You can use to create a miniature version of the
    World Wide inside your company.) Intranets save corporations thousands of dollars,
    and UNIX is largely responsible for that.


    So, if all this is true, why does UNIX have such a bad reputation? Why do people
    insist that UNIX is impossible to learn?


    ![](img/b0bfb2d724c393178bf462832858a65d_34_0.png)


    # Before You Decide to Make Another Jurassic Park


    Can you generate those same, awesome special effects? Maybe and maybe not. Not
    all UNIX workstations or distributions are intended for intense graphics. Primarily,
    highpower graphics are generated on SGI workstations, machines that ship with
    special software and hardware specifically designed for the film industry. (These
    software packages cost thousands of dollars.) However, given the right hardware
    and software, yes...you could generate absolutely stunning graphics. To check
    out Silicon Graphics and its awesome workstations and software, go to its World
    Wide Web site at http://www.sgi.com.


    # How Did UNIX Get Such a Bad Reputation?


    Many people claim that UNIX is simply not user-friendly and until recently, that
    was true enough; UNIX has traditionally been more difficult to learn than Mac
    OS or Microsoft Windows. The reason for this disparity lies in UNIX''s development
    history.


    In the past, UNIX developers were concerned solely with functionality. Appearances
    simply didn''t matter. In contrast, Apple and Microsoft spent millions of dollars
    ascertaining how to make computing a more pleasurable experience. For example,
    Mac OS is designed so that application menus melt into the menu bar at the top
    of your screen. Similarly, Windows applications have a standardized look. The
    menu bar invariably changes such as File, Edit, View, and Help. On these characteristics
    Mac OS and Windows exceptionally easy to learn. Many authors have remarked that
    if you know one Windows application, you know them all.


    Command-line interfaces differ sharply from graphical user interfaces (GUI, pronounced
    "gooey"). GUI display menus with various options. You may use your mouse to choose
    these options. After you choose an option, the GUI articulates the complete command
    for you and relates that the underlying operating system. In.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Just the Basic Facts


    contrast, in a command-line interface, you formulate commands on your own and
    relate these to the operating system using your keyboard.


    ![](img/b0bfb2d724c393178bf462832858a65d_35_0.png)


    At first glance, you might conclude that a GUI offers you more flexibility and
    power, and for some tasks, that''s true. (This is particularly true with respect
    to desktop publishing.) However, for most general tasks, the UNIX CLI offers you
    far more power than any GUI. You simply have to know how to use it.


    # The Command-Line Interface


    A command-line interface (CLI) is a computing environment where you type your
    commands (instead of using a mouse). This is also sometimes referred to as a text
    interface.


    However, you no longer have to sacrifice user-friendliness for UNIX functionality.
    In the past years, the general public has gravitated towards UNIX. In response,
    UNIX developers have incorporated user-friendliness into the operating system.
    As you''ll discover in Chapter 11 "Tyrannosaurus X: A Windowing System," modern
    UNIX is extremely user-friendly and supports various window systems. So, in essence,
    UNIX is now no more difficult to use than Microsoft Windows.


    ![](img/b0bfb2d724c393178bf462832858a65d_35_1.png)


    # Stupid UNIX Pet Tricks


    Here''s a simple task that would take forever in Microsoft Windows or Mac OS:


    +   1. Open 10 files.

    2. Grab the first 20 and last 30 lines of each file.

    3. Close the files but keep the 500 lines of text you grabbed.

    4. Scan those 500 lines of text for a specific sentence.

    5. If your scan finds that, it executes a command.


    # Can I Run UNIX?


    Can you run UNIX? Absolutely. UNIX supports widely diverse hardware. However,
    this wasn''t always the case. Most commercial UNIX distributions ran on workstations.
    Workstations are proprietary computers specifically designed to run UNIX. These
    machines often contain special hardware that renders exceptionally high performance.(For
    example, machines used during Jurassic Park have a proprietary graphics chip.
    This chip can perform calculations extremely fast, and therefore, graphics generated
    with smooth and fluid.)


    Here are some examples of workstations:


    +   The Indigo product family by SGI. Indigos are manufactured by Silicon Graphics,
    Inc., and are most commonly used in the film or graphics industries. Indigos are
    very stylish and easily distinguished from other computers. Most are deep purple,
    indigo, or green, and their cases sport sleek, sharp geometric shapes.


    In a GUI, it would take you minimum of 40 clicks just to get the 500 lines of
    text. In UNIX, you can complete this entire task with a single command-line.


    # 12'
