- img_proc: true
  md: '# Chapter 10 > Working with Applications


    tar is a very special command; it packages entire software distributions for later
    use. For example, when a UNIX developer creates a powerful and useful program,
    that program is usually comprised of many files across several directories. To
    get that directory structure from his hard disk to yours, he uses tar.


    tar takes the programmer''s directory structure (and all the files in) and packages
    them in a single file with a .tar extension (for example, fptool.tar). This file
    can be later unpacked; when it is, all the files and directories will expand to
    their original locations. (Why would anyone want to do that? Simple: At startup,
    the program probably looks for certain files to be in certain directories. If
    those files are absent—or if they aren''t in the directories they''re supposed
    to be in—the program proceeds on error.)


    # Extracting a tar Archive


    To extract a tar archive, use the tar command, your desired command-line options,
    and the filename you want to extract. Here''s an example:


    ```

    tar xvf fptool4.tar

    ```


    Here''s what that command does:


    +   * The tar command starts tar.

    * The switch tells tar to extract the file.

    * The v switch tells tar to print verbose output.

    * The f switch tells tar to use the file fptool4.tar as the target.


    Depending on the size of the archive, you''ll see several filenames and directory
    names scroll by. This is tar''s way of telling you where it''s extracting the
    files.


    Ninety percent of the time, you''ll use the tar xvf command to extract tar archives.
    However, tar supports many other command-line switches. These switches are summarized
    in Table 10.2.


    | Table 10.2. Selected tar command-line switches |

    | Switch | Result |

    |---||

    | c archive-file | Tells tar to create a tar archive file from the specified files
    or directories. |

    | f archive-filename | Tells tar to use the specified archive filename to pack
    or unpack files. |

    | F filename | Tells tar to take additional archive parameters from the specified
    filename. |


    133'
