    ed has a lot of functionality for a line editor. Of course, in practice, you''ll
    rarely use ed. However, it''s good to know a little ed in case something goes
    wrong. (If your window system fails, for example, you''ll still be able to edit
    configuration files.)

    Enough enough about ed. Let''s check out vi.


    # The vi Editor


    As I explained in Chapter 2, "UNIX Flavors," the folks at Berkeley found that
    AT&T UNIX wasn''t very user friendly. (Gee, I can''t imagine why.) As part of
    their campaign to remedy this, they created vi (or the visual editor).

    vi had several advantages over line editors, the most important of which was visualization.
    Using vi, users could see an entire page of text at one time. This reduced the
    likelihood of error, increased efficiency, and generally made the user experience
    more enjoyable.


    # Starting vi and Opening Files


    To start vi, enter the vi command (preferably followed by name of the file you''re
    about to edit). Let''s stick with phone.txt for a moment. To edit phone.txt with
    vi, enter the following command:


    ```

    vi phone.txt

    ```


    The vi environment will start, and vi will load the requested file, as shown in
    the following figure.


