- img_proc: true
  md: '# Chapter 7 ➤ Regular and Not-So-Regular Expressions


    You begin by editing a new file. (In this case, we''ll call it tables.) The first
    line of

    tables calls awk, like this:


    ```

    #!/usr/bin/awk

    ```


    This tells the shell where it can find awk. Next, you open your procedure by inserting

    a { symbol. So, tables should now look like this:


    ```

    {

    !/usr/bin/awk

    ```


    Next, you describe the procedure. In this case, you want to label each line and

    the value. Therefore, you insert the following text:


    ```

    print ""

    print "Department: \t", $1

    print "Workstations: \t", $2

    print "Employees: \t", $3

    print "Hours: \t\t", $4

    ```


    Now, let''s break this down. The first line (print "") tells awk to print a blank
    line

    between records, which will make your tables easier to read. The remaining lines

    print a label (for example, "Department:"), a field value (for example, $1, which
    rep-

    sresents field 1), and a tab (\t). Therefore, the contents of tables now looks
    like this:


    ```

    #!/usr/bin/awk

    ```


    ```

    {

    print ""

    print "Department: \t", $1

    print "Workstations: \t", $2

    print "Employees: \t", $3

    print "Hours: \t\t", $4

    ```


    Finally, you close your procedure with the } symbol. The entire tables script

    now look like this:


    ```

    #!/usr/bin/awk

    ```


    ```

    {

    print ""

    print "Department: \t", $1

    print "Workstations: \t", $2

    print "Employees: \t", $3

    print "Hours: \t\t", $4

    }

    ```


    93'
