    # # A Few Words about Security


    This book is really too short to give you a decent primer on security. However,
    here are some basic rules to live by:


    +   - Don''t log in as root unless you have to—While logged in as root, you can
    make changes to any file. This is a dangerous situation, because in many cases,
    your mistakes will be permanent. Therefore, use the root account sparingly.

    - Never give anyone the root password—The root password gives you access to everything.
    If someone gets your root password, he or she can seize control of your machine.
    Protect that password with your life. Don''t write it down, and make sure that
    it isn''t easy to guess. (For example, don''t make the root password your birthday,
    your social security number, or even any word found in the dictionary.)

    - Backup the entire system on a regular basis—Backups often comprise the only
    evidence you''ll ever have that a security breach has occurred. If you have more
    than a few users, you should backup weekly (at a minimum).

    - Buy a good book on security—UNIX security is a very complex field that''s evolved
    over some 25 years. If you really intend to secure your server, you need expert
    advice. For this, I recommend the following book:


    Garfinkel, Simson and Gene Spafford. Practical UNIX and Internet Security.

    O''Reilly & Associates, 1996. ISBN 1565921488.

    This will take you step through the paces of UNIX security.


    # # The Least You Need to Know


    As a UNIX server administrator, you have enormous power to affect the system for
    good and for ill. Here''s the least you need to know:


    +   - Manipulate user permissions using chmod.

    - To add users, add their entries to the passwd file.

    - Never give anyone your root password.


