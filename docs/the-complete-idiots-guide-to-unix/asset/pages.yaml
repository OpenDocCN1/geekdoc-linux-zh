  md: '# Appendix C ► Speak Like a Geek: The UNIX Bible


    NIS Network Information System. A system developed by Sun Microsystems allows
    Internet hosts to transfer information after authenticating themselves with a
    single password. NIS was once called the Yellow Pages system.


    OpenLook A windowing system created by Sun Microsystems.


    OSF/1 A version of UNIX created by the Open Software Foundation but now maintained
    by the OpenGroup. You can find the OpenGroup at http://www.opengroup.org.


    passwd A file located in the etc directory stores usernames and other user information
    (including, occasion, users'' encrypted passwords).


    path The full directory to a particular file or directory. For example, /etc/passwd
    is a path to the file passed. (Also, the path variable stores all directories
    UNIX will search when looking for a file)


    Perl The Practical Extraction and Report Language. Perl is an extremely powerful
    text-scanning and processing language. It''s often used to extract meaningful
    reports from mountains of plain-text data. Perl is like a combination of the shell
    languages, awk, and sed steroids.


    permissions Controls applied to files and against users. For example, you can
    specify whether users can read, write, or execute files. These permissions appear
    on a standard -1 directory listing on the far-left column:


    ```

    -rw-r--r-- 1 bwagner 200 66 Jun 28 23:25 c1g.c

    ```


    pico A freely available text editor for UNIX. (pico is more commonly seen on Linux
    systems. However, it''s available for all UNIX flavors.) pico is easy to use and
    has a user-friendly interface.


    pine A mail client for UNIX created at the University of Washington. pine is often
    seen on Linux systems but is available for all UNIX flavors. pine is popular because
    it has a user-friendly interface. (Incidentally, pine stands for "pine is not
    elm.") elm is a popular UNIX mail program.


    POSIX Portable Operating System Interface. POSIX is a programming standard. Applications
    that are POSIX compliant are portable to platforms other than the ones on which
    they were originally compiled. The POSIX standard promotes development of programs
    that can run on many different operating systems, not just one.


    PostScript An interpreted language used to communicate with printers. Also, PostScript
    is a file format used to store text and graphics files. (See Encapsulated PostScript.)


    Process A program or job that is currently running.


    prompt In general, the $, #, or % symbol, which signals that UNIX is ready to
    accept commands. Also, any signal from UNIX it''s waiting for your input.


    # 375'
