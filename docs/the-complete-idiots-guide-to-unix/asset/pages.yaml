- img_proc: true
  md: 'In UNIX, the standard window system is the X Window System, developed at the
    Massachusetts Institute of Technology (MIT). (Hip UNIX users tend to refer to
    the X Window System as X, so we''ll do the same.) X, too, allows you to visualize
    data and your system devices. However, X goes beyond simple visualization.


    # # Windows That Can Talk: The X Protocol


    X isn''t just a window system—it''s a network protocol. In fact, X was originally
    designed more for networking than for visualization. To understand X networking,
    you just need to understand remote application deployment. (Oh, is that all?)


    Here is it in a nutshell: With X, you can run a program on your own system, even
    though program resides somewhere else. (That "somewhere else" could be in the
    next office or 10,000 miles away.) You can do this even though the specified program
    isn''t installed on your machine. But wait, there''s more. Using X, you can run
    UNIX programs on a Mac (or even run Windows programs on UNIX).


    ![](img/b0bfb2d724c393178bf462832858a65d_166_0.png)


    You have several ways available to you to run Microsoft applications on UNIX.
    One is to use standard X functionality. In this scenario, you can run a Microsoft
    application within your Web browser. Conversely, you can also use suites such
    as WABI (from Sun Microsystems) that will actually run Windows applications locally.
    (There''s also a terminal that will now run Windows NT and UNIX on the same box.)
    In short, the gap between Microsoft applications and UNIX is closing every day.


    How is this possible? It''s possible through the X protocol, which is built on
    the client/server model. Traditionally, a server application is any program that
    distributes data to clients from a centralized point. A client application is
    any program designed to interact with (and receive information from) a server.
    A perfect example is the relationship between a Web server and your Web browser
    (the client). In X, the client/server relationship is a little more complex.


    In X, your system is both a client and a server. The client interacts with other
    servers over the network, getting various data. Meanwhile, your local server displays
    that data graphically. If that sounds confusing, don''t worry about it. It basically
    breaks down to this: Using X, you can run remote applications from anywhere on
    just any machine.'
  merge: -1
