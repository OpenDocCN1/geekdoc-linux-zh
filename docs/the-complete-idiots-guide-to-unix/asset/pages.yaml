  md: '# Chapter 10 Working with Applications


    Compilers create binaries from raw source code. For example, when the same code
    is run through a compiler, it comes out the other end as machine code, suitable
    for execution. At this point, the program is no longer in source form. Instead,
    it is in binary form (Therefore, although you can''t run it, your machine can).


    On the Internet, many UNIX programs are distributed in source code, and there
    are several reasons for this. One is that you can change the program if you want.
    (You''ll probably never modify source code in your life, but many people do. Those
    who appreciate the convenience of having the source code handy.).


    Another reason is: Some programs are written to compile on multiple UNIX flags.
    In some case, the software''s author provides generic source code. This source
    code will dynamically compile into a functional binary only after ascertaining
    which operating system it''s compiling. Therefore, the same source code can compile
    cleanly on Solaris, SunOS, Linux, HP-UX, and so on.


    Either way, programs are often distributed in source form. You can easily determine
    whether the program you downloaded was distributed in binary or source form by
    using either of the following methods:


    +   - Take another look at the Web page or FTP site where you got the file. Was
    there any accompanying text? Usually software authors include a description file
    or comments that relay this information. For example, software authors often offer
    you the option of downloading binary or source files.


    +   - Examine the filename. Often, the file''s structure is described in the filename.
    For example, 11nddir2.0.bin.tar.gz is a binary file (notice the bin in the filename?),
    whereas 11lndir2.0.src.tar.gz is a source file (note the src in the filename).
    In, software authors may be even more explicit by naming the file something like
    11nddir2.0.source.tar.z.


    Whenever a software program comes in both binary and source form, you should always
    seek out the binary. Here''s why: You may not have the right tools to compile
    raw source. However, if the program sounds too cool to pass up and only comes
    in source form, it gets anyway.


    In the next section, I''ll describe the steps you need to follow in order to take
    downloaded software and install it.


    # Zips


    If you look at the previous filenames, you''ll notice they end in .gz or .z. You''ll
    see these endings a lot on the Internet. What do they mean? They mean that these
    files are zipped or compressed.


    Most downloadable files have been zipped or compressed. The purpose of doing this
    is pretty basic: In the old days, UNIX users had 300-baud modems. Therefore, developers
    sought a way to make transfers faster. They settled on compression.


    129'
