    Many people think that UNIX is difficult to learn. It''s not just user-friendly,
    they insist, and it will never be. If those folks had seen the first version of
    UNIX, they''d change their point of view. You see, in 1969, there were no windowing
    systems, no help files, no file managers, and certainly no install wizards.


    Instead, UNIX was an arcane and elusive system, known only to the folks at Bell
    Labs. Command syntax was primitive, and to be frank, even modern computer wizards
    would have been intimidated by the UNIX interface.


    So, the folks at Bell Labs decided to have pity on the rest of us. a fellow named
    Stephen Bourne added the first real amenity to UNIX. By standards of the day,
    Bourne''s contribution was a step toward user-friendliness. He designed a program
    that would evaluate and execute commands, and he called that program a shell.
    That''s what this chapter is all about: the UNIX shell.


    # What''s a Shell, Anytime?


    To understand what a shell is, you need only understand this: computers speak
    a language all their own. (Of course, you probably already know that, which is
    why you bought this book.)'
