  md: '# Chapter 10 > Working with Applications


    The answer varies. Most binary distributions pose no problem at all. Usually,
    they extract to a single, executable file. If you encounter this situation, rejoice!
    To run the program, you simply have to issue it as a command. For example, xdir
    binary distributions contain a file called xdir. To launch it, you simply type
    xdir in X and bingo, the xdir program appears on your screen.


    Unfortunately, not all distributions are simple. Some require you to move one
    or more files to a specific directory. Others require you to configure the program
    before executing it. Finally, some require you to actually compile the program.
    To find out, you need to examine the distribution carefully.


    # Examining the Distribution


    By now, you''re probably thinking that these UNIX folks are pretty tough. After
    all, they make you download, unzip, and untar their software. As if that wasn''t
    enough, they also make you set up the software on your own, without any instructions?
    Not quite.


    If the software distribution requires additional hacking, you''ll know it, and
    here''s how: Software includes instructions (often very detailed instructions)
    in one or more text files included with the software. It has been a long-standing
    rule that these files must be named reasonably familiar. For that reason, 99 percent
    of all such distributions will come with files named README or INSTALL.


    A example is the wonderful FTP client for UNIX called MoxFTP. MoxFTP''s distribution
    comes with a file named mftp.readme. Here are the contents of that file:


    This is a static version of mftp compiled with Motif 1.1.


    To install:


    ```

    # cp mftp /usr/bin/X11

    # cp ftp_for_xftp /usr/bin/X11

    # cp mftp /usr/lib/X11/app-defaults

    ```


    To run:


    ```

    # mftp

    ```


    Enjoy,

    rocco@perseus.maschinenbau.TU-Ilmenau.DE


    As you can see, the author gives pretty clear instructions on how to install and
    run the program. In this case, the author explains that you need to copy certain
    files to various directories and then execute the program. In most cases, by following
    the software author''s simple instructions, you''ll be running your new program
    in no time.


