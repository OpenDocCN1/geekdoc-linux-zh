  md: '# Part 4

    UNIX’s Net Worth


    Okay, so now that you know what UNIX is, where it came from, and why it''s cool,
    you probably want to take this puppy out for a drive and check the scenery. Well,
    it''s a big world out there, but UNIX has the ponies to keep you in the fast lane.


    In fact, UNIX and the Net grew up together, and in Part IV you''ll learn how to
    take advantage of that long-term relationship. After first becoming a UNIX historian,
    you''ll learn how to communicate through email and chat, discover how to get the
    latest news, and cruise the Web with the coolest browsers. So strap yourself in
    and let''s go!


    ![](img/b0bfb2d724c393178bf462832858a65d_232_0.png)'
