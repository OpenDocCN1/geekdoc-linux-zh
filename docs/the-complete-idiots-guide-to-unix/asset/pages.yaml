    # Xcruciating Peccadilloes


    Chances are you''ll take a few weeks to get acclimated to X. Not only does X have
    a different look, it has a different feel. Above and beyond that, though, there
    are some common pitfalls to watch for when using X. This next section discusses
    those pitfalls.


    # Windows from Hell


    One of the first things you''ll notice is that not all X windows are uniformly
    sized. In fact, many X applications open in odd positions on the screen. Some
    even fill the entire screen. For example, a graphics demo called xgc spans several
    screens when first opens. (See the following figure.)


    ![](img/b0bfb2d724c393178bf462832858a65d_344_0.png)


    321'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Part 6 > Troubleshooting


    A lot of X applications behave this way. So, what''s the deal? Are X developers
    trying to irritate you? No, not quite. Instead, the truth is so banal: Many X
    applications are designed on systems with huge monitors. Because these monitors
    have resolutions that far exceed the norm (the norm being 640x480), applications
    designed on them appear huge when displayed at normal resolutions.


    Often, huge X applications can interfere with your work, making it impossible
    for you to reach other windows. The cure is to grab the offending application
    by its edges and resize it. (Usually, you need to resize just a little; enough
    to grab it and find the maximum button. Usually, clicking the maximum button will
    force the offending application to fill only the viewable screen. From that point,
    you can safely and efficiently manipulate the application.)


    On the other hand, in rare instances, applications may not respond. (The edges
    may be beyond your reach or the graphics libraries used do not provide for resizing
    from the corners or sides.) If so, there''s only one solution: Hit Ctrl+backspace
    to kill X and restart. Once you''re back in X, open an Xterm and restart the application.
    This time, however, try using the geometry command-line option, like:


    ```

    program-name -geometry 200x200

    ```


    If the developer adhered to standard programming rules, the application should
    open at 200x200 resolution. If it doesn''t, there''s a problem, and you should
    send the developer an angry email. (Just kidding.)


    # The Killing Fields


    Another problem is data entry field behavior. For example, certain fields will
    not accept data unless your mouse cursor is positioned over the field. This is
    common with applications designed using the Athena Widget Toolkit. No cure exists
    for this field. If you encounter this problem, you have to position the mouse
    cursor over the field.


    Likewise, some development packages produce fields that fail to recognize a destructive
    backspace. (A destructive backspace is where you use the backspace key to destroy
    all characters to the cursor''s left.) There may be a cure for this. Some applications
    (Crisp is one) allow you to swap the backspace and Delete keys. However, if the
    developer made no such provision, you''re out of luck. In this case, you''ll probably
    have to use the Delete key.


    322'
  merge: -1
