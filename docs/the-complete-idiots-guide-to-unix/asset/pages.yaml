    at a command prompt, the program associated with it runs.


    file A UNIX program that identifies the specified file''s data type. For example,
    if you want to find what type of data is stored in /etc/passwd, you could issue
    the following command: file /etc/passwd. file responds by reporting this: /etc/passwd:
    ascii.


    find A UNIX program that searches for the specified file. Use find to find files
    on your system. For example, find all files with a .txt extension, issue the following
    command: find -name "txt".


    finger A UNIX program that gathers personal information on the specified user,
    including his or her username, real name, shell, and office telephone number (if
    available). You can use finger (finger username) across the Internet using the
    specified user''s email address (finger username@acme.net).


    foreground A space in which run where you can see the output in realtime. For
    example, when you use grep to search a large database file for a particular string,
    use grep''s output as it occurs. This time grep finds a match, it prints this
    output to the screen. (Compare with background.)


    fork A program event that occurs when UNIX creates a new (or child) process. During
    this event, UNIX makes a copy of the original (or parent) process. The child then
    continues to work independently of the parent.


    Free Software Foundation The Free Software Foundation (FSF) promotes the development
    and use of free software. (In this context refers to copy and distribute restrictions.)
    Check FSF out at its WWW site (http://www.fsf.org).


    FTP File Transfer Protocol. FTP is the most commonly used means of transferring
    files from one host to another.


    g++ The Free Software Foundation''s version of C++. g++ is actually an excellent
    functionality of gcc, the FSF''s compiler.


    gateway A point on a network where two (or more) network protocols are translated
    into other protocols. Typical examples of such translation include TCP/IP to basic
    Ethernet or even proprietary protocols.


    gcc The Free Software Foundation''s C compiler. (See C, C++, and g++).


    GNU standards for GNU''s Not UNIX. This refers to a series of free UNIX programs
    written by the Free Software Foundation. These programs are for distribution and
    use and are compatible with most UNIX distributions.'
