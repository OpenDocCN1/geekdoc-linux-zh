    # Chapter 13


    # # Running X and X

    Applications


    +   ### In This Chapter

    - Starting X

    - Launching programs from an Xterm window

    - Launching programs in an Xterm window

    - Customizing menus to launch commands


    X is very “plastic” in the sense that you can make it do almost anything. (In
    fact, X is often criticized as being a bit too configurable.) From this, many
    people draw the conclusion that not enough standardization exists in X. At first
    glance, that seems like a reasonable assumption.


    However, in truth, X does enforce many standard rules on almost all applications.
    The trick is to learn how these rules work and how to use them to your advantage.
    That''s what this chapter is all about.


    # ## Starting X


    Starting X can be done in several ways. On most UNIX systems, you can start X
    using the startx command, like this:


    ```

    startx

    ```


    What happens after you issue this command will vary. In many cases, you''ll see
    several messages scroll by and then suddenly, X will appear.'
