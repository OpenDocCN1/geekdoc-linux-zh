  md: '# Finding Man Pages


    Until now, I''ve been operating on the assumption that you know the command you
    want to learn more about. Maybe that''s wrong. Maybe you''re not looking for man
    pages on a particular command; instead, you want man pages on certain types of
    commands. (This is a fancy way of saying that you have only a vague idea of what
    you''re looking for.)


    If this is the case, you need to issue a more general query (or an apropos query).
    To do this, you can man with the -k option plus a search term, like this:


    ```

    man -k password

    ```


    This command asks for a listing of all man pages on commands that deal with words.
    UNIX responds with this:


    +   - crypt (3) - password and data encryption

    - passmass (1) - change password on multiple machines

    - fgetpasswd (3) - get password file entry

    - ypasswd (1) - NIS password update clients

    - getpwuid (3) - get password file entry

    - conflict (8) - search for alias/password conflicts

    - putpw (3) - write a password file entry

    - passwd (5) - password file

    - endpasswd (3) - get password file entry

    - getwnam (3) - get password file entry

    - get (3) - get password file entry

    - ypasswd (8) - NIS password update server

    - setpasswd (3) - get password file entry

    - getpw (3) - Re-construct password line entry

    - getpass (3) - get a password

    - mkpassword (1) - generate new password, optionally apply it to a user

    - vipw (8) - edit the password file

    - xlock (1x) - Locks the local X display until a password is entered.


    This is quite list. Is there a way to refine this output? Yes. You can join this
    query with a grep command. For example, suppose you want only those entries that
    deal with NIS passwords. In this case, you could issue the following command:


    ```

    man -k password | grep NIS

    ```


    This time, UNIX responds with a more relevant answer:


    +   - ypasswd (1) - NIS password update clients

    - ypasswd (8) - NIS password update server


    From here, you can check out the man pages for ypasswd and ypasswd. Pretty cool,
    right? But wait, there''s more. Why should you have to enter additional commands
    to'
