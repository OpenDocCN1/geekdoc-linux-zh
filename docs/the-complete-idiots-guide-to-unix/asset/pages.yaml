  md: '# textedit


    Finally, an editor that has a simple, understandable name! Sun Microsystems first
    introduced textedit in SunOS 4.1. At that time, it was bundled with a graphical
    environment SunView. textedit supports most functions that are common to word
    processors, including copying, clipping, pasting, and so on. (It also has search
    and replace functions.)


    textedit is available mainly on SunOS, Solaris, and Linux systems (although free
    versions are available for most UNIX systems).


    # Starting textedit


    To start textedit, issue the textedit command in a shell window, like this:


    ```

    textedit

    ```


    This will load the textedit application, as shown in the following figure.


    ![](img/b0bfb2d724c393178bf462832858a65d_130_0.png)


    You can move though screens (or scroll down the page) by using the slide control
    at the far right side of textedit.


    # Using textedit Menus


    textedit is very "point and click" oriented. The main menu bar (refer to the previous
    figure) closely resembles menu bars you''ve seen in Mac OS or Microsoft Windows.
    From these, you can choose various options (such as Find). However, all such options
    are available from text pane window, which you can summon by right-clicking any
    empty portion of the textedit screen. (See the following figure.)'
  merge: -1
