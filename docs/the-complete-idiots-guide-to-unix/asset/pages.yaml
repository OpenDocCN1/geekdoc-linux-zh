  md: 'Part 2 > Nuts and Bolts


    # ### Table 10.1. Some gzip and gunzip command-line switches


    | Switch | Result |

    |---|---|

    | 1 | Optimizes compression for speed. (This results in larger files that uncompress
    more quickly.) |

    | 9 | Optimizes compression for size. (This results in small files that take longer
    to unzip.) |

    | c | Tells gunzip to preserve the original files but simply display the results.
    (It basically writes the archive''s contents to STDOUT.) |

    | d | Used to decompress files. For example: gunzip -d Fptool14.bin.tar.gz |

    | h | Provides quick help on gunzip. (gunzip -h calls the usage summary.) |

    | 1 | Provides a test run. This is where gunzip does not actually unzip the files.
    Instead, it shows you the contents of the file. |

    | N | Preserves the original timestamp and filenames. |

    | n | Ignores the original timestamps. (Timestamps will be set to the current
    time.) |

    | q | Tells gunzip to suppress any warning messages. The q option is for seasoned
    zippers only! |

    | r | Tells gunzip to operate recursively on directories. (This means that your
    zip or unzip reaches into subdirectories and either packs the files into or from
    these subdirectories.) |

    | S suffix | Imposes the specified suffix on compressed files. |

    | v | Forces verbose messages. (Use verbose messages when you''re not sure what
    to happen. This way, you get the complete report on what happens with your archive.
    I always use verbose messaging so I can track errors and identify the reason for)


    Does all this compressing, uncompressing, zipping, and unzipping really any good?
    It depends. Compressing and zipping files can save a little space or a lot. Some
    files have a greater compression ratio (meaning they shrink a bit when compressed),
    whereas others don''t. I personally think that compression is most beneficial
    when you''re moving large files (a megabyte or more).


    # ## Unpacking Archives with the tar Command


    Once you unzip a file, you may find that it has also been archived. Many zipped
    files are archived with a command called tar, which is short for tape archive.
    (tar dates back to the days when UNIX file archives were stored on tape.)


