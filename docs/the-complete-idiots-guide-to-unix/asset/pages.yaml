    To move a file, use the mv command. To do so, you must provide two values: the
    name of the file you''re moving and where you want it to go:


    # A Warning About cp


    Be careful using cp to copy files from one directory to another. Make sure you
    aren''t overwriting another file with the same name. cp doesn''t always warn you
    before it overwrites a file.


    ```

    mv filename destination

    ```


    In this respect, mv works like cp. The destination is a directory. For example,
    suppose I wanted to move tom from my current directory to /usr. I would issue
    the following command:


    ```

