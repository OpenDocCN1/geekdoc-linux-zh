  md: '# # Part 3


    #  Working in the UNIX GUI


    UNIX isn''t all text and command line prompts. In fact, UNIX has it''s own Graphical
    User Interface, the X Window System, or X. X opens UNIX to a whole new world of
    usability and power features, and Part III uncovers the capabilities made possible
    by X.


    Within the chapters of Part III, you''ll learn how to create, destroy, and manipulate
    windows; how to choose a window manager; how to navigate in a mouse-driven world;
    how to customize menus; and how to launch applications in X.


