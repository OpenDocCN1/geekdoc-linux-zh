  md: '# Chapter 5 > Surviving Shell Shock


    # Shell Lingo


    No matter which shell you use, you need to learn shell language and command structure.
    Let''s take a quick look at command structure now.


    ![](img/b0bfb2d724c393178bf462832858a65d_80_0.png)


    You''re Destroying the Environment!


    # Command Structure


    Simple commands generally consist of several components:


    Until you become more familiar with UNIX, be cautious when changing your environment
    variables. Even a small typo can produce perplexing results. For example, if you
    make mistakes setting your PATH variable, the shell will be unable to fumble the
    ball while setting your PROMPT variable, output may look distorted. If you encounter
    that situation (or even worse one), you can quickly recover: log out and log in
    presto! The default environment will return pristine, untouched by your shell
    faux pas. (For information on how to make environment preferences, check Part
    5, "System Administration.\'')


    +   - The basic command

    - Command-line options (or flags)

    - Command-line arguments


    For example, consider this command:


    ```

    1 ls -1 /usr/bin

    ```


    It has three parts:


    +   - 1 is the basic command. This tells the shell that you want a directory listing.

    - 1 is the command-line option or flag. This tells the shell that the directory
    listing should be in long format.

    - Finally, /usr/bin is the argument. This tells the shell that your long format
    directory listing should be performed over the directory /usr/bin.


    With rare exception, you must articulate your commands in this manner. The typical
    format is


    ```

    command -> options -> argument

    ```


    Changing this order can produce bizarre results. Let''s use the command as above
    an example. On my machine, I have a directory named cig. In it, there are three
    files: tom, dick, and harry. To list that directory, I issue the following command:


    ```

    1 ls -1 cig

    ```


    Here''s the output:


    ```

    -rw-r--r-- 1 bwagner 200 23 Jun 28 12:26 dick

    -rw-r--r-- 1 bwagner 200 59 Jun 28 12:29 harry

    -rw-r--r-- 1 bwagner 200 21 Jun 28 12:25 tom

    ```


