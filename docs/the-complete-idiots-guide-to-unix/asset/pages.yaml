  md: '# # Part 7


    # # Reference


    Well, you made it. UNIX, formerly that subject of awe, trepidation, and mystery,
    is now old hat. You can legitimately append the coveted "U.L." to your name: UNIX
    Literatum. And like any good scholar, what you need now are reference materials,
    the stripped-down diamond core of knowledge and a road-map of resource. Boy, are
    you in luck! That''s just what Part VII is all about.


    In the three appendices that follow, you''ll find a command reference detailing
    96 of the most useful UNIX commands, enough to keep you up and running for as
    long as you like. There''s also a compilation of on-line resources where you can
    find free software, UNIX documentation, and places to locate other UNIXphiles.
    Finally, even with all your new knowledge, you''ll probably want to peruse the
    glossary so you can really impress friend and foe alike!


