  md: '# Chapter 13 > Running X and X Applications


    Finding the line break point is usually pretty. Most editors give you some indication
    that a break has occurred. For example, whenever pico wraps a line, it adds a
    $ symbol at the precise point where the wrap started. To remedy line break, position
    your cursor after the $ symbol and hit the backspace button. This will rejoin
    the line and make one, continuous run.


    Different window managers have different configuration files. Often (in fact,
    most of the time), the configuration file ends in rc, as in system. fwmrc, system.tmarc,
    .tmarc, and dwmarc. However, your mileage may vary. Today, there are new and strange
    window managers out there. If you can''t find the configuration file, ask your
    system administrator or consult your manuals.


    Finally, exercise caution creating menu items that execute shell scripts. Prior
    to creating such a menu item, run the shell script from Xterm window and see what
    happens. If you encounter unexpected results (your system halts, your display
    freezes, or your monitor blows up), you should probably abandon the idea of making
    that script menu choice.


    # Changing Your Monitor Choices, Video Card, or Resolution


    Stop right here. Are you considering your monitor, video card, or resolution specifications?
    Don''t even think about it. At least, don''t think about unless you know absolutely
    everything about your monitor and video card. Here''s why: X is an excellent windowing
    system, and it allows you every to customize your system. However, unlike Microsoft
    Windows, X assumes you''re an "X-pert."


    Indeed, X assumes you would never, ever set your monitor frequency to a dangerous
    or impossible value. Similarly, X assumes you would never accidentally specify
    the wrong video card, memory allocation, or color depth. Therefore, X will attempt
    (to the best of its ability) to accommodate your shaky estimations about these
    values. If you make a mistake, this could seriously damage your monitor or video
    card. I''m not kidding!


    Here''s an example from my early experiences with X: I had an old, 15" Mag monitor
    I thought was pretty cool. However, my system didn''t support my video card (an
    ancient Trident) or my monitor. I thought I was slick, though, and decided to
    set values at the high end. (I had absolutely no idea what frequency my monitor
    would support, and because it was used, I had no documentation.) So, I set these
    cock-eyed values and started X.


    The first time X started and then died. I heard a strange click in my machine.
    I figured that something went wrong but decided to try it again. The second time
