  md: '# Appendix A > Command Reference


    # ln


    Purpose: ln makes links between files.


    Example: ln myfile.txt another-file.txt. This creates a link from myfile.txt to
    another-file.txt. Once this link exists, any changes made to one will also be
    committed to the.


    # lp


    Purpose: lp sends files to the printer.


    Example: lp myfile.txt. This sends myfile.txt to the printer. (To learn about
    lp, see Chapter 9.)


    # lpr


    Purpose: lpr sends jobs to the printer. (lpr is the Berkeley equivalent of lp.)


    Example: lpr myfile.txt. This sends myfile.txt to the printer. (To learn about
    lpr, see Chapter 9.)


    # lprm


    Purpose: lprm removes jobs from the printer queue.


    Example: lprm 23. This remove job 23 from the printer job list. (To learn about
    lprm, see Chapter 9.)


    # lpstat


    Purpose: lpstat reports the status of pending print jobs.


    Example: lpstat. (To learn more about lpstat, see Chapter 9.)


