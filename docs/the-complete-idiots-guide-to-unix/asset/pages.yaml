    ![](img/b0bfb2d724c393178bf462832858a65d_36_0.png)


    # A Window to the Past


    Strange but true: All the windowing systems ever created, Microsoft Windows is
    the most popular. However, Microsoft didn''t invent windowing systems and neither
    did Apple. Xerox did in 1972, researchers at Xerox''s famed PARC Laboratory created
    the Xerox Alto. It was the first to use a GUI/mouse combination. Both Microsoft
    and Apple built their windowing systems on Xerox''s research, Apple waited 10
    years before warming up the idea.(In fact, nearly all windowing systems—UNIX’s
    are descendants of Xerox''s system).


    Well, then that was and is now. Today, UNIX runs on a wide variety of inexpensive
    chips, including the Intel (x86), Alpha, PowerPC, FIPS, MIPS, and RISC. Furthermore,
    the expense of software licensing is no longer an issue. Many distributions are
    either free or almost free, allowing the mainline public to enjoy workstation
    performance at a fraction of the price.


    # General System Requirements


    System requirements for UNIX vary. If you run UNIX in CLI only, you need meager
    resources. (Technically, you can get along with a 25MHz processor, 2MB of RAM,
    and a 60MB hard disk.) However, if you intend to use a UNIX GUI, (and avoid pulling
    your hair), I recommend a 100MHz processor, 32MB of RAM, and a 500MB disk or better.'
