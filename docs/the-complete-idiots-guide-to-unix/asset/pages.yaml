  md: '# FTP Interactive Commands


    While using FTP, you have access to a wide range of commands. You can use these
    commands to manage your session, move files, create directories, and many others
    tasks. Table 21.1 summarizes the FTP commands you''re most likely to use.


    # Table 21.1 Selected FTP commands


    | FTP Command | Result |

    | --- | --- |

    | ! | Use the ! command to temporarily return to the shell on your local machine.
    (You''ll use this command a lot when transferring files to remote servers. For
    example, you may start ftp and then forget the exact name of the file you wanted
    to transfer. To find out, use the ! command to exit the shell and pull a ls directory
    listing.) |

    | ? command | The remote server will display a brief description for the command
    you''ve specified. For example, to get help on the command send, issue the command
    ?. |

    | ? | The remote server will display all commands currently available to you.
    |

    | close | Use the close command to end your ftp session. (This command is synonymous
    with the exit by commands. It causes your machine to disconnect from the remote
    server.) |

    | delete file | Use the delete command to delete a remote file. (This will only
    work if you have the necessary privileges to do so. Only privileged users can
    delete files on remote servers.) |

    | help command | The remote server will display a brief description for the command
    you specified. (This is equivalent to the ? command.) |

    | mkdir directory | Use the mkdir command to create a directory on the remote
    server. |

    | rename file | Use the rename command to rename a file on the remote server.
    |

    | status | Use the status command to view the current session''s environment parameters.
    For example, a status report will tell you all about your current transfer mode,
    whether interactive prompting is on, and so forth. |


    # FTP’ing in the Large


    Command-line FTP is a quick and painless way to move files across the Internet.
    However, if you''re moving many files located in many different directories, command-line
    FTP can be cumbersome. For such labor-intensive file transfers, you''ll'
