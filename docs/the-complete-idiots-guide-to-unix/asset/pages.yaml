    # The Deadly Asterisk


    The commands discussed in this chapter perform pretty basic tasks. And, if you
    use those commands on one file at a time, your work will go very slowly. You could
    say, therefore, that until this point in the chapter, you were in the UNIX Stone
    Age.


    To take out of the Stone Age, I give you fire. Here is it:


    It doesn''t look like much; it''s just an asterisk. However, in UNIX, the asterisk
    is an extremely powerful tool. It allows you to work strong magic. Here''s why:
    the asterisk symbol is a wildcard.


    The asterisk is used as a substitute for generic values. For example, when you
    issue this command:


    ```

    cat *

    ```


    you are telling UNIX this: "Display the contents of all files in this directory."
    Or, when you issue this command:


    ```

    file *

    ```


    you are telling UNIX this: "Show me the file types of all files in this directory."
    Or even worse—which is why you should use the asterisk sparsely—if you issue this
    command:


    ```

    rm *

    ```


    you are telling UNIX this: "Delete all files in this directory." For this reason,
    extremely careful when using the asterisk. It can have very sweeping consequences!


    The next section demonstrates what will happen when you use an asterisk in combination
    with the commands previously discussed.


