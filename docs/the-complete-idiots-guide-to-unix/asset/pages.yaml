  md: '# # The Jargon File''s Co Guide to UNIX


    | To | You |

    |---|---|

    | Copy a file | Type cp filename1 filename2 |

    | Delete a file | Type rm filename |

    | Identify a file''s data type | Type file filename |

    | List a file''s statistics | Type ls -l filename |

    | Move a file | Type mv filename1 filename2 |

    | View a file | Type cat filename1 more |


    | To | You |

    |---|---|

    | Change to a directory | Type cd directory |

    | Create a directory | Type mkdir directory |

    | Delete a directory | Type rmdir directory |

    | List directory''s contents | Type ls -l directory |

    | Move a directory | Type mvdir directory |

    | Print the working directory | Type pwd |


    | To | You |

    |---|---|

    | Get a manual page | Type man command |

    | Get GNU Info pages | Type info command |

    | Get manual pages in X | Open an xterm and type xman or man command |

    | Get quick help | Type command --help |

    | Search for manual entries | Type man -k command |


    | To | You |

    |---|---|

    | Find commands or binaries | Type딨 command |

    | Find files | Type find . -name "pattern" |

    | Find patterns in text files | Type grep pattern file |

    | Find strings in text files | Type grep string file |

    | Find text in binary files | Type strings text file |


    ![](img/b0bfb2d724c393178bf462832858a65d_2_0.png)'
  merge: -1
  pgno: 2
- img_proc: true
  md: '# Printing


    | To | You |

    |---|---|

    | Cancel a print request | Type cancel print-job-number |

    | Get print service status | Type lpstat |

    | Paginate and print | Type pr file |

    | Send a file to the printer | Type lp file |


    # Text Manipulation


    | To | You |

    |---|---|

    | Count lines and words | Type wc filename |

    | Cut columns from a file | Type cut -d delimiter -f list |

    | Edit a file with ex | Type ex filename |

    | Edit a file with Pico | Type pico filename |

    | Edit a file with vi | Type vi filename |

    | Find unique lines in a file | Type uniq filename |

    | Merge files and fields | Type join file1 file2 field1 field2 |

    | Sort a file''s contents | Type sort filename |

    | Spell check a file | Type spell filename |


    # Archiving


    | To | You |

    |---|---|

    | Compress a file | Type compress -fv file |

    | Create an archive | Type tar cvf filelist > tarfile |

    | List compress-file contents | Type zcat filename |

    | Uncompress a file | Type uncompress file |


    # Shell Metacharacter Reference


    | Purpose | sh | csh |

    |---|---|---||

    | Command separator | ; | | |

    | Execute in background | & | & |

    | Filename metacharacters | *?-+-[]!@ | *?-[] |

    | Group commands | () | () |

    | Pipe | | | | |

    | Quoting characters | " '' | " '' |

    | Variable substitution | $ | $ |'
