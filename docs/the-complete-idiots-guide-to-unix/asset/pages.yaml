    Window managers govern every aspect of X''s appearance, including menus, windows,
    borders, mouse cursors, and so forth. Like many issues in the UNIX community,
    window managers have attained cult status. (When conversing with other UNIX users
    about their window manager, watch your step! These folks are serious about computing,
    and even more serious about window managers. UNIX folks often debate the issue
    of which window manager is the best.)


    Let''s take a look at several now.


    # twm


    By far, the most generic window manager is twm (or Tab Window Manager). Rumor
    has it that the term originated with its creator, Tom Lavergne. Therefore, some
