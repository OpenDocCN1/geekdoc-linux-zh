  md: '# Chapter 6 > Manipulating Files and Directories


    # Master of the Universe


    Listing files and discovering their file type is just fine. But maybe you''re
    ready for a more interactive experience. In UNIX, you are the master of your universe.
    Not only can you list files, but you can also create them, copy them, delete them,
    display them, and do just about anything you can imagine. In this next section,
    you''ll learn to do that and more.


    # Deleting Files: the rm Command


    **Warning:** the rm command is very dangerous. Make sure that you completely familiarize
    yourself with rm before using it. Otherwise, you may accidentally delete important
    system files!


    To delete a file, use the rm command, like this:


    ```

    rm filename

    ```


    For example, in my /home/bwagner directory, I have the files tom, dick, and harry.
    Suppose I decide that I don''t like harry anymore (his racquetball game stinks).
    I can delete harry by typing like this:


    ```

    rm harry

    ```


    # rm Command-Line Switches


    The rm command has several command-line switches. These are summarized in Table
    6.2.


    # Table 6.2. Selected rm Command Line Switches


    | rm Command | Result |

    |---|---|

    | rm filename | rm removes the specified file. |

    | rm -i filenames | rm prompts you before removing each file. (This is called
    interactive mode. Until you get more familiar with UNIX, you might want to use
    this option. It can prevent you from accidentally deleting files that you need.)
    |

    | rm -r | rm removes directory contents recursively. This is where both subdirectories
    and files are removed from the current directory. Using the -r switch can be dangerous,
    so use it wisely. (This operation is much like using DELTREE in MSDOS.) |


    75'
