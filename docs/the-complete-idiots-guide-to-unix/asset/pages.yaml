  md: 'A programming model in which a single server can distribute data to many clients.
    (For example, the relationship between a Web server and Web clients or browsers.)
    Most network applications and protocols are based on the client/server model.


    Common Desktop Environment (CDE) A windowed desktop environment often included
    in modern UNIX distributions. CDE was designed to standardize desktop environments
    on diverse UNIX flavors. (Up until recently, there was a lack of standardization
    in this area. Therefore, the X Window System desktop looked and worked differently
    on AIX than it did on Solaris. CDE was a collaborative effort among various UNIX
    vendors to create this.


    compress A UNIX utility that compresses files.


    core dump This is a file left behind by a program that failed. Core dumps are
    used to debug the problem.


    cp A UNIX command used to copy files. You can use cp to copy files to the working
    directory (cp myfile.backup) or to another directory (cp myfile /home/bagner/myfile.backup).


    cracker Someone who, with ill-intent, unlawfully breaches security system (or
    some-one writes programs that circumvent copyright restrictions on commercial
    soft-ware)


    date A UNIX program that prints the current date and time. (date has many command-line
    options to manipulate data output. Check the date man page for details.)


    df A UNIX program that reports the number of free blocks on the specified file
    system.


    diff A UNIX program that compares two text files and reports the differences between
    them.


    directory An area on your hard disk drive where files are stored.


    dot files Files that have a period as the first letter of their name. These usually
    hold configuration or preferences information. (Also see hidden files.)


    du A UNIX program that reports disk usage by directory.


    dumb terminal Usually a text-mode terminal used to connect to UNIX servers or
    mainframes. Dumb terminals have no disk drives or mice—they consist only of a
    terminal and a keyboard.


    echo A UNIX program that prints specified text to the terminal screen. For example,
    to have UNIX display the "The program is finished," you can use echo, like this:
    echo "The program is finished".


    emacs An extremely powerful and versatile text editor for UNIX. Linux systems
    generally come with emacs preinstalled.'
