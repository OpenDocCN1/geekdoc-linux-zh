    # Chapter 19


    # # USENET News


    +   ## In This Chapter

    * What is USENET?

    * Learning how to read USENET news

    * A few good newsreaders

    * Some words of caution


    # ## What Is USENET?


    USENET stands for user network. To illustrate what USENET is and what it does,
    I need to reach back a few years. The story goes like this: In 1979, two universities
    in North Carolina tried an interesting experiment. They created a system vaguely
    similar to email, except that messages would be publicly available. In this respect,
    the system was a lot like a bulletin board. One person could post a message and
    many others would see it.


    Eventually, additional functionality was incorporated into the system. Not only
    could others see the original post, they could also reply to it (and, in turn,
    others could reply to those replies). Thus, full-scale discussions developed.
    It was wonderful and all was well.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Part 4 > UNIX''s Net Worth


    However, almost immediately after this new system was instituted, some controversy
    arose. You see, at the time, folks were only allowed to discuss serious and academic
    subjects. The gods of the USEN system frowned upon frivolous discussions. This,
    of course, prompted a revolution.


    To remedy this, USENET was restructured. (This period is actually known as the
    Great Renaming.) Forever after, USENET has been broken into groups. For example,
    a group named comp was created for discussion about computers. Again, everything
    was wonderful—computer users could have discussions, and all was well. (At least
    for a while.)


    Eventually, even when that wasn''t enough. No sooner had the comp group grew,
    folks began to argue again. UNIX users didn''t want to fraternize with Mac users
    who, in turn, hated Windows users. Therefore, the comp group was dissected into
    even more refined groups. If you wanted to discuss UNIX, you had to go to the
    group


    This process of refining continued (and still continues today). In fact, you get
    some experience with USENET, you won''t be all surprised to find groups with names
    such as this:


    ```

    comp.UNIX.security.blue-cadillac.eye-patch.hack

    ```


    This, course, would be a group where UNIX security is discussed by administrators
    who drive blue Cadacs, wear eye patches, and smoke three packs of cigarettes a
    day. (Things aren''t quite bad yet, but they''re getting there.)


    This refined naming scheme is called the USENET hierarchy. The USENET hierarchy
    currently holds 30,000+ groups. In these groups, folks discuss everything from
    gardening to ham radio. In this respect, USENET is a wonderful place to find people
    with interests similar to your own.


    To read USENET news (the messages posted to USENET), you need a newsreader. That''s
    what this chapter is all about using newsreaders.


    # tin: A Newsreader


    tin is a very popular text-only newsreader''s available on most UNIX systems.
    To start tin, enter the tin command plus the newsgroup you want to read (or at
    least a ballpark category, as comp, for example):


    ```

    tin comp

    ```


    tin will load and immediately ask you if you also want to read messages from some
    pretty lame groups (groups as news.announce.newusers). Enter n (for no).


    At this point, tin will retrieve all groups under the hierarchy you specified
    and their messages. tin will then display these groups in a scrollable list. (See
    the following figure.)


    252'
