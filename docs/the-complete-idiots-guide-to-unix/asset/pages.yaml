- img_proc: true
  md: 'However, startx is not the only command for starting X. There are many others,
    including xstart, x11, and so on. At their core, these commands are really just
    scripts that start a program called xinit. Let''s take a look at xinit now.


    # xinit: The X Starter


    xinit is the X initializer. xinit starts the X server and one client on your machine.
    By default, xinit starts with the following parameters:


    ```

    xterm -geometry +1+1 -n login -display :0

    ```


    This places a single Xterm window on the main desktop. (See the following figure).


    When X first starts, it generally spawns one Xterm window.


    ![](img/b0bfb2d724c393178bf462832858a65d_191_0.png)


    Prior to starting X, however, xinit looks in your home directory for a file named
    .xinitrc. This file (which is often created by your system administrator) contains
    additional parameters, including any programs to spawn when X starts. .xinitrc
    typically contains entries like this:


    ```

    xsetroot -solid steelblue &

    oclock -geometry 75x75-0-0 &

    xterm -geometry +0+60 -ls &

    ```


    168'
