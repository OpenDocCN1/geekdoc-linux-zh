  md: '# Chapter 13 > Running X and X Applications


    +   > Problems with clip and paste—Sometimes (though rarely), clipping and pasting
    won''t work from one application to another. This isn''t a generalized problem,
    but it occurs between applications that handle the Paste to Clipboard function
    differently. If you encounter this problem, open a third application and try using
    it as a station. Then is, clip the text from application 1 and paste it to application
    2 (your work station). You''re sure that your paste worked, copy the text from
    application 2 and paste it to application 3. If you''re just pasting a few lines
    of code, this is probably too complicated. However, this is a good solution if
    you''re pasting many dozens of pages of text.


    +   > Strange happenings—On rare occasions, one application may cause trouble
    for another. For example, suppose you have two applications running simultaneously.
    One enforce special rules on the mouse cursor. This one may “ruin” the mouse functionality
    in the second application. (The mouse may become sluggish, uncontrollable, or
    inoperable in the second application.) The cure is to kill both applications and
    restart X. (This situation is more common on Linux, where many distributions crop
    up.)


    # The Least You Need to Know


    Learning to make X behave way you want it to is a big step toward taking care
    of your work environment. To do that, here''s the least you need to know:


    +   > X reads .xinitrc file before loading. Any programs specified there will
    load when X loads.


    +   > You can run applications inside Xterms. For example, open an Xterm and issue
    the vi command. This will run vi inside the Xterm.


    +   > You can launch applications from Xterms. To do so, try this: Open an Xterm
    and it, issue the following command: xeyes &. This will run xeyes on your desktop.


    +   > You can customize your own menus to execute applications.


    +   > Never try to change your monitor frequency or video card specification without
    documentation.'
