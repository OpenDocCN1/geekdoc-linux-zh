  md: '# The Great Divide


    When engineers at Bell Labs first created UNIX, they had no idea it would become
    so popular. Hence, AT&T released UNIX (with source code) to the academic community
    free of charge.


    However, in 1978 (or somewhere thereabouts), AT&T took a different view, UNIX
    was quite popular by them and was worked into computer science curriculums around
    the country. It was therefore a commercially viable product, and AT&T could see
    no good reason not to charge for it.


    Well, the folks at the University of California at Berkeley had different plans.
    First, they felt that AT&T''s UNIX simply wasn''t user friendly. Second, this
    business of paying licensing fees to AT&T was for the birds. Based on these factors,
    Berkeley students undertook an ambitious project. They decided to rewrite their
    own UNIX, and that''s exactly what they did. (Those Berkeley folks were always
    just a little bit radical.)


    Armed with the original AT&T source code, programmers at Berkeley rewrote UNIX
    from the ground up, replacing more than 90 percent of the original code with their
    own. They dubbed this new Berkeley Software Distribution (BSD).


    From that point on, UNIX was a two-system world. Either you used AT&T or BSD.
    Or, more accurately, after years of both systems being developed, either you used
    Sys V (AT&T) or BSD.


    # Differences Between Sys V and BSD


    What are the major differences between Sys V and BSD? Actually, a better question
    is this: Do you really need to know what these differences are? Not really, but
    for sake of completeness, I''ll briefly describe the differences here.


    The chief differences are these:


    +   - They use different booting systems.


    +   - Accounting is done a bit differently.


    +   - The printing systems vary (as do the ports to which printing requests are
    rout-ed).


    +   - In some cases, the file structures vary slightly.


    Also, commands that do essentially the same thing in Sys V as in BSD may have
    different names (but that''s really a minor difference). In all other respects,
    however, unless you start programming, these UNIX versions work in the much the
    same way. In this book, wherever a task can be done with two commands, I describe
    both. In other words, this book will prepare you equally for Sys V and BSD systems.'
