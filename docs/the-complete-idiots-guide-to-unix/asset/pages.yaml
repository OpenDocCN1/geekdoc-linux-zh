    Many different kinds of expressions exist; I learned that early on. When I was
    ten so, my grandfather took me to his golf club where we met a business associate
    of his named Ralph. Ralph claimed that he''d recently shot a game in the low 60s.
    (I wasn''t sure, but I thought this was probably pretty good). Later, when we
    were alone, my grandfather told me that Ralph was "full of malarkey." Not wanting
    to admit that I didn''t know what this meant, I simply nodded sternly in agreement.


    A week or so by and I had the occasion to use that phrase. My mother had thrown
    a dinner party and someone there was speaking about Ralph. When asked if I knew
    Ralph, I replied that yes, I knew him, but it didn''t matter, because he was full
    of malarkey. This didn''t go over well at all. In fact, my mother told me that
    this was an expression only (from one of the century) and that I should never
    use it again. (She then went after my grandfather, the obvious culprit).


    So, one kind of regular expression is a figure of speech. There are others. As
    humans, we generally equate the term expression with speech, emotion, or artistic
    exposition. Alas, UNIX knows little about these things.'
