    \n# Terminal III\n\nIf you use telnet to access a remote server and find that\
    \ your screen displays text in odd positions, the problem could be the terminal\
    \ emulation. What's terminal emulation? Well, over the years, terminal manufacturers\
    \ have created a wide range of terminals for accessing mainframes and UNIX systems.\
    \ Unfortunately, manufacturers often develop their own specifications for how\
    \ text is displayed. Therefore, some terminals display more columns and rows than\
    \ others do.\n\nOccasionally, you'll encounter remote systems that use a different\
