  md: '# What About Commercial Applications?


    Many software vendors develop versions of their commercial applications for UNIX.
    Thus, many applications common to Windows and Mac OS are also available for UNIX,
    including the following:


    +   * Adobe Photoshop

    * Microsoft Word

    * WordPerfect

    * CorelDraw

    * Microsoft Internet Explorer

    * Netscape Navigator and Communicator


    Furthermore, the Java programming language, (a new innovation from Sun Microsystems),
    is helping to quell the operating system gap. Developers are now writing applications
    in Java that run on all platforms. (This might help to the operating system wars
    currently raging on the net. At present, users bitterly debate which operating
    system is the best.)


    # So, What’s the UNIX Bottom Line?


    The UNIX bottom line can be reduced to this: About two weeks before I started
    writing this book, I was at a stoplight. The car in front of me had a personalized
    license plate and this is what it said: UNIX:XROX.


    That says it all.


    # The Least You Need to Know


    The very least you need to know is this:


    +   * UNIX is powerful, fast, and great for networking.

    * UNIX is now more user-friendly.

    * You can easily learn UNIX.

    * This book will help you learn UNIX quickly and painfully.


    That said, let''s quickly examine several UNIX distributions and the differences
    between them.'
