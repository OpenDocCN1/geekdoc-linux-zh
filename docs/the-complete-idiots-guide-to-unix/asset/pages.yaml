  md: '# Part 2 Nuts and Bolts


    ![](img/b0bfb2d724c393178bf462832858a65d_161_0.png)


    Some developers erroneously assume that you have all the necessary include and
    library files to compile their applications. If you don''t actually have these
    files, the compile is bound to fail. You''ll know instantly, because the compiler
    will exit and give an error saying it cannot find a particular file.


    # Assorted Facts about Libraries


    If this happens, jot down the name of the file the compiler cannot find. Then,
    take a closer look at the documentation accompanying the software. If you can''t
    find any reference to the missing file, try searching for the file on the Internet.
    When you find the file, it will be accompanied by a description of its function.
    (For example, perhaps it''s a graphics library).


    You''re probably wondering what these libraries are all about. Let me remind you
    that Libraries are prefabricated modules or snippets of code that, when woven
    into a program, influence the way that program operates or behaves. For example,
    graphics libraries greatly influence the look of windows. Some graphics libraries
    create windows that resemble the windows in Windows 95. Other create windows that
    look like those found in Mac OS. Additionally, graphics libraries aren''t the
    only kind of libraries available. Others influence how math, graphing, charting,
    typesetting communication is done. Finally, some libraries are commercial (and
    therefore expensive), whereas others are free. What does this all mean to you?
    When you compile a program, you must have the required libraries. If you don''t,
    the program might not work properly. Unfortunately, even if you have C, you might
    be lacking the necessary libraries for certain applications (and, conversely,
    it''s quite possible to have the libraries but no C).


    All in all, you''ll probably encounter this situation rarely.


    # The Least You Need to Know


    The range of software available for UNIX on the web is amazing. To take advantage
    of that treasure trove, here''s what you need to know:


    +   - Software distributions can come in two forms: binary and source. Whenever
    possible, try to find the binary version.


    +   - Most files available for download are zipped. To unzip them, use uncompress
    (uncompress filename.gz) or gunzip (gunzip filename.gz).


    +   - Most zipped files are also listed. After you unzip the file, until it this:
    tar xvf filename.tar.


    +   - After unzipping and starting a software distribution, always check the README
    or INSTALL file. It will contain instructions on how to install the program.


    +   - distributions require a C compiler. To check whether you have one, try the
    following commands: cc, gcc, whereas cc.


    +   - To compile a source distribution, follow the instructions in the README
    and INSTALL file.


    # 138'
