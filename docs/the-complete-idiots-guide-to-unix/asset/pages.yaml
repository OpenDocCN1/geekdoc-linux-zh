  md: '# Chapter 21


    ![](img/b0bfb2d724c393178bf462832858a65d_302_0.png)


    # Other Network Services


    +   ## In This Chapter

    - Learn how to transfer files

    - Learn about remote terminal sessions


    The last few chapters focused on human communication over the Internet (including
    email, USENET, and so forth). These tools are great for socializing or even conducting
    brief business communication. However, many other UNIX services exist that can
    help you perform remote administration tasks and simple file transfers. That''s
    what this chapter is all about.


    # Say It with Files: File Transfer Protocol


    Using the File Transfer Protocol (FTP) is the chief way to move files from one
    host to another. (Other methods exist, but none are as fast or easy.) With FTP,
    three steps are involved in transferring a file:


    +   - Connecting to the remote machine

    - Logging in

    - Transferring the file


    Let''s run through each step now.'
