  md: '# Chapter 11 > Tyrannosaurus X: A Windowing System


    # The Last Word on Window Managers


    Over two dozen other window managers are available for UNIX. Some are free and
    some are commercial. Table 11.1 provides a little background on some of the more
    popular ones.


    | Window Manager | Description |

    | --- | --- |

    | AfterStep | AfterStep (formerly the Bowman Window Manager) is a NeXTStep emulator
    (NEXTStep is the windowing system for NeXT computers). This is probably one of
    the most stylish window managers. AfterStep is available at http://www.afterstep.org/
    |

    | amiwm | amiwm (Amiga Window Manager) emulates the look and feel of the Amiga
    Workbench. amiwm can be obtained at http://www.lysator.iu/-marcus/amiwm.html.
    |

    | gwm | gwm (Generic Window Manager) is a bare-bones window manager suitable for
    systems with limited resources. (This window manager doesn''t have much fluff,
    by default, but it can be made to emulate many other window managers.) gwm is
    available at http://www.inria.fr/kola/gwm/ |

    | KDE | The K Desktop Environment is a commercial window manager that resembles
    a cross between the Common Desktop Environment (CDE) and Microsoft Windows 95.
    In fact, many of the management applets in KDE closely resemble those in Windows
    95, including the Display Properties tab window. KDE is available at http://www.kde.org/
    |


    # Where X Is Going


    For years, X''s development went unnoticed by all but serious UNIX users. Certainly,
    no one ever expected X to compete with more consumer-oriented windowing systems
    such as Microsoft Windows or Mac OS. However, today, that climate has changed.


    Today, everything is about networking, and especially networking over the Internet.
    Finally, the long, hard-earned research by X developers is paying off big time.
    X is now experiencing a renaissance, because companies large and small are finding
    it a superb choice for running embedded applications over high-speed Internet
    links.'
