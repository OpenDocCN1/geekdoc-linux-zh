    However, most often, you''ll be booting from the hard disk drive. This procedure
    differs slightly from machine to machine. Table 3.1 provides some notes on booting
    UNIX.


    # Table 3.1. Booting UNIX on workstations, PCs, and X terminals


    | Machine | Notes |

    | --- | --- |

    | Workstation | Most workstations UNIX automatically. Turn on the machine and
    wait for a login prompt. In some cases, this should do the trick. Exceptions occasionally
    arise, however, if the machine has multiple disks. If that happens, you''ll know
    it. For example, Sun SPARCStations will stop at a prompt. In this case, you must
    boot the system manually. If that fails, enter the command n and type probe-scsi.
    This will identify available SCSI disks by number (disk 1, 2, 3, and so on). Once
    you have this information, boot the system by explicitly specifying the target
    disk. Here are commands for booting from different disks and devices:

    - ROM: b(0,6,2), boot(0,6,2), or boot cdrom

    - Floppy: b floppy, boot floppy, b fd, or boot fd

    - Tape: b st, b st(), or boot tape

    - Ethernet: b le, boot le, b ie, or boot ie

    - IPI disk: b id or boot id |

    | PC | PC-compatible UNIX distributions automatically boot to a login prompt.
    However, there are exceptions. Some versions of Linux will pause at a boot prompt.
    The purpose of this pause period is to allow you time to enter special boot parameters.
    For example, you could specify that the system should boot from a partition other
    than the default. Similarly, you can call special drivers for odd hardware that
    may not match during a normal boot.) To boot from this prompt, hit Enter or simply
    wait. Within 60 seconds, the system will boot.|


