- img_proc: true
  md: '# Part 5 System Administration


    You can use the octal scheme to perform widespread permission changes. For example,
    consider this command:


    ```

    chmod 751 filename

    ```


    In this case, filename has the following permissions:


    +   - The owner can read, write, and execute it.

    - The group can read and execute it.

    - The world (outiders) can only execute it.


    You should be careful when applying permissions. You can accidentally place permissions
    that are restrictive and then no one will be able to access anything. Conversely,
    if your permissions are too liberal, folks can overwrite and access files that
    they shouldn''t.


    # Adding and Removing Users


    Part of your job as system administrator is to add and remove users. For a first-time
    system administrator, these can be hazardous undertakings, but they needn''t be
    you. You have several ways available to you to accomplish these tasks, depending
    on your configuration:


    +   - Using proprietary, graphical tools—Many modern UNIX systems (including Solaris,
    AIX, HP-UX, and UNIXWare) have graphical tools for adding and removing users.

    - Using command-line tools or scripts—Some systems (such as Linux) have automated
    scripts or command-line programs to add and remove users.

    - Editing the passwd file manually—On many older systems, you have to edit the
    passwd file manually and create the /home directory for each user.


    Consult your system manuals to determine which option is available to you. Because
    I cannot guess your specific configuration, I''ll simply offer an explanation
    of generic procedures.


    # /etc/passwd: The Password File


    User login and password information is stored in a central database called passwd,
    which is located in the directory /etc. On older systems, the /etc/passwd file
    looks something like this:


    ```

    root:uXon7RToQwS8:0:0:root:/bin/bash

    bin::1:1:bin:/bin/

    daemon:*:2:2:daemon:/sbin:

    ```


