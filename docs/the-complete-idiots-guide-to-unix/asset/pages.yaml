- img_proc: true
  md: '# Table 10.2. Selected tar command-line switches CONTINUED


    | Switch | Result |

    | m | tar to ignore the original creation dates of the files and instead update
    them to the current time. |

    | o | tar to change the ownership of the extracted files to the UID of the current
    user. (This is the opposite of the p switch). |

    | p | tar to preserve original permissions on all files in the archive. |

    | q | tar to quit after the archive has been unpacked. |

    | v | tar to generate verbose output. This way, when "untar" a package, tar prints
    all the directories to which the archive has been unpacked. (Generally, you should
    redirect this information to an output file in case you later need to find isolated
    files from the archive). |

    | w | tar to request confirmation for its actions. It is useful when you think
    that you might overwrite data when creating a tar archive. |


    # Creating a tar Archive


    So, you''ve decided to distribute your files to the world—tar can help with this
    task, as well. For example, suppose you want to create a tar archive of the directory
    /home/bwagner/companies. You would issue the following command:


    ```

    tar cvf Companies.tar /home/bwagner/companies

    ```


    From another angle, you could archive your entire directory structure by issuing
    this from the root directory:


    ```

    tar cvf - -print my_system.tar

    ```


    In this example, find generates a massive list of all files and directories, and
    is used in making the tar archive my_system.tar.


    # Installing Your New Program


    Let''s recap a bit. You were surfing the Net when suddenly you found an interesting
    UNIX program. After checking whether it will run on your UNIX flavor, you downloaded
    it. You found that it was zipped up, so you unzipped it. Then, you found that
    it was "tarred" so you "untarred". During this last step, the files were extracted
    to some directory or other. Now the question is, what do you do next?'
