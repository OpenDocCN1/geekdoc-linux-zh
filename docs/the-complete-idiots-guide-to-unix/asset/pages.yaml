    Right after you display those characters, your terminal may blow up. (Just kidding.
    on some UNIX systems, if you display crazy characters, your terminal may never
    recover. Even if you later type regular text, it may still appear scrambled and
    unreadable. The cure for this is to reboot.)


    You''re probably wondering why this occurs occurs There''s a perfectly reasonable
    explanation. Terminals weren''t made to display certain characters. When you try
    to print binary file to the terminal, character translation malfunctions. Since
    the terminal cannot recognize the contents of files, it tries to make some matches.


    So, before examining the contents of files, you should know what they contain.
    UNIX has a command made specifically to identify file types. Appropriately enough,
    it''s called file.


    To identify a file''s type, use the file command:


    ```

    file filename

    ```


    UNIX will respond with a description of the file''s type. For example, suppose
    I want to find out what type of file tom is. I would issue the following command:


    ```

    file tom

    ```


    UNIX responds like this:


    ```

    tom:

    ascii text

    ```


    From this, I know that tom is a plain text file (and I can therefore examine tom-
    without fear of blowing up my terminal).


    What''s cool about file though, is this: You can use it to identify almost anything.
    For example, if I ask UNIX about /home/bwagner:


    ```

    file /home/bwagner

    ```


    UNIX responds like this:


    ```

    /home/bwagner:\irectory

    ```


    This tells me that /home/bwagner is a directory. Similarly, if you use file to
    identify a system binary (like /bin/csh), UNIX responds like this:


    ```

    /bin/csh: ELF 32-bit MSB executable SPARC Version 1, dynamically linked, stripped

    ```


    This tells you that /bin/csh is an executable file.


    file has many practical uses, which we will examine later.'
