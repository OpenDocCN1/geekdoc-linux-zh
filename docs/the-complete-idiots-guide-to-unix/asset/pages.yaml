    # About Menus and Customization


    If you''re brave, you can also try customizing your menus. After all, menus are
    nothing more than visual tools that provide a shortcut to this or that command.
    (They save you the trouble of opening an Xterm and launching an application.)
    If you''re going to run an application regularly, you may as well make it a permanent
    option on your menu.


    Nearly all X window managers allow you to customize your menus. However, this
    is no task for the faint-hearted. With the exception of the Common Desktop Environment
    (CDE), most X window managers provide no special tools for customizing menus.
    Instead, you''re forced to customize your menus by hand.'
