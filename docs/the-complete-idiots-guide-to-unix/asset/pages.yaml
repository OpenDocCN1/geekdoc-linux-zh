    # Conclusion on File Transfer


    The File Transfer Protocol can be used in several ways. Certainly, if you''re
    transferring just one file, it''s silly to load X. Therefore, for quick, simple
    transfers, command-line FTP is fine. On the other hand, if you need to transfer
    many files, you should probably use a graphical FTP tool.


    However, what if you don''t need to transfer files? Instead, suppose you want
    to execute some commands on a remote host. For this, you need telnet, login, or
    rsh.


    # telnet: A Remote Login Program


    If you do Web design, system administration, or networking with UNIX, sooner or
    later you will end up using telnet, a remote networking tool. Through telnet,
    you can work on a machine in Tokyo as though that machine was located in your
    home or office.


    telnet is used not only to provide remote access to shell accounts but also to
    provide interactive gateways to online databases. Electronic library catalogs
    provide a good example. Using telnet, you can search library catalogs all over
    the world.


    To start a telnet session, issue the telnet command plus the address of the desired
    remote host. (See the following figure.)


    ![](img/b0bfb2d724c393178bf462832858a65d_315_0.png)


    telnet will notify you when the connection has been made. At that time, the remote
    server will ask you to log in. (See the following figure.)'
