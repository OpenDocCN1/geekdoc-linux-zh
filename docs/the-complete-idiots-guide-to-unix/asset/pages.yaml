  md: '# Chapter 14 > Cool Programs for X


    # StarOffice Integration


    One major feature in StarOffice is integration between applications. StarOffice
    applications can share data, and data elements retain their structure when clipped
    and pasted from one suite application to the next. (For example, images from StarDraw
    and spreadsheets from StarCalc can be dropped into a StarWriter document and integrated
    seamlessly.)


    # StarOffice Functionality


    StarOffice relies heavily on objectbars (called toolbars in Microsoft products).
    These are icon bars from which you can call most functions. These functions might
    include inserting tables, drawing graphs, spell-checking, clipping, pasting, and
    so forth.


    If you''ve ever used a Microsoft Windows or Mac OS application, you''ll be right
    at home with StarOffice.


    ![](img/b0bfb2d724c393178bf462832858a65d_218_0.png)


    > Bridging the UNIX/Windows Gap

    One useful function in StarOffice is that you can import or export files created
    in many Microsoft Office applications. (For example, StarWriter will export your
    work to a Microsoft Word-compatible file.) This is a tremendous help in heterogeneous
    office network environments. StarOffice''s export feature perfect? No, but it''s
    pretty close. Nonetheless, I should warn you that your mileage may vary. Sometimes,
    bringing templates across is difficult.


    # Summary of StarOffice


    StarOffice is a very comprehensive office suite. Interestingly enough, the product
    is also available for Windows, Mac OS, and OS/2. StarOffice, manufactured by Star
    Division, is currently in release 4.x and is available at http://www.stardision.com/.


    # About X Applications in General


    As I write at the beginning of this chapter, there are hundreds of free X applications
    (most are located either at http://sunsite.unc.edu or http://ftp.x.org). However,
    not every X developer has time to compile binaries for different platforms. Therefore,
    you may find that many X applications are distributed in source form only.


