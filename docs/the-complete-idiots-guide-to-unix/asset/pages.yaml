  md: '# Table 20.1. Some important IRC commands Continued


    | IRC Command | Purpose |

    |--- | --- |

    | /nick [nickname] | Use the /nick to set or change your nickname. (IRC allows
    you to use an alias or nickname. This is roughly equivalent to AOL''s screen name
