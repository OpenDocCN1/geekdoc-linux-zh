  md: '# Chapter 16 > UNIX and the Internet


    As explained in Chapter 1, MULTICS wasn''t it. In fact, MULTICS wasn''t even close

    to what they needed. So the search was on for something more appropriate. They

    found that something in UNIX.


    # The Ultimate Network Operating System


    From that day on, UNIX''s development has been almost exclusively focused on net-

    working. Over the years, UNIX developers found ways to network almost any-

    ing. In fact, to demonstrate how religiously they adhered to this concept, let''s

    take a brief detour.


