  md: '# About Email in General


    If you''re new to email, there are a few things you should know. Unfortunately,
    though the majority of folks on the Internet are quite friendly, a few bad apples
    are out there. When you cross paths with these fellows, you''re bound to encounter
    fakemail, spam, and even the dreaded email bomb. Let''s briefly discuss these
    here.


    # The Phony Express: Fakemail and Spam


    If you use the Internet for any length of time, you''re bound to ride the Phony
    Express. That''s another way of saying that you''ll receive both fakemail and
    junk mail (and sometimes, these will be one and the same).


    A recent study indicated that the average Internet user''s email is comprised
    almost 25 percent junk mail. Junk mail usually consists of unsolicited advertisements
    sent to your email address. Typically, the authors of such garbage attempt to
    obscure their real email addresses.


    Is there any cure for junk mail and fakemail? Not really. You simply have to either
    ignore them or get a program that filters them out. Unfortunately, though, there
    aren''t many commercial UNIX programs designed for this. On UNIX, mail filters
    are usually homeless, meaning that UNIX users write their own.


    Until you get more proficient at using UNIX, writing your own mail filtering program
    is clearly out of reach. Therefore, for now, ignore your junk mail. Eventually,
    your mail will fade away. Lastly, whatever you do, don''t reply to junk mail.
    (The perpetrator''s email server may interpret your reply as a request for further
    information.)


    # The Dreaded Email Bomb


    You can''t please all of the people all of the time. During the course of using
    the Internet as a tool of free speech, you''re bound to tick somebody off. It
    doesn''t matter what you say, really, because there will always be someone who
    takes issue with your viewpoint (even if this person has absolutely no idea what
    you''re talking about).


    Sometimes, these people do more than simply berate you in public forums or over
    email. Instead, they take things a step further, graduating to bona fide harassment.
    Common harassment tool is the dreaded email bomb. This is where some bozo sends
    you the same message hundreds (or even thousands) of times.


    Do email bombs actually cause any damage? No. They''re a nuisance. If you should
    receive one, simply ignore it and delete the messages.


    236'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# The Least You Need to Know


    Sending and receiving messages nearly instantly to and from practically anywhere
    in the world is one of the great advantages of the computer age. To take advantage
    of the email capabilities of UNIX, here''s the least you need to know:


    +   - Nearly all UNIX distributions come with mail installed. When in doubt, use
    mail.

    - elm is slightly more user friendly than mail but is only available in select
    UNIX flavors. If your system doesn''t have elm, contact your system administrator.

    - pine is the most user-friendly text-based mail client currently available. However,
    pine is not available on all systems.'
