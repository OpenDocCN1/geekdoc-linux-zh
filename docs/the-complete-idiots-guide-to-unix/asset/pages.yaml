    Many people insist that the Gopher protocol is no longer used. Instead, they say,
    the WWW has obviated the need for Gopher servers. In fact, neither is true. Gopher
    servers primarily text-based information, but they serve it at blazing speeds.
    If you''re doing research, you may find Gopher networks faster and more informative.
    There are many reasons for this, but one really stands out: Gopher servers don''t
