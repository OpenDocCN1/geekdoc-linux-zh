    # About Grayscale Displays


    Naturally, on grayscale displays, X cannot display colors. Therefore, "colors"
    appear in varying shades of gray. By a general rule, when setting colors on a
    grayscale display, you should stick with grays and their derivatives. If you don''t,
    you may experience bizarre results, or X may refuse to load at all.


    # Running Applications Inside an Xterm Window


    To run an application inside an Xterm window, open an Xterm and run the application
    from a prompt. UNIX will run the specified application inside the Xterm. For example,
    to run pico in an an Xterm and issue the following command:


    ```

    pico

    ```


    pico will appear inside the Xterm window. (See the following figure).


    pico running in the Xterm window.


    ![](img/b0bfb2d724c393178bf462832858a65d_197_1.png)


    Here''s an important point to note: Although Xterm windows have special capabilities
    (notably cut and paste), applications running inside of Xterms don''t have any
    more functionality than they would when running from a command line. In other
    words, Xterms bestow no special powers on garden-variety command-line programs.
    For example, you cannot open pico in an Xterm window and place the cursor anywhere
    in pico and start typing. You''ll still be forced to adhere to pico''s mostly


