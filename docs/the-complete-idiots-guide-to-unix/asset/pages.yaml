- img_proc: true
  md: '# Part 3 > Working in the UNIX GUI


    The problem is, if UNIX systems come with Gopher client, it''s usually a text-based
    one. (Invariably, it''s the tried-and-true client from the University of Minnesota.)
    Text-based Gopher tools are excellent for light research, but if you have more
    demanding needs, I recommend Xopher.


    Xopher is to Gopher what recommend Netscape Navigator is to the Web. All information
    is conveniently displayed in windows, along with notations, bookmarks, and help.
    (See the following figure.)


    Xopher in action.


    ![](img/b0bfb2d724c393178bf462832858a65d_211_0.png)


    Xopher also provides the means to configure external applications. This way, if
    you find a Telnet link, Xopher will spawn an external Xterm to filter your Telnet
    session. In all, Xopher is undoubtedly the best UNIX Gopher client available.
    It runs on most systems and eats a meager amount of X resources.


