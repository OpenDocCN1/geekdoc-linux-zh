  md: '# Part 2 > Nuts and Bolts


    ![](img/b0bfb2d724c393178bf462832858a65d_55_0.png)


    The other type of network connection is often created using a program called telnet.
    You can quickly recognize a telnet network session in progress if the screen displays
    a message like this:


    # About telnet


    ```

    Trying 207.171.0.111...

    Connected to 207.171.0.111.

    Escape character is ''^''.

    ```


    You''ll learn more about telnet in Chapter 21, "Other Network Services." telnet
    is often used to access UNIX from Windows or Mac OS. For example, if you get involved
    in Web development, you will probably log into a remote UNIX server more than
    once.


    In telnet network connections, the local machine may not be running UNIX. (For
    example, the local machine may be running Windows 95 and simply connected to a
    UNIX server.)


    Either way, for the most part, network connections are not very different from
    "real" UNIX sessions. In network connections, you''ll have access to all the resources
    that UNIX offers. (The one exception to this is the X Window System. If your network
    connection is over a telnet link, X will generally not be applicable.)


    ![](img/b0bfb2d724c393178bf462832858a65d_55_1.png)


    # Giving UNIX the Boot


    # When Is a Network Not a Network Connection?


    Whether you use a workstation, PC, or X terminal, you still need to boot UNIX.
    This process is as simple as turning on the machine. After the machine checks
    its memory and disks, you''ll hear a horrible grinding sound and dozens of confusing
    messages will scroll by. Eventually, this clamor will cease and the prompt will
    appear.


    Still a third type of network connection is a connection established over serial
    lines. This is where a physical cable from the UNIX machine to your own. The cable
    connects to serial ports (like those used for external modems or mice). Serial
    connections behave almost exactly like telnet connections. In fact, serial connections
    are a popular way to connect dumb terminals to a UNIX system. (Technically, this
    isn''t really a network connection but rather a connection.)


    In rare instances, however, you may need to boot UNIX from a specific device (or
    worse still, you may have to install UNIX). This chapter provides a little background
    on these tasks.


    # Booting UNIX on Different Devices


    You can boot UNIX from several sources, including:


    +   - A floppy disk

    - A CD-ROM


