- img_proc: true
  md: '# Part 2 > Nuts and Bolts


    Compression is the process of packing a file''s contents tight in order to reduce
    the file size. (The smaller the file, the faster it will transfer.) You would
    think that today, because modems are pretty fast, people no longer need to compress
    files. Think again! As time progressed, program file size grew at a much faster
    rate than modem speed. So even today, users still compress their files. (UNIX
    compressed files are nearly identical in behavior and purpose to .IT files on
    the Macintosh and .ZIP files on the PC.)


    Almost all the downloadable UNIX software you encounter will be compressed. Your
    job is to decompress (or unzip) software once you''ve downloaded it. You''ll know
    immediately if you''re downloading a compressed file because it will have a .Z,
    .gz, or .tgz. Here are some examples:


    ```

    Ftptool4.6.bin.tar.Z

    ```


    ```

    Ftptool4.6.bin.tar.gz

    ```


    ```

    Ftptool4.6.bin.tar.tgz

    ```


    Many UNIX compression programs are available, but the most popular are compress,
    uncompress, gzip, and gunzip. Depending on your UNIX system, you may have at least
    two (and possibly all four) of these programs.


    Let''s briefly cover these programs now.


    # Compressing Files with the compress Command


    compress is probably the most popular commercial UNIX compression utility. You''ll
    find it on almost any UNIX system. To use compress to compress a file, issue the
    compress-command plus the name of the file you want to zip up, like this:


    ```

    compress myfile.txt

    ```


    In res, compress will pack down myfile.txt and give it a .Z extension, like this:


    ```

    myfile.txt

    ```


    # Uncompressing Files with the uncompress Command


    Files that are compressed with compress (that is, those that have a .Z extension)
    can be uncompressed with the uncompress utility. To uncompress such a file, issue
    the uncompress command plus the name of the file, like this:


    ```

    uncompress myfile.txt.Z

    ```


