  md: '# Part 7 Reference


    ps A UNIX command for listing current processes. To list all your current processes,
    issue the command ps. To list all processes currently running on your machine,
    issue the command ps -A.


    pwd A UNIX program that displays the working directory (the directory you''re
    now in). To discover the working directory, issue the pwd command, like this:
    pwd.


    queue A list of jobs waiting to be printed. The queue keeps track of those jobs
    and the order in which they were presented.


    quote Any quotation symbol, including the following: '' '', ". These are used
    for various purposes but often to store values.


    read-only This refers to an attribute. When a file system is “read-only”, users
    can read it but cannot write to it.


    redirection The process of sending input or output to another file or process.
    This is done with any of a series of characters, including, >, <<, and ! For example,
    suppose you want to store a list of your directory''s contents in the file directory.
    You could issue the following command: ls -l > directory. This command lists your
    directory contents and redirects the results to the file directory.


    login A UNIX program that allows you to connect your terminal to remote hosts.
    login is much like itself, except login allows you to dispense with entering your
    password each time you log.


    rm A UNIX program that removes files. To remove a file, issue the rm command the
    file you''re removing (for example: rm thisfile.txt).


    rmdir A UNIX program that removes directories. To remove a directory, issue the
    rmdir command the directory you''re removing (for example: rm /directory).


    root The super-user or all-powerful administrative account on UNIX systems.


    router A computerized device that routes data over networks, especially the Internet.


    SCSI Small Computer Systems Interface. SCSI is a data transport system used by
    hard disks, floppy disks, and CD-ROMs. SCSI drives are extremely fast and can
    be daisy-chained together (in other words, they can be strung using cable). Almost
    all UNIX workstations use SCSI.


    sed The stream editor is an extremely powerful text-editing tool. Using sed scripts
    you can automate text editing.


    sendmail A mail transport system common to all UNIX distributions. sendmail is
    based on the Simple Mail Transport Protocol (SMTP).


    shar A UNIX program that creates shell archives. Shell archives are strings of
    files packed together for easy transport over the network. These can be unpacked
    by /bin/sh and expanded back to their original form.


    376'
