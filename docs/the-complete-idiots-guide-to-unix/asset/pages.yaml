  md: '# # Automating Remote Logins: The rlogin Command


    rlogin is very much like telnet. In fact, once you log in using rlogin, things
    will work exactly as if you were using telnet. The difference is that rlogin is
    designed to automate-logins between machines that trust one another. For example,
    suppose your network had three machines:


    +   - apples.mycompany.com

    - oranges.company.com

    - pineapples.mycompany.com


    Furthermore, suppose you have an account with the username apples, oranges, and
    pineapples. If you use telnet to log in to all, you have to enter a username and
    password every time. To avoid this, rlogin stands, like this:


    ```

    rlogin apples

    ```


    Because apples already knows you, it logs you in immediately without bothering
    to ask for a username or password. (rlogin only works this way if your username
    is known. If it isn''t, rlogin will still ask for a username and password.)


    # # Executing Remote Commands: The rsh Command


    rsh (which stands for remote shell) is a tool that allows you to execute commands
    on remote UNIX servers. For example, suppose you want to list the directory contents
    of / the machine "bowser.". You would issue the following command:


    ```

    rsh bower "ls -l /"

    ```


    rsh is generally available only in private networks, and here''s why: rsh can
    be a security hazard (for example, outsiders could potentially execute commands
    on your server). If you''re unsure whether rsh is available on your network, consult
    your system administrator.


    # # Copying Files Remotely: The rcp Command


    To copy a file from a remote machine, use the rcp command (which stands for remote
    copy).


    At a minimum, rcp takes two arguments: the targeted host and the file you want
    to copy. For example, to copy the file /etc/termcap from the host apples.mycompany.com,
    you would issue the following command:


    ```

    rcp apples.mycompany.com:/etc/termcap

    ```


    294'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Chapter 21  Other Network Services


    # About Privileges


    Even if rsh is available, you may have to execute it as another user. For example,
    suppose your username on the local machine is tom. Perhaps the user ID tom does
    not have the necessary privileges to execute the specified command on the remote
    machine. (For example, suppose tom wants to examine a file created on host dick
    by harry. Because harry''s files can only be viewed by harry, tom must use rsh
    as harry). To execute a command as another user while using rsh, use the -l option
    (as in rsh -l harry). When you use this option, rsh prompts you for a password.


    # The Least You Need to Know


    Here''s the least you need to know about remote services:


    +   - To transfer files from one host to another, use the ftp command.

    - To conduct an interactive terminal session across a network, use telnet or login.

    - To execute a command on a remote UNIX host, use the rsh command.


    295'
