- img_proc: true
  md: '# Table 16.2. Various pppd flags and what they mean CONTINUED


    | pppd Flag | Function |

    | MRU [#] | MRU stands for maximum receive unit. This value describes the largest
    byte size of received packets. (This is a way to limit the size of packets sent
    to you.) The minimum size you can specify is 128, but if you''re using a modem,
    296 is recommended. (You can go as high as 1500, but this is not recommended unless
    you have a high-speed connection.) To specify an MRU value, issue the MRU flag
    plus the value, like: **MRU 296**. |

    | MTU [#] | MTU stands for maximum transmit unit. This value describes how many
    bytes each packet will be transmitted. Using a large MTU guarantees faster transfers,
    but it also increases the chance that errors will occur during transfer. To specify
    an MTU value, issue the MTU flag plus the MTU value, for example: **MTU 256**.
    |

    | speed | speed is a number value. With it, you specify the top speed of the connection.
    For example, if you have a 33.6 modem, a good speed setting would be 38400. |


    # Direct Dial Connections


    In the unlikely event that you''re ever forced to access the Net by direct dial-up,
    this section''s for for you. Almost all UNIX systems have two utilities that can
    help you establish a direct dial connection:


    +   - cu

    - tip


    Let''s briefly cover each.


    # Dialing Another UNIX Machine: The cu Command


    To dial another UNIX machine directly, use cu, like this:


    ```

    cu 18185555555

    ```


    This will dial the system at (818) 555-5555. Pretty simple, right? Maybe and maybe
    not. cu has many, many options. Depending on your system configuration, you may
    need to use one or more of these options. The important ones are summarized in
    Table 16.3.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Table 16.3. A few options


    | cu Option | Purpose |

    |---|---|

    | -b [7 or 8] | The -b switch is for setting the bits on received data. This value
    is 7 or 8. This is important. If you connect using 8 bits when the other system
    uses 7 bits, the text will appear in bizarre places on the screen, or perhaps
    not appear at all. |

    | -c | The -c option allows you to specify a dialing device. To obtain a list
    of devices, check the /etc/uuc/Devices file. |

    | -d | The -d option stands for diagnostic. This forces a diagnostic log of your
    session. (This is useful when you''re trying to determine what''s wrong.) |

    | -s [speed] | The -s option allows you to specify a baud rate. For example, cu
    -s 38400 55555. This tells cu to dial 555-5555 when the connection is made, that
    connection will occur at 38,400bps. |


    In most cases, when cu finally connects, the session works like a serial connection.
    Typically, you''ll be faced with a login prompt. From there, you simply log in
    and begin working.


    # Still More Direct Dialing: The tip Command


    Still another excellent utility for direct dial is tip, which is a little more
    powerful than cu it has some very convenient, prefabricated functions. (These
    are discussed later.) However, at least with regard to making the connection,
    tip works very much like cu. You can start a tip session by issuing the tip command
    plus either the host or the telephone number you want to dial:


    +   - tip some-host


    Once the connection is made, the session will behave exactly as though you were
    working on a local terminal. There''s virtually no difference between using tip
    and plugging a dumb terminal into the remote host. However, once you''re logged
    in, you can do a lot with tip.


    While connected to the remote host via tip, you can jump into command mode at
    any time by placing a tilde character (~) at the beginning of a line. Anything
    that follows tilde is then interpreted as a command. Table 16.4 summarizes some
    legal tip commands that can follow a tilde.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Table 16.4. Some tip commands


    | Command | Purpose |

    | -! | This drops you to a shell on your own machine. (This is very useful when
    you need to search for a file but you don''t want to cut the connection. When
    you exit from the shell, you''re returned to your tip session.) |

    | -$ | This tells tip to send the output of local commands to the remote host
    for processing by the remote shell. |

    | - or +Ctrl+D | This tells tip to sever the connection. |

    | -? | This tells tip to display all possible tilde-based commands currently available.
    |

    | -! | This tells tip to pipe the results of a remote command to a local command
    or process. (This is useful when you want to use a local program to examine files
    on a remote. You can print the remote files to stdout and pipe them to the local
    program.) |

    | < | This tells tip that you want to transfer a file from the remote host to
    your own machine. (tip will prompt you for a file-name.) |

    | -> | This tells tip that you want to transfer a file from your machine to the
    remote host. (tip will prompt you for a file-name.) |

    | -c [directory] | This tells tip to change to a particular directory–if the argument
    directory is given–or to your home directory.|


    # ## Summary: Direct Dial Connections


    Using a direct dial connection is probably the least desirable way to connect
    because you''re dependent on the remote system''s Internet access. Moreover, getting
    files to your machine is a two-part process. First, you have to download the files
    from the Internet to the remote machine. Then, you download them to your own box.


    However, if this is the only connectivity you currently have, it helps to know
    how to negotiate a raw connection. If you intend to use direct dialing for any
    length of time, you should study the cu and tip man pages carefully. Both programs
    are quite versatile, and you can perform many complex tasks using them.


    # ## The Least You Need to Know


    This chapter may not teach you everything you need to know about Internet connectivity,
    but it''s a good start. However, note that many proprietary UNIX systems often
    have built-in Internet connectivity suites. (For example, UNIXWare includes'
