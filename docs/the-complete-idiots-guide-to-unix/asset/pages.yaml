    # gzip and gunzip


    gzip and gunzip are distributed by the Free

    Software Foundation. These programs are free

    alternatives to traditional "zip" and "unzip"

    programs (such as compress and uncompress.).

    as you might expect, gzip zip files and gunzip

    unzips zipped files.


    > Gee, Zip!

    You get gzip and gunzip (and

    dozens of other useful programs) at

    t Free Software Foundation’s

    home page, located at

    http://www.fsf.org.


    # Zipping Files with gzip


    To zip a file using gzip, issue the gzip comp-

    mand followed by the name of the file you''re

    zipping, like this:


    ```

    gzip myfile.txt

    ```


    In response, gzip will zip myfile.txt and give it a .gz extension, like this:


    ```

    myfile.txt.gz

    ```


    # Unzipping Files with gunzip


    Using gunzip is pretty simple. In most cases, you''ll issue the gunzip command
    plus

    the filename, like this:


    ```

    gzip Ftptool4.6.bin.tar.gz

    ```


    This will unzip the file into the current directory.


    gzip and gunzip also support several command-line switches. Using these switches,

    y can control how your files are zipped or unzipped. Table 10.1 summarizes the

    switches.


