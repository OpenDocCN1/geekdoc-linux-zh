  md: '# Chapter 19 > USENET News


    | Command | Result |

    |---|---|

    | Ctrl+a | In editing mode, this command positions the cursor at the beginning
    of the current line. |

    | Ctrl+b | In editing mode, this command moves the cursor back one character.
    |

    | Ctrl+d | In editing mode, this command deletes the currently highlighted character.
    |

    | Ctrl+e | In editing mode, this command positions the cursor at the end of the
    current line. |

    | Ctrl+f | In editing mode, this command moves the cursor forward one character.
    |

    | Ctrl+k | In editing mode, this command deletes all text from the cursor to the
    end of the current line. |

    | Ctrl+k | In group mode, this deletes the current group. Warning: Use this sparingly,
    because the group really gets deleted from your configuration files. If you delete
    a group this way, you need to subscribe again to recover it. |

    | Enter | In group mode, this summons messages from the currently selected group.
    |

    | h | This summons the help screen. |

    | q | This causes tin to exit. (q stands for quit.) |

    | s | This subscribes you to the currently selected group. |

    | S pattern | This subscribes you to any group that matches the specified pattern.
    |

    | Tab | In group mode, this pulls up the next reread group. |

    | u | This unsubscribes you from the current group. |

    | U pattern | This unsubscribes you from any group matching the specified pattern.
    |

    | w | This causes tin to enter edit mode. It allows you to post a message to the
    currently selected group. |

    | Y | This gets any new messages that may have arrived while were using tin. |

    | Z | This deletes groups you have inadvertently deleted. |


    tin is truly a powerful newsreader. This table covers only a small fraction of
    the commands available. For more information, consult the tin man pages.


    # Using pine to Read News


    In Chapter 17, "Email," I explain that pine can be used to read and send email.
    You''ll be pleased to find out that you can also use pine to read USENET news.
    However, before you use pine as a newsreader, you need to configure it for USENET.
    Let''s start there.


