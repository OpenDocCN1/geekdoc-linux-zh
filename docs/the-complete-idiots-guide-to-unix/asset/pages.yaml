    # # Common Mistakes


    +   In This Chapter

    * Some common mistakes that UNIX newcomers

    * Backups

    * Corrupted password files

    * Terminal problems

    * Problems in X and how to avoid them


    Your first few weeks with UNIX will be frustrating. During that time, you''ll
    make many mistakes and encounter many problems. This short chapter addresses some
    of these problems and how to avoid them.


    # ## Backups


    The most devastating mistake of all is having no backups. In computing, there''s
    one immutable rule: Eventually, your data will get corrupted. There''s no sense
    in denying it, and it makes no difference how much experience you have. Eventually,
    something terrible will happen.


    Often, these disasters can have serious consequences. For example, imagine creating
    an entire intranet site consisting of hundreds of Web pages. Suddenly, your disk
    drive dies. If you don''t have backups, forget it. You must redo every shred of
    work that took you months to accomplish. Don''t let this happen to you. Back up
    often.'
