  md: '# Part 5


    # System Administration


    You''re well on your way to becoming a UNIX guru, and it may be that you''re thinking,
    as much of a kick as UNIX is, it might not be a bad thing to get paid to play
    with it all day. Well, obviously you''re not alone, and in this part of the book,
    you''ll learn the basics of UNIX system administration.


    How does a UNIX system administrator wire away the day? What powers does the administrator
    hold over unsuspecting users, and even entire groups of users? How can system
    security be maintained in a world rife with hackers and crackers itching to invade?
    For the answers to this and other questions, enter your password . . . or turn
    the page.


    ![](img/b0bfb2d724c393178bf462832858a65d_320_0.png)'
