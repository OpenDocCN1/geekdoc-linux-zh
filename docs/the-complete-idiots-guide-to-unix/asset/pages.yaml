  md: '# About Your Password


    Now it''s time to learn how to change your password. You''re probably wondering
    why I waited until now to discuss it. Here''s why: the first time you log into
    UNIX, you''re basically getting your bearings. It''s strange typing out your password
    and not being able to see it. On that account, new UNIX users tend to make frequent
    mistakes while entering their password.


    Now that you''ve done it at least once, you''re probably more comfortable with
    the login-password procedure.


    # The passwd Command: Changing Your Password


    To change your password, issue the passwd command, like this:


    ```

    passwd

    ```


    To ensure that you''re authorized to make the password change, UNIX will then
    ask for your current password:


    Enter login password:


    Here, you enter your current password. UNIX will respond by verifying your old
    password and then asking you for a new one:


    New password:


    Here, you enter your new password. However, before committing the change, UNIX
    will ask you to verify it. (This is to ensure that you didn''t make a typing mistake.)
    The verification prompt looks like:


    Re-enter new password:


    After you re-enter your new password (providing you typed it correctly), UNIX
    will commit the change and notify you:


    ```

    passwd (SYSTEM): passwd successfully

    changed.

    ```


    That''s it. You changed your password!


    ![](img/b0bfb2d724c393178bf462832858a65d_72_0.png)


