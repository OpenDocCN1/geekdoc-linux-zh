    # Permission Denied


    You receive the Permission denied error when you try to access a file, directory,
    or other resource that you don''t own.


    No easy solution exists for this problem. UNIX has a built-in security system
    that prevents you from accessing files owned by other users. In particular, you''ll
    be unable to access any resource owned by root. To determine the file''s owner,
    issue the following command:


    ```

    ls -l filename

    ```


    The results will reveal who owns the file. For example, to check the owner of
    /etc/passwd, you would issue this command:


    ```

    ls -l /etc/passwd

    ```


    Here''s the output:


    ```

    -rw-r--r-- 1 root other 467435 Jun 26 13:39 /etc/passwd

    ```


    You can tell this from that /etc/passwd is owned by root. Therefore, you will
    not be able to alter this file.


    If you''re the system administrator, log in as "root" and alter the file. However,
    if you''re not the system administrator, you should exercise caution. This is
    especially the case when you''re trying to access files owned by root. The system
    administrator will discover your activity and interpret it as an attempt to breach
    system security.


    331'
