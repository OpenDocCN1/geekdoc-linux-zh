  md: '# # Appendix C Speak Like a Geek: The UNIX Bible


    **interpreter** Command interpreter or shell. This is a program that passes your
    instructions to the operating system. (It also reports back from the operating
    system when needed.) An interpreter is also any program that interprets special
    data (for example, a PostScript interpreter or even a BASIC interpreter.)


    **IP** Internet Protocol. The protocol responsible for transferring data across
    the Internet.


    **ispell** An interactive spell-checker common to many UNIX platforms. Use ispell
    to correct simple errors in your text files.


    **job** Any process you''ve started. UNIX keeps track of all jobs so that you
    can track their progress or kill them


    **job control** A feature of UNIX that allows you to start and stop jobs interactively.


    **job number** A number assigned to a particular job. (UNIX identifies and tracks
    all jobs by number.)


    **kill** A UNIX program for killing processes. This is useful for eliminating
    runaway, stagnant processes. (To kill such a process, enter the command *kill*
    followed by the process number. To get a list of processes, issue the *ps* command.)


    **Korn (ksh)** A UNIX command interpreter written by David Korn, from Bell Labs.
    (ksh is used on several UNIX platforms, most notably AIX.)


    **LAN** Local area network. This is generally a small Ethernet network of computers
    wired together. Typically, LANs are used in small business or academic environments,
    where the network does not expand beyond several adjacent rooms. (However, in
    a corporate environment, a LAN can be quite large.)


    **less** A UNIX utility used to display a file one page at a time. less is very
    much more, but it allows you to scroll backwards.


    **link** A pointer to a file. You can set multiple links to the same file. For
    example, suppose you have a file named addresses.txt with addresses in it. You
    could create links to addresses using different names, including addresses, address,
    contacts, and so forth. Other could reach the file using each of these names.


    **Linux** A free UNIX clone that runs on widely disparate architecture, including
    x86 (Intel), Alpha, Sparc, and PowerPC processors. Linux is becoming increasingly
    as a Web server platform.


    **1p** A UNIX command used to send files to the printer. the 1p has endless command-line
    options. Check the 1p man page for details.


    **1pr** A UNIX command used to send files to the printer. see the 1pr or 1p man
    pages for details.


    **1s** A UNIX program that lists directory contents.


    **MachTen** Linux for the Macintosh. (See *Linux*.)'
