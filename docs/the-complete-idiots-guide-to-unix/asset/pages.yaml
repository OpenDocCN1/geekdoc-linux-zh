  md: '# Chapter 23 > Common Mistakes


    To do so, take the installation CD-ROM and put it in another machine. Now you
    can search for the passwd file, which is universally compressed. To do this on
    a UNIX machine, use the find command:


    ```

    find -name *passwd*

    ```


    ![](img/b0bfb2d724c393178bf462832858a65d_338_0.png)


    If the nearest is running Microsoft Windows, choose Start!Files or Folders or
    enter passwd\.* as a search string.


    > On newer UNIX systems, encrypted passwords are never stored in /etc/passwd;
    instead, they''re stored in a shadow file. UNIX uses this file to authenticate
    passwords. On occasions, your shadow file can become corrupted. When this happens,
    even legitimate logins will fail. The cure is to boot with installation media
    and run pwconv recover your shadow password file.


    Once you know the location of the passwd file, reboot with the installation media,
    mount the desired disk, and copy the passwd file from the installation media to
    the hard disk. (This works because the root account has no password on installation
    media. The root password isn''t set until the installation is complete.)


    On the other hand, your password shadow file can sometimes get corrupted. If this
    happens (and your password file is still intact) you may be able to recover the
    shadow file using the pwconv command. pwconv rebuilt the shadow file. (pwconv
    is available on many UNIX flavors, including HP-UX, Solaris, and Linux.)


    # Cruising As Root


    Whether on your own machine or someone else''s, if you''re easy to fall into a
    pattern of behavior where you log in as root and stay that way. However, you must
    resist that temptation, because if you don''t, you''ll eventually meet with disaster.
    There are several reasons for this.


    First, while you''re root, you''re essentially a god on that particular machine.
    This is not a good thing. Humans are curious creatures and not well suited to
    "god" status. You may go tooling around directory to directory, tinkering with
    binaries that you know nothing about. That''s where the trouble begins.


    The human spirit is such that when faced with a mysterious object, we have a tendency
    to poke and prod it until something interesting happens. This curiosity has resulted
    in everything from the discovery of fire to the development of the atomic bomb.


    315'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Troubleshooting


    In UNIX, certain commands available to root are irrevocable or can cause irrevocable
    results. Moreover, root can create or destroy almost any file. Therefore, by cruising
    around root, you''re taking the following risks:


    +   - You might accidentally delete important files.

    - You might accidentally overwrite important files.

    - You might inadvertently change something that you don''t have enough experience
    to restore to its original state.


    Additionally, surfing the Net as root poses a special risk. Many Web sites employ
    executable content through applets. Applets are small programs that can be executed
    in a Web browser. Most applets are written in a powerful networking language from
    Sun Microsystems called Java.


    Although Sun has done much to improve Java security, Java still poses a security
    risk. The degree of risk depends on how far Java can reach into your system. Typically,
    malicious Java code can only do as much damage as your user ID''s privileges allow.


    When you choose root, you have privileges to do anything, to file. Therefore,
    when malicious Java code compromises your security while you''re root, it gains
    root access to resources that are generally not available to “regular” users.
    For this reason, you should not surf the Net as root.


    # Dangerous Commands


    UNIX has many dangerous commands that can potentially damage or destroy valuable
    data. Here are few:


    +   - cp (the copy command)—This command doesn''t warn before overwriting files.
    If you''re unsure whether you''re about to overwrite a file, give the copy a unique
    name.

    - fdisk (a disk formatting utility)—fdisk can format disk drives. If you make
    a mistake using fdisk, you may inadvertently destroy a system partition. If so,
    your system will be destroyed, and you''ll have to reinstall. Be extremely careful
    when using fdisk.

    - format (a disk formatting utility)—format formats disk drives, and in this respect,
    format is just as dangerous as fdisk. Be extremely careful when using format to
    format disk drives.

    - rm (the remove command)—rm removes files. Until you become capable with UNIX,
    always use the -i switch. This will force rm to prompt you before removing each
    file. For each time rm prompts you this way, think carefully before choosing Yes.


    316'
