    that you''re connecting to the right host.


    # # No Manual Entry (No Manual Entry for Command)


    You receive the No manual entry error when you request a manual page but UNIX
    can''t find it.


    Possible reasons include the following:


    +   - You misspelled the command name.

    - The man page exists but was never installed.

    - No man page exists for the specified command.


    First, check your spelling. If you''ve spelled the command name correctly and
    still receive a manual entry error, it''s possible that the man page was never
    properly installed. This sometimes happens when the command is a third-party program.


    For example, this can happen when you download software from the Net. Many freeware
    and shareware packages (especially for Linux) are “bare bones.” When you unpack
    these distributions, the documentation is often in plain text, or the man page
    is not formatted. You can check by examining the directory to which the package
    is extracted. Often, the man page is in a file with a .1 extension. For example,
    the-name might be man.1 or command.1. If you find such a file, you can quickly
    view the man page by issuing the following command:


    ```

    nroff -man command.1

    ```


    328'
