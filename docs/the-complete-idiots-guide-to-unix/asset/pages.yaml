    # The Rigors of Chatting


    Chatting on IRC can be great fun. However, I thought it wise to offer a few words
    of caution.


    Like portion of the Internet, Internet Relay Chat is practically boundless. You
    can chat with an unlimited number of users for an unlimited period of time. In
    fact, if you wake up at 2:30 a.m. and went looking for chat partners, you''d have
    no trouble finding one. After, the Internet is global. You might find yourself
    chatting with someone in China, South Africa, or New Zealand. That''s the beauty
    of the Net.


    ![](img/b0bfb2d724c393178bf462832858a65d_299_0.png)


    After using IRC awhile, you''ll encounter many old nuances and tools. For example,
    you''ll probably learn about tools such as scripts and bots. These are automated
    agents that perform their tasks without human intervention (such as knocking out
    of a chat channel). Although these tools cool, try to avoid using them. If you
    don''t, you may find yourself banned from many chat servers. Before you do anything,
    check the rules of your chat server. Most strictly prohibit bots and scripts.


    Unfortunately, however, that''s also the danger in it. IRC can be extremely addictive.
    Folks have been fired from their jobs for excessive IRC use, and marriages have
    been broken up by excessive IRC use. Therefore, please heed these words of caution:
    Chat in moderation. If you''re chatting more than a couple hours day, you probably
    need to slack off.


    276'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# The Least You Need to Know


    To chat with your co-workers, friends, and just about anyone else, here''s the
    least you need to know:


    +   - To chat one on one with someone on your own machine and network, use the
    talk command, like this: talk bwagner.

    - To chat one on one with someone on a different network, issue the talk command
    plus the user''s email address, like this: talk bwagner@pacificnet.net.

    - To chat with the entire world (or at least those currently chatting) use IRC.

    - Chat in moderation.'
