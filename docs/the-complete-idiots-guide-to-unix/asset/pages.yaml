  md: '# Dumb Terminals


    Dumb terminals consist of just a monitor (or terminal) and a keyboard. The screen
    displays simple text, which is typically white, black, or green on a black or
    amber background. Dumb terminals are designed this way specifically to cause maximum
    eyestrain. (Just kidding.)


    ![](img/b0bfb2d724c393178bf462832858a65d_54_0.png)


    # Dumb Terminal IQ


    Dumb terminals really dumb? No. However, they are designed expressly to connect
    to UNIX server, mainframes, or other network servers. In such environments, users
    seldom need disk of their own because all resources reside on the server. Therefore,
    dumb terminals aren''t dumb at all; they''re just cheap, effective working stations.
    (Even if you''ve never used a dumb terminal, you''ve probably seen one. For example,
    they''re often used in conjunction with cash registers at large retail outlets.)


    # X Terminals


    X terminals consist of a monitor, keyboard, and a mouse. You can easily differentiate
    an X terminal from a dumb terminal because X terminals provide you with a graphical
    environment. In this environment, you use the mouse to manipulate windows. Most
    X screens have a light blue background and the cursor looks like a small X.


    The graphical interface on X terminals is the X Windows System (or X) from MIT.
    You''ll learn more about X in Chapter 11, "Tyrannosaurus X: A Windowing System."


    # UNIX Network Connections


    Still another way you can encounter UNIX over a network connection. Network connections
    can be initiated from almost any type of computing device (including workstations,
    PCs, dumb terminals, and X terminals).


    ![](img/b0bfb2d724c393178bf462832858a65d_54_1.png)


    There are two types of network connections. The first type, which occurs over
    Ethernet, (That''s a fancy way of saying that you won''t know it''s a network
    connection. Instead, it looks and behaves precisely if the local computer were
    running UNIX.),


    # X Terminals Aren''t Always Exclusively Color


    Some X terminals—admittedly few do not support color. These are typically grayscale
    displays. Grayscale displays support 256 shades of gray. These have very sharp
    resolution. (Also, there''s a small minority of X terminals that support only
    black and white.)


    # 31'
