  md: '# Part 3 > Working in the UNIX GUI


    Different programs display usage summaries under different conditions. For example,
    some programs will use a usage summary (or even pretty detailed help) when you
    issue the --help flag as an argument. For example, take a look at perl''s help
    output:


    ```

    $ perl --help


    Usage: perl [switches] [--programfile] [arguments]

    -[octal]          record separator (\0, if no argument)

    -a               autosplit mode with -n or - (splits $ @F)

    -c               check syntax only (runs BEGIN and END blocks)

    -d[debugger]     run scripts under debugger

    -D[number/list] set debugging flags (argument is a bit mask or flags)

    -e ''command''    one line of script. Several -e''s omit [programfile].

    -F/pattern      split() pattern for autosplit (-a). The ''//s are optional.

    -i[extension]    edit <> files in place (make backup of extension supplied)

    -Idirectory     specify INC#/include directory (may be used more than once)

    -[octal]         enable line ending processing, specifies line terminator

    -[m][module]..  executes ''use/no module...'' before executing your script.

    -n               assume ''while (<>) { ... }'' loop around your script

    -p               assume loop like -n but print line also like sed

    -P               run script through C preprocessor before compilation enable switch
    parsing for switches after script name

    -S               look for the script using PATH environment variable

    -T               turn on tainting checks

    -U               dump code after parsing script

    -U               allow unsafe operations

    -v               print version number and patchlevel of perl

    -V[:variable]    print perl configuration information

    -w               WARNING ON FOR COMPILATION OF YOUR SCRIPT. Recommended.

    -x[dir]          strip text before #perl and perhaps cd to directory

    ```


    This is probably a little more than you need, but it will illustrate by many.
