    # Conditional Execution of Commands


    Both sh-style and csh-style shells support conditional execution of commands.
    There are two conditional command structures: AND and OR:


    +   - AND specifies that if the first command is successful, the shell should
    execute the second command.

    - OR specifies that if the first command fails, the shell should execute the second
    command.


    The AND command structure consists of commands separated by double-ampersands,
    like this:


    ```

    cd /usr/bin && ls

    ```


    This command tells the shell to change the directory to /usr/bin and list its
    contents. If the cd command fails (/usr/bin does not exist), the ls command is
