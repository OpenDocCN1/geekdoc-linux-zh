    **Purpose:** vi is a text editor.

    **Example:** vi myfile.txt. This starts vi to edit myfile.txt. (To learn more
    about vi, see Chapter 8.)


    # wall


    **Purpose:** wall sends the specified message to all terminals.

    **Example:** work sucks!! This will print the following message to all terminals:


    work sucks!!


    # wc


    **Purpose:** wc will count and display the number of bytes, words, and lines in
    the specified file.

    **Example:** wc myfile.txt. This will display statistics on myfile.txt.


    # whatis


    **Purpose:** whatis displays a brief description about the specified command.

    **Example:** whatis whatis. This will display the man page description for whatis.
    Here''s the output:


    whatis (1)  - display manual page descriptions


    # whereis


    **Purpose:** whereis locates files.

    **Example:** whereis traceroute. This launches a search for the file traceroute.


