  md: '# Appendix C ► Speak like Geek: The UNIX Bible


    background A space where programs run but hide their output until they''re finished.
    Sometimes, if you expect a process to take a long time to complete, you''ll run
    in the background. This prevents the process from printing status reports to your
    screen until the job is done. You send a command to the background by appending
    the ampersand to the end of your command line, like this: grep database.txt &
    (Compare with foreground.)


    bash The Bourne-age shell, a sh-compatible command interpreter for UNIX. bash
    was created by Steve Bourne. (Compare with csh, ksh, and resh.)


    bin A directory where executable files are kept.


    Bourne-again shell (See bash.)


    BSD Berkeley Software Distribution. A UNIX originating at the University of California
    at Berkeley.


    buffer An area of memory that stores temporary values.


    C The programming language. C is often used to build operating systems. Windows
    was written in C and so was Microsoft Windows.


    shell A command interpreter for UNIX with syntax that resembles the C programming
    language.


    C++ A powerful, object-oriented programming language (created by Bjarne Stroustrup)
    and a close cousin to C.


    case sensitivity A condition where the system differentiates between uppercase
    and lowercase letters.


    cat A UNIX command designed to concatenate files. You use the cat command to display
    a file''s contents. For example, to view the file.txt, you use the command letter.txt.
    UNIX responds by displaying the contents of letter.txt.


    cc The UNIX compiler, cc is used to generate executable applications from raw
    source code.


    cd The command is used to travel from directory to directory. For example, to
    change your working directory to /usr/x11, you would use the command cd /usr/x11.


    CGI Common Gateway Interface. CGI is a programming standard that allows web (WWW
    browsers) to send and receive data.


    chfn You use cfn to change your finger information. (This is the information that
    appears when someone fingers you.)


    chmod A UNIX program used to change the permissions on a file.


    client Software designed to interact with a specific server application. For example,
    WWW browsers such as Netscape Communicator and Internet Explorer are WWW clients.
    They are specifically designed to interact with Web or HTTP servers.


    369'
