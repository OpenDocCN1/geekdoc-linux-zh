    # Real Trouble: You Downloaded Source Code


    On the other hand, perhaps you downloaded source code instead. This might not
    be a problem—it depends on your specific configuration, as you''ll see later.
    However, one thing you will need regardless of what version of UNIX you use is
    a compiler.


    # Do You Have C?


    As noted earlier, most UNIX programs are written in the C programming language.
    To compile these programs, you must have a C compiler installed on your local
    network (preferably your local disk drive). To find out whether you have a C compiler,
    you can take several steps. One is to ask your system administrator. However,
    because system administration folks are generally busy, you should probably conduct
    your own investigation first. To do so, issue the following commands:


    +   - cc—This attempts to run the generic C compiler.

    - gcc—This attempts to run the Free Software Foundation''s C compiler.

    - whereis cc—This attempts to find the C compiler.


    > If none of these commands produce results, you might not have a C compiler.
    How can this be? There could be several reasons. Your particular UNIX distribution
    may be a commercial version. Many UNIX vendors sell their C compiler software
    separately at premium prices. (Some charge as much as several thousand dollars
    for a full development package.) However, today, this practice is becoming less
    and less prevalent. Instead, it''s more probable whoever installed the system
    didn''t install the compiler option. To remedy that, you can either install the
    compiler yourself (check your manuals) or have your system administrator do it.


    ![](img/b0bfb2d724c393178bf462832858a65d_159_0.png)


    # Finding the Magic Words


    On the other hand, if you find C (the compiler) has been installed, you''re well
    on your way. The next step, is to determine what commands are needed to install
    the software. For this, you must check the README and INSTALL file.


    For example, there''s a good chat client for UNIX called to-talk. to-talk comes
    in source form and needs to be compiled. When you first unpack the-talk


