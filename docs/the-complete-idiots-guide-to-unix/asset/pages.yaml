    +   * The user''s login ID

    * The user''s password (in encrypted form)

    * The user''s ID (or UID), a numeric value to identify the user

    * The user''s group ID (or GID), a numeric value to identify the group user belongs
    to

    * The user''s real name

    * The user''s home directory

