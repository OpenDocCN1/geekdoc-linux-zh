  md: '# Problems Booting from a CD-ROM


    If your system is supposed to boot from a CD-ROM but fails, there could be several
    reasons, including the following:


    +   You have hardware that''s improperly configured or faulty.


    +   You failed to specify the correct boot command.


    +   The CD-ROM drive or CD-ROM media is not bootable.


    Let''s quickly cover each problem.


    Improperly Configured or Faulty Hardware Many hardware problems are minor and
    are easy to fix. For example, your problem may be nothing more serious than this:
    The CD-ROM drive''s cable has been loose or disconnected. To eliminate this possibility,
    check to see that the cable is properly attached.


    This procedure is can vary slightly depending on whether you have an internal
    or external CD-ROM drive. Basically, though, each case involves perseverance.
    Trace the wires from the CD-ROM drive to its controller and reconnect (or connect
    correctly).


    On the other hand, if this is the first time you''ve tried booting from a CD-ROM
    (maybe you''ve assembled the box), check for termination problems or SCSI ID conflicts.
    Often, SCSI CD-ROM drives are not self-terminating. To find out, check the CD-ROM
    vendor''s manual. Also, be sure to check whether other devices occupy the same
    ID as the CD-ROM. If so, change the SCSI ID of those devices.


    Bad Boot Commands or Command Parameters Still another problem occurs when the
    CD-ROM boot procedure is interactive and you''ve specified the wrong directory,
    the wrong command, or the wrong command parameters. Check your vendor''s documentation
    to discover exactly which directory to boot from (if any) and the command necessary
    to do so.


    The CD-ROM Drive or CD-ROM Media Isn''t Bootable It''s possible that either the
    CD-ROM drive or CD-ROM media is not bootable. In the first case, a simple solution
    may exist. If the CD-ROM is SCSI, there''s a strong chance that it''sable but
    the option to boot from the CD-ROM hasn''t been enabled. This is a common scenario
    on PCs with SCSI adapters.


    To find out, reboot your machine and engage your SCSI adapter''s setup program.
    (Most PC-compatible SCSI drives have embedded software software for configuring,
    calibrating, and even formatting SCSI drives. For example, if your adapter was
    manufactured by Adptec, you can access these by entering the Ctrl+a keystroke
    combination with maine boots.). Then, you can view booting options. It''s possible
    that bootable CD-ROM support has been disabled. If so, enable it.


    Finally, if your CD-ROM drive is bootable but your CD-ROM media is not, the only
    solution is to obtain another CD-ROM that is.'
