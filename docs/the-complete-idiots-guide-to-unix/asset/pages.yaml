  md: '# Introduction


    Welcome to The Complete Idiot''s Guide to UNIX! In just a few moments, we''ll
    delve into the inner workings of UNIX. Whether you purchased this book out of
    sheer curiosity or because your boissed UNIX upon you, you''ll be well on your
    way to full-fledged UNIX geekdom.


    In particular, I''ve taken pains to demystify UNIX and redeem its undes reputation
    for being difficult to learn. As you''ll soon read, UNIX is based on fundamental
    principles—principles you''ve probably encountered in Microsoft Windows or Mac
    OS. (In fact, the technologies on Windows and Mac OS are originated with UNIX.)


    To get you started, let''s look briefly at how this book is constructed.


    # What''s in This Book


    This book is broken into seven parts that follow a developmental path. In other
    words, each part addresses slightly more complex topics than the previous part.
    The book opens with an explanation of how to boot your system; then it quickly
    progresses to file manipulation, installation of applications, and finally, system
    administration.


    Let''s quickly look at what each section contains.


    # Part I: Just the Basic Facts


    The two chapters in Part I contain the basics, including a description of how
    UNIX came about, who uses it, and what they use it for. Also included is a special
    section that covers Linux—the hot, new UNIX-like operating system available for
    PCs.


    # Part II: Nuts and Bolts


    Part II contains eight chapters that explain how to start a UNIX system and what
    to expect when you do. UNIX works a little differently than other operating systems
    because it has more stringent security controls. Beyond this, Part II covers essential
    topics as the following:


    +   * Booting your system

    * Logging in and finding other users

    * Using the various shells

    * Navigating directories and files

    * Searching

    * Opening and editing files'
  merge: -1
  pgno: 24
- img_proc: true
  md: '+   * Managing permissions

    * Adding users

    * Assigning groups'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Part VI: Troubleshooting


    Refer to Part VI whenever disaster strikes. (Just kidding.) The chapters in Part
    VI cover many mistakes you''ll make and error messages you''ll encounter. This
    is an important section because UNIX error messages are quite often cryptic. Here
    you''ll find the-lowing items:


    +   - A discussion of common mistakes and how to avoid them

    - An error message table


    # Part VII: Reference


    Finally, the appendices in Part VII cover a wide range of commands and techniques
    for getting things done. Points of interest include the following:


    +   - A command reference containing 94 common UNIX commands and examples of how
    to use them

    - An online resource directory of WWW sites with hundreds of cool utilities and
    tutorials on running a UNIX system

    - A glossary titled "Speak like a Geek: The UNIX Bible," which demystifies the
    many terms you''ll encounter in this book (as well as in UNIX)


    Because of this book''s design, you can use it either as a reference (reading
    isolated sections whenever you''re stuck) or as a general UNIX primer.


    If this book has any advantage over its competitors, it''s this: Many beginner
    books describe only basic commands and their barest usage. For example, authors
    explain how to start an editor but not to use it. This approach is quite ineffective
    (and it''s particularly ineffective when discussing a complex operating system
    as UNIX).


    In contrast, The Complete Idiot''s Guide to UNIX provides practical and detailed
    examples of the commands discussed. This way, when you start a UNIX application,
    you''re not hung out to dry.


    # What Are You Looking At?


    When reading this book, you''ll encounter several different fonts. These fonts
    are used to demonstrate commands, system output, and variables. Here are the fonts
    and what they mean:


    +   - Standard output (from UNIX) appears in monospace font.

    - Commands appear in monospace bold font.

    - Placeholders appear in italic monospace font.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '+   - New terms appear on *italic* font the first time they''re used.

    - The icon indicates that a code line was wrapped. Certain lines are so long that
    they won''t fit on a printed page. Therefore, when typesetting this book, the
    printers are forced to wrap the line (that is, extend part of it to the next line).


    # # One More Thing


    Every effort has been made to provide the very widest treatment of the UNIX operating
    system. On that account, the information in this book is largely generic and therefore
    applicable to nearly all UNIX flavors.


    In rare instances, however, I discuss commands that are available only on certain
    UNIX platforms. Whenever I discuss such commands, I clearly indicate on which
    platforms the commands will work. (Typically, these commands are Linux centric.)


    In closing, I hope you find this book useful and informative. With that said,
    let''s get started. We''ll begin with the question a lot of folks have been asking
    lately: What is UNIX, anyway?'
