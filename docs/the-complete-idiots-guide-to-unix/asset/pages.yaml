  md: '# Chapter 11


    ![](img/b0bfb2d724c393178bf462832858a65d_164_0.png)


    # # Tyrannosaurus X: A Windowing System


    +   ### In This Chapter

    - The X Window System

    - Window managers

    - The Common Desktop Environment (CDE)


    Up until now, this book has probably confirmed your worst fears—namely that UNIX
    is a largely text-based operating system. In this chapter, you''ll get a reprieve
    from that rather intimidating world and discover that UNIX, too, has a windowing
    system.


    Indeed, contrary to what you may have heard, UNIX can be extremely user-friendly.
    In this chapter, we will examine the windowing system for UNIX and how it developed.


    # ## About Window Systems in General


    As I mentioned in Chapter 1, “I Thought UNIX Lived in Harems,” windowing systems
    have been with us a relatively short time—since 1972, in fact. (Xerox tested the
    first real prototype of a windowing system in 1972.) Since then, windowing systems
    have done more to bring computing to the average public than any other single
    innovation. There''s no secret as to why: Windowing systems make computing easy
    and fun.


    Moreover, windowing systems allow users to perform several tasks at once. For
    example, you can open several word processors at the same time. If one doesn''t
    the type of formatting you''re looking for, you can transfer your text to another
    that that does.'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'Even more important, windowing systems make it possible for you to understand
    the data you''re working with. This is possible through the *visualization* of
    data. To appreciate the power of visualization, check out this table of meaningless
    data:


    # Table of Meaningless and Difficult to Understand Information


    | | 1985 | 1990 | 1995 | 1998 |

    |---|---|---|---|--|

    | UNIX | 30 | 35 | 40 | 50 |

    | Vax | 25 | 30 | 35 | 45 |

    | Windows | 20 | 25 | 30 | 40 |

    | Mac | 15 | 20 | 25 | 35 |


    Imagine going through this stuff, column after column, page after page. After
    a while, your eyes would ache. On the other hand, if you use a visualization tool
    (in this case, a charting program), the data is easier to understand and far more
    visually inviting. Take a look at the same data illustrated visually in the following
    figure.


    A chart of equally meaningless data.


    ![](img/b0bfb2d724c393178bf462832858a65d_165_0.png)


    Quite a difference, right? Most windowing systems are all about visualization.
    For example, in Microsoft Windows and Mac OS, drives and other devices are represented
    by icons that resemble the actual tools you''re working with (in other words,
    CD-ROM devices are represented by CD-ROM icons, and so forth)


    By designing their windowing systems this way, software manufacturers hope to
    make their systems *intuitive* (that''s another way of saying that complete idiots
    can easily guess how to perform a task, simply by looking at the icons on their
    desktop).'
