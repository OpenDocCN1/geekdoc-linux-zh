- img_proc: true
  md: '# Chapter 15 > Help!


    view those man pages? Instead, why not automate the entire process? To do so,
    enter the following command:


    ```

    man -k password | grep NIS | awk ''{system ("man " $1)}''

    ```


    That''s one crazy command line! What does it do? Well, here are the steps involved:


    +   1. man gets all page listings on commands that deal with passwords.


    +   2. grep discards listings except those relevant to NIS.


    +   3. awk grabs those names and runs on them.


    The end result is that man automatically loads man pages for both ypasswd and
    ypasswd-wdd.


    ![](img/b0bfb2d724c393178bf462832858a65d_226_0.png)


    # Man, That''s a Lot of Data!


    In the example for automating man, awk causes man to execute twice (once for each
    match). Therefore, when you''re finished reading the man page for ypasswd, man
    will automatically load the man page for ypasswd-wdd. This holds true no matter
    how many matches you receive, so be careful when you structure your search string.
    If you use terms that are too general, man might load 20 man pages or more.


    Finally, you can also redirect man output to a file for later viewing, like this:


    ```

    ypasswd > password_man.txt

    ```


    However, note that man pages often contain control characters for formatting.
    This will show up in some editors, making the text difficult to read.


