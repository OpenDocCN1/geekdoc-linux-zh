  md: '# Part 6 ➤ Troubleshooting


    # Is a Directory


    You receive the Is Directory error when you try to delete a directory using rm
    but UNIX cannot complete the task. (rm is designed for deleting files.)


    This problem is easily solved: Use rmdir instead.


    # Nothing Appropriate


    You receive the Nothing appropriate error when you issue an apropos or man -k
    command looking for relevant manual pages, but UNIX cannot find any that apply.


    Try shortening your search string or reforming your query. For example, if you''re
    searching for man entries related to printing, try several combinations, as these:


    +   - man -k printing

    - man -k printers

    - man -k printer

    - man -k print


    Additionally, sometimes you can find what you''re looking for by examining man
    pages similar commands. Every man page ends with a list of commands that are related
    to the current command. For example, the ip man page also refers to many other
    man pages, including the following:


    +   - postprint

    - pr

    - lpadmin

    - lpfilter

    - lpforms

    - lpsched


    It''s also possible that no documentation exists for the command you want.


