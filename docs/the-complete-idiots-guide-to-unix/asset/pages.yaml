    # Why Is Hypertext so Hyper?


    Hypertext is the text display format commonly used on Web pages. Hypertext is
    distinct from regular text because it''s interactive. In a hypertext document,
    when you click or choose any highlighted word, other associated text appears.
    This allows for powerful cross-referencing and document navigation. Today, many
    UNIX systems are based on hypertext.


    # The Evolution of man: TkMan


    Above and beyond true hypertext, other advances have been made to make pages more
    easily accessible and user friendly. One excellent effort in this area is TkMan,
    a tool that allows you to access pages through a graphical browser. (See the following
