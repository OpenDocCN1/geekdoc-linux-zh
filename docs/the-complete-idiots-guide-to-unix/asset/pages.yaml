    look at those now.


    # Generic X Options


    As mentioned earlier, most X applications behave in a similar fashion. In keeping

    with this, most X applications also accept basic command-line options. These options

    allow you to manipulate your application''s look and feel. These options are briefly

    summarized in Table 13.3.


    # Table 13.3. Generic X Options


    | Option | Purpose |

    | -bg color | Use the -bg option to set the background color of the specified
    application. For example, to start tetris with a gray background, issue the command
    tetris -bg gray. Use this option cautiously. For example, prior to setting the
    background color, make a test run of the application first. Make sure you don''t
    set the background color to the same color as the foreground. Otherwise, you''ll
    be unable to see the foreground at all. (For example, Xterms generally have a
    black foreground for text. If you set the background color to black, you''ll be
    unable to see the text.) |

    | -display host display | Use the -display option to specify the X server on which
    to run the application. Note that host display doesn''t have to be the X server
    on your own machine. It could very well be on someone else''s machine. For example,
    consider this command: tetris -display wagjag:. This will start an instance of
    tetris (an X version of the popular game Tetris) on the first X server on wagjag,
    a remote host. |

    | -fg color | Use the -fg option to set the foreground color of the specified
    application. |

    | -fn font-name | Use the -fn option to set the specified application''s font.
    |'
