  md: '# Part 3 > Working in the UNIX GUI


    # Getting More for Less


    As an interesting side note, the Linux community (known to be radical and revolutionary)
    got quite worked up about the high-priced Motif. In response, (as they have done
    so many times before), Linux developers created a free alternative. What did they
    call it? Leststif.


    # The Common Desktop Environment (CDE)


    The Common Desktop Environment has become an industry standard on many commercial
    UNIX distributions. Based largely on Motif, CDE provides a desktop environment
    that looks and operates identically on all supported UNIX flavors.


    The look and feel of CDE is also very clean, as you can see in the following figure.


    A typical CDE window.


    ![](img/b0bfb2d724c393178bf462832858a65d_171_0.png)


    Additionally, CDE-based systems are more user-friendly. They generally have very
    powerful and easy-to-use help applications that are based on hyperlinked documents.
    This allows you to navigate help systems in a more-or-less aim manner without
    regard for where you start or stop.


    The downside to CDE is that it''s a commercial product and quite expensive. To
    learn more about CDE, check out the OpenGroup''s Web site, located at http://www.camb.opengroup.org/tech/desktop/cde.


