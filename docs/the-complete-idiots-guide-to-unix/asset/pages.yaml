  md: 'Additionally, some Sun keyboards have sound controls located in the upper-right
    corner. (These are easily recognizable from their icons. They look like speakers.)


    In all other respects, you''ll find that your keyboard behaves no differently
    than a PC keyboard.


    # Different Mouse Types


    If you''ve ever used a mouse before, you''ll have little trouble using one in
    X. Most UNIX systems support standard mechanical mice. These are similar (and
    in certain cases, identical) to PC mice. However, there''s one exception: the
    optical mouse.


    Optical mice are different from standard mechanical mice in several ways. First,
    they''re constructed differently. Optical mice, for example, don''t rely on balls
    to track their position. Instead, optical mice read patterns from the mouse pad
    using infrared light. (Mouse pads for optical mice are generally made of metal.
    Metal surface has fine patterns in that the mouse can interpret and translate
    into mathematical coordinates to reflect its position. This is why optical mice
    do not track balls.)


    Particularly on older optical mice models, you may find that the mouse is not
    sensitive as a PC mouse. (In other words, you may have to exert more effort to
    move the cursor across the screen. This can sometimes lead to peculiar medical
    conditions, such as “optical mouse elbow.\) There are solutions to this:


    +   - Replace the optical with a mechanical mouse

    - Get a mouse pad with finer patterns


    You can also manipulate your mouse settings. Upping your mouse''s acceleration
    and speed will help tremendously.


    # The Mouse and X


    For the most part, your mouse will behave the same in X as it does in other GUIs.
    As you move your mouse across the mouse pad, your mouse cursor moves across the
    screen. You select items by moving your mouse cursor over and clicking one of
    the mouse buttons. In this respect, using a mouse in X differs little from using
    a mouse in Microsoft Windows or Mac OS.


    However, there are some subtle differences in X functionality. For example, in
    X, you can use a three-button mouse, and each button can have a different function.
    In most X window managers, for example, you can resize a window by grabbing a
    border with the left mouse button and dragging it. However, if you perform precisely
    the same action with the right mouse button, the window will move instead.


    Additionally, some window managers allow you to summon menus by clicking empty
    portions of the screen. (In other words, if you click an area that doesn''t contain
    a window, a menu will appear.) Different menus will appear depending on which'
