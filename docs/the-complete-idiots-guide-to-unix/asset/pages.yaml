  md: '# Chapter 12 > Point and Clique


    # Moving a Window: The Title Bar


    The title bar serves three purposes:


    +   - It reports the name of the current application.

    - It allows you to grab focus (something we''ll discuss momentarily).

    - It allows you to move the window.


    You can use the title bar to move a window around the screen. To move a window,
    perform these steps:


    +   1. Place your mouse over the window''s title bar.

    2. Hold down the left mouse button.

    3. Drag the window to your desired location.

    4. Release the left mouse button.


    While you''re moving the window, it will disappear. The only thing you''ll see
    is the border as it moves across the screen. Don''t be alarmed; that''s exactly
    what it''s supposed to do.


    In many window managers, as you move the window, a tiny window will appear at
    the bottom of the screen. This tiny window reports the coordinates of the window
    you''re moving. Personally, I''ve never figured out the advantage of this (other
    than to demonstrate that the programmer can track the movement of that window).
    However, it''s moderately amusing.


    ![](img/b0bfb2d724c393178bf462832858a65d_180_0.png)


    > Warning: Don''t Become a Fashion Victim


    Maybe you''re thinking about spong up your desktop. Perhaps you''d be like a black
    background. If you''re new to UNIX, don''t do it! Until you learn how to manipulate
    window colors, having a black desktop can be fatal. Here''s why: While a window
    is moving, its border is black. If you change your desktop to black, the borders
    will be invisible. Therefore, when you move a window, you''ll have no way of knowing
    where it will end up (because you can''t see it.)


    # When Size Really Does Matter: The Border Control


    You''ll undoubtedly be faced with many instances when the current window is either
    too big or too small. To remedy this, you can resize the window.


    You resize a window by grabbing its border and either stretching or shrinking
    the window to suit your needs. To resize a window''s height, perform the following
    steps:


    +   1. Place your mouse over the window''s top or bottom border.

    2. Grab the border by holding down the left mouse button.


    157'
