  md: '# Chapter 12 ➤ Point and Clique


    At this point, your mouse icon will change, and any movement you make will affect
    the window. (For example, if you choose Move and subsequently move your mouse,
    the window will move with it.)


    # Breaking Windows


    Whenever a window outgrows its usefulness, you''ll want to get rid of it. To do
    so, you can take several measures:


    +   * Exit the application

    * Use the window menu to close or delete the window

    * Kill the application or window


    Let''s take a look at each method.


    # Exiting the Application


    In most cases, application windows will willingly leave without much resistance.
    To banish them from your site, simply terminate the application. (For example,
    you can destroy an Xterm window by typing exit at the prompt. Also, many X applications
    have a File menu with Exit or Close as an option. Use your mouse to pull down
    the menu to choose the appropriate action.


    # Using the Window Menu


    Some windows are more stubborn. (They just''t know when to quit.) In this case,
    you must forcibly remove them from the premises. To do so, pull down the window
    menu and choose either Close or Delete. If this will send the stubborn window
    packing.


    # Killing the Application or Window


    In rare instances, a window will persist after you exiting the application by
    using the window. If you encounter this situation, no mistake, you''re being stalked
    by a belligerent window.(The FBI estimates that two out of every five X users
    are likely to fall victim to a window-stalking attack during their lifetime.)
    The solution is to sneak behind the offending window and smash it on the head
    with a rubber mallet. To do, follow these steps:


    +   * Open an Xterm window to get a shell.

    * Get a process listing using ps.

    * Find the offending window''s process ID number.

    * Type kill process_id_number.


    161'
