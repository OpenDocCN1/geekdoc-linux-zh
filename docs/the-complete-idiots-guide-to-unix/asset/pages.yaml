  md: '# Netscape Navigator and Communicator


    Netscape Communications Corporation

    501 E. Middlefield Road

    Mountain View, CA 94043

    http://home.netscape.com


    Netscape Communicator and its earlier incarnation, Navigator, are both excellent
    Web browsers. In addition to being up-to-date (they support most new technologies),
    these browsers have several, important amenities:


    +   * Integrated email and USENET news—Navigator and Communicator both have built-in
    mail and news clients, allowing you to see and receive messages without leaving
    the application.


    +   * Integrated document editors—If you get a sudden urge to develop your own
    Web page, Navigator and Communicator can fix you right up. Both applications have
    built-in HTML editors, allowing you to build your own Web page locally or for
    use on another server.


    +   * Prefabric bookmark files—Netscape''s packages come with bookmark files.
    These have endless links to cool Web sites in a dozen categories, including business,
    finance, entertainment, education, sports, shopping, and leisure. (Why search
    when Netscape''s already done all the work?)


    Furthermore, Netscape Communicator''s interface is extremely user friendly. (See
    the following figure.)


    ![](img/b0bfb2d724c393178bf462832858a65d_267_0.png)


    244'
