  md: '# Sending a Single Line of Text to Disk: the echo

    Command


    For very simple tasks, you may not even require a text editor. Here is an example:

    Suppose you have a plain text database of department telephone numbers (we''ll
    call it phone.txt). Each line is a record, and fields are separated by commas,
    like this:


    +   - Susan, Marketing, Room 200, 555-5555

    - John, Production, Room 204, 555-5556


    The fields are for name, department, room, and telephone number. To add a single

    record, you don''t need a text editor. Instead, you can use the echo command to
    save

    time, like this:


    ```

    echo "Bill, Programming, Room 210, 555-5557" >> phone.txt

    ```


    This command appended the quoted text to phone.txt. The result is phone.txt now

    looks like this:


    +   - Susan, Marketing, Room 200, 555-5555

    - John, Production, Room 204, 555-5556

    - Bill, Programming, Room 210, 555-5557


    Pretty nifty, but not practical for large tasks. In this section, we''ll look
    a a whole

    lew of editors (ranging from primitive to sophisticated) and what they can do
    for

    you.


    # Big ed


    The most primitive text-editing tool in UNIX is called ed. ed is most useful when
    you

    need to add just a few lines of text to a file. (In other words, you''re really
    busy with

    other things and need an instant solution.) To start ed, enter his name at the
    prompt,

    followed by the filename you intend to create, like this:


    ```

    ed textfile

    ```


    ed will respond by opening textfile and waiting for your command:


    ```

    ?textfile

    ```


    At this point, you want to enter some text. To do so, you first tell ed that you''ll
    be

    appending text to textfile. You do this by entering the letter a (short for append

    mode) on the command line:'
