    ```

    sysadmin::14:

    nobody::60001:

    noaccess::60002:

    nogroup::65534:

    ```


    # After You Edit the Password File: Creating Home Directories


    Once you add the user to the passwd file, the next step is to create his or her
    home directory. This is typically a subdirectory of /home. For example, for user
    bwagner, the home directory is /home/bwagner. (You can make any directory home,
    but making it /home/username is a good idea. This way, when you need to automate
    a system administration task, you can do so wholesale to all users in the /home
    directory hierarchy.)


    # Finishing Up


    Finally, once you''ve added the user to /etc/passwd and created his her home directory,
    you should set his or her initial login password. This is done with the passwd
    command, like this:


    ```

    passwd bwagner [some-password]

    ```


    passwd will prompt you for verification and then commit the new password to the
    passwd database. That''s it! You just created a new user.


    # Token Passwords


    Newer UNIX distributions usually have special tools for adding new users. Therefore,
    it is all likelihood, you''ll never have to follow the previous procedure. If
    you do, there''s a tip: Many UNIX systems do not store the encrypted password
    in /etc/passwd. Instead, this password is replaced by a token. For instance, examine
    this sample password file:


    ```

    root:x:0:0:Super-User:/bin/sh

    daemon:x:1:::

    bin:x:2:2:/usr/bin:

    sys:x:3:3:::

    adm:x:4:4:Admin:/var/adm:

    lp:x:71:8:Line Printer Admin:/usr/spool/lp:

    smtp:x:0:Mail Daemon User::/

    uucp:x:5:5:uucp Admin:/usr/lib/uucp/

    nucp:x:9:9:uucp Admin:/var/spool/uucpublic::/usr/lib/uucp/uucico

    listen:x:37:4:Network Admin:/usr/net/nls:

    nbody:x:60001:60001:Nobody/:

    ```


