- img_proc: true
  md: 'As you can see, X developers have traditionally been more concerned with moving
    data over networks than the visualization of that data. For them, the graphical
    user interface could look relatively generic as long as it could reliably network
    data and present it in graphical form. For this reason, you''ll soon discover,
    X applications are often simplistic in appearance. Don''t let that fool you, though.
    X is a complex and powerful windowing system.


    # # The Windowing System That Launched a Thousand Chips


    In addition to networking capabilities, X developers were also concerned with
    platform and hardware constraints. For example, many windowing systems (such as
    Microsoft Windows, OS/2, and Mac OS) run only on a handful of chips and systems.


    To avoid such limitations, X developers made their design as “architecture neutral”
    as possible. Therefore, X servers and clients run on all the following systems:


    +   * Microsoft Windows 95 and NT

    "* Mac OS

    "* UNIX

    "* VMS"


    This means that X runs on almost every available processor chip, including Intel,
    Alpha, PowerPC, and garden-variety RISC. Indeed, X could conceivably run on other
    systems as well, because X is highly portable (the core of X is written in the
    C programming language, and official X development follows fairly strict standards
    and guidelines).


    # # The Windowing System with a Thousand Faces


    With all the work that X developers put into making X a malleable, portable system,
    they admittedly neglected X''s appearance (that is, until recently). In fact,
    no real standards have been developed in this regard. Therefore, X can look very
    different from other systems.


    This is in sharp contrast to Mac OS and Microsoft Windows, which both conform
    to very rigid (though perhaps proprietary) standards in terms of appearance. These
    standards reach to the very core of their respective graphical user interfaces.


    X''s appearance depends solely on the window manager you''re using. Let''s talk
    about window managers for a moment.


    144'
