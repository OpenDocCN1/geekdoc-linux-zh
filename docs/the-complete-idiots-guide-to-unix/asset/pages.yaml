    # About Colors, Keys, and Things


    Will an application behave the same way in Xterm as it would when executed from
    a command line? Maybe. depends on how thorough the developer was. Often, applications
    that have extensive color schemes from a command line appear rather bare bones
    when run through an Xterm.


    Additionally, command-line applications have odd key bindings (that is, the rules
    governing what function key does). These key bindings might not work when funneled
    through an Xterm. There are several reasons for this: The most common reason is
    that the application''s key bindings conflict with basic X bindings. In cases,
    X key bindings will naturally take precedence. If the key bindings are essential
    to the program''s operation (and X doesn''t accommodate them), it''s best to run
    the application from the shell, not in X.


    # Launching Applications from an Xterm


    Another way to run applications in X is to launch them from an Xterm. This is
    simple enough. Open an Xterm and execute the application. For example, to launch
    ftptool from an Xterm, open an Xterm and execute the issue ftptool command at
    the Xterm shell prompt, like this:


    ```

    ftptool

    ```


    In response, X will launch ftptool. (See the following figure.)


    ![](img/b0bfb2d724c393178bf462832858a65d_198_0.png)


