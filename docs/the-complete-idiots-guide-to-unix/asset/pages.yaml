    button you click. For example, if you click the main desktop with your right mouse
    button, an application menu will appear. If you click the middle button, a window
    manipulation menu will appear. Finally, if you click the left mouse button, a
    tool menu will appear.


    ![](img/b0bfb2d724c393178bf462832858a65d_177_0.png)


    # Mouse Buttons


    Different Strokes for Different Folks


    All window managers support three-button mice. However, not all systems ship with
    three-button mice. Don''t feel left out. In most cases, functions that are available
    from the middle button are also available through other means.


    I''d like to tell you that X window managers behave the same, but that''s not
    true. To find out which are available to you, try clicking the empty desktop with
    all three mouse buttons (or two, if that''s what you have). By doing this, you
    can immediately determine what menus are available.


    On Linux systems, developers have an interesting approach to the two-button mouse.
    They have developed three-button mouse functionality for two-button mice through
    a technique they call chording. In chording, you can simulate a three-button mouse
    event by clicking the right and left mouse buttons simultaneously.(The effectiveness
    of this technique is debatable. Some folks find chording difficult because it
    demands fairly precise coordination. If you see a coworker using X and he''s smashing
    his mouse against the table, he may be trying to master this subtle technique.)


