  md: '# Chapter 20


    ![](img/b0bfb2d724c393178bf462832858a65d_292_0.png)


    # # Chatting


    +    In This Chapter

    * Types of chat systems

    * Chatting one-on-one on your own machine or network

    * Chatting with the world at large

    * Some gentle words of caution


    The USENET news network is great for bulletin board-type discussion, but it lacks
    a certain interactivity. Sometimes, you post a news message and folks don''t answer
    it for hours or even days. Email is not much different. Therefore, when you''re
    craving some interactive conversation, it''s time to chat. That''s what this chapter
    is all about.


    # ## What Is Chatting, Anyway?


    Chatting is the process of holding a real-time conversation using your computer.
    Instead of actually speaking, however, you type out your sentences using the keyboard.
    Similarly, the person or persons you''re chatting with respond by typing out answers
    on their keyboard.


    Chat systems differ in design. Some are truly real-time chat systems; therefore,
    you see the words appear as they are typed. (That is, you can see each letter
    appear one by one.) Other chat systems are almost in real-time, only displaying
    words after an entire sentence has been typed and transmitted. However, nearly
    all chat systems display words within seconds.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# Chat System Types


    Here are the three basic chat system types:


    +   - Localized chat systems—Allow you to chat with anyone on the same network.
    These are typically used in corporate or academic environments.

    - Closed chat systems—Allow you to chat with other authorized users. These chat
    systems deny access to outsiders.

    - Open chat systems—Allow anyone from any host to participate.


    In addition, chat systems can be either “one on one” (you can only chat with one
    person) or multipiphased (you can chat with dozens or even hundreds of other folks
    simultaneously).


    Finally, there are two classes of chat system: proprietary and nonproprietary.
    In proprietary chat systems, some special software (usually a commercial chat
    client or plug-in) is required. In nonproprietary chat systems, any garden-variety
    chat systems,


    ![](img/b0bfb2d724c393178bf462832858a65d_293_0.png)


    In this chapter, I discuss mainly one-on-one and multipiphased chats on both local
    and global networks.


    # Twenty-first Century Talks


    Interestingly, the more antiquated chat networks and systems are now being abandoned
    by all but the most zealous supporters. Nowadays, it''s possible to funnel chat
    through a Web page using advanced technologies such as Java. Therefore, older
    chat systems will probably fade into obscurity in the next few years.


    # Chatting One on One with talk


    Not surprisingly, UNIX has a built-in one-on-one chat system. This system is called
    talk. To talk with another user on your machine, issue the talk command like this:


    In response, UNIX will notify you that it''s the pager:


    > [Waiting for your party to respond] -


    Meanwhile, the desired user''s terminal will display a message similar to:


    ```

    Message from TalkDaemon@207.171.0.111 ...ntalk: connection requested by chatme@207.171.0.111.

    talk: respond with: talk chatme@207.171.0.111

    ```


    This message tells the user who it is who wants to talk, where this person is,
    and what command must be entered to initiate a chat session. In this case, based
    on example, you would type the following command:


    ```

    talk chatme@207.171.0.111

    ```'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'This connects you with chatme. At this point, your screen splits in half with
    a line down the middle. Words typed by you appear above the line; words typed
    by your chatting partner appear below it. In this split screen, words are transmitted
    in real-time, letter by letter.


    talk is a pretty fast and efficient way to chat. On local area networks (where
    messages are connected via Ethernet), the lag time is so negligible that it''s
    actually unnoticed. This is not true over standard dial-up or PPP connections.
    (Of course, much depends on other traffic being sent down the wire. Given a quiet
    night where you and your chatting partner are the only folks using the network,
    talk can be pretty fast.)


    Like most UNIX network utilities, talk works not just locally but over the Internet.
    Therefore, you can talk with users located elsewhere in the world. To do so, issue
    the talk command plus the full email address of the person you want to chat with,
    like this:


    ```

    talk bwagner@pacific.net

    ```


    On the end, the remote user responds with a talk acknowledgement and, for all
    purposes, the talk session works precisely as if he were or she were on your network.


    # Internet Relay Chat: The Internet''s Wild West


    Probably the most popular chatting system of all is Internet Relay Chat or IRC.
    Developed in Finland in the late 1980s, IRC is the Internet''s last frontier.
    IRC is a lawless space, where hundreds of thousands of people chat every day,
    unseen and unnoticed by the rest of the world.


    +   - IRC allows multiple users to chat

    - IRC allows users to chat if they wish

    - IRC allows users to transfer files

    - IRC uses a system of channels or groups


    This last fact (the use of channels or groups) is what makes IRC truly unique.
    Here''s how it works: In Chapter 19, "USENET News," I explained that newsgroups
    were broken down into specialized areas of interest. For example, folks who want
    to discuss UNIX would naturally gravitate to comp.unix.


    Similarly, IRC segregates users by their interests using a system called channels.
    Each channel has a permanent name (for example, #unix) that reflects the group''s
    topic of discussion. Such channels are like virtual rooms, separate and distinct
    from other channels.


    271'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# UNIX''s Net Worth


    Because IRC channels transmit discussions in real-time (and because those discussions
    are largely untraceable), IRC is often used for very curious and offbeat purposes.
    Typically examples include the following:


    +   - Citizens of despotic states have used IRC to anonymously report news of
    political upheavals. (for example, reports on political instability in Russia,
    when a coup was apparently underway.)


    +   - American military forces received status reports on (and communicated with)
    their loved ones in Operation Desert Storm.


    +   - Crackers and software pirates use IRC to traffic illegal software and discuss
    intrusion techniques.


    +   - Political dissidents (and according to some intelligence analysts) even
    terrorist groups use IRC to anonymously communicate.


    In all these things, sound pretty way out, but they''ve happened. So, what''s
    the chance of encountering a terrorist in IRC? Almost nil, and here''s why: Folks
    with unlawful intent don''t use standard, established chat channels. Instead,
    they create their own. (We''ll get to that in a minute). Therefore, their presence
    is hardly felt on IRC at large.


    Instead, most folks use IRC just to shoot the breeze, and they typically do this
    in established channels. In fact, more than 30,000 IRC channels exist on a permanent
    basis. The greater number focus on perfectly "normal" subjects.


    Equally, however, there are more challenging channels, where folks express some
    rather unpopular views. When you first use IRC, you may be shocked. As I indicated
    earlier, there are no real rules. In this respect, IRC is the ultimate free speech
    frontier.


    # Using IRC


    Many different IRC clients are available for UNIX. However, the greater number
    for Linux. These range from primitive (regular command-line IRC), to sophisticated
    (ksire, a GUI-based client), to the eclectic (a Perl-based IRC client).


    In the end, though, the most popular and generic IRC client is still ircii, a
    command-line IRC that runs on almost any UNIX system. Because ircii is widespread,
    I''ll concentrate on it here.


    To start ircii, issue the following command:


    ```

    irc

    ```


    Immediately, you''ll know if IRC is available on your system. (Some system administrators
    refuse to install IRC because it poes security and administrative risks. Many
    would rather not have the hassle.)


    272'
