- img_proc: true
  md: '# Chapter 24 ► The 20 Most Common Error Messages and Their Causes


    Also, some software developers (although admitted few) dispense with the man system
    altogether. Instead, they provide their documentation in PostScript, HTML, or
    PDF formats. If you can''t find a man page file, try looking for documentation
    in the other formats.


    Finally, if these approaches fail, the man page might have never been installed.
    In this case, check your system administrator.


    # Host Name Lookup Failure


    You received the Name lookup failure error because you told UNIX to contact an
    Internet host but that host was unreachable. Possible reasons include these:


    +   - You forgot to provide a name address.

    - Your machine is not connected to the Internet.


    First, check that you''ve specified at last one man server in the /etc/resol.conf
    file. (Without a name server, your system will be unable to resolve hosts). If
    your name server configuration is in order, check whether your Internet connection
    is hot. It''s possible that your modem dropped off or a hub on your LAN is down.


    # No Route to Host


    You generally receive the No route to host error because you told UNIX to contact
    an Internet host but that host was unreachable. A possible reason is that your
    machine is not connected to the Internet.


    Check to see whether you''re connected to the Internet. For example, try pinging
    a known host, like this:


    ```

    ping internnic.net

    ```


    # Device or Resource Busy


    You generally receive the Device or resource busy error message because you tried
    to access a device or swap partition that''s already being used.


    If you tried to access a swap partition and received this error, don''t sweat
    it. The swap is already active. (For example, in Linux, swaps are typically activated
    at boot time.)


    If you tried to access a device (such as a modem), a stale process may have locked
    up the device may simply be in use. Check the process list (using ps) to see what''s
    going on.'
