    | Open a file | Choose File from the menu bar. textedit will display a file selection
    window. You choose files in one of two ways. Either use your mouse double-click
    the desired file or type the filename in the File field. |

    | Search for text | Position your cursor at line 1, choose Find (from the menu
    bar) and enter your search term. Then, click Find. Warning: Be careful to choose
