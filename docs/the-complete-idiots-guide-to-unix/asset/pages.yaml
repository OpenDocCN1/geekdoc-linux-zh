  md: '# One Last Thing


    In the following pages, you''ll read that some versions of UNIX are even more
    unique because they conform to certain standards. I''ll briefly mention those
    standards.


    What''s a standard? Well, it''s exactly what it sounds like: an agreed-upon system
    by which all concerned parties conduct their computing. Standards are an important
    part of the business world and here why: Without them, large-scale automation
    cannot be achieved. To understand why, consider this: In Electronic Data Interchange
    (EDI), machines communicate with one another without human interaction. Through
    EDI, many billng and procurement tasks are performed automatically.


    The reason that such systems work is because all machines in EDI speak the same
    language. If they didn''t, the data would get mangled. In a similar fashion, most
    Internet applications conform to certain standards. These standards govern how
    communication is conducted across TCP/IP-based networks.


    Such standards are machine and network-based, and the rules that govern them are
    built into applications. However, there are still other standards that are less
    specific and more sweeping in scope. In the UNIX world, one very important standard
    (the Portable Operating System Interface or POSIX) measures whether a system is
    portable or not.


    Portable is a term that describes any system or software that can easily be migrated
    to another architecture. For example, if you take a program from a S V UNIX system
    and easily rework it to run on a BSD-based system, that program has portability
    (that is, it can be ported from S V to BSD).


    Portability is important, to government agencies because they don''t want to be
    tied to any particular hardware or software. (For example, you can''t take softwarewritten
    for Microsoft Windows and run it on a Mac.) Instead, they want to have the option
    of terminating any vendor''s contract at will. For this reason, government agencies
    favor POSIX-compliant software. This way, when programmers write additional code
    for such systems, it can easily be integrated system wide, no matter what operating
    system they migrate to.


    Standards don''t stand with POSIX, though. Standards exist for everything, including
    styles of programming. For example, the American Standards Institute (ANSI) has
    developed a standard for programming in the C programming language. It''s-called
    you guessed-ANSI C.


    Therefore, in addition to the division of UNIX flavors by S V versus BSD, many
    UNIX flavors also differ in the various standards they support. A good example
    is the Federal Information Processing Standards (FIPS), which govern the way documents
    and encryption processes are conducted. (Even international standards exist, making
    things even more confusing.)


    The UNIX family tree is rich in standards, but the bottom line is still this:
    UNIX systems are based on either S V or BSD. Let''s take a look at these systems.'
