    # Talking awk


    Regular expression searches in awk work very much like those in egrep, except
    awk is\more powerful. For example, not only can awk locate regular expressions,
    it can also

    execute commands based on what it finds.


    Also, xe "awk utility" the awk man page has some good examples and a brief summary
    of awk commands.


    # The Least You Need to Know


    UNIX is a largely text-based operating system and therefore has many power tools
    for

    searching and manipulating text. Here are some simple points to remember:


    +   * Searching for simple text in a file, use grep.

    * If the pattern for which you''re searching is more complex, try egrep.

    * If you need industrial-strength text manipulation, try awk, which can save you

    many hours of heartache, especially when you''re searching through large files

    with mountains of data.

    * To widen or narrow your search, use wildcards and metacharacters as needed.'
