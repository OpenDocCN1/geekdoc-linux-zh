    From this, you can ascertain the following:


    +   * My username is bwagner

    * My password, in encrypted form, is yPf3M5qMglUc

    * My user ID is 101

    * My group ID is 10

    * My real name is Bill Wagner

    * My home directory is /home/bwagner

    * My preferred shell is bash.


    To remove a user, you need only remove his or her entry from the passwd file and
    delete it or her home directory. However, adding a user is a bit more complicated.
    Let''s discuss that now.


    # Adding a User


    The only data in /etc/passwd that can''t be entered manually is the password itself.
    Therefore, to add a new user, edit the passwd file and add the other six values
    by hand. For this, you can use any editor; however, on BSD-based systems, the
