    **Purpose:** man is an interface to UNIX reference manuals. These are typically
    called man pages.


    **Example:** man mail. This will summon the mail man page. (To learn more about
    man, see Chapter 15, "Help!")


    # mkdir


    **Purpose:** mkdir creates the specified directory.


    **Example:** mkdir bozo-mail. This will create a directory called bozo-mail. (To
    learn more about mkdir, see Chapter 6.)


    # more


    **Purpose:** more displays file contents one screen at a time.


    **Example:** more myfile.txt. This will display the contents of myfile.txt, one
    screen at a time. This allows for easy viewing of files that are longer than 40
    lines.


    # mount


    **Purpose:** mount mounts and unmounts file systems.


    **Example:** mount /dev/fd0 /mnt/floppy. This mounts the first floppy drive in
    the directory /mnt/floppy.


    # mv


    **Purpose:** rename renames files.


    **Example:** rename myfile.txt myfile.txt. This renames myfile.txt to yourfile.txt.
