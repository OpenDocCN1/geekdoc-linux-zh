  md: '# Part 2 > Nuts and Bolts


    Seriously, though. Computers don''t speak English; they speak computer language.
    Therefore, when you enter commands, those commands must be interpreted and translated
    by an intermediary. In UNIX, the intermediary is the shell.


    When you issue a command, the shell interprets it and, if necessary, it passes
    that command to other programs or to your operating system. For example, when
    you use the ls command to list your directory''s contents, here''s what happens:


    +   - You type ls and press ENTER.

    - The shell finds ls (located in /usr/bin).

    - The shell runs 1.

    - You receive the output (your directory listing).


    Because shells perform this process (a kind of human-to-machine translation),
    they are called command interpreters.


    If you''ve ever used Microsoft Windows or DOS, you''ve already had experience
    with a command interpreter or shell. In DOS, the shell is COMMAND.COM. You use
    this every time you "shell out" to a MSDOS prompt from Windows.


    No matter what version of UNIX you use, you will use at least one (and possibly
    several) command interpreters or shells. Let''s briefly look at those shells now.


    # Shells


    In the UNIX world, developers are constantly improving the system. (They''re faithful
    folks if nothing else, these UNIX programmers.) As a result, UNIX distributions
    often have a dozen different programs that perform the same task. Shells are no
    exception.


    There are numerous shells and UNIX advocates often argue furiously about which
    shell is best. Does it matter? Maybe. As it happens, some shells perform tasks
    better than other shells do. But don''t worry; all shells are descendants of either
    the Bourne Shell (sh) or the C Shell (csh). Hence, whether you learn one, the
    other, or both, you will be suitably prepared to operate any UNIX system.


    Let''s take a quick look at the shell family tree.


    # The Bourne Shell: sh


    The original UNIX shell was sh, otherwise known as the Bourne Shell. (sh was named
    after its inventor, Stephen Bourne, a programmer at Bell Laboratories.) sh is
    still popular and is available on all UNIX systems, including Linux. You find
    sh in the directory /bin.


