- pgno: 54
  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to www.synergy.com/solutions
    and click on the “Ask the Author” form.


    Q: Why is it necessary for me to secure my Solaris system? I don''t have any data
    that anyone would want to steal.


    A: Not all system cracking is about stealing, and many hackers don''t care at
    all about the specifics of your system beyond it''s Internet connection. Some
    attackers want to steal your bandwidth to distribute pirated music and software,
    while others are just trying to impress their friends. If your systems are connected
    to the Internet they will be attacked; it''s only a matter of time. Most of these
    attacks are likely to come from inexperienced attackers who are easily averted
    if your system has been kept up-to-date with Sun’s security patches.


    Q: What''s wrong with setting the access mode of a file or directory to 777? Everyone
    needs to have access to this file or directory, and this is a solution that works
    for our setup.


    A: While setting files or directories to access mode 777 is a quick fix for many
    permissions-based problems, it is a poor solution at best and a gaping security
    hole at worst, especially if any of these world-writable files are also SUID or
    SGID. World-readable files are commonplace, and in general, as long as the files
    do not hold confidential or crucial information, allowing everyone read access
    to these files is acceptable. However I can think of cases where any file or directory
    (outside of /tmp) should be writable by everyone. When you discover a permissions-based
    problem, instead of using mode 777 for a quick fix investigate and determine which
    requires access. Then, create a new group for these personnel and set the group
    accordingly. You may deem it necessary to make in a particular file or directory
    group-writable, which is acceptable in many cases and certainly much more secure
    than making the file or directory world-writable.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Introducing Solaris Security: Evaluating Your Risk • Chapter 1


    Q: Everyone who works in our organization is trustworthy. Why do I need to be
    so concerned with all of this logging and monitoring?


    A: If your Solaris systems are connected to the Internet, then others will try
    and possibly succeed in accessing them. These outsiders are the primary group
    you should be concerned about when logging and monitoring. However, even the most
    seemingly honorable of your users may surprise you when faced with extenuating
    circumstances, such as unexpected layoffs. At times like these, heightened emotions
    may get the best of them and they may turn to sabotage or data theft if they think
    they can get away with it. Logging and monitoring often serve to curtail this
    type of behavior.


    Q: I want to make my Solaris system completely 100 percent secure from hackers.
    What do I need to do?


    A: Seal your Solaris system in concrete and dump it in the ocean over the Marianas
    trench. When it hits the sea bottom it will be 99.999 percent secure. No system
    that does any sort of useful work will ever be completely secure. Since attackers
    will usually seek the path of least resistance, your goal in securing your Solaris
    servers should be to make it not worth the effort to break into your systems.
    While this might keep a majority of the hackers away from your systems, the sad
    corollary is that you will be challenging the minority of hackers, who thrive
    on breaking into highly secured systems.


    www.syngress.com'
  merge: -1
  img_proc: true
