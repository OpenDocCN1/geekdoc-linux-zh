    different from all other collections. This is because the initial line is an average
    of each metric since was booted; it should generally be disregarded unless your
    system has significant uptime (more than 30 days).


    CPU load must be determined by examining utilization and the process queue. The
    last three columns of output provide information on CPU utilization, where "us"
    refer to user processes, "sy" refer to system processes and "id"'
