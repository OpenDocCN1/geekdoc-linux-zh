- pgno: 264
  md: '# Chapter 8 · Configuring Solaris as a Secure Router and Firewall


    during the bootstrap process. It is worth mentioning that the ndpd.conf file does
    not exist by default. To understand why this configuration file is significant,
    we should talk about the in.ndpd program and the purpose it serves.


    The in.ndpd program, when implemented on a router, must be configured to act as
    a router for the IPv6 network. This configuration involves making some entries
    in ndpd.conf to make the daemon known router for the network. When other systems
    bootstrap and send a request for routing information via Neighbor Discovery Protocol,
    in.ndpd responds as the router for the network.


    Minimal configuration of ndpd.conf provides IPv6 functionality on a Solaris system
    consists of the following two entries:


    ```

    if AdvSendAdvertisements true

    prefix 0A:0A:0A:0A:0A:0A/64 hme0

    ```


    To understand these entries, let''s examine them in a little more detail. On the
    first line, we use the ifdefault command. The ifdefault and if commands are used
    to set interface configuration parameters. The ifdefault command must precede
    any if commands because ifdefault is used to specify any default operations of
    the interface.


    The next variable is the AdvSendAdvertisements parameter. The parameter designates
    whether or the system will function as an IPv6 router. By default, this option
    is set to false on systems, which causes in.ndpd to run in host mode. When AdvSendAdvertisements
    is set to true, in.ndpd initiates itself as a router on the interface on which
    it is configured to operate, sending periodic advertisements by multicast and
    responding to router solicitations.


    On the next line we see the prefix entry. The prefix command controls the configuration
    variables for each prefix, or network. There is also a prefixdefault variable,
    which is similar to the prefix variable, except that the prefixdefault specifies
    configuration parameters for all prefixes. The prefixdefault variables must precede
    any prefix variables in ndpd.conf.


    Next on the prefix line we see the network address. This is the 128-bit address,
    divided into eight blocks of 16 bits. The end of the address we have the netmask.
    It is worth mentioning that this is a classless interdomain routing address, also
    known as CIDR. We should also mention that this address is strictly for educational
    purposes and should be used. At the end of the string, we have the name of the
    physical network interface.


    Additional configuration options are supported in the daemon functioning as the
    ndpd.conf file. The preceding configurations will get the daemon the IPv6 router
    for


