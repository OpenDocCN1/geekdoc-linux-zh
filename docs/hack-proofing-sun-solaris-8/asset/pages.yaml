    The service column generally consists of the name of the service being provided.
    Obvious cases include FTP, Telnet, rlogin, ssh, dlogin, and su. In general, the
    name as PAM understands it corresponds to the common name of the service. Other
    is a wildcard service name intended to substitute for any PAM-aware program on
    the system that is not already defined in the pam.conf. It is to ensure that newly
    installed pieces of software operate with reasonable measures of protection.


    The next column after the service column is called the *module* type. In the previous
    example, *auth* describes the mission PAM to perform. In this case, the login
    process will use *pam_unix* for authentication. Valid options and their means
    are shown in Table 4.4.


    # Table 4.4 Module Type Values


    | Module Type | Description |

    | --- | --- |

    | Auth | This module is used to perform authentication. |

    | Password | The module changes or resets authentication credentials. |

    | Account | Account modules perform account management, including expiration and
    locking. |

    | Session | Session management modules.'
