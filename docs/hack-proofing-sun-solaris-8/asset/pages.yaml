    # # Solutions Fast Track


    # ## Securing against Denial of Service Hacks


    +   - Configure network equipment to restrict traffic to permitted protocols,
    routable address spaces, and committed access rates.

    - Configure mail servers to mitigate the effects of e-mail floods by providing
    for a large, separate partition to hold /var/spool/queue. Also using anti-SPAM
    software or writing rules to identify and reject SPAM.

    - Tune Solaris''s kernel parameters to allow for larger TCP connection queues
    and shorter TCP abort timers.


    # ## Securing against Buffer Overflow Hacks


    +   - Add noxec_user_stack and noxec_user_stack_log to /etc/system. While this
    doesn''t eliminate the problem of buffer overflows with 100 percent certainty,
    it will certainly make it more difficult for the average hacker to exploit a system
    with a buffer overflow.

    - Stay current on system patches.

    - Don''t run unnecessary services. The more services run on a system, the greater
    the possibility that a buffer overflow will be discovered in a service and exploited
    by an attacker.


    # ## Securing against Brute Force Hacks


    +   - Establishing a good password policy is a key feature in defending brute
    force hacks. Passwords should expire after a reasonable amount of time, but not
    so often that users find the policy too troublesome.

    - Consider using programs as anlpasswd, passwd+ or npasswd. These programs are
    designed to be used somewhat as drop-in replacements for


