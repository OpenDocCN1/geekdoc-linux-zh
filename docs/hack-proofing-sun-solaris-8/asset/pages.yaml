    # Locking Down FTP Services


    If you plan to offer FTP services, be warned. This can be a very risky position.
    It is rare managed but never eliminated. A friend of mine—a veteran security administrator,
    programmer, and UNIX guru—was going over one of his systems one day; He found
    a veritable treasure of pitted booty. Software of all kinds knows how the pirates
    were stealing his bandwidth and how much further they could have gotten into his
    system if they had the urge


    Offering FTP services to clients is a handy thing. It allows you to distribute
    software cheaply and easily in a way that most Web users are at least familiar
    with. The problem is that there are so many holes in many of the software applications
    used for FTP. A quick search on SecurityFocus can keep you busy for a long time.
    For example, a recent vulnerability notice was posted on SecurityFocus and can
    be found at www.securityfocus.com/bid/2496. This vulnerability impacts Solaris,
    HP-UX, Linux, BSD, AIX, and so others. How can you keep yourself safe?


    The only real answer is that you can''t, but you can take steps to make sure that
    you are as safe as possible. As usual, the first step is patching the system.
    Make sure any known vulnerabilities are fixed. Next, you need to decide if you
    are going over anonymous FTP services. If you are, there are some general guidelines
    to follow. First, make sure the environment that the FTP users are logging into
    is restricted. Solaris''s FTPD, locally, performs a chroot(2) to the home directory
    of the FTP user. This creates a user—fituser, for example. This user should not
    use a valid shell in his or her /etc/passwd entry. If the user did not have a
    valid shell, login would be blocked, which is not what we want. I use /noshell
    as the shell for my FTP user entry. The home directory of this user should be
    the area where the FTP tree can be found. Something like /export/ftp is recommended.
    In addition, make sure that is


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_169_0.png)'
  merge: -1
  img_proc: true
