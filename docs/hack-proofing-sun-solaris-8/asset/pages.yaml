    enemy cannot and will not be able to reach our perimeter, Private!”The private,
    perplexed, to the landmine field between the wire and the encampment and said,
    “Sir, what is the landmine?”The sergeant replied, “It’s for when the enemy breaches
    our perimeter, Private!” The moral of the story is, when it comes to security,
    never assume that you have enough.


    Q: How do I know when it is appropriate to use Trusted Solaris 8 instead of Solaris
    8?


    A: It is difficult to determine the appropriate level of security in a given situation.
    We as computer professionals are expected to not only understand the technology
    completely but to take into account the sensitivity of the data'
