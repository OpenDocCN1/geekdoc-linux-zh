    # Gathering System Information with vmstat


    Probably the most valuable tool for gathering resource information is vmstat.
    In fact, you would more likely use vmstat sdtprocess (discussed earlier in this
    chapter) to gather resource utilization because vmstat (combined with awk) lends
    itself to data collection scripting. This section will serve as a brief introduction
    to performance analysis with vmstat by identifying the important metrics it collects.
    Usually vmstat takes two arguments when invoked, the first being in seconds and
    the second being the number of collections to take. If the second is omitted,
    data collection will run indefinitely. Figure 1.9 gives a vmstat output of 20
    samples collected over five-second intervals.


