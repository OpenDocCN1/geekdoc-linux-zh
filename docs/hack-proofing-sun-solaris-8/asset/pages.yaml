  md: '# Securing Your Network · Chapter 6


    X-protocol information is rerouted through the SSH tunnel to the X-server on your
    local machine. Then, requests for X-servers are proxied between your local SSH-client
    and the remote SSH-server. The net result is that for all intents and purposes,
