  md: '# Tools & Traps...


    # A Server All Your Own


    It is sometimes useful, for reasons of security or reliability, to have a server
    that does not allow access to regular users. Solaris carries forward a handy trick
    from the BSDs of SunOS 4 in the form of `compatibility mode`.


    To use compatibility mode to create a limited-access machine, create a new netgroup
    `sysadmin users` by adding the following lines to the end of `/etc/netgroup:`


    ```

    sysadminusers \\

    (scarter,)

    ```


    Then, use `view` to edit `/etc/password` on the limited access machine and add
    the following lines to the end of that file:


    ```

    +sysadminusers:x:::

    +x:::/bin/false

    ```


    The `pwconv` utility isn''t very good at translating the above into `/etc/shadow`
    correctly, so edit that file manually to append the following:


    ```

    +sysadminusers:10530:::

    +:10530:::

    ```


    This syntax tells Solaris to inherit all the users belonging to the sysadmin users
    netgroup, while replacing the shells of everyone else with the invalid entry,
    `/bin/false`. That''s all left to enable compatibility by changing the password
    line of `/etc/nwitch.conf` to:


    ```

    passwd: compat

    ```


    Now systems administrators can log in normally, but everyone else, even with otherwise-valid
    accounts, will be rejected by the unusable shell.


    # Authenticating Users with Kerberos


    Kerberos, named for the 3-headed canine guardian of Hades in classical mythology,
    is intended to provide a high degree of security by authenticating users, services,
    and hosts. Kerberos is an authentication system, originally designed


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_133_0.png)'
  merge: -1
