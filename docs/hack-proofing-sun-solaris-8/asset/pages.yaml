- pgno: 334
  md: 'Sometime around 1996, Rootkit was adapted for Solaris. Rootkit consists of
    a sniffer program such as tcpdump and the source code to various system binaries
    as ps, ls, ifconfig, and netstat, to name a few. Specifically, Rootkit contains:


    +   - Ethernet sniffer

    - Trojan login replacement program with a back door

    - Support programs as ps, netstat, ifconfig, ls, and du

    - A utility for installing the trojan system binaries with the same dates, UID,
    GID, permissions and checksums as the original programs


    Variants of Rootkit might contain a replacement in.telnet or trojan chfn, inched,
    notp, and syslogd. Rootkit components are designed very neatly to provide the
    attacker with guaranteed access to the system as well as tools to further infiltrate
    other systems.


    The login, ps, netstat and ifconfig files are written to read mask files and to
    specify which output to hide. The mask files are expressive and can hide a great
    deal of activity. The login program is a trojan that allows anyone to log in as
    root across the network by supplying the magic password, which is provided during
    the installation of the kit. The net replacement program hides network connections,
    and the ifconfig trojan hides the fact that the network interface is in promiscuous
    mode. Finally, the ps trojan hides processes running under a specific UID, tty,
    or program name.


    A more recent rootkit is the Solaris Integrated Trojan Facility (sitf) by plasmoid
    of THC, The Hacker''s Choice. This rootkit is employed as a loadable kernel module.
    Loadable kernel modules provide a crucial part of the kernel architecture by providing
    an interface to the hardware devices and data within the kernel memory. Unfortunately,
    loadable kernel modules also attackers with a superb method of operating undetected
    on a system. One of the more notable rootkits that utilizes loadable kernel modules
    is the Adore rootkit (for Linux and FreeBSD).


