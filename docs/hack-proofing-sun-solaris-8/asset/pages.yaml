- pgno: 79
  md: '# Solaris 8 Security Enhancements


    Sun provides many security utilities that you can add to Solaris 8 to enhance
    its capabilities. Many of these products are directly related to securing the
    networking environment that is of great concern to administrators with the advent
    of the Internet and e-commerce. The current release of SunScreen Net 3.0 is a
    complete firewall; it is discussed in Chapter 8. We briefly discuss its features
    to provide a cursory knowledge of its concepts. SunScreen Secure Net as it is
    distributed as a combination of three previously used Sun software packages: Sunscreen
    Secure Net, SunScreen SKIP, and SunScreen SPF-2000.


    Later in this we also discuss the advantages of the Solaris Security Toolkit (formally
    known as JASS, or Jumpstart Architecture and Security Scripts) and implementing
    the OpenSSH shell protocol.


    # Using SunScreen Secure Net


    SunScreen Secure Net provides a high-availability (HA) firewall that can be protected
    not only against intrusions from the Internet but intrusions between various aspects
    of the internal network as well. It provides for some of the more standard technologies
    as proxies and Network Address Translation (NAT), which help protect internal
    addresses from outside access. Proxies to internal authenticated access to be
    configured; NAT assigns pseudo addresses to internal clients for external address
    requests. It provides the features of Simple Key Management for Internet Protocols
    (SKIP), a public key technology, to allow the creation of virtual networks, or
    VPNs. VPNs allow unique networking areas secure in their own right, either on
    the network separated from the Internet or even across the Internet itself through
    tunneling technology. SunScreen Secure Net comprises screen stations, which provide
    the actual firewall functionality, and administration stations, which provide
    the ability for remote administration of network security.


    The screen stations support up to 15 network interfaces and run in either routing
    or stealth mode. Routing mode is what we typically think of when we discuss filters.
    This mode is easiest to manage and allows the greatest throughput. Screen stations
    in routing mode are normally used to segment areas of the internal network from
    one another. Screen stations in stealth mode add an extra layer of security in
    that they are not accessible by an IP address, making them more difficult to access
    and compromise entirely. Stealth-mode'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Chapter 2 • Securing Solaris with the Bundled Security Tools


    stations are generally used as extra secure buffers between the internal network
    and the Internet.


    Remote administration allows a central station to be the point of definition for
    control of the entire SunScreen Net administration. All SunScreen policies can
    be configured from a primary control screen and replicated throughout the Secure
    Net hierarchy. In this way, the administrator not only has the ability to exercise
    control remotely on a well-defined area of the Secure Net structure, as configuring
    different VPNs or separate screen stations, but he or also has the ability to
    control rules that need to be applied universally as well.


    # Utilizing SunScreen SKIP


    SunScreen SKIP is the foundation for SunScreen''s network security. It is an integrated
    encryption package that works on the IP network layer. Because SKIP works on such
    a fundamental level, it is completely unobtrusive to the workings of other applications.
    SKIP uses shared-key and public-key cryptography to ensure the integrity of data
    between hosts. Public keys are generated using the Diffie-Hellman Key Exchange
    algorithm, which allows different hosts to calculate both a private key and a
    public key based on a mathematical model and allows a secret key to be derived
    without transmitting it across the network. Once the keys have been calculated,
    a certificate is generated from the two keys and is sent to and validated by the
    receiving host. Because the possibility exists that the keys could be intercepted
    and decrypted, SKIP employs further encryption technology known as Perfect Forward
    Secrecy. This technology further encrypts the existing encryption key by deriving
    an encryption from a clock-based algorithm that changes every hour.


    > When you use this technology, take care that all systems are time-synchronized.
    Any deviation between systems on the turn of the hour will cause incompatibilities
    between encryption keys and the refusal of data transmissions.


    # Utilizing SKIP’s VPN Capabilities


    Because of the high level of encryption, SKIP allows VPNs to be established between
    hosts on the extended network. With the creation of a security proxy


