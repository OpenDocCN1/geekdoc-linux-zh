  md: '# Dissecting Hacks • Chapter 10


    mail server. Defending against a denial of service targeting the mail service
    itself, requires configuration of a mail server capable of handling the traffic.


    In Chapter 7 we discussed ways to lock down a Sendmail server. Make sure you read
