    \n# The Lure of the Invisible Cache\n\nSites with a large number of Squid clients\
    \ should consider a transparent caching solution. Transparent caching consists\
    \ of a piece of networking equipment that rewrites HTTP packets and sends them\
    \ to your cache. The Squid cache then services the requests and sends the replies\
    \ back.\nThe advantage of transparent caching systems is that you and your support\
    \ staff don't have to individually configure hundreds or thousands of browsers.\
    \ Your users surf the Web normally, unaware that the network is sending their\
    \ requests to the cache. Most transparent caching systems also support redundancy\
    \ and failover. In the event that the cache is unable to service requests, the\
    \ transparent caching system can send data to an alternate cache or directly to\
    \ the Internet.\n\nOne of the more popular caching systems uses Web Cache Coordination\
    \ Protocol (WCCP). Recent versions of Squid support the WCCP. Solly configured\
    \ Cisco routers will invisibly send all HTTP traffic to a Web cache. Many other\
    \ quality of service implementations from Extreme Networks, F5, Allot, and Packeteer\
    \ support transparent caching. When compiled with ipfilt-transparency, Squid will\
    \ interoperate well with almost any vendor's Web cache enforcement system.\n\n\
    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_304_1.png)"
