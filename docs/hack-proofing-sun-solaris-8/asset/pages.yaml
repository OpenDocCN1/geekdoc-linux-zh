  md: '# Introducing Solaris Security: Evaluating Your Risk · Chapter 1


    # Figure 1.2 The dsniff Output of the Passwords Captured during the User''s Sessions


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_31_0.png)


    Here we can see that dsniff easily determined that the password for the user scarter
    is weakpwd. How can you protect against these types of attacks? Above all, you
    should secure your systems. Because dsniff requires the network interface to operate
    in promiscuous mode, the hacker would need root access to capture passwords. If
    your systems are secured, you can hopefully prevent attackers from gaining superuser
    status. Using an entirely switched network also alleviates a large portion of
    the risk, since the hacker can sniff only one host at a time from each compromised
    host.


    # Working with Default Environmental Settings


    Depending on the interactive shell used, various global configuration files can
    affect the security of a user''s environment. For Bourne–based shells such as
    /bin/sh, /bin/ksh, and /bin/bash (if installed) the global configuration file
    for users is /etc/profile. These environment settings are evaluated before the
    user''s local settings ($HOME/.profile) for Bourne-derivative shells, and may
    be overridden by the local user settings. We have already discussed modifications
    to the umask setting in this file, there are a few minor security tweaks that
    you may wish to implement.


