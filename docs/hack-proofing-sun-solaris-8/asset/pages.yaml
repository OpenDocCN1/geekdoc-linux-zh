    this system to access restricted files. Though this is no longer a concern in
    Solaris, it is custom to put an asterisk in the group password field of a new
    group.


    Following the group password field is the GID. As with UIDs, GIDs should be unique.
    The field list lists the usernames of this group.


    Creating a new group on stand-alone or NIS systems is simple. If you''re using
    NIS, be sure to edit the /etc/group file on the NIS master, as changes to a client
    or may not be recognized. Suppose you want to create a new group, operators, which
    will contain users who will be allowed to manage certain aspects of the printing
    system. Have a new GID ready, bearing in mind the following rules:


    +   - Existing GIDs for things like daemon, mail, sysadmin, and the like are reserved
    for certain system functions. Reusing one of these GIDs can create unexpected
    behaviors for commands or, worse yet, serious holes.


    +   - GIDs below 100 are generally reserved for system use, as are GIDs over 60,000.


    +   - When adding users to the new group, keep in mind that each user is limited
    to a single primary group and no more than 16 secondary groups. If a user is a
    member of more than 16 secondary groups, the behavior of certain commands (sudo
    is one) may be unpredictable, and attempts to push NIS maps may fail.


    Suppose two of your users, “jackson” and “tealc,” are expected to manage the printing
    system. In preparation to delegate that responsibility to them, you want to create
    a new group and add them as members. Open /etc/group and add


    ```

    operators::*:150:jackson,tealc

    ```


    If this is the NIS master, you can push the maps immediately with the following
    commands:


    ```

    # cd /var/yp

    # make

    ```


