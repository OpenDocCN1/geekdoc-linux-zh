    A final note: While most people attack the Ping of Death with ICMP echo-request
    packets, it is quite possible to craft similar attacks using TCP, UDP, and even
    IPX.


    # Syn Flood


    A SYN flood occurs when an attacker tries to initiate a large number of connections
    to a system in order to exhaust the TCP connection queue. This type of attack,
    if successful, results in denying any TCP connections, including Web traffic and
    SMTP traffic, to the system. There are three steps normally performed when two
    systems connect using TCP. In the first step, the system initiating the connection
    sends a TCP SYN packet to the service listening on the destination. The destination
    then sends a TCP SYN-ACK packet in response. When the initiator receives the SYN-ACK
    from the destination, it responds by sending an ACK packet back to the destination.
    Once this three-way handshake is complete, the connection is considered to be
    established.


    A SYN flood utilizes two of these steps to fill up the TCP connection queue on
    the target host. Once that queue is full, no new incoming connections can be accepted
    by. With the first exchange of SYN and SYN-ACK packets, the connection is considered
    to be in the SYN_RCVD (SYN-received) state. With the third phase of the three-way
    handshake, the connection goes into the ESTABLISHED state. However, if the final
    ACK packet of the three-way handshake is not received, the connection remains
    in the SYN_RCVD state until it is timed out by the kernel. This may be a period
    of several milliseconds or seconds, depending on configuration. Here lies the
    potential for a SYN flood. Once the queue for incoming TCP connections fills up,
    no new connections can be established until an older connection is timed out.
    Detecting this type of attack is not difficult.'
  merge: -1
  img_proc: true
