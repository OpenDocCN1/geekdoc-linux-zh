- pgno: 21
  md: '# Foreword


    Many years ago, my father decided to put a birdfeeder in our backyard. It was
    great. From our breakfast table we could see all kinds of birds visiting our yard.
    However, it soon became the official hangout for the local squirrel population.
    The squirrels would eat all of the birdfeeder and chase the birds away. My brothers
    and I thought the squirrels were every bit as interesting as the birds, but not
    by my father. He referred to them as “acrobatic vermin” and they soon became the
    focus of a major family project. The project''s goal was to design a birdfeeder
    was easily accessible by birds but impossible to reach by squirrels. On the surface
    it sounded easy enough. How hard could it be to outwit some goofy squirrels? At
    least that''s what my brothers and I thought when our father first explained the
    project to use. It would be fun for us to work on it all Summer. Our birdfeeders
    ranged from the simple to the absurd. Each design worked temporarily, but eventually
    the squirrels would figure out a way around our defenses. Each time, our adversaries
    outwitted us. Still to this day, when we get together, our conversation will invariably
    turn to a design idea one of us had for the Ultimate Squirrel-Proof Birdfeeder.
    The project could continue forever for one simple reason: It can''t be done.


    When I got involved with computer security, I kept thinking about the Ultimate
    Squirrel-Proof Birdfeeder. The reason our designs ultimately failed each time
    was actually very simple. The more challenging we made the more cunning our squirrels
    had to be in order to defeat it. In essence, we were seeing Darwinian theory in
    action. Our efforts were helping a smarter, crafter squirrel. I still have this
    recurring nightmare that I walk into an office for a technical interview and there''s
    a squirrel sitting behind the desk.


    This scenario is very similar to the challenges we face in computer security.
    How we provide easy access to resources by the authorized users and still deny
    unauthorized access?'
  merge: -1
