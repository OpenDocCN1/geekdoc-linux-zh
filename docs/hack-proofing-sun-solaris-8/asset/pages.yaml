    # Extracting and Analyzing Auditing Data


    Once it is correctly configured, Solaris 8 provides utilities for maintaining
    and auditing data. The auditreduce command allows the system administrator to
    merge the audit records from the entire audit trail, including any clients specified.
    Using auditreduce in conjunction with the praudit command, which formats audit
    records into a human-readable format, you can generate a report that provides
    an inclusive means of analyzing audit events. For example, to display the whole
    log to standard output, using the following command:


    ```

    # auditreduce | praudit

    ```


    The auditreduce command has several options that are helpful in filtering the
    data collected for specific criteria. Some options such as the -d option to specify
    a date, the -u option to a particular user, or the -c option to pick a particular
    class, help reduce the amount of data returned, and make the output more manageable.
    Two other very helpful controls are the -b and the -a options, which return data
    from before or after a certain date, respectively. The date format is particular
    to whichever option is used. The -d option, for example,


