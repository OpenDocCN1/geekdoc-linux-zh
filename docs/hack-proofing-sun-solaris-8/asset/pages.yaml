    a Solaris 8 system to interact with an IPv6 network.


    # Automatic Configuration


    One feature of IPv6 is the ability to autoconfigure with an IP address when they
    bootstrap. This feature, built into the IPv6 protocol, is seamlessly supported
    by Solaris 8. This can be an advantage in networks with a large number of hosts
    that might not need connectivity with one another or a known accessible address.
    The steps to take advantage of this feature are minimal.'
