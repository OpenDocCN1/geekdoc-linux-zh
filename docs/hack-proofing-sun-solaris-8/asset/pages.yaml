    # Securing against Buffer Overflow Hacks


    A buffer overflow is an attack designed to inject code into an input buffer of
    a program with the intent of having the targeted program execute the injected
    code. Buffer overflows occurs when an object of size X is placed in a container
    (or buffer) of size Y, and X is greater than Y. To understand how buffer overflows
    work, it is necessary to look at how memory is organized inside a computer.


    What is a buffer? A buffer is a contiguous block of computer memory that may hold
    multiple instances of the same data type. The structure of a program consists
    of several segments, as listed below and as shown in Figure 10.1.


    +   - Text segment The code (also known as opcodes), is read-only and contains
    the assembly instructions, which the processor executes. Code execution is not
    necessarily linear; execution can skip code and perform short and long jumps as
    well as CALL functions.

    - Data segment Contains the initialized global variables.

    - BSS (Block Starting Symbol) Contains uninitialized global variables.

    - Heap A pool of available memory from which dynamic allocation requests are serviced.

    - Stack Information with address of calling routine, arguments passed to the routine,
    frame pointers and other information. The stack is used to pass data to functions
    and as space for function variables.


    A processor register known as the Instruction Pointer (IP, also referred to as
    the Program Counter or PC) points to either the address of the current program
    instruction (or opcode) being executed or to the address of the next instruction
    to be executed. After each instruction is executed, the Instruction Pointer value
    is incremented to contain the address of the next instruction. When a call is
    made in a program, the system needs to know where to go for the next instruction,
    as well as how to return to the previous location. The CALL statement allocates
    sufficient memory for the function and stores on the stack along with the IP value
    of the instruction to execute when the function exits.


