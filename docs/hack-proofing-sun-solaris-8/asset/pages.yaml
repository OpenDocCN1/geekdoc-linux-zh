    # Damage & Defense...


    # Welcome to the Club


    The information in this chapter covers the action you can take once your system
    has been compromised. If you''re lucky, you''ll stop the hackers before any damage
    is done and will learn enough from your monitoring tools to close the gap through
    which they squeezed in. If you''re really lucky, you''ll also be able to capture
    enough information to track the attacker to the hacker.


    What do you with with information isn''t usually up to you. Make sure you understand
    your company''s policy in this area. Many companies choose not to prosecute hackers
    for fear that their customers will lose confidence in their products or abilities.
    Since a majority of malicious hacks are inside jobs, companies often choose to
    handle the problem internally. You''ll be expected to fix the security problem
    so that it doesn''t happen again, and that''s it. This practice does have its
    merits, but not everyone agrees with it.


    Some companies decide to use the information gathered to local law enforcement
    in an attempt to catch and prosecute the


