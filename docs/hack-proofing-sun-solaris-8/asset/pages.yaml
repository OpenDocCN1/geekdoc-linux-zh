- pgno: 23
  md: '# Foreword xxiii


    what tools hackers commonly use to circumvent our security. We cover the most
    popular methods of attack, such as Distributed Denial of Service, Ping of Death,
    and the much-wanted buffer overflow exploit. We discuss how they are used, to
    be on the lookout for how to configure the Solaris systems to prevent their use
    against us.


    Finally, in Chapter 11 we cover what we can do to prepare for that when hackers
    pass our main defenses. This chapter covers the configuration of a Solaris Honeypot
    system using freep or commercial products. With a well-designed Honeypot system
    and some lock, we can tie up an intruder while collecting information on them.
    We can use this data to plug the gaps and get into our. Our final chapter also
    covers the use of a popular file monitoring tool called Tripwire which takes a
    snapshot of our systems and alerts when key files have been altered.


    This book comes full circle. From describing the need for improved and consistent
    security to learning what to do when our efforts fail.


    Our Ultimate Squirrel-Proof Birdfeeder Project failed for the same reason that
    many security plans fail. Squirrels, like many hackers, are very curious, very
    single-minded, and have a lot of time on their hands. They also tend to work together.
    Eventually we figured out how to defeat them. We found that by monitoring our
    efforts and changing our designs in response we were able to build our Squirrel-Proof
    Bird Feeder. The key is that it''s not one design, but an ever-changing design.
    The same holds true for designing your Ultimate Hack-Proof Solaris Solaris. It''s
    not something you do once and ignore. It takes constant reviewing, monitoring,
    and improving. Using the information in this book you will be able to keep your
    resources secure provided you understand the importance of one simple truth: The
    hackers are out there and they want your sunflower seeds.


    > —Randy Cook, SCSA

