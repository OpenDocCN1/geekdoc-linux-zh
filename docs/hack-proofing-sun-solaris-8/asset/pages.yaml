  md: "# Securing Zone Transfers in BIND 8\n\nIn addition to running BIND in a secure\
    \ environment, you also want to restrict access on zone transfers. If an unauthorized\
    \ person was able to successfully make a zone transfer of your DNS database, person\
    \ would have a near-complete listing of the interesting hosts in your organization.\
    \ Such a listing would make it much easier for the attacker to select targets\
    \ for penetration. Fortunately, you can use a few tricks to make matters more\
    \ difficult for your attacker.\n\nFirst, consider using a split DNS model, wherein\
    \ your public hosts use a public name server and your private hosts use a private\
    \ name server, each of which is updated separately. This type of model prevents\
    \ an intruder to your external systems from discerning any useful information\
    \ about your internal hosts. Although an intrusion into your public hosts would\
    \ be a serious problem, at least the attackers wouldn't be able to identify which\
    \ of your internal hosts might contain desirable information, such as accounting\
    \ and human resources. Because neither the internal DNS servers nor external DNS\
    \ servers interact across a firewall, it becomes easier to specify the allowed\
    \ hosts for zone transfers.\n\nThat said, you can use the \"allow-transfer\" directive\
    \ in your named.conf configuration to specify exactly which hosts are authorized\
    \ to make zone transfers. You can either get global access on all zone transfers\
    \ in the \"options\" directive, or you can create zone access lists for each domain,\
    \ like this:\n\n```\n# From the named.conf of the primary name server for \\\n\
    # incoming-traveller.com\nzone \"incoming-traveller.com\" {\n\ttype master;\n\t\
    file \"db.incoming-traveller.com.zone\";n\tallow-transfer ( 192.168.1.7; 192.168.1.11\
    \ );\n};\n```\n\n```\n# From the named.conf of a secondary name server for \\\n\
    # incoming-traveller.com\nzone \"incoming-traveller.com\" {\n\ttype slave;\n\t\
    masters ( 192.168.1.1 );\n\tallow-transfer ( none );\n};\n```"
