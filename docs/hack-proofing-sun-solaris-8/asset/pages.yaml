- pgno: 124
  md: '# Introduction


    User authentication is the most critical piece of any operation system.

    The ability to correctly and securely identify your users, reject those who don''t
    belong, log failed access attempts, and revise the system as new threats arise
    is the cornerstone of system security.


    Solaris provides a series of powerful, flexible authentication and information
    systems, capable of handling virtually any situation. Network Information Service
    (NIS), the lingua franca of network information, allows Solaris to participate
    as either a server or a client of authentication data in a network that may be
    composed of many other types of UNIX systems. Its descendant NIS+ offers improved
    security, better performance for extremely large networks, and a finer granularity
    of access control. Kerberos provides a secure, powerful authentication framework.
    Kerberos seeks to address the key issue of network eavesdropping, while offering
    the convenience of single sign-on. The Sun Enterprise Authentication Mechanism
    allows for the easy deployment and configuration of Kerberos, as well as interoperability
    with existing MIT Key Distribution Centers.


    Recently, Solaris has embraced two important technologies that have pushed system
    security and flexibility further. Role-based access control systems administrators
    to define specific tasks, then delegate those tasks to individuals or groups.
    This allows the distribution of regular maintenance tasks without the risks inherent
    to widespread possession of root passwords.


    Pluggable Authentication Modules (PAM) were first introduced to Solaris with the
    release of 2.6. PAM allows administrators to fine-tune the authentication process.Through
    the use of publicly available PAM modules, it is quick and easy to replace conventional
    password-file-based systems with other authentication resources, such as LDAP,
    Radius, SMB, TACACS, S/key, or SecURL. In contrast to previous solutions, PAM
    allows certain services to authenticate in a specialized manner, while others
    use conventional means.


    In this chapter, we will give examples of creating a new group and delegating
    a limited set of privileged operations to that group.We will discuss the security
    risks of NIS and NIS+, and how to minimize them.We will shed some light on the
    often misunderstood and much-aligned Kerberos.Then we will head into a discussion
    of the merits of PAM, an introduction to the pam.conf, and a few examples of how
    to use this technology to secure your hosts.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Creating Secure Group Memberships


    When first installed, Solaris sets up several groups. Some are used by system
    utilities, some are present to allow for better control over security, and some
    are just holdovers from an earlier era, retained for compatibility with legacy
    operating systems. This section will discuss the nature of these groups, and illustrate
    the creation of a new group. Later, we will see how to use a new feature of Solaris
    8 to delegate certain maintenance tasks to members of this newly created group.
    Table 4.1 gives a list of the important Solaris groups and their purposes.


    # Table 4.1 Important Solaris Default Groups


    | Group Name | Purpose |

    | --- | --- |

    | root | Like the wheel group in Berkeley Software Distribution (BSD), the root
    group exists to identify privileged users. |

    | other | Root''s primary group in Solaris. |

    | mail | Many system utilities are set-GID mail to write the mail queue and spool
    directories. BSD systems once used an advisory locking scheme that relied on a
    set-GID mail spool directory. |

    | tty | Rarely used other than give the set-GID wait command write access to tys.
    |

    | daemon | For security reasons, many system processes drop their root privileges
    to daemon shortly after startup. |

    | sysadmin | Only members of this group run the Solaris administration utility,
    Admool. |

    | sucp | A carryover from the days when UUCP was common. Certain system utilities
    use the uucp group for access control and to write in some spool or locking directories.
    cu, uucp, uucencode, and uudecode GID uucp. |


    Take a typical /etc/group entry as an example:


    ```

    tty:7:root,tty,adm

    ```


    As with flat files used in UNIX authentication and authorization, fields are delimited
    by colons. The first field is the group name. The second, which in this example
    is empty, is the group password. Group passwords are a dated concept. Originally,
    before membership of multiple groups became a common feature of UNIX operating
    systems, users could use the newgrp command to'
