- pgno: 172
  md: '# Chapter 5 · Securing Your Files


    ```

    [accounting]

    path = /export/acctg

    writable = yes

    browsable = no

    valid users = tealc dickson

    admin users = scarter

    max connections = 3

    ```


    This entry sets up a shared accounting at the specified path. The writable parameter
    defines whether or not the share will be read/write or read only. In this case,
    we have that the share will be read/write. We will not, however, allow the share
    to be seen via net view in the browse list. We prevent this by specifying that
    brousable is set to no. We define three valid users, one of having administrative
    access. Administrative access, defined by the admin users parameter, should be
    carefully considered. Any user with access to the share will have total control
    and will be able to take any action, regardless of file permissions.


    There are some options that you should never see in a smb.conf file. These options
    are detailed in Table 5.2.


    # Table 5.2 Dangerous Smb.conf Configuration Directives


    | Directive | Description |

    | --- | --- |

    | root postexec | Indicates a command to be run once the service (share) is no
    longer in use. The command is run with root privileges on the server. |

    | smbrun | If Samba is properly installed, this parameter should not be set to.
    The parameter takes a value that indicates the location of the Samba binary. It
    could be used to force the use of a "Trojan" or altered binary. |

    | root preexec | Indicates a command to be run when the service is connected to.
    The command is run with root privileges. |

    | unix password sync | If set to true, this parameter allows the Samba server
    to run, as a root, to change the Solaris password, without any verification. The
    program that is run is also configurable, which makes this another hole. |

    | add user script | Assuming special conditions are met, the script that is defined
    by this parameter will be run, as root, to add a user. |


