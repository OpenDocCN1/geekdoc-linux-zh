- pgno: 351
  md: '# Detecting Denying Hacks • Chapter 11


    The commercial versions of Tripwire''s products cover a wide variety of capabilities
    and services. In this section, we cover the open-source version of Tripwire, which
    can be compiled for a Solaris system, as well as the commercial versions. Tripwire
    offers products that will protect your Web services and even your routers, but
    here we concentrate on the Tripwire for Servers products.


    Tripwire for Servers offers a graphical user interface (GUI) for installation
    as well as the ability to be managed remotely with Tripwire''swire Manager. As
    you can see from Figure 11.1, Tripwire Manager can manage multiple systems that
    have the Tripwire agent software installed. Many people use the open-source version
    of Tripwire on Linux systems, but there is no reason you can''t compile your own
    from the source to run on your Solaris system. The open-source and commercial
    versions of Tripwire use the same policy file, twpol. Tripwire for Servers version
    2.4.2 processes the policy file in the /usr/local/tripwire/tf/policy directory.


    # Figure 11.1 Tripwire Manager


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_351_0.png)


    By default, Tripwire does a very good job of protecting a Solaris system. However,
    if you need added security or want to make changes to the default settings, you
    can do so easily. In the following sections, we look at several areas of the twpol
    file.'
  merge: -1
  img_proc: true
