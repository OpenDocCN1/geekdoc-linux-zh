  md: '# Securing Solaris with the Bundled Security Tools · Chapter 2


    between two hosts, a protected tunnel is established and further prevents data
    from being intercepted and interpreted. This additional security is accomplished
    by the network packets being encapsulated in a further encrypted IP packet that
    is derived by the security proxy and decrypted by its corresponding security proxy
    on the destination host. This technology keeps the network''s internal topology
    hidden because the network packet containing the information about its destination
    host is encapsulated inside another encrypted packet that does not contain the
    destination information. Because tunneling is a point-to-point connection, the
    packets are protected from fragmentation by having single points of destination
    where they are decrypted and consequently routed.


    Figure 2.5 displays a network that contains all the elements that have been discussed
    in this section. While the different locations are protected from the Internet
    by stealth-mode firewalls running on Sun systems, they have established a SKIP
    VPN tunnel between the two systems, allowing highly encrypted traffic directly
    between the two over the Internet. The main location has Sales, Human Resources,
    and the Web Server on the main Ethernet backbone; the Trade Secret LAN segment
    is protected by an internal routing-mode firewall. Each location has its firewalls
    administered remotely.


