  md: '# Using the dhcpconfig Command-Line Tool


    Although the GUI configuration tool is certainly worthwhile to use, more than
    likely you will opt to use the command-line, menu-driven interface to configure
    DHCP because it is faster, somewhat convenient, and has a more compact method
    to set options. Once DHCP is running, the GUI tool makes a more efficient management
    console because it supports more features, as previously described.


    When configuring DHCP via the command line, you will need to launch the /usr/sbin/dhcpconfig
    utility. The initial screen will be identical to the one shown in Figure 6.16.


    Figure 6.16 Starting the dhcpconfig Command-Line Tool


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_194_0.png)


    These options are identical to those discussed for the graphical configuration.
    You should select 1 to configure DHCP service, which will begin prompting you
    for input on DHCP configuration. Usually, you will use the default values, shown
    in Figures 6.17 and 6.18 as empty text following the colon at the end of the line.
    We''ve already discussed most of these defaults, so we only explain the areas
    in which we did not choose the default values for this section.


    The CLI interface allows you to configure logging options during the initial installation,
    an option that is not available in the wizards of the GUI tool. You probably want
    to enable this extra logging so that you can keep track of which systems are receiving
    addresses, information that is often essential'
