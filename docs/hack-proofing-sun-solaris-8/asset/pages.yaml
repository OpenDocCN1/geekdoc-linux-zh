- pgno: 224
  md: 'Chapter 7 • Providing Secure Web and Mail Services


    # Introduction


    As the Internet has grown from the experimental backyard of scientists and researchers
    to the ubiquitous presence it is now, two of its offerings have become engrained
    in the psyche of all its users, technical and otherwise: e-mail and the World
    Wide Web. These two services, and their underlying protocols, allow even the most
    novice user to communicate and share information quickly, effectively, and efficiently
    from any Internet-connected system. Unfortunately, the ubiquity of these services
    is also their downfall. As Web and mail servers have propagated and proliferated,
    so have the attendant holes and risks associated with Web and mail server software
    packages. We take a look at are arguably the two most popular software packages
    for mail and Web services under Solaris: sendmail and Apache. One important caveat—as
    of Solaris 8, Sun spins a derailed version of Apache with Solaris for many years
    now. We look at the distribution-level sendmail and Apache installations, and
    briefly touch on the non-Sun distributions. In any case, you will likely find
    a use for the Sun and non-Sun in your daily travels as a system administrator.


    The Apache server inherited its name from its beginnings as a set of patches against
    the source code of HTTP daemon developed by the NCSA at the University of Illinois
    Urbana-Champaign. The Apache server was first released as version 0.6 in April
    of 1995, As Apache 1.0 graced the world with its presence on December 1, 1995,
    As we fast-forward almost six years, we find that in a 2001 survey by Mindcraft,
    60 percent of sites on the Internet serve content with the Apache distribution
    on either Linux, Unix, or Windows. However, Apache is a relative newcomer compared
    to sendmail.


    Sendmail was originally developed by Eric Allman of the University of California
    at Berkeley to allow mail to be distributed across multiple transport and network
    types. In those days, not all mail servers spoke SMTP, so Sendmail was designed
    to speak as many mail protocols as possible to allow all of UC Berkeley’s mail
    networks to communicate among themselves and with the Internet. Sendmail gained
    its original popularity with its inclusion in UC Berkeley’s version of UNIX, the
    Berkeley Software Distribution (BSD). As sendmail approaches its 20th birthday,
    it has to handle more Internet e-mail than any other mail server. And with the
    author’s adherence to the various e-mail-related RFCs, sendmail will continue
    to be a flexible, versatile, and powerful tool in the arsenal of any system administrator.


    All the power in these two tools comes with a price—secure configuration. Apache’s
    sole purpose in life is to serve Web content. Sendmail’s sole purpose is in


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_224_0.png)'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Providing Secure Web and Mail Services • Chapter 7


    life is to route and deliver e-mail. By default, neither is inherently secure
    against attack. By the Internet and its inherent dangers have grown, so the authors
    and maintaining groups have the challenge of providing first-class security features
    and functionality with their products. A little time spent properly your services
    today may well spare a great deal of time spent later cleaning the mess left by
    a security breach.


    # Configuring the Security Features of an Apache Web Server


    By default, Apache is not configured to run when a Solaris system is booted up.
    Sun places a basic set of configuration files located in /etc/apache, but the
    httpdconf file is named httpd.conf-dist. The startup script /etc/rc.d/S50apache
    looks for the httpdconf file to configure Apache, but if it does not, Apache will
    not start. To start Apache now and with reboots, copy the file /etc/apache/httpdconf-dist
    to /etc/apache. For this instance only, run /etc/rc.d/S50apache with start as
    a command-line argument. The server will start normally.


    The brain of Apache rests in the httpdconf file. The binary will just sit there,
    useless, without a valid httpd.conf file. We spend a good amount of time getting
    to know this file in its most basic and secure sense, so get comfortable. An httpd.conf
    file is full of various directives, each telling the Apache binary something about
    the personality of your system. Some directives are optional and a full explanation
    of what each does take place in an entire book. We focus on the important ones
    here:


    +   **ServerSocket** This defaults to standalone, but can also be configured as
    inetd if Apache should be controlled by inetd. Using standalone will give you
    the best performance, but using inetd in conjunction with TCP Wrappers will give
    you a better handle on security.


    +   **ServerRoot** For Solaris, this defaults to /var/apache. Modify this to where
    you configure your configuration files, log files, and be sure to put this on
    a disk partition with plenty of space for logfiles and miscellaneous other data.
    Putting this on a partition separate from the rest of the system will help prevent
    a DoS attack from bringing down the whole system.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_225_0.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Chapter 7 Providing Secure Web and Mail Services


    +   **User** By default, this is set to nobody. Apache should run as on your system.
    Because Solaris uses the nobody user for other purposes, it is best to create
    a new system user called apache or httpd. Be sure that this user has at least
    access to your DocumentRoot and read/write access to your ServerRoot, either directly
    or through group membership.


    +   **Group** This setting also defaults to nobody. Set this option to the Group
    ID Apache should run as on your system. With the User setting, you should change
    this to another group like apache or httpd.


    +   **ServerAdmin** This configures the e-mail address in any server-generated
    messages or prompts you to notify the system administrator. For Solaris, it defaults
    to you@your.address. If your site has multiple Web administrators, this could
    be a distribution list like Webmaster@your-domain.com.


    +   **ServerName** Set this to the name of your Web Site. For our example Web
    site, we would put www.incoming-traveler.com. This does not need to be the same
    as your Fully Qualified Domain Name (FQDN). For example, our server''s FQDN might
    be www-commerce.incoming-traveler.com, but we could set ServerName to www.incoming-traveler.com
    so that Apache will not list our real FQDN in any of its output.


    +   **DocumentRoot** This option configures the main Web directory for your system.
    This directory is /var/apache/htdocs by default on Solaris. With ServerRoot, it
    is best to set this to a separate disk partition from the rest of the system.
    It is also best if ServerRoot and DocumentRoot are on separate disk partitions
    as


    +   **<Directory "/var/apache/htdocs"> Apache uses a syntax for configuration
    file that is much like HTML. In this case, we are configuring the security options
    for the main Web directory. Change the directory name in quotes if you changed
    the DocumentRoot mentioned in the preceding item.


    Here is an example of an httpd.conf file, simplified for brevity, for our site
    www.incoming-traveler.com:


    ```

    ServerType standalone

    ServerRoot "/usr/local/apache"

    User apache

    ```'
