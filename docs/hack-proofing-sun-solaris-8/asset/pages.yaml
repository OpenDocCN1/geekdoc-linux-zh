    # Kerberos: Is it Really a Dog?


    Kerberos was originally developed at MIT, long before the Internet became popular
    or very many people owned computers. MIT had the advantage of excellent in-house
    development, and most importantly, an environment where Kerberos evolved right
    alongside increasing demand for computers. Under those circumstances, widespread
    use of Kerberos went hand-in-hand with widespread use of computing resources.


    Detractors point out that its fundamental ten, the policy that gives Kerberos
    its unsurpassed resistance to snooping, is also its greatest weakness. The password
    is never on the network is a difficult reality to achieve in this day of Web browsers,
    mixed platform environments, and a plethora of e-mail clients. Even in the UNIX
    world, where local credentials caches and Kerberized software is easy to develop
    and deploy,


