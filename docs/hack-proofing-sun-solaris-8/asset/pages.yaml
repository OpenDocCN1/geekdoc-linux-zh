    \ an access list for directory. The Options keyword enables and disables various\
    \ options for the directory, like Server Includes (SSI), directory indexing, and\
    \ CGI script execution. The AllowOverride keyword is used to allow access files\
    \ (by default called .htaccess) and controlled with the AccessFileName keyword\
    \ in httpd.conf to override certain options for directory. The .htaccess files\
    \ are commonly used for creating access lists, or requiring passwords to access\
    \ pages within directory.\n\n# Limiting CGI Threats\n\nOne of the largest causes\
    \ of security holes for a Web server is the usage of Common Gateway Interface\
    \ (CGI) scripts, which allow a user to interact with a program on the Web server\
    \ to send or receive information. A CGI script must perform thorough verification\
    \ on user input at all times. Some common characters have special meaning to Unix\
    \ programs, such as csh, awk, and sed, should either not be allowed as valid input,\
    \ or be dealt with by CGI before any input passes to another program. For example,\
    \ you probably would want your CGI to catch characters such as *, ., /, @, !,\
    \ and ^ because each of these can be misinterpreted as a shell or Unix environment\
    \ modifier. By allowing these modifiers, you could unknowingly modify the way\
    \ your CGI interacts with the rest of your system.\n\nMost CGI programs are written\
    \ in one of three languages: C, Perl, or some shell (such as Bourne) variant.\
    \ Of the three, none is necessarily more secure than"
