  md: '# Chapter 2 · Securing Solaris with the Bundled Security Tools


    Even though the Orange Book classification levels go from the lowest level D to
    the highest level A, in reality, except for a few exceptions, most operating environments
    run under C1, C2, or B1 levels.


    # Choosing Solaris 8 C2 Security


    +   - The SunSCREEN Basic Security Module is required in order to bring the default
    installation of the Solaris 8 OE up to C2 security.


    +   - Auditing must be configured and managed with an organized methodology in
    order for it to be useful and controllable.


    +   - Auditing can be finely configured and managed by editing the audit_control
    and audit_user files and utilizing the **auditconfig**, **auditreduce**, and **praudit**
    commands.


    # Choosing Trusted Solaris 8


    +   - Choosing the Trusted Solaris 8 OE, although providing a high level of security,
    requires a commitment of both human and system resources to administer and maintain.


    +   - Role-Based Access Control (RBAC) and Mandatory Access Control (MAC), also
    known as *labeling*, are keystones to the comprehensive protection provided in
    Trusted Solaris 8 OE.


    +   - Proper auditing and auditing analysis are corners of all security systems.
    Administrators must be vigilant for possible breaches.


    # Solaris 8 Security Enhancements


    +   - SunScreen SecureNet provides an effective means of encrypting network traffic.
    SunScreen Simple Key Management for Internet Protocols (SKIP) is the mechanism
    provided in SunScreen Secure Net for encrypting network traffic.Virtual private
    network (VPN) is a subset of SKIP and provides a way for a highly encrypted point-to-point
    connection or tunneling to be created on a local LAN, across a WAN, or even across
    the Internet.


