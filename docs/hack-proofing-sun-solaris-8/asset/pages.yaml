- pgno: 268
  md: '# 244  Chapter 8 · Configuring Solaris as a Secure Router and Firewall


    IPv6. When the system is bootstrapped and configured as a router, this daemon
    is launched to manage network routing information.


    This daemon is to IPv6 what inroute is to IPv4. The inroute program listens on
    port 520 via UDP, and the inripngd program communicates via UDP on port 521. On
    a router, this daemon multicasts request packets on all functioning IPv6 interfaces
    and when the daemon receives response packets, it places information about the
    responding host in RIP tables. This information is later used to update system
    routing tables.


    We will not delve into deep discussion about this program, since it is simply
    a means to get the job done. It is not essential to our mission, although it can
    be helpful. More information about this program is available via the in.ripngd(1M)
    man page.


    # The ifconfig Command


    At one point or another, you will need to manually configure an interface. This
    is life as a systems administrator or in any other position responsible for the
    operation, maintenance, and availability of systems. The standard UNIX ifconfig
    command has been enhanced to function with IPv6, providing extended functionality
    at the expense of learning the new features.


    The differences in syntax for the IPv6 functions of Solaris are relatively minute.
    It is possible to add addresses to a single interface without worrying which virtual
    interface will host the address. This is done simply by using the addif flag,
    as demonstrated here:


    ```

    ifconfig hme0 inet6 add 0A:0A:0A:0A:0A:0A:05/64

    ```


    This code allows us to add the :05 address to the hme0 interface and let the system
    decide which virtual interface the address will reside on. Executing the ifconfig
    -command, we see that the address now resides on the hme:3 virtual interface.


    Accordingly, we can also remove the address, letting the system find and remove
    it for us. Observe the following example:


    ```

    ifconfig hme0 inet6 removeif 0A:0A:0A:0A:0A:0A:05

    ```


    This code allows the system to do our dirty work, removing the :05 address. After
    executing the command, we can see that the address and virtual interface have
    been removed.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_268_0.png)'
