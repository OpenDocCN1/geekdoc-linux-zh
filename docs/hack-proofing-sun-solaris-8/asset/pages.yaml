    +   - The system has at least two interfaces.

    - The /etc directory contains at least two hostname.interface files that configure
    the interfaces when the system is booted.

    - The stock /etc/r2/S69net file exists.


    The first condition refers to any two interfaces and not limited by a difference
    in types of card, such as one 10BaseT card, and one 100BaseT card, or types, such
    as Ethernet and point-to-point. The second condition refers to the hostname.interface
    file. For example, in the case of the previously mentioned cards, one hostname.le0
    and one hostname.hme0 file would represent the 10Mit, or le0 interface and the
    100Mit, or hme0 card.


    The third condition refers to the it script when the system executes run-level
    2. This is important because it'' common for a systems administrator to make alterations
    to the S69net script to secure the system. If a system is used as a router, it
    is recommended that an initial install be performed on the system to ensure the
    integrity of the network. If such an install is not possible, it at least that
    these two scripts be replaced with known unaltered copies or those verified against
    the Solaris Fingerprint Database. We discuss using new methods and existing installs
    as routers in this chapter.


    When the system bootstraps, it first executes the script /etc/rc/S30network.sh
    which configures the loopback and other interfaces on the system that have a hostname.interface
    file in /etc.When the system enters run-level 2, it executes the S69net script,
    which handles all the necessary functions of bringing up network connectivity.
    This script is designed to bring up a system with multiple network configuration
    options. Here we review only the details pertinent to our discussion.


    # The S30network.sh Script


    To get a better understanding of how network connectivity is initialized on a
    system, let''s first look at the S30network.sh script internals. The S30network.sh
    is an inode-link to the master script, located in /etc/init.d/. This script bootstrap
    process. It is executed early in the bootstrap process to serve the needs of any
    other systems that might be relying on the host to provide some service. Diskless
    clients are an example of such hosts.


    Let''s look at some of the snippets of code from this script. Typically, a host
    that is going to act as a router does not rely on things such as DHCP or NIS,
    because these are added risks and could result in a higher probability of vulnerability


