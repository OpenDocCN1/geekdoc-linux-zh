- pgno: 290
  md: '# Introduction


    Squid is a caching proxy that conforms to the HTTP 1.1 specification. It provides
    an additional layer of security and monitoring for Web browsers, while caching
    frequently visited sites for improved performance. In addition to saving bandwidth,
    Squid can prevent Web sites by determining the IP addresses and browsers used
    by your clients. Squid can filter content by URL, Multipurpose Internet Mail Extensions
    (MIME) type, and require authentication. It can restrict access by time of day,
    by user, or by type of traffic.


    In this chapter, you will learn how to configure Squid to secure Web access for
    your workstations. A default installation of Squid allows any browser, anywhere
    on the Internet, to use your proxy. We will discuss means of securing this access
    by restricting it to specific IP ranges.


    # The Default Settings of a Squid Installation


    Once Squid is installed, you must configure it through the /usr/local/etc/squid.conf.
    This file defines the Squid configuration options, including the HTTP port number
    on which Squid listens for HTTP requests, timeout information, cache peering information,
    and access control. A skeleton /usr/local/etc/squid.conf file is created During
    installation.


    The squid.conf file contains default settings, which are commented out, along
    with some description of the settings and recommendations for various sites. Each
    configuration option in the squid.conf is identified as a tag. For example, the
    HTTP client request port setting is identified as the http_port tag. We will refer
    to the squid.conf settings as tags.


    We will cover basic Squid configuration to ensure a secure, manageable cache server
    installation. Client request control, cache directory size and location, access
    control by IP address, SNMP settings, cache control through the cachemgr utility,
    and crutches for certain browsers are all important considerations at this stage.


    # Configuring Squid


