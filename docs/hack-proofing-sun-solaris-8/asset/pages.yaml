- pgno: 135
  md: '# Securing Your Users · Chapter 4


    configuration, and how it can be used to secure your network. We''ll discuss some
    of the pitfalls and security risks associated with Kerberos.


    To understand Kerberos and its strengths as an authentication system, we need
    to look at a conventional service, as rlogin. When a client initiates rlogin connection,
    rlogin sends the name of the local user to the server for identification. If the
    server trusts the client or the user (through hosts.equiv or .hosts file), the
    connection is allowed and the user logs in. In the event that no host-based trust
    is present, the user is forced to present a password as identification. One problem
    with this is that the password travels in the clear on the network, where any
    eavesdropper can easily obtain it. Furthermore, this system assumes that there
    are circumstances in which a remote host can be implicitly trusted by virtue of
    its IP address.


    The Secure Shell (SSH) mitigates some of these problems through the use of encryption.
    The server end of the connection is identified by public key cryptography. If
    the server''s public key matches the one previously cached by the client, the
    user can be certain that he has reached the correct host. All authentication credentials
    (and indeed the entire connection) travel over an encrypted channel. This would
    seem to ideal, but fact, suffers from two significant weaknesses. First, SSH has
    no mechanism for securely identifying a remote host to a client for initial connection.
    The user must assume that he has reached the intended destination, and keep a
    copy of the public key first presented. If an attacker can redirect that initial
    session, he can control all sessions without giving the client any noticeable
    signs of trouble. Second, SSH, with its insecure counterparts, is based on a disclosing
    authentication system. Then, a password is disclosed during the authentication
    process, and may be captured and retrieved by a compromised server.


    Kerberos seeks to address both of these issues; it is a nondisclosing authentication
    system that provides a mechanism to securely identify each end of the connection.


    When a user is added to the KDC, their initial password is used to generate a
    unique hash, which is stored by the server. The account creation process, through
    kadmin, is secure, and the passwords are not recoverable. When a user first logs
    in, the login process contacts the KDC and requests a Ticket Granting Ticket (TGT).
    This ticket contains information like the username, the validity period of the
    ticket, some cryptographic identifiers of the KDC that issued it, etc. The entire
    ticket is then encrypted, using the stored hash as the secret key. A login is
    successful when the login process, using the password provided, is able to decrypt
    and store that ticket locally in what Kerberos calls a


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_135_0.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Chapter 4 · Securing Your Users


    cache. As you are the only person in possession of the correct password with which
    to decrypt that ticket, you have been correctly identified. A file previously
    placed on your workstation called keytab identifies your machine and is used during
    the login process to ensure that the TGT it received came from the real KDC. In
    this way, Kerberos has granted you its trust and ensured that the machine you
    logged in to is the one identified once before. Most importantly, your password
    is never disclosed to the KDC and never travels across the network, even in encrypted
    form. This is one of the fundamental tenets of Kerberos, and as we will see later,
    a weakness to its widespread adoption.


    Now that you have a TGT, lets attempt to sort out the series of events in motion
    by the login process for a typical service, like a Kerized login. The Kerberos
    server generates a random session key with an identifier for the remote server
    and encrypts this with your session key, which is now stored in your TGT. It also
    stores that session key, along with your username, in a ticket which is encrypted
    with the service key owned by the remote server. When your copy of login receives
    both tickets, it decrypts yours, using the key stored in the TGT, to recover the
    session key. Rlogin cannot decrypt the other ticket; only the remote server can.
    So Rlogin takes the current time, encrypts with the service key proof that you
    possess a valid TGT, and sends this new ticket, along with the other undecipherable,
    to the server.


    When the remote server receives these two tickets, it decrypts the first one with
    its own key, recovering the random session key. It can then use this key to recover
    the time you sent. If time matches your time, with a little slip to allow for
    slightly different clocks, the server has proof that you are who you say you are.
    As the only server you tried to contact possibly recover the session key, you
    can be certain that you have connected to the correct host. As an benefit, each
    side of the connection now has a unique, random key which can be guaranteed secure
    from eavesdropping or tampering and may now be used to encrypt the login connection.
    You never had to type your password, and as long as your TGT is valid, you never
    will. At no time in this exchange was your password revealed to the remote service
    or to the KDC. It’s a complex chain of events, but when correctly implemented
    provides an immensely powerful authentication system.


    Sun’s SEAM package brings Kerberos to Solaris. SEAM provides the pam_krb5 module
    that performs authentications, Kerberized versions of the FTP, login, rsh, rcp,
    and Telnet services. During the SEAM installation process, a new Kerberos realm
    is created. Realms are roughly the Kerberos equivalents of NIS or NIS+. Domains
    represent a collection of user and administrator authentication data,


