- pgno: 383
  md: '# Detecting and Denying Hacks • Chapter 11


    Make sure that the syslog file is protected on a honeypot system. One is to write
    to a remote server.


    The configuration files under the /etc directory need to be protected from hacker
    manipulation. Make sure that Tripwire is configured to guard these files.


    # Creating Daily Reports


    +   One way to keep tabs on your systems is to create a shell script that will
    e-mail you a report each day.


    +   Some good pieces of information to keep track of are the most recent entries
    in the /var/admn/messages file, the last time the system was rebooted, and the
    current CPU load and active logins.


    +   Use the crontab command to enter the scripts as a daily cron job.


    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.synergy.com/solutions
    and click on the “Ask the Author” form.


    Q: If I should name my honeypot something important sounding, should I name my
    real systems something unimportant?


    A: It depends on your overall naming scheme. Don’t think that naming your DNS
    server something as keep-moving-nothing-to-see-here-1, you’ll convince hackers
    that it’s not an important system. Don’t do anything that will call attention
    to it. It’s a good idea to stick with your naming scheme, make the honeypot sound
    more important. I often use the same naming convention for my network’s production
    servers as my network’s workstations. Naturally there’s more to a honeypot than
    just the naming, but you’d be surprised how uninterested a hacker will be in a
    system named jackson1ia-wks.


    Q: I’m not very experienced with shell scripting. What’s the best way to learn?


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_383_0.png)'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'A: There are some fantastic resources on the Web. One of my personal favorites
    is Shelldorado, by Heiner Steven. It can be found at www.shelldorado.com. It has
    great training resources, examples, and fun tips and tricks. It’s got something
    to offer anyone with any level of experience.


    Q: Where should I keep my scripts on my system, and how should I protect them?


    A: There are many opinions regarding this issue, but I usually create a fake user
    and lock the account. I then put all the system scripts in that user’s home directory,
    make the user the owner, and put execute-by-user-only permissions on them. For
    example, if my fake user is named selmac, the command would be chown selmac monitor.sh;
    chmod 100 monitor.sh.


    Q: To whom should I report suspected hacking attempts?


    A: It really depends on the severity of the attack and your company policy. I
    always like to report any major attempts, successful or unsuccessful, to the CERT
    Coordination Center at www.cert.org. I think it’s important to let my peers know
    of problems they could potentially face. Since I benefit so much from the information
    distributed by organizations such as CERT, I feel obligated to give something
    back when I can.'
  merge: -1
