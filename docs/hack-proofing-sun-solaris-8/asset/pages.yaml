    # ### Damage & Deserve...


    # #### Accelerator Mode


    The Squid mode mentioned in the http_port description allows Squid to act as a
    Web server. Squid basically translates client Web requests by changing the destination
    server and port, then sends the request to a Web server. The response is cached,
    and Squid sends it to the client. This reduces traffic to the Web server (it accelerates
    the slow Web server), and can protect the Web server through filtering.


    In this mode, Squid can sanitize incoming requests using the use of regex filters.
    By dropping requests that contain nonstandard, questionable, or overly long URLs,
    Squid offers a defense for those servers plagued by buffer overflows. While it''s
    not a substitute for regular patching, placing a Squid accelerator-mode proxy
    in front of your Web server can drastically reduce the potential avenues for a
    hacker.


    An added benefit of accelerator mode comes from having multiple Squid servers.
    By caching your Web content and providing multiple points of failure, state responsiveness
    and reliability are improved.


    www.syngress.com'
