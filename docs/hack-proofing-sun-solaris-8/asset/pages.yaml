  md: '# Introducing Solaris Security: Evaluating Your Risk • Chapter 1


    Many of the services remaining can be replaced through the use of Secure Shell
    (SSH). SSH is an encrypted protocol that allows for secure authentication, interactive
    logins and file transfers. There are also ways to configure secure shell to act
