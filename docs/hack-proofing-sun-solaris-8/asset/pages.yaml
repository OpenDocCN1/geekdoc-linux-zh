- pgno: 71
  md: '# Securing Solaris with the Bundled Security Tools • Chapter 2


    Auditing an administrative task need not be daunting. It does, however, require
    a steadfast resolve to keep it from becoming a problem. Routine analysis and maintenance
    are not only necessary to keep the job from getting out of hand, and are also
    the foundation of the necessary procedures of vigilance that is the cornerstone
    of system security.Whether it is correcting some incidental infraction or taking
    steps to head off an intruder, auditing provides us with the essential information
    to deal with the situation. Luckily, many tools, some of which are discussed in
    later chapters, make the task of auditing much easier than it is on the command-line
    level as is discussed in this chapter. But whether you prefer the GUI interface
    of a third-party product or the “ol’ time religion” of scripting and command-line
    control, auditing is an effective means of protecting your system.


    # Choosing Solaris 8


    Today Solaris 8 is a culmination of 10 years’ worth of security enhancements.
    As of this writing, Trusted Solaris 8 is being evaluated against the government-sponsored
    standards criteria the EAL4 level of the Labeled Security Protection Profile (LSPP),
    which is the successor to and equivalent of the TGSEC level B1 security. Sun not
    meets the government’s standards for security; it exceeds them by providing additional
    security features necessary in today’s Internet environment, as secure remote
    administration, trusted client connections to ensure password integrity, secure
    names, and support for NIS and NIS+. With Sun’s RBAC, an administrator can manage
    the Rights Profile for all Solaris 8 and Trusted Solaris 8 clients from a single
    source.


    Trusted Solaris 8 can certainly provide a security that ensures peace of mind,
    but it is not right for every situation. The Trusted Solaris 8 model has its drawbacks,
    which must be weighed in a decision whether to use it or rely on the substantial
    security already available with the installation of Solaris 8 and the free distribution
    security enhancements available from the Sun Web site. Some of the more prevalent
    drawbacks are the additional expenses incurred in its implementation. Trusted
    Solaris 8 OE, aside from the expense to purchase, also requires substantially
    more resources to fully utilize its capabilities. More CPU, memory, and disk resources
    are required to compensate for the system overhead of facilitating the processing
    of advanced security measures such as extended labeling and permission control,
    along with auditing measures that not only use CPU and memory resources but disk
    space well. A higher cost is incurred in administration expenses. With RBAC, administration
    is divided


