  md: '# Chapter 8 • Configuring Solaris as a Secure Router and Firewall


    # Introduction


    With its foundations in Berkeley Software Distribution (BSD) UNIX, Solaris—much
    like its predecessors—is a multifaceted operating system. It is perfectly suited
    to running on a 124-processor E15000 that acts as the foundation of a multinational
    banking firm or reproducing seismographs of the earthquakes along the San Andreas
    fault over the last 10,000 years within a period of a few minutes, its performance
    and reliability as a secure router, secure gateway, and firewall are equally valuable.
    Although it will not outperform a hardware-based solution such as a Cisco router
    or a NetScreen firewall, it does offer reliable, stable service. Solaris is the
    operating system choice for many commercial packages that provide firewall services.


    My first exposure to Solaris for such a task was at a small Internet service provider
    (ISP) in eastern North Carolina. In the first year of operation, the ISP anticipated
    no more than 1000 clients from the small coastal town. The end of the year came—with
    a total of 7000 clients, new service offerings in additional towns along the Carolina
    coast, and lots of problems. Not only was this growth not anticipated; worse yet,
    it wasn''t budgeted. Faced with the problem of an internal network and server
    pool both in need of access control, we faced the dilemma of what to do with what
    had. This type of dilemma often inspires the kind of panic that proves the resilience
    of systems administrators.


    In this chapter, we first examine the use of Solaris as a secure router and gateway.
    Next, we look at using Solaris as an Internet firewall, and we discuss using host-based
    firewalls on Solaris. Finally, we talk about guarding access. We highlight the
    reasons for using Solaris for these types of tasks and talk about some of the
    security implications involved with using the OS in each scenario. We also examine
    implementations of these types and discuss some of the steps required in implementation.


    # Configuring Solaris as a Secure Router


    To differentiate a host and router, let''s first define the functions of each.
    A host is typically a system with any number of interfaces that may or may not
    be connected on the same network. A host does not allow traffic to enter in one
    interface and out another. A typical server in a high-availability configuration
    has multiple interfaces, with each interface connected to a different network
    segment to prevent a single point of failure.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_248_0.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Configuring Solaris as a Secure Router and Firewall - Chapter 8


    A router is a system with a minimum of two interfaces connected to at least two
    segments of different networks. The router allows traffic to its destination by
    entering one interface and passing out through another. An interface loosely defined
    as a physical connection that allows other systems to communicate with the system
    via Ethernet, serial port, point-to-point link, or some other method. We will
    not get into a discussion of how the decision is made for the traffic to reach
    its destination; that issue is outside the scope of this chapter. A good reference
    on traffic routing and TCP/IP is TCP/IP Illustrated, Volume 1: The Protocols,
    by W. Richard Stevens.


    # Reasoning and Rationale


    Let''s attempt to answer the inevitable question, "Why use Solaris?"There are
    numerous platforms and designs available to use as a low-cost router, all of which
    are viable solutions. Some key factors in selecting one over others are the availability
    of hardware, the amount of time allotted to deploy the solution, and business
    needs. Solaris is a good choice because it is stable, easily secured, and easily
    deployed.


    Solaris is a stable operating system, capable of months and years of continuous
    uptime without the need for rebooting. Solaris is scalable, able to run in both
    small and large environments on systems from workstation size to enterprise class.
    Additionally, Solaris is an easily secured operating system. The ability to shut
    down all services on the system, make configuration changes to a running kernel,
    and create multiple layers and access control on the system without bouncing the
    system make Solaris the perfect choice for a network with a 110-percent uptime
    requirement.


    Finally, Solaris is easily deployed as a router or gateway. The stock install
    of Solaris provides connectivity between the divided portions of the same network
    or even different networks altogether by turning up the system with the interfaces
    configured to communicate with connected networks. This feature of simplicity
    is a double-edged sword. It can lead to easily deploying a system to perform the
    important job of routing network traffic. It can also result in an unintended
    and unrestricted path between two networks that could be exploited to leverage
    an attack.


    # Routing Conditions


    In a default installation, Solaris routes traffic if a specific set of conditions
    are met. These conditions are:


