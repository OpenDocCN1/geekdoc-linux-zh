- pgno: 51
  md: 'Introducing Solaris Security: Evaluating Your Risk  Chapter 1


    # Summary


    The goals of this chapter were to introduce you to good security practices and
    to begin orienting you to think with a “security first!” mindset, because if your
    systems aren''t secure, neither is your business. We''ve also covered a lot of
    ground in this chapter with respect to hardening Solaris hosts.


    We''ve exposed the default Solaris security levels by noting that the umask allows
    any user to read any other user''s files by default. To keep users honest, we''ve
    looked into displaying Authorized User banners where appropriate.


    Our evaluation of Solaris security configuration showed us that cleartext protocols
    were extremely insecure. To combat attacks from the external network, we''ve also
    learned to shut off unnecessary system daemons (such as finger and charg), and
    to demote some programs (such as Sendmail) to run with lower privileges.


    Monitoring our system security has taught us to examine the access logs and the
    sulog for signs of preliminary system invasion. We introduced GUI monitoring tools
    such as sdtprinter and sdtprocess. Failed logins should now be logged in /var/admin/loginlog.


    Our Solaris system security was tested by informing users about choosing strong
    passwords and then using a password cracking program against the /etc/shadow file
    to ferret out any of our users'' poor password choices. We also looked at tracking
    insecure file permission modes using the find command.


    Similarly, we tightened the OpenBoot PROM security by requiring a password to
    make modifications to the system''s settings, or when choosing to boot from any
    media other than the default. also looked into adding another Authorized User
    banner to dissuade intrusion, and discovered how systems can be cracked if the
    intruder has enough physical access to the system.


    Finally, we learned how to document our Solaris systems by taking periodic snapshots
    of system performance using command-line tools. We also learned how to document
    and track changes to the system in such a way that unauthorized changes can be
    easily identified.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_51_0.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Solutions Fast Track


    Exposing Default Solaris Security Levels


    +   - Consider changing the umask in /etc/profile from the default value of 022
    to something more restrictive, such as 027.

    - Disable FTP access for all users by adding every entry from /etc/passwd to /etc/ftpusers.
    Restore access on a case-by-case basis by removing entries from /etc/ftpusers.

    - Replace insecure cleartext daemons, such as FTP, Telnet and the Berkeley r-commands,
    with a secure replacement like SSH or OpenSSH.

    - Create Authorized Use banners in /etc/motd and /etc/issue.


    # Evaluating Current Solaris Security Configurations


    +   - Examine and disable any unnecessary network services, such as finger and
    echo.

    - Some system daemons, such as Sendmail, run with more privilege than necessary.
    Reconfigure these to run with less privilege as a nonroot user.


    # Monitoring Solaris Systems


    +   - Two excellent GUI monitoring tools are sdtprocess and sdtpermeter.

    - Record failed login attempts by creating the /var/adm/login logfile.

    - Keep an eye on who is logging into the system using the who and last commands.

    - Find out who has been using the root account by tracking access to the su command
    in /var/adm/sulog.


    # Testing Security


    +   - Instruct your users in the ways of selecting secure passwords.'
