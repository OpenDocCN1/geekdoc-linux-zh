    # Using the arp Command on Solaris


    Suppose you run your Nmap scans, read the output and noticed that a system is
    at IP 10.1.1.90. Referring to your records, you realize that this IP is not in
    our dynamic host control protocol (DHCP) scope and has not assigned to any system.
    Nmap has reported some normal open ports and fingerprinted it as a Solaris 8 system.
    What next? One place is to look the arp cache. This is a table that translates
    ethernet hardware (MAC) addresses to IP addresses. In essence, arp is the glue
    between OSI layers 2 and 3. To view the arp cache, issue either one of the following
    commands:


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_103_0.png)'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Chapter 3 - Securing Solaris with Freeware Security Tools


    ```

    %arp -a


    or

    netstat -p

    ```


    These commands will give identical information, similar to this:


    Net to Media Table: IPv4


    | Device | IP Address | Mask | Flags | Phys Add |

    |---|---|---|---|--|

    | hme0 | 10.1.1.11 | 255.255.255.255 | | 08:00:20:73:51:02 |

    | hme0 | 10.1.1.30 | 255.255.255.255 | SP | 08:00:20:9f:1c:c6 |

    | hme0 | 10.1.1.33 | 255.255.255.255 | | 08:00:20:a8:99:14 |

    | hme0 | BASE-ADDRESS.MCAST | 240.0.0.0 | SM | 01:05:00:00:00:00 |


    First, let''s look more closely at the physical address column. You will notice
    that these three addresses start with 08:00:20. This is significant because the
    high order octets (first six digits) are assigned by the IEEE as Organizationally
    Unique Identifiers (OUI) or Vendor Addresses. A list of these three octets and
    which vendors they are assigned to be found at www.iana.org/assignments/ethernet-numbers.
    Looking at this URL, we find that the 08:00:20 is assigned to Sun Micros. Since
    changing MAC addresses on Sun equipment is difficult (though not impossible),
    it is a safe bet to say that the interloper is really a Sun Micros computer.


    Here, the plot may thicken. When using Nmap for a scan, When Nmap wants to connect
    to a host, it needs to take the IP address it has been given, a packet, and send
    that packet down the TCP/IP stack for the kernel''s drivers to transmit. When
    the packet reaches the ethernet device address, an ethernet frame must be crafted,
    and in that frame the hardware address of the target must be determined. If information
    is in our arp cache, no other lookups are done. If the information is not in the
    arp table, the sending host will send out an arp broadcast, to the ethernet broadcast
    address (FF:FF:FF:FF:FF:FF) asking “Who is 10.1.1.11?” on the local network, and
    not cut out by a router or VLAN, 10.1.1.11 will answer back with something like
    10.1.1.11 is 08:00:20:73:51:02. The network stack will take this information,
    pass it on to the bit of the kernel crafting the ethernet frame, and send it on
    its its way. This is all well and good, but it is entirely likely that some malicious
    (other than an unknown system on the network) is going on.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_104_0.png)'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Securing Solaris Freeware Security Tools • Chapter 3


    Suppose 10.1.1.11 is a known system, but it was supposed to be a Linux system.
    Nmap just reported that it is a Solaris 8 system and confusion reigns. Referring
    to your meticulous documentation, you see that IP 10.1.1.11 should have a MAC
    address of 08:00:02:11:22:33 (Cisco network prefix). This is not the real 10.1.1.11.
    Someone possibly tried to probe your arp cache by publishing 08:00:20:73:51:02
    as the hardware address for 10.1.1.11. This is one of the shortcomings of most
    arp implementations. Solaris mischievously picks up information it sees on the
    wire, regardless of whether or not the information is a response to an arp command.
    It learns this new information and caches it for some period of time (determined
    by the kernel tunable `arp_cleanup_interval`). Your Linux system may still be
    on the network, but at layer 2 its address is known as someone else''s, there
    isn''t much you can do, except to hunt down the offending machine and remove it
    from the network. A shortterm solution would be to clear the arp cache or publish
    a static arp entry for the real 10.1.1.1 system with the following command:


    ```

    %arp -s 10.1.1.11 08:00:02:11:22:33 pub

    ```


    This will replace the bad arp entry with a good entry and mark it as published.
    Any time another system requests the MAC address for 10.1.1.11, your local system
    will respond and hopefully beat out the response of the rogue machine. None of
    this is guaranteed, but sometimes it works, especially if you are on the fast
    side of a high-latency link. In the end, the arp command helps you get more information
    about an interloper and may help you get around the problem in the short-term.
    The certain resolution is to simply track the system and remove it from your network.


    # Detecting Unusual Traffic with Network Traffic Monitoring


    In this section, we take a look at some free tools that can help an administrator
    gauge, monitor, and better understand the nature of traffic on a network. The
    best practice for any system that carries security work is to make it a separate
    in no other capacity than a security monitoring and enforcement system. In our
    previous scenarios, we developed a system in our company, admin.incoming-traveller.com,
    to play this role.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_105_0.png)'
