- pgno: 106
  md: '# Using Snoop


    First let''s take a look at one of the best tools on a stock Solaris system: Snoop.
    Snoop is very powerful and warrants a look at some of its more common com-mands
    and options:


    +   - <device> Tells Snoop which device to listen on. Critical on systems with
    multiple physical interfaces.

    - -o <file> Tells Snoop to put its output into a snoop-readable file.

    - -i <file> The opposite of -o.This reads the snoop output file back in playback
    for the session capture.

    - -r If given, Snoop will not resolve IP addresses to hostnames. Keeps Snoop from
    adding its own traffic (in the form of DNS lookups) to the network.

    - [expression] Snoop allows you to pass expressions to it, composed of protocols,
    keywords, sources, destinations, and other primitives. The expression language
    of Snoop is its most powerful asset. The man page should be read carefully for
    a full understanding.


    Snoop grabs packets off any running interface by placing that interface in what
    is called promiscuous mode. Normally, an interface will ignore any packet whose
    destination address does not match the interface''s own. In promiscuous mode,
    the interface grabs a copy of every packet it can, regardless of the packet''s
    final destination. If you look over the man page for Snoop, you will may restrict
    the captured packets by nature of their source or destination address, the protocol
    type, the payload type, ether type or one of many other cri-teria. Using Snoop
    with a simple expression can let capture bits of traffic at your network. For
    example, suppose you want to look at DNS queries leaving your network. A simple
    Snoop command to do this might like:


    ```

    $snoop -d hme0 -o /tmp/DNSq_snoop.out proto 17 port 53 !

    dst net 10.1.1.0

    ```


    We are telling Snoop to use interface hme0 to listen for IP protocol 17 (UDP)
    with a port of 53, and we want anything whose destination is not the local network.
    The last part of this command is a simple example of the expres-ions I mentioned
    at the start of this section. The first primitive is proto, which tells Snoop
    that we will to filter by protocol. The 17 is the protocol number. The next primitive,
    port, tells Snoop which the traffic should be'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Securing Solaris with Freeware Security Tools • Chapter 3


    traveling to or from. We did not specify, Snoop will want to tell it if you want
    to check just the source or destination point. The "!" is the common negate operator
    and affects the rest of the expression after. We use the dst primitive to signify
    destination and the net keyword to tell Snoop we care about the entire 10.1.1.0
    network. With negate operator in first of this, we have told Snoop to be more
    selective in its capturing and filtering. Finally, the -o switch Snoop to drop
    the data into the file /tmp/DNSq_snoop.out. We can later go back and use the -i
    switch to read this file to standard output. With a simple and shell script, we
    can start and stop this Snoop at will, which can be very handy if you suspect
