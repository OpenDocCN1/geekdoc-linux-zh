  md: '# Chapter 1 • Introducing Solaris Security: Evaluating Your Risk


    As you can see, Solaris includes a great number of open ports and available network
    services by default, many of which can be disabled to enhance system security.
    Most of these deemons are run from /etc/inetd, and can be disabled by commenting
    out the corresponding section in /etc/inetd. Unless you have an explicit need
    for them, the following services can be disabled without impact to your system:


    +   - Echo

    - Discard

    - Daytime

    - Charger

    - Finger

    - Login (mostly duplicates exec and shell)

    - Printer

    - UUCP


