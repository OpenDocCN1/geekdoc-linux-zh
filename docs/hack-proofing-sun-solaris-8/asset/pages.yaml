- pgno: 62
  md: '# Chapter 2 · Securing Solaris with the Bundled Security Tools


    from the rear as his tanks maneuver and anticipate Rommel''s attack, taking decisive
    and devastating action against Rommel''s onslaught and negating it. Patton chuckles
    behind his glasses and mutters, “I read your book, you magnificent bastard. I
    read your book.” Similarly, as administrators in charge of our organization''s
    data security, we must “read the book” of the hackers and attackers who want to
    get that data.


    # Choosing Solaris 8 C2 Security


    SunSHIELD Basic Security Module (BSM) is a script-driven package that is provided
    during the default install of Solaris 8 OE. Comprehensive auditing capabilities
    are introduced into the Solaris operating environment with Solaris 8 C2 security.
    Under Solaris 8 with the BSM installed, the administrator can establish auditing
    for most of what would considered the most prevalent violations of security, such
    as login failures, remote login failures, access violations, and file modifications.
    Auditing, and in itself, can be a deterrent to a would-be hacker. Knowing that
    his attempts will be recorded could deter some of the more common internal threat
    or misuse of protected data. However, even though auditing might not intimidate
    some more ambitious threats, it is still an administrator''s best bet at auditing
    an incursion and nullifying it.


    Auditing is a balancing act. No other optimal system function can be a greater
    burden on system resources. Auditing on a busy system, with auditing on all events
    turned on, would require the constant attention of a system administrator to monitor,
    analyze, and purge or archive the logs created. The CPU cycles, memory usage,
    and disk I/O would take toll on the system, robbing users of their resources.
    So the system administrator must pick and choose what features to audit and what
    to leave out in order to maximize the benefit of having an extensive security
    policy in place, but not to the point of overwhelming the system. A good routine
    to start with is to monitor the logs twice a day and archive once a week. So,
    within a short time, the system administrator can easily see the size of a audit
    log and calculate the amount of disk space needed for a week. This would also
    give the system administrator the chance to adjust the amount of auditing being
    done and balance it against the impact on the system. Barring an attack on the
    system or some other anomaly, this practice provides an adequate policy for maintaining
    audit logs with a minimum of detriment to the system.'
