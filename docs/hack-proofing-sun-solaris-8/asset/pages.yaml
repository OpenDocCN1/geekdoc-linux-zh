    # Tracking Attachments


    If you open /etc/sendmail.cf in a text editor and take a look at the lower half
    of the file, you will notice quite a few rulesets. Sendmail uses these rules to
    determine a number of things, from the proper formatting of e-mail addresses,
    to the proper procedures for allowing or denying mail relay. In the most basic
    sense, sendmail rule does a match on a whole or partial part of an e-mail using
    the left-hand side (LHS) of the rule, and then performs the action that follows
    in the right-hand side (RHS) of the rule. For example:


    ```

    $local_check_header

    ```


    This rule is very simple. The LHS watches for the Subject: portion of the e-mail
    header. Once a match on the phrase Subject: found, the RHS of the rule tells sendmail
    to go to the ruleset local_check_header. In local_check_header, we find the following:


    ```

    Slocal_check_header

    ```


    ```

    RHello There Business $* $$error $: $(SpamMessage)

    RRe: ''YOU''VE WON! $* $$error $: $(SpamMessage)

    ```


    The Slocal_check_header simply denotes the subject of our ruleset. The LHS of
    the next line matches whatever comes after the Subject: portion of the header
    with the phrase Hello There Business, then a space, a wildcard for additional
    characters that may appear later in the subject header. The RHS tells sendmail
    to take a couple of actions. First, sendmail is told to invoke the special error
    mailer, indicating that we are going to return an error message to the sender
    of this


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_239_0.png)'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# 216 Chapter 7 • Providing Secure Web and Mail Services


    e-mail. Then, sendmail is directed to carry out the macros and procedures in the
    SpamMessage routine. To be thorough, we would have defined this routine between
    the initial check and the final ruleset. The whole package would look like as
    we walk through it once more for clarification):


    ```

    # The hook into the header(the H class)

    HSubject: $$local_check_header


    # The D macro we carry out on a good match in the ruleset

    D(SpamMessage)"553 Your message may contain spam.

    Please e-mail abuse@$j if you have questions or concerns."

    ```


    ```

    # The ruleset

    Slocal_check_header

    RHello Business $* $$error: ${SpamMessage}

    Re: YOU''VE WON! $* $$error: ${SpamMessage}

    ```


    Confused? Don''t worry. What follows is a step walkthrough of what your Sendmail
    server is thinking as it processes an incoming e-mail message:


    +   - I am sendmail, I''ve received a message from mail.nox.net. I will now process
    this e-mail.

    - <busy work here with the default rulesets>

    - I am going to check this message now, because it has Subject: in the header.

    - I am going to send this message through ruleset local_check_header.

    - I am checking the Subject: line against a match for Hello There Business, followed
    by a space and zero or more characters.

    - I have no match. Next rule.

    - I am checking the Subject line against a match for Re:YOU''VE WON!, followed
    by a space and zero or more characters.

    - I have a match here! I will check the RHS of this rule.

    - The RHS of this rule tells me to handle this with my error mailer and to process
    the macro in SpamMessage.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_240_0.png)'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Providing Secure Web and Mail Services • Chapter 7


    +   - I go to SpamMessage and generate an e-mail to the originator and noox.net,
    telling them to contact abuse@incoming-traveller.com because their e-mail looks
    like spam to.


    +   - <end>


    Keep a couple of things in mind sendmail rulesets. First, the white space between
    the LHS and the RHS must be tabs. Sendmail will not process the ruleset properly
    if you use spaces. Also, this ruleset is notoriously inefficient—hence every e-mail
    we receive has a subject header of some type. This means that every single message
    coming in to a server running the ruleset in this will be scanned and compared
    against the LHS rules. For a low-use server, this is not a problem. If you are
    a large site, and you process several thousand megabytes of e-mail per day, you
    will bury your servers under the load of checking these headers. As with any tuning
    and testing, be sure to carry out changes to our sendmail.mc and sendmail.cf files
    in a sandbox environment. Some of the sendmail rules are very particular and do
    not react well to tinkering. Luckily, most of the information in sendmail.cf is
    easily replaced by just generating a new configuration file out of your .mc files.


    www.syngress.com'
