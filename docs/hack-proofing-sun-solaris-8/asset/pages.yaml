- pgno: 163
  md: '+   Rename RPC links /etc/rc2.d/{S71rpc,S76scnd} to /etc/rc2.d/{NOS71rpc,NOS76scnd}
    to disable RPC services.


    +   Rename expresve link /etc/rc2.d/S80PRESERVE to /etc/rc2.d/NOS80PRESERVE. Expresve
    recovers data from unsaved vi sessions but historically has been vulnerable.


    +   Type /bin/rm "/etc/auto_*" /etc/dfs/dfstab. (Be sure to note that there is
    no space between and * in this command!) Note: If you are using NFS with the automounter,
    do not perform this step.


    The next step is to look for all SUID programs left on your system. This task
    is easily accomplished with the use of the find command, as in the following:


    ```

    find /type f \ -perm -u+s -o -perm g+s \ -ls

    ```


    Redirect the output to a file later usual.The tricky part comes in you aren''t
    really familiar with the use of the suid or sgid commands. My install of Solaris
    8 came with 59 binaries with either suid or sgid. Although I know most of them,
    I can say that I am familiar with all of them. A command I found useful was awk
    command:


    ```

    awk ''/f none [246] ''{print}'' /var/sadm/install/contents

    ```


    It''s pretty handy for the simple reason that it not only lists SUID and SGID
    files, but also lists the package with which each file was installed. Using this
    command, you can get a little more information about a new or unknown command.
    Unfortunately, no one can give you a magic bullet and then you specifically which
    files can and can''t be SUID/SGID. This is something you need to determine on
    the needs of your system. Some applications require specific things. There is,
    however, Sun distributes a wonderful tool called FixModes, written by Casper Dik
    and available at www.sun.com/blueprints/tools/. It is highly recommended that
    you test this tool, which can save you many headaches and keystrokes.


    The next step is to disable the automounting of CDs and diskettes. This step helps
    that you are in total control of the file systems mounted on a computer you are
    managing. When you use the automounter feature, however, any user can mount whatever
    they please. There is no way to know what is on a user''s disk. It could contain
    malicious code or other objectionable material. Furthermore, diskettes are a handy
    way for information—information that might'
