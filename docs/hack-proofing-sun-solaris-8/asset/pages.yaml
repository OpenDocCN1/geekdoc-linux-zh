- pgno: 212
  md: '# Chapter 6 - Securing Your Network


    How can you increase the security of these protocols? In the newest versions of
    Solaris, Sun has included facilities such as Kerberos authentication, which you
    can use in conjunction with telnet to encrypt password traffic. Kerberos marginally
    increases the security of telnet making it difficult for a potential attacker
    to gather passwords through network sniffing because no passwords are sent in
    cleartext. You can also secure remote authentication using third-party authentication
    plug-ins, as S/Key. With S/Key, passwords are sent in cleartext, but each password
    is only valid for a single use, so capturing the password doesn''t really do the
    attacker good. S/Key requires a shared seed, which must be kept private, and new
    keys need to be generated at periodic intervals.


    Although Kerberos and S/Key implement security through heightened authentication
    methods, neither of them offers any real security for your data because all protocol
    used by telnet (the Berkeley r-commands) is unencrypted. An attacker could easily
    copy proprietary data passed between systems even if you use secure authentication
    methods. Most cleartext protocols, such as telnet, are also vulnerable to session
    playback. A session playback is a retransmission of previously captured packets
    retransmitted in a way that the target host believes that the source host has
    initiated a new session and accepts the playback as a valid communications stream.
    Let''s explain why session playback is undesirable. If an attacker is able to
    record a session in which an administrator has added a new account, the attacker
    can slightly modify this session so that a new account is added to the system.
    If the attacker gives the new account UID of 0, the attacker has gained superuser
    privileges on the system. Sun doesn''t have any patches that will prevent these
    types of attacks because they are based on protocol weaknesses and not operating
    system weaknesses. Clearly, cleartext r-commands are undesirable security risks.


    Unfortunately, the Berkeley r-commands have still more insecurities stemming from
    the way they perform authentication. Remote access with telnet, you must always
    enter a password to access a system. However, you can configure the Berkeley r-commands
    to allow access without a password, using only host-based authentication. These
    use the files /etc/hosts and $HOME/.rhosts to configure accounts, which are allowed
    to access accounts on the hosts without a password. Both files use similar formats,
    in that each file lists hosts any, or all users, or map remote user accounts to
    local user accounts. Despite the superficial usefulness of this system, it is
    fraught with insecurities. For example, if an attacker is able to gain write access
    to another user''s home directory, or more specifically the user''s .rhosts file,
    the attacker can add his account and gain access'
