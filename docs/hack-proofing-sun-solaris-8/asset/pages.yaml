- pgno: 262
  md: '# Configuration Files


    Putting everything in place to make IPv6 functional on a Solaris 8 system is relatively
    easy. One prerequisite is having the system to route traffic configured for regular
    IPv4 traffic. Once we have completed the steps for configuring an IPv4 router,
    we can proceed with the setup of an IPv6. In this section, we will talk about
    the files necessary to get an IPv6 router working. These files include the hostname6.interface
    file, the nppd.conf file, and the ipodes file.


    # The hostname6.interface File


    This file is similar to the previously discussed hostname6.interface for IPv4.
    The syntax of items contained in the hostname6.interface file is different from
    that of the IPv4 version, however.


    Previously, the only thing needed in this file was either an IP address or a hostname
    with an entry in the /etc/hosts directory. Now additional parameters must be entered
    in the hostname6.interface file. These parameters are parsed by the S30network.sh
    script in /etc/rc.d when the system boots and are then passed to ifconfig. In
    the following example, we see a hostname6.interface entry for our IPv6 router:


    ```

    addif sturgeon.mydomain.com/64 up

    ```


    The first parameter we see is addif. The addif parameter is an extension of the
    Solaris ifconfig command, which tells ifconfig to add the address to the next
    available interface. Since we are seeing this in the /etc/hostname6.hme0 file,
    ifconfig searches the interface table for the next available virtual interface
    on the hme0 device. The address resolving to sturgeon.mydomain.com will be configured
    to this interface. At the end of the line, we see the up command, which makes
    the network interface accessible. As we can see in Figure 8.3, this address was
    configured to the hme0:1 device.


    As we can see, the address is now configured with the ROUTER flag and is ready
    to handle traffic from other hosts. However, additional configuration steps have
    been taken prior to the interface being brought up. Shortly we will talk about
    these steps, in addition to the configuration steps necessary for ifconfig to
    resolve the address for sturgeon.


    One subtle point we have not mentioned is that we are configuring this interface
    with a static address. There is a good reason to do so. With IPv6, it''s possible
    to autoconfigure hosts when they boot. These systems poll the network during bootstrap
    to get information necessary to communicate with the rest of the network. If'
