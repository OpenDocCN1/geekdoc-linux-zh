    The Linux operating system continues to gain market share, based largely on its
    reputation as the most secure operating system available. The challenge faced
    by system administrators is that Linux is only secure if installed and configured
    properly, meticulously and carefully with a wide variety of Open Source security
    tools. Hack Proofing Linux provides the system administrator with coverage of
    the most popular Linux operating systems and Open Source security tools, along
    with the techniques necessary to configure and maintain Linux systems and counter
