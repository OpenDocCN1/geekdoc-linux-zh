  md: '# Stopping IPv6 Routing


    The process of stopping IPv6 routing is simple. To stop an IPv6 system from routing
    traffic, there are two methods we can use.


    # Method 1: Rebooting the System


    This method requires a reboot of the system:


    +   1. Remove or move the /etc/inet/ndpd.conf file. If we want to save the ndpd.conf
    file, we must move it to a different location, or change the name to something
    like NOndpd.conf. When the system boots and does not find this file, in.ndpd will
    start in host mode.

    2. Reboot and test. After the system has been rebooted, check the bootstrap output
    for the string “Starting IPv6 neighbor discovery.” Additionally, check the ip6_forwarding,
    ip6_send_redirects and ip6_ignore_redirect variables via ndp to ensure they are
    set to 0.


    # Method 2: Not Rebooting the System


    This method does not require a reboot of the system. It requires no downtime on
    the part of the interfaces, and the system will continue to be reachable while
    these actions are performed:


    +   1. Remove or move the /etc/inet/ndpd.conf file. If we want to save the ndpd.conf
    file, we must move it to a different location or change the name to something
    like NOndpd.conf. When the system boots and does not find this file, in.ndpd will
    start in host mode.

    2. Send the HUP signal to in.ndpd. This can be done via the command killall -1
    in.ndpd. Performing this action will restart in.ndpd, and it will attempt to reload
    the /etc/inet/ndpd.conf file. When it does not find the file, it will enter host
    mode.

    3. Check local interfaces to ensure that the ROUTER flag is no longer present.
    In Figure 8.6, we see that the interfaces are designated as routing interfaces.
    Notice the differences between Figures 8.6 and 8.3. Notice the change in the Router
    flag in the output of ifconfig -a. The system in Figure 8.6 is in a multihomed
    state.

    4. Disable IPv6 kernel module routing parameters. This can be done via ndp. We
    need to set the parameters ip6_'
