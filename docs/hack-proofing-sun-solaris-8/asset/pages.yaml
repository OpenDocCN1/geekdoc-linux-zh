    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_229_0.png)


    # Setting Permissions


    One major concern with Web servers is their accessibility. With some exceptions,
    Web servers are used as a virtual presence for many types of organizations to
    share information with the general public. Behind the scenes, this Web servers
    need to make a certain subset of their files readable to the whole world. One
    thing to keep in mind is to set permissions properly on your HTML and other Web
    documents. The user Web software runs as at least read access to these files.
    In many cases, that, same user does not write access to access these files. By
    setting your html files to 444, you add an extra measure of protection against
    defacement attack. If the server software is compromised, it can be used to write
    data to any files that effective user id has access for. By restricting write
    access, you limit the chances of falling prey to a Web defacement attack.


    You may also want to consider using the freely available Tripwire product to maintain
    a listing of checksums and permission settings on your Web server’s document tree.
    By updating and running Tripwire regularly, you can spot any changes quickly and
    respond to them accordingly. The Tripwire application is covered in Chapter 11.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_229_1.png)'
