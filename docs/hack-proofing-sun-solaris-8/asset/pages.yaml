  md: '# Chapter 8: Configuring Solaris as a Secure Router and Firewall


    # Configuring Solaris as a Secure Router


    +   - The ability to shut down all services on the system, make configuration
    to a running kernel, create multiple layers and access control on the system without
    bouncing the system makes Solaris the perfect choice for a network with a 110-percent
    uptime requirement.


    +   - The stock install of Solaris provides connectivity between the divided portions
    of the same network or even different networks altogether by simply turning up
    the system with the interfaces configured to communicate with connected networks.


    +   - A default installation of Solaris with more than two interfaces (including
    the loopback interface) that aren''t configured by DHCP will route traffic by
    default.


    +   - You don''t have a hope of security or integrity for your network without
    first a secure router. Therefore, the implementation of a system as a router must
    be secure by design. This consideration must be made at the very beginning of
    system design and observed diligently through deployment and afterward in maintenance.


    # Routing IP Version 6


    +   - Solaris 8 is IP version 6 capable. It is possible to configure an interface
    to communicate with an IPv6 host on the network and retain IPv4 communication.
    This is known as running a dual stack.


    +   - Putting everything in place to make IPv6 functional on a Solaris 8 system
    is relatively easy. A prerequisite is having the system route traffic configured
    for regular IPv4 traffic.


    # IP Version 6 Hosts


