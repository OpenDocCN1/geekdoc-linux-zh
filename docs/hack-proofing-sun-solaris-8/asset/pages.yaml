    Recourse Technologies offers a very powerful tool ManTrap. It doesn''t emulate
    the services and presence of another OS; it runs a full version of OS in a locked-down
    virtual cage. You can also configure multiple cages to give the impression of
    a network of systems. One Sun ULTRA 5 can be configured to


