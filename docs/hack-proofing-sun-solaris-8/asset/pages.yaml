- pgno: 164
  md: '# Chapter 5 — Securing Your Files


    be critical or confidential—to leave a system. You can disable the automount daemon
    by stopping the service (/etc/rc2.d/S74autofs stop) and rename the link from S74autofs
    to S74autofs, you can go all away and remove the packages that support automount.
    These are SUNWolver, SUNWvolu, SUNWvol. If you don''t plan to use the feature,
    it''s just good to remove the packages. If you plan to use automount, make sure
    a SUID binary is not used to control of the system. Solaris provides rmmount.conf(4)
    This file is the configuration file used to share diskettes and CD-ROMs (among
    other things). I strongly recommend adding the following options, which will prevent
    SUID execution:


    ```

    mount hfs -o nosuid

    mount ufs -o nosuid

    ```


    Also considering both diskettes and CD-ROMs using the read-only (ro) option:


    ```

    mount floppy* -o nosuid,ro

    ```


    It''s also a good idea to enable the Basic Security Module and make sure that
    the /etc/security/device_allocate file is in order. This file allows you to use
    either built-in or custom programs to properly purge data from a device before
    it is reused. For example, the following entry ensures that an FD device is properly
    purged before the insertion of a new diskette:


    ```

    # floppy drive

    fd0;fd;reserved;reserved;alloc;/etc/security/lib/fd_clean;

    ```


    Check the page for device_allocate(4) for all available options. Another smart
    thing to do is set the UMASK variable in the /etc/default/init file. This variable
    controls the UMASK of all processes started by the init daemon. If it isn''t set,
    the init daemon will default to the system UMASK, but it''s a good idea to make
    sure that you are running with a nice, restrictive value. 022 is the default value,
    but modify according to your needs. The next file to modify is /etc/default/login
    file, as follows:


    +   - Ensure that the UMASK=nnn entry is uncommented and that the value is sane
    one for your site. Again, the default is 022, which is acceptable for many purposes.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '+   Uncomment the SYSLOG_FAILED_LOGINS=n entry, and set the value to something
    like 3. This value determines how many failed logins will be allowed before syslog
    to record an event.


    +   Uncomment the RETRIES=n entry. Also set this value to 3, with the default
    being 5. This value determines how many retries a user (or attacker) gets before
    the login process exits.


    +   Change the CONSOLE= to reflect /dev/null as the console device. This prevents
    root login on any device and ensures that you have maximum accountability for
    everyone, including yourself.


    It''s also a good idea to modify the /etc/default/passwd file and increase the
    PASSLENGTH to 8 (which is the maximum).


    The next step is to make some changes to your file system read only files as you
    can. An attacker can''t use a Trojan horse against your system if he cannot write
    files. Many of these changes depend on how the file system has been created. Some
    admins create just one file system, the /system. They have justifications for
    this practice, but I don''t understand them. Making specific-purpose file systems
    eases both backup and general security. It also allows you the flexibility to
    place controls on those file systems. For example, if you make /dev /devices their
    own file systems instead of letting them live under the / file system, you have
    the flexibility of mounting some other file systems with the nosuid option. Here
    are some basic guidelines for /etc/fstab:


    +   Change the option in the last column of the /user entry to ro.


    +   Change the option in the last column of the /opt entry to nosuid.


    +   Change the option in the last column of the /var entry to nosuid,rw.


    +   Change the option in the last column of the / entry to remount,nosuid.,


    As always, test and verify that these changes suit the needs of your specific
    system.


    The next thing to look at is system logging. You need to create and set ownership
    of the /var/admin/loginlog file to ensure that failed login attempts are recorded:


    ```

    touch /var/admin/loginlog

    chown root:sys /var/admin/loginlog

    chmod 600 /var/admin/loginlog

    ```


