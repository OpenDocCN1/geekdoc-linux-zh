- pgno: 244
  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    Q: Is Apache a Sun product?


    A: No. Apache is maintained and released by the Apache Software Foundation. You
    can find the latest release at www.apache.org, along with detailed tutorials and
    detailed configuration information.


    Q: Which is better—Sun’s sendmail and the Sendmail Consortium sendmail?


    A: Technically Sun''s version is based on the Consortium version, so one should
    not be better than the other. However, when bugs or security holes are found,
    the Consortium version is patched quickly, so it tends to the more secure of the
    two.


    Q: Do I want to allow relaying on my mail servers?


    A: Actually, you may. You will need to allow relaying based on your needs for
    security and flexibility, though if you are in an organization with many remote
    users, especially dial-in users you may need to allow some level of relaying.
    Also, if you have a mutual agreement with another organization to spool email
    in the event of a disaster or outage (by way of a backup MX record or relay delivery),
    you will likely need to let that organization spool and relay e-mail for you and
    vice versa. You will also need to configure Sendmail to relay internal systems.
    For, if Sendmail is used as a gateway between the Internet and a corporate LAN
    running on Exchange and NT systems, Sendmail will need to be configured to relay
    for the system running exchange’s SMTP Service.


    Q: What is the best way to filter traffic handled by sendmail for virii?


    A: Several tools are available for just this purpose. Some of them are freeware,
    and others are commercial. You should evaluate each product based on your needs
    and make the choice that best suits your environment. Certain'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'products even integrate well with certain firewalls. Sendmail itself really
    should not be used as a content filter—it was never designed for this purpose.


    **Q:** If someone e-mails our local abuse account and tells me we are an open
    relay, what should I do?


    **A:** First, you will need to test your server. I recommend John Levine''s hlytst
    script, located at www.unicom.com/sw/lytest/. If the script determines that your
    relay is open, examine your sendmail.mc file, make any necessary changes, and
    generate a new sendmail.cf file. Stop and start sendmail and test again.'
  merge: -1
  img_proc: true
