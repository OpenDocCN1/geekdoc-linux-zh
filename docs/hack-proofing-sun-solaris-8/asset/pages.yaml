- pgno: 287
  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and assist you with real-life implementation of these concepts. To have
    your questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    +   Q: Does the secure implementation of a router described in this chapter make
    your network secure?


    +   A: No. The router itself will be secure. However, in order to provide a more
    secure network infrastructure, additional software will be needed. See the section
    on firewalling.


    +   Q: What tool do I need to create a fingerprint for the Sun Fingerprints Database?


    +   A: You will need md5. Sun provides an md5 implementation through the Fingerprints
    Database site.


    +   Q: Testing routing with the -g flag of traceroute fails. Why? What else can
    I do?


    +   A: There are many reasons testing this can fail. If there is a router, and
    the router does not permit source traffic, this will fail. The best approach is
    to place the system on the same segment of network. If traceroute does not trace
    to the system, making the interface to which the default route is not bound the
    default route of the testing system, then reaching other systems through the default
    route.


    +   Q: You speak of minimal services. What if I run DHCP on the network and want
    to host the DHCP Daemon on the router?


    +   A: Running the DHCP server on a router is not recommended. However, if you
    would like to do so, be sure that the daemon is listening only on the network
    control. A problem with the dhcpconfig program sometime caused the daemon to listen
    and attempt to answer requests on all interfaces. Check the run time options and
    ensure it’s functioning only on your network.'
  merge: -1
  img_proc: true
