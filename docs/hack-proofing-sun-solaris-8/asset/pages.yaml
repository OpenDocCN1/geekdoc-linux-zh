  md: '# Solutions Fast Track


    # Detecting Vulnerabilities with Portscanning


    +   - Portscan your own networks regularly and become familiar with your network
    residents.

    - Automate your scans, including results delivery, to make your life simpler and
    easier, but always be sure to take the time to review the results.

    - Most portscans require root privileges to use some of the more advanced features.
    Be certain your cron jobs run as root or you may get false results.

    - Even security software can be compromised from time to time. For jobs and scripts
    that must run applications as root, consider setting them up in a chrooted environment.
    Always limit your exposure.

    - Understand whether you absolutely need a port and service available on a system.
    Open services are an inviting target for malicious hackers.

    - Portscan everything, even your routers and firewalls. Nothing is necessarily
    immune from attack and compromise. Understand the whole network, from end to end.


    # Discovering Unauthorized Systems Using IP Scanning


    +   - A network scanner is only as effective as the IP documentation for network
    you are scanning.

    - Understanding and using arp tools is an important step toward discovering unwanted
    guests on your networks.

    - Familiarize yourself with the common hardware vendor MAC prefixes on your network.
    Maintain hard copies if necessary.

    - Conduct the ping sweeps at random times. Don''t fall into a pattern that a potential
    intruder may catch on to.'
  merge: -1
  img_proc: true
