- pgno: 326
  md: 'The first command disables the execution of code directly on the stack, while
    the second command causes any such attempt to be logged. Adding these to the /etc/system
    file will require a reboot. One caveat should be mentioned here: while these commands
    make it more difficult to successfully execute a buffer overflow, they do not
    prevent them completely. Nothing can prevent the attacker from constructing CALL
    frames to library calls and jumping into the library call. From there, a few calls
    and they will have allocated some memory and jumped to it.


    New overflows are discovered at regular intervals, but not all discovered in escalated
    environments or remote access. However, any buffer overflows discovered in processes
    that run under the root user ID or are discovered in setuid programs are to be
    taken very seriously and dealt with immediately. The best defense against known
    buffer overflows is to keep systems patched to the most current revision levels.


    # Buffer Overflow against a Web Server


    A overflow against a Web server on Solaris is nothing like a buffer overflow attack
    against Microsoft''s Information Server. Buffer overflows against Apache servers
    are typically targeted at the CGI programs run by the Apache server. These types
    of buffer overflows result in the Web server executing arbitrary commands in the
    context of the Web server account. Protecting against buffer overflows on a Web
    server involves two primary steps:


    +   - Run the Web server as a unprivileged user

    - Run the Web server in a chrooted environment.


    To run Apache as a unprivileged user, the user account that the daemon will need
    to be in the password file. This can be accomplished either by using an existing
    unprivileged account such as nobody, or by adding a user account such as httpd
    to the password file and locking the account. The /usr/sbin/useradd program can
    be used to create the account in Solaris, and the account can then be locked using
    the passwd command with the -l (lock) option as shown in the following:


    ```

    root@nostromo:

    # useradd -u 65535 -g 65534 -d /opt/www -s /bin/false -c

    # "Web Server account" -m httpd

    6 blocks

    root@nostromo:#

    ```'
