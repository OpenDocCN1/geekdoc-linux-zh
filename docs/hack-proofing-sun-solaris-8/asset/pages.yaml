    # Discovering Unauthorized Systems Using IP Scanning


    As an administrator, it is critical to track what systems exist on your network,
    what the role and purpose of each system is, who has access, what software is
    installed and what the role of each system is in the overall business. It is essential
    to document everything, from assigned IP addresses and hostnames, to installed
    applications, root passwords and user accounts. Some administrators prefer to
    keep this information in electronic format, but the most crusty among us is to
    have this data in analog format, or in a binder, locked away someplace secure.
    Whichever method you prefer, starting now and document with much diligence and
    accuracy as possible.


    A key part of this documentation process is knowing what systems are on your network.
    In large environments it is relatively simple for a moderately technical user
    to set up a system and get a legal IP address for your network. In order to understand
    which systems are present on your network, the Nmap tool may be used to conduct
    ping sweeps or ping scans. In this scenario, Nmap will take a range or several
    ranges of IP address and attempt to ping each address in that block. This is a
    task that should be carried out once a week (or more often if your concerns are
    greater) by the administrator.


    An bonus of Nmap is its extensive OS fingerprint database. Although you must run
    Nmap as root to utilize this feature, the benefits are wide-ranging. For example,
    let us assume that our company, Incoming Traveller, Inc is a Solarisonly shop.
    Assuming you have a well-documented network environment, and know what IPs are
    in use (and hence which IP''s should show up on the network), we will set up Nmap
    to inventory IPs in use and to inventory operating


