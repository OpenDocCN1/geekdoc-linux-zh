    # Understanding the Concept of Mandatory Access Control


    Mandatory access control (MAC), or labeling, as it is sometimes called, is a concept
    that provides a more comprehensive coverage of access permissions than administrators
    have been familiar with discretionary access control (DAC). DAC is, of course,
    the file protection mechanism widely used in UNIX, as illustrated in Table 2.1.


    # Table 2.1 Distributed Access Control Permission Structure


    | | Group | World |

    |---|---|---|---|---|---||

    | Owner | read | write | execute | read | write | execute |


    Although this mechanism is enhanced by devices like sticky bits and access control
    lists (ACLs), ultimately the responsibility for the protection of any given file
    is left to the user.


    MAC provides for a blanket concept of file and object protection. A label is a
    classification component that might or not have compartment components. Classifications
    are hierarchical in nature and can have as many compartments needed. Access to
    data is either provided or denied by a protocol of dominance between labels and
    their subcomponents. As an illustration, we define four labels, PUBLIC, CLASSIFIED,TOP
    SECRET, and NEED-TO-KNOW.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_74_0.png)'
