- pgno: 75
  md: '# Securing Solaris with the Bundled Security Tools • Chapter 2


    Each of these labels has compartment components that are divided into different
    organizational departments: Eng for engineering, Fin for finance, Sec for security,
    and IT for information technologies.


    As shown in Figure 2.1, the relationship of dominance in these classifications
    relates to both the classification and compartment of each label. To be said to
    dominate, the label under which a given individual works must be equal to or greater
    than the label classification of the data the individual is trying to access.
    So, for example, if a user were to log on and work under the (PUBLIC/Eng Sec IT)
    label, the user would not be able to access any of the data under the higher labels.
    On the other end of the spectrum, if a user were to come under the (NEED-TO-KNOW/Eng
    Fin Sec IT) label, he or she would be privy to the data in the system, aside from
    system files that are protected under special privilege. Now, to use a more specific
    example, should a user log in under the label (TOP SECRET/Eng IT), he or she would
    be disjoint from (CLASSIFIED/Fin) and not be able to access that label as well
    as any information with the NEED-TO-KNOW/Eng IT) But the (TOP SECRET/Eng IT) user
    would be able to access any information from his or her own level specification
    as well as (CLASSIFIED/Eng IT) and all the PUBLIC components.


