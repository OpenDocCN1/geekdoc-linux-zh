  md: 'Securing Solaris with the Bundled Security Tools \cdot Chapter 2


    +   **System administrator** This role can be looked on as the legislative branch
    of our analogy. The system administrator has the ability to perform standard tasks
    such as adding new users or configuring hosts, works, and printers. The system
    administrator has some limited role in modifying user properties. The system administrator
    goes about the day-to-day routine of system management, much the way Congress
    goes about finding ways to spend tax dollars.


    +   **Security administrator** This role is something like the judicial branch
    of the U.S. government. The security administrator is responsible for implementing
    the security policy of a company. Duties includes assigning labels and privileges
    for system objects, allowing access over the network, and modifying, defining,
    and implementing roles for users. The security administrator, however, cannot
    grant roles beyond the scope of the security administrator him— or herself. Like
    the Supreme Court, the security administrator interprets and implements policy
    in a fair and impartial manner—no matter who inconveniences.


    Having these three primary administrative roles assigned to individuals ensures
    that no one has discrete power over the system. Each one of these roles has the
