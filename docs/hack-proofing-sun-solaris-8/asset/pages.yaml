- pgno: 63
  md: 'Securing Solaris with the Bundled Security Tools • Chapter 2


    # Tools & Traps...


    # Deterrents


    For the most part, the deterrent of auditing as an effective, proactive means
    of protecting your data relies heavily on the subject being widely known. This
    is an area in which many administrators fail to accomplish their goals primarily
    because it involves procedures beyond their direct control. The idea behind using
    auditing should be used only reactively, as a last resort. In other words, you
    don''t want employees to find out that you have auditing in place when the security
    guards show up with empty boxes in which they should pack their stuff prior to
    being escorted from the building. This requires concerted effort between the administrator''s
    department and that of the human resources department, management, or whatever
    body services the training or initial orientation for employees. The employees
    must know, in no uncertain terms, exactly what their boundaries are with regard
    to security. They must know for what offenses they can be fired and for what they
    will be reprimanded. Then it is up to the administrator to decide whether the
    employee''s actions fall outside of management, or whether the guidelines established
    by security policy, or whether there was simply an accidental infraction. Establishing
    the basis of the situation is usually not too difficult the administrator has
    some experience with auditing. For example, if a user has multiple login violations
    with a username or she has on another system, that, of course, is merely an accident.
    But should there be multiple login violations using different usernames, the source
    needs to be investigated.


    Regardless of how well the fact that auditing is in place proliferated throughout
    organization, there will always be those who push the envelope. People who know
    better often get caught breaking the rules, and they often end up paying the price
    for it. There is rarely a way to convince someone who thinks they are indispensable
    and therefore above reproach that they are, in reality, neither. Unfortunately,
    with regard to system security, it falls under the duty of the administrator to
    provide that reality check, even if the task is sometimes an unpleasant one.


    www.synergy.com'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Configuring Auditing


    Auditing is enabled when BSM is configured for a system.The first step is to bring
    the system down to init level 1.This can be done with the following command from
    the root account:


    ```

    # /usr/sbin/init 1

    ```


    or


    ```

    # /etc/telinit 1

    ```


    C2 security is enabled with the /etc/security/bsmconv script, such as:


    ```

    # cd /etc/security

    # .bsmconv

    ```


    Then the system is rebooted and auditing is enabled. Conversely, C2 security can
    be disabled by following the same procedure and executing /etc/security/bsmunconv
    instead of /etc/security/bsmconv. The output of running the bsmconv script looks
    like the following:


    ```

    root # .bsmconv

    This script is used to enable the Basic Security Module (BSM).

    Shall we continue with the conversion now? [y/n] y

    bsmconv: INFO: checking startup file.

    bsmconv: INFO: move aside /etc/rc2.d/S92volmgt.

    bsmconv: INFO: turning on audit module.

    bsmconv: INFO: initializing device allocation files.

    The Basic Security Module is ready.

    If there were any errors, please fix them.

    Configure BSM by editing files located in /etc/security.

    Reboot this system now to come up with BSM enabled.

    root #

    ```


    The following code shows a listing of the /etc/security directory. Each of the
    files has a different functionality regarding associated aspects of the auditing


    ```

    root # ls -l /etc/security

    total 88

    drwxr-xr-x  3 root  sys  512 Mar 28 10:06 audit

    ```


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_64_0.png)'
  merge: -1
