    Check for the /etc/notrouter file and if it exists, remove it. The /etc/notrouter
    file is used to keep the system from being configured as a router. A typical system
    on which this file will exist by default, nor is there a configuration option
    in the install process to create it. A correctly configured multihomed host. This
    file is not created. Therefore, a freshly installed system will not have this
    file and so this will not be a concern. However, you should manually check previously
    installed hosts. If this file exists, remove it.


    # Step 6: Poll /dev/ip for the Status of the ip_forwarding Variable


    After the system bootstrap, poll /dev/ip for the status of the ip_forwarding variable.
    The system will not route traffic if IP forwarding is not turned on. The command
    to query the IP is ndd -dev/ip. Therefore, if you’ve taken the previous configuration
    steps, reboot the system, and the IP forwarding variable of the IP kernel module
    will be polled to ensure that the system is prepared to route traffic. The result
    is a Boolean. If the variable returns 1, the configuration was successful and
    the system is ready to route. If the variable returns 0, there was an error somewhere
    in procedure and the system will not route traffic.


