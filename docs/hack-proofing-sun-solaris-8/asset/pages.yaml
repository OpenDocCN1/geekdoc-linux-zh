- pgno: 120
  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to boost your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    Q: Will portscanning affect my network security negatively?


    A: This depends. 99.999% of systems are not affected in a detrimental sense by
    portscanning. There are some operating systems that have bugs in their inert stacks
    that portscanning could exploit, but most vendors have long patched these bugs.


    Q: What is arp and why is it important?


    A: arp stands for Address Resolution Protocol and it is the means used by a system
    to translate an IP address to a hardware (MAC) ethernet address. Without arp,
    networks simply wouldnt function without the existence of an /etc/ethers file,
    which maps IP’s to MAC addresses statically. The biggest problem with arp is that
    there is no type of authentication involved in the protocol. Any system can advertise
    a hardware address for a given IP and no other system has the ability to verify
    the identity or integrity of the verifier.


    Q: Where can I find freeway security tools?


    A: Nmap is located at www.insecure.org, and Sport is located at www.snort.org.
    Sudo can be obtained from a number of places, the quickest one being www.sunfreedom.com.
    Always obtain this software from trusted, verifiable sources. Compiling a backdoor
    version of this software and then deploying it would be a very bad idea. Check
    and verify the MD5 checksums for the software. If they don''t match, notify the
    site maintainer and obtain a clean clean version.


    Q: When should I run my network scans?


    A: I recommend running your scans during two distinct periods. First, run them
    at night, when no one will be on the network. This minimizes additional traffic
    overhead generated by a scanner. Also run your scans during


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_120_0.png)'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Securing Solaris with Freeware Security Tools • Chapter 3


    normal business hours to get a feel for the true working environment of your network.
    If traffic is a concern, run Nmap in one of its simpler modes, like ping-only
    or TCP-connect. Vary your times and break up your scanning as much as possible
    to avoid falling into a detectable pattern.


    **Q: I installed Snort, the logs it generates are enormous and the alerts file
    are full of data. I''m almost out of disk space. What should I do?**


    **A: Examine the alert and log files carefully. Are you picking up things like
    pings, ICMP port/host unreachables, etc. from inside your network? Very often
    pings fly across a network (especially one with a DHCP server) like crazy during
    normal business hours. Review your logs, and more importantly, your rules apply
    to your network. By default, Snort currently uses a source of *any* for its rule
    matches. That means that outside and inside traffic will both match. If you only
    care about outside traffic, change the *any* to $HOME_NET as described in the
    Snort configuration file.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_121_0.png)'
