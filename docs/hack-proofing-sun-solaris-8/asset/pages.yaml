- pgno: 184
  md: '# Introduction


    Securing your network services to keep external threats should be a priority matter.
    Although others have shown that many security breaches originate from Securing
    your network services to keep external threats should be a priority matter. Although
    others have shown that many security breaches originate from authorized users,
    the most costly and destructive security breaches often come from sources external
    to your organization. No matter from which side of the firewall the attack originates,
    the key to a successful hack often lies in misconfigured network services.


    Many of your network services, such as DNS and remote access, are crucial to the
    success of your organization, so how can you make these safe from network attacks?
    Most of the network services running on your Solaris system require additional
    configuration to secure properly, while, such as DNS/BIND, need to be replaced
    altogether. This chapter serves as a guide for your Solaris network services reconfiguration
    efforts.


    Throughout this chapter, we examine the network services available to Solaris,
    such as DHCP, DNS, network printing, and remote graphical and command-line interfaces.
    We also consider replacing some cleartexts with secure shell, a Swiss army knife
    for encrypted network services. The goal of these exercises is to harden your
    Solaris network services to the point that it becomes too much effort for an attacker
    to succeed with remote attacks.


    # Configuring Solaris as a DHCP Server


    Starting with release 2.6, Sun began distributing their own DHCP server with Solaris,
    which has both GUI and menu-based console configuration utilities. DHCP services
    are inherently useful, if configured securely, because they allow for centralized
    administration of client (usually workstation) TCP/IP information. It''s unlikely
    that you would want to use DHCP to configure your critical services because in
    the event of a DHCP service failure, your servers may not be able to obtain a
    proper TCP/IP configuration, resulting in unnecessary downtime. Additionally,
    the DHCP protocol is platform independent, you can utilize the center-based TCP/IP
    configuration for other platforms, including Microsoft Windows, on a Solaris system.
    This section shows how to configure DHCP services using both the GUI and the menu-based
    tools because they are not quite identical in functionality.


    DHCP services are normally not installed in a default installation of Solaris
    8, so you will need to install the packages for BOOTP/DHCP Services for Root (SUNWdhscr),
    BOOTP/DHCP Services for Us (SUNWdhcu), and DHCP


