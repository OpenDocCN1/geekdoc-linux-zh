- pgno: 300
  md: 'hours vary considerably, and our CIO and CEO should have round-the-clock access.
    First, create an access list that requires authentication to the proxy for anyone:


    ```

    acl auth1 proxy_auth REQUIRED

    ```


    Next, define the list of people who may use the proxy at any time:


    ```

    acl auth_any proxy_auth ghammond mayborne scarter

    ```


    Tell Squid what our normal business hours are:


    ```

    acl day time 08:00-18:00

    ```


    Now, we can define access to the proxy so that everyone requires authentication,
    regular employees may only use the proxy during business hours, and special access
    is granted at any time for everyone else:


    ```

    http_access allow auth_any

    http_access allow auth1 day

    http_access deny all

    ```


    As always, the default-deny stance given in the last line is important. Anyone
    who isn''t in Squid''s password file and can''t otherwise identify themselves
    should be denied access.


    # Access Control Lifetime


    By default, Squid allows access from a specific workstation for one hour before
    requiring the user to authenticate again. This is intended to provide an adequate
    compromise: there is a risk that an unattended workstation can be unauthorized,
    but forcing users through the authentication process is a nuisance. If the amount
    of time needs to be adjusted, the authenticate_ttl object can take a value in
    seconds for how long to remember authenticated access. The default is 3600, or
    one hour. To change this configuration to provide three hours of uninterrupted
    Web access, enter the following command:


    ```

    authenticate_ttl 14400

    ```


    A considerable amount of sysadmin time can be spent at large sites just handling
    password changes. The Squid Web site (www.squid-cache.org) includes links to several
    CGI mechanisms that allow users to change their Squid passwords. Placing one of
    these on a secure Web server, accessible only within the internal network, will
    greatly simplify the management of Squid passwords.'
