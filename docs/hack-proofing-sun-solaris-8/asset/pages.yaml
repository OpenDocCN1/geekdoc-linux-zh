    A TCP SYN attack can be identified by inspecting the values of the parameters
    tcpTimRetransDrop and tcpListenDrop. The tcpTimRetransDrop parameter shows the
    number of aberrations due to abort time expirations since boot time. The value
    includes both SYN requests and established TCP connections. The tcpListenDrop
    parameter shows the number of SYN requests that have been refused because of a
    TCP queue backlog since the system was booted. If the tcpListenDrop value increases
    quickly along with the value of tcpTimRetransDrop, there is a high probability
    the system is under a TCP SYN attack.


    Another way to determine whether a Solaris system is under a TCP SYN attack is
    to use the snnoop utility to monitor traffic to and from the host. While this
    is not the ideal way to detect SYN attacks, it may be useful to snnoop to verify
    that a SYN flood is occurring. Very simply, snnoop can be used to monitor TCP
