  md: '# Chapter 2 • Securing Solaris with the Bundled Security Tools


    and work within budget constraints as well. Generally, since there is always an
    expense with the increase of security, the main question to be answered is “What
    would the damage be if the data is compromised?” By way of example, I’ll ask a
    rhetorical question: “How much security do you think protects the formula for
    Coca-Cola?”


    Q: Is Trusted Solaris  government-dictated design overkill for my needs?


    A: Although it is true that both Solaris 8 and Trusted Solaris 8 are based on
    the model that the U.S. government was using, the structure had been improved
    to the point that it can fit almost any security situation. The model was originally
    based on comprehensive and rigid. Now, over 15 years later, it has evolved to
    become more comprehensive with the added benefit of flexibility.


    Q: What further training will I need to be able to properly administer security
    in my environment?


    A: This too is a question with many variables. In many cases, the information
    that is provided in this book would be more than adequate for implementation of
    a sound security policy for your organization. In other cases, a much in-depth
    understanding might be required. Many of the subjects that are included here have
    entire volumes written about them—their internals, their encryption methods and
    algorithms used. When it comes to security, enough knowledge is enough, but more
    is always better.


    Q: When is SunScreen SecureNet necessary?


    A: Networking is perhaps the most vulnerable link in the security chain. In the
    past, many organizations trusted the phone company to provide security in the
    dedicated links that comprised the WANs. Now we are all naive. We understand the
    concepts of eavesdropping, intercepting, and spoofing. We know the vulnerabilities
    of the phone company’s data exchange switches and how easily they can be tapped.
    Now, with the advent of the Internet, it is even more difficult to control the
    flow of data within a company. What can be controlled, however, is the way the
    data is transmitted. Encryption technology such as SunScreen SecureNet ensures
    that you should protecting enter a vulnerable area of the network, it is still
    protected.


