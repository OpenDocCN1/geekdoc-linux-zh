    opie http://inner.net/pub/opie-2.4.tar.gz

    skey http://www.netsw.org/system/tools/password/auth/skey/skey-2.2.tar.gz


    John the Ripper www.openwall.com/john


    Crack http://ftp.cerias.purdue.edu/pub/tools/unix/pwdutils/crack5.0.tar.gz


    Chkrootkit www.chkkootkit.org'
