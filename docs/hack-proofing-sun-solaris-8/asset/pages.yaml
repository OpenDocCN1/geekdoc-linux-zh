    # Security Optimization


    A number of parameters associated with TCP/IP on a Solaris system can be modified
    to provide enhanced security. Theconfiguration of ARP, IP, TCP, UDP, and ICMP
    in their default state might not provide the greatest level of security. For the
    sake of brevity, we wont delve deeply into this topic nor discuss it in brief.
    This would not the topic justice. This topic has been covered heavily in a document,
    "Solaris Operating Environment Network Settings for Security," by Keith Watson
    and Alex Noodergraaf of Sun Blueprints.Their documents are available from www.sun.com/blueprints.


    # Security Implications


    You don''t have a hope of security or integrity for your network without first
    having a secure router.Therefore, the implementation of a system as a router can
    be secure by design.This consideration must be made at the very beginning of system
    design and observed diligently through deployment and afterward in maintenance.The
    intricacies of designing a secure router are covered in detail elsewhere in this
    book. Here we give some general guidelines to enhance security.From these guidelines,
    we''ll repeat the minimalism mantra.


    # Minimal Installation


    A secure router should include a minimal, functional installation of the operating
    system. However, this is more a management issue than a security issue. Simply
    put, smaller installations make machines that are more easily managed and monitored
    for intrusion.


    A system with a smaller installation is more easily managed because only the necessary
    pieces are in place.What constitutes necessary is the software to achieve your
    mission and business needs. A system with a minimal installation also removes
    of unnecessary services and makes it easier to monitor the system for intrusion.


    There are two camps on the types of software that should be installed on a system.
    One side is against having a C compiler on the system; the other is for. Neither
    side is right or wrong, but both have valid lines of reasoning to take into account.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_257_0.png)'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Chapter 8 — Configuring Solaris as a Secure Router and Firewall


    The side against accessible local C compiler fears a local user compiling exploits
    or programs and using the system for unauthorized activities. Such violations
    could lead to a local user gaining elevated privileges or unauthorized network
    access. The other side of the argument believes that having a C compiler on the
    local system is a necessary utility. Without a C compiler, they believe, it''s
    impossible to build programs from source.


    I''m happy to announce that I''m a proud member of both camps. I''m not against
    local users having unlimited free reign of a system through some guilty built
    with a C compiler, but I''m not against the C compiler. This risk can be eliminated
    through proper permissions and access control such as RBAC or simple access control
    lists.


    # Minimal Services


    A router needs very little in terms of services. Since the system has one purpose,
    there isn''t a necessity for things like NFS, NIS, RPC, and sendmail. By eliminating
    these services, you enhance overall system performance.


    Additionally, eliminating these services closes entry points for possible intruders.
    By limiting the channels that allow an intruder potential access to the system,
    we''ve mitigated the risk of opening a system to future compromise by a new vulnerability.
    Shutting down all services or using the system solely as a router isn''t always
    possible. This is, however, the recommended practice.


    Many of these services are started via the Internet daemon (inetd). Commenting
    out the services and intent not starting them at all is the best methodology.
    The inetd is started at /etc/rc2.d/S69inetscript.


    Another good practice is checking the rc directories in /etc for programs that
    starts a number of services that, might be started. For example, the rc3.directory
    starts unnecessary services that have a history of security risks. Services such
    as the NFS server and the DMI compatibility programs are started at run-level
    3.


    Some time ago I wrote a document, “Back to the Basics: Solaris and init.” This
    document describes the services started on a stock install of Solaris and where
    they started. Through the ps and netstat programs, it''s possible to narrow down
    the majority of undesired services and disable them. If the use of these programs
    fails to yield the port number on which a particular service is running, the lsof
    utility can be a saving grace.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_258_0.png)'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Minimal Users


    A Solaris system is a multiuser system. However, a router should not be a multiuser
    system. Giving general users access to a system through which the traffic of the
    entire network flows is only dangerous, it''s reckless. Shell access to the router
    should be limited to administrative staff and strictly regulated. A router shouldn''t
    bring unnecessary attention to itself by handling e-mail or other such services.
    It''s an unnecessary to state that the system is critical.


    # Minimal Dynamic Information


    One feature that can turn into a problem on any network is dynamic information.
    Such information includes routing protocols, name services, and the like. These
    services are designed to make network management easier, but the design of such
    services isn''t the most secure.


    A router should be limited in the amount of dynamic information on which it relies.
    Solaris typically start the in.routed and in.radisc daemons when launching and
    gaining routing information through UDP and ICMP. With any service that relies
    on dynamic updates, its possible to generate fictitious data and send it to the
    host, which could result in a denial of service or other attack. Therefore, it
    is a best practice to eliminate all services on the router that rely on dynamic
    data, including in.radisc and in.routed.


    # Minimal Cleartext Communication


    On one final note on minimalism: It is a best practice to communicate with the
    system using the minimal amount of cleartext possible. Although we can build the
    most armored host on Earth and surround it with armed guards, if we''re communicating
    with the system via a channel that can be intercepted by a potential intruder,
    our efforts are in vain.


    The best policy is to use one of the available implementations of the Secure Shell
    (SSH) protocol. If you add more means of communication and administration to the
    system, such as a Web-based configuration interface or perhaps a Web-based intrusion
    detection log analyzer, do so via a cryptographically secure channel. Any services
    that provide remote interactive communication are vulnerable to sniffing or connection
    hijacking. The only way to ensure communication integrity is via cryptography.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_259_0.png)'
