  md: '# Configuring Solaris as a Secure Router and Firewall · Chapter 8


    # Figure 8.5 Code from the S69inet Script That Determines the System Is a Router
    if the ndpd.conf File Is Found


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_267_0.png)


    By examining the code, we can easily determine whether the system is running as
    an IPv6 router or an IPv6 host. If the system is running as an IPv6 router, the
    message “Machine is an IPv6 router” is printed to standard output (stdout) when
    the system bootstraps. If the system is an IPv6 host, the message “Starting IPv6
    neighbor discovery” is printed to stdout. We can therefore determine whether the
    system thinks it is an IPv6 router by watching the bootstrap or reviewing the
    contents of dmesg.


    After the in.ndpd program has been configured to act as an IPv6 router, when a
    system is set to autoconfigure IPv6 bootstraps and polls the network, in.ndpd
    on the router will respond. The host sends a router solicitation via ICMPv6, the
    ICMP implementation in IPv6, to the network via the multicast address space. The
    router then responds with an ICMPv6 packet to the multicast address space. The
    host receives this packet and configures itself as a router. The host interacts
    with the advertised router.


    # The in.ripngd Program


    The in.ripngd program is the Routing Information Protocol, New Generation Daemon.
    This is the Routing Information Protocol (RIP) implementation for'
