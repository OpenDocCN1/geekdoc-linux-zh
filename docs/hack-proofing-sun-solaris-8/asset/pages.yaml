  md: '# Securing Solaris with the Bundled Security Tools • Chapter 2


    environment, further enhanced auditing, and the ability to maintain label

    integrity when data is moved.


    +   - B2, Structured B2 takes security into a high mode of auditing capabilities.
    Mandatory access to all system objects is required. Trusted path communications
    are required between clients and servers. Administrative functions are required
    to be split into autonomous units so that no entity can have total system control,
    and mandatory auditing and notification protocols are required.


    +   - B3, Security Domains In essence, these rare systems are B2 systems with
    the rest of the security holes plugged.They are required to have no design flaws
    in TCB, auditing for already required system security auditing and automatic security
    analysis.


    +   - A, Verified This is the highest level of security classification.


    +   - A1, Verified This level requires proof that there are no flaws in either
    design or implementation of the TCB through redundant, independent third-party
    testing.


    The Orange Book security standards have a common knowledge factor in computer
    security. Even though they are not generally discussed in security seminars or
    hacking circles, most experienced server administrators are aware of C2-level
    security because it is an option installation of the operating environment. Most
    administrators are also aware of the differences between the default level of
    security for the operating environment and the C2 level of security, at one time
    or another, they have configured C2 security (although many are not aware that
    the default is classified as C1). With an understanding of the security structure
    as it was established by the Orange Book, we can gain perspective on the foundation
    of security. Such perspective not only allows us to understand from where the
    technology of today has evolved, but it gives us the ability to anticipate and
    recognize the threats of the future.


    Although such attacks as denial of service and protection from viruses and worms
    are an important part of today’s security concerns, ultimately the fundamental
    concern addressed in the Orange Book—protecting data—is still of paramount importance.
    In such matters, knowledge gives us the strategy to succeed. In the classic film
    Patton, the actor George G. Scott in the title role had a brilliant line during
    the scene when a massive task is engaged in North Africa against the German military
    genius Rommel. Scott as Patton is observing


