  md: 'no password for this user by placing NP in the /etc/shadow file entry for this
    user. Next, the file structure needs to be carefully arranged:


    +   ~ftp This directory should be owned by root and should not be writable by
    user, group, or other.


    +   ~ftp/bin This directory should be owned by root and should not be writable
    by user, group, or other. It should also be symlinked to ~ftp/usr/bin and should
    contain the ls command, with mode set to 111.


    +   ~ftp/usr/lib This directory should be owned by root and should not be writable
