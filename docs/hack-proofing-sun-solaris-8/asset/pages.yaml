    # Buffer Overflow against an FTP Server


    Solaris'' FTP server daemon can also be subjected to buffer overflow attacks.
    A recent attack against FTPd targeted the globbing function in the code, which
    is used to expand shorthand notation into complete file names. Implementations
    of the c-shell globbing code are vulnerable to buffer overflows. When an FTP daemon
    receives a request involving a file that has a tile "~" as its first character,
    it typically runs the entire string globbing code in order to resolve the specified
    home directory into a full path. This has the side effect of expanding other metacters
    in the pathname string, which can lead to large input strings being passed into
    the main command processing routines. By supplying a pattern string to the FTP
    server containing a set of brackets {} followed by an overly long string, a remote
    attacker can cause a buffer overflow in exec() function and execute arbitrary
    code. While the FTP servers of other operating systems (such as NetBSD) required
    that the attacker be create directories on the target systems in order to successfully
    execute the exploit. This was not the case with Solaris. In Solaris, an exploitable
    heap of this nature is triggered by the LIST command. This vulnerability occurs
    when the FTP daemon attempts to construct a string using unbounded string operations
    in order to execute the /bin/ls program. This particular vulnerability in Solaris''s
    FTP server can be fixed with the patches listed in Table 10.2.


    # Table 10.2 Patches for Solaris FTP Globbing Vulnerability


    | OS Version | Patch ID |

    | SunOS 5.8 | 111606-01 |

    | SunOS 5.8 x86 | 111607-01 |

    | SunOS 5.7 | 110646-02 |


