  md: '# Chapter 1 · Introducing Solaris Security: Evaluating Your Risk


    denotes idle CPU power. The sum of these three columns will always equal 100 percent.
    A good rule of thumb for these numbers denotes a 3:1 ratio between system and
    userland processes is ideal. For example, 60 percent user, 20 percent system and
    20 percent idle would be an acceptable average for these metrics over a large
    time interval. Note that it is possible for your CPU to run at a very high level
    continuously but not affect system performance. As long as the process queue,
    denoted in the first column as zero, your processor will not be overworked. If
    there are continuous processes in the run queue, then your processor is likely
    a bottleneck. From our sample output, we can see that the system is functioning
    within desired parameters with respect to CPU load.


    Diagnosing memory load requires information from the free list, swap space and
    paging. Most important of these is the size of the free list, which indicates
    the amount of RAM available to the system. The free list is listed in the “free”
    column; for our example system it is roughly 208 MB. Be aware that some applications,
    such as Oracle, may allocate large chunks of RAM before they are actually used,
    so you can''t rely on the size of the free list to determine memory status. Therefore,
    you also need to examine swap in the “swap” column and paging metrics, which are
    “pi” for the page-ins and “po” for the page-outs. The server in this example has
    roughly 700 MB of swap available, occasionally pages in and never seems to page
    out, which indicates acceptable performance. (Concurrently, a low amount of available
    swap space and excessive system pageins and pageouts would indicate poor performance.)
    Note that it is not uncommon to have periodic page metrics in the thousands for
    very short time periods, but neither page-ins nor page-outs should be large at
    the same time or for any period of time. Systems low enough on available memory
    to become unstable will have additional symptoms, as nonzero values in the “w”
    column, indicating executing processes that have been swapped to disk.


    We''ve only tapped the surface of performance analysis here. Using the tools and
    techniques described above should be more adequate for observing the increased
    system activity usually caused by intruders, but for more detailed information
    on vmstat and performance monitoring, please refer to the man pages and Answerbook
    documentation.'
  merge: -1
