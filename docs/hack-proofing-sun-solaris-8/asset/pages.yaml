  md: '# Monitoring Web Page Usage and Activity


    +   - Perl is an excellent tool for simple Web scripts. With de-facto inclusion
    in Solaris 8, make liberal use of its excellent string-handling capabilities.


    +   - Monitor your server for excessive 404 results. A search engine or another
    page may have outdated link information. You will want to update this information
    to get users to the right parts of your site.


    +   - If you have password-protected parts of your server, monitor your log files
    for excessive 403 results. A few may indicate a forgotten password, several dozen
    or hundred may indicate a brute force attack against your site.


    # Configuring the Security Features of Sendmail


    +   - The access_db feature allows you a great amount of flexibility in who to
    accept mail from or for.


    +   - Sendmail comes with relay capabilities turned off by default. Use caution
    when allowing even limiteding.


    +   - You should understand all the relaying features of sendmail and keep eye
    on your mail server activity. If you notice a suspicious sendmail.cf or odd entries
    in your sendmail.mc, suspect UBE activity.


    +   - Utilize sendmail rulesets to help filter objectionable or unwanted e-mail,
    but use them carefully. Rulesets often have a high overhead in sendmail.


    +   - Understand the relay configuration options for sendmail before making any
    real-world changes. In the event your changes do not work out, ready to backtrack.


