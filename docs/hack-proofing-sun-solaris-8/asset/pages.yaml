    # # Documenting Security Procedures and Configurations


    Documentation is one of the more often overlooked aspects of security and system
    administration in general. Ideally, documentation should provide a paper trail
    that explains system configurations, patch levels, etc. in such a manner that
    the information can be easily absorbed by someone with little or no prior knowledge
    of the organization''s layout. However, this ideal may be somewhat unrealistic,
    and it usually suffices to record security procedures and configurations in such
    a manner that others in your group are familiar with the layout will understand
    them.


    Keep in mind that the primary goal of documentation is always to reduce losses
    to your organization resulting from unforeseen circumstances, such as the sudden
    loss of one of the senior Solaris administrators. Documentation will also assist
    in restoring a server to its functional state should rebuild become necessary.
    If your organization has a large number of Solaris servers, any of which may exist
    in unique configurations, it becomes impossible to remember the specific details
    of each machine''s configuration without proper documentation. With that mind,
    this section will discuss some methods you can use for documenting your organization''s
    environment.


    # # Documenting Security Procedures


    Documenting security procedures is very similar to documenting administrative
    work performed on your Solaris system. Exactly what needs to be documented and
    the granularity of documentation can be very site-specific, but at minimum your
    system documentation should include the following:


    +   - The fully qualified domain name (FQDN) of the system

    - The date was brought into service

    - Administrative contact information—preferably at least two contacts

    - Basic system hardware information, such as the number of CPUs and the amount
    of physical RAM


