  md: '# Using the Solaris Security Toolkit


    The Solaris Security Toolkit (formally JASS) is a group of security scripts available
    for free from the Sun Web site. These scripts are designed to help the administrator
    facilitate a uniform security policy throughout the network by creating systems
    that are already tailored to a higher level of security. Although they can be
    run in standalone mode, they are designed to take advantage of Sun''s JumpStart
    technology to proliferate configurations throughout the administrative architecture.


    The toolkit is designed to run in one of two modes. The first, *hardening mode*,
    is available only in the standalone session. *Hardening* is the term used to modify
    the system''s configuration, closing possible points at which security violations
    occur. *Minimization mode* is the removal of superfluous packages that represent
    a security risk. Minimization is available only in JumpStart mode and acts as
    a template for building a client with the absolute barest software configuration
    that provides functionality.


    These scripts are provided to administrators as an aid to help configure system
    security on a rudimentary level and comprise scripts written by Sun engineers.
    Because the scripts are provided free of charge, they are not officially supported
    by Sun and if an operating environment upgrade is performed on the system, the
    scripts need to be reapplied in case the files they were replaced. These scripts
    are highly configurable and flexible and can be tailored to the needs of different
    environments.


    # Working with the Solaris Security Toolkit''s System Files


    Solaris Security Toolkit replaces many system files with modified versions that
    have changed functionality. For example, the /etc/issue and /etc/motd files are
    changed to provide notification that activities might be monitored or other specific
    legal banners that an organization may want to specify. The /etc/syslog.conf file
    is modified to provide additional logging by default. The /etc/default/ftpd and
    /etc/default/telnetd files are added to a banner reading *Authorized Access*.
    If the OpenSSH secure software that is described in the following section is not
    used, and depending on the X support requirements, the Toolkit provides the /etc/dt/config/Xaccess
    file to disable remote access.


    The Toolkit also has a group of Finish scripts that either enable or disable system
    functions. For example, the Finish scripts by default disable *autostount* commands,
    dhcp, dtlogin, and IPv6.They disable ip access to the


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_82_0.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Securing Solaris with the Bundled Security Tools • Chapter 2


    cron subsystem and NFS client and server.The Finish scripts enable BSM, FTP, and
    inet stack logging and kernel stack protection against common buffer overflow
    attacks.


    Again, all functionality in the Toolkit is configurable. It is designed to be
    all-inclusive to the extreme, and many of the scripts it runs may be left out
    in order to provide additional functionality on the system.


    # Using OpenSSH


    OpenSSH is open-source software and is available for download on the Sun Web site.
    It is managed by the FreeBSD team, which has an objective of providing secure
    software in relation to the BSD 4.4-Lite version of UNIX. As part of that objective,
    they created OpenSSH and provided portability to other systems. OpenSSH, as it
    is provided by Sun, may be compiled under the Solaris OE with either the Forte
    or GNU compiler and linked to provided libraries. It can be used either separately
    or in conjunction with the Solaris Security Toolkit and like the Toolkit, it is
    highly configurable regarding the security features it provides.


    OpenSSH provides a secure means of accessing the server, translating commands
    and utilities that are already known to the users. It encrypts network traffic,
    provides for more stringent authentication, and provides tunneling for X-windows
    and other unsecured networking components.


    OpenSSH comes with the pseudo random number generator daemon (PRNG) for generating
    numbers for encrypting operations. Running this daemon is optional and is essentially
    a performance trade-off. OpenSSH can generate its own random number using entropy,
    an algorithmic method based on decaying mathematical progression. Generating entropy
    takes time that may manifest as a delay during startup. The PRNG maintains a stored
    cache of entropy for generating random numbers and avoids the startup delay as
    a costly running process.


    > NOTE


    As with all open-source software, no capitalistic engine is promoting it. The
    only way to keep up with fixes, enhancements, and upgrades is to do it yourself.
    Think of open-source software as similar to National Public Radio; it''s full
    of fanatics with good intent, it''s sometimes stodgy, but ultimately it is beneficial
    to everyone and deserving of the effort to support it.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_83_0.png)'
