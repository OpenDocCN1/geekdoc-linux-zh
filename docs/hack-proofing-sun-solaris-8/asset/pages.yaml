    # Monitoring Solaris Logfiles


    Chief among a Solaris administrator’s arsenal of security tools are the system
    log-files, especially those that record access to the system. These logs can be
    invaluable for tracking the system usage of intruders who have not yet been able
    to access the superuser account. Once an intruder gains superuser access to the
    system, though, you can no longer trust these logs, as the intruder has possibly
    them to cover his tracks. An inexperienced hacker, not knowing how to cover his
    tracks, may delete these logs altogether. For these reasons we will briefly discuss
    how to verify the integrity of these logfiles.


    # Monitoring the Access Logs


    Solaris can log up to three types of system access, but only two of them are available-by
    default. Typically, a system administrator who wants to check the system logins
    will either use the **who** or the **last** commands. The **last** command will
    list all system access, time of access, and point of access for all accounts on
    the system, as well as listing reboots. The **who** command is similar, but it
    will list only the users currently logged into the system, along with their origin
    and login time. Both of the logfiles for **last** and **who** are binary logs
    (as opposed to ASCII). They are /var/adm/wtmpx and /var/adm/utmpx, respectively.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_40_1.png)'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Introducing Solaris Security: Evaluating Your Risk · Chapter 1


    Failed logins can also be logged on Solaris, but this ability is not enabled by
    default. By recording failed login attempts, create the file /var/adm/loginlog.
    Make sure the user “root” and the group “sys” own this file, and change the permissions
    to 600. Then restart syslog daemon. Your Solaris system should begin logging failed
    login attempts when one account receives or more failures.


    # Monitoring the sulog


    Logging user account activity and failed login attempts may assist you in catching
    intruders at the early stages of attack, but the logfile you want to watch is
    /var/adm/sulog. This logfile tracks both successes and failures of anyone attempting
    to use the su command, as well as which accounts they are trying to su. A good
    security practice includes running a periodic cron job that informs administrators
    of any nonadministrative account attempts to use su to become the super user.
    Even better, restrict access to the su to only accounts in the sysadmin group
    (GID=14). Note that the second method is only effective if your users do not have
    a legitimate need to use the command to become another user, which may not include
    root. For example, one of your DBAs may require the ability to su to the oracle
    user.


    # Validating the System Logs


    What happens if unauthorized personnel access the root account? How can the logs
    be trusted at that point? Well, by default it means they can’t. With the default
    Solaris tools, the best you can do is configure a centralized hardened syslog
    server to provide remote logging for all of your critical Solaris systems. As
    long as the syslog server is not cracked, you can generally trust its logs.


    However, using a central syslog server is an incomplete solution at best. Once
    the intruder has root access, they can easily stop the logging daemon altogether.
    Or, since syslog use UDP protocol, the intruder could flood the loghost with packets
    as a denial of service attack that masks his other attacks.


    A more preferable solution is to set up a system integrity monitor, such as Tripwire,
    which makes periodic checks against the checksums of your logfiles, probably in
    conjunction with log rotation. This will you know if a logfile has been modified,
    because its checksum will change. Try to avoid integrity monitors that use CRC
    or CRC-32 for checksum algorithms, as these low-tech algorithms can be fooled
    with minimal difficulty. Checksum routines like Message Digest 5 (MD5) hashing
    are far less likely to be circumvented.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_41_0.png)'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Chapter 1 • Introducing Solaris Security: Evaluating Your Risk


    # Deciphering /var/adm/messages Information


    Login information is only part of the information recorded by your Solaris system.
    Generalized information about the overall state of the system''s health and other
    security issues can usually be found in /var/adm/messages. Monitoring this file
    manually or through a logcheck program is advantageous because it provides advance
    warning of many common problems. A failing disk drive, for example, will usually
    note that certain disk sectors could not be read or even weeks before the drive
    fails completely.


    # Testing Security


    From a perspective, perhaps the most important areas to be concerned with are
    choice of passwords and file access permissions. Not every intruder''s goal is
    to obtain root access to your Solaris system; some may be information thieves,
    attempting to pilfer proprietary data from your company. Data theft can often
    be accomplished by merely gaining access to certain user accounts. Information
    that is confidential yet available within your company is only protected by the
    weakest user''s password.


    Of course, there are times when ordinarily trustworthy users might abuse your
    Solaris systems as well. Employees who would dream of stealing your company''s
    proprietary information may not think twice about trying to access your company''s
    human resources records as a means of carrying out some sort of revenge against
    a rival coworker. Your Solaris systems should be solid enough to guard against
    atypical threats like these as well as curious external hackers. This section
    is dedicated to helping you test the security of your Solaris systems.


    # Testing Passwords


    Password security can be broken down into two areas: user responsibilities and
    administrative responsibilities. It is the user''s responsibility to select a
    password that is easy to remember yet difficult to guess, while the administrative
    responsibilities include actions such as enforcing periodic password changes.
    We will discuss some guidelines for password selection as well as some options
    for administrative password policies. Table 1.3 summarizes guidelines for user
    password selections.'
