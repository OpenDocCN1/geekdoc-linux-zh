    # Configuring Sendmail


    The sendmail home page at www.sendmail.org contains many useful links to tools,
    tips, and information for configuring sendmail. Unlike many pieces of software
    found on the Web today, sendmail has been around for some time. Originally written
    in 1981 at U.C. Berkeley, the original goal of sendmail was to facilitate e-mail
    transfer between the many disparate e-mail systems in use on the campus and other
    research educational institutions.


    As sendmail matured and spread, it continued in its mission of connecting people
    via e-mail. In addition, the software unfortunately became famous for some notoriously
    exploits that could render systems inoperable or e-mail password files to rogue
    hackers. The maintainers of sendmail were vigilant, however, and patched and fixed
    sendmail quickly and effectively. Today, sendmail is a very secure and robust
    piece of software, though with any other software, bugs and holes are sometimes
    found and patched with due haste. However, sendmail’s reputation sometimes follows
    it around and some people have been known to speak derisively of sendmail due
    to long-ince security over a decade old in some cases. Keep in mind that sendmail
    is still one of the most popular mail transfer programs on the Internet today
    and through the efforts of its maintainers and the quality of its design, can
    rightly be listed as one of, if not the best, mail programs in the world today.


    The sendmail version available from the Sendmail Consortium, v8.12.0, as of this
    writing, focuses primarily on security with increased performance. The earlier
    8.11.5 version is an incredibly secure piece of software. The earlier 8.9.3 version
    that ships with Solaris 8 has some vulnerabilities that are not easily fixed by


