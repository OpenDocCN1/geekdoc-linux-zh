    # Using Snort


    Snoop, as powerful as it is, simply cannot replace a good sniffer or intrusion
    detection system. Snort, at version 1.8 of this writing, is an excellent (and
    free) tool for this purpose. Since Snort is rule-based, an administrator can easily
    adapt it to a specific network or set of networks. We will find Snort, rules files,
    documentation, and discussion boards at www.snort.org. I strongly suggest that
    you spend the time to read all the documentation and understand the release-level
    as well as the alpha and beta features.


    We will be looking at the use of Snort with a few of its many switches. In the
    simplest sense, Snort can be started like so:


    ```

    %snort

    ```


    This works only if you execute Snort and if you have a rules file in your home
    directory. We want to make Snort more useful, we''ll be learning about the following
    command-line switches:


    +   - -c <dir> This tells Snort to look for its configuration file. In version
    1.8p1, Snort''s configuration file (snort.conf by default) sources in rules for
    use.

    - -b Generates logs file in the format of the tcpdump utility. This logging faster
    and helps Snort keep up with traffic-saturated networks (even 100Mbit/FDX).

    - -l <dir> The directory where Snort will place all of its logs.

    - -d Dumps the application layer of the sniffed packet (if any). This can be useful
    when examining or replaying an attack or traffic stream.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_107_0.png)'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Chapter 3 · Securing Solaris with Freeware Security Tools


    +   - **D** Use this to run Snort as a daemon.


    +   - **A <word>** This tells Snort to generate alerts, and what level to generate.
    The legal words are fast, full, console, or none. Start off with full and pare
    down as needed.


    You will need to obtain the source code for Snort. Download, decompress, and compile
    the source. There is a great deal of flexibility in the package ranging from where
    you install the binary and configuration files, to the extent and location of
    logs and alert notifications. The heart of Snort, is the set of rule and configuration
    files. Snort, as of version 1.7, uses a main configuration file, snort.conf. In
    snort.conf, the administrator defines the local subnet(s), sets up preprocessors
    to handle things like HTTP requests and TCP fragments, and defines the common
    servers on a network, web, mail, and database servers. Each definition will play
    some part in the rules telling Snort what traffic to consider malicious and what
    traffic, appearing malicious, is truly benign and acceptable traffic for your
    network. configuration file ends a series of include statements telling Snort
    which rules to use and which to ignore. The beauty of this feature is that we
    can write various rules for various classes of exploits into individual files.
    This makes the management, updating, and debugging of rules incredibly simple
    and painless. The best way to understand the rules themselves is to start to work
    with a simple example:


    ```

    alert tcp $EXTERNAL_NET -> $HOME_NET any

    (msg:"SCAN NMAP Xmas";flags:FPU);

    ```


    The first keyword, alert, tells Snort that if this is matched, the $EXTERNAL_NET
    statement is in the snort.conf file with a default value of any, meaning any network.
    The first any keyword refers to the source of this traffic. In this case, we are
    curious about all ports. The "-> nomenclature is indicative of source and destination
    and is quite significant. In this example, we care about traffic from EXTERNAL_NET
    to our HOME_NET Traffic originating from our HOME_NET to an EXTERNAL_NET would
    not be a match for this rule, due to the directional identifier. The next any
    statement refers to the destination port on our local network. Again, we are curious
    about any port. The "msg" string is the plain ASCII text that will be placed with
    the Snort-generated alert in the log file. In this case, the string tells us that
    we are looking for the NMAP Xmas scan. The flags keyword tells Snort that we are
    curious about the TCP flags F(IN), P(USH), and U(RG). Other flags we can scan
    for S(YN), R(ST), and A(CK).'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Securing Solaris with Freeware Security Tools • Chapter 3


    Another key benefit of Snort is its flexibility in crafting rules. Extensive rule
    sets exist for out-of-the-box use with Snort, any administrator will easily pick
    up the syntax and structure of Snort rules in just a few minutes. With Snort''s
    ability to trace and track traffic based on IP, TCP, UDP, and ICMP parameters
    (to name just a few), almost anything is possible. If you have local SQL databases,
    Snort offers plugins to allow you to log to an SQL database.


    One legitimate concern regarding Snort (or any other intrusion detection system)
    is its ability to keep up with network traffic flows. On a 100 Mbit/s, full-duplex
    line, smaller and older machines will start to miss or drop packets. Behavior
    of this type has always been, and remains, unacceptable. What if an attacker floods
    your network with harmless traffic in order to hide an attack? The results could
    be disastrous. Luckily, Snort has what the author refers to as a high performance
    mode. When starting Snort, you can issue the following command to run Snort in
    this high performance mode:


    ```

    %snort -b -A fast -c snort.conf

    ```


    In this mode, Snort writes all its captures and logs to a binary-formatted file.
    When you want to review the captured and logged information, you re-run Snort
    against the log file like so:


    ```

    %snort -d -c snort.conf -l ./log -r snort.log

    ```


    The previous command uses the -l to tell Snort which directory to log to, and
    -r indicates the source file from which to read our tcpdump-formatted data.


    Spending a few minutes with the Snort documentation is enough to get the system
    up and running with a basic and effective configuration. It would be wise, though,
    to spend a few hours to learn Snort. As an intrusion detection system, Snort is
    one of the most powerful and flexible tools available to help protect and monitor
    your networks.


    Now that you have Snort set up, what next? My first piece of advice is to run
    Snort with the default rules enabled and let it log and generate all the alerts
    for a period of time. Also, be certain to use the -dw switch for Snort to run
    it as a daemon. On a new network, I like to run Snort for two three days with
    a generic configuration. I review the logs and alerts and see which rules are
    flagging normal traffic (i.e., preventive portscans, passive FTP), and then Disable
    or rewrite them to be more intelligent. In this way, I can easily get an idea
    of what traffic should normally appear on my network (and therefore what traffic
    should not be considered malicious or detrimental). On a typical production network
    consisting of just Solaris systems, you will most commonly see


