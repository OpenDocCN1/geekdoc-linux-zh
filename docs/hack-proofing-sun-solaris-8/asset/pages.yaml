- pgno: 340
  md: "# Chapter 10 - Dissecting Hacks\n\nWhile this is something of an oversimplification\
    \ of the exploit and attack, the basic should be clear. The focus of the attack\
    \ is the trust relationship shared between two hosts. It is because of attacks\
    \ such as the r-services (login, rexec, rsh) have become such a burden on the\
    \ security-aware system administrator.\nA simpler method of exploiting a trust\
    \ relationship is used when an attacker is able to gain root privileges on one\
    \ system through some other means. Using trust relationships between systems opens\
    \ a gaping hole in a network. The r-services have outlived their usefulness and\
    \ should not be used at all possible. A better drop-in replacement for rsh and\
    \ login is secure shell.\n\n# Securing .rhosts File\n\nWhile the r-services are\
    \ inherently insecure, there are instances in running these services may be required.\
    \ If it is necessary to run rexec, rsh, or login, there are some ways to improve\
    \ the security of these services. However, it is possible to improve the security\
    \ of the r-services somewhat, yet the best way to close the security gap created\
    \ by running these services is to migrate to secure shell.\n way to make login\
    \ and rsh more secure is to require that only specific IP addresses and subnets\
    \ appear in an .rhosts file. The use of qualified domain names, also known as\
    \ canonical names, is also recommended. To avoid a situation similar to the attack\
    \ shown above, the MAC address of the host in the trust relationship should be\
    \ configured statically in Solaris's arp table. This can be done by using the\
    \ command:\n\n```\n# arp -s <trusted host ip address> <trusted host MAC address>\n\
    ```\n\nThis will cause the trusted host's IP address to be permanently associated\
    \ with the configured MAC address, which will help to increase the difficulty\
    \ of utilizing IP spoofing to exploit trust relationships. Even with these measures,\
    \ the r-services should be considered obsolete and insecure.The best solution\
    \ is to discontinue them as soon as possible and replace them with secure shell.\n\
    \n# MAC Address Spoofing\n\nA variation of spoofing an IP address is MAC address\
    \ spoofing. Every system on an Ethernet LAN has at least two addresses—an IP address\
    \ and a MAC address. In principle, MAC addresses are supposed to be globally unique;\
    \ every Ethernet card has a unique, burned in MAC address. When an IP packet is\
    \ sent from one\n\n![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_340_0.png)"
