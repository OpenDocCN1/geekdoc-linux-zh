  md: '# Chapter 7 • Providing Secure Web and Mail Services


    ```

    OSTYPE (solaris2) dnl

    DOMAIN (incoming-traveller.com) dnl

    FEATURE (access_db, dbm -o /etc/mail/access) dnl

    define (''ALIAS_FILE'', /etc/mail/aliases) dnl

    define (''conPRIVACY_FLAGS'', ''noexpn,novrfy'') dnl

    FEATURE (''blacklist_recipients) dnl

    FEATURE (''dnsbl'')

    MAILER (local) dnl

    MAILER (smtp) dnl

    ```


    The first lines tell the m4 processor what OS we are using. Solaris 8 is actually
    Solaris 2.8 and is part of the SunOS 5.x release family. Starting with Solaris
    2.7, Sun decided to simplify its naming and marketed as Solaris 7, but we''re
    still dealing with a Solaris 2.x variant. Next, we define our domain name, which
    is fairly straightforward. The next feature we add is for an access database that
    will help us control who and may not submit email to our server (come back this
    shortly). The -o switch in this statement sends mail that the existence of this
    file is optional and if not found at startup time, sendmail will not bounce and
    refuse to run. The dbm keyword sendsmail the type of database we will use.The
    choices are dbm and hash. The dbm type is natively supported on Solaris and a
    bit easier to work with, so we''ll use that for now. The second define sets two
    flags. The two set prevent the SMTP vrfy and expn from working. These two commands
    are commonly by spammers to verify local, valid addresses on your mail server.
    Once verified, the m4 jail starts running.


    The blacklist_recipients feature works with the access_db feature. When blacklist_recipients
    is used, we can put addresses of users that should not be receiving email locally
    in the access_db file. Some of the most popular users for this are to blacklist
    accounts that are used internally and which should never receive email from the
    outside world. The root itself is one example. Most sites have dedicated "abuse"
    accounts, and each site should technically maintain a "postmaster" account. These
    accounts may forward, via the aliases file, to root, but root itself should never
    receive mail from the outside world.


    The next line gives a closer look, both because of its usefulness and of the controversy
    surrounding it. The dnsbl line tells m4 that we will be adding support for the
    real-time blackhole list (RBL). There are several RBL servers, and the most common
    one is blackholes.mail-abuse.org (see http://mail-abuse.org/r/). The RBL list
    contains the domain names and IP addresses of known spam


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_234_0.png)'
