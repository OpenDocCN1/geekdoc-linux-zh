    > Tools & Traps...


    Watching Packets with snoop

    nYou might not be aware that Solaris includes its own network sniffer called snoop
    in the default installation. With a vast array of filtering tools, snoop can be
    the Swiss Army knife that you use for network debugging. We leave you to discover
    the exact syntax of snoop on your own, especially because the Answerbook documentation
    is adequate, but we point out a few examples of when you may want to use snoop:


    +   - To verify that DHCP requests are being received and answered by the DHCP
    server

    - To identify the source of denial of service (DoS) attacks

    - To determine which Web sites your users are visiting

    - To identify the source address of a suspected intruder

    - To locate any unauthorized hosts'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Securing Your Network • Chapter 6 173


    Like all sniffers, snoop loses a good deal of functionality in switched networks
    because it can only view packets within the local connection. However, some switches
    have a special management port, which is a single port on the switch that acts
    like a hub because all traffic through the switch is also passed to that port.
    If your switch has one of these ports, you should connect your Solaris host to
    this port to run snoop more effectively.


    # # Securing DNS Services on Solaris


    Historically, DNS services have been a favorite target of attackers because of
    its general lack of security and the wealth of useful information contained within.
    Not only, but attackers can cause severe disruptions in service for your organization
    by modifying or deleting parts of your name service database.


    DNS records contain a listing of if not all of the interesting hosts in your organization,
    and by interesting refer to hosts that are not your workstations. If an attacker
    has managed to get a zone transfer of your records, it may not be immediately
    obvious that a security breach has occurred because no damage has occurred—yet.
    From your name service records, the attacker may now systematically begin attacking
    all of the servers in your organization, probably beginning with any host that
    has the string test or dev somewhere in the hostname because these systems are
    less secured than production systems. A hacker can easily determine from your
    name records which of your servers are mail servers and may exploit this information
    to send forged mail or spam using your organization''s resources.


    Name services are historically easily exploited, an attacker may use your name
    server as a jumping point for his operations if he gains access. Here, he will
    use your name service records to map out the server layout of your organization
    and other reconnaissance. With malicious intent, the attacker may attempt to poison
    your name service itself by falsifying name records. He could make your organization
    completely invisible to the world by removing key entries as a denial of service
    attack. Or worse, the attacker could point your organization''s Web servers to
    another domain under the attacker''s control. If this new domain was sufficiently
    disguised to look like your organization'' operations, the attacker may enjoy
    success by fraudulently collecting credit information or other private data from
    your customers. Obviously, you need to secure and protect your domain name services,
    and this section teaches you how to do so.


    www.synergy.com'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Chapter 6 • Securing Network


    # Using BIND


    If you are running the default DNS server that came with Solaris 8, you are probably
    in big trouble, whether you know it or not. Solaris has historically used BIND
    for its DNS daemon. Although BIND probably has the largest market share of its
    DNS daemon in use on any operating system, it is one of the most notoriously insecure.
    From 1997 to 2001, 12 separate CERT package advisories were issued for vulnerabilities
    or exploits to the BIND DNS package affecting many different versions of BIND,
    according to CERT advisory CA-2001-02, "Multiple Vulnerabilities in BIND." The
    majority of these vulnerabilities are related to buffer overflows, and most of
    them affect the default version of BIND shipped with Solaris 8.


    To avoid becoming a potential target for these types of attacks, you will need
    to at least update your version of BIND. To this effect, you have several options,
    including loading system patches from Sun, installing newer versions of BIND based
    on updated vendor (ISC) source code, or running the newest breed of BIND, version
    9 BIND is a complete rewrite of BIND and has yet to share any common vulnerability
    of BIND major versions 4 or 8.


    # Setting Up a chroot jail for BIND


    Additionally, for added security, you should consider running your name service
    in a chroot jail environment which limits the damage intruders can do to your
    systems. Typically, if your name service is compromised and it runs as the root
    user, the intruder has complete access to your system. However, through the use
    of the chroot facility, access is limited only to the daemon itself, which is
    run separate from the rest of the operating system. Here, your intruder would
    only be able to subvert your name service, which is still not desirable for already
    described, but the intruder will not gain access to your other system services,
    such as mail. Nor will your intruder be able to steal passwords from the password
    database. The following steps describe how to set up BIND in a chroot jail for
    Solaris 8. It is assumed that you already have BIND 8 configuration and zone files
    for your domain.


    Make sure that you read the following steps thoroughly and understand them completely.
    You should always test any major configuration change like this one on a lab system
    before implementing it on a production system.


    First, replace the version of BIND that ships with Solaris 8 with the newest version
    of BIND 8, or at least version 8.2.3 or later. You can get the source code for
    the newest version of BIND 8 directly from ISC at www.isc.org/products/BIND/bind8.html.
    If you have no compiler available, it is acceptable to download'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Securing Your Network • Chapter 6 175


    BIND 8.23 in binary package format from the Sun freeware archives at www.suneware.com/programlistspar8.html#bind.
    We assume that you have chosen the latter option and have installed the software.
    Beware that the uncompressed package for BIND 8.2.3 is nearly 100MB. Proceed to
    the Korn shell instructions for creating the chroot jail:


    +   Determine where your jail will be located. In this example, we use /var/named
    as the root of the jail, and set a shortcut environment variable for it, as shown.
    Go ahead and create the directory structure as well.


    ```

    # mkdir /var/named

    # export BINDPATH=/var/named

    # cd $BINDPATH

    # mkdir dev opt usr var etc

    # cd var; mkdir run log named; cd ..

    # cd usr; mkdir local lib; cd ..

    # mkdir -p usr/share/lib/zoneinfo

    ```


    +   Populate the $BINDPATH/etc directory and add the BIND user accounts. Note
    the -a option on tee will append the existing files. If you leave off, you will
    overwrite your system accounts, and your system will become unbootable.


    ```

    # cd /etc; cp syslog.conf netconfig nsswitch.conf resolv.conf \

    # TIMEZONE "named:x" $BINDPATH/etc; cd $BINDPATH

    # echo "named:x:65000:65000:DNS user account:/tmp:/bin/find" | \

    # tee \

    # -a /etc/passwd $BINDPATH/etc/passwd

    # echo "named:NP:64545:::" | tee -a /etc/shadow \

    # $BINDPATH/shadow

    # echo "named::65000:" | tee -a /etc/group $BINDPATH/etc/group

    ```


    +   Determine the library files you will need in the jail and copy them into place.
    Note that your library files may be different than those shown.


    ```

    ldd /usr/local/sbin/named /usr/local/sbin/named-xfer | grep so \\

    | cut -f3 | sort -u

    | /usr/lib/libc.so.1

    ```


