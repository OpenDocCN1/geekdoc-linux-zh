    X11Forwarding to yes and the ssh_config ForwardX11 option to yes.That''s all there
    is to.


    # Using Remote Commands


    More than not, your Solaris servers require some type of remote login access,
    if not for your users then at least for administration purposes. Remote logins
    most likely use built-in system programs such as telnet, login, rsh, rex, or third-party
    software as SSH. Allowing remote login access is as dangerous as it is. This section
    describes the most common dangers associated with remote logins and how you can
    mitigate associated risks.


    # Using Built-In Remote Access Methods


    The most commonly used means of remote access are through system commands known
    as telnet and the Berkeley r-commands which include login, rexec, and rsh. All
    of these methods allow a remote user to gain access to a Solaris system, and this
    access can be divided into two groups, interactive and noninteractive active access.
    Interactive access, such as login and telnet, present the user with a virtual
    terminal to interact with the system whereas noninteractive access would include
    rsh and rexec, which run individual commands on the remote system and redirect
    the output to the local system.


    The problem with these means of access is that neither the authentication nor
    the protocol is secure. Both login and telnet perform user authentication using
    passwords, which is a marginal level of security because passwords are sent across
    the wire in cleartext. Because of this, a hacker can easily obtain passwords through
    traffic sniffing and can leverage these stolen passwords to fraudulently gain
    access to user accounts.


