    # Using Sudo


    In order for a system to run as an effective network sniffer and traffic analyzer,

    certain programs and daemons run with super-user privileges. With the

    advent in the last several years of remotely-exploitable buffer overflows, any

    system administrator knows that letting software run as root, with all the privi-

    ileges and rights inherent to the root user, can be dangerous at best. In addition
    to

    root-based security concerns, many organizations have the need to grant certain\users
    super-user rights for a very small set of software and related commands.

    We most run into this database and Web administrators. However, as the

    importance of network security increases, so does the size of a typical corpo-

    rate security increase.


    Sudo isn''t a command-switch option, but it has a few com-

    mand switches. The option we are interested in for our immediate purposes is:


    +   - -l Lists the allowed and forbidden commands for the user.


    Other important options you may want to investigate are:


    +   - -v Validates the user''s timestamp field and extends the timeout. As we

    will see below, when you use Sudo, a timer is started once you enter

    your login password. When this timer expires (default 300 seconds), any

    subsequent use of Sudo privileges requires password re-entry.

    -k K a timestamp. Lets kill off your Sudo timer.

    -b Tells Sudo to run the command in the background (good if you are

    about to start a batch job or the like).


    Although we haven''t used most of these switches, they will be fully explored

    and as you deploy Sudo in your Solaris environment. Now, why we use sudo

    instead of just using su?


    One problem with teams is that each member has a particular specialty.

    The performance of the duties related to these specialties, with specific regard

    the network- and system-level responsibilities, often calls for super-user rights
    on

    y number of systems. The simplest solution, and the most dangerous one, is to

    hand everyone the root password and hope nothing goes wrong. The more


