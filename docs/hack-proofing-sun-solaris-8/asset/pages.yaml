    # # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    **Q:** How does John the Ripper work?


    **A:** John the Ripper works in three modes. The first is the wordlist mode. In
    this simplest mode, John uses a wordlist, encrypts each word, and compares the
    encrypted hash to the password file. The second mode, single-crack mode, uses
    the information in the login/GECOS field of the password entry as passwords. This
    mode is significantly faster than wordlist mode. The third mode is incremental
    mode. This is the most powerful one, and it will try all possible character combinations
    as passwords. John the Ripper has one more mode, called the external mode, which
    is not commonly used. In external mode John uses functions that are coded by the
    user in a subset of the C language to generate the words it tries. The functions
    are compiled by John at startup.


    **Q:** An attacker hit one of my systems and deleted evidence of the attack from
    the log files. How can I ensure that such evidence is protected?


    **A:** In order to ensure that the logs from a system survive an attack, you will
    have to setup the syslog facility on your system to a syslog server. A syslog
    server can be any other system that has a syslog daemon running on it and is set
    up to receive remote syslog messages from other systems. The syslog server should
    be configured to be as secure as possible, because if an attacker infiltrates
    a system and discovers that system messages are being logged to a syslog server,
    that server will most likely be the next target for the attacker.'
  merge: -1
  img_proc: true
- pgno: 346
  md: "# Chapter 10 · Dissecting Hacks\n\nQ: How do I make TCP hijacking attacks more\
    \ difficult?\n\nA: TCP hijacking attacks are made possible by a weakness in the\
    \ TCP Initial Sequence Number (ISN). When a client opens a connection to a server\
    \ using TCP, it sends a SYN packet with the Initial Sequence Number set to some\
    \ value. The server responds with a SYN-ACK packet with its own ISN, along with\
    \ an acknowledgement number that is equal to the client’s TCP ISN plus 1. The\
    \ client then responds to the server with an ACK packet whose sequence number\
    \ is set to the server’s TCP ISN plus 1. Once that is done, the connection is\
    \ considered established. The following is an example of this three-way handshake:\n\
    \n```\nSender (client)                                     Destination(server)\n\
    SYN-----------------------------------------\n(Sequence #: X)                \
    \                     SYN-ACK\n        <                              (Sequence\
    \ #: X+1, Sequence #: Y)\n\nACK-----------------------------------------\n(Sequence\
    \ #: Y+1)\n```\n\nThe problem occurs in the generation of the TCP ISN. In the\
    \ old days of UNIX, this value would increase by 64000 for every new connection.\
    \ Today, many operating systems utilize pseudo-random number generators to generate\
    \ a value for the TCP ISN for every new connection. The strength of Solaris’s\
    \ TCP ISN generator is controlled by the value of the TCP_STRONG_ISS variable\
    \ in the file /etc/inet/init. This value can be set to 0, 1, or 2. When set to\
    \ 0, TCP ISN generation is done using the old sequential method. This is entirely\
    \ predictable and should never be used. TCP_STRONG_ISS is set to 1 (which is the\
    \ default), Solaris uses improved sequential number generation with random variance\
    \ in increment. To set Solaris’s TCP ISN generator to utilize strong pseudo-random\
    \ number generation, in which each TCP ISN is unique for each connection ID, the\
    \ value of TCP_STRONG_ISS should be set to 2.\n\nAnother way to increase the randomness\
    \ of the TCP ISN number generation is to echo a large set of random information\
    \ to the kernel parameter tcp_1948_phrase. This parameter is write-only, and provides\
    \ a seed for random number generation in accordance with RFC 1948. To seed the\
    \ kernel random number generator using this feature, the command:\n\n```\n# ndd\
    \ -set tcp_1948_phrase <some large set of random numbers>\n```"
  merge: -1
  img_proc: true
- pgno: 347
  md: 'Q: How can I keep a Solaris system from participating in denial of service
    attacks like SMURF?


    A: The SMURF attack involves sending a spoofed ICMP echo-request packet to a network''s
    broadcast address. All systems on the network will receive the ICMP echo-request
    and send an ICMP echo-reply to the source host in the spoofed packet. To keep
    a Solaris system from participating in a SMURF attack, the kernel parameter ip_respond_to_echo_broadcast
    should be set to 0. To do this, use the command:


    ```

    # ndd set ip_respond_to_echo_broadcast 0

    ```


    Q: How can I tell if an attacker has installed trojan binaries on my system?


    A: Sun provides a tool on the SunSolve Web site called the Solaris Fingerprint
    Database. This is a large database of MD5 signatures for every binary in the Solaris
    operating system (including patched binaries). If you suspect that a program has
    been replaced with a trojan binary, go to the SunSolve Web site (http://sunsolve.sun.com/)
    and download the MD5 signature program. Sun provides two versions of this program:
    one for Solaris SPARC and one for Solaris x86. Run the program with the name of
    the suspect binary as its argument. The output will be an MD5 hash signature for
    that binary. Copy that into the input field of the Solaris Fingerprint Database
    on SunSolve and click the submit button. If the MD5 signature for the suspect
    binary matches a signature in the database, a confirmation will be shown. Otherwise,
    the database will return a failure for the match.'
  merge: -1
