    # Using X-Server Services Securely


    X-Windows is a marvelous technology that allows you to run GUI applications from
    one machine using the display hardware at another machine. If used effectively,
    it can allow you to administer your entire Solaris network from one console using
    both GUI and command-line tools. However, such functionality is not without its
    price. Because the X-protocol lacks tight security, remote sessions are vulnerable
    to session hijacking and keystroke logging. This section teaches you about how
    X-Windows authenticates clients using host-based and user-based access.


    Granting access to an X-server is completely different from granting access to
    other system resources, such as files. You can control file access using tight
    access lists and permissions which the level of authorization can vary greatly
    from read-only to full read/write/execute permissions. Access to an X-server is
    granted on an all-or-nothing basis. If you have access to the X-server, you have
    complete control over it and can use the X-Window services to their their full
    capabilities. Similarly, if you don''t have access to an X-server, you can''t
    interact with it at all.


    > NOTE Note that X-Windows functions opposite of the normal client/server paradigm.
    For example, when you telnet to a Solaris server, you are using a telnet client
    program on your local host to connect to a telnet server on the remote host. For
    X-Windows, the X-server handles display functions for the directly attached hardware
    (console, monitor, mouse, and so on), and the X-Clients are the programs that
    reside on the remote hosts. Thus, the console you are sitting in front of is the
    X-server, and the programs executing on it are X-clients, and these programs may
    be located either locally or remotely.'
