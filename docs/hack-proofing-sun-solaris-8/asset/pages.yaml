    # Defending against Password Crackers


    Defending against password cracking is one of the oldest problems in system security.Weak
    passwords have been the source of the fact that users need to choose something
    that is easy to remember. This fact is leveraged by attackers when they first
    try to access a system.


    The first line of defense against brute force attacks and the success of password-cracking
    programs is setting a policy for passwords. Obviously, passwords should not be
    words that are easy to guess, such as the user’s name. Pass should, at the minimum,
    include one number, one metacharacter, and at least one change in case. Passwords
    should also have a maximum lifetime set, but be careful not to make the lifetime
    for a password too short–the shorter the lifetime, the more likely it is that
    users will gravitate toward weaker passwords.


    There are many methods of testing password strength, including challenge-response
    systems and the use of programs to check passwords as users choose. Some of the
    most common password-checking programs include anpasword (Argonne National Laboratory),
    npasswd, and passwd+. These programs perform proactive checks on user passwords
    and do not accept passwords that are deemed too weak. In addition, John the Ripper
    has written a password-strength-checking program for PAM-aware password-changing
    programs. Finally, it is extremely important to periodically run the system/shadow
    file through a password-cracking program like John the Ripper or Crack. This is
    one of the best methods of proactively identifying accounts with weak passwords.
    A note of caution, the use of tools such as John the Ripper may require management
    approval. There have been cases of system administrators being reprimanded and
    even having employment terminated due to the unauthorized use of these types of
    tools.


    Another defense against brute force attacks against passwords is the use of one-time
    password systems. These can range from the SecureID system from RSA Security to
    the freeware S/Key and OPIE (One-time Passwords In'
