  md: '# Chapter 2 • Securing Solaris with the Bundled Security Tools


    0x00001000:lo:login or logout


    0x80000000:ot:other\0xffffffff:all:all classes


    As you can see, the classes range from net “no” class to the “all” class. All
    audible events that occur fall into one of the audit_class file. The format of
    a record in the file is:


    mask:name:description


    The next file to be discussed is the audit_event file. This file contains the
    records of specific events that fall under certain classes. For example, take
    the following excerpt from the audit_event file:


    ```

    20:AUE_REBOOT:reboot(2):ad

    ```


    This record shows that use of the reboot command is logged under the ad, or administrative,class.
    The classes ranging from 1 through 2047 are reserved for kernel-level events.
    Events ranging from 2048 to 65,535 are reserved for user-level events with the
    range from 32,768 to 65,535 specifically designated for third-party events.


    # Configuring Auditing


    The last file we discuss is the audit_user file. This file provides a means of
    specifically auditing individuals on the system. Certain coding standards provide
    specific control over auditing. The audit flags are as follows:


    +   + Audit for success

    - Audit for failure

    Audit for both success and failure

    + Turn off auditing for success

    - Turn off auditing for failure

    ^ Turn off auditing for success or failure


    So, for example, an entry in the audit_user file for a user with the username
    jane own is:


    ```

    janeill:all,^fr

    ```


