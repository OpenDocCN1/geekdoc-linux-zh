- pgno: 341
  md: '# Dissecting Hacks • Chapter 10


    system to another, the sender must know or be able to determine the MAC address
    of the receiver in order to properly send the frame onto the LAN. This is where
    the Address Resolution Protocol (arp) comes into play. When one system wishes
    to send an Ethernet frame to another, it must somehow resolve the MAC address
    of the receiver. To do this, the sender broadcasts a request onto the LAN asking
    the machine with the target IP address identify its MAC address. Because the request
    is broadcast, all hosts on the LAN receive the packet. The intended receiver then
    sends a reply stating its IP address as well as its MAC address.


    Arp spoofing requires the attacking host to construct arp requests and replies.
    By sending forged arp replies, a target system can have traffic redirected from
    the intended destination to the attacking system. When done properly, the intended
    system will not even realize that the redirection has occurred. Using arp spoofing,
    an attacker can sniff traffic on a switched network by sending the spoofed MAC
    address to the switch. All traffic destined for the target system is also sent
    to the attacking system. It is also possible to execute a denial of service against
    a system by arp cache poisoning, wherein invalid MAC addresses are inserted into
    the target''s arp cache. It is also possible to hijack a communication session
    between two systems using a man-in-the-middle type of attack.


    Detecting a spoofed MAC address is not easy, especially if the attacker is only
    listening in on a communication session, and not actively participating in it.
    The only way to determine whether MAC address spoofing is occurring on a LAN is
    to examine the Ethernet packets in their entirety with a tool such as Ethernet.
    This type of examination requires knowledge of the MAC addresses of both sides
    of a communication session. Another such tool is the program called arpwatch,
    which listens on an interface for arp requests and replies. It uses these requests
    and replies to build a table of MAC-to-IP address mappings. When the MAC address
    changes, arpwatch sends an e-mail to the system administrator. Another defense
    against MAC spoofing is to utilize static arp addresses in the arp cache as described
    in the section "Securing Your .hosts File." However, in a LAN of any significant
    size, this method becomes unmanageable due to the necessity of constantly maintaining
    the arp cache information on all hosts.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_341_0.png)'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Summary


    Understanding exploits work against a Solaris host helps systems administrators
    to defend against attacks. Denial of service attacks aim either to eat up all
    the resources on a system, as in the TCP SYN flood, or to bring the system down
    completely, as the Ping of Death. Buffer overflow attacks aim to provide an attacker
    with access to the system, or provide elevated privileges if access has already
    been gained by other means. Brute force attacks are used to gain account passwords.
    These attacks can be used to extend the penetration of a system to other hosts
    by relying on the fact that people tend to use the same passwords on multiple
    hosts. Trojan attacks involve replacing systems, such as login, with replacement
    programs that provide the attacker with additional abilities. These abilities
    could be something as recording username and password in a file for later useal,
    or something as significant as providing an attacker with access to the system
    if a magic password is given upon login. Logic bombs are some of the most difficult
    hacks to detect, and can include attacks that remain dormant for weeks or months
    before they are triggered. When triggered, they may produce devastating results,
    such as the deletion of key elements of the operating system or the destruction
    of database files. Attacks may also be performed by placing trojan binaries early
    in the search path for users, such that the trojan binary is executed in place
    of the real program. And finally, there is IP and MAC spoofing, which is done
    to exploit trust relationships between machines using the old, insecure r-services.


    We’ve covered a great deal of ground in this chapter, but if you’d like more information,
    start with the following links:


    +   passwd+ http://ftp.dartmouth.edu/pub/security/passwdplus.tar.Z

    anlpasswd http://ftp.cerias.purdue.edu/pub/tools/unix/pwdutils/anlpasswd/anlpasswd-2.3.tar.Z

