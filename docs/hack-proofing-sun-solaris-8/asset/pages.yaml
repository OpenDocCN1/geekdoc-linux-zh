    \ On the other hand, it is a very useful feature for a malicious spammer. If you\
    \ see something like this in an unknown sendmail.mc file, especially without an\
    \ explanatory comment, you should immediately check your mail host to see if it\
    \ is allowing relaying based on the header.\n\n```\nteal@incoming-traveller.com@nox.net\n\
