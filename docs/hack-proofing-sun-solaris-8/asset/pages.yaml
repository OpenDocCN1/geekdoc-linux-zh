    variable defines those events that are designated to be logged systemwide for
    all users. The naflags: variables for nonartributable flags are again, intended
    as all-inclusive events, but they are those events that cannot be assigned to
    a user due to the timing of the events before the audit identification number
    is assigned to the process. The contents of the audit_control file look like this:


    ```

    root # cat audit_control

    #

    # Copyright (c) 1988 by Sun Microsystems, Inc.

    #/ident (@#)audit_control.txt 1.3 97/06/20 SMI

    #

    dir:/var/audit

    flags:

    minfree:20

    aflags:lo

    root #

    ```


    The audit identification number is determined by two factors. First, the audit
    preselection mask is determined by the flags and naflags: variables in the audit_control
    file. Second, an user ID is generated for each process that is created, giving
    its definitive accountability in the audit trail, regardless of such changes as
    the su or setuid commands.


    # Understanding Auditing Classifications


    Several files in the /etc/security directory are specifically related to controlling
    the audit function. The first to be discussed is the highest in the hierarchy
    of control. It is the audit_class file and contains the broadest categories related
    to system auditing. As example, an abbreviated section of the file is shown here:


    ```

    0x00000000:no:invalid class

    0x00000001:fr:file read

    0x00000002:fw:file write

    .

    .

    0x00000400:na:non-attribute

    0x00000800:ad:administrative

    ```


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_67_0.png)'
