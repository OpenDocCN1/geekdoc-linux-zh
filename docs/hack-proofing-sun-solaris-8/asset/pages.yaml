    # Tripwire’s Monitored Files


    Tripwire gives nine levels of security descriptors for every directory and file
    that it will monitor on your system. Each file described in the tw.pol policy
    file will be assigned one of these variables to determine how it will be monitored
    by Tripwire. Table 11.1 describes each variable.


