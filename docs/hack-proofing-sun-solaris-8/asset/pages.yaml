  md: '# Chapter 5 · Securing Your Files


    request with a username but no password when talking to a security=share server.
    Instead, the clients send authentication information (passwords) on a per-share
    basis at the time they attempt to connect to that share.


    +   - security=user This is the default security setting in Samba 2.0. With user-level
    security, a client must first log on with a valid username and password (which
    can be mapped using the username map parameter). Encrypted passwords (see the
    encrypted passwords parameter) can also be used in this security mode. Parameters
    such as user and guest only, if set, are applied and could change the UNIX user
    on this connection, but only after the user has successfully authenticated. Note
    that the name of the resource being requested is not sent to the server until
    the server has successfully authenticated the client. For this reason, guest does
    not work in user-level security without allowing the server to automatically map
    unknown users into the guest account.


    +   - security=server In this mode, Samba tries to validate the username/password
    by passing it to another SMB server, such as an NT box. If it fails, it reverts
    to security=user, but note that if encrypted passwords have been negotiated, Samba
    cannot revert the UNIX password; it must have a valid smbpasswd file to check
    users again. See the documentation file in the docs/ directory ENCRYPTION.txt
    for details on how to set this up. Note that from the client''s point of view
    security=server is the same it affects only how the server deals with the authentication;
    it does not in any way what the client sees.


    +   - security=domain This mode works correctly only if smbpasswd has been used
    to add this machine into a Windows domain. It expects the encrypted passwords
    parameter to be set to true. In this mode, Samba tries to validate the username/password
    by passing it to a Windows NT primary or backup domain controller, in exactly
    the same way that a Windows NT user would exist, as must the account on the domain
    controller, to allow Samba to have a valid UNIX account to which it can map file
    accesses.


    Note that from the client''s point of view, security=domain is the same as security=user.
    It affects only how the server deals with the authentication; it does not in any
