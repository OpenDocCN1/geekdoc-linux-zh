- pgno: 381
  md: '# Summary


    It is impossible to prepare for the unexpected. If you could, it would then, by

    definition, be called the expected. No matter how hard you fortify your walls,

    seday someone will get inside. The concepts described in this chapter will

    help you once someone makes it over the walls.


    In this chapter, we covered methods to detect and deny hacking attempts

    against our systems. It''s important not to depend on any one method to keep our

    systems protected.


    We discussed creating our tools, such as customized scripts. Many

    hackers are familiar with popular intrusion detection software as you will ever

    . They know the strengths and weaknesses or how to find a way around the

    software. One way to gain an advantage is by creating your own set of security

    scripts. Experiment with different ways of using them to monitor your protected

    systems.


    We also covered building our honeypot system. A homemade honeypot is

    power tool. Since there''s no way to set it up, it''s difficult for a hacker to

    det and avoid. When building your honeypot, make sure that you think like a

    hacker. Test it thoroughly. I''ve often challenged my co-workers to test a honeypot

    sfor before I put it into production. Commercial versions of honeypots also offer

    solid, tested applications that you can configure to suit nearly any security
    need.


    We also covered using third-party tools such as Tripwire and commercial versions
    of honeypot software. The open-source and commercial versions of

    Tripwire are excellent ways to monitor for unauthorized activity. The open

    source has the advantage of being free, while the commercial version offers

    useful bells and whistles. Either way, this is a must-have for your security

    toolbox.


    Finally, we discussed a way to get a quick overview of the systems for which

    ''re responsible e-mailed to us each morning. Using customized scripts that are

    scheduled to run on a regular timetable, we can see the data we want to see

    ent the integrity of our protected systems. This provides a valuable resource
    of

    information and serves as a reminder that security requires constant maintenance.


    Designing a solid security environment is challenging and frustrating—

    challenging that it takes constant review (you can never stop looking for

    trouble) and frustrating in that the only time your efforts will really get noticed

    is when you fail. Isn''t that a cheesy thought? Use that idea as a way to keep
    you

    on your toes. Remember, nobody ever surprised a true paranoid.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_381_0.png)'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# Solutions Fast Track


    # Monitoring for Hacker Activity


    +   - Using Tripwire is an excellent way to monitor changes to files and directories.
    While the commercial version offers additional features, the open-source version
    is an ideal solution for providing security on a limited budget.

    - The trippol file is the policy file that decides what is monitored by Tripwire
    and when the alerts are sent.

    - The commercial version offers Tripwire Manager, which you can use to monitor
    and configure multiple systems remotely.


    # Using Shell Scripts to Alert Systems Administrators


    +   - You can use custom shell scripts to provide additional monitoring.

    - Make sure that the scripts are in a secure directory and run by a nonzero account.

    - Use the crontab command to set the scripts to run on a regular schedule.


    # What to Do Once You’ve Detected a Hack


    +   - A honeypot is a system designed to lure hackers away from your protected
    systems or networks.

    - A honeypot should be configured carefully so as not to allow the hacker to gain
    access to other systems while the same time monitoring the hacker''s activity.

    - Commercial version of honeypots can simulate entire networks, but be aware that
    the false system will all originate from the same MAC address.


    # Monitoring Solaris Log Files


    +   - The logs under /var/adm are valuable for getting information on recent activity.


