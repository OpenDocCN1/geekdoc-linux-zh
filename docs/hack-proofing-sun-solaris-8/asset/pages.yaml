- pgno: 152
  md: '# Introduction


    If the CPU is the brain of the computer, the file system is surely the body. Like
    your own body, this one requires constant care and special treatment. Failure
    to provide these can lead to the destruction of some or all of your vital data,
    either through intentional attacks or accidental oversights. This chapter points
    out some common configuration flaws and oversights and demonstrates, through some
    realworld examples, how these mistakes can lead to disastrous consequences.


    Our goal is twofold:We want a really secure system, but we also have to keep in
    mind the function of the system. In fact, we can''t even starting a system until
    we have thoughtfully and carefully evaluated the needs that our system will fulfill.
    Will users employ the system via locally attached or virtual terminals? Will it
    be a file server using NFS or Samba to communicate with users? Will it offer HTTP
    or FTP services via the Internet, or will it be a general-purpose machine fulfilling
    some or all of these tasks? Will the system be protected by a firewall, monitored
    by an IDS, or otherwise protected from the claws of attackers, will it be alone
    on a DMZ network, doing its best to maintain data integrity?


    In the strictest sense, the process of securing a system is a simple thing. Simply
    cut the network cable, remove all the user accounts, place the system in a safe,
    and weld it shut. Although that statement is obviously an unrealistic exaggeration,
    often we see the end of the spectrum in place in organizations. We have audited
    too many Solaris systems run with the idea that any security measure that interferes
    with function is forbidden. What is often overlooked is there are ways to interweave
    security into the function of the system—ways that are often transparent to the
    end user. As I have said in the past, I dream of a world in which such a system
    is not considered functional until it is proven secure. Unfortunately, that world
    is pretty far off, so in the meantime, we have to make do what we have to work
    with.


    Let''s start with the basics of file system security: file permissions and ownership.
    We must ensure that existing files have safe permissions and ownership while making
    certain that new files are not left as weak links.You''ll also be introduced to
    a fairly recent Solaris addition, Role-Based Access Control (RBAC). From there,
    you''ll learn how to share resources while maintaining security. In the end, we''ll
    have a robust and secure system.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_152_0.png)'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Establishing Permissions and Ownership


    Take the first step toward securing your file system by securing the files themselves.
    Before we start down that road, however, we must be sure that we have a clear
    grasp of what comprises the file system, how minor oversights allow exploitation
    by hackers, and how small steps can take us great distance toward security. We
    start with a refresher on file permissions, or modes, and continue into a discussion
    of some of the more important nodes in security, as well as overall integrity,
    concerned.


    Solaris''s roots are found in the System V Release 4 UNIX variants, and the file
    system shares a great deal of affinity with that heritage. Security for this file
    system is controlled by access permissions, which in turn determine which user
    can do with each file. (Remember that a directory is just a special kind of file
    that holds the file''s contents and the node that points to it.) These permissions
    are made up of three simple components:


    +   **Read** Processes started by the user open a file and read its contents.
    For a directory, this means that a user may list the contents of the directory.

    * **Write** Processes started by the user may alter the contents of the file.
    For a directory, this means that the process may unlink the file from that specific
    inode. (In other words, the file can be deleted from the directory)

    * **Execute** Processes started by the user may execute the file. This is meaningless
    for files other than compiled binaries or scripts meant to be run as though they
    are binaries. In addition, script files need to be readable in order for the execute
    bit to have any impact. For directories, this means that a process can set this
    directory as its working directory. Note that a user does not need execute permission
    in order to mock up directories. Write permission without execute permission allows
    users to remove files even though they haven''t set the specific directory as
    the working directory.


    These permissions are modified on the fly by the application of a umask. The umask`
    is set globally in the /etc/default/login file but can be overridden by users
    in their .profile, cshrc, or via the command line. The umask` provides a value,
    in octal, that will be subtracted from the default permissions when a file is
    created. For example, the default directory permissions are 777 and the default
    umask` is 022, so that leaves us a permission of 755 upon directory creation.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Chapter 5 · Securing Your Files


    There are three categories of users to whom the permission applies: owner, group,
    and other. Every user belongs to at least one group and can (and should!) belong
    to more than one. Users who belong to many groups may change their group attribute
    (both real and effective) by executing the newgrp(1) command. Groups are a very
    useful and frequently overlooked aspect of Solaris security. I I see audited systems
    for companies and have seen groups implemented effectively. Usually I see a one-to-one
    ratio, in which users belonging to only one group. This really hampers the flexibility
    for a sysadmin, but the reasoning behind it is easy to see. Maintaining groups
    is laborious, but it is an effort that is well worth the time. Let''s take a second
    to review the format of the /etc/group file and how groups can add to a basic
    level of security.


    The /etc/group file is similar in format to the /etc/passwd file, with the differences
    being in the makeup of each field. The fields have the following values:


    +   * Groupname

    * Group password

    * Group ID (GID)

    * User1, user2, user3.


    These fields are pretty self-explanatory, but we should point out a wrinkle concerning
    the group password. Currently, there is no Solaris command to aid in creating
    a group password. Group passwords are used less than groups themselves. They give
    the ability to change to a group to users who aren''t listed in the /etc/group
    file. If you want to assign a password to a group, you have the passwd(1) command
    to create the hashed value in the /etc/shadow file then cut and paste the value
    into the group field in the /etc/group file. Groups can be added using the groupadd(1M)
    command, modified using the groupmod(1M) command, and deleted using the groupdel(1M)
    command.


    Permissions are checked at the most specific level, meaning that other permissions
    won''t be checked for a user who belongs to the group that owns the file, and
    group permissions won''t be checked for the owner of the file. Solaris is smart
    enough to check the /etc/group file. If you belong to the group that owns the
    file, you will be allowed those group permissions, regardless of your current
    GID. To demonstrate, let''s assume our admin, created a directory called /public_notices
    from the root. This directory is used to distribute information to specific categories
    of people, a task for is not suitable. Our admin has assigned the permissions
    and ownership that the files


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_154_0.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Securing Files · Chapter 5


    that are applicable to the specific users can be viewed, but no other files may
    be read. None of the files can be changed except by the root user. The results
    are illustrated in Figure 5.1. Notice that, even though our admin scarter, has
    a real GID of 101 (users), the file notice_administrators is readable. This is
    because scarter is also a member of the sysadmin group. The notice_accounting
    file, which is owned by a group which scarter does not belong, is inaccessible.


    # Figure 5.1 Use of Groups to Control Access to Files


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_155_0.png)


    This system of permissions is pretty limited as far as the file owner. Basically,
    since only one owner is allowed and only one group, you don''t have a lot of flexibility
    in allowing others to access your files. There are solutions to this problem,
    but they aren''t always elegant. For compiled binaries and interpreted scripts,
    you have the option of using special SETUID bits. These allow the executor to
    operate under the permissions of the owning user or group. This solution is handy
    when you have one or two applications you want to make available to the general
    population but require special permission. It also allows you to allow the user
    to operate with privileges that normally wouldn''t have, such as those of the
    root user. Here, however, lies the risk. No program, be it a binary or a script,
    should be made SETUID or SETGID without careful consideration and a good dealing
    of testing. Programs with these special bits can be used to compromise the entire
    system! A perfect example of this dilemma is a buffer overflow found in the whodo
    program. The whodo program, which displays information about which users are doing,
    is installed with the SUID bit on and the owner set as root. It needs to run with
    root privileges in order to function, since to gather output, whodo needs to read
    the UTMP log as well as the process table, both of which are restricted.


    www.synergy.com'
