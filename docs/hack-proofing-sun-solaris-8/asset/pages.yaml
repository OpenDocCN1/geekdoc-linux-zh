    ```

    interface_names=" echo /etc/hostname.*[0-9] 2>/dev/null"


    if [ "$interface_names" != "/etc/hostname.*[0-9]" ]; then

    ```


    This section of code begins the parsing of hostname.interface files, putting them
    into the $interface_names environment variable. The interface is placed into environment
    variable $1, and on line 106 the interface is plumbed:


    ```

    /sbin/ifconfig $1 plumb

    ```


    Finally, when line 123 of the script is reached, the interfaces are configured
    by the following code:


    ```

    /sbin/ifconfig $1 inet $ifcmams \


    2>&1 >dev/null

    ```


    When this script completes, all network interfaces with a hostname.interface configuration
    file in the /etc directory are configured and ready for communication. The system
    completes its execution of the init scripts in the /etc/rcS directory and, under
    normal circumstances, continues to multiuser mode. The program moves on /etc/rc.2
    and eventually executes S69inet, which begins the second phase of network initialization.


    # The S69inet Script


    S69inet is executed when the system reaches run-level 2, or multiuser mode. S69inet
    is an inline link to master configuration file /etc/init.d/inetit. At this stage
    the necessary routing functions are configured, and if a machine is configured
    with two or more interfaces, the system begins routing between interfaces. If
    this is the intended configuration, this can be a good thing. However, if the
    system''s intention is to function as a multihomed host in a high-availability
    configuration, this configuration can have unexpected results.


