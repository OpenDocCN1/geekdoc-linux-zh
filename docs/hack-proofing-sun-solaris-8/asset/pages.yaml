    username:flags_to_audit:flags_to_not_audit

    ```


    The flags are the same as found in the audit_control file. When you enable BSM
    auditing of user commands (the ex class), it''s a good idea to also turn on auditing
    of the arguments to these commands. By default, BSM logs only the command, but
    entering the auditconfig command with the -setpolicy option allows you to tighten
    the scope a little:


    ```

    auditconfig -setpolicy +argv

    ```


    To process the audit data, you need to use the auditreduce and praudit commands.
    Use auditreduce to select and optionally delete records from the audit file; this
    is often used to generate data that will be piped to the praudit command.Read
    the man pages for each of these commands to familyize yourself with the more options.We''ll
    take a brief look at some of the more ones here, as outlined in Table 5.3.


    # Table 5.3 Auditreduce Command Options


    | Option | Description |

    | -r /pathname | Specifies an alternate audit_root directory. Useful if you archive
    records to an alternate directory. |

    | -s server | Directs auditing to read audit records from a specific server''s
    directory. Useful when you are collecting records on a central audit server. |

    | -a date-time | Finds records on or after the specified date and time. (Can be
    used with -b to form a range.) |

    | -b date-time | Finds records on or before the specified date and time. (Can
    be used with the -a to form a range.) |

    | -d date-time | Selects records on a specific date and time. |

    | -c classes | Selects records by audit class. |

    | -r user | Selects records generated by a specific user. |


    For example, the following command would find the logins by our administrator,scarter,
