- pgno: 350
  md: '# Introduction


    Someone asked the Depression-era gangster John Dillinger why he robbed banks.
    He replied, "Because that''s where they keep the money." If you have a Solaris
    system that contains important data or performs mission-critical duties, you certainly
    want to protect it. However, the more you lock your system, the more enticing
    it becomes to potential hackers. The first rule to remember when fortifying your
    defenses is that your efforts will most likely fail. If a determined, skilled
    hacker wants in, chances are, that he or she will get in.


    Much of this book focuses on configuring and utilizing existing tools to get the
    maximum intrusion detection and prevention benefits. This chapter focuses on creating
    your own unique blend of Solaris apps, third-party tools, and custom scripts to
    fortify your defenses. It also discusses ways to monitor for a breach in your
    security and methods to sound the alarm when such a breach happens.


    # Monitoring for Hacker Activity


    Using the assumption that our well-planned defenses will someday fail, we need
    to put measures in place that allow us to know when unauthorized access has occurred.
    The key is to know what to look for. In this section we cover ways to monitor
    a Solaris system for unusual activity.


    # Using Tripwire


    The term Tripwire, used in conjunction with hunting or warfare, relates to a thin
    wire stretched across a pathway. When broken by the approaching enemy, this wire
    sets off an alarm or trap of some kind. The software called Tripwire, made by
    the company of the same name, operates much the same way. It was originally written
    by Gene Kim and Dr. Eugene Spafford of Purdue University. The goal was to take
    a "snapshot" of important system files, which would then periodically compared
    to the current system files. Any changes from the original snapshot set off an
    alarm. The company very responsibly made the software available to others who
    had similar security needs, and today it is one of the most popular and effective
    security tools you can have in your toolbox. Sun Microsystems is a big supporter
    of Tripwire''s products and recently invested heavily in the company. You can
    read more about Sun''s relationship with Tripwire at www.sun.com/security.'
