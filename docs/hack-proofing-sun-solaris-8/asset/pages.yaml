- pgno: 392
  md: '# Chapter 4 Continued


    # Authenticating Users with Kerberos


    +   - Kerberos is an authentication system that relies on mutual trust of a secure
    third party, called the Key Distribution Center (KDC). The basic tenor of Kerberos
    is that the Kerberos principal, or password, never travels on the network, in
    encrypted form.


    +   - Kerberos Ticket Granting Tickets (TGTs) are held by the workstation in a
    file called the *credentials cache*. These tickets have configurable validity
    periods. As long as a TGT is valid, the user will not have to enter a password
    to connect to Kerberos services. This feature is called single-sign-on.


    +   - By allowing for the secure exchange of a secret key between the KDC, a service,
    and Kerberos makes encrypted versions of common applications like login, rsh,
    and Telnet possible.


    The lack of Kerberos clients for the PC and Macintosh platforms, particularly
    e-mail software, hinders its effective deployment at most sites.


    +   - A PAM-authenticated login, or /usr/krb5/bin/kinit, creates a Kerberos cache.
    From on, for the validity of the cache, the Kerberized login, rcp, and Telnet
    commands will not require a password. The use of the -x option can force these
    commands to create an encrypted channel.


    +   - At logout, /usr/krb5/bin/kdestroy should be used to remove existing credentials
    caches. This prevents an attacker from potentially using a still valid ticket
    to masquerade as another user.


    # Authenticating Users with the Pluggable Authentication Modules


    +   - PAM provides a flexible, interchangeable authentication mechanism. PAM can
    control all aspects of user accounts, from authentication to session and password
    management. PAM modules are stackable in modules that can be executed in any order,
    with some required at all times and some sufficient, to achieve different security
    strategies.


    +   - Various PAM configurations can allow access to certain administrative functions
    by group membership.


    +   - Some services require different authentication methods, like SecID or Radius,
    without affecting other services, by simply changing the pam.conf.'
  merge: -1
  img_proc: true
