  md: '# Detecting and Denying Hacks • Chapter 11 351


    # Headline News


    First, I want to see all recent events that need my attention. One way to that
    is to see the last 10 lines of the /var/adm/messages file. To do this, I''ll use
    the tail command on the dmesg command:


    ```

    dmesg | tail

    ```


    The first part of the script will look like this:


    ```

    SYS_LOG=$dmesg | tail

    awk -F: ''{print $1 $2}''

    UP_TIME=$(uptime - \n") > /export/home/scripts/report

    echo "Good morning Here''s the news from $(uname -n)" >>

    /export/home/scripts/report

    echo "for $(date)" >> /export/home/scripts/report

    echo "\n" >> /export/home/scripts/report

    echo "The last entries in the syslog are:\n$SYS_LOG" >>

    /export/home/scripts/report

    ```


    This script begins by assigning the dmesg | tail command string to the variable
    name SYS_LOG. Then the report is created. For the purposes of this, we created
    the script in /export/home/scripts and named it. It starts by telling us where
    the report was generated and when; then it displays the most recent entries in
    /var/adm/messages.


    # The Sports Page


    The next section gives us the equivalent of the sports scores. We want to see
    the current CPU load on the system and how long the system has been in continuous
    use. If the CPU loads are unusually high or if the system was booted recently
    without our knowledge, we will want to investigate right away.


    Here''s what the script looks like:


    ```

    CPU_ACT=$(uptime | awk -F: ''{print $4}'')

    RE_BOOT=$(who -b)

    ```


    ```

    echo "\n\\\n" >> /export/home/scripts/report

    echo "The current CPU load over the last 1, 5 and 15 mins is:$CPU_ACT" >> /export/home/scripts/report

    ```


