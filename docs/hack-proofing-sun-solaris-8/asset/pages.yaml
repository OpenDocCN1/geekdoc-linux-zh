  md: '# Configuring the cachemgr.cgi Utility


    The cachemgr.cgi utility is compiled during the Squid installation process. By
    placing this utility in the cgi-bin directory of your Web server and configuring
    Squid appropriately, you can control the Squid process through a Web browser,
    getting useful performance data, and checking the health of your cache. It is
    just as important to secure access to this utility as it is to secure SNMP access.
    In addition to the security provided by Squid itself, access should be limited
    to only users and trusted hosts. To configure manager access, you will first need
    to define an access list that controls cache objects. Cache objects are, for all
    practical purposes, the internal anatomy of Squid itself. To create a cache object
    access list, add the following line to your squid.conf:


    ```

    acl manager proto cache_objects

    ```


    By default, cache management through cachemgr.cgi is disabled. To enable management
    access to Squid, add the following line:


    ```

    cachemgr_passwd m6RpW all

    ```


    Figure 9.5 shows a list of Squid objects that may be individually defined.


    # Figure 9.5 Squid Objects


