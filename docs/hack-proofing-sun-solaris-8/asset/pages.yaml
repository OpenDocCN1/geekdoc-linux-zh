- pgno: 219
  md: '# Securing Your Network · Chapter 6


    +   Unless resources are on your Solaris servers, XDM for OpenWindows, which takes
    care of generating magic cookies for you.


    +   Where possible, use SSH for forwarding X-connections for increased security
    and authentication.


    # Using Remote Commands


    +   Restrict the use of the Berkeley r-commands as much as possible.


    +   Understand that /etc/hosts.equiv and .hosts will allow password-less logins
    to your servers, which is often quite undesirable.


    +   Disable the Berkeley r-commands entirely and use SSH as a drop in replacement.
    SSH has a very low learning curve because it uses identical syntax to the Berkeley
    r-commands in almost all cases.


    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, click on the “Ask the Author”
    form. www.synergy.com/solutions


    Q: I would like to control which client machines use the resources of my DHCP
    server. Does Solaris support this?


    A: By default, you can do it. For security reasons, you might decide that you
    would like to specify that DHCP clients only obtain an IP address if their MAC
    address is known. In high security areas, it may be desirable to restrict access
    to DHCP functionality to clients known in advance this prevents unauthorized machines
    from joining your network. However, even if you configure a DHCP server in this
    fashion, nothing is stopping the attacker from entering a valid static IP address
    for your network. In case, the DHCP server with Solaris does not support this
    functionality, and you will need to install the DHCP services package from ISC
    (the makers of BIND), which has a number of other options not supported in the
    Solaris DHCP server. Note that ISC’s DHCP server does not have any sort of GUI
    configuration tools, if those are important to you.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_219_0.png)


    www.synergy.com'
