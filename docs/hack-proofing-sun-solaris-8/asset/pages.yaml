- pgno: 26
  md: '# Introduction


    Default installations of almost any operating system are prime targets for hackers,
    and Solaris is no exception. These installations are usually devoid of vendor
    patches, by running system daemons with more privilege than necessary, and are
    likely to use insecure protocols. This chapter is designed to get you to begin
    thinking about Solaris by examining the shortcomings of the default Solaris installation,
    as well as the tools available for monitoring the system.


    Most intrusions will result in your Solaris systems displaying characteristic
    activity, therefore it is important to learn to use Solaris''s built-in monitoring
    tools effectively, both in command-line and GUI modes. Effective use of monitoring
    tools transcends detection of hacker activity, by providing valuable information
    that will help you detect system bottlenecks and aid in capacity planning as well.
    For these reasons, this chapter will teach you techniques you can use to monitor
    Solaris effectively.


    System documentation is another all-too-often-overlooked method of increasing
    a Solaris system''s security. Documentation results in a paper trail that will
    help you whether any of your systems are lagging in their security maintenance.
    This chapter will introduce you to the documentation that should be developed
    and how to develop this documentation.


    A default Solaris installation exhibits a number of security deficiencies in many
    areas. This chapter will help you identify and eliminate these areas of weaknesses
    by learning to think the way an attacker would.


    # Exposing Default Solaris Security Levels


    Solaris''s installation routine has a number of configurable options that allow
    you to perform all of configuration tasks, from setting up the network to selecting
    additional software to be installed. The set-up program, however, focuses primarily
    on the installation of the Solaris operating environment, not on security. As
    a result, you are left to secure the system on your own.


    In this section, we will identify and discuss the default security configuration
    on a newly installed Solaris system. Areas where weaknesses might exist, such
    as clear text protocol authentication,


    # Altering Default Permissions


    Under the UFS file system, every file has a set of associated permissions that
    control access to the object. These permissions are collectively known as the
    mode of'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Introducing Solaris Security: Evaluating Your Risk · Chapter 1


    access, or simply mode. A mode consists of three octal numbers that specify user,
    group, and other access permissions for the file or directory. Of these numbers
    may range from 0 to 7. Read access is specified by 4, write access by 2, and execute
    access by 1. These permissions can be combined such that a mode of 5 specifies
    read and execute access.


    Default permissions of the UFS file system are controlled by the umask setting,
    which specifies the permissions inherited by new objects. These permissions are
    the octal complements of the numerical values used in the chmod command. For example,
    umask mode of 027 gives permissions equivalent to chmod mode of 750, or no permissions
    to the owner, and execute permissions to the group and no access to everyone else.
    Each user''s umask setting is controlled by the value set in /etc/profile, which
    is 022 by default. Be aware that /etc/profile settings may be overridden by settings
    in the skeleton files located in /etc/skel. Table 1.1 summarizes the common mode
    and umask permissions.


    # Table 1.1 Common Mode and Umask Permissions


    | Permission | Mode Setting | Umask Setting |

    |---|---|--|

    | No Access | 0 | 7 |

    | Execute Access | 1 | 6 |

    | Write Access | 2 | 5 |

    | Read Access | 4 | 3 |

    | Full Control | 7 | 0 |


    For most organizations, the default umask of 022 may not be acceptable, as its
    restrictions allow anyone on the system to read files generated by other users.
    This is not desirable in certain application system accounts, such as an Oracle
    account, whose home directories may contain sensitive data.


    For similar reasons, the superuser account should always have a umask of 077,
    the most restrictive possible with respect to other users. Such restrictions serve
    to prevent overly curious users and those who have malicious intent from reading
    files or executing programs that should be restricted to root use only. Therefore,
    best practices indicate the default umask for all users in /etc/profile as well
    as the default skeleton files in the /etc/skel directory to a more restrictive
    value, such as 027 or 077.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_27_0.png)'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Making daemons Available after Installation


    Many system daemons are installed by default on a Solaris installation, but some
    will require minor adjustments to run in a more secured mode. There are other
    daemons, such as Apache, that are not installed by default but may be desired
    to run. This section will describe how to tweak some of the system services, as
    well as how to configure Apache for simple tasks.


    # Using Solaris as an FTP Server


    Occasions arise when files need to be transferred from one system to another,
    and File Transfer Protocol (FTP) has become the customary way to copy files between
    systems. Although Solaris includes by default a complete FTP services, its use
    is not recommended because FTP is a cleartext protocol that can be easily bypassed
    by hackers using sniffing tools. Secure copy (SCP), described in Chapter 6, is
    a more preferable form of file transfer because the data is encrypted as well
    as the passwords and commands. There are however, instances in which FTP services
    are a necessary function, this section will discuss how to use Solaris''s FTP
    functionality as securely as possible.


    Access to the FTP server can be restricted using the /etc/ftpusers file. Any user
    account listed in this file will not be authorized to Solaris''s FTP services.
    Solaris 8 lists the superuser account and many of the system accounts in this
    file by default. The most secure way to control FTP access is to list all system
    and user accounts in /etc/ftpusers and then remove only the accounts that require
    access to FTP services. If there is no need for FTP access, it should be disabled
    by completely omitting the FTP service in /etc/inetd.conf.


    # SECURITY ALERT!


    > Prior to release 8, Solaris allowed FTP access by the root user as the default.
    It is critical that this access is immediately disabled on older systems by placing
    the root account in /etc/ftpusers as soon as possible. Allowing the root account
    FTP access not only allows the root password to be sniffed during a transfer session,
    but also leaves the system open to compromise by brute force attempts to guess
    the root password.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Using Telnet to Access a Solaris System


    Perhaps even more common than FTP access Telnet access allows users to connect
    to the system remotely and execute commands as they were on the system console.
    Unfortunately the Telnet protocol, like the FTP protocol, is a cleartext protocol
    that allows passwords to be easily sniffed from the network. In addition to passwords,
    a user''s entire session can be sniffed "over the user''s shoulder". Because of
    this, you should seriously consider replacing Telnet access with an encrypted
    protocol such as SSH, as described in Chapter 6. Barring, this section will discuss
    how the Telnet server is operated.


    The Telnet daemon is typically operated by inetd, the Internet server-server,
    which launches Telnet daemon sessions as necessary. A Solaris installation will
    activate the Telnet server by default, but it can be disabled by commenting out
    the entry in /etc/inetd.


    ```

    telnet stream tcp6 nowait root /usr/bin/in.telnet in.telnet

    ```


    From this entry we can determine that Telnet supports IPv6 and is accessible from
    a Transmission Control Protocol (TCP) stream. Specifying nowait allows multiple
    Telnet sessions to run concurrently. Telnet service runs as root using the system
    binary /usr/sbin/in.telnet as a Telnet daemon process.


    You may notice that root logins are not allowed via the Telnet server. This default
    security setting prevents brute force attacks on the root account by denying all
    root logins, regardless of whether the password supplied is valid or not. Enabling
    root logins via Telnet is not recommended because it opens the system to brute
    force attacks on the root password and allows the password to be sniffed from
    the wire. If absolutely necessary, rootnet logins can be enabled by commenting
    out the CONSOLE section of /etc/default/login.


    Authentication for the Telnet service is provided by pluggable authentication
    modules (PAM) and configured in /etc/pam.conf. PAM ensures that accounts are validated
    with valid passwords before allowing access to the Solaris system. In a default
    installation, no Telnet-specific entries are listed in /etc/pam.conf, so the Telnet
    service uses the authentication methods specified as "other" services. These entries
    are generally adequate, but in certain cases (such as when using Kerberos for
    authentication), it may be desirable to explicitly configure a Telnet policy through
    PAM. This can be accomplished by adding new entries to /etc/pam.conf that begin
    with "telnet" and point to the PAM libraries appropriate for your desired use.'
  merge: -1
  img_proc: true
