    the University of Michigan, and are tailored for their environments.


    The lack of Kerberized clients makes widespread use of pure Kerberos difficult.
    SEAM addresses a great many of these problems in a homogeneous Solaris environment.
    Kerberos illustrates the importance of risk assessment and risk management. Understand
    your weaknesses and your needs. Carefully evaluate whether a security system will
    reduce your vulnerabilities or merely relocate them. This isn''t meant to discourage
    the use of Kerberos, but to encourage a cold, hard evaluation of your risks and
    the technologies used to minimize them. There is no doubt that some sites will
    find Kerberos to be the answer to their authentication needs.


    SEAM also employs the kpasswd command to facilitate password changes. Once a user
    has obtained tickets, password will prompt for a new password for the current
    principal, verify it, and change the password. Its operation and interface should
    be familiar to anyone who has used the password command. Kerberos provides for
    limited password strength checking and configurable word policies on the KDC to
    require minimum length passwords, passwords that consist of an adequate mix of
    character types (Kerberos specifies four types: upper case, lower case, number,
    other).


    Most authentication operations by SEAM are configurable through the pam_krb module.
    The next section documents the use of PAM and how to change the authentication
    procedures and methods used by different services.


    # Authenticating Users with the Pluggable Authentication Modules


    With the introduction of Solaris 2.6, Sun embraced one of the most powerful authentication
    concepts to come in recent years. Pluggable Authentication Modules (PAM), originally
    a Linux concept, abstract the authentication process


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_139_0.png)'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Chapter 4 - Securing Users


    away from programs like su, login, ftppd, and ssh. Instead, authentication is
    performed by a separate, modular process. At their most basic, PAM modules are
    responsible for answering the simple question, "Is this user allowed here?"


    The PAM framework makes it possible to identify and restrict access to users by
    many unconventional methods. PAM extends to support one-time password systems
    like S/key and SecUserID as alternate authentication systems like Kerberos, LDAP,
    or Radius. PAM also ensures access by time of day, quota, incoming host, group
    membership, or just about anything else. The PAM system creates a level of security
    flexibility that did not exist prior to its invention. By modularizing the authentication
    system, software authors can simply interface with PAM and allow system administrators
    to select the authentication best method suited for their environment.


    There are PAM-aware services of every type. Most FTP, POP, and IMAP servers support
    PAM. The native login, Telnet, FTP, and even the login for Solaris are PAM-aware.
    OpenSSH and recent commercial SSH servers support PAM. This makes it easy to deploy
    a new authentication or authorization system across a wide range of machines.


    We''ll start by looking at the default PAM configuration file, /etc/pam.conf.
    We''ll talk about the options in that file and how to tailor them for specific
    purposes, and use three examples to illustrate the functions of PAM. In the first
    example, we''ll use Casper Dik''s su_group PAM to prevent su attempts from users
    who are not members of group root. In the second example, we''ll disable .hosts
    and hosts.equiv files, preventing your users from inadvertently promising your
    network. In the final example, we''ll see how to install and configure the PAM
    system to support a new IMAP server.


    The PAM configuration file, seen in Figure 4.1, is divided into a series of columns.


    The login service, in the form of the /bin/login program, is PAM-aware under Solaris.
    When the login program begins, it contacts the PAM system, which loads the shared
    object pam_unix.so.1. This object is responsible for most authentication, authorization,
    and account management under Solaris. It handles authentication through a conventional
    interface to the flat-file password maps, NIS, or NIS+. It can also handle password
    management, enabling the password-changing process to proceed by verifying an
    old password, soliciting a new one, and updating the system accordingly.


    Let''s look more closely at the following line from Figure 4.1:


    ```

    login    auth required /usr/lib/security/pam_unix.so.1

    ```'
