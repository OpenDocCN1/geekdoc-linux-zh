    # Access Control Lists


    Perhaps the most important elements are Squid''s access control lists. Squid can
    allow or deny access to the proxy by source and destination IP address, require
    authentication, or limit access by MIME type, or URL. You must provide at least
    one access control list, otherwise your proxy will be discovered and used as a
    means to the origin of malicious traffic.


    The access control (acl) tag allows you to define many types of access control
    lists. For IP-based access control, the list can include a single client IP address,
    a range of IP addresses or domains. Once you have defined these values, you can
    allow or deny requests to the cache server. For example, if you define a range
    of addresses using the acl tag, you can allow any system using an address from
    this range of IP addresses to use the proxy cache. The acl tag of the squid.conf
    is shown in Figure 9.


