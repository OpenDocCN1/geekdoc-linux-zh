- pgno: 364
  md: '# What to Do Once You’ve Detected a Hack


    Now that you''ve detected a hack, what do you do? Most experts will tell you to
    disconnect all network cables, making sure there is no physical way for anyone
    to access the system. Then back up all your data, wipe the disks clean, and reinstall
    the whole maria.


    However, what’s to stop the hackers from coming back? Hackers are like ants at
    a picnic: Once they''re in, they''re tough to get rid of! Keep in mind that hackers
    spend most of their time looking for systems to hack. Once they''ve found a likely
    target, they''re not likely to give up and pick on someone else. So, we need to
    do as much as we can identify the weakness the hackers exploited by examining
    their attack in detail. In addition, we would like to identify the hackers. One
    way to dissect and possibly identify attackers is through the use of a honeypot.


    # What’s a Honeypot?


    A honeypot is simply a system designed to lure and catch hackers at their work.
    There are many variations on the design and even some excellent commercial products
    available. In this section, we discuss how to use a Solaris system as a honeypot.


    A honeypot supposedly gets its name from a practice of our frontier-living forefathers.
    Since bears would often wander into a campsite, looking for food, it was often
    the practice to leave a pot of honey elsewhere to lure the bear away from the
    campsite.Variations included building a trap under the honeypot or attaching some
    type of alarm, as a bell, to warn everyone that a bear was in the area. The name
    could also have come from an incident in the Winnie the Pooh story, but the first
    explanation seems to better for our purposes. Beside, how Winnie the Pooh used
    a keyboard with his clumsy paws?


    Basically, our honeypot does three: it lures the hackers away from our protected
    systems, it warns us of the hackers’ presence, and it attempts to restrict and
    record their activities.


    # How to Build a Honeypot on a Sun System


    First, we want to get the hackers’ attention.We do that by making two decisions:
    Where will the honeypot be located, and what will we call it? Since we’re building
    a system that we hope will attract hackers, many people prefer to keep a'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'honeypot as far away from their production systems as possible. They’ll separate
    the honeypot by placing it in a DMZ, which will protect their real LAN from any
    hacking attempts against their honeypot. A DMZ gets its name from the military
    term demilitarized zone, which defines an area in which no military action will
    take place. A typical DMZ could be something like the diagram shown in Figure
    11.3.


    # Figure 11.3 A Double-Firewall DMZ


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_365_0.png)


    In the IT world, a DMZ, sometimes known as a screened subnet, refers to an isolated
    network segment that protects a trusted network from untrusted sources through
    packet filtering. As you can see from the diagram, it’s an extra layer of protection
    between you and the “bears.” By placing our honeypot in our DMZ, we are trying
    to fool our curious bear thinking she’s penetrated our firewall and is now into
    our network.


    Another way to position a honeypot is to put it right in your network, next to
    your production systems. The idea is to give it an IP address that will give the
    impression that it’s one of the production systems. For example, let’s say our
    mail server at our fictitious company, Incoming Traveler, uses the address 172.x.x.10.
    If we give our honeypot the address of 172.x.x.9, it will show up in'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# Chapter 11 · Detecting and Denying Hacks


    any network scan. In addition, since it''s a lower number, our hacker might assume
    it to have been built before our real mail server and that it will therefore contain
    more primary data.


    We''re on the subject of IP addressing, keep in mind that you can set up virtual
    hosts on your honeypot. By assigning multiple hostnames and IP addresses to the
    same interface, you can simulate several kinds of systems on one Solaris server.
    Naturally, if the virtual hosts are using the same network interface, they''ll
    all have the same MAC address. This could be a tip-off to a crafty hacker. Consider
    using multiple interfaces as a way around this potential give-away.


    Next is deciding what to call the honeypot. Remember, we''re hoping it will get
    hacked, so we want it to have a name that would attract someone is looking for
    the sweetest honey. Don''t be too obvious, a name like top-secret-valuable-data-with-no-security-1
    might sound like a trap to the most green script-kiddie. Instead, following the
    naming convention of the rest of your systems, give the honeypot a name that would
    make it sound like a powerful system containing valuable data. For example, a
    name as though it were a backup server for your network. A name like traveler-backup1
    would give the impression that it can reach other systems on the network and contains
    backed-up data from those systems. A name like traveler-db5-old would give the
    impression that it is a little-used system, maybe to be retired or not monitored
    carefully.

    Another favorite practice is to name the honeypot as a development or test system.
    Naming a something like traveler-devtest1 is sure to attract even the most cautious
    hacker. Hackers know sysadmins often monitor a development or test system carefully
    as they would produce a production system, so these systems make very attractive
    targets for intruders.


    Keep in mind that it''s not entirely what your honeypot is named but what it does
    that will attract hacker. The naming, but how the honeypot responds to scans and
    probes is the key to setting your trap.


    Next we build the honeypot. This involves doing a fresh install of Solaris.\Don''t
    worry too much about patching it; after all, we don''t want to keep hackers out
    of this system. We want them to get in so we can monitor their activities.


    Once we have the Solaris operating environment installed, we need to start configuring
    it for our purposes. We start with the assumption that all traffic comes to our
    honeypot system is untrustworthy. Except for authorized sysadmins and security
    personnel, the only traffic to this system will be by hackers attempting to penetrate
    your honeypot. We need to make sure that firewall is configured to allow everything
    from the outside into our honeypot and limit the traffic that is allowed. Our
    goal is to allow hackers into our trap but not allow them to


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_366_0.png)'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# Detecting and Denying Hacks • Chapter 11


    get access to anything else through our honeypot. Furthermore, if your firewall
    has the ability to send alerts, make sure that you configure it to do so when
    someone is scanning or probing your network. Your firewall is your first line
    of defense in this setup. Make sure you review your firewall''s logs carefully
    and regularly.


    Now we configure the honeypot to allow us to track what the hacker is doing, trying
    to do, or has already done. In order to do this, we''ll need several different
    sources of information. This is to make it more difficult for the hacker to detect
    the real purpose of the system and to give us multiple resources of information
    in case one is tampered with by our hacker.


    One of the first things a hacker tries to do is mess with our system logs. For
    this, we can''t trust the data that the honeypot''s system logs contain. One solution
    is to use syslog to send messages to another server. Some remote auditing features
    as well as the ability to encrypt your logging traffic. Compile and reconnect
    syslog to use another configuration file, such as /usr/share/man/man1/manconf.
    Make sure you leave the /etc/syslog.conf in place. This will hopefully fool the
    hacker into thinking all the logging is being done locally.


    The next thing we want to have on our honeypot system is Tripwire. In the previous
    section, we discussed its configuration. Whether you''re using the commercial
    version or the open-source version for Solaris honeypot, make sure that you use
    this invaluable tool.


    Finally, make sure you''re using a sniffer on your firewall. Several excellent
    sniffer applications are discussed in this book. Use the sniffer of your choice
    to monitor all packets going to the honeypot and especially from the honeypot.
    Your sniffer can capture all the data the hacker is sending and receiving. This
    is important data to use later in studying the attack.


    This discussion should give you an idea of way to set up a honeypot on a Solaris
    server. There are many ways to do it, however; experiment with different configurations.
    Above all, remember the purpose of your honeypot! You want to keep the hackers
    interested enough to stick around but not allow them access to any protected systems.
    If you''re lucky; a honeypot will be a great learning tool for you well as a formidable
    barrier to hackers.


    # Commercial Honeypots for Solaris


    Some excellent honeypot applications are available commercially. Here we touch
    on a few, but this is by no means a complete list and the software listed isn''t
    in any particular order. A commercial honeypot offers some advantages over a do-it-


