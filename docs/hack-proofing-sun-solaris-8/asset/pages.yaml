- pgno: 335
  md: 'install the kit and run it properly. Defending against rootkits dealing with
    any vulnerability that may yield the proper privileges to install a rootkit. Patch
    levels should be maintained and all unnecessary services should be turned off.
    Occasionally running the shell script chrootkit (www.chrootkit.org) will also
    help, but it should not be relied upon


    # Defusing Logic Bombs


    A logic bomb is defined as malicious logic which causes damage to a system when
    triggered by some specific condition. Just like a real explosive device, a logic
    bomb lies dormant until some event is realized. The trigger might be something
    like a login by a particular user or even a log of login within a specific time,
    or it might be the number of times a program has been executed or a random number.
    It could be a more specific event, such as the deletion of a user account or a
    change in the status of the network interface from up to down. Logic bombs can
    vary in range and complexity. The range of damage can be anything from the deletion
    of a single file to the deletion of an entire partition or disk.


    The simplest logic bomb could be an entry in a crontab checking for an event.
    Other logic bombs exist, including trojan binaries. The best way to control logic
    bombs is to use file-integrity-checking software to monitor any changes to a system''s
    crontab files for root and other users. The drawback to this approach is that
    any legitimate modification to a crontab will require a recalculation of the integrity
    checker''s database entry for that file.


    Overall, logic bombs are the most difficult kind of attacks to detect. Defending
    against a logic bomb requires the use of a file integrity system such as Tripwire,
    Fcheck, or Aide. On a newly installed system, the file-integritychecking software
    should be made available to general users. In this way, a baseline snapshot of
    the system can be taken and stored offline. Any changes to a crontab file or other
    file in the system will require a rebuild of the database, but this will provide
    some security in terms of monitoring unauthorized file changes.


    # Securing cron Jobs


    Securing cron jobs is a very important part of securing a Solaris system. The
    cron daemon runs as root, but performs a setutid before executing any commands
    in a nonroot user''s crontab, so that any commands are run as that user and not
    as root.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_335_0.png)'
