- pgno: 370
  md: '# Chapter 11 • Detecting and Denying Hacks


    hackers. This can be a colossal waste of time and money. Even if your information
    is accurate, you need a great deal of cooperation from law enforcement as well
    as any other companies involved, such as ISPs whose services may have been used.
    Unless you can prove extensive damage and severe loss of income due to the hack
    attack, don''t expect to get 911 treatment.


    Above all, resist the temptation to do a Lone Ranger. Taking upon yourself to
    get revenge by using methods against your hacker might sound so delicious to resist,
    but resist you must! Hackers of all skill levels, from script-kiddies to hardcore
    crackers, often find ways to make it look though someone else is to blame. So,
    in addition to going against your corporate policy, could be causing the same
    trouble for your counterpart at an innocent company! Don''t risk your reputation,
    job, and future to satisfy a need for revenge. Dissect the hack, learn from it,
    and plug the hole. Spend an extra hour in the gym or an extra piece of pie—whatever
    it takes to make you feel better about yourself.


    You hacked. Welcome to the club.


    One of ManTrap''s strengths is its reporting features. It logs keystrokes as well
    as processing invocation and file access. The logging can be local, but you''d
    be wise to use the remote logging capability to store the files on another system.
    It also signs and the logs using Java-powered cryptography. This lets you know
    that the hackers have not been tampered with your logs.


    Recourse offers a product called ManHunt. Not only can it detect and alert you
    to suspicious activity on your network, it tracks the attack to the source. ManHunt
    is very effective at tracking the originator of an attack or intrusion attempt,
    even if the source is hidden by reflection, spoofing, or distribution. It also
    runs on the SPARC platform and, when used with ManTrap, makes a powerful security
    package.


    More information on ManTrap and ManHunt can be found at Recourse Technologies''
    site at www.recourse.com.


    # Monitoring Solaris Log Files


    Part of the price of having a secure Solaris system is the frequent reviewing
    of your log files. In this section, we look at what files should be reviewed.
    We also look at ways to automate this sometimes tedious process. However, don''t
    depend on monitoring applications or customized scripts alone to handle this task.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_370_0.png)'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# Detecting and Denying Hakes • Chapter 11


    Despite the advantages of the automated processes, you should make it part of
    your security plan to review these logs manually on a regular basis.


    # Solaris Log Files to Review


    Let''s take a look at some of the files you should be reviewing. The files we
    concentrate on here can be found in /var/adm. Obviously, if you have customized
    scripts de-dumping data into your log files or applications that create their
    own, you''ll want to keep an eye on them as well. This discussion covers the importance
    of some of the system logs on your Solaris 8 system.


    # Didn''t You Used to Be Called utmp?


    The files named /var/adm/utmp and /var/adm/wtmp have been replaced by /var/adm/utmpx
    and /var/adm/wmtpx. The new files, utmpx and wmtpx, both perform the same function
    as their predecessors. The file utmp contains a database of user access and administration
    information; wmtpx contains a history of user access and administration information.
    If you see files named utmp or wtmp in the /var/adm directory, find out immediately
    what is using or what application created them. This is often a sign that an unauthorized
    application is running on your system and attempting to collect data on your user
    accounts.


    By default, /var/adm/utmp is owned by root with read and write permissions. The
    group bin and the world are given read-only permissions. The file /var/adm/utmpx
    is owned by the system account adm and the group adm, with the same permissions.


    # The /var/adm/messages File


    The file /etc/syslog.conf tells the syslog daemon where to store system messages:


    ```

    chevron7:root # more /etc/syslog.conf

    #ident "@@@@" syslog.conf       1.5       98/12/14 SMI*      /* SunOS 5.0 */

    #

