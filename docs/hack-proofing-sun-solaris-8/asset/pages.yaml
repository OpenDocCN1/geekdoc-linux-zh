    What about other Solaris-specific traffic? Well, if you run one of Sun’s management
    or support programs (Answerbook, Sun Management Console), you will see traffic
    on any number of ports, such as 8888, 695 and 898. If you absolutely must run
    these services, ensure your systems are firewalled, patched and that the software
    is configured as securely as possible. As Sun releases new products and utilities,
    the number of ports in use will increase. It will be your duty to make sure that
    the new software and services are installed with maximum security in mind.


    # Using a Dedicated Sniffer


    Most system administrators know have at least one UNIX system on their desk (usually
    more), and have access to others, but a few at the smallest sites, or hundreds
    in a large enterprise. When machines are plentiful, powerful enough and not tasked
    with anything else pressing, the smart administrator configures and deploys a
    dedicated network sniffer. Continuing with the Snort program I discussed earlier,
    let’s pretend that our administrator at incoming-traveller.com, has an extra system
    power to act as a dedicated sniffer. As a rule, such a system must have ample
    CPU power, plenty of RAM and drive space, and a 100 Mbit, full-duplex-capable
    network interface.


    The first steps will be to install the OS and perform basic hardening (luckily,
    you bought this book to help out!), assign an IP address get the system on the
    network. Since we want to sniff traffic, we have to give some special consideration
    to where we place the system on the network. If you want to sniff inbound traffic
    and detect all attacks, including those your firewall is configured to block,
    you would need to place the system after your border router and before your firewall.
    If you want to sniff traffic the firewall permits onto your network, then place
    a hub or a switch will allow you to mirror all port traffic to one dedicated port.
    If you cannot configure a switch port for this type of activity analysis, then
    the only traffic your sniffer will see is destined for and broadcast traffic on
    the switch (and even then, usually only on the local VLAN).


