- pgno: 336
  md: 'Changes in the crontabs are controlled by the crontab program. This program
    can load a user''s crontab to an editor, and when the user is finished and exits
    the editor, signals the cron daemon to reread that particular crontab file for
    any changes. Access to the cron facility is controlled through the presence (or
    lack of presence) of two files: /etc/cron.d/cron.allow and /etc/cron.d/cron.deny.
    To give a nonroot user the ability to use the crontab command, the username must
    enter:


    +   - exist in /etc/cron.d/cron.allow

    - if the /etc/cron.d/cron.allow file does not exist, the username must be in the
    /etc/cron.d/cron.deny


    A user can be denied the ability to use the crontab command if:


    +   - the /etc/cron.d/cron.allow must exist and the user is not in this file,
    or

    - the /etc/cron.d/cron.allow does not exist and the user name is in the /etc/cron.d/cron.deny
    file, or

    - neither file exists


    Control of some aspects of the cron daemon is available through the use of the
    file /etc/default/cron. This file can have three possible entries:


    +   - CRONLOG Controls whether the cron daemon keeps a log of all actions taken.

    - PATH Controls what path the cron daemon uses to search for executables when
    running in the context of a nonprivileged user.

    - SUPATH Controls what path the cron daemon uses to search for executables running
    in the context of the root user.


    By setting the values of PATH and SUPATH properly, it is possible to prevent cron
    from executing programs which may be Trojan binary replacements of system commands
    when the cron daemon runs. Good values for PATH and SUPATH are:


    ```

    PATH=/usr/bin:/usr/sbin:/sbin

    SUPATH=/sbin:/usr/sbin:/usr/bin

    ```


    If custom scripts are going to be used by the cron daemon, it is best to create
    a secure directory where the scripts reside. One possibility is to have a directory'
