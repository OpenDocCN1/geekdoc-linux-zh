    There are some parameters that you should use as much as possible. The *hosts
    allow* and *hosts deny* are two good examples. These specify systems that can
    or cannot access your services. Another handy feature is the ability to specify
    valid interfaces, using the *interfaces* directive, and then only SMB and NMB
    to use defined interfaces with the *bind interfaces*. This is a great way to restrict
