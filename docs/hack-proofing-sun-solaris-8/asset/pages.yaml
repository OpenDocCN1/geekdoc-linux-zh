  md: '# Introduction


    How much security is too much? How much is not enough? These questions are very
    difficult to answer with conviction when you are designing a secure system, but
    it is essential that they are answered correctly. Layers upon layers of packages,
    add-ons, and utilities are available to augment security in the Solaris 8 Operating
    Environment (OE). Sometimes, security is not a great concern.


    For example, if an administrator has a Solaris 8 system that contains nonsensical
    data behind a secure firewall, or she might need more security than what is provided
    by default to ensure that the data''s integrity is not compromised by users''
    everyday work. The Solaris 8 OE provides sufficient security to accomplish this
    goal by maintaining personal file access and ownership with Discretionary Access
    Controls. However, should you need to protect sensitive material as trade secrets,
    legal information, confidential personnel files, or accounting information, even
    behind an adequate firewall, the system must be secured not only attacks from
    the Internet but from those allowed into the organization''s internal network
    as well.


    As Internet hackers with their capricious network pranks, the threat of internal
    corporate espionage is perhaps more pervasive and detrimental. Often, to the Internet
    hacker, the hack is the thing, meaning that the hacker''s goal is to accomplish
    the hack. Once accomplished, the data residing on the system or the back door
    established by the virus is an afterthought than a useful goal to the hacker.
    This is seen in the structure of many viruses and worms today. Sometimes, the
    threat of most virulent viruses seems to be a media event more than a reality.
    For the most part, viruses and worms are designed merely to proliferate and replicate
    themselves throughout a network. Their major detriment tends to be the impact
    on resources rather than the destruction or theft of data. Many companies have
    either succeeded or failed based on their ability to protect their research and
    trade secrets. Indeed, many other companies have succeeded by their ability to
    successfully steal the ideas and research of others.


    When you, as an agent for whatever organization you work for, you are put in charge
    of the welfare and security of the company''s crucial data, it can feel somewhat
    overwhelming. You might start to feel paranoid, as though you will find security
    breaches everywhere. Embrace this feeling. It is a good thing.


    This chapter attempts to give you a brief overview of security from the perspective
    of its current implementation in the Solaris 8 OE. It will explain how that implementation
    fits into the overall history of system security as it has developed. In addition
    to that overview, it provides a brief description of some of the


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_58_0.png)'
