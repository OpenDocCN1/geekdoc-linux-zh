    The events that will actually generate an audit event are configured in the /etc/security/audit_control
    file. This file contains entries like the following:


    ```

    dir:/var/audit

    flags:lo

    minfree:20

    aflags:lo

    ```


    The first line directs the auditd subsystem to store the audit information in
    the /var/audit directory. The second line directs audit events of the LO (login)
    class be recorded. The third line, minfree:20, directs the audit subsystem to
    execute the **audit_warn** script generates a warning to the administrator informing
    him or her of the space problem. The last line, naflags, defines the nonattributable
    events that are to be audited. These define events that cannot be linked with
    a particular user.


    There are many predefined classes of audit event. These include the ability to
    audit file reads (FR), file writes (FW), network events (NT), and administrative
    events (AD). A complete listing of all available audit events can be found in
    the audit_control(4) man page.


    Another file used by BSM is the /etc/security/audit_user file. This file contains
    per-user directives and allows a finer grain of auditing. Perhaps you have some
    temporary accounts that you offer to consultants, or there is a user who is suspected
    of malicious operation within the enterprise. You can specify that'
