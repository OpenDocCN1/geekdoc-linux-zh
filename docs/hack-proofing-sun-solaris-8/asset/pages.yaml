- pgno: 33
  md: '# Introducing Solaris Security: Evaluating Your Risk • Chapter 1


    # Evaluating Current Solaris Security Configurations


    When hardening a default Solaris installation, it is crucial to examine services
    running both on the network and on the local host itself. Your goal during the
    host-hardening process should always be to disable as many noncritical services
    as possible, because each service or daemon increases the risk of the system being
    compromised. This section will identify the plethora of services running on a
    default Solaris installation, and show you how to disable those which may be unnecessary
    for your installation.


    # Evaluating Network Services


    We''ll begin examining our default Solaris system from the network, using the
    commonly available port scanner known as Nmap, written by Fyodor. Nmap is available
    at no charge from www.insecure.org/nmap, and it is probably the most full-featured
    and widely used port scanner. Detailed instructions on the intricacies of Nmap
    are beyond the scope of this section, but interested readers will find complete
    documentation distributed along with the tool itself. Ports have been written
    for most widely used UNIX variants, including Solaris. Figure 1.3 shows an Nmap
    scan of a default Solaris host from a Linux-based host. (Scanning from a Solaris
    host would yield an identical output.)


    Figure 1.3 Nmap Scan of a Default Solaris Host from a Linux-Based Host


