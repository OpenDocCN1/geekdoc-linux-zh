    # The /var/adm/lastlog File


    This file contains information used by the last command. With the /var/adm/wtmpx
    file, it provides the information on who has recently logged in to the system.
    This file should be owned by root and have read permissions across the board.
    The last command is an important one to your security monitoring. We''ll go into
    more detail on using it in the section on creating daily reports.


    # The /etc Files


    Naturally, in addition to your log files you should keep an eye on the system
    configuration files in the /etc directory. The file /etc/default/login contains
    important login information, as whether or not the root user can log in remotely.
    Watch /etc/passwd for any new, unrecognized user accounts and /etc/hosts for any
    changes to the hostnames-to-IP address mappings. Another file is /etc/inet/services.
    Make sure that no unauthorized Internet services are running. Still another important
    file is /etc/nswitch.conf,'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'which is used to configure how your system resolves names. In addition, a popular
    directory for hackers to manipulate is /etc/rc<n>.d. Since these directories contain
    the start and stop scripts for each run level, a hacker often inserts code that
    will keep his or her unauthorized apps running, even after the system is rebooted.


    This list is by no means complete. Your choice of files to monitor depends on
    how your system is used and how heavy you want your security settings to be. The
    default policy settings of Tripwire cover but not all of the most important system
    files. Make sure that you understand your policy configurations and know what
    files are being monitored and which ones not. Knowing your system and its particular
    configurations is the first step in stopping unauthorized changes to these files.
    File integrity software such as Tripwire will alert you to any changes, but make
    sure that you know what these files should be set to on your system.


    # Creating Daily Reports


    There are many excellent ways to automate the process of reviewing log files.
    One very popular application is called *swatch*. The application gets its name
    from the term *simple watcher and filter*. It was written in Perl by Todd Addkins
    and can be found at www.stanford.edu/~atkins/swatch. Swatch is easy to install
    and configure and can be very helpful in monitoring your log files and alerting
    you to potential problems.


    As we discussed earlier, the Tripwire application is a very popular and trustworthy-worthy
    way of monitoring for your files and directories. Another way is to create your
    own shell scripts to customize the information you want to review. Let''s look
    at how we can create a script that e-mails our own state-of-the-system report
    each morning.


    # A State-of-the-System Report


    Every morning by 7:00 A.M. I receive an e-mail message from each system for which
    I''m responsible. These messages give me a quick status report, letting me know
    the systems'' overall condition and giving an opportunity to see any potential
    system or security problems. Let''s take a look at creating a script that will
    give us a state-of-the-system report.


    First, let''s decide what we want to see. Just as with my local newspaper, we
    want to see the headlines, sports scores, business news, and articles on local
    people and events.'
