  md: 'Using Squid on Solaris - Chapter 9 281


    The advantage of this solution is that client browsers need only be configured
    once. Sometimes changes in proxy behavior become necessary—the proxy host name
    may change, for example, or certain URLs may need to be sent directly to the Internet
    rather than to the proxy. Changing the javascript in the proxy.pac file implements
    those changes without the need to visit every browser in the organization.


    # # Excluding Access to Restricted Web Sites


    Squid includes power access control features. It can regulate access to Web based
    on URL, MIME type, time of day, and the size of the returned data. The previous
    section gave an example of how to regulate access to the Web by time of day. This
    section will show how to regulate Web access based on URL, type of data returned
    from the Web site, and the size of returned data.


    Because of its powerful filtering features, Squid is commonly used by sites (like
    ISPs) that provide a ‘child-proof cap’ to your surfing experience. The Squid Web
    site provides links that use Squid to regulate Web content and lists of restricted
    domains are easy to find. We will provide a few example to illustrate this process.


    There are two basic means of regulating content by URL. The first, through the
    url_regex access control list, matches any part of the requested URL and may be
    used to allow or deny access. The second, through the dstdom_regex, matches the
    destination domain requested by the client.


    # # Filtering Content by URL


    You can filter out Web page requests that contain certain words in the address.
    If a supervisor from marketing complains that his marketing personnel are spending
    all of their time looking for other jobs, he could have the administrator create
    proxy rules to filter out the addresses of popular job search sites. To do so,
    add lines to the squid.conf as:


    ```

    acl jobs url_regex jobs

    http_access deny jobs

    http_access allow all

    ```


    The url_regex will search the entire URL requested by the client for the string
    "jobs" and return an error to the browser if such a site is accessed. url_regex
    is case sensitive, however, so a URL containing different capitalization


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_305_0.png)'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'may not be denied. A nearly limitless number of url_regex lines and their corresponding
    http_access lines can be specified—to block pornographic URLs, for example. However,
    regular expression processing for each and every URL requested by a large number
    of clients incurs a large processing overhead. Squid can alternatively send URLs
    to a program called a redirector for processing. Common redirectors use squid
    or jesred match URLs against their own lists of regular expressions and instruct
    Squid to either rewrite the URL into another form (for blocking pop-up ads), or
    pass it through unobstructed, or block it. Redirectors do not eliminate or significantly
    reduce computational overhead; they just simplify the management of large block
    lists.


    # Filtering by Destination Domain


    Alternatively, Squid can restrict access to sites with certain domain names. Under
    certain circumstances, this technique may be more effective than url_regex. For
    example:


    ```

    acl jobs dstdom_regex jobs.com

    http_access deny jobs

    http_access allow all

    ```


    The above example matches any domain name requested by the browser that ends in
    jobs.com.


    # Filtering by MIME Type


    It may be beneficial to regulate access to certain MIME types. Perhaps your users
    are spending too much time listening to RealAudio clips or viewing Video streams.
    Squid can match the MIME type requested by the browser when a client clicks on
    a link and deny access, returning an error message instead. To deny access to
    RealMedia files, use the following list:


    ```

    acl real req_mime_type real

    http_access deny real

    http_access allow all

    ```


    Be aware that any sort of content filtering, either by URL, domain, or MIME type,
    carries with it a considerable risk of false positives. Plenty of benign, work-related,
    or otherwise-harmless content may be unintentionally blocked by aggressive regular
    expression matching.'
