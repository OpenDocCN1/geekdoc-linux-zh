- pgno: 220
  md: '# Chapter 6 Securing Your Network


    Q: Many reports of Internet worms in the news lately. Linux have been lately.
    Solaris vulnerable to these types of worm attacks?


    A: Although no incidents have been reported yet, in theory it''s entirely possible
    to have worm-based attacks on Solaris. Worm-based attacks usually exploit either
    remote root vulnerabilities or a remote user vulnerability in conjunction with
    a local root vulnerability. All it would take is for someone to write a worm that
    exploits vulnerabilities exclusive to Solaris to create a worm. The reason it
    hasn''t been done yet is most likely market share. Writers of Internet worms and
    viruses generally take place of affecting larger numbers of systems. Because a
    greater number of Windows and Linux hosts exist on the Internet, this is likely
    the reason these two operating systems have been targeted thus far. Proper patch
    maintenance is the best way to keep ahead of any type of Internet worm. In most
    cases, vendors have already released a patch that covers the holes exploited by
    the worms. If you keep your systems updated with the latest security patches from
    Sun, most likely won''t need to worry about worm attacks.


    Q: I''ve heard about FTP bounce attacks that allow hackers to use anonymous FTP
    sites to attack other sites. Can you tell me more about these?


    A: Although they are not quite as common now as in the past, FTP bounce attacks
    are still in existence. If your anonymous FTP server has world-writable directories
    you could be an accessory to attack other sites that utilize inconsistencies in
    the FTP protocol to attack third parties, similar to source-routed attacks. Using
    the PORT command in an FTP session, you can redirect where the FTP server connects
    to pass raw TCP commands to this port. Because most FTP servers don''t verify
    that the FTP data stream and the FTP-command stream connect to the same host,
    the FTP server can be tricked into connecting to a third party host and sending
    various data. No simple solutions exist for FTP bounce attacks, but probably the
    best thing you can do is avoid running an anonymous FTP server and avoid allowing
    read/write access for any directory served out via FTP.


    Q: SSH sounds like a great way to secure my network, but my users will need Windows
    clients to connect to Solaris servers over SSH. Are there any available?


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_220_0.png)'
  merge: -1
  img_proc: true
