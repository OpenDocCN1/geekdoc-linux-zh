- pgno: 356
  md: '# Table 11.1 Tripwire Security Variables


    | Variable | Description |

    | SEC_CRIT | This variable is used on files or directories that can''t be changed.
    For example, the Tripwire policy file, tw.pol, and /etc/profile would be set with
    the variable. |

    | SEC_SUID | This variable is used on binaries that have the SUID or SGID flags
    set on them. |

    | SEC_BIN | This variable is set on binaries that are read-only and will not change.
    |

    | SEC_CONFIG | This variable is set on configuration files that are occasionally
    changed but are read often by other processes—for example, the /etc/hosts file
    or the other /etc/passwd file. |

    | SEC_LOG | This variable is used on files or directories that grow but should
    not change ownership. The system log files such as /var/adm/messages are an example
    |

    | SEC_INVARIANT | This variable is used on directories that should not either
    permission or ownership. The user home directories in /export/home are often set
    with this variable. |

    | SEC_TAB | This variable is used on the members of the Trusted Computing Base.
    |

    | SEC_PROC | This variable is used for scanning the Kernel Processes |

    | SEC_DYN_PROC | This variable is used for scanning the Kernel Processes area
    for processes for which the contents change. |


    The rest of the tw.pol file contains the descriptions of the files and directories
    to be monitored. The files and directories to be monitored are grouped according
    to the severity of the violation. For example, let''s look at the section for
    system configuration files:


