    # Tools & Traps...


    Good Housekeeping

    SNMP and cachemgr.cgi access can be valuable tools for administrators who maintain
    large numbers of caching proxy servers. However, there are security risks in allowing
    another host to control your cache. Attackers can shut down the cache, reconfigure
    its operation, and read the contents of the squid.conf. This information can reveal
    enough about your network and your Web clients to pose significant risk.


    To reduce this risk, be extremely conservative about management access. Only a
    few, trusted hosts inside your network should have management access, and passwords
    should be selected with the same care and attention to regular changes in other
    administrative accounts. Only your systems administrators should be allowed to
    control the cache.


    As SNMP is a cleartext protocol, as Squid does not support SNMPv3 encrypted passwords,
    the ideal manager shares the same switched password as the cache. If possible,
    cache hosts should have two network interfaces. One should be configured for public
    access, and the other, on a private network, should be used for cache control
    and exchange cache peering data. Sun’s line of Netra servers, which come equipped
    with two network interfaces, make excellent Squid hosts. If at all possible, the
    cachemgr.cgi binary should live on its own Web server, apart from your public
    content. Access to this binary should be limited to Secure Sockets Layer (SSL)-secured
    connections, to prevent exposure of the cache management password and sensitive
    data.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_297_0.png)'
