    # Notes from the Underground...


    # Know Your Enemy


    Researching security provides a unique insight into the state of your systems,
    their vulnerabilities and the amount of work needed to bring your systems up to
    par. Investigation will also lead you to discover information about the latest
    hacks, exploits and vulnerabilities days, weeks or even months before they are
    published in mainstream media sources.


    Quite a few white hat or hackers actively engage in hacking their own systems
    and software in an effort to uncover as-yet-unknown security risks and holes.
    Between the Web sites and repositories of the unethical and ethical hackers, one
    can easily get a good feel for what lies just beyond the horizon in terms of new
    exploits and vulnerabilities. I strongly suggest you utilize the Web and other
    resources, including peer and professional contacts, and keep abreast of the latest
    exploits and system vulnerabilities. Participate in the professional mailing lists
    for security and penetration testing experts, stay aware of new tools and tips
    for securing and verifying the security of systems, and generally be open-minded.


    All often, administrators think that securing a system once is enough. Nothing
    could be far from the truth. What checks out as secure in Solaris 8 may be from
    tomorrow’s vulnerability. Expect to constantly research the latest activity of
    both the good guys and the bad guys to stay one step ahead of the game. If you
    don''t, complacency will set in and eventually someone will root your system.
    Remember: security is ongoing!'
