    # # Monitoring and Auditing File Systems


    No matter what steps you have taken to secure your system, you must be ever

    vigilant. New attacks are discovered and perfected all the time, and new bugs
    are

    introduced with each new revision of software. Security is a moving target, and

    You can never return. Solaris offers you several handy tools to monitor your system.


    The easiest tool is the company''s online "fingerprint" database. You can use

    this database, located at http://solsolve.sun.com/pub-cgi/filefingerprints.pl,
    to

    compare MD5 checksums of your existing files also from pristine files.

    You''ll need the MD5 binaries, which are also available from Sun. You can

    download at http://solsolve.sun.com/md5/md5.tar.Z. Once the MD5 binaries

    installed, you can create checksums of your current files with a command

    similar to the following:


    ```

    find /usr/bin -type f -print | xargs -n 100 /opt/md5/md5-sparc =

    /tmp/md5.txt

    ```


    This command finds all files in the /usr/bin directory and then runs

    the MD5 checksum generator, redirecting the output to a temporary file.

    Other useful tools include the Sun Basic Security Module, BSM, which is

    a very thorough system auditor. BSM provides a C2 level of auditing, which is\quite
    a lot of information. To enable BSM auditing on your system, simply exe-

    the /etc/security/bsmnconv. BSM writes its logs in binary format, and for that
    reason,

    includes two tools for maintaining the logs. These are auditreduce(1M) and

    praudit(1M). Two categories of events are logged: user processes and kernel

    events. When BSM is enabled, all security-sensitive kernel events pro-

    duce audit log. The following user programs can also generate audit entries:


    +   - /bin/login

    - /usr/bin/su

    - /usr/bin/newgrp

    - /usr/dt/bin/dtlogin

    - /usr/bin/in.fptpd


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_175_0.png)'
