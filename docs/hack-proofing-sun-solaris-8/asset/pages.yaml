  img_proc: true
- pgno: 143
  md: '# Securing Users • Chapter 4


    requisite could, for example, allow any user in group root to so without presenting
    a password. Therefore, systems administrators should be wary of this flag.


    In our first example, we will restrict its attempts to those administrators who
    are part of group root. This feature originally appeared in BSD-style UNIX systems
    like SunOS and IRIX. Many sites want to prevent casual users from making such
    attempts, both because it reduces brute attacks against the root account and because
    it makes the auth easier to read. (Solaris 2.6 reintroduced the su command, which
    has long failure delays and will not respond to control-C). Casper Drik used a
    simple PAM to emulate this feature. It can be found at www.science.uva.nl/pub/solaris.


    First, you''ll need to configure the PAM:


    ```

    su_group0.c -o su_group0.so -Kpic -G -lpam

    ```


    This will generate a shared object. Copy it to the default PAM location and set
    the appropriate permissions in the following code example. As a security feature,
    the PAM system will ignore any module with loose permissions or privileged ownership.


    ```

    # cp su_group0.so /usr/lib/security

    # chown root:other /usr/lib/security/su_group0.so.1

    # chmod 755 /usr/lib/security/su_group0.so.1

    ```


    Edit the /etc/group file and change the root line as shown in Figure 4.2. Open
    the pam.conf, and find the following line:


    ```

    su auth required /usr/lib/security/pam_unix.so.1

    ```


    Your new PAM will check the group membership of the person who launched the su
    command. If the intent is to su to root, the PAM determines whether user is a
    member of group root. If so, the authentication process drops through and an error
    is returned, indicating "You have no permission to su root." In order to this,
    the PAM must be a prerequisite of the authentication provided by pam_unix. It
    must be passed successfully before the user will even be prompted for root''s
    password. Therefore, you will need to add the following line immediately before
    the line shown above. Be sure to keep the original entry as well.


    ```

    su auth requisite /usr/lib/security/su_group0.so.1

    ```


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_143_0.png)'
  merge: -1
