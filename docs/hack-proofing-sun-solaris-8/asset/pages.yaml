  md: '# Foreword


    Luckily, as Solaris System Administrators, we have some excellent tools available
    to us. Sun Microsystems has spent a great deal of effort in designing Solaris
    to be both stable and secure. This book is your reference guide for not securing
    your Solaris systems, but also for securing the environment in which they operate.
    It is not designed to be an introduction to UNIX or a primer on Solaris System
    Administration, but rather a reference guide for experienced Solaris sysadmins
    who need to make sure their systems are secure.


    Starting with Chapter 1, we attempt to level the playing field between you and
    your systems. It begins by discussing how to evaluate your current security scheme.
    One thing a hacker will always take advantage of a sysadmin''s complacency. We
    will start by going over the default settings you will find on a newly installed
    Solaris 8 system. We also go over the basics of testing, monitoring, and documenting
    security procedures.


    Next, in Chapter 2, we cover the standard security tools available from Sun Microsystems.
    This includes an overview of Sun''s BSM product and a look at the features of
    Sun''s Trusted 8.


    In Chapter 3, we introduce third-party security tools which are commonly used
    to secure and monitor Solaris systems. This chapter not only recommends some valuable
    tools to on hand but how to get them and how to configure them for maximum effectiveness.


    We begin discussing how to protect our resources in Chapters 4 and 5. First, by
    how users are authenticated on a Solaris system. Then by discussing how to configure
    file permissions and commonly used protocols like FTP and NFS to transfer information
    safely among our authenticated users.


    Once we have secured our systems, we need to explore our options for providing
    secure network services. Network users need today access to resources on your
    local network and on the Internet. Opening this door can be a tremendous headache
    for a sysadmin. A major portion of this book is devoted to providing secure access
    on both sides of your router. Chapter 6 covers our focus to how Solaris 8 operates
    securely in a networked environment by providing DNS and DHCP services to network
    clients. In Chapter 7, we learn how to configure a secure Web and e-mail server.
    In Chapter 8, we narrow our focusing by concentrating on how to configure Solaris
    to be a router and provide firewalls services. Chapter 9 is totally devoted to
    providing information on the configuration of the security features of Squid,
    one of the most popular apps for providing Web access to users.


    Knowing your opponent''s methods and tools is the first step in defeating their
    efforts. Now that we''ve learned what tools we have available, in Chapter 10 we
    learn


