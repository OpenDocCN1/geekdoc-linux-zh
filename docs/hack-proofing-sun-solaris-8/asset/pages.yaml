- pgno: 66
  md: '# Chapter 2 · Securing Solaris with the Bundled Security Tools


    The auditconfig command is useful in maintaining and configuring the characteristics
    of auditing. Using auditconfig with the -setpolicy option changes the specified
    default audit policies. The -chkconf option runs a configuration check for inconsistencies
    in policy. An -l option returns a list of audit policies and a short description
    of each one''s function. Finally, the -conf option reinitializes the runtime mappings
    currently being used so that changes can be affected without a reboot.


    # Managing the Audit Log


    By default, the audit log will be placed in the /var/audit directory. The file
    system where the audit logs reside should be in a separate partition to avoid
    the possibility of data filling up the file system and impacting the system Residing
    in its own partition, the audit daemon initiates a script to send a message to
    the console when the audit partition is full. The daemon goes into a loop in which
    it periodically awakens and determines if the partition-full condition has been
    corrected. If it has, the daemon continues its auditing function.


    Control of the audit log file can be manipulated by editing the audit_control
    file (discussed later in Figure 2.3). There are four types of lines in the file.
    The first one we will discuss is the dir: line, which is where the location of
    the audit log file resides. If you edit this line, you can place the audit log
    on a file system that is least dangerous. There can be multiple entries to give
    a failover capability to the audit file, providing a directory path for continued
    auditing should the first path fill up. If the /var file system is on its own
    partition, the default could be perfectly acceptable. Regardless, it is easily
    configurable should you desire that the location be different.


    One of the other variables that can be defined in the audit_control file is the
    audit threshold variable. This variable is designated by minfree and controls
    the trigger for the audit trail overflow condition and is determined by the percentage
    of free space on the file system where the audit log resides. The default is 20
    percent but can be configured to any percentage over zero. It is the trigger point
    when the audit daemon starts sending messages to the console warning that the
    audit file system is filling up.


    The audit_control file not only controls the basics of the audit log but also
    two other broadly affective functions. These are designated by the other two lines
    in the file. The audit flags line designated by the flags: variable and the nonattributable
    file line designated by the naflags: variable. The flags:


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_66_0.png)'
