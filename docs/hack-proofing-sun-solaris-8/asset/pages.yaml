    # Configuring Solaris to Provide Anonymous FTP Services


    Configuring Solaris to provide FTP services to users under your control is not
    difficult, and the default configuration is certainly suitable in most cases.
    As stated in Chapter 1, if you run an FTP server, adding all users to the /etc/ftusers
    file is clearly recommended. Users listed in this list are denied FTP access.
    Then, you should grant FTP access on a per-user basis based on need. Or may wish
    to consider using sftp, which is probably more secure for authenticated user access,
    as described in the SSH section. However, configuring FTP for anonymous access
    is a different beast altogether because anonymous users are not under your control
    and are not authenticated on your system. This section describes why you should
    use only anonymous access when absolutely necessary, and it points you on how
    to set up anonymous FTP service.


    Before finalizing your decision to run anonymous FTP services, take a good look
    at whether or not you really need them. Do you just need to distribute software
    patches or evaluation software to customers and potential customers? If so, consider
    transmitting them over the HTTP protocol, which is far more secure than allowing
    anonymous FTP access.


    The reason why anonymous access is safe with insecurities is because you are allowing
    unauthenticated Internet users who have no control over connect to your server.
    File transfers may be logged, but connection might not be. A few years ago, it
    was possible to use the SITE EXCH function to get remote root access to an FTP
    server because the FTP service ran as the root user. Although holes like these
    have been patched since, that isn''t to say that the FTP service doesn''t contain
    similar bugs like that are yet undiscovered. If your directory permissions are
    improperly configured, so that anonymous users can read and write in the same
    directory, it''s very likely that someone will discover this and turn your FTP
    server into a sharing facility for pirated music and software or pornography.
    If such abuses are not readily discovered, it could cost your organization a fortune
    in bandwidth fees.


