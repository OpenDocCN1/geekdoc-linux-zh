  md: '# Introduction


    One of the benefits of Solaris being a UNIX variant is the fact that software
    originally developed for other UNIX platforms is easily ported and configured
    for use under most modern versions of Solaris. Because of this, an abundance of
    freeware-related software exists in the public domain. The downside is that this
    software is also easily obtained by malicious hackers, and may be used against
    you and your systems when you least expect it.


    We will start by examining a popular portscanning tool that is easily adapted
    to finding openings in a vulnerable system, as well as determining what systems
    are attached to a particular subnet. We will look at a common and well-maintained
    network intrusion detection system that may be used to monitor for suspicious
    malicious traffic on your networks. We will examine the benefits of a dedicated
    network sniffer, and see how it can enhance your network and system security.
    We will have a look at a tool that allows administrators to grant access to super-user
    functions on a case-by-case and user-by-user basis.


    It is critical to remember that these tools, well-supported in the UNIX community,
    are not the be-all, end-all for network, system, and user security. Are there
    better tools out there? It is difficult to judge what is better when comparing
    something for free that costs money (whether a little or a lot). Commercial tools,
    due to their price tag, often come with superior technical support and maintenance
    resources available by phone, the World Wide Web and even through on-site support
    engineers. You generally will not find any of these offerings from an open source
    tool. With commercial software, the customer is usually proactively notified when
    a new or bug fix is released, whereas with free software, the administrator must
    devote some portion of his or her time to verifying that the latest and greatest
    release is being. Whether free or commercial, each type of software offers certain
    advantages over the other.


    Ultimately your organizational structure, your superiors and your budget allocations
    will decide which path you take. In some cases, you may have a mixture environment
    of free and commercial products. I have found that such a mixture often works
    best in heterogeneous environments. Your needs and restrictions will eventually
    determine what tools you use.


    As you start to explore and use these freeware tools, you should be aware of several
    things. First and foremost, these tools are open source and generally distributed
    as source code only. This means you will need appropriate compilers, libraries
    and other utilities to get the software in a machine-runnable format. Since anyone
    can download this software, and because numerous parties tend to


