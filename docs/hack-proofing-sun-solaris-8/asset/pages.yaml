- pgno: 207
  md: '# Securing Your Network • Chapter 6


    X-clients are granted permissions to use the X-server display based on the credentials
    they present to the X-server, which can be either host-based or user-based. Host-based
    authentication is based on the IP address of the request, whereas user-based authentication
    is based on an access token known as a magic cookie. Furthermore, the X-protocol
    itself is a cleartext protocol, which is vulnerable to eavesdropping, interference,
    and tampering.


    # Using Host-Based Authentication


    Host-based authentication is the simplest form of X-authentication to configure
    as well as the easiest to circumvent. With host-based authentication, access is
    granted or denied by the X-server based on the IP address of the incoming request.
    By default, all remote access is implicitly denied, and remote access needs to
    be explicitly allowed. Think of X-authentication as the process of getting past
    the bouncer at an invitation-only party dinner.


    For example, using host-based authentication is analogous to an invitation only
    party dinner where the bouncer has a list of all the invited guests (explicitly
    allowed hosts) as well as a list of people he should not allow in under any circumstances
    (explicitly denied hosts). When a guest shows up, or an X-client from 192.168.1.23
    asks to access the display, the bouncer checks the credentials of the X-client
    against his lists. If 192.168.1.1 is explicitly denied by the X-server''s allowed
    list (an uninvited guest), the 192.168.1.23 is explicitly allowed by the X-server''s
    allowed list (the guest has been invited), the X-client is allowed access. The
    X-client is also denied if its IP address appears neither specified or denied
    lists.


    The access lists for the X-server are controlled using the **xhost command**.
    Running the command with no arguments will display the currently allowed user/host
    combinations. You must be on the system console to add or remove access to the
    X-server, which takes the form of **xhost +-user@host**. For example, to add access
    for *scarter* on the remote host *hydrant*, you would use the command **xhost
    +scarter@hydrant**, and to remove access for everyone on the host engine9, you
    would use the command **xhost -engine9**.


    # Using User-Based Authentication


    Although host-based authentication is convenient and simple to configure, its
    security is primitive and the authentication methods are subject to spoof IP addresses.
    To continue the dinner party analogy, with host-based authentication the bouncer
    has no way of verifying the legitimacy of the user''s ID, and the user


