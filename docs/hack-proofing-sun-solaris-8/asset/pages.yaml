- pgno: 307
  md: '# Filtering by Content-Length Header


    Finally, Squid provides the option to regulate the size of the data returned to
    the browser. This is useful to prevent clients from downloading large files, such
    as movies. However, as HTTP has largely replaced FTP as a means of anonymously
    distributing software, archives, patches, and other large binaries, this also
    carries with it the risk of impairing harmless use of the network. The reply_body_max_size
    object controls the largest reply Squid is willing to pass along to the client.
    By default, the value is 0, meaning that replies of arbitrary size will be accepted.
    Squid uses the content-length header provided by the remote Web server to check
    this value. If that header is unavailable, the client will receive data from the
    remote server until reply_body_max_size is exceeded, at which point Squid will
    abruptly close the connection. To allow replies up to 4 megabytes, find the following
    line in the squidconf:


    ```

    #reply_body_max_size 0

    ```


    and change it to:


    ```

    reply_body_max_size 4096

    ```


    Note that Squid measures reply sizes in kilobytes.'
