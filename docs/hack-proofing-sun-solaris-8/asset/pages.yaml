    # Using SSH for Remote Access


    SSH is the single greatest security enhancement you can add to a Solaris server.
    The original SSH (SSH-1) protocol was developed by Finnish University student
    Yönen in 1995 to address the shortcomings of cleartext communications such as
    ftp and telnet. Since then, a protocol update (SSH-2) has eradicated any of the
    lingering insecurities of the original SSH protocol. Originally, SSH was distributed
    by Yönen in code and binary forms without charge, but along the way Yönen changed
    the licensing of the product so that commercial-users must purchase licenses from
    Yönen''s company, SSH Communications Security. You can get commercially supported
    SSH from www.ssh.com.


    Because both forms of the SSH protocol were official IETF draft standards, one
    group of developers, now known as OpenSSH, forked the last noncommutative release
    for the original SSH software and developed a free-for-any-use version. This version
    is now known as OpenSSH and supports both versions of the SSH protocol in a single
    daemon, whereas commercial SSH requires one daemon per protocol. In our opinion,
    OpenSSH is better than the commercial SSH distribution because OpenSSH has a more
    efficient implementation of the SSH protocols that supports extended encryption
    algorithms, is on more platforms, and is available at no charge. OpenSSH source
    code is available from www.openssh.org, and you can find compiled packages at
    www.biblio.org/pub/packages/solaris/spar/.


    Once installed, most SSH implementations are very secure. However, you may want
    to consider disabling remote access as root by changing the option PermitRootLogin
    to No. This will prevent brute force attacks on your root password by denying
    any direct login attempts.


    From a client perspective, SSH functions more or less as a drop-in-replacement
    for ftp, telnet, and the Berkeley r-commands, including rcp. Additionally, great
    care was taken to emulate the syntax of the Berkeley r-commands such that if you
    are already familiar with login, rsh, and rcp, you already know how to use SSH,
    from a client perspective. Table 6.2 lists a comparison between


