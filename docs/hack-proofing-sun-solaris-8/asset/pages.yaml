  md: '# Chapter 9 Continued


    +   - SNMP and the cachemrg.cgi CGI program allow advanced monitoring and control
    of the cache, but they require careful attention to security.


    # Configuring Access to Squid Services


    +   - Squid can require that users authenticate before accessing the proxy. By
    default, Squid is capable of handling HTTP basic auth by way of an external program.


    +   - Squid authentication is tied to the client IP address and lasts for one
    hour. This value can be configured through the authenticate_ttl tag for longer
    or shorter durations, as your clients require.


    +   - HTTP basic auth travels in the clear, so Squid passes should be different
    from those that provide access to shell accounts or electronic mail. Consider
    one of the many CGI password–changing forms to simplify account maintenance for
    your users.


    +   - The three most common Web browsers can access the Internet through a proxy
    server. In general, all that is needed a cache host name and a port number. The
    use of an automatic proxy configuration URL, which is supported by either Netscape
    or Internet Explorer, will simplify client configurations and allow greater control
    over how clients access the proxy.


    # Excluding Access to Restricted Web Sites


    +   - Use url_regex or dctcm_regex to match remote sites.


    +   - To regulate the type of content downloaded, use the req_mime_type regular
    expression.


    +   - Regulating Web content may improve or prevent the viewing of questionable
    material, but aggressive filtering carries with it the risk that performance and
    browsing may be negatively impacted.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_399_0.png)'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# Chapter 10: Dissecting Hacks


    # Securing against Denial of Service Hacks


    +   - Configure network equipment to restrict traffic to permitted protocols,
    routable address spaces, and committed access rates.


    +   - Configure mail servers to mitigate the effects of e-mail floods by providing
    for a large, separate partition to /var/spool/mqueue. Also consider using anti-SPAM
    software or writing rulesets to identify and reject SPAM.


    +   - Tune Solaris''s kernel parameters to allow for larger TCP connection queues
    and shorter TCP abort timers.


    # Securing against Buffer Overflow Hacks


    +   - Add noexec_user_stack and noexec_user_stack_log to /etc/system. While this
    does not eliminate the problem of buffer overflows with 100% certainty, it will
    certainly make it more difficult for the average hacker to exploit a system with
    a buffer overflow.


    +   - Stay current on system patches.


    +   - Don''t run unnecessary services. The more services run on a system, the
    greater the possibility that a buffer overflow will be discovered in a service
    and exploited by an attacker.


    # Securing against Brute Force Hacks


    +   - Establishing a good password policy is a key feature in defending against
    brute force hacks. Passwords should expire after a reasonable amount of time,
    but not so often that users find the policy too troublesome.


    +   - Using programs such as inpasswd, passwd+ or nppasswd. These programs are
    designed to be used somewhat as drop-in replacements for the standard passwd program
    in Solaris. They provide for password strength checking before passwords are actually
    changed in the system files. If the user chooses a password that is considered
    too weak, the password will be rejected and the user will be asked to choose another
    one.'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# Chapter 10 Continued


    +   - Be sure to require the password length to be eight characters. This can
    be controlled by changing the value of PASSMIN in /etc/default/passwd from the
    default value of six to eight.


    +   - Do not run NIS unless absolutely necessary. Use NIS+ instead, or consider
    other authentication methods such as Kerberos or LDAP.


    +   - Occasionally run a password-cracking program such as John the Ripper on
    the password/shadow files to find weak passwords. Notify the user that their password
    has been cracked and should be changed.


    # Securing against Trojan Horse Hacks


    +   - Stay current patch levels to limit or deny an attacker''s ability to gain
    root privilege levels and install rootkits.


    +   - Restrict access to the cron through the use of the /etc/cron.allow and /etc/cron.deny
    files.


    +   - Run file-integrity-checking programs such as Tripwire, Fcheck, AIDE to detect
    trojan programs.


    +   - Set the default paths in /etc/default/login for users and for root to /usr/bin
    and /usr/bin:/usr/sbin respectively.


    # Securing against IP Spoofing


    +   - Use SSH in place of the r-services (i.e. rsh, rlogin, rpc, etc.).


    +   - If disabling the r-services is not possible, specify unique IP addresses
    rather than subsets in the /etc/hosts.equiv or .hosts files. Also specify the
    username to trusted hosted access. For example, if the system 192.168.100.1 trusts
    the host 192.168.100.54, the entry in the /etc/hosts.equiv for user jdoe would
    be


    ```

    +192.168.100.54 jdoe

    ```


    +   - Use tools as arpwatch to try to detect possible MAC address spoofing attempts.


    +   - Use SSH in place of the r-services (i.e. rsh, rlogin, rpc, etc.).'
  merge: -1
  img_proc: true
- pgno: 402
  md: '# Chapter 11: Detecting and Denying Hacks


    Monitoring for Hacker Activity


    +   - Using Tripwire is an excellent way to monitor changes to files and directories.
    While the commercial version offers additional features, the open-source version
    is an ideal solution for providing security on a limited budget.

    - The tw.pol file is the policy file that is monitored by Tripwire and when the
    alerts are sent.

    - The commercial version offers Tripwire Manager, which you can use to monitor
    and configure multiple systems remotely.


    # Using Shell Scripts to Alert Systems Administrators


    +   - You can use custom scripts to provide additional monitoring.

    - Make sure that the scripts are in a secure directory and are run by a nonroot
    account.

    - Use the crontab command to set the scripts to run on a regular schedule.


    # What to Do Once You''ve Detected a Hack


    +   - A honeypot is a system designed to lure hackers away from your protected
    systems or networks.

    - A honeypot should be configured carefully so not to allow the hacker to gain
    access to other systems while at the same time monitoring the hacker''s activity.

    - Commercial version of honeypots can simulate entire networks, but be aware that
    the false system will all originate from the same MAC address.


    # Monitoring Solaris Log Files


    +   - The logs under /var/adm are valuable for getting information on recent activity.

    - Make sure that the syslog file is protected on a honeypot system. One way is
    to write to a remote server.'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# Chapter 11 Continued


    +   - The configuration files under the /etc directory need to be protected from
    hacker manipulation. Make sure that Tripwire is configured to guard these files.


    # Creating Daily Reports


    +   - One way to keep tabs on your systems is to create a shell script that will
    e-mail you a report each day.

    - Some good pieces of information to keep track of are the most recent entries
    in the /var/adm/messages file, the last time the system was rebooted, and the
    current CPU load and active logins.

    - Use the crontab command to enter the scripts as a daily cron job.'
