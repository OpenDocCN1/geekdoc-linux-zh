- pgno: 85
  md: '# Summary


    Solaris 8 OE has satisfactory security measures included in its build set with
    SunSCREEN BSM enabled that are based on the security standard set by the DOD’s
    Orange Book C2 criteria. Auditing is the first level of additional defense provided
    with BSM that can be added into the default Solaris 8 OE installation. With auditing,
    the administrator has taken on the role of watchdog, protecting the security of
    the system’s resources with vigilance against infractions and with a secure, established
    policy for actions to be taken when they occur. It is important, however, to organize
    auditing so that it never becomes a burden to the administrator or, more importantly,
    a danger to the system.


    Sun provides additional products that compliment and enhance the existing security
    measures—measures that can be added on layers to achieve a much higher degree
    of protection. Trusted Solaris 8 OE is a package designed to provide a heightened
    architectural design based on the standard Solaris 8 OE foundation but including
    security standards that bring the system up to the DOD’s Orange Book B1 criteria,
    including Role-Based Access Control and Mandatory Access Control based on labeling.
    If protection than Solaris 8 OE’s C2-level security is needed, Sun provides configuration
    blueprints in a collection of scripts called the Security Toolkit. The toolkit
    allows for specific configuration of functionality in the Solaris 8 OE to close
    possible security holes; it is completely flexible. It is built to work with the
    JumpStart application to be able to load preconfigured for high security. If additional,
    more robust connectivity is needed, Sun provides the open-source application OpenSSH
    tailored to work with the Solaris Security Toolkit. This application, when compiled
    and linked in the Solaris 8 OE, provides encrypted X-application communication
    with clients.


    # Solutions Fast Track


    # The Orange Book


    +   - The Orange Book is the foundation for computer security as it is modeled
    today, providing the de facto standard for assessing security levels with classifications
    such as C1, C2, and B1.


    +   - The file security defined in the Orange Book provides the basic model used
    in virtually all computer systems today.'
