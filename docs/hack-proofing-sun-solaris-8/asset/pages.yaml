    Samba has few different authentication methods. These are **user, share, server**,
    and **domain**. It is important to understand the differences between the four
    and which suits your needs. For this end, take a moment to examine the features
    of each option, as quoted from the smb.conf page:


    +   - **security=share** When clients connect to a share-level security server,
    they need not log on to the server with a username and password before attempting
    to connect to a shared resource (although modern clients such as Windows 95/98
    and Windows NT will need a logon'
