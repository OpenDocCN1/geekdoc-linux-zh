  md: 'Securing Solaris with the Bundled Security Tools • Chapter 2


    differences Trusted Solaris 8 OE provides in a much more robust level of system
    security by default. Finally, the chapter discusses a sampling of supplemental
    security packages available to augment and enhance security security under the
    Solaris 8 OE.


    # # The Orange Book


    Security, as it is structured today, had its beginnings in 1985 with the publication
    of a book that became an imperative for computer hackers everywhere: the so-called
    Orange Book. This publication, actually entitled Trusted Computer System Evaluation
    Criteria, DOD Standard 5200.28-STD, December 1985 (also referred to as TCSEC),
    is a synopsis of criteria of materials Rainbow Series. The name was derived because
    its binders were brightly color-coded. These criteria were developed by a group
    under control of the Department of Defense (DOD) and the National Security Agency
    (NSA), called the U.S. Government National Security Council. It describes the
    requirements outlined by the federal government to ensure security of data residing
    on computers, utilizing the existing hierarchy as it was already structured in
    their paper-oriented bureaucracy. This system gave to the classification of computer
    system designated by the combination of a letter and a number, as C2 security,
    which became the de facto industry standards and are still in use today, even
    though the DOD standards have changed. Because of the comprehensive nature of
    this document in its establishment of existing security structures, the understanding
    of its concepts and logical hierarchy is still considered a fundamental core for
    both security developers and hackers. An excellent source for Orange Book references
    can be found at www.dynamoo.com.


    The classifications of Orange Book standards are familiar to most experienced
    system administrators on some level. When we install the Solaris 8 OE, we are
    defaulted to a level of enhanced C1 security that can be upgraded to C2 security
    with the configuration of the SunShield Basic Security Module (BSM). BSM allows
    you to add the criteria of auditing user activities and controlling access to
    devices on Solaris 8. These controls, along with the requirement for user accounts
    and passwords and the ability to restrict access to files, comprised the requirement
    to reach the security level of C2. The following items are a summary of the Orange
    Book security criteria:


    +   - **D, Minimal** This is a nonsecure system. Provided as a point of reference
    on a conceptual level. This type of system rarely exists in the real world.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_59_0.png)'
