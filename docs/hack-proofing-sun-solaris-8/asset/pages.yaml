  md: '# Role-Based Access Control


    A new addition to Solaris is the concept of role-based access control (RBAC).
    Systems administrators familiar with the sudo utility should find RBAC simple
    to use. RBAC''s purpose is to extend limited privileges to certain accounts. Generally
    in UNIX systems, an individual either has root access (and all the risks and powers
    associated with it), or is a regular, unprivileged user. In contrast, RBAC allows
    for the delegation of certain, specific tasks.


    RBAC uses four files to control access to certain operations. The first, /etc/user_attr,
    is used to match users and roles with their authorizations and the profiles they
    possess. The default entry in /etc/user_attr is as follows:


    ```

    # Copyright (c) 1999 by Sun Microsystems, Inc. All rights

    # reserved.

    #

    # /etc/user_attr

    #

    # user attributes. see user_attr(4)

    #

    #pragma ident "(#)user_attr 1.2 99/07/14 SMI"

    ```


    ```

    root::type=normal;auths=solaris.*,solaris.grant;profiles=All

    ```


    This entry states that the root user is granted access to all defined profiles.


    The second file, /etc/security/auth_attr, defines a list of authorizations and
    includes a brief description of the powers that these authorizations grant, as
    well providing a link to a help file. The auth_attr file is quite long, so we''ll
    just take a single line as an example:


    ```

    solaris.device.grant::Delegate\

    DeviceAdministration::help=DevGrant.html

    ```


    The first field, solaris.device.grant, holds several pieces of important information.
    The first component, solaris, indicates that this authorization applies to the
    Solaris Operating Environment. The second, device, implies that this role can
    operate on system devices, like printers, tape drives and the like. The last key-word,
    grant, gives members of the role ability to delegate additional roles within solaris.device.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_127_0.png)'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'The third file, /etc/security/prof_attr, is used to group authorization attributes
    into larger categories. These grouped attributes can be assigned to users, groups,
    or other roles. The corresponding device management entry to the one we used above
    is:


    ```

    Device Management::Control Access to Removable

    Media:auths=solaris.device.*;;help=DevMgmt.html

    ```


    The important part of this file is the auth entry. That consists of a colon-delimited
    list of authorization attributes. This example includes all device management
    functions from the auth_attr table, including allocate, config, grant, and revoke.


    The last table, /etc/security/exec_attr, contains a list of roles, that they may
    execute, and, if necessary, the effective-UID that the command will inherit in
    each role. In this way, RBAC allows an administrator to grant a limited subset
    of the same privileges held by special accounts like root, daemon, or lp.


    To view the authorizations and roles assigned to a particular user, issue the
    following commands:


    ```

    # auths tealc

    auths: tealc: No authorizations

    # roles tealc

    roles: tealc: No roles

    ```


    # Understanding Solaris

    User Authentication


    Solaris builds upon basic UNIX authentication by allowing systems administrators
    to configure password policy and expiration, the methods by which an account may
    be accessed, and the search order for authentication credentials. This section
    will discuss some of these features, their strengths and weaknesses.


    Password policies that can be configured include minimum password length, whether
    a change is required at first login, whether the password expires and how much
    prior warning is given before a change is forced, and whether an account may be
    logged in online or only by su. The circumstances under which certain policies
    are appropriate are varied and site-specific. This section seeks to illustrate
    the configuration options available, as well as explaining how to set them.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Securing Users · Chapter 4


    Admintool allows easy configuration of these options for each user. However, managing
    a large number of accounts with Admintool would be cumbersome and time-consuming.
    It is better to understand how Solaris determine account and authentication policy,
    in order to ease configuration for large domains.


    Three keys define how Solaris authentication and policy operate. The first, /etc/default/login,
    controls a variety of security settings at login. Table 4.2 explains the purpose
    and security implications of each of these settings.


    # Table 4.2 Login Policy Variables


    | Variable | Purpose |

    | --- | --- |

    | CONSOLE | If set to YES, this restricts root logins to the system console. Root
    cannot log over login, or Telnet. This does not prevent a user login followed
    by su. This feature is useful to prevent mistakes by novice systems administrators
    or to prevent the use of .hosts file created to automate a task. |

    | SYSLOG | If set, root logins are logged at LOG_AUTH and multiple failed login
    attempts are logged at LOG_CRIT. |

    | UMASK | Initial shell umask. By default, 022. More restrictive sites may want
    to set this to 027 or 077. |

    | SLEEPTIME | The time to wait, in seconds, before a login failure is returned
    and another login may be attempted. The default is four seconds; the maximum is
    five. Setting this value to zero can simplify brute-forcing of accounts or service
    by exhausting processes or ptys. |

    | TIMEOUT | Sets the length of time, in seconds, before an incomplete login is
    rejected. |

    | ALLOW_AGED_PASSWORD | If set, and a password has expired, the user will still
    be permitted to log in. If set to NO, an expired password that has not been changed
    will reject a login attempt. |

    | PASSREQ | If set, a login account will require a password. This feature forces
    accounts to be accessed only by su, which provides a useful audit trail. |'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Table 4.2 Continued


    | Variable | Purpose |

    | --- | --- |

    | PATH | Sets the initial path for a login process. This can provide security
    or convenience. The default value err on the side of security by providing a limited
    search path to regular commands. |


    The second file, /etc/default/su, controls the behavior of the su command in a
    manner similar to that of /etc/default/login. Table 4.3 shows the options available
    for this file.


    # Table 4.3 Policy Variables for the su Command


    | Variable | Purpose |

    | --- | --- |

    | SULOG | If present, this variable specifies the file to which all attempts are
    logged. It is valuable to periodically generate reports from this file. |

    | CONSOLE | If YES, all attempts to root are logged to the system console. |

    | SYSLOG AND PATH | Same as shown in Table 4.2, for /etc/default/login. |


    The last file, /etc/default/passwd, controls password policy. Its options are
    simple: the minimum and maximum length of time, in weeks, that a password is valid,
    and the minimum number of characters acceptable for a new password. Sites that
    make large use of password expiration policy may want to adjust the WARNWEEKS
    value, which isn''t shown in the file, to give users opportunity to change their
    passwords.


    During a login, Solaris checks /etc/pam.conf for a service (see the PAM section).
    If one is found, the PAM modules specified for that are loaded. In the case of
    pam_unix, which handles UNIX authentication, the PAM solicits a username and password
    through the appropriate interface (it dt login, for example). Solaris must then
    recover the user''s credentials in order to validate that the user exists and
    has presented the correct password. This begins a search process through files,
    NIS, or NIS+, which is controlled by /etc/nsswitch.conf. A typical entry for password
    hash searches (returned to the getpwnam [3C] and getpnam [3C] calls) in /etc/nsswitch.conf
    is:


    ```

    passwd: files nis

    ```'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'This search order implies that /etc/passwd and /etc/shadow are searched for
    the user''s credentials. If no entries are found, NIS is searched. If no entries
    are found, the system call fails and the user is rejected as unknown. Otherwise,
    the password presented at login time is hashed and hash is compared with that
    returned by the search. If they match, the user is authenticated and login proceeds.


    There are other valid entries in nswitch.conf. Entering nisplus causes a search
    of the NIS+ password database. The keyword compat may be used, with no other options,
    to cause the system to operate in a mode compatible with BSD password file syntax
    for netgroup inheritance (see sidebar).


    Other PAM modules operate differently; but the majority of user authentication
    schemes in involve gathering a username and password from the user, providing
    to that authentication service for validation, and accepting or denying the login
    as appropriate. There are other feasible methods, but the overwhelming majority
    of e-mail clients, secure shell clients, FTP clients and the like are designed
    with username/password pairs in mind. Kerberos is different in that it uses cryptographic
    credentials for authentication; which will be discussed in the chapter.


    As is the case with any form of authentication that uses reusable credentials,
    services that are subject to network eavesdropping pose a security risk. Secure
    alternatives exist for shell, X-windows connection forwarding, POP and IMAP access,
    and file transfers. These alternatives, usually a Secure client or SSL-capable
    mail client, protects passwords from network spies by cryptographically covering
    the entire channel. Any clear text service that operates with reusable passwords
    is at risk for snooping. (One-time password systems like OPIE, S/key, or secured
    are the exception.)


    # Authenticating Users with NIS and NIS+


    NIS is probably the most common network resource used today. Originally known
    as the Yellow Pages (YP), NIS has roots that lead back to the earliest days of
    Sun Micros. As one would expect from a piece of technology so old, it is well-understood
    and reliable, but full of security holes. NIS+, a direct descendant of NIS, seeks
    to address some of the performance and security issues inherent in the original
    system.


    This section will discuss some security issues inherent in distributed authentication
    systems in general. Individual differences between NIS and NIS+ are less important
    than a best practices overview of the risks they represent.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'same risks are present in LDAP, though this increasingly common technology
    reduces them further.


    Good practices include the following:


    +   - Keep root accounts local. While a common UID 0 account in NIS makes systems
    administration easier, it is more exposed to attack.


    +   - NIS and NIS+ masters should be limited-access machines. Not only does this
    free the machine from running user processes, it prevents direct exposure of the
    maps.


    +   - NIS masters should use the /var/yp/securenets to ensure that only known
    clients can successfully ypbind. NIS slave servers should use securenets files
    and local yservers with an entry of localhost, and be bound to themselves.


    +   - Disable /var/yp/Makefile on NIS slaves. Though this is not a security issue,
    an accidental push from a slave server cause difficulty in diagnosing problems.


    +   - Use shadow passwords where possible, as they reduce the exposure of password
    hashes. Tools like John Ripper and Crack are able, with modern CPUs, to brute-force
    hundreds of passwords within days.


    +   - NIS and NIS+, when using SecureRPC and data encryption standard (DES) for
    authentication, should be confined to networks over administrators have strict
    control. In particular, Universities should never make NIS available to student
    networks.


    +   - NIS and NIS+ depend heavily on RPC. Consider Weise Venema''s portmapper,
    which brings tcpwrapper-like functionality to RPC. Another option is ipfilter,
    by functioning as a kernel-level packet filter, can significantly restrict access
    to RPC services.


    +   - Use SecureRPC, which relies on DES keys to encrypt and authenticate transactions.


    +   - NIS+ servers should run at Security Level 2, except under rare circumstances.
    At Security Level 2, full authentication and access-checking is enabled, using
    DES auth and encryption.


    Security principles for both NIS and NIS+ boil down to: trust single machines
    rather entire networks, keep regular users away from the information stores, authenticate
    access to information stores with SecureRPC, and use firewalls, ipfilter, or portmapper
    replacements to control who accesses your services.'
