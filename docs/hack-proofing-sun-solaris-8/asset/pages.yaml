- pgno: 178
  md: '# Summary


    In this chapter, we have covered some of the finer points of security as it applies
    to the Solaris file system. We have looked at access control, using both access
    control lists and Role Based Access Control. We learned how RBAC can allow users
    access to administrative functions without having the root password. We also learned
    how to apply ACLs to sensitive files and how ACLs can allow files to be accessed
    in a much more secure and finer-grained method than the normal System V file system
    would allow.


    We investigated ways to further secure the Solaris system by altering some of
    the default settings, including the ways that local file systems are mounted.
    We tightened system security further by ensuring that some unused daemons and
    applications are not started at system initialization, and we added some logging
    capacity. We also made the system harder to brute force by restricting retries
    by login and alerting to us when the threshold is reached.


    We also looked at NFS and some of the pitfalls this protocol opens up for us.
    We found that by default, the permissions on a shared file system or directory
    are very lax, and demonstrated some ways to make exports a tighter. We also learned
    how to use Secure NFS to provide encrypted authentication, possibly preventing
    some attacks such as file-stealing.


    We learned about setting up an anonymous FTP server to allow the environment to
    be booted, thus ensuring a greater level of security. We also learned about the
    importance of patching this commonly \u003 vulnerable service. We took a peek
    at some of the options of Samba configuration and some of its weaknesses.


    Hopefully, after you read this chapter and applying some new tricks, your system
    will be more secure. But it will not be completely secure. It will never be completely
    secure. Security is a moving target. Don''t let any sense of accomplishment, even
    a justified sense, cause you to let down your guard.


    # Solutions Fast Track


    # Establishing Permissions and Ownership


    +   - Be very wary of SUID/SGID binaries.

    - Use ACLs on all binaries left SUID/SGID after your audit.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_178_0.png)'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Securing Files • Chapter 5


    +   - Consider the use of Role Based Access Control to allow limited access to
    privileged commands.


    +   - Consider the use of FixModes to assist you in the correction of base permissions.


    # Using NFS


    +   - Be very cautious about the file systems or directories that you share.


    +   - Share read-only files whenever possible.


    +   - When mounting file systems, mount them NOSUID to ensure greater security.


    # Locking Down FTP Services


    +   - Seriously evaluate your need to run FTP services.


    +   - Apply all vendor patches and test that vulnerabilities do not exist.


    +   - Run anonymous FTP services only in a chrooted environment; verify that you
    cannot break out of the jail.


    +   - If you allow download only, verify that you cannot create files on the server
    as an FTP user.


    # Using Samba


    +   - Never use equiv or rhosts authentication.


    +   - Always define each user''s home share explicitly, and use access control
    wherever possible.


    +   - Be wary of any directive that allows program execution with root privilege.


    +   - Protect your smbpasswd file as carefully as you would your /etc/shadow file.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Monitoring and Auditing File Systems


    +   Be aware of your installed baseline. Be sure to take a snapshot of the system
    immediately after installation and configuration. Keep this snapshot well protected.


    +   If you opt to BSM auditing, be sure that you use some sort of log reduction
    system. Audit logs can fill very fast and clog the system if left unchecked.


    +   Also with BSM, remember to configure the audited events and monitor them for
    applicability. This setting is one that might require tuning!


    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. You
    have your questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    Q: You mention the risks of SUID binaries. I have heard of buffer overflows, aren’t
    these very difficult to exploit? Don’t they require special programming knowledge?


    A: The answer is no. With the explosive growth of the Internet, both the knowledge
    and the tools needed to exploit these vulnerabilities are commonly available.
    No special programming knowledge is required to use a tool that someone has made
    available, and these tools are easily gained.


    Q: I am logging so much stuff, how can I keep up with it all?


    A: This is quite a daunting task Audit data can quickly grow and become unmanageable
    by a human. For this very reason, there are algorithms to read and interpret your
    log data and provide useful, concise reports. Some even monitor these logs and
    provide a limited alerting capability.


    Q: I am responsible for a lot of systems, and I don’t have the time to go through
    all the hardening process. Is there any automated way to help me with this task?


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_180_0.png)'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'A: Yes. First, Solaris ships with the ASET tool, which can be very handy in
    evaluating overall security. Second, several open-source tools do a great job
    at helping secure the system. Two favorites are YASSP and Titan.


    Q: You mention that the Samba daemon is vulnerable, no matter how securely it
    is configured. Is there a way to mitigate this vulnerability?


    A: Depending on your needs, yes. If you are using the Samba service continually
    to mount users'' home files, for example, you might have no choice but to leave
    the daemon running. If, however, you use the Samba service for something like
    nightly batch uploads, I highly recommend starting and stopping the Samba daemons
    from cron, so that the period of vulnerability is lessened.'
  merge: -1
