    # ## Using Shell Scripts to Alert Systems Administrators


    The wide selection of free, open-source, or commercial security software is lagging.
    No matter what your need, you will find an application or 12 that will do the
    job. But do you need to find such an application? This section discusses some
    examples of scripts that will monitor for unusual activity and alert you if such
    activity occurs.


    We''ll call our homemade script monitor.sh. It will contain the commands we want
    to run on a regular basis via cron to make sure all is well on our system, which
    is named chevron1.


    The first step is to decide what we want to monitor. There are hundreds of different
    things we could be monitoring for on a running Solaris system. We cover a few
    in this section, but this is by no means a complete list. We examples presented
    here as a way to look at methods of customizing scripts in your environment to
    meet your specific security needs.


    # ## Monitoring Running Processes


    One of hacker''s techniques is to leave behind software to collect information
    as passwords or to record keystroke. Once we have a benchmark of the usual number
    of processes running on our system, we can monitor for any unusual increase in
    that number. The key is to get a realistic benchmark by checking at different
    times under normal working conditions and setting the alert levels accordingly.


    To get the ps number of processes, we use the ps command:


    ```

    chevron1: # ps -ef | wc -l

    ```


    Here we see that the root user has determined that there are 159 processes running
    on the system chevron1. By running this command at different


