    # # Documenting System Configurations


    Some telltale signs of unusual activity on your Solaris system are sudden, unexplained
    increases in resource utilization. For example, if an intruder is attempting to
    compile additional hacking tools, the use of the compiler will drastically increase
    CPU utilization for the duration of that process. If those tools are complex,
    by the vulnerability assessment tool Nessus, the compile time duration may be
    significantly long to warrant investigation. Clearly, not all increases in resource
    utilization are the result of system intruders, but they may still warrant investigation.


    When investigating mysterious spikes in resource utilization, it''s important
    to have baseline data for comparison. Your baseline data should also be somewhat
    dynamic, which is to say what is happening on your Solaris today is probably somewhat
    different from what the system was doing a year or two ago. Baseline data should
    be recaptured at periodic intervals appropriate for your site, especially when
    systems take on extended functionality as adding another network service.


    # # Documenting Disk Usage Information


    Free space is an important asset on your Solaris system. Intruders may attempt
    to subvert your resource by turning your Solaris system into a server for pirated
    music and software at your expense. Not only is your organization liable for this
    unauthorized distribution, but it also costs your organization money: bandwidth
    is-free, and once the intruder distributes connection to your server, the server''s
    bandwidth is likely to be throttled, preventing your employees and partners from
    accessing your systems for production use.


    Attackers may fill up your free disk space as a mean of denial of service. For
    example, some intruders may attempt to cover their tracks by filling your /var
    file system with bogus information. Once /var is full no more logs can be written,
    and the attacker can do whatever he wishes without fear of his attacks being logged.
    For all of these reasons, it''s important to keep tabs on the usage of each of
    your server''s file systems.


    Your primary tool for tracking disk capacity is the df command, which was designed
    for exactly purpose. By default, the df command will list the free, used and total
    blocks on all mounted file systems. For this reason, the -k switch is most often
    used in conjunction with the df command to display free, used and total space
    in kilobytes instead of blocks. If you are only interested in a particular file
    system, you can also specify that file system in the command. For example,


