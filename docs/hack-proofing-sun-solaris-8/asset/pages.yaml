  md: '# Providing Secure Web and Mail Services Chapter 7 21


    offenders. When sendmail starts to accept a message, it performs a check against
    the RBL on the IP address of the sending domain or server. If there is a match
    in the RBL, the e-mail is rejected. Otherwise, the message is passed to the other
    parts of the sendmail routers that handle anti-spam for continued processing.
    A misconfigured system can end up in the RBL list, so there are times when a legitimate
    organization will not be able to send e-mail. For example, suppose our partner
    company, Nox has a domain called no.net. The mailhost for nox.net. An zealous
    admin misconfigured an older version of sendmail and now the system is an open
    relay. One moment our server at incoming-traveller.com will accept e-mail from
    mailer.nox.net A few hours or days later when mail.nox.net ends in the RBL, mailhost.incoming-traveller.com
    will stop accepting mail from our partner company. If Nox is responsible, they
    will fix the problem shortly after (or someone else) notifies them, and they can
    easily get out of the RBL. However, the loss in e-mail connectivity may be too
    great a price to pay for this type of extensive protection. You will have to make
    this decision based on your overall business needs and objectives.


    The last lines just tell sendmail, by way of the generated sendmail.cf file, to
    use the local and smtp mailers to handle e-mail traffic for local and remote destinations.


    The meat of this sendmail.cf file is the access_db feature. Once you generate
    the sendmail.cf file with m4 (included with Solaris 8 in the Developer installation
    cluster), your sendmail.cf file will report an entry like this:


    ```

    # Access list database (for spam stomping)

    Kaccess db -o /etc/mail/access

    ```


    Now, you need to build the access database itself. First, we will start by generating
    a text file with a list of addresses and domains that we want to block e-mail
    from, and then we will blacklist a couple of our local usernames, just in case.


    ```

    # block these domains outright

    spammer@foo.com         REJECT

    badspammer.com         REJECT

    63.206.177             REJECT

    ```


    ```

    # forbid incoming e-mail to these addresses

    ```


    ```

    root@incoming-traveller.com     ERROR:550 Mailbox closed.

    ```


