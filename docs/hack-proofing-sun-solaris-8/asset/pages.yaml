- pgno: 145
  md: 'This is an excellent example of a case where misuse or accidental use of the
    control could cause serious problems. Simply changing “requisite” to “sufficient”
    would allow any user in group root to so without requiring a password at all.


    The next example will show how to disable hosts.equiv and hosts files entirely.
    These mechanisms were originally seen as a convenience, but they are now recognized
    as posing an unnecessary risk to the network. Additionally, in the event of an
    intrusion, they greatly increase the risk of spread (the ability of the attacker
    to jump from host to host). A better choice for single-sign-on or no-password
    access between systems is something that performs strong host and user authentication,
    like Kerberos or SSH.


    For the final example, let''s say you installed the latest IMAP server from the
    University of Washington. It is PAM-aware, supports SSL-encrypted connections,
    and handles a variety of mailbox formats. If compiled to support PAM, it is easy
    to substitute authentication methods. Suppose your users don''t have access to
    SSL-capable mail clients, so you''ve issued them SecurID tokens for all such remote,
    cleartext accesses to the network. You don''t want them to use their UNIX passwords
    for IMAP. Further, only those users with valid shells should be allowed access.


    An entry at the top of the pam.conf will cause IMAP to check /etc/shells and require
    SecurID instead of UNIX passwords:


    ```

    imap auth requisite

    /usr/lib/security/pam_shells.so.1\imap auth required

    /usr/lib/security/pam_securid.so.1

    ```


    Anyone who has an invalid shell or is unable to present a valid SecurID PIN and
    tokencode will be rejected by the IMAP server.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Summary


    Reliable authentication methods and policies are at the heart of any secure system.
    Solaris provides many tools for improving authentication security and flexibility.
    It allows for a wide range of configurations to support su-only accounts, password
    expiration, password strength restrictions. Role based access control (RBAC) allows
    systems administrators to define specific tasks and delegate them in a secure
    manager, without the need to provide full-blown root access. NIS and NIS+ allow
    systems to participate as clients or servers in heterogeneous UNIX networks, providing
    a secure authentication framework. With the development of the Sun Enterprise
    Authentication Mechanism, simple reliable Kerberos deployments become possible.
    With Kerberos services like login and Telnet—normally among the larger security
    holes in any network—can be strongly authenticated and reliably secured. Finally,
    Pluggable Authentication Modules (PAM) allow systems administrators to select
    the authentication and authorization framework that best suits their environment.
    No longer tied to username/password pairs stored locally on the system, PAM allows
    for easy migration to Kerberos, one-time password systems, or simple integration
    with alternate authentication frameworks like SMB.


    # Solutions Fast Track


    # Creating Secure Group Memberships


    +   - Solaris provides several groups at installation time. Most are reserved
    for system utilities and daemon processes. The sysadmin group allows access to
    Admintool. Generally, GIDs less than 100 are reserved for default groups, as are
    GIDs over 60,000. Be aware that Admintool assigns a default group of 0, which
    is a security risk.

    - Each user is a member of one primary group and no more than 16 secondary groups.

    - Roles-based Access Control (RBAC) is a new addition to Solaris 8. It allows
    systems administrators to delegate certain tasks to individuals or groups that
    were formerly reserved for the root user. RBAC attempts to address the all-or-nothing
    privilege set normally found on UNIX systems by providing a means to define new
    roles, delegate these roles to users or groups, and easily revoke such permissions.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Understanding Solaris User Authentication


    +   * The three files in /etc/default, passwd, swd, and login, control account
    and login policies. There, systems administrators can set default umasks, paths,
    password length restrictions, and password expiration periods.


    +   * Solaris uses the /etc/n.conf file to determine the order in which information
    services such as flat files, NIS, or NIS+ are searched for authentication data.


    # Authenticating Users with NIS and NIS+


    +   * Distributed authentication systems demand a best practices of security,
    rather than a point-by-point review of weaknesses and solutions.


    +   * The ideal network for distributed network databases is controlled entirely
    by a single group of administrators. Users are not allowed to run their own machines
    on the secure network, nor are NIS or NIS+ provided to such machines.


    +   * Using SecureRPC to authenticate and encrypt RPC transactions.


    +   * If SecureRPC is unavailable or unmanageable, consider using ipfilter or
    a portmapper replacement to prevent unauthorized access to RPC services.


    +   * Keep UID 0 accounts local and rigidly protected. Root and root-like accounts
    should never be in NIS.


    # Authenticating Users with Kerberos


    +   * Kerberos is an authentication system that relies on mutual trust of a third
    party, called the Key Distribution Center (KDC). The basic tenant of Kerberos
    is that the Kerberos principal, or password, never travels on the network, even
    in encrypted form.


    +   * Kerberos Ticket Granting Tickets (TGTs) are held by the workstation in a
    file called the credentials cache. These tickets have configurable validity periods.
    As long as a TGT is valid, the user will not have to enter a password to connect
    to Kerberized services. This feature is called single-signon.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_147_0.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Chapter 4 · Securing Your Users


    +   - By allowing the secure exchange of a secret key between the KDC, a service,
    and the user, Kerberos makes encrypted versions of common applications like login,
    rsh, and Telnet possible.


    +   - The lack of Kerberized clients for the PC and Macintosh platforms, particularly
    over e-mail software, hinders its effective deployment at most sites.


    +   - A PAM-authenticated login, or /usr/krb5/bin/kinit, creates a credentials
    cache. From then on, for the validity period of the cache, at all times the Kerberos
    login, rsh, rcp, and Telnet commands will not require a password. The use of the
    -x option can force these commands to create an encrypted channel.


    +   - At logout, /usr/krb5/bin/kdestroy should be used to remove existing credentials
    caches. This prevents an attacker from potentially using a still valid ticket
    to masquerade as another user.


    # Authenticating Users with the Pluggable Authentication Modules


    +   - PAM provides a flexible, interchangeable authentication mechanism. PAM can
    control all aspects of user accounts, from authentication to session and password
    management. PAM modules are stackable in that modules can be executed in any order,
    with some required at all times and some sufficient, to achieve different security
    strategies.


    +   - Various PAM configurations can allow access to certain administrative functions
    by group membership.


    +   - Some services can require different authentication methods, like SecurID
    or Radius, without affecting other services, simply by changing the pam.conf.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_148_0.png)'
