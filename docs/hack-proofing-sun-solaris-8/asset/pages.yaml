    open-source solutions available over the Internet. These solutions range from
    “legitimate,” controlled sources such as the OpenBSD group discussed earlier to
    homegrown scripts written out of the garage of Joe Unix. The Internet has opened
    the world of published information to anyone who can put together a Web page.
    Unfortunately, in the world of the Internet, the rule of the day is caveat emptor:
    let the buyer beware! This is particularly true when you get scripts or executables
    from sources that are collectives of users. Many of these sites, such as www.sunhelp.org
    or www.solariscentral.org, are excellent sites for technical information that
    you might not be able to find elsewhere. Certainly, you can find things out at
    such sites that Sun will never tell you in its documentation. The practical experience
    available at such sites and the Usenet groups relating to Solaris, the system
    administrator should never implement any executable or script on his system without
    first understanding exactly what it does, down the point of examining the source
    code. There are exceptions to this very basic rule, such as the OpenSSH download
    from the Sun Web site, but when security is involved, it is prudent to take no
    chances!


