  md: "Securing Solaris Freeware Security Tools • Chapter 3\n\n# # Detecting Vulnerabilities\n\
    \ Portscanning\n\nThe typical Solaris installation comes with a few active ports.\
    \ Perhaps the two most notorious of these ports, at least in recent times, RPC-based\
    \ ports for sacmind, the default administration daemon, and the portmapper for\
    \ RPC services, rpcbind. Somewhat seemingly benign ports are also open by default\
    \ on Solaris, such as telnet, FTP, finger, the r-command ports, and numerous other\
    \ RPC-based services, obtained via the portmapper, such as rpc.spray, rpc.wald\
    \ and others.\n\nThe telnet port may be disabled, especially if you install a\
    \ Secure Shell (SSH) server. SSH provides a much more secure means of pseudo-terminal\
    \ access to remote systems by encrypting the data. Telnet itself is the most vulnerable\
    \ since all transmitted data is sent in cleartext. Passwords and other critical\
    \ information may easily be snooped from network level sessions. The FTP protocol\
    \ represents a vulnerability, mainly from buffer overflows or misconfiguration.\
    \ If the service is not needed, simply disable it. If you install SSH, there is\
    \ no reason to keep the r-command services running. Since these commands rely\
    \ on minimal host or user-based authentication, and provide no encryption, you\
    \ are better off removing them from the start. The finger service is useful for\
    \ both legitimate and illegitimate purposes, this active service is a matter of\
    \ judgment. Generally, on a firewalled network with properly configured systems,\
    \ I will leave finger enabled, as it tends to be very useful and of the actual\
    \ exploitable bugs have long been fixed.\n\nThe RPC-based services are also, a\
    \ judgment call. If you need the services offered (calender, tooltalk, NFS, and\
    \ so on), you will need to check your configurations and settings and be sure\
    \ that the services are configured with maximum security. If you do not need them,\
    \ simply comment them out from /etc/inetd.conf or prevent them from starting up\
    \ in the run control scripts on your system.\n\nTo see what ports, and consequently\
    \ which services, are available to the outside world, you should obtain a copy\
    \ of the portscanner Nmap, which stands for Network Mapper. This software is easily\
    \ available in many places and generally in two forms: a source-code only copy\
    \ may be found at www.insecure.com, and a pre-compiled Solaris binary may be obtained\
    \ from www.sunfreware.com. Let's take a brief tour of Nmap.\n\n![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_95_0.png)"
