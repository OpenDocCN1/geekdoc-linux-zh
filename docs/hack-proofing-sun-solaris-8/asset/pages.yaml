- pgno: 274
  md: '# Configuring Solaris as a Secure Gateway


    In this section we have talked about Solaris as a router between different networks.
    Solaris is capable of functioning as a gateway as well. In implementation, there
    is little difference between the two functions. The main difference is in their
    placement on networks and the way in which they interact with hosts.


    A gateway is a system that connects two or more segments of the same network via
    two or more interfaces. The reasons for this configuration are typically situations
    such as dial up users who need dedicated connections or segments of the same network
    that are divided by some physical obstacle in which an additional outbound link
    to the Internet either isn''t needed or isn''t wanted.


    Solaris is suited for this type of use. As mentioned previously, a default installation
    of Solaris will work for this purpose. The only requirement for a Solaris gateway
    is two or more interfaces, and the system will automatically configure itself
    to pass traffic between the two networks. By observing our discussion about minimalism,
    it''s possible to create a system that, in most cases, provide secure, reliable
    service.


    One configuration difference we should mention is the changing of the IP kernel
    module variables. In our previous discussion, we recommended the disabling of
    the ip_forward_directed_broadcasts and the ip_forward_src_routed variables. In
    a gateway environment which systems are on the same subnet, we do not want to
    disable these options. These options, in a gateway situation, are helpful in terms
    of network management. A correctly designed network will not let broadcast into
    or out of the subnet.


    # Configuring Solaris as a Firewall


    We''ve talked about Solaris as both a router and a gateway. Implementations of
    such systems using Solaris are reliable, stable, and secure. However, using Solaris
    in such an environment has many drawbacks in terms of security. Unlike hardware-solutions,
    Solaris offers nothing in terms of network access control in a stock install.


    In the interest of providing a more secure network, in this section we discuss
    various methods and packages available for providing firewall services to networks
    and systems. The benefit of doing so lies in allowing us to control the traffic
    that flows from one side of our router to the other. We also discuss design of
    networks using these packages and deployment of the systems. Additionally, we
    discuss the benefits and the drawbacks of using such systems.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Configuring Solaris as a Secure Router and Firewall · Chapter 8


    There are many free commercial implementations of firewalls that run on Solaris,
    Gauntlet and Firewall-1 are two examples. Additionally, free firewall packages
    using Sun''s SunScreen Lite and IP Filter by Darren Reed are available. We focus
    our discussion on SunScreen Lite and IP Filter.


    # General Firewall Theory


    What is the idea behind a firewall? The concept, in basic terms, is to keep the
    bad guys out while letting the good guys continue to have access to the outside
    (or at least the things that they are allowed to access on) and letting in the
    people that need access. Although this sounds easy enough at first blush, implementing
    a firewall system is far more complicated in reality.


    Most enterprises use multiple layers of firewalls to accomplish their mission.
    This multilayering has the benefit of distributing the load of access control,
    which prevents any one system from becoming a bottleneck. also has the benefit
    of providing several layers of access control before reaching the final destination.
    The overall benefit is that network security and performance are enhanced.


    There are also drawbacks to this design. One drawback is that it creates multiple
    systems to maintain. This can result in additional labor expenditure and more
    hours than. Another drawback to this design is the added complexity of multiple
    firewall rules set. One change on any of the systems can easily result in a network
    nightmare.


    So what is the best solution? Opinions vary, and the armies of the "bigger firewalls"
    and the "more firewalls" continue to wage war over this issue. My suggestion is
    to create an infrastructure that meets your business needs, provides security
    to hosts on the network, and does not restrict user access to the point of being
    unusable. The key to providing network security is continuous planning.


    Deploying security infrastructure is not a silver bullet, nor it is a permanent
    fix. You will continually discover problems with software; operating systems,
    applications, even firewall packages themselves are affected and in need of update.
    Additionally, network needs and sizes change. What works for your network today
    could be a burden on the network tomorrow. It is essential that you continually
    monitor the security infrastructure placed on a network for performance and security.


    It is impossible to dictate in this book the best firewall design for a network.
    All networks have their own sets of needs and requirements. In the next section,
    we discuss general firewall design. We approach this topic from an objective standpoint
    and mention only the concepts we can apply to all networks.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_275_0.png)'
