    # Tools & Traps...


    # Solaris Password Facts: How a Password Is Made


    Under UNIX systems like Solaris, a password has a maximum length of eight characters.
    The password selected by the user is converted into a 56-bit value (using 7-bit
    ASCII) which then serves as the input into an encryption function known as crypt().
    The crypt() function is based on a modified encryption standard (DES) algorithm
    using a 12-bit salt value. The salt is a two-character string chosen from the
    set [a-zA-Z0-9-/] and is typically related to the time at which the password is
    assigned by the user. The modified algorithm uses the user-input password and
    the salt value on a 64-bit block of zeros. The output of this encryption is then
    used as input for a second round of encryption using the password and the salt
    value. This process is repeated 25 times with the final 64-bit output translated
    into an 11-character sequence which is then stored, with a plaintext copy of the
    salt, in the /etc/shadow file. This encryption procedure is a one-way function.
    It is not possible to take an encrypted password and decrypt it. When a user logs
    in and inputs his password into the system, the login program looks up the salt
    in the shadow file, performs the encryption function using the user-password,
    and compares the output to the stored hash in the shadow file. If they match,
    the user is authenticated. If not, the user is denied access.


    The password/shadow file information is obtained, the attacker can transfer the
    files to his own machine and run a password-cracking program as Crack or John
    the Ripper at his leisure. In the strictest sense, password cracking programs
    do not actually crack passwords—rather, they try to find the password which, when
    provided as input into the crypt() routine along with the proper salt, will encode
    a 64-bit block of zeros into a string that matches the entry found in the shadow
    file. Basically, the cracking program reads a password from the dictionary, reads
    the salt from the shadow file, and uses both as input


