- pgno: 266
  md: '# nsswitch.conf File


    As mentioned previously, the nsswitch.conf files in /etc references local files
    by default. These files are /etc/inet/hosts for IPv4 and /etc/inet/ipnodes for
    IPv6. If our systems are on a network that supports IPv6, we might want to change
    the entries in nsswitch.conf to use DNS.


    Enabling DNS can do two things on our network. If it is properly configured, it
    can make our network easier to maintain and smoother running. If we''ve configured
    it incorrectly, it can create all kinds of headaches, mysterious problems, and,
    perhaps, security issues.


    In order for DNS to work with an IPv6 network, we need a DNS server that is IPv6
    compatible. Currently, the only name service daemon available with IPv6 support
    is the Berkeley Internet Name Daemon (BIND).The series 9 BIND is currently the
    only version with IPv6 support. If we are going to use DNS with the IPv6 network,
    we should migrate to BIND9. The current implementation included in Solaris 8 is
    version 8.1.2.


    # IPv6 Programs


    In this section, we talk about the programs necessary for IPv6 to function. We
    look at programs that have been designed specifically for IPv6 and their role
    in ensuring that the network operates smoothly.We also look at programs that have
    been adapted for the coming of IPv6 in the Solaris operating system and speak
    briefly about their new features.


    # The in.ndpd Program


    The in.ndpd program is the Neighbor Discovery Protocol Daemon. This program is
    responsible for the majority of the operations on an IPv6 network in terms of
    configuration, routing information, and IP addressing. We mentioned the configuration
    file previously; now we talk specifically about the daemon.


    The in.ndpd program is started in the S69inet file when the system enters run-level
    2.Script executes a test to determine whether or not the /etc/inet/ndpd.conf script
    exists. Figure 8.5 contains the code from the S69inet script that determines the
    system is a router if the ndpd.conf file is found.


    If this test returns true, the variables ip6_forwarding, ip6_send_redirects, and
    ip6_ignore_redirect are set to 1. The daemon is launched in router mode, and the
    inrip6 program is started. For the test the configuration file fails, the previously
    mentioned variables are set to 0, and the in.ndpd program is launched in host
    mode.'
  merge: -1
  img_proc: true
