    # # Summary


    Nmap and Sudo are key to securing a system and keeping it secure. One could look
    at Nmap as a means of protecting a Solaris 8 system from itself, and Sudo as a
    way of protecting a Solaris 8 system from users with a legitimate need for root
    access. As we looked at portscanning, we saw that a freshly installed Solaris
    8 system leaves quite a few ports and related vulnerabilities for the world to
    see. By proactively securing your networks and systems, you can not only fix problems
    before they occur, you can also detect unwanted systems on your wire. While Snoop
    and reap are useful for capturing network traffic and verifying IP to MAC mappings
    on a short-term basis, a true IDS should be used for constant monitoring. If your
    budget and environment permit, a dedicated sniffer is the best solution when secured
    properly and utilized in the right place within your network infrastructure. We
    even touched on how the truly stealth administrator can make his sniffer system
    disappear from the network with a customized network drop cable.


    Vigilance among your users and administrators is equally important. Sudo provides
    a smooth and seamless means of allowing limited super-user access, without the
    need to share root or other key system passwords among a large group of people.
    Bear in mind that all of the tools presented here share one common facet—configuration.
    As powerful as they are, you should read all the documentation and understand
    all the limitations of the tools you decide to implement. In most standard configurations
    these tools are very useful, but a little effort spent on customization and tuning
    will yield superior benefits for these tools. You should also subscribe yourself
    to the support and discussion email lists for they can be an invaluable source
    of support when you encounter the unexpected, such as a bug or other unusual program
    behavior. I recommend that you lurk, or participate in the list in read-only mode
    for a few days or weeks to get a feel for the general community the list provides.
    Then, introduce yourself and have at it. In the end, all the effort and energy
    spent in securing your systems will pay off for you, your superiors and your company.


    www.synergy.com'
