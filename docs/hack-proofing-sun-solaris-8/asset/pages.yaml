- pgno: 276
  md: '# General Firewall Design


    Each firewall differs in configuration commands, administrative interfaces, and
    various features. All firewalls, however, are designed to do basically the same
    thing, which is filter traffic. The two types of firewalls available are stateless
    and stateful. Let''s take a closer look at these two terms.


    Stateless firewalls are designed to enforce firewall rule sets, without keeping
    track of traffic. These types of firewalls are generally referred to as packet
    filters. In this type of firewall, there is no tracking of connection activity,
    or the “state” of connections. Stateless firewalls are comparable to software
    packages such as TCP Wrappers except that they work on a broader range of services
    and ports. Stateful firewalls are, in most cases, easily bypassed.


    Stateful firewalls are designed to enforce firewall rule sets and keep track of
    connections to and from the system. Unlike packet filters, these firewalls watch
    the state of connections between hosts and permit further connectivity based on
    the state of current connections. This type of firewall is more granular and configurable
    than that of stateless variety and offers more security.


    Previously, we mentioned that it is impossible to dictate in this text the firewall
    rules for a network. No noble truth has not changed. However, we can establish
    some guidelines that can be generally applied to any network. Let’s gather some
    of these extrapolations into a list:


    +   Use layers of access control. This means filtering untrusted traffic from
    the border routers of the network, all the way to the firewall. This method has
    two benefits. The first is that a connection is scrutinizedized at multiple places
    on the network. The second is that it distributes the load of access control,
    preventing any one system from becoming a bottleneck as decisions are made about
    traffic.


    +   Block all unnecessary traffic. A firewall should be implemented to block everything
    unless otherwise specified. This means blocking everything that is not mission
    critical. E-mail, for instance, is mission critical. Any services that are required
    should be passed through a proxy, if possible. This is not possible on every network,
    but the closer we get to this type of implementation, the better. This system
    has the benefit of restricting access from not only the outside, where an attacker
    can get into our network, but also from the inside, where an unwitting user could
    execute a Trojan horse program that connects to hosts across'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Configuring Solaris as a Secure Router and Firewall • Chapter 8


    Internet gives an intruder the ability to execute commands on the system locally.


    +   Use stateful rules. Having a stateful firewall can greatly enhance network
    security. However, a stateful firewall does us good if we do not use the state
    connection inspection features. When implementing, ensure that they check the
    state of connections.


    It is outside the scope of this book to address network issues such as private
    networks and the demilitarized zone, but it is worth noting that these concepts
    can be applied to networks of any type.


    Let''s move on and talk about some of the tools necessary to get the job done.
    Many firewall implementations are available for Solaris in the commercial area,
    such as Gauntlet and Check Point Firewall-I. We discuss only the freely available
    tools. We will not dig deeply into the use of these tools but mention them as
    part of the decision-making process in further securing your network.


    # SunScreen Lite


    SunScreen Lite is a free version of the SunScreen Secure Net firewall package.
    SunScreen Lite is designed to operate in routing mode. This means that the filter
    only filters traffic that the Solaris router is routing. This is perfect for our
    needs. Sun Lite can be used in VPNs and supports Simple Key Management for Internet
    Protocol (SKIP).


    Some drawbacks are associated with this package as well. First, it has a number
    of package dependency issues that could require the addition of packages, depending
    on how your system was designed. Next, it will not support high-availability clustering.
    This means that a SunScreen packet filter is a single point of failure. In a situation
    in which the system fails for one reason or another, the entire network screened
    by the firewall becomes unavailable.


    Another drawback is that if we decide to use some services from the confines of
    a draconian network and those services require a proxy to communicate with the
    outside network, we can''t use Sun Lite. This could limit the use of some application
    proxies.


    Finally, Sun Lite is limited in the number of interfaces supported and in the
    number of IP addresses that can be used for Network Address Translation (NAT).
    The package supports a maximum of two interfaces on a system. This is undesirable
    if we would like to place our systems on a private network and allow only certain
    traffic from the outside to a predetermined IP address to reach the'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Chapter 8 Configuring Solaris as a Secure Router and Firewall


    port of a system inside the private network. SunScreen Lite supports only 10 private
    address and two NAT rules. Additionally, SunScreen Lite has no IPv6 support.


    The commercial SunScreen package supports all these features. Additionally, it
    provides some advanced features such as stateful firewall, multiple interfaces,
    and time-based access control. If the constraints of this product do not prohibit
    its use on your network, SunScreen Lite might be your best option. SunScreen is
    available from Sun Download Center. Documentation regarding the installation and
    administration of SunScreen is also freely available from Sun.


    # IP Filter


    The IP Filter package is one of the older firewall implementations available on
    the Internet, originally released in 1993. Written by Darren Reed, the program
    remains popular as a stateful firewall for UNIX hosts. It is freely available,
    opensource. It can be implemented both as a network firewall and host-based firewall.
    It supports both IPv4 and IPv6 networks.


    The IP Filter site is http://coombs.anu.edu.au/ipfilter/index.html. There is documentation
    in the form of FAQs linked on the site. Two other documents about IP Filter are
    a two-part document written by Jeremy Rauch in July 2000, “Introduction to IP
    Filter,” and one written by Kristy Westphal, “Solaris and IP Filter: How to Make
    Your NAT Solution,” both available via SecurityFocus at www.securityfocus.com.


    With the many benefits of IP Filter, it suffers the same high-availability problems
    as SunScreen. There is no high availability, so the software introduces a single
    point of failure into the network. Additionally, IP Filter is not cryptographically
    aware. The latter issue is more easily solved than the former, but is something
    to take into account in the decision process.


    # Using NAT


    Another method that can be used to secure traffic is placing information systems
    on a private network and using Network Address Translation (NAT). NAT is defined
    in RFC 3022. The term *private* means that the addresses contained within the
    network are not routable over the Internet. Systems on the network managed by
    the router pass traffic out through the router, which performs the translation
    to make the packets appear as though they originated at the router.


    The systems behind the NAT router are not directly accessible from the router’s
    outside interface. Therefore, users outside the local network cannot access systems
    beyond the NAT router unless a specific port on the NAT router


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_278_0.png)'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Configuring Solaris as a Secure Router and Firewall • Chapter 8


    has been mapped to a specific port on a host or a specific IP address on the NAT
    router has been mapped to a specific IP address on the private network. This restriction
    provides the network with a limited amount of security.


    Solaris 8 does not include utilities to provide NAT infrastructure in the default
    software installation. The previously mentioned firewall packages have all NAT
    capabilities and can be used for this purpose. The drawback of this implementation
    is that by relying solely on NAT and no access control, it is still possible for
    hosts inside the network to communicate with hosts outside, either on a voluntary
    or involuntary basis. As mentioned, an unwitting user who executes a Trojan horse
    program could give a remote attacker access to the system across the NAT router;
    this is just one of many risks. This could result in the attacker compromising
    the system and, potentially, other network resources.


    NAT is, however, an extremely useful infrastructure and the saving grace of networks
    with limited public address space. If NAT is to be used, it is recommended that
    you use the firewall capabilities of the previously mentioned software packages
    to provide a more secure network posture.


    # Guarding Internet Access with Snort


    We have discussed implementing a Solaris 8 router and implementing a Solaris 8
    firewall. But what about monitoring the network for potential intrusions? Once
    the infrastructure is in place, the job does not stop there. It is necessary to
    monitor network traffic and analyze it for potential malicious activity. This
    can be done through network intrusion detection systems, or NIDS. There are numerous
    NIDS available for free or commercially; There is a strong market for intrusion
    detection systems; we focus our attention on Snort.


    Snort is a freely available, open-source intrusion detection system, available
    from www.snort.org. We will not get into the basics of Snort and how it operates,
    because the Snort team has made copious amounts of documentation available through
    its site. Rather, we discuss how Snort affects us in our implementation of Solaris
    routers and firewalls.


    Snort is ideal for performing intrusion detection on such systems. It is capable
    of monitoring a range of IPv4 addresses and multiple interfaces of a system. When
    the system detects a signature that matches one in the Snort database, Snort generates
    an alert to notify the parties responsible for the system’s security. Let’s assume
    that Snort has been installed on the system. Our task is to set up a Snort configuration
    file that will monitor the traffic flowing through our router.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_279_0.png)'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Snort Configuration File


    To get Snort operational, we must first download the latest Snort rule set. This
    can be obtained from the main Snort Web site (www.snort.org). Once we have downloaded
    this package and unpacked it onto our system, we have a directory containing several
    signature files and the particular file of our discussion, snort.conf.


    Prior to configuration, we need a list of the IP addresses we''re going to be
    monitoring. For instructional purposes, we will imagine that the Snort system
    has been installed on a Solaris 8 system with three physical interfaces. The networks
    connected to these interfaces are:


    ```

    hme0 - 192.168.1.2/24

    hme1 - 192.168.2.1/24

    hme2 - 192.168.3.1/24

    ```


    The 192.168.1.2 interface leads to the network router, which in turn goes out
    to the Internet. Now that we have established the IP addresses on the network
    and the networks we would like to monitor, we can begin creating our configuration
    file.


    We place our first two variables in the snort.conf file. It looks like the following:


    ```

    var HOME_NET [192.168.1.2/32,192.168.2.0/24,192.168.3.0/24]

    var EXTERNAL_NET any

    ```


    This code tells Snort that the 192.168.1.2 address and the 192.168.2.0 and 192.168.3.0
    networks are home base. It also tells Snort that any traffic to any hosts on these
    networks is an external host. Although this might sound confusing, the reason
    for doing this is that, if there is an attack from one internal host against another,
    Snort will be able to identify it.


    Next, we configure Snort to identify the various servers on the network. These
    servers include SMTP, SQL, HTTP, and DNS. We configure them as follows:


    ```

    var SMTP_SERVERS [192.168.2.2/32,192.168.3.2/32]

    var HTTP_SERVERS [192.168.2.3/32,192.168.3.3/32]

    var SQL_SERVERS [192.168.2.4/32,192.168.3.4/32]

    var DNS_SERVERS [192.168.2.5/32,192.168.3.5/32]

    ```


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_280_0.png)'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Configuring Solaris as a Secure Router and Firewall · Chapter 8


    This configuration gives Snort an idea of what to expect from these systems. With
    these variables set in the included snort.conf file and Snort starting to read
    the configuration file, Snort should work. The default configuration provides
    comprehensive auditing of network traffic and in most cases pick up known attacks
    or other misbehavior on the network. The output of any IDS events is sent to /var/log/snort.


    One option we might want to enable that is not enabled by default is the portscan-ignorehosts
    option for DNS servers. DNS servers habitually generate false-positive port scans.
    On a busy network, this could result in huge logs of false-positive port scans
    from local name servers. Evaluate this option and see if it is for your network.


    # Snort Log Analysis


    Deploying Snort without auditing the logs daily is comparable to purchasing a
    subscription to the daily paper and never reading it. If you are willing to pay
    the expenditure, you might well benefit from using it. Just as the newspaper costs
    money, Snort costs CPU, RAM, and storage for logs.


    Snort can be configured to log to any one or number of media, such as a plain-text
    file or a SQL database. The output of a Snort plain-text file is easy to read.
    Examine the following entry:


    ```

    [**] [1:0:0] CodeRed Defacement Sent [**]

    08/11-17:10:26.227974 192.168.1.10:4002 -> 192.168.2.30:80

    TCP TLI TTL: 115 TOS: 0x0 ID: 18034 IPLen: 20 DgmLn:115 DF

    ****** Seq: 0x86CCF2D8 Ack: 0xA990F720 Win: 0x44470 TcpLen: 20

    ```


    As we see from the first line, this was an attack by the Code Red worm derivatives.
    On the second line, we see the attack occurred on August 11 at 17:10. The attack
    was launched from host 192.168.1.10 on port 4002 against 192.168.2.30 on port
    80. The third line tells it was a TCP packet that we received, with a time to
    live of 115. The Type Of Service flag was set to 0x0, the ID in the fragment header
    was 18034, the length of the header was 20 bytes, the entire datagram was 1155
    bytes, and the Do Not Fragment flag was set. On the fourth line, we see the ACK
    and PSH flags were set, Number was 0x86CCF2D8, the Acknowledgement Number was
    0xA990F720, the Window Size was 0x44470, and finally, the TCP header length was
    20.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'All these variables, including the content of the packet, are taken into account
    when Snort audits a packet while it is in transit. By knowing what these variables
    mean, we can understand what Snort is alerting us to when it logs an event.


    What options does this leave us with? We could contact the user''s provider, depending
    on the offense. We could have our logs managed by one of the online log analysis
    facilities. Or we could just ignore it. The decision is strictly subjective and
    should be made in accordance with your business needs and site security policy.'
  merge: -1
