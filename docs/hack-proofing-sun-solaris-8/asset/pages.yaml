    # In Squid 2.4—Help for IE Users!


    Prior to version 2.3, Squid had problems with Internet Explorer. The developers
    received that several earlier versions of IE failed to send a Pragma-No-Cache
    header if the user asked to refresh a Web page. Without realizing the freeze of
    the page had been requested, the proxy would deliver stale content from the cache.
    Squid 2.4 added a feature to deal with this. It recognizes IE by its User-Agent
    string, and if two successive requests for the same page arrive within a period
    of time, it will flush the stale page from the cache and retrieve a new copy directly
    from the Internet site. This is not a security issue, but awareness of this configuration
    option may prevent phone calls from irate users who cannot load refreshed Web
    content. To enable this feature, add the following line to your squid:


    ```

    ie_refresh on

    ```


    We have covered the basic configuration steps necessary to secure your proxy.
    The next section will discuss more elaborate access control and authentication.


    # Configuring Access to Squid Services


    Simply allowing access to your Squid proxy from a handful of trusted IP addresses
    may not be enough. For some sites, authentication on a user-by-user basis is necessary.
    Perhaps there are only some employees who should be using the Web for work-related
    matters, or perhaps some have unrestricted access while others only reach sites
    related to their job. Squid contains access control features enough to handle
    any circumstance.


    # The Basics of Basic-Auth


    Squid supports a variety of authentication frameworks. The most basic authentication,
    NCSA, works like HTTP basic authentication of the type you get from an .htaccess
    file. The client is prompted for a username and password, these are compared to
    a local password file stored on the Squid server, and is granted or denied accordingly.
    In addition, Squid can authenticate via Lightweight'
