    yourself honeypot. The advantages vary depending on the application, but if you''re
    not comfortable with a full, home-grown honeypot and want the benefits of a tested
    application, you''ll want to investigate an off-the-shelf product.


    # NetFacade


    GTE Technology, now owned by Verizon, makes this handy application. NetFacade
    is unique in that it simulates a network of up to 255 systems and emulates the
    services of systems running Windows NT, Irix, Linux, and even Cisco''s IOS. The
    installation process will automate the naming of systems on your fake network
    as well the services each system is running. It also has the handy ability to
    allow you to select different versions of the services to run. For example, you
    can choose to run an older version of SSH to give the impression that the system
    is not up to date. There''s one drawback to be aware of with NetFacade and other
    commercial honeypots simulate multiple systems. While the software is running
    on systems, all the traffic will originate from one MAC address. If you''re dealing
    with a skilled hacker, this will be a big tip-off that you''ve set a trap!


    As Verizon transitions GTE''s products and services to under its umbrella, it
    might be hard to find information on NetFacade. Check www.gte.com or contact Verizon
    to get more on this application.


    # Specter


    NetSec has released a very popular commercial honeypot system called Specter.
    Although it currently runs on Windows NT and 2000, it can simulate a wide variety
    of operating systems, including Solaris, AIX, Linux, and Tru64. In addition, NetSec
    is working on a UNIX system and hopes to release it in the near future. The product
    has reasonable hardware requirements, and since it runs on an Intel system, you
    won''t have to sacrifice one of your prized Sun ULTRA workstations. As you see
    in Figure 11.4, Specter offers a wide range of features.


    Not only does Specter fake other OS very effectively, it can mimic the actions
    of a system with heavy or no security or even failing hardware. You can find out
    more from www.specter.com.


