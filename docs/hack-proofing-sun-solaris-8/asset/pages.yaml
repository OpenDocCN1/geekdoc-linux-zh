  md: '# Detecting Unusual Traffic with Network Traffic Monitoring


    +   - Snoop, a built-in Solaris utility, is a powerful network tool for real-time
    monitoring of network activity for short periods of time.


    +   - A dedicated sniffer/IDS system like Snort is the best way to get current
    and historically accurate information about network traffic types and patterns.


    +   - Maintaining a static arp cache will help protect your network from spoofed
    arp entries, which can, at any other time, fool some of the best IDS systems.


    +   - Maintain a good set of IDS logs on backup tape.When a breach isn''t discovered
    immediately, that evidence may become very important.


    # Using Sudo


    +   - With Sudo, there is no need to give out your root passwords.


    +   - Sudo’s logging features help you track and document the execution of super-user
    programs. In the event of unauthorized activity, this logging will help you track
    down the culprit.


    +   - By grouping users together in Sudo’s configuration file, you can give a
    pool of qualified administrators access to the resources they need most.


    +   - Be certain your users are trained in using Sudo and that they understand
    their limitations in relation to Sudo.'
