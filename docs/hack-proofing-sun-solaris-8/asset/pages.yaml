- pgno: 156
  md: '# Chapter 5 • Securing Your Files


    # Tools & Traps...


    # Be Careful When Enabling the SGID Bit on a Directory


    Something to keep in mind is that the SGID bit has special meaning when applied
    to a directory. In such a case, instead of the GID of the process, the group that
    owns the directory owns the created file. The manual page for chmod(1) also mentions
    that this setting can be cleared only by using chmod and supplying an argument
    in symbolic mode.


    The question you need to answer for each and every program with a SUID or SGID
    bit is simple, but often the wrong question is answered. Many systems administrators
    ask themselves, “Does this program really need these special settings?” while
    they are asking “Does my system really need this program?”  Answering the latter
    of those questions and considering all the alternatives will save you many risks
    in the future. It could still leave you open to vulnerable programs, but you’ll
    be aware of the risk.


    Another special permission is known as the sticky bit. For security purposes,
    we are generally only concerned with this bit on directories. (Read the manual
    page for sticky(5) to learn some other uses of the sticky bit.) When set on a
    directory, the sticky bit protects the files within that directory. Files may
    be unlinked only by the owner of the file, the owner of the directory, or the
    root user. This precaution is very useful when you’re dealing with a public directory.
    A good example is the /tmp directory, which has the sticky bit set. This directory
    allows anyone to create files


    # Access Control Lists


    Another solution to allow multiple users within the framework of Solaris’s file
    system resides in the use of access control lists, or ACLs. ACLs allow a much
    finer-grained method of granting or restricting access to files. They also allow
    the use of default ACL entries for directories. A default ACL can be thought of
    as similar to a template that will be applied to each file created within that
    directory.


    Why do you need ACLs? Most of the Solaris admins I know don’t use them and have
    a hard time seeing the need for them. Again, it is rather consuming to deploy
    ACLs across the entire system, but they serve such an important purpose


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_156_0.png)'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Securing Your Files • Chapter 5


    that any admin not using them is doing him- or herself a great diservice. Think
    about it way: Assume that you own a file.(Remember, there is only one owner and
    one group per file!) You want to allow access to that file to one specific user,
    not to a whole group. The task is impossible unless you use ACLs.


    Let’s demonstrate the workings of an ACL while we look at how ACLs can help your
    organization manage a new admin and ask that she does no more than add users.
    You don''t run a windowing system, so the junior admin doesn’t have access admintool
    or any of the other GUI tools. You need the new admin to have access to useradd,
    usermod, and usermdel. In order for these tools to work, they need to be changed
    to SUID root—usually a bad idea, but with ACLs, our risks are mitigated greatly.
    Figure 5 demonstrates the steps needed to make this process work. Pay special
    attention to the mask: option when you set ACLs on a file. This mask indicates
    the maximum permissions available to a user, regardless of what you actually set.


    # Figure 5.2 Application of ACLs on a Squid File


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_157_0.png)


    The first step is to identify the files you want to protect with ACLs and the
    reason to protect them. In this case, we did that by identifying the need'
