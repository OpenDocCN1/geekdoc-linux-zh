    # E-Mail Flood


    The final type of denial of service attacks we will cover is aimed at e-mail servers.
    This attack involves flooding the e-mail server with messages. These messages
    can be e-mail SPAM or simply messages designed to clog the mail queue of the server,
    thereby preventing any legitimate e-mail from coming in.


    By default, all Solaris systems are installed with Sun’s version of the popular
    Sendmail program produced by the Sendmail Consortium (www.sendmail.org). As of
    Solaris 7, the Sendmail server bundled with the operating system denies e-mail
    relay. Earlier versions of Sendmail can be easily upgraded by downloading and
    installing the latest code.


    While defending your system against part of a third-party relay has has become
    easier under Solaris, defending against a flood of e-mail into a mail server is
    more difficult. An attacker can create a simple script, using Expect, Perl, Python,
    or a shell language, which floods a mail server with falsified e-mail messages
    until the server’s mail queue fills up. Defeating this type of attack is made
    difficult by the very nature of e-mail: it is possible to configure Sendmail to
    reject any e-mail from a given user or domain, but rejecting an entire domain
    can cause legitimate e-mail traffic to be denied. In fact, any attacker at defending
    a mail server by rejecting e-mail carries the risk of rejecting valid e-mail.


    Given that, defending a mail server should revolve around configuring it so that
    an e-mail flood will not cause the server to crash. To achieve this goal, /var/mail
    directory should be on a separate partition from the rest of the /var subdirectories.
    This partition should be sized appropriately for the volume of e-mail traversing
    over a given five-day period as well as an additional 50 percent of capacity,
    for growth and for contingency against an e-mail flood.


    Defending against an e-mail flood denial of service is one of the most difficult
    challenges facing a Solaris system administrator. Utilizing Sendmail’s anti-SPAM
    and anti-relay features may help to prevent the misuse of a Solaris-based


