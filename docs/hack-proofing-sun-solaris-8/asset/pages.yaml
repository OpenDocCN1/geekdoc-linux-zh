    in cleartext so an attacker can sniff all of the X keystrokes and even images
    of the display at leisure. A more secure cross-platform solution is required.
    This is another area where SSH really shines.


    # Using X-Windows Securely with SSH


    Much like ftp and telnet, SSH is the solution to securing network communications
    including X-Windows. All traffic that uses the SSH protocol is encrypted by default—using
    SSH as a wrapper for X-Windows is certainly no different. When using SSH as a
    means to tunnel X-Windows traffic not only is the authentication more secure,
    but the protocol traffic is scrambled as well. Furthermore, SSH was designed with
    tunneling in mind, so in most cases of the connection configuration is handled
    by SSH behind the scenes, so secure X-Windows usually works right from the start
    without the need to even set the DISPLAY variable. All authentication uses the
    standard SSH authentication channels (authorized keys, passwords, and so on).


    How can SSH work so well yet transparently to the user? By design, when an SSH
    connection is established, the SSH server creates a virtual proxy display by masquerading
    as an X-server on the remote host. Then, all'
