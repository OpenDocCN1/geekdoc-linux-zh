  md: '# Chapter 1 • Introducing Solaris Security: Evaluating Your Risk


    # Notes from the Underground...


    # Using dsniff to Capture Passwords


    You may be wondering why I keep complaining about the insecurity of cleartext
    protocols such FTP and Telnet. After all, how easy can it be to decode this binary
    information off the wire? Actually, it''s very easy, thanks (or no thanks, depending
    on your point of view) to a freely available tool dsniff. The homepage for dsniff
    is monkey.org/~dusong/dsniff/ and Solaris binary packages are available at www.sunfreeware.com/programlistsparc.html#dsniff.
    You can use dsniff to capture login and password combinations and other data from
    any cleartext protocol, including FTP, Telnet, SMTP, HTTP, POP, poppass, NNTP,
    IMAP, SNMP, LDAP, Login, RIP, OSPF, PPTP MS-CHAP, NFS, YPIP, SOCKS, X11, CVS,
    IRC, AIM, ICQ, Napster, PostgreSQL, Meeting Maker, Citrix ICA, Symantec pcAnywhere,
    NAI Sniffer, Microsoft SMB, Oracle SQL, Sybase and MySQL. In this example, I will
    show how FTP and Telnet passwords are captured, though the other protocols are
    just as easy to violate. Figure 1.1 shows the actual login sessions from the user''s
    perspective. Note that the user is completely unaware that his passwords have
    been sniffed. Figure 1.2 is the dsniff output of the passwords captured during
    the user''s sessions.


    # Figure 1.1 User''s Perspective of the Login Session


