  md: '+   ~ftp/dev This directory should be owned by root and should not be writable
    by user, group, or other. You need to use mknod to create the files in this directory.
    Use the ls -IL (lowercase l, uppercase L) to get the major and minor numbers and
    then use these numbers to create the nodes. The files you need are /dev/zero,
    /dev/tcp, /dev/udp, /dev/tiscots. Set the read and write mode to 666 on these
    nodes.


