    This record records all auditing events for juneill except for successful reads.
    Now consider, for example, the following line:


    ```

    scarter:+fw

    ```


    This record records only the successful file writes for the user. The modifications
    to the audit_user file either augment or override the systemwide auditing parameters
    established in the audit_control file. Likewise, the flags can be used to tailor
    auditing for the system. For example, consider the following line from a modified
    audit_control file:


    ```

    flags:-all,^fr

