    # Monitoring Solaris Systems


    Monitoring Solaris systems is absolutely essential, because unless you''re paying
    careful attention, you may never know if one of your systems has been cracked.
    Of course, monitoring is a beneficial administrative practice that reaches beyond
    its security aspect. For example, appropriate monitoring identify performance
    bottlenecks that have been missed by other means, especially if these bottlenecks
    are periodic instead of constant. System performance and message log output are
    Key areas to monitor. In addition to examining the security-related logfiles,
    this section is devoted to examining system performance using the default tools
    available to the operating system. However, if you find the default tools inadequate
    for monitoring the historical system performance of your servers, you may be interested
    in my own source monitoring tools, MRTG-PME, discussed in Chapter 3.


    # Using the sdtprocess and sdtperfmeter Applications


    Even the default installation of Solaris has a variety of little-known monitoring
    applications. Probably the most useful of these are Process Manager and the Performance
    Meter. Extensive usage guides for each of these tools are available in the Sun
    Answerbook Common Desktop Environment: User''s Guide. While we won''t attempt
    to document Unix''s step-by-step documentation, this section will introduce you
    to these tools.


    Sun''s Process Manager is roughly a graphical equivalent of the ps command, designed
    for novice users who are not familiar with all of the command-line switches for
    ps. Process Manager isn''t in the default path for the user or regular accounts,
    so you will need to launch it directly from /usr/dt/bin/sdtprocess. You can easily
    sort system processes, as well filtering them for certain strings (ps -ef equivalent).
    1.6 illustrates Process Manager filtered for viewing-only processes owned by root.'
