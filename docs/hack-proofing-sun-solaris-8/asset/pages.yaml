- pgno: 217
  md: '# Summary


    The goal of this chapter was to walk you through securing the network services
    on the Solaris hosts in your network, and we''ve looked at many of the major services
    you might use such as DHCP, DNS, remote commands, X-Windows and SSH. Each of these
    services is important in its way, probably as much to the attacker as to you because
    of the system privilege or information available through each one. Let''s take
    a look at these services one last time.


    With DHCP you can use either a command-line or graphical tool to set up and maintain
    your host information database. We''ve seen that the command-line tool dhcpconfig
    is best for the initial setup of DHCP services, whereas the GUI tool dhcppmgr
    is best for ongoing management and host-specific tuning.


    We also looked at Solaris''s service daemon (BIND) and noted that the version
    shipping with the default installation is vulnerable to root buffer overflow exploits.
    We presented instructions on creating a chroot jail, which partitions DNS services
    away from the rest of the operating system, using newer version of BIND available
    directly from ISC. We provided details on how to restrict zone transfers to authorized
    hosts.


    We explained anonymous FTP services and their inherent vulnerabilities, and asked
    that you use HTTP for file transfer to unknown individuals where possible. We
    noted that a chroot script similar to how we set up BIND is available in the man
    page for in.ftpd.


    We examined the inherent insecurity of the Berkeley r-commands (login, rexec)
    and the dangers of using these commands. Poorly configured .hosts files or /etc/hosts
    exchange login simplicity for intrusion holes. Our solution was to install SSH
    as a drop-in replacement for the Berkeley r-commands. SSH provides secure authentication
    and data transfer with very little server configuration and almost transparent
    client usage.


    Finally, we discussed authentication modes for X-Windows, both host-based and
    user-based, and we discovered that regardless of the authentication method in
    use, the X-protocol is unencrypted and inherently insecure. Thus, a knowledge-attacker
    could gather not only passwords over the X-protocol but also log keystrokes and
    spy on the user''s display. As a solution, we saw how easy it is to tunnel the
    X-protocol over SSH in a manner that not only secures the authentication but the
    data transfers as well.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_217_0.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Solutions Fast Track


    # Configuring Solaris as a DHCP Server


    +   - Determine your lease pools, default gateways, lease-time, and any other
    client data before beginning.


    +   - Use the command-line dhcpconfig setup tool to create your DHCP server configuration.
    Be sure to enable logging.


    +   - Use the GUI tool dhcpmgr tool to maintain your DHCP configurations and set
    up host specific options.


    # Securing DNS Services on Solaris


    +   - Understand that attackers can leverage unsecured DNS servers as a roadmap
    to identify and target interesting hosts for attack.


    +   - Consider splitting your DNS into separately updated public and private servers.


    +   - Configure BIND to run in a chroot jail.


    +   - Restrict zone transfer information as tightly as possible in the named.conf
    file.


    # Configuring Solaris to Provide

    Anonymous FTP Services


    +   - Add all users to the /etc/ftusers file and remove them on a case-by-case
    basis depending on the user''s need for FTP services.


    +   - Understand why anonymous FTP is inherently insecure. Then, if it is still
    determined to be a requirement, use the configuration script in the main page
    for inftp(1M) to configure the anonymous FTP server in a chrooted Berkeley r-commands
    environment.


    # Using X-Server Services Securely


    +   - Understand the difference in security levels between host-based and user-based
    authentication.'
