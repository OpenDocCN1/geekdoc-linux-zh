  md: 'Introducing Solaris Security: Evaluating Your Risk · Chapter 1


    # # Securing against Physical Inspections


    If the physical security at your location is lax, then it is conceivable that
    unauthorized personnel might obtain physical access to your Solaris system. An
    intruder with physical access to a Solaris server without a secured programmable
    read-only memory (PROM) is only moments away from root access. After all, they
    need to boot from the CD into single user mode and change the password for the
    superuser account, or add a new superuser-equivalent account. Fortunately, the
    OpenBoot PROM on SPARC machines contain features that make it very difficult for
    an unauthorized individual to gain access to the system can be hacked when the
    attacker has physical access for a long period of time.


    Even a secured OpenBoot PROM will not stop someone from opening your server''s
    case (with a hacksaw and crowbar if necessary) and removing the disk drives. Once
    the disk drives are removed they can easily be mounted in another system for data
    theft or other misuse. Therefore, your location''s physical security should be
    great enough to deter the forcible opening and removal of your servers.


    # # Securing OpenBoot


    Like most PC BIOSes you can specify that a password is required to access some
    or all of the configuration functions in the OpenBoot PROM. Access is restricted
    to the security modes identified in Table 1.5.


    Table 1.5 Security Modes for Access to Configuration Functions in the OpenBoot
    PROM


    | Security Mode | Description |

    | --- | --- |

    | None | This is the default mode, wherein access is not restricted to PROM operation
    in any way. |

    | Command | The commands boot and go are unrestricted, but only for booting from
    the default partition. All other access requires a password. |

    | Full | Only the go command is unrestricted. All other access requires a password.
    |


    To set the security mode, use the eeprom command: eeprom security-mode=MODE, WHERE
    MODE is neither none, command, or full. Once the mode has been set, the OpenBoot
    password can be set using the command eeprom security-password.


