    the root user. Its contents should be the same as those of /usr/share/lib/zoneinfo.


    In addition, you need to make sure that the /etc/pam.conf file is properly configured
    to handle FTP authentication, whether anonymous or normal. The following lines
    should be in the pam.conf file:


    ```

    ftp      required      /usr/lib/security/pam_unix.so.1

    ftp      account       required      /usr/lib/security/pam_unix.so.1

    ftp      session       required      /usr/lib/security/pam_unix.so.1

    ```


    It''s also a good idea to make sure that the /etc/default/ftpd file is created
    and contains a valid header for your site as well as a UMASK for files created
    by the FTP process. I recommend 077.


    Another useful file is /etc/ftusers. This file contains names of users who are
    not allowed FTP access. It is strongly recommended that you put in this file all
    the built-in accounts as well as all user accounts who should not be accessing
    FTP services. The command is simple:


    ```

    cat /etc/passwd | cut -f1 -d: > /etc/ftusers

    chown root /etc/ftusers

    chmod 600 /etc/ftusers

    ```


    # ## Using Samba


    Samba, an open-source application that provides the ability to share resources
    between UNIX-based systems and Windows-based systems, is a very popular solution
    to Windows/UNIX interoperability. The problem is that it is very difficult to
    configure securely. The configuration file, smb.conf, is complex with a variety
    of used options. In this section, we discuss some of the better options for security
    within the smb.conf file and look at some of the current Samba exploits.


    The format of the smb.conf file is fairly straightforward. Here is a sample element
    from the file:


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_171_0.png)'
