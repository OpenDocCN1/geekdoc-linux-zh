- pgno: 312
  md: '# Introduction


    It is essential that every Solaris administrator understand the risks posed to
    a Solaris system by errors in configuration as well as programming. Understanding
    Solaris’s weaknesses as well as its strengths makes defending a Solaris system
    against hacking attempts easier.


    This chapter covers some of the more common hacks and exploits used against Solaris
    systems. These exploits cover denial of service (DoS) attacks, either to bring
    the system down or simply make it unavailable for legitimate users, and buffer
    overflows to gain access or elevated privileges—usually root. Other attacks can
    include IP spoofing, MAC address spoofing, rootkits, connection hijacking, and
    logic bombs. With system and network administrators struggling to keep up with
    user requests and other demands, security is usually the first item to be dropped.
    Attackers rely on this fact.


    By understanding how exploits work under Solaris and how exploits affect the Solaris
    operating environment, the system administrator is better prepared to eliminate
    or mitigate the effects of these threats.


    # Securing against Denial of Service Hacks


    More and more companies have been seeking to increase their Internet presence,
    whether it is through e-commerce sites or simply by providing larger and more
    sophisticated Web sites. As a company’s presence on the Internet increases, that
    company also becomes a more tempting target for hackers. In the early months of
    2000, several prominent Web sites, including Ebay, Yahoo, and CNN, were essentially
    “knocked off” the Web through the use of distributed denial of service (DDoS)
    attacks.


    A service attack may involve flooding the target site with spoofed traffic that
    legitimate traffic is blocked, or may target essential services, such as DNS.
    In either case, this type of attack can be devastating because it results in the
    company’s Internet presence disappearing. Denial of service attacks can be accomplished
    in a variety of ways. Today, the most popular DoS attack appears to be the distributed
    denial of service or DDoS. DoS attacks can be simple, such as the SMURF attack
    or e-mails floods, or more sophisticated, such as the Ping of Death, SYN floods,
    and distributed denial of service. One interesting set of Denial of Service attacks
    is the Naptha set of vulnerabilities. Discovered around November of 2000, Naptha
    vulnerabilities are weaknesses in the way that TCP/IP stacks and network applications
    handle the state of a TCP'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Dissecting Hacks \cdot Chapter 10


    connection. By creating a suitably large number ofTCP connections and leaving
    them in certain states, the attacker can starve the target system of resources
    to the point of failure. Normally, attacks that exploit TCP connections in this
    manner exhaust the resources of the attacker as well. Napa attacks make it possible
    to easily create a Denial of Service on the target system with little resource
    consumption on the part of the attacker.


    We will begin by looking at three types of denial of service attacks. The first,
    Ping of Death, targets the TCP/IP kernel stack, causing the system to crash. We
    will also consider the SYN flood denial of service, and one of the favorite attacks
    against e-mail servers, the e-mail flood.


    # Ping of Death


    The Ping of Death attack, first seen in 1996, or ICMP (hence the name “Ping of
    Death”). Normally IP packets are 65535 bytes large, which includes the header
    length (assuming that no options are set). A typical ICMP echo-request consists
    of eight bytes of ICMP header information (as per RFC-792) followed by the number
    of data octets in the echo-request. This means that the maximum allowable size
    for the ICMP data is 65507 bytes (maximum IP packet size minus the size of both
    the IP and ICMP headers). It is possible, however, to craft ICMP echo-request
    packets with payloads bigger than 65507 bytes by using IP fragmentation to break
    up the payload. Fragmentation relies on the offset value in the IP header of each
    fragment. Since most systems do not process a packet until all fragments have
    been received, it is possible to overflow a 16–bit internal variable by setting
    a valid offset in the final fragment that the offset value added to the fragment
    size creates a packet greater than 65535 bytes in length. Systems that do reassemble
    this packet may panic and crash, reboot, or freeze up.


    For external protection, the Ping of Death is easily countered by blocking inbound
    ICMP traffic at the border routers of the network. For the internal network, the
    only real solution is to stay current on operating systems. Solaris 2.4, 2.5,
    and 2.5.1 are apparently the only versions of Solaris susceptible to Ping of Death
    attacks. The patches for Solaris 2.4, 2.5, and 2.5.1 were released in response
    to this exploit install new drivers for IP that rejects oversized ICMP packets.
    If an attacker tries to use this, the kernel simply throws away the ICMP echo
    request packets that are oversized. Table 10.1 lists the Solaris patches available
    for the Ping of Death attack.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_313_0.png)'
