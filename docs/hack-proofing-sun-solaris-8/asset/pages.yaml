- pgno: 358
  md: '# 334 Chapter 11 • Detecting and Denying Hacks


    Many variables and configuration options are available for Tripwire. Make sure
    you read the documentation carefully. Tripwire also provides a tool to help build
    your own policy file. It can be found online at http://policy.tripwire.com.


    # Notes from the Underground...


    # Social Engineering


    One of the most effective ways to get inside a place is through the front door.
    One of the most knowledgeable people in any organization is the person who answers
    the phone. Depending on your organization, this person could be your receptionist,
    a message center employee, or a customer service representative. These people
    are the gatekeepers, responsible for transferring calls and answering questions.
    They have access to the company phone listings and procedures, usually have a
    network connection, and in most cases, are the first ones in the building in the
    morning and often the last to leave at night. Despite their powerful data, they
    are rarely given training on computer security procedures. If they are trained,
    it is usually no more than the average amount of training that network users would
    receive. Hackers know this and will often try to trick your gatekeeper into providing
    them valuable information that they can use to access your network. This method
    of gathering information is known as social engineering and often precedes a hack
    attack.


    It''s important that you take the time to research your vulnerability in this
    area. Take time to introduce yourself to your gatekeeper. Find out what he or
    she has access and what training he or she has had regarding computer security.
    Ask if the person has any unusual phone calls or visitors. Guess the kinds of
    calls hackers would make. They might pretend to have forgotten the remote access
    phone number or the name of the help desk manager. For some reason, they often
    prevent calling from your copier company''s repair or sales department.


    Make sure that you go through the right channels before crossing interdepartment
    boundaries, but give serious consideration to exploring this area of your organization.
    After all your hard work to make your systems secure, make sure that you''re not
    leaving your front unlocked!


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_358_0.png)'
  merge: -1
  img_proc: true
- pgno: 359
