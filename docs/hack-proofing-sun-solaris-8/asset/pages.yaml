- pgno: 134
  md: 'at MIT. It was intended to prevent network eavesdropping while authenticating
    users to machines and vice versa. It is not an encryption system, though its nature
    facilitates the use of encryption because a secret key is known by both the server
    and the user.


    # Tools & Traps...


    # The Importance of Time


    Kerberos uses the workstation time to help identify the current user. Kerberos
    tickets have fixed lifetimes, and are not valid before their issue timestamp or
    after their expiration. These mechanisms prevent replay attacks, when a hacker
    reavesdropped ticket to masquerade as a valid user. Though Kerberos includes several
    mechanisms to prevent replay attacks, it is critical that all workstations and
    servers on your network have the correct time and that time be synchronized closely
    with the Kerberos Key Distribution Center (KDC).


    Fortunately, the network daemon ntpd communicates with higher-level timeservers
    to determine the correct time, adjusts for clock skew, and keeps workstations
    on the same time as peers.


    Large Kerberos sites usually use a GPS clock for a timeserver. For most locations,
    a few servers configured to poll a reliable timeserver like the Washington Naval
    Observatory or NIST are sufficient. Other servers and workstations, in turn, poll
    these servers for the correct time. A list of NIST time servers can be found at
    www.boulder.nist.gov/timefreq/service/time-servers.html.


    Kerberos is a third-party authentication system. This means, essentially, that
    a trusted third party in the form of the KDC both trusts and is trusted by you.
    The computer or service to which you are authenticating also trusts the KDC. Because
    the KDC is able to identify you securely, and the remote computer believes the
    judgment of the KDC, that machine trusts you as well. A similar process works
    in reverse to ensure that you are connecting securely to the machine and the service
    (login, rsh, FTP, etc.) that you expect.


    In this section, we will briefly cover how Kerberos works, then discuss the Sun
    Enterprise Authentication Mechanism (SEAM) product, it its installation and


