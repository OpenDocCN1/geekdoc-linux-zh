- pgno: 142
  md: 'The third column is the control flag, required. This allows PAM to be stacked

    to perform different functions. The valid options are shown in the Table 4.5.


    # Table 4.5 Control Flag Values


    | Control Flag | Description |

    | --- | --- |

    | Optional | PAM modules flagged as optional need succeed under certain conditions.
    |

    | Sufficient | This module is all that''s required to perform the task specified
    in the module type field. |

    | Requisite | The conditions imposed by requisite modules must be met before authentication
    can proceed. "Requisite" is-some of a minder. "Prerequisite" would be a better
    term. |

    | Required | These modules must complete successfully. Some exceptions are noted
    in the following bullet list. |


    Options stack according to the following rules:


    +   - The stack is processed from the top down, in the order given in the pam.conf.

    - If all requisite and required modules succeed, any errors generated by sufficient
    or optional modules are ignored and authentication proceeds.

    - If any requisite or required modules fail, the authentication process terminates
    and returns the nature of the failure to the system. Failure codes can indicate
    to the system that an account is locked, nonexistent, inactive, or a bad password
    or a password that needs to be changed has entered.

    - If no requisite or required modules are specified, at least one sufficient or
    optional module must be passed successfully to proceed.

    - The requisite flag may cause a failure in special cases. In these instances,
    if a requisite module fails, even when a prior required module succeeds, the authentication
    fails.

    - The sufficient flag may cause a success in special cases. If a sufficient module
    succeeds, the PAM stack terminates successfully at that point and access to the
    service is allowed. Use of this control flag can be exceptionally dangerous, as
    it can allow access to a system without any form of user identification. The accidental
    substitution of sufficient for'
