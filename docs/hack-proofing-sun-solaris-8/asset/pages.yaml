    # Applying Security Patches


    Security patches are a key defense for your Solaris systems. Since Sun distributes
    updated security patches on an ongoing basis, continuous vigilance is required
    on the part of the system administrator to ensure that all critical security patches
    have been installed on all systems. This sidebar is dedicated to describing how
    the patch administration system works, as well as showing you to find Sun''s security
    updates.


    The current patch revision level can be determined by issuing the command showrev
    -p, which will return "No patches installed" for a default installation. If at
    all possible, systems need to be patched with the most current Sun recommended
    security patches before the system is connected to the Internet. Ideally, you
    download patches on another (already patched) system and transfer them to the
    new system whatever secure means are available.


    Patches are obtained from Sun via the Solaris distribution center, located at
    http://www.sunsolve.com. To download the most current Sun recommended security
    patches, go to http://www.sunsolve.com/pub-cgi/show.pl?target=patches/patch-license&nav=pub-patches
    and accept the license agreement. The page that follows will list downloads for
    all versions and architectures of the Solaris operating system; choose the one
    that matches your system to be patched.


    Once the patch cluster is downloaded, transfer it to the unpatched server using
    whatever secure means of transfer available, and use the unzip command to decompress
    the patch cluster. Change into the directory that has the same name as the patch
    cluster and execute the install_cluster script at root. The patch cluster you
    downloaded will now be installed automatically. The processing takes at least
    two hours, and it is recommended that you allow the system to idle while the patch
    cluster is applied. Note that using the patch cluster on systems without enough
    free disk space in the /var partition is not recommended. At the end of the processing
    process, the showrev -p command should show all of the patches applied to the
    system.


    Patches can also be applied on an individual basis, if necessary. Use the Sunsolve
    patchfinder at http://sunsolve.sun.com/pub-cgi/showpl?target=patches/patch-access
    to search for individual patches by the patch ID number. Individual patches should
