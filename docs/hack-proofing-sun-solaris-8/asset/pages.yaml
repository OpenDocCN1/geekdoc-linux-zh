    file itself. Once you''ve added the public key of the transmitting host to the
    authorized key list of the receiving host, you can test the connection from the
    transmitting host by using the command ssh -v receivinghost. The -v option indicates
    that you will see verbose output about the connection. If you fail to get a command
    prompt on the remote system, this will help you determine where the problem lies.
    In 95 percent of all cases, you probably have invalid permissions set on the .ssh
    directory or its components on one or more sides of the connection. Also, as long
    as your remote login works without a password, you should allow remote copying,
    so you should also try transferring files by using the scp command.


    # NOTE


    You do not have to use the same user account on each side of the connection. You
    could just easily allow the account user1 on one host to login to the user2 account
    on another host. Use discretion when setting up these types of connections.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_216_0.png)'
