  md: '# Notes from the Underground...


    # Anatomy of a Buffer Overflow


    How does a buffer overflow work? In short, the idea is to inject the necessary
    code into the target buffer and then change the Instruction Pointer in the stack
    to point back to that code. This concept is shown in Figure 10.3.


    Figure 10.3 Buffer Overflow Mechanics


    | Bottom of Stack |

    |---||

    | FF | c |

    | FB | b |

    | F7 | a |

    | F3 | IP 0xD8 |

    | EF | SFP |

    | E8 | CALL |

    | EB | Buffer ① |

    | Start of Code |

    | DA | JMP |

    | D8 | Top of Stack |


    When the code is injected into the buffer, it is larger than the size that the
    buffer expects. Care must be taken when creating the code—if it is too large and
    doesn''t write the new memory address into the IP, it is very likely that the
    program will crash. In Figure 10.3, the code is written into the stack and writes
    toward the bottom of the stack.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Chapter 10 · Dissecting Hacks


    memory address of the code to be executed is written into the Instruction Pointer
    (1). When a return statement is reached, the address of the instruction is copied
    from the IP onto the processor. The code at that location is executed. In this
    case, the address points back to the top of the stack (2). A JMP is used to get
    around the problem of not knowing exactly where in the memory space of the program
    the exploit code will reside. JMP instruction allows for the use of IP-relative
    addressing because it only has to provide an IP offset from the current instruction.
    By having the JMP instruction jump to a CALL instruction (3), the exploit string
    (which would be located in the Stack Frame Pointer, SFP) is pushed onto the stack
    as the instruction to be executed upon return from the exploit code. The CALL
    instruction uses IP-relative addressing to point to the first instruction in the
    exploit code (4) and transfers control to it. When the exploit code finishes,
    the exploit string is executed (it is the next instruction to be executed upon
    return from the CALL).


