    # Using Trusted Solaris 8’s B1-Level Security


    The first concept to understand role relating to a system administrator’s function
    in

    Trusted Solaris 8 is that of RBAC. Under RBAC, the traditional administrative

    functions are divided into three roles under the concept of least privilege,

    states that no one should have more privilege than needed to do their

    job. Most system administrators are familiar with the use of the root account.
    Do any

    person with the root password could log to a system and change passwords,

    add accounts, look at any file, change permissions, run code in protected system

    space—for all intents and purposes, be the “military dictator” of the system.
    The

    root account has the power to tell people where they can go, where they can” go,

    information is available to them, what is not, or take anyone’s personal

    information—and, if a person becomes too much trouble, root has the power to

    “kill” that arbitrarily.


    With the that implementation of RBAC, root does not exist. RBAC is com-

    atively, more along the lines of the best aspects of the U.S. government, prov-

    id a system of checks and balances that does not allow any particular branch

    have too much control. The only difference is that RBAC actually works. The

    root account is subdivided into three roles:


    +   Primary Administrator this roughly analogous to the executive

    branch of the U.S. government. The account with the primary adminis-

    trator role can administer security functions over the system as a whole

    but is primarily responsible for providing the ability to give administrative

    roles to others, especially the system administrator and the security

    administrator. Like the President of the United States in the U.S. governnment,
