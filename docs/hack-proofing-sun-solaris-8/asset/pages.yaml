    a challenge-response mechanism whereby login, a user is provided with a given
    challenge and then compute the proper response, preferably offline or on his local
    machine. Once a particular challenge has been used, it is discarded and not reused.


    Defending against users weak passwords is extremely difficult. The main defense
    against password-cracking programs is to making access to the password hashes
    as difficult as possible. In cases NIS or NIS+ are not in use, this may come down
    to ensuring that the /etc/shadow file is secure and no local or remote vulnerabilities
    exist on the system that could allow an attacker, whether from outside or within
    the network, to access the system as root.


    However, if NIS is being used, protecting the password information is more difficult.
    An outside attacker gains access to any system participating in the NIS domain
    has access to the password information.With NIS+, the problem can be alleviated
    somewhat by restricting access to the password table entry so each account has
    access to only its own password.


    # Securing against Trojan Horse Hacks


    Trojan horse hacks get their name from the legendary exploit used by the Greek
    army during the war of Troy.In these exploits, something that appears to be normal,
    in actuality, a tool used by an attacker to further exploit a system or to attack
    other systems.


    # Defending against Rootkits


    A rootkit is a software package used by system intruders to provide them with
    various capabilities on a system once they have succeeded with the initial intrusion.
    A typical rootkit attack begins with the attacker gaining access to a system,
    either by using a stolen or easily guessed password or by using a buffer overflow
    to log in to a host. Once access is gained, the attacker may try to elevate his
    privilege level using known vulnerabilities in whodo, mailtool, mailx, or in.lp.With
    initial access and root privileges obtained, the attacker can then upload and
    install a rootkit.


    One of the oldest rootkits for Solaris is simply called Rootkit.This particular
    kit can be traced as far back as early 1994 and originally came in two variants:
    one for Linux and one for SunOS (not Solaris, but SunOS 4-X systems).


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_333_0.png)'
