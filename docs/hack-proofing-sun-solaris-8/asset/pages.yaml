    # Securing against Brute Force Hacks


    A brute force attack is used by an attacker in an attempt to break passwords on
    a system. Brute force attacks usually includes fingering the host to gain account
    information. Once account names have been obtained, an attacker may try simple
    "joe login" checks. Joe logins are accounts for which the password is the same
    as the account name, like guest/guest or jde/doe. An account like this may be
    the first entry an attacker has into a system. An attacker could write a simple
    script in Expect to automate the brute force attempts against a system. The main
    goal is to gain some access, whether privileged or not, into a system. Once initial
    access is obtained, the real targets, the /etc/passwd and /etc/shadow files, are
    within sight.


    Like other System VR.4 UNIX operating systems, Solaris keeps account information
    in two files:


    +   * A globally readable /etc/passwd file containing noncritical data such as
    the account name, default shell, user ID, and group ID.

    * An /etc/shadow file for the account passwords, password expiration dates, and
    other critical account data.


    The shadow file is readable only by the root user or by someone running a program
    that is setuid. To access the encrypted passwords in the shadow file, an


