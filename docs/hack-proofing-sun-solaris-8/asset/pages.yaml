- pgno: 158
  md: '# Chapter 5 · Securing Your Files


    to add the SUID bit to three programs. We then changed the permissions on those
    three files to turn SUID and turn off all other permissions. In this case, this
    is fine, the ACL will determine who can do what. We then checked the existing
    ACL using the getfacl and modified the existing ACL using the setfacl command.
    Notice that when we looked at the files using the ls -l command, a + (plus sign)
    appeared at the end of the permissions. This is the indicator that the file is
    protected by an ACL. But why did the output of getfacl show an ACL on the file
    before we setfacl and the output of ls -l showed no plus sign? The answer is simple.
    Every file that has considered a trivial ACL applied. This is just a clear way
    of saying that the ACL does exactly the same thing that normal permissions do.
    Once we add some twists to the ACL, in this case allowing the user sysop to execute
    the command, the ACL indicator is displayed. The final step, we ran the command
    as the desired user, sysop, and confirmed that other users cannot execute the
    command.


    So now we see how it works, let''s take a moment to explain the setup. Basically,
    everything is done with the setfacl command. There are a few options to this command;
    which are listed below:


    +   - setfacl - user::perms,group::perms,other:perms,acl_data filename [filename
    ...] This command sets an ACL on the file or files specified in the argument.
    Required when the -s option is initial ACL data, since the -s option overwrites
    all previous data, including the trial ACL. The acl_data argument is the specific
    user or group ACL data you want to apply to a file.

    - setfacl -m acl_data filename [filename ...] This command fixes the existing
    acl_data portion of an ACL.

    - setfacl -d acl_data filename [filename ...] This command deletes specific elements
    from the acl_data section of the ACL.

    - getfacl <input ACL file> -f <output ACL file> This command is a handy way to
    apply an ACL from one file to another, using simple shell pipelines. The setfacl
    -f command takes its input from the output of getfacl, making ACL reproductions
    much more painless.


    ACLs are best suited for the protection of SUID files. In the example, we needed
    to set the user* commands to SUID root in order for a normal user to use them.
    After conducting a SUID audit, all remaining commands with the SUID bit on should
    be protected with an ACL.'
