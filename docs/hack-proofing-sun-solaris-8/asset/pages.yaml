    # Configuring for Routing


    A default installation of Solaris with more than two interfaces (including the
    loopback interface) that aren''t configured by DHCP will route traffic by default.
    This process, of course, depends on the system not having been altered by administrative
    staff. In some situations, it might be impossible to reinstall an operating system
    on a machine that is route traffic. In this situation, we need to be able to configure
    the system to route traffic manually.


    Let''s walk through a check of an already configured and functioning system to
    ensure that''s ready to route traffic. First, we make a list of items to check
    and, if necessary, alter. We do this in step-by-step fashion, in order to pay
    attention to detail and ensure that we don''t miss a step that could result in
    failure of our objective. Following the step-by-step account, we will briefly
    discuss each step and any potential caveats.


    # A Seven-Point Checklist


    Here''s our checklist:


    +   1. Check for interfaces configured via DHCP.

    2. Ensure that each interface to be configured has a corresponding hostname.interface
    file in /etc and that the contents of the files are valid.

    3. Check the /etc/rcS/S30network.sh file (inode link to /etc/init.d/network) for
    signs of alteration.

    4. Check the /etc/rc2.d/S69inet file (inode link to /etc/init.d/inetinit).

    5. Check for the /etc/router file, if it exists, remove it.

    6. After the system has booted, poll /dev/ip for the status of the ip_forwarding
    variable.

    7. Test the system in an isolated environment to ensure traffic routing.


    Each step is covered in more detail in the following sections.


    # Step 1: Check for Interfaces Configured via DHCP


    In the first step, we verify that all the interfaces are being configured with
    static information. As previously mentioned, a system using interfaces configured
