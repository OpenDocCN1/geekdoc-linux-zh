- pgno: 208
  md: '# Chapter 6 - Securing Your Network


    may present a forged invitation for identification. User-based authentication
    works on the principle that the user has a specific identification token, called
    a magic cookie that she presents to the X-server for authentication.


    User-based authentication requires that the X-server have a stored copy of the
    user''s magic cookie. The X-client must present a magic cookie for each new session.
    The X-server compares the magic cookie it receives from the X-client and if they
    match, access is allowed, otherwise access is denied. This would be analogous
    to a guest presenting an invitation with a copy of the invitation sent to the
    guest. If the invitations match, the guest is allowed to enter, otherwise she
    is asked to leave.


    Magic cookies aren''t terribly complex, and they are simply a random number ideally
    known only to the user. Magic cookies are stored in the file $HOME/.Xauthority,
    which should have an access mode of 600. Because of the access, the magic cookie
    should be known and accessed only by the user, who is responsible for transmitting
    the magic cookie to the X-clients authorized to access his X-server.


    The magic cookie can be generated from a variety of random number sources and
    stored in the file $HOME/.Xauthority. Solaris systems running XDM or Sun''s OpenWindows
    generate and populate this file by default. However, if you should need to generate
    magic cookie numbers manually, you can do this using standard OS tools. You can
    generate magic cookies using the Korn shell''s random number feature using the
    command `xauth add $DISPLAY:0.''$($RANDOM*RANDOM+2))` or by using the date with
    `xauth add $DISPLAY:0.''date +%Y%m%d%H%M%S''`. Note that because the second method
    is not truly random, it is less secure because someone could brute force to guess
    the time you have generated your cookie. Once you have generated a cookie, either
    automatically or manually, it can be used to grant access to the X-server.


    X-server access lists that use magic cookie based authentication are controlled
    using the `xauth` command. The most commonly used forms of the `xauth` command
    and their explanations are listed in Table 6.1. Note the difference between `extract/next`
    and `merge/nmerge`. These allow you to export magic cookies into either binary
    or ASCII formats.'
