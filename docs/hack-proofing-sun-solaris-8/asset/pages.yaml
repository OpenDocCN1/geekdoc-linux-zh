- pgno: 166
  md: '# Chapter 5 - Securing Your Files


    Another important step where logging is concerned is to ensure that **inetd(1)**
    logs all TCP connections. This is accomplished by adding the **-t** trace to the
    entry in the /etc/init.d/inetsvc file. Add a line to restrict core file. Core
    files are useful for debugging, but they also be used by an attacker to gain insight
    into the workings of the system. It is recommended that you add the line **ulimit
    -c 0** to the /etc/init.d/inetsvc file.


    # Using NFS


    The Network File System, or NFS, has long been used to share data between computers
    running UNIX and more recently between UNIX computers and PCs. This long service,
    however, has not been without trouble. NFS is under attack, and running NFS leaves
    you to risks. You cannot protect yourself entirely while running NFS (or any RPC-based
    program, for that matter), you can take some steps to protect yourself as much
    as possible.


    NFS, like any RPC-based program, relies on a service called rpcmount. This service
    is an RPC server that handles the requests to mount a file via NFS, and it is
    also inherently risky. One of the main problems with NFS is authentication. By
    default, there is no encryption on the network message sent to request a mount.
    The UID and GID of the user requesting the mount are bundled into the message
    and sent via cleartext.This makes rather easy to write a program to forge a mount
    request. This loophole can be altered by the use of Diffie-Hellman (DH) or Kerberos
    authentication, and doing so is highly recommended.


    For DH authentication, a naming system needs to be in place within the network.
    Each computer within the domain must be able to resolve the name. The next step
    is to create new keys, both public and private. Solaris provides the **newkey(1)**
    command (see **nisaddcred(1)** if you are using NIS+) to enable the creation of
    host and user keys. In addition, the **chkey(1)** is supported to allow users
    to re-encrypt their keys. The steps to set up DH authentication for NIS:


    +   1. Edit the **/etc/nsswitch.conf** file and set the variable particular to
    **nis**.

    2. Execute the **newkey** command with the **-h <hostname>** argument, and answer
    the password prompts.

    3. On the NIS server, as the root user, execute the **newkey** command with the
    **-u <username>** command for each user.

    4. Have the user log in and execute the **chkey -p** command.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_166_0.png)'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Securing Files • Chapter 5


    Assuming the key server (/usr/sbin/keyserv) is running on the host and that the
    keylogin command, which decrypts and stores the secret key for use, has been executed,
    you should now be able to use DH authentication. To share a file system with DH
    authentication, you simply supply the sec=dh option to the share command, like
    so:


    ```

    share -nfs -o sec=dh /export/tools

    ```


    If you are using the automount utility, you also need to specify the sec=dh option
    within the auto_master map. To use Kerberos authentication, simply execute the
    share command with the sec=krb4 option. Of course, you must be using Kerberos
    already. Setting up Kerberos is beyond the scope of this discussion.


    # Share and Share Alike


    Another serious problem with NFS lies in common administrative oversights. I remember
    auditing a Solaris server at a major publishing company that used NFS to distribute
    their prep materials to a printing house. They shared a file system from the print
    house over the Internet with absolutely no protection and no restrictions on the
    mount! I was agh; they were complacent. There are numerous ways to protect yourself,
    whether you are the client or the server in the NFS equation. Both the mount(1M)
    and the share(1M) commands allow the use of some pretty handy options. Some of
    the better options to use when sharing a file system are detailed in Table 5.1.


    # Table 5.1 Enhancing Options to the Share(1M) Command


    | Share(1M) Option | Explanation |

    | -rw=client[:client2:client3 ?] | Allows read/write mounting from only those
    specific clients. No other clients will be able to mount the file system. You
    may also specify users, netgroups, networks, and DNS suffixes as options. See
    share_nfs(1M) for details. |

    | -ro=[client[:client2 ?]] | Allows the mount to export only and optionally restricts
    the clients that may access that file system. You may also specify users, netgroups,
    networks, and DNS suffixes as options. See share_nfs(1M) for details. |


    Continued


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_167_0.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Table 5.1 Continued


    | Share(1M) Option | Explanation |

    | --- | --- |

    | anon=-1 | Denies access for unknown users. Also denies attempts by root users
    of other machines to mount a file system, since remote users are mapped to the
    anonymous UID. |

    | window=value | When Kerberos or DH authentication, sets the maximum lifetime
    of the RPC request''s credential. The default is 8.3 hours. |

    | nosuid | Restricts the creation of SUID and SGID files by clients. |

    | nosub | Restricts the mounting of subdirectories below a shared directory. |


    When you mount files from servers, it is also best to look after your own interests.
    For example, the **mount(1)** command takes similar options to the **share** command.
    For example, to mount a file read/write with SUID execution denied, you execute
    the following command:


    ```

    mount -F nfs -o rw,sec=dh server:/export/danger /mnt

    ```


    This command ensures that you are taking measures toward your security, regardless
    of the options supplied to the **share** command on the server. Be careful, though,
    with any sharing of file systems. Don''t share file systems that contain system
    binaries, log files, or sensitive data. If an attacker manages to gain read/write
    access to your /bin directory, for example, your system could be compromised within
    minutes. Furthermore, Solaris provides a symbol to restrict connections to the
    NFS server to those originating from privileged ports. To enable this symbol,
    add the line to your /etc/system file:


    ```

    set nfs:nfsportmon=1

    ```


    Note that this command does not protect you from attacks in which the attacker
    has privileged access to the attacking system or to attacks launched from PC systems.


    Another problem with NFS, regardless of the authentication method used, is a lack
    of encryption on the normal transactions. As mentioned earlier, NFS data travels
    in cleartext, making eavesdropping a trivial task and possibly leading to the
    capture of an existing file handle and thus potentially valuable data. There is
    no'
