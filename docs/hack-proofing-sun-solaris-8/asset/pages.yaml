- pgno: 297
  md: 'You will also need to define an access control list that identifies which host
    will be allowed to control the cache.When using cachemgr.cgi, this acl is the
    IP address of the Web server where the program is installed. Add the following
    line to your squid.conf:


    ```

    acl mangement_host 192.168.100.12/25.255.255.255

