- pgno: 60
  md: '# Chapter 2 Securing Solaris with the Bundled Security Tools


    +   **C, Discretionary** This group of classifications is the lowest level of
    trusted computer bases (TCBs).

    * **C1, Discretionary Security** This is the most basic level of security for
    virtually all operating systems today. It requires fundamental criteria such as
    file-level permissions and protections, username and password access, a protected
    operating system, and auditing methodologies.

    * **C2, Controlled Access** C2 is the first level of security in which the administrator
    has comprehensive capabilities over security system. This level requires access
    control down to the object level, meaning any individual item must be afforded
    some measure of restriction. Additionally, authorization for system access must
    be designated by a trusted administrator or administration group, and auditing
    capabilities are enhanced. At this level, flexibility of the security design is
    still largely left up to the administrator and the security policy of the environment.
    Such things as Role-Based Access Control (RBAC), which we discuss later, that
    are mandatory at higher levels should be needed.

    * **B, Mandatory Protection** At this group of classification, TCB protection
    criteria become mandatory.

    * **B1, Labeled Security** As you might suspect, at this level, where federal
    mandates come into effect, security gets quite a bit complicated. One of the additions
    to C2 requirements that become mandatory at this point is the secure access of
    labeled objects. An easily understood example, the DOD''s own criteria for labeling
    makes a good illustration. The DOD has documents whose criteria are labeled classified
    and top secret. Under these labeling criteria, such classifications can be applied
    to any computer object, whether a file, a process, or a physical device, so that
    only users with a clearance level of, say, classified may access objects with
    that security classification. Conversely, a user with a classified clearance would
    have no access to objects protected by the top-secret level of access control.
    So, if a person with top-secret clearance tried to print a top-secret document
    on a printer whose label was classified, he would get an access error message
    because the printer did not have sufficient security clearance. Another mandatory
    addition to C2 is the requirement for RBACs on the administrative level, eliminating
    the existence of all-powerful Superuser accounts such as root. Other criteria
    include greater overall protections for the operating'
