- pgno: 159
  md: '# Role-Based Access Control


    Role-Based Access Control, generally known as RBAC, allows you to grant enhanced
    permissions based on a role that users need to fulfill. In the past, when you
    needed to allow a user to perform a task that required root privileges, you had
    only a few choices. The easiest way, as we did in the previous section, was to
    use the SUID bit. This isn''t the best way, however. Another popular option was
    the use of a program like SUDO. Now, with the introduction of RBAC, you can use
    a of Solaris native application.


    RBAC is described this way within the Solaris 8 System Administration Guide, Volume
    2: "With RBAC, you can give users the ability to solve their own problems by assigning
    them packages of the appropriate privileges. Superusers'' capabilities can be
    defined by dividing those capabilities into several packages and assigning them
    separately to individuals sharing administrative responsibilities." RBAC includes
    these features:


    +   * Authorization A right that is used to grant access to a restricted function.


    +   * Execution profile (or simply profile) A bundling mechanism for grouping
    authorizations and commands with special attributes; for example, user and group
    IDs.


    +   * Role A special type of user account intended for performing a set of administrative
    tasks.


    RBAC relies on flat flat database to provide access to privileged operations:


    +   * user_attr (extended user attributes database) Associates users and roles
    with authorizations and execution profiles.


    +   * auth_attr (authorization attributes database) Defines authorizations and
    their attributes and identifies the associated file.


    +   * prof_attr (execution profile attributes database) Defines profiles, lists
    the profile''s assigned authorizations, and identifies the associated file.


    +   * exec_attr (profile execution attributes database) Defines the privileged
    operations assigned to a profile.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'After reading this section, you''ll see how RBAC could have been better used
    to accomplish the same goal. The files you''ll use to configure RBAC, and their
    formats, are as follows:


    +   - /etc/user_attr - user:qualifier:res1:res2:attr

    - /etc/security/auth_attr - authname:res1:res2:short_desc:long_desc:attr

    - /etc/security/prof_attr - profname:res1:res2:desc

    - /etc/security/exec_attr - name:policy:type:res1:res2:id:attr


    # /etc/user_attr – user:qualifier:res1:res2:attr


    Valid entries for user names, as found in /etc/passwd, qualifier, res1, and res2
    are to be blank, as they are reserved for future use, and attr semicolon-separated
    key-value pairs describe the security attributes to be used when the user commands
    are executed. This is optional. There are four valid keys: auths, profiles, roles,
    and type, and they are defined as follows in the Solaris 8 System Administration
    Guide, Volume 2:


    +   - auths Specifies a comma-separated list of authorization names chosen from
    names defined in the auth_attr(4) database. Authorization names may include the
    asterisk (*) character as a wildcard. For example, solaris.device* refers to all
    the Solaris device authorizations.

    - profiles Contains an ordered, comma-separated list of profile names chosen from
    prof_attr(4). A profile determines which commands a user can execute and with
    which attributes. At minimum, each user in user_attr should have the All profile,
    which makes all commands available without any attributes. The order of profiles
    is important; it works similarly to UNIX search paths. The first profile in the
    list that contains the command to be executed defines which (if any) attributes
    are to be applied to the command.

    - roles Can be assigned to the user using a comma-separated list of role names.
    Note that roles are defined in the same user_attr database. They are indicated
    by setting the type value to role. Roles cannot be assigned to other roles.

    - Type Can be set to normal, if this account is for a normal user, or to role,
    if this account is for a role. A role assumed by a normal user after the user
    has logged in.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_160_0.png)'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# /etc/security/auth_attr -

    authname:res1:short_desc:long_desc:attr


    The format for this is a bit tricky. The first field, authname, is the name of
    the authorization, and it must be unique. Each unique prefix may have several
    suffixes, and the prefix/suffix groups are separated by a period. The file comes
    preconfigured with several authorizations for the Solaris system. An example is
    the solaris.login.enable auth, which is used to allow login. For your authname
    entries, the recommendation is that the authname begin with the reverse of your
    domain name. For any example company, this com.incoming-traveler. As the previous
    file, res1 and res2 are reserved for future use and should be left blank. The
    fourth and fifth fields are intended to contain descriptions, with the first of
    those two meant to be a brief summary, that one might find in a GUI pull-down
    list. The final field allows the addition of zero or more key=value pairs to further
    describe the attributes of the authorization.


    # /etc/security/prof_attr - profname:res1:res2:desc:attr


    This file defines profiles (formerly called execution profiles) and is simple
    in format. The first field is the name of the profile, and it is case sensitive.
    The second and third fields, res1 and res2, are reserved for future use and should
    be left blank. The fourth field is to be used for a description, and the final
    field contains the authorizations. This is a semicolon-separated keyword=value
    list. The most useful keyword is the auts keyword, which is used to specify authorizations,
    as found in the auth_attr file, that will have this profile applied to them.


    # /etc/security/exec_attr -

    name:policy:type:res1:res2:id:attr


    This is the final puzzle piece in RBAC configuration. This file defines the relationship
    between the profile and the commands assigned to that profile. The first field
    of the file is the name, which is one of the profile names found in the prof_attr
    file. The second field should contain the security policy associated with this
    profile. Currently, there is only one supported policy, the Superuser policy model.
    The keyword for this policy is suser and is the only valid entry. The third field
    specifies the type and currently supports only the value cmd (command). The fourth
    and fifth fields are, as reserved, for future use and should be blank. The sixth
    field is used for the command that will be executed to


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_161_0.png)'
  merge: -1
  img_proc: true
