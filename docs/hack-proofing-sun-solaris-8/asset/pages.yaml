  md: '# Using Squid on Solaris - Chapter 9 271


    The default-deny stance shown above is the default in the squid.conf, and it is
    significant. Only clients within the IP address range that you have specified
    will be allowed to access the cache. When matching control lists, Squid will take
    the first entry that applies to the current situation (client IP, proxy user,
    etc.). Any combinations that happen to fall through the existing rules are caught
    by the deny line, which prevents exploitation of your cache.


    # Configuring SNMP


    At this point, your cache should be functional after starting squid, but there''s
    still more to do. If you have compiled Squid with SNMP support, you can manage
    the cache remotely using common tools, and get excellent results of cache performance
    statistics using a common tool like MRTG. However, SNMP will also allow an attacker
    to determine the IP addresses and sites visited by your clients and clear or shut
    down the cache, so special attention should be paid to the security implications
    of this feature.


    The first step is to define a list of hosts that are allowed SNMP access to the
    cache. To do this, define an access control list as:


    ```

    acl snmp_hosts src 192.168.100.10/255.255.255

    ```


    Next, define a community string for the cache. As this value is cleartext in the
    squid.conf, it is important that only root can read that file. Though Squid drops
    its root permissions in favor of the nobody user for safety reasons, the file
    is still readable at startup, when Squid is still running as root. To define a
    community string, add the following line to your squid.conf:


    ```

    acl snmp_passwd snmp_community p@s5wD

    ```


    You may also define an address through which SNMP requests are sent and received
    using the snmp_incoming_address and snmp_outgoing_address tags. If your cache
    has a single network interface, this is not necessary.

    To enable SNMP access to the cache from the host specified in the snmp_hosts acl,
    add the following lines to your squid.conf:


    ```

    snmp_access allow snmppasswd snmp_hosts

    snmp_access deny all

    ```


    The above lines allow the host at 192.168.100.110 to send SNMP requests to the
    cache using the SNMP community string p@s5wD, and denies access by any other machine.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_295_0.png)'
  merge: -1
