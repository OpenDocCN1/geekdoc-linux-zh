    # Stopping the Relay-Host Threat


    In the early days of e-mail, the sendmail software was designed to act as an open
    relay. This pretty much hand-in-hand with the original free and open nature of
    the Internet. Once upon a time, if mail.incoming-traveller.com was out of service,
    our company could have used mail.nox.net to relay e-mail to its ultimate destination.
    This was handy and worked well until the days of undisclosed bulk e-mail (UBE),
    or spam. Spammers began using this feature of sendmail to hide the true origin
    of their, diverting attempts to stop or hinder their activities. Around the time
    of sendmail v8.5, some official “hacks” were released to allow administrators
    to prevent open relaying among their servers. With the advent of sendmail v8.9,
    all versions of sendmail forbid any type of relaying, by default. This step in
    the right direction really began to help, the senders of UBE apparently became
    more and more dedicated in their attempts to spam.


    The following syntax would appear when you place any of the FEATURE lines in sendmail.cf—under
    no circumstances would simply not work. The first is straightforward forward:


    ```

    FEATURE (relay_entire_domain)

    ```


    Suppose we place in the .cf file for mailhost.incoming-traveller.com. to accept
    e-mail from our host in domain, incoming-traveller.com. This solves the problems
    users encounter if they send e-mail directly from their desktops, rather than
    via a centralized, outbound mail server:


    ```

    FEATURE (relay_hosts_only)

    ```


    This feature provides somewhat more granular control over what systems your mail
    server will allow relaying. If you use this option in your .cf file, you will
    need to maintain a file called relay-domains in /etc/mail. The relaydomains file
    must explicitly list each host that is allowed to relay, such as www.incoming-traveller.com:


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_237_0.png)'
