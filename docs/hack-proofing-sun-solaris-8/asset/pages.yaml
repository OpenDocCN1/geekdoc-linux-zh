  md: '/etc/cron.d/custom/secure whose permissions are set as rwx-x---, owned by the
    user root and the group ''root''. The scripts can reside in that directory, where
    they are only accessible by the cron daemon when running in the context of the
    user root.


    Another way to improve the security of the cron daemon, especially when running
    cron jobs, is to specify the fully qualified path to any system command that is
    executed. This eliminates the necessity of specifying the PATH and SUPATH variables
    in the /etc/default/cron file, since all system commands are specified completely,
    including the directory where that command can be found.


    # Defending against PATH and Command Substitution


    Another favorite method used by attackers is command substitution. This attack
    succeeds by way of the attacker installing a trojan program, either a script or
    a binary, in a directory that is located earlier in the PATH environment variable
    than that of the real program. This program could be, for example, a script that
    mimics the operation of the real binary but captures the keystrokes of the user
    without being aware of it—a sort of man-in-the-middle attack.


    Detecting this kind of attack is as hard as detecting a logic bomb. However, if
    there is any suspicion that a trojan binary or script has been installed in the
    system in a directory, a simple which will reveal it instantly by returning the
    fully qualified name of the trojan binary rather than the fully qualified name
    of the real program. Another way to detect this kind of attack is to use a file
    integrity checker such as Tripwire. Tripwire can run against directories and adding
    a trojan program or script to a directory would be detected as a change in the
    calculated database signature of that directory, and would result in an alert
    from the Tripwire system. Another simple way to detect this kind of command substitution
    is to use the Find utility.


    Defending against PATH and command substitution requires very little effort on
    the part of the system administrator. The file /etc/default/login can be used
    to specify the default paths for both root and nonroot users. The environment
    variable PATH in /etc/default/login can be used to specify the default path non-root
    users get once they log in. Similarly, the variable SUPATH can specify the default
    path provided to root upon successful login. Finally, proper directory permissions
    allowing only the root user to install new utilities and programs in a system
    directory will deny any attacker the ability to exploit a system using PATH and
    command substitution.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Securing against IP Spoofing


    Another type of attack masquerading one as another. This attack is commonly performed
    in order to exploit a trust relationship between two hosts. Consider the system
    of three Solaris workstations shown in Figure 10.4. Host A and Host B share a
    trust relationship through the rlogin/rsh services.


    # Figure 10.4 Trust Relationships


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_338_0.png)


    Consider the case in which an attacker on Host C wishes to break into Host B.
    The attacker knows that Host B and Host A share a trust relationship, and chooses
    to utilize that fact to execute arbitrary commands on Host B that add a new super-user
    account into Host B''s password file. In order to do this, the attacker on C must
    first disable Host A''s ability to communicate with Host B. This is done by executing
    a TCP SYN flood against Host A to fill up Host A''s TCP connection queue, thereby
    preventing Host A from accepting or responding to any TCP traffic from Host B
    (or any other, host for that).


    Figure 10.5 shows how Host C''s denial of service attack effectively prevents
    any communication with Host A.


    Once Host A has been incapacitated by Host C''s Dos attack, Host C can send spoofed
    packets to Host B using the IP address of Host A. Host B believes it is communicating
    with Host A, when in reality it is communicating with Host C. This is shown in
    Figure 10.6.'
