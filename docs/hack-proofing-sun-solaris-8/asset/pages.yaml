    # Local Events


    This section is used to give us a roundup of the users who have been using the
    system. We want to see who is currently logged in and who has been using the su
    command. The section looks like this:


    ```

    CURRENT_USERS=''who''

    WHO_SU=''tail /var/adm/slulog''

    ```


    ```

    echo "\n*****" >> /export/home/scripts/report

    echo "The users currently logged in:\n$CURRENT_USERS" | cat >>export/home/scripts/report

    echo "\n*****" >> /export/home/scripts/report

    echo "The last 10 users of the su command were:\n$WHO_SU" | cat >>export/home/scripts/report

    echo "\n*****" >> /export/home/scripts/report

    echo "If you were a Hacker, how would you break into this system?" >>export/home/scripts/report

    echo "\n\n" >> /export/home/scripts/report

    ```


    Using the information in this section, we look for an account that should not
    be active. For example, if we see the user account janeill logged on at 7:00 A.M.
    and we know that user rarely gets before 9:00 A.M., we have reason to be suspicious.
    Either janeill is starting early or has forgotten to log out the night before—or
    someone else be using the account. In any case, it needs to be investigated.


    In addition, this tells us who is using the su command. If we see that the user
    janeill has successfully switched to the root account and we know that user should
    not have been able to do so, we have a problem.


    The final line of the script sends the report to the root e-mail address. Using
    the Sendmail alias, we can have the report sent to any e-mail address:


    ```

    cat /export/home/scripts/report | mailx -s "Daily Report from `username-n" root

    ```


