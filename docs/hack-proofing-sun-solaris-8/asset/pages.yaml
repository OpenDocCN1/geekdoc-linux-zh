    # The ipnodes File


    With IPv4, Solaris uses the /etc/inet/hosts file to resolve known hosts. This
    pro-cess is controlled by the nsswitch.conf file in the /etc directory.When a
    process from the local system attempts to connect by hostname to another system
    via IPv4, the nsswitch forces the process to check the /etc/inet/hosts for name
    resolution. With IPv6, Solaris now uses the /etc/inet/ipnodes file to resolve
    known hosts. This is controlled by the ipnodes configuration file structure is
    similar to that of the hosts file. In Figure 8.4, we see two entries in the ipnodes
    file of sturgeon.


    # Figure 8.4 IPv6 Addresses Specified by the ipnodes File


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_265_0.png)


    On the first line, we see the entry for our router, sturgeon.mydomain.com. Like
    the hosts file, this entry assigns the pictured address to the hostname and gives
    it a canonical name of sturgeon. Following this entry, we see an entry for one
    of the nodes on the network, barracuda.mydomain.com. This address allows us to
    reach the system barracuda without the necessity for DNS.'
