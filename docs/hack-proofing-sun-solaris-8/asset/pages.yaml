- pgno: 310
  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    Q: What amount of system resources does Squid require?


    A: Squid does not require an extremely fast processor. Physical memory is the
    crucial resource. For high-volume caches, fast disks are important because the
    bottleneck generally occurs at the disk system. If possible, you should avoid
    using IDE disks if you want to run Squid.


    Q: My logs are growing out of control. Is there any easy way to rotate them?


    A: Squid can rotate logs and create uniquely named copies of the previous log
    files without disruption. Create a cron job to regularly run the following command:


    ```

    /usr/local/squid/bin/squid -k rotate

    ```


    Q: Can I force Squid to send certain requests directly to an Internet site, without
    using the cache? My own Web servers are local and don''t need caching.


    A: You can use the dstdomain acl and always_direct tag for this purpose:


    ```

    acl localservers dstdomain .incoming-traveller.com

    always_direct allow localservers

    ```


    Q: DNS lookups under Solaris are painfully slow. What''s going on?


    A: The Solaris name cache daemon (nscd) is used to cache lookups of host names,
    NIS maps, and other objects On Systems that make heavy use of DNS, like Squid
    servers, nscd can slow down name lookups. To prevent nscd from caching name lookups,
    open /etc/nscd.conf and uncomment the line:


    ```

    enable-cache hosts no

    ```'
