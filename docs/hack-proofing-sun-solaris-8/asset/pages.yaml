- pgno: 32
  md: '# Chapter 1 Introducing Solaris Security: Evaluating Your Risk


    It is a good security practice to implement the use of Authorized banners in /etc/motd
    and /etc/issue, and forcing /etc/profile to display /etc/motd at login time. The
    default /etc/profile allows users to circumvent the display of /etc/motd, so you
    should consider this out of /etc/profile. A sample Authorized Use banner appears
    in the following Security Alert sidebar.


    You should also consider changing the default path variables in /etc/skeleton/local.profile.
    This skeleton directory is only used when creating accounts, so existing accounts
    should have $HOME/.profile modified to match. In this, the default path is /usr/bin:/usr/ucb:/etc:.
    The trailing period signifies an attempt to locate binaries in the current working
    directory if they are not found in /usr/bin or /usr/ucb. A favorite scheme of
    hackers is to create a misspelled command trojan that executes arbitrary commands.
    For example, if a hacker obtains access to root’s home directory, they could create
    a script named “mroe” that performs `rm -rf /` as a denial of service attack.
    This attack would be triggered when the super mistypes “mroe” for “more.” For
    ordinary users, this is only marginally insecure because any trojans would likely
    affect only the individual user. For the superuser, these types of trojans could
    wreak havoc on the system.


    # SECURITY Alert!


    The following is an example of an abbreviated Authorized Use banner, in use by
    the Department of Energy. Your legal department should approve any Authorized
