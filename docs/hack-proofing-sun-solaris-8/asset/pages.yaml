  md: 'Configuring Solaris as a Secure Router and Firewall • Chapter 8


    # # IPv6 Router Procedure


    Let''s now take a look at setting up an IPv6 router. As we have previously, we
    will do this step by step, to ensure that we observe attention to detail. This
    section can also be made into a checklist for the implementation of any IPv6 routers
    that you deploy:


    +   1. **Gather all necessary documentation.** This information includes RFCs,
    checklists, and technical documents. We might include RFCs detailing things as
    the IPv6 Specification RFC (RFC2460) and the autoconfiguration of hosts on IPv6
    networks RFC (RFC2462).


    +   2. **Decide on a design for our network.** The design includes addressing,
    services that will be offered to the IPv6 network such as DNS, names of systems,
    whether or not the systems will also support IPv4, and how the systems will be
    configured for IPv6.


    +   3. **Deploy services we will need for the IPv6 Network.** If we are planning
    to use DNS or anything else needs to be configured specifically for IPv6, we should
    do this ahead of the transition to assure a smooth change of protocol.


    +   4. **Design the IPv6 router.** The router''s design should conform to the
    specifications we decided on Step 2. This includes security concerns, any host-based
    intrusion detection systems we will use, and necessary software. It also includes
    deciding whether the router will be created from an initial install of Solaris
    8 or whether an Solaris 8 system system will be used.


    +   5. **Implement the router.** Build the router according to the specifications
    previously established.


    +   6. **Configure the necessary files for IPv6.** These files include the /etc/inet/ipnodes
    file, the /etc/net/ndpd conf file, the /etc/hostname.interface file(s), and the
    /etc/nsswitch.conf file.


