  md: "# Using Virtual Hosts\n\nVirtual hosts are very useful for controlling the\
    \ identity information that Apache gives out. You may want the world to know your\
    \ public domain name(s), but not your corporate domain name. You can also configure\
    \ Apache to bind to only IP addresses on your system. Network scans will show\
    \ only a Web listening on the IP address that it is bound to, and other addresses\
    \ will not. This can confuse hackers and hide your site's topology. With the Listen\
    \ and Port keywords, you can also configure Apache listen to additional IP addresses\
    \ and TCP ports. An example of this is shown:\n\n```\nListen 192.168.3.42:8081\n\
    BindAddress 192.168.3.40\nPort 80\n<VirtualHost 192.168.3.42>\n  ServerAdmin webmaster@anothersite.com\n\
    \  DocumentRoot /usr/local/anothersite\n  ServerName www.anothersite.com\n  ErrorLog\
    \ logs/anothersite-error_log\n  CustomLog logs/anothersite-access_log common\n\
    </VirtualHost>\n```\n\nIn this sample, the <VirtualHost> section defines a VirtualHost\
    \ called anothersite.com for the IP address we defined with a Listen keyword.\
    \ This address will have to be configured on the system as a logical interface,\
