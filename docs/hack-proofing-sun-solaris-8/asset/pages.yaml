- pgno: 149
  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to www.synergy.com/solutions
    and click on the “Ask the Author” form.


    Q: Will SEAM interoperate with MIT Kerberos?


    A: In general, yes, SEAM uses a different method of authenticating secure RPC
    transactions, so SEAM’s kadmin may work with an MIT KDC and vice versa. In addition,
    ksu does not exist in SEAM. The functionality and detailed role management offered
    ku is provided through the conventional sum command and PAM. All sites, with an
    existing MIT Kerberos infrastructure should find the installation and configuration
    of SEAM very similar.


    Q: All I can find are Linux modules. Will these work under Solaris?


    A: Linux uses a slightly different set of declarations for PAM functions. However,
    most PAM modules originally written on Linux will compile and operate correctly
    under Solaris.


    Q: I can’t find a pam.conf on my Solaris 2.x system. What’s going on?


    A: Solaris 2.5.1 supported PAM in a minimal, inflexible way. All PAM authentication
    functions were rolled into one big module pam_authen, which was used by PAM-aware
    applications. Changing PAM modules requires replacement of the entire module,
    at the expense of security or usability. Solaris 2.6 introduced the PAM system
    described in this text. Modules compiled on 2.6 will generally operate as designed
    through any recent Solaris version.


    Q: I make changes to NIS maps, and they push successfully, but often a long time
    elapses before the changes take effect. What’s happening?


    A: Solaris uses the names cache daemon (nscd) to cache NIS maps and DNS. The length
    of time between a real change and when it is reflected by nscd can range from
    a few minutes (for password entries) to an'
  merge: -1
