    # Step 3: Test the System


    Test the system by attempting to reach one interface of the system through the
    other. The purpose of this test is to confirm that one interface on the system
    is not reachable via the other interface. In a typical multihomed host configuration,
    the system has at two interfaces connected to different segments of network and
    incapable of communicating with one another without sending traffic to a router.
    You can perform this test using one any number of network debugging tools. One
    way to run the test is to use the source-routing functionality of the traceroute
    program.


    In this example, we see that traceroute executes on Solaris machine, and the traffic
    is directed at another Solaris machine with two interfaces. The -g flag specifies
    the IP to use as a gateway, which is the Solaris system with two interfaces. The
    end is the other interface of the system. A successful configuration of a multihomed
    host results in the failure of this test.


    # Routing IP Version 6


    Beginning with versions distributed from February 2000 and later, Solaris 8 is
    IP version 6 capable. It is not possible to configure an interface to communicate
    with IPv6 host on the network and retain IPv4 communications. This process is
    known as running a dual stack. A Solaris system can be configured to run strictly
    IPv6 by removing the hostname.file, although this configuration could cause problems
    when communicating with IPv4 hosts that do not currently support IPv6. makes it
    possible for Solaris to function in any IPv6 environment as a host, gateway, or
    router.


    In this section, we discuss setting up a Solaris IPv6 router. We talk about the
    file configurations necessary to make IPv6 functional. We also discuss the programs
    necessary to IPv6. However, we do not discuss the protocol, since there are better
    documents that do so. It is recommended that a user interested in setting up IPv6
    for the first time reference the appropriate RFCs.'
