- pgno: 299
  md: '# Using Squid on Solaris • Chapter 9 275


    Directory Access Protocol (LDAP), Server Message Block (SMB) for Windows NT or
    Samba, Pluggable Authentication Modules, as described in Chapter 4, offer the
    most flexible method. For the purposes of this chapter, we will describe NCSA
    authentication, as it is the most common.


    All forms of Squid authentication are handled by an external program, defined
    in squid. The user''s credentials are passed to the program, which attempts to
    verify them and then informs the Squid process whether access is allowed or denied.
    Clients remain authenticated by IP address for a certain length of time. Once
    that has expired, the client will have to authenticate again. This is not ideal,
    as someone may inadvertently walk from a workstation that is authenticated to
    the proxy, but it is the only way for squid to handle authentication in a reasonably
    unobtrusive manner.


    The NCSA authentication program, ncsa_auth, is built at installation time. To
    add it, enable the following line to your squid:


    ```

    authenticate_program /usr/local/squid/bin/ncsa_auth /etc/passwd.squid

    ```


    The file /etc/passwd.squid contains username and encrypted password pairs generated
    by Apache''s htpasswd command. While it is inconvenient to require multiple passwords
    for different uses, we strongly recommend that the Squid access password be different
    from other passwords, such as those for electronic mail or shell access. There
    is no mechanism in the HTTP specification to secure basic authentication, other
    than to tunnel it through SSL (which Squid browsers handle for proxy connections),
    so the password is sent to the Squid host in the clear. For this reason, the password
    should be unique and changed frequently. The password file itself consists of
    pairs of usernames and encrypted passwords, separated by colons. For example:


    +   - scarter:43ergo3sdgjI

    -joniell:er@wc3s/S''.G

    tealc:E/sdrgig#f9sd

    djackson:r4erg45jddj90

    ghammond:TYYghth09fs9%

    -mayborne:(q49uv#cv3Sge


    # Access Control for Users


    As an example, suppose our employees should only use the proxy during normal business
    hours. However, our sysadmin is allowed access at any time, as his


