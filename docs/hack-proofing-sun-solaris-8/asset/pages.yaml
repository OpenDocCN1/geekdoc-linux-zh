  md: '# Securing Solaris Freeware Security Tools • Chapter 3


    Once the system is on the network, you will need to install Snort and configure
    files. At this point, you will need to take some extra precautions with the system.
    If it sniffs all your traffic, any compromise could take this valuable tool offline,
    and it could give up secrets of your network traffic to any intruder willing to
    dig through the log files. I suggest to use Snort with the -s switch. This will
    cause Snort to log its information to the syslog. If you have a network logging
    system, you may want to point Snort''s log output to that. That way, if your sniffer
    is compromised, an intruder will not be able to delete or peruse IDS logs.


    You will also want to generate a set of static arp entries for the system to learn
    and publish. Assume that your system is behind the firewall, on the same segment
    as your Web server and mail server. A poisoned arp cache, which we discussed earlier,
    can lead to all sorts of network havoc. Worst of all, since source and destination
    are initially based on hardware addresses, not IP addresses, Snort may be tricked
    into ignoring traffic on an apparent IP address matching rule, when in reality
    traffic is headed towards a vulnerable target. You would generate a file /etc/ethers
    on your system and populate it accordingly:


    | 10.1.1.30 | 08:00:29:f1:cc:66 | pub |

    | 10.1.1.31 | 08:00:20:a8:99:14 | pub |


    The pub keyword tells the system that this arp entry is to be published and any
    arp request for the 10.1.1.30 or 10.1.1.31 IP addresses will elicit a response
    from the local system. You put this information into the local arp cache with
    the arp command:


    ```

    %arp -f /etc/ethers

    ```


    That''s all there to it, and you have just taken a big step towards protecting
    yourself from layer 2 mischief!


    To be extra cautious, you should install SSH and disable all other services on
    the system, including RPC services. Since this is a dedicated network sniffer,
    the system has no other legitimate role on your network and therefore does not
    need to run any other software than SSH and Snort. To be cautious to the point
    of paranoia, you could also clip the transmit of the 4 Category 5 ethernet cable
    leading from the system to the switch or hub. This means that you will not be
    able to receive data from the system, so SSH will be useless and syslog logging
    will work, but since Snort is only interested in receiving traffic, the half-cable
    will work fine. Keep in mind that some network hardware will not


