    Generating this type of shellcode involves creating the exploit to be injected
    into the vulnerable buffer, compiling, then using a debugger as gdb to generate
    the hex representation of the binary code. Once this code is obtained, it is written
    into a program that will inject it into the exploitable buffer. When the shell
    code is executed it sets up a simple shell environment where the command to be
    executed is in the case of Cheez Wiz''s exploit, this command:


    ```

    echo ingressock stream nowait /bin/sh -i >>

    /tmp/x; /usr/sbin/inetd -s /tmp/x

    ```


    Preventing buffer overflows is quite literally a race against time. Defending
    against buffer overflows depends on how quickly Sun can patch against known buffer
    overflow vulnerabilities. However, there is some defense available, buffer overflows
    tends to require that a stack be executable and is possible to turn this off.
    This is done by adding the following lines to the /etc/system file:


    ```

    set noexec_user_stack = 1

    set noexec_user_stack_log = 1

    ```


