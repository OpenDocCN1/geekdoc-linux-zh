- pgno: 242
  md: '# Summary


    The last section, where we looked at rulesets, may seem obscure to most and confusing
    to some readers. Admitted, sendmail rulesets appear daunting and intimidating
    at first glance. Most rules work on the same basic LHS and RHS principles introduced
    in this chapter. The key to really understanding the rules is to learn the rule
    syntax, including seeming definitions of classes and macros. If you take your
    quest for sendmail into the depths of the configuration file, you will undoubtedly
    be rewarded with a better understanding of one of the most popular e-mail transfer
    programs available today. The basic rules discussed in this chapter may be of
    real use in your situation, depending on your production environment. Always test
    your changes on nonproduction systems because even the smallest changes may have
    unpredictable results.


    Finally, all administrators should remember that their actions in configuring
    and securing publicly available systems eventually have an impact on the Internet
    community as a whole. The time to deploy secure mail and Web servers on the Internet
    will gain the appreciation of your peers. In the event that you make a mistake
    and deploy an insecure system, taking quick corrective action will be viewed as
    a responsible and appropriate action.


    # Solutions Fast Track


    # Configuring the Security Features of an Apache Web Server


    +   - Write your CGI scripts with security as the first consideration.

    - Configure your cgi-bin directories and restrict access to them as needed.

    - Protect other parts of your Web tree with the <Directory> directive. You can
    restrict based on hostname, IP address, or several other criteria.

    - Use Apache’s VirtualHost directive to hide the identity of your Web servers.
    Used in conjunction with multiple IP addresses, you may obtain some level of security
    for your systems.'
  merge: -1
  img_proc: true
