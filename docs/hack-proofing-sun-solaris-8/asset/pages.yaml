    # Configuring the Security Features of Sendmail


    As a Solaris administrator, you will encounter two versions of sendmail: the Sun-supplied
    version and the more widely used version, found at www.sendmail.org. Unfortunately,
    Sun''s sendmail is not updated as regularly as the version-maintained by the Sendmail
    Consortium, so any new bugs or vulnerabilities found in sendmail are not immediately
    addressed by Sun. The Consortium, on the other hand, often issues warnings, workarounds,
    and patches within hours or a day of discovery. In a word, Sun''s configuration
    and implementation of sendmail is a bit convoluted, you may find it easier to
    download a copy of Sendmail from the previously mentioned Web site and start from
    scratch. Once you have downloaded and compiled the Consortium version of sendmail,
    you will need to turn your attention to creating a decent sendmail.cf file.


    The sendmail.cf file starts life as a file called sendmail.mc. The .mc file is
    a file of m4 macros. You may use m4 to read the mc file, in conjunction with a
    supplied m4 configuration file, to generate the sendmail.cf file. A mostly basic
    sendmail.file, with a few security-minded additions, would look like this:


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_233_0.png)'
  merge: -1
  img_proc: true
