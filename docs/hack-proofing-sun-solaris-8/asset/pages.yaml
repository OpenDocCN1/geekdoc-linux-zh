  md: '# Table 6.1 Commonly Used Forms of the xauth Command


    | Command | Explanation |

    | --- | --- |

    | xauth info | Shows current authorization status. |

    | xauth list | Lists each of the magic cookies available. |

    | xauth extract - myhost:0 > $HOME/xauth.key | Extracts the magic cookie for myhost:0
    into the binary file $HOME/xauth.key. |

    | xauth merge - <xauth.key | Imports the magic cookie from the binary file xauth.key.
    |

    | xauth nextract - myhost:0 > $HOME/xauth.key | Extracts the magic cookie for
    myhost:0 into the ASCII file $HOME/xauth.key. The ASCII format would be more suitable
    to nonbinary transmission formats as e-mail. |

    | xauth nmerge - <xauth.key | Imports the magic cookie from the ASCII file xauth.key.
    |

    | xauth | Enters interactive mode and provides you with prompt, similar to interactive
    mode for telnet, ftp, and nslookup. |


