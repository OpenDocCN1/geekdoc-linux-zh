    Ideally, when changes are made to the system they are listed in the changelog
    as entries that include the date the change was made, who made the change, and
    some brief detail about the change. That way, if you notice any changes to the
    system that have not been logged in the system journal, you can begin an investigation
    to determine the source of the unauthorized changes.


