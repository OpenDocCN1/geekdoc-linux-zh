    # Advanced Portscanning


    From time to time, users will request the installation of various software packages.
    It is an excellent practice to review all documentation about the new software
    before conducting the installation, especially with an eye towards security. The
    real world rarely affords the overworked administrator such a luxury, and software
    is often hastily installed, configured and forgotten about. From the perspective
    of best practices security, this is simply unacceptable and will eventually lead
    to the compromise of a system.


    A good plan to allow for such haste, but to minimize risks, would be to run a
    portscanner against one or all of your systems (at your discretion). The output
    should then be carefully reviewed, remediation measures undertaken and the changes
    verified.


    The first step is to devise a script that can be either manually, or out of cron,
    to invoke Nmap on your administrative machine. The command line syntax of Nmap
    makes this easily accomplished with just a few more arguments than those we have
    already seen. Let''s assume that we want to scan www.incoming-traveller.com, the
    company mail server with POP3, IMAP and SMTP services. To do this, we would put
    together a small script, like this:


    ```

    #!/bin/sh


    LOG=/path/to/root-read-write-only-directory/file


    /path/to/nmap -sT -sU www.incoming-traveller.com mail.incoming-traveller.com -oN
    $LOG

    cat $LOG | mailx -s "nmap output" scarter@incoming-traveller.com

    ```


    This script should be run out of root''s crontab once a week. The -sT and -sU
    options tell Nmap to log output in humanreadable form to the specified file. We
    simply mail this back to the administrator when Nmap is finished.


    ![](img/ab996f014aa8c5c7de3d77cc73ef5ce3_100_0.png)'
