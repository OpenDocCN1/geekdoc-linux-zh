    to patch the PCMCIA support to the standard kernel. [PCMCIA Support]() in this
    document.


    # IBM 10/100 EtherJet PCI


    Status: Supported, Driver Name: eipro100


    This card is reported to be compatible with the Intel ExpressPro 100 driver.


    # IBM Token Ring


    Status: Semi-Supported, Driver Name: ibmtr


    To support token ring requires more than only writing a device driver, it also
    requires writing the source routing routes for token. It is the source routing
    would be the most time consuming to write.


    Initial driver development was done with IBM ISA and MCA token ring cards, and
    tested on an MCA 16/4 Megabit Token Ring board, but it should work with other
    Tropic based boards.


    # 4.21 ICL Ethernet Cards


    # ICL EtherTeam 16i/32


    Status: Supported, Driver Name: eth16i


    This driver supports both the ISA (16i) and EISA (32) versions of the card. It
    uses the Fujitsu MB86965 chip that is also used on the a1700 cards.'
  - '[PAGE 52]


    # 4.22 Intel Ethernet Cards


    Note that the naming of the various Intel cards is ambiguous and confusing at
    best. If in doubt, check the i8xxxxx number on the main chip on the card or for
    PCI cards, use the PCI information in the /proc directory and compare it to the
    numbers listed here.


    # Ether Express


    Status: Supported, Driver Name: eepress


    This card uses the i82586. Earlier versions of this driver (in v1.2 kernels) were
    classed as alpha-test, as it didn''t work for most people. The driver in the v2.0
    kernel seems to work better for those who have tried it, although the driver source
    lists it as experimental and problematic on faster machines.


    The comments at the top of the driver source list of the problems (and fixes!)
    associated with these cards. The slowdown after replacing all the outb with outb_p
    in the driver has been reported to cause lockups for at least one user. Also check
    the size of the RAM buffer reported by the driver matches what the Intel configuration
    utility reports.


    # Ether Express PRO/10 (PRO/10+)


    Status: Supported, Driver Name: eepro


    Bao Chau Ha has written a driver for these cards that have been included into
    early 1.3.x kernels. It may also work with some of the Compaq-built Ethernet systems
    that are based on the i82595 chip. You may have to use the configuration utility
    that came with the card to disable PnP support where applicable.


    # Ether Express PRO/10 PCI (EISA)


    Status: Semi-Supported, Driver Name: ? (distributed separately)


    There is a driver for the PCI version that is distributed separately from the
    default kernel. These cards use the PLX9036 PCI interface chip with the Intel
    i82596 LAN controller. If your card has the i82557 chip, you don''t have this
    card, but the version discussed next, and have the EEPro100 driver instead.


    You can get the alpha driver for the PRO/10 PCI card, with instructions on how
    to use it:


    EEPro10 Driver


    If you have the EISA card, you will probably have to hack the driver a bit to
    account for the different (PCI vs. EISA) detection mechanisms that are used in
    each case.


    # Ether Express PRO 10/100B


    Status: Supported, Driver Name: eepro100


    Note that this driver will not work with the older 100A cards. The chip numbers
    listed in the driver are i82557/i82558. For driver updates and/ driver support,
    have a look at:'
  - '[PAGE 53]


    # Linux Ethernet–HowTo


    EEPro–100B Page


    # 4.23 Kingston


    LinkSys made various cards, including NE2000+, AMD PCnet based cards, and DEC
    tulip based cards. Most of these cards should work fine with their respective
    driver. See Kingston Web Page


    # 4.24 LinkSys


    LinkSys made a handful of different NE2000 clones, some straight ISA cards, some
    ISA plug and play some even ne2000–PCI clones based on one of the supported ne2000–PCI
    chipsets. There are just too many models to list here.


    LinkSys are linux–friendly, with a linux WWW support page, and even have Linux
    printed on the boxes of their products. Have a look at:


    ```

    http://www.linksys.com/support/solution/nos/linux.htm

    ```


    # LinkSys Ethernet 10/100 Cards.


    Status: Supported, Driver Name: tulip


    Note that with these cards have been several ‘revisions’ (i.e. different chipset
    used) all with the same card name. The 1st used the DEC chip. The 2nd revision
    used the Lite–ON PNIC 82c168 PCI Network Interface Controller, and the 3rd revision
    of the cards uses LinkSys 82c169 NIC chip. Support for the latter two have been
    merged into the standard tulip driver — you may need a driver upgrade to support
    for them depending on how old your current driver is.


    More PNIC information is available at:


    ```

    http://www.scyld.com/linux/drivers/pnic.html

    ```


    More information on the various versions of these cards can be found at the LinkSys
    WWW site mentioned above.


    # LinkSys Pocket Ethernet Adapter Plus (PEAEPP)


    Status: Supported, Driver Name: de620


    This is supposedly a DE–620 clone, and is reported to work well with that driver.
    See DE–620 for more information.


    # LinkSys PCMCIA Adaptor


    Status: Supported, Driver Name: de650 (?)


    This is supposed to be a re-badged DE–650. See DE–650 for more information.'
