    Status: Supported, Driver Name: pcnet32


    This is AMD''s 100Mbit chip for PCI systems, which also supports full duplex operation.
    It was introduced in June 1996.


    # AMD 79C972 (PCnet–FAST+)


    Status: Supported, Driver Name: pcnet32


    This has been confirmed to work just like the ''971.


    # AMD 79C974 (PCnet–SCSI)


    Status: Supported, Driver Name: pcnet32


    This is the PCnet–SCSI — which is basically treated like a ''970 from an Ethernet
    point of view. Also see the above information. Don''t ask if the SCSI half of
    the chip is supported — this is the Ethernet–HowTo, not the SCSI–HowTo.


    # 4.5 Ansel Communications


    # AC3200 EISA


    Status: Semi-Supported, Driver Name: ac3200


    Note that to access this driver make `config` you still have to answer `Y` when
    asked `Prompt for development/or incomplete code drivers/` at the first. This
    is due to lack of feedback on the driver stability due to it being a relatively
    rare card.


