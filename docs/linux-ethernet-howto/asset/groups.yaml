    cable with 50 ohm terminators, to stub $2 ea, for a part. It’s also vital that
    your cable have no ‘stubs’ — the `T` connectors must be attached directly to the
    ethers.


    There are two major drawbacks to using thinnet. The first is that it is limited
    to 10Mbps/sec–100Mbps/sec requires twisted pair. The second drawback is that if
    you have a big loop of machines connected, and some bonebreaks the loop by taking
