    # 1. Introduction


    The Ethernet–Howto covers what cards shows and shouldn''t; how to set them up,
    how to run more than one, and other common problems and questions. It contains
    detailed information on the current level of support for all common cards available.
    It does not cover the software end of things, as is covered elsewhere. Also note
    that general specific questions about Ethernet are not (at least they should not)
    answered here. For those types of questions, see the excellent amount of information
    in comp.lansnet.com. You can get FTP from rtf.mit.edu just like all the other
    news. This present revision covers distribution up to.


    The Ethernet–Howto is by: Paul Gortmaker, gortmaker@yahoo.com


    The primary source of information for the initial version of Ethernet–Howto was:
    Donald J. Becker, becker@yld.com


    # Linux Ethernet–Howto


    who thank for writing a lot of the ethernet drivers that are presently available
    for Linux. He is also the original. This document is (c) 1993–2000 by Paul Gartner.
    Please see the Disclaimer and Copying information at the end of this document
    for information about redistribution and we are not responsible for what you manage
    to break...


    ## New Versions of this Document


    New versions of this document can be retrieved: Sunsite Ethernet–HOWTO Archive.
    This is the ''official'' location – it can also be found on various Linux ftp
    mirror sites. Updates will be made as new information becomes. If this copy you
    are reading is more than 6 months old, then you should check to see if an updated
    copy is available in various formats (postscript, dvi, HTML, etc.). I recommend
    viewing it in HTML (via a WWW browser) or the Postscript/dvi format. Both of these
    contain cross-references that are not included in the text ASCII format.


    As this guide is getting bigger and bigger, you probably won''t want to spend
    the rest of your afternoon reading the whole thing. And the good news is that
    you don''t have to read all. The HTML and Postscript/dvi versions have a table
    of contents which will help you find what you need faster.


    Chances are you reading this document because you can''t get to work and you don''t
    know what to do or check. The next section (HELP It doesn''t work!) is aimed at
    newcomers to linux and will point you in the right direction. Typically the problems
    that we encounter are asked over and again by different people. Your specific
    problem or question is one of Frequently Asked Questions, and is answered in the
    FAQ section. Everybody should look through this section before posting for help.


    If you haven''t got an ethernet card, then you will want to start deciding on
    a card. (What card should I buy...)


    If you have already got an ethernet card, but are not sure if you can use it with
    Linux, then you will want to read the section which contains specific information
    on each manufacturer and your cards. (Vendor Specific...)


    If you are interested in the technical aspects of the linux device drivers, then
    you can have a browse of the section with this type of information. (Technical
    Information)


    ## 1.3 HELP – It doesn''t work!


    Okay, don''t panic. This will lead you through the process of getting things working,
    even if you have no prior background in linux or ethernet hardware.


    First thing you need to figure out what model your is so you can determine if
    Linux has a driver for that particular card. Different cards typically have ways
    of being controlled by the host computer, and the linux driver (if there is one)
    contains this information in a format that allows linux to use the card. If you
    don''t have any manuals or anything of the sort that tell you about the card model,
    you can try the section on helping with your mystery card (reference section:
    Identifying an Unknown Card).


    Now that you know what type of card you have, read details of your card in the
    specific section (reference section: Vendor Specific...) which lists in alphabetical
    order, card manufacturers, individual model numbers and whether it has a driver
    or not. If it is like ''Supported'' you can get pretty much off. If you don''t
    find your card in list, then check to see if your card lists it being ''compatible''
    with another card type. There are examples here, thousands of different cards
    are compatible with the original Novel NE2000 design.


    Assuming you have found out that a linux driver exists for your card, you now
    have to find and make use of it. Just because the operating system is first loaded
    at boot, and contains drivers for various, among other things.) Depending on which
    particular distribution you are using, there may be only a few pre-built kernels
    and a bunch of drivers separate. About half of the problems people have are related
    to not having driver loaded another, so you may find things work.


    At this point you should have some method of booting the kernel with your driver
    in, or loading it as a module. See the information came with your distribution
    on installation and using modules, along with the module section in this document.
    (Using the Ethernet Drivers as Modules)

