    # Linux Ethernet-Howto


    find your card said AMD and the above number. The 7990 is the original ‘LANCE’
    chip, but most stuff (including this document) refer to all these similar chips
    as ‘LANCE’ chips. (...incorrectly, I might add.)


    These numbers refer to chips from AMD that are the most mentioned ethernet cards.
    The Allied Telesies AT1500 [AT1500] and the NE1500/2100 [NE1500] use these chips.


    The 7990/79c90 have been replaced by newer versions. The 79c60 (a.k.a. PCNet-ISA)
    contains the 79c6 core, with all the extra hardware support, which brings a single-chip
    ethernet solution. The 79c61 (PCNet+ISA) is a jumperless Plug Play version of
    the ‘960. The final chip in the ISA series is the 79c61a (PCNet+ISA), which adds
    full duplex capabilities. All none of these chips should work with the lance.c
    driver, with the exception of very old cards that used the 7990 in a shared memory
    configuration. These old cards can be spotted by the jumpers of a DMA channel.


    One common problem is the ‘busmastership arbitration failure’ message. This is
    printed out when the LANCE driver cannot access the bus after a reasonable amount
    of time has elapsed (50us). This usually indicates that the motherboard implementation
    of bus-mastering DMA is broken, some other device is hogging the bus, or there
    is a DMA conflict. If your BIOS setup the ‘GAT’ option (for Guaranteed Access
    Time) try toggling/altering to see if it helps.


    Note that the driver looks at the addresses: 0x300, 0x320, 0x340, 0x360 for a
    valid card, and any address supplied by an ether= argument is ignored (this will
    be fixed) so make sure your card is configured for one of the above I/O addresses
    for now.


    The driver will work fine, even if 16MB of memory is installed, low-memory ‘bounce-buffers’
    are used when needed (i.e. any data from above 16MB is copied into a buffer before
    16MB before giving the card to transmit).


    The DMA channel can be set with the low bits of the otherwise–unused dev->mem_start
    value (a.k.a. PARAM_1). If unset it is probed by enabling each free DMA channel
    in turn and checking initialization sequences.


    See Notes on AMD..., for more info on these chips.


    # AMD 79C965 (PCnet–32)


    Status: Supported, Driver Name: pcnet


    This is the pcnet–32 — a 32 bit bus-master version of the original LANCE chip
    for VL–bus and local bus systems. While chips can be operated with the standard
    lance.c driver, a 32 bit version (pcnet.32.c) is also available that does not
    have to concern itself with any 16MB limitations associated with the ISA bus.


    # AMD 79C70/970A (PCnet–PCI)


    Status: Supported, Driver Name: pcnet32


    AMD 79C965 (PCnet32)'
