    # Linux Ethernet-Howto


    For those not in the know: BPF (the Berkeley Packet Filter) is an mechanism for
    specifying the kernel networking layers packets you are interested in. It''s implemented
    as a specialized language interpreter built into a low level of the networking
    code. An application passes a program in this language to the kernel, and the
    kernel runs the program on each incoming packet. If the kernel has multiple BPF
    applications, each program runs on each packet.


    The problem is that it''s difficult to deduce what kind of packets the application
    is really interested in from the packet filter stream, the general solution is
    to always run the filter. Imagine a program that registers a BPF packet to pick
    up a low data-rate stream to a multicast address. Most ethernet cards have a hardware
    multicast filter implemented as a 64 entry hash table that ignores most unwanted
    multicast packets, so the capability exists to make this a very inexpensive operation.
    But with the BPF kernel must switch the filter to promiscuous mode, receive _all_packets,
    and run them through this filter. This is work, that''s very difficult to account
    back to the process requesting the packets.


    # 8. Networking with a Laptop/Notebook Computer


    There are several ways to put your laptop on a network. You can use the SLIP code
    (and run at serial speeds); you can get a notebook with supported PCMCIA slot
    built-in; you can get a laptop with a docking station and plug in an ISA ethernet;
    or you can use a parallel port ethernet adapter.


    # 8.1 SLIP


    This is the cheapest, but by the far most. Also, you will not get very high transmission
