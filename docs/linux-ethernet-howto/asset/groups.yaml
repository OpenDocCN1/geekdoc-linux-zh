    cards should use. (The 300 is an 8 bit pseudo NE1000 clone, and the 400 is a pseudo
    NE2000 clone.)


    # 4.16 Digital / DEC


    # DEPCA, DE100/1, DE200/1/2, DE210, DE422


    Status: Supported, Driver Name: depca


    There is documentation included in the source file ''depca.c'', which includes
    info on how to use more than one of cards in a machine. Note that the DE422 is
    based on the EISA card. These cards are all based on the AMD LANCE chip. See AMD
    LANCE for more info. A maximum of two of the ISA cards can be used, because they
    can only be set for 0x300 and 0x200 I/O address. If you are intending to do this,
    please read the notes in the driver source file depca.c in the standard kernel
    source tree.


    This driver will also work on Alpha CPU machines, and there are various ioctl()s
    that the user can play


    # Digital EtherWorks3 (DE203, DE204, DE205)


    Status: Supported, Driver Name: ewkr3


    These cards use a proprietary chip from DEC, as opposed to the LANCE chip used
    in the earlier cards like the DE200. These cards support both shared memory or
    programmed I/O, although you take about a 50%performance hit if you use PIO mode.
    The shared memory can be set to 2KB, 32KB or 64KB, and only 2 and 32 have been
    tested with this. David says that the performance is virtually identical to the
    2KB and 32KB mode. There is more information (including the driver as a loadable
    module) at the top of the driver file ewkr3.c and also in README.ewkr3. Both of
    these files come with the standard kernel distribution. This driver has Alpha
    CPU support like depca does.


    The standard driver has a variety of interesting ioctl()s that can be used to
    get clear packet statistics, read/write the EEPROM, change the hardware address,
    and the link. Hackers can see the source code for more info on that.


    David has also written a configuration utility for this card (along the lines
    of the DOS program NICSETUP.EXE) with other tools. These can be found on Linux
    FTP sites in the directory /pub/linux/system/Network/management --- look for the
    file ewkr3tools-X.XX.tar.gz.


    # DE425 EISA, DE434, DE435, DE500


    Status: Supported, Driver Name: de4x5, tulip


    These cards are based on the 21040 chip mentioned above. The DE500 uses the 21140
    to provide 10/100Mbps ethernet connections. Have a read of the 2140 section below
    for extra info. There are also some compile-time options available for non–DEC
    cards with this driver. Have a look at README.de4x5 for details.


    All the Digital cards support autopatch for their media (temporarily, the DE500
    due to a patent issue).


    # 4.16 Digital / DEC'
  - '[PAGE 48]


    # Linux Ethernet-Howto


    This driver is also Alpha CPU ready and supports being loaded as a module. Users
    can access the internals through ioctl() calls — see the ''ew3'' code and the
    de45x.c sources for information about how to do this.


    # DEC 21040, 21041, 2114x, Tulip


    Status: Supported, Driver Name: de45x, tulip


    The DEC 21040 is a bus-mastering single chip solution from Digital, similar to
    AMD''s PCnet chip. The 21040 is specifically designed for the PCI bus architecture.
    Apparently these chips are no longer produced, as Intel has bought the semiconductor
    portion of DEC and favouring their own chip(s).


    You have a choice of two drivers for cards on this chip. There is the DE425 driver
    discussed above, and the generic 21040 ''tulip'' driver.


    Warning: Even though your card may be based on this chip, the drivers may not
    work for you. David C. writes:


    > There are no guarantees that either ''tulip''.c OR ''de45x.c'' will run any
    DC2114x card other than those they''ve been written to support. WHY?? You ask.
    Because there is a register, the General Purpose Register (CSR12) that (1) in
    the DC21140a is programmable by each vendor and they all do it differently (2)
    in the DC21142/3 this is now an SIA control register (a DC21041). The only small
    ray of hope is that we can decode the SROM set up by the driver. However, this
    is not a guaranteed solution for some vendors (e.g. SMC 932 card) don''t follow
    the Digital Semiconductor recommended SROM programming format.


    In non-technical terms, this means that if you''re not sure an unknown card with
    a DC2114x chip will work with the tulip driver(s), make sure you can return the
    card to the place of purchase before you pay for it.


    The 21041 chip is also found in the set of 21040 on the later SMC EtherPower cards.
    The 21140 is for supporting 100Base-T and works with the Linux drivers for the
    21040 chip. Use David''s de45x driver with non-DEC cards, have a look at README,de45x
    for details.


    If you are having trouble with the tulip driver, you can try the newest version
    from Donald''s ftp/WWW site.


    Tulip Driver


    There is also a (non-exhaustive) list of various cards/vendors that use the 21040
    chip.


