- md: '

    # Linux Ethernet-Howto


    ## ES3210

    Status: Semi-Supported, Driver Name: es3210


    This is an EISA 8390 based shared memory card. An experimental driver is shipped
    with v2.2 kernels and it is reported to work however, the EISA IRQ and shared
    memory address detection appears not to work with (at least) the early revision
    cards. This problem is not unique to the Linux however. In that case, you have
    to supply them to the driver. For example, card IRQ 5 and shared memory 0x0d000,
    with a modular driver, add options es3210 irq=5 mem=0x0d000 to /etc/conf.modules.
    Or with the driver compiled into the kernel, supply at boot ether=5,0,0x0d000,eth0.
    The I/O base is automatically detected and hence a value of zero should be used.


    ## NI5010

    Status: Semi-Supported, Driver Name: ni5010


    You have had to go get the driver for the old 8 bit MiCom-Interlan cards separately,
    but now it is shipped with the v2.2 kernels as an experimental driver.


    ## NI5210

    Status: Semi-Supported, Driver Name: ni52


    This card also uses one of the Intel chips. Michael Hipp has written a driver
    for this card. It is included in the standard kernel as an ''alpha'' driver. Michael
    would like to hear feedback from users who have this card. See Alpha Drivers for
    important information on using alpha-test drivers with Linux.


    ## NI6510 (not EB)

    Status: Semi-Supported, Driver Name: ni65


    There is also a driver for the LANCE based NI6510, and it is also written by Michael
    Hipp. Again, it is also an ''alpha'' driver. For some reason, this card is not
    compatible with the GENERIC driver. Alpha Drivers for important information on
    using alpha-test drivers with Linux.


    ## EtherBlaster (aka NI6510EB)

    Status: Supported, Driver Name: lance


    As of kernel 1.2.33, the GENERIC driver had a check added to it for the 0x52,
    0x44 NI6510EB specific signature. Others have reported that this signature is
    not the same for all NI6510 cards however, which will cause the lance driver to
    not detect yours. If this happens to you, you can change the probe (at about line
    322 in lance.c) to print() what the values are for your card and then use instead
    of the 0x52, 0x44 defaults.


    The cards should be run in ''high-performance'' mode and not in the NI6510 compatible
    mode when using the lance driver.


    ## 4.31 RealTek


    ### RealTek RTL8002/8012 (AT–Lan–Tec) Pocket adaptor

    Status: Supported, Driver Name: atp


    This is a generic, low–cost OEM pocket adaptor being sold by AT–Lan–Tec, and (likely)
    a number of suppliers. A driver for it is included in the standard kernel. Note
    that there is substantial information contained in the driver source file `atp.c`.


    Note that the device name you pass to ifconfig was not eth0:atp0 for earlier versions
    of the driver.


    ### RealTek 8009

    Status: Supported, Driver Name: (+8390)


    This is an ISA NE2000 clone, and is reported to work fine with the linux NE2000
    driver. The rset8009.exe program can be obtained from RealTek’s WWW site at http://www.realtek.com.tw
    – or via ftp from the same site.


    ### RealTek 8019

    Status: Supported, Driver Name: (+8390)


    This is a Plug and Pray version of the above. Use the OS software to disable PnP
    and enable jumperless configuration; set the card to a sensible I/O address and
    IRQ should be ready to go. (If using the driver as a module, forget to add an
    `io=xNNN` option to `/etc/conf.modules`). The rset8019.exe program can be obtained
    from RealTek’s WWW site at http://www.realtek.com.tw – or via ftp from the same
    site.


    ### RealTek 8029

    Status: Supported, Driver Name: ne2k–pci (+8390)


    This is a PCI chip implementation of a NE2000 clone. Various vendors are now selling
    cards with this chip. See NE2000–PCI for information using any of these cards.
    Note that this is still a 10+ year old design just glued onto a PCI bus. Performance
    will not be staggeringly better than the equivalent ISA model.


    ### RealTek 8129/8139

    Status: Semi-Supported, Driver Name: rtl8139, 8139too


    Another PCI chip ethernet solution from RealTek. A driver for cards based on this
    chip was included in the v2.03.34 release. You currently have to answer ‘Y’ when
    asked if you want experimental drivers for v2.2 kernels to get access to this
    driver.


    Donald says that cards based on this chip are around the same price (or even cheaper
    in places – 13 bucks!) as a PCI NE2000 clone card, and while the 8139 is not the
    best 10/100 board, it is better than a PCI NE2000 clone card. The 2.4x has another
    driver called 8139ft which was based on rtl839 but tries to address some of the
    common problems people were reporting, so you may wish to try that if using 2.4
    kernel.


    ## 4.32 Sanger NP943

    Status: Semi-Supported, Driver Name: 3c501


    This is a 3c501 clone, with a different prefix. I assume it is equally bad as
    the original 3c501. The driver checks for NP943 and just treats it as 3c501 after
    that. See 3c501 for all the reasons why you don''t want to use one of these cards.


    ## 4.33 Schneider SK G16

    Status: Supported, Driver Name: sk_g16


    This driver was included into the v1.1 kernels, and it was written by Weichmann
    and Bern. It appears that the G16 is similar to the NI6510, in that it is based
    on the first LANCE chip (the 7990). Once again, it appears though this card won''t
    work with the generic driver.


    ## 4.34 SEEQ 8005

    Status: Supported, Driver Name: seeq8005


    There is little information about the card included in the driver, and hence little
    information to put here. If you have a question, you are probably trying to email
    the author as listed in the source.


    ## 4.35 SMC (Standard Micros Corp.)

    The Ethernet part of Western Digital was bought by SMC many years ago. The wd8003
    and wd8013 were the main product. Since then SMC has continued ISA cards (Elite16,
    Ultra, EZ) and also added PCI products to their range.


    Contact information for SMC:

    SMC / Standard Micros Corp.,

    Arkay Drive, New York, 11788, USA

    Technical Support via phone: 800–9962 (USA) and 800–5345 (Canada) and 516–4250
    (Other Countries).

    Literature requests: 800–SMC (USA) and 800–SMC (Canada) and 516–4255 (Other Countries).

    Technical Support via E-mail: techsupport@mail.west.smc.com.

    FTP Site: ftp.smc.com.

    WWW Site: SMC.


    ## WD8003, SMC Elite

    Status: Supported, Driver Name: wd (+8390)


    These are the 8-bit versions of the card. The 8 bit 003 is slightly less expensive,
    but only worth the savings for light use. Note that some of the non-EEPROM cards
    (with jumpers, or old wd8003 cards) have no way of reporting the IRQ line. In
    this case, auto-irq is used, and if it fails, the driver silently assigns IRQ
    5. You can get the SMC setup/driver disks from SMC''s ftp site. Note that some
    of the newer ''SuperDisk'' programs will fail to detect the real old EEPROM-less
    cards. The SMCDS46.EXE seems to be an all-round choice. The old jumpers for all
    larger cards are in ASCII text in the aforementioned archive. The latest version
    can be obtained from ftp. As these are basically the same as their 16 bit counterparts
    (WD8013 / SMC Elite16), you should see the next section for more information.


    ## WD8013, SMC Elite16

    Status: Supported, Driver Name: wd (+8390)


    Over the years the design has added more registers and an EEPROM. (The first wd8003
    cards appeared about ten years ago!) Clones usually by the ''8013'' name, usually
    use a non-EEPROM (jumped). Late model SMC cards have the SMC 83c690 chip instead
    of the Semi DP8390 found on earlier cards. The shared memory design makes the
    bits a bit faster than PCI cards, especially with larger packets. More importantly,
    from the driver''s point of view, it avoids a few bugs in the programmed-I/O mode
    of the 8390, allows multi-threaded access to the packet buffer, and it doesn''t
    have a programmed-I/O data register that handles your machine during warm-boot
    processes.


    Non-EEPROM cards that can''t just read the selected IRQ will attempt-irq, and
    if that fails, will silently assign IRQ 10. (8 bit versions will assign IRQ 5)


    Cards with a standard amount of memory can have the memory size specified at boot
    (or as an option in /etc/conf.modules if using). The standard memory size is 8KB
    for an 8 bit card and 16KB for a 16 bit card. For example, the WD8003EBT cards
    could be jumped for 32KB memory. To make full use of RAM, you would use something
    like (for I/O=0x280 and IRQ 9):


    ```

    LILO: linux ether9,0x280,0xd0000,0xd8000,eth0

    ```


    Also see 8013 problems for some of the common problems and frequently asked questions
    that pop up often.


    ## SMC Elite Ultra

    Status: Supported, Driver Name: smc-ultra (+8390)

    '
