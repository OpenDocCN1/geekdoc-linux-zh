    # 1.3 HELP – It doesn''t work!


    Okay, don''t panic. This will lead you through the process of getting things working,
    even if you have no prior background in linux or ethernet hardware.


    First thing you need to figure out what model your is so you can determine if
    Linux has a driver for that particular card. Different cards typically have ways
    of being controlled by the host computer, and the linux driver (if there is one)
    contains this information in a format that allows linux to use the card. If you
    don''t have any manuals or anything of the sort that tell you about the card model,
    you can try the section on helping with your mystery card (reference section:
    Identifying an Unknown Card).


    Now that you know what type of card you have, read details of your card in the
    specific section (reference section: Vendor Specific...) which lists in alphabetical
    order, card manufacturers, individual model numbers and whether it has a driver
    or not. If it is like ''Supported'' you can get pretty much off you. If you don''t
    find your card in list, then check to see if your card lists it being ''compatible''
    with another card type. There are examples here, thousands of different cards
    are compatible with the original Novel NE2000 design.


    Assuming you have found out that a linux driver exists for your card, you now
    have to find and make use of it. Just because the operating system is first loaded
    at boot, and contains drivers for various pieces of hardware, among other things.)
    Depending on which particular linux distribution you are using, there may be only
    a few pre-built kernels and a bunch of drivers separate modules, or there be a
    whole lot of kernels, covering a vast of built-in driver combinations.


    Most distributions ship with a bunch of small modules that are the drivers. The
    required modules are typically loaded in the boot process, or on-demand if a driver
    is needed to access a particular device. You will need to attach this module to
    the kernel after it has booted up. See the information came with your distribution
    on installation and using modules, along with the module section in this document.
    (Using the Ethernet Drivers as Modules)


    If you didn''t find a pre-built kernel with your driver, or a module form of the
    driver, chances are you have a typically uncommon card, and you will have to build
    your own kernel with that driver. Once you have linux installed, building a custom
    kernel is not difficult at all. It will answer yes or no to what you want the
    kernel to contain, and then tell it to build. It is a Kernel-How-To that will
    help you along.


    At this point you should have some method of booting the kernel with your driver
    in, or loading it as a module. About half of the problems people have are related
    to not having driver loaded one another, so you may find things work.


    If it still doesn''t work, then you need to verify that the kernel is indeed detecting
    the card. To do this, you need to type dmesg | when logged in the system has booted
    and all modules have loaded. This will allow you to review the boot messages that
    the kernel scrolled on the screen during the boot process. If the card has been
    detected, you should see in that list message from your card that starts with
    eth0, mentions the driver and the hardware parameters (interrupt setting, input/output
    port address, etc) that the card is set for. (Note: At boot, linux lists all the
    PCI installed in the system, regardless of what drivers are available – do not
    mistake this for the driver detection comes later!)


    # 1.3 HELP – It doesn''t work!'
- md: '

    # Linux Ethernet-Howto


    If you don''t have a driver identification message like this, then the driver
    won''t detect your card, and that is why things are not working. See the FAQ (The
    FAQ Section) for what to do if your card is not detected. If you have a NE2000
    compatible, there is also some NE2000 specs on getting a card detected in the
    FAQ section.


    If the card is detected, but the detection message reports some sort of error,
    as a resource conflict, then the driver probably wasn''t initialized properly
    and the card will still be usable. Most common error messages of this sort are
    also listed in the FAQ section, along with a solution.


    If the detection message seems okay, then double check the card resources reported
    by the driver against that the card is physically set (either by little black
    jumpers on the card, or by a software utility supplied by the card manufacturer).
    These must match exactly. For example, if you have the card jumped or configured
    to IRQ 15 and the driver reports IRQ 10 in the boot messages, this will not work.
    The FAQ section details most common cases of drivers incorrectly detecting the
    configuration information of various cards.


    At this point, you may have detected a card with all the correct parameters, and
    hopefully everything is working. If not, then you have a software configuration
    error, or a hardware configuration error. A software configuration error is not
    setting up the right network addresses for the ifconfig route commands, and details
    of how to do that are fully described in the Network HowTo and the Network Administrator''s
    Guide which probably came from the CD-ROM you have installed.


    A hardware configuration error is when some sort of resource conflict or mis-configuration
    (the driver didn''t detect at boot) stops when ifconfig tries to open the device
    for use, such as SIOCFLAGS: Try again. The driver reports error messages (viewed
    by dmesg | more inconsistencies each time it tries to send or receive data.) (3)
    Typing cat /proc/net/dev shows non-zero numbers in one of the errors, drop, fifo,
    frame or carrier columns for eth0. (4) Typing cat /proc/interrupts shows a zero
    interrupt count for the card. Most of typical hardware configuration errors are
    also discussed in the FAQ section.


    Well, if you have gone to this point and things are still not working, read the
    FAQ section of your document, read the vendor section detailing your card, and
    if it doesn''t work then you may have to resort to posting in an appropriate newsgroup
    for help. If you do, please detail all relevant information in that post, as the
    card brand, the kernel version, the driver boot messages, the output from /proc/net/dev,
    a clear description of the problem, and what you have already tried to do in order
    to get things to work.


    You would be surprised how many people post useless things like "Can help me?
    My ethernet doesn''t work." and nothing else. Readers of the newsgroups tend to
    ignore such silly posts, whereas a detailed and informational problem description
    may allow a linux-guru to spot your problem right away. The same holds true when
    e-mailing a problem report – always provide as much information as possible.


    # 1.4 Type of cable that your card should support


    The twisted pair cable, but the RJ-45 (giant phone jack) connectors is technically
    called 10BaseT. You may also hear it called UTP (Unshielded Twisted Pair).


    The thinnet, or ethernet cable. (RG-58 coaxial cable) with the BNC (metal push
    and turn-to-lock) connectors is technically called 10Base2.


    The thicker ethernet (10mm coaxial cable) which is only found in older installations
    is called 10Base5.

    The 15 pin D–shaped plug on some ethernet cards (the AUI connector) is used to
    connect to thick ether and external networks.


    Most ethercards also come in a ''Combo'' version for only $10–20 more. These both
    have twisted pair and thinner transceiver built-in, allowing you to change your
    mind.


    Most installations will use BaseT/100BaseT 10Base2 does not offer any upgrade
    path to 100Base-whatever. 10Base2 is fine for hobbyists setting up a home network
    when purchasing a hub is desirable for some reason or another.


    See Cables, Coax... for others with different types of ethernet cable.


    # 2. Frequently Asked Questions


    Here are some of the more frequently asked questions about using Linux with an
    Ethernet connection. Some of the more specific questions are sorted on a ''per
    manufacturer basis''. Chances the question you want an answer has already been
    asked (and!) by someone else, even if you don''t find your answer here, probably
    you can find what you want from a news archive such as Deherlands.


    # 2.1 What card should I buy for Linux?


    The answer to this question depends heavily on exactly what you intend on doing
    with your net connection, an how much traffic it will see.


    If you only expect a single user to be doing the occasional ftp session or WWW
    connection, then even an old 8 bit card will probably keep you happy.


    If you intend to set up a server, and you require the CPU overhead of moving data
    over the network to be kept to a minimum, you probably want to look at one of
    the PCI cards that use a chip with bus-mastering capability, as the DEC tpl (21xxxx)
    chip, or the AMD PCnet-PCI chip.


    If you fall within the middle of the above, then any one of the low cost PCI or
    16 bit ISA cards with stable drivers will do the job for you.


    # 2.2 Alpha Drivers --- Getting and Using them


    I heard that is an updated or preliminary/alpha driver available for my card.
    scyld.com can I get it?


    The newest of the ''new'' drivers can be found on dftp site: scyld.com in the
    /pub/linux/ area. Things change here frequently, so just look around for it. Alternatively,
    it may be easier to use a WWW browser on:


    Don''s Linux Home Page


    to locate the driver you are looking for. (Watch out for WWW browsers that silently
    munge the by replacing TABs with spaces and so on – use ftp, or at least an FTP
    URL for downloading if unsure.)


    Now, if it is really an alpha, or–alpha driver, please treat it as such. In other
    words, don''t complain because you can''t figure out what to do with it. If you
    can''t figure out how to install it, then you probably won''t be testing it. Also,
    if it brings your machine down, don''t insist, Send us a well documented bug report,
    or even better. Note that some the ''usable'' alpha drivers have been included
    in the standard kernel. When running you will be asked whether to include any
    alpha. You have to answer ''Y'' to get both.


    # 2.3 Using More than one Ethernet Card per Machine


    What needs to be done depends on whether the driver(s) is being used as loadable
    module or compiled directly into the kernel. Most Linux distributions use modular.


    In the case of PCI drivers, the module will typically detect all of the cards.
