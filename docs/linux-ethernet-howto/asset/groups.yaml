    # Linux 以太网教程


    ## Cogent eMAASTER+, EM100–PCI, EM400, EM960, EM964


    状态：已支持，驱动名称：de4x5, tulip


    这些是另一个 DEC 21040 的实现，希望它们与标准的 21040 驱动正常工作。


    EM400 和 EM964 是四口卡，使用了 DEC 21050 桥器和 4 个 21040 芯片。


    关于这些卡以及目前的驱动状况的更多信息，请参阅 DEC 21040。


    ## 4.12 Compaq


    Compaq 并不生产以太网卡，但他们的许多系统在主板上嵌入了控制器。


    ### Compaq Deskpro / Compaq XL (嵌入 AMD 芯片)


    如 XL 系列等机器主板上带有 AMD 79c7x 芯片，我们可以使用它，但必须进行一些技巧才能让 PCI BIOS 识别标准的 LANCE 驱动。在使用它之前，Frank
    Maas 提供了以下详细信息：


    > 这台 Compaq 机器的问题在于 PCI 目录位于高内存中，Linux 内核无法触及。结果是：网卡从未被检测到，或者根本没用（鼠标也无法工作）。解决方法（已在
    http://www-c724.uibak.ac/xl/ 中详细描述）是加载 MS-DOS，启动 Compaq，然后使用 LOADLIN 加载 Linux
    内核。我可以留时间让你说“真讨厌，真讨厌”，但目前这是我知的唯一解决方案。驱动程序只需将 PCI 目录移动到通常存储的地方（以及 Linux 能够找到的地方）。


    关于 AMD 芯片的更通用信息可以在 AMD LANCE 中找到。


    ### Compaq Nettelfigent/NetFlex (嵌入 ThunderLAN 芯片)


    状态：已支持，驱动名称：tlan


    这些系统使用德州仪器的 ThunderLAN 芯片，ThunderLAN 驱动可以在 ThunderLAN 中找到。


    ### Compaq PCI 网卡


    状态：已支持，驱动名称：eeepro100


    检查你的网卡——如果上面有零件号为 323551–821 和/或 intel 82558 芯片，那么它就是另一块基于 Intel EEPro100 的网卡。


    ## 4.13 Danpex


    ### Danpex EN9400


    状态：已支持，驱动名称：de4x5, tulip


    这是另一个基于 DEC 21040 芯片的网卡，据报道工作正常，且价格较廉。


    关于这些卡以及目前的驱动状况的更多信息，请参阅 DEC 21040。


    ## 4.14 D–Link


    ### DE–100, DE–200, DE–220–T, DE–250


    状态：已支持，驱动名称：ne+83890


    某些 D–Link 网卡没有 0x57 PROM 签名，nc2000 驱动无法识别它们。对于软件可配置的网卡，你可以从 www.dlink.com 获取配置程序。DE**
    系列网卡被最广泛报道为在早期 Linux 版本中存在伪地址不匹配错误。请注意，来自 Digital (DEC) 的网卡也名为 DE100 和 DE200，但相似性仅此于此。


    ### DE–520


    状态：已支持，驱动名称：pnet32


    这是一块使用 AMD LANCE 芯片 PCI 版本的网卡。DMA 选择和芯片编号信息可以在 AMD LANCE 中找到。


    关于基于 AMD LANCE 的以太网网卡的更多技术信息可以在 Notes on AMD... 中找到。


    ### DE–528


    状态：已支持，驱动名称：ne, ne2k–pci (+83890)


    显然 D–Link 也开始制作 PCI 版 NE2000 克隆产品了。


    ### DE–530


    状态：已支持，驱动名称：de4x5, tulip


    这是一个通用的 DEC 21040 PCI 芯片实现，据报道与通用的 21040 tulip 驱动兼容工作。注意这**不是** DEC–530。


    关于这些卡以及目前的驱动状况的更多信息，请参阅 DEC 21040。


    ### DE-600


    状态：已支持，驱动名称：de600


    笔记本电脑用户以及可能想要快速让电脑连接到以太网的人可能想用这个。驱动包含在默认内核源码树中。预计该并行端口的传输速度约为 180kb/s。你应该阅读内核源码树中的
    README.DLINK 文件。


    注意，你传递给 config 的设备现在是 eth0 而不是之前使用的 d10。


    如果你的并行端口不是 0x378，你将不得不重新编译，因为地址是直接编译到驱动程序中的。还要注意，某些笔记本电脑将板载并行端口实现在 0x3bc，那是以前单色卡并行端口的位置。


    ### DE-620


    状态：已支持，驱动名称：de620


    与 DE–600 相同，仅有两个输出格式。Bjorn 为该型号编写了适用于 1.1 及以上内核版本的驱动。请查看 DE–600 的信息。


    ### DE-650


    状态：部分支持，驱动名称：de650


    有些人已经在笔记本电脑上使用这个 PCMCIA 一段时间了。它是基础的 8390 设计，类似于 NE2000。据报道 LinkSys PCMCIA 和以太网卡也是
    DE650 克隆。注意该驱动不是标准内核的一部分，你需要进行一些补丁处理。


    ### DFE-530


    状态：已支持，驱动名称：via–rhine


    另一块使用 VIA 芯片的网卡（参见 Rhine）。不要将其与基于 tulip 的 DE–530 混淆。


    ### DFE538TX


    状态：已支持，驱动名称：rtl8139


    此网卡使用 RealTek 8139——参见 RealTek 部分。


    ## 4.15 DFI


    ### DFINET–300 和 DFINET–400


    状态：已支持，驱动名称：ne (+8390)


    另一个糟糕的克隆——它们在 prom 的第一个字节使用 ''DFI'' 而不是 NE1000 和 NE2000 网卡应该使用的 0x57（第 14 和 15
    位）（300 是 NE1000 克隆，400 是 NE2000 克隆）。


    ## 4.16 Digital / DEC


    ### DEPCA, DE100/1, DE200/1/2, DE210, DE422


    状态：已支持，驱动名称：depca


    ''depca'' 源文件中包含了如何在一个机器中使用多个网卡的文档。注意 DE422 是基于 EISA 卡的。这些网卡都基于 AMD LANCE 芯片。最多可以使用两块
    ISA 卡，因为它们只能设置为 0x300 和 0x200 I/O 地址。如果你打算这样做，请阅读标准内核中的驱动文件 depca。此驱动也支持 Alpha
    CPU，并且用户可以进行各种 ioctl()。


    ### Digital EtherWorks (DE203, DE204, DE205)


    状态：已支持，驱动名称：ewkr3


    这些网卡使用 DEC 的专用芯片，而不是 DE200 等早期网卡使用的 LANCE 芯片。这些网卡支持共享内存或程序化 IO，尽管如果你使用 PIO 模式会损失
    50% 的性能。共享内存可以设置为 2KB、32KB 或 64KB，且只有 2 和 32 经过了测试。David 表示性能与 2KB 和 32KB 模式几乎相同。更多信息在驱动文件
    ewkr3.c 顶部以及 README.ewkr3 中。这两个文件都随标准内核分发。此驱动像 depca 一样支持 Alpha CPU。标准驱动具有多种有趣的
    ioctl()，可清除数据统计、读写 EEPROM、更改硬件地址和链接。黑客可以查看源码以获取更多信息。David 还为此卡编写了配置工具（类似于 DOS
    程序 NICSETUP.EXE）。可以在 Linux FTP 站的 /pub/linux/system/Network/management 目录下找到 ewkr3tools-X.XX.tar.gz。


    ### DE425 EISA, DE434, DE435, DE500


    状态：支持，驱动名称：de4x5, tulip


    这些卡基于上述 21040 芯片。DE500 使用 2140 提供 10/100Mbps 连接。请阅读下面的 2140 部分以获取额外信息。该驱动为非 DEC
    网卡提供了一些编译选项。详情查看 README.de4x5。所有 Digital 网卡都支持自动补丁（由于专利问题，DE500 暂不支持）。


    ### DEC 21040, 21041, 2114x, Tulip


    状态：已支持，驱动名称：de45x, tulip


    DEC 21040 是 Digital 的一种总线主单芯片解决方案，类似于 AMD 的 PCnet 芯片。21040 专为 PCI 总线架构设计。显然这些芯片已不再生产，因为英特尔收购了
    DEC 的半导体部门并倾向于自己的芯片。


    对于此芯片的网卡你有两种驱动可选：上述的 DE425 驱动和通用的 21040 ''tulip'' 驱动。


    警告：尽管你的网卡可能基于此芯片，驱动可能对你无效。此驱动也支持 Alpha CPU 并支持作为模块加载。用户可以通过 ioctl() 调用访问内部结构——请查看
    ''ew3'' 代码和 de45x.c 源码获取有关如何操作的信息。


    警告：尽管你的网卡可能基于此芯片，驱动可能对你无效。没有保证 ''tulip.c'' 或 ''de45x.c'' 能够运行任何 DC214x 网卡。为什么？？你问。因为有一个寄存器，通用寄存器
    (CSR12)，它 (1) 在 DC2140a 中由每个厂商编程，且方法各不相同；(2) 在 SIA 控制寄存器中。唯一的微小希望是我们可以解码驱动程序设置的
    SROM。用非技术术语来说，这意味着如果你不确定带有 DC214x 芯片的未知网卡是否与 tulip 驱动工作，请确保在付款前可以退网卡。


    21041 芯片也出现在后期 SMC EtherPower 网卡的 21040 系列中。21140 用于支持 100Base-T，并与 2140 芯片的 Linux
    驱动兼容。对于非 DEC 网卡使用 David 的 de45x 驱动，请查看该部分。


    如果你在使用 tulip 驱动时遇到问题，可以尝试 Donald 网站上的最新版本。


    Tulip 驱动


    这里还有一个使用 21040 芯片的各种网卡/厂商列表（非详尽）。


    ## 4.17 Farallon


    Farallon 销售 EtherWave 适配器和收发器。该设备允许多个 10base-T 设备串联。


    ### Farallon Etherwave


    状态：支持，驱动名称：3c509


    据报道这是一个包含 EtherWave 收发器的 3c509 克隆。人们已成功在 Linux 和目前的 3c509 驱动下它。它们对于普通用途来说太贵了，但非常棒


