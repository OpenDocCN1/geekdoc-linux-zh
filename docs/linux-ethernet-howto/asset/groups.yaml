    with PCI BIOS support enabled. The ''970A adds full duplex support along with
    some other features to the original 970 design.


    Note that the BOCA implementation of the 79C70 fails on Pentium machines. at the
    first. This is a hardware problem, as it affects DOS users as well. See the BOCA
    section for more details.


