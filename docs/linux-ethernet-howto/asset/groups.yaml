    # Linux 以太网教程


    ## 使用 `ifconfig` 和硬件地址为 00:00:00:00:00 的 Link UNSPEC


    当我不带参数地运行 `ifconfig` 时，它报告显示 LINK 为 UNSPEC（而不是 10Mbps 以太网），并且说我的硬件地址全为零。


    这是因为人们运行的 `ifconfig` 程序版本比内核版本要新。这个新版本的 `ifconfig` 在与旧内核配合使用时无法报告这些属性。你可以升级你的
    `ifconfig`、降级（downgrade）它，或者直接忽略它。内核知道你的硬件地址，所以 `ifconfig` 能不能读取它其实并不重要。


    你可能还会得到奇怪的信息，因为你正在使用的 `ifconfig` 程序比你使用的内核旧得多。


    ## 存在大量的 RX 和 TX 错误


    当我不带参数地运行 `ifconfig` 时，它报告在接收和发送的数据包中都有巨大的错误计数。看起来运行正常 —— 哪里问题了？


    再看一遍。它显示 RX 数据包大数量 PAUSE errors 0 PAUSE dropped 0 PAUSE overrun 0。TX 列也是如此。你看到的数字是你的机器接收和发送的数据包总数。如果你仍然觉得困惑，尝试在输入
    `cat /proc/net/dev`。


    ## /dev/ 下以太网卡的条目


    我有 `/dev/eth0` 作为指向 `/dev/xxx` 的链接。这对吗？


    与你听到的相反，`/dev/*` 中的文件并没有被使用。你可以删除任何 `/dev/wd0`、`/dev/ne0` 类似的条目。


    ## Linux 与 `trailers`（尾部）


    当我 `ifconfig` 我的以太网卡时，应该禁用尾部吗？


    你可以禁用尾部，但你不应该这样做。`Trailers` 是为了避免在网络层中拷贝数据的一种黑方法。其想法是使用一个固定大小的 ''H'' 头部，将变长度的头部信息放在数据包末尾，并在页开始之前分配所有的
    ''H''。这是一个好主意，但在实践中证明行不通。有人建议使用 `trailers`，请注意这等同于祭羊的血。它解决不了任何问题，但如果问题解决了，他们就可以声称拥有深奥的魔法知识。


    ## 原始以太网设备的访问


    如何在 Linux 中不通过 TCP/IP 等协议，直接访问原始以太网设备？


    ```c

    int s=socket(AF_INET, SOCK_PACKET, (ETH_P_ALL));

    ```


    Linux 给你一个可以接收所有协议的套接字。对其 `recvfrom()` 调用，它会在 `sa_family` 中填充设备类型，并在 `sa_data`
    数组中填充设备名称。我不知道最初是谁为 Linux 发明了 `SOCK_PACKET`（它已经存在多年了），但它是非常棒的东西。你可以通过 `sendto()`
    调用来原始发送内容。当然，你对两者都有 root 权限。


    ## 性能提示


    如果你正受以太网吞吐量低的困扰，或者想在某些类型传输中获得更多提升，可以使用以下提示。


    `ttcp.c` 程序是测量原始吞吐量速度的好测试。另一个常见技巧是执行 `ftp get_file /dev/null large_file`，如果文件大于
    1MB 且存在于发送端的缓冲区缓存中。（至少执行 ''get''，因为第一次执行会预热发送端的缓冲区缓存。）你希望文件在缓冲区缓存中，因为你对将磁盘访问速度合并到内存感兴趣。这就是为什么你将数据发送到
    `/dev/null` 而不是磁盘。


    ### 3.1 通用概念


    即使是 8 位卡也能毫无问题地接收连续数据包。困难在于计算机接收数据包的速度不够快，无法为更多新进入的数据包腾出空间。如果计算机不快速清除缓存中已接收的数据包内存，卡将没有地方存放新数据包。


    在这种情况下，卡要么丢弃新数据包，要么覆盖之前接收的数据包。这任何一种方式都会通过调用/请求/重传中断流量的平流动，并可能导致性能严重下降高达 5 倍！


    具有更多板载内存的卡能够缓存`buffer`）更多数据包，并能处理突发的连续数据包而不丢包。这意味着卡不需要主机计算机以极低的延迟从缓冲区中取出数据包，以避免丢包。


    大多数 8 位卡具有 8KB 缓冲区，大多数 16 位卡具有 16KB 缓冲区。大多数 Linux 驱动程序会预留 3B 的缓冲区（用于两个 Tx 缓冲区），为
    8 位卡仅留下 5KB 的接收空间。这个空间仅足够三个完整的（1500 字节）以太网包。


    ### 3.2 ISA 卡与 ISA 总线速度


    如上述，如果数据从卡中移除得足够快，即使 Rx 缓冲区内存很小，也不会发生丢失/溢出（overrun）情况。决定数据从卡到计算机内存速率的是连接两者的路径——即
    ISA 总线。（如果 CPU 是慢速的 386cx-16，这也会产生影响）。


    建议的 ISA 总线频率约为 8MHz，但许多主板和外设可以在更高的频率运行。ISA 总线的频率可以在 CMOS 设置中设置，选择主板/CPU 时钟频率的分频。某些
    ISA/ISA 主板可能没有此选项，因此你只能使用出厂默认值。例如，以下是在 40MHz 486 上使用 8 位 WD8003EP 卡通过 `TTCP` 程序测量的不同
    ISA 速度。


    | ISA Bus Speed (MHz) | Rx TTCP (kB/s) |

    | :--- | :--- |

    | 6.7 | 740 |

    | 13.4 | 970 |

    | 20.0 | 1030 |

    | 26.7 | 1075 |


    对于任何 10Mb/s 以太网卡，使用 TCP/IP 很难达到 1075kB/s 以下。然而，不要期望任何系统在快速 ISA 速度下工作。在超过 13MHz
    的速度下，大多数系统无法正常运行。（某些 PCI 系统固定了总线速度）


    ### 3.3 设置窗口

    （此处内容为原文重复的 OCR 错误码文本，已按要求处理）

