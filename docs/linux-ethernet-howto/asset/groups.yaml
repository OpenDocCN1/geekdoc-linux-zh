    # Linux Ethernet-Howto


    This ethernet card is based on the 83c790 chip from SMC, it has a few new features
    over the 83c690. It has a mode that is similar to the older SMC ethards, it''s
    not entirely compatible with the old WD80*3 drivers. However it shares some of
    its code with the other 8390 drivers, while operating slightly faster than a WD8013
    card.


    Since the part of the Ultra looks like an 8013, the Ultra is supposed to find
    an Ultra before the wd8013 probe has a chance to mistakenly identify it.


    Donald mentioned that it is possible to write a separate driver for the Ultra''s
    ‘Altego’ mode changing chaintrans at the cost of inefficient use of receive buffers,
    but that will probably not happen.


    Bus-Master SCSI hot adapters use note: In the manual that shares with Interactive
    UNIX, it mentions that a bug in the SMC Ultra will cause data corruption with
    SCSI disks being run from an aha-154X hot adapter. This also affects the BusLogic
    boards, and the AMI-FastDisk SCSI hot adapters as well.


    SMC has acknowledged the problem occurs with Interactive, and older Windows NT
    drivers. It is a hardware conflict with early of the card that can be worked around
    in the driver. The current Ultra driver protects this by only enabling the shared
    memory during data transfers to the card. Make sure kernel version is at least
    1.1.84, or that the driver version reported at boot is at least smc-ultra.vi12
    otherwise you are vulnerable.


    If you are using this driver as a loadable module you will probably see Using
    the Ethernet Drivers as Modules for module specific information.


