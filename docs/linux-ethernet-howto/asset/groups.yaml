  - '[PAGE 83]


    It is recommended that you read to find out what options you can for your particular
    card. Note that some modules support comma separated value lists for modules that
    have the capability to handle multiple devices from a single module, such as the
    8390 based drivers, and the PLIP driver. For example:


    ```

    options 3c503 io=0x280,0x300,0x330,0x350 xcvr=0,1,0

    ```


    The above would have the one module controlling four 3c503 cards, with card 2
    and 4 using external transceivers. Do not put spaces around the ''—'' or commas.


    Note that a busy module cannot be removed. That means that you will have to ifconfig
    eth0 down (shut down the ethernet) before you can remove the module(s).


    The command ismod will show you which modules are loaded, whether they are use,
    and rmod will remove them.


