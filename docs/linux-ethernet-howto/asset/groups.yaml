    Note that the BOCA implementation of the 79C70 fails on Pentium machines. at the
    first. This is a hardware problem, as it affects DOS users as well. See the BOCA
    section for more details.


    # AMD 79C971 (PCnet–FAST)


    Status: Supported, Driver Name: pcnet32


    This is AMD''s 100Mbit chip for PCI systems, which also supports full duplex operation.
    It was introduced in June 1996.


    # AMD 79C972 (PCnet–FAST+)


    Status: Supported, Driver Name: pcnet32


    This has been confirmed to work just like the ''971.


    # AMD 79C974 (PCnet–SCSI)


    Status: Supported, Driver Name: pcnet32


    This is the PCnet–SCSI — which is basically treated like a ''970 from an Ethernet
    point of view. Also see the above information. Don''t ask if the SCSI half of
    the chip is supported — this is the Ethernet–HowTo, not the SCSI–HowTo.


    # 4.5 Ansel Communications


    # AC3200 EISA


    Status: Semi-Supported, Driver Name: ac3200


    Note that to access this driver make `config` you still have to answer `Y` when
    asked `Prompt for development/or incomplete code drivers/` at the first. This
    is due to lack of feedback on the driver stability due to it being a relatively
    rare card.


    This driver is included in the present kernel as an alpha test on the common NS8390
    chip used in the ne2000 and wb803 cards. Please see Alpha Drivers in this document
    for important information regarding alpha drivers.


    If you use it, let one of how things works out, as feedback has been low, even
    though the driver has been in the kernel v1.1.25.


    If you intend on using this driver as a loadable module you should probably see
    Using the Ethernet Drivers as Modules for module specific information.


    # AMD 79C971 (PCnet–FAST)


    # 4.6 Apricot


    # Apricot Xen–II On Board Ethernet


    Status: Semi–Supported, Driver Name: apricot


    This on board ethernet uses an i82596 bus–master chip. It can only be at I/O address
    0x300. By looking at the driver source, it appears that the IRQ is also hardwired
    to 10.


    Earlier versions of the driver had a tendency to think that anything at 0x300
    was an apricot NIC. Since then the hardware address is checked to avoid these
    false detections.


    # 4.7 Arcnet


    Status: Supported, Driver Name: arcnet (arc–rimi, com90xx, com20020)


    With the low cost and better performance of ethernet, chances are that most places
    will be giving away their Arcnet hardware for free, resulting in a lot of home
    systems with Arcnet.


    An advantage of Arcnet is that all of the cards have identical interfaces, so
    one driver will work for everyone. It also has built error handling so that it
    supposedly never loses a packet. (Great for UDP traffic!) Note that the arc driver
    uses ''arc0'' as its name instead of the usual ''eth0'' for ethernet devices.


    There are information files contained in the standard kernel for setting jumpers,
    general hints and where to mail bug reports.


    Supposedly the driver also works with the 100Mbs ARCnet cards as well!


    # 4.8 AT&T


    Note that AT&T’s StarLAN is an orphaned technology, like SynOptics LattisNet,
    and cannot be used in a standard 100Base–T environment, without a hub that ‘speaks’
    both.


    # AT&T T7231 (LanPACER)+


    Status: Not Supported.


    These StarLAN environments use an interface similar to the i82586 chip. At one
    point, Matthijs Melchior (matthias.n.melchior@att.com) was playing with the 3c507
    driver, and almost had something usable working. Haven’t heard much since that.


    # 4.9 Boca Research


    Yes, they make more than just multi–port serial cards.


    # Linux Ethernet-Howto


    # Boca BEN400


    Status: Supported, Driver Name: ne (+8390)


    Apparently this is a NE2000 clone, using a VIA VT86C916 chip.


    # Boca BEN (ISA, VLB, PCI)


    These cards are based on AMD''s PCnet chips. Perspective buyers should be warned
    that many users have had endless problems with these VLB/PCI cards. Owners of
    fast Pentium systems have been especially hit. Note that this is not a driver
    problem, as it is DOS/NT users as well. Boca''s technical support number is (407)
    241–8088, and you can also reach them at 75300.2672@compuser.com. The older ISA
    cards don''t appear to suffer the same problems.


    Boca was offering a ''warranty repair'' for affected owners, which involved one
