    # Linux Ethernet-Howto


    ## Using `ifconfig` and Link UNSPEC with HW–addr of 00:00:00:00:00


    When I run ifconfig with no arguments, it reports that LINK is UNSPEC (instead
    of10Mbps Ethernet) and it also says that my hardware address is all zeros.


    This is because people are running a newer version of the `ifconfig` program than
    their kernel version. This new version of ifconfig is not able to report these
    properties when in conjunction with an older kernel. You can upgrade your, `downgrade`
    ifconfig, or simply ignore it. The kernel knows your hardware address, so it really
    doesn''t matter if ifconfig can read it.


    You may also get strange information the ifconfig program you are using is lot
    older than the kernel you are using.


    ## Huge Number of RX and TX Errors


    When I run ifconfig with no arguments, it reports that it has a huge error count
    in both rec''d and transmitted packets. It seems to work ok --- What is wrong?


    Look again. It says RX packets big number PAUSE errors 0 PAUSE dropped 0 PAUSE
    overrun 0. And for the TX column. Here the numbers you are seeing are the total
    number of packets that your machine has rec''d and transmitted. If you still find
    it confusing, try typing cat /proc/net/dev inside.


    ## Entries in /dev/ for Ethercards


    I have /dev/eth0 as a link to /dev/xxx. Is this right?


    Contrary to what you have heard, the files in /dev/* are not used. You can delete
    any /dev/wd0, /dev/ne0 and similar entries.


    ## Linux and `trailers`


    Should I disable trailers when I ifconfig my ethercard?


    You can disable trailers, and you shouldn''t want to. `Trailers` are a hack to
    avoid data copying in the networking layers. The idea was to use a fixed–size
    header of ''H'', put the variable–size header info into the end of the packet,
    and allocate all ''H'' before the start of a page. While it was a good idea, it
    turned out not to work in practice. Someone suggests the use of `trailers`, note
    that it is the equivalent of sacrificial goats blood. It won''t do anything to
    solve the problem, but if problem fixes then someone can claim deep magical knowledge.


    ## Access to the raw Ethernet Device


    How do I get access to the raw ethernet device in linux, without going through
    TCP/IP and friends?


    ```c

    int s=socket(AF_INET, SOCK_PACKET, (ETH_P_ALL));

    ```


    Linux gives you a socket receiving every protocol. Do recvfrom() calls to it and
    it will fill the sockaddr with device type in sa_family and the device name in
    sa_data array. I don''t know who originally invented SOCK_PACKET for Linux (its
    been for years) but its superb stuff. You can use it to send stuff raw via sendto()
    calls. You have root access to either of course.


    ## Performance Tips


    Here are some tips that you can use if you are suffering from low ethernet throughput,
    or to gain a bit more on some type transfers.


    The ttcp.c program is a good test for measuring raw throughput speed. Another
    common trick is to do a ftp get_file /dev/null large_file is >1MB and residing
    in the buffer cache on the Txing machine. (Do the ''get'' at least, as the first
    time will be priming the buffer cache on the Txing machine.) You want the file
    in buffer cache because you are not interested in combining the access speed from
    the disk into memory. This is why you are sending the data to /dev/null instead
    of onto the disk.


    ### 3.1 General Concepts


    Even an 8 bit card is able to receive back–back packets without any problems.
    The difficulty arises when the computer doesn''t get Rx–d packets quick enough
    to make room for more incoming packets. If the computer does not quickly clear
    the cache''s memory of the packets already received, the card will have no place
    to put the new packet.


    In this case the either drops the new packet, or writes over top of a previously
    received packet. Either one interrupts the smooth flow of traffic by calling/requesting/re-transmissions
    and can seriously degrade performance by up to a factor of 5!


    Cards with more onboard memory are able to `buffer` more packets, and can handle
    large bursts of back–to–back packets without dropping packets. In this turn means
    that the card does not require as low latency from the host computer with respect
    to pulling the packets out of the buffer to avoid dropping packets.


    Most 8 bit cards have an 8KB buffer, and most 16 bit cards have a 16KB buffer.
    Most Linux drivers will reserve 3B of buffer (for two Tx buffers), leaving only
    5KB of receive space for an 8 bit card. This is room enough for only three full
    (1500) ethernet packets.


    ### 3.2 ISA Cards and ISA Bus Speed


    As mentioned above, if the cards are removed from the card fast enough, then drop/overrun
    condition won''t occur even when the Amount of Rx buffer memory is small. The
    factor sets that the rate cards are removed from the card to the computer''s memory
    is the data path that joins the two— that is ISA bus. (The CPU is a dog-slow 386cx-16,
    then this will also play a role).


    The recommended ISA bus clock is around 8MHz, but many motherboards and peripheral
    devices can be run at higher frequencies. The clock frequency for the ISA bus
    can be set in the CMOS setup, selecting a divisor of the motherboard/CPU clock
    frequency. Some ISA/ISA mainboards may not have this option, and so you are stuck
    with the factory default.


    For example, here are some speeds measured by the TTCP program on a 40MHz 486,
    with an 8 bit WD8003EP card, for different ISA speeds.


