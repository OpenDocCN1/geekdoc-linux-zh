    # Linux Ethernet-Howto


    # WD8003, SMC Elite


    Status: Supported, Driver Name: wd (+8390)


    These are the 8-bit versions of the card. The 8 bit 8003 is slightly less expensive,
    but only worth the savings for light use. Note that some of the non-EEPROM cards
    (with jumpers, or old old wd 8003 cards) have no way of reporting the IRQ line.
    In this case, auto-irq is used, and if it fails, the driver silently assigns IRQ
    5. You can get the SMC setup/driver disks from SMC''s ftp site. Note that some
    of the newer SMC ''SuperDisk'' programs will fail to detect the real old EEPROM-less
    cards. The SMCDS46.EXE seems to be a all-round choice. The old jumpers for all
    larger cards are in ASCII text in the aforementioned archive. The latest (great?)
    version can be obtained from ftp.com.


    As these are basically the same as their 16 bit counterparts (WD8013 / SMC Elite16),
    you should see the next section for more information.


    # WD8013, SMC Elite16


    Status: Supported, Driver Name: wd (+8390)


    Over the years the design has added more registers and an EEPROM. (The first wd8003
    cards appeared about ten years ago!) Clones usually by the ''8013'' name, and
    usually use a non-EEPROM (jumped). Late model SMC cards have the SMC 83c690 chip
    instead of the Nat Semi DP8390 found on earlier cards. The shared memory design
    makes the bits a bit faster than PCI cards, especially with larger packets. More
    importantly, from the driver''s point of view, it avoids a few bugs in the programmed-I/O
    mode of the 8390, allows multi-threaded access to the packet buffer, and it doesn''t
    have a programmed-I/O data register that handles your machine during warm-boot
    processes.


    Non-EEPROM cards that can''t just read the selected IRQ will attempt-irq, and
    if that fails, will silently assign IRQ 10. (8 bit versions will assign IRQ 5)


    Cards with a standard amount of memory can have the memory size specified at boot
    (or as an option in /etc/conf.modules if using). The standard memory size is 8KB
    for an 8 bit card and 16KB for a 16 bit card. For example, the WD8003EBT cards
    could be jumped for 32KB memory. To make full use of RAM, you would use something
    like (for I/O=0x280 and IRQ 9):


    ```

    LILO: linux ether9,0x280,0xd0000,0xd8000,eth0

    ```


    Also see 8013 problems for some of the common problems and frequently asked questions
    that pop up often.


    If you intend on using this driver as a loadable module you should probably see
    Using the Ethernet Drivers as Modules for module specific information.


