    Note that Donald''s PCMCIA enabler as a user-level process, and David Hinds''
    is a kernel-level solution. You may be best served by David''s package as it is
    much more widely used and under continuous development.


    ## 8.3 ISA Ethercard in the Docking Station.


    Docking stations for laptops typically cost about $250 and have two full-size
    ISA slots, serial and one parallel port. Most docking stations are powered off
    of the laptop''s batteries, and a few allowing extra batteries in the docking
    station if you use short ISA cards. You can add an inexpensive ethercard and enjoy
    full–speed ethernet performance.


    ## 8.4 Pocket / parallel port adapters.


    The ''pocket'' ethernet adapters may also fit your network. Note that the transfer
    speed will not be all that great (perhaps 200KB/s tops?) due to the limitations
    of the parallel port interface.


    Also must tie down with a wall–brick power supply. You can sometimes avoid the
    wall–brick with the adapters by buying or making a cable that draws power from
    the laptop''s keyboard board. (See keyboard-powgr).


    See DE–600/DE–620 RealTek for two supported pocket adapters.


    ## 9. Miscellaneous.


    Any other associated stuff that doesn''t fit anywhere else gets dumped here. It
    may not be relevant, and it may be of general interest but it is here anyway.


    ### 9.1 Passing Ethernet Arguments to the Kernel


    Here are two generic kernel commands that can be passed to the kernel at boot
    (ether and reserve). This can be done by LILO, loadlin, or any other booting utility
    that accepts optional arguments.


    For example, if the command was ''blah'' and it added 3 arguments (say 123, 456,
    and 789) then, with LILO, you would use:


    ```

    LILO: blah=123,456,789

    ```


    For more information on (and a complete list of) boot time arguments, please see
    the BootPrompt–HOWTO.


    ### The ether–argument command


    The ether–argument is used in conjunction with drivers that are directly built
    into the kernel. The ether–argument will have absolutely no effect on a modular
    driver. In its most generic form, it looks something like this:


    ```

    ether=IRQ, BASE_ADDR, PARAM_1, PARAM_2, NAME

    ```


    # Linux Ethernet-Howto


    All arguments are optional. The first non-numeric argument is taken as the NAME.


    - IRQ: Obvious. An IRQ value of `0` (usually the default) means to autoIRQ. It''s
    a historical accident that the IRQ setting is fixed rather than the base_addr
    — this will be fixed whenever something changes.


    - BASE_ADDR: Obvious. A value of `0` (usually the default) means to board card-type-specific
    address list for an ethercard.


    - PARAM_1: It was originally used as an override for the memory start for a shared-memory
    ethercard, the WD80*3. Some drivers use the four bits of this value to set the
    debug level 0 — default, 1–7 — 1…7 (maximum verbosity) 8 — level (no messages).
    The LANCE driver uses the four bits of this value to select the DMA channel. Otherwise
    it uses auto-DMA.


    - PARAM_2: The 3c503 driver uses this to select between the internal and external
    transceivers. 0 — default/internal, 1 — AUI external. The Carleton E21XX card
    also uses the 4 bits of PARAM_2 to select the output media. It detects them automatically.


    - NAME: The network device value refers to here. The standard uses the names `eth0`,
    `eth1`, `eth2` and `eth3` for bus-attached ethercards, and `atp0` for the parallel
    port `pocket ether adapter`. The arcent driver uses `arc` as name. The default
    setting is an enabled probe to be for `eth0`. Multiple cards can be enabled by
    explicitly setting them up using these probes using LANCE parameters. The 1.0
    kernel has LANCE-based ethercards as a scale fact. LILO arguments are ignored,
    and LANCE cards are always assigned `eth<n>`. Additional non-LANCE ethercards
    must be explicitly assigned `eth<n+1>`, and the usual `eth0` probed something
    like `eth0=0,-1,eth0`. (Yes, this is a bug).


    ### The reserve command


    This lilo command is just like `eth=` above, it is appended to the name of boot
    select specified in lilo:


    ```

    reserve=IO-base,extent(, IO-base,extent...)

    ```


    In some machines it may need to prevent device drivers from checking for devices
    (auto-probing) in a specific region. This may be because of poorly designed hardware
    that causes the boot to freeze (such as some ethercards), hardware that is mistakenly
    identified, whose state is changed by an earlier probe, or hardware does not know
    the kernel to initialize.


    The reserve boot-time addresses this problem by specifying an I/O port region
    that shouldn''t be probed. That region is reserved in the kernel''s port registration
    table as if a device has already found in that region. That mechanism shouldn''t
    be necessary on most machines. Only when there is a problem or special case would
    it need to use this.


    The I/O ports in the specified region are protected against device probes. This
    was to be used when one driver was running on a NE2000, or misidentifying some
    other device as ours. A correct driver shouldn''t reserve a region, unless another
    boot argument explicitly specifies it to do so. This implies that reserve must
    often be used with some boot argument.


    ## 9.2 Using the Ethernet Drivers as Modules


    Most linux distributions now ship kernels that have very few drivers-in. The drivers
    are instead supplied as a bunch of loadable modules. These modular drivers are
    typically loaded by the administrator with the modprobe command, or in some cases
    they are automatically loaded by the kernel.


    You particular distribution may offer nice graphical tools for setting up modules.
    The description that follows gives information on what these programs changes.


    The information that controls modules are to be used and what options are supplied
    to each module is usually stored in the file `/etc/conf.modules`. The two main
    options of interest (for ether cards) will be used in this file as `alias` and
    options. The modprobe command consults this for module information.


    The actual modules themselves are typically stored in a directory named `/lib/modules/`
    (uname -r gives the kernel version e.g. 2.0.34). You can look in there to see
    which modules match your card.


    The first thing you need in conf.modules file is something to tell modprobe which
    driver to use for the eth0 and network interface. For example, if you have an
    ISA SMC EtherZ card which uses the smc-ultra driver module, you need to alias
    this driver to eth0 by adding the line:


    ```

    alias eth0 smc-ultra

    ```


    The other thing you need is an options line indicating what options are to be
    used with a particular module (or module alias). Continuing with the above, for
    example, if you only the single alias line with no options line, the kernel would
    warn you (dmesg) autoprop for ISA cards is not a good idea. To get rid of this,
    you would add another line telling the module I/O base card is configured in,
    this case use the hexadecimal address 0x280 for example.


    ```

    options smc-ultra io=0x280

    ```


    Most ISA modules accept parameters like io=0x340 and irq=12 on the insmod command
    line. It is REQUIRED or at least STRONGLY ADVISED that you supply these parameters
    to avoid probing for the card. Unlike PCI and most devices, there is no real way
    to do auto-probing for most ISA devices, and so it should be avoided when using
    drivers as modules.


    A list of the options that each module can be found in the file:


    `/usr/src/linux/Documentation/networking/net-modules.txt

