- md: '

    # Linux Ethernet-Howto


    See DEC 21040 for information on these cards, and the present driver situation.


    ## 4.44 Identifying an Unknown Card


    Okay, so your cousin''s neighbour''s friend had a brother who found an old ISA
    card in the AT case he used as a cage for his pet hamster. You ended up with the
    card and want to try and use it with linux, but nobody has a clue what the card
    is and there isn''t any documentation.


    First of all, look for any model numbers that might give a clue. Any model number
    that contains 2000 will most likely be a NE2000 clone. Any cards with 8003 or
    8013 on somewhere will be Western/Digital WD80x3 cards or SMC Elite cards or clones
    of them.


    ### Identifying the Interface Controller


    Look for the biggest chip on your card. This will be identified by the part number.
    If you know which NIC is on the card, the following might be able to help you
    figure out what card it is.


    Probably still the most common NIC is the National Semiconductor DP8390, NS32490,
