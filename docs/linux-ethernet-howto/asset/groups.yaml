    # 4. Vendor/Manufacturer/Model Specific Information


    The following lists many characters in alphabetic order by vendor name and then
    identifier. Beside each product ID, you will see ‘Supported’, ‘Semi-Supported’
    or ‘Not Supported’


    Supported means that a driver for that card exists, and many people are using
    it and it seems quite reliable.


    Semi-Supported means that a driver exists, but at least one of the following descriptions
    is true: (1) The driver and/or hardware are buggy, which may cause poor performance,
    failing connections or crashes.(2) The driver is new or the card is fairly uncommon,
    and hence the driver has seen very little use/testing and the driver has had little
    feedback. (2) is preferable to (1), and the individual description of the card/driver
    should mark which one holds true. In either case, you will probably have to answer
    ‘Y’ when asked ‘Prompt for development and/or incomplete code/drivers when running
    `config`.


    Not Supported means there is not a driver currently available for that card. This
    could be due to a lack of interest in hardware that is rare/uncommon, or because
    the vendors won''t release the hardware documentation to write a driver.


    Note that the difference between ‘Supported’ and ‘Semi-Supported’ is also subjective,
    and is based on user feedback newsgroup postings and mailing lists.(After all,
    it is impossible for one person to test all drivers with all cards for each kernel
    version!!! So be warned that semi-supported works perfectly for you (which is
    great), or that a card listed as supported gives you end of troubles and problems
