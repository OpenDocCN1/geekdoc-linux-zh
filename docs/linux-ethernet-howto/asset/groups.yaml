    （上。）如果你传入一个不在上述集合的 IRQ 值，你将收到上述消息。通常，没有必要为 3c503 指定中断值。3c503 在配置时会自动检测中断（autoIRQ），并选择一个
    IRQ（5, 2/9, 3, 4）。


    解决方案：使用上述列出的 IRQ 列表之一，或者通过完全不指定 IRQ 行来启用 autoIRQ。


    问题：提供的 3c503 驱动没有使用 AUI（粗轴网）端口。如何从默认端口之外选择它？


    解决方案：对于内核驱动，3c503 AUI 端口可以在启动时选择；对于模块驱动，可以在插入模块时选择。选择重载到当前未使用的 `dev->rmem_start`
    变量的低位，因此使用启动时参数：


    ```

    LILO linux ether=0,0,0,1,eth0

    ```


    对于内核驱动应该是有效的。

    当作为模块加载时指定 AUI 端口，请在模块选项中随你的 I/O 和 IRQ 值附加 `xcvr=1`。


    ## 2.8 常见问题（通用型）


    ## Linux 和 ISA 即插即用以太卡


    为了获得最佳效果（并减少麻烦），建议你使用网卡自带的（通常是 DOS）程序来禁用 PnP 机制，并将其设置为固定的 I/O 地址和 IRQ。确保你使用的 I/O
    地址是驱动程序在启动时提供的，如果使用模块，则在 `/etc/conf.modules` 中通过 `io=` 选项提供地址。你可能还需要进入 BIOS/CMOS
    设置，并将 IRQ 标记为 Legacy–ISA 而不是 PnP（如果你的电脑有此选项）。


    注意，你通常不需要安装 DOS 来运行基于 DOS 的配置程序。你通常只需要启动 DOS 磁盘并从软盘运行。你也可以免费下载 OpenDOS 或 FreeDOS。


    如果你为了与某些其他操作系统兼容而需要 PnP，那么你必须使用 `isaapptools` 包在每次启动时包含这些网卡。你仍然必须确保 I/O 地址是由驱动程序选择或作为
    `io=` 选项提供的。


    某些系统在 BIOS/CMOS 设置菜单中有一个“启用 PnP OS”（或类似名称）选项，在所有情况下或当网卡无法正常工作或无法检测到时都需要禁用。一位用户的描述最为贴切：“我不知道背后发生了什么，但它似乎是这样。”


    ## 启动时未检测到以太卡。


    这种情况的通常原因是人们使用的内核没有内置对其特定网卡的支持。对于模块化内核，通常意味着没有请求加载所需的模块，或者需要作为模块选项指定 I/O 地址。


    如果你使用的是由 Linux 发行版安装的模块化内核，那么你应该使用该发行版的配置工具来选择对应网卡的模块。对于 ISA 卡，最好的做法是确定网卡的 I/O
    地址，并在配置工具询问任何选项时将其作为选项添加（例如：`io=0x340`）。如果没有配置工具，你将必须在 `/etc/conf.modules` 中添加正确的模块名称（和选项）——更多详情请参见
    `modprobe`。


    如果你使用的是发行版中自带的预编译内核，请检查文档以查看你安装的是哪个内核，以及它是否支持你的特定网卡。如果不支持，你的选择是获取一个支持它的内核，或者构建你自己的内核。


    通常情况下，只编译需要的驱动程序来构建内核是明智的，因为这可以减小内核体积（为应用程序节省宝贵的 RAM！），并减少让敏感硬件产生的设备探测次数。构建内核并没有听起来那么复杂。你只需要对一系列你需要的驱动回答“是”或“否”，剩下的工作由它完成。


    下一个主原因是另一个设备使用了该网卡需要的部分 I/O 空间。大多数网卡在 I/O 空间占用 16 或 32 字节。如果你的网卡设置为 0x300 且占用
    32 字节，那么驱动程序将请求 0x300-0x31f。如果任何其他设备在该范围内的任何地方注册了一个端口，探测将在该地址发生，驱动程序将静默继续到下一个探测地址。启动后，执行
