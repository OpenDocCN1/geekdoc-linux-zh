    ```

    alias eth0 wd

    alias eth1 3c503

    options wd io=0x280

    options 3c503 io=0x350

    ```


    For PCI cards, you might use the alias lines to correlate the ethN interfaces
    with the appropriate driver name, since the I/O base of a PCI card can be safely
    detected.


    The available are typically stored in /lib/modules/~uname -r/net where the uname
    -r command gives the kernel version (e.g. 2.0.34). You can look in there to see
    which one matches your card. Once you have the correct settings in your conf.modules
    file, you can test out with:


    ```

    modprobe ethn

    dmesg | tail

    ```


    where ''N'' is the number of the ethernet interface you are testing.


    With the Driver Compiled into the Kernel: If you have the driver compiled into
    the kernel, then the hooks for multiple cards are all there. However, at the moment
    only one card is auto-probed for default. This helps to avoid boot time hangs
    caused by probing sensitive cards.


    (Note: As late of 2.1.x cards, the boot probes have been sorted into safe and
    unsafe, so that all safe (e.g. PCI and EISA) probes will find all related cards
    automatically. Systems with more than one ethernet card with least one of them
    being an ISA card will still need to do one of the following)


    There are two ways that you can enable auto-probing for the second (and third,
    and...) card. The easiest method is to pass boot-time arguments to the kernel,
    which is usually by using a boot-time argument as simple as ether=0,0,eth1. In
    this case eth0 and eth1 will be assigned in the order that the cards are found
    at boot. Say if you want the card at 0x300 to be eth0 and the card at 0x280 to
    be eth1 then you could


    ```

    LILO: linux ether=5,0x300,eth0 ether=15,0x280,eth1

    ```


    The command accepts more than one IRQ / I name also. Please look at Passing Ethernet
    Arguments... for the full syntax, card specific parameters, and LILO tips.


    These boot time arguments can be permanent so that you don''t have to re-enter
    them every time. The LILO configuration option ''append'' in the LILO manual.


    The second way (not recommended) is to edit the file Space.c and replace the 0xff0
    entry for the I/O address with a zero. The 0xfe0 entry tells not to probe for
    that device --- replacing it with a zero will enable autoprobing for that device.


