    \ 8008–8088 计算机的网络来说是可以的，因为处理每个数据包并响应需要数百毫秒，但现代网络对于每笔交易都会发送连续的数据包。\n\n支持 AutoIRQ，不使用\
    \ DMA，自动探测（autoprobe）只查看 0x280 和 0x300，调试级别通过启动时的第三个参数设置。\n\n再次强调，强烈不建议使用 3c501！在使用\
