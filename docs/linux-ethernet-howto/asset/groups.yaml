    If you are starting a network from scratch, you will have to decide whether to
    use ethernet (RG58 coax cable with BNC connectors) or 10BaseT (twisted pair tele-style
    cable with RJ–45 wire ‘phone’ connectors). The old-fashioned twisted ethernet,
    RG–5 with N connectors is obsolete and rarely seen anymore.


    See Type of cable..., for an introductory look at cables. Also note that the FAQ
