    驱动工作是否可以退货。


    # SMC EtherPower II PCI (9432)


    这些卡基于 SMC 83ec170 芯片，与基于 Tulip 的卡完全不同。内核 v2.0 和 v2.2 已包含支持这些卡的新驱动程序。更多细节请参见：


