    # Linux Ethernet-Howto


    Solution: The driver in kernel 2.0 and above also supports the programmed I/O
    mode of operation. Upgrade to v2.0 or newer.


    Problem: Old wd8003/or jumper-settable wd8013 always gets the IRQ wrong.


    Reason: The old wd8003 and jumper-settable wd8013 clones don''t have the EEPROM
    that the driver can read the IRQ setting from. If the driver can''t read the IRQ,
    it tries to auto-IRQ to find out it is. And if auto-IRQ returns zero, the driver
    assigns IRQ 5 for an 8-bit or IRQ 10 for a 16-bit.


    Solution: Avoid the auto-IRQ code


    Problem: SMC card is detected as wd8013, but the IRQ and shared memory base is
    wrong.


    Reason: The ultra card looks like a wd8013, and if the ultra is not present in
    the kernel, the wd may mistake the ultra as a wd8013. The ultra probe comes before
    the wd probe, so this usually shouldn''t happen. The ultra stores the IRQ and
    mem base in the EEPROM differently than a wd8013, hence the bogus values reported.


    Solution: Recompile with only the drivers you need in the kernel. If you have
    a mix of wd and ultra cards in one machine, and are using modules, load the ultra
    module first.


