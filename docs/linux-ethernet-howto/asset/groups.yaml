    As a final example, consider a user with 3c503 card at 0x350 and SMC Elite 16
    (wd8013) card at 0x280. They would have:


    ```

    alias eth0 wd

    alias eth1 3c503

    options wd io=0x280

    options 3c503 io=0x350

    ```


    For PCI cards, you might use the alias lines to correlate the ethN interfaces
    with the appropriate driver name, since the I/O base of a PCI card can be safely
    detected.


    The available are typically stored in /lib/modules/$(uname -r)/net where the uname
    -r command gives the kernel version (e.g. 2.0.34). You can look in there to see
    which one matches your card. Once you have the correct settings in your conf.modules
    file, you can test out with:


    ```

    modprobe ethn

    dmesg | tail

    ```


    where ''N'' is the number of the ethernet interface you are testing.


    With the Driver Compiled into the Kernel: If you have the driver compiled into
    the kernel, then the hooks for multiple cards are all there. However, at the moment
    only one card is auto-probed for default. This helps to avoid boot time hangs
    caused by probing sensitive cards.


    (Note: As late of 2.1.x cards, the boot probes have been sorted into safe and
    unsafe, so that all safe (e.g. PCI and EISA) probes will find all related cards
    automatically. Systems with more than one ethernet card with least one of them
    being an ISA card will still need to do one of the following)


    There are two ways that you can enable auto-probing for the second (and third,
    and...) card. The easiest method is to pass boot-time arguments to the kernel,
    which is usually by using a boot-time argument as simple as ether=0,0,eth1. In
    this case eth0 and eth1 will be assigned in the order that the cards are found
    at boot. Say if you want the card at 0x300 to be eth0 and the card at 0x280 to
    be eth1 then you could


    ```

    LILO: linux ether=5,0x300,eth0 ether=15,0x280,eth1

    ```


    The command accepts more than one IRQ / I name also. Please look at Passing Ethernet
    Arguments... for the full syntax, card specific parameters, and LILO tips.


    These boot time arguments can be permanent so that you don''t have to re-enter
    them every time. The LILO configuration option ''append'' in the LILO manual.


    The second way (not recommended) is to edit the file Space.c and replace the 0xff0
    entry for the I/O address with a zero. The 0xfe0 entry tells not to probe for
    that device --- replacing it with a zero will enable autoprobing for that device.


    ## 2.3 Using more than one Ethernet Card per Machine


    ## 2.4 The ether= thing didn''t do anything for me. Why?


    As described above, the ether= command only works for drivers that are compiled
    into the kernel. Now most distributions use the drivers in a modular form, and
    so the ether= command is rarely used anymore. (Some older documentation has to
    be updated to reflect this change.) If you want to apply options for a modular
    ether driver you must make changes to the /etc/conf.modules file.


    If you are using a compiled driver, and have added an ether to your LILO configuration
    file, note that it won''t take effect until you re-run lilo to process the updated
    configuration file.


    ## 2.5 Problems with NE1000 / NE2000 cards (and clones)


    **Problem:** PCI NE2000 clone is not detected at boot with v2.0.x.


    **Reason:** the ne_c driver up to v2.0.30 only knows about the PCI ID of RealTek
    8029 based cards. Since then, several others have also released PCI NE2000 clone
    cards, with different PCI numbers, and hence the driver does not detect them.


    **Solution:** The easiest solution is to upgrade to a v2.0.31 (or newer) version
    of the linux kernel. It knows the ID numbers of five different NE2000-chips, and
    will detect them automatically at boot or module loading. If you upgrade to v2.0.34
    (or newer) there is a PCI-only NE2000 driver that is slightly smaller and more
    efficient than the original ISA/PCI driver.


    **Problem:** PCI NE2000 clone is reported as ne1000 (ISA card!) at boot or when
    I load the module for v2.0.x, and hence doesn''t work.


    **Reason:** Some PCI clones don''t implement wide access (and hence are not truly
    NE2000 compatible).


    **Solution:** You need to upgrade to v2.0.31 (or newer) as described above.


    **Problem:** PCI NE2000 card gets terrible performance, even when reducing the
    window size as described in the Performance Tips section.


    **Reason:** The spec for the original chip, designed and sold over years ago,
    noted that a dummy read was required before each write for maximum reliability.
    The driver has the facility to do this but has been disabled since the v1.2 kernel.
    One user reported that re-enabling this ''bug'' helped their performance with
    a cheap PCI card.


    **Solution:** Since it has only been reported by a single person, don''t get up.
    Re-enabling the read fix is simply editing the driver file in linux/drivers/net/,
    uncommenting the line containing USE_RW_BUG and rebuilding the kernel or module
    as appropriate. This can be done for the ne2pci.c driver as well.


    **Problem:** The ne2pci.c driver reports errors timeout waiting for Tx with a
    PCI NE2000 card and does not work.


    **Reason:** Your card and the PCI bus can''t handle the long I/O optimization
    used in Linux-Howto.


    **Solution:** Firstly, check the settings available in the BIOS/CMOS to see if
    any related to PCI bus timing are overdue for reliable operation. Otherwise using
    the ISA/PCI driver (or removing #define USE_LONGIO from ne2pci.c) should let you
    use.


    **Problem:** ISA Plug and Play NE2000 (as RealTek 8019) is not detected.


    **Reason:** The original NE2000 specification (and hence the linux driver) does
    not have support for Plug and Play.


    **Solution:** Use the DOS configuration scheme that came with the card to disable
    PNP, and to set the card to specified I/O address and IRQ. Add a line to /etc/conf.modules
    io=0xNNN where 0xNNN is the I/O address to set the card. This takes you if you
    are using a module driver; if not using the ether=0,0NNN,eth0 argument at boot.
    You may also have to enter the BIOS/CMOS setup and mark the IRQ as Legacy instead
    of PNP. Alternatively, if you need to leave PNP enabled for compatibility with
    some other operating system, then look into isapp. Try making PNP disabled to
    see if it is enabled on your system. If not, have a look at the following URL:
    ISA PNP Tools


    **Problem:** NE*000 driver reports ''not found (ne ack)'' during boot process.


    **Reason:** This is related to the above change. The initial verification that
    the probed I/O address is 8390 the reset is performed. When the card has completed
    the reset, it is supposed to acknowledge that the reset has completed. Your card
    does not, so the driver assumes that NO card is present.


    **Solution:** You can tell the driver that you have a bad card by using unused
    mem_end hexadecimal value of 0xbad at boot time. You have to supply a non-zero
    I/O base for the card using the 0xbad override. For example, that is 0x340 that
    doesn''t ack the reset would using something like:


    ```

    LILO: linux ether=0,0x340,0xbad,eth0

    ```


    This will allow the card detection to continue, even if your card does not ACK
    the reset. If you are using the driver as a module, you can supply the base=0xbad
    just like you supply the I/O address.


    **Problem:** NE*000 card hangs at first network access.


    **Reason:** This problem has been reported for kernels as 1.5.7 to the present.
    It appears confined to a few software configurable clones. It appears that they
    need to be initialized in some special way.


    **Solution:** Several people have reported that running the DOS software config
    and/or the supplied DOS driver prior to warm booting (i. loadlin or the ''three-finger-sal'')
    into linux allowed the card to work. This would indicate that these needs to be
    initialized in a particular fashion, slightly different than what the Linux driver
    does.


    **Problem:** NE*000 ether at 0x360 doesn''t get detected.


    **Reason:** Your NE2000 card is 0x20 in I/O space, which makes it the parallel
    port at 0x378. Other devices that could be the second floppy controller (if equipped)
    at 0x370 and the secondary IDE.

