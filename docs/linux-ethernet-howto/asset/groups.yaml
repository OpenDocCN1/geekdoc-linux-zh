    # Linux 以太网指南


    特殊情况的选项。Hublet 价格从 125 美元起，Etherwave 在板卡价格的基础上增加了 75–100 美元 --- 如果你少拉了一根线，这钱花值；但如果你缺了两个网络插口，就不值了。


    # Farallon PCI 593


    状态：已支持，驱动名称：de4x5, tulip


    据报道，此卡已通过 de4x5 驱动检测。


    # 4.18 富士通 (Fujitsu)


    与许多网络芯片制造商不同，富士通也制造并销售了一些基于其芯片的网卡。


    # 富士通 FMV–181/182/183/184


    状态：已支持，驱动名称：fmv18x


    根据驱动程序，这些卡是标准的富士通 MB86965 实现，这使得它们与 Allied Telesis AT1700 卡相似。


    # 4.19 惠普 (Hewlett Packard)


    272** 网卡使用程序化 I/O (PIO)，类似于 NE*000 板卡，但在访问时可以“关闭”数据传输端口，从而避免自动寻址 (autoprobiding)
    的问题。


    感谢 Glenn Talbott 清理了本节关于 HP 硬件版本号的混乱。


    # HP Night Director+ 10/100


    状态：已支持，驱动名称：pcnet32


    显然这些卡使用的是 AMD 79C972 芯片。


    # 27245A


    状态：已支持，驱动名称：hp (+8390)


    8 位 8390 base10BaseT，不建议对所有 8 位都使用。它在几年前被重新设计为高度集成，这导致初始化时序的某些更改仅影响了测试程序，而不影响局域网驱动程序。（新卡在切换进入和退出环回模式后并非立即“准备就绪”。）


    如果你打算将此驱动程序作为加载模块使用，可能应该查看“作为模块使用以太网驱动程序”以获取特定信息。


