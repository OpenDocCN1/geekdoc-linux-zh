    Status: Supported, Driver Name: ne (+8390)


    These are Winbond’s Isa 10Mbps ne2000 compatible ethernet chips. Setup programs
    are available at the Winbond site.


    # Winbond 89c940


    Status: Supported, Driver Name: ne,2k–pci (+8390)


    This chip is one of the commonly found on the low price PCI ne2000 cards sold
    by lots of manufacturers. Note that this is still a 10+ year old design just glued
    onto a PCI bus. Performance won’t be staggeringly better than the equivalent ISA
    model.


    # Xircom


    For the longest time, Xircom wouldn''t release the programming information required
    to write a driver, unless you signed your life away. Apparently enough linux have
    ped them for driver support (they claim to support all popular networking operating
    systems...) so they have changed their policy to allow documentation to be released
    without having to sign a non-disclosure agreement. Some people have said they
    will release the source code to the SCO driver. If you are interested and want
    to check into this, you can reach Xircom at 1-800-874-7875, 1-800-874-4526 or
    +1-818-878-7600.


    # Xircom PE1, PE2, PE3–10B


    Status: Not Supported.


    Not to get your hopes up, but if you have one of these parallel port adapters,
    you may be able to use it in the DOS emulator using Xircom-supplied DOS drivers.
    You will have to allow DOSEMU access to your parallel port, and will probably
    have to play with SIG (DOSEMU''s Silly Interrupt Generator).


    # Xircom PCMCIA Cards


    Status: Semi-Supported, Driver Name: ????


    Some of the Xircom PCMCIA card(s) have drivers that are available with David Hinds
    PCMCIA package. Check there for the most up date information


    # Zenith


    # Z–Note


    Status: Supported, Driver Name: znet


    The built-in Z–Note network adapter is based on the Intel i2593 using two DMA
    channels. There is an (alpha?) driver available in the present kernel version.
    As with all notebook and pocket adapters, it is under the ''Pocket and portable
    adapters'' section when make config. Also note that the IBM ThinkPad 300 is compatible
    with the Z–Note.


    # Znyx


    # Znyx ZX342 (DEC 21040 based)


    Status: Supported, Driver Name: de4x5, tulip


    You have a choice of two drivers for cards based on this chip. There is the DE425
    driver written by David, and the generic 21040 driver that Donald has written.


    Note as of 1.1.91, David has added a compile time option that may allow non–DEC
    cards (such as the Znyx cards) to work with this. Have a look at README, de4x5
    for details.

