    Linux), and it still ties up the CPU.


    # Slave (normal) Direct Memory Access (e.g. none for Linux!)


    Pro: Frees the CPU during the actual data transfer.


    Con: Checking boundary conditions, aligning contiguous buffers, and programming
    the DMA registers makes it the slowest of all techniques. It also uses a scarce
    DMA channel, and requires aligned memory buffers.


    # Bus Master Direct Memory Access (e.g. LANCE, DEC 21040)


    Pro: Frees the CPU during the data transfer, can string together buffers, can
    require little or no CPU time lost on the bus. Most of bus-mastering drivers now
    use a ‘copybreak’ scheme where large packets are put directly into a kernel buffering
    by the card, and small packets are copied by the CPU which primes the cache for
    subsequent processing.


    Con: (Only applicable to ISA cards) Requires low–memory buffers and a DMA channel
    for channels. Any bus-master will have problems with other bus-masters that are
    bus-hogs, especially some primitive SCSI adapters. A badly-designed motherboard
    chipsets have problems with bus-masters. A reason for not using any type of DMA
    device is using a 486 processor for plug-in-replacement of a 386: these processors
    must flush their cache with each DMA cycle. (This includes the Cx486DLC, Ti486DLC,
    Cx486SLC, Ti486SLC, etc.)


    # 7.2 Performance Implications of Bus Width


    The ISA can do 5.3MB/sec (42MB/sec), which sounds like not enough for 10Mbps ethernet.
    In the case of the 100Mbps cards, you need a faster buffer to take advantage of
    the network bandwidth.


    # ISA Eight bit vs ISA 16 Bit Cards


    You probably can''t buy a 8 bit ISA ethercard, but you will find lots of them
    turning up at computer swaps and meets for the next few years, at very low prices.
    This will make them popular for ‘home–ether’ systems. The above holds true for
    16 bit ISA cards now, since PCI cards are now common.


    Some 8 bit cards that provide adequate performance for light usage are the wd8003,
    the 3ec501 provides poor performance, and these ne1000 poor 12 year old relics
    of the XT days should be avoided. (Send them to Alan, he collects them…)


    The 8 bit path data doesn''t hurt performance, much, as you can expect to get
    about 800/800 kb/ps download speed to an 8 bit wd8003 card (on a fast ISA bus)
    from a fast host. And if most of your net-traffic is going to remote sites, then
    the bottleneck in the path will be elsewhere, and the only speed difference you
    notice is during net activity near your local subnet.


    Slave (normal) Direct Memory Access (e.g. none for Linux!)'
  - '[PAGE 75]


    # 7.3 32 Bit (VLB/EISA/PCI) Ethernet Cards


    Note that a 10Mbit network typically doesn''t justify requiring a 32 bit interface.
    See Programmed I/O vs... as to why a 10Mbps ethernet on 8MHz ISA bus is really
    not a bottleneck. Even having the ethernet on a fast bus wasn''t necessarily mean
    faster transfers, it usually meant reduced CPU overhead, which is good for multi-user
    systems. Of course 100Mbps networks, which are now commonplace, the 32 bit interface
    is a must to use the full of the bandwidth.


    # 7.4 Writing a Driver


    The only thing that you need to use an ethernet card with Linux is the appropriate
    driver. For this, it is essential that the manufacturer will release the technical
    programming information to the general public without you (or anyone) having to
    sign your life away. A good guide for the likelihood of getting documentation
    (or, if you aren''t writing code, the likelihood that someone else will write
    that you require, really need) is the availability of the Cynr (near Clarkson)
    packet driver. Russ Nelson his operation, and has been very helpful in supporting
    the development of drivers for Linux. Net-surfers can try this


    +   Russ Nelson''s Packet Drivers


    Given the documentation, you can write a driver for your card and it for Linux
    (at least in). Keep in mind that some old hardware was designed for XT type machines
    will not function well in a multitasking environment such as Linux. These will
    lead to problems if your network needs a reasonable amount of traffic.


    Most cards come with MS–DOS interfaces as NDIS and ODI, but these are useless
    for Linux. Many people have suggested directly linking them in or automatic translation,
    but this is nearly impossible. The MS–DOS drivers expect to be in 16 bit mode
    and hook into ''software interrupts'', both incompatible with the Linux kernel.
    This incompatibility is actually a feature, as Linux drivers are considerably
    better than their MS–DOS counterparts. The ''8390 series drivers, for instance,
    use ping–pong transmit buffers, which are only now being introduced in the MS–DOS
    world.


    (Ping-pong TX buffers using at least 2 max–size packet buffers for TX packets.
    One is loaded while the card is transmitting the second is then sent as the first
    is finished, and so on. In this way, cards are able to continuously send-back-back
    packets over the wire.


    OK. So you have decided to write a driver for the Foobar card, as you have the
    programming information, and it''s been done yet. (...these are the two main requirements
    (-) You should start with the skeleton kernel driver that is provided by the Linux
    kernel source. It can be found in the file linux/drivers/net/skeleton.c in all
    recent kernels. In 2.4x (and newer) kernels it has been renamed to isa-skeleton.c.
    Also have a look at the Kernel Hackers Guide, at the following URL: KHG


    # 7.5 Driver interface to the kernel


    Here are some notes on the functions that you would have to write if creating
    a new driver. Reading this in conjunction with the above skeleton driver may clear
    things up.'
  - '[PAGE 76]


    # Linux Ethernet-HowTo


    # Probe


    Called at boot for check existence of card. Best is if it can un-obtrusly reading
    from memory, etc. Can also read from I/O ports. Initial writing to I/O ports is
    not good as it may kill any device. Some device initialization is usually done
    here I/O space (allocating I/O space, IRQs,filling in the dev->??? fields etc.)
    You need to know how ports/mem the card can be configured, how to enable shared
    memory (if used) and how to select/enable interrupt generation, etc.


    # Interrupt handler


    Called by the kernel when the card posts an interrupt. This has the job of determining
    why the card posted an interrupt, and acting accordingly. Usual interrupt conditions
    are to be rec''d, transmit complete, error conditions reported. You need to know
    any relevant interrupt status bits so that you can accurately


    # Transmit function


    Linked to dev->hard_start_xmit and is called by the kernel when there is some
    data that the kernel wants to put over the device. This puts the data onto the
    card and triggers the transmit. You need to know how to bundle the data and how
    to get it onto the card (shared memory copy, PIO transfer, DMA?) and in the right
    place on the. Then you need to know how to tell the card to send the data down
    the wire, and (possibly) post an interrupt when done. The hardware cannot accept
    additional packets it should set the dev->busy flag. When additional room is available,
    during a transmit-complete interrupt, dev->busy should be cleared and the higher
    levels informed with `mark_bh (INET_BH)`.


    # Receive function


    Called by the kernel interrupt handler when the card reports there is data on
    the card. It pulls the data off the card, packages it into a sk_buff and lets
    the kernel know the data is here for it doing a netif_rx(sk_buff). You need to
    know how to enable interrupt generation upon Rx of data, how to check any Rx status
    bits, and how to get that data off the card (again sh mem, PIO, DMA, etc.)


    # Open function


    linked to dev->open and by the networking layers when somebody does ifconfig eth0
    – this puts the device on line and enables it for Rx/Tx of data. Any initialization
    incantations that were not done in the probe sequence (enabling IRQ generation,
    etc.) would go in here.


    # Close function (optional)


    This puts the card in a sane state when someone does ifconfig eth0 down. It should
    free the IRQs and DMA channels if the hardware permits, and turn off anything
    that will save power (like the transceiver).


    # Miscellaneous functions


    Things like a reset function, so that if they go south, the driver can reset the
    card as a last ditch effort. Usually when a Tx times out or similar. A function
    to read the statistics registers of the card if so equipped.


    Probe


