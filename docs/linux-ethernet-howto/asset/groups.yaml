    This obsolete stone-age 8 bit card is really brain-damaged to use. Avoid it like
    the plague. Do not purchase this card, even as a joke. It''s performance is horrible,
    and it breaks in many ways.


    For those not convinced, the 3c501 can only do one thing at a time — while you
    are removing one packet from the single-packet buffer it cannot receive another
    packet, nor can it receive a packet while loading a transmit packet. This was
    fine for a network between 8008–8088 computers where processing each packet and
    replying 100s of msecs, but modern networks send back–to–back packets for almost
    every transaction.


