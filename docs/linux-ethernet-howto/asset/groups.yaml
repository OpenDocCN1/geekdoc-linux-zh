    # Linux 以太网教程


    如果你没有看到类似的驱动识别信息，那么驱动程序将无法检测你的网卡，这就是功能无法运行的原因。如果网卡未被检测到，请查看常见问题解答（FAQ 部分）了解如何处理。如果你使用的是
    NE2000 兼容网卡，FAQ 部分中也有关于如何检测 NE2000 网卡的特殊说明。


    如果检测到了网卡，但检测信息报告了某种错误（例如资源冲突），那么可能是驱动程序没有被正确初始化，但网卡仍然可以使用。此类最常见的错误信息也列在 FAQ 部分中，并附有解决方案。


    如果检测信息看起来正常，请仔细比对驱动程序报告的网卡资源是否与网卡的物理设置一致（通过网卡上的微型黑色跳线设置，或通过网卡制造商提供的软件工具进行设置）。两者必须完全匹配。例如，如果你将网卡跳线或配置为
    IRQ 15，而驱动程序在启动信息中报告为 IRQ 10，这将将无法工作。FAQ 部分详细说明了驱动程序错误检测各种网卡配置信息的常见情况。


    到此时，你可能已经检测到一个参数完全正确的网卡，并希望一切运行正常。如果没有，那么说明你存在软件配置错误或硬件配置错误。软件配置错误是指为 `ifconfig`
    路由命令设置错误的网络地址，有关如何操作的细节已在《网络教程》和《网络管理员指南》中详细描述，这些文档可能来自你安装的 CD-ROM。


    硬件配置错误是指某种资源冲突或配置错误（驱动在启动时未检测到）导致 `ifconfig` 尝试打开设备使用时停止，例如 `SIOCFLAGS: Try again`。驱动程序报告错误信息（通过
    `dmesg | more` 查看，每次发送或接收数据时不一致之处都会增加）。(3) 输入 `cat /proc/net/dev` 显示 `eth0` 在错误、drop、fifo、frame
    或 carrier 列中某一项显示为非零数字。(4) 输入 `cat /proc/interrupts` 显示网卡中断计数为 0。大多数典型的硬件配置错误在
    FAQ 部分中也有讨论。


    好了，如果你已经到了这一步但仍然无法工作，请阅读文档的 FAQ 部分，阅读详细介绍你网卡的厂商章节。如果仍然无效，你可能不得不在适当的新闻组发帖寻求帮助。如果发帖，请在帖子中详细说明所有相关信息，如网卡品牌、内核版本、驱动启动信息、`/proc/net/dev`
    的输出、问题的清晰描述，以及你为了让功能正常而已经尝试过的操作。


    你会惊讶地发现有多少人发布诸如“能帮帮我吗？我的以太网无法工作”之类毫无用的帖子。新闻组的读者往往会忽略此类愚蠢的帖子，而详细且信息丰富的问题描述可能会让
    Linux 专家一眼看出你的问题。在通过邮件报告问题时也是如此——务必提供尽可能的信息。


    # 1.4 你的网卡应支持的电缆类型


    双对线，但 RJ-45（大电话插口）连接器在技术上被称为 10BaseT。你也可能听到它被称为 UTP（非屏蔽双对线）。


    细网，或以太网电缆（RG-58 同轴电缆），带有 BNC（金属推入旋转锁定）连接器在技术上被称为 10Base2。


    较粗的以太网（10mm 同轴电缆）仅用于旧的安装环境中，被称为 10Base5。

    某些以太网卡上的 15 脚 D 型插头（AUI 连接器）用于连接粗以太网和外部网络。


    大多数以太网还提供仅贵 10–20 美元的“组合”（Combo）版本。这两种都内置了双对线和更细的收发器，允许你改变主意。


    大多数安装将使用 BaseT/100BaseT。10Base2 不提供到 100Base-whatever 的升级路径。对于由于某种原因希望购买集线器而搭建家庭网络的爱好者来说，10Base2
    足够了。


    对于使用不同类型以太网电缆的用户，请参阅《电缆，同轴线...》。


    # 2. 常见问题解答


    以下是关于在 Linux 中使用以太网连接的一些常见问题。其中一些特定问题已按“厂商”进行分类。你想要答案的问题很可能已经被别人问过了（而且！），即使你在这里没有找到答案，你可能也可以从
    Deherlands 等新闻组存档中找到你想要。


    # 2.1 我应该为 Linux 购买什么样的网卡？


    这个问题的答案很大取决于你打算用网络连接具体做什么，以及它将承担多大的流量。


    如果你只预期单个用户偶尔进行 ftp 会话或 WWW 连接，那么即使是一块旧的 8 位网卡可能也能让你满意。


    如果你打算建立服务器，并且要求将网络数据传输的 CPU 开销降至最低，你可能想看一个使用具有总线主控能力（bus-mastering）芯片的 PCI 卡，例如
    DEC tpl（21xxxx）芯片或 AMD PCnet-PCI 芯片。


    如果你处于上述两者之间，那么任何带有稳定驱动的低 PCI 或 16 位 ISA 网卡都能胜任工作。


