    # Ethernet for Linux on Other Hardware.


    There are several other hardware platforms that Linux can run on, as Atari;Amiga
    (m68k). As in the Sparc case it best to check with the home of each Linux port
    to that platform to see what is currently supported. (Links to such sites are
    here – send them!)


    # Linking or 100 BaseT without a Hub


    Can I link 10/100BaseT (RJ45) based systems together without a hub?


    You can link 2 machines, but no more than, with extra devices/gizmos. See Twisted
    Pair — it explains how to do it. And, you can''t hack a hub by crossing a few
    wires and stuff. It''s pretty much impossible to detect the collision right without
    duplicating a hub.


    # SIOCSIxxx: No such device


    I get a bunch of ''SIOCSIxxx: No such device'' messages at boot, followed by a
    ''SIOCADDRT: Network is unreachable! What is wrong?


    Your ethernet device was not detected at boot/module insertion time, and when
    ifconfig and route are run, you have no device to work with. Use dmesg | more
    to read the boot messages and see if there are any messages about detecting an
    ethernet card.


    # SIOCSFLAGS: Try again


    I get ''SIOCSFLAGS: Try again'' when I ''ifconfig'' — Huh?


    Some other device has the IRQ that you are trying to use, and so the ethernet
    card can''t get the IRQ. You don''t need to reboot to resolve this, as some devices
    release the IRQs when they need them. Examples include serial ports, floppy disk
    drive. You can check /proc/interrupts to see which interrupts are presently in
    use. Most of the Linux drivers only grab the IRQ when they are opened for use
    via ifconfig. If you can get the other device to ''let go'' of the required IRQ
    line, then you should be able to ''Try again'' with ifconfig.


    Ethernet for Linux on SUN/Sparc Hardware.


