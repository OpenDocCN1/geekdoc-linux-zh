    the equivalent of two runs of cable and a BNC T, but in this case, it is impossible
    for you to remove a cable from one of the T and disturb the network.


    ## 5.2 Twisted Pair


    Twisted pairs require active hubs, which start around $50, and the raw cable cost
    can actually be higher than thin. You can get many ugly claims that you are using
    your existing wiring as it is a rare installation that turns out to be the case.


    On the other hand, 100Mb/sec ethernet proposals twisted pair, and most new installations
    use twisted pair. Also, Russ Nelson adds "New installations use Category 5 wiring.
    Everything else is a waste of your time, as 100Base–whatever is going to go Cat
    5."


    If you are only connecting two machines, it is possible to avoid using a hub,
    swapping the Rx and Tx pairs (1–2 and 3–6).


    If you hold the RJ-45 connector facing you (as you were going to put it in your
    mouth) with the lock tab on the top, then the pins are numbered 1 to 8 from left
    to right. The pin usage is as follows:


    | Pin Number | Assignment |

    |---|---|

    | 1 | Output Data (+) |

    | 2 | Output Data (--) |

    | 3 | Input Data (+) |

    | 4 | Reserved for Telephone use |

    | 5 | Reserved for Telephone use |

    | 6 | Input Data (--) |

    | 7 | Reserved for Telephone use |

    | 8 | Reserved for Telephone use |


    If you want to make a cable, the following should spell it out for you: Differential
    signals must be on the same twisted pair to get the required minimal impedance/loss
    of a UTP cable. If you look at the above table, you will see that 1+2 and 3+6
    are the two sets of different signal. Not 1+3 and 2+6 at 10MHz, with short lengths,
    you *may* get away with such errors, if it is only over a short length. Don''t
    even think about it at 100MHz.


    For a normal patch cord, with ends `A` and `B`, you want straight pin-to-pin mapping,
    with input and output each a pair of twisted wires (for impedance). This means
    1A goes to 1B, 2A goes to 2B, 3A goes to 3B and 6A goes to 6B. The wires joining
    1A–1B and 2A–2B must be a twisted pair. Also the wires joining 3A–3B and 6A–6B
    must be another twisted pair.


    If you don''t have a cable, and want to make a `null cable`, what you want to
    do is make the input of `A` the output of `B` and the output of `A` be the input
    of `B`, without changing the polarity. This means 1A to 3B (out+ A in+ B) and
    2A to 6B (out– A in– B). These two wires are twisted pair. They carry what/plug
    `A` considers output, and what is seen as input/plug `B`. Then connect 3A to 1B
    (in+ A to out+ B) and also connect 6A to 2B (in– A to out– B). These second two
    must also be a twisted pair. They carry what/plug `A` considers output, and what/plug
    `B` considers output.


    So, if you choose a normal patch cord, one end off of it, swap the places of the
    Rx and Tx pairs into the new plug, and crimp it, then you have a `null` cable.
    Nothing connected. You could just feed the signal of one card into the Rx of the
    second and vice versa.


    Note that before 10BaseT was ratified as a standard, there existed other network
    formats using RJ–45 connectors, and the same wiring scheme above. Examples are
    SynOptics’s LatisNet, and AT&T’s StarLAN. In some cases (with early 3C05 cards)
    you could set jumpers to get the card to talk to hubs of different types, but
    in most cases designed for these other types of networks will not work with standard
    10BaseT networks/hubs. (Note if the cards also have an AUI port, then there is
    no reason why you can’t use that, combined with an AUI to 10BaseT transceiver).


