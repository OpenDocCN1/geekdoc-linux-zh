    Solution: Use the DOS configuration scheme that came with the card to disable
    PNP, and to set the card to specified I/O address and IRQ. Add a line to /etc/conf.modules
    ne io=0xXNNN where 0XNNN is the I/O address to set the card. This takes you if
    you are using a module driver; if not using an ether=0,0XNNN, eth0 argument at
    boot. You may also have to enter the BIOS/CMOS setup and mark the IRQ as Legacy-ISA
    instead of PNP. Alternatively, if you need to leave PNP enabled for compatibility
    with some other operating system, then look into isapptools. Try making isap disabled
    to see if it is enabled on your system. If not, have a look at the following URL:


    ISA PNP Tools


    Problem: NE*000 driver reports ''not found (ne ack)'' during boot process.


    Reason: This is related to the above change. The initial verification that 8390
    is the probed I/O address, the reset is performed. When the card has completed
    the reset, it is supposed to acknowledge that the reset has completed. Your card
    does not, so the driver assumes that NO card is present.


    Solution: You can tell the driver that you have a bad card by using unused mem_end
    hexadecimal value of 0xbad at boot time. You have to supply a non-zero I/O base
    for the card using the 0xbad override. For example, that is 0x340 that doesn''t
    ack the reset would using something like:


    ```

    LILO: linux ether=0,0x340,0xbad,eth0

    ```


    This will allow the card detection to continue, even if your card does not ACK
    the reset. If you are using the driver as a module, you can supply the base=0xbad
    just like you supply the I/O address.


    Problem: NE*000 card hangs at first network access.


    Reason: This problem has been reported for kernels as a 1.5.7 to the present.
    It appears confined to a few software configurable clones. It appears that they
    need to be initialized in some special way.


    Solution: Several people have reported that running the DOS software config and/or
