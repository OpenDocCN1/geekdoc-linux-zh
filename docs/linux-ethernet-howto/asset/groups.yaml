    # 1. 引言


    以太网指南涵盖了哪些以太网卡适用于 Linux、如何设置它们、如何运行多块网卡以及常见问题。它包含了关于所有可用网卡支持的详细信息。它不涵盖软件方面的内容，这些另有介绍。请注意，关于以太网的通用问题在这里并不予以解答。对于这类问题，请查看
    complansnet.com 中的精彩信息。你可以从 rtf.mit.edu 获取 FTP。本修订版涵盖了最新的信息。


    以太网指南作者：Paul Gortmaker, gortmaker@yahoo.com


    Linux 可用以太网驱动程序的初始信息来源：Donald J. Becker, becker@yld.com


    以太网指南本文档版权 (c) 1993–2000 Paul Gartner。请参阅文档末尾的免责声明和版权信息，有关重新发布的信息，我们对你可能造成的任何损坏不负责……


    ## 本档的新版本


    本文档的新版本可以从 Sunsite 的 Ethernet–HOWTO Archive 获取。这是“官方”位置——也可以在各种 Linux FTP 镜像站点找到。随着新信息的发布，将会进行更新。如果你阅读的版本已超过
    6 个月，那么你应该检查是否有各种格式（postscript, dvi, HTML 等）的更新版本。我建议通过 HTML（通过浏览器）或 Postscript/dvi
    格式查看，这两种格式包含了 ASCII 格式中不包含的交叉引用。由于本指南变得越来越大，你可能不想花整个下午读完。好消息是，HTML 和 Postscript/dvi
    版本带有目录，可以帮助你更快地找到所需内容。


    你之所以阅读本文可能是因为无法让它工作，并且不知道该做或检查什么。下一节（HELP 它无法工作！）是针对 Linux 新手的，将引导你走向正确的方向。我们遇到的问题通常会被人们反复询问。你的特定问题或疑问属于常见问题，并在
    FAQ 部分有解答。在发布求助之前，每个人应该查看这一节。


    如果你还没有以太网卡，你可能需要开始决定一个网卡。（我应该购买什么样的网卡……）


    如果你已经有了以太网卡，但不确定是否可以在 Linux 上使用，那么你应该阅读包含每个厂商和网卡特定信息的章节。（厂商特定信息……）


    如果你对 Linux 设备驱动程序的技术方面感兴趣，可以浏览带有此类信息的章节。（技术信息）


    ## 1.3 HELP – 它无法工作！


    好了，不要恐慌。这将引导你完成让一切工作的过程，即使你没有 Linux 或以太网硬件的背景知识。


    首先，你需要确定你的网卡型号，以便判断 Linux 是否有该特定卡的驱动程序。不同的网卡通常有被主机计算机控制的方式，而 Linux 驱动程序（如果有的话）以允许
    Linux 使用该网卡的格式包含这些信息。如果你没有任何关于网卡型号的说明书或类似物品，可以尝试帮助处理神秘网卡的章节（参考章节：识别未知网卡）。


    现在你已经知道自己拥有什么类型的网卡，请在特定章节（参考章节：厂商特定信息……）中阅读网卡的详情。该章节按字母顺序列出了网卡制造商、单个型号以及是否有驱动程序。如果是“支持（Supported）”，你就可以大功告成了。如果你在列表中没有找到你的网卡，请检查你的网卡是否列出与另一种网卡类型“兼容”。这里有很多例子，数千种不同的网卡与原始的
    Novel NE2000 设计兼容。


    假设你已经发现网卡有 Linux 驱动程序，你现在必须找到并使用它。不要仅仅因为操作系统在启动时首先加载，并包含了各种内容的驱动程序。）取决于你使用的特定发行版，可能只有几个预构建的内核和大量的独立驱动程序。人们遇到的大部分问题与未加载驱动有关，因此你可能会发现一切正常工作。


    到此时，你应该有某种方法带有你的驱动启动内核，或者将其作为模块加载。请参阅发行版自带的关于安装和使用模块的信息，以及本文档中的模块章节。（将驱动作为模块使用）


