  - '[PAGE 33]


    Note some old diskless 386 workstations have an on board 3c503 (made by 3Com and
    sold under different names, like `Bull`) the vendor ID is not a 3Com ID so it
    won''t be detected. More details can be found in the Etherboot package, which
    you will need always to boot these diskless boxes.


    # Etherlink Plus 3c505


    Status: Semi-Supported, Driver Name: 3c505


    These cards use i82586 chip that are not many of them about. It is included in
    the standard kernel, but it is classed as an alpha driver. Alpha Drivers for important
    information on alpha-test ethernet drivers with Linux.


    There is also the file /usr/src/linux/drivers/net/README.3c505 which you should
    read if you are using one of these cards. It contains various options that you
    can enable/disable.


    # Etherlink-16 3c507


    Status: Semi-Supported, Driver Name: 3c507


    This card uses one of the Intel chips, and the development of the driver is closely
    related to the development of the Intel Ether driver. The driver is included in
    the standard kernel release, but as an alpha driver. See Alpha Drivers for important
    information on alpha-test ethernet drivers with Linux.


    # Etherlink III, 3c509 / 3c509B


    Status: Supported, Driver Name: 3c509


    This card is fairly inexpensive and has good performance for an ISA non-master
    design. The drawbacks are that the original 3c509 requires very low latency. The
    3c509B shouldn''t suffer from the same problem, due to having a larger buffer.
    These cards use PIO transfers, similar to a n2000 card, so a shared memory such
    as a w8083 will be better in comparison.


    The original 3c509 has a small packet buffer (4KB total, 2KB RX, 2KB TX), causing
    the driver to occasionally drop a packet if interrupts are masked for too long.
    To minimize this problem, you can unmask interrupts during IDE disk transfers
    (see hdparm) and/or increasing your ISA bus speed finish sooner.


    The newer 3c509B has 8KB on board, and the buffer can be split 4/4, 5/3 or 6/2
    for Rx/Tx. This setting is changed with the DOS configuration utility, and is
    stored on the EEPROM. This should alleviate the above problem with the 3c509.


    3c509B users should use the supplied DOS utility to disable the plug and play,
    and to set the output method to what you require. The linux driver does not support
    the Autodetect setting method, so you have to select 10Base-T or 10Base-2 or UI.
    Note to turn off PnP you should do a 3C59XCFG /PNP: DISABLE and then with a hard
    reset to ensure that takes effect.


    Etherlink Plus 3c505'
  - '[PAGE 34]


    # Linux Ethernet-Howto


    for the 3c509 interrupts for some operations, blocking serial port interrupts.
    Thus the need for the `modem speed` setting. The Linux driver avoids the need
    to disable interrupts for long periods by operating only on whole packets. by
    not starting to transmit a packet until it is completely transferred to the card.


    Note that the ISA detection uses a different method than most cards. Basically,
    you use the cards by responding with data to an ID_PORT (port 0x100 to 0xff) on
    intervals of 0x10). This detection method means that a particular card will always
    be detected in a first ISA 3c509 configuration. The card with the lowest hardware
    address will always end up eth0. This shouldn''t matter to anyone, except for
    people who want to assign a 6 byte hardware address to a particular interface.
    If you have multiple 3c509 cards, it is best to append ether=0,0,ethN commands
    with the I/O prefix (i.use use I/zero) and allow the probe to start your card
    first. Using a non-zero I/O value will ensure it does not detect all your cards,
    don''t do it.


