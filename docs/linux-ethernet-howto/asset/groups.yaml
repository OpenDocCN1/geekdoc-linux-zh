    lock is then held for the short time it takes the processor to tell the card where
    memory to get/store the next network data packet. Modern card designs are less
    apt to require a single big lock around the driver as well.


    # Ethernet Cards for Linux on Alpha/AXP PCI Boards


    As of v2.0, only the 3c509, depca, de4e5, pcnet32, and all the 8390 drivers (wd,
    smc–ultra, ne, 3c503, etc.) have been made ‘architecture independent’ so as to
    work on the DEC Alpha CPU based systems. Other updated PCI drivers from Donald’s
    WWW page may work as have been written with architecture independence in mind.


    Note that the changes that are required to make a driver architecture independent
    are not complicated. You only need to do the following:


