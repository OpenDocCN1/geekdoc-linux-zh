    # 2.6 Problems with SMC Ultra/EtherEz and WD80*3 cards


    Problem: You get messages such as the following:


    ```

    eth0: bogus packet size: 65535, status=0xff, nxpg=0xff

    ```


    Reason: There is a shared memory problem.


    Solution: The most common reason for this is PCI machines that are not configured
    to map in ISA memory devices. Hence you end up reading the PC''s RAM (all 0xff
    values) instead of the RAM on the card that contains the data from the received
    packet.


    Other typical problems that are easy to fix are conflicts, having <shadow ROM''
    enabled for that region, running your ISA bus faster than 8MHz. There are also
    surprising number of memory failures on ethernet cards, so run a diagnostic program
    if you have one for your ethercard.


    Problem: SMC EtherEz does not work in non–shared memory (PIO) mode.


    Reason: Older versions of the Ultra driver only supported the card in the shared
    memory mode of operation.


