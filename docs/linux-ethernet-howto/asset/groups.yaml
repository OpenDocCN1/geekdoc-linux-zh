    基地址会自动检测，因此应使用值为零的值。


    ## NI5010

    状态：部分支持，驱动程序名称：ni5010


    你曾需要单独获取旧的 8 位 MiCom-Interlan 网卡的驱动，但现在它已作为实验性驱动包含在 v2.2 内核中。


    ## NI5210

    状态：部分支持，驱动程序名称：ni52


    此卡也使用了 Intel 芯片之一。Michael Hipp 为此卡编写了一个驱动程序。它作为“alpha”驱动程序包含在标准内核中。Michael 希望收到来自使用此卡的用户的反馈。请参阅“Alpha
    驱动程序”以获取有关在 Linux 中使用 alpha 测试驱动程序的重要信息。


    ## NI6510 (非 EB)

    状态：部分支持，驱动程序名称：ni65


    还有一个针对基于 LANCE 的 NI6510 的驱动程序，同样由 Michael Hipp 编写。同样，它也是一个“alpha”驱动程序。由于某些原因，此卡与
    GENERIC 驱动不兼容。参阅“Alpha 驱动程序”以获取有关在 Linux 中使用 alpha 测试驱动程序的重要信息。


    ## EtherBlaster (又 NI6510EB)

    状态：支持，驱动程序名称：lance


    从内核 1.2.33 开始，GENERIC 驱动程序增加了一个针对 0x52, 0x44 NI6510EB 特定签名的检查。然而，其他用户报告说该签名并非所有
    NI6510 卡都相同，这将导致 lance 驱动无法检测到你的网卡。如果遇到这种情况，你可以修改 probe 函数（大约在 `lance.c` 第 322
    行），以 `print()` 输出你网卡的值，然后使用这些值代替默认的 0x52, 0x44。


    在使用 lance 驱动程序时，网卡应在“高性能”模式下运行，而不是 NI6510 兼容模式。


    ## 4.31 RealTek


    ### RealTek RTL8002/8012 (AT–Lan–Tec) 口袋适配器

    状态：支持，驱动程序名称：atp


    这是一个由 AT–Lan–Tec 销售的通用低成本 OEM 适配器，可能有许多供应商。标准内核中包含了它的驱动程序。注意，驱动文件 `atp.c` 中包含大量信息。注意早期版本驱动中传递给
    ifconfig 的设备名称为 `eth0:atp`。


    ### RealTek 8009

    状态：支持，驱动程序名称：(+8390)


    这是一张 ISA NE2000 克隆卡，据报道与 linux2000 驱动配合良好。`rset8009.exe` 程序可以从 RealTek 网站 http://www.realtek.com
    或通过该站 获取。


    ### RealTek 8019

    状态：支持，驱动程序名称：(+8390)


    上述版本的“随插随用”版。使用操作系统软件禁用 PnP；将网卡设置为合理的 I/O 地址和 IRQ 即可就绪。（如果使用模块驱动，别忘记在 `/etc/conf.modules`
    中添加 `io=xNN` 选项）。`rset8019.exe` 程序可以从 RealTek 网站 http://www.realtek.com 或通过该站
    获取。


    ### RealTek 8029

    状态：支持，驱动程序名称：ne2k–pci (+8390)


    这是 NE2000 克隆卡的 PCI 实现。各种供应商现在都在销售此芯片的网卡。参阅 NE2000–PCI 获取有关使用此类网卡的信息。注意，这仍然是 10
    多年前的设计，只是接到了 PCI 总线。。性能不会远优于 ISA 型。


    ### RealTek 8129/8139

    状态：部分支持，驱动程序名称：rtl8139,8139too


    RealTek 的另一个 PCI 芯片解决方案。v2.0.34 版本包含了基于此芯片的驱动程序。如果你想要 v2.2 内核的实验性驱动，目前需要回答‘Y’。Donald
    表示基于此芯片的网卡与 PCI NE2000 克隆卡价格相似（在某些地方更便宜——13美元！），虽然 8139 不是最好的 10/100 板，但它比 PCI
    NE2000 克隆卡好。2.4 版本有另一个名为 8139ft 的驱动，基于 rtl839 但解决了一些用户反馈的问题，因此使用 2.4 内核时可以尝试它。


    ## 4.32 Sanger NP943

    状态：部分支持，驱动程序名称：3c501


    这是一张 3c501 克隆卡，前缀不同。我假设它和原始的 3c501 一样糟糕。驱动程序检查 NP943，之后则将其视为 3c501。参阅 3c501 了解你不想使用此类网卡的原因。


    ## 4.33 Schneider SK G16

    状态：支持，驱动程序名称：sk_g16


    该驱动包含在 v1.1 内核中，由 Weichmann 和 Bern 编写。G16 似乎与 NI6510 相似，因为它基于第一个 LANCE 芯片（7990）。再次，此卡似乎无法与通用驱动工作。


    ## 4.34 SEEQ 8005

    状态：支持，驱动程序名称：seeq8005


    驱动程序中关于该卡的信息很少，因此这里提供的信息也有限。如果你有疑问，可能需要给源码中列出的作者发邮件。


    ## 4.35 SMC (Standard Micros Corp.)

    西部数据的以太网部分多年前被 SMC 收购。wd8003 和 wd8013 是主产品。从那时起，SMC 继续制作 ISA 卡（Elite16, Ultra,
    EZ），并在其产品线中增加了 PCI 产品。


    SMC 的联系信息：

    SMC / Standard Micros Corp.,

    Arkay Drive, New York, 11788, USA

    技术支持电话：800–9962 (美国), 800–5345 (加拿大), 516–4250 (其他国家)。

    文献请求：800–SMC (美国), 800–SMC (加拿大), 516–4255 (其他国家)。

    邮件技术支持：techsupport@mail.west.smc.com。

    FTP 站点：ftp.smc.com。

    WWW 站点：SMC。


    ## WD8003, SMC Elite

    状态：支持，驱动程序名称：wd (+8390)


    这些是网卡的 8 位版本。8 位 003 稍便宜，但仅在轻度使用时节省的费用才值得。注意，某些非 EEPROM 卡（带有跳线帽或旧的 wd8003 卡）没有方法报告
    IRQ 线。在这种情况下，使用自动 IRQ，如果失败，驱动程序将静默分配 IRQ 5。你可以从 SMC 站点获取设置/驱动磁盘。注意，某些新的 ''SuperDisk''
    程序无法检测旧 EEPROM 卡。SMCDS46.EXE 似乎是一个全面的选择。最新版本可以通过 ftp 获取。由于这些与 16 位对应（WD8013 /
    SMC Elite16）相同，你应该查看下一节获取更多信息。


    ## WD8013, SMC Elite16

    状态：支持，驱动程序名称：wd (+8390)


    多年来，该设计增加了寄存器和 EEPROM。（第一8003 卡出现在十年前！）通常以“8013”命名的克隆卡使用非 EEPROM（跳线设置）。后期型号 SMC
    卡使用 83c690 芯片而非早期的 Semi DP390。共享内存设计使其比 PCI 卡快一点，尤其是在处理大数据包时。更重要的是，从驱动程序的角度来看，它避免了
    8390 程序 I/O 模式中的某些 Bug，允许多线程访问数据缓冲区，并且没有在热启动过程中处理机器的程序 I/O 数据寄存器。


    具有标准内存的网卡可以在启动时指定内存大小（或作为模块时在 `/etc/conf.modules` 中作为选项）。8 位卡的标准内存大小为 8KB，16 位卡为
    16KB。例如，WD8003EBT 卡可以通过跳线设置为32KB 内存。为了充分利用内存，你可以可以使用类似命令（对于 I/O=0x280 和 IRQ 9）：


    ```

    LILO: linux ether9,0x280,0xd0000,0xd8000,eth0

    ```


    另参阅“8013 问题”获取一些经常出现的常见问题和常见解答。


    '
