    状态：半支持，驱动名称：？

    另外一种基于 I82S86 的网卡。Dirk Niggemann (dir-n@dircon.co.uk) 编写了一个他归类为 `pre-alpha` 的驱动程序，并希望人们进行测试。详情请通过邮件联系他。


    # 4.26 Mylex


    可以通过以下号码联系 Mylex，以咨询任何问题。


    - MYLEX CORPORATION, Fremont

    - 销售电话：800-77-MYLEX, (510) 796-6100

    - 传真：(510) 745-8016。


    他们也有网站：Mylex WWW Site


    # Mylex LNE390A, LNE390B


    状态：支持，驱动名称：Inne390 (+8390)


    这些是相当老的 EISA 网卡，使用了类似于 wd80x3 的共享内存实现。当前 2.1.x 系列内核中提供了这些网卡的驱动程序。请确保将共享内存地址设置为
    1MB 之前或机器上安装的物理 RAM 最高地址之上。


    # Mylex LNP101


    状态：半支持，驱动名称：de4x5, tulip


    这是一个基于 DEC 2140 芯片的 PCI 网卡。可以在 10BaseT、10Base2 和 10Base5 输出之间选择。LNP101 网卡已验证可以使用通用的
    21040 驱动。


    更多信息请参阅 21040 芯片 DEC 21040 章节。


    # Mylex LNP104


    状态：半支持，驱动名称：de4x5, tulip


    LNP104 使用 DEC 21050 芯片提供四个独立的 10BaseT 端口。它应该能与知道共享 IRQ 的近期 21040 驱动配合，但据我所知，还没有人尝试过。


    # 4.27 Novell Ethernet, NExxxx 及相关克隆卡


    前缀 `NE` 来自 Novell Ethernet。Novell 遵循了最便宜的 NatSemi 数据手册设计，并出售了 Eagle（拆分？）的制造权，以便向市场提供价格合理的以太网卡。（现在无处不在的
    NE2000 卡。）


    # NE1000, NE2000


    状态：支持，驱动名称：ne (+8390)


    ne2000 是基于 NatSemi 8390 芯片的简化设计的通用名称。它们使用程序化 I/O 而不是共享内存，这使得安装更简单，但性能略低，且存在一些一些问题。NE2000
    网卡出现的一些常见问题列在 [Problems...] 中。


    一些 NE2000 克隆卡使用 National Semiconductor/ATLANTIC 8305 芯片，该芯片提供了用于利用 wd8013 和 EEPROM
    软件配置的共享内存方案。共享内存模式与程序化 I/O 相比将提供更低的 CPU 占用（即效率更高）。


    通常，在 I/O 地址 0300 制作 ne2000 克隆卡是不好的，因为几乎每个驱动在启动时都会在那里进行探测。一些糟糕的 NE2000 克隆卡不喜欢被挤在错误的区域，并会通过锁定你的选择作为回应。此外，0320
    是安全的，因为 SCSI 会探测 0330。


    Donald 为所有 ne2000 网卡编写了一个 NE2000 诊断程序 (ne2k.c)。更多信息请参阅 [Diagnostic Programs]。


    如果你打算将此驱动作为可加载模块使用，可能应该查看 [Using the Ethernet Drivers as Modules] 以获取模块特定信息。


    # NE2000–PCI (RealTek/Winbond/Complex)


    状态：支持，驱动名称：ne, ne2k–pci (+8390)


    信你不信，人们正在根据 ne2000 超过十年的接口设计制造 PCI 网卡。目前，几乎所有的此类卡都基于 RealTek 8029 芯片或 Winbond
    89c940。Complex、GTI、VIA 和 Netvin 卡也使用这些芯片，但 PCI ID 不同。


    最新的 v2.0.34 内核必须自动检测所有网卡并使用它们。如果你正在使用 v2.0.34 或更版本的内核，你应该升级以确保你的网卡被检测到。现在有两个驱动可选：原始的
    ISA/PCI ne .c 驱动和一个较新的仅限 PCI ne2k–pci.c 驱动。


    要使用原始的 ISA/PCI 驱动，在运行 `make config` 时必须对 ''Isa cards'' 选项说 ''Y''因为你使用的是与 ISA 卡相同的
    NE2000 驱动。（这也提示了你，这些卡并不像 PCNet–PCI 或 PCI 21400 卡那样智能。）


    ISA/PCI 驱动中较新的 ne2k–only 驱动支持了所有旧的 NE2000。


    '
