    # Linux Ethernet–HowTo


    ## Cogent eMAASTER+, EM100–PCI, EM400, EM960, EM964


    Status: Supported, Driver Name: de4x5, tulip


    These are yet another DEC 21040 implementation that should hopefully work fine
    with the standard 21040 driver.


    The EM400 and the EM964 are four port cards using a DEC 21050 bridge and 4 21040
    chips.


    See DEC 21040 for more information on these cards, and the present driver situation.


    ## 4.12 Compaq


    Compaq aren''t really in the business of making ethernet cards, but a lot of their
    systems have embedded controllers on the motherboard.


    ### Compaq Deskpro / Compaq XL (Embedded AMD Chip)


    Machines as the XL series are used with an AMD 79c7x chip on the motherboard that
    we can use, you have to do some trickery to get the PCI BIOS to the standard LANCE
    driver. Before you use it, Frank Maas knew to provide the details:


    > The problem with this Compaq machine is that the PCI directory is located in
    high memory, at a spot where the Linux kernel (won''t reach. Result: the card
    is never detected or it is useless:(the mouse won''t work either) The workaround
    (as described thoroughly in http://www-c724.uibak.ac/xl/) is to load MS-DOS, launch
    a either Compaq and then load the Linux kernel using LOADLIN. I’ll give you time
    to say ‘yuck, yuck’, but for now this is the only solution I know of. The driver
    simply moves the PCI directory to a place where it is normally stored (and where
    Linux can find it).


    More general information on the AMD chips can be found in AMD LANCE.


    ### Compaq Nettelfigent/NetFlex (Embedded ThunderLAN Chip)


    Status: Supported, Driver Name: tlan


    These systems use a Texas Instruments ThunderLAN chip on the ThunderLAN driver
    can be found in ThunderLAN.


    ### Compaq PCI card


    Status: Supported, Driver Name: eepro100


    Check your card – if it has part number 323551–821 and/or an intel 82558 chip
    on it it is another Intel EEPro100 based card.


    ## 4.13 Danpex


    ### Danpex EN9400


    Status: Supported, Driver Name: de4x5, tulip


    Yet another card based on the DEC 21040 chip, reported to work fine, and at a
    relatively cheap price.


    See DEC 21040 for more information on these cards, and the present driver situation.


    ## 4.14 D–Link


    ### DE–100, DE–200, DE–220–T, DE–250


    Status: Supported, Driver Name: ne+83890


    Some of the D–Link cards didn''t have the 0x57 PROM signature, that the nc2000
    driver knows about them. For the software configurable cards, you can get the
    config program from www.dlink.com. The DE** cards were the most widely reported
    as having the spurious address mismatch errors with early versions of linux. Note
    that there are also cards from Digital (DEC) that are also named DE100 and DE200,
    but the similarity stops here.


    ### DE–520


    Status: Supported, Driver Name: pnet32


    This is a PCI card using the PCI version of AMD’s LANCE chip. DMA selection and
    chip numbering information can be found in AMD LANCE.


    More technical information on AMD LANCE based Ethernet cards can be found in Notes
    on AMD...


    ### DE–528


    Status: Supported, Driver Name: ne, ne2k–pci (+83890)


    Apparently D–Link have also started making PCI NE2000 clones.


    ### DE–530


    Status: Supported, Driver Name: de4x5, tulip


    This is a generic DEC 21040 PCI chip implementation, and is reported to work with
    the generic 21040 tulip driver. Note that is NOT the DEC–530.


    See DEC 21040 for more information on these cards, and the present driver situation.


    ### DE-600


    Status: Supported, Driver Name: de600


    Laptop users and other folk who might want a quick way to put their computer onto
    the ethernet may want to use this. The driver is included with the default kernel
    source tree. Expect about 180kb/s transfer speed from this parallel port. You
    should read the README.DLINK file in the kernel source tree.


    Note the device that you pass to config is now eth0 and not the previously used
    d10.


    If your parallel port is not 0x378 you will have to recompile, as the address
    is compiled directly into the driver. Note also that some laptops implement the
    in-board parallel port at 0x3bc which is where the parallel ports on monochrome
    cards were/.


    ### DE-620


    Status: Supported, Driver Name: de620


    Same as the DE–600, only with two output formats. Bjorn has written a driver for
    this model, for kernel versions 1.1 and above. See the information over the DE–600.


    ### DE-650


    Status: Semi–Supported, Driver Name: de650


    Some people have using this PCMCIA for some time with their notebooks. It is a
    basic 8390 design, like NE2000. The LinkSys PCMCIA and the Ethernet Card are supposedly
    DE650 clones as well. Note that then, this driver is not part of the standard
    kernel, and so you will have to do some patching.


    ### DFE-530


    Status: Supported, Driver Name: via–rhine


    Another card using the VIA chipset (see Rhine). Don’t confuse this with the DE–530
    which is a tulip based card.


    ### DFE-538TX


    Status: Supported, Driver Name: rtl8139


    This card uses the RealTek 8139 – see the section RealTek.


    ## 4.15 DFI


    ### DFINET–300 and DFINET–400


    Status: Supported, Driver Name: ne (+8390)


    Yet another poor clone clone—these use ''DFI'' in the first bytes of prom, instead
    of using 0x57 by bytes 14 and 15, which is what all the NE1000 and NE2000 cards
    should use (The 300 is a bit pseudo NE1000 clone, and the 400 is pseudo NE2000
    clone.).


    ## 4.16 Digital / DEC


    ### DEPCA, DE100/1, DE200/1/2, DE210, DE422


    Status: Supported, Driver Name: depca


    There is documentation included in the source file ''depca'', which includes info
    on how to use more than one cards in a machine. Note that the DE422 is based on
    the EISA card. These cards are all based on the AMD LANCE chip. A maximum of two
    of ISA cards can be used, because they can only be set for 0x300 and 0x200 I/O
    address. If you are intending to do this, please read the notes in the driver
    file depca in the standard kernel tree. This driver will also work on Alpha CPU,
    and there are various ioctl()s that the user can play


    ### Digital EtherWorks (DE203, DE204, DE205)


    Status: Supported, Driver Name: ewkr3


    These cards use a proprietary chip from DEC, as opposed to the LANCE chip used
    in the earlier cards like the DE200. These cards support both shared memory or
    programmed I/O, although you take about 50% performance hit if you use PIO mode.
    The shared memory can be set to 2KB, 32KB or 64KB, and only 2 and 32 have been
    tested with this. David says that the performance is virtually identical to 2KB
    and 32KB mode. There is more information (including the driver as a loadable module)
    at the top of the driver file ewkr3.c and also in README.ewkr3. Both of these
    files come with the standard kernel distribution. This driver has Alpha CPU support
    like depca does. The standard driver has a variety of interesting ioctl()s that
    can be used to get clear packet statistics, read/write the EEPROM, change the
    hardware address, and link. Hackers can see the source code for more info on that.
    David has also written a configuration utility for this card (along the lines
    of the DOS program NICSETUP.EXE) with other tools. These can be found on Linux
    FTP sites in the directory /pub/linux/system/Network/management --- look for the
    file ewkr3tools-X.XX.tar.gz.


    ### DE425 EISA, DE434, DE435, DE500


    Status: Supported, Driver Name: de4x5, tulip


    These cards are based on the 21040 chip mentioned above. The DE500 uses the 2140
    to provide 10/100Mbps ethernet connections. Have a read of the 2140 section below
    for extra info. There are also some compile-time options available for non–DEC
    cards with this driver. Have a look at README.de4x5 for details. All the Digital
    cards support autopatch for their media (temporarily, the DE500 due to a patent
    issue).


    ### DEC 21040, 21041, 2114x, Tulip


    Status: Supported, Driver Name: de45x, tulip


    The DEC 21040 is a bus-mastering single chip solution from Digital, similar to
    AMD''s PCnet chip. The 21040 is specifically designed for the PCI bus architecture.
    Apparently these chips are no longer produced, as Intel has bought the semiconductor
    portion of DEC and favouring their own chip(s).


    You have a choice of two drivers for cards on this chip. There is the DE425 driver
    discussed above, and the generic 21040 ''tulip'' driver.


    Warning: Even though your card may be based on this chip, the drivers may not
    work for you. This driver is also Alpha CPU ready and supports being loaded as
    a module. Users can access the internals through ioctl() calls — see the ''ew3''
    code and the de45x.c sources for information about how to do this.


    Warning: Even though your card may be based on this chip, the drivers may not
    work for you. There are no guarantees that either ''tulip.c'' OR ''de45x.c'' will
    run any DC214x card. WHY?? You ask. Because there is a register, the General Purpose
    Register (CSR12) that (1) in the DC2140a is programmable by each vendor and they
    all do it differently (2) in the SIA control register. The only small ray of hope
    is that we can decode the SROM set by the driver. In non-technical terms, this
    means that if you''re not sure an unknown card with DC214x chip will work with
    the tulip driver, make sure you can return the card to the place of purchase before
    you pay for it.


    The 21041 chip is also found in the set of 21040 on the later SMC EtherPower cards.
    The 21140 is for supporting 100Base-T and works with the Linux drivers for the
    2140 chip. Use David''s de45x driver with non-DEC cards, have a look at README,de45x
    for details.


    If you are having trouble with the tulip driver, you can try the newest version
    from Donald''s ftp/WWW site.


    Tulip Driver


    There is also a (non-exhaustive) list of various cards/vendors that use the 21040
    chip.


    ## 4.17 Farallon


    Farallon sells EtherWave adaptors and transceivers. This device allows multiple
    10base-T devices to be daisy-chained.


    ### Farallon Etherwave


    Status: Supported, Driver Name: 3c509


    This is reported to be a 3c509 clone that includes the EtherWave transceiver.
    People have used this successfully with Linux and the present 3c509 driver. They
    are too expensive for general use, but are a great

