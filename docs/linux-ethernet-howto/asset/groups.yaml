  mdcn: '

    # Linux 以太网教程


    这是 PCnet–PCI ——  PCnet–32，专为基于 PCI 的系统设计。请参见上方的 PCnet–32 信息。这意味着你需要编译一个启用了 PCI
    BIOS 支持的内核。''970A 在原始 970 设计的基础上增加了全双工支持以及其他功能。


    注意，79C70 的 BOCA 实现在奔腾（Pentium）机器上会失败。这是一个硬件问题，因为它也影响了 DOS 用户。更多细节请见 BOCA 章节。


    # AMD 79C971 (PCnet–FAST)


    状态：已支持，驱动程序名称：pcnet32


    这是 AMD 为 PCI 系统设计的 100Mbit 芯片，支持全双工操作。它于 1996 年 6 月推出。


    # AMD 79C972 (PCnet–FAST+)


    状态：已支持，驱动程序名称：pcnet32


    已确认其工作方式与 ''971 相同。


    # AMD 79C974 (PCnet–SCSI)


    状态：已支持，驱动程序名称：pcnet32


    这是 PCnet–SCSI —— 从以太网的角度来看，它基本上被视为 ''970。也请参见上方的信息。不要询问该芯片的 SCSI 部分是否支持 —— 这是以太网教程，不是
    SCSI 教程。


    # 4.5 Ansel Communications


    # AC3200 EISA


    状态：部分支持，驱动程序名称：ac3200


    注意，要访问此驱动并执行 `config`，在第一次询问“提示开发/不完整代码驱动程序”(Prompt for development/or incomplete
    code drivers/) 时仍需回答 `Y`。由于该网卡相对罕见，缺乏关于驱动稳定性的反馈。


    该驱动包含在当前内核中，作为 ne2000 和 wb803 网卡常用 NS8390 芯片的 alpha 测试。关于 alpha 驱动的重要信息，请参阅本文中的“Alpha
    驱动”章节。


    如果你使用它，请告知结果如何，尽管该驱动已经在内核 v1.1.25 中，但反馈一直很少。


    如果你打算将此驱动作为可加载模块使用，可能应该查看“作为模块使用以太网驱动”以获取模块特定信息。


    # AMD 79C971 (PCnet–FAST)


    # 4.6 Apricot


    # Apricot Xen–II 板载以太网


    状态：部分支持，驱动程序名称：apricot


    这种板载以太网使用 i82596 总线主控芯片。它只能位于 I/O 地址 0x300。通过查看驱动源码，IRQ 似乎硬接到 10。


    早期版本的驱动倾向于认为 0x300 处的任何设备都是 apricot 网卡。从那以后，系统通过检查硬件地址来避免这些误检。


    # 4.7 Arcnet


    状态：已支持，驱动程序名称：arcnet (arc–rimi, com90xx, com20020)


    鉴于以太网的低成本和更好的性能，大多数地方可能会免费赠送 Arcnet 硬件，导致许多家庭系统配备 Arcnet。


    Arcnet 的优势是所有网卡具有相同的接口，因此一个驱动程序适用于所有人。它具有内置的错误处理机制，据称永远不会丢失数据包。（这对 UDP 流量非常好！）注意
    arc 驱动使用 ''arc0'' 作为名称，而不是以太网设备常用的 ''eth0''。


    标准内核中包含了用于设置跳线、通用提示以及发送错误报告邮件地址的信息文件。


    据称该驱动同样也支持 100Mbs ARCnet 网卡！


    # 4.8 AT&T


    注意 AT&T 的 StarLAN 是一项过时技术，类似于 SynOptics LattisNet，如果没有能够同时“通话”两种语言的集线器，无法在标准的
    100Base–T 环境中使用。


    # AT&T T7231 (LanPACER)+


    状态：不支持。


    这些 StarLAN 环境使用类似于 i82586 芯片的接口。曾几何，Matthijs Melchior (matthias.n.melchior@att.com)
    正在尝试 3c507 驱动，几乎实现了可用的效果。之后就没有更多消息了。


    # 4.9 Boca Research


    是的，他们制造的不止多端口串口卡。


    # Linux 以太网教程


    # Boca BEN400


    状态：已支持，驱动程序名称：ne (+8390)


    显然这是一个 NE2000 克隆版，使用了 VIA VT86C916 芯片。


    # Boca BEN (ISA, VLB, PCI)


    这些网卡基于 AMD 的 PCnet 芯片。潜在买家应注意，许多用户在使用这些 VLB/PCI 网卡时遇到过无尽的问题。高速奔腾系统的所有者受影响尤为。注意这不是驱动问题，因为它也影响了
    DOS/NT 用户。Boca 的技术支持电话为 (407) 241–8088，你也可以通过 75300.2672@compuser.com 联系他们。旧的
    ISA 网卡似乎没有遭受同样的问题。


    Boca 为受影响的所有者提供了“保修维修”，涉及其中一个电容器，但似乎这并非 100% 有效。关于芯片的更通用信息可以在 AMD 找到。


    （注：由于原文存在大量重复的 OCR 错误文本，此处翻译已根据要求进行清理并提取核心内容。）

    '
