    # Linux Ethernet–Howto


    option for special cases. Hublet prices start at $125, and Etherwave adds $75–$100
    to the price of the board --- worth it if you pulled one wire too few, but not
    if you are two network drops short.


    # Farallon PCI 593


    Status: Supported, Driver Name: de4x5, tulip


    It has been reported that this card was detected with the de4x5 driver.


    # 4.18 Fujitsu


    Unlike many network chip manufacturers, Fujitsu have also made and sold some network
    cards based upon their chip.


    # Fujitsu FMV–181/182/183/184


    Status: Supported, Driver Name: fmv18x


    According to the driver, these cards are straight forward Fujitsu MB86965 implementation,
    which would make them similar to the Allied Telesis AT1700 cards.


    # 4.19 Hewlett Packard


    The 272** cards used programmed I/O, similar to the NE*000 boards, but the data
    transfer port can be ‘turned off’ when you’re accessing it, avoiding problems
    with autoprobiding.


    Thanks to Glenn Talbott for cleaning up the confusion in this section regarding
    the version numbers of the HP hardware.


    # HP Night Director+ 10/100


    Status: Supported, Driver Name: pcnet32


    Apparently these cards use the AMD 79C972 chip.


    # 27245A


    Status: Supported, Driver Name: hp (+8390)


    8 bit 8390 base10BaseT, not recommended for all the 8 bits. It was re–designed
    a couple years ago to be highly integrated which some changes in initialization
    timing only affected testing programs, not LAN drivers. (The new card is not ‘ready’
    as soon after switching into and out of loopback mode.)


    If you intend on using this driver as a loadable module you should probably see
    Using the Ethernet Drivers as Modules for module specific information.'
  - '[PAGE 50]


    # Linux Ethernet–Howto


    # HP EtherTwist, PC Lan+ (27247, 27252A)


    Status: Supported, Driver Name: hp+ (+8390)


    The HP PC Lan is different to the standard HP PC Lan card. This driver was added
    to the list of drivers in the standard kernel developed by the v1.lx driver cycle.
    It can be operated in a PIO mode ne2000, or a shared memory mode may have wad8013.


    The 47B is a 16 Bit 8390 10BaseEt w/AUI, and the 52A is a 16 Bit 8390 based ThinLANw/AUI.
    These cards have 32kb onboard RAM for Tx/Rx packet buffering instead of the 16kb,
    and both offer LAN card autoseense.


    If you intend on using this driver as a loadable module you should probably see
    Using Ethernet Drivers as Modules for specific information.


    # HP–J2405A


    Status: Supported, Driver Name: lance


    These are lower priced, and slightly faster than the 27247/27252A, but are missing
    some features, such as AUI, ThinLAN connectivity, and BOOM Socket. This is a fairly
    generic LANCE design, but a minor design makes it incompatible with a generic
    ‘NE2100’ driver. Special support for it (including reading the DMA channel from
    the board) is included thanks to information provided by HP’s Glenn Talbot.


    More technical information on LANCE based cards can be found Notes on AMD...


    # HP–Vectra On Board Ethernet


    Status: Supported, Driver Name: lance


    The HP-Vectra has an AMD PCnet chip on the motherboard. DMA selection and chip
    numbering can be found in AMD LANCE.


    More technical information on LANCE based cards can be found Notes on AMD...


    # HP 10/100 VG Any Lan Cards (27248B, J2573, J2577, J2585, J970, J973)


    Status: Supported, Driver Name: hp100


    This driver also supports some of the Complex VG products. Since the driver supports
    ISA, EISA and PCI cards, it is found under ISA cards when making config on a kernel
    source.


    # HP NetServer/10/100TX PCI (D5013A)


    Status: Supported, Driver Name: epro100


    Apparently these are just a rebad Intel EtherExpress Pro 10/100B card. See the
    Intel section for more information.'
