    will be giving away their Arcnet hardware for free, resulting in a lot of home
    systems with Arcnet.


    An advantage of Arcnet is that all of the cards have identical interfaces, so
    one driver will work for everyone. It also has built error handling so that it
    supposedly never loses a packet. (Great for UDP traffic!) Note that the arc driver
    uses ''arc0'' as its name instead of the usual ''eth0'' for ethernet devices.


    There are information files contained in the standard kernel for setting jumpers,
    general hints and where to mail bug reports.


    Supposedly the driver also works with the 100Mbs ARCnet cards as well!


    # 4.8 AT&T


    Note that AT&T’s StarLAN is an orphaned technology, like SynOptics LattisNet,
    and cannot be used in a standard 100Base–T environment, without a hub that ‘speaks’
    both.


