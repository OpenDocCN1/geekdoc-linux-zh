    \ 42 行处有一个“耻辱柱”。它用于检测劣质克隆卡。DFI 卡在 PROM 的前 3 个字节中使用‘DFF’，而不是在第 14 和第 15 字节中使用 0x57，它们本应该是这样的。\n\
