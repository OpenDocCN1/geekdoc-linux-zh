    # AMD 79C971 (PCnet–FAST)


    # 4.6 Apricot


    # Apricot Xen–II On Board Ethernet


    Status: Semi–Supported, Driver Name: apricot


    This on board ethernet uses an i82596 bus–master chip. It can only be at I/O address
    0x300. By looking at the driver source, it appears that the IRQ is also hardwired
    to 10.


    Earlier versions of the driver had a tendency to think that anything at 0x300
    was an apricot NIC. Since then the hardware address is checked to avoid these
    false detections.


    # 4.7 Arcnet


