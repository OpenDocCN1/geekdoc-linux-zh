    ## 6.2 Diagnostic Programs for Ethernet Cards


    Any of the diagnostic programs that Donald has written can be obtained from his
    website.


    Ethercard Diagnostics


    - Allied Telesis AT1700 -- at1700.c

    - Cabletron E21XX -- e21.c

    - HP PCLAN+ -- hp+.c

    - Intel EtherExpress -- eexpress.c

    - PCI NE2000 cards -- ne2k-pci-diag.c

    - ISA NE2000 cards -- ne2k.c

    - RealTek (ATP) Pocket adaptor atp-diag.c

    - All Other Cards -- trying cat /proc/net/dev and dmesg to see what useful info
    the kernel has the card in question.


    ## 7. Technical Information


    For those who want to understand a bit more about how the card works, or play
    with the present drivers, or even try to make their own driver for a card that
    is presently unsupported, this information should be useful. If you do not fall
    into this category, then you will want to skip this section.


    ### 7.1 Programmed I/O vs. Shared Memory vs. DMA


    If you can already send and receive back-to-back packets, you can just put more
    bits over the wire. Every modern ethernet dp8390 drivers (wd80x3, SMC-Ultra, 3c503,
    ne2000) come pretty close to sending back-to-back packets (depending on the current
    interrupt latency) and the 3c509 and AT1500 have no problem at automatically sending
    back-to-back packets.


    #### Programmed I/O (e.g. NE2000, 3c509)


    - Pro: Doesn''t use any constrained system resources, just a few I/O registers,
    and has no 16M limit.

    - Con: Usually the slowest transfer, the CPU is waiting the whole time, and interleaved
    packet access is usually difficult to implement.


    #### Shared memory (e.g. WD80x3, SMC–Ultra, 3c503)


    - Pro: Simple, faster than programmed I/O, and allows random access to packets.
    Where possible, the linux drivers compute the checksum of incoming IP packets
    as they are copied off the card, resulting in a further reduction of CPU usage
    vs. an equivalent PIO card.

    - Con: Uses memory space (a big one for DOS users, essentially a non–issue under
    Linux), and it still ties up the CPU.


    #### Slave (normal) Direct Memory Access (e.g. none for Linux!)


    - Pro: Frees the CPU during the actual data transfer.

    - Con: Checking boundary conditions, aligning contiguous buffers, and programming
    the DMA registers makes it the slowest of all techniques. It also uses a scarce
    DMA channel, and requires aligned memory buffers.


    #### Bus Master Direct Memory Access (e.g. LANCE, DEC 21040)


    - Pro: Frees the CPU during the data transfer, can string together buffers, can
    require little or no CPU time lost on the bus. Most of bus-mastering drivers now
    use a ‘copybreak’ scheme where large packets are put directly into a kernel buffering
    by the card, and small packets are copied by the CPU which primes the cache for
    subsequent processing.

    - Con: (Only applicable to ISA cards) Requires low–memory buffers and a DMA channel
    for channels. Any bus-master will have problems with other bus-masters that are
    bus-hogs, especially some primitive SCSI adapters. A badly-designed motherboard
    chipsets have problems with bus-masters. A reason for not using any type of DMA
    device is using a 486 processor for plug-in-replacement of a 386: these processors
    must flush their cache with each DMA cycle. (This includes the Cx486DLC, Ti486DLC,
    Cx486SLC, Ti486SLC, etc.)


    ### 7.2 Performance Implications of Bus Width


    The ISA can do 5.3MB/sec (42MB/sec), which sounds like not enough for 10Mbps ethernet.
    In the case of the 100Mbps cards, you need a faster buffer to take advantage of
    the network bandwidth.


    ### ISA Eight bit vs ISA 16 Bit Cards


    You probably can''t buy a 8 bit ISA ethercard, but you will find lots of them
    turning up at computer swaps and meets for the next few years, at very low prices.
    This will make them poplar for ‘home–ether’ systems. The above holds true for
    16 bit ISA cards now, since PCI cards are now common.


    Some 8 bit cards that provide adequate performance for light usage are the wd8003,
    the 3ec501 provides poor performance, and these ne1000 poor 12 year old relics
    of the XT days should be avoided. (Send them to Alan, he collects them…)


    The 8 bit path data doesn''t hurt performance, much, as you can expect to get
    about 800/800 kb/ps download speed to an 8 bit wd8003 card (on a fast ISA bus)
    from a fast host. And if most of your net-traffic is going to remote sites, then
    the bottleneck in the path will be elsewhere, and the only speed difference you
    notice is during net activity near your local subnet.


    ### 7.3 32 Bit (VLB/EISA/PCI) Ethernet Cards


    Note that a 10Mbit network typically doesn''t justify requiring a 32 bit interface.
    See Programmed I/O vs... as to why a 10Mbps ethernet on 8MHz ISA bus is really
    not a bottleneck. Even having the ethernet on a fast bus wasn''t necessarily mean
    faster transfers, it usually meant reduced CPU overhead, which is good for multi-user
    systems. Of course 100Mbps networks, which are now commonplace, the 32 bit interface
    is a must to use the full of the bandwidth.


    ### 7.4 Writing a Driver


    The only thing that you need to use an ethernet card with Linux is the appropriate
    driver. For this, it is essential that the manufacturer will release the technical
    programming information to the general public without you (or anyone) having to
    sign your life away. A good guide for the likelihood of getting documentation
    (or, if you aren''t writing code, the likelihood that someone else will write
    that you require, really need) is the availability of the Cynr (near Clarkson)
    packet driver. Russ Nelson his operation, and has been very helpful in supporting
    the development of drivers for Linux. Net-surfers can try this


    - Russ Nelson''s Packet Drivers


    Given the documentation, you can write a driver for your card and it for Linux
    (at least in). Keep in mind that some old hardware was designed for

    '
