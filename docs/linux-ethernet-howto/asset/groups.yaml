    of the original DP8390. The SMC EtherEZ cards have 83c795, and use the same driver
    as the SMC Ultra. All BNC cards based on some of 8390 or 8390 clone will usually
    have an 8392 (or 83c92, or ???) 16 DIP pin chip close to the BCC.


