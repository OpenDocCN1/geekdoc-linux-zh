    \n## 2.4 ether= 对我没用。为什么？\n\n1) 使用带有你需要的设备驱动程序编译一个新内核。验证你确实正在启动新内核。运行 `l` 可能会启动旧内核。（仔细查看启动时报告的构建时间/日期。）这听起来显而易见，但我们都犯过错。通过检查\
