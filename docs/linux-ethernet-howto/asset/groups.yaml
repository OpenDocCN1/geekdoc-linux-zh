    Lance Lance。AMD 网络产品部的 Dave Roberts  {热忱地贡献了以下关于此点的相关信息：


    > 在功能上，它等同于 NE1500。寄存器组与旧的 LANCE 相同，1500/2100 驱动可以在 PCNet-ISA 上运行。NE1500 和 NE2100
    的架构基本相同。Novell 最初将其命名为 2100，但后来为了区分同轴和 10BASE-T 网卡，任何原本仅用于 1500 系列的 10BASE-T 都改了。

    > 这是唯一的区别。


    许多公司提供基于 PCNet–ISA 的产品，包括 HP、Racal–Datacom、Allied Telesis、Boca Research、金士科技等。这些网卡基本上相同，但某些制造商增加了“跳线”功能，允许在软件中配置网卡。大多数并没有。AMD
    为使用 PCNet–ISA 的网卡提供标准设计包，许多用户直接使用我们的设计。我们的意思是，任何想为大多数基于 PCNet–ISA 的网卡编写驱动都可以从
    AMD 获取数据。拨打我们的发行中心 (800)222–9323 并索要 Am7c960 PCNet–ISA 数据表。这是免费的。


    判断是“卡”还是“裸板”的一种快速方法是观察它。如果是裸板，板上会有一个大芯片、一个小型 IEEE 地址 PROM、可能有一个用于启动 ROM 的插座，以及一个连接器（取决于提供的选项，为
    1、2 或 3 号）。请注意，如果是网卡，它还将内置收发器组件，这些组件应位于连接器附近并远离 PCNet–ISA。


    给潜在黑客的提示：不同的 LANCE 实现以不同的方式进行“重启”。有些人会从环形中中断的地方继续，而另一些人则从环形的开始开始（如果是初始的话）。


    ## 7.8 组播与混杂模式


    Dold 提到的另一件事是不同的 LANCE 实现以不同的方式进行“重启”。有些人会从环形中中断的地方继续，而另一些人则从环形的开始开始（如果是初始的话）。（注：原文此处存在段落重复，译文已按要求不重复输出）


