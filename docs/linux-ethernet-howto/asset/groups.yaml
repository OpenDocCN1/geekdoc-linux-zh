    # Linux Ethernet–Howto


    eql.c - Load Equalizer, enables multiple devices (usually modems) and balances
    the Tx load across them while presenting a single device to the network programs.


    ibmtr.c - IBM Token Ring, which is not really ethernet. Broken–Ring requires source
    routing and other uglies.


    loopback.c - Loopback device, for which all packets from your machine and destined
    for your own machine it just moves the packet off the Tx queue and onto the Rx
    queue.


    pi2.c - Ottawa Amateur Radio Club PI and PI interface.


    plip.c - Parallel Line Protocol, allows two computers to send packets to each
    other over joined parallel ports in a point-to-point fashion.


    ppp.c - Point–to-Point Protocol (RFC1331), for the Transmission of Multi–protocol
    Datagrams over a Point–to–Point Link (again usually modems).


    slip.c - Serial Line Internet Protocol, allows two computers to send packets to
    each other over joined serial ports (usually via modems) in a point–to–point fashion.


    tunnel.c - Provides an IP tunnel through which you can network traffic transparently
    across subnets


    wavelan.c - An Ethernet-like radio transceiver controlled by the Intel 82586 coprocessor
    which is used on other ethercards such as the Intel EtherX.


