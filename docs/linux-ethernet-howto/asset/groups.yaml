    建议你阅读以了解针对你的特定网卡可以使用哪些选项。请注意，某些模块支持逗号分隔的值列表，这些模块具有处理单个模块多个设备的能力，例如基于 8390 的驱动以及
    PLIP 驱动。例如：


    ```

    options 3c503 io=0x280,0x300,0x330,0x350 xcvr=0,1,0

    ```


    上述配置将由一个模块控制四块 3c503 卡，其中卡 2 和卡 4 使用外部收发器。不要在“—”或逗号周围添加空格。


    请注意，忙碌（busy）模块无法移除。这意味着在移除模块之前，你必须执行 `ifconfig eth0 down`（关闭以太网）。


    `lsmod` 命令将向你加载了哪些模块以及它们是否正在在使用，而 `rmmod` 则将移除它们。


    ## 9.3 相关文档


    许多信息源自 comp.os.linux 组的存档帖子，这表明这是一个非常有价值的信息资源。其他有用信息来自 Donald 本人编写的一系列小文件。当然，如果你正在设置以太网卡，你会想要阅读
    NET–2 Howto，以便配置你正在使用的软件。此外，如果你觉得自己是个小黑客，可以从驱动源文件中搜寻额外信息。通常在任何代码开始之前，那里会有一两段文字描述一些要点。


    对于那些在寻找与 Linux 无任何特定关联的信息的人（例如：什么是 10BaseT、什么是 AUI、busy 是什么意思等），我强烈建议使用新闻组 comp.dom.ethnet/
    或 comp.ibm.pc.hardware.networking。像 dejanews.com 这样的新闻组存档也是极宝贵的信息来源。你可以从以下 URL
    的 RTM（它持有所有新闻组 FAQ）获取新闻组 FAQ：


    - Usenet FAQs


