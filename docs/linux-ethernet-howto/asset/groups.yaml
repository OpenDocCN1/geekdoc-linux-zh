    this kernel?


    Solution: The 3c503 driver probes for a free IRQ line in the kernel {5, 9/2, 3,
    4}, and it should pick a line which isn''t being used. The driver chooses if isconfig''ed
    into operation.


    If you are using a modular driver, you can use parameters to set various things,
    including the IRQ value.


    The following selects IRQ9, base location 0x300, <ignored value>, and if_port
    #1 (the external transceiver).


    ```

    io=0x300 irq=9 xcvr=1

    ```


    Alternately, if the driver is compiled into the kernel, you can set the same values
    at boot by passing parameters via LILO.


    ```

    LILO: linux ether=9,0x300,0,1,eth0

    ```


    The following selects IRQ3, probes for the base location, <ignored value>, and
    the default if_port #0 (the internal transceiver)


    ```

    LILO: linux ether=3,0,0,0,eth0

    ```


