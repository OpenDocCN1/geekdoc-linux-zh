    # Ethernet Cards for Linux on SMP Machines


    If you spend the extra money on a multiprocessor (MP) computer then buy a good
    ethernet card as well. For v2.0 it wasn''t really an issue, but it definitely
    is for v2.2. Most of the older non-intelligent (e.g. ISA bus PIO shared memory
    cards) were never designed with any consideration for use on a MP machine. The
    executive summary is buy an intelligent modern design card and make sure the driver
    has been written (or updated) to handle MP operation. (The key words here – PCI-NE2000
    is just a 10+ year old design on a modern bus.) Looking for the text spin_lock
    in the driver source is a good indication that the driver has been written to
    handle MP operation. The full details of why you should buy a good card for MP
    use (and what if you don''t)


    In v2.0, only one processor was running in the kernel (i.e. changing kernel data
    and/or running drivers) at any given time. From the point of view of the card
    (and other driver) nothing different from one processor (UP) operation and just
    continued to work. This was the easiest way to get a working version of MP – one
    big lock around the whole kernel only one processor at a time. This way you won''t
    have two processors trying to change the thing at the same time!


    The downside to owning only one processor in the kernel at a time is that you
    only got MP performance if the running programs were self-contained and calculation
    intensive. If the programs did a lot of input/output (I/O) as reading or writing
    data to disk or network, then one of the processors would be stalled waiting for
    their I/O requests to be completed while the one processor running in kernel frantically
    tries to run all the drivers to fill the I/O requests. The kernel becomes the
    bottleneck and since only one processor running in the kernel, the performance
    of a MP machine in the heavy I/O, single-lock case quickly degrades to that of
    a single processor.


    Since this is less ideal (esp. for WWW servers, routers, etc.) the v2.2 kernel
    has grained locking – meaning more than one processor can be in the kernel at
    a time. Instead of one big lock around the kernel, there are smaller locks protecting
    critical data from being manipulated by more than one processor at a time – e.g.
    one processor can be running the driver for the network card, while another processor
    is running the driver for the disk at the same time.


    Okay, with that all in mind, here are the snags: the kernel locking means you
    can have one processor trying to send data out through an ethernet card while
    another processor tries to access the same driver/card to do something else (such
    as the card statistics for cat /proc/net/dev). Oops – your card got sent out over
    the wire, while data for your stats stands. Yes, the card got confused by being
    asked to do (or) things at once, and chances are likely to crash your machine.


    So, the driver that worked for UP is no longer good enough – it needs to be updated
    with locks that control access to the underlying card so that the three tasks
    of receive, transmit and multiprocess configuration are serialized to the degree
    required by the stable operation. MP operation will probably be working in a MP
    machine under light load, but will crash the machine or at least exhibit behaviour
    when two (or more!) processors try to do more than one of these tasks at the same
    time.


    The updated MP aware ethernet driver (at a minimum) requires a lock around the
    driver that limits access at the entry points from the kernel to the driver ‘one
    at a time please’; With in place, things will be serialized that the underlying
    hardware should be treated just if it was being used in a UP machine, and so it
    should be stable. The downside is that the lock around the whole ethernet driver
    has the negative performance implications having one big lock around the whole
    kernel (but on a smaller scale) – ie you only have one processor dealing with
    the card at a time. [Technical Note: The performance impact may include deferences.]


