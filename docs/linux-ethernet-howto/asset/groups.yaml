    # Linux Ethernet-Howto


    ## 7.6 Technical information from 3Com


    If you are interested in working on drivers for 3Com cards, you can get technical
    documentation from 3Com.

    Cameron has been kind enough to tell us how to go about it below:


    3Com''s Ethernet Adapters are documented for writers in our ''Technical References''
    (TRs). These manuals describe the programmer interfaces to the boards but they
    don''t talk about the diagnostics, installation programs, etc. that end users
    can use.


    The Interface Products group department has the TRs to give away. To keep this
    program efficient, we centralized it in a thing called ''CardFacts''; CardFacts
    is an automated phone system. You call it with a touch-tone phone and it takes
    stuff to give it. To get a TR, call CardFacts at 408–727–7021. Ask it for Developer''s
    Order Form, document number 9070. Have your fax number ready when you call. Fill
    out the order form and fax it 408–764–5004. Manuals are shipped by Federal Express
    2nd Day Service.


    There are people who think we are too free with the manuals, and they are looking
    for evidence that the system is expensive, or takes too much time and effort.
    So, 3Com have been really good about this, and there''s no problem with the level
    of requests we''ve been given. We need your cooperation and restraint to keep
    that way.


    ## 7.7 Notes on AMD PCNet / LANCE based cards


    The AMD LANCE (Local Area Network Controller for Ethernet) was the original, and
    has since been replaced by the ''PCNet-ISA'' chip, otherwise known as the 7C960.
    Note that the name ''LANCE'' has stuck, and some people will refer to the new
    chip as under under. Dave Roberts of the Network Products Division of AMD was
    kind enough to contribute the following information regarding this:


    > Functional, it is equivalent to NE1500. The register set is identical to the
    old LANCE with the 1500/2100 drivers will work on the PCNet-ISA. The NE1500 and
    NE2100 architecture is basically the same. Initially Novell called the 2100, but
    then to distinguish coax and 10BASE-T cards. Anything that 10BASE-T was only to
    be used in the 1500 range.

    > That''s the only difference.


    Many companies offer PCNet–ISA based products, including HP, Racal–Datacom, Allied
    Telesis, Boca Research, Kingston Technology, etc. The cards are basically the
    same except some manufacturers have added ''jumpers'' features that allow the
    card to be configured in software. Most not, AMD offers a standard design package
    for a card that uses the PCNet–ISA and many users use our design without change.
    What we mean is that anybody who wants to write drivers for most PCNet–ISA based
    cards can just get the data from AMD. Call our distribution center at (800)222–9323
    and ask for the Am7c960, PCNet–ISA data sheet. It''s free.


    A quick way to understand whether there is a ''card'' or just a ''stock'' is to
    look at at it. If it''s stock, it will have one large chip on it, a small IEEE
    address PROM, possibly a socket for a a boot ROM, and a connector (1, 2, or 3,
    depending on the options offered). Note that if it''s a card, it will have transceiver
    stuff built into it as well, which should be near the connector and away from
    the PCNet–ISA.


    A note to would–be hackers that there LANCE implementations do ''restart'' in
    different ways. Some people pick up where they left off in the ring, and others
    start from the beginning of the ring, if initially.


    ## 7.8 Multicast and Promiscuous Mode


    Another one of the things Dold has worked on implementing multicast and promiscuous
    hooks.

    All of the released (i.e. not ALPHA) ISA drivers now support promiscuous mode.


    Donald writes: ''I''ll say by discussing promiscuous mode, which is conceptually
    easy to implement. For most hardware you only have to set a register bit, and
    from then you get every packet on the wire. Well, it''s almost that; for some
    hardware you have to shut the down (potentially dropping a few packet), reconfigure
    it, and then re-enable the ethercod. OK, so that''s easy, so I''ll move on something
    that''s not quite obvious. It can be done in two ways:


    - 1. Use promiscuous mode, and a packet filter like a Berkeley packet filter (BPF).
    The BPF is a pattern matching stage, where you write a program that picks out
    the packets you are interested in. Its advantage is that it''s very programmable.
    Its disadvantage is that there is no general for the kernel to turning on promiscuous
    mode and running every packet on the wire through every registered packet filter.
    See the Berkeley Packet Filter for more info.

    - 2. Using the built-in filter that other ethercaps.


    I guess I should list a few ethercaps/code:


    - 1. These classes have a filter but, it''s a simple yes/no ''accept all multicast
    packets'', or ''accept no multicast packets''.

    - 2. AUTODIN II is the standard CRC (checksum) protocol. In this scheme addresses
    are handled and loaded in a hash table. If the corresponding bit is, this packet
    is accepted. Ethernet packets are laid out so that the hardware does to latch
    (usually) bits by the CRC.

    - 3. Imagine a program that runs the packet. Things are looking up for Linux users
    who want PCMCIA support, as substantial progress is being made. Pioneering this
    effort is David Hicks. His latest PCMCIA support package can be obtained from:


    PCMCIA Package


    Look for a file like `pcmcia-cs-X.Y.Z.tgz` X.Y.Z will be the latest version number.
    This is likely updated to the `tsx-11.mit.edu` FTP site as well.

    - 4. Imagine a program that runs the packet. Things are looking up for Linux users
    who want PCMCIA support, as substantial progress is being made. Pioneering this
    effort is David Hicks. His latest PCMCIA support package can be obtained from:


    PCMCIA Package


    Look for a file like `pcmcia-cs-X.Y.Z.tgz` X.Y.Z will be the latest version number.
    This is likely updated to the `tsx-11.mit.edu` FTP site as well.


    ## 8.1 SLIP


    This is the cheapest, but by the far most. Also, you will not get very high transmission
    rates. Since SLIP is not really related to ethernet cards, it will not be discussed
    further. See the NET-2 Howto.


    ## 8.2 PCMCIA Support


    Try and demand exactly what hardware you have (ie.e. card manufacturer, PCMCIA
    chip controller manufacturer) and then ask on the LAPTOP channel. Regardless,
    don''t expect things to fiddle around a bit, and patch kernels, etc. At present,
    the two PCMCIA chips that are supported by the Debian TCIC/2 and the intel 82365.


    There is a number of programs on tsx-11.mit.edu/pub/packages/laptops/ that you
    may find useful. These range from PCMCIA Ethernet drivers to communicate with
    the PCMCIA controller chip. Note these drivers are usually tied to a specific
    PCMCIA chip (ie. the 82365 or the TCIC/2).


    For NE2000 compatible cards, some people have success with just configuring the
    card under DOS, and then linux from the DOS prompt via `loadlin`.


    ## 8. Networking with a Laptop


    There are several ways to put your laptop on a network. You can use the SLIP code
    (and run at serial speeds); you can get a notebook with supported PCMCIA slot
    built-in; you can get a laptop with a docking station and plug in ISA ethernet;
    or you can use a parallel port adapter.


    ## 7.9 The Berkeley Packet Filter (BPF)


    For those not in know: BPF (Berkeley Packet Filter) is an mechanism for specifying
    the packets you are interested in. The general idea is that BPF should not be
    provided by the kernel, but should be a library.

