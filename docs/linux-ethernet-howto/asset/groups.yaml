    # SMP 机器上的 Linux 以太网卡


    如果你投入额外的资金购买了多处理器（MP）计算机，那么请也买一个好的以太网卡。对于 v2.0，这并不是一个问题，但对于 v2.2 绝对是。大多数旧的非智能网卡（例如
    ISA 总线 PIO 共享内存卡）从未考虑过在 MP 机器上使用。总结：购买一个现代设计的智能卡，并确保驱动程序已经编写（或更新）以处理 MP 操作。（这里的关键词是——PCI-NE2000
    只是现代总线上的一个 10 多年前的设计）。在驱动源码中寻找 `spin_lock` 文本是判断驱动程序已编写用于处理 MP 操作的良好迹象。关于为什么你应该为
    MP 使用购买好网卡（以及如果不买会怎样）的完整细节如下：


    在 v2.0 中，任何时候都只有一个处理器在内核中运行（即更改内核数据和/或运行驱动程序）。从网卡（或其他驱动程序）的角度来看，这与单处理器（UP）操作没有区别，并继续工作。这是获得可用
    MP 版本最简单的方法——在整个内核周围加一个大锁，一次只允许一个处理器运行。这样你就不会有两个处理器试图同时修改同一个东西！


    内核中一次只运行一个器的缺点是，只有当运行的程序是自包含且计算密集型时，才能获得 MP 性能。如果程序执行大量的输入/输出（I/O），如向磁盘或网络读写数据，那么一个处理器将等待其
    I/O 请求完成，而运行内核的另一个处理器将疯狂地尝试运行所有驱动程序来填充 I/O 请求。内核变成了瓶颈，由于内核中只有一个处理器在运行，MP 机器在重
    I/O 单锁情况下的性能会迅速下降到单处理器的水平。


    由于这种情况并不理想（特别是对于 WWW 服务器、路由器等），v2.2 内核采用了细粒度锁（grained locking）——这意味着可以有多个处理器同时处于内核中。内核不再使用一个大锁，而是使用较小的锁来保护关键数据不被多个处理器同时操作——例如，一个处理器可以运行网络网卡的驱动程序，而另一个处理器可以同时运行磁盘的驱动程序。


    好了，考虑到这一切，这里存在一些障碍：内核锁定意味着你可以有一个处理器试图通过以太网卡发送数据，而另一个处理器试图访问同一个驱动程序/网卡来做其他事情（例如通过
    `cat /proc/net/dev` 查看网卡统计信息）。哎——你的网卡已经通过线路发送了，而你的统计数据停在那里。是的，网卡因为被要求同时执行（或）多个任务而搞混了，并且可能会导致你的机器崩溃。


    因此，适用于 UP 的驱动程序不再足够——它需要更新锁，以控制对底层网卡的访问，以便接收、传输和多处理器配置这三个任务能够按照稳定运行所需的程度进行序列化。在轻负载的
    MP 机器上，MP 操作可能会正常，但当两个（或更多！）处理器尝试同时执行这些任务中的多个时，会导致机器崩溃或至少表现出异常行为。


    更新后的 MP 感知以太网驱动（至少）要求在驱动程序周围加一个锁，限制从内核到驱动程序的入口访问为“请一次一个”；有了锁后，操作将被序列化，底层硬件的对待方式将就像在
    UP 机器中使用它一样，因此它应该是稳定的。缺点是，整个以太网驱动周围的锁具有负面的性能影响，这就像在整个内核周围加了一个大锁（但规模较小）一样——即你一次只有一个处理器在处理网卡。[技术说明：性能影响可能包括解引用。]


