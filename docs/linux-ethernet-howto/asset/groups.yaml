    # 5.3 Thick Ethernet


    Thick ethernet is mostly obsolete, and is used only to remain compatible with
    an existing implementation. You can stretch the rules and connect short spans
    of thick and thin ethernet together with a possible S3 N–to–B connector, and that’s
    the best solution for expanding an existing thick. A (correct) solution is to
    use a repeater in this case.


    # 6. Software Configuration and Card Diagnostics


    In most cases, if the configuration is done by software, and stored in an EEPROM,
    you will usually have to boot DOS, and the vendor supplied DOS program to set
    the cards IRQ, IO, mem address and whatnot. Besides, hopefully it is something
    you will only be setting once. If you don’t have the software for your card, try
    looking on the WWW of your card manufacturer. If you don’t know the site name,
    take a guess at it, i.e. ‘my_vendor.com’ ‘my_vendor_ is the name of your card
    manufacturer. This works for SMC, CMC, and many other manufacturers.


    There are some cards for Linux versions of the config used, and they are listed
    here. Donald has written a few small diagnostic tools that run under Linux. Most
    of these are result of debugging tools he created while writing various drivers.
    You don’t expect many-driven interfaces. You will have to read the source code
    to use these. If your particular card doesn’t have a corresponding diagnostic,
    you can still get some information by using cat /proc/net/dev assuming that your
    card was at least detected at.


    In either case, you will have to run most of these programs as root (to allow
    I/O to the ports) and you probably want to shut down the ethercard by doing so
    ifconfig eth0 down first.


