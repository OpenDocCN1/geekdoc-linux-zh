    # Linux Ethernet–Howto


    by Paul Gortmaker


    v2.8, Oct 29, 2000


    This is the Ethernet–Howto, which is a compilation of information about which
    ethernet devices can be used for Linux, and how to set them up. Note that this
    Howto is focused on the hardware and low level driver aspect of the ethernet cards,
    and does not cover the software end of things like ifconfig and route. See the
    Network Howto for that stuff.


    # 1. Introduction


    - 1.1 New Versions of this Document

    - 1.2 Using the Ethernet–Howto

    - 1.3 HELP – It doesn''t work!

