  mdcn: "\n\n# Linux 以太网使用指南\n\n位于 0x376--0x377 的控制器。如果端口（s）已被另一个驱动程序注册，内核将不允许进行探测（probe）。\n\
    \n**解决方案：** 将你的网卡移动到类似 0x280、0x340、0x320 的地址，或者在编译时不时不包含并行打印机支持。\n\n**问题：** 网络“消失了，但每当我打印某些东西时就会这样”（NE2000）\n\
    \n**原因：** 与上述问题相同，但你使用的是较旧的内核，该内核不会检查冲突的 I/O 区域。请使用上述相同的修复方法，并顺便获取一个新内核。\n\n**问题：**\
    \ NE*2000 以太网在 0xNNNN 探测失败：00 00 C5 ... 未找到。（无效的签名 yy zz）\n\n**原因：** 首先，在地址 0xNNNN\
    \ 处是否有 NE1000 或 NE2000 网卡？如果有，报告的硬件地址看起来有效吗？如果是，说明你买到了一张劣质的 NE*000 克隆卡。已知所有 NE*000\
    \ 克隆卡在 SA PROM 的第 14 和第 15 字节中显示值为 0x57。你的不是——它显示的是 yy zz。\n\n**解决方案：** 有两种方法可以解决这个问题。最简单的方法是使用上述描述用于“无重置确认”探测的\
