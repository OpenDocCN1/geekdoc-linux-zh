    # Linux 以太网教程


    此以太网基于 SMC 的 83c790 芯片，相比 83c690 具有一些新功能。它有一种与旧版 SMC ethards 相似的模式，但与旧的 WD80*3
    驱动并不完全兼容。然而，它与其他 8390 驱动共享一些代码，运行速度比 WD8013 卡稍快。


    由于 Ultra 的部分看起来像 8013，因此 Ultra 应该在 wd8013 探测程序有机会误识别它之前被找到。


    Donald 提到，可以为 Ultra 的“Altego”模式更改链传输器编写单独的驱动程序，代价是接收缓冲器的使用效率低下，但这可能不会发生。


    **总线主控 SCSI 热插适配器注意**：在与 Interactive UNIX 共享的手书中，提到 SMC Ultra 的一个错误会导致从 aha-154X
    热插适配器运行的 SCSI 磁盘时出现数据损坏。这也会影响 BusLogic 主板以及 AMI-FastDisk SCSI 热插适配器。


    SMC 已确认该问题在 Interactive 和旧版本的 Windows NT 驱动中存在。这是网卡早期的硬件冲突，可以通过驱动程序进行规避。目前的 Ultra
    驱动通过仅在向网卡传输数据时启用共享内存来保护此。确保内核版本至少为 1.1.84，或者启动时报告的驱动程序版本至少为 smc-ultra.vi12，否则你将面临风险。


    如果你将此驱动程序作为加载模块使用，你可能会看到 `Using the Ethernet Drivers as Modules` 以获取模块特定信息。


    # SMC Elite Ultra32 EISA


    状态：已支持，驱动程序名称：smc–ultra32 (+8390)


    此 EISA 卡与其 ISA 对应版本有许多共同点。v2.0 和 v2.2 内核均包含可工作（稳定的）驱动程序。感谢 Leonard Zuboff 购买了其中一些显卡，以便为它们添加
    Linux 支持。


    # SMC EtherEZ (8416)


    状态：已支持，驱动程序名称：smc–ultra (+8390)


