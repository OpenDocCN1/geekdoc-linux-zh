    # 4.44 Identifying an Unknown Card


    Okay, so your cousin''s neighbour''s friend had a brother who found an old ISA
    card in the AT case he used as a cage for his pet hamster. You ended up with the
    card and want to try and use it with linux, but nobody has a clue what the card
    is and there isn''t any documentation.


    First of all, look for any model numbers that might give a clue. Any model number
    that contains 2000 will most likely be a NE2000 clone. Any cards with 8003 or
    8013 on somewhere will be Western/Digital WD80x3 cards or SMC Elite cards or clones
    of them.


    # Identifying the Interface Controller


    Look for the biggest chip on your card. This will be identified by the part number.
    If you know which NIC is on the card, the following might be able to help you
    figure out card it is.


    Probably still the most common NIC is the National Semiconductor DP8390 ak NS32490
    ak DP8391 ak DP8392 ak DP8395 ak DP8397. And just those ones made by National!
    Other companies such as Windbond and UTC make DP8390 and DP8395 clones, such as
    the Windbond 89c904 DP8395 clone and the UMC 9090. If the card has some form of
    8390 on it, then chances it is a ne1000 or ne2000 clone. The second most common
    8390 based card is wd80x3 clones. Cards with DP3895 can be configured to be a
    ne2000 or a wd8013. Newer versions of the wd80x3 and SMC Elite cards have 83c790
    in place of the original DP8390. The SMC EtherEZ cards have 83c795, and use the
    same driver as the SMC Ultra. All BNC cards based on some of 8390 or 8390 clone
    will usually have an 8392 (or 83c92, or ???) 16 DIP pin chip close to the BCC.


    Another common NIC found on older cards is the Intel i82586. Cards having this
    NIC include the 3c505, 3c507, 3c523, Intel Ethernet—ISA, Microdyne ECS–205, and
    the Racal–Interlan N15210.


    The original AMD LANCE NIC was AM7990, and newer revisions include the 79c960,
    79c961, 79c965, 79c970, and 79c974. Most cards with one of the above will work
    with the LANCE driver, with the exception of the Racal–Interlan N6510 that have
    their own driver.


    New PCI cards having a DEC 21040, 21041, 21140, or similar number on the NIC should
    be able to use the linux tulip or deax25 driver.


    Other PCI cards having a big chip marked RTL8029 or 89c940 or 86c926 are ne2000
    clone cards, and the driver in linux v2.0 should automatically detect these cards
    at boot.


    # Identifying the Ethernet Address


    Each ethernet has its own byte address that is unique to that card. The first
    three bytes of address are the same for each card by that particular manufacturer.
    For example SMC cards start with 00:00:c0. The last three are by manufacturer
    unique to identify each card as they are produced.


    If your card has a sticker on with all bits of its address, you can look up the
    vendor from the first


