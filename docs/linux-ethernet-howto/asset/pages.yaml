    # Tips on Trying to Use an Unknown Card


    If you are not sure what the card is, but at least narrowed it down, then you
    can build a kernel with a whole bunch of drivers included, and if any of them
    autodetect the card at boot.


    If the kernel does not other drivers it may be that the card is not configured
    to one of the addresses that the driver probes looking for a card. In this case,
    you might want to try getting scanport.tar.gz from your local fpt site, and see
    if that can locate where your jumper is forced. It scans I/O space from 0x100
    to 0x3ff for devices that are not registered in /proc/ioports. If it finds an
    unknown device starting at some particular address, you can explicitly point the
    probes at address with an ether= boot argument.


    If you manage to get the card detected, then you can usually find the jumpers
    by changing one at a time and seeing what I/O base and IRQ the card is detected
    at. The IRQ settings can also be determined by following the traces on the back
    of the card to where the jumpers are soldered through. Counting the "gold fingers"
    on the back of the card with the metal bracket, you have IRQ 9, 7, 6, 5, 4, 3,
    10, 11, 12, 15, or 14 fingers at 21, 22, 23, 24, 25, 34, 35, 36, 37, 38. Eight
    bits can only get up to finger 31.


    Jumpers that do nothing unusual are usually for selecting the memory address of
    an optional boot ROM. Other jumpers are located near the BNC or RJ-45 UI connectors
    are used to select the output media. These are also typically near the "black
    box" voltage converters YCL, Valor, or Fil-Mag.


    A nice collection of jumper settings for various cards can be found at the following:


    +   Ethercard Settings


