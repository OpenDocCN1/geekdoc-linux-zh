    # 9.1 Passing Ethernet Arguments to the Kernel


    Here are two generic kernel commands that can be passed to the kernel at boot
    (ether and reserve). This can be done by LILO, loadlin, or any other booting utility
    that accepts optional arguments.


    For example, if the command was ''blah'' and it added 3 arguments (say 123, 456,
    and 789) then, with LILO, you would use:


    ```

    LILO: blah=123,456,789

    ```


    For more information on (and a complete list of) boot time arguments, please see
    the BootPrompt–HOWTO


    # The ether–argument command


    The ether–argument is used in conjunction with drivers that are directly built
    into the kernel. The ether–argument will have absolutely no effect on a modular
    driver. In its most generic form, it looks something like this:


    ```

    ether=IRQ, BASE_ADDR, PARAM_1, PARAM_2, NAME

    ```'
