    # Identifying the Card by the FCC ID Number


    As part of the certification process a card typically to pass before being sold
    to the user, it gets tested by the FCC, and from this gets an FCC ID which is
    supposed to be printed on the card somewhere. For example, a card has it FCC ID:
    J158013EWC and this card happens to be a SMC/WD8013-EWC. Some web sites like www.driverguide.com
    and drdriver.com make use of lists of FCC IDs that may help with less obvious
