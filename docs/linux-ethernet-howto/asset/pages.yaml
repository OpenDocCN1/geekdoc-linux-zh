    # 1. Introduction


    The Ethernet–Howto covers what cards shows and shouldn''t; how to set them up,
    how to run more than one, and other common problems and questions. It contains
    detailed information on the current level of support for all the most common ethernet
    cards available.


    It does not cover the software end of things, as is covered in the NET–3 Howto.
    Also note that general–Linux specific questions about Ethernet are not (or at
    least they should not) answered here. For those types of questions, see the excellent
    amount of information in the comp.dcom.lans.ethernet FAQ: You can get FTP from
    rtfm.mit.edu just like all the other newsgroup FAQs.


    This present revision covers distribution kernels up to and including 2.2.17.


    The Ethernet–Howto is by:


    Paul Gortmaker, p_gortmaker@yahoo.com


    The primary source of information for the initial ASCII–only version of the Ethernet–Howto
    was:


    Donald J. Becker, becker@scyld.com'
