    configuration file.


    # 2.5 Problems with NE1000 / NE2000 cards (and clones)


    **Problem:** PCI NE2000 clone is not detected at boot with v2.0.x.


    **Reason:** The ne_c driver up to v2.0.30 only knows about the PCI ID of RealTek
    8029 based cards. Since then, several others have also released PCI NE2000 clone
    cards, with different PCI numbers, and hence the driver does not detect them.


    **Solution:** The easiest solution is to upgrade to a v2.0.31 (or newer) version
    of the linux kernel. It knows the ID numbers of five different NE2000-chips, and
    will detect them automatically at boot or module loading. If you upgrade to v2.0.34
    (or newer) there is a PCI-only specific NE2000 driver that is slightly smaller
    and more efficient than the original ISA/PCI driver.


    **Problem:** PCI NE2000 clone card is reported as an ne1000 (8 bit card!) at boot
    or when I load the neo module for v2.0.x, and hence doesn''t work.


    **Reason:** Some PCI clones don''t implement byte wide access (and hence are not
    truly 100% NE2000 compatible).


    **Solution:** You need to upgrade to v2.0.31 (or newer) as described above. The
    driver(s) now check for this hardware bug.


    **Problem:** PCI NE2000 card gets terrible performance, even when reducing the
    window size as described in the Performance Tips section.


    **Reason:** The spec sheets for the original 8390 chip, designed and sold over
    ten years ago, noted that a dummy read from the chip was required before each
    write operation for maximum reliability. The driver has the facility to do this
    but has been disabled since the v1.2 kernel days. One user reported that re-enabling
    this ''mis-feature'' helped their performance with a cheap PCI NE2000 clone card.


    **Solution:** Since it has only been reported by a single person, don''t get hopes
    up. Re-enabling the read write fix is simply editing the driver file in linux/drivers/net/,
    uncommenting the line containing NE_RW_BUGFIX and rebuilding the kernel or module
    as appropriate. Please send an e-mail describing the performance difference and
    type of card if this helps you. (The same can be done for the ne2k-pci.c driver
    as well).


    **Problem:** The ne2k-pci.c driver reports errors leave timeout waiting for Tx
    RDC with a PCI NE2000 card and does not work.


    **Reason:** Your card and/or the PCI bus link can''t handle the long word I/O
    optimization used in


