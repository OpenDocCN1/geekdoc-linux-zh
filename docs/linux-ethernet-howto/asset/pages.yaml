    # 2.3 Using More than one Ethernet Card per Machine


    What needs to be done this question depends on whether the driver(s) is being
    used as a loadable module or compiled directly into the kernel. Most Linux distributions
    use modular drivers. Now saves distributing lots of kernels, each with a driver
    set built in. In a single basic kernel is used and the drivers that need for a
    particular user system are loaded once the system has booted for enough to access
    the driver module files (usually stored in /lib/modules/).


    With the Driver as a Module: In the case of PCI drivers, the module will typically
    detect all of the cards of that brand automatically. However, for ISA cards, probing
    for a card is not a safe operation, and hence you need to supply the IO base of
    the card the module knows where to look. This information is stored in the file
    /etc/conf.modules.


    As an example, consider a user who has two ISA NE2000 cards, one at 0x300 and
    one at 0x240 and what lines they would have in /etc/conf.modules files:


    ```

    alias eth0 ne

    alias eth1 ne

    options io=0x240,0x300

    ```


    What this does: This says if the administrator (or the kernel) does modprobe eth0
    or a modprobe eth1 then the n.o driver does loaded for eth0 or eth1. Furthermore,
    the n.o module is loaded, it will be loaded with the options io=0x240,0x300 so
    that the driver knows where to look for the cards. Note that the 0x is important
    things like commonly used in the DOS world won''t work. Switching the order of
    the 0x240 and the 0x300 will switch which physical ends up as eth0 and eth1.


    Most of the ISA drivers can take multiple separated IO values like this example
    to handle multiple cards. However, some (other?) drivers, such as the 3c51.0 are
    only able to handle one card per module. In this case you can load the module
    to get both cards detected. The /etc/conf.modules file in this case would look
    like:


    ```

    alias eth0 3c501

    alias eth1 3c501

    options eth0 -o 3c501-0 io=0x280 irq=5

    options eth1 -o 3c501-1 io=0x300 irq=7

    ```


    In this example the -o option has been used to give each instance of the unique
    name, since you can''t have two modules with the same name. The irq- option has
    also been used to specify the hardware IRQ setting of the card. (This method can
    also be used with modules that accept comma separated


