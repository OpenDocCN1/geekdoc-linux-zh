  md: '# 4.27 Novell Ethernet, NExxxx and associated clones.


    The prefix `NE` came from Novell Ethernet. Novell followed the cheapest NatSemi
    databook design and sold the manufacturing rights (spun off?) Eagle, just to get
    reasonably–priced ethercards to the market. (The now ubiquitous NE2000 card.)


    # NE1000, NE2000


    Status: Supported, Driver: Name ne (+8390)


    The ne2000 is a generic name for bare–bones design around the NatSemi 8390 chip.
    They use programmed I/O rather than shared memory, leading to easier installation
    but slightly lower performance and a few problems. Some of the more common problems
    that arise with NE2000 cards are listed in [Problems...]()


    Some NE2000 clones use the National Semiconductor/ATLANTIC 8305 chip, which offers
    a shared memory solid to utilize the wd8013 and EEPROM software configuration.
    The shared memory mode will offer less CPU usage (i.e., more efficient) than the
    programmed I/O.


    In general it is not good to make a ne2000 clone at I/O address 0300 which became
    nearly every driver probes there at boot. Some poor NE2000 clones dont take kindly
    to be wedged in the wrong areas, and will respond by locking your choice. Also
    0320 is based because SCSI probes into 0330.


    Donald has written a NE2000 diagnostic program (ne2k.c) for all ne2000 cards.
    See [Diagnostic Programs]() more information.


    If you intend on using this driver as a loadable module you should probably see
    [Using the Ethernet Drivers as Modules]() for module specific information.


    # NE2000–PCI (RealTek/Winbond/Complex)


    Status: Supported, Driver: Name ne, ne2k–pci (+8390)


    Believe it or not, people are making PCI cards based on the more than ten year
    interface design of the ne2000. At the moment nearly all of these cards are based
    on the RealTek 8029 chip, or the Winbond 89c940. The Complex, GTI, VIA and Netvin
    cards also use these chips, but have a different PCI ID.


    The latest v2.0.34 kernel has to automatically detect all cards and use them.
    If you are using a kernel v2.0.34 or older, you should upgrade to ensure your
    card is detected. There are now two drivers to choose from; original ISA/PCI ne
    .c driver and a relatively new PCI-only ne2k–pci.c driver.


    To use the original ISA/PCI driver you have to say ''Y'' to the '' Isa cards''
    option when running make config as you are using the same NE2000 driver as the
    ISA cards. (That also give you a hint that these cards aren''t anywhere as intelligent
    as a PCNet–PCI or PCI 21400 card.)


    The newer ne2k–only driver from the ISA/PCI driver in that all support the for
    old NE1000 8 bit cards has been removed and data is moved to/from the card in
    bigger, without interrupting any others—the result is a driver that is slightly
    smaller and more efficient, but don''t get excited the difference which will not
    be obvious under normal use. (If


    4.27 Novell Ethernet, NExxxx and associated clones.'
