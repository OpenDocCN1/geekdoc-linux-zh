    +   * 2.1 What card should I buy for Linux?

    * 2.2 Alpha Drivers — Getting and Using them

    * 2.3 More than one Ethernet Card for Machine

    * 2.4 The eth=her= didn''t do anything for me. Why?

    * 2.5 Problems with NE1000J/NE2000 cards (and clones)

    * 2.6 Problems with SMC Ultra/EtherEZ and WD80*3 cards

