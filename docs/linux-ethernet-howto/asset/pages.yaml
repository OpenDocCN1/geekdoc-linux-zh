  md: '# 7.8 Multicast and Promiscuous Mode


    Another one of the things Dold has worked on implementing multicast and promiscuous
    hooks.

    All of the released (i.e. not ALPHA) ISA drivers now support promiscuous mode.


    Donald writes:''I''ll say by discussing promiscuous mode, which is conceptually
    easy to implement. For most hardware you only have to set a register bit, and
    from then you get every packet on the wire. Well, it''s almost that; for some
    hardware you have to shut the down (potentially dropping a few packet), reconfigure
    it, and then re-enable the ethercod. OK, so that''s easy, so I''ll move on something
    that''s not quite obvious. It can be done in two ways:


    +   1. Use promiscuous mode, and a packet filter like a Berkeley packet filter
    (BPF). The BPF is a pattern matching stage, where you write a program that picks
    out the packets you are interested in. Its advantage is that it''s very programmable.
    Its disadvantage is that there is no general for the kernel to turning on promiscuous
    mode and running every packet on the wire through every registered packet filter.
    See the Berkeley Packet Filter for more info.

    2. Using the built-in filter that other ethercaps.


    I guess I should list a few ethercaps/code:


    +   1. These classes have a filter but, it''s a simple yes/no ''accept all multicast
    packets'', or ''accept no multicast packets''.

    2. AUTODIN II is the standard CRC (checksum) protocol. In this scheme addresses
    are handled and loaded in a hash table. If the corresponding bit is, this packet
    is accepted. Ethernet packets are laid out so that the hardware does to latch
    (usually) bits by the CRC circuit (anyway for error checking) after the first
    six octets (the destination address), and use them as an index into the hash table
    (a 64-bit table).

    3. These use the six bit hash, and have the table computed and loaded by the host.
    This means the kernel must include the CRC code.

    4. The 82586 uses the six bit hash internally, but it computes the hash table
    from a list of multicast addresses to accept.


    Note that none of these chips do perfect filtering, and we still need a middle-level
    module to do the final filtering. Note also that in every case we must keep a
    complete list of multicast addresses to recompute the hash table when it changes.


    # 7.9 The Berkeley Packet Filter (BPF)


    The general idea of the developers is that the BPF functionality should not be
    provided by the kernel, but should be in a (hopefully-used) compatibility library.


    7.8 Multicast and Promiscuous Mode'
