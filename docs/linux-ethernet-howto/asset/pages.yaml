    please read the notes in the driver source file depca.c in the standard kernel
    source tree.


    This driver will also work on Alpha CPU machines, and there are various ioctl()s
    that the user can play


    # Digital EtherWorks3 (DE203, DE204, DE205)


    Status: Supported, Driver Name: ewkr3


    These cards use a proprietary chip from DEC, as opposed to the LANCE chip used
    in the earlier cards like the DE200. These cards support both shared memory or
    programmed I/O, although you take about a 50%performance hit if you use PIO mode.
    The shared memory can be set to 2KB, 32KB or 64KB, and only 2 and 32 have been
    tested with this. David says that the performance is virtually identical to the
    2KB and 32KB mode. There is more information (including the driver as a loadable
    module) at the top of the driver file ewkr3.c and also in README.ewkr3. Both of
    these files come with the standard kernel distribution. This driver has Alpha
    CPU support like depca does.


    The standard driver has a variety of interesting ioctl()s that can be used to
    get clear packet statistics, read/write the EEPROM, change the hardware address,
    and the link. Hackers can see the source code for more info on that.


    David has also written a configuration utility for this card (along the lines
    of the DOS program NICSETUP.EXE) with other tools. These can be found on Linux
    FTP sites in the directory /pub/linux/system/Network/management --- look for the
    file ewkr3tools-X.XX.tar.gz.


