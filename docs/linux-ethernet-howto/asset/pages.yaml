    # 3c501


    Status: Semi-Supported 8 bit card Driver Name: 3c501


    This obsolete stone-age 8 bit card is really brain-damaged to use. Avoid it like
    the plague. Do not purchase this card, even as a joke. It''s performance horrible,
    and it breaks in many ways.


    For those not convinced, the 3c501 can only do one thing at a time — while you
    are removing one packet from the single-packet buffer it cannot receive another
    packet, nor can it receive a packet while loading a transmit packet. This was
    fine for a network between 8008–8088 computers where processing each packet and
    replying 100s of msecs, but modern networks send back–to–back packets for almost
    every transaction.


    AutoIRQ, DMA isn''t used, the autoprobe only looks at 0x280 and 0x300, and the
    debug level is set with the third boot-time argument.


    Once again, the use of a 3c501 is strongly discouraged! Even more so with an IP
    multicast kernel, you will grind to a halt while listening to multicast packets.
    The comment at the top of the source code for more details.


    # EtherLink II, 3c503, 3c503/16


    Status: Supported, Driver Name: 3c503 (+8390)


    The 3c503 does not have `EEPROM setup`, a diagnostic/setup program isn''t needed
    before running the card with Linux. The shared memory address of the 3c503 is
    set jumpers that are shared with the PROM address. This is confusing to people
    familiar with other ISA cards, where you always leave the jumper set to “disable”
    unless you have a BOOT.


    These cards should be about the same size as the bus width WD803, which turns
    out to be a bit slower. The 8390 facilities (they found many bugs!) The Linux
    3c503 driver can also work with the 3c503 in programmed-I/O mode, but this is
    slower and less reliable than shared memory mode. programmed-I/O mode is not well
    tested when updating the drivers. You shouldn''t use the programmed-I/O mode unless
    you need it for MS–DOS compatibility.


    The 3c503''s IRQ line is in set, with no hints from an EEPROM. Unlike the MS–DOS
    drivers, the Linux driver has capability to autoIRQ; it uses the first available
    IRQ line in [5,2,9,4], selected each time the card is configured (Older drivers
    selected at boot time). The ioctl() in `config` will return EAGAIN if no IRQ line
    is available at time.


