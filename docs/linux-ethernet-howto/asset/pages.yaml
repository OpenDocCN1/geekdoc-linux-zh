  md: '# Linux Ethernet–Howto


    who we thank for writing a lot of the ethernet card drivers that are presently
    available for Linux. He is also the original of the NFS server too. Thanks Donal!


    This document is Copyright (c) 1993–2000 by Paul Gartner. Please see the Disclaimer
    and Copying information at the end of this document (copyright) for information
    about redistribution of this document and the usual ''we are not responsible for
    what you manage to break...'' type legal stuff.


    # 1.1 New Versions of this Document


    New versions of this document can be retrieved:


    Ethernet–HOWTO


    or for those wishing to use FTP and/ get non–HTML formats:


    Sunsite HOWTO Archive


    This is the ''official'' location – it can also be found on various Linux WWW/ftp
    mirror sites. Updates will be made as new information and/or becomes available.
    If this copy you are reading is more than 6 months old, then you should check
    to see if an updated copy is available.


    This document is available in various formats (postscript, dvi, ASCII, HTML, etc.).
    I recommend viewing it in HTML (via a WWW browser) or the Postscript/dvi format.
    Both of these contain cross–references that are not included in the text ASCII
    format.


    # 1.2 Using the Ethernet–Howto


    As this guide is getting bigger and bigger, you probably won''t want to spend
    the rest of your afternoon reading the whole thing. And the good news is that
    you don''t have to read all. The HTML and Postscript/dvi versions have a table
    of contents which will help you find what you need a faster.


    Chances are you reading this document because you can''t get to work and you don''t
    know what to do or check. The next section (HELP? It doesn''t work!) is aimed
    at newcomers to linux and will point you in the right direction.


    Typically the problems that we encounter are asked over and again by different
    people. Your specific problem or question is one of Frequently Asked Questions,
    and is answered in the FAQ (The FAQ section). Everybody should look through this
    section before posting for help.


    If you haven''t got an ethernet card, then you will want to start deciding on
    a card. (What card should I buy...)


    If you have already got an ethernet card, but are not sure if you can use it with
    Linux, then you will want to read the section which contains specific information
    on each manufacturer, and your cards. (Vendor Specific...)


    If you are interested in the technical aspects of the linux device drivers, then
    you can have a browse of the section with this type of information. (Technical
    Information)


    1.1 New Versions of this Document'
  merge: -1
