  md: '# Linux Ethernet-HowTo


    # Probe


    Called at boot for check existence of card. Best is if it can un-obtrusly reading
    from memory, etc. Can also read from I/O ports. Initial writing to I/O ports is
    not good as it may kill any device. Some device initialization is usually done
    here I/O space (allocating I/O space, IRQs,filling in the dev->??? fields etc.)
    You need to know how ports/mem the card can be configured, how to enable shared
    memory (if used) and how to select/enable interrupt generation, etc.


    # Interrupt handler


    Called by the kernel when the card posts an interrupt. This has the job of determining
    why the card posted an interrupt, and acting accordingly. Usual interrupt conditions
    are to be rec''d, transmit complete, error conditions reported. You need to know
    any relevant interrupt status bits so that you can accurately


    # Transmit function


    Linked to dev->hard_start_xmit and is called by the kernel when there is some
    data that the kernel wants to put over the device. This puts the data onto the
    card and triggers the transmit. You need to know how to bundle the data and how
    to get it onto the card (shared memory copy, PIO transfer, DMA?) and in the right
    place on the. Then you need to know how to tell the card to send the data down
    the wire, and (possibly) post an interrupt when done. The hardware cannot accept
    additional packets it should set the dev->busy flag. When additional room is available,
    during a transmit-complete interrupt, dev->busy should be cleared and the higher
    levels informed with `mark_bh (INET_BH)`.


    # Receive function


    Called by the kernel interrupt handler when the card reports there is data on
    the card. It pulls the data off the card, packages it into a sk_buff and lets
    the kernel know the data is here for it doing a netif_rx(sk_buff). You need to
    know how to enable interrupt generation upon Rx of data, how to check any Rx status
    bits, and how to get that data off the card (again sh mem, PIO, DMA, etc.)


    # Open function


    linked to dev->open and by the networking layers when somebody does ifconfig eth0
    – this puts the device on line and enables it for Rx/Tx of data. Any initialization
    incantations that were not done in the probe sequence (enabling IRQ generation,
    etc.) would go in here.


    # Close function (optional)


    This puts the card in a sane state when someone does ifconfig eth0 down. It should
    free the IRQs and DMA channels if the hardware permits, and turn off anything
    that will save power (like the transceiver).


    # Miscellaneous functions


    Things like a reset function, so that if they go south, the driver can reset the
    card as a last ditch effort. Usually when a Tx times out or similar. A function
    to read the statistics registers of the card if so equipped.


    Probe


