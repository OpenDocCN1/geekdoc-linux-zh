  md: 'The possible reason for this could be due to the difference in on board buffer
    between the 8 bit and the 16 bit cards. The maximum ethernet packet size is about
    1500 bytes. Now that 8KB NFS packet will arrive at 6 going back to maximum size
    ethernet packets. Both the 8 bit and 16 bit cards have problem Rxing back to back
    packets. The problem arises when the machine doesnt remove the packets from the
    cards in time, and the buffer overflows. The fact that 8 bits can insert an extra
    ISA cycle per transfer does not help. What you can do if you have an 8 bit card
    is set the NFS transfer to 2kB (or 1kB), or by increasing the ISA bus speed in
    order to get the card''s buffer cleared out. I have found that an old WD80D3E
    card at 8MHz (with no other system load) can keep up with a large receive at 2kB
    NFS, but not at 4KB, where performance was degraded by a factor of three.


    On the other hand, if the default option is to 1kB size and you have at least
    a 16 ISA card, you may find a significant increase in going to 4kB (or even 8kB).


    # 4. Vendor/Manufacturer/Model Specific Information


    The following lists many characters in alphabetic order by vendor name and then
    identifier. Beside each product ID, you will see ‘Supported’, ‘Semi-Supported’
    or ‘Not Supported’


    Supported means that a driver for that card exists, and many people are using
    it and it seems quite reliable.


    Semi-Supported means that a driver exists, but at least one of the following descriptions
    is true: (1) The driver and/or hardware are buggy, which may cause poor performance,
    failing connections or crashes.(2) The driver is new or the card is fairly uncommon,
    and hence the driver has seen very little use/testing and the driver has had little
    feedback. (2) is preferable to (1), and the individual description of the card/driver
    should mark which one holds true. In either case, you will probably have to answer
    ‘Y’ when asked ‘Prompt for development and/or incomplete code/drivers when running
    `config`.


    Not Supported means there is not a driver currently available for that card. This
    could be due to a lack of interest in hardware that is rare/uncommon, or because
    the vendors won''t release the hardware documentation to write a driver.


    Note that the difference between ‘Supported’ and ‘Semi-Supported’ is also subjective,
    and is based on user feedback newsgroup postings and mailing lists.(After all,
    it is impossible for one person to test all drivers with all cards for each kernel
    version!!! So be warned that semi-supported works perfectly for you (which is
    great), or that a card listed as supported gives you end of troubles and problems
    (which is not great).


    After the status, the name of the driver in the linux kernel driver is listed.
    This will also be the name of the driver module that would be used in the alias
    eth0 driver_name line that is found in the /etc/conf.modules configuration file.


    # 4.1 3Com


    If you are not sure what your card is, but you know it is a 3Com card, you can
    probably find it out from the assembly number. 3Com has a document ‘Identifying
    3Com Adapters by Assembly Number’ (ref 24500002) that would likely clear things
    up. See Technical Information from 3Com for info on how to get documents from
    3Com.


    4. Vendor/Manufacturer/Model Specific Information'
