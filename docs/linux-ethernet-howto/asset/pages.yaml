    will work if you have an unusually complicated request.


    # 9.2 Using the Ethernet Drivers as Modules


    Most of the linux distributions now ship kernels that have very few drivers built-in.
    The drivers are instead supplied as a bunch of independent dynamically loadable
    modules. These modular drivers are typically loaded by the administrator with
    the modprobe (8) command, or in some cases they are automatically loaded by the
    kernel `kerneld` (in 2.0) or `kmod` (in 2.1) which calls modprobe.


    You particular distribution may offer nice graphical tools for setting up ethernet
    modules. The description that follows gives information on what underlies any
    fancy configuration program, and what these programs changes.


    The information that controls modules are to be used and what options are supplied
    to each module is usually stored in the file `/etc/conf.modules`. The two main
    options of interest (for ether cards) will be used in this file as `alias` and
    options. The modprobe command consults this for module information.


    The actual modules themselves are typically stored in a directory named `/lib/modules/`uname
    -r`/net gives the kernel version (e.g. 2.0.34). You can look in there to see which
    modules match your card.


    The first thing you need in `conf.modules` file is something to tell modprobe
    which driver to use for the eth0 (and eth1...) and network interface. For example,
    if you have an ISA SMC EtherZ card which uses the smc-ultra driver module, you
    need to alias this driver to eth0 by adding the line:


    ```

    alias eth0 smc-ultra

    ```


    The other thing you need is an options line indicating what options are to be
    used with a particular module (or module alias). Continuing with the above, for
    example, if you only the single alias line with no options line, the kernel would
    warn you (`dmesg`) autoprop for ISA cards is not a good idea. To get rid of this,
    you would add another line telling the module I/O base card is configured in,
    this case use the hexadecimal address 0x280 for example.


    ```

    options smc-ultra io=0x280

    ```


    Most ISA modules accept parameters like io=0x340 and irq=12 on the insmod command
    line. It is REQUIRED or at least STRONGLY ADVISED that you supply these parameters
    to avoid probing for the card. Unlike PCI and most devices, there is no real way
    to do auto-probing for most ISA devices, and so it should be avoided when using
    drivers as modules.


    A list of the options that each module can be found in the file:


    `/usr/src/linux/Documentation/networking/net-modules.txt


    # 9.2 Using the Ethernet Drivers as Modules'
