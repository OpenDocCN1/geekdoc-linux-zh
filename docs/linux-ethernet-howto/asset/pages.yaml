  md: '# Linux Ethernet-Howto


    All arguments are optional. The first non-numeric argument is taken as the NAME.


    IRQ: Obvious. An IRQ value of `0` (usually the default) means to autoIRQ. It''s
    a historical accident that the IRQ setting is fixed rather than the base_addr
    — this will be fixed whenever something changes.


    BASE_ADDR: Obvious. A value of `0` (usually the default) means to board card-type-specific
    address list for an ethercard.


    PARAM_1: It was originally used as an override for the memory start for a shared-memory
    ethercard, the WD80*3. Some drivers use the four bits of this value to set the
    debug level 0 — default, 1–7 —1…7 (maximum verbosity) 8 — level (no messages).
    The LANCE driver uses the four bits of this value to select the DMA channel. Otherwise
    it uses auto-DMA.


    PARAM_2: The 3c503 driver uses this to select between the internal and external
    transceivers. 0 — default/internal, 1 — AUI external. The Carleton E21XX card
    also uses the 4 bits of PARAM_2 to select the output media. It detects them automatically.


    NAME: The network device value refers to here. The standard uses the names `eth0`,
    `eth1`, `eth2` and `eth3` for bus-attached ethercards, and `atp0` for the parallel
    port `pocket ether adapter`. The arcent driver uses `arc` as name. The default
    setting is an enabled probe to be for `eth0`. Multiple cards can be enabled by
    explicitly setting them up using these probes using LANCE parameters. The 1.0
    kernel has LANCE-based ethercards as a scale fact. LILO arguments are ignored,
    and LANCE cards are always assigned `eth<n>`. Additional non-LANCE ethercards
    must be explicitly assigned `eth<n+1>`, and the usual `eth0` probed something
    like `eth0=0,-1,eth0`. ( Yes, this is bug )


    # The reserve command


    This lilo command is just like `eth=` above, it is appended to the name of boot
    select specified in lilo


    ```

    reserve=IO-base,extent(, IO-base,extent...)

    ```


    In some machines it may need to prevent device drivers from checking for devices
    (auto-probing) in a specific region. This may be because of poorly designed hardware
    that causes the boot to freeze (such as some ethercards), hardware that is mistakenly
    identified, whose state is changed by an earlier probe, or hardware does not know
    the kernel to initialize.


    The reserve boot-time addresses this problem by specifying an I/O port region
    that shouldn''t be probed. That region is reserved in the kernel''s port registration
    table as if a device has already found in that region. That mechanism shouldn''t
    be necessary on most machines. Only when there is a problem or special case would
    it need to use this


    The I/O ports in the specified region are protected against device probes. This
    was to be used when one driver was running on a NE2000, or misidentifying some
    other device as ours. A correct driver shouldn''t reserve a region, unless another
    boot argument explicitly specifies it to do so. This implies that reserve must
    often be used with some boot argument. Hence if you specify a reserve region to
    protect a specific device, you must generally specify an explicit probe for that
    device. Most drivers use a port registration table if they are given an explicit
    address.


