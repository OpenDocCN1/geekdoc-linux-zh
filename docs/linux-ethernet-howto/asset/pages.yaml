    # Etherlink III, 3c509 / 3c509B


    Status: Supported, Driver Name: 3c509


    This card is fairly inexpensive and has good performance for an ISA non-master
    design. The drawbacks are that the original 3c509 requires very low latency. The
    3c509B shouldn''t suffer from the same problem, due to having a larger buffer.
    These cards use PIO transfers, similar to a n2000 card, so a shared memory such
    as a w8083 will be better in comparison.


    The original 3c509 has a small packet buffer (4KB total, 2KB RX, 2KB TX), causing
    the driver to occasionally drop a packet if interrupts are masked for too long.
    To minimize this problem, you can unmask interrupts during IDE disk transfers
    (see hdparm) and/or increasing your ISA bus speed finish sooner.


    The newer 3c509B has 8KB on board, and the buffer can be split 4/4, 5/3 or 6/2
    for Rx/Tx. This setting is changed with the DOS configuration utility, and is
    stored on the EEPROM. This should alleviate the above problem with the 3c509.


    3c509B users should use the supplied DOS utility to disable the plug and play,
    and to set the output method to what you require. The linux driver does not support
    the Autodetect setting method, so you have to select 10Base-T or 10Base-2 or UI.
    Note to turn off PnP you should do a 3C59XCFG /PNP: DISABLE and then with a hard
    reset to ensure that takes effect.


