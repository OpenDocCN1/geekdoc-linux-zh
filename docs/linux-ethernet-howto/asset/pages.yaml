- img_proc: true
  md: '# Linux Ethernet-Howto


    For example, here are some speeds measured by the TTCP program on a 40MHz 486,
    with an 8 bit WD8003EP card, for different ISA speeds.


    | ISA Bus Speed (MHz) | Rx TTCP (kB/s) |

    |---||

    | 6.7 | 740 |

    | 13.4 | 970 |

    | 20.0 | 1030 |

    | 26.7 | 1075 |


    You would be pressed to do below 1075kB/s with any 10Mb/s ethernet card, using
    TCP/IP. However, dont expect any system to work at fast ISA speeds. Most systems
    will not function properly at speeds above 13MHz.(Also, some PCI systems have
    the bus speed fixed at 8MHz, so that the end user does not have the option of
    increasing it).


    In addition to faster speeds, one will usually also benefit from a reduction in
    CPU usage due to the shorter duration and I/O cycles.(Note that hard disks and
    video cards located on the ISA bus will also experience a performance increase
    from an increased ISA bus.)


    Be sure to back your data prior to experimenting with ISA bus speeds in excess
    of 8MHz, and thoroughly test that all ISA peripherals are operating properly after
    making any increases.


    # 3.3 Setting the TCP Rx Window


    Once again, with small amounts of onboard RAM and relatively slow data paths between
    the card and the computer''s memory run into trouble. The default TCP Rx window
    setting is 32kB, which means that a fast computer on the same subnet you can dump
    32kB of data on without stopping to see you receive any of it.


    Recent versions of the route command have the ability to set the size of this
    window on the fly. Usually it is only for the local net that this window must
    be reduced, as computers that are behind a couple of routers or gateways are ''buffered''
    not to pose a problem. An example would be:


    ```

    route add <whatever> ... window <win_size>

    ```


    where win_size is the size of the window you wish to use (in bytes). An 8 bit
    3c503 card on an ISA bus operating at a speed of 8MHz would work well with a window
    size of about 4kB. Too large a window will cause overflows and dropped packets,
    and a drastic reduction in ethernet throughput. You can check the operating status
    by doing a cat /proc/net/dev which will display dropped or overrun conditions
    that occurred.


    # 3.4 Increasing NFS performance


    Some people have found that using 8 bits in NFS clients causes poorer than expected
    performance, when using 8kB (native Sun) NFS packet size.


    3.3 Setting the TCP Rx Window'
