    it is not built into the Linux kernel. But the rationale is that this is less
    protection than it seems; attackers can simply force the system to call "interesting"
    locations already in the program (e.g., in its library, the heap, or static data
    segments). Also, sometimes Linux does require executable code in the stack, e.g.,
    to implement signals and to implement GCC "trampolines". Solar Designer''s patch
    handles these cases, but this does complicate the patch. Personally, I''d like
    to see this merged into the main Linux distribution, since it makes attacks somewhat
    more difficult and it defends against a range of existing attacks. However, I
    agree with Linus Torvalds and others that this does not add the amount of protection
    it would appear and can be circumvented with relative ease. You can read Linus
    Torvalds'' explanation for not including this support at http://lwn.net/980806af/linux-noexec.html.


