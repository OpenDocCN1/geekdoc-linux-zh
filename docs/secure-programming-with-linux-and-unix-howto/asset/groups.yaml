    ## 附录 A 历史


    以下是本书开发的几个关键事件，从最近的事件开始：


    2001-01-01 David A. Wheeler

    发布版本 2.70，增加了大量额外材料，例如跨站恶意内容、HTML/URI 过滤以及临时文件的处理。


    2000-05-24 David A. Wheeler

    切换到 GNU GFDL 许可证，增加了更多内容。


    2000-04-21 David A. Wheeler

    发布版本 2.00，日期改为 2000年4月21日，文档内部格式从 Linuxdoc DTD 切换到 DocBook DTD。感谢 Jorge Godoy
    协助我完成转换。


    2000-04-04 David A. Wheeler

    发布版本 1.60；改为涵盖 Linux 和 Unix。由于大多数指南已经涵盖，且许多开发者希望他们的应用能在两个系统上运行，这是合理的。


    2000-02-09 David A. Wheeler

    指出该文档现在是文档项目 (LDP) 的一部分。


    1999-11-29 David A. Wheeler

    初始版本 (1.0) 完成并公开发。注意，更详细的更改可以在在线的“ChangeLog”文件查看查看。


    ## 附录 B 谢谢


    铁有无缘，人有磨炼。感谢以下人员，他们通过指出错误、建议涵盖领域、提问等让我保持诚实。如果包含了电子邮件地址，已通过前缀进行了处理；将人列入列表并不授权向他们发送未经的电子邮件。


