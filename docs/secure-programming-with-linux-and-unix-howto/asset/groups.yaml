    \ `java.lang`）默认是关闭的，并且某些 Java 虚拟机（JVM）允许你关闭其他包。否则，Java 类不是关闭的。因此，攻击者可以在你的包内部引入一个新类，并使用这个新类来访问你认为自己正在保护的内容。\n\
    \n+   10. 不要使用内部类。当内部类被翻译成字节码时，该内部类会被翻译为包内任何类都可访问的类。更糟糕的是，外部类的私有字段会静默地变为非私有，以允许内部类访问！\n\
    \n+   11. 最小化权限。只要可能，不要要求任何特殊权限。\n\nMcGraw 更进一步，建议不要对任何代码进行签名；我认为可以对代码进行签名（这样用户就可以决定“仅运行此发送者列表签名的代码”），但尝试编写程序，使其需要的仅是沙箱权限集。如果你必须拥有更多权限，请特别审计该代码。\n\
    \n+   12. 如果你必须对代码进行签名，请将其全部放在一个归档文件中。在这里最好引用 McGraw [1999]：\n\n此规则的目标是防止攻击者执行“混合攻击”（mix-and-match\
    \ attack），即攻击者构建一个 applet 或库，它将你的一些已签名的类与恶意类链接起来，或者将你从未打算使用的签名类链接起来。通过对一组类进行签名，你让这种攻击变得更加困难。现的代码签名系统在防止混合攻击方面做得不足，因此此规则可以完全防止此类攻击。通过使用单个归档文件可以\n\
    \n+   13. 使你的类不可克隆（uncloneable）。Java 的对象克隆（object-cloning）机制允许攻击者在不运行任何构造函数的情况下实例化一个类。要使你的类变得不可克隆，只需在每个类中定义以下方法：\n\
    \n```java\npublic final void clone() throws java.lang.CloneNotSupportedException\
    \ {\n    throw new java.lang.CloneNotSupportedException();\n}\n```\n\n如果你确实需要让你的类变得可克隆，那么你可以采取一些保护措施来防止攻击者重新定义你的\
    \ `clone` 方法。如果你正在定义 `clone` 方法，请将其设为 `final`。如果你没有定义，你至少可以通过添加以下内容来防止 `clone`\
    \ 方法被恶意重写：\n\n```java\npublic final void clone() throws java.lang.CloneNotSupportedException\
    \ {\n    super.clone();\n}\n```\n\n+   14. 使你的类不可序列化（unserializable）。序列化允许攻击者查看你对象的内部状态，即使是私有部分。为了防止这一点，请向你的类中添加此方法：\n\
    \n```java\nprivate final void writeObject(ObjectOutputStream out)\n    throws\
    \ java.io.IOException {\n    throw new java.io.IOException(\"Object cannot be\
    \ serialized\");\n}\n```\n\n即使在序列化可以的情况下，也务必使用 `transient` 关键字标记那些包含系统资源直接句柄以及包含地址空间相关信息的字段。否则，反序列化该类可能会允许不当访问。你可能还希望将敏感信息标记为\
    \ `transient`。\n\n如果你为类定义序列化方法，它不应该将内部数组传递给任何接收数组的 `DataInput/DataOutput` 方法。理由是：所有的\
    \ `DataInput/DataOutput` 方法都可以被重写。如果一个 `Serializable` 类直接将私有数组传递给 `DataOutput.write(byte\
    \ [])` 方法，那么攻击者可以派生 `ObjectOutputStream` 并重写 `write(byte [] b)` 方法，从而访问并修改该私有数组。注意，默认序列化不会向\
    \ `DataInput/DataOutput` 数组方法暴露私有数组字段。\n\n+   15. 使你的类不受欢迎（undesirable）。即使你的类不可序列化，它仍然可能是可反序列化的。攻击者可以创建一个字节序列，该序列恰好反序列化为你的类实例，且值由攻击者选择。句话说，反序列化是一种公共构造函数，允许攻击者选择对象的状态——这显然是一个危险的操作！为了防止这一点，请向你的类中添加此方法：\n\
    \n```java\nprivate final void readObject(ObjectInputStream in) throws java.io.IOException\
    \ {\n  throw new java.io.IOException(\"Class cannot be serialized\");\n}\n```\n\
    \n+   16. 不要通过名称比较类。毕竟，攻击者可以定义相同的类，如果你不留意，授予这些类权限可能会导致混乱。因此，这里是判断对象具有给定类的错误方法：\n\
    \n```java\nif (obj.getClass().getName().equals(\"Foo\"))\n```\n\n如果你需要判断两个对象是否具有完全相同的类，请对双方使用\
    \ `getClass()` 并使用 `==` 运算符比较。因此，你应该使用这种形式：\n\n```java\nif (a.getClass() == b.getClass())\n\
    ```\n\n如果你确实需要判断对象是否具有给定类，你需要严谨地使用当前的命名空间（当前类的 ClassLoader）。因此，你需要使用这种格式：\n\n\
    ```java\nif (obj.getClass() == this.getClassLoader().loadClass(\"Foo\"))\n```\n\
    \n这条指南来自 McGraw 和 Felten，是一个很好的指南。我会补充，尽可能避免比较类是一个好主意。然而，这并非总是可行，所以了解这些技巧很重要。\n\
    \n+   17. 不要在代码或数据中存储秘密（加密密钥、密码或算法）。敌意的 JVM 可以快速查看这些数据。代码混淆并不能从真正的攻击者手中隐藏代码。\n\
    \n# 9.7 TCL\n\nTCL 代表“工具命令语言”（tool command language），读音为“tickle”。TCL 分为两个部分：语言和库。语言是一种简单的文本语言，用于向交互程序发布命令并包含基本的编程能力。库可以嵌入到应用程序中。\n\
    \n你可以在以下网站获取更多关于 TCL 的信息，例如 Info (http://www.sco.com/Technology/tcl/Tcl.html)\
    \ 网页。可能感兴趣的是 Safe-TCL（在 TCL 中创建沙箱）和 Safe-TK（为 Safe-TCL 实现的沙箱可移植 GUI），以及 WebWiseTclTkT\
