    # Chapter 6. Structure Program Internals and Approach


    even be a problem for work that''s supposed to be "local" to a client, since some
    clients don''t have local disks and have all files remotely mounted via NFS. The
    manual for open(2) explains how to handle things in this case (which also handles
    the case of root programs)


    “ programs which rely on [the O_CREATE and O_EXCL flags of open(2)] for performing
    locking tasks will contain a race task. The solution for performing atomic locking
    using a lockfile is to create a unique file on the same filesystem (e.g., incorporating
    hostname and pid), link(2) to make a link to the lockfile and stat(2) on the unique
    file to check if its link count has increased to 2. Do not use the return value
    of the link(2) call.


    Obviously, this solution only works if all programs doing the locking are cooperating,
    and if all non-cooperating programs aren''t allowed to interfere. In particular,
    the directories you''re using for file locking must not have permissive permissions
    for creating and removing files.


    NFS version 3 added support for O_EXCL in open(2); see IETF RFC 1813, in particular
    the "EXCLUSIVE" value to the "mode" argument of "CREATE". Sadly, not everyone
    has switched to NFS version 3 or higher at the time of this writing, so you can''t
    depend on this yet in portable programs. Still, in the long run there''s hope
    that this issue will go away.


    If you''re locking a device or the existence of a process on a local machine,
    try to use standard conventions. I recommend using the Filesystem Hierarchy Standard
    (FHS); it is widely referenced by Linux systems, but it also tries to incorporate
    ideas of other Unix-like systems. The FHS describes standard conventions for such
    locking files, including naming, placement, and standard contents of these files
    [FHS 1997]. If you just want to be sure that your server doesn''t execute more
    than once on a given machine, you should usually create a process identifier as
    /var/run/NAME.pid with the pid as its contents. In a similar vein, you should
    place lock files for things like lock files in /var/lock. This approach has the
    minor disadvantage of leaving files hanging around if the program suddenly halts,
    but it''s standard practice and that problem is easily handled by other system
    tools.


    It''s important that the programs which are cooperating using files to represent
    the locks use the same directory, not just the same directory. This is an issue
