    \ 协议的一部分，发送一个带有所需值的 \"charset\"。遗憾的是，很难由衷意地推荐这种（技术上更优）的方法，因为某些较旧的 HTTP/1.0 客户端没有妥善处理显式的\
    \ `charset` 参数。尽管 HTTP/1.1 规范要求客户端遵守该参数，但这本身就足够可疑，你可能应该将其作为强制使用正确编码的辅助手段，而不是唯一的机制。\n\
    \n## 8.6. 防止访问包含文件/配置文件\n\n在开发基于 Web 的应用程序时，不要允许用户访问（读取）此类程序包含文件和配置文件。这些数据可能提供足够的信息（例如密码）来破解系统。请注意，此准则有时也适用于其他类型的应用程序。你可以采取以下几种操作来实现这一点，包括：\n\
    \n- 将包含/配置文件放置在 Web 文档根目录之外（这样服务器永远不会提供这些文件）。\n- 配置 Web 服务器使其不将包含文件作为文本提供。例如，如果你正在使用\
    \ Apache，可以为 `.inc` 文件添加处理程序（handler）或动作（action）。\n- 将包含文件放置在保护的目录中（使用 `.htaccess`），并将它们指定为不会被提供的的文件。\n\
    \n## 第 8 章 审慎地返回信息\n\n- 使用过滤器拒绝对文件的访问。对于 Apache，可以这样实现：\n\n```\n<Files ~ \"\\\
    .phpincludes\">\n  Order allow,deny\n  Deny from all\n</Files>\n```\n\n如果你需要使用完整的正则表达式来匹配文件名，在\
    \ Apache 中你可以使用 `FilesMatch` 指令。\n\n- 如果你的包含文件是有效的脚本文件（且服务器会解析它），请确保它不会对用户提供的参数采取操作，并且其设计是安全的。\n\
    \n这些方法无法防止那些对文件所在目录具有访问权限且该目录是全局可读的用户。你可以更改文件的权限，使得 Web 服务器的 `uid/gid` 可以读取这些文件。然而，如果用户可以让\
    \ Web 服务器运行他自己的脚本（用户只需编写脚本来访问你的文件），这种方法将不起作用。从根本上说，如果你的站点托管在与不受信任人员共享的服务器上，很难保护系统。一种方法是运行多个\
    \ Web 程序，每个程序具有不同的权限；这提供了更高的安全性，但在实践中非常痛苦。另一种方法是将这些文件设置为仅由你的 `uid/gid` 可读，并让服务器以“你的”权限运行脚本。后一种方法有自己的问题：这意味着服务器的某些部分必须具有\
    \ root 权限，并且脚本可能拥有比需要的更多的权限。\n\n## 第 9 章 语言特定问题\n\n> 毫无疑问，世界上有各种语言，但没有一种语言是没有意义的。\n\
    > 哥林后书 14:10 (NIV)\n\n存在许多与语言特定的安全问题。其中许多问题可以总结如下：\n\n- 在可行的情况下，开启你可用的相关警告和保护机制。这包括了编译时机制和运行时机制。通常情况下，与安全相关的程序应该在开启所有警告的情况下干净地编译。\n\
    - 避免语言中危险和过时的操作。我所指的“危险”是指那些难以正确使用的操作。\n- 确保语言的基础设施（例如运行时库）可用且安全。\n- 自动垃圾回收字符串的语言应该特别小心，立即擦除秘密数据（特别是密钥和密码）。\n\
    - 确切了解你所使用的操作的语义。在文档中查找操作的语义。除非它们不相关，否则不要忽略返回值。这在不支持异常的语言（如 C）中尤为困难，但事实就是如此。\n\
    \n### 9.1. C/C++\n\nC 和 C++ 程序中最大的安全问题之一是溢出；更多信息请参见第 5 章。C 还有一个弱点是不支持异常，这使得编写忽略关键错误情况的程序很容易。\n\
    \nC 和 C++ 中的一个复杂问题是，字符类型 `char`可以是有符号或无符号的（取决于编译器和机器）。当一个高位位的有符号 `char` 保存到整数中时，结果将是一个负数；在某些情况下是可以被利用的。通常，在处理可能具有大于\
    \ 127 (0x7f) 值的数据时，缓冲区、指针和强制转换应使用 `unsigned char` 代替 `signed char`。\n\n从定义上说，C\
    \ 和 C++ 的类型支持非常松散，但没有必要在代码中保持松散。尽可能开启大量的编译器警告，并修改代码以便在开启警告的情况下顺利编译，并在单独的头文件 (`.h`)\
    \ 中严格使用 ANSI 协议，以确保所有调用使用正确的类型。对于使用 gcc 编译的 C 或 C++，至少应使用以下编译标志（它们开启了一系列警告信息）并消除所有警告（注意使用\
    \ `-O2` 是因为警告只能通过在高优化级别执行的数据流分析检测到）：\n\n```\ngcc -Wall -Wpointerarith -Wstrict-prototypes\
    \ -O2\n```\n\n你可能还需要 `-pedantic`。\n你的 C/C++ 编译器可能也想要 `-pedantic`。gcc 可以检测不准确的格式字符串，如果你使用\
    \ `__attribute__()` （一种 C 扩展）来标记此类函数。以下是你放在头文件中的示例：\n\n```\n/* in header.h */\n\
    #ifndef _GNUC\n#define __attribute__(x) /*nothing*/\n#endif\n```\n\n```\nextern\
    \ void logprintf(const char *format, ...)\n__attribute__((format(printf,1,2)));\n\
    ```\n\n```\nextern void logprintf(const char *format, va_list args)\n__attribute__((format(printf,1,0)));\n\
    ```\n\n\"format\" 属性接受 \"print\" 或 \"scanf\"，其随后的数字分别是格式字符串和可变参数的数量。GNU 文档提到了这一点。注意还有其他\
    \ `__attribute__`set，例如 `noreturn` 和 `const`。\n\n### 9.2. Perl\n\nPerl 程序员应该先阅读\
    \ `perlsec(1)` 手册，它描述了编写安全 Perl 程序的许多问题。特别是 `perlsec(1)` 描述了“污染”（taint）模式，大多数安全的\
    \ Perl 程序应该使用该模式。如果真实用户或组 ID 不同，污染模式会自动启用，或者你可以使用 `t` 命令标志（如果你代表他人运行，请使用后者）。\n\
    \n然而，污染模式最明显的影响是，你可能意外使用来自程序外部的数据来影响程序外部。在污染模式下，所有外部获取的输入都被标记为“受污染”，包括命令行参数、环境变量、区域信息（参见\
    \ `perlocale(1)`）、某些系统调用的结果（`readdir`, `readlink`, `getpw*` 调用的 `gecos` 字段）以及所有文件输入。受污染的数据不能直接或间接地用于调用子\
    \ shell 的任何命令，也不能用于任何修改文件、目录或进程的命令。这里有一个重要的例外：如果你向 `system` 或 `exec` 传递参数列表，列表的元素不会被检查污染情况，因此在污染模式下使用\
    \ `system` 或 `exec` 要格外小心。任何源自受污染的数据也会变得受污染。这一点有一个例外；消除污染数据的方法是提取受污染数据的子串。但是，不要盲目地通过\
    \ `..` 来操作，因为这会破坏污染机制的保护。相反，识别出程序允许的“安全”模式，并使用它们来提取“良好”值。在提取值之后，你可能仍需要对其进行检查（特别是其长度）。\n\
    \n`open`、`glob` 和反引号函数会调用 shell 来展开文件名通配符；这可以被用来打开安全漏洞。你可以避免使用这些函数\n\n"
