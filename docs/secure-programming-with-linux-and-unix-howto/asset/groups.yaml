    类类系统（包括 Linux）不会隔离刻意协作的程序；如果你担心恶意程序协作，你需要一个实现某种强制性访问控制/或能限制隐蔽信道的系统。


    - 如果你以后不再使用某些文件系统或描述符，请务必关闭它们。特别，不要保留指向 chroot 牢狱（jail）之外目录的描述符，或者不要设置可能导致此类描述符被传递给它的情况（例如，通过
    Unix 套接字或旧版本的 `/proc` 实现）。如果该程序是一个指向 chroot 牢狱之外目录的描述符，它可能被用于逃逸 chroot 牢狱。


    Chroot 牢狱必须安全地设置。不要使用普通用户的家目录（或子目录）作为 chroot 牢狱；应使用专门为该目的设置“home”目录。放置最少的文件。通常你需要
    `/bin`、`/etc`、`/lib` 以及可能还有一两个（例如，如果合适的话有 `/pub`）。仅将执行 `chroot()` 之后运行所需的文件放在
    `/bin` 中；有时你完全不需要任何文件（尽量避免放在那里，尽管这可能无能避免）。你可能需要 `/etc/passwd` 和 `/etc/group` 以便列表显示正确的名称，但如果是这样，尝试不要包含真实系统的值，并将所有密码替换为
    `**`。在 `/lib` 中，仅放置你需要的；使用 `ldd(1)` 查询 `/bin` 中的每个程序以找出它的需求，并仅包含它们。在 Linux 上，你可能需要几个像
    `ld-linux.so.2` 这样的基础库，没有其他的。通常完全拷贝所有磁盘空间内容比创建硬链接更明智；虽然这会浪费一些时间和磁盘空间，但它能确保对 chroot
    牢狱文件的攻击不会自动传播到普通系统的文件中。在支持的系统中，挂载 `/proc` 文件系统通常是不明智的。事实上，在 Linux 2.0.x 版本中，这是一个已知的安全漏洞，因为
    `/proc` 中存在伪目录，允许 chroot 的程序逃逸。Linux 内核 2.2 修复了这个已知问题，但可能还有其他问题；如果可能，请不要这样做。


    如果程序可以获取 root 权限，chroot 实际上并不有效。例如，程序可以使用像 `mknod(2)` 的调用创建一个可以查看物理内存的设备文件，然后使用生成的设备文件修改内核内存以获取任何所需的权限。关于
