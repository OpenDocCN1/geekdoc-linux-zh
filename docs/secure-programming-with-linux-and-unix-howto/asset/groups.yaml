    You can set most of these values with chmod(2), fchmod(2), and chmod(1) but see
    also chown(1), and chgrp(1). In Linux, some the Linux-unique attributes are manipulated
    using chatt(1).


    Note that in Linux, only root can change the owner of a file open(2). Some Unix-like
    systems allow ordinary users to transfer ownership of their files, but this causes
    complications and is forbidden by Linux. For example, if you’re trying to limit
    disk usage, allowing such operations would allow some other “victim”.


    ## 3.2.4. Using Access Control Attributes


    Under Linux and most Unix-like systems, reading and writing attribute values are
    only checked when the file is opened; Still, a large number of calls do check
    these attributes, since the filesystem is central to Unix-like systems. Calls
    that check these attributes include open(2), create(2), link(2), unlink(2), rename(2),
    mknode(2), symlink(2), and socket(2).


    ## 3.2.5. Filesystem Hierarchy


    Over the years conventions have been built on “what files to place where”. Where
    possible, please follow conventional use when placing information in the hierarchy.
    For example, place global configuration information in /etc. The Filesystem Standard
    (FHS) tries to define these conventions in a logical manner, and is widely used
    by Linux systems. The FHS is an update to the previous Linux Filesystem structure
    (FSSTND), incorporating learnings and approaches from Linux, BSD, and System V
    systems. See http://www.pathname.com/rhs for more information about the FHS. A
    summary of these conventions is in hier(5) for Linux and hier(7) for Solaris.
    Sometimes different conventions disagree; where possible, make these situations
    configurable at compile or installation time.


