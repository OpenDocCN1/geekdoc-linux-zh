    如果程序从文件中获取指令，那么它不能特殊地信任该文件，除非只有受信任的用户才能控制其内容。通常这意味着不可信的用户不能修改该文件、其目录或其任何祖级目录。否则，该文件必须被视为可疑。


    如果文件中的指令本应来自不可信的用户，请确保来自文件的输入按照本书中所述的方法受到保护。特别是，要检查值是否匹配合法值集，并且缓冲区没有溢出。


    ## 4.5. Web 应用程序输入（特别是 CGI 脚本）


    Web 应用程序（如 CGI 脚本）运行在某些受信任的服务器上，并通过 Web 获取其输入数据。由于输入数据数据通常来自不可信的用户，因此必须对这些输入数据进行验证。事实上，这些信息可能实际上来自不可信的第三方；更多信息请参见第
    6.1 节。例如，CGI 脚本通过一组标准的环境变量和标准输入来传递这些信息。本文其余部分将专门讨论 CGI，因为它是实现 Web 内容最常用的技术，但其他动态
    Web 内容技术的通用性问题是相同的。


