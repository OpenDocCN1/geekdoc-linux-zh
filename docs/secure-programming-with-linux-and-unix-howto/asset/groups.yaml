    \n警告 - 在许多情况下，除非你获得了对输出字符编码的控制权，否则这些技术可能会被破解。否则，攻击者可以使用“意外”的字符编码来绕过这里讨论的技术。坦率地说，这并不难；获取输出字符编码控制将在第\
    \ 8.5 节中讨论。\n\n下面的第一个章节讨论了如何识别需要过滤、编码或验证的特殊字符。随后描述了如何过滤或编码这些字符。然而，没有专门讨论如何验证数据的子章节，通用的输入验证请参阅第\
