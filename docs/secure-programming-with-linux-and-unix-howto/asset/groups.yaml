  - '[PAGE 44]


    # 3.6. Quotas and Limits


    Many Unix-like systems have mechanisms to support filesystem quotas and process
    resource limits. This includes Linux. These mechanisms are particularly useful
    for preventing denial of service attacks; by limiting the resources available
    to each user, you can make it hard for a single user to use up the system resources.
    Be careful with terminology here, because filesystem quotas and process resource
    limits have “hard” and “soft” limits but the terms mean slightly different things.


    You can define storage (filesystem) quota on each mountpoint for the number of
    blocks of storage and/or the number of unique files (inodes) that can be used,
    and you can set such limits for a given user or given group. A “hard” quota is
    a never-to-exceed limit, while a “soft” quota can be temporarily exceeded. See
    quota(1), quota(2), and quota(8).


    The limit mechanism supports a large number of process quotas, such as file size,
    number of children processes, including Linux, programs of open files, and so
    on. There is a “soft limit” (also called the current limit) and a “hard limit”
    (also called the upper limit). The soft limit cannot be exceeded at any time,
    but through calls it can be raised to the value of the hard limit. See getlimit(),
    setlimit(), and getrusage(). Note that there are several ways to set these limits,
    including the PAM module pam_limits.


    # 3.7. Dynamically Linked Libraries


    Practically all programs depend on libraries to execute. In modern Unix-like systems,
    programs are by default compiled to use dynamically linked libraries (DLLs). That
    way, you can update a library and all the programs that library will use the new
    (hopefully) version if they can.


    Dynamically linked libraries are typically placed in one or few special directories.
    The usual directories include /lib, /usr/lib, /lib/security for PAM modules, /usr/X11R6/lib
    for X-windows, and /usr/local/lib.


    There are special conventions for naming libraries and having symbolic links for
    them, with the result that you can update libraries and still support programs
    that want to use'
