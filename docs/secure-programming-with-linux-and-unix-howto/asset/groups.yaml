    # Chapter 3. Summary of Linux and Unix Security Features


    below for more information on POSIX capabilities. Linux kernel version 2.2 and
    greater support this; other Unix-like systems do too, but it''s not widespread.


    In Linux, if you really need to know what attributes are associated with each
    process, the most definitive source is the Linux source code, in particular `/usr/include/linux/sched.h`''s
    definition of task_struct.


    The portable way to create new processes it is the fork(2) call. BSD introduced
    a variant vfork(2) as an optimization technique. The bottom line with vfork(2)
    is simple: `don''t` use it if you can avoid. See Section 7.5 for more information.


    Linux supports the Linux-unique clone(2). This call works like fork(2), but allows
    specification of which resources should be shared (e.g., memory, file descriptors,
    etc.). Portable programs shouldn''t use this directly; as noted earlier, they
    should instead rely on threading libraries that use the call to implement threads.


    This book is not a full tutorial on writing programs, so I skip widely-available
    information handling processes. You can see the documentation for wait(2), exit(2),
    and so on for more information.


    ## 3.1.2. POSIX Capabilities


    POSIX capabilities are sets of bits that permit splitting of the privileges held
    by root into a larger set of more specific privileges. POSIX capabilities are
    defined by a draft IEEE standard; they''re not unique to Linux but they''re not
    universally supported by other Unix-like systems either. Linux kernel 2.0 did
    not support POSIX capabilities, while version 2.2 added support for POSIX capabilities
    to processes. When Linux documentation (including this one) says “requires root
    privilege”, in nearly all cases it really means “requires a capability” as documented
    in the capability documentation. If you need to know the specific capability required,
    look it up in the capability documentation.


    In Linux, the eventual intent is to permit capabilities to be attached to files
    in the filesystem; as of writing, however, this is not yet supported. There is
    support for transferring capabilities, but this is disabled by default. Linux
    version 2.2.11 added a feature that makes capabilities more directly useful, called
    the “capability bounding set”.


    The capability binding set is a list of capabilities that are allowed to be held
    by any process on the system (otherwise, only the special init process can hold
    it). If a capability does not appear in the binding set, it may not be exercised
    by any process, no matter how privileged. This feature can be used to, for example,
    disable kernel module loading. A sample tool that takes advantage of this is LCAP
    at http://pweb.netcom.com/~spoon/lcap/


    More information about POSIX capabilities is available at ftp://linux.kernel.org/pub/linux/libs/security/privs.


    ## 3.1.3. Process Creation and Manipulation


    Processes may be created using fork(2), the non-recommended vfork(2), or the Linux-unique
    clone(2); all of these systems duplicate the existing process, creating two processes
    out of it. A process can execute a different program by calling execve(2), or
    various front-ends to it (for example, exec(3), system(3), and popen(3)).


    When a program is executed, and its file has its setuid or setgid bit set, the
    process’s EUID or EGID (respectively) is usually set to the file’s value. This
    functionality was the source of an old Unix security weakness when used to support
    setuid or setgid scripts, due to a race condition. Between the time the kernel
    opens the file to see which interpreter to run, and when the (now-set-id) interpreter
    turns around and reopens the file to interpret it, an attacker might change the
    file (directly or via symbolic links).


    Different Unix-like systems handle the security issue for setuid scripts in different
    ways. Some systems, such as Linux, completely ignore the setuid and setgid bits
    when executing scripts, which is clearly a safe approach. Most modern releases
    of SysVr4 and BSD 4 use a different approach to avoid the kernel race condition.
