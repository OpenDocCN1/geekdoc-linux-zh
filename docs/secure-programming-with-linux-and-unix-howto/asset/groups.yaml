    review this has received. More useful information is available from the comp.lang.tcl
    FAQ launch page at http://www.tclfaq.wservice.com/tcl-faq. However, it''s worth
    noting that TCL''s desire to be a small, “simple” language results in a language
    that can be rather limiting; see Richard Stallman'' “Why You Should Not Use TCL”(http://sdg.lcs.mit.edu/~jchapun/6853-F9Y7/Papers/stallman-tcl.html).
    For example, TCL''s notion that there is essentially only one data type (string)
    can make many programs harder to write (as well as making them slow). Also, when
    I''ve written TCL programs I found it''s easy to accidentally create TCL programs
    where malicious input strings can cause unintended and unexpected behavior. For
    example, attackers may be able to cause your TCL program to do unexpected things
    by sending characters with special meaning to TCL such as embedded spaces, double-quote,
    curly braces, dollar signs, or brackets (or create input to cause these characters
    to be created during processing). Thus, I don''t recommend TCL for writing programs
    which must mediate a security boundary. If you do choose to do so, be especially
    careful to ensure that user input cannot “fool” the program. On the other hand,
    I know of no strong reason (other than insufficient review) that TCL programs
    can''t be used to implement mobile code. There are certainly TCL advocates who
    will advocate more use than I do, and TCL is one of the few languages with a ready-made
    sandbox implementation.'
