    # # Chapter 1. Introduction


    > > A wise man attacks the city of the

    mighty and pulls down the

    stronghold in which they trust.

    Proverbs 21:22 (NIV)


    This book describes a set of design and implementation guidelines for writing
    secure

    programs on Linux and Unix systems. For purposes of this book, a “secure program”
    is

    a program that sits on a security boundary, taking input from a source that does
    not

    have the same access rights as the program. Such programs include application

    programs used as viewers of data, web applications (including CGI scripts),

    network servers, and setuid/setgid programs. This book does not address modifying
    the

    operating system kernel itself, although many of the principles described here
    apply.

    These guidelines were developed as a survey of “lessons learned” from various
    sources

    of how to create such programs (with additional observations by the author),

    organized into a set of larger principles. This book includes specific guidance
    for a

    number of languages, including C,++, Java, Perl, Python, TCL, and Ada95.


    This book does not cover assurance measures, software engineering processes, and

    quality assurance approaches, which are important but widely discussed elsewhere.

    measures include testing, peer review, configuration management, and formal

    methods. Documents specifically identifying sets of development assurance measures

    for security issues include the Common Criteria [CC 1999] and the System Security

    Engineering Capability Maturity Model [SSE-CMM 1999]. More general sets of

    Software Engineering methods or processes are defined in documents such as the

    Software Engineering Institute’s Capability Maturity Model for Software (SE-CMM),

    ISO 9000 (along with ISO 9001 and ISO 9001-3), and ISO 12207.


    This book does not discuss how to configure a system (or network) to be secure
    in a

    given environment. This is clearly necessary for use of a given program, but a

    great many other documents discuss secure configurations. An excellent general
    book

    on configuring Unix-like systems to be secure is Garfinkel [1996]. Other books
    for

    securing Unix-like systems include Anonymous [1998]. You can also find information'
  - '[PAGE 9]


    # Chapter 1. Introduction


    on configuring Unix-like systems at web sites such as http://www.unixtools.com/security.html.
    Information on configuring a Linux system to be secure is available in a wide
    variety of documents including Fenzi [1999], Seifried [1999], Wreski [1998], Swan
    [2001], and Anonymous [1999]. For Linux systems (and eventually other Unix-like
    systems), you may want to examine the Bastille Hardening System, which attempts
    to "harden" or "tighten" the Linux operating system. You can learn more about
    Bastille at http://www.bastille-linux.org; it is available for free under the
    General Public License (GPL).


    This book assures that readers understand security issues in general, the general
    security of Unix-like systems, and the C programming language. This book includes
    some information about the Linux and Unix programming model for security.


    This book covers all Unix-like systems, including Linux and the various strains
    of Unix, and it particularly stresses details about Linux specifically. There
    are several reasons for this, but a simple reason is popularity. According to
    a 1999 survey by IDC, significantly more servers (counting both Internet and intranet
    servers) were deployed in 1999 with Linux than all Unix operating system types
    combined (25% for Linux versus 15% for all Unix system types combined; note that
    Windows NT came with 38% compared to the 40% of all Unix-like servers) [Shankland
    2000]. A survey by Zoebelein in April 1999 found that, of the total number of
    servers deployed on the Internet in 1999 (running at least ftp, news, or http
    (WWW)), the majority were running Linux (28.5%), with others (24.4% for Windows
    95/98/NT, 17.7% for Solaris or SunOS, 15% for the BSD family, and 5.3% for IRIX).
    Advocates will notice that the majority of servers on the Internet (around 66%)
    were running Unix-like systems, while only around 24% ran a Microsoft Windows
    variant. Finally, the original version of this book only discussed Linux, although
    its scope has expanded, the Linux information is still noticeably dominant. If
    you know relevant information not already included here, please let me know.


    You can find the master copy of this book at http://www.dwheeler.com/secure-programs.
