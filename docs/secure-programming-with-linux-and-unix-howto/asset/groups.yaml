    is one advantage of GNOME approach, since at least on some systems tempnam(3)
    automatically while the mkstemp(3) approach requires more code to do this. Please
    don''t create yet more environment variables for temporary directories (such as
    TEMP), and in particular don''t create a different environment name for each application
    (e.g., don''t "MYAPP_TEMP\). Doing so complicates managing systems, and users
    can just set the environment variable for that particular execution. Of course,
    if these environment variables might have been set by an untrusted source, you
    should ignore them - which you''ll do anyway if you follow the advice in Section
    4.2.3.


    These techniques don''t work if the temporary directory is remotely mounted using
    NFS version 2 (NFSv2), because NFSv2 doesn''t properly support O_EXCL. See Section
    6.7.1 for more information. NFS version 3 and later properly support O_EXCL; the
    simple solution is to ensure that temporary directories are either local, or if
    mounted using NFS, mounted NFS version 3 or later. There is a technique for safely
    creating temporary files on NFS v2, involving the use of link(2) and stat(2),
    but it''s complex; see Section 6.7.2.1 which has more information about this.


    As an aside, it''s worth noting that FreeBSD has recently changed the mk*temp()
    family to get rid of the PID component of the filename and replace the entire
    thing with base-62 encoded randomness. This drastically reduces the number of
    possible temporary files for the "default" usage of 6 X''s, meaning that even
    mkstemp(3) with 6 X''s is reasonably (probabilistically) secure against guessing,
    except under very frequent usage. However, if you also follow the guidance here,
    you''ll eliminate the problem they''re addressing.


    Much of this information on temporary files was derived from Kris Kennaway''s
    posting to Bugtrap files on December 15, 2000 (http://flw.net/2000/1221/a/sec-tmp.php).


