    (SUID) attribute is there to permit trusted programs to temporarily switch UIDs.

    Unix-like systems using the SUID the following rules: If the RUID is

    changed, or the EU is set to a value not equal to the RUID, the SUID is set to
    the

    new EU. Unprivileged users can set their EID from their SUID, the RUID to the

    EUID, and the EU to the RUID.


    The Linux-unique FSUID process attribute is intended to permit programs like NFS

    server to limit themselves to only the filesystem rights of some given without

    giving that UID permission to send signals to the process. Whenever the EUID is

    changed, the FSUID is changed to the new EUID value; the FSUID value can be set

    separately using setsuid(2), a Linux-unique call. Note that non-root callers can
    only set

    FSUID to the current RUID, EUID, SEUID, or current FSUID values.


