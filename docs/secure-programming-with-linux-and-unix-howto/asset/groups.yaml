    随着更多计算机和互联网的普及，程序越来越需要支持多种语言和文化。这种语言与其他因素的结合通常被称为“本地化（locale）”。修改程序以支持多种 locale
    的过程被称为“国际化 (i18n)”，而为特定 locale 提供信息的过程被称为“本地化 (l10n)”。总的来说，国际化是一件好事，但这一过程提供了另一个安全漏洞。由于潜在的不可信用户提供了
    locale 信息，locale 选择变成了另一个可以利用的输入。


    ### 4.7.1. 如何选择 locale


    在本地运行的程序（包括 setuid/setgid）中，locale 信息由环境变量提供。因此，与所有环境变量一样，在使用前必须提取值并进行有效模式检查。


