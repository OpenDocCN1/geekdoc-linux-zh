    # 第 3 章 Linux 和 Unix 安全特性概述


    关于 POSIX 能力的更多信息请见下文。Linux 内核 2.2 及更高版本支持此特性；其他 Unix 类系统也支持，但并不广泛。


    在 Linux 中，如果你确实需要知道每个进程关联的属性，最权威的来源是 Linux 源代码，特别是 `/usr/include/linux/sched.h`
    中对 `task_struct` 的定义。


