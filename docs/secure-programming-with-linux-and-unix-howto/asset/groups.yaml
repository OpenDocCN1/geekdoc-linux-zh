    \ exceeded. See quota(1), quota(2), and quota(8).\n\nThe limit mechanism supports\
    \ a large number of process quotas, such as file size, number of children processes,\
    \ including Linux, programs of open files, and so on. There is a “soft limit”\
    \ (also called the current limit) and a “hard limit” (also called the upper limit).\
    \ The soft limit cannot be exceeded at any time, but through calls it can be raised\
    \ to the value of the hard limit. See getlimit(), setlimit(), and getrusage().\n\
    \n## 3.7. Dynamically Linked Libraries\n\nPract all programs depend on libraries\
