    \ 个参数的 `open()` 调用，用于关闭这些魔法，而无需 `sysopen()` 的复杂操作（http://www.xray.mpg.mpg/mailing-lists/perl5-porters/2000-003/msg02596.html）。\n\
    \nPerl 程序应该开启警告标志 (-w)，它会警告你潜在危险或过时的语句。\n\n你还可以在受限环境中运行 Perl 程序。更多信息请参阅标准 Perl\
    \ 分发版中的 \"Safe\" 模块。我不确定该模块经过了多少审计，请注意不要依赖它来实现安全性。你可能还会研究“安全分布式互联网脚本的企鹅模型”，尽管在编写代码和文档时该模型似乎不可用。\n\
    \n## 9.3. Python\n\n与任何语言一样，要警惕任何允许数据作为程序部分执行的函数，以确保不可信的用户无法影响其输入。这包括 `exec()`、`eval()`\
    \ 和 `execfile()`（坦率地说，你应该仔细检查任何对 `compile()` 的调用）。`input()` 语句也出奇地危险。[Watters\
    \ 1996, 150]。\n\n具有被无权限用户调用权限的 Python 程序（例如 setuid/setgid 程序）不能导入 \"user\" 模块。`user`\
    \ 模块会导致 `pythonrc` 文件被读取并执行。由于该文件受不可信用户的控制，导入 `user` 模块允许攻击者强制受信程序运行任意代码。\n\n\
    Python 通过其 RExec 类提供了对“受限制执行”（Restricted Execution）的支持。这主要用于执行小应用程序（applets）和移动代码，但即使代码不是外部提供的，也可以用于限制程序中的权限。默认情况下，受限制执行环境允许读取文件（但不允许写入），并且不包含网络访问或\
    \ GUI 交互的操作。这些默认值可以更改，但要警惕受限环境中的漏洞。特别是，允许用户无限制地向类添加属性将允许各种破坏环境的方法，因为 Python 实现会调用“隐藏”方法。请注意，默认情况下，Python\
    \ 对象是通过引用传递的；如果你在受限制程序的环境中插入一个指向可变值的引用，那么受限制程序可以更改该对象，且这种更改在受限环境外是可见的！因此，如果你想访问可变值，在很多情况下你应该拷贝该可变值或使用\
    \ Bastion 模块（它支持对另一个对象的受限访问）。更多信息请参阅 Kuchling [2000]。我不确定受限制执行能力经过了多少审计，因此程序员请留心。\n\
    \n## 9.4. Shell 脚本语言 (sh 和 csh 派生)\n\n我强烈建议不要使用标准命令 脚本语言（如 csh、sh 和 bash）来编写 setgid\
    \ 安全代码。某些系统（如 Linux）完全禁用了它们，因此你创建了不必要的移植性问题。在某些旧系统上，由于竞态条件，它们从根本上是不安全的（如第 3.1.3\
    \ 节所述）。对于其他系统，它们并不是一个好主意。标准命令 shell 仍然因受非明显输入的影响而臭名昭著——通常命令 shell 设计是为了为交互式用户“自动”执行任务，而不是为了防御坚定的攻击者。例如，“隐藏”环境变量（例如\
    \ ENV 或 BASH_ENV 变量）可能会影响它们的运行方式，或者在脚本执行之前执行任意用户定义的代码。即使是可执行文件的文件名或目录内容也会影响结果。例如，在\
    \ Bourne shell 实现中，执行以下操作将授予 root 权限（感谢 NCSA 描述了这一漏洞）：\n\n```\n% ln -s /usr/bin/setuid-shell\
    \ /tmp/-x\n% cd /tmp\n% -x\n```\n\n某些系统已经修复了这个漏洞，但观点仍然成立：大多数命令 shell 并不是为编写安全的\
    \ setuid/setgid 程序设计的。出于编程考虑，即使在那些允许它们的系统上，也要避免使用 setuid 脚本。相反，用另一种语言编写一个小型程序来清理环境，然后让它调用其他可执行文件（其中一些可能是\
    \ shell 脚本）。\n\n如果你仍然坚持使用 shell 脚本语言，至少将脚本放在一个无法移动或更改的目录中。在脚本非常早期将 PATH 和 IFS\
    \ 设置为已知值。\n\n## 9.5. Ada\n\n在 Ada95 中，`Unbounded_String` 类型通常比 `String` 类型更灵活，因为会根据需要自动调整大小。然而，不要在\
    \ `Unbounded_String` 中存储特别敏感的值如密码或密钥，因为核心转储和页区域可能仍然持有它们。相反，请使用 `String` 处理此类数据，并尽快用某些常量值覆盖数据。\n\
    \n## 9.6. Java\n\n如果你正在使用 Java 开发安全程序，坦率地说，你的第一步（学习 Java 之后）是阅读关于 Java 安全的两个主要文本：Gong\
    \ [1999] 和 McGraw [1999]（后者请特别看第 7 ）。你还应该查看 Sun 的安全指南：http://java.sun.com/security/secodide.html。显然，很大程度上取决于你正在开发的应用程序类型。用于客户端的\
    \ Java 代码与服务器端代码具有完全不同的环境（以及信任模型）。当然，通用原则适用；例如，你必须检查并过滤来自不可信源的任何输入。然而，在 Java 中，你需要警惕某些“隐藏”输入或潜在输入，下文所述。Jonathan\
    \ Nightingale [2000] 提出了一个有趣的陈述，总结了 Java 中的许多问题：\n\nJava 编程的大问题在于注意其继承。如果你从父类、接口继承方法，你就有可能为你的代码打开大门的风险。\n\
    \n以下是基于 Gong [1999]、McGraw [1999]、Sun 的指导以及我个人经验的若干指南：\n\n- 不要使用公共字段或变量；将它们声明为私有并保护访问，以便限制它们的访问性。\n\
    - 将方法设为私有是一个很好的理由（如果不这样做，请说明原因）。这些非私有方法必须保护自己，因为它们可能会接收受污染的数据（除非你通过某种方式保护了它们）。\n\
    - JVM 可能在应用程序运行时并不真正强制执行访问修饰符（例如 \"private\"）（这与 applet 不同）。问题在于这取决于访问是用哪个类加载器加载的。如果类是用受信任的类加载器加载的（包括空/原始类加载器），则访问检查返回“TRUE”（允许访问）。例如，这种操作是有效的（至少在\
    \ Sun 的 1.2.2 VM 上；在其他实现上可能不起作用）：\n  a. 编写一个带有公共字段的受害者类 (V)，并编译它。\n  b. 编写一个访问该字段的“攻击”类\
    \ (A)，并编译它。\n  c. 将 V 的公共字段改为私有，重新编译。\n  d. 运行 A——它将访问 V 的（现在是私有的字段）。\n\n然而，applet\
    \ 的情况不同。如果你将 A 转换为 applet 并作为 applet 运行（例如使用 appletviewer 或浏览器），它的类加载器将不再\n"
