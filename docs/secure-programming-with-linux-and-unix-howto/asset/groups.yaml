    来自动处理此操作。如果有更多的程序使用这些函数，很快之后，它们就会成为 Linux 发行版和其他 Unix 类系统的标准部分了。此外，这些函数最近被添加到了
    "glib" 库中（我提交了该补丁），因此 glib（未来）将提供这些函数。在 glib 中，这些函数命名为 `g_strcpy` 和 `g_strcat`（而不是
    `strcpy` 或 `strcat`），以与 glib 库的命名规范保持一致。


    ## 5.2.4. libmib


    一种可以动态重新分配字符串的 C 工具集是 Forrest J. Cavalier III 编写的 "libmib alloc functions"，可在
    http://www.microsoft.com/libmib/astring 获取。libmib 有两个版本；"libmib-open" 显然根据其类似于
    X11 的许可是开源的，该许可允许修改和重新分发，但重新分发必须选择不同的名称，然而，开发者表示它“可能没有经过充分测试”。为了持续获得 `libmib-mature`，你必须支付订阅费用。文档不是开源的，但可以免费获取。


    ## 5.2.5. Libsafe


    Arash Baratoo、Timothy Tsai 和 Navjot Singh（来自 Lucent Technologies）开发了 Libsafe，这是一个针对若干已知易受栈溢出攻击（stack
    smashing attacks）影响的库函数的包装器。这个包装器（他们称之为一种“中间件”）是一个简单的动态加载库，其中包含了修改后的 C 库函数，如 `strcpy(3)`。这些修改后的版本实现了原始功能，其方式确保任何缓冲区溢出都被限制在当前的堆栈帧内。他们的初始性能分析表明，该库的开销非常小。Libsafe
    的论文和源代码可在 http://www.bell-labs.com/1135cs/libsafe.html 获取。Libsafe 的源代码根据完全开源的
    GPL 许可证提供，并且迹象表明许多 Linux 发行版对使用它感兴趣。


    Libsafe 的方法相当很有用。Linux 发行版绝对应该考虑将其纳入，其他人也值得考虑它的方法。然而，作为一名软件开发者，Libsafe 是一个支持深度防御（defense-in-depth）的有用机制，但它并不能真正防止缓冲区溢出。以下是为什么你在代码开发期间不应该依赖
    Libsafe 的几个原因：


    - Libsafe 保护一小部分存在缓冲区溢出问题的函数。在此时，此列表远短于书中已知存在问题的函数列表。它也不会保护你自己编写的（例如在循环中）导致缓冲区溢出的代码。

    - 即使在发行版中安装了 `libsafe`，其安装方式也会影响其使用。文档建议设置 `LD_PRELOAD` 以启用 libsafe 的保护，但问题是用户可以取消这个环境变量……导致他们执行的程序的保护机制被禁用！

    - Libsafe 仅防止栈溢出到返回地址；你仍然无法确保所有部署平台都会使用 libsafe（或类似的东西），你必须像它不存在那样保护你的程序。

    - 除非你能确保所有部署平台都会使用 libsafe（或类似的东西）……（重复）

    - Libsafe 似乎假设保存的帧指针（saved frame pointers）位于每个堆栈帧的开头。这并不总是如此。编译器（如 gcc）可以优化掉内容，特别是
    `-fomit-frame-pointer` 选项移除了 libsafe 似乎需要的信息。因此，libsafe 可能会在某些程序上失效。


    libsafe 的开发者自己也承认软件开发者不应该依赖 Libsafe。用他们的话说：


    通常认为，解决缓冲区溢出攻击的最佳方案是修复有缺陷程序。然而，修复缺陷程序需要知道某个程序是有缺陷的。使用安全和其他替代安全措施的真正益处在于，保护尚未发现漏洞的程序免受未来攻击的侵害。


    ## 5.2.6. 其他库


    glib（不是 glibc）库是一个广泛获取的源码库，为 C 程序员提供了许多函数。例如，GTK+ 和 GNOME 都使用 glib。正如我之前提到的，在
    1.3.2 版本中，`g_strcpy()` 和 `g_strcat()` 通过我提交的一个补丁被添加了。一旦这些后续版本的 glib 广泛可用，这应该让这些函数的跨平台移植变得更容易。目前，我还没有分析报告能明确证明
    glib 函数可以防止缓冲区溢出。然而，许多 glib 函数会自动分配内存，而这些函数在自动分配时，没有合理的方法来拦截失败（例如，尝试其他其他操作）。因此，在许多情况下，大多数
    glib 函数无法在安全程序中使用。GNOME 指南建议使用如 `g_strdup_printf()` 类的函数，只要你的程序崩溃没有关系，这样做是可以的。


    ## 5.3. C/C++ 中的编译解决方案


    最有用的工具之一是 "StackGuard"，它是标准 GNU 编译器的修改版本。StackGuard 的原理是在返回地址之前插入一个“保护”值（称为金丝雀，canary）；如果缓冲区溢出覆盖了返回地址，金丝雀的值（希望）会改变，系统会检测到并崩溃。这非常有价值，但请注意这不能防止溢出其他值。有一项工作旨在扩展
    StackGuard 以向其他数据项添加金丝雀，称为 "PointGuard"。PointGuard 会自动保护某些值（例如函数指针）。然而，使用 PointGuard
    保护其他类型需要特定的干预（程序员必须识别哪些数据值需要保护）。这可以很有价值，但很容易漏掉某些需要保护的值。关于 StackGuard、PointGuard
    以及其他替代方案的更多信息见 C [99]。


    作为一个相关问题，在 Linux 中你可以修改 Linux 内核使该段不可执行；一个 Linux 补丁已经（参见 Solar Designer 的补丁，位于
    http://www.openwall.com/linux/）。然而，截至编写时，它尚未内置在 Linux 内核中。但理由是这种保护并不看起来那么有效；攻击者可以简单强制系统调用程序已存在的有趣位置（例如，在库、堆或静态数据段中）。此外，有时
    Linux 确实需要在栈中包含执行代码，例如为了实现信号和 GCC “跳转板”。Solar Designer 的补丁处理了这些情况，但这增加了补丁的复杂性。我个人希望看到这合并到
    Linux 主发行版中，因为它让攻击变得更加困难并防御了一系列现有攻击。然而，我同意 Linus Torvalds 等其他人的观点，这种增加的保护程度并不像看起来那样多，可以被相对地绕过。你可以阅读
    Linus Torvalds 对不包含此支持的解释：http://lwn.net/980806af/linux-noexec.html。


    简而言之，最好的方法是先开发一个能够自我防御缓冲区溢出的正确程序。在你完成这一点之后，尽尽管使用 StackGuard 之类的工具作为额外的安全网。如果你已经在代码本身中努力消除了缓冲区溢出，那么
    StackGuard 可能会更加有效。


    '
