    ## 2.2. 安全原则


    你应该熟悉许多通的安全原则；可以查阅计算机安全领域的通用书籍，例如 [Pleeeger 1997]。在这里总结了其中的几点。


    安全目标通常用三个总体目标来描述：


    - 机密性（Confidentiality，也称为保密性），意味着计算系统的资产只有授权方才可以访问。

    - 完整性（Integrity），意味着资产只能由授权方以授权的方式进行修改。

    - 可用性（Availability），意味着授权方可以及时访问资产（由系统需求决定）。未能实现这一目标被称为“拒绝服务”（denial of service）。


    一些人定义了额外的安全目标，而另一些人则将这些额外目标归为这三个目标的特例。例如，某些人单独将“不可否认性”（non-repudiation）视为一个目标；这是“证明”发送者或接收者收到了消息的能力，即使发送者或接收者想要否认。隐私（Privacy）有时与机密性分开讨论；有些人认为这是在保护用户的机密性（例如其身份）而不是数据。大多数目标都需要身份识别（identification）和身份验证（authentication），这些有时会被列为一个单独的目标。通常，审计（包括“访问控制”和“真实性”）也会被单独列出。在任何情况下，确定你程序的整体安全目标都是重要的，无论你如何将这些目标分组，这样你就能知道何时满足了这些目标。


    有时这些目标是对已知威胁集合的响应，而有时这些目标是法律要求的。例如，对于美国银行和其他金融机构，有一种名为《格拉姆-利奇-布莱尔法案》（GLB Act）的隐私法。该法强制披露共享的个人信息和数据安全手段，要求披露将与第三方共享的个人信息，并指示机构给客户提供退出数据共享的机会。[Jones
    2000]


    ## 第 2 章 背景


    安全与某些其他通用系统/软件工程原则之间有时存在冲突。安全有时会干扰“易用性”，例如，安装一个安全的配置可能比安装一个虽然能用但不安全的“琐易”安装要花费更多精力。通常，这种表面的冲突是可以解决的，例如通过重新思考问题，可能使一个系统既安全又实用。安全与抽象（信息隐藏）之间也存在一些冲突；例如，某些高层程序可能是安全实现的，也可能不是，但它们的规范不会告诉你。根结底，如果你的应用程序必须是安全的，而你无法采取其他方法，你就必须亲力而为——是的，库应该被修复，但由于你选择库函数不当而受伤的是你的用户。


    ## 2.3. 开源对安全有利吗？


    安全实业人员对于开源方法对安全的影响存在大量争议。核心问题之一是，开源让代码所有人（包括攻击者和防御者）审查，而理性的人对这种情况的最终影响意见不一。


    以下是一些研究过该主题的人的引用。Bruce Schneider 认为，聪明的工程师应该“对任何与安全相关的要求开源” [Schneider 1999]，他还讨论了使开源软件安全必须满足的某些前提条件。Vincent
    Rijmen 是胜出的高级加密标准（AES）加密算法的开发者，他认为 Linux 的开源特性提供了一个优的平台，使得安全漏洞更容易被发现和修复，“不仅是因为更多的人可以查看它，更重要的是，这种模式迫使人们编写更清晰的代码，并遵守标准。反过来促进了安全审查”
    [Rijmen 2000]。Elias Levy (Aleph1) 在他的文章《开源真的比闭源更安全吗？》(http://www.securityfocus.com/commentary/19)
    中讨论了使开源软件安全的某些问题。他的总结是：


    这是否意味着在安全漏洞方面，开源软件并不比闭源软件好？并不是。开源确实具有比其闭源对应物更高的安全性。但不要误认为，仅仅是开源并不能保证安全。


    John Viega 的文章《开源安全的神话》(http://dev-opensource.earthweb.com/news/000526_security.html)
    也讨论了这些问题，并这样总结道：


    开源软件项目可以比闭源项目更安全。然而，那些能让开源程序安全的因素——源代码的可用性，以及有大量用户可以寻找并修复安全漏洞——也会让人们陷入虚假的安全感中。


    Michael H. Harfield 的《对开源安全的沉思》(http://www.linuxworld.com/linuxworld/lw-1998-11/lw-11-rampararts.html)
    对开源安全的影响要积极得多。Fred Schneider 不认为开源有助于安全，他表示“没有理由相信许多检查（开源）源码的眼睛能够成功识别允许系统安全受到的漏洞”，并声称“代码中的漏洞不是攻击的主要手段”
    [Schneider 2000]。他还声称开源排除了对构建过程的控制，尽管实践中存在这种控制——所有主要的开源程序都有一个或几个拥有声誉风险的“所有者”官方版本。Peter
    G. Neumann 讨论了“开箱”软件（源代码可见的软件），表示“开箱软件确实可以提高安全性” [Neumann 2000]。


    有时认为，如果没有源代码，系统在实际上就是通过安全的，但这是一种谬误。还有人认为，通过保持密码未知，程序就是安全的，而开放源代码会降低安全性。这完全是胡说，因为
    ASCII 导出是轻而易举的，且是已知的标准攻击技术，而且攻击者并没有突然冲动去宣布漏洞——事实上，无法确定这种漏洞是否已被多次利用。不满或受收贿的员工可以插入恶意代码，这在闭源程序中同样适用，因为组织之外的人无法审查代码。


