    IPC objects can be one of three: System V message queues, semaphore sets, and
    shared memory segments. Each object has the following attributes:


    - read and write permissions for each creator, creator group, and others

    - creator UID and GID - UID and GID of the creator of the object.

    - owning UID and GID - UID and GID of the owner of the object (initially equal
    to the creator UID).


