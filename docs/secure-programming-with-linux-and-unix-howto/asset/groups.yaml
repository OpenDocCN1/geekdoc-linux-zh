    向审计日志提供详细信息（你可以对谁能看到这些信息进行更多控制）。


    ## 6.7. 避免竞态条件


    “竞态条件”（race condition）可以定义为“由于对事件相对时间顺序产生意外之外的关键依赖而导致的异常行为” [FOLDOC]。竞态条件通常涉及一个或多个进程访问共享资源（如文件或变量），而这些访问没有经过适当的控制。


    通常情况下，进程的执行不是原子的；另一个进程可能会在两条基本指令之间中断它。如果一个安全程序的进程没有准备好这些中断，另一个进程可能会干扰该安全程序的进程。任何一对操作，在它们之间执行了另一个进程的任意代码时，都不应该发生失败。


    竞态条件问题可以从概念上分为两类：


    -   由不受信任进程引起的干扰。某些安全分类法将此类问题称为“顺序”（sequence）或“非原子”（non-atomic）条件。这些条件是由运行其他不同程序的进程引起的，这些程序在安全程序的步骤之间“插入”其他动作。这些其他程序可能是攻击者特意调用以导致该问题。本书将此类问题称为顺序问题（sequencing
    problems）。


    -   由受信任进程引起的干扰（从安全程序的角度来看）。某些分类法将其称为死锁、活锁或锁定失败条件。这些条件是由运行“相同”程序的进程激的。由于这些不同的进程可能具有“相同”的权限，如果不进行妥当控制，它们可能会以其他程序无法实现的方式相互干扰。有时这种干扰可以被利用。本书将此类问题称为锁定问题（locking
    problems）。


    ### 6.7.1. 顺序（非原子）问题


    通常情况下，你必须检查代码，查看是否存在任何一对在它们之间执行任意代码时可能导致失败的操作。请注意，加载和保存共享变量通常被实现为两个独立的操作，并且不是原子的。这意味着一个“递增变量”操作通常被转换为加载、递增和保存操作，因此如果变量内存是共享的，另一个进程可能会干扰该递增过程。


    安全程序必须确定是否应该授予请求，如果是，则对该请求执行操作。不能让不受信任的用户在程序执行操作之前更改用于该项决定的任何内容。这种竞态条件有时被称为“检查时间与使用时间”（TOCTOU）竞态条件。


    ### 6.7.1.1. 文件系统中的原子操作


    无法重复执行原子操作的问题在文件系统中经常出现。通常情况下，文件系统是许多程序使用的共享资源，某些程序可能通过其他程序对其进行干扰。安全程序通常避免使用 `access(2)`
    来确定是否应该授予请求，随后后再调用 `open(2)`，因为用户可能在这些调用之间移动文件，可能创建符号链接或他们想要的所有的文件。安全程序应该设置其有效
    ID 或文件系统 ID，然后直接进行 `open` 调用。安全地使用 `access(2)` 是可能的，但仅当用户无法影响该文件或从文件系统根目录到该路径上的任何目录时才。


    在创建文件时，你应该使用 `O_CREAT | O_EXCL` 模式打开它，并授予非常窄的权限（仅限当前用户）；你还需要准备好 `open` 失败的情况。如果你需要能够打开该文件（例如，为了防止拒绝服务），你需要重复地
    (1) 创建一个“随机”文件名，(2) 如所述打开该文件，并在 (3) 在 `open` 成功时停止重复。


    例如，“joe”文本编辑器有一个名为“DEADJOE”的符号链接漏洞。当 joe 以非标准方式退出（例如系统崩溃、关闭 xterm 或网络连接断开）时，joe
    会无条件地将其打开的缓冲区追加到文件“DEADJOE”中。这可以通过在 root 通常使用 joe 的目录中创建 DEADJOE 符号链接来利用。通过这种方式，可以使用
    joe 来向可能敏感的文件中追加垃圾内容，导致拒绝服务或无意访问。


    另一个例子是，当对文件的元信息执行一系列操作（如更改其所有者、列出文件或更改其权限位）时，首先打开文件，然后在已打开的文件上执行操作。这意味着使用 `chown()`、`fstat()`、`fchmod()`。不要使用文件名，而是使用文件描述符。这确保了你操作的是你打开的同一个文件，即使文件名在此期间被另一个进程替换或移动。


    无法重复执行原子操作的问题在文件系统中经常出现。通常情况下，文件系统是许多程序使用的共享资源，某些程序可能通过其他程序对其进行干扰。安全程序通常避免使用 `access(2)`
    来确定是否应该授予请求，随后后再调用 `open(2)`，因为用户可能在这些调用之间移动文件，可能创建符号链接或他们想要的所有的文件。安全程序应该设置其有效
    ID 或文件系统 ID，然后直接进行 `open` 调用。安全地使用 `access(2)` 是可能的，但仅当用户无法影响该文件或从文件系统根目录到该路径上的任何目录时才。


    在创建文件时，你应该使用 `O_CREAT | O_EXCL` 模式打开它，并授予非常窄的权限（仅限当前用户）；你还需要准备好 `open` 失败的情况。如果你需要能够打开该文件（例如，为了防止拒绝服务），你需要重复地
    (1) 创建一个“随机”文件名，(2) 如所述打开该文件，并在 (3) 在 `open` 成功时停止重复。


    ### 6.7.1.2. 临时文件


    正确执行原子操作的问题在创建临时文件时出现。Unix 类系统中的临时文件传统创建在 `/tmp` 或 `/var/tmp` 中，这些是所有用户共享的。攻击者的常用技巧是在你的程序运行时创建指向其他文件（例如
    /etc/passwd）的符号链接。这会导致意外的文件。


    在共享目录中创建文件的一般问题是，你必须保证在你创建文件时该文件不存在。在创建“之前”检查是不可行的，因为在检查之后、创建之前，另一个进程可以创建该文件。使用“不可预测”或“唯一”文件名也是不可行的，因为另一个进程可以反复猜测直到成功。


    从根本上说，要在共享目录中创建临时文件，你需要重复：(1) 创建一个“随机”文件名，(2) 使用 `O_CREAT | O_EXCL` 和非常窄的权限打开它，并在
    (3) 成功时停止。


    根据 1997 年的“单 Unix 规范”（SUS），创建任意文件名的优方法是 `tmpfile(3)`。`tmpfile(3)` 创建临时文件并打开相应的流，返回该流（如果失败则返回
    NULL）。遗憾的是，规范并没有保证该文件会被创建，而且我无法确保所有的实现都是安全的。当然，`tmpfile(3)` 的实现应该能够安全地创建此类文件，但很难推荐
    `tmpfile(3)`，因为始终存在库实现未能做到的可能性。这说明了一个更通用的问题：抽象（隐藏了“不必要”的细节）与安全（其中“不必要”的细节突然变得至关重要）之间的张力。如果我能
    `tmpfile(3)` 是可靠的，我会使用它，因为它是许多情况下的最简单解决方案。


    Kris Kennaway 建议通常情况下制作临时文件时使用 `mktemp(3)`。


