    -   G. 在该许可声明中，保留文档许可声明中给出的完整“不变量部分”（Invariant Sections）列表和所需的“封面文本”（Cover Texts）。


    -   H. 包含本许可的未经修改的副本。


    -   I. 保留标题为“历史记录”（History）的部分及其标题，并为其添加一个项目，说明标题页上给出的修订版本的标题、年份、新作者和发布者。如果文档中没有名为“历史记录”的部分，则创建一个该部分，说明标题页上给出的文档标题、年份、作者和发布者，并添加一个描述如前句所述修订版本的项目。


