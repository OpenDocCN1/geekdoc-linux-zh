    在理论上，catsgets 可能会稍微快一点，但对于今天的机器来说，这种提升最多是微不足道的，而且在 catsgets() 中保持唯一标识符有效的簿记工作使得
    `gettext()` 接口变得更易用。我建议使用 `gettext()`，仅仅因为它更容易使用。不过，不要完全听信我的话；请参考 GNU 关于 gettext
    的文档 info:gettext#catsgets 以获取更长且更具描述性的比较。


    特别是是 `catsget(3)` 调用（以及相关的 `setcat(3)` 调用）容易受到安全问题的威胁，因为环境变量 `NLPATH` 可被用于控制所使用的文件名。GNU
    C 库对 setuid/setgid 程序会忽略 `NLPATH`，这虽然有帮助，但不能保护运行在其他实现上的程序，也无法保护其他“看起来”不需要保护的程序（如
    CGI 脚本）。


    广泛使用的“gettext”接口至少容易受到恶意设置我的 `NLPATH` 的攻击。然而，在我看来，`LC_ALL` 或 `LC_MESSAGES` 的恶意设置很可能导致问题。此外，如果你在
    gettext 的文件 `cat-compat.c` 中使用 `binddomain()` 例程，它确实依赖于 `NLPATH`。


    ## 4.7.3. 法定值


    目前，如果你必须不可信的用户设置其所需的区域语言（locales），请确保提供的国际化信息符合严格的过滤器，仅允许合法的区域语言名称。对于用户程序（特别是
    setuid/setgid 程序），这些值将通过 `NLPATH`、`LANGUAGE` 以及其他 `LC_*` 值（特别是 `LC_MESSAGES`，但也包括
    `LC_COLLATE`、`LC_CTYPE`、`LC_MONETARY`、`LC_NUMERIC` 和 `LC_TIME`）传入。对于应用程序，这种用户请求的区域语言信息将通过
    `Accept-Language` 头部或表单值完成（应用程序应通过 `Content-Language` 头部指示返回数据的实际设置）。如果用户可以设置环境变量（即
    setuid/setgid 程序），你可以在环境变量过滤的运行时检查此值；或者作为输入过滤的一部分（例如对于 CGI 脚本）。GNU 库“glibc”对于
    setuid/setgid 程序不接受 `LANG` 的某些值（特别是任何带有 `[]` 的内容），但在过滤中发现了错误（例如，红帽在 2000 年 9 月
    1 日发布了更新以修复 glibc 中的此错误）。任何标准都不要求这种过滤，因此由你自己进行这种过滤更安全。我没有找到关于过滤语言设置的指导，因此以下是我基于对问题的个人研究提出的建议。


    首先，关于这些设置的合法值的几句话。语言设置通常使用 IETF RFC 1766 中定义的标准标签（它使用双字母国家代码作为基本标签，后跟一个由连字符分隔的可选子标签；我发现环境变量使用下划线代替它）。然而，一些人认为这不够灵活，因此可以使用三字母国家代码。此外，还有许多并不完全兼容的扩展格式，X/Open
    格式和 CEN 格式（欧洲社区标准）；我想允许这两种。典型值包括“C”（区域）、“EN”（英语）和“FR_fr”（使用法国惯例的法语）。此外，由于许多人在程序中使用许多非标准名称，已经开发了“别名”（GNU
    gettext, /usr/share/locale/locale.aliases；以及对于 X11, /usr/lib/X11/locale/locale_aliases）；这些也应该被允许。像
