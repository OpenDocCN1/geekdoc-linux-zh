    # 2.2. Security Principles


    There are many general security principles which you should be familiar with;
    consult a general text on computer security such as [Pleeeger 1997]. A few points
    are summarized here.


    Often security goals are described in terms of three overall goals:


    +   - Confidentiality (also known as secrecy), meaning that the computing system’s
    assets are accessible only by authorized parties.

    - Integrity, meaning that the assets can only be modified by authorized parties
    in authorized ways.

    - Availability, meaning that the assets are accessible to the authorized parties
    in a timely manner (as determined by the systems requirements). The failure to
    meet this goal is called a denial of service.


    Some people define additional security goals, which others lump those additional
    goals as special cases of these three goals. For example, some separately identify
    non-repudiation as a goal; this is the ability to “prove” that a sender or receiver
    received a message, even if the sender or receiver wishes to deny it. Privacy
    is sometimes addressed separately from confidentiality; some this as protecting
    the confidentiality of a user (e.g., their identity) instead of the data. Most
    goals require identification and authentication, which are sometimes listed as
    a separate goal. Often auditing (“access control” and “authenticity”) are listed
    separately as well. In any case, it is important to identify your program’s overall
    security goals, no matter how you group those goals together, so that you’ll know
    when you’ve met them.


    Sometimes these goals are a response to a known set of threats, and sometimes
    of these goals are required by law. For example, for U.S. banks and other financial
    institutions, there’s a privacy law called the “Gramm-Leach-Biley (GLB) Act. This
    law mandates disclosure of personal information shared and means of securing data,
    requires disclosure of personal information that will be shared with three parties,
    and directs institutions to give customers a chance to opt out of data sharing.
    [Jones 2000]'
