    可用于跟踪用户，从而产生隐私问题。此外，许多用户禁用 cookies，因此 Web 应设计为不需要使用 cookies。由于并非所有 浏览器都能正确传递此类信息（且并非所有用户都正确配置浏览器），这种方法比你想象的要少。这种输入检查对于安全来说是没用的，因为攻击者可以直接向服务器发送“非法”值。通常情况下，服务器必须进行检查。更多信息请参见第
    6.8 节。


    ## 4.6. 其他输入


