    ## 8.3. Handle Full/Unresponsive Output


    It may be possible for a user to clog or make unresponsive a secure program''s
    output channel back to that user. For example, a web browser could be intentionally
    halted or have its TCP/IP channel response slowed. The secure program should handle
    such cases, in particular it should release locks quickly (preferably before replying)
    so that this will not create an opportunity for a Denial-of-Service attack. Always
    place timeouts on outgoing network-oriented write requests.


    ## 8.4. Control Data Formatting (“Format Strings”)


    A number of output routines in computer languages have a parameter that controls
    the generated format. In C, the most obvious example is the printf() family of
    routines (including print(), sprintf(), sprintf(), fprintf(), and so on). Other
    examples in C include syslog() (which writes system log information) and settitle()
    (which sets the string used to display process identifier information). Many functions
    with names beginning with “err” or “warn”, containing “log”, or ending in “printf”
    are worth considering. Python includes the “% operation, which on strings formatting
    in a similar manner. Many programs and libraries define formatting functions,
    often by calling routines and adding additional processing (e.g., glib''s g_snprintf()
    routine).


    Surprisingly, many people seem to forget the power of these formatting capabilities
    and use data from untrusted users as the formatting parameter. Never use unfiltered
    data from an untrusted user as the formatting parameter. Perhaps this is best
    shown by example:


    ```

    /* Wrong ways: */

    printf(string_from_untrusted_user);

    /* Right ways: */

    printf("%s %d", string_from_untrusted_user); /* or just */

    fputs(string_from_untrusted_user);

    ```


    Otherwise, an attacker can cause sorts of mischief by carefully selecting the
    formatting string. A case of C''s printf() is a good example - there are lots
    of ways to exploit user-controlled format strings in printf These include buffer
    overflows by creating a formatting string (that can result in complete control
    over the program), conversion specifications that use unused parameters (causing
    unexpected data to be inserted), and creating formats which produce totally unanticipated
    values (by prepending or appending awkward data, causing problems in later). Note
    that a particularly nasty case is printf''s %n conversion, which writes the number
    of characters written so far into the pointer argument; using this, an attacker
    can overwrite a value that was intended for printing! An attacker can even overwrite
    almost arbitrary locations, the attacker can specify a "parameter" that wasn''t
    actually passed. Since in many cases the results are sent back to the user, this
    attack can also be used to expose internal information about the stack. This information
    can then be used to circumvent protection systems such as StackGuard; StackGuard
    uses constant "canary" to detect attacks, but if the stack''s contents can be
    displayed, the current value of the canary will be exposed and made vulnerable.


    A formatting string should always be a constant string, possibly involving a function
    call to de-internationalization.


    ## 8.5. Control Character Encoding in Output


    In general, a secure program must ensure that it synchronizes its clients. One
    issue impacting web applications is that they forget to specify the character
    encoding. This opens the door for cross-site attacks.

