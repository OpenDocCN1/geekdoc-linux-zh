    本书不是并不是关于编写程序的完整教程，因此我跳过了广泛存在的进程处理信息。你可以查看 `wait(2)`、`exit(2)` 等类的文档以获取更多信息。


    ## 3.1.2. POSIX 能力


    POSIX 能力是一组位，允许将 root 用户拥有的权限拆分为一组更广泛、更具体的权限。POSIX 能力由一份 IEEE 草案标准定义；它们并非 Linux
    特有，但也没有被其他 Unix 类系统普遍支持。Linux 内核 2.0 不支持 POSIX 能力，而 2.2 版本增加了对进程的 POSIX 能力的支持。当
    Linux 文档（包括本手册）说“需要 root 权限”时，在几乎所有情况下实际上是指“需要某种能力”，正如能力文档中所述的那样。如果你需要知道所需的特定能力，请查询能力文档。


    在 Linux 中，最终意图是允许将能力附加到文件系统中的文件；但在编写时，这尚未被支持。支持传输能力，但默认是禁用的。Linux 2.2.11 版本增加了一个让能力更实用的功能，称为“能力边界集”（capability
    bounding set）。


    能力绑定集是允许系统上任何进程持有的能力列表（否则，只有特殊的 init 进程可以持有它）。如果某个能力没有出现在绑定集中，那么无论权限多高，任何进程都无法使用它。该功能可以用于，例如禁用内核模块加载。一个利用此特性的示例工具是
