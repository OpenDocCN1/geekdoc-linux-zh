    of unspecified character encoding fairly well, so I quote it here:


    Many web pages leave the character encoding ("charset") parameter in HTTP undefined.
    In earlier versions of HTML and HTTP, the character encoding was supposed to default
    to ISO-8859-1 if it wasn''t defined. In fact, many browsers had a different default,
    so it was not possible to rely on the default being ISO-8859-1. HTML version 4
    legitimizes this - if the character encoding isn''t specified, any character encoding
    can be used.


    If the web server doesn''t specify which character encoding is in, it can tell
    which characters are special. Web pages with unspecified character encoding work
    most of the time because character set assigns the same characters to byte values
    below 128. But which of the values above 128 are special? Some 16-bit character-encoding
    schemes add multi-byte representations for special characters such as "<". Some
    browsers recognize this alternative encoding and act on. It is "correct" behavior,
    but it makes attacks using malicious scripts much harder to prevent. The server
    simply doesn''t know which byte sequences represent the special characters.


    For example, UTF-7 provides alternative encoding for "<" and `>`, and several
    popular browsers recognize these as the start and end of a tag. This is not a
    bug in those browsers. If the character encoding is really UTF-7, then this is
    the correct behavior. But it is possible to get into a situation in which the
    browser and the server disagree on the encoding.


    Thankfully, though explaining the issue is tricky, its resolution in HTML is easy.
    In HTML header, simply specify the charset, like this example from CERT:


    ```

    <HTML>

    <HEAD>

    <META http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">

    <TITLE>HTML SAMPLE</TITLE>

    </HEAD>

    <BODY>

    <P>This is a sample HTML page</P>

    </BODY>

    ```


