    这是 GNOME 方法方法的一个优势，因为至少在某些系统上，`tempnam(3)` 是自动运行的，而 `mkstemp(3)` 方法则需要更多代码来实现此功能。请不要为临时目录创建更多的环境变量（例如
    `TEMP`），特别是不要为每个应用程序创建不同的环境名称（例如，不要创建 "MYAPP_TEMP"）。这样做会增加系统管理的复杂度，用户可以仅为特定的执行设置环境变量。当然，如果这些环境变量可能是由不可信源设置的，你应该忽略它们——如果你遵循了第
    4.2.3 节的建议，你这样做会这样做。


    如果临时目录是通过 NFS 版本 2 (NFSv2) 远程挂载的，这些技术将不起，因为 NFSv2 不支持支持 `O_EXCL`。更多信息请参阅第 6.7.1
    节。NFS 版本 3 及更高版本正确支持 `O_EXCL`；简单的解决方案是确保临时目录是本地的，或者如果使用 NFS 挂载，请使用 NFS 版本 3 或更高版本。在
    NFS v2 上安全创建临时文件有一种技术，涉及使用 `link(2)` 和 `stat(2)`，但它很复杂；请参见第 6.7.2.1 节获取更多信息。


    顺带提一下，值得注意的是 FreeBSD 最近更改了 `mk*temp()` 系列，删除了文件名中的 PID 组件，并用 base-62 编码的随机数替换了整个部分。这极大地减少了默认使用
    6 个 X 情况下可能的临时文件数量，这意味着即使是带有 6 个 X 的 `mkstemp(3)`，在极高频率使用的情况下，在概率上也是防猜猜的。然而，如果你也遵循这里的指南，你将消除他们正在解决的问题。


    关于临时文件的许多信息部分源于 Kris Kennaway 在 2000 年 12 月 15 日在 Bugtrap 文件上的帖子（http://flw.net/2000/1221/a/sec-tmp.php）。


    ## 6.7.2. 锁


    通常情况下，程序必须对某些内容拥有独占权限（例如：文件、设备和/或特定服务器的存在）。


    # 第 6 章 程序的内部结构与方法


    系统锁资源必须处理锁的标准问题，即死锁（“致命拥抱”）、活锁，以及在程序未清理锁的情况下释放“卡住”的锁。如果程序互相等待释放资源，就会发生死锁。例如，如果进程
    1 锁住资源 A 并等待资源 B，而进程 2 锁住资源 B 并等待资源 A，就会发生死锁。许多死锁可以通过要求所有进程按相同的顺序锁定多个资源（例如，按锁名称字母顺序）来防止。


    ## 6.7.2.1. 使用文件作为锁


    在类 Unix 系统上，传统的锁机制是通过创建一个文件来表示锁的，因为这具有良好的移植性。这也使得“修复”锁变得容易，因为管理员只需要查看文件系统即可设置了哪些锁。卡住的锁可能是因为程序未能自行清理（例如，崩溃或发生故障），或者因为整个系统崩溃。请注意，这些是“建议性”锁（而非“强制性”锁）——所有使用该资源的进程都必须协作使用这些锁。


    然而，有几个陷阱需要避免。首先，不要使用非常老旧 Unix 程序使用的技术，即调用 `create()` 或其等价的 `open()` 模式 `O_WRONLY
    | O_CREAT | O_TRUNC`，并将文件模式设置为 0（无权限）。对于普通文件系统上的普通用户，这行之有效，但当用户已存在时，这种方法无法锁定文件。root
    用户始终可以执行此操作，即使文件已经存在也是。事实上，Unix 的旧版本在旧版编辑器 "ed" 中就有这个特定问题——症状是密码文件的部分偶尔会被放在用户文件中
    [Roschkind 1985, 22!]。相反，如果你在为本地文件系统上的进程创建锁，你应该使用带有 `O_WRONLY | O_CREAT | O_EXCL`
    标志的 `open()`（同样，不要设置权限，以便相同所有者的进程不会获得锁）。请注意 `O_EXCL` 的使用，这是创建“独占”文件的官方方法；这在本地文件系统上对
    root 用户也有效。[Roschkind 1985, 27]。


    其次，如果锁文件可能位于 NFS 挂载的文件系统上，你就会遇到 NFS 版本 2 不完全支持标准文件语义的问题。这对于本应是“本地”的工作来说甚至可能是一个问题，因为某些客户端没有本地磁盘，所有文件都通过
    NFS 远程挂载。`open(2)` 的手册解释了在这种情况下如何处理（这也处理了 root 程序的情况）：


    “依赖 [open(2) 的 O_CREATE 和 O_EXCL 标志] 来执行锁任务的程序将包含一个竞态任务。使用锁文件执行原子锁的解决方案是在相同文件系统上创建一个唯一文件（例如，结合主机名和
    pid），使用 `link(2)` 创建锁文件的链接，并在唯一文件上使用 `stat(2)` 检查其链接计数是否增加到 2。不要这样做。”

