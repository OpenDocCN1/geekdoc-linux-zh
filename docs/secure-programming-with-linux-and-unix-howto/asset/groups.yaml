    modified to "white out" words at critical locations, deface its appearance, or
    insert new text. External DTDs could be modified to prevent use of the document
    (by adding declarations that break validation) or insert different text into documents
    [St. Laurent 2000].


    ## 6.9. Use Internal Consistency-Checking Code


    The program should check to ensure that its call arguments and basic state assumptions
    are valid. In C, macros such as assert(3) may be helpful in doing so.


    ## 6.10. Self-limit Resources


    In network daemons, shed or limit excessive loads. Set limit values (using setrlimit(2))
    to limit the resources that will be used. At the least, use setrlimit(2) to disable
    creation of “core” files. For example, by default Linux will create a core file
    that saves all program memory if the program fails abnormally, but such a file
    might include passwords or other sensitive data.


    ## 6.11. Prevent Cross-Site Malicious Content


    Some secure programs accept data from one untrusted user (the attacker) and pass
    that data on to a user’s application (the victim). If the secure program doesn’t
    protect the victim, the victim’s application (e.g., their web browser) may then
    process data in a way harmful to the victim. This is a common problem for web
    applications using HTML or XML, where the problem goes by several names including
    “cross-site scripting,” “malicious HTML tags,” and “malicious content.” This book
