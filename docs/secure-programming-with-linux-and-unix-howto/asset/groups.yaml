    normal login sequence, and since currently normal users can change the LEDs, the
    LEDs can currently be used to confirm a trusted path. When handling a password
    over a network, encrypt it between trusted endpoints.


    Arbitrary email (including the "from" value of addresses) can be forged as well.
    Using digital signatures is a method to thwart many such attacks. A more easily
    thwarted approach is to require emailing back and forth with special randomly-created
