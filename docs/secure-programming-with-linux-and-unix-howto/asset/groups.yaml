    - Martin Pool (mad@students.edu)

    - Jorge Gogoy (scott@silverjhu.edu)

    - Michael Kerr (patrick@compsoc.man)

    - John Levon (moz@odin.org)

    - Ryan McCabe (paul@astro.ac.uk)

    - Paul Phillips (cdp@peak.com)

    - Eric S. Raymond (mbp@humbug.org)

    - Marc Welz (esr@snark.com)

    - Eric (werme@alpha.deccom)


    如果你想出现在此列表中，请向 dwheeler@dwheeler.com 向我发送建设性建议。如果你给我提供了建设性建议但不想署名，请在发送评论或批评时告诉我；通常我预想人们想要署名，我也想给予他们这种荣誉。我目前的流程是将贡献者的姓名添加到文档的此列表中，并在
    ChangeLog（在线可用）中对他们的评论进行更详细的说明。注意，尽管这些人发送了想法，但实际文本是我的，所以不要将仍然存在的任何错误归咎于他们。相反，请向我反馈。


