    # Chapter 2. Background


    Such programs are invoked indirectly via a web server, which filters out some
    attacks but nevertheless leaves many attacks that must be withstood.


    +   - Applets (i.e., programs downloaded to the client for automatic execution).
    This is something Java is especially famous for, though other languages (such
    as Python) support mobile code as well. There are several security viewpoints
    here; the implementor of the applet infrastructure on the client side has to make
    sure that the only operations allowed are "safe" ones, and the writer of an applet
    has to deal with the problem of hostile hosts (in other words, you can''t trust
    the client). There is some research attempting to deal with running applets on
    hostile hosts, but frankly I''m sceptical of the approaches and such is exotic
    I don''t cover it further.

    - setuid/setgid programs. These programs are invoked by a local user and, when
    executed, immediately granted the privileges of the program''s owner and owner''s
    group. In many ways these are the hardest programs to secure, because many of
    their inputs are under the control of the untrusted user and some of their inputs
    are not obvious.


    This book merges the issues of these different types of program into a single
    set. The disadvantage of this approach is that some of the issues identified here
    do not apply to all types of programs. In particular, setuid/setgid programs have
    many surprising inputs and several of the guidelines here only apply to them.
    However, things are not clear-cut, because a particular program may cut across
    these boundaries (e.g., a CGI script may be setuid or setgid, or be configured
    in a way that has the same effect), and some programs are divided into several
    executables each of which can be considered a different "type" of program. The
    advantage of considering all of these program types together is that we can consider
    all issues without trying to apply an inappropriate category to a program. As
    be seen, many of the principles apply to all programs that need to be secure.


    There is a slight bias in this book towards programs written in C, with some notes
    on other languages such as C++, Perl, Python, Ada95, and Java. This is because
    C is the most common language for implementing secure programs on Unix-like systems
    (other than CGI scripts, which tend to use Perl), and all other languages'' implementations
    call the C library. This is not to imply that C is somehow the "best" language
