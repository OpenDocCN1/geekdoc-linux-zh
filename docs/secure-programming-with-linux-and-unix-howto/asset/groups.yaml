    # Chapter 6. Structure Program Internals and Approach


    system locks resources must deal with the standard problems of locks, namely,
    deadlocks (“deadly embraces”), livelocks, and releasing “stuck” locks if a program
    doesn''t clean up its locks. A deadlock can occur if programs are waiting for
    each other to release resources. For example, a deadlock would occur if process
    1 locks resources A and waits for resource B, while process 2 locks resource B
    and waits for resource A. Many deadlocks can be prevented by simply requiring
    all processes to lock multiple resources in the same order (e.g., alphabetically
    by lock name).


    # 6.7.2.1. Using Files as Locks


    On Unix-like systems locking has traditionally been done by creating a file to
    indicate a lock, because this is very portable. It also makes it easy to “fix”
    locks, because an administrator can just look at the filesystem to see what locks
    have been set. Stuck locks can occur because the program failed to clean up after
    itself (e.g., it crashed or malfunctioned) or because the whole system crashed.
    Note that these are “advisory” (not “mandatory”) locks - all processes the resource
    must cooperate to use these locks.


    However, there are several traps to avoid. First, don''t use the technique used
    by very old Unix programs, which is calling create() or its open equivalent, the
    open() mode O_WRONLY | O_CREAT | O_TRUNC, with the file mode set to 0 (no permissions).
    For normal users on normal file systems, this works, but this approach fails to
    lock the file when the user already exists. Root can always perform this operation,
    even when the file already exists. In fact, old versions of Unix had this particular
    problem in the old editor “ed” – the symptom was that occasionally portions of
    the password file would be placed in user’s files [Roschkind 1985, 22!]! Instead,
    if you''re creating a lock for processes that are on the local filesystem, you
    should use open() with flags O_WRONLY | O_CREAT | O_EXCL (and again, no permissions,
    so that processes with the same owner won''t get the lock). Note the use of O_EXCL,
    which is the official way to create “exclusive” files; this works even for root
    on a local filesystem. [Roschkind 1985, 27].


    Second, if the lock file may be on an NFS-mounted filesystem, then you have the
    problem that NFS version 2 doesn''t completely support normal file semantics.
    This can


    112'
