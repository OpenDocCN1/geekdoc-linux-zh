  - '[PAGE 46]


    Permitting user control over dynamically linked libraries would be disastrous
    for setuid setgid programs if special measures weren''t taken. Therefore, the
    GNU glibc implementation, if the program is setuid or setgid these variables (and
    other similar variables) are ignored or greatly limited in what they can do. The
    GNU glibc library determines if a program is setuid or setgid by checking the
    program''s credentials; if the uid and eid differ, or the gid and eg differ, the
    library presumes the setuid/setgid (or descended from one) and therefore limits
    its abilities to control linking. If you load the GNU glibc libraries, you can
    see this; especially the files elf/rtld.c and sysdeps/generic/dl-sysdep.c. This
    means that if you cause the uid and gid to equal the eid and gid, and then call
    a program, these variables will have full effect. Other Unix-like systems handle
    the situation differently for the same reason: a setuid/setgid program should
    not be unduly affected by the environment variables.


    For Linux systems, you can get more information from my document, the Program
    Library HOWTO (http://www.dwheeler.com/program-library).


    # 3.8. Audit


    Different Unix-like systems handle auditing differently. In Linux, the most common
    “audit” mechanism is syslogd(8), usually working in conjunction with klogd(8).
    You might also want to look at wtmp(5), utmp(5), lastlog(8), and acct(2). Some
    server programs (such as the Apache web server) also have their own audit trail
    mechanisms. According to the FHS, audit logs should be stored in /var/log or its
    subdirectories.


    # 3.9. PAM


    Sun Solaris and nearly all Linux systems use the Pluggable Authentication Modules
    (PAM) system for authentication. PAM permits run-time configuration of authentication
    methods (e.g., use of passwords, smart cards, etc.). See Section 10.5 for more
    information on using PAM.'
