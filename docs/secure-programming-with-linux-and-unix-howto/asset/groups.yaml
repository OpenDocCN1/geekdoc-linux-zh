    # 协议


    通常，加密算法和协议对于保持系统安全是必要的，特别是当通过互联网等不可信网络进行通信时。在可能的情况下，请使用会话加密来防止会话劫持并隐藏身份验证信息，同时支持隐私。


    关于背景信息和代码，你可能应该查看经典著作《应用密码学》（[Schneier 1996]）。新闻组“sci.crypt”有一系列常见问题解答（FAQ）；你可以在许多地方找到它们，包括
    http://www.landfield.com/faqs/cryptography-faq。针对 Linux 的特定资源包括位于 http://marc.mutz.com/Encryption-HOWTO/
    的 Linux 加密 HOWTO。关于协议如何使用基本算法的讨论，可以在 [Opplinger 1998] 中找到。这里介绍的只是几条注释；这些领域相当专业，且在其他地方有所涵盖。


    值得注意的是，加密算法涉及许多法律障碍。首先，许多国家对加密算法实现方案的使用、出口和/或进口有限制。其次，许多算法拥有专利；即使所有者目前许可“免费使用”，但如果没有签署合同，他们以后可能会改变主意。如今，只要你知道注意这一点，大多数专利问题都可以被轻松避免，因此没有理由让自己陷入这类问题中。


    加密协议和算法很难做到正确，因此**不要创建你自己的**。除非你是密码学专家，清楚自己在做什么，并且计划花费数年对该算法进行专业审查，否则请使用现有的加密算法。创建（良好的）加密算法仅是专家的任务。


    对于协议，请尝试使用标准格式的协议，如 SSL（即将变为 TLS）、SSH、IPSec、PGP/PG 和 Kerberos。其中许多协议在功能上有所重叠，但每个都有自己的“专长”利基市场。SSL（即将变为
    TLS）是保护 http（网页）事务的首要方法。PGP 兼容协议（在 PGP 和 GnuPG 中实现）是保护电子邮件端端安全的主要方法。Kerberos 是在局域网（LAN）上保护和支持身份验证的主要方法。SSH
    是通过互联网保护“远程终端”的主要方法，例如类似 telnet 和 X 窗口的连接，尽管它经常被用于保护其他数据流（如 CVS 访问）。IPSec 是保护底层数据包和“所有”数据包的主要方法，因此它对于保护私网络和远程机器特别有用。


    对于对称密钥（块）加密算法，请仅使用已公开发布并经受了多年攻击的加密算法，并检查它们的专利状态。对于加密不重要的数据，旧的 DES（56 位密钥）算法仍有一定的价值，但在现代硬件下它太容易破解了。对于许多应用，三重
    DES（triple-DES）目前是最佳加密算法；它具有相当长的密钥（112 位），且没有抵御攻击的问题。AES 算法可能值得使用，一旦它被证明有效，你应该准备好切换到它（它比三重
    DES 快得多）。Twofish 是另一种优秀的加密算法。由于专利问题，你应该避免使用 IDEA（它受美国和欧洲专利保护），但我并不清楚它存在任何严重的技术问题。无论如何，你的协议都应该支持多种加密算法；这样，当某个算法被破解时，用户可以切换到另一种。


    对于公钥加密（用于其他用途，如身份验证和签名密钥），只有五种广泛部署的算法。最常用的算法之一是 RSA；RSA 算法拥有专利，但仅限在美国，且该专利已于 2000
    年 9 月过期。Diffie-Hellman 密钥交换算法被广泛用于允许双方约定会话密钥。它本身并不能保证双方是他们所声称的身份，也不能保证没有中间人，但它确实极有助于防御被动监听者；其专利已于
    1997 年过期。NIST 开发了数字签名标准（DSS），它是对 ElGamal 加密系统的修改，用于数字签名的生成和验证；其开发的条件之一是免专利的。


    10.5 使用 PAM


    可插式认证模块（PAM）是一种用于验证用户的灵活机制。许多 Unix 系统支持 PAM，包括 Solaris、Red Hat、Caldera 和 FreeBSD。通过使用
    PAM，你可以实现独立的.............................


    10.6 工具






    仅使用工具...........................


    '
