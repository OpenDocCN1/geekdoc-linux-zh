    # Chapter 3. Summary of Linux and Unix Security Features


    slightly different sets of access control attributes and access controls can be
    affected by options selected at mount time. On Linux, the ext2 filesystem is currently
    the most popular filesystem, but Linux supports a vast number of filesystems.
    Most Unix-like systems tend to support multiple filesystems too.


    Most filesystems on Unix-like systems store at the following:


    +   - owning UID and GID identifies the "owner" of the filesystem object. Only
    the owner or root can change the access attributes unless otherwise noted.


    +   - permission bits - read, write, execute bits for each user (owner), group,
    and other. For ordinary files, read, write, and execute their typical meanings.
    In directories, the "read" permission is necessary to display a directory''s contents,
    while the "execute" permission is sometimes called "search" permission and is
    necessary to actually enter the directory to use its contents. In a directory
    "write" permission on a directory permits adding, removing, and renaming files
    in that directory; if you only want to permit adding, set the sticky bit below.
    Note that the permission values of symbolic links are never used; it''s only the
    values of the containing directories and the linked-to-file matter.


    +   - "sticky" bit - when set on a directory, unlinks (removes) and renames of
    files in directory are limited to the file owner, the directory owner, or root
    privileges. This is a very common Unix extension and is specified in the Open
    Group''s Single Unix Specification version 2. Old versions of Unix called the
    "save program text" bit and used this to indicate executable files that should
    stay in memory. Systems that did this only root could set this bit (otherwise
    users could have crashed systems by forcing "everything" into memory). In Linux,
    this bit has no effect on ordinary files and ordinary users can modify this bit
    on the files they own: Linux''s virtual memory management makes this use irrelevant.


    +   - setuid, setgid - when set on an executable file, executing the file will
    set the process'' effective UID or effective GID to the value of the file''s owning
