    ## 2.5. 谨慎是一种美德


    编写安全程序的主要困难在于，编写它们需要一种不同的思维方式，简而言之，一种谨慎的思维。原因是错误（也称为缺陷或漏洞）的影响可能完全不同。非安全程序有很多错误。虽然这些错误是不受欢迎的，但它们通常涉及罕见或异常的情况，如果用户偶然遇到，他们会尝试使用工具。


    在安全程序中，情况反过来了。某些用户会故意寻找并引发罕见或异常的情况，希望这种攻击能赋予他们未经授权的权限。因此，编写安全程序时，谨慎是一种美德。


    ## 2.6. 我为什么要写这本书？


    有人问我“为什么要写这本书？”我的回答是：在过去的几年里，我注意到许多 Linux 和 Unix 开发者似乎不断陷入同样的安全陷阱。审计人员慢慢发现问题，但如果从一开始就不引入这些问题会更好。我认为部分问题在于，没有单一、明显的地方可以让开发者获取避免陷阱的信息。这些信息是公开的，但往往难以找到、过时、不完整或有其他问题。大多数此类信息根本没有讨论
    Linux，尽管它正在被广泛使用！这引出了答案：我开发这本书是希望未来的开发者不要重复过去的错误，从而产生更安全的系统。你可以在这里看到更深入讨论：


    http://www.linuxsecurity.com/feature_stories/feature_story-6.html.


