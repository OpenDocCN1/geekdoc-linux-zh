    # Protocols


    Often cryptographic algorithms and protocols are necessary to keep a system secure,
    particularly when communicating through an untrusted network such as the Internet.
    Where possible, use session encryption to foil session hijacking and hide authentication
    information, as well as to support privacy.


    For background information and code, you should probably look at the classic text
    "Applied Cryptography" [Schneier 1996]. The newsgroup "sci.crypt" has a series
    of FAQ’s; you can find them at many locations, including http://www.landfield.com/faqs/cryptography-faq.
    Linux-specific resources include the Linux Encryption HOWTO at http://marc.mutz.com/Encryption-HOWTO/.
    A discussion on how protocols use the basic algorithms can be found in [Opplinger
    1998]. What follows here is just a few comments; these areas are rather specialized
    and covered elsewhere.


    It''s worth noting that there are many legal hurdles involved with cryptographic
    algorithms. First, the use, export, and/or import of implementations of encryption
    algorithms are restricted in many countries. Second, a number of algorithms are
    patented; even if the owners permit “free use” at the moment, without a signed
    contract they can change their minds later. Most of the patent issues can be easily
    avoided nowadays, once you know to watch out for it, so there’s little reason
    to subject yourself to the problem.


    Cryptographic protocols and algorithms are difficult to get right, so do not create
    your own. Instead, use your own encryption algorithms unless you are an expert
    in cryptology, know what you’re doing, and plan to spend years in professional
    review of the algorithm. Creating encryption algorithms (that are good) is a task
    for experts only.


    For protocols, try to use standard-forming protocols such as SSL (soon to be TLS),
    SSH, IPSec, PGP/PG, and Kerberos. Many of these overlap somewhat in functionality,
    but each has a “specialty” niche. SSL (soon to be TLS) is the primary method for
    protecting http (web) transactions. PGP-compatible protocols (implemented in PGP
    and GnuPG) are a primary method for securing email end-to-end. Kerberos is a primary
    method for securing and supporting authentication on a LAN. SSH is the'
  - '[PAGE 156]


    primary method of securing "remote terminals" over an internet, e.g., telnet-like
    and X windows connections, though it''s often used for securing other data streams
    (such as CVS accesses). IPSec is the primary method for securing lower-level packets
    and "all" packets, so it''s particularly useful for securing private networks
    and remote machines.


    For secret key (bulk) encryption algorithms, use only encryption algorithms that
    have been openly published and withstood years of attack, and check on their patent
    status. For encrypting unimportant data, the old DES (56-bit key) algorithm has
    some value, but with modern hardware it''s too easy to break. For many applications
    triple-DES is currently the best encryption algorithm; it has a reasonably lengthy
    key (112 bits), without issues of withstanding attacks. The AES algorithm may
    be worth it as using, once it''s proven, and you should be prepared to switch
    to it (it''s much faster than triple-DES). Twofish is another excellent encryption
    algorithm. You should avoid IDEA to patent issues (it''s subject to U.S. and European
    patents), but I''m unaware of any serious technical problems with it. Your protocol
    should support multiple encryption algorithms, anyway; that way, when an algorithm
    is broken, users can switch to another.


    For public key cryptography (used, other things, for authentication and signing
    keys), there are only five widely-deployed algorithms. One of the most widely-used
    algorithms is RSA; RSA''s algorithm was patented, but only in the U.S., and that
    patent expired in September 2000. The Diffie-Hellman key exchange algorithm is
    widely used to permit two parties to agree on a session key. By itself it doesn''t
    guarantee that the parties are who they say they are, or that there is no middleman,
    but it does strongly help defend against passive listeners; its patent expired
    in 1997. NIST developed the digital signature standard (DSS) it is a modification
    of the ElGamal cryptystem for digital signature generation and verification; one
    of the conditions for its development was for it to be patent-free.


    Some programs need a one-way hash algorithm, that is, function that takes "arbitrary"
    amount of data and generates a fixed-length number that hard to invert (e.g.,
    it''s difficult for an attacker to create a different set of data to generate
    that same value.


    For a number of years MD5 has been a favorite, but recent efforts have shown that
    its 128-bit length may not be enough [van Oorschort 1994] and that certain attacks
    weaken MD5''s protection [Dobbertin 1996]. Indeed, there are rumors that a top
    industry'
  - '[PAGE 157]


    cryptographer has broken MD5, but is bound by employee agreement to keep silent

    (see the Bugraq 22 August 2000 posting by John Viega). Anyone can create a rumor,

    but enough weaknesses have been found that the idea of completing the break is

    ausible. If you''re writing new code, you probably ought to use SHA-1 instead.


    In a related note, if you must create your own communication protocol, examine
    the

    problems of what''s gone on. Classics such as Bellovin [1989]''review of

    security problems in the TCP/IP protocol suite might help you, as well as Bruce

    Schneider [1998] and Mudge''s breaking of Microsoft''s PPTP implementation and
    their

    follow-on work. Of course, be sure to give any new protocol widespread review,
    and

    reuse you can.


    # 10.5. Using PAM


    Pluggable Authentication Modules (PAM) is a flexible mechanism for authenticating

    users. Many Unix-like systems support PAM, including Solaris, nearly all Linux

    distributions (e.g., Red Hat Linux, Caldera, and Debian as of version 2.2), and

    FreeBSD as of version 3.1. By using PAM, your program can be independent of the

    authentication scheme (passwords, SmartCards, etc.). Basically, your program calls

    PAM, which at run-time determines “authentication modules” are required by

    checking the configuration set by the local system administrator. If you''re writing
    a

    program that requires authentication (e.g., entering a password), you should include

    support for PAM. You can find out more about the Linux-PAM project at

    http://www.kernel.org/pub/linux/pam/index.html.


    # 10.6. Tools


    Some tools may help you detect security problems before you field the result.
    If you''re

    building a common kind of product where many standard potential flaws exist (like
    an

    ft server or firewall), you might find standard security scanning tools. One good

    one is Nessus (http://www.nessus.org); there are many others. Of course, running
    a

    “secure” program on an insecure platform configuration makes little sense; you
    may'
  - '[PAGE 158]


    want to examine handling systems such as Bastille available at

    http://www.bastille-linux.org.


    You may find some auditing tools helpful for finding potential security flaws.
    Here are

    a few:


    +   * ITS4 from Cital (formerly Reliable Software Technologies, RST) statically
    checks C/C++ code. ITS4 works by performing pattern-matching on source code, looking
    for patterns known to be possibly dangerous (e.g., function calls). It is available
    free for non-commercial use, using its source code and with certain modification
    and redistribution rights. One warning: the tool''s licensing claims can be initially
    misleading. Cital claims ITS4 is “open source” but, in fact, its license does
    not meet the Open Source Definition (http://www.opensource.org/osd.html) (OSD).
    In particular, ITS4''s license fails point 6, which forbids “non-commercial use
    only” clauses in open source licenses. It is unfortunate that C insists on using
    the term “open source” to describe their license. ITS4 is a fine tool, released
    under a fairly generous license for commercial software, yet using this way can
    give the appearance of a company trying to gain the cache of “open source” without
    actually being open source. Cital says that they simply don''t accept the OSD
    definition and that they wish to use a different definition instead. Nothing legally
    prevents this, but the OSD definition is used by over 5000 software projects (at
    least those hosted by SourceForge http://www.sourceforge.net), Linux distributors,
    Netscape (now AOL), the W3C, journalists (such as the Economist), and many other
    organizations. Most programmers don''t want to wade through license agreements,
    so using this other definition can be confusing. I do not believe Cital has any
    intention to mislead; they''re a reputable company with very reputable and honest
    people. It''s unfortunate that this particular position of their leads (in opinion)
    to unnecessary confusion. In any case, ITS4 is available at http://www.rstcorp.com/its4.


    +   * LCLint is for statically checking C programs. With minimal effort, LCLint
    can be used as a better lint. If additional effort is invested adding annotations
    to programs, LCLint can perform stronger checking than can be done by any standard
    lint. The software is licensed under the GPL and is available from http://lclint.cs.virginia.edu.'
