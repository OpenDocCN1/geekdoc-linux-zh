    位，这显然是一种安全的方法。大多数现代 SysVr4 和 BSD 4 版本使用不同的方法来避免内核竞态条件。在这些系统上，当内核传递 set-id 脚本的名字来打开解释器时，而不是使用路径（这将允许竞态条件），而是传递文件名
