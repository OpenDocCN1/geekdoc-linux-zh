    On all Unix-like systems, the primary repository of information is the file tree,
    rooted

    at "/. The file tree is a hierarchical set of directories, each of which may contain

    filesystem objects (FSOs).


    In Linux, filesystem objects (FSOs) may be ordinary files, directories, symbolic
    links,

    named pipes (also called first-in-outs or FIFOs), sockets (see below), character

    special (device) files, or block special (device) files (in Linux, this list is
    given in the

    find(1) command. Other Unix-like systems have an identical or similar list of
    FSO

    types.


    Filesystem objects are collected on filesystems, which can be mounted and unmounted

    directories in the file tree. A filesystem type (e.g., ext2 and FAT) is a specific
    set of

    conventions for arranging data on the disk to optimize speed, reliability, and
    so on;

    many people use the term "filesystem" as a synonym for the filesystem type.


