    +   4. Avoid using static field variables. Such variables are attached to the
    class (not class instances), and can be located by any other class. As a result,
    static field variables can be found by any other class, making them more difficult
    to secure.


    +   5. Never return a mutable object to potentially malicious code (since the
    code may decide to change it). Note that arrays are mutable (even if the array
    contents aren''t), so don''t return a reference to an internal array with sensitive
    data.


    +   6. Never store given mutable objects (including arrays of objects) directly.
    Otherwise, the user could hand the secure code, "check" the object, and change
    the data while the secure code was trying to use the data. Clone arrays before
    saving them, and be careful here (e.g., beware of user-written cloning routines).


    +   7. Don''t depend on initialization. There are several ways to allocate uninitialized
    objects.


    +   8. Make everything final, unless there''s a good reason not to. If a class
    or method is non-final, an attacker could try to extend it in a dangerous and
    unforeseen way. Note that this causes a loss of extensibility, in exchange for
    security.


    +   9. Don''t depend on package scope for security. A few classes, as as java.lang,
    are closed by default, and some Java Virtual Machines (JVMs) let you close off
    other packages. Otherwise, Java classes are not closed. Thus, an attacker could
    introduce a new class inside your package, and use this new class to access the
    things you thought you were protecting.


    +   10. Don''t use inner classes. When inner classes are translated into byte
    codes, the inner class is translated into a class accesible to any class in the
    package. Even worse, the enclosing class''s private fields silently become non-private
    to permit access by the inner class!


    +   11. Minimize privileges. Wherever possible, don''t require any special permissions
    at all.


