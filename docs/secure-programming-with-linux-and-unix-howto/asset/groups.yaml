    > 我曾下了一道命令并进行了搜索，发现这座城市有着长期的反抗国王的历史，一直以来是一个叛乱和煽动的地方。

    > 以斯拉亚记 4:19 (NIV)


    ## 2.1. Unix、Linux 和开源/自由软件的历史


    ### 2.1.1. Unix


    1969-1970 年，AT&T 贝尔实验室的 Kenneth Thompson、Dennis Ritchie 等人在这台不常用的 PDP-7 上开发了一个小型操作系统。该操作系统很快被命名为
    Unix，这是对早期操作系统 MULTICS 的双关语。1972-1973 年，该系统用 C 语言进行了重写，这是一个极具远见的非凡步骤：由于这一决定，Unix
    成为第一个可以在原始硬件之间切换且比硬件寿命更长的广泛使用的操作系统。Unix 还增加了其他创新，这在某种程度上归于贝尔实验室与学术界之间的协同作用。1979
    年，Unix 的“第七版”（V7）发布，它是所有现存 Unix 系统的祖先。


    从此以后，Unix 的历史变得有些复杂。以伯克利为首的学术界开发了一个名为伯克利软件发行版（BSD）的变体，而 AT&T 则以“System III”和后来的“System
    V”命名开发 Unix。20 世纪 80 年代后期到 90 年代初，这两个大流派之间的“战争”激烈进行。经过多年以后，每个变体都采纳了对方的许多关键特性。在商业上，System
    V 赢得了“标准战争”（使其大部分接口进入了正式标准），大多数硬件供应商切换到了 AT&T 的 System V。然而，System V 最终吸收了许多 BSD
    创新，因此产生的系统更多是两个分支的合并。BSD 分支并没有消失，而是被广泛用于研究、PC 硬件和单用途服务器（例如，许多网站使用 BSD 衍生版本）。


    结果是出现了许多不同版本的 Unix，它们都基于原始的第七版。大多数 Unix 版本是专有的，并由各自的硬件供应商维护，例如，Sun Solaris 是 System
    V 的一个变体。BSD 分支有三个版本最终开源：FreeBSD（侧重 PC 类型硬件的安装易用性）、NetBSD（侧重许多不同的 CPU 架构）以及 NetBSD
    的变体 OpenBSD（侧重安全）。更通用的信息可以在 http://www.datacentrics.com/tech/unix/uxistry/brf-hist.hm
    找到。更多关于 BSD 历史的信息可以在 http://www.datacentrics.com/tech/unix/uxistry/brf-hist.hm
    找到。


    ## 2.1.2. 自由软件


    1984 年，Richard Stallman 的自由软件基金会（FSF）启动了一个项目，旨在创建可以自由使用、修改和重新分发的软件。“自由”（free）一词是
    freedom（自由）的缩写，而不是免费（free beer）。本书使用“free”一词表示其通常含义，即可以自由使用、修改和重新分发的软件。关于自由软件的这一定义及其背后的动机，可以在
    http://www.fsf.org 找到。


    ## 2.1.3. Linux


    1991 年，Linus Torvalds 开始编写一个操作系统，并将其命名为 Linux。本书使用“Unix 类”（Unix-like）一词来描述设计上类
    Unix 的系统。特别是，“Unix 类”一词包含了所有主要的 Unix 变体和 Linux。注意，许多人使用“Unix”一词来描述这些系统。


    ## 2.1.4. 开源/自由软件


    “开源”（open source）一词经常与执行文件免费提供但源代码不免费的软件相混淆。相反，“开源”一词有时指源代码可见但在使用或重新分发上有限制的软件。本书使用“开源”一词表示其通常含义，即具有可供使用、修改和重新分发的源代码的软件；更详细的定义包含在开源定义（http://www.opensource.org/osd.html）中。在某些情况下，暗示了动机的差异；倾向于使用“自由软件”一词的人希望强烈强调对自由的需求，而使用该词可能有其他动机（例如，更高的可靠性）或仅仅希望看起来不那么激进。对阅读开源软件和自由软件倡性文章感兴趣的人应该查看
    http://www.opensource.org 和 http://www.fsf.org。


    ## 2.1.5.比较 Linux 和 Unix


    类 Unix 系统共享许多安全机制，尽管存在细微差别且并非所有系统都拥有所有机制。所有系统都为每个进程包含用户 ID 和组 ID（uids 和 groups），以及一个具有读、写、执行权限的文件系统（针对用户、组和其他）。有关
    Unix 系统的通用信息（包括其基本安全机制），请参见 Thompson [1974] 和 Bach [1986]。


