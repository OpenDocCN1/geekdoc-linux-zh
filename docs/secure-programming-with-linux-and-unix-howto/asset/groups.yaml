  - '[PAGE 1]


    # Secure Programming for Linux and Unix HOWTO


    by David A. Wheeler


    v2.75 Edition

    Published v2.75, 12 January 2001

    Copyright \© 1999, 2000, 2001 by David A. Wheeler


    This book provides a set of design and implementation guidelines for writing secure
    programs for Linux and Unix systems. Such programs include application programs
    used as viewers of remote data, web applications (including CGI scripts), network
    servers, and setuid/setgid programs. Specific guidelines for C, C++, Java, Perl,
    Python, TCL, and Ada95 are included.


    This book is Copyright (\©) 1999-2000 David A. Wheeler. Permission is granted
    to copy, distribute and/or modify this book under the terms of the GNU Free Documentation
    License (GDFL), Version 1.1 or any later version published by the Free Software
    Foundation; with the invariant sections being "About the Author", with no Front-Cover
    Texts, and no Back-Cover texts. A copy of the license is included in the section
    entitled "GNU Free Documentation License". This book is distributed in the hope
    that it will be useful, but WITHOUT ANY WARRANTY; even the implied warranty of
    MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.'
