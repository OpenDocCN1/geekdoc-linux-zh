    ## 第 8 章 审慎地返回信息


    > 不要照着愚人的愚蠢来回答他，否则你也会变得和他一样。

    > \ 箴言 26:4 (NIV)


    ## 8.1. 最小化反馈


    避免向不可信的用户提供过多的信息；只需告知其成功或失败；如果失败了，只需说失败了，并尽可能减少关于失败原因的信息。将详细信息保存到审计跟踪日志中。例如：


    - 如果你的程序需要某种用户身份验证（例如，你正在编写一个网络服务或登录程序），在用户身份验证之前，尽可能少给用户提供信息。特别是避免在身份验证之前泄露程序的版本号。否则，如果发现某个版本的程序存在漏洞，那么没有升级该版本的用户就会向攻击者泄露他们处于漏洞之的状态。

    - 如果你的程序接受密码，不要将其回显（echo）；这会产生密码被泄露的另一种途径。


    ## 8.2. 不要包含注释


    在返回信息时，除非你确定希望接收用户能够查看它们，否则不要包含任何“注释”。对于生成文件（如 HTML）的 Web 应用程序来说，这是一个特别的问题。Web
    应用程序程序员通常希望对自己的工作进行注释（这没问题），但如果只是简单地将注释留在代码中，这些注释就会作为生成文件（通常是 HTML 或 XML）的一部分被返回给用户。麻烦在于，这些注释有时会提供有关系统工作原理的见索，从而帮助攻击者。


    ## 8.3. 处理完整/无响应的输出


    用户可能会阻塞或使安全程序返回该用户的输出通道变得无响应。例如，Web 浏览器可能被故意停止，或者其 TCP/IP 通道的响应被减慢。安全程序应该处理此类情况，特别是应该快速释放锁（最好在回复之前），这样就不会产生遭受拒绝服务（DoS）攻击的机会。始终对发出的网络导向写请求设置超时。


    ## 8.4. 控制数据格式化（“格式化字符串”）


    计算机语言中的许多输出例程都有一个控制生成格式的参数。在 C 语言中，最明显的例子是 `printf()` 系列例程（包括 `print()`、`sprintf()`、`sprintf()`、`fprintf()`
    等）。C 语言中的其他示例包括 `syslog()`（写入系统日志信息）和 `settitle()`（设置用于显示进程标识符信息的字符串）。许多以“err”或“warn”开头、包含“log”或以“printf”结尾的函数都值得考虑。Python
    包含了“%% 操作”，它以类似的方式对字符串进行格式化。许多程序和库定义了格式化函数，通常通过调用例程并添加额外的处理来实现（例如 glib 的 `g_snprintf()`
    例程）。


    惊讶的是，许多人似乎忘记了这些格式化功能的力量，并将来自不可信用户的数据作为格式化参数。永远不要使用来自不可信用户的未过滤数据作为格式化参数。这一点可以通过示例完美说明：


    ```

    /* 错误的方法： */

    printf(string_from_untrusted_user);

    /* 正确的方法： */

    printf("%s %d", string_from_untrusted_user); /* 或者直接 */

    fputs(string_from_untrusted_user);

    ```


    否则，攻击者可以通过仔细选择格式化字符串来造成各种破坏。C 语言的 `printf()` 是一个很好的例子——有很多方法可以利用 `printf` 中用户控制的格式化字符串。这些包括通过创建格式化字符串导致缓冲区溢出（这可能导致对程序的完全控制）、使用未使用参数的转换规范（导致插入意外数据），以及创建产生完全出乎之外之值的格式（通过在前面或后面添加异常数据，在后续引起问题）。注意，一种特别恶劣的情况是
    `printf` 的 `%n` 转换，它将到目前为止写入的字符数写入指针参数中；利用这一点，攻击者可以覆盖本打算用于打印的值！攻击者甚至可以覆盖几乎任意的位置，攻击者可以指定一个实际上并没有传递的“参数”。由于在许多情况下结果会返回给用户，这种攻击也可以用于暴露有关栈的内部信息。这些信息随后可以被用于绕过像
    StackGuard 等保护系统；StackGuard 使用常量“金丝雀”（canary）来检测攻击，但如果可以显示栈的内容，金丝雀的当前值就会被暴露并变得脆弱。


    格式化字符串应该始终是一个常量字符串，可能涉及用于去国际化的函数调用。


    ## 8.5. 控制输出中的字符编码


    通常情况下，安全程序必须确保其与客户端保持同步。影响 Web 应用程序的一个问题是它们忘记了指定字符编码。这为跨站攻击打开了大门。


    '
