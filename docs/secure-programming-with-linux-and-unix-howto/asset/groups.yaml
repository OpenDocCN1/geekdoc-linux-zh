    # Chapter 5. Avoid Buffer Overflow


    snprintf don''t guarantee that its string will end in NIL; if the string is too
    long, it won''t include NIL at all. Note the glib library (the basis of GTK, and
    not the same as the GNU library glibc has a g_snprintf(), which has a consistent
    return semantic, always NIL-terminates, and most importantly always respects the
    buffer length.


    # 5.2. Library Solutions in C/C++


    One solution in C/C++ is to use library functions that do not have buffer overflow
    problems. The first subsection describes the "C library" solution, which can work
    but has its disadvantages. The next subsection describe the security issues of
    fixed length and dynamically reallocated approaches to buffers. The following
    subsections describe various alternative libraries, as strepy and libmib.


    # 5.2.1. Standard C Library Solution


    The "standard" solution to prevent buffer overflow in C is to use the C library
    functions that defend against these problems. This approach depends heavily on
    the library functions strpy(3) and strnccat(3). If you choose this approach, beware:
    these calls have somewhat surprising semantics and are hard to use correctly.
    The function strncpy(3) does not NIL-terminate the destination string if the source
    string length is at least equal to the destination''s, so be sure to set the last
    character of the destination to NIL after calling strncpy(3). If you''re going
