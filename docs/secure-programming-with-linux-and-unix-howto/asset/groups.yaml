    `chroot`。当你读到这里时，这些漏洞可能已经被修补，而现实情况是 root 权限在传统上意味着“所有权限”，很难将其剥夺（因此最好假设需要持续 root
    权限的程序使用 `chroot()` 只能得到微弱的帮助）。当然，你可能可以将你的程序拆分成部分，以便至少其某部分可以放在 chroot 牢狱中。


