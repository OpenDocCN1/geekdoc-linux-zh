    ## 6.8. Trust Only Trustworthy Channels


    In general, do not trust results from untrustworthy channels.


    In most computer networks (and certainly for the Internet at large), no unauthenticated
    transmission is trustworthy. For example, on the Internet arbitrary packets can
    be forged, including header values, so don''t use their values as your primary
    criteria for security decisions unless you can authenticate them. In some cases
    you can assert that a packet coming from the "inside" actually descends, since
    the local firewall would prevent such spoofs out, but broken firewalls, alternative
    paths, and mobile code make even this suspicion. In a similar view, do not assume
    that low port numbers (less than 1024) are trustworthy; in most networks these
    requests can be forged or the platform can be made to use of low-numbered ports.


    If you''re implementing a standard and inherently insecure protocol (e.g., ftp
    and login), provide safe defaults and clearly the assignments.


    The Domain Name Server (DNS) is widely used on the Internet to maintain mappings
    between the names of computers and their IP (numeric) addresses. The technique
    called "reverse DNS" eliminates some spoofing attacks, and is useful for determining
    a host''s name. However, this technique is not trustworthy for authentication
    decisions.


    The problem is that, in the end, a DNS request will be sent to some remote system
    that may be controlled by an attacker. Therefore, treat DNS results as an input
    that needs validation and do not trust it for serious access control.


