    # 第 5 章 避免缓冲区溢出


    `snprintf` 并不保证其字符串以 NIL（空终止符）结束；如果字符串太长，它根本不会包含 NIL。请注意，glib 库（GTK 的基础，与 GNU
    库 glibc 不同）拥有一个 `g_snprintf()`，它具有一致的返回语义，总是以 NIL 终止，而且重要的是，它总是尊重缓冲区长度。


    ## 5.2. C/C++ 中的库解决方案


    C/C++ 中的一种解决方案是使用不会产生缓冲区溢出问题的库函数。第一个小节描述了“C 库”解决方案，这种方法可行，但有其缺点。下一个小节描述了固定长度和动态重新分配缓冲区方法的安全性问题。接下来的小节描述了各种替代库，如
    `strpy` 和 `libmib`。


    ### 5.2.1. 标准 C 库解决方案


    在 C 中防止缓冲区溢出的“标准”解决方案是使用能够防御这些问题的 C 库函数。这种方法严重依赖于库函数 `strpy(3)` 和 `strnccat(3)`。如果你选择这种方法，请注意：这些调用的语义有些出乎意料，且难以正确使用。`strncpy(3)`
    函数如果源字符串长度大于等于目标长度，则不会对目标字符串进行 NIL 终止，因此在调用 `strncpy(3)` 后，务必将缓冲的最后一个字符设置为 NIL。如果你将多次重用同一个缓冲区，有效的方法是告诉
    `strncpy()` 缓冲区比实际长度少一个字符，并在使用前将最后一个字符设置为 NIL。`strncpy(3)` 和 `strnccat(3)` 都要求你传递剩余可用空间的大小，这个计算很容易出错（一旦出错就可能导致缓冲区溢出攻击）。这两者都没有提供简单的方法来判断是否发生了溢出。最后，`strncpy(3)`
    与它据称替换的 `strcpy(3)` 相比，有显著的性能损失，因为 `strncpy(3)` 会用 NIL 填充目标的剩余部分。我收到过对最后一点表示惊讶的邮件，而这在
    Kernighan 和 Ritchie 的第二版中 [Kernighan 1988, page 249] 有有明确说明，并且这种行为在 Linux、FreeBSD
    和 Solaris 的 man 页中也有明确记录。这意味着仅仅将 `strcpy` 更改为 `strncpy` 就会导致性能严重下降，在大多数情况下这并没有合理的理由。


    你可以在防止缓冲区溢出的同时使用 `sprintf()`，但你这样做时也需要小心；它太容易被误用，因此很难推荐。`sprintf` 的控制字符串可以包含各种转换说明符（例如
    `"%%s"`），且控制说明符可以有可选的字段宽度（例如 `"%10s"`）和精度（例如 `"%.10s"`）规范。它们看起来非常相似（唯一的区别是一个点），但非常不同。字段宽度只指定最小长度，对于防止溢出完全没有用处。相比之下，精度规范指定了该特定字符串在输出中作为字符串说明符时可能具有的最大长度——因此它可以被用于防止溢出。注意，精度规范仅在处理字符串时才指定总最大长度；对于其他转换操作，它具有不同的含义。如果给定的大小为
    `*`，则你可以将最大大小作为参数传递（例如 `sizeof()` 的结果），这通过示例可以最清楚地说明——这里是使用 `sprintf()` 防止缓冲区溢出的正确方法和错误方法：


    ```

    char buf[BUFFER_SIZE];

    sprintf(buf, "%s", sizeof(buf)-1, "long-string"); /* 错误 */

    sprintf(buf, ".%s", sizeof(buf)-1, "long-string"); /* 正确 */

    ```


    在理论上，`sprintf()` 会非常有用，因为你可以用它指定复杂的格式。遗憾的是，使用 `sprintf()` 很容易出错。如果格式很复杂，你需要确保大小足够以容纳整个格式可能的最大尺寸，但精度字段只控制一个参数的大小。在创建复杂的输出时，“最大可能”的值往往很难确定。如果程序没有为最可能的组合分配足够的空间，可能会产生一个缓冲区溢出漏洞。此外，`sprintf()`
    在整个操作完成后会向目标追加一个 NUL ——这个字符很容易被遗忘，并创造了产生“差一错误”（off-by-one）的机会。


    ### 5.2.2. 静态和动态分配缓冲区


    固定长度缓冲区的主要问题是，如果输入大于缓冲区，它们就无法增长以容纳输入。如果程序在拷贝之前不检查输入长度，就会发生缓冲区溢出。这是安全漏洞的常见来源，因为攻击者可以使用它覆盖堆栈上的相邻数据，包括函数的返回地址。


    固定长度缓冲器的另一种替代方案是使用动态分配缓冲区。这允许程序在运行时为输入分配足够的内存。然而，这种方法也有自己的问题，例如内存耗尽的风险以及手动管理内存的复杂性。如果程序不小心，还可能内存泄漏，导致随着时间推移出现崩溃或其他行为。


    `strncpy(3)` 和 `strnccat(3)` 都要求你传递剩余可用空间的大小，这个计算很容易出错（一旦出错就可能导致缓冲区溢出攻击）。这两者都没有提供简单的方法来判断是否发生了溢出。最后，`strncpy(3)`
    与它据称替换的 `strcpy(3)` 相比，有显著的性能损失，因为 `strncpy(3)` 会用 NIL 填充目标的剩余部分。我收到过对最后一点表示惊讶的邮件，而这在
    Kernighan 和 Ritchie 的第二版中 [Kernighan 1988, page 249] 有明确说明，并且这种行为在 Linux、FreeBSD
    和 Solaris 的 man 页中也有明确记录。这意味着仅仅将 `strcpy` 更改为 `strncpy` 就会导致性能严重下降，在大多数情况下这并没有合理的理由。


    你可以在防止缓冲区溢出的同时使用 `sprintf()`，但你这样做时也需要小心；它太容易被误用，因此很难推荐。`sprintf` 的控制字符串可以包含各种转换说明符（例如
    `"%%s"`），且控制说明符可以有可选的字段宽度（例如 `"%10s"`）和精度（例如 `"%.10s"`）规范。它们看起来非常相似（唯一的区别是一个点），但非常不同。字段宽度只指定最小长度，对于防止溢出完全没有用处。相比之下，精度规范指定了该特定字符串在输出中作为字符串说明符时可能具有的最大长度——因此它可以被用于防止溢出。注意，精度规范仅在处理字符串时才指定总最大长度；对于其他转换操作，它具有不同的含义。如果给定的大小为
    `*`，则你可以将最大大小作为参数传递（例如 `sizeof()` 的结果），这通过示例可以最清楚地说明——这里是使用 `sprintf()` 防止缓冲区溢出的正确方法和错误方法：


    ```

    char buf[BUFFER_SIZE];

    sprintf(buf, "%s", sizeof(buf)-1, "long-string"); /* 错误 */

    sprintf(buf, ".%s", sizeof(buf)-1, "long-string"); /* 正确 */

    ```


    在理论上，`sprintf()` 会非常有用，因为你可以用它指定复杂的格式。遗憾的是，使用 `sprintf()` 很容易出错。如果格式很复杂，你需要确保大小足够以容纳整个格式可能的最大尺寸，但精度字段只控制一个参数的大小。在创建复杂的输出时，“最大可能”的值往往很难确定。如果程序没有为最可能的组合分配足够的空间，可能会产生一个缓冲区溢出漏洞。此外，`sprintf()`
    在整个操作完成后会向目标追加一个 NUL ——这个字符很容易被遗忘，并创造了产生“差一错误”的机会。


