  mdcn: '

    这是一个由 SuSE 开发的“compartment”工具。该工具可以设置文件系统根目录、gid 和/或能力集（capability set），然后运行给定的程序。这对于在不修改程序的情况下运行其他程序非常有用。以下是
    0.5 版本的语法：


    语法：compartment [options] /full/path/to/program


    - 选项：

    -chroot path 将路径切换到 path

    - -user user 将 uid 更改为此用户

    - -group group 将 gid 更改为此组

    - -init program 在执行任何操作之前执行此程序

    - -cap capset 设置 capset 名称。你可以指定多个

    - -verbose 开启详细模式

    - -quiet 不记录日志（发送到 syslog）


    因此，你可以使用以下命令启动更安全的匿名 ftp 服务器：

    `ncompartment -chroot /home/ftp -cap CAP_NET_BIND_SERVICE anon-ftpd`


    在编写时，该工具尚不成熟，尚未在典型的 Linux 发行版中可用，但这种情况可能会很快改变。你可以通过 http://www.suse.de/-marc 下载该程序。


    ## 6.3.2. 最小化权限的使用时间


    尽快永久地放弃权限。某些 Unix 类系统（包括 Linux）实现了“保存型”（saved）ID，这些 ID 用于存储“之前”的值。最简单的方法是将另一个
    id 两次设置为一个不可信的 id。在 setuid/setgid 程序中，你通常应该在 `fork()` 之后立即将有效 gid 和 uid 设置为真实（real）值，但这样做也有充分的理由。请注意，当你从
    root 降级到其他权限时，必须更改第一个 gid，否则它将不起——一旦你放弃了 root 权限，你就无法更改其他任何内容了。


    值得注意的是，有一个广知的漏洞利用 POSIX 能力（capabilities）来干预这种最小化操作。该漏洞影响 Linux 内核 2.2.0 到 2.2.15，可能影响许多其他具有
    POSIX 能力的 Unix 类系统。更多信息请参阅 http://www.securityfocus.com  Bugtraq id 1322。以下是他们的摘要：


    POSIX “Capabilities”最近在 Linux 内核中实现。这些“Capabilities”是权限控制的额外形式，能够更精细地控制特权进程可以执行的操作。Capabilities
    被实现为三个（相当大的）位字段，每个位字段代表特权进程可以执行的一个特定操作。通过设置位，可以控制特权进程的行为——仅为程序中需要这些功能的特定部分授予某些函数的访问权限。这是一种安全措施。问题是，capabilities
    会随 `fork()exec()` 被复制，这意味着它们可能会被继承。利用这种机制的方法是：在三个位字段中的每一个中将所有能力设置为零（意味着所有位都关闭），然后执行一个程序，该程序在执行可能在
    root 身份下具有危险的代码（如 sendmail）之前会先降级权限。当 sendmail 尝试使用 `setuid(getuid())` 降级权限时，它失败了，因为在位字段中没有所需的权限，且没有对其返回值进行检查。它会继续以超级用户权限执行，并以
    root 身份运行用户的 .forward 文件，导致完全被攻陷。


    sendmail 的一种方法是在 `setuid(getuid())` 之后尝试设置 `setuid(0)`；通常情况下如果成功，程序就会停止。更多信息请访问
    http://sendmail.net/?feed=000607linuxbug。短期来看，这在其他程序中可能是一个好主意，但显然，更好的长期方法是升级底层系统。


    ## 6.3.3. 最小化权限激活的时间


    使用 `setuid(2)`、`setgid(2)` 和相关函数确保程序只在需要时才激活这些权限。如上所述，你可能确保在解析用户输入时禁用这些权限，但更通用地说，只有在实际需要时才开启权限。请注意，某些缓冲区溢出攻击如果成功，可以强制程序运行任意代码，这可能会重新启用已降级的权限。因此，尽可能完全放弃权限总是好的。尽管如此，禁用这些权限可以防止整类攻击，例如让程序写入它本不打算写入的文件。在无法完全放弃权限的情况下，这种技术是值得的。


    ## 第 6 章 程序内部结构与方法


    ## 6.3.4. 最小化权限激活的时间


    如果只授予某些模块权限，可以使用 `chroot(2)` 来限制程序可见的文件。这需要仔细地设置一个目录（称为 chroot 监狱）并正确进入。这是一种提高程序安全性的有效技术——很难干预它看不见的文件。然而，这依赖于许多假设，特别是程序必须锁定
    root 权限，不能有获取 root 权限的方法，并且 chroot 监狱必须被正确设置。建议在合适的情况下使用 `chroot(2)`，但不要仅依赖它，而是将其作为层次防御的一部分。关于使用
    `chroot(2)` 有以下几点：


    - 程序仍然可以使用跨机器的非系统对象（如 System V IPC 对象和套接字）。最好使用


    ## 6.3.5. 考虑使用 FSUID 限制权限


    每个进程有两个唯一的状态值：文件用户 ID (fuid) 和文件组 ID (fsgid)。这些值在检查文件系统时会被使用。如果你正在构建一个为任意用户运行的文件服务器（如
    NFS 服务器），你可以考虑使用这些 Linux 扩展。要使用它们，在持有 root 权限时，在访问文件之前更改 fuid 和 fsgid。这种扩展非常有用，提供了一种在限制文件访问的同时移除其他（可能必要的）权利的机制。通过只设置
    fuid（而不是 neid），本地用户无法向进程发送信号。此外，在这种情况下避免竞态条件要容易得多。然而，这种方法的缺点是这些调用无法移植到其他 Unix
