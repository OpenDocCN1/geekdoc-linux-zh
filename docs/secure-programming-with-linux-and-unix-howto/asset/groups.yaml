    \ 3.6. Quotas and Limits\n\nMany Unix-like systems have mechanisms to support\
    \ filesystem quotas and process limits. This includes Linux. These mechanisms\
    \ are particularly useful for preventing denial of service attacks; by limiting\
    \ the resources available to each user, you can make it hard for a single user\
    \ to use up the system. You can define storage (filesystem) quota on each mountpoint\
