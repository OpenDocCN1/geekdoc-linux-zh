    # Chapter 6. Structure Program Internals and Approach


    A web site may inadvertently include malicious HTML tags or script in a dynamically
    generated page based on unvalidated input from untrustworthy sources (CERT Advisory
    CA-2000-02, Malicious HTML Tags Embedded in Client Web Requests (http://www.cert.org/advisories/CA-2000-02.html)).


    #  6.11.2. Solutions to Cross-Site Malicious Content


    Fundamentally, this means that all web application impacted by any user must be
    filtered (so characters that can cause this problem are removed), encoded (so
    characters that can cause this problem are encoded in a way to prevent the problem),
    or validated (to ensure only “safe” data gets through). This includes all output
    derived from input such as URL parameters, form data, cookies, database queries,
    CORBA ORB results, and data from users stored in files. In many cases, filtering
    and validation should be done at input, but encoding can be done during input
    validation or output generation. If you''re passing the data through analysis,
    it''s probably better to encode on input (so it won''t forgotten). However, if
    your program processes the data, it can be easier to encode it on output instead.
    CERT recommends filtering and encoding during data output; this isn''t a bad idea,
    but there are many cases where it makes sense to do it at input instead. The critical
    issue is to make sure you cover all cases for every output, which is not an easy
