    in all other cases the setgid is clear for a new file. This is the rationale for
    Red Linux’s “user-private group” scheme, in which every user is a member of a
    “private” group with its members, so defaults can permit the group to read and
    write any file (since they’re the only member of the group). Thus, when the file’s
    group membership is transferred this way, read and write privileges are transferred
    too. Basic access control values (read, write, execute) are computed from (requested
    values & ~ umask of process). New files always start with a clear sticky bit and
    setuid bit.


