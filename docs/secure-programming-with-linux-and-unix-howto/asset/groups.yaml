    When users log in, their usernames are mapped to integers marking their "UID"
    (for "user id") and the "GID" (for "group id") that they are a member of. UID
    is a special privileged user (role) traditionally called "root"; on Unix-like
    systems (including root) can overrule most security checks and is to administer
    the system. Processes are also "subjects" in terms of security (that is, only
    processes are active objects). Processes can access various data objects, in particular
    filesystem objects (FSOs), System V Interprocess Communication (IPC) objects,
    and network ports. Processes can also set signals. Security-relevant topics include
    quotas and limits, libraries, auditing, and PAM. The next few subsections detail
    this.


    # 3.1. Processes


    In Unix-like systems, user-level activities are implemented by running processes.
    Most Unix systems support a "thread" as a separate concept; threads share memory
    inside a process, and the system scheduler schedules threads. Linux does this
    differently (and in my opinion we use a better approach): there is no essential
    difference between a thread and a process. Instead, in Linux, a process creates
    another process it can choose which resources are shared (e.g., memory can be
    shared). Linux kernel then performs optimizations to get thread-level speeds;
    see clone(2) for more information. It''s worth noting that the Linux kernel developers
    tend to use the word "task", not "thread" or "process", but the external documentation
    tends to use the word process (so I''ll use the term "process" here). When programming
    a multi-threaded application, it''s usually to use one of the standard thread
    libraries'
  - '[PAGE 32]


    that hide these differences. Not only does this make threading more portable,
    but some libraries provide an additional level of indirection, by implementing
    more than one application-level thread as a single operating system thread; this
    can provide some improved performance on some systems for some applications.


    # 3.1.1. Process Attributes


    Here are typical attributes associated with each process in a Unix-like system:


    +   - RUID, RGID - real UID and G of the user on whose behalf the process is running

    - EUID, EGID - effective UID and G for privilege checks (except for the filesystem)

    - SUID, SGID - Saved UID and G; used to support switching permissions "on and
    off" as discussed below. Not all Unix-like systems support this.

    - supplemental groups - a list of groups (GIDs) in which this user has membership.

    - umask - a set of bits determining the default access control settings when a
    new filesystem object is created; see umask(2).

    - scheduling parameters - each process has a scheduling policy, and those with
    the default policy SCHED_OTHER have the additional parameters nice, priority,
    and counter. see sched_setscheduler(2) for more information.

    - limits - per-process resource limits (see below).

    - filesystem root - the process'' idea of where the root filesystem begins; see
    chroot(2).


    Here are less-common attributes associated with processes:


    +   - FSUID, FSGID - UID and G for filesystem access checks; this is usually equal
    to the EUID and EGID respectively. This is a Linux-unique attribute.

    - capabilities - POSIX capability information; there are actually three sets of
    capabilities on a process: the effective, inheritable, and permitted capabilities.
