    仅仅是“参考其他文档”？这里有几个答案：


    -   许多此类信息是分散在各处的；将关键信息放在一个组织有条的文档中使其更易使用。


    -   其中某些信息不是为程序员编写的，而是为管理员或用户编写的。


    -   许多现可用信息强调了可移植性构建体（在所有 Unix 类系统上运行的构建体），并且完全没有讨论过 Linux。为了可移植性，通常最好是避免使用 Linux
    特有的功能，但有时 Linux 特有的功能确实能辅助安全。即使希望具有非 Linux 的可移植性，在 Linux 上运行运行时，你可能也希望支持 Unix
    特有的功能。此外，通过侧重强调 Linux，我可以包含一些对目标系统为 Linux 的人员有帮助的引用，而这些信息对其他人来说并不一定适用。


    ## 2.7. 设计实现指南的来源


    有几份文档描述了如何编写安全性的程序（或者，相反，如何在现有程序中发现安全问题），并且它们是本书其他部分所强调的指南的依据。


    对于通用服务器和 setuid/setgid 程序，有很多有价值的文档（尽管如果没有参考资料，其中一些很难找到）。


    Matt Bishop [1996, 1997] 就该主题开发了几篇极具价值的论文和演示，事实上，他还有一个专门针对该主题的网页：olympus.cs.udavis.edu/~bishop/secprog.html。AUSCERT
    发布了一份编程清单 [AUSCERT 1996] (http://ftp.auscert.org/pub/auscert/papers/secure_programming_checklist)，基于
    Garfinkel 和 Spafford 书中第 23 章的一部分，该章节讨论了如何编写安全的 SUID 和网络程序 [Garfinkel 1996] (http://www.oreilly.com/catalog/php/)。Galvin
    [1998a] (http://www.sunworld.com/swol-04-1998/swol-04.html) 描述了一个用于开发安全程序的简单流程和清单；他后来在
    Galvin [1998b] (http://www.sunworld.com/sunworldonline/swol-08-1998/swol-08.html)
    中更新了该清单。Sitaker [1999] (http://www.pobox.com/kragen/security.html) 提供了一份需要搜索的“Linux
    安全审计”列表。Shostack [1999] (http://www.homeport.org/adam/review.html) 定义了另一个审查安全敏感代码的清单。NCSA
    (http://www.uiuc.edu/General/ACES/security) 提供了一组简练的安全编程指南。其他有用信息还包括《安全 Unix 编程》[Al-Herbish
    1999] (http://www.whitefang.com/sup.html/)、《安全审计常见问题解答》[Graham 1999] (http://lsap.org/faq.txt)
    以及 Ranum [1998] (http://www.clark.net/mib/jpg.pdf)。某些建议必须谨慎对待，例如 Paul (http://www.homeport.org/setuid.html)
