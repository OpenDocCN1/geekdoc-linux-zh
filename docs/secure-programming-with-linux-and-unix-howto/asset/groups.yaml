    stack frame. This isn''t always true. Compilers (such as gcc) can optimize away
    things, and in particular the option "-fomit-frame-pointer" removes the information
    that libsafe seems to need. Thus, libsafe may fail to work for some programs.


    The libsafe developers themselves acknowledge that software developers shouldn''t
    depend on Libsafe. In their words:


    It is generally accepted that the best solution to buffer overflow attacks is
    to fix the defective programs. However, fixing defective programs requires knowing
    that a particular program is defective. The true benefit of using safe and other
    alternative security measures is protection against future attacks on programs
    that are not yet known to be vulnerable.


    ## 5.2.6. Other Libraries


