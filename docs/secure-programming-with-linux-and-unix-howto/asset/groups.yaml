    # Chapter 4. Validate All Input


    > Wisdom will save you from the

    ways of wicked men, from men

    whose words are perverse...


    Proverbs 2:12 (NIV)


    Some inputs are from untrustable users, so those inputs must be validated (filtered)

    before being used. You should determine what is legal and reject anything that
    does not

    match that definition. Do not the reverse (identify what is illegal and write
    code to

    reject those cases), because you are likely to handle an important case of

    illegal input.


    There is a good reason for identifying “illegal” values, though, and that''s as
    a set of

    tests (usually executed in your head) to be sure that your validation code is

    thorough. When I set up an input filter, I mentally attack the filter to see if
    there are

    illegal values that could get through. Depending on the input, here are few examples

    of common "illegal" values that your input filters need to prevent: the empty

    string, "" " " " "/", anything starting with "/" or "<" inside it,

    any control characters (especially NIL and newline), and/or any characters with
    the

    "high bit" set (especially values 254 and 255). Again, your code should not be

    checking for "bad" values; you should do this mentally to be sure that your

    patternlessly limits input values to legal values. If your pattern isn''t sufficiently

    narrow, you need to carefully re-examine the pattern to see if there are other
    problems.


    Limit the maximum character length (and minimum length if appropriate), and be
    sure

    to not lose control when such lengths are exceeded (see Chapter 5 for more

    buffer overflows).


    For strings, identify the legal characters or legal patterns (e.g., as a regular
    expression)

    and reject anything not matching that form. There are special problems when strings

    contain control characters (especially linefeed or NIL) or shell metacters; it
    is

    often best to "escape" such metacters immediately when the input is received so

    tuch characters are not accidentally sent. CERT goes further and recommends

    escaping all characters that aren''t in a list of characters needing escaping'
