  mdcn: '


    ## 第 2 章 背景


    因为在刚刚开源时，它更容易被利用，最终这些漏洞才被修复。


    那么，底线是什么呢？我个人认为，当一个程序刚开源时，它对任何用户来说安全性最初是更低（（漏洞暴露），但随着时间的推移（比如几年后），它潜力可能比闭源程序安全得多。仅仅让一个程序开源并不会突然让它变得安全，而且开发一个开源程序并不能保证安全性：


    - 首先，人们必须真正对开源项目的代码进行审查。所有因素都可能减少审查量：例如，如果一个产品是小众或很少使用的（导致审查者较少）、开发者较少，或者使用一种极少使用的计算机语言，这些都会导致审查的减少。


    - 一个会特别降低审查概率的因素不仅是开源。某些供应商可能将他们的“已披露源码”（也称为“源码可用”）程序吹成开源程序，但由于程序所有者拥有独家权利，其他人为所有者“免费”工作代码的动力就会更小。即使是像
    MPL 这样具有异常不对称权利的开源许可证也存在这个问题。毕竟，如果有人对他们的成果拥有他们他们不拥有的权利，人们就不可能自愿参与（Bruce Perens
    说，“谁想成为某人的无薪员工？”）。特别是，由于最有动力的审查者往往是那些试图修改程序的人，这种缺乏激励减少了“关注者”（eyeeballs）的数量。Elias
    Levy 在他关于开源安全的文章中犯了这种错误；他举的被破解软件示例（例如 TIS 的 Gauntlet）在当时并不是开源的。


    - 第二，开发和审查代码的人必须知道如何编写安全程序。希望这本书的出现会有帮助。显然，如果这些“眼睛”中没有人知道该寻找什么，那么有“许多眼睛”也是无关的。


    - 第三，一旦发现问题，就需要尽快修复并发布修复方案。开源系统倾向于快速修复问题，但发布并不总是顺畅。例如，OpenBSD 在审查代码安全漏洞方面做得出色——但并不总是将问题反馈给原始开发者。因此，很有可能在某个系统中已经有了修复版本，而在另一个系统中漏洞仍然存在。


    开源的另一个优势是，如果你发现了一个问题，可以立即修复它。


    简而言之，这对开源软件的影响仍然是安全社区的一个主要争论，尽管许多知名专家认为它具有变得更安全的巨大潜力。


    ## 2.4. 安全程序的类型


    许多不同类型的程序可能需要安全程序（正如本书中的定义）。一些常见类型如下：


    - 用作远程数据查看器的应用程序。用作查看器的程序（如文字处理器或文件格式查看器）经常被要求查看由不可信用户从远程发送的数据（此请求可能由网络 浏览器自动调用）。显然，不应允许不可信的用户输入导致应用程序运行任意程序。支持初始化宏（在显示数据时）通常认为是不明智的；如果你必须这样做，那么就必须创建一个安全的沙箱（这是一个复杂且容易出错的任务）。注意如缓冲区溢出等问题（在第
    5 章中讨论过），这些问题可能允许不可信的用户强迫查看器运行任意程序。


    - 管理员（root）使用的应用程序。此类程序不应信任可以被非管理员控制的信息。


    - 本地服务器（也称为守护进程/daemons）。


    - 网络可访问服务器（有时称为网络守护进程）。


    - 基于 Web 的应用程序（包括 CGI 脚本）。这些是网络可访问服务器的一种特例，但它们非常常见，值得自成类。此类程序通过 Web 服务器间接调用，Web
    服务器过滤掉了一些攻击，但仍然留下了许多必须抵御的攻击。


    - Applets（即下载到客户端自动执行的程序）。这是 Java 特别著名的特性，尽管其他语言（如 Python）也支持移动代码。这里有几种安全观点；客户端
    Applet 基础设施的实现者必须确保只允许的操作是“安全”的，而 Applet 的编写者则必须处理敌主主机的问题（换句话说，你不能信任客户端）。setuid/setid。此类程序通过
