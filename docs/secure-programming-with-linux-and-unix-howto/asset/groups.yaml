    # Chapter 10. Special Topics


    (or parts of it), the attacker may be able to determine their supposedly “random”
    number.

    The real danger with PRNGs is that most computer libraries include a large set
    of pseudo-random number generators (PRNGs) which are inappropriate for security
    purposes. Let me say it again: do not use typical random number generators for
    security purposes. Typical library PRNGs are intended for use in simulations,
    games, and so on; they are not sufficiently random for use in security functions
    such as key generation. Most non-cryptographic library PRNGs are some variation
    of “linear congruential generators”, where the “next” random value is computed
    as (ax+b) mod m (where X is the previous value). Good linear congruential generators
    are fast and have useful statistical properties, making them appropriate for their
    intended uses. The problem with PRNGs is that future values can be easily deduced
    by an attacker (though they may appear random). Other algorithms for generating
    random numbers quickly, such as quadratic and cubic generators, have also been
    broken [Schneier 1996]. In short, you have to use cryptographically strong PRNGs
    to generate random numbers in security applications - ordinary random number libraries
    are not sufficient.


    Failing to correctly generate true random values for keys has caused a number
    of problems, including holes in Kerberos, the X window system, and NFS [Venema
    1996].

    If, you should use system services (typically provided by the operating system)
    that are expressly designed to create cryptographically secure random values.
    For example, the Linux kernel (since 1.3.30) includes a random number generator,
    which is sufficient for many security purposes. This random number generator gathers
    environmental noise from device drivers and other sources into an entropy pool.
    When accessed as /dev/random, random bytes are only returned within the estimated
    number of bits of noise in the entropy pool (when the calls block until additional
    environmental noise is gathered). When accessed as /dev/urandom, as many bytes
    as are requested are returned even when the entropy pool is exhausted. If you
    are using the random values for cryptographic purposes (e.g., to generate a key)
    on Linux, use /dev/random. More information is available in the system documentation
    random(4).


