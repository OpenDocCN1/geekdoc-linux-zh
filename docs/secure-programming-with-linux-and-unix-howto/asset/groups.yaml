    BFBTester, the Brute Force Binary Tester, is licensed under the GPL. This program
    does quick security checks of binary programs. BFBTester performs checks of single
    and multiple argument command line overflows and environment variable overflows.
    Version 2.0 and higher can also watch for tempfile creation activity (check for
    using unsafe العمليه names). At the time of writing, BFBTester doesn''t run on
    Linux due to a technical issue in Linux''s POSIX threads implementation, but this
    may have changed by the time you read this. More information is available at http://my.ispchannel.com/~mheffner/bfbtester.


    # # 10.7. Miscellaneous


    The following are miscellaneous security guidelines that I couldn''t seem to fit
    anywhere else:


    Have your program check at least some of its assumptions before it uses them (e.g.,
    at the beginning of the program). For example, if you depend on the "sticky" bit
    set on a given directory, test it: such tests take little time and prevent a serious
    problem. If you worry about the execution time of some tests on each call, at
    least perform the test at installation time, or even better at perform the test
    on application-start.


    Write audit logs for program startup, session startup, and for suspicious activity.
    Possible information of value includes date, time, uid, euid, gid, eid, terminal
    information, process id, and command line values. One awkward problem is that
    any logging system helpful for implementing audit logs. should be able to record
    a lot of information (this information could be very helpful), yet if the information
    isn''t handled carefully the information itself could be used to create an attack.
    After all, the attacker controls some of the input being sent to the program.
    identify a list of "expected" characters and escape any "unexpected" characters
    so the log isn''t corrupted. Not doing this can be a real problem; users may include
    characters such as control characters (especially NIL or end-of-line) that can
    cause real problems. For example, if an attacker embeds a newline, they can forge
    log entries by following the newline with the desired log entry. Sadly, there
    doesn''t seem to be a standard'
