    ## 附录 F. 关于作者


    David A. Wheeler 是计算机安全专家，长期从事大型高风险软件系统的开发技术研究。他自 20 世纪 70 年代中期开始参与软件开发，并从 20
    世纪 80 年代初开始涉及 Unix 和计算机安全。他的知识领域包括计算机安全、软件安全、漏洞分析、审查、Internet 技术、软件相关标准（包括 POSIX）、实时软件开发技术以及多种计算机语言（包括
    Ada、C、C++、Perl、Python 和 Java）。


    Wheeler 先生是 IEEE 书《Software Inspection: An Industry Best Practice》的合著者和主编辑，书籍《Ada95:
    The Lovelace Tutorial》的作者，以及《GNOME User’s Guide》的合著者。他还是许多短论文和文章的作者，包括《Linux Program
    Library HOWTO》。


