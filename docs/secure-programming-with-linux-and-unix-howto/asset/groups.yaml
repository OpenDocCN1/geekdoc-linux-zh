    请审查此评审意见。更多有用信息可以访问 comp.lang.tcl FAQ 启动页面：http://www.tclfaq.wservice.com/tcl-faq。然而，值得注意的是，TCL
    成为一种小巧且“简单”语言的愿望导致其具有相当局限性；请参阅 Richard Stallman 的《为什么你不应该使用 TCL]((http://sdg.lcs.mit.edu/~jchapun/6853-F9Y7/Papers/stallman-tcl.html)。例如，TCL
    认为本质上只有一种数据类型（字符串），这可能使许多程序的编写变得更加困难（同时也让运行变慢）。此外，当我编写 TCL 程序时，发现很容易无意中创建恶意输入字符串会导致意料之外和意想不到行为的
    TCL 程序。例如，攻击者可能通过向 TCL 发送具有特殊含义的字符（如嵌入空格、双引号、花括号、美元符号或括号，或者构造在处理过程中会产生这些字符的输入）来导致你的
    TCL 程序执行出意料之外的操作。因此，我不建议使用 TCL 编写必须调解安全边界的程序。如果你确实选择这样做，请务必小心，确保用户输入无法“欺骗”程序。另一方面，我并不知道任何充分理由（除了审查不足之外）认为
    TCL 程序不能用于实现移动代码。某些 TCL 的支持者会比我更主倡使用它，而且 TCL 是少数具有现成沙箱实现的语言之一。


    ## 第 10 章。特殊主题


    > 对于拥有智慧的人，理解是生命的源泉；但愚蠢给愚人带来惩罚。

    > 箴言 16:22 (NIV)


    ## 10.1. 密码


    只要可能，不要编写代码来处理密码。特别是，如果应用程序是本地的，尝试依赖于用户的正常登录认证。如果应用程序是 CGI 脚本，尝试依赖 Web 服务器提供保护。如果应用程序通过网络运行，尽可能（如果可能）以明文形式发送密码，因为它们很容易被网络嗅探器捕获并重用。使用算法中固定的密钥或某种遮掩算法对密码进行“加密”，本质上与以明文发送密码没有区别。


    对于网络，至少考虑使用摘要密码（digest passwords）。摘要密码由哈希值开发；通常服务器会向客户端发送一些数据（例如日期、服务器名称），客户端将这些数据与用户密码结合，客户端对该值进行哈希（“摘要密码”）并将哈希结果返回给服务器；服务器验证该哈希值。这种方法行之有效，因为密码从未以任何形式实际发送；密码仅被用于派生哈希值。摘要密码在通常意义上不被视为“加密”，在法律限制用于机密性的加密的国家通常是被接受的。摘要密码容易受到主动威胁，但可以防止被动网络嗅探器。其中一个弱点是，为了让摘要密码生效，服务器必须拥有所有未哈希的密码，这使得服务器成为极具诱惑的攻击目标。


    如果你的应用程序允许用户设置密码，请检查密码并仅允许“良好”的密码（例如：不在字典中、具有明确的最小长度等）。你可能想要查看如 http://consult.cern.ch/writeup/security/security_3.html
    等信息，以了解如何选择良好的密码。如果可以，你应该使用 PAM，因为它支持可插的密码检查器。


    ## 10.2. 随机数


    在许多安全程序中，必须生成无法被对手猜到的“随机”数。示例包括会话密钥、公钥或私钥、对称密钥、许多协议中使用的随机（nonces）和 IV、盐等。理想情况下，你应该使用真正的随机数据源产生随机数，例如基于放射性衰变的值（盖革计数器点击的精确计时）、大气噪声或电子电路中的热噪声。某些计算机具有作为真实随机值生成器的硬件组件，如果可用，你应该使用它。


    然而，大多数计算机并没有用于生成真正随机值的硬件，因此在大多数情况下，你需要一种足够随机的随机数生成方法，以至于对手无法预测。事实上，这意味着你需要三样东西：


    - 不可猜测的状态：这通常通过测量低层设备（击键、磁盘驱动器臂抖动等）的时间差异来实现，这种方式是对手无法控制的。

    - 密码学强类型的伪随机数生成器（PRNG），它利用状态来生成“随机”数。

    - 大量的位（在状态和最终使用的值中都包含）。如果你只有几个可能的值，那么拥有一个强大的 PRNG 并没有意义，因为这使得攻击者易于使用暴力攻击。然而，根据情况而变化的位数通常被用作加密密钥，适用于密钥的常规经验法则同样。对于对称密钥（结果），我会使用至少
    112 位（3DES），128 位稍好一点，160 位或更多更安全。


    通常，PRNG 使用状态生成某些值，然后使用其中的某些值和其他不可猜测的输入来更新状态。有许多攻击这些系统的方法。例如，如果攻击者可以控制或查看状态的输入（或其部分输入），攻击者可能能够确定他们那些所谓的“随机”数。PRNG
    的问题在于它们不适用于安全领域。大多数线性同余随机数生成器速度很快，但具有可预测的属性，其下一个值通过 (ax+b) mod m 计算得出。其他一些 PRNG
    可能很有用，但广泛使用的 PRNG 存在已知弱点，这些弱点取决于你的应用程序可能重要或不重要。未能正确生成随机值导致了许多问题，包括 Kerberos 和
    NFS 中的漏洞 [Veneam 1996]。


    如果将随机值用于加密目的，Linux 内核（自 3.30 版本起）从设备驱动程序和其他源收集环境噪声到熵池中。当作为 /dev/random 访问时，调用将阻塞直到收集到额外的噪声。当作为
    /dev/urandom 访问时，即使熵池耗尽，也会返回请求的许多字节。PRNG 的问题在于它们不适用于安全领域。大多数线性同余随机数生成器速度很快，但具有可预测的属性，其下一个值通过
    (ax+b) mod m 计算得出。如果在 Linux 上用于加密目的（例如生成密钥），请使用 /dev/random。在系统 random(4) 中有更多信息。你可能考虑在输出上使用密码学哈希函数（例如
    SHA-1）。即使 PRNG 证明是可猜测的，这意味着攻击者现在还必须破解哈希函数。


    如果你必须自己实现一个强大的 PRNG，一个良好的密码学强且无专利限制的 PRNG 选择是 Yarrow 算法；你可以通过 http://www.counterpane.com/yarrow.html
    了解更多。其他 PRNG 可能很有用，但广泛使用的 PRNG 存在已知弱点，这些弱点取决于你的应用程序可能重要或不重要。在自己实现 PRNG 之前，请参考文献，如
    [Kelsey 1998] 和 [McGraw 2000a]。


    ## 10.3. 在用户内存中特殊保护秘密（密码和密钥）


    如果你的应用程序必须处理密码或非公钥（例如会话密钥、私钥或密钥），请在使用后立即覆盖它们，以减少暴露时间。例如，在 Java 中，不要使用 String 类型存储密码——String
    是不可变的（它们在垃圾回收和重用之前不会被覆盖，可能是在以后）。相反，在 Java 中使用 char[] 存储密码，这样就可以被立即覆盖。


    此外，如果你的程序处理此类秘密值，请确保禁用创建转储（通过 limit）。否则，攻击者可能停止程序并在数据转储中找到秘密值。此外，注意——通常进程可以通过调试器的调用监控其他进程（例如通过
    ptrace(2) 和 /proc 伪文件系统）[Veneam 1996]。如果进程是 setuid 或 setgid，内核通常防止这些监控程序（在少数没有这种功能的旧系统中，你真的没有其他方法可以保护自己）。因此，如果你的进程管理秘密值，你应该让它设置为
    setgid（到另一个非特权组或用户），以强行抑制这种监控。


