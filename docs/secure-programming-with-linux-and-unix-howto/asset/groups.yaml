    ## 6.1. 遵循良好的软件工程原则编写安全程序


    Saltzer [1974] 以及随后的 Saltzer 和 Schroeder [1975] 列出了以下安全保护系统的设计原则，这些原则仍然有效：


    - *最小权限原则*。每个用户和程序都应该以尽可能少的权限运行。这一原则限制了事故、错误或攻击造成的破坏。它减少了特权程序之间潜在的交互次数，从而降低了无意、非自愿或不当使用权限的概率。这一思想可以扩展到程序的内部：只有程序中需要这些权限的最小部分才拥有它们。有关如何实现这一点，请参见第
    6.3 节。


    - *机制经济性/简单性原则*。保护系统的设计应该尽可能简单且精小。正如他们所说，“对软件进行逐行检查以及对实现保护机制的硬件进行物理检查等技术是必要的。为了让这些技术成功，简单而小的设计至关重要。”这有时被称为“KISS”原则（“保持简单，愚蠢如此”）。


    - *开放设计原则*。保护机制不能依赖于攻击者的无知。相反，机制应该是公开的，依赖于少数（且易于更改）的项目（如密码或私钥）的机密性。开放设计使得广泛的公开审查成为可能，也让用户能够说服自己使用的系统是足够的。坦率地说，对于广泛分发的系统，保持机密是不现实的：反汇编译器和被破坏的硬件可以迅速暴露实现中的任何“秘密”。Blue
    认为，聪明的工程师“对任何与安全相关的东西都要求开源”，并确保其获得广泛审查，并修复任何发现的问题 [Schneier 1999]。


    - *完全中介原则*。每次访问尝试都必须经过检查；设计机制的位置应使其无法被绕过。例如，在客户端-服务器模型中，服务器必须执行所有的访问检查，因为用户可以构建或修改自己的客户端。这是整个
    4 章以及第 6.2 节的要点。

    - *失效安全默认原则（例如基于权限的方法）*。默认设置应为拒绝服务，保护方案应识别允许访问的条件。更多信息请参见第 6.5 节和第 6.6 节。

    - *权限分离原则*。理想情况下，对对象的访问应取决于多个一个条件，这样攻破一个保护系统也不会获得完全访问权限。

    - *最小共同机制原则*。最少共享机制的数量和使用（例如使用 `/tmp` 或 `/var` 目录）。共享对象为信息流和无意交互提供了潜在的危险通道。更多信息请参见第
    6.7 节。

    - *心理可接受性/易用性*。人机界面必须易于使用，以便用户能够例行且自动地正确使用保护机制。如果安全机制与用户对其保护目标的心理预期密切匹配，错误将会减少。


    ## 6.2. 保护接口


    接口应该是极简的（尽可能简单）、狭窄的（仅提供所需的函数）且不可绕过的。信任应降到最低。考虑限制用户可见的数据。可以使用应用程序和数据查看器来显示外部开发的文件。


    ## 6.3. 最小化权限


    如前所述，一个通用原则是程序应拥有完成工作所需的最少权限（这被称为“最小权限”）。这样，如果程序被破坏，其损害就会受到限制。其中最重要的部分是确保程序拥有的权限不超过其所需的。


    ### 6.3.1. 最小化权限


    最有效的技术可能是简单地最小化已授予的权限。特别是，尽可能避免授予 root 权限。如果你必须给程序 root 权限，请考虑使用 Linux 2.2 及更高版本中提供的
    POSIX 能力功能，在程序启动时立即最小化这些权限。通过在启动后立即调用 `cap_set_proc(3)` 或 Linux 特有的 `capset(3)`
    常例，你可以将程序的能力永久减少到它仅所需的能力。注意，并非所有 Unix 类系统都实现了 POSIX 能力，因此这是一种可能会丢失移植性的方法；但是，如果你仅在可用的地方将其作为可选的安全措施使用，那么这种方法并不会真正限制移植性。此外，虽然
    Linux 内核版本 2.2 及更高版本包含了低级调用，但方便使用的 C 级库在某些 Linux 发行版中并未安装，这使得 Linux 实现 POSIX 能力变得复杂，请参见
    http://linux.kernel.org/pub/linux/libs/security/linux-privs。


    另一种技术是使用 chroot(2) 来限制程序可见的文件系统。这为进程创建一个受限的环境，防止其访问目录之外的文件。然而，如果程序拥有 root 权限，chroot
    并不是一个完整的安全边界。

