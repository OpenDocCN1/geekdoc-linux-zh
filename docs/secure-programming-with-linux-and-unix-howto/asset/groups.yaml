    ## 7.3. 仅调用为程序员设计的接口


    仅调用旨在供程序使用的应用程序编程接口（API）。通常，一个程序可以调用任何其他程序，包括那些真正为人机交互设计的程序。然而，以人类人类的方式调用为人机交互设计的程序通常是不明智的。问题在于，程序的人机界面刻意设计了丰富的功能，并且往往难以完全控制。正如第
    7.2 节所述，交互式程序通常具有“退出”代码，这可能允许攻击者执行不希望的功能。此外，交互式程序通常尝试直觉判断“最可能”的默认值；这可能不是你预期的默认值，攻击者可能会发现利用这一点的方法。


    通常你不应该调用的程序示例包括 mail、mailx、ed、vi 和 emacs。至少，在不检查它们的输入格式的情况下，不要调用它们。


    通常会有参数可以让你更安全地访问程序的功能，或者有专门供程序使用的不同 API 或应用程序；请使用这些来替代旧方法。例如，在可能的情况下，不要调用文本编辑器来编辑某些文本（如
    ed、vi 或 (emacs)），而应使用 sed。


    ## 7.4. 检查所有系统调用返回值


    每个可能返回错误状态的系统调用都必须检查该错误状态。原因之一是几乎所有的系统调用都需要有限的系统资源，而用户通常可以通过各种方式影响资源。Suid/setgid
    程序通过 `setrlimit(3)` 和 `nice(2)` 等调用受到限制。服务器程序和 CGI 脚本的外部用户可能通过发送大量并发请求来导致资源耗尽。如果无法优雅地处理错误，则如前文所述，直接失败。


    ## 7.5. 避免使用 vfork(2)


    在 Unix 类系统中，创建新进程的可移植方法是使用 `fork(2)` 调用。BSD 引入了变体 `vfork(2)` 作为一种优化技术。在 `vfork(2)`
    中，与 `fork(2)` 不同，子进程在调用 `execve(2)` 或发生退出之前借用父进程的内存和控制线程；当子进程使用其资源时，父进程会被挂起。其原理是在旧旧的
    BSD 系统中，`fork(2)` 实际上会导致内存复制，而 `vfork(2)` 则不会。Linux 从未遇到过这个问题；因为 Linux 内部使用了写时拷贝（copy-on-write）语义，Linux
    仅在页面更改时才复制页面（实际上仍然有一些表格必须复制；在大多数情况下，它们的开销并不显著）。尽管如此，某些程序依赖 `vfork(2)`，最近实现了 BSD
    的 `vfork(2)` 语义（之前 `vfork(2)` 是 `fork(2)` 的别名）。


    `vfork(2)` 存在许多问题。从可移植性的角度来看，`vfork(2)` 的问题在于进程不干扰其父进程实际上非常困难，特别是在高级语言中。“不干扰”的要求适用于生成的实际机器代码，而许多编译器会生成隐藏的临时变量和其他代码结构，导致意外的干扰。结果是：使用
    `vfork(2)` 的程序在代码变化甚至编译器版本发生变化时很容易失败。


    对于安全程序，在 Linux 系统上情况更糟，因为 Linux（至少从 2.2 版本到 2.2.17 版本）受到 `vfork(2)` 实现中竞态条件的漏洞。如果一个特权进程在
    Linux 中使用 `vfork(2)/execve(2)` 对来执行用户命令，此时存在一个 UID，但尚未进入 `execve(2)`。用户可能向此进程发送信号，包括
    `SIGSTOP`。根据 `vfork(2)` 的语义，特权父进程随后也会被阻塞。结果是，非特权进程会导致特权进程停止，导致特权进程服务的拒绝服务。FreeBSD
    和 OpenBSD 至少必须专门处理这个问题，因此据我所知，它们并不容易受到此问题的影响。我要感谢 Solar Designer，他在 2000 年 10
    月 7 日在“security-audit”邮件列表中注意到并记录了 Linux 中的这一问题。


    `vfork(2)` 的底线非常简单：不要在你的程序中使用 `vfork(2)`。这不应该是件难如登天的的事；`vfork(2)` 的主要用途是支持需要 `vfork`
    语义的旧程序。


    ## 第 7 章 谨慎地调用其他资源


    ## 7.6. 在检索嵌入内容时应对 Web 虫（Web Bugs）


    某些数据格式可以嵌入对内容的引用，这些内容在查看数据时会自动检索（无需等待用户选择）。如果可能通过互联网（例如通过万维网）导致这些数据被检索，那么就有可能利用这种能力在读者不知情的情况下获取有关读者的信息，并在某些情况下强迫读者在未经其同意的情况下执行活动。这种隐私担忧有时被故意称为“Web
    虫（web bug）”。


    Web 虫是故意插入文档中的代码，由内容作者用于跟踪文档被阅读的情况（以及阅读频率）。作者还可以观察被植入“虫”的文档是如何从一个人传递给另一个人，或从一个组织传递到另一个组织的。


    HTML 格式已经存在这个问题一段时间了。根据隐私基金会 (http://www.privacyfoundation.org)：


    > Web 虫被互联网广告公司广泛用于网页和基于 HTML 的电子邮件邮件中进行跟踪。它们通常大小为 1x1 像素，以便在屏幕上不可见，从而掩盖其被使用的的事实。


    更令人担忧的是，其他格式似乎也具有这种能力。当从网络浏览器查看 HTML 时，存在其他获取信息的方法。然而，对于许多格式，读取文档是可以监控的。例如，最近确定
    Microsoft Word 支持 Web 虫；请参见公告 (http://www.privacyfoundation.org/advisories/advBugs.html)。正如他们的公告所提到的，最新版本的
    Microsoft Excel 和 PowerPoint 也可以被植入虫。在某些情况下，cookie 可以被用来获取更多信息。


    131


    如果你的用户重视隐私，你可能希望限制文件的自动下载。一个例外可能是文件本身正在被下载（例如，通过网络浏览器）。


    ## 7.7. 隐藏敏感信息


    敏感信息在输入、输出以及存储在系统时，都应该对窥探的眼睛隐藏。敏感信息无疑包括信用卡号、账户余额和家庭地址，在许多应用程序中还包括姓名、电子邮件地址和其他私人信息。


    基于 Web 的应用程序应对与用户之间包含敏感信息的通信；通常的方法是使用 https: 协议（基于 SSL 或 TLS 的 HTTP）。根据 HTTP 1.1
    规范（IETF RFC 2616 第 15.1.3 节），使用 HTTP 协议的服务在使用 GET 表单提交敏感数据，因为这会导致数据被编码在 Request-URI
    中。许多现有的服务器、代理和用户代理会将请求 URI 记录在第三方可能可见的地方。相反，请使用 POST 提交，它是为了这一目的设计的。


    此类敏感数据的数据库在任何存储设备上（如磁盘上的文件）都应该进行加密。当然，这种加密无法防止攻击者破解安全应用程序，因为显然应用程序必须有访问加密数据的方法。然而，它对于那些获取了数据备份磁盘但没有解密密钥的攻击者提供了一些防御。如果攻击者未能攻破应用程序，但成功部分攻破相关系统以查看存储的数据，它也提供了一些防御——再次，他们必须破解加密算法才能获取数据。在许多情况下，数据会被无意中传输（例如核心转储文件），这可以防止这种情况。值得注意的是，这种防御并不是你想象的那么强大，因为通常服务器本身可以被破坏或破解。


