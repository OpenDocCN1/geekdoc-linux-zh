    在 Unix-like 系统中是通用的。事实上，Open Group 的《Single Unix Specification》第 2 版对 chmod(3)
    允许系统忽略对非可执行文件开启 setgid 的请求，如果此类设置没有意义。在 Linux 和 Solaris 中，如果目录上开启了 setgid，则在该目录中创建的文件，其
    GID 将自动重置为该目录的 GID。这种方法的目的是支持“项目目录”：用户可以将文件保存到此类设置了特殊权限的目录中，组所有者会自动更改。然而，诸如《Single
    Unix Specification》[Open Group 1997] 等标准并未规定在目录上设置 setgid。


    - 为每个文件系统对象都存储了时间戳和修改时间。然而，允许所有者任意设置这些值（参见 `touch(1)`），因此请务必谨慎信任这些信息。所有 Unix-like
    系统都支持此特性。


    以下是 ext2 文件系统上 Linux 特有的扩展，尽管许多其他文件系统也具有类似的功能：


    - 不可变位（immutable bit）——不允许对文件系统对象进行任何更改；只有 root 用户可以设置或清除此位。这仅由 ext2 支持，无法移植到所有
    Unix 系统（甚至不是 Linux 文件系统）。

    - 仅追加位（append-only bit）——仅允许对文件系统对象进行追加；只有 root 用户可以设置或清除此位。这仅由 ext2 支持，无法移植到所有
    Unix 系统（甚至不是 Linux 文件系统）。


    其他常见的扩展还包括某种指示“无法删除此文件”的位位。这些值中的许多项可以在挂载时受到影响，例如，某些位可以被视为具有某个特定值（无论它们在介质上的实际值如何）。更多信息请参阅
    `mount(1)`。某些文件系统不支持这些访问控制值的某些；同样，Unix-like 系统支持 MS-DOS 磁盘，而这些磁盘默认只支持这些属性中的极少部分（且它们并不是定义这些属性的标准方法）。在这种情况下，Unix-like
    系统会模拟标准属性（可能通过特殊的磁盘文件实现它们），而这些属性通常受 `mount(1)` 命令的影响。


    需要注意的是，对于添加和删除文件，只有文件目录的权限位和所有者真正起作用，除非该 Unix-like 系统支持更复杂的方案（如 POSIX ACL）。除非系统有其他扩展，否则原生的
    Linux 2.2 不具备；一个在其权限位中没有权限的文件，只要其所在的目录允许，仍然可以被删除。此外，如果父目录允许某些用户或组更改子目录，那么该目录的任何后代都可以被该用户或组替换。


    IEEE POSIX 标准草案定义了一种用于真 ACL 的技术，它支持一个用户和组列表及其权限。遗憾的是，这并没有被广泛支持，而且在 Unix-like 系统中的实现方式也不相同。例如，原生的
    Linux 2.2 在文件系统中既没有 ACL 也没有 POSIX 权限值。


    值得注意的是，在 Linux 中，ext2 文件系统默认为 root 用户预留了一小部分空间。这是针对拒绝服务攻击的部分防御；如果用户填满了与 root 用户共享的磁盘，root
    用户将留有一点空间（例如用于关键函数）。默认值是文件系统空间的 5%；请参见 `mk2fs(8)`，特别是其“m”选项。


    ## 3.2.2. 创建时间初始值


    在创建时，适用以下规则。在大多数 Unix 系统上，当通过 `create(2)` 或 `open(2)` 创建新的文件系统对象时，FSO 被设置为进程的
    EUID，FSO 的 GID 被设置为进程的 EGID。由于 FSUID 扩展，Unix 的工作略有不同：FSO 的 UID 被设置为进程的 FSUID，FSO
    GID 被设置为进程的 FSGUID；如果父目录的 set 位被设置，或者文件系统的“GRPID”标志被设置，则 FSO GID 实际上被设置为父目录的 GID。包括
    Sun Solaris 和 Linux 在内的许多系统也支持 setdirectory 扩展。如前所述，这种特殊支持支持“项目”目录：要创建一个“项目”目录，为该项目创建一个特殊组，创建一个由该组所有的项目目录，然后将该目录设置为
    setgid：放置在那里的文件将自动归该组所有。

