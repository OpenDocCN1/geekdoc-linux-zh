    默认情况下，环境变量继承自父进程。然而，当一个程序执行另一个程序时，调用程序可以将环境变量设置为任意值。这对 setuid/setgid 程序是危险的，因为调用者可以完全控制它们接收到的环境变量。由于它们通常是继承的，这具有传递性；安全程序可能会调用其他程序，并在没有特殊措施的情况下向程序传递危险的环境变量。后续章节讨论了环境变量以及如何处理它们。


    ### 4.2.1. 环境变量很危险


    某些环境变量是危险的，因为许多库和程序以晦晦、微妙或未文档的方式受环境变量控制。例如，IFS 被 `sh` 和 `bash` shell 用于分隔命令行参数。由于
    shell 是由几个底层调用（如 C 中的 `system(3)` 和 `popen(3)`）调用的，设置 IFS 为异常的值是安全的调用。这种行为在 bash
    和 sh 中都有记录，但它是晦晦的；许多用户只知道它破坏了安全性。糟糕糟糕并不是所有环境变量都有记录，即使有，其他程序可能会环境变量。因此，唯一的解决方案（下文描述）是选择你需要的并丢弃其余。


    ### 4.2.2. 环境变量存储格式很危险


    通常，程序应该使用标准例函数访问环境变量。例如，在 C 中，你应该使用 `getenv(3)` 获取值，使用 POSIX 标准例函数 `putenv(3)`
    或 BSD 扩展 `setenv(3)` 设置它们，并使用 `unsetenv(3)` 消除环境变量。我在这里应该注意到 `setenv(3)` 在 Linux
    中也是实现的。


    然而，攻击者并不总是友好；攻击者可以使用 `execve(2)` 直接控制传递给程序的环境变量区域。这允许了一些攻击，只有通过理解环境变量如何工作才能理解。在
    Linux 中，你可以查看 `environ(5)` 关于环境变量如何工作的总结。简而言之，环境变量内部存储指向字符数组的指针；该数组按顺序存储并由 NULL
    指针结束。字符指向“NAME=value”格式的 NULL 终止字符串。这有几个影响，例如环境变量名不能包含等号。然而，这种格式更危险的影响是它允许具有相同变量名但不同值（例如
    SHELL 的多个值）。虽然典型的命令 shell 禁止这样做，但攻击者可以使用 `execve(2)` 创建这种情况。


    这种存储格式（设置环境变量的方式）的问题在于，程序可以检查这些值之一（以查看它是否有效）但使用另一个。在 Linux 中，GNU 库保护程序不受此；glibc
    2.1 的 `getenv` 实现总是获取第一个匹配项，`setenv` 和 `putenv` 总是设置第一个匹配项，而 `unsetenv` 实际上取消所有匹配项（祝贺
    GNU 的实现者实现了 unsetenv！）。然而，某些程序直接访问 `environ` 变量并遍历所有环境变量；在这种情况下，它们可能会使用第一个匹配项的最后一个。结果是，如果针对第一个匹配项检查但实际使用的是最后一个匹配项，攻击者可以使用这一事实绕过保护函数。


    ### 4.2.3. 解决方案 - 提取与清除


    对于安全的 setuid/setgid 程序，所需的少量环境变量列表（如果有）应该仔细提取。然后，通过将一组环境变量设置为安全值来清除整个环境。在 C/++
    中清除环境简单方法是将全局变量 `environ` 设置为 NULL。全局变量 `environ` 定义在 `<unistd.h>` 中；C++ 其他需要包含此头文件。你需要在创建线程之前处理这些操作，但这通常不是问题，因为你希望在程序执行的极早阶段进行这些操作。另一种方法是使用未文档的
    `clearenv()`；`clearenv()` 有着久的历史；它本应在 POSIX.1 中定义，但从未进入该标准。然而，它在 Linux 中有准官方状态。在
    Linux 中，`clearenv()` 定义在 `<stdlib.h>` 中，因此在 `#include` 之前必须确保定义 `_USE_MISC`。一种稍微“官方”的方法是通过
    `#define _SVID_SOURCE` 或 `_BSD_SOURCE` 来定义 `_USE_MISC`，然后包含 `<features.h>` ——
    这些是官方特性宏。诚实地说，我同意 `environ` 的方法；操作底层组件可能是不可移植的，但它确保你获得一个干净且（安全）的环境。在以后需要访问整组变量的稀有情况下，你可以将“environ”变量的值保存在某处，但这并非必须；几乎所有程序只需要几个值，其余可以销毁。


    你几乎会重新添加 PATH，即搜索程序的目录列表；PATH 不应包含当前目录，通常是类似 "/bin:/usr/bin" 的简单内容。通常你还会设置 IFS（其默认值为
    "\n"）和 TZ（时区）。如果你不提供 IFS 或 TZ，Linux 不会崩溃，但某些基于 System V 的系统如果不提供 TZ 值就会出现问题，而且据传某些
    shell 需要设置 IFS 值。参见 `environ(5)` 获取你可能设置的常见环境变量列表。

