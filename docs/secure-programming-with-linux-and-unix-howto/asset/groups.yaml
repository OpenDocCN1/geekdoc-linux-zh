    ## 4.11. 禁止使用 HTTP GET 执行非查询操作


    对输入进行过滤可能是一个更好的主意。


    使用 HTTP 的 Web 应用程序应该防止将 HTTP “GET”或“HEAD”方法用于查询以外的任何操作。HTTP 许多不同的方法，其中最流行的两种方法是
    GET 和 POST。GET 和 POST 都可以用于从表单传输数据，但 GET 方法在 URL 中传输数据，而 POST 方法则分离开传输数据。


    使用 GET 执行非查询操作（如更改数据、转账或注册服务）的安全问题是：攻击者可以创建一个包含带有恶意数据的 URL 的超文本链接。如果攻击者诱导受害者点击该链接（对于超文本链接而言），或者仅仅查看一个页面（对于
    HTML 中 `img` 标签的图像等嵌入信息而言），受害者将执行 GET 请求。当执行 GET 请求时，攻击者创建的所有数据都将发送到受害者指定的链接处。正如第
    6.11 节讨论的，这是一种跨站恶意内容攻击。


    如果跨站恶意内容攻击唯一执行的操作只是让用户查看意料之外的数据，那么这个问题就不那么严重。当然，这仍然是一个问题，因为某些攻击可以使用这种能力来实现。例如，由于用户请求了意料之外的内容可能会导致潜在的隐私损失；由于看似请求非法或犯罪材料而可能产生现实世界的影响；或者通过让用户以某些方式请求信息，可能导致信息以其通常不会暴露的方式泄露给攻击者。然而，如果恶意攻击者能够通过跨站链接不仅能查看数据，还能更改数据，就会造成更严重的后果。


    典型的 HTTP 接口（如 CGI 库）通常会隐藏 GET 和 POST 之间的差异，因为对于获取数据来说，用“同一种方式”处理这些方法是有用的。然而，对于实际上引起除数据查询以外的操作，请检查请求是否为
    POST 以外的方法；如果是，只需显示一个填充了给定数据的表单，并要求用户确认他们确实想要执行该请求。这可以防止跨站恶意内容攻击，同时仍为用户提供了通过单击确认操作的便利性。


    事实上，HTTP 规范强烈建议这种行为。根据 HTTP 1.1 规范（IETF RFC 2616 第 9.1.1 节，“GET 和 HEAD 方法不应该具有执行检索之外的操作的意义。这些方法应当被视为‘安全’的。”这允许用户以特殊方式表示其他方法（如
    POST、PUT 和 DELETE），从而让用户意识到正在请求一个可能不安全的操作。）


    ## 4.12. 限制有效输入时间和负载水平


    设置超时和负载水平限制，特别是针对传入的网络数据。否则，攻击者可能通过不断请求服务来轻易地导致拒绝服务。


    # 注意事项


    -   1. 从技术上讲，超文本链接可以是任何“统一资源标识符”（URI）。“统一资源定位符”（URL）一词是指 URI 的子集，它通过资源首要访问机制的表示来标识资源（例如，通过其网络（“位置”），而不是通过名称或该资源的某些属性来标识资源）。许多人将“URL”与“URI”同义化使用，因为
    URL 是最常见的 URI 类型。例如，URI 中使用的编码实际上被称为“URL 编码”。


