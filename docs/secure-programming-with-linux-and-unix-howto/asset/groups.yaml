    # Chapter 10. Special Topics


    convention for escaping these characters. I''m partial to the URL escaping mechanism
    (%hh where hh is the hexadecimal value of the escaped byte) but there are others
    including the C convention \ooo for the octal value and \X where X is a special
    symbol, e.g., ''\n for newline. There''s also the caret-system ''^I is control-I,
    though that doesn''t handle byte values over 127 gracefully.


    There is the danger that a user could create a denial-of-service attack (or at
    least auditing) by performing a very large number of events that can count audit
    record the system runs out of resources to store. An approach to counter this
    threat is to rate-limit audit recording; intentionally slow down the response
    rate if "too many" audit records are being cut. You could try to slow the response
    rate only to the suspected attacker, but in many situations a single attacker
    can masquerade as potentially many users.


    Selecting what is "suspicious activity" is, of course, dependent on what the program
    and its anticipated use. If failing the filters discussed earlier is certainly
    a candidate (e.g., containing NIL). Inputs that could not from normal should be
    properly logged, e.g., a CGI program where required fields are missing in suspicious
    ways. Any input with phrases like /etc/passwd or /etc/shadow or the like is very
    suspicious in many cases. Similarly, trying to access Windows "registry" files
    or .pwl files is very suspicious.


    If you have a built-in scripting language, it may be possible for the language
    to set an environment variable which adversely affects the program invoking the
    script. Defend against this.


    If you need a complex configuration language, make sure the language has a comment
    character and include a number of commented-out secure examples. Often ''#'' is
    used for commenting, meaning "the rest of this line is a comment"


    If possible, don''t create setuid or setgid root programs; make the user log in
    as root instead.


    Sign your code. That way, others can check to see if what''s available what was
    sent.


    Consider statically linking secure programs. This counters attacks on the dynamic
    library mechanism by making sure that the secure programs don''t use it.'
