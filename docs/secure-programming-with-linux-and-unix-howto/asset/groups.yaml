    ## 5.2.5. Libsafe


    Arash Baratoo, Timothy Tsai, and Navjot Singh (of Lucent Technologies) have developed
    Libsafe, a wrapper of several library functions known to be vulnerable to stack
    smashing attacks. This wrapper (which they call a kind of "middleware") is a simple
    dynamically loaded library that contains modified versions of C library functions
    such as strcpy(3). These modified versions implement the original functionality,
    in a manner that ensures any buffer overflows are contained within the current
    stack frame. Their initial performance analysis suggests that this library’s overhead
    is very small. Libsafe papers and source code are available at http://www.bell-labs.com/1135cs/libsafe.html.
    The Libsafe source code is available under the completely open source GPL license,
    and there are indications that many Linux distributors are interested in using
    it.


    Libsafe''s approach is somewhat useful. Libsafe should certainly be considered
    for inclusion by Linux distributors, and its approach is worth considering by
    others as well. However, as a software developer, Libsafe is a useful mechanism
    to support defense-in-depth but it does not really prevent buffer overflows. Here
    are several reasons why you shouldn''t depend on Libsafe during code development:


    - Libsafe protects a small set of functions with buffer overflow issues. At the
    time of this writing, this list is significantly shorter than the list of functions
    in this book known to have. It also won''t protect against code you write yourself
    (e.g., in a loop) that causes buffer overflows.

    - Even if libsafe is installed in a distribution, the way it is installed impacts
    its use. The documentation recommends setting LD_PRELOAD to cause libsafe''s protections
    to be enabled, but the problem is that users can unset this environment variable...
    causing the protection to be disabled for programs they execute!

