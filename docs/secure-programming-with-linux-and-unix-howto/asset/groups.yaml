    缓冲区溢出问题是支持使用 Perl、Python、Java 和 Ada95 等其他编程语言的有力论点。毕竟，今天使用的几乎所有其他编程语言（汇编语言除外）防止缓冲区溢出。当然，使用这些其他语言并不能消除所有问题；特别请参考第
