    This book is a summary of what I believe are the most useful and important guidelines;
    my goal is a book that a good programmer can just read and then be well prepared
    to implement a secure program. No single document can really meet this goal, but
    I believe the goal is to strike a balance somewhere between a “complete list of
    all possible guidelines” (that would be unending and unreadable) and the various
    “short” lists available on-line that are nice but short omit a large number of
    critical issues. When in doubt, I include the guidance; I believe in case it’s
    better to make the information available to everyone in this “one shop” document.
    The organization presented here is my own (every list has its own, different structure),
    and some of the guidelines (especially the Linux-unique ones, as those on capabilities
