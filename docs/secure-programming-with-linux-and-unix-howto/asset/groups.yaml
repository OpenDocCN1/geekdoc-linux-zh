    The Perl open() function comes with, frankly, "way too much magic" for most secure
    programs; it interprets that, if not carefully filtered, can create lots of security
    problems. Before writing code to open or lock a file, consult the perlopent(1)
    man page. In most cases, sysopen() provides a safer (though more convoluted) approach
    to opening a file. The new Perl 5.6 adds an open() call with 3 parameters to turn
    off the magic without requiring the convolutions of sysopen() (http://www.xray.mpg.mpg/mailing-lists/perl5-porters/2000-003/msg02596.html).


    Perl programs should turn on the warning flag (-w), which warns you of potentially
    dangerous or obsolete statements.


    You can also run Perl programs in a restricted environment. For more information
    the "Safe" module in the standard Perl distribution. I''m uncertain of the amount
    of auditing that this has undergone, beware of depending on this for security.
    You might also investigate the "Penguin Model for Secure Distributed Internet
    Scripting", though at the time of writing the code and documentation seems be
    unavailable.


    # 9.3. Python


    As with any language, beware of any functions that allow data to be executed as
    parts of a program, to make sure an untrusted user can''t affect their input.
    This includes exec(), eval(), and execfile() (and frankly, you should check carefully
    any call to compile().). The input() statement is also surprisingly dangerous.
    [Watters 1996, 150].


    Python programs with privileges to be invoked by unprivileged users (e.g., setuid/setgid
    programs) must not import the "user" module. The user module causes the pythonrc
    file to be read and executed. Since this file would be under the control of an
    untrusted user, importing the user module allows an attacker to force the trusted
    program to run arbitrary code.


