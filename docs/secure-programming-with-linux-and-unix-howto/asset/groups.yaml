    Examples of programs you shouldn''t normally call include mail, mailx, ed, vi,
    and emacs. At the very least, don''t call them without checking their input format.


    Usually there are parameters to give you safer access to the program''s functionality,
    or a different API or application that''s intended for use by programs; use those
    instead. For example, instead of invoking a text editor to edit some text (such
    as ed, vi, or (emacs)), use sed where you can.


    ## 7.4. Check All System Call Returns


    Every system call that can return an error condition must have that error condition
    checked. One reason is that nearly all system calls require limited system resources,
    and users can often affect resources in a variety of ways. Suid/setgid programs
    have limits on them through calls such as setrlimit(3) and nice(2). External users
    of server programs and CGI scripts may be able to cause resource exhaustion by
    making a large number of simultaneous requests. If the error cannot be handled
    gracefully, then fail as discussed earlier.


    ## 7.5. Avoid Using vfork(2)


    The portable way to create new processes in Unix-like systems is to use the fork(2)
    call. BSD introduced a variant vfork(2) as an optimization technique. In vfork(2),
    unlike fork(2), the child borrows the parent’s memory and thread of control until
    a call to execve(2) or an exit occurs; the parent process is suspended while the
    child is using its resources. The rationale is that in old BSD systems, fork(2)
    would actually cause memory to be copied while vfork(2) would not. Linux never
    had this problem; because Linux used copy-on-write semantics internally, Linux
    only copies pages when they changed (actually, there are still some tables that
    have to be copied; in most circumstances their overhead is not significant). Nevertheless,
    some programs depend on vfork(2), recently implemented the BSD vfork(2) semantics
    (previously vfork(2) had an alias for fork(2)).


    There are a number of problems with vfork(2). From a portability point-of-view,
    the problem with vfork(2) is that it’s actually tricky for a process not to interfere
    with its parent, especially in high-level languages. The “not interfering” requirement
    applies to the actual machine code generated, and many compilers generate hidden
    temporaries and other code structures that cause unintended interference. The
    result: programs using vfork(2) can easily fail when the code changes or even
    when compiler versions change.


    For secure programs it gets worse on Linux systems, because Linux (at least 2.2
    versions through 2.2.17) is vulnerable to a race condition in vfork(2)’s implementation.
    If a privileged process uses a vfork(2)/execve(2) pair in Linux to execute user
    commands, there’s a UID, but hasn’t entered execve(2) yet. The user may be able
    to send signals, including SIGSTOP, to this process. By the semantics of vfork(2),
    the privileged parent process would then be blocked as well. As a result, an unprivileged
    process could cause the privileged process to halt, resulting in a denial-of-service
    of the privileged process service. FreeBSD and Open, at least, have to specifically
    deal with this, so to my knowledge they are not vulnerable to this problem. My
    thanks to Solar Designer, who noted and documented this problem in Linux on the
    “security-audit” mailing list on October 7, 2000.


    The bottom line with vfork(2) is simple: don’t use vfork(2) in your programs.
    This shouldn’t be difficult; the primary use of vfork(2) is to support old programs
    needed vfork''s semantics.


    ## Chapter 7. Carefully Call Out to Other Resources


    ## 7.6. Counter Web Bugs When Retrieving Embedded Content


    Some data formats can embed references to content that is automatically retrieved
    when the data is viewed (not waiting for a user to select it). If it’s possible
    to cause this data to be retrieved through the Internet (e.g., through the World
    Wide Web), then there is a potential to use this capability to obtain information
    about readers without the readers’ knowledge, and in some cases to force the reader
    to perform activities without the reader’s consent. This privacy concern is intentionally
    sometimes called a “web bug.”


    In a web bug, a intentionally inserted into a document and used by the content
    author to track (and how often) a document is being read. The author can also
    watch how a “bugged” document is passed from one person to another or from one
    organization to another.


    The HTML format has had this issue for some time. According to the Privacy Foundation
    (http://www.privacyfoundation.org):


    > Web bugs are used extensively by Internet advertising companies on Web pages
    and in HTML-based email messages for tracking. They are typically 1-by-1 pixel
    in size to make them invisible on the screen to disguise the fact that they are
    used for.


    What is more concerning is that other formats seem to have such capability. When
    viewing HTML from a web browser, there are other ways of getting information.
    However, for many formats, reading a document can be monitored. For example, it
    has recently determined that Microsoft Word can support web bugs; see the advisory
    (http://www.privacyfoundation.org/advisories/advWordBugs.html). As noted in their
    advisory, recent versions of Microsoft Excel and Microsoft PowerPoint can also
    be bugged. In some cases, cookies can be used to obtain even more information.


    131


    If your users value their privacy, you probably will want to limit the automatic
    downloading of included files. One exception might be when the file itself is
    being downloaded (say, via a web browser); downloading other files from the same
    location at time.


    ## 7.7. Hide Sensitive Information


    Sensitive information should be hidden from prying eyes, both while being input
    and output, and when stored in the system. Sensitive information certainly includes
    credit card numbers, account balances, and home addresses, and in many applications
    includes names, email addresses, and other private information.


    Web-based applications should encrypt all communication with a user that includes
    sensitive information; the usual way is to use the https: protocol (HTTP over
    SSL or TLS). According to the HTTP 1.1 specification (IETF RFC 2616 section 15.1.3),
    authors of services which use the HTTP protocol should not use GET forms for the
    submission of sensitive data, because this will cause this data to be encoded
    in the Request-URI. Many existing servers, proxies, and user agents will log the
    request URI in some place where it might be visible to third parties. Instead,
    use POST-based submissions, which are intended for this purpose.


    Databases of such sensitive data should be encrypted on any storage device (such
    as files on a disk). This encryption doesn''t protect against an attacker breaking
    the secure application, of course, since obviously the application has to have
    a way to access the encrypted data. However, it does provide some defense against
    attackers who manage to get backup disks of the data but not the keys to decrypt
    them. It also provides some defense if an attacker does not manage to break into
    an application, but manages to partially break into a related system enough to
    view the stored data - again, now they have to break the encryption algorithm
    to get the data. There are many circumstances where data can be transferred unintentionally
    (e.g., core files), which this prevents. It''s worth noting, however, that this
    is not a strong defense as you''d think, because often the server itself can be
    subverted or broken.

