  - '[PAGE 143]


    limit privilege in a program even when the code has not been provided externally.
    By default, a restricted execution environment permits reading (but not writing)
    of files, and does not include operations for network access or GUI interaction.
    These defaults can be changed, but beware of loopholes in the restricted environment.
    In particular, allowing a user to unrestricted add attributes to a class permits
    all sorts of ways to subvert the environment because Python implementation calls
    "hidden" methods. Note that, by default, Python objects are passed by reference;
    if you insert a reference to a mutable value into a restricted program''s environment,
    the restricted program can change the object in a way that visible outside the
    restricted environment! Thus, if you want to access to a mutable value, in many
    cases you should copy the mutable value or use the Bastion module (which supports
    restricted access to another object). For more information, see Kuchling [2000].
    I am uncertain of the amount of auditing that the restricted execution capability
    has undergone, so programmer beware.


    # 9.4. Shell Scripting Languages (sh and csh Derivatives)


    I strongly recommend against using standard command shell scripting languages
    (such as csh, sh, and bash) for setgid secure code. Some systems (such as Linux)
    completely disable them, so you''re creating an unnecessary portability problem.
    On some old systems they are fundamentally insecure due to a race condition (as
    discussed in Section 3.1.3). Even for other systems, they''re not really a good
    idea. Standard command shells are still notorious for being affected by nonobvious
    inputs - generally command shells were designed to do things “automatically" for
    an interactive user, to defend against a determined attacker. For example, "hidden"
    environment variables (e.g., the ENV or BASH_ENV variable) can affect how they
    operate or execute arbitrary user-defined code before the script can execute.
    Even things like filenames of the executable or directory contents can affect
    things. For example, on Bourne shell implementations, doing the following will
    grant root access (thanks to NCSA for describing this exploit):


    ```

    % ln -s /usr/bin/setuid-shell /tmp/-x

    ```'
