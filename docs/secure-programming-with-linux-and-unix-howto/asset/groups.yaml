    \ URL 参数、表单数据、cookies、数据库查询、CORBA ORB 结果以及存储在文件中的用户数据。在许多情况下，过滤和验证应该在输入端进行，但编码可以在输入验证或输出生成期间完成。如果你需要对数据进行分析，可能在输入时进行编码更好（这样它就不会被遗忘）。然而，如果你的程序会处理这些数据，那么在输出时进行编码可能会更简单。CERT\
