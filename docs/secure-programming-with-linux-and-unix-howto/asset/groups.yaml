    # Chapter 3. Summary of Linux and Unix Security Features


    old, non-backward-compatible versions of those libraries. There are also ways
    to override specific libraries or even just specific functions in a library when
    executing a particular program. This is a real advantage of Unix-like systems
    over Windows-like systems; I believe Unix-like systems have a much better system
    for handling library updates, one reason that Unix and Linux systems are reputed
    to be more stable than Windows-based systems.


    On GNU libc-based systems, including all Linux systems, the list of directories
    automatically searched during program start-up is in the file /etc/ld.so.conf.
    Many Red Hat-derived distributions not normally include /usr/local/lib in the
    file /etc/ld.so.conf. I consider this a bug, and adding /usr/local/lib to /etc/ld.so.conf
    is a "fix" required to run many programs on Red Hat-derived systems. If you want
    to override a few functions in a library, but keep the rest of the library, you
    can enter the names of overriding libraries (.o files) in /etc/ld.so.preload;
    where "loading" will take precedence over the standard set. This preload is typically
    used for emergency patches; a distribution usually won''t include such a file
    when delivered. Searching all of these directories at program start-up would be
    too time-consuming, so a caching arrangement is actually used. The program ldconfig()
    reads defaults from the file /etc/ld.so.conf, sets up the appropriate symbolic
    links in the dynamic link directories (so they''ll follow the standard conventions),
    and writes a cache to /etc/ld.so.cache that''s used by other programs. So, ldconfig
    has to be run whenever a DLL is added, when a DLL is removed, or when the set
    of DLL directories changes; running ldconfig is often one of the steps performed
    by package managers when installing a library. On start-up, then, a program uses
    the dynamic loader to read the file /etc/ld.so.cache and load the libraries it
    needs.


    Various environment variables can control this, and in fact there are environment
    variables that permit you to override this process (so, for example, you can temporarily
    substitute a different library for this particular execution). In Linux, the environment
    variable LD_LIBRARY_PATH is a colon-separated set of directories where libraries
    should be searched for, before the standard set of directories; this is useful
    when debugging a new library or using a nonstandard library for special purposes.
    The LD_PRELOAD list object files with functions that override the standard set,
    just as /etc/ld.so.preload does.


