    ## 2.1. History of Unix, Linux, and Open Source / Free Software


    ### 2.1.1. Unix


    1969-1970, Kenneth Thompson, Dennis Ritchie, and others at AT&T Bell Labs began
    developing a small operating system on a little-used PDP-7. The operating system
    was soon christened Unix, a pun on an earlier operating system called MULTICS.
    In 1972-1973 the system was rewritten in the programming language C, an unusual
    step that was visionary: due to this decision, Unix was the first widely-used
    operating system that could switch between and outlive its original hardware.
    Other innovations were added to Unix as well, in part due to synergies between
    Bell Labs and the academic community. In 1979, the "seventh edition" (V7) version
    of Unix was released, the grandfather of all extant Unix systems.


    After this point, the history of Unix becomes somewhat convoluted. The academic
    community, led by Berkeley, developed a variant called the Berkeley Software Distribution
    (BSD), while AT&T developing Unix under the names "System III" and later "System
    V". In the late 1980s to early 1990''s the "wars" between these two major strains
    raged. After many years each variant adopted many of the key features of the other.
    Commercially, System V won the "standards wars" (getting most of its interfaces
    into the formal standards), and most hardware vendors switched to AT&T''s System
    V. However, System V ended up incorporating many BSD innovations, so the resulting
    system was more a merger of the two branches. The BSD branch did not die, but
    instead became widely used for research, for PC hardware, and for single-purpose
    servers (e.g., many web sites use a BSD derivative).


    The result was many different versions of Unix, all based on the original seventh
    edition. Most versions of Unix were proprietary and maintained by their respective
    hardware vendor, for example, Sun Solaris is a variant of System V. Three versions
    of the BSD branch ended up open source: FreeBSD (concentrating on ease-of-installation
    for PC-type hardware), NetBSD (concentrating on many different CPU architectures),
    and a variant of NetBSD, OpenBSD (concentrating on security). More general information
    can be found at http://www.datacentrics.com/tech/unix/uxistry/brf-hist.hm. Much
    more information about the BSD history can be found at http://www.datacentrics.com/tech/unix/uxistry/brf-hist.hm.


    ## 2.1.2. Free Software


    In 1984 Richard Stallman''s Free Software Foundation (FSF) began the project to
    create software that is freely usable, modified, and redistributed. The term "free"
    is short for freedom, not free beer. This book uses the term "free" for its usual
    meaning, that is, software which is freely available for use, modification, and
    redistribution. For information on this definition of free software, and the motivations
    behind it, it can be found at http://www.fsf.org.


    ## 2.1.3. Linux


    In 1991 Linus Torvalds began an operating system, which he named Linux. This book
    uses the term "Unix-like" to describe systems intentionally Unix. In particular,
    the term "Unix-like" includes all major Unix variants and Linux. Note that many
    people use the term “Unix” to describe these systems instead.


    ## 2.1.4. Open Source / Free Software


    The term "open source" is often confused with software whose executables are given
    away at charge, but whose source code cannot be. Conversely, the term "open source"
    is sometimes used to mean software whose source code is visible, but there are
    limitations on use or redistribution. This book uses the term "open source" for
    its usual meaning, that is, software which has source code available for use,
    modification, and redistribution; a more detailed definition is contained in the
    Open Source Definition (http://www.opensource.org/osd.html). In some cases, a
    difference in motive is suggested; those preferring the term "free software" wish
    to strongly emphasize the need for freedom, while using the term may have other
    motives (e.g., higher reliability) or simply wish to appear less strident. Those
    interested in reading advocacy pieces for open source software and free software
    should see http://www.opensource.org and http://www.fsf.org.


    ## 2.1.5. Comparing Linux and Unix


    Unix-like systems share a number of security mechanisms, though there are subtle
    differences and not all systems have all mechanisms. All include user and group
    ids (uids and groups) for each process and a filesystem with read, write, and
    execute permissions (for user, group, and other). See Thompson [1974] and Bach
    [1986] for general information on Unix systems, including their basic security
    mechanisms.

