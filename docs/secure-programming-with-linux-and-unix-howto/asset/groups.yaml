    \n+   5. 永远不要向潜在的恶意代码返回可变对象（因为代码可能会决定更改它）。注意，数组是可变的（即使数组的内容不是可变的），因此不要返回指向包含敏感数据的内部数组引用。\n\
    \n+   6. 永远不要直接存储提供的可变对象（包括对象数组）。否则，用户可能会将安全代码交给用户，“检查”该对象，并在安全代码尝试使用该数据时更改数据。在保存数组之前对其进行克隆（Clone），并在此处小心（例如，提防用户编写的克隆程序）。\n\
    \n+   7. 不要依赖初始化。有几种方法可以分配未初始化的对象。\n\n+   8. 除非有充分理由这样做，否则将所有内容设为 `final`。如果一个类或方法不是\
