    http://www.dnaco.net/~kragen/security-holes.html


    - [SSE-CMM 1999] SSE-CMM 项目. 1999年4月。系统安全工程能力成熟度模型 (SSE CMM) 模型描述文档。版本 2.0。http://www.sse-cmm.

    - [Stein 1999] Stein, Lincoln D. 1999年9月13日。万维网安全常见解答。版本 2.0 http://www.w3.org/Security/Faq/security-faq.html

