    将其发送给其他用户（有关跨站恶意内容的更多信息请参见第 6.11 节）。接下来的章节将讨论如何过滤这种特定的输入，因为处理它是一个非常常见的需求。


    ## 4.10.1. 删除或禁止某些 HTML 数据


    通常用于传输 HTML 的字符是 ISO-8859-1（即使在发送国际文本时也是），因此过滤器也应该忽略控制字符（换行符和制表符通常是安全的）以及高位为 1
    的字符。


    这种方法的一个问题是它可能会让用户感到非常意外，特别是对于输入国际文本的用户来说，如果所有国际文本都被静默地删除。如果无效字符在没有警告的情况下被静默删除，这些数据将不可恢复地丢失，并且以后无法重建。另一种方法是禁止此类字符，并向尝试使用它们的用户返回错误消息。这至少警告了用户，尽管没有提供他们想要的功能。其他替代方案是对这些数据进行编码或验证数据，将在下文中讨论。


    ## 4.10.2. 编码 HTML 数据


    另一种几乎同样安全的方法是转换关键字符，使其在 HTML 中不再具有原有的含义。这可以通过将所有的 "<" 转换为 `&lt;`，将 ">" 转换为 `&gt;`，将
    "&" 转换为 `&amp;` 来完成。任意国际字符可以使用 `&#value;` 格式在 Latin-1 中编码——不要忘记结尾有分号。


    ## 第 4 章 验证所有输入


    编码国际字符意味着你当然必须知道输入编码是什么。


    这里一个可能的危险是，如果这些编码被意外解释了两次，它们就会变成一个漏洞。然而，这种方法至少允许用户看到输入的“意图”。


    ## 4.10.3. 验证 HTML 数据


    某些应用程序为了运行，必须接受来自第三方的 HTML 并将其发送给用户。注意——在这一点上你正处于危险边缘；请确保你真的想这样做。即使是接受任意地方的 HTML
    的想法在某些安全从业人员中也存在争议，因为这很难做到。


    但是，如果你的应用程序必须接受 HTML，并且你认为这种风险是的，至少列出一个“安全”HTML 命令列表并允许这些命令。


    这里是一组基本的安全的 HTML 标签，可能对支持短评论的应用程序（如留言板）有用：`<p>`（段落）、`<b>`（粗体）、`<i>`（斜体）、`<em>`（强调）、`<strong>`（强强调）、`<pre>`（预格式文本）、`<br>`（强制换行），以及它们所有的结束标签。


    你不仅需要确保只接受少数“安全”的 HTML 命令，还需要确保它们被正确地嵌套和关闭。在 XML 中，这被称为“良好格式”（well-formed）数据。如果你接受的是标准
    HTML，可以进行一些例外（例如，在不需要 `<p>` 之前的地方支持隐含的 `<p>` 是可以的），但对于大多数应用程序来说，不需要尝试接受完全泛指的 HTML。事实上，如果你正尝试固守
    XHTML（而不是 HTML），那么良好格式格式是一项强制要求。此外，HTML 允许标签使用大写、小写或混合写法；你也可以接受任何大小写，但如果你打算将其用于
    XML，那么你就需要要求所有标签均为小写。


    这里有关于此操作的一些随机提示。通常，你应该设计 HTML 文本周围的内容以及允许的标签集，使得提交的名称具有相当有限的字符集（使用 DNS 标准）。


    从技术上讲，标准不允许下划线（`_`），但微软忽略了标准的这部分，甚至在某些情况下要求使用下划线，你可能应该允许它。此外，在支持 DNS 名称中支持国际字符方面做了大量工作，这里不再进行进一步讨论。


    - 路径（Path）：允许路径通常是好的，但遗憾的是某些应用程序将路径的一部分作为查询数据，从而创建了我们将要讨论的漏洞。此外，路径允许包含像 `..` 这样的短语，这可能会在编写糟糕的
    Web 服务器中暴露私有数据；这个问题已经比以前小了，并且确实由 Web 服务器修复了。由于只有 `../` 这个短语是特殊的，因此查看路径（以及可能的查询数据）并禁止
    `../` 作为内容是合理的。然而，如果你的验证器允许 URL 转义（URL escapes），这可能会很困难；现在你需要提供某些字符被转义的版本，并且可能还需要处理这些字符的各种“非法”字符编码。

    - 查询（Query）：以 `?` 开头的查询格式可能带来安全风险，因为某些查询格式实际上会导致服务器端发生动作。它们不应该发生这种情况，你的应用程序也不应该如此，更多信息请参见第
    4.11 节。然而，我们必须承认这是一个严重问题。此外，许多网站实际上是“重定向器”——接收一个指定用户应该重定向到何处的参数，并返回一个重定向用户到新位置的命令。如果攻击者引用此类链接并提供一个更危险的
    URI 作为重定向值，且浏览器遵循了这一点，就会产生问题。再次，浏览器应该更加审谨，但并非所有浏览器都足够谨慎。URI 标准并不认可 `+`（加号）字符，但在实践中
    `+` 字符通常表示空格。

    - 锚点（Fragment）：锚点基本上位于文档的一部分；只要语法合法，我没有发现基于锚点的攻击，否则攻击者可能会插入一个双引号（`"`）来提前结束 URI。


    ## 第 4 章 验证所有输入


    - URL 转义（URL escapes）：URL 转义很有用，因为它们可以表示任意字符；由于同样的原因它们也可能非常危险。特别是，URL 转义可以表示控制字符，许多编写糟糕的应用程序会受到影响。事实上，无论是否有
    URL 转义，许多应用程序都受到某些字符（如反斜杠、安符等）的攻击，但再次很难泛化。

    - 相对 URI（Relative URIs）：相对 URI 应该是安全的（如果你良好地管理网站），尽管在某些应用程序中也没有理由允许它们。


    当然，在简单性方面也存在权衡。简单的模式更容易理解，但它们不是精细的（因此它们倾向于过于宽松或严格，甚至比精细的模式更甚）。复杂的模式可以更精确，但它们更容易出错，需要更多性能，并且在某些情况下很难实现。


    这里是我对一种“简单安全”URI 模式的建议，它非常简单，可以通过“手动”或通过正则表达式实现；允许以下模式：


    ```

    http(ftp)://[-A-Za-z0-9_./]*

    ```


    此模式不允许潜在危险的功能，如查询、锚点、部分或相对 URI，并且只允许少数方案。它防止了 `%%` 字符的使用，该字符在 URL 转义中使用并用于指定服务器可能没有准备好处理的字符。由于它不允许
    `:` 或 URL 转义，因此它不允许指定端口号，即使使用它重定向到更危险的 URI 将也是困难的（由于缺少转义字符）。它还防止了其他字符；再次，许多设计糟糕的
    Web 无法无法许多“意外”的字符。


    即使这种“大部分安全”的模式也允许许多可疑的 URI'
