    # 第 7 章 谨慎调用其他资源


    > 不要仰仗君侯，

    > 不要仰仗凡人，他们不能救人。

    > 诗篇 146:3 (NIV)


    ## 7.1. 仅调用安全的库例程


    有时，安全性与抽象（信息隐藏）和重用等开发原则之间会存在冲突。问题在于，某些高层库例程的实现可能并不安全，且它们的规范不会告知你。即使某个特定的实现是安全的，也无法确保该例程的其他版本是安全的，或者无法确保相同的接口在其他平台上上也是安全的。例如，我无法确定
    `tmpfile(3)` 在所有平台上都是安全的（参见第 6.7.1.2 节）；其规范不够清晰，无法让我对此充满信心。


    根结底，如果你的应用程序必须是安全的，你有时必须重新实现你自己的库例程版本。基本上，如果你无法确定库例程会执行你为了安全所需的必要操作，你就必须重新实现这些例程。是的，在某些情况下应该修复库的实现，但如果你选择了一个存在安全漏洞的库例程，受害将是你的用户。如果可能，在必须重新实现某些内容时，尝试使用高层接口——这样你就可以在那些是安全的系统上切换到高层接口。如果可能，请测试该例程是否安全，如果是安全的则使用它——理想情况下，你可以将此测试作为编译或安装的一部分（例如，作为
    "autoconf" 脚本的一部分）。有时这种运行时测试是不切行的（例如，测试竞态条件）。


    ## 7.2. 限制调用到有效值


    确保对其他对象的任何调用对每个参数都允许有效且预期的值。这比听起来要困难，因为许多库调用或命令会以可能意想不到的方式调用低级例程。例如，几个系统调用（如 `popen(3)`
    和 `system(3)`）是通过调用命令外壳（shell）实现的，这意味着它们会受到 shell 元字符的影响。同样，在 C 语言中尝试创建进程时，完全避免使用
    `pop(3)`、`system(3)`、`exclpt(3)` 和 `execvp(3)` [Galvin 1998b]。至少，在可以使用 `execve(3)`
    的时候避免使用 `system(3)`；由于 `system(3)` 使用 shell 来扩展字符，`system(3)` 有更多作乱的机会。类似于，Perl
    和 shell 的回溯 (*) 也会调用命令外壳；关于 Perl shell 回溯的更多信息请参阅。


    该问题最棘手的之一是 shell 元字符。标准的 Unix 类命令外壳 (/bin/sh) 特殊地解释某些字符。如果这些字符被发送到 shell，除非经过转义，否则将使用它们的特殊解释方式；这一事实可以被用来破坏程序。根据
    WWW 安全 FAQ [Stein 1999, Q37]，这些元字符是：


    ```

    6 ; '' \ " | * ? < > ^ ( ) ] $ \r

    ```


    遗憾的是，在现实中这不是一个完整的列表。这里是其他可能引起问题的字符：


    - ''!'' 在表达式中表示“非”（正如在 C 语言中一样）；如果测试程序的返回值，准备 ! 可能会欺骗脚本，认为操作失败了实际上成功了，反之亦然。在某些
    shell 中，“!" 还会访问命令历史，这可能会导致真实问题。在 bash 中，这只发生在交互模式下，但 tcsh（某些 Linux 发行版中找到 csh
    克隆）即使在脚本中也使用 "!"。在 csh、bash 和其他一些 shell 中，如果在 bash 中发现它们，似乎只有交互模式下才会使用 "!"。

    - ''#'' 是注释字符。

    - ''-'' 可以被误认为是选项。

    - '' ''（空格）和其他空白字符可能会导致问题。

    - ''~'' 在某些程序（如 mailx）中用作 escape 字符，这可以被用来执行 shell 命令。

    - 这里的斜杠 `\` 在某些 shell 实现中可能被视为元字符。

    - 其他控制字符（尤其是 newline）可能会导致问题。


    遗忘这些字符之一可能是灾难性的，正如在第 4 节中讨论的，某些实现的建议方法是在输入时立即转义所有这些字符。但目前为止，最好的方法是识别你希望允许的字符，并使用过滤器只允许那些字符。


    许多为人类交互设计的程序具有允许运行任意 shell 命令的“escape”机制。一种更常见且危险的 escape 代码之一是能调出命令行的。交互式程序如
    vi、emacs 和 ed 具有允许用户运行任意命令的机制。始终检查你调用的程序的文档以搜索 escape 机制。最好的方法是只调用为其他程序设计的程序；参见第
    7.3 节。


    避免 escape 代码 的问题甚至延伸到了低级硬件模拟器。大多数调制解调器实现了所谓的“Hayes”命令集，其中序列 "+++”、延迟，然后再次使用 "+++"
    会强制调制解调器切换模式（并将后续文本解释为命令）。这可以被用来实施拒绝服务攻击，甚至强制用户连接到其他人。


