    当然，语言无法在请求的区域语言中可用，这引出了字符编码的问题。


    ## 4.8. 编码


    ### 4.8.1. 编码简介


    多年来，美国使用 ASCII 字符集交换文本；由于 ASCII 支持几乎所有语言，它在处理所有其他语言的字符时完全不足。多年来，不同的国家采用了不同的技术来交换文本，这在互联的世界中变得困难。


    最近，ISO 开发了 10644，通用多字节编码字符集（UCS）。UCS 是一个定义了每个字符的单字节值的字符集。前 65536 个字符（它们适合 16 位）被称为“基本语言平面”（BMP），而
    BMP 旨在涵盖当今所有的口语语言。Unicode 发展了 Unicode 标准，并增加了一些有助于互操作的额外约定。历史上，Unicode 和 ISO 1046
    是由竞争小组开发的，但幸运的是他们意识到需要合作，现在正在相互协调。


    ## 第 4. 验证所有输入


    如果你正在编写处理国际化字符的新软件，你应该使用 ISO 1046/Unicode 作为处理国际化字符的基础。然而，你可能需要以各种顺序（特定语言）字符集处理旧版文档，在这种情况下，你需要确保不可信的用户无法控制文档的字符集（因为这会显著影响）。


    ### 4.8.2. UTF-8 简介


    大多数软件并非为处理 16 位或 32 位字符而设计的，但要创建一个通用字符集需要比 8 位更多的位。因此，开发了一种名为“UTF-8”的特殊格式，以将这些潜在的国际化字符编码为更容易被现有程序和库处理的格式。除了
    2 字节或 4 位固定宽度表示，UTF-8 在其他地方（如 IETF RFC 2279）有定义，因此是一个可以自由读取和使用的标准。UTF-8 是一种变长编码；字符
    0 到 0xf(127) 自身编码为单字节，而具有较大值的字符则编码为 2 到 6 字节的信息（取决于其值）。该编码经过专门设计，具有以下良好的特性（这些信息来自
    RFC 和 Linux utf8 手页）：


    - 经典的美国字符（0 到 0x7f）按自身编码，因此仅包含 7 位 ASCII 字符的文件和字符串在 ASCII 和 UTF-8 下具有相同的编码。这对于许多现有美国程序和数据文件的向后兼容性非常。

