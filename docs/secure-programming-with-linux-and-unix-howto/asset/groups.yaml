    # 第 1 章 引言


    > 智者攻打强城，拆毁他们所信赖的堡垒。

    > — 箴言 21:22 (NIV)


    本书描述了一套在 Linux 和 Unix 系统上编写安全程序的设计和实现指南。对于本书而言，“安全程序”是指运行在安全边界上的程序，它从一个与该程序具有相同访问权限的源获取输入。此类程序包括作为数据查看器使用的应用程序、Web
    应用程序（包括 CGI 脚本）、网络服务器以及 setuid/setgid 程序。本书不涉及修改操作系统内核本身，尽管此处描述的许多原则同样适用。


    这些指南的开发基于对各种来源创建此类程序的“经验教训”的调查（并带有作者的额外观察），并将其组织成一套大原则。本书包含了具体的指导建议。


