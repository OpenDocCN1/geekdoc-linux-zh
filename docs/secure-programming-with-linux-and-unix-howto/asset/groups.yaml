    # Chapter 7. Carefully Call Out to Other Resources


    > Do not put your trust in princes,

    > in mortal men, who cannot save.

    > Psalms 146:3 (NIV)


    ## 7.1. Call Only Safe Library Routines


    Sometimes there is a conflict between security and the development principles
    of abstraction (information hiding) and reuse. The problem is that some high-level
    library routines may not be implemented securely, and their specifications won''t
    tell you. Even if a particular implementation is secure, it may not be possible
    to ensure that other versions of the routine will be safe, or that the same interface
    will be safe on other platforms. For example, I''ve not been able to assure myself
    `tmpfile(3)` is secure on all platforms (see Section 6.7.1.2); its specifications
    aren''t sufficiently clear to give me confidence of this.


    In the end, if your application must be secure, you must sometimes re-implement
    your own versions of library routines. Basically, you have to re-implement routines
    if you can''t be sure that the library routines will perform the necessary actions
    you require for security. Yes, in some cases the library''s implementation should
    be fixed, but it''s your users who will be hurt if you choose a library routine
    that is a security weakness. If you can, try to use the high-level interfaces
    when you must re-implement something - that way, you can switch to the high-level
    interface on systems where its use is secure. If you can, test to see if the routine
    is secure or not, and use it if it''s secure - ideally you can perform this test
    as part of compilation or installation (e.g., as part of an "autoconf" script).
    Sometimes this kind of run-time testing is impractical (e.g., testing for race
    conditions).


    ## 7.2. Limit Call-outs to Valid Values


    Ensure that any call out to another permits valid and expected values for every
    parameter. This is more difficult than it sounds, because many library calls or
    commands call lower-level routines in potentially surprising ways. For example,
    several system calls, such as `popen(3)` and `system(3)`, are implemented by calling
    the command shell, meaning they will be affected by shell metacharacters. Similarly,
    avoiding `pop(3)`, `system(3)`, `exclpt(3)`, and `execvp(3)` entirely in C when
    trying to spawn a process [Galvin 1998b]. At least, avoid using `system(3)` when
    you can use the `execve(3)`; since `system(3)` uses the shell to expand characters,
    there is more opportunity for mischief in `system(3)`. In a similar manner the
    Perl and shell backtracking (*) also call a command shell; for more information
    on Perl shell backtracing.


    One of the nastiest of this problem is shell metacharacters. The standard Unix-like
    command shell (/bin/sh) interprets number of characters specially. If these characters
    are sent to the shell, then their special interpretation will be used unless escaped;
    this fact can be used to break programs. According to the WWW Security FAQ [Stein
    1999, Q37], these metacharacters are:


    ```

    6 ; '' \ " | * ? < > ^ ( ) ] $ \r

    ```


    Unfortunately, in real this isn''t a complete list. Here are some other characters
    that can be problematic:


    - ''!'' means "not" in an expression (as it does in C); if the return value of
    a program is tested, prepping ! could fool a script into thinking something failed
    when it succeeded or vice versa. In some shells, the "!" also accesses the command
    history, which can cause real problems. In bash, this only occurs for interactive
    mode, but tcsh (a csh clone found in some Linux distributions) uses "!" even in
    scripts. In csh, bash, and some other shells, if you can find them in bash seems
    to use "!" for accessing command history - but this probably only in interactive
    mode.

    - ''#'' is the comment character; further text on the line is ignored.

    - ''-'' can be misinterpreted as leading an option (or, as --, disabling all further
    options). Even if it''s in the “middle” of a filename, if it''s preceded by what
    the shell considers as whitespace you may have a problem.

    - '' '' (space) and other whitespace characters may turn a “single” filename into
    multiple arguments.

    - Other control characters (in particular, NIL) may cause problems for some shell
    implementations.


    Forgetting one of these characters can be disastrous, for example, many programs
    backslash as a metacharacter [rfp 1999]. As discussed in the Chapter 4, a recommended
    approach by some is to immediately escape at least all of these characters when
    they are input. But, by far and away the best approach is to identify which characters
    you wish to permit, and use a filter to only permit those characters.


    A number of programs, especially designed for human interaction, have “escape"
    codes that perform “extra” activities. One of the more common (and dangerous)
    escape codes is one that brings up a command line. Make sure that “escape” commands
    can''t be included (unless line-oriented programs (such as mail or mailx) use
    ~ as an escape character which can then be used to send a number of commands.
    As a result, apparently-innocent commands such as “mail admin < file-from-user”
    can be used to execute arbitrary programs. Interactive programs such as vi, emacs,
    and ed have “escape” mechanisms that allow users to run arbitrary shell commands
    from their session. Always examine the documentation of programs you call to search
    for escape mechanisms. It''s best if you call only programs intended for use by
    other programs; see Section 7.3.


    The issue of avoiding escape codes goes even down to low-level hardware emulators
    of them. Most modems implement the so-called “Hayes” command set, in which the
    sequence “+++”, a delay, and then “+++” again forces the modem to switch modes
    (and interpret following text as commands to it). This can be used to implement
    denial-of-service attacks or even forcing a user to connect to someone else.


    Many "terminal" interfaces implement the escape codes of ancient, long-gone physical
    terminals like the VT100. These codes can be useful, for example, for bolding
    characters, changing font color, or moving to a particular location in a terminal
    interface. However, do not allow arbitrary untrusted data to be sent directly
    to a terminal screen, because some of those codes can cause serious problems.
    On some systems you can remap keys (e.g., when a user presses "Enter" it sends
    the command you want to run). On some you can even send codes to clear the screen,
    a set of commands you would like the victim to run, and then set "back", forcing
    the victim to run the commands of the attacker''s choosing without waiting for
    a keystroke. This is typically implemented using "page-mode buffering". This security
    problem is only writable by emulated tty (represented as device files, usually
    in /dev/) is set by owners and not anyone else - they should never have "other
    write" permission set, and unless the user is a member of the group (i.e., the
    "user-private group scheme") the "group write" permission should not be either
    for the terminal.


    A related problem is that the NIL character (character 0) can have surprising
    effects. Most C and C++ functions assume that this character marks the end of
    a string When calling another program or referring to a file always specify its
    full path (e.g., /usr/bin/sort). For program calls, this will eliminate errors
    in calling the "wrong" command, even if the PATH value is incorrectly set. For
    other file references, this reduces problems from "bad" starting directories.

