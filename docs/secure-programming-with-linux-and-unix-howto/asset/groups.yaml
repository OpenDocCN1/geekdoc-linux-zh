    # 6.7. Avoid Race Conditions


    A “race condition” can be defined as “Anomalous behavior due to unexpected critical
    dependence on the relative timing of events” [FOLDOC]. Race conditions generally
    involve one or more processes accessing a shared resource (such as a file or variable),
    where multiple access is not properly controlled.


    In general, processes do not execute atomically; another process may interrupt
    it between essentially two instructions. If a secure program’s process is not
    prepared for these interruptions, another process may be able to interfere with
    the secure program’s process. Any pair of operations must not fail if another
    process’s arbitrary code is executed between them.


    Race condition problems can be notionally divided into two categories:


