    From a technical standpoint, an even better approach is to set the character encoding
    as part of the HTTP protocol output, though some libraries make this more difficult.
    This is technically better because it doesn''t force the client to examine the
    header to determine a character encoding that would enable it to read the META
    information in the header. Of course, in practice a browser couldn''t read the
    META information given above and would not succeed in the marketplace, but that''s
    a different issue. In any case, this just means that the server would need to
    send as part of the HTTP protocol, a "charset" with the desired value. Unfortunately,
    it''s hard to heartily recommend this (technically better) approach, because some
    older HTTP/1.0 clients did not deal properly with an explicit charset parameter.
    Although the HTTP/1.1 specification requires clients to obey the parameter, it''s
    suspicious enough that you probably ought to use it as an adjunct to forcing the
    use of the correct encoding, and not your sole mechanism.


    # 8.6. Prevent Include/Configuration File Access


    When developing web based applications, do not allow users to access (read) files
    such as the program include and configuration files. This data may provide enough
    information (e.g., passwords) to break into the system. Note that this guideline
    sometimes also applies to other kinds of applications. There are several actions
    you can take to do this, including:


    +   - Place the include/configuration files outside of the web documentation root
    (so that the server will never serve the files).


    +   - Configure the web server so it will not serve include files as text. For
    example, if you''re using Apache, you can add a handler or an action for .inc
    files.


    +   - Place the include files in a protected directory (using .htaccess), and
    designate them as files that won''t be served.'
