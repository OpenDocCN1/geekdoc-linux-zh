    of internet users. The prevalent phishing -emails are mostly easy to spot. They
    share a sense of urgency, unusual sender, and suspicious hyperlinks. It is when
    a website is copied and looks like the real thing that can get complicated. Banking
    websites can often be phishing targets because of their extensive access to credit
    card numbers and sensitive information.


    # Virus


    The purpose of a virus is to corrupt resources on websites. Like in a human body,
    the virus can change forms, corrupt the "healthy" programs, and self-propagate.
    And just like in us, there are plenty of viruses that can attack your malware.


    Topher Crypter is one of the most dangerous types of viruses because of its ability
    to completely take over the computer, leading to the spread of further viruses.
    A famous example of a Topher Crypter is the Trojan Virus.'
  - '[PAGE 167]


    Metamorphic Virus can write, rewrite, and edit its own code. It is the most infectious
    virus, and it can damage the computer and data if not detected early.


    Polymorphic Virus is similar to a metamorphic virus, but it copies itself; where
    the metamorphic virus can rewrite its code, the polymorphic just copies its original
    code with slight modifications.


    Macro Virus is written in the same language as software programs such as Microsoft
    Word or Excel. It starts an automatic sequence of actions every time the application
    is opened.


    Cluster Virus makes it appear as though every program in the system is affected
    when, in fact, it is only in the one program in the system. It causes the illusion
    of a cluster and can be removed by figuring out the virus''s original "carrier."


    Tunneling Virus works against antiviruses. It sits in the background and sits
    under the antivirus. When an antivirus detects a virus, the antivirus will reinstall
    itself only to install itself as the tunneling viruses.


    Stealth Virus uses its mechanism to avoid any detection by antiviruses. The stealth
    virus will hide in the memory and hide any changes it has made to any files.


    Extension Virus will hide in a website or browser extension and create changes
    through there.


    # Cookie Theft


    Cookies are files stored on your computer used by your browser to save useful
    information about the websites you visit or any actions you take.'
  - '[PAGE 168]


    Session cookies are temporary and erased once you close your browser. Certain
    cookies persist in your browser until you erase them or expire (which could take
    years). These are called persistent cookies.


    Websites use cookies to modify your browsing experience to make it tailored to
    your needs as well as for proper ad placement. Cookie thefts are used by hackers
    to gain access to that information. Cookies are one of the most natural methods
    of hacking, they can be stolen through public Wi-Fi networks!


    # UI Redress


    UI redress, also called clickjacking, is masking a click to gain clicks for a
    different website. A user could think they are clicking on a straightforward link,
    but they will be redirected to a completely different website due to clickjacking.
    The hacker is "hijacking" clicks. This can get out of control quickly as users
    will click links that say things such as "win a free vacation,". They will be
    redirected to a sharing page, causing the clickjacking to spread massively over
    social media or email.


    # DNS Spoofing


    Domain name server spoofing is an attack in which the domain name is taken over
    by redirecting the clicks to a fraudulent website. Once there, the users are led
    to believe they are logging in with their account names and passwords into the
    original website. Still, in reality, they are giving away their information to
    the hacker performing the DNS spoofing. There are a few methods to perform DNS
    spoofings, such as Man in the Middle (where interaction among the server and user
    is sidetracked) or DNS server compromise (where the server is directly attacked).'
  - '[PAGE 169]


    The above examples are all hacking types used by malicious hackers, but ethical
    hacking also works with them. To prevent and "heal" these attacks, ethical hackers
    must know how they work, and this is why ethical hackers have to be educated on
    all the types and methods of hacking used.


    Becoming a hacker takes skill, and the ironic part is that both unethical and
    ethical hackers will use the same education and tools. The only difference is
    that one will use their "powers" for evil and the other for good (or something
    in between). It''s like a modern-day equivalent of the classic superhero-villain
    duo Batman and Joker. To be a successful ethical hacker, you have to understand
    malicious hacking as well.


    # Phases of Ethical Hacking


    When it comes to ethical hacking, there are generally five distinct phases:


    Reconnaissance - The process of information gathering. In this phase, the hacker
    gathers relevant information regarding the targeted system. These are things such
    as detecting services, IP configurations, pc specifications, and password data.
    The hacker gathers all the information possible (the network, the host, the people
    involved, etc.).


    Scanning - The hacker begins to actively probe the target machine or network for
    vulnerabilities that can be actively exploited.


    Gaining Access - This is one of the essential parts. In this phase, the vulnerability
    detected during scanning is exploited using various methods—the same methods a
    malicious hacker might use. Still, the ethical hacker will use this to know the
    weak spots of entry. The hacker will try to enter the target system without raising
    any alarms.'
