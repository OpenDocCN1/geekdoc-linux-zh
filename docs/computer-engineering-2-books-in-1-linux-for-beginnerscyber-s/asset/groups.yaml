    ## 第十三章：

    ## 提高您的安全性


    ### 安全无线网络


    人们必须学会如何保护无线网络，以确保机密信息落入他人手中。本章将要介绍保护个人无线网络以及如何操作。对于大多数示例，将使用 NETGEAR 路由器。如果用户有不同的路由器，请记住某些地方会有不同。


    ## 加密


    让我们从讨论基础加密开始。在涉及网络上的数据传输时，加密是将明文转换为杂乱字符混合的过程。这降低了通过加密网络发送的信息被用于恶意目的的概率。对于无线路由器的加密，它是每当输入正确的登录凭据时生成加密身份验证密钥的过程，从而允许访问网络。简单来说，每当用户登录到加密路由器时，就会生成一个唯一的密钥，允许访问该互联网连接。


    ## WPA


    Wi-Fi 保护访问（或 WPA）是一种为了取代 WEP 安全性而开发的安全工具。它有两种类型：WPA 和 WPA2。区别在于 WPA2 是 WPA 更新、更安全的版本。每当用户需要登录无线网络时（无论是在家里还是学校），他们最可能正在登录
    WPA/WPA2 加密网络。这些安全功能通过检查输入的登录凭据是否准确来工作，如果准确，则会生成一个该该登录唯一的加密身份验证密钥。一旦生成此密钥，相应的网络就会进行检查，在登录凭据匹配的情况下允许数据传输开始。现在我们已经了解了
    WPA 加密的基础知识，我们将讨论可以采取的保护个人无线网络的基本步骤。


    ## 无线路由器凭据


    当无线路由器首次设置好时，必须更改默认登录凭据。大多数个人无线路由器都带有标准的登录用户名和密码，例如：


    - 用户名：admin

    - 密码：password


    黑客知道这些默认登录凭据，这意味着它们必须立即更改。使用大写和小字母组合的长密码将为用户提供可靠的安全凭据。


    ## 服务集标识符


    服务集标识符 (SSID) 指无线网络名称的计算机语言。例如，亚利桑那大学的无线网络被称为“UAWifi”。将个人网络名称从默认值更改是非常重要的，因为黑客可能会针对具有默认名称的无线网络，认为它不那么安全。为了进一步提高安全性，可以关闭
    SSID 广播。这意味着网络对外部人员不可见。它仍然存在，如果搜索特定的 SSID，就可以找到它。然而，任何扫描网络以进行连接的人都看不到这个隐藏网络。当你有试图访问你个人网络的邻居时，这种方法特别有用。


    ## 媒体访问控制


    媒体访问控制 (MAC) 是一组用于识别特定设备的数字。无论是电脑、平板电脑还是手机，每个设备都有唯一的 MAC 地址。为了更好地保护网络，路由器可以只允许特定的
    MAC 地址连接到该网络。通过仅允许特定设备连接，这为您的网络增加了另一层安全。虽然这是一个实用的安全功能，但至少要提到，有软件程序允许黑客伪造 MAC 地址，让他们伪装成网络上的相同设备。


    关于安全路由器的最后一个建议是保持网络安全最有效的方法：关闭路由器。如果你要度假，或者只是一段时间不使用他们的网络，关闭路由器是防止黑客进入网络的最佳方法。如果设备不通电且不传输数据，他们就无法访问。


    ## 设备设备安全


    本章将解释移动设备面临的安全风险，以及如何更好地保护手机或平板电脑上的数据。


    ## 安全风险


    移动设备有三个主要的安全风险：物理盗窃、网络攻击和应用程序权限。


    - 物理盗窃：物理被盗允许他人访问设备并窥探存储的所有个人信息。可以是密码、短信、照片、电子邮件等任何内容。

    - 网络攻击：这适用于在移动设备上浏览互联网（无论是通过无线网络还是移动运营商业务）时被盗取或查看的数据。

    - 应用程序权限：这可能是移动设备所有者最大的安全威胁，原因很简单：人们在下载应用程序时不会阅读该程序拥有哪些权限。

