    只要你选择使用它，这个操作系统就会一直运行并规避麻烦。它通常能比其他某些系统更好地抵勒索软件和恶意软件问题，甚至是病毒。你不需要频繁重启它，除非需要更新内核（而内核通常每几年更新一次）。


    如果你曾对你正在使用的操作系统感到沮丧，认为它可能并不总是如你所愿那样工作，那么也许是你尝试 Linux 操作系统的时候了。它将拥有我们想要的所有好处，并且免费使用，无论你在此过程中决定连接到多少台电脑。


