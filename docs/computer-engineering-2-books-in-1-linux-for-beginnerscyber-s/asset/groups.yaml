    # Empty File Content by Deleting the File


    You can delete the contents in a folder while leaving the folder intact using
    the command: `rm` followed by the file name. For instance: `rm Linux tutorial`.


    # Recall Commands


    If you have long command lines, you can recall commands in a specific line using
    ''!'' followed by the line number. For instance: `!23 to view command inline 23.


    # Shut down Computer at A Given time


    Besides, to shut down and reboot, you can also program your computer to shut down
    at a specific time. To shut down the computer at 22:00, use the following command:
    $ sudo shutdown 22:00


    # mkdir


    With this, you can create a folder. The operation is the same as that of the command
    touch. E.g., `mkdir Linux tutorial`.


    # cp


    With this, you can make a copy of a file. Option -R allows you to make copies
    of the entire folder at once.


    # mv


    This option always will enable you to move folders/files. The mv command is used
    in precisely the same way as the command cp. This command also allows you to rename
    files and folders.


    # rm


    Remove, delete files, e.g., `rm Linux tutorial`. The option -f forces the delete,
    the option -I requests confirmation before deletion. Finally, the option -r allows
    the deletion of the files.


    # rmdir


    Remove directory and enables you to delete a folder only if it is empty.


    # ln


    This option helps you create a link to two files. The option -s allows you to
    create a symbolic link.


    # wc


    Word count, count the number of lines, words, and characters in a text file. The
    option is -l for (number of lines), -w for word (number of words), and -m for
    the number of letters. There is also the option -c that has the file size in bytes.
    To use it, we simply provide in parameter the address of the text file:


    wc also makes it easy to know how many files/folders you have in a given directory,
    just to redirect the output of a diverse WC: `ls |` and voila!


    # sort


    This option helps you sort a text file in alphabetical order. The option -r allows
    to perform an inverse sorting, i.e., anti-alphabetical or decreasing numbers,
    and the option -R allows random sorting.


    # Uniq


    The command uniq allows you to duplicate a file. Just supply in parameter the
    file''s address to be duplicated and the name of the new file to be created.


    # file


    This command helps you determine the type of file in use regardless of its extension.
    All you need to do is provide the parameter of the file to be evaluated.


    # split


    With this command, you can cut a file into smaller files (-l specify the number
    of lines, -b specify the size in bytes [follow the size of K, M, G, T to define
    a different unit).


    # Locate


    This command allows locating a file on the hard disk. E.g., `locate Linuxututorial.txt`.
    The command locate is very fast because it finds the file by consulting a database.
    It does not scan the hard drive directly for the file in question. The disadvantage
    of this process is that if the file is recent, it may not be indexed yet, and
    location will not help.


    # Find


    The command find is much more powerful than locate, but it is also slower because
    it traverses the disc when searched. Unlike locate, find allows you to search
    according to the size or date of the last access.


    # nohup


    This command enables users to start a program and holds it even after the console
    is closed.


    # Cat


    This command allows you to read the contents of a text file: `cat Linuxututorial.txt`.


    # less


    Similar operation to cat but display the file page by page. It is, therefore,
    more convenient for large files.


    # Head


    Displays the header of a file. The option -n allows you to specify the number
    of lines to show.


    # tail


    Like the head, it refers to the "tail" of the file; in other words, this command
    only displays the end.


    # touch


    The primary touch goal is to change the time frame of a file. If you make touch
    a file that already exists, it will update its last access and modification dates.


    Make a Typescript of all elements on your terminal.


    With the "script" command, you can make a Typescript of everything on your console.


    # Privacy of directories


    To prevent other users from accessing a folder, use the command chmod.


    # Password File


    If you''re afraid that a user may access your file, you can password it with the
    following command: `vim` followed by the filename.


    # Know When to Exit your terminal


    On Linux, you can set a reminder to know when to exit your terminal. With the
    command "leave + time of the day," you know when to stop working.


    # Formatting Text


    You can format text on Linux using the following string of commands: `fmt + filename`.


    # Complete Last command


    Using the command `!` helps you save time as it automatically helps complete the
    last command without having to input the remaining commands manually.


    # Type


    This command indicates whether an element is built-in, a program, or an alias.


    # Copy File into Different Directories


    The command: `echo` allows you to copy a file into as many directories as you
    want with just one line of command.


    # Delete Large Files


    rm command is widely used to remove files. However, this can become useless if
    the file in question is large. Instead of rm, use `rm -rf` (followed by filename)
    to remove large files.


    # Installing Software


    Typically, when you install software, you use a package manager. The most common
    one is apt for Debian-based systems. To install a package, you use `sudo apt install
    package_name`. To update your list of packages, use `sudo apt update`. To remove
    a package, use `sudo apt remove package_name`.


    # Some Hacking with Linux


    Now that you have gotten used to the system and have some ideas of how it works,
    it is an excellent time to learn some primary hacking. No matter if you are using
    this system on your own or you have a network, there are a few types of hacking
    you may find useful.


    # Making a Key Logger


    The first thing to learn how to work with is key logger. This can be a new tool
    because it allows you to see what keystrokes someone is making on your computer

