    ## Front-End Blockchain Applications


    Once your blockchain is running well on the back end, you are ready to start building
    front-end applications for it. The front end is the interface that the users will
    interact with when they are actually using the applications.


    Python is ideal for building the back end of applications, but it isn''t quite
    adept at the front end. Many programmers agree that JavaScript is the way to go.
    Probably the best way to get started is to use JavaScript to create a module that
    you will call upon in your Python code.


    Using JavaScript on your computer is somewhat different than Python. To get started
    with JavaScript on your Linux script, the first thing that you will need to do
    is download the JavaScript client. This will allow you to write JavaScript code
    on your Linux terminal. You will also need to download a JavaScript engine, such
    as Rhino, to execute the code that you will write.


    The focus here is on helping you learn how to use Linux to create a blockchain.


    ## Using Linux to Build a Dapp


    Recall that a dapp is a decentralized application. It is what networks Ethereum
    and Lisk are designed to run. Linux and daps are so intertwined that many experts
    recommend using Ubuntu or another Linux distribution to build one!


    Before you start building a dapp for Ethereum, you need to be aware that it has
    its own programming languages — most notably Solidity — that work best with its
    interface. Solidity is very similar to JavaScript, so once you have gotten your
    feet wet with the latter, you should easily get started with the former.


    You can use the Linux command line terminal to connect with the Ethereum Virtual
    Machine (the world computer that powers Ethereum) and build your dapp. You can
    also download the Ethereum client that will allow you to program in your language
    of choice. This section will take you through the process of building a dapp by
    downloading the client.


    You will probably want to download the Solidity client if you want to write your
    code directly into Solidity. Otherwise, you will need a compiler to translate
    your code into Solidity. You will also need to download SOLC, the compiler for
    Solidity, that will allow you to execute the program. You can get both of them
    on GitHub or the main Ethereum website.


    The back end of your dapp will be your smart contracts, so to start programming
    your dapp, you will need to build your basic smart contract. A basic smart contract
    in Solidity looks like this:


    ```

    pragma solidity ^0.4.0; contract SimpleStorage {


    uint storedData;


    function set(uint x) public { storedData = x;

    }

    function get() public constant returns (uint) {

    return storedData;

    }


    ```


    The smart contract''s first line just says that the code was written for Solidity
    4.0 or greater. The word "pragma" tells the compiler how the source code should
    be treated. A "uint" is an unsigned integer of 256 bits; in other words, it cannot
    be a negative number, but it can be a positive number that is up to twice as large
    as its signed integer counterpart.


    The second and third lines say that the code is for a smart contract that will
    perform the simple storage of data. In the fourth and fifth lines, a function
    is being built for the variable x, a uint. X will be used to store the data in
    the smart contract.


    This is a fundamental contract that sets a value for a number that is publicly
    accessible. Your smart contracts will probably be much more complex so that they
    can carry out real-world functions and solve actual problems.


    Use either your Linux terminal or your Solidity client to execute the smart contract.
    (You want to make sure that it functions exactly how you anticipated, so plan
    to spend some time making tweaks and changes to it.) There should be an icon in
    the terminal marked "New Transaction." Click on it that you can use your smart
    contract to execute a transaction


    Before you can successfully execute smart contracts within the Ethereum ecosystem,
    you will need Ether. You can either buy Ether (with Bitcoins or fiat money), or
    you mine it. To find the toolbar and click on "Mine." Under "Debug," click on
    "Force Mining." Your computer will become a mine, at least short term. At the
    same time, you accrue enough Ether to begin executing your dapp''s smart contracts.
    When you have enough, click "Stop Mining."


    When you have enough Ether and are satisfied with how your smart contract is executing,
    go back to "New Transaction" and copy and paste the code for your smart contract
    into the text box. Leave the other fields at their default value since you aren''t
    trying to carry out a transaction in which you will send someone else Ether.


    If there is an error in how you compiled the code, the built-in debugger will
    automatically tell you where that error is. If it is compiled correctly, you will
    see an option at the bottom with the possible transactions that your smart contract
    can execute. Congratulations!! You can now mine a block and officially make your
    smart contract part of the Ethereum.


    ## Chapter Nine: Managing Text Files


    We will also learn how to redirect the output from one text file to another. We
    will learn to edit existing text files on the command prompt using ''Vim''.


    ## Redirecting the Output from a File or Program


    This section will discuss terms such as standard input, standard output, and standard
    error. We will further learn how to redirect outputs from a file to another file
    and redirect the output from a file to another program.


    ## Standard Input, Standard Output, and Standard Error


    When a program or a process is in a running state, it will take inputs from somewhere
    and write the output to a file or display it on the screen. When you are using
    a terminal on the Linux operating system, the input is usually taken from the
    keyboard.


    A process uses some channels as file descriptors, which take some input and send
    some output. There are at least three file descriptors in every process.


    1. Standard Input, also known as Channel 0, which takes inputs from the keyboard

    2. Standard Output, also known as Channel 1, which sends outputs to the screen

    3. Standard error, also known as Channel 3, which sends error messages


    Let us go through the channel names for file descriptors.


    | Number | Channel Name | Description | Default Connection | Usage |

    | --- | --- | --- | --- | --- |

    | o | stdin | Standard input | Keyboard | Read only |

    | 1 | stdout | Standard output | Terminal | Write only |

    | 2 | stderr | Standard error | Terminal | Write only |

    | 3 | filename | Other files | None | Read and/or Write |


    ## Redirecting Output to a File


    The input/output redirection is used to replace default output destinations with
    file names or other devices. The output of a command, which usually is redirected
    to be displayed on the terminal screen, can be redirected to a file or a device
    or discarded with redirection.

