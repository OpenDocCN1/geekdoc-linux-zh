    An offensive action targeting computer systems, networks, infrastructures, or
    personal devices to alter, steal, or destroy data and computer systems is called
    a cyber-attack. Although each cyber-attack is different, many similarities exist,
    such as the approach and strategy used. Many criminals who launch cyber-attacks
    using hacking techniques that have proven successful in the past while considering
    the nature of the target and the attack. In this chapter, various types of cyber-attacks
    are discussed in depth while also shedding light on the damages they usually cause.


    # Denial-of-Service (DoS) & Distributed Denial-of-Service (DDoS) Cyber-Attacks'
  - '[PAGE 191]


    A Dos attack attacks computer systems by overwhelming their resources that affect
    computer systems’ ability to respond to service requests. Similarly, a DDoS attack
    overwhelms a computer system’s resources. However, a DDoS attack is launched using
    multiple host computers infected by the attacker with malicious software.


    Unlike many cyber-attacks, Denial-of-Service attacks do not offer attackers direct
    benefits by increasing or gaining access to a computer system and its data. Service
    denial is the purpose of a DoS or DDoS attack instead of control or data theft.
    Some businesses use Denial-of-Service attacks to interfere with the services provided
    by their competitors. Furthermore, DoS or DDoS attacks are also used to cause
    system downtime so that the particular system can be attacked once it''s offline.


    # TCP SYN Flood Attacks


    Attackers utilize the buffer space in the Transmission Control Protocol or TCP
    session initialization handshake in this type of attack. The target system is
    flooded with connection requests by the attacker''s device. However, the attacker''s
    device does not respond to the target system’s replies to its requests. As a result,
    the target computer system times out upon waiting for responses from the attacker''s
    device, leading it to become unusable or even crash due to the filling up of connection
    queues.


    # Smurf Attacks


    The target network is saturated with traffic by the attackers using ICMP and IP
    spoofing in a Smurf attack. ICMP echo requests are used in this method directed
    at broadcast IP addresses. The attacker creates ICMP echo requests from a spoofed
    IP address giving the broadcast IP addresses the impression that the target victim
    is sending the request.'
  - '[PAGE 192]


    Multiple requests are sent to broadcast IP addresses, and the target address receives
    multiple responses to overwhelm it. Spoofed ICMP echo requests are automated and
    generated in bulk by the attacker, causing serious network congestion that forces
    the target network to deny services.


    # Ping-of-Death Attacks


    The maximum size of an IP allowed is limited to 65,535 bytes. The attackers use
    fragmented IP packets resembling the target system. These IP packets cause crashes
    and buffer overflows, disrupting the services provided by the target computer
    network. However, Ping-of-Death attacks can be successfully overcome using a firewall
    that makes any fragmented IP packet meets the maximum size allowed.


    # Botnets


    Hackers infect millions of systems and gain control over them to be used as bots
    to launch DDoS attacks. The target system or network is attacked using these bots
    or zombie systems under the control of the attacker. Attackers often use botnets
    to overwhelm the bandwidth of the target system and its processing capabilities.
    DDoS attacks are usually difficult to trace since they use infected bots or computer
    systems located in numerous geographic locations.


    # Phishing Attacks


    These cyber-attacks are carried out by sending highly realistic emails that seem
    to be from trustworthy sources to gain sensitive personal information from the
    receivers or influence them to carry out an action attackers desire. Therefore,
    phishing is a combination of technical trickery and social engineering. Emails
    sent out by attackers may include attachments loaded'
- md: '

    with malware that infect computers upon the receiver opening or downloading them.
    Some phishing emails include links to websites that trick receivers into downloading
    or installing malware or submitting their personal information.


    Spear phishing is an addressed form of phishing that involves attackers undertaking
    detailed research into targets to produce messages that tend to be important and
    personal. Spear phishing, as a result, is difficult to identify with many receivers
    failing to defend their computers and networks against attacks. A common simple
    method utilized by the hackers in spear-phishing is spoofing the "From" section
    of an email, giving it the appearance that it has been sent from someone that
    the target knows, such as a coworker or the management of their company.


    Spear phishing attackers also add credibility to their attempts by cloning websites.
    The practice involves copying legitimate websites to mislead the target so that
    they attempt to enter the cloned website by submitting their sensitive information
    such as usernames and passwords that the attackers later used to gain entry to
    the account of the target on the legitimate website.


    One of the simplest ways to counter phishing is by using critical thinking. Carefully
    inspecting emails and the email address of the sender is usually sufficient to
    identify a phishing attempt. If a suspicious email includes links, the user can
    simply hover the mouse over the link without clicking it to inspect the URL that
    the link is directing to. Email headers such as "Reply-to" also help identify
    phishing emails since they directly lead to the sender''s email that can then
    be easily inspected. Furthermore, links and attachments contained within an email
    can be safely inspected in a Sandbox environment.


    ## Man-in-the-Middle (MitM) Attacks


    These attacks place the attacker between clients and servers'' communication,
    enabling them to interfere and tamper with those communications, including requests
    and responses. Various types of MitM cyber-attacks exist.


    ## Session Hijacking


    Attackers launch these attacks by hijacking sessions between trusted clients and
    network servers. The attacking computer uses the trusted client''s IP address
    while the server proceeds with the session under the impression that it is communicating
    with the client. This confusion caused by the attack enables the attacker to communicate
    with the server and carry out their intentions without the actual client or the
    server being aware of what is happening.


    ## IP Spoofing


    Attackers mislead systems by used spoofed IP addresses to gain access to a system.
    The system believes it''s communicating with a trusted entity due to the spoofed
    IP address. IP packets are used to send the spoofed IP source addresses to target
    hosts that accept and respond to the attacker''s requests in some environments
    with poor cybersecurity measures.


    ## Replay


    These attacks are carried out by impersonating the participants of a conversation
    or a communication threat that has already taken place. The attackers save previously
    sent messages and send them again, impersonating one of the conversation participants.
    However, replay attacks can be easily identified and dealt with by inspecting
    the messages and nonce''s timestamps.


    ## Malware Attacks


    Any unwanted software installed in a computer without the user''s consent or the
    administrator of the said computer is called malware. These malicious software
    attaches themselves to the system''s legitimate codes and its useful applications
    while replicating across the internet. Many types of malware exist with various
    capabilities and intentions.


    ## Macro Viruses


    This type of malware infect commonly used software such as Microsoft Word and
    Excel. They infect a computer by attaching themselves to the initializing sequence
    of a trustworthy application. They are installed on the computer without the user
    noticing, thus without the consent of the user. When the unsuspecting user opens
    the particular application, the virus attached to it takes control of the application
    and replicates itself by attaching to the computer''s system code.


    ## File Infectors


    These viruses usually sneak into computers by attaching themselves to executable
    (.exe) files. When the unsuspecting user loads the executable file, the virus
    is installed on the computer without knowing. Some infectors create virus files
    with the same name as a trustworthy application as an executable file. When the
    file is opened, the virus springs into action and executes its intended procedures.


    ## Boot-Record or System Infectors


    These viruses attach themselves to the master boot record located on the hard
    disk of a computer. The virus is activated when the system starts. It looks at
    the computer''s boot sector and loads itself to the system memory, where it infects
    other disks and computers.


    ## Polymorphic Viruses


    Different sequences of encryption and decryption are used to conceal viruses where
    they proceed to infect a certain code area. These viruses are repeatedly encrypted
    and decrypted, making them decrease power as changes to their source changes repeatedly.
    However, they are very difficult to detect.


    ## Stealth Viruses


    System functions are used by stealth viruses to conceal themselves by compromising
    software intended to project a computer from malware. The malware detection software
    wrongly reports that an infected area is being uninfected. Furthermore, stealth
    viruses can hide the increases in the infected file''s size or the dates and times
    of modifications to the file.


    ## Logic Bombs


    This malicious software is programmed to be activated by a specific occurrence
    on a computer. The existence of logic, such as specific data, time, or any other
    occurrence to trigger them, has given them the name "Logic Bombs."


    ## Trojans


    Also known as Trojan Horses, these programs hide in trustworthy and useful programs
    while performing malicious functions. However, unlike viruses, Trojans do not
    self-replicate themselves. Trojans can launch attacks on a computer and establish
    back doors that are later exploited by attackers.


    ## Worms


    These attacks are different from virus attacks since they do not attach to any
    host files. Instead, they are programs themselves. Worms are circulated using
    emails, and opening the attached worms activates them. Then they spread throughout
    computers and networks. Worms usually send a copy of themselves to every contact
    found in the affected computer''s email address other than carrying out the malicious
    activities they have been programmed to. Worms are used to spread across the internet
    and overload email servers that result in multiple DoS attacks against the particular
    network.


    ## Droppers


    These are programs that infect computers by installing viruses in them. Droppers
    usually do not carry malicious themselves. However, they are still detected by
    anti-virus software. Some droppers are so advanced that they can connect to the
    internet and download any updates they help install.


    ## Ransomware


    This type of malware is intended to block access to the target user''s data. The
    program then threatens to erase or publish the data if the user fails to pay the
    ransom by following the instructions that it provides. Some ransomware can lock
    a computer in such a complex manner that removing them or recovering the data
    is often impossible without paying the ransom. Such a level of complexity is achieved
    using a technique known as Cryptoviral Extortion. The technique encrypts the data
    so that it''s almost impossible to recover without the encryption key. Most ransomware
    ends up receiving their ransom as users are forced to protect their data and privacy.


    ## Spyware


    This type of malware is intended to collect important information about the infected
    computer or network users. Some of the data that is often collected include user
    browsing habits and sensitive information at times. Spyware can track any computer
    activity without the knowledge of the user and send the collected data to remote
    attackers. They can also download other malicious software from the internet.
    Spyware is installed on a computer without the user''s knowledge and consent when
    the user installs other freeware programs.


    ## Adware


    These software applications are used by marketing companies to advertise products
    and services by infecting computers. The infected computers end up displaying
    advertising banners irrespective of the program that is running. Adware is usually
    downloaded to a computer automatically when the user browses the internet. They
    usually use pop-up windows and bars to display advertising when it is being used.


    ## SQL injection Attacks


    These cyber-threats have been a widespread problem for websites that are driven
    by databases. They come into effect when the malefactor executes a SQL query to
    a website database with data input from the client to the server. Various SQL
    commands are then inserted into the data-plane input so that predefined SQL commands
