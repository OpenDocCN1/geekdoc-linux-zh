    Machine language is nothing but 0s and 1s.


    The kernel is responsible for managing the resources of the hardware. It acts
    as an intermediary between the software and the hardware.


    # Memory Management


    The kernel is responsible for managing the RAM. It ensures that different processes
    have the memory they need and prevents them from interfering with each other''s
    memory.


    # Process Management


    The kernel manages the processes running on the system. It schedules which process
    gets to use the CPU and for how long.


    # Device Management


    The kernel handles the various hardware devices connected to the system. It provides
    drivers that allow the software to communicate with hardware.


    # System Calls


    System calls are the interface through which a program requests services from
    the kernel. When a program needs to read a file or use the network, it makes a
    system call.


    # System Libraries


    System libraries are collections of functions that programs use to perform common
    tasks. Instead of making system calls directly, developers often call functions
    from libraries like glibc.

