    GNU/Linux 发行版不会向“第三方”暗示、分析或传输你的任何操作，以免泄露用户的隐私。


    # Linux 技巧与技巧


    有数千条命令行，这使得在短时间内执行任务成为可能。与其一页一页地翻，单个命令就可以帮助你在几秒钟内获得你想要。


    在 Linux 上，你必须注意某些 Windows 快捷键可能执行完全不同的功能。因此，不要期望 Ctrl + S 在 Linux 上帮助你保存条目。


    ## ls


    此命令用于列出文件夹中的文件。你可以使用 "-a" 列出隐藏文件，使用 "-l" 显示详细列表，使用 "-R" 查看子文件夹。


    切换目录；该命令用于在现有的文件系统中进行导航。例如，使用 `cd /var/log` 进入日志文件夹。无论你现在在哪里，这都是有效的，因为我们在开头加了斜杠，这表示这是一个绝对地址。


    在目录之间导航，有两个实用的快捷键需要知道。`cd ~` 进入当前用户的目录（大多数情况下是 `/home/user/`，如果你是 root 用户则为 `/root`），`cd
    -` 返回上一个路径。


