    You may use arrow keys to navigate through the output given by the history command.
    Up Arrow will take you to the commands on top, and Down Arrow will take you to
    the commands below. Using the Right Arrow and the Left Arrow keys, you can move
    on the current command and edit it.


    ## Shortcuts to Edit the Command Line


    There is an editing feature available on the command line in bash when you are
    interacting with bash. This helps you move around the current command that you
    are typing to make edits. We have already seen how we can use the arrow keys with
    the history command to move through commands. The following list will help you
    use edits when you are working on a particular command.


    - **Ctrl+a**: This will take your cursor to the start of the command line.

    - **Ctrl+e**: This will take your cursor to the end of the command line.

    - **Ctrl+u**: Clear the line from where the cursor is to the start of the command
    line.

    - **Ctrl+k**: Clear the line from where cursor is to the end of the command line.

    - **Ctrl+Left Arrow**: Take the cursor to the start of the previous word.

    - **Ctrl+Right Arrow**: Take the cursor to the start of the next word.

    - **Ctrl+r**: Search for patterns in the history list of commands used.


    ## Chapter Eight: Blockchains


    Blockchain and Linux seem to be made for each other. Together, they make the fight
    against the repeal of net neutrality stronger. They present a paradigm of decentralization
    and enabling anyone to write and implement code. They really are a match made
    in computer heaven.


    ## Hyperledger


    The Linux Foundation is behind the creation of Hyperledger, a massive blockchain
    enterprise that helps businesses implement blockchain technology in their corporate
    infrastructures. The Linux Foundation announced its creation in December 2015,
    and in February 2016, announced its charter members. The goal of Hyperledger is
    to improve accountability and transparency in businesses through blockchain. Technological
    giants, such as IBM and Intel, have gotten behind the project and contributed
    to its core software.


    Private blockchains are controversial because they enable centralization. However,
    Hyperledger uses private blockchains, but they are not concentrated within any
    one business. For example, a bank that is part of the Hyperledger consortium does
    not get its own blockchain; it becomes part of a larger blockchain that encompasses
    multiple industries. Other companies are part of the verification process and
    provide data immutability adds a layer of accountability onto the private blockchain.
    It doesn''t become completely decentralized, but it is a few steps removed from
    complete centralization.


    There are multiple Hyperledger blockchains and blockchain frameworks. For example,
    Hyperledger Fabric is a blockchain framework that enables companies to create
    decentralized applications, some of their customers and clients can access from
    the front end. People can use it to create and execute smart contracts, thereby
    automating many of its processes.


    Hyperledger has been used across many different industries. It is used to track
    supply-chain shipping, meaning that it tracks the goods'' transit routes that
    people eventually consume. Say that parents purchase a can of formula for their
    infant, and that batch is later found to have been contaminated. The parents will
    immediately want to know that they can either not feed their baby or get their
    baby immediate medical treatment. Traditional technologies would alert them if
    there were found to be a problem. The use of Hyperledger enables them to scan
    the can of formula to track its entire transit route before buying it. It has
    also been used in maintaining health records and health insurance. It could be
    used to track things like car ownership so that people who buy cars can find out
    what the car in question has been through. The use of Hyperledger means that customers
    can be more confident in their purchases and the companies that they support.


    The Hyperledger is open source, so anyone can access the source code and make
    improvements to it theory. Of course, those improvements must be approved by a
    51% majority of nodes. Hyperledger is written primarily in JavaScript. Any changes
    made will need to be either in JavaScript or compiled from a different programming
    language (like Python or C++) into JavaScript.


    ## Become a Blockchain Node


    Becoming a node on Hyperledger requires permission. That isn''t likely to be granted
    unless you have high-level access inside a company that uses it. However, you
    can still set up your Linux computer to become a node on a public blockchain like
    Bitcoin, Ethereum, Blockstack, or Lisk.


    The first thing that you will need to do is decide which blockchain that you want
    to support. Different blockchains provide different benefits to nodes; for example,
    operators of Bitcoin access the highest security wallets. Operating a node is
    not the same as operating a mine, so that you won''t get paid in cryptocurrency
    for your efforts. It really is a voluntary commitment that may give you some paybacks.


    Turning your computer into a node is a huge commitment that will benefit the blockchain
    community by dedication to your own resources. The second thing that you will
    need to do is make sure that your computer has enough memory on its hard drive
    to store the blockchain.


    Blockchains are huge, and as of 2018, they can be as large as 50GB. Make sure
    that your computer has enough memory to accommodate the blockchain that you want
    to support.


    The third thing that you will need to do is look closely at the core infrastructure
    that you want to support. While the blockchain itself is not complicated, the
    core may be. For example, Bitcoin Core is not particularly user friendly, and
    it may scare off new users. Make sure that you are up for the challenge, and if
    there is something about the core you don''t understand, find the answer.

