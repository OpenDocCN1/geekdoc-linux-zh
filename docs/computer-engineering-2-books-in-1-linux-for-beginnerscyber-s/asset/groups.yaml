    It is hard to imagine how many people use Linux today. The rank on the popularity
    of each distribution''s website is vast and large. This gives the impression of
    what people are interested in, but it is hard to represent which distributions
    are the most used worldwide. For example, Ubuntu is not currently ranked as number
