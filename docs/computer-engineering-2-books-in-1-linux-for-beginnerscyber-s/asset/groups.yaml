    # 循环


    C++ 中的循环相对直观。你只需要了解两种循环。


    C++ 中的 `while` 循环工作方式与 Bash 类似。只要语句 true结果为 `true`，它就会一直执行。


    以下是在 C++ 中从 1 计数到 10 的方法：`int i = 1;`


    ```cpp

    while (i <= 10) {

    cout << i << "\n"; i++;

    }

    ```


    同时，`for` 循环的工作方式与 Python 或 Bash 都不同。C++ 中的 `for` 循环仍然用于迭代，但它们的逻辑路径更清晰，并且并不专门用于遍历不同的列表。


    你可以这样理解 C++ 中的 `for` 循环：


    ```cpp

    for (iterator variable; continuation condition; iteration step) {

    // 代码写在大括号内部

    }

    ```


    如果我们想用数组从 1 计数到 10，可以这样做：


    ```cpp

    for (int i = 0; i <= 10; i++) {

    cout << i << "\n";

    }

    ```


    每当循环完成，迭代步就会改变迭代变量 `i++` 或 `i = i + 1`，表示数值增加。


    # 函数


    这是 C++ 章节中最后的干货了。函数相对容易理解。最难点是记住在 C++ 中所有函数都必须指定类型，因此所有函数都必须返回一个值。唯一的例外是如果函数类型为
    `void`。


    如果我们想回到面积计算函数，我们要返回的是一个数字（整数）。因此，我们知道，如果想创建这个面积计算函数，就必须将其类型为 `int`。这意味着它必须返回一个整数。


    创建面积计算函数看起来像这样：`int calculateSquareFootage(int length, int width) { return length
    * width; }`


    我们稍可以在代码的其他部分这样引用它：


    ```cpp

    int area = calculateSquareFootage(3, 4); // 将返回 12 cout << area << "\n";

    ```


    ```cpp

    cout << calculateSquareFootage(3,5) << "\n"; // 将打印 15

    ```


    # 结论


    到此，我们已经涵盖了 C++ 编程语言中大部分混乱的初学者内容。现在我们必须转向 Python 并开始在那里投入学费了！


    # 第六章：学习 Python


    C++ 是一种比 Python 更复杂的语言，Python 是为了快速原型设计和快速、混乱的脚本编写设计的。C++ 绝不是为了这两者设计的！然而，这意味着
    C++ 和 Python 之间有许多差异，这使得先学 C++ 更有于成为一个更好的程序员。


    当你先学习 C++ 时，你是在学习如何关注资源的使用。Python 为你处理了很多工作。例如，在将变量传递给函数时，你不需要担心变量的值，也不需要担心变量只是另一个变量的副本，你更不需要担心释放正在使用的内存。当你先学习
    C++ 时，你从一开始就学会了关注这些。在 Python 中，只需通过遵循良好实践并且不在代码本质上极度浪费，就有关注这些问题的方法。


    其次，当你先学习 C++ 时，你是在学习更关注你所创作的内容。你必须显式地为每个函数和变量指定类型，而不是让它保持隐含。这迫使你在尝试不同变量时记住这一点，并开始成为更好的程序员。刚开始时，你必须注意变量
    `c` 是 `int` 而变量 `d` 是 `string`。你不需要担心这个，但在处理某种语言时，始终在脑海中保持值类型等是一个良好的习惯。


    综上所述，学习 Python 也有很多优势。首先，它是当今世界上最常学习和使用的编程语言之一。这意味着对于一个 Python 初学者来说，那里有大量的文档供你使用——而且许多人问过你可能会问的问题，这意味着那里已经有人给出了答案。


    不仅如此，Python 是一种完美且高效的语言。许多用过 Python 的人都变得爱上了它，包括我在内。当你知道编程在做什么时，使用 Python 是一次非常有趣且快速的体验。其他语言中让你感到困扰的许多事情在
    Python 中并不存在，或者对其产生可衡量的影响。我们将回顾上一次阅读中涵盖的所有 Python 内容。


    如果你正在运行 Linux，你应该已经有了 Python，这大大简化了整个设置过程。你可以通过打开终端并输入 `python` 然后按回车来测试。如果它启动了
    Python，说明你搞定了。如果没有，你需要去 Python.org 获取，但这在 Linux 发行版上真的不应该是问题。


    如果它启动的不是 Python 2.7.12，那么你需要降级。没有理由启动 Python 3，因为在编写本文时，Linux 发行版的标准是 Python 2.7。然而，还是无一失胜于谨慎。Python
    2 和 Python 3 是两种不同的东西。你可以在 Python 中运行的大部分代码其实是不通的。


