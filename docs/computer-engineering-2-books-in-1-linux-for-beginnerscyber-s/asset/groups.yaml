    -   图形服务器（Graphical server）：这将是在显示器上显示你想要的所有不同图形的子系统。它被称为 X 或服务器（server）。


    -   桌面环境（Desktop environment）：这将是你实际花费时间与之交互的操作系统部分。这是“桌面”比喻的实际实现，由运行在操作系统可见表面上的程序组成，你将直接与其交互。


