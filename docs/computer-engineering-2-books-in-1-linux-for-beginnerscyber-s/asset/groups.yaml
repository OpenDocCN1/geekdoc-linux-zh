    ## Clear


    这用于清理你的终端窗口，将上方的所有文本推开，为你留下一个干净的窗口。键盘快捷键 `ctrl + l` 可以实现相同的功能。


    ## Ctrl + s


    停止显示；当你误输入错误的命令时，这非常有用。此命令可以撤销之前的命令，允许你纠正。


