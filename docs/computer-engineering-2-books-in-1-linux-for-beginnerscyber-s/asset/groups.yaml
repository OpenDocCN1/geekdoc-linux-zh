    19 percent said cyber extortion the widespread today, while 42 percent said this
    threat would be frequent over the next three years.


    26 percent said nation-state attacks are persistent today, while 45 percent said
    this would be very frequent over the next three years.


    40 percent said attacks against industrial controls and supervisory control and
    data acquisition (SCADA) systems are frequent today, while 54 percent said this
    would be very frequent over the next three years.


    The loss or theft of data from unsecured Internet of Things (IoT) devices are
    likely to happen and is a significant cybersecurity challenge.


    82 percent said it is very likely, likely, or somewhat likely that their organization
