    # Chapter Sixteen: Mistakes Made in Cybersecurity


    Stolen information and data will not lead to the end of the business. It is not
    a great sign for the business either. Studies and research indicate that a data
    breach in an organization''s network can lead to a loss of $15.4 million, and
    the amount increases each year. Do they want to lose their money because of some
    issues or vulnerabilities in the system? Indeed, businesses and organizations
    cannot make mistakes. These mistakes can lead to data loss, but a large organization
    is bound to make such mistakes. What the organization must do is to learn from
    those mistakes. You cannot expect your organization to do the exact thing repeatedly
    only because the outcome may change at one point. This chapter covers the different
    mistakes organizations make. You must protect your organization from making such
    mistakes during these times.


    ## Failing to Map Data


    Every organization must focus on understanding how and where the data flows. It
    should also look at where the data is saved. Remember, data is the livelihood
    of your company. Only when you assess and identify the flow of data can you see
    where it must be protected. You must know if the data is flowing out of your organization
    and who it is shared with. When you have visibility, you will know what ends the
    hacker can attack. You will also know where you can catch the hacker.


    ## Neglecting Security Testing


    Vulnerabilities will reside across the database, systems, applications, and network.
    These vulnerabilities now extend to various devices like the IoT or Internet of
    Things and smartphones. Organizations must test these devices and connections
    regularly to scan for any vulnerabilities. You can also perform some penetration
    tests to learn about the vulnerabilities. Remember, you cannot guess the vulnerabilities
    and will only find them when you test them.


    ## Concentrating on Wrong Aspects


    Indeed, prevention is not an anachronism. As technology advances, so make the
    threats against it. Remember, a hacker will find a way to enter the border. A
    firewall will not always protect your systems if you have an employee who does
    not know what he is doing. Once a hacker is inside the system, he can acquire
    privileged information. He can also pretend to be an employee of the organization.
    Hackers can evade any security scans for a long time. If you have better visibility,
    you can find a hacker and reduce the chances of data leaks.


    ## Forgetting the Basics


    Often, it is the simple things you can use to overcome and threats to the system.
    You must train all your employees. Help them understand the type of password they
    must use. They must perform the right actions as well. It is only if this occurs
    that you can properly maintain the components of the network and minimize the
    risk of data loss. You may also find ways to customize the data to properly avoid
    any changes.


    ## Avoiding Training


    Remember to train your employees to know what they must do to prevent any attacks.
    The most common form of hack is a social engineering attack. The hacker will send
    information from a malicious source and mask the information to seem legit. He
    can then use the information employee feeds into the website and attack the system''s
    configuration and network. Make sure to train your staff about protecting their
    systems and how to identify social engineering attacks.


    ## Security Monitoring


    Most businesses cannot set up their security operations center or center of excellence
    since they lack the budget. This does not mean you cannot monitor the security
    of the systems and network. You must investigate the network and look for any
    threats or vulnerabilities. You can use these approaches to minimize the effect
    of an attack on data and security.


    ## Avoiding Vendor Risk Assessments


    From earlier, you know vendor risks are the reasons for numerous data breaches.
    Hackers can enter the organization''s systems through the vendor''s application
    or network. Therefore, you must have a plan to help you assess the risks in third-party
    systems. You can also read the reports they share about their systems to learn
    more about their security.


    ## Ignoring Shadow IT


    Remember, the end-points in any network are often connected to other networks,
    making it hard to control the flow of data through the network. Most employees
    access shadow devices and applications from their laptops and desktops. The IT
    department in most organizations does not support the use of such applications.
    If you do not know how to stop it, you must find a way to hide it. You can block
    these applications and websites.


    ## It Is Not Only about Malware


    Most hackers use malware to establish their presence in a system or network. Once
    they are inside the network or system, they will use different strategies to perform
    the hack and move through your network. You need to find a hack into the system
    in a legitimate way and perform the hack to detect any vulnerabilities.


    ## Breaches Won''t Happen


    This is one of the biggest mistakes most companies make. Some organizations do
    not protect their business and network since they believe cybercriminals do show
    mercy. This is never going to happen. Cybercriminals will attack any company,
    regardless of size. You must prepare your defenses and identify the response to
    an attack. This will help minimize the damage and react faster to threats if the
    day does come.


    ## Forgetting about the Management


    You must understand that security must mature over time, which is one of the primary
    objectives of information security professionals. In some instances where businesses
    have reached high maturity levels, security is a part of the organization''s culture.
    You must obtain permissions and approvals from the management before you investigate
    any attacks or the systems.


    ## Doing it on Your Own


    You must find someone to help you test your network and systems, regardless of
    whether you own a small company or a component of a larger corporation that lacks
    security skills. You can also partner with security service providers. Alternatively,
    you can speak to your management and hire the right professionals, or you can
    train the employees in your firm. You must avoid making these mistakes if you
    want to improve your organization''s systems and networks'' security.


    ## Tips to Keep Your Organization Secure


    This chapter will look at some tips to help you protect your organization from
    being a victim. Speak to the IT professionals and other stakeholders to learn
    more about what you can do to prevent any cyberattacks.


    ### Creating an Information Security Policy


    Every business must have a clearly defined security policy, which should provide
    information on the processes everyone in the organization must follow. You must
    enforce this policy and train employees to perform the right actions. Remember
    to include the following in your security policy:


    - Best Practices for encryption

    - Password requirements

    - Usage of devices

    - Email access


    You must frequently update this policy and let every employee in the organization
    know about the policy’s changes.


    ### Educating Employees


    This is a crucial aspect to consider. If you have a security policy, but your
    employees do not know what they must do, it is a lost cause. Help your employees
    understand the different protocols they must perform. You need to have the training
    and let people know what they must do. This is one of the simplest modalities
    to protect data.


    ### Using Secure Passwords


    Remember, passwords are important to maintain cybersecurity. Instruct your employees
    to choose passwords that are difficult for a hacker to guess. You must avoid using
    dates and names in your password since hackers can easily connect you with those
    words. You must instruct them to change passwords regularly. You can also use
    a multi-factor authentication system to add an extra layer of protection to the
    accounts.


    ### Ensure Software is Updated


    If you have outdated software in your systems, it can lead to a security risk.
    You should always update the software with the latest patches. For example, if
    you use the Windows Operating System, you must allow the updates to run to cover
    any vulnerabilities or gaps.


    ## Secure the Network

