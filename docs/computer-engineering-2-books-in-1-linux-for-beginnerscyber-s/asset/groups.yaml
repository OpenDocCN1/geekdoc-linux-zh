    When you try to access files, then you have what they are called permissions.
    You need to have the permissions to access the file. Again, the files can be encrypted
    inside the operating system to convert it into a format that is not readable when
    someone else tries to open it, who doesn''t have the permissions.


    ## GUI Interface


    We can also have a Linux operating system where you can use Linux in GUI if you
    install some packages.


    Note: The Mac operating system is built on Unix OS.


    ## File System


    A file system allows you to arrange your files and directories in a systematic
    order.


    ## Open Source


    It means that anyone can freely download, install, and use the Linux operating
    system.


    ## Chapter Two:


    ## Installing Linux


    Take note that you might need to know your computer''s hardware before you install
    certain distributions. For instance, if you choose to install Debian, you will
    need information about your PC and its components because the distribution does
    not recognize everything.


    Fortunately, nowadays, all installers are capable of scanning your computer and
    see every connected hardware element. However, you should still have the information
    handy in case some errors occur. This way, you can troubleshoot and figure what
    went wrong during the setup process.


    The next step is burning the file on a disk or a flash drive. Moving on, you need
    to tell the system to boot up from the disk or flash drive when you start it up.
    Many computers will boot automatically when they detect a boot-up disk, but sometimes
    you have to turn on the setting yourself if it''s set to always boot from the
    hard drive. Changing the boot-up order may solve the problem. You will have to
    access your system''s options.


    You gain access to your system by pressing a key like F10 or "DEL" before your
    operating system loads.


    Once you''re in the computer''s setup section, you need to assign your Linux boot
    disk to be the default boot device. Confirm the change, place your disk in the
    drive (or connect the flash drive), and restart your computer. At this stage,
    you should probably know whether you want to keep your current operating system
    at the same time as installing Linux. If you have Windows installed, for instance,
    and you don''t want to replace it, you will have to perform a few additional steps.


    If you plan on keeping your current operating system, the first thing you need
    to do is prepare a separate drive partition for the Linux distribution.


    Currently, your system is using the entire hard drive. The process isn''t difficult,
    but there''s always the risk of accidentally wiping the drive clean and losing
    all of your data. This is why, before installing any operating system, it''s a
    good idea to back-up all of your files and data. With a backup, you can use a
    partitioning application to make the process easier.


    For instance, a program called QTParted works well, and it comes included with
    certain Linux distributions.


    Many Linux installers can handle your partitions automatically. The new partition
    is created by shrinking the size of your current operating system''s partition.


    Once you''re ready to install Linux, boot your computer from the installation
    disk and begin the process. You need to follow many steps, and the entire setup
    may take up to two hours. It all depends on your system and which distribution
    you''re installing. At this stage, all you really need to do is follow the onscreen
    instructions.


    Most modern and up-to-date distributions guide you through an easy to follow graphical
    user interface.


    One important element of the installation involves the hard drive partitioning.
    Yes, even if you already performed the partitioning step above. All you need to
    do is use the partition you already setup.


    The openSUSE installation interface with several distributions should show you
    the recommended steps you need to take. Once you perform the guided configuration,
    which includes basic steps such as time and network setups, you need to select
    which packages you want to install. Keep in mind that some Linux distributions
    are setup to install certain components, and you won''t have the option to choose.


    Once the installation process is complete, restart your computer. This step is
    part of the setup process and is necessary.


    Now Linux is ready to run.


    When you boot up the system for the first time, you will find a few more optional
    steps that involve further system configuration and installing various packages
    and applications.


    ## Linux Flash Drive


    Using Linux Live disks is a good way to explore the large variety of distributions
    available to you.


    It won''t take a time-consuming installation process, and you don''t need to worry
    about endangering your current system to something you aren''t familiar with.
    This is why CDs and DVDs with Live installation were so popular at one point.
    Nowadays, while you can still choose to go with disks if you want to, most people
    choose to go with the more modern flash drive. Many people don''t even install
    disk readers anymore because of the more practical USB drive, which is faster,
    easier to use, and can hold much more data.


    The biggest issue with Live disks is that they are slow when reading or writing
    data. Another problem is the difficulty you would encounter when it comes to operating
    system configuration. It''s not that easy to save certain changes to a Live disk,
    which is why we are going to focus on bootable flash drive distributions.


    Bootable flash distributions have been around for years, as the technology isn''t
    exactly new. However, until recently, many of them came with some disadvantages.


    One of the most popular Live distributions is probably Fedora because it''s easy
    to prepare. The installation is free of any risks to your system. You can maintain
    any other files you may have on your flash drive. Most importantly, it is easy
    to save your Linux system configurations and modifications.


    The simplest way to create a bootable Linux drive is by taking advantage of your
    current operating system.


    It may sound strange, but performing this process using Windows is a lot easier
    for a beginner than typing a set of command-line instructions.


    Our example will focus on using Windows since many people interested in Linux
    seem to be using this system. However, if you are using Mac, the steps should
    be nearly the same. Therefore, you should be able to adapt the process on your
    own.


    Here are the following steps you need to follow to create a bootable USB drive:


    - First, you need to download the live USB-creator applications.

    - Install the program by following its very straightforward setup guide.

    - Locate the installation folder and run the application.

    - Select the flash drive option, which you can find under the "target device".
    The drive should appear along the lines of "MyDrive".

    - Now you need to select where the ISO file comes from. Choose the download option
    to access it.

    - Next, you need to choose the "persistent storage" amount. This represents the
    storage space, which will be reserved for the installation. Keep in mind that
    the application might set the default to 0MB. You should opt for 400MB, at least.

    - Finally, you can click on the "Create Live USB" button.


    The process will take several minutes, and in the end, you will see new folders:
    one named "syslinux," which is small and is only responsible for the system boot
    up, the second folder is "LiveOS," which contains the system and utilizes the
    storage you set earlier.


    You can now terminate the flash drive creator and try out the Live drive.


    ## Virtual Machines


    VirtualBox is a virtual machine that, first developed by Sun Microsystems, is
    now under Oracle''s ownership.


    It simulates a separate computer, and each virtual machine can have its own applications,
    operating system, and a whole of other things. VirtualBox is ideal for testing
    out various operating systems, in this case, Linux on a Windows or Mac OS computer.

