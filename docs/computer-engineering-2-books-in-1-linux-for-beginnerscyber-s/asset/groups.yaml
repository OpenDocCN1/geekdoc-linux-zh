    # # Chapter One:


    # # What Is Hacking?


    When you think of hacking, you may imagine something along the lines of someone
    violently smashing a keyboard, zooming in on things while controlling someone''s
    computer, and saying things like "I''m in," or "hack engaged." Or maybe the word
    hacking makes you think of breaking into someone''s Instagram account.


    The term "hacking" has preconceived connotations, and most people don''t completely
    understand the whole idea that goes into the hacking method. Hackers have a legendary
    reputation for that. Yet there''s a hacking side that most people don''t know
    about: ethical hacking. You don''t hear about the ethical hacking coverage, but
    there are people out with the same job description battling the malicious hackers
    every day, and they get the bad rep.


    The well-known term "hacking" refers to attempts to obtain unauthorized access
    to data or the system. So, yes, technically, breaking into your ex''s Instagram
    to read their DM''s is a type of hacking, but the term applies to someone with
    technological expertise in the field of hacking. Humans not only try to obtain
    entry to accounts but also to deter someone else from obtaining unwanted access.'
  - '[PAGE 163]


    # A History of Hacking


    Hacking has been around since as early as the 1960s when, in 1961, a group of
    MIT students hacked their model trains hacking to modify their functions. That
    is where the term comes from. The term hacking is not even directly related to
    computers! Originally, hacking meant to explore and improve something.


    In the 1970s, phone hackers, or "phackers," made their debut when they exploited
    phones'' operational characteristics to gain access to free phone calls, although
    they were fairly rare. At the time, computer hackers were not popular became so
    few people had personal computers.


    This changed in the 1980s when personal computer gave birth to the first computer
    hackers. This is no surprise since there is always someone out there wishing to
    mess with the product to their advantage there''s a product. Likewise, when there''s
    someone to mess with the product, there is someone to protect it. The birth of
    computer hacking led to the birth of ethical hacking as well. The ''80s was the
    decade we first saw hackers breaking into systems to use them for personal gain.
    This new type of crime naturally called for new legislation. In 1986, the Federal
    Computer Fraud and Abuse Act were first written. The Act made it a crime for anyone
    to access a computer used by a financial institution, a government agency, or
    any organization involved in foreign commerce or communication. This was mainly
    prompted by the increase in PC use by the general public.


    The 1990s were marked by the first high-profile arrests related to hacking. Kevin
    Mitnick, Kevin Poulsen, Robert Morris, and Vladimir Levin were among the first
    to get arrested for stealing property software and leading digital heists. This
    was also when the term crackers, meaning those that'
- md: '

    "crack" into digital encryption codes (e.g., passwords and such), began to be
    used.


    During the late 2000s, the hacking of major companies like eBay, Amazon, and Microsoft
    often dominated the headlines. This was particularly true when news broke in early
    2000 that 15-year-old Jonathon James had breached the International Space Station''s
    system.


    Digital malware has been more advanced than ever before. Hacktivists, ransomware,
    and highly sensitive document leaks are a constant issue. In modern times, more
    than ever, ethical hackers are required to defend and avoid hack attacks. The
    details open to everyone to make hack attacks all the easier, but it doesn''t
    matter.


    It also makes safety affordable.


    Hacking is not always black and white, and there are various types of hackers
    and different types of hacking. Major types of hackers are split between legal,
    unethical, and in between.


    ## Ethical Hacker


    In real-world examples, you would call an ethical hacker the firefighter of the
    group; they put out fires and save innocent lives. More frequently, they are employed
    by a government or a law agency to protect data and deal with any harm caused
    to individuals or companies. A small business can hire an ethical hacker to protect
    the company''s data used maliciously or attacked by a malicious hacker.


    ## Unethical Hacker - The Cracker


    The unethical hacker, also known as the cracker, is the criminal that gets his
    information and assets illegally by getting into a device without the owner''s
    knowledge or consent. The intent of this hacking is malicious. This type of hacker
    causes financial harm, steals confidential data, embezzles funds, disrupts businesses,
    and spreads incorrect data, among other things.


    ## The Grey Hat


    Then, the hacker isn''t completely ethical or unethical; he''s the person who
    steals to feed the poor. He falls in the grey area between the two other types
    of hackers. This gray area is where the name grey hat stems. From an example of
    a grey hacker would be a hacker hired to protect a particular database and then
    uses access to confidential data for personal gain. You may not consider them
    criminals, but they won''t be getting any medals soon. Then you have your "hacktivists,"
    groups such as Anonymous, that use hacking for political and social messages.
    Finally, there are the "kiddies" or non-skilled people who use already-made tools
    to access systems. This is when you guess someone''s Facebook password because
    you want to see if they were where they said they were last night.


    ## Types of Hacking


    As you can tell, hacking isn''t as simple as guessing someone''s password and
    logging into their accounts. There are actually numerous types of hacking that
    you need to be familiar with.


    ### Phishing


    The concept of phishing comes from the everyday activity of fishing. These hacks
    use email or sometimes phone to pose as legitimate institutions to obtain important
    information that can hurt an individual or a business. Hence, they throw the hook
    to "fish" for a victim. This usually works by first telling the victim they''re
    a trusted organization, asking for confidential data.


    The first phishing lawsuit was filed in 2004 against a Californian teenager who
    created a copy of the website "America Online," where he retrieved credit card
    information from visitors. One of the first and most popular phishing emails was
    the infamous "Nigerian Prince" email, an email from a "prince" who was stuck and
    needed your help to get back to his millions. Today, most of us don''t fall for
    the Nigerian Prince scam, and phishing is still alive and a problem for millions
    of internet users. The prevalent phishing-emails are mostly easy to spot. They
    share a sense of urgency, unusual sender, and suspicious hyperlinks. It is when
    a website is copied and looks like the real thing that can get complicated. Banking
    websites can often be phishing targets because of their extensive access to credit
    card numbers and sensitive information.


    ### Virus


    The purpose of a virus is to corrupt resources on websites. Like in a human body,
    the virus can change forms, corrupt the "healthy" programs, and self-propagate.
    And just like in us, there are plenty of viruses that can attack your malware.


    Topher Crypter is one of the most dangerous types of viruses because of its ability
    to completely take over the computer, leading to the spread of further viruses.
    A famous example of a Topher Crypter is the Trojan Virus.


    Metamorphic Virus can write, rewrite, and edit its own code. It is the most infectious
    virus, and it can damage the computer and data if not detected early.


    Polymorphic Virus is similar to a metamorphic virus, but it copies itself; where
    the metamorphic virus can rewrite its code, the polymorphic just copies its original
    code with slight modifications.


    Macro Virus is written in the same language as software programs such as Microsoft
    Word or Excel. It starts an automatic sequence of actions every time the application
    is opened.


    Cluster Virus makes it appear as though every program in the system is affected
    when, in fact, it is only in the one program in the system. It causes the illusion
    of a cluster and can be removed by figuring out the virus''s original "carrier."


    Tunneling Virus works against antiviruses. It sits in the background and sits
    under the antivirus. When an antivirus detects a virus, the antivirus will reinstall
    itself only to install itself as the tunneling viruses.


    Stealth Virus uses its mechanism to avoid any detection by antiviruses. The stealth
    virus will hide in the memory and hide any changes it has made to any files.


    Extension Virus will hide in a website or browser extension and create changes
    through there.


    ### Cookie Theft


    Cookies are files stored on your computer used by your browser to save useful
    information about the websites you visit or any actions you take.


    Session cookies are temporary and erased once you close your browser. These are
    session cookies. Certain cookies persist in your browser until you expire. These
    are called persistent cookies. Websites use cookies to tailor your experience,
    but hackers can steal them.


    ## UI Redress


    UI redress, also called clickjacking, is masking a click to gain access. A user
    could think they are clicking on a straightforward link, but they will be redirected
    to a different website. This can get out of control quickly as spread over social
    media or email.


    ## DNS Spoofing


    Domain name server spoofing is an attack in which the domain name is taken over
    by redirecting the clicks to a fraudulent website. Once there, the users are led
    to believe they are logging in with their account names and passwords into the
    original website. Still, in reality, they are giving away their information to
    the hacker performing the spoofing. There are a few methods to perform DNS spoofings,
    such as Man in the Middle (where interaction among the server and user is sidetacked)
    or DNS server compromise (where the server is directly attacked).


    The above examples are all hacking types used by malicious hackers, but ethical
    hacking also works with them. To prevent and "heal" these attacks, ethical hackers
    must know how they work, and this is why ethical hackers have to be educated on
    all the types and methods of hacking.


    Becoming a hacker takes skill, and the ironic part is that both unethical and
    ethical hackers will use the same education and tools. The only difference is
    that one will use their "powers" for evil and the other for good (or something
    in between). It''s like a modern-day equivalent of the classic superhero-villain
    duo Batman and Joker. To be a successful ethical hacker, you have to understand
    malicious hacking as well.


    ## Phases of Ethical Hacking


    When it comes to ethical hacking, there are generally five distinct phases:


    - Reconnaissance: The process of information gathering. In this phase, the hacker
    gathers relevant information regarding the targeted system. These are things such
    as detecting services, IP configurations, pc specifications, and password data.
    The hacker gathers all the information possible (the network, the host, the people
    involved, etc.).

    - Scanning: The hacker begins to actively probe the target machine or network
    for vulnerabilities that can be actively exploited.

    - Gaining Access: This is one of the essential parts. In this phase, the vulnerability
    detected during scanning is exploited using various methods—the same methods a
    malicious hacker might use. Still, the ethical hacker will use this to know the
    weak spots of entry. The hacker will try to enter the target system without raising
    any alarms.

