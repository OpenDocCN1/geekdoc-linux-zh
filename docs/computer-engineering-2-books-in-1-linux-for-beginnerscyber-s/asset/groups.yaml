    # Applications


    We all love apps, whether they come from the Apple Store or the Google Play Store,
    but most people do not know the information these apps can access via a user''s
    mobile phone. Most people never bothered to read the fine print when they download
    the new Candy Crush game or update their Instagram app. Therefore, phones are
    incredibly easy targets for hackers.


    Many applications request too much data from a phone, which may not even be related
    to the app''s actual purpose. For example, in Candy Crush''s license agreement
    under section 10, it states that the developers may use any personal data collected
    in any way that follows their privacy policy. They also state that if users link
    their account to a social media site, they will use personal data available from
    those sites to identify the user.


    # Geo-tracking


    Most mobile device users have absolutely no idea how frequently their locations
    are being pinged and stored in a company''s servers. Many free applications available
    for download in the Apple Store or Google Play Store are not actually free. There
    is a growing trend among app developers to collect your location using your phone
    or tablet''s GPS, known as geo-'
  - '[PAGE 251]


    tracking. This information is gathered in huge quantities and is bought by large
    business entities who utilize this data to study and accurately predict consumer
    behavior.


    Advertisers are always looking for new ways to capture your attention that you
    will buy their product. If an app developer develops GPS locations from an individual
    daily, they could look at it and say, "Wow, this person seems to be driven by
    a certain store every day." This app developer then takes this information and
    sells it to the store that the individual in drives every day to be targeted with
    advertisements. These advertisements could come in the form of emails or spam
    text messages. How can these stores know how to direct ads at specific individuals?
    The answer to this is that more than just the individual''s location data can
    be used for marketing. This app developer could have permission to gain access
    to the phone''s personal information like contacts, emails, etc. This allows the
    app developer to sell an individual''s daily transit routes and the information
    needed for advertisers to reach them specifically.


    # Passwords


    This is one of the easiest methods for protecting data on a mobile phone. A simple
    lock screen password can prevent someone from gaining access to your phone or
    tablet if it is stolen. Think about all the applications, text messages, emails,
    and photos on a person''s phone or tablet. Then think about someone being able
    to access all that information without even needing a password.


    # Wi-Fi Safety'
  - '[PAGE 252]


    To avoid hackers seeing information sent from a user''s mobile device, the user
    needs to be careful when using Wi-Fi. According to Lawyers'' Professional Indemnity
    Company (LAWPRO), here are some tips on how you can do this:


    +   1. First and foremost, only use wireless networks that are known and trusted.
    Avoid public wireless networks altogether if possible. Public networks are usually
    not secure, making it easy for someone on the same network to pick up the information
    you sent.


    +   2. If using a public network is a must, login to a Virtual Private Network
    (VPN) to secure the data you are transmitting. A VPN works by sending encrypted
    data through a tunnel that is safe from being accessed by anyone on the same network.


    +   3. Make sure the network being used is running some form of WPA encryption.
    Most home company networks run WPA2 encryption, unlike public networks, which
    have no security at all.


    +   4. If you''re connected to a network that isn''t your own, make sure that
    the device sharing settings are turned off to avoid unknown devices from connecting
    with yours. This creates a link between devices designed to share data easier.
    However, this is also an effortless way for a hacker to connect to your user''s
    device.


    # Bluetooth Safety


    +   1. Most Bluetooth capable devices are shipped by the manufacturer in unprotected
    mode. Also known as ''discovery mode.'' This mode allows the device to be seen
    by others, making it easier to connect with.'
  - '[PAGE 253]


    2. If you are not using your Bluetooth, make sure to turn it off to avoid any
    connections to other unwanted devices. Turning your Bluetooth off when it''s not
    in use eliminates all chances of an attacker''s device connecting to yours.


    3. If possible, change your device settings, requiring user confirmation before
    it pairs with another device. This eliminates the possibility of another device
    secretly connecting.


    4. Do not connect to unknown devices. Only pair with devices that are known and
    trusted.


    5. The maximum range of Bluetooth connections can differ based on the device''s
    power, and by setting the range to the lowest possible setting, the risk of an
    attacker reaching the device is reduced.


    # Internet Browsing


    Internet browsing can still be dangerous, even on an iPad. Here are a few dos
