    \ b - a 等于 b（注意双等号！）\n- a != b - a 不等于 b\n\n你还有逻辑运算符，允许你一次检查多个情况：\n\n- || - 或\n\
    - && - 与\n- ! - 非（用于检查语句是否为假）\n\n我不会浪费你的时间去解释 if、else 和 else if 的定义，因为我在开始时已经说过了。这里是\
