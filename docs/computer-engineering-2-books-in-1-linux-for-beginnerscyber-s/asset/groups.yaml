    # DDoS


    DDoS 代表“分布式拒绝服务”（Distributed Denial of Service），这是一种网络攻击形式。DDoS 攻击的目的是用恶意流量淹没网络，导致网站的真实请求无法在带宽内处理。DDoS
    攻击通常通过实施机器人网络来执行。


    # 钓鱼攻击与鱼叉式钓鱼（Phishing and Spear Phishing）


    这是攻击者用于获取信息的一种技术。最常见的例子是发送给毫无备用户的电子邮件，这些邮件看起来可能合法，但包含会将你重定向到其他地方的链接。例如，如果你在花旗银行（Citibank）有一个账户，邮件发送者的邮箱地址可能是
    something@citbanks.com（多了一个字母 S）。无辜的用户可能会认为它是合法的，并最终点击了不应该点击的链接。这些链接通常会要求你输入账户详情，甚至是攻击者记录的登录密码。


    # 加密（Encryption）


    使用已知算法对数据进行编码，以便只有拥有解码密钥的人才能访问该数据，这一过程被称为加密。


    # 自备设备办公（BYOD）


    这是许多组织实施的一项政策，建议员工可以使用个人设备进行业务。BYOD 政策将包含有关个人设备是否可以连接到企业网络的限制。


    # 渗透测试（Penetration Testing）


    渗透测试——也称为 pen-test——使用攻击工具和技术来审查组织基础设施的安全性。聘请内部团队或外部专家进行测试，以发现组织基础设施中的漏洞，以便在遇到真实攻击之前进行修复。


    # 点击劫持（Clickjacking）


    这种攻击欺骗用户点击链接或按钮，该链接或按钮看起来是真实的，但其中嵌入了恶意脚本。


    本书仅涵盖了网络安全术语的冰山一角，但这将作为更深入理解这些内容的跳板。


    # 第七章：


    # 网络攻击历史


    现在我们将回顾历史上最著名的网络攻击。网络空间是一个开放的社区，每个人都连接在一起，无论时间远近都可以与任何人联系。这在今天可能被视为生活方式，但如果不小心使用，就会产生后果。一些臭名昭著的人利用网络空间攻击银行网站、包含用户信息金矿的社交媒体，甚至是政府机构。以下是几次现代网络攻击：


    # SpamHaus 项目（The SpamHaus Project）


    SpamHaus 是互联网上的一个公共服务，根据其内容或来源的信誉帮助过滤垃圾邮件。对 SpamHaus 的攻击被认为是历史上最大的网络攻击，其目标是家庭和企业宽带路由器所有者。攻击者控制了这些路由器，所有这些用户都成了攻击的非愿参与者。数百万邮件服务提供商使用
    SpamHaus 来过滤互联网上的垃圾邮件。2013年3月18日，SpamHaus 黑名单了一家名为 Cyberbunker 的公司，导致了该公司的损失。Cyberbunker
    和其他托管公司作为报复，雇佣黑客通过利用宽带路由器部署机器人网络，关闭了 SpamHaus 网络。


    # 索尼PlayStation（Sony Playstation）


    2011年，一组黑客从 7700 万用户处盗取了信用卡详情和用户信息等数据。这给索尼带来了约 20 亿美元的损失。该公司的另一个痛点是，当他们尝试修复问题时，黑客仍然能够使用游戏者的登录详情持续访问索尼网络。整个攻击持续了二十四。


    # PayPal


    2010年12月，PayPal 成为网络攻击的受害者。这发生在 PayPal 以违反其可接受使用政策为由封锁了维基解（WikiLeaks）的集资金账户之后。多位用户因为这一事件抵制
    PayPal，许多黑客开始针对 PayPal。


    # 加拿大政府入侵（Canadian Government Hacking）


    2011年2月，加拿大政府通过多个新闻渠道披露，他们成为从追溯到中国的 IP 地址发起攻击的受害者。攻击者访问了加拿大政府的三个部门并盗了这些部门的数据。攻击最终通过切断这三个部门的互联网访问而停止，终止了向中国的数据传输。


    # 4chan


    4chan 是一个基于英语的网站，用于发布图片和讨论日本动漫和漫画。它由一位名为 Christopher Poole 的 15 岁纽约学生于 2003 年
    10 月推出。用户被允许匿名发布，这成了该网站的一个缺点。一位名为 Hal Turner 的用户声称他在 2006 年是 DDoS 攻击和针对其广播电节的恶作剧电话的目标。2008
    年，一名匿名的 4chan 用户黑入了美国副总统选举候选人 Sarah Palin 的私人 Yahoo 邮邮件账户。


    # 花旗集团（Citigroup）


    花旗集团是全球最大的金融机构之一。其本身就足以吸引臭名昭著的攻击者针对他们的网络，因为每天都有大量敏感且价值的信息流过。2011 年对花旗集团网络的攻击导致超过
    20 万客户的客户信息（如联系方式和账户信息）被盗。该公司因这次攻击遭受了 270 万美元的资金损失。


    # 米克尔·卡塞（Michael Calce）


    2000 年，一个名为 Michael Calce 的15 岁男孩（在网络空间被称为“黑党小子”Mafiaboy）因黑入电脑巨头 Dell、Fifa.com、Yahoo、Amazon、CNN
    和 eBay 等知名公司而受到关注，造成了价值 12 亿美元的损失。他还 攻击了互联网域名空间 13 个根域名服务器中的 9 个。作为未成年人，Calce
    仅承担了 8 个月的公开监禁、一年的假释和少额罚款。他未被允许在 8 个月内拥有任何互联网设备。


    # 第八章：


    # 安全工具类型


    ### 1. IBM QRadar 和 Watson


    这无疑是公司使用的最好的安全程序。Watson 使用人工智能（AI）是一个自学习和自进化的系统。IBM QRadar 负责追踪位置。它收集在线、离线和运营单元内部的信息。当发生事件时，它会消除风险。


    ### 2. Wireshark


    它是最受欢迎的社区协议分析器之一。它评估个人个人工作设备上的漏洞区域。可以查看传输过程中的入站和出站数据包以及使用的协议。它可以捕获信息，并创建传统的分析报告，以协助进行追踪。


    ### 3. Cryptostoppers


    它是目前网络上防止商品遭受勒索软件或恶意软件攻击的最佳工具之一。Crypto stopper 的作用是找到加密文档的机器人并将其删除。当它挂载到设备上时，会创建一个设计或可能是一种欺骗的方式；当它挂载时，crypto
    stopper 除了删除代码的操作，还能检测到代码的操作。Cryptostoppers 的制作者承诺提供九秒威胁检测和消除挑战。它会隔离工作站和单元的受感染区域，防止勒索软件影响更多区域。


    ### 4. NMAP


    它是为社区创建的众多主要和开源工具之一。NMAP 不仅适用于小网络，也适用于大网络。它可以识别主机和接收器。此外，它还可以识别操作系统的发行。它可以在一瞬间扫描数百甚至数千个设备。


    ### 5. Burp Suite


    这是另一种网络扫描算法程序，允许你浏览在线应用。该特定工具的主要目的是检查和渗透危险方法。它检查可能受影响的表面以及发送者和目的地的响应和请求。


    ### 6. OpenVAS


