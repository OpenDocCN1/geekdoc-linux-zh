    # Chapter Three:


    # Linux Commands & Architecture


    The crux of Linux lies in the usage of the command line to achieve goals. This
    is one of the biggest appeals of using any Unix-based system. This section will
    be relatively short and will refer to the Linux command line''s navigation and
    usage. We''ll be really taking advantage of writing scripts that will automate
    many basic functions in the next section.


    This section is basically going to go into a lot of the things that you can use
    to make life easier in Linux using the command line. The first thing you need
    to know is that everything in this part can be used in the Terminal. You can always
    open Terminal by going to your Applications panel then finding it either under
    System or Utilities.


    There are different commands you can use in the command line. Traversing these
    is the first step to getting a more intimate feel of your Linux operating system.
    However, do be aware that this reading is just going to cover the very tip of
    the iceberg. People write several-hundred-page books about command-line commands.
    This section will give you a cursory overview of the things you''re going to find
    most useful without going into too exacting detail.


    # Directory commands


    These are intended for both getting around and knowing where you are. The first
    command here is PWD. PWD stands for print working directory. If you type in pwd
    to the Terminal and then press enter or return, it''ll print the directory that
    you''re within.


    What''s a working directory? A working directory references the folder that you''re
    working within your Terminal instance. You can move your working directory; we''ll
    get to that in a second.


    The next command for directories is ls. L will list the different files and folders
    available within the directory that you''re working on. The most popular argument
    for ls is -l, which will list everything. To use this command, you have to specify
    the directory.


    /ls would list all things in the given path. Meanwhile, /applications would list
    all things in your applications folder.


    Another command for directories is cd. Cd stands for change directory, and this
    is super important to you navigating. Cd... will move you up on folder, while
    cd folderName will move you into any folder in the current directory. You can
    also use it to move across the hard drive easily.


    # Creation and Deletion


    These commands will allow the user to create and delete things.


    mkdir is a powerful tool that allows the user to create a new directory.


    rmdir allows the user to delete a directory. However, it cannot delete a directory
    full of files.


    Rm allows the user to delete the given files.


    Touch allows you to create a new file.


    tar allows you to create a new tar archive - tar cvf nameOfArchive.tar directory/


    ... and extract from a tar: tar xvf nameOfArchive.tar


    ... and view an existing tar: tar tvf nameOfArchive.tar


    # Searching and Retrieving


    cp allows you to copy files from one directory to another.


    mv lets you rename one file to another, overwriting the second file.


    Locate can help you find things anywhere on your hard drive and provide you with
    use it with wildcards (*) to give many possibilities.


    Man lets you view the manual of a given command.


    # Internet-based


    ssh is a big deal; it lets you log to a remote host elsewhere. This is a big topic
    beyond this text''s scope - try man ssh to get a starting point!


    FTP will let you connect to a server and upload or download files.


    Wget lets you quickly download things from the internet and then install them.


    # System-related


    service lets you deal with running services:


    - view their status: service ssh status

    - check all statuses: service --status-all

    - restart a service: service ssh restart


    shutdown lets you turn off the system: shutdown -h now


    ... or cause a filesystem check following reboot: shutdown -Fr now


    kill lets you end any given system process.


    These are just the beginning of Linux command line prompts. Again, you can use
    the man command or help within most processes to better understand individual
    arguments, which there isn''t space or time for here.


    The last thing we need to talk about the Linux command line before we go onto
    Bash scripting is piping. Piping is putting a vertical pipe between two commands.
    This allows you to send the output of the first command as an input to the second
    command. You''ll see this from time to time, so you must know what it means.


    # Linux Architecture


    Before we can get into some of the cool codes and learn more about what we can
    do with the Linux system, we first need to look at what Linux is.


    While this may not have the name recognition that we will find with some of the
    other operating systems out there, like Mac and Windows, you will find that Linux
    is creating its own niche and becoming more popular each day.


    That is why we need to learn more about this and what we can do with it overall.


    From cars to smartphones, home applications and supercomputers, and enterprise
    servers to home desktops, this operating system will be all around us.


    This is a newer operating system in some respects, and it came out around the
    mid-1990s. Since that time, it has been able to reach a big user-base that is
    found throughout the globe. In fact, we will find that Linux is found, in one
    form or another, all around us.


    Linux is versatile and a great option to work with, so you will find that it will
    be inside a lot of the options you use regularly.


    For example, many phones are going to have Linux inside of them. It will also
    be found in thermostats, in cars, Roku devices, televisions, cars, and so much
    more. And it is also responsible for running much of what we can find on the Internet,
    so that is a big plus as well.


    But, outside of being one the platforms of choice to help out with a lot of the
    work that needs to be done with embedded systems, servers, and even desktops that
    are found throughout the world, Linux is going to have a lot of benefits that
    we can rely on as well. Compared to some of the other operating systems out there,
    it is one of the most reliable, worry-free, and secure options that you can choose.


    With some of this in mind, it is time for us to learn a bit more about some of
    the parts that come with this operating system and how we can use these for our
    own benefit.


    Here the information that you need to know as someone new to the Linux platform.


    # What is Linux?


    The first thing that we need to take a look at is that Linux is going to be an
    operating system.


    It is similar to the operating systems that we use, such as Mac OS, iOS, and Windows.
    In fact, one of the most famous platforms on the planet, Android, is going to
    be powered thanks to the Linux operating system.


    Linux operating system is one of the most sophisticated operating systems out
    there. To break this down, the operating system is simply going to be a type of
    software that will be able to manage all of the resources of the hardware associated
    with your laptop or desktop.


    To keep it simple, the operating system will help manage all of the communication
    between the hardware and the software.


    If you did not have an operating system in place, then the software would not
    function the way you would like.


    You will find that, just like some of the other operating systems out there, the
    Linux operating system will come in with a few different pieces that we need to
    work with.


    Some of these are going to include:


    - Bootloader: This is going to be the software that can manage the boot process
    on our computer. For most users, this is going to be the splash screen that is
    going to pop up and then go away when you are first booting up into the operating
    system.


    - Kernel: This is going to be the one piece of the whole that is called Linux.
    This will be the core of our system, and it is responsible for managing the memory
    peripheral devices and CPU. The kernel is going to be the bottom level that we
    will find with our operating system.

