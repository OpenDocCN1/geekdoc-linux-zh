    # Man-in-the-Middle (MitM) Attacks


    These attacks place the attacker between clients and servers'' communication,
    enabling them to interfere and tamper with those communications, including requests
    and responses. Various types of MitM cyber-attacks exist.


    # Session Hijacking


    Attackers launch these attacks by hijacking sessions between trusted clients and
    network servers. The attacking computer uses the trusted client''s IP address
    while the server proceeds with the session under the impression that it is communicating
    with the client. This confusion caused by the attack enables the attacker to communicate
    with the server and carry out their intentions without the actual client or the
    server being aware of what is happening.


    # IP Spoofing


    Attackers mislead systems by used spoofed IP addresses to gain access to a system.
    The system believes it''s communicating with a trusted entity due to the spoofed
    IP address. IP packets are used to send the spoofed IP source addresses to target
    hosts that accept and respond to the attacker''s requests in some environments
    with poor cybersecurity measures.


    # Replay


    These attacks are carried out by impersonating the participants of a conversation
    or a communication threat that has already taken place. The attackers save previously
    sent messages and send them again, impersonating one of the conversation participants.
    However, replay attacks'
  - '[PAGE 195]


    can be easily identified and dealt with by inspecting the messages and nonce''s
    timestamps.


    # Malware Attacks


    Any unwanted software installed in a computer without the user''s consent or the
    administrator of the said computer is called malware. These malicious software
    attaches themselves to the system''s legitimate codes and its useful applications
    while replicating across the internet. Many types of malware exist with various
    capabilities and intentions.


    # Macro Viruses


    This type of malware infect commonly used software such as Microsoft Word and
    Excel. They infect a computer by attaching themselves to the initializing sequence
    of a trustworthy application. They are installed on the computer without the user
    noticing, thus without the consent of the user. When the unsuspecting user opens
    the particular application, the virus attached to it takes control of the application
    and replicates itself by attaching to the computer''s system code.


    # File Infectors


    These viruses usually sneak into computers by attaching themselves to executable
    (.exe) files. When the unsuspecting user loads the executable file, the virus
    is installed on the computer without knowing. Some infectors create virus files
    with the same name as a trustworthy application as an executable file. When the
    file is opened, the virus springs into action and executes its intended procedures.


    # Boot-Record or System Infectors'
  - '[PAGE 196]


    These viruses attach themselves to the master boot record located on the hard
    disk of a computer. The virus is activated when the system starts. It looks at
    the computer''s boot sector and loads itself to the system memory, where it infects
    other disks and computers.


    # Polymorphic Viruses


    Different sequences of encryption and decryption are used to conceal viruses where
    they proceed to infect a certain code area. These viruses are repeatedly encrypted
    and decrypted, making them decrease power as changes to their source changes repeatedly.
    However, they are very difficult to detect.


    # Stealth Viruses


    System functions are used by stealth viruses to conceal themselves by compromising
    software intended to project a computer from malware. The malware detection software
    wrongly reports that an infected area is being uninfected. Furthermore, stealth
    viruses can hide the increases in the infected file''s size or the dates and times
    of modifications to the file.


    # Logic Bombs


    This malicious software is programmed to be activated by a specific occurrence
    on a computer. The existence of logic, such as specific data, time, or any other
    occurrence to trigger them, has given them the name "Logic Bombs."


    # Trojans


    Also known as Trojan Horses, these programs hide in trustworthy and useful programs
    while performing malicious functions. However, unlike'
  - '[PAGE 197]


    viruses, Trojans do not self-replicate themselves. Trojans can launch attacks
    on a computer and establish back doors that are later exploited by attackers.


    # Worms


    These attacks are different from virus attacks since they do not attach to any
    host files. Instead, they are programs themselves. Worms are circulated using
    emails, and opening the attached worms activates them. Then they spread throughout
    computers and networks. Worms usually send a copy of themselves to every contact
    found in the affected computer''s email address other than carrying out the malicious
    activities they have been programmed to. Worms are used to spread across the internet
    and overload email servers that result in multiple DoS attacks against the particular
    network.


    # Droppers


    These are programs that infect computers by installing viruses in them. Droppers
    usually do not carry malicious code themselves. However, they are still detected
    by most anti-virus software. Some droppers are so advanced that they can connect
    to the internet and download any updates to viruses they help install.


    # Ransomware


    This type of malware is intended to block access to the target user''s data. The
    program then threatens to erase or publish the data if the user fails to pay the
    ransom by following the instructions that it provides. Some ransomware can lock
    a computer in such a complex manner that removing them or recovering the data
    is often impossible without paying the ransom.


    Such a level of complexity is achieved using a technique known as Cryptoviral
    Extortion. The technique encrypts the data so that it''s almost'
  - '[PAGE 198]


    impossible to recover without the exact encryption key. Most ransomware ends up
    receiving their ransom as users are forced to protect their data and privacy.


    # Spyware


    This type of malware is intended to collect important information about the infected
    computer or network users. Some of the data that is often collected include user
    browsing habits and sensitive information at times. Spyware can track any computer
    activity without the knowledge of the user and send the collected data to remote
    attackers. They can also download other malicious software from the internet.
    Spyware is installed on a computer without the user''s knowledge and consent when
    the user installs other freeware programs.


    # Adware


    These software applications are used by marketing companies to advertise products
    and services by infecting computers. The infected computers end up displaying
    advertising banners irrespective of the program that is running. Adware is usually
    downloaded to a computer automatically when the user browses the internet. They
    usually use pop-up windows and bars to display advertising when it is being used.


    # SQL injection Attacks


    These cyber-threats have been a widespread problem for websites that are driven
    by databases. They come into effect when the malefactor executes a SQL query to
    a website database with data input from the client to the server. Various SQL
    commands are then inserted into the data-plane input so that predefined SQL commands
    can be run. A successful SQL injection'
- md: '

    attack can gain access to sensitive data in a database and insert, update, or
    delete data.


    Furthermore, they can force the execution of administrative operations on the
    database, such as shutdowns and file recovery. Some attacks can also issue commands
    to the infected computer''s operating system. The vulnerability of computers to
    SQL injection attacks is caused by the fact that SQL does not differentiate between
    data planes and control. Therefore, these types of attacks are carried out through
    websites that use dynamic SQL.


    # Password Attacks


    Passwords are the most widespread method to authenticate users to computer systems.
    Therefore, obtaining passwords have motivated attackers since having access to
    a user''s password would mean straightforward access to the particular computer
    system. Hackers use various methods to steal passwords, and one of the most common
    ways of achieving that is by looking through the user''s files.


    Users who practice better cybersecurity practices do not leave their passwords
    lying around in their computers. In such situations, hackers use "sniffing" that
    acquires passwords with social engineering''s smart use. Brute-force password
    guessing involves a random approach where numerous different passwords are guessed
    using a set of logic such as the user''s name, date of birth, hobbies, job title,
    and other important facts and figures.


    Dictionary attacks utilize a database of common passwords. These passwords are
    encrypted and trials repeatedly in the hope of coming across the correct password
    of the targeted user. Account lock-out policies are highly recommended to protect
    users from various password attacks. The policy locks the computer upon reaching
    a certain number of incorrect password attempts. There are various lock-out policies
    out there that individuals and organizations implement varying in complexity.


    # Drive-By Attacks


    These cyber-attacks are one of the most common ways of spreading malware. Many
    websites on the internet are not secure. Hackers identify such websites and plant
    malicious scripts into their PHP or HTTP codes. These malicious scripts can directly
    install malware onto the computers of those who visit these insecure websites.
    Some of the websites used by hackers redirect users to other websites controlled
    by hackers where their computers are infected.


    Furthermore, one''s computer can face a drive-by attack when viewing emails or
    through pop-up windows. One of the main reasons that expose users to drive-by
    attacks is the fact that they don''t require the user to take a certain action
    for an attack to take place other than visiting an insecure website. There is
    no need to click on any button, link, install any program, or open a malicious
    link or executable file attached to email.


    Drive-by attacks use security flaws of various operating systems and web browsers,
    especially those that haven''t regularly updated. Therefore, computer users and
    those who browse the internet, especially insecure websites, can protect themselves
    from drive-by attacks by keeping their operating systems and browsers updated.
    Furthermore, it is recommended that internet users limit or completely avoid insecure
    websites.


    However, some hackers can infect the most secure websites. Therefore, many internet
    users are exposed to drive-by attacks. The removal of unnecessary apps and programs
    from devices has also helped decrease the risks of drive-by attacks. Computers
    with many plug-ins tend to be more vulnerable to these attacks as they exploit
    those plug-ins to achieve their malicious intentions.


    # Eavesdropping Attacks


    These attacks intercept network traffic intending to gain credit card numbers,
    passwords, and other sensitive information that users usually send over network
    traffic. Eavesdropping can be divided into two categories as passive and active
    eavesdropping.


    Passive eavesdropping is when a hacker listens to the messages transmitted through
    a network to gather sensitive information belonging to users. On the other hand,
    active eavesdropping is when a hacker disguises himself/herself as a friendly
    entity to gather information from the users. The hackers send queries pretending
    to be a trustworthy entity and gain the information that they are after. Active
    eavesdropping is also known as scanning, probing, and tampering.


    It must be highlighted that it is more important to identify or detect passive
    eavesdropping attempts than active ones as they are more difficult to detect and
    can cause more damage. Active eavesdropping takes more work since the attacker
    needs to learn about a friendly entity known by the particular target user, which
    is usually achieved by passive eavesdropping.


    Therefore, detecting passive eavesdropping attempts can protect one''s information
    and eliminate the chances of active eavesdropping taking place. The encryption
    of data is one of the most effective methods of overcoming passive eavesdropping
    attacks.


    # Birthday Attacks


    These attacks are designed to infiltrate hash algorithms that protect the integrity
    of messages, digital signatures, and software. A message is usually characterized
    by a message digest (MD) that has a fixed length. A hash function creates the
    MD of a message, and it does not depend on the length of the message.


    Birthday attacks are carried out by finding two random messages that produce the
    same MD through a hash function. Attackers achieve this goal by calculating the
    MDs for random messages that they create and compare those MDs with those created
    for messages sent by users.


    If an attacker has an MD, which is the same as the MD assigned for a message sent
    by the target, the attacker can replace his message with his random message. What
    makes birthday attacks dangerous is detecting such attacks even if the target
    compares MDs of the messages since they are the same.


    # Cross-Site Scripting (XSS) Attacks


    These cyber-attacks utilize third-party web resources to execute malicious scripts
    in web browsers and applications that use scripts. Payloads of malicious JavaScript
    are injected into the databases of websites by the attackers. When a user visits
    a website, the website''s pages are transmitted to the user''s browser, including
    the payload injected by the attacker, which is transmitted as a part of the HTML
    body.


    The victim''s web browser then executes the script that is transmitted that includes
    the malicious scripts. These malicious scripts usually send the cookies that belong
    to the victim''s server. The attacker can then use the cookies for session hacking.
    When XSS is used to detect vulnerabilities, the consequences can be costly. Identification
    of vulnerabilities allows attackers to log keystrokes, collect network information,
    capture screenshots of the victim''s screen, and even remotely access the victim''s
    device and control it other than stealing cookies.


    JavaScript is widely used by attackers for XSS attacks, although Active X, Flash,
    and VBScript are also used. Most attackers prefer JavaScript due to its popularity
    on the web. One of the best ways to decrease the chances of XSS attacks is by
    sanitizing users'' data inputs in HTTP requests before responding to them.


    All the data is filtered, validated, and escaped in such a scenario before it
    is transmitted back to the user, including the query parameter values. Giving
    users the ability to disable client-side scripts is also an effective way of overcoming
    XSS attacks.


