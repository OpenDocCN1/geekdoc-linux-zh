    More specifically, here are some ways that these attacks are carried out.


    A backdoor, also known as a cryptosystem or algorithm, is a way to bypass

    normal security controls such as passwords. They can be authorized (as for

    a specific purpose) or added by an attacker. In any case, they create a

    vulnerability.


    To make a computer or resource unavailable, denial-of-service attacks at

    cur when incorrect passwords are entered multiple times, locking the

    account or overloading the system with requests and blocking all users.

    These attacks can stem from zombie computers or even from duping

    innocent systems into sending unwanted traffic.


    Eavesdropping is exactly what it sounds like—listening to private

    communications between network hosts. Certain programs are used by

    government agencies to "audit" ISPs. This widespread practice extends to

    closed systems when electromagnetic transmissions are monitored.


    Masquerading through falsifying data to gain access to unauthorized data is

    called spoofing and comes in many forms: email spoofing, forgery of a

    sending address; MAC spoofing, changing the Media Access Control

    address to pose as a valid user; biometric spoofing, faking a biometric

    sample; IP address spoofing, altering the source IP address to hide identity

    or impersonate another system.


    Through physical access or direct-access attacks, a perpetrator can

    data, compromise security, install listening devices or worms, and more.

    Even protected systems are vulnerable to this type of attack.'
  - '[PAGE 206]


    Phishing frequently uses email spoofing or instant messaging to direct users to
    enter confidential information by looking almost the same as legitimate sites.


    An attacker can escalate their access level through privilege escalation by fooling
    the system into granting access to restricted data or resources.


    Clickjacking is literally hijacking a user to click on a link or icon to another
    website other than the intended one. Particularly sneaky, clickjacking routes
    the clicks, or sometimes keystrokes, to an irrelevant page.


    By impersonating an institution, bank, customer, or other entity, social engineering
    leads users to reveal passwords, credit card numbers, and other private information.
    This scam reportedly costs U.S. businesses more than $2 billion every two years.


    Without computers, the world would slip back into the pre-Industrial Revolution
    mode. Technology has streamlined every aspect of life, particularly for businesses
    and other public entities, some of which are more and more at risk.


    Financial authorities, investment banks, and commercial banks are recruiting cybercriminals
    who see an avenue for market abuse and illicit profits. Any website that allows
    the conversion of funds or purchasing of products is also a priority, ATMs are
    regularly hacked for consumer details and PINs.


    Utilities and Industry: Vital services, including the power grid, nuclear power
    plants, water and gas networks, and telecommunications are controlled by computers.
    It has been proven that even those controlled by computers not connected to the
    Internet are vulnerable to attack.'
  - '[PAGE 207]


    Aviation: One power outage at a major airport can have a tumultuous ripple effect
    on air traffic. Radio transmissions would be disrupted, and an in-plane attack
    can occur, loss of system integrity and aircraft, and air traffic control outages
    are just some of the possible outcomes.


    Personal devices: All of those wonderful gadgets that people use to simplify life—smartphones,
    tablets, smartwatches, activity trackers—can be exploited through built-in cameras
    and other devices. Attackers can collect health other personal information or
    use the device networks as paths to an attack.


    Corporations: Identity theft and data breaches as credit card information have
    been aimed at large corporations such as Target Corporation and Equifax. In some
    cases, foreign governments attempt to spread propaganda or spy through attacks.
    Health insurance fraud, which costs everyone, impersonates patients to obtain
    drugs for illicit purposes, which is also common. Despite these activities, 62%
    of all organizations did not augment security training in 2015.


    Autos: Today''s vehicles practically drive themselves, and the day when this common
    is not far off. Cruise control, airbags, anti-lock brakes, and other features
    making driving more enjoyable and, hopefully, WiFi and Bluetooth keep the cars
    connected and raise the possibility of security breaches.


    Government: Attacks on government and military systems create chaos, disrupt services,
    and—to the extreme—qualify as acts of terrorism. Whether it is an activist, foreign
    government, or other hackers, the result is infrastructure malfunction of personnel
    records, police and other responder communications, student records, traffic controls,
    and financial'
