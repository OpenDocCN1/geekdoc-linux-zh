    ## 通过网络连接你的 Linux 系统


    如果你希望通过网络连接你的 Linux 系统，则必须使用 SSH。


    SSH 是 Secure Shell（安全壳）的缩写，它是最著名的网络协议之一。


    SSH 的目的是让你能够通过网络安全地连接到远程机器。


    通过网络连接你的 Linux 系统：


    -   Windows – 使用 PuTTY

    -   Mac 和 Linux – 使用命令行中的 SSH。


    ## Windows


    -   打开网页浏览器并下载 PuTTY。

    -   打开 PuTTY，然后在正确的框中输入 IP 地址或主机名（Hostname）。

    -   如果没有提供端口号，请保持为默认的 22。

    -   点击数据（Data），然后点击自动登录用户名（Auto-Login Username）——输入用户名。

    -   要保存会话，点击保存会话（Saved Sessions）框，输入名称并点击保存（Save）。将来，你可以双击保存的会话进行连接。

    -   点击打开（Open），即可建立连接。

    -   首次连接到服务器时，PuTTY 将询问是否允许缓存服务器的主密钥——点击是（Yes）。


    ## Linux 和 Mac


    Linux 和 Mac 都已经内置了作为命令行程序的 SSH 客户端。要使用它，请运行终端：


    -   Mac – 应用程序（Applications）文件夹

    -   Linux – 打开仪表板（Dashboard）并搜索终端（Terminal）


    终端启动后，只需使用 SSH 命令即可建立连接。


    请注意命令始终是区分大小写的，因此请仅使用小写。输入 "ssh" 后跟 Linux 服务器上的用户名。


    当你首次连接到服务器时，你需要验证主密钥。


    输入 Yes 继续连接，然后按回车键。当连接建立后，输入你的密码。要退出连接，输入 exit 然后注销。


    此时，你已经完成了针对你所选择的 Linux 发行版或 Linux 操作系统的下载和安装方法。在完成针对新操作系统调整电脑的过程后，你需要根据你的需求和工作机会设置
    Linux 性能和环境。


    根据你选择的 Linux 发行版和桌面环境，你的桌面环境和安装的应用程序将有所不同。大多数环境都能涵盖你的典型需求和基于计算机办公的类似个人需求。大多数 Linux
    发行版都连接了 Firefox 浏览器，而开源 Chromium 浏览器或 Google Chrome 只需点击几次即可获得。


    你的桌面环境应该具备所有标准：应用程序菜单、某种任务栏以及通知区域或“系统托盘”。你可能还会发现一组系统服务，它们将帮助你配置硬件并让你的桌面以正确的方式正常工作。


    使用 Ubuntu 16.04 的 Unity 桌面可能会有点奇怪。如果你想尝试它，我们建议尝试 Ubuntu GNOME，它使用 GNOME 桌面而不是
    Unity。


    如果你不喜欢当前使用的桌面——虽然某些发行版针对特定的桌面进行了优化，但几乎每个主流发行版都提供了在系统安装后安装你所选择的桌面的选项。只要你有足够的剩余存储空间，就可以同时安装
    GNOME、KDE、Cinnamon、XFCE 以及其他桌面。登录桌面时，你可以选择运行哪个环境。

