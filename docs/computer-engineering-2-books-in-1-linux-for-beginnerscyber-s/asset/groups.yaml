    So, it is not a question of IF, but WHEN the cyber attackers will break-in.

    And when the cyber attackers break-in, they will remain undetected for many months.


    The median or mean number of days the cyber attackers remain undetected varies
    based on the source. Examples are:


    - Mandiant’s M-Trends Report;

    - Verizon’s Data Breach Investigations Report;

    - IBM and Ponemon Institute’s Cost of a Data Breach Study.


    One thing is certain, however. The cyber attackers can hide for many months, and
    the longer it takes to detect the cyber attackers, the more the cost the organization
    ends up suffering.


    Based on research into dozens and dozens of cases, I have identified signals in
    the Cyber Attack Chain that every organization should understand and look for.


    When researching the cases, it became evident that in each case, the cyber attackers
    took steps that fit into one of the steps as I have outlined in the Cyber Attack
    Chain. It was also clear that there were signals of the cyber attackers at work
    in each step, but the organization did not detect these signals.


    It is time for every organization to understand what the Cyber Attack Signals
    are and implement them as part of their cybersecurity program. By doing so, they
    will transform the defense into offense and detect the cyber attackers early.


    A Cyber Attack Signal is a high-probability signal of cyber attackers at work,
    trying to hide and avoid detection while performing one of the Cyber Attack Chain
    tasks. They are at work to accomplish their ultimate objective—the theft of data
    or intellectual property (IP) or another compromise, harm, or disruption. A Cyber
    Attack Signal focuses on cyber attackers’ behavior.


    I have identified 15 Cyber Attack Signals that, as a minimum, every organization
    should focus its monitoring on. These Top 15 signals relate to cyber attackers’
    behavior. They are timely signals before the cyberattack is executed, occurring
    at the intrusion, lateral movement, or command and control steps of the Cyber
    Attack Chain. Therefore, they are of the greatest value.


    This is not an exhaustive list, and there will probably be other signals relevant
    to an organization based on its risk profile and its Crown Jewels that may indicate
    the cyber attackers at work. As such, each organization should tailor its list
    of Cyber Signals for monitoring.


    ## Intrusion


    ## Patch window


    This is when a vulnerability remains unpatched and how attackers could exploit
    it, providing an alert about Crown Jewels possibly impacted, probable attack timeline,
    and expected attacker behavior.


    ## Web shell


    This is the attempted installation or installation of a web shell to a web server.
    It would exploit server or application vulnerabilities or configuration weaknesses
    to intrude.


    ## Lateral movement


    ### Abnormal logons

    These are anomalies in logons compared to normal logon patterns.


    ### Privileged users’ behavior

    These are anomalies in privileged users (users with greater access levels and
    capabilities) compared to normal behavior.


    ### WMI anomalies

    This is an abnormal activity with Windows Management Instrumentation (WMI), a
    set of tools for system administrators to manage Windows systems locally and remotely.


    ### Internal reconnaissance signals

    These are anomalies in scripts or batch scripts running on email, web, file servers
    or domain controller or hosts, or scanning servers and ports.


    ### Malware signals

    These are anomalies from normal behavior patterns in terms of users, files, processes,
    tasks, sources, and destinations to indicate initial malware installation or propagation.


    ### Ransomware signals

    This is anomalous activity to indicate initial ransomware installation or propagation,
    such as the installation of new .dll file or attempted communication with a TOR
    website (i.e., server on the TOR network, a service used to provide anonymity
    over the Internet.)


    ### Malicious PowerShell

    This is an abnormal activity with PowerShell, a scripting language for system
    administrators to automate tasks, such as odd characters (e.g., ''$'') added to
    the scripts, use of “powershell.exe” by abnormal users at unusual times or locations,
    or scripts containing command parameters.


    ## RDP signals

    These are anomalies with Remote Desktop Protocol (RDP), enabling a user (e.g.,
    as help-desk staff) to use a graphical interface to connect to another computer
    in a network as abnormal RDP users, source or destination logons.


    ## SMB anomalies

    These are anomalies with Server Message Block (SMB), a Microsoft Windows protocol
    that enables remotely managing files, file sharing, printing, and directory share,
    among other functions in a network.


    ## Unusual logs behavior

    These are anomalies in event logs, such as event logs removed, stopped, or cleared
    with details (user details, date, time, type of log, the command executed, asset
    impacted, source, and destination).


    ## Command and control


    ### C&C communications

    This is anomalous activity indicating attempted communication or communications
    with a command and control (C&C) server, such as a request to an unusual domain
    name or a one-off domain name, a request to the numeric IP address as the domain
    name for the host, requests to certain IP addresses or hosts with a certain frequency
    (hourly, daily or other).


    ### ICMP packets

    These are anomalies with Internet Control Message Protocol (ICMP) packets, such
    as abnormal size, frequency, source, or destination.


    ### Hidden tunnels

    These are HTTP anomalies, HTTPS or DNS traffic compared to normal baseline patterns
    indicating communications with a C&C server using a tunnel designed to blend in
    with normal traffic.


    ## Chapter Fifteen:

    ## Ethical Hacking


    When it comes to security, being a hacker is one of the most commonly used terms.
    It appears everywhere, and even the entertainment industry and many authors often
    use it in their movies, books, TV shows, and other media forms. Therefore, the
    word "hacker" is usually seen as a bad profession and always associated with dark
    or real criminal activity. When people hear that someone is involved in hacking,
    they immediately see that person as someone who has no good intentions. They are
    presented as "operators from the shadows," even antisocial. On the other hand,
    they are also seen as a social activist. This label became especially popular
    after a few things like WikiLeaks. Many hackers were involved in obtaining many
    documents from governments, politicians, and companies that showed very different
    information from the information given to the public. Organized groups such as
    Anonymous or Lizard Squad have also had a huge impact on the hacking experience
    in recent years.


    Hacking is by no means a phenomenon that has appeared overnight. It existed in
    various forms and evolved all the way from the 1960s. However, it was never tackled
    as a criminal activity at first. We''ll look at some cases will take a closer
    look at some of the attacks and generic examples that have gradually changed that
    picture.


    Accessing services or resources that you do not have permission to use is usually
    called stealing usernames and passwords. In some cases, obtaining this information
    without permission is considered a cybercrime, even if you do not use it or as
    accounts of friends or family members.


    There is a form of a digital offense called network intrusion that is also considered
    a cybercrime. In essence, as with ordinary offenses, this means that you went
    somewhere without permission to enter (or in this case, access). So, if someone
    gets access to a system or group of systems without permission, we can say that
    the person violated the network and thereby committed cybercrime.


    However, some network intrusions can take place without using hacker tools. Sometimes
    logging into guest accounts without prior permission can be seen as cybercrime.


    One of the most complex simplest forms of hacking is to go after the most vulnerable
    element in the system—people. This type of cybercrime is known as social engineering,
    and we say it can be simple because the person is a much more accessible part
    of the system than any other, but people can provide clues that are difficult
    to understand, whether spoken or not, making it difficult for the hacker to get
    the information they need.


    The issue of posting or sending illegal material has generally become difficult
    to address, especially in the past decade. Social media received a lot of attention,
    and many other internet-related services increased in use and popularity. This
    allowed many illegal materials to move from one place to another in the shortest
    possible time, allowing it to spread very quickly.

