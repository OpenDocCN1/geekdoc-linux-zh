    ## Chapter Four:


    ## Common Cyberattacks


    Cyberattacks are getting highly sophisticated as hackers are coming up the latest
    and innovative methods to stage an attack and threaten different computer networks''
    security. The attacks are getting so much sophisticated that they are getting
    tougher to detect. Consequently, the attacks are getting more lethal than they
    were ever before.


    Cybersecurity doesn''t depend on the size of your organization. Whether you have
    a start-up business or a multimillion-dollar company, you should be able to be
    aware of how risky a cyberattack can be. The rise of cyberattacks gives room to
    the question of why do hackers attack cyberspace? What is the motivation behind
    such heinous attacks? A general perception is that financial gain drives them
    to stage high profile cyberattacks on big corporations'' computer systems. Some
    also that for espionage purposes. This chapter will shed light on hackers'' motivations
    on their backs to penetrate an individual computer or an enterprise computer.


    Most of the time, the attack is a kind of breach that aims at infiltrating the
    credit and debit card cards details. This information is then sold on the dark
    web later to bag heavy profit. The story doesn''t end here. In a majority of cases,
    profit is just a smokescreen to hide something bigger and deeper.


    Espionage is also linked to a breach of data of a corporation or an official website
    of a country. These kinds of attacks are typically aimed at retrieving information
    from the victim. Many things remain the same when it comes to espionage through
    a cyberattack, including monitoring communication running on cyberspace. There
    is another popular technique in espionage known as stealing secrets. Earlier on,
    this task came into the domain of individuals who physically penetrated the space
    and compromised certain assets inside the organization. To give you a taste of
    how it all happened, I''ll state an example from Hollywood. If you are an admirer
    of Tom Cruise and his spy thrillers, you might for sure to be acquainted with
    the character of Ethan, who was always on some kind of mission to infiltrate a
    facility and steal some important documents that could turn the tables on the
    bad guys. Spy is the word that they use for such kind of person. Nowadays, things
    are different. There is hardly anything left in the physical domain. The craft
    of stealing an important bunch of information is more about being electric. Computers
    have the capacity to consume billions of files that were once stored in the company''s
    ledgers and on loads of papers.


    An offensive action targeting computer systems, networks, infrastructures, or
    personal devices to alter, steal, or destroy data and computer systems is called
    a cyber-attack. Although each cyber-attack is different, many similarities exist,
    such as the approach and strategy used. Many criminals who launch cyber-attacks
    using hacking techniques that have proven successful in the past while considering
    the nature of the target and the attack. In this chapter, various types of cyber-attacks
    are discussed in depth while also shedding light on the damages they usually cause.


    ## Denial-of-Service (DoS) & Distributed Denial-of-Service (DDoS) Cyber-Attacks


    A Dos attack attacks computer systems by overwhelming their resources that affect
    computer systems’ ability to respond to service requests. Similarly, a DDoS attack
    overwhelms a computer system’s resources. However, a DDoS attack is launched using
    multiple host computers infected by the attacker with malicious software.


    Unlike many cyber-attacks, Denial-of-Service attacks do not offer attackers direct
    benefits by increasing or gaining access to a computer system and its data. Service
    denial is the purpose of a DoS or DDoS attack instead of control or data theft.
    Some businesses use Denial-of-Service attacks to interfere with the services provided
    by competitors. Furthermore, DoS or DDoS attacks are also used to cause system
    downtime so that the system can be offline.


    ### TCP SYN Flood Attacks


    Attackers utilize the buffer space in the Transmission Control Protocol or TCP
    session handshake in this type of attack. The target system is flooded with connection
    requests by the attacker''s device. However, the attacker''s device does not respond
    to the target system’s replies. As a result, the target system times out upon
    waiting for responses, leading it to become unusable or even crash due to the
    filling up of queues.


    ### Smurf Attacks


    The target network is saturated with traffic by the attackers using ICMP and IP
    spoofing in a Smurf attack. ICMP echo requests are used in this method directed
    at broadcast IP addresses. The attacker creates ICMP echo requests from a spoofed
    IP address giving the broadcast IP addresses the impression that the target victim
    is sending the request. Multiple requests are sent to broadcast IP addresses,
    and the target address receives multiple responses to overwhelm it. Spoofed ICMP
    echo requests are automated and generated in bulk by the attacker, causing serious
    network congestion that forces the target network to deny services.


    ### Ping-of-Death Attacks


    The maximum size of an IP allowed is limited to 65,535 bytes. The attackers use
    fragmented IP packets representing the target system. These IP packets cause crashes
    and buffer overflows, disrupting the services provided by the target computer
    network. However, Ping-of-Death attacks can be successfully overcome using a firewall
    that makes any fragmented IP packet meets the maximum size allowed.


    ### Botnets


    Hackers infect millions of systems and gain control over them to be used as bots
    to launch DDoS attacks. The target system or network is attacked using these bots
    or zombie systems under the control of the attacker. Attackers often use botnets
    to overwhelm the bandwidth of the target system and its processing capabilities.
    DDoS attacks are usually difficult to trace since they use infected bots or computer
    systems located in numerous geographic locations.


    ### Phishing Attacks


    These cyber-attacks are carried out by sending highly realistic emails that seem
    to be from trustworthy sources to gain sensitive personal information from the
    receivers or influence them to carry out an action attackers desire. Therefore,
    phishing is a combination of technical trickery and social engineering. Emails
    sent out by attackers may include attachments loaded.

