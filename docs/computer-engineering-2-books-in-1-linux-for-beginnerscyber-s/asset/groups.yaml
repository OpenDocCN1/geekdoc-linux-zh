    Vim is the most popular text editor across all Linux flavors and is an improved
    version of the previously popular vi editor. Vim can be configured as per user
    needs and includes features like color formatting, split-screen editing, and highlighting
    text for editing.


    Vim works in 4 modes, which are used for different purposes.


    - 1. Edit mode

    - 2. Command mode

    - 3. Visual edit mode

    - 4. Extended command mode


    When you first launch Vim, it will open in the command mode. The command mode
    is useful for navigation, cut and paste jobs, and other tasks related to manipulating
    text. To enter the other modes of Vim, you need to enter single keystrokes specific
    to every mode.


    If you use the i keystroke in the command mode, you will be taken to the insert
    mode, which lets you edit the text file. All content you type in the insert mode
    becomes a part of the file. You can return to the command mode by pressing the
    Esc key on the keyboard.


    If you use the v keystroke in the command mode, you will be taken to the visual
    mode to manipulate text by selecting multiple characters. You can use V and Ctrl+V
    to select multiple lines and multiple blocks, respectively. You can exit the visual
    mode using the same keystroke: v, V, or Ctrl+V.


    The keystroke takes you to the extended command mode, which lets you save the
    content that you typed to the file and exit the vim editor.


    More keystrokes are available in vim for advanced tasks related to text editing.
    Although it is known to be one of the best text editors in Linux globally, it
    can get overwhelming for new users. We will go through the minimum keystrokes
    essential for anyone using vim to accomplish editing tasks in Linux.


    Let us go through the steps given below to get some hands-on experience of vim
    for new users.


    - 1. Open a file on the shell prompt using the command `vim filename`.


    - 2. Repeat the text entry cycle given below as many times as possible until you
    get used to it.


    Use the arrow keys on the keyboard to position the cursor. Press `i` to go to
    insert mode


    Enter some text of your choice


    You can use `u` to undo steps taken on the current line that you are editing


    Press `Esc` key on the keyboard to return to the command mode


    - 3. Repeat the following cycle, which teaches you to delete text as many times
    as possible until you get the hang of it.


    Position the cursor using the arrow keys on the keyboard. Delete a selection of
    text by pressing `x` on the keyboard


    You can use `u` to undo steps taken on the current line that you are editing


    - 4. You can use the following keystrokes next to save, edit, write, or discard
    the file.


    Enter:`w` to save/write the changes you have made to the file and stay in the
    command mode


    Enter:`wq` to save/write the changes to the file and exit Vim


    Enter:`q` to discard the changes that you have made to the file and exit Vim


    ## Rearranging the Existing Content in Vim


    The tasks of copy and paste are known as yank and put in Vim. This can be achieved
    using the keystrokes of **y** and **p**. First, place the cursor at the first
    character you wish to copy from and enter the visual mode. You can now use the
    arrow keys to expand your selection. You can press **y** to copy the text to the
    clipboard. Next step is to place the cursor where you want to paste the selected
    content and press **p**.


    Let us go through the steps given below to understand how to use the copy and
    paste feature using yank and put in Vim.


    - 1. Open a file on the shell prompt using the command `vim filename`.


    - 2. Repeat the text selection cycle given below as many times as possible until
    you get used to it.


    Position your cursor to the first character using the arrow keys on the keyboard


    Enter the visual mode by pressing **v**


    Position your cursor to the last character using the arrow keys on the keyboard


    Copy the selection by using yank **y**


    Position your cursor to the location where you want to paste the content using
    the arrow keys on the keyboard


    Paste the selection by using put **p**


    - 3. You can use the following keystrokes next to save, edit, write or discard
    the file.


    Enter:w to save/write the changes you have made to the file and stay in the command
    mode.


    Enter:wq to save/write the changes to the file and exit Vim


    Enter:q to discard the changes that you have made to the file and exit Vim


    Note: Before you take tips from the advanced vim users, it is advisable that you
    get to the basics of vim as performing advanced functions in vim without proper
    knowledge may lead to modification of important files and permanent loss of information.
    You can learn more about the basics of vim by looking up the Internet for vim
    tips.


    ## Using the Graphical Editor to Edit Text Files in Red Hat Enterprise Linux 7


    This section will learn to access, view, and edit text files using a tool in Red
    Hat Enterprise Linux 7 known as gedit. We will also learn how to copy text between
    two or more graphical windows.


    Red Hat Enterprise Linux 7 comes with a utility known as gedit, which is available
    in the operating system''s graphical desktop environment. You can launch gedit
    by following the steps given below.


    Applications > Accessories > gedit


    You can also launch gedit without navigating through the menu. You can press Alt+F2,
    which will open the Enter A Command dialog box. Type gedit in the text box and
    hit Enter.


    Let us go through the basic keystrokes that are available in gedit. The menu in
    gedit will allow you to perform numerous tasks related to file management.


    Creating a new file: Navigate through File > New (Ctrl+n) on the menu bar or click
    the blank paper icon on the toolbar to start a new file.


    Saving a file: Navigate through File > Save (Ctrl+s) on the menu bar or click
    the disk icon on the toolbar to save a file.


    Open an existing file: Navigate through File > Open (Ctrl+o) on the menu bar or
    click on the toolbar''s Open icon. A window will open up and will be showing all
    the files on your system. Locate the file you wish to open and select it and click
    on open.


    If you select multiple files and click on open, they will all open up and have
    a separate tab under the menu bar. The tabs will display a filename for existing
    files or save a new file with a new name.


    Let us now learn how to copy text between two or more graphical windows in Red
    Hat Enterprise Linux 7. Using the graphical environment in Red Hat Enterprise
    Linux 7, you can copy text between text windows, documents, and command windows.
    You can select the text that you want to duplicate using copy and paste or move
    text using the cut and paste options. In each case, the text is stored in the
    clipboard memory so that you can paste it to a destination.


    Let us go through the steps to perform these operations. Selecting the text: Left-click
    and hold the mouse button at the first character of the text.


    Drag the mouse until you have selected all the desired content and then release
    the button. Make sure that you do not press anything, as that will result in the
    deselection of all the text.


    Pasting the selected text: There are multiple methods to achieve this. This is
    the first one.


    Right-click the mouse on the selected text at any point.


    A menu will be displayed, and you will get the option to either cut or copy.


    Next, open the window to paste the text and place the cursor in the desired location
    where you wish to paste the text. Right-click the mouse again and select Paste
    on the menu that appears.


    There is a shorter method to achieve the same result as well.


    Firstly, select the text that you need.


    Go to the window to paste the text and place the cursor at the desired location
    in the window. Middle-click the mouse just once and will paste the selected text.
    This method will help you copy and paste but not cut and paste. However, to emulate
    a cut and paste, you can delete the original text as it remains selected.


    The copied text remains in the clipboard memory and can be pasted again and again.


    The last method is the one using shortcut keys on the keyboard:


    After selecting the text, you can press Ctrl+x to cut or Ctrl+c to copy


    Go to the window to paste the text and place the cursor at the desired location.


    Press Ctrl+v.

