    +   - DNS Server

    - Network boundaries or segments

    - User accounts with higher than average privileges

    - Centralized file shares

    - Centralized applications'
  - '[PAGE 212]


    Once you find a likely distribution vector, you can then move on to enforcing
    additional means of mitigation, starting with implementing network control lists
    as a means of denying applications the capability of communicating directly with
    other systems. Doing so will immediately make it much easier to isolate and sandbox
    specific resources so that you can more accurately determine what''s wrong. Your
    internal DNS can be used for this task by simply adding a null pointer to the
    DNS zone for any identified applications or servers, which will make it easy to
    see what both are running and unidentified.'
  - '[PAGE 213]


    # # Chapter Six:


    # ## Cybersecurity Terminology


    Several terms used throughout this book relate to the cybersecurity domain. It
    is important to cover these terms in the first chapter to be familiar with them
    when they start making subsequent appearances. These terms are related to all
    the devices you use today, the software on those devices, the network infrastructure
    the devices are connected to, and so on. We will now go through these terms individually.


    # ### Cloud


    The Internet is made up of clouds—and not the ones in the sky. Cloud computing
    is a technology that allows a user to access their files from anywhere in the
    world. Cloud is a network of computers that store data that can be accessed by
    a smart device remotely. The most common example of a cloud is your emails. They
    are stored on a distributed set of computers on the Internet, and you get to access
    them from anywhere as long as you have the required credentials. Another example
    would be something like a Spotify playlist that you have created using your mobile
    phone, but you still get to access the same playlist from another device like
    a laptop when you log in using the same account.


    # ### Software'
  - '[PAGE 214]


    The software can be defined as instructions that tell a computer what to do. These
    instructions are put into a software package, which a user can install and start
    using. One of the most common software examples is Microsoft Office, which is
    used to create documents, presentations, etc. Your smartphone apps are also software
    that you use for various purposes. For example, WhatsApp messenger is the most
    common app used to send messages.


    # Domain


    A domain is a parent for child devices interconnected, such as computers, smartphones,
    printers, etc. For example, all the computers at a workplace are a part of a domain
    belonging to the organization. There are policies defined in the domain''s framework
    that govern the access that the devices will have under that domain.


    # IP Address


    An IP address is a digital address assigned to a smart device over a network,
    a local network, or the Internet. Every device connected to a network is associated
    with an IP address. That IP address is used by other devices to locate and communicate
    with each other.


    # Virtual Private Network (VPN)


    A virtual private network is a network over which you can be anonymous. You get
    assigned an IP belonging to a different region, and all your actions over the
    Internet are logged via that IP, thus keeping your original IP hidden. VPN applications
    also encrypt the traffic for you so that the Internet Service Provider or the
    government cannot track your activities online. VPNs are also used by organizations
    to keep you connected to the office'
  - '[PAGE 215]


    network if you want to access the office network from outside. This has gained
    a lot of popularity in recent times as it helps a person work from home or remotely.


    # Exploit


    An exploit is defined as a malicious piece of code that can be used to take advantage
    of a vulnerability or loophole in a computer or a server. Viruses, Trojans, Botnets,
    etc., are all used to execute an exploit in a target system.


    # Breach


    When an attacker takes advantage of a system''s vulnerability and gains access,
    it is known as a breach.


    # Firewall


    The technology used to create rules for a system so incoming and outgoing traffic
    can be filtered, known as a firewall. Firewalls can be implemented using both
    hardware and software.


    # Malware


    Malware is a broad term or an umbrella that includes any malicious software that
    can harm a computer. The most common types of malware are viruses, worms, Trojans,
    ransomware, etc.


    # Virus


    A virus is defined as malware that can harm certain programs on a computer. It
    can further replicate itself and spread over multiple files and computer networks.
    It needs a host file and cannot execute by itself. Viruses'
  - '[PAGE 216]


    were known to affect only software, but they have evolved in recent years even
    to cause physical damage to hardware.


    # Ransomware


    Ransomware is a type of malware that will encrypt all the data on your computer
    and prevent you from accessing it. The attacker who deployed the ransomware will
    leave an application where you make a payment to them, after the files will automatically
    be decrypted. In 2017, a ransomware known as WannaCry infected all Windows-based
    machines.


    # Trojan Horse


    A Trojan horse is comparable to a virus, but it does not execute by itself. It
    is usually masked and lies under a file, which may be important to a user. For
    example, a user may receive a PDF with the content they were expecting, but at
    the same time, clicking on that PDF triggers a malicious script. This implementation
    is known as a Trojan horse.


    # Worm


    A worm is a piece of malicious code that is capable of replicating itself over
    a network. It may not necessarily infect a file like a virus does, but it can
    do something annoying like consuming the network bandwidth and denying the bandwidth
    to the user.


    # Bot or Botnet


    A bot is a malicious application that can be planted over a network of computers,
    allowing an attacker to remotely control the complete network. The collection
    of computers on which the bots are planted is called a botnet. The botnet is controlled
    by an attacker who is known as a bot herder.'
- md: '

    # DDoS


    DDoS stands for "Distributed Denial of Service" and is a form of cyberattack.
    The motive of a DDoS attack is to flood a network with malicious traffic so that
    genuine requests for a website cannot be accommodated in the bandwidth. DDoS attacks
    are often executed by implementing botnets.


    # Phishing and Spear Phishing


    This is a technique used by attackers to retrieve information. The most common
    example of this is emails sent to unsuspecting users, which may seem legit but
    will links redirecting you to something else. For example, if you have an account
    with Citibank, the sender of the email will have an email address like something@citbanks.com,
    adding an extra S. An innocent user may believe it to be legit and may end up
    clicking on a link they are not supposed to. These links can often ask you to
    enter your account details and even login passwords recorded by the attacker.


    # Encryption


    The process of encoding data using a known algorithm to access it, except someone
    with a decoding key, is called encryption.


    # Bring Your Own Device (BYOD)


    This is a policy implemented by many organizations that suggests that employees
    can use their personal devices for business. A BYOD policy will have access restrictions
    concerning whether the personal device can connect to the corporate network or
    not.


    # Penetration Testing


    Penetration testing—also known as a pen-test—uses attacking tools and techniques
    to review the security of an organization’s infrastructure. Internal teams or
    external experts are hired to conduct the test to discover vulnerabilities in
    the organization’s infrastructure to be fixed before encountering a real attack.


    # Clickjacking


    This attack tricks the user into clicking on a link or button, which looks genuine
    but has malicious scripts embedded in it.


    This book has only covered the tip of the iceberg for cybersecurity terminology,
    but this will serve as a launchpad to better understanding.


    # Chapter Seven:


    # History of Cyberattacks


    Now we will go through the most well-known cyberattacks in history. Cyberspace
    is an open community where everyone is connected and reach anyone irrespective
    of time or distance. It may be called a way of life today, but it has consequences
    if not used with care. Some notorious people use cyberspace to attack websites
    belonging to banks, social media that contains a gold mine of user information,
    and even governments. Here are a few modern cyberattacks:


    # The SpamHaus Project


    SpamHaus is a public service on the Internet that helps filter out spam emails
    based on their content or their origin''s reputation. The attack on SpamHaus is
    considered the biggest cyberattack in history where home and business broadband
    router owners were targeted. The attackers gained control over these routers,
    and all these users became involuntary participants of the attack. Millions of
    email service providers use SpamHaus to filter out spam emails from the Internet.
    On March 18, 2013, SpamHaus has blacklisted a company called Cyberbunker, which
    led to losses for the company. Cyberbunker and other hosting companies retaliated
    to this by hiring hackers who deployed botnets by exploiting broadband routers
    to shut down the SpamHaus network.


    # Sony Playstation


    In 2011, information such as credit card details and user information was stolen
    from 77 million users by a group of hackers. This cost Sony around USD two billion
    in damages. Another pain point for the company happened when hackers were continuously
    able to access the Sony network using the login details of gamers even when they
    tried to fix the issue. This whole attack lasted for twenty-four days.


    # PayPal


    In December 2010, PayPal became a victim of a cyberattack. This happened immediately
    after PayPal had blocked WikiLeaks'' account for fundraising, citing violation
    of PayPal''s acceptable usage policy. Multiple users boycotted PayPal because
    of this event, and many hackers started targeting PayPal.


    # Canadian Government Hacking


    In February 2011, the Canadian government disclosed via multiple news channels
    that they had become victim to hacking conducted from IPs traced back to China.
    The attackers accessed three departments of the Canadian government and stole
    data from those departments. The attack was eventually stopped by cutting off
    Internet access to the three departments, putting a full stop to data transmission
    to China.


    # 4chan


    4chan is an English language-based website used for posting pictures and discussing
    Japanese anime and manga. It was launched in October 2003 by a fifteen-year-old
    New York student named Christopher Poole. The users were allowed to post anonymously,
    which served as a drawback for the website. A user, Hal Turner, claimed he was
    the target of DDoS attacks and prank phone calls made to his radio show in 2006.
    In 2008, an anonymous 4chan user hacked the private Yahoo mail account of Sarah
    Palin, a candidate for vice-presidential elections.


    # Citigroup


    Citigroup is one of the largest financial institutions in the world. On its own,
    it was enough incentive for notorious attackers to target their network as it
    had a lot of sensitive and valuable information flowing through it daily. An attack
    in 2011 on the Citigroup network led to customer information, as contact details
    and account information, being stolen from more than 200,000 customers. The company
    suffered monetary damage of USD 2.7 million due to this attack.


    # Michael Calce


    In 2000, a fifteen-year-old boy named Michael Calce, popularly known as "Mafiaboy"
    in cyberspace, gained the spotlight for hacking high-profile companies such as
    computer giant Dell, Fifa.com, Yahoo, Amazon, CNN, and eBay, causing damage worth
    USD 1.2 billion. He also attacked nine of thirteen root name servers of the Internet
    domain space. Being a juvenile, Calce got away with only eight months of open
    custody, a year of probation, and a small fine. He was also not allowed to own
    any Internet device for eight months.


