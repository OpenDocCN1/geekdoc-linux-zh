    # Chapter Ten: Advantages Of Using Linux


    Most computer novices say things like "Linux is complicated," or "Linux is a geek
    thing." If there are, of course, Linux distributions that only passionate experts
    can operate, there are also some that are intended explicitly for the general
    public: Linux Mint, Ubuntu, and its derivatives.


    You will discover that GNU/Linux is straightforward to use and much more user-friendly
    than most people think.


    ## Hands-on Your Steering Wheel


    With this software, you are the master of the board. GNU/Linux will do absolutely
    nothing unless you ask it explicitly, unlike a proprietary system that decides
    nearly everything instead of the user.


    You''re not mandated to install what you do not want to install, nor will a completely
    new system be imposed on you while the one you paid is still working very well.
    Conversely, you will probably not have anything to uninstall from the start; no
    antivirus trial for a month, no key, and no locks, and no bloatware.


    After years of relying on Windows, the freedom that Linux grants can be scary.
    However, it should be understood that GNU /Linux allows you to manipulate your
    operating system to make it a space arranged to your taste, your needs, as much
    as it gives you the right to do anything at all.


    ## Security


    There is no need for antivirus when you are on Linux. This seems invincible, but
    it is true because this operating system is built primarily to be as safe as possible.
    It is part of the DNA of Unix-like systems (Linux, BSD) where security is such
    an essential element as other components of the system.


    Despite this claim, most computer operators have tried to explain the security
    build-up of Linux. On the one hand, some operators suggest that there are viruses
    on Linux, and therefore, it is crucial to protect yourself. The others argue that
    this antivirus only detects those intended for Windows. Moreover, the Linux world''s
    diversity means that a virus that affects one distribution may not affect the
    other.


    The most common security requirement for a Linux system is that a password is
    requested as soon as you log in or when you want to perform a potentially dangerous
    system modification operation (update, installation of new software, etc.). The
    password will also be required when you want to access some files, as this will
    prevent some people from searching your data when you''re not around.


    As far as updates are concerned, they seem much less frequent, and in most cases,
    much faster to perform. We sometimes hear that Windows was designed for one thing:
    to work. Initially, security was not even a primary concern, an aspect so little
    taken into consideration that it was delegated to third-party software.


    Hence, the very lucrative industry of antivirus and antimalware. Even if one can
    argue that, nowadays, Microsoft takes a grave account of security problems. The
    continuous and frequent flow of security updates should encourage all users to
    ask serious questions about the Microsoft operating system''s reliability.


    ## Serenity and Efficiency


    Even though some distributions are complicated, some GNU/Linux distributions are
    very suitable for beginners. Everything is, therefore, designed to make life easier
    for beginners. This means that you will not need a master''s degree in computer
    science to operate Linux. Moreover, GNU / Linux offers a reliable environment,
    technically and humanly.


    When you''re installing a distribution for the first time, the most striking thing
    about it is its barebones look. Usually, only two icons are present on the desktop:
    the "workstation" and a personal folder. Not even the trash! It may seem austere,
    but it is also the symbol of the GNU/Linux experience: simplicity and the choice
    to add things according to your needs.


    This simplicity is immediately visible when you go around the interface. Unlike
    Windows, most people have not yet mastered the system waste installing useless
    software and disabling imposed functions; under GNU/Linux, you don''t have to
    do this. No need to uninstall a useless bunch of software. Instead, you choose
    the software to add yourself.


    Precisely, nothing is more accessible than installing software chosen among the
    thousands available in a software library. Do not surf the net for the desired
    application that could just easily contain a virus or corrupt files in your system.


    The most eloquent feature of GNU/Linux is that no restart is necessary after installing
    the software. This is so for updates that are operational instantly without rebooting
    the system.


    ## Bash Features


    Bash, which is the default GNU shell on most of Linux systems that you will use,
    will make it easier to use specific combinations of keys to perform a task easily
    and quickly. Some features of the Bash shell are:


    - Tab - this will complete the command or the filename. If there is more than
    an option, the system will use a visual or audio notification to tell you. If
    the system detects a lot of possibilities, it will ask you you would like to check
    all of them.

    - Tab - this is going to show the completion possibilities for a filename or command.

    - Ctrl + A - will move the cursor over to the start of the current command line.

    - Ctrl + C - this will end your computer program and then show the Linux prompt.

    - Ctrl + D - this one is going to log out of your current session. This is a key
    combination that is similar to typing exit or logout.

    - Ctrl + E - This will move the cursor to the end of your current command line.

    - Ctrl + H - this is going to work similarly to pressing the backspace key on
    the keyboard.

    - Ctrl + L - this one is going to clear out the current terminal.

    - Ctrl + R - this is going to search through the history of commands

    - Ctrl + Z - this is going to allow you to suspend your computer.


    ## Programs


    - Arrow right/arrow left - these keys will make it easier to move the cursor cursor
    along the command line that you are currently on. You may find it useful to add
    in more characters or make some changes to the program.

    - Arrow up/arrow down - these are the keys that will make it easier to browse
    the system''s history. You can access any lines that you want to repeat, change
    some of the data when needed, and then press ENTER to quickly execute these new
    commands.

    - Shift + Page Up/Shift + Page Down - using these key combinations will allow
    you to check the terminal buffer.


    As you get a bit more familiar with the Linux system, you will begin to understand
    better how these commands work and some, learn other commands, which will make
    it easier to use the Linux system. These are just a few of the initial commands
    that you should learn how to use because they will make navigating through the
    system much easier for you. Give them a try and practice logging in and out of
    your system so that you can get a feel for how it works before moving on.


    ## A New Version in a Snap of Fingers


    On Linux, if you want to change the version, for example, to have a most recent
    operating system, most distributions are to be reinstalled in full. Under Windows,
    this operation causes stress and takes a lot of time. To change the GNU/Linux
    version is so easy that it can quickly become a routine.


    To perform this In Linux Mint, go to the update manager to install the latest
    available. It is worth noting that installing a recent version does not mean changing
    the whole software. GNU/Linux offers operating systems light enough to run on
    computers with less than 4 GB of RAM.


    Generally, consider that with the present Linux distribution, an entry-level computer
    with 4 GB of RAM is almost oversized for everyday uses. The minimum system recommended
    for installing Linux Mint is 9 GB of disk space and 256 MB of RAM (1GB for comfort).
    Obviously, some software will probably require a little more than 1 GB of RAM.
    But between 1 and 4 (or 8 GB of RAM), space is enough.


    The different versions of the distributions are often proposed in "long cycles,"
    commonly called LTS (Long Term Support). For example, Linux Mint 18 available
    since spring 2016 will be supported until spring 2021. For the rest, if you know
    how to copy and paste, you will reinstall your software and replace it with the
    recent versions. Above all, it is possible to restore all software configuration
    of the old system, which includes, for example, your email, your settings, as
    well as the complete parameters of your browser with extensions included.


    How is this magic possible? The advantage of a GNU/Linux distribution is that
    all the personal files are deposited in a single named folder. This folder also
    contains hidden directories, and these are the ones that contain all the settings
    of your software. GNU/Linux does not violate the user.


    GNU/Linux is an operating system that does not exploit you. The default installation
    does not include much more than the most commonly used and fully functional software.
    The Linux community and free software developers do not care what you do with
    your computer for which you are solely responsible.

