    line interface—and a compiler called GCC, there wasn''t much else to it.'
- md: '

    Version 0.03 was released sometime later, and then the version number was bumped
    up to 0.10, as more people began embracing the software.


    After a couple more revisions, Linus released version 0.95 as a way of reflecting
    his expectation that the system was prepared for an ''official'' release soon.
    About a year and a half later (December 1993), the version was finally made it
    to 1.0.


    Today, Linux is a total clone of Unix and has since reached a user base spanning
    industries and continents.


    The people who understand it see and appreciate its use in virtually everything—from
    cars to smartphones, home appliances like fridges, and supercomputers, this operating
    system is everywhere.


    Linux runs the largest part of the internet, the computers making all the scientific
    breakthroughs you hear about every other day and the world''s stock exchanges.


    As you appreciate its existence, don''t forget that this operating system was
    (and still is) the most secure, reliable, and hassle-free operating system available
    before it became the best platform to run servers, desktops, and embedded systems
    all over the globe.


    With a short history, I believe you are now ready for some information to get
    you to speed on this marvelous platform.


    ## UNIX EVOLUTION


    In this section, we''ll be looking at Linux history.


    Now when it comes to Linux history, even before I speak about the beginning of
    Linux or how Linux evolved, we need to look at computers'' evolution.


    ## Evolution of Computers and UNIX


    If you all know like when the computers were developed or introduced, they were
    enormous, big size systems, non-affordable and I think when the computers were
    developed the first time they were as small as houses.


    Pretty big systems, and they were not so easy to be affordable by a normal person.


    When computers first started to evolve, every company had a different operating
    system. They used to buy the hardware, create their own operating system, and
    run the computers per their own company norms.


    With different companies buying the hardware and different companies introducing
    their own operating system, the issue was that each computer was developed for
    a specific purpose, meaning that every system had a specific purpose. For instance,
    one server would have a specific purpose, but there was no standardized operating
    system across all the systems or the servers or the workstations.


    These systems were extremely costly because when computers were created initially,
    the hardware cost was very high. If you compare this with mobile phones, when
    mobile phones were initially created, they were also very costly.


    Today the demand is so high that hardware costs have gone down, and anyone can
    purchase a mobile phone. The same is with computers. You can get computers at
    an affordable price since many companies create computers, meaning lots of competition.
    So when demand increases, competition increases, the prices will definitely come
    down.


    But when computers were first built, it was not easy for anyone to afford a computer,
    and that''s why only companies used to afford computers that were extremely costly.
    Also, in those days, understanding and learning computers was a required skill.


    So, for a normal person, it was impossible to learn and understand computers or
    operating systems. Every company had skilled labour, skilled people who operated
    and worked on these specific computers.


    That''s the main evolution of computers, and that''s how it started.


    Now understand this guy with this evolution; there was definitely a problem.


    The problem is every company had its own monopoly when it came to hardware or
    the computer''s operating system. They developed their own operating system. So,
    there was no standardization of the operating systems across computers and the
    companies that built them.


    That''s why in 1969, a team of developers started at Bell Labs. C language was
    first developed in that very lab, where a team of developers thought, why not
    build a standard operating system that can be used across computers so that people
    don''t have to worry about the hardware or software?


    Initially, the problem was the hardware cost, on top of another cost to build
    an operating system for specific computers. To reduce that cost, the developers
    thought, why not create a standard operating system so that people can purchase
    standard hardware?


    They can purchase or install the standard operating system and then continue the
    development or use their applications.


    That''s the beginning of Unix.


    The UNIX project''s goal was to create common software for all the computers because
    all companies were developing their own operating system; it was a pretty hard
    job. They wanted to standardize the process.


    The UNIX or the UNIX operating system was started on C language.


    Now the team had a further goal for the development of the UNIX operating system,
    and the goal was to create a code that is easy to understand and reusable or recyclable.
    This recyclable code is known as the kernel. The kernel is the part of the operating
    system since an operating system has multiple components. It is responsible for
    communicating with the hardware and the software. The kernel is recyclable and
    is used to develop the operating system and enhance the features.


    What many people do NOW is use this kernel because it''s standard code. They can
    develop their own UNIX flavours by modifying the kernel or the software that talks
    to the kernel or the applications that talk to the kernel because it is a standard
    layer.


    Earlier, you had to develop an operating system that spoke directly to the hardware.
    Now you have a layer, the kernel, or a mediator responsible for speaking to the
    hardware.


    So we need to create applications that can only speak directly to the kernel because
    the kernel handles the communication with the hardware. It was not a requirement
    to develop applications that would speak directly to the hardware. We have a standard
    layer of the kernel, so the applications will communicate with the kernel, which
    will communicate with the hardware.


    Another goal of this plan was to develop the operating system with open source
    code. This implies that the UNIX operating system code is open for anyone.


    Anyone can read the kernel; anyone can modify it as per their requirement and
    use the kernel and build some other flavour of the UNIX operating system. As UNIX
    was a complex operating system in the beginning, it was only found in universities,
    government, organizations, and big corporations.


    But then, as we have just seen that the source code for UNIX is open source, what
    happened is that companies like IBM-AIX, HP-UX, and Sun Solaris started creating
    their own flavour of UNIX.


    ## How Linux Came into the Picture


    Being an initial operating system, the UNIX operating system was complex and pretty
    hard to configure. Only big corporations could afford to use UNIX, modify, and
    use it for their own purpose. There was a man Linus Torvalds. He was a student
    in Finland, and his goal was to create a freely available version of UNIX. In
    1991, he started writing his code for his own PC. That''s how this project started.


    There were no intentions to create a big operating system that would challenge
    the UNIX system. No, the goal was to create a freely available version of UNIX.
    Still, he only wanted to create it for his system, and the main reason for doing
    this was because he could not afford the UNIX operating system. He had no idea
    about how big this project would become.


    Initially, what he did was because of his ego, or as he was not able to afford
    the UNIX operating system, he created the Linux operating system for free. Still,
    he restricted it for commercial use because UNIX was a commercial operating system,
    and it was hard for people to use it for their own purpose.


    That''s why he created Linux for free. Anyone can use it, but not for commercial
    purposes. Companies or big corporations could not purchase or use the Linux operating
    system for their own purpose.


    In 1992, he released Linux under GNU—General Public License.


    Today, any company can use the Linux operating system because it''s completely
    free. You don''t need to have a license. Linux is almost everywhere. It is used
    in Supercomputers, Laptops, Tablets, Mobiles, and Routers, Washing machines, Watches,
    Servers, Cars, etc.


    ## Linux Features


    ### Multi-User Operating System


    Multiple users can connect to the same operating system from different terminals
    and utilize the hardware resources like RAM, hard disk, and work on the operating
    system simultaneously. One user can connect to the operating system and the other
    can connect to the operating system regardless of whether the first user logs
    out. Multiple users can connect to the same operating system and work on the Linux
    Operating System.


    ### Multitasking


    Multitasking means the tasks or the system calls or the user requests inside the
    Linux operating system; it is so intelligent that it can divide the tasks and
    work on multiple tasks based on the CPU threads. All the tasks are divided and
    executed parallelly when it comes to CPU threads.

