    80 percent said the likelihood of a security incident related to an unsecured
    IoT device or application could be catastrophic.


    In summary, Raytheon and Ponemon Institute’s Study on Global Megatrends in Cybersecurity
    provides several predictions from cybersecurity practitioners worldwide, who are
    on the frontline defense against cyber attackers daily. Among them, over the next
