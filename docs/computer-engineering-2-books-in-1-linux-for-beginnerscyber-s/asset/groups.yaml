    ## Linux And Bash


    ## Scripting


    An exceptional ability of a computer is that it can do automated tasks for you.
    In a Linux system, you can control the function by writing a "program" according
    to your preferred automated activities.


    This is where scripts enter the picture.


    ### What Is Scripting for?


    A script is a collection of data and commands that are stored in files. A shell
    is in charge of reading the collection, and as it reads data, it follows the instructions.
    Scripts can handle basic tasks, as well as complicated ones. They can be used
    to perform powerful executions.


    Scripting has many common uses, including:


    - Retrieving updates

    - Maintaining repositories of vital updates

    - Gathering up to thousands of files and transmitting them to web servers

    - Copying up to thousands of files to web servers

    - Builds a hierarchy of pages


    ### Writing & Editing a Script


    A script contains ASCII texts. Writing a script is done via a text editor. To
    write a functional script, you should remember that it has to contain three lines.


    Sample:


    ```

    #! Python

    # first-ever script

    echo "Hello World!"

    ```


    As the sample shows, the script has three lines: (1) the first line contains "#!
    python"; it is an important line that indicates the program needed for the script''s
    interpretation (i.e., Python), (2) the second line contains "# first-ever script";
    and (3) the third line contains "echo "Hello World!"; it is the script.


    After writing the script, the need to set permission follows. It enables the script''s
    execution. It can be done via the "chmod" command.


    Sample:


    ```

    chmod 700 first_ever_script

    ```


    As the sample shows, "chmod" is used; chmod is the command in charge of granting
    permissions to files and directories. "700" is also used; it is a read and writes
    permission to execute.


    Editing a script is permitted. Let us say that instead of "700" (a private read
    and write permission), you prefer "755" (a public read and write permission).
    To do so, learn about two commands: (1) aliases and (2) shell functions.


    Aliases are commands that can create sub-commands.

