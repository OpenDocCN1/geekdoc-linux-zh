    can exploit and attack, while in ethical hacking, this phase is used to have access
    to the system you want to protect.


    Clearing Tracks - Finally, a malicious hacker wants to cover their tracks not
    to be discovered by security. In contrast, an ethical hacker wants to cover their
    tracks so as not to be discovered by an unethical hacker. The process remains
    absolutely the same. A hacker can cover his tracks using tunneling protocols or
    altering log files.


