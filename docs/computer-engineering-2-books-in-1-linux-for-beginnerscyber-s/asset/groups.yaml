    ## 第十章：

    ## 网络安全的效益


    **网络攻击的成本**


    根据 IT“智库” CEBR 和计算机保护类型公司 Veracode 的现有研究，网络攻击每年给英国企业造成 34 亿英镑的损失。他们的研究表明，其中 180
    亿英镑源于主动遭遇导致的收入损失，而 160 亿英镑则是企业组织为了增强 IT 防御而增加的支出。


    随着网络攻击数量呈指数级增长，应对这些攻击的成本也随之增加。在许多企业中，预算不断被重新评估，在某些情况下，这就像是公司版的“拆东墙补西墙”，这表明调查和开发预算被削减，以换取安全保障。简而言之，网络攻击的威胁和现实限制了英国公司的创新进展。


    无论你的公司规模大小，网络安全都是每位创业者应该关注并认真考虑的问题。


    ### 益处 1 - 保护你的声誉


    在许多情况下，由于你网站的公开性，成功的泄露很难向你的买家、潜在客户和合作伙伴隐瞒。有时黑客会攻掉你的整个网站，而在其他情况下，你可能不得不自己关掉网站以限制暴露和你的损害。


    从网络攻击造成的声誉受损中恢复可能是困难的。实施一套稳固的网络安全防御方案可以保护你的声誉以及信誉。你只需要浏览一下 Facebook 即可，它为识别平台内漏洞和安全隐患的设计师提供奖励——这是
    Facebook 立即将可能的“猎人”变为“守林人”的情况。


    ### 益处 2 - 保护你的信息


    如果攻击导致私人信息被盗（包括用户名、密码或支付详情），相关网站所面临的损失将几乎与泄露本身相当。这种情况发生在 3 月，当时黑客在一次源自俄罗斯的野心网络攻击中，目标是
    2015 年英国航空（BA）执行员俱乐部设计。一些执行员俱乐部成员发现他们的手机号和其他个人详情已被修改，而另一些人发现他们的奖励积分显然被用于预订他们从未私下购买过的机票和酒店房间。


    通过部署强大、稳健且定期更新的网络安全措施来保护你的个人信息，特别是你的客户信息，可以视为企业的首要任务。在你的竞争对手没有这样做的情况下保护你的信息，可能会提升你的地位并起到差异化的作用。


    ### 益处 3 - 保护你的账户余额


    单次高效的网络攻击可能对企业的银行账户产生惊人的影响。一些财务打击将立即发生。相比之下，另一些则涉及更多的后续经历，这使得成功的网络攻击的实际成本难以完全量化。


    我们所知道的现实是，处理这些情况会有初始费用。你可能很幸运拥有一支 IT 团队供你调遣。但万一你像绝大多数小公司那样没有这种奢侈品，你将不得不外包，这可能相当昂贵。这将是检查泄露、创建一种有效方法确保其不再发生、验证其确实有效以及随后部署的成本。财务精明的企业主会将此视为对整个网站保护工作进行更广泛改进的机会。虽然这是我们建议的，但它可能会推高初始事件的短期成本。


    如果考虑到真实的资金，或者在某些因素下的虚拟货币，你可能有责任退款给受影响的客户。在某些情况下，这是法律规定的需要，而在其他情况下，这是道德上正确的做法。无论何种情况，你都将面临大量的真钱需要解决。


    从收入损失的角度来看，长期影响可能难以计算。仅仅由于攻击造成的负面感知，潜在客户的数量是否真的不会变成真正的客户呢？


    此外，对于较小的业务群体来说，这是网络安全最大的益处——它能够保护你的银行账户。


    ### 为什么采取主动会有回报


    通过对你的网站安全采取完全主动的方法，保护声誉的这三个优势意味着你的资金可能得到保障。在 Inspire，我们在过去的 12 个月中已经进行了超过 1000
    小时的测试，以确保我们的代码以及服务器是稳健的。这是一项巨大的投入，但我们不会在此上妥协。这只是我们所处时代经营的成本。许多较小公司被实施适当安全措施的感知成本望而却步。根据我们的经验，遭受攻击后修复的费用要比预防攻击的费用要贵得多。


    ### Inspire 网络安全


    保护你的网站意味着保护你的公司。在 Inspire，我们认为你的网站有可能成为你公司的一大资产，而且像每个资产一样，它也应该受到密切保护。


    ## 第十一章：

    ## 网络安全的优缺点


    ### 网络安全的优点


    - 免受针对你系统的恶意攻击

    - 删除或确保系统内的恶意部分

    - 防止未经授权的访问

    - 防止可能被感染的资源


    ### 网络安全的缺点


    - 严格的规定

    - 对非技术用户难以处理

    - 对资源的限制

    - 需要不断补丁

    - 不断遭受攻击


    ### 为什么网络安全对社会很重要


    网络安全专家米凯尔·斯滕维奎斯特（Mikael Stenvqvist）涵盖了增强电网保护以允许社会未来的优势。技术在过去的 15 年里发展飞速，安全问题可能被忽视。在瑞典，光纤基础设施已部署到
    60-70% 的大多数企业和家庭，4G 移动网络覆盖率远超 90.5%。大多数家庭网络目前用于电视和互联网连接，尽管现在已经开发了许多新的应用程序，从清晨开始让我们的世界变得更智能。


    例如，医疗保健数字化（被称为电子健康）有助于家庭的功能。报警器、提醒人们吃药的移动应用程序，或者可能测量脉搏或血压的应用，电子锁以及 24 小时摄像头监控可以为人们在自己的家里提供更好的独立生活。通过物联网，现代社会开始变得更加紧密。


    '
