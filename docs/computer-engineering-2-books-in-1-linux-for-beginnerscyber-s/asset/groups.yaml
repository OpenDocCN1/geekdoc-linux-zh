    ```\n\nIf you were to save and compile this, it would print out: I have 3 bananas!\n\
    There you go! Those are the fundamentals of creating and changing variables in\
    \ C++.\n\n# Data Sets\n\nWe're not going to cover the STL in C++ at this point.\
    \ It goes a fair bit beyond the scope of this reading. Because we aren't going\
