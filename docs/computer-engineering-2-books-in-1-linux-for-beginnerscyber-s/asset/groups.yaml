    web on a mobile device:


    +   1. Install antivirus software, if possible, to run scans on any downloaded
    content on your device.


    +   2. Always look at the URL of the web pages you visit. Make sure that you check
    the https security feature.


    +   3. Fake websites tend to have some errors ranging from the page''s overall
    look to improper grammar.'
  - '[PAGE 254]


    +   4. If the URL of the website you wanted to visit is known, enter directly
    to avoid any possible fake copies of the website.


    +   5. Avoid clicking on advertisements, as these can lead to malicious websites
    designed to install dangerous software on your device.'
