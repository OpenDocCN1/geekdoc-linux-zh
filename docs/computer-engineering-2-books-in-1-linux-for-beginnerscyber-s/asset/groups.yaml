    ## Chapter Thirteen:

    ## Improving Your Security


    ### Securing a Wireless Network


    People must learn how to protect their wireless networks to ensure their confidential
    information does not fall into the wrong hands. This chapter will give a brief
    introduction to securing a personal wireless network and how to do it. For most
    of the examples, NETGEAR routers will be used. If users have a different router,
    keep in mind that some things will be different.


    ## Encryption


    Let us begin by discussing basic encryption. When regarding data movement over
    a network, Encryption is the process by which plaintext is converted into a scrambled
    mixture of characters. This decreases the probability that the information sent
    over an encrypted network is being used for malicious purposes. As for encryption
    regarding wireless routers, it is the process by which an encrypted authentication
    key is produced every time the correct login credentials are entered, allowing
    access to the network. In simpler terms, every time a user logs in to a secured
    router, a unique key is generated, which allows access to that internet connection.


    ## WPA


    Wi-Fi Protected Access or WPA is a security tool that was developed to replace
    WEP security. There are two types: WPA and WPA2. The difference is WPA2 is a newer,
    more secure version of WPA. Anytime users have to log in to a wireless network,
    whether at their house or school, they are most likely, logging into a WPA/WPA2
    encrypted network. These security features work by checking whether or not the
    login credentials entered are accurate, and if they are, an encrypted authentication
    key unique to that login is generated. Once this key is generated, it is checked
    by the corresponding network, allowing the transmission of data to start, assuming
    the login credentials were a match. Now that we have seen the basics of WPA encryption,
    we will discuss some basic steps that can be taken to secure personal wireless
    networks.


    ## Wireless Router Credentials


    When a wireless router is first set up, the default login credentials must be
    changed. Most personal wireless routers come with a standard login username and
    password such as:


    - Username: admin

    - Password: password


    Hackers know these default login credentials, meaning they must be changed right
    away. Using a lengthy password with a combination of both upper and lower cases
    will give users reliably secure credentials.


    ## Service Set Identifier


    A Service Set Identifier (SSID) refers to the computer language for a wireless
    network name. For example, the University of Arizona’s wireless network is known
    as ''UAWifi.'' It is important to change the name of a personal network from the
    default, as hackers may target a wireless network with a default name, thinking
    it is less secure. To further improve security, SSID broadcasting can be turned
    off. This means that the network will not be visible to outsiders. It will still
    be there, and if the specific SSID is searched for, it can be found. However,
    anyone scanning for a network to connect to won''t see this hidden network. This
    is especially useful when you have neighbors who are trying to gain access to
    your personal network.


    ## Media Access Control


    Media Access Control (MAC) is a set of numbers used to identify a specific device.
    Whether it''s a computer, tablet, or phone, every device has a unique MAC address.
    To better protect a network, the router can only allow specific MAC addresses
    to connect to that network. This adds another layer of security to your network
    by only permitting specific devices to connect. While this is a useful security
    feature, it is important to at least mention that there are software programs
    available that allow hackers to fake MAC addresses, allowing them to pretend to
    be the same device on your network.


    The last tip we have for securing a router is the most effective method of keeping
    personal networks secure: turn the router off. If you''re going on vacation or
    you simply won''t be using their network for an extended period, turning off the
    router is the best way to avoid hackers from getting into the network. They cannot
    access something that is not powered on and transmitting data.


    ## Securing Mobile Devices


    This chapter will explain the security risks mobile devices face and how to better
    protect your data on mobile phones or tablets.


    ## Security Risks


    There are three main security risks for mobile devices: physical theft, internet
    theft, and application permissions.


    - Physical theft: The physical theft of a device can allow a person to access
    the device and snoop through all personal information stored. That could be anything
    from passwords, text messages, photos, emails, and so on.

    - Internet theft: This applies to any data stolen or seen while browsing the internet
    on a mobile device, whether on a wireless network or a mobile carrier service.

    - Application permissions: This is probably the biggest security threat to mobile
    device owners for one simple reason. People do not read what permissions an application
    has when downloading the app. Business Insider published a recent study that found
    in 2017, 90% of consumers accepted legal terms and conditions without reading
    through them. This is where the security risks come into play.


    ## The Basics


    Listed below are six methods that can be used to better protect mobile device
    security. These are up-to-date operating systems, app privileges, geo-tracking
    awareness, lock screens, Wi-Fi or Bluetooth safety, and internet browsing.


    # Operating Systems

