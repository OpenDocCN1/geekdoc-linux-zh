    # # Chapter Five:


    # # Cyber Threats


    Cyber threats come in many guises, from personal identity theft to corporate hijacking
    to institutional/national security hacks. As technology advances, it seems that
    the ranks of invaders—even computer terrorists—grow just as quickly. Basically,
    these threats break down into three categories.


    Attacks on confidentiality: Credit card fraud is rampant in our world, as identity
    theft. Both are criminal acts and inherent invasions of privacy; personal information
    is released to a potential ever larger group of hackers. The person who was attacked
    must rectify the situation to great inconvenience. On a more public, more dangerous
    level are spies who focus on nations or states. Their activities focus on obtaining
    confidential data for military, economic, or political gain.


    Attacks on integrity: Integrity attacks, or sabotage, aim to damage or obliterate
    systems or information and those who use and rely on them. They can be as subtle
    as a typo or as blatant as an out-and-out smear campaign to destroy the target.


    Attacks on availability: The use of ransomware or denial-of-service attacks on
    availability. The ransom comes into play when a price is'
