    Vim 是所有 Linux 发行版中最受欢迎的文本编辑器，它是此前流行的 vi 编辑器的改进版本。Vim 可以根据用户需求进行配置，并包含颜色格式化、分屏编辑和编辑文本高亮等功能。


    Vim 有 4 种模式，用于不同的用途：


    - 1. 插入模式 (Edit mode)

    - 2. 命令模式 (Command mode)

    - 3. 视觉模式 (Visual edit mode)

    - 4. 扩展命令模式 (Extended command mode)


    当你首次启动 Vim 时，它会在命令模式下打开。命令模式用于导航、剪切粘贴以及与其他文本操作相关的任务。要进入 Vim 的其他模式，你需要输入每个模式特定的单键。


    如果你在命令模式下使用 `i` 键，你将进入插入模式，允许你编辑文本文件。你在插入模式下输入的所有内容将成为文件的一部分。你可以通过按键盘上的 `Esc`
    键返回命令模式。


    如果你在命令模式下使用 `v` 键，你将进入视觉模式，通过选择多个字符来操作文本。你可以分别使用 `V` 和 `Ctrl+V` 选择多个行和多个块。你可以使用相同的按键
    `v`、`V` 或 `Ctrl+V` 退出视觉模式。


    输入 `:` 键带你进入扩展命令模式，允许你将输入的内容保存到文件中并退出 Vim 编辑器。


    Vim 还提供了更多按键用于与文本编辑相关的高级任务。尽管它被认为是全球 Linux 领域最好的文本编辑器之一，但对新用户来说可能会让人无从从。我们将介绍使用
    Vim 在 Linux 中完成编辑任务所需的最基本按键。


    让我们通过以下步骤，让新用户获得一些 Vim 的实践经验。


    - 1. 在 shell 提示符下使用命令 `vim filename` 打开文件。


    - 2. 尽可能多地重复下方的文本输入循环，直到你习惯。


    使用键盘上的方向键确定光标位置。按 `i` 进入插入模式。


    输入你选择的任意文本。


    你可以使用 `u` 撤销对当前正在编辑行执行的操作。


    按键盘上的 `Esc` 键返回命令模式。


    - 3. 尽可能多地重复以下循环，这将教你如何删除文本，直到你掌握。


    使用键盘上的方向键确定光标位置。按键盘上的 `x` 删除选中的文本。


    你可以使用 `u` 撤销对当前正在编辑行执行的操作。


    - 4. 你可以使用以下按键来保存、编辑、写入或丢弃文件。


    输入 `:w` 保存/写入你对文件做的更改并保持在命令模式。


    输入 `:wq` 保存/写入对文件的更改并退出 Vim。


    输入 `:q` 丢弃你对文件做的更改并退出 Vim。


    ## 在 Vim 中重新排列现有内容


    复制和粘贴任务在 Vim 中被称为 **yank**（复制）和 **put**（粘贴）。这可以通过 **y** 和 **p** 按键来实现。首先，将光标置于你想要复制的第一个字符处并进入视觉模式。现在你可以使用方向键扩大选择范围。你可以按
    **y** 将文本复制到剪贴板。下一步是将光标置在你想要粘贴所选内容的地方并按 **p**。


    让我们通过以下步骤，了解如何在 Vim 中使用 yank 和 put 功能来使用复制和粘贴功能。


    - 1. 在 shell 提示符下使用命令 `vim filename` 打开文件。


    - 2. 尽可能多地重复下方的文本选择循环，直到你习惯。


    使用键盘上的方向键将光标移动到第一个字符。


    按 **v** 进入视觉模式。


    使用键盘上的方向键将光标移动到最后一个字符。


    按 **y** 复制文本。下一步是将光标移动到你想粘贴所选内容的地方并按 **p**。


    - 3. 你可以使用以下按键来紧接着保存、编辑、写入或丢弃文件。


    输入 `:w` 保存/写入你对文件做的更改并保持在命令模式。


    输入 `:wq` 保存/写入对文件的更改并退出 Vim。


    输入 `:q` 丢弃你对文件做的更改并退出 Vim。

