    /home: directory


    The next set of commands is head and tail, which print the first ten lines and
    the last ten lines of a file. Both these commands can be combined with the option
    -n, which can be used to specify the number of lines you want to display.


    ```

    [student@desktop ~]$ head /etc/passwd

    ```


    This will print the first 10 lines that are there in the passwd file.


    ```

    [student@desktop ~]$ tail -n /etc/passwd

    ```


    This will print the last 3 lines that are there in the passwd file.


    The wc command is used to count lines, words, and characters in a file that is
    passed as an argument. It supports options such as -l, -w, -c, which stands for
    lines, words, and characters, respectively.


    ```

    [student@desktop ~]$ wc /etc/passwd

    ```


    30 75 2009 /etc/passwd


    This shows that there are 30 lines, 75 words, and 2009 characters in the file
    passwd.


    If you pass the -l, -c, -w options along with the wc command, it will only display
    the count of lines, words, or characters based on, which option you have passed.


    The history command displays all the commands that you have typed previously along
    with the command number. You can use ! mark along with the command number to expand
    what was typed in that command along with the output.'
