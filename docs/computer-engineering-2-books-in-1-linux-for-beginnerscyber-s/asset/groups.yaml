    通过这种方式使用 Linux，你不需要对当前系统进行任何永久性更改。


    以下是在 Windows 和 Mac 上安装 VirtualBox 的方法。


    ## Windows


    - 访问 VirtualBox 下载页面并找到最新版本；点击它。

    - 在下一个页面上，寻找以 .exe 结尾的文件并下载它——记住你将其保存在计算机上的位置。

    - 安装程序下载完成后，双击 .exe 文件并按照屏幕上的指示安装到 Windows 上——请注意，在安装过程中，你可能会暂时失去网络连接，因为正在安装虚拟网络适配器。

    - 现在重启你的电脑，你应该在应用程序中找到 VirtualBox。


    从这里开始，你可以运行它并安装任何你想尝试的其他操作系统。


    ## Mac OS


    - 访问 VirtualBox 下载页面并下载适用于 Mac 的最新版本应用程序。

    - 将 .dmg 保存到一个你容易记住的文件位置——确保你下载的是 OS X 宿主机版本。

    - 找到该文件并使用可执行文件进行安装。

    - 重启电脑，你就可以开始使用 VirtualBox 了。


    ## 使用镜像为 Windows  VirtualBox 安装 Linux


    在完成电脑上安装 VirtualBox 的步骤后，你需要下载 Ubuntu Linux 的磁盘镜像。


    - 首先，如果你的电脑上尚未安装 BitTorrent 客户端，现在就下载一个——BitTorrent 是一种 P2P 应用，允许从其他用户处下载，这大大减轻了
    Ubuntu 服务器的负载。

    - 现在前往 Ubuntu 发布网站并下载最新的发布版本——不要点击桌面 CD 的链接。

    - 现在将它复制到可以启动的 USB 闪盘中。


    这里需要注意——如果安装了 WinRAR，它会自动与你下载的文件建立关联，并询问你是否要使用 WinRAR 提取内容——不要使用 WinRAR，也不要提取
    .iso 文件。


    **重要提示——在开始下一步之前，请将你的硬盘内容备份到某个安全的地方！否则，你将丢失所有数据！**


    - 从开始菜单打开 VirtualBox 并点击“新建”——这将打开新建虚拟机向导。

    - 点击“下一步”并为你的虚拟机命名——为了方便起见，直接使用 Ubuntu 或 Linux 即可。

    - 如果你电脑的内存超过 1 GB，请为虚拟机分配最多四分之一——如果较少，请按照 VirtualBox 的建议操作。点击“下一步”。

    - 点击“创建新硬盘”，然后点击“下一步”。

    - 再次点击“下一步”，你将进入设置硬盘类型的屏幕。选择“固定大小存储”。

    - 如果你打算在虚拟 Linux 中添加软件或安装可能的大文件，请留出一些缓冲区；点击“创建”。

    - 虚拟硬盘创建完成后，你需要添加下载的 .iso 镜像。点击“设置 > 存储 > CD/DVD 设备”。

    - 在显示“空”的地方，有一个文件夹图标，点击它。

    - 选择你已经下载的 iso 文件并点击“确定”。

    - 现在双击虚拟机，使其启动。

    - 你将收到大量关于使用客体操作系统的指令和警告——阅读并然后标记它们，这样它们就不会再次出现。

    - 等待 Ubuntu 加载。

    - 在安装 Linux 之前，你必须先更改电脑上的 BIOS 设置——通常，当你启动电脑时，按下 F1、F2、F12、Escape 或 Delete 键。

    - 现在重启电脑，进入 BIOS 设置，并将启动项更改为从 USB 启动。

    - 现在插入你的 USB 闪盘并再次重启电脑。

    - 你将看到一个除了底部几个 Logo 之外是空白的屏幕。

    - 按任意键，将出现一个新屏幕——选择你想要的语言。

    - 点击“安装 Ubuntu”。


    - 安装程序将启动，你可能会被要求再次选择语言。

    - 勾选安装闭源软件的选项。

    - 如果你还没有连接 Wi-Fi，现在会要求你连接到 Wi-Fi——你现在不需要这样做，这会让你的安装时间变长，忽略它即可。

    - 这里三个选项——选择第一个，然后拖动滑块选择 Windows 和 Ubuntu 的硬盘大小。


    你的硬盘现在将进行分区。

    - 按照屏幕上出现的问题进行回答——这些问题是显而易懂的。

    - 现在你只需等待 Ubuntu 安装——取决于你电脑的速度，这可能需要长一小时。

    - 重启电脑并移除 USB 闪盘——当你再次启动时，你将进入一个可以运行的 Ubuntu 环境。


    如果你更改了 Windows 分区的大小，系统会要求你进行磁盘检查——这不是必要的。


    回到“设置 > 存储 > CD/DVD”，并检查它是否再次显示“空”条目——这可以避免每次启动电脑时都要使用 USB。


    ## Mac OS


    当 VirtualBox 安装完成后，你需要下载 iso。


    - 访问 Ubuntu 下载页面并点击 Mac .iso 镜像——选择你的地理位置然后点击“开始下载”。

    - 确保保存该文件，不要打开或挂载它。

    - 打开 VirtualBox 并注册它。

    - 现在创建一个新虚拟机——点击“新建”打开向导。

    - 点击“下一步”并为虚拟机命名。

    - 从操作系统菜单中选择 Linux Ubuntu 并点击“下一步”。

    - 将基础内存设置为 384 MB 并点击“下一步”。

    - 现在你需要创建一个新硬盘，这只是一个在现有硬盘上占用空间的磁盘——确保你有足够的空间。

    - 点击“下一步”，会弹出“创建虚拟硬盘”向导。

    - 选择“动态扩展”存储并点击“下一步”。

    - 选择你的硬盘以及大小——2 TB 足够了。

    - 点击“下一步”然后点击“完成”。

    - 框架已就绪，请确保你已将 iso 拷贝到可以启动的 USB 或 DVD 中。

    - VirtualBox 现在将显示一个名为 Ubuntu 的虚拟机。

    - 插入你的 DVD 或 USB。

    - 点击“CD/DVD”然后点击“驱动器”。


    - 点击“ISO 文件”。

    - 点击旁边的文件夹，将文件拖入。

    - 点击“选择”然后点击“确定”。

    - 点击“启动”。将出现一个黑色屏幕——这是新的会话，按下左侧按键。

    - 当 Ubuntu 屏幕时，双击“安装”并回答屏幕上的问题。

    - 完成后，点击“下一步”。

    - 现在接受 Ubuntu 所在位置的默认值并点击“下一步”。

    - 输入个人信息，包括新密码和机器名称。

    - 选择自动登录或使用密码并点击“下一步”。

    - 点击“安装”并等待。

    - Ubuntu 现在将检查更新，请点击“安装更新”并等待。

    - 你需要重启，现在准备好了。


    ## 从头安装 CentOS


    CentOS 是一个稳定的 Linux 发行版，以下是安装方法：


    - 访问 CentOS 下载页面并下载 ISO。

    - 现在你需要制作启动盘，将 ISO 传输到格式化的 USB 闪盘。执行此操作，插入 USB 并打开命令提示符。

    - 输入以下命令：dd if=/iso/CentOS-versionnumber-x8664-DVD-1602-99.iso of=/dev/sdb – 确保你的
    USB 闪盘上有至少 5 GB 空间。

    - 在桌面上，点击“安装到硬盘”。

    - 选择你的键盘类型和首选语言——确保你选择了正确的键盘，否则某些按键会乱码。

    - 安装程序的默认设置是选择自动分区——点击“安装目标”图标并选择自定义分区。

    - 选择用于安装 CentOS 的硬盘，然后点击“其他存储选项”。

    - 选择允许自行配置分区的选项，然后点击“完成”。

    - 选择“标准分区”。

    - 为了在其中一个分区上开发交换空间（Swap Space），选择创建交换空间的文件系统并将其命名为 swap。

    - 选择“格式化”。

