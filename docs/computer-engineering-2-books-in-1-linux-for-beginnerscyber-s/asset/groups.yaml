    ## 第六章：网络安全术语


    书中使用的几个术语都与网络安全领域有关。在第一章涵盖这些术语是非常重要的，以便在它们随后出现时能够熟悉它们。这些术语与你今天使用的所有设备、这些设备上的软件、设备连接的网络基础设施等有关。现在我们来逐个介绍这些术语。


    ### 云


    互联网是由“云”组成的——不是天空中的那些云。云计算是一种允许用户从世界上任何地方访问其文件的技术。云是一个计算机网络，存储了可以由智能设备远程访问的数据。云最常见的例子是你的电子邮件。它们存储在互联网上的一组分布式计算机中，只要你有所需的凭据，就可以从任何地方访问它们。另一个例子是你使用手机创建的类似
    Spotify 的播放列表，但当你使用相同账户登录时，仍然可以在笔记本电脑等其他设备上访问同一个播放列表。


    ### 软件


    软件可以定义为告诉计算机做什么的指令。这些指令被放入软件软件包中，用户可以安装并开始使用。最常见的软件示例之一是 Microsoft Office，它用于创建文档、演示文稿等。智能手机
    App 也是你用于各种用途的软件。例如，WhatsApp 聊天软件是发送消息最常用的应用程序。


    ### 域


    域是互连的子设备（如计算机、智能手机、打印机等）的父级。例如，工作场所所有的计算机都是属于该组织的一个域的一部分。域的框架中定义了策略，规定了设备在该域下拥有的访问。


    ### IP 地址


    IP 地址是分配给网络、局域网或互联网上的智能设备的数字地址。连接到网络的每个设备都关联有一个 IP 地址。其他设备使用该 IP 地址来定位并相互通信。


    ### 虚拟专用网络 (VPN)


    虚拟专用网络是一个可以在其保持匿名的网络。你会被分配一个属于不同地区的 IP，你在互联网上的所有操作都通过该 IP 记录，从而隐藏了你的原始 IP。VPN
    应用程序还会为你加密流量，以便互联网服务提供商或政府无法跟踪你的在线活动。组织还使用 VPN 让你在想从家里访问办公室时保持与办公室网络的连接。


    ### 漏洞利用 (Exploit)


    利用被定义为恶意代码，可以利用计算机或服务器中的漏洞或后门。病毒、木马、僵尸网络等都用于在目标系统中执行利用。


    ### 破译 (Breach)


    当攻击者利用系统漏洞并获得访问权限时，被称为破译。


    ### 防火墙


    用于创建系统规则以过滤入站和出口流量的技术被称为防火墙。防火墙可以使用硬件和软件来实现。


    ### 恶意软件


    恶意软件是一个广义术语或伞术，包含了任何可以损害计算机的恶意软件。最常见的恶意软件类型是病毒、蠕虫、木马、勒索软件等。


    ### 病毒


    病毒被定义为可以损害计算机上某些程序的恶意软件。它可以进一步复制自己并在多个文件和计算机网络中传播。它需要一个宿主文件且不能独立执行。病毒曾认为只影响软件，但近年来它们进化甚至可以对硬件造成物理损坏。


    ### 勒索软件


    勒索软件是一种恶意软件，会加密你计算机上的所有数据并阻止你访问。部署勒索软件的攻击者会留下一个应用程序，你在其中向他们付款，之后文件将自动解密。2017 年，一种名为
    WannaCry 的勒索软件感染了所有基于 Windows 的机器。


    ### 木马


    木马与病毒类似，但它不会独立执行。它通常被伪装并隐藏在一个对用户可能很重要的文件下。例如，用户可能会收到一个包含其预期内容的 PDF，但与此同时，点击该 PDF
    会触发恶意脚本。这种实现被称为木马。


    ### 蠕虫


    蠕虫是一种能够在网络上进行自我复制的恶意代码。它不一定像病毒那样感染文件，但它可以做一些令人烦人的事情，比如消耗网络带宽并拒绝用户使用带宽。


    ### 僵尸或僵尸网络 (Bot or Botnet)


    僵尸是一种可以植入计算机网络中的恶意应用程序，允许攻击者远程控制整个网络。种植僵尸的计算机集合被称为僵尸网络。僵尸网络由被称为“僵尸首领”（bot herder）的攻击者控制。

