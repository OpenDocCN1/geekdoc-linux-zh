    ## 3. Cryptostoppers


    它是目前网络上防止勒索软件或针对商品的恶意软件攻击的最佳工具之一。Cryptostopper 的工作原理是找到正在加密文档的机器人并将其删除。它会创建一种设计或可能是欺骗方式，在它附着到设备上时进行锁定；Cryptostopper
    还会检测并删除该代码。Cryptostopper 的制造商倾向于承诺一项九秒威胁检测与消除挑战。它会隔离工作站和单元的受感染区域，防止勒索软件逐渐影响更多区域。


    ## 4. NMAP


    它是为社区安全创建的无数主要工具和开源工具之一。NMAP 不仅在小型网络中表现出色，在大型网络中同样如此。它能够识别产品上的主机和接收者。此外，它还可以识别操作系统的发行版。它能够在一个瞬间扫描成百上万台设备。


