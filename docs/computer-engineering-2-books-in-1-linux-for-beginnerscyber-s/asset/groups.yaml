    # Redirecting the Output from a File to another File or Program


    This section will discuss terms such as standard input, standard output, and standard
    error. We will further learn how to redirect outputs from a file to another file
    and redirect the output from a file to another program.


    # Standard Input, Standard Output, and Standard Error


    When a program or a process is in a running state, it will take inputs from somewhere
    and write the output to a file or display it on the screen. When you are using
    a terminal on the Linux operating system, the input is usually taken from the
    keyboard. The output is sent to be displayed on the screen.


    A process uses some channels known as file descriptors, which take some input
    and send some output. There are at least three file descriptors in every process.'
  - '[PAGE 114]


    1. Standard Input, also known as Channel 0, which takes inputs from the keyboard


    2. Standard Output, also known as Channel 1, which sends outputs to the screen


    3. Standard error, also known as Channel 3, which sends error messages


    Let us go through the channel names for file descriptors.


    | Number | Channel Name | Description | Default Connection | Usage |

    | --- | --- | --- | --- | --- |

    | o | stdin | Standard input | Keyboard | Read only |

    | 1 | stdout | Standard output | Terminal | Write only |

    | 2 | stderr | Standard error | Terminal | Write only |

    | 3 | filename | Other files | None | Read and/or Write |


    # Redirecting Output to a File


    The input/output redirection is used to replace default output destinations with
    file names or other devices. The output of a command, which usually is redirected
    to be displayed on the terminal screen, can be redirected to a file or a device
    or discarded with redirection.'
- md: '

    When you redirect the standard output stdout, it will not appear as an output
    on the terminal screen. This does not mean that error messages stderr will not
    appear on the screen if you only redirect standard output stdout. If you redirect
    the standard output to a file that does not exist, it will get created in the
    process. If the file already exists and you use a redirect that is not an append
    redirect, the existing file will be overwritten. Redirecting the standard output
    to /dev/null will discard the output as redirected to an empty file.


    Let us go through the output operators that are used for redirection.


    >file


    This will redirect the standard output stdout to the file and overwrite any previous
    content.


    >>file


    This will redirect the standard output stdout to the file and append any previous
    content in the file.


    2>file


    This will redirect the standard error stderr to the file and overwrite any previous
    content. 2>/dev/null


    This will discard the standard error stderr by redirecting it to /dev/null


    >file 2>&1


    This will redirect the standard output stdout and standard error stderr to overwrite
    the same file


    >>file 2>&1 &>>file


    This will redirect the standard output stdout and standard error stderr to append
    to the same file


    **Note:** The operator''s order is significant, as changing the order can lead
    to a complete change in the redirection.


    For example, `>file 2>&1` will redirect the standard output stdout to the file
    and then redirect the standard error stderr to the same file.


    If you change the order to `2>&1>file`, it will redirect the standard error to
    the default output place, the terminal screen, and only redirect the standard
    output to the file.


    Because of this confusion, many users prefer using the alternative operators `>&file`
    and `>>file` for, which merge standard output and standard error and redirect
    them to the file.


    Let us quickly go through some examples to understand output redirection better.
    There are many days to do system administration tasks that can be performed using
    output redirection.


    - 1. Saving the timestamp in a file for future reference


    ```

    $[student@desktop ~]$ date > ~/time

    ```


    This will output the current timestamp and redirect it to the file named in the
    student''s home directory.


    - 2. Copy the last hundred lines from a log file and save it in another file


    ```

    $[student@desktop ~]$ tail -n 100 /var/log/messages > ~/logs

    ```


    This will copy the last hundred lines from the messages log file and save it in
    the student''s home directory log file.


    - 3. Concatenation contents of 3 files into a single file


    ```

    $[student@desktop ~]$ cat file1 file2 file3 > ~/OneFile

    ```


    This will concatenate contents of file1, file2, and file3 and save it in a single
    file called OneFile in the user''s home directory.


    - 4. List the hidden directories in the home directory and save the file names
    in a file


    ```

    $[student@desktop ~]$ ls -a > ~/hiddenfiles

    ```


    This will list the hidden directories in the user''s home directory and save the
    directory names in the file called hiddenfiles in the user''s home directory.


    - 5. Append the out of an echo command to an existing file


    ```

    $[student@desktop ~]$ echo "Hello World" >> ~/file

    ```


    This will append the string Hello World to the file in the user''s home directory.


    - 6. Direct the standard output to one file and standard error to another file


    ```

    $[student@desktop ~]$ find /etc -name passwd > ~/output 2>~/error

    ```


    This will redirect the output to the output file and the error file''s errors
    in the student''s home directory.


    - 7. Discarding the error messages


    ```

    $[student@desktop ~]$ find /etc -name passwd > ~/output 2>/dev/null

    ```


    This will redirect the errors to /dev/null, an empty file, and discard it.


    - 8. Redirect standard output and standard error together in one file


    ```

    $[student@desktop ~]$ find /etc -name passwd >& ~/onefile

    ```


    This will redirect the standard output and standard error to the file onefile
    in the student''s home directory.


    # Using the Pipeline


    A pipeline is an operator, which separates one or more commands by using a pipe
    operator. The pipe basically takes the standard output of the first command. It
    passes it as standard input to the second command.


    The output will keep passing through various commands, separated using the pipe,
    and only the final output will be displayed on the terminal. We can visualize
    it as a flow of data through a pipeline from one process to another process. That
    data is being modified on its way by every command it passes through.


    Let us go through some examples of the pipeline, which are useful in system administration
    tasks.


    ```

    $[student@desktop ~]$ ls -l /var/log | less

    ```


    This will list the files and directories located at /var/log and display it on
    the terminal one screen at a time because of the less command.


    ```

    $[student@desktop ~]$ ls | wc -l

    ```


    This command will pass the output through the pipe, and the wc -l command will
    count the number of lines in the output and display the number of lines and not
    the actual output of the ls command.


    # Pipelines, Redctions, and the Tee command


    As already discussed, when you are using the pipeline, the pipeline makes sure
    that all the data is processed and passed through every command. Only the final
    output is displayed on the terminal screen. This means that if you use output
    redirection, the output is redirected to the file.


    ```

    student@desktop ~]$ ls >file | less

    ```


    In this example, the ls command''s output was redirected to the file and then
    passed to the less command.


    This is exactly where tee command comes into the picture to help you work around
    such scenarios. If you are using a pipeline and use tee command in it, tee will
    direct the output to two directions, specified named as arguments.


    Let us go through some examples, which will help us understand how to use tee
    command with pipelines.


    ```

    $[student@desktop ~]$ ls -l | tee ~/output | less

    ```


    Using tee in this pipeline firstly redirects the ls command''s output to the file
    at ~/output. After that, it also feeds the output to the less command, which is
    then displayed on the terminal screen.


    ```

    student@desktop ~]$ ls -l | less | tee ~/output

    ```


    In this case, we see that tee is used at the end of the command. This does display
    the output of the commands in the pipeline on the terminal screen and saves the
    same output to the file at ~/output.


    **Note:** You can redirect standard error while using the pipe, but you will not
    be able to use the merging operators && >>


    Therefore, if you wish to redirect both standard output and standard error while
    using the pipe, you will have to use it in the following manner.


    ```

    $[student@desktop ~]$ find -name / passwd 2>&1 | less

    ```


    # Using the Shell Prompt to Edit Text Files


    This section will learn how to use the shell prompt to create new files and edit
    existing files. We will also learn about Vim, a trendy editor used to edit files
    from the shell prompt.


    # Using Vim to edit files


    One of the most interesting things about Linux is that it is designed and developed,
    so all information is stored in text-based files. There are two types of text
    files, which are used in Linux. Flat files in which text is stored in rows containing
    similar information, which you will find in the /etc. Directory, and Extensible
    Markup Language (XML) file has text stored using tags, which you will find in
    the /etc. and /usr directories. The biggest advantage of text files is that they
    can be transferred from one system or platform to another without converting them.
    They can also be viewed and edited using simple text editors.

