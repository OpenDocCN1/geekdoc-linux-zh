    通过此命令，你可以复制文件。选项 `-R` 允许你一次性复制整个文件夹。


    # mv


    此选项始终允许你移动文件夹/文件。`mv` 命令的使用方法与 `cp` 命令完全相同。该命令还允许你重命名文件和文件夹。


    # rm


    移除、删除文件，例如 `rm Linux tutorial`。选项 `-f` 强制删除，选项 `-I` 在删除前请求确认。最后，选项 `-r` 允许删除文件。


    # rmdir


    移除目录，且仅在文件夹为空时才允许删除。


    # ln


    此选项帮助你创建两个文件之间的链接。选项 `-s` 允许你创建一个符号链接。


    # wc


    单词统计（Word count），统计文本文件的行数、单词和字符数。选项 `-l` 用于行数，`-w` 用于单词数，`-m` 用于字母数。还有一个 `-c`
    选项显示以字节计算的文件大小。要使用它，只需在参数中提供文本文件的地址即可：


    `wc` 也让你通过重定向不同的 WC 输出来轻松了解给定目录下有多少文件/文件夹：`ls |` 然后搞定！


    # sort


    此选项帮助你按字母顺序对文本文件进行排序。选项 `-r` 允许执行反向排序（即反字母顺序或数字递减），选项 `-R` 允许随机排序。


    # Uniq


    `uniq` 命令允许你复制文件。只需在参数中提供要复制的文件地址和要创建的新文件名称即可。


    # file


    此命令帮助你确定使用的文件类型，无论其扩展名如何。你只需要提供要评估的文件参数即可。


    # split


    通过此命令，你可以将文件切割成较小的文件（`-l` 指定行数，`-b` 指定字节大小 [遵循 K, M, G, T 的大小来定义不同的单位）。


    # Locate


    此命令允许在硬盘上定位文件。例如：`locate Linuxututorial.txt`。`locate` 命令非常快，因为它通过查询数据库查找文件。它不会直接扫描硬盘查找文件。此过程的缺点是，如果文件是新的，可能尚未被索引，定位将无法帮助。


    # Find


    `find` 命令比 `locate` 强大得多，但因为它在搜索时会遍历磁盘。与 `locate` 不同，`find` 允许根据大小或最后访问日期进行搜索。


    # nohup


    此命令允许用户启动程序，并在控制台关闭后保持其运行。


    # Cat


    此命令允许你读取文本文件的内容：`cat Linuxututorial.txt`。


    # less


    操作与 `cat` 类似，但逐页显示文件。因此，对于大文件来说更加方便。


    # Head


    显示文件的头部。选项 `-n` 允许你指定要显示的行数。


    # tail


    类似于 `head`，指的是文件的“尾部”；句话说，此命令只显示结尾。


    # touch


    `touch` 的主要目标是更改文件的时间范围。如果你对已存在的文件执行 `touch`，它将更新其最后访问和修改日期。


    为你终端上的所有元素创建一个脚本。


    使用 `script` 命令，你可以为控制台上的所有内容创建一个脚本。


    # 目录权限


    为了防止其他用户访问文件夹，请使用 `chmod` 命令。


    # 密码文件


    如果你担心用户可能会访问你的文件，可以使用以下命令为其设置密码：`vim` 后接文件名。


    # 知道何时退出终端


    在 Linux 上，你可以设置提醒来知道何时退出终端。通过命令“leave + 当天时间”，你就知道什么时候该停止工作了。


    # 文本格式化


    你可以使用以下命令字符串在 Linux 上格式化文本：`fmt + filename`。


    # 完成上一个命令


    使用命令 `!` 可以节省时间，因为它会自动帮助完成上一个命令，而无需手动输入剩余命令。


