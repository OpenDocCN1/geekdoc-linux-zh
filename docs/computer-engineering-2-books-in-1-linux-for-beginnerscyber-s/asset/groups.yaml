    +   8. Redirect standard output and standard error together in one file'
  - '[PAGE 118]


    ```

    [student@desktop ~]$ find /etc -name passwd >& ~/onefile

    ```


    This will redirect the standard output and standard error to the file onefile
    in the student''s home directory.


    # Using the Pipeline


    A pipeline is an operator, which separates one or more commands by using a pipe
    operator. The pipe basically takes the standard output of the first command. It
    passes it as standard input to the second command.


    The output will keep passing through various commands, separated using the pipe,
    and only the final output will be displayed on the terminal. We can visualize
    it as a flow of data through a pipeline from one process to another process. That
    data is being modified on its way by every command it passes through.


    Let us go through some examples of the pipeline, which are useful in system administration
    tasks.


    ```

    [student@desktop ~]$ ls -l /var/log | less

    ```


    This will list the files and directories located at /var/log and display it on
    the terminal one screen at a time because of the less command.


    ```

    [student@desktop ~]$ ls | wc -l

    ```


    This command will pass the output through the pipe, and the wc -l command will
    count the number of lines in the output and display the number of lines and not
    the actual output of the ls command.


    # Pipelines, Redctions, and the Tee command'
  - '[PAGE 119]


    As already discussed, when you are using the pipeline, the pipeline makes sure
    that all the data is processed and passed through every command. Only the final
    output is displayed on the terminal screen. This means that if you were to use
    output redirection before a pipeline, the output would be redirected to the file
    and not to the next command in the pipeline.


    ```

    student@desktop ~]$ ls >file | less

    ```


    In this example, the ls command''s output was redirected to the file in the student''s
    home directory and never passed to the less command. The final output never appeared
    on the terminal screen.


    This is exactly where the tee command comes into the picture to help you work
    around such scenarios. If you are using a pipeline and use the tee command in
    it, tee will copy its standard input to standard output and, at the same time,
    will also redirect the standard output to the specified files named as arguments
    to the command. If you visualize data as flowing through a pipe, tee command will
    be the T joint of that data, which will direct the output in two directions.


    Let us go through some examples, which will help us understand how to use the
    tee command with pipelines.


    ```

    student@desktop ~]$ ls -l | tee ~/Documents/output | less

    ```


    Using tee in this pipeline firstly redirects the ls command''s output to the file
    at Documents/output in the student''s home directory. After that, it also feeds
    the ls command to the pipe as input to the less command, which is then displayed
    on the terminal screen.


    ```

    student@desktop ~]$ ls -l | less | tee ~/Documents/output

    ```'
  - '[PAGE 120]


    In this case, we see that tee is used at the end of the command. This does it
    displays the output of the commands in the pipeline on the terminal screen and
    saves the same output to the file at Documents/output in the student''s home directory.


    **Note:** You can redirect standard error while using the pipe, but you will not
    be able to use the merging operators && >>


    Therefore, if you wish to redirect both standard output and standard error while
    using the pipe, you will have to use it in the following manner.


    ```

    [student@desktop ~]$ find -name / passwd 2>&1 | less

    ```


    # Using the Shell Prompt to Edit Text Files


    This section will learn how to use the shell prompt to create new files and edit
    existing files. We will also learn about Vim, a trendy editor used to edit files
    from the shell prompt.


    # Using Vim to edit files


    One of the most interesting things about Linux is that it is designed and developed,
    so all information is stored in text-based files. There are two types of text
    files, which are used in Linux. Flat files in which text is stored in rows containing
    similar information, which you will find in the /etc. Directory, and Extensible
    Markup Language (XML) file has text stored using tags, which you will find in
    the /etc. and /usr directories. The biggest advantage of text files is that they
    can be transferred from one system or platform to another without converting them.
    They can also be viewed and edited using simple text editors.'
