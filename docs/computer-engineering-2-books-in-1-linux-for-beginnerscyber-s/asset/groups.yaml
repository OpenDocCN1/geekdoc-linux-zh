    /etc 目录下找到它们；以及可扩展标记语言（XML）文件使用标签存储文本，你可以在 /etc 和 /usr 目录找到它们。文本文件的最大优势是它们可以从一个系统或平台传输到另一个而无需转换。它们可以使用简单的文本编辑器进行查看和编辑。


