    - 你会发现你拥有研究和学习更多关于该程序如何工作以及你可以对其做什么的自由。

    - 你会发现你拥有查看并修改代码的自由。

    - 你会发现你拥有分发副本的自由。


    这些准则是开源软件的基石，它们确保了软件的透明、安全性和社区协作。


