    ## Connecting Your Linux System over the Network


    If you are looking to connect your Linux system over your network, you must use
    SSH.


    This is an acronym for Secure Shell, and it is one of the most well-known of the
    network protocols.


    The purpose of SSH is to let you connect securely to remote machines over your
    network.


    To connect your Linux system over your network:


    - Windows – use PuTTY

    - Mac and Linux – use SSH on the command line.


    ## Windows


    - Open your web browser and download PuTTY.

    - Open PuTTY, then type in the IP address or Hostname into the correct box.

    - If you had no port number provided, leave it as the default of 22.

    - Click on Data and then on the Auto-Login Username – input username.

    - To save a session, click the Saved Sessions box, type in a name, and click on
    Save. In the future, you will be able to double click the saved session to connect.

    - Click on Open, and a connection is made.

    - When you connect to a server for the first time, PuTTY will ask for permission
    to cache the server''s host key – click on Yes.


    ## Linux and Mac


    Both Linux and Mac already have the SSH client built-in as a command-line program.
    To get to it, run the terminal:


    - Mac – Applications folder

    - Linux – Open Dashboard and search for Terminal


    When the terminal has been started, simply use the SSH command to get your connection.


    Do be aware that commands are always case-sensitive, so only use lowercase. Type
    in "ssh" followed by the username on the Linux server.


    When you connect for the first time to a server, you will need to verify the host
    key.


    Type Yes to continue connecting and then press Enter. When the connection is established,
    input your password. To get out of the connection, type in exit and then log out.


    Ou is finished with downloading and installing methods for your chosen Linux distribution
    or Linux operating system. After the process of adjusting your computer for the
    new operating system, you need to set up the Linux performances and environment
    related to your needs and working opportunities.


    According to which Linux distribution and desktop environment you choose, your
    desktop environment and installed applications will vary. Most of them will cover
    your typical needs and similar personal requirement based on computer working.
