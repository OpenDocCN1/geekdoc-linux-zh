    ## Chapter Two: How It Works & How to Get Away with It


    To completely understand how hacking works would take a lot more than a chapter.
    Hacking is not exactly a skill that can be taught by reading about it; it is more
    of a hands-on occupation perfected by time and practice with an inventive mind
    and a dash of mischievous spirit.


    Hackers work with the computer or program code, a set of instructions that work
    in the background, and make up the software. At the same time, many hackers know
    how to program code, many downloads, and use codes programmed by other people.
    The main requirement is how to work this code and adjust it to their advantage.
    For malicious hackers who can use it to steal passwords, secrets, identities,
    financial information, or create so much traffic, the targeted website needs to
    shut down.


    ### Stealing Passwords


    Passwords are easy to hack because humans are very predictable. We think we are
    unique until it comes to passwords, but we are very easy to guess. For example,
    women will often use personal names for passwords—think kids, relatives, old flings—while
    men will stick to hobbies. The numbers we use most frequently are 1 and 2, and
    they are most often placed at the end of our password. More often than not, we
    use one word followed by some number, and if the website insists on including
    a capital letter, we place it at the beginning of the word and then whine about
    how this website is so annoying for making us go through all of this.


    But how do hackers access our passwords? Well, there are several useful techniques.


    The trial and error technique is called the brute force attack, and it is when
    you try possible combinations of letters and words to try and guess the right
    password. This can work because, as previously mentioned, we are very predictable
    when it comes to the type of passwords we use.


    Another similar technique is called the dictionary attack; hackers use a file
    containing all the words found in the dictionary, and the program tries to em
    them all. This is why it is often suggested to add numbers to your passwords as
    words, but this doesn''t mean your "sunshine22" password is hackerproof.


    A third technique is the rainbow table attack. The passwords in your computer
    system are hashed (generated into a value or values from a string of text using
    a mathematical function) in encryption. Whenever a user enters a password, it
    is compared to an already stored value, and if those match, you can enter into
    the website or application. Since more text can produce the same value, it doesn''t
    matter what letters we input as long as the encryption is the same. Think of it
    as a door and a key. You enter the doors with the key made for that lock, but
    if you''re skilled at lock picking a locksmith, you don''t need that key to enter.


    ### How to Protect Yourself from Password Attacks


    Use the salt technique. This refers to adding simple random data to the input
    of a hash function. The process of combining a password with a salt, which we
    then hash, is called salting. For example, a password can be "sunshine22", but
    adding the salt is e34f8 (combining sunshine22 with e34f8) makes your hash-stored,
    new salted password "sunshine22e34f8." The new salted password is thus hashed
    into the system and saved into the database.


    Adding the salt just lowered the probability that the hash value will be found
    in any pre-calculated table. If you are a website owner, adding salt to each user''s
    password creates a much more complicated and costly operation for hackers. They
    need to generate a pre-calculated table for each salted password individually,
    making the process tedious and slow.


    Even with the salt technique, determined hackers can pass through "password salting."
    Another useful technique is the peppering technique. Just like salt, pepper is
    a unique value. Pepper is different than salt because salt is unique for each
    user, but pepper is for everyone in the database. Pepper is not stored in the
    database; it''s a secret value. Pepper means adding another extra value for storing
    passwords.


    For example, let''s say the pepper is the letter R. If the stored password is
    "sunshine22", the hash stored will be the hashed product of "sunshine22" with
    the added letter R. When the user logs, in the password they are giving is still
    "sunshine22", but the added pepper is storing "sunshine22w" with the added R.
    The user has no knowledge that pepper is being used. The website will then cycle
    through every possible combination of peppers, and by taking upper and lowercase
    letters, there will be over 50 new combinations. The website will try hashing
    "sunshine22A," "sunshine22B," and so on until it reaches "sunshine22R." If one
    of the hashes matches the stored hash, then the user is allowed to log in. The
    whole point is that the pepper is not stored, so if the hacker wants to crack
    the password with a rainbow table or dictionary attack, it will take them over
    50 times longer to crack a single password.


    ### Phishing Attacks


    The easiest way to get someone''s password is to ask them. After all, why bother
    with all the algorithms and cracking codes when you can just politely ask?


    Phishing is often a promise of a prize if you click on a certain link that then
    takes you to a fake login page where you simply put in your password. The easiest
    way to defend from this is smart clicking or not clicking on scammy pop-up ads.


    Vacations and iPods are not just given away with a click, and "you won''t believe
    what happened next" is a sure sign of a clickbait leading to phishing.


    Miracle weight loss pills, enlargement tools, singles waiting to meet you in the
    area, and other luxurious life promises with just one click are all phishing.
    Unfortunately, we have to work for money and workout for weight loss.


    ### Back Door Attacks


    Imagine you''re going to a concert, but you don''t have a ticket. You see the
    line of all people with their purchased tickets waiting to get through security.
    You see cameras pointing at the front door and a few extra security guards guarding
    the sides. You don''t have a ticket or the money to buy one. Then, you see a little
    unguarded, dark, hidden alley with no cameras and the back door. The doors that
    lead to the venue. They are unlocked, and there are no security or cameras around.
    Would you go through the door? That''s the concept behind a backdoor attack.


    How backdoors even end up on our computers? Well, they can end up intentionally
    by the manufacturer; this is built-in, so they can easily test out the bugs and
    quickly move in the applications as they are being tested.


    The back door can also be built by malware. The classic backdoor malware is the
    infamous Trojan. Trojan subtly sneaks up on our computer and opens the backdoor
    for the people using the malware. The malware can be hidden into anything—a free
    file converter, a PDF file, a torrent, or anything you are downloading into your
    computer. Of course, the chances are higher when you''re downloading a free copy
    of an otherwise paid product (lesson to be learned here). Trojans have an ability
    to replicate, and before you know it, your computer is infected with malware that
    is opening a backdoor for the whole line you come in to see the show for free.


    The back door can be used to infiltrate your system not only for passwords but
    also for spying, ransomware, and all kinds of other malicious hacking.


    ### How to Protect Yourself from Back Door Attacks


    Choose applications, downloads, and plugins carefully; free apps and plugins are
    a fantastic thing, YouTube to MP3 converters, torrents of the latest Game of Thrones
    season, and a copy of Photoshop might not be the best option if you''re interested
    in keeping your passwords safe. Android users should stick to Google Play apps,
    and Mac users should stick with the Apple store. Track app permissions, too, and
    be to read, at least a little, before you sign your life away to a third-grade
    flashlight application.

