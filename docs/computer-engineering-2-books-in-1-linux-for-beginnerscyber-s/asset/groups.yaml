    # # Chapter Three:


    # # What Is Cybersecurity


    Computer technology has evolved in unimaginable sophistication and innovation
    ever since its inception. The majority of the advancements, reach, and power of
    the internet has aided information technology’s popularity. Today, almost any
    industry or individual uses computer systems and networks for some purpose or
    another.


    The measures are taken to protect computer systems, networks, and devices against
    cyber-attacks are categorized as cybersecurity. Although computer technology has
    evolved leaps and bounds, the same can''t be said about cybersecurity.


    Cyber-attacks have become increasingly complex and deceptive, with highly skilled
    cyber-criminals dedicating enormous amounts of time, resources, and energy into
    launching serious cyber-attacks. However, the means for protecting individuals
    and organizations from such attacks have been slow to catch up.


    Various security measures are discussed at length, including the proper use of
    passwords and PINs, creating routine back-ups, practicing caution when connecting
    to public networks, and much more. The discussion also includes putting those
    countermeasures into effect without affecting one’s lifestyle, productivity, and
    budget.'
- md: '

    The internet has transformed the way corporations conduct business. Computers
    and networks have changed business processes from manufacturing, operations, communications
    to finance, distribution, marketing, and customer service. It is common to find
    the presence of computer systems and the internet in almost all processes related
    to businesses in one way or another.


    The advancements in computer technology, cheaper hardware, and the popularity
    of the internet paved the way for the next big in technology: The Internet of
    Things. Objects that used to be "dumb" and needed human intervention have been
    made "smart" by giving objects the ability to collect and transmit data and respond
    to remote commands. The Internet of Things is predicted to continue to grow rapidly
    while changing humans'' lives and the operations of businesses.


    IoT devices connect to the internet to perform their duties. As a result, they
    have been targeted by cyber-attacks with varying motives. The fact that IoT is
    a relatively novel technology means that IoT devices are yet to be equipped with
    cybersecurity measures that computers feature. Furthermore, IoT devices are used
    to carry out out demanding duties, including access control and aiding in healthcare.


    ## What is Cyber Security?


    The protection of a computer system or network from adverse effects such as theft
    or damages to the computer hardware, software, data, or the services provided
    by those elements is known as cybersecurity. Cybersecurity is also known as Computer
    Security and IT Security (Information Technology Security). Cybersecurity has
    fast evolved over the years due to the rapid increase in the use and reliance
    on the internet, computers, and wireless networks.


    The use of devices that are also prone to cyber-attacks, such as smart mobile
    phones, smart televisions, and devices falling under the category of the "Internet
    of Things" (IoT), has also contributed to the need for the rapid evolution of
    cybersecurity. The technology and politics surrounding the use of the internet,
    computers, networks, and smart devices are complex that pose many challenges to
    the world of cybersecurity.


    Due to the fast-changing nature of technology and other factors, cybersecurity
    is always evolving. Cybersecurity approaches, tools, risk management methods,
    technologies, best practices, and training are always changing as a result. Cybersecurity
    threats also advance with the evolution of technology and the use of devices,
    software, and networks prone to those threats. Many organizations and even individuals
    put high levels of cybersecurity emphasis on protecting their valuable hardware,
    software, data, services, and organizational objectives.


    Cybersecurity has been a huge focus for businesses due to the risk of data breaches
    that can cripple them in many ways. Such breaches often lead to the loss of highly
    sensitive data that costs companies their revenues, competitive advantage, reputation,
    and consumer trust. A data breach is expected to cost a company around $3.6 million,
    making data security a high priority for any organization.


    ## Cyber Attacks and Vulnerabilities


    A weakness in the design, implementation, internal control, or the operations
    of a computer, hardware, smart device, Software, or network results in exposure
    to cyber-attacks. The Common Vulnerabilities and Exposures is a database that
    documents such known vulnerabilities to cyber threats. At least one active attack
    or an exploit that exists is called an exploitable vulnerability. Various manual
    and automated tools are used to identify vulnerabilities to cyber-attacks.


    When it comes to computers and networks, attacks largely attempt to expose, disable,
    alter, steal, destroy, or gain access to the use of assets. Any such offensive
    maneuver that tries to target computer systems, networks, infrastructures, and
    personal devices can be called a cyber-attack. A cyber-attack can be carried out
    by a single individual or a group with malicious intent putting hardware, data,
    and functionalities at risk.


    Cyber-attacks can be categorized as cyber warfare or cyberterrorism, depending
    on the nature of the attack and its threat. Furthermore, cyber-attacks can be
    carried out by various societies and sovereign states operating in anonymity.
    During a cyberattack, susceptible systems and devices are hacked into while achieving
    the attacker''s malicious intents or the attackers. A cyberattack scale may also
    vary from a single computer, device, individual, or company is the primary target
    to infrastructures of entire nations.


    ## Information Security Culture


    The behavior of employees plays a key role in establishing cybersecurity in companies.
    Changes and improvements to a company''s culture and practices can help employees
    effectively achieve information security. Employees sometimes do not realize that
    they are an integral part of a company''s effort to achieve satisfactory cybersecurity
    levels. Their actions may sometimes not align with the company''s cybersecurity
    goals as a result.


    A company should continuously improve its information security culture while making
    sure that employees understand the role they need to play.


    The process is never-ending with an ongoing cycle of change, evaluation, and maintenance.
    The five steps involved in managing a company''s information security culture
    are pre-evaluation, planning, strategic planning, operative planning, implementing,
    and post-evaluation.


    Pre-evaluation brings awareness regarding the company''s current information security
    culture and policy while highlighting behavior that might make it vulnerable to
    cyber threats. The next step in the process is strategic planning, then creating
    a program towards increasing awareness with a clear target to achieve as company.
    Operative planning involves working towards a better culture by improving internal
    communication, security awareness, and training.


    Implementing is a step that consists of four phases: the commitment of management,
    communication with employees, providing courses for employees, and the employees''
    commitment. Managers first commit to implementing better information security
    practices within the company and then communicates the company''s intentions to
    the employees. Then the employees are provided with education and training regarding
    information security.


    Finally, the employees of the company committed to bringing about an improved
    and satisfactory information security culture. The final step, which is Post-Evaluation,
    assesses how well the planning and implementation went and identifies any areas
