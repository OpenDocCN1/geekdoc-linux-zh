    GNU/Linux distribution does not hint, analyze, or transmit any of your actions
    to "third parties," which may breach users'' privacy.


    # Linux Tips and Tricks


    There are thousands of command lines, which makes it possible to execute tasks
    in no time. Rather than flipping through pages one after the other, a single command
    can help you get what you want in a few seconds.


    On Linux, you must note that some Windows shortcut keys may perform different
    functions entirely. Hence, don''t expect Ctrl + S to help you save Items on Linux.


    ## ls


    This command is used to list the files in a folder. You can use "-a" to list hidden
    files, "-l" for detailed list, and "-R" to View subfolders.


    Change directory; the command is used to navigate within the existing file system.
    For example, cd /var/log to go to the logs folder. This is effective regardless
    of where you are since we put the start slash, which indicates that it is an absolute
    address.


    To navigate within directories, there are two handy shortcuts to know. cd ~ leads
    to the directory of the current user (/home/user/ most of the time or /root if
    you are root) and cd - returns to the previous path.


    ## pwd


    Print working directory. This command displays the absolute path of the folder
    you''re presently in.


    ## Clear


    This is used to clean your terminal window, relegating all the text above, and
    leaving you with a clean window. The keyboard shortcut ctrl + l does the same
    thing.


    ## Ctrl + s


    Stop the display; this is very useful when you mistakenly input a wrong command.
    This command undoes the previous command allowing you to correct the mistake.


    ## ctrl + d


    This is used to disconnect a session or terminal properly.


    ## Ctrl + k


    Deletes all text after the cursor and saves it to the clipboard. Ctrl + u delete
    command from the cursor to the beginning of the line. For instance, if your cursor
    is placed at the end of the text, this key will delete the entire line.


    ## Ctrl + y


    This is used to paste text copied from the clipboard.


    ## Ctrl + r


    This command allows you to search the command history. Usually, you go back to
    commands already typed using the top arrow key. With ctrl + r, you can search
    this history. Press ctrl + r, and then type a piece of the command which you want
    to search.


    !!


    In line with the practical bash shortcuts, the double exclamation point allows
    you to relaunch the last command.


    ## for


    This is certainly the most complex command of this section, especially for beginners.
    For is a loop instruction. A loop is used to execute an action several times,
    on all the elements of a variable. For example, we can easily rename all files
    in a directory to replace spaces with hyphens or comma with a full stop.


    ## ctrl + z


    On Windows, this is used to undo an action, but it is used to pause the current
    process on Linux.


    ## bg


    This is used to escape from a process that is paused in the background.


    ## fg


    This is used to resume a process in the background (if several are running simultaneously,
    fg %n).


    ## at


    This is used to program an event to run an hour later, e.g., at 18:22 or now.


    ## atq


    This is used to list pending tasks.


    ## atrm


    Delete task.


    ## sleep


    This command allows you to pause between the executions of two commands. Example:
    touch gt.txt && sleep 10 && rm gt.txt


    ## crontab


    crontab is a command that reads and modifies a file called "crontab." Here are
    the most common options:


    - -e: modify the crontab

    - -l: displays the current crontab

    - -r: remove your crontab. Attention, the deletion is immediate and without confirmation


    ## sudo


    This is used to execute a command as root.


    ## sudo su


    Passes root and saves it.


    ## chmod


    Change the rights on a file or folder. It modifies users'' access to a file.


    ## Chown


    Changes the owner of a file/folder (can only be used in root) -R option for recursion.


    | User Command | Description |

    | :--- | :--- |

    | adduser | To add a user. |

