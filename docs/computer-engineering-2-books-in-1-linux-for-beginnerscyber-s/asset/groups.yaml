    the program can carry out more and more complex tasks. You may even develop it
    to be as complex as Ethereum! Once your blockchain is functional, you can upload
    it to GitHub or another forum so that other people can download it. You may want
    to consider uploading it as a .tar file so that people can download the source
    code rather than the binary program.


    Keep in mind that a blockchain is nothing more a digital ledger of transactions
    at its heart. It is not the graphics and web pages that you can access through
    platforms like Ethereum; those are only secondary. The next section will look
    at how to use Linux to build a blockchain application''s front end.


    # Front-End Blockchain Applications


    Once your blockchain is running well on the back end, you are ready to start building
    front-end applications for it. The front end is the interface that the users will
    interact with when they are actually using the applications.


    Python is ideal for building the back end of applications, but it isn''t quite
    adept at the front end. Many programmers agree that JavaScript is the way to go.
    Probably the best way to get started is to use JavaScript to create a module that
    you will call upon in your Python code.'
