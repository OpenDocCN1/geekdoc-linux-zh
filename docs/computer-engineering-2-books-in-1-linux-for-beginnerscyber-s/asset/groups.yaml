    ## 第九章：


    ## 网络安全在公司中的角色


    网络安全对于几乎任何公司都是至关重要的。没有任何业务会想成为网络攻击的受害者；因此，网络安全在企业中的功能是极其重要的。确保特定业务不会成为任何网络攻击受害者的最有效方法，是在几乎任何攻击发生之前，确保业务安装了庞大的安全计划。


    在企业中，人员、流程和工程应该相互对等，以获得对网络攻击的非常成功的防御。个人威胁管理设备可以自动围绕选定的 Cisco 安全产品进行集成，并加速严重的安全运营功能：检测、调查和修复。


    随着如今更年轻、更精通技术的一代参与了大部分的业务，组织网络安全策略、协议和处理方案的健康状况在 2018 年变得重要得多。与其年长、更倾向于纸质工作的同事相比，他们在电脑上存储了个人信息和物品，以下
    34 项行业网络安全职责为心理网络犯罪分子构筑了更广泛的捕猎网。


    远程办公和特定设备的使用带来的移动性设计，使组织能够准备好通过信息、应用程序和网络来识别风险。因此，随着组织网络安全的优势成为商业界的一个重要议题，任何领导者都应该加强其教育、参与和评估的倡议；这样，无论员工如何或在哪里工作，组织都能保持保护状态。


    对技术日益的依赖只是使网络安全对现代组织变得至关重要的方面之一；监管机构对保护消费者信息的压力是推动网络安全推向业务议程首位的另一个主要驱动力，即将到来的欧盟
    GDPR 指令已准备加强对美国及全球关键业务组织的问责制，以及非物理资产日益增长的重要性。顺应这种趋势，公司必须重新评估其企业文化和风险管理框架，以便执行优秀的替代网络安全计划，以更好地评估和降低所有企业业务中的风险。


    显然，如果 2018 年的收入预测是事实，公司正在重视其网络安全人员的价值，Robert Walters 的年度现金流调查预测本季网络专家的薪水将增长 7%，是整个
    IT 行业中涨幅最高的。一些公司正在努力让他们的网络安全团队满意，意识到除了收入之外，你还会发现其他同样吸引人的激励来留住网络人才。工作时间的灵活性和远程办公的选择对于网络专业人士以及他们从事的工作类型来说也是巨大的吸引力，如果他们真的对公司文化感到积极的话。


    现在是各种规模的业务都需要推动运行网络安全角色的了。因为移动性、远程办公和物联网（IoT）处理着跨业务的复杂漏洞。问题在于，全球实体通过小型承包商或可能利用物联网被入侵，因为这使得更容易进入网络，因此许多组织应该考虑第三方管理安全以避免这种情况的发生。


    另一个结论是，中小企业应该在自己的力量范围内加强首席风险官（CROs）的形象和覆盖范围，协助组织提供对网络影响的 360 度视图。


    硬性网络安全涉及人员、流程和技术。


    人员：


    每位员工都需要关注他们在阻止网络威胁方面的工作。网络安全人员必须跟上最可能的风险、解决方案和资质。所有者必须理解并遵守基本信息安全原则，如选择强密码、警惕电子邮件附件以及备份数据。了解更多关于基本网络安全概念。


    流程：


    记录的流程应该定义角色、职责和程序。网络威胁在不断演变，因此程序必须不断审查。企业必须使用一个框架来处理每次尝试性和成功的网络攻击。一个备受推崇的框架可以指导你。它描述了你应对攻击、保护应用程序、检测和响应威胁以及克服有效攻击的策略。查看
    NIST 网络安全框架的视频解释。


    技术：


    从访问配置到安装防病毒软件，技术可被用于降低网络风险。技术对于为企业和个人提供防御网络攻击的计算机安全设备至关重要。需要保护三个领先实体：作为电脑系统的终端设备、敏感物品以及路由器；网络；以及云。保护这些实体的常规技术包括下一代防火墙、DNS
    过滤、恶意软件保护、防病毒软件和电子邮件安全方法。

