    slow down. And then, all of a sudden, your computer will begin to send out massive
    spam emails or social media posts that you have nothing to do with. DDoS attacks
    are lovely (for the hacker, not for you) because they work on multiple computers
    at once, and the numbers can go into millions. A million zombie computers are
    mindlessly wandering around the internet, spamming everything in sight, infecting
    other computers. The version where your computer is infected only to send spam
    is the light version. DDoS attacks can also be used for criminal activity, and
    this is why it is important to prevent them.


    # How to Protect from DDoS Attacks


    Larger scale businesses require more substantial protection against DDoS attacks,
    and we will go over that in detail, but even for individuals, half of the protection
    is prevention.


    Understand the warning signs—slowed down computers, spotty connections, or website
    shutdowns are all signs of a DDoS attack taking place.


    ## What Can You Do?


    - Have more bandwidth - This ensures you have enough bandwidth to deal with massive
    spikes in traffic that can be caused by malicious activity.


    - Use anti-DDoS hardware and software modules - Protect your servers with network
    and web application firewalls. Hardware vendors can add software protection by
    monitoring how incomplete connections and specific software modules can be added
    to the web server software to provide DDoS protection.


    - Smart clicking - This should go without saying, but for those in need of hearing
    it—pop-up ads with a "No, thanks" button are hateful little things. Just exit
    the website, don''t click anything on that ad, especially the "No, thanks," button,
    or you will instantly activate an annoying download, and now your computer is
    a zombie.


    ## Man in the Middle


    When you''re online, your computer does little back-and-forth transactions. You
    click a link, and your computer lets the servers around the world know you are
    requesting access to this website. The servers receive the message and grant you
    access to the requested website. This all happens in nanoseconds, and we don''t
    think much about it. That nanosecond moment between your computer and the webserver
    is given a session ID that is unique and private to your computer and the webserver.
    However, a hacker can hijack this session and pretend to be the computer and,
    as such, gain access to usernames and passwords. He becomes the man in the middle,
    hijacking your sessions for information.


    # How to Protect Yourself from the Man in the Middle


    Efficient antivirus and up-to-date software go a long way in preventing hijacking,
    but there are a couple of other tips that can help you prevent becoming a victim.


    - Use a virtual private network - A VPN is a private, encrypted network that acts
    as a private tunnel and severely limits the hacker''s access to your information.
    Express VPN can also mask your location, allowing you to surf the web anonymously
    wherever you are.


    - Firewalls and penetration testing tools - Secure your network with active firewalls
    and penetration testing tools.


    - Plugins - Use only trusted plugins from credible sources and with good ratings.


    - Secure your communications - Use two-step verification programs and alerts when
    someone signs in to your account from a different computer.


    # Root Access


    Root access is an authorization to access any command specific to Unix, Linux,
    and Linux-like systems. This gives the hacker complete control over the system.
    Root access is granted with a well-designed rootkit software. A quality designed
    rootkit software will access everything and hide traces of any presence. This
    is possible in all Unix-like systems because they are designed with a tree-like
    structure in which all the units branch off into one root.


    The original Unix operating system was designed in a time before the personal
    computer existed when all the computers were connected to one mainframe computer
    through very simple terminals. It was necessary to have one large, strong mainframe
    for separating and protecting files while the users simultaneously used the system.


    Hackers obtain root access by gaining privileged access with a rootkit. Access
    can be granted through passwords; password protection is a significant component
    in restricting unwanted root access. The rootkit can also be installed automatically
    through a malicious download. Dealing with rootkit can be difficult and expensive,
    so it''s better to stay protected and keep the possibility of root access attacks
    to the minimum.


    # How to Protect Yourself from Root Access Attacks


    Quality antivirus software is one of the standard things recommended in all computers,
    be it for individuals or businesses. Quality antivirus helps the system hardening
    making it harder for the installation of rootkits.


    - Principle of least privilege - PoLP is the idea that any program or a user should
    have only the minimum privileges necessary to perform the program''s function.
    Giving only the bare minimum privilege that a program needs to perform allows
    for better protection. For example, in a business, a user whose only job is to
    answer emails should only have access to email. If there is an attack on the user''s
    computer, it can''t spread far. If said person has root access, the attack will
    spread system-wide.


    - Disable root login - Servers on most Unix and Linux operating systems come with
    an option for the root login. Using root login allows for much easier access,
    and if you pair it with a weak password, you are walking on a thin line. Disabling
    the option for root access keeps all the users away from the root login.


    - Block brute forces - Some programs will block suspicious IP addresses for you.
    They will detect malicious IP and prevent attacks. While manually detecting is
    the safest way, it can be a long process; programs that are designed to block
    malicious IPs can drastically save time and help prevent root attacks.


    The best way to protect yourself from hack attacks is through prevention because
    the alternative can be lengthy, exhausting, and costly. In the following chapter,
    we will go into detail about cybersecurity and exactly how you can prevent all
    the possible attacks on your system.

