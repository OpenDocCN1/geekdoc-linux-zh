    -   守护进程（Daemons）：这些将是一些后台服务。它们可能包括调度、声音和打印选项，你可以根据自己的需求对它们进行调整。它们会在你启动系统时启动，或者在你有机会登录桌面后启动。


    -   Shell（壳）：你可能已经听过这个词很多次，或者指的是 Linux 命令行，它曾让许多人对 Linux 望而却畏（也许因为他们认为自己必须学习一些枯燥的命令行结构才能使用该操作系统）。Shell
