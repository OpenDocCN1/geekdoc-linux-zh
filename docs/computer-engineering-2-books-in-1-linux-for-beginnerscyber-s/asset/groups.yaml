    # Executing Commands on the Bash Shell


    The Bourne Again Shell, known as bash, interprets commands input by the user on
    the shell prompt. We have already learned how the string you type in a shell prompt
    is divided into three parts, command, options, and arguments. Every word that
    you type into the shell is separated using blank space. The program that is already
    installed on the system is defined by every command that you type. Every command
    has options and arguments associated with it.


    When you have typed a command on the shell prompt and the options and arguments
    are ready to run it, you can press the Enter key on the keyboard, which will execute
    that command. You will then see the output of that command displayed on the terminal.
    When the output completes, you will be presented with the shell prompt again,
    which is an indication that the previous command has been executed successfully.
    If you wish to type more than one command on a single line, you can use a semicolon
    to separate the commands.


    Let us go through some simple commands used on a daily routine on the command
    line in Red Hat Enterprise Linux 7 and other Linux operating systems.


    Date command shows the date and the time of the system. If you pass an argument
    with the + sign for the date command, it indicates the format in which you want
    the date to be displayed on the output.'
