    ## 第八章：区块链


    区块链和 Linux 似乎是天生一对。它们结合在一起，使反对取消网络中立性的斗争更加强大。它们呈现了一种去中心化的范式，并使任何人都能编写和实现代码。它们确实是计算机世界中的完美结合。


    ## Hyperledger


    Linux 会（Linux Foundation）是 Hyperledger 的幕后推动，这是一个巨大的区块链企业项目，帮助企业在其公司基础设施中实现区块链技术。Linux
    会于 2015 年 12 月宣布其创建，并在 2016 年 2 月宣布了其创始成员。Hyperledger 的目标是通过区块链提高业务的问责性和透明度。IBM
    和 Intel 等技术巨头已经支持该项目，并为其核心软件做出了贡献。


    私有链是有争议的，因为它们实现了中心化。然而，Hyperledger 使用了私有链，但它们并没有集中在任何一个业务中。例如，作为 Hyperledger 联盟的银行并没有获得自己的区块链；它成为了一个包含多个行业的更大区块链的一部分。其他公司参与验证过程并提供数据不可篡改性，为私有链增加了一层问责机制。它并没有变得完全去中心化，但距离完全中心化还有几步之遥。


    存在多个 Hyperledger 区块链和区块链框架。例如，Hyperledger Fabric 是一个允许公司创建去中心化应用程序的区块链框架，部分客户和用户可以从前端访问。人们可以使用它创建并执行智能合约，从而实现许多流程自动化。


    Hyperledger 已应用于许多不同的行业。它被用于追踪供应链运输，这意味着它可以追踪人们最终消费的货物运输路线。假设父母为婴儿购买了一罐奶粉，后来发现该批奶粉被污染了。父母会立即想知道他们是可以不给宝宝喂奶，或者让宝宝立即接受医疗治疗。传统技术会在发现问题时提醒他们。而
    Hyperledger 的使用让他们能够在购买之前扫描奶粉罐以追踪其整个运输路线。它还用于维护健康记录和医疗保险。它可以用于追踪汽车所有等信息，这样买车的人就可以查出特定汽车经历过什么。使用
    Hyperledger 意味着客户对他们的购买的产品以及他们支持的公司更有信心。


    Hyperledger 是开源的，因此任何人都可以访问源代码并从理论上对其进行改进。当然，这些改进必须经过 51% 多数节点的批准。Hyperledger
    主要用 JavaScript 编写。任何所做的更改都需要用 JavaScript 编写，或者从不同的编程语言（如 Python 或 C++）编译为 JavaScript。


    ## 成为区块链节点


    在 Hyperledger 中成为节点需要许可。除非你在该公司的内部拥有高级访问权限，否则不太可能获得。然而，你仍然可以设置你的 Linux 成为比特币、以太坊、Blockstack
    或 Lisk 等公有区块链的节点。


