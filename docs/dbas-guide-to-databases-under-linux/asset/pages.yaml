  md: 'To provide full transactional roll back between multiple databases, a feature
    called 2-Phase Commit was introduced shortly after introducing the capability
    of the Progress session to be connected to multiple databases at the same time.
    There is no issue if those databases are located on one single system, since the
    2-Phase Commit scheme involves data in main memory. If those databases are located
    on different machines, the method no longer works. For such a feature to exist,
    a Distributed Lock Manager is needed. The theory and practice of this software
    is complex and expensive to build. It is even more expensive to continue and run.
    PSC has taken the stance that the expense of such a Lock Manager would be too
    much for a client base used to a high ROI database. Consequently, systems products
    like Tuxedo and TopEnd are not candidates for Progress.


