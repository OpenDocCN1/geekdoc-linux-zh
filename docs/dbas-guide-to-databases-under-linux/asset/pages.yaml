  md: 'This is a program you will rarely need to use if you learn to use the oncommand
    command and the $ONCONFIG settings. It is much easier and safer (less risky) to
    edit the $ONCONFIG by hand, and restart the engine. There are also things you
    can do with the onmon command to save you from restarting the engine, thus eliminating
    the need for monitor. It is important to review all the commands and programs
    that are available to you in the $INMIXDIR/bin directory. A Web-based system administration
    tool is now available for people wanting to manage the server with a Web browser.


    # # Resources


    Several avenues of help and resources are available to you and when you need help
    with Informix products. Some of the contacts are in the way of customer support;
