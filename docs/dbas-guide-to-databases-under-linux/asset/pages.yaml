- img_proc: true
  md: '# Standard UNIX Services


    Linux supports all the UNIX services: e-mail, FTP, UseNet news, Telnet, POP, IRC,
    NFS, DNS, NIS, SNMP, Kerberos, etc., as would be expected of any Internet OS.


    For a much more detailed overview of what Linux is and is not, you can check out
    the Linux International web site at http://www.li.org/li/index.shtml.


    # Copyright


    The Linux Kernel is Copyright © Linus B. Torvalds and is copyrighted under the
    terms of the General Public License (GPL). You can read the GPL by browsing the
    file /usr/src/linux/COPYING on your local Linux system, or it may be on the installation
    CD-ROM in the top-level directory as the file named COPYING. Linux is a trademark
    of Linus Torvalds.


    # Why Use Linux?


    You would use Linux for the same reasons you would use any operating system: reliability,
    security, features, and cost. When you add these together, Linux is hard to beat.
    Other operating systems boost the breadth of applications, the proven track record
    of reliability, the latest networking features, and a great price. No, it is not
    free. Nothing is free. One has to install, manage, and maintain it. The initial
    software is free; the on-going costs of support and staffing are not different.
    Just the up-front costs are very reasonable.


    # Use It Where?


    The most common starting point is in the server room as a router, dynamic host
    control protocol (ftp), database, file or print server, for almost any operating
    system. Then you can migrate it to desktops. Linux is a noted firewall server
    with the latest security offerings of IPChains and TCP Wrappers. Linux can provide
    network address translation (NAT) as well as proxy servers for intranet hosts
    accessing the Internet more securely. With Apache and WS-FTP services, you have
    a very secure and robust web and ftp site with extensive security, auditing, and
    management features to match, which exceeds any other competing products on the
    market. Various Linux versions have created alliances with major database servers
    to ensure optimal integration and performance. One such alliance has been created
    between RedHat and Oracle and there are others; check the home web site of any
    version for the particulars.


    # Server or Workstation?'
