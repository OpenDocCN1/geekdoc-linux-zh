  md: '# # Emergency Bug Fixes


    Sometimes emergency bug fix patches are released after the GA release of PostgreSQL.
    You can apply these optional patches depending upon the needs of your application.
    Follow these steps to apply the patches.— First, change the directory to the **postgresql**
    source directory.


    ```

    # su - root

    # rpm -i postgresql*.src.rpm

    # cd /usr/src/postgresql7.0.0

    # man patch

    # patch -p0 < patchfile

    # make clean

    # make

    ```


    The patch files are located in PostgreSQL patches: http://ftp.postgresql.org/pub/patches.


    # # How Can I Trust PostgreSQL?


    There is a scientific way to validate the reliability of the PostgreSQL system.
    To validate PostgreSQL, a regression test package **(src/test/regress)** is included
    in the distribution. The regression test package will verify the standard SQL
    operations as well as the extensibility capabilities of PostgreSQL. The test package
    already contains hundreds of SQL test programs.


    You should use the computer''s high-speed power to validate the PostgreSQL, instead
    of using human brain power. Computers can carry out software regression tests
    millions or billions of times faster than humans can. Modern computers can run
    billions of SQL tests in a very short time. In the near future the speed of computers
    will be several zillion times faster than the human brain! Hence, it makes sense
    to use the power of computers to validate the software.


    You can add more tests just in case you need to, and upload to the primary PostgreSQL
    Web site if you feel it will be useful to others on the Internet. The regression
    test package helps build customer confidence and trust in PostgreSQL, and facilitates
    rapid deployment of PostgreSQL on production systems.


    The regression test package can be taken as a very solid technical document, mutually
    agreed upon between the developers and end users. PostgreSQL developers extensively
    use the regression test package during the development'
