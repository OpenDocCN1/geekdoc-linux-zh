  md: 'The functions used for printing errors and debug messages can now make use
    of the syslog(2) facility. Message printed to stdout or stderr are prefixed by
    a timestamp also containing the back-end pid:


    ```

    #timestamp #pid #message

    980127.17:52:14.173 [2271] StartTransactionCommand

    980127.17:52:14.174 [2271] ProcessUtility: drop table t;

    980127.17:52:14.186 [2971] SIIncNumEntries: table is 70% full

    980127.17:52:14.186 [2986] Async_NotifyHandler

    980127.17:52:14.186 [2986] Waking up sleeping backend process

    980127.19:52:14.292 [2986] Async_NotifyFrontEnd done

    980127.19:52:14.466 [2986] Async_NotifyHandler done

    ```


    This improves readability of the logs and allows people to understand exactly
    which back-end is doing what and at which time. It also makes easier to write
    simple awk or perl scripts, which monitor the log to detect database errors or
    problem, or to compute transaction time statistics.


    Messages printed to syslog use the log facility LOG_LOCAL0. The use of syslog
    can be controlled with the syslog pg_option. Unfortunately many functions directly
    calls printf() to print their messages to stdout or stderr, and this output can
    be redirected to syslog or have timestamps in it. It is advisable that all calls
    to printf use PRINT macro and output be changed to EPRINTF instead that we can
    control all output in a uniform way.


    The format of the pg_options file is as follows:


    ```

    # comment # set value for option

    option=integer_value # set option = 1

    option # set option = 1

    option+ # set option = 1

    option- # set option = 0

    ```'
