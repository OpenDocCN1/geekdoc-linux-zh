- img_proc: true
  md: '2. 2. Ensure that the remote DB2 server''s TCP/IP address be resolved. If you
    are planning to specify the IP address of the remote DB2 server directly, or you
    have a name server on your network, you can skip this step. You can verify this
    by pinging your DB2 server using the ping hostname command.


    The DB2 client must be able to resolve the address of the DB2 server to which
    it is attempting to establish communications. If a name server does not exist
    on your network, you must directly specify a hostname that maps to the IP address
    of the server in the local /etc/hosts file.


    TIPIf you are planning on supporting any UNIX-based DB2 client that is using Network
    Information Services (NIS), and you are not using a name server on your network,
    you must update the /etc/hosts file located on your NIS master server.


    As a user with root authority, edit the client''s local /etc/hosts file and add
    an entry for the DB2 server''s hostname. For example:


    ```

    92.1.125.124        db2server # host address for the computer db2server

    ```


    where:


    +   - 92.1.125.124 is the IP address of the remote DB2 server


    +   - db2server is the hostname of the remote DB2 server


    +   - # denotes the start of a comment describing this entry


    TIPIf the server is not in the same domain as the client, you must provide a fully
    qualified domain name such as db2server.vnet.com, where vnet.com is the domain
    name.


    +   3. 3. Update the local /etc/services file. If you are planning to set up communications
    between a DB2 client and a DB2 server using only the port number of the remote
    DB2 server, you can skip this step.


    Using a text editor, as a user with root authority, add an arbitrary Service Name
    and the port number that matches the remote DB2 server''s port number to the DB2
    client''s services file for TCP/IP support. For example:


    ```

    db2cdb2inst1 50000/tcp # DB2 client service name & matching DB2 server port

    ```


    where:


    +   - db2cdb2inst1 is an arbitrary local name that represents the port number
    on the DB2 client.'
