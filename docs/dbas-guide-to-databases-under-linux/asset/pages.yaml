    # ## Summary


    Now that youve IDS for Linux, what can you do with it? Well, for starters you
    can connect just any ODBC-compliant user interface to the server, and begin immediately
    to develop and/connect applications to the database engine. You can create and
    /connect Web applications and clients directly to the engine with either ODBC,
    JDBC, and I-connect network connections. The range of applications is limited
    only by your imagination.

    Informix IDS 7.3x is a very powerful SQL database engine, with everything you
    need for an enterprise-level database server. This server is capable of being
    highly reliable and robust for a variety of data storage and retrieval operations
    involving low- and high-volume access rates. Some of the fastest database servers
    in today are Informix database servers on UNIX. Informix has outperformed competitive
    servers from other vendors and continues to lead the pack. The Linux version of
    IDS is no different internally than the other UNIX platforms; the only limitation
    you will face is the current Linux kernel and your hardware platform.

    IDS 7.3 can scale from 1 to N users, the only limitation is, of course, your hardware.
    You can learn the UNIX version in the Linux version, with the exception being
    the high-performance loader, and raw disks, not available as of this writing,
    IDS is compatible to a certain degree with the Standard Engine, but only in its
    core features. The Standard Engine has fewer limitations and fewer data types
    than the shared memory engine in IDS. Standard Engine is a passive, isam-based
    engine. SE is highly reliable, but not as capable as some of the advanced features
    of the IDS engine. You will find SE compared to IDS the same as you could compare
    propeller-driven airplanes to jets with their jet engines. Both are valid flight
    machines, and each have their appropriate uses.

    The total installation time can be as fast as two hours, if you have prepared
    your environment, or longer depending on what you didn’t prepare for. It is extremely
    important for you to read the Administrator’s Guide, to become familiar with the
    various settings and'
