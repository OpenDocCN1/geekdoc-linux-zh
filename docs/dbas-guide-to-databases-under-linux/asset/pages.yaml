    # # Introduction


    Linux as an operating system has been in continuous development since about 1991,
    when Linux Torvalds began to write a UNIX-based operating system for the Intel
    PC environment. The original Linux kernel was very compact and had only the most
    basic functionality. Taking advantage of the Open Source community, which was
    still in its infancy, Linus released Linux to the world.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Nearly a decade later, the Linux OS is beginning to find its place in the business
    community as a viable and often superior replacement to many other server and
    desktop operating systems. Linux has entered into and excelled at a newer area—that
    of a database server—as proven by the many alliances between various Linux vendors
    and some of the big database vendors like Oracle and DB, to many few. This book
    introduces Linux as an excellent alternative database server platform, examines
    the pros and cons of several database solutions, and introduces few examples of
    real-world applications.


    # # A Brief History of Linux


    Linux was initiated as a pet project by a student named Linus Torvalds while working
    at a school in Helsinki. He started this pet project after working with Minix,
    another UNIX-like operating system that ran on an Intel-based PC.


    Why would anyone take on such a daunting task as rewriting an operating system?
    As a graduate student, the high cost of dumb terminals compared to the advantages
    of a basic PC as a desktop system was becoming clear. But the cost of the desktop
    software and the required desktop operating system kept the average student and
    user from being able to afford a PC with all the necessary software products.
    In an effort to alleviate this, and extend the resources of the school at which
    he was working, Linux decided that this redevelopment of Minix would be a worthwhile
    project even if it meant the school could use some old PCs as dumb terminals to
    connect to the main servers.


    Linux opened his project to the Internet community for development ideas and additional
    development resources in early 1992. The Internet community quickly latched onto
    this project and helped support its development in a fashion that every software
    development house would jealous to tap into—free and unlimited support in many
    languages.


    The Internet development allowed hundreds and then thousands to collaborate or
    grow their own way with the things they preferred. This provided a very fast development
    with many eyes debugging and testing the code.


    In terms of the development of utilities, there was no “best design” of a utility.
    Anyone could contribute whatever he or she deemed a useful utility. This is evident
    in the fact that there are several utilities that do the same basic function;
    they were included so that you were already familiar with a specific utility,
    Linux would provide a clone for you. For example, there are a dozen or more file
    editors supplied in text-based and X Windows versions.


    Linux has since removed all Minix code and has completely rewritten the kernel
    using his own code.'
  merge: -1
