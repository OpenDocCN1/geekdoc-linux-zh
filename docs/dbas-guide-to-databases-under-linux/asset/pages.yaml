    to change the server''s internal data structures from inside of trusted functions.
    Hence, among many other things, such functions can circumvent any system access
    controls. This is an inherent problem with user-defined C functions.


    # Rules


    Like SQL functions, rules always run with the identity and permissions of the
    user who invoked the back-end server.


    # Caveats


    There are no plans to explicitly support encrypted data inside of Postgres (though
    there is nothing to prevent users from encrypting data within user-defined functions).
    There are no plans to explicitly support encrypted network connections either,
    pending a total rewrite of the front-end/back-end protocol. Usernames, group names,
    and associated system identifiers (e.g., the contents of pg_user.usersysid are
    assumed to be unique throughout a database. Unpredictable results may occur if
    they are not.


