    # Privileges


    MySQL allows different users to perform different actions on, and with, the database
    based on their privileges. These privileges are stored in a table and checked
    when the user tries to execute an action. The following privileges are set up
    in MySQL:


    +   **select.** Reads from a row in a table.

    **insert.** Creates a row in a table.

    **update.** Updates a row in a table.

    **delete.** Removes a row in a table.

    **index.** Adds/removes indexes on all table.

    **alter.** Allows ALTER TABLE **sql** command.

    **create.** Creates a database/table.

    **drop.** Removes a database/table.

    **grant.** Gives users privileges.

    **file.** Reads and writes external files to the database.

    **reload.** Reloads or flushes tables.

    **shutdown.** Shuts down the database properly.

    **process.** Displays or removes processes.


    These privileges will determine what actions you can perform on the database.
    Not all users should be able to do the more powerful features, such as grant,
    alter, file, process, and shutdown privileges. Those should be reserved for the
    administrator.'
