    \ $LOGS # This won't happen unless the\n# shutdown is clean...\n```\n\n# Backup\n\
    \nThere are two basic approaches to backing up a Progress database. You can use\
    \ the Progress-supplied PROBKUP program, an external backup routine like tar or\
    \ cpio, or a commercial product. The only way to back up an online database correctly\
    \ is with PROBKUP. An external backup cannot correctly back up a running Progress\
    \ database except by shutting it down first. One excellent method of backing up\
    \ a Progress database is to combine the two methods by backing up to disk using\
    \ PROBKUP and then using an external backup command to copy the disk files to\
    \ tape. Providing that you have enough disk space configured there are several\
    \ major advantages to this approach:\n\n+   - Less down time—a backup to disk\
    \ is much faster than a backup to tape\n- Recovery time—in many recovery scenarios,\
    \ having the backup files on disk saves time tapes from offsite locations in addition\
    \ to the improved speed of restoring from disk rather than tape\n- An extra layer\
    \ of protection—you can never have too many backups J\n- The ability to easily\
    \ combine nondatabase elements of the application onto a single tape"
