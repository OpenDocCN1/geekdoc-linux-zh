    # Default Values


    # Logical Log Configuration


    | LOGFILES | 26 | # Number of logical log files |

    | LOGSIZE | 500 | # Logical log size (Kbytes) |


    # New Values


    # Logical Log Configuration


    | LOGFILES | 26 | # Number of logical log files |

    | LOGSIZE | 1024 | # Logical log size (Kbytes) |


    In our case we set it to 1024, which is basically 1MB in size. See the *Administrator’s
    Guide* for details on what your system’s logical log size should be.


    # Memory Usage


    The default size of 8MB is pretty conservative. It''s probably a good idea to
    increase this—you should try different increments to see what works best for you:


    # Default Size


    | SHMVIRTSIZE | 8000 | # initial virtual shared memory segment |


    # New Size


    | SHMVIRTSIZE | 24000 | # initial virtual shared memory segment |


    > **NOTE** You can leave this alone, test all the other settings first, and then
    enlarge memory usage last. In our examples at the end of this section, the output
    from restarting the engine will show this instead of changing it. Change memory
    usage last in case it gives you problems.


    # LRU Settings


    Please see your *Administrator’s Guide* and other Informix documentation for the
    reasoning behind these new settings. Remember, the focus here is on installation,
    so I’m giving you a few settings for now that will help your performance—the rest
    is up to you to learn why.


    # Default Values


    | LRUS | 8 | # Number of LRU queues |

    | LRU_MAX_DIRTY | 60 | # LRU percent dirty begin cleaning limit |

    | LRU_MIN_DIRTY | 20 | # LRU percent dirty end cleaning limit |'
