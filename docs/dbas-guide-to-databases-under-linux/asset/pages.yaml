    \ is the painful part of your installation activities.\n\nThe second step, installation\
    \ branding, is the final step towards the software operational once the final\
    \ resting-place has been determined for the software. This step has changed little\
    \ in its original form, except in the Windows world, where Install Shield has\
    \ taken the place of the UNIX installation.\n\nInformix has traditionally distributed\
    \ their software under this three-step method, the distribution media usually\
    \ being a CD with a tar file, or files, and in many cases, a CD with a CIO file\
    \ . There are, of course, exceptions and other formats. In recent months, some\
