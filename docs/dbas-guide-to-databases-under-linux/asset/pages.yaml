    # Configuring a DB2 Client to Communicate with a DB2 Server


    This section describes how to configure a DB2 client to communicate with a DB2
    server using the command line processor. This section also assumes that TCP/IP
    is functional on the server and workstations was functional before you installed
    your DB2 server or DB2 client.


    Before a DB2 client can be configured to communicate with a DB2 server, the DB2
    server must have been configured to accept inbound client requests. By default,
    the DB2 Installer will autconfigure your DB2 server for TCP/IP communications.
    If you did not use the DB2 Installer to install your DB2 server, you would have
    to configure inbound client communications manually using the command line processor.
    For information on how to configure your DB2 server manually for inbound client
    communications, refer to the *DB2 Connect Installation and Configuration Supplement*.


    > **TIP** Due to the characteristics of the TCP/IP protocol, TCP/IP may not be
    immediately notified of the failure of another workstation. As a result, a DB2
    client application'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'accessing a remote DB2 server using TCP/IP, or the corresponding agent at the
    server, may sometimes appear to be hung. DB2 uses the TCP/IP SO_KEEPALIVE socket
    option to detect when there has been a failure and the TCP/IP connection has been
    broken. If you are experiencing problems with your TCP/IP connection, refer to
    the *DB2 Troubleshooting Guide* for information on how to adjust this parameter,
    and for information about other common TCP/IP problems.


    To configure a DB2 client to communicate with a DB2 server using TCP/IP, perform
    the following steps.


    +   1. 1. Identify and record the required TCP/IP parameters. These parameters
    are presented in Table 7.1.


    | Parameter | Description | Sample Value | Your Value |

    | --- | --- | --- | --- |

    | **Hostname (hostname) or IP address (ip_address)** | Use the hostname or IP
    address of the remote DB2 server.<br><br>To resolve this parameter:<br><br>- Enter
    the **hostname** command at the DB2 server to obtain the hostname.<br><br>- Enter
    the **ping hostname** command to obtain the IP address, or contact your system
    administrator. | db2server<br>or<br>9.21.125.124 | |

    | **Service Name (svcename) or Port number/Protocol (port_number/tcp)** | Values
    required in the **/etc/services** file.<br><br>The Service Name is an arbitrary
    local name that represents the connection port number on a DB2 client. The port
    number for a DB2 client must be the same as the port number that the svename maps
    to in the **/etc/services** file on the DB2 server. (The svcename | db2cdb2inst1[1]
    maps to the port 50000/tcp | |'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'parameter is defined in the database manager configuration file on the DB2
    server.) This port number must not be in use by any other applications, and must
    be unique within the /etc/services file.


    To determine the **svcename** parameter, log on to the DB2 server as a user with
    SYSADM authority and enter the **db2 get dbm cfg** command.


    The default **svcename** parameter for a default DB2 server installation is **db2cd2inst1**,
    which maps to the default port number **50000**.


    If you are following the instructions in this Chapter, you can use these default
    values.


    Node name (node_name)


    A local nickname for the remote DB2 server to which you are trying to connect.
    A computer is often referred to as a node. You can choose any name you want; however,
    all node name values within your local node directory must be unique. I recommend
    that you use the hostname of the remote DB2 server so that you always know to
    which workstation this is referring.


    db2server


    # **Table 7.1 Required TCP/IP parameters for DB2 client-to-server communications.**'
  merge: -1
