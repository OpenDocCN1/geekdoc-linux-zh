    Your system is operational, and suitable for use by your end-users! When you create
    a database, create it in the dbs_dbspace. When you create a table, create it in
    datadbs01. When you create an index, create it in indexdbs01. Complete instructions
    on how to do this are in the Informatics documentation, using standard SQL and
    SQL commands specific to Informatics engines. The set up that I''ve shown here
    can allow you the best flexibility, and room for growth.


    # Other Tools


    The following are a few of the tools that come with the Informatics database engine.


    **onlog**. A logical browser that allows you to view the contents of your logical
    logs. You simply run **onlogs**, and the display will show you the contents of
    the logical logs.


    **dbschema**. A report-writer for the DBA, allowing you to produce SQL statements
    that can be used to create databases and tables.


    **dbtexport /dbimport /dbload**. Tools that allow you to back up your database
    completely in one convenient file, and can be used to restore a database with
    very little work.


    **finderr**. A program that produces detailed documentation about an Informatics
    error message. You run **finder** with an error number you provide it, and it
    produces a small page of information about the nature of the problem.


    **SMI Tables**. You should become familiar with the sysmaster database located
    in the rootd dbspace. It contains a wealth of information about your engine. For
    example, you can produce reports about disk usage that are a little easier to
    read.


