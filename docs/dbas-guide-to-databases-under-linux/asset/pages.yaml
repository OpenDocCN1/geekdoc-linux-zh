    # System Layout


    The PostgreSQL file layout in Figure 9.1 shows how the Postgres distribution is
    laid out when installed in the default way. If you installed the PostgreSQL RPM,
    then the **pgql** directory will be in **/var/lib/postgresql**, and the **doc**
    directory will be in **/usr/doc/postgresql-x-x-x**, where **x-x-x** is the version
    number of PostgreSQL. Therefore, you should add this to your command path. If
    you use a variant of the Berkeley C shell, such as **csh** or **tcsh**, you would
    add


    ```

    set path = ( /usr/local/postgresql/bin path )

    ```


    in the .login file in your home directory. If you use a variant of the Bourne
    shell, such as **sh**, **ksh**, or **bash**, then you would add


    ```

    PATH=/usr/local/postgresql/bin:$PATH

    export PATH

    ```


    in the .profile** file in your home directory. From now on, we will assume that
    you have added the Postgres bin directory to your path. In addition, we will make
    frequent reference to "setting a shell variable" or "setting an environment variable"
    throughout this document. If you did not fully understand the last paragraph on
    modifying your search path, you should consult the UNIX manual pages that describe
    your shell before going any further.'
