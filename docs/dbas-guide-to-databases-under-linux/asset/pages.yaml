    **Q:** How do I set up a pg_group?


    **A:** Currently, there is no easy interface to set up user groups. You have to
    explicitly insert/update the pg_group table. For example:


    ```

    jolly=> insert into pg_group (groname, grosysid, grolist)

    jolly=> values (''posthackers'', ''1234'', ''{5443, 8261}'');

    INSERT 548224

    jolly=> grant insert on foo to group posthackers;

    CHANGE

    jolly=>

    ```


    The fields in **pg_group** are:


    **groname**: the group name. This should be purely alphanumeric—do not include
    underscores or other punctuation.


    **grosysid**: the group id. This is an int4, and should be unique for each group.


    **grolist**: the list of **pg_user** IDs that belong to the group. This is an
