  md: 'know Progress supports Linux as a host-based character client. But can I program
    under X Windows as well?


    A: Yes, but only with the older version 7 of Progress that is not a native port
    to Linux (in other words, the SCO binaries using the IBC emulation). At the time
    version 8 was under construction, the marketing team reviewed the number of licenses
    sold to UNIX GUI environments and found the numbers to be small. A marketing decision
    was made to freeze the X Windows at the Progress V7 level. This was also at a
    time when X Windows meant special X-Terminal hardware, or expensive third-party
    PC emulation of X Windows. Linux popularity was not what it is today, and X Windows
    capable computers have grown accordingly since then. By means call your Progress
    Sales Rep, and express interest in supporting X for X Windows.


    Q: I heard that after-imaging is a performance drain. Do I really need it? After
    all, I back up the database anyway.


    A: After-imaging will save you. Running after-imaging allows you to restore a
    database right up to the minute before the crash. Even if you back up your system
    on a nightly basis, you run the risk of crashing at the end of the day. Your entire
    days-worth of work is gone if you are not running after-imaging. Always ask the
    question, “Can I afford to lose data from the time the last backup was done?”
    Few 24x7 and other mission-critical systems will make the data loss is acceptable.


    Q: The Progress documentation says I can administer the database through the Dictionary
    even though I have only runtime clients. How can I get to the Dictionary?


    A: The Dictionary code is supplied as encrypted source. Simply start your Progress
    session with the -rx parameter for encrypted source mode.


    Q: When I start my Progress session it says “This Version Of Progress Requires
    A Startup Procedure.” What’s wrong?


    A: There are several possibilities. This occurs when you have started a Progress
    session and attempted to get to the Procedure Editor. The Client/Networking product
    is meant to run only compiled code or encrypted source. You will not be able to
    compile programs with this Progress client; you need Query/Runtime or the 4GL
    client. If you purchased one of these products and the message still appears,
    check the DLC and PROCFG variables for errors. Progress looks at the progress.cfg
    file to determine which products are installed, and if it cannot find this file
    it assumes you do not have the proper licenses. A corrupted progress.cfg file
    will also cause this, and so will the startup parameter -rr.'
