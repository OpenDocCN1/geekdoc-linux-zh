    # Installation


    Before installing MySQL, you must first decide on one of three versions. The recommended
    one is the stable version, labeled 3.22.X. This version is very well tested, does
    not have any untested features, is ready for production, and is recommended for
    first-time users. The development version, 3.23.X, is targeted towards developers
    contributing to the improvement of MySQL, and has many untested new features.
    This version is not recommended in a production environment. The last version,
    3.21.X, is a deprecated version. This mainly provides a way for previous users
    to upgrade to this version without any major changes in functionality. This is
    also more of a historical version and not intended to be used. After choosing
    the version, a decision between binary, RPM, and source distributions must be
    made. A binary distribution is already compiled for. All you need to do is install
    it and decide on the location of the files. The drawback is you must find the
    appropriate binary for your platform.

    Not all platforms are kept up to date for each version. The RPM distribution is
    for those with RedHat Linux distribution. It is similar to a binary that is already
    compiled and even sets up the system environment for you. The last option is the
    source distribution. This distribution allows the most customization, comes with'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'more documentation and examples, and can be optimized for speed. Binaries may
    require root privileges, RPM distributions must be installed as the root user.
    Both binaries and RPMs are platform-specific. The source distribution is highly
    customizable, not platform-specific, can be run by any user, and is recommended
    over the other two distributions for these reasons.


    For the next part of the installation, you need to locate a MySQL distribution.
    It is best to get the distribution from a mirror, a site that copies the latest
    files from the official site to its own location. You can find a mirror site that
    is close to you, which will probably decrease your download time depending on
    how close the mirror site is. Mirrors also help drive traffic away from the official
    site, helping to preserve bandwidth. The list of mirror sites can be found at
    http://www.mysql.com/mirrors.html.


    Of course you can download the distribution from the official site if you cannot
    find an appropriate mirror site. one. The official location is http://www.mysql.com/download.html.


    # Naming Conventions


    The MySQL distributions are in the Downloads directory. As of this writing, the
    latest development distribution is 3.22.32. The examples that follow show the
    different types of formatting for each one. The X denotes the minor version. For
    binaries, you will see the following:


    ```

    mysql-3.22.X-X-PLATFORM.tar.gz

    ```


    For RPMs:


    +   - MySQL-3.22.X-1.PLATFORM.rpm (the server)

    - MySQL-bench-3.22.X-1.PLATFORM.rpm (tests and benchmarks)

    - MySQL-client-3.22.X-1.PLATFORM.rpm (client)

    - MySQL-devel-3.22.X-1.PLATFORM.rpm (for custom clients)


    For source:


    ```

    mysql-3.22.X.X.tar.gz

    ```


    These are the files you need for each respective distribution.


