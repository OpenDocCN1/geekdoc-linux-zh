- img_proc: true
  md: '26. When the installation started, it created 6 logical logs, so we will add
    20 logical logs for a total of 26. Why? Adding 20 logs is a great exercise, and
    will give you a good idea of how the engine works. It is a good idea to have many
    small logical logs; the guidelines are covered in the *Administrator’s Guide*.


    To move the logs out of rootdb you must have new logs in place already available
    for use by the engine, which will take the place of the existing logical logs.
    The bare minimum of logical logs is 3, so in order to do this we have to tell
    the engine which logs are the good ones, and which can be deleted. We also cannot
    delete or remove any logical logs that are in use, so we need to tell the engine
    to use the new ones so the old ones can be removed.


    # Create logdsbs


    Make sure you have created the new logdsbs dbspace with **onspaces** command we
    discussed at the beginning of this section, and then proceed. Make sure the engine
    is in single-user mode by running the **onmode -sy** command:


    ```

    rebel:root # onmode -sy

    ```


