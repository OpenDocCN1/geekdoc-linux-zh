    ln -s /usr/local/oracle/u02 /u02

    ln -s /usr/local/oracle/u03 /u03

    ln -s /usr/local/oracle/u04 /u04

    ```


    # Four Disks


    A four-disk configuration provides significant data protection and a modest performance
    increase over a single-disk configuration. Create a partition on each physical
    device to store Oracle data. Assign a partition to each Oracle directory, /u01,
    /u02, /u03, and /u04. If you have already installed Linux and want to add three
    disks to your system for Oracle, use Druid or fdisk to partition the disks, and
    use mkfs to format each partition. Create the /u01, /u02, /u03 and /u04 directories
    under the root / file system and use the mount command to manage the partitions
    to the file system.


    # Configure Swap Space


    Swap space should be three times the amount of RAM. RedHat Linux 6.0 and the Linux
    kernel 2.2 now support swap partitions larger than 128MB. To create swap partitions
    or swap files larger than 128MB, you must specify the new style, mkswap-v1. If
    you do not have extra disk space to add a swap partition, you can add a swap file.


    # Kernel Parameters


    The Installation Guide for LINUX recommends changing kernel parameters, which
    requires the kernel to be recompiled. It is usually not necessary to modify these
    parameters. The most important parameter is SHMMAX, which defines the maximum
    size of a shared memory segment. The default setting is 32MB on RedHat Linux,
    which is generally sufficient for a database installation. If the SGA is set to
    128MB, it would require four segments of 32MB each. The kernel parameters are
    more of an issue on a server with a large SGA. In a production environment, SHMMAX
    should be configured to the same size as files are located at /usr/src/linux/include/asm/shmparam.h
    and /usr/src/linux/include/linux/sem.h.


    > TIP You can view the SHMMAX parameter with the following command as root: cat
    /proc/sys/kernel/shmmax.'
