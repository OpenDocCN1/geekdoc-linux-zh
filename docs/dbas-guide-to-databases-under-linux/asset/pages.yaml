  md: 'Figure 2.5 Installation type.


    # Choosing an Installation Type


    The Installation Type, as shown in Figure 2.5, is *very important*. This is when
    you are asked to make a big decision about how to install your Linux. For RedHat,
    you have three basic options: Server, Custom, or the two versions of Workstation,
    either with Gnome or KDE desktops. A fourth option, Upgrade, is chosen only if
    you already have a previous version of the same Linux version on this machine.
    You cannot upgrade any other version of Linux except a previous version of the
    same Linux; in this case, you could upgrade only an earlier version of RedHat
    Linux.


    # A Workstation Installation


    The workstation options actually may be sufficient mainly for your clients or
    your test machine; they are not recommended for a real server. They will install
    a base Linux for you with an X Window interface of either Gnome or KDE. They are
    predefined to partition available disk space into three partitions and to install
    basically into the biggest partition of the three. If you were to add disks after,
    you technically could use this choice. If you had lots of disk space, you could
    create a development machine with this and install your database into this one
    partition or onto another disk, your choice. By default, if there were another
    OS on this machine, it would be retained'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'automatically and offered as an optional bootup choice (albeit displayed, you
    just have to know it there). This is not the recommended installation type for
    your server.


    # A Server Installation


    The server installation is another possible choice, as it does a much better job
    of partitioning the disk into a more desirable management-oriented design. It
    also installs a lot of software and does not install the X Window system by default.
    This installation also removes all previous operating system partitions of any
    type, creates six partitions with minimal sizes for most, and then installs all
    server packages and few of the user packages. For ease of getting started with
    a Linux-based server offering all the network services ready to go, this is the
    easiest option for a new machine. Make sure you have lots of extra space for your
    database application and its data.


    # The Upgrade Installation


    This is obviously intended for a system that already contains a previous version
    of RedHat. This is not applicable to any other version of Linux. Upgrades only
    replace the currently installed software sets with the newer versions plus any
    new dependency related software sets.


    # A Custom Installation


    This is the best choice for someone who knows exactly what he or she wants. You
    can implement a specific design for your disks—what size partitions on what disks,
    then define the directory location for each of these partitions in your file system—and
    finally, you can decide on the software sets you want to install.


    # Custom (Manual) Installation


    The remaining steps assume you are following a custom installation procedure,
    and take you through each of the basic steps with helpful hints and suggestions.
    This is the recommended installation method for a database server, so that you
    can select the additional services you need. It is highly recommended not to include
    any other services on your database server. Of course, if you have no other server
    for them, or if this will not be a heavily burdened server, then you can add them
    during this installation process easily and quickly.


    # Creating the Partitions to Your Specifications


    The next step provides a graphical disk partition and assignment tool called Druid.
    Unfortunately, this tool is available only during installation. When the system
    is running, you can use the fdisk utility to perform partition changes, but not
    the partition to directory assignments.


    > Warning: As a database server, the separation of the disk into distinct partitions
    will provide for better overall management later on. You are encouraged to keep
    the system files and database files on separate partitions.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# IT Professionals Knowledge Point


    Technically, you can use FAT16 and FAT32 formatted drives with Linux, but this
    would be a poor choice for a database server. The optimal type of file system
    is the Linux Native for all data drives. You also need disk space allocated to
    swap drives. You can have a maximum of 4GB of swap space spread across eight partitions
    with any one not to exceed 2GB in size. The recommendation is to use two to three
    times your RAM size as swap. This is a good rule of thumb until you get into the
    gigabytes of RAM. You are unlikely to swap at this point and even likely to swap
    at any 2GB of RAM. There are exceptions, for example, if you really have single
    processes configured like big resident database files, then you will need the
    large amount of swap. If you are more designed toward smaller transaction oriented
    processes, then you can have less total swap space. Remember, if you have big
    processes in memory, disk is cheap, use it for swap. At this point, stick to two
    to three times the RAM until you can do system analysis.


    # Multiple Swap Partitions


    Swap is where the system puts memory-resident process sets when RAM becomes full.
    You need it for the system to work properly but you really do not want the system
    to use it because it is incredibly slow compared to RAM. It is there for emergencies
    when your RAM is overwhelmed, and it is for fine for occasional use. Steady use
    is a clear indication that you do not have enough RAM. Upgrade immediately if
    you detect or extensive use of swap space. Any disk activity is improved by spreading
    the requests over multiple disks or controllers, the same goes for swap space—spread
    it to improve performance and spread the load out to all disks evenly.


    # Delete a Partition


    You would do this if you were starting with a machine that may already have had
    an operating system on. If you want to start fresh, that is, you do not need to
    keep this OS, then delete every partition you see. If you want to keep the old
    OS and add Linux to some free space or reuse a disk partition that is free to
    use, you should delete the old partition first.

    You can delete any currently existing partition on any disk at point Disk Druid.
    Select the partition in the upper box and click on Delete and confirm the action.


    # Edit a Partition


    You can change a partition parameter setting at a later time if desired by using
    the Edit option.


    # Add a Partition—


    Click on the Add button to add a new partition. You will need to do this for each
    partition you want to set up. If there is more than one physical disk, you should
    select the specific disk in the lower box first.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Partition Mount Point


    When you click on Add, you are presented with a parameter setting screen. There
    are four parameters to set. The first parameter is the mount point. Unlike DOS-based
    systems that define a drive letter for each partition (currently, this is changing
    in Win2k), in UNIX and Linux, there is one file system that uses directory names
    to connect them together. These directories are called mount points. UNIX has
    had some historical mount points that Linux has continued with. You can either
    enter a directory name of your choice or pick from one of the preconfigured directory
    names in the drop-down list. Figure 2.6 shows the preconfigured mount point options
    available. This is not a limitation, just a beginning point.


    ![](img/a6b8fd6f7dfea65f9a1b7e4c40482932_56_0.png)


    **Figure 2.6 Mount point options in Disk Druid.**


    # Size of Partition


    The second parameter to decide on is the size. You should enter the approximate
    value you want the partition to be in megabytes. Note that the actual size will
    depend on physical drive characteristics (must use full cylinder counts) and not
    on your actual value. Do not worry about the exact size—as long as it is close,
    that is fine.

    The size option also has a radio button that you can use to let the partition
    size “Grow to fill disk.” This option will allow this partition to use all available
    remaining disk space or'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'share equally with any other partitions on the same physical disk, the remaining
    disk space. This is a great option on the last partition created or on multiple
    partitions where you want to share all remaining disk space. This option always
    uses all remaining disk space. You can put any value in the Size parameter box
    if you select this Grow button. Disk Druid will deal with the real size when it
    actually does partitioning after you have finished configuring all partitions
    (this is all done in memory; nothing actually will be created until you finish
    with this screen). Figure 2.7 illustrates the Size value field as well as the
    Grow to fill disk radio button.


    **Note:** The X Window system uses colored buttons instead of the Windows checkmark.
    If the button appears dark (appears like it is pushed in), then it is deemed to
    be **on**, or selected. Figure 2.7 illustrates the **off** position, light colored,
    for the Grow to fill disk? option.


    ![](img/a6b8fd6f7dfea65f9a1b7e4c40482932_57_0.png)


    **Figure 2.7 Disk Druid—Partition type selection options.**


    # **Partition Type**


    Other than the swap partitions requiring you to set them as Linux Swap, you will
    **always** pick Linux Native for all other partitions that you create. *Do not
    choose any DOS partitions;* they are not optimized for database files in any way.


    **Warning:** Linux Native is a very fast, optimized for data files, type file
    system. Linux can use (can mount this type of drive using its native driver for
    inclusion in the'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'file system tree DOS, HPFS, NTFS, and other types of partitions, but not in
    an optimized fashion. Avoid them all—you do not need them.


    # Hard Drive Selection


    This option is an issue **only** if you have more than one physical drive to choose
    from. If you have only one drive available, it will be called **hda** (hard disk
    a). This would be the name for the first drive on the IDE type first controller.
    The next drive would be **hdb** and the second would be **hdd**. On each second
    IDE controller, the first drive would be **hdc**. On each of these drives the
    partitions are simply named from 1 to 16. Hence, what the DOS world would refer
    to as **C:** on the first partition, Linux calls **hda1**. The next partition
    primary partitions would be **hda2**, then **hda3**, and **hda4**. However, due
    to the original bizarre partition scheme design, there is one designated Extended-type
    primary partition, and it can be **hda2, hda3**, or **hda4**, depending on how
    many other primary partitions already exist. Within this special Extended-type
    primary partition, you can create up to 12 additional partitions. These 12 partitions
    start as **hda5** and go to **hda16**. So, technically, you can have up to 16
    partitions on any one physical IDE type drive.


    For a SCSI type disk, the moniker is **sda** for the drive; the partitions are
    **sda1** to **sda15** (supports only 11 partitions within the extended drive).


    Figure 2.8 shows what a completed partition table with respective mount points
    look like when you have finished creating and assigning all disk space to various
    partitions.'
