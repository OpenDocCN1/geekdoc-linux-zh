    #  Starting Your Engine with oninit


    If you have followed all the instructions up to now, you are ready to initialize
    your instance of Informix. Initialization is the process whereby the sysmaster
    database is created, and the rootdbs brought online. This will bring the engine
    up, and you will be able to start creating rootdbs and tables.

    You can now run the oninit program to initialize the rootdbs. Keep in mind that
    what we do now is only for the initial installation. After this you will not repeat
    this initialization start-up for everyday operations. The oninit program is the
    same program we use for starting and stopping the engine on a daily basis, but
    without the options for our initial installation. You need to be root for our
    install operation; hereafter, the only login for daily startup will be informix,
    and oninit is used without any options.

    To initialize our engine, the following command is run from any directory:


    ```

    $ oninit -ivy

    ```


    Think of the -ivy command combination as poison ivy! Stay away from the -i option
    except to run this initialization. You want to use it only once—it will cause
    you pain if you use it again on the same instance.


    +   - -i means initialize the instance—do this only once

    - -v means verbose mode

    - -y means answer yes to all prompts'
