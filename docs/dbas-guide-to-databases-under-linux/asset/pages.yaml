    # # Issues


    Depending on your Linux distribution, MySQL might have some problems running.
    MySQL works with the latest version of glibc. This is the C library on which the
    database is based. MySQL requires at least 2.0.7 of glibc. Most problems are related
    to not having the latest version of this library. You can find out which version
    is installed on your system with the following:


    ```

    shell rpm -q glibc

    ```


    If you use a binary distribution instead, you do not have to worry about the library
    version you are using. Older distributions have libc, the predecessor to glibc.
    As long as libc is at least 5.4.46, it will work.

    For RedHot 4.X, there is a problem with resolving hostnames with older glibc.
    This can be fixed by updating to at least libc, 5.4.46.

    For RedHot 5.X, installing the latest glibc should work with the following RPMs:


    ```

    glibc-2.0.7-19

    glibc-devel-2.0.7-19

    ```


    Updating libraries requires root privileges. If you do not have root privileges,
    ask your system administrator to install or upgrade these libraries to the latest
    versions.


    # # Threads


    MySQL also uses threads under Linux. Threads are smaller pieces of a program that
    can allow more work to get done by the machine than with a single process. As
    long the latest glibc is in place, this should work without having to install
    any new programs. This can be downloaded at http://www.mysql.com/Downloads/Linux.'
