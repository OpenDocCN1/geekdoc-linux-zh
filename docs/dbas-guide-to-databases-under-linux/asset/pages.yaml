    # Security


    Restricting user access to the database and only letting them perform certain
    actions will help improve your application. This is an important step that cannot
    be stressed enough. If this database is merely set up for evaluation, this is
    not needed. Any service or application that will use this database to store live
    data should be secured.


    Let’s start by changing the password for the root user in the database. This is
    done as follows:


    ```

    shell /my/path/mysql/bin/mysqladmin -u root password ''new-

    password''

    ```


    Also, make sure that any new users that are created in the database have passwords.
    Another way to set up MySQL to be secure is to run it as its own user. Running
    the daemon as a new user and setting all the file permissions to that user will
    prevent tampering by other users and make it more secure. Also, not running the
    daemon will prevent attempts by crackers to attack the daemon to get root privileges.
    If you installed the RedHat RPM, then this part of the configuration is done for
    you. If you installed the binary or source distribution, you need to complete
    some further steps.


    A user should be created for the database to run as such as mysql. This can be
    added to the password file using adduser.


    ```

    shell $ /usr/sbin/adduser mysql

    ```


    Once an entry has been made in /etc/passwd for this user, it can be edited to
    point to the correct database directory (/my/path/mysql/var) along with the appropriate
    shell (default is fine).

    This user should own all of the files. You can do this with chmod


    ```

    shell$ chmod -R mysql /my/path/mysql

    ```


    You can also make sure that only this new user has write permission:


    ```

    shell$ chmod -R go-w /my/path/mysql

    ```'
