    # # Access Control


    Once you have configured the privileges and the user- and hostnames of where you
    want to access, each connection will be evaluated to determine if it should be
    allowed. MySQL will look at the username and host first. When the connection is
    made, all the parameters are matched against the entries in this list. It will
    keep comparing them from the beginning until the end until the first one is matched.
    If it is not matched, the request is denied. Make sure the list is sorted correctly;
    the database does not match all cases, just the first one it comes to works.


    If the connection is allowed, the database will verify that you have access to
    the database(s) you are trying to access. It will consult the db and host tables
    and match your host with the database you are trying to access. Unlike for the
    previous check, the database will consult the tables based on the type of access
    that is requested.


    Administrative requests check only the user table, because it is the only table
    where administrative privileges are located. If the user has this privilege, the
    action will be granted or otherwise denied. Database-related ones to manipulate
    rows in a table are first checked in the user table. If the user does not have
    these privileges, the database will then go to the db and host tables and verify
    that this request should be granted. If the user is not listed in the db table,
    the request is denied. If the user''s host field is blank, cross-reference it
    with the host table and determine if the access should be granted.


    By setting a simple access control list, you can easily specify which users can
    connect to your database, and from which host. This is extremely powerful. You
    can exclude everyone from outside your domain and allow only people in the local
    network or allow only specific users from specified IP addresses.


