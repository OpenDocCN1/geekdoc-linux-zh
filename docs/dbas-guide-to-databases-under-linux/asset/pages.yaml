  md: 'You can also see all the environment variables with the following:


    ```

    shell$ ./mysqladmin variables

    ```


    To create your first database, use **mysqladmin** to create the database. The
    **-p** option asks for your password:


    ```

    shell$ ./mysqladmin -p create MYDATABASE

    ```


    Once created, it can be removed, or “dropped” with the following:


    ```

    shell$ ./mysqladmin -p drop MYDATABASE

    ```


    To shutdown the database properly, you would also use **mysqladmin**:


    ```

    shell$ ./mysqladmin -p shutdown

    ```


    You can import and export data easily from MySQL using **mysqldump** and **mysqlimport**.
    With these tools you can dump the entire database for re-importing into the database
    later. This is an easy form of backing up all the data in the database.


    Other tools that come with the MySQL distribution are:


    +   - **mysisamchk**: Checks, optimizes, repairs, and describes the MySQL tables.

    - **make_binary_release**: Creates a binary release of MySQL from a compiled version.

    - **mysql2sql**: Converts programs written for **mysql** to MySQL.

    - **mysqlaccess**: Checks access privileges for host, user, and database from
    the database.

    - **mysqladmin**: Provides general administration for MySQL.

    - **mysqlbug**: Files bug reports to MySQL mailing list.

    - **mysqld**: The actual MySQL database daemon.

    - **mysqldump**: Exports a database to a file.

    - **mysqlimport**: Imports a file into the database.

    - **mysqlshow**: Shows the information about databases and tables.

    - **mysql_install_db**: Script used at the beginning of installation to set up
    the initial tables.

    - **replace**: Script to replace strings; used by **mysql2mysql**.

    - **safe_mysqld**: Script that keeps the **mysqld** daemon running, and restarts
    it when it dies.'
