  md: '# Internet Power Drives PostgreSQL


    The Internet, which started as a defense project, became so widespread that it
    connected people living on all continents of the globe. That promoted a rapid
    exchange of information, intelligent ideas, and research topics across the globe.
    The result was that the Internet became the world’s largest “generator” of software.
    The software development methodology changed from closed-source to open-source
    code, and the Internet facilitated such a system. The Internet was used to help
    the operating system Linux, which became immensely popular. With the success of
    Linux, many people decided to carry forward the idea on computer applications
    like database systems, spreadsheets, etc. Instead of starting a system from scratch,
    developers on the Internet took the University of California’s public-domain Postgres
    code and started making changes and enhancements to it, resulting in PostgreSQL.


    The Internet is the real engine that drives PostgreSQL. The laws of physics and
    statistics are also partly responsible for the success of PostgreSQL—favor open
    source code systems like PostgreSQL and Linux. As Internet speed is increasing
    everyday, and the Internet is becoming more and more reliable, the open source
    code system will gain rapid momentum. By applying the principles of statistics,
    mathematics, and science to software quality, you get the best quality of software
    only in an open source code system like PostgreSQL, wherein the source code is
    open to the Internet, the “information superhighway.” The more people working
    on the code, the better will be the quality of software. The open source code
    model also will eliminate duplication of work, be very economical, save time in
    distribution, and follow the modern economic laws of optimizing the national and
    global resources. Once others have produced a software package, you do not need
    to waste your valuable time redoing something already well done.


    You get many features with PostgreSQL since it follows the open source code development
    model. The pace of software development on the Internet is very rapid since an
    extremely vast network of computers and people are involved in the process. Future
    trends indicate that most of the software development will take place on the so-called
    information superhighway, which spans the globe. In the coming years, Internet
    growth will be explosive, which will further fuel adoption of PostgreSQL by the
    industry.


    Since a lot of work has been done on PostgreSQL during the past 15 years, it does
    not make sense to recreate from scratch another database system that'
