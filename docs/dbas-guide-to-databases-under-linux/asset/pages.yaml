    As you can see, rootdbs gained some space. It now has almost 17MB free, more than
    enough to handle the engine, made up of the master database and the systutils
    database, which is used for managing Informix backups.


    From here we have a couple more steps, and your system will be operational.


    # Tempdbs


    Informix engines must have a workspace for sorting queries, and a place to put
    temporary tables. If you do not specify a place for this to, the engine will use
    /tmp, and its own space, called **INFORMMIXTEMP**, usually placed in the /directory.
    This is not good: We need to create tempdbs to allow our system to control where
    tables and sorts will occur.


    Creating this dbspace is a little different. We must tell the engine to use this
    as a temporary tablespace. We add the **-t** option to do this:


    ```

    $ onpaces -c -t -d tempdbs -p /opt/data/tempdbs -o 0 -s 102400


    rebel:root # onpaces -c -t -d tempdbs -p /opt/data/tempdbs -o 0 -s 300000

    Verifying disk space, please wait ...

    rebel:root # ls -l

    total 392018

    drw-xr-x   2 informix informix   1024 Jan 24 17:41

    ```'
