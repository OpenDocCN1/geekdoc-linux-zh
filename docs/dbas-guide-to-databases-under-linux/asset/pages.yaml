  md: '+   - That Has been in development for several years


    +   - That satisfies standards like ISO/ANSI SQL 92 (and SQL 89)


    +   - That can satisfy future needs like SQL 3 (SQL 98)


    +   - That has advanced capabilities


    And it just so happens that PostgreSQL satisfies all these conditions, and is
    the appropriate software for this situation. PostgreSQL might be a very strange
    name, but why change it? This world is stuck with PostgreSQL forever!


    # # FAQs


    **Q:** Why does initdtb fail?

    **A:** Check that you don''t have any of the previous version''s binaries in your
    path. (If you see the message WARN:heap_modifytuple: repl is \ 9, this is the
    problem.) Check to see that you have the proper paths set, and that the postgres
    users owns the proper files.


    **Q:** How do I install PostgreSQL somewhere other than /usr/local/postgresql?

    **A:** The simplest way is to specify the **--prefix** option when configure.
    If you forgot to do that, you can edit **Makefile.global** and change POSTGRESDIR
    accordingly, or create a **Makefile.custom** and define POSTGRESDIR here.


    **Q:** When I start the postmaster, I get a *Bad System Call* or core dumped message.
    Why?

    **A:** It could be a variety of problems, but first check to see that you have
    System V extensions installed on your kernel. PostgreSQL requires kernel support
    for shared memory and semaphores.


    **Q:** When I try to start the postmaster, I get IpcMemoryCreate errors. Why?

    **A:** You either do not have shared memory configured properly in kernel or we'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'you need to enlarge the shared memory available in the kernel. The exact amount
    you need depends on your architecture and how many buffers and back-end processes
    you configure postmaster to run with. For most systems, with default numbers of
    buffers and processes, you need a minimum of ~1MB.


    **Q**: When I try to start the postmaster, I get IpcSemaphoreCreate errors. Why?


    **A**: If the error message is IpcSemaphoreCreate: semget failed (No space left
    on device) then your kernel is not configured with enough semaphores. Postgres
    needs one semaphore per potential back-end process. A temporary solution is to
    start the postmaster with a smaller limit on the number of back-end processes.
    Use -N with a parameter less than the default of 32. A more permanent solution
    is to increase your kernel''s SEMMNS and SEMMNI parameters.


    If the error message is something else, you might not have semaphore support configured
    in your kernel at.


    **Q**: How do I prevent other hosts from accessing my PostgreSQL database?


    **A**: By default, PostgreSQL only allows connections from the local machine using
    UNIX domain sockets. Other machines will not be able to connect unless you add
    the -i flag to the postmaster, and enable host-based authentication by modifying
    the file $PGDATA/pg_hba.conf. This will allow TCP/IP connections.


    **Q**: Why can''t I connect to my database from another machine?


    **A**: The default configuration allows only UNIX domain connections from the
    local machine. To enable TCP/IP connections, make sure the postmaster has been
    started with the -i option, and add an appropriate host entry to the file pgsql/data/pg_hba.conf.
    See the pg_hba.conf manual page.


    **Q**: Why can''t I access the database as the root user?


    **A**: You should not create database users with user id 0 (root). They will be'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'unable to access the database. This is a security precaution because of the
    ability of any user to dynamically link object modules into the database engine.


    Q: All my servers crash under concurrent table access. Why?


    A: This problem can be caused by a kernel that is not configured to support semaphores.


    Q: How do I tune the database engine for better performance?


    A: Certainly, indices can speed up queries. The explain command allows you to
    see how PostgreSQL is interpreting your query, and which indices are being used.


    If you are doing a lot of inserts, doing them in a large batch using the copy
    command. This is much faster than single individual inserts.


    Second, statements not in a begin work/commit transaction block are considered
    to be in their own transaction. Consider performing several statements in a single
    transaction block. This reduces the transaction overhead. Also consider dropping
    and recreating indices when making large data changes.


    There are several tuning things that can be done. You can disable fsync by starting
    the postmaster with a -0 -F option. This will prevent fsync() from flushing to
    disk after every transaction.


    You can also use the postmaster -B option to increase the number of shared memory
    buffers used by the back-end processes. If you make this parameter too high, the
    postmaster may not start because you''ve exceeded your kernel''s limit on shared
    memory space. Each buffer is 8K and the default is 64 buffers.


    You can also use the back-end -S option to increase the maximum amount of memory
    used by each backend process for temporary sorts. The -S value is measured in
    kilobytes, and the default is 512 (i.e., 512K). It is unwise to make this value
    too large, or you may run out of memory when a query invokes several concurrent
    sorts.


    You can also use the cluster command to group data in base tables to'
  merge: -1
  pgno: 348
- img_proc: true
  md: 'match an index. See the cluster(l) manual page for more details.


    **Q:** What debugging features are available in PostgreSQL?


    **A:** PostgreSQL has several features that report status information that can
    be valuable for debugging purposes.


    First, by running configure with the --enable-cassert option, many assert()s monitor
    the progress of the back-end and halt the program when something unexpected occurs.


    Both postmaster and postgres have several debug options. First, whenever you start
    the postmaster, make sure you send the standard output and error to a log file:


    ```

    cd /usr/local/postgresql

    ./bin/postmaster >server.log 2>&1

    ```


    This will put a server.log file in the top-level PostgreSQL directory. This file
    contains useful information about problems or errors encountered by the server.
    Postmaster has a -d option that allows even more detailed information to be reported.
    The -d option takes a number that specifies the debug level. Be warned that high
    debug level values generate large log files.


    You can actually run the postgres back-end from the command line, and type your
    SQL statement directly. This is recommended only for debugging purposes. Note
    that a newline terminates the query, not a semicolon. If you have compiled with
    debugging symbols, you can use a debugger to see what is happening. Because the
    back-end was not started from the postmaster, it is not running in an identical
    environment and locking/back-interaction problems may not be duplicated. Some
    operating systems can attach to a running back-end directly to diagnose problems.


    The postgres program has -s, -A, and -t options that can be very useful for debugging
    and performance measurements.


    You can also compile with profiling to see what functions are taking execution
    time. The back-end profile files will be deposited in the'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'pgsql/data/base/dbname directory. The client profile file will be put in

    the current directory.


    Q: I get Sorry, too many clients when trying to connect. Why?


    A: You need to increase the postmaster''s limit on how many concurrent

    back-end processes it can start.


    In Postgres 6.5.*, the default limit is 32 processes. You can increase it by

    restarting the postmaster with a suitable -N value. With the default

    configuration you can set -N as large as 1024; if you need more, increase

    MAXBACKENDS in include/config.h and rebuild. You can set the

    default value of -N at configuration time, if you like, using configure''-

    with-maxbackends switch.


    Note that if you make -N larger than 32, you should consider increasing -B

    beyond its default of 64. For large numbers of back-end processes, you are

    also likely to find that you need to increase various UNIX

    configuration parameters. Things to check the maximum size of

    shared memory blocks, SHMMAX; the maximum number of semaphores,

    SEMMNS and SEMMNI; the maximum number of processes, NPROC;

    the maximum number of open open files, NFILE and NINODE. The reason that

    Postgres has a limit on the number of allowed back-end processes is so that

    you ensure that your system won''t run out of resources.


    In Postgres versions prior to 6.5, the maximum number of back-ends was

    64, and changing it required a rebuild after altering the MaxBackendId

    constant in include/storage/sinvaladt.h.


    Q: What are the pg_tempNNN.NN files in my database directory?


    A: They are temporary files generated by the query executor. For example,

    if a sort needs to be done to satisfy an ORDER BY, and the sort requires

    more space than the back-end''s -S parameter allows, then temp files are

    created to hold the extra data.


    The temp files should go away automatically, but might not if a back-end

    crashes during a sort. If you have no transactions running at the time, it is'
