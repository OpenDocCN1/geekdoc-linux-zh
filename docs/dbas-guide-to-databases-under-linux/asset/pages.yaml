- img_proc: true
  md: '# Troubleshooting


    In case of the MySQL database server, there is a log file in the data directory
    with a .err extension. This file will most likely contain logging information
    when errors occur. If there is no information regarding why it crashed, you may
    also want to enable the -log run time option for mysql. This will also add extra
    logging information about what the database is doing. There is also a -debug option
    to add more logging information.


    A few items to note:


    +   - Make sure you have the latest version in your distribution for the database.


    +   - Make sure you have the latest glibc or libc (depending on your distribution).


    +   - Check user permissions on all of the files that the database user owns.


    +   - Check the status of mysqladmin to make sure the load times do not look abnormal.


    +   - If you have problems connecting make sure that your access control is set
    up correctly for the user, password, and hostname; and that the server is actually
    running (can be checked with the ps command).


    +   - Make sure no other program took the same port that MySQL runs on.


    +   - If a thread has died, you must kill all other threads before starting the
    database again.


    +   - Try connecting locally and remotely. If remotely fails, check to make sure
    the networking options are on. If locally fails, make sure UNIX sockets are turned
    on.


    +   - Make sure there are enough connections for all of your clients.


    +   - Make sure there is plenty of memory for the database. Very large databases
    tend to use up resources quickly.'
  merge: -1
