    +   4.4. Catalog a TCP/IP node. You must add an entry to the DB2 client''s directory
    to describe the remote DB2 server. This entry specifies the chosen nickname (node_name),
    the hostname or IP address, and the svename or port number that the DB2 client
    will use to access the remote DB2 server.


    To catalog a TCP/IP node, perform the following steps:


    +   a. Log on to the system as a user with SYSADM authority. For our example,
    you can use the instance owner ID db2inst1.


    TIP If you use this su to log on to the system, you must enter this command with
    the parameter; for example, su – db2inst1. If you do not use this parameter, you
    will receive an error, because DB2 will not read the DB2 profile correctly.


    +   b. Catalog the TCP/IP node by entering the following commands with any variation
    of the parameters within the square brackets:


    ```

    catalog tcpip node node_name remote [hostname or ip_address]

    server [svename or port_number]

