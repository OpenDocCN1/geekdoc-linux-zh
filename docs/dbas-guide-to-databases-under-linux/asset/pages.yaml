    password for this user must be set immediately after installation. If not, anyone
    can connect and have full access to the database. You must also set up a user
    on the system to run the MySQL daemon. You should not run this daemon as root
    or you will open yourself up to crackers who exploit the daemon to get root privileges.
    Once this user is created, the files and permissions should be set so only that
    user has access to the files and can write to them.


    With MySQL there are many types of privileges that determine what a user can do
    with the database. There are more administrative privileges, such as shutting
    the database down or doing reloads. There are also privileges related to the database
    and tables such as being able to read the tables and putting new data in them.
    New users should be created with specific roles in mind. A user can be created
    that just handles administrative functions. Regular users who manipulate data
    should only have permissions to do these operations, and leave the more privileged
    operations. Users can also be restricted from where they originate the connections
    to the database. You can create users who are allowed to connect locally only,
    from specific remote hosts or both. There are also special tables that can restrict
    access to certain tables and from certain hosts that combine provide a matrix
    of privileges that can be very specific to your environment. These privileges
    are given with the GRANT command, and if you know SQL well, you can apply the
    SQL commands directly to modify these tables to provide the setup that you need.


    Once set, you need the database to be available as much as possible. The default
