    # # FAQs


    **Q**: How do I run more than one MySQL server on my machine?

    **A**: This can be accomplished in two ways:

    With the source distribution, you can pass specific flags to configure allow the
    database to point to a different location and use a different port:


    ```

    shell$ ./configure --with-tcp-port=port_number \

    --with-unix-socket=file_name \

    --prefix=/usr/local/mysql-3.22.9

    ```


    If you do not have the source distribution you may also use runtime flags to **mysqld**:


    ```

    shell$ /my/path/bin/safe_mysqld --socket=file_name \

    port=port_number

    ```


    You should not have two different daemons modifying the same database path.

    A different one can be specified with **-datadir**.


    **Q**: How do I replicate my database?

    **A**: For now, MySQL does not have a feature to automatically do this. A simple
    work-around would be to do a nightly dump of the database and import it to another
    database. The frequency of this operation depends on how fresh the data needs
    to be.


    **Q**: How do I backup my database?

    **A**: The **mysqldump** command allows you to save all the tables in the database.


    ```

    shell mysqldump --tab=/save/path --opt --full

    ```


    You can also shutdown the server and **tar** up the database directory. To reload
    the tables back into the database, you can **untar** the files into the database
    directory or restore the dump.


    **Q**: How do I upgrade to the latest version if I already installed MySQL?

    **A**: You can stop your current database and move the directory to a different
    name. Then install the distribution like you did before. Afterwards, move your
    database directory back to the new directory and start up your database.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '**Q:** What happens if I forget my password?


    **A:** You must first shutdown the server. Then start up the server with the **--skip-grant-tables**
    option to *not* use the privileges table. Connect back to the database and either
    use GRANT to reset the password or use SQL commands directly to reset the password
    on the user table.


    **Q:** How do I enable transactions?


    **A:** Unlike larger scale databases, MySQL does not have the ability to enable
    transactions. This will be included in later versions.'
