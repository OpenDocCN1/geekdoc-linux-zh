- img_proc: true
  md: '# The Linux Kernel Is Free


    Linux was developed for fun and free. The Linux kernel and the related source
    code are made freely available to everyone and will continue to be free as Linux
    is concerned. Linux is copyrighted by Linus Torvalds under the terms of the General
    Public License (GPL). The GPL allows anyone to freely distribute the full source
    code, make copies thereof, and sell or distribute it (with a few exceptions) any
    he or she wishes, the GPL is supplied along with the Linux kernel (usr/src/linux/COPYING/
    directory on the Linux CD-ROM or it can be downloaded and viewed from many sites
    on the Internet.


    # The Engine


    The Linux kernel is just one small part of the whole collectively known as Linux—it
    just happens to be the most important part. You can think of your average PC as
    being like the chassis of an engine, one can buy from any supplier of chassis
    and there are many suppliers available. The next most important part is the engine—for
    your PC, this would be the Linux kernel. The kernel “makes it all run.” The kernel
    handles IO, does memory management, and basically “runs” things. So, you have
    a chassis and an engine, but no steering, no wheels, no doors, no seats, no power
    “things.” These are the extras that you also get to select (see Pick Your Own)
    or have someone else select for you (Linux Distribution).


    # The Rest of the Stuff


    The kernel is the engine of your operating system. And just like any other operating
    system, you need some utilities to do useful work creating a document and printing
    it; and other utilities to install, display, and print “stuff” on some other host;
    and share files and play sounds. This “stuff” is a set of utilities that is freely
    available on the Internet, the same as the Linux kernel. Table 1.1 provides a
    very small sample of the utilities supplied with Linux.


    | Operation | Command Line Utility |

    |---|---|

    | File Manipulation | cp, mv, rm, in, touch, ls, cat, more, >, >>, 2>, < |

    | Setup | ifconfig, mount, mount,/etc/printcap, /etc/hosts |

    | Stats | ps, vmstat, nfsstat, innstat, netstat, top, users, pac, du |

    | Utilities | vi, pine, pico, sed, awk, grep, find, netscape, tar, cpio, compress
    |

    | Network Services | DHCP, http, SMB, ftp, telnet, talk, pop3, imap, finger, sendmail
    |


    Table 1.1 Basic UNIX Utilities Supplied with Every Linux Distribution


    # Pick Your Own'
