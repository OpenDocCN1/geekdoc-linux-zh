    # # Summary


    The Progress database has proven itself over the years to be an extremely reliable
    product, while easy to use and administer. The installation is little more than
    a copy from media and setup of few variables. Although there are many features
    such as Roll Forward Recovery, and 2-Phase commit, these are not mandatory and
    administration is simple. The many startup options for customizing Progress operations,
    increasing performance, and balancing resource utilization. Although Progress
    is an excellent choice for cost-sensitive and medium companies, some large companies
    may require 24x7 operation features not provided in the V8.3 release provided
    on Linux. Other than these highest end features, Progress provides all of the
    really important features that the big-name databases do at a much smaller cost.


    # # FAQs


    +   Q: How old is Progress Software as a company called Data Language Corp. in
    1981. This is the origin of the DLC variable used during installation. The product
    has always been called Progress since its commercial introduction in 1983. In
    keeping with that name recognition, the name of the company was changed in 1987.
    PSC went public in 1991 and is traded on Nasdaq as PRGS.


    +   Q: What is the difference between the WorkGroup and Enterprise versions of
    the database?

    A:WorkGroup was designed to be used with a maximum of 35 users, and is available
    only up to the 50-user count level. Almost all of the high-end performance features
    like database blocks, background page writers, and -spin parameter are not available.
    All of the basic features of Roll Forward Recovery, Crash Proof, Networkable,
    multiple database connections in a single connection, and 2-Phase Commit are common
    to both databases. But users of any kind will be looking to buy Enterprise if
    performance is of any concern.


    +   Q: Is Progress available internationally?'
