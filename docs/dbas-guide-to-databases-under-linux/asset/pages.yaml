  md: '# Creating a New Database


    Although there are many ways to set up your database, we will concentrate on the
    best performing methods. Progress provides two different methods of using a database—single-volume
    and multivolume. Multivol is an absolute necessity in large-scale environments,
    but offers many advantages to all users.


    # Multivol


    Progress has two different types of database layouts available. Single volume
    databases are the easiest to create but have a maximum size of 2 gigabytes (the
    limit of an seek() system call). Data extents still have the 2GB limit in multivolume
    databases, but they can be combined for much larger storage capacity. Beginning
    in version 9 of Progress, all databases will be multivolume. This, combined with
    the potential performance enhancements makes multivolume a recommended choice.


    Progress databases are split into four types of files—before-image extents, after-image
    extents, data extents, and the DB file. Before-imaging is what gives Progress
    the ability to back back transactions. The before-image file are identified by
    file extensions of .b1, .b2, or just .b1 for a single-volume database. After-image
    extents end in .a1, .a2, etc., and the Roll Forward Recovery files. Data extents
    both contain data and the index to the data. Each of these files is described
    in a structure file and then pieced together in a collection to form the database.
    The structure file ends in .st and is used to create its binary equivalent, the
    .db—once the database has been created the .st file is not required and can be
    recreated using the prostruct utility—it is, however, to keep order for documentation
    purposes.


    The steps to create new databases are well defined in the Progress documentation,
    but a small example is given here. You first need to create a .st file with the
    list of all extents. Extents are defined by their type (before-image, after-image,
    data), whether they are fixed or variable, and by their size in 1k blocks (or
    whatever block size database you are creating—1k is the default). There can be
    only one variable before-image, and one variable data extent. Let''s keep the
    example simple and define a structure file with one fixed and one variable extent
    for before-image and data. After-image extents are highly recommended since they
    give the ability to recover the database from the point of last backup to any
    point in time afterwards. They are not included in this example for the sake of
    simplicity. Such a structure would be called like mydata.st and look like this:


    ```

    B /mnt/bi/myData.b1 f 10000

    B /mnt/bi/myData.b2

    D /mnt/db/myData.d1 f 500000

    D /mnt/db/myData.d2

    ```


    Note how the first column denotes the extent type, B/D/A, and the f means an extent
    of fixed size. In this case, if the before-image file grew bigger than 10MB (i.e.,
    10000 blocks), the second .b2 extent would be used to begin. Similarly, the .d2
    extent would be used if the data files grew larger than 500MB. Also, note how
    the extents are spread across different mount points.


    Sizing extents is an exercise in balance. In general, more file handles provides
    better concurrency, so you would want to choose 10 extents of 200MB instead of
    2 extents of 1GB for'
