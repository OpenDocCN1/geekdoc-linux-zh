  md: 'The variables are as follows:


    +   **backlog.** Amount of requests waiting to be filled. This is the list queue
    for incoming TCP/IP connections and is very operating-system specific.

    **concurrent_inserts.** ON (default) allows INSERTS on MyISAM (disk-based) tables
    while SELECTs are occurring.

    **connect_timeout.** Number of seconds to network connection.

    **delayed_insert_timeout.** Time to wait for INSERT DELAYED before dropping request.

    **delayed_insert_limit.** How long to wait for SELECTS after INSERT DELAYED.

    **delay_key_write.** The default allows **delay_key_write** on CREATE TABLE, which
    speeds up writing on keys.

    **delayed_queue_size.** Queue size in rows for INSERT DELAYED.

    **flush_time.** Flushes all tables after this many seconds.

    **init_file.** Loads an initialization file on startup.

    **interactive_timeout.** How long in seconds the database will leave an inactive
    connection before it is closed.

    **join_buffer_size.** Buffer size for table joins, allocated only at join; used
    for faster joins.

    **key_buffer_size.** Size of buffer for index blocks; increasing gets better index
    handling.

    **long_query_time.** Sets the slow_queries counter when the query takes longer
    than this.

    **max_allowed_packet.** Maximum size of a packet. Might need to be increased for
    BLOB columns.

