  md: '# OS Accounts and Groups


    The Oracle server should not run under the root account. It is common to create
    an account oracle that owns the Oracle server software and the background processes.
    Oracle defines a group within the Oracle server called OSDBA. Any account within
    Oracle that is a member of OSDBA receives DBA authority. Oracle uses a Linux group,
    /etc/group, to assign membership to the Oracle server OSDBA group. During installation,
    Oracle requests a Linux group to define OSDBA membership—the Linux group dba is
    often used. Oracle8i has a second group called oinstall, which can be used to
    assign authority to install software in the repository. As root, use the groupadd
    command to add the dba group:


    ```

    # groupadd dba

    ```


    For Oracle8i, also add the oinstall group:


    ```

    # groupadd oinstall

    ```


    For Oracle8, create the Oracle account using the dba group as the default group:


    ```

    # useradd -c DBA -g dba oracle

    ```


    For Oracle8i, create the Oracle account using the oinstall group as the default
    group:


    ```

    # useradd -c DBA -g oinstall -G dba oracle

    ```


    Create a password for the oracle account:


    ```

    # passwd oracle

    ```


    # File System Rights


    In order for the oracle account to use the mount points during installation, it
    must have appropriate rights. Change the ownership of the mount points to the
    oracle account. Once the installation is completed, ownership of the top-most
    directories can be changed back to root.


    ```

    # chmod oracle.dba /u01

    # chmod oracle.dba /u02

    # chmod oracle.dba /u03

    # chmod oracle.dba /u04

    # chmod 755 /u01

    # chmod 755 /u02

    # chmod 755 /u03

    # chmod 755 /u04

    ```


    # Environment Settings


    Certain environment variables need to be set before the Oracle server is installed.
    There are'
