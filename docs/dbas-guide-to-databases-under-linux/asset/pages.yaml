  md: '# MySQL Versions, Licensing, and Support


    MySQL is an open-source package, which means that the source code to the database
    and relevant tools are freely available. This is immensely powerful for many reasons.
    One is that if there are any problems with the database, they may be able to be
    fixed if competent developers are on. Open source software is also being constantly
    updated. This brings the user the latest and greatest features of the database,
    but it can also add an extra burden of management. Keeping up with the latest
    and relevant versions of libraries and tools in the support environment can be
    a bit much at times. Even though versions are constantly changing, you do not
    have to upgrade. Once you have a distribution in a server up and running, you
    do not have to upgrade as soon as the next version appears, especially if all
    the functionality necessary in your application exists. It is better to wait for
    a few revisions after the next major release. Keep up-to-date on the latest features
    being added; if the feature is something that is necessary for the application,
    it might worth upgrading right away. Also, if a feature you are currently using
    has a bug or related problem, upgrading sooner to alleviate the problem is advised.


    MySQL requires no license for usage, even in commercial applications. If you sell
    the server along with other services, charge for installation of MySQL, or include
    MySQL in a distribution that charges for usage, you will require a license. The
    license is required per CPU; in the case of multiple CPUs, it still counts as
    a single CPU. The latest prices can be found at


    http://www.mysql.com/Manual/chapter/manual_Licensing_and_Support.html#Cost. As
    of writing, One CPU was $200, with discounts of $10 to $50.


    If you benefit from using MySQL either in commerce or other applications, we ask
    that you buy a support license to help further the development. The support is
    separated into four different types: basic e-mail, extended e-mail, login support,
    and extended login support. The basic starts at EURO 170, extended e-mail at EURO
    1000, login support EURO 2000 and extended login support at EURO 5000. If you
    decide to binary distributions with MySQL, it is best to stick with the same platform
    throughout. The binary distributions are not updated as frequently, and new versions
    might not be available to you for a while after their release. If you use a Linux-based
    machine on the Intel platform, you should have access to the latest binaries.
    Other platforms might not be up-to-date with their binary distributions.


    You might also notice that some files have an extra tag on them—either alpha,
    beta, or gamma. These specify how mature the distribution is. Alpha denotes that
    there are new features that have been implemented but not tested. This is not
    a well-tested'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'distribution, and should be used only to experiment. Beta is a distribution
    that has new features, but generally needs more broad testing, which the users
    can help with. Gamma usually indicates that it is a stable release and is available
    for full-time use. Again, unless the new features are needed, the gamma releases
    will have all the features you will need.

    To unpack these distributions, you will need a few GNU tools, such as tar and
    gunzip. You can determine if you have these tools with the following commands:


    ```

    shell$ which tar

    /bin/tar

    shell$ which gunzip

    /usr/bin/gunzip

    ```


    If a pathname shows up below, the tool is installed in that directory. If these
    tools do not exist, refer to the documentation of your Linux distribution to determine
    how to add them. The location of these files is also determined by your PATH environment
    settings. If nothing shows up, you can also try looking in these directories for
    the files. You can also query RPM for RedHot Linux:


    ```

    shell$ rpm -q make

    gzip-1.2.4-14

    shell$ rpm -q gzip

    make-3.77-6

    ```


    These tools can be installed from your distribution or from GNU distributions.
    More information can be found at the GNU Web site:

    http://www.gnu.org/software/software.html.


    # Installation of Binary Distribution


    After you download the file, move it to the directory where you want to install
    the files, such as /usr/local (this may require root privileges). To unpack the
    distribution, execute the following command in the same directory where you moved
    the file.


    ```

    shell$ gunzip -c mysql-3.22.X-PLATFORM.tar.gz | tar -xvf -

    ```


    This will create a directory of the same name, mysql-3.22.X-PLATFORM. We can create
    a link to this directory to make it easier to reference:


    ```

    shell$ ln -s mysql-3.22.X-PLATFORM mysql

    ```'
