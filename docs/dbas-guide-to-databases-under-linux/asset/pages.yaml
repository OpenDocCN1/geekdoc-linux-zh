    world. SQL is relatively set, meaning records are gathered together at a time
    and then processed. For online applications, this is not as efficient or natural
    as the 4GL that focuses on accessing a single record and making it available to
    the application immediately.


    There is a downside to OLTP however, and that is Decision Support. Set-oriented
    access by far outperforms relational retrieval when almost always expect such
    features as well as SQL execution. Progress supports the SQL 88 specification,
    but it is not optimized for this type of access. Reports still run reasonably,
    but in many cases poorly written SQL, and computer-generated SQL in particular
    does not run nearly as fast as native 4GL for the reports. This is in a state
    of change, though. Version 9 has been slowly introducing the newly written SQL-92
    engine. Progress has written an entirely new product that sits on top of the same
    storage manager as the current 4GL product. The new product not follows the new
    language standard, it is optimized for SQL execution. This new product will become
    commercial with version 9.1 of Progress.


    # Bullet-Proof Crash Recovery


    In the Progress sales force, there is an old story of how representatives were
    trained to prove the reliability of the database. Demonstrations were done on
    portable computers running DOS. There has always been concern on that platform
    database clobbering open files. While in the middle of the demonstration, sales
    reps purposefully pull the power cord from the wall, without battery, and crash
    the machine. Without exception, the database would be undamaged and crash recovery
    successful. The technology that goes into Progress’ transaction processing is
    the same that keeps the database going without fear of power failure corrupting
    the database. This should not be seen as a panacea for hardware failure. All databases
    will lose data if the physical media is unrecoverable or damaged.


    # Cost of Ownership


    Progress is priced in the range that ordinary companies can afford—not only in
    terms of the initial purchase, but also in terms of what it takes to keep a running
    system. Most Progress installations today do not have a full database administrator.
    The database does not need to be reconfigured in many cases unless a significant
    increase in the number of users occurs. Progress administrators share their time
    between an hour or two monitoring their database and other mundane system administration
    related tasks. A system that can scale to several thousand users and be operational
    with minimal database administration is a remarkable achievement. PSC authorized
    the Aberdeen Group to evaluate both initial and long-term costs to run the Progress
    compared to databases at both large and small environments. The results can be
    viewed at the Progress web, http://www.peg.com.


    # Word Indexes


    One of the forgotten gems in the Progress database is a feature known as the Word
    Index. Character data can be used to create a preset index identifying all of
    the words contained inside the data. This is not a particularly sophisticated
    index retrieval feature, but a low-cost way'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'to provide advanced searches on databases of newsgroup posts, legal briefs,
    and knowledge-base entries. Access to the index is provided by the single 4GL
    function CONTAINS.


    # Internationalization


    Internationalization covers a wide variety of topics from Double enabled versions
    of Progress for the Asian character sets, to language translations of the Progress
    error messages, regionalized date and numeric formats, and collation tables sort
    capabilities based on national character sets. Progress has all of these features
    through a rich set of character handling features.


    In addition, Progress makes an additional cost optional product called Translation
    Manager. Its primary function is to scan Progress 4GL source code and determine
    the strings used in the application for various messages and screen labels. This
    list can then be given to a professional translator without ever having to know
    anything about computers. Multiple copies of the translated strings can be kept,
    and swapped in and out the Translation Manager product.


    # 24 by 7 Operation


    Progress added an online backup feature in several releases to the current one.
    However, there are still several features missing in the product currently available
    for Linux. The Linux 8.3 version does not allow you to keep the database online
    during index reorganization. Activation and deactivation of indexes and most other
    database schema changes currently may not be conducted online.


    Progress slowly has adding features to mitigate some of these issues. For example,
    new fields can be added without reorganizing the table. In addition, version 9
    offers an online table move and an online index build. The Linux platform is scheduled
    to be ported during the introduction of Progress 9.1.


    # No BLOBs


    Binary Large Objects (BLOBs) are pieces of data like movie and audio clips, or
    geospatial data. Progress currently does not support these and has plans for minimal
    support in the future. Support for smaller objects, up to 32 kbytes, is available
    and is using the database as an index of the BLOBs stored as file pointers. However,
    if you have requirements for heavy multimedia storage, then Progress is not a
    likely candidate.


    # No Parallel Queries


    A handful of the highest database systems have incorporated the ability to process
    a single database query across multiple CPUs. The technology behind this has proven
    to be extremely costly and time-consuming to debug. Today''s massively parallel
    CPU architectures can greatly produce huge amounts of CPU resources. However,
    the cost of such machines and the cost of creating the technology puts it out
    of the reach of the average medium-sized computer department. Aside aside, there
    is also no guarantee that the individual queries you may will benefit from processing
    on more than one CPU. Many cases that the IO operations become the bottleneck
    instead of the CPU. In those cases, all the money spent on a Parallel Query system
    would be wasted.


    # No Distributed Lock Manager'
