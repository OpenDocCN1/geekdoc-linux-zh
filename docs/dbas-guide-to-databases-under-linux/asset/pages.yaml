    # Run Environment


    Once MySQL is installed, there are a variety of tools to gather information about
    your database. The first tool, mysqladmin, performs most of the administrative
    duties that you will need including creating and deleting databases, flush tables,
    change passwords for users, reload, shutdown, and find out the status of the database.


    First, go into the bin directory of your MySQL installation:


    ```

    shell$ cd /my/path/mysql/bin

    ```


    You can run mysqladmin with no arguments to find a complete list of all its features:


    ```

    shell$ ./mysqladmin

    ```


    To find the version:


