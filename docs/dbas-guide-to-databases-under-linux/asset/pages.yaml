    # Kernel Parameters


    Now all of the Progress products have been copied from tape, the Linux kernel
    may need to be configured. Progress uses two main sets of resources controlled
    by the Linux kernel—shared memory and semaphores. Before we decide on the exact
    values of each parameter, it is important to understand a little background on
    these resources to set them properly. Shared memory is a facility to set aside
    RAM for multi-user access. Instead of writing all the database information directly
    to disk where each user would perform a slow IO operation, Progress uses faster
    RAM as a kind of database record deposit. Blocks are read from disk into the shared
    memory area (also known as the *Buffer Pool*) where they are available not only
