- img_proc: true
  md: 'Linux is Linux, there is no real separation of workstation and a server version
    in most cases. For example, TurboLinux Workstation version retails for less than
    the TurboLinux Server package. The only difference is how much and what type of
    software you get to install. A workstation usually means the main Linux network
    services that pertain to a user and additional productivity applications like
    an office suite. A server version might not include these user productivity applications
    by default, but this would not preclude you from installing them at any later
    time.


    If the main usage of your Linux host is a file, print, web and ftp service, this
    host would be considered a server. If you add an office productivity suite like
    Corel WordPerfect, StarOffice, or Applware (basically all Office97 equivalents),
    then you have a workstation again. This “workstation” and “server” designation
    is a perceived use rather than a restriction put on the software. Most Linux versions
    come with all possible applications for both server services and user applications;
    you can pick and choose what you want to install every time. You can even automate
    the installation to a single diskette bootup that connects to a central installation
    service with a script identifying which disk partitions to create of what size,
    and what packages should be installed. The RedHat distribution provides the Kickstart
    automated service for multiple installations onto similar machines of RedHat Linux.


    # Latest and Greatest Hardware?


    Linux runs fine on older equipment and is an excellent way to get added mileage
    of older equipment as a firewall, file and print (nfs, SMB, Novell, Mac) or web
    or ftp server. For the desktop, last year’s models are the best. You DO NOT want
    the latest and greatest hardware; many times they are specific to Windows only,
    like WinModems. Generally speaking, name-brand peripherals or peripherals that
    use well-known chip sets are the best. Linux has a large following and there is
    usually a driver for most common equipment easily available at some Internet.


    # For IT Professionals


    # Odd Incompatibilities


    In one recent class, some local machines were used. They contained a common network
    interface card (NIC) that was assumed to work with Linux. Sadly, all this NIC
    did cause frustration. A quick browse of the NIC manufacturer corporate web page
    caused a ray of hope to appear. The Frequently Asked Questions (FAQ) section provided
    a Linux-specific section with a helpful hint that required a download of their
    DOS Setup disk files. The help on the site was “This NIC works best when not in
    Plug and Play mode with Linux.” The setup utility did not have any way to change'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'this status on these particular NICs, although the NIC worked fine under Windows
    and NT. No amount of coaxing or begging helped. It was eventually replaced by
    a really 8-bit NIC that worked just first time, every time. Just goes to show,
    you never know for sure.


    The web site did indicate that their newer NIC cards were indeed Linux-compliant,
    and that there were some Linux drivers available for them. Linux is becoming another
    requested OS for which hardware manufacturers are spending development time to
    be compatible.


    # Where to Look for Drivers


    A great place to start is at the web site of the Linux distribution; for example,
    www.redhat.com, a small part of the RedHat web site, or www.debian.org/distrib/wptlist,
    a small part of the Debian web site. You can also just use your favorite search
    engine from any web browser and type in the keywords “Linux” and “your hardware
    name.” This usually provides several (if not hundreds) of links to sites with
    drivers. Most sites will also include their latest hardware compatibility HOWTO
    for additional hints.


    Also, pick your favorite search engine, and type the keywords “Linux” and {your
    hardware}. You should come up with a number of links to sites with drivers, maybe
    run down some favorites like video cards, network cards, and SCSI cards. The latest
    hardware compatibility HOWTO should provide some hints.


    # Migrate to Desktop Workstation


    Surely you remember the last time you changed your operating system, from DOS
    to Win3.x / Novell or to Win95 / NT / Novell? This change to Linux will be no
    less traumatic. You may have to retrain some users in some cases. However, the
    basic interface skills will remain the same, but the applications may differ for
    some things, like your office suite. But if this is a dedicated database client
    desktop, the look and feel should be very similar if not exact, and the reliability
    is very high. Just think, the average user will have no clue how to put or get
    files from a floppy disk! Isn that something worth it? Not only, but how about
    a free office suite like StarOffice that provides compatibility of interface and
    documents? You may want to check out the StarOffice productivity suite supplied
    free from Sun Microsystems found at www.sun.com/products/starOffice comes bundled
    with many versions of Linux including RedHat 6.1 and TurboLinux 4.0. You can find
    these and other products like the new GNU Office suite by visiting sites www.slashdot.org
    and www.freshmeat.net for Linux community news and the latest software downloads
    of games, applications, patches, and upgrades in most cases for all the different
    Linux versions.'
