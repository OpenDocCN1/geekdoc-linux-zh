    # A Simple CGI Interface to Progress


    The standard http server to CGI process is simply providing stdin and stdout to
    a program, and that program can be anything at all. The following shell script
    simply passes stdin a well-known FIFO, that as, has a Progress 4GL procedure running
    in the background reading (that’s why’s well-known-the procedures have agreed
    in advance to use it). It then reads a response from a FIFO that it created and
    told the Progress server to use. The point of that is to make sure that the response
    goes back to the correct user—Chapter 3 of the Progress External Interfaces Guide
    for some of the considerations. The Progress program accepts requests and responds
    to them—the sample form and response are, obviously, silly but easily modified
    to do something more interesting:


    ```

    #!/bin/sh

    #

    # cgi-bin/xxx

    ```


    ```

    PIPE=/tmp/cgi$ # where to send the response

    rm -f $PIPE # make sure that no old one is hanging around

    /etc/mkod $PIPE p # create the named pipe

    chmod 666 $PIPE # make it writable

    read INPUT # read the form

    ```


    ```

    # add the name of the named pipe to send the response down to the

    # front of the form data and write the whole mess to the "well known"

    # pipe $/tmp/cgi-pipe

    ```


    ```

    echo "$PIPE&"$$INPUT > /tmp/cgi-pipe

    ```


    ```

    cat < $PIPE # read the response and echo it to the server

    rm -f $PIPE # clean up

    ```


