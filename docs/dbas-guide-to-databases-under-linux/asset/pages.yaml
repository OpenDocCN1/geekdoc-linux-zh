    # Stopping Your Engine


    Now that your engine is running, how do you turn it off? To stop the Informix
    engine, use the **onmode -ky** command.


    ```

    $ onmode -ky

    ```


    This will allow you to make changes to your **$ONCONFIG** and restart the engine.
    A whole series of additional features are contained in the **onmode** command.
    Be sure to read your *Administrator''s Guide* for more information on how and
    for what the other options are used.


    # Final Configuration


    What''s next? Your engine is running, but really not operational. The next phase
    will allow our server to be useful, especially for end-users.


