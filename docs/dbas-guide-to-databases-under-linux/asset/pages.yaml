    # # Summary


    After researching all the available databases that are free, with source code,
    it was found that only PostgreSQL is the most mature, most widely used and robust
    RDBMS SQL free database (object relational) in the world. PostgreSQL is very appealing
    since a lot of work had already been done. It has ODBC and JDBC drivers; using
    these makes it possible to write applications independent of the databases. The
    applications written in PostgreSQL using ODBC and JDBC drivers are easily portable
    to other databases like Oracle, Sybase, and Informix, and vice versa.


    You may ask, why PostgreSQL? The answer is, since it takes lot more time to develop
    a database system from scratch, it makes sense to pick up a database system that
    satisfies the following conditions:


    +   - Whose source code is available –must be an Open Source code system


    +   - That has no license strings, no ownership strings attached to it


    +   - That can be distributed on the Internet'
