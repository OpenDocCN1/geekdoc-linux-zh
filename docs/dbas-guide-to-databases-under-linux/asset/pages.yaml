  md: '# Introduction


    In this chapter, we discuss a complete build-up of a Web-based application from
    start to finish—that of the popular “shopping-cart” storefront application (see
    Figure 10.1). Due to space considerations, this application will not include a
    full treatment of security issues, but we will discuss the issues inherent in
    an application such as this. (Future revisions will be security hardened.) The
    complete application—with source code, the database dump, and installation instructions—is
    available under the GNU Public License version 2 (GPLv2) at www.sourceforge.net.


    > Figure 10.1 A shopping-cart storefront application.


    ![](img/a6b8fd6f7dfea65f9a1b7e4c40482932_353_0.png)


    # Web Application Platforms


    The Web application platforms available today include JSP, PHP, Cold Fusion, Zope,
    ASP, and many others. We’ll discuss how they relate to each other, and how they
    relate to Linux.


    # Active Server Pages


    Microsoft’s Active Server Pages (ASP) are designed for Windows NT/2000 but can
    run also (better, in fact) on many UNIX/Linux platforms, including RedHat Linux,
    via Chili!Soft’s excellent emulator. ASP has the ability to use any COM object,
    but COM objects are a Microsoft technology. Microsoft’s IIS and Visual Studio
    presents an excellent development environment, but plagued with legacy and security
    issues and typically is not compatible with Web servers other than IIS unless
    Chili!ASP is used. You can find more information at Chili!Soft’s Web site at http://www.chilisoft.com.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# # Cold Fusion


    Allaire''s Cold Fusion is another proprietary product that is easy to learn and
    use; although it has been available for Windows NT only, Allaire has recently
    begun converting to various UNIX flavors, including HP-UX, Solaris, and Linux.
    Cold Fusion uses custom HTML tags mixed with standard HTML to build a customized,
    database-driven page. You can find more information at http://www.allaire.com.


    # ## Java Server Pages


    Sun''s Java Server Pages is a relative newcomer to the Web application platform
    as well, but offers the vast power of Sun''s Java language. Although replete with
    complexity as well as features, it is an excellent choice if your organization
    is standardizing on Java and CORBA. JSP is available for any platform that has
    a Java interpreter is available, which includes Linux, UNIX, and Windows NT. Go
    to http://www.sun.com for more information.


    # ## Zope


    Zope is an excellent Open Source Web application platform that incorporates a
    hierarchical, object-oriented database with built-in modules and a Web-based development
    environment. It has modules that connect to major database engines, and offers
    all the advantages of traditional relational databases as well as object-oriented
    databases, as well as many of the advantages of PHP. It also offers a flow-down
    inheritance scheme and a built-in permission strategy. Development on like most
    Open Source projects, proceeds very rapidly, and it''s definitely worth checking
    out. As a complex and full-featured product with an integrated security model,
    it''s not quite fast as PHP. You can find more information at http://www.zope.org.


    # ## Scripting Languages


    There are many Open Source scripting languages, such as Perl, Python, and TCL,
    that offer scripting capabilities. Many of them can be integrated into Apache
    and Other Web servers, avoiding the security and performance issues that occur
    with CGI. These languages are an excellent choice for Web development, especially
    if you are already proficient in them. You can visit any of the following sites
    for more information: http://www.perl.com, http://www.python.org, and http://www.tcl.com.


    # ## PHP


    PHP is an extremely popular Open Source scripting language that is designed to
    compete directly with ASP and JSP. It offers modules for IMAP, POP3, LDAP, XML,
    PDF, PostScript, FTP, WebDAV, Oracle, MySQL, mSQL, Informix, PostgreSQL, Sybase,
    and too many other database engines to mention. It runs on Linux, UNIX, and Windows
    NT. Because PHP is freely available, with source-code, and integrated with RedHat
    Linux, we will develop the application build in PHP against the MySQL database
    engine. According to Netcraft, PHP is powering over one million Web servers and
    growing very fast. Go to http://www.php.net for more information.


    # ## Apache


    By far most popular Web server platform is Apache (http://www.apache.org), with
    approximately 60 percent of the market share according to Netcraft. Microsoft''s
    IIS comes in a'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'distinct with 22 percent of the market share. Apache offers great performance,
    although performance is not its only advantage. There is a wealth of add-ons and
    modules available; it''s extremely stable and offers good security; it runs on
    all popular operating systems; it''s very scalable; and it''s free and Open Source.

    Apache is based on the NCSA Web server. The developers of Apache were unsatisfied
    with the rate of development on the NCSA Web server, and released their own patched-up
    version, a Patchy Web Server. In the years since, Apache has developed into a
    robust and well-supported platform. Security bugs are fixed in a matter of hours,
    as everyone has the source code and can contribute PHP and Perl, as well as most
    other Open Source languages and platforms, are available as plugin modules to
    Apache. Although PHP can run with other Web servers, we will discuss PHP running
    as an Apache module, because there are other security constraints involved with
    running it with CGI.


    # Getting Started


    Consult your RedHat manual for instructions on installing PHP, MySQL, and Apache
    RPM packages. For most recent versions of RedHat, these RPMs are included on the
    CDs, and will not need to be downloaded.

    We recommend downloading and installing phpMyAdmin (see Figure 10.2) to ease the
    development of the new database system. phpMyAdmin is a Web-based database manager
    for MySQL databases and offers the distinct advantage of complete source code,
    which you can use when developing your own PHP-based applications.

    Also, you may download and install the actual application, available for free
    at www.sourceforge.net.


    ![](img/a6b8fd6f7dfea65f9a1b7e4c40482932_355_0.png)'
