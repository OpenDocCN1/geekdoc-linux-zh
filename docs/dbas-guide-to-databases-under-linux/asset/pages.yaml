  md: "The postmaster occasionally prints out messages that are often helpful during\
    \ troubleshooting. If you wish to view debugging messages from the postmaster,\
    \ you can start it with the --d option and redirect the output to the log file:\n\
    \n```\n% postmaster -d >& pm.log &\n```\n\nIf you do not wish to see these messages,\
    \ you can type\n\n```\n% postmaster -S\n```\n\nand the postmaster will be \"S\"\
    ilent. Notice that there is no ampersand (&) at the end of the last example, so\
    \ postmaster will be running in the foreground.\n\n# Using pg_options\n\nThe optional\
    \ file data/pg_options contains runtime options used by the backend to trace messages\
    \ and other back-end tunable parameters. The file is reada by a back-end when\
    \ it receives a SIGHUP signal, making it possible to change runtime options on\
    \ the fly without needing to restart Postgres. The options specified in this file\
    \ might be debugging flags used by the trace package (backend/utils/misc/trace.c),\
    \ or numeric parameters that can be used by the back-end to control its behavior.\n\
    \nAll pg_options are initialized to zero at back-end startup. New or modified\
    \ options will be read by all new back-ends when they are started. To make effective\
    \ any changes for all running back-ends we need to send a SIGHUP to the postmaster.\
    \ The signal will be sent automatically to all the back-ends. We can also activate\
    \ the changes for a specific back-end only by sending the SIGHUP directly to it.\n\
    \npg_options can also be specified with the -T switch of Postgres:\n\n```\npostgres\
    \ options -T \"verbose=2,query,hostlookup-\" \n```"
