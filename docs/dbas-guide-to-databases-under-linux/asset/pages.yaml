    # Setting Up Data Files for Informix


    Create a separate drive, /opt/data, or /db/data, or preferably, a separate hard
    drive called /data, and under it create a separate directory called /data/informix.
    I have a separate drive I call /db, and we have created a /db/data directory for
    the home of all the data. For our install we will use /opt/data, but you should
    have a different directory. It is advisable to keep your data separate from your
    software if at possible. As I decide later, you should allocate at least 500MB
    for the data, if not. It makes no sense to scrimp on data space unless you cannot
    avoid it. When I talk about allocation of space, I am referring to total space,
    not specific files. Your total aggregate space should be less than 500MB, and
    we will create cooked files of different sizes within this space.


    Informix uses chunks to describe the largest value for data space. All data resides
    inside chunks as pages, which are the smallest unit of measure for data space.
    Please refer to the Administrator''s Guide for a complete description of chunks
    and pages. This chapter will use terminology to finish the installation, so it
    is important for you to understand the concepts. You will find award-winning documentation
    for Informix software. They have received numerous awards for their documentation.

    Once you are familiar with the concept of chunks and dbspaces, you are ready to
    configure your server for operation. We will set up a server that allows you to
    specify on your own how much data space to use, and the minimum operational space
    to set aside. This way you can grow the system with a minimum of aggravation.

    There are several minimum dbspaces for which you need to set aside disk space.
    These are the minimum; the rest are data spaces you decide to add as additional
    dbspaces. The following are operational spaces.


    +   - **Rootdb**, dbspace containing the sysmaster database, the intelligence
    center for the database engine.

    - **Physdbs**, dbspace for buffering data before it is written to disk. This is
    contained in the rootdbs, but should be moved to its own dbspace for improved
    performance and administration. You can call this dbspace whatever you like; however,
    it is advisable to call it something consistent with what it is.

    - **Logdbs**, dbspace for logical logs. Upon installation, it is contained in
    the rootdbs, for better operation it should be placed in its own dbspace. You
    can call this dbspace whatever you like; however, it is advisable to call it something
    consistent with what it is.

    - **Tempdbs0**, dbspace for temp tables and sorting of queries. You can call this
    dbspace'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'whatever you like; however, it is advisable to call it something consistent
    with what it is.


    The following are data spaces.You may call these dbpsaces whatever you like.


    **Dbs_dbs.** dbspace for database creation, but not tables. A database entry is
    created, with a basic system table entries, but user tables are referenced outside
    this space.

    **Datadbs01.** dbspace for user tables.

    **Indexdbs01.** dbspace for user indexes.


    If you create this minimum set of dbpsaces, you will have a minimum installation
    that can meet most of your needs as you learn about how the IDS engine works.
    It will also allow you to expand as your needs increase.


    # About Disks


    You should set up an area on your system to accommodate Informix. There are three
    areas to consider: software, dbpsaces, and a work area for backups, logging, etc.

    SCSI is recommended over IDE, for speed and flexibility. SCSI allows you to chain
    together drives more easily than IDE; however, if you are experienced enough with
    IDE, you could achieve a similar disk set-up, but there are some limitations with
    IDE that do not allow you the same flexibility as SCSI. If at all possible, get
    a SCSI controller for your system, and use a SCSI drive.


    # Disks and Directories


    Here are explanations of what **/opt/informix/ids7.30** and **/opt/data** directories
    hold.


    **/opt/informix/ids7.30.** This directory holds software—everything software under
    this tree. Set aside at minimum, 500MB for the Informix software. No data is stored
    here. Using this convention for a directory name you can add other versions of
    the software under **/opt/informix**, and easily test switching or upgrading your
    software by simply changing the $INMIXDIR environment variable.

    **/opt/data.** This directory holds cooked-file dbpsaces; if possible, this should
    be another disk. This directory is for data only.


    # Space Considerations


    How much space should you set aside? You could take a 2GB disk and allocate space
    as follows.

    For the operational spaces:


    +   - 50MB for rootdbds

    - 50MB for physdbds'
