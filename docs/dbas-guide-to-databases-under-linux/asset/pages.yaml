    # Installing DB2


    This section will take you through the setup and installation of a DB2 server,
    as well as the creation of a sample database that will be used to verify the installation.
    Before performing the tasks in this section, be sure that you have completed all
    the steps to enable your workstation for a DB2 installation as discussed in the
