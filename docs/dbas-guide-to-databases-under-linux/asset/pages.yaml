    Is the postmaster running (with -i) at ''server.joe.com'' and

    accepting connections on TCP/IP port ''5432''?

    ```


    This is the generic "I couldn''t find a postmaster to talk to" failure. It looks
    like the earlier example, when TCP/IP communication is attempted, or like the
    following, when attempting UNIX-socket communication to a local postmaster:


    ```

    connectDB() -- connect() failed: No such file or directory

    Is the postmaster running at ''localhost'' and accepting

    connections on Unix socket ''5432''?

    ```


    The last line is useful in verifying that the client is trying to connect to where
    is intended. If there is, in fact, no postmaster running there, the kernel error
    message typically will be either "Connection refused" or "No such file or directory,"
    as illustrated. (It is particularly important to realize that "Connection refused"
    in this context does not mean that the postmaster got your request and rejected
    it—that case will produce a different message, as shown next.) Other error messages
    such as "Connection timed out" may indicate more'
