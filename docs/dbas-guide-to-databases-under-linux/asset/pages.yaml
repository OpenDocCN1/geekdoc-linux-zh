    # root Account Configuration


    Every distribution of Linux has one special account, usually denoted as *root*,
    which is sometimes referred to as *superuser*. The root account can do anything.
    You must configure the password as superuser. On some Linux versions, you also
    are given an opportunity to install any other users you may wish to include. For
    instance, with RedHat Linux, you can easily add one or more additional users during
    the installation, as shown in Figure 2.11. You do not have to add another user
    but it is *highly* recommended that you create one nonprivileged account for day
    to day work on a workstation. You *should not* be root while doing basic user
    tasks.'
