    I left the original values commented-out so that we can go back to these later
    and either change keep them as a point of reference. It''s always a good idea
    to comment-out other—copy and change the code rather than just changing the original
    entry. This way you can keep track of changes.


    We left our tape devices set to /dev/null, and this allows the IDS server to come
    up and work without worrying where the backups will go—for now. Later on we will
    decide if we decide to have a real tape backup. Setting it to /dev/null is a standard
    way of telling the IDS server to ignore a physical device, namely the logs. We
    will discuss the necessary to tell the engine certain things are backed up, namely
    logical logs later on; for now we will only worry about bringing up the server.'
