    Once you are editing /etc/services file, you need to restart your networking.
    In most cases restarting inet will force inet to restart the /etc/services file;
    however, a reboot may also be necessary for some of the Linux distributions. The
    various distributions have different run levels, and can be unique to each distribution
    on how restarting. As a matter of tradition, many Linux system administrators
    do not want to cold-start their Linux servers to preserve the uptime, and strive
    only to what is necessary. For the sake of simplicity and reduced errors, reboot
    your Linux server if you can; make absolutely sure the networking layer of Linux
    is restarted, and that the /etc/services file is reread. If you don''t, the Informix
    server will not be able to talk to clients on the network, or other problems may
    arise with the installation.

    Note that the entries in your $INFORMIXDIR/etc/sqlhosts file correspond to the
    entries in the. If these do not match, you won''t be starting the engine.


    # /opt/data/rootdbs


    To use a coded file, one must exist, so we create one in the /opt/data directory
    (see Figure 5.6):


    ```

    $ mkdir /opt/data      # only if you do not have this directory!!!

    $ chown informix:informix /opt/data

    $ chmod 775 /opt/data

    $ cd /opt/data

    $ rootdbs

    $ chown informix:informix rootdbs

    $ chmod 660 rootdbs

    $ ls -l rootdbs

    ```


    The rootdbs should now be zero bytes in size. It should be owned by Informix and
    have user group permissions on it, but no public permissions. It should be rw-rw----
    when you run ls -l on the rootdbs file. The directory in which the rootdbs lives
    should be owned by Informix and the group id of Informix.'
