- img_proc: true
  md: 'The first option button when configuring a NIC is the choice to use DHCP (Dynamic
    Host Configuration Protocol) to configure all TCP/IP related information automatically
    from a central DHCP server that can be running on any other OS, as long as it
    is RFC-compliant.


    # Activate on Boot


    The second option button when configuring a NIC is the choice to activate this
    NIC on boot. If this is the only NIC, this will be selected for you. If this is
    an interface in dial-or-oriented, you may not want to activate it on bootup. You
    can make this a demand-activated-service, but that is beyond the scope of this
    installation.


    # Not Using DHCP


    The rest of the network configuration screen is used to configure the TCP/IP settings
    manually for this host. At a minimum, you need to supply the IP address and the
    associated network mask or netmask. The interface will try to guess your network
    mask if you use the TAB key to go to the next field (it may pause a short time
    to do this calculation, so be be patient). If the guessed values are correct,
    you can simply move to the next field or correct them as needed.


    # Hostname


    This is just a reference for this machine and is not necessarily the same name
    used to reference this host from anywhere else on the network. Name resolution
    is the act of changing a name to an IP address. Linux uses the /etc/hosts file
    and then DNS to resolve a host name to an IP address before doing a broadcast.
    But the local naming scheme is neither shared nor specific; every other machine
    can use any name it wishes locally for the IP of your machine. Only when you use
    a central service like DNS are you restricted to a specific name, and even this
    can be circumvented. In summary, this hostname does not have to be unique on the
    network, but it should be if you are using DNS.

    Figure 2.9 shows a completed setup for one NIC card with manually entered IP information,
    hostname, gateway, and DNS (or name server) entries.'
  merge: -1
