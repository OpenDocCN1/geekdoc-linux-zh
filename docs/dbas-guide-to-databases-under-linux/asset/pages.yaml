    # # Strengths and Weaknesses


    Like all products, Progress is not perfect. Although it offers a large set of
    features that only the

    enterprise class databases, it does lack some of the most expensive options available
    on

    t"Big Four." Here is a discussion of where Progress shines, and where it is lacking.


    # ## The 4GL


    In many ways the Progress 4GL language is its greatest strength and a weakness

    combined. The 4GL is a procedural language designed to write an entire application.
    From the

    very start PSC has made good on promise as witnessed by the number of applications

    from their partners, each without any significant usage of 3GL. These are not
    just

    small products, but industry-leading products from software houses like FiServer,
    qad, inc.,

    Symix, and NxTrend.

    On other hand, 4GLs are as proprietary and closed. Progress''s product is no exception,

    in in fact, the lack of reasonable ODBC drivers has until recently added to the
    closed nature of

    the product. To some extent this is a red herring since in fact databases have
    their own

    proprietary SQL extensions, and code transportability is limited to only a small
    subset of the

    application.


    # ## OLTP Oriented'
