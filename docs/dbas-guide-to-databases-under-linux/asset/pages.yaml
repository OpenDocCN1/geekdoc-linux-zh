  md: 'Imagine if you could go to one huge store and cruise down an aisle for your
    new PC "chassis" and pick the parts you wanted for your new PC "car," and assuming
    they would fit together, at the end of the conveyor belt, you had all the pieces
    to build your PC car. The best part is that there is no check-out—all of this
    stuff is free! Well, if you knew what you were doing in this huge Internet, you
    would already know what you needed, what your preferred choice was for each option
    (since there are always many to choose from), and you already knew it fit together.
    As with the commercial versions are—a collection of these programs and utilities,
    along with some that make up their version or distribution of Linux.


    # ### A Linux Distribution


    Whenever you get a copy of Linux, either commercially or free, you get what is
    collected is a distribution. A distribution is one company’s collection of utilities
    along with the kernel and possibly some of their proprietary products, like database
    managers, firewall software, etc.

    A typical Linux distribution contains hundreds of standard UNIX-like utilities
    as well as an excellent set of development tools, games, databases, graphical
    display, and control utilities, as well as a windowing Graphical User Interface
    (GUI) called the X Window System.


    # ### Linux Is Not Always Free


    Some of these Linux distributions are not entirely free. The base of their system
    may be free but they charge for the extras that make it special version of Linux.
    There are commercial versions of Linux produced by companies like Debian, RedHat,
    VA Linux, SuSE, and more. But that does not mean you cannot get a copy for free.
    You can download a full copy of these Linux distributions usually from their own
    sites as well as any of the many mirror sites scattered throughout the Internet.


    # ### Why Pay for a Linux Version?


    The commercial versions offer added bonuses that are not available with the free
    versions, although the actual media that is supplied may seem identical. The difference
    is usually in some value-added product or service that is included with the commercial
    product. For example, RedHat Linux, when bought commercially from a retailer,
    includes 30–180 days of free installation support as well as a subscription to
    their update central web service. The Debian Distribution provides unlimited support
    from its web and ftp sites. You can also buy this support and update service on
    a yearly contractual basis from RedHat and other providers. This is how RedHat
    makes its money and continues to pour that money back into developing additional
    features for their product.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Commercial versions are also more likely to be kept current and usually have
    a simplified installation and unified interface prepared for you. In the early
    days of Linux, you were given a basic set of instructions on how to get the supplied
    Linux distribution to install. You then had to configure your files and printers,
    network and sound cards individually. Current releases almost always have some
    slick installation script that may be color-oriented and menu-based (most common),
    or it may be GUI-oriented (X Window) like the current release of RedHat.


    # What If Linus Quits?


    All the source code is freely available; even if Linus decides to stop working,
    someone else can easily take the source and continue the development. The kernel
    is only one small, albeit very important, part of the whole referred to as Linux.
    Most of the many utilities have been contributed from the open source area and
    the GNU project.


    Contrary to popular belief, Linus does not do everything. There are many other
    contributors up to this point and there will be many more. Henry Ford did not
    invent the car as there were many contributors. Alan Cox was one notable contributor
    to kernel development in areas such as dealing with additional hardware and new
    CPU design requirements. Specifically, AMD is providing all the processor nuts
    and bolts of the Athlon processor to Alan Cox. Kernels released in the near future
    should SMOKE (optimized to run) on an Athlon machine.


    # The Main Differences between Linux and Other Operating Systems


    Linux is a UNIX clone that is written to be POSIX-compliant wherever possible.
    Linux was originally written for the Intel platform but there are ports to PowerPC,
    Macintosh, Amiga, some Atari computers, and even the Palm Pilot. If you know the
    basic commands, file system layout, and general utilities of any UNIX variant,
    you know basic Linux commands, the basic interface, and the file system. If you
    are Microsoft Windows or Macintosh oriented, you may not be as comfortable at
    first but will find that almost everything is similar.


    # Feature Rich


    Not every Linux distribution has exactly the same set of utilities, but in general,
    the base features supplied with Linux are quite impressive, to say the. Since
    Microsoft Windows had almost no competition at the desktop, their advertisements
    almost always spoke of the improvements over their previous offerings, not their
    competition. Linux was and is a competitive operating system for the Intel or
    clone-based PC as both a workstation and server operating system. And most of
    the improvements added to Windows NT over the past four years have been UNIX-like'
  merge: -1
