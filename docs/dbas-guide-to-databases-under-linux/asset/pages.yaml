    # Troubleshooting


    Very little goes wrong with a Progress database. Most issues have to do with managing
    those crazy users. The following topics are some of the more likely scenarios.


    # Hung Users, Runaways, and Other Psychos


    The simplest (and safest) way to handle _progress processes (self-service user
    sessions) needing some sort of external attention is to nothing.


    If that''s not an option, then in all cases your next step should be to have the
    user slowly back away from the keyboard keeping their hands in at all times (hopefully)
    prevents any problems arising from simultaneous conflicting attempts to remedy
    the situation. Your best bet is kill -2 (SIGINT). Kill -2 simply raises the STOP
    condition in the target GL procedure and causes the -p startup procedure to rerun.
    The process won''t die but you won''t do anything bad. And if the problem is something
    along the lines of "Tm hung" the user will probably get their session back without
    going through a UNIX login again if it''s a network or hung PC problem you''re
    out of luck.


    If kill -2 you need—perhaps you limit users to one login each and there is a network
    problem so the idle session is blocking access—then you should still kill -2 to
    get the process to a stable state. When it is stabilized, the .lg file says that
    any transaction buyout complete and it is no longer accumulating CPU time and
    performing IO operations then kill -1 (SIGHUP) should very safely terminate it
    if the user had off their terminal. Kill -15 (SIGTERM) has the same effect.


    Using a series of kill isn''t a good idea unless you put plenty of time between
    them and monitor both the .lg file and the status. If you interrupt Progress cleanup
    routines and the interruption to an interrupt isn''t handled correctly you could
    crash the database. Trapping signals with the shell trap command is a bad idea.
    It will defeat the proper operation of these signals and lead to a unstable system.
    If you are out of a _progress session, type and get out back, then your system
    is at risk. The most common problem in this scenario is a runaway process—a process
    that attempts to consume all CPU. If you have trapped rid of


    Kill -8 (SIGFREE) varies in behavior depending on the release of Progress. In
