    # Configure the File System


    Mount points are the first issue to consider. Disk usage is often easier to determine
    when a server is designed and built. The minimum for a production system should
    be six drives; the minimum for a development system should be four. Disks can
    always be added if necessary. The biggest concern is safety of the data. Data
    files and redo logs reside on separate devices. If one of the drives containing
    data is lost, the redo logs can used to restore the data. Generally, a larger
    number of smaller capacity drives are preferred over a smaller number of high
    capacity drives. If I offered the choice between 6GB drives and 9GB drives, I
    would probably select the six-drive alternative. More drives provide increased
    performance with increased data protection. Another important issue to consider
    is contention between different applications. A 9GB drive that is partitioned
    into two 4.5GB partitions and shared between two different applications will be
    difficult to tune. When possible, dedicate drives to Oracle.


    Oracle recommends using something like Optimal Flexible Architecture, or OFA.
    OFA is a particular method of file system layout that requires a minimum of four
    mount points at the same level of the directory structure. It is especially useful
    if you are running multiple database instances on the same server. Oracle documentation
    often refers to the OFA layout, so it is helpful if you are using it.


