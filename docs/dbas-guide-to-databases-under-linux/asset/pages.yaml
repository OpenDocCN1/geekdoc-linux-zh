- img_proc: true
  md: 'telecom, automobile, banks, airlines, etc. will not function efficiently with
    a database system. The most popular database systems are based on the International
    Standard Organization (ISO) SQL specifications and ANSI SQL (American) standards.
    The current specifications widely used in the industry are ISO/ANSI SQL 1992/98.
    Without a standard like ANSI/ISO SQL, it would be very difficult for the customer
    to develop an application once, and run it on all An end user wants to develop
    an application only once, using ISO SQL, ODBC, JDBC, and then be able to deploy
    it on all variety of database systems.


    PostgreSQL is the most advanced open source object relational database in the
    world. PostgreSQL, developed originally in the UC Berkeley Computer Science Department,
    pioneered by many of the object-relational concepts. It provides SQL92/SQL3 language
    support, transaction integrity, user-defined functions, stored procedures, triggers,
    and type extensibility. PostgreSQL is a public-domain, free, and open-source descendant
    of the original Berkeley code. Millions of PostgreSQL databases are installed
    as database servers, Web database servers, and application database servers. It
    is a very sophisticated object relational database system (ORDBMS). PostgreSQL
    runs on Solaris, SunOS, HPUX, AIX, Linux, Irix, Digital Unix, BSDi, NetBSD, FreeBSD,
    SCO UNIX, NEXTSTEP, Unisware, and almost all flavors of UNIX. Port to Windows
    NT is done using the Cygnus cywin32 package.


    +   - Title: PostgreSQL SQL RDBMS Database (Object Relational Database Management
    System)


    +   - Current Version: 7.0


    +   - Age: In development since 1985, PostgreSQL is now 15 years old.


    +   - Authors: PostgreSQL was developed by millions of people in universities
    and companies on the Internet for the past 15 years.


    MySQL is another open-source, quasi-commercial database system, but it supports
    important features like transactions.'
