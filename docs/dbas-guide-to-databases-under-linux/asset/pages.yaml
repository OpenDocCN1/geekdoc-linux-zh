    # FAQ


    +   Q: Can I use Microsoft products with an Informatix database on Linux?

    A: Of course you can! Any Microsoft product or Microsoft-based software that can
    connect to an ODBC database can connect to an Informatix database on Linux. You
    simply set up the networking connection between the Informatix server and the
    Microsoft client, and you can be connected.


    +   Q: Can I connect an Informatix database on Linux to an Informatix database
    on another UNIX platform?

    A: Yes. You need to configure the networking parameters in the appropriate configuration
    files, and you can network two different servers together. You can also connect
    these servers using data replication.


    +   Q: How much hardware do I need to set up an Informatix database?

    A: The whole installation can take up approximately 500MB for a small system,
    and more for a larger database. Informatix can run in little as 8 MB of memory


    +   Q: Where is the best place to find out more information on Informatix.

