  md: '# A sample backup script:


    ```

    if [ -f $TMP/User_Lockout ]; then

    clear

    cat $TMP/User_Lockout

    sleep 30

    msg **** Backup of active database??" dba

    exit 0

    ```


    # continue backup...


    ```

    msg **** Starting PROKUP of $DBNAME

    DLC/prokup $DBNAME /mnt/dump/$DBNAME >> $LOGS/backup.log 2>&1 &

    nmsg **** PROKUP of $DBNAME complete with status $?

    tar cvf /mnt/dump/$DBNAME.bak >> $LOGS/backup.log 2>&1

    msg **** Backup of $DBNAME complete with status $?

    ```


    It is essential that you periodically test your restore procedures to ensure that
    a valid backup is being created and that your tapes have everything you need on.
    The best way to do this is to restore to a different machine. This verifies the
    entire process and all of the media. The PEG periodically features tales of unfortunate
    souls who thought they were backing up every night who turned out to have any
    means of recovery. Don’t join them. Verify your backups.


    # Monitoring


    Progress comes with an excellent character-mode database monitor known as PROMON.
    DBAs should become familiar with PROMON in their interactive mode and become accustomed
    to normal ranges of values for their systems. But the true power of monitoring
    is obtained by consistently collecting a historical view of activity over a long
    period of time. You can then use that to validate a hypothesis regarding a problem
    and in a much more targeted and reliable manner. The following script can serve
    as the basis for collecting that data:


    # Monitor

    #


    ```

    . /mnt/scripts/env    # export TMP=/mnt/tmp

    TM=`date "%H.%M"`

    DLC/bin/promon $DBNAME > $LOGS/sample.$TM << "EOF" 2 > /dev/null

    ```'
