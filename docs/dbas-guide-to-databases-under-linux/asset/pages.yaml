    Q: Is there a recommended RAID level for use with Progress?


    A: There is no parity-based RAID (2,3,4,5,7, ...). Parity-based RAID results in
    a parody of performance. It exists to make you a repeat customer of the RAID vendor,
    because you will continually need upgrades and enhancements to eke out reasonable
    performance from such a system. RAID 0 (striping) and RAID 1 (mirroring) are not
    parity-based and are, therefore, good choices (especially when combined). You
    have to add RAM and lie about the completion of IO requests (“write back”) cache
    vs (“write through”) cache to improve the performance of striped and mirrored
    systems by adding disks. Disk is cheaper than RAM (especially the big servers)
    and you can add more of (there are always limits on how much RAM you can add if
    you have a bottomless budget.. And then there is the question of what happens
    to the data in RAM when the power fails. If a write back cache is enabled (and
    it has to be decent performance out of parity based RAID, one little slip and
    your database is hosed (battery backups have been known to fail) because the array
    lied to Progress about what is on disk, which makes crash recovery very questionable.


    Just say No to RAID 5 (and its cousins).


    Q: Why doesn’t Progress work with RAID 5?


    A: Progress works with RAID 5. But like every other database, it works, much faster
    with other disk technologies. Progress has no awareness of the sort of RAID system
    that you use. Only your users will be to tell.


