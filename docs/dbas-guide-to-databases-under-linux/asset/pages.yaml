    # # PostgreSQL Quick-Install Instructions


    Even PostgreSQL is the most advanced and most sophisticated database system in
    the world, installing PostgreSQL is not at all complex, and in fact, installation
    takes less than five minutes with binary RPMs. PostgreSQL needs a bare minimum
    of 40MB disk space and 8MB of RAM. But nowadays, even low-cost PC systems are
    shipping with 10GB hard-disk and 64MB RAM, and hard disk is decheap. This section
    gives you a bird''s-eye view of the install process. If you have some experience
    with Linux and RedHat RPM packages, you can complete PostgreSQL installation in
    just five minutes by simply following the next steps. If you are a novice to Linux/UNIX,
    then cross-reference this section with the next section, “Detailed Instructions,”
    which explains in detail each one of the steps.


    On RedHat Linux systems, use the following steps. On Debian, the steps will be
    similar, but replace **rpm** with **deb**. On Debian, if you do not have PostgreSQL
    packages then you can convert RedHat PostgreSQL RPM packages to Debian packages
    using the rpm2deb program.

    Login as root and follow the commands at the **bash** prompt:


    ```

    # cd /mnt/cdrom/RedHat/RPMS

    # man rpm

    # ls list *.rpm (to see list of packages)

    # rpm -qpi postgres*.rpm | less (to see info of package)

    # rpm -qpl postgres*.rpm | less (to see list of files inside each

    ```'
