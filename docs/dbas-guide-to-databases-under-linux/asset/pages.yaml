    # Access Control


    Postgres provides mechanisms to allow users to limit the access to their data
    that is provided to other users.


    # Database superusers


    Database superusers (i.e., users who have pg_user.usesuper set) silently bypass
    all of the access controls described next with two exceptions: manual system catalog
    updates are not permitted if the user does not have pg_user.usecatdup set, and
    destruction of system catalogs (or modification of their schemas) is never allowed.


    # Access privilege


    The use of access privilege to limit reading, writing, and setting of rules on
    classes is covered in grant/revoke(l).


    # Class removal and schema modification


    Commands that destroy or modify the structure of an existing class, such as alter,
    drop table, and drop index, only operate for the owner of the class. As mentioned
    earlier, these operations are never permitted on system catalogs.


    # Functions and Rules


    Functions and rules allow users to insert code into the back-end server that other
    users may execute without knowing it. Hence, both mechanisms permit users to Trojan-horse
    others with relative impunity. The only real protection is tight control over
    who can define functions (e.g., write to relations with SQL fields) and rules.
    Audit trails and alerts on pg_class, pg_user, and pg_group are also recommended.


    # Functions


    Functions written in any language except SQL run inside the back-end server process
    with the permissions of the user postgres (the back-end server runs with'
  merge: -1
