  md: 'Figure 2.11 Configure root and additional accounts (at least one).


    # Authentication


    The login on most Linux or UNIX host can be validated locally or remotely with
    a centralized service like NIS or NIS+, as shown in Figure 2.12. With either authentication
    method, you can also include additional security settings like MD5 and the use
    of shadow passwords, both of which are highly recommended. The MD5 is a more secure
    and integrated form of password; the shadow password is actually an improved security
    scheme for UNIX and Linux password files. Normally UNIX and Linux keep each useraccount
    setup information in a file that is readable by all users. With shadow passwords
    turned on, some of the more important aspects of this information is stored in
    a file that is not readable by the entire world, usually called /etc/shadow, but
    this is completely configurable.


    # Using NIS or NIS+


