    # RAID


    RAID level 1, Mirroring, is a good option for your system disks, where your operating
    system resides. Your database files should be on separate disks entirely from
    the OS and should be hardware RAID 5 to get the best throughput and reliability.


    # Cost of RAID


    The most expensive RAID level is 1. In this case, if two disks of the same size
    are used, you end up with only the space of one for your system; the other is
    a duplicate. This is a 50 percent realized utilization of the two disks. If three
    disks are used for mirroring, you effectively get 33 percent as only one disk
    is actually available—in essence, the other two are duplicates of the first.


    With RAID 0, you get 100 percent realized utilization of the disks with vastly
    improved read and write speeds. This is because all disk space is available but
    there is *recovery*. If any one disk fails, they all fail and you must rebuild
    them all and then recover all data back to all disks. This is *not recommended*
    for mission-critical data, but could be used for scratch and temporary data. Alternatively,
    a set of hardware services providing the multiple disks is an acceptable option,
    where you can use this RAID 0 to combine them into one big disk as far as the
    server is concerned.


    RAID level 5 effectively uses the space on one of the disks to provide a parity
    block that is used to regenerate the data missing by the loss of any one disk
    at a time. Only one disk can fail at any one time and must be recovered before
    any other disk fails; usually, there are exceptions. The minimum is three disks,
    the maximum 32, depending on the operating system used. With three disks, you
    effectively get two of three for the 67 percent utilization. With four disks,
    you get three of four for 75 percent, four of five for 80 percent, and so on until
    the best utilization is 31 of 32 for about 96 percent realized utilization with
    built-in recoverability. This is the recommended solution for mission-critical
    data.


    # Hardware or Software RAID


    Linux provide for software-based RAID levels 1 and 5. This is an excellent option
    if the hardware solution is not chosen. This is implemented with two and minimum
    disks, respectively, and with mdadm daemon service. You can select entire disks
    or just similar-sized partitions to implement the RAID sets. The setup is clearly
    outlined in the HOWTO-RAID documentation.


