    Q: When I entered the db2start command to start my instance’s database manager,
    I received an SQL10007N Message “-1393” could not be retrieved. Reason Code: “1”
    error.


    A: DB2 is not aware the instance is. When you enter the db2start command, DB2
    will attempt to start the default instance. The default instance is determined
    by the DB2INSTANCE environment variable, which is set by the DB2 Installer during
    installation. The most common occurrence of this error is when you log on to your
    system using the su command without the – parameter, as discussed previously in
    this chapter. If you receive this error, enter the export DB2INSTANCE=db2inst1
    command (of, if you wanted the default instance to be something other than the
    db2inst1 instance, you would specify that instead).


