    # Security


    Database security is addressed at several levels:


    +   - Database file protection. All files stored within the database are protected
    from reading by any account other than the Postgres superuser account.


    +   - Connections from a client to the database server are, by default, allowed
    only via a local UNIX socket, not via TCP/IP sockets. The back-end must be started
    with the -i option to allow nonlocal clients to connect.


    +   - Client connections can be restricted by IP address and/or username via the
    pg_hba.conf file in PG_DATA.


    +   - Each user in Postgres is assigned a username and (optionally) a password.
    By default, users do not have write access to databases they did not create.


    +   - Users may be assigned to groups, and table access may be restricted based
    on group privileges.


    # User Authentication


    Authentication is the process by which the back-end server and postmaster ensure
    that the user requesting access to data is in fact who he/she claims to be.'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'All users who invoke Postgres are checked against the contents of the pg_user
    class to ensure they are authorized to do so. However, verification of the user''s
    actual identity is performed in a variety of ways:


    +   - From the user shell:


    A back-end server started from a user shell notes the user''s (effective) user-id
    before performing a setuid to the user-id of user postgres. The effective user-id
    is used as the basis for access control checks. No other authentication is conducted.


    +   - From the network:


    The Postgres system is built as distributed, access to the Internet TCP port of
    the postmaster process is available to anyone. The DBA configures the pg_hba.conf
    file in the PGDATA directory to specify what authentication system is to be used
    according to the host making the connection, and to which database it is connecting.
    See pg_hba.conf(5) for a description of the authentication systems available.
    Of course, host-based authentication is not foolproof in UNIX, it is possible
    for determined intruders to masquerade as the origin host. Those security issues
    are beyond the scope of Postgres.


    # Host-Based Access Control


    Host-based access control is the name for the basic controls PostgreSQL exercises
    on clients that are allowed to access a database, and on how the users on those
    clients authenticate themselves.


    Each database system contains a file named pg_hba.conf, in its PGDATA directory,
    which controls who can connect to each database. Every client accessing a database
    is covered by one of the entries in pg_hba.conf. Otherwise, all attempted connections
    from that client will be rejected with a User authentication failed error message.


    The general format of the pg_hba.conf is a file of records, one per line. Blank
    lines and lines beginning with a hash character (#) are ignored. A record is made
    up of a number of fields, separated by spaces and/or tabs.'
  merge: -1
  pgno: 312
- img_proc: true
  md: 'Connections from clients can be made using UNIX domain sockets or Internet
    domain sockets (i.e., TCP/IP). Connections made using UNIX domain sockets are
    controlled using records of the following format:


    ```

    local database authentication method

    ```


    where


    +   - **database** specifies the database to which this record applies. The value
    **all** specifies that it applies to all databases.

