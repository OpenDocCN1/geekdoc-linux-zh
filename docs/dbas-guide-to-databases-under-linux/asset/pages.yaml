    # # Runtime Environment - Using Postgres from UNIX/Linux


    All Postgres commands that are executed directly from UNIX shell are found in
    the directory .../bin. Including this directory in your search path will make
    executing the commands easier.


    A collection of system catalogs exists at each site. These include a class (pg_user)
    that contains an instance for each valid Postgres user. The instance specifies
    a set of Postgres privileges, such as the ability to act as Postgres superuser,
    the ability to create and destroy databases, and the ability to update the system
    catalogs. A UNIX user cannot do anything with Postgres until an appropriate instance
    is installed in this class. Further information on the system catalogs is available
    by running queries on the appropriate classes.


    # ## Starting Postmaster


    Nothing can happen to a database unless the postmaster process is running. As
    the site administrator, there are a number of things you should remember before
    starting the postmaster. These are discussed in the installation and configuration
    sections of this manual. However, if Postgres has been installed by following
    the installation instructions exactly as written, the following simple command
    is all you should need to start the postmaster:


    ```

    % postmaster

    ```'
