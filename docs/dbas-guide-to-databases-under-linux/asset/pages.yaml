  md: 'you have done space allocations now for your disks like we talked about in
    the beginning of this chapter, you are now ready to complete the following steps.


    # Review


    Let''s quickly review some of the key dbspaces we covered.


    +   - **rootdb**: Created during our installation and initialization of the database.

    - **physdb**: Will contain the physical log; must be moved out of the rootdbs
    into its own dbspace.

    - **logsdbs**: Will contain the logical logs; must be moved out of the rootdbs
    into their own dbspace.

    - **tempdbs**: Defaults to the rootdbs, will point to its own dbspace, and is
    used for sorts, queries, and temp tables.

    - **dbs_dbs**: Will contain database entries, but no table entries.

    - **databds01**: Will contain tables.

    - **indexdbds01**: Will contain indexes.


    # Physdb


    For performance considerations, it is a standard practice to relocate the physical
    log to its own dbspace. The physical log is a buffer, or cache, of database activity
    that has yet to be written to the database. Relocating it to its own dbspace allows
    you to expand or decrease its size as you need allow, without impacting the rootdbs,
    and allows you to increase performance.

    As we talked, the rootdb contains the brains behind every database you create
    on this server, for this instance. You can have multiple instances of Informix;
    each instance has its own rootdb, and dbspaces separate from other instances.
    It is important to minimize the risk to the rootdb. Relocating the physical log
    is one of the first steps we will take to make sure the rootdb is left for only
    the minimum of the activity—keeping track of where everything is in your databases—and
    managing the engine.

    Make sure your Informix engine is up and running


    ```

    $ onstat

    ```


    If the engine is not running, it starts now with the **oninit** program, with
    no options, or at the very least using only the **-v** option (the verbose flag):


    ```

    $ oninit -v

    ```


    You do not use the **-i** option to run **oninit** after you create the rootdb.
    Doing so is the equivalent of reformatting your hard drive. One exception: you
    can use **oninit -v**, which shows verbose output as the engine starts. Be careful
    not to use the **-i** option or the engine will be reformatted in the rootdbs.
    Doing this to a production server will expedite work on your resume.'
