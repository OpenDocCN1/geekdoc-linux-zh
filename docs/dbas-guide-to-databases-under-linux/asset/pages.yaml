    The Linux distribution of Informix engines has been coming in RedHat Package Manager\
    \ (RPM) and tar format, since the first Linux port was released. The latest 7.30\
    \ engine, IDS 7.30.UC10, is encased in an RPM file, which in turn is encased in\
