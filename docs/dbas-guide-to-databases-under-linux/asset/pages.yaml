    # # Summary


    MySQL installation seems pretty daunting at first, but by reviewing the options
    and taking a course that best suits your needs, you can have the database up and
    running in no time. MySQL comes in a variety of distributions: binary, RPM, and
    source. The binary distributions are tailored for specific types of platforms
    and cannot be used on any other. These are relatively easy to install and may
    require root access to be installed in the system-level directories. The RPM distributions
    are the easiest, but if you use RedHat Linux. These distributions will even do
    part of the configuration for you. The last distributions, which we recommend,
    are the source distributions. These come with a lot of documentation and examples,
    and can be highly tailored to your liking.


    MySQL is constantly in development, as you can see by the number of maturity of
    distributions. The stable distributions are recommended for their stability and
    full range of tested features. The bleeding-edge distributions are for testing
    out the new features that are being fleshed out in the database. The deprecated
    releases are not necessary unless you are a previous user. Keeping up-to-date
    in the stable distributions, namely 3.22, will provide all the features and stability
    an application requires.


    The actual installation depends on the distribution chosen. The binary and RPM
    installations require the least amount of work and can be done relatively quickly.
    The RPM distributions require RedHat and root privileges. Binary distributions
    require it if installed in a system directory. There is no compilation required
    for this because it is already done for you. The source distribution does not
    require root unless unless in a system directory as well. This distribution requires
    more tools than the previous distributions, but should already be installed from
    your Linux distribution. The only extra step is compilation, which should take
    more time depending on system resources.


    Once installed, you must configure and set up the database for usage. The first
    stage of setup is to make sure proper security is in place. Nothing can be stressed
    strongly than making sure the database is secure and only the users you want access
    to it can access, especially if the information being stored is sensitive. Even
    if it is'
