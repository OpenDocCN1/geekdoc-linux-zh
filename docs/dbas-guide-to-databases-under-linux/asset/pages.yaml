    # # Installing a DB2 Client


    This section will take you through the setup and installation of a DB2 client.
    Before performing the steps in this section, be sure that you have completed all
    the tasks to enable your workstation for DB2 product installation as discussed
    in the section Preparing Your RedHat Workstation for a DB2 Installation, at the
    beginning of this chapter.


    The instructions in this section assume that you install and configure your DB2
    client using the defaults provided by the DB2 Installer installation tool. The
    DB2 Installer is a menu-based installation program that assists you in accomplishing
    time-consuming installation and configuration tasks for your DB2 products. The
    instructions in this section also assume that you do not maintain previous versions
    of a DB2 product on your workstation, or the default db2inst user. If you use
    this user on your system, remove it using the usdel command. I recommend that
    you follow the instructions in this chapter on a workstation that has never had
    a DB2 product installation performed on it.


    > > Sometimes display problems can occur when running DB2 Installer. If your display
    encounters these problems, you can press CTRL-L at any time to refresh your current
    screen.

    To avoid the potential display problems, I recommend that you install DB2 in a
    virtual console session. A virtual console session is a terminal window outside
    the standard graphical interface that is installed with most RedHat workstations.
    To change to a virtual console, press CTRL-ALT-F1. To change back to the graphical
    interface, press CTRL-ALT-F7.'
