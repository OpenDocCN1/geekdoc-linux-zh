    # Part III: Disk Set-up and Server Operation


    We can now proceed with the operational aspects of IDS. What we are now discussing
    should be prepared for in advance, and you already should have reserved a certain
    amount of disk space for the databases, where the actual database(s) and tables
    will reside. This chapter focuses on the installation aspects of an Informix server,
    so you should become familiar with some of the terminology of Informix before
    proceeding.


    Please become very familiar with the Administrator’s Guide for IDS, found at the
    Informix Web site, and available on CD-ROM. A physical printing of this manual
    is available, at a significant cost. It is advisable to obtain the latest CD-ROM
    of documentation known as the Answers Online Documentation, which contains documentation
    for all of the Informix database products. A CD-ROM of this documentation can
    be ordered directly from your regional sales offices. The documentation is always
    available on the Informix Web site; take the time to download it and become familiar
    with the Administrator’s Guide; this manual describes everything you need to know
    to make your installation a success. The advantages of raw vs cooked files are
    discussed here, so it is to your advantage to read.


    As of writing, Linux still does not have a raw disk orientation unlike many of
    the existing UNIX platforms; however, this most likely be available by the time
    this book goes into circulation. Some sites are using raw disks without incident,
    but as of this writing it is unsupported.


    A raw disk installation, simply put, allows you to soft-link the Informix software
    directly to unformatted drives (unlike mounted file systems), and the Informix
    software takes over the formatting and disk operation. For raw disks, Informix
    is the disk operating system for drives set up as raw disks. The only thing for
    which Linux is responsible is an entry in the /dev directory pointing to the /dev
    device. A soft-link is created in a directory you choose, to point to the /dev
    directory, and to the drive entry.


    For example, you would create a /opt/informix/links directory, and then create
    soft-links in that directory to point to the /dev directory. If you have a disk
    in /dev called /dev/rdisk1, you simply create a link to it:'
  merge: -1
  pgno: 109
- img_proc: true
  md: '```

    $ /opt/informix/links

    $ cd ln -s /dev/rddisk1 datadbs01

    ```


    When you do an ls -l, you will see only the link, not the disk.

    A cooked disk installation, simply put, allows you to create Linux files of a
    certain size that Linux will manage along with Informix. Cooked files are created,
    and look like, regular Linux files. Cooked files are created with a specific size
    in mind, and can be backed up with a standard backup, provided the Informix server
    is offline, and shut down. Cooked files must be closed just like regular Linux
    files in order to back them up. Benefits of cooked files are that they are simply
    Linux files, and backing them up is as simple as backing up any other Linux file.

    When you perform an ls -l on the directory, the cooked files show up as regular
    Linux files (see Figure 5.5). When you look at raw disks, the directory listing
    usually shows a link to /dev entries, but no file sizes show up, as these disks
    are now under the control of Informix.

    to understand raw disks, use Informix onstat commands to see how much space they
    are using; this is the only way you can see what they contain. It is highly advisable
    for you to use cooked files until you become more familiar with how raw disks
    are up.


    ![](img/a6b8fd6f7dfea65f9a1b7e4c40482932_110_0.png)


    # Figure 5.5 Sample directory listing of cooked file dbspaces Informix software
    uses to store data.


    Informix on Linux has very good performance using cooked files, but the preferred
    method in UNIX is to use raw disks, often giving a 15–20 percent performance advantage
    over cooked files. As of this writing, benchmarks were not available to compare
    the differences between raw disks and cooked files on Linux. Many x86 sites using
    the NT version of Informix Dynamic Server use cooked files exclusively, simply
    for the fact that raw disks on NT do not offer enough of a performance gain to
    make it worth the trouble to use'
