    # # Installation


    Installation is a fairly straightforward three-step process. First, install the
    executables from media, then change any kernel parameters, and then setup the
    environment. After installation, you are ready to create your first database.


    # # Install from Media


    Installation from media is a simple task of copying the executables from the CD
    or tape that comes from Progress. Each platform has a slightly different version
    of how the install scripts work. Linux, like most UNIX platforms, have tape versions
    available where each section of the tape contains a separate product. The installation
    script from tape is a straightforward combination of cpio to extract files and
    dd to skip unused nodes. The CD version is a little different since the files
    are there without need for extraction. In case, Progress uses its own archiving
    scheme to combine each of the products into a single archive file on the CD. Before
    we begin the actual install process, we will need to make sure we are.


    # # Prerequisites


    Installation of the Progress media is a simple process of running the scripts
    on the CD. Before you begin, make sure that you have approximately 100MB of free
    space for the software. Depending on which products you purchased, less disk may
    be possible. Also be sure to have the “Progress Software Corporation License Addendum”
    that came with the products. This is colloquially referred to as the green sheet,
    after the color of the paper on which it is printed.


    A working computer with Linux already installed is assumed with a properly working
    CD-ROM drive. If you will be accessing the database in Client/Server mode, then
    you will need TCP/IP installed. Dumb terminals do not require this. Progress has
    officially done their testing on RedHat Linux version 6.1, but should run on most
    distributions with a 2.2.13 kernel. The specific process described here was tested
    on the 6.1 Mandrake version of RedHat.


