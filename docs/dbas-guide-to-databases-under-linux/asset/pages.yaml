    # Security


    It would be easy for a cracker simply to note that he is using session #443 and
    simply change his personal code so that his session would become #443, effectively
    hijacking another user’s session. The most popular shopping cart and secure Web
    applications combat this by generating a unique and difficult-to-guess session
    id using a combination of the date, time, a random number, the user’s IP address
    or host name, etc. A complicated and sophisticated scheme would be unbreakable.


    # For IT Managers


    # Linux Really Offer Advantages Over NT/2000 for Web Servicing?


    Linux offers all the traditional advantages of UNIX as stability, scalability,
    and reliability, but it also offers ease-of-use, a large number of powerful and
    full-featured utilities, a large amount of free software that’s useful, and a
    design paradigm that sets it apart from NT/2000. In Linux, as in UNIX, the emphasis
    is placed on building small, modular programs that can be linked together through
    the command line. Although Microsoft has been trying to move in that direction
    for many years (i.e. COM/DOM/DOM), most of their applications and tools are still
    large, monolithic applications that try to do everything by all themselves. In
    contrast, Linux tools are designed to work together. Metaphorically speaking,
    this means that if a particular you’re using to build your tower isn''t the right
    color, you can pull that out and replace it with another without having the entire
    structure collapse on your head.


    One of the only advantages that Microsoft has over Linux is in the ease-of-use
    of its development tools. However, even this is subject to debate. The Microsoft
    tools make it so easily to develop an application, design tends to be suffered
    or discarded altogether as a running prototype is developed. As any DBA will agree,
    proper database design is absolutely crucial before actually beginning any coding.
    Microsoft tools attempt to shield the user'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'from the actual complexity of the task at hand. Generally speaking, this is
    a direction that Linux is moving in; for example, KDE, one of the most popular
    Linux desktops (windows managers), is widely known for being easier to use than
    Windows 98. Finally, Linux and UNIX enjoy a huge lead over NT, in both terms of
    actual large-site installations, and in terms of developer support. While there
    are thousands and thousands of Visual Basic programmers who have made the transition
    to web-based development, Visual Basic itself was never designed to handle the
    demands that Web development places on. Also, because Visual Basic tools and Visual
    Studio relieve the programmer of many design constraints, many VB programmers
    never learn proper coding or database interfaces. While this may not be a problem
    for small applications, limitations and design flaws become apparent as an application
    grows.


    Aside from Microsoft, very few IT professionals contest that Linux is a much more
    stable and full-featured platform than NT/2000. There is also an upgrade path
    to other, non-Intel platforms that NT doesn''t offer. For example, Linux is available
    on every major platform available, including Sun''s Sparc, Compaq''s Alpha, Apple''s
    Power, HP''s PA-RISC, and Intel''s upcoming IA-64 processors. If these are not
    large enough for you, IBM is porting Linux to your mainframes. In addition to
    3Com''s Palm Pilot and Linux Torvalds developed a special version of Linux for
    the computing Transcore promises to revolutionize portable computing with extraordinary
    battery life and self-optimizing processor architecture. The reality is that by
    choosing Linux, you''ve made the right move. Open Source is here to stay and the
    entire industry has recognized and is committed to that fact.


    # Conclusion


    In this chapter, a shopping cart application was built using PHP and MySQL. We
    look forward to hearing any implementations of this code. The complete application—with
    source code, the database dump, and installation instructions—is free for under
    the GNU Public License version 2 (GPLv2) at sourceforge.net. If you are not familiar
    with the GPL, a description, as well as the text of the license, is available
    at http://www.gnu/copyleft/gpl.html.


    # FAQ


    +   Q: We don''t have any PHP expertise in our organization, but we do have some
    Perl experts. Are there other open source shopping cart applications?

    A: One of the most complete shopping cart applications is Minivend, written in
    Perl (http://www.minivend.com). Another excellent Perl-based shopping cart application
    is OpenCart (http://www.opencart.com, http://www.opencart.com/). For many more
    examples, including others in both PHP as well as other languages, check Freshmeat
    (http://www.freshmeat.net).


    +   Q: Which Web server is the fastest?

    A: That depends on what you''re serving and, of course, who you ask. In general,
    for serving static, traditional Web pages (such as the HTML page) and those not
    generated by PHP, ASP, or other languages, the simplest Web server will be the
    fastest. More sophisticated servers include caching and other features to enhance
    the speed of the processing-intensive functions (such as dynamic page generation),
    but these features'
  merge: -1
