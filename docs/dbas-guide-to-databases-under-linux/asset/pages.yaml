    # pg_options


    The optional file data/pg_options contains runtime options used by the back-end
    to trace messages and other back-end tunable parameters. What makes this file
    interesting is the fact that it is reread by a back-end when it receives a SIGHUP
    signal, making it possible to change runtime options on the fly without restarting
    Postgres. The options specified in this file might be debugging flags used by
    the trace package (backend/utils/misc/trace.c) or numeric parameters that can
    be used by the back-end to control its behavior. New options and parameters must
    be defined in backend/utils/misc/trace.c and backend/include/utils/trace.h.

    pg_options can also be specified with the -T switch of Postgres:


    ```

    postgres options -T "verbose=2,query,hostlookup-"

    ```


    The functions used for printing errors and debug messages can make use of the
    syslog(2) facility. Message printed to stdout or stderr are prefixed by a timestamp
    containing the back-end pid:


    #timestamp #pid #message

    980127.17:52:14.173 [29271] StartTransactionCommand

    980127.17:52:14.174 [29271] ProcessUtility: drop table t;

    980127.17:52:14.186 [29271] SIIInNumEntries: table is 70% full

