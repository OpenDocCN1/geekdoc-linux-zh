- img_proc: true
  md: 'Figure 10.2 Utilizing phpMyAdmin to develop a new database system.


    # # Design Goals


    We had certain goals in mind when designing our shopping cart application, including
    easy maintenance and extensibility, clarity of code, and a user-friendly interface.


    # ## Clarity


    Because clarity is a focal point, we have decided not to include any sophisticated
    session identifier generation systems. We have also developed the entire application
    in a single PHP script. Everything is available through this one script, so the
    browser''s base URL never changes as he proceeds through the site. To tell one
    user from another, we set a single cookie on each user''s computer, which contains
    a unique session identifier. This session identifier increments with each new
    computer as it connects (i.e., 1,2,3,...), so there is never a conflict. There
    is a security flaw within this scheme, which we will discuss in the security section
    later in this chapter.


    # ## Extensibility


    One of the major barriers to extensibility and maintainability is difficult-to-understand
    code. PHP offers features to make it possible to develop large projects. PHP has
    a number of advanced features, such as objects and templates (using FastTemplate)
    that we will not use here. PHP4 (Zend) and PHP3 (using PHPLib) also offer more
    secure versions of version control. Of course, PHP also offers: global, static,
    and local variables; and a number of other features designed to develop modular
    code that most languages provide. We have developed the code with extensibility
    in mind, but some work remains to be done. For example, we are currently working
    on a more advanced checkout system.


    # ## User-Friendly Interface


    One of our priorities was the ability to browse the store and add items to a virtual
    shopping cart without providing any personal information, while making it easy
    for the user to register, login, or purchase those items without having to repurchase
    those items. We also wanted to make it simple to administer the store.


    # ## Designing the Schema


    Currently in open-source development is a full, free, secure version of this database.
    Details are available at www-sourceforge.net. This code is designed to be secure
    and we strongly recommend you do not implement this code in a production environment.
    As we will discuss in the'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'security section, we know some security flaws that must be patched before production
    usage. Out of our design goals for our application, we developed a database structure
    (see Figure 10.3). This database structure, encompassing six tables, is designed
    to offer a clear, lucid definition of the data that will be used by the database.
    Please refer to it in the discussion that follows.


    ![](img/a6b8fd6f7dfea65f9a1b7e4c40482932_357_0.png)


    **Figure 10.3 The database structure.**


    # **Data Flow**


    When the user first connects to the Web site


    After the session is created, the user has a **session_status** of 0. This **session_status**
    means that the user is browsing and has not authenticated. Since purchasing items
    doesn''t have a checkout button. The user is allowed to browse and add items to
    the shopping cart (the carts database) without authenticating. Upon authentication
    (or registration), the **session_status** is increased to 1, which means that
    the user now has a checkout button. Also, the **user_id** is placed in the session
    database.


    When the user clicks checkout, the **session_status** is increased to 2, which
    means that the user has completed the transaction. At this point, it would be
    possible to send e-mails to the buyer and seller indicating that a transaction
    has taken place. (For security purposes, an unencrypted credit card number never
    be sent via e-mail.) The best thing to send via e-mail would be a unique URL (i.e.,
    http://www.shoppingcart.org/view_session_id=323), which would send the viewer
    to a page that wouldn''t allow someone who intercepted this e-mail to get any
    sensitive information, or to one that would be protected behind a login.'
