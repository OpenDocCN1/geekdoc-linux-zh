    # PHP, MySQL, and Apache: Installing the Sample Application


    This application will work with PHP compiled as either a module for Apache (mod_php)
    or as a CGI module. To verify that PHP has been installed correctly with your
    Web server, enter the following and save it as test.php3 in your Web browser''s
    DocumentRoot directory:


    ```

    <?php

    phpinfo();

    ?>

    ```


    When you browse to http://webserver/test.php3, you should see a large information
    page stating all your PHP installation. Under the extensions section, verify that
    a MySQL extension is loaded. If it is not, you will need to compile the MySQL
    extension. (See MySQL documentation).


    To create the database schema, a database needs to be created and the database
    dump needs to be loaded. If your database is not already created, select a database
    and enter the following command:


    ```

    servername:~$ mysql -u username -p

    Enter password:

    Welcome to the MySQL monitor. Commands end with ; or \g.

    Your MySQL connection id is 106270 to server version: 3.22.27

    Type ''help'' for help.mysql> CREATE DATABASE shopcart

    ```


    Import the dump file into MySQL using the following command:


    ```

    servername:~$ mysql -u username -p shopcart < shopcart.sql

    ```


    Finally, edit the init_db_variables() function in the index.php3 (found in Appendix
    A) to match your database server name, username, password, and database name.
    Browse to http://webserver/ and ensure that the shopping cart displays without
    errors. If you get a directory listing or "Permission Denied," you may need to
    add index.php3 to your DirectoryListing in Apache''s httpd.conf. Alternatively,
    you could create an HTTP response page index.html and it would immediately transfer
    the browser to index.php3.


    # PHP Database Connectivity: Making the Connection


    In the function connect_db(), we connect to the database server and select the
    database we plan to use. Make it easy to port this application to another database
    server, we separated the variables into init_db_variables().


    ```

    MYSQL_CONNECT($db_server, $db_username, $db_password) OR DIE("Unable to connect
    to database");

    @MYSQL_SELECT_DB("symetix") or die("Unable to select database");

    ```


