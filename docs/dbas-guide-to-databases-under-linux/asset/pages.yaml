    # Introduction


    Informix is a powerful commercial database just like Oracle. Informix, Oracle,
    and other enterprise-level databases like IBM’s DB2 and Sybase compete on a variety
    of platforms, but they are focused primarily on enterprise-level database management,
    where large volumes of database traffic and storage are required. These products
    are considered serious contenders for businesses that are looking for a production
    database server, one that meets certain load requirements usually found in mid-sized
    to large corporate business environments.


    Informix was one of the first databases on UNIX; its roots are in C-ISAM. Informix
    had the first ISAM (Indexed Sequential Access Method) product for UNIX, called
    C-ISAM, which is still available today, and yes, you can get it for Linux. Current
    database products on the market use an ISAM methodology for their operation, without
    exception. Informix has many other first in the database world, and now can compete
    with much more expensive products. All of these database products, including many
    others not mentioned here, meet a minimum requirement with ISO and the SQL standard
    as being entry-level database products. They all meet the minimum entry point
    for basic SQL compliance; in addition to the entry-level features that are allowed
    under the SQL specification, they are also allowed-level features as optional
    features. As no single vendor has implemented all the SQL specifications, but
    most vendors meet the minimums, and then choose to implement'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'additional features when they have an opportunity to increase their competitive
    edge. For more information on the SQL standard be to search the World Wide Web
    (WWW) and to learn more about it. Vendors also add additional features when end-users
    scream for, or when the competition adds a feature that the end-users like and
    now simply cannot live without, in competing products.


    This chapter focuses on how to install and bring up Informix in the Linux operating
    environment. The focus is not only on an enterprise-level database but also on
    an engine that is scalable from Linux upward to the larger servers on the market,
    primarily in the UNIX operating systems. Much of what you learn here can be applied
    to the other UNIX versions of Informix Dynamic Server in the rest of UNIX, and
    to some degree the NT world; however, for now you will find it not easy to work
    without any comparisons to NT. Most of the enterprise engines on the market are
    on UNIX and NT, and in some cases, MVS (the mainframe). The only ones not found
    on UNIX are the database products from Microsoft, who choose NT as their banner
    platform from scale. Microsoft is only now starting to take their database market
    seriously, building products for data warehousing, and data transformation to
    complement their SQL Server line. Once a platform in the Intel x86 architecture
    is big enough for NT to enable it to run as fast as a UNIX or other platform,
    then Server may have a chance in this arena. Until you notice significant performance
    differences between UNIX and NT, and of course, NT will tend to perform well in
    small group environments as Informix is concerned, but better performance ratios
    are found in UNIX and Linux.


    Preference usually follows along lines of exposure. If a developer is exposed
    to Informix first, that developer most likely will continue to support Informix
    out of personal preference. This is especially true once you see how easy Informix
    is to manage some of the other products on the market. The reason is simplicity:
    A typical Oracle instance takes approximately 600MB of disk space for the software,
    not to mention the additional space needed for databases. A typical Oracle installation
    is far more complicated than Informix, not only in software layout, but also in
    configuration. Simply a look at the Oracle software directory and you can see
    the difference you''ve installed Informix to next. It can take much longer to
