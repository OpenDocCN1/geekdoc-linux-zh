  md: 'services Linux has always supported.

    Some of the features included with most Linux variants that make Linux a great
    database server are


    +   - Multitasking


    +   - SMP


    +   - 32- and 64-bit virtual memory models


    +   - Protected kernel mode


    +   - ELF standard binaries


    +   - Multi-user


    +   - Free GUI


    +   - Binary compatibility with other UNIX variants


    +   - Extensive network protocols and services support

    - All the standard UNIX network services like HTTP, FTP, Telnet, etc.


    # Multitasking


    With a true 32-bit Intel (64-bit on supported RISC CPUs) multitasking environment,
    Linux has the ability to run multiple programs apparently "simultaneously," which,
    in reality, is a very fast round robin—but who cares, it works. This is an essential
    requirement of a database server. Many process threads can be started simultaneously
    and execute in parallel, offering excellent performance and optimization of IO
    channels.


    # Symmetric Multiprocessor Support


    Out of the box, Linux will support 1, and in some cases, up to 16 CPUs, depending
    on the variant. This multiprocessor support makes Linux an excellent platform
    for a database server, able to handle many processed threads simultaneously. Almost
    all major vendors sell multiprocessor servers specifically for database and web
    services. The Linux kernel is well-designed to handle these multiple processors,'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'providing almost full utilization of each additional processor instead of a
    declining utilization ratio as each new processor is added, as some other operating
    systems provide.


    # 32-Bit (and 64-Bit RISC) Virtual Memory


    Linux uses the full 32-bit memory management services to provide virtual memory
    of 4GB on Intel platforms and 16 exabytes when using 64-bit Linux on any RISC
    processor. Each new process gets an independent user-level process with 2GB of
    virtual space available if required; in reality, it AIX only enough RAM as needed
    to support the process. This provides security and independence between every
    process on the system.


    # Binary Compatibility: Standard Extremely Low Frequency (ELF) Binaries


    Linux has embraced the standardized ELF-based binaries’ and shared libraries’
    (similar to dynamic link libraries (DLL but not compatible) application strategy.
    This allows applications to run on multiple operating systems without need of
    recompilation. SCO UNIX 4.2, SVR4, AIX, and most Linux Intel-based versions are
    among the many UNIX variants that are moving toward this compatibility design.
    For example, Corel Draw! for SCO also runs under Linux.


    # Multi-User


    True-user capabilities (not just multiple access, which is what NT mostly provides—rarely
    are there separate users logged into one NT host) provide for multiple users to
    run multiple processes on a single Linux server host.


    # Fully Protected Kernel Mode Operations


    The Linux operating system runs all applications in fully protected mode (no process
    can circumvent the operating system). No user application can interfere with any
    user application unless it is specifically allowed, and there is no direct access
    to any hardware in Linux. These are the two main problems with DOS-type operating
    systems.


    # Free X Window GUI


    The Linux Graphical User Interface is a completely free GUI, based on an X/Open
    standard version of the X Window System (most existing X-based programs will run
    under Linux without any modification). The X Window System has been around since
    the early 1980s, predating the Microsoft Windows design. You may even notice that'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'the new of Win9x / NT is very similar to the X Window standard that has been
    around for quite a bit longer.


    # Limited DOS / Windows Application Support or VMware


    Supplied with most versions of Linux is a DOS Emulator called DOSEMU and a Windows
    Emulation package called WINE. Both of these packages provide simple, albeit limited,
    support of applications that do not try any rules, like directly accessing hardware
    in some cases.


    Another bright spot for Linux is a Virtual Memory Emulation package called VMware.
    VMware offers FULL Windows 3.x / 9.x / NT support allowing Linux to be a host
    operating system with one or more of these guest operating systems installed in
    a virtual world, sharing with the Linux OS local memory and hardware resources
    equally and at the same time. You literally can have Linux and one or more Windows
    Operating Systems running at the same time on the same machine in different X
    windowpanes! This means you could provide desktop to all users on the network
    on any relatively powerful PC (i.e., with the proper hardware: 266+ MHz, 96+ MB
    RAM, disk space). Note that VMware offers the equivalent virtual memory management
    product for NT. You can install Linux as a guest OS NT and run both desktops together
    from a Windows window. You can download a 30-day free version from www.vmware.com
    for either OS.


    # Extensive Networking Support


    Perhaps the biggest selling point for any Linux version is the extensive networking
    support provided. This includes emulation packages and the related protocols for
    all other networking operating systems commonly used on PC hardware. Additionally,
    there is extensive media support for various types of interfaces other than standard
    Ethernet and Token Ring, like ISDN and even Ham Radio support. Full native protocol
    support is supplied for Macintosh, DOS, Windows NT / 9x /3.xx, Novell, and OS/2
    through various add-on packages, making Linux appear like a local native server
    and to client to these other OS versions.


    # Standard Web Services


    Internet services support is provided with the Apache web server (one number in
    the world), the most dominant web server product running http on the Internet,
    as well as full versions of the latest CGI interfaces: Perl, Java, etc. Linux
    is an excellent web server; Apache is a top-of-the-line web application that has
    integration hooks for all the database services using these CGI interfaces. The
    only web interface not supported locally is Active Server Pages.'
