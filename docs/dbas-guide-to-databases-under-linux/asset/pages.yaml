  md: 'Dbaccess is easy to use, and runs nicely in a VT-100 window. It offers an excellent
    scratch pad to work with your database. There are also GUI-tools that Informix
    is developing and eventually will offer as part of the engine distribution.


    # Onmonitor


    One of the tools we didn''t use for the installation is onmonitor. Onmonitor is
    available for engine monitoring and maintenance, but does not offer you a lot
    of flexibility or handholding.


    You can run onmonitor and change or view many of your settings for the engine;
    however, most Informix DBAs opt for command-line control. In a production environment,
    the more control you have, the better off you are, simply because one wrong command
    can erase company data. Simply run onmonitor and the following output will appear
    as a characterbased user interface along the same lines as dbaccess:


    ```

    Dynamic Server: Status Parameters Dbspaces Mode Force-ckpt ... Status menu to
    view Dynamic Server.

    ```


    ```

    --------------------On-Line------- Press CTRL-W for Help. --------------------

    ```


    For example, you can view the same information with onmonitor as you can with
    the onstat command:


