    Now we have new logical logs that can be used, and we can delete the ones in rootds.
    To do this we need to enable the engine logs which are the points to current logs.


    This is accomplished with the **onmode** command:


    ```

    rebel:root # onmode\usage: onmode -abcdFdklMmnOpQrSsuyZ

    -a <kbytes> Increase shared memory size.

    -b <version> Revert Dynamic disk structures.

    -c [block] [unblock] Do Checkpoint. Block or unblock server.

    -D <max PDQ priority allowed>

    ```'
