    # Preparing Your RedHat Workstation for a DB2 Installation


    Before you begin to install a DB2 product on your RedHat workstation, you have
    to prepare your workstation for DB2. The tasks involved in enabling your workstation
    for a DB2 product depend on which version of RedHat Linux you are running. The
    Linux operating system evolves, and relationships strengthen between IBM and the
    Linux vendors, you should expect to see these types of preparation steps disappear.
    Until then, follow these instructions carefully to ensure that your installation
    runs smoothly and is configured in the least amount of time. Before you can install
    a DB2 product on a Linux-based workstation, you must ensure that your Linux workstation
    meets the following requirements:


    +   1. 1. Linux kernel 2.0.35 or higher

    2. 2. RPM (RedHat package manager)

    3. 3. pdksh package (public domain Korn shell)

    4. 4. glibc version 2.0.7 or higher

    5. 5. libstdcc++ version 2.8.0 or higher


    > NOTEIf you use the rpm -qa command to list the installed packages on RedHat
    version 6.0 or version 6.1, only the libstdc++ 2.9.0 library is shown; however,
    DB2 requires libstdc++ 2.8.0. The libstdc++ 2.8.0 library is included with the
    base installation. You can verify this by checking the contents of the /usr/lib
    directory.


    # Preparing RedHat Version 5.2 and Version 6.0 for a DB2 Installation


    A default RedHat version 5.2 and version 6.0 installation is pretty easy to enable
    for DB2. All you need to do is adding the missing pdksh package that is required
    to run DB2 Installer. This package is available on the RedHat version 5.2 and
    version 6.0 CD-ROMs, in the /RedHat/RPMS directory, and can be installed using
    the rpm -i command.


    > TIPIf you are using Gnome or KDE environment, you could use a graphic tool to
    add this package.

    For example, if you wanted to install the pdksh-5.2.13-3 package on either version
    of RedHat, enter the following command:


    ```

    rpm -i pdksh-5.2.13-3

    ```


    You are now ready to install DB2 on a workstation that is running RedHat version
    5.2 or version 6.0. Go to the section, Installing DB2 Universal Database Version
    6.1 on RedHat, later in this chapter.'
