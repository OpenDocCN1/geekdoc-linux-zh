  pgno: 144
- img_proc: true
  md: '```

    -d <standard{primary|secondary servername}> set DR server type

    -F Free unused memory segments

    -k Shutdown completely

    -l Force to next log

    -M <decision support memory in kbytes>

    -m Go to multi-user on-line

    -n Set shared buffer cache to non-resident

    -O Override space blocking a checkpoint

    -p <+# class> Start up or remove virtual processors of a specific class

    -Q <max decision support queries>

    -R Rebuild the /INFORMDIR/etc/.infos.DBSERVER file

    -r Set shared buffer cache to resident

    -s <max decision support scans>

    -s Shutdown to single user

    -u Shutdown and kill all attached sessions

    -y Do not require confirmation

    -Z <address> heuristically complete specified transaction

    -z <sid> Kill specified session id

    ```


    The three options we are interested in are the -l, -c, and -m options. The two
    options -l and -c manage the logs. The -l option forces the engine to use the
    next log and the -c tells the engine to perform a checkpoint. Checkpoints are
    covered in the Administrator''s Guide, and are a mark that the engine puts on
    log activity to allow logs to be backed up, and how much to recover when doing
    a database restore. The -m option allows us to bring the server back up into multi-mode.
    We need to not only move the current log activity to the new logs, but also perform
    a checkpoint to free up the old logs so they can be deleted. The engine should
    be totally on the new logs before we delete the old ones. You simply perform the
    following commands on the old logs unstat shows that the engine is using the new
    logs. In our particular case, need to do this three times. The following outputs
    logs after running onmode -c three times:


