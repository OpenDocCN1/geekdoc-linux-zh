  md: "# Configuring the Computers on Your LAN to Use a Single IP Address\n\n# # Creating\
    \ an IP Masquerade Firewall Rule Set\n\nYou can easily create a very basic and\
    \ minimal IP Masquerade firewall rule set by following these steps:\n\n+   1.\
    \ First, figure out the interdependencies of the IP Masquerade kernel modules\
    \ using the following command:\n  /sbin/depmod -a\n\n+   2. Support the masquerading\
    \ of FTP file transfers with the following command:\n  /sbin/modprobe ip_masq-ftp\n\
    \n+   3. Allow use of Dynamic IP Addressing (DHCP) if your ISP uses it by typing\
    \ the following command (place a comment [#] at the beginning of the next line\
    \ if your ISP does not use DHCP):\n  echo \"1\" > /proc/sys/net/ipv4/ip_dynaddr\n\
    \n+   4. Allow the kernel to perform IP forwarding by masquerading by typing the\
    \ following command:\n  echo \"1\" > /proc/sys/net/ipv4/ip_forward\n\n+   5. Set\
    \ timeouts for IP Masquerade with this command:\n  ipchains -M -S 7200 10 160\n\
    \n+   6. Allow IP masquerading for your LAN 192.168.0.nnn (use your LANs IP address)\
    \ using these lines:\n  ipchains -P forward -s 192.168.0.0/24 -j MASQ\n  echo\
    \ \"/etc/rc.d/rc.firewall done.\"\n\n+   7. Save your IP Masquerade and firewall\
    \ rule set into a file named /etc/rc.d/rc.firewall.\n\n+   8. Protect your /etc/rc.d/rc.firewall\
    \ rule set so that only the user logged in as root can use it, using the command:\n\
    \  chmod 700 /etc/rc.d/rc.firewall\n\n+   9. If you want IP Masquerade to automatically\
    \ start after a reboot, it must be added to your startup scripts. Do so by appending\
    \ the line /etc/rc.d/rc.firewall to the end of the /etc/rc.d/rc.local file."
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Chapter 6: Configuring a Network Connection


    You may be thinking that it requires quite a powerful computer to run all these
    communication protocols and to take care of all your LAN firewall needs. Well,
    Linux will save you even money. You know that 486 with the s-l-o 50MHz processor
    and a puny 16MB of RAM—then you can''t run any of your programs on? That 486 will
    quite easily and happily work as your Red Linux router. A 486 computer has no
    trouble keeping two dozen computers connected and protected. It can easily saturate
    a T1 line or keep up with your cable and DSL modem.


    IP Masquerade will work almost any way you want to. It can use your PPP POTS modem,
    cable and DSL modems, or FDDI corporate communications. IP Masquerading will allow
    the use of the most popular services found on the Internet, including POP, SMTP,
    HTTP, FTP, NNTP, Telnet, and VRML. The TCP/IP traceroute and ping are also available
    when you use IP Masquerading.


    # A Proxy Server Squid


    Red Hat will allow your Linux computer to provide a connection between your LAN
    and the Internet without using routing—that is, through the use of a proxy server.
    The biggest advantage of using a proxy server is that no one needs to know about
    all the arcane numbers demanded from you—no one, not that is, except the person
    who configures and maintains the proxy server. The only information a person on
    your LAN needs to know is the name or IP address of the Red Hat proxy server.
    There may be a few people who would like to use services other than just HTTP,
    however; if they know a few port numbers, they will have access to those services.


    One server, Squid, is installed in all the smallest Red Linux installations. The
    basic package is easy to configure, and Squid can grow in capability as your networking
    needs and knowledge grow. The basic configuration of Squid will allow the most
    popular services found on the Internet, namely HTTP and FTP. Another advantage
    to Squid is that it allows the use of disparate operating systems. Everyone can
    use the operating system of his or her choice and painfully use the Internet or
    access external LANs.


    First, you need to check if Squid is properly installed. You can do this by issuing
    the following command:


    ```

    rpm -q squid

    ```


    Linux will reply with either the package version number or a statement saying
    that the package is not installed. Install the package from the Red Hat 7 CD,
    by type the following command (after placing the CD in the drive of course):


    ```

    rpm -iv /mnt/cdrom/RedHat/RPMS/squid*

    ```


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_199_0.png)'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Configuring the Computers on Your LAN to Use a Single IP Address


    To see if the Squid process (known as a daemon) is installed, type the following:


    ```

    ps x | grep squid

    ```


    > The symbol | is referred to as a pipe.


    If the Squid daemon is available and running, you will see a return message similar
    to the following:


    ```

    860 pts/0 S 0:00 grep squid -D

    ```


    Once you have determined that Squid is available on your computer, go to the Squid
    home page at squid.nlanrt.net. There, you can find a better configuration file
    to use to set Squid up and running. This new configuration is still a very basic
    one; Squid can be expanded to include a staggering number of services and restrictions.
    The default installation from the Red Hat 7 CD puts a basic configuration in the
    place, and there is really only one change you will need to make. The line


    ```

    http_access deny all

    ```


    must be changed to


    ```

    http_access allow all

    ```


    From within Linuxconf you can start the service and enable it so that it it starts
    upon boot.


    You can use one of your LAN computers to set up the Squid server as a proxy. You
    probably have Netscape as a Web browser on your system. To set Netscape to use
    the Squid proxy, open Netscape and choose Preferences, Advanced, Proxy. Set the
    proxy setting to Manual, add the Squid''s name (which you defined earlier in the
    Squid installation process), and set the proxy port to 3128. You should then be
    able to connect to the Internet from the LAN computer on which you just configured
    Netscape. Repeat the browser configuration on each of your LAN computers.


    Should Squid not work as you expected, make sure all the configuration entries
    are correct and that your Squid server and your Red Hat Linux computer are connected
    to the Internet. If you still cannot connect from your LAN, look at your debugging
    files at /var/log/squid. The Squid home page at squid.nlanrt.net also has debugging
    suggestions you may want to review.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_200_0.png)'
