  md: '# Working with Non-Linux Partitions


    Another file partition is not exactly a peripheral, it certainly is a device on
    your PC that can be exploited like any other. If you have another partition on
    your computer, such as a Windows partition, you can easily access its file system
    from Linux.


    # Connect to a New Partition


    This task will show how to connect to a non-linux file partition, such as Windows
    over your PC.


    +   1. While logged in as root, type /sbin/fdisk -l in the Terminal window. This
    will determine the device on which the partition exists.


    You will see a list of all logical and actual hard disks on your PC, including
    a line that includes Win95. At the beginning of that line will be a /dev/hdax
    There is also value such as FAT32 or FAT16.

    2. mkdir /mnt/win or mkdir /mnt/windows, naming the directory something that you
    can remember. This will create a mount point from which the Windows partition
    can be accessed.

    3. Mount the partition by typing mount -t vbox /dev/hdX /mnt/win. Remember to
    replace the x with the correct drive number. Your Windows file system can be accessed
    like any other file directory.


    > Re-mount the partition after a halt or reboot, simply type the mount command
    once more. Or, add a line similar to this one in the /etc/fstab file:


    /dev/hdal /mnt/win vbox defaults 0 0.


    This will mount the partition for every time Linux starts.


    # Conclusion


    In this chapter, you learned the finer points of connecting important peripheral
    devices to your computer. As Linux continues to grow, more devices will be included
    in the Linux world. This will cause the Linux configuration methods to become
    more simplified. Until then, use patience and care when dealing with peripheral
    set up.


    In Chapter 8, “Customizing Your Desktop’s Appearance,” environments and window
    managers will be examined, as well as how to change fonts and mix audio.'
  merge: -1
