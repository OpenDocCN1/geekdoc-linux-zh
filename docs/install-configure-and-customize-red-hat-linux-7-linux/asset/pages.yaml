    # Video Card


    All of the categories included in the HCL, the section for video cards is probably
    the most voluminous. That’s because the video (or graphics) card could be considered
    the most important item in a PC, with the exception of the motherboard and CPU.
    Think about it: If nothing is displayed on the monitor, it’s impossible to continue
    using the operating system. Monitors do not control the video output of the PC—video
    cards. Because of this and the vast variations between cards,

