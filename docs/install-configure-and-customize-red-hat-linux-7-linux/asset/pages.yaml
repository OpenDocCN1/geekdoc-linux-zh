  md: '# # Adding a Network Printer


    Getting to a printer on a network is no big deal, either. There are three types
    of network printers that Linux can be configured to use:


    +   - UNIX/Linux printers

    - Windows printers

    - NetWare printers


    Configuring these printer types is similar to configuring a local printer. However,
    rather than pointing the data to a device''s spool directory in the local file
    system, the data is directed to a remote printer''s queue—the storage area where
    print jobs are held until printed.


    Table 7.1 illustrates the information you will need to connect to a remote printer
    for each network type.


    # ## Table 7.1 Remote Printer Settings


    | Network | Protocol | Other Values |

    | --- | --- | --- |

    | UNIX/Linux | TCP/IP | Remote host, Remote queue |

    | Windows | TCP/IP, SMB | Host name of printer server, IP number of server, Printer
    name, User, Password, Workgroup |

    | NetWare | NCP | Printer, server name, Print, queue name, Password |


    When printing to a network printer, it is important that the network recognize
    the user name and password of the Linux user. In a UNIX or Linux scenario, this
    is given; but you must make sure the incoming Linux user has access rights to
    the network print queue.


    In NetWare, the user must have rights to access a network printer. In Windows,
    the printer itself must be set to be "shared" first.


    > For security reasons, the user names and passwords used to access a remote NetWare
    or Windows printer must be different from any user name and passwords that access
    your Linux PC. This is because the printer passwords are stored unencrypted before
    being used by NetWare nprint or the Samba smclient programs. Be creative!


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_208_0.png)'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Chapter 7: Configuring Printers, Sound, and Other Devices


    Connecting to a Windows printer, a common scenario, will entail the use of the
    Samba, tool needed to use the SMB protocol to converse with Windows machines.
    While the configuration of Samba is a bit beyond the scope of this book, an excellent
    tutorial on Samba configuration can be found at http://www.linuxnewbie.org/nhf/intel/network/samba/samba1.html.


    Presuming your Samba settings are configured correctly, you should have little
    trouble connecting to a Windows printer.


