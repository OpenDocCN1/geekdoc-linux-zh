  md: '# Chapter 3: Configuring the X Window System


    Take an onion. Peel away the brown, crinkly stuff on the outside. What are you
    left with? A peeled onion. If you pull off another layer, you are left with...?
    That''s, a smaller peeled onion.


    While not exactly the most stunning comparison, in some ways it''s applicable
    to the relationship between Linux, X server, and a window manager on a Linux system—they
    are all layers of a big onion or an operating system—except they don''t make you
    cry.


    In this chapter, the layers of the Red Hat Linux 7 OS are examined, followed by
    a look at how the deepest layer of the graphical interface, X server, can be configured.


    # What Is X?


    Non-Linux users are often a bit confused about which components make up X. In
    the Microsoft Windows environment, you have the operating system with the Windows
    operating system interface running on top of it, as illustrated in Figure 3.1
    “Running on top” means that Windows is essentially one big program that runs from
    the DOS platform, essentially no different from a program like Doom. The upshot
    of this is that you must DOS running in order to run Windows.


    For Windows NT users, it''s a bit more simplified. Windows NT (like Windows 2000)
    is a true graphical user interface that runs on its own. The advantage here is
    that you really get what you see. You can still run DOS when you have, but in
    Windows NT, a DOS emulator runs within Windows. One disadvantage to Windows NT
    is that your PC must have a lot more memory and speed to run efficiently as as
    comparable Win98 system.


    The Linux system you have just installed is most analogous to the DOS/Windows
    system. Like DOS, Linux is a text-based, command-operating system (albeit a much
    more sophisticated one). You can perform many functions using just the Linux operating
    system, and many people do. Many more people, however, have been bitten by the
    GUI bug and are accustomed to using windows, menus, and dialog boxes to get things
    done.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_101_0.png)


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_101_1.png)


    | Windows 95/98 |

    | DOS |


    Figure 3.1 The DOS/Windows relationship.'
  merge: -1
