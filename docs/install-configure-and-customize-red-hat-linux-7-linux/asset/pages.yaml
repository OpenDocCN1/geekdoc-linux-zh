    # Determining Language, Keyboard, and Mouse Settings


    Early in the installation process, Red Hat Linux gathers important information
    so that its installation can continue smoothly. This information is centered around
    input—specifically, how you will input data into both Anaconda and, later, Linux.
    You''ll need to select the language, keyboard, and mouse device you want to use.


    The very first screen of the installation path requires you to select the language
    you will use. This will be the language used during the installation process,
    not necessarily within Red Hat Linux. From the list of languages, select your
    preferred language and click the Next button.


    The Keyboard Configuration screen, shown in Figure 2.2, appears. There are three
    categories here used to define your keyboard: Model, Layout, and Variant


    While keyboard models are currently ubiquitous, there are some variations among
    styles. One many Americans will recognize the difference between “natural” (ergonomically
    designed) keyboards and the more standard (flat) 101-key keyboards. Check for
    your keyboard model and style in the Model list. If you do not see your specific
    keyboard model, select Generic 101-key PC.


    Layout refers to the alphanumeric characters used by the selected keyboard. For
    example, someone using the German language will need characters as ü, and if you
    live in Great Britain you might require characters as £. In the United States,
    of the U.S. English choices will be appropriate.


    The Dead Keys option should be selected if you want an English layout but also
    use alternate characters that require the creation of dead keys. If you have a
    newer computer, choose the ISO-9995-3 option, as it will enable your keyboard
    to adhere to an international standard.


