  md: '# Chapter 9: Customizing Your Desktop''s Usability


    # # Creating New Print Queues with Common Settings


    This customization applies primarily to dot matrix and inkjet printers. If you
    have a laser printer, you can skip ahead.


    Although you likely have only one printer attached to your computer, at times
    you may use it in different ways. For example, when I''m printing my resume, speed
    is not an issue. At other times—for example, when I am printing a to-do list for
    the weekend—there is no need to waste extra time or ink creating a high-quality
    copy.


    Chapter 7, "Configuring Printers, Sound, and Other Devices," explained how to
    configure your printer and create a printer queue. To best support the way you
    work—sometimes you need high quality output, and other times—you should actually
    create two printer queues. Such a setup is convenient, even if an application
    does not allow you to define the print quality, you can still control its quality
    by sending the job to a particular queue. Use the Configure dialog box (shown
    in Figure 9.11) to configure individual queues.


    # ## Creating a Low-Quality Print Queue


    Start X while logged in as root and run printtool as you did in the "Printers"
    section of Chapter 7. Create a new print queue, duplicating the settings of the
    existing one. Give it a different name, such as "draft." Click Select. Select
    your printer as before, but choose a lower resolution.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_261_0.png)


    Figure 9.11 Creating a new print queue.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Creating a High-Quality Print Queue


    Some inkjet printers are capable of slightly overlapping the print passes, so
    that horizontal banding is lessened. This is often referred to as weaving or interleaving.
    If your printer does not this by default, you might want to add this option to
    your high-quality print queue.. To do so, start printtool and then edit your high-quality
    print queue Extra options in the lower-right corner of the window. Add either
    the -dMicrowave or -dSoft option for forcing interleaving. Not all inkjet printers
    support these, so you may have to experiment.


    # Enabling Drag-and-Drop Printing


    A printer icon on the desktop to which you can drop files makes printing a snap.
    This is easy to set up in KDE and GNOME.


    # KDE


    KDE''s desktop does not come with a printer icon, but you can set up one very
    quickly by creating a desktop icon that points to the application klpq (shown
    in Figure 9.12).


    To make the new desktop icon, follow the steps in the next task.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_262_0.png)


    Figure 9.12 klpq will let you drag-and-drop files to the printer queue.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Creating Desktop Icons in KDE


    You can create icons to start applications in KDE by following these steps:


    +   1. Right-click your desktop and select New, Application. The krootwm dialog
    box will appear.

    2. Type in a name for the new application''s link, such as klpq.kdelink.

    3. Click OK. The krootwm dialog box will close and the kfm dialog box will open.

    4. Click on the Execute tab. The Execute page will open.

    5. Type the command to start the application in the Execute field.

    6. Click OK. The kfm dialog box will close and the new icon will appear on the
    desktop.


    After the icon is made, all you need to do is click it and verify that it refers
    to the correct print queue. It defaults to the BSD style lpr daemon, which is
    correct for Red Hat.


    You might want to make a copy of the printer object and modify it for your draft
    print queue. It is a little difficult with KDE to make a copy of an object on
    the desktop. You may want to simply make a copy of it from the command line:


    ```

    $ cp ~/Desktop/klpq.kdelink ~/Desktop/draft.kdelink

    ```


    If the copy does not appear on the desktop, you may need to right-click on the
    desktop''s background and choose Refresh Desktop. Edit the properties of the copied
    printer so that it joins your draft queue rather than the high-quality queue.
    For example, on the Execute page, change klpq to klpq -Pdraft @.


    # GNOME


    To create a drag-and-drop printer icon in GNOME, select Applets, Utility, Printer
    Applet in the Main Menu. A printer launcher will appear on the panel.


    Right-click the printer launcher on the panel and choose Properties. In the Printer
    Properties dialog box, shown in Figure 9.13, you can give the printer a different
    name and direct it to a queue by changing the print command. Because of GNOME''s
    session management, these icons will reappear whenever you restart GNOME.'
  merge: -1
  pgno: 263
