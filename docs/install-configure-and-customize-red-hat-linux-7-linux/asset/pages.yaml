  md: '# Changing KDE''s Window Manager to Blackbox


    Use Blackbox as a window manager with KDE, you must create a modified version
    of the startkde script. Follow these steps:


    +   Make a copy of the startkde script so that you can modify it. You can use
    commands similar to the following:


    $ mkdir -~/bin


    ```

    $ cp /usr/bin/startkde ~/bin/mystartkde

    ```


    +   Edit the last line in the file, changing it to start Blackbox, as it appears
    in the sample code:


    ```

    sleep 2 ; exec blackbox

    ```


    +   Now create or modify your X startup script to use ~/bin/mystartkde. The following
    commands create a new startup script:


    ```

    $ cat ~/.Xclients

    !/bin/sh

    exec ~/bin/mystartkde


    Press Ctrl+D when finished.

    $ chmod +x ~/.clients

    ```


    As with GNOME, using a different window manager causes some of KDE''s features
    to be lost. Virtual desktops and the pop-up task list are two features that will
    not work in KDE without them.


    # Customizing Window Managers


    Window managers often have settings that can be modified independently of the
    desktop environment''s settings. You can customize each of Red Hat''s six window
    managers.


