- img_proc: true
  md: '# Chapter 11: Adding Hardware


    the first Linux prompt explains what is being found by the kernel and various
    device drivers (see Figure 11.1). It is important for you to understand that text
    that you can later troubleshoot any hardware problems:


    +   - The first line displays the kernel version and the version of the compiler
    that built it. It isn''t really important to know this unless you later want to
    recompile your kernel.

    - Next, the speed of your CPU is displayed. That speed is detected at boot by
    the kernel. It should be pretty close to the speed you know your CPU to be. For
    example, the CPU on the system shown in Figure 12.1 is a 333MHz Intel Pentium
    II; the kernel detected a speed of 334MHz, which is pretty close.

    - The console line tells you the currently used display font. You can set Linux
    console to display any other font, but the default is standard fixed VGA 80 columns
    by 25 lines.

    - You should ignore the line about BogoMIPS. It is commonly not the same as your
    CPU speed, and that is quite normal.

    - One very important line is the memory unit. Here, the kernel is reporting how
    much RAM is detected in your system. This is a place where the kernel may be mistaken,
    especially if you have more than 128MB of memory or if you have an old system.
    The details as to why this happens are, but it is easy to fix. For example, if
    you see a number near 16000K and you have 24MB of RAM, you will need to correct
    the kernel; you''ll learn how in the “LILO” section later in this chapter.

    - The next lines display information gathered about your CPU.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_287_0.png)'
