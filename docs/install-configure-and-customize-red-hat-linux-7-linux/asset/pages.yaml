  md: '# Chapter 7: Configuring Printers, Sound, and Other Devices


    Early computers did not communicate well. The first digital calculating device
    that could safely be called a computer was the Harvard Mark I, a five-ton, 750,000-component
    device that read its programming code from punch cards. Data was output on a similar
    medium. Multimedia was a bit of wash as well; the only sound the Mark I generated
    was the internal clicking of its components, which sounded a bit like "roomful
    of ladies knitting."


    For those of you old enough to remember the Apple and II microcomputers released
    in 1976 and 1977, respectively, you''ll recall that they weren''t big on multimedia,
    either beeps and clicks were all about the sound they emitted. Printing was coming
    along, though, as dot-matrix printers would out of perforated paper.


    Today, however, the number of communication devices that could be connected to
    PCs is phenomenal: printers, speakers, television tuners, cameras, alarm systems—you
    name it. This chapter focuses on connecting peripheral devices to your Linux machine.


    # Printers


    Think about this: You can make a book on your PC. Right now. All you need are
    some good typing skills and about three cases of soda and you''re set. Believe
    me, I know.


    This may not seem like such a big deal to you because you are likely accustomed
    to the PC/printer combination. But a mere two decades ago, you would have little
    chance of finding software and printers capable of performing such a feat. Thirty
    years ago, you would have no


    Again, what''s the big deal? It''s technological advancement, right? True, but
    it is also a huge shift in social dynamics as well. No longer the ability to distribute
    and publish information in the hands of a select few. Now almost anyone with the
    it can generate published works. This decentralization is aided by the nature
    of the Internet, which provides even more avenues of communication. Now a writer
    can generate and send it electronically, letting the reader print it out when
    needed.


    Linux, like any other operating system worth its salt, can use printers seamlessly
    from any application with a print function. First, though, you need to be sure
    that communication occurs between Linux and your printer, whether connected directly
    or through a network.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_203_0.png)'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Adding a Local Printer


    Printers either can be local to your own PC or can exist on a network. Either
    way, accessing them in Linux is not difficult, especially when you work with a
    local printer.


    Local printers are almost always connected to your PC’s parallel port—the device
    known as lp in Linux. In DOS and Windows, the ports are named lpt1, lpt2, and
    so on; in Linux they are the nomenclature lp0, lp1, etc.


    It’s important to remember that Linux handles devices as extensions of its file
    system. Any files (that are not plain-text to begin with) that need to be printed
    are first converted to the printer through Ghostscript, a utility that uses an
    additional printer filter to perform the conversion. After the conversion is finished,
    the data is loaded into the device’s file system directory—example, the printer’s
    file system directory, which is typically /var/spool/. Finally, the data is automatically
    read by the device (in this case, the printer).


    In the next task, you will learn the steps necessary to connect a printer to your
    Linux system.


    # BUZZWORD


    Bus: A device to transmit data from one part of a computer to another.


    # Connecting a Local Printer


    This task demonstrates connecting a local printer to your system.


    +   1. Click the Main Menu icon to open the Main menu.

    2. Choose Programs, System, Control Panel. The Control Panel opens (see Figure
    7.1).

    3. Click the printer to start the Red Hat Linux Print System Manager.

    4. Before the Print System Manager starts the first time, an Error dialog box
    may appear warning that npfs is not installed. If you do not intend to ever connect
    to printers through NetWare, click Ignore (see Figure 7.2).

    5. The Red Hat Linux Print System Manager will be displayed, as shown in Figure
    7.3. Click Add to begin the printer-connection process.

    6. Add a Printer Entry dialog box appears, as shown in Figure 7.4. Select the
    Local Printer option, and then click OK to continue.

    7. A message indicates which ports, if any, Linux was able to detect. Although
    not critical, it is important that Linux detects the port to ensure the right
    port address is obtained. Click OK to continue.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_204_0.png)'
