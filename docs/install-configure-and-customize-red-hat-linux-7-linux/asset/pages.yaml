    # Using route to Trace the Path of Your Connection


    Using the route command will give you information about the path your Internet
    connection is using or attempting to use (see Figure 6.13). The route screen displays
    the destination IP address, the gateway used, and the genmask or netmask used
    by route. The Flags column lists abbreviations for your configuration, which are
    listed in Table 6.1. These abbreviations will help you determine whether your
    network and NIC are actually working.


    # Table 6.1 Route Flag Parameters


    | Flag | Definition |

    | --- | --- |

    | U | Up |

    | H | Host |

    | G | Gateway |

    | R | Reinstate |

    | D | Dynamic |

    | M | Modified |

    | ! | Reject |


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_192_0.png)


