  md: '# Example 3: Deleting Multiple Files with Wildcards


    You can use wildcards to delete multiple files at once without having to type
    individual file names.


    > Be very careful with wildcards. You can very easily destroy files you do not
    want to delete.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_378_0.png)


    If you have multiple files whose names differ by only one character, you can use
    the ? wildcard to represent the character, like this:


    ```

    rm -i temp?

    ```


    That command deletes any file named temp1, temp2, and so on. It does not delete
    a file named temp22, or just plain temp.


    The wildcard in the next example deletes any file that begins with temp in the
    current directory. You can use the * wildcard to match a few files, like this:


    ```

    rm -i temp*

    ```


    Or you can use the * wildcard to match all files in a directory, like this:


    ```

    rm -i *

    ```


    > The interactive option is not necessary, but I''m putting it in the examples
    to encourage you to use it, at least until you''re very familiar with Linux.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_378_1.png)


    # Example 4: Utter Insanity


    You''re just fed up with your system, you can delete the entire directory tree
    with the following command executed as root under the / directory. Be sure you''ve
    got installation disks ready to go.


    ```

    rm -rf *

    ```


    Do not try this at home, and no, I haven''t tried it to make sure it works.


