  md: 'hey say that clothes make the man. If this is true, a lot of us are in big
    trouble. Looks are not, of course, everything, but the more pleasing to the eye
    some-thing, the easier it will be to work with.


    In this chapter you will learn how to customize many aspects of your desktop''s
    appearance, making it more visually attractive and more personal than the default
    installation.


    Selecting your preferred environment and window manager and then customizing them
    allows you to make your desktop look and act exactly as you want. You can also
    configure Linux to use a variety of fonts. For example, you may wish to use the
    same fonts under Linux as you do under Windows, so Web pages look similar for
    both operating systems.


    Linux can further be customized by attaching sounds to a number of events. It
    may not make you more productive, but it can be.


    # Desktop Environments and Window Managers


    Linux, like most other UNIX-derived operating systems, uses the X Window system
    to provide basic graphics facilities. This system does not, however, dictate the
    look and feel of your desktop. The appearance is instead controlled by one or
    more se-rate programs. The most important of these is generically called a window
    manager. Window managers handle tasks such as drawing windows borders, resizing
    windows, displaying icons representing minimized windows, and so forth. A window
    manager is not solely responsible for your desktop''s appearance—other supporting
    programs can certainly be used to spice it up—by your selection of a window manager
    is one cornerstone in influencing how your desktop will look and respond.


    A second influence on the appearance of your desktop is your selection of desktop
    environment—GNOME, KDE, or perhaps none at all. A desktop environ-ment is a collection
    of complementary software, including its window manager along with supporting
    utilities such as a menu system used to launch programs. Optionally, your desktop
    environment can include a selection of basic applications along with a GUI tool
    to provide these applications with a common look and feel.


    # Understanding X Client Startup Scripts


    If you have several desktop environments and/or window managers installed, chang-ing
    the one that starts first is simple. The next section will help you understand'
