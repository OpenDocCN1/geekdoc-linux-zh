  md: 'chapter, the Failsafe login option is a command-line interface setting. If
    selected during login, a small terminal emulation window will open in the lower-right
    corner of the screen.


    Note the description of the window in the previous paragraph:This is a terminal
    emulation window. X is still running, even if a desktop environment isn''t. This
    may appear to be a fine point, but the distinction is important. Some programs,
    such as sndconfig (examined in Chapter 7, "Configuring Printers, Sound, and Other
    Devices") are not meant to be run within X. If you try to run sndconfig in the
    Failsafe mode thinking it''s the true Linux command line (which I actually tried
    way back in my novice Linux days), bad things may happen to your system, such
    as a system lockup.


    Most applications that can run from the console (the true command-line mode) can
    also run in Failsafe mode. Any that can''t will warn you they won''t run within
    X. At that point, you should heed the warning and exit the application.


    > To access the Linux console while in any X mode, try pressing Ctrl+Alt+F1. To
    return to X from Linux, press Alt+F7.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_130_0.png)


    The best use I have found using Failsafe mode occurs when I make a mistake while
    experimenting with video settings. By logging into X in Failsafe mode, I can start
    Xconfigurator and easily repair the error.


    Now that you are familiar with the different login modes, a quick examination
    of the tool sets offered by Red Hat Linux 7 is in order.


