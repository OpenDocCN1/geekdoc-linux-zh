  md: '# Chapter 1: Before You Install Hal Linux 7


    This is not happens in Linux, however. Linux needs at least three partitions to
    work. But if you were to open the File Manager in Linux, you would see the appearance
    of a single drive''s tree structure. What gives?


    Linux manages its files in a completely different way than does Windows. Rather
    using drive letters to refer to a partition and its corresponding file system,
    Linux separates the files and directories needed to compose its single file directory.
    In truth, this "single" file directory is really composed of separate directory
    trees that are seamlessly connected across partitions. Where these sub-trees connect
    or break from the main directory tree are called mount points.


    Rather using drive letters to denote partitions, Linux uses a different naming
    convention:


    ```

    /dev/[Drive Type] [Device Where Partition Resides] [Partition Number]

    ```


    Table 1.10 explains the variables used in this naming convention.


    | Table 1.10 Partition Naming Convention |

    | Variable | Definition |

    | --- | --- |

    | /dev/ | All devices in Linux are managed in the /dev/, including hard drives
    and their partitions. |

    | Drive Type | This is a two-letter indicator of the hard drive type. Possible
    values are hd (IDE disk) and sd (SCSI disk). |

    | Device Where Partition Resides | This is the device it is. Possible values are
    /dev/sda (first SCSI disk) and /dev/hdc (third IDE disk). |

    | Partition Number | This denotes the partition. Possible values are 1–4 (primary
    or extended partitions) and 5+ (logical partitions). |


    Within Linux, this division of directories among partitions will be seamless.
    But when installing Linux, you''ll need to think through what partitions you want,
    what the mount points will be, and how much memory you''ll allot to each partition.


    # You''ll Need


    Red Hat recommends that you have three partitions for optimal performance. You
    can have more, but not fewer. Table 1.11 lists the desired partitions, their space,
    and their mount points.'
  merge: -1
