  md: 'ne of the biggest complaints about Red Hat Linux, and Linux in general, is
    its apparent lack of software applications. What good is is an operating system
    that doesn''t run anything useful?


    First off, this is simply not the case. As experienced Linux user will tell you,
    there are thousands of applications that run on Linux. The misperception lies
    in the fact that many of these applications are either very, very specific in
    their-formed tasks or they are designed to run completely out of background from
    the command line. In each case, it becomes a of "out of sight, out of mind." A
    Linux application is not perceived as "real" by an inexperienced observer unless
    that observer can see and manipulate the application. This infuriates long-time
    Linux users, and for good reason.


    But if Linux is ever to make an impact on the personal desktop market, Linux distributors
    must continue to accede to the perceptions of the general public a bit and incorporate
    more flashy and robust applications within their releases. Red Hat has made significant
    strides in this direction with the development of GNOME and many of the GNOME-based
    tool sets.


    Still, Linux purists deny this the "Microsoftization" of their beloved operating
    system, failing to realize that there is room in Linux for both pure command-line
    users and pure gnome users. Even today, Linux is having incredible success in
    embedded systems, where a graphic user interface is not needed.


    To take this step further, any student of the martial arts will tell you that
    the best way to stop an opponent''s attack is to use the opponent''s energy against
    him—so why not embrace a popular interface? Using this philosophy, Linux will
    then be in a position to surpass Microsoft Windows.


    When you install applications on Red Hat Linux, there are three ways of accom-ishing
    the task: using packages, using the original source code, or using third-party
    setup program. Each of these methods is examined within this chapter.


    # Installing Software Packages


    Nothing is more exciting than opening a new package. Okay, well, a few things
    are more exciting. But, you must admit, it is kind of cool to crack open cardboard
    box and rifle through the Styrofoam peanuts to find that special item you''ve
    always wanted.


    Packages are great ways of moving objects around. They keep items together and
    keep them protected from both the elements and postal workers. The idea of a package
    can be used electronically as well. Many of you have already used'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'compressed files, such as Zip, gzip, or tar. These compressed files are essentially
    packages of separate files that are all mashed together into one compact file.


    Red Hat has developed a way to group the open-source code of Linux and its applications
    into packages as well. This method has proven so popular that many of the other
    Linux distributions have incorporated it into their tool sets. The method uses
    the Red Hat Package Manager (RPM) to track packages and their contents for the
    purpose of installing applications.


    RPM comes in many forms. Within Linux, it is known simply as RPM; in GNOME it
    is GnorRPM; and in KDE it is referred to as Kpackage. Regardless of its form,
    the application follows the same procedure: A package is examined, and RPM determines
    whether all the files for the application to function are contained within the
    package or elsewhere on your Linux system. This is called a dependency check,
    and it is one of RPM''s great features.


    The average application requires a lot of code to run, especially in a graphic
    environment. If all the necessary code were included within every application,
    the executable files would be huge. To circumvent this, programmers often make
    use of code libraries, which are essentially redundant pieces of code necessary
    or useful to all applications. Why make a selection of code to create a dialog
    box when a library of code already has the appropriate information? As a programmer,
    you now all you must do is create a command in your program that represents the
    necessary code in the correct library. Thus, your application is smaller, faster,
    easier and easier to install. The catch in all of this is that the user''s PC
    must have the correct type and version of the code library present for use by
    the application. This is where RPM comes in handy. RPM looks at the packaged application
    and determines what code libraries (or any other application) are required for
    the application to work. The next thing is that RPM will look at all packages
    on your PC. If something is missing, it tells you what is needed to perform a
    successful installation.


    Finally, once the dependencies have been cleared, RPM will enable you to install
    new applications or upgrade existing ones. The next two sections examine both
    ways to use RPM.


    # Installing a New Desktop Environment


    In Chapter 4, “Configuring Your Environment,” you saw how simple it was to switch
    between desktop environments. When installing Red Hat, however, you could choose
    to include both environments on your system. For this example, let''s say you
    only installed GNOME, and now you want to try KDE. The next task shows you what
    to do.'
