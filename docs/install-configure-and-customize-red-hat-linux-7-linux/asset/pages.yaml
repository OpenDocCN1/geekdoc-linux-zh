  md: '# Working with fstab


    One file that you may want to customize when the installation is complete is /etc/fstab.
    This file is responsible for many small annoyances you may encounter. For example,
    if you try to mount a floppy disk and you receive a message indicating that the
    disk has the wrong format, it may be because /etc/fstab requires floppies to be
    in ext2 format. Your floppy may have been formatted through DOS. Further if you
    try to mount a CD-ROM or floppy as a user and find out that the system doesn''t
    allow you to do so, it is likewise because of settings in the /etc/fstab file.
    If you have another operating system installed on your computer and you want it
    to be mounted in /other when you boot, it is again configurable in /etc/fstab.


    The fstab manual page will tell you the syntax for the file, which is not very
    complicated. Unfortunately, the manual page is short and non-descriptive. The
    next paragraphs illustrate how to correct these common minor problems.


    # Drive Issues


    To select the file system to be used with floppies, edit the line beginning with
    /dev/fd0. The third column is the file system type. If you know will always use
    DOS formatted floppies, change it to mdos. If you know your floppies will always
    be formatted in Linux, set the file system to ext2.


    To allow any user to mount a CD-ROM drive, find the line that begins with /dev/cdrom,
    and modify the user parameter, which appears in the fifth column. The line should
    read:


    ```

    /dev/cdrom /mnt/cdrom iso9660 noauto,ro,user0 0

    ```


    The user parameter is the important option here, which tells the Linux system
    to allow users to mount the CD drive.


    Another annoyance you may face with boot messages. Boot messages are designed
    to tell you whether everything was properly loaded and all hardware devices were
    detected. However, you may see strange messages such as the following:


    ```

    modprobe: cannot find net-pf-5

    modprobe: cannot find char-major-14

    ```


    These warnings are not important and do not mean that something has gone wrong
    in your system. They can, however, be annoying. You can turn these warnings off
    by adding the following lines to the file /etc/conf.modules:


    +   - alias net-pf-5 off

    - alias char-major-14 off'
  merge: -1
