  md: '# Plug and Play Using isapntools Utility


    If you have a new PC, it is very likely that you have a PCI bus on your motherboard.
    PCI buses are for Linux users because Plug and Play technology is built into the
    bus itself. Any device connected to a PCI bus, therefore, is likely to be detected
    by Red Hat Linux.


    Older PCs, however, ISA busses, with which Red Hat Linux needs a little help.
    Linux must probe an ISA device directly to determine whether it is Plug and Play.


    If your PC has an ISA device that is not recognized by Linux, you can use the
    isapntools set of applications to configure the device.


    # Performing a PnP Dump


    The first thing you need to do is to perform a scan of all existing ISA PnP cards
    on your PC. This is done using pnpdump application—an apt name for the program
    since it takes all of the PnP information and “dumps” it into the isapnp.conf
    file. From there, the isapnp application can configure the isapnp.conf file.


    > Because pnpdump will try to use real-time scheduling to get the right I/O port
    settings, all other programs will be locked while pnpdump runs. For this reason,
    do not run pnpdump within X, as the terminal emulation window will be locked as
    well.


    # Using pnpdump


    This will show how to create the isapnp.conf file with pnpdump.


    +   1. Press Ctrl+Alt+F1 to switch to the Linux command line interface (if you''re
    not already).

    2. Log in as root.

    3. Type /sbin/pnpdump > /etc/isapnp.conf.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '4. Check and record the settings for all other devices so that you will avoid
    conflicts when setting up your ISA devices. Type the following commands,

    each on a separate line, to obtain other device information:


    +   - cat /proc/dma

    - cat /proc/interrupts

    - cat /proc/ioports

    - cat /proc/pci


    # Editing the isapnp.conf File


    Now that the isapnp.conf file is made, you can use the isapnp utility to configure
    your devices, as seen in the following task.


    # Using isapnp


    This task will show how to edit the isapnp.conf file with isapnp.


    +   1. At the Linux console, while logged in as root, type /sbin/isapnp /etc/isapnp.conf.

    2. isapnp will open and display the results of the pnpdump. If any any ISA boards
    were found, remove the comment characters preceding the device listing. This will
    enable Linux to activate the board.


    > For more information on the format of the isapnp.conf file, see the isapnp Tools
    Home Page at http://www.roestock.demon.co.uk/isapnptools/


    +   3. Edit the values listed so that they match your card''s exact specifications.


    If isapnp is not installed, you can use a text editor such as vi to edit the file.


    +   4. Once the isapnp.conf file is edited, save the file and reboot your system.
    Your device should be recognized by Linux now.


