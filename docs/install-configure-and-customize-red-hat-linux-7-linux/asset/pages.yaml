- img_proc: true
  md: '# Chapter 9: Customizing Your Desktop''s Usability


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_257_0.png)


    # Defining a File Association in KDE


    File associations are a powerful feature of KDE. In this task, the mp3 file type
    (a music file type you may have heard of) will be associated with the xmms application.
    These are the steps you should follow to create any kind of file association.


    +   1. To associate MP3 files with xmms, you must first create a MIME object for
    MP3 files. Start KDE while logged in as root and then open the file manager (such
    as your home directory).


    +   2. From the Edit menu, choose Global MIME Types.


    +   3. Because MP3 is an audio format, open the Audio folder. In this example,
    an x-mp3 object already exists. (If it doesn''t exist, you can create your own
    by right-clicking where the mouse pointer exists somewhere in the window and then
    choosing New, MIME Type).


    +   4. Right-click the x-mp3 object and choose Properties to open its Properties
    dialog box.


    +   5. Click the Binding tab, and list all file-name extensions that should be
    tagged as this MIME type. For MP3, not only should you list *.mp3, but'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'also the MP3 play list extension *.m3u because the xmms program can handle
    both.


    Because Linux is case-sensitive, you may want to enter both upper- and lower-case
    extensions.


    6. Type the MIME type; in this case, it is audio/x-mp3. You cannot select a default
    application for the MIME object since no application object exists for xmms. Click
    OK to close the Properties dialog box.


    If you are creating a new MIME object and do not know the correct MIME type, it''s
    ok to guess. At worst, such files will not be handled correctly when downloaded
