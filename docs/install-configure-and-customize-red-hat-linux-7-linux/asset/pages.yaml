  md: '# Running Your Installation


    As the installation progresses, you will see a sequence of installation screens
    that present choices to you based on the type of installation class you chose.
    These screens are organized in the same manner throughout the entire installation
    process, as shown in Figure 2.2.


    On the left side of the screen, you will see the Online Help pane. This pane contains
    general help pertinent to the current installation screen. Although it takes up
    some space, I recommend that you leave it on throughout the installation process.
    This enables you to quickly find help for a term or option you may not understand.
    If you really think you don''t need the Online Help, you can turn it off by clicking
    the Hide Help button.


    The pane on the right side of the screen is where all the action happens. The
    action pane displays the options appropriate to the current task from which you
    make your installation choices. Each time you complete a selection, click the
    Next button to move to the next screen. Conversely, if you need to reverse a decision
    made, you can click the Back button and return to the screen you want.


    > In some cases, the Next button is disabled (indicated by its gray appearance)
    until you have made all the necessary choices—a helpful safety feature.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_75_0.png)


    Figure 2.2 A typical installation screen.'
