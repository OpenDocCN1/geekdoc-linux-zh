  md: '# Chapter 13: Troubleshooting


    Troubleshooting is rarely pleasant; after all, if you need to troubleshoot your
    system, there are problems. With a little help from this chapter, however, the
    troubleshooting can be somewhat painless. This chapter outlines many common problems
    and their solutions, along with various tips on how you might be able to avoid
    trouble in the first place.


    If you are having problems with a program, you should first look for updates or
    fixes on the author''s Web site. Only if your search for a fix is unsuccessful
    should you begin the troubleshooting process.


    Although Linux has no central knowledge base for solutions to common problems,
    many Linux users use newsgroups to ask and answer questions from other Linux users.
    To locate Linux newsgroups, look for those whose names begin with the prefix comp.
    Read the messages to see whether an answer to your question is already there;
    if not, you can post questions about the problems you may be facing. You should
    also use Web engines to locate solutions to your questions.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_329_0.png)


    TIP


    # Installation


    When you''re installing Linux, any number of situations may require you to improvise,
    especially when you''re installing Linux on older or smaller systems. For example,
    the machine on which you want to install Linux might lack a CD-ROM drive and modem
    or may lack sufficient memory for the installation. Other problems you may face
    during installation include trying to dual boot with Windows NT, mis-placement
    of LILO, misconfiguration of X, boot problems, and more.


    # Installing Linux on Machines Without CD-ROM Drives or Modems


    Do you want to experiment with Linux using an old computer, such as a 486 system
    with 16MB of RAM and no CD-ROM drive or modem? If so, you''ll have to figure out
    how to get the Red Hat Linux distribution from the CD-ROM to the old system. You
    might try one of the following installation methods:


    +   * Installing Linux on a network

    * Installing Linux from the hard drive

    * Buying a CD-ROM drive'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Installing Linux on a Network


    To install Linux on a machine without a CD-ROM drive or modem, try using a network.
    To buy, two Ethernet cards (which can be found for about $20 each)—one for the
    machine on which you want to install Linux and one for a machine with a CD-ROM
    drive. Connect the two systems using a cross-over RJ45 Ethernet wire (which can
    be purchased for about $10).


    Once you''ve connected the machines, you can set up a Web or FTP server on the
    system that contains the CD-ROM drive and create a boot floppy with the bootnet.img
    file. This file is used to boot the system without the CD-ROM drive. After the
    installation starts, you will be asked for IP information and the server name
    of the system with the CD-ROM drive. The installation process will then retrieve
    the files from the CD-ROM over your small network.


    Alternatively, consider enabling a proxy on the system that contains the CD-ROM
    drive. Then, instruct your Linux installation to retrieve the files from the Red
    Hat Software FTP site rather than setting up an FTP or Web site yourself. This
    would require the installation of proxy software on the system without the CDROM
    drive. One such program is called WinGate and is available at www.wingate.com.


    # Installing Linux from the Hard Drive


    If you''re daunted by the method described above, you will appreciate the strategy
    presented here. To install Linux on the hard drive, you''ll need two things:


    +   - The hard disk on the "trial" system must be big enough to support both the
    uninstalled and installed packages. This means you''ll need about 2GB of unused
    hard disk space.


    +   - A PC-to-PC cable is used to be used for file transfer is Required. Such
    a cable is available from any local computer store for about $10. Both serial
    cables and parallel cables exist, any of which will do.


    After you have the cable, you will need to use DOS or Linux''s fdisk program to
    create the partitions on your trial system. You need half of the drive partitioned
    as a DOS (FAT or FAT32) partition, with the remaining half reserved for Linux.
    Then, using the cable, transfer the files from the CD-ROM on your existing system
    to the DOS partition on the trial system. When you start the installation process,
    you can tell Linux to look on the DOS partition of trial system to get the files.'
