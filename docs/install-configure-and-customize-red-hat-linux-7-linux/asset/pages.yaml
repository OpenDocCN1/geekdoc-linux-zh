    # Configuring Your Accounts


    Whenever a Linux system is created, the root account must be created as well.
    The root account is the administrator account for the Linux PC. Because the root
    account is used when modifications are made to the operating system settings,
    it is the most powerful account on the system. All you need to do to set up the
    root account is to enter the same password in both the Root Password and Confirm
    fields. The Confirm field entry ensures that you have not made a typographical
    error in the password.


    If you have additional users on the system, it''s a good idea to create additional
    user accounts for them now. User accounts are analogous to user profiles in Windows.
    They allow certain users to have customized access to a Linux system and provide
    the additional security of letting you know who''s doing what on the system.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_85_0.png)


    > Even if you are the sole user on the PC, it''s a good idea to make a regular
    account for yourself. Using the root account all of the time can lead to errors,
    whereas using a regular account limits the amount of damage you can cause. The
    powers of the root user can wreak havoc on a Linux system, up to and including
    the destruction of every file on your partitions.


    As you can see in Figure 2.7, to create a user account, you type a user ID in
    the Account Name field and supply a password and the user''s full name. Similar
    to creating the root account, you''ll need to type the password twice to ensure
    that no typos are made. Clicking the Add button will finish the process.'
