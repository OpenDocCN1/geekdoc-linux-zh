  md: 'All this sound content is worthless to you, though, if you don''t have a decent
    sound device. Sound devices are typically composed of two sets of components:
    a sound card and a set of speakers. As you learned in Chapter 1, "Before You Install
    Red Hat Linux 7," is able to support a few types of sound cards, which are the
    heart of a PC sound system.


    Speakers will work with any sound card—the interface is pretty standard. This
    is not to say you should not give the purchase of speakers any thought. If you''re
    going to get speakers, get mid-to-high-quality speakers. This is one area I think
    more investment is worthwhile.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_211_0.png)


    When Red Hat is first installed, your sound card will likely be configured automatically.
    On the off chance that it is not configured, don''t worry. Setting up a sound
    card is not hard to do.


    # ## Configuring Sound with the sndconfig Utility


    The sndconfig application is used by Linux to configure sound. sndconfig is a
    command-line, text-based program and needs to run independently of X in the console.
    You cannot reliably run it from a terminal emulation window.


    > For illustration and demonstration purposes, the sndconfig screens in Figures
    7.11 through 7.15 appear in a terminal window. This is only for demonstration.
    Kids, don''t try this at.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_211_1.png)


    > To access the Linux console from any X mode, press Ctrl+Alt+F1. To return to
    X from Linux, press Alt+F7.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_211_2.png)


    That said, it''s a straightforward process to get your sound card configured,
    as you will see in the next task.


    # ## Setting Up Sound


    This task will show you how to configure a sound card on your Linux PC. Before
    starting sndconfig, however, you must make sure that the sound server component
    of X is running.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_211_3.png)'
