  md: '# Understanding the Kernel-Numbering System


    As you''ve probably noticed, these sites contain hundreds of versions of the Linux
    kernel, all the way back to the first public version from nearly a decade ago.
    In order to determine which kernel you should get, you must understand the version-numbering
    scheme.


    Versions of Linux kernels consist of three numbers separated by dots:


    +   - The first number is the major version number, which changes very rarely.

    - The second number is the minor version number. By convention, minor version
    numbers indicate a development kernel, while even numbers are used for stable
    kernels. Unless you intend to help the Linux kernel development effort, you should
    get a stable version.

    - The last number indicates the patch level. This is incremented every time a
    set of bugs is fixed.


    You may see a kernel version with a suffix, such as 2.2.16–21 (the kernel shipped
    with Red Hat 7) or 2.2.14pre7. Red Hat uses the first form to indicate fixes made
    to the named kernel. Therefore, 2.2.16–21 is somewhere between standard 2.2.16
    and standard 2.2.21 kernels. The second form indicates a pre-release; bug fixes
    are collected in the 2.2.14pre series before the 2.2.14 is released.


    > If you are eager for a bug fix introduced in an intervening release, by all
    means, use that release. If you can wait, however, you should probably stick with
    the previous stable release until the next official version is released.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_304_0.png)


    If you''ve installed Red Hat 7, you already have the latest 2.2 kernel, so it
    may be a while before you are ready to install a new kernel. For this reason,
    all the examples in the rest of this chapter use hypothetical kernel versions.


    # Installing the Kernel Source


    Now that you have downloaded your kernel source (let''s assume the source, the
    imaginary version 2.4.15, was contained in the hypothetical format file .tar.bz2
    and resides in your /tmp directory), you must install it in the /usr/src directory:


    ```

    $ cd /usr/src

    $ tar --use=bzip2 -xf /tmp/linux-2.4.15.tar.bz2

    ```'
