  md: '# Patching the Kernel


    are usually created as separate kernel modules.) Generally, unofficial patches
    must be applied to a particular version of kernel sources, but it may be possible
    to apply a patch to different (usually newer) kernel sources if the patch is small
    and if it was meant for a kernel version only a few patches away from yours.


    > Unofficial patches may not be as stable as the Linux kernel; they are sometimes
    designed for testing purposes in order to obtain user feedback. For this reason,
    it''s a good idea to keep a bootable backup of a standard kernel when testing
    a kernel compiled with an unofficial patch.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_306_0.png)


    Two good places to start searching for unofficial kernel patches are http://www.kernelnotes.org
    and http://www.linuxhq.com. Both contain links to either local or external lists
    of unofficial patches.


    # Installing Patches


    Whether your patch file is an official kernel diff or a third-party change, it
    is installed in the same way. This example assumes you downloaded a hypothetical
    patch to upgrade 2.4.13 to 2.4.17 and saved the patch in /tmp.


    # Patching Your Kernel Sources


    You will use the patch command to apply the changes contained in a patch file
    to your kernel source. Use these steps:


    +   1. Change to your /usr/src directory, and issue a command similar to the following:


    ```

    $ bzip2 -dc /tmp/patch-2.4.17.tar.bz2 | patch -p0

    ```


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_306_1.png)


    > Remember, this command will change based on the actual version numbers you are
    using.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_306_2.png)


    > If you are updating an older kernel and must apply multiple patches, be sure
    to apply them in order. In other words, apply them in the order of their release.


