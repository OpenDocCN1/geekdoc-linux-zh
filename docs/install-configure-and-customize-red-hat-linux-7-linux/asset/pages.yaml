  md: 'Hat Linux 7 is a very capable operating system on its own, but like the old
    saying goes, strength is in numbers. Hooking your computer to the Internet is
    one way to improve your productivity, but to really share the resources of your
    co-workers or even family members, you need to use the networking capabilities
    of Red Hat.


    There are many tools and help systems to connect you to your local area network
    (LAN), if you are part of one, and to the outside world via the Internet. Important
    networking settings appear during the initial Red Hat installation, so it''s best
    to be ready to address these settings.


    # Networking Settings During Installation


    During installation, you will be prompted to enter information that identifies
    your computer and network. You will also be asked for information concerning your
    connection to the Internet. Gathering this information ahead of time will make
    your network configuration faster and easier.


    # Configuring Your Network Settings


    If a network card is detected during the initial installation of Red Hat Linux
    7, the Network Configuration screen will appear, as shown in Figure 6.1. This
    task demonstrates what information you should supply.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_177_0.png)


    figure 6.1 Your networking options can be entered during installation.'
