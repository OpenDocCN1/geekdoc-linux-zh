  md: '# Chapter 1: Before You Install Red Hat Linux 7


    et''s start by dispelling a common myth: Red Hat Linux 7 is not an exceptionally
    hard operating system to install. Nor, truth to tell, it is exceptionally easy
    as compared to say, Microsoft Windows.


    Since the inception of Microsoft Windows 95, users have become accustomed to relying
    on its ubiquitous SETUP.EXE file, designed to automatically identify your computer''s
    components. It then attempts to match the components with their appropriate files
    and places those files in the proper locations on your computer (you hope).


    Windows users can get away with this simply because Microsoft, with its very pervasiveness,
    has managed to keep hardware systems within a certain “compatibility window”.
    For example, each PC manufacturer logically attempts to make small improvements
    over its competitors, changing and enhancing various component parts and competitively
    marketing these enhancements. However, if each wants to include Windows with its
    products, thus taking advantage of the huge Microsoft following, each will adhere
    to Microsoft''s specifications despite fierce competition. This way, any enhancements
    can, in theory, be reasonably identified by the Windows SETUP.EXE program.


    Critics of Linux have said that Linux is too rigid and inflexible and thus it
    is too difficult to use. Although Linux does indeed have flaws, inflexibility
    is certainly not one of them. Windows only appears to be more flexible, but that''s
    because its installation path to a given PC has already been paved by hardware
    manufacturers whose components conform to Windows'' suggested standards. Linux,
    on the other hand, does not have cooperative agreements with PC and hardware manufacturers
    (although some have come into existence very recently). So, Scarlett O’Hara, Linux
    too must “depend on the kindness of strangers” to find its way into different
    systems. It is partly through the efforts of talented and dedicated volunteers
    that hardware support is accomplished.


    During installation, Linux distributions will typically ignore any unrecognizable
    hardware device, indifferently continuing its installation process. Linux may
    also incorrectly identify the hardware. As you can imagine, this can be a problem
    if the device in question is your PC''s video card and you cannot see anything
    on the screen, or worse, the video card has been misidentified and you are left
    with a miasma displayed on the monitor. Luckily, the number of devices that Linux
    cannot work with is decreasing rapidly, and this trend expected to continue. Linux
    programmers continue to add hardware drivers to the Linux kernel, including Plug
    and Play technology—Windows'' method to configure new hardware devices.'
