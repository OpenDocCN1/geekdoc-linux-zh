    be offered as a choice).


    +   12. Give it a name. For this example, use X Multimedia System.


    +   13. Click OK to close the Properties dialog box.


    +   14. Associate the application object with the MIME object. To do so, open
    the Properties dialog box of the x-mp3 MIME object once again, click the Binding
