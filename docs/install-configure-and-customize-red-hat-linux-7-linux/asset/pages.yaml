  md: '# Chapter 11: Adding New Hardware


    You should note that all the supported devices are not in your current kernel.
    You may need to download a recent development kernel and may also need third-party
    software. Kernel 2.2.7 and later contain the basic USB code and support for a
    few devices. Each new kernel supports new devices. You must also recompile the
    kernel to enable USB support in the configuration screen, where you must also
    enable support for a controller and device.


    You can determine whether USB support was installed correctly and whether your
    USB device was loaded by looking the logs in /var/log/messages. Once the controller
    is detected, you can start configuring your devices.


    # Configuring USB Mouse


    If you have a USB mouse, begin configuring it by creating the device node like
    so:


    ```

    mknod /dev/usbmouse0 c 180 16

    ```


    When complete, edit your X86Config file and change the protocol to IMPS/2 and
    the port to /dev/usbmouse0.


    # Configuring USB Keyboard


    USB keyboards should require no configuration; they should work normally. Make
    sure that your BIOS supports the USB keyboard by contacting your manufacturer.


    # Configuring USB Printer


    To support a USB printer, create a special device node using this command line:


    ```

    mknod /dev/usblp0 c 180 0

    ```


    When complete, you can configure the printer like any other printer in your /etc/printcap
    file or by using the printtool utility.


    # Troubleshooting


    When everything fails, it''s time to troubleshoot. This section introduces a few
    actions you can take to make Linux detect your hardware and where you can look
    for the scripts that control the bootup process and the detection of new hardware.


    Before looking for scripts to modify, refer to any manuals and other documentation
    that came with your system and with the device you are trying to install.'
