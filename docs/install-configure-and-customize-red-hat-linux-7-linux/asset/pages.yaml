    # # To Dual Boot or Not to Dual Boot—That Is the Question


    Now comes the time when you have a really important decision to make. As all important
    decisions, you should weigh your options carefully. You must now decide whether
    you are going to run Red Hat Linux alone on your PC or whether you want to retain
    your existing operating system and add Linux.


    There are several pros and cons for using multiple operating systems on one computer.
    The cons include the headaches of installing two or more operating systems on
    a machine, resulting in more limited memory available for each of the operating
    systems. The benefits of using multiple operating systems are huge. For instance,
    you will have the ability to run all of the programs available for each of the
    operating systems. You will also be able to use all the hardware your PC has.
    Finally, you''ll save money by not needing to buy another PC.


    I think dual booting is the way you go—especially if you are just trying Linux
    out. This option gives you the benefits of Linux without a lot of investment in
    time or money.


    # ## Making room for Multiple Operating Systems


    If you decide to include Linux on your PC in addition to Windows, you will need
    to make room for it on your hard drive. Making room on your hard drive for Red
    Hat Linux is a far different operation from making room for the latest computer
    game; you must create a brand new partition from which Linux will operate.'
