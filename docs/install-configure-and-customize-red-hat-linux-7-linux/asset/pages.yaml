  md: '# Chapter 11: Adding New Hardware


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_291_0.png)


    Figure 11.3 netcfg gets your Ethernet card up and running.


    You will often find two lines in conf.modules, the first telling Linux which module
    to load and the second specifying which options to set. In this case, the module
    for the first Ethernet card (eth0) is ne; the card should be located at I/O address
    0x220.


    You can also test modules from the command line. For example, to load the NE2000
    module with the parameters shown above, simply type **insmod ne=0x200**.


    Another card you may need to configure is an Ethernet card, whether it is used
    to link your computer to a local network or as a cable modem for Internet access.
    To do so, you use the utility called netcfg (see Figure 11.3); click Interfaces
    to add a new card. You should select Ethernet in the list of possible devices
    (note that PPP is also present, which means that you can configure a basic PPP
    interface with netcfg).


    > netcfg will not add networking modules to /etc/conf.modules and will assume
    the module is already loaded at boot time. You may need to add the module yourself,
    as discussed in the section "Using Modules."


    # Video Configuration


    Video configuration can be unusual and requires a bit of discussion. Every device
    is handled by a driver, but the video card must also be recognized by the X server.
    Although every other device might be detected by a driver at the time you boot
    your system, you must tell X what video card you have so that everything looks
    right when you go into graphical mode. Therefore, if you install a new video card,
    you'
  merge: -1
