  md: '# Graphics


    With the influx of the Internet, the need for applications that can handle graphics
    with ease has grown tremendously. Linux does not disappoint in this area, giving
    its users three tools for viewing and editing graphic files: Electric Eyes, GIMP,
    and Xpaint.


    # Electric Eyes


    Despite the odd name, Electric Eyes is an excellent, simple graphics viewer. Once
    started, right-click to open the menu. As with most programs, the File, Open menu
    selection can be used to open a graphic, just like the example shown in Figure
    4.10.


    # GIMP


    If you thought Electric Eyes had a weird name, the GIMP application may set you
    back a bit. GIMP (short for GNU Image Manipulation Program) is often compared
    to Adobe Photoshop because it has many of the same capabilities.


    GIMP has some special features that make it necessary to perform a secondary installation
    when the application is first started. When the GIMP Installation dialog box appears,
    click Install. When completed successfully, a message box will appear, informing
    you of the completed installation. Click Continue to open the GIMP interface,
    shown in Figure 4.11.


