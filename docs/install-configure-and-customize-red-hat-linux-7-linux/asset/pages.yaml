  md: '# Chapter 9: Customizing Your Desktop''s Usability


    n this chapter, you will learn how to make your desktop fit the way you work.
    One way to do this is to create virtual desktops, which gives you more space to
    work. Another is to make your removable drives easily mountable; making removable
    drives mount with a simple command or a single mouse click will save you time.
    The same goes for learning how to make programs start automatically—both when
    you start X and when you click on a data file. Finally, you will learn how to
    streamline the printing process with drag-and-drop printing.


    # Configuring Virtual Desktops


    Virtual desktops allow your screen to act as part of a larger, multi-screen desktop.
    I find this to be a useful way of organizing my running programs, which in turn
    helps me organize my thoughts. For example, at work I use virtual desktops one
    and two to develop and debug software. Useful programs not directly related to
    work (such as a Web browser, e-mail, and instant messaging software) are active
    on desktop three. Such programs are still available with just a keystroke when
    I want them, but they are not always present on my current desktop to distract
    me. (Not to mention, I can make the Web-browsing desktop disappear with just one
    more keystroke—especially useful when the boss pays visit!)


    Both KDE and GNOME come with virtual desktops. The KDE and GNOME panels display
    a grid of four buttons (referred to as the *desk guide* in GNOME), representing
    the four possible screens. With KDE, you can use keyboard shortcuts to switch
    among desktops: Ctrl+F1 to switch to the first virtual desktop, Ctrl+F2 for the
    second, and so forth. Similarly, GNOME uses the Alt key in combination with the
    function keys (such as Alt+F1).


    # Configuring KDE''s Virtual Desktops


    To change KDE''s virtual desktop setup, start the KDE Control Center, expand Applications
    and then Panel, and select the Desktops tab. The Desktops page will allow you
    to create between two and eight virtual desktops. You can also re-name each desktop
    to something descriptive, as is being done in Figure 9.1, if that will help you
    organize your windows.


    # Configuring GNOME''s Virtual Desktops


    You can configure GNOME''s virtual desktops by right-clicking the desk guide.
    Choose Properties from the shortcut menu, and in the Desk Guide Settings dialog,
    click the Geometry tab (see Figure 9.2).'
  merge: -1
