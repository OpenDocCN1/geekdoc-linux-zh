  md: '# Common Commands


    Description: The ps command displays process status to standard out. You get a
    static report of what processes are currently running. The top command is similar,
    but it provides a continually updating report of processes and their status. The
    ps command is useful to see what processes are running, who has created the process,
    and what process statuses are.


    Usage: To use ps, type ps followed by any options and a process ID you want to
    check a specific process and know its ID. If you don''t know the ID of the process,
    you can run ps to find out!


    Options:


    +   - -l (Long). Give lots of information.

    -u (User). Give user name and start time of processes.

    -m (Memory). Give memory usage.

    -a (All). Show processes created by other users as well.

    -x (Detached). Show processes that are not associated with a terminal.

    -c (Command). Show processes with the given command name.

    -w (Wide). Don''t truncate output to fit on one line; display full information.

    -r (Running). Only running processes.

    -pid(s) (Process IDs). Show only the process IDs given. If you specify several
    process IDs, separate them with spaces.


    # Example 1: Show User''s Current Processes


    To show your processes, use the simple ps command:


