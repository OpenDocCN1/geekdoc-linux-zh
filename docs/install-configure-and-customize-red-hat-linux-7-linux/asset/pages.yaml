  md: 'If you list the directory, you''ll notice that a linux subdirectory was created.
    Rename the linux subdirectory to reflect the kernel version number; this will
    help keep things straight if you compile multiple versions. You will also want
    to create a soft link linux pointing to the new directory. That way, if you have
    the sources to several versions installed, you can pick which one you want to
    compile by changing the soft link. Use these commands to rename the directory
    and create the soft link:


    ```

    $ mv linux linux-2.4.15

    $ ln -sf linux-2.4.15 linux

