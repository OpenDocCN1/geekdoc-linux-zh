  md: '# Chapter 3: Configuring the X Window System


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_103_0.png)


    **Figure 3.2** The components of a Linux GUI system.


    Table 3.1 breaks down the different responsibilities of each of the Linux components
    in the GNOME environment.


    # Table 3.1 Components of a Linux/GNOME System


    | Component | Responsibilities |

    |---|---|

    | Linux | This is the base on which everything runs, and it handles all basic
    file system and device tasks, as well as translating commands into the PC''s rudimentary
    machine language. |

    | XFree86 | This is the heart of the GUI. It generates a display layer that allows
    the creation of graphics and marries those graphics to input from the keyboard
    and mouse. |

    | Sawfish | This, the window manager, is responsible for the look of all windows,
    dialog boxes, and menus that are generated from the applications being used. |

    | GNOME | This enhances the Sawfish window manager by providing additional interface
    tools and appearance. Additional controls are provided for input device configuration.
    |


    Notice in Table 3.1 that certain components of X have different responsibilities;
    the remainder of this chapter focuses on XFree86''s video output, keyboard, and
    mouse responsibilities.


    # Using Xconfigurator


    Within Red Hat Linux 7, there are two tools designed to manage XFree86: Xconfigurator
    and x86config. Each tool focuses on a different aspect of XFree86 and should be
    used accordingly. Table 3.2 reveals the capabilities of each tool.'
