    -1 (List). Lists the signal names and numbers.

    pid(s) (Process IDs). Specifies the processes to which signal should be sent.
    If you want to send the signal to several processes, separate the IDs with spaces.


    # Example 1: Killing an Errant Process


    If a process has stopped responding, you can use the kill command to stop the
    process. If the process ID you want killed is 212, the following should stop the
    process. Note that you can only kill a process you did not create if you are the
    superuser on the system.


    ```

    kill 212

    ```


    This tells the process to exit, but first it gives it a chance to clean up—perhaps
    it will save any data it before exiting.


    If the default signal sent by kill does not terminate the process, signal 9 (SIGKILL)
    should always terminate the process.


    ```

    kill -9 212

    ```


    You should use kill -9 only when a normal kill won''t do it, because this method
    forcefully terminates the process without giving it a chance to clean up.


    > Be careful using kill. If you terminate the wrong process ID while you are root,
    you could very easily cause problems for yourself or other users on the system.


