    | Workstation | This is the simplest system to take. It''s good for a home PC
    with a single operating system. It automatically installs X Window and can be
    used if you are setting up a dual boot system with Windows 95/98, but not Windows
    NT or OS/2. |

    | Server | This is for the more advanced user, particularly someone looking to
    create a network or Web server. It can be used if you are setting up a dual boot
    system with Windows 95/98, but not Windows NT or OS/2. |

    | Custom | This option must be used to install on a PC that will be shared with
    Windows NT or OS/2, so that LILO will be placed in the correct on the hard drive.
    It is not very complicated, and it gives users the ability to pick and choose
    between every application package, not just Linux supplies in the other two installation
    paths.|


    You can also allow automatic partitioning if you plan to dual boot with Windows
    95 or 98. The Workgroup installation, only existing Linux partitions are replaced
