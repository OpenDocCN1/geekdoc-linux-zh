    # Changing the Window Manager


    Dozens of window managers exist for Linux, varying in features, appearance, and
    speed. Red Hat Linux 7 includes three of them:


    +   - Sawfish is a flexible window manager used in conjunction with GNOME. It
    can be configured to create attractive desktops.

    - kwm is designed to be used with KDE. By default, KDE and kwm create an environment
    quite similar to Windows. For users most comfortable with Windows, this is a good
    starting point.

    - twm is the minimal window manager included with Red Hat. It is usually only
    used as a fallback should no other window manager be installed.


    During the installation of Red Hat, you were given an option to install one of
    three desktop environments. If you selected GNOME, Sawfish was also installed
    and set as your default window manager. The kwm window manager was automatically
    installed for users of the KDE environment. If you elected to install neither
    GNOME nor KDE, your default window manager will be twm.


    Even though GNOME and KDE each come with a window manager, it is possible to replace
    their default window manager with another. For example, if you like the GNOME
    environment but do not need all of Sawfish''s features, you may want to save some
    of your computer''s resources by using a simpler window manager such as twm.

    Use Table 8.1 to guide you while configuring and starting window managers in the
    next sections.


    | Table 8.1 Comparing Window Manager Startup, Configuration, and Features |

    | Window Manager | Startup Command | Config Command | Default Config Files | User
    Config Files | Session Managed |

    |---|---|---|---|---|-|

    | Sawfish | sawfish | gnomecc | n/a | n/a | yes |

    | kwm | kwm | kcontrol | n/a | n/a | yes |

    | twm | twm | n/a | /etc/X11/twm/ | ~/.twmrc | no |'
  merge: -1
