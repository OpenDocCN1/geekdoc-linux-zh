- img_proc: true
  md: 'Then, check to see if the card is now working using the ifconfig command. The
    Ethernet card known as eth0 should show up. You may need to set it to start automatically
    at reboot in Linuxconf or netcfg.


    The Linux Plug-And-Play-HOWTO text can be found in the HOWTO documentation on
    your computer if you installed the Extra documentation option. Look in /usr/doc/HOWTO.
    HOWTOs are also available at http://www.redhat.tows.com/LDP/HOWTO/ and www.redhat.com/mirrors/LDP/HOWTO.
    Many answers to other questions can be found in the HOWTOs, as well as instructions
    on getting ISA PnP cards to operate under Linux.


    # Other Problem Cards


    A few Ethernet cards simply will not work with any Linux distribution. The necessary
    drivers cannot be created because the card manufacturers refuse to release the
    information needed. These cards are listed in the Unsupported Compatibility List.
    Try checking this list if nothing seems to enable your card under Linux. As the
    open-source movement gains strength, look for fewer and fewer hardware manufacturers
    to refuse to release technical information.


    # Multiple Networking Cards


    If you want to use Red Linux 7 on your LAN as a gateway or router between the
    rest of your computer(s) and the Internet or another LAN, you will need to have
    two networking cards installed and configured on your machine. One card will communicate
    with your LAN, and the other will take care of communications via the Internet
    or other LAN.


    Linux can easily use multiple networking cards, but with one small complication:
    The kernel will detect only one networking card at startup. The answer is to add
    both cards'' module, I/O, and IRQ addresses to the boot commands of LILO. You
    can do this by editing /etc/lilo.conf with the vi editor. Using your own module,
    IRQ, and I/O addresses, add the following line at the end of the file:


    ```

    append=eth0=10.0x300,eth0=9.0x320,eth1*

    ```


    Sometimes two Ethernet cards that use the same kernel module will confuse the
    system and not be properly enabled. If everything appears to be working properly
    and one of the cards still does not seem to be functioning, run the command ifconfig
    -v. You may see only one networking card listed, usually eth0. If so, try the
    command ifconfig eth1 again to see whether the card eth1 is listed.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_195_0.png)'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'If the card is still not working, you probably need to modify your files to
    start both cards. This can be done by making an entry into the /etc/conf.modules
    file.


    Add the following lines, substituting your module, I/O, and IRQ addresses:


    ```

    alias eth0 ne

    alias eth1 ne

    options i/o=0x300,0x320 irq=10,9

    ```


    These command lines will instruct the kernel to look for both networking card
    modules and to assign the proper IRQ and I/O addresses to both Ethernet cards.


    Assuming you have entered the correct IP address into each card''s configuration,
    you should be set to go. Both cards should be fully configured the kernel modules
    in place with the proper I/Os and IRQs assigned to both cards. You should be able
    to communicate with your own LAN with the Internet or another LAN, which, in reality,
    is all the Internet—one huge LAN. In other words, you should be connected. Congratulations!


    # Configuring the Computers on Your LAN

    to Use a Single IP Address


    Linux has many more networking capabilities for you to use. Now that you have
    your computer set up as a router, it wouldn''t be nice if you could use any of
    your computers on your LAN to talk to the outside world, rather than just the
    one computer that has an outside IP address? Remember that no two computers can
    share the same IP address, computers cannot use the Internet with one IP address
    even through a Linux router. Of course, you can always pay your Internet provider
    for more IP addresses, if they will sell you the privilege. Your company may have
    more than one IP address, but those addresses will be guarded zealously. So can
    all of your computers use one IP address? Can it be done?


    The answer is of course it, and in the Linux world it''s free!


    # NAT or IP Masquerading


    IP masquerading, or network address translation (NAT), is a method of changing
    packets from machines that do not have a legal IP address to appear as though
    they are coming from the one machine on the LAN that enables all the machines
    on your LAN to use the Internet or reach other LANs using the IP address of the
    Linux router. Please note that the legal does not mean to imply that the use of
    IP Masquerading or NAT is a shady thing.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Chapter 6: Configuring a Network Connection


    Legal used here to mean an IP address that is recognized as a valid address. Indeed,
    many ISPs encourage the use of IP masquerading as a means of extending the use
    of a limited number of IP addresses.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_197_0.png)


    Rule set: A set of rules used by a firewall to determine which machines and addresses
    access to your network server.


    IP masquerading may already be set up on your machine. To check this, type ls
    /proc/net in a terminal window. Verify that there is a file /proc/net/ip_masquerade.
    If there is no entry by this name, you will need to recompile your kernel to support
    IP masquerading. While you are checking, look also for a file /proc/net/ip/fwchains
    by typing ls -la /sbin/ipchains at a terminal prompt. If the file /proc/net/ip/fwchains
    exists, you are ready to set up IP masquerading over your computer.


    > To learn more about recompiling your Linux kernel, see Chapter 12, "Compiling
    a Kernel."


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_197_1.png)


    You may want to check out the IP-Masquerade mini-HOWTO at /usr/doc/HOWTO/mini
    for more information, along with the IPCHAINS-HOWTO in the HOWTOs. You can also
    find manual pages in the Red Hat Linux regarding IP masquerading.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_197_2.png)


    If you plan to use IP masquerading to access the Internet or external LANs, it
    would probably be a good idea to provide some form of firewall protection for
    your system. There are some unsavory characters in cyberspace who would like nothing
    than to crack your system and delete, corrupt, or steal your information. A firewall
    can be created easily, costing nothing than the time it takes to write a rule
    set. Many sites provide rule sets and information to create extremely secure firewalls.
    Take the time to make sure you have a good rule set and that your resulting firewall
    works the way you want it to; a poorly done firewall is worse than no firewall
    at all.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_197_3.png)


    Some good information on IP masquerading and firewalls can be found on the Linux
    IP Masquerade home page, ipmasq.cjb.net.'
