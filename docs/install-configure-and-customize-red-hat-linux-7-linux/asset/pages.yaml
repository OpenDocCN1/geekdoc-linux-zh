  md: '# Chapter 4: Configuring Your Environment


    W ithologies to my fellow countrymen: Americans are obsessed with choices. I mean
    crazy. For example, the average supermarket has an entire aisle devoted solely
    to breakfast cereal. Boxes and boxes of breakfast cereal. Americans revel in having
    the ability to choose between brands, cereal types, packaging...don''t be-lie
    me? Ask yourself what would happen if the breakfast cereal fairy came down one
    night and reduced all of the different brands of cereal to just one generic brand.


    Imagine: one kind of corn flakes, one kind of raisin bran, one kind of sugary
    popped oats. No big deal, right? How many ways can you make a corn flake, anyway?
    Wrong. The resulting revolt would make the worst Y2K scenario look like a picnic.
    America''s obsessive need for choices, ironically, has not been extended to the
    PC very well. After all, for the last decade or so, PC users have (for the most
    part) accepted one operating system—no substitutes allowed.


    That''s because, unlike the marketing of breakfast cereal, many consumers really
    did not know that they had a choice of operating systems. OS/2 and the Mac were
    for those old people who never fit in a party. UNIX and Linux? Those users were
    perceived as strange, geeky people who weren''t even invited to the party.


    I''m exaggerating, but only to a point. Events in late 1999 and early 2000 have
    raised public awareness about life outside of Redmond, Washington (home of Microsoft).
    It turns out that there are other choices for operating systems, and you don''t
    have to be a geek to use them.


    To which friends in Europe reply: “What took you so long?”


    # Choosing a Desktop Environment


    Not only Linux is a viable alternative to Microsoft Windows as a workstation platform,
    the operating system itself contains several graphical interfaces you can use.


    For example, with Microsoft Windows you can change the look of the desktop by
    manipulating the colors and fonts of the menus and windows. There are even prepackaged
    themes available to unify the desktop into a cohesive look. You can accomplish
    the same thing in X Window and even go way beyond that point. Not only can you
    manipulate the look of a desktop environment such as GNOME, you can also change
    the entire desktop environment to something else entirely! This ability to customize
    your system makes X Window a much friendlier tool to use the static Microsoft
    Windows.


    There are two other advantages to moving across desktop environments: You have
    the ability to access environment-specific tools you might not otherwise see;
    and'
  merge: -1
