- img_proc: true
  md: '# Chapter 8: Customizing Your Desktop''s Appearance


    xinit starts the X server on the specified display and runs the client script
    to start the window manager and any other client programs.


    If your system''s default client script is selected to run, it first performs
    a bit of housekeeping—it loads X resources and a keyboard mapping. It then finds
    the clients to start. Here you might feel a bit of déjà vu: The script tries to
    run the clients listed in a user/.Xclients; if that does not exist, it tries to
    run the system /etc/X11/xinit/Xclients. These two files are the heart of the entire
    affair. They start GNOME, KDE, or something else entirely.


    # Changing the Desktop Environment


    Red Hat 7 offers two major desktop environments: GNOME and KDE. GNOME and KDE
    are complete environments with file managers, icons, and a number of useful programs.
    Each also has its own GUI tool kit—GNOME is built on a tool kit called gtk, and
    KDE is built on Qt.


    # Changing the Default Desktop Environment


    One of the easiest ways to change the desktop environment is to use the Desktop
    Switching tool, outlined in Chapter 4, “Configuring Your Environment.\ Another
    fast way to start a different desktop environment is to create or edit the file
    /etc/sysconfig/desktop, first logging in as root. This file only needs to contain
    a single word: GNOME or KDE, according to your preference. When X starts, /etc/X11/xinit/Xclients
    examines this file and starts your preferred environment.


    As an example, suppose you originally installed GNOME but now wish to try KDE.
    Here is a sample walk-through of how you might do this from the command line:


    ```

    # mount /dev/cdrom

    # rpm -iv /mnt/cdrom/RedHat/RPMS/qtl1x*

    # rpm -iv /mnt/cdrom/RedHat/RPMS/kde

    # echo kde > /etc/sysconfig/desktop

    ```


    Press Ctrl-D when finished.


    First you should mount the Red Hat Linux 7 CD-ROM. The next two commands install
    the Qt libraries and all KDE packages. Finally, you edit the file that will cause
    KDE to be started. The next user to start X will be greeted with KDE.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Changing the Desktop Environment


    If your expected desktop environment does not start after you''ve put its name
    in /etc/sysconfig/desktop, there are several possible problems. First, you should
    ensure that the environment has truly been installed. Next, ensure that you don''t
    have any old .xinitrc or .Xclients files in your home directory because these
    override the global desktop selection.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_226_0.png)


    # Changing a Single User''s Desktop Environment


    Modifying /etc/sysconfig/desktop affects all users. If several people use your
    computer, they may not all agree to use one environment. Fortunately, personal
    preferences can be specified by each user, overriding the default desktop environment.
    One way to create a personal environment setting is to make a custom ~/.Xclients
    file that contains lines to start the desktop you want. For example, the code
    section here is a simple file that causes the current user to use the KDE desktop,
    regardless of the settings in the /etc/sysconfig/desktop file.


    ```

    $ cat > ~/.Xclients

    !/bin/bash

    startkde

    ```


    Press Ctrl+D when finished.


    ```

    $ chmod +x ~/.Xclients

    ```


    In the example, startkde is the shell script that starts the KDE environment.
    The equivalent program for GNOME is gnome-session.


    After you have been using Linux for awhile, you will know that GNOME and KDE are
    not the only desktop environments on the block and may not even be the right ones
    for your system. For instance, on a computer with little RAM (less than 16MB),
    you will see better performance if you do not use GNOME or KDE, or even a complex
    window manager. This next sample code for the .Xclients file uses as little RAM
    as starting only a clock, an xterm, and a simple window manager:


    ```

    !/bin/sh

    xclock -geometry 100x100-5+5 &

    xterm -geometry 80x35-50+100 &

    exec twm

    ```'
  merge: -1
