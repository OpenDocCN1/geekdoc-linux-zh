    | /dev/hdc1 | 387M | 248M | 119M | 68% | /usr/local |


    # File System Structure: A Tour


    This section will take you on a tour around the Linux file system structure, starting
    at the root directory and moving down through the directory layers. It will finish
    by introducing you to some points of interest.


    +   * /. This is the root directory. It is the top of top of the directory tree.

    * /boot. You have met /boot before; it contains the files necessary for LILO/boot
    is often mounted on a separate partition.

    * /mnt. I introduced you to /mnt earlier. It contains the mount points for user-mountable
    file systems.

    * /etc. This directory is where most configuration files reside. Save this directory
    before you reinstall Linux.

    * /usr. This directory holds most of the operating system. It also contains some
    important subdirectories.

    * /usr/doc. This directory contains a number of documentation subdirectories.
    The directory name will help you decide where to go (for example, /usr/doc/lilo-0.21
    for LILO).

    * /usr/doc/HOWTO. This is a special document directory. It contains help for doing
    many common tasks. Look in /usr/doc/HOWTO/mini for additional, similar documents.
    After the man pages, this is the best place to go for help.

    * /usr/local. This is where you usually install additional programs. I put StarOffice
    here, among others.

    * /usr/games. Games usually reside in this and the /usr/local/games directory.'
  merge: -1
