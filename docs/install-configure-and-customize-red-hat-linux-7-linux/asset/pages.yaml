  md: '# Chapter 5: Configuring Internet Services


    Much has been said about the Internet this past decade. Although much hoopla and
    hype has been associated with this—the largest of all public computer networks—it
    should be noted that the Internet is not even close to being finished.


    The growth of the Internet (this far) is in many ways similar to the growth of
    the telephone in the United States in the late 19th century. For the first five
    years of its commercial existence, the telephone was in about 10 percent of U.S.
    households. In five more years, it was in 50 percent of American homes. Within
    another five years, it was in 90 percent of all U.S. homes.


    The Internet matches this growth pattern closely. By 1994, five years after the
    Internet broke out of its pure academic setting, connection to the Internet could
    be found in about 10 percent of U.S. homes. Now, over six years later, the pervasiveness
    of Internet access in the United States has reached nearly 50 percent. Incredible
    as it may seem, the United States is only at its halfway mark toward full Internet
    usage. (The Internet’s presence in other nations is behind in terms of percentages,
    but perhaps only the U.S. had a head start; the pattern of the growth remains
    the same.)


    Whether you are one of the new kids on the Internet block or you have been surfing
    the days of Lynx, you will find that the Internet is becoming less of a place
    to play and more of a place to work. More and more people are turning to the Internet
    to handle banking needs, shop for holiday gifts, and even check up on their kids
    at daycare by Web cameras.


    The history of Linux and the Internet is an intertwined one. Linux’s predecessor,
    UNIX, was the operating system upon which the Internet was built. In fact, much
    of the syntax of the ("http://," FTP commands, forward slash for separators, and
    so on) is directly derived from UNIX line commands. It should come as no surprise
    that Red Hat Linux provides a rich set of tools for access. All you have to do
    is get yourself connected.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_147_0.png)


    # Setting Up Your Internet Account


    These days, getting an Internet account is fairly simple. I know to get a CD-ROM
    in the mail with connectivity software almost once a month. But with Linux, you
    will need to make sure you are using the right type of account and speaking the
    right language.


    The “language" of the Internet is called TCP/IP. This language (called a protocol)
    is how data is sent from your computer to a Web server computer in, Durham, North
    Carolina.


    TCP/IP (Transmission Control/Internet Protocol): A suite of protocols used to
    connect hosts on the Internet. TCP/IP is a protocol of the UNIX operating system
    and is used by the Internet.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Setting Up Your Internet Account


    Even though TCP/IP is a UNIX-based product, Red Linux needs additional protocol
    help connecting to the Internet through a dial-up connection. TCP/IP, after all,
    does not transmit the IP (Internet Protocol) data packets through serial lines
    very well—serial lines like those in modems, for example.


    To get all of the data packets through a, an additional protocol, PPP, is used.
    The irony of this that PPP is not a UNIX invention—and its predecessors, SLIP,
    was developed to connect Windows computers to the Internet.


    PPP can be used on Linux systems—Red Hat (RH) being no exception. The RH PPP Dialer
    program manages connection of your PC to the Internet. You must first configure
    the Dialer so that it can communicate properly to the computers at your Internet
    service provider (ISP).


    # Configure the PPP Dialer


    Red Linux 7 comes with the Dialup Configuration tool, an automated method of setting
    up your Internet connection. For all ISPs, using this application is enough to
    create a routine connection. There may be instances where more control over a
    connection''s configuration is needed—which is why this section explains the manual
    editing of a connection using the Dialup Connection tool.


    Using the Dialup Connection tool is directly analogous to the Internet connection
    wizard within Microsoft Windows. The idea is to step through the application,
    providing the snippets of information needed by Red Hat to create a new PPP connection.


    Before you begin the next task, which will demonstrate the creation of a connection,
    you should gather the following information:


    +   * The domain name of the ISP (for example, earthlink.net)

    * The user name of your account

    * The password for your account

    * The phone number for the ISP


    You should also confirm what communications protocol your ISP requires. A vast
    majority of the ISPs will require PPP; some may use alternate protocols, such
    as SLIP or PLIP.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_148_0.png)


    PPP (Point-to-Point Protocol: A communication protocol used to deliver data packets
    through modem lines during dial-up calls to the Internet.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_148_1.png)


    Domain Name Service (DNS): A network of specialized servers within the Internet
    that translates domain names into IP addresses. Internet servers have unique IP
    address, such as 198.105.232.95. Since these are more difficult to remember than
    plain-language host names, the DNS service translates names to their corresponding
    addresses. Many ISPs have a default DNS that queries when a request to connect
    to a web server is.'
  merge: -1
