  md: 'In the following task, you will learn to add or confirm the modem port for
    your modem device. Similar to hard drives, modems are also mounted on the Linux
    system. Modems are, after all, just another type of device with which Linux changes
    data. Like other PC devices, modems appear in the /dev directory of the file system.
    Table 5.1 lists the available modem ports and their DOS equivalents.


    # Table 5.1 Modem File System Paths


    | Path | DOS Equivalent Port |

    | --- | --- |

    | /dev/ttyS0 | COM1 |

    | /dev/ttyS1 | COM2 |

    | /dev/ttyS2 | COM3 |

    | /dev/ttyS3 | COM4 |

    | /dev/modem | The link for any configured modem |


