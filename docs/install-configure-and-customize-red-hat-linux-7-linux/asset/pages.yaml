    # Creating a Boot Disk


    The most important resource you''ll need besides the Linux program is the boot
    disk. Without your own copy of the boot disk, you may have difficulty installing
    the software.


    A boot disk is required because Linux cannot be installed from within another
    operating system. The installation process must begin right after a PC starts,
    before any operating system loads. Many older PCs cannot start directly from a
    CD-ROM drive, but they can start from the floppy drive. Have you ever noticed
    the sound of the floppy drive rattling when your computer is turned on? That''s
    the BIOS looking for a boot disk in the boot disk.


    > Boot disk: A floppy disk containing Linux system files that allow users access
    the CD-ROM drive before the Red Hat Linux operating system is loaded.


    If you are fortunate to have a bootable CD-ROM drive, you will not need a boot
    disk. You can simply insert the Red Hat Linux CD 1 into your CD-ROM drive and
    restart the computer. The installation program will then begin automatically.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_72_2.png)


    The boot disk contains enough Linux commands to start a mini-version of Linux,
    including the instructions that enable Linux to recognize and run your CD-ROM
    drive. At that point, you can “jumpstart” the full installation program into action.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_72_3.png)'
