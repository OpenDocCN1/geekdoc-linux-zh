  md: '# The Kernel Boot Process


    A hard drive is typically added near the front of the case, grouped with the existing
    hard drives and CD-ROM drives. After positioning the drive, you must connect the
    power cable and its ribbon. Ribbons connect the drive to its controlling device.
    (If you are working with a SCSI hard drive, the SCSI controller is either on your
    main board or on a slotted card.) Be sure to refer to the manual for your device
    for proper installation procedures.


    # The Kernel Boot Process


    Once the system is turned back on, some program code is executed to detect and
    configure new devices. The first code executed when a PC starts is the bootstrap
    code, which is a small program located in static memory (ROM) inside your computer.
    The code checks the internal system parts to see if any major failure can be detected,
    as memory corruption.


    Control is passed to your BIOS, which is the heart of your input/output (I/O)
    subsystem. Its job is to detect the system components at start time and to work
    with the operating system to handle device calls. The code that appears on your
    monitor just after the video card name and before Linux starts is part of the
    BIOS You may see a list of hard disks and an information screen about your main
    system components. The BIOS is responsible for first detecting your hard disks,
    determining which one contains the kernel you want to boot, and optionally configuring
    any Plug and Play devices.


    Once the BIOS completes its various functions, control is passed to the first
    sector of your bootable hard disk (known as the Master Boot Record, or MBR for
    short). The MBR was used to contain DOS-MBR if you used MS-DOS or Windows; it
    now contains LILO, the Linux boot loader, which simply tells the processor to
    load your Linux kernel.


    > LILO can, do so much, as set a password, load many operating systems, and set
    disk geometry information for Linux. For the purpose of this chapter, it is assumed
    that only the kernel is loaded. You can find more information on LILO by typing
    man lilo at the command line.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_286_0.png)


    Once the BIOS and LILO have finished executing, the really complex part begins.
    The Linux kernel takes over and must detect, configure, and manage all the internal
    and external devices. It does using complicated data structures, device drivers,
    and kernel processes. All the text that appears on the screen before you see'
  merge: -1
