    # # Listing and Finding Files with ls


    **Name:** ls


    **Function:** To list the contents of a directory.


    **Syntax:** ls options directory or file(s)


    **Description:** The `ls` command lists the contents of a directory. This command
    is similar to the MS-DOS command `dir`. In fact, `dir` under Linux is the same
    as typing `ls -c`. The `ls` command is one of the commands you must use under
    Linux. You can also use the `ls` command to get information about a specific file
    in a directory.


    **Usage:** To use the `ls` command, you simply type the command, followed by any
    options you want to invoke and any file names (including wildcards) that you want
    to specify.


    Options:


    +   - **a (All)** Lists all files in a directory, including hidden files.

    - **A (Almost all)** Lists all files in a directory, except for “.” and “..”.

    - **i (Inode)** Prints inode number of each file.

    - **l (Long)** In addition to the file names, lists the file type, permissions,
    owner name, size of the file, and the last time the file was modified. Also known
    as the verbose mode.

    - **r (Reverse)** Lists the directory contents in reverse order.

    - **k (Kilobytes)** Lists file sizes in kilobytes. The `s` specifies that, yes,
    you want to see the sizes.

    - **x (Extension)** Sorts files by their extension; files with no extension are
    sorted first.'
