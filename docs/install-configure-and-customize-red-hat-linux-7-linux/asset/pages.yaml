  md: '# Chapter 11: Adding New Hardware


    The startup files are installed on your Red Hat Linux system is called System
    V init. This means that each startup script is stored in /etc/rc.d/init.d and
    is linked to the other rc.d directories. Each file can also be called to perform
    three actions: start, stop, and restart. If you want to stop the httpd device,
    you could type the following:


    ```

    /etc/rc.d/init.d/httpd stop

    ```


    The most pertinent file concerning device drivers is /etc/conf.modules, which
    specifies all the modules and options that will be loaded at boot time. You can
    use the kernelcfg utility to configure this file; you may need to edit the file
    by hand add more modules or to change some settings. The modules are always loaded
    first, and then the Option line gives the parameters to these modules.


    The only way to know those options accepted by a module is by looking at the kernel
    documentation. Sometimes the Documentation directory contains information about
    the driver you want to load. In other cases, however, you must look in the source
    files themselves. You may also want to ask for that information in Internet newsgroups.


    # A Note about Plug and Play


    Plug and Play (PnP) is a Microsoft and Intel standard designed to PCI detection
    of hardware easier. It has both good and bad effects. Both ISA and PCI devices
    can be Plug and Play. The PCI bus has been constructed so that every device can
    be configured with Plug and Play. This is a good thing and makes configuration
    easier. However, a few ISA cards are also Plug and Play. This makes things complicated
    because not all Plug and Play devices behave in the same way. The isnapntools
    package has been made to handle these ISA Plug and Play devices.


    If you know you Plug and Play devices (and most computer users do...) and your
    BIOS is Plug and Aware, a setting exists in your CMOS set up to or off Plug and
    Play configuration in the BIOS. In most cases it is easier to set this on so the
    BIOS can assign IRQ and I/O ports to all the Plug and Play cards. You then only
    provide the correct parameters to the drivers.


    # Conclusion


    Adding new devices is always a mystery. You add a piece of hardware and the system
    will see it. Sometimes it works, sometimes it doesn''t. Then begins the perhaps
    long and complex task of troubleshooting. Frankly, the Linux system'
