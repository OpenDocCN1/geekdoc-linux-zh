  md: '# Chapter 6: Configuring a Network Connection


    The eth shows your type of configuration, the hardware codes, IP address (inet
    addr), broadcast IP, and the configured netmask. Immediately following the eth
    lines are a line that displays it, meaning that your card is activated. The broadast
    IP runs multicasting, which allows sending and receiving TCP/IP packets to a subset
    of other computers with which your computer is communicating. MTU is a measurement
    of the maximum size, in bytes, of a packet. Below there are several lines that
    give the status of TCP/IP packet transfer. Do not be concerned if you have numbers
    over 0 on some of these; TCP/IP will resend or request packets until your information
    is complete. The last line tells you the IRQ and I/O addresses of your NIC.


    The lo category displays information about the loopback configuration for your
    computer. Typically, this configuration is automatically set; it allows your computer
    to communicate with computer processes. Since this is a self-contained communication
    system, it is much less susceptible to erroneous settings. Notice how much larger
    the MTU number is. Your computer and hardware are not subject to the vagaries
    of the Internet and can transfer much larger packets without losing information
    to lost or corrupted packets.


    # Using netstat -i to Research the Network


    Another useful command is netstat -i.(Note using netstat without the argument
    will return a huge amount of information about your network, which is interesting,
    but not too useful for configuration.) As you can see in Figure 6.12, the information
    presented in netstat -i is similar to the information in the Ifconfig


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_191_0.png)


    Figure 6.12 Configuration information is also revealed with netstat.'
