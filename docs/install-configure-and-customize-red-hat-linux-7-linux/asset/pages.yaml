  md: '# Keyboard


    No keyboard section exists in the HCL. Keyboards are universal to PCs (if any
    device can truly be called universal). Keyboards have long been held to the ANSI
    standard, which uses a specific code for every character the keyboard can create,
    matter what operating system is being used. This standard makes it very easy for
    Linux to access any keyboard, including the new natural keyboards and those keyboards
    with pointing devices contained within. USB keyboards, however, like their mice
    counterparts, should be utilized with caution.


    # Notebook Computers


    A laptop or notebook computer is no more a single device any than your desktop
    PC. There is no one notebook PC that is compatible with Linux as a whole.


    A section for notebook computers is included in the HCL, but it is a bit different,
    containing a great link to the Linux Laptop Web pages. You should follow this
    link if you are thinking about installing Linux on your laptop PC.


    # SCSI Adapters


    Finally, the section on SCSI cards bears a close look, if only because so so many
    other devices could depend on the compatibility of the primary SCSI card.


    This is a large section of the HCL, and you should take the time to find your
    PC''s SCSI adapter. Although there are no incompatible SCSI cards, you will need
    to use some caution if your card falls into the Tier 3 category.


    # Backing Up Your Old Data


    After you have ascertained your hardware compatibility with Red Hat Linux, you
    will need to get your computer ready for the installation. One of the first things
    you should do is back up the data on your PC.


    It is always a good idea to back up your valuable data, guarding against system
    catastrophe. At the very least, you''ll want your data protected from power surges,
    virus attacks, computer theft, or anything else that can affect your ability to
    access data on your machine.


    Installing Linux can''t be classified as a catastrophic event. But you are going
    to be changing your hard drive partitions or even formatting your hard drive.
    These events can and will erase data completely.'
