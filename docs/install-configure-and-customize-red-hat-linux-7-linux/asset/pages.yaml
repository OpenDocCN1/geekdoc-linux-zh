  md: '# Chapter 9: Customizing Your Desktop''s Usability


    You can also specify the number of desktops that will be shown on the pager by
    manipulating the number of rows and columns the pager control will display.


    # Making Drives Easy to Mount


    One of the difficulties beginners encounter in Linux is how to mount removable
    drives—especially a drive that is added after Linux is installed. Even after mastering
    the commands to format and mount the new drive, incorrect settings (in /etc/fstab)
    might make mounting impossible for all but the user logged in root. The Red Hat
    Linux installation sets up the KDE and GNOME desktops so that with a single click
    you can mount and access the floppy, but how do you add other removable drives?


    To set the background for the following examples, suppose you have installed Red
    Linux on a computer that already has a floppy drive, CD-ROM drive, and hard drive.
    Later, you decide to add an IDE Jaz drive to the system. Your goal is to make
    this new device mountable and accessible to normal users with minimal fuss, ideally
    from X. The next sections outline the procedure for accomplishing this.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_243_0.png)


    > Very little in this example is specific to a Jaz drive; this example could easily
    refer to the addition of a second floppy or a second hard drive. For a floppy
    drive, you would skip the partitioning step. In the case of the hard drive, of
    course, a normal user probably wouldn''t care about being able to mount and unmount
    it.


    # Determining the Device Name


    After you have physically installed the Jaz drive, the first step is to figure
    out what device it uses so that you can tell Linux which device to mount. Perhaps
    the simplest way to find the device name of your new drive is to watch the messages
    Linux displays as it first begins to boot. Don''t fret if you noticed nothing
    what was displayed; all messages from the kernel are logged to disk. To read them,
    log in as any user and view the file /var/log/dmesg. Scroll down until you see
    lines similar to the following:


    ```

    hda: WDC AC36400L, ATA DISK drive

    hdc: ATAPI CDROM, ATAPI CDROM drive

    hdd: Iomega Jaz drive, ATA DISK drive

    ```'
