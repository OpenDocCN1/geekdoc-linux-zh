    # # Sound


    One of the most popular peripherals today is a sound device. No computer should
    be without one. Applications use sounds in increasingly creative ways to generate
    signals about what''s going on. Gams rely heavily on sound to put you into the
    action. And don''t get me started on the Internet: Entire radio and television
    broadcasts are now available.'
