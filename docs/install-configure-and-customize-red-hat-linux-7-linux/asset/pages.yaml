  md: '# Chapter 8: Customizing Your Desktop''s Appearance


    # Adding True Type Fonts to X


    Installing True Type fonts is done a little differently from installing other
    types of fonts. Follow these steps:


    +   1. Verify that the font server is installed by typing locate xfs. This command
    will find the font server if it is on your PC.

    2. Verify that the font server is set to start automatically when you turn on
    your computer. To do so, be sure that you are logged on as root, type setup, and
    then run the System services tool. Scroll down and verify that xfs is checked;
    exit the setup utility.

    3. You can now install True Type fonts. Here is an example of installing True
    Type fonts from the current directory, after downloading them from the Web:


    ```

    # mkdir /usr/X11R/lib/X11/fonts/TrueType

    # cp *.ttf /usr/X11R/lib/X11/fonts/TrueType

    ```


    +   4. Tell the font server where to find the new fonts. Edit /etc/x11/config
    and add the True Type font path to the list of existing font paths. The relevant
    section of this file initially reads:


    ```

    catalogue = /usr/X11R/lib/X11/fonts/misc:unscaled

    /usr/X11R/lib/X11/fonts/75dpi:unscaled

    /usr/X11R/lib/X11/fonts/100dpi:unscaled

    /usr/X11R/lib/X11/fonts/misc,

    /usr/X11R/lib/X11/fonts/TrueType,

    /usr/X11R/lib/X11/fonts/Speedo,

    /usr/share/fonts/default/TrueType

    ```


    +   5. After you add the reference to the True Type directory in the first line,
    it should read:


    ```

    catalogue = /usr/X11R/lib/X11/fonts/TrueType,

    /usr/X11R/lib/X11/fonts/misc:unscaled

    /usr/X11R/lib/X11/fonts/75dpi:unscaled

    /usr/X11R/lib/X11/fonts/100dpi:unscaled

    /usr/X11R/lib/X11/fonts/misc,

    /usr/X11R/lib/X11/fonts/TrueType,

    /usr/X11R/lib/X11/fonts/Speedo,

    /usr/share/fonts/default/TrueType

    ```'
