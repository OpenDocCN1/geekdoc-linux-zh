    What? You don''t religiously save the documentation for every piece of hardware
    you own? In that case, check the back of your PC. If the mouse is plugged into
    a little round 6-pin port, it''s PS2. If it''s plugged into a trapezoidal 9-pin
    port, it''s a serial port. Anything else is a bus port.


