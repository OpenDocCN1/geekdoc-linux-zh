    # Using Netscape Communicator


    As indicated earlier in this chapter, several Internet tools for users are included
    with Red Hat Linux 7. Of these, the most encompassing application is surely Netscape
    Communicator 4.7.4.


    Netscape Communicator is actually a suite of three applications: Navigator, Messenger,
    and Composer. Navigator is the Web browser component of the suite, Messenger the
    e-mail and newsgroup reader component, and Composer the HTML file builder used
    to create your own Web pages.


    With all these capabilities, you might think you would have a bit to set up—and
    you''d be right. The Navigator component alone has several settings that can make
    surfing the Web even faster.'
