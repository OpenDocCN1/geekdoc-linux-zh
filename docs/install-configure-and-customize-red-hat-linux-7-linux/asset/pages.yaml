  md: '# Chapter 12: Compiling a Kernel


    m sometimes asked why a Red Hat Linux user should bother to compile his system''s
    kernel. After all, the Red Hat version installs a compiled kernel, along with
    the kernel modules to support many types of hardware. Wouldn''t that work well
    enough?


    # The Advantages of Compiling Your Own Kernel


    Red Hat''s precompiled kernel may work well enough for you; that is for you to
    decide. Compiling your own kernel, however, yields numerous significant advantages:


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_301_0.png)


    Kernel module:

    A piece of code that can be inserted into or removed from a running kernel. Kernel
    modules are used to add functionality to a kernel, without taking RAM when the
    function is not needed. Conceptually, they are similar to drivers under Windows
    or extensions for the Macintosh, they can be added and removed dynamically, while
    the device with which they are associated still running. You will also see them
    referred to as loadable modules, because the Linux kernel can atomically load
    them they are needed.


    +   - Speed

    - Stability

    - The addition of new features

    - The ability to modify the source code and apply patches


    # Speed


    A kernel you compile will almost certainly be faster than the stock Red Hat Kernel,
    for three reasons:


    +   - By selecting support for the hardware you have, you customized kernel will
    be smaller than Red Hat''s generic one. This leaves more memory for programs,
    so your machine will swap a little less. This will be most noticeable on machines
    with little RAM.

    - You can use a newer compiler. The compiler used on Linux (egcs, also known as
    gcc) tends to have a new release every season. Sometimes these releases introduce
    optimization techniques, which might slightly speed up your kernel.

    - You can compile your kernel to take advantage of your particular processor''s
    features. Red Hat''s generic kernel cannot do this, because it must boot a wide
    range of machines. Red Hat''s kernel is suited wisely, whereas you have the option
    of trading some of that compatibility for speed.


    # Stability


    Another important reason to compile your own kernel is to fix bugs in the one
    shipped with Red Hat. The Linux kernel tends to be very stable (I have run production'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# The Advantages of Compiling Your Kernel


    servers on it for months end without problems), but if you have exotic hard-ware
    or use your computer in unusual ways, you may encounter problems. These are fixed
    over time, so getting the latest, most stable kernel may eliminate problems.


    > > Occasionally, Red Hat will release an updated, compiled kernel, typically
    if a serious bug is found in the shipped version. If you want to stay current
    with the smaller fixes, however, you will have to compile your own.


    Furthermore, compiling your own kernel lets you pick and choose parts of it you
    want to include. After all, the less code in your kernel (or in any piece of software),
    the less chance there is for problems.


    # Features


    In theory, each patch level of the kernel should only fix bugs and perhaps improve
    performance. In practice, though, new features and device support do creep along
    with the files. If a new piece of hardware is not well supported under your current
    kernel, try a newer one. Support may be improved.


    # Modifying the Source Code and Applying Patches


    The last reason for compiling your own kernel cuts to the heart of Linux: You
    have the source code, and you can modify it however you like to suit your needs.
    Perhaps you are a student studying computer science, or an entrepreneur with some
    unusual computer needs, or simply someone who likes to tinker. The Linux source
    code is there for you to change. Once the source is modified, you can then just
    recompile the new source code in the kernel, and your changes will be implemented,
    for good or ill.


    If you don''t want to modify the source yourself, numerous patches prepared by
    other people are available on the Internet. A patch is a set of modifications
    to the kernel source that change the kernel''s behavior in some way. For example,
    suppose you are short on disk space. By compiling your own kernel with a compression
    patch, you can have an otherwise standard system that also supports transparent
    file compression.


    > > Because this is not a programming book, this chapter focuses more on the addition
    of new patches to the kernel rather than user-modified source code.'
