  md: '# Configuring Netscape Navigator


    In the old days of the Internet (all of seven years ago), life was uncomplicated.
    There was the simple concept of hyperlinks on a page. Some links went to other
    pages, others to files to be downloaded—perhaps a picture or two. Browsers such
    as Lynx only had to contend with text. Life was good.


    In 1993, this all changed forever. The National Center for Supercomputing Applications
    (NCSA) at the University of Illinois created Mosaic—a browser capable of displaying
    text and pictures. Suddenly, users could see illustrated Web pages, which facilitated
    the flow of information. A year later, one of the Mosaic developers left NCSA
    and launched his own browser: Netscape Navigator 1.1.


    Since then, the capability of browsers has grown even more in response to complex
    content. Need to hear a sound file? No need to download the file, save it, and
    then play it using another application. Browsers can now either play the sound
    themselves or automatically that third-party application for you. Need to view
    a Shockwave file? Not only will be a browser display for you, the browser can
    automatically get the required viewer if you don''t already have it.


    This is a long way from the early Internet days, that''s for sure.


    To make all of this work for you, there are a few settings you can adjust within
    Navigator, such as the rudimentary home page and personalized start page settings.
    You can also alter the size of the cache and choose which helper applications
    Navigator will use when it encounters a file it can''t display itself.


    # Home Page and Other Easy Stuff


    Most of you have used browsers before and know that a user''s home page is the
    first HTML file loaded when the browser starts. That home page can be a local
    file or one on the Internet. You can easily specify what''s displayed, as shown
    in the following task.


