  md: '# Stars, Cards, Cables, and Hubs—nA Few of My Favorite Things


    It is most likely that you are entering the Red Hat Linux world with a computer
    that is set up and functioning with another operating system (OS)—one that is
    already connected to a network and/or the Internet. If you are not connected to
    a network and you would like it to be, this section will discuss some of the popular
    networking choices you will have to choose from.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_179_0.png)


    > For a more thorough examination of networks, see the Red Hat

    Administrator''s Guide (Prima, 2000).


    The first step in building or configuring a network is deciding what the network
    will take. The most common topology, or form, for a small-to-medium network is
    known as the star topology. Star networks are formed by machines that used twisted
    pair cable. One end of the cable is connected to the computer''s network interface
    card (NIC) and the other is connected to a hub. Although twisted pair cable resembles
    ordinary phone cable, it is not the same thing, and phone cable will not work.
    The connectors on the ends of twisted pair cable have RJ45 connectors, which resemble
    the RJ11 connectors on your telephone but are larger.


    Each computer in your star-shaped LAN will have its own cable and a connection
    to your hub. A hub is a simple device that allows several devices to connect to
    a series of receptacles built into the central hub via twisted pair cables.


    Another network form is the bus topology. The bus network is connected from computer
    to computer. Each computer, except the first and the last, has two cables connected
    to an Ethernet card. The cable used in the bus is different from the cable used
    in the star network. Bus networks use coaxial or Ethernet cable. Coaxial cable,
    often referred to as “coax,” the cable running to your cable TV, but is not the
    same. The last computer in a bus network is terminated known as a terminator.
    The first computer in the chain is usually connected on one side to the network
    and to another LAN on the other side.


    Bus networks can only function at a speed of 10Mbps; there are no 100Mbps bus
    networks. This limits the future potential for the bus network. A bus network
    is fine, however, for a small LAN—whether it’s in an office or you use it at home.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Stars, Stars, Cables, and Hubs—A Few of My Favorite


    It is possible and common in larger networks to combine a star and a bus topology.
    You can hang stars from a central bus network. This combination is beyond the
    scope of this book.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_180_0.png)


    There is also a ring topology that is based on IBM''s token ring protocol. It
    is seldom used in a small LAN, so I don''t discuss it here.


    # Network Interface Cards or Ethernet Cards


    These cards come in two different busses and three separate speeds (10Mbps, 100Mbps,
    1Gbps). The older types fit into one of your computer''s ISA bus slots. The ISA-type
    NIC is perfectly acceptable for a performance standpoint, especially in a smaller
    LAN. Its 10Mbps transfer rates exceed that of all modems and will scarcely slow
    information transfer within your LAN. The type of NIC will work fine on a Linux
    network. However, there can be a few configuration problems with ISA NICs. For
    more information on dealing with ISA devices, see Chapter 7, "Configuring Printers,
    Sound, and Other Devices."


    If you must purchase new Ethernet cards for your Linux network, buy PCI cards
    whenever possible. The PCI bus is a more modern bus architecture that allows for
    better speed and easier configuration. PCI NICs generally can be found in 100Mbps
    speeds, which should be plenty fast for a long while. The use of PCI cards also
    makes the computer more flexible to use and configure. The cost difference between
    PCI and ISA card is negligible.


    There are dozens of different makes and brands of network cards offered for sale,
    so which do you buy? Although I can''t give you an absolute recommendation (there
    are just too many choices), I have always used and had luck performance with both
    ISA and PCI cards that are NE 2000 compatible. NE200 cards are older and only
    run at 10Mbps, but they are among the longest lasting network cards around. Perhaps
    the best advice is to look at Red Hat''s compatible hardware lists and then look
    for the best deal on one of the listed cards.


    (LAN) protocol developed in 1976. Ethernet uses bus or star topologies.


    # Hubs


    Hubs are very simple devices that are almost fail-safe. The only problem with
    hubs that is you to outgrow them. It is amazing how quickly a hub (that has so
    many empty sockets when) fills up. New networking equipment just seems to appear.
    If possible, hubs in the extra large size so that you have plenty of growth—won''t
    be sorry.'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'Hubs also come in two speeds, 10Mbps and 100Mbps. The difference in price is
    not huge, but you will notice the difference in speed. Buy hubs for future growth
    and can only pay for them once. One economical option is to get a dual-speed hub,
    which can use either speed. This is a great buy if you don''t have the time or
    funds to swap your 10Mbps cards out right now but want to keep your future expansion
    plans open.


    # Switches


    In networks, a device that filters and forwards packets between LAN segments is
    called a switch. Switches are much faster network devices than hubs because they
    do not accept packets whose destinations are not on the local LAN segment. Therefore,
    switches reduce unnecessary traffic and speed up your LAN. Another cool feature
    is that, like hubs, they can pass along data from any protocol. You have to pay
    for this kind of power, though, which is why switches are not a great option for
    a home or small network.


    # Cables


    You can buy cable in bulk length and easily make your own custom cable lengths,
    or you can buy pre-made cables in every length and color under the sun. Color-coding
    is very handy when you have a dozen or cables coming and going everywhere. The
    real choice is which to buy: coaxial or twisted pair. Your choice of network topologies
    will make that decision easier.


    # Open The History Books


    A brief review is in order for those of you not keen on the finer details of the
    Internet.


    TCP/IP is the main protocol of the Internet. A protocol is the “language” that
    two computers connected to each other to use pass information back and forth.
    There are other protocols, such as IPX/SPX and NetBIOS via SMB, but TCP/IP is
    the most commonly used and is nearly universal. Other protocols usually function
    with TCP/IP. It follows, then, that nearly universal system such as Linux will
    use TCP/IP. Red Hat Linux 7 excels at communications and the use of TCP/IP.


    Applications such as File Transfer Protocol (FTP), Simple Mail Transfer Protocol
    (SMTP), and Hypertext Transfer Protocol (HTTP)—as well as Telnet and SNMP—exclusively
    use TCP/IP.


    TCP/IP is as old as the Internet; indeed, it is almost synonymous with the Internet.
    TCP/IP had its beginning when the U.S. Government''s Advanced Research Project
    Agency was looking into methods of keeping communications between computers'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'alive should normal communications systems be disrupted in the advent of a
    nuclear war. The Internet, and hence TCP/IP, have grown, or more nearly exploded,
    beyond that capacity. I like to think of this as a perfect example of the “beating
    swords to ploughshares” concept.


    There are five classes of IP address: through E. Classes A, B, and C are used
    for networking and hosts. The three classes available (A, B, and C) can be identified
    by their dotted-decimal address, which is called the IP address.


    +   - Class A: 1.nnn.nnn.nnn through 126.nnn.nnn.nnn

    - Class B: 128.nnn.nnn.nnn through 191.nnn.nnn.nnn

    - Class C: 192.nnn.nnn.nnn through 223.nnn.nnn.nnn

    - Class D: 224.nnn.nnn.nnn through 239.nnn.nnn.nnn (for multicast)


    +   - Class E: 240.nnn.nnn.nnn through 248.nnn.nnn.nnn (reserved for future use)


    An IP address that is connected to the Internet must be unique; there can be no
    duplicate addresses anywhere on the Internet. This is why IP addresses are rapidly
    disappearing. The solution is a 128-bit addressing concept for the IP protocol
    called IPv6 will be implemented over the course of time and will work with the
    current IPv4 system. Now, Internet users are concerned with using IPv4, IP. There
    are changes coming in the near future.


    # # Networking and IP Addresses


    As mentioned in the previous section, no two computers share the same IP address.
    The system used to assign an address to a computer is known as the dotted-decimal
    address, usually referred to as an IP address, or just an IP. The Class A, B,
    and C addresses are assigned to functions.


    Class A addresses are normally used for loopback communications and for very large
    organizations. Usually, 127.nnn.nnn.nnn IP addresses are used for applications
    and processes that communicate with other applications and processes on the same
    computer.


    Class C addresses are the most commonly used, especially for networks that are
    not part of a widespread organization. Class C addresses are discussed here. Most
    Class addresses are part of a LAN, which can consist of any number of computers
    (from 2 to 254 computers, or hosts as they are known in networking jargon). Two
    sets of IP addresses are assigned for use by LANs that are not part of the Internet:


    +   - 172.16.0.0 to 172.16.255.255

    - 192.168.0.0 to 192.168.255'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'These blocks of addresses are used for LANs and will not be assigned to Internet
    addresses. Any of these blocks are private network IP addresses. Probably the
    most commonly used block is the 192.168.nnn.nnn group. More discussion of these
    blocks of reserved addresses for LANs can be found in a bit.


    # # Network Configuration


    While Red Hat Linux 7 was being installed, the installation program asked for
    information concerning your network (refer to Figure 6.1). Specifically it asked
    for the following:


    +   * **Configure DHCP.** A DHCP server on the network assigns a different unused
    IP address each time your PC connects to your network. If your network uses DHCP,
    use this option.

    * **IP address.** This is the static IP address of your computer or host, if DHCP
    is not used.

    * **Netmask.** The installation script attempted to enter this; be sure it is
    correct.

    * **Network.** The installation script attempted to enter this also.

    * **Broadcast.** The installation script attempted to enter this also.

    * **Hostname.** This is the name of your ISP assigned your computer or host.

    * **Gateway.** This is the IP address assigned by your ISP for a gateway/router.

    * **Primary DNS.** A name server that may or may not be your gateway IP address.

    * **Secondary DNS.** A name server; at least one will be assigned.

    * **Ternary DNS.** A name server.


    If all the above was entered correctly during installation, you should be able
    to connect to the Internet with a Web browser such as Netscape Navigator or Lynx.
    If you cannot connect, check to make sure the information was entered correctly.


    # # Changing Your Network Configuration


    The most common reason for networking to fail is that the network configuration
    information is incorrect. To see what information was entered in the initial configuration,
    you can use one of three tools:


    +   * Netconfig

    * Network Configurator (netcfg)

    * Linuxconf'
