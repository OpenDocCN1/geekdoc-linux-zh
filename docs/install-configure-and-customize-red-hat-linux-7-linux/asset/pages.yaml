- img_proc: true
  md: '# Creating a Drive Mounting Button in GNOME


    It is quite easy to add a button to GNOME''s panel that will allow you to mount,
    unmount, and browse your removable drives. Use these steps:


    +   1. Click on the Main Menu button. The Main menu will appear.

    2. Select Applets, Utility, and Drive Mount. The Drive Mount launcher appears
    on the panel (see Figure 9.4).

    3. Right-click on the Drive Mount launcher. The context menu appears.

    4. Click on Properties. The Drive Mount Applet Properties dialog box appears (see
    Figure 9.5).


    Initially the applet is set to control the floppy drive, but you can change its
    options. The Mount point refers to the directory defined in /etc/fstab; the Update
    in seconds box refers to how often the applet checks to determine whether the
    drive has been mounted or unmounted from the command line.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_252_0.png)'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Chapter 9: Customizing Your Desktop''s Usability


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_253_0.png)


    Figure 9.5 Configuring a drive applet in GNOME.


    +   5. Make the appropriate changes and click on OK. The Drive Mount Applet Properties
    dialog box closes.


    You can start multiple drive mounting applets. Each has independent settings,
    and all will be restarted automatically each time you start GNOME.


    # Improving Red Hat''s /etc/fstab


    Before you decide that you are finished with drive windings, you should consider
    modifying other lines in /etc/fstab. A typical /etc/fstab for Red Hat Linux looks
    like this (including the /dev/jaz entry created by a previous example):


    ```

    /dev/hdal       ext2        defaults        1 1

    /dev/cdrom     mnt/cdrom  iso9660  noauto,owner,ro  0 0

    /dev/hda5      swap        swap        defaults        0 0

    /dev/fd0       /mnt/floppy  ext2        noauto,user      0 0

    none           /proc       proc        defaults        0 0

    none           /dev/pts     devpts      gid=5,mode=620 0 0

    /dev/jaz       mnt/jaz      auto        noauto,user      0 0

    ```


    In this sample code, look at the default file-system type for the floppy drive.
    I like the ext2 file system much as Red Hat does, but explicitly listing it in
    the /etc/fstab file is not a good idea. This setting prevents users from mounting
    floppies formatted with anything but ext2. I recommend that you change the ext2
    entry to auto.'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'If you are security conscious, you might want to specify the nodedev and nosuid
    options for all removable devices. The nodedev option instructs Linux to ignore
    device files on the disk; nosuid causes Linux to ignore all set-user-identifier
    or set-group-identifier bits on the disk. These options will prevent anyone from
    mounting a specially prepared disk and using it to sniff on your hard drive (bypassing
    any file permissions in the process) or to cause damage.


    > > The owner option is specific to Red Hat Linux. It is not yet documented in
    the mount manual page, but its purpose is to allow only the owner of the device
    file to mount the device. This option currently will not work on other distributions.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_254_0.png)


    # # Making Programs Start Automatically


    You may want certain programs to start automatically when you start X. This can
    be done in most desktop environments, although KDE and GNOME go one step further
    by supporting session management.


    Session management is the ability to remember which applications were running
    when the desktop was exited so that they would be restarted next time. The applications
    must support the type of session management offered by the environment. This means
    that GNOME''s session management supports only gtk-based programs, and KDE''s
    only supports those that are Qt-based.


    # # Automatically Starting Programs in KDE


    On the KDE desktop is a folder titled Autostart (see Figure 9.6). All files in
    this folder are started when KDE starts. You can place anything in the Autostart
    folder: programs, data files, links to other files, drive icons, or even URLs.


    KDE will load each file as if you had clicked on its icon, which leads to a number
    of interesting uses of the Autostart folder:


    +   - Text files will be loaded into an editor, placing a link in this folder
    to a to-do list will create a simple reader system.

    - Putting a URL in this folder will cause KDE''s Web browser to load the page.
    This can be useful, for example, if you want to start your mornings by checking
    a stock quote.

    - You can also place links to programs in this folder. Starting a large clock
    is a common thing to do.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# 226 Chapter 9: Customizing Your Desktop''s Usability


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_255_0.png)


    Figure 9.8 Autostarting objects in KDE.


    You could depend on KDE''s session management to restart KDE applications, provided
    you do not close them before exiting KDE. However, the Autostart folder tends
    to be a better solution for two reasons. First, it allows programs that are not
    session managed (that is, non-KDE programs) to be started when you log in. Second,
    the Autostart folder can guarantee that an application starts with a particular
    file or URL.


    # Automatically Starting Programs in GNOME


    GNOME is less flexible than KDE in this respect because it only allows actual
    programs to be started; you cannot add data files of any sort to the startup list.
    To define programs that should start automatically, open GNOME''s Control Center
    and select Startup Programs (see Figure 9.7). You should specify only non-qtk-based
    applications in the startup list, leaving the session manager to handle all the
    rest. If you would like to use GNOME''s session management, select Automatically
    Save Changes to Session. Select Add to incorporate an application into the startup
    list.


    # Defining File Associations


    File associations bind particular types of files (based on MIME types and/or file-name
    extensions) to an application. A MIME type is a property of every file that'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Defining File Associations


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_256_0.png)


    Figure 9.7 Autostarting programs in GNOME.


    tells any application looking at the file what kind of file it is. So, if you
    try to open a file in StarOffice, StarOffice will look at the file''s MIME type
    first to see whether it is compatible with StarOffice. That''s simple. KDE and
    GNOME both support file associations, but sometimes you have to help the environments
    out by manually defining file associations.


    The following sections show how to create an association between MP3 files and
    xmms, the Multimedia System. You will want to have the xmms package installed
    to follow along.


    # Defining File Associations in KDE


    File associations in KDE are done using MIME objects. KDE''s MIME objects associate
    three things: file-name extensions, a MIME type, and a program. If you click an
    icon on your desktop, KDE will decide what program to launch based on its extension.
    If you download a file from the Web, KDE will decide what program to launch based
    on the MIME type.


    KDE supports a global set of MIME types as well as a user''s custom set. This
    example shows how to modify a global MIME object so that all users will benefit.
    Referring to Figure 9.8 may be helpful.'
  merge: -1
