- img_proc: true
  md: '# Getting More Stuff


    Red Hat Linux comes with hundreds of programs that you can tinker with. After
    a while, you may want more programs. In the Linux world, there are two primary
    methods to get more programs. The first is from the Internet. The site, www.freshmeat.net,
    is the primary database of virtually all Linux programs available in the world.
    You can go there, search for something, and download the program you want. second
    method to get programs is through application libraries. You can buy a set of
    two, four, or even six CD-ROMs for a minimal cost that contain thousands of programs.
    These are available at the same locations Red Hat Linux CD-ROMs are sold, such
    as Cheap*Bytes and the LinuxMall.


    # Language Concerns


    When you install Linux, the installation program prompts you to select a language
    for your keyboard configuration. After the installation process is done, you can
    use the setup command to change it, but there is a much easier way to change your
    console keyboard locale at any time. For example, to switch a keyboard from its
    current U.S. configuration to Canadian French (CF), simply type:


    ```

    loadkeys cf

    ```


    To switch back, use the same command with the US parameter.


    # Play (and Work) Well with Others


    When you create a file with a text editor or with any other program, it will be
    set to a default user access permission. That default permission is set by the
    umask command. If you don''t like the default permission, it can be changed, although
    it is a bit tricky because umask works with the inverse octal number of the permission
    you want to set. For example, if you want to set your permission so the user has
    total control but no one else can read or write (a permission of 700), you can
    use the command:


    ```

    umask 077

    ```


    To set the permission so that you have all rights and everyone else read or execute
    the file but not write in it (a permission of 755), you would type:


    ```

    umask 022

    ```


    You can add this command in the /etc/profile file so it is executed at each login.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Boot Problems


    If you encounter boot problems, you may want to consider a few different culprits.
    Boot problems can be created when you modify scripts and configuration files in
    your Linux system or when you change the configuration of your physical drives.


    # Did You Modify Scripts or Configuration Files?


    When you modify scripts and configuration files in your Linux system, you may
    unwittingly make your system unbootable either by setting incorrect parameters
    or by deleting important files. A good way to enable booting so that your mistakes
    can be corrected is by issuing the following command on the LILO boot prompt:


    ```

    boot: linux init=/bin/sh

    ```


    This command launches the Linux kernel and sets the init parameter to /bin/sh,
    allowing Linux to bypass the boot scripts, which may be faulty, and launch a shell
    as root. You are then allowed to make modifications to your system.


    > This can be useful for repairing problems, but it can be a big security hole.
    Anyone is able to use this (and many other tricks) to access your system and read
    your data. Physical access to your system is required, so the solution is to make
    your system is off-limits to undesirable people. You can set a BIOS password if
    you want a more secure system, but this still doesn''t prevent someone from opening
    the system and removing the drive. Security is a huge subject—beyond the scope
    of this book—but you should be warned that anyone with physical access to a system
    can get data from it.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_336_0.png)


    # Did You Change the Configuration of Your Physical Drives?


    Another nasty problem will occur if you change the configuration of your physical
    drives. For example, assume that you have a hard disk on IDE channel 0 that is
    set to master. You want to move the drive to IDE channel 1 because you are having
    problems with one of your IDE controllers. This would cause the drive reference
    to go from hda to hdc, making it unbootable.


    The problem resides in the file /etc/fstab, which specifies where every file system
    is located and currently set to hda. You must edit the file and set it to hdc.
    Unfortunately, you can''t boot the system in such a case, even with the init=/bin/sh
    trick. You'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'need to use a Red Hat boot disk and the rescue disk created during the installation
    process. From there, you can manually edit the file and change the parameters.


    Can''t mount root filesystem


    One of the most disconcerting problems is signaled when you boot your system and
    receive the error message:


    ```

    VFS: Can''t mount root filesystem

    ```


    This means the partition on which the Linux kernel is found could not be mounted.
    There are three common causes for this error:


    +   - You recompiled your kernel and forgot to add basic features such as IDE
    support (and you use IDE disks).

    - You forgot to include support for ext2, the Linux file system.

    - The drive has failed.


    In these situations, you must use the rescue disk to boot your system. You can
    then begin to investigate the problem.


    # Hardware


    Hardware-related problems are often the most difficult to resolve because there
    are so many hardware devices using so many different protocols. Fortunately, Linux
    tools exist to help you deal with these problems.


    # Using the /proc File


    The /proc file system is a wonderful place to locate useful information about
    your hardware and about processes that are running. If you go to that directory
    and list its contents, you will find two types of files and directories:


    +   - Files such as cpinfo, devices, ide, and scsi, which list information about
    your hardware.

    - Directories with numbers as names, which are information directories about running
    processes.


    You can change to the directories and read various files to get information about
    the processes, which is useful when you are debugging serious problems or performance
    issues.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Hardware 309


    For example, if your system has dual-processors, you need to make sure Linux sees
    them both. To determine whether the second processor has been detected, type the
    following:


    ```

    cat /proc/cpuinfo

    ```


    > For Linux to see both processors, you need an SMP-compatible kernel. When you
    install Linux, you can elect to SMP to install that version of the kernel, or
    you can recompile the kernel with SMP turned on.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_338_0.png)


    # Printer Issues


    Various problems can arise with printers. For example, the printer daemon lpd
    may be running, but if you query using lpq, it responds that the printer has not
    been found or is offline. There may be many reasons for this:


    +   - The printer may really be offline. Be sure to check.

    - The cable might be bad.

    - The correct modules were not loaded. If you recompile your kernel or use some
    other custom kernel, make sure parallel port, PC-style port, and printer support
    are enabled.


    Another printer problem you may encounter is when printer/system communication
    occurs, but the output looks totally wrong. If this happens, it means you are
    using the wrong filter. Use the purport program to correct it by selecting the
    right printer filter.


    # Input Errors


    The mouse is a very important piece of hardware, especially in X. Linux may have
    problems detecting it, however. For example, if your mouse is a serial mouse,
    it may be connected to one of two serial ports, and you may need to specify which
    one. The two serial ports in Linux, found in the /dev directory, are called tty0
    and ttyS1. To make configuration easy, symbolic links are created to more common
    names. For example, the /dev/mouse file is usually a symbolic link to /dev/ttyS0.
    Your mouse is on tty1, however, you must re-do the link. Here''s how:


    ```

    rm -f /dev/mouse; ln -s /dev/ttyS1 /dev/mouse

    ```'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Chapter 13: Troubleshooting


    Another problem you may have is with the protocol used by the mouse. For example,
    if you use a Logitech mouse, you may be tempted to select the Logitech C4 protocol
    when in fact it likely requires a MouseMan protocol. The C4 protocol is used only
    with older mice; most recent mice use either the MouseMan or Microsoft protocol.


    A similar protocol problem can occur with keyboards. If you have a PS/2 mouse
    and PS/2 keyboard, the system will refuse to work correctly if you connect them
    to the wrong port.


    # Removable Drive Problems


    I experienced problems with removable disk devices, such as Zip disks and ORBs.
    For example, every Castlewood ORB disk comes formatted in DOS mode, with one extended
    FAT partition. If you try to mount it as /dev/hdc1, it may not work because the
    first four partitions on any disk are considered as primary in Linux. You may
    have to use /dev/hdc5 to mount the drive. This should work with the ORB drive.


    # Networking


    In the old days, networking was reserved for scientists and the military. Now,
    however, anyone with a computer can be linked. Conveniently, most networking problems
    have also been fixed. This section shows you how to resolve common networking
    problems.


    # Linux as a Proxy or Router


    One common usage for Linux is a proxy or router for an internal network. This
    means you need two network interface cards (NICs). Many drivers will detect only
    one card and then ignore any other cards. This can be a problem if you want both
    cards to be detected by the kernel. My system, for example, contains two NE2000
    Ethernet cards. The kernel driver used to detect these cards is ne, but the driver
    will not detect a second card unless I tell it to do so. The way to correct this
    problem is to edit the /etc/conf.modules file and specify the location of both
    cards. If the cards are at I/O ports 0x200 and 0x300, you need to add these lines:


    ```

    alias eth0 ne

    alias eth1 ne

    options ne io=0x200,0x300

    ```


    The ne module is now forced to detect both cards.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Speaking Another Protocol


    You may encounter problems if you try to use the wrong protocols on the network.
    For example, you may know your corporate LAN is an IP network, but you may not
    know the transport protocol. Chances that it is either a TCP/IP or an IPX network,
    but you should check with your administrator to find out which protocol is used
    and then use the correct configuration.


    You may also be away from a corporate office or a LAN and want to communicate
    by phone line. Three standards are common for dial-up networking: PPP, SLIP, and
    PLIP. If you want to communicating using a modem, you will probably connect to
    a PPP server and then to the Internet. Fortunately, many graphical clients exist,
    including kppp, gnome-ppp, and xisp.


    If these clients fail to work, a problem may exist elsewhere in your system. Here
    are some steps you can take to troubleshoot the situation:


    +   1. Make sure that the ppp daemon is well installed. Type the following command
    to locate the program:

    ```bash

    where pppd

    ```


    +   2. After you locate pppd, issue the following command to ensure that it is
    correctly installed:

    ```bash

    ls -l /usr/sbin/pppd

    ```


    Assuming your pppd program is in /usr/sbin, you should see the following line:

    ```bash

    -wxr-sr-x 1 root root 120020 4 May 1999 /usr/sbin/pppd

    ```


    The important part here is the two "s" in the first part of that line. If you
    see x instead, you must change that parameter to s so that you can dial out as
    a normal user. As the root user, type the following command to enable dial-out
    access:


    ```

    ```bash

    chmod +s /usr/sbin/pppd

    ```

    ```


    # Looking for Domains


    A nice trick when networking is to specify domains in which the system search
    the hosts you type. For example, if you often access various hosts on the mylan.com
    or privlan.net domains, you can edit the file /etc/resolv.conf and add the following
    line:


    ```

    ```bash

    search mylan.com privlan.net

    ```

    ```'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'The next time you try to access station2, for example, the system will first
    look to see whether station2 exists; if not, it will search for station2.mylan.com
    and then for station2.privlan.net. This makes it possible to type:


    ```

    rsh station2

    ```


    rather than the usual:


    ```

    rsh station2.privlan.net

    ```


    When dealing with networking issues, it often helps to use IP addresses rather
    than hostnames, for two reasons. First, the name server might not be available
    during routing changes or if you have problems with network access. Second, you
    may not have the time for completion of IP resolving as you try to solve a problem.
    Fortunately, many networking utilities in Linux share a common flag. The -n flag
    will enable you to make the utility display IP addresses rather than host names.
    Here are a few examples:


    ```

    netstat

    taceroute 1.2.3.4 -n

    arp -i eth0 -a proxy

    ```


    Because these commands were all given the -n flag, they will display only IP addresses.
    The first command will display the list of open ports and the list of hosts connected
    to your system. The second will trace to the IP 1.2.3.4 but will not display the
    resolved host names for the various hops. The last command will list the arp entries
    for the host proxy.


    # Dealing with E-Mail


    Many people use their Linux system as an e-mail server. There are two popular
    e-mail servers: Sendmail (which comes with your Red Hat Linux distribution) and
    Qmail.


    If you read the documentation for Sendmail, it will suggest that you complete
    configuration of the entire system before building the sendmail.cf file, which
    contains the running configuration. This is a long and complex process and needs
    to be done with the sources of the Sendmail package. Many people find it easier
    to edit the sendmail.cf file itself. In most cases, it is only necessary to edit
    the first part of the file to set your domain name and information about your
    server.


    Another common problem occurs if you want to allow systems on your own LAN to
    send e-mail using the e-mail server for SMTP communications. You need to list
    every host name that will use your e-mail server for outgoing mail in the file
    /etc/mail/relay-domains.'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'The Qmail mail server can bring problems too. If you want to allow other hosts
    to send e-mails with your server, you will need to add the following line to the
    file /etc/hosts.allow:


    ```

    tcp-env: ip1, ip2, ip3: setenv = RELAYCLIENT

    ```


    Replace ip1, ip2, and so on with host names or IP addresses of the systems that
    will send e-mail via your server.


    # Dual Networking Concerns


    If your Linux box will access two networks with two network cards, Linux must
    know about both networks in addition to both cards. A common problem occurs in
    the routing. To make sure that packets will be able to travel on both networks,
    you need to add a route for both of them. Here are the commands to add these routes:


    ```

    route add -net 10.0.1.0 netmask 255.255.255.0 dev eth0

    route add -net 10.0.2.0 netmask 255.255.255.0 dev eth1

    ```


    These entries will add two routes to the two interfaces, eth0 and eth1. You may
    also want to add the gw parameter to these code lines. This is useful if you access
    gateway servers or a default Internet route over one of these networks.


    # Access Issues


    You can easily access files on remote UNIX or Linux systems without reconfiguring
    or rebooting. First, make sure the remote system is running the NFS server and
    is allowing you to access its files. You need to specify the remote system in
    /etc/exports. (A good example can be found in the exports manual page.) When the
    remote system has your system in its exports file, you can simply remove the remote
    directory like so:


    ```

    mount -tnfs 1.2.3.4:/remote-directory /mnt/remote

    ```


    As shown in the previous command, you specify the IP address of the remote system,
    and the mount command handles the rest.


    # Security Issues


    Because security is such an important topic, additional discussion is merited
    to help in your attempts to keep your system safe. If possible, install ssh, the
    secure shell. ssh can replace—in a secure, encrypted manner—the Telnet and FTP
    services. Further, to connect to your system, a user must also use the ssh package.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# Speed Problems


    Some people have reported speed problems on PPP dial-up connections. For example,
    they use a 56Kbps modem but actually connect at much lower speeds. The principal
    program to make a PPP dial-up connection is PPPd, which will attempt to connect
    at a default speed of 33,800bps. If you want a higher rate, it must be specified.
    Many graphical dial-up clients allow you to specify a default speed. Alternatively,
    by calling PPPd manually, you can specify a default speed on the command line.
    Note that if you specify an invalid speed, the dial-out program will go back to
    its default speed of 33,800bps.


    Another reason for speed loss is the number of unwanted packets on the line. The
    Internet uses many protocols, and one of these is ICMP. This protocol is of no
    use to you unless you are running a server or router. You can use the ipchains
    command to disable it.


    # Specifying Name Servers


    Internet host names are resolved to IP addresses via the Domain Name System (DNS).
    For this to work, you must have access to a DNS server. In your netcfg utility,
    you can specify one or more addresses for name servers, which resolve host names.
    You should specify more than one name server in case your primary server goes
    down. You can also specify the name servers in the file /etc/resolv.conf.


    # Examining Open Ports


    Your system probably has many Internet ports opened: one for Telnet, another for
    DNS, and one for the FTP service. This can be a potential security hazard that
    you will need to plug. To see a list of all open ports, type the following command:


    ```

    netstat -an

    ```


    This command lists every open port and every host connected to your system. Ports
    are only numbers, however; you may see numbers you don''t recognize and want to
    know which service is associated with that port. The fuser command will tell you
    that information. For example, if you want to know which service is using the
    UDP port number 1,024, type the following:


    ```

    fuser -n udp 1024

    ```


    fuser reports the process using that port and the user who owns the process.'
