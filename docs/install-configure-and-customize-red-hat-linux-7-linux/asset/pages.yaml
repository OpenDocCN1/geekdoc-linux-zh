    # Configuring LILO


    If you plan to use more than one operating system on your Red Hat Linux PC, you
    will need to make Linux Loader (LILO) is installed in the correct location. If
    it isn''t, you may run into trouble.


    # Dual Booting Explained


    When a system with a single operating system boots, the BIOS looks at a special
    section of the hard drive called the master boot record (MBR or boot sector) to
    see what operating system will be loaded.


    When a PC has two or more operating systems, a special multi-boot application
    must reside in the boot sector that temporarily halts the boot process and allows
    the user to choose which operating system to load. LILO is just a program.


    # How to Dual Boot with Windows 95/98


    To configure LILO to run Linux and another operating system, you will need to
    use the Custom installation path. If you are installing Linux on a system preconfigured
    with Windows 95 or 98, however, you can just run the Workstation installation
    path. This is because the default LILO settings provide all you need to run both
    operating systems.'
