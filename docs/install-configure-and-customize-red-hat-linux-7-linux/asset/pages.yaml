    # # Improving the Appearance of Legacy X Applications


    You have certainly noticed by now that all X programs look and act the same. These
    differences are very obvious among the three text editors shown in Figure 8.5.
    The current crop of X applications are usually built using either the gtk or Qt
    GUI tool kits, which gives them a particular look and feel. Older X applications
    predate these tool kits and therefore do not share these newer user interfaces.
    For example, an application may have scrollbars that behave differently from those
    in gtk or Qt-based applications. Not only is it unsightly, it''s also annoying
    to launch an older X application and have it KDE color scheme and font settings.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_236_0.png)


    Figure 8.5 Inconsistent look and feel due to multiple tool kits.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Chapter 8: Customizing Your Desktop''s Appearance


    There are two basic approaches to fixing this: You can either replace the older
    application or attempt to manually customize it.


    # Replacing Older Applications


    Replacing the older application tends to be the easiest (and usually the best)
    solution. Remember, a newer application using gtk or Qt not gains a more standard
    look compared to the older application, but it also may support desirable features
    such as drag-and-drop capability and Internet awareness.


    Red Linux 7 includes mostly modern versions of utilities and applications, but
    you may still encounter older incarnations. Table 8.2 suggests modern equivalents
    you might like to try. All software—both old and new—listed in this table is included
    in Red Linux 7.


    # Table 8.2 Possible Upgrades of Legacy X


    | Old | Description | New (gtk-based) | New (Qt-based) |

    |---|---|---|--|

    | gv | PostScript viewer | n/a | kgview |

    | xcalc | Calculator | gcalc | kcalc |

    | xbib | Checks for new mail | n/a | kbiff |

    | xmh | Simple mail reader | balsa | kmail |

    | ical | Calendar and organizer | gnomecal | korganizer |

    | xfm | File manager | gmc | kfm |

    | xrn | News reader | n/a | krn |

    | xanim | Animation player | n/a | kaction |


    # Manually Customizing Older Applications


    Sometimes no modern equivalent exists for an older application. For example, many
    users have a long history with the editor emacs, and despite its less aesthetically
    pleasing interface, they don''t want to part with it. A version of emacs based
    on Qt would be, visually speaking, but it does not exist. In case such as this,
    manual tweaking of the older application is the only option.


    These older X applications (specifically, built with Motif or directly on top
    of Xlib) often have their colors and fonts controlled through a file in your home'
