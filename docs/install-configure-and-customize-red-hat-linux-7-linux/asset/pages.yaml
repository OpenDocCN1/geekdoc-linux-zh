  md: '# Chapter 2: Installing Red Hat Linux 7


    Use this procedure to make your own boot disk:


    # Creating a Linux Boot Disk


    This task demonstrates how to create a Linux boot disk.


    +   1. Format a 3.5-inch disk and leave it in the floppy drive.

    2. Insert the Red Hat Linux CD 1 into the CD-ROM window

    3. Start an MS-DOS window by selecting Programs, MS-DOS Prompt for the Start menu.

    4. Type `<drive letter>:`, where `<drive letter>` is the letter of your CD-ROM
    drive.

    5. Type `cd dosutils`. You should now be in the dosutils directory on the CD.

    6. Type `rewrite`. The rewrite application will start.

    7. When prompted for a disk image source, type `../images/boot.img`.

    8. When prompted for the target diskette drive, type `<drive letter>:`, where
    `<drive letter>` is the letter of your floppy drive.

    9. Press the Enter key when prompted. The Red Hat boot instructions will be copied
    to your floppy disk.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_73_0.png)


    > If you later choose to use the Custom installation path, you will be prompted
    to create another copy of the boot disk. Since having more boot disks is safer,
    you''ll need to go ahead and make one at that time too.


    # Navigating the Installer


    You''re ready to begin now. You have all your information, disks ready, and a
    cute stuffed penguin for luck sitting on your desk. It''s time.


    Insert the Red Hat CD-ROM 1 into your CD-ROM drive and shut down your computer.
    While the computer is off, insert the boot disk into the floppy drive. Then turn
    your computer on again. Your computer will begin the boot process, starting from
    your floppy drive. It will then use the instructions on the floppy drive rather
    than continuing to your hard drive and consequently loading your operating system.


    Remember that if you have a bootable CD-ROM drive, you will not need a boot disk.
    Your computer will read the boot instructions from the installation CD-ROM disk.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_73_1.png)'
