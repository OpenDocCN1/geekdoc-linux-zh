- img_proc: true
  md: '# Making Drives Easy to Mount


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_250_0.png)


    Figure 9.3 Configuring a drive icon in KDE.


    +   6. On the Device page, type the name of the device to mount. You might also
    want to pick icons to represent the mounted and unmounted drive.


    > Only users logged in as root can set the drive as read-only, define a different
    mount point, or define a different type of file system. These settings are already
    defined in /etc/fstab. For security reasons, the settings cannot be overridden
    unless one is logged in as root.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_250_1.png)


    +   7. After you click OK, you should be able to mount and display the files on
    the drive with a single click of the Jaz icon. To unmount, right-click the icon
    and choose Unmount.


    > If the drive fails to mount, KDE will give you the error message from the mount
    command. This is usually enough to diagnose any problems, but if not, here are
    some things to try.


    First, see if you can mount the drive from a terminal (still as the same user)
    with the command /dev/jaz. If this works, there is a problem with the icon. Double-check
    the icon''s properties. If it fails, verify that jaz is linked to /dev/hdd1 as
    you expect, the correct line is in /etc/fstab, that the disk is partitioned correctly,
    and that the partition is formatted.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_250_2.png)'
