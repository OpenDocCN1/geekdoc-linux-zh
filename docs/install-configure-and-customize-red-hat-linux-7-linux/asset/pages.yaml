- img_proc: true
  md: '# Understanding X Client Scripts


    how to do so. If you want to customize your X startup, however, it is useful to
    understand the shell scripts Red Hat uses to load the X server and clients. If
    such background information (and the flexibility it offers) does not interest
    you, skip to the next section.


    When a user starts X, either by logging in via the graphical xdm or by typing
    startup at a command prompt, the xinit is launched. View the /usr/X11R6/bin/startx
    file to see how this is done. Near the top of the file are several lines of interest:


    ```

    userclientrc=$HOME/.xinitrc

    sysclientrc=/etc/X11/xinit/xclientrc

    clientargs=""

    ```


    ```

    if -f $userclientrc ]; then

    clientargs=$userclientrc

    else if -f $sysclientrc ]; then

    clientargs=$sysclientrc

    fi

    ```


    The first two lines set variables referring to two possible scripts used to start
    X clients. The first is an optional custom script in the user''s home directory;
    the second is the default system script (part of the xinitrc package). The if
    statement determines whether these scripts exist. If the user has developed a
    custom script, clientargs will contain its name. Otherwise, the name for a system
    script will be used, if it exists.


    Other lines similar to these also exist. They differ, however, in that they are
    searching for a server startup script rather than a client script. The main purpose
    for server scripts is to find and run an X server appropriate for your video card.


    Red Hat does not use server scripts, instead installing the correct X server during
    the Linux install. You may, however, find a use for custom server scripts. One
    user might install a nonstandard X server accelerated for games and use a custom
    -/.xserverrc to start.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_224_0.png)


    Once a suitable client script is found (possibly even one passed from the command
    line), its file name is passed to xinit. The instruction line to do so can be
    found near the end of the startx script:


    ```

    xinit $clientargs -display $serverargs

    ```'
  merge: -1
