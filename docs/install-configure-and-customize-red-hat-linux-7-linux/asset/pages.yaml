    # ## /bin Directory


    The /bin directory is where the most basic executable files are are systemwide
    are stored. As you may have guessed, /bin is short for binary. Executable files
    are often referred to as binaries on UNIX-style systems, which is probably a bit
    misleading. If you use WordPerfect under Linux, for example, the files are stored
    in a binary format, but they''re not executable. Also, shell scripts files that
    are flagged as an executable file, but they aren''t stored in binary format.


    Under the /bin directory you find most of the common commands like ls, touch,
    point, cd, and other commands used by all users on the system. These fundamental
    commands are kept in this directory, separate from other programs (such as Emacs
    or games) to make it easier to recover a sick system.


