    for you using either the Workgroup or Server installation choices.


    If you want to manually partition the Linux portion of the hard drive yourself,
    you can use one of two tools: Disk Druid and Linux fdisk. Of the two, I strongly
    recommend that you choose the Disk Druid option. Although Linux fdisk (quite different
    from DOS fdisk used in Chapter 1) is very capable of partitioning the hard drive,
    it is not a very intuitive application and therefore could irreparably harm your
    drive''s partitioning.


    When you select the Manually partition with Disk Druid option and click Next you
    will see the Disk Druid screen, as shown in Figure 2.5.


    The fundamental operation of the Disk Druid tool is simple. You are given a list
