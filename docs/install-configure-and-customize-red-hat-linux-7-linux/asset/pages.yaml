    # Changing GNOME''s Window Manager


    To try a different window manager with GNOME, open GNOME''s Control Center, expand
    the Desktop category, and then select Window Manager. If the window manager you
    want to try is not already listed, you will have to add it.


    To add xwm as a possible GNOME window manager (assuming you installed it from
