  md: '# Chapter 9: Customizing Your Desktop''s Usability


    If a MIME type or an application does not appear in a list when you believe it
    should, try closing the Properties dialog box and opening it again. This will
    force KDE to re-scan all MIME types and applications. Alternatively, from the
    View menu, choose Rescan Bindings to force a re-scan at any time.


