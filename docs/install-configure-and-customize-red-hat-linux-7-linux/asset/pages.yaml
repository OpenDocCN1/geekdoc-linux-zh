  md: '# Configuring Your Devices


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_290_0.png)


    Figure 11.2 sndconfig is the best way to add sound to your PC.


    forced to troubleshoot the device (see the section in this chapter titled “Troubleshooting”
    for more information).


    The sndconfig utility, in Figure 11.2, uses a probe that is part of the small
    but very useful package isnapntools. This package detects any ISA Plug and Play
    device and then allows you (or in this case, the sound utility) to set a small
    configuration file in the /etc/directory. This file enables your Linux kernel
    to detect the sound card next time it boots. The isnapntools package is also useful
    in troubleshooting any type of ISA Plug and Play device; its documentation is
    available in the /usr/doc directory.


    An interesting thing about sndconfig is the method it uses to handle modules.
    Selecting a card and parameters for that card results in the creation of a small
    configuration file called /etc/conf.modules, which lists all the modules loaded
    at startup, not just for sound cards.


    # Configuring Your Ethernet Card with netefg


    /etc/conf.modules is a very important configuration file because it contains all
    device parameters. For example, my NE2000 Ethernet card requires the following
    two lines in conf.modules:


    ```

    alias eth0

    options ne io=0x220

    ```'
