  md: '# Compiling the Kernel: An Overview


    Compiling your Linux kernel is a fairly safe process; it is also relatively simple.
    First, you must get the latest kernel source. Although the kernel source is included
    on the Red Hat CD, you may want to download it from the Internet so that you have
    the latest features and bug fixes.


    Next, you must install the kernel source. Optionally, you can patch the kernel
    source. (If you want to change the kernel, either with an official update or a
    third-party modification, you will need to understand the patching process.)


    After the kernel source is installed (and patched, if necessary), you must configure
    the kernel, selecting the components to include in your kernel. Including only
    what you need leads to a small, reliable kernel. After you configure the kernel,
    you must compile it and the kernel modules. Finally, you must install your new
    kernel.


    # Obtaining the Kernel Source


    You can download the kernel sources from many places on the Internet, including
    Red Hat''s site (http://ftp.rehat.com), which provides the kernel sources in RPM
    format. Alternatively, you can download the kernel from the de-facto Linux kernel
    archive, http://www.kernel.org. Other major sites carrying the Linux kernel include
    ftp://metalab.umc.edu/pub/linux/kernel/ and ftp://ftp.tux.org/kernel.


    > Mirrors for the http://www.kernel.org site exist you may want to download from
    the closest to you to avoid getting into a traffic jam. You can either follow
    the link from http://www.kernel.org to the mirror sites or go directly to a mirror
    with a URL such as ftp/us.kernel.org/pub/linux/kernel/ (replace “us” with your
    own two-letter country code).


    If you do not have an Internet connection—or if your connection is slow and you
    are impatient—you can install and use the kernel sources included on the Red Hat
    CD-ROM. The package name is kernel-source. Red Hat''s kernel sources, however,
    tend lag behind what is available on the Internet, and they cannot easily be updated
    via patches. If it is possible for you to get the latest sources from the Internet
    in tar.gz or tar.bz2 format, I strongly recommend that you do so using Red Hat''s
    RPM. The .bz2 format especially has better compression, resulting in shorter download
    times. If you download the .bz2 archive, you''ll also need the bzip2 package so
    that the archive can be uncompressed.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_303_0.png)'
