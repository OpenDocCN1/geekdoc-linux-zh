  md: '# Chapter 11: Adding New Hardware


    adding new hardware to a system consists of two phases: the hardware phase and
    the software phase. You need to add the hardware device to the system, and you
    need to tell your operating system how it should be managed. The hardware phase
    is machine dependent, and the software phase is operating system dependent. Assuming
    you are working on a PC, regardless of its brand (AT, ATX, IBM, Compaq, and so
    on), installing new hardware is straightforward and the same whether you are using
    Linux or some other operating system. interface of the PC system is made in such
    a way that any device can be accessed in a standard and documented method, and
    any operating system can handle it. (There are a exceptions to this rule that
    are discussed later in this chapter.)


    In this chapter, both phases are discussed, but more emphasis is placed on the
    second phase because it is perhaps the most confusing. You may have installed
    new devices as printers or sound cards in the past, but you may not be familiar
    with how Linux handles them. First, you will see the various types of devices,
    including internal and external ones, with a warning about those devices you can
    safely install and those you should not touch unless you are a computer expert.
    Then, you will learn how the Linux kernel detects and configures hardware devices.
    You will learn about the various configuration files and how you can change parameters
    for your new devices. Finally, you will learn about Plug and Play (PnP) devices.


    Similar to the steps you took before installing Red Hat Linux, before beginning
    any installation you should check the hardware compatibility list to see if your
    device is Linux compatible. In theory, any device conforming to the standards
    in PC technologies should work. However, in recent years many companies have started
    to make devices that were replacing important chips and then using proprietary
    drivers to do the work. Although making devices less expensive to the public,
    this strategy has resulted in two big side effects. The drivers are published
    for Windows 95/98 only, and because the hardware device cannot work with the special
    Windows driver, it is incompatible with Linux or any operating system other than
    Windows. Secondly, the driver needs to do more work, which means that your CPU
    will be busy doing what the chips were supposed to do. Hence, your system will
    feel much slower, even in Windows. The sad thing about this is that most of these
    components, commonly referred to as winmodems and winprinters, are not identified
    as such on the packages. Contacting the manufacturer is often the only way you
    can be sure.


    +   * Win*'
  merge: -1
