    This devotion to detail is a bit ironic when you consider compatibility with Linux
    is not the issue; rather, the issue is compatibility with the X Window System.
    Let me explain: Linux is a text-based, command-line operating system. It’s a powerful
    system to be sure, but really just a collection of command lines like DOS. To
    make Linux a more user-friendly system to use, Linux distributors often package
    a version of the X Window System (also known as X) with a release of Linux.


