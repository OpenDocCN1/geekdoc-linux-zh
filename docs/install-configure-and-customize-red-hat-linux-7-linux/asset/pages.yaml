  md: '# To Dual Boot or Not to Dual Boot—That Is the Question


    There are six major types of file systems used on Intel-compatible PCs, today,
    as seen in Table 1.9.


    # Table 1.9 File System Types (Intel PCs)


    | File System | Used By |

    | --- | --- |

    | FAT | Windows 95, Windows 98, Windows NT |

    | FAT32 | Windows 95b, Windows 98, Windows NT, Windows 2000 |

    | NTFS | Windows NT, Windows 2000 |

    | ext2 | Linux |

    | os2 | OS/2 |

    | swap | All operating systems |


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_60_0.png)


    Different types of partitions typically do not work with other operating systems.
    Thus, in order to install Linux on your PC, you will need to create an ext2 partition
    on your hard drive. Unfortunately, if your PC contains a typical installation
    of Windows, your Windows file system is contained within one big partition that
    covers your entire hard drive. This leaves no room for a partition and a new file
    system. Remember, if you have gigabytes of empty space on your drive, this space,
    like files and directories, may be scattered throughout the drive.


    Swap partition: A section of space on a hard drive used by the computer as auxiliary
    RAM. When a program or process needs more memory than RAM exists on the computer,
    the swap partition provides additional memory for the process to use.


    The easiest way to add a partition to your existing hard drive file system is
    to use a third-party application. This shoves all your data into a single collection
    of data blocks, leaving truly contiguous empty and unstructured (unformatted)
    space elsewhere in the drive where you can install a partition.


    > Before you use any tool to manipulate and/create partitions, back up or save
    your data to an alternate physical drive.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_60_1.png)


    # PartitionMagic 5.0


    Of all the partitioning software is out on the market today, PartitionMagic is
    arguably the easiest to use and certainly the most time-tested. PartitionMagic
    enables you to create partitions on your hard drives with ease. It even comes
    with BootMagic, a multi-operating system boot utility.


    CAUTION'
