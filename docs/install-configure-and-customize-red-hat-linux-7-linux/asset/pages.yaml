  md: 'To set your own fonts, create a ~/.gtkrc file that sets the fonts you want
    to use. This will override the fonts set by any theme you may be using. You might
    want to follow the examples of some of the simpler themes in /usr/share/themes/.
    If you are adventurous, you might prefer to create your own entire theme. An excellent
    resource for more information on themes is http://www.themes.org.


    # Adding Fonts to X


    Fonts used by your X server are installed in the directory /usr/X11R6/lib/X11/fonts/.
    They are further separated by type: Speed, Type1, 75 dpi bitmap, and so on.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_234_0.png)


    # Adding Fonts to X


    You can add your own fonts to X by following these steps:


    +   1. Copy your own fonts to the correct directory (the file extension will usually
    tell you which directory). For example, suppose you have a font named font0123.spd.
    A little investigation reveals that the spd fonts are in the Speed directory,
    so that is a reasonable place to locate your font. Use this command to copy the
    font to the Speed directory:


    ```

    # cp font0123.spd /usr/X11R6/lib/X11/fonts/Speed

    ```


    +   2. You must rebuild that font directory with the mkfontdir command. Use it
    this command:


    ```

    # mkfontdir /usr/X11R6/lib/X11/fonts/Speed

    ```


    +   3. Although the font is now correctly installed, the X server has not yet
    updated its list of fonts. To make the changes take effect, you can either restart
    X or use this command:


    ```

    # xset fp refresh

    ```


    +   4. Now that your new font is available by running a font selection tool, such
    as xfontsel.


    # Adding True Type fonts


    True Type fonts require slightly more effort to set up. X does not natively understand
    True Type fonts, so you must install a True Type font server that X can use, as
    demonstrated in the next task.'
