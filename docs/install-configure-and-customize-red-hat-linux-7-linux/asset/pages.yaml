- img_proc: true
  md: 'you can decide which desktop approach you prefer to use, since each environment
    has a different presentation and work method.


    But enough discussion, let''s get to the tour!


    # Login Options


    The first place you can choose which environment you will use occurs at the login
    screen. You now have the ability to pick the environment for the account''re logging
    in to. For instance, if I log into KDE as root and set KDE as the default, KDE
    will only be set as the default for the root account. Any other accounts into
    which I may log will use their own default environment.


    The Session menu command appears in the login screen. When this command is clicked,
    the menu opens to reveal the available environment options. If you originally
    installed using the KDE Workstation path, your options will be


    +   - Default. The default environment is set by either the original installation
    or the GNOME Desktop Switching application.

    - Failsafe. The Failsafe command-line interface is used when there is difficulty
    getting an environment to run, as might occur when an incorrect video setting
    was made in Xconfigurator or xf86config that needs to be adjusted.

    - GNOME. The GNOME desktop environment.


    If you have added any other Linux desktop environments to your system, they will
    appear here as environment options as well. Once selected, the choice is confirmed
    by a message just below the Login field. After you complete your login procedure,
    the environment of your choice will appear.


    # Switching Desktop Environments


    Once inside your environment (let''s assume it''s GNOME for now), you can quickly
    switch to another environment, as you will discover in the following task.


    In Chapter 10, "Installing Software," you will learn how to install multiple desktop-environments
    on your machine if for some reason you just installed either GNOME or KDE slightly.
    For the remainder of this chapter, we''ll be working with a PC that has both GNOME
    and KDE installed.


