- img_proc: true
  md: '# Configuring Your Devices


    will need to run the Xconfigurator utility. Xconfigurator will ask you for the
    card''s information so that your system won''t fail the next time you use graphical
    mode as your Linux desktop. The same is true for your mouse.


    # External Devices


    Similar to sound cards and other internal devices, external devices are also configured
    with drivers. For example, if you add a printer, you must run the printtool utility
    to tell Linux which printer you installed, to which port it is connected (usually
    lp0), and which filter to use. The filter is the type of printer you have, which
    you learned about in Chapter 7. In the same way, the current date and time can
    be changed using timetool (see Figure 11.4).


    # Configuring Modems


    Configuring a modem can be a very complex process, especially when combined with
    the process of connecting to an Internet provider. Fortunately, graphical tools
    are available to help with configuration issues.


    The first thing you must do is get your system to recognize the modem. Red Hat
    Linux systems recognize external modems; the process for internal modems, how-ever,
    is complex.


    Most modems are ISA Plug and Play modems and can be detected with the isaptools
    package. Start by running the pnpdump utility to determine whether your system
    detects the modem. PCI modems should be detected automatically, but you may need
    to change the Plug and Play settings in your BIOS to enable them to work. Consult
    your BIOS manual to find out how to properly configure your PnP settings.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_292_0.png)


    Figure 11.4 timetool synchronizes your PC with the time and date.'
  merge: -1
