- img_proc: true
  md: '# Table 1.11 Recommended Linux Partitions for Intel PCs


    | Partition | Mount Point | Memory Allotment |

    | --- | --- | --- |

    | Boot partition | /boot | No more than 16MB |

    | Root partition | / | A minimum of 600MB for minimal install, 1.5GB to install
    all packages |

    | Swap partition | None | Equal to your PC''s RAM, a minimum of 32MB |


    You do not have to use these settings, but they are reasonably straightforward
    and will enable Linux to run at peak performance.


    # Swap Partitions and You


    The swap partition is not a new concept for those of you coming from a Windows
    background. In that environment, the swap partition was called a swap file or
    virtual memory.


    What the swap partition does, simply, is to act as extra memory beyond found in
    RAM for your applications to run. You see, applications, especially graphic interface
    applications such as X, use RAM as “workspace.” If applications require and use
    a lot of RAM, they may have to slow down or pause while waiting for other applications
    to finish and free RAM.


    To help counteract this slow-down, swap partitions use hard disk space that operating
    memory for greedy applications. Granted, swapping information into and out of
    hard drive space is slower than RAM, but it can be faster than waiting to share
    a finite amount of RAM.


    The swap partition gets no mount point, because there is generally no need for
    the user to access what''s transpiring.


    > It is a common misconception that the upper limit of the swap partition is 128MB.
    Since Linux kernel release 2.2.0, that limit is no longer a factor.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_66_0.png)'
