  md: '# Chapter 6: Customizing Your Desktop''s Appearance


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_233_0.png)


    Figure 8.4 Changing fonts in KDE.


    To change fonts, start the KDE Control Center, select Look & Feel, and then Fonts
    (see Figure 8.4).


    Increasing the font size is not always handled gracefully in KDE. To see this,
    increasing the General font from 12-point Helvetica to 16-point Helvetica, and
    then click Apply. Some of the labels beneath yours will be clipped short.


    A solution to this problem is to close the Control Center to save your changes
    and then restart KDE. Your larger font should now be displayed correctly.


    # Changing Fonts in GNOME


    GNOME''s Control Center does not have a configuration option to change the fonts
    of the desktop and applications. Loading a GNOME theme may change the font, but
    it also brings with it lots of other visual changes. There is, however, another-way
    to change fonts in GNOME.


    Before you learn how to change GNOME''s fonts, you should understand how GNOME
    applications decide what visual settings to use. A gtk-based application first
    reads the settings in /etc/gtk/gtkrc, then tries to open ~/.gtktrc, and finally,
    it reads the theme''s settings from a file as /usr/share/themes/Default/gtk/gtkrc.
    (The Default directory will be replaced by the name of the current theme).'
