    # # Using the Control Panel


    Although configuring the settings for the keyboard and mouse is primarily the
    function of the X server, it is possible to make certain settings changes from
    the window manager, too. These changes are accomplished from the Control Center.
    While these settings are not major, they are little things that can make your
    life easier.


    You can use the GNOME or KDE control panels to make these settings. Just remember
    that any changes you make will be exclusive to the environment you are configuring.


    # # Configuring the Keyboard


    To access the Control Center application in the GNOME environment, click the GNOME
    control menu and choose Settings, Peripherals, Keyboard (or Mouse). Choosing the
    Keyboard option will open the Control Center directly at the Keyboard settings
    panel, shown in Figure 3.26.


    If you are not satisfied with the performance of your keyboard, you can adjust
    the slider controls to change the values of repeating keys or keyboard clicking.
    You can also change the tone of the keyboard bell, something that in past versions
    of GNOME was handled in the Sound section of the Control Center. After making
    a change, click the Try button and test your new settings in the Test field near
    the bottom of the dialog.


