- img_proc: true
  md: 'If your modem should be detected but not or if the modem is detected but refuses
    to work, you may have what is called a “winmodem.” Such a modem lacks several
    important chips and will never work outside of Windows 95/98. If you need to buy
    a new modem, I suggest that you purchase one that is external—ensure not to be
    a winmodem.


    After the modem has been detected, you can use one of the many graphical clients
    such as gnome-ppp or kppp to connect to your Internet provider.


    # Using Modules


    Ordinarily, you must edit conf.modules manually, using a text editor as vi. Frankly,
    Red Hat Linux includes a neat utility to help you with this task: kernelcfg, which
    starts by typing kernelcfg on your console. In this utility, you can select a
    type of module to add, such as networking, and which module you want to load.
    Then you can specify parameters to pass to the module. You can also edit and remove
    modules from the same utility.


    Modules are useful because you can add functionality to the kernel without recompiling.
    Hardware manufacturers use modules to provide hardware support without releasing
    the source code to the Linux community. For example, last year Creative Labs released
    a Linux driver for their SoundBlaster Live card and posted both its module and
    installation instructions on its Web page.


    # USB


    A few pages regarding universal serial bus (USB) devices have been included here
    for two reasons. First, the USB is unlike any other port on your system. Although
    you can''t connect a monitor to a serial port, or a modem to your keyboard port,
    you can connect any type of supported device to a USB port. There are USB monitors,
    monitors, network interfaces, mice, sound devices, scanners, printers, and so
    on. Because of this, USB is the wave of the future—which is the second reason
    USB is discussed.


    USB is a bus. It may look like a simple port on your system, but its inner working
    is unlike the other ports. On a serial port, unless you use some special circuit
    workaround, only one device can be connected. On a USB port, you can connect hundreds
    of devices. Additionally, you can connect a USB hub to the USB port; hubs offer
    6 or 12 ports to connect various devices. Another interesting thing about USB
    is that it provides electrical power to the devices connected. Most serial'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'devices must be plugged directly into an electrical outlet, but many USB devices
    don''t have the same requirements. Devices that require a large amount of power
    include a power supply, but many won''t.


    When configuring USB in Linux, you must be aware that there are two parts of the
    USB bus to be supported: the USB controller and the device. USB controllers are
    made by various companies, but they follow a few standards. Linux currently supports
    those that comply with the UHCI and OHCI standards. Most USB controllers comply,
    so your controller should be supported.


    Although there are many USB devices now on the market, not all are supported.
    Table 11.2 lists a few of the supported, popular USB devices. For a complete list
    and more information about the devices listed below, refer to the USB project
    Web site, www.linux-usb.org.


    # Table 11.2 Supported USB Devices


    | Type of Device | Supported Models |

    |---||

    | Mice and keyboards | Many Logitech mice are supported, including the N48, M-BA47
    and Wingman Mouse. The Microsoft IntelliMouse Explorer is supported also. A few
    keyboards from Bekin, Cherry, Chicony and QTronix are supported. |

    | Video and imaging products | The ZoomCam 1595, Kodak DC 240, 260, and Mustek
    MDC 800 are supported. |

    | Hub devices | The USB-600 hub from ADS Technologies is supported. Asante FriendlyNet
    also makes a supported hub. The Cherry MY3000 and Edimax hubs are also supported.
    |

    | Mass storage | The Iomega 100MB Zip drive is supported. |

    | Printers | The Lexmark Optra S 2450 is supported. |

    | Audio devices | The Philips Electronics USB Digital Speaker System is partially
    supported. |

    | Scanners | HP Scanjet 4100C and 6300C scanners are supported. |

    | Misc. devices | The Anchorchips EZUSB and Cypress Thermometer are supported.
    |'
