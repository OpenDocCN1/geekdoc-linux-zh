  md: '# Resources for Checking Compatibility


    When purchasing software at the store, you can flip the box over to read its system
    requirements. For the most part, the listed requirements are usually complete.
    Alas, Red Hat Linux''s requirements are woefully generalized. Only broad parameters
    are detailed on the side of the box and with good reason: The hardware-compatibility
    lists available for Red Hat Linux are pages and pages long. Where do these famed
    lists exist? Fire up your computer, because you''re going surfing on the Web.


    # Red Hat Hardware


    It only makes sense that the best place to locate information about Red Hat Linux
    7 is on the Red Hat Web site. The hardware-compatibility lists (HCLs) for all
    of the major releases of Red Hat Linux are gathered at www.redhat.com/support/hardware.


    Before you click the Intel Hardware link to beginning the HCL for Red Hat Linux
    7, allow me to say a few words about the different levels of compatibility in
    the list: Red Hat supports a very finite set of hardware. That does not mean other
    hardware will not work with Red Hat—just that it is not directly supported.


    Red Hat divides these differing levels of compatibility into tiers: Tier 1, Tier
    2, Tier 3, and Incompatible. Each tier represents the level of compatibility or
    comfort Red Hat will have with a particular piece of hardware. Table 1.3 defines
    these levels.


    | Tier | Definition |

    | :--- | :--- |

    | Tier 1 | Fully supported hardware. Red Hat tested, used and approved. Go crazy.
    |

    | Tier 2 | Compatible and supported, but occasional problems have occurred. Red
    Hat support is limited. Proceed with caution. |

    | Tier 3 | Compatible and unsupported. Devices in this category may or not work.
    Red Hat will provide very limited support, primarily pointing you to other potential
    sources for help. Danger, Will Robinson. |

    | Incompatible | Very little of this working with Linux. Other daredevil users
    may have found workarounds, but don''t count on it. Here there be dragons. |'
  merge: -1
