    # Checking BIOS for Information


    The type of BIOS used by your PC presents another potential compatibility issue
    when you are installing Red Hat 7. The Basic Input Output System (BIOS) is firmware
    that exists on your PC regardless of what operating system you''re using. It exists
    primarily to take care of the really basic housekeeping functions of your PC.
    For instance, the controls which drive boots up and how power is managed on your
    PC.


    The BIOS may have issues with Red Hat Linux''s Loader (LILO). The LILO starts
    to load Linux (hence the name) after the BIOS is finished with its boot process.
    When Linux is loaded, LILO first looks for the boot partition, which is whatever
    partition you define to be booted first. Usually, this is the /boot partition,
    but it does not have to be. If the /boot directory is somewhere where the BIOS
    and LILO cannot find it, you''ll have a problem.


    > The setup of the boot partition (and other partitions) of Red Hat Linux 7 will
    be discussed in the “Partitions Required by Linux During Installation” section
    later in this chapter.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_39_1.png)


    Most older BIOSes handle more than two hard drives. They may not be able to locate
    data stored over cylinder 1,023 of any drive. New BIOSes have different, less
    stringent limitations, but these restrictions are still very prevalent. If you
    have an older computer, you will want to have the latest BIOS available for it.
    This will certainly ease your installation of Red Hat 7.


    To examine the BIOS settings for your computer, simply restart your system. Then
    watch closely. Before your operating system begins to load, you will typically
    see a line that says Press F2 for Setup, or something similar. Sometimes the message
    passes quickly as your computer steps through its boot-up sequence. Before your
    operating system begins to load, press the specified key to be taken into the
    BIOS setup program.'
  merge: -1
