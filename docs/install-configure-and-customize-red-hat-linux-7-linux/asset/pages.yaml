    Hex code (type L to list codes): 83

    ```


    Changed system type of partition 1 to 83 (Linux)

    If this Jaz disk is to be shared between Windows and Linux, the type should be
    set to FAT16. Windows and Linux can both read and write the FAT and VFAT file'
