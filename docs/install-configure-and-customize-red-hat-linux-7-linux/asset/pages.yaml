  md: '# Starting the Red Hat Installer


    Once the computer recognizes the bootstrap code from the floppy disk or CD-ROM
    drive, it will then start Anaconda, the Red Hat installation program. The very
    first screen of Anaconda is shown in Figure 2.1. As you can see, it''s rather
    plain, but it prompts you to make a significant decision.


    There are three installation options (sometimes termed "installation classes")
    from which you can choose when installing Red Hat Linux 7. The first is the graphical
    mode, which is a Windows-like installation that is certainly the easiest to use.
    The second option, text mode, is slightly less robust than the graphical mode.
    It will also get the job done.


    The final option is the expert mode. For now, I suggest that you stay away from
    this one. You should only use expert mode if Linux has trouble detecting the hardware
    where you need to run the installation program, such as the CD-ROM drive and the
    hard drive. Such an event is rather rare.


    Press Enter at the screen shown in Figure 2.1 to start the installation mode.


    After leaving the first screen, more hardware detections will occur. If Red Hat''s
    installation program does not recognize your video card, your screen may appear
    all white or black. If this happens, restart the PC, this time typing text at
    the opening installation prompt. Text installation mode is less picky about display
    drivers. You can configure the graphical display once Linux is installed.


    The graphical mode of installation will begin. The next sections of this chapter
    detail each step of a typical workstation installation.


