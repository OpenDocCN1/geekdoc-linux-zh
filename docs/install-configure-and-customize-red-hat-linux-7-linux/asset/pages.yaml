    # Defining File Associations in GNOME


    GNOME''s method of creating file associations differs from KDE''s in several ways.
    First, only one application can be associated with a given MIME type. Second,
    GNOME allows different applications to be defined for each of the open, view,
    and edit tasks. KDE''s method only defines an application to be used when opening
    an object.


    GNOME has no global set of mappings between MIME types, file-name extensions,
    and applications. Every user must create his or her mappings. Modifying these
    while logged in as root is not specially handled; only those associations for
    the root login are affected.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_259_1.png)


    # Defining a File Association in GNOME


    Use these steps to associate an application with a MIME type in GNOME. Again,
    while this example specifically deals with mp3 being associated with xmms, these
    steps will work for any association.


    +   1. Open the GNOME Control Center and select Document Handlers, Default Editor,
    MIME Types. A long list of existing MIME types is displayed (see Figure 9.9).

    2. If your MIME type does not exist, click Add. The audio/x-mp3 does exist, so
    for this example, click Edit. The Set Actions dialog will open (see Figure 10.90).

    3. Add the file-name extensions that you want to be handled by this association.
    These are case sensitive, so you may want to add all four: mp3, MP3, m3u, and
    M3U.

    4. GNOME allows separate applications to be associated with the MIME type for
    the actions open, view, and edit. For MP3 files, open should be defined but it
    doesn''t make sense to define the other actions. Type codecs %f into the open
    field (%f is a placeholder for the file name).'
