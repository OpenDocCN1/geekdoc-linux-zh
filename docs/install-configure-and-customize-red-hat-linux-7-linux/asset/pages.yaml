- img_proc: true
  md: 'In 1986, an international consortium of UNIX programmers began putting together
    a graphical operating system based on the GUI research done by the Xerox Palo
    Alto Research Center. This was X. After Linux was introduced in 1991, X found
    its way to the Linux desktop. When Linux began appearing on Intel-based PCs, a
    new version of X, XFree86, helped make the transition.


    XFree86 is the heart of any GUI that runs on Red Hat Linux. Also referred to as
    the X server, XFree86 is where video output and PC input are brought together
    to form one cohesive interface. PC input is obtained from basic input devices:
    the keyboard and mouse. Video output is then sent through the graphics card to
    the monitor.


    Although this sounds like the entirety of the GUI, it''s not. That''s because
    the X server is only a network-transparent display layer that provides the "home"
    for the GUI to operate. To generate the actual windows and menus that make what
    is traditionally considered a GUI, you need a window manager running on the server
    layer.


    Several window managers can be used with Red Hat Linux: AfterStep, AnotherLevel,
    Enlightenment, fwm, fwm95, KWM, olwm, Sawfish, and tvm, to name a few. The two
    people you may have heard of are GNOME and KDE.


    KDE is the K Desktop Environment—an award-winning environment that is packaged
    with Red Hat Linux 7. Often referred to as a window manager, in fact it is not.
    KDE usually runs under a window manager KWM (K Window Manager). As KWM enhances
    the look and feel of XFree86, so KDE enhances the look and tools of KWM.


    A similar relationship exists when running the GNOME (GNU Network Object Model
    Environment) desktop. GNOME is not a true window manager, either. GNOME is an
    enhancement for a window manager running on XFree86. By default, Red Hat 7 uses
    the Sawfish window manager with GNOME. Confused yet? Take a look at Figure 3.2,
    which displays a simplified representation of the relationship between all of
    these components.


    It should be noted that just because a certain combination of window managers
    and desktop environments has been installed, it does not mean that you must lock
    yourself into that combination. For example, you can run GNOME on top of fwm95
    if you want to. That is one of the great things about Linux''s open philosophy:
    You have real choices on how to run your PC.


    A big question that often asked, though, is what all these choices mean? What
    is each of these components responsible for? In the installation performed in
    Chapter 2, "Installing Red Hat Linux 7," it was recommended that you install both
    desktop


