- img_proc: true
  md: '# Appendix A: The Linux Primer


    This moves all files in the current directory, except any dotfiles. To move dotfiles,
    you have to be more explicit:


    ```

    mv .* /home/httpd/

    ```


    # Example 3: Renaming Files with mv


    Linux does not have a separate rename command, so the `mv` command is used to
    rename files. If you want to rename index.html to index.html.old, for instance,
    you use the `mv` command like this:


    ```

    mv index.html index.html.old

    ```


    As far as Linux is concerned, moving a file and renaming it are the same thing.


    # Creating Directories: The mkdir Command


    Name: mkdir


    Function: To create new directories.


    Syntax: mkdir options


    Description: The `mkdir` command is pretty straightforward. It behaves the same
    way that the MS-DOS command `mkdir` works. The Linux command does have some additional
    functionality—you can set the permissions of the directory when it is created.


    Usage: To create a directory simply type `mkdir` and any options and then the
    name of the directory you wish to create.


    Options:


    +   -m (Mode). Creates a directory with specified permissions.


    # Example 1: Creating a New Directory


    To create a new directory called /html under the current directory, use the `mkdir`
    command followed by the name of the new directory:


    ```

    mkdir html

    ```


    Suppose you want to create a new directory called download under the /tmp directory,
    and you want the new directory to have read-only permissions for other users and
    members of your group and read and write permissions for you. To do so, use the
    `mkdir` command plus the proper octal mode:


    ```

    mkdir -m 644 /tmp/download

    ```'
