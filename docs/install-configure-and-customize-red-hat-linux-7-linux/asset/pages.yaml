    # Applying Sounds to Events


    Once your sound card is configured, you can have sounds play at key events such
    as at an application''s opening or closing. This capability will allow you to
    further personalize your PC.


    # Assigning Sound Events


    This task will demonstrate how to assign sounds to certain system events on your
    Linux PC.


    +   1. Click the GNOME Sound Configuration Tool icon in the GNOME panel.

    2. Click the Sound category to open the Sound pane in the Control Center.

    3. Click the Sound Events tab to view the screen shown in Figure 7.16.

    4. Scroll through the list of events, selecting the one you want to change.

    5. Click Browse to open the Sound File dialog box (see Figure 7.17).

    6. Select the file name for the sound you want to use, and then click OK. You
    will be returned to the Control Center.

    7. Click Play to hear the sound sample. If you like the sample, click OK to save
    the configuration and close the Control Center.


    Don''t do too crazy applying sounds to your events. You''d be amazed at how tiresome
    it becomes hearing Homer Simpson saying "Doh!" with every menu selection.'
