- img_proc: true
  md: '# Networking Settings During Installation


    1. Click the Configure using DHCP option if you have a dynamic IP address or know
    that your Internet service provider (ISP) uses dynamic addressing.


    2. Click the Activate on Boot option if you want the network to start automatically
    when you start Red Hat Linux.


    3. If you''re not using DHCP on your network, enter your IP address in the next
    field. This is your IP address, assigned by your ISP or possibly your system administrator.


    If you want to use only a private LAN and have no direct Internet connection,
    you can use the group of IP addresses that has been set aside for this purpose.
    Probably the most common group used is 192.168.1.1 through 192.168.1.254. There
    are others that are reviewed in the “Networking and IP Addresses” section later
    in this chapter.


    4. Linux will attempt to automatically assign a netmask setting according to your
    IP address. Check to see that it matches the one you assigned.


    5. Linux will automatically attempt to fill in an address in the Network field,
    based on information it gleans from your network. This will be part of the information
    assigned to your PC by the network administrator if you are part of a large system.


    6. The Broadcast field will need to be filled in with a broadcast IP address if
    your PC is a broadcasting component of your network.


    7. If you are connecting directly to the Internet from your computer, you will
    be assigned a host name by your ISP or system administrator. Enter that information
    in the Hostname field.


    8. Enter your gateway or router IP address in the Gateway field.


    9. The primary DNS address may or may not be your gateway address; enter whatever
    is given to you.


    10. If you have an alternate domain server IP address, enter it in the Secondary
    DNS field.


    11. Some networks provide access to more than two name servers. Enter the address
    of any additional DNS, if you have it, in the Tertiary DNS field.


    12. Click the Next button to continue with the installation process, which is
    detailed in Chapter 2, “Installing Red Hat Linux 7.”


    Your initial networking configuration is now complete.


