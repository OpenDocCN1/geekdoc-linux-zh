  md: '# Chapter 2: Installing Red Hat Linux 7


    By the end of this chapter, you should have Red Hat Linux 7 installed on your
    PC.


    Bold statement? Hardly. The plain fact is that installation is not that big of
    a deal any more—if you did your preparation in Chapter 1, “Before You Install
    Red Hat Linux 7.” It is Important that you gathered all the information specified
    in Chapter 1 because you are going to need to double-check what the installation
    program does, entering the information yourself if need.


    Three words of advice before you begin: do not panic. If you read the instructions
    carefully and have the right information, little can go wrong.


    # Starting the Red Hat Installer


    There are various ways to install Red Hat Linux 7. The easiest way is to use the
    official Red Hat 7 CD-ROMs that you can buy with the official boxed sets in most
    software stores.


    Red Hat Linux 7 can be purchased in three flavors: The Standard, Deluxe, and Professional
    editions. The Standard edition contains the Red Hat Linux Installation Guide and
    Reference Guide, as well as a boot disk. You''ll find out about this important
    disk in the next section, “Creating a Boot Disk.” In the Deluxe and Professional
    editions, a CD-ROM set of Linux workstation applications, PowerTools, and a CD-ROM
    with StarOffice 5.1 are included for your use. The Professional edition also includes
    a bonus pack of server applications and additional Web building tools.


    If you can''t get a boxed copy of Red Hat Linux or don''t want to lay out the
    cash, you can always download the software yourself, as well as all the tools
    you need. A quick check of Red Hat-related websites will point you to these tools
    and more. For example, StarOffice, a very robust office application that''s fully
    compatible with Microsoft Office, can be found at www.com/staroffice. The documentation
    included in the boxed set is freely available in HTML or Acrobat PDF on the Web
    at www.redhat.com/support/manuals/


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_71_0.png)


    > If you download the Red Hat Linux software, I strongly recommend burning the
    material to your own set of CD-ROMs. Not only is installation easier from a CD-ROM,
    but you will also have a permanently stored set of Red Hat 7 software.'
