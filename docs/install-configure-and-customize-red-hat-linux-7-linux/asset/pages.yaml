  md: 'password that you forget it, though—especially if you don''t use Linux every
    day. On a dual-boot system, it''s very easy to install Linux, forget about it
    for a while and then go back to find you''ve forgotten your password! There are
    ways to fix this, and it''s easier not to worry about it in the first place.


    > If you are having trouble with your password but you''re sure you''re typing
    correctly, make sure that the caps lock is not toggled. Linux passwords are case-sensitive.
    Don''t be surprised how often this happens.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_356_0.png)


    Now that you''re logged in to the system, it''s time to start getting familiar
    with to navigate the Linux OS from the command line.


    # Getting Familiar with Multi-User Operating Systems


    Linux is a multi-user operating system. That means you can have several people
    logged in one Linux machine, all working simultaneously. Typical desktop operating
    systems are designed to handle only one user at a time. A typical Linux machine,
    however, can have one user logged in locally and several other users logged remotely
    over a network connection.


    # Using Virtual Terminals


    Another way to make use of Linux''s multi-user functionality is to log in multiple
    virtual terminals. While you''re logged in to the system, press Alt+F2 to be shown
    another login screen. This enables you to work on several things at the command
    line simultaneously, just by alternating between virtual terminals.


    You can be logged in to several virtual terminals at a time, which is very useful.
    If you find you need to do something as root, for example, you can log in to a
    virtual terminal and execute the commands you need to root. After you finish with
    the system administrator stuff, you can log out again so you aren''t tempted to
    work as root on everyday tasks.


    # Using the whoami Command


    If you''re logged in to five virtual terminals, some as yourself and some as root,
    what if you forget which is which? Easy. At the shell prompt, type in whoami,
    and the system tells you who you are in at that terminal. Figure A.1 shows an
    example of the output of the whoami command.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_356_1.png)'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Appendix A: The Linux Primer


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_357_0.png)


    Figure A.1 An example of the output from the whoami command.


    Another sign to look for is the shell prompt. Under bash, the shell prompt is
    a dollar sign ($) when you are logged in as a regular user. When you are logged
    in as root, the shell prompt is a pound sign (#) instead.


    # Understanding and Using File Permissions


    The key difference between the root user and the typical user on a Linux system
    is the permissions each has on the system. As the name implies, permissions indicate
    what a particular user is allowed to do. If you have permission to manipulate
    a file, Linux lets you do so. If you do not, however, the system returns a permission
    denied message.


    Permissions are very important for a multi-user operating system. They prevent
    unauthorized users from accessing files vital to the system, and prevent users
    from accessing or overwriting each other''s files.


    This makes Linux a great OS for use. When a family shares a computer, Mom, Dad,
    and the kids each have separate home directories where they can save their own
    files without worry. With legacy operating systems, such as Windows, files belonging
    to one family member often get misplaced or deleted by another family member who
    doesn''t realize the files are important. This often has the effect of contributing
    to Dad''s ulcer when his report Monday morning has been deleted to make more room
    for a game Junior downloaded.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_357_1.png)'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Getting Familiar with Multi-User Operating Systems


    There are three types of permissions: read, write, and execute. These permissions
    can apply to the owner of the file (the user), the group to which the file belongs
    (the group), and all other users (the others). By making a file owned by a particular
    user and setting permissions for the user, the group, and the others, you can
    control precisely who can access the file (see Table A.1).


    # Table A.1 Meanings of Permissions


    | Permission | File | Directory |

    |---|---|--|

    | Read | File can be read | Directory contents can be listed |

    | Write | File can be modified | Files can be created and deleted in the directory
    |

    | Execute | File can be executed | Directory can be opened |


    Typically, a new file is owned by the user who created it. The file has read and
    write permissions for that user and read for anyone else. If you don''t want anyone
    else to be able to read the file, be sure to remove the read option from the file
    for the group and for all other users. To do this, execute the following command:


    ```

    chmod 600 file

    ```


    Running the chmod (change mode) command on a file changes the mode of access to
    the file, depending on the arguments you pass to the file when you run it. In
    the preceding example, you pass the octal notation for the level of permissions
    allowed for that file. The first digit describes the permissions for the user,
    the second digit is for the group, and the last is for all other users. Also,
    note that no matter what permissions are set on a file, the root user can access
    a file.


    > The octal notation, 0-7, represents the file permissions numerically. 0 indicates
    no permissions, 1 indicates execution permission, 2 indicates write permission,
    and 4 indicates read permission. When you add the numbers together in various
    combinations, you have numbers between 0 and 7. So, for example, if you read and
    write permission, the number would be 6. For some people it is easier to remember
    number schemes than the other way round.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_358_0.png)'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'It''s also possible to tell chmod only permissions to change, rather than give
    it an entirely new set of permissions. For example, if you wanted to allow everyone
    in the file''s group to write to it, you could use this command:


    ```

    chmod g+w

    ```


    You refer to the user, group, and others with the letters u, g, and o. A plus
    sign sets the permissions; a minus sign clears them. The permissions themselves
    are indicated with r for read, w for write, and x for execute. You can specify
    multiple letters at once.


    To find out what permissions are currently set on a file, run the ls command with
    the -l argument, as follows (I use my own name as a placeholder for these examples):


    ```

    $ ls -l testfile

    -r------ 1 BKP users 0 Sep 26 15:28 testfile

    ```


    The r and the next two hyphens are related to permissions; the next three are
    related to my group''s permissions; the next three are related to permissions
    of all users. As you can see, I only have read access to the file, and no one
    else can read the file. If I had read, write, and execute access, the output would
    look like this:


    ```

    -rw-r-- 1 BKP users 0 Sep 26 15:28 testfile

    ```


    Files stored under MS-DOS or Microsoft Windows can also have permissions, but
    you''ll have fewer options because those are not multi-user operating systems.


    # Finding Hidden Files


    Unlike MS-DOS files, which can have a flag set to make them hidden, Linux files
    are hidden when they begin with a dot (period).


    Many configuration files are stored in dotfiles in each user''s home directory.
    Normally you don''t see these unless you ask to see them, as in this example:


    ```

    $ ls -a

    ./ .Xdefaults .bash_profile .emacs .mailcap .zshrc tmp/

    ../.bash_logout .bashrc .kderc .vimrc Desktop/

    ```


    # Working at the Shell


    The default shell under Red Hat Linux is the GNU BourneAgain Shell, or bash. The
    shell is the command interpreter for Linux, much like command.com


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_359_0.png)


    Dotfiles: Linux files that begin with a dot. These are commonly called dotfiles.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Understanding the Linux Philosophy: Piping and Redirecting


    is for MS-DOS or GUI equivalent, Windows Explorer, under MS Windows. The bash
    shell executes commands from standard input or from a script. Shell scripts under
    Linux are the functional equivalent of batch files under MS-DOS, except that they
    are much more powerful than the average batch file.


    The bash shell is not the only command shell available for Linux. Three other
    popular shells are csh, which is similar to the Berkeley UNIX C shell; the enhanced
    version of csh, tcsh; as well as the Z shell, zsh.


    As is often the case in Linux, there is a dizzying variety of options—far too
    many to cover in a book concerned with brevity and simplicity. Generally, the
    Bourne Again shell is probably the only shell you ever need to know. However,
    there are plenty of other shells available if you find want to experiment.


    You do not need to do anything to initialize the bash shell; it is available after
    you install Red Hat and runs whenever you log in to the computer. You can, however,
    configure the way bash behaves.


    When you log in to Linux, bash looks for a file /.bashrc in your home directory.
    If this exists, bash reads the file and executes the commands that you put in
    the file. Under Red Hat Linux, ~/.bashrc is not created by default. However, if
    you wish to customize your bash, you can easily create your own /.bashrc.


    > .bashrc is not the same as Linux as bashrc. The .bashrc file is a dot file,
    which means it is normally a hidden file. Most configuration files under Linux
    are dotfiles in the user''s home directory.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_360_0.png)


    # Understanding the Linux Philosophy: Piping and Redirecting


    As you continue reading this primer, you''ll probably notice that I mention piping
    and redirecting output and input several times. This is because to the UNIX philosophy,
    every command should be a file and operate on input and output. Any command''s
    output can be piped or redirected into a file, device, or another command. Linux
    follows the basic idea of UNIX in this fashion. I explain a few simple ways to
    utilize this in this appendix, but I can barely touch the surface of the capabilities
    of Linux. You should experiment with redirection and pipes a little on your own;
    you might be surprised what kind of timesaving shortcuts you discover.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Piping Input and Output


    Piping is taking the output of one command and making it input for another command.
    For example, to pipe the output of the ps command to the grep command to search
    for a process ID, issue this command:


    ```

    ps -ax | grep netscape

    ```


    The | is the pipe symbol. If there is a Netscape process running, grep outputs
    the lines with netscape in them to standard output (the monitor).


    # Using Direction and Redirection


    You can redirect input or output with the symbols < and > The symbol redirects
    output to a file or device. The < symbol changes a command''s input to come from
    a file or device rather than append to the keyboard.


    You can use > to create a file by redirecting output from a command to a file
    name. Be careful not to overwrite an existing file with this redirection. If you
    would rather append the output to an existing file, use >> which tells the shell
    not to clobber the file instead append to it. If you want to overwrite a file,
    use > which tells the shell to go ahead and overwrite the file without asking.
    Some shells treat > and >> the same never asking if it is okay to overwrite the
    file.


    > As always, be careful with redirection symbols. You can easily overwrite an
    important file.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_361_0.png)


    # Common Commands


    There are quite a few commands that you should familiarize yourself with in order
    to get around in Linux. Even if you plan on spending most of your time in KDE,
    GNOME or one of Linux''s other GUIs youll find using these commands in an xterm
    or at the console very useful. You will also find you are able to combine commands
    with each other to simplify everyday tasks.


    Some commands have a large number of options and they might not all be covered
    in this text if they aren''t likely to be used in normal situations. For a complete
    list of options you can consult the command''s man page.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Copying Files: The cp Command


    Name: cp


    Function: To copy files and directories.


    Syntax: cp options file(s) destination


    Description: The cp command is similar to the MS-DOS command copy; it''s used
    to copy files or directories from one place to another. You can copy one file
    to a new file, one file to another place, or a large number of files all at once
    to a new place. When you copy a file, you do not delete the original file by default.
    If you wish to move a file rather than make a copy of it, use the mv command instead.


    Usage: To use the cp command, type cp, followed by any options, and then type
    the directory or file name(s) you want to copy, followed by the destination. If
    you want to copy multiple files, you can use wildcards, or you can list multiple
    files separated by spaces.


    Options:


    +   -f (Force). Remove any existing files of the same name.

    -i (Interactive). Prompt the user if there is an existing file of the same name
    in the destination directory.

    -p (Preserve). Preserve the original file''s permissions, if possible.

    -R (Recursive). Copy directories located under the starting directory. The default
    is not to copy subdirectories.


    # Example 1: Copying a File into Another Directory


    Suppose that you download a .tgz file ~/program.tgz—which contains source—into
    your home directory, and you want to unzip and untar, but you don''t want to do
    it in your home directory. You can cp the file into the /tmp directory and work
    with it there. To do this, type the following:


    ```

    cp program.tgz /tmp

    cp: overwrite /tmp/program.tgz?

    ```


    Note that you do not get an error message if the file already exists unless you
    use the interactive option. If the file exists, you are asked whether you want
    to overwrite the file, like this:


    If you answer y, the file is overwritten; if n, the file is not overwritten.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Appendix A: The Linux Primer


    # Example 2: Copying Multiple Files into Another Directory


    If you have a group of files you want to move into another directory without having
    to type each file name individually, you can use wildcards. If you want to copy
    all files in the current directory to another directory, type


    ```

    cp * /tmp

    ```


    This copies all files in the directory to the /tmp directory; however, it does
    not copy directories unless specifically told to. To copy files and directories,
    use the recursive option.


    ```

    cp -R /tmp

    ```


    > Note that -r and -R are not equivalent. Unlike MS-DOS and Windows, Linux is
    case-sensitive. Be careful when typing commands under Linux, as interchanging
    uppercase and lowercase letters might cause unwanted and possibly disastrous results!


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_363_0.png)


    If you''d like to copy all files with a specific extension to another directory,
    you can use wildcards to selectively copy groups of files like this:


    ```

    cp *.jpg *.gif images

    ```


    This copies all JPEG and GIF files to the image directory, without copying any
    other files with them. You can also use the question-mark character (:) to match
    a single character rather than a group of characters.


    # Moving Files: The mv Command


    Name: mv


    Function: To move or rename files and directories.


    ```

    Syntax: mv options file(s) destination

    ```


    Description: The mv command can be used to move a file or files to another directory,
    or to rename a file or files. The mv command is similar to the MOVE command under
    MS-DOS, but the mv command is much more powerful than its equivalent. The mv command
    does delete the original file that is being moved, so be sure to use the command
    carefully. The mv command is also used to rename files under Linux, so it also
    takes the place of the rename command under MS-DOS.


    Usage: To move a file, type mv, followed by any options, the name of the file(s)
    or directories to be moved, and then the destination to you want'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Common Commands


    file(s) moved. As with the cp command, you can use wildcards to move multiple
    files rather than typing individual file names.


    Options:


    +   - -b (Backup). Creates a backup file of any files that would be overwritten
    by moving a file. By default, backup files have a tilde character (~) extension.

    - -f (Force). Removes any files of the same name when trying to move a file without
    prompting the user.

    - -i (Interactive). Prompts the user if moving the current file will overwrite
    another file. If there are no conflicting files, mv simply moves the file with
    no complaint.

    - -s (Suffix). Appends a suffix to any backup files. By default, you can specify
    any type of suffix, such as .bak or .tmp.


    # Example 1: Moving a File to Another Directory


    To move the file index.html to another directory without making a backup or being
    prompted in the event of an overwrite, use the mv command, followed by the name
    of the file and its destination:


    ```

    mv index.html /home/BKP/backup/

    ```


    If you''re not certain whether a file of the name already exists, use the interactive
    mode of mv. If the file already exists, your output looks like this:


    ```

    mv -i index.html /home/BKP/backup/

    mv: replace /home/BKP/backup/index.html?

    ```


    # Example 2: Moving Multiple Files to Another Directory


    You can use wildcards to move more than one file to another directory. Be careful!
    The mv command can move directories as well as regular files. Be sure you actually
    want to move everything under a directory before using the wildcard (*).


    If you want to move all the HTML files in the current directory to the /home/httpd/
    directory, use this command:


    ```

    mv *.html /home/httpd/

    ```


    The *.html specifies that you want to move all files that end in .html to another
    directory. If you want to move all files in the current directory to the /home/httpd/
    directory, you type


    ```

    mv * /home/httpd/

    ```'
