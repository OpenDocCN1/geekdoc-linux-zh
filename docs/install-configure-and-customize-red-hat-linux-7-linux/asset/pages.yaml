  md: 'If you want to boot another operating system, use the other command and the
    partition on which the other operating system resides.


    Once you are satisfied with your configuration file, run lilo; it creates an up-to-date
    map file and places the jump instruction to the boot loader in a partition or
    the MBR. If you get really good and have read all the documentation, you can also
    use this program to change partition tables and do other neat stuff.


    # The Boot Loader


    The boot loader is run automatically at boot time; it starts Linux, DOS, or whatever
    operating system you included in the configuration file. This section examines
    the partition of the LILO boot loader. You can put the LILO boot loader in the
    program code area of the MBR, but don''t unless you must. If you destroy the partition
    table in your MBR, all of the partitions on this disk are lost.


    As an added safeguard, execute this bit of LILO mysticism first:


    ```

    dd if=/dev/hda of=/fd/MBR bs=512 count=1

    ```


    This command makes a data dump of your hard drive''s entire MBR. If something
    happens and you need to restore your MBR, use the line


    ```

    dd if=/fd/MBR of=/dev/hda bs=446 count=1

    ```


    This command restores the MBR''s program code, but leaves the partition table
    alone.


    The placement of the referenced files is also very important. These files are
    usually stored together in the /boot directory. While Linux does not use the BIOS
    to access the hard drive, Linux is not loaded yet and LILO is stuck using the
    BIOS Int 13 functions. These functions cannot see anything above the 1,024 cylinder.
    The result is that the partition containing the /boot directory must be below
    this limit.


    If the partition containing your root directory extends above this limit, make
    a separate partition just for this directory. Put this partition on one of the
    first drives drives completely below the 1,024 cylinder limit. The remainder of
    Linux can be anywhere: on higher cylinders, or on any other drives.


    # LOADIN.EXE


    LOADIN is a DOS program used to boot Linux directly from DOS. It is an excellent
    alternative for the user who doesn''t want to use LILO. It is also necessary'
