    # Starting the Configuration Program


    There are three ways to run the configuration script:


    > Before running the configuration script, change to the directory containing
    the sources.


    +   - **make config.** This is the original configuration script. It asks scores
    of questions but gives you no options to change your mind. I don''t recommend
    using this to customize your kernel unless you have a lot of patience and a long
    attention span.

    - **make menuconfig.** This method contains the same configuration questions as
    make config, but it organizes them into groups and is accessible through a menu
    system.

    - **make xconfig.** This method presents the same information in the same menu
    format, except that it uses X, so you can use your mouse.


