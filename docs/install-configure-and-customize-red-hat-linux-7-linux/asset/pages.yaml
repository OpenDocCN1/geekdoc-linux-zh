  md: '# General Setup


    In this category, basic configuration options are listed.


    # Networking Support


    Enable the Networking Support option even if your computer is not networked. This
    will keep your kernel ready to handle networking if you connect your PC to a network
    later.


    # PCI Support


    Enable the PCI Support option if you have a computer with a PCI bus. Older 386
    and 486 computers typically will not; Pentiums typically will, as will Alphas.


    # MCA Support


    The MCA bus was used mainly on IBM PS/2 machines. Unless you have one of these,
    disable this option.


    # SGI Visual Workstation Support


    Enable this option only if you have one of these computers. A kernel compiled
    for an SGI Visual Workstation will not work on any other type of machine.


    # System V IPC


    Many programs use System V IPC, so you should include it.


    # BSD Process Accounting


    The BSD Process Accounting option enables you to track resources, such as CPU
    time, used on your system. This option is useful only if you run a multi-user
    system. If enabled, you should also install the psacct package.


    # Sysctl Support


    Sysctl should usually be disabled unless you are trying to build a small kernel
    such as for a rescue disk.


    # Kernel Support for a.out Binaries


    Enabling the Kernel Support for a.out Binaries option enables your kernel to run
    programs that are packaged in an older format called a.out. Despite the warning
    in the configuration utility''s help, you can compile this as a module or perhaps'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'omit it entirely because Red Hat uses the ELF format, not a.out. The only instance
    where you may need compatibility with the a.out format is to run older binaryonly
    programs obtained from other sources.


    # Kernel Support for ELF Binaries


    You should enable the Kernel Support for ELF Binaries option. Do not compile this
    as a module because all programs included with Red Hat are compiled as ELF.


    # Kernel Support for MISC Binaries


    Selecting Kernel Support for MISC Binaries allows you to start interpreted programs
    by typing the name of the script. Linux will automatically start the correct interpreter.
    Read the file /usr/src/Linux/Documentation/binfmtmisc.txt to learn how to configure
    this feature.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_315_0.png)


    > Even if you select this option, you should still select Kernel Support for ELF
    Binaries.


    # Parallel Port Support


    Parallel port support is necessary if you want to use a device attached to the
    parallel port, such as a printer or a Zip drive.


    # Advanced Power Management BIOS


    The Advanced Power Management BIOS Support option is most useful for laptops.
    Regardless of whether you include this option, you might want to install the hdparm
    package, which will power down inactive hard drives.


    # Plug and Play Support


    You should enable Plug and Play support if you have Plug and Play cards installed
    in your system. Linux can still use such cards without this option enabled, but
    selecting it makes Linux better able to automatically configure some cards.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_315_1.png)


    > If Plug and Play support is important to you and 2.2 kernels do not correctly
    configure your devices, you might want to look at the upcoming 2.4 kernels. The
    2.4 kernels should have improved Plug and Play support; you will no longer need
    to use the isapntools package.'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Block Devices


    The ways your kernel handles devices are the options here.


    # Normal PC Floppy Disk Support


    Enable this option to allow use of the floppy drive. The util-linux package includes
    a number of floppy drive tools.


    # Enhanced IDE/MFM/RLL Disk/CDROM/Tape/Floppy Support


    Unless your system has only SCSI devices, you almost certainly want to select
    this option.


    # Loopback Device Support


    A loopback device allows a file to be treated as if it were a block device. This
    has several uses, including mounting and checking a CD image before burning it
    onto the CD-ROM disc. It should definitely be enabled.


    > The configuration utility''s help warns you that you need a recent version of
    mount. Red Hat includes a suitable version. Although not strictly necessary, the
    loset utility provides more control over loopback devices than the mount program
    alone.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_316_0.png)


    NOTE


    # Network Block Device Support


    Enable the Network Block Device Support option to allow block devices to be transparently
    accessed remotely via TCP/IP. To use this, you will need the client and server
    software. Follow the URL listed in the configuration help to obtain this software;
    it is not included with Red Hat.


    # Multiple Devices Driver Support


    Enable the Multiple Devices Driver Support option to allow multiple partitions
    to be combined into a RAID. If you enable this option, you will also want to install
    the raidtools package.


    # RAM Disk Support


    The RAM Disk Support option enables you to create a RAM disk. This is useful only
    for kernels meant for installation or recovery disks.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# XT Hard Disk Support


    XT Hard Disk Support adds support for 8-bit hard disk controllers, found in older
    computers. You probably don''t have one.


    # Parallel Port IDE Device Support


    Parallel port IDE device support is required if you want to connect a drive, such
    as a Zip drive, to your parallel port. If you enable this option, be sure to enable
    both the Parallel Port Support option (listed in the General Setup menu) and the
    IDE Support option in the Block Devices menu.


    # Networking Options


    Unless you have special networking needs, you can use the defaults in the Networking
    Options section. The options discussed here require the installation of additional
    packages if enabled.


    # Network Firewalls


    If you need to provide network firewall capability on a Linux router, you should
    start out by installing the ipchains package.


    # The IPX Protocol


    The IPX protocol may be useful if you want to connect to older NetWare servers
    or to have your Linux machine act as a NetWare server. Relevant packages ipxutils,
    mars-nwe, and ncpfs.


    # SCSI Support


    If you have SCSI hardware, this category will be of interest to you.


    # SCSI Disk


    Enable SCSI disk support if you have a SCSI disk, including a removable drive
    such as the SCSI version of the Jaz drive.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_317_0.png)


    > If you plan to boot from a SCSI disk, you cannot compile this as a module.


    # SCSI Tape Support


    This option enables support of SCSI tape drives. The mt-st package may be useful.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Configuring the Kernel


    SCSI CD-ROM Support

    You''ll need this option to enable support of SCSI CD-ROM drives.


    SCSI General Support

    Enable the SCSI General Support option to allow use of some other type of SCSI
    device, such as a SCSI scanner or SCSI CD writer. sane is a basic utility to enable
    use of scanners (not just SCSI scanners), but Red Hat does not include it. To
    use a CD writer, you should also install the mkisofs and cdrecord packages.


    Probe LUNs on Each SCSI Device

    You should only enable the Probe All LUNs on Each SCSI Device option if you have
    a SCSI device that acts as several devices, such as a CD jukebox.


    SCSI Low-Level Drivers

    From the SCSI Low-Level Drivers sub-menu, you can select support for your specific
    SCSI adapter(s). Although misplaced, this sub-menu also contains support for non-SCSI
    versions of Iomega''s Zip drive.


    Iomega Parallel Port

    Select the Iomega Parallel Port option if you have a Zip drive attached to the
    parallel port. You do not need this option for SCSI Zip drives; instead, select
    the SCSI General Support option.


    Network Device Support

    Network options are handled in this category.


    Network Device Support

    Network device support should be enabled unless your computer is entirely standalone.
    There is support for a wide array of networking devices.


    PPP (Point-to-Point) Support

    To use PPP support, you must install the ppp package. The kppp graphical front-end
    may also be useful; it is in the kdenetwork package.


    Amateur Radio Support

    This option will enable you to network your computer via amateur radio. Unless
    you''re an amateur enthusiast, you will not want to select this. If you are'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Chapter 12: Compiling Kernel


    interested, however, click Help to find relevant URLs because supporting software
    is not included in Red Hat.


    # IrDA Subsystem


    This selection allows Linux to communicate with laptops and PDAs using an infrared-port.
    Be sure to install irda-utils if you need to use this.


    # ISDN Subsystem


    ISDN is a type of digital phone service that allows your computer to connect to
    the Internet faster than you can using a standard modem while leaving the phone
    available for voice. You must, of course, have an ISDN card to use this service
    and must install the isdn4k-utils package.


    # Old CD-ROM Drivers (Not SCSI, Not IDE)


    You should enable this option only if you have a CD-ROM drive that doesn''t use
    a SCSI or IDE interface. Often, these drive types connect either to a sound or
    to a proprietary card. Such drives haven''t been produced in a number of years,
    so you should probably disable this option.


    # Character Devices


    The sub-sections under Character Devices highlight a few options that, if enabled,
    require the installation of additional packages.


    # Mouse Support (Not Serial Mice)


    A useful utility for all mice (including serial mice) is gpm. The gpm utility
    allows you to cut and paste with the mouse at a console. You should enable this
    for sure.


    # Video for Linux


    The Video for Linux option allows a number of audio and video capture cards and
    FM radio cards to be used with Linux. View the configuration help for relevant
    URLs because Red Hat does not include supporting software.


    # Ftape, the Floppy Tape Device Driver


    If you have a tape drive connected to your floppy controller, enable Ftape. You
    might also be interested in the mt-st package, which is used to control tape drives.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Configuring the Kernel


    # File Systems


    In this category, the various file systems your kernel can handle are dealt with.


    # Quota


    Quota support lets you set per-user limits on disk space usage. This is typically
    useful for multi-user systems; for home, disable this option. You must install
    the quota package before you can take advantage of quotas.


    # Kernel Automounter Support


    Kernel Automounter Support allows network file systems to be mounted automatically
    as they are needed. The supporting package autofs is required if you enable this
    option.


    # Apple Macintosh File System Support (Experimental)


    If you need to read and write to Macintosh floppy and hard disks, enable this
    option. You probably would also want to install the macutil package.


    # DOS fat fs Support


    To share floppies and hard drives with Windows, check the DOS fat fs Support option.
    You will also want MSDOS fs Support and VFAT (Windows-95) fs Support.


    > You probably do not want to enable the UMSDS option. This option brings Linux
    file-system features (such as links) to FAT file systems, but it also brings the
    problems of the FAT file system to Linux (most notably, inefficiency.)


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_320_0.png)


    # ISO 9660 CDROM File System Support


    Select the ISO 9660 CDROM File System Support option if you have a CD-ROM drive.


    # Minix fs Support


    Minix file-system support is rarely necessary. Because you will almost certainly
    encounter the Minix file system, you should disable this option.


    # NTFS File System Support (Read Only)


    NTFS is the file system used by Windows NT. If you dual-boot between NT and Linux,
    you probably want to enable this option.'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'It is possible to compile with write support, but it''s not a good idea because
    the write support has not been tested extensively. Writing to an NTFS partition
    may cause corruption, especially when writing to large files.


    # OS/2 HPFS File System Support (Read Only)


    HPFS is the file system used by OS/2. If you have OS/2 installed on your computer
    or share removable disks with an OS/2 machine, you''ll want to enable this option.
    If you want write support, look at the 2.4 series of kernels.


    # /proc File System Support


    The /proc file system is a virtual file system; it is created on-the-fly by the
    kernel and does not exist on disk. It allows a number of kernel settings to be
    queried and changed. This is very useful, so enable the /proc File System Support
    option.


    # /dev/pts File System for Unix98 PTYs


    The /dev/pts File System for Unix98 PTYs option is important if you enabled the
    Unix98 PTY support option in the Character Devices menu. If so, you should enable
    this option as well.


    # ROM File System Support


    You need to enable the ROM File System Support option only if you are building
    a special-purpose kernel, such as for an installation or recovery disk. Normally,
    this option should be disabled.


    # Second Extended fs Support


    You almost certainly want to include extended fs support as part of the kernel,
    not as a module. This is the standard Linux file system. A relevant package is
    e2fprogs, which should already be on your system from the installation.


    # System V and Coherent File System Support


    Enable the System V and Coherent File System Support option if you need to share
    System V or Coherent hard disk partitions with Linux.


    # UFS file System Support


    Enable the UFS File System Support option if you want to share BSD hard disk partitions
    with Linux.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Configuring the Kernel


    # Network


    Additional network settings are included in this category.


    # Coda File System Support


    Coda is an advanced network file system. The Coda client and server are not in-cluded
    with Red Hat. Refer to the configuration help page to obtain them. Enable this
    option only if you need to work with large networks.


    # NFS File System Support


    NFS is the most common network file system for UNIX-like operating systems. If
    you want to use NFS as a server, install the knfsd package. If you want to use
    your computer as an NFS client, install the knfsd-clients package.


    # SMB File System Support


    Enabling the SMB File System Support option allows your Linux computer to connect
    to Windows file servers. You will need the samba-client and samba-com packages.
    The samba package is only needed if you want to use Linux as a Windows file server.


    # NCP File System Support


    The NCP file system enables Linux to act as a client to NetWare servers. If you
    want to choose this option, also install the kncpfs package. This option is not
    needed if you want Linux to act as a NetWare server.


    # Partition Types


    Some of the previously mentioned file systems come with their own type of partition
    table. You must enable some of the partition types offered in the Partition Types
    menu if you want to mount a hard disk with such a file system.


    # Console Drivers


    The text mode of Linux, known as the console, has settings that can be configured
    in this category.


    # VGA Text Console


    You almost certainly want to enable the VGA Text Console option. The package SVATextMode
    will allow finer control over your console.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Support for Frame Buffer Devices (Experimental)


    The Support for Frame Buffer Devices option abstracts the graphics hardware,

    hiding some of the differences between hardware. This is optional on Intel platforms
    but may be needed for others. One nice feature of this driver is that it

    places the standard text virtual console with a graphical one, allowing more

    flexibility in content, font sizes, and refresh rates. The package fbset is needed
    to

    control these settings.


    # Sound


    The Sound option lists a number of sound cards. If your precise card is not listed,

    you may need to determine which chipset it uses and then install support for that

    chipset. Regardless of what support you choose, you should install the sndconfig

    package. This allows you to easily configure and test your sound card.


    # Kernel Hacking


    Do not enable anything under the Kernel Hacking menu item unless you are doing
    kernel development work and need to test the kernel.


    # Compiling the Kernel


    After the kernel is configured, it is a simple matter to compile it. To build
    the core

    kernel, do the following:


    ```

    # make dep

    # make zImage

    ```


    Usually the make zImage command will succeed after several minutes (or perhaps

    hours for a slow computer). If you have included many options in the core kernel,

    compilation may fail with an error message similar to this:


    ```

    System is 632 kB

    System is too big. Try using bImage or modules.

    make[1]: *** [zImage] Error 1

    make[1]: Leaving directory ''/usr/src/linux-2.4.17/arch/i386/boot/

    make: *** [zImage] Error 2

    ```


    If you receive this error, you have two choices: you can reconfigure the kernel
    and

    change items previously compiled into the kernel to modules, and/or you can try
    to

    compile a big kernel with this command:


    ```

    # make bImage

    ```'
  merge: -1
  pgno: 323
- img_proc: true
  md: 'Once you have successfully compiled the kernel, you can compile the modules
    like this:


    ```

    # make modules

    ```


    These should should compile without errors.


    # # Installing the Kernel


    Once the kernel and modules are compiled, you are ready to install them. Issue
    these two commands to copy the kernel and the modules to the correct places in
    your system:


    ```

    # make install

    ```


    ```

    # make modules_install

    ```


    The first command copies the kernel to /boot/vmlinuz-2.4.17


    The second command, make modules_install, copies all modules into /lib/modules/2.4.17/.
    Again, 2.4.17 will reflect your actual kernel version.


    As a final step, you must tell the boot loader to find the new kernel. For Intel
    systems, this is done with the program logo and its configuration file /etc/lilo.conf.
    Other platforms may differ—Red Hat on Alpha uses a program called milo and the
    /etc/milo.conf configuration file. Red Hat on Sparc uses silo and /etc/silo.conf.
    These programs are similar to lilo that you can follow the examples here, but
    you should read the correct manual page for your platform (man milo or man) for
    any platform-specific concerns.


    # # Modifying LILO


    LILO is short for Linux loader. The default LILO configuration file for a Linux-only
    Red Hat system looks like this:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    default=linux

    image=/boot/vmlinuz-2.4.0-16

    ```'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 298 Chapter 12: Compiling Kernel


    ```

    label=linux

    initrd=/boot/initrd-2.4.0-16.img

    read-only

    root=/dev/hdal

    vga=ask

    ```


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_325_0.png)


    From the name, it''s obvious that LILO can boot Linux; it can also boot nearly
    any operating system that you might have on your computer. If you boot other systems
    with LILO, extra lines will exist in your /etc/lilo.conf file. You can ignore
    those lines while installing a new kernel.


    The image line and all indents below describe a Linux kernel to boot. To make
    the new 2.4.17 kernel bootable, you need to add appropriate image, label, read-only,
    and root lines. Keep the original section for the 2.4.0 kernel in case some- going
    wrong and your new kernel is not bootable, but change the label for the 2.4.0
    kernel to something else, such as backup. The next code example places the section
    for the new kernel first so that it is the default kernel; here''s how the final
    /etc/lilo.conf file looks:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    default=linux

    ```


    ```

    image=/boot/mlinuz-2.4.17

    label=linux

    read-only

    root=/dev/hdal

    image=/boot/mlinuz-2.4.0-16

    label=backup

    initrd=/boot/initrd-2.4.0-16.img

    read-only

    root=/dev/hdal

    vga=ask

    ```'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Conclusion


    Once you have modified the lilo.conf file, run lilo. This causes the changes to
    be written to the boot sector of the disk. You should see output like this:


    Added linux *


    Added backup


    ```

    The asterisk marks the entry that will be booted by default.

    ```


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_326_0.png)


    Now, safely shut down and restart your system. The new kernel will boot. If something
    goes wrong, restart, press the Tab key at the LILO boot: prompt, and then select
    the backup kernel. Most likely, however, things will load fine, and you will be
    ready to enjoy your new kernel.


    # Conclusion


    In this chapter, you learned where to download kernel sources and how to install
    the sources so that multiple versions can co-exist. You also learned to patch
    the kernel sources and how to troubleshoot errors that might occur. Finally, you
    learned how to configure the sources for your computer and then how to compile
    and install the new kernel.


    Chapter 13, “Troubleshooting,” offers specialized tips and tricks to help smooth
    away any unforeseen problems that may occur.'
  merge: -1
