- img_proc: true
  md: '# PCMCIA


    Other network-related problems can occur with the PCMCIA driver, which is the
    core driver for all laptop PC cards. It first loads itself as a module and starts
    a program that should detect any card in the PCMCIA slots. Sometimes, however,
    the driver detects the wrong type of card, especially at boot time. If this happens,
    a common trick is to remove the card and insert it again. Then see whether the
    module has detected the card properly by reading the messages in the /var/log/messages
    file.


    # Software


    Software is the primary reason computers are used. Many software packages come
    with your Red Hat Linux distribution. This section covers a few problems that
    may occur when you run some of them.


    # Internet Concerns


    A popular application under Linux is Netscape Communicator, a well-known Web browser.
    One nice feature of Netscape that is used by few people is its Personal Toolbar.
    When downloaded, Netscape includes a Personal Toolbar with buttons that you may
    not find useful, such as taking you to the Yahoo and Netscape pages. Most people,
    therefore, either turn off the Toolbar or ignore it. The Toolbar can be a more
    useful tool than Bookmarks. What appears on the Personal Toolbar is simply what''s
    listed in the Bookmarks, Personal Folder. Within the Personal Folder, you can
    create subfolders for new sites, Linux sites, and so on. To set up the Personal
    Toolbar, move your bookmarks into the Personal Folder using the Edit Bookmarks
    menu option. In this way, all of your frequently used bookmarks can be accessed
    directly from a Toolbar button.


    Many Linux users use a program Pine to get their e-mails. Pine is a console based
    client that has many features and is very easy to use. It, by default, configured
    to access only the e-messages on your local system, in a standard UNIX mail format.
    Here''s how you can use Pine both with local mail and POP mail from your Internet
    provider, without first using fetchmail or some other tool to get POP mail. Start
    by using multiple config files:


    ```

    pine -p localmail

    ```


    ```

    pine -p popserver

    ```'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'The two configuration files specified in the last commands are identical except
    for the mail fetching parameters. Now, configure Pine to use your POP server.
    Start Pine with the popupserver argument. Next, choose Setup, Config. Set your
    inbox-path parameter similar to:


    ```

    (pop.server.com/pop3/user-myid) INBOX

    ```


    The server name and user ID you should use are provided by your Internet provider.
    Now restart Pine. You will be prompted for your password and then connected to
    the remote server from where you can now use Pine just as if you were accessing
    local mail while continuing to the localmail configuration file for local mail
    handling.


    You may also want to host Web pages with your Linux system. Your system may be
    on a static link with a hostname, but you may want to support multiple hostnames
    such as www.domain1.com and www.domain2.com. The next paragraphs describe how
    to make virtual hosts in Apache, a popular Web server.


    The common way to create a virtual host is to assign one IP for each hostname.
    But if you want to host multiple hostnames on a single IP? Apache allows you to
    do so. The trick is a single command in the httpd.conf configuration file:


    ```

    NameVirtualHost 1.2.3.4

    ```


    Replace 1.2.3.4 with your real IP to tell Apache the IP on which it should serve
    the virtual hostnames. You can add virtual commands for every hostname:


    ```

    <VirtualHost www.domain2.com>

    ServerAdmin webmaster@domain2.com

    DocumentRoot /home/httpd/domain2

    ServerName www.domain2.com

    </VirtualHost>

    ```


    These commands add a virtual host and specify the files that exist for that site.
    In the DNS database, the actual www.domain2.com hostname must point to your system.
    Next, update the record so that the host points to your server. You can do so
    yourself if you own the domain2.com domain name and control its name server. If
    not, ask the owner or technical representative to do it for you.


    You may also want to create a secure Apache server, by adding an encryption library
    to the Apache-SSL project site. These sources and documentation are available
    from the www.apache-ssl.org. The encryption library can be a bit complex to install,
    so here are a few general-purpose hints. The goal is to compile the encryption
    module into the Apache binary file. You''ll need to first uncompress them both
    in the same directory and then compile the library. With a'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'provided patch, you can integrate both together. Once the compilation is done,
    continue installing the server as you would when installing a normal Apache Web
    server. Finally, you will need to create a certificate for your server. Using
    certificates is a complex topic, but you can create a temporary certificate in
    your Apache-ssl distribution until you purchase one from a company.


    # Productivity Applications


    If you need to read documents on your Linux system that were created on other
    operating systems, such as Lotus 1-2-3 or Microsoft Word, you''ll want to install
    StarOffice. The StarOffice program exists to view files from many popular formats
    and, in my opinion, is one of the best office suites available for Linux. You
    can download StarOffice from the Web site www.sun.com/staroffice. It is free for
    personal use; the instructions on how to install it are discussed in Chapter 10,
    "Installing Software.".


    Alternatively, you may have programs that you used and liked the Microsoft Windows
    or other operating system platforms, but you can''t find a similar Linux-based
    program or one that performs the same tasks as your old program. Fortunately,
    a number of emulation programs exists. For example, you can run the program DOSEMU
    on your Linux system to emulate a DOS system. You can then run various DOS applications
    while still in the Linux operating system. The same thing is true for Windows
    applications; the WINE program enables you to run many Windows 16-bit (and some
    32-bit) applications while still in Linux. For example, you could run Microsoft
    Word for Windows in Linux using the WINE emulator.


    > The WINE project is still under development and is known to fail. If you want
    to run a program such as Microsoft Word through WINE, try the 16-bit version first.
    At this time WINE emulates 16-bit Windows applications better than it does 32-bit
    ones.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_346_0.png)


    There are a number of emulators, including Executor for MacOS and VMware, a commercial
    product that simply emulates a computer. VMware enables you to run virtually any
    operating system on top of Linux.


    # Shared Libraries


    One problem that may occur when you try to run a Linux program is an error message
    telling you that a shared library was not found. Programs use libraries to'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'store functions that are common to, and shared by, many programs. If a program
    needs a library but can''t find it, the program can''t run. To avoid these situations,
    always try to install applications in RPM format, using the rpm command. RPM-format
    programs check your system for the existence of all necessary libraries on which
    the new program depends.


    # Removing Oddly Named Files


    Some programs, unfortunately, create strange-looking file names, often as temporary
    files. You should be able to remove them using the rpm command, but doing so can
    be difficult when strange alphanumeric characters are used. You may not know how
    to reproduce the character so that you can use it in the rpm string. In these
    cases, use a file manager such as me to list the files in the current directory
    and allow you to select one using your cursor or mouse. You can then delete the
    file.


    > When you type any command (such as \) that enables you to include file-name
    parameters, including a space will indicate to Linux that you have specified multiple
    files. To force Linux to look at a space-containing file name, surround the file
    name with quotation marks.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_347_0.png)


    # Working with Other File Systems


    The Linux kernel supports many file systems, but they are not always compiled
    into the kernel itself or loaded at boot time. You may need to add the required
    module before you try to mount a disk with a foreign file system. For example,
    if the MS-DOS based file system is not loaded and you try to mount a floppy formatted
    in DOS mode, you will receive an error message. To load the right module,


    ```

    modprobe msdos

    ```


    Many people use Microsoft Windows 95 OSR2 or Windows 98 alongside Linux. Mounting
    a file system from these systems on Linux using the msdos parameter won''t work.
    The msdos parameter worked with older Windows 95 file systems, but it will not
    work with newer Windows versions because the file system type has'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Useful Programs


    changed. DOS and Windows 95 used the FAT system; Windows 95 OSR2 and Windows 98
    use VFAT or FAT32. Mount a VFAT system this way:


    ```

    mount -tvfat /dev/hda2 /mnt/w98

    ```


    # Formatting Floppies in ext2 Format


    To select the file system to be used with floppies, edit the line in fstab beginning
    with /dev/fd0. The third column is the file system type. If you know you will
    always use DOS-formatted floppies, change it to msdos. If you know your floppies
    will always be formatted in Linux, set the file system to ext2.


    # Allowing Users to Mount CD-ROM Drives


    To allow any user to mount a CD-ROM drive, find the line in fstab that begins
    with /dev/cdrom. Modify the user parameter (located in the fifth column) to tell
    the Linux system to allow users to mount the CD drive. The line should read:


    ```

    /dev/cdrom /mnt/cdrom iso9660 noauto,ro,user 0 0

    ```


    # Suppressing Annoying Boot Messages


    Boot messages are designed to tell you whether everything was properly loaded
    and whether all hardware devices were detected. You may, however, strange messages
    such as the following:


    ```

    modprobe: cannot find net-pf-5

    ```


    ```

    modprobe: cannot find char-major-14

    ```


    These warnings are not important and do not mean that something has gone wrong
    in your system. They can, however, be annoying. You can turn these warning messages
    by adding the two commands to the file /etc/conf.modules:


    ```

    alias net-pf-5 off

    ```


    ```

    alias char-major-14 off

    ```


    # Useful Programs


    Many programs that may be useful in your everyday tasks are not production applications,
    but rather utilities that help you manage your files, communicate'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Chapter 13: Troubleshooting


    efficiently, and allow you to more easily troubleshoot problems. Some of these
    programs are available on your Red Hat Linux CD-ROM; all of them are listed on
    the Linux applications site at www.freshmeat.net.


    Good system brings efficiency and fewer problems, which results in more time for
    you to do real work. Several programs exist to help with this; including the following:


    +   - GProc. This program allows you to configure and manage processes, displaying
    a graphical tree of all that are currently running. GProc can be a useful tool
    to kill or wake up a process that refuses to terminate or has stopped responding.
    It allows you to send various signals to processes and is configurable to give
    you the best view of them.


    +   - GTaskMgr. This is similar to GProc. It provides you with additional information
    about the current processes and allows you to filter out some programs. It is
    somewhat similar to the Microsoft NT task manager.


    +   - gUserMan. This program is useful if you are having difficulty adding users
    and groups. It shows you all existing users and groups and allows you to add new
    ones. This is particularly useful for a server, where you may have many users
    and groups to add.


    +   - viewConfig. This program enables you to view information about your hardware.
    It lists the most important information and may be useful to you when troubleshooting
    driver problems.


    +   - Kgconfig. This program simplifies configuration of the kernel. It displays
    a graphical screen with each kernel option and provides help for those options.


    Monitoring programs help you deal with more complex problems, perhaps showing
    you information about your desktop or displaying detailed information about the
    inner working of Linux. Here are a few programs that can help you monitor your
    system:


    +   - Ethereal. This is a nice graphical monitor that captures and lists network
    packets, giving you every detail about every packet. This is particularly useful
    when you are trying to solve networking problems because it helps you determine
    which packets get to your system.


    +   - gsysboard. This small program is helpful when you are diagnosing performance
    problems. It displays summary information about system resources, including the
    CPU, RAM, and swap memory usage.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_349_0.png)'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Useful Programs 321


    +   - top. This program displays detailed information about the CPU and memory
    usage of every program running on the system. It refreshes in real time to show
    the dynamics of the processes.


    +   - Printerspy. This program monitors SNMP-enabled printers, such as some network
    printers. For example, Printerspy can alert you if the printer goes offline or
    if a paper jam occurs.


    New Linux users tend to have a particularly difficult time learning how to manipulate
    files. Fortunately, many good file managers execute to solve problems. Here are
    the file managers that may help you deal with everyday problems:


    +   - mc The mc file manager is a console-based program with many options. From
    the main interface, you can press various function keys to activate the selected
    files. mc includes a file viewer, a simple file editor, and a dialog box allowing
    you to change permissions on a file.


    +   - kfm. This is the graphical file manager for KDE. It allows you to browse
    directories, compressed files, and even the Web. kfm includes a few options and
    can be set to view files as icons or lists, with full details.


    +   - gnome-browser. This is similar to kfm but works with the GNOME desktop.
    It performs the same functions as kfm.


    Administration software allows you to manage your Linux system, even if you are
    not running a server. For example, you may want to connect to various networks,
    share files, print, or allow others to log on to your system. Several programs
    can help:


    +   - Appletalk Configurator. This program helps you configure an Appletalk network.
    From it, you can configure your network interface, printers, and files.


    +   - Comanche. This graphical tool can help you input all the parameters used
    to configure the Apache Web server. You can use Comanche to modify various settings
    in the configuration area and see the currently running Apache processes.


    +   - GLILO. This is used to configure LILO, the Linux boot loader. You can, for
    example, change which operating system is loaded by default or the amount of time
    left before LILO switches to the default. Using GLILO, you can set multiple operating
    systems and the configuration for each of them. You can also input pre-set variables,
    such as the timeout setting, the place where you want to install LILO, and an
    optional password that will be required before booting. Extensive help is also
    available for each GLILO command inside the program.'
