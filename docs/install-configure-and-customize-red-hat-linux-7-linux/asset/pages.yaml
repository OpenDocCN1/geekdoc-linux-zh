  md: 'Like Sawfish, kwm supports themes. kwm''s themes are more complete, however,
    since one setting changes the styles of both the window manager and KDE applications.
    You can select themes through KDE''s Control Center.


    # Customizing twm


    twm configuration is not done with a graphical tool. Instead, you customize twm
    by making a personal copy of the default configuration file. For twm, only one
    file is involved:


    ```

    $ cp /etc/X11/twm/system.twm ~/.tmrc

    ```


    The twm manual page describes at length the options for this configuration file.


    > If you are to modify your copy of the file, you may need to make it writable
    with the command chmod +w .tmrc &


    # Fonts


    Whether you''re a command-line junkie or a GUI guru, it''s essential to use a
    font that is easy to read. Fortunately, fonts can be changed almost everywhere
    in Linux.


    # Changing the Console Font


    Even if you do not use X, you can still change the font used on your display,
    also known as the console font. The fonts from which you can choose are located
    in /usr/lib/kbd/consolefonts/ (If the directory does not exist, be sure that the
    consoletools package is installed). Modifying the console font requires an EGA,
    VGA, or newer graphics card. Almost every computer has a suitable card.


    The next code sample is a simple script that you can use to browse the existing
    fonts. Save it where it will be referenced by your path, perhaps as ~/bin/viewfonts.
    Also, remember that these are console fonts, so they cannot be viewed while in
    X.


    ```

    #!/bin/sh

    DIR=/usr/lib/kbd/consolefonts

    for font in $DIR/*.psf

    d

    clear

    consolecharset -f $DIR/default8x16.ps*

    ```


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_231_0.png)'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Fonts 203


    ```

    consolechars -f $font

    echo This is the font:

    echo $font

    /bin/getkey

    done

    ```


    When you run this script, each font''s file name will be displayed using the attributes
    of that font. Press any key to advance to the next font. When all fonts have been
    displayed, the routine will end.


    > If a small font (such as an 8×8-pixel font) is followed by a larger font (an
    8×12, for example), it is possible that the number of lines on the screen will
    not reset correctly. This will cause the bottom half of the larger font to be
    cut off, making it hard to read. If this happens while you are viewing fonts,
    continue running the script; loading other fonts should fix it. If you run the
    script while logged in as root, you may avoid this problem.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_232_0.png)


    If you find a font you like, it can be loaded automatically every time you turn
    on your computer. The place for customizations is such as this (that is, simple
    commands that only need to run at boot) is in /etc/rc/rc.local. Add the consolechars
    command with your desired font to the end of this file. For example, if you decide
    you like the font t.psf.gz, add this to the end of the file:


    ```

    consolechars -f /usr/lib/kbd/consolefonts/t

    ```


    The extension .psf.gz can be omitted; consolechars is smart enough to figure out
    which font you mean.


    # Changing Fonts in X


    The method required to change fonts in X depends on which desktop environment
    you are using.


    # Changing KDE Fonts


    The KDE Control Center includes an option to change the display fonts. These settings
    apply to all KDE applications and the desktop. They usually not, however, affect
    GNOME or legacy X applications.


    Unless a KDE application explicitly uses a particular font, all text in KDE applications
    falls into five groups: general, fixed, window title, panel button, and panel
    clock. You can select a font for each of these groups.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_232_1.png)'
