- img_proc: true
  md: 'Unless you are very confident about what you are doing, you should follow a
    strict “look but don’t touch” policy when changing BIOS settings. One wrong move
    and you could have major system problems.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_40_0.png)


    Once inside the BIOS setup program, you should record information relating to
    your hard drives. Specifically, you are looking for how many and how large the
    hard drives are on your PC and whether they are IDE- or SCSI-type drives.


    Be careful not to confuse the appearance of multiple drive letters on a directory
    list with the true physical presence of multiple drives. Partitioning software
    can divide one real (physical) hard drive into a number of virtual (logical) hard
    drives that operating systems treat as separate entities. The BIOS will list information
    about your physical drives and information regarding logical drives can be viewed
    through any directory utility such as Windows Explorer.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_40_1.png)


    Once you''ve noted your drive information in your Linux journal, exit the BIOS
    setup program as described by your PC''s program, discarding any inadvertent changes
    you may have made. The computer will then continue to load your primary operating
    system.


    # # Checking for Network Information


    Checking for network information will now save time as you actually perform your
    Linux installation. When you install Red Hat Linux, you will be quizzed on various
    settings, such as how your PC is connected to its network. Even if your PC is
    not on a physical network, perhaps you connect to the Internet or some other system
    using a dial-up connection. Therefore, if you''ll want to access the Internet
    using that connection, it is a good idea to write down some important settings
    so that you can refer to them during Linux installation.


    If you typically use a dial-up connection to access the Internet via one of the
    national service providers such as America Online or CompuServe, be aware that
    Linux does not provide connection protocols to these services. AT&T Global Network
    Services is the only Internet service provider (ISP) with a proprietary connection
    format to which Linux will connect at this time. If you connect to the Internet
    via an ISP with the more universal PPP connection format, and then you will be
    all set.


