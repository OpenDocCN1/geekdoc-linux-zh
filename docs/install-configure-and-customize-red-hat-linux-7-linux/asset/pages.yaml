    # fips


    If you do not want to plunk the cash for PartitionMagic, never fear. Red Hat Linux
    has thoughtfully provided fips, a utility that can resize and create FAT (either
    FAT16 or FAT32) partitions in Windows systems.


    The fips utility reduces the size of your current FAT partition and creates a
    new FAT partition. Because Linux will only sit inside an ext2 file, created only
    from unformatted space during the installation process, you''ll need to run the
    DOS fdisk utility to remove the new FAT partition.


    > The fips utility is located in the \dosutils directory on the Red Hat Linux/Intel
    CD 1. Documentation for fips is located in the \dosutils\fipsdocs directory on
    the same CD. I strongly agree with Red Hat, which urges you to read the fips documentation
    before using the application.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_61_1.png)


    # When to Use fdisk


    You may have heard in computer legend and lore that eventually you will have to
    use the DOS utility fdisk on your PC. This utility is used when you have to completely
    wipe the data from your hard drive.


    > This section is referring to the DOS fdisk utility, not the Linux version of
    fdisk, which sometimes has trouble with Windows partitions.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_61_2.png)'
