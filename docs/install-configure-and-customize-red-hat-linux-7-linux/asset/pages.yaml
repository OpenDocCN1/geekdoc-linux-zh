    On the left side of the Individual Package Selection screen is a structure similar
    to a directory tree that lists all the package groups. Selecting any group will
    display a list of its individual packages on the right side of the screen.


    To select a package for installation, double-click the package name. A red check
    mark appears on the package icon, indicating its readiness for installation.


    Click Next to continue to the Unresolved Dependencies screen. This screen addresses
