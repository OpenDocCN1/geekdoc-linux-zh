    # Using the Update Agent


    Everything in the universe moves. Do you think you''re sitting still reading this
    book? Not a chance. The chair, the room, and everything else around you are careening
    through the universe at tremendous speeds. On the other end from the macroscopic,
    your body is composed of ever-moving atoms.


    Nothing is static; all is in motion.


    It stands to reason that software constantly evolves. The need to fix what is
    broken and improve what works is a big driving force in human history, software
    engineering is no different. Because we live in a universe of entropy and chaos,
    it should come as no surprise that the software in the nice white and red box
    has some flaws. It is, quite literally, a law of nature.


    To combat these flaws and improve existing features, Red Hat has provided a great
    tool in this release of Linux: the Update Agent. The Update Agent is an application
    that will monitor your installed applications and check the Red Hat FTP site for
    any newer versions of your programs that may exist. If any are found, it will
    create a Web-based checklist where you can select the applications you want to
    upgrade. Update Agent will then coordinate downloading of the packages.


    The steps to this procedure are outlined in the following task.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_271_1.png)


    # Using the Update Agent


    This task guides you through configuring and using the Red Hat Update Agent.


    +   1. Click the Main Menu icon to open the Main menu.

    2. Choose Programs, System, Update Agent. The Red Hat Update Agent window opens
    (see Figure 10.5).'
