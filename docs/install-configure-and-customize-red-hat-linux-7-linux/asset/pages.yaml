  md: '# Hard Drive


    Two types of hard drives are used in PCs: IDE and SCSI. If you haven''t already,
    you can identify the type you have by examining your system BIOS (refer to the
    section titled "Checking Your BIOS for Information"). Most hard drives are compatible
    with Red Hat Linux.


    Generally, if you have an internal IDE drive, your drive is okay by Red Hat Linux.
    Because Linux looks at the SCSI controller, the same holds true for any SCSI drive,
    either internal or external. If the controller is supported, all of the drives
    connected to it is supported by default.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_49_0.png)


    External IDE drives, such as Syquest''s removable drives, are the one incompatible
    type of drive mentioned in the HCL, but there is a workaround. Surf to the Linux
    Parallel Port Home Page (www.torque.net/linux-pp.html) to learn how to use this
    device.


    # Ethernet Card


    During the installation of Red Hat Linux, the presence of a network card is typically
    detected. Linux will then ask you for your network settings. This section of the
    HCL reveals that many cards fall into Tier 1 and Tier 2 compatibility categories.


    Given the history of Linux and its grandparent UNIX, this makes sense. After all,
    UNIX was initially designed to work on networks. Therefore, it''s logical that
    network-devices are largely compatible. Further, the communications protocols
    of the Internet are based on UNIX.


    You should make your card is listed and find out where it falls in the compatibility
    tiers. Most of the big-name cards fall into Tier 1, which is good. There are even
    token ring cards that have Tier 2 compatibility—very useful in today''s mix-and-match
    corporate environments.


    Table 1.6 lists the Ethernet cards that are known to be incompatible with Red
    Hat Linux.


    # Table 1.6 Known Incompatible Ethernet Cards


    | Manufacturer | Product |

    |---|---|

    | Intel | EtherExpress Pro/10 PCI |

    | Xircom | Ethernet adapters |'
