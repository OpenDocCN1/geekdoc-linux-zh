- img_proc: true
  md: '# single-key


    This command allows you to choose a boot image with one keystroke. For this to
    work, the boot image must have a label or alias of one character. No other label
    or alias can start with that character; in the example, I placed single quotes
    around the labels to work around this rule.


    # Other Commands


    A few commands can also be included in the configuration file.


    +   - default=(where l is a label or alias). If no input is received at the boot
    prompt, the default image is loaded. If this line is not present, the first image
    in the file is considered the default.

    - linear. If you have trouble with the boot loader, the linear command will probably
    fix the cylinders, heads, and sectors are a lot of work and probably won''t solve
    the problem. Proceed with caution.

    - compact. compact speeds up loading when booting from a floppy. This command
    and linear may conflict.


    # Configuring Your Boot Images


    The next few paragraphs describe each line of the part of the /etc/lilo.conf file
    that configure your boot images. You need a different boot image for each operating
    system.


    ```

    image=/boot/mlinux

    ```


    Different operating systems have different requirements. The first boot image
    begins with the text image=/boot/mlinux. Use image Linux from an image file. The
    Linux kernel''s image file is normally named /boot/mlinux.


    ```

    label=''Linux''

    alias=

    ```


    Each boot option needs a distinct name or label. I included aliases for each label
    for my single-key functionality, but I wanted the more verbose labels to display
    when the Tab key is pressed at the boot prompt. Note that the label Linux begins
    with a single quote so that the label and alias don''t start with the same character.


    ```

    root=/dev/hda2

    ```


    root tells LILO on what partition to mount Linux as root (/).'
  merge: -1
  pgno: 415
