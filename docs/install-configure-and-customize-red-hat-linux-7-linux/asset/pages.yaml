  md: '# Chapter 6: Configuring Network Connection


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_193_0.png)


    Figure 6.14 Getting from Point A to Point B on the Internet.


    # Using traceroute to Trace Your Connection


    traceroute is a handy command to use when you are trying to find where along the
    line of communications a problem exists. The Internet is far from a sure thing
    and sometimes overloading, equipment failure, backhoe operators, or snowstorms
    to cut the convoluted routing that paths take. If you enter the command traceroute
    [your ISP''s name] or traceroute [your ISP''s IP address], you will get a printout
    of the various connections that were made to connect to your ISP, as shown in
    Figure 6.14. Terminate traceroute by pressing Ctrl+C.


    # Using ping to Test Your Connection


    The ping command (for example, ping 192.nn.n.nnn using your gateway IP) is employed
    by savvy Internet users. It actually tells your computer to send a batch of packets
    to another computer. The receiving computer will answer “ping”, and your computer
    will then count how many packets were sent and how many were returned. ping can
    be used within your LAN or out to the Internet and is very useful for determining
    whether you are transmitting and receiving information from your computer. You
    can also use a known functioning computer to ping a questionable machine. ping
    will also help to establish whether your communications are causing problems with
    excessive packet loss.


    The ping command is not self-terminating, which means that your machine will continue
    to ping if you let it. (It is considered very bad to ping a gateway or someone
    else''s computer continuously.) In their Acceptable Use Agreements, many ISPs
    forbid the pinging of their routers'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Problem Cards and Plug and Play


    or DNS servers for periods of time. Also, firewalls do not allow pinging in one
    direction, or altogether. To stop a ping, press Ctrl+C. The ping will terminate
    and the program will return a count of the number of packets sent and received.


    # Problem Cards and Plug and Play


    If you must purchase a new NIC to use with Red Hat Linux 7, be sure to first go
    to the Red Hat site (**www.redhat.com/support/hardware**) and check for hardware
    compatibility. Red Hat maintains an extensive list of hardware known to work and
    not work, which makes selecting hardware easier and smoother installation.


    # Problems with Plug and Play


    If you already have a card that is listed and does not seem to work (but functions
    fine under Microsoft Windows), it may be an ISA PNP card. Linux support for Plug
    and Play (PnP) is limited, and Plug and Play was created for a proprietary operating
    system, Windows, which is not open source.


    The easiest way to get an unsettling PNP card to work under Linux is to disable
    its Plug and Play function. Old PnP cards had small DIP switches or jumpers that
    could be moved to disable PnP. You will need to consult the card''s documentation
    or the manufacturer''s Web site for the settings. PnP settings for newer (meaning
    most) cards are set in the BIOS of the card. To disable a Plug and Play card,
    you need to go to MS-DOS, insert the driver for the card, and then follow the
    instructions for the card.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_194_0.png)


    Once the PnP function is disabled, you can use Linuxconf to set the card to the
    kernel module for the card and assign an I/O address and an IRQ for the card in
    the Adapter tab of the Basic Hot Information category. The card will then function
    fine under Linux. including two NICs, of which is an ISA PNP card that was installed
    in.


    You can also assign a module, I/O, and IRQ addresses in the /etc/conf.modules
    file. To do so, add the following lines


    ```

    alias eth0

    options I/O=0xnnn Irq=nn

    ```


    where is a module. To see if an Ethernet card is properly configured and working
    as expected, try the following:


    ```

    ifconfig eth0

    ```


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_194_1.png)'
  merge: -1
