- img_proc: true
  md: '# Troubleshooting


    Although they may not talk about Linux configuration, they will include useful
    information such as the IRQ and I/O ports supported by the device.


    You should also determine the purpose for any jumpers that may exist on the device.
    Some newer devices don''t have jumpers, but you should check any troublesome devices
    to see whether they exist.


    # LILO


    The initial system configuration is done in /etc/lilo.conf. This file tells LILO
    what parameters to pass to the kernel, which file is the actual kernel, and which
    hard disk should be booted on startup. If you have problems with the initial startup,
    type man lilo.conf to refer to the complete syntax of commands.


    One such parameter you may need to add is the amount of memory (RAM) you have.
    If Linux detects 16MB and you know you have 24MB, add the following line to the
    configuration file:


    ```

    append = ''mem=24M''

    ```


    If you have a problem where a device is not detected by the kernel, you need to
    look elsewhere for a solution. For example, most drivers are loaded from the configuration
    and startup scripts, as we will examine in the next sections.


    # Configuration Scripts


    The scripts used by the Red Hat utilities are stored in /etc/sysconfig, which
    contains files describing the mouse, network card, network configuration, and
    PCMCIA. Unless you are confident that you know exactly what you are doing, you
    should not attempt to modify any file in this subdirectory.


    If you find that the Red Hat utilities are not able to complete the settings you
    require and have tried everything else, you may need to edit the configuration
    files manually. They are text files, so you can edit them with your favorite text
    editor—but again, you must be very careful. You may want to check the Red Hat
    Linux Web site to search for a solution to your specific problem before delving
    into this procedure.


    # Startup Scripts


    The scripts that display PASSED or FAILED on these screen when you boot system
    is stored in /etc/rc.d. You may need to edit one of these scripts if you can see
    (by looking at the boot messages) that a parameter needs to be changed for one
    driver.'
