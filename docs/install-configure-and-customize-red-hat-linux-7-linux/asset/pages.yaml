    Another very useful command is du. This command gives size of directories and
    files. It is particularly useful because it adds the size used by files in subdirectories.
    The -s switch produces a single number for the size of the current branch. Size
    is measured in blocks unless you use the -h switch for more readable output. If
    you want to see the size of the branches off the root directory, type the following:


    ```

    du -sh /*

