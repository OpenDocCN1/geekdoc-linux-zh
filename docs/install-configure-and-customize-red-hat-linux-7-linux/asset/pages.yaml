    +   7. Create the application object by returning to the file browser. From the
    Edit menu, choose Global Applications. A number of categories appear; open the
    Multimedia folder.


    +   8. In this folder, create a new program for xmms by right-clicking and choosing
    New, Application.


    +   9. Name the object xmms.kdelink


    +   10. The Properties dialog box for xmms.kdelink should open. Click the Execute
    tab of the Properties dialog box, and then use xmms.


    +   11. Change to the Application page, select the new audio/x-mp3 MIME type,
