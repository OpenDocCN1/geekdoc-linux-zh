  md: '# Introduction


    Now that Linux is making headway in the PC arena, many changes are being made
    to some of these troublesome areas. With Red Hat Linux 7, no longer is it necessary
    to use strange, arcane rituals to install the OS on your PC. Installing software
    and hardware, while still sticky, is becoming easier as ever.


    Linux is not perfect; nothing ever is. Red Hat Linux can be characterized as being
    in its adolescent phase, awkward with great potential. Which is why this book
    has been written—show you the ins and outs of working with one of the hottest
    operating systems today.


    # Is This Book for You?


    Oh sure, we could lie to you and say "yes" no matter what. But, to be honest,
    this book is not for everyone. Much of the book focuses on customization and configuration
    issues with X Window and Red Hat Linux—something that will rankle "pure" Linux
    enthusiasts who prefer to use the console all the time. To those advanced users,
    I might suggest getting another book that suits your needs.


    This book is geared for more new Linux users, especially those of you who possess
    any skill level in the Microsoft Windows arena and are now wondering what the
    heck this whole Linux thing is about. There are parts of Linux that will seem
    nice and familiar to Windows users, and parts that will seem like an alien landscape.


    Linux users with a moderate amount of experience will also benefit from this book,
    as several powerful configuration methods will be revealed.


    # How This Book Is Organized


    Like the title says, this book is designed to help you install, configure, and
    customize Red Hat Linux 7. For that purpose, the chapters of the book are organized
    in these three major sections:


    +   * Installing Red Hat 7

    * Configuring Red Hat 7

    * Customizing Your Red Hat 7 System


    Finally, an extensive appendix section will provide a Linux primer, online resources,
    and a hardware configuration journal template.'
