  md: '# Appendix A: The Linux Primer


    There are nine sections of man pages. They are:


    +   1. **Commands.** Commands a user can execute from a shell.

    2. **System calls.** System calls available from the Linux kernel. These are useful
    only to programmers.

    3. **Library calls.** Functions available in libraries. These are usually useful
    only to programmers.

    4. **Special files.** Pages for files found in /dev.

    5. **File formats.** The format of files such as /etc/fstab and other useful files.

    6. **Games and demonstrations.** Nuff said.

    7. **Other.** Things like the `man` man page.

    8. **System commands.** Commands only root can execute.

    9. **Kernel information.** A manual section that contains information about kernel
    code.


    Using `man` is simple. Just type `man` followed by the name of the command or
    file you want to help with.


    Options:


    +   - -f (**Output**). Equivalent to the `what` command.

    - -h (**Help**). Displays a brief help message.

    - 1-9 (**Manual section**). Specifically names the man page section to search
    Use if the same command appears in multiple sections.


    # Example 1: Displaying the man Page for cp


    To display `cp`s man page (see Figure A.6), simply type


    ```

    man cp

    ```


    The man pages are a bit cryptic—they''re not necessarily written for non-Linux
    or non-geek types. However, the man pages display and explain, sometimes tersely,
    the options and syntax for each command. They''re extremely helpful in a pinch.


