- img_proc: true
  md: '# Installation


    You can create a swap file in Linux and add it to your pool of memory. First,
    you must decide the amount of swap file space you need to add. For example, assume
    that you need an additional 64MB of space. You would then type this command to
    create the file:


    ```

    dd if=/dev/zero of=/swapfile bs=1024 count=65536

    ```


    Change the count size to the number of kilobytes you need. Then, you need to make
    that file active:


    ```

    mkswap /swapfile 65536

    sync /swapfile

    ```


    If you use the free command after using these commands, you should see 64MB of
    space added to your swap area. If you want to add that file again the next time
    you reboot your system, add the swap command to the file /etc/rc.rc.local.


    When you start the Linux installation, you are presented with a boot prompt that
    displays an introductory message. There, you can press the Enter key to continue
    or type various other commands such as text or expert. There are many more parameters
    that you can add. For example, if you know your hard disk parameters, you can
    type them at the prompt, or you can list the amount of memory you have. The following
    command specifies that your system has 128MB of RAM; that your hard disk has 64
    cylinders, 32 heads, and 202 sectors; and that you want to enable expert mode:


    ```

    boot: linux mem=128 hda=64,32,202 expert

    ```


    You can specify these options in the LILO boot prompt or you can add them to your
    lilo.conf file.


    # Dual Booting with Windows NT


    As you learned in Chapter 2, "Installing Red Hat Linux 7," dual booting Linux
    and Windows 95 or 98 is simple. You just install both operating systems in a separate
    partition or disk, and you install LILO in your Master Boot Record (MBR).


    Things get more complicated, however, if the other operating system is Microsoft
    Windows NT. Windows NT has a special loader called NTLDR, which must be placed
    in the MBR. This means that you cannot overwrite it with LILO, or Windows NT refuse
    to boot.


    To work around this limitation, install Windows NT first, so it can write its
    loader to the MBR. Then, when you install Linux, set the Linux partition as the
    active'
  merge: -1
  pgno: 332
- img_proc: true
  md: '(bootable) one. When it is time to install LILO, specify that you want it installed
    on the Linux partition, rather than on the MBR. That way, when the system boots,
    the Linux partition gets loaded before NTLDR, and LILO can ask you which system
    you want to boot. If you select Windows NT, it will then load NTLDR, allowing
    both systems to coexist without problems.


    # # LILO Won''t Load?


    In the old days, the BIOS was unable to recognize more than 1,024 cylinders in
    a disk. Now, however, many large hard disks (greater than 8.6GB) have more than
    1,024 cylinders—something that makes working with LILO a bit difficult. If LILO
    is placed after the first 1,024 cylinders, it probably won''t be able to Linux
    or any other system.


    To resolve this, place your root partition—the one with your kernel—at the beginning
    of the disk. The same for your C: drive if you have DOS or Microsoft Windows installed.
    At the end of the drive, you can create some data or swap partitions. This will
    ensure that LILO has no problem loading any OS on your machine.


    # # X Issues


    When the Linux installation is nearly complete, it launches a program called Xfiguration,
    which asks you about your video card and monitor in order to configure the XWindow
    System. X, also called XI, is the common environment in Linux and is used by nearly
    all Linux users; it is important, therefore, that the configuration succeeds.


    In most cases, Xfiguration detects your hardware and configures X with no problem.
    There may be a few instances, however, in which it fails. If this happens to you,
    install XF86Setup, which is included on your Linux CD-ROM (You may also install
    the XVGA16 package.) Run the XF86Setup command when the installation is finished
    to launch a graphical program that prompts you for information about your video
    and monitor hardware.


    Another X problem that occurs occasionally, especially on laptops, is that graphic
    acceleration causes the screen to display black spots and lines. X uses for many
    cards in an attempt to make your graphical experience better. If you determine
    that this is causing a problem, it can be disabled. To disable acceleration, you
    will need to edit the /etc/X11/XF86Config file manually. Adding the following
    line in the [monitor] section:


    ```

    option "noaccel"

    ```'
