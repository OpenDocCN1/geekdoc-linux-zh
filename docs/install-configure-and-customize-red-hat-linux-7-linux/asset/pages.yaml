  md: '# Checking for Hardware Compatibility


    Despite the fact that the Red Hat HCL is constantly evolving as many solutions
    to hardware-compatibility issues are discovered, the HCL is very well organized.
    Each section focuses on a particular type of hardware and includes a definition
    of the compatibility levels. There is also an important warning about hardware
    names that bears repeating here.


    In the hardware world, the branding of a given product occurs by keeping a popular
    name associated with what may be a completely different product. To provide you
    with a rather simplified example, a Pentium processor is very different from a
    Pentium II processor or a Pentium III. Even though the name Pentium is prevalent
    throughout, these are not the same products. Other brand name are much more subtle
    and the product differences far more drastic. The point here is that if the exact
    model name or number is not listed in the HCL, the safest assumption is that the
    hardware is incompatible.


    > Later in this chapter, some of the highlights of the Red Hat HCL are discussed.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_44_0.png)


    # Linux Hardware Database


    Unlike the Red Hat Web site, the Linux Hardware Database Web site (lhd.datapower.com)
    does not offer a comprehensive look at all the hardware that can work with Red
    Hat Linux. It does, however, offer something the HCL does not: use-written ratings
    of how hardware really worked with Linux and tips on how to get around some of
    the sticky issues that can crop up. As shown in Figure 1.9, the Linux Hardware
    Database Web site contains links to hardware organized by category types.


    Clicking on a category link reveals a tabular listing of all the tested hardware
    types for that category. The hardware is sorted by the rating the product has
    received (see Figure 1.10).


    Hardware in this database is compared on different versions of Linux and different
    flavors as well. Be sure to read the testing specifications for each product.
    Hardware-tested well


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_44_1.png)


    The rating system used in this site is based on the average of five categories:


    +   - Stability

    - Performance'
