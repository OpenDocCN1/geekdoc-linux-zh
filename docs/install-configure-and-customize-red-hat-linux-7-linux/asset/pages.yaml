  md: '# Starting Fresh


    If few patching attempts fail, it is possible that your kernel sources will not

    cleanly accept any patch or even compile. Part of the art of patching is knowing

    when to reinstall the kernel sources and start over, rather than fighting a losing

    battle with patch.


    # Removing Patches


    If you decide you longer want a patch that was previously installed, thus revert-

    to the standard kernel, try a command like this:


    ```

    $ bzip2 -dc /tmp/patch-2.14.tar.bz2 | patch -p0 -R

    ```


    The -R parameter stands for reverse, not remove, but the effect is the same: It
    causes

    the patch to reverse the unmodified and the modified sections of the patch

    file. The end result is that the patch is removed.


    # Configuring the Kernel


    Now that your kernel sources are installed and perhaps patched, you will want
    to

    configure them—selecting what components should be compiled into the core

    kernel, what should be compiled as loadable modules, and what should be omitted

    entirely. How you configure your kernel can affect both its speed and the hardware

    upports it.


    # Installing the Required Packages


    The remaining three steps—configuring, compiling, and installing the kernel—

    require a number of RPMs. Before continuing, you make sure the packages in

    Table 12.1 are installed.


    To check whether a package is installed, issue a command such as this:


    ```

    $ rpm -q make

    make-3.77-6

    ```


    If the package is installed, rpm responds with the specific version. In this example,

    it was make-3.77-6. If it had not been installed, rpm would have printed nothing.'
