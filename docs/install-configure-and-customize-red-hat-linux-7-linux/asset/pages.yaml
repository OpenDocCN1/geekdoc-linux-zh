  md: 'Until the majority of common devices are automatically recognized by the Linux
    kernel, you''ll need to first determine whether Linux will run on your computer.
    To do so, you will need to know where to locate the hardware information about
    your PC.


    # # Gathering Information About Your System


    How would you really know your PC? Really know it? Are you just acquaintances,
    or do you know it down to your very soul (or at least the jumper settings on your
    sound card)? To find out how well Linux will run on your PC, you need to know
    the workings of your machine fairly well.


    Don''t worry, you will not have to open your computer. In fact, I strongly recommend
    against this. Your Windows machine has a tool that enables you to see into the
    inner mechanics of your PC.


    # # Checking Your Device Manager in Windows


    As you begin examining your computer, notice that a lot of the information you
    need to know is right in front of you. Your monitor, for instance, is sitting
    on your table or desk with its brand name and model displayed on the front or
    back. The same is possibly true for your printer and any other external devices
    you might have. You''ll want to take note of both the brand name and model as
    they appear on the device.


    In addition to identifying external devices, you''ll need to determine what''s
    actually inside your computer. One place to start is by displaying a list of devices
    identified by your existing operating system. Windows 95, 98, and 2000 use a built-in
    applet to call the Device Manager to list known devices. In Windows NT, perhaps
    the best place to view installed devices is the Windows Diagnostics applet, located
    in the Administrative Tools menu.


    In Windows 95 and 98, open the Device Manager by clicking the Start button on
    the Windows taskbar and then choosing Settings, Control Panel. When the Control
    Panel appears, double-click the System icon to open the System Properties dialog
    box, shown in Figure 1.1.


    Click the Device Manager tab to list the inner workings of your computer, as shown
    in Figure 1.2.


    Now you need to do some old-fashioned detective footwork. Your computer may (or
    may not) actually use a device for each of the device types listed in the Device


