  md: '# Appendix D: Advanced Configuration Reference


    In this appendix, several topics are introduced. Each topic is on the advanced
    side, so don''t feel as if you have to tackle them at first. As you learn more
    and more about Linux, you can refer to this appendix to help solve some of the
    more sticky configuration issues you may run.


    # The File System Configuration File (/etc/fstab)


    An important configuration file for Linux systems, /etc/fstab, holds all of the
    information necessary to mount a device. There are six fields in this file:


    +   - fs_spec. Describes the device to be mounted.

    - fs_file. Describes the mount point for the file system. Swap partitions should
    have none or swap in this field.

    - fs_vftype. Describes one of the above listed file-system types.

    - fs_mntops. Describes the mount options, some of which are mentioned below.

    - fs_freq. Describes whether the file system needs to be dumped with the dump
    command. A 0 indicates that the file system should not be backed up; a 1 indicates
    that it should be included in backups.

    - fs_passno. Describes the order that file system checks are performed during
    boot. Swap partitions and devices with noauto in their fs_mntops should have 0,
    the partition mounted as root should have 1, and all other devices mounted at
    boot should 2.


    The fs_mntops field needs some explanation. Each file-system type has its own
    special options, as well as options that are common to all. The options used most
    in are


    +   - defaults. This option sets the default options. It is equivalent to rw,
    suid, dev, exec, auto, nouser, and async.

    - user. This option allows any user to mount and unmount the file system.

    - nouser. This option allows only the root superuser to mount the file system.

    - ro/rw. ro mounts the file system read-only. rw mounts the file system read-write.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_405_0.png)


    > If a device such as a CD-ROM drive that cannot be written to is mounted with
    the ro option, an error warning is displayed and the device is mounted read-only.'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# The File System Configuration File (/etc/stab) 37


    +   - noauto. This option disables the mount -a command for this file system.

    The file system must then be mounted explicitly.


    +   - auto. This option is the opposite of noauto.


    +   - exec. This option allows execution of binary files on this file system.
    This is the default.


    +   - noexec. This option is the opposite of exec.


    +   - suid. This allows the set-user-identification bits to take effect.


    +   - nosuid. This is the opposite of suid.


    +   - async. This option sets all I/O to the file system as asynchronous.


    In addition, one option is specific to the ext2 file system:


    +   - quota. This option enables user quota support. Quotas limit the amount of
    disk space available to a user. Group quotas are enabled by grquota.


    Other options are specific to the vfat file system:


    +   - uid. This option sets the owner of all the files in the file system to the
    user ID. Use userconf or linuxconf to match user IDs with user names.


    +   - gid. Like uid, this option sets the group associated with all the files
    in the file system to the group ID. Use userconf or linuxconf to match group IDs


    +   - umask. This option uses the octal numbering system by chmod to mark the
    privileges denied for all files and directories in a file system. For example,
    umask=002 sets rwx privileges for user and group and r-x privileges for others.


    So that you can better understand how an fstab file works, I copied mine so you
    can see what it looks like:


    ```

    /dev/hd1 /C:      vfat      defaults,uid=500,gid=100,umask=2 1 2

    /dev/hd2 /       ext2      defaults                   1 1

    /dev/hd3 swap    defaults                   0 0

    /dev/hd5 /usr      ext2      defaults                   1 2

    /dev/hd6 /home   ext2      defaults,rw,usquota      1 2

    /dev/hdb1 /D:      vfat      defaults,uid=500,gid=100,umask=2 1 2

    /dev/hdb5 /E:      vfat      defaults,uid=500,gid=100,umask=2 1 2

    /dev/hdcl /usr/local ext2      defaults                   1 2

    /dev/cdrom /mnt/cdrom iso9660  noauto,owner,ro          0 0

    /dev/fd0 /mnt/floppy ext2      noauto,owner              0 0

    /dev/fd0 /mnt/A:      vfat      noauto,owner,umask=0      0 0

    none      /proc     proc      defaults                   0 0

    none      /dev/pts devpts     *        gid=5,mode=622             0 0

    ```'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'Notice that I have mounted some vfat (Windows) partitions in my root directory.
    This is a matter of style. Some people refuse to add anything here, preferring
    to keep it as bare as possible. I prefer including these file systems so that
    less typing is required when I need to access them. For those file systems that
    I must mount before accessing, I do so in /mnt directory. This way, I am reminded
    to mount those file systems before accessing them.


    I keep most of my data on my vfat file systems because, not only was it originally
    created in a vfat partition, I continue to access it regularly from Windows. I
    will probably move the data over to the Linux file system in the future. An excellent
    freeware Windows program, called explore2fs, enables users to access ext2 file
    systems. It looks a little like Windows Explorer and is used to export and import
    ext2 to file systems. You can get it at http://uranus.swin.edu.au/-jn/linux/


    # Disk Geometry


    Most of you know that hard disks can be divided into several partitions. A better
    understanding of disk geometry will help you install your boot loader and mount
    your partitions. This section gets a bit technical, but understanding the realities
    of disk geometry can help you avoid mistakes—and when they happen, make correcting
    them easier.


    The first thing on your hard drive is the Master Boot Record (MBR); it contains
    some program code and a partition table up to four partitions. The partition table
    stores the location of your partitions on your hard drive. Your MBR normally jumps
    to the first partition in the partition table marked active.


    Following your MBR is one or more partitions. These partitions are either primary
    or extended. Primary partitions start with a partition boot sector; each file
    system treats its boot sector differently. DOS, for example, stores some disk
    geometry information as well as the bootstrap loader, which is in the operating
    system (IO.SYS and MSDOS.SYS). Linux file system types such as minix and ext2
    don''t use the boot sector at.


    The extended partition is a special type partition designed to overcome the four-partition
    limit imposed in the MBR. Inside the extended partition is a chain of logical
    partitions. However, these partitions do not appear in the MBR''s partition table.
    In this way, many more than four partitions can reside on a disk.


    The extended partition has a boot sector, but it isn''t used to boot an operating
    system. The partition boot sector looks like an MBR with a blank program code'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# Size Limits 37


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_408_0.png)


    **Figure 0.1** Disk-geometry map.


    area. The partition table contains a link to the first logical partition; it also
    points to another extended partition boot sector. This second extended partition
    points to a logical partition and a third extended partition boot sector.


    Like primary partitions, each logical partition has its own boot sector. The file
    system in each logical partition uses this boot sector depending upon its needs:
    Linux file systems ignore the boot sector; DOS reads this for disk parameters
    and the bootstrap loader. Figure D.1 shows this relationship.


    Note that the MBR sees only four of the partitions: three primary partitions and
    the first extended partition. Although only one extended partition is shown, you
    could make all the partitions extended. This can be difficult to implement, however,
    because most fdisk programs do not allow booting from a logical partition (you
    can use Linux''s fdisk utility if you want to boot from a logical partition).


    # Size Limits


    Older BIOSes impose disk size limits. There are several limit levels: 528MB, 2.1GB,
    3.27GB, 8.4GB, and 137GB. Presently, the most common problem is the 8.4GB limit,
    which is the amount of hard drive space an older BIOS can keep track of. Possible
    solutions include upgrading your BIOS, which requires a flashable ROM. Check your
    manual for your motherboard or the manufacturer''s Web site to determine whether
    your computer has this ability.'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# Appendix D: Advanced Configuration Reference


    If your BIOS is upgradeable, you can get the necessary program and the code for
    the upgrade from the Internet. Unfortunately, it often seems that most motherboard
    manufacturers do not support motherboards that are more than a year or so old.


    An alternative to upgrading your BIOS is to use a disk manager such as EZ-Disk
    or Ontrack''s Disk Manager. The disk manager goes in the MBR of the first drive
    and, depending upon the software version, on the disk that needs help. Ontrack
    puts code it it calls Dynamic Drive Overlay (DDO) on this drive just after the
    MBR. Ontrack offsets the entire disk by 63 sectors to allow space for DDO.


    Table D.1 displays your system''s disk geometry. I needed Ontrack''s Disk Manager
    to do the disk geometry translations for an old BIOS.


    # Table D.1 System Disk Geometry


    | Maxtor (6.4GB) | Quantum (12.8GB) | Seagate (1.2GB) |

    | --- | --- | --- |

    | MBR (DM) | MBR | MBR |

    | Boot sector | +DDO | Boot sector |

    | 1st partition | Boot sector | 1st Partition |

    | FAT32 | | FAT16 |

    | * Boot sector (LILO) | 1st partition | |

    | | FAT32 | |

    | 2nd partition ext2 | Extended partition boot sector | |

    | Boot sector | Logical partition boot sector | |

    | 3rd partition swap | 2nd partition | |

    | | FAT32 | |


    > * = active boot partition


    Linux currently has difficulty with disks larger than 33.8GB. There is a patch
    for this and it will probably be included in a future kernel. With this patch,
    Linux can see disks up to 2TB. Windows 95 OSR2 and later (Windows 98, 2000, and
    so on) can see disks up to 2TB as well.'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# Partition Types and Sizes


    This section will give you some helpful advice about what sizes you should make

    y Linux partitions. If you typically learn as you go, this information will be

    equally relevant to you—for when you need to reinstall over a trashed system.

    happens to everyone; call it a learning experience and count yourself a winner
    if

    y know what you did wrong. Thus we are Linux gurus made.


    Linux is different from many other operating systems in that it uses a special

    partition as swap space. Anyone familiar with Windows knows how swap files work.

    Multitasking systems have several programs running at one. Each program

    requires physical memory. When memory gets filled up, the computer puts some

    of the information on the hard drive. The space used for that information is called

    swap space because the computer swaps memory in and out of this

    area. Linux uses a special partition to speed up the process.


    In previous versions of Linux, swap space partitions were limited to 128MB partitions.
    This limit is eliminated in the current kernel. You may still want to put

    smaller partitions on different drives, however. The speed of the heads limits
    the

    transfer rate from disk; you can optimize the transfer speed from disks to memory

    by running disks in parallel.


    > If you are fortunate to have more than one drive available and one drive

    is faster than the other, place the swap space on the faster driver.


    You can create a new swap partition quite easily. To do so, use the command fdisk
    /dev/hda where /dev/hda is the disk you want to partition. Some people, however,

    prefer to use the user-friendly cfdisk.


    Once the partition is created, make sure it is type 82 (Linux swap). Next, to
    format

    t swap partition, use the command mkswap -c /dev/hda3, changing /dev/hda3 to

    your swap partition.


    Next edit /etc/fstab to include the following line:


    ```

    /dev/hda3       swap        swap        defaults        0 0

    ```


    The new partition is ready for use. The next time Linux starts, a swap command
    in

    y boot script will start it. For now, you can start it using the following command:


    ```

    swapon /dev/hda3

    ```


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_410_0.png)'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# Appendix D: Advanced Configuration Reference


    With the memory requirements of X Windows and desktop environments such as GNOME,
    a swap space of 300MB is appropriate. If you don''t plan to run X, you can get
    by with swap partitions of 100MB or less.


    Many people install the rest of Linux on a single partition. This way you don''t
    need to guess the future requirements of the directory tree''s branches. This
    is usually the best choice for novices. If you plan to create another partition,
    it will likely be a /boot partition. /boot partitions are sometimes required to
    fit all of the boot files needed by LILO under BIOS''S 1024-cylinder limit. /boot
    partitions need only 10MB in size.


    If you want to split the system up even more, Table D.2 displays my recommended
    partitions and sizes, in order of preference. If you mount a partition as a subdirectory,
    you should reduce the size of the parent.


    # Table D.2 Recommended Partitions


    | Partition | Mount Point | Memory Allotment |

    | --- | --- | --- |

    | Workstation | | |

    | Boot partition | /boot | 16MB |

    | Swap partition | None | 64MB |

    | Root partition | / | The remainder of any unpartitioned space on the disk |

    | Server | | |

    | Boot partition | /boot | 16MB |

    | Swap partition | None | 64MB |

    | Root partition | / | 256MB |

    | Var partition | /var | 256MB |

    | Usr partition | /usr | Half of remaining unpartitioned space on the disk |

    | Home partition | /home | Half of remaining unpartitioned space on the disk |


    Some of these size recommendations numbers are very tentative. Your /home partition
    will have different needs depending on whether one user is on the machine or there
    are a hundred users. Determining where you keep your data files also determines
    your needs. Don''t try to use straight subtraction on the above table. For example,
    even with all the listed subdirectories, your root directory will still need to
    be about 80MB.'
  merge: -1
  pgno: 411
- img_proc: true
  md: '# Size Limits


    If it takes much guesswork to divide up the file system, why does anyone do it?
    The answer is that there are no archive bits. DOS users are familiar with archive
    bits; under DOS, when a file is backed up, its archive bit is cleared. Incremental
    backups Linux''s ext2 file system do not have archive bits. If a person wants
    to back up the most recent files, a more complex solution is needed. The easiest
    way is to back up the entire file system on a partition.


    Even when backup data files are generated to allow incremental backups, you probably
    won''t want all modified files backed up. Files in /var and /tmp are often changed,
    but you probably wouldn''t want them backed up every time. Putting them in their
    partitions separates these files from the rest of the system. It is also helpful
    to divide the system so that an incremental backup can fit on one backup tape.
    The backup can be done overnight without requiring you to switch tapes.


    Partitioning the system branches also makes sense for the aggressive Linux user.
    If you crash the system or want to do a clean install of a newer version, you
    can wipe the /usr partition but leave the /usr/local partition alone. This partition
    usually contains installed programs that would take a great deal of time to reinstall.
    Separate partitions make that second install much easier.


    If you want to go ahead with mounting a new file system, you first need to create
    a new partition. Use fdisk to create a partition like you did for the swap partition.
    However, make this partition type 83.


    Install the new file system using the command mkfs /dev/hda3, changing /dev/hda3
    to your new partition. Edit your /etc/fstab file. Include a line like the following:


    ```

    /dev/hda3 /var ext2 defaults 1 2

    ```


    Change /dev/hda3 to reflect your new partition and /var to your mount point. You
    still need to copy your existing files in /var to the new name. Rename /var to
    a temporary name, using the command mv /var /var.old. Create a new /var directory
    with the command mkdir /var.


    Next, mount the new partition using mount /var. Finally, copy the contents from
    the temporary directory to the new file system using the command cp -a /var.tmp
    /var.


    Remember, while using the commands listed here, to change /var to reflect the
    name of your new mount point.


    At this point, everything should be up and running okay. Keep the /var.tmp directory
    for a few days in case there is a problem. If nothing is wrong, delete this directory
    using the command rm -rf /var.tmp.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_412_0.png)'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# Appendix D: Advanced Configuration Reference


    # LILO


    LILO, the Linux Loader, has two main parts. The first part is called the map installer.
    It is the /sbin/lilo program run by the user from Linux. The second part of LILO
    is the boot loader, which doesn''t have a name since it is only called by the
    system during the boot process.


    # The Map Installer


    The easiest way to understand the map installer is to look at the configuration
    file, /etc/lilo.conf. Here is a simple example:


    ```

    boot=/dev/hda2

    map=/boot/map

    install=/boot/boot.b

    message=/boot/lilo.msg

    prompt

    timeout=50

    single-key

    image=/boot/vmlinuz

    label=''Linux''

    alias=1

    root=/dev/hda2

    other=/dev/hda1

    label=''Win98''

    alias=w

    ```


    Think of the configuration file as being in two parts. Those lines image modify
    the map loader; those lines starting at image configure your boot images.


    # Modifying the Map Loader


    The next few paragraphs describe each line of the part of the /etc/lilo.conf file
    that modifies the map loader.


    ```

    boot=/dev/hda2

    ```


    The boot=/dev/hda2 line describes where the boot loader should be installed. In
    order of preference, the boot loader can go in a Linux partition (not a swap partition),
    an extended partition (not a logical partition), or in the MBR on the first drive.
    (It needs to be in the first drive MBR because that is where the BIOS'
  merge: -1
  pgno: 413
- img_proc: true
  md: 'goes during the boot process.)The above example has the boot loader in my Linux
    partition—the second partition on my first drive.


    If the boot loader will reside on a partition, that partition must be on one of
    the first two drives. Almost all BIOS allow booting from only the first controller—that
    is, one of the first two disks.


    If you want to run three operating systems (such as Windows 98, Windows NT, and
    Linux) on three disks, put Linux on the third disk. A small /boot partition on
    one of the first two disks will enable Linux to be booted.


    # map=/boot/map


    The map file is the run-time configuration file for the boot installer. It contains
    all of the information from /etc/lilo.conf to tailor boot.b for your system, which
    is the file created by running the map installer, bilo


    # install=/boot/boot.b


    install=/boot/boot.b is the boot installer program code. It is called by the jump
    instruction residing in the MBR or partition.


    # message=/boot/lilo.msg


    You can specify a message file to be displayed by the boot loader. It can be called
    anything. I find a short line listing my boot options to be convenient. For example,
    my message file includes a short description of my boot image alternatives:


    (w) Windows 98 or (l) Linux


    If you don''t want to this option but still want to see the choices offered at
    boot time, press Tab at the boot prompt.


    # prompt


    If you want the boot loader to pause and present you with a boot prompt, use the
    prompt line. LILO will wait until you choose one of the boot images to load. An
    alternative is to hold down the Ctrl key while the LILO characters are displayed.


    # timeout=50


    If you don''t want the boot loader to stall while waiting for your input at the
    boot prompt, include a timeout line. It sets the maximum time (in tenths of a
    second) LILO will wait without any input at the boot prompt. Entering any character
    stops the timeout counter.'
