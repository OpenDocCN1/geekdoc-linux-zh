  md: '# Partitioning Strategies with Disk Druid


    The place where you will actually apply your partition strategy is Disk Druid.
    Disk Druid is either first seen in the Installation program (if you have any existing
    par-titions on your PC) or during the Custom installation path.


    > Disk Druid is also a partitioning utility, but it is not recommended that you
    create a disk partition from scratch with it. Such partitions may become unreadable
    to other operating systems on your PC. You will have better results using a third-party
    utility as suggested earlier in this chapter and then using Disk Druid to change
    partition types and set partition mount points. This process will be de-scribed
    in Chapter 2, "Installing Red Hat Linux 7."


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_67_0.png)


    The most crucial part of your partition strategy is where you decide to put your
    /boot partition. If you recall, many BIOSes have limitations to where they can
    refer to find the Linux Loader (LILO) that resides in the /boot partition. If
    you put your /boot partition somewhere your BIOS can''t access, you will not be
    able to start Red Linux.


    # Positioning the /boot Partition on Large Drives


    Hard drives are physically divided into cylinders. Because of BIOS limitations,
    it is vital that the /boot partition sits completely below cylinder 1,023, without
    any portion of the partition overlapping cylinder 1,023. Keep the whole partition
    under this cylinder to avoid massive headaches, whether you are using single-
    or multiple-drive strategies.


    # Multiple Drives


    You may remember when you checked the BIOS for information, you re-corded how
    many physical drives you had and what kind they were. Here''s where information
    comes into play.


    The BIOS on many PCs has trouble booting to certain types of drives. Therefore
    it is imperative that you place the /boot partition on the correct hard drive.
    Table 1.12 illustrates different hard drive scenarios and recommends /boot partition
    locations.'
  merge: -1
  pgno: 67
