  md: '# The Kernel Boot Process


    You should print the boot messages and read them all at least once. This will
    help you know your hardware a bit more and can help you diagnose problems. If
    you can''t print messages while your system is booting, you can always review
    them by typing the `dmesg` command at your Linux console. If you have a printer
    attached, you can print the messages using the command `dmesg |lpr`.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_288_0.png)


    When the kernel has finished setting up the new hardware, it passes control to
    device drivers, with small portions of code that can set up and control a particular
    device. For example, to handle a SoundBlaster card, you need a SoundBlaster-compatible
    sound driver. There are also less specific drivers that deal with things such
    as networking and your serial devices. All of these drivers are loaded at start
    time.


    # What Is Auto-Detection?


    The device drivers configure your hardware to work with Linux. These drivers,
    however, must first find the hardware. Fortunately, Linux has a very good auto-detection
    process, in which drivers look in the likely places to see if a device can be
    found. For example, the NE2000 networking card driver knows that such a card will
    most likely be located at I/O address 0x300, 0x280, 0x320, 0x340, 0x360; it probes
    these addresses to see if a card can be found. If found, a message appears on
    the screen when your system starts.


    If your card is at another address, the driver may not find it and you must tell
    the driver where to look. These settings can be found using various methods. If
    you have older hardware, settings can be altered using jumpers on the board itself.
    The default settings can usually be found in the board''s manual, including the
    method used to change them.


    Red Hat Linux 7 features a utility called Kudzu, which attempts to detect new
    hardware on startup. Kudzu is an advanced form of device auto-detection. It keeps
    a database of installed hardware and, when the system starts, compares the installed
    hardware with the database. If new hardware is detected, Kudzu should allow you
    to configure it. This utility does not make your job much easier if your device
    isn''t detected by the Linux kernel, but I believe that Red Hat will be moving
    in that direction in the future. You can review the database by looking at the
    file /etc/sysconfig/hwconf.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# # Configuring Your Devices


    The main devices in a system have device drivers already compiled in the kernel
    and will be detected on system startup. These include your CPU, memory, monitor,
    video card, floppy drive, IDE hard disks, and most CD-ROM drives—which means most
    of the time you needn''t have to worry about them. This section focuses on those
    devices that may not be easily detected.


    If a device is not detected at startup time, you first must determine whether
    the driver for that component was loaded. A driver can be loaded in two ways:
    by being compiled into the kernel itself or being loaded as a module, which is
    a separate piece of code that works with the kernel to run your device. Although
    this may seem complex, Red Hat has made it very simple, providing several graphical
    utilities that enable you to easily configure new devices. Because most drivers
    have been compiled into modules, you will seldom need to recompile your kernel.


    To determine whether a device has been detected, you can use the command /proc/devices;
    this command lists all devices detected by your Linux system that access an IRQ.


    # ## Red Hat Utilities


    Various Red Hat utilities can help you configure the most common hardware devices
    and protocols. Many of these utilities, including kernelifg, timetool, printtool,
    and netcfg, must be run in the graphical mode. To see a list of utilities available
    on your Red Hat system, setup for console-based utilities and control-panel for
    graphical ones.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_289_0.png)


    You must be logged in as root on your Red Hat Linux 7 machine to use Red Hat''s
    various configuration utilities.


    # ## Configuring Your Sound Card with sndconfig


    As you read in Chapter 7, "Configuring Printers, Sound, and Other Devices," you
    can configure a sound card by typing sndconfig at your Linux prompt. Doing so
    opens a sound configuration utility, called sndconfig, that can detect and configure
    many sound cards. It probes your system to find a Plug and Play card and reports
    what was detected. It tests the sound card. If the test is successful, the utility
    saves the information and closes. If not, it tells you what went and allows you
    to manually select a card. If this doesn''t work, you may be'
  merge: -1
  pgno: 289
