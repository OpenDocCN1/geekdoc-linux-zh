    The following steps are used to manually create a workstation partition set on
    your PC. I recommend that you add the partitions in the following order: boot,
    swap, and root (/). Since the root partition will be set to fill all the remaining
    space on the hard drive, you''ll first want to specify what part the other partitions
    will require.


    # Partitioning with Disk Druid


    If all existing partitions were removed by DOS fdisk prior to the installation
    process, use the Disk Druid screen to create partitions for a workstation PC.
    First, create the /boot partition using these steps:


    +   1. Click the Add button in the Partitions section. The Add dialog box will
    appear.

    2. In the Mount point field, type /boot.

    3. In the Size (Megs) field, type 16 (16MB is the recommended size for the boot
    partition on an Intel-compatible PC).

    4. Confirm that the Partition Type is Linux native.

    5. Select the hard drive where you want to place the boot partition (refer to
    Table 1.12 in Chapter 1 to make sure the selected drive is acceptable).

    6. Click OK. The Add dialog box will close.


    Now, create the swap partition:


    +   1. Click the Add button again so that you can create the swap partition. The
    Add dialog box will appear.

    2. Leave the Mount point field blank.

    3. In the Size (Megs) field, type 94.


    > The value of the swap disk should be at least the number of MB of RAM memory
    you have on your PC. In this example, 94MB of RAM suggests a 94MB swap disk size.


    +   1. Click the Partition Type list control and select Linux swap.

    2. Select the hard drive where you want to place the swap partition.

    6. Click OK. The Add dialog box will close.'
