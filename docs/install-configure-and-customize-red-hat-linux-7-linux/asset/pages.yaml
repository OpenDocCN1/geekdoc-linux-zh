- img_proc: true
  md: 'For completeness, you might want to set the text for the tip that appears when
    a mouse pointer rests on the icon for a few seconds. For example, the trash can''s
    tip reads “Removed removed files.” In similar fashion, you might want the Jaz
    icon''s tip to read “IDE Jaz drive” or something similar. Unfortunately, the kfm
    dialog box does not provide a way to edit these tips, but it''s easy to do by
    hand.

    The drives exist in ~/Desktop/ as files ending with the extension .kdelink Open
    ~/Desktop/Jaz.kdelink in your favorite editor. To create a tip, you need to define
    a comment line. Note that you can specify multiple translations, as is done with
    the Name keyword, by appending the language abbreviation in square brackets. KDE
    decides which translation to use based on the current language in the KDE Control
    Center.\Unless you know how to translate “IDE Jaz drive” into other languages
    (more than a dozen languages are possible), you can simply omit the translations.
    The final Jaz.kdelink file is shown here:


    ```

    $ KDE Config File

    [KDE Desktop Entry]

    UnmountIcon=3floppy_unmount.xpm

    Name=Jaz

    Comment=IDE Jaz drive

    MountPoint=

    Icon=3floppy_mount.xpm

    Dev=/dev/jaz

    ReadOnly=0

    SType=Default

    Type=PSDevice

    ```


    Because this file appears within your home directory, the new icon will only appear
    for you. If you want all user accounts that are created in the future to also
    have this icon, copy it into the directory /etc/skel/Desktop/.


    # Mounting Drives in GNOME


    The GNOME desktop also provides for mounting and unmounting drives using buttons
    on GNOME’s panel. GNOME’s method is simpler than KDE’s, although the same troubleshooting
    tips apply to GNOME.'
