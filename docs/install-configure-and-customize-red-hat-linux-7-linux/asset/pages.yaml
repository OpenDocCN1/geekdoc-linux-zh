  md: '# Chapter 3: Configuring the X Window System


    can change the button orientation for your mouse as well as the mouse''s responsiveness
    to motion, but very handy features.


    When you''re finished experimenting with the settings, click OK to close the window.


    # Properly Logging Out of X


    Windows and Mac users are accustomed to the fact that they simply can''t just
    turn off their PCs. Instead, they must shut down first. Because most people are
    comfortable with this action, the steps necessary to leave X would feel familiar.
    Like sister operating systems, X likes an orderly departure, not an abrupt power
    outage.


    To leave X, you must log out and close your account. In GNOME, click the Main
    Menu icon and select Log Out. A message box will ask whether you want to log out,
    halt, or reboot.


    If you want to log out leaving the computer for the next user, click the Logout
    option and then click Yes. The X session closes and the screen returns to the
    graphical login screen if the Workstation installation was the option you selected.
    If you installed Red Hat as a server, you are returned to the command-line interface.


    If you want to reboot the system, click Reboot, then Yes. X closes, and the Linux
    system halts your PC and reboots itself, returning to the graphical login screen.


    Finally, if you just want to turn the computer off and go watch TV, click the
    Halt option before clicking Yes. X Window closes, and Linux closes all running
    processes as part of its halt sequence.


    If you change your mind, simply click No to resume your X Window session.


    # Conclusion


    In this chapter, you learned about the components that make up the X environment
    and found out which components handle specific aspects of your PC. The procedures
    to configure video and input devices at the X server level were also reviewed.


    In Chapter 4, "Configuring Your Environment," you will explore X even further
    at the window-manager and desktop-environment levels. You will also start to learn
    the ways you can make configuration settings at those levels.'
