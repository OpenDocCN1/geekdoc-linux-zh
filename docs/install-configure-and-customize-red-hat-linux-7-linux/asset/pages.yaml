    The HCL has a good list of the printer filters contained within this version of
    Red Hat. These filters are directly analogous to the Windows printer drivers.
    Check the list to see if your printer is there, but don''t worry if it isn''t.
    There will be ways of getting the printer installed even if it is not on the compatibility
    list.


    # Mouse


    The second thing Linux configures during its installation is the mouse. There
    are four types of mice: PS/2, serial, bus, and USB. The most common types are
    the PS/2 and serial mice, which are Tier 1 compatible. Bus mice fall into the
    Tier 2 category, and USB mice are classified as Tier 3.


    Since your mouse will very likely fall into either a Tier 1 or Tier 2 category,
    this device doesn''t require much concern. If you have a USB mouse, however, you
    should be aware that Linux is still in the experimental stages where USB is concerned.
