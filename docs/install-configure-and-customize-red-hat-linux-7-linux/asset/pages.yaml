    # Understanding the KDE Environment


    KDE, like most Linux applications, is maintained with an open-source philosophy
    in mind. All development is done on a volunteer effort by developers around the
    world, with the source code being freely distributed to all who want it. The actual
    version of KDE installed with Red Hat Linux 7 is KDE 1.2.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_127_1.png)


    If you really want to explore the cutting edge, Red Hat has included the pre-release
    software for the long-awaited KDE2 in this release. Look for the installation
    packages in the previews directory on Red Hat CDM-ROM.


    At first glance, KDE looks a lot like GNOME. This is because the K window manager''s
    color defaults are similar to the defaults of GNOME''s Sawfish manager. (The K
    window manager runs beneath KDE.) These defaults are set by Red Hat to maintain
    a consistent look for the operating system as a whole.


