    # Buying a CD-ROM Drive


    # Accommodating Limited Memory


    If your system has only 4 or 8MB of RAM, the installation program may not be able
    to start. Depending on your system, there may be a way around this.


    If you go to the BIOS setup, it typically offers a few settings for changing memory
    organization. For example, I have an old 386 laptop with 4MB of RAM that is divided
    in the BIOS into extended (XMS) and expanded (EMS) memory. If I enter the BIOS
    setup, I can change these settings to put all memory into XMS mode, making it
    accessible to the Linux installation. Be careful when you change BIOS settings,
    however; be sure to read your manual before attempting any change.


    # Swap Files and You


    Staying with memory problems, many people wonder how large a swap file they should
    enable in their Linux installation. A good rule of thumb is that the size of the
    swap file should be twice the size of your system''s physical memory (RAM), unless
    you have 128MB or more. For example, if your system has 32MB of RAM, you should
    allocate 64MB for the swap partition. If you don''t allocate enough swap space,
    you may see the Linux kernel starting programs when they try to use too much memory.
    This is done to free up memory for critical uses and is a very big indicator that
    you need more swap space.


    In some other operating systems, such as Microsoft Windows, you can select the
    size of your swap file. For example, in Windows 98, you can go to your Control
    Panel, System, Performance and set the size of the swap file space (referred to
    as Virtual Memory). In Linux, swap file space is kept in a separate partition,
    which means you must decide on the size of the swap file you before the installation
    begins. There is a way, however, to add more swap file space later without the
    necessity of reinstalling the system or adding a new hard disk.'
