  md: '# Adding New Devices


    In this section, you will see the different types of devices that can be added
    to a personal computer and how they differ from each other. Table 11.1 lists a
    few common hardware devices and their specifications, which may help you to configure.


    | Device | Internal/External | Type of Plug | Auto-Detected? |

    |---|---|---|---|

    | Modems | External | COM port (/dev/cua0) | No, easy to set up |

    | Modems | Internal | ISA or PCI | No, configuration needed |

    | Monitors | External | VGA port | Yes |

    | Video cards | Internal | PCI or AGP | In text mode: yes; in GUI mode: no |

    | RAM | Internal | Sockets | Yes |

    | Sound cards | Internal | ISA or PCI | No, configuration needed |

    | Mice | External | COM port (/dev/cua0) | Yes, for standard models |


    # Adding External Devices


    External devices are the easiest to add because you simply plug them in. Further,
    because no vital system part is outside the case, you don''t risk corrupting your
    machine. You can install an external device even if you are still new to computers.
    For example, to add a printer, you simply connect the printer cable to both the
    printer and the back of the computer and then plug it in the power supply.


    There are many types of external devices. Specific devices exist for each of the
    ports on the back of your system, and, because they all have different socket
    sizes, really can''t connect the wrong device to the wrong port. For example,
    a standard parallel port is a female connection with 25 holes, and a mouse or
    modem serial port is a male connection containing either 9 or 25 pins. You already
    know how to connect a printer to your machine; connecting any external device
    (keyboard, board, monitor, Zip drive, Ethernet-based cable modem) is just as easy.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Chapter 11: Adding New Hardware


    For instance, if you want to add an Ethernet device to your system, it is generally
    recommended that you turn off the power before adding any new device. Most manuals
    also warn you of this fact. This will allow three things:


    +   - The system BIOS will attempt to detect the new device when you reboot.

    - The kernel auto-detection process will detect the device (this is discussed
    in the section "What is Auto-Detection?").

    - The device will benefit from a fresh system start.


    Some devices will not work right if they are plugged in while the power is on,
    especially external removable drives. Note that this does not apply to hot-swappable
    devices, such as special RAID arrays or rack-mounted servers, but most personal
    desktop systems do not use these device types.


    # Adding Internal Devices


    Internal devices are more difficult to install only because they require you to
    work inside your computer case. Frankly, very few devices need to be added in
    this way. With the advent of external removable devices such as the Iomega Zip
    drive and the universal serial bus (USB), it isn''t necessary to crack open the
    computer nearly as often.


    The most common internal devices are sound cards, network cards, and hard drives.
    In most systems, you can add memory, change the motherboard, or even upgrade the
    CPU, although I would advise you against doing so unless you know exactly what
    you are doing. There are factors to consider when changing a CPU and memory such
    as bus speed, clock multiplier, and memory timing. For a fee, local stores will
    gladly install any internal device you require. This section briefly shows you
    how to add the three most common hardware devices.


    First, for your physical safety, you must turn off your computer''s power. This
    is especially important when you are working with internal devices because you
    can literally blow up your motherboard or CPU if you try to install internal hardware
    with the power.


    After you have turned off the power and unscrewed the screws to remove the case,
    you can add the device in an empty slot. If you want to add a device that has
    a standard card, you simply have to insert it to the other cards in your system.
    Any slot on the PCI bus (the white ones) will work for a PCI card; any slot on
    the ISA bus (the black ones) will work for ISA cards. Video cards may go in the
    recently introduced AG slot (the gray one). It''s easy to determine the three
    types of slots each has a different size and color. You can''t plug an ISA card
    into a PCI bus slot by any.'
  merge: -1
