  md: '# Table 1.12 Recommended /boot Partition Locations


    | Partition | Solution |

    | Multiple IDE drives | /boot should be mounted on one of the first two hard drives
    connected to your primary IDE controller. |

    | IDE and SCSI drives | /boot should be mounted on the first IDE drive or the
    ID 0 SCSI drive. |

    | Multiple SCSI drives | /boot should be mounted on the ID 0 or ID 1 SCSI drives.
    |


