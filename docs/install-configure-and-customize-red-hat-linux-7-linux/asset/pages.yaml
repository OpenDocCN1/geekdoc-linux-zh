- img_proc: true
  md: 'Unless fdisk warns you, you do not have to reboot after partitioning. Before
    the partition can be used, however, it must be formatted. Since the device is
    /dev/hdd, the partition created was number 1, and the partition type is ext2,
    use the following command to format:


    ```

    $ mkfs -t ext2 /dev/hdd1

    ```


    Had the partition type been set to FAT16, the format command would have looked
    like this:


    ```

    $ mkfs -t msdos /dev/hdd1

    ```


    > All FAT partitions (FAT12, FAT16, and FAT32) are formatted as type msdos.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_247_0.png)


    # Mounting the New Partition


    You now have collected the information you need (the device name and partition
    number), and the partition is formatted. (If you are installing an unpartitioned
    disk, you would not have a partition number. For example, you would use /dev/hdd
    instead of /dev/hdd1. Everything else is the same. Also, recall that floppies
    are not partitioned even they are named with numbers, such as /dev/fd0). It is
    now possible to issue a mount command, specifying the partition, mount point,
    and mount options you want. First create the mount point, and mount the new disk:


    ```

    $ mkdir /mnt/jaz

    $ mount -t ext2 /dev/hdd1 /mnt/jaz

    ```


    # Improving the Mount Command


    Typing a long mount command each time it was necessary to mount a Jaz disk would
    certainly be annoying—thankfully it is not necessary. By placing these values
    as defaults in /etc/fstab, the mount command can be shortened. To do so, edit
    /etc/fstab and add the following line anywhere in the file:


    ```

    /dev/hdd1 /mnt/jaz ext2 defaults 0 0

    ```


    > You can edit the file with a text editor while logged in as root, but if you
    prefer, you can use the more extravagant linuxconf to enter the values.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_247_1.png)


    In the last example, the first column specifies the partition to mount. The second
    column is the mount point and the third column lists the file system with which'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'the disk is formatted. The last three columns are optional settings describing
    how to mount the partition. The disk does not need to be mounted in any special
    way, so specify default for the options. For removable devices, the last two columns
    can usually be set to zero.


    After saving this change to the file, the disk can be mounted with a much simpler
    command. You only need to specify the device to mount; all other options are filled
    in from the file system table. First un the disk so that you can start fresh,
    and then remount it using a terse command:


    ```

    $ unmount /dev/hdd1

    $ mount /dev/hdd1

    ```


    A difficulty occurs if you also share disks with users of Microsoft Windows. Your
    own disks might be formatted as ext2, but those you share will be formatted as
    FAT or even NTFS file systems. If you are logged in as root, you can cope with
    other file systems by overriding the settings in /etc/fstab as needed. (This is
    not allowed when you are logged in as a normal user.) Use this command as root
    to mount a disk formatted as FAT:


    ```

    $ mount -t vfat /dev/hdd1 /mnt/jaz

    ```


    > The file-system type mdos truncates the base name to eight characters and the
    extension to three, just as DOS does. The vfat file system behaves just like Windows,
    allowing long file names. Normally you will want to use vfat.


    An easier method to use when mounting various file-system types is to have Linux
    pick the correct file system type automatically. To accomplish this, specify the
    file type as auto in /etc/fstab.

    Another difficulty with the current settings occurs when you attempt to mount
    the Jaz disk while not logged in as root. Typically, you do not do most of your
    work while logged in as root, so why would you have to mount a removable disk?

    The user option enables any user to mount the disk; only the user who mounted
    it can then unmount it. This would be particularly useful on a computer with multiple
    simultaneous users. Once one mounts a disk, no other user can interact and unmount
    it. A more relaxed setting uses users, which is more suitable for a shared home
    computer. All users may mount and unmount the disk, without restriction. For example,
    if one user mounted a Jaz disk, used it, and then left without remembering to
    unmount it, the next person who used the computer would be allowed to unmount
    it.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_248_0.png)'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Chapter 9: Customizing Your Desktop''s Usability


    All drives listed in /etc/fstab will be mounted when Red Hat boots unless the
    noauto option is specified. Automatic mounting usually doesn''t make sense for
    removable media, so include this option for your Jaz drive.


    Finally, you might want to consider whether you will always remember that /dev/hdd1
    is your Jaz drive. If not, you can give it a better name. Perhaps /dev/jaz is
    more memorable. Use this command to create a link from jaz to the real device:


    ```

    $ ln -s /dev/hdd1 /dev/jaz

    ```


    Taking all of these customizations into account, the line in /etc/fstab should
    now read:


    +   - /dev/jaz /mnt/jaz auto noauto,user 0 0


    Now your Jaz drive can be mounted and unmounted by any user with the simple command
    mount /dev/jaz. This is a good start, but wouldn''t it be even better if it were
    mounted via your mouse in X?


    # Mount Drives in KDE


    Initially, your KDE desktop should have included several icons to mount, unmount,
    and browse drives. These are convenient, especially for beginning Linux users
    or users who prefer the GUI over the command line. Icons for the CD-ROM and floppy
    drives are on your desktop by default, but if you add a new removable drive, it
    would also be nice to have an icon for drive.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_249_0.png)


    # Creating Drive Icons in KDE


    You can create icons to mount, unmount, browse drives in KDE by following these
    steps:


    +   1. If you have the Jaz drive mounted, unmount it and then start KDE as a normal
    user. To create an icon for your Jaz drive (or any other drive or partition),
    right-click your desktop and select New, File System Device. The mootwm dialog
    box will appear.

    2. Type in a name for the new device, such as jaz.kdelnk.

    3. Click OK. The krootwm dialog box will close, and the kfm dialog box will open.
    You now have a generic device icon on your desktop, but it is useless until you
    configure in kfm.

    4. The kfm device has three tabs: General, Permissions, and Device, as shown in
    Figure 9.3. On the General page, the name you entered in the krootwm dialog box
    will appear.

    5. The settings on the Permissions page affect the Jaz.kdelnk itself, not /dev/jaz.
    You can leave these as they are.'
