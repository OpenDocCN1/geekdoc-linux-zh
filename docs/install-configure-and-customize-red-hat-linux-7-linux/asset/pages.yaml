- img_proc: true
  md: '# File System Structure: A Tour


    +   - /bin. This directory holds many of the basic Linux programs. After familiarizing
    yourself with the programs in this chapter, browse through this directory to improve
    your knowledge of Linux. Type the program followed by --help for a summary of
    the command options. Use the man command to see the manual on that command. If
    there is no manual page, try the info command.


    +   - /sbin. This directory contains system programs.


    +   - /lib. This directory contains shared libraries and modules.


    +   - /dev. This directory contains references to the devices for your computer.
    You will refer to these devices, but rarely enter into this directory.


    +   - /home. Each user will be given a directory.


    +   - /root. This is the root''s home directory. Note that /root isn''t the root
    directory (/) and /home is never anyone''s home directory. For example, /home/guest
    for user guest.


    +   - /proc. This is a special directory; it doesn''t exist. It takes up no space
    on your hard drive. It is, however, a convenient way to examine aspects of your
    operating system. You can find out interesting things about your system by examining
    files in this directory. Examine cpuinfo, mounts, meminfo, and swap. There is
    also a large file named kcore; this is a mirror of your kernel memory. The important
    thing to remember is that these files don''t really exist, don''t try to delete
    them.


    +   - /var. This directory holds variables. If you try to delete files in this
    directory, you will probably change how some applications work. Other applications
    will then need to rebuild the lost variable files before running.


    +   - /tmp. This directory is used to hold temporary files, such as auto-saved
    versions of a document. You can delete any large, old files here to free up space.'
