  md: '# Chapter 1: Before You Install Hat Linux 7


    This is the part of the book where you get a crash course in disk partitions and
    why you can''t write data to a disk without them, so hang on to your collective
    hats.


    # Why Partition?


    Imagine the bee, buzzing around your garden. If you were to follow this bee back
    to its home, you would find a seemingly chaotic mass of buzzing insects, each
    looking as if it merely wanders about with nothing better to do than hang out
    and buzz. As we all know, however, bees have a specific purpose, working together
    for the collective benefit of the hive. One group of bees has the job of taking
    care of all the cute little babies after the queen lays her eggs. Now back to
    your science classes: Where are the baby bees? If you see the honeycomb, you''re
    right. If you''re wondering what heck this has to do with partitions, hang on.


    The honeycomb is an ingenious device composed of hexagonal cells made of wax,
    where honey and larvae are stored for safekeeping. Now ponder this: How would
    the bees by if they did not have honeycombs? The answer is they wouldn''t.


    Keeping the honeycombs in mind, consider how data is stored on a disk drive. Data,
    you see, cannot be stored on a drive without some structure already in place for
    the data to be organized. When data is placed on a drive, it is written into this
    structure, called *file system* in the Linux community. A file system is the format
    in which data is stored—a honeycomb of cells if you will will, where each little
    piece of data gets placed.


    Computers being computers, it''s a little more complicated than that. Data for
    a single file, for example, does not get stored in data blocks that sit right
    next to each other. The data may be stored in data blocks 456, 457, and 458, and
    then block 6,134, and so on. (This is an oversimplification, but you get the idea.)
    It''s the job of the file system to track where every part of a file resides.
    When you send a command to work with a file, the file system knows all of the
    separate blocks where the file is stored.


    Because of all this file tracking and retrieving, computer engineers came up with
    the idea of keeping the file systems small, even on large hard drives. In this
    way, the idea of partitions comes into play. Basically, the *partition* is a virtual
    barrier that tells the file system: "You used to be able to write to blocks 1–25,000
    all over the disk, but now you''re only allowed to write to blocks 1,500–25,000,
    so hands off!"


    Thus, we have partitions, and each partition can use a different file system.
    As an analogy, honeycombs created by bees are different from those created by
    wasps—similar structures but different outcomes.'
