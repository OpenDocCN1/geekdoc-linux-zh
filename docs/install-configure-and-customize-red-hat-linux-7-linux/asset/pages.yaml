  md: '# Chapter 12: Compiling a Kernel


    The following tasks use use make menuconfig. I recommend that you use either make
    menuconfig or make xconfig. The interfaces are similar, so you should be able
    to follow along with either.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_311_0.png)


    # Starting the Kernel-Configuration Utility


    Start the kernel configuration process by doing the following:


    +   1. Change to the directory that contains your kernel sources:


    ```

    $$ cd /usr/src/linux

    ```


    +   2. Start the kernel-configuration utility (either make menuconfig or make
    xconfig).


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_311_1.png)


    > Errors that happen after you type make menuconfig or make xconfig usually indicate
    that you have not installed all the necessary development RPMs.


    # Configuration Options


    Once the configuration program is up and running, you''ll be confronted with various
    configuration options. The default configuration options are usually appropriate
    for a networked home or work computer. You needn''t carefully check and set all
    options, but you''ll certainly want to check that the device support (IDE, SCSI,
    network, and sound) suits your computer.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_311_2.png)


    > The options configured here are for the Intel x86, but they should apply with
    few exceptions to the other platforms on which Red Hat runs, such as the Alpha.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_311_3.png)


    > While in the configuration program, you can choose Help for most options. Some
    help screens provide additional (hopefully current) information such as URLs relevant
    to the option. Other options are not documented at all.


    Many options can be built as modules rather than as of the core kernel. Building
    pieces of the kernel saves RAM because modules can be automatically loaded when
    and unloaded when they are no longer being used. If you are short on RAM, you
    should build everything possible as modules. At a minimum, you should build device
    support and file-system support as modules.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_311_4.png)'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Configuring the Kernel


    # Code Maturity Level Options


    In this category, there is only one option to configure.


    # Prompt for Development and/or Incomplete Code/Drivers


    Selecting Prompt for Development and/or Incomplete Code/Drivers causes the options
    for incomplete and development parts of the kernel to be displayed. Such options
    are noted as experimental in the help section. Unless you know you want such an
    option, do not select this.


    # Processor Type and Features


    In this category, you will set the attributes of your processor.


    # Processor Family


    Processor Family option, you can select the minimum processor needed by this kernel.
    Select 386, for example, to build the kernel without using any of the optimizations
    offered by later processors. This will allow your kernel to run on all Intel-compatible
    CPUs, albeit more slowly than necessary. The same rule applies to non-Intel processors:
    Picking the oldest or least specific processor model creates a kernel that will
    run on all models, but at a non-optimal speed.


    > Usually you will want to pick your true processor, not an older one. (If you
    are unsure of the exact model of your processor, run the command cat /proc/cpuinfo.)


    # Maximum Physical Memory


    This option enables you to select the tradeoff between the size of virtual memory
    available to programs and the size of physical memory. The 1 GB option allows
    you to use up to 1GB of physical memory, allowing each program 3GB of virtual
    memory. The 2 GB option allows the use of up to 2GB of physical memory, but programs
    only get a 2GB virtual address space. The vast majority of users should leave
    this at the default, 1 GB.


    > If you need several gigabytes of RAM, consider using the version 2.4 kernel
    (when it is released) because it has support for 4GB.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_312_0.png)


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_312_1.png)'
  merge: -1
  pgno: 312
