  md: "# Command-Line Tools\n\nMany people who are new to Linux avoid using a command-line\
    \ interface (CLI) because they are accustomed to the graphical interface of other\
    \ operating systems. The Linux CLI, also known as the *console*, is a powerful,\
    \ lightweight method for controlling your computer. It is not difficult to use\
    \ the command line in a terminal—it is only different. A bit of familiarization\
    \ will have you working in a text screen before you know it. Many people come\
    \ to prefer the command line for its speed and direct approach to computer input.\n\
    \n# Getting Help with Control-Line Commands\n\nAlmost all control-line commands\
    \ have a help function that can be accessed by adding `-h` after the command.\
    \ (Note the space between the command and -h.) Almost all control-line commands\
    \ are lowercase, but there are exceptions. If a command does not work as expected,\
    \ check both spelling and case, as all Linux commands are case-sensitive.\n\n\
    > In some tools, you can use the command `-help` in addition to `-h`.\n\n# Using\
    \ ifconfig to Check Your NIC Configuration\n\nThe command `ifconfig` (located\
    \ in `/sbin`) can be used to check your current NIC configuration. In any terminal\
    \ window, type `ifconfig`. A screen similar to the one shown in Figure 6.11 will\
    \ appear.\n\n```\nroot@localhost:~ ifconfig\neth0: flags=4163<BROADCAST,SMART,MULTICAST,UP>\n\
    \tinet 192.168.1.10  netmask=255.255.255.0\n\tbroadcast=192.168.1.255\n\ttetherpoint=1500\
    \  mtu=1500\n\tqueuelen=1000  \n\trxbytes=123456  packets=789  errors=0  drop=0\
    \  overrun=0  collisions=0\n\ttxbytes=987654  packets=654  errors=0  drop=0  frame=0\
    \  collisions=0\n```\n\n![](img/dd467368d25ae4aa349c6d8be90f7ffb_190_0.png)\n\n\
    **Figure 6.11** Configuration information can be easily obtained."
  merge: -1
