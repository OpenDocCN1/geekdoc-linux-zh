  md: '# Chapter 2: Installing Red Hat Linux7


    LILO is then installed in the MBR and the Linux boot sector is given the default
    priority to load. You can change these settings later from within Linux using
    a utility called linuxconf; for now, use the Workstation settings.


    # How to Dual Boot with Windows NT


    Quite simply, the easiest way to get Linux and Windows NT to work together is
    to install NT first on your machine. Then, when you install Linux, make LILO boot
    to the Master Boot Record (MBR). Finally, edit your /etc/lilo.conf file, and add
    an "nt" option that points to the device NT resides on for example, /dev/hda1.


    If you want to run Linux with Windows NT or Windows 2000 installed later, you
    will need to take some special steps during the installation. Of primary importance
    is that you must run the Custom installation path, as it is the only method that
    enables you to configure LILO to meet your needs.


    Basically, the problem is this: The NT OS Loader does not recognize Linux (imagine
    that) because Linux does not produce the type of file the NT OS Loader needs to
    read before starting an operating system. In addition, the NT OS Loader will not
    function from anywhere else than the boot sector. Since only one boot loader can
    be in the boot sector at a time, you will have a problem if LILO sits in the MBR.


    The Custom install path gives you access to the LILO Configuration screen, where
    you can elect to have LILO installed on the MBR (the default setting) or on the
    first sector of the Linux partition. If you select the latter option, there will
    be no conflict between LILO and the NT OS Loader. Unfortunately, the NT OS Loader
    will not still see LILO, and it will not present Linux as a boot choice. Now comes
    the cicanhey.


    There is a way to create a file in Linux that the NT OS Loader can use to boot
    Linux, but creating it takes a bit of time. I recommend that you use a little
    third-party program called Bootpart, available at www.winimage.com/bootpart.htm.
    This program quickly creates the Linux boot file for NT OS Loader and places it
    where NT OS Loader can use it. I highly recommend this application if you plan
    to use either Windows NT or Windows 2000 with Linux.


    For more information about configuring Windows NT and Linux, read the mini-HOWTO
    document at www.linuxdoc.org/HOWTO/mini/Linux+NT-Loader.html.'
  merge: -1
