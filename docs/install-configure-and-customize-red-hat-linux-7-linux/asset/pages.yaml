  md: '# Mounting File Systems with mount


    There are two commands under Linux that are pertinent to accessing file systems:

    mount and unmount. The mount command is used to mount a file system, and not sur-prisingly,
    the unmount command, discussed in the next section, is used to unmount a mounted
    file system.


    Name: mount


    Function: To make available, or mount, a file system.


    Syntax: mount options device directory


    Description: Unlike other operating systems you might be used to, Linux requires
    that you mount a file system before you use it. Generally, most of this happens
    during the boot-up procedure, and you don''t do it manually. CD-ROMs and flop-pies
    have to be mounted as you wish to use them and unmounted when you are finished.
    Normally you have to be the superuser to issue the mount command. You do not need
    to specify the file-system type or the directory to mount in if the device is
    already listed in the /etc/fstab. If you want to make a device mountable by a
    user or all users, include that information on the device line in /etc/fstab.
    Use your favorite text editor and put an entry in the /etc/fstab file like this:


    ```

    /dev/hdd /cdrom iso9660 ro_user

    ```


    From left to right, that line includes the name of the device, the directory it
    should be mounted, the file-system type, an option specifying read-only, and an
    option specifying that non-root users can mount the device. Be sure to separate
    the options with commas but no spaces; Linux doesn''t understand what you''re
    saying.


    Currently mounted file systems can be found in the /etc/mtab file. Do not edit
    the /etc/mtab file by hand, because it is updated dynamically by your system.
    It is useful to read the /etc/mtab file, however, to see what devices are currently
    available and what file systems are mounted.


    Usage: To use the mount command, type mount followed by any options and the device
    name you wish to mount and optionally the directory you want the device mounted
    under. In Red Hat Linux, the default directory for the CD-ROM is /mnt/cdrom. If
    you have additional devices you need to access, you can create directories for
    them under the /mnt directory (or wherever else like, but the /mnt directory is
    the standard location).'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# Appendix A: The Linux Primer


    Another nifty thing Linux (and there are plenty!) is that it can handle quite
    a few file-system types. Linux can read disks in its own native format (ext2),
    the FAT16 and FAT32 formats used by MS-DOS and Windows 9x, the Macintosh file
    system HFS, the Joliet file system used by Windows 9x for CD-ROMs, as well as
    many others. I found this very handy when I sent a Zip disk with art files in
    Macintosh format. Using Windows, I would have had to buy an expensive program
    to read files from a Mac; using Linux, I just had to recompile the kernel to support
    HFS and mount the disk like any other Zip.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_373_0.png)


    Options:


    +   - **a (Auto).** Determines file-system type automatically, if possible.

    - **n (No write).** Mounts device without writing in /etc/mtab. Useful if /etc/mtab
    is a read-only file.

    - **t (Type).** Specifies the file-system type. The following file-system types
    are common:


    +   * ext2. The native Linux file system

    * msdos. FAT16 file system

    * umsdos. UMSDOS file system

    * vfat. The FAT32 file system

    * minix. The Minix file system

    * nfs. Network file system

    * smbfs. SMB shares from Windows or Samba

    * iso9660. Standard CD-ROM file system

    * hfs. Standard Macintosh file system


    +   - **v (Verbose).** Prints any messages to stand out.

    - **o (Options).** File-specific options are specified by -o followed by a comma-separated
    list of options. Note that I am listing only the most common options. Most of
    these apply to all-file-types, but some systems may support additional options:


    +   * auto. Can also be specified by -a.

    * defaults. Uses the default options (rw, suid, dev, exec, auto, nouser, async).

    * exec. Permits the execution of binaries on the file system.

    * noexec. Does not permit the execution of binaries on the file system.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '+   * ro. Mounts the file system read-only, does not allow writing to the

    file system


    +   * rw. Mounts the file system read-write, allows writing to the file sys-

    tem if the user has the privileges


    # Example 1: Mounting a CD-ROM


    To use a CD-ROM, you need to mount it. By default, Red Hat Linux comes with

    a /mnt/cdrom directory. To mount a typical CD-ROM, type this command:


    ```

    mount -t iso9660 /dev/hdd /mnt/cdrom

    ```


    This tells you that the file system type (-t) is iso9660, the CD-ROM stan-\dard,
    and your CD-ROM is located on the fourth IDE channel (hdd). Typically,

    your hard drive is hda; if yours is usually, is hdb, and so on. On most

    PCs are two IDE controllers that can each have two devices, allowing for hda

    through hdd. The master device on the first controller is hda; the slave device
    is

    hdb. The final argument to the mount command is the directory you want the CD-ROM

    mouted under. Now, unless there are errors, you can access the CD-ROM from

    that directory.


    # Example 2: Mounting a Floppy


    To mount an MS-DS floppy in what would be drive A under MS-DOS, use the

    mount command like this:


    ```

    mount -t msdos /dev/fd0

    ```


    This mounts an MS-DOS (FAT16) floppy under the /floppy directory. By default,

    it allows read read and write access. If you do not want to allow write access
    to the

    floppy, you can specify with the -o rw option, like this:


    ```

    mount -t msdos -o rw /dev/fd0

    ```


    If your /etc/fstab file is set up correctly, you can save typing. You only have
    to tell the

    mount command what device to mount; it tries to assume the rest by reading

    /etc/fstab. To mount your floppy, you all really need to type this is:


    ```

    mount /dev/fd0

    ```


    Unlike Windows, Linux does not assign drive letters to devices. Devices become

    part of the file system when mounted. Although this seems foreign to

    y first, it actually tends to make more sense. For one thing, you''re not limited

    to26 devices on your system! Okay, you probably won''t hit this limit at home,
    but

    it is a real concern in a networked environment.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# Unmounting File Systems


    When I first started using Red Hat, I kept trying to unmount CD-ROMs and floppies
    using unmount instead of unmount. It''s a common mistake. I eventually started
