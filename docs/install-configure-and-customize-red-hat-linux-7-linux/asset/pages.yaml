- img_proc: true
  md: '# Example 3: Listing All Files and Their Attributes


    If you want to see all of the files in a directory and their attributes, combine
    the -a and -l options, as follows:


    ```

    ls -al

    ```


    You see a list of all files in the directory, as well as their permissions, modification
    dates, to whom they belong, and the size of the files. The first letter indicates
    whether it is a file, directory, link, or other. A file is a dash (-), a directory
    is d, a symbolic link is an l, and a hard link is represented as a regular file.
    Other characters indicate it is a special type of file.


    After that letter comes the permissions. There are three groups of three letters.
    The first set is the permissions given to the owner of the file. The next set
    of three is for the group of the file, and then finally is the set for the permissions
    of everyone else. Then you see the owner of the file, followed by the group to
    which the file belongs. By default, the size of each file is displayed in bytes.
    In the next list is the last time the file was modified, or touched, and then
    the name of the file itself.


    > The expression touch is not one I coined. In UNIX-style operating systems, a
    file is said to be touched when it is modified by a user in some way. A file is
    not touched when you just list the contents of a directory file is in or view
    the contents of the file.


    ![](img/dd467368d25ae4aa349c6d8be90f7ffb_368_0.png)


    # Making Links


    Name: ln


    Function: To create a hard link or symbolic link to a file.


    Syntax: ln options source linkname


    Description: The ln command creates a link to a file or directory. By using the
    command, you can create either a symbolic link or a hard link. Symbolic, or soft,
    link is a special file that contains a path name. Hard links are actually another
    name for a file, rather than a pointer to that file like symbolic links.


    As long as (that is, a hard link) for a file exists, it remains on disk. Even
    if you create a file, create a hard link to it, and delete the original file,
    the data remains safely on disk. If you create a symbolic link pointing to a file
    and delete the original file, the file ceases to exist, and the soft link is left
    pointing to nothing.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# Appendix A: The Linux Primer


    The other major difference between symbolic links and hard links is that symbolic
    links can cross file systems, while hard links can point only to files on the
    same system. For instance, if you have your /home directory on one hard drive
    partition and the /opt directory on another, you could not create a hard link
    from something in the /home directory to something in the /opt directory. However,
    you could create a symbolic link between the two with no problem.


    Usage: Use the ln command to create symbolic or hard links to files or directories.
    If you do not specify the name of the link, ln attempts to create a link with
    the same name as what you are linking to.


    Options:


    +   - f (Force). Removes files if they already exist with the link''s name.

    - i (Interactive). Prompts the user if files exist.

    - s (Symbolic). Makes a symbolic link rather than a hard link.


    # Example 1: Creating a Symbolic link to a Directory


    Let''s say you do a lot of work in the /home/httpd/Webpages/uri/ directory but
    not feel like typing the entire directory name each time you want to change to
    that directory. You can create a symbolic link to that directory in your home
    directory called /Web, and then you only have to type cd Web to change to the
    /home/httpd/Webpages/uri/. To create link, use the following command:


    ```

    ln -s /home/httpd/Webpages/uri/ ~/Web

    ```


    As long as there are no files in your home directory called /Web, you have created
    a symbolic link to the proper directory. This can be very useful and save quite
    a bit of typing!


    # Moving Around the Command Line Interface: cd


    Name: cd


    Function: To change the working directory.


    Syntax: cd directory


    Description: The cd command changes your working directory to another directory
    that you specify. This command is used to navigate the directory structure in
    Linux. Typing only cd returns you to your home directory. The cd command works
    similarly to the cd command under DOS. However, the cd command is a little more
    flexible in that it allows to change between your home directory and the previous
    working directory.'
