    that come with today’s Linux releases. XFree86 is the most commonly used X server
    for Intel-compatible PCs. Because XFree86 is required to display complex screens,
    XFree86, rather than Linux, is most concerned with video-compatibility.


    Carefully though the HCL for your video card. Once found, make a note in your
    journal of which X server will be used. The X server is the specific component
    of XFree86 used to display the graphics. Since different cards use different versions
    of X server, you may find it helpful to know this information in case you later
