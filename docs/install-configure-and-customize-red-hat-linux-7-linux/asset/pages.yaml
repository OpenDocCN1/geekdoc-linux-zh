  md: '# Backing Up Your Old Data


    The first thing you should decide is what data should be backed up. That really
    depends on what you want to do in your Linux installation. If you plan to dual
    boot (running Windows and Linux on the same PC), you will need to make sure you''ve
    safeguarded most of your Windows data. More information about dual booting can
    be found in the section titled “To Dual Boot or Not to Dual Boot—That Is the Question”
    later in this chapter.


    Even if you plan to completely remove Windows, there is still merit in saving
    your data files. You''ll be able to open many of them even after you change to
    Linux, such as graphic files (GIFs and JPEGs, among others). In addition, Microsoft
    Office can be opened, compliments of a great office suite called StarOffice, which
    is fully Office compatible. You''ll need to save, not back up, these files if
    you plan to use them on your Linux machine. Linux will not be able to read a Windows
    backup file.


    Most applications these days use huge amounts of disk space, primarily because
    today''s hard drives enable them to do so. Backing up your data and application
    files is a big job. If you have sufficient storage capacity (such as a tape or
    Jaz drive), I recommend backing up your entire hard drive. Those of you who not
    not have a large-capacity device to hold an entire drive''s worth of data should
    just back up your data files—that is, the documents, spreadsheets, drawings, and
    other files that you have created over time on your computer. If you do run into
    trouble, you can restore your system by first re-installing your operating system
    and your applications using your original disks and then restoring your archived
    data files.


    If you have never used a backup program, you will find them easy to use. Many
    backup programs are available, including an excellent one found with Norton Utilities.
    The principles for backup utilities are pretty much the same: Locate and identify
    the files you wish to archive, specify the location of the new archive file, and
    create the file. Restoration is simply the reverse of this action.


    Microsoft Windows has its own utility for backup that can be used to archive your
    data. The next few paragraphs describe how to work with the Windows Backup utility.
    From the Windows 98 taskbar, click the Start button. Choose Programs, Accessories,
    System Tools, Backup. The Microsoft Backup application will start with the Welcome
    to Microsoft Backup dialog box open (see Figure 1.12). You can now choose to create
    a new backup file, open an existing backup job, or restore archived data.


    The Backup application in Windows 95 is similar to that in Windows 98, except
    for the lack of a wizard to step through operations.


