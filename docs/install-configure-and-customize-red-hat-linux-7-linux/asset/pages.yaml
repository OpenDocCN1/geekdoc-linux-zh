  md: 'Brian Proffitt lives and works deep in the booming metropolis known as Indianapolis,
    where three times a year race fans swoop in and drive like maniacs—in RVs, no
    less. Otherwise, a nice place to live. When he''s not writing books like Sun StarOffice
    for Linux (Prima, 2000) or HTML Web Development Fast & Easy (Prima, 2000), Brian
    loves being a dad and husband.


    In his very limited spare time, Brian does some swooping of his own as a soloing
    student pilot, trying to get his private pilot’s license before it starts snowing—which
    in Indiana means October.


