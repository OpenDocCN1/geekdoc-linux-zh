  md: 'Suddenly, Linux is a hot property in the world of business. In late 1999, Linux
    companies who ventured out onto the stock market with their initial public offerings
    found their stock snapped up and the prices for it skyrocketed. Now in mid-2000,
    this buying seems to have slowed down a bit, but the Linux world is still growing
    at a fantastic rate.


    I intend to think that there may be some validity to this growth, and since I''m
    writing this book, I''ll tell you why. It has finally gotten across to business
    people that there is more to Linux than just a desktop operating system.


    If you were to look for Linux PCs in the business environment, you would be hardpressed
    to locate such machines. The common misconception that there are “no good Linux
    applications” (a point of view, I often notice, is endorsed highly by a Redmond,
    Washington company) has not been shaken in corporate America. Minds are getting
    changed, but its slow growng.


    Where Linux is really making big waves is in the embedded systems market. Embedded
    systems, for those who are not familiar with the term, are the programming commands
    that run within minutes of today''s modern electronic devices. Set-top computers,
    microwaves, digital cameras—all have embedded systems. And in this arena, Linux
    is king.


    Why is this so? Size. While hardware is always striving to be bigger and faster,
    software strives to be smaller and faster. The bigger the code, the slower the
    application, and the more chances it has to break. Linux, as an unorned system,
    is very small and stable compared to Windows or Mac OS. It is also a lot smaller
    and faster than Windows CE, one of Linux''s competitors in embedded systems. Even
    running on a PC with a window manager and a desktop environment''s graphic user
    interface, Linux still outperforms its competitors.


    Linux''s success in embedded systems is finally turning enough heads and gotten
    people to wonder if its stability and speed can be reflected on the PC. The answer
    is, of course, it can!


    Where Linux has its greatest strength is one of its major weaknesses. Linux has
    been lovingly crafted and added upon by programmers and developers since its creation
    in 1991. Code was written for efficiency, with user needs coming in second or
    third. After, initial users of Linux were typically fellow programmers who loved
    to play with the code just as much as the designer.


    # Introduction'
