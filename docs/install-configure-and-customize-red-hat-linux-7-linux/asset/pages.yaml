    # Patching the Kernel


    Applying patches to your kernel is entirely optional. If you simply want to use
    the standard kernel you downloaded, skip to the next section. If you want to make
    your own kernel modifications, I suggest you get a book that discusses the internal
    workings of the Linux kernel. The rest of this section discusses applying kernel
    patches prepared by others.


    # Retrieving Incremental Upgrade Patches


    The most common sort of patch is an incremental upgrade of your kernel sources.
    (You may hear these patches referred to as diffs because they are the difference
    between two kernel versions.) These patches update your sources one patch level
    at a time and are named according to the version you will have after the patch
    is applied. For example, suppose you downloaded and installed the hypothetical
    version 2.4.13 from the Source, only to discover that 2.4.15 is the current version.
    Rather than starting from scratch and downloading the entire linux-2.4.15.tar.bz2
    archive, you can download two files: patch-2.4.14.tar.bz2 and patch-2.4.15.tar.bz2.
    Such patch files should be available from the same location as the kernel you
    downloaded. After applying both patches, in order, you would have the 2.4.15 kernel
    installed.


    # Retrieving Other Patches


    Other patches, which are not officially part of the Linux kernel, are also available
    on the Internet. Such patches usually add a feature to the kernel or support for
    new hardware. (These hardware patches are becoming more rare, however, is'
