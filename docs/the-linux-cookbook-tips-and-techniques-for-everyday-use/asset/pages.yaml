    # 32.3 Reading Usenet


    WWW: http://www.faqs.org/usenenet/index.html

    WWW: http://www.geocities.com/ResearchTriangle/Lab/6882/


    Usenet is a famous, vast collection of world-around discussion boards called newsgroups,
    where messages (called articles) can be read and responded to. Newsgroups are
    named and organized by hierarchy, with each branch delineated by a period (''.'');
    for example, the ''comp.os.linux'' newsgroup is part of the ''comp.os'' branch
    of the ''comp'' hierarchy.

    The following table lists the "Big Eight" Usenet hierarchies and give examples
    of newsgroups in each one.


    | USENET HIERARCHY | DESCRIPTION |

    |--- | :---|

    | comp | Computing: news:comp.os.linux,advocacy, news:comp.text.tex |

    | humanities | Humanities: news:humanities.music.composers.wagner |

    | misc | Miscellaneous: news:misc.consumers.frugal-living |

    | news | Newsgroups relating to Usenet itself. news.nevusers.questions |

    | rec | Recreation: news:rec.music.marketplace.vinyl, news:rec.food.cooking |

    | sci | Science: news:sci.math,news:sci.cognitive |

    | soc | Social groups and cultures: news:soc.culture.usa, news:soc.college |

    | talk | Talk and chit-chat: news:talk.environment, news:talk.politics.guns |


    While there are many other hierarchies, these eight are the only newsgroups considered
    to be part of Usenet proper. While metaverse is the term for the collection of
    all newsgroups including those in Usenet, these terms are often used interchangeably.

    The "alternative" hierarchy, ''alt'', is perhaps the most popular hierarchy of
    all-just every subject you want to discuss has an appropriate newsgroup here,
    including non sequiturs. There are also hierarchies for topics concerning certain
    geographical areas; for example, the ''cols'' hierarchy is for topics pertaining
    to Columbus, Ohio, and ''seattle'''
  merge: -1
