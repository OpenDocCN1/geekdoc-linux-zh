  md: '# A.4 Displaying Information about the System


    The following recipes describe ways of displaying information about the system
    you are running.


    # A.4.1 How Long Has the System Been Up?


    To find out how long the system has been running, use the `uptime` tool. When
    you run it as a command, it outputs the current time, how long the system has
    been running, how many users are logged on, and what the system “load averages”
    have been for the past five, and fifteen minutes.


    +   - To find out how long the system has been up, type:


    ```

    $ uptime

    3:34pm up 4:31, 4 users, load average: 0.01, 0.05, 0.07

    $

    ```


    To get a list of dates and times when the system was recently rebooted, give ‘reboot’
    as an argument to last (see Recipe 2.6.4 [Listing the Last Times a User Logged
    In], page 26).


    +   - To output a list of times when the system was rebooted, type:


    ```

    $ last reboot

    ```


    NOTE: An operating system capable of running constantly for a long time without
    crashes or freeze-ups is a good one, and having a high uptime value is a matter
    of pride for many Linux users. It is not uncommon to hear of systems that have
    running for months and sometimes years non-stop—one Linux administrator reported
    on the Internet about one of his systems, which had been running continuously
    without reboot for three years!


    # A.4.2 What Version of Linux Am I Running?


    Use the uname tool to see version of Linux you are running. By default, it outputs
    the name of the operating system; the ‘-r’ option outputs the operating system
    release number.


    +   - To output the name of the operating system, type:


    ```

    $ uname

    ```


    +   - To output the release number of the operating system, type:


    ```

    $ uname -r

    ```


    You can also use uname to output the CPU processor of the system (such as i586,
    PowerPC, etc.); specify this with the ‘-m’ option. The ‘-a’ option is also useful:
    it outputs all information about the system that it can, including all of the
    mentioned options, the version date and number of the operating system and the
    machine''s hostname.


    +   - To output the CPU processor type of the system, type:


    ```

    $ uname -m

    ```


    +   - To output all of the uname information for the system you are on, type:


    ```

    $ uname -a

    ```'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# A.4.3 What Version of Debian Am I Running?


    On a Debian system, the file `/etc/debian_version` (see Chapter 5 [Files and Directories],
    page 65) contains the release name of the Debian installed.


    +   - Use cat to output the contents of this file (see Recipe 106 [Concatenating
    Text], page 130).


    +   - To output the release name of the Debian system you are on, type:


    ```

    $ cat /etc/debian_version RET

    ```


    **NOTE:** Debian releases have historically been named after characters from the
    motion picture *Toy Story*.'
