    \n# 5.8 Specifying File Names with Patterns\n\nThe shell provides you to construct\
    \ patterns, called name expansions, that specify a group of files. You can use\
    \ them when specifying file and directory names as arguments to any tool or application.\n\
    \nThe following table lists the various file expansion characters and their meaning.\n\
    \n| CHARACTER | DESCRIPTION |\n| * | The asterisk matches a series of zero or\
    \ more characters, and is sometimes called the \"wildcard\" character. For example,\
    \ * matches all file names, a* matches all file names that consist of an 'a' character\
    \ followed by zero or more characters, and a*b matches all file names that begin\
    \ with an 'a' and end with a 'b', with any (or no) characters in between. |\n\
    | ? | The question mark matches exactly one character. Therefore, ? matches all\
    \ file names with exactly one character, ?? matches all file names with exactly\
    \ two characters, and a? matches any file name that begins with an 'a' character\
    \ and has exactly one character following it. |\n [list] | Square brackets match\
    \ one character in list. For example, [ab] matches exactly two file names: 'a'\
    \ and 'b'. The pattern c[io] matches 'ci' and 'co', but no other file names. |\
    \ The tilde expands to your home directory. For example, if your username is joe\
    \ and therefore your home directory is '/home/joe', then '~' expands to '/home/joe'.\
    \ You can follow the tilde with a path to specify a file in your home directory—for\
    \ example, '~/work' expands to '/home/joe/work'. |"
