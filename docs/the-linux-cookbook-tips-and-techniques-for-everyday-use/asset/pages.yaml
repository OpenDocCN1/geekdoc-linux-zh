  md: '# 4 The X Window System


    Debian: ''xserver-common''

    WWW: http://www.xfree86.org/


    The X Window System, commonly called “X,” is a graphical windowing interface that
    comes with all popular Linux distributions. X is available for many Unix-based
    operating systems: the version of X that runs on Linux systems with x86-based
    CPUs is called “XFree86.” The current version of X is 11. Revision 6 or “X11R6.”


    All command-line tools and most of the applications that you can run in the console
    can run in X: also available are numerous applications written specifically for
    X.


    This chapter shows you how to get around in X: how to start it and stop it


    # 4.1 Running X


    WWW: http://www.afterstep.org/

    WWW: http://www.fvwm.org/

    WWW: http://www.windowmaker.org/

    WWW: http://www.gnome.org/

    WWW: http://www.kde.org/


    When you start X, you should see a mouse pointer appear on the screen as a large,
    black “X.” If your X is configured to start any tools or applications, they should
    each start and appear in individual windows. A typical X session looks like this:


    ![](img/3658df520e459cc83b744521428473cf_74_0.png)


