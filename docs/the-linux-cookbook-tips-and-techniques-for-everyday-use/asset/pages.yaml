  md: "# Chapter 3: The Shell\n\n| ESCAPE SEQUENCE | DESCRIPTION |\n| --- | --- |\n\
    | \\a | Alert (rings the system bell). |\n| \\b | Backspace. |\n| \\e | Escape.\
    \ |\n| \\f | Form feed. |\n| \\n | Newline. |\n| \\r | Carriage return. |\n| \\\
    t | Horizontal tab. |\n| \\v | Vertical tab. |\n| \\ | Backslash. |\n| \\NNN |\
    \ Character whose NNN in octal (base 8). |\n\nTo demonstrate the passing of special\
    \ character sequences to tool, the following examples will use the figlet tool,\
    \ which displays the text you give as an argument in a \"font\" made of up characters\
    \ (see Recipe 16.3.1 [Horizontal Text Fonts], page 202).\n\n+   * To pass a backslash\
    \ as an argument to figlet, type:\n  $ figlet $\\'$\\\\\\\\' RET\n* To pass a\
    \ form feed character followed by a pilcrow sign character (octal character code\
    \ 266) to figlet, type:\n  $ echo $\\'\\f\\266' RET\n\n# 3.1.2 Letting the Shell\
    \ Complete What You Type\n\nCompletion is where bash does its best to finish your\
    \ typing. To use it, press TAB on the input line and the shell will complete the\
    \ word to the left of the cursor to the best of its ability. Completion is one\
    \ of those things that, once you begin to use it, you will wonder how you ever\
    \ managed to get without.\n\nCompletion works on file names and command names,\
    \ depending on the context of the cursor when you type TAB.\nFor example, suppose\
    \ you want to use / as an argument to the ls command, the / /usr/lib/emacs/20.4/1386-debian-linux-gnu/\
    \ directory—that's a lot to type. So instead of typing out the whole directory\
    \ name, you can type TAB to complete it for you. Notice how our first attempt,\
    \ typing only the letter 'e' in /, brings a series of files—while the second attempt,\
    \ typing 'em', further refines our search:\n\n```\n$ ls /usr/lib/emac[TAB]\nel-me+\
    \ emacs emacs-common entity-map expect5.30\n$ ls /usr/lib/emac[TAB]!\n```\n\n\
    At this point, the shell completes the word 'emacs', since all options in this\
    \ directory beginning with the letters 'em' complete to least that word.\n\n>\
    \ The Unix way of saying it is that the command \"rings the system bell.\""
