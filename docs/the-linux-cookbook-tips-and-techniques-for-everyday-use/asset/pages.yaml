- img_proc: true
  md: '# Chapter 6: Sharing Files


    For example, use `u+w` to add write permission to the existing permissions for
    the user who owns the file, and use `a+rw` to add both read and write permissions
    to the existing permissions of all users. (You could also use `ugo+rw` instead
    of `a+rw`).


    # 6.3.3 Write-Protecting a File


    If you revoke users'' permissions for a file, they can no longer write to or remove
    the file. This effectively “write-protects” a file, preventing accidental changes
    to it. A write-protected file is sometimes called a “read-only” file.


    To write-protect a file so that no other users than yourself can write to it,
    use `chmod go-w` as the operation.


    +   To write-protect the file `cruise` so that no other users can change it, type:

    - `$ chmod go-w cruise`


    # 6.3.4 Making a File Private


    To make a file private from all other users on the system, use `chmod` with `go=`
    as the operation. This revokes all `group` and `other` access permissions.


    +   To make the file `cruise` private from all users but yourself, type:

    - `$ chmod go= cruise`


    # 6.3.5 Making a File Public


    To allow anyone with an account on the system to read and make changes to a file,
    use `chmod` with `a+rw` as the operation. This grants read and write permission
    to all users, making the file “public.” When a file has read permission set for
    all users, it is called *world readable*, and when a file has write permission
    set for all users, it is called *world writable*.


    +   To make the file `cruise` both world readable and world writable, type:

    - `$ chmod a+rw cruise`


    # 6.3.6 Making a File Executable


    An executable file is a file that you can run as a program. To change the permissions
    of a file so that all users can run it as a program, use `chmod` with `a+x` as
    the operation.


    +   To give execute permission to all users for the file `myscript`, type:

    - `$ chmod a+x myscript`


    NOTE: Often, shell scripts that you obtain or write yourself do not have execute
    permission set, and you''ll have to do this yourself.'
