  md: '# Chapter 8: Managing Files


    To extract the files into a directory of their own, make a new directory, move
    the archive to that directory, and change to that directory, where you can then
    extract the files from the archive.


    # 8.7 Tracking Revisions to a File


    The Revision Control System RCS is a set of tools for managing multiple revisions
    of a single file.


    To store a revision of a file so that RCS can keep track of it, check in the file
    with RCS. This deposits the revision of the file in an RCS repository—a file that
    RCS uses to store all changes to that file. RCS makes a repository file with the
    same file name as the file you are checking in, but with a ,v extension appended
    to the name. For example, checking in the file ''foo.text'' with RCS creates a
    repository file ''foo.text,v''.


    Each time you want to remember a revision of a file, you check out the file, and
    RCS writes to that file''s RCS repository the differences between the file and
    the last revision on record in the repository.


    To access a revision of a file, check out the revision from RCS. The revision
    is obtained from the file''s repository and is written to the current directory.


    Although RCS is most often used with text files, you can also use it to keep track
    of revisions made to other kinds of files, such as image files and sound files.


    Another revision control system, Concurrent Versions System (CVS), is used for
    tracking collections of multiple files whose revisions are made concurrently by
    multiple authors. While much less simple than RCS, it is very popular for managing
    free software projects on the Internet. See info file ''cvs.info'', node ''Top'',
    for information on using CVS.


    # 8.7.1 Checking In a File Revision


    When you have a version of a file that you want to keep track of, use ci to check
    in that file with RCS.


    Type ci followed by the name of a file to deposit that into the RCS repository.
    If the file has never before been checked in, ci prompts for a description to
    use for that file; each subsequent time the file is checked in, ci prompts for
    text to include in the file''s revision log see Recipe 8.7.3 [Viewing a File''s
    Revision Log], page 107). Log messages may contain more than one line of text;
    type a period (''.'') on a line by itself to end the entry.


    For example, suppose the file ''novel'' contains this text:


    This is a tale about many things, including a long voyage across America.


    +   To check in the file ''novel'' with RCS, type:'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    ```

    $ ci novel RET

    novel,v <-- novel

    enter description, terminated with single ''\''.'' or end of file:

    NOTE: This is NOT the log message!

    >> The Great American Novel. RET

    >> . RET

    $

    ```


    This command deposits the file in an RCS repository called ''novel,v'', and the
    original file, ''novel'', is removed. To edit or access the file again, you must
    check out a revision of the file from RCS with which to work (see Recipe 8.7.2
    [Checking Out a File Revision], page 106).


    Whenever you have a new revision you want to save, use ci as before to check in
    the file. This begins the process all over again.


    For example, suppose you have checked out the first revision of ''novel'' and
    changed the file so that it now looks like:


    This is a very long tale about great many things, including my long voyage across
    America, and back home again.


    +   To deposit this revision in RCS, type:


    ```

    $ ci novel RET

    novel,v <-- novel

    new revision: 1.2; previous revision: 1.1

    enter log message, terminated with single ''\''.'' or end of file:

    >> Second draft. RET

    >> . RET

    $

    ```


    If you create a subdirectory ''RCS'' (in all uppercase letters) in the current
    directory, RCS recognizes this specially named directory instead of the current
    directory as the place to store the ''v'' revision files. This helps reduce clutter
    in the directory you are working in.


    If you are depositing a text file, you can have RCS insert a line of text, every
    time the file is checked out, containing the name of the file, the revision number,
    and the time in the UTC (Coordinated Universal Time) zone, and the user ID of
    the author. To do this, put the text ''$Id'' at a place in the file where you
    want this text to be written. You only need to do this once; each time you check
    the file out, RCS replaces this string in the file header text.


    For example, this chapter was written to a file, ''managing-files.texinfo'', whose
    revisions were tracked with RCS; the ''$Id'' string in this file currently reads:


    $Id: managing-files.texinfo v 1.32 2001/05/16 16:57:58 m Exp m $


    # 8.7. Checking Out a File Revision


    Use ci to check out a revision of a file from RCS repository.'
