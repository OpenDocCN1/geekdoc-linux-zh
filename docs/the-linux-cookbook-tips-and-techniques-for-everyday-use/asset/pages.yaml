  md: 'Chapter 11: Grammar and Reference


    # 11.1.5 Spell Checking in Emacs


    Emacs has several useful commands for spell checking. The spell-word, spell-region,
    and spell-buffer functions, as you might guess from their names, use the spell-command
    inside Emacs to check portions of the buffer.


    The first command, spell-word, checks the spelling of the word at point; if there
    is no word at point, it checks the first word to the left of point. This command
    has a keyboard shortcut, M-S. The second command, spell-region, checks the spelling
    of all words in the currently selected region of text. The third command, spell-buffer,
    checks the spelling of the entire buffer.


    +   * To check the spelling of the word at point, type:


    ```

    M-x spell-word

    ```


    +   * To check the spelling of all words in the currently selected region of text,
    type:


    ```

    M-x spell-region

    ```


    +   * To check the spelling of all words in the current buffer, type:


    ```

    M-x spell-buffer

    ```


    Spell mode is another useful Emacs spelling command that, when set in buffer,
    highlights misspelled words. This function is useful when you are writing a first
    draft in a buffer, because it lets you catch misspellings as you type.


    +   * To turn on Spell mode in buffer, type:


    ```

    M-x spell-mode

    ```


    NOTE: This command is a toggle; run it again to turn it off.


    To correct a word in Spell mode, click and release the middle button on the buffer
    to pull up a menu of suggestions; then you use the mouse to select the replacement
    word or add it to your personal dictionary.


    If there are words you frequently miss, you can define abbreviations for them
    (see Recipe 10.2.3 [Making Abbreviations in Emacs], page 125). Then, when you
    type the misspelled word, Emacs will automatically replace it with the correct
    spelling.


    If you prefer the sparser, non-interactive interface of spell, you can use the
    Emacs interfaces to that command inspect: Spell word. Spell region, and Spell
    buffer. Any of these commands find a misspelling, prompt for a replacement in
    the minibuffer but do not offer suggestions or provide any of ispell''s other
    features.


    # 11.2 Dictionaries


    Debian: ''wordnet-dev''

    WWW: http://www.cogsci.princeton.edu/~wn/


    The term dictionary on Linux systems generally refers to one of two: the traditional
    Unix-style dictionary, which is an alphabetically sorted word list containing
    no actual definitions, and the newer database-style dictionary that contains the
    headwords as their definitions. The latter is the kind of thing most people mean
    when they talk about dictionaries. (When most Unix folk talk about dictionaries,
    however, they almost mean the leaner.)'
  merge: -1
