  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    The various SGML packages are currently in a state of transition. The original
    SGML-Tools package (known as LinuxDoc-SGML in another life; now SGML-tools v1)
    is considered obsolete and is no longer being developed; however, the newer SGMLtools
    v2 (a.k.a. “SGMLTools Next Generation” and “SGMLTools ''98”) is still alpha software,
    as is SGMLtools-lite (http://sgtools-lite.sourceforge.net/), a new subset of SGMLtools.


    In the interim, if you want to dive in and started making documents with the early
    SGMLtools and the LinuxDoc DTD, it''s not hard to do. While the newer DocDoc DTD
    has become very popular, it may be suited for technical books and very large projects—for
    smaller documents written by individual authors, such as a multi-part essay, FAQ
    or white paper, the LinuxDoc DTD still works fine.


    And since the Linux HOWTOs are still written in LinuxDoc, the Debian project has
    decided to maintain the SGMLtools 1.0 package independently.


    The SGML User''s Guide comes installed with the ''sgml-tools'' package, and is
    available in several formats in the ''/usr/doc/sgml-tools/'' directory. These
    files are compressed; if you want to print or convert them, you have to uncompress
    them first (See Recipe 8.5 [Compressed Files], page 102).


    To peruse the compressed version of the SGML-Tools guide, type:


    +   * zless /usr/doc/sgml-tools/guide.txt.gz RET


    +   * To print a copy of the PostScript version of the SGML-Tools guide to the
    default printer, type:

    * zcat /usr/doc/sgml-tools/guide.ps.gz | lpr RET


    # 15.5.1 Elements of an SGML Document


    A document written in an SGML DTD looks a lot like HTML—which is no coincidence,
    since HTML is a subset of SGML. A very simple “Hello, world!” example in the LinuxDoc
    DTD might like this:


    ```

    <!doctype linuxdoc system>

    <article>

    <title>An Example Document</title>

    <author>Ann Author

    <date>May 2000</date>

    <abstract>

    ```


    ```

    This is an example LinuxDoc document.

    </abstract>

    ```


    ```

    <sect>Introduction

    <p>Hello, world.</p>

    </article>

    ```


    A simple example document and the various output files it generates are on the
    SGML-tools site at http://www.sgtools.org/old-site/example/index.html.


    The SGMLtools package also comes with a simple example file, ''example.sgml.gz'',
    which is installed in the ''/usr/doc/sgml-tools/'' directory.'
