    # 19.3 Extracting PhotoCD Images


    Debian: ''xpcd''

    WWW: http://user.cs.tu-berlin.de/~kraxel/linux/xpcd/


    There are two methods to extract an image from Kodak PhotoCD (''PCD''). If you
    are browsing the disc with the xpcd tool, then choose an image, extract a copy
    at the desired resolution, and save it as a file, described in Recipe 17.5 [Browsing
    PhotoCD Archives], 212.

    You can also use pccdppm on a PCD file to directly extract an image at a given
    resolution and save it to a file in PPM format. Use the ''-r'' option to specify
    the resolution to extract, given as a numeric argument from 1 (lowest resolution)
    to 5 (highest); if this option is omitted, a value of 3 is assumed. Also give
    as arguments the name of the PCD file to read from and the name of the PPM file
    to write to.


    +   - To extract the highest resolution from the ''slack.pcd'' and save it to
    a PPM file named ''slack.ppm'', type:


    ```

    $ pccdppm -r5 slack.pcd slack.ppm

    ```


    # 19.3.1 Converting a PhotoCD Image


    Once you extract a PhotoCD image and write it to a PPM format, use convert to
    convert it to another format and adjust or improve the image (see Recipe 18.2
    [Converting Images between Formats], page 223).


    To improve the image while you convert to JPEG format, specify no interlacing
    with the ''-interlace'' option, 50 percent sharpening with the ''-sharpen'' option,
    and add an optional border and annotation to the image with the ''-border'' and
    ''-comment'' options.


    +   - To convert the ''slack.ppm'' to non-interlaced JPEG, sharpen the image,
    add a two-pixel by two-pixel border, and adjust the image, type (all on one line):


    ```

    $ convert -interlace NONE -sharpen 50 -border 2x2 -comment

    Bob was here'' slack.ppm slack.jpeg

    ```


    > This is a proprietary scanned image format from Kodak, which is a current standard
    for scanning film images to digital.'
