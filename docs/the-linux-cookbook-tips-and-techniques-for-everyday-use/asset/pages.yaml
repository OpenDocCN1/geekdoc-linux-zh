  md: '# Preface


    Because of its robust and stable nature, the Linux-based system is the choice
    of millions today. But what some may not know is that the free software movement,
    of Linux is a part, very much a counter-cultural phenomenon: the design by which
    it is produced and published is contrary to the notions of propriety, intellectual
    "property" that have dominated mainstream culture so much. While some programmers
    turn their research into corporate-backed software that you cannot only change,
    share, or examine (but only purchase and run on system), Linux and other free
    software is the product of many individuals who courageously published and shared
    their research and work openly, for everyone to benefit from.


    I wrote this book because I want everyone to know how to use this software, because
    I everyone deserves the freedom that comes with it. I don''t willingly use proprietary
    software—not because it is always inferior but because its freedoms that I find
    cannot exist without ... freedoms that should be everyone''s right default in
    a free, open society (See Chapter 1 [Introduction], page 9).


    I know Linux isn''t difficult to use, especially when compared with other software
    and operating systems, but what was needed was a guide to show people how to use
    it to get things done: "Oh, you want to do that? Here, type this."


