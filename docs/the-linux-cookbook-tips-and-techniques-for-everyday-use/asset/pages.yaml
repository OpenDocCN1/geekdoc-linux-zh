  md: '60 The Linux Cookbook: Tips and Techniques for Everyday Use


    To switch to another video mode, use the ⊕ and ♀ keys on the numeric keypad with
    the left CTRL and ALT keys. The ⊕ key switches to the next mode with a lower resolution,
    and the ♀ key switches to the next mode with a higher resolution.


    +   To switch to the next-lowest video mode, type:


