    The GIMP (GNU Image Manipulation Program) is an all-encompassing image-editing
    and manipulation program that lets you paint, draw, create, and edit images in
    complex ways.

    Using *Gimp* you can also convert image files, retouch and edit photographic images,
    and browse collections of images.


    The GIMP comes with hundreds of tools, filters, fonts, and other goodies installed.
    Here is a partial list of its features:


    +   * Contains a full suite of painting tools, including Brush, Pencil, Airbrush,
    and Clone.

    * Supports custom brushes and patterns.

    * Includes a full suite of image selection, transformation, and manipulation tools,
    including a gradient editor, color blending, and special effects.

    * Includes animation support.

    * Permits the use of layers and channels.

    * Allows for large images, with their size being limited only by available disk
    space.

    * Provides high-quality anti-aliasing.

    * Offers full alpha-channel support.

    * Supports command scripting.

    * Permits multiple undo and redo, limited only by available disk space.

    * Allows multiple images to be open simultaneously.

    * Supports all popular file formats, including GIF, JPEG, PNG, XPM, TIFF, TGA,
    MPEG, PS, PDF, PCX, and BMP.

    * Allows the easy addition of more than 100 plug-ins for new file formats and
    new effect filters.'
