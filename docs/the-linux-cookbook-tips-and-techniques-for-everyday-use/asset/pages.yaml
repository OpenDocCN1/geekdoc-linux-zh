    Give the names of the audio files to burn, in the order that they should appear
    on the disc, as arguments to the ''-audio'' option. The files are written in CD-DA
    CD audio format, and they should contain 16-bit stereo at 44,100 samples/second
    (the ''.cdr'' or ''.cdda'' files meet this criterion).


    +   To burn the file ''symphony.cdr'' to the CD-R drive whose target ID is 2 on
    the primary SCSI bus,


    +   To burn all the files in the current directory with a ''.cdr'' extension at
    double speed to the CD-R drive whose target ID is 2 on the primary SCSI bus, and
    give verbose output:


    ```

    cdr dev=0,2,0 -audio symphony.cdr RET

    ```


    +   To run a test burn of the file ''symphony.cdr'' to disc in the CD-R drive
    whose target ID is 1 on the primary SCSI bus, type:


    ```

    cdr record dev=0,6,1 -dummy-audio symphony.cdr RET

    ```


    When you use wildcards for files, as the second-to-last, the shell expands the
    files in alphabetical order. To write a group of files in a particular order rename
    them as arguments, so that their names begin with numbers that correspond to the
    order you want to write them (in Recipe 5.5 [Moving Files and Directories], page
    76).


    For example, if you have the three files ''morning-song.cdr'', ''midday-song.cdr'',
    and ''evening-song.cdr'', and you want to write them in order, rename them to
    ''01-morning-song.cdr'', ''02-midday-song.cdr'', and ''03-evening-song.cdr'';
    otherwise, if you specify them ''*.cdr, the shell sorts their names so that they
    will be written to CD-R in the order of ''evening-song.cdr'', ''midday-song.cdr'',
    and ''morning-song.cdr''exactly the opposite of what was intended!


    To write a disc containing both data and audio tracks, first specify the file
    for the data track (it should contain a filesystem image in ISO 9660 or Rock Ridge
    format), and follow it with the ''-audio'' option and the names of the audio tracks
    to use. The resulting CD-R will be mountable as a data CD and playable on audio
    players (the first track on the disc, the data track, will be skipped when playing
    the audio).


    +   To burn the track ''band-info'' and all the audio tracks in the current directory
    with a ''.cdda'' extension to the CD-R drive whose target ID is 2 on the primary
    SCSI bus,


    ```

    cdr dev=0,2,0 band-info -audio *.cdda RET

    ```


    NOTE: When writing an audio CD, if you pause even momentarily to let the system
    shuffle processes, the CD-R could be ruined! For this reason, it is advisable
    to avoid switching between consoles—or between windows, if running X—during the
    CD-R burning process.'
