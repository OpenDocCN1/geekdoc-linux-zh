  md: '# 15.5.2 Checking SGML Document Syntax


    Use sgmlcheck to make sure the syntax of an SGML document is correct— it outputs
    errors it finds in the document that is specified as an argument.


    +   To check the SGML file `myfile.sgml`, type:


    ```

    $ sgmlcheck myfile.sgml

    ```


    # 15.5.3 Generating Output from SGML


    The following tables list the SGML converter tools that use with SGtools, and
    describes the kind of output they generate. All take the name of the SGML file
    to work on as an argument, and they write a new file with the same base file name
    and the file name extension of their output format.


    | TOOL | DESCRIPTION |

    | --- | --- |

    | sgml2html | Generates HTML files. |

    | sgml2info | Generates a GNU Info file. |

    | sgml2lyx | Generates a LyX input file. |

    | sgml2latex | Generates a LaTeX input file (useful for printing; first process
    as in Recipe 15.4.3 [Processing Files], page 191, and then print the resultant
    DVI or PostScript output). |

    | sgml2rtf | Generates a file in Microsoft’s “Rich Text Format”. |

    | sgml2txt | Generates plain text format. |

    | sgml2xml | Generates XML format.


    +   To make a plain text file from `myfile.sgml`, type:


    ```

    $ sgml2txt myfile.sgml myfile.txt

    ```


    This command writes a plain text file called. To make a PostScript or PDF file
    from an SGML file, first generate a LaTeX input file, run it through LaTeX to
    make a DVI output file, and then process that to make the final output.


    +   To make a PostScript file from `myfile.sgml`, type:


    ```

    $ sgml2latex myfile.sgml

    $ latex myfile.latex

    $ dvips -t letter -o myfile.ps myfile.dvi

    ```


    In this example, sgml2latex writes a LaTeX input file from the SGML source file,
    and the latex tool processes the LaTeX to make DVI output, which is processed
    with dvips to get the final output: a PostScript file `myfile.ps` with a paper
    size of US letter.


    To make a PDF file from the PostScript file, you need to take one more step and
    use ps2pdf, part of the gs or Ghostscript package; this converts the PostScript
    to PDF.'
