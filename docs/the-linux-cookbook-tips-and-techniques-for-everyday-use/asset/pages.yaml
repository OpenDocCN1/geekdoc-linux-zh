  md: "# 12.3.2 Listing Relevant Files in Emacs\n\nDebian: 'remembrance-agent'\nWWW:\
    \ http://www.media.mit/~rhodes/RA/\n\nThe purpose of the Remembrance Agent is\
    \ to analyze the text you type in an Emacs session and, in the background, find\
    \ similar or relevant passages of text within your other files. It then outputs\
    \ in a smaller window list of suggestions those files that it has found—which\
    \ you can open in a new buffer.\n\nWhen installing the Remembrance Agent, you\
    \ create three databases of the files to use when making relevance suggestions;\
    \ when remembrance-agent is running, it searches three databases in parallel,\
    \ looking for relevant text. You could create, for example, one database of saved\
    \ email, one of your writings, and one of saved documents.\n\n+   * To toggle\
    \ the Remembrance Agent in the current buffer, type:\n  C-c r\n\nWhen remembrance-agent\
    \ is running, suggested buffers will be displayed in the small 'Remembrance*'\
    \ buffer at the bottom of the screen. To open a suggestion in a new buffer, type\
    \ C-c r, where number is the number of the suggestion.\n\n+   * To output the\
    \ second suggested file in a new buffer, type:\n  C-c r 2\n\n# 12.4 Finding Anagrams\
    \ in Text\n\nDebian: 'an'\n\nAn anagram is a word or phrase whose characters consist\
    \ entirely of all the characters of a given word or phrase—for example, 'stop'\
    \ and 'tops' are both anagrams of 'pots'.\nUse an to find and output anagrams.\
    \ Give as an argument the word or quoted phrase to use an writes its results to\
    \ the standard output, type:\n\n+   * To output all anagrams of the word 'lake':\n\
    \  $ an lake RET\n\n+   * To output all anagrams of the phrase 'lakes and oceans',\
    \ type:\n  $ an 'lakes and oceans' RET\n\n+   * To limit the anagrams to containing\
    \ a given string, specify that string with the '-c' option.\n* To output only\
    \ anagrams of the phrase 'lakes and oceans' which contain the string 'seas', type:\n\
    \  $ an -c seas 'lakes and oceans' RET\n\nTo print all the words that some or\
    \ all letters in a given word or phrase can make, use the '-w' option. This outputs\
    \ words that are not anagrams, since anagrams must contain all of the letters\
    \ of the other word or phrase.\n\n+   * To output all of the words that can be\
    \ made from the letters of the word 'seas', type:\n  $ an -w seas RET"
  merge: -1
