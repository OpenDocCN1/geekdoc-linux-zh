  md: '# 1.1.2 What''s Free Software?


    If you would like further information on this topic, you might be interested in
    consulting A Quarter Century of UNIX by Peter H. Salus (Addison-Wesley 1994),
    which has become the standard text on the subject.


    WWW: http://www.gnu.org/philosophy/free-sw.html


    Over the years, Unix''s popularity grew. After the divestiture of AT&T, the tapes
    of the source code that Bell Labs provided became a proprietary, commercial product:
    AT&T Unix. But it was expensive, and didn''t come with the source code that made
    it tick. Even if you paid extra for a copy of the sources, you couldn''t share
    with your programmer colleagues any improvements or discoveries you may make.


    By the early 1980s, proprietary software development, by only-for-profit corporations,
    was becoming the norm—even at universities. More software was being distributed
    without source code than ever before.


    In 1984, while at the Massachusetts Institute of Technology in Massachusetts,
    hacker Richard Stallman saw his colleagues accept and move to this proprietary
    development model. He did not accept the kind of such proprietism would offer:
    no sharing your findings with your fellow man, no freedom for anyone to improve
    a work.


    So instead of the world of non-free computing, Stallman decided to start a project
    to build and assemble a new Unix-like operating system from scratch, and make
    its source code free for anyone to copy and modify. This was the GNU Project (“GNU''s
    Unix”).^2


    Individuals and businesses may charge for free software, but anyone is free to
    share copies with their neighbors, change it, or look at its source code to see
    how it works. There are no secrets in free software; it is software that gives
    all of its users the freedom they deserve.


    Proprietary software strictly limits these freedoms—in accordance with copyright
    law, which was formulated in an age when works were normally set and manipulated
    in physical form, and not as non-physical data, which computers copy and modify.


    Free licensing was developed as a way to work around the failings of copyright
    law, by permitting anyone to copy and modify a work under strict term and conditions.
    The GNU Project''s GNU General Public License (http://www.gnu.org/copyleft/gpl.txt),
    or GNU GPL, is the most widely used of all free software licenses. Popularly called
    a “copyleft,” it permits anyone to copy or modify any software released under
    its terms provides all derivatives or modifications are released under the same
    terms, and all changes are documented.


    > ^ operating system has been released in its entirety'
