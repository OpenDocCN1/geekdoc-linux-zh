  md: "# 5.1 Naming Files and Directories\n\n\n\nLinux does not force you to use file\
    \ extensions, but it is convenient and useful to give file properties extensions.\
    \ They will help you identify file types at a glance. You may have files with\
    \ multiple extensions, such as 'long.file.many.extensions', and you may have files\
    \ with none at all, such as 'myfile'. A JPEG image file, for example, does not\
    \ have to have a '.jpg' or '.jpeg' extension, and program files do not need a\
    \ special extension to make them work.\n\nThe file name before any extensions\
    \ is called the base file name. For example, the base name of 'house.jpeg' is\
    \ 'house'.\n\nSome commonly used file extensions are shown in the following table,\
    \ including extensions for text and graphics files. (See Recipe 18.2 [Converting\
    \ Images into Formats], page 223, for more extensions with image files, and see\
    \ Recipe 21.3 [Playing a Sound File], page 245, for extensions used with sound\
    \ files.)\n\n| EXTENSION | DESCRIPTION |\n| --- | --- |\n| .txt or .text | Plain,\
    \ unformatted text. |\n| .tex | Formatted in the TeX or LaTeX formatting language.\
    \ |\n| .ltx or .latex | Formatted in the LaTeX formatting language (neither is\
    \ as common as just using '.tex'). |\n| .gz | A compressed file. |\n| .sgml |\
    \ SGML (Standardized General Markup Language) format. |\n| .html | HTML (Hypertext\
    \ Markup Language) format. |\n| .xml | XML (Extended Markup Language) format.\
    \ |\n\nThe following sections show how to make new files: to rename an existing\
    \ file, move it to a file with the new name—see Recipe 5.5 [Moving Files and Directories],\
    \ page 76.\n\n# 5.1.1 Making an Empty File\n\nYou may sometimes want to create\
    \ a new, empty file as a kind of \"placeholder.\" To do so give the name you want\
    \ to use for the file as argument to\n\n+   * To create the file 'a_fresh_start'\
    \ in the current directory, type:\n  * $ touch a_fresh_start RET\n* To create\
    \ the file 'another_empty_file' in the 'work/completed' subdirectory of the current\
    \ directory, type:\n  * $ touch work/completed/another_empty_file RET\n\n> Technically,\
    \ there are other characters that you can use—but doing so may get you into trouble\
    \ later on."
  merge: -1
