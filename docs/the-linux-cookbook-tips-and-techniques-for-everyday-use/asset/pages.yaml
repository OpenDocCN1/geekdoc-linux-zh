  md: '# 27.6 Reminding Yourself of Things


    Sometimes, it''s useful to make a reminder for yourself that you''ll see later
    in your current login session, or the next time you log in. These recipes describe
    the best ways to do this.


    NOTE: When you want to give yourself a reminder for a future appointment, use
    calendar (see Recipe 27.4 [Managing Appointments], page 288).


    # 27.6.1 Sending Yourself Email Reminders


    Sending yourself a short email message is often effective for reminding yourself
    to something-during your next workday or next time you read mail; keeping a message
    in your INBOX as a constant reminder to get something done—provided you don''t
    abuse it and fill your INBOX with lots of these "urgent" mails!


    To quickly send an email reminder, give your email address (or just your username
    on your local system, if you check mail there) as an argument to mail tool. You
    will be prompted to give a subject for the message, and if that isn''t enough
    space for the reminder, you can write as many lines as you need below it as the
    message body text; type C-d on a line by it to send it.


    For example, if your username on your local system is joe, to send yourself an
    email reminder, you''d type:


    ```

    $ mail joe RET

    Subject: Bring files to meeting RET

    C-d

    Cc: RET

    Null message body; hope that''s ok

    $

    ```


    NOTE: For more about using the mail tool, see Recipe 30.1 [Sending Mail], page
    315.


    # 27.6.2 Reminding Yourself When You Have to Leave


    Debian: ''leave''

    WWW: http://www.debian.org/Packages/stable/utils/leave.html


    Use the leave tool to remind yourself when you have to leave. As an argument the
    time when you go, using the format of hhmm, where hh is in 24-hour format and
    mm minutes.


    +   - To remind yourself to leave at 8:05 p.m., type:


    ```

    $ leave 2005 RET

    ```


    When you run leave with no arguments, it prompts you to enter a time; if you just
    RET then leave exits without setting the reminder. This method is good for adding
    scripts to your ''.bashrc'', so that you can interactively give a leave, if desired,
    the script runs (see Recipe 3.6.4 [Customizing Future Shells], page 47).'
  merge: -1
  pgno: 317
- img_proc: true
  md: "# Chapter 27: Reminders\n\n**NOTE:** leave will output a reminder on the terminal\
    \ screen five minutes before the given time, one minute before the time, at the\
    \ time itself, and then every minute subsequently until the user logs off.\n\n\
    # 27.6.3 Running a Command on a Delay\n\nThe `sleep` tool does nothing but wait\
    \ (or \"sleep\") for the number of seconds specified as an argument. This is useful\
    \ for ringing the system bell, playing a sound file, or running some other command\
    \ at your terminal after a short delay.\n\nTo do this, give the number of seconds\
    \ to \"sleep\" for an argument to `sleep`, followed by a semicolon character (';')\
    \ and the command(s) to run. This runs the given command(s) only after `sleep`\
    \ waits for the given number of seconds.\n\nSince the shell where you type this\
    \ command will be unusable until the commands you give are executed (or until\
    \ you interrupt the whole thing), type this command in an `xterm` or virtual console\
    \ window (see Recipe 2.3 [Console Basics], page 20) other than the one you are\
    \ working in.\n\n+   To ring the bell in five seconds, type:\n  $ `sleep 5; echo\
    \ -e '\\la' RET`\n\n+   To announce the time in thirty seconds, type:\n  $ `sleep\
    \ 30; saytime RET`\n\nYou can also give the time in minutes, hours, or days. To\
    \ do this, follow the argument with a unit, as listed in the following table.\n\
    \n| UNIT | DESCRIPTION |\n| s | Minutes |\n| m | Hours |\n| d | Days |\n\n+  \
