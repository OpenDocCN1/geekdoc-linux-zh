  md: "# 13.1.2 Single-Spacing Text\n\nThere are many methods for single-spacing text.\
    \ To remove empty lines from text output, use `grep` with the regular expression\
    \ `.`, which matches any character, and therefore matches any line that is not\
    \ empty (see Recipe 14.2 [Regular Expressions—Matching Text Patterns], page 166).\
    \ You can then redirect this output to a file, or pipe it to another: the original\
    \ file is not altered.\n\n+   - To output all non-empty lines from the file `term-paper`,\
    \ type:\n  ```\n  $ grep term-paper RET\n  ```\n\nThis command outputs lines that\
    \ are not empty—so lines containing only non-printing characters, as spaces and\
    \ tabs, will still be output.\n\nTo remove from the output empty lines, and all\
    \ lines that consist of only space characters, use `[^ ]` as the regex to search\
    \ for. This regex will still output lines that contain only tabs; to remove from\
    \ the output empty lines and lines that contain only a combination of space or\
    \ tab characters, use `[^[:space:]]` as the regex to search for. Use the special\
    \ predefined `[[:space:]]` regex class, which matches any kind of space character\
    \ at all, including tabs.\n\n+   - To output only the lines from the file `term-paper`\
    \ that contain more than just space characters, type:\n  ```\n  $ grep '[.]' term-paper\
    \ RET\n  ```\n\nTo output only the lines from the file `term-paper` that contain\
    \ more than just space or tab characters, type:\n  ```\n  $ grep '[[:space:]]'\
    \ term-paper RET\n  ```\n\nIf a file is already double-spaced, where all even\
    \ lines are blank, you can remove them lines from the output by using `sed` with\
    \ the `'n;d'` expression.\n\n+   - To output only the lines from file `term-paper`,\
    \ type:\n  ```\n  $ sed 'n;d' term-paper RET\n  ```\n\n# 13.1.3 Double-Spacing\
    \ Text\n\nTo double-space the file, where one line is inserted between each line\
    \ in the original text, use the `pr` tool with the `-d` option. By default, `pr`\
    \ paginate text and puts a header at the top of each page with the current date,\
    \ month, and page number; use the `-t` option to omit this header.\n\n+   - To\
    \ double-space the file `term-paper` and write the output to the file `term-paper.print`,\
    \ type:\n  ```\n  $ pr -d t term-paper > term-paper.print RET\n  ```\n\nTo send\
    \ the output directly to the printer, you would pipe the output to lpr:\n  ```\n\
    \  $ pr -d t term-paper | lpr RET\n  ```\n\n**NOTE:** The `print` tool is a text\
    \ pre-formatter, often used to paginate and otherwise prepare files for printing;\
    \ there is more discussion on the use of this tool in Recipe 13.2 [Paginating\
    \ Text], page 158."
