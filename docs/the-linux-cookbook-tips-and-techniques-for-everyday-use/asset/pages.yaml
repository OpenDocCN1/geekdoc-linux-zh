  md: '# 20 PostScript


    Debian: ''gs''

    Debian: ''psutils''

    WWW: http://www.gnu.org/pub/gnu/ghostscript/

    WWW: http://ftp.dcs.ed.ac.uk/pub/ajcd/\nWWW: http://www.cappella.demon.co.uk/tinymfiles/tinymenu.html


    PostScript is a programming language, used to describe the way a "page" (usually
    a physical sheet of paper) should look. PostScript files are text files containing
    the PostScript commands for drawing images to be printed on pages.


    Like plain text files, PostScript files are commonly found on the Internet (and
    are used by commercial printers), as with plain text, they can be shared across
    platforms and hardware without difficulty. on high-end display or printed on a
    low-end printer, to the best of that hardware''s capability. PostScript is a compact
    and elegant format.


    While it is possible to write directly in the PostScript language, and some people
    have become adept at programming PostScript, so many tools and applications convert
    files to and from PostScript that you do not have. See Recipe 15.2 [Converting
    Plain Text to Output], p.179, for a way to convert plain text into PostScript.


    Ghostscript is a free implementation of the PostScript language. The gs tool is
    a Ghostscript interpreter used to convert files from PostScript to other formats,
    usually for printing to a non-PostScript printer (see Recipe 25.3.1 [Preparing
    a PostScript File for printing], p.275). The ghost tool is used to view PostScript
    files on the screen (see Recipe 17.1.2 [viewing a PostScript File], p.207).


    EPS, or Encapsulated PostScript, is a file format that describes the contents
    of a box within a page. EPS files can be embedded in the page of a PostScript
    file, and are therefore commonly used when inserting an illustration into a document
    (for example, all of the illustrations in the Cookbook are EPS format files).
    You can view and print EPS files just as you would PostScript files.


    This chapter includes recipes for formatting and manipulating PostScript. Recipes
    are separated according to whether they work on the individual, logical pages
    in a PostScript file (the numbered pages in the file that are not necessarily
    the physical pages of output), and those that work on the entire file as a whole.


    Unless otherwise indicated, the tools in this chapter are part of Angus Duggan''s
    PSUtils package. These tools can be useful for other purposes than those described
    below; see their respective man pages for more details.


    # 20.1 Manipulating PostScript Pages


    These recipes work on individual pages of PostScript files, and not the entire
    file itself.


    # 20.1.1 Extracting DVI Pages to PostScript


    To extract specific pages of a DVI (“Device Independent”) file to PostScript,
    use dvips and give the page or hyphenated page to output with the ‘-pp’ option.'
  merge: -1
