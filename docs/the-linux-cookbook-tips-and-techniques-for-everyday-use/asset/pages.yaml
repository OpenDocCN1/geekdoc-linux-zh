  md: '# 138 The Linux Cookbook: Tips and Techniques for Everyday Use


    Sometimes, ispell question a word that you may not want to count as a misspelling,
    such as proper names and the like words that don''t appear in the system dictionary.
    There are a few things you can do in such cases, as follows.


    To accept a misspelled word as correct for the current ispell session only type
    a: from then on during the current session, this will be considered correct.


    If, however you want ispell (and spell, and all other tools that access the dictionary)
    to remember this word as being correct for this and all future sessions, insert
    the word in your personal dictionary. Type u to insert a copy of the word uncapitalized,
    in all lowercase letters this way if the word is capitalized at the beginning
    of a sentence, the lowercase version of the word is saved. From then on, in the
    current ispell session and in future sessions, regardless of case, it will be
    considered.


    When case is important to the spelling—for example a word that is a proper name
    such as ''Seattle'', or with mixed case, such as ''LaTeX''—type i to insert a
    copy of the word in your personal dictionary with its case just as it appears;
    this, words spelled with the same letters but different case will be considered
    misspelled.


    When ispell finishes checking a file it saves its changes to the file and then
    exits. It also makes a copy of the original file, without the changes applied;
    this file has the same name as the original with .bak added to the end so in our
    example, the backup file is called fall-lecture.notes.bak This is useful if you
    regret the changes you''ve made and want to restore the file to how it was before
    you ruined it up—just remove the spell-checked file and rename the .bak to its
    original name.


    The following table is a reference to the ispell key commands.


    | KEY | COMMAND |

    |---|---|

    | SPC | Accept misspelled word as correct, but only for this particular instance.
    |

    | number | Replace the misspelled word with the suggestion that corresponds to
    the given number. |

    | ? | Display a help screen. |

    | a | Accept misspelled word as correct for the remainder of this ispell session.
    |

    | i | Accept misspelled word as correct and add it to your private dictionary
    with the capitalization as it appears. |

    | 1 | Look up words in the system dictionary according to a pattern you give them.
    |

    | q | Quit checking and restore the file to how it was before this session. |

    | r | Replace misspelled word with a word you type. |

    | u | Accept misspelled word as correct and add it to your private dictionary
    in all lowercase letters. |

    | x | Save the changes thus made, and then stop checking this file. |'
