  md: '# 27 Reminders


    If you''re working on a system on a regular basis, it can be very useful to have
    the system remind you when you should be doing something else. This chapter describes
    software tools that provide reminders—clocks, calendars, address books, and tools
    for tracking appoint-


    # 27.1 Displaying the Date and Time


    WWW: http://www.clock.org/

    WWW: http://www.eecis.udel.edu/~ntp/


    Use date to output the current system date and time.


    +   To output the current system date and time, type:


    ```

    $ date RET

    Fri May 11 11:10:29 EDT 2001

    $

    ```


    The default format of the output is to display the day of the week; the month
    name; the day of the month; the 24-hour time in hours, minutes, and seconds; the
    time zone; and the year.


    Use the ''-u'' option to output the current date and time in Greenwich Mean Time
    (also known as Coordinated Universal Time, or UTC).


    +   To output the current date and time in UTC, type:


    ```

    $ date -u RET

    Fri May 11 15:10:29 UTC 2001

    $

    ```


    Use the ''-R'' option to output the date in the format described in RFC822 (see
    Recipe 11 [Word Lists and Reference Files], page 145): day of week followed by
    day of month, month name, year, time, and time in numeric format. This is the
    date format used in email messages.


    +   To output the current date and time in RFC822 format, type:


    ```

    $ date -R RET

    Fri, 11 May 2001 11:10:29 -0400

    $

    ```


    You can also use the ''-d'' option to specify the precise fields to output, and
    the order in which to output them. One useful example is given next; for more
    information, see the date man page (see Recipe 2.8.4 [Reading a Page from the
    System Manual], page 30).'
  merge: -1
  pgno: 308
