    Logging out of the system finishes the terminal you were using and ensures that
    nobody can access your account from this terminal.


    If you are the only person using your system and have ended a session by logging
    out, you might want to power down the system. See Recipe 2.1.2 [Shutting Down
    the System], page 17, earlier in this chapter.


    # 2.3 Console Bases


    A terminal is a place to put input and get output from the system, and usually
