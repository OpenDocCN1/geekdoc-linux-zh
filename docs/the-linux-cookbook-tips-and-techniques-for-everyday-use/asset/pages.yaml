    # 14.6 Searching Text in Emacs


    The following sections show ways of searching for text in Emacs — incrementally,
    for a word or for a pattern — and searching then replacing it.


    # 14.6.1 C-s Searching Incrementally in Emacs


    Type C-s to use the Emacs incremental search function. It takes text as input
    in the minibuffer and it searches for that text point toward the end of the current
    buffer. C-s again to search for the next occurrence of the text you are searching
    for; this continues until no more matches occur. Then, Emacs reports `Falling
    I-search` in the minibuffer; C-s again to wrap to the beginning of the buffer
    and continue the search from there.


    It gets its name “incremental” because it begins searching immediately when you
    start to type text, and it builds a search string in *increments*—for example,
    if you want to search for the word `sunflower` in the current buffer, you start
    to


    ```

    C-s

    ```


    At that point Emacs searches forward through the buffer to the first ‘s’ character,
    and highlights it. Then, as you type u, it searches forward to the first ‘su’
    in the buffer and highlights that (if a ‘u’ appears immediately after the ‘s’
    it stopped at, it stays where it is, and highlights the ‘s’ and the ‘u’). It continues
    to do as long as you type and as long as there is a match in the current buffer.
    As soon as you type does not appear in the buffer, Emacs beeps and a message appears
    in the minibuffer stating that the search has failed.


    To search for the instance of the last string you type, type C-s again: if you
    keep CTRL held down, every time you press the key RET, Emacs will advance to the
    next match in the buffer.


    This is generally the fastest and most common type of search you will use in Emacs.
    You can do an incremental search through the buffer in reverse—that is, from point
    to the beginning of the buffer — with the `is-backward` function. C-r.


    +   • To search for the ‘moon’ in the current buffer from reverse to the beginning
    of the buffer, type:


    ```

    C-r moon

    ```'
