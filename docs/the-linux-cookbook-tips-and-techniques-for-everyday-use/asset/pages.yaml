    # A.2.4 Installing a Shell Script


    A script is a file that contains a shell command language (see Chapter 3 [The
    Shell], page 35). You run (or "execute") a script as you would any other command
    (see Recipe 2.4 [Running a Command], page 22). First, make sure that the script
    is executable; if it isn''t, you won''t be able to execute it (see Recipe 6.3.6
    [Making a File Executable], page 87).


    Generally, the administrator installs new scripts in the ''/usr/local/bin'' directory.
    If you are on a multi-user system and you are the only user liable to run a particular
    script, you can put it in a special directory in your home directory tree—the
    ''/bin'' directory is the standard recommendation here—and then add that directory
    to your path (see Recipe 3.6.3 [Adding to Your Path], page 47).


    Not all executable scripts are shell scripts. The first line of a script contains
    the full path of the shell or other program that is to interpret and execute the
    script; sometimes, the path may differ on your system from the one it was written
    on, so you may have to change this line.


    For example, a script may start with the following line:


    ```

    #!/usr/local/bin/perl

    ```


    This line means that the script is written in the perl language; the text after
    the ''#!'' is the full path of the perl program, in which case is ''/usr/local/bin/perl''.


    If you try to execute this script and the system reports an error finding the
    file, you''ll have to change that first line to correspond to the location of
    the perl binary on your system.


    +   To find out where perl is installed on your system:


    ```

    $ which perl RET

    ```


    If that command returns ''/usr/bin/perl'' or some path other than /usr/local/bin/perl'',
    you''ll have to change the location in the first line of the script to the path
    name given:


    ```

    #!/usr/bin/perl

    ```'
