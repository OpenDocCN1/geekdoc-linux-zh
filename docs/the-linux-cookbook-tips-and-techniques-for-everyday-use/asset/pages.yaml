  md: '# Appendix A Administrative Issues


    Every Linux system has an administrator— someone who installs the hardware and
    software, maintains the system, and generally keeps things running smoothly. A
    single-user home Linux system, once installed and running, needs little administration—but
    the occasional upgrade or maintenance task is necessary.


    This appendix exists as a reference for those who will also be performing the
    administrative duties on their system. While a complete administrative guide is
    out of the scope of this book, the goal of this appendix is to point out the new
    Linux administrator in the right direction, giving tips on how to choose the computer
    you''ll use for Linux, install Debian GNU/Linux on it, and get it ready for use.


    Unlike the rest of this book, this chapter contains recipes describing commands
    to run by root, the supervisor account.


    If you''re new to Linux administration, you may want to consult the help resources
    in Recipe 13 [If You Need Help More], page 16.


    # A.1 Linux and Hardware Compatibility


    WWW: http://www.tdukeofurl.org/


    In days gone by, Linux enthusiasts had to piece together computer systems from
    individual components, since the salesmen at computer stores had never even heard
    of Linux or the free software movement. But no more. many dealers sell complete
    systems with Linux pre-installed, including corporations like Dell Computers and
    IBM¹.


    The Duke of URL reviews the latest hardware as it performs with Linux. "Linux
    Buyer’s Guide" feature lists current hardware that works well on a Linux-based
    system, and it gives sample configurations (with sites and links to vendors) for
    putting together a complete system—from low-budget system to a blazing, dual-processor
    rig.


    Since Linux runs on many different computers and supports a wide range of hardware,
    and everyone has different needs, I won''t make too many recommendations as to
    which specific hardware to buy (Systems change too fast for such a list to be
    useful, anyway).


    To find out how your hardware will work under Linux, try the following:


    +   - Read the Linux Hardware Compatibility HOWTO (see Recipe 2.8.6 [Reading System
    Documentation and Help Files], page 32), an up-to-date list of hardware that is
    compatible with Linux.

    - Visit the Linux Hardware Database (http://lhd.datapower.com/) and Hardware-Net
    (http://www.linuxhardware.net/) sites, which provide reviews and information about
    hardware that works with Linux.


    > ¹ For a complete list, visit the Linux Documentation Project (http://linuxdoc.org/)
    Web site.'
  merge: -1
  pgno: 382
