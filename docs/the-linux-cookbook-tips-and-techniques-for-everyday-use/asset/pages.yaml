- img_proc: true
  md: '# 10.6.1 Writing Text to Files


    Sometimes, it''s too much trouble to call up a text editor for a particular job—you
    just want to write a text file with two lines in it, say, or you just want to
    append a text file with one line. There are ways of doing this kind of micro-editing
    jobs without a text editor.


    To write a text file without using a text editor, redirect the standard output
    of cat to the file to write. You can then type your text, typing `C-d` on a line
    of its own to end the file. This is useful when you want to quickly create a small
    text file, but that is about it: usually, you open or create a text file in a
    text editor, as described in the previous sections in this chapter.


    +   To make a file. `novels`, with some text in it, type:


    ```

    $ cat > novels

    This Side of Paradise

    The Beautiful and Damned

    The Great Gatsby

    Tender is the Night

    C-d

    $

    ```


    In this example, the text file `novels` was created and contains four lines of
    text (the last line with `C-d` is never part of the file).


    Typing text like this without an editor will sometimes do in a pinch bit, but
    if you make a mistake, there is not much recourse besides starting over—you can
    type `C-u` to erase the current line, and `C-c` to abort the whole thing and not
    write the text to a file at all, but that''s about it.


    # 10.6.2 Appending Text to a File


    To add text to a text file without opening the file in a text editor, use `cat`
    with the append operator, `>>`. (Using `>` would overwrite the file.)


    +   To add a line of text to file `novels`, type:


    ```

    $ cat >> novels

    The Last Tycoon

    C-d

    ```


    In this example, no files were specified to `cat` for input, so `cat` used the
    standard input: then, one line of text was typed, and this was appended to file
    `novels`; the file used in the example of the previous recipe. So now this file
    would contain the following:


    This Side of Paradise

    The Beautiful and Damned

    The Great Gatsby

    Tender is the Night

    The Last Tycoon'
