  md: '300 The Linux Cookbook: Tips and Techniques for Everyday Use


    +   - To output the sequence of numbers from one to seven, type:

    $ seq 7 RET


    To output the sequence of numbers from one to another, give those numbers as arguments.


    +   - To output the sequence of numbers from two to six, type:

    $ seq 2 6 RET


    To specify an increment other than one, give it as the second argument, between
    the starting and ending number.


    +   - To output the sequence of numbers from -1 to 14, incrementing by 3, type:

    $ seq -1 3 14 RET


    Use the ''-w'' option to pad numbers with leading zeros so that they''re all output
    with the same width.


    Specify a separator string to be output between numbers as an argument to the
    ''-s'' option: the default is a newline character, which outputs each number in
    the sequence on its own line.


    +   - To output the sequence of numbers from 1 to 999, incrementing by 23, with
    numbers padded with zeros so that they''re all of equal width, type:

    $ seq -w 9 23 999 RET


    +   - To output the sequence of numbers from 1 to 23, with a space character between
    each, type:

    $ seq -s '' '' 1 23 RET


    To pass a sequence of numbers as arguments to a command, pipe the output of it
    using a space character as a separator.


    +   - To concatenate all the files in the current directory, whose names are numbers
    from 25 through 75, into a new file called ''selected-mail'', type:

    $ cat ''seq -s " " 25 75'' > selected-mail RET


    # 28.4 Finding Prime Factors


    The factor tool calculates and outputs the prime factors of numbers passed as
    arguments.


    +   - To output the prime factors of 2000, type:


    ```

    $ factor 2000 RET

    2000: 2 2 2 2 5 5 5

    ```


    NOTE: If no number is given, factor reads numbers from standard input; numbers
    should be separated by space, tab, or newline characters.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 28.5 Converting Numbers


    The following recipes are for converting numbers in various ways.


    # 28.5.1 Converting an Amount between Units of Measurement


    ```

    Debian: ''units''

    WWW: http://www.gnu.org/software/units/units.html

    ```


    Use the tools to convert units of measurement between scales. Give two quoted
    arguments: the number and name of the units you have, and the name of the units
    to convert. It outputs two values: the name of the second units you have, and
    how many of the second kind of unit can make up the quantity of the first that
    you''ve specified.


    +   - To output the number of ounces in 50 grams, type:


    ```

    $ units ''50 grams'' ''ounces'' RET

    * 1.7636981

    / 0.56699046

    $

    ```


    In this example, the output indicates that there are about 1.7636981 ounces in
    50 grams, and by conversely, one ounce is about 0.56699046 50 times.


    The units tool understands a great many of units—from Celsius and Fahrenheit to
    pounds, hectares, the speed of light, and a "baker’s dozen." All understood units
    are kept in a text file database; use the ''-V'' option to output the location
    of this database on your system, which you can then peruse or search through to
    see the units version supports.


    +   - To determine the location of the units database, type:


    ```

    $ units -V RET

    units version 1.55 with readline, units database in

    /usr/share/misc/units.dat

    $

    ```


    In this example, the units database is located in the file ''/usr/share/misc/units.dat'',
    which is the file to peruse to list all of the units data.


    # 28.5.2 Converting an Arabic Numeral to English


    Debian: ''bsdgames''


    Use number to convert Arabic numerals to English. Give a numeral as an argument
    with no argument. number reads a numeral from the standard input.


    +   - To output the English text equivalent of 100,000, type:


    ```

    $ number 100000 RET

    ```'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 28.6 Other Math Tools


    The following table lists some of the other mathematics tools available for Linux.
    It is by no means a complete list.


    | TOOL | DESCRIPTION |

    |---|---|

    | calc | calc is a scientific calculator tool for Emacs. Debian: ''calc'' |

    | dc | Like bc, the dc tool is an arbitrary-precision calculator language, but
    it is a reverse-polish calculator, where numbers are pushed on a stack. When you
    give an arithmetic operation symbol, dc pops numbers off the stack for their operands,
    and then it pushes the evaluation on the stack. Debian: ''dc'' |

    | dome | Richard J. Bono''s dome is a geodesic math tool for calculating the properties
    of a geodesic dome symmetry triangle—it can calculate chord factors, vertex coordinates,
    and topological abundance of various dome types, including “Buckyball” formations
    and elliptical geodesics. Debian: ''dome'' WWW: http://www.cris.com/~rjbono/html/domes.html
    |

    | gnucash | GCash is an intuitive personal finance application. Use it for managing
    finances, including bank accounts, stocks, income, and expenses; it’s “based on
    professional accounting principles” to ensure accuracy in computation and reporting.
    Debian: ''gnucash'' WWW: http://www.gnucash.org/ |

    | numeric | Gnumeric is the GNOME spreadsheet application. It is powerful, and
    somewhat reminiscent of Excel. Debian: ''numeric'' WWW: http://www.gnu.org/software/numeric/numeric.html
    |

    | gnuplot | The gnuplot tool can be used for data visualization, making 2-D and
    3D graphs, and plotting functions. Debian: ''gnuplot'' WWW: http://ftp.gnu.org/pub/gnu/gnuplot/
    |

    | oleo | GNU Oleo is a spreadsheet application. It can run in both X and the console,
    has Emacs-like bindings, and can generate PostScript output. Debian: ''oleo''
    WWW: http://www.gnu.org/software/oleo.html |

    | sc | sc is a small spreadsheet tool that runs in the console; it provides formulas
    and other basic features you would expect from a minimal spreadsheet.'
  merge: -1
