  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    $ echo MAIL


    Usually, the INBOX location is in the ''/var/spool/mail/'' directory, and has
    the same name as your username—so if your username is mrs, your INBOX is likely
    ''/var/spool/mail/mrs''.


    You shouldn''t directly edit this file, because doing so can inadvertently cause
    you to lose incoming mail.


    To see if you have any mail waiting in your INBOX, type mail. If you don''t have
    any mail, mail will indicate this: if you do have mail waiting, mail outputs a
    list of message headers, one per message, containing the status of the message
    (''N'' for new messages, blank for previously read messages), the message, the
    name of the sender, the date and time the message was received, and the number
    of lines and characters in the message.


    +   - To see if you have mail, type:


    ```

    $ mail

    Mail version 8.1 6/93. Type ? for help.

    >/var/spool/mail/m: 3 messages 3 new

    >N 1 mrs Mon Sep 6 17:29 13/345 "Re: A modest proposal"

    >N 2 Ray Tue Sep 7 04:20 15/694 "Latest news"

    >N 3 lisa@example Tue Sep 7 09:35 19/869 "Re: Hello"

    ```


    In this example, the user has three messages waiting—one from mrs, one from Ray,
    and one from lisa@example.com.


    The mail prompt is an ampersand (''&'') character; from there, you can read, delete,
    reply to, and save messages.


    When you type at the ''&'' prompt, mail outputs the next unread message to the
    screen. You can also type a number to output that message.


    +   - To read the next unread message in mail, type:


    +   - To read message number three in mail, type:


    There are two ways to exit mail: type q to exit mail and apply the deletion commands
    you have given, if any, to your INBOX; type x to exit mail and revert the state
    of your INBOX to before you ran mail.


    +   - To exit and revert your INBOX to its state before you started mail, type:


