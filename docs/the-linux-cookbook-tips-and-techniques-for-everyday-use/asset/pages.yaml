  md: '# Chapter 9: Viewing Text


    /pattern Search forward through the file for lines containing *pattern*.


    ?pattern Search backward through the file for lines containing *pattern*.


    < Move to beginning of the file.


    > Move to end of the file.


    h Display a help screen.


    q Quit viewing the file and exit *less*


    # 9.2 Outputting Text


    The simplest way to view text is to output it to standard output. This is useful
    for quickly looking at part of a text, or for passing part of a text to other
    tools in a command line.


    Many people use *cat* to view a text, especially if it is a very small file. To
    output all of a file''s contents on the screen, use *cat* and give the file name
    as an argument.


    This isn''t always the best way to parse or read text—a very large text will scroll
    off the top of the screen, for example—but sometimes the simple outputting of
    text is quite appropriate, such as when you just want to output one line of a
    file, or when you want to output several files into one new file.


    This section describes the tools used for such purposes. These tools are best
    used as filters, often at the end of a pipeline, outputting the standard input
    from other commands.


    **NOTE:** Tools and methods for outputting text for printing, such as outputting
    text in a format, are described in Recipe 15.2 [Converting Plain Text for Output],
    page 179.


    # 9.2.1 Showing Non-Printing Characters


    Use *cat* with the ''-v'' option to output non-printing characters, such as control
    characters, in a way so that you can see them. With this, *cat* outputs those
    characters in *hat notation*, where they are represented by ''^'' and the character
    corresponding to the actual control character (for example, a bell character would
    be output as ''^G'').


    +   To parse the file *translation* with non-printing characters displayed in
    hat notation, type:


    ```

    $cat -v translation | less RET

    ```


    In this example, the output of *cat* is piped to less for viewing on the screen;
    you could have piped it to another command, or redirected to a file instead.


    To visually display the end of each line, use the ''-E'' option; it specifies
    that a ''$'' should appear after the end of each line. This is useful for determining
    whether lines contain trailing space characters.


    Also useful is the ''-T'' option, which outputs tab characters as ''-T''.


    The ''-A'' option combines all three of these options—it is the same as specifying
    ''-vET''.'
