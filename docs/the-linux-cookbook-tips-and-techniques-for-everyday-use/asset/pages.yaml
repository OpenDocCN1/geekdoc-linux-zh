- img_proc: true
  md: "# 210 The Linux Cookbook: Tips and Techniques for Everyday Use\n\nthe Image\
    \ Info. which displays information about the image file itself, including number\
    \ of colors, image depth, and resolution.\n\nThe following table describes some\
    \ of the keyboard commands that work when displaying an image in display.\n\n\
    | COMMAND | DESCRIPTION |\n| --- | --- |\n| SPC | Display the next image specified\
    \ on the command line. |\n| BKSP | Display the previous image specified on the\
    \ command line. |\n| C-q | Quit displaying the image and exit display. |\n| C-s\
    \ | Write the image to a file. |\n| < | Halve the image size. |\n| > | Double\
    \ the image size. |\n| - | Return the image to its original size. |\n| / | Rotate\
    \ image 90 degrees clockwise. |\n| \\ | Rotate image 90 degrees counter-clockwise.\
    \ |\n| ? | Open a new window with information about the image, including resolution,\
    \ color depth, format, and comments, if any. |\n| h | Toggle a horizontal mirror\
    \ image. |\n| v | Toggle a vertical mirror image. |\n\nNOTE: display can also\
    \ be used to view images on the World Wide Web—see Recipe 31.2 [Viewing an Image\
    \ from the Web], page 330.\n\n# 17.2.1 Browsing Image Collections in X\n\nThe\
    \ display tool offers a feature for browsing a collection of images—give 'vid:'\
    \ as the argument, followed by the file names or pattern to match them in quotes.\
    \ display makes the thumbnails of the specified images, and displays them in a\
    \ new window, which it calls a visual image directory.\n\n+   * To browse through\
    \ the image files with a '.gif' extension in the /usr/doc/imagemagick/examples/\
    \ directory, type:\n  $ display vid:/usr/doc/imagemagick/examples/*.gif RET\n\
    * To browse through all images in the current directory, type:\n  $ display vid:*\
    \ RET\n\nIn the preceding example, only those files with image formats supported\
    \ by display are read and displayed.\n\nNOTE: To open an image at its normal size,\
    \ right-click the image and choose Load: the thumbnail will be replaced by its\
    \ full-size image. To return to the thumbnail directory, right-click the image\
    \ and choose Former."
