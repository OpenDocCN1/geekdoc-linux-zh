    # 11.3.4 Checking Text for Difficult Sentences


    To output just the "difficult" sentences of a text, use style with the ''-r''
    option followed by a number; style will output only those sentences whose Automated
    Readability Index (ARI) is greater than the number you give.


    +   * To output all sentences in the file ''dissertation'' whose ARI is greater
    than the number of 20, type:


    ```

