  md: '# ### 10.6.3 Inserting Text at the Beginning of a File


    WWW: http://dsl.org/comp/tinyutils/


    Inserting text at the *beginning* of a text file without calling up a text editor
    is a bit trickier than appending text to a file''s end — but it is possible.


    To insert one or more lines of text at the beginning of a file, use *ins*. Give
    the name of the file in which to insert text as an argument; *ins* will read lines
    of text from the standard input and insert them at the beginning of the file.
    (It works by opening the file in *ed*, a simple line editor.)


    Give the EOF—that is, *C-d* on a line by itself to signify the end of the lines
    of text to insert.


    +   - To insert several lines of text at the beginning of the file ''novels'',
    type:


    ```

    $ ins novels RET

    The Novels of F. Scott Fitzgerald RET

    -------------------------------------- RET

    C-d

    $

    ```


    This command inserts two lines of text at the beginning of *novels*, the file
    used in the previous examples in this section. This file would now contain the
    following:


    The Novels of F. Scott Fitzgerald

    --------------------------------


    This Side of Paradise

    The Beautiful and Damned

    The Great Gatsby

    Tender is the Night

    The Last Tycoon


    # ### 10.7 Including Text Files


    Debian: `m4`


    File *inclusion* is where the contents of a file can be included at a particular
    place within some other file, just by specifying the file''s name at that place
    in the other file.


    This is useful if you want or to frequently rearrange divisions or sections of
    a document, if you need to keep a document in more than one arrangement, or if
    you have some sections of text that you frequently insert in more than one document.
    For these situations, you can keep each section in a separate file and build an
    *include* file that contains the file names for the various sections in the order
    you want to generate that file.


    To include a file in a text file, specify the file to be included on a line of
    its own, like this:


    ```

    include(file)

    ```'
