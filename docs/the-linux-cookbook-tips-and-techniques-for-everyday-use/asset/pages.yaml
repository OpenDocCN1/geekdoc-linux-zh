    \ it mails it to you\n\nIf you add this line to your 'crontab' file (if you don't\
    \ have one, just put this in a text file called 'crontab' somewhere in your home\
    \ directory):\n\n45 05 * * 1-5 calendar | mail -s 'Your Appointments' joe@example.org\n\
    The '45 05 * * 1-5*' these commands will be run at 5:45 a.m. on weekday.\n\nThe\
    \ rest of the line is the series of actual commands that run: the calendar tool\
    \ is on your personal calendar file, and if there is any output, it is mailed\
    \ to joe@example.com (replace that with your actual email address, or with your\
    \ username on your local system if you check mail there)\n\nAdd this new crontab\
    \ entry to the cron schedule by running the crontab tool with the name of your\
    \ 'crontab' file as an argument.\n\n+   To add the new entry in the file 'crontab'\
    \ to the cron schedule, type:\n  $ crontab RET\n\n> NOTE: The name of the command,\
    \ crontab, is the same as the file. 'crontab'.\n\n# 27.5 Contact Managers\n\n\
    Loosely put, a contact manager is a piece of software that helps you track of\
    \ information about people you may need to contact in the future. In the past,\
    \ people often called the physical embodiment of these things a 'rodlex,' which\
    \ incidentally was a brand name for the Cadillac of contact managers, the circular\
    \ Rolodex file sat atop the desk of every successful 20th century businessman.\
    \ I hear that many people use them today; the following recipes show how it be\
    \ done in Linux with less desk space and faster search times.\n\n# 27.5.1 Keeping\
    \ a Free-Form Address List\n\nThe simplest way to keep names and addresses in\
    \ Linux is to keep them in a text file as a free-form address list: to find an\
    \ entry, use the search capabilities of tools like grep, less, and Emacs.\n\n\
    This method is useful when you need to keep track of name and address information\
    \ of many parties, and dont always keep the same kind of information for each\
    \ - sometimes a name and phone number, sometimes its a mailing address, sometimes\
    \ a name and email address. With a free-form address list, each entry contains\
    \ whatever information you have in the format you want.\n\nSeparate the entries\
    \ with a delimiter line of your preference. I happen to use '###', but you can\
    \ use whatever characters you are comfortable with—just make a combination that\
    \ won't appear in the text for any of the entries themselves.\n\nFor example,\
    \ suppose you have a text file, 'rolo', containing three entries:"
