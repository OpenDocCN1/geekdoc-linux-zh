  md: "# Chapter 5: Files and Directories\n\nThis tool \"touches\" the files you give\
    \ as arguments. If a file does not exist, it creates it; if the file already exists,\
    \ it changes the modification timestamp on the file to the current date and time,\
    \ just as if you had used the file.\n\n**NOTE:** Often, you make a file when you\
    \ edit it, such as in a text or image or sound editor; in that case, you don't\
    \ need to make the file first.\n\n# 5.1.2 Making a Directory\n\nUse `mkdir` (\"\
    make directory\") to make a new directory, giving the path name of the new directory\
    \ as an argument. Directory names follow the same conventions as used with other\
    \ files—that is, no spaces, slashes, or other unusual characters are recommended.\n\
    \n+   - To make a new directory 'work' in the current working directory, type:\n\
    \  `mkdir work`\n- To make a new directory 'work' in the '/tmp/' directory, type:\n\
    \  `mkdir /tmp/work`\n\n# 5.1.3 Making a Directory Tree\n\nUse `mkdir` with the\
    \ '-p' option to make a subdirectory and any of its parents that do not already\
    \ exist. This is useful when you want to make a fairly complex directory tree\
    \ from scratch, and you don't have to make each directory individually.\n\n+ \
    \  - To make the 'work/completed/2001' directory—a subdirectory of the 'completed'\
    \ directory, which in turn is a subdirectory of the 'work' directory in the current\
    \ directory, type:\n  `mkdir -p work/completed/2001`\n\nThis makes a '2001' subdirectory\
    \ in the directory called 'completed', which in turn is in a directory called\
    \ 'work' in the current directory; if the 'completed' or the 'work' directories\
    \ do not already exist, they are made as well (if you know that 'work' and 'completed'\
    \ both exist, the above command works without the '-p' option).\n\n# 5.2 Changing\
    \ Directories\n\nUse `cd` to change the current working directory; give the name\
    \ of the new directory as an argument.\n\n+   - To change the current working\
    \ directory to 'work', a subdirectory in the current directory, type:\n  `cd work`\n\
    - To change to the current directory's parent directory, type:\n  `cd ..`\n\n\
    You can also give the full path name of a directory.\n\n+   - To change the current\
    \ working directory to '/usr/doc', type:\n  `cd /usr/doc`\n\nThis command makes\
    \ '/usr/doc' the current working directory."
