    Because of differences in display hardware, the brightness of an image may vary
    from one computer system to another. For example, images created on a Macintosh
    usually appear darker on other systems. When you adjust the brightness of an image
    it is called gamma correction.


    To adjust the brightness of an image, give the numeric level of correction to
    apply as an argument to the ''-gamma'' option. Most PC displays have a gamma value
    of 2.5, while Macintosh displays have a lower gamma value of 1.4.


    +   • To set the gamma correction of the image ''rainbow.jpeg'' to .8, type:


    ```

