  md: "# Chapter 10: Text Editing\n\nFor example, the find-file function prompts for\
    \ the name of a file and opens a copy of the file in a new buffer; its keyboard\
    \ accelerator is C-x C-f (you can keep CTRL depressed while you press and release\
    \ the X P keys).\n\nYou can run any Emacs by typing M-x followed by the function\
    \ name and pressing RET.\n\n+   - To run the find-file function, type:\n  - M-x\
    \ find-file RET\n\nThis command runs the find-file function, which prompts for\
    \ the name of a file and opens a copy of the file in a new buffer.\n\nType C-g\
    \ in Emacs to quit if you make a mistake when typing a command, this is useful\
    \ to cancel and abort the keyboard input.\n\nNow that we have run through the\
    \ essential Emacs terminology, I will show you how to edit the program—just type\
    \ C-x C-c.\n\nEmacs can have more than one buffer open at once. To switch between\
    \ buffers, type C-x C-b, give the name of the buffer to switch, followed by RET;\
    \ alternatively, type RET without a buffer name to switch to the last buffer you\
    \ have visited. (Viewing a buffer in Emacs is calling the buffer).\n\n+   - To\
    \ switch to a buffer called 'rolo', type:\n  - C-x C-b rolo RET\n\nA special buffer\
    \ called '*scratch*' is for notes and things you don't want to save; it always\
    \ exists in Emacs.\n\n+   - To switch to the '*scratch*' buffer, type:\n  - C-x\
    \ C-b *scratch* RET\n\nAny file names you give as an argument emacs will open\
    \ in separate buffers:\n  $ emacs todo /usr/local/src/nirvarna/README RET\n\n\
    (You can also make new buffers and open files in buffers, latter of course.)\n\
    \nEmacs comes with an interactive, self-paced tutorial that teaches you how to\
    \ go through it is one of the best things you can do in your computing career—even\
    \ if you decide that you don't like Emacs very much, a many other applications\
    \ use Emacs-like keyboard commands and heuristics, so familiarizing yourself with\
    \ them will always pay off.\n\nTo start the tutorial at any time when you are\
    \ in Emacs, type C-h t.\nIncidentally, C-h is the Emacs help: all help-related\
    \ commands begin with this key. For example, to read the Emacs FAQ, type C-h F,\
    \ and to run the Info documentation browser (which contains the GNU Emacs Manual),\
