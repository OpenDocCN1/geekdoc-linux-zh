  md: '# Chapter 32: Other Internet Services


    In this example, the host bfi.org was pinged and a total of three pings were sent
    and received before the user typed C-c to interrupt it. As long as the ping lines
    are output, you know that the other machine is connected to the Internet (or at
    least the same network that your localhost is connected to).


    You really don''t need to analyze the information on each line of ping message
    - the only useful information is the number at the end of the line, which tells
    you how many milliseconds it took to go out to the Internet, or "ping" and that,
    come back. The quicker the binger that are four or five digits (or greater) mean
    a slower connection between the two machines. When you interrupt the ping, some
    statistics are output, the minimum, average, and maximum number of milliseconds
    it took to ping the guest host. In the example above, the high was 190 and the
    low was 159.9 milliseconds, with an average of 170.1.


    NOTE: If your system is not online, ping will report that either the network is
    unreachable or the host is not found.


    # 32.4.2 Checking Whether a User Is Online


    Use finger to check whether or not a given user is online. Give as an argument
    the username of the user (if on the local system) or their email address (on a
    remote system). This is called "fingering" as user.


    If the system they have finger enabled (most Unix-based systems should), the command
    will tell you: the date and time when they last logged in; whether or are not
    currently logged in; their full name; their office room and telephone number;
    their home directory; what they shell; whether or do not have have mail waiting;
    the last time they read mail; and, finally, their "plan," as described below.


    +   To finger the user bradley@ap.spl.org: type:


    ```

    $ bradley@ap.spl.org RET

    [ap.spl.org]

    Login: bradley

    Directory: /spl/bradley

    Shell: /bin/tcsh

    Last login Jan 20 16:38 1999 (PST) on ttypb from zais.pair.com

    No mail.

    Plan:\To learn how to use Linux and GNU software.

    $

    ```


    In this example, the user bradley on the system at ap.spl.org is not currently
    logged in, logged on 20 January, and uses the tsch shell.


    NOTE: On Unix-based systems, you can put information in a hidden file in your
    home directory called ''.plan'', and that text will be output when someone fingers
    you. Some people elaborate information in their ''.plan'' files; in the early
    1990s, it was very much no vogue to have long, rambling .plans. Sometimes, people
    put information in their ''.plan''.


    > 1 "I said that we made it a name that sounds like a sonar makes, inspired by
    the whole principle of echo-location," said the original author of ping. Mike
    Russ. He died in an automobile accident in November 2000.'
