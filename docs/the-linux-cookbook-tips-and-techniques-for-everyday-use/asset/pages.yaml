  md: 'from around the globe contributed to his free software project. The Linux software
    was immensely extended and improved so that the Linux-based system of today is
    a complete, modern operating system, which can be used by programmers and non-programmers
    alike; hence this book.


    # 1.1.5 What''s Debian?


    WWW: http://debian.org/


    It takes more than individual software programs to make something that we can
    use on our computers—someone has to put it all together. It takes time to assemble
    the pieces into a cohesive, usable collection, and test it all, and then keep
    up to date with the new developments of each piece of software (a small change
    in any one which may introduce a new software dependency problem or conflict with
    the rest). A Linux distribution is such an assemblage. You can do it yourself,
    and "roll your own" distribution—since it''s all free software, anyone can add
    to or remove from it and calling the resulting conception their own. Most people,
    however, choose to leave the distribution business to the experts.


    For the purposes of this book, I will assume that you are using the Debian GNU/Linux
    distribution, all of the major distributions, is the only one designed and assembled
    in the same manner that the Linux kernel and most other free software is written—by
    individuals.


    And I say "Linux" anywhere in this book (including the title), unless noted. I
    am not referring to the bare kernel itself, but to the entire free software system
    as a whole. This is often called "GNU/Linux."⁶


    There are many distributions, and some of them are quite acceptable—many users
    swear by Red Hat Linux, for example, which is certainly popular, and reportedly
    to easily. The SuSE distribution is well-received in Europe. When people speak
    of Debian, Red Hat, SuSE, and the like in terms of Linux, they are talking about
    the specific distribution of Linux and related software, as assembled and reassembled
    by companies or organizations (see Appendix B Linux Resources on the Web, page
    367). The core of the distributions are the same—they''re all the Linux kernel,
    the GNU Project software, and various other free software—but each distribution
    has its own packaging schemes, defaults, and configuration methods. It is by no
    means to install and use any of these other distributions, and every recipe in
    this book should work with all of them (with the exception of variations that
    are specific to Debian systems, and are labelled as in the text).


    In Debian''s early days, it was referred to as the "hacker''s distro," because
    it could be very difficult for a newbie to install and manage. However, this has
    changed—any Linux newbie can install and use today''s Debian painlessly.


    NOTE: I recommend Debian because it is non-corporate, openly developed, widely
    robust (the standard Debian CD-ROM set comes with more than 2,500 software packages!),
    and it is entirely committed to free software by design (yes, there are distributions
    which are not).


    ⁶ The GNU Project''s kernel is called Hurd, and is still in development: Debian''s
    experimental distribution of a Hurd-based free software system, not yet publicly
    released, is called Debian GNU/Hurd.'
