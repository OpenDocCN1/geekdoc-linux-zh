  md: '# Chapter 30: Email


    # 30.4 Mail Attachments


    Debian: ''metamail''

    WWW: http://bmrc.berkeley.edu/~trey/emacs/metamail.html


    “Multipurpose Internet Mail Extensions”) is an Internet standard for encoding
    and attaching files to mail messages. It''s used when sending image, audio, or
    other non-plain-text data via email.


    Normally, you read and send MIME mail with your MUA. The recipes which show how
    to send and receive MIME mail on the command line, are useful when you just use
    the mail tool to read and send occasional mail with an attachment, and the built-in
    methods for manipulating MIME mail in any reasonable MUA will invariably be easier
    and more convenient than the techniques described here (see Recipe 30.6 [Picking
    the Right Mail Application], page 325).


    # 30.4.1 Reading a Mail Attachment


    To read a mail attachment, write the message to the file and run metamail with
    the file name as an argument. metamail lists each attachment and prompts you about
    whether it should display the attachment, write it to a file, or skip.


    To read a mail attachment, type:


    ```

    $ mail [RET]

    Mail version 8.1 6/6/93. Type ? for help.

    >/var/spool/mail/m 1 messages 1 new

    >N 1 Photo Dept. Mon Feb 12 14:37 23180920 "New Images"

    & wi image.mail [RET]

    >"image.mail" [New file]

    & x [RET]

    $ metamail image.mail [RET]

    ```


    In this example, the dept tool was used to open the INBOX and write the message
    to a file called ‘image.mail’; then, metamail was run with the file name as an
    argument.


    # 30.4.2 Sending a Mail Attachment


    To send a file as an email attachment, use metasend. It prompts for the values
    to use in the ‘To:'', ‘Subject:'', and ‘CC:'' header fields, plus the following
    values for each MIME attachment: its ‘Content-type:'' field, which describes the
    kind of attachment contains; the file name; and the type of encoding to use, if
    any (usually one is recommended).


    +   * To mail the JPEG file ‘dream.jpeg’ in the current directory to the address
    dali@example.org, type:'
