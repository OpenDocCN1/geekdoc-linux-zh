    \ comparing passages of text in files, but that's not the only way you can use\
    \ them.\n\n# 8.4.1 Determining Whether Two Files Differ\n\nUse cmp to determine\
    \ whether or not two files differ. It takes the names of two files as arguments,\
    \ and if the files contain the same data, cmp outputs nothing. However, if the\
    \ files differ, cmp outputs the byte position and line number in the files where\
    \ the first difference occurs.\n\n+   - To determine the files 'master' and 'backup'\
    \ differ, type:\n  - $ cmp master backup RET\n\n# 8.4.2 Finding the Differences\
    \ between Files\n\nUse diff to compare two files and output a difference report\
    \ (sometimes called a “diff\") containing the text that differs between two files.\
    \ The difference report is formatted so that other tools (namely, patch - see\
