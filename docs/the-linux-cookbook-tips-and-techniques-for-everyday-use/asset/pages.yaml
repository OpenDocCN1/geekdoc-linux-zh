  md: "# 14 Searching Text\n\nIt's quite common to search through text for a given\
    \ sequence of characters (such as a word or phrase), a string, or even for a pattern\
    \ describing a set of such strings; this chapter contains recipes for doing these\
    \ kind of things.\n\n#  14.1 Searching for a Word or Phrase\n\nThe primary command\
    \ used for searching through text is the right frogle-sounding tool called grep\
    \ (the origin of its name is explained in Recipe 14.2 [Regular Expressions—Matching\
    \ Text Patterns]), page 166, however its advanced usage is discussed). It outputs\
    \ lines of its input that contain a given string or pattern.\n\nTo search for\
    \ a word, give that word as the first argument. By default, grep searches standard\
    \ input: give the name of a file as the second argument.\n\n+   * To output lines\
    \ in the file `catalog` containing the word 'CD', type:\n  * `grep CD`\n* To search\
    \ for a phrase, specify it in quotes.\n* To output lines in the file `catalog`\
    \ containing the word 'Compact Disc', type:\n  * `grep 'Compact Disc' catalog`\n\
    \nThe preceding example outputs all lines in the file `catalog` that contain the\
    \ exact string 'Compact Disc'; it will not, however, lines containing 'compact\
    \ disc' or any variation on the case of letters in the search pattern. The '-i'\
    \ option to specify that matches to be made regardless of case\n\n+   * To output\
    \ lines in the file `catalog` containing the string 'compact disc' regardless\
    \ of the case of its letters, type:\n  * `grep -i 'compact disc' catalog`\n\n\
    This command outputs lines in the file `catalog` containing any variation of the\
    \ pattern 'compact disc', including 'Compact Disc', 'COMPACT DISC', and 'compact\
    \ disc'.\\One thing to keep in mind is that grep only matches patterns that appear\
    \ on a single line, so in the preceding example, if one line in `catalog` ends\
    \ with the word 'compact' and the next begins with 'disc', grep will not match\
    \ each line. There is a way around this with grep (see Recipe 14.2.8 [Finding\
    \ Regards of Spacing], page 170), or you can search the text in Emacs (see Recipe\
    \ 14.6.2 [Searching for a Phrase in Emacs], page 174).\n\nYou can specify more\
    \ than one file to search. When specify multiple files, each match that grep outputs\
    \ is preceded by the name of the file it's in (and you can suppress this with\
