  md: "# Chapter 23: Editing Sound Files\n\n# 23.2.1 Changing the Amplitude of a Sound\
    \ File\n\nTo change the volume or amplitude of a sound file, use sox with the\
    \ '-v' option, giving the volume level as an argument. Levels below 1.0 lower\
    \ the amplitude, and higher numbers raise it.\n\n+   - To raise the volume of\
    \ file 'old.wav' two < and write the output to 'new.wav', type:\n  $ sox -v3 old.wav\
    \ new.wav\n- To lower the volume of file 'old.wav' by half and write the output\
    \ to 'new.wav', type:\n  $ sox -v.5 old.wav new.wav\n\nUse sox with the 'stat'\
    \ option and '-v' to determine the largest possible value that can be used before\
    \ distortion or clipping (it performs a statistical analysis on the file and outputs\
    \ a numeric value). This value comes in handy when you want to raise a file's\
    \ volume as high as possible without ruining its fidelity.\n\n+   - To raise the\
    \ volume of file 'quit.cdr' as high as possible without distortion, type:\n\n\
    ```\n$ sox quit.cdr loud.cdr stat -v\n3.125\n$ sox -v 3.125 quit.cdr loud.cdr\
    \ -v\n```\n\nThe preceding example writes a new file, 'loud.cdr'.\n\n# 23.2.2\
    \ Changing the Sampling Rate of a Sound File\n\nTo change the sampling rate of\
    \ a sound file, use the '-r' option followed by the sample rate in, Hertz. Like\
    \ the '-v' option, specify this before giving the name of the output file.\n\n\
    +   - To change the sampling rate of file 'old.wav' to 7,000 Hz, and write the\
    \ output to 'new.wav', type:\n  $ sox old.wav -r 7000 new.wav\n\n# 23.2.3 Adding\
    \ Reverb to a Sound File\n\nTo add reverb to a sound file, use the 'reverb' effect.\
    \ 'reverb' takes three arguments: the volume of the output ('-gain-out'), the\
    \ time (in milliseconds) of reverb, and the length (in milliseconds) of delay.\
    \ You can specify more than one; the more you specify, the more of an overlapping\
    \ echo the reverb will have.\n\n+   - To add a basic reverb to file 'old.wav'\
    \ and write the output to 'new.wav', type:\n  $ sox old.wav new.wav 5 1000 100\n\
    - To add a space, echoing reverb to file 'old.wav' and write the output to 'new.wav',\
    \ type:\n  $ sox old.wav new.wav reverb 1 1000 333 333 333\n\nNOTE: This last\
    \ example makes a sound similar to the recordings of the band Flying Saucer Attack.\
    \ You know who they, don't you?"
  merge: -1
