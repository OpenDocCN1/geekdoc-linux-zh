    ```


    NOTE: You can read Info documentation directly from the Emacs editor; you type
    C-h from Emacs to use the same commands as in the standalone info tool (see Recipe
    10.2.1 [Getting Acquainted with Emacs], page 121).


    The Emacs ''incremental'' search command, C-s, also works in info: it''s a very
