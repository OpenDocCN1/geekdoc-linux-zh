  md: '# Chapter 19: Importing Images


    To list the available resolutions supported by a particular device, use the `--help`
    option along with the `-d` option followed by its device name.


    +   To list available options supported by the device listed in the previous example,
    type:

    `scanimage --help -d ''umax:/dev/sgb''`


    **NOTE:** For all scanimage commands, specify the scanner device you want to use
    by including the `-d` option with the device name.


    # 19.2.2 Testing a Scanner


    To run diagnostic tests on a scanner to make sure that it can be properly read
    from, use scanimage with the `--test` option:


    +   To test the UMAX scanner listed previously, type:

    `scanimage --test ''umax:/dev/sgb''`


    # 19.2.3 Scanning an Image


    Debian: `netpmbm`nWWW: `http://www.debian.org/Packages/stable/graphics/netpmbm.html`


    Use `scanimage` to scan an image. Most scanners let you specify the `x` and `y`
    values, in pixels, for the image size to scan, starting from the top-left corner
    of the scanner bed. Give these coordinates as arguments to `-x` and `-y` options.
    Also, give an argument to the `--resolution` option to specify the scan resolution,
    given in dpi (“dots per inch”). Common resolution values include 72, 120, 300,
    and 600 dpi; 72 dpi is the most popular resolution for use on the Web or, 204
    dpi is often used for images that you want to send on a fax machine.


    Scanned output is sent to standard output, to scan an image to a file, redirect
    the standard output

    `scanimage` outputs images in the PNM (“portable any”), so make sure you have
    the `netpmbm` package (installed on most Linux systems by default); it''s a useful
    collection of tools for converting and manipulating these formats. The formats
    output as follows:


    | PPM | DESCRIPTION |

    |---|---|

    | PBM | Black and white images |

    | PGM | Grayscale images |


    +   To make a 72 dpi scan of an image 200 pixels wide and 100 pixels tall, using
    the UNIX scanner from previous examples, and writing to a file called ‘scan.ppm’,
    type:

    `scanimage -d ''umax:/dev/sgb --resolution 72 -x 200 -y 100 > scan.ppm`'
