  md: '# Chapter 3: The Shell


    To find the job number of a job you have running, list your jobs (see Recipe 3.3.4
    [Listing Your Jobs], page 42).


    The following sections describe the various commands for managing jobs.


    # 3.3.1 Suspending a Job


    Type C-z to suspend or stop the foreground job—useful when you want to do something
    else in the shell and return to the current job later. The job stops until you
    bring it back to the foreground or make it run in the background (see Recipe 3.3.3
    [Putting a Job in the Foreground], page 42 and see Recipe 3.3.2 [Putting a Job
    in the Background], page 41).


    For example, if you are reading a document in info, typing C-z will suspend the
    info program and return you to a shell prompt where you can do something else
    (see Recipe 2.8.5 [Using the GNU Info System], page 31). The shell outputs a line
    giving the job number (in brackets) of the job, the text ''Stopped'' to indicate
    that the job has stopped, and the command line itself, as shown here:


    ```

    [1]+ Stopped    info -f cookbook.info

    ```


    In this example, the job number is 1 and the command that stopped is ''info -f
    cookbook.info''. The ''+'' character next to the job number indicates that this
    is the most recent job.


    If you have stopped jobs when you log out, the shell will tell you this instead
    of logging you out:


    ```

    $ logout RET

    There are stopped jobs.

    $

    ```


    At this point you can list your jobs (see Recipe 3.3.4 [Listing Your Jobs], page
    42), stop any jobs you have running (see Recipe 3.3.5 [Suspending a Job], page
    43), and then log out.


    # 3.3.2 Putting a Job in the Background


    New jobs run in the foreground unless you specify otherwise. To run a job in the
    background, end the input line with an ampersand (''&''). This is useful for running
    non-interactive programs that perform a lot of calculations.


    +   To run the command apropos shell > shell-commands as a background job, type:


    ```

    $ apropos shell > shell-commands & RET

    [1] 6575

    $

    ```


    The shell outputs the job number (in this case, 1) and process ID (in this case,
    6575), and then returns to a shell prompt. When the background job finishes, the
    shell will list the job number, the command, and the text ''Done'', indicating
    that the job has completed successfully:'
