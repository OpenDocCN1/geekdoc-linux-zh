  md: '# 332 The Linux Cookbook: Tips and Techniques for Everyday Use


    +   * To peruse the text of `http://www.sc.edu/fitgerald/winter/winter.html`,
    type (all on one line):


    ```

    $ lynx -dump

    http://www.sc.edu/fitgerald/winter/winter.html | less RET

    ```


    It''s not new convention for italicized words to be displayed in an etext inside
    underscores like `_this_`; use the `-underscore` option to output italicized text
    in this manner.


    By default, lynx annotates all hyperlinks and produces a list of footed links
    at the bottom of the screen. If you don''t add them, the `-nolisist` option and
    just the `pure text` will be returned.


    +   * To output the text, with underscores, of the previous URL, and save it to
    the file `''winter_dreams``, type (all on one line):


    ```

    $ lynx -dump -nolisist

    http://www.sc.edu/fitgerald/winter/winter.html > winter_dreams RET

    ```


    You can do other things with the pure text, like pipe to encrypt for setting it
    in a font for printing.


    +   * To print the text, with underscores, of the previous URL in a Times Roman
    font, type (all on one line):


    ```

    $ lynx -dump -nolisist -underscore

    http://www.sc.edu/fitgerald/winter/winter.html | encript -B

    - f "Times-Roman10" RET

    ```


    NOTE: To peruse the text of a URL with its HTML tags removed and no formatting
    done to the text, see Recipe 31.6 [Converting HTML to Another Format], page 39.


    # 31.3.2 Viewing a Site That Requires Authorization


    To view a site or Web page that requires registration, use lynx with the `-auth`
    option, giving arguments the username and password to use for authorization, separating
    them by a colon (`:`) character.


    +   * To view the URL `http://www.nytimes.com/archive/` with a username and password
    of `''cypherpunks`, type (all on one line):


    ```

    $ lynx -auth:cypherpunks

    http://www.nytimes.com/archive/ RET

    ```


    It''s common to combine this with the options for saving to a file, so that you
    can retrieve an annotated text file from a site that normally requires registration.


    +   * To save the URL `http://www.nytimes.com/archive/` as an annotated text file,
    `''mynews``, type (all on one line):


    ```

    $ lynx -number_links -auth=cypherpunks:cypherpunks

    http://www.nytimes.com/archive/ > mynews RET

    ```


    NOTE: The username and password you provide on the command line will be recorded
    in your shell history log (see Recipe 3.4 [Command History], page 43), and it
    will be visible to others on the system they choose to see what processsess you''re
    running (see Recipe 2.7.2 [Listing All of a User''s Processes], page 27).'
