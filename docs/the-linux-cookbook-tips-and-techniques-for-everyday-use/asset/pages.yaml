  md: "# Chapter 10: Text Editing\n\nC-x C-f file `RET` Open file in a new buffer\
    \ for editing. To create a new file that does not yet exist, just specify the\
    \ file name you want to give it. To browse through your files, type `TAB` instead\
    \ of a file name.\n\nC-left-click Display a menu of all open buffers, sorted by\
    \ major mode (works in X only).\n\n`SHIFT`-left-click Display a font selection\
    \ menu (works in X only).\n\n# 10.2.3 Making Abbreviations in Emacs\n\nAn abrev\
    \ is a word that is an *ab* of a (usually) longer word or phrase. Abbrevs exist\
    \ as a convenience to you can define abbreviations to expand to a long phrase\
    \ that is inconvenient to type, or you can define a misspelling that you tend\
    \ to expand to its correct spelling. Abbrevs only work when you have Abbrev mode\
    \ enabled.\n\n+   * To turn on Abbrev mode, type:\n  * `M-x abbrev-mode` `RET`\n\
    \nTo define an abrev, type the abrev you want to use and then type `C-x aig`.\
    \ Emacs will prompt you in the minibuffer for the text you want the abbrev to\
    \ expand to: that text and then type `RET`\n\n+   * To define `rbf` as an abrev\
    \ for `R. Buckminster Fuller`, do the following:\n  * First, type the abrev itself:\n\
    \    `rbf`\n  * Next, specify that this text is to be an abbrev; type:\n    `C-x\
    \ aig`\n  * Now type the text to expand it to: Global expansion for `rbf`: `R.\
    \ Buckminster Fuller` `RET`\n\nNow, when you type `rbf` followed by a whitespace\
    \ or punctuation character in the current buffer, that will expand to the text\
    \ `R. Buckminster Fuller`. To save the abbreviations you have defined so that\
    \ you can use them later, use the `write-abbrev-file` function. This saves all\
    \ of the abbreviations currently defined to a file that you can read in a Emacs\
    \ session. (You can also open the file in a buffer and edit the abbreviations\
    \ if you like).\n\n+   * To save the abbreviations you have currently defined\
    \ to a file `/.misspelling-abbrevs`:\n  * `M-x write-abbrev-file` `RET` `/.misspelling-abbrevs`\
    \ `RET`\n\nIn an Emacs session, you can use the `read-abbrev-file` function to\
    \ define those abbreviations for that session.\n* To read the abbreviations from\
    \ the file `/.misspelling-abbrevs`, and define them for the current session, type:\n\
    \  * `M-x read-abbrev-file` `RET` `/.misspelling-abbrevs` `RET`\n\nNOTE: Emacs\
    \ mode commands are toggles. To turn off Abbrev mode `M-x abbrev-mode` `RET` in\
    \ a buffer, if you turn off Abbrev mode in that buffer later during the Emacs\
    \ session, the abbreviations will be remembered and expand again."
