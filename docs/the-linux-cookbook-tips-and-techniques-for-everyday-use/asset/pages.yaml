  md: '# PROGRAMMING LINUX GAMES


    Learn to Write the Linux Games People Play


    by LOKI SOFTWARE, INC. WITH JOHN HALL


    Programming Linux Games discusses important multimedia toolkits (including a very
    thorough discussion of the Simple DirectMedia Layer) and teaches the basics of
    game programming. Understand the state of the Linux gaming world and learn to
    write and distribute games to the Linux community.


    2001, 432 PP., $39.95 ($59.95 CDN)

    ISBN 1-886411-49-2


    ![](img/3658df520e459cc83b744521428473cf_422_0.png)


    # THE BOOK OF VMWARE


    The Complete Guide to the VMware Workstation


    by BRIAN WARD


    This guide to VMware software, which allows users to run multiple OSs simultaneously
    on a single computer, was developed with VMware, Inc. and covers device emulation;
    guest guest OS configuration; networking and file transfers; and more. The CD-ROM
    includes a demo version of VMware for Linux and Windows, and copies of all discussed
    utilities.


    NOVEMBER 2001, 350 PP. W/CD-ROM, $39.95 ($55.95 CDN)

    ISBN 1-886411-72-7


    ![](img/3658df520e459cc83b744521428473cf_422_1.png)


    # THE BOOK OF ZOPE


    How to Build and Deliver Web Applications


    by BEEHIVE


    The Book of Zope is a comprehensive introduction to this leading Open Source Web
    application server that allows developers to create and manage dynamic, Web-based
    business applications. Topics covered include DTML programming; users, roles,
    and permissions; ZClasses; ZCatalog; databases; Python programming, debugging;
    and the use of external data sources.


    SEPTEMBER 2001, 350 PP., $39.95 ($55.95 CDN)

    ISBN 1-886411-57-3


    ![](img/3658df520e459cc83b744521428473cf_422_2.png)'
  merge: -1
