  md: '# 18 Editing Images


    When you take an image file—such as one containing a digitized photograph or a
    picture drawn with a graphics program—and you make changes to it, you are editing
    an image.


    This chapter contains recipes for editing and modifying images, including how
    to convert between image file formats. It also gives an overview of other image
    applications you may find useful, including the featuresome GIMP image editor.


    # 18.1 Transforming Images


    Debian: ''imagemagick''

    WWW: http://ftp.wizards.dupont.com/pub/ImageMagick/


    Many Linux tools can be used to transform or manipulate images in various ways.
    One very useful package for both transforming images and converting between image
    formats is the netpbm suite of utilities (see Recipe 19.2 [Scanning Images], page
    230). Another is the ImageMagick suite of imaging tools, which mogify is particularly
    useful for performing command line image transforms; use it to change the size
    of, to rotate, or to reduce the colors in an image.


    mogrify always takes the name of the file to work on as an argument, and it writes
    its changes to that file. Use a hyphen (''-'') to specify the standard input,
    in which case mogrify writes its to the standard output.


    I''ll use ''phoenix.jpeg'' in the examples that follow to give you an understanding
    of how to use mogrify:


    ![](img/3658df520e459cc83b744521428473cf_238_0.png)


    NOTE: You can also perform many of the image transformations described in the
    sections interactively with the GIMP (see Recipe 18.3 [Editing Images with the
    GIMP], page 225).


    # 18.1.1 Changing the Size of an Image


    To resize an image with mogrify, use the ''-geometry'' option with the width and
    height values, in pixels, as an argument.


    +   - To resize ''phoenix.jpeg'' to 480x320 pixels, type:'
  merge: -1
  pgno: 238
- img_proc: true
  md: '```

    $ mogrify -geometry 480x320 phoenix.jpeg

    ```


    This transforms the original ''phoenix.jpeg'' file to:


    ![](img/3658df520e459cc83b744521428473cf_239_0.png)


    **NOTE:** Images scaled to a larger size will appear blocky or fuzzy.


    When mogrify resizes an image, it maintains the image''s aspect ratio, so that
    the ratio between the width and height stays the same. To force a conversion to
    a particular image size without necessarily preserving its aspect ratio, append
    the geometry with an exclamation point.


    +   - To resize ''phoenix.jpeg'' to *exactly* 480x320 pixels, regardless of aspect
    ratio, type:


    ```

    $ mogrify -geometry 640x480! phoenix.jpeg

    ```'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'This transforms the original ''phoenix.jpeg'' to:


    ![](img/3658df520e459cc83b744521428473cf_240_0.png)


    You can also specify the width or height by percentage. To decrease by a percentage,
    give the value followed by a percent sign (%). To increase by a percentage, give
    the value plus 100 followed by a percent sign. For example, to increase by 25
    percent, give ''125%''.


    +   - To increase the height of ''phoenix.jpeg'' by 25 percent and decrease its
    width by 50 percent, type:


    ```

    $ mogrify -125%x50% phoenix.jpeg RET

    ```'
  merge: -1
  pgno: 240
- img_proc: true
  md: "This transforms the original 'phoenix.jpeg' to:\n\n![](img/3658df520e459cc83b744521428473cf_241_0.png)\n\
    \n**NOTE**: To view an image at a particular scale without modifying it, use **display**;\
    \ when you resize your window, you resize the image on the screen only (see Recipe\
    \ 4.3.2 [Resizing a Window], page 58).\n\n# 18.1.2 Rotating an Image\n\nTo rotate\
    \ an image, use **mogrify** with the '-rotate' option followed by the number of\
    \ degrees to rotate by. If the image exceeds its height, follow this number with\
    \ a '>', and if the height exceeds its width, follow it with a '<'. (Since both\
    \ '<' and '>' are shell redirection operators, enclose this argument in quotes,\
    \ omitting either if the image height and width are the same).\n\n+   - To rotate\
    \ 'phoenix.jpeg', whose height exceeds its width, by 90 degrees, type:\n  `$ mogrify\
    \ -rotate '90<' phoenix.jpeg RET`\n\nThis transforms the original 'phoenix.jpeg'\
    \ to:\n\n![](img/3658df520e459cc83b744521428473cf_241_1.png)\n\n**NOTE**: After\
    \ this command, the width of 'phoenix.jpeg' now exceeds its height, so to rotate\
    \ it again use '>' instead of '<'."
  merge: -1
  pgno: 241
- img_proc: true
  md: 'Chapter 18: Editing Images


    # 18.1.3 Adjusting the Colors of an Image


    You can use mogrify to make a number of adjustments in the color of an image.
    To reduce the number of colors in an image, use the ''-colors'' option, followed
    by the number of colors to use.


    +   - To reduce the colors in ''phoenix.jpeg'' to two, type:


    ```

    $ mogrify -colors 2 phoenix.jpeg RET

    ```


    This transforms the original ''phoenix.jpeg'' to:


    ![](img/3658df520e459cc83b744521428473cf_242_0.png)


    Use the ''-dither'' option to reduce the colors with Floyd-Steinberg error diffusion,
    a popular algorithm for improving image quality during color reduction.


    +   - To reduce the colors in ''phoenix.jpeg'' to four and apply Floyd-Steinberg
    error diffusion, type:


    ```

    $ mogrify -colors 4 -dither phoenix.jpeg RET

    ```


    This transforms the original ''phoenix.jpeg'' to:


    ![](img/3658df520e459cc83b744521428473cf_242_1.png)


    Use the ''-map'' option with a second file name as an argument to read the color
    map, or the set of colors, from the second image and use them in the first image.


    +   - To change the colors in the file ''rainbow.jpeg'' to those used in the file
    ''prism.jpeg'', type:


    ```

    $ mogrify -map prism.jpeg rainbow.jpeg RET

    ```


    Use the ''-monochrome'' option to make a color image black and white.'
