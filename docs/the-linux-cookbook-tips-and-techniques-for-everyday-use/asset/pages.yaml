  md: '# # Chapter 1: Introduction


    # ## 1.1.3 What''s Open Source?


    WWW: http://www.opensource.org/

    WWW: http://www.gnu.org/philosophy/free-software-for-freedom.html


    The term open source was first introduced by free software advocates in 1998 to
    be a marketing term for “free software.” They felt that some people unfamiliar
    with the free software movement—namely, large corporations, who’d suddenly taken
    an interest in the free more than ten years’ of work that had been put into it—might
    be scared by the word “free.” They were concerned that decision-makers in these
    corporations might confuse free software with software provided free of charge,
    and in executable form only. (Free means nothing of the sort, of course; the “free”
    in “free software” has always referred to freedom, not price.)


    The Open Source Initiative (OSI) was founded to promote software that conforms
    with their public “Open Source Definition.” which was derived from the “Debian
    Free Software Guidelines” (DSFG), originally written by Bruce Perens as a set
    of software inclusion guidelines for Debian. All free software—including software
    released under the terms of the GNU General Public License—conforms with this
    definition.


    But some free software advocates and organizations, including the GNU Project,
    do not endorse the term “open source” at all, believing that it obscures the importance
    of “freedom” in this movement.


    Whether you call it free software, open source software, or something else, there
    is one fundamental difference between this kind of software and proprietary, non-free
    software and that free software always ensures that everyone is granted certain
    fundamental freedoms with respect to software.


    # ## 1.1.4 What’s Linux?


    In the early 1990s, Finnish computer student Linus Torvalds began hacking on Minix,
    a small, Unix-like operating system for personal computers then used in college
    operating systems. He decided to improve the main software component underlying
    Minix, called the *kernel*, by writing his own. (The kernel is the central component
    of any Unix-like operating system.)


    In 1991, Torvalds published the first version of this kernel on the Internet,
    calling it “Linux” (a play on both Unix and his name).


    When Torvalds published Linux, he copied the copyleft license published by the
    GNU Project, and made his software free to use, copy, and modify by anyone—provided
    any codes or variations were equally free. Torvalds also invited contributions
    by other programmers, and these contributions came; as slow at first, but as the
    Internet grew, thousands of hackers and programmers


    > ³ You can extend this “free software movement” to be part of a greater “free
    information” or “free speech” movement, to include all other kinds of free works—works
    of literature and music.


    > ⁴ Presumably, many of these used Linux now.


    > ⁵ This was not the original name, however. Torvalds had originally called it
    freak, for “free’ + ‘freak’ + the obligatory ‘-x’; while the 1990s were becoming
    the “freaky” decade (at least in fashion), more people seemed to favor “Linux,”
    and the name stuck.'
