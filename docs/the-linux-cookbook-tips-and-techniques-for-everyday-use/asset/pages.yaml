  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    # KEYS


    # DESCRIPTION


    +   - C-p: Move point up to the previous line.


    +   - C-n: Move point down to the next line.


    +   - C-b: Move point back through the buffer one character to the left.


    +   - C-f: Move point forward through the buffer one character to the right.


    +   - Pg-Up: Move point forward through the buffer one screenful.


    +   - Pg-Dn: Move point backward through the buffer one screenful.


    +   - BKSP: Delete character to the left of point.


    +   - C-h: Delete character to the right of point.


    +   - DEL: Toggles between Insert mode and Overwrite mode.


    +   - Shift-INS or C-y: Yank text in the kill ring at point (see Recipe 10.4.2
    [Pasting Text], page 129).


    +   - C-SPC: Set mark (see Recipe 10.4.1 [Cutting Text], page 129).


    +   - C-_ Undo the last action (control-underscore).


    +   - C-a: Move point to the beginning of the current line.


    +   - C-e: Move point to the end of the current line.


    +   - C-g: Cancel the current command.


    +   - C-h F: Open a copy of the Emacs FAQ in a new buffer.


    +   - C-h a RET: List all Emacs commands related to function.


    +   - C-h i: Start Info.


    +   - C-h k: Describe key.


    +   - C-h t: Start the Emacs tutorial.


    +   - C-k: Kill text from point to end of line.


    +   - C-1: Re-center the text in the Emacs window, placing the line where point
    is in the middle of the screen.


    +   - C-t: Transpose the character at point with the character to the left of
    point.


    +   - C-u number: Repeat the next command or keystroke you type number times.


    +   - C-w: Kill text from mark to point.


    +   - C-x C-c: Save all buffers open in Emacs, and then exit the program.'
