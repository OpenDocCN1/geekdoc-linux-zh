    ```


    # ## 18.4 Annotating an Image


    Debian: ''libjpeg-progs''

    WWW: http://www.jpeg.org/


    To annotate an image file with a comment, use mogrify with the ''-comment'' option.
    giving the comment in quotes as an argument to the option. This is useful for
    adding a copyright (or copyleft) statement to an image, or for annotating an image
    file with a URL.


    +   • To annotate the image file ''phoenix.jpeg'', type (all on one line):


    ```

    $ mogrify -comment "If you can read this\ny''re too close!" phoenix.jpeg RET

    ```


    When you don''t annotate when you view the image; it is added to the image header
    in the file. You can, read image annotations with tools that display information
    about an image file, such as display or the GIMP. To read annotations in JPEG
    files, you can also use the rjpegcom tool—it outputs comments in the JPEG file
    whose name is given as an argument.


    +   • To verify any comments made in the image file ''phoenix.jpeg'', type:


    ```

    $ rjpegcom phoenix.jpeg RET

    If you can read this, you''re too close!

    $

    ```


    **NOTE:** Another method for writing comments in JPEG files is using wrjpegcom,
    which is distributed with rjpegcom in the ''libjpeg-progs'' package.


