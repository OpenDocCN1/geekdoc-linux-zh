  md: '# #9 Viewing Text


    Dealing with textual matter is the meat of Linux (and of most computing), so there
    are going to be many chapters about the various aspects of text. This first chapter
    in this part of the book shows how to view text on your display screen.


    There are many ways to view files or otherwise output text. When your intention
    is to edit the text of a file, open it in a text editor, as described in Chapter
    10 [Text Editing], page 119.


    Some kinds of files-such as PostScript, DV1, and PDF files-often contain text
    in them, but they are technically not text files. They are format files, and I
    describe methods for viewing them in Recipe 17.1 [Previewing Files], page 207.


    NOTE: To learn how to browse files in a Web browser, see Recipe 5.9 [Browsing
    Files], page 81.


    # ##9.1 Perusing Text


    Use less to peruse text, viewing it one screen (or “page”) at a time. The less
    tool works on either files or standard output - is popularly used as the last
    command on a pipeline so that you can page through the text output of some commands.
    For an example, see Recipe 3.24 [Redirecting Output to Another Command’s Input],
    page 40.


    zless is identical to less, but you use it to view compressed text files; it allows
    you to read a compressed text file without having to uncompress it first (see
    Recipe 8.5 [Compressed Files], page 102). Most of the system documentation in
    the `/usr/doc` and `/usr/share/doc` directories, consists of, example, of compressed
    text files.


    You, may on occasion, confronted with a reference to a command for paging text
    called more. It was the standard for paging text until it gave way to less in
    the mid-1990s; less comes with many more options-its most notable advantage being
    the ability to scroll backward through a file-but at the expense of being almost
    three times the size of more. Here are two meanings to the saying, “less is more.”


    # ###9.1.1 Perusing a Text File


    To peruse or page through a text file, give the name of the file as an argument
    to less.


    +   - To page through the text file `README`,


    ```

    $ less README

    ```


    This command starts less and displays the file `README` on the screen.


    You can move forward through the document a line at a time by typing F, and you
    can move forward through the document a screenful at a time by typing Fn. To move
    backward by a line, type f, and type FUp to move backward by a screenful.


    You can also search the text you are currently perusing-this is described in Recipe
    14 [Searching Text in Less], page 175.


    To stop viewing and exit less, press Q.'
  merge: -1
  pgno: 134
