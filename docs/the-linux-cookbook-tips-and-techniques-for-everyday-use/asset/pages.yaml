  md: "# Chapter 22: Audio Compact Discs\n\n```\n$ cdir RET\nunknown cd - 43:14 in\
    \ 8 tracks\n5:15.00 1\n5:50.40 2\n5:29.08 3\n3:50.70 4\n4:17.00 5\n5:56.15 6\n\
    7:13.40 7\n5:19.22 8\n$\n```\n\nIn this example, the CD contains eight tracks,\
    \ with a total of 43 minutes and 14 seconds play time.\n\n# 22.1.6 Ejecting an\
    \ Audio CD\n\nUse deject to eject the disc in the CD-ROM drive. If the disc is\
    \ currently playing, it will stop and the disc will eject.\n\n+   To eject a CD,\
    \ type:\n  $ deject RET\n\n> NOTE: This command will also eject a CD-ROM (data\
    \ CD), if the CD-ROM is not currently mounted (see Recipe 24.4 [CD-ROMs], page\
    \ 268).\n\n# 22.2 Sampling Sound from a CD\n\nDebian: 'cdda2wav'\nDebian: 'cdparanoia'\n\
    WWW: http://ftp.gwdg.de/pub/linux/misc/cdda2wav/\nWWW: http://www.mit.edu/afs/sips/xiphmont/cdparanoia/index.html\n\
    \nTwo tools used for sampling (sometimes called 'ripping') data from an audio\
    \ CD are cdda2wav and cdparanoia. Both can retrieve single tracks or entire disks;\
    \ the former is the archetypal audio-sampling tool for Linux, and should be used\
    \ when speed is more important than sound quality. The latter does extra checks\
    \ for paranoia and should be used when an absolutely perfect copy is necessary—at\
    \ the expense of speed. cdda2wav is perfectly capable of creating a digitally\
    \ perfect audio; cdparanoia is useful when your original CD may have scratches\
    \ (its scratch detection capability can attempt to 'hold sync' across the scratch),\
    \ or when you are using a less-than-optimal quality CD-ROM drive.\n\nWith cdda2wav,\
    \ you specify the track number to be retrieved by the argument '-t' option; use\
    \ '-x' for a CD-quality retrieval, and give the name of the CD device with the\
    \ '-d' option unless you have multiple CD-ROM drives installed, this is almost\
    \ certainly going to be /dev/cdrom.\n\nBy default, files are written in WAV format\
    \ files; use the '-o' option followed by '.cdr' to write the files in CD audio\
    \ format. '.cdr' are useful for burning an audio CD"
