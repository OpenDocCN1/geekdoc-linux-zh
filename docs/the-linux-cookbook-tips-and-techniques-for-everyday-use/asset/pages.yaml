  md: '# Chapter 4: The X Window System


    Use xsetroot to change the color and bitmap pattern in the root window.


    To change the color, use the ''solid'' option, and give the name of the color
    to use as an argument. (Use xcolors to get a list of possible color names; see
    Recipe 4.2.2 [Specifying Window Colors], page 56.)


    +   - To change the root window color to blue violet, type:


    ```

    $ xsetroot -solid blueviolet

    ```


    To change the root window pattern, use the ''-bitmap'' option, and give the name
    of the bitmap pattern to use.


    +   - To tile the root window with a star pattern, type:


    ```

    $ xsetroot -bitmap /usr/X1R6/include/bitmaps/star

    ```


    When specifying a pattern, use the ''-fg'' and ''-bg'' options to specify the
    foreground and background colors.


    +   - To tile the root window with a light gray star pattern on a black background,
    type (all on one line):


    ```

    $ xsetroot -fg slate2 -bg black /usr/X1R6/include/bitmaps/star

    ```


    Use the special ''gray'' option to change the root window to a shade of gray designed
    to be easy on the eyes, with no pattern.


    +   - To make the root window a gray color with no pattern:


    ```

    $ xsetroot -gray

    ```


    > NOTE: You can put an image in the window (although this consumes memory that
    could be spared for a memory-logging Web browser instead; see Recipe 17.2.2 [Putting
    an Image in the Root Window], page 211, for how to do it).


    # 4.6.4 Choosing a Window Manager


    Yes, there are many window managers to choose from. Some people like the flashiness
    of Enlightenment, running with KDE or GNOME, while others prefer the spartan wm—the
    choice is yours.


    The following table describes some of the more popular window managers currently
    available.


    | WINDOW MANAGER | DESCRIPTION |

    | 9wm | 9wm is a simple window manager inspired by AT&T''s Plan 9 window manager—it
    does not use title bars or icons. It would appeal to those who like the witty
    text editor (see Recipe 10.1 [Choosing the Text Editor], page 119). Debian: ''9wm''
    WWW: http://ftp.cs.su.au/dhog/9wm |

    | afterstep | AfterStep is inspired by the look and feel of the NeXTSTEP interface.
    Debian: ''afterstep'' WWW: http://www.afterstep.org/ |'
