  md: '# 1 Introduction


    Before we get into “cooking” and the recipes proper, this first part of the book
    deals with preliminaries, explaining the general techniques and methods for working
    with Linux—including how to get the system ready for use, and how to run commands
    on the system.


    The rest of the book is all recipes, which are sorted in sections by the tasks
    they perform or the objects they work on—such as text, files, images, and so forth.


    # 1.1 Background and History


    In order to understand what Linux is all about, it helps to know a bit about how
    it all began. So the following is a historical overview, giving a concise background
    of the software that is the subject of this book.


    # 1.1.1 What’s Unix?


    WWW: http://www.bell-labs.com/history/unix/

    WWW: http://internet-history.org/archives/early_history.of_unix.html


    Unix, the original ancestor of Linux, is an operating system. Or at least it was
    an operating system; the original system known as Unix proper is not the “Unix”
    we know and use today; there are now many “flavors” of Unix, which Linux has become
    the most popular.


    A product of the 1960s, Unix and its related software was invented by Dennis Ritchie,
    Ken Thompson, Brian Kernigh, and other hackers at Bell Labs in 1969; its name
    was a play on “Multics,” another operating system of the time.


    In the early days of Unix, any interested party who had the hardware to run it
    could get a tape of the software from Bell Labs, with printed manuals, for a very
    nominal charge. (This was before the era of personal computing, and in practice,
    mostly only universities and research laboratories did this) Local sites pasted
    with the software’s source code, extending and customizing the system to their
    needs and liking.


    In the late 1970s, scientists at the University of California, Berkeley, a licensee
    of the Unix source code, had been making their own improvements and enhancements
    to the Unix source during the course of their research, which included the development
    of TCP/IP networking. Their work became the BSD (Berkeley Systems Distribution)
    flavor of Unix.


    The source code of their work was made publicly available under licensing that
    permitted redistribution, with source or without, that Berkeley was credited for
    their positions of the code. There are modern variants of the original BSD still
    actively developed today, and some of them as NetBSD and OpenBSD run on personal
    computers.


    NOTE: The uppercase word UNIX became a trademark of AT&T (since transferred to
    other organizations), to mean a particular operating operating system. But today,
    when people say “Unix,” they usually mean a “Unix-like operating system,” a generalization
    that includes Linux.


    > ¹ The name “Unix” was first written as “Unics,” which stood for Uniplex Information
    and Computing System.'
