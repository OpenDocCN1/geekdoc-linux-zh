  md: '# # 11 Grammar and Reference


    The tools for writing and editing on Linux-based systems include spell checkers,
    dictionaries, and reference files. This chapter shows methods for using them.


    # ## 11.1 Spelling


    There are several ways to spell check text and files on Linux; the following recipes
    show how to find the correct spellings of particular words and how to perform
    batch, interactive, and Emacs-based spell checks.


    The system dictionary file, `/usr/dict/words`, is nothing more than a word list
    (albeit a very large one), sorted in alphabetical order and containing one word
    per line. Words that rely on some form of capitalization in order to be correct
    (such as proper nouns) appear in that form. All of the Linux spelling tools use
    this text for spell checking; if a word does not appear in the dictionary file,
    it is considered to be misspelled.


    **NOTE:** None of the computerized spell-check tools will correct correct your
    writing if you are using the wrong word to begin with—for example, if you have
    ''there'' when you mean ''their'', the computer will not catch it (yet).


    # ### 11.1.1 Finding the Correct Spelling of the Word


    If you''re unsure or not you''re using the correct spelling of a word, use spell
    to find out. `spell` reads from the standard input and outputs any words not found
    in the system dictionary—so if a word is misspelled, it will be echoed back on
    the screen after you type it.


    +   - For example, to check the word `occurrence` is misspelled, type:


    ```

    $ spell RET

    occurrence RET

    occurrence

    c-d

    $

    ```


    In the example, spell echoed the word `occurrence`, meaning that this word was
    not in the system dictionary and therefore was quite likely a misspelling. Then,
    `C-d` was typed to exit spell.


    # ## 11.1.2 Listing the Misspellings in a Text


    To output a list of misspelled words in a file, give the name of the file as an
    argument to `spell`. Any misspelled words in the file are output, each on a line
    of its own and in the order they appear in the file.


    On an increasing number of systems, this file is replaced with `/usr/share/dict/words`;
    administrators should make a symbolic link from this to this shorter, preferred
    form.'
  merge: -1
  pgno: 158
