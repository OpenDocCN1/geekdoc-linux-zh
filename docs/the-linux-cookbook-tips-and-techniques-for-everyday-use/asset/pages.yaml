  md: '# Chapter 25: Printing


    +   * To convert the file ''abstract.dvi'' to PostScript, type:


    ```

    $ dvips -o abstract.dvi RET

    ```


    This command reads the DVI file ''abstract.dvi'' and writes a PostScript version
    of it to the file ''abstract.ps'': the original file is not altered.


    To write only pages of a DVI file to the PostScript output, give the page or pages
    as arguments to the ''-pp option.


    +   * To output only pages 14 and 36 from file ''abstract.dvi'' to a PostScript
    file, ''abstract.ps'', type:


    ```

    $ dvips -pp14,36 -o abstract.ps abstract.dvi RET

    ```


    +   * To output pages 2 through 100 from file ''abstract.dvi'' to a PostScript
    file, ''abstract.ps'', type:


    ```

    $ dvips -pp2-100 -o abstract.dvi abstract.dvi RET

    ```


    +   * To output page 1 and 5 pages through 20 from file ''abstract.dvi'' to a
    PostScript file, ''abstract.ps'', type:


    ```

    $ dvips -pp1,5-20 -o abstract.dvi abstract.dvi RET

    ```


    To specify an output page size, give it as an argument to the ''-t'' option; you
    can also send the output directly to the printer (see Recipe 25.2.2 Printing with
    Dvi, page 274).


    +   * To output the file ''abstract.dvi'' as a PostScript file, ''abstract.ps'',
    with a paper size of ''legal'', type:


    ```

    $ dvips -t legal -o abstract.ps abstract.dvi RET

    ```


    +   * To print the file ''abstract.dvi'' to the default printer in landscape mode,
    type:


    ```

    $ dvips -t landscape.dvi RET

    ```


    NOTE: This conversion is not only useful for first preparation. Once the DVI file
    is converted to PostScript, you can convert it to other formats, such as plain
    text or PDF — see Recipe 20.3 [Converting PostScript], page 239.


    Use the ''-P'' option with dvips to specify the printer name to write out—use
    this option to make output for non-PostScript printers. For example, convert TeX
    and LaTeX to PDF, use dvips and give ''pdf'' as an argument to the ''-P'' option.


    +   * To generate a PDF from the DVI file ''abstract.dvi'', type:


    ```

