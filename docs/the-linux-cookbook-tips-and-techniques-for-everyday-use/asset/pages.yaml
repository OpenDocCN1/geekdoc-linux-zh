  md: '# 21 Sound Files


    Debian: ''alsa-base''

    WWW: http://www.alsa-project.org/


    This chapter covers the basic control of audio on Linux-based systems, including
    how to adjust the audio mixer and how to record sound files using basic tools.
    You can also play and record audio with 2nd (see Chapter 23 [Editing Sound Files],
    page 255) and many other sound applications.


    For purposes of this discussion, I will assume that you have sound working properly;
    unlike the standard Open Sound System driver (OSS/Linux), the ALSA driver is made
    entirely of free software. It is becoming the de facto choice for musicians who
    use


    NOTE: Most systems come configured so you must be the super to be able to use
    devices, including audio CDs. If this is the case on your system, ask your administrator
    to give you access to these devices, typically by adding you to the audio group
    (see Recipe 6.1 [Groups and How to Work in Them], page 83).


    # 21.1 Sound File Formats


    The following table lists common audio file formats and their traditional file
    name extensions. You can also use file to determine a file''s format (see Recipe
    8.1 [Determining File Type and Format], page 99).


    | FILE EXTENSION | SOUND FORMAT |

    | --- | --- |

    | .aiff | Apple Macintosh audio file. |


    | .au | Sun Microsystems audio file (8000 Hz, u-law compression). |


    | .cdda or .cdr | Both are names for the audio compact disc format, used for burning
    audio CD-Rs and CD-RW (44.1 KHz raw stereo). |


    | .gsm | Global System for Mobile Communications (GSM) speech file format, used
    in some voice-mail applications. |


    | .midi or .mid | The standard extensions for MIDI files. |


    | .mod | MOD file. |


    | .mp3 | MPEG II, Level 3 file. |


    | .ra | RealAudio file. |


    | .raw | Audio data. |


    | .sf | IRCAM SoundFile format, used by some music composition software, such
    as CSound and MiXViews. |


    | .voc | SoundBlast VOC file. |


    | .wav | Microsoft RIFF format (“WAV”). | |'
  merge: -1
  pgno: 266
- img_proc: true
  md: "# 21.2 Adjusting the Audio Controls\n\nA mixer program is used to adjust various\
    \ audio settings, such as volume and recording levels, and is also used for turning\
    \ on or muting the microphone or other input device. You must use a mixer to adjust\
    \ your audio settings before you play or record sound.\n\nALSA's default mixer\
    \ is called mixer, and the following recipes assume its use. There are other mixers,\
    \ and some of them are easier to use than mixer. If you want a graphical mixer,\
    \ install the aumix package, or see the end of this chapter for others.\n\n# 21.2.1\
    \ Listing the Current Audio Settings\n\nTo list all audio input and output devices\
    \ and their settings, Your sound card's components are organized in groups, from\
    \ the Master group containing the master left and right volume settings to the\
    \ individual groups for audio compact discs and digital sound files.(These groups\
    \ have nothing to do with the file access groups described in Recipe 6.1 (Groups\
    \ and How to Work in Them), page 83.)\n\n+   * To persist the current mixer settings,\
    \ type:\n  $ mixer | less\n\n```\n$ mixer | less\n```\n\nThe following table describes\
    \ some of the important sound groups that mixer lists.\n\n| SOUND GROUP DESCRIPTION\
    \ |\nMaster The master volume settings.\nPCM Digital audio for playing sound files;\
    \ the first channel is group PCM, and the second is PCM,1.\nCD The audio compact\
    \ disc player (a cable must be connected from the CD-ROM drive to the sound card).\n\
    Synth The synthesizer device for MIDI.\nLine The sound input device (the jack\
    \ on the back of the soundcard is usually labeled LINE IN).\n\nTo list the settings\
    \ for only one group, use the 'get' option followed by the name of the group you\
    \ want to list. Group names are case-sensitive so giving MIC specifies the microphone\
    \ group, while Mic and mic are not valid groups.\n\n+   * To output the microphone\
    \ settings, type:\n  $ mixer get MIC\n* To output the second PCM settings, type:\n\
    \  $ mixer get PCM,1\n\n```\n$ mixer get MIC\n```\n\n```\n$ mixer get PCM,1\n\
    ```\n\n# 21.2.2 Changing the Volume Level\n\nTo change a mixer setting, give the\
    \ mixer 'set' command as an option, followed by both the group and setting as\
    \ arguments. To change the volume level for a device, give either a numeric value\
    \ or a percentage for the volume level."
  merge: -1
  pgno: 267
- img_proc: true
  md: "# Chapter 21: Sound Files\n\n+   - To set the master volume to 75 percent,\
    \ type:\n  $ amixer set Master 75% RET\n- To set the PCM volume to 30, type:\n\
    \  $ amixer set PCM 30 RET\n\n#  21.2.3 Muting an Audio Device\n\nThe special\
    \ 'mute' and 'unmute' arguments are used for muting the volume of a given device.\
    \ Before you record something, you must unmute the input device you want to record\
    \ from. Remember to also mute the microphone after you have finished recording,\
    \ to avoid feedback when you turn up your speakers.\n\n+   - To unmute the microphone\
    \ and turn it on for recording, type:\n  $ amixer set MIC unmute capture RET\n\
    - To mute the microphone, type:\n  $ amixer set MIC mute RET\n- To unmute the\
    \ master volume and set it to 80 percent volume, type:\n  $ amixer set Master\
    \ 80% unmute RET\n\n#  21.2.4 Selecting an Audio Source\n\nTo select a device\
    \ for recording, use set followed by the name of the device and the 'capture'\
    \ argument, which designates the specified group as the one to capture sound from\
    \ recording.\n\n+   - To select the LINE IN as the recording source, type:\n \
    \ $ amixer set Line capture RET\n- To select the microphone jack as the recording\
    \ source, type:\n  $ amixer set MIC capture RET\n\nNOTE: You can have only one\
    \ group selected for capture at a time, and when you select a group as an input\
    \ source for recording, you are simply turning the microphone or other input on;\
    \ recording does not occur until you use a recording tool.\n\n#  21.3 Playing\
    \ a Sound File\n\nDebian: 'sox'\nWWW: http://home.sprynet.com/~cbagwell/sox.html\n\
    \nThe play distributed with sox (a sound file translation tool) can recognize\
    \ and play many audio formats, including WAV, VOC, AU, AIFF, and SND format files,\
    \ as well as audio CD-format files and various raw binary files; just about the\
    \ only common formats it can't handle are MP3 and MIDI files, which are discussed\
    \ in the sections below.\n\n+   - To play the 'pentastar.aiff' type:\n  $ play\
    \ pentastar.aiff RET"
  merge: -1
  pgno: 268
- img_proc: true
  md: "# The Linux Cookbook: Tips and Techniques for Everyday Use\n\nNOTE: Before\
    \ you begin playing sound, make sure you've set the master and PCM volume levels\
    \ with the mixer (see Recipe 21.2 [Adjusting the Audio Controls], page 244). The\
    \ most common reason for no sound being produced when you try to play sound is\
    \ not having the volume turned up!\n\nALSA comes with `aplay`, a tool for playing\
    \ sound files that is similar to `play`, but does not recognize many formats.\n\
    \n# 21.3.1 Playing an MP3 File\n\nDebian: `mpg123'\nWWW: `http://mpg123.org/`\n\
    \nTo play an MP3 file, give its name as an argument to `mpg123`.\n\n+   - To play\
    \ the MP3 file `september-wind.mp3`, type:\n  `mpg123 september-wind.mp3`\n\n\
    To buffer audio, useful when the system is running processes or otherwise has\
    \ a lot of activity; give a buffer size, in kilobytes, as an argument to the `-b`\
    \ option. The default is 0 (no buffer); if you need this, use a size of at least\
    \ 1024KB (1MB), or over six seconds of MP3 audio.\n\nYou can use mpg123 to play\
    \ `streaming` MP3 audio from the Web; just give the URL of the MP3 as an argument.\n\
    \n+   - To play the MP3 stream at `http://example.net/broadcast/live.mp3`, type:\n\
    \  `mpg123 http://example.net/broadcast/live.mp3`\n- To play the MP3 stream at\
    \ `http://example.net/broadcast/live.mp3` with a 2MB audio buffer:\n  `mpg123\
    \ -b 2048 http://example.net/broadcast/live.mp3`\n\nNOTE: There are a great many\
    \ MP3 players available; some of them are listed in Recipe 21.5 [Other Sound Tools],\
    \ page 248.\n\n# 21.3.2 Playing a MIDI File\n\nDebian: `playmidi'\nWWW: `http://playmidi.openprojects.org/`\n\
    \nThe playmidi tool is for playing MIDI files; give the name of the MIDI file\
    \ to play as an argument.\n\n+   - To play the MIDI file `copa-cabana.mid`, type:\n\
    \  `playmidi copa-cabana.mid`\n\nIf you have a non-MIDI sound card, you can still\
    \ play MIDI files by giving the `-f` option, which sends the MIDI output to the\
