  md: '# Chapter 2: What Every Linux User Knows


    terminal. you can switch between virtual consoles at any time, and you can log
    in and use the system from several virtual consoles at once.


    The following recipes explain the basic things you will need to do with virtual
    consoles.


    # 2.3.1 Switching between Consoles


    To switch to a different virtual console, press ALT-Fn, where n is the number
    of the console to switch to.


    +   * To switch to the fourth virtual console, press ALT-F4

    This command switches to the fourth virtual console, denoted by ''tty4'':


    ```

    Debian GNU/Linux 2.2 bardo tty4

    bardo login:

    ```


    You can cycle through the different virtual consoles with the left and right arrow
    keys. To switch to the next-lowest virtual console (or wrap around to the highest
    virtual console, if you''re at the first virtual console), press ALT-<-. To switch
    to the next-highest virtual console, press ALT-->.


    +   * To switch from the fourth to the third virtual console, press ALT-<-


    This keystroke switches to the third virtual console, ''tty3'':


    ```

    Debian GNU/Linux 2.2 bardo tty3

    bardo login:

    ```


    The seventh virtual console is reserved for the X Window System. If X is installed,
    this virtual terminal will never show a login: prompt, but when you are using
    X, this is where your X session appears. If your system is configured to start
    X immediately, this virtual console will show an X login screen.


    You can switch from a virtual console to the X Window System using CTRL-ALT and
    function keys. This is the only console manipulation keystroke that works in X.


    +   * To switch from X to the first virtual console, press: CTRL-ALT-F1


    # 2.3.2 Scrolling the Console Text


    When you are logged in a virtual console, new lines of text appear at the bottom
    of the console screen, while older lines of text scroll off the top of the screen.'
