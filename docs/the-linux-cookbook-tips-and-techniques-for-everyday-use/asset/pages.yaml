  md: "# Chapter 12: Analyzing Text\n\nThis command outputs all of the words that\
    \ can be formed from all or some of the characters in 'seas', including 'see'\
    \ and 'as'.\n\n# 12.5 Finding Palindromes in the Text\n\nA palindrome is a word\
    \ that reads the same forwards and backwards; for example, 'Mom,' 'madam.' and\
    \ 'nun' are all palindromes.\n\nTo find palindromes in a file, use this simple\
    \ Perl 'one-liner,' and substitute file for the name of the file to check:\n\n\
    ```\nperl -ln 'print if $_ reverse' file\n```\n\nTo check for palindromes in the\
