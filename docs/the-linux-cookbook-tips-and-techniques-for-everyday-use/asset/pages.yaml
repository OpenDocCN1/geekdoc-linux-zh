  md: 'Chapter 17: Viewing Images


    # 17.2.2 Putting an Image in the Root Window


    One way to put an image in the root window (the background behind all other windows)
    is to use display and give `root` as an argument to the `-window` option.


    +   To put an image `tetra.jpeg` in the root window, type:


    ```

    $ display -window root tetra.jpeg RET

    ```


    # 17.3 Browsing Images in a Console


    Use `zgy` to view images in a virtual console (not X). You can use `zgy` to browse
    through the filesystem and select images to view, or give as arguments names of
    image files to view. It recognizes many image formats, including GIF, JPEG, PNG,
    PBM/PNM/PPM, TGA and PCX; one of its nicest features is that it can fill the entire
    screen with an image.


    When you run `zgy` with no options, it displays image icons of any screen in the
    current directory, listing any subdirectories as folder icons. You can also give
    the name of a directory as an argument to browse the images in that directory.


    +   To browse the images in the current directory, type:


    ```

    $ zgy RET

    ```


    +   To browse the images in the `/usr/share/gimp/scripts/` directory, type:


    ```

    $ zgy /usr/share/gimp/scripts RET

    ```


    Use the arrow keys to navigate through the file display; the red border around
    an image or directory indicates which image or subdirectory is selected. Type
    `RET` to view the selected image or to change the selected directory.


    You can manipulate the images you view in a number of ways—zoom the image magnification
    and out, change the brightness and color, and even make automatic “slide shows”
    of images. The following table describes some of `zgy`''s options.


    | OPTION -c | Toggle image centering. Images are centered on screen by default;
    specifying this option turns off centering. |

    | -i | Ignore errors due to corrupted files, and display whatever portion of the
    file is displayable. |

    | -1 | Start `zgy` in slide-show mode, where it loops through all images specified
    as arguments, continuously, until you interrupt it. |

    | -M | Toggle mouse support. Mouse support is off by default; this option turns
    it on. |

    | -r integer | Recad and redraw every image after every `integer` seconds. For
    viewing webcam images or other image files that are continuously changing. |'
  merge: -1
  pgno: 234
- img_proc: true
  md: "# 17.4 Viewing an Image in a Web Browser\n\nIf you have a graphical Web browser,\
    \ such as mozilla, you can use it to view a graphic image. While viewing images\
    \ in a browser doesn't offer much flexibility (you can't zoom in on portion of\
    \ the image, or get information about the image resolution and other details),\
    \ if you simply want to quickly view an image file while you are in X, and you\
    \ have a Web browser running, it can be a quick and easy way to do it.\n\nTo view\
    \ an image file in a Web browser, specify a file: URL pointing to the file name\
    \ of the image in the Location field of the browser.\n\n+   * To view the file\
    \ '/usr/share/images/mordrian-15.jpeg', type:\n  `file:/usr/share/images/mordrian-15.jpeg`\n\
    \nNotice that the given file: URL only has one preceding slash, pointing to the\
    \ root directory, and not two, as in http://\n\n# 17.5 Viewing PhotoCD Archives\n\
    \nDebian: 'xpcd'\nDebian: 'xpcd-gimp'\nWWW: http://user.cs.tu-berlin.de/~kraxel/linux/xpcd/\n\
    \nThe xpcd tool is an X client for viewing and browsing collections of Kodak PhotoCD\
    \ images. To browse the images on a Kodak PhotoCD, mount the CD-ROM (see Recipe\
    \ 24.4.1 [Mounting a CD-ROM], page 268), and give the point mount as an argument\
    \ to xpcd.\n\n+   * To browse the images on the PhotoCD disc mounted on '/cdrom',\
    \ type:\n  $ xpcd /cdrom\n\nThe preceding example will open two windows — a small\
    \ xpcd command bar window, and a larger window containing thumbnails of all PhotoCD\
    \ images on the disc.\n\nTo open a copy of an image in the new window, left-click\
    \ its thumbnail image. When you do, xpcd will open the image at the second-smallest\
    \ resolution.256x384; to view it at another size, right-click the image and choose\
    \ the size to view. Once the new window is drawn, you can right-click the new\
    \ image to save it as a JPEG, PPM, or TIFF format image.\n\nTo view an individual\
    \ '.pcd' file with xpcd, give the name of the file as an argument.\n\n+   * To\
    \ view the PhotoCD file 'driveby-001.pcd', type:\n  $ xpcd driveby-001.pcd\n\n\
    NOTE: You can use display to view a '.pcd' PhotoCD image (see Recipe 17.2 [Viewing\
    \ an Image in X], page 208).\n\nSee Recipe 19.3 [Extracting PhotoCD images], page\
    \ 232 for another recipe for extracting PhotoCD images."
  merge: -1
