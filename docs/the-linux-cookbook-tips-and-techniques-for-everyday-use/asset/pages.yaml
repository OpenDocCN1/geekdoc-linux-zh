  md: "# Chapter 12: Analyzing Text\n\n+   * To output a count of the number of unique\
    \ words in the text file 'naked_lunch', type:\n  $ tr ' ' ' ' RET | sort | uniq\
    \ -c | wc -l RET\n  > `naked_lunch` sort | uniq -c | wc -l RET\n\n# 12.3 Text\
    \ Relevance\n\nThe following recipes show how to analyze a given text for its\
    \ relevancy to other text, either to keywords or to whole files of text.\n\nYou\
    \ can use the diff family of tools to analyze differences in text; those tools\
    \ are especially good for comparing different revisions of the same file (see\
    \ Recipe 8.4 [Comparing Files], page 101).\n\n# 12.3.1 Sorting Text in Order of\
    \ Relevance\n\nDebian: 'rel'\nWWW: http://www.johncon.com/\n\nUse rel to analyze\
    \ text files for relevance to a given set of keywords. It outputs the names of\
    \ those files that are relevant to the given keywords, ranked in order of relevance;\
    \ if a file does not meet the criteria, it is not output in the relevance listing.\n\
    \nrel takes an option keyword to search for quotes; you can build a boolean expression\
    \ by grouping multiple keywords in parentheses and using any of the following\
    \ operators between them:\n\n| OPERATOR | DESCRIPTION |\n| --- | --- |\n| | |\
    \ Logical \"or.\" |\n| & | Logical \"and.\" |\n| ! | Logical \"not.\" |\n\nGive\
    \ as arguments the names of the files to rank.\n\n+   * To rank the files 'report.a',\
    \ 'report.b', and 'report.c' in order of relevance to the keywords 'saving' and\
    \ 'profit', type:\n  $ rel \"(saving & profit)\" report.a report.b report.c RET\n\
    \nGive the name of a directory tree to analyze all files in the directory tree.\n\
    \n+   * To output a list of any files containing 'invitation' or 'request' in\
    \ the \"/mail\" directory, ranked in order of relevance, type:\n  $ rel \"(invitation\
    \ & request)\" \"/mail\" RET\n\n+   * To output a list of any files containing\
    \ 'invitation' and not 'wedding' in the \"/mail\" directory, ranked in order of\
    \ relevance, type:\n  $ rel \"(invitation & party)\" \"/mail\" RET"
  merge: -1
