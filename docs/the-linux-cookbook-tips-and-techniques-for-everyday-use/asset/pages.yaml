  md: "# 8 Managing Files\n\nFile management tools include those for splitting, comparing,\
    \ and compressing files, making backup archives, and tracking file revisions.\
    \ Other management tools exist for determining the contents of a file, and for\
    \ changing its timestamp.\n\n# 8.1 Determining File Type and Format\n\nWhen we\
    \ speak of a file's type, we are referring to the kind of data it contains, which\
    \ may include text, executable commands, or some other data; this data is organized\
    \ in a particular way in the file, and this organization is called its format.\
    \ For example, an image file might contain data in the JPEG image format, or a\
    \ text file might contain unformatted text in the English language or text formatted\
    \ in the TeX markup language.\n\nThe tool analyzes files and indicates their type\
    \ and if—the format of the data they contain. Supply the name of a file as an\
    \ argument to file and it outputs the name of the file, followed by a description\
    \ of its format and type:\n\n+   * To determine the format of the file `/usr/doc/HOWTO/README.gz`,\
    \ type:\n\n```\n$ file /usr/doc/HOWTO/README.gz RET\n/usr/doc/HOWTO/README.gz:\
    \ gzip compressed data, deflated, original\nfilename, last modified: Sun Apr 26\
    \ 02:51:48 1998, os: Unix\n$ \n```\n\nThis command reports that the file `/usr/doc/HOWTO/README.gz`\
    \ contains data that has been compressed with the gzip tool.\n\nTo determine the\
    \ original format of the data in a compressed file, use the ‘z’ option.\n\n+ \
    \  * To determine the format of the compressed data contained in the file `/usr/doc/HOWTO/README.gz`,\
    \ type:\n\n```\n$ file -z /usr/doc/HOWTO/README.gz RET\n/usr/doc/HOWTO/README.gz:\
    \ English text (gzip compressed data, deflated,\noriginal filename, last modified:\
    \ Sun Apr 26 02:51:48 1998, os: Unix)\n$ \n```\n\nThis command reports that the\
    \ data in `/usr/doc/HOWTO/README.gz`, a compressed file, is English text.\n\n\
    NOTE: Currently, file differentiates among more than 100 different data formats,\
    \ including several human languages, many sound and graphics formats, and executable\
    \ files for many different operating systems.\n\n# 8.2 Changing File Time Modification\n\
    \nUse touch to change a file's timestamp without modifying its contents. Give\
    \ the name of the file to be changed as an argument. The default action is to\
    \ change the timestamp to the current time."
  merge: -1
  pgno: 122
- img_proc: true
  md: 'To change the timestamp of file ''pizzicato'' to the current date and time,
    type:


    ```

    $ touch pizzicato RET

    ```


    To specify a timestamp other than the current system time, use the ''-d'' option,
    followed by the date and time that should be enclosed in quote characters. You
    can specify the date, just the time, or both


    To change the timestamp of file ''pizzicato'' to ''17 May 1999 14:16'', type:


    ```

    $ -d ''17 May 1999 14:16'' pizzicato RET

    ```


    To change the timestamp of file ''pizzicato'' to ''14 May'', type:


    ```

    $ -d ''14 May'' pizzicato RET

    ```


    To change the timestamp of file ''pizzicato'' to ''14:16'', type:


    ```

    $ -d ''14:16'' pizzicato RET

    ```


    NOTE: When only the date is given, it is set to ''0:00''; when no year is given,
    the current year is used.


    See info file ''fileutils.info'', node ''Date input formats'', for more information
    on input formats.


    # 8.3 Splitting a File into Smaller Ones


    It''s necessary to split one file into many of smaller ones. For example, suppose
    you have a large sound file in the near-CD-quality MPEG2 (''MP3'') format. Your
    file, ''large.mp3'' is 4,394,422 bytes in size, and you want to transfer it from
    your desktop to your laptop, but your laptop and desktop are not connected on
    a network—the only way to transfer files between them is by floppy disk. Because
    this file is too large to fit on one floppy, you must split


    The split tool copies a file, chopping up the copy into separate files of a specified
    size. It takes as arguments the name of the input file (using standard input if
    none is given) and the file name prefix to use when writing the output files (using
    ''x'' if none). The output files will consist of the prefix followed by a group
    of letters: ''aa'', ''ab'', ''ac'', and so on—the default output file names will
    be ''xaa'', and so on.


    Specify the number of lines to put in each output file with the ''-l'' option,
    or the ''-b'' option to specify the number of bytes to put in each output file.
    To specify the output files sizes in megabytes or kilobytes, use the ''-b'' option
    and ''k'' or ''m'', respectively, to the value you supply. If ''-l'' nor ''-b''
    is used, split defaults to using 1,000 lines per file.


    +   To split ''large.mp3'' into separate files of one megabyte each, whose names
    begin with ''large.mp3.'', type:


    ```

    $ split -b1m large.mp3 large.mp3. RET

    ```


    This command creates new files whose names begin with ''large.mp3.''. The first
    four files are one megabyte in size, the last file is 200,118 bytes—the remaining
    portion of the original file. No alteration is made to ''large.mp3''.


    You could copy these five files onto four floppies (the last file on a floppy
    with one of the larger files), copy them all to your laptop, and reconstruct the
    original file with cat (see Recipe 10.6 [Concatenating Text], page 130).'
