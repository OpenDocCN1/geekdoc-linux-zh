    \ audio file |\n\n# 30.5 Making an Email Signature\n\nDebian: 'sigrot'\nWWW: http://metalab.unc.edu/pub/Linux/system/mail/misc/\n\
    \nA signature file (often called a \"dot sig,\" and written as '.sig') is a text\
