    to emulate the behavior of other text editors.<br> Debian: ''ae''<br> WWW: http://dmoz.org/Computers/Software/Editors/Vi/
    |

    | cooledit | Coled is a popular, fast text editor for X; its features include
    anti-aliased fonts, Unicode support, and extensibility via the Python programming
    language.<br> Debian: ''cooledit''<br> WWW: http://cooledit.sourceforge.net/ |

    | dedit | DEdit is a simple editor for X with GNOME installed. It can read compressed
    files and display Japanese characters.<br> Debian: ''dedit'' |

    | ee | Intended to be an editor that novices can begin using immediately, the
    Easy Editor features pop-up menus.<br> Debian: ''ee''<br> WWW: http://mahon.cwx.net/
    |

    | elvis | Elvis is a modern implementation of Vi that comes with many new features
    and extensions.<br> Debian: ''elvis''<br> WWW: http://www.fh-wedel.de/elvis/ |

    | emacs | Emacs is one of the two most-popular text editors. I''ve devoted an
    entire section to it in this book: Recipe 10.2 [Emacs], page 121.<br> Debian:
    ''emacs-common''<br> Debian: ''emacs20''<br> WWW: http://www.emacs.org/ |'
