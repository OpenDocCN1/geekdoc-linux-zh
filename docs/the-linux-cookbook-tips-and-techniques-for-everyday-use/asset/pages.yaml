    # 8.4.3 Patching a File with a Difference Report


    To apply the differences in a difference report to the original file compared
    in the report, use patch. It takes as arguments the name of the file to be patched
    and the name of the difference report file (or ''patchfile''). It then applies
    the changes specified in the patch to the original file. This is especially useful
    for distributing different versions of a file—small patchfiles may be sent across
    networks easier than large sources.


    +   - To update the original file ''manuscript.new'' with the patchfile ''manuscript.diff'',
    type:


    ```

    $ patch manuscript.new manuscript.diff RET

    ```


    # 8.5 Compressed Files


    File compression is useful for storing or transferring large files. When you compress
    a file, you shrink it and save disk space. File compression uses an algorithm
    to change the data in the file: to use the data in a compressed file, you must
    first uncompress to restore the original data (and original file size).


    The following recipes explain how to compress files.


    # 8.5.1 Compressing a File


    Use gzip (GNU zip) to compress files. It takes as an argument the name of the
    file or files to be compressed; it writes a compressed version of the specified
    files, appends a .gz extension to their file name, and deletes the original files.


    +   - To compress the file ''war-and-peace'', type:


    ```

    $ gzip war-and-peace RET

    ```


    This command compresses the file ''war-and-peace'', putting it in a new file ''war-and-peace.gz'';
    gzip then deletes the original file, ''war-and-peace''.


    # 8.5.2 Decompressing a File


    To access the contents of a compressed file


    +   - To expand the file ''war-and-peace.gz'', type:


    ```

    $ gunzip war-and-peace.gz RET

    ```'
