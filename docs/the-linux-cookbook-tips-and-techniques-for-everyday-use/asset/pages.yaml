    at a UC Berkeley computer lab, a girl would bring her dog, Biff, with when she
    went to use the computers. Biff was known for barking at the mailman when he came
    in to deliver the day''s mail. He was also very popular with all of the BSD UNIX
    hackers at Berkeley, and one of them wrote a mail notification tool, he thought
    of Biff – hence the name. (Biff, the dog, died in August 1993.)


