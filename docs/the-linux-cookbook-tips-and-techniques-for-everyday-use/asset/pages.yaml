  md: '# 27.4.2 Including Holidays in Your Reminders


    NOTE: In the example above, entry for the party doesn''t have a date on it—it
    used the date of the preceding entry, ''6/16''.


    The calendar package comes with a collection of prepared calendar files for many
    kinds of holidays and other occasions, which you can reference in your own calendar
    file to include their entries in your own reminders.


    The prepared files are stored in ''/usr/share/calendar''. The following table
    gives the name of each calendar file and describes its contents.


    | CALENDAR FILE | DESCRIPTION |

    |---|---|

    | calendar.birthday | Births and deaths of famous people. |

    | calendar.christian | Christian holidays. |

    | calendar.computer | Significant dates in the history of computing. |

    | calendar.history | Dates of U.S. historical events. |

    | calendar.holiday | Standard and obscure holidays. |

    | calendar.judaic | Jewish holidays. |

    | calendar.music | Dates related to music, mostly 1960s rock and roll. |

    | calendar.usholiday | U.S. holidays. |

    | calendar.hindu | Hindu holidays. |


    To have calendar output dates from one of these files along with your usual appointments,
    put the following in your calendar file, where file is the name of the particular
    calendar file you want to include:


    ```

    #include <file>

    ```


    For example, to output both US holidays and famous births and deaths when you
    run calendar, put these lines somewhere in your calendar file:


    ```

    #include <calendar.usholiday>

    #include <calendar.birthday>

    ```


    NOTE: You, of course, share your own calendar files with other users; this is
    useful for making special calendars for a group or organization. If the calendar
    file is in the current directory or ''/usr/share/calendar'', you can just give
    the file name; otherwise, give its full path name in the include statement.


    # 27.4.3 Automatic Appointment Delivery


    You can automate your appointment service so that your appointments and reminders
    are delivered each time you log in or start a new shell, or can have the day''s
    reminders emailed to you each morning.


    Add calendar to your ''.bashrc'' file to output the day''s appointments and reminders
    every time you log in or start a new shell (see Recipe 3.6.4 [Customizing Future
    Shells], page 47).'
  merge: -1
