  md: "# The Linux Cookbook: Tips and Techniques for Everyday Use\n\nTo check the\
    \ text of a Web page, use the text-only Web browser lynx with the '-dump and '-nolist'\
    \ options to output the plain text of a given URL, and pipe this output to diction.\
    \ (if you expect there to be a lot of output, add another pipe to the end so you\
    \ can peruse it.\n\nTo peruse a copy of the text of http://example.org/1.html\
    \ with marks for possible word and misused phrases, type:\n$ lynx -dump -nolist\
    \ http://example.org/1.html | diction | less RET\n\n# 11.2 Checking Text for Doubled\
    \ Words\n\nOne of the things that diction looks for is doubled words—words repeated\
    \ twice in a pair pair. If it finds such a sequence, it encloses the second member\
    \ of the doubled pair in brackets, followed by a right arrow and the text 'Double\
    \ word', like this [<i>this-> Double word].\n\nTo check a text file for doubled\
    \ words only, and not for any of the other things diction checks, use grep to\
    \ find only those lines in diction's output that contain the text 'Double word',\
    \ if any.\n\n+   * To output all lines containing doubled words in the file 'dissertation',\
    \ type:\n  $ diction dissertation | grep 'Double word' RET\n\n# 11.3 Checking\
    \ Text for Readability\n\nThe style command analyzes the writing style of a given\
    \ text. It performs a number of readability tests on the text and outputs its\
    \ results, and it gives some statistical information about the sentences of the\
    \ text. Give it as an argument the name of the text file to check.\n\n+   * To\
    \ check the readability of the file 'dissertation', type:\n  $ style dissertation\
    \ RET\n\nLike diction, style reads text from the standard input if no text is\
    \ given — this is useful for the end of a pipeline, or for checking the writing\
    \ style of a particular sentence or other you type.\n\nThe sentence characteristics\
    \ of that text style outputs are as follows:\n\n+   * Number of characters\n*\
    \ Number of words, their average length, and their average number of syllables\n\
    * Number of sentences and average length in words\n* Number of short and long\
    \ sentences\n* Number of paragraphs and average length in sentences\n* Number\
    \ of questions and imperatives\n\nThe various readability formulas for style uses\
    \ and outputs are as follows:\n\n+   * Kincaid formula, originally developed for\
    \ Navy training manuals; a good readability for technical documentation\n* Automated\
    \ Readability Index (ARI)\n* Coleman-Liau formula"
