    This command opens a copy of The GNU tar manual in Info give the name of the file
    with the ''-f'' option. This is useful for reading an Info file that you have
    obtained elsewhere, and is not in the ''/usr/info'' directory with the rest of
    the installed files. Info can recognize and expand Info files that are compressed
    and have a ''.gz'' file name extension (see Recipe 8.5 [Compressed Files], page
    102).


    +   To read faq.info, an Info file in the current directory, type:


