    # 4.6.2 Running X Clients Automatically


    The ''.xsession'' file, a hidden session in your home directory, specifies the
    clients that are automatically run when your X session starts (''hidden'' files
    are explained in Chapter 5 [Files and Directories], page 65. It is just a shell
    script, usually containing a list of clients to run. You can edit your ''.xsession''
    file in a text editor, and if this file does not exist, you can create it.


    Clients start in the order in which they are listed, and the last line should
    specify the window manager to use. The following example ''.xsession'' file starts
    an xterm with a black background and white text, puts an ''oclock'' (a round clock)
    window in the upper left-hand corner. Starts the Emacs text editor, and then starts
    fwm2 window manager:


    ```

    #!/bin/sh

    #

    # A sample .xsession file.


    xterm -bg black fg white &

    clock -geometry +0+0

    emacs &

    exec /usr/bin/X11/fwm2 &

    ```


    All clients start as background jobs, with the exception of the window manager
    on the last line, because this file runs. The X session is running in the foreground
    (see Recipe 3.3 [Managing Jobs], page 40). Always put an ampersand (''&'') at
    the end of any command you put in your ''.xsession'' file, except for the line
    giving the window manager on the last line.


    # 4.6.3 Changing the Root Window Parameters


    By default, the root window is painted gray with a woven pattern. To draw these
    patterns, X tiles the root window with a bitmap, which is a black-and-white image
    stored in a special format. X comes with some bitmaps installed in the ''/usr/X11R6/include/bitmaps/''
    directory; the default bitmap file is ''root_weave'' that you can make your own
    patterns with the bitmap tool: see Recipe 18.4 [Interactive Image Editors and
    Tools], page 226.'
