    \n| CHARACTER | DESCRIPTION |\n|---|---|\n| hyphen part of a bracketed list denotes\
    \ a range of characters to match so [a-m] matches any of the lowercase letters\
    \ from 'a' through 'm'. To match a literal hyphen, use it as the first or last\
    \ character in the list. For example, a[-b]c matches the files 'a-c' and 'abc'.\
    \ |\n\nPut an exclamation point at the beginning of a bracketed list to match\
    \ all characters except those listed. For example, a[!b]c matches all files that\
    \ begin with an 'a' character, end with a 'c' character, and have any one character,\
    \ except a 'b' character, in between; it matches 'aac', 'a-c', 'adc' and on.\n\
    \nYou can combine these special expansion characters in any combination, and you\
