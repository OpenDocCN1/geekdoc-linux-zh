    $ history (RET)

    1 who

    2 apropos shell >shell-commands

    3 apropos bash >bash-commands

    4 history

    $

    ```


    This command shows the contents of your command history file, listing one command
    per line prefaced by its event number. Use an event number to specify that event
    in your history (see Recipe 3.4.2 [Specifying a Command from Your History], page
    44).


    If your history is a long one, this list will scroll off the screen, in which
    case you may want to pipe the output to less in order to peruse it. It''s also
    common to search for a past command by piping the output to grep (see Recipe 3.4.2
    [Redirecting Output to Another Command''s Input], page 40 and Recipe 14.1 [Searching
    for a Word or Phrase], page 165).


    +   - To search your history for the text ''apropos'', type:


    ```

    $ history | grep apropos (RET)

    2 apropos shell >shell-commands

    3 apropos bash >bash-commands

    5 history | grep apropos

    ```


    This command will show the events from your history containing the text ''apropos''.
    (The last line of output is the command you just typed.)


    # 3.4.2 Specifying a Command from Your History


    You can specify a past event from your history on the input line, or use the up
    and down arrow keys at the shell prompt to browse your history. The up arrow key
    (↑) takes you back through past events, and the down arrow key (↓) moves you forward
    into recent history. When a history event is on the input line, you can edit it
    as normal, and type (RET) to run it as a command; it will become the newest event
    in your history.


    +   - To specify the second-to-last command in your history, type:


    ```

    $ (↑) (↓)

    ```


    To run a history event by its event number, enter an exclamation point (''!''),
    called "bang" (Get the event number by viewing your history; see Recipe 3.4.1
    [Viewing Your Command History], page 43).


    +   - To run history event number 1, type:


    ```

    $ !! (RET)

    ```'
