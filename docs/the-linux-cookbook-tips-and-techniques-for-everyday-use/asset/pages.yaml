  md: '# Chapter 25: Printing


    -k Print crop marks.


    -l last Specify the last page number to print.


    -m Use the manual feed tray.


    -p first Specify the first page to begin printing from.


    -r Reverse the order of the pages.


    -t format Specify paper size and format; valid options include ''letter'', ''legal'',
    ''a4'', and ''landscape''. (You can use this option twice, to specify both ''legal''
    and ''landscape'').


    Using the ''-m'' option and specifying landscape as the paper format with the
    ''-t'' option is very useful for printing on envelopes.


    +   To print the file ''envelope.dvi'' on an envelope loaded in the manual feed
    tray of the default printer,


    ```

    $ dvips -m -t landscape envelope.dvi

    ```


    NOTE: You can also print DVI files with 1pr using the ''-d'' option.


    # 25.2.3 Printing the Contents of an Xterm Window


    To print the contents of an xterm window, press and hold (CTRL) and left-click
    anywhere inside the window, and choose the Print Window option. This command will
    send all of the text in the current window to the default printer.


    # 25.3 Preparing Files for Printing


    Not all printers recognize all output formats, so it''s sometimes necessary to
    convert files before you print them.


    Normally, you can print plain text on any printer. However, most graphics or image
    files must be converted to PostScript or EPS (Encapsulated PostScript). Some applications—such
    as TeX—produce DVI output; in this case you convert to PostScript for printing.
    Filters like ''magicfilter'' make the conversion easier by doing this work for
    you, but they''re not a panacea, since your system may use one of many great filters.
    Hence, the need for the following recipes.


    If you have a PostScript printer, you can print PostScript files directly to it.
    If not, you''ll need to convert the PostScript output to a format your printer
    uses. Filter programs


    # 25.3.1 Preparing a PostScript File for Printing


    Debian: ''gs''

    WWW: http://www.gnu.org/pub/gnu/ghostscript/


    If you don''t have a PostScript printer, you can use Ghostscript, gs, to convert
    PostScript to an output format that your printer understands.


    Use the ''-?'' option to list the printers that the version of gs installed on
    your system can write output for.'
