    tree. Remember, before you remove it, you must first unmount it.


    # 24.3.3 Unmounting a Floppy Disk


    Use um to unmount a floppy disk, using the name of the directory it is mounted
    on as an argument:


    +   - To mount the floppy that is mounted on ''/floppy'', type:


    ```

    $ mount /floppy

    ```


    NOTE: You can''t unmount a disk if your current working directory, the directory
    you are in, is somewhere in trying to unmount the disk will give the error that
    the ''/floppy'' filesystem is in use; change to a different directory that is
    not in the ''/floppy'' directory tree, and then you can unmount the disk.


    Sometimes when you unmount a floppy, the light on the drive will go on and remain
    for a few seconds after it has been unmounted. This is because Linux sometimes
    changes to files in memory before it writes them to the disk; it''s making sure
    that the files on the floppy are up-to-date. Simply wait until the light goes
    off before you remove the floppy from the drive.


    # 24.4 CD-ROMs


    As with floppy disk, before you can use a data CD (compact disc) on your system,
    you must first mount it on an empty directory. You then unmount it from the directory
    before you can eject the CD from the CD-ROM drive (you can also eject the disk
    using software—see Recipe 22.1.6 [Ejecting an Audio CD], page 251).


    NOTE: To use audio CDs, see Chapter 22 [Audio Discs], page 249.


    # 24.4.1 Mounting a CD-ROM


    To mount a CD-ROM on the system, use with the ''/cdrom'' option.


    +   - To mount a CD-ROM on the system, type:


    ```

    $ mount /cdrom

    ```


    This command makes the contents of the CD-ROM available from the ''/cdrom'' directory
    tree. You can use any Linux command to find the files and directories on a CD-ROM,
    but you can''t write to a CD-ROM—the CD format is read-only, so you can read the
    disk but not write to it.


    2 This is sometimes called being ''under the mount point'' of the disk.

    3 This works if your administrator has set up the CD-ROM drive filesystem for
    user access—see Recipe A.3.2 [Letting Users Access Hardware Peripherals], page
    363.'
