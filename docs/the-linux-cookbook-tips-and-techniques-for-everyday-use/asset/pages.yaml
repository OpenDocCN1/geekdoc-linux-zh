    # 14.2 Regular Expressions—Matching Text Patterns


    In addition to word and phrase searches


    Technically speaking, the word or phrase patterns described in the previous section
    are regular expressions—just very simple ones. In a regular expression, most characters—including
    letters and numbers represent themselves. For example, the regex pattern 1 matches
    the string ''1'', and the pattern bee matches the string ''bee''.


    There are many reserved characters called metacharacters that don''t represent
    themselves in a regular expression, but each has a special meaning that is used
    to build complex patterns. These metacharacters are as follows: ., ^, $, |, &


    To specify one of these literal characters in a regular expression, precede the
    character with a \.


    +   * To out lines in the file ''catalog'' that contain a ''$'' character, type:


    ```

    $ grep ''\$\$'' catalog

    ```


    +   * To out lines in the file ''catalog'' that contain the string ''$1.99'',
    type:


    ```

    $ grep ''\$1.99'' catalog

    ```


    +   * To out lines in the file ''catalog'' that contain a ''\'' '' character,
    type:


    ```

    $ grep ''\\'''' catalog

    ```


    The following table describes the special meanings of the metacharacters and gives
    examples of their usage.


    | METACHACTER | MEANING |

    | . | Matches any character, with the exception of the newline character. For
    example, matches ''a'', ''1'', ''?'', ''.'' (a literal period character), and
    so forth. |

    | * | Matches the preceding regexp zero or more times. For example, matches ''-'',
    ''--'', ''---'', and so forth. Imagine a line of text with a million characters
    where in it, all marching off across the horizon, up into the blue sky, A million
    ''-'' characters in a row. This pattern would match it. Now think of the same
    long parade, but it''s a million and one ''-'' characters it matches that, too.
    |'
