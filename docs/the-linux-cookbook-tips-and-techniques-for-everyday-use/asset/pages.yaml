  md: '# 13 Formatting Text


    Methods and tools for changing the arrangement or presentation of text are often
    useful for preparing text for printing. This chapter discusses ways of changing
    the spacing of text and setting up pages, of underlining and sorting and reversing
    text, and of numbering lines of text.


    # 13.1 Spacing Text


    These recipes are for changing the spacing of text—the whitespace that exists
    between words, lines, and paragraphs.


    The filters described in this section send output to standard output by default;
    save their output to a file, use shell redirection (see Recipe 3.2.2 [Redirecting
    Output to a File], page 39).


    # 13.1.1 Eliminating Extra Spaces in Text


    To eliminate extra whitespaces within lines of text, use the fmt filter; to eliminate
    extra whitespace between lines of text, use cat.


    Use fmt with the ''-u'' option to output text with "uniform spacing," where the
    space between words is reduced to one space character and the space between sentences
    is reduced to two space characters.


    +   To output the file ''term-paper'' with uniform spacing, type:


    ```

    $ fmt -u term-paper RET

    ```


    Use cat with the ''-s'' option to "squeeze" multiple adjacent blank lines into
    one.


    +   To output the file ''term-paper'' with multiple blank lines output as only
    one blank line, type:


    ```

    $ cat -s term-paper RET

    ```


    You can combine both of these commands to output text with multiple adjacent lines
    removed and give it a unified spacing between words. The following example shows
    how the output of the combined commands is sent to less so that it can be perceived
    on the screen.


    +   To peruse the file ''term-paper'' with multiple blank lines removed and giving
    the text unified spacing between words, type:


    ```

    $ cat -s term-paper | fmt -u | less RET

    ```


    Notice that in this, both fmt and less worked on their standard input instead
    of a file—the standard output of cat (the contents of ''term-paper'' with extra
    blank lines squeezed out) was passed to the standard input of fmt, and its standard
    output (the space-squeezed ''term-paper'', now with uniform spacing) was sent
    to the standard input of less, which displayed it on the screen.'
