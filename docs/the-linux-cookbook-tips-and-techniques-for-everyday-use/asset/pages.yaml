  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    The collective family of TeX and related programs are sometimes called “TeX friends,”
    and abbreviated as “texmf” in TeX references; for example, the supplementary files
    included with the bare TeX system are in the `/usr/lib/texmf/` directory.


    The following recipes describe how to begin writing for TeX and how to process
    these files for viewing and printing. While not everyone needs or even has to
    write documents with TeX and LaTeX, these formats are widely used—especially on
    Linux systems—so every Linux user has the potential to encounter one of these
    files, and ought to know how to process them.


    NOTE: “TeX” doesn’t sound like the name of a cowboy, nor “LaTeX” like a kind of:
    the letters ‘T,’ ‘E,’ and ‘X’ represent the Greek characters tau, epsilon, and
    chi (from the Greek ‘techne’, meaning art and science). So last sound in “TeX”
    is the ‘ch’ in ‘Bach,’ and “LaTeX,” depending on local dialect, is pronounced
    either ‘lay-tech’ or ‘lah-tech’. Those who become highly adept at using the system,
    Knuth calls TeXnicians.


    # 15.4.1 Is It a TeX or LaTeX File?


    There are separate commands for processing TeX and LaTeX files, and they’re not
    interchangeable, so when you process a TeX or LaTeX input file, you should determine
    its format.


    By convention, TeX files always have a `.tex file extension. LaTeX input files
    sometimes have a `.latex` or `.sty file name extension, but not always one way
    to tell if a .tex file is in LaTeX format is to use grep to search the file for
    the text “document”, which every LaTeX (and not TeX) document will have. So if
    it outputs any lines that match, you have a LaTeX file (The regular expression
    to use with grep is \document), since backslash characters must be specified with
    two backslashes.)


    +   - To determine whether the file gentle.tex is a TeX or LaTeX file, type:


    ```

    $ grep ''\document'' gentle.tex

    ```


    In this example, grep didn’t return any matches, so it’s safe to assume that ‘gentle.tex’
    is a TeX file and not a LaTeX file.


    NOTE: For more on grep and searching for regular expressions, see Recipe 14.2
    [Regular Expressions Matching Test Patterns], page 166.


    # 15.4.2 Processing TeX Files


    Use tex to process TeX files. It takes as an argument the name of the TeX source
    to process, and it writes an output file in DVI (“Device Independent”) format,
    with the same base name as the source, but with a .dvi extension.


    +   - To process the file gentle.tex, type:


    ```

    $ tex gentle.tex

    ```


    Once you have produced a DVI output file with this method, you can do the following
    with:


    +   1. The ‘mf’ also stands for “Metafont,” the name of the font language that
    is part of TeX.'
