  md: "# The Lexical Cookbook: Tips and Techniques for Everyday Use\n\nWordNet is\
    \ a lexical reference system in the form of a database containing thousands of\
    \ words arranged in synonym sets. You can search the database and output the results\
    \ in text with the **wn** tool or the **wnb** client (“WordNet browser”).\n\n\
    Use of the client is fairly straightforward— type a word in the dialog box near\
    \ the top of the screen, followed by RET to get its definition(s), which are displayed\
    \ in the large output window underneath the dialog box.\n\nFor example, this is\
    \ what appears when you do a search for the definition of the word ‘browse’:\n\
    \n![](img/3658df520e459cc83b744521428473cf_163_0.png)\n\nBetween the dialog box\
    \ and the output window, there are menus for searching for synonyms and other\
    \ word senses. A separate menu is given for each part of speech a word may have;\
    \ in the example, the word ‘browse’ can be either a noun or a verb, so two menus\
    \ are shown.\n\nTo get a list of all word sense information for a given word,\
    \ run wn with the name of the word as an argument. This outputs a list of all\
