    \ the current working directory, type:\n  `$ cd `RET`\n\n# 5.2.2 Changing to the\
    \ Last Directory You Visited\n\nTo return to the last directory you were in, use\
    \ `cd` and give `-` as the directory name. For example, if you are in the `/home/mrs/work/samples`\
    \ directory, and you use `cd` to change to some other directory, then at any point\
    \ while you are in this directory you can use `cd -` to return the current working\
    \ directory to `/home/mrs/work/samples`.\n\n+   To return to the directory you\
    \ were last in, type:\n  `$ cd `RET`-\n\n# 5.2.3 Getting the Name of the Current\
    \ Directory\n\nTo determine what the current working directory is, use `pwd` (\"\
    print working directory\\ which lists the full path name of the current working\
    \ directory.\n\n+   To determine what the current working directory is, type:\n\
    \n```\n$pwd `RET`\n/home/mrs\n$\n```\n\nIn this example, `pwd` output the text\
    \ `/home/mrs`, indicating that the current directory is `/home/mrs`.\n\n# 5.3\
    \ Listing Directories\n\nDebian: `mc`\nDebian: `mozilla`\nWWW: `http://gnome.org/mc/`nWWW:\
    \ `http://www.mozilla.org/`\n\nUse `ls` to list the contents of a directory. It\
    \ takes as arguments the names of the directories to list. With no arguments,\
    \ `ls` lists the contents of the current working directory.\n\n+   To list the\
