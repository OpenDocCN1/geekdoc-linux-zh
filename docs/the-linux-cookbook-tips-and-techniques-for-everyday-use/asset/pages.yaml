  md: '# 5 Files and Directories


    This chapter discusses the basic tools for manipulating files and directories
    — tools that are among the most essential on a Linux system.


    A file is a collection of data that is stored on disk and that can be manipulated
    as a single unit by its name.


    A directory is a file that acts as a folder for other files. A directory can also
    contain other directories (subdirectories); a directory that contains another
    directory is called the parent directory of the directory it contains.


    A directory tree includes a directory and all of its files, including the contents
    of all subdirectories. (Each directory is a "branch" in the "tree.”) A slash character
    alone (''/'') is the name of the root directory at the base of the directory tree
    hierarchy; it is the trunk from which all other files or directories branch.


    The following image shows an abridged version of the directory hierarchy.


    ![](img/3658df520e459cc83b744521428473cf_88_0.png)


    To represent a directory''s place in the file hierarchy, specify all of the directories
    between it and the root directory, using a slash (''/'') as the delimiter to separate
    directories. So the directory ''dict'' as it appears in the preceding illustration
    would be represented as ''/usr/dict''.


    Each user has a branch in the ''/home'' directory for their own files, called
    their home directory. The hierarchy in the previous illustration has two home
    directories: ''joe'' and ''jon'', both subdirectories of ''/home''.


    When you are in a shell, you are always in a directory on the system, and that
    directory is called the current working directory. When you first log in to the
    system, your home directory is the current working directory.


    Whenever specifying a file name as an argument to a tool or application, you can
    give the slash-delimited path name relative to the current working directory.
    For'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    example, if ''/home/joe'' is the current working directory, you can use work to
    specify the directory ''/home/joe/work'', and work/schedule to specify ''schedule'';
    a file in the ''/home/joe/work'' directory.


    Every directory has two special names which consist of one and two periods: ''..''
    refers to the parent of the current working directory, and ''.'' refers to the
    current working directory itself. If the current working directory is ''/home/joe'',
    you can use ''.'' to specify ''/home/joe'' and ''..'' to specify ''/home/jon''
    directory as ..


    Another way to specify a file name is to specify a slash-delimited list of all
    of the directories from the root directory (''/'') down to the file to specify.
    This unique, specific path from the root directory to a file is called the full
    path name. Referring to a file that is not a directory, this is sometimes called
    the absolute file name.


    You can specify any file or directory on the system by giving its full path name.
    A file can have the same name as other files in different directories on the system,
    but you can have a file ''schedule'' in his ''/home/joe/work'' directory and a
    file ''/home/joe/play'' in different directories. While both files have the same
    name ''schedule'', they are contained in different directories, and each has a
    unique path name ''/home/joe/work/schedule'' and ''/home/joe/play/schedule''.


    However, you don''t have to type the full path name of a tool or application in
    order to start it. It shells the path. If a program is in "your path" or in one
    of these directories, you can run it simply by typing its name.


    By default, the path includes ''/bin'' and ''/usr/bin''. For example, the command
    who is in the ''/usr/bin'' directory, so its full path name is /usr/bin/who. Since
    ''/usr/bin'' is in your path, you can run who to /usr/bin/who, no matter what
    the current working directory is.


    The following table describes some standard directories on Linux systems.


    | DIRECT | DESCRIPTION |

    | --- | --- |

    | / | The ancestor of all directories on the system: all other directories are
    subdirectories of this directory, either directly or through other subdirectories
    |

    | /bin | Essential tools and other programs (or binaries).

    | /dev | Files representing the system''s hardware devices. For example, you use
    the file ''/dev/cdrom'' to access the CD-ROM drive. |

    | /etc | Miscellaneous system configuration files, startup files, etc. |

    | /home | The home directories for all of the system''s users.

    | /lib | Essential system library files used by tools in ''/bin''.

    | /proc | Files that give information about current system processes. |'
