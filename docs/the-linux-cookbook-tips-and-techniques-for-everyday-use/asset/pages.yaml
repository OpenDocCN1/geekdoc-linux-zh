  md: '# 238 The Linux Cookbook: Tips and Techniques for Everyday Use


    +   - To rearrange the pages of file ''newsletter.ps'' into a signature and write
    it to the file ''newsletter.bound.ps'', type:


    ```

    $ psbook newsletter.ps newsletter.bound.ps RET

    ```


    Default, psbook uses signature for the entire file. If the file doesn''t contain
    a multiple of four pages, it adds back pages to the end.


    To specify the size of the signature to use—in other words, the number of pages
    that will appear on a single piece of paper—give the number as an argument to
    the ''-s'' option. Signature size is always a multiple of four.


    +   - To rearrange the pages of file ''newsletter.ps'' into an eight-sided signature
    and write it to ''newsletter.bound.ps'', type:


