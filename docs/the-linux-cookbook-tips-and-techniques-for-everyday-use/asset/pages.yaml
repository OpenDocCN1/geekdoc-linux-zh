  md: '# 7.2.2 Finding Files in a Directory Tree by Size


    To find files of a certain size, use the ''-size'' option, following it with the
    file size to match. The file size takes one of three forms: when preceded with
    a plus sign (+), it matches all files *greater* than the given size; when preceded
    by a hyphen or minus sign (-), it matches all files *less* than the given size;
    with neither prefix, it matches all files whose size is *exactly* as specified.
    (The default unit is 512-byte blocks; follow size with ''k'' to denote kilobytes
    or ''b'' to denote bytes).


    +   - To list all files in the ''/usr/local'' directory tree that are greater
    than 10,000 kilobytes in size, type:


    ```

    $ /usr/local -size +10000k

    ```


    +   - To list all files in your home directory tree less than 300 bytes in size,
    type:


    ```

    $ ~ -size -300b

    ```


    +   - To list all files on the system whose size is exactly 24 512-byte blocks,
    type:


    ```

    $ / -size 42

    ```


    Use the ''-empty'' option to find empty files whose size is 0 bytes. This is useful
    for finding files that you might not need, and can remove.


    +   - To list all empty files in your home directory tree, type:


    ```

    $ ~ -empty

    ```


    NOTE: For the largest or smallest files in a given directory, output a sorted
    listing of that directory (see Recipe 7.3 [Finding Files in Directory Listings],
    page 96).


    # 7.2.3 Finding Files in a Directory Tree by Modification Time


    To find files last modified during a specified time, use find with the ''-mtime''
    or ''-mmin'' argument; the argument ''-mtime'' specifies the number of 24-hour
    periods, and with ''-mmin'' specifies the number of minutes.


    +   - To list the files in the ''/usr/local'' directory tree that were modified
    *exactly 24 hours ago*, type:


    ```

    $ /usr/local -mtime 1

    ```


    +   - To list the files in the ''/usr/local'' directory tree that were modified
    *exactly* five minutes ago, type:


    ```

    $ /usr/local -mmin 5

    ```


    To specify a range of time, precede the number you give with either a plus sign
    (+) to match times that are equal to or greater than the given argument, or a
    hyphen or minus sign (-) to match times that are equal to or less than the given
    argument.


    +   - To list the files in the ''/usr/local/'' directory tree that were modified
    *within* the past 24 hours, type:


    ```

    $ /usr/local -mtime -1

    ```


    +   - To list the files in the ''/usr/local/'' directory tree that were modified
    *within* the last five minutes, type:'
