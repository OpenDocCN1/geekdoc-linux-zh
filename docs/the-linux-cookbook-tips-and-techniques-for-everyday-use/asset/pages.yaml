  md: '# 2.2 Accounts and Privileges


    Linux is a multi-user system, meaning that many users can use one Linux system
    simult-

    eously, from different terminals. To avoid confusion (and to maintain a semblance
    of

    privacy), each user''s workspace must be separate from the others.


    If a particular Linux system is a stand-alone personal computer with no other

    terminals physically connected to it, it can be shared by different people at
    different times,

    making the separation of user workspace still hold a valid use.


    This separation is accomplished by giving each individual user an account on the
    system.

    You need an account in order to use the system; with an account you are issued
    an individual

    user workspace, and a unique username that identifies you to the system and to
    other

    users. It is not that the name (and those who use it) will forever know you as;

    it''s a single word, in all lowercase letters.


    During the installation process, the system administrator should have created
    an account

    for you. (The system administrator has a special account username is root; this

    account has total access to the entire system, so it is often called the superuser.)


    Until the mid-1990s it was widely common for usernames to be the first letter
    of your

    first name followed by your entire name, up to 12 characters total. For example,
    user

    Samuel Clemens would have a username of clemens for this; however,

    it is not a hard and fast rule, especially on home systems where you may be the
    only user.

    Sometimes, a middle initial may be "dkjohnson", "xibo" or sometimes nicknames

    nitials are "zenboy". But whatever username you pick for yourself, make

    sure it''s one you can live with, and one you can stand by both the system and

    other users (your username also becomes part of your email address, we''ll see
    in

    Chapter 30 [Email], page 315.


    In addition to your username, you should also have a password that can keep secret

    so that only you can use your account. Good passwords are strings of text that
    nobody else

    is likely to guess (i.e., not obvious words like ''secret'', or identifying names
    like ''Ruski'',

    if happens to be your pet cat). A good password is one that is highly memorable

    or complex enough in construction so that anyone else could ever guess it. For
    example, ''t39Steps'' might be a fine password for

    some whose first date was to see the Movie 39 Steps directed by Alfred Hitchcock.


    NOTE: While usernames are always in lowercase, passwords are case sensitive; the
    passwords

    ''Secret'', ''secret'', and ''SECRET'' are all different.


    # 2.2.1 Logging In to the System


    To begin a session on a Linux system, you need to log in. This is done by entering
    your username

    at the login: prompt appears on your terminal, and then entering your password
    when asked.


    The login: prompt appears on the terminal after the system boots. If your system

    is configured to start the X Window System at boot time, you will be presented
    with an X

    login screen instead of the standard login prompt. If that happens, press CTRL-ALT-FI

    to switch to the text login screen; this is explained further in Recipe 2.3 [Console
    Basics],npage 20.


    A typical login: prompt looks like this:'
