    Debian: ''unhtml''

    Debian: ''html2ps''

    WWW: http://dragon.acaciaau.ca/~013639s/

    WWW: http://www.tdb.uu.se/~jan/html2ps.html


    There are several ways to convert HTML to other formats. You can convert HTML
    to plain text for reading, processing, or conversion to still other formats: such
    you can also convert the HTML to PostScript, which you can view, print, or also
    convert to other formats, such as PDF.


    To remove the HTML formatting from text, use unhtml. It reads from the standard
    input (or a specified file name), and writes its output to standard output, type:


    +   - To peruse file ''index.html'' with its HTML tags removed:

    ```

    $ unhtml index.html | less

    ```

    - To remove the HTML tags from the file ''index.html'' and write the output to
    a file called ''index.txt'', type:

    ```

    $ unhtml index.html > index.txt

    ```


    When you remove the HTML tags from a file with unhtml, no further formatting is
    done to the text. Furthermore, it only works on files, not on URLs themselves.


    Use lynx to convert an HTML file or a URL as a formatted text file, so that the
    result looks like the original HTML when viewed in lynx. It can also preserve
    italics and hyperlink information in the original HTML. See Reference 31.3.1 [Perusing
    Text from the Web], page 331.


    One thing you can do with this lynx output is to use tools for spacing text, and
    then that for setting in fonts. This is useful for printing a Web page in typeset
    ''manuscript'' with images and graphics rendered and set double-spaced in a Courier
    font.


    +   - To print a copy of the URL http://example.com/essay/ in typescript form,
    type:

    ```

    $ lynx -dump --underscore nolist http://example.com/essay/ | pr -d

    | encript -B

    ```


    NOTE: In some cases, you might want to edit the file before you print it, such
    as when a Web page contains navigation bars or text that you want to remove before
    you turn it into a manuscript. In such a case, you pipe the lynx output to a file,
    edit the file, and then use pr on the file and pipe that output to encrypt for
    printing.


    Finally, you can use html2ps to convert an HTML file to PostScript; this is useful
    when you want to print a Web page with all its graphics and images, or when you
    want to convert'
