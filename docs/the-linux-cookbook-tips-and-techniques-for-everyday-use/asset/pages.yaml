  md: '# Chapter 17: Viewing Images


    The mouse buttons have special meaning in display. Left-click on the image window
    to open the display command menu in a new window. The display command menu looks
    like this:


    ![](img/3658df520e459cc83b744521428473cf_232_0.png)


    Menu items let you change the image size and otherwise change or transform the
    image display. Choose Overview from the Help menu for an explanation of the various
    available display commands.


    Middle-click on the image to open a new window with a magnified view of the image
    centered where you click. For example, middle-clicking on the sailboat image in
    the previous example will open a new window that looks like this:


    ![](img/3658df520e459cc83b744521428473cf_232_1.png)


    Finally, right-click on the image window for a pop-up menu containing a few of
    the most frequently-used commands; to choose one of these commands, drag the mouse
    pointer over the command. Commands in the pop-up menu include Quit, which exits
    display, and'
  merge: -1
