  md: "# Chapter 7: Finding Files\n\n# 7.3.5 Finding the Number of Files in a Listing\n\
    \nTo find the number of files in a directory, use `ls` and pipe the output to\
    \ `wc -1`, which outputs the number of lines in its input (see Recipe 12.1 (Counting\
    \ Text), page 149).\n\n+   * To output the number of files in the current directory,\
    \ type:\n\n```\n$ ls | wc -1 RET\n19\n$ \n```\n\nIn this example, the command\
    \ outputs the text '19', indicating that there are 19 files in the current directory.\n\
    \nSince `ls` does not list hidden files by default (see Recipe 5.3.4 [Listing\
    \ Hidden Files], page 73), the preceding command does not count them. Use `ls`s\
    \ `-A` option to count dot files as well.\n\n+   * To count the number of files—including\
    \ hidden files—in the current directory, type:\n\n```\n$ ls -A | wc -1 RET\n81\n\
    $ \n```\n\nThis command outputs the text '81', indicating that there are 81 files,\
    \ including hidden files, in the current directory.\n\nTo list the number of files\
    \ in a given directory `tree`, and not just a single directory, use `find` instead\
    \ of `ls`. Give the special `find` predicate `-type d` to exclude the listing\
    \ (and therefore, counting) of directories.\n\n+   * To list the number of files\
    \ in the `/usr/share/` directory tree, type:\n\n```\n$ find /usr/share | -type\
    \ d | wc -1 RET\n```\n\n+   * To list the number of files and directories in the\
    \ `/usr/share/` directory tree, type:\n\n```\n$ find /usr/share | wc -1 RET\n\
    ```\n\n+   * To list the number of `directories` in the `/usr/share/` directory\
    \ tree, type:\n\n```\n$ find /usr/share | -type f | wc -1 RET\n```\n\n# 7.4 Finding\
    \ Where a Command Is Located\n\nUse which to find the full path of a tool or application\
    \ from its base name; when you give the base name as an option, `which` outputs\
    \ the absolute file name of the command that would have run you it. This is useful\
    \ when you are not sure whether or not a particular command is installed on the\
    \ system.\n\n+   * To find out `perl` is installed on your system, and if so,\
    \ where it resides, type:\n\n```\n$ which perl RET\n/usr/bin/perl\n```"
  merge: -1
