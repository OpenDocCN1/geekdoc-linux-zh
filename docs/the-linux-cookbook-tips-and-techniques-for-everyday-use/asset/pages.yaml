  md: '# Chapter 14: Searching Text


    # 14.2.11 Regexps for Common Situations


    The following table lists sample regexps and describes what they match. You can
    use these regexps as boilerplate when building your regular expressions for searching
    text. Remember to enclose regexps in quotes.


    | TO MATCH LINES THAT ... | USE THIS REGEXP |

    | contain zeros in a row | ^0\{9\}$ |

    | are exactly four characters long | ^.{4}$ or ^\.{4\}$ |

    | are exactly seven characters long | ^\.{7\}$ |

    | begin with an asterisk character | ^\\* |

    | begin with ''tow'' and end with ''ing'' | ^tow\.ing$ |

    | contain a number | [0-9] |

    | do not contain a number | ^[0-9]*$ |

    | contain a year from 1991 through 1995 | 199[1-5] |

    | contain a year from 1957 through 1969 | \(195[7-9])\\|\\(196[0-9])\\ |

    | contain ''.txt'' or ''.text'' | \.te\?txt |

    | contain ''cat'' then ''gory'' in the same line | cat\.\gory |

    | contain ''cat'' then ''gory'' in the same line | cat\..+\*gory |

    | contain a ''q'' not followed by a ''u'' | q[^u] |

    | contain any ftp, gopher, or ''http'' URLs | ^(ftp|gopher|http\):://\*..*$ |

    | contain ''N'', ''T'', and ''K'', with zero or more characters between each |
    N\.*T\.*K |


    # 14.3 Searching More than Plain Text Files


    The following recipes are for searching data other than in plain text files.


    # 14.3.1 Matching Lines in Compressed Files


    Use grep to search through text files that are compressed. These files usually
    have a ''.gz'' file extension, and can''t be searched or otherwise read by other
    tools without uncompressing the first (for more about compressed files, see Recipe
    8.5 [Compressed Files], page 102).


    The zgrep tool works just like grep, except it searches through the text of compressed
    files. It outputs matches to the given pattern as if you searched through normal,compressed
    files. It leaves the compressed file when done.


    +   - To search through the compressed file ''README.gz'' for the text ''Linux'',
    type:


    ```

    $ zgrep Linux README.gz (RET)

    ```'
