  md: '271


    # 25 Printing


    Debian: ''magicfilter''


    The usual way to print on a Linux system is to send a print job to the printer
    with lpr, as described below in Recipe 25.1.1 [Sending a Print Job to the Printer],
    page 272.


    But you don''t always send a file straight to the printer—sometimes you may want
    to add special things to before you print it, such as headers or graphic tint.
    For example, you might want to split a file into pages and add a header to the
    top of each page containing the file name and page number; all of this is described
    in Chapter 13 [Formatting Text], page 155.


    Sometimes you may need to convert or prepare a file so that it can be printed
    on your particular printer, since not all printer hardware can print the same
    kinds of file formats. In this chapter show how to do this, such as convert PostScript
    files so that they will print properly on non-PostScript printer (see Recipe 25.3
    [Preparing Files for Printing], page 275).


    This also shows how to format PostScript files for printing. To convert text to
    PostScript and enhance it for printing, by adding fonts, graphic headers, and
    the like, see Recipe 15.2 [Converting Plain Text for Output], page 179.


    And this chapter isn''t in the sections below, because you can print things that
    aren''t in a file—for example, you can pipe the output of another tool or series
    of tools to lpr, and it will spool that output to the printer. This usage is usually
    very common.


    NOTE: When a printer is properly configured on Linux, it is a pleasure to use,
    but a misconfigured printer can lead to all kinds of trouble—including the dreaded
    "staircase effect," where a text file prints with each subsequent line of output
    offset to the right by the length of the previous line.


    If services haven''t been configured yet on your system, I strongly recommend
    that the ''magicfilter'' package be installed: it includes filters for the automatic
    detection of file types—when you print a file, it automatically converts to the
    proper format for your printer.


    Comprehensive details on the setup of printer resources can be found in the Printing
    HOWTO and the Printing Usage HOWTO (see Recipe 25.8 [Reading System Documentation
    and Help Files], page 32).


    # 25.1 Making and Managing Print Jobs


    The traditional way to print on Linux-based systems is to send a print job for
    the file or data you want to print to the spool queue for the printer in question.
    The spool queue contains all of the print jobs sent to by all users; these jobs
    are released in turn to the printer device as it becomes available. In this way,
    Linux can handle multiple print jobs going to the same printer at.


    The following recipes show how to make and manage print jobs. In practice, you
    will probably send print jobs all the time—since this is the way printing is done
    in Linux and use the tools for listing or cancelling jobs rarely. Sometimes things
    do go wrong, and it helps to know what to do when that happens.'
  merge: -1
  pgno: 294
