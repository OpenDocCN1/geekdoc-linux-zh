    # 30.2.2 Options Available while Reading Mail


    The following table summarizes the most common mail commands for reading mail;
    these commands work at the ''&'' prompt.


    | COMMAND | DESCRIPTION |

    | --- | --- |

    | ? | Output a help menu containing a list of mail options and their meanings.
    |

    | d | Delete a message. Give the number or range of the message(s) to delete as
    an argument. |

    | h | Output a list of headers of mail messages. You can specify a range or the
    number of the message to start with. |

    | q | Exit mail and apply the changes you have made in this mail session to your
    INBOX. |

    | r | Reply to the message you last read; you can also give a message number as
    an argument to reply to that message number. |

    | u | Undelete a message you have deleted in the current mail session. Give the
    number or range of the message(s) to be deleted as an argument. |

    | x | Exit mail and revert the INBOX to its state before this mail session. |

    | file | Save the message you last read to your home directory specified by file
    (if the file does not exist, mail will ask you whether or not it should create
    it). |


    NOTE: By default, only you (and, always, the superuser) have access to read your
    INBOX. While there tools are available (such as mail, and the other MUAs) to read
    this file in special ways, you can also view this file like any other text file
    (see Chapter 9 [Viewing Text], page 111).


    # 30.3 Managing Mail


    A mail folder is a simple text file whose contents consist of saved mail messages;
    any tool that works on text can be used on a mail folder.


    The following subsections describe some of the common ways to manage and otherwise
    modify your saved mail.'
  merge: -1
