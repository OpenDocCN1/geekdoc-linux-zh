  md: '# A note on the type

    in which this book is set


    The name of the font family used in this book is Computer Modern. These are free
    fonts designed by Donald E. Knuth for TeX typesetting system, and are described
    in Volume E of the *Computers & Typesetting* series, *Computer Modern Typefaces*
    (Addison-Wesley, 1986).


    This book was written and produced using the free software tools it describes.
    It was prepared with Texinfo, a system for generating both hardcopy and electronic
    output from a single source document. The Texinfo input files were composed in
    GNU Emacs, and the screen shots were taken and processed with the Image Magick
    suite of tools. The output was converted to PostScript for printing using Tomas
    Rokicki''s Dvips, GNU Ghostscript, and Angus Duggan''s PostScript Utilities. The
    system was a 100MHz 586 personal computer running Debian GNU/Linux 2.2.'
