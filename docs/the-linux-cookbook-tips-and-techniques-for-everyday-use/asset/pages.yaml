    # 4.2 Running a Program in X


    Running in an X session are called X clients (The X Window System itself is called
    the X server). To run a program in X, you start it as an X client - either by
    selecting it from a menu, or by typing the command to run in an xterm window (see
    Recipe 4.5 [Running a Shell in X], page 59). Most window managers have a "start
    menu" of some kind; it''s usually accessed by clicking the left mouse anywhere
    on the root window. To run an X client from the start menu, click the left mouse
    button to select the client''s name from the submenu.


    For example, to start a square-shaped, analog-face clock from the start menu,
    click the left mouse button on the root window to make the menu appear, and click
    the left mouse button through the application menus and on ''xclock (analog)''.
    This starts the xclock client, specifying the option to display an analog face:


    ![](img/3658df520e459cc83b744521428473cf_77_0.png)


    You can also start a client by running it from a shell window—useful for starting
    a client that isn''t on the menu, or for when you want to specify options or arguments.
    When you run an X client from a shell window, it opens in its own window; run
    the client in the background to free the shell prompt in the shell window (see
    Recipe 3.3.2 [Putting a Job in the Background], page 41).'
