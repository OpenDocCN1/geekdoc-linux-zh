  md: '# Chapter 4: The X Window System


    # 4.2.4 Specifying Additional Window Attributes


    X applications often have up to three special menus with options for changing
    certain attributes. To see these menus, hold CTRL and click one of the three mouse
    buttons. The following table lists and describes various window attributes common
    to most X-aware applications.


    | WINDOW OPTIONS | DESCRIPTION |

    | - | - |

    | -bd color -bordercolor color | Use color for the window border color. |

    | -bg color -background color | Use color for the window background color. |

    | -bw number -borderwidth number | Specify the window border width in pixels.
    |

    | -fg color -foreground color | Use color for the window foreground text or graphics.
    |

    | -fn font -font font | Use font for the font to use. |

    | -geometry geometry | Specify window geometry. |

    | -iconic | Immediately identify the program (see Recipe 4.3.4 [Minimizing a Window],
    page 58). |

    | -title string | Use string for the window title. |


    # 4.3 Manipulating X Client Windows


    Only one X client can accept keyboard and mouse input at a time, and that client
    is called the active client. To make a client active, move the mouse over the
    client’s window. When a client is the active client, it is said to be “in focus”.
    Depending on the window manager, the shape of the mouse pointer may change, or
    the window border and title bar of the client may be different (a common default
    is steel blue for the active client color and gray for all other windows).


    Each window has its own set of controls to manipulate that window. Here’s how
    to perform basic window operations with the mouse.


    # 4.3.1 Moving a Window


    To move a window, click and hold the left mouse button on the window’s title bar,
    drag its own outline to a new position. When the outline is in place, release
    the left mouse button, and the window will move to the position held by the window
    outline.


    > ² If you have a mouse with only two buttons, click both buttons simultaneously
    to emulate the middle button.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# 4.3.2 Resizing a Window


    To resize a window, click and hold the left mouse button on any of the window''s
    four frames, and move the mouse to shrink or grow the window outline. Release
    the left mouse button to resize the window to the size of the window outline.


    # 4.3.3 Destroying a Window


    To destroy a window and stop the program it displays, click the left mouse button
    on the ''X'' button in the upper right-hand corner of the title bar. This is useful
    for when the program running in the window has stopped responding. (Of course,
    if a program in the window has an option to stop it normally, you can always use
    it to stop the program and close its window.)


    # 4.3.4 Minimizing a Window


    To minimize a window, so that it disappears and an icon representing the running
    program is placed on the desktop, click the left mouse button on the ''_'' button
    in the upper right-hand corner of the title bar. This is also called iconifying
    a window.


    # 4.3.5 Maximizing a Window


    To maximize an icon to a window (or "deiconify" it), double-click the left mouse
    button on the icon name, directly beneath the icon itself. The icon will disappear
    and the window will return to its prior position.


    # 4.4 Moving around the Desktop


    Many window managers (including afterstep and fwm2) allow you to use a virtual
    desktop, which lets you use more screen space than your monitor can display at
    one time. A virtual desktop can be larger than the display, in which case you
    can scroll through it with the mouse. The view which fills the display is called
    the viewport. When you move the mouse off in a direction where the current (virtual)
    desktop extends, the view scrolls in that direction. Virtual desktops are useful
    for running many clients full screen at once, each in its own separate desktop.


    Some configurations allow scrolling between desktops: in this case, switch between
    them with a pager, which shows a miniature view of your virtual desktop, and allows
    you to switch between desktops. It is a sticky window ("sticks to the glass")
    above all other windows), and is always in the lower right-hand corner of your
    screen, even when you scroll across a virtual desktop. Both your current desktop
    and active X client are highlighted in the pager.


    The default fwm2 virtual desktop size is nine desktops in a 3x3 grid:


    ![](img/3658df520e459cc83b744521428473cf_81_0.png)'
  merge: -1
