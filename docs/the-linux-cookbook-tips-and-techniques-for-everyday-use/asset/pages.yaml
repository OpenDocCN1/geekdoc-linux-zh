  md: '# 10 Text Editing


    Text editing is one of the most fundamental activities of computing on Linux-based
    systems, or most any computer for that matter. We edit text when writing a document,
    sending email, making a Web page, posting an article for Usenet, programming—and
    the list goes on. Most people spend a good deal of their computing time editing
    text with a text editor application.


    There are a lot of text editors to choose from on Linux systems, as the first
    recipe in this chapter shows, the majority of editors in one of two families of
    editor: Emacs and Vi. Most users prefer one or the other; rarely is one adept
    at both. I give more coverage to Emacs, and not only because it is my preferred
    editor—its keystroke commands are used by default in many other tools and applications,
    including (see Chapter 3 [The Shell], page 35).


    # 10.1 Choosing the Perfect Text Editor


    The following table some of the most interesting text editors available, and includes
    information about their special traits and characteristics.


    | TEXT EDITOR | DESCRIPTION |

