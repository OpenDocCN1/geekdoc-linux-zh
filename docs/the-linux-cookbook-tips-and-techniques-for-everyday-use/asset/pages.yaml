    \ a '.ps' extension. You can print this file with lpr or convert it to another\
    \ format (see Recipe 25.3.1 [Preparing a PostScript File for Printing], page 275).\n\
    \nThe second way is to use pdf2ps, of the 'gs' package, to convert the PDF file\
    \ to PostScript(then print the PostScript output as described for xpdf above).\
    \ pdf2ps takes two arguments: the name of the PDF file to convert, and the name\
    \ of the PostScript file to write.\n\n+   - To convert the PDF file pricelist.pdf,\
    \ type:\n  $ pdf2ps pricelist.pdf pricelist.ps RET\nThis command writes a PostScript\
    \ file for 'pricelist.ps' in the current directory.\n\n# 25.3.4 Preparing a Man\
    \ Page for Printing\n\nTo convert a man page to output that is suitable for printing,\
    \ use the '-t' to output PostScript, and pipe the output to lpr (if you have a\
    \ PostScript printer), or save it to a file that you can convert for your printer.\n\
    \n+   - To output the man page for psbook as PostScript and send it as a print\
    \ job to the default type:\n  $ man -t psbook | lpr RET\n- To output the man page\
    \ for psbook to the file 'psbook.ps', type:\n  $ man -t psbook > psbook.ps RET\n\
    \nIn the preceding example, you can use gs to convert the file to a format your\
    \ non-PostScript printer understands (see Recipe 25.3.1 [Preparing a PostScript\
    \ File for Printing], page 275).\n\nNOTE: A manual \"page\" can actually contain\
    \ more than one physical page; the output will have as many pages as necessary\
    \ to print it."
