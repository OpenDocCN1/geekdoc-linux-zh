    The features of HTML mode function include a very short HTML authoring tutorial—view
    the documentation on this function to display the tutorial.


    +   To read a short HTML in Emacs, type:


    ```

    C-h html-mode

    ```


    NOTE: When you''re editing an HTML file in an Emacs buffer, you can open the same
    file in a Web browser in another window—Web browsers only read and don''t write
    the HTML files they open, so you can view the rendered document in the browser
    as you create it in Emacs. When you make and save a change in the Emacs buffer,
    reload the file in your browser to see your changes take effect immediately.


