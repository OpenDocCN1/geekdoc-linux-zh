  md: '# 24.2 Listing a File''s Disk Usage


    Use du to list the amount of space on disk used by files. To specify a particular
    file name or directory tree, give it as an argument. With no arguments, du works
    on the current directory.


    It outputs a line for each sub- in the tree, listing the space used and the sub-directory
    name; the last line lists the total amount of space used for the entire tree.


    +   * To output the disk usage for the directory tree whose root is the current
    directory, type:


    ```

    $ du

    8 /projects/documentation

    12 /projects/source

    4 /projects/etc

    24 /projects

    3 /tmp

    27 $

    ```


    This example shows two subdirectories in the directory tree: ''projects'' and
    ''tmp''; ''projects'' contains three additional directories. The amount of disk
    space used by the individual directories is the total on the last line, 27K.


    By default, output is in 1K blocks, but you can specify another unit to use as
    an option: ''-k'' for kilobytes and ''-m'' for megabytes.


    +   * To output the disk usage, in kilobytes, of the ''/usr/local'' directory
    tree, type:


    ```

    $ du -k /usr/local

    ```


    +   * To show the number of megabytes used by the file ''/tmp/cache'', type:


    ```

    $ du -m /tmp/cache

    ```


    Use the ''-s'' (''summarize'') to output only the last line containing the entire
    directory tree. This is useful when you are only interested in the total disk
    usage of a directory tree.


    +   * To output only the total disk usage of the ''/usr/local'' directory tree,
    type:


    ```

    $ du -s /usr/local

    ```


    +   * To output only the total disk usage, in kilobytes, of the ''/usr/local''
    directory tree, type:


    ```

    $ du -s -k /usr/local

    ```


    # 24.3 Floppy Disks


    Before you use a floppy disk for the first time, it must be *formatted*, which
    creates an empty filesystem on the disk.


    To read or write files to a formatted disk, you mount the floppy on an empty directory,
    making its filesystem available in the specified directory. Usually, Linux systems
    have'
