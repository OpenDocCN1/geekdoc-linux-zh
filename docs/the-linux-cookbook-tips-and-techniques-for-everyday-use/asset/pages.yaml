  md: '# Chapter 10: Text Editing


    **NOTE:** In an xterm window


    # 10.4.1 Cutting Text


    You don''t have to select text to cut it. At a shell prompt or in Emacs, type
    C-k to cut the text from the cursor to the end of the line.


    In Emacs parlance, cutting text is known as *killing text*. Emacs has additional
    commands for killing text:


    +   * When you have selected an area of text with the mouse as described previously,
    you can type Shift-DEL.

    * You can also click the left mouse button at one end of an area of text and then
    doubleclick the right mouse button at the other end of the area to kill the text.

    * Finally, to kill a large portion of text in an Emacs buffer, set the mark at
    one end of the text by moving point to that end and typing C-SPC. Then, move point
    to the other end of the text, and type C-w to kill it.


    # 10.4.2 Pasting Text


    Debian: ''xpaste''


    To paste the text that was last selected with the mouse, click the middle mouse
    button at the place you want to paste to. You can also use the keyboard by moving
    the cursor to where you want to paste and then typing Shift-INS. These commands
    work both in X and in the console.


    In X, to display the contents of the X in its own window, run the xpaste client;
    its only purpose in life is to display this text in its window.


    In Emacs, pasting is called yank the text. Emacs offers the additional key, C-y
    ("yank") to yank the text that was last selected or killed. This key also works
    in the bash shell, where it pastes the text that was killed with C-k in that session,
    if any.


    # 10.5 Editing Streams of Text


    Some of the recipes in this book that use sed, the "stream editor." It is not
    a text editor in the usual sense—you don''t open a file in sed and interactively
    edit it; instead, it performs editing operations on a stream of text sent to its
    standard input, and it writes the results to the standard output. This is more
    like a filter than an editor, and sed is a useful tool for formatting and searching
    through text.


    The "sed grab-bag" (http://seders.icheme.org/) is a useful collection of sed-information
    including a FAQ and many example scripts.


    The sed "one-liners" (http://www-h-eng.cam.ac.uk/tpl/unix/sed.html) are useful
    commands for editing and processing text.


    See file ''sed.info'', node Top, for more information on sed usage.'
