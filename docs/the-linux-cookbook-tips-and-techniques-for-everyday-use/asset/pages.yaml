  md: '# 2 What Every Linux User Knows


    This chapter concerns these concepts and commands that every Linux user knows—how
    to start and stop the system, log in and out of it, change your password, see
    what is happening on the system, and use the system help facilities. Mastery of
    these basic concepts is essential for using Linux with any degree of success.


    Some of these recipes make reference to files and directories; these concepts
    are explained in Chapter 5 [Files and Directories], page 65.


    # 2.1 Controlling Power to the System


    These recipes show how to start and stop power to the system—how to turn it on
    and turn it off. It is more than just pressing the button on the case; in particular,
    there is a right way to turn off the system, and doing it wrong can result in
    losing some of your work. Fortunately, there isn''t any black magic involved,
    as we shall soon see—properly shutting down the system is easy!


    # 2.1.1 Powering Up the System


    The first thing you do when using the system is start power to it. To power up
    the system, just turn it on. This is called booting the system.


    As the Linux kernel boots there will be many messages on the screen. After a while,
    the system will display a login: prompt. You can now log in. See Recipe 2.2.1
    [Logging In to the System], page 18.


    Some systems are configured to start xdm at boot time (see Recipe 4.1.1 [Starting
    X], page 53). If your system is configured like this, instead of the login: prompt
    described above, you''ll see a graphical screen with a box in the middle containing
    both login: and Password: prompts. Type CTRL-ALT-FT to switch to the first virtual
    console, where you can log in to the system in the usual way (see Recipe 2.3 [Console
    Basics], page 20).


    # 2.1.2 Shutting Down the System


    You can''t flip the power switch when you are done the computer, because Linux
    is constantly writing data to disk (It also keeps data in memory, even when it
    may have appeared to have written that data to disk.) Simply turning off the power
    could result in the loss or corruption of your work.


    To turn off a single user system, log out of all consoles (discussed in Recipe
    2.3 [Console Basics]), page 20. Then, type CTRL-ALT-DEL (press and hold these
    three keys at once).


    The system will print some messages as it shuts down, and when you see the line,
    ''Rebooting...'', it is safe to turn the machine off.


    NOTE: You don''t want to wait too long after you see this message; if left untouched,
    the system will reboot and you''ll be back to the beginning!


    1 If you have two ALT CTRL keys, use the left set of these keys.'
  merge: -1
