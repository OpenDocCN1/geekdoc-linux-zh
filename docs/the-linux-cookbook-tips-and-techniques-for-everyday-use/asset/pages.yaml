  md: '# Mathematics


    Tools and techniques for dealing with numbers are the subject of this chapter:
    listing them in sequence or randomly, calculating arithmetic, between units. Larger
    applications, such as spreadsheets and plotting tools, are also mentioned.


    # 28.1 Calculating Arithmetic


    As you might expect, there are many tools for making arithmetic calculations in
    Linux. The following recipes describe how to use two of them for common scenarios;
    a list of other calculator tools, including a visual calculator, appears at the
    end of this chapter (see Recipe 28.6 [Other Math Tools], page 302).


    # 28.1.1 Making a Quick Arithmetic Calculation


    WWW: http://dsl.org/comp/tinyutils/


    To do a quick calculation that requires only addition, subtraction, multiplication,
    or division, or use calc. It takes as an argument a simple mathematical expression,
    and it outputs the answer.


    Use ''*'' for a multiplication sign and ''/'' for division; to output the remainder,
    use ''%''. You can use parenthesis to group expressions—but when you do, be sure
    to quote them (see Recipe 3.1.1 [Passing Special Characters to Commands], page
    36).


    +   To output the result of 50 times 10, type:


    ```

    calc 50*10 RET

    500

    $

    ```


    +   To output the result of 100 times the sum of 4 plus 420, type:


    ```

    calc ''100*(4+420)'' RET

    42400

    $

    ```


    +   To output the remainder of 10 divided by 3, type:


    ```

    calc 10%3 RET

    1

    $

    ```


    NOTE: This tool is useful for quickly computing a simple arithmetic equation,
    but it has several drawbacks: it only outputs whole integers, its operators are
    limited, and complex expressions must be quoted. For doing anything more than
    the simplest operations, see the next recipe, which describes bc.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# 28.1.2 Making Many Arithmetic Calculations


    Debian: ''bc''

    WWW: ftp://src.doc.ic.ac.uk:/pub/bc-1.05a.tar.gz


    When you have a lot of calculations to make, or when you must compute numbers
    with decimals, use bc, a calculation language that supports arbitrary precision
    numbers. Type bc to perform arithmetic operations interactively, just like you
    would with a calculator.


    Type each statement to evaluate on a line by itself, typing RET at the end statement;
    the evaluation of what you type is output on the following line. Each line you
    type be evaluated by bc as an arithmetic expression. To exit, type quit on a line
    by itself.


    +   - To multiply 42 and 17, type:


    ```

    $ bc RET

    bc 1.05

    Copyright 1991, 1992, 1993, 1994, 1997, 1998 Free Software

    Foundation, Inc.

    This is free software with ABSOLUTELY NO WARRANTY.

    For details type ''warranty''

    42 * 17 RET

    714

    quit RET

    $

    ```


    In this example, bc output its version number and warraty information when it
    started; then the statement 42 * 17 was typed by the user, bc output the result
    (''714''), and then the user typed quit to exit bc.


    By default, the digits to the right of the decimal point are truncated from the
    output—so dividing 10 by 3 would output ''3'' as a result, and outputting the
    remainder from this operation by typing 10% would output a ''1''. However, bc
    is an arbitrary precision calculator, and you can give the number of digits to
    use after the decimal point by specifying the value of the scale variable; its
    default is 0.


    +   - To use bc to compute the result of 10 divided by 3, using 20 digits after
    the decimal point, type:'
  merge: -1
