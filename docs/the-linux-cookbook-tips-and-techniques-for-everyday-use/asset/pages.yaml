  md: '# Chapter 13: Formatting Text


    is ejected and a new page begins thus, you can paginate a text file by inserting
    formfeed characters at a place where you want a page break to occur.


    To insert formfeed characters in a text file, use the pr filter.


    Give the `-f` option to omit the footer and pages of output with the formfeed
    character, and use `-h ''''` to output a blank header (otherwise, the current
    date and time, file name, and current page number output are at the top of each
    page).


    +   - To paginate the page `listings` and write the output to a file called `listings.page`,
    type:


    ```

    $ pr -f -h '''' listings > listings.page

    ```


    By default, pr outputs pages of 66 lines each. You can specify the page length
    as argument to the `-l` option.


    +   - To paginate the file `listings` with 43-line pages, and write the output
    to a file called `listings.page`, type:


    ```

    $ pr -f -h '''' -43 listings > listings.page

    ```


    NOTE: If a page has more than lines a printer can automatically break the text
    at that line as well as at the places in the text where there are formfeed characters.


    You can paginate text in Emacs by manually inserting formfeed characters where
    you want them see 10.2.5 [Inserting Characters in Emacs], page 126.


    # 13.2.1 Placing Headers on Each Page


    The pr tool is a general-purpose page formatter and print-preparation utility.
    By default pr outputs text in pages of 66 lines each, with headers at the top
    of each page containing the date and time, file name, and page number, and footers
    containing five blank lines.


    +   - To print the file `duchess` with the default pr preparation, type:


    ```

    $ pr duchess | lpr

    ```


    # 13.2.2 Placing Text in Columns


    You can also use the `-t` option to put text in columns the number of columns
    to output as argument. The default headers and footers.


    +   - To print the file `news.update` in four columns with no headers or footers,
    type:


    ```

    $ pr -4 -t news.update | lpr

    ```


