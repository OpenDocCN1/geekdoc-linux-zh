  md: "# 23 Editing Sound Files\n\nAll kinds of tools and applications exist to edit\
    \ sound files. This chapter shows some of those tools, giving methods for cutting\
    \ and pasting sound files, applying effects and filters, and converting sound\
    \ files between formats.\n\n# 23.1 Working with Selections from Sound Files\n\n\
    Debian: 'snd'\nWWW: http://ccma-www.stanford.edu/CCRMA/Software/snd/\n\nSnd is\
    \ a sound-file editing environment for X, and aims to be for sound what Emacs\
    \ is for text. (And it uses Emacs-style key bindings).\n\nYou'll find a complete\
    \ manual for it in `/usr/doc/snd` directory; this section explains how to use\
    \ Snd to work with selections from sound files.\n\nTo open a sound file in Snd,\
    \ give the name of the file to be opened as an argument to snd.\n\n+   To open\
    \ the sound file `mixdown.wav` in Snd, type:\n  `$ mixdown.wav RET`\n\nThis command\
    \ starts Snd with a WAV file called `mixdown.wav`.\n\n![](img/3658df520e459cc83b744521428473cf_278_0.png)\n\
    \nMaking a selection of a sound file in snd is similar to selecting text in Emacs;\
    \ you can mark a section of a sound file or recording you you've made in Snd by\
    \ left-clicking and dragging across the area with the mouse. The area you drag\
    \ across becomes shaded and is called the selection. Once you select a portion\
    \ of the sound, any effect you choose on that selection. You can also cut and\
    \ paste selections of the sound you are editing into other sound buffers."
  merge: -1
