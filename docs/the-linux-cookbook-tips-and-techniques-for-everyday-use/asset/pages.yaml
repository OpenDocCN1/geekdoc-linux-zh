    **NOTE:** In this example, three JPEGs were read and output to a PNG file; to
    specify the format to use in the output, give the appropriate file extension in
    the output file name.


    # 18.1.7 Combining Images


    Use **combine** to combine two images into one new image—give the names of the
    source image files and the new file to write to as arguments. Without any options,
    it makes a new image file by overlaying the smaller of the two images over the
    larger, starting in the top left corner; if both images are the same size, only
    the second image is visible.


    +   - To combine two images, ''ashes.jpeg'' and ''phoenix.jpeg'', into a new file
    ''picture.jpeg'', type:


    ```

    $ combine ashes.jpeg phoenix.jpeg picture.jpeg RET

    ```


    You can specify the percentage to blend two images together with the ''-blend''
    option. Give the amount to blend the second image into the first (as a percentage)
    as an argument to the option.


    +   - To combine the image files ''phoenix.jpeg'' and ''ashes.jpeg'' so that the
    blended image contains 70 percent of the second image, type:


    ```

    $ combine -blend 70 ashes.jpeg phoenix.jpeg picture.jpeg RET

    ```


    This command combines the two images and writes a new image file, ''picture.jpeg'',
    whose faces contain 70 percent of the first image.


    **NOTE:** Use ''-blend 50'' to blend the two source files equally.


    # 18.1.8 Morphing Two Images Together


    **Morphing** is a method of computer imaging for finding the difference between
    the shapes in two images; it''s often used in special effects to transform aspects
    of two creatures, such as the faces of a human and some other animal.


    You can use combine to get a morph-like effect by giving the **difference** argument
    to the ''-compose'' option. When specified with two input images and an output
    file, this command takes the difference between corresponding pixels in the two
    images; the effect is like a ''morphed'' image.


    +   - To make a morphed image of the files ''ashes.jpeg'' and ''phoenix.jpeg'',
    and write it to ''picture.jpeg'', type:


    ```

    $ combine -compose difference ashes.jpeg phoenix.jpeg picture.jpeg RET

    ```'
