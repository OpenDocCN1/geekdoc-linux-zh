  md: '# Chapter 31: The World Wide Web


    systems; it was also one of the first Web browsers available for general use.³
    It can''t display graphics at all, but it''s a good interface for reading hypertext.


    Type lynx to start it—if a "start page" is defined, it will load. The start page
    is defined in `/etc/lynx.cfg`, and can be a URL pointing to a file on the local
    system or an address on the Web; you need user privileges to edit this file. On
    Debian systems, the start page comes from the Debian home page, http://www.debian.org/
    (but you can change this, of course; many experienced users write their own start
    page, containing links to frequently-visited URLs, and save it as a local file
    in their home directory).


    To open a URL, give the URL as an argument.


    +   To view the URL `http://lycaeem.org/`, type:


    ```

    $ lynx http://lycaeem.org/ RET

    ```


    When in lynx, the following keyboard commands work:


    | COMMAND | DESCRIPTION |

    | --- | --- |

    | � and ① | Move forward and backward through links in the current document. |

    | → or RET | Follow the hyperlink currently selected by the cursor. |

    | ← | Go back to the previously displayed URL. |

    | DEL | View a history of all URLs visited during this session. |

    | PgDn or SPC | Scroll down to the next page in the current document. |

    | PgUp | Scroll up to the previous page in the current document. |

    | = | Display information about the current document (like pages in lynx, type
    ↲ to go back to the previous document). |

    | g | Go to a URL; lynx will prompt you for the URL to go to. Type ↖ to insert
    on this line the last URL that was visited; once inserted, you can edit it. |

    | h | Display the lynx help files. |

    | q | Quit browsing and exit the program; lynx will ask you to verify this action.
    |


    The following are some recipes for using lynx.


    > NOTE: Emacs users might want to use the ‘emacskeys’ option when starting lynx;
    it enables you to use Emacs-style keystrokes for cursor movement (see Recipe 10.2.2
    [Basic Emacs Editing Keys], page 123).


    # 31.3.1 Perusing Text from the Web


    To peruse the text of an article that''s on the Web, output the text of the URL
    using lynx with the `-dump` option. This dumps the text of the given URL to the
    output, and you can pipe this into `less` for perusal, or redirection to save
    it to a file.


    ³ Like many of my generation, it was through lynx that I had my first view of
    the Web.'
