  md: '# 9.2.6 Outputting Text in a Dialect


    Debian: filters''

    WWW: http://www.princeton.edu/~mkporwit/pub_links/davido/slang/

    WWW: http://www.mathlab.sunsys.edu/~elijah/src.html


    There are all kinds of tools that work on text; this recipe describes a specific
    group of filters - those that filter their standard input to give the text an
    accent or dialect, and are intended to be humorous.


    Generally speaking, a filter is a tool that works on standard input, changing
    it in some way, and passing it to standard output.


    +   To apply the kraut filter to the text in the file /etc/motd, type:

    $ cat /etc/motd | kraut


    These commands pass the contents of the file /etc/motd to the kraut filter, whose
    output is then sent to standard output. Contents of /etc/motd are not changed.


    Some of the dialect filters available include nyc, which gives a ''New Yorker''
    dialect to text, and newspeak, which translates text into the approved language
    of the thought police, as described in George Orwell''s novel, 1984. Hail Big
    Brother!


    # 9.3 Streaming Text


    WWW: http://www.maurer-it.com/open-source/sview/


    It''s demonstrated that people read and comprehend printed text displayed on a
    computer display screen. Rapid visual presentation, or RSVP, is a technique that
    aims to increase reading speed and comprehension with the use of computer display
    screens. With this technique, text is streamed over the screen, one word at a
    time, with pauses between words and punctuation. The average reading time is lowered
    and comprehension is increased significantly with this technique.


    GNOME sview is a "streaming viewer" for X: it streams a word at a time on the
    screen, at a default rate of 450 words per minute. Use it to read text files and
    the X selection, which is text you have selected with the mouse (see Recipe 10.4
    [Selecting Text], page 128).


    To open a file in sview either specify it as an argument to the command, or choose
    Open from the File menu in sview and select the file from there.


    +   To view the contents of the text file ''alice-in-wonder-land'' in sview, type:

    $ sview alice-in-wonder-land


    To start the text, either press S once, or click-left on the button marked RSVP.
    Both S and the RSVP button toggle the streaming: the left and right arrow keys
    control the speed.'
