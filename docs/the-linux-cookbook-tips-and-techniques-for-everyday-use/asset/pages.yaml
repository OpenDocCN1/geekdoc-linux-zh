    # A.2 Installing Software


    All Linux distributions come with a multitude of software programs (also called
    “binaries”). But sooner or later, you will want to install more programs, or you
    will want to upgrade your existing software when newer versions are available.
    The following sections talk about installing the Debian GNU/Linux distribution
    itself, installing and upgrading software from Debian packages, and how to install
    stand-alone shell scripts.


    # A.2.1 Getting and Installing Debian


    ```

    WWW: http://www.cheapbytes.com/

    WWW: http://www.debian.org/

    WWW: http://www.debian.org/releases/stable/

    ```


    You can get a copy of Debian GNU/Linux on CD-ROM from local or online vendors,
    or you can download the installation files from the Internet (recommended only
    if you have a fast Internet connection, of course).


    If you choose to buy a copy of Debian in a local computer, be sure you get the
    most recent version. If a store carries an old version, the software might not
    work with your brand-new hardware! (Visit the Debian Web site to find the name
    of the latest version.)


    > If you''d rather buy a copy online, Cheap*Bytes sells affordable Debian GNU/Linux
    CD-ROMs. The Debian Project maintains a full list of vendors at http://www.debian.org/dist/vendors/.


    The precise details of installation are out of the scope of this book, but the
    Debian installation guide comes on the CD-ROM. It contains step-by-step instructions
    for the latest release.


    # A.2.2 Installing a Debian Package


    Debian makes the software programs available in ‘deb’ packages, files that contain
    everything for the installation of a given software program.


    There are different methods of installing packages on a Debian system: via dselect,
    where you select packages from a menu; dpkg, a command-line tool for installing
    packages; and apt-get, part of Debian’s “Advanced Package Tool”.


    To install a package when you know the package name, for example, if you install
    Debian via CD-ROM, first insert the Debian CD- disc in your CD-ROM drive. Then
    run apt-get with the ‘install’ command and get the name of the package to install
    as an argument. Should there be additional packages that must be installed (called
    dependencies), or the package conflict with others already installed, an action
    will be presented to fix this, and you will be prompted to confirm or abort the
    operation.'
