  md: '# Chapter 1: Introduction


    # 1.1.6 Unix and the Tools Philosophy


    WWW: http://cm.bell-labs.com/cs/upe/

    WWW: http://www.cs.bell-labs.com/cm/cs/pearls/


    To understand the way tasks are performed on Linux, some discussion on the philosophy
    behind the software that Linux is built upon in order. A dip in these inviting
    waters will help clarify the role of this book as "cookbook."


    The fact that the Unix operating system has survived for more than thirty years
    should tell us something about the tenacity of its design considerations. One
    of these considerations—perhaps its most endearing—is the "tools" philosophy.


    Most operating systems are designed with a concept of files, come with a set of
    utility programs for handling these files, and then leave it to the large apparatus
    to do the interesting work: a word processor, a spreadsheet, a presentation designer,
    a Web browser. (When a few of these applications recognize each other''s file
    formats, or share a common interface, the group of applications is called a "suite."


    Each of these monolithic applications presumably has an "open file" command to
    read a file from disk and open it in most; too, with commands for searching and
    replacing text, checking spelling, printing the current document, and so on. The
    program source for handling all these tasks must be accounted for separately,
    inside each application—taking up extra space both in memory and on disk. This
    is the anti-Unix approach.


    And in the case of proprietary software, all of the actual program source code
    is kept from the public—so other programmers can''t use, build, or learn from
    any of it. This kind of closed-source software is presented to the world as a
    kind of magic trick: if you buy a copy of the program, you may use it, but you
    can never learn how the program actually works.


    The result is that code to handle essentially the same function inside all of
    these different applications must be developed by programmers from scratch, separately
    and independently of the others each time—so the progress of society is a whole
    set back by the countless man-hours of time and energy programmers must waste
    by inefficient reinventing all the software functions to perform the same tasks,
    over and over again.


    Unix-like operating systems don''t put much weight on operating programs. Instead,
    they come with many small programs tools. Each tool is generally capable of performing
    a very simple, specific task, and performing it well—one tool does nothing but
    output the file(s) or data passed to it, one tool pools its input to the print
    queue, one sorts the kinds of its input, and so on.


    An early development in Unix was the invention of "pipes," a way to pass the output
    of one tool to the input of another. By knowing how the individual tools do and
    how they are combined, a user could build powerful "strings" of commands.


    Just as the tensile strength of steel is greater than the added strength of its
    components—nickel, cadmium, and iron—multiple tools could be combined to perform
    a task unpre-'
