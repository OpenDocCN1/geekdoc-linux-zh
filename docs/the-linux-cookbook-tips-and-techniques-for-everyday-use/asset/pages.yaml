    # 32.6.2 Chatting with Users on IRC


    Internet Chat (IRC) is a global chat system, probably the oldest and largest on
    the Internet. IRC is a great way to meet and talk to all kinds of people, live
    on the Internet; it has historically been very popular with Linux users.


    There are several IRC networks, each with its own servers and tens of thousands
    of users: to “go on”, you use an IRC client program to connect with an IRC server.
    Like CB radio, IRC networks have channels, usually based on a particular topic,
    which you join to chat with other users in that channel (you can also send private
    messages to other users).


    The following table lists some of the IRC clients available for Linux.'
