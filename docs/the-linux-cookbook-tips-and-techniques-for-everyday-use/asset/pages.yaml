    Use write to write a message to the terminal of another user. Give the username
    you want to write to as an argument. This command writes the message you give,
    preceded by a header line indicating that the following is a message from you,
    and giving the current system time. It also rings the bell on the user''s terminal.


    +   To send the message ''Wake up!'' to the terminal where user ''sleepy'' is
    logged in, type:'
