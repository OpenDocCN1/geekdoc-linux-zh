  md: "# Chapter 11: Grammar and Reference\n\nOld-timers probably remember these names\
    \ - the originals came with AT&T UNIX as part of the much-loved \"Writer's Workbench\"\
    \ (WWB) suite of tools back in the late 1970s and early 1980s.³\n\nAT&T \"unbundled\"\
    \ the Writer's Workbench from their UNIX version 7 product, and as the many flavors\
    \ of Unix blossomed over the years, these tools were lost by the wayside—eventually\
    \ becoming the stuff of Unix lore.\n\nIn 1997, Michaelhardt wrote new Linux versions\
    \ of these tools from scratch. They support both the English and German languages,\
    \ and they're now part of the GNU Project.\n\nTwo commands commands were part\
    \ of the Writer's Workbench have long been standard on Linux: look and spell,\
    \ described previously in this chapter.\n\n# 11.3 Checking Test for Misused Phrases\n\
    \nUse diction to check for wordy, trite, or misused phrases in a text. It checks\
    \ for all the kind of William Strunk warned about in his Elements of Style (http://coba.shshu.edu/help/strunk/).\n\
    \nAccording to The UNIX Environment, by Andrew Walker, the diction tool that came\
    \ with the old Writer's Workbench just found phrases, and a separate command called\
    \ would output suggestions. In the GNU version that works for Unix systems, both\
    \ functions have been combined in the single diction command.\n\nWhen checking\
    \ more than a restful of text, you'll want to pipe the output to less so you can\
    \ peruse it on the screen (see Recipe 9.1 [Perusing Text], page 111), or pipe\
    \ the output to a file for later examination.\n\n+   - To check file 'dissertation'\
    \ for clichés or other misused phrases, type:\n  $ diction less dissertation\n\
    - To check file 'dissertation' for clichés or other misused phrases, and write\
    \ the output to a file called 'dissertation.diction', type:\n  $ diction > dissertation.diction\n\
    \nIf you don't specify a file name, diction reads text from the standard input\
    \ until you type C-d on a line by itself. This is especially useful when you want\
    \ to check a single sentence:\n\n```\ndiction\nLet us ask the question we wish\
    \ to state.\n(stdin):1: let us [the question -> ask]\nwish to state -> (cliche,\
    \ avoid).\nC-d\n$\n```\n\n> ³ There was also a set of tools for formatting text\
    \ called \"Documenter's Workbench\" (DWB), and there was a planned \"Reader's\
    \ Workbench\"; we can only guess at what might have been, but today we do have\
    \ Project Gutenberg (http://www.gutenberg.org/), a new etext reader."
  merge: -1
