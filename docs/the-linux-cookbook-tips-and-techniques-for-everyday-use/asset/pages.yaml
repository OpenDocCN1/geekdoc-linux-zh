  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    adstyl


    Any additional style descriptions the particular font takes, such as *serif* (fonts
    that have small strokes drawn on the ends of each line in the character) or *sans
    serif* (fonts that omit serifs).


    pxlsz


    The height, in pixels, of the type. Also called *body size*.


    ptsz


    The height, in points, of the type.


    resx


    The horizontal screen resolution the font was designed for, in dpi (“dots per
    inch”).


    resy


    The vertical screen resolution the font was designed for, in dpi.


    spc


    The kind of spacing used by the font (its escapement class): ‘p’ (a proportional
    font containing characters with varying spacing), ‘m’ (a monospaced font containing
    characters with constant spacing), or ‘c’ (a character cell font containing characters
    with constant spacing and constant height).


    avgwdth


    The average width of the characters used in the font, in 1/10 pixel units.


    registry


    The international standards body, or registry, that owns the encoding.


    encdng


    The registered name of this character set, or its encoding.


    # 16.1.1 Selecting an X Font Name


    X fonts can be long and difficult to type; to make it easier, use the xfontsel
    client, an interactive tool for picking X fonts and getting their X font names.


    When you start xfontsel, it looks like this (the window frame will differ depending
    on your window manager):


    ![](img/3658df520e459cc83b744521428473cf_223_0.png)


    The row of buttons are pull-down menus containing options available on your system
    for each field in the X font name. Use the mouse to select items from each menu,
    and the X font you have selected is shown in the main window. Above it is written
    its X font name.


    +   * To make the X font name the X selection, click the mouse on the button labeled
    *select*.'
