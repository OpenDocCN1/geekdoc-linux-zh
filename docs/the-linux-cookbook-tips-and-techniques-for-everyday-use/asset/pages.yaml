  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    dictated by the function of the individual tools. This is the concept of synergy,
    and it forms the basis of the Unix tools philosophy.


    Here''s an example, using two tools. The first tool, called who, outputs a list
    of users currently logged on the system (see Recipe 2.6.2 [Who Is on the System],
    page 24). The second tool is called wc, which stands for "word count"; it outputs
    a count of the number of words (or lines or characters) of the input you give
    it (see Recipe 12.1 [Counting Text], page 149).


    By combining these two tools, the wc command gives the output of who, and you
    can build a new command to list the number of users currently on the system:


    ```

    $ who | wc -1

    4

    ```


    The output of who is piped—via a "pipeline," by the vertical bar (''|'')—to the
    input of wc, which through use of the ''-1'' option outputs the number of lines
    of its input.


    In this example, the number 4 is showing, indicating that four users are currently
    logged on the system. (Incidentally, piping the output of who to wc in this fashion
    is a classic tools example, and was once called "the most quoted pipe in the world"
    by Andrew Walker in The UNIX Environment, a book that was published in 1984).


    Another famous pipeline from the days before spell-check tools goes something
    like this:

    $ tr -cs A-Za-z ''012'' | tr -d a-z | sort -u

    comm -23 - /usr/dict/words


    This command (typed all on one line) uses the tr, sort, and comm tools to make
    a spelling checker—after you type something, the lines of text you type (until
    you interrupt it) are converted to a single-column of lowercase words with two
    calls of tr, sorted in alphabetical order while filtering out duplicates, the
    result which is then compared with /usr/dict/words, which is the system "dictionary,"
    a list of properly spelled words kept in alphabetical order (see Recipe 11.1 [Spelling],
    page 135).


    Collective sets of tools designed around a certain kind of field or concept were
    called "workenches" over Unix systems; for example, the tools for checking the
    spelling, writing style and grammar of their text input were part of the "Writer’s
    Workbench" package (see Recipe 11.3 [Checking Grammar], page 142).


    The GNU Project publishes collections of tools under general themes, such as the
    "GNU utilities" and "GNU file utilities," but the use of "workenches" is generally
    not part of the idiom of today''s Unix-based systems. We need to say, we use all
    tools for many purposes; the great bulk of this book details various combinations
    of tools to obtain the desired result for various tasks.


    You''ll find that there''s usually one tool or command sequence that works perfectly
    for a given task, but sometimes a satisfactory or even identical result can be
    had by


    > 7 Because of this approach, and because of its free and open nature, we have
    come to call Linux a "synergetic" operating system, in honor of the late R. Buckminster
    Fuller, who invented a new mathematical system based on these principles.'
