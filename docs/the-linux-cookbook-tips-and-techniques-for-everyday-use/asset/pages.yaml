  md: '# 16 Fonts


    A font is a collection of characters for displaying text, normally in a common
    typeface and with a common size, boldness, and slant.


    This chapter discusses the most popular kinds of fonts used on Linux systems:
    display fonts for use in the X Window System, fonts for use in virtual consoles,
    and the "fonts" often seen in Uset and composed entirely of ASCII characters.


    Omitted are reference of the use of fonts with TeX, which are the kind of fonts
    you''re most likely to use when producing typeset output— is beyond the scope
    of this book to cover that issue with the space it needs. However, to print a
    text file with a font, see Recipe 15.2.1 [Outputting Text in a Font], page 180.


    For more information on fonts and the tools to use them, see the Font HOWTO (see
    Recipe 2.8.6 [Reading System Documentation and Help Files], page 32).


    # 16.1 X Fonts


    You can specify a font as an option to most X clients, so that any text in the
    client is written in the given font. The recipe that describes how to do this
    is in Recipe 4.2.3 [Specifying a Window Font], page 56.


    When specify a font as an option, you have to give the X font name, which is the
    exact name used to specify a specific font in X. (An easy way to get the X font
    name is described in the first recipe in this section.) X font names consist of
    14 fields, delimited by (and beginning with) a hyphen. All fields must be specified,
    and empty fields are permitted:


    ```

    -fndry-fmly-wght-slant-swdt-adstyl-pxlez

    -ptsz-res-resy-spc-avgwdth-rgistry-encding

    ```


    The preceding line was split because of its length, but X font names are always
    given on one line.


    The following table describes the meaning of each field.


    | FIELD | DESCRIPTION |

    |---|---|

    | fndry | The type that digitized and supplied the font data. |

    | fmly | The name of the typographic style (for example, ''Courier''). |

    | wght | The weight of the font, or its nominal blackness, the degree of boldness
    or thickness of its characters. Values include ''heavy'', ''bold'', ''medium'',
    ''light'', and ''thin''. |

    | slant | The posture of the font, usually ''r'' (for ''roman'', or upright),
    ''i'' (''italic''), slanted upward to the right and differing in shape from the
    roman counterpart), or ''o'' (''oblique''), slanted but. |

    | swdt | The proportion width of the characters in the font, or its nominal width,
    such as ''normal'', ''condensed'', ''extended'', ''narrow'', and ''wide''. |'
