  md: '# 3 The Shell


    The subject of this chapter is the *shell*, the program that reads your command
    input and runs the specified commands. The shell environment is the most fundamental
    way to interact with the system—you are said to be "in" a shell from the very
    moment you''ve successfully logged in to system.


    The ''$'' character preceding the cursor is called the shell prompt; it tells
    you that the system is ready and waiting for input. On Debian systems, the default
    shell prompt also includes the name of the current directory (see Chapter 5 [Files
    and Directories]), page 65.

    A tilde (~) denotes your home directory, which is where you''ll find yourself
    when you log in.


    For example, a typical user''s shell prompt might look like this:


    ```

    $ _

    ```


    If your shell prompt shows a number sign (''#'') instead of a ''$'', this means
    you''re logged in with the superuser, or *root*, account. Beware: the *root* account
    has complete control over the system; one wrong keystroke and you might accidentally
    break it something awful. You need to have a different user account for yourself,
    and use that account for your regular use (see Recipe A.3.1 [Making a User Account],
    page 363).


    Every Linux system has at least one shell program, and most have several. We cover
    bash, which is the standard shell on most Linux systems. (Its name stands for
    ''Bourne again shell''-a pun on the name of Steve Bourne, who authored the traditional
    Unix shell, the Bourne shell.)


    NOTE: See Info file *bashref.info*, node ''Top'', for more information on using
    bash.


    # 3.1 Keys for Command Line Editing


    In Recipe 2.4 [Running a Command], page 22, you learned how to run commands by
    typing them in the shell prompt. The text you type at a shell prompt is called
    the *command line* (it''s also called the *input line*)


    The following table describes the keystrokes used for typing commands.


    | KEYSTROKES | DESCRIPTION |

    |---|---|n| text | Insert text at the point where the cursor is at; if there is
    text to the right of the cursor, it is shifted over to the right.


    | BKSP | Delete the character to the left of the cursor. |


    | DEL | Delete the character the cursor is underneath |


    | RET | Send the command line to bash for execution (in other words, it runs the
    command typed at the shell prompt). You don''t have to be at the far right end
    of the command line to RET; you can type it when the cursor is anywhere on the
    command line. |'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    C-a


    Move the cursor to the beginning of the input line.


    C-d


    Same as (DEL) (this is the Emacs equivalent).


    C-e


    Move the cursor to the end of the input line.


    C-k


    +   - Kill, or "cut," all text on the input line, from the character

    - the cursor is underneath the end of the line.


    C-l


    Clear the terminal screen.


    C-u


    Kill the entire line.


    C-y


    Yank, or "paste," the text that was last killed. Text is inserted

    at the point where the cursor is.


    C-_


    Undo the last thing typed on this command.


    ![](img/3658df520e459cc83b744521428473cf_59_0.png)


    Move the cursor to the left character.


    ![](img/3658df520e459cc83b744521428473cf_59_1.png)


    and ⌕


    Cycle through the command history (see Recipe 3.4 [Command History], page 43).


    NOTE: These keyboard commands are the same as those used by the Emacs editor (see
    Recipe 10.2 [Emacs], page 121). Many other Emacs keyboard commands also work on
    the command line (see Recipe 10.2.2 [Basic Emacs Editing], page 123). And, for
    Vi aficionados, it is possible to configure bash to recognize Vi-style bindings.


    The following sections describe some important features of command line editing,
    as quoting special characters and strings, letting the shell complete your typing,
    re-running commands, and running multiple commands. See Info file ''bashref.info'',
    node ''Command Line Editing'' for more information on bash''s command line editing
    features.


    # 3.1.1 Passing Special Characters to Commands


    Some characters are reserved and have special meaning to the shell on their own.
    Before you can pass one of these to a command, you must quote it by enclosing
    the entire argument in single quotes (''*'').


    For example, here is how to pass ''Please Stop!'' to a command:


    ```

    ''Please Stop!''

    ```


    When the argument you want to pass one or more single quote characters in it,
    enclose it in double quotes, like so:


    ```

    "Please Don''t Stop!"

    ```


    To pass special characters as a string, give them as:


    ```

    $''string''

    ```


    where string is the string of characters to be passed. Special backslash escape
    sequences for certain characters are commonly included in a string, as listed
    in the following table.'
