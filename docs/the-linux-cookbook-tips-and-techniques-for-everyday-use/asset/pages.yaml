  md: "# 25.1.1 Sending a Print Job to the Printer\n\nUse `lpr` to print a print job\
    \ to the printer—give the name of the file to print as an argument. (You can also\
    \ pipe the output of a command to `lpr`.)\n\n+   lpr writes a copy of the specified\
    \ file or text to the spool queue of the specified printer, to be sent to the\
    \ printer when the printer becomes available.\n\n+   To print the file `invoice`,\
    \ type:\n  $ `lpr invoice`\n\n+   To type a message with banner and send it to\
    \ the printer, type:\n  $ banner \"Bon voyage! | `lpr`\n\n+   To print a verbose,\
    \ recursive listing of the `/user/doc/HOWTO` directory, type:\n  $ `ls -LR /user/doc/HOWTO`\
    \ | `lpr`\n\nIf you have more than one printer connected to your system, specify\
    \ the printer to send as an argument to the `-P` option. (Printers have names\
    \ just as user accounts and hosts do, and it is the administrator's privilege\
    \ to name them; the default printer is usually l1p, for \"line printer.\\')\n\n\
    +   To send the file 'nightly-report' to the printer called bossomatic:\n  $ `lpr\
    \ -P bossomatic nightly-report`\n\n> NOTE: The name of the `lpr` tool comes from\
    \ \"line printer,\" which was the kind of printer hardware in popular use when\
    \ this program was first developed.\n\n# 25.1.2 Printing Multiple Copies of a\
    \ Job\n\nTo print more than one copy of a print job, give the number of copies\
    \ to print as an argument to the `-#` option of `lpr`.\n\n+   To print dozen copies\
    \ of the file 'nightly-report', type:\n  $ `lpr -12 nightly-report`\n\n# 25.1.3\
    \ Listing Your Print Jobs\n\nTo list your jobs, use `lpq`, the \"line printer\
    \ queue\" tool. It outputs a list of all jobs currently in the default printer's\
    \ spool queue—each on a line of its own—giving its rank in the queue, the username\
    \ who sent the job, the print job number, the file names in the job, and the size\
    \ of the data to be printed, in bytes.\n\n+   To view the spool queue for the\
    \ default printer, type:\n\n```\n$ lpq RET\nlpr is ready and printing        \
    \   Total Size\nRank Owner Job Files\nactive groucho 83 cigar.ps         1739030\
    \ bytes\n1st harpo 84 harp.ps                 499 bytes\n2nd chico 85 love.ps\
    \                   45576 bytes\n$\n```"
