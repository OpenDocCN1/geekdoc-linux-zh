  md: '# Chapter 3: The Shell


    # 3.5 Recording a Shell Session


    Use script to create a typescript, or “capture log,” of a shell session—it writes
    a verbatim copy of your session to a file, including commands you type and their
    output. The first and last lines of the file show the beginning and ending time
    and date of the capture session. To stop recording typescript, type exit at a
    shell prompt. By default, typescripts are saved to a file called ‘typescript’
    in the current directory; specify the file name to use as an argument.


    +   - To create a typescript of a shell session and save it to the file ‘log.19990817’,
    type:


    ```

    ```script log.19990817 RET

    Script started, output file is log.19990817

    $ hostname RET

    erie

    $ apropos bash > bash.commands RET

    $ exit RET

    exit

    Script done, output file is log.19990817

    $```

    ```


    In this example, the typescript records a shell session consisting of two commands
    (hostname and apropos) to a file called ‘log.19990817’. The typescript looks like
    this:


    ```

    Script started on Tue May 25 14:21:52 1999

    $ hostname

    erie

    $ apropos bash > bash.commands

    $ exit

    exit

    ```


    ```

    Script done on Tue May 25 14:22:30 1999

    ```


    NOTE: It’s possible, but usually not desirable, to run script from within another
    script session. This usually happens when you have forgotten that you are running
    it, and you may run it again inside the current typescript, even multiple times—as
    a result, you may end up with multiple sessions “nested” inside each other like
    a set of Russian dolls.


    # 3.6 Customizing Your Shell


    The following sections describe the most common ways to customize the shell—including
    changing the text of the prompt and creating aliases for other commands. These
    customizations will apply to the rest of your current shell session, unless you
    change them again. Eventually, you will want to make them work all the time, like
    whenever you log in or start a new shell—and how to do this is discussed below.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# 3.6.1 Changing the Shell Prompt


    A shell variable is a symbol that stores a text string, and is referenced by a
    unique name. bash keeps one special variable, named PS1, for the text of the shell
    prompt. To change the contents of the shell prompt, you need to change the contents
    of the PS1 variable.


    To change a variable''s contents, type its name followed by an equal sign (''='')
    character and the string that should replace the variable''s existing contents.


    +   To change your shell prompt to Your wish is my command: type:


    ```

    $ PS1=''Your wish is my command: RET

    Your wish is my command:

    ```


    Since the replacement text has spaces in it, we''ve quoted it (see Recipe 3.1.1
    [Passing Special Characters to Commands], page 36).


    You can put special characters in the prompt variable to order output special
    text. For example, the characters \w in the value of PS1 will list the current
    working directory at that place in the shell prompt.


    +   To change your prompt to the default bash prompt the current working directory
    followed by a ''$'' character-type:


    ```

    $ PS1=''\w $'' RET

    -$

    ```


    The following table lists some special characters and their text output at the
    shell prompt.


    | SPECIAL CHARACTER | TEXT OUTPUT |

    | \a | Inserts a C-g character, which makes the internal speaker beep. (It "rings
    the system bell": C-g is sometimes called the bell character.) |

    | \d | The current date. |

    | \h | The hostname of the system. |

    | \n | A newline character. |

    | \t | The current system time, in 24-hour format. |

    | \ | The current system time, in 12-hour a.m./p.m. format. |

    | \w | The current working directory. |

    | \u | Your username. |

    | \! | The history number of this command. |


    You can combine any number of these special characters with regular characters
    to create a value for PS1.'
  merge: -1
  pgno: 69
