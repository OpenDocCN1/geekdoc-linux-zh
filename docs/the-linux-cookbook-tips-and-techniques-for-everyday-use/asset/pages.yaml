  md: '# 2.5 Changing Your Password


    To change your password, use the `passwd` tool. It prompts you for your current
    password and a new password to replace it with. For security purposes, neither
    the old nor the new password is echoed to the screen as you type it. To make sure
    that you type the new password correctly, `passwd` prompts you for your new password
    twice. You must type it exactly the same way both times, or `passwd` will not
    change your password.


    +   - To change your password:


    ```

    $ passwd <RET>

    Changing password for kurt

    Old password: your current password <RET>

    Enter the new password (minimum of 5, maximum of 8 characters)

    nPlease use a combination of upper and lower case letters and numbers.

    New password: your new password <RET>

    Re-enter new password: your new password <RET>

    Password changed.

    $

    ```


    NOTE: Passwords can contain uppercase and lowercase letters, the digits 0 through
    9, and punctuation marks; they should be between five and eight characters long.
    See Recipe 2.2 [Accounts and Privileges], page 18, for suggestions on choosing
    a good password.


    # 2.6 Listing User Activity


    The recipes in this section describe some of the simple commands for finding out
    who you are currently sharing the system with and what they are doing.


    # 2.6.1 Listing Your Username


    Using `whoami` to output the username of the user that is logged in at your terminal.
    This is not as intuitive as a command as one might think—if you''re at a shared
    terminal, it''s useful to determine whether or not it is your account you''re
    missing in, and for those multiple accounts on a system, it''s useful to see which
    of them you''re currently logged in with.


    +   - To output your username, type:


    ```

    $ whoami <RET>

    kurt

    $

    ```


    In this example, the username of the user logged in at this terminal is ''kurt''.


    # 2.6.2 Listing Who Is on the System


    Use `who` to output a list of all the users currently logged in to the system.
    It outputs a minimum of three columns, listing the username, terminal location,
    and time of login for all'
