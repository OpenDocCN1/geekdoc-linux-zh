  md: "# 31.5 Getting Files from the Web\n\nNOTE: If you get serious about using Emacs/W3,\
    \ you'll almost certainly want to run the XEmacs flavor of Emacs—as of this writing,\
    \ GNU Emacs cannot display images.\n\nDebian: 'wget'\nWWW: http://www.wget.org/\n\
    \ wget, \"Web get,\" to download files from the World Wide Web. It retrieves files\
    \ from URLs that begin with either 'http' or 'ftp'. It keeps the file's original\
    \ timestamp, it's smaller and faster to use than a browser, and it shows a visual\
    \ display of the download progress.\n\nThe following subsections contain recipes\
    \ using wget to retrieve information from the Web. See file 'wget.info', node\
    \ 'Examples', for more examples of things you can do with wget.\n\nNOTE: To retrieve\
    \ an HTML file from the Web and save it as formatted text, use lynx instead—Recipe\
    \ 31.3.1 [Perusing Text from the Web], page 331.\n\n# 31.5.1 Saving a single URL\
    \ to a File\n\nTo download a file from the Web, give the URL of the file as an\
    \ argument to wget.\n\n+   For example, to download ftp://ftp.neuron.net/pub/spiral/september.mp3\
    \ to a file:\n\n```\n$ wget ftp://ftp.neuron.net/pub/spiral/september.mp3\n```\n\
    \nThis command reads a given URL, writing its contents to a file with the same\
    \ name as the original, 'september.mp3', in the current working directory.\nIf\
    \ you interrupt a download before it's finished, the contents of the file you\
    \ were retrieving will contain only the portion of the file you retrieved until\
    \ it was interrupted. Use wget with the '-c' option to resume the download from\
    \ the point it left off.\n\n+   To resume download of the URL from the previous\
    \ example, type:\n\n```\n$ wget -c ftp://ftp.neuron.net/pub/spiral/september.mp3\n\
    ```\n\nNOTE: for the '-c' option to have the desired effect, you should run wget\
    \ from the same directory as it was previously, where partially-retrieved file\
    \ will still exist.\n\n# 31.5.2 Archiving an Entire Site Web\n\nTo archive a whole\
    \ site, use the '-m' ('mirror') option, which saves files with the exact timestamp\
    \ of the original, if possible, and sets the 'recursive retrieval' option to download\
    \ everything. To specify the number of retries to use when an error occurs in\
    \ retrieval, use the '-t' option with a numeric argument—'-t3' is usually good\
    \ for safely retrieving across the network; use '-t0' to specify an infinite number\
    \ of retries, good for when a network connection is really bad but you really\
    \ want to archive something, regardless of how long it takes. Finally, use the\
    \ '-o' with a file name as an argument to write a progress log to the file—examining\
    \ it can be useful in the event that something goes wrong during the archiving;\
    \ once"
