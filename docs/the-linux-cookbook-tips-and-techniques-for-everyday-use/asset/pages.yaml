    # 13.1.7 Swapping Tab and Space Characters


    Use the expand and unexpand tools to swap tab characters for space characters,
    and to swap space characters with tabs, respectively.


    Both tools take a file name as an argument and write changes to the standard output:
    if no files are specified, they work on the standard input.


    To convert tab characters to spaces, use expand. To convert only the initial or
    leading tabs on each line, give the ''-i'' option: the default action is to convert
    all tabs.


    +   To convert all tab characters to spaces in file ''list'', and write the output
    to ''list2'', type:


    $ expand list > list2 RET


    +   To convert only tab characters to spaces in file ''list'', and write the output
    to the standard output, type:


    $ expand -i list RET


    To convert multiple space characters to tabs, use unexpand. By default, it converts
    leading spaces into tabs, counting eight space characters for each tab. The ''-a''
    option to specify that all instances of space characters are converted to tabs.


    +   To convert every leading space characters to tabs in file ''list2'', and write
    the output to ''list'', type:


    $ unexpand list2 > list RET


    +   To convert all occurrences of eight space characters to tabs in file ''list2'',
    and write the output to the standard output, type:


    $ unexpand -a list2 RET


    To specify the number of spaces to convert to a tab, give that as an argument
    to the ''-t'' option.


    +   To convert every leading space character to a tab character in ''list2'',
    and write the output to the standard output, type:


    $ unexpand -t 1 list2 RET


