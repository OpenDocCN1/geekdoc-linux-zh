- img_proc: true
  md: '# Chapter 29: Communications


    Once you''ve done these things, you should be able to start and stop PPP connections
    to the Internet. Complete documentation for setting up PPP is in the `/usr/share/doc/ppp`
    directory.


    # 29.1.2 Controlling a PPP Connection


    After PPP has been installed and configured, use the pon tool to start a PPP connection
    to the Internet. It calls the number of ISP with your modem, sends the appropriate
    login information, and starts the PPP connection.


    +   To start a PPP connection, type:


    ```

    $ pon

    ```


    Once you have a PPP connection, you can connect to other systems on the Internet
    via the WWW or other network services, as described in the following chapters.


    To make PPP automatically start when the system boots, rename the file `/etc/ppp/no_ppp_boot`
    to `/etc/ppp/ppp_on_boot`. (you must be root, the superuser, to do this.)


    To output the last few lines of PPP log file, type `log`. This is useful for checking
    the progress of your PPP connection when it dials.


    Use the poff tool to stop a PPP session. It disconnects your computer from your
    ISP and hangs up the modem.


    +   To stop a PPP session, type:


    ```

    $ poff

    ```


    # 29.2 Faxing


    Debian: ''efax''

    WWW: http://casas.ee.ubc.ca/efax/


    If you have a Class 1 or 2 fax modem, you can send and receive fax (“facsimile”)
    messages with your Linux system. The following subsections show how to do this
    with the `efax` package, which is designed for single user systems or relatively
    simple fax configurations (more complicated to fix extant, which is beyond the
    scope of this book).


    To set up `efax` for faxing, edit the file `/etc/efax.rc` (you must be **root**
    to do this). The important things to specify in this file are the value `DEV`,
    which is the device name in `/dev` of the fax or modem device (this should always
    be `modem0`), and the values for `FROM` and `NAME` are the fax number and organization
    name to appear on outgoing faxes.


    NOTE: Unless you have membership to the dialout group, before accessing the modem
    hardware you must ask your administrator for permission to use it (see Recipe
    A.3.2 [Letting Users Access Hardware Peripherals], page 363).


    More information on faxing is contained in the Fax Server mini-HOWTO` (see Recipe
    2.8.6 [Reading System Documentation and Help Files], page 32).'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 29.2.1 Sending a Fax


    Use efax to send a fax. It dials the telephone number you give and faxes the contents
    of the file you specify. You can send plain text files or files in TIFF Group
    3 format as they are. You can also send files in other formats, but you must convert
    them to ''tiff3''—see Recipe 29.2.4 [Converting to from Fax Format], page 311.


    Use the ''-d'' option to specify the full path of the fax device (usually ''/dev/modem''
    if you are using the modem connected to your system) and the ''-t'' option followed
    by a telephone number to specify the number you are to send the fax to. To specify
    DTMF tone dialing, precede the phone number with a ''t''; pauses in the dialing
    sequence with a comma ('','') character this is useful for dialing out from a
    PBX or office phone system.


    +   * To have a copy of the file ''resume.txt'' to the number ''555-9099'', using
    DTMF tone dialing, type:


    ```

    $ efax -d /dev/modem -t T555-9099 resume.txt

    ```


    To send more than one file, specify them as arguments in the order they are to
    be sent. You can also specify files with the wildcard character, but be careful—they
    are sent in the order which the shell expands the file names, which is alphabetical
    order. If you have a lot of files that should be in a particular order, rename
    so their file names begin with the number of digits for each file—for example,
    if you have eleven files to fax, don''t name them ''1.fax'', ''2.fax'', and so
    on, to ''10.fax'' and ''11.fax'', the shell will expand in the order ''1.fax'',
    ''10.fax'', ''11.fax'', ''2.fax'' and so up to ''9.fax''. In this case, you number
    them as ''01.fax'', ''02.fax'', and so on, so that files from nine hundred contain
    the same number of digits in their name as ''10.fax'' and ''11.fax''.


    +   * To fax all of the files with the ''.fax'' extension in the current directory
    to the number ''555-9099'', using DTMF tone dialing, type:


    ```

    $ efax -d /dev/modem -t T555-9099 *.fax

    ```


    Another way is to make a text file containing the list of files to fax, one name
    per line, in the order you send them. If the files you want to send are not in
    the current directory, be sure to write the file names with path relative to the
    current directory—for example, if you want to send the file ''header.fax'', which
    is in your current directory, and the current directory is ''/documents/faxes/'',
    the file should be specified as ''/header.fax''.


    +   * To fax all of the files listed in the file ''fax.list'' to the number ''555-9099'',
    dialing ''9'' first to obtain from an outside line, and using DTMF tone dialing,
    type:


    ```

    $ efax -d /dev/modem -t T9,555-9099 $ $(cat fax.list)

    ```


    NOTE: efax does not delete the files it faxes.


    # 29.2.2 Receiving a Fax


    To receive a fax, use efax with the ''-r'' option. You may also use an ''-SO=1''
    command to the modem to set it to auto answer, and use ''-kZ'' to send an ''ATZ''
    reset to the modem after efax exits.


    As sending a fax, specify the full path name of the device file to use with the
    ''-d'' option.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Chapter 29: Communications


    By default, efax outputs a ''session log'' to the standard error, containing information
    on the status of the fax messages received; use redirection to redirect it to
    a file (see Recipe 3.2.3 [Redirecting Error Messages to a File], page 40).


    +   - To set efax to receive an incoming fax, saving the session log to a file,
    ''faxlog'',


    ```bash

    efax -d /dev/modem -kZ -w -iSO=1 2>&1 >> faxlog RET

    ```


    This command starts efax and sets up the modem to wait for an incoming fax. After
    a fax is received, efax exits. You can stop efax before it receives a fax by typing
    c-c or by killing the efax job (see Recipe 3.3.5 [Stopping a Job], page 44).


    When a fax is received, it is written to a file in the current directory whose
    name consists of the current numeric date and a session number generated by efax;
    each page is written to a separate file three-digit file extension is the page
    number. The received files are in TIFF Group 3 format; use display to view them
    (see Recipe 17.2 [Viewing an Image in X], page 208), or convert them to PostScript
    or another format for printing (see Recipe 29.4 [Converting to and Fax Format],
    page 311).


    # 29.2.3 Receiving Faxes Automatically


    WWW: http://dsl.org/comp/tinytutils/


    The command described in the previous recipe can only receive one fax; once the
    fax is received, efax exits. To stop your system so that you automatically receive
    all incoming fax messages continually, until you interrupt it, use ''mazon'',
    part of the tinytutils package. It starts efax for receiving an incoming fax,
    as explained previously, but after a fax is received, it starts efax again and
    continues until you interrupt.


    +   - faxon RET receiving any incoming fax messages, type:


    ```

    $ faxon RET

    eifax: Wed Feb 24 08:38:52 1999 efax 0.8a (Debian release 08a-6)

    Copyright 1996 Ed Caasas

    efax: 38:52 opened /dev/modem

    efax: 38:53 waiting for activity

    ```


    Each time a fax is received and then saved, efax restarts, waiting for another
    fax. A session log is written to the file ''faxlog'' in your home directory.


    Should an incoming facsimile arrive, efax will receive it and write the message
    in files in the current directory, with a file name connection as described previously;
    then efax restarts, ready to receive another fax. C-c to stop the script and exit
    efax.


    # 29.2.4 Converting to and from Fax Format


    In order to view or print a received fax, or to fax a file that you have, you
    must first convert the fax from or to the TIFF Group 3 (''tiff3'') fax format,
    which is the standard for formatting fax files. (You can, however, view ''tiff3''
    files with the GIMP, or with display - see Recipe 17.2 [Viewing an Image in X],
    page 208).'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# 312 The Linux Cookbook: Tips and Techniques for Everyday Use


    Use efix to convert (or "fix") files for faxing; it will convert a file you want
    to fax to the ''tiff3'' format. You can also use it to convert received fax files
    to another format you can view or print. efix outputs to standard output, but
    you can redirect its output to a file to save it.


    To convert a file for faxing, type e followed by the name of the file to convert,
    and redirect standard output to the file you want to contain your fax image. efix
    can read plain text, PBM, and TIFF files.


    +   - To convert the file ''chart.pbm'' for faxing, type:


    ```

    $ -i pbm chart.pbm > chart.fax RET

    ```


    This command converts a copy of the file ''chart.pbm'' to the ''tiff3'' fax format,
    writing it to a file called ''chart.fax''. The original PBM file is not altered.


    To convert a PostScript file to fax format, use gs and specify tiff3 as the output
    device to see—Recipe 25.3.1 [Preparing a PostScript File for Printing], page 275.


    +   - To convert the PostScript ''resume.ps'' for fax format, type:


    ```

    $ gs -q -sDEVICE=tiff3 -dSAFER -dOPAUSE -soutputfile=resume.ps resume.ps < /dev/null
    RET

    ```


    This command (typed all on one line) writes a copy of the file ''resume.ps'' to
    the file ''resume.fax'' in ''tiff3'' format, which you can send it as a fax. The
    original PostScript file is not altered.


    To convert a received fax to a PostScript file that you can preview (see Recipe
    17.1.2 [Previewing a PostScript File], page 207) or print (see Recipe 25.1.1 [Sending
    a Job to the Printer], page 272), use the -o ps option.


    +   - To convert ''19990325.001'', a received fax file, to a PostScript file,
    type:


    ```

    $ -o ps 19990325.001 > received.ps RET

    ```


    This command converts the file into a PostScript file called ''received.ps''.


