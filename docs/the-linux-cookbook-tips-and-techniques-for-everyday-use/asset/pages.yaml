  md: '# 19 Importing Images


    While you can always make your own images, you may sometimes want to import and
    use existing images from other sources. In this chapter, I''ll show how to import
    images from scanners and Kodak PhotoCD discs. We''ll begin with recipes for taking
    screen shots.


    # 19.1 Taking Screen Shots


    A screen is a picture of all or part of the display screen. The following recipes
    show you how to take screen shots in X and in the console.


    # 19.1.1 Taking a Screen Shot in X


    Debian: ''imagemagick''

    WWW: ftp://ftp.wizards.dupont.com/pub/ImageMagick/


    Use import, part of the ImageMagick suite, to take a screen shot in X. import
    can capture the entire screen, a single window, or an arbitrary rectangular area,
    taking as argument the name of the file to save to. With other ImageMagick tools,
    the image format of the output file depends on the file extension you specify:
    ''.eps'' for EPS, ''.tiff'' for TIFF, ''.jpeg'' for JPEG, and so on. (For a complete
    list, see Recipe 18.2 (Converting Images from Formats; page 223)).


    After you give the command, the mouse pointer changes to a set of cross-hairs.
    Then use the mouse to specify which window to take the shot of, as follows:


    +   - Left-click on a window to capture it.

    - Left-click on the root window to capture the entire screen.

    - Left-click and drag the mouse across an area of the screen to form a rectangular
    selection outline; release the mouse button to capture the selected area.


    When you specify a window, import captures only the window''s contents; use the
    ''-frame'' option to include the window manager frame in the image.


    To capture a particular window, including its window manager frame, and write
    it to a PNG-format file, first type:


    ```

    $ import -frame session-1.png (RET)

    ```


    +   - Then, left-click on the window you want to capture.

    - In this example, the capture is saved to a file ''session-1.png''.


    > NOTE: The system bell rings once when the screen capture starts, and twice when
    the captures finishes.


    # 19.1.2 Taking a Screen Shot in a Console


    To take screen shots in a virtual console, use cat to save the contents of the
    device file corresponding to that virtual console; these are in the ''/dev'' directory,
    and are in the format vcsnumber, where number is the number of the virtual console.


    For example, if the target console is the first virtual console (which you would
    see by typing ALT-F1), the device to cat is ''/dev/vcs1''.'
  merge: -1
  pgno: 252
- img_proc: true
  md: "# The Linux Cookbook: Tips and Techniques for Everyday Use\n\n+   - To take\
    \ a screen shot of the fourth virtual console, and save it to a file called 'screenshot',\
    \ type:\n  $ /dev/vcs4 > screenshot\n\nNOTE: You must have superuser privileges\
    \ to access these files (see Appendix A [Administrative Issues], page 359).\n\n\
    Take the screen shot from a virtual console different from the one you want to\
    \ capture, the command line you give will be included in the shot! (Kind of like\
    \ having your thumb in front of the lens while taking a photograph.)\n\nScreenshots\
    \ of virtual consoles, as shown here, are saved as text files; you can't take\
    \ screen shots of virtual consoles when graphics are displayed.\n\n# 19.2 Scanning\
    \ Images\n\nDebian: 'sane'\nWWW: http://www.mostang.com/sane/\n\nSANE, \"Scanner\
    \ Now Easy,\" is the de facto Linux scanner interface; it can scan an image with\
    \ a scanner and save it to a file.\nANE works with a wide array of hardware, but\
    \ make sure the hardware you want to use is compatible by checking the Hardware\
    \ HOWTO (http://linuxdoc.org/HOWTO/Hardware-HOWTO.html) and SANE's list of supported\
    \ scanners (http://www.mostang.com/sane/sane-backends.html).\n\nOnce you have\
    \ SANE running, you can scan images with SANE-aware applications like the GIMP\
    \ (see Recipe 18.3 [Editing Images with the GIMP], page 225).\n\nThe following\
    \ recipes describe use of the command-line scan tool, which comes with the SANE\
    \ package.\n\nNOTE: As the acronym implies, getting a scanner to work on a Linux\
    \ system isn't always smooth going. The SANE interface is completely open, and\
    \ its developers are making it generalized enough to be implementable on any hardware\
    \ or operating system.\n\n# 19.2.1 Listing Available Scanner Devices\n\nBefore\
    \ you use a scanner device, you need to know its device name. To get this name,\
    \ use scanimage with the '--list-devices' option.\n\n+   - To list scanner devices,\
    \ devices:\n\n```\n$ scanimage --list-devices\ndevice 'amax:/dev/usb/' is a UMAX\
    \          Astra 1220S          flatbed scanner\n$\n```\n\nIn this example, there's\
    \ one scanner device on this system, a UMAX brand scanner that can be specified\
    \ by scanimage by giving its device name, 'amax:/dev/usb/', as an argument to\
    \ the '-d' option."
  merge: -1
