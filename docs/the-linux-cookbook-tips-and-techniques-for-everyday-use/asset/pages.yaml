    \ to make a file identical to the one it was compared with.\n\nTo compare two\
    \ files and output a difference report, give their names as arguments to diff.\n\
    \n+   - To compare the files 'manuscript.old' and 'manuscript.new', type:\n  -\
    \ $ diff manuscript.old manuscript.new manuscript.diff RET\n\nThe difference report\
    \ is output to standard output; to save it to a file, redirect the output to the\
