  md: 'Upon startup in X, a typical GNU Emacs window looks like this (the window frame
    will differ depending on your window manager):


    ![](img/3658df520e459cc83b744521428473cf_145_0.png)


    The welcome message appears when Emacs first starts, and it tells you, among other
    things, how to run a tutorial (which we will look at in just a minute).


    The top bar is called the menu bar, and you can pull down its menus with the mouse
    (or, in the console, with C-F10).


    A file or other text open in Emacs is held in its own area called a buffer. By
    default, the current buffer appears in the large area underneath the menu bar.
    To write in the buffer, just type. It places in the buffer where the cursor is
    at called point; and is referenced by many Emacs commands.


    The horizontal bar at the bottom of Emacs window and directly displays the current
    buffer is the mode line; it gives information about the current buffer, including
    its name, percentage of the buffer fits on the screen, where line point is, and
    whether or not the buffer is saved to a file.


    The mode line also lists the modes active in the buffer. Emacs modes are general
    states that control how Emacs behaves—for example, when Overwrite mode is set,
    text you overwrites the text at point; in Insert mode (the default), text you
    type is inserted at point. Usually, either Fundamental mode (the default) or Text
    mode will be listed.


    The echo area is where Emacs writes status messages, such as error messages; it
    is the last line in Emacs. When you run a command that requires input, input is
    requested in this area (and when that happens, you place your input, in the echo
    area, is called the minibuffer).


    Emacs commands begin with a Control or Meta (Escape) key sequence; many begin
    with the C-x sequence, which you type by pressing and holding the CTRL key and
    then pressing the key (Typographical Conventions), page 3).


    Because Emacs is different in culture from the editors and approach of the Microsoft
    Windows and Apple macOS world, it has gotten a rather unfounded reputation in
    those corners that it is often and difficult to use. This is not. The keyboard
    commands to run its various functions are designed for ease of use and easy recall.'
  merge: -1
