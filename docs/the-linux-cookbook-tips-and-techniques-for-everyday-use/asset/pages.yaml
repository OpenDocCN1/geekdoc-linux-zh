  md: '# 236 The Linux Cookbook: Tips and Techniques for Everyday Use


    +   - To extract only the first page from the file ''abstract.dvi'' and send the
    PostScript output to the printer, type:


    ```

    $ dvips -pp1 abstract.dvi RET

    ```


    By default, dvips will output to the printer; to save the PostScript output to
    a file, give the file name to use for output with the ''-o'' option.


    +   - To output as PostScript the pages 137 to 146 of the file ''abstract.dvi''
    to the file ''abstract.ps'', type:


    ```

    $ dvips -pp137-146 -o abstract.ps abstract.dvi RET

    ```


    # 20.1.2 Extracting Pages from a PostScript File


    Use psselect to select pages from a PostScript file; when you give an input file,
    it outputs a new PostScript file containing the specified pages.


    Give the pages to select as arguments to the ''-p'' option: you can list pages
    and ranges of pages as numbers between a hyphen; ''4-6'' specifies pages four
    through six, inclusive. If you omit the first number in a pair, the last number
    is assumed, the last page is assumed. Pages are written to the new file in the
    order they are specified.


    To select page 47 from the PostScript file ''newsletter.ps'' and output it to
    the file ''selection.ps'', type:


    ```

    $ psselect -p47 newsletter.ps selection.ps RET

    ```


    +   - To select the first ten, pages 23 through 28, and page 2 from the file ''newsletter.ps''
    and write it to the file ''selection.ps'', type:


    ```

    $ psselect -p1-10,104,23-28,22 newsletter.ps selection.ps RET

    ```


    In the preceding example, page 2 is selected twice.

    Prefix a number with an underscore (''_'') to indicate that the page number is
    relative to the last page, counting backwards towards the first page.


    +   - To select the second-to-last through the tenth-to-last pages from the PostScript
    file ''newsletter.ps'' and output them to the file ''selection.ps'', type:


    ```

    $ psselect -p2_-10 newsletter.ps selection.ps RET

    ```


    +   - To select the second-to-last through the tenth pages from the PostScript
    file ''newsletter.ps'' and output them to the file ''selection.ps'', type:


    ```

    $ psselect -p2_-10 newsletter.ps selection.ps RET

    ```


    Use the ''-e'' option to select all even-numbered pages, and the ''-o'' option
    to select all odd-numbered pages.


    +   - To select all of the even pages in the file ''newsletter.ps'' and write
    them to a new file, ''even.ps'', type:


    ```

    $ psselect -e newsletter.ps even.ps RET

    ```


    +   - To select all of the odd pages in the file ''newsletter.ps'' and write them
    to a new file, ''odd.ps'', type:


    ```

    $ psselect -o newsletter.ps odd.ps RET

    ```'
  merge: -1
