  md: '# Appendix A: Administrative Issues


    NOTE: If the output of the which command returns nothing, that means that the
    perl program is not installed on your system at all; in that case, you should
    install the perl software.


    # A.3 Administering Users


    This section describes some of the things the system administrator will have to
    do in administering the system''s users.


    All of these commands must be run by the superuser, using the root account—these
    commands edit system files.


    # A.3.1 Making a User Account


    To make a new user account, use adduser. It takes as an argument the username
    to use for the new account. It will prompt for default setup information, including
    the user''s full name and an initial password to use.


    +   - To create a new user with a username of bucky, type:


    ```

    # adduser bucky

    ```


    NOTE: By default, the name of the user''s home directory will be the same as the
    username. For example, the user bucky will have a home directory of ''/home/bucky''.


    # A.3.2 Letting Users Access Hardware Peripherals


    Certain peripherals, like CD-ROM drives and soundcards, normally require super
    privileges to access them. These devices also have groups of their own, so a regular
    user can also access them by membership to their groups (see Recipe 6.1 [Groups
    and How to Work in], page 83).


    The groups that regular users want to be part of floppy (the floppy disk drive),
    audio (the soundcard), and dialout and dip (modern dial-out privileges).


    Use addgroup to add a user to the group associated with a hardware device. Give
    as arguments the username to add and the name of the group to add to.


    +   - To add the dog to the audio group, type:


    ```

    # addgroup dog audio

    ```


    # A.3.3 Letting Users Mount Drives


    The /etc/fstab file specifies the filesystems in a system, including those that
    may be mounted by floppy or CD-ROM drive. In order to let users mount disks on
    these drives, make sure there is a line in /etc/fstab for both the and CD-ROM
    drives, each containing the ''user'' flag:


    | /dev/fd0 | auto defaults,noauto,user 0 0 |

    | /dev/cdrom | auto defaults,noauto,user 0 0 |'
  merge: -1
