    apply to the members of the bridge group.


    Use the ''-R'' option to recursively change the group ownership of directories
    and all of their contents.


    +   - To give group ownership of the ''maps'' directory and all the files it contains
    to the bridge group, type:


    ```

    $ chgrp -R bridge maps RET

    ```


    # 6.3 Controlling Access to Files


    Each file has permissions that specify what type of access to the file users have.
    There are three kinds of permissions: read, write, and execute. You need read
    permission for a file to read its contents, write permission to write changes
    or remove it, and execute permission to run it as a program.


    Normally, users have write permission only for files in their own home directories.
    Only the superuser has write permission for the files in important directories,
    such as /bin and /etc-so as a regular user, you never have to worry about accidentally
    writing or removing an important system file.


    Permissions work differently for directories than for other kinds of files. Read
    permission for a directory lets you see the files in the directory; write permission
    lets you create, move, or remove files in the directory; and execute permission
    lets you use the directory name in a path (see Chapter 5 [Files and Directories],
    page 65).


    If you have read permission but not execute permission for a directory, you can
    only read the names of files in that directory you can''t read their other attributes,
    examine their contents, write to them, or execute them. With execute but not read
    permission for a directory, you can read, write, or execute any file in the directory,
    provided that you know its name and that you have the appropriate permissions
    for that file.


    Each file has separate permissions for three categories of users: the user who
    owns the file, all other members of the group that owns the file, and all other
    users on the system. If you are a member of the group that owns a file, the file''s
    group permissions apply to you (unless you are not the owner of the file, in which
    case the user permissions apply to you).


    When you create a new file, it has a default set of permissions-usually read and
    write for the user, and read for all others. (On some systems, the default permissions
    are read and write for both the user and group, and for all other users.)


    The access permissions for a file are collectively called its access mode. The
    following sections describe how to list and change access modes, including how
    to set the most commonly used access modes.


    NOTE: The superuser, root, can always access any file on the system, regardless
    of file permissions.


    See info ''fileutils.info'', node ''File permissions'', for more information on
    file permissions and access modes.'
  merge: -1
  pgno: 108
