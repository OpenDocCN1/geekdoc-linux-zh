  md: '# 15 Typesetting and Word Processing


    If you''re coming to Linux with a Microsoft Windows or Apple MacOS background,
    or from some other non-Unix computing environment, you are likely used to one
    approach to “word processing.” In these environments, most writing is done in
    word processors large programs that offer a vast array of formatting options and
    store their output in proprietary file formats. Most people use word processors
    no matter where the intended output will go (even if it''s just your day).


    Word processors, from complete suites like StarOffice to commercial favorites
    like Word-Perfect, are all for Linux and have been for years. However, the standard
    computing paradigm known as “word processing” has never really taken off on Linux—or,
    for that matter, on Unix-like operating systems in general. With Linux, most writing
    is done in a text editor, and files are kept in plain text.


    When you keep a file in plain text, you can use command-line tools to format the
    pages and paragraphs; add page numbers and headers; check the usage; count the
    lines, words, and characters; convert it to HTML and other formats; and print
    the text in a format of your choosing—all of which are described in the recipes
    in this book. The text can be formatted, analyzed, cut, chopped, sliced, diced,
    and otherwise processed by the vast array of Linux command tools that work on
    text—over 750 in an average installation.


    This approach may seem primitive—especially to those wanting in a computing environment
    that dictates that all writing must be set in a typeface from the moment of creation—but
    the word-processing approach is excessive compared to what Linux provides. You
    can, if you like, view or print plain text in a format, with a single command
    of time, away what ninety percent of people want to do with a word processor.
    To do this, see Recipe 15.2 [Converting Plain Text for Output], page 179.


    It''s my opinion that word processing is not a forward-thinking direction for
    the handling of text, especially on Linux systems and now that text is not always
    defined for printed output; text can end up on a Web page, in an email message,
    or possibly in print. The best common source for these formats is plain text.
    Word processing programs, and the special file formats they require, are anathema
    to the generalized, toolsbased and plain-text philosophy of Unix and Linux (see
    Recipe 11.6 [Unix and the Tools Philosophy], page 13). “Word processing” itself
    may be an obsolete idea of the 1980s personal computing environment, and it may
    no longer be a necessity in the age of the Web and email—media in which plain
    text content is more native than proprietary processors.


    If you need to design a special layout for hardcopy, you can typeset the text.
    could write a book on the subject of Linux typesetting; unfortunately, no such
    book has been written, but this chapter contains recipes for producing types text.
    They were selected as the easiest to prepare or most effective for their purpose.


    NOTE: For more information on this subject, I recommend Christopher B. Browne''s
    excellent overview, “Word Processors for Linux” (http://www.hex.net/~cbbrowne/wp.html).'
  merge: -1
