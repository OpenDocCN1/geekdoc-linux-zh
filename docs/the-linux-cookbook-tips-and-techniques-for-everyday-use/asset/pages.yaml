  md: '# Appendix B Linux Resources on the Web


    To get the latest news related to Linux and the free software movement, find new
    documentation, and keep up to date with the latest in free software, you''ll want
    to turn to the Web.


    The following table is by no means a complete list of these resources, but it
    gives what I consider to be the most important and useful Web resources for Linux,
    and free software in general. These are all sites which every avid GNU/Linux enthusiast
    should be aware of.


    | WEB RESOURCE | DESCRIPTION |

    | http://freshmeat.net/ | Freshmeat contains descriptions and links to thousands
    of free software packages. |

    | http://www.gnu.org/ | The GNU Project Web site lists new software packages as
    they become part of the GNU Project. This site is also the home of the Free Software
    Foundation, and is a source for both philosophical readings and news about the
    free software movement. |

    | http://linux.com/ | In addition to the latest in news, linux.com provides feature
    stories, links, and a database of Linux User Groups. |

    | http://linuxgazette.com/ | The Linux Gazette is a monthly website devoted to
    “making Linux just a little more fun”, and it has been published by SSC for years.
    Its “More-2-Cent Tips” column is famous. |

    | http://linuxdoc.org/ | The Linux Documentation Project manages the creation
    and upkeep of Linux HOWTOs and other documentation. |

    | http://lwn.net/ | Linux Weekly News contains great coverage for Linux and related
    free software. |

    | http://mainmatter.com/ | This site hosts the Linux FAQ. |

    | http://sal.kachinatech.com/ | SAL (“Scientific Applications on Linux”) is the
    authoritative listing of scientific software that runs on Linux-based systems.
    |

    | http://slashdot.org/ | Slashdot is a popular news and discussion site for members
    of the Linux and free software community; many people usually check Slashdot several
    times daily. |

    | http://sourceforge.net/ | Sourceforge is the Internet’s largest community of
    developers of free software; it gives free resources to developers of free software.
    |'
