  md: "# 22.1.3 Stopping an Audio CD\n\nTo stop playback of an audio CD, use `cdstop`.\n\
    \n+   - To stop the current CD playback, type:\n  `cdstop`\n\n# 22.1.4 Shuffling\
    \ Audio CD Tracks\n\nUse `cdplay` with the ‘shuffle’ argument to play the CD tracks\
    \ in random order.\n\n+   - To shuffle CD playback, type:\n  `cdplay shuffle`\n\
    \n# 22.1.5 Displaying Information about an Audio CD\n\nUse `cdinfo` to display\
    \ information about an audio CD, including its play status and track times. With\
    \ no options, it outputs the play status: ‘play’ if the CD is currently playing,\
    \ ‘paused’ if the CD is currently on pause, ‘no-status’ if the CD is not playing,\
    \ and ‘nodisc’ if no disc is in the drive.\n\n+   - For the current status of\
    \ the audio CD in the CD-ROM drive, type:\n  `cdinfo`\n\nIn addition, `cdinfo`\
    \ recognizes the following options:\n\n| Option | Description |\n|---|---|\n|\
    \ -a | Output the absolute disc time. |\n| -r | Output the relative track time.\
    \ |\n| -s | Output the play status (the default action). |\n| -t | Output the\
    \ current track. |\n| -v | Output all available information: play status, current\
    \ track, absolute disc, and relative track time. |\n\nTo show the lengths of all\
    \ tracks on an audio CD in a directory-like format, use `cdir`. This tool will\
    \ also show titles and artist names, if known, but for this work, you must set\
    \ up an audio CD database (see `cdtool man` page for details—Recipe 2.8.4 [Reading\
    \ a Page from the System Manual], page 30).\n\n+   - To show a list of tracks,\
    \ type: *"
