    \ in all of the '*.txt' files in the '/doc' directory containing the word 'CD',\
    \ suppressing the list of file names in the output, type:\n  * `grep -h /doc/*.txt`\n\
    \nUse the '-r' option to search a given directory recursively, searching all subdirectories\
    \ it"
