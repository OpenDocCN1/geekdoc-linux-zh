    The following table describes some of pr'' options; use the pr info for a complete
    description of its capabilities (see Recipe 2.8.5 [Using the GNU Info System],
    page 31).


    | OPTION | DESCRIPTION |

    | +first:last | Specify the first and last page to print; the last page can be
    omitted, so +7 begins processing with the seventh page and continues until the
    end of the file is reached. |'
