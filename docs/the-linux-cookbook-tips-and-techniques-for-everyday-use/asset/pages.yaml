  md: '# Chapter 30: Email


    325


    You create your signature file in a text editor, just like any other text file.
    Name the file ''.signature'' or ''.sig'' and keep it in your home directory.


    If you want to use more than one signature, use **sigrot** to "rotate" your various
    signatures—every time you run **sigrot**, it selects one of the signature files
    you keep in your ''.sig'' directory and writes it to ''.signature''. To change
    your ''.signature'' every time you log in, you would run **sigrot** in your ''.bash_login''
    file (see Chapter 3 [The Shell], page 35).


    # 30.6 Picking the Right Mail Application


    The following table lists some of the more popular MUAs that are available for
    Linux, describing their special features, and listing their Debian package name
    and URL (when available).


    | APPLICATION | DESCRIPTION |

    | --- | --- |

    | balsa | A graphical email client that works in X with GNOME installed; its interface
    is inspired somewhat by the proprietary Endora.

    Debian: ''balsa''

    WWW: http://www.balsa.net/ |

    | elm | A menu-driven MUA, **elm** was inspired in the early 1990s among experienced
    users—it has some interesting features, including ways to send mail in batch mode
    to many addresses at once, and a tool to send telephone messages as emails. Interest
    in **elm** has waned over the years, and most novices are advised to try mut instead.

    Debian: ''elm me+''

    WWW: http://www.instinct.org/elm/ |

    | gnus | The **gnus** newsreader for Emacs2 can also be used to read and send
    mail. It has many features and should appear to Emacs lovers—a warning: it can
    be daunting to learn!

