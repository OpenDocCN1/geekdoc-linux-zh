  md: "# Chapter 27: Reminders\n\n```\n$ calendar RET\n6/16    Finish draft of book\n\
    \        Party at Jack's\nFri     Lunch with Kim and Jo, 12:30\nMon     Book manuscript\
    \ due\n$\n```\n\nThe calendar tool reportedly first appeared in Version 7 of AT&T\
    \ UNIX, and was rewritten early for the BSD family of Unix. While the BSD derivate\
    \ is available for Debian as part of the bsdmutils package, this tool isn't standard\
    \ on all Linux distributions.\n\nThe following are recipes for writing your calendar\
    \ files, including other calendar files in your own calendar file, and for automating\
    \ the delivery of your reminders.\n\n> **Note:** Emacs has its own equivalent\
    \ to this tool, which it calls the “Diary.” See Info file ‘emacs-e20.info’, note\
    \ ‘Diary’ for more information on this feature.\n\n# 27.4.1 Making an Appointment\
    \ File\n\nTo begin using calendar, you will need to make a “calendar file” where\
    \ you can enter your appointments. It’s just a plain text file, and can be called\
    \ either ‘calendar’ or '.calendar’; the latter makes it a “hidden” file, as described\
    \ in Recipe 5.3.4 [Listing Hidden Files], page 73.\n\nWrite each appointment or\
    \ calendar entry on a line by itself; blank lines in the file are ignored. The\
    \ format of a calendar entry is as follows:\n\n```\n[date | tabs or spaces] [text\
    \ of reminder itself]\n```\n\nJust about every common date style is recognized.\
    \ For example, the following are all valid dates for the fourth of July:\n\n```\n\
    7/4\nJuly 4\nJuly 4\nJul. 4\nJul 4\n```\n\nEntries are not constrained to a single\
    \ day; you can have entries for a day of the week or for a certain month ‘Mon’\
    \ or ‘Monday’ for every Monday; ‘Jun’ or ‘June’ for the first day of every June.\
    \ You can use an asterisk as well: /*13* reminds you of something on the thirteenth\
    \ of every month. When the date is omitted on a line, the date of the preceding\
    \ appointment is assumed.\n\nFor example, suppose you have a file called ‘calendar’\
    \ in your home directory that looks like:\n\n```\n6/16    Finish draft of book\n\
    \        Party at Jack's\n6/20    Gallery reading\nFri     Lunch with Kim and\
    \ Jo, 12:30\nMon     Book manuscript due\n```\n\nIf the current date is 16 June,\
    \ a Friday, and you run calendar in your home directory, you'll get the same output\
    \ as in the example in the previous section, Recipe 27.4 [Managing Appointments],\
    \ page 288."
