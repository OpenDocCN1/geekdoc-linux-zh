  md: "# 23.2.4 Adding Echo to a Sound File\n\nTo add echo to a sound file, use the\
    \ 'echo' effect. It takes as arguments the 'gain-in' and 'gain-out' volume levels,\
    \ as well as the delay and decay, both in milliseconds.\n\n+   * To add 100 millisecond\
    \ echo to the sound file 'old.wav' and write output to 'new.wav',\ntype:\n  $\
    \ so old.wav .new.wav echo .5 100 .5 RET\n* To add a second-echo to the sound\
    \ file 'old.wav' and write output to 'new.wav',\ntype:\n  $ so old.wav new.wav\
    \ echo .5 1000 .5 RET\n* To add a 'tin-can' echo effect to 'old.wav' and write\
    \ the output to 'new.wav',\ntype:\n  $ so old.wav new.wav echo 1 .5 .5 RET\n\n\
    NOTE: The 'echo' effect works with 'echo', but adds a sequence of echoes to the\
    \ sound file.\n\n# 23.2.5 Adding Flange to a Sound File\n\nThe 'flanger' effect\
    \ adds flange to a sound file. It takes as arguments the 'gain-in' and 'gain-out'\
    \ volume levels, as well as the delay and decay in milliseconds, and the speed\
    \ of the flange, in Hertz. Specify the type of modulation with either '-s' (for\
    \ sinusoidal) or '-t' (for triangular).\n\n+   * To add an 'underwater' flange\
    \ to the file 'old.wav' and write the output to 'new.wav',\ntype:\n  $ so old.wav\
    \ new.wav flanger .5 .4 .5 1 -t RET\n* To add flange that sounds somewhat like\
    \ a 'wah-wah' effect pedals to the file 'old.wav' and write the output to 'new.wav',\n\
    type:\n  $ so old.wav new.wav flanger .5 .5 1 2 -t RET\n\n# 23.2.6 Adding Phase\
    \ to a Sound File\n\nThe 'phaser' effect adds phase to a sound file. It takes\
    \ the same arguments as the 'flanger' effect.\n\n+   * To add a heavy phase to\
    \ the file 'old.wav' and write the output to 'new.wav',\ntype:\n  $ so old.wav\
    \ new.wav phaser 1 .5 .4 1 -s RET\n* To add phased 'breathing' effect to the file\
    \ 'old.wav' and write the output to 'new.wav',\ntype:\n  $ so old.wav new.wav\
