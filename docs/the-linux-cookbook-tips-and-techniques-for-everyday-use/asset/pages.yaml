- img_proc: true
  md: '# Chapter 24: Disk Storage


    an empty `/floppy` directory for this purpose. (Another general-purpose directory
    for mounting filesystems is the `/mnt` directory.)


    **NOTE:** While you cannot mount a filesystem on a directory containing other
    files, you can always create a new directory to mount a filesystem.


    When you mount a disk on a directory, that directory contains all the files and
    directories of the disk''s filesystem: when you later unmount disk, that directory
    will be empty—all the files and directories on the disk are still on the disk''s
    filesystem, but the filesystem is no longer mounted.


    When you''re using a floppy, you must mount it before you remove it from the drive.
    If you don''t, you risk corrupting or deleting some of the files on it: Linux
    may still be using the mounted files when you remove the disk (see, Recipe 2.1.2
    [Shutting Down the System], page 17).


    The following sections show you how to format, mount, and unmount floppies. On
    many systems, you need superuser privileges to do any one of these actions.


    **NOTE:** For recipes describing use of MS-DOS (and Microsoft Windows) formatted
    disks under Linux, see Recipe 26.1 [Using DOS and Windows Disks], page 279.


    # ## 24.3.1 Formatting a Floppy Disk


    Use `mkefs` to format a floppy and make a Linux filesystem. Give the name of the
    device file of the floppy drive as an argument—`/dev/fd0`. The floppy must be
    in the drive when you give the format command, and any data already on it will
    be.


    +   - To format a floppy disk in the removable floppy drive, type:


    ```

    $ mkefs /dev/fd0 RET

    ```


    # ## 24.3.2 Mounting a Floppy Disk


    To mount a floppy, use `mount` with the `/floppy` option.¹


    +   - To mount a floppy, type:


    ```

    $ mount /floppy RET

    ```


    To mount a floppy to a specific directory, use `mount` and give as arguments the
    device name of the floppy drive (usually `/dev/fd0` for one-floppy systems) and
    the name of the directory to mount.


    +   - To mount the floppy in the first floppy drive to `/tmp`, type:


    ```

    $ mount /dev/fd0 /tmp RET

    ```


    Once you have mounted a floppy, it appears in the directory you specify, and you
    can use any file command on them.


    +   - To list the contents of the base directory of the floppy mounted on `/floppy`,
    type:


    ```

    $ ls /floppy RET

    ```


    > ¹ This works if your administrator has set up the floppy drive filesystem for
    user access—see Recipe A.3.2 [Letting Users Access Hardware Peripherals], page
    363.'
