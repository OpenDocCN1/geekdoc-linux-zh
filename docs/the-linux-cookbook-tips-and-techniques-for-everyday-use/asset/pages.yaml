    # 3.4 Command History


    Your command history is the sequential list of commands you have typed, in the
    current or previous shell sessions. The commands in this history list are called
    events.


    By default


    Your command history is stored in a text file in your home directory called .bash_history;
    you can view this file or edit it like you would any other text file.


    Two very useful things that having a command history lets you do is to repeat
    the last command you typed, and (as explained earlier in this chapter) to do an
    incremental backwards search through your history.


    The following sections explain how to view your history and specify events from
    it on the command line. See Info file .bashref.info, node ''Bash History Facilities'',
    for more information on command history.


    # 3.4.1 Viewing Your Command History


    Use history to view your command history.


    +   - To view your command history, type:'
