    # 2.3.3 Keys for Console Manipulation


    Some keystrokes for manipulating the console display, including those for switching
    between virtual consoles, are described below. It''s a good idea to experiment
    with these commands until you are comfortable with them, because knowing how to
    use virtual consoles is basic to using Linux.


    | KEYSTROKE | DESCRIPTION |

    |---|---|

    | ALT-F | Switch to virtual console *n*. where *n* is a number from 1 to 7 (the
    default maximum). |

    | CTRL-ALT-F | When in X, switch to virtual console *n*. where *n* is a number
    from 1 to 6. |

    | ALT-← | Switch to the next-lowest virtual console. For example, typing this
    while in virtual console 4 switches to virtual console 3. Pressing this keystroke
    in the lowest console wraps around to the highest console. |

    | ALT-→ | Switch to the next-highest virtual console. For example, typing this
    while in virtual console 4 switches to virtual console 5. Pressing this keystroke
    in the highest console wraps around to the lowest console. |


    # 2.4 Running a Command


    A *tool* is a software program that performs a certain function — usually a specialized,
    simple task. For example, the `hostname` tool outputs the system''s hostname,
    and the `who` tool outputs a listing of the users who are currently logged in.
    An *application* is the name given to task, usually interactive, programs for
    completing broader kinds of tasks — such as programs for image editing or word
    processing.'
