  md: '# 7.3 Finding Files in Directory Listings


    The following recipes show how to find the largest and smallest files and directories
    in a given directory or by listing them by size. They also show how to find the
    number of files in a given directory.


    # 7.3.1 Finding the Largest Files in a Directory


    To find the largest files in a given directory, use `ls -S` option, which sorts
    files in descending order by their size (normally, `ls` outputs files sorted alphabetically).
    Include the `-l` option to output the size and other file attributes.


    +   To list the files in the current directory, with their attributes, sorted
    with the largest files first, type:


    ```

    $ ls -lS

    ```


    NOTE: Pipe the output to less to peruse it (see Recipe 9.1 [Perusing Text], page
    111).


    # 7.3.2 Finding the Smallest Files in a Directory


    To list the contents of a directory with the smallest files, use `ls` with both
    the `-S` and `-r` options, which *reverses* the sorting order of the listing.


    +   To list the files in the current directory and their attributes, sorted from
    smallest to largest, type:


    ```

    $ ls -l -Sr

    ```


    # 7.3.3 Finding the Smallest Directories


    To output a list of *directories* sorted by their size — the size of all the files
    they contain —use du and sort. The du tools output directories in ascending order
    with the smallest first; the `-S` option puts the size in kilobytes of each directory
    in the first column of output. Give the directory you want to output as an option,
    and pipe the output to `sort` with the `-n` option, which sorts its input numerically.


    +   To output a list of the subdirectories of the current directory tree, sorted
    in ascending order by size, type:


    ```

    $ du -S | sort -n

    ```


    # 7.3.4 Finding the Largest Directories


    Use the `-r` option with `sort` to *reverse* the listing and output the largest
    directories first.


    +   To output a list of the subdirectories in the current directory tree, sorted
    in descending order by size, type:


    ```

    $ du -S | sort -nr

    ```


    +   To output a list of the subdirectories in the `/usr/local/` directory tree,
    sorted in descending order by size, type:


    ```

    $ du -S /usr/local | sort -nr

    ```'
  merge: -1
