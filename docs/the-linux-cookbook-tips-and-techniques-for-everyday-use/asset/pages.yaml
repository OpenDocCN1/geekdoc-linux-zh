  md: '# 14.2.8 Finding Phrases Regardless of Spacing


    One way to search for a phrase that might occur with extra spaces between words,
    or across a line or page break, is to remove all linefeeds and extra spaces from
    the input, and then grep.


    To do this, pipe the input³ to `tr` with `\r\n\|\-''` as an argument to the `-d`
    option (removing all linebreaks from the input); pipe that to the `fmt` filter
    with the `-u` option (outputting the text with uniform spacing); and pipe that
    to `grep` with the pattern to search for.


    +   - To search across line breaks for the string ''at the same time as'' in the
    file ''notes'', type:


    ```

    $ cat notes | tr -d ''\r\n\|\-'' fmt -u | grep ''at the same time as''

    ```


    NOTE. The Emacs editor has its own special character for doing this—see Recipe
    14.6.2 [Searching for a Phrase in Emacs], page 174.


    # 14.2.9 Finding Patterns in Certain Contexts


    To search for a pattern that only occurs in a particular context, pipe the output
    to another `grep` for the context in which it should occur, search for the actual
    pattern.


    For example, this can be useful to search for a pattern only when it is quoted
    with an ''`'' character in an email message.


    +   - To list lines from the file ''email-archive'' that contain the word ''narrative''
    only when it is quoted:


    ```

    $ grep ''>'' email-archive | grep narrative RET

    ```


    You can also reverse the order and use the `-v` option to output all lines containing
    a given pattern that are not in a given context.


    +   - To list lines from the file ''email-archive'' that contain the word ''narrative'',
    but not when it is quoted:


    ```

    $ grep narrative email-archive | grep -v ''>'' RET

    ```


    # 14.2.10 Using a List of Regexps to Match From


    You can keep a list of regexps in a file, and use `grep` to search text for any
    of the patterns in the file. To do this, specify the name of the file containing
    the regexps to search for as an argument to the `-f` option.


    This can be useful, for example, if you need to search a given text for a number
    of words keep each word on its own line in the regexp file.


    +   - To output all lines in `/usr/dict/words` containing any of the words listed
    in the file ''forbidden-words'', type:


    ```

    $ grep -f forbidden-words /usr/dict/words RET

    ```


    +   - To output all lines in `/usr/dict/words` that do not contain any of the
    words listed in ''forbidden-words'', regardless of case, type:


    ```

    $ grep -v -i forbidden-words /usr/dict/words RET

    ```'
