  md: "# Chapter 20: PostScript\n\nUse an underscore ('_') alone to insert a blank\
    \ page, and use '-r' to output pages in\nreverse order.\n\n+   - To select the\
    \ last ten pages of file 'newsletter.ps', followed by a blank page, followed\n\
    by the first ten pages, and output them to a new file, 'selection.ps', type:\n\
    \  $ psselect -p 1-10..,1-10 newsletter.ps selection.ps RET\n- To select the pages\
    \ 59, 79, and 99 in the file 'newsletter.ps', and output them in\nreverse order\
    \ (with the 99th page) to a new file, 'selection.ps', type:\n  $ psselect -59,79,99\
    \ -r newsletter.ps selection.ps RET\n\nNOTE: The same result as the preceding\
    \ example could have been done by omitting\n'-r' option and just listing the pages\
    \ in the reverse order:\n  $ psselect -p99,79,59 newsletter.ps selection.ps RET\n\
    \n# 20.1.3 Combining PostScript Pages\n\nUse psup to print multiple PostScript\
    \ pages on a single sheet of paper; give as an option\nt number of pages to be\
    \ combined (or \"up\") on each sheet.\n\n+   - To make a new PostScript file,\
    \ 'double.ps', putting two pages from the file 'single.ps'\non each page, type:\n\
    \  $ psup -n2 double.ps RET\n\nTo specify the size, give the name of a standard\
    \ paper size as an argument to\n'-p' option: a3, a4, a5, b5, letter, tabloid,\
    \ executive, folio, quarto,\nor 10x14. You can also specify any height and width\
    \ with the '-h' and '-w' options; units\ncan be specified in centimeters (by 'cm')\
    \ or inches (followed by 'in'). If no size\nis specified, psup assumes a paper\
    \ size of a4.\n\nUse the '-l' option when pages are in landscape orientation (rotated\
    \ 90 degrees counter-\nclockwise from portrait orientation), and '-r' when pages\
    \ are in seascape orientation (rotated\n90 degrees clockwise from portrait orientation).\n\
    \nPages are placed in \"row-major\" in the layout file, where logical pages are\
    \ placed\nacross the rows of the page. Use the '-c' option to specify a \"column-major\"\
    \ layout, where\nlogical pages are placed in columns within the page. Scale the\
    \ size of the pages by giving a\npercentage to multiply the page size by an argument\
    \ to the '-s' option; for example, '-s\n5.' scales pages to 50 percent of their\
    \ original size.\n\nTo draw a border around each page, specify the border's width\
    \ in points as an argument\nto the '-d' option (if no width is specified, a default\
    \ of 1 is assumed).\n\n# 20.1.4 Arranging PostScript Pages in Signatures\n\nA\
    \ signature is a group of pages in a document corresponding to sheets of paper\
    \ folded and\nbound; these pages are normally not in sequential order in a document\
    \ (for example, in a\ndocument with eight-page signatures, page 8 and page 1 both\
    \ might be printed on the same\nsheet of paper).\n\nTo rearrange the pages of\
    \ a PostScript file use psbook. As arguments give the name of the PostScript file\
    \ to read\nfrom and the name to use for the output file; it reads the contents\
    \ of the first, rearranges\nthe pages, and then writes the PostScript output to\
    \ the second file."
