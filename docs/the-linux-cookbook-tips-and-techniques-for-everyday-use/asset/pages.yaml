    # 6.2 File Ownership


    Every file belongs to both user and a group—usually to the user who created it
    and to the group the user was working in at the time (which is almost always the
    user''s login group). File ownership determines the type of access users have
    to particular files (see Recipe 6.3 [Controlling Access to Files], page 85).


    # 6.2.1 Determining the Ownership of a File


    To find which group owns a particular file, use ls with the ''-1'' option to list
    the file''s attributes (see Recipe 5.3.1 [Listing File Attributes], page 71).
    The name of the user who owns the file appears in the third column of the output,
    and the name of the group that owns the file appears in the fourth column.


    For example, suppose the verbose listing for a file ''cruise'' looks like this:

    -rwxrxrxr--  1 captain crew  8,420 Jan 12 21:42 cruise


    The user who owns the file is captain, and the group that owns it is crew.


    NOTE: When you create a file, it normally belongs to you and to your login group,
    but you can change its ownership, as described in the next recipe. You normally
    own all of the files in your home directory.


    # 6.2.2 Changing the Ownership of a File


    You can''t give a file to another user, but other users can make copies of a file
    that belongs to you, provided they have read permission for that file (see Recipe
    6.3 [Controlling Access to Files], page 85). When you make a copy of another user''s
    file, you copy the copy.


    You can also change the group ownership of any file you own. To do this, use chgrp;
    it takes as arguments the name of the group to transfer ownership to and the names
    of the files to work on. You must be a member of the group you want to.


    +   - To change the group ownership of ''cruise'' to bridge, type:


    ```

    $ chgrp bridge cruise RET

    ```'
  merge: -1
