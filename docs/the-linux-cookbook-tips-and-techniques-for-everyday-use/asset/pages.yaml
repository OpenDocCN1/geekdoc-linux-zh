  md: "# 22 Audio Compact Discs\n\nAudio compact discs can be played on systems that\
    \ have a CD-ROM drive and sound card installed. You can control playback of an\
    \ audio CD in all the ways you can with a traditional CD player, except on a Linux\
    \ system you control playback with software tools on the command line. There are\
    \ tools for reading the audio data from a CD and writing it to a file (which you\
    \ can later write to a CD-R disc, or convert to MP3 format).\n\nTools and techniques\
    \ for manipulating CD-ROMs (data CDs) are in Recipe 24.4 [CD-ROMs], page 268.\n\
    \n# 22.1 Controlling CD CD Audio\n\nDebian: 'cdtool'\nWWW: ftp://jaka.cerl.uiuc.edu/pub/tinsel/\n\
    \nThese recipes describe various ways to play audio CDs using the command-line\
    \ tools found in 'CDTOOL' suite. Other CD audio tools, including X clients, are\
    \ listed in Recipe 22.4 [Other Audio CD Applications], page 254.\n\n# 22.1.1 Playing\
    \ an Audio CD\n\nUse cdplay to play an audio CD in the CD-ROM drive; the sound\
    \ is output through the speakers to the LINE OUT jack on your sound card. (You\
    \ may need to use the audio mixer to adjust the volume level and other settings;\
    \ see Recipe 21.2 [Adjusting the Audio Controls], page 244).\n\n+   - To play\
    \ an audio CD, type:\n  $ cdplay\n\nTo begin with a particular track, give the\
    \ number of the track as an argument.\n\n+   - To play an audio CD, beginning\
    \ with the third track:\n  $ cdplay 3\n\nTo end with a particular track, give\
    \ the number of the track as a second argument.\n\n+   - To play an audio CD,\
    \ beginning with the first track and ending with the fourth track, type:\n  $\
    \ cdplay 1 4\n\n+   - To play only the third track of an audio CD, type:\n  $\
    \ cdplay 3 3\n\n# 22.1.2 Pausing an Audio CD\n\nUse cdpause to pause audio CD\
    \ playback.\n\n+   - To pause the current CD playback, type:\n  $ cdpause\n\n\
    Use cdplay to start playback at the point where it was paused; to restart the\
    \ playback from the beginning, use cdplay with 'x' as an argument."
  merge: -1
