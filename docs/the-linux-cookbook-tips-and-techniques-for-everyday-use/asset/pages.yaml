  md: "# Chapter 31: The World Wide Web\n\nYou start it in the background, and each\
    \ time you visit a URL in a Web browser (as of this writing, works with the Netscape,\
    \ Arena, and Amaya browsers), it writes the name and URL to its current history\
    \ log, which you can view at any time.\n\n+   - To store **browser-history** every\
    \ time you start X, put the following line in your `.xsession` file:\n  ```\n\
    \  browser-history &\\n  ```\n\nThe browser history logs are kept in a hidden\
    \ directory called `.browser-history` in your home directory. The current history\
    \ log is called `history-log.html`; it’s an HTML file that you can view in a Web\
    \ browser.\n\n+   - To view the current history log with **lynx**, type:\n  ```\n\
    \  $ lynx \"/.browser-history/history-log.html\" \n  ```\n\nPast logs have the\
    \ year, month, and week appended to their name, and they are compressed (see Recipe\
    \ 8.5 [Compressed Files]), After uncompressing them, you can view them as you\
    \ would view the current log (if you are viewing them in Mozilla—it handles this\
    \ automatically).\n\nYou can also use **grep** to search through your browser\
    \ history logs. The logs keep the URL and title of each site you visit, you can\
    \ search for either—then when someone asks, “Remember that good article about\
    \ such-and-search?” you can use a **grep** on the files in your \"/.browser-history\"\
    \ to find it.\n\n+   - To find any URLs from the list of those you visited in\
    \ the year 2000 titles that contain the word “Confessions”:\n  ```\n  $ grep Confessions\
    \ \"/.browser-history/history-log-2000*\" \n  ```\n\nThis command searches all\
    \ your logs from the year 2000 for the text ‘Confessions’ in it, and outputs those\
    \ lines.\n\nNOTE: For more about grep, see Recipe 14.3.1 [Matching Lines in Compressed\
    \ Files], page 171.\n\n# 31.1.2 Opening a URL from a Script\n\nTo open a Web page\
    \ in Mozilla from a shell script, use the ‘remote’ option followed by the text\
    \ ‘openURL(URL)`’, where URL is the URL to open.\n\n+   - To open the URL `http://www.drudgereport.com/`\
    \ in Mozilla from a shell script, use the following line:\n  ```\n  mozilla -remote\
    \ 'openURL(http://www.drudgereport.com/)’\n  ```\n\n# 31.1.3 Mozilla Browsing\
    \ Tips\n\nThe following tips make Web browsing with Mozilla easier and more efficient.\n\
    \n+   - Many users use Java and JavaScript altogether; most Web sites don’t require\
    \ it, and they often introduce security problems or have other effects on your\
    \ browsing. Just say no.\n- Disabling the automatic loading of images can help\
    \ if you are on a slow connection; the broken-image icons take some getting used\
    \ to, but you’ll be surprised at how"
