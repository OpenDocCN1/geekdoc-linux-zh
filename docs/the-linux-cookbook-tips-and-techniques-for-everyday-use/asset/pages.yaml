  md: "# 10.2.4 Recording and Running Macros in Emacs\n\nA macro is like recording\
    \ of a sequence of keystrokes—when you run a macro, Emacs executes that key sequence\
    \ as if you had typed them.\n\nTo begin recording a macro, type C-x (. Then, everything\
    \ you type is recorded as the macro until you stop recording by typing C-x). After\
    \ you have recorded a macro, you can play it back at any time during the Emacs-session\
    \ by typing C-x e. You can precede it with the universal-argument command, C-u,\
    \ to specify a number of times to play it back.\n\n+   - To record a macro that\
    \ capitalizes the first word of the current line (M-c capitalizes the word to\
    \ the right of point) and then advances to the next line, type:\n  C-x ( C-a M-c\
    \ C-x )\n- To play the macro back 20 times, type:\n  C-u 20 C-x e\n\nMacros are\
    \ primary to how Emacs works—in fact, the name Emacs is derived from MACMacros,\
    \ because the first version of Emacs in 1976 was actually a collection of edited\
    \ macros written for another text editor.\n\n# 10.2.5 Inserting Special Characters\
    \ in Emacs\n\nThere are some characters that you cannot normally type into an\
    \ Emacs buffer. For example, in a text file, you can specify a page by inserting\
    \ the formfeed character, ASCII C-1 or octal code 014: when you print a file with\
    \ formfeeds, the current page is ejected at this character and printing is resumed\
    \ on a new page.\n\nHowever, C-1 has an Emacs command. To insert a character like\
    \ this, using the quoted-insert function, C-q. It takes either a literal keystroke\
    \ to insert, or the octal code of the character to insert. It inserts character\
    \ at point.\n\n+   - To insert a formfeed character at point by specifying its\
    \ actual keystroke (C-1), type:\n  C-q C-1\n- To insert a formfeed character at\
    \ point by specifying its octal character code, type:\n  C-q 014 (RET)\n\nThe\
    \ preceding examples do the same thing: they insert a formfeed character at point.\n\
    \nAn interesting use of C-q is to underline line. To do this, insert a literal\
    \ C-h ('^) followed by each character you want to underline.\n\n+   - To underline\
    \ the character before point, type:\n  C-q C-h _\n\nYou then use ul to output\
    \ the text to the screen (see Recipe 13.3 Underlining Text], page 160).\n\nAnother\
    \ kind of special character insert you might want to make is for accented characters\
    \ and other characters used in various languages.\n\nTo insert an accented character,\
    \ use ISO Accents mode. When this mode is active, you can type a special accent\
    \ character followed by the character to be accented, and the proper accented\
    \ character will be inserted at point."
