  md: "# 11.2.4 Listing the Antonyms of a Word\n\nAn *antonym* of a word is a different\
    \ word that has the opposite meaning of the first in some context. To output antonyms\
    \ for a word with wn, give the word as an argument, by one of the following options:\
    \ '-ants' for verbs, '-antsa' for adjectives, and '-ants' for adverbs.\n\n+  \
    \ * To output all of the antonyms for the adjective 'sad', type:\n  $ wn sad -antsa\
    \ RET\n\n# 11.2.5 Listing the Hypernyms of a Word\n\nA *hypernym* of a word is\
    \ a related term whose meaning is more general than the given word. (For example,\
    \ the words *mammal* and *animal* are hypernyms of the word 'cat').\n\nTo output\
    \ hypernyms for a word with wn, use one of the following options: '-hyphen' for\
    \ nouns and '-hype' for verbs.\n\n+   * To output all of the hypernyms for the\
    \ noun 'cat', type:\n  $ wn cat -hyphen RET\n\n# 11.2.6 Online Dictionaries\n\n\
    Debian 'dict'\nWWW: http://www.dict.org/\n\nThe DICT Development Group has a number\
    \ of free dictionaries on their Web site at http://www.dict.org/. On that page,\
    \ you can look up the definitions of words (including thesaurus and other searches)\
    \ from a dictionary that contains over 300,000 headwords, or make a copy of their\
    \ dictionary for use on your own system. A dict client exists for accessing DICT\
    \ servers and outputting definitions locally; this tool is available in the 'dict'\
    \ package.\n\nDICT also has a number of specialized dictionaries that are plain\
    \ text files (including the author's *Free Journalism Dictionary*, containing\
    \ jargon and terms used in the journalism and publishing professions). Their *FILE\
    \ project*, *The Free Internet Lexicon* and *Encyclopedia*, is an effort to build\
    \ a free, open source collection of modern-word, idiom, and jargon dictionaries.\
    \ FILE is a volunteer effort and depends on the support of scholars and lexicographers;\
    \ the DICT pages contain information on how to help contribute to this worthy\
    \ project.\n\n# 11.3 Checking Grammar\n\nWWW: http://www.gnu.org/software/diction/diction.html\n\
    \nTwo venerable Unix tools for checking writing have recently been made available\
    \ for Linuxbased systems: *style* and *diction*."
