    \ | tail -1 | head -c RET\n\nIn the preceding example, three commands were used:\
    \ the first five lines of the file\n'placement-list' are passed to tail, which\
    \ outputs the last line in the output (the fifth\nline in the file); then, the\
    \ head command outputs the first character in that last line,\nwhich achieves\
    \ the desired result.\n\n# 9.2.5 Outputting the text between Strings\n\nUse sed\
    \ to select lines of text between strings and output only that section of text,\n\
    or all of the lines of text except that section. The strings can be words or even\
    \ regular\nexpressions (see Recipe 14.2 [Regular Expressions Matching Text Patterns],\
    \ page 166).\n\nUse the '-n' option followed by '/first/.../last/p' to output\
    \ the text between the\nstrings and first and last, inclusive. This is useful\
    \ for outputting, say, one chapter or section\nof text file when you use the text\
    \ you know to define the sections with.\n\n+   To output all the text from file\
    \ 'book-draft' between 'Chapter 3' and 'Chapter 4',\ntype:\n  $ sed -n '/Chapter\
    \ 3/,/Chapter 4/p' book-draft RET\n\nTo output all the lines of text except between\
    \ two patterns, except the '-n' option.\n\n+   To output all the text from file\
    \ 'book-draft', except that which lies between the text\n'Chapter 3' and 'Chapter\
    \ 4', type:\n  $ sed '/Chapter 3/,/Chapter 4/p' book-draft RET\n\nNOTE: For a\
    \ more thorough introduction to sed, see Recipe 10.5 [Editing Streams of Text],\n\
    page 129."
