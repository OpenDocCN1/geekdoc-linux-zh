  md: '# Chapter 4: The X Window System


    your session a standardized "look and feel"; these suites normally come with a
    few tools such as clocks and file managers. The two popular ones are GNOME and
    KDE, while they generate a lot of press these days because of their graphical
    nature, both are changing very quickly and at the time of this writing are not
    ready for widespread, general use (and they can cause your system to crash).


    If you have a Linux distribution and choose the default install, chances are good
    that you have either GNOME or KDE installed, with either the fwm2 or wmaker window
    manager assigned as the default. (While you may have more than one window manager
    installed on your system, you can only run one at a time.)


    # 4.1.1 Starting X


    There are two ways to start X X Display Manager, xdm, when the system boots, at
    which point a graphical x login screen appears; you can use this to log in directly
    to an X session. The virtual console reserved for X will be blank until you start
    X by running the start command.


    +   - To start X from a virtual console, type:

    - To run start and redirect its output to a log file, type:


    ```

    $ startx

    ```


    ```

    $ $HOME/startx.log &1

    ```


    Both of these examples start X on the seventh virtual console, regardless of which
    console you are at when you run the command:your console switches to X automatically.
    You can always switch to another console during your X session (see Recipe 2.3
    [Console Bases], page 20). The second example writes any error messages or output
    of startx to a file called ''startx.log'' in your home directory.


    On some systems, X starts with 8-bit color depth by default. Use start with the
    special ''-b'' option to specify the color depth. Follow the option with a number
    indicating the color depth to use, and precede it with hyphens (''--''), which
    tells startx to pass the options which follow it to the X server itself.


    +   - To start X from a virtual console, and 16-bit color depth, type:


    ```

    $ startx --bpp 16

    ```


    NOTE: If your system runs xdm, you can always switch to the seventh virtual console
    (or whichever console xdm is running on), and then log in the xdm login screen.


    # 4.1.2 Stopping X


    To end an X session, you normally choose an exit X option from a menu in your
    window manager.


    +   - To end your session if you are running the fwm2 window manager, click the
    left mouse button in the root window to pull up the start menu, and then choose
    Really quit? from the Exit Fwm submenu.

    - To end your session if you are running the afterstep window manager, click the
    left mouse button in the root window to pull up the start menu, and then choose
    Really quit? from the Exit Fwm submenu.'
