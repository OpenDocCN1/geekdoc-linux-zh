  md: '# Chapter 7: Finding Files


    # 7.2.5 Running Commands on the Files You Find


    You can also use find to execute a command you specify on each found file, by
    giving the command as an argument to the ''-exec'' option. If you use the string
    ''{}'' in the command, this string is replaced with the name of the current found
    file when the command executes. Mark the end of the command with the string ''{}'';''.


    +   - To find all files in the "/html/ directory tree with an .html extension,
    and output lines from those files that contain the string ''organic'', type:


    ```

    $ find /html/ -name *.html -exec grep organic ''{}'' ;'' RET

    ```


    In this example, the command grep organic is executed for each file that finds,
    with file the name of each file in turn.


    To have find and pause execution for each file it finds, use -ok instead of ''-exec''.


    +   - To remove files from your home directory tree that were accessed more than
    one year after they were last modified, pausing before each removal, type:


    ```

    $ find -used +365 -ok rm ''{}'' ; RET

    ```


    # 7.2.6 Finding Files by Multiple


    You can combine many of find''s options to find files that match criteria.


    +   - To list files in your home directory tree whose names begin with the string
    ''top'', and are newer than the file /etc/motd, type:


    ```

    $ find -name *top* -newer /etc/motd RET

    ```


    +   - To compress all files in your home directory tree that are two megabytes
    or larger, and are not already compressed with gzip having a .gz file name extension),
    type:


    ```

    $ find -size +2000000c -regex ''.*gz'' -exec gzip ''{}'' ; RET

    ```


    The following tables describe many other options you can use with find. The first
    table lists describes find''s general options for specifying its behavior. As
    you will see, find can take many different options; see its man page or its info
    documentation for all them.


    | | DESCRIPTION |

    | -daystart | Use the beginning of today rather than 24 hours previous for time
    criteria. |

    | -depth | Search the subdirectories before each directory. |

    | -help | Output a help message and exit. |

    | -maxdepth levels | Specify the maximum number of directory levels to descend
    in the specified directory tree. |

    | -mount -xdev | Do not descend directories that have another disk mounted on
    them. |

    | -version | Output the version number and exit. |


    The following table lists describes find''s options for specifying which files
    to find.'
