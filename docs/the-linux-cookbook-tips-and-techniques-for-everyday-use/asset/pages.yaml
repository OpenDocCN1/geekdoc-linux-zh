  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    The root window is the background behind all of the other windows. It is usually
    set to a color, but you can change it (see Recipe 4.6.3 [Changing the Window Parameters],
    page 60). Each program or application in X runs in its own window. Each window
    has a decorative border on all four sides, called the window border; L-shaped
    frames; a top window bar, called the title bar, which displays the name of the
    window; and several title bar buttons on the left and right sides of the title
    bar (described in Recipe 4.3 [Manipulating X Client Wipows], page 57).


    The entire visible work area, including the root window and any other windows,
    is called the desktop. The box in the lower right-hand corner, called the pager,
    allows you to move about a large desktop (see Recipe 4.4 [Moving around the Desktop],
    page 58).


    A window manager controls the ways windows look and are displayed, as it were
    and can provide additional menu or program management capabilities. There are
    many different window managers to choose from, with a variety of features and
    capabilities (see Recipe 4.6.4 [Choosing a Window Manager], page 61, for help
    in choosing a window manager that''s right for you).


    Window managers typically allow you to customize the colors and borders that are
    used to display a window, as well as the type and location of buttons that appear
    on the window (see Recipe 4.2 [Running a Program in X], page 54). For example,
    in the image above, the clock image itself is the clock program; the blue outline
    around it is the window border, drawn by the fwm2 window manager. With the afterstep
    window manager, the window border would look quite different:


    ![](img/3658df520e459cc83b744521428473cf_75_0.png)


    There are many window managers you can choose from, all different; instead of
    describing only one, or describing all of them only superbly, this chapter shows
    the basics of X, which are common to all window managers. I try to make no assumptions
    as to which window manager you are using; while the fwm family of window managers
    has long been a popular choice on most Linux-based systems, today other window
    managers including WindowManager (the binary itself is called wmager), Enlightenment,
    AfterStep, and others have all gained in popularity.


    And recently desktop environments have become popular. These are a collection
    of applications that run on top of the window manager (and X), with the purpose
    of giving'
