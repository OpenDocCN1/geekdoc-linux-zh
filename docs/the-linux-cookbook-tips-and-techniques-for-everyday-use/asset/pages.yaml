  md: "# 12 Analyzing Text\n\nThere are many ways to use command-line tools to analyze\
    \ text in various ways, such as counting the number of words in a text, creating\
    \ a concordance, and comparing texts to see if (and where) they differ. There\
    \ are also other tricks you can do with text that count as analysis, such as finding\
    \ anagrams and palindromes, or cutting up text to generate unexpected combinations\
    \ of words. This chapter covers all these topics.\n\n# 12.1 Counting Text\n\n\
    Use the \"word count\" tool, wc, to count characters, words, and lines in text.\
    \ Give the name of a file as an argument; if none is given, wc works on standard\
    \ input. By default, wc outputs three columns for counts for words, and characters\
    \ in the text.\n\n+   * To output the number of lines, words, and characters in\
    \ file 'outline', type:\n  $ wc outline RET\n\nThe following subsections describe\
    \ how to specify just one kind of count with wc, and how to count text in Emacs.\n\
    \n> NOTE: You can get a count of how many different words are in a text,—see Recipe\
    \ 12.2 [Making a Concordance of Text], page 150. To count the average length of\
    \ words, sentences, and paragraphs, use style (see Recipe 11.3.3 [Checking Text\
    \ for Readability], page 144).\n\n# 12.1.1 Counting the Characters in the Text\n\
    \nUse wc with the '-c' option to specify that the number of characters be counted\
    \ and output.\n\n+   * To output the number of characters in file 'classified.ad',\
    \ type:\n  $ wc -c classified.ad RET\n\n# 12.1.2 Counting the Words in the Text\n\
    \nUse wc with the '-w' option to specify that the number of words be counted and\
    \ output.\n\n+   * To output the number of words in the file 'story', type:\n\
    \  $ wc -w story RET\n* To output counts for several files, first concatenate\
    \ the files with cat, and then pipe the output to wc.\n* To output the combined\
    \ number of words for all the files with a '.txt' file name extension in the current\
    \ directory, type:\n  $ cat *.txt | wc -w RET\n\n> NOTE: To read more about concatenation\
    \ with cat, see Recipe 10.6 [Concatenating Text], page 130."
  merge: -1
  pgno: 172
- img_proc: true
  md: '# 12.1.3 Counting the Lines in a Text


    Use `wc` with the `-l` option to specify that just the number of lines are counted
    and output.


    +   - To output the number of lines in the file `outline`, type:


    ```

    $ wc -l outline RET

    ```


    # 12.1.4 Counting the Occurrences of Something


    To find the number of occurrences of some text string or pattern in a file or
    files, use `grep` to search the file(s) for the text string, and pipe the output
    to `wc` with the `-l` option.


    +   - To find the number of lines in the file `outline` that contain the string
    `chapter`, type:


    ```

    $ grep chapter outline | wc -l RET

    ```


    NOTE: For more recipes for searching text, and more about `grep`, see Chapter
    14 [Searching Text], page 165.


    # 12.1.5 Counting Lines per Page in Emacs


    The `count-lines-page` function in Emacs outputs the number of lines in the minbuffer
    on the current page (as delimited by page characters, if any—Recipe 13.2 [Paginating
    Text], page 158), followed by the number of lines in the buffer before the line
    that point is, and on the number of lines in the buffer after point.


    +   - To count the number of lines per page in the current buffer in Emacs, type:


    ```

    C-x l RET

    ```


    Emacs outputs the number of lines per page of the current buffer in the echo buffer.
    For example, if the output is


    Page has 351 lines (69 + 282)


    this means the page contains 351 lines, and point is on line number 70—there are
    69 lines before this line, and 283 lines after this line.


    # 12.2 Making a Concordance of a Text


    A *concordance* is an index of all the words in a text, along with their contexts.
    A alphabetical listing of all words in a text and their frequency—can be made
    easily with some bash tools: `tr`, `sort`, and `uniq`.


    +   - To output a word-frequency list of the file `naked_lunch`, type:


    ```

    $ tr '' '' < naked_lunch | sort | uniq -c RET

    ```


    > commands `translate` all space characters to newline characters, outputting
    the text with each word on its own line; this is then sorted alphabetically, and
    output to `uniq`, which outputs only the *unique* words—that is, non-duplicate
    lines—while the `-c` option precedes each line with its *count* (the number of
    times it occurs in the text).


    To get a word frequency count—that is, the total number of *different* words in
    a text just pipe the output of the frequency list to `wc` with the `-l` option.
    This counts all the lines of its input, in this case will be the list of unique
    words, one per line.'
  merge: -1
