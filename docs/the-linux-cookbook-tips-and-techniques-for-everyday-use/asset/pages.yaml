  md: '# Chapter 4: The X Window System


    In the preceding illustration, the current desktop is the second one in the top
    row. The first desktop contains two X client windows—a small one and a large one
    but there are no windows in any other desktop (including the current one).


    To switch to another desktop, click the left button on its corresponding view
    in the pager or use a keyboard shortcut. In fvm2, the default keys for switching
    desktops are ALT in conjunction with the arrow keys; in afterstep, use the CTRL
    key in place of ALT.


    # 4.5 Running a Shell in X


    Use xterm to run a shell in a window. You can run commands in an xterm window
    just as you would in a virtual console; a shell in an xterm acts the same as in
    a virtual console (see Chapter 3 [The Shell], page 35).


    Unlike a console, you can copy and paste text from an xterm to another X client
    (see Recipe 10.4 [Selecting Text], page 128).


    To scroll text that has passed the top of the screen, use Shift-PgUp. The number
    of lines you scroll back depends on the value of the scrollback buffer, specified
    with the -s1 option; its default value is 64.


    There are many options for controlling xterm''s emulation characteristics; consult
    the xterm man page for a complete list (see Recipe 2.8.4 [Reading a Page from
    the System Manual], page 30).


    NOTE: xterm is probably the most popular terminal emulator client, it is not the
    only one; others to choose from include xterm and rxvt, all with their own special
    features—try to find all one you like.


    # 4.6 Configuring X


    There are some aspects of X that people usually want to configure right away.
    This section discusses some of the most popular, including changing the video
    mode, automatically running clients at startup, and choosing a window manager.
    You''ll find more information on this subject in both The X User HOWTO and The
    Configuration HOWTO (for how to read them, see 2.8.6 [Reading System Documentation
    and Help Files], page 32).


    # 4.6.1 Switching between Video Modes


    A video mode is a display resolution, in pixels, such as 640x480. An X server
    can switch between the video modes allowed by your hardware and set up by the
    administrator; it is not uncommon a machine running to offer several video modes,
    so that 640x600, and 1024x768 resolutions are possible.'
