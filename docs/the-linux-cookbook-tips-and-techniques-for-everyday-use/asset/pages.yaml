    \ outputs a random number from 0 to the number you give, minus one.\n\n+   - To\
    \ output a random number from 0 to 9, type:\n  - random 10 RET\n\n# 28.3 Listing\
    \ a Sequence of Numbers\n\nUse seq to print a sequence of numbers. This is very\
    \ useful for getting a listing of numbers to use as arguments, or otherwise passing\
    \ sequences of numbers to other commands.\n\nTo output the sequence from one to\
    \ a number, give that number as an argument."
