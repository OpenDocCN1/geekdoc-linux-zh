    # 14.2.4 Matching Lines That Contain Any Of Regexes


    To match lines that contain any number of regexes, specify each of the regexps
    to search for between alternation operators (`|`) as the regex to search for.
    Lines containing any of the given regexps will be output.


    +   - To output all lines in ''playlist'' that contain the patterns ''the sea''
    or ''cake'',

    type:


    ```

    $ grep ''the sea|cake'' playlist

    ```


    This command outputs any lines in ''playlist'' that match the patterns ''the sea''
    or

    ''cake'', including lines matching both patterns.


    # 14.2.5 Matching Lines That Contain All Of Regex


    To output lines that match *all* of a number of regexes, use `grep` to output
    lines containing

    tfirst regex you want to match, and pipe the output to a `grep` with the second
    regex

    as an argument. Continue adding pipes to `grep` searches for all the regexps you
    want to\search for.


    +   - To output all lines in ''playlist'' that contain both patterns ''the sea''
    and ''cake'',

    regardless of case; type:


    ```

    $ grep -i ''the sea'' playlist | grep -i cake

    ```


    NOTE: To match lines containing some regex in a particular order, see Recipe 14.2.11

    [Regexps for Common Situations], page 171.


    # 14.2.6 Matching Lines That Do Not Contain a Regex


    To output all lines in a text that *don''t* contain a given pattern, use `grep`
    with the `-v`

    option—this reverses the selection of matching, selecting all non-matching lines.


    +   - To output all lines in `/usr/dict/words` that are not three characters wide,

    type:


    ```

    $ grep -v ''...''

    ```


    +   - To output all lines in ''access.log'' that do not contain the string ''http'',

    type:


    ```

    $ grep -v http access_log

    ```


    # 14.2.7 Matching Lines That Only Contain Certain Characters


    To match lines that contain certain characters, use the regex `^[characters]*$`,
    where

    characters are the ones to match.


    +   - To output all lines in `/usr/dict/words` that only contain vowels, type:


    ```

    $ grep -i ''^[aeiou]*$'' /usr/dict/words

    ```


    The ''-i'' option matches characters regardless of case; so, in this example,
    all vowel

    characters are matched regardless of case.'
