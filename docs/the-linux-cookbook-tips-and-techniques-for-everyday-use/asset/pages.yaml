  md: "# 17 Viewing Images\n\nAs with text, there are tools for both viewing and editing\
    \ images. This chapter describes the various methods for viewing images; the editing\
    \ of images is discussed in the next chapter). While you can view an image with\
    \ an image editor, it is safer (faster!) to view with viewer when you do not intend\
    \ to edit it.\n\n# 17.1 Previewing Print Files\n\nThe DVI (\"Device Independent\"\
    ), PostScript, and PDF (\"Portable Document Format\") file formats can be generated\
    \ by a number of applications. They are graphical formats commonly used for printing;\
    \ methods for previewing these files on the display screen are discussed in the\
    \ following sections.\n\n# 17.1.1 Previewing a DVI File\n\nUse the xdv tool to\
    \ preview a DVI file in X. Give the name of the file to preview as an argument.\
    \ xdv will show how the document will look when printed, and let you view it at\
    \ different magnifications.\n\n+   - To preview the file 'gentle.dvi', type:\n\
    \  $ xdv gentle.dvi RET\n- To magnify the document, left-click any of the buttons\
    \ labelled with a percentage, such as 17%; they magnify the view by that percentage.\n\
    - To magnify the view by 33%, left-click the button marked 33%.\n\n| COMMAND |\
    \ DESCRIPTION |\n| --- | --- |\n| Q | Exit xdv and stop previewing the file. |\n\
    | N | Advance to the next page. |\n| P | Move to previous page. |\n| C-c | Same\
    \ as Q. |\n| C-d | Same as Q. |\n| SFC | Same as N. |\n| C-1 |ing the current\
    \ page. | |\n| R | Re-read the DVI file. |\n\n# 17.1.2 Previewing a PostScript\
    \ File\n\nDebian: 'ghostview'\nDebian: 'gv'\nWWW [http://wwwthep.physik.uni-mainz.de/~plass/gv/](http://wwwthep.physik.uni-mainz.de/~plass/gv/)\n\
    \nTo preview a PostScript or EPS image file in X, use ghostview. It takes a file\
    \ name as an argument, and it previews the contents of the file in a window, starting\
    \ with its first page."
  merge: -1
  pgno: 230
- img_proc: true
  md: "208                               The Linux Cookbook: Tips and Techniques for\
    \ Everyday Use\n\n+   - To preview the file `/usr/doc/gs/examples/tiger.ps`, type:\n\
    \  $ ghostview /usr/doc/gs/examples/tiger.ps RET\n\nPress Q to exit and press\
    \ SPC to advance to the next page, if there is one.\n\nNOTE: Some people prefer\
    \ the g tool as an alternative to ghostview; gv is used in much the same way,\
    \ though it has a different interface.\n\n# 17.1.3 Previewing a PDF File\n\nDebian:\
    \ 'xpdf'\nWWW: http://www.foolabs.com/xpdf/\nDebian: 'gv'\nWWW: http://www.wthep.physik.uni-main.de/~pass/gv/\n\
    \nUse xpdf to preview a PDF file. Give the name of the PDF file to preview as\
    \ an argument.\n\n+   - To preview the PDF file 'flyer.pdf', type:\n  $ xpdf flyer.pdf\
    \ RET\nQ to exit xpdf; use the two magnifying-glass buttons to zoom the view closer\
    \ in (+) or further out (-), and use the left and right arrow buttons to move\
    \ to the previous and next pages, if any.\n\nNOTE: You can also use gv to preview\
    \ PDF files.\n\n# 17.2 Viewing an Image in X\n\nDebian: 'imagemagick'\nWWW: http://ftp.wizards.dupont.com/pub/ImageMagick/\n\
    \nTo view an image in X, use display, part of the ImageMagick suite of tools.\
    \ It can recognize many image formats, including FlashPix, GIF/GIF87, Group 3\
    \ faxes, JPEG, PBM/PNM/PPM, PhotoCD, TGA, TIFF, TransFig, and XBM.\ndisplay takes\
    \ as argument the name of the image to be viewed, and it displays the image in\
    \ a new window.\n\n+   - To view the file `sailboat.jpeg`, type:\n  $ display\
    \ sailboat.jpeg RET\n\nThis command displays the image file in a new window.\n\
    \n![](img/3658df520e459cc83b744521428473cf_231_0.png)"
  merge: -1
