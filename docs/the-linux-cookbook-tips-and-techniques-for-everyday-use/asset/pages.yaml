    This command expands the file `war-and-peace.gz` and puts it in a new file called
    `war-and-peace`; gunzip then deletes the compressed file, `war-and-peace.gz`.


    NOTE: You can view a compressed text file without uncompressing it using zless.
    This is useful when you want to view a compressed file but do not want to write
    changes to it. (For more information about zless, see Recipe 9.1 [Perusing Text],
    page 111).


    # 8.6 File Archives


    An archive is a file that contains a collection of other files, and often directories.
    Archives are usually used to transfer or make a backup copy of a collection of
    files and directories—this way, you can work with only one file instead of many.
    This single file can be easily compressed as explained in the previous section,
    and the files in the archive retain the structure and permissions of the original
    files.


    Use the `tar` tool to create, list, and extract files from archives. Archives
    made with tar are sometimes called “tar files,” “tar archives,” or—because all
    the archived files are rolled into one—“tarballs”.


    The following recipes show how to use `tar` to create an archive, list the contents
    of an archive, and extract files from an archive. Two common options used with
    all three of operations are `-f` and `-v`: to specify the name of the archive
    file, use `-f` followed by the file name; use `-v` (“verbose”) option to have
    `tar` output the names of files as they are processed. While the `-v` option is
    not necessary, it lets you observe the progress of your `tar` operation.


    NOTE: The name of this tools comes from “tape archive,” because it was originally
    made to write the archives directly to a magnetic tape device. It is still used
    for this purpose, but today, archives are always saved to a file on disk.


    See info `tar.info`, node ‘Top’, for more information about managing archives
    with tar.


    # 8.6.1 Creating a File Archive


    To create an archive with `tar`, use the `-c` (“create”) option, and specify the
    name of the archive file to create with the `-f` option. It’s common practice
    to use a name with a `.tar` extension, such as `my-backup.tar`.


    Give as arguments the names of the files to be archived; to create an archive
    of a directory and all of the files and subdirectories it contains, give the directory’s
    name as an argument.


    +   To create an archive called `project.tar` from the contents of the ‘project’
    directory, type:


    ```

    $ tar -cvf project.tar project RET

    ```


    Use the `-z` option to compress the archive as it is being written. This yields
    the same output as creating an uncompressed archive and then using `gzip` to compress
    it, but it eliminates the extra step.'
