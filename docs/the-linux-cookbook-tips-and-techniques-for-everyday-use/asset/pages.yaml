  md: '# 6.3.1 Listing the Permissions of a File


    To list a file''s access permissions, use `ls` with the `-1` option (see Recipe
    5.3.1 [Listing File Attributes], page 71). File access permissions appear in the
    first column of the output, the character for file type.


    For example, consider the verbose listing of the file `cruise'':


    ```

    -rwx-rw--  1 captain crew  8,420 Jan 12 21:42 cruise

    ```


    The first character (`-`) is the file type; the next three characters (`rwx`)
    specify permissions for the user who owns the file; and the next three (`rw-`)
    specify permissions for all members of the group that owns the file *except* for
    the user who owns it. The last three characters in the column (`--`) specify permissions
    for all other users on the system.


    In this example, the listing indicates that the user who owns the file, `captain`,
    has read, write, and execute permission, and the group that owns the file, `crew`,
    has read and write permission. All other users on the system have only read permission.


    # 6.3.2 Changing the Permissions of a File


    To change the access mode of any file you use, use the `chmod` (“change mode”)
    tool. It takes two arguments: an *operation*, which specifies the permissions
    to grant or revoke for certain users, and the names of the files to work on.


    To build an operation, first specify the category or categories of users as a
    combination of the following characters:


    | CHARACTER | CATEGORY |

    | --- | --- |

    | u | The user who owns the file. |

    | g | All other members of the file''s group. |

    | o | All other users on the system. |

    | a | All users on the system; this is the same as `ugo`. |


    Follow this with the operator denoting the action to take:


    | OPERATOR | ACTION |

    | --- | --- |

    | + | Add permissions to the user''s existing permissions. |

    | - | Remove permissions from the user''s existing permissions. |

    | = | Make these *only* permissions the user has for this file. |


    Finally, specify the permissions themselves:


    | CHARACTER | PERMISSION |

    | --- | --- |

    | r | Set read permission. |

    | w | Set write permission. |

    | x | Set execute permission. |'
  merge: -1
