    # 32.4.4 Finding the IP Address of a Host Name


    When you know the name of a particular host, and you want to find the IP address
    that corresponds to it, ping the host in question; this will output the IP address
    of the host in parenthesis (see Recipe: 32.4.1 [Checking Whether a System is Online],
    page 350).


    You can also use dig, the "domain information groper" tool. Get a hostname as
    an argument to output information about that host, including its IP address in
    a section labelled ''ANSWER SECTION''.


    +   To find the IP address of host linart.net, type:


    ```

    $ dig linart.net RET

    ...output messages...

    ;; ANSWER SECTION:

    linart.net.

    1D IN A 64.240.156.195

    ...output messages...

    $

    ```


    In this example, dig out the IP address of 64.240.156.195 as the IP address for
    the host linart.net.'
