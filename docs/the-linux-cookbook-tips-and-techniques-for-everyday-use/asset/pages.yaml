  md: '# Chapter 15: Typesetting and Word Processing


    # 15.2 Converting Plain Text for Output


    Debian: ''encscript''

    WWW: http://www.iki.fi/~mtr/genscript/


    The simplest way to typeset plain text is to convert it to PostScript. This is
    often done to prepare text for printing; the original source file remains as unformatted
    text, but the text of the printed output is formatted in basic ways, such as being
    in a font.


    The main tool for converting text to PostScript is called encscript; it converts
    the text file that is specified as an argument in PostScript, making any number
    of formatting changes in between. It''s great for quickly making nice output from
    a plain text file you can use to do things such as output text in a format of
    your choosing, or paginate text with graphical headers at the top of each page.


    By default, encscript paginates your system, outputs in a 10-point Courier font,
    and puts a simple header at the top of each page containing the file name, date
    and time, and page number in bold. Use the ''B'' option to omit this header.


    If you have a PostScript printer connected to your system, encscript can be set
    up to spool output to the printer. You can verify if this is set up by looking
    at the encscript configuration file, ''/etc/encscript.cfg''. The line


    DefaultOutput: printer

    sifies that output is spooled directly to the printer; changing it to ''stdout''
    instead of ''printer'' sends the output to the standard output.


    Even if your default printer does not necessarily understand PostScript, it may
    be able to take encscript output, anyway. Most Linux installations these days
    have print filters set up so that PostScript spooled for printing is automatically
    converted to a format the printer understands (if your system does not have this
    setup for some reason, convert the PostScript to a format recognized by your printer
    with the gs tool, and then print that — see Recipe 20.3 (Converting PostScript,
    page 239).


    +   - To convert the file ''saved-mail'' to PostScript, with default formatting,
    and spool the output to the printer, type:


    ```

    $ encscript saved-mail RET

    ```


    To write the output to a file instead of spooling it, give the name of the file
    you want to output as an argument to the ''-p'' option. This is useful when you
    have a PostScript printer and need to convert the output, or when you just want
    to make a PostScript image file from some text, or for previewing the output before
    you print it. In the latter case, you can view it on the display screen with a
    PostScript viewer application as ghostview (see Recipe 17.1.2 [Preview a PostScript],
    page 207).


    +   - To write the file ''saved-mail'' to a PostScript file, ''saved-mail.ps'',
    and then preview it in X, type:


    ```

    $ encscript -p report.ps saved-mail RET

    $ ghostview saved-mail.ps RET

    ```


    The following recipes show how to use encscript to output text with different
    effects and properties.'
  merge: -1
