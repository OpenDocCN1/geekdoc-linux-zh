  md: 'Use the arrow keys to move through each "page" of information, called an Info
    node. Nodes are the base unit of information in Info, and are arranged hierarchically—a
    manual''s Top node will contain an Info menu containing links to its various chapters,
    and a chapter node will contain a menu with links for its sections, and so on.
    Links also appear as cross references in the text.


    Links look the same in both menu items and cross references: an asterisk (''*''),
    or one or two colon characters ('':''). To follow a node it points to, move the
    cursor over any part of the node in the link and press RET.


    To run a tutorial describes how to use info, press the ii key. Press Q at any
    time stopping your documentation and exit info.


    To read Info documentation for a tool or application, give its name as an argument
    to info; if no info manuals exists for that, info displays the man page for that
    tool instead.


