    # 5.5.1 Changing File Names to Lowercase


    WWW: http://eternity.2y.net/chase


    To change the uppercase letters in a file name to lowercase (or vice versa), use
    chase. It takes as arguments the files whose names should change.


    +   To change the file names of all the files in the current directory to lowercase
    letters, type:


    ```

    $ chase *

    ```


    Use the ''-u'' option to change file names of all the files with a ''.dos'' extension
    in the ''/tmp'' directory to all lowercase letters, type:


    ```

    $ chase -u /tmp/*.dos

    ```


    By default, chase does not rename directories; use the ''-r'' option to rename
    directories as well as other files. The ''-r'' option recursively descends into
    any subdirectories and renames files, too.


    +   To change all of the files and subdirectory names in the current directory
    to all lowercase letters, type:


    ```

    $ chase -d *

    ```


    +   To change all of the files and subdirectory names in the current directory
    to all uppercase letters, and descend recursively into all subdirectories, type:


    ```

    $ chase -d -r *

    ```


    +   To change all of the files in the current directory to all lowercase letters,
    and descend recursively into all subdirectories (but not change any directory
    names), type:


    ```

    $ chase -r *

    ```


    # 5.5.2 Renaming Multiple Files with the Same Extension


    WWW: http://eternity.2y.net/chase


    To give a different file name extension to a group of files that share the same
    name extension, use chase with the ''-x'' option for specifying a Perl expression;
    give the patterns to match the source and target files as a quoted argument.


    For example, you can rename all files ending in ''.htm'' to end in ''.html'' by
    giving ''s/htm/html/'' as the expression to use.


    +   To rename all of the files in the current directory with a ''.htm'' extension
