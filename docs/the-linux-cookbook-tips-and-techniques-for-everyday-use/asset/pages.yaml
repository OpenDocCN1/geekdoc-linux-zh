    in other ways, such as through a network or via another terminal connected to
    a serial line; see Chapter 29 [Communications], page 307).


    Linux systems feature virtual consoles, which act as separate console displays
    that can run separate sessions, all accessed from the same physical console terminal.
    Linux systems are configured to have seven virtual consoles by default. When you
