  md: "# 29 Communications\n\nYou will almost certainly want to go \"online,\" or\
    \ otherwise communicate with other systems. Most systems today are are sold with\
    \ the necessary hardware that you need in order to be able to connect to other\
    \ systems, such as a modem or a network card. You connect this hardware to the\
    \ outside world via a telephone line or network connection.\n\nThis chapter includes\
    \ recipes for connecting your Linux system to the Internet with an ISP, using\
    \ fax services, and making serial connections with a modem.\n\nFor more information\
    \ on this subject, see The Linux Network Administrator's Guide (http://metalab.unc.edu/mdw/ldap/nag.html).\n\
    \n# 29.1 Connecting to the Internet\n\nDebian: 'ppp'\nWWW: http://cs.anu.edu/au/pub/software/ppp/\n\
    \nThere are several ways to connect a Linux box to the Internet. Digital Subscriber\
    \ Line (DSL) service, cable modems, and dial-connections using ISDN or analog\
    \ modems are currently the most popular methods. Each of these services have their\
    \ own hardware and software requirements.\n\nFor up-to-date, detailed instructions\
    \ for using these services on Linux-based systems, the relevant HOWTOs published\
    \ by the Linux Documentation Project (http://www.linuxdoc.org/) remain the definitive\
    \ guides (see Recipe 2.8.6 [Reading System Documentation and Help Files], page\
    \ 32):\n\n+   - ISP Hookup HOWTO, by Emil Kvaleberg\n  http://www.linuxdoc.org/HOWTO/ISP-Hookup/\n\
    - DSL HOWTO for Linux, by David Finnin\n  http://www.linuxdoc.org/HOWTO/DSL-HOWTO/\n\
    - Cable Modem Providers HOWTO, by Vladimir Vuksan\n  http://www.linuxdoc.org/HOWTO/Cable-Modem/\n\
    \nThe following recipes show how to set up and use a PPP (\"Point-to-Point Protocol)\
    \ dial-up connection, over the de facto method of connecting a computer to the\
    \ Internet over a dial-up line.\n\n# 29.1.1 Setting Up PPP\n\nTo configure PPP\
    \ for a regular dial-up connection, where your system is assigned a dynamic IP\
    \ address (the norm for home Internet access), you need to be root (the superuser)\
    \ to edit the PPP configuration files, and you'll need the standard connection\
    \ information from your ISP: the dial-up number to use, the IP addresses for their\
    \ nameservers, and your username and password for accessing their system.\n\n\
    Use this information to customize the file '/etc/chatscripts/provider':"
  merge: -1
  pgno: 330
- img_proc: true
  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    | | |

    |---|---|

    | ABORT | BUSY |

    | ABORT | "NO CARRIER" |

    | ABORT | VOICE |

    | ABORT | "NO DIALTONE" |

    | " | "\p\p+++\p\p" |

    | " | "at" |

    | " | "at" |

    | OK | atd0 |

    | " | atdt5551010, |

    | ost | ppp |

    | ogin | smith |

    | word | \secret\q |


    In this example, after eight lines of modem initialization strings, the modem
    is instructed to dial the dial-up number, ''5551010''. Some systems need one or
    two commas after the number to signify pauses for the modem; only do this if you
    can''t get a good connection with just the telephone number in place.


    Next is the "host" line is an optional line used by some ISPs whose connection
    line contains a choice of services from which you must make a selection before
    entering your username and password (some ISPs offer SLIP and shell access along
    with the standard PPP, for example); customize this and follow the instructions
    given by your ISP.


    Finally, the username ''smith'' is given, and then the password of ''secret''.
    The password appears between ''strings, which—for security purposes—instruct ppp
    to display the question mark (''?'') characters instead of the actual password
    in system logs or places where an intruder might see it.


    ```

    Next, edit the file `/etc/ppp/ppvers/provider` so that it contains these:

    connect /usr/sbin/chat -v -f /etc/scripts/provider

    defaultroute /dev/modem 115200 persist

    ```


    The last line in this file should include the name of the modem you are using
    and the maximum speed to connect; the preceding example `/dev/modem` as the device
    name of the modem, and 115,200 bps as the maximum connect speed, is a good value
    for a typical 56K modem (a rule of thumb is to use the highest connect speed your
    modem supports; you can go lower when a connection is made, but you can never
    raise the speed above what is given here)


    ```

    Finally, edit the file `/etc/resolv.conf` so that it contains the following, using
    the nameserver addresses given to you by your ISP:

    search

    ameserver nameserver address 1

    nameserver nameserver address 2

    ```


    For the two nameserver address values, use the IP address of the nameserver machines,
    given to you by your ISP. The second is optional—most ISPs have more than one
    designated nameserver as a backup in the event that the first becomes unavailable.


    Make sure your user account has membership to the dialout group; otherwise, you''ll
    have to have the superuser account start and stop PPP, which is not recommended
    (see Recipe A.3.2 [Letting Users Access Hardware Peripherals], page 363).'
