    # 2.8.5 Using the GNU Info System


    The GNU Info System is an online hypertext reference system for documentation
    prepared in the Info format. This documentation tends to be more complete than
    a typical man page, and often, the Info documentation for a given software package
    will be an entire book or manual. All of the manuals published by the Free Software
    Foundation are released in Info format; these manuals contain the same text (sans
    illustrations) as the paper manuals that you can purchase directly from the Free
    Software Foundation.


    There are different ways to peruse the Info documentation: you can use the standalone
    info tool, read Info files in the Emacs editor (Recipe 10.2 [Emacs], page 121),
    or use one of the other tools designed for converting Info. Additionally, tools
    exist for converting Info documentation to HTML that you can read in a Web browser
    (Recipe 5.9 [Browsing Files], page 81).


    To read the Info manual for a tool or application with the info tool, give its
    name as an argument. With no arguments, info opens your system''s Top Info menu,
    which lists all of the available manuals that are installed on the system.


    +   * To view all of the Info manuals on the system, type:


    ```

    $ info RET

    ```


    This command starts info at the system''s Top Info menu, which shows some of the
    info key commands and displays a list of available manuals:


    ```

    File: dir; Node: Top; This is the top of the INFO tree

    (This Directory node) gives a menu of major topics.

    Typing "?" exits lists all Info commands. "d" returns home,

