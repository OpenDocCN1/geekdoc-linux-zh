  md: '# 31 The World Wide Web


    Next to email, the most useful service on the Internet is the World Wide Web (often
    written “WWW” or “Web”). It is a giant network of hypertext documents and services,
    and it keeps growing by the instant—anyone with an Internet-connected computer
    can read anything on the Web, and anyone can publish to the Web. It could be the
    world''s largest public repository of information.


    This chapter describes tools for accessing and using the Web. It also describes
    tools for writing text files in HTML (“HyperText Markup Language”), the native
    document format of the Web.


    # 31.1 Browsing the Web


    ```

    Debian: ''mozilla''

    Debian: ''skipstone''

    WWW: http://www.mozilla.org/

    WWW: http://galeon.sourceforge.net/

    WWW: http://www.muhri.net/skipstone/

    ```


    When most people think of browsing or surfing the Web, they think of doing it
    graphically—and the mental image they conjure is usually that of the famous Netscape
    Web browser. Most Web sites today make heavy use of graphic images; furthermore,
    commercial Web sites are usually optimized for Netscape-compatible browsers—many
    of them not even accessible with alternative browsers. That means you''ll want
    to use this application for browsing this kind of Web site.


    The version of Netscape''s browser which had been released as free, open source
    software (see Recipe 1.1.3 (“What''s Open Source?”, page 11) in 1998 to make famous
    is called Mozilla.¹ When first released, the Mozilla application was a “developer''s
    only” release, but as of this writing it is finally reaching a state where it
    is ready for general use.


    Once the Mozilla browser has been installed, run it in X either by typing mozilla
    in a shell or by selecting it from a menu in the usual fashion, as dictated by
    your window manager.


    Like most graphical Web browsers, its use is fairly self-explanatory; type a URL
    in the Location dialog box to open that URL, and left-click on a link to follow
    it, replacing the contents of the browser''s main window with the contents of
    that link. One nice feature for Emacs fans is that you can use Emacs-style keystrokes
    for cursor movement in Mozilla''s dialog boxes (see Recipe 10.22 [Basic Emacs
    Editing Keys], page 123).


    > ¹ Netscape''s browsers, from their earliest Navigator release to their later
    Communicator series, were always referred to by the company Mozilla; this was
    a pun on the name Mosaic, which was the first popular graphical Web browser in
    the early 1990s—Netscape''s goal had to make a monster Mosaic.*'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    A typical Mozilla window looks like this:


    ![](img/3658df520e459cc83b744521428473cf_351_0.png)


    In this example, the URL `slashdot.org/` is loaded.

    A critic of the early Netscape Navigator programs is that the browser is a bloated
    application: it contained its own email client, its own Usenet reader, and other
    functions that are not necessary when one wants to simply browse the Web. Since
    Mozilla is free software, anyone can take out these excess parts to make a slimmer,
    faster, smaller application—and that is what we have done. Of these two projects,
    Galeon and Skipping show some promise; see the above URLs for their home pages.¹


    The following recipes will help you get the most out of using a graphical browser
    in Linux.


    **NOTE:** Mozilla development is moving very rapidly these days, and while Mozilla
    is continually improving at a fantastic rate, some of these recipes may not work
    as described with the version you have.


    Another way to browse the Web is to use Emacs (see Recipe 31.4 [Browsing the Web
    in Emacs], page 333); more alternatives are listed in Recipe 31.7 [More Web Browsers
    and Tools], page 340.


    # 31.1.1 Maintaining a List of Visited Web Sites


    Debian: ‘browser-history’

    WWW: `http://www.inria.fr/koalas/browser-history/`


    Use the `browser-history` tool to maintain a history of all the Web sites you
    visit.


    > ¹ A trimmed-down Mozilla will be available for Debian systems.'
