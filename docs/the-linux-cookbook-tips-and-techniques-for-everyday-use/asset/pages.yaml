- img_proc: true
  md: '# Chapter 2: Every Linux User Knows


    A tool or application may take any number of options (sometimes called ''flags''),
    which specify a change in its default behavior. It may also take arguments, which
    specify a file or some other text to operate on. Arguments are usually specified
    after any options.


    A command is the name of a tool or application along with the options and arguments
    you want to use, if any. Since typing the name of a tool itself is often sufficient
    to accomplish a desired task, tools are often called commands.


    Commands are case sensitive; the names of tools and applications are usually in
    all lowercase letters.


    To run (or ''execute'') a tool or application without giving any options or arguments,
    type its name at a shell prompt followed by RET.


    +   To run the hostname tool:


    ```

    $ hostname RET

    bardo

    $

    ```


    The hostname of the system in the example is ''bardo''.


    Options always begin with a hyphen character, ''-'', which is usually followed
    by one alphanumeric character. To include an option in a command, follow the name
    of the tool or application with it. Always separate the tool name, each option,
    and each argument with a space character.


    Long-style options (sometimes called ''GNU-style'' options) begin with two hyphens
    (''--'') and are usually one English word.


    For example, many tools have an option. ''--version'', to output the version number
    of the tool. (Many tools also have a ''--help'' option, which outputs a list of
    options the tool takes; see Recipe 2.8.3 [Listing the Usage of a Tool], page 29.)


    +   To run the version of the hostname tool, type:


    ```

    $ hostname --version RET

    hostname 2.10

    $

    ```


    This command outputs the text ''hostname 2.10'', indicating that this is version
    2.10 of the hostname tool.


    Sometimes, an option itself may take an argument. For example, hostname has an
    option for specifying a file name to use to read the hostname from, ''-F''; it
    takes as an argument name the file that hostname should read from.


    +   To run hostname and specify that the file ''host.info'' is the file to read
    from, type:


    ```

    $ hostname -F host.info RET

    ```'
