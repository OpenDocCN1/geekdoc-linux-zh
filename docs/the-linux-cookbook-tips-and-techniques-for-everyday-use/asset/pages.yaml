    # 2.7.2 Listing All of a User''s Processes


    To list all the processes of a specific user, use ps and give the username to
    list as an argument to the ''-u'' option. While you can''t sniff the actual activities
    of other users, you can list the commands that are running at a given moment.


    +   - To list all the processes that user hst has running on the system, type:


    ```

    $ ps -u hst RET

    ```


    NOTE: This command is useful for listing all of your own processes, across all
    terminals and shell sessions; give your own username as an argument.


    # 2.7.3 Listing All Processes on the System


    To list all processes by all users on the system, use the ''aux'' options.


    +   - To list all of the processes and give their username:


    ```

    $ ps aux RET

    ```


    NOTE: There could be a lot of output—even single-user Linux systems typically
    have fifty or more processes running at one time—so you may want to pipe the output
    of this command less for perusal (see Recipe 9.1 [Parsing Text], page 111).\ Additionally,
    use top to show a display of all processes on the system, sorted by their demand
    on the system resources. The display is continually updated with current process
    information; press Q to stop the display and exit the program. This tool also
    displays the information about system runtime and memory that can be output with
    the uptime and free commands.


    +   - To display a continually updated display of the current system processes,
    type:


    ```

    $ top RET

    ```


    # 2.7.4 Listing Processes by Name or Number


    To list processes whose output contains a name or other text to match, list all
    processes and pipe the output to grep. This is useful for you want to see which
    users are running a particular program or command.


    +   - To list all the processes whose commands contain reference to ''sbin'' directory
    in them, type:


    ```

    $ ps aux | grep sbin RET

    ```


    +   - To list any processes whose process IDs contain a 13 in them, type:


    ```

    $ ps aux | grep 13 RET

    ```'
