    \ - $ cdparanoia -B -Y -X RET\n\nNOTE: Sampling an entire CD can use a lot of\
    \ disk space; most people delete the '.cdr' or '.wav' files as soon as they make\
    \ MP3s or burn an audio CD-R from the data.\n\n# 22.3 Writing an Audio CD-R\n\n\
    Debian: 'cdrecord'\nWWW: http://freshmeat.net/projects/cdrecord/\n\n‘cdrecord’\
    \ to write (or “burn”) audio files to a blank CD-R disc. You will need a CD-R\
    \ drive and the audio files must be in CD-DA audio format (usually they have a\
    \ '.cdda' or '.cdr' file extension).\nSpecify the CD-R drive with the 'dev' argument,\
    \ which is given in this form:\n  - 'dev=scsisbus,target,lun'\nwhere scsisbus\
    \ is the number of the SCSI bus (0 for the primary bus), target is the SCSI target\
    \ ID (usually a number from 1 to 6), and lun is its LUN number (almost always\
    \ 0).\nUse the 'speed' argument to set the speed factor for writing data: speed=2\
    \ to specify double speed or speed=4 to specify quad speed.\nUse the ‘dummy’ option\
    \ to run with the drive laser turned off, so no actual burning takes place; this\
    \ is useful when you are first using a CD-R drive and need to test your\n\n1 You\
