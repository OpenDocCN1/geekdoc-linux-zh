    \ IN jacks, as well as connections to the CD-ROM drive, all of which are sound\
    \ inputs that can be recording sources. When you select a device for capture,\
    \ your recording will come from this source.\n\nRecording occurs from the currently\
    \ active input, if which must be set with the mixer: unmute and set its volume\
    \ level before beginning (Be sure to turn the volume on your speakers all off,\
    \ or you will get feedback.)\n\nTo record audio file, use the '-t' tool. It can\
    \ write many audio file formats, either to format a type you specify with the\
    \ '-t' option, or by determining the format to use based on the file name extension\
    \ you give the output file (see Recipe 21.1 [Sound File Formats], page 243). Type\
    \ C-c to stop recording.\n\nTo give the name of the file as an argument; if a\
    \ '.wav' file is specified, it will record a simple monaural, low-fidelity sound\
    \ sample by default.\n\n+   - To record a simple monaural WAV sample from the\
    \ microphone and save it to a file called 'hello.wav', type: \n\n```\n$ rec hello.wav\n\
    ```\n\nThis command begins at 8000 Hz, monaural 8-bit WAV recording to the file\
    \ 'hello.wav', and keeps recording until you interrupt it with C-c. While the\
    \ file is a low-fidelity recording—8000 Hz, monaural 8-bit samples—you can specify\
    \ that a high-fidelity recording be made (But remember that high-fidelity recordings\
    \ take much more disk space).\n\nTo make a stereo recording, use the '-c' option\
    \ to specify the number of channels, giving 2 as the argument. To make a 16-bit\
    \ recording, use '-w' ('wide') as the argument to the '-s' ('sample size') option.\n\
    \nSet the recording rate by giving the samples per second to use as an argument\
    \ to the '-r' option. For CD-quality audio at 44100Hz, use '-r 44100'.\n\nFinally,\
    \ to record a file in a particular format, either give the name of the format\
    \ as an argument to the '-f' option or the traditional file name extension for\
    \ that format in the output file (see Recipe 21.1 [Sound File Formats], page 243).\n\
    \n+   - To make a high-fidelity recording from the microphone and save it to a\
    \ WAV-format called 'goodbye.wav', type:\n\n```\n$ rec -s v -c 2 -r 44100 goodbye.wav\n\
    ```\n\n+   - To make a sound recording in the CD audio format, and write the output\
    \ to a file called 'goodbye.cdr', type:\n\n```\n$ rec goodbye.cdr\n```\n\nNOTE:\
    \ When you're not recording sound, keep the inputs muted (see Recipe 21.2.3 [Muting\
    \ an Audio Device], page 245); this way, you can use a microphone without having\
    \ feedback when playing sounds. Also, make sure the volume levels are not too\
    \ high or"
