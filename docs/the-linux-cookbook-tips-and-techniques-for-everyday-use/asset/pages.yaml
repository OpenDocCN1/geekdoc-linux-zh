    # 20.2 Manipulating PostScript Documents


    These recipes on a PostScript document as a whole.


    # 20.2.1 Resizing a PostScript Document


    Use psresize to resize a PostScript file. It takes as arguments the file to resize
    and the output file to write; you must also specify the page size of the output
    file, using the same format as the pspage tool: ''-p'' or ''-h'' and ''-w'' to
    specify the size of the output file, and use ''-P'' to specify the size of the
    input file (see Recipe 20.1.3 [Combining PostScript]), page 237.


    +   - To resize the PostScript file ''double.ps'' to US letter-sized paper, writing
    output to a new file, ''double.ps'', type:


    ```

    $ pletter double.ps double.ps RET

    ```


    # 20.2.2 Combining PostScript Documents


    Use psmerge to concatenate and merge multiple PostScript files into a single file.
    Give the names of the files to be merged as arguments, and psmerge outputs them
    to the standard output in the given order. You can also specify an output file
    name with the ''-o'' option (don''t put any spaces between the file name and the
    option).


    +   - To merge the files ''slide1.ps'', ''slide2.ps'', and ''slide3.ps'' into
    a new PostScript file, ''slideshow.ps'', type:


    ```

    $ psmerge -oslidehow.ps slide1.ps slide2.ps slide3.ps RET

    ```


    NOTE: As of writing, psmerge only works with PostScript files that were made with
    the same application—which means, for example, you can merge multiple files made
    with TeX, or multiple files made with xfig, but not a combination of them.


    # 20.2.3 Arranging a PostScript Document in a Booklet


    To arrange the pages in a PostScript file to make booklets, rearrange the pages
    in a signature with psbook, use psup to arrange the pages—two to a printed page
    in landscape mode—and then use pstop to output the first odd and then the even
    pages.'
  merge: -1
  pgno: 261
- img_proc: true
  md: "# Chapter 20: PostScript\n\nThe trick to doing this properly is to first determine\
    \ exactly what you need to do and then calculate the proper measurements for use\
    \ with ppstops.\n\n+   * To make a booklet from the file `newsletter.ps`\n  1.\
    \ Rearrange the pages into a signature:\n     $ psbook newsletter.ps newsletter.signature.ps\
    \ RET\n  2. Put the two pages to a page in landscape orientation, at 70 percent\
    \ of their original size (typed all on one line):\n     $ psnup -1 -pletter -2\
    \ -s.7 newsletter.signature.ps > newsletter.2up.ps RET\n  3. Output the odd:\n\
    \     $ pstops \"2:0(1in,0in)\" newsletter.2up.ps > odd.ps RET\n  4. Output the\
    \ even:\n     $ pstops \"2:-1(1in,0in)\" newsletter.2up.ps > even.ps RET\n\nThen,\
    \ print the booklet read `odd.ps` to the printer, load the printed pages in the\
    \ manual feed tray and send `even.ps` to the printer. This prints the odd and\
    \ even pages on opposite sides of the sheets.\n\n+   * To make a double-sided\
    \ booklet on letter-sized page in landscape orientation, from a file using letter-sized\
    \ portrait orientation, type:\n\n```\n$ psbook input.ps > temp1.ps RET\n...processing\
    \ messages...\n$ psnup -1 -pletter -2 -s.7 temp1.ps > temp2.ps RET\n...processing\
    \ messages...\n$ pstops \"2:0(1in,0in)\" temp2.ps > odd.ps RET\n...processing\
    \ messages...\n$ pstops \"2:-1(1in,0in)\" test2.ps > even.ps RET\n...processing\
    \ messages...\n$\n```\n\n# 20.3 Converting PostScript\n\nThese recipes show how\
    \ to convert PostScript files to other formats. Also see the recipes for preparing\
    \ PostScript files for printing, Recipe 25.3.1 [Preparing a PostScript File for\
    \ Printing], page 275.\n\n# 20.3.1 Converting PostScript to PDF\n\nUse ps2pdf,\
    \ part of the “Ghostscript” package, to convert a PostScript file to PDF. Give\
    \ as arguments the name of the PostScript file to read, and the name of the PDF\
    \ file to write to.\n\n+   * To make a PDF file `sutra.pdf` from the input file\
    \ `sutra.ps`, type:\n  $ ps2pdf sutra.ps sutra.pdf RET"
