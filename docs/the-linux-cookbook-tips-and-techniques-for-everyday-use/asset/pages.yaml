  md: '# 2.8.4 Reading a Page from the System Manual


    In the olden days, the hardcopy reference manual that came with most Unix systems
    also existed electronically on the system itself; each software came with the
    system had its own manual page (often called a "man page") that described it.
    This is still true on Linux-based systems today, except they don''t always come
    with a hardcopy manual.


    Use the man tool to view a page in the system manual. As an argument to man, give
    the name of the program whose manual page you want to view (so to view the manual
    page for man, you would type man man).


    +   - To view the manual page for w, type:


    ```

    $ man w RET

    ```


    This command displays the manual page for w:


    | W(1) | Linux Programmer''s Manual | W(1) |

    |---|---|---|

    | NAME | | |

    | w - Show who is logged on and what they are doing. | | |

    | SYNOPSIS - [husFV] [user] | |\ |DESCRIPTION displays information about the users
    currently on the machine, and their processes. The header shows, in this order,
    the current time, how long the system has been running, how many users are currently
    logged on, and the system load averages for the past 1, 5, and 15 minutes. | |
    |


    The following entries are displayed for each user: login name, the tty name, remote
    host, login time, idle time, JCPU, PCPU, and the command line of their current
    process.


    The JCPU time is the time used by all processes attached


    Manual page w(1) line 1


    Use the up and down arrow keys to move through the text. Press Q to view the manual
    page and exit man. Since man uses less to display the text, you can use any of
    the less keyboard commands to peruse the manual page (see Recipe 9.1 [Perusing
    Text], page 11).


    Despite its, a manual page does not always contain the complete documentation
