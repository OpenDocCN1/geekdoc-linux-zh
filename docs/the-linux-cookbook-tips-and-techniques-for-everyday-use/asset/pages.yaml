  md: '# 15.1 Choosing the Right Typesetting System for the Job


    Choosing the proper typesetting system to use when you are about to begin a project
    can be daunting; each has its own drawbacks and abilities, and to the less experienced
    it may not be immediately clear which is most appropriate for a particular document
    or project.


    The following table can help you determine which system is best for a particular
    task. There isn''t one way of doing such things, of course — these are only my
    recommendations. The first column lists the kind of output you intend, the second
    gives examples of the kind of documents, and the third suggests the typesetting
    system(s) to use. These systems are described in the remaining sections of this
    chapter.


    | INTENDED OUTPUT | EXAMPLES | TYPESETTING SYSTEM |

    | Printed, typeset output and electronic HTML or text file | FAQ, paper dissertation
    | enchant; Texinfo |

    | Printed, typeset output and text file | man page, command reference | gro |

    | Printed, typeset output | Letter or other correspondence, report, book manuscript
    | LaTeX or LyX |

    | Printed, typeset output | Brochure or newsletter with multiple columns and images
    | LyX |

    | Printed, typeset output | Envelope, mailing label, other specialized document
    | TEX |

    | Printed text output in a font | Grocery list, saved email message, to do list
    | enchant |

    | Printed, typeset output | Poster sign | enchant; HTML; LyX; TEX |

    | Large printed text output | Long banners for parties or other occasions | banner
    |


    **NOTE:** If you don''t really need a document to be typeset, then don''t bother!
    Just keep it a plain text file, and use a text editor to edit it (see Chapter
    10 [Text Editing], page 119). Do this for writing notes, email messages. Web pages.
    Usenet articles, and so forth. If you ever need to typeset it later, you will
    still be able to do so. And you can, if you like, view print plain text in nice
    fonts (see Recipe 15.2.1 [Outputting Text in a Font], page 180).'
  merge: -1
