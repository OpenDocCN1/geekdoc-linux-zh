  md: "# # 6 Sharing Files\n\nGroups, file ownership, and access permissions are Linux\
    \ features that enable users to share files with one another. But even if you\
    \ don't plan on sharing files with other users on your system, familiarity with\
    \ these concepts will help you understand how file access and security work in\
    \ Linux.\n\n#  6.1 Groups and How to Work in Them\n\nA group is a set of users,\
    \ created to share files and to facilitate collaboration. Each member of a group\
    \ can work with the group's files and make new files that belong to the group.\
    \ The system administrator can add new groups and give users membership to the\
    \ different groups, according to the users' organizational needs. For example,\
    \ a system used by the crew of a ship might have groups such as _galley, bridge,\
    \ and crew the user captain might be a member of only the galley and crew groups.\n\
    \nOn a Linux system, you're always a member of at least one group: your login\
    \ group. You are the only member of this group, and its group name is the same\
    \ as your username.\n\nLet's look at how to manage your group memberships.\n\n\
    #  6.1.1 Listing the Groups You Belongs To\n\nTo list a user's group memberships,\
    \ use the groups tool. Give a username as an argument, and groups outputs a line\
    \ containing username followed by all of the groups the user is a member of. With\
    \ no arguments, groups lists your username and group memberships.\n\n+   - To\
    \ list your group memberships, type:\n\n```\n$ groups RET\nsteward galley crew\n\
    $ \n```\n\nIn this example, three groups are output: steward (the user's login\
    \ group), galley, and crew.\n\n+   - To list the group memberships of user blackbeard,\
    \ type:\n\n```\n$ groups blackbeard RET\nblackbeard : blackbeard\n$ \n```\n\n\
    In this example, the command outputs the given username, blackbeard, followed\
    \ by the name of one group, blackbeard, indicating that user blackbeard belongs\
    \ to only one group: his login group."
  merge: -1
  pgno: 106
- img_proc: true
  md: '# 6.1.2 Listing the Members of a Group


    Debian: ''members''


    To list the members of a particular group, use the members tool, giving the name
