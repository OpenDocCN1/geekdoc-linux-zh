    # 13.3 Underlining Text


    In the days of typewriters, text that was meant to be set in an italicized font
    was denoted by underlining the text with underscore; now it''s common practice
    to denote an italicized word in plain text by using an underscore character, ''_'',
    just before and after a word in a file, like `_this_`.


    Some text markup languages use different methods for denoting italics; for example,
    in TeX or LaTeX italicized text is often denoted with brackets and the `\it` command,
    like `\it this`. (LaTeX uses the same format, but `\emph` is used in place of
    `\it`).


    You can convert one to the other by using the Emacs replace-regular-expression
    function and specifying the text to be replaced as a regex (see Recipe 14.2 [Regular
    Expressions] Matching Text Patterns], page 166).'
