    # 10.3 Running a Vi Tutorial


    Debian: nvi

    WWW: http://mongoose.bostic.com/pub/nvi.tar.gz

    WWW: http://www.cs.cmu.edu/~vachepl/Editors/Vi/


    The Vi editor comes with hands-on, self-paced tutorial, which you can use in vi
    to learn how to use it. It is stored as a compressed file in the /usr/doc/nvi/
    directory: copy this to your home directory, uncompress it, and open it with vi
    to start the tutorial.


    +   * To run vi tutorial, type the following from your home directory:


    ```

    $ cp /usr/doc/nvi/vi.beginner.gz . RET

    $ gunzip vi.beginner RET

    $ vi.beginner RET

    ```


    NOTE: An advanced tutorial is also available in ''/usr/doc/nvi''.


    # 10.4 Selecting Text


    In X, you can copy and paste text between other windows, including xterm and Emacs
    windows. The most recently selected text is called the X selection.


    In the console, you can copy and paste text in the same virtual console or into
    a different virtual console. To do this, you need the gpm package installed and
    set up for your mouse (it''s a default, recommended package).


    The operations described in this section work both in X and in virtual consoles.
    You cannot prevent copy and paste text between X and a virtual console.


    Three buttons on the mouse are used for cutting and pasting. If you have a two-button
    mouse, your administrator can set it to emulate three buttons - the middle button,
    press the left and right buttons simultaneously.


    Click the left mouse button and drag the mouse over text to select it. You can
    also double-click the left mouse button on a word to select that word, and triple-click
    the left mouse button on one end of a portion of text to select, and then click
    the right mouse button at the other end to select all of the text between the
    points.'
