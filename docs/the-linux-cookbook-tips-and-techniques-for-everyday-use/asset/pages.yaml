  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    ```

    $ write sleepy RET

    Wake up!

    C-d

    $

    ```


    The other user can reply to by running write and giving your username as an argument.
    Traditionally, users ended a write message with ''-o'', which indicated that they
    were saying ''over'' and that it was not the other person''s turn to talk. When
    a user believed that a conversation was completed, the user would end with ''oo'',
    meaning that they were ''over and out''.


    A similar command, write texts a message to all other users on the local system.
    It takes a file as an argument and outputs the contents of that file; with no
    argument, it outputs what you type until you C-d on a line by itself. It precedes
    the message with the text ''Broadcast message from username'' (where username
    is your username) followed by the current time, and it rings the bell on all terminals
    it broadcasts to.


    +   - To output the contents of `/etc/motd` to all logged-in terminals, type:


    +   - To output the text ''Who wants to go out for Chinese food?'' to all logged-in
    terminals, type:


    ```

    $ wall RET

    Who wants to go out for Chinese food? RET

    C-d

    ```


    You can control access to your terminal with mesg. It works like biff (see Recipe
    30.3.2 Setting Notification for New Mail, page 320) with no arguments, it outputs
    whether or not it is set; with ''y'' as an argument, it allows messages to be
    sent to your terminal; and with ''n'' as an argument, it disallows them.


    The default for all users is to allow messages to be written to their terminals:
    antisocial people usually put the line mesg n in their '' .bashrc'' file (see
    Recipe 3.6.4 Customizing Future Shells, page 47).


    +   - To disallow messages to be written to your terminal, type:


    ```

    $ mesg RET

    is n

    $

    ```


    +   - To output the current access state of your terminal, type:


    ```

    $ mesg RET

    is n

    $

    ```


    In the preceding example above, mesg indicated that messages are currently disallowed
    to be written to your terminal.


