    \ RET\n```\n\n# 5.6.2 Safe Way to Remove a File\n\nWWW: http://ftp.wg.omron.co/pub/unix-faq/docs\n\
    WWW: http://dsl.org/comp/tinytutils/\n\nOnce a file is removed, it is permanently\
    \ deleted and there is no command you can use to restore it; you cannot \"undelete\"\
    \ it.(Although if you can unmount the filesystem that contained the file immediately\
    \ after you deleted the file, a wizard might be able to reconstruct the last file\
    \ using grep to search the filesystem file.)\n\nA safer way to remove files is\
    \ to use del, which is an alias to rm with the '-i' option. This specifies for\
    \ rm to run in interactive mode and confirm the deletion of each file. It may\
    \ be good to get in the habit of using del all the time, so that you make no accidental\
    \ slip and rm an important file.\n\nNOTE: Question 3.6 in the Unix FAQ (/usr/doc/FAQ/unix-faq-part-3)\
    \ discusses this issue, and a shell script would catch that you can use in place\
    \ of rm -i puts files in a \"trashcan\" directory of removing them; you then periodically\
    \ empty the trash with rm.\n\n# 5.7 Giving a File More than One Name\n\nLinks\
    \ are special files that point to other files: when you act on a file that is\
    \ a link, you act on the file it points to. There are two kinds of links: hard\
    \ links and symbolic links. A hard link is another name for an existing file;\
    \ there is no difference between the link and the original file. If you make a\
    \ hard link for file 'foo' to file 'bar', and then remove file 'bar', file 'foo'\
    \ is also removed. Each file has at least one hard link, which is the original\
    \ file name itself. Directories have at least two hard links—the directory itself\
    \ (which appears in its parent directory) and the special file '*', inside the\
    \ directory. Likewise, when you make a new subdirectory, the directory gains a\
    \ new hard link for the special file '..' the new subdirectory.\n\nA symbolic\
    \ link (sometimes called a \"symlink\" or \"soft link\") passes most operations\
    \ such reading and writing—to the file it points to, just as a hard link does.\
    \ However, if you remove a symlink, you remove only the symlink itself, and not\
    \ the original file."
