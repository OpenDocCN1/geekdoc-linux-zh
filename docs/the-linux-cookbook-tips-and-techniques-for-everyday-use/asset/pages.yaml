  md: "# The Linux Cookbook: Tips and Techniques for Everyday Use\n\nSome tools, such\
    \ as dvips encript (see Recipe 15.2 [Converting Plain Text for Output], page 179),\
    \ are also configured to spool output to the printer.\n\nYou can view these print\
    \ jobs in the spool queue and you can cancel them, just as you could print any\
    \ job.\n\n# 25.2.1 Printing in Emacs\n\nTo print the current buffer in Emacs,\
    \ choose Print Buffer from the Print submenu, found off the Tools menu on the\
    \ menu bar. Another option on the submenu is Print Region, which just prints the\
    \ text between point and mark (see Recipe 10.2.1 [Getting Acquainted with Emacs],\
    \ page 121). Both commands handle the hard output separated into pages, and with\
    \ headers at the top of each page, showing the file name and current page number.\n\
    \nTo generate a PostScript image of the buffer, use the ps-print-buffer function,\
    \ which is also available on the Print submenu. A related function, ps-print-region,\
    \ prints a PostScript image of the region. These commands are useful for sending\
    \ the text of a buffer to a PostScript printer.\n\nYou can also run any of these\
    \ functions by specifying them with the M-x command; additionally the lpr-buffer\
    \ and lpr-region functions send the buffer and region to lpr without paginating\
    \ the text or inserting headers.\n\n+   - To print the current buffer with page\
    \ numbers and headers, type:\n  - M-x print-buffer `RET`\n- To print the current\
    \ buffer with no additional print formatting done to the text, type:\n  - M-x\
    \ lpr-buffer `RET`\n- To print a PostScript image of the current buffer, type:\n\
    \  - M-x ps-print-buffer `RET`\n\n# 25.2.2 Printing with Dvips\n\nYou can print\
    \ a DVI file directly with the dvips omit '-o' option that is used to specify\
    \ an output file, and it will send the PostScript output directly to the spool\
    \ queue of the default printer.\n\n+   - To print the DVI file `list.dvi`, type:\n\
    \  - $ dvips list.dvi `RET`\n\nThe following table lists some of dvips' various\
    \ options for controlling print output.\n\n| Option | DESCRIPTION |\n|---|---|\n\
    | -A | Print only odd-numbered pages (DVI file must have been generated by TeX).\
    \ |\n| -B | Print only even-numbered pages (DVI file must have been generated\
    \ by TeX). |\n| -b copies | Specify the number of copies to print—useful for printing\
    \ multiple copies of flyers, posters, signs, and the like. |"
