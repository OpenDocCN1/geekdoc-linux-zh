    # 5.3.7 Additional Directory Listing Options


    The ls tool has many options to control the files listed and the information given
    for each file; the following table describes some of them. (The options are case
    sensitive.)


    | OPTION | DESCRIPTION |

    | --color | Colorize the names of files depending on their type. |

    | -R | Produce a recursive listing. |

    | -a | List all files in a directory, including hidden, or "dot," files. |

    | -d | List directories by name instead of listing contents. |

    | -f | Do not sort directory contents; list them in the order they are written
    on the disk. |

    | -l | Produce a verbose listing. |

    | -r | Sort directory contents in reverse order. |

    | -s | Output the size—as an integer in 1K blocks—of each file to the left of
    the name. |

    | -t | Sort by timestamp instead of alphabetically, so the newest files are listed
    first. |


    NOTE: You can combine any of these options; for example, to list the contents
    of a directory sorted newest, and display all attributes, use ''-1at''. To recursively
    list all hidden files and display all attributes, it doesn''t matter what you
    put the options in—''-1Ra'' is the same as, say., ''-alR''.


    # 5.4 Copying Files and Directories


    Use cp ("copy") to copy files. It takes two arguments: the source, which is the
    existing file to copy, and the target, which is the file name for the new copy.
    cp then makes an identical copy of the source file, giving the target name. If
    a file with the target already exists, cp overwrites it. It does not alter the
    source file.


    +   To copy the file ''my-copy'' to the file ''neighbor-copy'', type:


    ```

    $ cp -p ("preserve") neighbor-copy RET

    ```


    This command creates a new file named ''neighbor-copy'' that is identical to ''my-copy''
    in every respect except for its name, owner, group, and timestamp—the new file
    has a timestamp that shows the time it was copied. The file ''my-copy'' is not
    altered.


    Use the ''-p ("preserve") option to preserve all attributes of the original file,
    including its timestamp, owner, group, and permissions.'
