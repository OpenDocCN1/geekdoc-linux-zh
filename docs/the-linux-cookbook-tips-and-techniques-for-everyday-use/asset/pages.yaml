  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    The xwave tool (and many others, doubt) have similar capabilities and functions
    (see Recipe 23.4 [Other Tools for Sound Editing], page 261).


    # 23.1.1 Cutting Out Part of a Sound File


    To cut out a part of a sound file you are editing in Snd, first make it the selection
    by left-clicking and dragging, and then choose Cut from the Edit menu, somewhat
    like cropping an image file.


    # 23.1.2 Pasting a Selection of Sound


    Paste a cut selection into a different sound buffer in Snd by opening the new
    buffer, left-clicking in the target buffer, and then choosing Paste from the Edit
    menu. Your most recent selection will be pasted at the point where you clicked
    in the sound buffer.


    # 23.1.3 Mixing Sound Files Together


    To mix different audio files together as multiple tracks in Snd, choose Mix from
    the Mix menu and specify the files to use as the individual tracks.


    # 23.2 Sound Effects


    Debian: ''sox''

    WWW: http://home.sprynet.com/~cbagwell/sox..html


    The "SoundExchange" tool, sox, is a sample sound translator. It reads sound as
    files or standard input and outputs the sound either to a file or standard output,
    while translating in between. You can use sox to convert sound files between formats
    or process sounds with special effects. This section describes some of the special
    effects you can apply to files with sox.


    When applying an effect, the original file is never altered. You must specify
    the output file, or use ''-'' to indicate the standard output, specifying the
    format with ''-t''. You can only apply one effect with each sox command; to add
    both echo and reverb to a sound file, you would need to use two sox commands.


    The levels and amplitude for each effect will vary with every situation. As such,
    consider the following recipes guidelines for using the options; you will probably
    end experimenting a bit more to get your intended effect for any particular sound
    file.


    Almost all of the effects are affected by specifying the input and output file
    arguments, followed by the name of the effect to use and any options the effect
    takes (with notable exceptions, like the ''-v'' option for changing the amplitude
    of a file).


    NOTE: For more information on the effects Sox can do, see the various files in
    /usr/doc/sox/, and read the sox man page (see Recipe 2.8.4 [Reading a Page from
    the System Manual], page 30).'
  merge: -1
