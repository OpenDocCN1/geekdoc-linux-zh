    # 2.7 Listing System Activity


    When you run a command, you are starting a process on the system, which is a program
    that is currently executing. Every process is given a unique number, called its
    process ID, or "PID".


    Use ps to list processes on the system. Some of the information it can display
    about a process includes process ID, name of command running, username command,
    and how long the process has been running. By default, ps outputs 5 columns: process
    ID, the name of the terminal from which the process was started, the current status
    of the process (including ''S'' for sleeping, meaning that it is on hold at the
    moment, ''R'' meaning that it is running, and ''Z'' meaning that it is a zombie
    process, or a process that has already died), the total amount of time the CPU
    has spent on process since the process started, and finally the name of the command
    being running.


