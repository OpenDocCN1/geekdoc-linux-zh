  md: "# 7 Finding Files\n\nSometimes you will need to find files on the system that\
    \ match given criteria, such as name and file size. This chapter will show you\
    \ how to find a file when you know only part of the file name, and how to find\
    \ a file whose name matches a given pattern. You will also learn how to list files\
    \ and directories by their size and to find the locations of commands.\n\nNOTE:\
    \ When you want to find files in a directory whose contents match a particular\
    \ pattern, search through the files with `grep`-see Chapter 14 [Searching Text],\
    \ page 165. A method of searching for a given pattern in the contents of files\
    \ in different directories is given in Recipe 7.2.5 [Running Commands on the Files\
    \ You Find], page 93.\n\nSee Info `find.info`, `node`, for more information on\
    \ finding files.\n\n# 7.1 Finding All Files That Match a Pattern\n\nThe simplest\
    \ way to find files is with `locate`. Use it when you want to list all files on\
    \ the system whose file path name matches a particular pattern—for example, all\
    \ files with the text ‘audio’ somewhere in their full path name, or all files\
    \ ending with ‘ogg’. `locate` outputs a list of all files on the system that match\
    \ the pattern, giving their full path. When specifying a pattern, you can use\
    \ any of the file name extension characters (see Recipe 5.8 [Specifying Files\
    \ with Patterns], page 80).\n\n+   * To find all files on the system that have\
    \ the text ‘audio’ anywhere in their name, type:\n  `$ locate audio`\n* To find\
    \ all the files on the system whose file names end with the text ‘ogg’, type:\n\
    \  `$ locate *.ogg`\n* To find all hidden ‘.files’ on the system, type:\n  `$\
    \ locate /.`\n\nNOTE: `locate` searches are not sensitive.\nSometimes, a locate\
    \ search will generate a lot of output. Pipe the output to `less` to peruse it\
    \ (see Recipe 9.1 [Perusing Text], page 111).\n\n# 7.2 Finding Files in a Directory\
    \ Tree\n\nUse `find` to find specific files in a particular directory tree, specifying\
    \ the name of the directory tree to match, and —optionally—the action to perform\
    \ on the found files. (Unlike most other tools, you must specify the directory\
    \ tree argument before any other options.)\n\nYou can specify a number of search\
    \ criteria, and format the output in various ways; the following sections include\
    \ recipes for the most commonly used `find` commands, as well as a list of `find`'s\
    \ most popular options."
  merge: -1
  pgno: 112
- img_proc: true
  md: '# 7.2.1 Finding Files in a Directory Tree by Name


    Use find to find files in a directory tree by name. Give the name of the directory
    tree to search for, and use the ''name'' option followed by the name you want
    to find.


    +   To list all files on the system whose file name is ''top'', type:


    ```

    $ find / -name top

    ```


    This command will search all directories on the system to which you have access;
    if you don''t execute permission for a directory, find will report that permission
    is denied


    The ''-name'' option is case sensitive; use the similar ''-iname'' option to find
    name regardless of case.


    +   To list all files on the system whose file name is ''top'', regardless of
    case, type:


    ```

    $ find / -iname top

    ```


    This command will match any files whose name consisted of the letters ''top'',
    regardless of case—including ''Top'', ''top'', and ''TOP''.


    Use file expansions (see Recipe 5 [Specifying File Names with Patterns], page
    80) to find files whose names match a pattern. Give these file name patterns between
    single quotes.


    +   To list all files on the system whose begin with the characters ''top'', type:


    ```

    $ find / -name ''top*''

    ```


    +   To list all files whose begin with the three characters ''top'' followed by
    exactly three more characters, type:


    ```

    $ find / -name ''top???''

    ```


    +   To list all files whose begin with the three characters ''top'' followed by
    five or more characters, type:


    ```

    $ find /,-name ''top????*''

    ```


    +   To list all files in your home directory tree that end ''.txt'', regardless
    of case, type:


    ```

    $ find -iname ''*.txt''

    ```


    +   To list all files in ''/usr/share/'' directory tree with the text ''farm''
    somewhere in their name, type:


    ```

    $ find /usr/share -name ''*farm*''

    ```


    Use ''-regex'' in place of ''-name'' to search for files whose a regular expression,
    or a pattern describing a set of strings (see Recipe 14.2 [Regular Expressions—Matching
    Patterns]),


    +   To list all files in the current directory tree whose names have either the
    string ''net'' or ''comm'' anywhere in their file names, type:


    ```

    $ find -regex ''.*(net|comm).*''

    ```


    NOTE: The ''-regex'' option matches the whole path, relative to the directory
    tree you specify, and not just file names.'
