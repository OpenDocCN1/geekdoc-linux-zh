  md: '180 The Linux Cookbook: Tips and Techniques for Everyday Use


    NOTE: Once you make a PostScript file from text input, you can use any of the
    tools to format this new PostScript file, including rearranging and resizing its
    pages (see Chapter 20 [PostScript], page 235).


    # 15.2.1 Outputting Text in a Font


    To output text in a particular PostScript font, use enchant and give the name
    of the font you want to use as a quoted argument to the ''-f'' option.


    Specify both the font family and size in points: give the capitalized name of
    the font family (with hyphens to indent spaces between words) followed by the
    size in points. For example, ''Courier14'' outputs in Courier at 14 points, and
    ''Times-Roman12.2'' outputs in the Times Roman at 12.2 points. Some of the available
    font names are listed in the file /usr/share/encscript/afm/font.map; the enchant
    page describes how to use additional fonts that might be installed on your system.


    +   - To print the contents of the text file ''saved-mail'' on a PostScript printer,
    with set in the Helvetica font at 12 points:


    ```

    $ enchant -B f "Helvetica12" saved-mail RET

    ```


    +   - To make a PostScript file called ''saved-mail'' containing the contents
    of the text file ''saved-mail'', with text set in the Helvetica font at 12 points,


    ```

    $ enchant -B f "Helvetica12" -p saved-mail.ps saved-mail RET

    ```


    The ''-B'' option was used in the preceding examples to omit the output of a header
    on each page. When headers are used, they''re normally output in 10-point Courier
    Bold; to specify a different font for the text in the header, give its name as
    an argument to the ''-F'' option.


    +   - To print the contents of the text file ''saved-mail'' to a PostScript printer,
    with set in 10-point Times Roman and header set in 18-point Times Bold, type:


    ```

    $ enchant -f "Times-Roman10" -F "Times-Bold18" saved-mail RET

    ```


    +   - To make a PostScript file called ''saved-mail'' containing the contents
    of the text file ''saved-mail'', with text and headers both in 16-point Palatino
    Roman, type:


    ```

    $ enchant -f "Palatino-Roman16" -F "Palatino-Roman16" -p saved-mail.ps saved-mail
    RET

    ```


    # 15.2.2 Outputting Text as a Poster or Sign


    You can output any text directly to the printer (or to a PostScript file) by omitting
    the name of the input file: enchant will write the text on the standard input
    until you press Ctrl-D on a new line.


    This is especially useful for making a quick-and-dirty sign or poster—to do this,
    specify a large font for the text, such as Helvetica Bold at 72 points, and omit
    the display of default headers.


    +   - To print a sign in 72-point Helvetica Bold type to a PostScript printer,'
