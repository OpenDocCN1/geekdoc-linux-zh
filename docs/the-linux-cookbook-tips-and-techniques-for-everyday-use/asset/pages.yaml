  md: '# Chapter 25: Printing


    In this example, there are three jobs queued for the default printer—one by user
    groucho, for the file ''cigar.ps'', one by user harpo, for the file ''harp.ps'',
    and one by user chico who has printed a file called ''love.ps''.


    The job by user groucho is the active job; this is the job that is currently printing
    on the printer. The other jobs wait until it is finished printing, and then they
    print in order.


    As lpr, you can specify the name of a printer as an argument to the ''-P'' option.


    +   To view the spool queue for the printer bossomatic, type:


    ```

    $ lpq -P bossomatic RET

    ```


    To only list the jobs for a particular user, give the name of the user as an argument.


    +   To list the jobs for user harpo, type:


    ```

    $ lpq harpo RET

    ```


    NOTE: When there are no print jobs, lpq outputs the text ''no entries''.


    # 25.1.4 Cancelling a Print Job


    To cancel a print job and remove it from the spool queue, use lprm, the “line
    printer remove” tool. Give it an argument number of the print job to remove.


    +   To cancel print job 83:


    ```

    $ lprm 83 RET

    ```


    To cancel all of your print jobs in the spool queue, use a hyphen instead of the
    number of print job.


    +   To cancel all of your print jobs:


    ```

    $ lpr - RET

    ```


    > NOTE: If you try to cancel an active job—one that has already been spooled to
    the printer—don''t be alarmed if some pages still print; the printer probably
    has some of the job in its internal buffer. To stop the printing, take the printer
    offline, reset it, and then put it online again (usually, the printer will have
    buttons for these commands on its front control panel).


    # 25.2 More Recipes for Printing


    Another way of besides a print job is to print from within an application.


    Not all applications have print controls, but some of do—including Emacs and LyX
    (see Recipe 15.3 [LyX Document Processing], page 185). Their print commands essentially
    send the job to the printer via lpr. If you are working in such an application
    and want to print your work, using the built-in print control can be easier than
    having to go to a shell to run lpr.


    For example, to print the current document in the LyX document processing application,
    choose Print from the File menu; it creates the proper output for your printer
    and makes a print job containing this output (see 15.3 [LyX Document Processing],
    page 185).'
  merge: -1
  pgno: 296
