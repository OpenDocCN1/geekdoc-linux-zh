  md: '# Chapter 32: Other Internet Services


    # 32.2.1 Uploading a File


    Use the `put` command to upload a file; give the name of the file as an argument.
    `put` takes that file in the current directory of the local system, and puts a
    copy of it in the current directory of the remote system.


    +   - To put a copy of the file `thyme.rcp` from the current directory of the
    local system to the current directory of the remote system, type:


    ```

    ftp> put thyme.rcp RET

    ```


    The current directory of the `local system` is, by default, the directory where
    you ran the `ftp` command. To change directories on your local system, use `cd`;
    it works just like the `cd` command, but it changes the local directory.


    +   - To change to the parent directory of the current directory on the local
    system, type:


    ```

    ftp> cd .. RET

    Local directory now /home/james/demos

    ftp>

    ```


    In this example, the current directory is now `~/home/james/demos`.


    There are other important commands for downloading files—use `i` to specify that
    files are transferred as `binary`; normally, the transfer is set up for text files.
    When you want to transfer programs, archives, compressed files, or any other non-text
    file, set the transfer type to `i`.


    In recent years, most public systems have added a security feature forbidding
    the upload by anonymous users to anywhere but the `~/tmp` directory, or anywhere
    but the `~/incoming` or `~/pub/incoming` directories.


    The `mput` command works like `put`, but in reverse—specify wildcards. By default,
    `mput` asks you, for each file, whether to upload the file or not; to turn off
    this file prompting, `prompt` before giving the `mput` command. This command is
    a toggle—type `prompt` again to turn file prompting back on your session.


    # 32.2.2 Downloading a File


    The `get` command works like `put`, but in reverse—specify a file on the remote
    system, and `get` saves a copy to the current directory on the local system. Again,
    use `i` first when downloading non-text files (You can also download text files
    with `i`, so it is good practice to `always set` before you transfer files; most
    Linux systems are configured to set the type to `i` ''immediately upon connection).


    +   - To download the file `INDEX.gz` in the current directory on the remote system,
    saving it to your `~/tmp` directory, type:'
