  md: '# The Linux Cookbook: Tips and Techniques for Everyday Use


    Here’s the same “Hello, world” for LaTeX:

    ```latex

    \documentclass{article}

    \begin{document}

    Hello, world

    \end{document}

    ```


    Even though TeX is much simpler, LaTeX is generally easier to use for making structured
    documents. ‘Plain TeX, on the other hand, is better for more experimental layouts
    or specialized documents.


    The TeX and LaTeX markup languages are worth a book each, and providing an introduction
    to their use is well out of scope of this chapter. To learn how to write input,
    I suggest two excellent tutorials, Michael Doob’s A Introduction to TeX, and Tobias
    Octier’s No So Short Introduction to LaTeX—available on the WWW at the URLs listed
    above. These files are in the respective format they describe; in order to read
    them, you must process these files first, as described in the two recipes.


    Good LaTeX documentation in HTML format can be installed on many Linux systems
    using ‘/usr/share/texmf/doc/latex/latexe-html’; use the lynx browser to view it
    (see Recipe 5.9 [Browsing Files], page 81).


    Some other systems, such as LyX, SGMLtools, and Textinho (all described elsewhere
    in this chapter), write TeX or LaTeX output, too—so you can produce output without
    learning the TeX and LaTeX input forms. This book was written in Emacs with Textinho,
    and the types was later generated by TeX.


    NOTE: The Octier text consists of several separate LaTeX files in the ‘short’
    directory; download and save all of these files.


    # 15.4.5 TeX and LaTeX Document Templates


    WWW: http://dsl.com/comp/templates/


    A collection of sample templates for typesetting certain kinds of documents in
    TeX and LaTeX can be found at the URL listed above. These templates include for
    creating letters and correspondence, articles and term papers, envelopes and mailing
    labels², and fax cover sheets. If you’re interested in making typeset output with
    TeX and LaTeX, these templates are worth exploring.


    To write a document with a template, insert the contents of the template file
    into a new file that has a ‘.tex’ or ‘.ltx’ extension, and edit it. (Use your
    favorite text editor to do this.)


    To make sure you don’t accidentally overwrite the actual file, you can write-protect
    them (see Recipe 6.3 [Protecting a File], page 87):


    ```

    $ chmod a-w template-file-names RET

    ```


    In the templates themselves, the bracketed, uppercase text explains what kind
    of text belongs here: fill in these lines with your own text, and delete the lines
    you don’t need.


    > ² In addition, a modern LaTeX style for printing many different kinds of shipping
    and package labels is normally installed at ‘/usr/share/texmf/tex/latex/labels/.'
