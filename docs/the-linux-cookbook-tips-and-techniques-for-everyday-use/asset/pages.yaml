  md: '# 26 Cross-Platform Conversions


    Sometimes, it''s inevitable—through no choice of your own, you must deal with
    a disk from another operating system, or a file with data stored in a proprietary
    format from one of these systems.


    The recipes in this chapter are about converting data from other platforms—reading
    disks from DOS, Windows, and MacOS systems, and converting DOS text and Microsoft
    Word files.


    # 26.1 Using DOS and Windows Disks


    Debian: ''mtools''

    WWW: http://mtools.linux.lu/


    The mtools package provides a collection of tools to facilitate the manipulation
    of MS-DOS files. These tools allow you to use and manipulate MS-DOS (usually floppies,
    but Jaz and Zip drives are supported, too); they can handle the extensible to
    the MS-DOS format which are used by the different Microsoft operating systems,
    including Windows NT.


    The following recipes describe how to use the tools in this package to get directory
    listings of MS-DOS disks, copy files to and from, delete files on them, and even
    format them. They are similar in use and syntax to the equivalent MS-DOS commands.


    # 26.1.1 Listing the Contents of a DOS Disk


    Use mdir to get a directory listing of a DOS disk. Give as an argument “drive
    letter” of the disk to read, as used by DOS; for example, to specify the primary
    floppy drive, use ''A:'' as the drive letter, and ''B:'' to specify the secondary
    floppy drive.


    +   To get a directory listing of the DOS disk currently in the primary floppy
    drive, type:

    $ mdir a RET


    # 26.1.2 Copying Files to and from a DOS Disk


    Use mcopy to copy files to and from a DOS disk.


    To copy a file to a DOS disk, give as arguments the name of the source file to
    copy and the “drive letter” of the disk to copy it to.


    +   To copy the file ''readme.txt'' to the DOS in the primary floppy drive, type:

    $ mcopy readme.txt a: RET


    To copy a file from a DOS disk, give the “drive letter” of the disk to copy, followed
    by the filename to copy, and no other arguments; mcopy will copy the specified
    file to the current directory.


    +   To copy the file ‘resume.doc’ from the DOS in the secondary floppy drive to
    the current directory, type:

    $ mcopy b:resume.doc RET'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# 280 The Linux Cookbook: Tips and Techniques for Everyday Use


    To copy all files from a DOS disk, just give the "drive letter" without any file
    names.


    +   * To copy all of the files and directories from the DOS disk in the primary
    floppy disk to the current directory, type:


    ```

    $ mcopy a: RET

    ```


    # 26.1.3 Deleting Files on a DOS Disk


    Use mdel to delete a file on a DOS disk. Give as an argument the name of the file
    to delete preceded by the "drive letter" of the disk to delete.


    +   * To delete the file "resume.doc" from the DOS disk in the primary floppy
    drive, type:


    ```

    $ mdel a:resume.doc

    ```


    # 26.1.4 Formatting a DOS Disk


    To format a floppy disk for DOS, writing an empty MS-DOS filesystem to the disk
    in the process, use mformat. Give as an argument the "drive letter" of the disk
    to format. (Remember, when you format a disk, any existing information contained
    on the disk is lost).


    +   * To format the floppy disk in the primary floppy drive so that it can be
    used with MS-DOS-type:


    ```

    $ mformat a: RET

    ```


    > NOTE: If you want to use a floppy disk with your Linux system and don''t need
    DOS compatibility, dont using this MS-DOS format—the native Linux format is much
    more efficient (see Recipe 24.3.1 [Formatting a Floppy Disk], page 267). If you
    know how long a DOS format takes, you will be amazed how much faster the Linux
    format is, it will do so fast you''ll think it didn''t work!


    # 26.2 Using Macintosh Disks


    Debian: ''hfsutils''

    WWW: http://www.mars.org/home/rob/proj/hfs/


    Apple computers use a file system called the "Hierarchical File System," or HFS.
    The hfsutils package contains a set of tools to read and write disks in the HFS
    format.

    The following recipes describe the use of the individual tools in this package.


    # 26.2.1 Specifying the Macintosh Disk to Use


    To use a Macintosh disk with any of the ''hfsutils'' commands, you must first
    use mount to specify the location of the HFS filesystem. Give as an argument the
    name of the Linux file where the HFS filesystem exists; this virtually "mounts"
    the disk for use with the other ''hfsutils'' described in this section.


    The device file for the first floppy drive is ''/dev/fd0'', and for the second
    drive, ''/dev/fd1''. Any valid device name, such as a SCSI device or Zip disk,
    may be given.'
  merge: -1
  pgno: 303
