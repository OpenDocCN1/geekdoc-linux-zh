  md: "# Chapter 24: Disk Storage\n\nLike the /floppy directory, the use of the '/cdrom'\
    \ directory is a standard practice and convenient, but not necessary—you can mount\
    \ disks in whatever directory you like. (You could even, for example, mount disks\
    \ from the CD-ROM drive to /floppy and mount floppy disks to /cdrom, but why would\
    \ anyone do that!)\n\nTo mount a CD-ROM to a specific directory, use mount and\
    \ give as argument the name of the device file in /dev corresponding to the CD-ROM\
    \ drive, and the name of the directory to mount. This directory must already exist\
    \ on the filesystem, and must be empty. If it doesn't, use mkdir to create it\
    \ first (see Recipe 5.1.2 [Making a Directory], 69).\n\nMost Linux systems are\
    \ up so that the device file of the first CD-ROM drive is /dev/cdrom, the name\
    \ of the device file may be different, especially if you have a SCSI CD-ROM drive.\n\
    \n+   - To mount the disc in the CD-ROM drive to the /usr/local/share/clipart\
    \ directory, type:\n  $ mount /dev/cdrom /usr/local/share/clipart\n- The contents\
    \ of the disc in the CD-ROM drive will then be available in the /usr/local/share/clipart\
    \ directory tree, and you can then use the files and directories on the CD-ROM\
    \ as you would any others. For example:\n- To peruse a tree graph of the CD-ROM's\
    \ contents, type:\n  $ tree /usr/local/share/clipart | less\n- To change to the\
    \ root directory of the CD-ROM, type:\n  $ cd /usr/local/share/clipart\n- To list\
    \ the contents of the root directory of the CD-ROM, type:\n  $ ls /usr/local/share/clipart\n\
    \n# 24.4.2 Unmounting a CD-ROM\n\nUse mount to unmount a CD-ROM; give as an argument\
    \ the name of the directory it's mounted.\n\n+   - To unmount the disc in the\
    \ CD-ROM drive mounted on /cdrom, type:\n  $ umount /cdrom\n\n> NOTE: As with\
    \ unmounting any kind of filesystem, make sure that none of the files on the disc\
    \ are in use, or you won't be able to unmount it. For example, if the current\
    \ working directory in a shell is somewhere inside the /cdrom/ directory tree,\
    \ you won't be able to unmount the CD-ROM until you change to a different directory."
