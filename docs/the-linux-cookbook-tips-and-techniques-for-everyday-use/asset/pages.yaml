  md: '# 30 Email


    The primary means of sending plain-text messages (or binaries in attachment files)
    between users over computer networks and systems on the Internet is called electronic
    mail, or email (and more often than not these days, just “mail”).


    The number of email applications (called mail user agents, or MUAs) available
    for Linux is so large, and you could spend hours exploring the details of all
    them. Instead of guiding you toward this route, this chapter attempts to do three
    things: give a brief intro to using the default mail agent; give an overview of
    well-supported mail agents, with pointers on where to go for more info; and show
    how you can use other tools on the system to manipulate your email.


    The mail tool is the default mail agent on Debian and most other Linux systems.
    It comes without many bells and whistles that are standard with most MUAs, and
    any user sends and receives email more than occasionally will certainly want to
    learn a more advanced system (see Recipe 30.6 [Picking the Right Mail Application],
    325).


    However, mail is available on almost all Unix-based systems, and it works in a
    pinch—by learning to use it you can always send and receive email on any Linux-
    or Unix-based system you encounter.


    NOTE: On some Unix-based systems, the name of the tool isHelix instead of mail.


    # 30.1 Sending Mail


    To send an email message with mail, give the email addresses to which you are
    sending as arguments, and then type the message proper in the lines that follow;
    type C-d on a line by itself to signify the end of the message body, and send
    the mail.


    +   - To send an email message to lisa@example.com, type:

    $ lisa@example.com (RET)

    Subject: Hello (RET)

    Hi there, long time no talk! I''m just learning how to use (RET)

    Linux and thought I''d show you how easy it is to send email! (RET)

    C-d

    Cc: (RET)


    The text you type on the ‘Subject:'' line is displayed as the subject of your
    email, and the lines of text you type after that is the body text of your email.
    Type C-d on a alone line to end the message. Then, mail prompts for ‘Cc:'' addresses:
    “carbon copy” of the email message is sent to any addresses you give here, if
    (just type for none, and separate multiple addresses with commas),


    When you type, mail just reads the standard input like any other command-line
    tool, so there is little editing capability in this basic email service—use C-u
    to erase the current line, and C-c C-c (that is, C-c twice) to cancel your input
    and abort the mail altogether.


    That''s it! No bells, no whistles—but no time-wasting excess, either.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# 30.1.1 Mailing a User on the Same System


    To send an email message to another user on the same system, give their username
    on the system instead of an email address (technically, you are giving the email
    address, since email addresses take the form of username@hostname; when hostname
    is omitted, the localhost is assumed).


    +   - To send an email to user mrs on your local system, type:


    ```

    $ mail mrs RET

    Subject: are you going to the party tonight? RET

    C-d

    Cc: RET

    Null message body; hope that''s ok

    $

    ```


    This command sends an email message to the user mrs on the local system. The email
    message itself is empty, but the subject is a short note asking whether user mrs
    will be attending a party.


    **NOTE:** Besides being good for sending mail to users that you might share your
    system with, mail is useful for sending yourself, as a way to give yourself a
    reminder at a terminal (see Recipe 27.6.1 [Sending Yourself Email Reminders],
    page 294).


    # 30.1.2 Mailing a File or the Output of a Command


    The mail tool is also useful for mailing the contents of a text file or the text
    output of a command. To do this, give the email addresses you want to send as
    arguments to mail, and use the standard redirection operators to redirect the
    text to use as the message body (see Recipe 3.2 [Redirecting Input and Output],
    page 39).


    +   - To mail the contents of the text file ''trades'' to the email address terrapin@example.com,
    type:


    ```

    $ terrapin@example.com < trades RET

    ```


    # 30.1.3 Mailing the Contents of a URL


    A variation on the previous recipe is to use mail and shell redirection to send
    the output of some command via email. You can, for example, send the contents
    of a URL as an annotated text file by redirecting the output of the lynx Web browser
    (see Recipe 31.3 [Reading Text from Web], page 330).


    +   - To mail the text of the URL http://etext.org/ as annotated text to the email
    address droneon@example.com, type:


    ```

    $ droneon@example.com < lynx -dump -number-links

    http://etext.org/ * RET

    ```'
  merge: -1
  pgno: 339
- img_proc: true
  md: "# Chapter 30: Email\n\n# 30.1.4 Special Mail Composition Keystrokes\n\nThe\
    \ following table lists the special keystrokes that work when composing a mail\
    \ message, and describes their functions.\n\n| KEYSTROKE | DESCRIPTION |\n| ---\
    \ | --- |\n| C-c C-c | Abort the current message and exit mail. |\n| RET or C-d\
    \ | On a blank line, either of these commands sends the message and then exits\
    \ mail. |\n| C-u | Erase the current line and move the cursor to the beginning\
    \ of the line. |\n\nThere are also a few special commands that you use while composing\
    \ the body of the message. They're known as \"tilde escapes\" because you specify\
    \ them by typing a tilde character \"~-\".\n\nThe following table lists some of\
    \ these commands and describes their functions.\n\n| COMMAND | DESCRIPTION |\n\
    | --- | --- |\n| ~!command | Run command in a shell. |\n| ~-badaddress | Send\
    \ a blind copy to the usernames or email addresses given. |\n| ~-d | Copy the\
    \ file \"dead.letter\" from your home directory into the message. |\n| ~e | Edit\
    \ the message in the default text editor program. (When you exit the text editor,\
    \ you are returned to mail.) |\n| ~number | Insert copies of the specified received\
    \ messages into the message body. Messages are specified by number or a range\
    \ (for example, \"2-4\" inserts messages through four inclusive); if no number\
    \ is given, the current received message is inserted. |\n| ~F | Same as '~f',\
    \ but reads in the messages with full headers. |\n| ~rfile | Insert a copy of\
    \ the file into the message. |\n| ~wife | Write a copy of the body text into the\
    \ file file. |\n\n+   These commands should be typed on a line by itself.\n* To\
    \ insert a copy of the current mail message into the body of the message you are\
    \ writing, and then open the message in the default text editor, type:\n  ~f RET\n\
    \  ~e RET\n\n# 30.2 Receiving Mail\n\nOn Linux-systems, the INBOX is a text file\
    \ on the system where your incoming mail is written to. Its location is always\
    \ given by $MAIL, a special variable (see Recipe 3.6.1 (Changing the Shell Prompt),\
    \ page 46).\n\n+   * To output the location of your INBOX, type:"
