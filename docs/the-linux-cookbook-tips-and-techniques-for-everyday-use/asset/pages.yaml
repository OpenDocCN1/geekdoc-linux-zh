  md: '# C.2 Applying Copyleft to Your Work


    The underlying idea of free software is to create a society where people are free,
    where we have freedom, and where we can share our work with others; but software
    is just one part of the digital information we work with and share in our lives.


    The Design Science License is a generalized "copyleft" license that can be applied
    to any kind of work that is recognized by copyright law. You can use it to copyleft
    (make "Open Source") any kind of work, not just a computer software program.


    In order to copyleft a work, it must exist in machine-readable form (where identical
    copies can be made without harm to the original), and you must be its copyleft
    holder. If you are the author of a work, then you automatically hold its copyright;
    you don''t need to register your work with the copyright office (http://www.loc.gov/copyright/faq.html).


    To apply the DSL to your work, do the following:


    +   Using the following text for the work''s copyright notice, substituting Year
    and Author

    Copyright © Year Name; this information may be copied, distributed or modified
    under certain terms and conditions, but it comes WITHOUT ANY WARRANTY; see the
    Design Science License for more details.


    +   Include the source data of the work (see the license text itself for the precise
    definition) with the distribution, and make it available through postal mail for
    a cost not greater than storage media and postage.


    In many cases, the source data and the object form of a work will be the same—this
    is the case for software programs written in the Perl language, for example. Often,
    the source data will differ from a given object form. For example, the object
    form is an MP3 file made from a WAV format sample of an analog source, the WAV
    is the source data. For a cropped and manipulated JPEG file of a photograph obtained
    from a Kodak PhotoCD, the original PhotoCD file is the source data.


    By copylefting your work in this manner, you can make it available for the benefit
    of everyone—all copies and modifications of your work remain as freely as the
    original—while attribution and artistic integrity is guaranteed.


    If you are interested in applying copyleft to your works, you might be interested
    in the following sites:


    +   Copyleft and the Information Renaissance (http://dsl.org/copyleft/), a general
    copyleft primer and collection of resources, written and maintained by the author.


    +   Free Music Philosophy (http://ram.org/ramblings/philosophy/fmp.html), on the
    free music movement, by Dr. Ram Samudrala.


    +   What is Copyleft? (http://www.gnu.org/copyleft/), an explanation of copyleft
    as it applies to computer software programs, the GNU Project.'
