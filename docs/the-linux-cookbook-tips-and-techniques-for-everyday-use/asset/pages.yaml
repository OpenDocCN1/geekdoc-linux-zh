    was rumored.com.


    # 32.4.6 Listing the Owner of a Domain Name


    An Internet domain name''s domain record contains contact information for the
    organization or individual that has registered that domain. Use the whois command
    to view the domain records for the common .com, .org, .net, and .edu top-level
    domains.


    With only a domain name as an argument, whois outputs the name of the “Whois Server”
    that has that particular domain record. To output the domain record, specify the
    Whois Server to use as an argument to the ''-h'' option.


    +   To output the name of the Whois Server for linart.net, type:


    ```

    $ whois linart.net RET

    ```


    +   To view the domain record for linart.net, using the whois.networksolutions.com
    Whois Server type:


    ```

    $ -h whois.networksolutions.com linart.net RET

    ```


    NOTE: This command also outputs the names of the nameservers that handle the given
    domain—this is useful to get an idea of where a particular Web site is hosted.


