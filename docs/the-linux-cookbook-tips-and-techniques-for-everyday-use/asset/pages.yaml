    * To list all the X fonts on the system whose name contain the 'rea', type:\n\
    \  $ xfonts 'rea-*'\n* To list all bold X fonts on the system, type:\n  $ xfonts\
    \ 'bold-*'\n\nNOTE: This is not a way to display the characters in a font; for\
    \ that, use xfd, described in. Furthermore, to browse through available X fonts,\
    \ you may want to use xfontsel, as in the previous recipe.\n\n# 16.1.3 Displaying\
    \ the Characters in an X Font\n\nUse the xfd tool ('X font display') to display\
    \ all of the characters in a given X font. Give the X name you want to display\
    \ in quotes as an argument to the '-fn' option.\n\n+   * To display the characters\
    \ in a medium Courier X font, type:\n  $ xfd -fn '--courier-medium-r-normal--*--100*-*-*-*-iso8859-1'\n\
    \n# 16.1.4 Resizing the Xterm Font\n\nSee Recipe 4.2.3 [Specifying Window Font],\
    \ page 56 for how to specify the font to use in an xterm window. The terminal\
    \ is usually used to run a shell inside X, and many people like to specify which\
    \ font is used for this window.\n\nTo resize the current font when the xterm is\
    \ running, press and hold CTRL and right-click anywhere in the xterm window. A\
    \ menu will appear that gives you the size options, from unreadable and Tiny to\
    \ Huge. To resize the font to original size, choose Default.\n\n# 16.2 Console\
    \ Fonts\n\nConsole fonts are screen fonts for displaying text on the Linux console\
    \ (and not in the X Window System).\n\nConsole fonts are stored in the /usr/share/consolefonts/\
    \ directory as compressed files; to install new console fonts, have the system\
    \ administrator make a /usr/local/share/consolefonts/ directory and put the fonts\
    \ in there.\n\nThese recipes show how to set the console font, and how to display\
    \ a table containing all of the characters in the current font."
  merge: -1
  pgno: 224
- img_proc: true
  md: '# 16.2.1 Setting the Console Font


    Use consolechars to set the current console font; give the base file name of a
    console font as an argument to the ‘-f’ option.


    +   To set the console font to the scrawl_w font, type:

    ```consolechars -f scrawl_w```


    Some fonts contain more than one height (or size) of the font. If a font contains
    more one encoding for different heights, give the height to use as an argument
    to the ‘-H’ option. If you try to do it without the option anyway, consolechars
    will output a list of available sizes.


    Common console font heights include 8 (for 8x8 fonts), 14 (for 8x14 fonts), and
    16 (for 8x16 fonts).


    +   To set the console font to the 8x8 size sc font, type:

    ```consolechars -H 8 -f sc```


    # 16.2.2 Displaying the Characters in a Console Font


    Use showfont to display all of the characters in the current console font.


    +   To list all of the characters in the current console font, type:

    ```showfont```


    # 16.3 Text Fonts


    Text fonts are created from the arrangement of ASCII characters on the screen;
    they are often seen in Usenet articles and email messages, included as decorative
    or title elements in text files, and used for printing simpel banners or posters
    on a printer.


    The making of “fonts” (and even pictures) from the arrangement of ASCII characters
    is known as ascii art. The following recipes describe methods of outputting text
    in this kind of fonts.


    # 16.3.1 Horizontal Text Fonts


    The figlet filter outputs text in a given text font. Give the text to output as
    an argument, quoting containing metacharacters (see Recipe 3.1.1 [Passing Special
    Characters to Commands], page 36).


    +   To output the text ‘news alert’ in the default figlet font, type:

    ```figlet news alert```


    This command outputs the following:


    ```

    |  _  _  _  _  _  _  _  _  _  _  _  _  |

    | /\ /\ /\ /\ /\ /\ /\ /\ /\ /\ /\ /\|

    | |  |  |  |  |  |  |  |  |  |  |  | |

    |\_/ /_/ /_/ /_/ /_/ /_/ /_/ /_/ /_/ /_/ /_/|

    ```


    Fonts for figlet are kept in the /usr/lib/figlet/ directory; the ‘-f’ option followed
    by the base name of the font file (without the path or extension) to use that
    font.'
  merge: -1
  pgno: 225
- img_proc: true
  md: "# Chapter 16: Fonts\n\nTo output the contents of a text file with a figlet\
    \ font, use cat to output the contents of a file and pipe the output to figlet.\n\
    \n+   - To output the text of the file 'poster' in the figlet 'bubble' font, type:\n\
    \  $ cat poster | figlet -f bubble RET\n\nNOTE: The 'bubble' font is installed\
    \ at '/usr/lib/figlet/bubble.flf'.\n\n# 16.3.2 Making a Text Banner\n\nThe easiest\
    \ way to print a long, vertical banner of text on a Linux system is with the old\
    \ UNIX tool.\n\nQuote a text message as an argument, and banner sends a \"banner\"\
    \ of the message itself is output in a \"font\" composed of ASCII text characters,\
    \ similar to those used by figlet, except that the message is output vertically\
    \ for printing, and you can't change the font. To send output of banner to the\
    \ printer, pipe it to lpr.\n\n+   - To make a banner saying 'Happy Birthday Susan',\
    \ type:\n  $ banner 'Happy Birthday Susan' RET\n- To make a banner saying 'Happy\
    \ Birthday Susan' to the default printer, type:\n  $ banner 'Happy Birthday Susan'\
    \ | lpr RET\n\nUnfortunately, the breadth of characters that banner understands\
    \ is a bit limited—the following characters can't be used in a banner message:\n\
    \n```\n< > \\ ^ ~ { } !\n```\n\nTo make a banner of the contents of a text file,\
    \ send its contents to banner by redirecting standard input (see Recipe 3.2.1\
    \ [Redirecting Input to a File], page 39).\n\nTo make a banner of the contents\
    \ of the file '/etc/hostname', type:\n  $ banner < /etc/hostname RET\n\nThe default\
    \ width of a banner is 132 columns; you can specify a different width by specifying\
    \ the width to use as an argument to the '-w' option. If you give the '-w' option\
    \ without a number, banner outputs at 80 columns.\n\n+   - To make a banner containing\
    \ the text 'Happy Birthday Susan' at a width of 23 text columns, type:\n  $ banner\
    \ -w 23 'Happy Birthday Susan' RET\n- To make a banner containing the text 'Happy\
    \ Birthday Susan' at a width of 80 text columns, type:\n  $ banner -w 'Happy Birthday\
    \ Susan' RET\n\nNOTE: A method of making a horizontal text banner with figlet\
    \ is described in Recipe 15.2.5 [Outputting Text in Landscape Orientation], page\
    \ 184."
  merge: -1
