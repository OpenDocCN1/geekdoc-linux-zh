    # ## 23.3.1 Making an MP3 File


    WWW: http://www.sulaco.org/mp3/


    The process of making an MP3 file from a raw audio or WAV audio file is called
    *encoding* an MP3 file; programs that do this are MP3 encoders. This is not so
    much a recording process as it is a conversion process: existing audio is converted
    to an MP3 file.(To make MP3 files from your own recordings, making the recording
    as a CD-quality WAV file, and convert that.)


    Unfortunately, the algorithm for encoding MP3 is patented, and all software that
    uses it must pay a license fee—including free software. This restriction makes
    it difficult for people to create a free MP3 encoder, and it is the reason why
    some free software and open source groups advocate the development of a high-quality
    compressed audio format to replace MP3.


    A workaround is presented in the form of LAME (''Lame Ain''t an MP3 Encoder'').
    LAME isn''t an MP3 encoder, but it is a free software patch (see Recipe 8.4.3
    [Patching a File with a Difference Report], page 102) designed to work with the
    sample source code distributed by the patent holders of the MP3 encoding process.


    This means that you can both separate and combine to get a working MP3 encoder
    called *notame*, the fastest (encoding MP3s is a slow process) encoder currently
    available for Linux. When you visit the LAME Project at http://www.sulaco.org/mp3/,
    you will find a link to download a pre-assembled notame binary from a site in
    Australia, where the patent laws do not apply.


    The *notame* encoder takes two arguments: the name of the input file and the name
    of the output file.


    +   * To encode an MP3 from a WAV file called ''summer-wind.wav'', type:


    ```

    $ notame summer-wind.wav summer-wind.mp3 RET

    ```


    It usually takes some time to encode an MP3 file; when *notame* is encoding a
    file, it continually outputs the current percentage of completion.


    NOTE: Scripts on the download site show how to encode multiple WAV files and how
    to decode of all the tracks on an audio CD.


    > 1 Ogg Vorbis is one such format; see http://www.vorbis.com/.'
