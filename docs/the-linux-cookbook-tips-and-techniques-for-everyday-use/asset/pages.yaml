    # 15.5 Writing Documents with SGMLtools


    Debian: ''sgml-tools''

    WWW: http://www.sgmltools.org/


    With SGMLtools package, you can write documents and generate output in many different
    kinds of forms including HTML, plain text, PDF, and PostScript—all from the same
    plain text input file.


    "Standard Generalized Markup Language” is not an actual format, but a specification
    for writing markup languages; the markup language “formats” are themselves DTDs
    (“Document Type Definition”). When you write a document in an SGML DTD, you write
    input as a plain text file with markup tags.


    The manuscript template requires that your system uses the LaTeX style file called
    manuscript.sty: most TeX distributions have this installed at ''/usr/share/texmf/tex/latex/misc/manuscript.sty''.'
