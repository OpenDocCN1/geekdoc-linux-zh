  md: 'Other tools that are good for stream editing include the AWK and Perl programming
    languages; to learn more about using these powerful languages, I recommend the
    following books:


    +   - The GNU Awk User''s Guide (http://www.gnu.org/manual/gawk-3.0.3/gawk.html)


    +   - Picking Up Perl (http://www.ebb.org/PickingUpPerl/)


    # 10.6 Concatenating Text


    The cat tool gets its name because it concatenates all of the text given to it,
    outputting the result to the standard output. It is useful for concatenating files
    of text together.


    For example, suppose you have two files, ''early'' and ''later''. The file ''early''
    contains this text:


    This Side of Paradise

    The Beautiful and Damned


    And the file ''later'' contains this text:


    The Great Gatsby

    Tender is the Night

    The Last Tycoon


    +   - To concatenate these files into a new file, ''novels'', type:


    ```

    $ cat early > novels

    ```


    This command redirects the standard output to a new file, ''novels'', which would
    contain the following text:


    This Side of Paradise

    The Beautiful and Damned

    The Great Gatsby

    Tender is the Night

    The Last Tycoon


    The files ''early'' and ''later'' are not altered.


    Had you also typed cat early > novels instead, the files would be concatenated
    in reversed order instead, beginning with ''later''; so the file ''novels'' would
    contain the following:


    The Great Gatsby

    Tender is the Night

    The Last Tycoon

    This Side of Paradise

    The Beautiful and Damned


    The following sections give other ways to concatenate files that are not text,
    but its most popular usage is with text files. Another way to concatenate files
    of text in an automated way is to use file inclusion — see Recipe 10.7 [Including
    Text Files], page 132.


    A similar tool, zcat, reads the contents of compressed files.'
  merge: -1
