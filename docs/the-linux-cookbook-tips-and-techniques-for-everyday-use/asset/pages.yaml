  md: "# 26.2.5 Formatting a Macintosh Disk\n\nTo format a disk for the Mac, writing\
    \ an empty HFS filesystem to the disk, use hformat. Give as an argument the name\
    \ of the Linux device file where the disk is at: example, the device file for\
    \ the first floppy drive is `/dev/fd0`, and the second drive is `/dev/fd1`\n\n\
    +   To format the disk in the first floppy with a Macintosh HFS filesystem:\n\
    \  - `hformat /dev/fd0`\n  If the disk has a partition on it, this command won't\
    \ work; use the '-f' option to force the format, erasing any existing partition\
    \ and the disk contains.\n  Give a label for the drive as a quoted argument to\
    \ the '-l' option. The label name can't contain a colon character (`'::`).\n\n\
    +   To format the disk in the first floppy with a Mac HFS filesystem, overwriting\
    \ any existing Mac filesystem:\n  - `hformat -f /dev/fd0`\n  - To format the disk\
    \ in the second floppy with a Mac HFS filesystem, giving it a volume label of\
    \ 'Work Disk', type:\n  - `hformat -l 'Work Disk' /dev/fd1`\n\nWhen a disk has\
    \ partitions, giving the number of the partition to format as an additional argument.\
    \ To format the entire medium, give '0' as the partition to use.\n\n+   To format\
    \ the second partition of the SCSI disk at `/dev/sd2` with a Mac HFS filesystem,\
    \ type:\n  - `hformat /dev/sd2 2`\n\n+   To format the entire SCSI disk at `/dev/sd2`\
    \ with a Mac HFS filesystem, overwriting any existing Mac filesystem and giving\
    \ a label of 'Joe's Work Disk', type:\n  - `hformat -f -1 \"Joe's Work Disk\"\
    \ /dev/sd2 0`\n\n# 26.3 Converting Text Files between DOS and Linux\n\nDebian:\
    \ `sysutils`\nWWW: `http://web.singnet.com/~clsheng`\n\nIn all versions of DOS\
    \ (and all subsequent versions of Microsoft Windows), text files are normally\
    \ written with both a linefeed character and a newline, both \"control\" characters,\
    \ to signify the end of each line. In Linux and other unices, text files have\
    \ only the newline character.\n\nIn either of these operating systems, text files\
    \ originated from the other may display irregularly—in DOS and Windows, the lines\
    \ of a Linux text file may appear to run together; in Linux, a DOS or Windows\
    \ text file may have 'M' newline characters at the end of each line.\n\nTo convert\
    \ a text file from DOS to Linux, removing the 'M' newline characters in the file,\
    \ use `fromdos`. It converts the file you give as an argument, removing the newline\
    \ characters from the ends of all its lines.\n\nTo convert a text file from Linux\
    \ to the convention used by DOS and Windows, todos adds newline characters to\
    \ the ends of all lines in the file you give as an argument."
  merge: -1
  pgno: 305
- img_proc: true
  md: "# Chapter 26: Cross-Platform Conversions\n\n+   - To remove the newline characters\
    \ from the text file 'autoexec.bat', type:\n  $ fromdos autoexec.bat RET\n- To\
    \ add newline characters to all of the text files with a '.tex' extension in the\
    \ current directory, type:\n  $ todos *.tex RET\n\nNOTE: Both commands write directly\
    \ to the files you specify. To make a backup of the original file, use the '-b'\
    \ option; before the conversion, this writes a copy of each specified file with\
    \ a '.bak' file extension.\n\n# 26.4 Converting Microsoft Word Files\n\nDebian:\
    \ 'word2x'\nWWW: http://word2x.alcom.co.uk/\n\nUse word2x to convert Word 6 files\
    \ to a format you can read. It can convert files to two different formats: LaTeX\
    \ and plain text.\n\nConvert to LaTeX when the layout of the original document,\
    \ including its formatting and font characteristics, is important. When you just\
    \ need the complete text of the document, convert it to plain text. word2x can\
    \ send its output to the standard output, so the later conversion is useful for\
    \ adding to a pipeline.\n\nWord files usually have a '.doc' or '.DOC' extension,\
    \ which you don't have to specify—example, if the Word file you want to convert\
    \ is called 'resume.doc', you can simply give 'resume' as the source file.(But\
    \ if there exists another file named 'resume' in the same directory, this won't\
    \ work).\n\nIf you don't specify an output file, word2x writes its output to a\
    \ file with the same base name and an appropriate extension for the output format.\
    \ This is useful for converting a lot of Word files in the same directory—specifying\
