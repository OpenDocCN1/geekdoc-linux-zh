  md: '# 24 Disk Storage


    All files and directories on a Linux-based system are stored on a Linux filesystem,
    which is a disk device (such as a hard drive) that is formatted to store a directory
    tree (see Chapter 5 Files and Directories), page 65.


    There are two kinds of disk storage on a Linux system: fixed and removable. Fixed
    storage refers to a disk that is firmly attached to the computer system, and is
    not intended for casual removal (except when upgrading). Your hard drive (sometimes
    called “hard disk”), used to store the operating system, application software,
    and user data, is the prime example of a fixed disk.


    The second kind of disk storage is removable storage, disks that are intended
    to be removed for archiving or transfer to another system. Examples of removable
    storage are floppy disk (“diskette”) and CD-ROM drives, where you typically remove
    the storage media from its drive when you’re using it.


    On Linux systems, disks are used by mounting them to a directory, which makes
    the directory tree available at that directory mount point. Points can be mounted
    on any device, but any divisions between disks are transparent—a system which
    has, from the root filesystem mounted on ‘/’, separate physical disks for the
    ‘/home’, ‘/usr’, and ‘/usr/local’ directory trees will look and feel no different
    from the system that only has one physical disk.


    System administrators often mount high-capacity drives on directory trees that
    contain a lot of data (such as a ‘/home’ directory tree on a system with a lot
    of users), and for purposes of fault tolerance, administrators use several physical
    hard disks on one system—if there is a disk failure, only the data in that disk
    is lost.


    This chapter describes tools and techniques for manipulating disks and storage
    media.


    # 24.1 Listing a Disk’s Free Space


    To see how much free space is left on a disk, use df. Without any options, df
    outputs a list of all mounted filesystems. Six columns are output, displaying
    information about each disk: the name of its device file in ‘dev’; the number
    of 1024-byte blocks the system uses; the number of blocks in use; the number of
    blocks available; the percent of the device used; and the name of the directory
    tree the device is mounted on.


    +   * To see how much free space is left on the system’s disks,


    ```

    $ df (RET)

    Filesystem     1024-blocks Used Available Capacity Mounted on

    /dev/hda1     195167 43405 141684 23% /

    /dev/hda2     2783807 688916 1950949 26% /usr

    /dev/hdb1     2039599 1676562 258472 87% /home/webb

    $

    ```


    This example shows that three filesystems are mounted on the system—the filesystem
    mounted on ‘/’ is at 23 percent capacity, the filesystem mounted on ‘/usr’ is
    at 26 percent capacity, and the filesystem mounted on ‘/home/webb’, a home directory,
    is at 87 percent capacity.'
  merge: -1
  pgno: 288
