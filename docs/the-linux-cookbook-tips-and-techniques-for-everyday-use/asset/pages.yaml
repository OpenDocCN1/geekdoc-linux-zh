  md: '# Chapter 19: Importing Images


    # 19.3.2 Removing PhotoCD Haze


    Debian: ''gimp''

    WWW: http://www.gimp.org/


    Extracted PhotoCD images are known to sometimes have a kind of “green haze” over
    them; to remove it, open the image in the GIMP and adjust the color levels with
    the Auto Levels function. This technique, adapted from a tip for using PhotoCD
    by Philip Greenspun (http://philip.greenspun.com/), works well for improving any
    scanned or imported image.


    +   - To remove the “green haze” from a PhotoCD image, do the following:

    - First, open the extracted image in the GIMP (see Recipe 18.3 [Editing Images
    with the GIMP], page 225).

    - Then, click through the Image menu to the Colors submenu and then to the Levels
    submenu, and choose Auto Levels.

    - Click OK in the Levels window to accept the changes.'
