    # 15.4 Typesetting with TeX and Friends


    +   - Debian: ''tetex-base''

    - Debian: ''tetex-bin''

    - Debian: ''tetex-doc''

    - Debian: ''tetex-extra''

    - Debian: ''tetex-lib''

    - WWW: http://www.tug.org/TeXX/


    The most capable typesetting tool for use on Linux-based systems is the TeX typesetting
    system and related software. It is the premier computer typesetting system that
    surpasses or rivals all other systems to date. The advanced line and paragraph
    breaking, hyphenation, kerning, and other font characteristic policies and algorithms
    it can perform, and the level of precision at which it can do, have yet to be
    matched in word processors.


    The TeX system itself—not a word processor or single program, but a large collection
    of files and data—is packaged in distributions; TeX is the TeX distribution designed
    for Linux.


    TeX input documents are text files written in the TeX formatting language, which
    the TeX tools can process and write to output files for printing or viewing. This
    approach has great benefits for the writer: the plain text input can be written
    and exchanged between many different computer systems regardless of operating
    system or editing software, and these input do not become obsolete or unusable
    with new versions of the TeX software.


    Donald Knuth, the world''s foremost authority on algorithms, wrote TeX in 1984
    as a way to typeset his books (http://www-cs-faculty.stanford.edu/knuth/tacopt.html),
    because he wasn''t satisfied with the quality of available systems. Since its
    first release, many extensions to the TeX formatting language have been made—the
    most notable being Leslie Lamport''s LaTeX, which is a collection of sophisticated
    macros in the TeX formatting language, designed to facilitate the typesetting
    of structured documents. (LaTeX) gets more day-to-day use than the plain TeX format,
    but in my experience, both systems are useful for different kinds of documents.)'
