  md: '# The Linux Cookbook


    # PUT YOUR LINUX TOOLS TO WORK


    ![](img/3658df520e459cc83b744521428473cf_429_0.png)


    In The Linux Cookbook, you''ll learn the best ways to use all the free software
    that comes with Linux to accomplish everyday tasks. The step-by-step recipes make
    it easy to use Linux to get things done, including how to:


    “... a good guide for beginners who want to learn the standard commands available
    on all systems.” — Debian


    +   - Get online, manage email, and chat

    - Produce professional-quality typeset documents and create posters and large
    banners

    - Browse the Web, archive Web sites, and write HTML

    - Send and receive faxes, prepare files for printing, and read and write data
    across platforms

    - Use spelling and grammar checkers, word counters, and powerful dictionary tools

    - Scan and convert images, extract PhotoCD graphics, and capture screen shots


    Both a complete reference and a hands-on guide, this book will become an indispensable
    companion as you master Linux and open source software.


    # ABOUT THE AUTHOR


    Michael Stutz was one of the first journalists to write about Linux and the free
    software movement in the mainstream press. A Linux user since the early 1990s,
    he has contributed to the GNU Project and the Linux Documentation Project. He
    is the architect of the Design Science License (DSL), a generalized “copyleft”
    license designed to fit any work (http://dsl.org).


