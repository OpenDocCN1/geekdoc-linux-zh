  md: '# Chapter 14: Searching Text


    Encloses a character set, and matches any of the set - for example, [abc] matches
    either ''a'', ''b'', or ''c''. In addition, the hyphen (''-'') and caret (''^'')
    characters have special meanings when used inside brackets:


    The hyphen specifies a range of characters, ordered according to their ASCII value
    (see Recipe 9.4 [Viewing a Character Chart], page 117). For example, [0-9] is
    synonymous with [0123456789]; [A-Za-z] matches uppercase or lowercase letter.
    To include a literal ''-'' in a list, specify it as the has character in a list:
    [0-9] matches either a single digit character or a ''-''


    As the first character of a list, the caret means that any character except those
    in the list should be matched. [a] matches any character except ''a'', and [0-9]
    matches any character except a numeric digit.


    Matches the beginning of the line. So ^ matches ''a'' only when it is the first
    character on a line.


    Matches the end of the line. So $ matches ''a'' only when it is the last character
    on a line.


    Use \ before a metacharacter when you want to specify that literal. So \$ matches
    a dollar sign character (''$''), and \ matches a backslash character (''\'').


    In addition, use \ to build new metacharacters, by using it before a number of
    other characters:


    +   * Called the ''alternation operator'': it matches either regexp it is between
    use to join two separate regexps to match either of them. For example, a|b matches
    either ''a'' or ''b''.


    +   * Matches the regexp as many times as possible, but at least once. So a* matches
    one or more ''a'' adjacent characters, such as ''aaa'', ''aa'', and ''a''.


    +   * Matches the regexp preceding either zero or one times. So a? matches ''a''
    or an empty string—which matches line.


    +   * {number} matches the previous regexp (specified to the left of this construction)
    number of times—so a{3} matches ''aaa''. Use {number,} to match the preceding
    regexp number or more times, \{number,} to match the preceding regexp zero to
    number times, and \{number1,number2} to match the preceding regexp from number1
    to number2 times.'
