  md: '# 14.6.2 Searching for a Phrase in Emacs


    Like grep. The Emacs incremental search only works on lines of text, so it only
    finds phrases on a single line. If you search for ''hello, world'' with the incremental
    search and the text ''hello'', appears at the end of a line and the text ''world''
    appears at the beginning of the next line, it won''t find it.


    +   To find a multi-word phrase across line breaks, use the word-search-forward
    function. It searches for a phrase or words regardless of punctuation or spacing.


    +   To search through the current buffer for the phrase ''join me'', type:

    `M-x word-search-forward join me`


    > NOTE: The word-search-backward function does the same as word-search-forward,
    except it searches backward through the buffer, from point to the beginning of
    the buffer.


    # 14.6.3 Searching for a Regex in Emacs


    Use the search-forward-regex function to search for a regular expression from
    point to the end of the current buffer.


    +   To search forward through the current buffer for the regex ''.*\.org'', type:

    `M-x search-forward-regexp ''.*\.org`


    The keyboard accelerator for this is M-C-s on most keyboards, you press and release
    ESC and then hold down s. To repeat the last regex search you made, type M-C-2
    C-s; then, as long as you have CTRL held down, you can keep typing s to advance
    to the next match, just as you would with an incremental search.


    > NOTE: There is a search-backward-regex function that is identical but searches
    backward, from point to the top of the buffer.


    # 14.6.4 Searching and Replacing text in Emacs


    To search and replace text in Emacs, use the replace-regexp function. When you
    run this function, Emacs will ask for both the text or regexp to search for and
    the text to replace it.


    +   To replace the text ''day'' with the ''night'' in the current buffer, type:

    `M-x replace-regexp day night`


    This function is especially useful for replacing control characters with text,
    which you can specify with C-q, the quoted-insert function (see Regex 10.2.5 [Inserting
    Special Characters in Emacs], page 126).


    +   To replace all " characters in the current buffer with regular linefeeds,
    type:

    `M-x replace-regexp C-q C-m C-q 012`'
