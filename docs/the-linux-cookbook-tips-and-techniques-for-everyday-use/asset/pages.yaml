  md: '# 1.3 If You Need More Help


    If you need more help than this book can give, remember that you do have other
    options.

    Try these steps for getting help:


    +   - Chances are good that you are not alone in your question, and that someone
    else has asked it before; therefore, the compendiums of "Frequently Asked Questions?"
    might just have the answer you need: the Debian FAQ (http://www.debian.org/doc/FAQ/)
    and the Linux FAQ (http://mainmatter.com/).

    - The Linux Documentation Project (http://linuxudoc.org/) is the center of the
    most complete and up-to-date Linux-related documentation available; see if there
    is a document related to the topic you need help with.

    - The Usenet newsgroups:comp.os.linux.help and news:linux.debian.user are often
    an excellent place to discuss issues with other Linux users. (Usenet is described
    in Recipe 32.3 [Reading Usenet], page 348).

    - Check http://linux.com/lug/ to find the Linux User Group (“LUG”) nearest you—people
    with LUGs can be great sources of hands-on help, and it can be fun and rewarding
    to get involved with other Linux and free software enthusiasts in your local area.

    - Finally, you can hire a consultant. This may be a good option if you need work
    done right away and are willing to pay for it.

    The Linux Consultants HOWTO is a list of consultants around the world who provide
    various support services for Linux and open source software in general (see Recipe
    28.6 [Reading System Documentation and Help Files], page 32). Consultants have
    various interests and areas of expertise, and they are listed in that document
    with contact information.'
