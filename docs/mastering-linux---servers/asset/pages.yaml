  md: "# ## 5.5. old dns topics\n\nThe all dns things below this paragraph are old\
    \ and in urgent need of review.\n\n# ### 5.5.1. old example: reverse DNS\n\n+\
    \   1. We can add ip to name resolution to our dns-server using a reverse dns\
    \ zone.\n\n+   2. Start by adding a .arpa zone to /etc/bind/named.conf.local like\
    \ this (we set notify to no avoid sending of notify messages to other servers):\n\
    \n```\nroot@ubuntu010srv:/etc/bind# grep -A4 arpa named.conf.local\nzone \"1.168.192.in-addr.arpa\"\
    \ (\ntype master;\\tnotify no;\tfile \"/etc/bind/db.192\";n);\n```\n\n+   3. Also\
    \ create a database file for this reverse lookup zone.\n\n```\nroot@ubuntu010srv:/etc/bind#\
    \ cat db.192\n;\n; BIND reverse data file for 192.168.1.0/24 network\n;\n@ TTL\
    \ 604800\n@ IN SOA ns.cobbaut.paul root.cobbaut.paul. (\n2011016 6 ; Serial\n\
    604800 ; Refresh\n86400 ; Retry\n2419200 ; Expire\n604800 ) ; Negative Cache TTL\n\
    ;\n@ IN NS ns.\n37 IN PTR ns.cobbaut.paul.\n1 IN PTR anya.cobbaut.paul.\n30 IN\
    \ PTR mac.cobbaut.paul.\nroot@ubuntu010srv:/etc/bind#\n```\n\n+   4. Test with\
    \ nslookup or dig:\n\n```\nroot@ubuntu010srv:/etc/bind# dig - 192.168.192.in-addr.arpa\
    \ AXFR\n```"
