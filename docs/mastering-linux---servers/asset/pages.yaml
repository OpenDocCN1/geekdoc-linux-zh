- pgno: 82
  md: '# 4.10. DNS cache


    DNS is a caching protocol.


    When a client queries its local DNS server, and the local DNS server is not authoritative
    for the query, this server will go looking for an authoritative name server in
    the DNS tree. The local name server will first query a root server, then a tld
    server and then a domain server. When the local name server resolves the query,
    it will relay this information to the client that submitted the query, and it
    will also keep a copy of these queries in its cache. So when a(other) client submits
    the same query to this name server, then it will retrieve this information form
    cache.


    For example, a client queries for the A record on www.linux-training.be to its
    local server. This is the first query received by this local server. The local
    server checks that it is not authoritative for the linux-training.domain, nor
    for the .be tld, and it is also not a root server. So the local server will use
    the root hints to send an iterative query to a root server.


    The root server will reply with a reference to the server that is authoritative
    for the .be domain (root DNS servers do not resolve fqdns, and root servers do
    not respond to recursive queries).


    The local server will then sent an iterative query to the authoritative server
    for the .be tld. This server will respond with a reference to the name server
    that is authoritative for the linux-training.be domain.


    The local server will then sent the query for www.linux-training.be to the authoritative
    server (or one of its slave servers) for the linux-training.be domain. When the
    local server receives the ip address for www.linux-training.be, then it will provide
    this information to the client that submitted this query.


    Besides caching the A record for www.linux-training.be, the local server will
    also cache the NS and A record for the linux-training.be name server and the .be
    name server.'
  merge: -1
  img_proc: true
- pgno: 83
  md: "# 4.11. forward lookup zone example\n\nThe way to set up zones in /etc/bind/named.conf.local\
    \ is to create a zone entry with a reference to another file (this other file\
    \ contains the zone database).\n\nHere is an example of each in /etc/bind/named.conf.local:\n\
    \n```\nroot@debian:-# cat /etc/bind/named.conf.local\n//\n// Do local configuration\
    \ here\n//\n// Consider adding the 1918 zones here, if they are not used in your\n\
    // organization\n// include \"/etc/bind/zones.rfc1918\";\n\nzone \"paul.local\"\
    \ IN {\n    type master;\n    file \"/etc/bind/db.paul.local\";n    allow-update\
    \ { none };\n}\nroot@debian:-#\n```\n\nTo create a zone, the easiest method is\
    \ to copy an existing zone file (this is easier than writing from scratch).\n\n\
    ```\nroot@debian:/etc/bind# cp db.empty db.paul.local\nroot@debian:/etc/bind#\
    \ vi db.paul.local\n```\n\nHere is an example of a zone file.\n\n```\nroot@debian:/etc/bind#\
    \ cat db.paul.local\n; zone for classroom teaching\nTTL 86400 SOA debian.paul.local.\
    \ root.paul.local (\n    2014100100 ; Serial\n    1h ; Refresh\n    1h ; Retry\n\
    \    2h ; Expire\n    86400 ) Negative Cache TTL\n\n; name servers\n    IN NS\
    \ nsl\n    IN NS debianpaul\n    IN NS debian7\n\n; servers\ndebian IN A 10.104.33.30\n\
    ddebianpaul IN A 10.104.33.30\ndebian7 IN A 10.104.33.30\nnsl IN A 10.104.33.30\n\
    www IN A 10.104.33.30\n```"
