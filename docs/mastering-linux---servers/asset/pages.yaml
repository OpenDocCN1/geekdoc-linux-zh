    2002:c0a8:012a:0018::1

    ```


    # 21.9. ISP


    Should you be lucky to get an ipv6 address from an isp, then it will start with
    2001:


    # 21.10. not routable addresses


    Comparable to example.com for DNS, the ipv6 address ranges are reserved for examples,
    and not routable on the internet.


    ```

    3fff:ffff::32

    2001:0db8::32

    ```


    # 21.11. ping6


    Use ping6 to test connectivity between ipv6 hosts. You need to specify the interface
    (there is no routing table for ''random'' generated ipv6 local addresses).


    ```

    [root@fedora4 ~]# ping6 -I eth0 fe80::a00:27ff:fec:(fe80::a00:27ff:fec) from fe80::a00:27ff:fe3c:4346
    eth0: 56

    64 bytes from fe80::a00:27ff:fec: icmp_seq=1 ttl=64 time=0.58 ms

    64 bytes from fe80::a00:27ff:fec: icmp_seq=2 ttl=64 time=3.95 ms

    64 bytes from fe80::a00:27ff:fec: icmp_seq=3 ttl=64 time=1.53 ms

    ```


    Below a multicast ping receives replies from three ipv6 hosts on the network.


    ```

    [root@fedora4 ~]# ping6 -I eth0 ff02::1

    ff02::1 (ff02::1) from fe80::a00:27ff:ffec:4346 eth0: 56 bytes

    64 bytes from fe80::a00:27ff:fec: icmp_seq=1 ttl=64 time=0.598 ms

    64 bytes from fe80::a00:27ff:fec: icmp_seq=2 ttl=64 time=1.87 ms (DUP!)

    64 bytes from fe80::a00:27ff:fec: icmp_seq=3 ttl=64 time=1.53 ms (DUP!)

    64 bytes from fe80::e87b:9dd:fed6:ffec2: icmp_seq=1 ttl=64 time=535 ms (DUP!)

    64 bytes from fe80::a00:27ff:fe3c:4346: icmp_seq=2 ttl=64 time=0.106 ms

    64 bytes from fe80::e87b:9dd:fed6:ffec2: icmp_seq=2 ttl=64 time=1.79 ms (DUP!)

    64 bytes from fe80::a00:27ff:fec: icmp_seq=2 ttl=64 time=2.48 ms (DUP!)

