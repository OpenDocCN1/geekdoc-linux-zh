    \ *:7000>\n  ServerAdmin webmaster@localhost\n  DocumentRoot /var/www/choochos\n\
    \  SSLEngine On\n  SSLCertificateFile /etc/ssl/loccerts/apache.pem\n  SSLCertificateKeyFile\
