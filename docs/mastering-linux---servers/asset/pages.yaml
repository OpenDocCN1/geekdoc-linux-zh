    netbios name = TEACHER0

    netbios aliases =

    netbios scope =

    server string = Samba 3.0.28-1.el15_2.1

    ```


    There are around 350 default values for smb parameters in Samba 3.0.x. This number
    grew to almost 400 in Samba 3.5.x.


    # ## 10.2.3. testpharm -s


    The samba daemons are constantly (once every 60 seconds) checking the smb.conf
    file, so it is good practice to keep this file. But it is also good practice to
    document your samba configuration, and to explicitly set options that have the
    default values. The testpharm -s option allows you to do both. It will output
    the smallest possible configuration file, while retaining your settings. The idea
    is to have your samba configuration in another file (like smb.conf) and let testpharm
    parse this for you. Here below shows you the first smb.conf file with the set
    option workgroup to WORKGROUP.


    ```

    @RHEL4b samba)# cat smb.conf.full

    [global]

    workgroup = WORKGROUP


    # This is a demo of a documented smb.conf

    # These two lines are removed by testpharm -s


    server string = Public Test Server

    ```


    Next, we execute confirm with the -s option, and redirect stdout to the real smb.conf
    file.


    ```

    @RHEL4b samba)# testpharm -s smb.conf.full > smb.conf

    Load smb config files from smb.conf.full

    Processing section "[firstshare]"

    Loaded services services file OK.


    [firstshare]

    path = /srv/samba/public

    [root]@RHEL4b samba)# cat smb.conf

    # global parameters

    [global]

    server string = Public Test Server


    [firstshare]

    path = /srv/samba/public

    [root]@RHEL4b samba)#

    ```


    And below is the end result. The two comments and the default option are no longer
    there.


