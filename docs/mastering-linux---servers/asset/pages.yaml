    # 4.9. incremental zone transfers


    When a zone transfer occurs, this can be either a full zone transfer or an incremental
    zone transfer. The decision depends on the size of the transfer that is to completely
    update the zone on the slave server. An incremental zone transfer is preferred
    when the total size of changes is smaller than the size of the zone database.
    Full zone transfers use the axfr protocol, incremental zone transfer is the ixfr
    protocol.'
