    The directory this script uses is /var/www/images and should be accessible by
    both the squid server (which uses the user name proxy) and the apache2 webserver
    (which uses the user www-data). Screenshot how to create this directory, set the
    permissions and make the users member of the group.


    ```

    root@debian7:~# mkdir /var/www/images

    root@debian7:~# chown www-data:www-data /var/www/images

    root@debian7:~# chmod 755 /var/www/images

    root@debian7:~# usermod -aG www-data proxy

    root@debian7:~# usermod -aG proxy www-data

    ```


    Test that it works after restarting squid and apache2.


