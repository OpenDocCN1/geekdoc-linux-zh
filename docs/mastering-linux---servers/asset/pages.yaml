    Connecting to localhost::80... connected.

    HTTP request sent, awaiting response... 200 OK

    Length: 0 [text/plain]

    Saving to: "test42.txt"

    ..>

    ```


    Why does this work? Because Apache2 runs in the httpd domain and the files in
    /var/www/html have the httpd_sys_content_t type.


    ```

