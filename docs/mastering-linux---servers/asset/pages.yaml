  md: '# 3.3. mysql databases


    # 3.3.1. listing all databases


    You can use the mysql command to take a look at the databases, and execute SQL
    queries on them. The screenshots below show how you. First, we log on to our MySQL
    server and execute the command show databases to see which databases exist on
    our mysql server.


    ```

    kevin@ubul204:-$ mysql

    Welcome to the MySQL monitor. Commands end with : ; or \g

    Your MySQL connection id is 57

    Server version: 5.5.24-Ubuntu0.12.04.1 (Ubuntu)

    ```


    Copyright (c) 2000, 2011, Oracle and/or its affiliates. All rights reserved.


    Oracle is a registered trademark of Oracle Corporation and/or its affiliates.
    Other names may be trademarks of their respective owners.


    Type ''help''; or ''h'' for help. Type ''\\'' to clear the current input state.


    ```

    mysql> show databases;

    +----------------------------+

    | Database                 |

    | information_schema      |

    | mysql                     |

    | performance_schema       |

    | test                       |

    +----------------------------+

    4 rows in set (0.00 sec)

    ```


    # 3.3.2. creating a database


    You can create a new database with the create database command.


    ```

    mysql> create database famouspeople;

    Query OK, 1 row affected (0.00 sec)


    mysql> show databases;

    +----------------------------+

    | Database                 |

    | information_schema      |

    | famouspeople             |

    | mysql                     |

    | performance_schema       |

    | test                       |

    +----------------------------+

    5 rows in set (0.00 sec)

    ```'
