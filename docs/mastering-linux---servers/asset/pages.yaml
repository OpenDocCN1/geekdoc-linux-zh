- pgno: 145
  md: '# 9.1. verify installed version


    # 9.1.1. .rpm based distributions


    To see the version of samba installed on Red Hat, Fedora or CentOS use **rpm -q
    samba.**


    ```

    root@RHEL52 ~]# rpm -q samba

    samba-3.0.28-1.el5_2.1

    ```


    The screenshot above shows that RHELS has **Samba** version 3.0 installed. The
    last number in the Samba version counts the number of updates or patches.


    Below the same command on a more recent version of CentOS with Samba version 3.5
    installed.


    ```

    root@centos6 ~]# rpm -q samba

    samba-3.5.10-116.el16_2.1686

    ```


    # 9.1.2. .deb based distributions


    Use **dpkg -l** or **aptitude show** on Debian or Ubuntu. Both Debian 7.0 (Whezy)
    and Ubuntu 12.04 (Precise) use samba 3.6.3 of the Samba server.


    ```

    root@debian7~# aptitude show samba | grep Version

    Version: 2.3.6-1

    ```


    Ubuntu 12.04 is currently at Samba version 3.6.3.


    ```

    root@ubuntu1204:~# dpkg -l samba | tail -1

    ii samba 2:3.6.3-2ubuntu2.1 SMB/CIFS file, print, and login server for Unix

    ```'
