- pgno: 97
  md: '# 5.1. example: DNS round robin


    When you create multiple A records for the same name, then bind will do a round
    robin of the order in which the records are returned. This allows the use of DNS
    as a load balancer between hosts, since clients will usually take the first-addressed
    address.


    Consider this example for the /etc/bind/db.paul.local zone configuration file.
    There are two A records for www pointing to two distinct ip addresses.


    ```

    root@debian:~# grep www /etc/bind/db.paul.local

    www       IN      A  10.104.33.30

    www       IN      A  10.104.33.31

    ```


    Below a screenshot of nslookup querying a balanced A record. Notice the order
    of ip addresses returned.


    ```

    root@debian:~# nslookup www.paul.local 10.104.33.30

    Server:         10.104.33.30

    Address:        10.104.33.30#53


    Name:           www.paul.local

    Address:        10.104.33.31

    Name:           www.paul.local

    Address:        10.104.33.30


    root@debian:~# nslookup www.paul.local 10.104.33.30

    Server:         10.104.33.30

    Address:        10.104.33.30#53


    Name:           www.paul.local

    Address:        10.104.33.30

    Name:           www.paul.local

    Address:        10.104.33.31

    ```


    Try to set up a website on two web servers (with a small difference so you can
    distinguish the websites) and test the round robin.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# ## 5.2. DNS delegation


    You can delegate a child domain to another DNS server. The child domain then becomes
    a new zone, with authority at the new dns server.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_98_0.png)


    When delegation is properly set up, then clients that query your parent zone will
    also be able to resolve the delegated child zones.'
  merge: -1
  img_proc: true
- pgno: 99
  md: "# 5.3. example: DNS delegation\n\nWe have another Linux server debian7b and\
    \ we want to make it responsible for the child domain test42.paul.local.\n\nNote\
    \ the name of the servers in the screenshots are either debian7 (hosting the parent\
    \ domain) or debian7b (hosting the child domain).\n\nWe start by adjusting the\
    \ /etc/bind/named.conf.local file (on the server hosting the parent domain) to\
    \ make sure that no forwarder will be used when resolving authoritative names.\n\
    \n```\nroot@debian7:~# grep -A4 paul.local /etc/bind/named.conf.local\nzone \"\
    paul.local\" {\n    type master;\n    file \"etc/bind/db.paul.local\";n    allow-update\
    \ { none };\n    allow-transfer { 10.104.15.20 };\n    forwarders { };\n}\nroot@debian7:~#\n\
    ```\n\nTechnically, you can also set allow-transfer to { any }; while troubleshooting\
    \ and then refine it, but this is not needed for delegation.\n\nThen we add the\
    \ delegation to our zone database:\n\n```\nroot@debian7:~# vi /etc/bind/db.paul.local\n\
    ORIGIN test42.paul.local.\n@       IN NS ns2.test42.paul.local.\ns2      IN A\
    \    10.104.33.31    ; the glue record\nroot@debian7:~#\n```\n\nDon't forget to\
    \ restart bind and verify /var/log/syslog.\n\n```\nroot@debian7:~# service bind9\
    \ restart\nStopping domain name service.... bind9.\nStarting domain name service....\
    \ bind9.\nroot@debian7:~# grep paul.local /var/log/syslog | cut -c28- | tail -2\n\
    named[3202]: zone paul.local/IN: loaded serial 2014100801\nnamed[3202]: zone paul.local/IN:\
    \ sending notifications (serial 2014100801)\nroot@debian7:~#\n```\n\nNote that\
    \ on your terminal you can type tail -40 /var/log/syslog because the only reason\
    \ I use grep, cut and tail -2 is to limit the size of the screenshots in this\
    \ book."
  merge: -1
  img_proc: true
- pgno: 100
  md: "# advanced DNS\n\nNext we create a database file on the second server, as seen\
    \ in this screenshot:\n\n```\nroot@debian7b:~## cat /etc/bind/db.test42.paul.local\n\
    ; child zone for classroom teaching\n$TTL 86400\n$ORIGIN test42.paul.local.\n\
    @    SOA    ns2.test42.paul.local. root.test42.paul.local. (\n               \
    \     IN      201400800 ; Serial\n                            1h      ; Refresh\n\
    \                            1h      ; Retry\n                            2h \
    \     ; Expire\n                            900 )   ; Negative Cache TTL\n;\n\
    ; name servers\nIN     NS      ns2.test42.paul.local.\nIN     NS      debian7b.test42.paul.local.\n\
    ;\n; servers\nns2         IN      A       10.104.33.31\ndebian7b     IN      A\
    \       10.104.33.31\ntestsrv root@debian7b:~#\n```\n\nThe second server also\
    \ needs a definition in named.conf.local, followed by a restart of bind.\n\n```\n\
    root@debian7b:~## cat /etc/bind/named.conf.local\n//\n// Do any local configuration\
    \ here\n//\n//\n// Consider adding the 1918 zones here, if they are not used in\
    \ your\n// organization\n// include \"/etc/bind/zones.rfc1918\"\n\nzone \"test42.paul.local\"\
    \ IN {\n    type master;\n    file \"/etc/bind/db.test42.paul.local\";\n    allow-update\
    \ { none };\n    allow-transfer { any };\n}\nroot@debian7b:~#\n```\n\nTesting\
    \ on the parent server:\n\n```\nroot@debian7:~## dig ns1.paul.local +short\n10.104.33.30\n\
    root@debian7:~## dig ns2.test42.paul.local +short\n10.104.33.31\nroot@debian7:~##\
    \ debian7b.test42.paul.local +short\n10.104.33.31\n```"
