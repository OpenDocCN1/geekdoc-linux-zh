  md: "# 4.15. example: a DNS slave server\n\n+   1. A slave server transfers zone\
    \ information over the network from a master server (a slave can also be a master).\
    \ A primary server maintains zone records in its local file system. As an exercise,\
    \ and to verify the work of all students, set up a slave server of all the master\
    \ servers in the classroom.\n\n+   2. Before configuring the server, we may have\
    \ to allow transfers from our zone to this server. Remember that this is not very\
    \ secure since transfers are in clear text and limited to an ip address. This\
    \ example follows our demo from above.\n\nImagine a student named Jesse having\
    \ completed the setup as shown before, with the domain jesse.local and the ip\
    \ address 10.104.15.20. The goal is to have a slave server of paul.local on Jesse's\
    \ computer and a slave of jesse.local on my computer.\n\nBelow is an example of\
    \ an allow-transfer statement. Careful, maybe the default allows transfer to any.\n\
    \n```\nroot@debian7:/etc/bind# cat named.conf.local\n// Do any local configuration\
    \ here\n//\n// Consider adding the 1918 zones here, if they are not used in your\n\
    // organization\n// include \"/etc/bind/zones.rfc1918\"\n\nzone \"paul.local\"\
    \ IN (\n    type master;\n    file \"/etc/bind/db.paul.local\"\n    allow-update\
    \ { none; };\n    allow-transfer { 10.104.15.20; }\n);\n```"
