    HTTP request sent, awaiting response... 403 Forbidden

    2014-05-06 15:10:22 ERROR 403: Forbidden.

    ```


    Instead when visiting the ip-address of your server in a browser you get a noindex.html
    page. You can verify using this wget.


    ```

    [root@centos65 ~]# wget 127.0.0.1/error/noindex.html

