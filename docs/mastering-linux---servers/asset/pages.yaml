- pgno: 26
  md: "# 1.5.4. SELinux guards our ports\n\nIf we try toCentOS restart our server,\
    \ we will notice the following error:\n\n```\n[root@CentOS65 #] service httpd\
    \ restart      [ OK ]\nStopping httpd:\nStarting httpd:\n(13)Permission denied:\
    \ make_sock: could not bind to address 0.0.0.0:7000\n listening sockets available,\
    \ shutting down\n                               [FAILED]\n```\n\nThis is due to\
    \ SELinux reserving ports 7000 and 8000 for other users. We need to tell SELinux\n\
    we use these ports for http traffic\n\n```\n[root@CentOS65 #] semanage port -m\
    \ -t http_port_t -p tcp 7000\n[root@CentOS65 #] semanage port -m -t http_port_t\
    \ -p tcp 8000\n[root@CentOS65 #] service mkdir /var/www/html/hunter2\nStopping\
    \ httpd:\n[ OK ]\nStarting httpd:\n[ OK ]\n```\n\n# 1.5.5. three extra websites\n\
    \nNext we need to create three Document directories.\n\n```\n[root@CentOS65 #]\
    \ mkdir /var/www/html/chochooo\n[root@CentOS65 #] mkdir /var/www/html/chessclub42\n\
    [root@CentOS65 #] mkdir /var/www/html/hunter2\n```\n\nAnd we have to put some\
    \ simple website in those directories.\n\n```\n[root@CentOS65 #] echo 'Choo Choo\
    \ model train Choo Choo' > /var/www/html/chooc/\nhoo/index.html\n[root@CentOS65\
    \ #] echo 'Welcome to chess club 42' > /var/www/html/chessclub42/\nindex.html\n\
    [root@CentOS65 #] echo 'HackIng is fUn At HuNtEr2' > /var/www/html/hunter2/ind\\\
    \nex.html\n```\n\n# 1.5.6. enabling extra websites\n\nThe only way to enable or\
    \ disable configurations in RHEL/CentOS is by renaming or\nm the configuration\
    \ files. Any file in /etc/httpd/conf.d .conf will be loaded\nby Apache. To disable\
    \ a site we can rename the file or move it to another directory.\n\nThe files\
    \ are created, so we can tell them apache.\n\n```\n[root@CentOS65 #] ls /etc/httpd/conf.d/\n\
    chessclub42.conf chochooo.conf hunter2.conf README welcome.conf\n[root@CentOS65\
    \ #] service httpd reload\nReloading httpd:\n```"
  merge: -1
  img_proc: true
