    \ drive in Windows. Below we test that we can\nwrite to this share.\n\n```\nL:\\\
    >echo > hoi.txt\n\nL:\\>dir\nVolume in drive L pubwrite\nVolume Serial Number\
    \ is 0C82-272A\n\nDirectory of L:\\\n21/01/2009  06:11  <DIR>                .\n\
    21/01/2009  06:11  <DIR>               hoi.txt\n21/01/2009  06:16            \
