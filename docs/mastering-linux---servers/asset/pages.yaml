- pgno: 137
  md: '# 8.5. solution: packet filtering


    A possible solution, where leftnet is the internal and rightnet is the external
    network.


    ```

    #!/bin/bash


    # first cleanup everything

    iptables -t filter -F

    iptables -t filter -X

    iptables -t nat -F

    iptables -t nat -X


    # default drop

    iptables -P INPUT DROP

    iptables -P FORWARD DROP

    iptables -P OUTPUT DROP


    # allow loopback device

    iptables -A INPUT -i lo -j ACCEPT

    iptables -A OUTPUT -o lo -j ACCEPT


    # question 1: allow ssh over eth0

    iptables -A INPUT -i eth0 -p tcp --dport 22 -j ACCEPT

    iptables -A OUTPUT -o eth0 -p tcp --sport 22 -j ACCEPT


    # question 2: allow icmp(ping) anywhere

    iptables -A INPUT -p icmp --icmp-type any -j ACCEPT

    iptables -A FORWARD -p icmp --icmp-type any -j ACCEPT

    iptables -A OUTPUT -p icmp --icmp-type any -j ACCEPT


    # question 3: allow http from internal(leftnet) to external(rightnet)

    iptables -A FORWARD -i eth1 -o eth2 -p tcp --dport 80 -j ACCEPT

    iptables -A FORWARD -i eth2 -o eth1 -p tcp --state EST,RELATED --sport 80 -j ACCEPT


    # question 4: allow ssh from internal(leftnet) to external(rightnet)

    iptables -A FORWARD -i eth1 -o eth2 -p tcp --dport 22 -j ACCEPT

    iptables -A FORWARD -i eth2 -o eth1 -p tcp --sport 22 -j ACCEPT


    # allow http from external(rightnet) to internal(leftnet)

    iptables -A FORWARD -i eth2 -o eth1 -p tcp --dport 80 -j ACCEPT

    iptables -A FORWARD -i eth1 -o eth2 -p tcp --sport 80 -j ACCEPT


    # allow rpcinfo over eth0 from outside to system

    iptables -A INPUT -i eth2 -p tcp --dport 111 -j ACCEPT

    iptables -A OUTPUT -o eth2 -p tcp --sport 111 -j ACCEPT

    ```'
  merge: -1
  img_proc: true
- pgno: 138
  md: "# 8.6. network address translation\n\n# 8.6.1. NAT\n\nA NAT device is a router\
    \ that is also changing the source and/ target ip-address in packets. It is typically\
    \ used to connect multiple computers in a private address range with the (public)\
    \ internet. A NAT can hide private addresses from the internet.\n\nNAT was developed\
    \ to mitigate the use of real ip addresses, to allow private address ranges to\
    \ reach the internet and back, and not to disclose internal networks to the\n\n\
    The nat in iptables adds two new chains. PREROUTING allows altering of packets\
    \ before they reach the INPUT chain. POSTROUTING allows altering packets after\
    \ they exit the OUTPUT chain.\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_138_0.png)\n\
    \nUse iptables -t nat -nvL to look at the NAT table. The screenshot below shows\
    \ an empty NAT table.\n\n```\n[root@RHEL5]# iptables -t nat -nvL\nChain PREROUTING\
    \ (policy ACCEPT)\n  target      prot opt source destination\nChain POSTROUTING\
    \ (policy ACCEPT)\n  target      prot opt source destination\nChain OUTPUT (policy\
    \ ACCEPT)\n  target      prot opt source destination\n[root@RHEL5]#\n```"
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 8.6.2. SNAT (Source NAT)


    The goal of source nat is to change the source address inside a packet before
    it leaves the system (e.g. to the internet). The destination will return the packet
    to the NAT-device. This means our NAT-device will need to keep a table in memory
    of all the packets changed, so it can deliver the packet to the original source
    (e.g. in the private network).


    Because SNAT is about packets leaving the system, we use the POSTUTING chain.


    Here is an example SNAT rule. The rule says that packets coming from 10.1.1.0/24
    network and exiting eth1 will get the source address set to 11.12.13.14. (Note
    that this is one line command!)


    ```

    iptables -t nat -A POSTROUTING -o eth1 -s 10.1.1.0/24 -j SNAT \

    --to-source 11.12.13.14

    ```


    Of course there must exist a proper iptables filter setup to allow the packet
    to traverse from one network to the other.


    # 8.6.3. SNAT example setup


    This example uses a typical nat setup. The internal (eth0) network has access
    via SNAT to external (eth1) webservers (port 80).


    ```

    #!/bin/bash

    # iptables script for simple classic nat websurfing

    # eth0 is internal network, eth1 is internet

    #necho 0 > /proc/sys/net/ipv4/ip_forward

    iptables -P INPUT ACCEPT

    iptables -P OUTPUT ACCEPT

    iptables -P FORWARD DROP

    iptables -A FORWARD -i eth0 -o eth1 -s 10.1.1.0/24 -p tcp \

    --dport 80 -j ACCEPT

    iptables -A FORWARD -i eth1 -o eth0 -d 10.1.1.0/24 -p tcp \

    --sport 80 -j ACCEPT

    iptables -t nat -A POSTROUTING -o eth1 -s 10.1.1.0/24 -j SNAT \

    --to-source 11.12.13.14

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 8.6.4. IP masquerading


    IP masquerading is very similar to SNAT, but is meant for dynamic interfaces.
    Typical example is broadband ''router/modems'' connected to the internet and receiving
    a different ip-address from the isp, each they are cold-booted.


    The only change needed to convert the SNAT script to a masquerading is one line.


    ```

    iptables -t nat -A POSTROUTING -o eth1 -s 10.1.1.0/24 -j MASQUERADE

    ```


    # 8.6.5. DNAT (Destination NAT)


    DNAT is typically used to allow packets from the internet to be redirected to
    an internal server (in your DMZ) and in a private address range that is inaccessible
    directly form the internet.


    This example script allows internet users to reach your internal (192.168.1.99)
    server via ssh (port 22).


    ```

    #!/bin/bash

    # iptables script for DNAT

    # eth0 is internal network, eth1 is internal

    #

    echo 0 > /proc/sys/net/ipv4/ip_forward

    iptables -P INPUT ACCEPT

    iptables -P OUTPUT ACCEPT

    iptables -P FORWARD DROP

    iptables -A FORWARD -i eth1 -o eth0 -s 10.1.1.0/24 -j ACCEPT

    iptables -A FORWARD -i eth1 -o eth0 -p tcp --dport 22 -j ACCEPT

    iptables -t nat -A PREROUTING -i eth1 -p tcp --dport 22 \

    -J DNAT --to-destination 10.1.1.99

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```'
  merge: -1
  img_proc: true
