- pgno: 171
  md: '# 12.1. set up a directory to share


    In this second example, we will create a share where everyone can create files
    and write to files. Again, we start by creating a directory


    ```

    [root@RHEL52 samba]# mkdir -p /srv/samba/writable

    [root@RHEL52 samba]# chmod 777 /srv/samba/writable/

    ```


    # 12.2. share section in smb.conf


    There are two parameters to make a share writable. We can use the read only or
    writable. This example shows how to use writable to give access to a share.


    ```

    writable = yes

    ```


    And this is an example of using the read only parameter to give write access to
    a share.


    ```

    read only = no

    ```


    # 12.3. configure the share


    Then we simply add a share to our file server by editing smb.conf. Below the check
    with testpar (We could have changed the description of the server...)


    ```

    [root@RHEL52 samba]# testpar

    Load smb config files from /etc/samba/smb.conf

    Processing section "pubwrite"

    Processing section "pubread"

    Loaded services OK.

    Server role: ROLE_STANDALONE

    Press enter to see a dump of your service definitions

    [global]

    netbios name = TEACHERO

    server string = Public Anonymous File Server

    security = SHARE

    [pubwrite]

    comment = files to write

    path = /srv/samba/writable

    read only = No

    guest ok = Yes

    [pubread]

    comment = files to read

    path = /srv/samba/readonly

    guest ok = Yes

    ```


    # 12.4. test connection with windows


    We can now test the connection on a windows 2003 computer. We use the net use
    for this.


    ```

    C:\>net use L: \teacher0\pubwrite

    net use L: \teacher0\pubwrite

    The command completed successfully.

    ```'
  merge: -1
  img_proc: true
- pgno: 172
