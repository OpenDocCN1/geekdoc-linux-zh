- pgno: 149
  md: '# 9.5. samba daemons


    Samba 3 consists of three daemons, they are named nmbd, smbd and winbindd.


    # 9.5.1. nmbd


    The nmbd daemon takes care of all the names and naming. It registers and resolves
    names, and handles browsing. According to the documentation, it should be the
    first daemon to start.


    ```

    [root@RHEL52 ~]# ps -C nmbd

    PID TTY TIME CMD

    5681 ? 00:00:00 nmbd

    ```


    # 9.5.2. smbd


    The smbd daemon manages file transfers and authentication.


    ```

    [root@RHEL52 ~]# ps -C smbd

    PID TTY TIME CMD

    5678 ? 00:00:00 smbd

    5683 ? 00:00:00 smbd

    ```


    # 9.5.3. winbindd


    The winbind daemon (winbindd) is only started to handle Microsoft Windows domain
    membership.


    Note that winbindd is started by the /etc/init.d/winbind script (two dd''s for
    the daemon and only one d for the script).


    ```

    [root@RHEL52 ~]# /etc/init.d/winbind start [ OK ]

    Starting Winbind services:

    [root@RHEL52 ~]# ps -C winbindd

    PID TTY TIME CMD

    5752 ? 00:00:00 winbindd

    5754 ? 00:00:00 winbindd

    ```


    On Debian and Ubuntu, the winbindd daemon is installed via a separate package
    called winbind.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 9.6. the SMB protocol


    # 9.6.1. brief history


    Development of this protocol was started by IBM in the early eighties. By the
    end of the eighties, most development was done by Microsoft. SMB is an application
    level protocol designed to run on top of NetBIOS/NetBEUI, but can also be run
    on top of tcp/ip.


    In 1996 Microsoft was asked to document the protocol. They submitted CIFS (Common
    Internet File System) as an internet draft, but it never got rfc status.


    In 2004 the European Union decided Microsoft should document the protocol to enable
    other developers to write compatible software. December 20th 2007 Microsoft came
    to an agreement. The Samba team now has access to SMB/CIFS, Windows for Workgroups
    and Active Directory documentation.


    # 9.6.2. broadcasting protocol


    SMB uses the NetBIOS service location protocol, which is a broadcasting protocol.
    This means that NetBIOS names have to be unique on the network (even when you
    have different IP-addresses). Having duplicate names on an SMB network can seriously
    harm communications.


    # 9.6.3. NetBIOS names


    NetBIOS names are similar to hostnames, but are always uppercase and only 15 characters
    in length. Microsoft Windows computers and Samba servers will broadcast this name
    on the network.


    # 9.6.4. network bandwidth


    Having many broadcasting SMB/CIFS computers on your network can cause bandwidth
    issues. A solution can be the use of a NetBIOS name server (NBNS) like WINS (Windows
    Internet Naming Service).'
  merge: -1
