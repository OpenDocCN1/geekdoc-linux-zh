- pgno: 80
  md: "# 4.7. master and slave\n\nWhen adding a secondary dns server to a zone, then\
    \ you will configure this server as a slave server to the primary server. The\
    \ primary server then becomes the master server of the slave server.\n\nOften\
    \ the primary dns server is the master server of all slaves. Sometimes a slave\
    \ server is master server for a second line slave reply. In the picture below\
    \ ns1 is the primary dns server and ns2, ns3 and ns4 are secondaries. For master\
    \ slaves ns2 and ns3 is ns1, but the master for ns4 is ns2.\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_80_0.png)\n\
    \n# 4.8. So record\n\nThe Soa record contains a refresh value. If this is set\
    \ to 30 minutes, the slave server will request a copy of the zone file every 30\
    \ minutes. There is also a retry value. The retry value is used when the master\
    \ server did not reply to the last zone transfer. The value for expiry time shows\
    \ how the slave server will answer to queries, without receiving a zone update.\n\
    \nBelow an example of how to use nslookup to query the so record of a zone (linux-training.be).\n\
    \n```\nroot@debian6:~# nslookup\n> set type=SOA\n> server=ns1.opensmins.be\n>\
    \ linux-training.be\nServer:         ns1.opensmins.be\nAddress:         195.47.215.14#53\n\
    \nux-training.be\n  origin = ns1.opensmins.be\n  mail addr = hostmaster.opensmins.be\n\
    \  serial = 2321001133\n  refresh = 14400\n  retry = 3600\n  expire = 604800\n\
    \  minimum = 3600\n```\n\nZone transfers only occur when the zone database was\
    \ updated (meaning one or more resource records were added, removed or changed\
    \ on the master server)."
