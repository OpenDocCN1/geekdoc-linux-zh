    # # 17.7. Users and Groups


    To be able to use users and groups in the samba domain controller, we can first
    set up some groups on the Linux computer.


    ```

    [root@RHEL52 samba]# groupadd ntadmins

    [root@RHEL52 samba]# groupadd ntports

    [root@RHEL52 samba]# groupadd ntfootball

    [root@RHEL52 samba]# groupadd ntennisis

    ```


    This enables us to add group membership info to some new users for our samba domain.
    Don''t forget to give them command


    ```

    [root@RHEL52 samba]# useradd -m -G ntadmins Administrator

    [root@RHEL52 samba]# useradd -m -G ntports,tennis venus

    [root@RHEL52 samba]# useradd -m -G ntports,tennis kim

    [root@RHEL52 samba]# useradd -m -G ntports,tennis jelena

    [root@RHEL52 samba]# useradd -m -G ntports,football figo

    [root@RHEL52 samba]# useradd -m -G ntports,football ronaldo

    [root@RHEL52 samba]# useradd -m -G ntports,football pfaff

    ```


    It is always safe to verify creation of users, groups and passwords in /etc/passwd,
    /etc/shadow and /group.


    ```

    [root@RHEL52 samba]# tail -11 /etc/group

    admin:x:507:Administrator

    ntports:x:508:venus, kim, jelena, figo, ronaldo, pfaff

    ntfootball:x:509:ronaldo,pfaff

    ntennis:x:510:venus, kim, jelena

    venus:x:512

    kim:x:513

    jelena:x:514

    figo:x:515

    ronaldo:x:516

    pfaff:x:517:

    ```


    # # 17.8. tdbbsam


    We must make these users known to samba with the smpasswd tool. When you add the
    first user to tdbs, the /etc/samba/passdb.td will be created.


    ```

    [root@RHEL52 samba]# smpasswd -a root

    New SMB password:

    ```'
