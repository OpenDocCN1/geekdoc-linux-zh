- pgno: 24
  md: "# 4. password protected website on Debian\n\nYou can secure files and directories\
    \ in your website with a .htaccess file that refers to a .htpasswd file. The htpasswd\
    \ command can create a .htpasswd file that contains a userid and an (encrypted)\
    \ password.\n\nThis screenshot creates a user and password for the hacker named\
    \ cliff and the -e flag to create the .htpasswd file.\n\n```\nroot@debian7:~#\
    \ htpasswd -c /var/www/.htpasswd cliff\nNew password:\nRe-type new password:\n\
    Adding password for user cliff\nroot@debian7:~# cat /var/www/.htpasswd\ncliff:$apr1$vuuj10lLk$SZ49q0swXh93P0QPVP.\n\
    ```\n\nBoth Cliff and Rob chose the same password (hunter2), but that this shows\
    \ how to add a second user and password to .htpasswd.\n\n```\nroot@debian7:~#\
    \ htpasswd /var/www/.htpasswd rob\nNew password:\nRe-type new password:\nAdding\
    \ password for user rob\nroot@debian7:~# cat /var/www/.htpasswd\ncliff:$apr1$vuuj10lLk$SZ49q0swXh93P0QPVP\n\
    rob:$apr1$5Hn1IFFTcNR1HoP.IW11/1DRQ41Q0\n```\n\nWe need to create a .htaccess\
    \ file in the DocumentRoot of the website we want to protect. This screenshot\
    \ shows an example.\n\n```\nroot@debian7:~# cd /var/www/hunter2/\nroot@debian7:/var/www/hunter2#\
    \ cat .htaccess\nAuthUserFile=\"Members only!\"\nAuthName\nAuthType Basic\nrequire\
    \ valid-user\n```\n\nNote that we are protecting the website on port 9000 that\
    \ we created earlier.\n\nAnd because we put the website in the Hackerspace named\
    \ hunter2 in a subdirectory of the default website, we will need to adjust the\
    \ AllowOverride parameter in /etc/apache2/sites-available/default/default as this\
    \ screenshot shows (with line numbers on Debian 7, your may vary).\n\n```\n<Directory\
    \ /var/www//\n    Options Indexes FollowSymLinks MultiViews\n    AllowOverride\
    \ Authconfig\n    Order allow, deny\n    allow from all\n</Directory>\n```\n\n\
    Now restart the apache2 server and test that it works!"
  merge: -1
  img_proc: true
