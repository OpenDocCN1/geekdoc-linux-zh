    \ start\nStarting SMB services:                [ OK ]\nStarting NMB services:\
    \               [ OK ]\n[root@RHEL4b ~]# service smb restart\nShutting down SMB\
    \ services:          [ OK ]\nShutting down NMB services:          [ OK ]\nStarting\
