  md: "# introduction to dhcp\n\n```\n[root@rhel71 ~]# # cat /etc/dhcp/dhcpcd.conf\n\
    # DHCP Server Configuration file.\n#   see /usr/share/doc/dhcp*/dhcpcd.conf.example\n\
    #   see dhcpcd.conf(5) man page\n\n[root@rhel71 ~]#\n```\n\nWe copy the sample\
    \ and adjust it for our real situation. We name the copy /etc/dhcp/dhcpcd.conf.\n\
    \n```\n[root@rhel71 ~]# cp /usr/share/doc/dhcp-4.2.5/dhcpcd.conf /etc/dhcp/dhcp-d.conf\n\
    [root@rhel71 ~]# # vi /etc/dhcp/dhcpcd.conf\noption domain-name \"linux-training.be\"\
    ;noption domain-name-servers 10.42.42.42;\ndefault-lease-time 600;\nmax-lease-time\
    \ 720;\nlog-facility local7;\n\nsubnet 10.42.0.0 netmask 255.255.255.0 (\n  range\
    \ 10.42.200.11 10.42.200.120;\n  option routers 10.42.200.1;\n}\n\n[root@rhel71\
    \ ~]#\n```\n\nThe 'routers' option is valid for the subnet alone, whereas the\
    \ 'domain-name' option is valid (for all subnets).\n\nTo start the server. Remember\
    \ to use systemctl start dhcpd on RHEL7/CentOS and service dhcpd on previous versions\
    \ of RHEL/CentOS.\n\n```\n[root@rhel71 ~]# systemctl start dhcpcd\n[root@rhel71\
