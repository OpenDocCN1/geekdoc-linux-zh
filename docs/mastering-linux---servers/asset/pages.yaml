  md: '# Chapter 21. Introduction to ipv6'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 21.1. about ipv6


    The ipv6 protocol is designed to replace ipv4. Where ip version 4 supports a maximum
    of four billion unique addresses, ip version 6 expands this to four billion times
    four billion unique addresses. This is more than 100,000,000,000,000,000 ipv6
    addresses per square cm on our planet. That should be enough, even if every cell
    phone, coffee machine and every pair of socks gets an address.


    Technically speaking ipv6 uses 128-bit addresses (instead of the 32-bit from ipv4).
    128-bit addresses are huge numbers. In decimal it would amount up to 39 digits,
    in hexadecimal it looks like this:


    ```

    fe80:0000:0000:0000:27ff:fe8e:8aa8

    ```


    Luckily ipv6 allows us to omit leading zeros. Our address from above then becomes:


    ```

    fe80:0:0:a00:27ff:fe8e:8aa8

    ```


    When a 16-bit block is zero, it can be written as ::. Consecutive 16-bit blocks
    that are zero can be written as ::. Our address from above can be shortened to:


    ```

    fe80::a00:27ff:fe8e:8aa8

    ```


    This :: can only occur once! The following is not a valid ipv6 address:


    ```

    fe80::2e4f:39ac

    ```


    The ipv6 address is 0000:0000:0000:0000:0000:0000:0001, which can be abbreviated
    to ::1.


    ```

    paul@debian5:~ /github/it/images$ /sbin/ifconfig lo | grep inet6

    inet6 addr: ::1/128 Scope:Host

    ```


    # 21.2. network address and host id


    One of the few similarities between ipv4 and ipv6 is that addresses have a host
    part and a network part determined by a subnet mask. Using the cidr notation this
    looks like this:


    ```

    fe80::a00:27ff:fe8e:8aa8/64

    ```


    The above address has 64 bits for the host id, theoretically allowing for 4 billion
    times four billion hosts.


    The localhost address looks like this:


    ```

    ::1/128

    ```


    # 21.3. host part generation


    The host part of an automatically generated (stateless) ipv6 address contains
    part of the hosts mac address:


    ```

    paul@debian5:~ $ /sbin/ifconfig | head -3

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'eth3 Link encap:Ethernet HWaddr 00:27:27:ab:67:30

    inet addr:192.168.1.29 Bcast:192.168.1.255 Mask:255.255.255.0

    inet6 addr: fe80::0000:27ff:feab:6730/64 Scope:Link


    Some people are concerned about privacy here...


    # 21.4. ipv4 mapped ipv6 address


    Some applications use ipv4 addresses embedded in an ipv6 address. (Yes there be
    an era of migration with both ipv4 and ipv6 in use.) The ipv6 address then looks
    like this:


    ```

    ::ffff:192.168.1.42/96

    ```


    Indeed a mix of decimal and hexadecimal characters...


    # 21.5. link local addresses


    ipv6 addresses starting with fe8. can only be used on the local segment (replace
    the dot with a hexadecimal digit). This is the reason you Scope:Link the address
    in this screenshot. This address serves only the local link.


    ```

    paul@debe503:~$ /sbin/ifconfig | grep inet6

    inet6 addr: fe80::a12:27ff:fe8e:aaa8/64 Scope:Link

    inet6 addr: ::128 Scope:Host

    ```


    These link local addresses all begin with fe8.


    Every ipv6 will not get an address in this range.


    # 21.6. unique local addresses


    The now obsolete of site local addresses is similar to ipv4 private ranges is
    replaced with a system of globally unique local ipv6 addresses. This to prevent
    duplicates when joining networks within site local ranges.


    All unique local addresses strat with fd..


    # 21.7. globally unique unicast addresses


    Since ipv6 was designed to have multiple addresses per interface, the global ipv6
    address can be used next to the link local address.


    These globally unique addresses all begin with 2... or 3... as the first 16-bits.


    # 21.8. 6to4


    6to4 is defined in rfc 2893 and 3056 as one possible way to transition between
    ipv4 and ipv6 by creating an ipv6 tunnel.


    It encodes an ipv4 address in an ipv6 address that starts with 2002. For example
    192.168.1.42/24 will be encoded as:'
