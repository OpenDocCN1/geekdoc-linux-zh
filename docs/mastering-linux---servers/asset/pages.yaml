- pgno: 216
  md: '# # Chapter 19. introduction to SELinux


    Security Enhanced Linux or SELinux is a set of modifications developed by the
    United States National Security Agency (NSA) to provide a variety of security
    policies for Linux. SELinux was released as open source at the end of 2000. Since
    kernel version 2.6 is an integrated part of Linux.


    SELinux offers security! SELinux can control what kind of access users have to
    files and processes. Even when a file received chmod 777, SELinux can still prevent
    applications from accessing it (Unix file permissions are checked first!). SELinux
    does this by placing users in roles that represent a security context. Administrators
    have very strict control on access permissions granted to roles.


    SELinux is present in the latest versions of Red Hat Enterprise Linux, Debian,
    CentOS, Fedora, and many other distributions..'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# # 19.1. selinux modes


    selinux knows three modes: enforcing, permissive and disabled. The enforcing mode
    will enforce policies, and may deny access based on selinux rules. The permissive
    mode will not enforce policies, but can log actions that would have been denied
    in enforcing mode. The disabled modes are selinux.


    # # 19.2. logging


    Verify that syslog is running and activated on boot to enable logging of deny
    messages in /var/log/messages.


    ```

    [root@rhel55 ~]# chkconfig --list syslog

    syslog 0:off 1:off 2:on 3:on 4:on 5:off

    ```


    Verify that auditd is running and activated on boot to enable logging of easier
    to read messages in /var/log/audit/audit.log.


    ```

    [root@rhel55 ~]# chkconfig --list auditd

    audit 0:off 1:off 2:on 3:on 4:on 5:off

    ```


    If not activated, run chkconfig --levels 2345 auditd and on audit chart.


    ```

    [root@rhel55 ~]# service auditd status

    audd (1660) is running...

    [root@rhel55 ~]# service syslog status

    syslog (2188) is running...

    klog (1691) is running...

    ```


    The /var/log/messages file will tell you that selinux is disabled.


    ```

    root@deb503:~# grep selinux /var/log/messages | grep -i Init

    Jun 25 15:59:34 deb503 kernel: [ 0.084083] SELinux: Disabled at boot.

    ```


    Or that is enabled.


    ```

    root@deb503:~# grep SELinux /var/log/messages | grep -i Init

    Jun 25 15:09:52 deb503 kernel: [ 0.084094] SELinux: Initializing.

    ```


    # # 19.3. activating selinux


    On RHEL you can use the GUI tool to activate selinux, on Debian there is the selinux-

    activate command. Activation requires a reboot.


    ```

    root@deb503:~# selinux-activate

    Activating SE Linux

    Searching for GRUB installation directory ... found: /boot/grub

    Searching for default file ... found: /boot/grub/default

    Testing for an existing GRUB menu-list file ... /boot/grub/menu.list

    Searching for splash image ... none found, skipping

    Found kernel: /boot/vmlinuz-2.6.26-2-686

    Updating /boot/grub/menu.list done

    ```


    SE Linux is activated. You may need to reboot now.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# 19.4. getenforce


    Use getenforce to verify whether selinux is enforced, disabled or permissive.


    ```

    [root@rhel55 -]## getenforce

    Permissive

    ```


    The /selinux/enforce file contains 1 when enforcing, and 0 when permissive mode
    is active.


    ```

    root@fedoral3 -# cat /selinux/enforce

    root@fedoral3 -#

    ```


    # 19.5. setenforce


    You can use setenforce to switch between the Permissive or the Enforcing state
    once selinux is activated.


    ```

    [root@rhel55 -]# setenforce Enforcing

    [root@rhel55 -]# getenforce

    Enforcing

    [root@rhel55 -]# setenforce Permissive

    [root@rhel55 -]# getenforce

    Permissive

    ```


    Or you could just use 0 and 1 as argument.


    ```

    [root@centos65 ~]# setenforce 1

    [root@centos65 ~]# getenforce

    Enforcing

    [root@centos65 ~]# setenforce 0

    [root@centos65 ~]# getenforce

    Permissive

    [root@centos65 ~]##

    ```'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 19.6. sestatus


    You can see the current selinux status and policy with the sestatus command.


    ```

    [root@hel55 ~]# sestatus

    SELinux status:         enabled

    SELinuxfs mount:       /selinux

    Current mode:            permissive

    Mode from config file:  permissive

    Policy version:          21

    Policy from config file:  targeted

    ```


    # 19.7. policy


    Most Red Hat server will have the targeted policy. Only NSA/FBI/CIA/DOD/HLS use
    the mls policy.


    The targeted policy will protect hundreds of processes, but lets others processes
    run ''unconfined'' (= they can do anything).


    # 19.8./etc/selinux/config


    The main configuration file for selinux is /etc/selinux/config. When in permissive
    mode, the file looks like this.


    The targeted policy is selected in /etc/selinux/config.


    ```

    [root@centos65 ~]# cat /etc/selinux/config

    # This file controls the state of SELinux on the system.

    # SELINUX=can take one of these three values:

    # enforcing - SELinux security policy is enforced.

    # permissive - SELinux prints warnings instead of enforcing.

    # disabled - SELinux is fully disabled.

    SELINUX=permissive

    # SELINUXTYPE= of policy in use. Possible values are:

    # targeted - Only targeted network daemons are protected.

    # strict - Full SELinux protection.

    SELINUXTYPE=targeted

    ```'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 19.9. DAC or MAC


    Standard Unix permissions use Discretionary Access Control to set permissions
    on files. This means that a user that owns a file, can make it world readable
    by typing chmod 777 $file.


    With selinux the kernel will enforce Mandatory Access Control which strictly controls
    what processes or threads can do (superseding DAC). Processes are confined by
    the kernel to the minimum access they require.


    SELinux MAC is about labeling and type enforcing! Files, processes, etc are all
    labeled with an SELinux context. For files, these are extended attributes, for
    processes this is managed by the kernel.


    The format of the labels is as follows:


    ```

    user:role:type:(level)

    ```


    We use only the type label in the targeted policy.


    # 19.10. Is -Z


    To see the DAC permissions on a file, use ls -l to display user and group owner
    and permissions.


    For MAC permissions there is new -Z option added to ls. The output shows that
    file in /root have a XXTypepol of admin_home_t.


    ```

    [root@centos65 #] ls -Z

    -rw-r--r root root system_u:object:radmin_home_t:s0 anaconda-ks.cfg

    -rw-r--r root root system_u:object:radmin_home_t:s0 install.log

    -rw-r--r root root system_u:object:radmin_home_t:s0 install.log.syslog


    [root@centos65 #] useradd -m -s /bin/bash pol

    [root@centos65 #] ls -Z /home/pol/.bashrc

    -rw-r--r pol unconfined:object:user_home_t:s0 /home/pol/.bashrc

    ```


    # 19.11. -Z


    There are some other tools with the -Z switch:


    ```

    mkdir -Z

    cp -Z

    ps -Z

    netstat -Z

    ...

    ```'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 19.12. /selinux


    When selinux is active, there is a new file system named **selinux**. (You can
    compare it to /proc and /dev.)


    ```

    [root@centos65 ~]# ls -l /selinuxntotal 0

    -rw-rw-rw---- 1 root root 0 Apr 12 19:40 access

    dr-xr-xr-x. 2 root root 0 Apr 12 19:40 avc

    dr-xr-xr-x. 2 root root 0 Apr 12 19:40 Booleans

    -rw-rw--r-- 1 root root 0 Apr 12 19:40 checkreqport

    dr-xr-xr-x. 83 root root 0 Apr 12 19:40 class

    -rw-rw--r-- 1 root root 0 Apr 12 19:40 commit_pending_pools

    -rw-rw--r-- 1 root root 0 Apr 12 19:40 context

    -r--r--r-- 1 root root 0 Apr 12 19:40 create

    t--r--r-- 1 root root 0 Apr 12 19:40 deny_unknown

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 disable

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 initial_contexts

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 load

    dr-rw-rw-rw. 1 root root 0 Apr 12 19:40 member

    dr-rw-rw-rw. 1 root root 0 Apr 12 19:40 mis

    crw-rw-rw- 1 root root 1, 3 Apr 12 19:40 null

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 policy

    dr-xr-xr-x. 2 root root 0 Apr 12 19:40 policy_capabilities

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 policivers

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 reject_unknown

    -rw-rw--r-- 1 root root 0 Apr 12 19:40 relabel

    -rw-rw-rw---- 1 root root 0 Apr 12 19:40 status

    -rw-rw-rw---- 1 root root 0 Apr 12 19:40 user

    ```


    Some files in /selinux appear with size 0, they often contain a boolean value.
    Check **/selinux/enforce** to see if selinux is running in enforced mode.


    ```

    [root@RHEL5 ~]# ls -l /selinux/enforce

    -rw-rw--r-- 1 root root 0 Apr 29 08:21 /selinux/enforce

    [root@RHEL5 ~]# echo $(cat /selinux/enforce)

    1

    ```


    # 19.13. identity


    The **SELinux identity** is distinct from the user ID. An identity is part of
    a security context, and via domains determines what a user can do. The screenshot
    shows **root having identity user_u**.


    ```

    [root@r5 ~]# id -z

    user_system_r:unconfined_t

    ```


    # 19.14. role


    The **selinux role** defines the domains that can be denied to a domain, unless
    the **role** is explicitly authorized to do so.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 19.15. type (or domain)


    The selinux context is the security context of a process. selinux type determines
    what a process can do. The screenshot shows it running in type init_t and the
    minget''s running in type getty_t.


    ```

    [root@centos65 ~]# ps fa -Z | grep /sbin/init\0:00 /sbin/init

    system_u:system_r:init_t:s0 1 S+

    [root@centos65 ~]# ps fa -Z | grep getty_t\00:00 /sbin/minget /dev/tty1

    system_u:system_r:getty_t:s0 1307 tty S+0:00 /sbin/minget /dev/tty2

    system_u:system_r:getty_t:s0 1309 tty S+0:00 /sbin/minget /dev/tty3

    system_u:system_r:getty_t:s0 1311 tty S+0:00 /sbin/minget /dev/tty4

    system_u:system_r:getty_t:s0 1314 tty S+0:00 /sbin/minget /dev/tty5

    system_u:system_r:getty_t:s0 1320 tty S+0:00 /sbin/minget /dev/tty6

    system_u:system_r:getty_t:s0 1322 tty S+0:00 /sbin/minget /dev/tty6

    ```


    The selinux type is similar to a selinux domain, but refers to directories and
    files instead of processes.


    Hundreds of ports have labels like:


    ```

    [root@centos65 ~]# netstat -nptlz | tr -s '' '' - '' | cut -d '' '' -f-6-

    Foreign Address State PID/Program Name Security Context

    LISTEN 1096/rpcbind system_u:system_r:rpcbind_t:s0-s0:c0123

    LISTEN 1208/sshd system_u:system_r:sshd_t:s0-s0:c0123

    LISTEN 1284/master system_u:system_r:rpcpost_master_t:s0-s0:c0123

    LISTEN 1166/statd system_u:system_r:rpcbind_t:s0-s0:c0123

    LISTEN 1096/rpcbind system_u:system_r:rpcbind_t:s0-s0:c0123

    LISTEN 1666/httpd undefined system_u:system_r:httpd_t:s0

    LISTEN 1208/sshd system_u:system_r:sshd_t:s0-s0:c0123

    LISTEN 1284/master system_u:system_r:rpcpost_master_t:s0

    ```


    Ports have a context.


    You can also get a list of ports by SELinux:


    ```

    [root@centos65 ~]# show port -l | tail

    fs_port_t tcp 7100

    xserver_port_t tcp 6000-6150

    zabbix_agent_port_t tcp 10050

    zabbix_port_t tcp 10051

    zarafa_port_t tcp 236, 237

    zebra_port_t tcp 2600-2604, 2606

    zebra_port_t udp 2600-2604, 2606

    zented_port_t tcp 1229

    zented_port_t udp 1229

    zope_port_t tcp 8021

    ```'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# 19.16. security context


    The combination of identity, role and domain or type make the selinux security
    context.

    The **id** will show you the security context in the form identity:role:domain.


    ```

    ```\paul@RHEL5 ~# id | cut -d'' '' -f4

    context=user_u:system_r:unconfined_t

    ```

    ```


    The **ls -z** command shows the security context for a file in the form identity:type.


    ```

    ```

    paul@RHEL5 ~# ls -z test

    -rw-rw-r-- paul paul user_u:object_r:user_home_t test

    ```

    ```


    The security context of processes in /proc defines both the type (of the file
    in /proc) and the domain (of the running process). Let''s take a look at the init
    process and /proc/


    The init process runs in domain **init_t**.


    ```

    ```

    root@RHEL5 ~# ps -ZC init

    LABEL                 PID TTY TIME CMD

    system_u:system_r:init_t  1    00:00:01 init

    ```

    ```


    The **/proc/1/** directory, which identifies the domain of the **init** process
    and has type **init_t**.


    ```

    ```

    paul@RHEL5 ~# ls -ld /proc/1/

    -dr-xr-xr-x root root system_u:system_r:init_t      /proc/1/

    ```

    ```


    It is not a coincidence that the domain of the **init** process and the type of
    **/proc/1/** are both **init_t**.


    Don''t try to use chchon on /proc/1. It will not work.


    # 19.17. transition


    An selinux transition (aka as selinux labelling) determines the security context
    that will be assigned. A transition of process domains is used when you execute
    a process. A transition of file type happens when you create a file.


    An example of file type transition.


    ```

    ```

    pol@centos65 ~# touch test /tmp/test

    pol@centos65 ~# ls -z test

    -rw-rw-r-- pol pol unconfined_u:object_r:user_home_t:s0 test

    pol@centos65 ~# ls -Z /tmp/test

    -rw-rw-r-- pol pol unconfined_u:object_r:user_tmp:s0 /tmp/test

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 19.18. extended attributes


    Extended attributes are made by selinux to store security contexts. These attributes
    can be viewed with ls when selinux is running.


    ```

    [root@RHEL5]# ls --context

    drwx-------

    p paul user:object_r:user_home_dir_t paul

    drwxr-xr-x root root user:object_r:user_home_dir_t project42

    drwxr-xr-x root root user:object_r:user_home_dir_t project55

    [root@RHEL5]# ls -d

    drwx------npaul user:object_r:user_home_dir_t paul

    drwxr-xr-x root root user:object_r:user_home_dir_t project42

    drwxr-xr-x root root user:object_r:user_home_dir_t project55

    [root@RHEL5]#

    ```


    When selinux is not running, then getattr is the tool to use.


    ```

    [root@RHEL5 etc]# getattr -m -d hosts

    # file: hosts

    security.selinux="system_u:object_r:etc:s0\000"

    ```


    # 19.19. process security context


    A option is to use ps to see the selinux security context of processes.


    ```

    [root@RHEL5 etc]# ps -Z cmingtty

    LABEL PID TTY TIME CMD

    system_u:system_r:getty_t 2941 tty1 00:00:00 mingetty

    system_u:system_r:getty_t 2942 tty2 00:00:00 mingetty

    ```


    # 19.20. chcon


    Use chcon to change the selinux security context.


    This example shows how to use chcon to change the type of a file.


    ```

    [root@RHEL5]# ls -z /var/www/html/test42.txt

    -rw-r--r-- root root user:object_r:httpd_sys_content_t /var/www/html/test4.txt

    [root@RHEL5]# chcon -t samba_share_t /var/www/html/test42.txt

    [root@RHEL5]# ls -z /var/www/html/test42.txt

    -rw-r--r-- root root user:object_r:samba_share_t /var/www/html/test42.txt

    ```


    Be sure to read mancon.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# 19.21. an example


    The Apache2 webserver is by default targeted with SELinux. The next screenshot
    shows any file created in /var/www/html will by default the httpd_sys_content_t
    type.


    ```

    [root@centos65 ~#] touch /var/www/html/test42.txt

    [root@centos65 ~#] ls -Z /var/www/html/test42.txt

    -rw-r--r-- root root unconfined-u:object_r:httpd_sys_content_t:s0 /var/www/html/test42.txt

    ```


    Files created elsewhere do not get this.


    ```

    [root@centos65 ~#] touch /root/test42.txt

    [root@centos65 ~#] ls -Z /root/test42.txt

    -rw-r--r-- root root unconfined-u:object_r:admin_home_t:s0 /root/test42.txt

    ```


    Make sure Apache2 runs.


    ```

    [root@centos65 ~#] service httpd restart

    Stopping httpd:

    [ OK ]

    Starting httpd:

    [ OK ]

    ```


    Will this work? Yes it does.


    ```

    [root@centos65 ~#] wget http://localhost/test42.txt

    --2014-04-12 20:56:47-- http://localhost/test42.txt

