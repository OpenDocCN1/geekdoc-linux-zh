    RT 77.155.93.188.in-addr.arpa (44)

    11:01:29.640093 IP 192.168.1.42.domain > 192.168.101.302041: 14763 1/

    0 PTR antares.ginsys.net.

    ```


    And here is what it looks like wireshark (note this is not an screenshot).


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---||

    | 280 | 172.307847 | 192.168.1.30 | 212.71.8.10 | DNS | Standard query PTR 100.30.63.178.in-addr.arpa
    |

