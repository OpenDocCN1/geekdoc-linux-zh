  md: "# 3.4. mysql tables\n\n# 3.4.1. listing tables\n\nYou can see a list of tables\
    \ in the current database with the **show tables;** command. Our **famouspeople**\
    \ database has no tables yet.\n\n```\nmysql> use famouspeople;\nDatabase changed;\n\
    mysql> show tables;\nEmpty set (0.00 sec)\n```\n\n# 3.4.2. creating a table\n\n\
    The **create table** command will create a new table.\nThis screenshot shows the\
    \ creation of a country table. We use the **countrycode** as a **primary key**\
    \ (all country codes are uniquely defined). Most countries are two or three letters,\
    \ a **char** of three uses less than a **varchar** of three. The **Country name**\
    \ and the name of the capital are both defined as **varchar**. The population\
    \ can be seen as an **integer.**\n\n```\nmysql> create table country {\n  -> countrycode\
    \ char(3) NOT NULL,\n  -> countryname varchar(70) NOT NULL,\n  -> population int,\n\
    \  -> countrycapital varchar(50),\n  -> primary key (countrycode)\n  );\nnQuery\
    \ OK, 0 rows affected (0.19 sec)\n\nmysql> show tables;\n```\n\n+--------------------------------------+\n\
    | Tables_in_famouspeople |\n+--------------------------------------+\n| country\
    \                               |\n+--------------------------------------+\n\
    1 row in set (0.00 sec)\n\n```\nmysql>\n\nYou are allowed to type the **create\
    \ table** command on one long line, but administrators often use multiple lines\
    \ to improve readability.\n\nmysql> create table country { countrycode char(3)\
    \ NOT NULL, countryname\\nvarchar(70) NOT NULL, population int, countrycapital\
    \ varchar(50), prim\\nary key (countrycode);\nQuery OK, 0 rows affected (0.18\
    \ sec)\n```"
