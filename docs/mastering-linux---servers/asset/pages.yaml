  md: "# 1.8 troubleshooting apache\n\nWhen apache restarts, it will verify the syntax\
    \ of files in the configuration folder /etc/apache2 on debian or /etc/httpd on\
    \ CentOS and it tell you the name of the faulty file,\nt line number and an explanation\
    \ of the error.\n\n```\nroot@debian:~# service apache2 restart\napache2: Syntax\
    \ error on line 28 of /etc/apache2.conf: Syntax error o\\n line 1 of /etc/apache2/sites-enabled/chessclub42:\
    \ /etc/apache2/sites-enabled/ches\\n/chessclub42:4: <VirtualHost> was not closed.<chessclub42:1:\
    \ <VirtualHost> was not closed.\nAction: \"configtest\" failed.\nThe Apache error\
    \ log may have more information.\nfailed!\n```\n\nBelow you see the problem...\
    \ a missing / on line 4.\n\n```\nroot@debian:~# # cat /etc/apache2/sites-available/chessclub42\n\
    <VirtualHost *:8000>\n    ServerAdmin webmaster@localhost\n    DocumentRoot /var/www/chessclub42\n\
    </VirtualHost>\n```\n\nLet us force another error by renaming the directory of\
    \ one of our websites:\n\n```\nroot@debian:~# # mv /var/www/choochoo/ /var/www/choochoo\n\
    root@debian:~# ! iser\nservice apache2 restart\nRestarting web server: apache2Warning:\
    \ DocumentRoot [/var/www/choochoo] does n\\not exist\nWarning: DocumentRoot [/var/www/choochoo]\
    \ does not exist\n... waiting Warning: DocumentRoot [/var/www/choochoo] does not\
    \ exist\nWarning: DocumentRoot [/var/www/choochoo] does not exist\n.\n```\n\n\
    As you can see, apache will tell you what exactly is wrong.\n\nYou can also troubleshoot\
    \ by connecting to the website via a browser and checking the apache log files\
    \ in /var/log/apache."
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 1.9. virtual hosts example


    Below is a sample virtual hosts configuration. This virtual hosts overrules the
    default Apache ErrorDocument directive.


    ```

    <VirtualHost 83.217.76.245:80>

    ServerName cobbatt.be

    ServerAlias www.cobbatt.be

    DocumentRoot /home/paul/public_html

    ErrorLog /home/paul/logs/error_log

    CustomLog /home/paul/logs/access_log common

    ScriptAlias /cgi-bin/ /home/paul/cgi-bin/

    <Directory /home/paul/public_html>

    Options IncludesNOEXEC FollowSymLinks

    allow from all

    </Directory>

    ErrorDocument 404 http://www.cobbatt.be/cobbatt.php

    </VirtualHost>

    ```


    # 1.10. aliases and redirects


    Apache supports aliases for directories, like this example shows.


    ```

    Alias /paul/ "/home/paul/public_html/"

    ```


    Similarly, content can be redirected to another website or web server.


    ```

    Redirect permanent foo http://www.foo.com/bar

    ```


    # 1.11. more on .htaccess


    You can do more with .htaccess. One example is to use .htaccess to prevent from
    certain domains to access your website. Like in this case, where a number of referers
    are blocked by the website.


    ```

    paul@~:/cobbatt.be$ cat .htaccess

    # Options +followsymlinks

    RewriteEngine On

    RewriteCond %{HTTP_REFERER} ^://(www\.)buy-adipex.fw.nu.*$ [OR]

    RewriteCond %{HTTP_REFERER} ^://(www\.)buy-levitra.asso.we.*$ [NC,OR]

    RewriteCond %{HTTP_REFERER} ^://(www\.)buy-tramadol.fw.nu.*$ [NC,OR]

    RewriteCond %{HTTP_REFERER} ^://(www\.)buy-viagra.lookin.at.*$ [NC,OR]

    RewriteCond %{HTTP_REFERER} ^://(www\.)?www.healthinsurancehelp.net.*$ [NC]

    RewriteRule .* - [F]

    paul~:/cobbatt.be$

    ```


    # 1.12. traffic


    Apache keeps a log of all visitors. The webalizer is often used to parse this
    log into html statistics.'
  merge: -1
  img_proc: true
