  md: '# 11.5. a note on netcat


    The Windows command line screenshot is made in a Linux console, using **netcat**
    as a pipe to a Windows command shell.


    The way this works, is by enabling netcat to listen on the windows computer to
    a certain port, executing cmd.exe when a connection is received. Netcat is similar
    to cat, in the way that cat does nothing, only netcat does nothing over the network.


    To enable this connection, type the following on the windows computer (after downloading
    netcat for windows).


    ```

    nc -l -p 23 -t -e cmd.exe

    ```


    And then connect to this machine with netcat from any Linux computer. You end
    up with a cmd.exe prompt inside your Linux shell.


    ```

    paul@blalka:-$ nc 192.168.1.38 23

    Microsoft Windows [Version 5.2.3790]

    (C) Copyright 1985-2003 Microsoft Corp.


    C:\>net use k: /delete

    net use k: /delete

    k: was deleted successfully.

    ```'
  merge: -1
  img_proc: true
