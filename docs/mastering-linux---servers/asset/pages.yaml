  md: "```\npaul@debian6~~/project42$ git add question.sh\npaul@debian6~~/project42$\
    \ git status\n# On branch master\n#\n# Initial commit\n#\n# Changes to be committed:\n\
    # (use git rm --cached <file>...) to unstage\n#\n# new file: question.sh\n#\n\
    ```\n\nThe git status tells us there is a new file ready to be committed.\n\n\
    #  20.3.4. git commit\n\nWith git commit you force git to record all added files\
    \ (and all changes to those files) permanently.\n\n```\npaul@debian6~~/project42$\
    \ git commit -m \"starting a project\"\n[master (root-commit) 5c1768] starting\
    \ a project\n1 file changed, 1 insertion(+)\ncreate mode 100644 question.sh\n\
    paul@debian6~~/project42$ git status\n# On branch master\nnothing to commit (working\
    \ directory clean)\n```\n\n#  20.3.5. changing a committed file\n\nThe screenshots\
    \ show below several steps. First we change a file:\n\n```\npaul@debian6~~/project42$\
    \ git status\n# On branch master\nnothing to commit (working directory clean)\n\
    paul@debian6~~/project42$ vi question.sh\n```\n\nThen we verify the status and\
    \ see that it is modified:\n\n```\npaul@debian6~~/project42$ git status\n# On\
    \ branch master\n# Changes not staged for commit:\n# (use \"git add <file>\" to\
    \ update what will be committed)\n# (use \"git checkout --<file>\" to discard\
    \ changes in working directory)\n# modified:\n  question.sh\nno changes added\
    \ to commit (use \"git add\" and/or \"git commit -a\")\n```\n\nNext we add it\
    \ to the repository.\n\n```\npaul@debian6~~/project42$ git add question.sh\npaul@debian6~~/project42$\
    \ git commit -m \"adding a she-bang to the main script\"\n[master 8b6b3a1] adding\
    \ a she-bang to the main script\n1 file changed, 1 insertion(+)\npaul@debian6~~/project42$\
    \ git status\n# On branch master\nnothing to commit (working directory clean)\n\
