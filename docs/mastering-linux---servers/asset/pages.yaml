    Server: 192.168.1.42

    Address: 192.168.1.42#53


    Non-authoritative answer:

    87.155.93.188.in-addr.arpa      name = antares.ginsys.net.

    ```


    This is what a reverse lookup looks like when sniffing with tcpdump.


