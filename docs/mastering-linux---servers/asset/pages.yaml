- pgno: 153
  md: '# 10.1. /etc/samba/smbd.conf


    # 10.1.1. smbd -b


    Samba configuration is done in the smb.conf file. The file can be edited manually,
    or you can use a web based interface like webmin to manage it. The file is usually
    located in /etc/samba. You can find the exact location with smbd -b.


    ```

    [root@RHEL4 ~]# ls smbd -b | grep CONFIGFILE

    CONFIGFILE:/etc/samba/smbd.conf

    ```


    # 10.1.2. the default smb.conf


    The default smb.conf file contains a list of examples with explanations.


    ```

    [paul@RHEL4 ~]# ls -l /etc/samba/smbd.conf

    -rw-r--r-- 1 root 10386 May 30 23:08 /etc/samba/smbd.conf

    ```


    On Ubuntu and Debian, smb.conf is packed with samples and explanations.


    ```

    [paul@laika:~]# ls -l /etc/samba/smbd.conf

    -rw-r--r-- 1 root 10515 2007-05-24 00:21 /etc/samba/smbd.conf

    ```


    # 10.1.3. minimal smbd.conf


    Below is an example of a very minimalistic smbd.conf. It allows samba to talk,
    and to be visible to other computers (Microsoft shows computers in Network Neighborhood
    or My Network Places).


    ```

    [paul@RHEL4 ~]# cat /etc/samba/smbd.conf

    [global]

    group = WORKGROUP

    [firstshare]

    path = /srv/samba/public

    ```


    # 10.1.4. net view


    Below is a screenshot of the net view command on Microsoft Windows Server 2003
    sp2. It shows how a Red Enterprise Linux 5.3 and a Ubuntu 9.04 Samba server, both
    with a minimalistic smbd.conf, are visible to Microsoft computers nearby.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_153_0.png)


    # 10.1.5. long lines in smbd.conf


    Some parameters in smbd.conf can contain a list of values behind them. You can
    continue a line (for clarity) on the next by ending the line with a backslash
    \


    ```

    valid users = Serena, Venus, Lindsay \

    ```'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 10.1.6. smb.conf


    Curious but true: smb.conf accepts synonyms like create mode and create mask,
    and (sometimes) missing errors can be browsable and browseable. On and occasion
    you can switch words, the guest only parameter is identical to only guest. Writable
    = yes is the same as the readonly = no.


    # 10.1.7. man smb.conf


    You can access a lot of documentation when man smb.conf.


    ```

    [root@RHEL4b samba]# apropos samba

    cupsaddmb -8 export printers for samba for windows clients

    imhosts -5 The Samba NetBIOS file

    net -8 for administration of Samba and remote CIFS servers

    -8 manage the SAM database (Database of Samba Users)

    pdbdeit -7 A Windows Samba/CIFS fileserver for UNIX

    samba -5 smb.confconf] The configuration file for the Samba suite

    smbpasswd -5 Samba user and password file

    smbstatus -8 report on current Samba connections

    swat -8 Samba Web Administration Tool

    tdbbackup -8 tool for backing up and ... of samba .tdb files

    [root@RHEL4b samba]#

    ```


    # 10.2/usr/bin/testpar


    # 10.2.1. syntax check smb.conf


    To verify the syntax of the smb.conf file, you can use testpar.


    ```

    [paul@RHEL4b]$ testpar

    Load smb config files from /etc/samba/smb.conf

    Processing section "[firstshare]"

    Loaded services file OK.

    Server role: ROLE_STANDALONE

    Press enter to see a dump of your service definitions

    ```


    # 10.2.2. testpar -v


    An interesting option is testpar -v, which will output all the global options
    with their default value.


    ```

    [root@RHEL5b]# testpar -v | head

    Load smb config files from /etc/samba/smb.conf

    Processing section "[pub0]"

    Processing section "[global]"

    Loaded services file OK.

    Server role: ROLE_STANDALONE

    Press enter to see a dump of your service definitions

    ```


    ```

    [global]

    dos charset = CP850

    unix charset = UTF-8

    display charset = LOCALE

    workgroup = WORK

    ```'
