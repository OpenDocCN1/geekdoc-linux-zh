- pgno: 157
  md: '# 10.4. /usr/bin/smbtree


    Another useful tool to troubleshoot Samba or simply to browse the SMB network
    is smbtree. In its simplest form, smbtree will do an anonymous browsing on the
    local subnet, displaying all SMB computers and (if authorized) shares.


    Let''s take a look at two screenshots of smbtree in action (with blank password).
    The first one is taken immediately after booting four computers (one MS Windows
    2000, one MS Windows 2003 and one RHEL 4 with Samba 3.10).


    ```

    [paul@RHEL4b ~]$ smbtree

    Password:

    WORKGROUP

    \WINXP

    \RHEL4B Pegasus Domain Member Server

    Error connecting to 127.0.0.1 (Connection refused)

    cli_connection: failed to connect to RHEL4B<20> (127.0.0.1)

    \HM203

    [paul@RHEL4b ~]$

    ```


    The information displayed in the previous screenshot looks incomplete. The browsing
    elections are still ongoing, the browse list is not distributed to all clients
    by the (to be elected) browser master. The next screenshot was taken about one
    minute later. And it shows less even.


    ```

    [paul@RHEL4b ~]$ smbtree

    Password:

    WORKGROUP

    \W2000

    [paul@RHEL4b ~]$

    ```


    So we wait a little, and then smbtree again, this time it looks a lot nicer.


    ```

    [paul@RHEL4b ~]$ smbtree

    Password:

    WORKGROUP

    \W2000

    PEGASUS

    \WINXP

    Pegasus Domain Member Server

    \RHEL4\ADMIN$

    IPC Service (Pegasus Domain Member Server)

    \RHEL4\IPC$

    Active Directory users only

    \RHEL4\domainindata

    \HM203

    [paul@RHEL4b ~]$ smbtree --version

    Version 3.0.10-1.4.9

    [paul@RHEL4b ~]$

    ```


    I added the version number of smbtree in the previous screenshot, to show the
    difference when using the latest version of smbtree (below a screenshot taken
    from Ubuntu Feisty Fawn). The latest version shows a more complete overview of
    machines and shares.


    ```

    paul@laika:-$ smbtree --version

    Version 3.0.24

    ```'
