- pgno: 69
  md: '# 4.1.4. /etc/resolv.conf


    A client computer needs to know the ip address of the dns server to be able to
    send queries to it. This is either provided by a dhcp server or manually entered.


    Linux clients keep this information in the /etc/resolv.conf file.


    ```

    root@debian7:~# cat /etc/resolv.conf

    domain linux-training.be

    search linux-training.be

    nameserver 192.168.1.42

    root@debian7~#

    ```


    You can manually change the ip address in this file to use another dns server.
    For example Google provides a public name server at 8.8.8.8 and 8.8.4.4.


    ```

    root@debian7:~# cat /etc/resolv.conf

    nameserver 8.8.8.8

    root@debian7~#

    ```


    Please note that on dhcp clients this value can be overwritten when the dhcp lease
    is renewed.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# ## 4.2. dns namespace


    # ### 4.2.1. hierarchy


    The **dns namespace** is hierarchical tree structure, with the **root servers**
    (aka dot-servers) at the top. The **root servers** are usually represented by
    a dot.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_70_0.png)


    Below the **root-servers** are the **Top Level Domains** or tld''s.


    There are more tld''s than shown in the picture. Currently about 200 countries
    have a tld. And there are several general tld''s like .com, .edu, .org, .gov,
    .net, .mil, .int and more recently .aero, .info, .museum, ...


    # ## 4.2.2. root servers


    There are thirteen **root servers** on the internet, they are named A to M. Journalists
    often refer to these servers as the **master servers of the internet**, because
    if these servers go down, then nobody can (use names) connect to websites.


    The root servers are not thirteen physical machines, they are many more. For example
    the **F root server** consists of 46 physical machines that all behave as one
    (using anycast).


    ```

    http://root-servers.org

    http://f.root-servers.org

    http://en.wikipedia.org/wiki/Root_nameserver.

    ```'
  merge: -1
  img_proc: true
- pgno: 71
