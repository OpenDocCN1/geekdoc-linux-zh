    # ## 1.5.2. three extra virtual hosts\n\nIn this scenario we create three additional\
    \ websites for three customers that share a clubhouse and to join you here. They\
    \ are a model train club Choo Choo, a chess club named Chess 42 and a hakerspace\
    \ named hunter2.\n\nOne way to put three websites on one web server, is to put\
    \ each website on a different port. This screenshot shows three newly created\
    \ virtual hosts, for each customer.\n\n```\n[root@CentOS65] ~# vi /etc/httpd/conf.d/choochoo.conf\n\
    [root@CentOS65] ~# cat /etc/httpd/conf.d/choochoo.conf\n<VirtualHost *:7000>\n\
    \  ServerAdmin webmaster@localhost\n  DocumentRoot /var/www/html/choochoo\n</VirtualHost>\n\
    [root@CentOS65] ~# vi /etc/httpd/conf.d/chessclub42.conf\n[root@CentOS65] -# cat\
    \ /etc/httpd/conf.d/chessclub42.conf\n<VirtualHost *:8000>\n  ServerAdmin webmaster@localhost\n\
    \  DocumentRoot /var/www/html/chessclub42\n</VirtualHost>\n[root@CentOS65] ~#\
    \ vi /etc/httpd/conf.d/hunter2.conf\n[root@CentOS65] -# cat /etc/httpd/conf.d/hunter2.conf\n\
    <VirtualHost *:9000>\n  ServerAdmin webmaster@localhost\n  DocumentRoot /var/www/html/hunter2\n\
    </VirtualHost>\n```\n\nNotice the difference port numbers 7000, 8000 and 9000.\
    \ Notice also that we specified a unique DocumentRoot for each website.\n\n# ##\
    \ 1.5.3. three extra ports\n\nWe need to enable these three ports on apache in\
    \ the httpd.conf file.\n\n```\n[root@CentOS65] ~# vi /etc/httpd/conf/httpd.conf\n\
    root@debian:-# grep \"Listen\" /etc/httpd/conf/httpd.conf\nListen 80\nListen 7000\n\
    Listen 8000\nListen 9000\n```"
