- pgno: 10
  md: '# # Chapter 1. apache web server


    In this chapter we learn how to setup a web server with the **apache** software.


    According to NetCraft (http://news.netcraft.com/archives/web_server_survey.html)
    about seventy percent of all web servers are running on Apache. The name is derived
    from a **patchy** web server, because of all the patches people wrote wrote for
    the NCSA httpd server.


    Later chapters will expand this web server into a LAMP stack (Linux, Apache, Mysql,
    Perl/PHP/Python).'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 1.1. introduction to apache


    # 1.1.1. installing on Debian


    This shows that there is no apache server installed, nor does the /var/www directory
    exist.


    ```

    root@debian:~# ls -l /var/www

    ls: cannot access /var/www: No such file or directory

    root@debian:~# dpkg -l | grep apache

    ```


    To install apache on Debian:


    ```

    root@debian:~# aptitude install apache2

    The following NEW packages will be installed:

    apache2-mpn-worker(a) apache2-utils(a) apache2.2-bin(a) apache2.2-com-

    mon(a) libapr1(a) libaprutill(a) libaprutill-dbd-sqlite3(a) libaprutill-ldap(a)

    ssl(a)

    0 packages upgraded, 10 newly installed, 0 to remove and 0 not upgraded.

    Need to get 1,487 kB of archives. After unpacking 5,673 kB will be used.

    Do you want to continue? [Y/n]

    ```


    After installation, the two commands above will yield a different result:


    ```

    root@debian:~# ls -l /var/www

    total 4

    -rw-r--r-- 1 root 177 Apr 29 11:55 index.html

    root@debian:~# dpkg -l | grep apache | tr -s '' ''

    ii apache2.2.22-13+deb7ul amd64 Apache HTTP Server metapackage

    ii apache2-mpn-worker 2.2.22-13+deb7ul amd64 Apache HTTP Server - high speed th\

    read model

    ii apache2-utils 2.2.22-13+deb7ul amd64 utility programs for webservers

    ii apache2.2-bin 2.2.22-13+deb7ul amd64 Apache HTTP Server common binary files

    ii apache2.2-common 2.2.22-13+deb7ul amd64 Apache HTTP Server common files

    ```'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 1.1.2. installing on RHEL/CentOS


    Note that Red Hat distributed distributions use httpd as package and process name
    instead of apache.


    To verify whether apache is installed in CentOS/RHEL:


    ```

    [root@centos65 ~]# rpm -q httpd

    package httpd is not installed

    [root@centos65 ~]# ls -l /var/www

    ls: cannot access /var/www: No such file or directory

    ```


    To install apache on CentOS:


    ```

    [root@centos65 ~]# yum install httpd

    ```


    After running the yum install httpd command, the Centos 6.5 server has apache
    installed at /var/www directory exists.


    ```

    [root@centos65 ~]# rpm -q httpd

    httpd-2.2.15-30.el6.centos.x86_64

    [root@centos65 ~]# ls -l /var/www

    total 16

    drwxr-xr-x. 2 root 4096 Apr 3 23:57 cgi-bin

    drwxr-xr-x. 2 root 4096 May 6 13:08 error

    drwxr-xr-x. 3 root 4096 Apr 3 23:57 html

    drwxr-xr-x. 3 root 4096 May 6 13:08 icons

    [root@centos65 ~]#

    ```'
  merge: -1
  img_proc: true
- pgno: 13
  md: "# 1.1.3. running apache on Debian\n\nThis is how you start apache2 on Debian.\n\
    \n```\nroot@debian7:~# service apache2 status\nApache2 is NOT running.\nroot@debian7:~#\
    \ service apache2 start\nStarting web server: apache2:Could not reliably determine\
    \ the server's \\ \nfully qualified domain name, using 127.0.0.1 for ServerName\n\
    ```\n\nTo verify, run the apache2 status command or use ps.\n\n```\nroot@debian7:~#\
    \ service apache2 status\nApache2 is running (pid 3680)\nroot@debian7:~# ps -C\
    \ apache2\nPID TIME CMD\n3680 ? 00:00:00 apache2\n3683 ? 00:00:00 apache2\n3684\
    \ ? 00:00:00 apache2\n3685 ? 00:00:00 apache2\nroot@debian7:~#\n```\n\nOr use\
    \ wget and file to verify that your web server serves an html document.\n\n```\n\
    root@debian7:~# wget 127.0.0.1\n--2014-05-06 13:27:02-- http://127.0.0.1/\n--Connecting\
    \ to 127.0.0.1:80... connected.\nHTTP request sent, waiting response... 200 OK\n\
    Length: 177 [text/html]\nSaving to: 'index.html'\n```\n\n```\n100[=================================================>]\
    \ 177 --K/s in 0s\n2014-05-06 13:27:02 'index.html' saved [177/177]\nroot@debian7:~#\
    \ file index.html\nindex.html: HTML document, ASCII text\nroot@debian7:~#\n```\n\
    \nOr verify that apache is running by opening a web browser, and browse to the\
    \ ip-address of your server. An Apache test page should be shown.\n\nYou can do\
    \ the following to quickly avoid the 'could not reliably determine the fdn' message\
    \ when restarting apache.\n\n```\nroot@debian7:~# echo ServerName Debian7 >> /etc/apache2/apache2.conf\n\
    root@debian7:~# service apache2 restart\nRestarting web server: apache2 ... waiting\n\
    root@debian7:~#\n```"
  merge: -1
  img_proc: true
- pgno: 14
  md: "# 1.1.4. running apache on CentOS\n\nStarting the httpd on RHEL/CentOS is done\
    \ with the service command.\n\n```\n[root@centos65 ~]# service httpd status\n\
    httpd stopped\n[root@centos65 ~]# service httpd start\nStarting httpd: Could not\
    \ reliably determine the server's fully qualified domain name, using 127.0.0.1\
