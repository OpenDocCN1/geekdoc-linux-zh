- pgno: 37
  md: "# # 1.14. self signed cert on RHEL/CentOS\n\nBelow is a quick way to create\
    \ a self signed cert for https on RHEL/CentOS. You may need these packages:\n\n\
    ```\nroot@paulserver ~]# yum install openssl mod_ssl\nLoaded plugins: fastestmirror\n\
    Loading mirror speeds from cached hostfile\n  * base: ftp.belnet.be\n  * extras:\
    \ ftp.belnet.be\n  * update: mirrors.centos.com             | 3.7 KB      00:00\n\
    base\nSetting up Install Process\npackage httpd-2.2.15-31.el6.x86_64 already installed\
    \ and latest version\npackage openssl-1.0.1e-15.el6.x86_64 already installed and\
    \ latest version\npackage mod_ssl-2.2.15-31.el6.centos.x86_64 already ins in...\
    \ and latest version\nNothing to do\n```\n\nWe use **openssl** to create the certificate.\n\
    \n```\nroot@paulserver ~]# mkdir certs\nroot@paulserver ~]# cd certs\nroot@paulserver\
    \ ~]# openssl genrsa -out ca.key 2048\nGenerating RSA private key, 2048 bit modulus\n\
    ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++\nmod is 65537 (0x0001)\n\
    root@paulserver ~]# openssl req -new -key ca.key -out ca.csr\nYou are asked to\
    \ enter information that will be incorporated\ninto your certificate requests\n\
    What you are asked to enter is called a Distinguished Name or a DN.\nThere are\
    \ quite a few fields but you can leave some blank\nFor some fields there will\
    \ be a default value,\nIf you leave '.', the field will be left blank.\n-----------------------------------------------------------------------\n\
    Country Name (2 letter code) [XX]:BE\nState or Province Name [full name]:antwerp\n\
    Locality Name (eg, city) [Default]:antwerp\nOrganization Name (eg, company) [Default\
    \ Ltd]:antwerp\nOrganizational Unit Name (eg, section):\nCommon Name (eg, your\
    \ or your server's hostname):paulserver\nEmail Address:\n```\n\nPlease enter the\
    \ following 'extra' attributes\nto be sent with your certificate request\nchallenge\
    \ password []:\nAn optional company name []:\n\n```\nroot@paulserver ~]# openssl\
    \ req -x509 -new -days 365 -in ca.csr -signkey ca.key\nout ca.crt\nSignature ok\n\
    subject=/C=BE/ST=antwerp/L=antwerp/O=antwerp/CN=paulserver\nGetting Private key\n\
    ```\n\nWe copy the keys to the right location (You may be missing SELLinux info\
    \ here).\n\n```\nroot@paulserver ~]# cp ca.crt /etc/pki/tls/certs/\nroot@paulserver\
    \ ~]# cp ca.key /etc/pki/tls/private/\n```\n\nWe add the location of our keys\
    \ to the file, and also add the NameVirtualHost *:443\ndirective.\n\n```\nroot@paulserver\
    \ ~]# vi /etc/httpd/conf.d/ssl.conf\n```"
  merge: -1
  img_proc: true
