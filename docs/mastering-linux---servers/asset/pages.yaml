- pgno: 50
  md: '# Chapter 3. introduction to sql using mysql


    mysql is a database server that understands Structured Query Language (SQL). MySQL
    was developed by the Swedish Company MySQL AB. The first release was in 1995.
    In 2008 MySQL AB was bought by Sun Microsystems (which is now owned by Oracle).


    mysql is very popular for websites in combination with php apache (the m in lamp
    servers), but mysql is also used in organizations with huge databases like Facebook,
    Flickr, Google, Nokia, Wikipedia and Youtube.


    This chapter will teach you sql by creating and using small databases, tables,
    queries and a simple trigger in a local mysql server.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 3.1. installing mysql


    On Debian/Ubuntu you can use aptitude install mysql-server to install the mysql
    server and client.


    ```

    root@ubuntu204#$ aptitude install mysql-server

    The following NEW packages will be installed:

    libdcb0-mysql-perl(a) libdcb0-perl(a) libhtmml-template-perl(a)

    libnet-daemon-perl(a) libmysqlprpc-perl(a) mysql-client-5.5(a)

    mysql-client-core-5.5(a) mysql-server mysql-server-5.5(a)

    mysql-server-core-5.5(a)

    0 packages upgraded, 10 newly installed, 0 to remove and 1 not upgraded.

    Need to get 25.5 MB of archives. After unpacking 84.4 MB will be used.

    Do you want to continue? [Y/n]

    ```


    During the installation you will be asked to provide a password for the root mysql
    user, remember this password (or use hunter2 like i do).


    To verify the installed version, use dpkg -l on Debian/Ubuntu. This screenshot
    shows version 5.0.


    ```

    root@ubuntu204#$ dpkg -l mysql-server | tail -1 | tr -s '' '' | cut -c-72

    i mysql-server 5.5.24-0ubuntu0.12.04.1 MySQL database server (metapacka)

    ```


    Issue rpm -q to get version information about MySQL on Red Hat/Fedora/CentOS.


    ```

    [paul@RHEL52 ~]$ rpm -q mysql-server

    mysql-server-5.0.45-7.el5

    ```


    You will need at version 5.0 to work with triggers.'
