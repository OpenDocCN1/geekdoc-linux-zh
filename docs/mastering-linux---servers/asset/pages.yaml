- pgno: 233
  md: '# 20.1. git


    Linus Torvalds created git back in 2005 when Bitkeeper changed its license and
    the Linux kernel developers were no longer able to use it for free.


    git quickly became popular and is now the most widely used distributed version
    control system in the world.


    Geek and Poke demonstrates why we need version control (image property of Geek
    and Poke CCA 3.0).


    # SIMPLY EXPLAINED


    ![](img/1d499a6177836f6f088a9e2a53e11a14_233_0.png)


    Besides source code for software, you can also find German and Icelandic law on
    github (and probably much more by the time you are reading this).'
  merge: -1
  img_proc: true
- pgno: 234
  md: "# 20.2. installing git\n\n```\nWe install debian6:~ aptitude install git as\
    \ seen in this screenshot of Debian 6.\nroot@debian6:~# aptitude install git\n\
    The following NEW packages will be installed:\ngit libcurl13-gnutls(a) liber-perl(a)\n\
    0 packages upgraded, 3 newly installed, 0 to remove and 0 not upgraded.\n...\n\
    Processing triggers for man-db\nSetting up libcurl13-gnutls (7.21.0-2.1+squeeze2)\n\
    Setting up liber-perl (0.17-1)\nSetting up git (1.7.2.5-3) \n...\n```\n\n# 20.3.\
    \ starting a project\n\nWe create a project directory, with a simple file in\n\
    \n```\npaul@debian6-$# mkdir project42\npaul@debian6-$# cd project42/\npaul@debian6~/project42$#\
    \ echo \"The answer is 42.\" >> question.sh\n```\n\n# 20.3.1. init git\n\nThen\
    \ we get to create an empty git repository in this directory.\n\n```\npaul@debian6~/project42$\
    \ ls -la\ntotal 16\ndrwxr-xr-x 3 paul 4096 Dec 8 16:44 .\ndrwxr-xr-x 6 paul 4096\
    \ Dec 8 16:44 ..\n-rw-r--r-- 1 paul 23 Dec 8 16:41 question.sh\n\npaul@debian6~/project42$#\
    \ git init\nInitialized empty Git repository in /home/project42/.\npaul@debian6~/project42$#\
    \ ls -la\ntotal 16\ndrwxr-xr-x 3 paul 4096 Dec 8 16:44 .\ndrwxr-xr-x 6 paul 4096\
    \ Dec 8 16:44 ..\ndrwxr-xr-x 7 paul 4096 Dec 8 16:44 .git\n-rw-r--r-- 1 paul 23\
    \ Dec 8 16:41 question.sh\n```\n\n# 20.3.2. git config\n\nNext use git config\
    \ to set some global options.\n\n```\npaul@debian6~$# git config --global user.name\
    \ Paul\npaul@debian6~$# git config --global user.email \"paul.cobbaut@gmail.com\"\
    \npaul@debian6~$# git config --global core.editor vi\n```\n\nWe can verify this\
    \ config in ~/.gitconfig:\n\n```\npaul@debian6~/project42$# cat ~/.gitconfig\n\
    [user]\nname = Paul\nemail = paul.cobbaut@gmail.com\n[core]\neditor = vi\n```\n\
    \n# 20.3.3. git add\n\nNow time to add all to with git add, and verify that it\
    \ is added with git status."
