- pgno: 101
  md: "# 5.4. example: split-horizon dns\n\nSuppose you want to answer dns queries\
    \ depending on who is asking. For example when someone from the 10.104.15.0/24\
    \ network (managed by Jesse) asks for the A record www.paul.local then dns answers\
    \ with 10.104.33.30. But when someone from the 10.104.42/04 network (managed by\
    \ Keith) asks for the same A record of www.paul.local he will get 10.104.33.31\
    \ as an answer.\n\nA split-horizon setup can be used to redirect answer to local\
    \ copies of certain services.\n\nIn this example we want to decide on specific\
    \ answers for two networks (Jesse's and Keith's) and prevent them from using our\
    \ dns server for recursion, while maintaining the capability to resolve the internet\
    \ and paul.local zone from our own.\n\nWe start by creating three views in named.conf.local\n\
    \n```\nroot@debian7:/etc/bind# cat named named.conf.local\nview \"paul\" {\nmatch-clients\
    \ { 10.104.33.30; localhost; };\ninclude \"/etc/bind/named.conf.default-zones\"\
    ;nzone \"paul.local\" IN {\n  type master;\n  file \"/etc/bind/db.paul.local\"\
    ;n  allow-update ( none );\n  \n// end view internal\n}\nview \"jesse\" {\nmatch-clients\
    \ { 10.104.15/24; };\nzone \"paul.local\" IN {\n  type master;\n  file \"/etc/bind/db.paul.local.jesse\"\
    ;n  allow-update ( none );\n  \n// end view jesse\n}\nview \"keith\" {\nmatch-clients\
    \ { 10.104.42/24; };\nzone \"paul.local\" IN {\n  type master;\n  file \"/etc/bind/db.paul.local.keith\"\
    ;n  allow-update ( none );\n  \n// end view\n}\n```\n\nNote that we included the\
    \ default-zones in the internal zone. It is mandatory to put all zones inside\
    \ when using a view.\n\nThe zone files are identical copies, except for the www\
    \ record. You can see that the round robin is active for internal users, computers\
    \ from 10.104.15.0/24 (Jesse) will always receive 10.104.33.30 while computers\
    \ from 10.104.42/0 (Keith) will receive 10.104.33.31.\n\n```\nroot@debian7:/etc/bind#\
    \ grep www db.paul.local db.paul.local. [jk]*\ndb.paul.local:www      IN A 10.104.33.30\n\
    db.paul.local:www      IN A 10.104.33.31\ndb.paul.local:jesse   IN A 10.104.33.30\n\
    db.paul.local:keith IN A 10.104.33.31\n```\n\n*"
  merge: -1
  img_proc: true
