  md: '# 17.13. practice: samba domain controller


    +   1. Setup Samba as a domain controller.

    2. Create the shares salesdata, salespresentations and meetings. Salesdata must
    be accessible to all sales people and to all managers. SalesPresentations is only
    for all sales people. Meetings is only accessible to all managers. Use groups
    to accomplish this.

    3. Join a Microsoft computer to your domain. Verify the creation of a computer
    account in /etc/passwd.

    4. Setup and verify the proper working of roaming profiles.

