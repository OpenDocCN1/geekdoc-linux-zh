- pgno: 66
  md: '# Chapter 4. introduction to DNS


    dns is a fundamental part of every large computer network. dns is used by many
    network services to translate names into network addresses and to locate services
    on the network (by name).


    Whenever you visit a web site, send an e-mail, log on to Active Directory, play
    Minecraft, chat, or use VoIP, there will be one or (many) more queries to dns
    services.


    Should dns fail at your organization, then the whole network will grind to a halt
    (unless you hardcoded the network addresses).


    You will notice that even the largest of organizations benefit greatly from having
    one dns infrastructure. Thus dns requires all business units to work together.


    Even at home, most home modems and routers have builtin dns functionality.


    This module will explain what dns actually is and how to set it up using Linux
    and bind9.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# # 4.1. about dns


    # ## 4.1.1. name to ip address resolution


    The domain name system or dns is a service on a tcp/ip network that enables clients
    to translate names into ip addresses. Actually dns is much more than that, but
    let''s keep it simple for now.


    When you use a browser to go to a website, you type the name of that website in
    the url bar. But for your computer to actually communicate with the web server
    said website, your computer needs the ip address of that web server. That is where
    dns comes in.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_67_0.png)


    In wireshark you can use the dns filter to see this traffic.


    | No. | Time | Source | Destination | Protocol | Info |

    | 4568 | 11.467767 | 192.168.1.30 | 212.71.8.10 | DNS | Standard query A google.com
    |

    | 4569 | 11.467774 | 212.71.8.10 | 192.168.1.30 | DNS | Standard query response
    A 66.102.13.105 |


    # ## 4.1.2. history


    In the Seventies, a few hundred computers were connected to the internet. To resolve
    names, humans created a flat file that contained hostname to to ip addresses.
    This local file was downloaded from hosts.txt on an ftp server standard.


    In 1984 Paul Mockapatris created dns, a distributed treelike hierarchical database
    that will be explained in detail in these chapters.


    Today, dns or domain name system is a widely distributed hierarchical database
    controlled by ICANN. Its primary function is to resolve names to ip addresses,
    and to point internet servers providing smtp or ldap services.


    The old hosts.txt is still active today on most computer systems under the name
    /etc/hosts (or C:/Windows/System32/drivers/etc/hosts). We will discuss this file,
    later, as it has influence resolution.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 4.1.3. forward and reverse lookup queries


    The question a client asks a dns server is called a query. When a client queries
    for an ip address, this is called a forward lookup query (as seen in the previous
    drawing).


    The reverse, a query for the name of a host, is called a reverse lookup query.


    Below a picture of a reverse lookup query.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_68_0.png)


    Here is a screenshot of a reverse lookup query in nslookup.


    ```

    root@debian7:~# nslookup

    > set type=PTR

