- pgno: 31
  md: '# 1.7. password protected website on CentOS


    You can secure files and directories in your website with a .htaccess file that
    refers to a .htpasswd file. The htpasswd command can create a .htpasswd file that
    contains a userid and an (encrypted) password.


    This screenshot creates a user and password for the hacker named cliff and uses
    the -c flag to create the .htpasswd file.


    ```

    [root@CentOS65 ~]# htpasswd -c /var/www/.htpasswd cliff

    New password:

    Re-type new password:

    Adding password for user cliff

    [root@CentOS65 ~]# cat /var/www/.htpasswd

    cliff:QnWWtryMLBctU

    ```


    Hacker rob also wants your website, this screenshot shows how to add a second
    user to .htpasswd.


    ```

    [root@CentOS65 ~]# htpasswd /var/www/.htpasswd rob

    New password:

    Re-type new password:

    Adding password for user rob

    [root@CentOS65 ~]# cat /var/www/.htpasswd

    cliff:QnWWtryMLBctU

    rob:EC2vOCcrXrXDoM

    [root@CentOS65 ~]#

    ```


    Both Cliff and Rob chose the same password (hunter2), but that is not visible
    in the .htpasswd file because of the different salts.


    We need to create a .htaccess file in the DocumentRoot of the website we want
    to protect. This screenshot shows example.


    ```

    [root@CentOS65 ~]# cat /var/www/html/hunter2/.htaccess

    AuthFile "Members only!"

    AuthName Basic

    AuthType Basic

    require valid-user

    ```


    Note that we are protecting the website on port 9000 that we created earlier.


    And because we put the website for the Hackerspace named hunter2 in a subdirectory
    of the default website, we will need to adjust the AllowOverride parameter in
    /etc/httpd/conf/httpd.conf under the <Directory "/var/www/html"> directive as
    the screenshot shows.'
  merge: -1
  img_proc: true
