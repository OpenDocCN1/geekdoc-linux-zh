  md: '# 3.3.3. using a database


    Next we tell **mysql** to use one particular database with the use **$database**
    command. This screenshot shows how to make wikidb the current database (in use).


    ```

    mysql> famouspeople;

    Database changed

    mysql>

    ```


    # 3.3.4. access to a database


    To give someone access to a mysql database, use the **grant** command.


    ```

    mysql> grant all on famouspeople. to kevin@localhost IDENTIFIED BY "hunter2";

    Query OK, 0 rows affected (0.00 sec)

    ```


    # 3.3.5. deleting a database


    When a database is no longer needed, you can permanently remove it with the **drop
    database** command.


    ```

    mysql> drop database demob;

    Query OK, 1 row affected (0.09 sec)

    ```


    # 3.3.6. backup and restore a database


    You can take a backup of a database, or move it to another computer using the
    **mysql** and **mysqldump** commands. In the screenshot below, we take a backup
    of the wikidb database on the computer named laika.


    ```

    mysqldump -u root famouspeople > famouspeople.backup.20120708.sql

    ```


    Here is a screenshot of a database restore operation from this backup.


    ```

    mysql -u root famouspeople < famouspeople.backup.20120708.sql

    ```'
