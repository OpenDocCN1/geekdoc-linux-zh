- pgno: 72
  md: '# 4.2.5. top level domains


    Below the root level are the **top level domains** or **tld''s**. Originally there
    were only seven defined:


    Table 4.1. the first top level domains


    | year | TLD | purpose |

    |---|---||

    | 1985 | .arpa | Reverse lookup via in-addr.arpa |

    | 1985 | .com | Commercial Organizations |

    | 1985 | .edu | US Educational Institutions |

    | 1985 | .gov | US Government Institutions |

    | 1985 | .mil | US Military |

    | 1985 | .net | Internet Service Providers, Internet Infrastructure |

    | 1985 | .org | Non profit Organizations |

    | 1988 | .int | International Treaties like nato |


    Country **tld**s were defined for individual countries, like **.uk** in 1985 for
    Great Britain (yes really), **.be** for Belgium in 1988 and **.fr** for France
    in 1986. See RFC 1591 for more info.


    In 1998 some general purpose **tld**''s were where chosen, they became active
    in the 21st century.


    Table 4.2. new general purpose tld''s


    | year | TLD | purpose |

    |---|---||

    | 2002 | .aero | aviation related |

    | 2001 | .biz | businesses |

    | 2001 | .coop | for co-operatives |

    | 2001 | .info | informative internet resources |

    | 2001 | .museum | for museums |

    | 2001 | .name | for all kinds of names, pseudonyms and labels... |

    | 2004 | .pro | for professionals |


    Many people were surprised by the choices, claiming not much for them and wanting
    a separate **xxx domain** (introduced in 2011) for adult content, and **.kidz**
    a save for children. In the meantime useless **tld**s were created like **.travel**
    (for travel agents) and **.tel** (for internet communications) and **.jobs** (for
    jobs sites).


    In 2012 **ICANN** released a list of 2000 new **tld**s that would gradually become
    available.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 4.2.6. fully qualified domain name


    The **fully qualified domain name** or **fqdn** is the combination of the **hostname**
    of a machine appended with its **domain name**.


    If for example a system is called gwen and it is in the domain linux-training.be,
    then the fqdn of this system is **gwen.linux-training.be**.


    On Linux systems you can use the **hostname** and **dnsdomainname** commands to
    verify this information.


    ```

    root@gwen:~ # hostname

    gwen

    root@gwen:~ # dnsdomainname

    linux-training.be

    root@gwen:~ # hostname --fqdn

    gwen.linux-training.be

    root@gwen:~ # cat /etc/debian_version

    6.1.10

    ```


    # 4.2.7. dns zones


    A **zone** (aka a **zone of authority**) is a portion of the DNS tree that covers
    one domain name or child domain name. The picture below represents zones as blue
    ovals. Some zones will contain delegate authority over a child domain to another
    zone.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_73_0.png)


    A **dns server** can be authoritative over 0, 1 or more **dns zones**. We will
    see more details later on the relation between a **dns server** and a **dns zone**.


    A **dns zone** consists of records, also called **resource records**. We will
    list some of those **resource records** on the next page.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 4.2.8. dns records


    # A record


    The A record, which is also called a host record contains the ipv4-address of
    a computer. When a DNS client queries a DNS server for an A record, the DNS server
    will resolve the hostname in the query to an ip address. An AAAA record is similar
    but contains an ipv6 address instead of ipv4.


    # PTR record


    A PTR record is the reverse of an A record. It contains the name of a computer
    and can be used to resolve an ip address to a hostname.


    # NS record


    A NS record or nameserver record is a record that points to a DNS name server
    (in this zone). You can list all your name servers for your DNS zone in distinct
    NS records.


    # glue A record


    An A record that maps the name of an NS record to an ip address is said to be
    a glue record.


    # SOA record


    The SOA record of a zone contains meta information about the zone itself. The
    contents of the SOA record is explained in detail in the section about zone transfers.
    There is exactly one SOA record for each zone.


    # CNAME record


    A CNAME record maps a hostname to a hostname, creating effectively an alias for
    an existing hostname. The name of the mail server is often aliased to mail or
    smtp, and the name of a web server to www.


    # MX record


    The MX record points to a smtp server. When you send an email to another domain,
    then your mail server will need the MX record of the target domain''s mail server.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 4.3. caching only servers


    A **dns server** that is set up without **authority** over a **zone**, but that
    is connected to other name servers and caches the queries is called a **caching
    only name server**. Caching only name servers do not have a **zone database**
    with resource records. Instead they connect to other name servers and cache that
    information.


    There are two kinds of caching only name servers. Those with a **forwarder**,
    and those that use the **root servers**.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# 4.3.1. caching only server without forwarder


    A caching only server forwarder will have to get information elsewhere. When it
    receives a query from a client, it will consult one of the root servers. The root
    server will refer it to a tld server, which will refer it to another dns server.
    That last server may know the answer to the query, or may refer to yet another
    server. In the end, our working dns server will find an answer and report back
    to the client.


    In the picture below, the clients ask for the ip address of linux-training.be.
    Our caching only server will contact the root server, and will be referred to
    the .be server. It will then contact the be server and referred to one of the
    name servers of Openminds. One of these names (in this case ns1.openminds.be)
    will answer the query with the ip address of linux-training.be. When our caching
    only server reports this to the client, then the client can connect to this website.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_76_0.png)


    Sniffing with tcpdump will give you this (the first 20 characters of each line
    are cut).


    ```

    192.168.1.103.41251 > M.ROOT-SERVERS.NET.domain: 37279% [lau] A? linux-training.be.
    (46)

    M.ROOT-SERVERS.NET.domain > 192.168.1.103.41251: 37279- 0/13 (740)

    192.168.1.103.65268 > d.dns.ns.be.domain: 38555% [lau] A7 linux-training.be. (46)

    d.dns.ns.be.domain > 192.168.1.103.65268: 38555- 0/7/5 (737)

    192.168.1.103.75154 > ns2.openminds.be.domain: 60888% [lau] A7 linux-training.be.
    (46)

    s2.openminds.be.domain > 192.168.1.103.75154: 60888*- 1/0/1 A 188.93.155.87 (62)

    ```'
  merge: -1
  img_proc: true
- pgno: 77
  md: "# 4.3.2. caching only server with forwarder\n\nA **caching only server** with\
    \ a **forwarder** is a DNS server that will get all its information from the **forwarder**.\
    \ The **forwarder** must be a **dns server** for example the **dns server** of\
    \ an **internet service provider**.\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_77_0.png)\n\
    \nThis picture shows a **dns server** on the company LAN that has set the **dns\
    \ server** from their **isp** as a forwarder. **If the ip address of the dns server\
    \ is 212.71.8.10, then the following lines would occur in the **named.conf** file\
    \ of the company **dns server**:\n\n```\nforwarders {\n  212.71.8.10;\n}\n```\n\
    \nYou can also configure your **dns server** to work with **conditional forwarder(s)**.\
    \ The definition of a conditional forwarder looks like this.\n\n```\nzone \"someotherdomain.local\"\
    \ {\n  type forwarder;\n  forward only;\n  forwarders { 10.104.42.1; };\n}\n```\n\
    \n# 4.3.3. iterative or recursive query\n\nA **recursive query** is a DNS query\
    \ where the client that is querying the query expects a complete answer (Like\
    \ the fat red arrow above going from the Macbook to the DNS server). An **iterative\
    \ query** is a DNS query where the client does not expect a complete answer (the\
    \ three black arrows originating from the DNS server in the picture above). Iterative\
    \ queries usually take place between name servers. The root name servers do not\
    \ respond to recursive queries."
  merge: -1
  img_proc: true
- pgno: 78
  md: '# 4.4. authoritative dns servers


    A DNS server that is controlling a zone, is said to be the **authoritative DNS
    server** for that zone. Remember that a **zone** is a collection of **resource
    records.**


    ![](img/1d499a6177836f6f088a9e2a53e11a14_78_0.png)


    # 4.5. primary and secondary


    When you set up the first **authoritative dns server** for a zone, then this is
    called the **primary dns server**. This server will have a readable and writable
    copy of the **zone database**. For reasons of fault tolerance, performance or
    load balancing you may decide to set up another **dns server** with authority
    over that zone. This is a **secondary dns server**.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_78_1.png)


    # 4.6. zone transfers


    The slave server receives a copy of the zone database from the master server using
    a **zone transfer**. Zone transfers are requested by the slave servers at regular
    intervals. Those intervals are defined in the **soa record.**


    ![](img/1d499a6177836f6f088a9e2a53e11a14_78_2.png)


    You can force a refresh from a zone with **rndc**. The example below force a transfer
    of the **fred.local zone**, and shows the log from `/var/log/syslog`.


    ```

    root@debian7:~/etc/bind# rndc refresh fred.local

    ```'
  merge: -1
  img_proc: true
- pgno: 79
