  md: '# 1.3. named virtual hosts on Debian


    # 1.3.1. named virtual hosts


    The chess club and the model train club find the port numbers too hard to remember.
    They would prefer to have their website accessible by name.


    We continue work on the same server that has three websites on three ports. We
    need to make sure these websites are accessible using the names choochoo.local,
    chessclub42.local and hunter2.local.


    We start by creating new virtual hosts.


    ```

    root@debian?:/etc/apache2/sites-available# vi choochoo.local

    root@debian?:/etc/apache2/sites-available# vi chessclub42.local

    root@debian?:/etc/apache2/sites-available# vi hunter2.local

    root@debian?:/etc/apache2/sites-available# cat choochoo.local

    <VirtualHost *:80>

    ServerAdmin webmaster@localhost

    ServerName choochoo.local

    DocumentRoot /var/www/choochoo

    </VirtualHost>

    root@debian?:/etc/apache2/sites-available# cat chessclub42.local

    <VirtualHost *:80>

    ServerAdmin webmaster@localhost

    ServerName chessclub42.local

    DocumentRoot /var/www/chessclub42

    </VirtualHost>

    root@debian?:/etc/apache2/sites-available# cat hunter2.local

    <VirtualHost *:80>

    ServerAdmin webmaster@localhost

    ServerName hunter2.local

    DocumentRoot /var/www/hunter2

    </VirtualHost>

    root@debian?:/etc/apache2/sites-available#

    ```


    Notice that they all listen on port 80 and have an extra ServerName directive.


    # 1.3.2. name resolution


    We need some way to resolve names with DNS. This can be discussed in another chapter.
    For this example it is also possible to quickly add the three names to the /etc/hosts
    file.


    ```

    root@debian?:/etc/apache2/sites-available# grep ^192 /etc/hosts

    192.168.42.50 choochoo.local

    192.168.42.50 chessclub42.local

    192.168.42.50 hunter2.local

    ```


    Note that you may have another ip address...'
  merge: -1
  img_proc: true
