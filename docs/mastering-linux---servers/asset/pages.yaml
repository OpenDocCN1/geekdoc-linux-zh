- pgno: 29
  md: '# 1.6. named hosts on CentOS


    # 1.6.1. named virtual hosts


    The chess club and the model train club find the ports too hard to remember. They
    prefer to have their website accessible by name.


    We continue work on the same server that has three websites on three ports. We
    need to make sure those websites are accessible using the names choochoo.local,
    chessclub42.local and hunter2.local.


    First, we need to enable virtual hosts in the configuration


    ```

    [root@CentOS65 ~#] vi /etc/httpd/conf/httpd.conf

    [root@CentOS65 ~#] grep ^VirtualHost /etc/httpd/conf/httpd.conf

    NameVirtualHost *:80

    [root@CentOS65 ~#]#

    ```


    Next we need to create three virtualhosts.


    ```

    [root@CentOS65 ~#] vi /etc/httpd/conf/choochoo.local

    [root@CentOS65 ~#] cat /etc/httpd/conf/chessclub42.local

    [root@CentOS65 ~#] vi /etc/httpd/conf/hunter2.local

    [root@CentOS65 ~#] cat /etc/httpd/conf/choochoo.local

    <VirtualHost *:80>

    ServerAdmin webmaster@localhost

    ServerName choochoo.local

    DocumentRoot /var/www/html/choochoo

    </VirtualHost>

    [root@CentOS65 ~#] cat /etc/httpd/conf/chessclub42.local

    <VirtualHost *:80>

    ServerAdmin webmaster@localhost

    ServerName chessclub42.local

    DocumentRoot /var/www/html/chessclub42

    </VirtualHost>

    [root@CentOS65 ~#] cat /etc/httpd/conf/hunter2.local

    <VirtualHost *:80>

    ServerAdmin webmaster@localhost

    ServerName hunter2.local

    DocumentRoot /var/www/html/hunter2

    </VirtualHost>

    [root@CentOS65 ~#]#

    ```


    Notice that they all listen on port 80 and have an extra ServerName directive.


    # 1.6.2. name resolution


    We need some to resolve names. This can be done by DNS, which is discussed in
    another chapter. For this demo it is possible to quickly add the three names to
    the /etc/hosts file.


    ```

    [root@CentOS65 ~#] grep ''192 /etc/hosts

    192.168.1.225 choochoo.local

    192.168.1.225 chessclub42.local

    192.168.1.225 hunter2.local

    ```


    Note that you may have another ip address...'
  merge: -1
  img_proc: true
