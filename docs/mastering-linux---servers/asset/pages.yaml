- pgno: 59
  md: '# 3.5.3. updating records


    Consider the following insert statement. The capital of Spain is not Barcelona,
    it is Madrid.


    ```

    mysql insert into country values (''ES'',''Spain'',''48000000'',''Barcelona'');

    Query OK, 1 row affected (0.08 sec)

    ```


    Using an update statement, the record can be updated.


    ```

    mysql> update countrycapital=''Madrid'' where countrycode=''ES'';

    Query OK, 1 row affected (0.07 sec)

    Rows matched: 1 Changed: 0

    ```


    We can use a select statement to verify this.


    ```

    mysql> select from country;

    +-----------+-------------+------------------------+

    countrycode | country | population | countrycapital

    +-----------+-------------+------------------------+

    BE | Belgium | 11000000 | Brussels

    CN | China | 14000000 | Beijing

    DE | Germany | 8200000 | Berlin

    ES | Spain | 48000000 | Madrid

    FR | France | 6400000 | Paris

    IN | India | 13000000 | New Delhi

    JP | Japan | 12800000 | Tokyo

    MX | Mexico | 11300000 | Mexico City

    US | United States | 31300000 | Washington

    +-----------+-------------+------------------------+

    9 rows in set (0.00 sec)

    ```


    # 3.5.4. viewing selected records


    Using a clause in a select statement, you can specify which record(s) you want
    to see.


    ```

    mysql> SELECT * FROM country WHERE countrycode=''ES'';

    +-----------+-------------+------------------------+

    countrycode | country | population | countrycapital

    +-----------+-------------+------------------------+

    ES | Spain | 48000000 | Madrid

    +-----------+-------------+------------------------+

    1 row in set (0.00 sec)

    ```


    Another example of the where clause.


    ```

    mysql> select * from country where country=''Spain'';

    +-----------+-------------+------------------------+

    countrycode | country | population | countrycapital

    +-----------+-------------+------------------------+

    ES | Spain | 48000000 | Madrid

    +-----------+-------------+------------------------+

    1 row in set (0.00 sec)

    ```


    # 3.5.5. primary key in where clause ?


    The primary key of a table is a field that uniquely identifies every record (every
    row) in the table, when using another field in the where clause, it is possible
    to get multiple rows returned.


    ```

    mysql> insert into country values (''EG'',''Egypt'',''82000000'',''Cairo'');

    ```'
