  md: '# 1.1.7. apache configuration


    There are many similarities, but also a couple of differences when configuring
    apache on Debian or CentOS. Both Linux families have their own owners with examples.


    All configuration on RHEL/CentOS is done in /etc/httpd.


    ```

    [root@centos65 ~]# ls -l /etc/httpd/

    total 8

    drwx-xr-x 2 root root 4096 May 6 13:08 conf

    drwx-xr-x 2 root root 4096 May 6 13:08 conf.d

    lrwx-xr-wx 1 root root 19 May 6 13:08 logs -> ../var/log/httpd

    lrwx-xr-wx 1 root root 29 May 6 13:08 modules -> ../usr/lib64/httpd/modu


    drwx-xr-wx 1 root root 19 May 6 13:08 run -> ../var/run/httpd

    [root@centos65 ~]#

    ```


    Debian (and ubuntu/...) use /etc/apache2.


    ```

    root@debian7:~# ls -l /etc/apache2/

    total 72

    -rw-r--r-- 1 root root 9659 May 6 14:23 apache2.conf

    drwx-xr-x 2 root root 4096 May 6 13:19 conf.d

    -rw-r--r-- 1 root root 1465 Jan 31 18:35 envvars

    -rw-r---- 1 root root 31063 Jul 20 2013 magic

    drwx-xr-x 2 root root 4096 May 6 13:19 mods-available

    drwx-xr-x 2 root root 4096 May 6 13:19 mods-enabled

    -rw-r--r-- 1 root root 750 Jan 26 12:13 ports.conf

    drwx-xr-x 2 root root 4096 May 6 13:19 sites-available

    drwx-xr-x 2 root root 4096 May 6 13:19 sites-enabled

    root@debian7:~#

    ```'
  merge: -1
  img_proc: true
- pgno: 18
  md: "# 1.2. port virtual hosts on Debian\n\n# 1.2.1. default virtual host\n\nDebian\
    \ has a virtualhost configuration file for its default website in /etc/apache2/sites-available/default.\n\
    \n```\nroot@debian:~# head -2 /etc/apache2/sites-available/default\n<VirtualHost\
    \ *:80>\n    ServerAdmin webmaster@localhost\n```\n\n# 1.2.2. three extra virtual\
    \ hosts\n\nIn this scenario we created three additional websites for three customers\
    \ that share a clubhouse and want to jointly hire you. They are a model train\
    \ club Choo Choo, a chess club named Chess Club 42 and a hackerspace named hunter2.\n\
    \nOne way to put websites on one server is to put each website on a different\
    \ port. This screenshot shows they newly created virtual hosts, one for each customer.\n\
    \n```\nroot@debian:~# vi /etc/apache2/sites-available/choochoo\nroot@debian:~#\
    \ cat /etc/apache2/sites-available/choochoo\n<VirtualHost *:7000>\n    ServerAdmin\
    \ webmaster@localhost\n    DocumentRoot /var/www/choochoo\n</VirtualHost>\nroot@debian:~#\
    \ vi /etc/apache2/sites-available/chessclub42\nroot@debian:~# cat /etc/apache2/sites-available/chessclub42\n\
    <VirtualHost *:8000>\n    ServerAdmin webmaster@localhost\n    DocumentRoot /var/www/chessclub42\n\
    </VirtualHost>\nroot@debian:~# vi /etc/apache2/sites-available/hunter2\nroot@debian:~#\
    \ cat /etc/apache2/sites-available/hunter2\n<VirtualHost *:9000>\n    ServerAdmin\
    \ webmaster@localhost\n    DocumentRoot /var/www/hunter2\n</VirtualHost>\n```\n\
    \nNotice the different ports 7000, 8000 and 9000. Notice also thatht we specified\
    \ a unique DocumentRoot for each website.\n\nAre you using Ubuntu or Mint, then\
    \ these configfiles need to end in .conf."
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.2.3. three extra ports


    We need to enable these three ports on apache in the ports.conf file. Open this
    file with vi and add three lines to listen on three extra ports.


    ```

    root@debian7:~# vi /etc/apache2/ports.conf

    ```


    Verify with grep ^Listen the directs are added correctly.


    ```

    root@debian7:~# grep ^Listen /etc/apache2/ports.conf

    Listen 80

    Listen 7000

    Listen 8000

    Listen 9000

    ```


    # 1.2.4. three extra websites


    We need to create three DocumentRoot directories.


    ```

    root@debian7:~# mkdir /var/www/choochoo

    root@debian7:~# mkdir /var/www/chessclub42

    root@debian7:~# mkdir /var/www/hunter2

    ```


    And we have to put some simple website in these directories.


    ```

    root@debian7:~# echo ''Choo Choo model train Choo Choo'' > /var/www/choochoo/index.html

    root@debian7:~# echo ''Welcome to chess club 42'' > /var/www/chessclub42/index.html

    root@debian7:~# echo ''HaCKInG is Fun At NuNtEr2'' > /var/www/hunter2/index.html

    ```'
