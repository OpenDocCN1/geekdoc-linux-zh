    \ of cachng the information from other servers, we will now make our server authoritative\
    \ for our domain\n\n+   2. I choose the top level domain **local** and the domain\
    \ **paul.local** and put the information in `/etc/bind/named.conf.local`.\n\n\
    ```\nroot@debian7:~# cat /etc/bind/named.conf.local\n//\n// Do any local configuration\
    \ here\n//\n// Consider adding the 1918 zones here, if they are not used in your\n\
    // organization\n// include \"/etc/bind/zones.rfc1918\";\n\nzone \"paul.local\"\
    \ IN {\n    type master;\n    file \"/etc/bind/db.paul.local\";n    allow-update\
    \ { none };\n};\n```\n\n+   3. Also add a zone database file, similar to this\
    \ one (add some A Records for testing). The **Refresh** and **Retry** values are\
    \ not too high so you can sniff traffic (this example makes the slave server contact\
    \ the master every hour).\n\n```\nroot@debian7:~# cat /etc/bind/db.paul.local\n\
    ; zone for classroom teaching\n$TTL    86400      debianpaul.paul.local.root.paul.local\
    \ (\n8       IN      ; Serial\n                       201401001\n            \
    \           1h              ; Refresh\n                       1h             \
    \ ; Retry\n                       2h              ; Expire\n                 \
    \      900             ; Negative Cache TTL\n);\n; name servers\n        IN  \
    \    NS      \nsl1\n        IN      NS      debianpaul\n        IN      NS   \
    \   debian7\n;\n; servers\ndebianpaul   IN      A               10.104.33.30\n\
    debian7       IN      A               10.104.33.30\nnsl1         IN      A   \
    \            10.104.33.30\nwww          IN      A               10.104.33.30\n\
    root@debian7:~#\n```\n\nNote that the **www** record is commented out, so it will\
    \ not resolve."
