    # 3.5.3. updating records


    Consider the following insert statement. The capital of Spain is not Barcelona,
    it is Madrid.


    ```

    mysql insert into country values (''ES'',''Spain'',''48000000'',''Barcelona'');

    Query OK, 1 row affected (0.08 sec)

    ```


    Using an update statement, the record can be updated.


    ```

    mysql> update countrycapital=''Madrid'' where countrycode=''ES'';

    Query OK, 1 row affected (0.07 sec)

    Rows matched: 1 Changed: 0

    ```


    We can use a select statement to verify this.


