    inet6 addr: fe80::0000:27ff:feab:6730/64 Scope:Link


    Some people are concerned about privacy here...


    # 21.4. ipv4 mapped ipv6 address


    Some applications use ipv4 addresses embedded in an ipv6 address. (Yes there be
    an era of migration with both ipv4 and ipv6 in use.) The ipv6 address then looks
    like this:


    ```

    ::ffff:192.168.1.42/96

    ```


    Indeed a mix of decimal and hexadecimal characters...


    # 21.5. link local addresses


    ipv6 addresses starting with fe8. can only be used on the local segment (replace
    the dot with a hexadecimal digit). This is the reason you Scope:Link the address
    in this screenshot. This address serves only the local link.


    ```

    paul@debe503:~$ /sbin/ifconfig | grep inet6

    inet6 addr: fe80::a12:27ff:fe8e:aaa8/64 Scope:Link

    inet6 addr: ::128 Scope:Host

    ```


    These link local addresses all begin with fe8.


    Every ipv6 will not get an address in this range.


    # 21.6. unique local addresses


    The now obsolete of site local addresses is similar to ipv4 private ranges is
    replaced with a system of globally unique local ipv6 addresses. This to prevent
    duplicates when joining networks within site local ranges.


    All unique local addresses strat with fd..


    # 21.7. globally unique unicast addresses


    Since ipv6 was designed to have multiple addresses per interface, the global ipv6
    address can be used next to the link local address.


    These globally unique addresses all begin with 2... or 3... as the first 16-bits.


    # 21.8. 6to4


    6to4 is defined in rfc 2893 and 3056 as one possible way to transition between
    ipv4 and ipv6 by creating an ipv6 tunnel.


    It encodes an ipv4 address in an ipv6 address that starts with 2002. For example
    192.168.1.42/24 will be encoded as:'
