    ```


    ## 14.2. creating the users on samba


    Then we add them to the smbpasswd file, with the same password.


    ```

    [root@RHEL52 samba]# smbpasswd -a serena

    New SMB password:

    Retype SMB password:

    Added user serena.

    [root@RHEL52 samba]# smbpasswd -a justine

    New SMB password:

    Retype SMB password:

    Added user justine.

    [root@RHEL52 samba]# smbpasswd -a martina

    New SMB password:

    Retype SMB password:

    Added user martina.

    ```


    ## 14.3. security = user


    Remember that we set samba''s security mode to share with the `security = share`
    directive in the [global] section. Since we now require users to always provide
    a user and password for access to our server, we will need to change this. Setting
    `security = user` will allow the client to provide samba with a valid userid and
    password before giving access to a share. [global] section now looks like this:


    ```

    [global]

    workgroup = WORKGROUP

    netbios name = TEACHER

    server string = Samba File Server

    security = user

    ```


    ## 14.4. configuring the share


    We are adding the [share] section to our smb.conf (and we do not forget to create
    the directory /srv/samba/authwrite).


    ```

    [authwrite]

    path = /srv/samba/authwrite

    comment = authenticated users only

    read only = no

    guest ok = no

    ```


    ## 14.5. testing access with net use


    After restarting samba, we will test with different users from within Microsoft
    computers. The screenshots show we net use first from Windows XP.


    ```

    C:\>net use m: \teacher0\authwrite stargate /user:serena

    The command completed successfully.

    ```


    ```

    C:\>

    M:\>echo greetings from Serena > serena.txt

    ```


    The next screenshot is martina on a Windows 2000 computer, she succeeds in writing
    her files, but fails to overwrite the file from sera.


    ```

    C:\>net use k: \teacher0\authwrite stargate /user:martina

    The command completed successfully.

    ```


    ```

    C:\>k:

    k:\>echo greetings from martina > Martina.txt

    K:\>echo overwrite > serena.txt

    Access is denied.

    ```


    ## 14.6. testing access with smbclient


    You can also test connecting with authentication with smbclient. First we test
    with a wrong password.


    ```

    [root@RHEL52 samba]# smbclient //teacher0/authwrite -U martina wrongpass

    session setup failed: NT_STATUS_LOGON_FAILURE

    ```


    Then we use with the correct password, and verify that we can access a file on
    the share.


    ```

    [root@RHEL52 samba]# smbclient //teacher0/authwrite -U martina stargate

    Domain=[TEACHER0] OS=[Unix] Server=[Samba 3.0.33-7.7.el5]

    smb: \> more serena.txt

    getting file serena.txt of size 14 as /tmp/smb.XXXX (6.8 kb/s)

    one

