    \ id | 237 |\n| 21.3. host generation | 237 |\n| 21.4. ipv4 mapped ipv6 address\
    \ | 238 |\n| 21.5. link local addresses | 238 |\n| 21.6. unique local addresses\
    \ | 238 |\n| 21.7. globally unique unicast addresses | 238 |\n| 21.8. 6to4 | 238\
