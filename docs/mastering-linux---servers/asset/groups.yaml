  - "[PAGE 92]\n\n# 4.15. example: a DNS slave server\n\n+   1. A slave server transfers\
    \ zone information over the network from a master server (a slave can also be\
    \ a master). A primary server maintains zone records in its local file system.\
    \ As an exercise, and to verify the work of all students, set up a slave server\
    \ of all the master servers in the classroom.\n\n+   2. Before configuring the\
    \ server, we may have to allow transfers from our zone to this server. Remember\
    \ that this is not very secure since transfers are in clear text and limited to\
    \ an ip address. This example follows our demo from above.\n\nImagine a student\
    \ named Jesse having completed the setup as shown before, with the domain jesse.local\
    \ and the ip address 10.104.15.20. The goal is to have a slave server of paul.local\
    \ on Jesse's computer and a slave of jesse.local on my computer.\n\nBelow is an\
    \ example of an allow-transfer statement. Careful, maybe the default allows transfer\
    \ to any.\n\n```\nroot@debian7:/etc/bind# cat named.conf.local\n// Do any local\
    \ configuration here\n//\n// Consider adding the 1918 zones here, if they are\
    \ not used in your\n// organization\n// include \"/etc/bind/zones.rfc1918\"\n\n\
    zone \"paul.local\" IN (\n    type master;\n    file \"/etc/bind/db.paul.local\"\
    \n    allow-update { none; };\n    allow-transfer { 10.104.15.20; }\n);\n```"
  - "[PAGE 93]\n\n# introduction to DNS\n\n3. With the configuration below I can make\
    \ my server a slave for the jesse.local zone.\n\n```\nroot@debian:/etc/bind# tail\
    \ -6 named.conf.local\nzone jesse.local: IN {\n  type slave;\n  file \"/var/cache/named/db.local\"\
    ;n  masters { 10.104.15.20; };\n\nroot@debian:/etc/bind# mkdir /var/cache/named\n\
    root@debian:/etc/bind# chown bind /var/cache/named\nroot@debian:/etc/bind# ls\
    \ -ld /var/cache/named/\ndrwxr-xr-x 2 bind 4096 1 20:01 /var/cache/named/\n```\n\
    \nNote that we put the slave zones in /var/cache/named and not in /etc/bind.\n\
    \n4. Restarting on the slave server should transfer the database file. Verify\
    \ this in /var/syslog. the time and date are truncated from the screenshot, and\
    \ Jesse did not use the current date in the name..\n\n```\nroot@debian:/etc/bind#\
    \ grep jesse /var/syslog\nnamed[2731]: transfer of jesse.local/IN: Transfer started.\n\
    named[2731]: transfer of 'jesse.local/IN' from 10.104.15.20#53: connected u\\\
    nsing0.104.33:044719\nnamed[2731]: transfer of 'jesse.local/IN': transferred serial\
    \ 20110516\named[2731]: transfer of 'jesse.local/IN' from 10.104.15.20#53: Transfer\
    \ co\\npleted: 1 messages, 8 records, 239 bytes, 0.001 sec (239000 bytes/sec)\n\
    ```\n\nAnd the contents of the slave zone: \n\n```\nroot@debian:/etc/bind# cat\
    \ /var/cache/named/db.local\n$ORIGIN\nTTL 604800      ; 1 week      IN SOA ns.jesse.local.\
    \ root-jesse.local.jesse.local. (\njesse.local             20110516      serial\n\
    \                               300 refresh (5 minutes)\n                    \
    \           600 retry (3 minutes 20 seconds)\n                               2419200\
    \ expire (4 weeks)\n                               604800 minimum (1 week)\n \
    \                              )\n\n                                     NS  \
    \     ns.jesse.local.\n\n$ORIGIN jesse.local.\nanya            A       10.104.15.1\n\
    mac             A       10.104.15.30\ns               A       10.104.15.20\nbubu010srv\
    \      A       10.104.15.20\nww             A       10.104.15.25\nroot@debian:/etc/bind#\n\
    ```"
