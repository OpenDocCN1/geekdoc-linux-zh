    # samba authentication


    ```

    [root@RHEL52 samba]# su - martina

    [martina@RHEL52 ~]]

    ```


    But usernames in Microsoft computers are not case sensitive.


    ```

    [root@RHEL52 samba]# smclient //teacher0/authwrite -U martina stargate

    Domain=[TEACHER0] OS=[Unix] Server=[Samba 3.0.33-3.7.el5]

    smb: \\> q

    [root@RHEL52 samba]# smclient //teacher0/authwrite -U MARTINA stargate

    Domain=[TEACHER0] OS=[Unix] Server=[Samba 3.0.33-3.7.el5]

    smb: \\> q

    ```


    ## 14.9. practice : samba authentication


    - 0. Make sure you have properly named backups of your smb.conf of the previous
    practices.


    - 1. Create three users (on the Linux and on the samba), remember their passwords!


    - 2. Set up a shared directory that is only accessible to authenticated users.


    - 3. Use smclient and a windows computer to access your share, use more than one
    user account (windows requires a logoff/logon for this).


    - 4. Verify that files created by these users belong to them.


    - 5. Try to change or delete a file from another user.


    ## 14.10. solution: samba authentication


    - 1. Create three users (on the Linux and on the samba), remember their passwords!


    ```bash

    useradd -c ''SMB user1'' user

    passwd user

    ```


    - 2. Set up a shared directory that is only accessible to authenticated users.

    The shared section in samba.conf could look like this:


    ```ini

    [authwrite]

    path = /srv/samba/authwrite

    comment = authenticated users only

    read only = no

    guest ok = no

    ```


    - 3. Use smclient and a windows computer to access your share, use more than one
    user account (windows requires a logout/logon for this).


    ```bash

    on Linux: smclient //studentX/authwrite -U user1 password

    on windows: net use p: \studentX\authwrite password /user:user

    ```


    - 4. Verify that files created by these users belong to them.


    ```bash

    ls -l /srv/samba/authwrite

    ```


    - 5. Try to change or delete a file from another user.

    you should not be able to change or overwrite files from others.


    ## Chapter 15. samba securing shares


    ## 15.1. security based on user name


    ### 15.1.1. valid users


    To restrict users per share, you can use the valid users parameter. In the example,
    only the users listed as valid will be able to access the tennis share.


    ```

    [tennis]

    path = /srv/samba/tennis

    comment = authenticated and valid users only

    read only = No

    guest users = serena, kim, venus, justice

    ```


    ### 15.1.2. invalid users


    If you are paranoia, you can also use invalid users to explicitly deny the listed
    users access. When a user is in both lists, the user has no access!


    ```

    [tennis]

    path = /srv/samba/tennis

    read only = No

    guest users = No

    valid users = kim, serena, venus, justice

    invalid users = venus

    ```


    ### 15.1.3. read list


    On a writable share, you can set a list of read only users with the read list
    parameter.


    ```

    [football]

    path = /srv/samba/football

    read only = No

    guest users = No

    read list = martini, roberto

    ```


    ### 15.1.4. write list


    On a read only share, you can set a list of users that can write. Use the write
    list parameter.


    ```

    [football]

    path = /srv/samba/golf

    read only = Yes

    guest users = No

    write list = eddy, jan

    ```


    ## 15.2. security based on ip-address


    ### 15.2.1. allow hosts


    The hosts allow or allow hosts parameter is one of the key advantages of Samba.
    It allows access control of shares on the ip-address level. To allow only specific
    hosts to access a share, list the hosts, separated by comma,


    ```

    allow hosts = 192.168.1.5, 192.168.1.40

    ```


    Allowing entire subnets is done by ending the range with a dot.


    ```

    allow hosts = 192.168.1.1

    ```


    Subnet masks can be added to the classical way.


    ```

    allow hosts = 10.0.0.0/255.0.0.0

    ```


    You can also allow an entire subnet with exceptions.


    ```

    hosts allow = 10. except 10.0.0.12

    ```


    ### 15.2.2. hosts deny


    The hosts deny or deny hosts parameter is the logical counterpart of the previous.
    The syntax is the same as for hosts allow.


    ```

    hosts deny = 192.168.1.55, 192.168.1.56

    ```


    ## 15.3. security through obscurity


    ### 15.3.1. hide unreadable


    Setting hide unreadable = yes will prevent users from seeing files that cannot
    be read by them.


    ```

    hide unreadable = yes

    ```


    ### 15.3.2. browsable


    Setting browseable = no directive will hide shares from My Network Places. But
    it will not prevent someone from accessing the share (when the name of the share
    is known).


    Note that both browseable and browseable are both correct syntax.


    ```

    [pubread]

    path = /srv/samba/readonly

    comment = files to read

    read only = yes

    guest ok = yes

    browseable = no

    ```


    ## 15.4. file system security


    ### 15.4.1. create mask


    You can use create mask and directory mask to set the maximum allowed permissions
    for newly created files and directories. The mask you set is an AND mask (it takes
    permissions away).


    ```

    [tennis]

    path = /srv/samba/tennis

    read only = No

    guest ok = No

    create mask = 640

    directory mask = 750

    ```


    ### 15.4.2. force mode


    Similar to create mask, the mask you set is an OR mask (it adds permissions).


    ```

    [tennis]

    path = /srv/samba/tennis

    read only = No

    guest ok = No

    force create = 444

    force directory = 555

    ```


    ### 15.4.3. security mask


    The mask you set is an AND mask (it takes permissions away).


    ```

    [authwrite]

    path = /srv/samba/authwrite

    comment = authenticated users only

    read only = No

    guest ok = No

    create mask = 600

    ```


    ### 15.4.4. directory mask


    The mask you set is an AND mask (it takes permissions away) for directories.


    ```

    [tennis]

    path = /srv/samba/tennis

    read only = No

    guest ok = No

    ```


    ### 15.4.5. inherit


    With inherit = yes, the mask you set is newly created files and directories inherit
    permissions from the parent directory.


    ```

    [authwrite]

    path = /srv/samba/authwrite

    comment = authenticated users only

    read only = No

    guest ok = No

    inherit = yes

    ```


    ## 15.5. practice: securing shares


    - 1. Create a writable share, a readonly share. Test that it works.

    - 2. Limit the share to ann, sandra.

    - 3. Limit the share to roberto.

    - 4. Limit the share to ann.

    - 5. Limit the share to sandra and verique.

    - 6. Limit the share to 192.168.1.0/24 subnet.

    - 7. Limit the share to 192.168.1.33 and 172.17.18.19.

    - 8. Limit the share to 192.168.1.203.

    - 9. Make sure the share is not visible when browsing the network.

    - 10. All files created in the sales share should have 640 permissions.

    - 11. All directories created in the budget share should have 750 permissions.

    - 12. Permissions for files on the sales share should never be set more 664.

    - 13. Permissions for files on the budget share should never be set less than
    500.

    - 14. If time permits (or you are waiting for other students to finish this practice),
    then combine the "read only" and "writable" statements to check which one has
    priority.


    ## 15.6. solution: securing shares


    - 1. Create a writable share, a readonly share. Test that it works.

    - 2. Limit the share to ann, sandra.

    - 3. Limit the share to roberto.

    - 4. Limit the share to ann.

    - 5. Limit the share to sandra and verique.

    - 6. Limit the share to 192.168.1.0/24 subnet.

    - 7. Limit the share to 192.168.1.33 and 172.17.18.19.

    - 8. Limit the share to 192.168.1.203.

    - 9. Make sure the share is not visible when browsing the network.

    - 10. All files created in the sales share should have 640 permissions.

    - 11. All directories created in the budget share should have 750 permissions.

    - 12. Permissions for files on the sales share should never be set more 664.

    - 13. Permissions for files on the budget share should never be set less than
    500.

