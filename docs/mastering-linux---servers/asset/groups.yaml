    \ of the company **dns server**:\n\n```\nforwarders {\n  212.71.8.10;\n}\n```\n\
    \nYou can also configure your **dns server** to work with **conditional forwarder(s)**.\
    \ The definition of a conditional forwarder looks like this.\n\n```\nzone \"someotherdomain.local\"\
    \ {\n  type forwarder;\n  forward only;\n  forwarders { 10.104.42.1; };\n}\n```\n\
    \n# 4.3.3. iterative or recursive query\n\nA **recursive query** is a DNS query\
    \ where the client that is querying the query expects a complete answer (Like\
    \ the fat red arrow above going from the Macbook to the DNS server). An **iterative\
    \ query** is a DNS query where the client does not expect a complete answer (the\
    \ three black arrows originating from the DNS server in the picture above). Iterative\
    \ queries usually take place between name servers. The root name servers do not\
    \ respond to recursive queries."
  - '[PAGE 78]


    # 4.4. authoritative dns servers


    A DNS server that is controlling a zone, is said to be the **authoritative DNS
    server** for that zone. Remember that a **zone** is a collection of **resource
    records.**


    ![](img/1d499a6177836f6f088a9e2a53e11a14_78_0.png)


    # 4.5. primary and secondary


    When you set up the first **authoritative dns server** for a zone, then this is
    called the **primary dns server**. This server will have a readable and writable
    copy of the **zone database**. For reasons of fault tolerance, performance or
    load balancing you may decide to set up another **dns server** with authority
    over that zone. This is a **secondary dns server**.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_78_1.png)


    # 4.6. zone transfers


    The slave server receives a copy of the zone database from the master server using
    a **zone transfer**. Zone transfers are requested by the slave servers at regular
    intervals. Those intervals are defined in the **soa record.**


    ![](img/1d499a6177836f6f088a9e2a53e11a14_78_2.png)


    You can force a refresh from a zone with **rndc**. The example below force a transfer
    of the **fred.local zone**, and shows the log from `/var/log/syslog`.


    ```

    root@debian7:~/etc/bind# rndc refresh fred.local

    ```'
