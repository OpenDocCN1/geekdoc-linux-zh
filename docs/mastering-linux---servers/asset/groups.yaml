    ```


    ### 10.1.6. smb.conf


    虽然很奇怪但确实是：smb.conf 接受像 create mode 和 create mask 这样的同义词，并且（有时）缺失错误是可以被浏览的。在某些情况下你可以切换单词，`guest
    only` 参数与 `only guest` 是相同的。`Writable = yes` 等同于 `readonly = no`。


    ### 10.1.7. man smb.conf


    执行 `man smb.conf` 时，你可以访问大量的文档。


