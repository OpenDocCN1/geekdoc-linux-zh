    # 2.8. access control


    The default squid setup only allows localhost access. To enable access for a private
    network range, look for the "INSERT YOUR OWN RULE(S) HERE..." sentence in squid.conf
    and add two lines similar to the screenshot below.


    ```

    # INSERT YOUR OWN RULE(S) HERE TO ALLOW ACCESS FROM YOUR CLIENTS

    acl company_network src 192.168.1.0/24

    http_access allow company_network

    ```


    # 2.9. testing squid


    First, make sure that the server running squid has access to the internet.


    ```

    [root@RHEL4 ~] # wget -q http://linux-training.be/index.html

    [root@RHEL4 ~] # ls -l index.html

    -rw-r--r-- 1 root 2269 Sep 18 13:18 index.html

    [root@RHEL4 ~] -

    ```


    Then configure a browser or client to use the proxy server, or you could set the
    HTTP_PROXY variable to command line programs to the proxy.


    ```

    [root@fedora ~] # export HTTP_PROXY=http://192.168.1.39:8080

    [root@ubuntu ~] # export http_proxy=http://192.168.1.39:8080

    ```


    Testing a client name can be done with `wget -q is` to simplify the screenshot.


    ```

    [root@RHEL5 ~] # wget > /etc/resolv.conf

    [root@RHEL5 ~] # wget -q http://www.linux-training.be/index.html

    [root@RHEL5 ~] # ls -l index.html

    -rw-r--r-- 1 root 2269 Sep 18 2008 index.html

