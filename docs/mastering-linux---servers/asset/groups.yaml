    # samba domain controller


    Microsoft computers store a lot of User Metadata and application data in a user
    profile. Making this profile available on the network will enable users to keep
    their Desktop and Application settings across computers. User profiles on the
    network are called roaming profiles or roving profiles. The Samba domain controller
    can manage these profiles. We need to add the relevant section in smb.conf.


    ```

    [Profiles]

    comment = User Profiles

    path = /srv/samba/profiles

    readonly = No

    profile acls = Yes

    ```


    Besides the server section, we also need to set the location of the profiles share
    (this can be another Samba server) in the global section.


    ```

    logon path = \\LProfiles\\U

