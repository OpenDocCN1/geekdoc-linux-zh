  - '[PAGE 110]


    # 6.1. four broadcasts


    dhcp works with layer 2 broadcasts. A dhcp client that starts, will send a dhcp
    discover on the network. All dhcp servers (that have a lease available) will respond
    with a dhcp offer. The client will choose one of those offers and send a dhcp
    request to the chosen offer. The dhcp server responds with a dhcp acknowledgment.


    In wireshark it looks like this.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_110_0.png)


    When this procedure is finished, then the client is allowed to use it ipcp-configuration
    until the end of its lease.'
  - '[PAGE 111]


    # 6.2. picturing dhcp


    We have a small network with two dhcp servers named DHCP-SRV1 and DHCP-SRV2 and
    two clients (SunWS1 and Mac42). All computers are connected by a hub or switch
    (pictured in the middle). All four computers have a cable to the hub (cables not
    pictured).


    ![](img/1d499a6177836f6f088a9e2a53e11a14_111_0.png)


    +   1. The client SunWS1 sends a dhcp discover on the network. All computers receive
    this broadcast.


    +   2. Both dhcp servers answer with a dhcp offer. DHCP-SRV1 is a dedicated dhcp
    server and is faster in sending a dhcp offer than DHCP-SRV2 (who happens to also
    be a file server).


    +   3. The client chooses the offer from DHCP-SRV1 and sends a dhcp request on
    the network.


    +   4. DHCP-SRV1 answers with a dhcp ack (short for acknowledgement).


    All four broadcasts (or five when you count both offers) can be layer 2 ethernet
    broadcast to mac address ff:ff:ff:ff:ff:ff and a layer 3 ip broadcast to 255.255.255.255.


    The same story can be read in rfc 2131.'
