    Use ping6 to test connectivity between ipv6 hosts. You need to specify the interface
    (there is no routing table for ''random'' generated ipv6 local addresses).


    ```

    [root@fedora4 ~]# ping6 -I eth0 fe80::a00:27ff:fec:(fe80::a00:27ff:fec) from fe80::a00:27ff:fe3c:4346
    eth0: 56

    64 bytes from fe80::a00:27ff:fec: icmp_seq=1 ttl=64 time=0.58 ms

    64 bytes from fe80::a00:27ff:fec: icmp_seq=2 ttl=64 time=3.95 ms

    64 bytes from fe80::a00:27ff:fec: icmp_seq=3 ttl=64 time=1.53 ms

    ```


    Below a multicast ping receives replies from three ipv6 hosts on the network.


    ```

    [root@fedora4 ~]# ping6 -I eth0 ff02::1

    ff02::1 (ff02::1) from fe80::a00:27ff:ffec:4346 eth0: 56 bytes

