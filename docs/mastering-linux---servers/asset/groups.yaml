  - "[PAGE 83]\n\n# 4.11. forward lookup zone example\n\nThe way to set up zones in\
    \ /etc/bind/named.conf.local is to create a zone entry with a reference to another\
    \ file (this other file contains the zone database).\n\nHere is an example of\
    \ each in /etc/bind/named.conf.local:\n\n```\nroot@debian:-# cat /etc/bind/named.conf.local\n\
    //\n// Do local configuration here\n//\n// Consider adding the 1918 zones here,\
    \ if they are not used in your\n// organization\n// include \"/etc/bind/zones.rfc1918\"\
    ;\n\nzone \"paul.local\" IN {\n    type master;\n    file \"/etc/bind/db.paul.local\"\
    ;n    allow-update { none };\n}\nroot@debian:-#\n```\n\nTo create a zone, the\
    \ easiest method is to copy an existing zone file (this is easier than writing\
    \ from scratch).\n\n```\nroot@debian:/etc/bind# cp db.empty db.paul.local\nroot@debian:/etc/bind#\
    \ vi db.paul.local\n```\n\nHere is an example of a zone file.\n\n```\nroot@debian:/etc/bind#\
    \ cat db.paul.local\n; zone for classroom teaching\nTTL 86400 SOA debian.paul.local.\
    \ root.paul.local (\n    2014100100 ; Serial\n    1h ; Refresh\n    1h ; Retry\n\
    \    2h ; Expire\n    86400 ) Negative Cache TTL\n\n; name servers\n    IN NS\
    \ nsl\n    IN NS debianpaul\n    IN NS debian7\n\n; servers\ndebian IN A 10.104.33.30\n\
    ddebianpaul IN A 10.104.33.30\ndebian7 IN A 10.104.33.30\nnsl IN A 10.104.33.30\n\
    www IN A 10.104.33.30\n```"
