    \ 249\n\n# 附录 A 克隆\n\n## A.1. 关于克隆\n\n你对克隆服务器可能有不同的目标。例如，克隆可以是一个用于服务手动灾难恢复的冷备备份系统。或者，可以创建一个克隆以用于测试环境。又或者你可能想创建一个几乎相同的服务器。让我们来看看一些创建\
    \ Linux 服务器克隆的离线和在线方法。\n\n## A.2. 关于离线克隆\n\n离线克隆用于在关闭运行中的 Linux 服务器电源时创建克隆。这种方法非常简单，因为我们不需要打开文件，也不需要跳过\
    \ /dev 或 /sys 等虚拟文件系统。离线克隆方法可以分解为以下步骤：\n\n- 1. 使用启动光盘启动源服务器和目标服务器\n- 2. 在目标服务器上进行分区、格式化并挂载卷\n\
    - 3. 通过网络从源到目标复制文件/分区\n\n第一次尝试是非常容易的。第二步将在“磁盘管理”章节中解释。对于第三步，我们可以使用 ssh 或 netcat\
    \ 结合 cp、dd、dump 以及 restore-tar、cpio、rsync 甚至 cat。\n\n## A.3. 离线克隆示例\n\n```\n[root@RHEL5\
    \ ~]# 我们正在处理一台 Red Hat Enterprise Linux 5 服务器，我们想在较新的硬件上获得它的完美副本。首先要做的任务是发现磁盘布局\n\
    ```\n| 文件系统 | 大小 | 可用空间 | 使用率 | 挂载点 |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | /dev/sda2 | 15G | 4.9G | 9.3G | 33% |\n| /dev/sda1 | 91M | 64M | 33% | /boot\
    \ |\n\n```\n\n/boot 分区很小，但足够大。如果我们创建一个完全相同的分区，那么 **dd** 将是一个很好的克隆选项。假设目标系统上需要擦除\
    \ /partition。最佳选项是使用 **dump** 和 **restore** 的组合。记住，dd 复制块，而 dump/restore 复制文件。\n\
    \n第一步是用 Live盘 CD 启动目标服务器对目标磁盘进行分区。为了做到这一点，我们使用 Red Hat Enterprise Linux 5。在 CD\
    \ 启动提示符处输入“linux rescue”。CD 启动进入 root 控制台，可以在那里使用 fdisk 发现并准备连接的磁盘。当分区创建并具有文件系统后，我们就可以使用\
    \ dd 复制 /boot 分区。\n\n![](img/499a6177836f088a9e2a53e11a40.png)\n\n```\nssh root@192.168.1.40\
    \ \"dd if=/dev/sda | of=/dev/sda\"\n```\n然后我们使用 dump 和 restore 组合来复制分区。\n\n```\n\
    mkdir /mnt/x\nmount /sda2 /mnt/x\nssh root@192.168.1.40 \"dump -f - | restore\
    \ -f -\"\n```\n\n# 附录 B 许可证\n\nGNU 文档许可证\n\n版本 1.3，2008年11月\n\n版权 © 2000-2007\
    \ Free Software Foundation, Inc.\n\n## 前言\n\n本许可证的目的是使手册、教科或其他或其他文档在自由的意义上是“自由”的：允许每个人有效地复制和分发它，或者在不修改它的情况下，无论是商业性还是非商业性的。其次，本许可证保留了作者和出版者获得其工作认可的方式，同时不对他人的修改负责。本许可证是一种“左版拷贝”（copyleft），这意味着衍生作品必须在相同的意义上是自由的。它补充了\
    \ GNU 通用许可许可证，后者是为自由软件设计的，但不限于软件；它可以用于任何文本作品，无论主题是什么或是否以印刷书的形式出版。\n\n## 1. 应用与定义\n\
    \n本许可证适用于任何媒介的任何手册或其他作品，这些作品包含版权所有者发布的声明，说明其是根据本许可证的条款分发的。此类声明授予了在全球范围内免版税的无限期根据此处列出的条件使用该作品的。“文档”是指任何手册或其他作品。公众任何成员都是被许可者，被称为“你”。如果你以需要版权法许可的方式复制、修改或分发作品，则表示接受该许可证。文档的“修改版本”是指任何包含文档的作品。\n\
    \n“修改版本”的文档意味着任何包含文档的作品。\n\n本许可证适用于任何媒介的任何手册或其他作品，这些作品中包含一个由版权所有者发布的声明，说明其是根据本许可证的条款分发的。此类声明授予了在全球范围内免版税的无限期根据此处列出的条件使用该作品的。“文档”是指任何手册或其他作品。公众任何成员都是被许可者，被称为“你”。如果你以需要版权法许可的方式复制、修改或分发作品，则表示接受该许可证。文档的“修改版本”意味着任何包含文档的作品。\n\
