    # 1.2.3. three extra ports


    We need to enable these three ports on apache in the ports.conf file. Open this
    file with vi and add three lines to listen on three extra ports.


    ```

    root@debian7:~# vi /etc/apache2/ports.conf

    ```


    Verify with grep ^Listen the directs are added correctly.


    ```

    root@debian7:~# grep ^Listen /etc/apache2/ports.conf

    Listen 80

    Listen 7000

    Listen 8000

    Listen 9000

    ```


    # 1.2.4. three extra websites


    We need to create three DocumentRoot directories.


    ```

    root@debian7:~# mkdir /var/www/choochoo

    root@debian7:~# mkdir /var/www/chessclub42

    root@debian7:~# mkdir /var/www/hunter2

    ```


    And we have to put some simple website in these directories.


    ```

    root@debian7:~# echo ''Choo Choo model train Choo Choo'' > /var/www/choochoo/index.html

    root@debian7:~# echo ''Welcome to chess club 42'' > /var/www/chessclub42/index.html

    root@debian7:~# echo ''HaCKInG is Fun At NuNtEr2'' > /var/www/hunter2/index.html

    ```'
