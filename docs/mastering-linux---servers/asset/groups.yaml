    ## 1.1. introduction to apache


    ### 1.1.1. installing on Debian


    This shows that there is no apache server installed, nor does the /var/www directory
    exist.


    ```

    root@debian:~# ls -l /var/www

    ls: cannot access /var/www: No such file or directory

