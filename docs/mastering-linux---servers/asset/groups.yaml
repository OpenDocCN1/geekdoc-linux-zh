    Then we use a dump and restore combo to copy the / partition.


    ```

    mkdir /mnt/x

    mount /dev/sda2 /mnt/x

    cd /mnt/x

    ssh root@192.168.1.40 "dump -0 -f -" | restore -r -f -

    ```'
