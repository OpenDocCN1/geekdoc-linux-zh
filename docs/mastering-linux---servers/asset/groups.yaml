  - "[PAGE 77]\n\n# 4.3.2. caching only server with forwarder\n\nA **caching only\
    \ server** with a **forwarder** is a DNS server that will get all its information\
    \ from the **forwarder**. The **forwarder** must be a **dns server** for example\
    \ the **dns server** of an **internet service provider**.\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_77_0.png)\n\
    \nThis picture shows a **dns server** on the company LAN that has set the **dns\
