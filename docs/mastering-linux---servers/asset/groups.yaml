    \   hosts deny = 192.168.1.203\n\n+   8. Make sure on the (budget share) that\
    \ users can see only files and directories to which they have access.\n   hide\
    \ unreachable = yes\n\n+   9. Make sure the sales share is not visible when browsing\
    \ the network.\n   browsable = no\n\n+   10. All files created in the sales share\
    \ should have 640 permissions or less.\n   create mask = 640\n\n+   11. All directories\
    \ created in the budget share should have 750 permissions or more.\n   force directory\
    \ mode = 750\n\n+   12. Permissions for files on the sales share should never\
    \ be set more than 664.\n   security mask = 300\n\n+   13. Permissions for files\
    \ on the budget share should never be set less than 500.\n   force security directory\
    \ mask = 500\n\n+   14. If time permits (or if you are waiting for other students\
    \ to finish this practice), then combine the \"read only\" and \"writable\" statements\
    \ to check which one has priority."
