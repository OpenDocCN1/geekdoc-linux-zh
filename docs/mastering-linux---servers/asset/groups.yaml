  md: "\n## 1.3.3. enabling them virtual hosts\n\nNext we can enable with a2ensite.\n\
    \n```\nroot@debian7:/etc/apache2/sites-available# a2ensite choochoo.local\nEnabling\
    \ site chesschooo.local.\nTo activate the new configuration, you need to run:\n\
    \    service apache2 reload\nroot@debian7:/etc/apache2/sites-available# a2ensite\
    \ chessclub42.local\nEnabling site chessclub42.local.\nTo activate the new configuration,\
    \ you need to run:\n    service apache2 reload\nroot@debian7:/etc/apache2/sites-available#\
    \ a2ensite hunter2.local\nEnabling site hunter2.local.\nTo activate the new configuration,\
    \ you need to run:\n    service apache2 reload\n```\n\n## 1.3.4. reload and verify\n\
    \nAfter a service apache2 reload the websites will be available by name.\n\n```\n\
    root@debian7:/etc/apache2/sites-available# service apache2 reload\nReloading web\
    \ server config. apache2.\nroot@debian7:/etc/apache2/sites-available# chessclub42.local\n\
    --2014-05-06 21:37:13-- http://chessclub42.local/\nResolving chessclub42.local\
    \ (chessclub42.local)... 192.168.42.50\nConnecting to chessclub42.local (chessclub42.local)\
    \ [192.168.42.50]:80... connected.\n\nHTTP request sent, awaiting response...\
    \ 200 OK\nLength: 25 [index.html]\nSaving to: 'index.html'\n\n100%[------------------------------------------------------]\
    \ 25  --K/s    in 0s\n\n2014-05-06 21:37:13 (2.06 MB/s) - `index.html' saved [25/25]\n\
    \nroot@debian7:/etc/apache2/sites-available# cat index.html\nWelcome to chess\
    \ club 42\n```\n\n## 4. password protected website on Debian\n\nYou can secure\
    \ files and directories in your website with a .htaccess file that refers to a\
    \ .htpasswd file. The htpasswd command can create a .htpasswd file that contains\
    \ a userid and an (encrypted) password.\n\nThis screenshot creates a user and\
    \ password for the hacker named cliff and the -e flag to create the .htpasswd\
    \ file.\n\n```\nroot@debian7:~# htpasswd -c /var/www/.htpasswd cliff\nNew password:\n\
    Re-type new password:\nAdding password for user cliff\nroot@debian7:~# cat /var/www/.htpasswd\n\
    cliff:$apr1$vuuj10lLk$SZ49q0swXh93P0QPVP.\n```\n\nBoth Cliff and Rob chose the\
    \ same password (hunter2), but that this shows how to add a second user and password\
    \ to .htpasswd.\n\n```\nroot@debian7:~# htpasswd /var/www/.htpasswd rob\nNew password:\n\
    Re-type new password:\nAdding password for user rob\nroot@debian7:~# cat /var/www/.htpasswd\n\
    cliff:$apr1$vuuj10lLk$SZ49q0swXh93P0QPVP\nrob:$apr1$5Hn1IFFTcNR1HoP.IW11/1DRQ41Q0\n\
    ```\n\nWe need to create a .htaccess file in the DocumentRoot of the website we\
    \ want to protect. This screenshot shows an example.\n\n```\nroot@debian7:~# cd\
    \ /var/www/hunter2/\nroot@debian7:/var/www/hunter2# cat .htaccess\nAuthUserFile=\"\
    Members only!\"\nAuthName\nAuthType Basic\nrequire valid-user\n```\n\nNote that\
    \ we are protecting the website on port 9000 that we created earlier.\n\nAnd because\
    \ we put the website in the Hackerspace named hunter2 in a subdirectory of the\
    \ default website, we will need to adjust the AllowOverride parameter in /etc/apache2/sites-available/default/default\
    \ as this screenshot shows (with line numbers on Debian 7, your may vary).\n\n\
    ```\n<Directory /var/www//\n    Options Indexes FollowSymLinks MultiViews\n  \
    \  AllowOverride Authconfig\n    Order allow, deny\n    allow from all\n</Directory>\n\
    ```\n\nNow restart the apache2 server and test that it works!\n\n## 1.5. port\
    \ virtual hosts on CentOS\n\n### 1.5.1. default virtual host\n\nUnlike Debian,\
    \ CentOS has no virtualHost configuration file for its default website. Instead\
    \ the default configuration will throw a standard error page when no index file\
    \ can be found in the default location (/var/www/html).\n\n### 1.5.2. three extra\
    \ virtual hosts\n\nIn this scenario we create three additional websites for three\
    \ customers that share a clubhouse and to join you here. They are a model train\
    \ club Choo Choo, a chess club named Chess 42 and a hakerspace named hunter2.\n\
    \nOne way to put three websites on one web server, is to put each website on a\
    \ different port. This screenshot shows three newly created virtual hosts, for\
    \ each customer.\n\n```\n[root@CentOS65] ~# vi /etc/httpd/conf.d/choochoo.conf\n\
    [root@CentOS65] ~# cat /etc/httpd/conf.d/choochoo.conf\n<VirtualHost *:7000>\n\
    \  ServerAdmin webmaster@localhost\n  DocumentRoot /var/www/html/choochoo\n</VirtualHost>\n\
    [root@CentOS65] ~# vi /etc/httpd/conf.d/chessclub42.conf\n[root@CentOS65] -# cat\
    \ /etc/httpd/conf.d/chessclub42.conf\n<VirtualHost *:8000>\n  ServerAdmin webmaster@localhost\n\
    \  DocumentRoot /var/www/html/chessclub42\n</VirtualHost>\n[root@CentOS65] ~#\
    \ vi /etc/httpd/conf.d/hunter2.conf\n[root@CentOS65] -# cat /etc/httpd/conf.d/hunter2.conf\n\
    <VirtualHost *:9000>\n  ServerAdmin webmaster@localhost\n  DocumentRoot /var/www/html/hunter2\n\
    </VirtualHost>\n```\n\nNotice the difference port numbers 7000, 8000 and 9000.\
    \ Notice also that we specified a unique DocumentRoot for each website.\n\n###\
    \ 1.5.3. three extra ports\n\nWe need to enable these three ports on apache in\
    \ the httpd.conf file.\n\n```\n[root@CentOS65] ~# vi /etc/httpd/conf/httpd.conf\n\
    root@debian:-# grep \"Listen\" /etc/httpd/conf/httpd.conf\nListen 80\nListen 7000\n\
    Listen 8000\nListen 9000\n```\n\n### 1.5.4. SELinux guards our ports\n\nIf we\
    \ try toCentOS restart our server, we will notice the following error:\n\n```\n\
    [root@CentOS65 #] service httpd restart      [ OK ]\nStopping httpd:\nStarting\
    \ httpd:\n(13)Permission denied: make_sock: could not bind to address 0.0.0.0:7000\n\
    \ listening sockets available, shutting down\n                               [FAILED]\n\
    ```\n\nThis is due to SELinux reserving ports 7000 and 8000 for other users. We\
    \ need to tell SELinux\n"
  mdcn: "\n\n## 1.3.3. 启用虚拟主机\n\n接下来我们可以使用 `a2ensite` 来启用。\n\n```\nroot@debian7:/etc/apache2/sites-available#\
    \ a2ensite choochoo.local\nEnabling site chesschooo.local.\nTo activate the new\
    \ configuration, you need to run:\n    service apache2 reload\nroot@debian7:/etc/apache2/sites-available#\
    \ a2ensite chessclub42.local\nEnabling site chessclub42.local.\nTo activate the\
    \ new configuration, you need to run:\n    service apache2 reload\nroot@debian7:/etc/apache2/sites-available#\
    \ a2ensite hunter2.local\nEnabling site hunter2.local.\nTo activate the new configuration,\
    \ you need to run:\n    service apache2 reload\n```\n\n## 1.3.4. 重载与验证\n\n执行 `service\
    \ apache2 reload` 后，可以通过名称访问网站。\n\n```\nroot@debian7:/etc/apache2/sites-available#\
    \ service apache2 reload\nReloading web server config. apache2.\nroot@debian7:/etc/apache2/sites-available#\
    \ chessclub42.local\n--2014-05-06 21:37:13-- http://chessclub42.local/\nResolving\
    \ chessclub42.local (chessclub42.local)... 192.168.42.50\nConnecting to chessclub42.local\
    \ (chessclub42.local) [192.168.42.50]:80... connected.\n\nHTTP request sent, awaiting\
    \ response... 200 OK\nLength: 25 [index.html]\nSaving to: 'index.html'\n\n100%[------------------------------------------------------]\
    \ 25  --K/s    in 0s\n\n2014-05-06 21:37:13 (2.06 MB/s) - `index.html' saved [25/25]\n\
    \nroot@debian7:/etc/apache2/sites-available# cat index.html\nWelcome to chess\
    \ club 42\n```\n\n## 4. Debian 上的密码保护网站\n\n你可以使用指向 `.htpasswd` 文件的 `.htaccess`\
    \ 文件来对网站中的文件和目录进行保护。`htpasswd` 命令可以创建一个包含用户名和（加密）密码的 `.htpasswd` 文件。\n\n此截图为名为\
    \ cliff 的黑客创建了用户和密码，并使用 `-e` 标志创建 `.htpasswd` 文件。\n\n```\nroot@debian7:~# htpasswd\
    \ -c /var/www/.htpasswd cliff\nNew password:\nRe-type new password:\nAdding password\
    \ for user cliff\nroot@debian7:~# cat /var/www/.htpasswd\ncliff:$apr1$vuuj10lLk$SZ49q0swXh93P0QPVP.\n\
    ```\n\nCliff 和 Rob 选择了相同的密码（hunter2），这展示了如何向 `.htpasswd` 添加第二个用户和密码。\n\n```\n\
    root@debian7:~# htpasswd /var/www/.htpasswd rob\nNew password:\nRe-type new password:\n\
    Adding password for user rob\nroot@debian7:~# cat /var/www/.htpasswd\ncliff:$apr1$vuuj10lLk$SZ49q0swXh93P0QPVP\n\
    rob:$apr1$5Hn1IFFTcNR1HoP.IW11/1DRQ41Q0\n```\n\n我们需要在想要保护的网站的 `DocumentRoot` 中创建一个\
    \ `.htaccess` 文件。此截图显示了一个示例。\n\n```\nroot@debian7:~# cd /var/www/hunter2/\nroot@debian7:/var/www/hunter2#\
    \ cat .htaccess\nAuthUserFile=\"Members only!\"\nAuthName\nAuthType Basic\nrequire\
    \ valid-user\n```\n\n注意，我们正在保护之前创建的 9000 端口上的网站。\n\n由于我们将网站放在了名为 hunter2 的黑客空间中，且它是默认网站的子目录，我们需要如截图所示调整\
    \ `/etc/apache2/sites-available/default/default` 中的 `AllowOverride` 参数（Debian\
    \ 7 上的行号可能会有所不同）。\n\n```\n<Directory /var/www//\n    Options Indexes FollowSymLinks\
    \ MultiViews\n    AllowOverride Authconfig\n    Order allow, deny\n    allow from\
    \ all\n</Directory>\n```\n\n现在重启 apache2 服务器并测试它是否正常工作！\n\n## 1.5. CentOS 上的端口虚拟主机\n\
    \n### 1.5.1. 默认虚拟主机\n\n与 Debian 不同，CentOS 的默认网站没有虚拟主机配置文件。相反，当在默认位置（/var/www/html）未找到索引文件时，默认配置将抛出一个标准的错误页。\n\
    \n### 1.5.2. 三个虚拟主机\n\n在这种情况下，我们为三个客户创建了三个额外的网站，他们共享一个俱乐部。它们分别是：名为 Choo Choo 的模型火车俱乐部、一个名为\
    \ Chess 42 的象棋俱乐部以及一个名为 hunter2 的黑客空间。\n\n在一个 Web 服务器上运行三个网站的一种方法是让每个网站运行不同的端口。此截图显示了为每个客户新创建的虚拟主机。\n\
    \n```\n[root@CentOS65] ~# vi /etc/httpd/conf.d/choochoo.conf\n[root@CentOS65]\
    \ ~# cat /etc/httpd/conf.d/choochoo.conf\n<VirtualHost *:7000>\n  ServerAdmin\
    \ webmaster@localhost\n  DocumentRoot /var/www/html/choochoo\n</VirtualHost>\n\
    [root@CentOS65] ~# vi /etc/httpd/conf.d/chessclub42.conf\n[root@CentOS65] ~# cat\
    \ /etc/httpd/conf.d/chessclub42.conf\n<VirtualHost *:8000>\n  ServerAdmin webmaster@localhost\n\
    \  DocumentRoot /var/www/html/chessclub42\n</VirtualHost>\n[root@CentOS65] ~#\
    \ vi /etc/httpd/conf.d/hunter2.conf\n[root@CentOS65] ~# cat /etc/httpd/conf.d/hunter2.conf\n\
    <VirtualHost *:9000>\n  ServerAdmin webmaster@localhost\n  DocumentRoot /var/www/html/hunter2\n\
    </VirtualHost>\n```\n\n注意不同的端口号 7000、8000 和 9000。注意我们为每个网站指定了唯一的 `DocumentRoot`。\n\
    \n### 1.5.3. 三个额外的端口\n\n我们需要在 `httpd.conf` 文件中启用启用这三个端口。\n\n```\n[root@CentOS65]\
    \ ~# vi /etc/httpd/conf/httpd.conf\nroot@debian:-# grep \"Listen\" /etc/httpd/conf/httpd.conf\n\
    Listen 80\nListen 7000\nListen 8000\nListen 9000\n```\n\n### 1.5.4. SELinux 守护我们的端口\n\
    \n如果我们尝试重启服务器，将注意到以下错误：\n\n```\n[root@CentOS65 #] service httpd restart      [\
    \ OK ]\nStopping httpd:\nStarting httpd:\n(13)Permission denied: make_sock: could\
    \ not bind to address 0.0.0.0:7000\n listening sockets available, shutting down\n\
    \                               [FAILED]\n```\n\n这是由于 SELinux 为其他用户保留了 7000 和\
    \ 8000 端口。我们需要告诉 SELinux\n\n"
