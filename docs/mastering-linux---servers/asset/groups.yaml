    # 17.2.4. security = ads


    This mode will make samba use Kerberos to connect to the Active Directory domain.


    # 17.2.5. security = server


    This mode is obsolete, it can be used to forward authentication to another server.


    # 17.3. About password network


    The previous chapters used the smbpasswd database. For domain control we opt for
    the tdbsam password backend. Another option would be to use LDAP. Larger domains
    will benefit from using LDAP instead of the not scalable tdbsam. When you need
    more than one Domain Controller, the Samba team advises not to use tdbsam.


    # 17.4. [global] section in smb.conf


    Now is a good time to start adding comments in your smb.conf. First we will take
    a look at the naming of our domain and server in the [global] section, and at
    the domain controlling parameters.


    # 17.4.1. security


    The security must be user (which is the default). This mode will make samba control
    the user accounts, so it will allow samba to act as a domain controller.


    ```

    security = user

    ```


    # 17.4.2. os level


    A samba server is the most stable computer in the network, so it will win all
    browser elections (os level above 32) to become the browser master


    ```

    os level = 33

    ```


    # 17.4.3. passdb backend


    The passdb backend parameter will determine whether samba uses smbpasswd, tdbsam
    or ldap.


    ```

    passdb backend = tdbsam

    ```


    # 17.4.4. preferred master


    Setting the preferred master parameter to yes will make the nmbd daemon force
    an election on startup.


    ```

    preferred master = yes

    ```


    # 17.4.5. domain logons


    Setting the domain logons parameter will make this samba server a domain controller.'
