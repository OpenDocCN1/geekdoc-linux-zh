    \\HM2003\\ADMIN$ Remote Admin\n\\HM2003\\tools Remote IPC\n\\HM2003\\IPC$ A network\
    \ share to be used by Local ...\n\\HM2003\\WaitContent\n\\HM2003\\C$ Default share\n\
    [paul@RHELab -]\n```\n\n如你所见，这对所有 SMB 电脑及其共享提供了一个非常好的概览。\n\n## 10.5. server\n\n\
    net view 和 smclient 客户端看到的注释是 server 选项的默认值。只需将此值添加到 smb.conf 的全局部分并重启即可更改它。\n\
    \n```\n[root@RHEL53 samba]# testparam -s /dev/null | grep server\nserver string\
    \ = Red Hair in Paris\n```\n\n稍过之后，更改后的选项在微软电脑上将是可见的。\n\n```\nC:\\Documents and\
    \ Settings\\Administrator>net view\nServer Name\tRemark\n```\n\n```\n\\\\LAIKA\t\
    \tUbuntu\n\\\\RHEL53\t\tRed Hat\n\\\\W2003\t\tAntwerp\n```\n\n## 10.6. Samba 管理工具\
    \ (SWAT)\n\nSamba 附带了一个基于 Web 的工具来管理你的配置文件。可以通过宿主机系统的 901 端口使用 Web 浏览器访问 SWAT。检查你的系统使用的是\
    \ inetd 还是 superdaemon。\n\n```\n[root@RHEL4b]# ps | grep inetd\n1502 pts/0\t00:00\t\
    \tinetd\n2771 7\t\t00:00\t\tinetd -stayalive -pidfile /var/run/inetd.pid\n```\n\
    \n然后编辑 inetd.conf 或更改 /etc/inetd.d/swat 中的 disable 为 `disable = no`。\n\n```\n\
    [root@RHEL4b samba]# cat /etc/inetd.d/swat\n# default: off\n# description: SWAT\
    \ 是 Samba 管理工具。使用 SWAT 配置你的 Samba 服务器。要使用 SWAT，请用你喜欢的浏览器连接到 901 端口\n{\n\tport=\
    \ 901\n\tsocket_type= stream\n\twait= no\n\tonly_from= 127.0.0.1\n\tuser= root\n\
    \tserver= /usr/sbin/swat\n\tlog_failure+=\n\tdisable= no\n}\n```\n\n更改 **from**\
    \ 值以启用对子网中所有电脑的访问。使用 SWAT 时要小心，它会删除 smb.conf 中所有手动编辑的注释。\n\n```\n[root@RHEL53\
    \ tied.d]# grep /etc/inetd.d/swat\nonly_from=192.168.1.0/24\n```\n\n## 10.7. 练习：开始使用\
    \ samba\n\n1. 备份原始 smb.conf 的副本，并将其命名为 smb.conf.orig。\n2. 启用 SWAT 并查看它。\n3. 停止\
    \ Samba 服务器。\n4. 创建一个极简的 smb.conf。\n5. 创建一个极简的 smb.conf。\n6. 启动 Samba。\n7. 验证\
    \ Samba 运行正常。\n8. 验证另一台电脑可以访问。\n9. 使用 net view 查看网络。\n10. 更改 smb.conf 中的参数。\n\
    11. 重启 Samba 后，更改项会生效吗？\n12. 哪台电脑是主节点？\n13. 如果时间允许，安装嗅器。\n\n## 10.8. 答案：开始使用 samba\n\
    \n1. 备份原始 smb.conf 的副本，并将其命名为 smb.conf.orig。\n2. 启用 SWAT 并查看它。\n3. 停止 Samba 服务器。\n\
    4. 创建一个极简的 smb.conf。\n5. 使用 testparam 查看 smb.conf。\n6. 启动 Samba。\n7. 验证 Samba\
    \ 运行正常。\n8. 验证另一台电脑可以访问。\n9. 使用 net view 查看网络。\n10. 更改 smb.conf 中的参数。\n11. 重启\
    \ Samba 后，更改项会生效吗？ \n12. 哪台电脑是主节点？\n13. 如果时间允许，安装嗅器。\n\n# 第11章. 只读文件服务器\n\n##\
    \ 11.1. 设置共享目录\n\n让我们开始为 Samba 设置一个非常简单的只读文件服务器。所有人（甚至是匿名游客）都可以访问。\n\n第一步是创建一个目录并在其中放入一些测试文件。\n\
    \n```\n[root@RHEL52 ~] mkdir -p /srv/samba/readonly\n[root@RHEL52 ~] cd /srv/samba/readonly\n\
    [root@RHEL52 readonly]# echo \"It is cold today.\" > water.txt\n[root@RHEL52 readonly]#\
    \ echo \"It is hot today.\" > summer.txt\n[root@RHEL52 readonly]# ls -l\ntotal\
    \ 8\n-rw-r--r-- 1 root 17 Jan 21 05:49 summer.txt\n-rw-r--r-- 1 root 17 Jan 21\
    \ 05:49 water.txt\n[root@RHEL52 readonly]#\n```\n\n"
