    Restarting Squid HTTP proxy: squid.\n```\n\nsquid 的主配置文件是 `/etc/squid/squid.conf`。该文件详细解释了每一个参数。\n\
    \n```\nroot@debian:~# wc -l /etc/squid/squid.conf\n4948 /etc/squid/squid.conf\n\
    ```\n\n## 2.3. 端口 3128\n\n默认情况下，squid 代理服务器将监听端口 3128。\n\n```\nroot@debian:~#\
    \ grep \"port\" /etc/squid/squid.conf\nhttp_port 3128\nroot@debian:~#\n```\n\n\
    ## 2.4. 启动与停止\n\n你可以像截图所示，使用标准的服务命令管理 squid。\n\n```\nroot@debian:~# service squid\
    \ start\nStarting Squid HTTP proxy: squid.\nroot@debian:~# service squid restart\n\
    Restarting Squid HTTP proxy: squid.\nroot@debian:~# service squid status\nsquid\
    \ is running.\nroot@debian:~# service squid stop\nStopping Squid HTTP proxy: squid.\n\
    root@debian:~#\n```\n\n## 2.5. 客户端代理设置\n\n若要在 Firefox 或 Iceweasel 中启用代理服务器，请进入“编辑偏好”并如截图所示进行配置（将\
    \ 192.168.1.60 替换为代理服务器的 IP 地址）。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_42_0.png)\n\
    \n测试开启代理后内部运行正常。同时也测试在代理服务器上执行 `service squid stop` 命令后，是否会收到类似截图所示的消息。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_42_1.png)\n\
    \n若要用 Google Chrome（或 Debian Chromium）启用代理，请按如下命令行方式启动程序：\n\n```\npaul@debian7:~\\\
    $ chromium --proxy-server='192.168.1.60:3128'\n```\n\n使用 **service squid stop**\
    \ 禁用代理会导致类似此所示的错误信息。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_43_0.png)\n\n\
    ## 2.6. 倒置图像\n\n代理服务器位于你的浏览器和互联网之间。除了缓存互联网数据（代理服务器的原始功能）以及基于网页内容的防火墙限制外，代理服务器处于一个完美的位置，可以允许你访问的网页。\n\
    \n你可以对网页进行更改（或移除某些广告），或者像我们在本例中做的那样：更改所有图像使其倒置。\n\n服务器需要命令行工具来处理图像，以及一个使用这些工具的\
    \ perl 脚本（使用 `wget` 下载图像并使用 apache 服务）。在本例中我们使用了 `imagemagick`（它提供了转换和修改工具）。\n\
    \n```\nroot@debian:~# aptitude install imagemagick wget apache2\n--truncated...\n\
    output truncated...\nroot@debian7:~# dpkg -s $(which mogify)\nimagemagick: /usr/bin/mogify\n\
    debian7:~#\n```\n\n下方显示的 perl 脚本可以在多个网站上找到，我没有找到作者。不过它是一个非常简单的脚本，使用 `wget` 和 `mogify`\
    \ 下载图像（`.jpg` 和 `.png`），将它们翻转并存储在 `/var/www/`。\n\n```bash\nroot@debian7:~# cat\
    \ /usr/local/bin/flip.pl\n$count = 0;\n$pid = $$;\nwhile (<>) {\n\tchomp($_);\n\
    \tif ($1 =~ /\\.*jpg$/i) {\n\t\t$url = $1;\n\t\tsystem(\"/usr/bin/wget\", \"-q\"\
    , \"-O\", \"/var/www/images/$count.jpg\");\n\t\tsystem(\"/usr/bin/mogify\", \"\
    -flip\", \"/var/www/images/$count.jpg\");\n\t\tprint(\"http://127.0.0.1/images/$count.jpg\\\
    n\");\n\t} elsif ($1 =~ /\\.*gif$/i) {\n\t\t$url = $1;\n\t\tsystem(\"/usr/bin/wget\"\
    , \"-q\", \"-O\", \"/var/www/images/$count.gif\");\n\t\tsystem(\"/usr/bin/mogify\"\
    , \"-flip\", \"/var/www/images/$count.gif\");\n\t\tprint(\"http://127.0.0.1/images/$count.gif\\\
    n\");\n\t} elsif ($1 =~ /\\.*png$/i) {\n\t\t$url = $1;\n\t\tsystem(\"/usr/bin/wget\"\
    , \"-q\", \"-O\", \"/var/www/images/$count.png\");\n\t\tsystem(\"/usr/bin/mogify\"\
    , \"-flip\", \"/var/www/images/$count.png\");\n\t\tprint(\"http://127.0.0.1/images/$count.png\\\
    n\");\n\t} else {\n\t\tprint(\"\\n\");\n\t}\n\t$count++;\n}\n```\n\n在 `/etc/squid/squid.conf`\
    \ 中更改或添加以下行：\n\n```\nhttp_access allow localnet\nhttp_port 3128 transparent\n\
    ```\n\n## 2.7. /var/log/squid\n\nsquid 的标准日志位置是 `/var/log/squid`。\n\n脚本 `/usr/local/bin/flip.pl`\
    \ 使用 `/var/www/images`，并且应该被 squid 服务器（使用用户 proxy）和 apache2 服务器（使用 www-data）访问。截图显示如何创建此目录、设置权限并让用户加入组。\n\
    \n```\nroot@debian7:~# mkdir /var/www/images\nroot@debian7:~# chown www-data /var/www/images\n\
    root@debian7:~# chmod 755 /var/www/images\nroot@debian7:~# usermod -aG proxy www-data\n\
    root@debian7:~# usermod -aG proxy\n```\n\n重启 squid 和 apache2 后测试运行正常。(img/1d499a6177836f6f088a9e2a53e11a14_45_0.png)\n\
    \n## 2.8. 访问控制\n\n默认 squid 设置只允许 localhost。要为私网络范围启用访问，请在 `squid.conf` 中查找“INSERT\
    \ YOUR RULE(S)”句子并添加类似下方所示的两行。\n\n```\n# INSERT YOUR RULE(S) TO ALLOW ACCESS FROM\
    \ CLIENTS\nacl company_network src 192.168.1.0/24\nhttp_access allow company_network\n\
    ```\n\n## 2.9. 测试 squid\n\n首先，确保运行中的 squid 可以访问互联网。\n\n```\nroot@RHEL4 ~ # wget\
    \ -q http://linux-training.be/index.html\nroot@RHEL4 ~ # ls -l index.html\n-rw-r--r--\
    \ 1 root 2269 Sep 18 13:18 index.html\n```\n\n然后配置浏览器或客户端使用代理服务器，或者你可以为命令行程序设置\
    \ `HTTP_PROXY` 变量指向代理。\n\n```\nroot@fedora ~ # export HTTP_PROXY=http://192.168.1.39:8080\n\
    root@ubuntu ~ # export http_proxy=http://192.168.1.39:8080\n```\n\n可以使用 `wget\
    \ -q` 测试客户端以简化截图。\n\n```\nroot@RHEL5 ~ # wget > /resolv.conf\nroot@RHEL5 ~ # wget\
    \ -q http://www.linux-training.be/index.html\nroot@RHEL5 ~ # ls -l index.html\n\
    -rw-r--r-- 1 root 2269 Sep 18 20:08 index.html\n```\n\n## 2.10. 域名解析\n\n你需要在 squid\
    \ 上进行域名解析，但客户端不需要。\n\n```\npaul@RHEL5 ~ $ wget http://grep.be\n--14:35:44-- grep.be\n\
    Resolving grep.be... failed: Temporary failure in name resolution.\npaul@RHEL5\
    \ ~ $ export http_proxy=http://192.168.1.39:8080\npaul@RHEL5 ~ $ wget http://grep.be\n\
    --14:35:49-- http://grep.be/\n```\n\nConnecting to 192.168.1.39:8080... connected.\n\
