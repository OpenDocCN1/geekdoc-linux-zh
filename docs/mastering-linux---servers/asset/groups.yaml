    15. If time permits then combine "read list", "write list", "hosts allow" and
    "hosts deny". Which of these has priority ?


    # Chapter 16. samba domain member


    ## 16.1. changes in smb.conf


    ### 16.1.1. workgroup


    The **workgroup** option in the global section should match the netbios name of
    the Active Directory domain.


    ```

    workgroup = STARGATE

    ```


    ### 16.1.2. security mode


    Authentication is not handled by samba now, but by the Active Directory domain
    controllers, so we set the **security** option to domain.


    ```

    security = Domain

    ```


    ### 16.1.3. Linux uid''s


    Linux requires a user account for every user accessing its file system, we need
    to provide Samba with a range of uid''s and gid''s that it can use to create these
    user accounts. The range is determined by the **idmap uid** and the **idmap gid**
    parameters. The first Active Directory user to connect will receive Linux uid
    20000.


    ```

    idmap uid = 20000-22000

    idmap gid = 20000-22000

    ```


    ### 16.1.4. winbind use default domain


    The **winbind use default domain** parameter makes winbind also operates on users
    without a domain component in their name.


    ```

    winbind use default domain = yes

    ```


    ### 16.1.5. [global] section in smb.conf


    Below is our global section in **smb.conf**.


    ```

    [global]

    workgroup = STARGATE

    security = Domain

    server string = Stargate Domain Member Server

    idmap uid = 20000-22000

    idmap gid = 20000-22000

    winbind use default domain = yes

    ```


    ### 16.1.6. realm in /etc/krb5.conf


    Connect to a Windows 2003 sp2 (or later) you will need to adjust the kerberos
    realm in /etc/krb5.conf and set both lookup statements to true.


    ```

    [libdefaults]

    default_realm = STARGATE.LOCAL

    dns_lookup_realm = true

    dns_lookup_kdc = true

    ```


    ### 16.1.7. [share] section in smb.conf


    Nothing is required for the share section in smb.conf. Remember that we do not
    manually create users in smbpasswd or on the Linux (/etc/passwd). Only Active
    Directory users are allowed access.


    ```

    [domainata]

    path = /srv/samba/domainata

    comment = Active Directory users only

    read only = No

    ```


    ## 16.2. joining an Active Directory domain


    While the Samba server is stopped, you can use net rpc join to join the Active
    Directory domain.


    ```

    [root@RHEL52 samba]# service smb stop      [ OK ]

    Shutting down SMB services:             [ OK ]

    Shutting down NMB services:             [ OK ]

    [root@RHEL52 samba]# net rpc join -U Administrator

    Password:

    Joined domain STARGATE.

    ```


    We can verify in aduc (Active Directory Users and Computers) that a computer account
    is created for this samba server.


    ## 16.3. winbind


    ### 16.3.1. adding winbind to nsswitch.conf


    The winbind daemon is talking with the Active Directory domain.


    We need to update the /etc/nsswitch.conf file, so user group and host names can
    be resolved against the winbind daemon.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_197_0.png)


    ```

    [root@RHEL52 samba]## vi /etc/nsswitch.conf

    [root@RHEL52 samba]## grep winbind /etc/nsswitch.conf

    passwd:      files winbind

    group:      files winbind

    hosts:       files dns winbind

    ```


    ### 16.3.2. starting samba and winbindd


    Time to start Samba followed by winbindd.


    ```

    [root@RHEL4b samba]## service smb start

    Starting SMB services:      [ OK ]

    Starting NMB services:      [ OK ]

    [root@RHEL4b samba]## service winbind start

    Starting winbindd services:  [ OK ]

    [root@RHEL4b samba]#

    ```


    ## 16.4. wbinfo


    ### 16.4.1. verify the trust


    You can use wbinfo -t to verify the trust between your samba server and Active
    Directory.


    ### 16.4.2. list all users


    We can obtain a list of all user with the wbinfo -u command. The domain is not
    shown when the winbind use default domain parameter is set.


    ```

    [root@RHEL52 ~]# wbinfo -u

    TEACHER0\serena

    TEACHER0\justine

    TEACHER0\martina

    STARGATE\administrator

    STARGATE\guest

    STARGATE\support_388945a0

    STARGATE\polk

    STARGATE\rbtgt

    STARGATE\arthur

    STARGATE\harry

    ```


    ### 16.4.3. list all groups


    We can obtain a list of all groups with the wbinfo -g command. The domain is not
    shown when the winbind use default domain is set.


    ```

    [root@RHEL52 ~]# wbinfo -g

    BUILTIN\administrators

    BUILTIN\users

    BATMAN\domain computers

    BATMAN\domain controllers

    BATMAN\domain admins

    BATMAN\domain users

    BATMAN\domain guests

    BATMAN\group owners

    ```


    ### 16.4.4. query a user


    We can use wbinfo -a to verify authentication of a user against Active Directory.
    Assuming a user account with password stargate is created on Active Directory,
    we get the following.


    ```

    [root@RHEL52 ~]# wbinfo -a harry@stargate

    plaintext authentication succeeded

    challenge/response authentication succeeded

    ```


    ### 16.4.5. getent


    We use getent to verify that winbind is working and actually adding the directory
    users to /etc/passwd.


    ```

    [root@RHEL52 ~]# get passwd harry

    harry*:20000:000:/home/harry:/bin/bash

    [root@RHEL52 ~]# get passwd arthur

    arthur*:20001:000:/home/arthur:/bin/bash

    [root@RHEL52 ~]# get passwd bilco

    bilco*:20002:000:/home/bilco:/bin/bash

    ```


    If the user already exists locally, the local user account is shown. This is because
    winbind is configured in /etc/nsswitch.conf.


    ```

    [root@RHEL52 ~]# get passwd paul

    paul:x:500:500:/home/paul:/bin/bash

    ```


    All the Active Directory users can now connect to the Samba share. Files created
    by them, belong to them.


    ### 16.6. file ownership


    ```

    [root@RHEL4 samba]# ls -l /srv/samba/domainata/

    total 0

    -rwxr-- 1 justine 20000 0 Jun 22 14 create_by_justine_on_winxp.txt

    -rwxr-- 1 venus 20000 0 Jun 22 15 create_by_venus.txt

    -rwxr-- 1 maria 20000 0 Jun 22 17 Marla.txt

    ```


    ## 16.7. practice : samba domain member


    1. Verify that you have a working Active Directory (AD) domain.

    2. Add the domain name and domain controller to /etc/hosts. Set the AD-DNS in
    /etc/resolv.conf.

    3. Setup Samba as a member server in the domain.

    4. Verify the creation of a computer account in AD for your Samba server.

    5. Verify the automatic creation of AD users in /etc/passwd with wbinfo and getent.

    6. Connect to Samba shares with AD users, and verify ownership of their files.


    # Chapter 17. samba domain controller


    ## 17.1. about Domain Controllers


    ### 17.1.1. Windows NT4


    Windows NT4 works with single master replication domain controllers. There is
    exactly one PDC (Primary Domain Controller) in the domain, and zero or more BDCs
    (Backup Domain Controllers). Samba found in NT4 has all features of Windows PDC
    and BDC, and more. This includes file and print serving, domain control with single
    logon, logon scripts, home directories and roaming profiles.


    ### 17.1.2. Windows 2000


    With Windows 2000 came Active Directory. AD includes multmaster replication and
    group policies. Samba 3 can only be a member server in Active Directory, it cannot
    manage group policies. Samba 4 can do this (in beta).


    ### 17.1.3. Samba 3


    Samba 3 can act as a domain controller in its own domain. In a Windows NT4 domain,
    one Windows NT4 PDC and zero or more BDCs, Samba 3 can only be a member server.
    The same is valid for Samba 3 in an Active Directory. In short, a Samba 3 domain
    controller can not share domain control with Windows domain controllers.


    ### 17.1.4. Samba 4


    Samba 4 can be a domain controller in an Active Directory domain, including managing
    group policies. As of this writing, Samba 4 is not released for production!


    ## 17.2. About security modes


    ### 17.2.1. security = share


    The Windows for Workgroups'' way of working, a client requests connection to a
    share and provides a password for that connection. Anyone who knows a password
    for a share can access that share. This security model was common in Windows 3.11,
    Windows 95, Windows 98 and Windows ME.


    ### 17.2.2. security = user


    The client will send a userid + password before the server knows which share the
    client wants to access. This mode should be used whenever the samba server is
    in control of the user database. For standalone and samba domain controllers.


    ### 17.2.3. security = domain


    This mode will allow samba to verify user credentials using NTLM in Windows NT4
    and in all Active Directory domains. This is similar to Windows NT4 BDC''s joining
    a native Windows 2000/3 Active Directory domain.

