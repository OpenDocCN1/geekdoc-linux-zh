    \ 31 18:35 envvars\n-rw-r---- 1 root root 31063 Jul 20 2013 magic\ndrwx-xr-x 2\
    \ root root 4096 May 6 13:19 mods-available\ndrwx-xr-x 2 root root 4096 May 6\
    \ 13:19 mods-enabled\n-rw-r--r-- 1 root root 750 Jan 26 12:13 ports.conf\ndrwx-xr-x\
    \ 2 root root 4096 May 6 13:19 sites-available\ndrwx-xr-x 2 root root 4096 May\
    \ 6 13:19 sites-enabled\nroot@debian7:~#\n```\n\n## 1.2. port virtual hosts on\
    \ Debian\n\n### 1.2.1. default virtual host\n\nDebian has a virtualhost configuration\
    \ file for its default website in /etc/apache2/sites-available/default.\n\n```bash\n\
    root@debian:~# head -2 /etc/apache2/sites-available/default\n<VirtualHost *:80>\n\
    \    ServerAdmin webmaster@localhost\n```\n\n### 1.2.2. three extra virtual hosts\n\
    \nIn this scenario we created three additional websites for three customers that\
    \ share a clubhouse and want to jointly hire you. They are a model train club\
    \ Choo Choo, a chess club named Chess Club 42 and a hackerspace named hunter2.\n\
    \nOne way to put websites on one server is to put each website on a different\
    \ port. This screenshot shows they newly created virtual hosts, one for each customer.\n\
    \n```bash\nroot@debian:~# vi /etc/apache2/sites-available/choochoo\nroot@debian:~#\
    \ cat /etc/apache2/sites-available/choochoo\n<VirtualHost *:7000>\n    ServerAdmin\
    \ webmaster@localhost\n    DocumentRoot /var/www/choochoo\n</VirtualHost>\nroot@debian:~#\
    \ vi /etc/apache2/sites-available/chessclub42\nroot@debian:~# cat /etc/apache2/sites-available/chessclub42\n\
    <VirtualHost *:8000>\n    ServerAdmin webmaster@localhost\n    DocumentRoot /var/www/chessclub42\n\
    </VirtualHost>\nroot@debian:~# vi /etc/apache2/sites-available/hunter2\nroot@debian:~#\
    \ cat /etc/apache2/sites-available/hunter2\n<VirtualHost *:9000>\n    ServerAdmin\
    \ webmaster@localhost\n    DocumentRoot /var/www/hunter2\n</VirtualHost>\n```\n\
    \nNotice the different ports 7000, 8000 and 9000. Notice also that we specified\
    \ a unique DocumentRoot for each website. Are you using Ubuntu or Mint, then these\
    \ config files need to end in .conf.\n\n### 1.2.3. three extra ports\n\nWe need\
    \ to enable these three ports in the ports.conf file. Open this file with vi and\
    \ add three lines to listen on extra ports.\n\n```bash\nroot@debian7:~# vi /etc/apache2/ports.conf\n\
    root@debian7:~# grep Listen /etc/apache2/ports.conf\nListen 80\nListen 7000\n\
    Listen 8000\nListen 9000\n```\n\n### 1.2.4. three extra websites\n\nWe need to\
    \ create three DocumentRoot directories and have to put some simple website in\
    \ these directories.\n\n```bash\nroot@debian7:~# mkdir /var/www/choochoo\nroot@debian7:~#\
    \ mkdir /var/www/chessclub42\nroot@debian7:~# mkdir /var/www/hunter2\nroot@debian7:~#\
    \ echo 'Choo Choo model train Choo Choo' > /var/www/chochoo/index.html\nroot@debian7:~#\
    \ echo 'Welcome to chess club 42' > /var/www/chessclub42/index.html\nroot@debian7:~#\
    \ echo 'Hacking is fun' > /var/www/hunter2/index.html\n```\n\n### 1.2.5. enabling\
    \ extra websites\n\nThe last step is to enable the websites with the a2 command.\
    \ This command will create links in sites-enabled. The links are not there yet...\n\
    \n```bash\nroot@debian:~# cd /etc/apache2/\nroot@debian:~# ls sites-available/\n\
    chessclub42 choochoo default hunter2\nroot@debian:~# ls sites-enabled/\n```\n\n\
    So we run the a2 command for all websites. To activate the new configuration,\
    \ you need to run: service apache2 reload.\n\n```bash\nroot@debian:~# a2 choochoo\n\
    root@debian:~# a2 chessclub42\nroot@debian:~# a2 hunter2\nroot@debian:~# service\
    \ apache2 reload\n```\n\n### 1.2.6. testing the three train websites\n\nTesting\
    \ the model train named Choo Choo on port 7000.\n\n```bash\nroot@debian7:~# wget\
    \ 127.0.0.1:7000\n2014-05-06 21:16:03-- http://127.0.0.1:7000/\nConnecting to\
    \ 127.0.0.1:7000... connected.\nHTTP request sent, awaiting response... 200 OK\n\
    Length: 32 [text/html]\nSaving to: index.html\n====================> 32 KB/s in\
    \ 0\n2014-05-06 21:16:03 (2.92 MB/s) 'index.html' saved [32/32]\nroot@debian7:~#\
    \ cat /var/www/index.html\nChoo Choo model train Choo Choo\n```\n\nTesting the\
    \ chess named Chess 42 on port 8000.\n\n```bash\nroot@debian7:~# wget 127.0.0.1:8000\n\
    2014-05-06 21:16:20-- http://127.0.0.1:8000/\nConnecting to 127.0.0.1:8000...\
    \ connected.\nHTTP request sent, awaiting response... 200 OK\nLength: 26 [text/html]\n\
    Saving to: index.html\n====================> 25 KB/s in 0\n2014-05-06 21:16:20\
    \ (2.16 MB/s) 'index.html' saved [25/25]\nroot@debian7:~# cat /var/www/index.html\n\
    Welcome to chess club 42\n```\n\nTesting the hacker club number 2 on port 9000.\n\
    \n```bash\nroot@debian7:~# wget 127.0.0.1:9000\n2014-05-06 21:16:30-- http://127.0.0.1:9000/\n\
    Connecting to 127.0.0.1:9000... connected.\nHTTP request sent, awaiting response...\
    \ 200 OK\nLength: 26 [text/html]\nSaving to: index.html\n====================>\
    \ 32 KB/s in 0\n2014-05-06 21:16:30 (2.0 MB/s) 'index.html' saved [26/26]\nroot@debian7:~#\
    \ cat /var/www/index.html\nHacking is fun\n```\n\nCleaning the temporary files.\n\
    \n```bash\nroot@debian7:~# rm index.html\n```\n\n## 1.3. named virtual hosts on\
    \ Debian\n\n### 1.3.1. named virtual hosts\n\nThe chess club and the model train\
    \ club the port numbers too hard to remember. They would prefer to have their\
    \ website accessible by name.\n\nWe continue work on the same server that has\
    \ three websites on three ports. We need to make sure these websites are accessible\
    \ using the names choochoo.local, chessclub42.local and hunter2.local.\n\nWe start\
    \ by creating new virtual hosts. Try testing from another computer using the ip-address\
    \ of your server.\n\n### 1.3.2. name resolution\n\nWe need some way to resolve\
    \ names with DNS. This can be discussed in another chapter. For this example it\
    \ is also possible to quickly add the three names to the /etc/hosts file.\n\n\
    ```bash\nroot@debian?:# grep ^192 /etc/hosts\n192.168.42.50 choochoo.local\n192.168.42.50\
    \ chessclub42.local\n192.168.42.50 hunter2.local\n```\n\nNote that you may have\
    \ another ip address...\n"
  mdcn: "\n\n## 1.1.7. apache 配置\n\n在 Debian 或 CentOS 上配置 apache 时，有很多相似之处，但也有几处不同。这两个\
    \ Linux 家族都有自己的所有者示例。\n\nRHEL/CentOS 上的所有配置都在 /etc/httpd 中完成。\n\n```bash\n[root@centos65\
    \ ~]# ls -l /etc/httpd/\ntotal 8\ndrwx-xr-x 2 root root 4096 May 6 13:08 conf\n\
    drwx-xr-x 2 root root 4096 May 6 13:08 conf.d\nlrwx-xr-wx 1 root root 19 May 6\
    \ 13:08 logs -> ../var/log/httpd\nlrwx-xr-wx 1 root root 29 May 6 13:08 modules\
    \ -> ../usr/lib64/httpd/modules\n\ndrwx-xr-wx 1 root root 19 May 6 13:08 run ->\
    \ ../var/run/httpd\n[root@centos65 ~]#\n```\n\nDebian（以及 ubuntu/...）使用 /etc/apache2。\n\
    \n```bash\nroot@debian7:~# ls -l /etc/apache2/\ntotal 72\n-rw-r--r-- 1 root root\
    \ 9659 May 6 14:23 apache2.conf\ndrwx-xr-x 2 root root 4096 May 6 13:19 conf.d\n\
    -rw-r--r-- 1 root root 1465 Jan 31 18:35 envvars\n-rw-r---- 1 root root 31063\
    \ Jul 20 2013 magic\ndrwx-xr-x 2 root root 4096 May 6 13:19 mods-available\ndrwx-xr-x\
    \ 2 root root 4096 May 6 13:19 mods-enabled\n-rw-r--r-- 1 root root 750 Jan 26\
    \ 12:13 ports.conf\ndrwx-xr-x 2 root root 4096 May 6 13:19 sites-available\ndrwx-xr-x\
    \ 2 root root 4096 May 6 13:19 sites-enabled\nroot@debian7:~#\n```\n\n## 1.2.\
    \ 在 Debian 上使用端口虚拟主机\n\n### 1.2.1. 默认虚拟主机\n\nDebian 为其默认网站有一个虚拟主机配置文件，位于 /etc/apache2/sites-available/default。\n\
    \n```bash\nroot@debian:~# head -2 /etc/apache2/sites-available/default\n<VirtualHost\
    \ *:80>\n    ServerAdmin webmaster@localhost\n```\n\n### 1.2.2. 三个额外的虚拟主机\n\n\
    在这种场景下，我们为三个客户创建了三个额外的网站，他们共享一个俱乐部并希望共同聘用你。他们是一个名为 Choo Choo 的模型火车俱乐部、一个名为 Chess\
    \ Club 42 的象棋俱乐部以及一个名为 hunter2 的黑客空间。\n\n在一个服务器上放置网站的一种方法是将每个网站放在不同的端口上。此截图显示了他们新创建的虚拟主机，每个客户一个。\n\
    \n```bash\nroot@debian:~# vi /etc/apache2/sites-available/choochoo\nroot@debian:~#\
    \ cat /etc/apache2/sites-available/choochoo\n<VirtualHost *:7000>\n    ServerAdmin\
    \ webmaster@localhost\n    DocumentRoot /var/www/choochoo\n</VirtualHost>\nroot@debian:~#\
    \ vi /etc/apache2/sites-available/chessclub42\nroot@debian:~# cat /etc/apache2/sites-available/chessclub42\n\
    <VirtualHost *:8000>\n    ServerAdmin webmaster@localhost\n    DocumentRoot /var/www/chessclub42\n\
    </VirtualHost>\nroot@debian:~# vi /etc/apache2/sites-available/hunter2\nroot@debian:~#\
    \ cat /etc/apache2/sites-available/hunter2\n<VirtualHost *:9000>\n    ServerAdmin\
    \ webmaster@localhost\n    DocumentRoot /var/www/hunter2\n</VirtualHost>\n```\n\
    \n注意不同的端口 7000、8000 和 9000。注意我们还为每个网站指定了唯一的 DocumentRoot。如果你使用的是 Ubuntu 或 Mint，这些配置文件需要以\
    \ .conf 结尾。\n\n### 1.2.3. 三个额外的端口\n\n我们需要在 ports.conf 中启用这三个端口。用 vi 打开文件并添加三行来监听额外的端口。\n\
    \n```bash\nroot@debian7:~# vi /etc/apache2/ports.conf\nroot@debian7:~# grep Listen\
    \ /etc/apache2/ports.conf\nListen 80\nListen 7000\nListen 8000\nListen 9000\n\
    ```\n\n### 1.2.4. 三个额外的网站\n\n我们需要创建三个 DocumentRoot 并在这些目录中放置简单的网站。\n\n```bash\n\
    root@debian7:~# mkdir /var/www/choochoo\nroot@debian7:~# mkdir /var/www/chessclub42\n\
    root@debian7:~# mkdir /var/www/hunter2\nroot@debian7:~# echo 'Choo Choo model\
    \ train Choo Choo' > /var/www/choochoo/index.html\nroot@debian7:~# echo 'Welcome\
    \ to chess club 42' > /var/www/chessclub42/index.html\nroot@debian7:~# echo 'Hacking\
    \ is fun' > /var/www/hunter2/index.html\n```\n\n### 1.2.5. 启用网站\n\n最后一步是使用 a2\
    \ 命令启用网站。此命令会在 sites-enabled 中创建链接。这些链接还没有……\n\n```bash\nroot@debian:~# cd /etc/apache2/\n\
    root@debian:~# ls sites-available/\nchessclub42  choochoo  default\nroot@debian:~#\
    \ ls sites-enabled/\n```\n\n为所有网站运行 a2 命令。为了激活新配置，你需要运行：service apache2 reload。\n\
    \n```bash\nroot@debian:~# a2 choochoo\nroot@debian:~# a2 chessclub42\nroot@debian:~#\
    \ a2 hunter2\nroot@debian:~# service apache2 reload\n```\n\n### 1.2.6. 测试网站\n\n\
    在端口 7000 上测试模型火车 Choo Choo。\n\n```bash\nroot@debian7:~# wget 127.0.0.1:7000\n\
    2014-05-06 21:16:03-- http://127.0.0.1:7000/\nConnecting to 127.0.0.1:7000...\
    \ connected.\nHTTP request sent, awaiting response... 200 OK\nLength: 32 [text/html]\n\
    Saving to: index.html\n================> 32 KB/s in 0\n2014-05-06 21:16:03 (2.92\
    \ MB/s) 'index.html' saved [32/32]\nroot@debian7:~# cat /var/www/choochoo/index.html\n\
    Choo Choo model train Choo Choo\n```\n\n在端口 8000 上测试 Chess 42。\n\n```bash\nroot@debian7:~#\
    \ wget 127.0.0.1:8000\n2014-05-06 21:16:20-- http://127.0.0.1:8000/\nConnecting\
    \ to 127.0.0.1:8000... connected.\nHTTP request sent, awaiting response... 200\
    \ OK\nLength: 26 [text/html]\nSaving to: index.html\n================> 25 KB/s\
    \ in 0\n2014-05-06 21:16:20 (2.16 MB/s) 'index.html' saved [25/25]\nroot@debian7:~#\
    \ cat /var/www/chessclub42/index.html\nWelcome to chess club 42\n```\n\n在端口 9000\
    \ 上测试黑客俱乐部 2。\n\n```bash\nroot@debian7:~# wget 127.0.0.1:9000\n2014-05-06 21:16:30--\
    \ http://127.0.0.1:9000/\nConnecting to 127.0.0.1:9000... connected.\nHTTP request\
    \ sent, awaiting response... 200 OK\nLength: 26 [text/html]\nSaving to: index.html\n\
    ================> 32 KB/s in 0\n2014-05-06 21:16:30 (2.0 MB/s) 'index.html' saved\
    \ [26/26]\nroot@debian7:~# cat /var/www/hunter2/index.html\nHacking is fun\n```\n\
    \n清理临时文件。\n\n```bash\nroot@debian7:~# rm index.html\n```\n\n## 1.3. 在 Debian 上使用命名虚拟主机\n\
    \n### 1.3.1. 命名虚拟主机\n\n象棋俱乐部和模型火车俱乐部的端口号太难记忆了。他们希望通过名称访问网站。\n\n我们继续在具有三个端口网站的同一服务器上工作。我们需要确保这些网站可以通过\
    \ choochoo.local、chessclub42.local 和 hunter2.local 访问。\n\n我们首先创建新的虚拟主机。从另一台计算机使用服务器的\
    \ IP 地址进行测试。\n\n### 1.3.2. 名称解析\n\n我们需要某种方式解析名称。这可以在另一个章节中讨论。在本示例中，也可以快速地将三个名称添加到\
    \ /etc/hosts 文件中。\n\n```bash\nroot@debian?:# grep ^192 /etc/hosts\n192.168.42.50\
    \ choochoo.local\n192.168.42.50 chessclub42.local\n192.168.42.50 hunter2.local\n\
    ```\n\n注意你可能还有另一个 IP 地址...\n\n"
