  - '[PAGE 134]


    # 8.3.7. iptables save


    Use iptables RHEL to automatically implement these rules when the firewall is
    (re)started.


    ```

    [root@RHEL ~]# # /etc/init.d/iptables save

    Saving iptables rules to /etc/sysconfig/iptables:

    [root@RHEL ~]# #

    ```


    # 8.3.8. scripting example


    You can write a simple script for these rules. Below is an example script that
    implements the firewall rules that you saw before in chapter.


    ```

    #!/bin/bash

    # first cleanup everything

    iptables -t filter -F

    iptables -t filter -X

    iptables -t nat -F

    iptables -t nat -X


    # default drop

    iptables -P INPUT DROP

    iptables -P FORWARD DROP

    iptables -P OUTPUT DROP


    # allow loopback device

    iptables -A INPUT -o lo -j ACCEPT

    iptables -A OUTPUT -o lo -j ACCEPT


    # allow ssh over eth0 from outside to system

    iptables -A INPUT -i eth0 -p tcp --dport 22 -j ACCEPT

    iptables -A OUTPUT -o eth0 -p tcp --sport 22 -j ACCEPT


    # allow any traffic from 10.1.1.0/24 to system

    iptables -A INPUT -i eth -s 10.1.1.0/24 -p tcp -j ACCEPT

    iptables -A OUTPUT -o eth -d 10.1.1.0/24 -p tcp -j ACCEPT

    ```'
  - '[PAGE 135]


    # 8.3.9. Allowing ICMP(ping)


    When you enable iptables, you will get an ''Operation not permitted'' message
    when trying to ping other hosts.


    ```

    [root@RHEL5 ~]# ping 192.168.187.130

    PING 192.168.187.130 (192.168.187.130) 56(84) bytes of data.

    ping: sendmsg: Operation not permitted

    ping: sendmsg: Operation not permitted

    ```


    The screenshot below shows how to set up iptables to allow a ping from or to your
    machine.


    ```

    [root@RHEL5 ~]# iptables -A INPUT -p icmp --icmp-type any -j ACCEPT

    [root@RHEL5 ~]# iptables -A OUTPUT -p icmp --icmp-type any -j ACCEPT

    ```


    The previous two lines do not allow other computers to route ping messages through
    your router, because it only handles INPUT and OUTPUT. For routing of ping, you
    will need to enable it on the FORWARD chain. The following command enables routing
    of icmp messages between networks.


    ```

    [root@RHEL5 ~]# iptables -A FORWARD -p icmp --icmp-type any -j ACCEPT

    ```'
