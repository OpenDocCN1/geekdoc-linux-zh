  - "[PAGE 44]\n\n# 2.6. upside down images\n\nA proxy server sits between your browser\
    \ and the internet. Besides caching of internet data (the original function of\
    \ a proxy server) and besides firewall restrictions based on www content, a proxy\
    \ server is in the perfect position to allow the webpages that you visit.\n\n\
    You could instance the change on a webpage (or remove certain advertisers), or\
    \ we do we in this example; change all images so they are upside down.\n\nThe\
    \ server needs command line tools to manipulate images and a perl script that\
    \ uses these tools (wget to download images locally and serve them with apache).\
    \ In this example we use imagemagick (which provides tools to convert and modify).\n\
    \n```\nroot@debian7:~# aptitude install imagemagick wget perl apache2\n--truncated...\n\
    output truncated...\nroot@debian7:~# dpkg -s $(which mogrify)\nimagick: /usr/bin/mogrify.6\n\
    root@debian7:~#\n```\n\nThe perl script that is shown in the screenshot below\
    \ can be found on several websites, I have not found the original author. It is\
    \ however a very simple script that uses wget and mogrify to download images (.jpg,\
    \ .gif and .png), flip them and store them in /var/www/\n\n```\nroot@debian7:~#\
    \ cat /usr/local/bin/flip.pl\n!/usr/bin/perl\n$count = 0;\n$pid = $$;\nwhile (<>)\
    \ {\n\tchomp(\\$);\n\ttif (\\$1 =~ /\\.*\\.jpg\\)/i) {\n\t\\$url = \\$1;\n\t\t\
    system(\"/usr/bin/wget\", \"-q\", \"-O\", \"/var/www/images/pid-\\$count.jpg\"\
    , \"$url\");\n\t\tsystem(\"/usr/bin/mogrify\", \"-flip\", \"/var/www/images/pid-\\\
    $count.jpg\");\n\t\tprint(\"http://127.0.0.1/images/pid-\\$count.jpg\\n\");\n\t\
    }elsif (\\$1 =~ /\\.*\\.gif\\)/i) {\n\t\\$url = \\$1;\n\t\tsystem(\"/usr/bin/wget\"\
    , \"-q\", \"-O\", \"/var/www/images/pid-\\$count.gif\", \"$url\");\n\t\tsystem(\"\
    /usr/bin/mogrify\", \"-flip\", \"/var/www/images/pid-\\$count.gif\");\n\t\tprint(\"\
    http://127.0.0.1/images/pid-\\$count.gif\\n\");\n\t}elsif (\\$1 =~ /\\.*\\.png\\\
    )/i) {\n\t\\$url = \\$1;\n\t\tsystem(\"/usr/bin/wget\", \"-q\", \"-O\", \"/var/www/images/pid-\\\
    $count.png\", \"$url\");\n\t\tsystem(\"/usr/bin/mogrify\", \"-flip\", \"/var/www/images/pid-\\\
    $count.png\");\n\t\tprint(\"http://127.0.0.1/images/pid-\\$count.png\\n\");\n\t\
    }else {\n\t\tprint(\"$\\n\");\n\t}\n\t\\$count++;\n}\n```\n\nChange (or add) the\
    \ following line in /etc/squid/squid.conf.\n\n```\nhttp_access allow localnet\n\
    http_port 3128 transparent\n```"
