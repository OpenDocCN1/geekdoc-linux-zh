  mdcn: "\n\n# ipv6 简介\n\n```\n2002:c0a8:12a1::1::\n```\n\n你可以使用该命令将任何 ipv4 地址转换为此范围。\n\
    \n```bash\npaul@ubi1010:~$ printf \"2002:%02x:%02x:%02x:%04x:%1\\n\" echo 192.168.1.42/24\
    \ | tr tr /:/:'\n2002:c0a8:012a:0018::1\n```\n\n## 21.9. ISP\n\n如果你足够幸运从 ISP 获取了一个\
    \ ipv6 地址，那么它将以 2001 开头。\n\n## 21.10. 不可路由地址\n\n类似于 DNS 中的 example.com，ipv6 地址被预留用于示例，且在互联网上是不可路由的。\n\
    \n```\nffff::32\n2001:db8::32\n```\n\n## 21.11. ping6\n\n使用 ping6 测试 ipv6 主机之间的连接性。你需要指定接口（对于“随机”生成的地址没有路由表）。\n\
    \n```bash\n[root@fedora4]# ping6 -I eth0 fe80::a00:27ff:fec:(fe80::a00:27ff:fec)\
    \ from fe80::a00:27ff:3c:4346 eth0: 56\n64 bytes from fe80::a00:27ff:fec icmp_seq=1\
    \ ttl=64 time=0.58 ms\n64 bytes from fe80::a00:27ff:fec icmp_seq=2 ttl=64 time=3.95\
    \ ms\n64 bytes from fe80::a00:27ff:fec icmp_seq=3 ttl=64 time=1.53 ms\n```\n\n\
    以下多播接收了来自网络上三个 ipv6 主机的回复。\n\n```bash\n[root@fedora4]# ping6 -I eth0 ff02::1\n\
    ff02::1 (ff02::1) from fe80::a00:27ff:fec:4346 eth0: 56\n64 bytes from fe80::a00:27ff:fec\
    \ icmp_seq=1 ttl=64 time=0.59 ms\n64 bytes from fe80::a00:27ff:fec icmp_seq=2\
    \ ttl=64 time=1.87 ms (DUP!)\n64 bytes from fe80::a00:27ff:fec icmp_seq=3 ttl=64\
    \ time=1.53 ms (DUP!)\n64 bytes from fe80::e87b:9dd:ffec2 icmp_seq=1 ttl=64 time=5.35\
    \ ms (DUP!)\n64 bytes from fe80::a00:27ff:fec:3c:4346 icmp_seq=2 ttl=64 time=0.106\
    \ ms\n64 bytes from fe80::e87b:9dd:ffec2 icmp_seq=2 ttl=64 time=1.79 ms (DUP!)\n\
    64 bytes from fe80::a00:27ff:fec icmp_seq=2 ttl=64 time=2.48 ms (DUP!)\n```\n\n\
    ## 21.12. 比利与 ipv6\n\n关于比利 ipv6 的大量信息可以在 www.ipv6council.be 找到。\n\n像 ipv6.belgium.be、www.bipt.be\
    \ 和 www.bricozone.be 等网站已启用 ipv6。一些大学也是如此：up.ac.be (那穆) 和 ulg.ac.be (列日)。\n\n\
    ## 21.13. 其他网站\n\n测试 ipv6 的其他有用网站有：\n\n```\ntest-ipv6.com\nipv6-test.com\n```\n\
    \n访问 ipv6-test.com 网站将测试你是否有一个有效的 ipv6 地址。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_247_0.png)\n\
    \n访问 test-ipv6.com 网站也将测试你是否有一个有效的 ipv6 地址。\n\n## 测试你的 IPv6 连接性。\n\n你在公网上的 IPv4\
    \ 地址\n\n世界 IPv6 日是 2011 年 6 月 8 日，即 IPv6 协议出版的周年。\n\n恭喜！你似乎同时拥有 ipv4 和 ipv6 互联网连接。如果发布者发布了\
    \ ipv6 版本，你的浏览器将回退到 IPv4。如果你在选择时优选 ipv6 而非 ipv4，这在未来可能会影响猜测你位置网站的准确性。\n\n你似乎正在使用\
    \ IPv6 网关；你的路由器可能正在自动完成。这种方法可能存在局限性。最好从你的 ISP 获取原生 ipv6 地址。\n\n你的 ipv6 服务器（由你的\
    \ ISP 提供）似乎无法访问 ipv6 互联网，或者没有配置使用它。这在未来可能会限制你访问仅限 ipv6 的网站。\n\n- 为了你的 ipv4 稳定性和就绪，当发布者提供\
