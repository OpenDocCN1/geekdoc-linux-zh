    prepend domain-name \"paul.local\";\nprepend domain-search \"paul.local\";\nroot@debian7~#\n\
    ```\n\n## 4. Start the DNS server and check your zone in the error log.\n\n```\n\
    root@debian:~# service bind9 restart\nStopping domain name service..., bind9.\n\
    Starting domain name service..., bind9.\nroot@debian:~# grep paul.local /var/log/syslog\n\
    Oct 09:22:18 debian[2707]: zone paul.local/IN: loaded sera\nOct 1 20141010\nOct\
    \ 6 09:22:18 debian[2707]: zone paul.local/IN: sending not\n20141010\n```\n\n\
    ## 5. Use dns or nslookup (or ping) to test your records.\n\n```\nroot@debian:~#\
    \ ping -c 1 nsl.paul.local\nPING paul.local (10.104.33.30) 56(84) bytes of data.\n\
    64 bytes from 10.104.33.30: icmp_req=1 ttl=64 time=0.006 ms\n--- nsl.paul.local\
    \ ping statistics\n1 packets transmitted, 1 received, 0% packet loss, time 0ms\n\
    rtt min/avg/max/dev = 0.006/0.006/0.006/0.000 ms\nroot@debian:~# ping -c www.paul.local\n\
    ping: unknown host www.paul.local\n```\n\n> Note that the record we was commented\
    \ out, it should not be found.\n\n```\nroot@debian:~# dig debian7.paul.local\n\
    ;; DIG 9.8-rpp2?r1005.12-P1 << debian7.paul.local\n;; options: +cmd\n;; Got answer:\n\
    ;; >>HEADER-- opcode: QUERY, status: NOERROR, id: 50491\n;; flags: qr aa rd ra;\
    \ QUERY: 1, ANSWER: 1, AUTHORITY: 3, ADDITIONAL: 2\n\n;; QUESTION SECTION:\n;debian7.paul.local\
    \ IN A\n\n;; ANSWER SECTION:\ndebian7.paul.local. 86400 IN A 10.104.33.30\n\n\
    ;; AUTHORITY SECTION:\npaul.local. 86400 IN NS nsl.paul.local.\npaul.local. 86400\
    \ IN NS debian7.paul.local.\npaul.local. 86400 IN NS debianpaul.paul.local.\n\n\
    ;; ADDITIONAL SECTION:\nnsl.paul.local. 86400 IN A 10.104.33.30\ndebianpaul.paul.local.\
    \ 86400 IN A 10.104.33.30\n\n;; Query time: 4 msec\n;; SERVER: 10.104.33.53(10.104.33.30)\n\
    ;; WHEN: Mon Oct 6 09:35:25 2014\n;; MSG rcvd: 14\nroot@debian:~#\n```\n\n## 6.\
    \ Our primary server appears to be running. Note the information here:\n\n```\n\
    root@debian:~#\nip address : 10.104.33.30\ndomain name : paul.local\n```\n\n##\
    \ 4.15. example: a DNS server\n\n- 1. A slave server transfers information over\
    \ the network from a master server (a slave can also be a master). A primary server\
    \ maintains records in its local file system. As an exercise, to verify the work\
    \ of all students, set up a slave server of the master.\n- 2. Before configuring\
    \ the server, you may have to allow transfers to this server. Remember that this\
    \ is not secure since transfers are in clear text and limited to an address. This\
    \ example follows our demo from above. Imagine a student named Jesse having completed\
    \ the setup as shown before, with the domain paul.local and the ip address 10.104.33.20.\
    \ The goal is to have a slave server of paul.local on my computer.\n\n```\nroot@debian:/etc/bind#\
    \ cat named.conf\n// Do any local\n// Consider adding zones here, if they are\
    \ not used in your organization\nzone \"paul.local\" IN (\n    type master;\n\
    \    file \"/etc/bind/db.local\";\n    allow-update { none };\n    allow-transfer\
    \ { 10.104.15.20 };\n);\n```\n\n## introduction to DNS\n\n- 3. With the configuration\
    \ below I can make my server a slave for the jesse.local zone.\n\n```\nroot@debian:/etc/bind#\
    \ tail named.conf\nzone jesse.local: IN {\n  type slave;\n  file \"/var/cache/named/db.local\"\
    ;\n  masters { 10.104.15.20 };\n};\n```\n\n```\nroot@debian:/etc/bind# mkdir /var/cache/named\n\
    root@debian:/etc/bind# chown bind /var/cache/named\nroot@debian:/etc/bind# ls\
    \ -ld /var/cache/named/\ndrwxr-xr-x 2 bind 4096 1 20:01 /var/cache/named/\n```\n\
    \nNote that we put the slave zones in /var/cache/named and not in /etc/bind.\n\
    \n- 4. Restarting on the slave server should transfer the database file. Verify\
    \ this in /var/syslog. The time and date are truncated from the screenshot, and\
    \ Jesse did not use the current date in the name.\n\n```\nroot@debian:/etc/bind#\
    \ grep jesse /var/syslog\nnamed[2731]: transfer of jesse.local/IN: Transfer started.\n\
    named[2731]: transfer of 'jesse.local/IN' from 10.104.15.20: connected to 10.104.33\n\
    named[2731]: transfer of 'jesse.local/IN': transferred serial 20110516\nnamed[2731]:\
    \ transfer of 'jesse.local/IN' from 10.104.15.20: Transfer completed: 1 messages,\
    \ 8 records, 239 bytes, 0.001 sec (239000 bytes/sec)\n```\n\nAnd the contents\
    \ of the slave zone:\n\n```\nroot@debian:/etc/bind# cat /var/cache/named/db.local\n\
    $ORIGIN\nTTL 604800      ; 1 week\nIN SOA ns.jesse.local. root-jesse.local. jesse.local.\
    \ (\njesse.local             20110516      serial\n                          \
    \     300 refresh (5 minutes)\n                               600 retry (3 minutes\
    \ 20 seconds)\n                               2419200 expire (4 weeks)\n     \
    \                          604800 minimum (1 week)\n                         \
    \      )\n\n                               NS       ns.jesse.local.\n\n$ORIGIN\
    \ jesse.local.\nanya            A       10.104.15.1\nmac             A       10.104.15.30\n\
    s               A       10.104.15.20\nbubu010srv      A       10.104.15.20\nww\
    \             A       10.104.15.25\n```\n\n## 4.16. practice: dns\n\n- 1. Install\
    \ bind9 and verify with a sniffer how it works.\n- 2. Add a forwarder and verify\
    \ that it works.\n- 3. Create a primary forward lookup zone named you.local with\
    \ at least two NS records and four A records.\n- 4. Use dig and nslookup to verify\
    \ your NS and A records.\n- 5. Create a slave of your primary zone (on another\
    \ server) and verify the zone transfer.\n- 6. Set up two primary zones on two\
    \ servers and implement a conditional forwarder (you can use the two servers from\
    \ before).\n\n## 4.17. solution: dns\n\n- 1. Install bind9 and verify with a sniffer\
    \ how it works. You should see queries to the root name servers with tcpdump or\
    \ wireshark.\n- 2. Add a forwarder and verify that it works. The forwarder can\
    \ be added in named.conf.options as seen in the theory.\n- 3. Create a primary\
    \ forward lookup zone named yourname.local with at least two NS records and four\
    \ A records. This is literally explained in the theory.\n- 4. Use dig and nslookup\
    \ to verify your NS and A records. This is literally explained in the theory.\n\
    - 5. Create a slave of your primary zone (on another server) and verify the zone\
    \ transfer. This is literally explained in the theory.\n- 6. Set up two primary\
    \ zones on two servers and implement a conditional forwarder (you can use the\
    \ two servers from before). A conditional forwarder is set in named.conf.local\
    \ as a zone. (see the theory on forwarder).\n"
  mdcn: "\n\n## 4.14.1. 使用你的 DNS 服务器\n\n如果你确信你的 dns 服务器工作正常，那么请将其设置为 `/etc/resolv.conf`\
    \ 中的默认且唯一的 DNS 服务器。\n\n```\nroot@debian7:~# cat /etc/resolv.conf\nnameserver 10.104.33.30\n\
    root@debian7:~#\n```\n\n如果你也使用了 dhcpclient，则需要将你的 dns 服务器添加到 `/etc/dhcp/dhcpclient.conf`\
    \ 中。\n\n```\nroot@debian7:~# diff /etc/dhcp/dhcpclient.conf /etc/dhcp/dhcpclient.conf.original\n\
    21c21\n< prepend domain-name-servers 10.104.33.30;\n> #prepend domain-name-servers\
    \ 127.0.0.1;\n23,24c23\n< domain-name, domain-name-servers, domain-search, host-name,\n\
    <-\\omain-name, domain-name-servers, host-name,\n---\n> domain-name, domain-name-servers,\
    \ domain-search, host-name,\nroot@debian7:~#\n```\n\n上面的截图显示 10.104.33.30 现在是一个默认选项，dhcp\
    \ 不再应向 dhcp 服务器请求该选项。\n\n调整 `/etc/hosts` 以反映你的域名，并使用 `hostname` 和 `dnsdomainname`\
    \ 进行验证。\n\n```\nroot@debian7:~# grep debian7 /etc/hosts\n127.0.0.1 debian7.paul.local\
    \ debian7\nroot@debian7:~# hostname\ndebian\nroot@debian7:~# hostname --fqdn\n\
    debian.paul.local\nroot@debian7:~# dnsdomainname\npaul.local\n```\n\n## 4.14.2.\
    \ 使用自己的域名\n\n考虑以下截图：\n\n```\nroot@debian7b:~# cat /etc/resolv.conf\nnameserver\
    \ 10.104.33.30\nroot@debian7b:~# ping -cl www\nping: unknown host www\nroot@debian7b:~#\
    \ vi /etc/resolv.conf\nroot@debian7b:~# cat /etc/resolv.conf\nnameserver 10.104.33.30\n\
    domain paul.local\nroot@debian7b:~# ping -cl www\nPING www.paul.local (10.104.33.31)\
    \ 56(84) bytes of data.\n64 bytes from 10.104.33.31: icmp_req=1 ttl=64 time=0.021\
    \ ms\n\n--- www.paul.local ping statistics ---\n1 packets transmitted, 1 received,\
    \ 0% packet loss, time 0ms\nrtt/avg/max/mdev = 0.021/0.021/0.021/0.000 ms\nroot@debian7b:~#\n\
    ```\n\n在 `/etc/resolv.conf` 中添加 `domain paul.local` 指令，这样在使用主机名时就可以可以省略域名。\n\n\
    你可以通过调整 `dhclient.conf` 自动实现这一功能。\n\n```\nroot@debian7~# grep paul.local /etc/dhcp/dhclient.conf\n\
    prepend domain-name \"paul.local\";\nprepend domain-search \"paul.local\";\nroot@debian7:~#\n\
    ```\n\n## 4. 启动 DNS 服务器并在错误日志中检查你的区域。\n\n```\nroot@debian:~# service bind9 restart\n\
    Stopping domain name service..., bind9.\nStarting domain name service..., bind9.\n\
    root@debian:~# grep paul.local /var/log/syslog\nOct 09:22:18 debian[2707]: zone\
    \ paul.local/IN: loaded sera\nOct 6 09:22:18 debian[2707]: zone paul.local/IN:\
    \ sending not\n2014010\n```\n\n## 5. 使用 `dig` 或 `nslookup` 测试你的记录。\n\n```\nroot@debian:~#\
    \ ping -c 1 nsl.paul.local\nPING paul.local (10.104.33.30) 56(84) bytes of data.\n\
    64 bytes from 10.104.33.30: icmp_req=1 ttl=64 time=0.006 ms\n\n--- nsl.paul.local\
    \ ping statistics ---\n1 packets transmitted, 1 received, 0% packet loss, time\
    \ 0ms\nrtt/avg/max/mdev = 0.006/0.006/0.006/0.000 ms\nroot@debian:~# ping -c 1\
    \ www.paul.local\nping: unknown host www.paul.local\n```\n\n> 注意被注释掉的记录不应该被找到。\n\
    \n```\nroot@debian:~# dig debian7.paul.local\n;; options: +cmd-answer\n;; Got\
    \ answer:\n;; HEADER; opcode: QUERY, status: NOERROR, id: 50491\n;; flags: qr\
    \ aa ra; QUERY: 1, ANSWER: 1, ADDITIONAL: 2\n\n;; QUESTION SECTION:\ndebian7.paul.local\
    \ IN A\n\n;; ANSWER SECTION:\ndebian7.paul.local. 86400 IN A 10.104.33.30\n\n\
    ;; AUTHORITY SECTION:\npaul.local. 86400 IN NS nsl.paul.local.\npaul.local. 86400\
    \ IN NS debian7.paul.local.\n\n;; ADDITIONAL SECTION:\nnsl.paul.local. 86400 IN\
    \ A 104.104.33.30\ndebian7.paul.local. 86400 IN A 104.104.33.30\n\n;; Query time:\
    \ 4 msec\n;; SERVER: 104.104.33.30\n;; WHEN: Mon Oct 6 09:35:25 2014\n;; MSG rcvd:\
    \ 14\nroot@debian:~#\n```\n\n## 6. 我们的主服务器似乎正在运行。注意这里的信息：\n\n```\nroot@debian:~#\n\
    ip address : 104.104.33.30\ndomain name : paul.local\n```\n\n## 4.15 示例：DNS 服务器\n\
    \n- 1. 从服务器通过网络从主服务器传输信息（从服务器也可以是主服务器）。主服务器在本地文件系统中维护记录。作为练习，为了验证所有学生的工作，请设置一个从服务器。\n\
    - 2. 在配置服务器之前，你可能需要允许传输到此服务器。记住这不是安全的，因为传输是明文的并且限制了地址。此示例遵循我们上面的演示。假设一个名为 Jesse\
    \ 的学生已完成设置，域名为 `paul.local`，IP 地址为 `104.104.33.20`。目标是在我的计算机上有一个 `paul.local`\
    \ 的从服务器。\n\n```\nroot@debian:/etc/bind# cat named.conf\n// Do any local\n// 如果组织内未使用区域，请考虑在此处添加\n\
    zone \"paul.local\" IN (\n    type master;\n    file \"/etc/bind/db.local\";\n\
    \    allow-update { none };\n    allow-transfer { 104.104.15.20 };\n);\n```\n\n\
    DNS 简介\n\n- 3. 通过以下配置，我可以让我的服务器成为 `jesse.local` 区域的从服务器。\n\n```\nroot@debian:/etc/bind#\
    \ tail named.conf\nzone jesse.local: IN {\n  type slave;\n  file \"/var/cache/named/db.local\"\
    ;\n  masters { 104.104.15.20 };\n};\n```\n\n```\nroot@debian:/etc/bind# mkdir\
    \ /var/cache/named\nroot@debian:/etc/bind# chown bind /var/cache/named\nroot@debian:/etc/bind#\
    \ ls -ld /var/cache/named/\ndrwxr-xr-x 2 bind 4096 1 20:01 /var/cache/named/\n\
    ```\n\n注意，我们将从区域放在 `/var/cache/named` 而不是 `/etc/bind`。\n\n- 4. 在从服务器上重启应该传输数据库文件。在\
    \ `/var/syslog` 中验证这一点。时间和日期已从截中截断，且 Jesse 没有在名称中使用当前日期。\n\n```\nroot@debian:/etc/bind#\
    \ grep jesse /var/syslog\nnamed[2731]: transfer of jesse.local/IN: Transfer started.\n\
    named[2731]: transfer of 'jesse.local/IN' from 104.104.15.20: connected to 104.104.33.30\n\
    named[2731]: transfer of 'jesse.local/IN': transferred serial 20110516\n```\n\n\
    从区域的内容：\n\n```\nroot@debian:/etc/bind# cat /var/cache/named/db.local\n$ORIGIN\n\
    TTL 604800\n@paul.local. IN SOA ns.paul.local. admin.paul.local. (\n         \
    \   20140101 1 ; 300 600 2419200 604800 )\n;\n@paul.local. IN NS ns.paul.local.\n\
    @paul.local. IN NS debian7.paul.local.\nns.paul.local. IN A 104.104.33.30\ndebian7.paul.local.\
    \ IN A 104.104.33.30\n```\n\n## 4.16 练习：dns\n\n- 1. 安装 bind9并使用嗅探器检查其工作原理。\n-\
    \ 2. 添加转发器并验证其工作正常。\n- 3. 创建一个名为 `you.local` 的主查找区域，至少包含两个 NS 记录和四个 A 记录。\n- 4.\
    \ 使用 `dig` 或 `nslookup` 验证你的 NS 和 A 记录。\n- 5. 在另一个服务器上创建主区域的从服务器并验证区域传输。\n- 6.\
    \ 在两个服务器上设置两个主区域并实现条件转发。\n\n## 4.17 解决方案：dns\n\n- 1. 安装 bind9并使用嗅探器检查其工作原理。你应该通过\
    \ `tcpdump` 或 `wireshark` 查看向根域名服务器的查询。\n- 2. 添加转发器并验证其工作正常。转发器可以添加到 `named.conf.options`\
    \ 中，如理论所示。\n- 3. 创建一个名为 `yourname.local` 的主查找区域，至少包含两个 NS 记录和四个 A 记录。这在理论中有详细解释。\n\
    - 4. 使用 `dig` 或 `nslookup` 验证你的 NS 和 A 记录。这在理论中有详细解释。\n- 5. 在另一个服务器上创建主区域的从服务器并验证区域传输。这在理论中有详细解释。\n\
    - 6. 在两个服务器上设置两个主区域并实现条件转发（你可以使用之前的两个服务器）。\n\n"
