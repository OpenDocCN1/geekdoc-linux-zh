  mdcn: "\n\n## 4.3.2. 带有转发器的仅缓存服务器\n\n带有**转发器**的**仅缓存服务器**是一种 DNS 服务器，它所有的信息都将从**转发器**处获取。该**转发器**必须是一个**dns\
    \ 服务器**，例如来自**互联网服务提供商**的**dns 服务器**。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_77_0.png)\n\
    \n这张图片显示了公司局域网上的**dns 服务器**，它将其**isp**的**dns 服务器**设置为转发器。**如果 dns 服务器的 ip 地址是\
    \ 212.71.8.10，那么在公司**dns 服务器**的**named.conf**文件中将发生以下情况：**\n\n```\nforwarders\
    \ {\n  212.71.8.10;\n}\n```\n\n你也可以配置你的**dns 服务器**使其与**条件转发器**协同工作。条件转发器的定义如下。\n\
    \n```\nzone \"someotherdomain.local\" {\n  type forwarder;\n  forward only;\n\
    \  forwarders { 10.104.42.1; };\n}\n```\n\n## 4.3.3. 迭代或递归查询\n\n**递归查询**是一种 DNS\
    \ 查询，发起查询的客户端期望得到一个完整的答案（如上述从 Macbook 到 DNS 服务器的粗红色箭头所示）。**迭代查询**是一种 DNS 查询，客户端并不期望得到完整的答案（图中从\
    \ DNS 服务器发出的三个黑色箭头）。迭代查询通常发生在名称服务器之间。根名称服务器不响应递归查询。\n\n## 4.4. 权威 DNS 服务器\n\n\
    控制某个区域（zone）的 DNS 服务器被称为该区域的**权威 DNS 服务器**。请记住，一个**区域**是**资源记录**的集合。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_78_0.png)\n\
    \n## 4.5. 主与从\n\n当你为一个区域设置第一台**权威 dns 服务器**时，它被称为**主 dns 服务器**。该服务器将拥有一份**区域数据库**的可读可写副本。出于容错、性能或负载均衡的考虑，你可能决定设置另一台对该区域具有权威性的**dns\
    \ 服务器**。这就是一台**从 dns 服务器**。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_78_1.png)\n\
    \n## 4.6. 区域传输\n\n从服务器通过**区域传输**从主服务器接收区域数据库的副本。区域传输由从服务器定期请求。这些时间间隔定义在 **soa\
    \ 记录**中。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_78_2.png)\n\n你可以使用 **rndc**\
    \ 强制刷新区域。下面的示例强制执行了 **fred.local 区域**的传输，并显示了来自 `/var/log/syslog` 的日志。\n\n```\n\
    root@debian7:~/etc/bind# rndc refresh fred.local\n```\n\n```\nroot@debian7:/etc/bind#\
    \ grep fred /var/log/syslog | tail -7 | cut -c38-\nzone fred.local/IN: sending\
    \ notifications (serial 1)\nreceived control channel command 'refresh fred.local'\n\
    zone fred.local/IN: Transfer started.\ntransfer of 'fred.local/IN' from 10.104.109#53:\
    \ connected using 10.104.33.5737\nzone fred.local/IN: transferred 2\ntransfer\
    \ of 'fred.local/IN' from 10.104.109#53: completed: 10 records,\nzone fred.local/IN:\
    \ sending notifications (serial 2)\nroot@debian7:/etc/bind#\n```\n\n## 4.7. 主从\n\
    \n向区域添加从级 dns 服务器时，你会将此服务器配置为主服务器的从服务器。主服务器随后成为从服务器的主服务器。通常主服务器是所有从服务器的主服务器。有时从服务器是另一个从服务器的主服务器。图中\
    \ ns1 是主服务器，ns2 和 ns4 是从服务器，而 ns2 和 ns3 是 ns1 的主服务器，ns4 是 ns2 的主服务器。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_80.png)\n\
    \n## 4.8. Soa 记录\n\nSoa 记录包含一个刷新（refresh）值。如果设置为 30 分钟，从服务器将每 30 分钟请求一次区域副本。还有一个重试（retry）值，当主服务器未响应时使用的重试值。以下是使用\
    \ nslookup 查询 (linux-training.be) so 记录的示例。\n\n```\nroot@debian6:~ nslookup\n\
    > type=SOA\nServer: ns1.linux-training.be\nAddress: 195.47.215.14\norigin: linux-training.be\n\
    serial: 2321013\nrefresh: 14400\nretry: 3600\nexpire: 604800\nminimum: 3600\n\
    ```\n\n只有当区域数据库更新（意味着添加或删除了一个或多个资源记录）时发生区域传输。从服务器与其主服务器的 SOA 记录进行序列号比较。如果两个序列号相同，则不需要更新。如果从服务器的序列号小于主服务器，则请求区域传输。下面是在\
    \ wireshark 中捕获的区域传输。\n\n| Time | Source | Destination | Protocol | Info |\n|---|---|---|---|---|\n\
    | 1 | 000000 | 192.168.1.37 | 192.168.1.35 | DNS | Standard query Seq=0 Win=5040\
    \ Len=0 |\n| 2 | 006805 | 192.168.1.35 | 192.168.1.37 | DNS | Standard query response\
    \ Seq=0 ns.copy.paul |\n| 3 | 0314067 | 192.168.1.37 | 192.168.1.35 | TCP | 33713\
    \ > [ACK] [SYN] Win=5850 Len=0 MS=5 |\n| 4 | 0315037 | 192.168.1.37 | 192.168.1.35\
    \ | TCP | 33713 > [ACK] [SYN] Win=5151 Win=1 MS=5 |\n| 5 | 0501907 | 192.168.1.35\
    \ | 192.168.1.37 | TCP | 33713 > domain [ACK] Seq=1 Win=5056 |\n| 6 | 0619554\
    \ | 192.168.1.37 | 192.168.1.35 | TCP | [TCP segment] = segment of reassembled\
    \ PDU |\n| 7 | 0718359 | 192.168.1.35 | 192.168.1.37 | TCP | 33713 > domain [ACK]\
    \ Seq=1 Win=5792 Len |\n| 8 | 0801111 | 192.168.1.37 | 192.168.1.35 | TCP | 33713\
    \ > cobbb.paul, ack=31 |\n| 9 | 0918283 | 192.168.1.35 | 192.168.1.37 | DNS |\
    \ 33713 > domain [ACK] Seq=1 Win=5792 Len |\n| 10 | 0919784 | 192.168.1.35 | 192.168.1.37\
    \ | DNS | Standard query response Seq=0 ns.cobbb.paul |\n| 11 | 1102923 | 192.168.1.37\
    \ | 192.168.1.35 | TCP | 33713 > [ACK] Seq=1 Win=5027 Ack= |\n| 12 | 12026018\
    \ | 192.168.1.37 | 192.168.1.35 | TCP | 33713 > [ACK] Seq=77 Win=295 |\n| 13 |\
    \ 13021011 | 192.168.1.35 | 192.168.1.37 | TCP | 33713 > domain Ack=25 |\n\n##\
    \ 4.9. 增量区域传输\n\n当发生区域传输时，可以是全量传输也可以是增量传输。这取决于传输的大小。当更改的总大小小于区域的大小时，优先选择增量传输。全量传输使用\
    \ axfr 协议，增量传输使用 ixfr 协议。\n\n## 4.10. DNS 缓存\n\nDNS 是一种缓存协议。当客户端查询本地 DNS 服务器时，如果本地服务器不是该查询的权威，它将在\
    \ DNS 树中查找权威服务器。本地服务器首先查询根服务器，然后是顶级服务器，最后是域名服务器。当本地服务器解析查询时，它会将这些信息传递给提交查询的客户端，并并在缓存中保留这些查询的副本。因此，当（另一个）客户端向此服务器提交相同的查询时，它将从缓存中检索这些信息。\n\
    \n"
