    64 bytes from fe80::a00:27ff:fec: icmp_seq=3 ttl=64 time=1.53 ms (DUP!)

    64 bytes from fe80::e87b:9dd:fed6:ffec2: icmp_seq=1 ttl=64 time=535 ms (DUP!)

    64 bytes from fe80::a00:27ff:fe3c:4346: icmp_seq=2 ttl=64 time=0.106 ms

    64 bytes from fe80::e87b:9dd:fed6:ffec2: icmp_seq=2 ttl=64 time=1.79 ms (DUP!)

    64 bytes from fe80::a00:27ff:fec: icmp_seq=2 ttl=64 time=2.48 ms (DUP!)

    ```'
