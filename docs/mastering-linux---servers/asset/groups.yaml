  md: "\n## 1.5.8. firewall rules\n\nIf we attempt to access the site from another\
    \ machine however, we will not be able to view the website yet. The firewall is\
    \ blocking incoming connections. We need to open these incoming ports first\n\n\
    ```bash\n[root@CentOS65 ~]# iptables -I INPUT -p tcp --dport 80 -j ACCEPT\n[root@CentOS65\
    \ ~]# iptables -I INPUT -p tcp --dport 7000 -j ACCEPT\n[root@CentOS65 ~]# iptables\
    \ -I INPUT -p tcp --dport 8000 -j ACCEPT\n[root@CentOS65 ~]# iptables -I INPUT\
    \ -p tcp --dport 9000 -j ACCEPT\n```\n\nAnd if we want these rules to remain active\
    \ after a reboot, we need to save them\n\n```bash\n[root@CentOS65 ~]# service\
    \ iptables save\niptables: Saving firewall rules to /etc/sysconfig/iptables:[\
    \ OK ]\n```\n\n## 1.6. named hosts on CentOS\n\n### 1.6.1. named virtual hosts\n\
    \nThe chess club and the model train club find the ports too hard to remember.\
    \ They prefer to have their website accessible by name.\n\nWe continue work on\
    \ the same server that has three websites on three ports. We need to make sure\
    \ those websites are accessible using the names choochoo.local, chessclub42.local\
    \ and hunter2.local.\n\nFirst, we need to enable virtual hosts in the configuration\n\
    \n```bash\n[root@CentOS65 ~#] vi /etc/httpd/conf/httpd.conf\n[root@CentOS65 ~#]\
    \ grep ^VirtualHost /etc/httpd/conf/httpd.conf\nNameVirtualHost *:80\n[root@CentOS65\
    \ ~#]#\n```\n\nNext we need to create three virtualhosts.\n\n```bash\n[root@CentOS65\
    \ ~#] vi /etc/httpd/conf/choochoo.local\n[root@CentOS65 ~#] cat /etc/httpd/conf/chessclub42.local\n\
    [root@CentOS65 ~#] vi /etc/httpd/conf/hunter2.local\n[root@CentOS65 ~#] cat /etc/httpd/conf/choochoo.local\n\
    <VirtualHost *:80>\nServerAdmin webmaster@localhost\nServerName choochoo.local\n\
    DocumentRoot /var/www/html/choochoo\n</VirtualHost>\n[root@CentOS65 ~#] cat /etc/httpd/conf/chessclub42.local\n\
    <VirtualHost *:80>\nServerAdmin webmaster@localhost\nServerName chessclub42.local\n\
    DocumentRoot /var/www/html/chessclub42\n</VirtualHost>\n[root@CentOS65 ~#] cat\
    \ /etc/httpd/conf/hunter2.local\n<VirtualHost *:80>\nServerAdmin webmaster@localhost\n\
    ServerName hunter2.local\nDocumentRoot /var/www/html/hunter2\n</VirtualHost>\n\
    [root@CentOS65 ~#]#\n```\n\nNotice that they all listen on port 80 and have an\
    \ extra ServerName directive.\n\n## 1.6.2. name resolution\n\nWe need some to\
    \ resolve names. This can be done by DNS, which is discussed in another chapter.\
    \ For this demo it is possible to quickly add the three names to the /etc/hosts\
    \ file\n\n```bash\n[root@CentOS65 ~#] grep ^192 /etc/hosts\n192.168.1.225 choochoo.local\n\
    192.168.1.225 chessclub42.local\n192.168.1.225 hunter2.local\n```\n\nNote that\
    \ you may have another address...\n\n## 1.6.3. reload and verify\n\nAfter a service\
    \ httpd reload the websites should be available by name.\n\n```bash\n[root@CentOS65\
    \ ~]# service httpd reload\nReloading httpd:\n[root@CentOS65 ~]# wget http://chessclub42.local/\n\
    Resolving chessclub42.local... 192.168.1.225\nConnecting to chessclub42.local[192.168.1.225]:80...\n\
    HTTP request sent, awaiting response... 200 OK\nLength: 1024 bytes\nSaving to:\
    \ index.html\n[root@CentOS65 ~]# cat index.html\nWelcome to chess club\n```\n\n\
    ## 1.7. password protected website\n\nYou can secure files and directories in\
    \ your website with a .htaccess file that refers to a .htpasswd file. The htpasswd\
    \ command can create a .htpasswd file that contains a userid and (encrypted) password.\n\
    \nThis screenshot creates a user and password for hacker cliff and uses the -c\
    \ flag to create .htpasswd file.\n\n```bash\n[root@CentOS65 ~]# htpasswd -c /var/www/.htpasswd\
    \ cliff\nNew password:\nUpdating password:\nAdding password for user cliff\n[root@CentOS65\
    \ ~]# cat /var/www/.htpasswd\ncliff:$apr\n```\n\nRob also wants your website,\
    \ screenshot shows how to add a second user to .htpasswd.\n\n```bash\n[root@CentOS65\
    \ ~]# htpasswd /var/www/.htpasswd rob\nNew password:\nUpdating password:\nAdding\
    \ password for user rob\n[root@CentOS65 ~]# cat /var/www/.htpasswd\ncliff:$apr\n\
    rob:$apr\n```\n\nBoth Cliff and Rob chose the same password (hunter2), but that\
    \ is not visible in the .htpasswd file because of the different salts. We need\
    \ to create a .htaccess file in the DocumentRoot of the website we want to protect.\
    \ This screenshot shows example\n\n```bash\n[root@CentOS65 ~]# cat /var/www/html/hunter2/.htaccess\n\
    AuthName \"Members only!\"\nAuthName Basic\nAuthType Basic\nrequire valid-user\n\
    ```\n\nNote that we are protecting the website on port 9000 that we created earlier.\
    \ And because we put the website for hacker hunter2 in a subdirectory of the default\
    \ website, we will need to adjust the AllowOverride parameter in /etc/httpd/conf/httpd.conf\
    \ under the <Directory \"/var/www/html\"> directive as the screenshot shows.\n\
    \n```bash\n[root@CentOS65 ~]# vi /etc/httpd/conf/httpd.conf\n\n<Directory \"/var/www/html\"\
    >\n# Possible values for the Options directive are \"None\", \"All\"\n# or any\
    \ combination of:\n# Indexes Includes FollowSymLinks SymLinksIfOwnerMatch ExecCGI\
    \ MultiViews\n\n# Note that \"MultiViews\" must be named \"explicitly\" --- \"\
    Options All\"\n# doesn't give it to you.\n\n# The Options directive is both complicated\
    \ and important.  Please see\n# http://httpd.apache.org/docs/2.2/mod/core.html#options\n\
    # for more information.\n\n    Options Indexes FollowSymLinks\n\n# AllowOverride\
    \ controls what directives may be placed in .htaccess files.\n# It can be \"All\"\
    , \"None\", or any combination of the keywords:\n# Options FileInfo AuthConfig\
    \ Limit\n\n    AllowOverride AuthConfig\n\n# Controls who can get stuff from this\
    \ server.\n\n    Order allow,deny\n    Allow from all\n\n</Directory>\n```\n\n\
    Now restart the apache2 server and test that it works!\n\n## 1.8 troubleshooting\
    \ apache\n\nWhen apache restarts, it will verify the syntax of files in the configuration\
    \ folder /etc/apache2 on debian or /etc/httpd on CentOS and it tell you the name\
    \ of the faulty file, line number and an explanation of the error\n\n```bash\n\
    root@debian:~# service apache2 restart\napache2: Syntax error on line 28 of /etc/apache2.conf:\
    \ Syntax error on line 1 of /etc/apache2/sites-enabled/chessclub42: /etc/apache2/sites-enabled/chessclub42:4:\
    \ <VirtualHost> was not closed. <chessclub42:1: <VirtualHost> was not closed.\n\
    Action: \"configtest\" failed.\nThe Apache error log may have more information.\n\
    failed!\n```\n\nBelow you see the problem... a missing / on line 4.\n\n```bash\n\
    root@debian:~# cat /etc/apache2/sites-available/chessclub42\n<VirtualHost *:80>\n\
    ServerAdmin webmaster@localhost\nDocumentRoot /var/www/html\n</VirtualHost>\n\
    ```\n\nLet us force another error by renaming the directory of one of our websites\n\
    \n```bash\nroot@debian:~# mv /var/www/html/choochoo /var/www/html/choochoo_old\n\
    root@debian:~# service apache2 restart\nRestarting apache2: failed\n```\n\nAs\
    \ you can see, apache will tell you exactly is wrong\n\n## 1.9. virtual hosts\
    \ example\n\nBelow is a sample virtual hosts configuration. This virtual hosts\
    \ overrules the default ErrorDocument\n\n```apache\n<VirtualHost 83.276.245:80>\n\
    ServerName cobbatt.be\nServerAlias www.cbatt.be\nDocumentRoot /home/paul/public_html\n\
    ErrorLog /home/paul/logs/error_log\nCustomLog /home/paul/logs/access_log common\n\
    ScriptAlias /cgi-bin/ /home/paul/cgi-bin/\n<Directory /home/paul/public_html>\n\
    Options IncludesFollowSymLinks\nallow from all\n</Directory>\nErrorDocument 404\
    \ http://www.cbatt.be/cbatt.php\n</VirtualHost>\n```\n\n## 1.10. aliases and redirects\n\
    \nApache supports aliases for directories, like this example\n\n```apache\nAlias\
    \ /paul/ \"/home/paul/public_html/\"\n```\n\nSimilarly, content can be redirected\
    \ to another website or web server\n\n```apache\nRedirect permanent foo http://www.foo.com/bar\n\
    ```\n\n## 1.11. more on .htaccess\n\nYou can do more with .htaccess. One example\
