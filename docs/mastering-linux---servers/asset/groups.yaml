    # 3.2. accessing mysql


    # 3.2.1. Linux users


    The installation of mysql creates a user account in /etc/passwd and a group account
    in /etc/group.


    ```

    kevin@ubul204:~$ tail -1 /etc/passwd

    mysql:x:120:131:MySQL Server,,,,nonexistent:/bin/false

    kevin@ubul204:~$ tail -1 /etc/group

    mysql:x:131:

    ```


    The mysql daemon mysql will run with the credentials of this user and group.


    ```

    root@ubul204~$ ps -eo uid,gid,user,group,comm | grep mysql

    120 mysql 131 mysqld

    ```


    # 3.2.2. mysql client application


    You now use mysql from the commandline by just typing mysql -u root -p you will
    be asked for the password of the (mysql root account). In the screenshot below
    the user exited to exit the mysql console.


    ```

    root@ubul204~$ mysql -u root -p

    Enter password:

    Welcome to the MySQL monitor. Commands end with ; or \g.

    Your MySQL connection is id 43

