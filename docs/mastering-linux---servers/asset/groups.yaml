    [root@centos65 ~]# cat index.html

    Welcome to my website

    ```'
  - '[PAGE 16]


    # 1.1.6. default website


    Changing the default website of a freshly installed apache web server is easy.
    All you need to do is create (or change) an index.html file in the DocumentRoot
    directory.


    To locate the DocumentRoot directory on Debian:


    ```

    root@debian:~# grep DocumentRoot /etc/apache2/sites-available/default

    DocumentRoot /var/www

    ```


    This means that /var/www/index.html is the default web site.


    ```

    root@debian:~# cat /var/www/index.html

    <html><h1>It works!</h1>

    <p>This is the default web page for this server.</p>

    <p>The web server is running but no content has been added, yet.</p>

    </body></html>

    root@debian:~#

    ```


    This screenshot shows how to locate the DocumentRoot directory on RHEL/CentOS.


    ```

    [root@centos65 ~]# grep DocumentRoot /etc/httpd/conf/httpd.conf

    DocumentRoot "/var/www/html"

    ```


    RHEL/CentOS has no default web page (only the noindex.html error page mentioned
    before). But an index.html file created in /var/www/html/ will automatically be
    used as a default page.


    ```

    [root@centos65 ~]# echo ''<html><head><title>Default website</title></head><body><p>A
    new web page</p></body>'' > /var/www/html/index.html

    root@centos65 ~]# cat /var/www/html/index.html

    <html><head><title>Default website</title></head><body><p>A new web page</p></body></html>

    root@centos65 ~]#

    ```'
