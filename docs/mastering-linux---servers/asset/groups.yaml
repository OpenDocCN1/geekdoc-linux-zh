    # Linux 服务器


    Paul Cobbaut


    # Linux 服务器


    Paul Cobbaut


    出版日期 2015-05-24 CEST


    # 摘要


    本书旨在用于讲师引导的培训。对于自学者，意图是让你在一台运行良好的 Linux 电脑旁阅读本书，以便能够立即操作每个主题，练习每条命令。


    本书面向初级 Linux 系统管理员（对于想要进一步了解其 Linux 系统的家庭用户来说，也可能有趣且有用）。然而，本书并非用于介绍文本编辑器、浏览器、邮件客户端、多媒体或办公软件等
    Linux 桌面应用程序。


    获取更多信息和免费的 .pdf 文件请访问：http://linux-training.be。


