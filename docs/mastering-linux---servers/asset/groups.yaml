  mdcn: "\n\n## 5.5.2. 旧版 DNS 负载均衡\n\n与上述不同。当一个区域有多个权威服务器时，你可以将查询分散到所有服务器上。实现此方法的方法是对所有参与外部查询负载均衡的服务器创建\
    \ NS 记录。\n\n你也可以在内部客户端配置不同的名称服务器。\n\n## 5.5.3. 旧版 DNS notify\n\nrfc 1034 和 rfc\
    \ 1035 中 DNS 的原始设计在 SOA 记录中实现了刷新时间（refresh time），用于为从服务器查询主服务器配置时间循环。这会导致大量的无用的拉取请求（pull\
    \ requests），或者在更新之间出现显著延迟。\n\n出于因此，设计了 dns notify (rfc 1996)。每当有更新时，服务器都会通知从服务器。默认情况下，此功能在\
    \ bind 中是启用的。\n\n可以在此更改中禁用 notify：\n\n```\nzone \"1.168.192.in-addr.arpa\" {\n\
    \  type master;\n  notify no;\n  file \"/etc/bind/db.192\";\n}\n```\n\n## 5.5.4.\
    \ 旧版 IXFR 和 AXFR\n\n当你重启 bind 服务器或直接手动更新区域数据库文件时，会启动全区域传输 (AXFR)。使用 nsupdate，你可以更新区域数据库并启动增量区域传输。\n\
    \n你需要 admin 权限才能让 nsupdate 运行。\n\n```\nroot@ubuntu010srv:/etc/bind#$ nsupdate\n\
    > server 127.0.0.1\n> update add mac4.1.linux-training.be 86400 A 192.168.1.627\n\
    > send\nupdate failed: REFUSED\n```\n\n## 5.5.5. 旧版 DNS 与 DHCP 的集成\n\n某些组织喜欢让所有客户端都存在\
    \ DNS 中。这维护起来很繁琐。幸运的是，rfc 2136 描述了 DHCP 服务器与 DNS 服务器的集成。每当 DHCP 确认客户端 IP 配置时，它就可以通知\
    \ DNS 这些客户端的 IP 地址和名称。这被称为动态更新（dynamic-updates）或 DDNS。\n\n## 5.5.6. 旧版 in-addr.arpa\
    \ 中的反向即正向\n\n反向查找实际上是在 in-addr.arpa 域中作为正向查找实现的。该域有 256 个子域（从 0.in-addr.arpa 到\
    \ 255.in-addr.arpa），每个子域又有 256 个子域。这种两次嵌套形成了一个超过四亿（2 的 32 次方）域的结构。\n\n## 5.5.7.\
    \ 旧版 ipv6\n\n带有 rfc 3596 用于 DNS 的 cam6 扩展。网络上的 ipv6 主机有 AAAA 记录，有一个用于反向查找的 ip6.int\
    \ 域（拥有 16 个子域，从 0.ip6.int 到 fip6.int，每个子域又有 16 个子域……并如此重复 16 次）。\n\n## 5.5.8.\
    \ 旧版 DNS 安全：文件损坏\n\n为了减轻区域文件和 bind 配置文件的损坏，请使用 Unix 权限保护它们，并进行定期备份。\n\n## 5.5.9.\
    \ 旧版 DNS 安全：区域传输\n\n将区域传输限制在某些特定的 IP 地址，而不是任何地址。尽管 IP 地址可以被伪造，仍请使用此方法。\n\n## 5.5.10.\
    \ 旧版 DNS 安全：区域传输、IP 伪造\n\n你可以设置 DNSSEC（这并不是容易维护的），并结合 rfc 2845(tsig?) 和 rfc 2930(tkey,\
    \ 但容易受到暴力攻击)，或者你可以禁用所有区域传输并使用带有 ssh 的脚本手动复制它们。\n\n## 5.5.11. 旧版 DNS 安全：查询\n\n\
    仅允许来自本地网络进行递归，仅在需要时允许从外部进行迭代查询。这可以在主服务器和从服务器上配置。\n\n```\nview \"internal\" {\n\
    match-clients { 192.168.42/24 }; };\n...\nrecursion yes;\n}\nview \"external\"\
    \ {\nmatch-clients { any }; };\nrecursion no;\n}\n```\n\n或者只允许来自本地区域的查询。\n\n```\n\
    options {\nallow-query { 192.168.42.0/24; localhost; };\nzone \"cobbaut.paul\"\
    \ {\nallow-query { any }; };\n}\n```\n\n或者只允许来自内部客户端的递归查询。\n\n```\noptions {\n\
    allow-recursion { 192.168.42.0/24; localhost; };\n```\n\n## 5.5.12. 旧版 DNS 安全：chrooted\
    \ bind\n\n大多数 Linux 发行版都允许在 chroot 环境中轻松设置 bind。\n\n## 5.5.13. 旧版 DNS 安全：DNSSEC\n\
    \nDNSSEC 使用公钥/私钥来保护通信，这在 rfc: 4033, 4034 和 4035 中描述。\n\n## 5.5.14. 旧版 DNS 安全：root\n\
    \n不要以 root 身份运行 bind。不要以 root 身份运行任何守护进程。\n\n# 第四部分. dhcp 服务器\n\n# 目录\n\n- 6.\
    \ dhcp 简介 ............................................................................\
    \ 102\n- 6.1. 四次广播 .......................................................................................\
    \ 103\n- 6.2. 图解 dhcp .........................................................................................\
    \ 104\n- 6.3. 安装 dhcp 服务器 ................................................................................\
    \ 105\n- 6.4. RHEL/CentOS 的 dhcp 服务器 ................................................................\
    \ 105\n- 6.5. 客户端保留 ................................................................................\
    \ 106\n- 6.6. 示例配置文件 ................................................................................\
    \ 106\n- 6.7. 旧的示例配置文件 ................................................................\
    \ 107\n- 6.8. 高级 dhcp ................................................................................\
    \ 109\n- 6.9. 练习：dhcp .................................................................................\
    \ 110\n\n# 第 6 章. dhcp 简介\n\n**dhcp** 的替代方案是在每台客户端计算机上手动输入 ip 配置。\n\n## 6.1. 四次广播\n\
    \ndhcp 在第 2 层广播上工作。启动的 dhcp 客户端将在网络上发送一个 dhcp discover。所有（有可用租约）dhcp 服务器都将用 dhcp\
    \ offer 响应。客户端将选择这些 offer 之一并向所选的 offer 发送 dhcp request。dhcp 服务器响应一个 dhcp acknowledgment。\n\
    \n在 wireshark 中它看起来像这样。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_110_0.png)\n\
    \n当此过程完成后，客户端就可以使用其 ipcp-配置直到租约结束。\n\n## 6.2. 图解 dhcp\n\n我们有一个小型网络，包含两个名为 DHCP-SRV1\
    \ 和 DHCP-SRV2 的 dhcp 服务器以及两个客户端（SunWS1 和 Mac42）。所有计算机都通过集线器或交换机连接（图中所示）。所有四台计算机都有连接到集线器的缆（电缆未画）。\n\
    \n![](img/1d499a6177836f6f088a9e2a53e11a14_111_0.png)\n\n- 1. 客户端 SunWS1 在网络上发送一个\
    \ dhcp discover。所有计算机都接收了这个广播。\n- 2. 两个 dhcp 服务器都用 dhcp offer 回答。\n- 3. 客户端选择来自\
    \ DHCP-SR1 的 offer 并发送 dhcp request。\n- 4. DHCP-SR1 用 dhcp acknowledgment 回答。\n\
    \n四次广播（如果你算上五次的话）都在第 2 层。参考 rfc 2131。\n\n## 6.3. 安装 dhcp 服务器\n\n对于 Debian/Mint，安装很容易。\n\
    \n```bash\ndebian5:~ aptitude install dhcp-server\n读取软件包列表... 完成\n构建依赖树...\n读取状态...\
    \ 完成\n读取任务描述... 完成\n将安装新软件包：\ndhcp-server\n```\n\n你得到了一个包含许多示例的配置文件。\n```bash\n\
    debian5:~# ls -l /etc/dhcp3/conf.conf\n-rw-r--r-- 1 root 3551 2011-04-10 21:23\
    \ /etc/dhcp3/conf.conf\n```\n\n## 6.4. RHEL/CentOS 的 dhcp 服务器\n\n使用 yum 安装很简单。\n\
    \n```bash\n[root@rhe7]## yum install dhcp\n加载插件: product-id, subscription-manager\n\
    解析依赖\n--> 运行事务检查\n--> 软件包 dhcp.x86_64 12:4.2.5-36.e17 将被安装\n--> 完成依赖解析\n```\n\n\
    解析依赖\n\n| 软件包 | 体系 | 版本 | 仓库 | 大小 |\n|---|---|---|---|---|\n| 安装 dhcp | x86_64\
    \ | 12:4.2.5-36.e17 | rhel-7-server-rpms | 510 k |\n\n事务摘要\n1 个软件包\n总大小: 510 k\n\
    已安装: 1.4 M\n是否确定 [y/N]: y\n下载包:\ndhcp-4.25-36.e17.x86_64.rpm | 510 KB 00:01\n\
    运行事务检查\n运行事务测试\n事务测试成功\n运行事务\n安装: 12:dhcp-4.2.5-36.e17.x86_64 | 1/1\n验证: 12:dhcp-4.2.5-36.e17.x86_64\
    \ | 1/1 |\n\n已安装：\n完成！\n```\n安装后我们得到一个 /etc/dhcp/dhcp.conf，它指向一个名为 dhcpd.sample\
    \ 的示例文件。\n\n"
