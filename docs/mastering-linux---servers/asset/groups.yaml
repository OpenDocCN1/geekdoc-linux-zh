    fdn'' message when restarting apache.


    ```

    [root@centos65 ~]# echo ServerName localhost >> /etc/httpd/conf/httpd.conf

    [root@centos65 ~]# service httpd restart

    Restarting web server: httpd ...

    ```


    ### 1.1.5. running apache on Debian


    This is how you start apache2 on Debian.


    ```

    root@debian7:~# service apache2 status

    Apache2 is NOT running.

    root@debian7:~# service apache2 start

    Starting web server: apache2:Could not reliably determine the server''s \

    fully qualified domain name, using 127.0.0.1 for ServerName

    ```


    To verify, run the apache2 status command or use ps.


    ```

    root@debian7:~# service apache2 status

    Apache2 is running (pid 3680)

    root@debian7:~# ps -C apache2

    PID TIME CMD

    3680 ? 00:00:00 apache2

    3683 ? 00:00:00 apache2

    3684 ? 00:00:00 apache2

    3685 ? 00:00:00 apache2

    root@debian7:~#

    ```


    Or use wget and file to verify that your web server serves an html document.


    ```

    root@debian7:~# wget 127.0.0.1

    --2014-05-06 13:27:02-- http://127.0.0.1/

    --Connecting to 127.0.0.1:80... connected.

    HTTP request sent, waiting response... 200 OK

    Length: 177 [text/html]

    Saving to: ''index.html''

    ```


    ```

    100[=================================================>] 177 --K/s in 0s

    2014-05-06 13:27:02 ''index.html'' saved [177/177]

    root@debian7:~# file index.html

    index.html: HTML document, ASCII text

    root@debian7:~#

    ```


    Or verify that apache is running by opening a web browser, and browse to the ip-address
    of your server. An Apache test page should be shown.


    You can do the following to quickly avoid the ''could not reliably determine the
    fdn'' message when restarting apache.


    ```

    root@debian7:~# echo ServerName Debian7 >> /etc/apache2/apache2.conf

    root@debian7:~# service apache2 restart

    Restarting web server: apache2 ...

    ```


    ### 1.1.6. default website


    Changing the default website of a freshly installed apache server is easy. All
    you need to do is create (or change) an index.html file in the DocumentRoot.


    To locate the DocumentRoot on Debian:


    ```

    root@debian:~# grep DocumentRoot /etc/apache2/sites-available/default

    DocumentRoot /var/www

    ```


    This means that /var/www/index.html is the default site.


    ```

    root@debian:~# cat /var/www/index.html

    <html><h1>It works!</h1>

    <p>This is the default web page for this server.</p>

    <p>The web server is running but no content has been added, yet.</p>

    </body></html>

    root@debian:~#

    ```


    To locate the DocumentRoot on RHEL/CentOS:


    ```

    [root@centos65 ~]# grep DocumentRoot /etc/httpd/conf/httpd.conf

    DocumentRoot "/var/www/html"

    ```


    RHEL/CentOS has no default web page (only the noindex.html error page mentioned
    before). But an index.html file created in /var/www/html/ will automatically be
    used as a default page.

