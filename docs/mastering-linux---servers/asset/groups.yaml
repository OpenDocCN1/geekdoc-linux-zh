    \ clean)\n```\n\n# 20.3.5. changing a committed file\n\nThe screenshots show below\
    \ several steps. First we change a file:\n\n```\npaul@debian64 ~]# git status\n\
    # On branch master\nnothing to commit (working directory clean)\npaul@debian64\
    \ ~]# vi question.sh\n```\n\nThen we verify the status and see that it is modified:\n\
    \n```\npaul@debian64 ~]# git status\n# On branch master\n# Changes not staged\
    \ for commit:\n# (use \"git add <file>\" to update what will be committed)\n#\
