  - "[PAGE 237]\n\n# 20.4. git branches\n\nWorking on the project can be done in one\
    \ or more git branches. Here we create a new branch that will make changes to\
    \ the script. Here we merge this branch with the master branch when we are sure\
    \ the script works. (It can be useful to add git status commands when practicing).\n\
    \n```\n$ paul@debian6~/project42$ git branch\n* master\n$ paul@debian6~/project42$\
    \ git checkout -b newcomer\nSwitched to a new branch 'newcomer'\n$ paul@debian6~/project42$\
    \ vi questionext.sh\n$ paul@debian6~/project42$ git add questionext.sh\n$ paul@debian6~/project42$\
    \ source questionext.sh\nThe answer is 42.\n```\n\nIt seems to work, so we commit\
    \ in this branch.\n\n```\n$ paul@debian6~/project42$ git commit -m \"adding a\
    \ new company header\"\n[newcomer 730a2bb] adding a new company header\n1 file\
    \ changed, 4 insertions(+)\n$ paul@debian6~/project42$ git branch\n* newcomer\n\
    $ paul@debian6~/project42$ cat questionext.sh\n!/bin/bash\n```\n\n> # copyright\
    \ linux-training.be\n\necho The answer is 42.\n\nLet us go back to the master\
    \ branch and see what happened there.\n\n```\n$ paul@debian6~/project42$ git checkout\
    \ master\nSwitched to branch 'master'\n$ paul@debian6~/project42$ cat questionext.sh\n\
    !/bin/bash\necho The answer is 42.\n```\n\nNothing happened in the master branch,\
    \ because we worked in another branch.\n\nWhen we are sure the branch is ready\
    \ for production, then we merge it into the master branch.\n\n```\n$ paul@debian6~/project42$\
    \ cat questionext.sh\n!/bin/bash\necho The answer is 42.\n$ paul@debian6~/project42$\
    \ git merge newcomer\nUpdating 99b2cb..730a2bb\nFast-forward\n questionext.sh\
    \ | 4 +++++\n questionext.sh | 4 ++\n1 file changed, 4 insertions(+)\n$ paul@debian6~/project42$\
    \ cat questionext.sh\n!/bin/bash\n```\n\n> # copyright linux-training.be\n\necho\
    \ The answer is 42.\n\nThe newcomer branch can now be deleted."
