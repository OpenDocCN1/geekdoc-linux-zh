  - '[PAGE 89]


    # 4.14.1. using your DNS server


    If you are confident that your dns server works, then set it as default and only
    dns server in /etc/resolv.conf.


    ```

    root@debian7:~# cat /etc/resolv.conf

    nameserver 10.104.33.30

    root@debian7:~#

    ```


    If you also use dhcpclient, you will need to add your dns server to /etc/dhcp/dhcpclient.conf.


    ```

    root@debian7:~# diff /etc/dhcp/dhcpclient.conf /etc/dhcp/dhcpclient.conf.original

    21c21

    < prepend domain-name-servers 10.104.33.30;

    > #prepend domain-name-servers 127.0.0.1;

    23,24c23

    < domain-name, domain-name-servers, domain-search, host-name,

    <-\omain-name, domain-name-servers, host-name,

    ---

    > domain-name, domain-name-servers, domain-search, host-name,

    root@debian7:~#

    ```


    The above screenshot shows that 10.104.33.30 is now a default option that the
    dhcp client should no longer request from the dhcp server.


    Adjust /etc/hosts to reflect your domain name and verify with hostname and dnsdomainname.


    ```

    root@debian7:~# grep debian7 /etc/hosts

    127.0.0.1 debian7.paul.local debian7

    root@debian7:~# hostname

    debian

    root@debian7:~# hostname --fqdn

    debian.paul.local

    root@debian7:~# dnsdomainname

    paul.local

    ```'
  - '[PAGE 90]


    # 4.14.2. using your own domain


    Consider the following screenshot:


    ```

    root@debian7b:~# cat /etc/resolv.conf

    nameserver 10.104.33.30

    root@debian7b:~# ping -cl www

    ping: unknown host www

    root@debian7b:~# vi /etc/resolv.conf

    root@debian7b:~# cat /etc/resolv.conf

    nameserver 10.104.33.30

    domain paul.local

    root@debian7b:~# ping -cl www

    PING www.paul.local (10.104.33.31) 56(84) bytes of data.

    64 bytes from 10.104.33.31: icmp_req=1 ttl=64 time=0.021 ms


    --- www.paul.local ping statistics ---

    1 packets transmitted, 1 received, 0% packet loss, time 0ms

    ttt/avg/max/mdev = 0.021/0.021/0.021/0.000 ms

    root@debian7b:~#

    ```


    Adding the domain paul.local directive to /etc/resolv.conf omitting the domain
    when using hostnames.


    You can accomplish this feature automatically by adjusting dhclient.conf.


    ```

    root@debian?~# grep paul.local /etc/dhcp/dhclient.conf

    prepend domain-name "paul.local";

    prepend domain-search "paul.local";nroot@debian?~#

    ```'
