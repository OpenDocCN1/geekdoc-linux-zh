    # 14.1. creating the users on Linux


    The goal of this example is to set up a share accessible to a number of different
    users. The users will need to authenticate with their password before access to
    this share is granted. We will create three randomly named users, each with their
    own password. First we add these users to Linux.


    ```

    [root@RHEL52 ~]# useradd -c "Serena Williams" serena

    [root@RHEL52 ~]# useradd -c "Justine Henin" justine

    [root@RHEL52 ~]# useradd -c "Martina Hingis" martina

    [root@RHEL52 ~]# password serena

    Changing password for user serena.

    New UNIX password:

    Retype new UNIX password:

    passwd: all authentication tokens updated successfully.

    [root@RHEL52 ~]# password justine

    Changing password for user justine.

    New UNIX password:

    Retype new UNIX password:

    passwd: all authentication tokens updated successfully.

    [root@RHEL52 ~]# password martina

    Changing password for user martina.

    New UNIX password:

    Retype new UNIX password:

    passwd: all authentication tokens updated successfully.

    ```


    # 14.2. creating the users on samba


    Then we add them to the smbpasswd file, with the same password.


    ```

    [root@RHEL52 ~]# smpasswd -a serena

    New SMB password:

    Retype new SMB password:

    Added user serena.

    [root@RHEL52 ~]# smpasswd -a justine

    New SMB password:

    Retype new SMB password:

    Added user justine.

    [root@RHEL52 ~]# smpasswd -a martina

    New SMB password:

    Retype new SMB password:

    Added user martina.

    ```


    # 14.3. security = user


    Remember that we set samba''s security mode to share with the **security = share**
    directive in the [global] section Since we now require users to always provide
    a user and password for access to our samba server, we will need to change this.
    Setting **security = user** will allow the client to provide samba with a valid
    userid and password before giving access to a share.


    [global] section now looks like this:'
  - '[PAGE 182]


    ```

    [global]

    workgroup = WORKGROUP

    netbios name = TEACHERO

    server string = Samba File Server

    security = user

    ```


    # 14.4. configuring the share


    We are adding the [share] section to our smb.conf (and we do not forget to create
    the directory /srv/samba/authwrite).


    ```

    [authwrite]

    path = /srv/samba/authwrite

    comment = authenticated users only

    read only = no

    guest ok = no

    ```


    # 14.5. testing access with net use


    After restarting samba, we will test with different users from within Microsoft
    computers. The screenshots show we netUse first from Windows XP.


    ```

    C:\>net use m: \teacher0\authwrite stargate /user:serena

    The command completed successfully.

    ```


    ```

    C:\>

    M:\>echo greetings from Serena > serena.txt

    ```


    The next screenshot is martina on a Windows 2000 computer, she succeeds in writing
    her files, but fails to overwrite the file from serena.


    ```

    C:\>net use k: \teacher0\authwrite stargate /user:martina

    The command completed successfully.

    ```


    ```

    C:\>k:

    k:\>echo greetings from martina > Martina.txt

    K:\>echo overwrite > serena.txt

    Access is denied.

    ```


    # 14.6. testing access with smbclient


    You can also test connecting with authentication with smbclient. First we test
    with a wrong password.


    ```

    [root@RHEL52 samba]# smbclient //teacher0/authwrite -U martina wrongpass

    session setup failed: NT_STATUS_LOGON_FAILURE

    ```'
  - '[PAGE 183]


    # samba authentication


    Then we use with the correct password, and verify that we can access a file on
    the share.


    ```

    [root@RHEL52 samba]# smclient //teacher0/authwrite -U martina stargate

    Domain=[TEACHER0] OS=[Unix] Server=[Samba 3.0.33-7.7.el5]

    smb: \> more serena.txt

    getting file file serena.txt of size 14 as /tmp/smbmore.QQfmSN (6.8 kb/s)

    one

    two

    three

    smb: \> q

    ```


    # 14.7. verify ownership


    We now have a simple standalone file server with authenticated access. And the
    files in the shares belong to their proper owners.


    ```

    [root@RHEL52 samba]# ls -l /srv/samba/authwrite/

    total 8

    -rw-r--r-- 1 martina martina 0 Jan 21 20:06 martina.txt

    -rw-r--r-- 1 serena serena 14 Jan 14 21:25 serena.txt

    -rw-r--r-- 1 serena serena 6 Jan 21 20:09 ser.txt

    ```


    # 14.8. common problems


    # 14.8.1. NT_STATUS_BAD_NETWORK_NAME


    You can get NT_STATUS_BAD_NETWORK_NAME when you forget to create the target directory.


    ```

    [root@RHEL52 samba]# rm -rf /srv/samba/authwrite/

    [root@RHEL52 samba]# smclient //teacher0/authwrite -U martina stargate

    Domain=[TEACHER0] OS=[Unix] Server=[Samba 3.0.33-7.7.el5]

    tree connected failed: NT_STATUS_BAD_NETWORK_NAME

    ```


    # 14.8.2. NT_STATUS_LOGON_FAILURE


    You can get NT_STATUS_LOGON_FAILURE when you type the wrong password or when you
    use an nonexistent username.


    ```

    [root@RHEL52 samba]# smclient //teacher0/authwrite -U martina STARGATE

    session setup failed: NT_STATUS_LOGON_FAILURE

    ```


    # 14.8.3. usernames are (not) case sensitive


    Remember that usernames on Linux are case sensitive.


    ```

    [root@RHEL52 samba]# su - MARTINA

    su: user MARTINA does not exist

    ```'
