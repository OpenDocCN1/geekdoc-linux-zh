    read only = yes\nguest ok = yes\n```\n\n# 11.3. 重启服务器\n\n测试后，重启 samba 服务（这样就不用了）。\n\
    \n```\n[root@HEL4b readonly]# smb restart\nShutting down SMB services:      [\
    \ OK ]\nShutting down NMB services:      [ OK ]\nStarting SMB services:      \
    \     [ OK ]\nStarting NMB services:           [ OK ]\n```\n\n# 11.4. 验证共享\n\n\
    ### 11.4.1. 使用 smclient 验证\n\n你现在可以使用 smclient 验证共享的存在。我们的 pubread 被列为第四个共享。\n\
    \n```\n[root@HEL52]# smclient -L 127.0.0.1\nDomain=[WORKGROUP] OS=[Unix] Server=[Samba\
    \ 3.0-33]\n```\n\n| 共享名称 | 类型 | 注释 |\n| --- | --- | --- |\n| IPC$ | IPC | 共享服务（匿名文件服务器）\
    \ |\n| pub0 | 磁盘 | |\n| pubread | 磁盘 | 读取文件 |\n| Server | 注释 |\n| --- | --- |\
    \ --- |\n| TEACHERO | Samba 3.0-33 | |\n| W2003EE | Master | |\n| Workgroup |\
    \ |\n| WORKGROUP | W2003EE | |\n\n### 11.4.2. 在 Windows 上验证\n\n最后的测试是进入 Windows\
    \ 计算机并在 Samba 服务器上读取文件。我们首先使用 net use 挂载驱动器 k 上的 pubread 共享。\n\n```\nC:\\net use\
    \ K: teacher\\pubread\n命令执行成功。\n```\n\n然后查看共享的内容。\n\n```\nC:\\dir k:\n驱动器 K 为\
    \ pubread\n卷序列号为 0C82-11F2\n\n目录的 K:\\\n21/01/2009  05:49  <DIR>\n21/01/2009 \
    \ 05:49  <DIR>\n21/01/2009  05:49                summer.txt\n21/01/2009  05:49\
    \                winter.txt\n                               2 个文件            \
    \  35 字节\n                               2 个目录          13,496,242,176 字节可用\n\
    ```\n\n为了安全起见，让我们尝试写入。\n\n```\nK:\\echo very > winter.txt\n拒绝访问。\nK:\\\n```\n\n\
    或者你可以使用 Windows 资源管理器...\n\n![](img/1d49a617783f6f088a9e2a53e11a14_166_0.png)\n\
    \n# 11.5. 关于 netcat 的说明\n\nWindows 命令行是在 Linux 控制台中通过 **netcat** 管道到 Windows 命令\
    \ shell 的。\n\n这种方法的原理是让 netcat 在 Windows 计算机上监听特定端口，当收到连接时执行 cmd.exe。netcat 与\
    \ cat 的相似之处在于 cat 在网络上不做任何操作。\n\n要启用此连接，在 Windows 计算机上输入以下命令（先下载 Windows 版 netcat）。\n\
    \n```\nnc -l -p 23 -e cmd.exe\n```\n\n然后从任何 Linux 计算机使用 netcat 连接到这台机器。你在 Linux\
    \ Shell 中得到一个 cmd.exe 提示符。\n\n```\npaul@blalka:-$ nc 192.168.1.38 23\nMicrosoft\
    \ Windows [版本 5.2.3790]\n(C) Copyright 1985-2003 Microsoft Corp.\n\nC:\\>net use\
    \ k: /delete\nnet use k: /delete\nk: 已删除。\n```\n\n# 11.6. 练习：只读文件服务器\n\n- 1. 在合适的位置（FHS）创建一个目录，供所有人读取文件。\n\
    2. 确保目录所有权正确且所有人可访问。\n3. 在该目录放置一个文本文件。\n4. 使用 Samba 共享该目录。\n5. 从你自己和另一台计算机（smbclient,\
    \ net use, ...）验证该共享可以读取。\n6. 为你的 smb.conf 创建一个备份，命名为 smb.conf.ReadOnlyFileServer。\n\
    \n# 11.7. 解决方案：只读文件服务器\n\n1. 在合适的位置（FHS）创建一个目录，供所有人读取文件。\n\n选择其中一个...\n\n```\n\
    mkdir -p /srv/samba/readonly\nmkdir -p /home/samba/readonly\n/home/paul/readonly/samba\
    \ 是错误的！！\n/etc/samba/readonly 是错误的！！\n/readonly 是错误的！！\n```\n\n2. 确保目录所有权正确且所有人可访问。\n\
    \n```\nchown root:root /srv/samba/readonly\nchmod 755 /srv/samba/readonly\n```\n\
    \n3. 在该目录放置一个文本文件。\n\n```\necho Hello World > hello.txt\n```\n\n4. 使用 Samba 共享该目录。\n\
    \n```\n你的 smb.conf.readonly 看起来可能像这样：\n[global]\nworkgroup = WORKGROUP\nserver\
    \ string = Read Only File Server\nnetbios name = STUDENTx\nsecurity = share\n\n\
    [readonly]\npath = /srv/samba/readonly\n```\n\n# 12. 可写服务器\n\n### 12.1. 设置目录\n\
    \n在这个示例中，我们将创建一个所有人都可以创建文件的目录。\n\n```\nroot@RHEL52# mkdir -p /srv/samba/writable\n\
    ```\n\n### 12.2. 共享\n\n在 smb.conf 中有两个参数需要更改。\n\n```\n[global]\nworkgroup = WORKGROUP\n\
    server string = Public Server\nsecurity = share\n\n[pubread]\npath = /srv/samba/readonly\n\
    comment = files to read\nread only = yes\nguest ok = yes\n```\n\n### 12.3. 配置\n\
    \n我们只需在 smb.conf 中添加一个参数。\n\n```\n[pubwrite]\npath = /srv/samba/writable\ncomment\
    \ = files to write\nread only = no\nguest ok = yes\n```\n\n### 12.4. 在 Windows\
    \ 上验证\n\n现在我们可以在 Windows 上验证连接的可用性。\n\n```\nC:\\net use K: teacher0\\pubwrite\n\
    命令执行成功。\n```\n\n### 12.5. 测试写入\n\n我们挂载了驱动器 k 上的 pubread 共享。\n\n```\nC:\\dir k:\n\
    驱动器 K 为 pubread\n卷序列号为 0C82-11F2\n\n目录的 K:\\\n21/01/2009  05:49  <DIR>\n21/01/2009\
    \  05:49  <DIR>\n21/01/2009  05:49                summer.txt\n21/01/2009  05:49\
    \                winter.txt\n                               2 个文件            \
    \  35 字节\n                               2 个目录          13,496,242,176 字节可用\n\
    ```\n\n### 12.6. 这是如何可能的？\n\nLinux（或任何 Unix）总是需要用户账户来获取访问。Windows 计算机没有为 Samba\
    \ 提供用户账户或密码。相反，通过此共享创建的文件 Linux 所有者是访客账户（通常名为 nobody）。\n\n```\nroot@RHEL52 samba#\
    \ ls -l /srv/samba/writable/\ntotal 4\n-rwxr-xr-- 1 nobody nobody 6 Jan 21 06:16\
    \ hoi.txt\n```\n\n所以这不是最干净的解决方案。我们需要改进。\n\n# 12.7. 练习：可写服务器\n\n- 1. 使用 Samba 共享一个目录。\n\
    2. 确保所有人都可以读取和写入文件，使用 smbclient 和 Microsoft 计算机测试写入。\n3. 验证由（各种）用户创建的文件的所有权。\n\
    \n# 12.8. 解决方案：可写服务器\n\n- 1. 使用 Samba 共享一个目录。\n\n```\nmkdir /srv/samba/writable\n\
    chmod 777 /srv/samba/writable\n```\n\n"
