    iptables -t filter -F\niptables -t filter -X\niptables -t nat -F\niptables -t\
    \ nat -X\n\n# default drop\niptables -P INPUT DROP\niptables -P FORWARD DROP\n\
    iptables -P OUTPUT DROP\n\n# allow loopback device\niptables -A INPUT -o lo -j\
    \ ACCEPT\niptables -A OUTPUT -o lo -j ACCEPT\n\n# allow ssh over eth0 from outside\
    \ to system\niptables -A INPUT -i eth0 -p tcp --dport 22 -j ACCEPT\niptables -A\
    \ OUTPUT -o eth0 -p tcp --sport 22 -j ACCEPT\n\n# allow any traffic from 10.1.1.0/24\
    \ to system\niptables -A INPUT -i eth -s 10.1.1.0/24 -p tcp -j ACCEPT\niptables\
    \ -A OUTPUT -o eth -d 10.1.1.0/24 -p tcp -j ACCEPT\n```\n\n## 8.3.9. Allowing\
    \ ICMP(ping)\n\nWhen you enable iptables, you will get an 'Operation not permitted'\
    \ message when trying to ping other hosts.\n\n```\n[root@RHEL5 ~]# ping 192.168.187.130\n\
    PING 192.168.187.130 (192.168.187.130) 56(84) bytes of data.\nping: sendmsg: Operation\
    \ not permitted\nping: sendmsg: Operation not permitted\n```\n\nThe screenshot\
    \ below shows how to set up iptables to allow a ping from or to your machine.\n\
    \n```\n[root@RHEL5 ~]# iptables -A INPUT -p icmp --icmp-type any -j ACCEPT\n[root@RHEL5\
    \ ~]# iptables -A OUTPUT -p icmp --icmp-type any -j ACCEPT\n```\n\nThe previous\
    \ two lines do not allow other computers to route ping messages through your router,\
    \ because it only handles INPUT and OUTPUT. For routing of ping, you will need\
    \ to enable it on the FORWARD chain. The following command enables routing of\
    \ icmp messages between networks.\n\n```\n[root@RHEL5 ~]# iptables -A FORWARD\
    \ -p icmp --icmp-type any -j ACCEPT\n```\n\n## 8.4. practice: packet filtering\n\
    \n1. Make sure you can ssh to your router-system when iptables is active.\n2.\
    \ Make sure you can ping to your router-system when iptables is active.\n3. Define\
    \ one of your networks as 'internal' and the other as 'external'. Configure the\
    \ router to allow visits to a website (http) to go from the internal network to\
    \ the external network (but not in the other direction).\n4. Make sure the internal\
    \ network can ssh to the external, but not the other way around.\n\n## 8.5. solution:\
    \ packet filtering\n\nA possible solution, where leftnet is the internal and rightnet\
    \ is the external network.\n\n```bash\n#!/bin/bash\n\n# first cleanup everything\n\
    iptables -t filter -F\niptables -t filter -X\niptables -t nat -F\niptables -t\
    \ nat -X\n\n# default drop\niptables -P INPUT DROP\niptables -P FORWARD DROP\n\
    iptables -P OUTPUT DROP\n\n# allow loopback\niptables -A INPUT -o lo -j ACCEPT\n\
    iptables -A OUTPUT -o lo -j ACCEPT\n\n# question 1: allow ssh over eth0\niptables\
    \ -A INPUT -i eth0 -p tcp --dport 22 -j ACCEPT\niptables -A OUTPUT -o eth0 -p\
    \ tcp --sport 22 -j ACCEPT\n\n# question 2: allow icmp(ping) anywhere\niptables\
    \ -A INPUT -p icmp --icmp-type any -j ACCEPT\niptables -A FORWARD -p icmp --icmp-type\
    \ any -j ACCEPT\niptables -A OUTPUT -p icmp --icmp-type any -j ACCEPT\n\n# question\
    \ 3: allow http from internal(leftnet) to external(rightnet)\niptables -A FORWARD\
    \ -i eth1 -o eth2 -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD -m state --state\
    \ ESTABLISHED,RELATED -j ACCEPT\n\n# question 4: allow ssh from internal(leftnet)\
    \ to external(rightnet)\niptables -A FORWARD -i eth1 -o eth2 -p tcp --dport 22\
    \ -j ACCEPT\niptables -A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT\n\
    \n# allow http from external(rightnet) to internal(leftnet)\niptables -A FORWARD\
    \ -i eth2 -o eth1 -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD -m state --state\
    \ ESTABLISHED,RELATED -j ACCEPT\n\n# allow rpc over eth0 from outside to system\n\
    iptables -A INPUT -i eth0 -p tcp --dport 111 -j ACCEPT\niptables -A OUTPUT -o\
    \ eth0 -p tcp --sport 111 -j ACCEPT\n```\n\n## 8.6. network translation\n\nA NAT\
    \ device is a router that is also changing the source and destination IP address\
    \ in packets. It is typically used to connect multiple computers in a private\
    \ address range with the public internet. NAT was developed to hide private addresses\
    \ from the internet, allow private addresses to reach the internet, and not to\
    \ disclose internal networks.\n\nNAT in iptables adds two new chains: PREROUTING\
    \ allows altering packets before they reach the INPUT chain. POSTROUTING allows\
    \ altering packets after they exit the OUTPUT chain. Use `iptables -t nat -L`\
    \ to look at the NAT table. The screenshot below shows an empty NAT table.\n\n\
    ```\n[root@RHEL]# iptables -t nat -L\nChain PREROUTING (policy ACCEPT)\n  target\
    \     prot opt source\nChain POSTROUTING (policy ACCEPT)\n  target     prot opt\
    \ source\nChain OUTPUT (policy ACCEPT)\n  target     prot opt source\n```\n\n\
    ### 8.6.2. SNAT (Source NAT)\n\nThe goal of source nat is to change the source\
    \ address inside a packet before it leaves the system (e.g. to the internet).\
    \ This means the NAT device will need to keep a table in memory of all the packets\
    \ changed so it can deliver the packet to the original source. Because SNAT is\
    \ about packets leaving the system, we use the POSTROUTING chain. Here is an example\
    \ SNAT rule. The rule says that packets coming from 10.1.1.0/24 network and exiting\
    \ eth1 will get the source address set to the public IP.\n\n```bash\niptables\
    \ -t nat -A POSTROUTING -o eth1 -s 10.1.1.0/24 -j SNAT --to-source 192.168.1.1\n\
    ```\n\nOf course there must exist a proper iptables filter setup to allow the\
    \ packet to traverse from one network to the other.\n\n### 8.6.3. SNAT example\n\
    \nThis example uses a typical nat setup. The internal (eth0) network has access\
    \ via SNAT to external (eth1) webservers (port 80).\n\n```bash\n#!/bin/bash\n\
    # iptables script for simple nat\n# eth0 is internal network, eth1 is internet\n\
    echo 1 > /proc/sys/net/ipv4/ip_forward\niptables -P INPUT ACCEPT\niptables -P\
    \ OUTPUT ACCEPT\niptables -P FORWARD DROP\niptables -A FORWARD -i eth0 -o eth1\
    \ -s 10.1.1.0/24 -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD -i eth1 -o eth0\
    \ -d 10.1.1.0/24 -p tcp --sport 80 -j ACCEPT\niptables -t nat -A POSTROUTING -o\
    \ eth1 -s 10.1.1.0/24 -j SNAT --to-source 192.168.1.1\n```\n\n## 8.6.4. IP masquerading\n\
    \nIP masquerading is very similar to SNAT, but is meant for dynamic interfaces.\
    \ Typical example is broadband 'router/modems' connected to the internet and receiving\
    \ a different ip-address from the isp each time they are cold-booted. The only\
    \ change needed to convert the SNAT script to a masquerading is one line.\n\n\
    ```\niptables -t nat -A POSTROUTING -o eth1 -s 10.1.1.0/24 -j MASQUERADE\n```\n\
    \n## 8.6.5. DNAT (Destination NAT)\n\nDNAT is typically used to allow packets\
    \ from the internet to be redirected to an internal server (in your DMZ) and in\
    \ a private address range that is inaccessible directly from the internet. This\
    \ example script allows internet users to reach your internal (192.168.1.99) server\
    \ via ssh (port 22).\n\n```bash\n#!/bin/bash\n# iptables script for DNAT\n# eth0\
    \ is internal network, eth1 is external\necho 0 > /proc/sys/net/ipv4/ip_forward\n\
    iptables -P INPUT ACCEPT\niptables -P OUTPUT ACCEPT\niptables -P FORWARD DROP\n\
    iptables -A FORWARD -i eth1 -o eth0 -p tcp --dport 22 -j DNAT --to-destination\
    \ 192.168.1.99\n```\n"
  mdcn: "\n\n## 8.3.7. iptables 保存\n\n使用 RHEL 的 iptables 在防火墙启动（重）启动时自动实现这些规则。\n\n\
    ```\n[root@RHEL ~]# # /etc/init.d/iptables save\nSaving iptables rules to /etc/sysconfig/iptables:\n\
    [root@RHEL ~]# #\n```\n\n## 8.3.8. 脚本示例\n\n你可以为这些规则编写一个简单的脚本。以下是一个实现了你在之前章节中看到的防火墙规则的示例脚本。\n\
    \n```bash\n#!/bin/bash\n# 首先清理一切\niptables -t filter -F\niptables -t filter -X\n\
    iptables -t nat -F\niptables -t nat -X\n\n# 默认拒绝\niptables -P INPUT DROP\niptables\
    \ -P FORWARD DROP\niptables -P OUTPUT DROP\n\n# 允许回环设备\niptables -A INPUT -o lo\
    \ -j ACCEPT\niptables -A OUTPUT -o lo -j ACCEPT\n\n# 允许外部通过 eth0  ssh 访问系统\niptables\
    \ -A INPUT -i eth0 -p tcp --dport 22 -j ACCEPT\niptables -A OUTPUT -o eth0 -p\
    \ tcp --sport 22 -j ACCEPT\n\n# 允许从 10.1.1.0/24 到系统的任何流量\niptables -A INPUT -i\
    \ eth -s 10.1.1.0/24 -p tcp -j ACCEPT\niptables -A OUTPUT -o eth -d 10.1.1.0/24\
    \ -p tcp -j ACCEPT\n```\n\n## 8.3.9. 允许 ICMP(ping)\n\n当你启用 iptables 时，在尝试 ping\
    \ 其他主机时会收到“Operation not permitted”（操作不允许）的消息的消息。\n\n```\n[root@RHEL5 ~]# ping\
    \ 192.168.187.130\nPING 192.168.187.130 (192.168.187.130) 56(84) bytes of data.\n\
    ping: sendmsg: Operation not permitted\nping: sendmsg: Operation not permitted\n\
    ```\n\n下面的截图显示了如何设置 iptables 以允许从或向你的机器进行 ping。\n\n```\n[root@RHEL5 ~]# iptables\
    \ -A INPUT -p icmp --icmp-type any -j ACCEPT\n[root@RHEL5 ~]# iptables -A OUTPUT\
    \ -p icmp --icmp-type any -j ACCEPT\n```\n\n前两行并不允许其他计算机通过你的路由器路由 ping 消息，因为它们只处理了\
    \ INPUT 和 OUTPUT。对于 ping 的路由，你需要在 FORWARD 链上启用它。以下命令启用了网络间 icmp 消息的路由。\n\n```\n\
    [root@RHEL5 ~]# iptables -A FORWARD -p icmp --icmp-type any -j ACCEPT\n```\n\n\
    ## 8.4. 练习：数据包过滤\n\n1. 确保在 iptables 激活时，你可以 ssh 到你的路由器系统。\n2. 确保在 iptables 激活时，你可以\
    \ ping 你的路由器系统。\n3. 将你的其中一个网络定义为“内部”(internal)，另一个定义为“外部”(external)。配置路由器允许访问网站\
    \ (http) 的流量从内部网络到外部网络（但反向方向不行）。\n4. 确保内部网络可以 ssh 到外部，但反之则不然。\n\n## 8.5. 解决方案：数据包过滤\n\
    \n可能的解决方案，其中 leftnet 是内部网络，rightnet 是外部网络。\n\n```bash\n#!/bin/bash\n\n# 首先清理一切\n\
    iptables -t filter -F\niptables -t filter -X\niptables -t nat -F\niptables -t\
    \ nat -X\n\n# 默认拒绝\niptables -P INPUT DROP\niptables -P FORWARD DROP\niptables\
    \ -P OUTPUT DROP\n\n# 允许回环\niptables -A INPUT -o lo -j ACCEPT\niptables -A OUTPUT\
    \ -o lo -j ACCEPT\n\n# 问题 1：通过 eth0 允许 ssh\niptables -A INPUT -i eth0 -p tcp --dport\
    \ 22 -j ACCEPT\niptables -A OUTPUT -o eth0 -p tcp --sport 22 -j ACCEPT\n\n# 问题\
    \ 2：允许任何地方 icmp(ping)\niptables -A INPUT -p icmp --icmp-type any -j ACCEPT\niptables\
    \ -A FORWARD -p icmp --icmp-type any -j ACCEPT\niptables -A OUTPUT -p icmp --icmp-type\
    \ any -j ACCEPT\n\n# 问题 3：允许内部(leftnet) 到外部(rightnet) 的 http\niptables -A FORWARD\
    \ -i eth1 -o eth2 -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD -m state ESTABLISHED,RELATED\
    \ -j ACCEPT\n\n# 问题 4：允许内部(leftnet) 到外部(rightnet) 的 ssh\niptables -A FORWARD -i\
    \ eth1 -o eth2 -p tcp --dport 22 -j ACCEPT\niptables -A FORWARD -m state ESTABLISHED,RELATED\
    \ -j ACCEPT\n\n# 允许外部(rightnet) 到内部(leftnet) 的 http\niptables -A FORWARD -i eth2\
    \ -o eth1 -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD -m state ESTABLISHED,RELATED\
    \ -j ACCEPT\n\n# 允许外部通过 eth0  rpc\niptables -A INPUT -i eth0 -p tcp --dport 111\
    \ -j ACCEPT\niptables -A OUTPUT -o eth0 -p tcp --sport 111 -j ACCEPT\n```\n\n\
    ## 8.6. 网络转换\n\nNAT 设备是一种同时也更改数据包源地址和目的 IP 地址的路由器。它通常用于将私有地址范围内的多个计算机连接到公共互联网。NAT\
    \ 的开发是为了从互联网隐藏内部网络，允许私有地址访问互联网。iptables 中的 NAT 添加了两个新链：PREROUTING 在数据包到达 INPUT\
    \ 链之前修改；POSTROUTING 在数据包退出 OUTPUT 链之后修改。使用 `iptables -t nat -L` 查看 NAT 表。下面的截图显示了一个空的\
    \ NAT 表。\n\n```\n[root@RHEL]# iptables -t nat -L\nChain PREROUTING (policy ACCEPT)\n\
    \  target     prot opt source\nChain POSTROUTING (policy ACCEPT)\n  target   \
    \  prot opt source\nChain OUTPUT (policy ACCEPT)\n  target     prot opt source\n\
    ```\n\n### 8.6.2. SNAT (源 NAT)\n\n源 nat 的目标是在数据包离开系统之前更改其源地址。这意味着 NAT 设备需要在内存中保留所有已更改数据包的表，以便将其交付给原始源。由于\
    \ SNAT 针对离开系统的包，我们使用 POSTROUTING 链。这是一个 SNAT 规则示例。该规则规定来自 10.1.1.0/24 网络并离开 eth1\
    \ 的包将设置为公共 IP。\n\n```bash\niptables -t nat -A POSTROUTING -o eth1 -s 10.1.1.0/24\
    \ -j SNAT --to-source 192.168.1.1\n```\n\n当然，必须存在正确的 iptables 过滤设置允许数据包从一个网络到另一个网络。\n\
    \n### 8.6.3. SNAT 示例\n\n此示例使用了典型的 nat 设置。内部 (eth0) 网络通过 SNAT 访问外部 (eth1) Web 服务器（端口\
    \ 80）。\n\n```bash\n#!/bin/bash\n#  nat 的 iptables 脚本\n# eth0 是内部网络，eth1 是互联网\n\
    echo 1 > /proc/sys/net/ipv4/ip_forward\niptables -P INPUT ACCEPT\niptables -P\
    \ OUTPUT ACCEPT\niptables -P FORWARD DROP\niptables -A FORWARD -i eth0 -o eth1\
    \ -s 10.1.1.0/24 -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD -i eth1 -o eth0\
    \ -d 10.1.1.0/24 -p tcp --sport 80 -j ACCEPT\niptables -t nat -A POSTROUTING -o\
    \ eth1 -s 10.1.1.0/24 -j SNAT --to-source 192.168.1.1\n```\n\n## 8.6.4. IP 伪装\
    \ (Masquerading)\n\nIP 伪装与 SNAT 非常相似，但用于动态接口。典型的示例是连接到互联网的宽带“路由器/调制调器”，它们每次冷启动都会从\
    \ ISP 接收不同的 IP。将 SNAT 脚本转换为伪装只需要一行。\n\n```\niptables -t nat -A POSTROUTING -o\
    \ eth1 -s 10.1.1.0/24 -j MASQUERADE\n```\n\n## 8.6.5. DNAT (目的 NAT)\n\nDNAT 通常用于将来自互联网的数据包重定向到内部服务器（位于你的\
    \ DMZ 中），位于无法从互联网直接访问的私有地址范围。此示例脚本允许互联网用户通过 ssh (端口 22) 访问你的内部 (192.168.1.99)\
    \ 服务器。\n\n```bash\n#!/bin/bash\n# DNAT 的 iptables 脚本\n# eth0 是内部网络，eth1 是外部\n\
    echo 0 > /proc/sys/net/ipv4/ip_forward\niptables -P INPUT ACCEPT\niptables -P\
    \ OUTPUT ACCEPT\niptables -P FORWARD DROP\niptables -A FORWARD -i eth1 -o eth0\
    \ -p tcp --dport 22 -j DNAT --to-destination 192.168.1.99\n```\n\n```\n\n"
