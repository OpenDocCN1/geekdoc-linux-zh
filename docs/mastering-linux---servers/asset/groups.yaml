    \ 配置的一部分）：\n\n```\nzone \"office.linux-training.be\" {\ntype master;\nfile \"\
    /var/named/db.office.linux-training.be\";\nallow-transfer ( any );\nallow-update\
    \ ( key mykey );\n};\n```\n\n示例密钥文件内容：\n\n```\n[root@fedora4 ~]# cat /etc/rndc.key\n\
    key \"rndc-key {\nalalgorithm hmac-md5;\nsecret \"*4Ykd58UieUr3Ve6ad1qTfQ==\"\
    ;\n};\n```\n\n使用 `dnssec-keygen` 生成你自己的密钥。\n\n如何在配置文件包含密钥：\n\n```\ninclude \"\
    /etc/bind/rndc.key\";\n```\n\n同时确保 bind 能够写入你的 db.zone 文件（使用 chmod/chown）。对于 Ubuntu，这可以在\
    \ /etc/bind 中，对于 Fedora 则在 /var/named 中。\n\n## 6.8. 高级 dhcp\n\n### 6.8.1. 80/20\
    \ 原则\n\nDHCP 服务器不应是单点故障。让我们讨论冗余的 DHCP 服务器设置。\n\n### 6.8.2. 中继代理\n\n为了避免在每个网段都放置\
    \ DHCP 服务器，我们可以使用 DHCP 中继代理。\n\n### 6.8.3. 异常 DHCP 服务器\n\n异常 DHCP 服务器是一个没有解决方案的问题。例如，无意中将一个（被认为简单的）集线器/交换机连接到有内部\
    \ DHCP 服务器的网络中。\n\n### 6.8.4. dhcp 和 ddns\n\nDHCP 在配置客户端计算机时动态更新 DNS。DDNS 可以使用或使用安全密钥。\n\
    \n当配置正确时，记录可以自动添加到区域文件中：\n\n```\nroot@fedora14~# tail -2 /var/named/db.office.linux-training.be\n\
    ubu1010srv A 192.168.42.151\n TXT \"0ubu1010\"\n```\n\n## 6.9. 练习：dhcp\n\n\n"
