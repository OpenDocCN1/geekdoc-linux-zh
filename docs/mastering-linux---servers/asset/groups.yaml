  mdcn: "\n\n## 2.2. 安装 squid\n\n此截图显示了如何使用 aptitude 在 Debian 上安装 squid。如果你使用的是 Red\
    \ Hat/CentOS，请使用 yum。\n\n```\nroot@debian:~# aptitude install squid\nThe following\
    \ NEW packages will be installed:\nsquid-common(a) squid-langpack(a)\n0 packages\
    \ upgraded, 3 newly installed, 0 to remove and 0 not upgraded.\nNeed to to get\
