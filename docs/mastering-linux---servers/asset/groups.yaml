  md: "\n# Chapter 5. advanced DNS\n\nThis chapter expands your DNS server with topics\
    \ like **round robin dns** for load balancing servers, **dns delegation** to delegate\
    \ child domains to another team and **split horizon dns** so you can provide local\
    \ service locations to clients.\n\nThere is more to **dns**, content will be added\
    \ **soon**.\n\n## 5.1. example: DNS round robin\n\nWhen you create multiple A\
    \ records for the same name, then bind will do a round robin of the order in which\
    \ the records are returned. This allows the use of DNS as a load balancer between\
    \ hosts, since clients will usually take the first-addressed address.\n\nConsider\
    \ this example for the /etc/bind/db.paul.local zone configuration file. There\
    \ are two A records for www pointing to two distinct ip addresses.\n\n```\nroot@debian:~#\
    \ grep www /etc/bind/db.paul.local\nwww       IN      A  10.104.33.30\nwww   \
    \    IN      A  10.104.33.31\n```\n\nBelow a screenshot of nslookup querying a\
    \ balanced A record. Notice the order of ip addresses returned.\n\n```\nroot@debian:~#\
    \ nslookup www.paul.local 10.104.33.30\nServer:         10.104.33.30\nAddress:\
    \        10.104.33.30#53\n\nName:           www.paul.local\nAddress:        10.104.33.31\n\
    Name:           www.paul.local\nAddress:        10.104.33.30\n\nroot@debian:~#\
    \ nslookup www.paul.local 10.104.33.30\nServer:         10.104.33.30\nAddress:\
    \        10.104.33.30#53\n\nName:           www.paul.local\nAddress:        10.104.33.30\n\
    Name:           www.paul.local\nAddress:        10.104.33.31\n```\n\nTry to set\
    \ up a website on two web servers (with a small difference so you can distinguish\
    \ the websites) and test the round robin.\n\n## 5.2. DNS delegation\n\nYou can\
    \ delegate a child domain to another DNS server. The child domain then becomes\
    \ a new zone, with authority at the new dns server.\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_98_0.png)\n\
    \nWhen delegation is properly set up, then clients that query your parent zone\
    \ will also be able to resolve the delegated child zones.\n\n## 5.3. example:\
    \ DNS delegation\n\nWe have another Linux server debian7b and we want to make\
    \ it responsible for the child domain test42.paul.local.\n\nNote the name of the\
    \ servers in the screenshots are either debian7 (hosting the parent domain) or\
    \ debian7b (hosting the child domain).\n\nWe start by adjusting the /etc/bind/named.conf.local\
    \ file (on the server hosting the parent domain) to make sure that no forwarder\
    \ will be used when resolving authoritative names.\n\n```\nroot@debian7:~# grep\
    \ -A4 paul.local /etc/bind/named.conf.local\nzone \"paul.local\" {\n    type master;\n\
    \    file \"etc/bind/db.paul.local\";\n    allow-update { none };\n    allow-transfer\
    \ { 10.104.15.20 };\n    forwarders { };\n}\nroot@debian7:~#\n```\n\nTechnically,\
    \ you can also set allow-transfer to { any }; while troubleshooting and then refine\
    \ it, but this is not needed for delegation.\n\nThen we add the delegation to\
    \ our zone database:\n\n```\nroot@debian7:~# vi /etc/bind/db.paul.local\nORIGIN\
    \ test42.paul.local.\n@       IN NS ns2.test42.paul.local.\nns2      IN A    10.104.33.31\
    \    ; the glue record\nroot@debian7:~#\n```\n\nDon't forget to restart bind and\
    \ verify /var/log/syslog.\n\n```\nroot@debian7:~# service bind9 restart\nStopping\
    \ domain name service.... bind9.\nStarting domain name service.... bind9.\nroot@debian7:~#\
    \ grep paul.local /var/log/syslog | cut -c28- | tail -2\nnamed[3202]: zone paul.local/IN:\
    \ loaded serial 2014100801\nnamed[3202]: zone paul.local/IN: sending notifications\
    \ (serial 2014100801)\nroot@debian7:~#\n```\n\nNote that on your terminal you\
    \ can type tail -40 /var/log/syslog because the only reason I use grep, cut and\
    \ tail -2 is to limit the size of the screenshots in this book.\n\n## advanced\
    \ DNS\n\nNext we create a database file on the second server, as seen in this\
    \ screenshot:\n\n```\nroot@debian7b:~# cat /etc/bind/db.test42.paul.local\n; child\
    \ zone for classroom teaching\n$TTL 86400\n$ORIGIN test42.paul.local.\n@    SOA\
    \    ns2.test42.paul.local. root.test42.paul.local. (\n                    2014100800\
    \ ; Serial\n                            1h; Refresh\n                        \
    \    1h; Retry\n                            2h; Expire\n                     \
    \       900 ) ; Negative Cache TTL\n; name\nIN     NS      ns2.test42.paul.local.\n\
    IN     NS      debian7b.test42.paul.local.\n; servers\nns2         IN A      \
    \ 10.104.33.31\ndebian7b     IN A       10.104.33.31\nroot@debian7b:~#\n```\n\n\
    The second server also needs a definition in named.conf.local, followed by a restart\
    \ of bind.\n\n```\nroot@debian7b:~# cat /etc/bind/named.conf.local\n// local configuration\
    \ here\n// Consider adding r1918 zones here, if they are not used in your\n//\
    \ include \"/etc/bind/zones.rfc1918\"\n\nzone \"test42.paul.local\" {\n    type\
    \ master;\n    file \"/etc/bind/db.test42.paul.local\";\n    allow-update { none\
    \ };\n    allow-transfer { any };\n}\nroot@debian7b:~#\n```\n\nTesting on the\
    \ parent server:\n\n```\nroot@debian7:~# dig ns1.paul.local +short\n10.104.33.30\n\
    root@debian7:~# dig ns2.test42.paul.local +short\n10.104.33.31\nroot@debian7:~#\
    \ dig debian7b.test42.paul.local +short\n10.104.33.31\n```\n\n## 5.4. example:\
    \ split-horizon\n\nSuppose you want to answer dns depending on who is asking.\
    \ For example when someone from 10.104.15.0/24 (managed by Jesse) asks for the\
    \ A record www.local then dns answers with 10.104.33.30. But when someone from\
    \ 10.104.42.0 (managed by Keith) asks for the same record of www.local he will\
    \ get 10.104.33.31.\n\nA split-horizon setup can be used to redirect answer to\
    \ local copies of certain services. In this example we want to decide on answers\
    \ for two networks (Jesse's and Keith's) and prevent them from using our dns server\
    \ for recursion, while maintaining the capability to resolve paul.local from our\
    \ own.\n\nWe start by creating three views in named.conf.local:\n\n```\nroot@debian7:/etc/bind#\
    \ cat named.conf.local\nview \"paul\" {\n    match-clients { 10.104.33.30; localhost;\
    \ };\n    include \"/etc/bind/named.conf.zones\";\n    zone \"paul.local\" {\n\
    \        type master;\n        file \"/etc/bind/db.paul.local\";\n        allow-update\
    \ { none };\n    }\n} // end view internal```\n\nview \"jesse\" {\n    match-clients\
    \ { 10.104.15.0/24 };\n    zone \"paul.local\" {\n        type master;\n     \
    \   file \"/etc/bind/db.paul.local.jesse\";\n        allow-update { none };\n\
    \    }\n} // end view jesse```\n\nview \"keith\" {\n    match-clients { 10.104.42.0/24\
    \ };\n    zone \"paul.local\" {\n        type master;\n        file \"/etc/bind/db.paul.local.keith\"\
    ;\n        allow-update { none };\n    }\n} // end view```\n\nNote that we included\
    \ the default-zones in the internal zone. It is mandatory to put all zones inside\
    \ using a view. The zone files are identical copies, except for the www record.\
    \ You can see that the round robin is active for internal users, computers from\
    \ 10.104.15.0/24 (Jesse) will always receive 10.104.33.30 while computers from\
    \ 10.104.42.0 (Keith) will receive 10.104.33.31.\n\n```\nroot@debian7:/etc/bind#\
    \ grep www db.paul.local db.paul.local.\ndb.paul.local:www      IN A 10.104.33.30\n\
    db.paul.local:www      IN A 10.104.33.31\ndb.paul.local:jesse   IN A 10.104.33.30\n\
    db.paul.local:keith   IN A 10.104.33.31\n```\n\n## 5.5. old dns topics\n\nThe\
    \ all dns things below this paragraph are old and in urgent need of review.\n\n\
    ### 5.5.1. old example: reverse DNS\n\n1. We can add ip to name resolution to\
    \ our dns-server using a reverse dns zone.\n\n2. Start by adding a .arpa zone\
    \ to /etc/bind/named.conf.local like this (we set notify to no avoid sending of\
    \ notify messages to other servers):\n\n```\nroot@ubuntu010srv:/etc/bind# grep\
    \ -A4 arpa named.conf.local\nzone \"1.168.192.in-addr.arpa\" (\n    type master;\n\
    \    notify no;\n    file \"/etc/bind/db.192\";\n);\n```\n\n3. Also create a database\
    \ file for this reverse lookup zone.\n\n```\nroot@ubuntu010srv:/etc/bind# cat\
    \ db.192\n;\n; BIND reverse data file for 192.168.1.0/24 network\n;\n@ TTL 604800\n\
    @ IN SOA ns.cobbaut.paul root.cobbaut.paul. (\n2011016 6 ; Serial\n604800 ; Refresh\n\
    86400 ; Retry\n2419200 ; Expire\n604800 ) ; Negative Cache TTL\n;\n@ IN NS ns.\n\
    37 IN PTR ns.cobbaut.paul.\n1 IN PTR anya.cobbaut.paul.\n30 IN PTR mac.cobbaut.paul.\n\
    root@ubuntu010srv:/etc/bind#\n```\n"
  mdcn: "\n\n# 第 5 章 高级 DNS\n\n本章将扩展你的 DNS 服务器功能，主题包括用于服务器负载均衡的**轮询 DNS (round robin\
    \ dns)**、将子域名委托给另一个团队的**DNS 委托 (dns delegation)**，以及能够为客户端提供本地服务位置的**分区域 DNS (split\
    \ horizon dns)**。\n\n**DNS** 还有更多内容，**很快**会添加。\n\n## 5.1. 示例：DNS 轮询\n\n当你为同一个名称创建多个\
    \ A 记录时，bind 会对返回的记录顺序进行轮询。这允许将 DNS 作为主机之间的负载均衡器使用，因为客户端通常会获取第一个解析出的地址。\n\n考虑这个针对\
    \ /etc/bind/db.paul.local 区域配置文件的示例。www 有两个指向不同 IP 地址的 A 记录。\n\n```\nroot@debian:~#\
    \ grep www /etc/bind/db.paul.local\nwww       IN      A  10.104.33.30\nwww   \
    \    IN      A  10.104.33.31\n```\n\n下面是 nslookup 查询平衡 A 记录的截图。注意返回的 IP 地址的顺序。\n\
    \n```\nroot@debian:~# nslookup www.paul.local 10.104.33.30\nServer:         10.104.33.30\n\
    Address:        10.104.33.30#53\n\nName:           www.paul.local\nAddress:  \
    \      10.104.33.31\nName:           www.paul.local\nAddress:        10.104.33.30\n\
    \nroot@debian:~# nslookup www.paul.local 10.104.33.30\nServer:         10.104.33.30\n\
    Address:        10.104.33.30#53\n\nName:           www.paul.local\nAddress:  \
    \      10.104.33.30\nName:           www.paul.local\nAddress:        10.104.33.31\n\
    ```\n\n尝试在两个 Web 服务器上建立网站（带有细微差异以便区分网站）并测试轮询。\n\n## 5.2. DNS 委托\n\n你可以将子域名委托给另一个\
    \ DNS 服务器。该子域名将成为一个新的区域，其权威由新的 DNS 服务器维护。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_98_0.png)\n\
    \n当委托正确设置后，查询父区域的客户端也能解析被委托的子区域。\n\n## 5.3. 示例：DNS 委托\n\n我们有另一台 Linux 服务器 debian7b，我们希望让它负责子域名\
    \ test42.paul.local。\n\n注意截图中的服务器名称要么是 debian7（托管父域名），要么是 debian7b（托管子域名）。\n\n\
    我们首先调整 /etc/bind/named.conf.local 文件（在托管父域名的服务器上），以确保在解析权威名称时不会使用任何转发器。\n\n```\n\
    root@debian7:~# grep -A4 paul.local /etc/bind/named.conf.local\nzone \"paul.local\"\
    \ {\n    type master;\n    file \"etc/bind/db.paul.local\";\n    allow-update\
    \ { none };\n    allow-transfer { 10.104.15.20 };\n    forwarders { };\n}\nroot@debian7:~#\n\
    ```\n\n技术上，你也可以在排故障时将 allow-transfer 设置为 { any } 然后进行细化，但对于委托来说是不需要的。\n\n然后我们向区域数据库中添加委托：\n\
    \n```\nroot@debian7:~# vi /etc/bind/db.paul.local\nORIGIN test42.paul.local.\n\
    @       IN NS ns2.test42.paul.local.\nns2      IN A    10.104.33.31    ; 粘合记录\n\
    root@debian7:~#\n```\n\n不要忘记重启 bind 并验证 /var/log/syslog。\n\n```\nroot@debian7:~#\
    \ service bind9 restart\nStopping domain name service.... bind9.\nStarting domain\
    \ name service.... bind9.\nroot@debian7:~# grep paul.local /var/log/syslog | cut\
    \ -c28- | tail -2\nnamed[3202]: zone paul.local/IN: loaded serial 2014100801\n\
    named[3202]: zone paul.local/IN: sending notifications (serial 2014100801)\nroot@debian7:~#\n\
    ```\n\n注意在你的终端上你可以输入 tail -40 /var/log/syslog，因为我使用 grep、cut 和 tail -2 的唯一原因是限制此书中截图的大小。\n\
    \n高级 DNS\n\n接下来我们在第二台服务器上创建一个数据库文件，如所示：\n\n```\nroot@debian7b:~# cat /etc/bind/db.test42.paul.local\n\
    ; 教学的子区域\n$TTL 8600\n$ORIGIN test42.paul.local.\n@    SOA    ns2.test42.paul.local.\
    \ root.test42.paul.local. (\n                    2014100800 ; Serial\n       \
    \                     1h; Refresh\n                            1h; Retry\n   \
    \                         2h; Expire\n                            900 ) ; Negative\
    \ Cache TTL\n; name\nIN     NS      ns2.test42.paul.local.\nIN     NS      debian7b.test42.paul.local.\n\
    ; servers\nns2         IN A       10.104.33.31\ndebian7b     IN A       10.104.33.31\n\
    root@debian7b:~#\n```\n\n第二台服务器在 named.conf.local 中也需要定义，然后重启 bind。\n\n```\nroot@debian7b:~#\
    \ cat /etc/bind/named.conf.local\n// 本地配置\n// 如果没有使用，考虑在这里添加 r1918 区域\ninclude\
    \ \"/etc/bind/zones.rfc1918\"\n\nzone \"test42.paul.local\" {\n    type master;\n\
    \    file \"/etc/bind/db.test42.paul.local\";\n    allow-update { none };\n  \
    \  allow-transfer { any };\n}\nroot@debian7b:~#\n```\n\n在父服务器上测试：\n\n```\nroot@debian7:~#\
    \ dig ns1.paul.local +short\n10.104.33.30\nroot@debian7:~# dig ns2.test42.paul.local\
    \ +short\n10.104.33.31\nroot@debian7:~# dig debian7b.test42.paul.local +short\n\
    10.104.33.31\n```\n\n## 5.4. 示例：分区域 (split-horizon)\n\n假设你想根据请求者来回答 DNS。例如，当来自\
    \ 10.104.15.0/24 (Jesse) 的用户查询 www.local A 记录时，返回 10.104.33.30；但当来自 10.104.42.0\
    \ (Keith) 的用户查询相同的记录将得到 10.104.33.31。\n\n分区域设置可以重定向到某些服务的本地。在本示例中，我们想要为两个网络（Jesse\
    \ 和 Keith）决定答案并防止他们使用我们的 DNS 服务器，同时保留解析 paul.local 的能力。\n\n我们在 named.conf.local\
    \ 中创建三个视图 (views)：\n\n```\nroot@debian7:/etc/bind# cat named.conf.local\nview\
    \ \"paul\" {\n    match-clients { 10.104.33.30; localhost; };\n    include \"\
    /etc/bind/named.zones\";\n    zone \"paul.local\" {\n        type master;\n  \
    \      file \"/etc/bind/db.paul.local\";\n        allow-update { none };\n   \
    \ } // 结束 view\n\nview \"jesse\" {\n    match-clients { 10.104.15.0/24 };\n  \
    \  zone \"paul.local\" {\n        type master;\n        file \"/etc/bind/db.paul.local.jesse\"\
    ;\n        allow-update { none };\n    } // 结束 view \n\nview \"keith\" {\n   \
    \ match-clients { 10.104.42.0/24 };\n    zone \"paul.local\" {\n        type master;\n\
    \        file \"/etc/bind/db.paul.local.keith\";\n        allow-update { none\
    \ };\n    }\n} // 结束 view\n```\n\n注意我们在 internal 区域中包含了 default-zones。必须使用视图放置所有区域。区域文件是完全相同的，除了\
    \ www 记录。你可以看到内部用户启用了轮询，来自 10.104.15.0/24 (Jesse) 的计算机将始终收到 10.104.33.30，而来自 10.104.42.0\
    \ (Keith) 的计算机将收到 10.104.33.31。\n\n```\nroot@debian7:/etc/bind# grep www db.paul.local\
    \ db.paul.local.\ndb.paul.local:www      IN A 10.104.33.30\ndb.paul.local:www\
    \      IN A 10.104.33.31\ndb.paul.local:jesse   IN A 10.104.33.30\ndb.paul.local:keith\
    \   IN A 10.104.33.31\n```\n\n## 5.5. 旧 DNS 主题\n\n本段下的所有 DNS 内容都是旧的，急需审查。\n\n\
    ### 5.5.1. 旧示例：反向 DNS\n\n1. 我们可以使用反向 DNS 区域为 DNS 服务器添加 IP 到名称解析。\n\n2. 首先向 /etc/bind/named.conf.local\
    \ 添加一个 .arpa 区域如下（我们将 notify 设置为 no 以避免向其他服务器发送通知消息）：\n\n```\nroot@ubuntu010srv:/etc/bind#\
    \ grep -A4 arpa named.conf.local\nzone \"1.168.192.in-addr.arpa\" (\n    type\
    \ master;\n    notify no;\n    file \"/etc/bind/db.192\";\n);\n```\n\n3. 同样为此反向查找区域创建一个数据库文件。\n\
    \n```\nroot@ubuntu010srv:/etc/bind# cat db.192\n;\n; BIND 用于 192.168.1.0/24 网络的反向数据文件\n\
    ;\n@ TTL 604800\n@ IN SOA ns.cobbaut.paul root.cobbaut.paul. (\n2011016 6 ; Serial\n\
    604800 ; Refresh\n86400 ; Retry\n2419200 ; Expire\n604800 ) ; Negative Cache TTL\n\
    ;\n@ IN NS ns.\n37 IN PTR ns.cobbaut.paul.\n1 IN PTR anya.cobbaut.paul.\n30 IN\
    \ PTR mac.cobbaut.paul.\nroot@ubuntu010srv:/etc/bind#\n```\n\n"
