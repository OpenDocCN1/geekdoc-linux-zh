  mdcn: "\n\n## 17.2.4. security = ads\n\n此模式将使 samba 使用 Kerberos 连接到活动目录（Active Directory）域。\n\
    \n## 17.2.5. security = server\n\n此模式已过时，它可以用于将身份验证转发到另一个服务器。\n\n## 17.3. 关于密码网络\n\
    \n之前的章节使用了 `smbpasswd` 数据库。对于域控制，我们选择了 `tdbsam` 密码后端。另一个选项是使用 LDAP。对于较大的域，使用 LDAP\
    \ 而不是不可扩展的 `tdbsam` 将从中大获益益。当你需要多于一个域控制器（Domain Controller）时，Samba 团队建议不要使用 `tdbsam`。\n\
    \n## 17.4. smb.conf 中的 [global] \n\n现在是开始在 `smb.conf` 中添加注释的好时机。首先，我们将查看 [global]\
    \ 部分中我们的域和服务器的命名，以及域控制参数。\n\n### 17.4.1. security\n\n安全模式必须为 `user`（默认值）。此模式将使\
    \ samba 控制用户账户，因此它允许 samba 充当域控制器。\n\n```\nsecurity = user\n```\n\n### 17.4.2.\
    \ os level\n\nsamba 服务器是网络中最稳定的计算机，因此它将赢得所有的浏览器选举（`os level` 高于 32）以成为浏览器主。\n\n\
    ```\nos level = 33\n```\n\n### 17.4.3. passdb backend\n\n`passdb backend` 参数将决定\
    \ samba 使用 `smbpasswd`、`tdbsam` 还是 `ldap`。\n\n```\npassdb backend = tdbsam\n```\n\
    \n### 17.4.4. preferred master\n\n将 `preferred master` 参数设置为 `yes` 将使 `nmbd` 守护进程在启动时强制选举。\n\
    \n```\npreferred master = yes\n```\n\n### 17.4.5. domain logons\n\n设置 `domain\
    \ logons` 参数将使此 samba 服务器成为域控制器。\n\n```\ndomain logins = yes\n```\n\n### 17.4.6.\
    \ domain master\n\n设置 `domain master` 参数可以导致 samba 声称拥有其工作组的域主浏览器角色。在具有活动 NT4\
    \ PDC 的工作组中不要使用此参数。\n\n```\ndomain master = yes\n```\n\n### 17.4.7. [global] 部分\n\
    \n下面的截图显示了 samba 域控制器的示例 [global] 部分。\n\n```\n[global]\n# names\nworkgroup = SPORTS\n\
    netbios name = DCSPORTS\nserver string = Sports Domain Controller\n# domain control\
    \ parameters\nsecurity = user\nos level = 13\npreferred master = Yes\ndomain master\
    \ = Yes\ndomain logons = Yes\n```\n\n## 17.5. netlogon share\n\n微软对域控制器的定义部分是它应该有一个\
    \ `netlogon` 共享。这是 `smb.conf` 中在 Samba 上创建此 `netlogon` 共享的相关部分。\n\n```\n[netlogon]\n\
    comment = Network Logon Service\npath = /srv/samba/netlogon\nadmin users = root\n\
    guest ok = Yes\nbrowsable = No\n```\n\n## 17.6. 其他 [share] 部分\n\n我们创建了一些文件共享部分来测试\
    \ samba 服务器。用户可以访问所有常规体育文件共享，但只有组成员可以访问他们自己的体育共享。\n\n```\n[sports]\ncomment =\
    \ Information about all sports\npath = /srv/samba/sports\nvalid users = @ntsports\n\
    read only = No\n```\n\n```\n[tennis]\ncomment = Information about tennis\npath\
    \ = /srv/samba/tennis\nvalid users = @tennis\nread only = No\n```\n\n```\n[football]\n\
    comment = Information about football\npath = /srv/samba/football\nvalid users\
    \ = @ntfootball\nread only = No\n```\n\n## 17.7. 用户与组\n\n为了能够在 samba 域控制器器用户和组，我们首先在\
    \ Linux 计算机上设置一些组。\n\n```\n[root@RHEL52 samba]# groupadd ntadmins\n[root@RHEL52\
    \ samba]# groupadd ntports\n[root@RHEL52 samba]# groupadd ntfootball\n[root@RHEL52\
    \ samba]# groupadd nisis\n[root@RHEL52 samba]# groupadd Administrator\n[root@RHEL52\
    \ samba]# groupadd ten\n```\n\n在在 samba 域控制器中使用用户和组时，我们可以通过以下操作让能够向域中添加组信息。\n\n\
    ```\n[root@RHEL52 samba]# groupadd ntadmins\n[root@RHEL52 samba]# groupadd ntports\n\
    [root@RHEL52 samba]# groupadd ntfootball\n[root@RHEL52 samba]# groupadd nisis\n\
    [root@RHEL52 samba]# groupadd Administrator\n[root@RHEL52 samba]# groupadd ten\n\
    ```\n（注：此处原文似乎存在部分文本重复或乱码，译文已根据逻辑进行了对齐处理）\n\n## 17.8. tdbsam\n\n我们必须使用 `smpasswd`\
    \ 工具让 samba 知道这些用户。当你添加第一个用户到 `tdbsam` 时，`/etc/samba/passdb` 将创建。\n\n```\n[root@RHEL52\
    \ samba]# smpasswd -a root\n```\n\n## 17.9. 关于计算机账户\n\n始终通过在 `tdbsam` 中验证用户和密码是安全的。\n\
    \n```\n\nroot@RHEL52 samba]# smpasswd -a root\n输入密码:\n再次输入密码:\ntdbsam_open: Converting\
    \ version 0 database to 3.\n\n\n添加其他用户时输出较少，因为 `tdbsam` 已经创建。\n\n```\n[root@RHEL52\
    \ samba]# smpasswd -a root\n输入密码:\n再次输入密码:\n添加了用户 root.\n```\n\n每台 NT 计算机（Windows\
    \ NT、2000、XP、Vista）都可以成为域成员。每台计算机在域中都有自己的账户，就像用户一样。该账户用于计算机连接域时进行身份验证。\n\n要将计算机加入域，你需要为它创建一个计算机账户。你可以使用\
    \ `netdom` 命令来实现：\n\n```bash\nnetdom join computer_name /domain:domainname\n```\n\
    \n你需要提供具有加入计算机权限的用户凭据。\n\n一旦计算机计算机账户，你可以使用标准的 Windows 工具或命令行将计算机加入域。\n\n为了让 samba\
    \ 与计算机账户工作，你需要在 `smb.conf` 的 [global] 部分设置 `machine accounts` 参数。\n\n```\n[global]\n\
    machine accounts = $\n```\n\n计算机加入域后，将能够与域控制器进行身份验证并访问域资源。\n\n## 17.10. 本地配置文件\n\
    \n对于某些用户，你可能不想使用漫游配置文件。相反，你可能希望他们在每台机器上使用本地配置文件。为了实现这一点，你可以在用户的 samba 部分中使用 `home\
    \ directory` 参数。\n\n```\n[username]\nhome directory = /home/%u\n```\n\n这将告诉 samba\
    \ 在本地机器上查找用户的主目录。\n\n## 17.11. NTFS 中的组\n\n我们在 Unix 上有用户，在 Unix 上有包含这些用户的组。\n\n\
