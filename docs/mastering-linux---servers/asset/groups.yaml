    ## 第 1 章 apache web 服务器


    在本章中，我们将学习如何使用 **apache** 软件搭建 Web 服务器。


    根据 NetCraft (http://news.netcraft.com/archives/web_server_survey.html) 的数据，大约有
    70% 的 Web 服务器运行在 Apache 上。该名称源于一个**补丁斑斑的（patchy）Web 服务器，因为人们为 NCSA httpd 服务器编写了大量的补丁（patches）。


    后续章节将把此 Web 服务器扩展为 LAMP 堆栈（Linux, Apache, Mysql, Perl/PHP/Python）。


