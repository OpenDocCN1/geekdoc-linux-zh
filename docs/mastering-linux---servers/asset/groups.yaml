    # 9.7. practice: introduction to samba


    - 0. Make sure you know your student number, anything *ANYTHING* you name must
    include your student number!

    - 1. Verify that you can logon to a Linux/Unix computer. Write down the name and
    ip address of this computer.

    - 2. Do the same for all the other (virtual) machines available to you.

    - 3. Verify networking by pinging the computer, edit the appropriate hosts files
    so you can use names. Test the names by pinging them.

    - 4. Make sure Samba is installed, write down the version of Samba.

    - 5. Open the Official Samba-3 howto pdf file that is installed on your computer.
    How many A4 pages is this file? Then look at the same pdf on samba.org, it is
    updated regularly.

    - 6. Stop the Samba server.


    # Chapter 10. getting started with samba


    ## 10.1. /etc/samba/smbd.conf


    ### 10.1.1. smbd -b


    Samba configuration is done in the smb.conf file. The file can be edited manually,
    or you can use a web based interface like webmin to manage it. The file is usually
    located in /etc/samba. You can find the exact location with smbd -b.


    ```

    [root@RHEL4 ~]# ls smbd -b | grep CONFIGFILE

    CONFIGFILE:/etc/samba/smbd.conf

    ```


    ### 10.1.2. the default smb.conf


    The default smb.conf file contains a list of examples with explanations.


    ```

    [paul@RHEL4 ~]# ls -l /etc/samba/smbd.conf

    -rw-r--r-- 1 root 10386 May 30 23:08 /etc/samba/smbd.conf

    ```


    On Ubuntu and Debian, smb.conf is packed with samples and explanations.


    ```

    [paul@laika:~]# ls -l /etc/samba/smbd.conf

    -rw-r--r-- 1 root 10515 2007-05-24 00:21 /etc/samba/smbd.conf

    ```


    ### 10.1.3. minimal smbd.conf


    Below is an example of a very minimalistic smbd.conf. It allows samba to talk,
    and to be visible to other computers (Microsoft shows computers in Network Neighborhood
    or My Network Places).


    ```

    [paul@RHEL4 ~]# cat /etc/samba/smbd.conf

    [global]

    group = WORKGROUP

    [firstshare]

    path = /srv/samba/public

    ```


    ### 10.1.4. net view


    Below is a screenshot of the net view command on Microsoft Windows Server 2003
    sp2. It shows how a Red Enterprise Linux 5.3 and a Ubuntu 9.04 Samba server, both
    with a minimalistic smbd.conf, are visible to Microsoft computers nearby.


    ![](img/1d499a6177836f6f088a9e2a53e11a14_153_0.png)


    ### 10.1.5. long lines in smbd.conf


    Some parameters in smbd.conf can contain a list of values behind them. You can
    continue a line (for clarity) on the next by ending the line with a backslash
    \


    ```

    valid users = Serena, Venus, Lindsay \

    ```


    ### 10.1.6. smb.conf


    Curious but true: smb.conf accepts synonyms like create mode and create mask,
    and (sometimes) missing errors can be browsable and browseable. On an occasion
    you can switch words, the guest only parameter is identical to only guest. Writable
    = yes is the same as the readonly = no.


    ### 10.1.7. man smb.conf


    You can access a lot of documentation when man smb.conf.


    ```

    [root@RHEL4b samba]# apropos samba

    cupsaddmb -8 export printers for samba for windows clients

    imhosts -5 The Samba NetBIOS file

    net -8 for administration of Samba and remote CIFS servers

    -8 manage the SAM database (Database of Samba Users)

    pdbdeit -7 Windows Samba/CIFS server for UNIX

    samba -5 smb.conf The configuration file for the Samba suite

    smbpasswd -5 Samba user and password file

    smbstatus -8 report on current Samba connections

    swat -8 Samba Tool for backing up .tdb files

    [root@RHEL4b samba]#

    ```


    ## 10.2. /usr/bin/testpar


    ### 10.2.1. syntax check smb.conf


    To verify the syntax of smb.conf file, you can use testpar.


    ```

    [paul@RHEL4b]$ testpar

    Load smb config files from /etc/samba/smbd.conf

    Processing section "[firstshare]"

    Loaded services OK.

    Server role: ROLE_STANDONE

    Press enter to see dump of service definitions

    ```


    ### 10.2.2. testpar -v


    An interesting option is testpar -v, which will output all the global options
    with their default value.


    ```

    [root@RHEL4b]# testpar -v |

    Load smb config files from /etc/samba/smbd.conf

    Processing section "[pub]"

    Processing section "[global]"

    Loaded services OK.

    Server role: ROLE_STANDONE

    Press enter to see dump of service definitions

    ```


    ```

    [global]

    dos charset = CP85

    unix charset = UTF-8

    display charset = LOCALE

    workgroup = WORK

    ```


    ```

    realm =

    netbios name =

    netbios scope =

    server string = Samba 3.0.2

    ```


    There are around 350 default values for smb parameters in Samba 3.0.x. This number
    grew to almost 400 in Samba 3.5.x.


    ### 10.2.3. testpar -s


    The samba daemons are constantly checking the smb.conf file, so it is good practice
    to keep this file. But it is also good practice to document your samba configuration,
    and to explicitly set options that have the default values. The testpar -s option
    allows you to do both. It will output the smallest possible configuration, while
    retaining your settings. The idea is to have your samba configuration in another
    file (like smb.conf) and let testpar parse this for you. Here below shows you
    the first smb.conf file with the set option workgroup to WORKGROUP.


    ```

    @root@RHEL4b samba)# cat smb.conf.full

    [global]

    workgroup = WORKGROUP


    # is a demo of documented smb.conf

    # These two lines are removed by testpar -s


    server string = Public Server

    ```


    Next, we execute with the -s option, and redirect stdout to the real smb.conf
    file.


    ```

    @root@RHEL4b samba)# testpar -s smb.conf.full > smb.conf

    Load smb config files from smb.conf.full

    Processing section "[firstshare]"

    Loaded services file OK.

    [firstshare]

    path = /srv/samba/public

    [root@RHEL4b samba)# cat smb.conf

    [global]

    server string = Public Server


    [firstshare]

    path = /srv/samba/public

    [root@RHEL4b samba)#

    ```


    And below is the end result. The two comments and the default option are no longer
    there.


