    \ the change:\n\n```\nroot@debian:-# grep -A2 'forwarders {' /etc/bind/named.conf.options\n\
    forwarders {\n    0.0.0.0;\n};\n```\n\nchanging:\n\n```\nroot@debian:-# vi /etc/bind/named.conf\n\
    ```\n\nAfter the change:\n\n```\nroot@debian:-# grep -A2 'forwarders {' /etc/bind/named.conf.options\n\
    forwarders {\n    8.8.8.8;\n};\n```\n\nRestart the server:\n\n```\nroot@debian:-#\
    \ service bind restart\n```\n\n6. Explain the purpose of adding a forwarder. What\
    \ is our server doing when it receives a query?\n\n```\nroot@debian:-# nslookup\n\
    > linux-training.be\nServer: 104.33.30\nAddress: 104.33.30\n\nNon-authoritative\
    \ answer:\nName: linux-training.be\nAddress: 188.93.155.87\n```\n\nThis is the\
    \ output of nslookup executing the above query for linux-training.be.\n\n```\n\
    root@debian:-# tcpdump udp port 53\ntcpdump: verbose suppressed, use -v or -vv\
    \ for full decode listening on eth0, capture size 65535 bytes\n```\n\nYou should\
    \ find the following lines in output of tcpdump:\n\n```\n14.33.30 > google-public-dns.com.domain:\
    \ A? linux-training.be (46)\n```\n\n## 4.14. introduction to DNS\n\nBelow is an\
    \ (old) wireshark-style screenshot that can help, you should see something similar\
    \ but different addresses.\n\n| No. | Time | Source | Destination | Protocol |\
    \ Info |\n|---|---|---|---|---|\n| 278 | 13.7425 | 192.168.1.3 | 192.168.1.1 |\
    \ DNS | Standard query A |\n| 285 | 13.75925 | 192.168.1.1 | 192.168.1.3 | DNS\
    \ | Standard query response A |\n\n* Frame 278 (81 bytes)\n* Ethernet II, Src:\
    \ 8c:7b:9d:d6:f2, Dst: 8c:7b:9d:d6:f2\n* Internet Protocol, Src: 192.168.1.37\
    \ (192.168.1.37), Dst: 192.168.1.1 (192.168.1.1)\n* User Domain Protocol, Src\
    \ Port: 44677 (44667), Dst Port: domain (53)\n* Domain Name System (query)\n \
    \   * Transaction ID: 0xb100\n    * Flags: 0x0000 (Standard query)\n    * Answer:\
    \ 0\n    * Authority RRs: 0\n    * Additional RRs: 1\n    * Queries\n        *\
    \ type: A, class IN\n* Additional records\n\n7. What happens when you query for\
    \ your domain name more than once?\n\n8. Why does it say \"non-authoritative answer\"\
    ? When is a dns server authoritative?\n\n9. You can also use **dig** instead of\
    \ nslookup.\n\n```\nroot@debian:-# $ dig @104.33.30 linux-training.be +short\n\
    188.93.155.87\nroot@debian:-#\n```\n\n10. How can avoid having to set the server\
    \ in dig or nslookup?\n\nChange this:\n\n```\nroot@debian:-# cat /etc/resolv.conf\n\
    nameserver 10.46.101.1\nroot@debian:-#\n```\n\n11. When you use **dig** for the\
    \ first time for a domain, where is the answer coming from? The second time? How\
    \ can you tell?\n\n## 4.14. example: primary authoritative server\n\n1. Instead\
    \ of caching the information from other servers, we will now make our server authoritative\
    \ for our domain.\n\n2. I choose the top level domain **local** and the domain\
    \ **paul.local** and put the information in /etc/bind/named.conf.local.\n\n```\n\
    root@debian7:~# cat /etc/bind/named.conf.local\n//\n// Do any local configuration\
    \ here\n//\n// Consider adding the 1918 zones here, if they are not used in your\n\
    // organization\n// include \"/etc/bind/zones.rfc1918\";\n\nzone \"paul.local\"\
    \ IN {\n    type master;\n    file \"/etc/bind/db.paul.local\";\n    allow-update\
    \ { none };\n};\n```\n\n3. Also add a zone database file, similar to this one\
    \ (add some A Records for testing). The **Refresh** and **Retry** values are not\
    \ too high so you can sniff traffic (this example makes the slave server contact\
    \ the master every hour).\n\n```\nroot@debian7:~# cat /etc/bind/db.paul.local\n\
    ; zone for classroom teaching\n$TTL    86400      debianpaul.paul.local.root.paul.local\
    \ (\n8       IN      ; Serial\n                       20140101\n             \
    \          1h              ; Refresh\n                       1h              ;\
    \ Retry\n                       2h              ; Expire\n                   \
    \    900             ; Negative Cache TTL\n);\n; name servers\n        IN    \
    \  NS      \nsl1\n        IN      NS      debianpaul\n        IN      NS     \
    \ debian7\n;\n; servers\ndebianpaul   IN      A               10.104.33.30\ndebianpaul\
    \   IN      A               10.104.33.30\ndebian7       IN      A            \
    \   10.104.33.30\nnsl1         IN      A               10.104.33.30\nwww     \
    \     IN      A               10.104.33.30\nroot@debian7:~#\n```\n\nNote that\
    \ the **www** record is commented out, so it will not resolve.\n"
  mdcn: "\n\n## 4.11. 正向查找区域示例\n\n在 `/etc/bind/named.conf.local` 中设置区域的方法是创建一个指向另一个文件的引区域条目（该另一个文件包含区域数据库）。\n\
    \n以下是 `/etc/bind/named.conf.local` 中每种配置的示例：\n\n```\nroot@debian:-# cat /etc/bind/named.conf.local\n\
    //\n// 在此处进行本地配置\n//\n// 如果你的组织中没有使用 1918 区域，\n// 请在此处添加它们\n// include \"/etc/bind/zones.rfc1918\"\
    ;\n\nzone \"paul.local\" IN {\n    type master;\n    file \"/etc/bind/db.paul.local\"\
    ;\n    allow-update { none };\n}\nroot@debian:-#\n```\n\n要创建一个区域，简单的方法是复制现有的区域文件（这比从头开始写要简单）。\n\
    \n```\nroot@debian:/etc/bind# cp db.empty db.paul.local\nroot@debian:/etc/bind#\
    \ vi db.paul.local\n```\n\n这是一个区域文件的示例。\n\n```\nroot@debian:/etc/bind# cat db.paul.local\n\
    ; 课堂教学区域\nTTL 86400 SOA debian.paul.local. root.paul.local (\n    2014100100 ;\
    \ Serial\n    1h ; Refresh\n    1h ; Retry\n    2h ; Expire\n    86400 ) Negative\
    \ Cache TTL\n\n; 名字服务器\n    IN NS nsl\n    IN NS debianpaul\n    IN NS debian7\n\
    \n; 服务器\ndebian IN A 10.104.33.30\ndebianpaul IN A 10.104.33.30\ndebian7 IN A\
    \ 10.104.33.30\nnsl IN A 10.104.33.30\nwww IN A 10.104.33.30\n```\n\n## 4.12.\
    \ 示例：仅作为缓存的 DNS 服务器\n\n1.  在 Debian 上安装 DNS 软件\n\n```\nroot@debian7:-# aptitude\
    \ update aptitude upgrade\n...\nroot@debian7:-# aptitude install bind9\n...\n\
    root@debian7:-# dpkg -l | grep bind9 | tr -s ' '\nii bind9 1:9.8.4.dfsg.Pi-6+nmu2+deb7u2\
    \ amd64 Internet Name Server\nii bind9-host 1:9.8.4.dfsg.Pi-6+nmu2+deb7u2 amd64\
    \ Version of 'host' bundled...\nii bindutils 1:9.8.4.dfsg.Pi-6+nmu2+deb7u2 amd64\
    \ Utilities for BIND\nii libbind90-1:9.8.4.dfsg.Pi-6+nmu2+deb7u2 amd64 BIND9 Shared\
    \ Library...\nroot@debian7:-#\n```\n\n2.  发现配置文件。你能找到每个文件的用途吗？\n\n```\nroot@debian7:-#\
    \ ls -l /etc/bind\ntotal 52\n-rw-r--r-- 1 root 2389 Sep 20:25 bind.keys\n-rw-r--r--\
    \ 1 root 237 Sep 20:25 db.0\n-rw-r--r-- 1 root 271 Sep 20:25 db.12\n-rw-r--r--\
    \ 1 root 353 Sep 20:25 db.255\n-rw-r--r-- 1 root 270 Sep 20:25 db.empty\n-rw-r--r--\
    \ 1 root 308 Sep 20:25 db.local\n-rw-r--r-- 1 root 505 Sep 20:25 named.conf\n\
    -rw-r--r-- 1 bind 490 Sep 20:25 named.conf.default-zones\n-rw-r--r-- 1 bind 374\
    \ Oct 1 20:01 named.conf.local\n-rw------- 1 root 1124 Nov 11:14 named.conf.options\n\
    -rw------- 1 bind 77 Oct 1 11:14 rndc.conf\n-rw-r--r-- 1 root 1317 Sep 20:25 zones.rfc191\n\
    ```\n\n3.  设置仅作为缓存的 DNS 服务器。这通常是默认设置。仅缓存的服务器会为你查询名称并缓存它们。许多教程会教你如何添加转发器（forwarder），但我们首先尝试在不使用它的情况下运行！\n\
    \n这里没有转发器似乎也能正常工作。使用嗅探器，你可以发现新安装的 DNS 服务器没有使用你的本地 DNS 服务器（从 `/etc/resolv.conf`\
    \ 查看）。那么，这些信息是从哪里来的？通过嗅探 DNS 流量你可以学到些什么？\n\n4.  详细说明在没有进一步转发器的情况下，仅作为缓存的 DNS 服务器时发生了什么。这个\
    \ Wireshark 截图会有帮助，但通过自己嗅探流量你会学到更多。\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_85_0.png)\n\
    \n| No. | 时间 | 源 | 目的 | 协议信息 |\n|---|---|---|---|---|\n| 205 | 18:35:38 | 192.168.1.37\
    \ | 128.8.18.90 | DNS | Standard query A slashdot.org |\n| 210 | 18:48:13 | 192.168.1.37\
    \ | 192.168.1.37 | DNS | Standard query response |\n| 211 | 18:49:38 | 192.168.1.37\
    \ | 199.249.112.1 | DNS | Standard query A slashdot.org |\n| 212 | 18:52:28 |\
    \ 192.168.1.37 | 192.168.1.37 | DNS | Standard query response |\n\n- Transaction\
    \ ID: 0x6826\n- Flags: 0x8000 (Standard query response, No Error)\n- Questions:\
    \ 1\n- Answer RRs: 0\n- Authority RRs: 9\n- Additional RRs: 13\n- slashdot.org:\
    \ type A, CLASS IN\n- Authoritative nameserver:\n- type: NS, CLASS IN, debianpaul\n\
    - type: NS, CLASS IN, debian7\n- type: NS, CLASS IN, b2.org\n- type: NS, CLASS\
    \ IN, d0.org\n- type: NS, CLASS IN,, a0.org\n- type: NS, CLASS IN, c0.org\n- type:\
    \ DS, CLASS IN\n- type: DS, CLASS IN\n- type: RSEC, CLASS IN\n\n"
