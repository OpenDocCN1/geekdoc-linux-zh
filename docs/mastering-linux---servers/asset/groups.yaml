  - "[PAGE 24]\n\n# 4. password protected website on Debian\n\nYou can secure files\
    \ and directories in your website with a .htaccess file that refers to a .htpasswd\
    \ file. The htpasswd command can create a .htpasswd file that contains a userid\
    \ and an (encrypted) password.\n\nThis screenshot creates a user and password\
    \ for the hacker named cliff and the -e flag to create the .htpasswd file.\n\n\
    ```\nroot@debian7:~# htpasswd -c /var/www/.htpasswd cliff\nNew password:\nRe-type\
    \ new password:\nAdding password for user cliff\nroot@debian7:~# cat /var/www/.htpasswd\n\
    cliff:$apr1$vuuj10lLk$SZ49q0swXh93P0QPVP.\n```\n\nBoth Cliff and Rob chose the\
    \ same password (hunter2), but that this shows how to add a second user and password\
    \ to .htpasswd.\n\n```\nroot@debian7:~# htpasswd /var/www/.htpasswd rob\nNew password:\n\
    Re-type new password:\nAdding password for user rob\nroot@debian7:~# cat /var/www/.htpasswd\n\
    cliff:$apr1$vuuj10lLk$SZ49q0swXh93P0QPVP\nrob:$apr1$5Hn1IFFTcNR1HoP.IW11/1DRQ41Q0\n\
    ```\n\nWe need to create a .htaccess file in the DocumentRoot of the website we\
    \ want to protect. This screenshot shows an example.\n\n```\nroot@debian7:~# cd\
    \ /var/www/hunter2/\nroot@debian7:/var/www/hunter2# cat .htaccess\nAuthUserFile=\"\
    Members only!\"\nAuthName\nAuthType Basic\nrequire valid-user\n```\n\nNote that\
    \ we are protecting the website on port 9000 that we created earlier.\n\nAnd because\
    \ we put the website in the Hackerspace named hunter2 in a subdirectory of the\
    \ default website, we will need to adjust the AllowOverride parameter in /etc/apache2/sites-available/default/default\
    \ as this screenshot shows (with line numbers on Debian 7, your may vary).\n\n\
    ```\n<Directory /var/www//\n    Options Indexes FollowSymLinks MultiViews\n  \
    \  AllowOverride Authconfig\n    Order allow, deny\n    allow from all\n</Directory>\n\
    ```\n\nNow restart the apache2 server and test that it works!"
  - "[PAGE 25]\n\n# # 1.5. port virtual hosts on CentOS\n\n# ## 1.5.1. default virtual\
    \ host\n\nUnlike Debian, CentOS has no virtualHost configuration file for its\
    \ default website. Instead the default configuration will throw a standard error\
    \ page when no index file can be found in the default location (/var/www/html).\n\
    \n# ## 1.5.2. three extra virtual hosts\n\nIn this scenario we create three additional\
    \ websites for three customers that share a clubhouse and to join you here. They\
    \ are a model train club Choo Choo, a chess club named Chess 42 and a hakerspace\
    \ named hunter2.\n\nOne way to put three websites on one web server, is to put\
    \ each website on a different port. This screenshot shows three newly created\
    \ virtual hosts, for each customer.\n\n```\n[root@CentOS65] ~# vi /etc/httpd/conf.d/choochoo.conf\n\
    [root@CentOS65] ~# cat /etc/httpd/conf.d/choochoo.conf\n<VirtualHost *:7000>\n\
    \  ServerAdmin webmaster@localhost\n  DocumentRoot /var/www/html/choochoo\n</VirtualHost>\n\
    [root@CentOS65] ~# vi /etc/httpd/conf.d/chessclub42.conf\n[root@CentOS65] -# cat\
    \ /etc/httpd/conf.d/chessclub42.conf\n<VirtualHost *:8000>\n  ServerAdmin webmaster@localhost\n\
    \  DocumentRoot /var/www/html/chessclub42\n</VirtualHost>\n[root@CentOS65] ~#\
    \ vi /etc/httpd/conf.d/hunter2.conf\n[root@CentOS65] -# cat /etc/httpd/conf.d/hunter2.conf\n\
    <VirtualHost *:9000>\n  ServerAdmin webmaster@localhost\n  DocumentRoot /var/www/html/hunter2\n\
    </VirtualHost>\n```\n\nNotice the difference port numbers 7000, 8000 and 9000.\
    \ Notice also that we specified a unique DocumentRoot for each website.\n\n# ##\
    \ 1.5.3. three extra ports\n\nWe need to enable these three ports on apache in\
    \ the httpd.conf file.\n\n```\n[root@CentOS65] ~# vi /etc/httpd/conf/httpd.conf\n\
    root@debian:-# grep \"Listen\" /etc/httpd/conf/httpd.conf\nListen 80\nListen 7000\n\
    Listen 8000\nListen 9000\n```"
  - "[PAGE 26]\n\n# 1.5.4. SELinux guards our ports\n\nIf we try toCentOS restart\
    \ our server, we will notice the following error:\n\n```\n[root@CentOS65 #] service\
    \ httpd restart      [ OK ]\nStopping httpd:\nStarting httpd:\n(13)Permission\
    \ denied: make_sock: could not bind to address 0.0.0.0:7000\n listening sockets\
    \ available, shutting down\n                               [FAILED]\n```\n\nThis\
    \ is due to SELinux reserving ports 7000 and 8000 for other users. We need to\
    \ tell SELinux\nwe use these ports for http traffic\n\n```\n[root@CentOS65 #]\
    \ semanage port -m -t http_port_t -p tcp 7000\n[root@CentOS65 #] semanage port\
    \ -m -t http_port_t -p tcp 8000\n[root@CentOS65 #] service mkdir /var/www/html/hunter2\n\
    Stopping httpd:\n[ OK ]\nStarting httpd:\n[ OK ]\n```\n\n# 1.5.5. three extra\
    \ websites\n\nNext we need to create three Document directories.\n\n```\n[root@CentOS65\
    \ #] mkdir /var/www/html/chochooo\n[root@CentOS65 #] mkdir /var/www/html/chessclub42\n\
    [root@CentOS65 #] mkdir /var/www/html/hunter2\n```\n\nAnd we have to put some\
    \ simple website in those directories.\n\n```\n[root@CentOS65 #] echo 'Choo Choo\
    \ model train Choo Choo' > /var/www/html/chooc/\nhoo/index.html\n[root@CentOS65\
    \ #] echo 'Welcome to chess club 42' > /var/www/html/chessclub42/\nindex.html\n\
