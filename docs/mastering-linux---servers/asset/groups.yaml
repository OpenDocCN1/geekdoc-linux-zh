    0 packages upgraded, 0 newly installed, 0 to remove and 0 not upgraded.\nNeed\
    \ to get 0 B of archives. After unpacking 0 B will be used.\n```\n\nCreate a directory\
    \ to store the certificates, and use openssl to create a self-signed certificate\
    \ that is valid for 999 days.\n\n```\nroot@debian:~# mkdir /etc/ssl/localcerts\n\
    root@debian:~# openssl req -new -x509 -days 999 -nodes -out /etc/ssl/local/\n\
    certs/apache.pem -keyout /etc/ssl/localcerts/apache.key\nGenerating a 2048-bit\
    \ RSA key\n...\nwriting new private key to '/etc/ssl/localcerts/apache.key'\n\
    You are asked to be enter information that will be incorporated\nin your certificate\
    \ request.\nWhat you are asked to enter what is called a Distinguished Name or\
    \ a DN.\nThere are a few fields that you can leave blank\nFor some fields there\
    \ will be a default value\nIf you enter ''', the field will be left blank.\n```\n\
    \nCountry Name (letter code) [AU]:BE\nState or Province Name (full name) [Some-State]:Antwerp\n\
    Local Name (eg, city): Antwerp\nOrganization Name (eg, company) [Internet Widg\
    \ Pty Ltd]:linux-training.be\nOrganization Unit Name (eg, section) []:nCommon\
    \ Name (eg.g. server FQDN or YOUR name) [:Paul\nEmail Address []\n\nA little security\
    \ never hurt anyone.\n\n```\nroot@debian:~# ls -l /etc/ssl/localcerts/\ntotal\
    \ 8\n-rw-r--r-- 1 root 1704 Sep 16 18:24: apache.key\n-rw-r--r-- 1 root 1702 Sep\
    \ 16 18:24: apache.pem\nroot@debian:~# chmod 600 /etc/ssl/localcerts/*\nroot@debian:~#\
    \ ls -l /etc/ssl/localcerts/\ntotal 8\n-rw------- 1 root 1704 Sep 16 18:24: apache.key\n\
    -rw------- 1 root 1702 Sep 16 18:24: apache.pem\n```\n\nEnable the ssl mod.\n\n\
    ```\nroot@debian:~# a2enmod ssl\nEnabling module ssl.\nSee /usr/share/doc/apache2-common/README.Debian.gz\
    \ on how to configure SSL\n create self-signed certificates.\nTo activate the\
    \ new configuration, you need to run:\nservice apache2 restart\n```\n\nCreate\
    \ the website configuration.\n\n```\nroot@debian:~# vi /etc/apache2/sites-available/chooochos\n\
    ```"
