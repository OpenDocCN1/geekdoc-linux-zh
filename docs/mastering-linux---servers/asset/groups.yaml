    Create an account on github.com. This website is a frontend for an immense git
    server over two and a half million users and almost five million projects (including
    Fedora, Linux kernel, Android, Ruby on Rails, Wine, X.org, VLC...)


    ```

    https://github.com/signup/free

    ```


    This account is free of charge, we will use it in the examples below.


    # 20.7. add your public key to github


    I prefer to use github with a public key, so it probably is a good idea that you
    also upload your public key to github.com.


    You can upload your own key via the web interface.


    ```

    https://github.com/settings/ssh

    ```


    Please do not forget to protect your private key!'
