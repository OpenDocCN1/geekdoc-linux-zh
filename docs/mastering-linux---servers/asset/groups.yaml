  - "[PAGE 104]\n\n# 5.5.2. old DNS load balancing\n\nNot as above. When you have\
    \ more one server authoritative for a zone, you can spread queries amongst all\
    \ server. One way to do this is by creating NS records for all servers that participate\
    \ in the load balancing of external queries.\n\nYou could also configure different\
    \ name servers on internal clients.\n\n# 5.5.3. old DNS notify\n\nThe original\
    \ design of DNS in rfc 1034 and rfc 1035 implemented a refresh time in the SOA\
    \ record to configure a time loop for slaves to query their master server. This\
    \ can result in a lot of useless pull requests, or in a significant lag between\
    \ updates.\n\nFor this reason dns notify (rfc 1996) was designed. The server will\
    \ now notify slaves whenever there is an update. By default this feature is activated\
    \ in bind.\n\nNotify can be disabled in this changeset:\n\n```\nzone \"1.168.192.in-addr.arpa\"\
    \ {\n  type master;\n  notify no;\n  file \"/etc/bind/db.192\";\n}\n```\n\n# 5.5.4.\
    \ old IXFR and AXFR\n\nFull zones DDNS (AXFR) are initiated when you restart the\
    \ bind server, or when you manually update the zone database file directly. With\
    \ nsupdate you can update a zone database and initiate an incremental zone transfer.\n\
    \nYou need admin for nsupdate to work.\n\n```\nroot@ubuntu010srv:/etc/bind#$ nsupdate\n\
    > server 127.0.0.1\n> update add mac4.1.linux-training.be 86400 A 192.168.1.627\n\
    > send\nupdate failed: REFUSED\n```\n\n# 5.5.5. old DNS integration with DHCP\n\
    \nSome organizations like to have all their clients in DNS. This can be cumbersome\
    \ to maintain. Luckily rfc 2136 describes integration of DHCP servers with a DNS\
    \ server. Whenever DHCP acknowledges a client ip configuration, it can notify\
    \ DNS with these clients ip-address and name. This is called dynamic-updates or\
    \ DDNS.\n\n# 5.5.6. old reverse is forward in in-addr.arpa\n\nReverse lookup is\
    \ actually implemented as a forward lookup in the in-addr.arpa domain. This domain\
    \ has 256 child domains (from 0.in-addr.arpa to 255.in-addr.arpa), with each child\
    \ domain having again 256 child domains. This twice twice to a structure of over\
    \ four billion (2 to the power 32) domains."
  - '[PAGE 105]


    # 5.5.7. old ipv6


    With rfc 3596 cam6 extensions for DNS. There is the AAAA record for ipv6 hosts
    on the network, and there is the ip6.int domain for reverse lookup (having 16
    child domains from 0.ip6.int to fip6.int, each of those having 16 child domains...and
    this 16 times.


    # 5.5.8. old DNS security: file corruption


    To mitigate file corruption on the zone files and the bind configuration files
    protect them with Unix primis take regular backups.


    # 5.5.9. old DNS security: zone transfers


    Limit zone transfers to certain ip addresses instead of any. Nevermind that ip-addresses
    can be spoofed, still use this.


    # 5.5.10. old DNS security: zone transfers, ip spoofing


    You could setup DNSSEC (which is not the easiest to maintain) and with rfc 2845(tsig?)
    and with rfc 2930(tkey, but this is open to brute force), or you could disable
    all zone transfers and use a script with ssh to copy them manually.


    # 5.5.11. old DNS security: queries


    Allow recursion only from the local network, and iterative queries from outside
    only when necessary. This can be configured on master and slave servers.


    ```

    view "internal" {

    match-clients { 192.168.42/24 }; };

    ...

    recursion yes;

    }

    view "external" {

    match-clients { any }; };

    recursion no;

    }


    ```


    Or allow only queries from the local network.


    ```

    options {

    allow-query { 192.168.42.0/24; localhost; };

    zone "cobbaut.paul" {

    allow-query { any }; };

    }


    ```


    Or allow only recursive queries from internal clients.


    ```

    options {

    allow-recursion { 192.168.42.0/24; localhost; };


    ```'
  - '[PAGE 106]


    # 5.5.12. old DNS security: chrooted bind


    Most Linux distributions allow an easy setup of bind in a chrooted environment.


    # 5.5.13. old DNS security: DNSSEC


    DNSSEC uses public/private keys to secure communications, this is described in
    rfc: 4033, 4034 and 4035.


    # 5.5.14. old DNS security: root


    Do not run bind as root. Do not run any application daemon as root.'
