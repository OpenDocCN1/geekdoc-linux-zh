    \ works. (It can be useful to add git status commands when practicing).\n\n```\n\
    $ paul@debian6~/project42$ git branch\n* master\n$ paul@debian6~/project42$ git\
    \ checkout -b newcomer\nSwitched to a new branch 'newcomer'\n$ paul@debian6~/project42$\
    \ vi questionext.sh\n$ paul@debian6~/project42$ git add questionext.sh\n$ paul@debian6~/project42$\
