  md: "\n## 2.2. installing squid\n\nThis screenshot shows how to install squid on\
    \ Debian with aptitude. Use yum if you are on Red Hat/CentOS.\n\n```\nroot@debian:~#\
    \ aptitude install squid\nThe following NEW packages will be installed:\nsquid-common(a)\
    \ squid-langpack(a)\n0 packages upgraded, 3 newly installed, 0 to remove and 0\
    \ not upgraded.\nNeed to get 1,513 kB of archives. After unpacking 4,540 kB will\
    \ be used.\nDo you want to continue? [Y/n]\n... truncated...\nSetting up squid-langpack\
    \ (20160616-1)\nSetting up squid-common (2.7.STABLE94.1)\nSetting up squid (2.7.STABLE94.1)\n\
    Creating squid spool directory structure\n2014/08/01 15:19:31 Creating Swap Directories\n\
    Restarting Squid HTTP proxy: squid.\n```\n\nsquid's main configuration file is\
    \ /etc/squid/squid.conf. The file explains every parameter in great detail.\n\n\
    ```\nroot@debian:~# wc -l /etc/squid/squid.conf\n4948 /etc/squid/squid.conf\n\
    ```\n\n## 2.3. port 3128\n\nBy default the squid proxy server will listen on port\
    \ 3128.\n\n```\nroot@debian:~# grep \"port\" /etc/squid/squid.conf\nhttp_port\
    \ 3128\nroot@debian:~#\n```\n\n## 2.4. starting and stopping\n\nYou can manage\
    \ squid with the standard service command as shown in this screenshot.\n\n```\n\
    root@debian:~# service squid start\nStarting Squid HTTP proxy: squid.\nroot@debian:~#\
    \ service squid restart\nRestarting Squid HTTP proxy: squid.\nroot@debian:~# service\
    \ squid status\nsquid is running.\nroot@debian:~# service squid stop\nStopping\
    \ Squid HTTP proxy: squid.\nroot@debian:~#\n```\n\n## 2.5. client proxy settings\n\
    \nTo enable a proxy server in Firefox or Iceweasel to Edit Preferences and configure\
    \ as shown in this screenshot (replace 192.168.1.60 with the ip address of your\
    \ proxy server).\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_42_0.png)\n\nTest\
    \ that your inner works with the proxy enabled. Also test that after a service\
    \ squid stop command on your proxy server you get a message similar to this screenshot.\n\
    \n![](img/1d499a6177836f6f088a9e2a53e11a14_42_1.png)\n\nTo enable a proxy server\
    \ with Google Chrome (or Debian Chromium) start the program from the command line\
    \ like this:\n\n```\npaul@debian7:~\\$ chromium --proxy-server='192.168.1.60:3128'\n\
    ```\n\nDisabling the proxy with **service squid stop** should result in an error\
    \ message similar to this screenshot.\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_43_0.png)\n\
    \n## 2.6. upside down images\n\nA proxy server sits between your browser and the\
    \ internet. Besides caching of internet data (the original function of a proxy\
    \ server) and besides firewall restrictions based on www content, a proxy server\
    \ is in the perfect position to allow the webpages that you visit.\n\nYou could\
    \ instance the change on a webpage (or remove certain advertisers), or we do we\
    \ in this example; change all images so they are upside down.\n\nThe server needs\
    \ command line tools to manipulate images and a perl script that uses these tools\
    \ (wget to download images locally and serve them with apache). In this example\
    \ we use imagemagick (which provides tools to convert and modify).\n\n```\nroot@debian7:~#\
    \ aptitude install imagemagick wget perl apache2\n--truncated...\noutput truncated...\n\
    root@debian7:~# dpkg -s $(which mogrify)\nimagick: /usr/bin/mogrify.6\nroot@debian7:~#\n\
    ```\n\nThe perl script that is shown in the screenshot below can be found on several\
    \ websites, I have not found the original author. It is however a very simple\
    \ script that uses wget and mogrify to download images (.jpg, .gif and .png),\
    \ flip them and store them in /var/www/\n\n```\nroot@debian7:~# cat /usr/local/bin/flip.pl\n\
    !/usr/bin/perl\n$count = 0;\n$pid = $$;\nwhile (<>) {\n\tchomp(\\$);\n\tif (\\\
    $1 =~ /\\.*\\.jpg\\)/i) {\n\t\\$url = \\$1;\n\t\tsystem(\"/usr/bin/wget\", \"\
    -q\", \"-O\", \"/var/www/images/pid-\\$count.jpg\", \"$url\");\n\t\tsystem(\"\
    /usr/bin/mogrify\", \"-flip\", \"/var/www/images/pid-\\$count.jpg\");\n\t\tprint(\"\
    http://127.0.0.1/images/pid-\\$count.jpg\\n\");\n\t}elsif (\\$1 =~ /\\.*\\.gif\\\
    )/i) {\n\t\\$url = \\$1;\n\t\tsystem(\"/usr/bin/wget\", \"-q\", \"-O\", \"/var/www/images/pid-\\\
    $count.gif\", \"$url\");\n\t\tsystem(\"/usr/bin/mogrify\", \"-flip\", \"/var/www/images/pid-\\\
    $count.gif\");\n\t\tprint(\"http://127.0.0.1/images/pid-\\$count.gif\\n\");\n\t\
    }elsif (\\$1 =~ /\\.*\\.png\\)/i) {\n\t\\$url = \\$1;\n\t\tsystem(\"/usr/bin/wget\"\
    , \"-q\", \"-O\", \"/var/www/images/pid-\\$count.png\", \"$url\");\n\t\tsystem(\"\
    /usr/bin/mogrify\", \"-flip\", \"/var/www/images/pid-\\$count.png\");\n\t\tprint(\"\
    http://127.0.0.1/images/pid-\\$count.png\\n\");\n\t}else {\n\t\tprint(\"\\n\"\
    );\n\t}\n\t\\$count++;\n}\n```\n\nChange (or add) the following line in /etc/squid/squid.conf.\n\
    \n```\nhttp_access allow localnet\nhttp_port 3128 transparent\n```\n\n## 2.7.\
    \ /var/log/squid\n\nThe standard log location for squid is `/var/log/squid`.\n\
    \nThe perl script /usr/local/bin/flip.pl uses /var/www/images and should be accessible\
    \ by both the squid server (which uses user proxy) and the apache2 webserver (which\
    \ uses www-data). Screenshot how to create this directory, set the permissions\
    \ and make the users member of the group.\n\n```\nroot@debian7:~# mkdir /var/www/images\n\
    root@debian7:~# chown www-data:-- /var/www/images\nroot@debian7:~# chmod 755 /var/www/images\n\
    root@debian7:~# usermod -aG proxy www-data\nroot@debian7:~# usermod -aG proxy\n\
    ```\n\nTest that it works after restarting squid and apache2.![](img/1d499a6177836f6f088a9e2a53e11a14_45_0.png)\n\
    \n## 2.8. access control\n\nThe default squid setup only allows localhost. To\
    \ enable access for a private network range, look for the \"INSERT YOUR RULE(S)\"\
    \ sentence in squid.conf and add two lines similar to the screenshot below.\n\n\
    ```\n# INSERT YOUR RULE(S) TO ALLOW ACCESS FROM CLIENTS\nacl company_network src\
    \ 192.168.1.0/24\nhttp_access allow company_network\n```\n\n## 2.9. testing squid\n\
    \nFirst, make sure that the running squid has access to the internet.\n\n```\n\
    root@RHEL4 ~ # wget -q http://linux-training.be/index.html\nroot@RHEL4 ~ # ls\
    \ -l index.html\n-rw-r--r-- 1 root 2269 Sep 18 13:18 index.html\n```\n\nThen configure\
    \ a browser or client to use the proxy server, or you could set the HTTP_PROXY\
    \ variable for command line programs to the proxy.\n\n```\nroot@fedora ~ # export\
    \ HTTP_PROXY=http://192.168.1.39:8080\nroot@ubuntu ~ # export http_proxy=http://192.168.1.39:8080\n\
    ```\n\nTesting a client can be done with `wget -q` to simplify the screenshot.\n\
    \n```\nroot@RHEL5 ~ # wget > /resolv.conf\nroot@RHEL5 ~ # wget -q http://www.linux-training.be/index.html\n\
    root@RHEL5 ~ # ls -l index.html\n-rw-r--r-- 1 root 2269 Sep 18 20:08 index.html\n\
    ```\n\n## 2.10. name resolution\n\nYou need name resolution on the squid, but\
    \ you do not need name resolution on the clients.\n\n```\npaul@RHEL5 ~ $ wget\
    \ http://grep.be\n--14:35:44--... grep.be\nResolving grep.be... failed: Temporary\
    \ failure in name resolution.\npaul@RHEL5 ~ $ export http_proxy=http://192.168.1.39:8080\n\
    paul@RHEL5 ~ $ wget http://grep.be\n--14:35:49-- http://grep.be/\n```\n\n## introduction\
    \ to squid\n\nConnecting to 192.168.1.39:8080... connected.\nProxy request sent,\
    \ awaiting response... 200 OK\nLength: 5390 (5.3K) [text/html]\nSaving to: 'index.html.1'\n\
    \n```\n100%[=================>] 5,390 .-K/s  in 0.1s\n\n14:38:29 (54.8 KB/s) \
    \ - 'index.html' saved [5390/5390]\n\n[paul@RHEL5 ~]$\n```\n\n## Part II. mysql\
