  - "[PAGE 254]\n\n# # Appendix A. cloning\n\n# ## A.1. About cloning\n\nYou can have\
    \ distinct goals for cloning a server. For instance a clone can be a cold iron\
    \ backup system used for manual disaster recovery of a service. Or a clone can\
    \ be created to serve in a test environment. Or you might want to make an almost\
    \ identical server. Let's take a look at some offline and online ways to create\
    \ a clone of a Linux server.\n\n# ## A.2. About offline cloning\n\nThe offline\
    \ cloning is used when you power off the running Linux server to create the clone.\
    \ This method is easy so we don't have to open files and we don't have to skip\
    \ virtual file systems like /dev or /sys . The offline cloning method can be broken\
    \ down into these steps:\n\n+   1. Boot source and target server with a bootable\
    \ CD\n2. Partition, format and mount volumes on the target server\n3. Copy files/partitions\
    \ from source to target over the network\n\nThe first trial is trivial. The second\
    \ is explained in the Disk Management chapter. For the third step, we can use\
    \ a combination of ssh or netcat with cp, dd, dump and restore-tar, cpio, rsync\
    \ or even cat.\n\n# ## A.3. Offline cloning example\n\n```\n[root@RHEL5 ~]# We\
    \ are working a Red Hat Enterprise Linux 5 server, and we want a perfect copy\
    \ of it on newer hardware. First thing to do is discover the disk layout\n```\n\
    Filesystem      Size  Avail  Use%  Mounted on\n/dev/sda2        15G   4.9G   \
    \ 9.3G   33% \n/dev/sda1         91M    64M   33%   /boot\n```\n```\n\nThe /boot\
    \ partition is small but big enough. If we create an identical partition, then\
    \ **dd** would be a good cloning option. Suppose the /partition needs to be erased\
    \ on the target system. The best option is to use a combination of **dump** and\
    \ **restore**. Remember that dd copies blocks, dump/restore copies files.\n\n\
    The first step is to boot the target server with a live CD and partition the target\
    \ disk. To do this we use the Red Hat Enterprise Linux 5 install CD. At the CD\
    \ boot prompt we type \"linux rescue\". The CD boots into a root console where\
    \ we can fdisk to discover and prepare the attached disks.\n\nWhen the partitions\
    \ are created and have their filesystem, then we can use dd to copy the /boot\
    \ partition.\n\n![](img/1d499a6177836f6f088a9e2a53e11a14_254_0.png)"
