    # 1.1.5. index on CentOS


    CentOS does not provide a standard index.html or index.php file. A simple wget
    gives an error.


    ```

    [root@centos65 ~]# wget 127.0.0.1

    --2014-05-06 15:10:22-- http://127.0.0.1/

    Connecting to 127.0.0.1:80-- connected.

    HTTP request sent, awaiting response... 403 Forbidden

    2014-05-06 15:10:22 ERROR 403: Forbidden.

    ```


    Instead when visiting the ip-address of your server in a browser you get a noindex.html
    page. You can verify using this wget.


    ```

    [root@centos65 ~]# wget 127.0.0.1/error/noindex.html

    --2014-05-06 15:16:05-- http://127.0.0.1/error/noindex.html

    Connecting to 127.0.0.1:80-- connected.

    HTTP request sent, awaiting response... 200 OK

    Length: 503 (4.9K) [text/html]

    Saving to: "noindex.html"

    ```


    ```

    ===================================================> 5,039      --K/s    in os

    ```


    ```

    2014-05-06 15:16:05      (289 MB/s) --"noindex.html" saved [5039/5039]

    ```


    ```

    [root@centos65 ~]# file noindex.html

    noindex.html: HTML document text

    [root@centos65 ~]#

    ```


    Any custom index file in /var/www/html will immediately serve as an index for
    this web server.


    ```

    [root@centos65 ~]# echo ''Welcome to my website'' > /var/www/html/index.html

    [root@centos65 ~]# wget http://127.0.0.1

    --2014-05-06 15:19:14-- http://127.0.0.1/

    Connecting to 127.0.0.1:80-- connected.

    HTTP request sent, awaiting response... 200 OK

    Length: 22 [text/html]

    Saving to: "index.html"

    ```


