    | 21.14. 6to4 gateways | 242 |\n| 21.15. ping6 and dns | 242 |\n| 21.16. ipv6\
    \ and tcp/ip | 242 |\n| 21.17. ipv6 PTR record | 242 |\n| 21.18. 6to4 setup on\
    \ Linux | 242 |\n\n# 21. Introduction to ipv6\n\n### 21.1. about ipv6\n\nipv6\
    \ 协议旨在替换 ipv4。ipv4 支持最多几十亿地址，而 ipv6 将其扩展到几十亿倍。对于地球来说，这足够了，即使每个手机、每台机器都获得一个地址。\n\
    \n从技术上讲，ipv6 使用 128 位地址（而不是 ipv4 的 32 位）。128 位地址是巨大的数字。在十进制下它看起来像这样：\n\n```\n\
    fe80:0000:0000:27ff:fe8e\n```\n\n幸运的是，ipv6 允许我们省略导零。上面的地址可以变为：\n\n```\nfe80:0:0:27ff:fe8e\n\
    ```\n\n当一个 16 位块为零时，可以写为 ::。连续的 16 位块为零也可以写为 ::。上面的地址可以缩短为：\n\n```\nfe80::a00:27ff:fe8e\n\
    ```\n\n这种 :: 只能出现一次！以下不是有效的 ipv6 地址：\n\n```\nfe80::2e4f:39ac\n```\n\nipv6 地址是\
    \ 0000:0000:0000:0000:0000:0000:0001，可以缩写为 ::1。\n\n```\npaul@debian5:~ /github/images$\
    \ /sbin/ifconfig | grep inet6\ninet6 addr: ::1/128 Scope:Host\n```\n\n### 21.2.\
    \ network address and host id\n\nipv4 和 ipv6 的相似之处之一是地址都有主机部分和由子网掩码确定的网络部分。使用\
    \ CIDR 表示法像这样：\n\n```\nfe80::a00:27ff:fe8e:8aa/64\n```\n\n上面的地址有 64 位主机 ID，理论上允许几十亿个主机。\n\
    \nlocalhost 地址像这样：\n\n```\n::1/128\n```\n\n### 21.3. host part generation\n\n\
    自动生成的（无状态）ipv6 地址的主机部分包含 MAC 地址的一部分：\n\n```\npaul@debian5:~ $ /sbin/ifconfig |\
    \ head -3\neth3 Link encap:Ethernet HWaddr 00:27:27:ab:67:30\ninet addr:192.168.1.29\
    \ Bcast:192.168.1.255 Mask:255.255.255.0\ninet6 addr: fe80::0000:27ff:feab:6730/64\
    \ Scope:Link\n```\n\n有些人对隐私表示担心……\n\n### 21.4. ipv4 mapped ipv6 address\n\n某些应用程序使用嵌入在\
    \ ipv6 地址中的 ipv4 地址。（是的，将有一个 ipv4 和 ipv6 并使用的迁移时代。）此时 ipv6 地址看起来像这样：\n\n```\n\
    ::ffff:192.168.1.42/96\n```\n\n确实是十进制和十六进制字符的混合……\n\n### 21.5. link local addresses\n\
    \n以 fe8:: 开头的 ipv6 地址只能在本地段使用（将点替换为十六进制数字）。这就是为什么你在截图中将该地址标记为 Scope:Link。该地址仅用于本地链路。\n\
    \n```\npaul@debian503:~$ /sbin/ifconfig | grep inet6\ninet6 addr: fe80::a12:27ff:fe8e:aaa8/64\
    \ Scope:Link\ninet6 addr: ::1/128 Scope:Host\n```\n\n这些链路本地地址都以 fe8 开头。\n\n每个\
    \ ipv6 都不会在这个范围内获得地址。\n\n### 21.6. unique local addresses\n\n现在已过时的 site local\
    \ 地址类似于 ipv4 的私有范围，被一套全局唯一的本地 ipv6 地址系统所取代。这样做是为了防止在 site local 范围内加入网络时出现重复。\n\
    \n所有唯一本地地址都以 fd:: 开始。\n\n### 21.7. globally unique unicast addresses\n\n由于 ipv6\
    \ 设计为每个接口有多个地址，因此全局 ipv6 地址可以与链路本地地址一起使用。\n\n这些全局唯一的地址以 2... 或 3... 作为前 16 位开头。\n\
    \n### 21.8. 6to4\n\n6to4 在 RFC 2893 和 3056 中定义为通过 ipv6 隧道在 ipv4 和 ipv6 之间进行过渡的一种可能方法。\n\
    \n它将 ipv4 地址编码在以 2002 开头的 ipv6 地址中。例如，192.168.1.42/24 将被编码为：\n\n"
