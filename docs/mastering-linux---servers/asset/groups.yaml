    ## 19.16. security context


    The combination of identity, role and domain or type make the selinux security
    context.

    The **id** will show you the security context in the form identity:role:domain.


    ```

    paul@RHEL5 ~# id | cut -d'' '' -f4

    context=user_u:system_r:unconfined_t

    ```


    The **ls -z** command shows the security context for a file in the form identity:type.


    ```

    paul@RHEL5 ~# ls -z test

    -rw-rw-r-- paul paul user_u:object_r:user_home_t test

    ```


    The security context of processes in /proc defines both the type (of the file
    in /proc) and the domain (of the running process). Let''s take a look at the init
    process and /proc/1


    The init process runs in domain **init_t**.


    ```

    root@RHEL5 ~# ps -ZC init

    LABEL                 PID TTY TIME CMD

    system_u:system_r:init_t  1    00:00:01 init

    ```


    The **/proc/1/** directory, which identifies the domain of the **init** process
    and has type **init_t**.


    ```

    paul@RHEL5 ~# ls -ld /proc/1/

    -dr-xr-xr-x root root system_u:system_r:init_t      /proc/1/

    ```


    It is not a coincidence that the domain of the **init** process and the type of
    **/proc/1/** are both **init_t**.


    Don''t try to use chcon on /proc/1. It will not work.


    ## 19.17. transition


    An selinux transition (aka as selinux labelling) determines the security context
    that will be assigned. A transition of process domains is used when you execute
    a process. A transition of file type happens when you create a file.


    An example of file type transition.


    ```

    pol@centos65 ~# touch test /tmp/test

    pol@centos65 ~# ls -z test

    -rw-rw-r-- pol pol unconfined_u:object_r:user_home_t:s0 test

    pol@centos65 ~# ls -Z /tmp/test

    -rw-rw-r-- pol pol unconfined_u:object_r:user_tmp:s0 /tmp/test

    ```


    ## 19.18. extended attributes


    Extended attributes are made by selinux to store security contexts. These attributes
    can be viewed with ls when selinux is running.


    ```

    [root@RHEL5]# ls --context

    drwx-------

    p paul user:object_r:user_home_dir_t paul

    drwxr-xr-x root root user:object_r:user_home_dir_t project42

    drwxr-xr-x root root user:object_r:user_home_dir_t project55

    [root@RHEL5]# ls -d

    drwx------paul user:object_r:user_home_dir_t paul

    drwxr-xr-x root root user:object_r:user_home_dir_t project42

    drwxr-xr-x root root user:object_r:user_home_dir_t project55

    [root@RHEL5]#

    ```


    When selinux is not running, then getattr is the tool to use.


    ```

    [root@RHEL5 etc]# getattr -m -d hosts

    # file: hosts

    security.selinux="system_u:object_r:etc:s0\000"

    ```


    ## 19.19. process security context


    A option is to use ps to see the selinux security context of processes.


    ```

    [root@RHEL5 etc]# ps -Z cmingtty

    LABEL PID TTY TIME CMD

    system_u:system_r:getty_t 2941 tty1 00:00:00 mingetty

    system_u:system_r:getty_t 2942 tty2 00:00:00 mingetty

    ```


    ## 19.20. chcon


    Use chcon to change the selinux security context.


    This example shows how to use chcon to change the type of a file.


    ```

    [root@RHEL5]# ls -z /var/www/html/test42.txt

    -rw-r--r-- root root user:object_r:httpd_sys_content_t /var/www/html/test4.txt

    [root@RHEL5]# chcon -t samba_share_t /var/www/html/test42.txt

    [root@RHEL5]# ls -z /var/www/html/test42.txt

    -rw-r--r-- root root user:object_r:samba_share_t /var/www/html/test42.txt

    ```


    Be sure to read mancon.


    ## 19.21. an example


    The Apache2 webserver is by default targeted with SELinux. The next screenshot
    shows any file created in /var/www/html will by default the httpd_sys_content_t
    type.


    ```

    [root@centos65 ~#] touch /var/www/html/test42.txt

    [root@centos65 ~#] ls -Z /var/www/html/test42.txt

    -rw-r--r-- root root unconfined-u:object_r:httpd_sys_content_t:s0 /var/www/html/test42.txt

    ```


    Files created elsewhere do not get this.


    ```

    [root@centos65 ~#] touch /root/test42.txt

    [root@centos65 ~#] ls -Z /root/test42.txt

    -rw-r--r-- root root unconfined-u:object_r:admin_home_t:s0 /root/test42.txt

    ```


    Make sure Apache2 runs.


    ```

    [root@centos65 ~#] service httpd restart

    Stopping httpd:

    [ OK ]

    Starting httpd:

    [ OK ]

    ```


    Will this work? Yes it does.


    ```

    [root@centos65 ~#] wget http://localhost/test42.txt

    --2014-04-12 20:56:47-- http://localhost/test42.txt

    Resolving localhost...127.0.0.1

    Connecting to localhost:80... connected.

    HTTP request sent, awaiting response... 200 OK

    Length: 0

    text/plain

    Saving to: "test42.txt"

    ```


    Why does this work? Because Apache2 runs in the httpd domain and the files in
    /var/www/html have httpd_sys_content_t type.


    ```

    [root@centos65 ~#] ps -Z httpd

    LABEL PID TTY TIME CMD

    unconfined_u:system_r:httpd_t:s0 1666 ? 00:00:00 httpd

    unconfined_u:system_r:httpd_t:s0 1668 ? 00:00:00 httpd

    unconfined_u:system_r:httpd_t:s0 1669 ? 00:00:00 httpd

    ```


    ## 19.22. introduction to SELINUX


    ```

    [root@centos65 ~#] chown -t samba_share_t /var/www/html/test42.txt

    [root@centos65 ~#] ls -Z /var/www/html/test42.txt

    -rw-r--r-- root unconfined_u:object_r:samba_share_t:s0 /var/www/html/test42.txt

    [root@centos65 ~#] setenforce 1

    [root@centos65 ~#] getenforce

    Enforcing

    ```


    There are two possibilities: either it works, or it fails. It works when selinux
    is in permissive mode, it fails in enforcing mode.


    ```

    [root@centos65 ~#] wget http://localhost/test42.txt

    --2014-04-12 21:05:02-- http://localhost/test42.txt

    Resolving localhost...127.0.0.1

    Connecting to localhost:80... connected.

    HTTP request sent, awaiting response... 403 Forbidden

    2014-04-12 21:05:02 ERROR 403: Forbidden.

    [root@centos65 ~#] tail -3 /var/log/audit.log

    type=SYSCALL msg=audit(13982072.804:65) arch=0000003e syscall=0 exit=-13 a0=7f5fc3d4a0
    a1=77ff53b4f0 a2=77ff53b4f0 a3=1 pid=1666 sid=500 uid=808 gid=48 euid=48 suid=48
    fsuid=48 subj=unconfined_u:system_r:httpd_t:s0 AVC msg=audit(13982072.804:65)
    avc: denied { getattr } for tid=1673 comm="http" path="/var/www/html/test42.txt"
    dev=0 ino=26324 res=unconfined_u:object_r:samba_share_t:s0 context=unconfined_u:class=file
    type=SYSCALL msg=audit(13982072.804:65) arch=0000003e syscall=0 exit=-13 a0=7f5fc3d4a0
    a1=77ff53b4f0 a2=77ff53b4f0 a3=1 pid=1666 sid=500 uid=808 gid=48 euid=48 suid=48
    fsuid=48 egid=48 sgid=48 tty=tty ses=1 comm="http" exe="/usr/sbin/httpd" subj=unconfined_u:system_r:httpd_t:s0
    key=(null)

    ```


    The log file gives you a message...


    And /var/log/messages mentions nothing of the failed download.


    ## 19.23. troubleshoot


    The log file was not very helpful, but these two packages can make your life easier.


    ```

    [root@centos65 ~#] yum -y install troubleshoot troubleshoot-server

    ```


    You need to reboot for this to work...


    So we reboot, restart the httpd server, set SELinux Enforce, and we again... it
    fails (because of SELinux).


    ```

    [root@centos65 ~#] service httpd restart

    Starting httpd:

    [FAILED]

    Starting httpd:

    [ OK ]

    [root@centos65 ~#] getenforce

    Permissive

    [root@centos65 ~#] setenforce 1

    [root@centos65 ~#] Enforcing

    [root@centos65 ~#] wget http://localhost/test42.txt

    --2014-04-12 21:44:13-- http://localhost/test42.txt

    Resolving localhost... ::1,127.0.0.1

    Connecting to localhost:80-- connected.

    HTTP request sent, awaiting response... 403 Forbidden

    2014-04-12 21:44:13 ERROR 403: Forbidden.

    ```


    /var/log is still not our best friend, but take a look at /var/log/messages.


    ```

    [root@centos65 ~#] tail -2 /var/log/messages

    Apr 12 21:44:16 centos65 troubleshoot: SELinux is preventing /usr/sbin/htpd from
    getattr access the file /var/html/test42.txt. For Complete \

    SELinux messages. run selector -1 54c1-4344-96fb-dcf969776996

    Apr 12 21:44:16 centos65 troubleshoot: SELinux is preventing /usr/sbin/htpd from
    getattr access the file /var/html/test42.txt. For Complete \

    SELinux messages. run selector -1 b2a8a8386-54c1-4344-96fb-dcf969776996

    ```

