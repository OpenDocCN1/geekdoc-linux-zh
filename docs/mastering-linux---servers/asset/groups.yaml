    \ 233\n\n# Chapter 20. git\n\nThis chapter is an introduction to using git on\
    \ the command line. The git repository is hosted by github, but you are free to\
    \ choose another server (or create your own).\n\nThere are many excellent online\
    \ tutorials for git. This list can save you one Google query:\n\n```\nhttp://gitimmersion.com/\n\
    http://git-scm.com/book\n```\n\n# 20.1. git\n\nLinus Torvalds created git back\
    \ in 2005 when Bitkeeper changed its license and the Linux kernel developers were\
    \ no longer able to use it for free.\n\ngit quickly became popular and is now\
    \ the most widely used distributed version control system in the world.\n\nGeek\
    \ and Poke demonstrates why we need version control (property of Geek and Poke\
    \ 3.0).\n\n![](img/d499a6177836f6f088a9e2a53114.png)\n\nBesides source code for\
    \ software, you can also find it on github (probably much more by the time you\
    \ are reading).\n\n# 20.2. installing git\n\nWe install git on Debian as seen\
    \ in this screenshot:\n\n```\nroot@debian64 ~]# aptitude install git\nThe following\
    \ NEW packages will be installed:\ngit libcurl libperl\n0 packages upgraded, 3\
    \ newly installed, 0 to remove.\nSetting up libcurl...\nSetting up libperl...\n\
    Setting up git...\n```\n\n# 20.3. starting a project\n\nWe create a project directory\
    \ with a simple file:\n\n```\npaul@debian64 ~]# mkdir project\npaul@debian64 ~]#\
    \ cd project\npaul@debian64 ~]# echo \"The answer is.\" > question.sh\n```\n\n\
    Then we get to create an empty git repository in this directory.\n\n```\npaul@debian64\
    \ ~]# git init\npaul@debian64 ~]# ls -la\ntotal 4\ndrwxr-xr-x 2 paul paul 4096\
    \ Oct 24 10:00 ..\nrw-r--r-- 1 paul paul 12 Oct 24 10:00 question.sh\ndrwxr-xr-x\
    \ 3 paul paul 4096 Oct 24 10:00 .git\n```\n\n# 20.3.2. config\n\nNext use git\
    \ config to set some global options.\n\n```\npaul@debian64 ~]# git config --global\
    \ user.name Paul\npaul@debian64 ~]# git config --global user.email \"paulbaud@gmail.com\"\
    \npaul@debian64 ~]# git config --global core.editor vi\n```\n\nWe can verify this\
    \ config in ~/.gitconfig:\n\n```\npaul@debian64 ~]# cat ~/.gitconfig\n[user]\n\
    name = Paul\nemail = paulbaud@gmail.com\n[core]\neditor = vi\n```\n\n# 20.3.3.\
    \ add\n\nNow time to add with git add and verify it is added with git status.\n\
    \n```\npaul@debian64 ~]# git add question.sh\npaul@debian64 ~]# git status\n#\
    \ On branch master\n# Changes to be committed:\n# use \"git rm --cached <file>...\"\
    \ to unstage\n# new file: question.sh\n```\n\nThe git status tells us there is\
    \ a new file ready to be committed.\n\n# 20.3.4. commit\n\nWith git commit you\
    \ force git to record all added files (and all changes to those files) permanently.\n\
    \n```\npaul@debian64 ~]# git commit -m \"starting a project\"\n[master 5c1768b]\
