    # 19.16. security context


    The combination of identity, role and domain or type make the selinux security
    context.

    The **id** will show you the security context in the form identity:role:domain.


    ```

    ```\paul@RHEL5 ~# id | cut -d'' '' -f4

    context=user_u:system_r:unconfined_t

    ```

    ```


    The **ls -z** command shows the security context for a file in the form identity:type.


    ```

    ```

    paul@RHEL5 ~# ls -z test

    -rw-rw-r-- paul paul user_u:object_r:user_home_t test

    ```

    ```


    The security context of processes in /proc defines both the type (of the file
    in /proc) and the domain (of the running process). Let''s take a look at the init
    process and /proc/


    The init process runs in domain **init_t**.


    ```

    ```

    root@RHEL5 ~# ps -ZC init

    LABEL                 PID TTY TIME CMD

    system_u:system_r:init_t  1    00:00:01 init

    ```

    ```


    The **/proc/1/** directory, which identifies the domain of the **init** process
    and has type **init_t**.


    ```

    ```

    paul@RHEL5 ~# ls -ld /proc/1/

    -dr-xr-xr-x root root system_u:system_r:init_t      /proc/1/

    ```

    ```


    It is not a coincidence that the domain of the **init** process and the type of
    **/proc/1/** are both **init_t**.


    Don''t try to use chchon on /proc/1. It will not work.


    # 19.17. transition


    An selinux transition (aka as selinux labelling) determines the security context
    that will be assigned. A transition of process domains is used when you execute
    a process. A transition of file type happens when you create a file.


    An example of file type transition.


    ```

    ```

    pol@centos65 ~# touch test /tmp/test

    pol@centos65 ~# ls -z test

    -rw-rw-r-- pol pol unconfined_u:object_r:user_home_t:s0 test

    pol@centos65 ~# ls -Z /tmp/test

    -rw-rw-r-- pol pol unconfined_u:object_r:user_tmp:s0 /tmp/test

    ```

    ```'
