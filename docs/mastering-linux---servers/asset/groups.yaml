    ## 第 VII 部分 selinux


    ## 19. SELinux 简介


    Security 或 SELinux 是美国国家安全局 (NSA) 开发的一系列修改，旨在为 Linux 提供多种安全策略。SELinux 于 2000 年底作为开源发布。由于内核版本
    2.6 是 Linux 的组成部分。


    SELinux 提供安全性！SELinux 可以控制用户对文件和进程的访问类型。即使文件接收了 `chmod 777`，SELinux 仍然可以阻止应用程序访问它（Unix
    文件权限首先被检查！）。SELinux 通过将用户置于代表安全上下文的角色中来实现这一点。管理员对授予角色的访问权限有非常严格的控制。

    '
