    However, if you find that the sudo command doesn''t work, you''ll need to manually
    add yourself as a sudoer. This will give you permission to use sudo. Do this by
    adding a line to a system file /etc/sudoers (sudoers is the file name in the etc
    system directory, which is important because it holds your computer''s configuration
    files):


    ```

    remy ALL=(ALL) ALL

    ```


    Swap remy out for your username. This will allow you to run everything root can
    run if you prefix your command with sudo. You can customize the control you give
    to users in /etc/sudoers, but that''s another story for another. For now, let''s
    focus on the fact that you have the first superpower to do some real damage.


    # Why not run as root all the time?


    The short answer is that it''s a bad practice, kind of like driving a tank around
    a quiet neighborhood—and no one wants that on their personal report card. Just
    because you can''t mean you should.


    That''s why most operating systems these days (like Mac and Windows) ask you to
    create your own user. The user you create doesn''t have the same permissions as
    root. (When you''re prompted for your password, it''s because under the hood,
    your OS is trying to do something that requires more permissions, similar to using
    sudo.)


    # PERMISSIONS


    Now that you know how to bulld right through permissions, it might be useful to
    know what permissions look like, what they mean, and how they function.


