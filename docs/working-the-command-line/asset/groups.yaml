    \ git:(master) \n2. bash (bash)\nMacBook-Pro-remy $ dull n (\nMacBook-Pro-remy\
    \ $PS1=\\\\[\\e[1;30m\\]\\$PPID \\\\\\e[1;30m\\]\\\\[e[0;36m\\]\\\\e[1;31m\\]\\\
    [e[1;34m\\]u@h\\[e[1;30m\\]\\\\e[0;37m\\]\\\\[SSH_TTY\\]\\\\e[0;32m\\]\\\\[e[1;30m\\\
    ]\\\\[e[1;37m\\]w\\\\[e[0;37m\\]\\\\[SHLVL\\]!\n[69342:69873:0584] 09:45:00 Jan\
    \ 06 [@remy@MacBook-Pro.local +-2] ~\n(2)$ # party time \n```\n```\n\nFIG 5.9:\
    \ Prompt overkill.\n\nIf you switched to zsh already, you're more likely to have\
    \ a sleek prompt (FIG 5.8).\nIf we break this down, what we see in this prompt\
    \ is an arrow (➜) followed by the current directory name (not the full path).\
    \ When we're in the Git repository, it says git and notes which branch is active.\n\
    \nPrompts can get fairly complicated. If they get too complicated they look like\
    \ garbage. If I set Bash custom shell (PS1) to a new value, it modifies my prompt—wow,\
    \ that's some horrible code (FIG 5.9).\n\nFortunately, much progress has been\
    \ made in the area of sharing prompts and making them slightly more readable.\
    \ Sharing prompts is important because it helps people experiment, learn, and\
    \ improve.\n\nMy general recommendation is to take a theme you like from zsh,\
    \ copy it and tweak it to make it yours. Let's say you've decided to use the robbysruss\
    \ theme and want to customize it a little. First you will need to make a copy\
    \ of it, so let's call the new my.zsh-theme and put it in the themes directory:\n\
    \n```\n$ cp ~/.oh-my-zsh/themes/robbyshell.zsh-theme ~/.oh-my-zsh/themes/my.zsh-theme\n\
    ```\n\nNow open the my.zshrc file in your favorite editor. Try not to let it bamboozle\
    \ you too much (like I did the first time I encountered it). What interests us\
    \ here is the first line, in particular the arrow (➜) character, which appears\
    \ in the file:\n\n```\nlocal ret_status=\"%(?:%{fg_bold[green]}%➜:%{fg_bold[red]}%➜)\
    \ %s\"\nPROMPT='${ret_status}%{fg_bold[green]}%p\n%%{cyan}%%c %%{fg_bold[blue]}%%$\n\
    $(git_prompt_info) %{fg_bold[blue]} %n%%{reset_color}'\n```\n\nThe variable ret_status\
    \ changes the arrow depending on whether the last command executed successfully:\
    \ a bold arrow $fg_bold[green] if so, and a bold arrow $fg_bold[red] if there\
    \ was an error. The second line sets the magic value of PROMPT, creating the prompt\
    \ you'll see.\n\nNow, let's change the arrow to a snowman (☃). (This is not necessarily\
    \ very practical, but it will do for the exercise at hand.) We'll also show the\
    \ full path, but on a line of its own, above the prompt.\n\nSwapping the arrow\
    \ for the snowman is simple, but since the emoji won't change color if we'll use\
    \ an alien agent for errors (and drop the color information). Furthermore, getting\
    \ the full path in the PROMPT value will require moving some elements around in\
    \ perfectly legitimate to put a line in the value of PROMPT, which is how we get\
    \ our multiprom:\n\n```\nlocal ret_status=\"%(?:☃:\U0001F47E) %s\"\nPROMPT='%%{cyan}%%d\n\
    ${ret_status}%{fg_bold[green]}%p\n%%{fg_bold[blue]}%%$(git_prompt_info)\n%%{fg_bold[blue]}%%\
    \ %{reset_color}'\n```\n\nNow we'll be able to see when we get a random error;\
    \ our prompt will switch to the alien until there's a successful command (FIG\
    \ 5.10).\n\n```\n/Users/remy/Dropbox/Writing/cli-book\ngit:(master) # random error\n\
    zsh: command not found: random\n/Users/remy/Dropbox/Writing/cli-book\ngit:(master)\
    \ # █\n```\n\nFIG 5.10: Huzzah. Our prompt now features a snowman when things\
    \ are okay, and an alien when the last command failed.\n\nThere's also a right-hand\
    \ prompt with zsh; this can be set using the RPROMPT value. You can do all sorts\
    \ of things with this value, add the current time (or perhaps something more creative).\n\
    \nOr let's say you want to add the current time in square brackets and in blue,\
    \ just for the heck of it. Simply add the following to your my.zsh-theme file:\n\
    \n```\nRPROMPT=\"%fg[blue]*\"\n```\n\nThe 24-hour time is represented by *, so\
    \ the final prompt is a bit of visual mess of curly braces and percent signs.\
    \ For that I apologize, but once you've got your prompt, you probably won't change\
    \ it ever.\n\nThe full list of prompt variables is listed in the zsh prompt documentation.\
    \ It's a little dry, but contains all the values you can use. If you're after\
    \ a more approachable account, you can read about my setup on my blog.\n\n# ALIASES\n\
    \nAliases are just alternatives to existing commands. To create an alias, use\
    \ the command. For instance, you might alias the command to ls -lt (a shortcut\
    \ to list all files with hidden files, so that the most recently changed files\
    \ appears at the end of the output):\n\n```\n$ alias ll='ls -ltr'\n```\n\nHowever,\
    \ running this in the shell means that you only have the alias for long as the\
    \ session lasts, and crucially, that won't work in other sessions. To make your\
    \ aliases easy to manage and add later, it is useful to create a file called .aliases\
    \ in your home directory containing all your aliases. That way you can effortlessly\
    \ use your zshrc file by adding the following line:\n\n```\nsource ~/.aliases\n\
    ```\n\nBecause this is part of zshrc file, it means that every new session will\
    \ include your aliases. Many developers have published their own, which I highly\
    \ recommend checking out; Aliases can be simple (as we've just seen), or they\
    \ can combine commands. Remember how we learned to navigate to parent directories\
    \ in Chapter 1? You can use aliases to do work much efficiently:\n\n```\nalias\
    \ ..=\"cd .\"\nalias ...=\"cd ../\"\nalias ....=\"cd ../..\"\n```\n\nThese commands\
    \ will allow you to type .. in the shell to get to the parent directory. Three\
    \ dots will take you to the parent's parent directory, and so on. Aliases are\
    \ useful for commands you may not find easy to remember. For instance, if you\
    \ can't remember the exact command to run each time you might want to clear the\
    \ DNS cache on your Mac, you can use this alias:\n\n```\nalias flush=\"dscache\
    \ -flushcache\"\n```\n\nOr for example I can never remember the series of commands\
    \ to show and hide the desktop icons on my mac, so I use two aliases to make my\
    \ life easier:\n\n```\nalias desktop=\"defaults write com.apple.finder false &&\
    \ killall Finder\"\nalias showdesktop=\"defaults write com.apple.finder true &&\
    \ killall Finder\"\n```\n\nI'd love to reel off all of my aliases right now, but\
    \ that would spoil all the fun you've have on your own. Plus, it would likely\
    \ takeoodles of pages in this book and wouldn't copy and paste very well. I will\
    \ point toward Mathias Bynes, though who has compiled an excellent repository\
    \ of dotfiles (including aliases, his shell setup, and more), where he also references\
    \ the sources that inspired him. It's well worth to spur your motivation, and\
    \ to start flexing your copy-paste muscles.\n\n# Functions\n\nAliases have one\
    \ limitation: you can't insert an argument. For instance, if you want to get the\
    \ base64 data URL for a file, you can't quite do that with an alias; you need\
    \ a function in your terminal the same way you run aliases.\n\nHere's the code\
    \ required to generate a base64 URL for any file:\n\n```\nfunction dataurl() {\n\
    \  local mimeType=$($file -b --mime-type \"$1\")\n  if [[ $mimeType == text/*\
    \ ]]; then\n    mimeType=\"${mimeType};charset=utf-8\"\n  fi\n  echo \"data:${mimeType};base64,$(openssl\
    \ base64 -in \"$1\" | tr -d '\\n')\"\n}\n```\n\nThis lets you get the data URL\
    \ for an image from the terminal:\n\n```\n$ dataurl book-cover.png\ndata:image/jpeg;base64,/9j/4AAQ5kZJRgABAQAAABAQA...\n\
    ```\n\nWe've covered a lot of ground, but now you know how to customize your terminal\
    \ to suit your personal style. You've learned about, and hopefully converted to,\
    \ Z shell and the awesome Oh My Zsh project. You'll have a few personal aliases\
    \ to make your workflow a little sleeker, and finally you'll have your very own\
    \ customized prompt—designed by you, for you.\n\n# YOUR TURN\n\nHm. All endings\
    \ are more or less arbitrary, I suppose, but I can't just close this book by showing\
    \ you how to add functions to your prompt, can I? So let me bid farewell and wish\
    \ you the best of luck with your continued journey into the void.\n\nIn these\
    \ pages, I've tried to spill a little of my knowledge into your head and have\
    \ shared my recommendations for worthwhile terminals (tabs, split windows, and\
    \ so on). You now know how to install kinda CLI utilities, and since thousands\
    \ of them're so tiny, they'll soon become your go-to programs on the single-use\
    \ programs at your disposal. The tools of the terminal, I suspect, will become\
    \ your go-to programs on the command line. I have no doubt that with time, you'll\
    \ be using these to manipulate text and commands as you see fit.\n\nAbove all,\
    \ my hope is that this book has given you enough nerve not to run away screaming\
    \ from the inevitable: \"Just open the terminal...\",\n"
