    \ the text is corrupted and repeated. I will de-duplicate the clean version.\n\
    \n[content]\n![](img/75faf7950ffd7820aef985d892b0a56e_62_0.png)\n\n# MAKING THE\
    \ SHELL\nYOUR OWN\n\nIN CHAPTER 1, I showed you how to replace your default terminal\
    \ with an alternative. The terminal is the application that runs your shell. You've\
    \ already met and used the shell—it's where you actually run commands and see\
    \ the output. The shell, irrespective of the terminal application you choose,\
    \ can have its own customizations.\n\nLet's look at some of those, now that you\
    \ have a little more experience under your belt. Although shell customization\
    \ offers only modest power-ups, I'd argue that it's quite important: customization\
    \ is what makes a thing feel like it belongs to you. Potentially, at least, there\
    \ are as many shells as there are users (FIG 5.1).\n\nTerminal customization follows\
    \ a certain hierarchy: first, there's the terminal application itself; then, within\
    \ the terminal, is the shell; inside the shell is the prompt; and finally, there\
    \ are aliases and shortcuts. We'll look at each in turn (FIG 5.2).\n\n# THE TERMINAL\n\
    \nAs I mentioned at the beginning of this book, iTerm2 is far and away my favorite\
    \ terminal emulator. Most other terminal applications, iTerm2 accepts a wealth\
    \ of customizations. Let's take a look at the preferences for my keyboard shortcuts\
    \ (FIG 5.3).\n\nAs I mentioned in Chapter 1, split windows can be quite useful.\
    \ In iTerm2, you can type cmd-d to split your terminal vertically (so you have\
    \ two terminals side by side), or cmd-shift-d for a horizontal split. Then you\
    \ can keep splitting to your heart's content. This is a feature of the application;\
    \ your mileage may vary (FIG 5.4).\n\nYou'll also find in the preferences the\
    \ theme (\"profile\") for your terminal, which allows you to customize the colors\
    \ and the font. iterm2-color-schemes is a good place to start browsing around\
    \ for themes. Some people prefer a dark theme, some prefer a light theme, others\
    \ have images in the background of their terminal, and still others use a semitransparent\
    \ background. My extra pro-user tweak is that I use a hot-pink (#d13a82) cursor\
    \ combined with a dark theme.\n\nFigure 5.1: A smattering of terminal customizations\
    \ from my Twitter followers.\n\nFigure 5.2: Areas of the terminal that can be\
    \ personalized.\n\n60 WORKING THE COMMAND LINE\n\n# Preferences\n\n# Remap Modifier\
    \ Keys\n\n| Key Combination | Action |\n| :--- | :--- |\n| ⌥⌘ | Control |\n| Left\
    \ Option (%) | Left Option |\n| Right Option (%) | Right Option |\n| Left Command\
    \ (⌘) | Left Command |\n| Right Command (⌘) | Right Command |\n\n# Key Mappings\n\
    \n| Key Combination | Action |\n| :--- | :--- |\n| ⇧⌥ | Scroll One Line Up |\n\
    | ⌥↑ | Select Split Pane |\n| ⌥↓ | Select Split Pane |\n| ⌥→ | Select Split Pane\
    \ |\n| ⌘Home | Select Split Pane |\n| ⌘End | Select Split Pane |\n| ⌥Page | Select\
    \ Split Pane |\n| ⌥Pg | Select Split Pane |\n| ⌥Down | Select Split Pane |\n\n\
    # df -kh\n\n| Filesystem | Size | Used | Avail | Capacity | used | %Used | Mounted\
    \ on |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| /dev/disks02\
    \ | 931Gi | 271Gi | 659Gi | 30% | 71191732 | 172874989 | 29% | / |\n| devfs |\
    \ 191Ki | 191Ki | 100% | 662 | 0 | 100% | /dev |\n| map -hosts | 0Bi | 0Bi | 100%\
    \ | 0 | 100% | /net |\n| map_auto_home | 0Bi | 0Bi | 100% | 0 | 100% | /home |\n\
    \n**Figure 4.6:** Running the df -kh command results in a list of available disk\
    \ space.\n\nIf your server appears to have a normal load but things are nevertheless\
    \ going very wrong, it's entirely possible you've run out of disk space. Understandably,\
    \ machines get rather weird about having no disk space.\n\nThe df -kh command\
    \ lists the available disk space on the machine (FIG 4.6). Depending on whom you\
    \ ask, the important columns to note here are Size, Used, Available, and Mounted\
    \ on. Mounted on tells you which path is the problem. In the above df, it's including\
    \ some funky virtual drives (I can see them a size of 0). I'm imagining those\
    \ values and focusing on the row mounted on :/ that's the root of your operating\
    \ system, and where all files are. I can use this information to get a sense of\
    \ how much disk space I have left (and whether I should start removing files).\
    \ \n\nYou basically learned how to completely destroy your machine. rm -rf will\
    \ blast files without prompts. sudo will let you do anything to anyone's files\
    \ or processes, and kill -9 will terminate a program in mid-execution.\n\nRumor\
    \ had it that you could do sudo kill -9 1 and it would shut down a machine in\
    \ one go. As I mentioned earlier, systems protect themselves from such stupidity\
    \ nowadays, but one can only try!\n\nYou now know some seriously dangerous moves.\
    \ But if you want to be a hero, you have a few tools to check on your system's\
    \ health, too.\n\n# Fish\n\nFish Shell is an option it includes a lot of features\
    \ by default: autocomplete, tab-completion, highlighting. I don't use Fish myself,\
    \ but I mention it here because\n\nIt's worth noting that you should be cautious\
    \ of anything that asks you to run curl -L [URL] | sh. This command effectively\
    \ runs a remote script on your local machine with the same privileges as you have.\
    \ If you're familiar with JavaScript, the equivalent would be including a remote\
    \ <script src=\"...unknown.js\"> on a web page. It could be perfectly harmless;\
    \ it could also be malicious.\n\nWait, if ease of configuration is what you need,\
    \ this is a good option.\n\n# Z shell\n\nZ shell, or zsh, has some great features—but\
    \ if you want to get the most from it, you'll also want to install My Zsh, a community-driven\
    \ framework for managing zsh. My terminal uses zsh to give me rather special prompt:\
    \ it includes the current directory, Git status, battery power, and whether I\
    \ have connection to the internet.\n\n sh is a bit more involved than Fish, but\
    \ it's certainly worth the work. To install it, you'll use Brew; while you're\
    \ at it, go ahead and install the Oh My Zsh manager, too:\n\nZ shell\n\n# Z shell\
    \ themes\n\nNow that you have zsh installed and set as your default shell, you\
    \ can select a theme and add some plugins to make the shell super awesome.\n"
