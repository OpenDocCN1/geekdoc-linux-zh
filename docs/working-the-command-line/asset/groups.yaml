    ```

    $ chmod a+r my-script

    ```


    As long as you can remember how to communicate User, Group, and Other, and Read,
    Write, and Execute, you should be able to remember the modes and flags.


    As we saw earlier, permissions can also have numerical values: 4 = read, 2 = write,
    and 1 = execute (FIG 4.3). Occasionally, when you run across chmod in a tutorial,
    you''ll see it expressed as something like chmod 110 my-script or chmod 744 my-script.
    This is the second method I alluded to, and it''s a kinda tad confusing and not
    particularly easy to remember.


    The first digit represents the user permissions, the second group and the third
    permissions of all users. To set the user permissions to read-only, make the first
    digit 4. To set the user permissions to read and write, make the first digit 6
    (i.e., 4 + 2). To make a file executable for all users, readable and writable
    for the owner, and readable for everyone, the values are 7 (4 + 2 + 1), 5 (4 +
    0 + 1) and 5:


    ```

    $ chmod 755 my-script

    ```


    It''s common to make a file readable for other users, but not writable: since
    you''re the owner of the program, you don''t want anyone else messing with it.


    # Changing ownership


    Along with changing permissions, you may also want to change the ownership of
    a file—either from yourself to another user, or from another user to yourself.
    I''ve needed to do that in the past when I''ve had more than one login for my
    machine and wanted to move a file from the other user to myself so that I could
    edit it.


    On a Mac, if the situation is simple enough, the Finder can do that for you (and
    also handle some permission changes). However, I''ve found it useful to know how
    to perform such tasks on the command line because the Finder UI isn''t always
    available, particularly when working with remote machines.'
  - '[PAGE 54]


    The command to change ownership is chown (short for, appropriately enough, “change
    ownership”), followed by the new owner’s name anna, in this case). Here’s how
    you might change the owner of a file:


    ```

    $ chown anna my-script

    ```


    You can also use chown to change all the files in a directory simultaneously by
    specifying the -R (short for “recursively”) flag:


    ```

    $ chown -R anna cli-book/

    ```


    You can explore additional flags and usages of chown on your own, but these two
    commands should be enough to get out of trouble.


    # What is a group, and when did I join one?


    Every user is automatically part of group, even if it’s a group of one. Your user
    is already part of a group. On a Mountain Lion Mac, you are part of the “staff”
    group, and, if you’re sharing your machine, so are the other users.


    If you want to add a user to the admin group, you need a special command. On a
    Mac, run:


    ```

    $ dscl . -append /Groups/admin GroupMembership remy

    ```


    Note that the group name is preceded by /Groups/. On a Linux machine, you need
    a different command entirely:


    ```

    $ useradd -G admin remy

    ```


    Groups are a good way to manage user permissions you’re collaborating with multiple
    people deploying to a server (and similar sysops ninjaofoo).'
  - '[PAGE 55]


    # PROCESSES


    A process refers to an application running on your operating system. If you use
    Sublime Text 2, for instance, there is a process called—wait for it—Sublime Text
    2.


    If you''re a Mac user, take a look at the Activity Monitor program, which lists
    the processes currently running. PC users can use the trusty Task Manager for
    the same view.


    ps (short for “process status”) is the command-line equivalent of Activity Monitor.
    Here''s what happens when I run ps on my machine right now:


    ```

    ps TTY TIME CMD

    95218 tty000 0:04.06 -zsh

    61075 tty001 0:00.21 -zsh

    77196 tty002 0:00.60 -zsh

    509 tty003 0:04.94 -zsh

    525 tty004 0:02.52 -zsh

    ```


    This output doesn''t really represent what''s happening on my machine, though.
    The list above shows five zsh (Z shell) commands. Z shell refers to my shell,
    a text-based interface that runs in my terminal, processes commands, and returns
    output. (We''ll look more closely at what the shell is, and Z shell in particular,
    in Chapter 5).


    Notice that Sublime Text doesn''t appear here, even though I''m using it right
    now to write this chapter. In fact, ps by itself only lists processes that have
    a terminal attached.


    But we want to list all processes, with the full command used and the process
    owner (which is also linked to who has permission to terminate the process, but
    on that later).


    It''s mouthful, but using the ps aux command (the order of the flags doesn''t
    matter) gives us lots of goodness. I cropped the screenshot it was re of lines
    (FIG 4.4). The output from ps becomes more manageable when you pipe the output
    into a tool like grep to search for a particular'
