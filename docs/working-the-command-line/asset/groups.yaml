    # How the heck do I run my own commands?


    In this chapter, we''ve been installing global commands. When you run global commands,
    your environment path is searched until the program to execute is found. But what
    if the program lives in your current directory rather than in your environment
    path?


    It''s an easy fix, though not obvious if you''ve never done it before. Assuming
    that your program file is executable (I''ll talk more about what that means in
    Chapter 4), simply prefix the file name with `/` , which refers to files in the
    directory you''re currently in:


    ```

    $ ./my-script

    ```


    If the file is not executable, you''ll get an error like this when you run the
    script:


    ```

    $ ./my-script

    bash: ./my-script: Permission denied

    ```


    In this case, you''ll need to use the appropriate program (or runner) in front
    of it, like so:


    ```

    $ ruby my-cool-thing.rb

    $ node my-even-cooler-thing.js

    $ php -f not-even-cool-enough-for-school.php

    $ sh my-script.sh

    ```


    The program file immediately following the prompt (ruby, node, and so forth) is
    the command; to the right of that is what you''re applying the command to (my-cool-thing.rb).
    It''s worth noting that the file-name extension is only a hint to you, the author,
    but what program is needed to run the file. In fact, there doesn''t even have
    to be an extension—so sometimes a little exploration or good old trial and error
    is required on your part.'
