    \ 命令会得到一个可用磁盘空间列表。\n\n如果你的服务器负载看起来正常，但事情仍然进展得很糟糕，完全可能是你耗尽了磁盘空间。可以理解，机器在没有磁盘空间时会变得非常奇怪。\n\
    \ndf -kh 命令列出了机器上可用的磁盘空间（图 4.6）。取决于你问谁，这里需要注意的重要列是 Size（大小）、Used（已用）、Available（可用）和\
    \ Mounted on（挂载点）。Mounted on 告诉哪个路径出了问题。在上面的 df 中，它包含了一些奇怪的虚拟驱动器（我看到它们的大小为 0）。我忽略这些值，专注于挂载在\
    \ :/ 的行：那是你操作系统的根，也是所有文件所在的地方。可以使用此信息来感知我剩余多少磁盘空间（以及我是否应该开始删除文件）。这是一个模糊但有效的指标：如果是在\
    \ 1 左右，那就还好；如果是 10 或以上，机器可能正在挣扎，某些可能出了问题。\n\n你基本上学会了如何完全摧毁你的机器。rm -rf 会在没有提示的情况下粉碎文件。sudo\
    \ 将允许你对任何人的文件或进程进行任何操作，而 kill -9 会在程序执行过程中终止它。\n\n传闻你可以执行 sudo kill -9 1 就可以一次性关闭机器。正如我之前提到的，现在的系统会保护自己免受这种愚蠢行为的影响，但只能尝试！\n\
    \n你现在知道了一些非常危险的动作。但如果你想成为英雄，你也有几个工具可以检查系统的健康状况。\n\n![](img/75faf7950ffd7820aef985d892b0a56e_62_0.png)\n\
    \n# 让 shell 属于你自己\n\n在第 1 章，我向你展示了如何用替代方案替换默认终端。终端是运行 shell 的应用程序。你已经遇到并使用了 shell——它是你实际上运行命令并查看输出的地方。无论你选择哪种终端应用程序，shell\
    \ 都可以有自己的自定义设置。\n\n既然你已经有了一些经验，让我们现在来看其中一些。虽然 shell 自定义只能提供细微的性能提升，但我认为它是非常重要的：自定义让一个东西感觉像是属于你自己的。至少可能，shell\
    \ 的数量和用户的数量一样多（图 5.1）。\n\n终端自定义遵循某种层级结构：首先是终端应用程序本身；然后，在终端内部是 shell；在 shell 内部是提示符（prompt）；最后是别名（aliases）和快捷方式。我们将逐一查看（图\
    \ 5.2）。\n\n# 终端\n\n正如我在书开头提到的，iTerm2 是我最喜欢的终端模拟器。与大多数其他终端应用程序相比，iTerm2 接受大量的自定义。让我们看看我键盘快捷键的偏设置（图\
    \ 5.3）。\n\n正如我在第 1 章中提到的，分屏窗口非常有用。在 iTerm2 中，你可以输入 cmd-d 来垂直拆分终端（这样你就有两个并排的终端），或者输入\
    \ cmd-shift-d 进行水平拆分。然后你可以随心所欲地继续拆分。这是应用程序的功能；你的情况可能会有所而异（图 5.4）。\n\n你还可以在偏设置找到终端的主题（“配置”，profile），它允许你自定义颜色和字体。iterm2-color-schemes\
    \ 是浏览主题的一个好地方。有些人喜欢深色主题，有些人喜欢浅色主题，另一些人会在终端背景中使用图片，而还有一些人则使用半透明背景。我额外的高级用户技巧是使用一个亮粉色（#d13a82）光标配合深色主题。\n\
