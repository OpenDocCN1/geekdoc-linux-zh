  - '[PAGE 57]


    If that bothers you, remember that we learned in Chapter 3 how to use grep -v
    [term] to exclude the term from your results (the -v stands for "invert-match")


    ```

    $ ps uaxww | grep -i sublime | grep -v grep

    remy 59329 0.0 1.6 331748 262020 ?? S

    8Mar15 49:04.37 /Applications/Sublime Text 2.app/Contents/MacOS/Sublime Text 2
    -psn_0_1874872

    ```


    There''s a lot of information here, but most relevant for you are the first, second
    and last columns: the user who started the process (and who therefore owns it),
    the process ID (PID), and the full command running.


    # Kill kill kill!


    If a process goes haywire, you''ll probably notice it hanging. If Sublime hangs
    for me, I can''t enter any text. Sometimes my machine will kill the process automatically;
    other times, more aggressive action is required.

    First, let''s locate the process ID. In this example, it''s 59329:


    ```

    $ ps uaxww | grep -i sublime | grep -v grep

    remy 59329 0.0 1.6 331748 262020 ?? S

    8Mar15 49:04.37 /Applications/Sublime Text 2.app/Contents/MacOS/Sublime Text 2
    -psn_0_1874872

    ```


    If you know the process name, you can also try using pidof [term] to find the
    "process ID of" the given term. (Mac users may have to brew install pidof first).

    Now we use the command kill to stop the process dead in its tracks:


    ```

    $ kill 59329

    ```


    *Remy opens Sublime to continue writing. *'
  - '[PAGE 58]


    ![](img/75faf7950ffd7820aef985d892b0a56e_58_0.png)


    FIG 4.5: The kill -9 command deals a fatal blow to all running programs. It asks
    no questions and grants no mercy.


    For me, Sublime just terminated. No warnings. No “Do you want to save your carefully
    crafted prose?” Nothing. Just killed.

    But if the process doesn''t belong to you? What if you don''t have permission
    to kill it? That’s right, sudo to the rescue (as you blow away some poor sap’s
    program):


    ```

    $ sudo kill 59329

    ```


    Sometimes, though—sometimes—a kill isn''t enough. You have to kill harder. The
    kill command says to the process, “Would you mind gracefully shutting down?” Typically,
    the program will behave politely and exit, but once in a while you will have some
    force.


    The kill -KILL [pid] and kill -9 [pid] commands mean the same thing: kill the
    process and don''t wait for the to respond.


    When using -9 to kill, you may also need to add sudo to the mix. But it will get
    the job done. It''s the fatality move of the command line (FIG 4.5).'
