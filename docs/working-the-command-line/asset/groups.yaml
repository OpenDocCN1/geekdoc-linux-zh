  - '[PAGE 63]


    IN CHAPTER 1, I showed you how to replace your default terminal with an alternative.
    The terminal is the application that runs your shell. You''ve already met and
    used the shell—it''s where you actually run commands and see the output. The shell,
    irrespective of the terminal application you choose, can have its own customizations.


    Let''s look at some of those, now that you have a little more experience under
    your belt. Although shell customization offers only modest power-ups, I''d argue
    that it''s quite important: customization is what makes a thing feel like it belongs
    to you. Potentially, at least, there are as many shells as there are users (FIG
    5.1).


    Terminal customization follows a certain hierarchy: first, there''s the terminal
    application itself; then, within the terminal, is the shell; inside the shell
    is the prompt; and finally, there are aliases and shortcuts. We''ll look at each
    in turn (FIG 5.2).


    # THE TERMINAL


    As I mentioned at the beginning of this book, iTerm2 is far and away my favorite
    terminal emulator. Most other terminal applications, iTerm2 accepts a wealth of
    customizations. Let''s take a look at the preferences for my keyboard shortcuts
    (FIG 5.3).


    As I mentioned in Chapter 1, split windows can be quite useful. In iTerm2, you
    can type cmd-d to split your terminal vertically (so you have two terminals side
    by side), or cmd-shift-d for a horizontal split. Then you can keep splitting to
    your heart''s content. This is a feature of the application; your mileage may
    vary (FIG 5.4).


    You''ll also find in the preferences the theme ("profile") for your terminal,
    which allows you to customize the colors and the font. iterm2-color-schemes is
    a good place to start browsing around for themes. Some people prefer a dark theme,
    some prefer a light theme, others have images in the background of their terminal,
    and still others use a semitransparent background. My extra pro-user tweak is
    that I use a hot-pink (#d13a82) cursor combined with a dark theme.'
