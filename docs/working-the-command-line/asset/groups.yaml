    \n79 Index\n\n# FOREWORD\n\nSTOP ME if you've heard this one before.\n\nYou've\
    \ just followed a link to a cool-sounding new resource that one of your friends\
    \ has recommended. Now you're reading about how this could help you in your day-to-day\
    \ work on the web. You excitedly click through to the documentation; the installation\
    \ instructions are laid out before you. That's when your heart sinks. “This is\
    \ moon language!” you cry.\n\nYou are not alone. I don't just mean that there\
    \ are many of us who feel the same way. I mean that you are literally not alone.\
    \ You have Remy with you.\n\nAs I navigate the intimidating dark depths of the\
    \ Command Line Interface, I'll keep this book close to hand. But it isn't a reference\
    \ book. It's more like a self-help book. It will help me and you—become a more\
    \ efficient developer, better equipped to battle moon language. “It’s a Unix system,”\
    \ you'll whisper. “I know this!”\n\nHaving finished the book, I now have one question\
    \ I ask myself before I confront an unavoidable task on the command line: What\
    \ Would Remy Do?\n\nWhen it comes to the command line, WWRD will serve you in\
    \ good stead. (Warning: when it comes to just about any other aspect of your daily\
    \ life, WWRD will almost certainly be disastrous.)\n\nWhat Would Remy Do? The\
    \ answer lies within these pages.\n\n—Jeremy Keith\n\n# 1\n\n“JUST OPEN THE TERMINAL…”\n\
    \nAT SOME POINT IN YOUR LIFE, dear reader, you may have opened the terminal and\
    \ found yourself staring into a black void—or, if you're of the Mac persuasion,\
    \ a white void (FIG 1.2).\n\nA flashing cursor and a dollar symbol invite you\
    \ to enter a command. But then what? What does this want from you? In my first\
    \ experiences with a terminal, I remember words like \"Hello.\" \"Run.\" I tried\
    \ entire sentences. It was not even kidding. And, no, none of it worked.\n\nThis\
    \ book is for those of you who are new—or even so new—to the terminal. Maybe you're\
    \ a front-end developer or a designer who has read countless blog posts that start\
    \ with this magical incantation: \"Just open the terminal...\" Or perhaps you\
    \ have a few command-line skills, but have found yourself sucked into the void,\
    \ stuck inside a command, unable to quit—ever.\n\nBy the end of this book, you\
    \ will feel comfortable fingering up terminal and you'll be able to speak enough\
    \ terminal black-void gobbledygook that you may well start telling other people\
    \ to \"just\" run echo printing dollar.\n\n# WHY USE THE TERMINAL?\n\nDamn good\
    \ question. In their right mind would punish themselves by using the terminal\
    \ instead of a beautifully designed app with an interface that would make Pony\
    \ Ive a shed?\n\nThe answer is that decades of development have gone into the\
    \ tools available from the terminal and the command line (or the command-line\
    \ interface, or CLI, as it's also known). Lots and lots of tiny tools—programs\
    \ that are built to do one simple thing well, but that often join forces to solve\
    \ more complex problems. This practice of designing tiny tools is known as the\
    \ Unix philosophy.\n\n> There is no single, standardized statement of the philosophy.\
    \ But if it had to be described with only a single word, that word would refer\
    \ to modularity, a system that is composed of components (i.e., modules) that\
    \ can be fitted together or arranged in a variety of ways.—The Linux Information\
    \ Project\n\n![](img/75faf7950ffd7820aef985d892b0a56e_7_0.png)\n\n**FIG 1.1:**\
    \ Faced with a dollar symbol and nothingness, you'd be forgiven for bailing out\
    \ immediately.\n\nConsider a tiny command-line utility called *cat*, which allows\
    \ you to print the contents of a file to the screen. On its own, cat is fine,\
    \ somewhat limited—but it can be used as part of a larger system. If I combine\
    \ cat with *grep*, I can quickly find out on which line the words \"black void\"\
    \ appear in my manuscript. I can count how many times I've used the phrase \"\
    black void,\" by simply combining these two tools. Then I can plug that output\
    \ into another program and manipulate the text, or do something else entirely.\
