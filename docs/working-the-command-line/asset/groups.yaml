    # RUBY, PYTHON, OR NODE?


    Anna Debenham, this book’s technical editor, wisely asked me,

    “How does someone know which is the right type of application to use?” An excellent
    question, and a complicated one that I would frankly rather sidestep—but I won’t.


    First of all, there are no hard-and-fast rules about which language is best. Personally,
    I gravitate toward Node: I find the installation of individual programs uncomplicated
    (using the package manager npm, which I’ll come back to in a bit), and the support
    across different operating systems is absolutely superb.


    Some people like Ruby, others like Python. There is no absolute right—what matters
    is how comfortable you are with a given language. Once you’ve set up the way you
    want on your machine and have your workflow nailed down, you’re good to go.


    Occasionally, though, specific applications are only available under one language—so
    you really have no choice. Over the years, I’ve learned that I need to be able
    to install the three major languages: Ruby, Python, and Node.


    # Ruby applications and gems


    This is when it gets serious. You’ve read the latest cool thing, and you “just
    have to install” a Ruby gem (a bit of reusable code, also called a package or
    a module in other contexts).


    I consider myself pretty comfortable with the terminal, but installing gems seems
    to be a dark art requiring all kinds of arcane rites. The real problem (in my
    experience) is that when you find a great application that says “just install
    the gem,” it rarely tells you how to install it.


    On the optimistic side


    Let’s start by installing lolcommits, a project that uses your webcam to capture
    your picture right after you commit to Git:'
  - '[PAGE 30]


    FIG 2.6: An optimistic Remy has just made a commit! (By the way, if you want to
    deepen your understanding of Git, consider reading David Demaree''s excellent
    Git for Humans.)


    ![](img/75faf7950ffd7820aef985d892b0a56e_30_0.png)


    ```

    $ gem install lolcommits

    ```


    If this works, you''ll see a torrent of install messages ending with something
    like this:


    ```

    $ gem install lolcommits

    Fetching: unf_ext-0.0.7.2.gem (100%)

    Building native extensions. This could take a while...

    [code omitted for brevity]

    35 gems installed

    ```


    And if you follow the setup instructions, you''ll be graced with some lovely photos
    whenever you make a commit (FIG 2.6).


    # When gems don''t work


    If Ruby hates you as much as it hates me, then you might need to update a few
    things to get gems installed properly. It''s entirely possible that you''ll hit
    a wall after updating, and find that still nothing happens. I run into this all
    the time. The solution is not to throw your machine through the window, as I have
    nearly done. Instead, calmly walk away, and accept that this particular gem shall
    not be part of your growing collection of command-line tools.


    Here''s a list of things you can do to try to get gems to install if you''re having
    problems:'
- md: '

    - 1. Try running the install as root (using sudo), which we met earlier): sudo
    gem install lolcommits.

    2. Try updating the gem system: sudo gem update --system.

    3. Install the latest Xcode command-line tools: xcode-select install.

    4. Upgrade to the latest version of your operating system.

    5. Buy a new computer. Yeah, I''d give up before this point, too.


    Steps 1-3 are the ones I would try, but I have also experienced a machine that
    needed step 4 to install a gem (it was t versions behind the latest OS X). Other
    times, I''ve had to abort—but this book is an introduction, so if you''re getting
    stuck in gem holes, it might be worth consulting your nearest ops engineers!


    # Python applications


    Python has a package manager, but it''s pretty hairy. There are a lot of moving
    parts to keep track of—like easy_install, and virtualenv.


    One you can find packages for Python is pypi.python.org. In my own experience,
    though (as someone who has very little experience with Python packages), I found
    it tricky to get the right combination of installers. In fact, most of the Python-based
    applications I''ve installed in the past have been installed via Brew (which we
    met earlier). This might spare you a little pain in the future. Or, it might not.


    Swiftly moving on...


    # Node applications


    Because my background is in JavaScript, I tend to turn to Node-based applications
    as my go-to solution; Node, after all, is what is used to execute JavaScript.


    Another thing that draws me to Node modules over Ruby gems or Python modules,
    as I mentioned earlier, the very excellent cross-platform support they enjoy.
    Most of the time, the Node utility you install will work the same on Mac, Windows,
    and Linux.


    The only prerequisite is installing Node, which is wrapped up in a nice application
    installer you can download from nodejs.org. Hit the big Install button, follow
    the prompts, and you''re done.


    Now, when you open your terminal, you can install Node modules via "npm" (doesn''t
    stand for "node package manager," by the way. It doesn''t stand for anything.)


    We typically use npm to install packages (also referred to as modules) into software
    we''re writing. However, we can also use npm to install globally—that is, to install
    a command-line utility that''s accessible from anywhere in the terminal.


    Let''s install our friend cowboy, since someone ported it to JavaScript. To do
    this, we''ll type npm on the command line and tell it to install a package. Not
    to install it globally, we need to use the -g flag:


    ```

    $ npm install -g cowboy

    /usr/Local/bin/cowsay ->

    /usr/Local/lib/node_modules/cowsay/cli.js

    /usr/Local/bin/cowthink ->

    /usr/Local/lib/node_modules/cowsay/cli.js

    cowsay@1.0.3 /usr/Local/lib/node_wrapper

    └ optimist@0.3.7 (wordwrap@0.0.2)

    ```


    You can also use npm to install tools like Grunt, Gulp, Yeoman, or PhoneGap. And
    there''s a huge community of developers contributing new and updated npm packages
    by the day.


    In situations, you may need to use sudo npm install -g [package], but I recommend
    not using sudo and trying a regular install first. Installing packages with sudo
    unintentionally inherit from root''s permissions, which results in the program
    having different permissions than your user when it runs. Bottom line: things
    can get gnarly. (I''ll go into more detail about sudo in Chapter 4.)


    Over the course of this chapter, you''ve learned how to install a wealth of applications
    for your new command-line skills—not only "classic" Unix-type applications like
    Wget, but also utterly awesome applications like cowsay and even (wait for it)
    pony-say. (Yes, as if a cow weren''t enough, you can also get a brightly colored
    pony to say all the things.) Beyond brew install, you can now install all of the
    bespoke applications that pop up in your news and Twitter feeds via Ruby gems
    or npm packages.


    If you want to find a program that does a particular thing, I recommend starting
    with Google (rather than with package-specific sites). Some initial, general research
    will give you an idea of whether the program is available in your preferred language,
    or will point you toward an alternative you perhaps hadn''t thought of.


    Armed with your new knowledge, you''re ready to start remixing your command line
    applications. We''ll do that next.


    # TOOLS OF THE TERMINAL TRADE


