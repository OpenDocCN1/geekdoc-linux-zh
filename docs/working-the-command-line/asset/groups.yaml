    ```

    /Users/remy/Dropbox/Writing/cli-book

    git:(master) # random error

    zsh: command not found: random

    /Users/remy/Dropbox/Writing/cli-book

    git:(master) # █

    ```


    FIG 5.10: Huzzah. Our prompt now features a snowman when things are okay, and
    an when the last command failed.


    There''s also a right-hand prompt with zsh; this can be set using the RPROMPT
    value. You can do all sorts of things with this value, add the current time (or
    perhaps something more creative).


    Or let''s say you want to add the current time in square brackets and in blue,
    just for the heck of it. Simply add the following to your my.zsh-theme file:


    ```

    RPROMPT="%fg[blue]%*"

    ```


    The 24-hour time is represented by *, so the final prompt is a bit of visual mess
    of curly braces and percent signs. For that I apologize, but once you''ve got
    your prompt, you probably won''t change it again...ever.


    The full list of prompt variables is listed in the zsh prompt expansion documentation.
    It''s a little dry, but it contains all the values you can use. If you''re after
    a more approachable account, you can read about my entire prompt setup on my blog.


    # ALIASES


    Aliases are just alternatives to existing CLI commands. To create an alias, use
    the alias command. For instance, you might alias the command to ls -ltRFa (a shortcut
    to list all files with hidden files included, so that the most recently changed
    files appears at the end of the output):


    ```

    $ alias ll=''ls -ltrFa''

    ```'
  - '[PAGE 76]


    However, running this in the shell means that you only have the alias for as long
    as the session lasts, and crucially, that the alias won''t work in other sessions.
    Not cool. So let''s fix that.


    To make your aliases easy to manage and add later on, it can be useful to create
    a file called .aliases in your home directory (cd ) containing all your aliases.
    That way you can effortlessly use your .zshrc file by adding the following line
    to your .zshrc file:


    ```

    source ~/.aliases

    ```


    Because this is part of .zshrc file, it means that every new session will include
    all of your aliases. Many developers have published their own aliases, which I
    highly recommend checking out; they are amazing resources you can add to your
    own aliases to make your workflow more efficient.


    Aliases can be simple (as we''ve just seen), or they can combine commands. Remember
    how we learned to navigate to parent directories in Chapter 1? You can use aliases
    to do work much more efficiently:


    ```

    alias ..="cd .."

    alias ...="cd ../"

    alias ....="cd ../../"

    alias ====="cd ../../../"

    ```


    These commands will allow you to type .. in the shell to get it to the parent
    directory. Three dots will take you to the parent''s parent directory, and so
    on. Aliases are useful for commands that you may not find easy to remember. For
    instance, if you can''t remember the exact command to run each time you might
    want to clear the DNS cache on your Mac, you can use this alias:


    ```

    alias flush="dscacheutil -flushcache"

    ```'
  - "[PAGE 77]\n\nOr for example, I can never remember the series of commands to show\
    \ and hide the desktop icons on my mac, so I use two aliases to make my life easier:\n\
    \n```\nalias hidesktopop=\"defaults write com.apple.finder\nCreateDesktop -bool\
    \ false && killall Finder\nalias showdesktop=\"defaults write com.apple.finder\n\
    CreateDesktop -bool true && killall Finder\"\n```\n\nI'd love to reel off all\
    \ of my aliases right now, but that would spoil all the fun you've have on your\
    \ own. Plus, it would likely take ooodles of pages in this book and wouldn't copy\
    \ and paste very well. I will point toward Mathias Bynens, though who has compiled\
    \ an excellent repository of dotfiles (including aliases, his shell setup, and\
    \ more), where he also references the sources that inspired him. It's well worth\
    \ to spur your motivation, and to start flexing your copy-and-paste muscles.\n\
    \n# Functions\n\nAliases have one limitation: you can't insert an argument. For\
    \ instance, if you want to get the base64 data URL for a file, you can't quite\
    \ do that with an alias; you need a function names in your terminal the same way\
    \ you do run aliases.\n\nHere's the code required to generate a base64 URL for\
    \ any file:\n\n```\nfunction dataurl() {\n  local mimeType=$($file -b --mime-type\
    \ \"$1\")\n  if [[ $mimeType == text/* ]]; then\n    mimeType=\"${mimeType};charset=utf-8\"\
    \n  fi\n  echo \"data:${mimeType};base64,\\$(openssl base64 -in \"$1\" | tr -d\
    \ '\\n')\"\n}\n```"
  - '[PAGE 78]


    This lets you get the data URL for an image from the terminal:


    ```

    $ datar1 book-cover.png

    data:image/jpeg;base64,/9j/4AAQ5kZJRgABAQAAQABAQA...

    ```


    We''ve covered a lot of ground, but now you know how

    to customize your terminal to suit your personal style. You''ve

    learned about, and hopefully converted to, Z shell and the

    aawesome Oh My Zsh project. You''ll have a few personal aliases

    to make your workflow a little sleeker, and finally you''ll have

    your very own customized prompt—designed by you, for you.


    # YOUR TURN


    Hm. All endings are more or less arbitrary, I suppose, but I can''t

    just close this book by showing you how to add functions to

    your prompt, can I? So let me bid farewell and wish you

    t best of luck with your continued journey into the void.


