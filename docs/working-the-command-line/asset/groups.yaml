    FIG 4.3: drwxrxrwxrwx represents the range of permissions you can see on files.
    The first cluster of rwx characters is the most useful because it tells you whether
    the file is readable, executable, or writable by the owner (you).


    ![](img/75faf7950ffd7820aef985d892b0a56e_52_0.png)


    x: can execute (1)

    w: can write (2)

    r: can read (4)

    -: not set


    +   * Owner: you

    * Group: you and anyone else in your “group” (useful if you share a machine or
    server)

    * Other: anyone who isn''t in your group


    Why would we want to change file permissions? One reason might be to make a file
    executable. Another might be to allow a group member to access a file.

    The command we use to do this is called chmod (short for change mode).


    With chmod, we type the first letters for user (u), group (g), or other (o); then
    a plus operator (+) for adding permissions or a minus operator (-) for removing
    permissions permission letters for read (r), write (w), or execute (x).


    Let''s look at this in action. To change a file so that it''s executable by the
    user and the group, we''d run the following:


    ```

    $ chmod ug+x my-script

    ```


    This sets the user and group permissions to executable.

