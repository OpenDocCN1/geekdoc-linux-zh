    time I show you just enough to do some real damage.


    Or, put another way, I''m going to show you some commands that will help you get
    out of a pickle when an application goes haywire or your machine gets hammered.


    You can achieve most, if not all, of these commands through a graphical interface
    (GUI) if you''re using a Mac (for instance), but as you grow more comfortable
    with the command line, you''ll find that it becomes easier just to use that to
    remove files or to check your system health. And if you go on tinker with remote
    servers, there won''t be any visual UI for you to rely on; you''ll be forced to
    stare into the void and will have no choice but to resort to the commands I describe
    here.


    # DELETING FILES: rm


    ...because who needs files when you can DISK SPACE? Older PC users out will appreciate
    this (and younger users perhaps won''t believe it): when I started messing around
    with PCs (it was in 1991), I had an Intel 286, and there were these strange files
    taking up my precious 40-MB hard drive: config.sys and autoexec.bat. Which taught
    me how PCs worked by plunging me into the deep end of recovering super-intelligent
    configuration settings.


    Suffice it to say: be careful about deleting. Today''s systems go to great lengths
    to protect you yourself, but since this is the foot-shooting chapter, I''m going
    to show you how to work around some of that.


