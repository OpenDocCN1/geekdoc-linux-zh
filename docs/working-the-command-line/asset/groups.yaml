    # USING THE KEYBOARD


    Although shortcuts aren''t required, it''s always handy to know a few power keyboard
    moves.


    # Tab


    My favorite shortcut is the unsung Tab. All terminals have tab-completion support.
    So if you find yourself typing a command or directory name a lot, you only need
    to enter a bit of text, Tab, and your terminal will try to complete it.


    Different-flavored shells will do slightly different things. Some will complete
    the most common word you use, and hitting Tab again will cycle through the next
    most common match.


    Some will complete up to the point where there''s more than one command that matches.
    For instance, if you have two applications, one called cowsay and one called cowthink,
    typing “co”'
  - '[PAGE 19]


    ![](img/75faf7950ffd7820aef985d892b0a56e_19_0.png)


    hitting Tab would complete up to "cow"; then, if you added s and Tab, it would
    complete to "cowsay" (FIG 1.5).


    Often, hitting Tab twice will list all possible matches. In our example, hitting
    Tab twice after typing "co" would show both "cowsay" and "cowothink," assuming
    these were the only commands in your environment path (a list of directories where
    the system can find programs) that started with "co". We''ll go over paths in
    more detail in Chapter 2. (I''ll show you how to install the obviously essential
    cowsay program there, too.)


    # Control-Left / Control-Right


    Instead of using the left/right cursor keys to move through every character, you
    can use ctrl+left or ctrl+right to move by entire words. But! This will only work
    if you don''t use multiple desktops on a system like Mac OS Yosemite, which uses
    these keys to switch desktops (though you can disable this in settings).


    An alternative to ctrl+left / ctrl+right, albeit not one that is easy to use,
    is esc+b for backward and esc+f for forward.'
  - '[PAGE 20]


    # Control-C


    This means *abort*. It stops an application from running. If you try running *yes*
    in your terminal, it''ll spew *y* over and over until you hit ctrl+c to abort.


    You might also see this expressed as “C”. (Note that these shortcuts aren''t case-sensitive;
    it''s just the Control and C keys pressed together.)


    # Control-D


    This means *end transmission*, which is basically like saying “GTFO”. Instead
    of exiting your terminal using the mouse (or *logout* command), you can use ctrl+d
    and it''ll close your session.


    # Control-R


    This is a bit of a power-user shortcut, but since we''re reaching the end of Chapter
    1, I think you deserve it.


    Control-R lets you search for the most recent command matching your search term.
    Using my terminal history from earlier, if I hit ctrl+r, I''ll be presented with
    this:


    ```

    $ bck-i-search: _

    ```


    Now if I type “no”, it''ll show the most recent command I ran containing the characters
    *n* and *o* together. If I wanted to match the `nodemon -w .. a.js -V --dump`
    command, I''d need to type something unique to that command, like `mon -w`. Then
    the full command would come up and, if I hit Enter, it would run for for me.


    If you want to abort out of this mode, just hit ctrl+c.'
