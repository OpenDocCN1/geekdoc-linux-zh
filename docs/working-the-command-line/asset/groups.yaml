    Now open the my.zshrc file in your favorite editor. Try not to let it bamboozle
    you too much (like I did the first time I encountered it). What interests us here
    is the first line, in particular the arrow (➜) character, which appears in the
    file:


    ```

    local ret_status="%(?:%{fg_bold[green]}%➜:%{fg_bold[red]}%➜) %s"

    PROMPT=''${ret_status}%{fg_bold[green]}%p

    %%{cyan}%%c %%{fg_bold[blue]}%%$

    $(git_prompt_info) %{fg_bold[blue]} %n%%{reset_color}''

    ```


    The variable ret_status changes the arrow depending on whether the last command
    executed successfully: a bold arrow $fg_bold[green] if so, and a bold arrow $fg_bold[red]
    if there was an error. The second line sets the magic value of PROMPT, creating
    the prompt you''ll


    Now, let''s change the arrow to a snowman (☃). (This is not necessarily very practical,
    but it will do for the exercise at hand.) We''ll also show the full path, but
    on a line of its, above the prompt.


    Swapping the arrow for the snowman is simple, but since the emoji won''t change
    color if we''ll use an alien agent for errors (and drop the color information).
    Furthermore, getting the full path in the PROMPT value will require moving some
    elements around in perfectly legitimate to put a line in the value of PROMPT,
    which is how we get our multiprom:


    ```

    local ret_status="%(?:☃:👾) %s"

    PROMPT=''%%{cyan}%%d

    ${ret_status}%{fg_bold[green]}%p

    %%{fg_bold[blue]}%%$(git_prompt_info)

    %%{fg_bold[blue]}%% %{reset_color}''

    ```


    Now we''ll be able to see when we get a random error; our prompt will switch to
    the alien until there''s a successful command (FIG 5.10).'
