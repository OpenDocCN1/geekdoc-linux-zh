    只要你还记得如何区分用户（User）、组（Group）和其他用户（Other），以及读（Read）、写（Write）和执行（Execute），你就就能记住这些模式和标记。


    正如我们之前看到的，权限也可以有数值值：4 = 读，2 = 写，1 = 执行（图 4.3）。偶尔，当你在教程中遇到 `chmod` 时，你会看到它被表示为类似
    `chmod 110 my-script` 或 `chmod 744 my-script` 的形式。这是我提到的第二种方法，它有点困惑，并不特别容易记忆。


    第一个数字代表用户权限，第二个数字代表组权限，第三个数字代表所有用户的权限。要将用户权限设置为只读，将第一个数字设为 4。要将用户权限设置为读和写，将第一个数字设为
    6（即 4 + 2）。要让文件对所有用户可执行、对所有者可读写、对所有人可读，值分别为 7 (4 + 2 + 1)、5 (4 + 0 + 1) 和 5：


    ```bash

    $ chmod 755 my-script

    ```


    让其他用户对文件可读但不可写是常见操作：因为你是程序的所有者，你不希望其他人弄乱它。


    ## 更改所有权


    在更改权限的同时，你可能还想更改文件的所有权——从你自己更改为另一个用户，或者从另一个用户更改为你自己。过去当我我的机器上有多个登录账户时，我曾需要这样做，将文件从另一个用户移动到我自己，这样我就可以编辑它。


    在 Mac 上，如果情况足够简单，Finder 就可以为你完成操作（并处理一些权限更改）。然而，我发现如何在命令行上执行此类任务是有用的，因为 Finder
    的 UI 界面并不总是可用的，特别是在与远程机器协作时。


    更改所有权的命令是 `chown`（恰好是“change ownership”的缩写），后面紧跟新所有者的名字（在本例中为 anna）。以下是你如何更改文件所有者的：


    ```bash

    $ chown anna my-script

    ```


    你还可以通过指定 `-R` 标记（“recursively”的缩写）来使用 `chown` 同时更改目录中的所有文件：


    ```bash

    $ chown -R anna cli-book/

    ```


    你可以自己探索 `chown` 的其他标记和用法，但这两个命令足够让你应付麻烦了。


    ## 什么是组，我是什么时候加入的？


    每个用户都自动成为某个组的一部分，即使该组只有一个成员。你的用户已经是某个组的一部分了。在运行 Mountain Lion 的 Mac 上，你属于“staff”组，如果你正在共享你的机器，其他用户也是如此。


    如果你想将一个用户添加到 admin 组，你需要一条特殊的命令。在 Mac 上，运行：


    ```bash

    $ dscl . -append /Groups/admin GroupMembership remy

    ```


    注意组名前面有 `/Groups/`。在 Linux 机器上，你需要完全不同的命令：


    ```bash

    $ useradd -G admin remy

    ```


    组是管理用户权限的好方法，特别是当你与多人协作部署到服务器上（以及类似的系统管理员忍者）时。


    ## 进程 (PROCESSES)


    进程指的是运行在你的操作系统上的应用程序。例如，如果你使用 Sublime Text 2，那么有一个进程叫做——听好了——Sublime Text 2。


    如果你是 Mac 用户，可以看看活动监视器（Activity Monitor）程序，它列出了当前正在运行的进程。PC 用户可以使用可靠的任务管理器（Task
    Manager）查看相同的视图。


    `ps`（“process status”的缩写）是活动监视器的命令行对应。以下是我现在我的机器上运行 `ps` 时发生的情况：


    ```

    ps TTY TIME CMD

    95218 tty000 0:04.06 -zsh

    61075 tty001 0:00.21 -zsh

    77196 tty002 0:00.60 -zsh

    509 tty003 0:04.94 -zsh

    525 tty004 0:02.52 -zsh

    ```


    不过，这个输出并不真正代表我的机器上发生的情况。上面的列表显示了五个 zsh（Z shell）命令。Z shell 指的是我的 shell，一个运行在终端中的文本的界面，处理命令并返回输出。（我们将在第
    5 章更详细地查看什么是 shell，特别是 Z shell）。


    注意 Sublime Text 并没有出现在这里，尽管我正用它来写这一章。事实上，`ps` 本身只列出附加了终端的进程。


    但我们想要列出所有进程，带有使用的完整命令和进程所有者（这与谁有权终止该进程也有关，但稍后说）。


    这听起来很长，但使用 `ps aux` 命令（标记的顺序并不重要）可以带给我们很多好处。我截取了它对应的几行截图（图 4.4）。当你将 `ps` 的输出通过到
    `grep` 等工具来搜索特定的项时，输出会变得更易管理。


    ![](img/75faf7950ffd7820ef985d92b0a56e_56_0.png)

    图 4.4：`ps` 的原始输出可能有点丑，但使用 `grep` 将帮助我们缩小查找范围。


    ```bash

    $ ps aux | grep -i sublime

    remy 59329 0.0 1.5 330828 ?? S 48:43 /Applications/Sublime Text 2/Contents/MacOS/Sublime
    Text 2

    ```

    奇怪的是这返回了两个结果。为什么？因为我们搜索了 `grep` 命令本身，而我们正在寻找当前运行的，所以它出现在 `ps` 列表中，明白了吗？


