    # Adding less: "Less is more, more or less."


    less is a command that lets us page through output. There''s a similar command
    called more, but less is better because it allows us to page forward and backward
    (unlike more, which only goes forward).

    I can use less to page through (and even search) the output of my history search:


    ```

    $ history | grep curl

    ```


    Now that I''m inside the less command, I can use the keyboard to cursor up and
    down; I can page forward (by pressing the Space key) or backward (by typing B).
    Significantly, I can search while I''m inside less by hitting the Slash key. I
    can enter an expression like -H (which is an argument to curl); less


    ```

    $ history | grep curl | grep -v history | tail -5

    9649 curl -I jsbin.ff-platform.local

    9651 curl jsbin.ff-platform.local:8000

    9652 curl localhost:8888

    9921 curl http://jsbin.ff-platform.local/user/twitter/648873/

    9923 curl -H ''accept: application/json'' http://jsbin.ff-platform.local/user/twitter/648873/

    ```


    # SORTING AND PICKING


    Sometimes you''ll have a file from which you want to pick some particular lines
    or pieces of data.

    I used to find myself writing weird jQuery scripts and then putting all my data
    in an array and basically jumping through hoops than a frog on speed. These days,
    though, the command line is my friend, because it offers tools like this:


    - grep: to find lines (as we''ve just seen)

    - sort: to sort lines

    - uniq: to find unique lines

    - cut, sed, and awk: to break a line into columns and pick a particular column


    There are tons of things you can do by combining the tools, so let me present
    the following problem as an illustration of their range and flexibility.


    Let''s say I have an unusually high number of requests coming into my server,
    but I can''t figure out what the source of the issue is. The access logs from
    my server typically follow a consistent format (but might appear slightly different
    depending on the situation):


    ```

    IP - user [day/month/year:hour:minute:second zone]

    "GET /url HTTP/1.1" status_code bytes "referring-url" "user_agent"

    ```


    Each entry shows us a lot of information:


    ```

    127.0.0.1 remy [24/Feb/2015:16:14:56 +0000] POST /foobar/save HTTP/1.1" 200 34
    "http://jsbin.local/foobar edit - "Mozilla/5.0 (Windows NT 6.3; Win64; x64) AppleWebKit/537.36
    (KHTML, Like Gecko) Chrome/40.0.2214.115 Safari/537.36"

    ```


    I can pipe commands together to search, sort, and separate the information in
    the access logs in an attempt to understand the problem.


    # 1. Get the last 1,000 lines


    I need to count the number of unique IP addresses that appear in the log—and,
    since my log file is pretty large, I''m only interested in the last 1,000 requests.


    When I start off, I need to be in the directory that contains the logs. The `tail`
    command lets me look at the last 1,000 lines:


    ```

    $ tail -1000 access.log

    ```


    You can also use `tail` in combination with the `-f` option to continuously print
    lines as new lines are written to a file. This command shows each web request
    as it gets written to an access log:


    ```

    $ tail -f access.log.*

    ```


    # 2. Split the lines only showing the IP


    A few tools split lines. One such tool is `cut`; another is `awk` is incredibly
    powerful (and, in fact, a programming language unto itself), but to keep things
    simple, I''m just going to stick with `cut`.


    With `cut`, you have to specify the `delimiter` character (`-d'' ''` to separate
    spaces) and the field (`-ffield number`) you want:


    ```

    $ tail -1000 access.log | cut -d'' '' -f1

    217.128.174.115

    82.90.202.184

    [code omitted for brevity]

    ```


    In the command above, `tail` is feeding `cut` one line at a time and `cut` is
    printing out the first field.


    # 3. Find the unique IP


    For this, I''ll use the `uniq` command. However, uniq is quirky in that it only
    works with lines that repeat (specifically, lines that are adjacent). uniq only
    works on a sorted list, not a random list. So we need to combine uniq with sort.
    First I''ll need to sort the list of IPs:


    ```

    $ tail -1000 access.log | cut -d'' '' -f1 | sort

    173.152.252.198

    194.19.90.161

    217.128.174.111

    105.206.139

    50.249.99.201

    62.90.202.182

    85.115.60.181

    88.128.80.106

    [code omitted for brevity]

    ```


    It doesn''t matter that it''s sorted; the important thing is that common entries
    are next to each other. Now I can pipe to uniq, and I''ll add an argument (-c)
    that gives me count of times the IP appears in the output (which I''ve included
    for brevity):


    ```

    $ tail -1000 access.log | cut -d'' '' -f1 | sort | uniq -c

    [code omitted for brevity]

    2 64.22.77

    1 249.64.146

    1 249.64.182

    2 37.35.161

    14 7.226.139

    12 68.45.22

    13 69.116.182.457

    1 70.88.199.14

    7 71.197.194.82

    3 72.226.11.1

    [code omitted for brevity]

    ```


    The output is still long, and it''s also not sorted by number of occurrences,
    so I''m going to fix that, too.


    # 4. Numerical sorting


    The sort command uses alphabetical order by default, but if you use -n, it will
    sort numerically. Since the output from uniq -c consists of numbers, this is perfect.
    In addition, I will only want the top requesting IPs, so I''m going to pipe this
    (again) to tail to get the last lines:


    ```

    $ tail -1000 access.log | cut -d'' '' -f1 | sort | uniq -c | sort -n | tail -5

    33 77.57.124.151

    36 77.232.10.182

    38 109.70.40.211

    39 192.123.158.35

    152 198.21.21.22

    ```


    Now I can see that there''s a significant number of requests coming from a single
    IP: 198.21.21.22. From there, I can use this IP to search the logs to see what
    they''ve been requesting, or ban the IP for a set amount of time, or something
    else.


    It''s important to note that all of the commands I''ve used here come with Unix-based
    systems. You don''t have to install any of these separately.


    The most important lesson to take away from this chapter is that commands can
    have their output piped to the input of another program using the | symbol. Putting
    commands together embodies the Unix philosophy mentioned at the start of this
    book; most programs support it. Mixing and remixing commands allows any number
    of combinations of manipulations—and that''s powerful stuff.


    # 4 HOW (NOT) TO SHOOT YOURSELF IN THE FOOT


    NOW THAT YOU''RE FRESHLY EQUIPPED with a little bit of knowledge, I think it''s
    time I show you just enough to do some real damage.


    Or, put another way, I''m going to show you some commands that will help you get
    out of a pickle when an application goes haywire or your machine gets hammered.


    You can achieve most, if not all, of these commands through a graphical interface
    (GUI) if you''re using a Mac (for instance), but as you grow more comfortable
    with the command line, you''ll find that it becomes easier just to use that to
    remove files or to check your system health. And if you go on tinker with remote
    servers, there won''t be any visual UI for you to rely on; you''ll be forced to
    stare into the void and will have no choice but to resort to the commands I describe
    here.


