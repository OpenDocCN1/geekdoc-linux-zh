    # 排序与筛选


    有时你会有一个文件，想从中提取某些特定的行或数据段。

    我以前发现自己一直在写一些奇怪的 jQuery 脚本，然后把所有数据放在数组里，基本上比吃了加速药的青蛙还要跳腾。但现在，命令行是我的朋友，因为它提供了这样的工具：


    - grep：用于查找行（正如我们刚刚看到的）

    - sort：对行进行排序

    - uniq：查找唯一的行

    - cut, sed, 和 awk：将一行拆分为多列并选择特定列


    通过组合这些工具，你可以做很多事情，所以让我通过以下问题来作为它们范围和灵活性的说明吧。


    假设我的服务器收了异常数量的请求，但我无法确定问题的根源。服务器的访问日志通常遵循一致的格式（但可能根据情况略有不同）：


    ```

    IP - user [day/month/year:hour:minute:second zone]

    "GET /url HTTP/1.1" status_code bytes "referring-url" "user_agent"

    ```


    每条记录都显示了大量信息：


    ```

    127.0.0.1 remy [24/Feb/2015:16:14:56 +0000] POST /foobar/save HTTP/1.1" 200 34
    "http://jsbin.local/foobar edit - "Mozilla/5.0 (Windows NT 6.3; Win64; x64) AppleWebKit/537.36
    (KHTML, Like Gecko) Chrome/40.0.2214.115 Safari/537.36"

    ```


    我可以将命令组合起来来搜索、排序和分离访问日志中的信息，以尝试理解问题。


    # 1. 获取最后 1000 行


    我需要统计日志中出现的唯一 IP 地址数量——由于我的日志文件很大，我只对最后1000个请求感兴趣。


    开始时，我需要进入日志所在的目录。`tail` 命令允许我查看最后 1000 行：


    ```

    $ tail -1000 access.log

    ```


    你也可以将 `tail` 与 `-f` 选项结合，在向文件写入新行时持续打印输出。该命令会在每个 Web 请求被写入访问日志时显示它：


    ```

    $ tail -f access.log.*

    ```


    # 2. 仅显示 IP 的行分割


    有一些工具可以拆分行。其中一个工具是 `cut`；另一个工具 `awk` 非常强大（事实上它本身就是一种编程语言），但为了保持简单，我将只使用 `cut`。


    使用 `cut` 时，你必须指定分隔符（`-d'' ''` 用于分隔空格）和你需要的字段（`-ffield 数字`）：


    ```

    $ tail -1000 access.log | cut -d'' '' -f1

    217.128.174.115

    82.90.202.184

    [为了简洁，省略了代码]

    ```


    在上面的命令中，`tail` 每次向 `cut` 提供一行，`cut` 输出第一个字段。


    # 3. 寻找唯一 IP


    对于这一点，我将使用 `uniq` 命令。然而，`uniq` 的奇之处在于它只对重复的行（具体说是相邻的行）有效。它只适用于排序后的列表，而不是随机列表。因此我们需要将
    `uniq` 与 `sort` 结合。首先我要对 IP 列表进行排序：


    ```

    $ tail -1000 access.log | cut -d'' '' -f1 | sort

    173.152.252.198

    194.19.90.161

    217.128.174.111

    105.206.139

    50.249.99.201

    62.90.202.182

    85.115.60.181

    88.128.80.106

    [为了简洁，省略了代码]

    ```


    输出是否排序并不重要，重要的是相同的条目相邻。现在我可以将其传递给 `uniq`，并添加一个参数 `-c` 来给出该 IP 在输出中出现的次数（我包含了代码）：


    ```

    $ tail -1000 access.log | cut -d'' '' -f1 | sort | uniq -c

    [为了简洁，省略了代码]

    2 64.22.77

    1 249.64.146

    1 249.64.182

    2 37.35.161

    14 7.226.139

    12 68.45.22

    13 69.116.182.457

    1 70.88.199.14

    7 71.197.194.82

    [为了简洁，省略了代码]

    ```


    输出仍然很长，而且不是按出现次数排序的，所以我也要修复这个问题。


    # 4. 数字排序


    `sort` 命令默认使用字母顺序，但如果你使用 `-n`，它将按数字排序。由于 `uniq -c` 的输出包含数字，这非常完美。此外，我只想要请求次数最多的
    IP，所以我将（再次）将其传递给 `tail` 来获取最后几行：


    ```

    $ tail -1000 access.log | cut -d'' '' -f1 | sort | uniq -c | sort -n | tail -5

    33 77.57.124.151

    36 77.232.10.182

    38 109.70.40.211

    39 192.123.158.35

    152 198.21.21.22

    ```


    现在我看到大量请求来自同一个 IP：198.21.21.22。从那里，我可以使用这个 IP 搜索日志查看他们请求了什么，或者封禁该 IP 一段时间，或其他操作。


    重要的是，我在这里使用的所有命令都带在 Unix 系统中。你不需要单独安装任何一个。


    从本章中学到的最重要的教训是，可以使用符号 `|` 将输出传递到另一个程序的输入。组合命令体现了本书开头提到的 Unix 哲学；大多数程序都支持它。混合和重组命令允许任意数量的操作组合——这是非常强大的功能。


