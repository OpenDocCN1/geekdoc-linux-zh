    # 走出深渊


    当第一章即将结束之际，你已经已经掌握了基础知识。掌握了这些要素后，让我们来看看如何安装第三方工具。


    # 应用程序安装器


    大多数操作系统都带有一些核心应用程序。Ruby 就是其中之一；还有像 `cd`、`ls` 和 `echo` 这样的内置命令。


    但是，如何安装像 cowsay 这样的应用程序呢？（注意我只是把 cowsay 作为一个简单、有趣的程序示例。我知道这是我第二次要求你安装了，如果你不安装我不会被冒的。但你应该知道它确实有一个选项可以将牛变成穿着达斯维达服装的考驼。因为*星球大战*）


    在继续之前，先声明一下：这本书主要面向初学者、前端开发者和设计师。由于那个特定群体中有强烈的“Mac 用户”倾向，我的大多数安装示例将使用 Mac 方法。


