    # FOREWORD


    STOP ME if you''ve heard this one before.


    You''ve just followed a link to a cool-sounding new resource that one of your
    friends has recommended. Now you''re reading about how this could help you in
    your day-to-day work on the web. You excitedly click through to the documentation;
    the installation instructions are laid out before you. That''s when your heart
    sinks. “This is moon language!” you cry.


    You are not alone. I don''t just mean that there are many of us who feel the same
    way. I mean that you are literally not alone. You have Remy with you.


    As I navigate the intimidating dark depths of the Command Line Interface, I''ll
    keep this book close to hand. But it isn''t a reference book. It''s more like
    a self-help book. It will help me and you—become a more efficient developer, better
    equipped to battle moon language. “It’s a Unix system,” you''ll whisper. “I know
    this!”


    Having finished the book, I now have one question I ask myself before I confront
    an unavoidable task on the command line: What Would Remy Do?


    When it comes to the command line, WWRD will serve you in good stead. (Warning:
    when it comes to just about any other aspect of your daily life, WWRD will almost
    certainly be disastrous.)


    What Would Remy Do? The answer lies within these pages.


    —Jeremy Keith'
  - '[PAGE 5]


    # 1


    “JUST OPEN THE TERMINAL…”'
  - '[PAGE 6]


    AT SOME POINT IN YOUR LIFE, dear reader, you may have opened the terminal and
    found yourself staring into a black void—or, if you''re of the Mac persuasion,
    a white void (FIG 1.2).


    A flashing cursor and a dollar symbol invite you to enter a command. But then
    what? What does this want from you? In my first experiences with a terminal, I
    remember words like "Hello." "Run." I tried entire sentences. It was not even
    kidding. And, no, none of it worked.


    This book is for those of you who are new—or even so new—to the terminal. Maybe
    you''re a front-end developer or a designer who has read countless blog posts
    that start with this magical incantation: "Just open the terminal..." Or perhaps
    you have a few command-line skills, but have found yourself sucked into the void,
    stuck inside a command, unable to quit—ever.


    By the end of this book, you will feel comfortable fingering up terminal terminal
    and you''ll be able to speak enough terminal black-void gobbledygook that you
    may well start telling other people to "just" run echo pling dollar.


    # WHY USE THE TERMINAL?


    Damn good question. In their right mind would punish themselves by using the terminal
    instead of a beautifully designed app with an interface that would make Pony Ive
    a shed?


    The answer is that decades of development have gone into the tools available from
    the terminal and the command line (or the command-line interface, or CLI, as it''s
    also known). Lots and lots of tiny tools—programs that are built to do one simple
    thing well, but that often join forces to solve more complex problems. This practice
    of designing tiny tools is known as the Unix philosophy.


    > There is no single, standardized statement of the philosophy. But if it had
    to be described with only a single word, that word would refer to modularity,
    a system that is composed of components (i.e., modules) that can be fitted together
    or arranged in a variety of ways.—The Linux Information Project'
  - '[PAGE 7]


    ![](img/75faf7950ffd7820aef985d892b0a56e_7_0.png)


    **FIG 1.1:** Faced with a dollar symbol and nothingness, you''d be forgiven for
    bailing out immediately.


    Consider a tiny command-line utility called *cat*, which allows you to print the
    contents of a file to the screen. On its own, cat is fine, somewhat limited—but
    it can be used as part of a larger system. If I combine cat with *grep*, I can
    quickly find out on which line the words "black void" appear in my manuscript.
    I can count how many times I''ve used the phrase "black void," by simply combining
    these two tools. Then I can plug that output into another program and manipulate
    the text, or do something else entirely. (We''ll return to the grep tool in Chapter
    3.)


    One can''t easily plug something like Adobe Photoshop into Sublime Text and then
    into another application. But in the terminal, such acrobatics are common practice.


    # TERMINAL APPLICATIONS


    You really need only one terminal application to get to the command line. You
    can apply customization and personalization to any and all terminals—even remote
    machines. I personally look for a few key features that make working with the
    terminal application more productive:'
  - '[PAGE 8]


    +   • Tabs. We''re used to tabbed browsers, and tabs have become a standard requirement
    for terminal applications these days, too.


    +   • Split screens. Some of us are fortunate enough to work with large screens.
    Being able to split the terminal to view more than one task at a time is very
    powerful.


    +   • Select-to-copy. If you''ve never had this feature, it might sound strange,
    but being able to quickly double-click (to select) any text in the terminal and
    then paste (so it goes straight into the prompt) is very powerful and quickly
    becomes muscle memory.


    If you''re a Linux desktop user with Gnome Terminal, then you''re pretty much
    set, since it includes all of these great features by default. Both Windows and
    Mac include terminal applications by default, but you''d be wise to upgrade away
    from them because of their inherent limitations. The default Mac terminal is pretty
    good, but it''s not ideal; if you want to use a split screen, or a feature as
    select-to-copy, consider using something else. The default Windows terminal is
    called Command Prompt; it has a number of restrictions, including not being able
    to resize the window.


    Let''s take a closer look at the Mac and Windows terminals.


    # Mac terminal


    Out of the box, the Mac operating system comes with a terminal application called,
    aptly enough, “Terminal.” It''s a passable terminal, but being a Mac user myself,
    I highly recommend iTerm2, a free, open-source app that includes all sorts of
    great features. iTerm2 will be the terminal app I''ll continue to use throughout
    this book (FIG 1.2).


    Let me suggest a few tweaks that make working with iTerm2 extremely slick. Go
    to the app''s preferences:


    +   • In general, uncheck “Lion-style Fullscreen windows.” This means that when
    you expand the terminal to fullscreen, you won''t have to wait for the annoying
    full-screen animation before actually being able to use the terminal.'
