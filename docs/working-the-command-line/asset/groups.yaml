    FIG 1.2: iTerm2 running my custom shell. The shell is a text-based interface that
    gives you access to your operating system; it processes commands and returns output.
    We''ll look at customizing the shell in Chapter 5.


    +   - In Keys, check "Show/hide iTerm2 with a system-wide hot-key" and give yourself
    a shortcut. My personal favorite is cmd+esc—it really has become part of my muscle
    memory .


    # Windows “cmd.exe” terminal


    Command Prompt is the official name for the Windows terminal, but you''ll often
    hear it referred to in conversation as "command-dot-ex-ee." It provides a view
    on what DOS used to be like. Including Command Prompt in this book is almost unfair,
    because it doesn''t really hold a candle to the features and CLI tools of other
    terminals. PowerShell is better than more powerful (and complicated)—arguably
    better than the Linux-type shells we''ll use in this book—but it''s beyond the
    scope of this brief volume.'
- md: "\nIf you're a Windows user, I recommend you get your hands on Git BASH. It\
    \ comes with Git (the version control system), but you don't have to use Git if\
    \ you don't want to (FIG 1.3).\n\nNow you've got the same commands and navigation\
    \ methods as you would on a Linux or Mac machine. This is a win for consistency.\n\
    \n## THE PROMPT\n\nThere's a certain amount of jargon involved in working with\
    \ the terminal, some of which we've touched on already. One of the first things\
    \ you'll have to familiarize yourself with is the prompt. The prompt is where\
    \ you'll enter commands.\n\nThough usually represented by a $ symbol, the prompt\
    \ can be really anything (because you can customize it, as we'll see in Chapter\
    \ 5). It's not uncommon to see blogs and online tutorials start a code block with\
    \ a $ symbol, which is shorthand for \"You need to run everything after the $\
    \ in the terminal.\" Note that you don't need to do this; it's a visual cue for\
    \ the reader.\n\nNow that you've fired up your terminal, you will be greeted with...well,\
    \ little: a $ symbol and (mostly) blank screen. Yes, you'll need to know your\
    \ way around—but fear not, that's why you're reading this book!\n\nWe're going\
    \ to navigate around your hard drive to get a feel for how a path works. First,\
    \ though, let's explore a little.\n\n## ls: listing files and directories\n\n\
    We want to change directory, or cd, into one of the directories listed. It's entirely\
    \ possible that the output from ls doesn't make it clear what is a directory and\
    \ what is a:\n\n```bash\n$ ls\nchapter-outline.md chapter1 chapter2 todo.md\n\
    ```\n\n![](img/75faf7950ffd7820aef985d892b0a56e_11_0.png)\n\nFIG 1.3: Running\
    \ Windows? Get some Git BASH to make your life a little easier.\n\nIn this case,\
    \ we want to see clear distinctions between files and directories, and we want\
    \ detailed information about each item in the current directory. Most commands\
    \ can take switches (sometimes also called options or flags): arguments that modify\
    \ how a command is carried out. So we will repeat our ls command and add a couple\
    \ of switches to it: -l (again, a lowercase ell) which gives us the details, -F,\
    \ which adds a trailing slash to the directories. Note that single-character arguments\
    \ can often be combined together—and here's what we get:\n\n```bash\n$ ls -lF\n\
    total 16\n--rw-r--r-- 1 remy staff 1226 Aug 7 14:62 chapter-outline.md\ndrwxr-xr-x-\
    \ 3 remy staff 102 Jan 12 10:25 chapter1/\ndrwxr-xr-x- 2 remy staff 68 Jan 12\
    \ 10:25 chapter2/\n--rw-r--r-- 1 remy staff 1900 Aug 7 14:41 todo.md\n```\n\n\
    Our output contains lots of information:\n\n- **Total**: the first line will give\
    \ you a total (16, in this case). Don't let this confuse you like I did me. total,\
    \ here, means the total number of \"blocks\" used, not the total number of files.\
