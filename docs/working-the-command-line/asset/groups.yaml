    # RESOURCES


    Here are a few essential resources to help you take on the command line.


    ## Configuration and dotfiles


    - Remy''s terminal setup. A look at how I''ve configured my terminal, which you''ve
    seen in various screenshots throughout this book.

    - GitHub''s guide to dotfiles. A great starting point to cover other people''s
    dotfiles (the configuration files for your prompt, aliases, and functions). Includes
    some useful links to enhance the zsh.

    - Some popular dotfiles by Mathias Bynens, Ben Alman, Paul Irish, and me.


    ## Useful command browsing sites


    - Ask HN: Share your favorite bash/zsh aliases. Here people share their favorite
    aliases. A good place to pinch a few ideas.

    - Bash one-liners. A vast collection of little bash commands, useful for browsing
    and learning a new trick here and there.

    - alias.sh. Although the site is now retired, it still hosts lots of great aliases
    and explanations about how they work.


    ## Bonus: pretty much the best feature of my terminal


    - ponysay. An alternative to cowsay, ponysay brightens up my terminal every day!


