    # 序言


    如果你听过这个故事了，请停下我。


    你刚刚点击一个链接，进入了一个朋友推荐的听起来很酷的新资源。现在你正在阅读它如何帮助你完成日常 Web 工作。你兴奋地点击进入文档；安装指南展现在你面前。就在这时，你心沉了。“这是外星语言！”你叫道。


    你并不孤单。我的意思不仅是有很多人和你有同样的感觉，我的意思是你真的不孤单。你有 Remy 陪着。


    当我穿过命令行界面那令人生畏的黑暗深渊时，我会把这本书放在身边。但它不是一本参考书。它更像是一本自帮助书籍。它将帮助我和你——成为更高效的开发者，更好地装备自己对抗外星语言。“这是一个
    Unix 系统，”你会低声说，“我懂这个！”




    读完这本书后，现在在面对命令行上一个不可避免的任务之前，我都会问自己一个问题：Remy 会怎么做？


    涉及到命令行，WWRD 将让你大有裨益。（警告：涉及到日常生活的几乎任何其他方面，WWRD 几乎会是灾难性的。）


    Remy 会怎么做？答案就在这些页面之中。


    —Jeremy Keith


    # 1


    “只需打开终端即可……”


    亲爱的读者，在你人生的某个时刻，你可能打开了终端，发现自己正盯着一片黑色虚空——或者，如果你是 Mac 派，是一片白色虚空（图 1.2）。


    一个闪烁的光标和一个美元符号邀请你输入命令。但接着呢？它想从中得到什么？在我第一次使用终端的经历中，我记得过像“Hello”。“Run”。之类的词。我试过整个句子。这甚至不是在开玩笑。而且，不，一个都没用。


    这本书是写给那些对终端是新手——甚至是对终端极度新手的——你们的。也许你是一个前端开发者或设计师，读过无数以这句魔咒开头的博客文章：“只需打开终端即可……”或者你可能已经有一些命令行技能，但发现自己被吸入了虚空，困在某个命令中，无法退出——永远无法退出。


    读完这本书后，你将觉得操作终端非常自在，你将能够说足够多的终端黑色虚空乱码，以至于你可能开始告诉别人“只需”运行 echo 打印美元符号。


    # 为什么要使用终端？


    问得好。神智正常的人会惩罚自己使用终端，而不是使用一个界面设计到让 Pony Ive 都觉得简陋的精美应用吗？


    答案是，终端和命令行（或命令行界面，也称为 CLI）提供的工具已经投入了数十年的开发。大量的、大量的微型工具——这些程序的设计初衷是完美完成一件简单的事情，但它们经常会合力解决更复杂的问题。这种设计微型工具的做法被称为
    Unix 哲学。


    > 这种哲学没有单一、标准的表述。但如果必须用一个词来描述，那个词将是指模块化，即一个由组件（即模块）组成的系统，这些组件可以以各种方式组合或排列。—Linux
    信息项目


    ![](img/75faf7950ffd7820aef985d892b0a56e_7_0.png)


    **图 1.1:** 面对美元符号和虚无，你立即退出是可以被原的。


    考虑一个名为 *cat* 的微型命令行实用，它允许你将文件内容打印到屏幕上。单看 cat 还可以，有些局限性——但它可以作为更大系统的一部分。如果我将 cat
    与 *grep* 结合起来，我可以快速找到我的手稿中“黑色虚空”这两个词出现在哪一行。只需组合这两个工具，我就可以计算我使用了“黑色虚空”这个短语多少次。然后我可以将输出插入到另一个程序并处理文本，或者做完全不同的事情。（我们将在第
    3 章回到 grep 工具。）


