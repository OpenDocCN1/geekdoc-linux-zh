    IF YOU''VE SPENT ANY TIME rummaging through tutorials, or perhaps shoulder-surfed
    a friend as they cruised around the terminal like in water, then it''s likely
    you''ve come across the pipe. The pipe typically occurs between two commands,
    like echo "Hello Remy" and say, which will make the machine speak and welcome
    me, like this:


    ```

    $ echo "Hello Remy" | say

    ```


    The pipe is a magic and integral part of the command line. It''s super powerful
    and damn useful. What does it take the output from the first command (on the left
    side) and “pipe” it to the second command (on the right side).


    If you want an analogy, imagine a cartoon factory conveyor belt running through
    two big machines. Maybe we send a tree trunk down the conveyor belt and into the
    first machine (our first command), which eats it, rumbles a bit, and spits out
    a carefully carved statue of a pony. The wooden pony continues along the conveyor
    belt (this is our “pipe”), and makes its way into a second machine (our second
    command), only to come out painted glor pink!


    The key is that anything can be sent into that machine, and it will come out bright
    pipe—it doesn''t just accept ponies.


    It''s a pretty simple concept: you can use the output of one command as the input
    to another, and in fact you can keep piping commands together—this can go on,
    and on, and so on.


    So which commands support this behavior? Most in fact, if a command expects text
    as input (and most generally), then it would be fair to expect the command to
    support piping of content. As a rule of thumb, if I installed an application via
    brew install, I''d expect it to support piping.


    One caveat: Ruby gems, Node modules and utilities, Python scripts, and so forth
    might not support this. There are a lot of Unix commands available to you on the
    command line, but the third party command-line applications I just mentioned may
    not have written-in support for piping content.'
