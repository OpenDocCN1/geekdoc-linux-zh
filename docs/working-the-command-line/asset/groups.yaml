    \ the process, but on that later).\n\nIt's a mouthful, but using the ps aux command\
    \ (the order of the flags doesn't matter) gives us lots of goodness. I cropped\
    \ the screenshot it was re of lines (FIG 4.4). The output from ps becomes more\
    \ manageable when you pipe the output into a tool like grep to search for a particular\n\
    \n![](img/75faf7950ffd7820ef985d92b0a56e_56_0.png)\nFIG 4.4: Plain output from\
    \ ps can be a bit ugly, but using grep will help us narrow down what we are looking\
    \ for.\n\n```bash\n$ ps aux | grep -i sublime\nremy 59329 0.0 1.5 330828 ?? S\
    \ 48:43 /Applications/Sublime Text 2/Contents/MacOS/Sublime Text 2\n```\nWhat's\
    \ strange that this returns two results. Why? Because we grepped the grep command\
    \ and then we are looking for currently running, so it appears in the ps list,\
    \ anyone?\n\n## WORKING THE COMMAND LINE\n\nIf that bothers you, remember that\
    \ we learned in Chapter 3 to use grep -v [term] to exclude the term from your\
    \ results (the -v stands for \"invert-match\").\n\n```bash\n$ ps aux | grep -i\
    \ sublime | grep -v\nremy 59329 0.0 1.6 331748 ?? S 49:37 /Applications/Sublime\
    \ Text 2/```\n```\nThere's a lot of information here, but most relevant for you\
    \ are the first, second and last columns: the user who started the process (and\
    \ therefore owns it), the process ID (PID), and the full command running.\n\n\
    ## Kill kill!\n\nIf a process goes haywire, you'll probably notice it hanging.\
    \ If Sublime hangs for me, I can't enter any text. Sometimes my machine will kill\
    \ the process automatically; other times, more aggressive action is required.\
    \ First, let's locate the process ID. In this example:\n\n```bash\n$ ps aux |\
    \ grep -i sublime | grep -v\nremy 59329 0.0 1.6 331748 ?? S 49:37 /Applications/Sublime\
    \ Text 2/\n```\n```Sublime Text 2\nIf you know the process name, you can also\
    \ try using pidof [term] to find the \"process ID of\" the given term (Mac users\
    \ may have to brew install pidof first). Now we use the command kill to stop the\
    \ process dead in its tracks:\n\n```bash\n$ kill 59329\n```\n*Remy opens Sublime\
    \ to continue writing.*\n\n![](img/75faf7950ffd7820ef985d92b0a56e_58_0.png)\n\
    FIG 4.5: The kill -9 command deals a fatal blow to all running programs. It asks\
    \ no questions and grants no mercy.\n\nFor me, Sublime just terminated. No warnings.\
    \ No “Do you want to save your carefully crafted prose?” Nothing. Just killed.\
    \ But if the process doesn't belong to you? What if you don't have permission\
    \ to kill it? That’s right, sudo to the rescue (as you blow away some poor sap’s\
    \ program):\n\n```bash\n$ sudo kill 59329\n```\n\nSometimes, though—sometimes—a\
    \ kill isn't enough. You have to kill harder. The kill command says to the process,\
    \ “Would you mind gracefully shutting down?” Typically, the program will behave\
    \ politely and exit, but once in a while you will have some force. The kill -KILL\
    \ [pid] and kill -9 [pid] commands mean the same thing: kill the process and don't\
    \ wait for it to respond.\n\nWhen using -9 to kill, you may also need to add sudo\
    \ to the mix. But it will get the job done. It's the fatality move of the command\
    \ line (FIG 4.5).\n\n## DIAGNOSING PROBLEMS\n\nNow that you have the knowledge\
    \ to completely ruin your machine, it’s also worth learning about a handful of\
    \ command-line tools that will help you quickly diagnose simple problems.\n\n\
    ## top\n\ntop will show you a live, constantly updating view of processes running.\
    \ You can order the list by CPU usage (P) or memory (uppercase M)—very helpful\
    \ if you have a process hog. A word of though: top on a Mac can be a little hard\
    \ to deal with because it delivers a barrage of too much information. (The Linux\
    \ flavor of top differs from the Mac version, and frankly, more useful.)\n\nA\
    \ alternative to top is htop, which is consistent across platforms and generally\
    \ looks nicer than top. It supports the same keyboard shortcuts I use to sort\
    \ top, but also features searching using the / character. You can install htop\
    \ on a Mac by brew install htop.\n\nBoth top and htop provide information much\
    \ akin to that of the activity monitor or task manager you may already be with.\
    \ Considering making top or htop your go-to tool for quick health analysis.\n\n\
    ## uptime\n\nuptime offers a quick overview of your machine’s health (also shown\
    \ at the top of top). The values returned by uptime include how long your machine\
    \ has been running (handy if you suspect the machine has recently restarted) and\
    \ load averages:\n\n```\n$ uptime\n13:38 up 48 days, 22:40, 9 users, Load averages:\n\
    \  1.37 1.62 1.78\n```\n\nThe load averages show numerical values for the current\
    \ load, the average over five minutes, and the average over fifteen\n"
