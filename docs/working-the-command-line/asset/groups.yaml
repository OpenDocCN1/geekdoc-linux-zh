    If you''re a Windows user, I recommend you get your hands on Git BASH. It comes
    with Git (the version control system), but you don''t have to use Git if you don''t
    want to (FIG 1.3).


    Now you''ve got the same commands and navigation methods as you would on a Linux
    or Mac machine. This is a win for consistency.


    # THE PROMPT


    There''s a certain amount of jargon involved in working with the terminal, some
    of which we''ve touched on already. One of the first things you''ll have to familiarize
    yourself with is the prompt. The prompt is where you''ll enter commands.


    Though usually represented by a $ symbol, the prompt can be really anything (because
    you can customize it, as we''ll see in Chapter 5). It''s not uncommon to see blogs
    and online tutorials start a code block with a $ symbol, which is shorthand for
    "You need to run everything after the $ in the terminal." Note that you don''t
    need to do this; it''s a visual cue for the reader.


    Now that you''ve fired up your terminal, you will be greeted with...well, little:
    a $ symbol and (mostly) blank screen. Yes, you''ll need to know your way around—but
    fear not, that''s why you''re reading this book!


    We''re going to navigate around your hard drive to get a feel for how a path works.
    First, though, let''s explore a little.


    # ls: listing files and directories


    We want to change directory, or cd, into one of the directories listed. It''s
    entirely possible that the output from ls doesn''t make it clear what is a directory
    and what is a:


    ```

    $ ls

    chapter-outline.md chapter1 chapter2 todo.md

    ```'
  - '[PAGE 11]


    ![](img/75faf7950ffd7820aef985d892b0a56e_11_0.png)


    FIG 1.3: Running Windows? Get some Git BASH to make your life a little easier.


    In this case, we want to see clear distinctions between files and directories,
    and we want detailed information about each item in the current directory. Most
    commands can take switches (sometimes also called options or flags): arguments
    that modify how a command is carried out. So we will repeat our ls command and
    add a couple of switches to it: -1 (again, a lowercase ell) which gives us the
    details, -F, which adds a trailing slash to the directories. Note that single-character
    arguments can often be combined together—and here''s what we get:


    ```

    $ ls -lF

    total 16

    --rw-r--r-- 1 remy staff 1226 Aug 7 14:62 chapter-outline.md

    drwxr-xr-x- 3 remy staff 102 Jan 12 10:25 chapter1/

    drwxr-xr-x- 2 remy staff 68 Jan 12 10:25 chapter2/

    --rw-r--r-- 1 remy staff 1900 Aug 7 14:41 todo.md

    ```


    Our output contains lots of information:'
  - '[PAGE 12]


    +   - Total: the first line will give you a total (16, in this case). Don''t let
    this confuse you like I did me. total, here, means the total number of "blocks"
    used, not the total number of files. Just ignore this for the moment.

    - Permissions: where you have access to read, write, or execute (i.e., run) the
    file.

    - Ownership: which user owns the file.

    - File size: given in bytes.

    - Timestamps: the last time the content was modified.

    - Name: of the file or directory.

    - Whether it''s a directory or not: indicated by the d preceding permissions string
    and the trailing slash following the name.


    Now we can tell directories from files. Let''s pick a directory and change to
    it using cd [directory name]. In this case, I want to cd into chapter1:


    ```

    $ cd chapter1

    ~/Dropbox/CLI-book/chapter1

    ```


    Often, I find I want to list the directory contents (so I use -1) by most recently
    modified. So I can use two more switches: the -t switch orders by time, showing
    newest contents, while the -r switch reverses the order—so now the contents will
    display in ascending order, with the newest file is at the bottom. As the command
    lists the directory, the last file is likely to be the one I worked on:


    ```

    $ ls -ltr

    total 264

