    ```

    $ cd ../introducing-html5 # moves to ~/Dropbox/

    introducing-html5

    ```


    Typing one period instead of two means this directory, the one we’re in—also known
    as the current working directory. (We’ll need this when we run our scripts in
    later chapters.) You might understandably think that if I wanted to move up two
    directories, I’d use three dots, but that’s not the case. Instead, I need to use
    multiple parent commands, like cd ../, which means: move to the parent directory
    (the first two dots), then in that directory (/) move to its parent directory
    (the second two dots):


    ```

    $ cd ../.. # moves me to the parent of Dropbox,

    which is ~

    ```


    # Spaces in names


    If you’re using any kind of UI, like OS X or Windows, it’s entirely possible that
    you have a folder or a file name with a space in it. If you try to just cd into
    that folder, it’ll confuse the command:


    ```

    $ cd my cool folder

    cd: too many arguments

    ```


    This doesn’t only apply to cd; it applies to any command. That’s okay, though—we’ve
    got ways to work around that limitation.


    You can enclose the name of the file or directory in double quotes:


    ```

    $ cd "my cool folder"

    ```


    You can use an escape character (\) in front of the space:


    ```

    $ cd my\ cool\ folder

    ```'
  - '[PAGE 15]


    FIG 1.4: Dragging document icons into the terminal eases the pain of typing file
    names.


    Or, if you''re feeling super lazy and happen to have a Mac, you can drag the file
    onto the terminal and it''ll insert the file name for you. Similarly, from a finder
    window, you can drag the icon in the title bar into the terminal, and it''ll insert
    the folder name for you (FIG 1.4).


    # # USING YOUR HISTORY


    As you use the shell, it keeps a record of your commands. (This record is private—particular
    to your account—and not accessible to anyone else who has their own login account
    on your machine.)


    You can use the up/down cursor to cycle through your command history from the
    prompt, but there are also some shortcut commands you can use in the terminal
    that are especially powerful. Let''s go through them.


    > !!, known as bang bang, is shorthand for your last command. So if you run a
    command, hit Enter, run !!, and then hit Enter again, it''ll repeat that command:'
  - '[PAGE 16]


    ```

    $ echo "hello world"

    hello world

    $ !!

    hello world

    ```


    At first glance, it might seem like this is slightly more complicated than pushing
    the *up* cursor key, but the next chapter will show you how you can combine this
    command with other commands to powerful effect.


    # !$


    $!$, pronounced *bang dollar* or *pling dollar*, gives you the last argument of
    your previous command. In our example, the last argument is the part in quotes
    ("hello world"). On the Mac, there''s also a command called *say*. We can use
    !$ to *say* "hello world" after echoing it:


    ```

    $ echo "hello world"

    hello world

    $ say !$

    ```


    This causes your computer to say, out loud, "Hello world." Again, this gets even
    more interesting when you''re able to “pipe” commands together. We''ll talk more
    about piping commands in Chapter 3.


    # !n


    Here, *n* refers to a number, specifically the *neth* entry in your history of
    commands. This number can mark a specific point in the history. A positive value
    works forward through the history, but you can also use a negative value to count
    from the end of the history. For example, you can use *-1* to access the last
    command in your history:'
- md: '

    ```

    $ echo "hello world"

    hello world

    $ !-1

    hello world

    ```


    You''ve already met the bang-bang (!!) command, which is an alias for !-1, but
    it also means if you want to run the penultimate command, you can use !-2 (not
    the last command, but the one before that) and so on, working backward from the
    last command.


    If you run history, you''ll get a complete list of all the commands you''ve run,
    with a history index beside it so that you can quickly reference a more complicated
    command. The history size range depending on your operating system—500 items is
    typical, but some will be 1,000, and others 10,000. (If you want more information,
    search The Googles for "HISTSIZE")

    Here''s my current history:


    ```

    $ history

    10161 boot2docker start

    10169 cd test/a

    10170 nodemon -w ../a.js -V --dump

    10171 z nodemon

    10172 cd tmp

    10175 docker run -v ~/Sites/nodemon:/nodemon -t -i

    10176 ubuntu/nvm:latest /bin/bash

    10177 touch test/a/a.js

    10178 touch test/b/b.js

    10179 cd ..

    10181 git diff

    10182 docker run -v ~/Sites/nodemon:/nodemon -t -i

    node:0.10-slim /bin/bash

    ```


    Notice that the numbers don''t run exactly incrementally. This is the history
    for the current shell session. (If 10173 are missing, it''s because they were
    run in another terminal shell session.)


    The index becomes useful if I want to rerun a command. I can rerun a command by
    copying and pasting the history, like this:


    ```

    $ docker run -v ~/Sites/nodemon:/nodemon -t -i ubuntu/nvm:latest /bin/bash

    ```


    Or, I can save some time and by simply copying and pasting the index number:


    ```

    $ !10176

    ```


    This reran the 10,176th command, and dropped me into my Docker session (which
    is way beyond this book). Using the history index makes referring to historical
    commands really easy.


    # USING THE KEYBOARD


    Although shortcuts aren''t required, it''s always handy to know a few power keyboard
    moves.


    # Tab


    My favorite shortcut is the unsung Tab. All terminals have tab-completion support.
    So if you find yourself typing a command or directory name a lot, you only need
    to enter a bit of text, Tab, and your terminal will try to complete it.


    Different-flavored shells will do slightly different things. Some will complete
    the most common word you use, and hitting Tab again will cycle through the next
    most common match.


    Some will complete up to the point where there''s more than one command that matches.
    For instance, if you have two applications, one called cowsay and one called cowthink,
    typing “co”


    ![](img/75faf7950ffd7820aef985d892b0a56e_19_0.png)


    hitting Tab would complete up to "cow"; then, if you added s and Tab, it would
    complete to "cowsay" (FIG 1.5).


    Often, hitting Tab twice will list all possible matches. In our example, hitting
    Tab twice after typing "co" would show both "cowsay" and "cowothink," assuming
    these were the only commands in your environment path (a list of directories where
    the system can find programs) that started with "co". We''ll go over paths in
    more detail in Chapter 2. (I''ll show you how to install the obviously essential
    cowsay program there, too.)


    # Control-Left / Control-Right


    Instead of using the left/right cursor keys to move through every character, you
    can use ctrl+left or ctrl+right to move by entire words. But! this will only work
    if you don''t use multiple desktops on a system like Mac OS Yosemite, which uses
    these keys to switch desktops (though you can disable this in settings).


    An alternative to ctrl+left / ctrl+right, albeit not one that is easy to use,
    is esc+b for backward and esc+f for forward.


    # Control-C


    This means *abort*. It stops an application from running. If you try running *yes*
    in your terminal, it''ll spew *y* over and over until you hit ctrl+c to abort.


    You might also see this expressed as “C”. (Note that these shortcuts aren''t case-sensitive;
    it''s just the Control and C keys pressed together.)


    # Control-D


    This means *end transmission*, which is basically like saying “GTFO”. Instead
    of exiting your terminal using the mouse (or *logout* command), you can use ctrl+d
    and it''ll close your session.


    # Control-R


    This is a bit of a power-user shortcut, but since we''re reaching the end of Chapter
    1, I think you deserve it.


    Control-R lets you search for the most recent command matching your search term.
    Using my terminal history from earlier, if I hit ctrl+r, I''ll be presented with
    this:


    ```

    $ bck-i-search: _

    ```


    Now if I type “no”, it''ll show the most recent command I ran containing the characters
    *n* and *o* together.


    # OUT OF THE ABYSS


    As this first chapter draws to a close, you''ve nailed the fundamentals. With
    these essentials in hand, let''s look at how we can install third-party tools.


    # APPLICATION INSTALLERS


    Most operating systems come with some core applications. Ruby is one of these;
    there are also built-in commands like `cd`, `ls`, and `echo`.


