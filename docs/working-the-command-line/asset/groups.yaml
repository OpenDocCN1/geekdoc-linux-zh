    ```bash

    $ rm my-file.txt

    $ rm *.txt

    ```


    冷知识：`*` 是一个通配符字符，`*.txt` 被称为 glob。

    这一切都非常直观。不过，你可能会遇到一个棘手的问题：


    ```bash

    $ rm not-my-file.txt

    rm: remove write-protected regular file

    ''-my-file.txt?'' y

    $

    ```


    在你的机器上输入简单的 `y` 就会抹除该文件。目录并没有那么简单：`rm` 并不是真的为了用于目录设计的（尽管稍后我会解释如何绕过这个限制）。如果你尝试删除目录，你会得到一个近乎同义反复的响应：


    ```bash

    $ rm chapter6/

    rm: chapter6/: is a directory

    ```


    哈？


    # 删除目录


    目录有一个特殊的命令 `rmdir`：


    ```bash

    $ rmdir chapter6/

    $

    ```


    这可以运行——只要目录是完全空的。面对现实吧，事实确实如此。此外，如果你正在使用 Mac，你可能会发现到处都是 `.DS_Store` 文件——或者你可能没发现，因为隐藏文件（以点开头的文件）默认是隐藏的。有时，一个看起来是空的目录可能并不空。（你可能想考虑更改系统设置来显示隐藏文件。）

    尝试删除一个非空目录：


    ![](img/75faf7950ffd7820aef985d892b0a56e_47_0.png)


    ```bash

    $ rmdir chapter4

    rmdir chapter4: Directory not empty

    ```


    面对“目录非空”，你可以一个一个地删除单个文件——这非常无聊——或者一气呵地摧毁一切！欢迎来到危险地带，音乐起（图 4.1）。


    # 终极删除！


    `rm -rf` 命令通常是我应对系统想要设置的任何障碍的首选答案。使用 `rm` 配合这两个标志（`-r` 递归处理任何子目录，`-f` 强制删除文件且不进行任何提示）将在无任何提示的情况下删除并破坏任何子目录。


    例如，如果我决定在某个时刻炸掉这本书，运行以下命令将通过一个安静的命令摧毁我所有的心血：


    ```bash

    $ rm -rf cli-book

    $

    ```


    没有提示问我是否确定，或者我是否喝了酒，也没有警告我第 1 到第 5 章即将付诸东流。什么都没有。


    ![](img/75faf7950ffd7820aef985d892b0a56e_48_0.png)


    图 4.2：我的 `rm -rf ~` “玩笑”。


    个人而言，我倾向于太快地使用这个命令。我承认，是的，在我操作终端的这些里，我曾因为手指太快而不小心删除了错误的目录。


    我转发次数最多的推文包含一个玩笑，会导致某人运行 `rm -rf ~`，这意味着“删除我的主目录，并且不要担心任何警告”。我把推文的热度视为人类天生邪恶的证据（图
    4.2）。


    但等一下，`rm -rf` 只作用于你有写权限的文件。那么你不拥有的文件呢？


    # 当你没有权限时：sudo


    `sudo` 代表 Super User Do（超级用户执行）。它就像是你终端的“听口令”。我们已经见过 `sudo` 很多次了，现在我需要履行我的承诺，告诉你们更多关于它的信息。


    为什么 `sudo` 是必要的？因为计算机有一个用户权限系统。如果你正在使用基于 Unix 的机器（再次，这包括 Mac），权限最高的用户是 `root`。


    全能的 `root` 可以做任何事情，从删除你所有的文件（不需要你的权限），到重启，再到删除操作系统上的每一个文件。


    当你登录到机器时，你可能是以你的用户名登录的——事实上也是。你并没有真的执行登录动作，但你就是那个用户。你的用户拥有某些权限，但不像 `root` 那样强大。


    如果你和其他人共享电脑，你可能没有读取、写入或执行他人文件的权限。这就是权限体系。稍后我们会详细查看权限，但如果你遇到一个别人创建的巨大文件而你需要删除它时会怎样？


    删除文件将不起作用，因为你没有权限。


    按照原则，始终尝试不使用 `sudo` 运行，因为使用它有时就像用大锤敲钉子：它确实有效，但并不总是是正确的工具。考虑到这一点，让我们把 `sudo` 加入你的工具箱吧。


    # 使用 sudo


    你可以在终端中的任何命令前加上 `sudo`。这将以超级用户（即 `root`）权限运行你的命令。由于 `root` 可以在不需要许可的情况下删除任何内容，这就是我们如何删除另一个用户的文件：


    ```bash

    $ sudo rm /User/jack/boring-pony.jpg

    ```


    密码：


    输入你的密码，就好了。

    差不多。为了使用 `sudo` 执行某些操作，这就是我们如何删除另一个用户的文件：


    ```bash

    $ sudo rm /User/jack/boring-pony.jpg

    ```


    密码：


    输入你的密码，就好了。

    差不多。

    '
