  - '[PAGE 66]


    # THE SHELL


    There are a number of different shells available with varying customizations,
    but in all likelihood, assuming that you''re on a Mac, your machine will come
    with a shell called Bash. Bash is a good go-to shell if you''re managing servers,
    but if you use your own machine for development, you might want to go for something
    little more powerful.


    # Fish


    Fish Shell is an option with at least one nice advantage: it makes it easy to
    get started by including installers for all platforms, and even includes a standalone
    app for OS X, which is a nice way to preview it.


    I don''t use Fish myself, but I mention it here because it includes a lot of features
    by default: autocomplete, tab-completion, highlighting, and a web configuration
    interface for customizing the theme and prompt (you have to run fish_config).
    If ease of configuration is what you need, this is a good option.


    # Z shell


    Z shell, or zsh, has some great features—but if you really want to get the most
    from it (with the least amount of effort), you''ll also want to install Oh My
    Zsh, a community-driven framework for managing zsh. I like Oh My Zsh because it
    gives me a bunch of plugins and makes them my shell easily.


    My terminal uses the features of zsh to give me a rather special and informative
    prompt: it includes the current directory, Git status, battery power, and whether
    I have a connection to the internet (FIG 5.5).


    Installing zsh is a bit more involved than Fish, but it''s certainly worth the
    extra work. To install it, you''ll use Brew; while you''re at it, go ahead and
    install the Oh My Zsh manager, too:'
  - '[PAGE 67]


    FIG 5.5: Here''s what my zsh prompt looks like today.


    ```

    $ # install zsh

    $ brew install zsh zsh-completions

    $ add oh-my-zsh

    $ curl -L https://github.com/robbyrussell/oh-my-zsh/

    raw/master/tools/install.sh | sh

    $ make zsh your default

    $ chsh -s /bin/zsh

    ```


    Windows users will need an alternative way to get zsh. A project called Babun
    looks promising—it includes zsh as the default shell, with My Zsh also included
    by default. The shell is preconfigured and doesn''t require admin rights to run.
    This could be a nice alternative to the GitBash that you may already be using.


    # Security of curl ... | sh


    It''s worth noting that you should be cautious of anything that asks you to run
    curl -L [URL] | sh. This command effectively runs a remote script on your local
    machine with the same privileges as you have. Potentially (worst-case scenario),
    the remote script could remove your entire home directory. If you''re familiar
    with JavaScript, the equivalent would be including a remote <script src="...unknown.js">
    on a web page. It could be perfectly harmless; it could also be malicious.


    # Z shell themes


    Now that you have zsh installed and set as your default shell, you can select
    a theme and add some plugins to make the shell super awesome.'
- md: '

    There are tons of themes to choose from. Z shell''s default theme is called “robbyrussell”
    (named after the author of Oh My Zsh). Agnoster is a popular theme, but it requires
    custom fonts. My prompt is a modification of the Agnoster theme—mainly a riff
    on its prompt. I will explain the prompt in the next section so that you can create
    your perfect fit.


    A complete list of preinstalled themes is available on the Oh My Zsh wiki, with
    screenshots for each. There are also external themes that do not come bundled
    with Oh My Zsh, but the links include directions on how to install them.


    To select your theme, you need to edit the .zshrc file in your home directory.
    If you can do this in your favorite editor, go ahead and open the file. If you''re
    using Sublime Text like me, though, the file will be hidden (dotsfiles are hidden
    by default).


    One thing you can do to get around this is to use open (if you''re on a Mac) and
    hope the file opens in an editor:


    ```bash

    $ open ~/.zshrc

    ```


    Otherwise, you can try using a terminal editor program called by typing nano ~/.zshrc.
    The commands to save and exit run along the bottom of the window, so it''s pretty
    self-explanatory (fig 5.6).


    Find the line that contains ZSH_THEME="robbyrussell" and update it to any name
