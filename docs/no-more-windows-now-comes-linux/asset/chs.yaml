- "# 告别 Windows！Linux 来了！\n\n\n\n![](img/image_rsrc1GW.jpg)\n\n\n\n## 这本书：\n\n我的第一次电脑体验是使用\
  \ `MSDOS` 和 `Commodore C64` 运行 `BASIC`。随后，我在德意志联邦共和国见证了 `Windows` 的诞生，我的第一台 `Windows`\
  \ 是 `Windows 3.1`，它仍然基于 `DOS`。`Windows 95` 同样是一个基于 `DOS` 的系统。\n\n多年来，我执行了从 `Windows\
  \ 3.1` 到 `Windows 11` 的无数次安装——通常是因为我在对底层进行捣鼓时导致了操作系统崩溃。直到今天，这是一段奇妙的旅程。但现在，`Windows`\
  \ 和电脑不再仅仅是极客们使用的技术设备。计算机 已经成长为塑造世界进程的系统。\n\n食品生产、医疗保健、技术进步甚至战争——没有了计算机，我们的社会将无法生存。但这本书将仅简要触及这些话题。首先，我想向个人展示即使在今天也能尽可能保持数据私密的方法。而在将数据掌握在自己手中方面，`Windows`\
  \ 变得越来越不再合适。\n\n我想向你们介绍一种 `Windows` 的替代方案，它具有巨大的优势。为了简单起以及从 `Windows` 到 `Linux`\
  \ 的平滑过渡，我选择了非常流行且广泛使用的、基于高度稳定的 `Debian` 的 `Linux Mint`。它的优势显而易见：这个开源系统是由社区开发的，而不是一家以利润为导向的公司。没有社区可能忽略的隐藏代码部分。你对数据拥有完全控制权，没有强制性账户，极其稳定性，并且每个\
  \ `Windows` 软件都有替代方案。最好的部分：一切都是免费的！\n\n今天，我们没有人知道这段旅程最终将通向何方，无论是使用 `Windows` 还是\
  \ `Linux`。然而，在 2024 年，涉及到数据隐私、成本平衡和数据主权，没有比 `Linux` 更好的选择了。简单来说，如果你希望你的数据在 2024\
  \ 年仍然属于自己，`Linux` 是唯一选择。未来会发生什么？让我们拭目以待——这将是非常有趣的！\n\n## 作者：\n\n![](img/image_rsrc1GX.jpg)\n\
  \nRalf-Peter Kleinert，1981 年 1 月出生于柏林附近的海尼格斯多夫，一个真正的东德公民。自从 `Commodore C64` 出世以来，我就学习了我能接触到的所有计算机知识。\n\
  \n它的美好之处在于，我见证了整个发展过程——从缓慢笨拙的机器到今天放在我办公桌下的性能怪兽。例如，智能手机的性能就超过了那时所有的计算机。我对计算机的了解和学习的动力使我越钻越深入这个领域。\n\
  \n现在，我在网站上分享我的部分知识并撰写这本书。程序改进了，互联网诞生了。今天，我主要作为一个社交媒体经理工作。作为自 `Windows 95` 来的 IT\
  \ 和计算机专家，我可以回顾多年充满“计算机问题”的岁月。我相信，正是因为计算机引起的问题，专家们才得以成长。\n\n当社交网络在 `Web 2.0` 开启时，所有的学习突然有了更深层的意义。独自坐在房间里已成为过去。突然，计算机联网了，与人们的交流开始了，而不仅仅是处理一堆软盘。我几乎不知道以前是否有许多志同道合的人。起初，只有极客在网上见面，他们有时会被嘲笑或嘲弄。今天，联网已成常态，因为几乎每个人都在线。\n\
  \n从 2010 年至 2012 年，我在 `Silicon Studio Berlin` 完成了理想的媒体设计师培训。在这里，我能够巩固并扩展我的知识。由于我也有摄影经验的经验，我还额外在“One\
  \ I A Fotostudio”完成了一份实习。摄影是社交媒体管理的一个重要方面，并深化了我在这一领域的技能。\n\n### 我的证书包括：\n\n- IT\
  \ 安全 - 针对中小企业和初创企业的保护\n- 网络技术、网络安全与 `Wireshark`\n- 网络安全 - 防御黑客攻击\n- 使用 `Fail2Ban`\
  \ 的 `Linux Firewall` 防御破解攻击\n- 完整 SQL 大师课程\n- `Linux Administration` 与系统管理\n- 在\
  \ `Linux Ubuntu` 上安装、设置和使用 `Nextcloud`\n- `Microsoft Azure Administrator`\n- `Microsoft\
  \ 365 安全管理员`\n- `Microsoft 365 身份与服务`\n- 工业网络安全 2024\n- 使用 `Kali Linux` 进行伦理黑客攻击\n\
  - `Microsoft Active Directory Windows Server 2022`\n\n### 额外培训：\n\n- 计算机网络 (`CompTIA\
  \ Network+`)\n- 计算机安全 (`CompTIA Security+`)\n\n## 1. 引言\n\n亲爱的读者们：\n\n在书中，我想带你们开启一段激动心的旅程，离开\
  \ Windows 世界，进入一个全新的开放且灵活的环境：Linux。从像 Windows 这样成熟的操作系统切换似乎具有挑战性，但我坚信，在读完这本书后，你将具备所需的知识和信心来成功迈出这一步。\n\
  \n我们将共同探索 Linux 的许多方面，从安装到日常使用，并向你展示如何通过这个强大的操作系统重新定义你的计算体验。我的目标不仅是教你技术基础，还要向你介绍\
  \ Linux 所提供的哲学和自由。准备好迎接改变吧——不再有 Windows，现在是 Linux！\n\n诚挚的，\n\nRalf-Peter Kleinert\n\
  \n请在阅读后为本书评分；只有这样我才能改进。\n\n## 2. 为什么要从 Windows 切换到 Linux？\n\n出于数据隐私和安全的考虑。这是一个非常直接的总结。\n\
  \n重要提示：永远不要鲁莽或草率地行动。即使已经决定从 Windows 切换到 Linux 也如此！在完成第 18 章之前，不要开始`killing Windows`！\n\
  \n我从 `Windows 3.1` 版本开始就一直使用 Windows。那时，计算机还是一种新奇的事物，一切都极其有趣且令人兴奋。但多年来，微软演变成了一个贪婪的数据章鱼。今天，我们已经达到了这样一个程度：数据隐私在选择操作系统时起着核心作用。因此，在我的新书《改用\
  \ Linux 代替 Windows》中，我向你介绍了 Windows 的缺点以及 Linux 对应的优点。显而易见，这两个系统都有优缺点——但如果你说“数据属于我”，那么其中一个候选者在负面方面脱颖而出。\n\
  \nWindows 由微软开发，目前是全球使用最广泛的终端用户操作系统，提供了许多功能，并安装在无数计算机上。然而，尽管它广受欢迎且功能强大，但仍存在用户应该考虑的重大隐私担忧。在我的书中，我详细描述了\
  \ Windows 在隐私方面的主要缺点，包括强制账户、`OneDrive` 的集成、易受病毒攻击以及更新问题。\n\nWindows 在隐私方面的一个核心缺点是所谓的“强制账户”。自\
  \ `Windows 8` 以来，微软日益推动用户使用 Microsoft 账户登录以充分利用操作系统的潜力。创建账户的要求引发了重大的隐私担忧，因为微软可以获取大量的个人数据。这包括电子邮件、联系人、日历数据，甚至是跨不同设备同步的设置和偏好。这种中心数据存储存在着风险，即敏感信息可能在用户不知情或未同意的情况下被收集并可能使用。微软无法可信地声称这些敏感数据未被用于其他服务或其他新服务的开发。\n\
  \n另一个重大批评是 `OneDrive` 的集成，这是微软的云存储服务，通常在没有经过用户同意的情况下被激活。文件和文档会自动上传到云端，这不仅危及隐私，还限制（往往是移除）了用户对自身数据的控制。特别是在处理敏感信息的环境中，这种自动同步可能会带来巨大风险。此外，我们现在知道所有上传到云系统的数据都会被读取和分析。如果数据被微软的过滤器标记，账户可能会被挂起，数据可能会不可挽回地丢失。\n\
  \n此外，Windows 以易受病毒攻击而闻名。由于其使用广泛，该操作系统是恶意软件和黑客攻击的主要目标。这些威胁可能导致个人数据的窃取或泄露。尽管有持续的安全更新和集成保护机制，风险仍然存在，特别是对于那些不经常安装安全更新或使用额外保护软件的用户来说。\n\
  \n另一个问题是 Windows 频繁且有时存在问题的更新。微软定期执行更新以修复安全漏洞并提高操作系统的性能。然而，这些更新往往会有意想不到的副作用，影响系统的稳定性。更糟糕的是，某些更新是在没有预先通知或用户同意的情况下进行的，这可能导致意外重启和数据丢失。这种更新问题不仅代表了不便，如果计划之外的系统更改导致新的安全漏洞，还会危及用户的安全和隐私。\n\
  \n每天都显而易见，Windows 尽管有许多优点且被广泛使用，但在隐私方面有严重缺陷。强制账户要求、强制集成的 `OneDrive`、易受病毒攻击以及存在问题的更新对用户隐私和安全构成了严重威胁。因此，让用户意识到这些风险并采取适当措施保护其数据至关重要。这包括使用额外的安全软件、仔细管理云服务，以及定期检查和调整操作系统的隐私设置。这一切导致了一系列后续的缺点：持续的、甚至是每天的警惕和检查、付费的额外软件，以及系统完全崩溃的日常风险。这并非空口无言。整个系统可能因为错误的更新而在午夜之间瘫痪。在我看来，微软已经失去了核心，不再意识到自己在世界中的地位。在我看来，微软为整个世界代表了重大的安全问题，不应允许其在没有政府监管的情况下作为营利性公司运营。\n\
  \n## 3. 2024 年 7 月 19 日的全球 IT 宕机\n\n从 2024 年 7 月 19 日开始，新闻到处报道，由于 `Crowdstrike`\
  \ 公司的一个 Windows 安全软件的错误更新导致了大规模崩溃。我不会在这里详述厂商问题的具体细节，因为所有信息可以在网上找到。\n\n\n\n\n与此同时，365\
  \ 服务、Outlook、Teams 等在德国、英国、西班牙、美国和印度全部瘫痪。其影响范围尚无法量化。银行、医院、公司、个人和机场——一切都“宕机”了。我经常在\
  \ Facebook、Instagram 和 LinkedIn 上发布过，这一天终会到来。每当我与 `Telekom`、`WhatsApp-Sim` 或 `Freenet-TV`\
  \ 等技术支持人员交流时，我总是说那句话：“人类正在失去对技术的控制！”\n\n## 4. 我想要公开我的数据吗？\n\n考虑到 `Windows`，或者说 `Windows`\
  \ 背后的 `Microsoft` 公司所带来的所有负面影响，每个人都应该问自己：»我想要吗？«\n\n我现在将提出许多 »我想要……«的问题，仅仅是为了向你展示你真正应该问自己的问题。\n\
  \n我想将所有数据都托付给 `Microsoft` 吗？我想让 `Microsoft` 决定我可以使用哪些程序或应用程序吗？我想让 `Microsoft` 在不询问我的情况下对我的\
  \ `PC` 或笔记本电脑进行软件更改吗？我想在 `Start` 菜单中看到广告吗？我想在文件夹和设置中看到广告吗？我想被 `Microsoft` 俯教吗？\n\
  \n我想让 `Microsoft` 在我的 `PC` 上安装 `AI` 系统吗？我想让这些 `AI` 系统全天候拍摄我的屏幕吗？我想让 `Microsoft`\
  \ 为我提供一个旨在将我的数据移动到云端的备份系统吗？我想让我的文件、照片和视频传输到云端，并可能被 `Microsoft` 以及可能的第三方读取、筛选并用于训练\
  \ `AI` 系统吗？我想继续接受那些存在存在问题且测试不足的更新所带来的风险吗？\n\n我想把我的电子邮件流量、文档和文件放在一个存在故障风险的云端吗？我想让\
  \ `Microsoft` 继续工作将我的整个 `PC` 迁移到云端吗？我想放弃所有的数据吗？\n\n此外还有几个你应该问自己的问题：我能否接受无法访问自己的数据，因为……\n\
  \n... 网络再次无法工作了？\n... `Microsoft` 云端再次崩溃了？\n... 网络就是太慢了？\n... `Microsoft` 不喜欢我数据的某些之处？\n\
  ... `Microsoft` 再次被黑客攻击了？\n... 我的 `Microsoft` 账户被盗取了？\n\n我想继续为软件付费并为使用 `Microsoft`\
  \ 的服务付费吗？\n\n如果你对所有这些问题的回答都是»是«，那么就继续使用 `Windows` 吧。然而，如果你有顾虑，并觉得将所有数据迁移到云端并不理想，且乐意将数据托付给\
  \ `Microsoft` 等人，那么让我们探索一下目前有哪些选择。\n\n由于 `Windows` 以收集越来越多的用户信息、建立强制账户并日益将其系统迁移到云端而闻名，问题是：你真的想要那样吗？你想要所有的个人数据都存储在互联网上的某个服务器上，而这些服务器是\
  \ `Microsoft` 以及可能的第三方（如黑客）可以访问的吗？这种发展不仅引发了伦理问题，还引发了安全关注，值得仔细审查。\n\n我们今天所生活的数字世界的特点是持续的连接以及将越来越多数据移动到云端的驱动力。这种中心化的存储初看可能很方便——你可以从任何地方访问文件，你的设置是同步的，你的软件始终是最新版本。但所有这些优势的代价都是昂贵的：对自己数据的控制权。每一次点击，每一次使用云服务，你都放弃了一部分控制权，并将其交给一个业务模式并不一定符合你利益的公司。\n\
  \n更令人担忧的是系统和数据向云端的转移。你的个人数据——无论是文档、照片、电子邮件，甚至是你的整个计算机环境——都存储在你无法看到或控制的服务器上。这些服务器通常位于遍全球的数据中心，并受相应国家法律的约束。在许多情况下，这意味着你的数据受到其他国家法律法规和执法权的限制，这可能导致隐私丢失和风险增加。\n\
  \n另一个问题是安全。存储大量数据的服务器是黑客极具吸引的目标。尽管像 `Microsoft` 这样的公司投入了大量资源来确保系统安全，但无法保证云端的数据是安全的。数据泄露、勒索软件攻击和其他网络威胁无处不在，即使是最大、最安全的公司也无法免疫。如果攻击成功，你的数据可能会被盗取、删除或滥用——对你的个人和职业安全可能会产生毁灭性的后果。\n\
  \n此外，你应该考虑数据存储在云端后会发生什么。关于你的数据如何被使用并没有完全透明。大多数用户假设他们的数据只是被存储，但有迹象表明某些公司还将这些数据用于其他用途。一个特别争议的问题是使用数据训练人工智能\
  \ (`AI`)。`AI` 系统需要大量数据来学习和改进，而你上传到云端的数据理论上可以用于训练此类系统。虽然这可能会改进服务，但它引发了关于隐私和对个人信息控制权的严重问题。\n\
  \n所有这些发展都指向一个核心问题：你真的想要这些吗？你真的想要像 `Microsoft`——或任何其他公司——对你的个人和数字生活有如此深入的洞察吗？你真的想要让你的数据存储在你无法直接访问且无法亲自监控其安全性的服务器上吗？将数据存储在云端的相关风险是巨大的，在选择这种路径之前，理解这些风险至关重要。\n\
  \n继续使用 `Windows` 并接受所有这些顾虑，还是选择 `Linux` 这样的替代方案，取决于你。然而，这是一个应该深思熟虑的决定。`Linux` 为你提供了重新获得数据和数字环境控制权的机会。它给了你保护隐私的自由，并让你按照自己想要配置系统——而无需承受不断披露个人信息的压力。在一个日益被少数大公司主导的世界里，这种自由是无价的。\n\
  \n既然你已经购买了这本书，我假设决定已经做出了。然而，你可能还没有确切知道如何完成一次干净的过渡。在本书中，我为你提供从 `Windows` 到 `Linux\
  \ Mint` 的直接过渡。为什么？我将在下一章回答。\n\n## 5. 网络问题\n\n在德国，人们经常近距离体验网络基础设施的缺陷。无论是速度慢、连接不稳定，甚至是大规模的停机，网络问题都是持续的困扰。在宽带扩张中落后的地区经常与极其糟糕的连接作斗。但即使在理论上覆盖范围更好的城市地区，也经常存在弱点。当你考虑到洪水、风暴或大雪等自然灾害可能会完全瘫痪网络时，这些问题会变得更加严重。此类事件不仅仅是暂时的中断；它们可能导致数天甚至数周无法上网。德国各地区的近期洪水显示了基础设施崩溃得有多快。\n\
  \n\n\n\n当你的数据存储在云端且网络发生故障时（无论是由于基础设施薄弱还是自然灾害），你就会失去对这些数据的访问。一个简单的例子是：坐在柏林的地铁里，你就能体验到依赖云端服务带来的日常问题。在地下，网络覆盖往往是断断续续或不存在的。突然，你无法访问你的文档、照片或电子邮件，因为它们存储在只能通过互联网访问的远程服务器上。在这些时刻，这似乎只是一个微小的困扰，但当你将对云服务的依赖扩展到整个操作系统时，问题的严重性就显而易见了。\n\
  \n随着 `Windows 365` 等云端操作系统的日益普及，这个问题变得更加紧迫。如果整个操作系统都在云端且互联网中断，你将完全陷入瘫痪。你的电脑将变成一台昂贵但无用的电子产品，在没有云端连接的情况下毫无用处。对于个人用户来说，这可能已经足够恼人了，但对于企业来说，这可能是致命的。依赖系统持续可用性的公司在最坏的情况下如果失去对\
  \ IT 系统的访问，可能完全停止运营。\n\n由于互联网连接中断而导致业务瘫痪的想法令人不安。看看大型云服务商发生的全球性故障，我们几乎每天都受其影响，即使新闻中只是简略提到。此类故障可能由多种因素引起——技术故障、网络攻击或简单的人为错误。每当此类故障发生时，数百万用户受到影响，突然失去对数据和服务的访问。这不仅影响了大型公司，还影响了依赖云服务开展日常工作的中小型企业。\n\
  \n这种对云日益增长的依赖相关的风险是巨大的。当你的数据和应用程序专门存储在云端时，你就将对数字生活的控制权交给了第三方。你依赖于互联网随时随地的可用性——遗憾的是，这一要求在德国许多地区并无法满足。此外，你的工作安全取决于存储数据的服务器的稳定性和安全性。故障或中断可能会产生超出生产力损失的深远影响。\n\
  \n考虑到所有这些因素，显而易见的是，依赖如 `Windows 365` 等云端解决方案带有严重的风险。这些风险不应被轻率对待。虽然云端确实提供了许多优势，但忽视相关的挑战和潜在危险是非常关重要的。这关乎在便利与控制之间找到平衡，并意识到选择云端基础设施可能会产生深远的影响。\n\
  \n在这种背景下，`Linux` 提供了一个具有吸引力的替代方案。通过 `Linux`，你保留了对数据和操作系统的控制权。你不必依赖永久的互联网连接，你的数据保留在你自己的设备上，你可以对其进行管理和保护。即使在网络中断期间，你也可以继续高效工作并访问数据，因为它们存储在本地的。在一个互联网可用性远无法保障的世界里，这种独立性特别有价值。\n\
  \n归结底，问题是：在一个日益不安全的数字世界中，你想要依赖一个不受你控制的基础设施吗？还是你愿意将自己的数据和工作掌握在自己手中，享受像 `Linux` 这样的操作系统提供的自由？这个问题的答案对于塑造你的数字未来可能至关重要。\n\
  \n## 6. 云的风险\n\n数据向云端的日益迁移通常被描绘为方便、灵活和现代。企业和个人看重云端服务提供的优势：从跨地区的简单协作到文件和系统的自动备份。然而，这些便利也伴随着风险。一个经常被忽视的问题是，如果云服务商破产、被黑客攻击或被另一公司收购，你的数据会发生什么——这些场景已经发生，并可能导致灾难性的后果。\n\
  \n想象你将整个数字生活都托给了一个云服务商。你所有的文档、照片、业务数据，甚至可能还有电脑操作系统都存储在云端。你依赖这些数据的安全性和随时可访问性。但如果你托付这些数据的供应商突然遇到财务困难并不得不宣布破产，会怎样？在过去，我们看到过云服务商突然关闭其服务，无论是由于财务问题还是严重的安全事件。如果发生这种情况，你对数据的访问可能一夜之间消失。在最坏的情况下，你的数据甚至可能被无法挽回地删除，因为如果服务商停止运营，没有任何恢复计划。\n\
  \n另一个日益可能的场景是针对云服务商的大规模黑客攻击。此类攻击可能产生毁灭性的后果，特别是当它们导致数据被加密并勒索时。一个著名的例子是 2014 年对 `Code\
  \ Spaces` 的攻击。黑客获取了该公司的 `Amazon Web Services (AWS)` 账户并加密了所有数据。在公司无法支付所要求的赎金后，数据被无法挽回地删除，最终导致了\
  \ `Code Spaces` 破产。在这一云中存储数据的客户失去了一切——不仅是数据，还有对云服务安全性的信任。此类案例表明，即使是最声誉卓越的云服务商也无法免受网络攻击，对用户的后果可能是严重的。\n\
  \n但即使供应商没有破产或被黑，，还有另一种风险：公司收购。在快速发展的科技行业中，一家公司收购另一家公司很常见。当这种情况发生时，数据可能会从一个供应商转移到另一个供应商，往往跨越国且没有全面的用户通知。这可能导致你的数据突然存储在一个数据保护法完全不同的国家，那里的保护可能比以前少。例如，你可以想象一家欧洲云服务商被一家美国公司收购。突然，你的数据可能会受到不严格的美国数据保护法的约束，且在你的不知情或不同意的情况下。更令人担忧的是，这些传输通常以不透明的方式进行。直到为时已晚，你可能永远不会发现你的数据已从一个供应商移动到另一个供应商。你可能无法对这种传输提出异议，或在移动之前保护你的数据。这引发了关于你的个人和业务信息的控制与安全的严重问题。你能确定在外国的数据保护得像在本土一样好吗？你能确定新供应商保持与原供应商相同的安全标准吗？这种不确定性是一个经常被低估的重大风险。\n\
  \n让我们把这种情况与日常事物进行对比：你会仅仅把钱包留在一个繁忙的火车站并指望它保持安全吗？可能不会。你会担心有人可能会发现并拿走它，而你对此无所知。同样，对于你云端的数据，当你将数据托付给第三方时，你就失去了对谁可以访问、何时以及如何访问这些数据的直接控制。你可能不知道哪个国家的人正在存储、处理甚至转售你的数据。就像火车站的钱包一样，你的数据可能落入某人手中，并在你没有察觉的情况下被误用。\n\
  \n\n\n\n\n你的敏感信息——无论是个人文档、财务数据还是业务关键信息——都存储在云端，而你并不完全清楚谁可以访问它们或它们存储在何处，这应该引发你进行批判性思考。云服务提供的便利和易用性不应掩盖它们所带来的巨大安全和控制风险。当你发现自己处于提供商破产、被黑客攻击或迁移到法律不同的国家的情况下时，这些风险会变得更加严重。\n\
  \n因此，如果你怀疑将数据存储在云端是否真的安全，你还应该考虑你对这些数据的实际控制权其实有多小。这种不安全模型的替代方案是重新获得对自己数据的控制权——例如使用如\
  \ `Linux` 这样的本地操作系统，让数据保留在你自己的硬件上。在这里，你对谁可以在何时以及何如何访问你的数据拥有完全的控制权，而且不受不稳定或不安全的云提供商的不确定性的影响。\n\
  \n在这个数据变得日益昂贵的世界，你应该仔细考虑将你的数字宝藏托给谁。失去对自身数据的控制权可能会产生深远的影响，远不止丢失钱包那么简单。它涉及到安全性、机密性，最终涉及到你信息的主权。通过在本地存储数据并依赖那些赋予你控制权的解决方案，你可以确保在这个日益连接的世界里睡得安稳——知道你的数字资产是安全且受保护的。\n\
  \n应该对全球最大的云提供商进行特别的关注：`Google`、`Amazon`、`Facebook` 和 `Microsoft`。这些科技巨头总部位于美国，与欧盟相比，该国的数据保护法律要宽松得多。这并不是一个微不足道的区别，而是一个可能对你的个人和业务数据处理方式产生巨大影响的因素。这些公司在利用你的数据方面几乎不受限制，这一事实往往被低估——然而，这正是每天都在发生的事情。\n\
  \n这些美国公司运营的法律环境，该环境允许它们在使用、分析和利用用户数据方面拥有广泛的自由。虽然欧盟的《通用数据保护条例》（`GDPR`）等数据保护法试图保护公民的隐私，但美国的法规要松散得多。这允许大型科技公司按照自己的意愿收集和处理数据。而他们充分利用了这一点。\n\
  \n尽管有这些松散的数据保护做法，`Google`、`Amazon`、`Facebook` 和 `Microsoft` 仍然受到全球数百万甚至数十亿人的信任。这些公司成功地将自己定位为不可或缺的服务提供者——无论是通过搜索引擎、社交网络、电子商务平台还是云端软件解决方案。许多人每天使用它们的服务，往往没有完全意识到这些公司对他们的个人和职业数据侵入得有多深。他们提供看似免费或廉价的服务，但用户支付的真实代价是失去了对数据的控制权。\n\
  \n一个特别棘手的问题是这些公司进行的大量数据分析。他们所拥有的能力比欧盟任何经验丰富的技术专家所梦以求的先进得多。上传到云端的每一封邮件、每一份文档、每一张图像都会经过过滤、分析和分类。这种分析不仅是为了改进服务或显示个性化广告，还为了创建全面的用户画像，这些画像可以被用于各种目的——从市场研究到政治影响。\n\
  \n问题在于，这些过程在欧盟内部既无法透明地追溯，也无法从内部被有效防止。虽然 `GDPR` 试图监管和控制流向美国的数据流，但事实表明，一旦数据离开欧洲边界，用户想要确切知道其数据发生了什么几乎是不可能的。此外，这些公司的条款和隐私政策通常达数百页，且使用的语言即使对专家来说也难以理解。这些文档的设计极其复杂且全面，以至于大多数用户在不阅读的情况下直接接受了。通过这种方式，他们同意了自己连皮毛都不了解的做法。\n\
  \n许多个人和企业后悔将所有数据迁移到云端只是时间问题。一旦他们放弃了对数据的控制权，就将受于这些大公司决策和做法的影响。如果法律框架发生变化或这些公司决定改变其业务模式，用户可能会发现他们的数据被以他们从未意过的方式使用。\n\
  \n这一日的到来可能由多种因素触发：重大的数据滥用丑闻、服务条款的突然更改、被另一家对数据保护关注更少的公司收购，甚至是一个限制或控制访问这些数据的政治事件。在数据即新石油的世界里，将这一宝贵资产托给一个在法律未能充分保护这些数据的国家运营的公司是有风险的。\n\
  \n因此，问题在于，信任这些很大程度上运营在欧盟影响及其严格数据保护法之外的公司是否真的是明智之举。你会把把钱包随手丢在到处并相信没人会碰它吗？可能不会。然而，许多人在将数据托付给这些云服务而却不知道确切谁可以访问、何时以及如何访问时，正是他们所做的。\n\
  \n因此，了解风险并考虑替代解决方案是非常关重要的。允许你控制自己数据的操作系统和业务（如 `Linux`）提供了一种真正的替代方案。它们为你提供了在本地存储数据并按照你自己的条款保护它的机会，而不必依赖大型科技公司那些晦涩且往往不透明的做法。\n\
  \n数字世界正变得日益复杂，追踪谁对我们的数据做了什么变得越来越困难。但有一点是明确的：保持对我们自身数据的控制对于我们的数字主权和隐私至关重要。是时候认真对待这一方面，并意识到当我们把数据交给这些大公司时我们正在放弃什么了。因为我们为此付出的代价可能比我们想象的要高得多。\n\
  \n## 7 云的能耗\n\n虽然你的电脑、笔记本电脑甚至服务器只消耗几百瓦，如果是较大的服务器则消耗几千瓦，但很难想象云服务消耗了多少能量。你认为仅上传 1\
  \ GB 数据到云端需要多少能量吗？请看：\n\n云服务的能耗是巨大的，而且往往被低估。仅仅向云端上传 1 GB 数据就需要大量的能量。这不仅由于传输本身，还由于运行这些云服务的巨大数据中心中的存储和许多相关过程。这些数据中心由数千台全天运行的服务器组成，需要冷却并需要稳定的电力供应。这些大型服务器场不仅消耗大量的能量，对碳排放也有很大贡献。\n\
  \n数据中心，特别是由 `Google`、`Amazon` 和 `Microsoft` 等主要提供商运营的数据中心，需要巨大的基础设施来处理每天流过互联网的数据。这些中心通常有几个足球场大，在许多情况下，其耗电量超过了整个城市。服务器本身产生的热量需要通过强大的冷却系统散热，而这些系统又会消耗更多的能量。\n\
  \n\n\n\n2017 年的一份绿色和平组织报告显示，最大的云服务提供商的数据中心消耗的能量已经超过了当时的许多小国家。尽管这些公司正试图减少排放并转向可再生能源，但能源需求仍然巨大且在持续增长。\n\
  \n考虑到许多数据中心位于电力仍主要来自化石燃料的国家，这一点变得尤为关键。这意味着每上传 1 GB 数据的碳足迹比人们想象的要大得多。你上传到云端的 1 GB\
  \ 数据需要消耗几千瓦时的能量，而这仅仅是个开始——这些数据需要存储、处理，并可能在全球范围内进行镜像，以确保其随时可用。\n\n这引出了另一个重要的一点：云端数据的持续可用性和冗余。为了确保你的数据不丢失，它通常存储在跨大陆的多个数据中心。这意味着\
  \ 1 GB 的数据不仅被存储一次，而且在这些巨大的服务器农场中存储多次，并不断进行同步。能量消耗随之倍倍增加，与之相关的二氧化碳排放也是如此。\n\n因此，将单个设备（无论是笔记本电脑还是服务器）的能耗与云服务的能耗进行比较，可以很快地看出云服务消耗了大量的资源。虽然你的家用电脑只在使用时才消耗能量，但数据中心的服务器无论数据是否正在被访问，都是持续运行的。\n\
  \n对于具有环保意识的用户来说，这意味着使用云服务也伴随着生态责任。意识到使用这些服务相关的环境成本是重要的，并且尽可能考虑能源强度更低的替代方案。\n\n简而言之：云服务可能方便且实用，但它付出了高昂的能源代价，这最终会影响环境。\n\
  \n## 8. 德国云服务的优势\n\n当然，我并不是想声称云服务没有益处。相反，它们无疑有其理由和实用的应用场景。完全忽视云服务的优势是不现实且不公平的。像\
  \ `Google Drive`、`Dropbox` 或 `OneDrive` 等服务提供了巨大的灵活性，允许从任何地方轻松访问数据。这使得它们成为许多用户（尤其是公司）数字日常生活中不可或缺的工具。同步文件、协作项目或仅仅对重要文档进行备份的能力都是实用且高效的。\n\
  \n我自己也使用云服务，但非常谨慎。我使用 `Ionos` 的云服务就是一个例子。然而，我将自己限制在他们的 `Hidrive` 服务上，我专门将其用于安全存储我的备份数据。这给我了一个优势，即可以在外部位置保护我的数据，而无需依赖那些可能深度侵入我数字生活的云计算服务。关键区别在于我在数据上传到云端之前是如何处理它的：我在我的\
  \ `Linux` 系统上对其进行加密，这样一旦它们落到 `Ionos` 的服务器上，它们只会表现为无法理解的数字乱码。\n\n这种方法有几个优点。首先，即使有人获取了我在\
  \ `Ionos` 服务器上的数据访问——无论是通过安全事件还是未经授权的访问——只要加密没有没有被破解，这些信息将是完全不可读且毫无价值的。其次，由于 `Ionos`\
  \ 总部位于德国，我的数据受到德国 `GDPR` 严格数据保护法规的保护。这意味着 `Ionos` 有义务尊重我的隐私，不能简单地解密或进一步处理我的数据。如果发生违规行为，公司将被迫付出巨大的代价——代价大到我再也不必为此担心。\n\
  \n这与 `Google`、`Amazon`、`Microsoft` 或 `Facebook` 等公司形成了鲜明对比，这些公司总部位于 `USA`，其数据保护标准要松得多。如果认为这些公司在想做的情况下无法解密加密数据，那是天真的。即使是最好的加密也不是不可破解的，而且随着计算能力的提高——关键词是量子计算——未来有一天可能破解即使是最稳健的加密方法。但这不仅是一个技术可行性的问题，还涉及到法律和伦理框架，而\
  \ `USA` 的这些框架比 `EU` 要松散得多。\n\n这种考量导致了一个重要的发现：虽然云服务确实提供了益处，但我们应该始终意识到其风险和局限性。盲目信任在另一个大陆运营且其目标并不总是与我们价值观一致的大型\
  \ `US` 巨头，总有一天会让我们付出沉痛代价。即使今天一切看起来运行顺畅，我们也必须问自己，我们是否真的准备好从长期放弃对数据的控制。\n\n这并不意味着我们应该完全避免云服务。它们为本地存储的数据提供了有意义的补充，如果使用得当，可以增加我们数字信息的安全性和可访问性。然而，关键在于以必要的谨慎态度使用正确的服务。这意味着在数据进入云端之前对其进行加密，并选择遵守\
  \ `EU` 严格数据保护法的提供商。\n\n但我们不能忘记，数据保护是一个不断演变的动态领域。量子计算等技术有一天可能会破坏今天的最佳加密。因此，跟踪该领域的发展并相应调整我们的安全策略至关重要。虽然\
  \ `Ionos` 目前代表了一个值得信赖的解决方案，但未来可能会发生变化——我们必须做好应对准备。\n\n总之，云服务确实提供了不可否认的益处。然而，选择正确的提供商并妥善管理我们的数据对于保持控制至关重要。如果我们意识到这种责任并采取相应行动，我们就可以利用云服务的同时而不牺牲我们的数字安全和隐私。\n\
  \n## 9. Ionos 德国云，HiDrive\n\n云服务无疑提供了多种优势，特别是在从任何地方访问数据和自动同步方面。然而，使用云服务带来的风险，尤其是使用\
  \ `Google`、`Amazon`、`Microsoft` 和 `Facebook` 这样的大型提供商，不应被低估。\n\n\n\n这正是 IONOS 发挥用场的地方，这是一家位于德国的云供应商，严格遵守\
  \ GDPR（通用数据保护条例）。您在 IONOS 所有数据都存储在经过 ISO 27001 认证的德国数据中心，符合最高安全标准。此外，IONOS 为存储数据提供\
  \ AES-256 位加密，如果您在上传前对数据进行加密，即使是服务商也几乎无法访问。与位于美国的云服务相比，这是一个关键的优势，因为后者往往会受到当地政府机构的监控。\n\
  \n另一个不容低估的一点是 IONOS 卓越的客户服务。其支持不仅易于获取，而且提供专业的协助，这在关键情况下可能至关重要。在与其他更廉价的服务商有过经历后，我最终还是回到了\
  \ IONOS，因为其安全收益和支持远超略高出的成本。\n\n此外，IONOS HiDrive 服务的价格非常公道。每月约 10 欧元的费用，您不仅获得了符合\
  \ GDPR 标准的数据存储，还获得了德国数据中心的优势。这让您能够确信自己的数据不会被轻易解密或滥用——这与那些大型国际服务商不同，它们在数据使用方面往往是不透明的。\n\
  \n对于那些重视数据保护但仍想利用云服务的人来说，IONOS 配合 HiDrive 绝对值得考虑。德国式数据保护的严谨性、可靠的支持以及公道的价格，使得该供应商成为一个安全的选择，特别是与大型国际竞争对手相比时。\n\
  \n## 10. 云之旅结语\n\n那么现在怎么办？在明确了云服务既有好处也存在巨大风险之后，该如何做？我们中的许多人确实意识到了云服务的优势——易用性、灵活的访问以及随时随地管理数据的能力是不可否认的。然而，与此同时也存在一长串缺点，这些缺点可能在未来才会显现，也许那时已经为时已晚。\n\
  \n将我们的个人数据存储在云端的主意最初听起来很实用。然而，考虑到这些数据存储在不受我们控制的服务器上，而且通常位于数据保护法律松得得的国家，这可能会令人不安。此外，提供这些服务的科技巨头对这些数据拥有几乎无限的访问权限，并经常根据自己的意愿分析、出售或将其其他用途。这些公司拥有巨大的资源，其议程很少与我们的利益一致。还存在数据泄露、黑客攻击或仅仅是法律法规变化的风险，这些可能随时影响到我们。\n\
  \n那么可以做些什么来减少这些风险并重获安心呢？你可以采取具体的步骤来保护自己，同时在一定程度上利用云的好处。\n\n## 1. 第一步可能是最激进的一步：“把\
  \ Windows 扔进垃圾桶”！\n\nWindows 已经日益成为一个实际上迫使用用户使用云服务的系统。微软勤奋地收集数据，将其推向云端，并通过许多方式强迫用户将数据存储在它的服务器上。切换到另一个操作系统，例如\
  \ `Linux`，可能是第一步。`Linux` 不仅是开源的，而且让你对自己的数据及其存储拥有完全的控制权。有各种发行版易于安装并提供友好的界面。例如，`Linux\
  \ Mint` 以简单著称，特别适合那些从 Windows 过的用户。\n\n## 2. 使用加密\n\n如果你希望继续使用云服务，应该在将数据上传到云端之前对其进行加密。有各种程序和工具可以帮助你安全地加密数据。这确保了即使你的数据落入坏人手中，如果没有相应的密钥，它也是毫无用的。端到端加密是此处的理想方法。\n\
  \n## 3. 选择符合 GDPR 的云服务供应商\n\n如果你不想完全放弃云服务，请选择总部位于欧盟并严格遵守 GDPR 的供应商。`IONOS` 在这里是一个很好的例子。你的数据存储在德国，且该服务商受欧盟严格数据保护法律的约束。这减少了你的数据在未经你许可的情况下被共享或滥用的风险。\n\
  \n## 4. 创建本地备份\n\n不要仅仅依赖云端。在外部硬盘或其他物理存储介质上进行定期备份应该成为一种常例。这些备份也应该被加密。这样，即使云服务暂时不可用，或者在最坏的情况下数据丢失，你手里也有一份数据的副本。\n\
  \n## 5. 重新考虑云服务的使用程度\n\n现在可能是从根本上重新审视你对云服务的依赖了。并不是每个文件都需要存储在云端。问问自己，哪些数据真正属于云端，哪些不属于。那些不能落入坏人手中的敏感数据应该尽可能存储在本地。\n\
  \n总结来说：这并不是要完全魔化云服务。它有其好处，但应该有意识且谨慎地使用这些好处。风险是真实且多样的，忽视它们可能会导致不 unpleasant 的惊喜。通过采取积极行动，你可以享受云的好处，而不会不必要危及你的安全和隐私。\n\
  \n## 11. Windows 11 的数据饥渴\n\n自 2024 年以来，Windows 将数据收集推向了极端，几乎好像微软突然想要吸收你数字生活的每一个细节。诚然，某些数据对于操作系统的运行是必要的，但并非所有收集的数据都属于这一类。大多数数据收集仅仅是可选的——而且往往是没有必要的。但悲哀的现实是，许多用户甚至不知道收集了什么数据，更不用说拒绝的选择了。\n\
  \n从 Windows 11 的初始设置开始，你就能看到这个操作系统是如何设计成收集数据的。从位置服务到个性化广告和诊断数据——Windows 试图尽可能多地了解其用户。最糟糕的部分是？除非你明确退出，否则许多功能都是默认开启的。但让我们诚实面对：在安装过程中，谁会仔细阅读每一个窗口和每一个通知呢？\n\
  \n\n\n\n结论：保持警惕，并花时间彻底检查 `Windows 11` 的数据收集选项。这看起来可能很麻烦，但这是保护至少部分隐私的唯一方法。也许，仅仅是，你也可以考虑那些不那么“贪数据”的替代方案。\n\
  \n我实际上并不想让你感到心里发慌——等等，停。实际上，我确实想让你这么做。而且出于非常特殊的原因：这是让你在不经情的情况下维持日常数字习惯时，看到每天在脸面前的那种不可置信的危险的唯一方法。这本书不仅仅是为了开开你的眼界，更是为了给你一次比喻上的“腹部击”。如果你在读完这些页面后没有感到哪怕一点不适，那么我就没有完成我的目标。因为正是这种不适感让你意识到，如果想让你的数据和数字生活真正属于自己，就必须发生一些根本性的变化。\n\
  \n悲剧的真相是，我们永远无法通过塑造 `Microsoft` 尤其是 `Windows` 来让我们的数据成为自己的财产。现实是残酷的：你的数据被收集、分析和使用，而且往往在你的不知情或没有明确同意的情况下进行。随着竞争日益转向云端和全球连接，你的数据变得越来越不受保护——充其量是大大型公司的玩物，最坏的情况下，是网络犯罪分子的廉价猎物。\n\
  \n但别担心，这种困境是有出路的。关键点在于：我可以向你展示一个系统，它在 `2024` 年能够提供你在真正安全且私私的数字环境中所希望的一切。这个系统并不完美——在数字世界里，完美是一种幻象——但它还给了你你应有的控制权。\n\
  \n你现在可能在想：»这是什么系统？我该如何真正保护我的数据？«答案在于选择正确的工具和正确的平台。是时候告别 `Windows` 了，选择一个尊重你的隐私、让你控制自己的数据，并且不强迫你向大公司的隐私顾虑低头的系统了。\n\
  \n我所说的这个系统是 `Linux`。它提供了 `Windows` 拒绝提供的灵活性、安全性和控制权。在接下来的章节中，我将引导你一步步完成转换过程——从选择合适的\
  \ `Linux` 发行版，到保护你的数据，以及建立一个真正属于你的数字环境。\n\n我们是时候停止安于这种不安的感觉并开始采取行动了。因为事实是：如果我们无所作为，情况不会好转。重新获得对我们数字生活的控制权取决于我们，而且没有比现在更好的时候了。\n\
  \n## 12. `Windows` 收集哪些数据？\n\n`Microsoft` 将某些数据收集归为«必要»，并声称这些数据是保持 `Windows` 高效、更新和安全的必需品。但真正让我感到恐惧的是，对我们的数字生活做出决策时所采取的草率假设。这些«必要」数据包括基本细节，如你的设备型号、系统中的硬件组件以及以防系统故障的诊断数据。初看之下，这似乎无害的，但收集的数据深度和范围远超人们对一个操作系统的预期。\n\
  \n据报道，为了诊断，`Microsoft` 会收集基本的错误报告数据，例如 `Windows` 更新是否成功以及操作系统是否按预期运行。但它并未止于此。它还收集\
  \ `Windows` 的版本和内部版本、所有可选安装程序，以及你安装的所有应用程序和服务。这意味着，`Microsoft` 不仅知道你使用哪些程序，还知道何时以及频率如何。这种对你数字生活的侵入性洞察被\
  \ `Microsoft` 认为是必要的——老实说，这让我脊背发凉。\n\n更令我不安的是，你无法停止这些«必要»数据的收集。这就像是在没有你明确同意的情况下，剥夺了你对自己系统的控制权。在此范围之外收集的所有数据据说是可选的，但即使在这里人们必须问：我们有多少人甚至知道收集了哪些数据，以及如何禁用这些收集？\n\
  \n这种强制性的数据收集是另一个信号，表明我们生活在一个世界里，我们的隐私日益成为一种商品，我们往往在毫无察觉和不情愿的情况下将其交出去。对我来说，这是一个令人震惊的信号，说明我们需要重新思考，我们的数据和数字自由对我们是否真的重要。\n\
  \n### 12.1. 浏览器数据\n\n`Windows 11` 通过监控你的网页浏览活动更进了一步。想象一下：每当你上网时，你在像 `Microsoft Edge`\
  \ 等微软浏览器中输入的每一个搜索词都可能被 `Microsoft` 跟踪。这不仅仅是对你浏览行为的斜纵一瞥，而是对你所有在线活动的系统性收集。甚至你对微软浏览器配置设置所做的任何更改都可能被记录，反过来影响你的搜索结果。\n\
  \n真正让我害怕的是这种监控的深度。针对的不仅是你的普通浏览行为，还有你在浏览器中做的每一个细微调整和偏好。这些信息是有价值的——对你来说不是，但对那些利用这些数据预测你的行为、向你投放定向广告，甚至影响你的观点的公司来说。\n\
  \n但这种数据陷阱是有出路的，至少部分如此。如果你想禁用这种监控，前往 `设置 > 隐私和安全性 > 诊断与反馈` 并关闭«发送可选诊断数据》。这一步至少限制了部分不想要的数据收集。但警告你：这种措施只是杯水一薪。只要你使用\
  \ `Microsoft` 的生态系统，总会有你无法完全关闭的某种程度的监控。\n\n### 12.2. 你的输入\n\n输入，没错！接下来的内容简直令人震惊！`Windows\
  \ 11`  alleged 收集关于你输入、手写甚至说话的各种匿名数据。是的，你没读错——无论是通过键盘、语音，还是在触摸屏上用笔，所有的输入都会被记录。这些数据据称用于改进相关服务，例如优化\
  \ `Windows` 中的语音识别和手写识别。\n\n但老实说，谁会对这些感到舒服呢？所有这些输入都被收集和分析以改进用户体验，这种想法听起来不错，但却让人感觉糟糕。即使是你的手写笔记或个人录音也会进入一个匿名数据库，这种想法并不让人放心。当然，你被保证这些数据是«匿名化」的——但在一个数字信息几乎不可能完全匿名的时代，这到底意味着什么呢？\n\
  \n如果你不想接受现状——而且你不应该接受——有一种方法可以部分遏制这种数据收集。前往 `设置 > 隐私和安全性 > 诊断与反馈`，然后关闭«改进墨迹和打字»。这停止了对你输入的直接监控，但一如既往，只要你还留在\
  \ Windows 世界里，就无法完全躲避窥探的目光。\n\n这种监控清楚地表明：实用用功能与侵入性数据监控之间的界限正变得越来越模糊。我们需要保持警惕，并积极采取措施保护我们的数字隐私——在完全失去控制权之前。尽管，如果我们诚实的话，我们已经失去了它。我们早已失去了对自己数据的控制权。\n\
  \n### 12.3. 产品和服务性能\n\n\n\n\n\n# 产品与服务性能\n\n乍一看，这似乎并无害，甚至有些有用。这些遥测数据本应监控你的设备、操作系统以及应用程序和驱动程序的状态。尽管声称这些数据仅经过了匿名化处理，但让我们诚实一点：即使是匿名化的数据泄露的信息也比你想象的要多。这里听起来如此无害的内容，实际上关于\
  \ `Cortana` 响应你语音指令的速度快慢，或者面部识别完成计算需要多久。\n\n这些数据不仅用于改进服务，还为了为你提供所谓的“定制化体验”。例如，这可能意味着收到更改设置以优化电池续航的建议，或者在设备存储空间不足时被推荐云存储提供商。但仅仅因为数据目前看起来相对无害，并不意味着它们在未来依然如此。谁知道技术还为我们准备了什么惊喜？也许你的脸特别适合面部识别——而这在落入错误的人手中可能会变成问题。\n\
  \n如果你觉得这种形式的监控过头了，有办法禁用它。导航到 `设置 > 隐私与安全 > 诊断与反馈`。关闭“发送可选诊断数据”和“改进用户体验”。这至少可以阻止这种数据泛滥的情况。\n\
  \n但一如既往，问题仍然存在：我们对这些数据到底有多少控制权？在完全理解潜在后果的情况下，我们自愿放弃了多少？在我们继续这种数字习惯之前，这值得思考。\n\n\
  ## 12.4 产品和服务的用法\n\nWindows 11 中产品和服务的用法是数据收集故事的另一个章节。这里脱颖而出的是微软收集的部分匿名化数据。这些信息包括：你使用了哪些应用程序，以及当发生某些错误时哪些程序处于激活状态等。它还会跟踪你是否禁用了\
  \ Windows 中的某些帮助和建议功能，所有目的都是为了提高系统的准确性和用户友好性。\n\n真正困扰我的是这些数据被用于“定制化体验”的方式。例如，Windows\
  \ 可能会建议你启用某些你故意关闭的设置——可能是出于隐私考虑。它不仅监控你当前的使用情况，还监控你如何与操作系统设置进行交互。这些数据随后可能会根据你最频繁使用的程序，用于建议替代的微软或第三方应用程序。\n\
  \n如果你不想接受这种形式的监控——你应该认真考虑这一点——有一种禁用数据收集的方法。进入 `设置 > 隐私与安全 > 诊断与反馈`，并关闭“发送可选诊断数据”和“改进用户体验”。这至少减少了关于你的使用行为收集的数据量。\n\
  \n但问题仍然是：这种监控中有多少是真正必要的，又有多少是多余的？我们真的需要揭露自己的喜好和反感，仅仅是为了让操作系统提供我们可能甚至不想要的建议吗？这值得质疑，并相应调整你的数字习惯，以避免放弃不必要的控制权。\n\
  \n## 12.5 你安装的程序和软件\n\nWindows 11 努力收集数据的另一个领域是关于你在系统上运行的应用程序、安装在计算机上的反恶意软件程序和服务，以及驱动程序更新和\
  \ Windows 更新计划。微软对下载何时开始和结束，以及安装了哪些 `Microsoft Store` 应用程序并可能需要更新也感兴趣。收集这些信息不仅是为了确保你的系统运行顺，还为了为你提供定制的建议——例如你可能喜欢的替代程序。\n\
  \n现在，我问自己的问题是：真的非要这样吗？这种监控乍一看可能无害，但实际上，它让微软对你的使用行为有了深入的洞察。这就像有一个时刻形行的伴侣记录着你在电脑上做的每件事。当然，从理论上讲，这些信息中的某些可以帮助你的系统运行得更高效——但代价是你的隐私吗？\n\
  \n如果你觉得这种数据收集太具有侵入性，你可以选择至少停止它。要这样做，进入 `设置 > 隐私与安全 > 诊断与反馈`，并关闭“发送可选诊断数据”和“改进用户体验”。这至少遏制了一些不必要的数据收集，并还你一点对自己数据的主控制权。\n\
  \n但真正的问题仍然是：这种“定制体验”中有多少是真正必要的？我们真的需要允许自己在电脑上做的每小事都受到监控和分析吗？在功能和隐私之间找到平衡取决于我们——不要向大型科技公司放弃不必要的控制权。\n\
  \n## 12.6 你的位置\n\nWindows 11 还收集位置数据，据称是为了启用“查找我的设备”等功能，提高搜索结果的关联性，并为你提供更相关的天气和本地信息。如果你授予它们权限，这些位置数据甚至可以被第三方应用程序使用。但说真的：微软追踪我在哪里漫游有什么关系？\n\
  \n令人惊讶的是，一个操作系统认为在后台不断跟踪我的位置以所谓的让我的生活更方便是完全没问题的。他们真的认为我每次打开笔记本电脑都需要天气更新或当地新闻吗？真正让我无语的是，这些数据不仅被系统本身使用，还能被第三方使用的这种极大胆量。问题随之产生：有用信息的收集在何时结束，隐私的滥用从何时开始？\n\
  \n幸运的是，有一种停止这种位置跟踪的方法——尽管人们想知道为什么它是默认开启的。要这样做，进入 `设置 > 隐私与安全 > 位置` 并确保位置服务已关闭。或者，你可以通过此页面上的应用程序列表禁用单个应用程序的位置跟踪。\n\
  \n但老实说：这不是一种耻辱吗？我们作为用户，为了夺回对自己数据的控制权，必须挖掘设置的深处。这种程度的监控竟然被认为是正常的，令我大眼眼镜。在尽可能收集关于我们的信息方面，微软似乎没有限制。\n\
  \n## 12.7 查找我的设备\n\n微软对“查找我的设备”功能到底是怎么想的？他们真的认为偷我电脑的小偷会先连接互联网以便我看到它的位置吗？这简直是天真！现实情况截然不同。一个不惜偷笔记本电脑的小偷当然会知道如何绕过甚至禁用此功能。\n\
  \n当然，“查找我的设备”所需的网络连接是小偷会要阻止的第一件事。而且即使他们没有立即这样做，而是拆掉了硬盘，一切也已经结束了。笔记本电脑本身可以卖给二手店，而数据呢？它可能在小偷或同伙手中。通过以太网线追踪小偷的想法是荒谬的。\n\
  \n\n\n\n同样无法保证该功能在实践中始终有效。如果小偷简单地断开笔记本电脑的网络连接，或者将其存放在没有网络的地方怎么办？那么 `Find My Device`（查找设备）功能就无能为力。在我看来，这更像是一个面子工程，微软将其作为一种酷炫的附加功能进行营销，而没有真正考虑实际情况。归根结底，它可能更多是一个装设，而不是真正的保护。\n\
  \n微软到底想达到什么？他们真的认为你会通过他们的功能找到你的笔记本电脑吗？完全不是！他们真正想要的是让你去最近的商店买一台新的笔记本电脑——当然，还是带 `Windows`\
  \ 的——然后从 `OneDrive` 恢复你的数据。这样，他们就有充分的理由推销他们的云服务。\n\n现实是，`Find My Device` 功能往往只是空头支子。如果电脑被盗了，这有什么意义？没多久，小偷就会断开它的网络，要么将数据传输到另一个硬盘，要么直接按原样卖掉电脑。这个功能充其量顶只是一个给客户提供保护幻觉的占位符。\n\
  \n微软非常清楚，在发生真实盗窃的情况下，笔记本电脑通常已经无法挽救。所以，客户别选择购买新的笔记本电脑并从 `OneDrive` 恢复数据——如果它备份在那里的话。否则，剩下的只有苦涩地意识到，`Find\
  \ My Device` 功能终究不过是一场烟雾弹。真正的信息是：如果电脑丢了，它就真的丢了。\n\n## 12.8 查看收集的数据\n\n如果你想获得关于 `Windows\
  \ 11` 收集数据的详细报告，实际上有一个内置工具。只需进入 `Settings > Privacy and Security > Diagnostics and\
  \ Feedback`（设置 > 隐私与安全 > 诊断与反馈），开启查看诊断数据的选项。这将启用让你获取系统收集的数据全面概述的功能。\n\n一旦你启用此选项，系统可能会提示你访问\
  \ `Microsoft Store`（微软商店）下载并安装 `Diagnostic Data Viewer`（诊断数据查看器）应用。该应用需要你的设备上约约\
  \ 1GB 的可用存储空间。安装后，你可以打开该应用并访问 `Windows 11` 关于你的使用收集的所有遥测数据和信息。\n\n在 `Diagnostic\
  \ Data Viewer` 应用中，你可以浏览收集的数据，详细查看从你的系统传输到 `Microsoft` 的哪些信息。该应用不仅提供了数据的概述，还显示了哪些应用程序向\
  \ `Microsoft` 发送的数据最多。如果你想了解使用监控的范围和细节，这会非常有洞见性。它让你对数据收集有更深入的了解，并让你更好地理解系统使用的哪些方面包含在遥测中。\n\
  \n## 13. 噢天，现在怎么办？\n\n噢老天，现在就是这样！是的，亲爱的读者，现在你大概知道发生了什么了。即使是我这个每天处理这些话题的人，也无法想象哪些数据在何时、以何种方式以及为什么流向了\
  \ `Microsoft`。当我回起在 `Windows` 还被认为是一个革命性系统时这一切是如何开始的，真的令人印象深刻！你可以真切地感受到进步和创新。但今天呢？微软已经变成了一个贪婪、逐利的数据章鱼，这太令人恐惧了。\n\
  \n让我们停一下考虑一下现实：当你打开电脑时到底发生了什么？操作系统会立即开始收集数据——没有任何声张。这不仅仅是小的信息交换，而是一场流向 `Microsoft`\
  \ 的数据洪水。你可以确定，你的系统会不断记录关于你的使用情况、偏好，甚至你与各种应用程序和网站交互的信息。所有这些都被收集在一个巨大的数据宝库中，微软急于利用它们来优化其服务、投放定向广告或进一步开发其软件。\n\
  \n现在你可能在想我为什么告诉你这些。我必须在这里那里进行一些详细说明，是为了给你一个全面的画面。但如果你不理解我为什么甚至在考虑它，我又怎么能严肃地建议一个像\
  \ `Linux` 这样的替代操作系统呢？现实是，微软无休止的数据收集和分析变得越来越具有侵略性。你对它的了解越多，就越清楚地看到为什么越来越多的人转向那些不关注数据收集的替代系统。\n\
  \n`Linux` 是一个很有前景的替代方案。它初看之下可能更复杂，但它对你的隐私提供了大得多的控制。通过 `Linux`，你决定哪些数据被发送，哪些不发送。你不再受控于一家将你的数据作为货币的商业公司。这并不意味着\
  \ `Linux` 是完美的，或者没有它它自己的挑战，但它赋予了你按照自己的标准保护数据的自由。\n\n所以，下一次你打开 `Windows` 电脑并好奇所有数据都去了哪里时，考虑一下你对自己的系统和数据想要的控制权。也许是时候认真考虑替代方案，并思考你是否更愿意向更多的隐私和独立迈出一步了。\n\
  \n现在我们已经到达了关于 `Windows`、云以及其他科技巨头的所有负面面的终点。如果这还不能让你开眼界，我不知道还有什么可以了。我们已经彻底探讨了由于大公司无休止的数据饥渴而产生的问题和担忧。这些点应该足以让你清晰地看到整件事已经变得多么具有侵略性且不透明。所以，现在尽得开心吧。\n\
  \n## 14. 什么是 Linux\n\n想象这样一个世界：你对自己的操作系统拥有控制权，而不会不断感到被监控或被剥削。自由、隐私和适应性处于领先地位。欢迎来到\
  \ `Linux` 的世界。但 `Linux` 到底是什么，它是如何演变成今天这样的呢？让我们回顾一下 `Linux` 的历史和特征。\n\n`Linux` 的历史始于对自由和开放的愿景。1991\
  \ 年，当互联网处于婴儿阶段且 `Windows` 刚刚开始兴起时，一位芬兰年轻人 `Linus Torvalds` 开始了工作。Torvalds 是赫尔辛基大学的一名计算机科学学生，他想创建一个基于开放和协作原则的操作系统。他的目标是开发一个人人都能使用的、不受传统软件模式限制的免费操作系统。\n\
  \nTorvalds 开始开发一个新的 `kernel`（内核），这是操作系统的核心组件。这个被命名为 `Linux` 的内核旨在为当时流行的商业操作系统 `Windows`\
  \ 和 `Unix` 提供替代方案。`Linux` 的名字来源于创建者 `Linus Torvalds` 以及它是一个 `Unix` 系统的事实。内核根据 `GNU\
  \ General Public License` 发布，允许任何人使用、修改和分发代码。\n\n这个小项目很快发展成了一场全球运动。`Linux` 吸引了开发人员和技术人员的关注，他们希望将该系统作为自己项目的基础。开源哲学实现了协作开发，全球成千上万的程序员都在该项目做出贡献。\n\
  \n在随后的几年中出现了越来越多的 `Linux distributions`（Linux 发行版）——根据不同的需求和偏好定制的各个。`Ubuntu`、`Fedora`\
  \ 和 `Debian` 等发行版变得流行，并帮助 `Linux` 被普通大众更容易接触。\n\n\n\n\nLinux 与 Windows 之间的一个核心区别在于安全问题。Windows\
  \ 作为最广泛使用的操作系统之一，是攻击和恶意软件的频繁目标。其广泛的普及使其成为网络犯罪分子垂涎的肥肉。尽管微软在近年来改进改进安全功能方面取得了显著进展，但\
  \ Windows 系统仍然容易受到各种威胁的侵害，特别是在权限管理和软件安装方面。\n\n相比之下，Linux 提供了几项显著的安全优势。Linux 的开放代码允许社区进行全面的审查。由于有大量开发者持续审查代码，安全问题通常会被迅速发现并解决。此外，Linux\
  \ 基于严格的权限模型，应用程序运行在高度限制的环境中，这显著降低了攻击成功率的风险。\n\nLinux 的另一个优势是它的模块化，以及只安装必要组件的能力。这减少了攻击面，并最大限度地减少了潜在的安全漏洞。许多\
  \ Linux 发行版也以其严格的安全协议和快速的更新而闻名，有助于保护系统免受新兴威胁的影响。\n\n此外，Linux 还带有多种专门为确保系统完整性设计的安全工具和技术。如\
  \ `SELinux`（增强型 Linux）和 `AppArmor` 等功能提供了传统权限之外的额外安全控制层。\n\n总之，Linux 不仅讲述了一个关于开放与协作的迷人故事，还作为\
  \ Windows 等商业操作系统的严肃替代方案。Linux 的历史、广泛的应用以及它的安全优势，使其成为那些重视控制权、适应性和隐私的人眼中极具吸引力的选择。\n\
  \n如果你想从大型科技公司的广泛控制和安全忧虑中解脱出来，可能值得关注一下 Linux。在隐私和安全变得日益重要的时代，Linux 为想要对数字生活拥有更多控制权的用户提供了一个极具竞争力的替代方案。\n\
  \n我在书的后部分创建了一个关于“Linux 历史”的独立章节。\n\n## 14.1 Linux 分发\n\n当我们谈论操作系统时，不可免地会认为 Windows\
  \ 是桌面领域的主导者。然而，如果我们跳出这个视角，很快就会变得清晰：Linux 现在是全球发行最广泛的系统。尽管 Windows 在全球桌面电脑上占据主导地位，但\
  \ Linux 的分发和影响力是难以比拟的。\n\n虽然 Windows 主导着桌面市场——估计桌面操作系统的市场份额超过 70%——但在其他领域，情况完全不同。Linux\
  \ 不再仅仅是技术爱好者或服务器管理员的玩具。它已经演变成一种通用的操作系统，存在于现代技术的几乎每一个领域。\n\n例如，在移动领域，Android 被认为是最常用的操作系统，而\
  \ Android 是基于 `Linux kernel` 的。根据 Statista 的数据，Android 占据了全球 72.2% 的移动操作系统市场，这间接将\
  \ Linux 带到了了超过 70% 的智能手机和平电脑。这一数字凸显了 Linux 在移动设备领域的主导地位——尽管它通常处于幕后。\n\n但并非如此。Linux\
  \ 还是大多数 Web 服务器的骨干。估计显示，超过 70% 的网站运行在使用 Linux 作为操作系统的服务器上。这归功于 Linux 服务器提供的稳定性、安全性和活性。Google、Amazon\
  \ 和 Facebook 等大品牌都依赖 Linux 服务器来运行其庞大的网络和数据中心。\n\n此外，Linux 可以在许多在我们日常生活中发挥作用的其它设备中找到。从智能电视、路由器到某些家用电器——Linux\
  \ 无处不在。运行在 Linux 上的广泛设备说明了该系统的多功能性和适应性。\n\n更进一步，我们看到 Linux 在互联网本身也扮演着核心角色。从主要的云提供商到数不可计的\
  \ Web 服务器和数据中心——Linux 驱动了互联网很大的一部分。事实上，世界上超过 90% 的超级计算机运行在 Linux 上，使该系统成为高性能计算的首选。\n\
  \nLinux 的分发远超桌面和服务器。Linux 显示其存在感的一个值得的领域是嵌入式系统。根据 Linux 基金会的数据，各行业使用的各种嵌入式系统中，有超过\
  \ 90% 都配备了 Linux。这包括从汽车、飞机到医疗设备和工业控制的各个领域。\n\n总之，Linux 不仅存在，而且在许多技术领域占据主导地位。虽然 Windows\
  \ 在桌面领域仍然无人挑战，但没有其他系统可以比 Linux 的无处不在和影响力。从移动设备到服务器，再到日常电器和互联网本身——Linux 是驱动我们现代世界的隐形力量。虽然它通常处于背景中，但它对技术和数字基础设施的影响是无与伦比的。\n\
  \n## 14.2 Linux 与用户友好性\n\n在过去，Linux 确实是所谓的“极客”和黑客的领域——那些不害怕深挖技术并钻读晦涩代码行的人。最初，Linux\
  \ 是一个针对精通技术的爱好者的项目，他们并不畏惧使用命令行以及对系统进行手动定制以满足自己的需求。它是技术痴迷者的俱乐部，他们想要自己赢得对系统的自由和控制权。\n\
  \n然而，时代已经了。在如今用户友好性和易用性成为首要任务的时代，Linux 经历了快速进化。最初与其他操作系统区分开来的复杂性在很大程度上已成为过去。现代 Linux\
  \ 发行版如 `Ubuntu`、`Fedora` 和 `Linux Mint` 显著降低了普通用户的入门门槛。这种发展非常迅速，如今的用户界面与过去令人生畏的基于文本的界面相已远。\n\
  \n当然，Windows 仍然是以其用户友好和易用而闻名的操作系统。许多人喜欢 Windows 提供的熟悉界面和功能的无缝集成。它被数百万用户认为是直观的系统，并且通常被认为更“容易”处理，特别是对于那些在\
  \ Windows 环境中长大或专业地使用它的人来说。\n\n但不要被欺骗了——现代 Linux 系统一点也不复杂。相反：它们变得出奇地用户友好，并为日常任务提供了高水平的易用性。如今的\
  \ Linux 发行版带有图形化安装向导、简单的软件包管理器以及各种预装应用程序，方便了入门。向更友好的界面和直观设计概念的发展，使得即使是技术不太精通的用户也能轻松使用\
  \ Linux。\n\n在 Linux 上安装软件通常就像点击几个按钮一样简单。许多发行版提供了软件中心，你可以在那里轻松浏览和安装程序，而无需挣扎复杂的安装程序。硬件兼容性也大大提高；现代\
  \ Linux 发行版会自动识别各种设备并安装必要的驱动程序。\n\n此外，还有一个活跃的用户和开发者社区，随时准备提供帮助和支持。在线论坛、教程和用户小组为任何有疑问或需要帮助的人提供了宝贵的资源。这个社区为新用户获得愉悦和顺畅的体验做出了巨大贡献。\n\
  \n\n\n\n简而言之，虽然 Windows 仍然被认为是用户友好性领先的系统，但如今的 Linux 用户完全可以大有一席之地。现代发行版已经取得了巨大进步，提供了能够让普通用户高效、无缝工作的用户友好型体验。尽管\
  \ Windows 可能仍然是某些人的首选，但 Linux 已经成为许多人极具吸引且实用的选择，这已不再是秘密。\n\n## 14.3 Linux 硬件要求\n\
  \n在当今快速发展的科技领域，硬件需求正成为一个日益紧迫的问题。特别是考虑到微软即将发生的变化以及相关的环境影响，Linux 提供了一个值得关注的替代方案。但让我们退后一步，更仔细地审视这种情况。\n\
  \n多年来，Linux 因其通用性和灵活性赢得了良好的声誉。Linux 的突出特点之一是它能够在各种硬件配置上运行。对于几乎在 2006 年左右甚至更早制造的几乎任何计算机，都有相应的\
  \ Linux 发行版。这些发行版旨在保持低资源占用的同时，提供完整且用户友好的桌面环境。\n\n`Lubuntu` 或 `Linux Mint Xfce` 等现代\
  \ Linux 发行版专门针对旧款或性能较弱的硬件进行了优化。它们提供了一个轻量级的桌面环境，比现代操作系统更复杂的界面需要的更少的系统资源。这意味着即使是技术上仍然运行良好的旧电脑，也可以通过运行高效且最新的\
  \ Linux 发行版进行操作。这意味着旧硬件不必仅仅因为新版本的操作系统有更高要求而被丢弃。\n\n2025 年即将到来，随之而来的是 `Windows 10`\
  \ 的终结，因为微软计划将所有用户迁移到 `Windows 11`。然而，这一过渡带来了巨大的挑战。`Windows 11` 对硬件规格的要求比 `Windows\
  \ 10` 高，这意味着许多技术上仍然健康的计算机将无法满足新要求。`Windows 11` 的规范包括 `TPM 2.0` 芯片、安全启动（Secure Boot）以及特定的处理器架构，这些功能并不是所有旧设备都具备的。\n\
  \n估计显示，2016 年之前制造的数百万台电脑和笔记本可能无法满足 `Windows 11` 的最低要求。这导致了巨大的环境负担，因为功能性设备变得过时。仅仅因为软件制造商无法使其系统向后兼容，就让数十亿设备被新设备取代，这种想法是令人震惊的。这可能导致大量的电子垃圾——这是一个已经达到令人担忧规模的环境问题。\n\
  \n在这种背景下，Linux 的环保友好性变得尤为明显。由于 Linux 可以在各种硬件配置上运行，并且可以设计为轻量级，它使得旧设备能够继续使用。Linux\
  \ 的这种不仅有助于延长硬件寿命，还减少了对新设备的需求。这对环境产生了深远的积极影响，因为它减少了电子垃圾的数量，并最大限度地减少了计算机制造新原材料的需求。\n\
  \n此外，Linux 社区内部还有许多专门支持旧设备的项目。像 `AntiX` 或 `Puppy Linux` 这样的发行版是为极旧的硬件设计的，提供的用户体验通常不仅功能完备，而且流畅得惊讶。\n\
  \n在考虑技术的未来时，我们也应该考虑到我们决定对环境的影响。即将向 `Windows 11` 的迁移构成了一项重大挑战，特别是对于那些运行状况良好的旧设备用户而言。鉴于大量处置这些设备可能带来的环境影响，考虑替代解决方案是重要的。\n\
  \nLinux 为解决这一挑战提供了极佳的方法。凭借其在旧旧和性能较弱的设备上运行的能力，它代表了一个既有利于用户又环境的可持续选择。与其丢弃功能完好的硬件，你可以通过\
  \ Linux 找到一个高效、最新且环保的解决方案。这不仅是一个务实的决定，也是对更具环保意识的未来的贡献。\n\n## 15. Linux 能做 Windows\
  \ 能做的事吗？\n\n在考虑操作系统时，Windows 毫无疑问处于顶端。然而，关于 Linux 是否能取代 Windows 的问题正变得越来越重要，特别是考虑到\
  \ Linux 在科技界不断持续的发展和日益增长的影响。让我们更仔细地观察这个问题，看看 Linux 是否真的具备成为 Windows 的完全替代方案的实力。\n\
  \n首先，重要的是承认 Linux 在过去几年取得了巨大进展。Linux 曾被认为是科技爱好者和 IT 专业人员的操作系统，但现在它提供了广泛的功能，这些功能通常可以与\
  \ Windows 的功能竞争。许多 Linux 发行版现在提供完整的桌面环境，这些环境不仅在视觉上吸引人，在功能上也很全面。\n\n`Ubuntu`、`Fedora`\
  \ 和 `Linux Mint` 等现代 Linux 发行版提供了用户友好的图形界面，使得与系统的交互像 Windows 一样直观。软件管理通常通过精简的软件中心进行，安装和更新程序像\
  \ Windows 自身的软件管理一样简单。\n\n另一个重要点是对专业应用程序的支持。虽然 Windows 在历史上一直是许多专业软件解决方案的首选，但替代方案已日益发展。如用于图像编辑的\
  \ `GIMP`、用于办公应用程序的 `LibreOffice` 以及用于 3D 设计的 `Blender` 等程序提供了强大的功能，在许多情况下可以与其商业对手相媲。`Docker`、`Kubernetes`\
  \ 和 `Visual Studio Code` 等开发者工具在 Linux 上也可用。\n\nLinux 特别出色的一个领域是可靠性和安全性。Linux 以其稳定性和健壮性闻名，使其服务器和关键系统的首选。Linux\
  \ 的开源特性允许社区进行持续的审查和改进，这增强了安全性并最小化了漏洞的风险。\n\n相比之下，Windows 经常面临安全威胁。Windows 的高度普及使其成为恶意软件和病毒的主要目标。尽管微软采取了所有安全措施，Windows\
  \ 系统仍然更容易受到攻击，特别是如果它们没有被定期更新。相反，Linux 凭借其稳健的权限结构和社区的定期安全审查，提供了显著更小的攻击面。\n\n不仅是私人用户从\
  \ Linux 的优势中受益。科学家和大型公司也日益转向 Linux。包括 `Google`、`Amazon` 和 `Facebook` 在内的许多大型公司都使用\
  \ Linux 作为其服务器基础设施。这些公司利用 Linux 的稳定性、安全性和成本效益。Linux 在不牺牲性能的情况下提供成本效益的商业操作系统替代方案，这是一个巨大的优势。\n\
  \n\n\n总而言之，`Linux` 确实可以在许多领域取代 `Windows`。先进的桌面环境、广泛的软件支持以及卓越的安全性使其成为一个强大的替代方案。尽管\
  \ `Windows` 仍然是领先的桌面操作系统，但现代 `Linux` 发行版在用户易用性和功能方面已很大程度上缩小了差距。\n\n`Linux` 在科学界和企业界的广泛接受充分说明了它的性能和可靠性。超级计算机上以及领先领先的科技公司对\
  \ `Linux` 的使用表明，它不仅适用于服务器操作系统，也可以作为桌面电脑和笔记本电脑的严肃选择。\n\n因此，如果你正在考虑 `Linux` 是否可以成为你\
  \ `Windows` 的替代品，请不要低估它的进展和收益。`Linux` 为你提供了在当今数字世界所需的自由、控制和安全——而且成本和对环境的影响仅为商业操作系统的一小部分。\n\
  \n## 15.1 Linux 桌面渗透率\n\n`Linux` 在桌面端的进展有多远了？让我们看看当前的数字和事实，以更好地了解 `Linux` 在桌面市场的存在感和影响力。\n\
  \n根据最新统计数据，`Linux` 在桌面和笔记本电脑上的市场份额约为 2 到 3%。与占据市场 70% 以上份额的 `Windows` 相比，这个数字可能看起来很小。然而，对于一个长期以来主要被认为是服务器或开发者操作系统来说，这仍然显示了其显著的存在感。\n\
  \n近年来，`Linux` 的桌面渗透率稳步增长。各种因素促成了这一趋势。日益增多的友好型发行版（如 `Ubuntu`、`Linux Mint` 和 `Fedora`）发挥了重要作用，这些发行版旨在让普通用户更容易上手。这些发行版提供了直观的图形用户界面和简单的安装过程，使得该操作系统对更广泛的受具有吸引力。\n\
  \n此外，`Linux` 的开源特性引起了技术爱好者和开发者日益增长的兴趣，他们对系统进行定制和改进。这显著增强了它的功能性和用户易用性。\n\n除了通用桌面市场外，`Linux`\
  \ 在利基市场也扮演了重要角色。例如，许多 `Chromebooks`（在教育机构和对价格敏感的消费者中很受欢迎）配备了基于 `Linux` 的 `Chrome\
  \ OS`。`Linux` 在数字艺术和 3D 设计领域也拥有了更多支持者，提供了强大且专业的软件解决方案，这些解决方案通常是免费提供的，或者仅为商业软件成本的一部分。\n\
  \n导致 `Linux` 渗透率增加的另一个因素是企业和教育机构的使用。许多学校和大学在计算机实验室中使用 `Linux`，以降低成本并方便使用强大的软件。企业也越来越多地采用\
  \ `Linux` 来降低运营成本并增加其 IT 基础设施的灵活性。\n\n根据 `StatCounter` 和 `W3Counter` 的调查（这些调查检查了网站和其他数字环境中操作系统的使用情况），`Linux`\
  \ 在桌面和笔记本电脑上的份额相对稳定，但显示出持续尽管缓慢的增长率。这表明越来越多的人和组织正在将 `Linux` 视为 `Windows` 的严肃替代品。\n\
  \n虽然 `Linux` 目前在桌面上的市场份额很小，但有明显的迹象表明这可能会改变。随着开源软件的日益普及以及人们对隐私和安全意识的增强，越来越多的人转向 `Linux`\
  \ 作为商业操作系统的替代品。\n\n这是操作系统历史中令人激动的一个篇章，`Linux` 的桌面渗透率在未来几年将如何发展还有待观察。有一点是可以肯定的：`Linux`\
  \ 早已从它的众存在转变为桌面操作系统市场中的严肃竞争者。\n\n## 16.感谢你一直以来\n\n现在我想感谢你一直关注我并探索数据保护、环保意识和节约成本等话题。对我来说，为让我们大家的数字世界变得更安全、更环保、更具效益而做出贡献非常重要。让我们仔细看看激励我与你分享这些信息的要点。\n\
  \n## 1. 保护你的数据：隐私保护的关键一步\n\n在个人数据已成为宝贵货币的时代，采取措施保护我们的隐私至关重要。像 `Microsoft` 这样的大科技巨头不断收集有关我们使用的数据，往往在我们完全意识到的情况下进行。这不仅包括我们的搜索习惯和位置，还包括我们在各种应用程序和服务中的行为。\n\
  \n通过使用像 `Linux` 这样的操作系统，你可以向更好的数据保护迈出重要一步。`Linux` 发行版通常设计为收集较少的个人数据，并让你对自己的信息有更多控制权。你可以决定将哪些数据发送给谁，并可以选择使用由专注于隐私和安全的专用社区支持的透明开源软件。与商业操作系统不同，你的隐私没有被视为业务模式，而是受到了尊重。\n\
  \n## 2. 保护环境：对地球的可持续贡献\n\n除了保护你的数据外，环境保护也是当今无法忽视的重要问题。电子垃圾是一个日益严重的问题：每年有数百万设备最终进入垃圾填埋场，因为它们不再兼容最新的软件要求。这导致了由于污染物和资源浪费造成的巨大环境破坏。\n\
  \n通过 `Linux`，你可以积极有助于减少这种浪费。`Linux` 以运行在各种硬件配置上闻名，包括较旧和性能较低的设备。你不需要因为软件不兼容而丢弃功能正常的设备，可以使用轻量级\
  \ `Linux` 发行版继续使用它们。这延长了你硬件的寿命并减少了电子垃圾的产生。通过做出这种选择，你积极有助于资源保护并减少了对环境的影响。\n\n## 3.\
  \ 减轻钱包：通过替代软件节约成本\n\n最后，我们不应该忽视财务方面。操作系统和软件许可的成本可能会迅速增加，特别是考虑到不断更新和新版本。例如，`Windows\
  \ 11` 对于许多用户不仅需要新硬件，还会产生额外的软件和升级费用。\n\n`Linux` 提供了一个吸引人的替代方案。许多 `Linux` 发行版是免费开源的，这意味着你不需要为许可或昂贵的升级预算。你可能许多应用程序也以开源软件的形式提供，因此是免费的。这不仅让你节省了大量资金，还让你能够根据需要自由定制和扩展软件，而没有财务压力。\n\
  \n再次，衷心感谢你读到这里。看到越来越多的人有意识地参与这些重要问题，令人鼓舞。保护数据、保护环境和减少成本不仅是个人的关怀，也为一个更可持续、更公平的数字世界做出贡献。\n\
  \n通过选择探索像 `Linux` 这样的替代方案，你正在所有这些方面做出宝贵的贡献。你的选择不仅可以提升你自己的数字体验，还能为我们的世界和财务带来积极影响。希望这篇文章帮助你理解这些联系并提供实用的视角。\n\
  \n所以，让我们开始 Linux 之旅吧！\n\n## 17. 从 Windows 切换到 Linux Mint\n\n\n\n\n我在这里是为了指导你从 Windows\
  \ 迁移到 Linux Mint，因为 Linux Mint 是进行这一切换的最佳选择。Linux Mint 及其 `Cinnamon` 桌面的操作和使用方式与\
  \ Windows 非常相似。此外，Linux Mint 预装了多种软件产品，包括电子邮件客户端、`LibreOffice`、视频、照片、图形编辑、音乐、互联网和电视应用程序。Linux\
  \ Mint 还有一个 »应用商店«，里面有成千上万的免费程序，可以满足你的所有需求。\n\n## 17.1 什么是 Linux Mint？\n\nLinux\
  \ Mint 是最受欢迎的 Linux 发行版之一，主要面向寻求用户友好且稳定的 Windows 替代方案的用户。在本章中，我将讨论 Linux Mint 的历史、使用方法以及该发行版的优势和独特之处。\n\
  \nLinux Mint 由法国裔爱尔兰开发者 `Clément Lefèbvre` 于 2006 年创立。第一个版本 »Ada, »基于 `Kubuntu`\
  \ 并使用 `KDE` 桌面环境。最初，Linux Mint 是作为一个基于 `Ubuntu` 的发行版起步，因其多媒体支持备受好评，因为它预装了许多解码器和驱动程序。多年来，Linux\
  \ Mint 不断演变，现在提供多种桌面环境，包括 `Cinnamon`、`MATE` 和 `Xfce`，它们都旨在提供用户友好性和稳定性。\n\n提到 Linux\
  \ Mint，你可以在三种不同的桌面环境之间选择：`Cinnamon`、`MATE` 和 `Xfce`。这些环境中的每一个都有自己的优势和独特功能，以适应你的工作风格和硬件需求。让我们仔细看看这三个选项，找出哪一个最适合你。最为人知的是：\n\
  \n1. `Cinnamon`: 这个由 Linux Mint 开发的桌面环境提供了一个现代且优雅的用户界面，让人联想起 Windows。`Cinnamon`\
  \ 以其可定制性和用户友好而闻名。\n\n如果你正在寻找最新且功能完备的桌面环境，那么 `Cinnamon` 可能是你的首选。`Cinnamon` 是 Linux\
  \ Mint 最流行的版本，也是该发行版的核心。`Cinnamon` 由 Linux Mint 社区开发和维护，提供了一个既美观又实用的现代且优雅的用户界面。\n\
  \n`Cinnamon` 以其用户友好的界面脱颖而出，该界面与 Windows 非常相似，让原 Windows 用户的迁移变得更容易。该环境提供了系列自定义选项和新功能，使桌面成为一种真正愉快的体验。从灵活的任务栏到创新的窗口管理，`Cinnamon`\
  \ 的设计旨在提供一个专业且可定制的工作环境。\n\n2. `MATE`: 这个桌面环境基于 `GNOME 2`，非常适合偏好传统且高效资源界面的用户。\n\n\
  如果你偏爱经典外观且不想牺牲速度，那么 `MATE` 将是你的正确选择。`MATE` 基于较旧的 `GNOME 2` 设计，提供了一个熟悉的、传统的用户界面，许多老用户非常喜欢它。\n\
  \n`MATE` 的主要优势是它的速度和资源利用率。由于它基于不复杂的代码库，因此对于旧硬件或性能较弱的系统非常出色。`MATE` 提供了一个稳定可靠的工作环境，而没有更现代桌面可能带来的额外功能和负担。\n\
  \n3. `Xfce`: 一个轻量级且快速的桌面环境，特别适合旧硬件。\n\n对于那些在最小硬件上追求最大性能的人来说，`Xfce` 是首选的桌面环境。`Xfce`\
  \ 以其轻量且高效的设计而闻名。它确保即使是旧设备或性能较弱的机器也能流畅运行，而不会丢失基本功能。\n\n尽管系统要求低，`Xfce` 仍提供了可定制且功能强大的桌面体验。它比\
  \ `Cinnamon` 或 `MATE` 更不侵入性，专注于提供一个快速、稳定且资源高效的环境。如果你想要一个在各种硬件配置上运行良好的快速响应桌面，`Xfce`\
  \ 是一个极佳的选择。\n\n在 `Cinnamon`、`MATE` 和 `Xfce` 之间做决定最终取决于你的个人喜好和需求。如果你想要现代、功能丰富且视觉良好的系统，那么\
  \ `Cinnamon` 可能是最佳选择。然而，如果你看重经典、快速且资源高效的环境，那么应该考虑 `MATE`。如果你喜欢适用于旧硬件的轻量级系统或极简主义设置，那么\
  \ `Xfce` 是理想的解决方案。\n\n这些桌面环境每一个都有了自己的优势和特点。幸运的是，Linux Mint 足够灵活，你可以选择尝试不同的环境，并找到最适合你工作风格和需求的那个。无论你做出什么选择，Linux\
  \ Mint 都能为高效且愉快的计算体验奠定坚实的基础。\n\n如果你已经安装了带有特定桌面环境的 Linux Mint，稍后想尝试另一个，你也可以从官方存储库安装额外的包。例如，你可以通过安装相应的包向\
  \ `MATE` 安装中添加 `Cinnamon`。\n\n如果你愿意，你也可以安装、尝试并丢弃其他免费提供的桌面环境。你完全可以自己决定，并一定能找到适合你的桌面。Windows\
  \ 是做不到点的。微软替你做出了决定。\n\nLinux Mint 的操作是直观且用户友好的，这对于 Windows 转换者特别有利。以下是其操作的一些关键方面：\n\
  \n1. `安装`: Linux Mint 的安装非常简单。图形化安装程序会引导你完成整个过程。你可以将 Linux Mint 作为唯一的操作系统安装，也可以与现有\
  \ Windows 系统并存。\n\n2. `桌面`: Linux Mint 的桌面结构清晰。开始菜单位于左下角，类似于 Windows。在这里你可以找到应用程序、设置和系统工具。任务栏显示已打开的应用程序和系统通知。\n\
  \n3. `应用程序管理`: 通过 »软件管理器«我喜欢称它为 »应用商店«），你可以方便地安装新程序。它提供了按分类的应用程序。许多知名程序如 `Firefox`、`LibreOffice`\
  \ 和 `VLC` 都已经预装。\n\n4. `系统设置`: 通过 »系统设置«，你可以全面定制你的系统。从外观到网络设置再到用户账户——一切都清晰地组织在一起。\n\
  \n对于 Windows 转换者来说，Linux Mint 具有许多优势：\n\n1. `免费开源`: Linux Mint 是免费的，所有软件都基于开源许可。它没有\
  \ Windows 那样的许可费用。\n\n2. `安全性`: Linux Mint 被认为是非常安全的。由于 Linux 的普及率低于 Windows，恶意软件和病毒少得多。此外，Linux\
  \ Mint 定期提供安全更新。\n\n3. `性能`: Linux Mint 以其良好的性能闻名，即使在旧硬件上也是如此。它比现代 Windows 版本消耗更少，从而提供更流畅的用户体验。\n\
  \n4. `可定制性`: 根据你的喜好自定义系统和用户界面是一个巨大的优势。你可以添加主题、插件和桌面组件来调整外观和功能。\n\n5. `软件选择`: Linux\
  \ Mint 提供了大量的免费软件。许多 Windows 程序在 Linux 上也可用。对于特定的 Windows 软件，你通常可以找到替代方案或使用 `Wine`\
  \ 运行 Windows 程序。\n\n6. `社区与支持`: Linux Mint 拥有庞大且活跃的社区。在论坛、维基和博客中，你可以找到大量的支持和指南。此外还有官方文档和支持选项。\n\
  \n与 Windows 的差异与优势：\n\n\n\n\n1. 更新策略：虽然 Windows 更新经常在不方便的时间发生且有时会强制重启系统，但在 Linux\
  \ Mint 中，你对更新拥有控制权。你可以决定何时以及安装哪些更新。\n\n2. 隐私：Linux Mint 尊重你的隐私。它没有像 Windows 10 和\
  \ 11 那样的强制性遥测或数据收集。\n\n3. 稳定性：Linux Mint 以其稳定性闻名。它基于 Ubuntu 和 Debian 的稳定版本，并接收定期的安全和维护更新，以保持系统的可靠。\n\
  \n4. 模块化：Linux Mint 是模块化的。这意味着你可以根据需要替换或添加单个组件，而无需重新安装整个系统。\n\n## 我的简要结论：\n\n对于任何寻找用户友好、稳定且安全的\
  \ Windows 替代方案的人来说，Linux Mint 都是极佳的选择。凭借其多种桌面环境、高度的可定制性以及优于 Windows 的众多优势，Linux\
  \ Mint 为初学者和经验用户提供了一个强大且灵活的操作系统。如果你准备好尝试新事物并从 Linux Mint 的许多优势中受益，那么切换到这个 Linux\
  \ 发行版可能正适合你。我们现在一起应对这个问题，不是吗？\n\n## 18. 迁移准备\n\n从 Windows 到 Linux 的迁移是一个大步骤，应该经过良好的计划和准备以确保顺利过渡。本章描述了你在迁移之前和期间应该的所有重要考虑和步骤。这些包括选择正确的发行版（正如我提到的，我将向你介绍\
  \ Linux Mint）、备份数据、准备硬件以及熟悉新系统。\n\n### 18.1 你需要什么\n\n1. 一个比电脑存储空间更大的移动硬盘——用于容纳**所有**数据和\
  \ Windows 镜像。确保硬盘状况良好。它在过程中不能发生故障。\n\n2. 云存储。如果你没有硬盘或硬盘容量不足，也可以使用云存储进行备份。你也可以刻录\
  \ DVD。重要的是拥有一个可靠的备份。\n\n3. Paragon Backup 17 CE。你可以从 Paragon 下载这个免费的备份工具。\n\n4.\
  \ 用于 Paragon 救援环境的 USB 盘。我建议使用 `16GB` 的 U 盘。你需要这个 U 盘在发生故障时启动 Paragon 救援环境并创建 Windows\
  \ 备份。创建救援 盘后，我建议用永久标记笔对其进行标记。\n\n5. 用于 Linux 现场运行环境和 Linux 安装程序的第二个 USB 盘。我建议使用\
  \ `16GB` 的 U 盘。\n\n6. 硬件清单。进入控制面板、设备管理器并记录已安装的设备。如果你有一台相当现代的标准 PC 或笔记本电脑，Linux Mint\
  \ 应该无问题地运行。但像往常一样，细节决定成败。你也可以截图并打印出来。重要的是你以后可以识别电脑中的组件。通常你不需要这个硬件列表——但如果你出于任何原因需要它，最好还是准备好。\n\
  \n7. 软件清单。记录安装了哪些软件以及你使用了哪些软件。Office、Photoshop 等。在 Linux 中，几乎每个产品都有替代品。然而，特定的程序可能无法在\
  \ Linux 上运行，你可能需要 `WINE`（Wine Is Not Emulator，Wine 不是模拟器）。你需要确切知道你使用哪些产品。\n\n8.\
  \ 账户和登录。你需要所有的账户及其登录数据以便在 Linux 中使用。我建议：在你的 Windows 电脑上安装 Firefox 浏览器并创建一个 Firefox\
  \ 同步账户，在 Firefox 账户中开启双重身份验证。登录所有服务并将密码保存在 Firefox 中。或者，安装 `Keepass` 或 `KeepassXC`，将你所有的登录信息和账户存储在安全的密码库中。记住包括电子邮件账户、Facebook、Instagram、Twitter、Amazon、银行登录等。\n\
  \n9. 时间和耐心。你需要时间和耐心。收集所有账户并将它们保存在 Firefox 或 `Keepass` 中。获取硬件和软件的概览。电脑上的数据越多，备份所需的时间就越长。先冷静地完成这一切并确保所有数据安全。只有这样你才能开始迁移本身。\n\
  \n### 18.2 数据备份\n\n在我们开始从 Windows 迁移到 Linux 之前，全面的数据备份至关重要。按照以下步骤操作：\n\n1. 外部硬盘或云端：将你的重要文件备份到外部硬盘或云端（如果你有一个只有你能访问的可靠存储解决方案）。这确保了在安装过程中发生错误时你的数据得到保护。\n\
  \n2. 系统镜像：为你的 Windows 系统创建一个完整的系统映像。这允许你在需要时恢复到旧系统。我将在 Paragon 完整备份的章节中详细介绍这一点。这是下一章——因为在对系统进行任何更改之前，对系统驱动器进行完整备份是最工作。\n\
  \n3. 应用数据：备份配置文件和应用程序数据，特别是当你使用需要迁移数据的特定软件时。\n\n### 18.3 Windows 的备份和全备份\n\n由于对系统进行任何更改都可能发生错误，因此映像备份——系统全备份——是不可缺的。\n\
  \n你需要一个硬盘或其他存储设备，其大小至少与安装 Windows 的系统驱动器一样大。如果你有一个额外的外部硬盘，其大小至少与电脑中所有包含数据的驱动器一样大则更好。\n\
  \n我建议个人用户使用免费的 `Paragon Backup 17 CE`，因为它非常可靠，我已经用它进行了多次测试。全备份和映像备份效果非常好。在恢复电脑时我没有遇到过任何错误。我的网站上有一份指南和所有信息供免费下载：[`ralf-peter-kleinert.de/sicherheit-in-der-it/paragon-backup-kostenlos.html`](https://ralf-peter-kleinert.de/sicherheit-in-der-it/paragon-backup-kostenlos.html)\n\
  \n## 19. 下载 Linux Mint 和 Rufus\n\n为了启动 Linux Mint，你需要一个 USB 启动盘。你需要 Linux Mint ISO\
  \ 镜像来创建启动盘，以及 Rufus 程序来从 ISO 镜像创建启动盘。\n\n1. 从制造商网站下载 `Linux Mint`：[`www.linuxmint.com/`](https://www.linuxmint.com/)。镜像大小约为\
  \ `3 GB`，下载时间视情况而定。\n\n2. 从 [`rufus.ie/de/`](https://rufus.ie/de/) 下载 `Rufus`。你可以无需安装即可运行\
  \ Rufus。\n\n3. 准备一个 USB 盘（建议 `16 GB`）并确保它不包含任何重要数据。另外，确保不要使用 Paragon 救援盘。\n\n###\
  \ 19.1 创建 Linux Mint 启动盘\n\n我专门为这些说明说明下载了 Linux Mint 和 Rufus，格式化了一个 `32 GB` 的 U\
  \ 盘，并将逐步向你演示整个过程。\n\n\n\n\n\nLinux Mint 非常棒的一点在于，你可以轻松将其作为现场系统进行测试，而无需对你现有的操作系统进行任何更改。通过启动\
  \ USB 优盘或启动 DVD，你可以直接从这些介质启动 Linux Mint 并充分使用它，就像它已经安装在你的硬盘上一样。这允许你能够在真实环境中体验用户界面、预装应用程序以及系统的整体性能。此外，Linux\
  \ Mint 还提供了一个易于使用的用户界面和多种开箱即用的应用程序，这对于 Linux 世界的新手来说特别有吸引力。测试完成后，你只需重启电脑，你的原始操作系统将保持保持不变。\n\
  \n1. 启动 `Rufus` 并在“驱动器”（Drive）下选择你的优盘。\n2. 点击“选择”（SELECT）按钮，在下载文件夹中找到 Linux Mint\
  \ ISO 镜像文件。对我来说，它是：`linuxmint-21.3-cinnamon-64bit-edge.iso`，双击该文件或选择它并点击“打开”。`Rufus`\
  \ 将加载文件并自动配置设置：分区方案、目标系统、驱动器标签、文件系统和簇大小。\n\n3. 点击底部的“开始”（Start）。将出现一个窗口显示检测到 ISOHybrid\
  \ 镜像。保持设置为推荐设置并点击“确定”（OK）。可能会打开另一个窗口，你需要你需要额外的数据。如果是这样，点击“是”（Yes）。将弹出一个警告，提示优盘上的所有数据将被删除。如果你确定优盘上没有重要数据，请点击“确定”。`Rufus`\
  \ 将随后创建优盘：\n\n![](img/image_rsrc1GY.jpg)\n\n当 `Rufus` 创建优盘后，你将在绿色区域看到“完成”（DONE）。点击“关闭”（CLOSE）。\n\
  \n优盘现在已准备就绪，可以使用它来启动 Linux Mint。如前所述，尝试 Linux 甚至不需要安装它，因为 Linux Mint 可以作为现场系统启动并直接从\
  \ RAM 中运行。\n\n## 19.2 作为现场系统启动 Linux\n\n对于 Linux 新手来说，始终建议首先启动 Linux Mint 的现场系统，以确保电脑硬件完全兼容。这种方法允许用户在真实环境中体验操作系统，而不会更改现有系统。此外，在执行安装之前，熟悉\
  \ Linux Mint 的界面和功能是有益的。\n\n现场系统提供了获得初步体验并观察各种程序和设置如何工作的机会。这可以缓解过渡压力并平滑初始学习曲线，因为在决定完全安装之前，你已经对系统有了某种熟悉。\n\
  \n![](img/image_rsrc1GZ.jpg)\n\n在下一页，你将看到 2 张 Linux Mint 桌面的图像。\n\n![](img/image_rsrc1H0.jpg)![](img/image_rsrc1H1.jpg)\n\
  \n## 19.3 硬件准备\n\n检查你的硬件兼容性并在必要时进行调整：\n\n1. 驱动程序：检查硬件是否有可用驱动程序。大多数现代发行版支持广泛的硬件，但特定设备（如打印机或显卡）可能需要额外的驱动程序。\n\
  2. 分区：考虑你想如何划分硬盘。为你的个人数据创建一个单独分区是有用的，以便在未来的系统更新或更改期间保护它。\n3. 外设：使用所选发行版的现场版本测试所有外设（如打印机、扫描仪和外部驱动器），以确保它们兼容。\n\
  \n## 20. 我的现场模式建议\n\n在你决定在电脑上安装 Linux Mint 并可能覆盖你现有的 Windows 操作系统之前，我强烈建议你先使用 Linux\
  \ Mint 的现场模式。现场模式允许你在不更改当前系统的情况下尝试 Linux Mint。让我们来看看这为什么这是一个如此明明的决定，以及为什么你不需要担心。我将在下一章介绍\
  \ Linux Mint 的正确安装方法。\n\n## 1. 对你的当前系统无风险\n\nLinux Mint 的现场模式是测试操作系统而不危及你现有 Windows\
  \ 或另一个操作系统的极佳方法。在现场模式下，Linux Mint 直接从 USB 优盘或 DVD 运行，不会对你的硬盘或当前操作系统进行任何更改。你可以使用\
  \ Linux Mint 的所有功能和应用程序，而无需更改当前的设置。\n\n为什么这很重要？因为在 във模式下，你可以完全体验 Linux Mint，而没有意外丢失数据或损坏你当前系统的风险。你不需要担心在测试\
  \ Linux Mint 时发生任何错误——你的 Windows 系统将保持完好且未受影响。\n\n## 2. 无需安装的全功能体验\n\n在现场模式下，你有机会体验\
  \ Linux Mint 的完整功能。你可以测试所有预装应用程序，浏览系统并熟悉用户界面。\n\n为什么这很有用？因为你可以在做出最终决定之前发现 Linux\
  \ Mint 是否满足你的需求。你可以测试用户界面，查看软件在你的硬件上的运行情况，并检查是否具备所有所需的功能。这让你让你清晰地了解 Linux Mint 在实践中的工作方式，而无需承诺进行安装。\n\
  \n## 3. 快速且安全的测试\n\n在现场模式下测试 Linux Mint 不仅安全而且快速方便。你不需要在硬盘上进行任何更改或安装——只需插入 USB 优盘，重启电脑，就可以测试\
  \ Linux Mint 了。\n\n为什么这有优势？因为现场模式提供了一种探索 Linux Mint 的快速方法，而无需处理通常非常耗时且复杂的安装过程。你可以在几分钟内判断系统是否符合你的预期，而\
  \ 不会迷失在安装细节中。\n\n## 4. 无承诺的测试\n\n现场模式允许你在没有任何义务的情况下完全测试 Linux Linux Mint。如果你发现它不符合你的预期，或者你找不到某些功能，你只需移除\
  \ USB 优盘并像往常一样使用电脑即可。\n\n为什么这让人放心？因为你不需要做出长期承诺。你可以随心所欲地测试，如果它不适合你，可以立即返回原来的操作系统。这减少了安装新操作系统时常见的压力和不确定性。\n\
  \n## 5. 故障诊断与硬件兼容性\n\n现场模式的另一个优势是它可以帮助你在执行安装之前识别潜在的硬件问题。你可以看到 Linux Mint 与你的硬件配合得如何——所有驱动程序是否正确加载、分辨率是否存在任何问题，或者特定硬件组件是否被正确识别。\n\
  \n为什么这很重要？因为你可以在经历繁琐的全安装之前尽早发现问题。如果遇到问题，你可以在现场模式下解决它们，或者在决定之前寻找解决方案。\n\n## 6. 总结\n\
  \n在现场模式下，你可以在不危及现有系统或更改硬盘硬盘的情况下，彻底测试 Linux Mint。它是熟悉操作系统用户界面和功能、检查硬件兼容性并判断 Linux\
  \ Mint 是否满足你需求的最佳方法，而且没有任何风险。\n\n简单来说：现场模式是任何担心安装过程中出现问题的人的理想解决方案。你可以安全地尝试 Linux\
  \ Mint，并在对操作系统有全面的了解后再决定是否在电脑上安装它。\n\n## 21. 基础准备结束\n\n\n\n\n\n亲爱的读者和感兴趣的相关人士，到目前为止一切顺利。我们现在已经详细讨论了为什么从\
  \ Windows 切换到 Linux Mint 代表了一个真正的替代方案。我分析了使用云端的优缺点，并向您介绍了 Linux Mint 的安装过程。确保您的数据安全并进行备份是关重要的步骤。\n\
  \n尽管 Windows 可以通过多种方式进行自定义以减少数据流出，但只有在系统离线时才能保持完全的控制。我使用 Windows 很多多年并很欣赏它，但目前的发展引起了我的担忧。如果你购买了这本书，你可能也有同样的怀疑态度。\n\
  \n这本书的目标读者不是 Linux 专业人士，而是针对任何希望尽可能顺利地过渡到 Linux Mint 的人。要涵盖 Linux 的每一个方面是不可能的，但我将引导您了解关键功能和程序，以确保您在使用新系统时高效工作。\n\
  \n请记住，每台电脑都是独特的。硬件配置可能会单独影响 Linux Mint 的体验。因此，请关注接下来的章节，我们将更深入地了解该系统，并为实际工作做好准备。\n\
  \n## 22. 安装 Linux Mint\n\n在按照之前的方法创建好 Linux Mint 启动盘后，是时候启动 Linux Mint 了。\n\n##\
  \ 1. 准备并插入 USB 盘\n\n确保您的 USB 盘已准备就绪并在其中安装了 Linux Mint。将 USB 盘插入电脑上可用的 USB 端口。\n\n\
  ## 2. 重启电脑\n\n要从 USB 盘启动，您需要重启电脑。您可以从开始菜单重启，也可以按住电源键几秒然后再次按下启动重启。\n\n## 3. 进入 BIOS/UEFI\n\
  \n重启电脑时，您需要进入 BIOS 或 UEFI 设置来调整启动顺序。在这里，您可以指定电脑应该从哪个介质启动。\n\n*   **访问 BIOS/UEFI**：通常，在启动电脑时，屏幕上会显示一条短消息，指示要按哪个键进入\
  \ BIOS 或 UEFI。此键可能是以下之一：`Esc`、`F1`、`F2`、`F8`、`F10`、`F11`、`F12` 或 `Del`。\n*   **Mac**：如果您使用的是\
  \ Mac，在启动音后按住 `Alt` 或 `Option` 键进入启动菜单。\n\n## 4. 选择启动设备\n\n进入 BIOS 或 UEFI 菜单后，您需要更改启动顺序，以确保电脑从\
  \ USB 盘启动。\n\n*   **启动菜单**：许多系统提供特殊的键来直接访问启动菜单。此键可能是 `F12`、`Esc` 或屏幕上指示的另一个键。在这里选择\
  \ USB 盘作为启动选项。\n*   **BIOS/UEFI 设置**：如果您直接在 BIOS 或 UEFI 中更改启动顺序，请导航到相应的设置并将 USB\
  \ 盘设为第一个启动设备。保存更改并退出 BIOS/UEFI。\n\n## 5. 启动 Linux Mint\n\n调整启动顺序后，电脑将从 USB 盘启动。根据系统运行的模式，您将看到不同的菜单：\n\
  \n*   **EFI 模式**：如果您的系统运行在 EFI 模式（UEFI 模式），您将看到 `GRUB` 菜单。`GRUB` 是引导加载程序，它为您提供如何启动\
  \ Linux Mint 的选项。只需选择默认选项继续。\n*   **BIOS 模式**：如果您的系统运行在 BIOS 模式（Legacy 模式），您将看到\
  \ `ISOLINUX` 菜单。该菜单提供与 `GRUB` 相似的选项，但格式不同。\n\n## 6. 现场模式或安装\n\n一旦到达 Linux Mint 启动菜单，您就可以选择在现场模式（Live\
  \ mode）下尝试 Linux Mint，或者直接将其安装到电脑上。现场模式允许您在不更改现有安装内容的情况下测试系统。如果您决定继续安装，只需按照屏幕上的指示将\
  \ Linux Mint 安装到电脑上。\n\n### 22.1 执行完整安装\n\n我将引导您完成带有 Cinnamon 桌面环境的 Linux Mint 22\
  \ Wilma 的安装。`Wilma` 是截至 2024 年 8 月 Linux Mint 的当前版本。您可以在此处下载 ISO 文件：`https://www.linuxmint.com/download.php`。`ISO`\
