  \n在全新安装后，`Update Manager` 将找到大量更新。点击顶部的`Install Updates.安装更新`按钮。\n\n起初你可以忽略蓝色的横幅，它询问`Do\
  \ you want to switch to a local mirror server?（你想切换到本地镜像服务器吗？）`。会弹出一个窗口告知你即将发生的变化。点击`OK`：\n\
  \n![](img/image_rsrc1HJ.jpg)\n\n点击 `OK` 后，系统会要求你输入密码。在 Linux 中，并不是所有人都可以安装或卸载软件。Linux\
  \ 使用系统管理员密码持续地保护重要的文件、文件夹、设置和进程。\n\n这是安全概念的一部分。输入你的密码，Linux 将开始安装更新：\n\n![](img/image_rsrc1HK.jpg)\n\
  \n输入密码后，软件包将开始下载：\n\n![](img/image_rsrc1HM.jpg)\n\n所有软件包的下载和安装可能需要一段时间。请允许系统在不中断的情况下安装更新。在新安装并进行重大更新后，你可能会被提示重启系统。请执行此操作：\n\
  \n![](img/image_rsrc1HN.jpg)\n\n要重启，请点击窗口右上角的`x` 关闭 `Update Manager`。\n\n前往任务栏上的`Start.开始`按钮（类似于\
  \ Windows 任务栏），然后点击标记为`Shutdown.关机`的红色电源按钮。`Session.会话`窗口将打开。点击`Restart.重启`：\n\n\
  ![](img/image_rsrc1HP.jpg)\n\n## 23.2 第二个任务：系统快照\n\n好了，亲爱的读者们，我们现在已经成功安装了 Linux\
  \ Mint 并使用 `Update Manager` 应用了最新的 Linux 更新。在完成第一步且你的系统已调最新后，我们来到 Linux Mint 中可能最重要的设置之一：系统快照。\n\
  \n在我们深入细节并逐步进行设置之前，让我先解释一下为什么这个功能如此重要，它在你的日常生活中将有什么价值，以及它如何帮助你在重大问题发生之前避免它们。\n\n\
  简单来说，系统快照就是系统当前状态的一种映像。想象一下你刚刚安装了 Linux Mint，设置了所有的程序，可能甚至开始编辑某些文档或整理文件。一切运行得很顺畅，但如果重大更新出现问题、程序突然导致系统崩溃，或者你不小心删除了关键的系统文件，会怎样？在这种时刻，情况可能会迅速变得令人沮丧，通常重装将是最后但也是必要的选择——除非你采取了预防措施。\n\
  \n这就是系统快照大显身手的地方。有了快照，你可以随时将系统恢复到早之前的正常状态。这意味着即使在发生严重错误后，你也不必从头开始。快照本质上是将你的电脑冻结在一个完美的状态，如果出了什么问题，你可以轻松地返回那个状态。特别之处在于，照片、文档或视频等个人文件不会丢失。因此，你可以在保护系统的同时而不危及你的数据。\n\
  \n系统快照背后的理念并不新，但在 Linux Mint 中，它特别对用户友好。你用于此操作的工具被称为`Timeshift.`。它在后台可靠地运行，允许你根据需要按照定期间隔（无论是每天、每周还是每月）创建自动快照。\n\
  \n在一个在我们许多人每天依赖计算机和数字系统的世界里，知道自己有一份应急计划是令人安心的。快照提供了这种安全感。它们让 Linux Mint 不仅更加稳定强大，还赋予了你实验、尝试新程序或进行系统调整的自由，而不必担心错误的决定会破坏整个系统。\n\
  \n我们现在来看如何设置 `Timeshift`、有哪些可用选项，以及如何确保你的系统保持安全可用。无论你是经验用户还是新手，系统快照都是不可或缺的工具，将为你节省许多烦恼。准备好激活这个重要功能，让你的\
  \ Linux Mint 系统更具韧性和安全性。\n\n### 23.2.1 设置 Timeshift 快照\n\n你可以前往欢迎屏幕 → `First Steps.初步`\
  \ → `System Snapshots.系统快照` 并点击绿色的`Start.开始`按钮，或者前往`Start.开始`按钮 → `System Administration.系统管理`\
  \ → `Timeshift`，或者你可以点击`Start`按钮并输入`time.`。这三个选项都会引导进入 `Timeshift` 程序：\n\n![](img/image_rsrc1HR.jpg)\n\
  \n启动 `Timeshift`。由于 `Timeshift` 对系统进行深度更改，它始终需要管理员身份验证。输入你的密码：\n\n![](img/image_rsrc1HS.jpg)\n\
  \n输入密码后，将打开 Timeshift 设置向导。点击小箭头打开帮助部分。它描述了什么是 `rsync` 快照。阅读一遍，然后点击`Next.下一步`：\n\
  \n![](img/image_rsrc1HT.jpg)\n\n系统现在将检查预期的快照大小：\n\n![](img/image_rsrc1HU.jpg)\n\n\
  \n\n\n\n在“选择快照位置”对话框中，选择一个兼容的存储设备并点击“下一步”（你无法选择任何不兼容的存储设备）：\n\n![](img/image_rsrc1HV.jpg)\n\
  \n在“选择快照级别”窗口中，你可以为时间和保留策略创建计划。起初，保持所有设置不变。你可以随时进行调整。默认设置是每天创建快照并保留 5 个。这意味着快照将保留过去\
  \ 5 天的记录。这对于初始备份很有帮助。\n\n![](img/image_rsrc1HW.jpg)\n\n在“用户个人文件夹”窗口中，保持设置不变。选择“排除所有文件”。快照是为系统设计的。我们稍后将使用备份工具备份个人数据和文件夹。这很重要，因为如果你由于系统错误需要回滚快照，那么个人文档不应该被更改。点击“下一步”：\n\
  \n![](img/image_rsrc1HX.jpg)\n\n现在你看到了“设置完成”。再次检查所有内容，然后点击“完成”：\n\n![](img/image_rsrc1HY.jpg)\n\
  \n现在你又看到了 Timeshift 窗口。点击左上角的“创建”：\n\n![](img/image_rsrc1HZ.jpg)\n\nTimeshift 正在创建第一个快照并复制每个系统文件。由于需要复制所有文件，这需要一些时间。理想情况下，一个专门用于快照的独立硬盘是最好的。如果你有一个外部硬盘，并每天安全地将快照存储在那里，那么几乎不会出任何问题。无论你做什么，你都可以回滚。保留好\
  \ Linux Mint 启动盘；我们可以立即将其作为救援盘使用。Live 环境包含了 Timeshift，万一发生错误，你可以使用它重置系统或将其移动到另一块硬盘。\n\
  \n![](img/image_rsrc1J0.jpg)\n\n当 Timeshift 完成后，你就可以关闭工具了。系统已备份完成，我们可以继续。\n\n![](img/image_rsrc1J1.jpg)\n\
  \n### 23.2.2 快照总结\n\n让我们再次总结一下。从一开始就牢记保留系统快照以及随后的定期备份是极其关重要的。设置它们快速又简单——而且说实话，如果你的电脑崩溃了、硬盘故障了或发生了意外错误……相信我的，如果你提前创建了系统快照，你将对此感激不尽。\n\
  \nLinux 无疑地比 Windows 更健壮、更安全，这一点毫无疑问。操作系统提供了一个稳定的基础，在很大程度上免疫于 Windows 用户面临的许多问题。但让我们不要忘记：Linux\
  \ 也是由人编写的，而不是神。错误会发生，软件可能会崩溃，更新有时会引起意想不到的问题。这正是系统快照大显身场的地方——它们是你的安全网。\n\n简单来说，快照是你的系统在特定时间点的精确映像。它们捕捉操作系统的当前状态并将其存储作为参考。这意味着如果更新更新、安装新软件或更改系统后发生了问题，你可以只需点击一下将一切恢复到之前的状态，而不会影响你的个人文件。\n\
  \n为什么系统快照如此重要？因为它们允许你无畏地进行实验。想测试新软件或对系统进行更深层的更改吗？没问题！如果某些运行不符合预期，你可以随时返回上一个快照，就像什么都没有发生过一样。\n\
  \n最好的部分是：快照设置快速并且可以自动创建。像 `Timeshift` 这样的工具处理这项任务，并让你创建定期快照变得特别容易。无论是每天、每周还是每次大更新——都由你决定何时以及多久创建快照。这让你能够自由地专注于实际工作，而不必时刻担心潜在的系统问题。\n\
  \n快照保存在 Linux 兼容的文件系统上，如 `ext4`。这很重要，因为只有这些文件系统可以正确存储 Linux 流畅运行必需的复杂文件权限和所有权。因此，请确保使用符合这些要求的合适存储介质。\n\
  \n老实说——创建快照！它们是你应对意外灾难最好的保护，并为你提供了充分享受 Linux Mint 所需的安全感。这是一项收益巨大的努力，可以节省数小时的故障排除和沮丧。\n\
  \n## 23.3 第三项任务：驱动管理\n\n现在，亲爱的读者们，在安装 Linux Mint 并完成初始步骤后，我们再次看到了欢迎界面。此界面提供了一些关键功能，将帮助你入门并确保系统运行顺。我想强调的特别重要的一点之一是“驱动管理”。\n\
  \n你可能会想为什么这这么重要。嗯，想象你拥有一个强大的硬件——例如一张 `Nvidia GeForce GTX 1050 Ti` 显卡。这张显卡的设计旨在提供卓越的图形性能，无论是用于游戏、视频编辑还是仅仅是桌面使用。但所有这些性能都取决于控制它的软件。这就是驱动程序发挥作用的地方。\n\
  \n驱动程序是使操作系统与硬件之间能够通信的小型软件程序。没有正确的驱动程序，你的硬件——无论是显卡、Wi-Fi 模块或其他组件——都无法发挥全部潜力。这意味着如果你没有安装正确的驱动程序，你的\
  \ `GeForce GTX 1050 Ti` 可能只被识别为基础显卡，导致性能远低于显卡实际提供的性能。Linux Mint 的平滑动画可能运行得不顺畅，像游戏或图形程序之类的可能会出现问题。\n\
  \n而这就是 Linux Mint 的驱动管理变得不可或缺的地方。欢迎界面提供了进入驱动管理的快捷方式，让你确保硬件从从起就以最佳状态运行。驱动管理会自动扫描你的系统，寻找具有私有驱动程序的硬件——即专为你的硬件开发的驱动程序。这对于\
  \ `Nvidia` 显卡来说尤为重要，例如我们的 `GeForce GTX 1050 Ti`。\n\n`Nvidia` 同时提供开源驱动和私有驱动。Linux\
  \ Mint 自带的开源驱动对于许多用户来说足够了，但它们无法充分利用你的图形性能。另一方面，`Nvidia` 的私有驱动经过了优化，可以提供可能的图形性能。它们为\
  \ 3D 图形、游戏和高需求应用程序提供了更好的支持。而且你可以轻松通过驱动管理安装这些驱动。\n\n它是如何工作的？很简单：打开驱动管理并让它扫描系统。如果你有一张\
  \ `Nvidia GTX 1050 Ti`，它会直接向你显示合适的私有驱动。只需点击“安装”，Linux Mint 会处理剩下的工作。重启后，你可以确定显卡正在以最高性能运行。\n\
  \n为什么这如此重要？因为正确的驱动配置确保你能够获得最佳结果。你的硬件运行得更稳定，遇到崩溃或性能瓶颈的问题也会减少。显卡是一个例子，但同样适用于 Wi-Fi\
  \ 适配器、声卡或打印机等组件。驱动管理确保你的硬件从一开始就按预期工作。\n\n点击“驱动管理”下的绿色按钮：\n\n![](img/image_rsrc1J2.jpg)\n\
  \n驱动管理正在搜索驱动程序：\n\n![](img/image_rsrc1J3.jpg)\n\n如果像我这种情况不需要驱动程序，你将看到以下输出：\n\n![](img/image_rsrc1J4.jpg)\n\
  \n## 23.4 第四项任务\n\n驱动管理之后。如果你的 Linux Mint 发现并安装了驱动程序，请创建一个新的 `Timeshift` 快照。进入开始菜单，输入\
  \ »time,« 然后点击 `Timeshift`。使用你的密码登录，然后在 `Timeshift` 中点击“创建”。然后你就可以继续。\n\n## 23.5\
  \ 第五项任务：应用程序管理\n\n\n\n\n那么，让我们进入正题吧！你肯定想看看 Linux Mint 提供了哪些软件，对吧？我的意思是，你切换到 Linux\
  \ Mint 应该是为了最后只面对一个空白的桌面吧。不，Linux Mint 从一开始就带了一了一套非常实用的工具，我可以告诉你：其中包含了一些真正的“宝藏”！\n\
  \n### 1. 办公套件\n首先是办公套件。Linux Mint 在安装后就预装了 `LibreOffice` —— 这是一个完整的办公软件包，在许多方面都可以与\
  \ `Microsoft Office` 能够媲美，而且是免费的。无论你需要编写文本文档、创建电子表格还是准备演示文稿，`LibreOffice` 都能涵盖这些领域。最棒的部分是：它还兼容\
  \ `Microsoft Office`。你可以轻松地继续使用或与在使用 `Microsoft Office` 的同事共享现有的 `Word`、`Excel`\
  \ 或 `PowerPoint` 文件。它是一个功能齐全的替代方案，我敢说你不会错过任何功能。\n\n### 2. 图像编辑与多媒体\n### 使用 GIMP\
  \ 进行图像编辑\n但这远非全部。一个现代操作系统如果没有图像编辑程序，算什么呢？Linux Mint 在这方面也有解决方案。通过 `GIMP`（GNU 图像处理程序）等程序，你拥有了一个强大的工具，可以与市场上昂贵的替代品竞争。无论你想进行简单的照片修正，还是创建复杂的图形，`GIMP`\
  \ 都是一个多功能的工具，能为每种需求提供无数特性。而且完全不需要担心昂贵的许可证。想想你为 `Photoshop` 要付多少钱吧！`GIMP` 几乎可以做 `Photoshop`\
  \ 能做的一切。这需要一点时间适应，但它是免费的。这是一个很小的代价。\n\n### 视频与音乐\n你的多媒体需求也得到了满足。Linux Mint 提供了播放你喜爱的视频或音乐所需的所有工具。`VLC\
  \ Media Player` 是一个极好的工具，可以播放你交给它的几乎任何格式。无论是你在硬盘上存放了多年的旧 `AVI` 文件，还是最新的高清 视频，`VLC`\
  \ 都能处理。此外，还有 `Rhythmbox` 音乐播放器，它可以像世界上最自然的事情管理并播放你的音乐收藏。`Rhythmbox` 是预装的，但稍后我会向你展示我认为更好的替代方案。同样是免费的。\n\
  \n### 视频编辑\n对于那些不仅想听音乐或看电影的人，Linux Mint 也还包含了视频编辑程序。像 `Kdenlive` 这样的工具让你轻松地剪辑自己的视频、添加特效或创建片段。你不需要成为专业人士就能获得很的结果。Linux\
  \ Mint 为你提供了系列选项来表达你的创意。然而，视频编辑中有些特定的细节需要考虑。稍后会详细介绍。\n\n### 3. 通信与互联网\n### 电子邮件与网页\n\
  当然，还有用于日常通信的程序。`Thunderbird` 电子邮件客户端预预装，可以帮你跟踪邮件。无论你只有一个个人邮箱账户，还是为了工作处理多个邮箱箱，`Thunderbird`\
  \ 都能轻松地处理一切。它支持所有常见的电子邮件协议，而且直观易用。\n\n如果你想浏览互联网，`Firefox` 是你忠实的伴侣。这个浏览器也是预装的，提供了速度、安全和可定制性的卓越结合。对于日常使用，它绰绰有余，但当然你也可以随时安装其他浏览器，如\
  \ `Chrome` 或 `Opera` —— 选择权在于你。\n\n### 4. 软件管理器\n总结一下：Linux Mint 不是一个需要你用软件填充的空操作系统。恰恰相反！它已经带有了经过深思熟虑的基础设置，对于大多数日常任务绰有余。你可以立即开始，无需花费大量时间在安装和配置上。如果你以后需要特定的软件，Linux\
  \ Mint 的应用程序管理工具 `Software Manager` 就是你的下一个停站。在那里，你会发现大量的额外程序可选，只需点击几次即可安装。\n\n\
  无论你想工作、创作还是简单地放松，Linux Mint 在安装后就为你提供了你所需的一切。\n\n通过启动菜单或欢迎对话框打开应用程序管理器：\n\n![](img/image_rsrc1J5.jpg)\n\
  \n你在这里可以看到 Linux Mint 组织得井有序的应用程序管理。没有广告，没有烦人的付费选项 —— 这不很棒吗？一切都分类得整齐且清晰，正如你所希望的那样。没有隐藏成本，没有在安装后突然要求付款的诱人提议。在这里，你可以完全专注于真正重要的事情：软件。\n\
  \n应用程序管理，也称为 `Software Manager`，是你所有软件需求的中心枢纽。从这里，你可以访问大量的程序选择，并轻松直接地安装它们。所有内容都划分为清晰的类别，以便你轻松导航并快速找到你正在寻找的内容。没有令人困惑的菜单结构或不知无措的选项\
  \ —— 该应用程序的设计即使是初学者也能立即上手。\n\n类别安排合理，涵盖了日常电脑使用所需的所有领域。例如，在“互联网”类别中，你会找到像 `Firefox`\
  \ 和 `Chrome` 这样的浏览器，以及像 `Thunderbird` 这样的电子邮件程序或像 `Telegram` 这样的消息工具。在“办公软件”类别中，有像\
  \ `LibreOffice` 这样的程序，通过你可以创建文本文档、电子表格或演示文稿。你需要的一切只需点击。\n\n如果你对多媒体感兴趣，可以浏览“视频和音频”类别。在这里你会找到用于视频的\
  \ `VLC Media Player` 或用于音乐收藏的其他音乐播放器。但这里也代表了图像编辑的程序（如 `GIMP`）或视频编辑工具（如 `Kdenlive`）。\n\
  \n“图形和图像编辑”类别为你提供了一系列绘图和图形程序，适用于简单任务和专业项目。对于开发者，有“编程”类别，你可以在那里找到开发环境、文本编辑器和其他编程工具。\n\
  \n在“游戏”部分，你可以期待许多作品，从简单的休闲游戏到针对 Linux 优化的更复杂的游戏。如果你想提高你的系统管理能力，将在“系统工具”类别中找到实用的程序，以优化调整和管理你的\
  \ Linux Mint 系统。\n\n总之，Linux Mint 的应用程序管理是一个真正的宝藏：整洁、高效，且没有烦人的广告或付费选项。你可以安静地浏览，选择适合你的程序并立即开始。最棒的部分是：一切都是免费的，并且只需点击几次即可安装到你的系统中。这是\
  \ Linux Mint 如此好用的另一个原因。\n\n\n\n\n\n例如，你想编辑一张专业照片吗？`GIMP` 已经准备就绪，并为你提供了你对图像编辑程序所期待的所有工具——而且它是免费的。或者，你需要为工作创建一个制作精美的演示文稿？`LibreOffice\
  \ Impress` 为你提供了设计引人注目且具有说服力的演示文稿所需的一切，且无需花费一分钱。也许你还想尝试音乐制作？像 `Audacity` 这样的程序可以帮助你将创意想法变为现实。\n\
  \n即使在游戏领域，你也不必担心。许多优秀游戏可以在 `Application Management`（应用程序管理）中找到，而且不需要信用卡。这些游戏很容易获取，你可以直接从桌面启动它们。\n\
  \n最棒的部分是，所有这些程序只需点击几次即可安装。不需要麻烦地下载 `exe` 文件，不需要许可证代码，也没有复杂的安装程序。你只需选择感兴趣的程序，点击“安装”，`Linux\
  \ Mint` 就会处理剩下的工作。之后，应用程序就就绪了，你可以立即开始使用。\n\n所以，在 `Linux Mint` 的 `Application Management`\
  \ 中，你将找到你心心的一切。无论你想工作、进行创作还是纯粹为了娱乐——合适的软件触手可及。而且这一切都不存在购买额外软件或处理许可证的烦恼。`Linux Mint`\
  \ 赋予你自由，让你完全专注于真正重要的事情：你的项目、你的创意和你的生产力。\n\n### 23.5.1 WINE Wine 不是模拟器\n\n好了，确实可能会发生这种情况：尽管有这么多优秀的\
  \ Linux 程序，你突然想：“噢，我一直很喜欢用这个 Windows 工具！我不能想办法让它在 `Linux Mint` 上也运行吗？”这时候 `WINE`\
  \ 就派上用场了。它的意思是“Wine Is Not an Emulator”（Wine 不是模拟器）——听起来很困惑对吧？但别担心，我会为你简单解释。\n\n\
  `WINE` 就像 `Windows` 世界和 `Linux` 世界之间的桥梁。它允许你在 `Linux` 上安装并运行许多 `Windows` 程序，而无需在电脑上安装\
  \ `Windows`。这意味着如果你无法放弃某个特定的 `Windows` 程序，`WINE` 让你也能在 `Linux` 上使用它。如果你有一个特定的工具或程序，而它在\
  \ `Linux` 上没有直接的替代品，这会特别有用。\n\n然而，我想对你诚实，`WINE` 并不是完美的。它不是一个能让每个 `Windows` 程序自动运行的魔法解决方案。有些程序在它上面运行得非常完美，而另一些则完全无法运行。这取决于具体的软件。对于更复杂的程序，例如某些游戏或高度专业化的应用程序，你可能会遇到障碍。但是（这也是\
  \ `WINE` 的伟大之处），它是值得尝试的。你可能会对有多少程序在它上面运行得顺畅感到惊讶。\n\n所以，如果你确实需要一个 `Windows` 工具且在\
  \ `Linux` 上找不到替代品，`WINE` 是你的首选。你只需通过软件管理器安装它，并尝试一下。也许你的程序会立即运行，也许它可能需要一些微调。但有一点是肯定的：它是值得的。毕竟，目标是让你的从\
  \ `Windows` 到 `Linux` 的过渡尽可能顺利——如果 `WINE` 能帮助你继续使用喜爱的程序，那已经赢了一大半。\n\n只需记住，`WINE`\
  \ 不能做一切，但当它起作用时，可以让你的 `Linux` 生活变得轻松得多。所以，不要害怕！尝试一下，看看你的 `Windows` 工具在 `Linux` 上是否也表现良好。\n\
  \n### 23.5.2 Linux  Windows 虚拟机 VirtualBox VMWare\n\n好吧，好吧，我承认：有时候确实存在这种情况，你无论如何都无法离开\
  \ `Windows`。也许有某款软件是绝对不可替代的，或者有一个游戏拒绝在 `WINE` 下运行。或者你从事的职业使得某些 `Windows` 程序是必不可少的，且根本没有合理的替代方案。别担心——`Linux\
  \ Mint` 为这种情况提供了一种解决方案，而且不会让你陷入困境：虚拟化。\n\n`Linux Mint` 允许你免费使用 `VirtualBox` 和 `VMWare`\
  \ 等虚拟化解决方案。但这到底意味着什么呢？嗯，虚拟化是一种技术，本质上是在你的真实电脑内部创建一个第二台电脑。把它想象成在你的 `Linux` 桌面窗口中运行一个\
  \ `Windows` PC。你习惯的 `Windows` 的一切内容都在这个虚拟机中运行——与你真实的 `Linux` 系统完全隔离。这就像在一个机器里了两台电脑。\n\
  \n`Linux Mint` 提供的最著名的虚拟化解决方案是 `VirtualBox` 和 `VMWare`。这两个程序都非常友好，且相对容易安装和设置。如果你选择\
  \ `VirtualBox`，可以直接通过 `Linux Mint Application Manager` 安装。对于 `VMWare`，你需要从官方网站下载软件，但也不是什么深奥的技术。\n\
  \n一旦安装了软件，你就可以设置所谓的“虚拟机”。为此，你需要一个 `Windows` 安装文件，例如 `ISO` 文件。有了这个文件，你就可以在虚拟机内“安装”\
  \ `Windows`，就像在真实电脑上安装它一样。安装过程与在普通 `Windows` 电脑上一样，只是一切都发生在这个窗口（虚拟环境）中。\n\n诀窍在这里：你可以在这个虚拟机中使用\
  \ `Windows` 和你所有熟悉的程序，而完全无需离开 `Linux`。如果你有一个在 `WINE` 下无法运行的强大程序，或者工作所需的特定 `Windows`\
  \ 软件——没问题。只需打开你的虚拟机，在里面启动 `Windows`，你就搞定了。\n\n当然，有几点需要注意。你的电脑应该有足够的性能，因为 `Windows`\
  \ 是与你的 `Linux` 系统并行运行的。你需要足够的 `RAM` 和处理能力来运行两个操作系统。如果你只是在 `Windows` 下做一点办公工作，那通常不是问题。然而，如果你想运行图形密集型应用程序或游戏，你应该确保你的电脑配置已到位。\n\
  \n这种虚拟化的另一个优势是安全性。由于 `Windows` 在虚拟机内部运行，它与你真实的 `Linux` 系统完全隔离。所以，如果 `Windows` 出了问题——无论是病毒还是软件故障——你的\
  \ `Linux` 系统都不会受到影响。这为你提供了一层额外的安全保障，使得在虚拟机中使用 `Windows` 变得更有吸引力。\n\n还有对虚拟机拍摄快照的选项，类似于你在\
  \ Linux 上使用 `Timeshift` 创建的系统快照。这意味着你可以根据需要随时保存和恢复虚拟 `Windows` 环境的特定状态。所以，如果出了问题或你想尝试某些新事物，始终可以恢复之前的正常状态。\n\
  \n总结来说：即使你依赖某些 `Windows` 程序，也不必放弃 `Linux Mint` 的好处。通过 `VirtualBox` 或 `VMWare`，你可以在\
  \ `Linux` 内运行完整的 `Windows` 环境，而两个系统互不干扰。通过这种方式，你保持了对 `Linux` 系统的完全控制，同时可以访问 `Windows`\
  \ 软件——无需重启、双系统或复杂的绕路。对于任何需要兼得两者之长的人来说，这是一个优雅、灵活且强大的解决方案。\n\n## 23.6 总结 欢迎界面\n\n\n\
  \n\n你可能已经注意到，我带你过的欢迎界面（Welcome Screen）操作顺序略有不同。这其中有简单的原因。首先，我想确保你的系统是最新的。毕竟，在一个新安装但没有打过补丁或更新的操作系统上工作，有什么用呢？你心里很清楚：安全第一！如果我们深入研究\
  \ Linux Mint 的深层功能却忘记了更新系统，那将是灾难性的。因此，我的第一步是应用更新。只有这样，你的 Linux Mint 才是最新的、受保护的，并准备好进行下一步。\n\
  \n接下来，我想让 `Timeshift`——我们系统备份的忠实伴侣——发挥它的作用。如果你还记得，我们创建了一个初始快照，以确保我们在此为止所做的所有工作都不会丢失。因为有一点是明确的：无论我们付出了多少努力，总会有出错错。在这种情况下，我希望你能够放心，因为你知道\
  \ `Timeshift` 会是你的后盾。无论是更新失败还是软件问题——`Timeshift` 都能确保你的安全。因此：在我们深入研究该问题之前，先创建一个快照。\n\
  \n然后我们处理了 `Driver Management`（驱动管理）。为什么呢？嗯，驱动对于优化硬件的使用至关重要。如果你的显卡、网络适配器或其他组件运行不正常，整个\
  \ Linux Mint 的体验将大打折扣。所以，对我来说，确保一切都设置正确非常重要。是的，在这里我们也用 `Timeshift` 制作了一个快照。因为正如我常说的那样：防患于缪胜于治疗。\n\
  \n在完成了所有这些之后，我想带给你一些乐趣。现在你的系统已经更新并安全了，我想是时候让你看点东西了。你只需点开一下 `Application Manager`（应用程序管理器），可能——希望如此——会感到一丝兴奋。让我们诚实吧：想象一下你不需要不断考虑钱包就能获得所有想要的程序，这种感觉很有趣。没有烦人的价格标签，没有“仅限试用版”——一切触手可及，而无需由工资单说了最终决定。\n\
  \n所以，是的，我刻意遵循了这个顺序，因为对我来说，让你从一开始就站在稳实的基础之上非常重要。现在一切都已就绪，你可以开始探索 Linux Mint 的广大世界了——无需担心。我希望你像我一样喜欢它！\n\
  \n## 23.7 第六项任务：桌面颜色\n\n所以，我们已经走了很远的路了。系统已安装，更新已应用，驱动正在运行，而且最重要的是——我们已经准备了几个 `Timeshift`\
  \ 备份。老实说，我觉得我们可以给自己点个掌了。我们已经共同取得了许多成就，在过去的几个步骤中，你一定已经熟悉了 Linux Mint。最棒的部分是：一切都保持得如此整洁、清晰，没有你在其他操作系统中常见的那些华丽装饰和杂乱。Linux\
  \ Mint 只提供了一种精美、愉快的体验，而不会被成千上万不必要的干扰所淹没。\n\n既然我们已经有了稳实的基础，可以将注意力转向更具创意性的事情了。是时候给你的\
  \ Linux Mint 增加一点个性了！我们将通过处理桌面颜色来实现。为什么不呢？桌面是你看到最多的地方，所以为什么不让它看起来完全如你的意呢？\n\n如果你一直跟我走到了这里——我非常希望你是这样——我们现在处于同一个位置：系统很稳定，主要工作已经完成，我们可以专注于定制了。我们将从桌面颜色开始，即根据你的个人喜味定制你的\
  \ Mint 桌面。这就是 Linux Mint 的美之处：你不仅可以根据喜好定制界面，还可以轻松调整桌面的调色板。\n\n你偏于使用微妙、中性颜色的极简风格吗？没问题。或者也许更活泼一些，用大胆的色彩让你的桌面闪闪发光？那也没有问题。Linux\
  \ Mint 赋予你自由，完全按照你喜欢的方式设计桌面——而且毫无麻烦。一切都组织得良好且结构清晰，所以你不必必在无尽的菜单和设置中挣扎。定制选项可以直接访问且易于实现。\n\
  \n老实说，谁想要一个看起来和别人一模一样的无聊桌面呢？调整桌面颜色给了你一个为系统增添个人色彩的机会。这就像给你的数字家刷了一层新漆。所以让我们开始吧，让你的\
  \ Mint 桌面变得独一无二！\n\n### 定制主题\n\n点击欢迎界面上第一个部分 »`Desktop Colors`« 下方的绿色按钮，或者进入开始菜单并输入\
  \ `theme`。`Themes`（主题）窗口将打开：\n\n![](img/image_rsrc1J6.jpg)\n\n在这里，你可以轻松地在浅色和深色之间切换，或者自定义颜色。尽管尝试尝试。你一定能找到你喜欢的。\n\
  \n![](img/image_rsrc1J7.jpg)\n\n在 `Themes` 对话框中，你对 Linux Mint 桌面的外观拥有完全控制权，最棒的部分是：它极其简单。当你点击\
  \ `Advanced Settings...`（高级设置）按钮时，整个定制选项的世界开启了。这就像走进一个数字展示厅，你可以在那里浏览并选择任何你喜欢的东西。相信我，选择是非常丰富的！\n\
  \n在这里，你可以下载并应用无数的主题模板。无论你是偏好保持一切整洁利落的优雅极简风格，还是更活泼、色彩斑斓的风格来为你的桌面增添一些活力——一切皆有可能。最棒的是是：你并不限于默认的预装设计。得益于高级设置，你有数百个主题可以下载和尝试。想让你的\
  \ Linux Mint 看起来像一个未来的科技系统吗？没问题。或者想要一个经典的怀旧的外观？只需几次点击即可。\n\n主题模板提供了各种功能：从更改窗口标题栏、调整系统颜色到选择各种图标样式。你可以单独自定义桌面上的图标，更改菜单和按钮的颜色，甚至完全自定义面板或对话框的设计。\n\
  \n如果你发现某个设计不适合，不用担心。你可以轻松地更改它或切换回另一个。而且这一切都在无需重启的情况下完成。这里提供的灵活性确实令人印象。你可以创建自己独特的桌面体验——完全按照你的想法。\n\
  \n所以，如果你想让你的桌面真正具有个性化，只需点击 `Advanced Settings...` 并探索 Linux Mint 提供的许多选项。你会惊讶于这些定制选项是如此简单强大。可能性是无限的——尝试吧，让你的\
  \ Mint 桌面成为原创！\n\n右键点击桌面并选择 `Change Desktop Background`（更改桌面背景）选项。你会对这么多漂亮的图片感到惊讶。Linux\
  \ Mint 提供了丰富的壁纸选择，你可以浏览以找到桌面的完美图片。从宁静的自然景观到动态图形——总有适合各种口味的选择。\n\n如果你想进一步根据喜好定制桌面，再次右键点击桌面并选择\
  \ `Customize`（定制）。这将带你进入一个新窗口，显示屏幕布局。在这里，你有机会进一步个性化你的桌面环境。\n\n![](img/image_rsrc1J8.jpg)\n\
  \n在这个定制窗口中，你会在底部找到名为 `Desktop Settings`（桌面设置）的按钮。点击它将打开另一个窗口，你可以在那里添加或删除桌面上的各种元素。在这里，你可以决定是否要在桌面上显示`计算机`、`个人文件夹`、`垃圾箱`、`已载设备`和`网络`。\n\
  \n\n\n我个人一直开启这些选项。这让我能够直接从桌面访问我的个人文件夹或垃圾箱等重要功能和位置。因此，你可以自定义哪些图标和文件夹对你来说是最可见且易于访问的。\n\
  \n这些自定义选项允许你设计出一个既美观又实用的桌面。只需点击几次，你就可以根据自己的需求和偏好个性化你的桌面环境。\n\n尝试一下吧，让你的桌面变成一个既漂亮又实用的地方！我是这样设置我的桌面的，我觉得它非常棒。\n\
  \n![](img/image_rsrc1J9.jpg)\n\n## 24. 数据备份工具\n\n在我放心地让你开始使用全新的 Linux Mint 之前——就像向\
  \ 20 只鸡撒谷子一样——我们需要先设置数据备份。这和你目前为止为止的所有操作都一样简单。\n\n只需进入“开始”菜单并输入 »数据`。这将直接带你进入可用的数据备份选项。然后选择“数据备份”工具。这将让你有机会保护你的宝贵数据，并确保在发生意外问题时可以快速恢复所有内容。\n\
  \n设置数据备份是一个快速且直接的过程。你可以决定是否要安排定期备份、备份哪些文件夹或文件，以及将备份存储在何处。Linux Mint 让你轻松设置一个能够定期保护你数据的备份系统，而无需你不断记住它。\n\
  \n进入“开始”菜单并输入 »数据`。然后选择“数据备份”工具：\n\n![](img/image_rsrc1JA.jpg)\n\n会弹出一个对话框；点击“个人数据”下的\
  \ »立即备份«：\n\n![](img/image_rsrc1JB.jpg)\n\n现在，你可以让备份直接在 `Backups` 文件夹中创建，或者选择不同的文件夹。为了说明，我将它保持这样：\n\
  \n![](img/image_rsrc1JC.jpg)\n\n备份本身会被排除在备份之外：\n\n![](img/image_rsrc1JD.jpg)\n\n\
  在下一个窗口中，选择应该备份的文件夹。通常，这是 »个人文件夹«，它包含了你的文档、图片或视频。点击«包含目录》。最好的方法是从勾选所有文件夹开始：\n\n![](img/image_rsrc1JE.jpg)\n\
