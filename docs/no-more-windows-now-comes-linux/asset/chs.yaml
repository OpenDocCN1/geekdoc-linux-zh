  \n![](img/image_rsrc1HC.jpg)\n\n安装完成后，Linux Mint 将报告成功并建议您重启。点击“现在重启”，然后按照屏幕上的指示移除安装介质并按回车：\n\
  \n![](img/image_rsrc1HD.jpg)\n\n在移除优盘并按回车后，系统将重启并显示登录界面。输入您刚刚设置的密码并按回车：\n\n![](img/image_rsrc1HE.jpg)\n\
  \nLinux Mint 现在将启动并很快显示欢迎界面：\n\n![](img/image_rsrc1HF.jpg)\n\n仔细阅读欢迎框；它提供了关于您应该先做什么的详细信息，并给出了初步介绍。\n\
  \n\n\n\n\n点击导航并从`Getting Started.入门`开始即可。该对话框本身非常浅俗易懂，我认为不需要我做过解释。\n\n## 23. 安装后的欢迎\n\
  \n只要在欢迎对话框中勾选了`Show this dialog at system startup（启动时显示此对话框`，屏幕就会每次启动都会出现。现在，请保持此设置开启，以便你始终能看到最重要的信息。等以后你对\
  \ Linux Mint 了如指掌，就可以将其关闭。\n\n## 23.1 第一个任务：更新\n\n在欢迎对话框中向下滚动到`First Steps（初步`下的`Update\
  \ Manager（更新管理器`，点击绿色的`Start.开始`按钮。\n\n![](img/image_rsrc1HG.jpg)\n\n`Update Manager`\
