  \n## 25. 更好的备份系统 DejaDup\n\n首先，进入应用程序管理器，你可以通过“开始菜单”访问它。只需点击“开始菜单”，然后选择“应用程序管理器”。这会打开管理软件的中心程序。在应用程序管理器的顶部搜索框中输入“DejaDup”。这个强大的备份工具将立即显示。\n\
  \n![](img/image_rsrc1JH.jpg)\n\n点击“DejaDup”进入安装页面。在这里，你会看到“安装”按钮。点击它将在你的系统上安装该程序。安装过程通常快速且直接，你很快就能运行。一旦安装过程完成，只需按“启动”即可打开\
  \ DejaDup。\n\nDejaDup 是一个直观且用户友好的备份工具，提供了多种功能。它允许你对文件和文件夹进行定期备份，而无需不断管理它们。界面组织良好，可以方便访问所有必要的功能。\n\
  \n当你第一次启动 DejaDup 时，将引导你通过一个简单的设置向导。你可以选择要备份的文件和文件夹，并指定备份位置。DejaDup 支持各种存储目标，如本地驱动器、网络共享，甚至是\
  \ Google Drive 等云服务。\n\nDejaDup 的一个主要优势是其调度的灵活性。你可以根据需要设置备份周期——无论是每天、每周还是每月。此外，该程序允许增量备份，仅保存自上次备份以来的更改。这节省了空间并加快了备份过程。\n\
  \nDejaDup 的另一个亮点是它直观的恢复功能。如果发生错误或丢失数据，你可以快速轻松地恢复已备份的数据。这提供了一种额外的安全保障，让你知道在出现问题时，你的重要数据始终可用。\n\
  \n通过 DejaDup，你拥有了一个强大的工具可以可以使用，它可以帮助你可靠地备份数据，并在紧急情况下快速恢复。它易于使用，并为自定义你的备份策略提供了许多选项。如果你正在寻找一个更好的备份系统来管理数据，DejaDup\
  \ 绝对是一个极佳的选择。\n\n尝试一下，体验保持数据安全是多么简单！\n\n## 26. 可能需要的程序\n\n我想向你介绍几个我认为是预装应用程序更佳替代方案的程序。当然，预装程序已经很好地处理了基本功能但有时切换到更专业或更强大的软件可能会让你从系统中获得更多产出。\n\
  \n所以，让我们来看看这些微小但な建议，它们可以帮助你提高生产力或增强用户体验。这些程序不仅具有功能性，而且通常提供了预装应用程序并不总是具备的额外功能。\n\n\
  无论是更好的图像编辑工具、高级文本处理，还是让你的日常任务变得更简单的专用应用程序，我坚信你会在列表中发现一些真正的宝贝。它们不仅易于安装，而且完美契合你的环境。\n\
  \n当然，需要强调的是，预装程序通常是稳固且可靠的。它们集成良好，并提供了对基本功能的快速访问。然而，一旦你发现了推荐程序的额外性能提升和高级功能，你可能会发现它们提供了标准应用程序可能无法一直提供的益处。\n\
  \n以下是我的建议，帮助你更高效、更个性化地使用你的 Linux Mint 系统。安装这些程序非常简单，它们会无缝地集成到你的环境之中。\n\n### 26.1\
  \ 数据备份 DejaDup\n\nLinux Mint 附带了一个基础备份工具，该工具对于初始数据备份非常有用。它提供了备份和偶尔恢复文件的简单选项。然而，当涉及到更全面的功能和更强大的备份解决方案时，我强烈建议考虑\
  \ DejaDup。\n\nDejaDup 在几个关键方面超越了标准备份工具。DejaDup 最大的优势之一是能够设置自动计划备份。这意味着你可以精确地设置备份间隔——无论是每天、每周还是每月。这种自动化处理确保了你的数据被定期备份，而无需人工干预。\n\
  \n此外，DejaDup 提供了大量的加密选项，在备份过程中保护你的数据。如果你正在备份敏感信息并希望确保只有你或授权人员可以访问这些数据，这一点尤尤为重要。\n\
  \nDejaDup 的另一个卓越特性是它支持各种备份目标。除了本地存储外，你还可以将备份保存到 FTP 服务器或云端。这意味着你可以灵活且安全地将数据存储在不同的位置——无论是外部硬盘、网络文件夹还是像\
  \ Google Drive 这样的云服务。\n\n\n\n因此，DejaDup 提供了丰富的功能，超越了内置备份工具的基本能力。DejaDup 的用户界面非常直观，让您只需点击几次即可配置和管理备份。这为您提供了一个强大的工具，既满足了您的备份需求，又提供了额外的安全性和活性。\n\
  \n总之，DejaDup 是那些希望对数据备份有更多控制和高级功能的用户极极选择。值得安装并使用此工具来可靠地保护和定期备份您的重要数据。DejaDup 可以通过应用程序管理器轻松安装。\n\
  \n### 26.2 音乐播放器 Clementine\n\nLinux Mint 默认带有 Rhythmbox 音乐播放器，它可以可靠地播放您的音乐，还提供了流媒体播放的可能性。Rhythmbox\
  \ 对许多用户来说是一个可靠的选择，因为它提供了良好的基础功能，并无缝集成到 Linux Mint 环境中。然而，长期以来我一直在寻找一种不仅能播放音乐还能满足我特定要求的音乐播放器。\n\
  \nRhythmbox 的一个主要缺点是缺乏文件夹管理。对我来说（我怀疑对于许多其他拥有大量音乐收藏的用户来说也是），播放器能够按文件夹组织和显示音乐是关重要的。对于一个包含数千个音乐文件夹的海量收藏，如果播放器不支持此功能，管理和访问单个文件夹将成为一项挑战。\n\
  \n这就是 Clementine 发挥用场的地方。Clementine 是一个填补这一空白的音乐播放器。它提供了全面的文件夹管理，允许您按文件夹浏览和组织您的音乐库。这项功能对我来说特别重要，因为我会按流派、艺术家和专辑对音乐分类，并希望直接访问这些文件夹。\n\
  \n除了改进文件夹管理外，Clementine 还包含了自动音量调整功能，确保您的音乐音量自动平衡。这在播放音量不同的曲目或专辑时特别有用，因为它提供了了一致的收听体验，并消除了不断调整音量的麻烦。\n\
  \n因此，Clementine 不仅提供了有效管理音乐的能力，还提供了一系列让听音乐更加享受的额外功能。它使用直观，符合我对现代音乐播放器的所有要求。如果您有大量的音乐收藏并重视全面的文件夹管理，那么\
  \ Clementine 绝对是一个极佳的选择。\n\n总而言之，Clementine 提供了您对顶尖音乐播放器所期待的一切以及更多。对于任何需要高效组织音乐库并从额外功能受益的人来说，都是理想的解决方案。尝试\
  \ Clementine，体验一下使用正确的播放器管理音乐可以变得多么轻松。\n\nClementine 可以通过应用程序管理器安装。\n\n## 27. Shell\
  \ 命令行\n\n在 Linux Mint 的世界里，Shell 不仅仅是另一个工具——它是通往无限可能世界的大门，也是对系统进行深度控制的途径。但 Shell\
  \ 到底是什么，您如何使用它来满足您的需求呢？\n\nShell 也称为命令行解释器，是一个允许您通过文本输入与计算机通信的接口。与图形用户界面（GUI）不同（在\
  \ GUI 中您通过点击图标和菜单启动程序），在 Shell 中，您通过直接输入命令来工作。这些命令为系统提供指令，然后由系统执行。\n\nShell 的巨大优势之一是它的灵活性和强大。您可以使用\
  \ Shell 执行几乎任何可以在图形界面上完成的任务。这包括复制和移动文件、安装和卸载软件、调整系统设置等等等。Shell 还提供了对 GUI 中可能无法使用的高级函数和脚本的访问。\n\
  \n另一个优势是效率。许多任务可以通过 Shell 更快地完成，因为您不需要移动鼠标和点击。您只需要输入所需的命令，系统就会执行。这在您有重复性任务或想要按顺序执行多个命令时特别有用。\n\
  \n要使用 Shell，只需打开终端，您可以通过开始菜单找到它。在这里，您可以输入命令并直接在屏幕上看到输出。Shell 可能有陡峭的学习曲线，特别是如果您是命令行的新手的话，但学习基础知识是值得的。有大量的资源和文档可以帮助您熟悉各种命令及其选项。\n\
  \n**警告：** 在使用 Shell 时，您应该格外留心，特别是当您使用 root 权限时。root 权限让您对系统拥有无限制的访问权限，这意味着您也可以修改关键系统文件和配置。错误或输入错误的命令可能会导致严重后果，包括损坏您的系统或丢失数据。因此，在使用\
  \ root 权限时必须极其精确和小心。如果您不确定，请考虑寻求额外信息，或者作为预防措施，在深入研究 Shell 命令之前对您的重要数据创建备份。\n\n总之，Shell\
  \ 是一个强大的工具，让您对系统拥有完全控制权，并允许您以高效、直接的方式执行任务。明智且深思地使用它的功能，您将发现它能极大丰富您在 Linux Mint 下的工作。\n\
  \n尽管 Linux Mint 设计设计为几乎完全通过图形用户界面使用，但我决定专门用一个章节介绍 Shell。为什么呢？因为 Shell 是 Linux 不可缺的一部分，并对您的系统提供了更深入的见解和控制。尽管可以完全不使用\
  \ Shell 使用 Linux Mint，但理解它的存在和能力仍然很重要。\n\n在下一章，我将向您介绍我经常使用且可能与您相关的最重要的 Shell 命令。这些命令不仅对于管理和配置系统有用，还提供了一种执行某些任务的更高效的方法。\n\
  \n对一些基础 Shell 命令的简要概述将帮助您更好地理解如何进一步自定义和优化系统。您将学习如何管理文件和目录、安装和卸载软件，以及执行其他重要功能。\n\n\
  然而，需要强调的是，这本书并不是专门为操作 Shell 命令而设计的。大多数 Linux Mint 用户会在日常任务中使用图形界面。尽管如此，Linux Mint\
  \ 是一个真正的 Linux 系统，而 Shell 是一个不可忽视的强大工具。\n\n通过理解和使用基础 Shell 命令，您可以扩展自己的技能，并充分利用系统的潜力。即使您不认为自己是高级用户，了解这些命令也能帮助您更快地解决问题、更高效地执行系统管理任务，并最终对\
  \ Linux Mint 的工作原理有更好的理解。\n\n## 28. Shell 命令\n\n欢迎来到下一节，我们将介绍您在操作 Linux Mint 时可能会用到的核心\
  \ Shell 命令。尽管许多任务可以通过图形用户界面方便地处理，但 Shell 为系统管理提供了更直接且通常更高效的方法。所以让我们一起看看 Linux Mint\
  \ 的内部构造，看看哪些命令可以让您的生活变得更轻松。\n\n\n\n\n打开终端。在底栏底部（Windows 任务栏），你会发现一个带有小美元符号的黑色图标，这就是终端的符号。点击后，将打开一个文本窗口。\n\
  \n在文本窗口中，将显示登录用户名 @ 计算机名称（`username@pcname: ~$`），这意味着：系统上名为 username 的用户位于名为 pcname：\n\
  \n![](img/image_rsrc1JJ.jpg)\n\n如果你想获得 root 权限，输入 `sudo su`，终端会提示输入密码：\n\n![](img/image_rsrc1JK.jpg)\n\
  \n你现在已以 `root@pcname: /home/your-name#` 的身份登录，并拥有 shell 的绝对权限。使用正确的命令，你可以摧毁整个系统。因此请务必小心。最好关闭终端，打开\
  \ Timeshift 创建一个快照，然后再回到终端！\n\n![](img/image_rsrc1JM.jpg)\n\n现在我将向你展示一些重要的 shell\
  \ 命令。别担心——你并不非要在 Linux Mint 中使用 shell；系统很大程度上可以通过图形用户界面 (GUI) 进行管理。这意味着你可以通过点击来浏览大多数设置和操作，而无需查看\
  \ shell。但如果你需要某个命令，或者对 shell 能做什么好奇，那么你来对地方了。\n\n这段简短的介绍不会让你全面掌握 shell——那将是一个终身学习过程，因为它的可能性几乎是无限的。我可以做的是让你对\
  \ shell 有基本的了解，并介绍你在日常中使用可能会遇到的关键命令。\n\nshell 本质上是任何 Linux 系统的核心。命令直接在这里运行，无需经过精美图形界面的绕路。shell\
  \ 是强大的、是直接的——但也意味着你应该知道自己在做什么。进入 shell 感觉就像打开引擎盖并直接与引擎进行工作。但像任何引擎一样，你应该对你调整的内容和所在的位置保持小心。\n\
  \n以下是一些实用的命令，可能会带给你一两个“恍然大悟”的时刻。尽管尝试 shell，但请记住：能力越大，责任越大！你可以实现很多事情，但在按下回车键之前，你应该始终确切知道自己在做什么。不必恐慌——只要用心谨慎，shell\
  \ 是一个极佳的工具，只会增强你的 Linux 体验。\n\n### 28.1 文件系统\n\nshell 已经打开，你可以使用加粗的命令。在 Linux Mint\
  \ 中导航文件系统，请使用以下命令：\n\n* `cd` (切换目录): 使用此命令，你可以更改当前目录。例如：`cd /home/username/Documents`\
  \ 将你带到家目录下的 `Documents` 目录。\n* `cd ..` 返回上一级目录。\n* `cd /home/username/Doc` 并按 `Tab`，如果\
  \ `/home/` 下存在 `Documents` 文件夹，将补全单词 `Documents`。\n* `ls` (列出): 此命令显示当前目录的内容。使用\
  \ `ls -l` 获取更详细的信息，或使用 `ls -a` 显示隐藏文件。\n* `pwd` (打印工作目录): 此命令显示当前目录的完整路径。\n\n###\
  \ 28.2 管理文件、目录\n\n* `cp` (复制): 此命令允许你复制文件和目录。例如：`cp file.txt /home/username/targetfolder/`\
  \ 将文件 `file.txt` 复制到目标文件夹。\n* `mv` (移动): 此命令移动或重命名文件和目录。例如：`mv oldFile.txt newFile.txt`\
  \ 将文件 `oldFile.txt` 重命名为 `newFile.txt`。\n* `rm` (删除): 此命令删除文件或目录。小心，被删除的文件不会移动到回收站。使用\
  \ `rm -r` 删除包含内容在内的目录。\n* `mkdir` (创建目录): 创建新目录。例如：`mkdir newFolder` 创建名为 `newFolder`\
  \ 的目录。\n* `rmdir` (删除目录): 删除空目录。例如：`rmdir emptyFolder` 删除空目录 `emptyFolder`。\n* `cat`\
  \ (合并): 显示文件内容。例如：`cat file.txt` 输出文件 `file.txt` 的全部内容。\n* `less`: 分页显示文件内容，允许你滚动查看内容。例如：`less\
  \ file.txt` 允许滚动查看文件 `file.txt` 内容。\n* `head`: 显示文件的前几行。例如：`head -n 10 file.txt`\
  \ 显示 `file.txt` 的前 10 行。\n* `tail`: 显示文件的最后几行。例如：`tail -n 10 file.txt` 显示 `file.txt`\
  \ 的后 10 行。\n* `find`: 根据标准在文件系统中搜索文件和目录。例如：`find /home/username -name \"*.txt\"\
  ` 在 `/home/username/` 目录下搜索所有 `.txt` 文件。\n* `grep`: 在文件中搜索特定的文本模式。例如：`grep searchTerm\
  \ file.txt` 在文件 `file.txt` 中搜索 `searchTerm`。\n\n### 28.3 文件权限、文件属性\n\n* `chmod`\
  \ (更改模式): 更改文件或目录的权限。示例：`chmod 755 file.txt` 将 `file.txt` 的权限设置为 `rwxr-xr-x`。\n\
  * `chown` (更改所有者): 更改文件或目录的所有者和所属组。示例：`chown username file.txt` 将 `file.txt` 的所有者改为\
  \ `username`。\n* `stat`: 显示关于文件或目录的详细信息。示例：`stat file.txt` 输出关于该文件的详细信息。\n\n###\
  \ 28.4 文件系统检查\n\n* `fsck` (文件系统检查): 检查并修复文件系统错误。示例：`fsck` 的用法。\n* `e2fsck` (Ext2/3/4\
  \ 文件系统检查): 此命令专门用于检查和修复 Ext2、Ext3 和 Ext4 文件系统。示例：`e2fsck -f /dev/sda`\n* `tune2fs`\
  \ (调整 Ext2/4 文件系统): 虽然 `tune2fs` 主要用于调整文件系统参数，但你也可以用它调度某些检查和维护。示例：`sudo tune2fs\
  \ -c 30 /dev/sda1`\n* `badblocks` (检查坏块): 此命令检查硬盘或分区是否存在坏块。它可以帮助识别可能损坏文件系统的硬件问题。示例：`badblocks\
  \ -v`\n* `smartctl` (S.M.R.T 监控工具): 该工具用于监控和检查硬盘及 SSD 的状态。它利用 S.M.R.T 技术在问题发生前进行检测。示例：`smartctl\
  \ -a /dev/`\n* `xfs_repair` (XFS 文件系统修复): 如果你在使用 XFS 文件系统，此命令用于检查和修复它。XFS 是一种常用于大型文件服务器的文件系统。示例：`sudo\
  \ xfs_repair /dev/sda1`\n* `btrfs check` (Btrfs 文件系统检查): 对于 Btrfs 文件系统，`btrfs check`\
  \ 命令用于验证和修复文件系统完整性。示例：`sudo btrfs check /dev/sda1`\n* `mount -o remount,ro` 和 `umount`:\
  \ 在运行上述某些命令（特别是涉及直接文件系统修复的命令）之前，你应该将文件系统重新挂载为只读模式或卸载它，以避免潜在的数据丢失。示例：`sudo mount\
  \ -o remount,ro /dev/sda1` 或 `sudo umount /dev/sda1`\n\n\n\n\n特别重要：如果你想卸载文件系统以进行检查或修复，你必须确保没有关键进程在上面运行。想象一下，如果你正在卸载一个运行着数据库服务器（如\
  \ `MySQL`）的分区。砰，一切都崩溃了，你突然会困惑于为什么你的整个系统变得无法工作了。你需要确保在进行任何操作之前，要么妥善地关闭受影响的服务，要么将文件系统重新挂载为只读模式。\n\
  \n`umount` 命令是此操作的一个很好的例子。你用它来安全地从系统中移除分区，以便对其进行检查或修复。但请务必：如果你不小心卸载了运行关键系统服务或程序的主驱动器，可能会导致严重的后果。这就是为什么你应该始终双重检查正在操作的是哪个分区，并确保没有活跃的应用程序正在访问它。\n\
  \n如果你想检查或修复文件系统，`fsck` 命令可以提供帮助。该命令用于检查并修复不一致的文件系统。但同样，需要谨慎。仅在未挂载或只读模式挂载的文件系统上运行此命令。千万不要在正在运行且可写的文件系统上操作。想象一下在处理过程中向硬盘写入某些内容——混乱将不可避免。一个例子是\
  \ `sudo fsck /dev/sda1`，它确保对分区 `/dev/sda1` 进行错误检查。\n\n另一个重要的工具是 `badblocks`。此命令检查你的硬盘是否存在缺陷块——即无法再正常写入或读取的区域。这是早期检测硬件问题的良好测试。但同样，要小心。如果你有一个大硬盘，此命令可能会运行很长时间。所以不要在正在积极使用的磁盘上使用它，因为它可能导致数据丢失。\n\
  \n那么 S.M.A.R.T. 呢？这种内置的自检（可以通过 `smartctl` 命令启动）帮助你监控硬盘的健康状况。同样，这种测试比其他测试更安全，但如果你的驱动器已经有了坏块，过度使用可能会恶化状况。请始终准备好备份，并在出现问题时计划更换硬盘。\n\
  \n`tune2fs` 工具对于自动化文件系统维护也很有用。通过它，你可以指定系统启动多少次后自动检查文件系统。但同样，小心不要设置可能在运行时引起问题的设置。\n\
  \n对于像 `XFS` 等特殊文件系统，有 `xfs_repair` 命令。`XFS` 是一种专门为大数据量和高性能设计的文件系统。只有在你确定 `XFS` 文件系统损坏时才使用此命令，并且不要忘记：先备份，后检查。\n\
  \n最后但同样重要：对于 `Btrfs` 文件系统，有 `btrfs check` 命令。`Btrfs` 是一种现代文件系统，提供了快照和压缩等许多酷功能。同样，适用相同的规则：仅对未使用的文件系统执行检查，并在修复期间要非常小心——一步错就很容易导致数据丢失。\n\
  \n记住：尽管 shell 非常强大，但如果你不小心，它也可能同样危险。始终要深思熟虑地工作，只执行你绝对确定的命令。双检查某事比输错命令并毁掉系统要好。\n\n\
  即使你输入了一个命令没有立即毁掉系统，你的电脑也可能在一段时间内无法使用。某些命令（特别是访问硬盘或文件系统的命令）可能会消耗大量资源，导致 PC 或服务器被完全占用。鼠标可能会开始卡顿，程序可能会停止响应，在最的情况下，整台电脑似乎死机了。这发生发生并不是因为你弄坏了什么，而是因为你执行的命令正在要求硬件的全部关注。\n\
  \n以 `dd` 命令为例，它经常用于将数据从一个地方复制到另一个地方——无论是整个驱动器还是分区。此命令处理原始数据，并倾向于完全占用硬盘。所以，如果你正在运行一个\
  \ `dd` 命令（例如将大文件从一个驱动器复制到另一个驱动器），该硬盘可能会被过度使用，导致其他程序都无法运行。系统并没有坏，但只要操作运行，它就处于瘫痪状态。\n\
  \n`fsck` 或 `badblocks` 等命令也是如此。取决于硬盘的大小和要检查的数据量，这些命令可能会运行数小时。如果你在正在使用的系统上运行这些命令，它会让计算机几乎无法使用，因为硬盘被检查任务完全占用了。\n\
  \n这里的关键在于：Linux 极其强大且灵活，但这种力量必须谨慎使用。许多命令看起来是无害的，但如果使用不当，可能会产生重大影响。我不可能列出所有存在的 Linux\
  \ 命令——那样的书将有数千页，你可能读到一半就放弃了。但建立一种基本的理解是重要的，即使是最看似微不足道的命令，当它访问文件系统或你的计算机资源时，也应该仔细考虑。\n\
  \n因为记住：你输入的每一个命令都像一个工具。在正确的人手中，它可以带来极佳的改进；但在错误或粗心的人手中，它可以瘫痪甚至在最坏的情况下摧毁你的系统。所以要始终保持谨慎，特别在使用\
  \ root 权限时。这可能让你感到强大，但也像双刃剑——你拥有完全的控制权，但也拥有完全的责任。\n\n### 28.5 系统信息与管理\n\n`df` (Disk\
  \ Free)：此命令显示硬盘上的可用和用空间。使用 `df -h` 获取易读的输出。\n\n`du` (Disk Usage)：通过此命令，你可以显示文件和目录的大小。例如，`du\
  \ -sh /home/username` 显示用户目录的总大小。\n\n`top`：此命令提供系统资源使用的实时视图。\n\n### 28.6 软件管理\n\n\
  `apt-get`：此命令用于安装、删除或更新软件包。例如，`sudo apt-get update` 更新软件包列表，`sudo apt-get install\
  \ package_name` 安装新软件包。如果你以 `sudo su` 身份登录，可以省略命令前的 `sudo`。\n\n`dpkg`：通过此命令，你可以直接管理\
  \ Debian 软件包。例如，`sudo dpkg -i package.deb` 安装 `.deb` 包。\n\n### 28.7 用户管理\n\n`adduser`：此命令向系统添加新用户。例如，`sudo\
  \ adduser newUser` 创建新用户账户。\n\n`usermod`：通过此命令，你可以修改现有用户的属性。例如，`sudo usermod -aG\
  \ sudo username` 将用户加入 `sudo` 组，赋予该用户 root 权限。\n\n### 28.8 系统监控与控制\n\n`reboot`：此命令重启系统。通常在需要重启的更改后。\n\
  \n`shutdown`：通过此命令，你可以关闭系统。例如，`sudo shutdown -h now` 立即关机。\n\n### 28.9 自 Shell 命令\n\
  \n在这里，你可以记录你个人需要并认为特别重要的 shell 命令。我特意留了六页纸，提供了充足的空间。对于刚开始接触 Linux 世界的人来说，这些空间足够记录关键命令和个人笔记了。\n\
  \n\n\n\n\n我希望这个布局能帮助你有效地组织 shell 命令并优化你的 Linux 体验。请使用提供的页面创建你个人的常用命令合集，并跟踪与你相关的重要信息。\n\
  \n仅适用于纸质版书籍。\n\n## 28.10 Shell 命令资源\n\n如果你想深入学习在 Linux Mint 上使用 shell 操作，网上有许多有用的资源，它们不仅能教你基础知识，还能解释高级技术和命令。像\
  \ Tecmint 这样的网站提供了超过 100 种基本命令的全面列表，你可以逐步学习（LFCS 备考电子书，[`www.tecmint.com/essential-linux-commands/`](https://www.tecmint.com/essential-linux-commands/)）。它们涵盖了从管理用户账户到网络监控详细指南的所有内容。\n\
  \n另一个很好的来源是 FOSSLinux，[`www.fosslinux.com/103546/the-beginners-guide-to-using-terminal-on-linux-mint.htm`](https://www.fosslinux.com/103546/the-beginners-guide-to-using-terminal-on-linux-mint.htm)，它专门为初学者提供了详细指南。在这里，你会找到关于如何处理基本命令如\
  \ `pwd`（显示工作目录）或 `chmod`（更改文件和文件夹权限）的简单说明。该网站还涵盖了使用 `apt-get` 和 `dpkg` 进行软件包管理，帮助你直接从命令行安装和管理软件（FOSS\
  \ Linux）。\n\n这里是一些有用的德语网站，可以帮助你学习、参考并更好地理解 Linux Mint shell 命令：\n\n**Ubuntuusers.de\
  \ - 命令概述**：该网站对最重要的 Linux 命令提供了详尽的概述，范围从文件管理到网络命令和进程控制。所有内容都呈现得清晰且文档齐全。网络和文件工具列表尤为有用。链接：[`wiki.ubuntuusers.de/Shell/Befehls%C3%BCbersicht/`](https://wiki.ubuntuusers.de/Shell/Befehls%C3%BCbersicht/)\n\
  \n**HowtoForge.de - 终端实用基本命令**：该网站涵盖了 Linux Mint 和 Ubuntu 终端中重要的基本命令及其用法。你将找到如何安装软件或管理进程的说明。关于使用\
  \ root 账户和进程控制的提示特别有帮助。链接：[`www.howtoforge.de/uncategorized/nutzliche-grundbefehle-fur-das-terminal-unter-linux-mint-11-und-ubuntu-linu/`](https://www.howtoforge.de/uncategorized/nutzliche-grundbefehle-fur-das-terminal-unter-linux-mint-11-und-ubuntu-linu/)\n\
  \n**Computerhilfen.de - Linux 控制台命令**：该网站按字母顺序列出了最重要的 Linux 命令，解释了它们的功能并提供了实用的示例。在这里，你可以查询如何通过终端执行复制、移动或显示文件等基本操作。链接：[`www.computerhilfen.de/info/linux-befehlsuebersicht.html`](https://www.computerhilfen.de/info/linux-befehlsuebersicht.html)\n\
  \n所有这些网站都提供了基础知识和高级技术，它们是日常使用或加深 Linux shell 知识的极佳参考资料。\n\n## 29. Linux Mint 网络资源\n\
  \n既然我已经全面概述了为什么在 2024 年从 Windows 切换到 Linux Mint 是值得认真考虑的，我想提醒你为什么这一步可能尤为重要。这不仅仅是因为微软的数据收集行为（我相信这已经提供了一个充分的理由），还关乎许多让切换变得值得的其它方面。让我们深入探讨这些原因，看看为什么\
  \ Linux Mint 值得考虑。\n\n如果你已经决定放一尝试尝试 Linux Mint，我想让你的入门尽可能简单。切换到新的操作系统起初可能令人生畏，但别担心——我汇集了一些有价值的资源和起点，将使你的过渡更加轻松。特别是，我推荐德语版的安装指南，它将一步步引导你完成整个过程，并提供宝贵的技巧和窍门。\n\
  \n**Linux Mint 论坛（德语和英语）**：官方 Linux Mint 论坛为所有与 Linux Mint 相关的问题提供支持。无论是关于安装、自定义还是特定的软件问题——这里都有庞大且热心的社区。链接：[`forums.linuxmint.com/`](https://forums.linuxmint.com/)\n\
  \n**Linux Mint Wiki（德语）**：Linux Mint Wiki 是一个全面的知识库，为安装和管理 Linux Mint 提供官方说明和提示。链接：[`linuxmint-installation-guide.readthedocs.io/de/latest/`](https://linuxmint-installation-guide.readthedocs.io/de/latest/)\n\
  \n**UbuntuUsers Wiki（德语）**：由于 Linux Mint 基于 Ubuntu，UbuntuUsers Wiki 也提供了关于几乎所有与\
  \ Linux 相关的主题的有价值信息和教程，从 shell 命令到系统管理都有。链接：[`wiki.ubuntuusers.de/Startseite/`](https://wiki.ubuntuusers.de/Startseite/)\n\
  \n**Pro-Linux（德语）**：Pro-Linux 提供了一个大型论坛、定期新闻以及关于各种 Linux 主题的指南。它是 Linux 用户领先的德语网站之一。链接：[`www.pro-linux.de/`](https://www.pro-linux.de/)\n\
  \n**LinuxQuestions.org（英语）**：一个针对所有类型 Linux 问题的经典论坛，设有发行版以及虚拟化或安全等主题特定子分类。它是通用 Linux\
  \ 问题的理想选择（LinuxQuestions）。链接：[`www.linuxquestions.org/`](https://www.linuxquestions.org/)\n\
  \n**It’s FOSS（英语）**：该网站为桌面 Linux 用户提供易于理解的指南和新闻。它还包括针对 Linux Mint 的特定教程和推荐（It’s\
  \ FOSS）。链接：[`itsfoss.com/useful-websites/`](https://itsfoss.com/useful-websites/)\n\
  \n\n\n\n\n# 提示与技巧：除了基础指令外，你还会发现一些实用的提示，帮助你避免常见的陷阱，并让安装过程尽可能顺利。\n\n你可以在哪里找到这些指南？请关注专注于\
  \ Linux Mint 以及通用的 Linux 的网站和论坛。Linux Mint 官方网站也提供了安装指南的资源和链接。此外，许多德语 Linux 社区和\
  \ YouTube 频道也提供了宝贵的信息和指南。\n\n### Linux Mint 安装指南（德语）：\n[`linuxmint-installation-guide.readthedocs.io/de/latest/`](https://linuxmint-installation-guide.readthedocs.io/de/latest/)\n\
