    ## 1. 引言


    亲爱的读者们：


    在书中，我想带你们开启一段激动心的旅程，离开 Windows 世界，进入一个全新的开放且灵活的环境：Linux。从像 Windows 这样成熟的操作系统切换似乎具有挑战性，但我坚信，在读完这本书后，你将具备所需的知识和信心来成功迈出这一步。


    我们将共同探索 Linux 的许多方面，从安装到日常使用，并向你展示如何通过这个强大的操作系统重新定义你的计算体验。我的目标不仅是教你技术基础，还要向你介绍
    Linux 所提供的哲学和自由。准备好迎接改变吧——不再有 Windows，现在是 Linux！


    诚挚的，


    Ralf-Peter Kleinert


    请在阅读后为本书评分；只有这样我才能改进。


    ## 2. 为什么要从 Windows 切换到 Linux？


    出于数据隐私和安全的考虑。这是一个非常直接的总结。


    重要提示：永远不要鲁莽或草率地行动。即使已经决定从 Windows 切换到 Linux 也如此！在完成第 18 章之前，不要开始`killing Windows`！


    我从 `Windows 3.1` 版本开始就一直使用 Windows。那时，计算机还是一种新奇的事物，一切都极其有趣且令人兴奋。但多年来，微软演变成了一个贪婪的数据章鱼。今天，我们已经达到了这样一个程度：数据隐私在选择操作系统时起着核心作用。因此，在我的新书《改用
    Linux 代替 Windows》中，我向你介绍了 Windows 的缺点以及 Linux 对应的优点。显而易见，这两个系统都有优缺点——但如果你说“数据属于我”，那么其中一个候选者在负面方面脱颖而出。


    Windows 由微软开发，目前是全球使用最广泛的终端用户操作系统，提供了许多功能，并安装在无数计算机上。然而，尽管它广受欢迎且功能强大，但仍存在用户应该考虑的重大隐私担忧。在我的书中，我详细描述了
    Windows 在隐私方面的主要缺点，包括强制账户、`OneDrive` 的集成、易受病毒攻击以及更新问题。


    Windows 在隐私方面的一个核心缺点是所谓的“强制账户”。自 `Windows 8` 以来，微软日益推动用户使用 Microsoft 账户登录以充分利用操作系统的潜力。创建账户的要求引发了重大的隐私担忧，因为微软可以获取大量的个人数据。这包括电子邮件、联系人、日历数据，甚至是跨不同设备同步的设置和偏好。这种中心数据存储存在着风险，即敏感信息可能在用户不知情或未同意的情况下被收集并可能使用。微软无法可信地声称这些敏感数据未被用于其他服务或其他新服务的开发。


    另一个重大批评是 `OneDrive` 的集成，这是微软的云存储服务，通常在没有经过用户同意的情况下被激活。文件和文档会自动上传到云端，这不仅危及隐私，还限制（往往是移除）了用户对自身数据的控制。特别是在处理敏感信息的环境中，这种自动同步可能会带来巨大风险。此外，我们现在知道所有上传到云系统的数据都会被读取和分析。如果数据被微软的过滤器标记，账户可能会被挂起，数据可能会不可挽回地丢失。


    此外，Windows 以易受病毒攻击而闻名。由于其使用广泛，该操作系统是恶意软件和黑客攻击的主要目标。这些威胁可能导致个人数据的窃取或泄露。尽管有持续的安全更新和集成保护机制，风险仍然存在，特别是对于那些不经常安装安全更新或使用额外保护软件的用户来说。


    另一个问题是 Windows 频繁且有时存在问题的更新。微软定期执行更新以修复安全漏洞并提高操作系统的性能。然而，这些更新往往会有意想不到的副作用，影响系统的稳定性。更糟糕的是，某些更新是在没有预先通知或用户同意的情况下进行的，这可能导致意外重启和数据丢失。这种更新问题不仅代表了不便，如果计划之外的系统更改导致新的安全漏洞，还会危及用户的安全和隐私。


    每天都显而易见，Windows 尽管有许多优点且被广泛使用，但在隐私方面有严重缺陷。强制账户要求、强制集成的 `OneDrive`、易受病毒攻击以及存在问题的更新对用户隐私和安全构成了严重威胁。因此，让用户意识到这些风险并采取适当措施保护其数据至关重要。这包括使用额外的安全软件、仔细管理云服务，以及定期检查和调整操作系统的隐私设置。这一切导致了一系列后续的缺点：持续的、甚至是每天的警惕和检查、付费的额外软件，以及系统完全崩溃的日常风险。这并非空口无言。整个系统可能因为错误的更新而在午夜之间瘫痪。在我看来，微软已经失去了核心，不再意识到自己在世界中的地位。在我看来，微软为整个世界代表了重大的安全问题，不应允许其在没有政府监管的情况下作为营利性公司运营。


    ## 3. 2024 年 7 月 19 日的全球 IT 宕机


    从 2024 年 7 月 19 日开始，新闻到处报道，由于 `Crowdstrike` 公司的一个 Windows 安全软件的错误更新导致了大规模崩溃。我不会在这里详述厂商问题的具体细节，因为所有信息可以在网上找到。


    '
- fmt: '

    At the same time, the 365 services, Outlook, Teams, and others went down in Germany,
    the UK, Spain, the USA, and India. The full extent is still not quantified. Banks,
    hospitals, companies, private individuals, and airports—everything “went down.”
    I have often posted on Facebook, Instagram, and LinkedIn that this day would come.
    I always say when I speak with any technical support, such as that of `Telekom`,
    `WhatsApp-Sim`, or `Freenet-TV`, the following sentence: “Man is losing control
    over his technology!”


    ## 4. Do I want to disclose my data?


    Given all the negative aspects that `Windows`, or rather the company `Microsoft`
    behind `Windows`, brings with it, everyone should ask themselves: »Do I want this?«


    I will now pose many »Do I want ...« questions to simply show you which questions
    you should really ask yourself.


    Do I want to entrust `Microsoft` with all my data? Do I want `Microsoft` to dictate
    which programs or apps I can use? Do I want `Microsoft` to make software changes
    on my `PC` or laptop without asking me? Do I want to see advertisements in the
    `Start` menu? Do I want to see advertisements in folders and settings? Do I want
    to be patronized by `Microsoft`?


    Do I want `Microsoft` to install `AI` systems on my `PC`? Do I want these `AI`
    systems to photograph my screen around the clock? Do I want `Microsoft` to provide
    me with a backup system that solely aims to move my data to the cloud? Do I want
    my files, photos, and videos to be transferred to the cloud and potentially read,
    sifted through, and used to train `AI` systems by `Microsoft` and possibly third
    parties? Do I want to continue accepting the risk of problematic and poorly tested
    updates?


    Do I want to place my email traffic, documents, and files in a cloud that carries
    the risk of failure? Do I want `Microsoft` to continue working on moving my entire
    `PC` to the cloud? Do I want to give up all my data?


    Then there are a few other questions you should ask yourself: Can I live with
    not having access to my data because...


    ... the internet is not working again?

    ... the `Microsoft` cloud is crashing again?

    ... the internet is simply too slow?

    ... `Microsoft` dislikes something about my data?

    ... `Microsoft` gets hacked again?

    ... my `Microsoft` account is hacked?


    Do I want to keep paying for software and paying to use `Microsoft`’s services?


    If you can answer all these questions with »Yes,« then just keep `Windows`. However,
    if you have concerns and feel that it might not be so good to move all your data
    to the cloud and willingly entrust `Microsoft` and others with your data, then
    let’s explore what options are currently available.


    Since `Windows` is known to collect more and more user information, establish
    mandatory accounts, and increasingly move its systems to the cloud, the question
    is: Do you really want that? Do you want all your personal data to be stored somewhere
    on the internet on servers accessible to `Microsoft` and potentially third parties,
    such as hackers? This development raises not only ethical but also security concerns
    that are worth examining thoroughly.


    The digital world we live in today is characterized by constant connectivity and
    the drive to move more and more data to the cloud. This centralized storage may
    seem convenient at first glance—you can access your files from anywhere, your
    settings are synchronized, and your software is always up to date. But all these
    advantages come at a high price: control over your own data. With every click,
    with every use of a cloud-based service, you give up a piece of this control and
    hand it over to a company whose business model does not necessarily align with
    your interests.


    Even more concerning is the shift of systems and data to the cloud. Your personal
    data—whether documents, photos, emails, or even your entire computer environment—is
    stored on servers you cannot see or control. These servers are often located in
    data centers distributed across the globe and are subject to the local laws of
    the respective countries. In many cases, this means that your data is subject
    to the legal regulations and enforcement powers of other states, which can lead
    to a loss of privacy and increased risk.


    Another issue is security. Servers that store large amounts of data are an attractive
    target for hackers. Even though companies like `Microsoft` invest significant
    resources in securing their systems, there is no guarantee that your data in the
    cloud is safe. Data breaches, ransomware attacks, and other cyber threats are
    pervasive, and even the largest and most secure companies are not immune to such
    attacks. Should an attack be successful, your data could be stolen, deleted, or
    misused—potentially with devastating consequences for your personal and professional
    security.


    Furthermore, you should consider what happens to your data once it is stored in
    the cloud. There is no complete transparency about how your data is used. While
    most users assume their data is simply stored, there are indications that some
    companies also use this data for other purposes. A particularly controversial
    issue is the use of data for training artificial intelligence (`AI`). `AI` systems
    require enormous amounts of data to learn and improve, and the data you upload
    to the cloud could theoretically be used to train such systems. While this might
    improve services, it raises serious questions about privacy and control over your
    personal information.


    All these developments lead to a central question: Do you really want this? Do
    you really want a company like `Microsoft`—or any other company—to have such deep
    insight into your personal and digital life? Do you really want your data to be
    stored on servers you cannot directly access and whose security you cannot monitor
    yourself? The risks associated with storing your data in the cloud are significant,
    and it is important that you understand these risks before opting for such a path.


    The decision of whether to continue using `Windows` and accept all these concerns
    or to opt for an alternative like `Linux` is up to you. However, it is a decision
    that should be well thought out. `Linux` offers you the opportunity to regain
    control over your data and digital environment. It gives you the freedom to protect
    your privacy and configure your systems the way you want—without the constant
    pressure to disclose your personal information. In a world increasingly dominated
    by the power of a few large companies, this freedom is invaluable.


    Since you have already purchased the book, I assume that the decision has basically
    been made. However, you might not yet know exactly how to accomplish a clean transition.
    In this book, I offer you a direct transition from `Windows` to `Linux Mint`.
    Why? I will answer that in the next chapter.


    ## 5. Internet Problems


    In Germany, people frequently experience the shortcomings of the internet infrastructure
    up close. Whether it’s slow speeds, unstable connections, or even large-scale
    outages, internet problems are a constant annoyance. Regions that have been left
    behind in broadband expansion often struggle with particularly poor connections.
    But even in urban areas, where coverage should theoretically be better, there
    are often weaknesses. These problems become even more severe when you consider
    that natural disasters such as flooding, storms, or heavy snowfall can completely
    disable the network. Such events are not just temporary disruptions; they can
    make internet access impossible for days or even weeks. Recent floods in various
    parts of Germany have shown how quickly the infrastructure can collapse.

