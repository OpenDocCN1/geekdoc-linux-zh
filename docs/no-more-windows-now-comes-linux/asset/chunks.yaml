    亲爱的读者和感兴趣的相关人士，到目前为止一切顺利。我们现在已经详细讨论了为什么从 Windows 切换到 Linux Mint 代表了一个真正的替代方案。我分析了使用云端的优缺点，并向您介绍了
    Linux Mint 的安装过程。确保您的数据安全并进行备份是关重要的步骤。


    尽管 Windows 可以通过多种方式进行自定义以减少数据流出，但只有在系统离线时才能保持完全的控制。我使用 Windows 很多多年并很欣赏它，但目前的发展引起了我的担忧。如果你购买了这本书，你可能也有同样的怀疑态度。


    这本书的目标读者不是 Linux 专业人士，而是针对任何希望尽可能顺利地过渡到 Linux Mint 的人。要涵盖 Linux 的每一个方面是不可能的，但我将引导您了解关键功能和程序，以确保您在使用新系统时高效工作。


    请记住，每台电脑都是独特的。硬件配置可能会单独影响 Linux Mint 的体验。因此，请关注接下来的章节，我们将更深入地了解该系统，并为实际工作做好准备。


    # 22. 安装 Linux Mint


    在按照之前的方法创建好 Linux Mint 启动盘后，是时候启动 Linux Mint 了。


    ## 1. 准备并插入 USB 盘


    确保您的 USB 盘已准备就绪并在其中安装了 Linux Mint。将 USB 盘插入电脑上可用的 USB 端口。


    ## 2. 重启电脑


    要从 USB 盘启动，您需要重启电脑。您可以从开始菜单重启，也可以按住电源键几秒然后再次按下启动重启。


    ## 3. 进入 BIOS/UEFI


    重启电脑时，您需要进入 BIOS 或 UEFI 设置来调整启动顺序。在这里，您可以指定电脑应该从哪个介质启动。


    *   **访问 BIOS/UEFI**：通常，在启动电脑时，屏幕上会显示一条短消息，指示要按哪个键进入 BIOS 或 UEFI。此键可能是以下之一：`Esc`、`F1`、`F2`、`F8`、`F10`、`F11`、`F12`
    或 `Del`。

    *   **Mac**：如果您使用的是 Mac，在启动音后按住 `Alt` 或 `Option` 键进入启动菜单。


    ## 4. 选择启动设备


    进入 BIOS 或 UEFI 菜单后，您需要更改启动顺序，以确保电脑从 USB 盘启动。


    *   **启动菜单**：许多系统提供特殊的键来直接访问启动菜单。此键可能是 `F12`、`Esc` 或屏幕上指示的另一个键。在这里选择 USB 盘作为启动选项。

    *   **BIOS/UEFI 设置**：如果您直接在 BIOS 或 UEFI 中更改启动顺序，请导航到相应的设置并将 USB 盘设为第一个启动设备。保存更改并退出
    BIOS/UEFI。


    ## 5. 启动 Linux Mint


    调整启动顺序后，电脑将从 USB 盘启动。根据系统运行的模式，您将看到不同的菜单：


    *   **EFI 模式**：如果您的系统运行在 EFI 模式（UEFI 模式），您将看到 `GRUB` 菜单。`GRUB` 是引导加载程序，它为您提供如何启动
    Linux Mint 的选项。只需选择默认选项继续。

    *   **BIOS 模式**：如果您的系统运行在 BIOS 模式（Legacy 模式），您将看到 `ISOLINUX` 菜单。该菜单提供与 `GRUB`
    相似的选项，但格式不同。


    ## 6. 现场模式或安装


    一旦到达 Linux Mint 启动菜单，您就可以选择在现场模式（Live mode）下尝试 Linux Mint，或者直接将其安装到电脑上。现场模式允许您在不更改现有安装内容的情况下测试系统。如果您决定继续安装，只需按照屏幕上的指示将
    Linux Mint 安装到电脑上。


    ### 22.1 执行完整安装


    我将引导您完成带有 Cinnamon 桌面环境的 Linux Mint 22 Wilma 的安装。`Wilma` 是截至 2024 年 8 月 Linux
    Mint 的当前版本。您可以在此处下载 ISO 文件：`https://www.linuxmint.com/download.php`。`ISO` 大小约为
    2.7 GB，因此下载需要一些时间。在之前的章节中，我提到了 Linux Mint 21 Virginia。因此，在本章中，我们将下载额外的版本 22 Wilma。


    ![](img/image_rsrc1H2.jpg)


    如第 19 节所述，创建一个 Linux Mint 启动盘并从其启动。您将看到“Welcome to Linux Mint 22”屏幕。选择第一个选项“Start
    Linux Mint”：


    ![](img/image_rsrc1H3.jpg)


    第一个选项将启动现场环境。在这里，您可以初步检查一切是否运行正常。这与您在 Windows 中的习惯非常相似。在左下角，您会找到 Linux Mint 图标作为开始菜单的启动按钮。开始菜单包含辅助工具、图形、互联网、Office、声音和视频、管理、偏好等应用程序。在首次启动时，所有内容都将是英文。但是，您可以在安装期间或安装后将操作系统设置为德语。测试所有应用程序（如
    Office）是否能够正常启动。您可以使用 `Firefox` 访问互联网吗？如果您的电脑连接了网络，一切都应该正常工作。由于 Mint 目前从优 盘运行，一切速度都有点慢。但在安装后会显著提高。


    ![](img/image_rsrc1H4.jpg)


    我假设所有测试都已通过，`LibreOffice` 已启动，等等。


    现在点击左上角的“Install Linux Mint”图标。安装程序将启动。选择您所需的语言。我选择了德语。点击继续：


    ![](img/image_rsrc1H5.jpg)


    选择您所需的键盘布局。我选择了德语（左窗）和德语（右窗）。点击继续：


    ![](img/image_rsrc1H6.jpg)


    勾选“安装多媒体解码器”并点击继续：


    ![](img/image_rsrc1H7.jpg)


    选择安装类型。我选择了“擦除磁盘并安装 Linux Mint”，因为我想切换并且备份了所有数据。如果您也是如此，或者您为 Linux Mint 有单独硬盘，请在此选择并选择“擦除磁盘...”。点击继续：


    ![](img/image_rsrc1H8.jpg)


    将弹出一个窗口，您应该阅读。它告诉您所选更改将写入磁盘。如果您同意，点击继续：


    ![](img/image_rsrc1H9.jpg)


    在“在哪里？”选择您的位置：


    ![](img/image_rsrc1HA.jpg)


    填写“你是谁？”表。输入您的姓名并为电脑命名（例如 Linux-Mint-PC）。选择您的用户名和安全的密码。我建议保持“需要密码登录”。


    如果您愿意，可以“加密我的个人文件夹”。但我建议稍后启用。然后点击继续：


    ![](img/image_rsrc1HB.jpg)


    现在安装正在进行，您可以查看幻灯片。在这里您将获得有关 Linux Mint 能为您提供的信息：


    ![](img/image_rsrc1HC.jpg)


    安装完成后，Linux Mint 将报告成功并建议您重启。点击“现在重启”，然后按照屏幕上的指示移除安装介质并按回车：


    ![](img/image_rsrc1HD.jpg)


    在移除优盘并按回车后，系统将重启并显示登录界面。输入您刚刚设置的密码并按回车：


    ![](img/image_rsrc1HE.jpg)


    Linux Mint 现在将启动并很快显示欢迎界面：


    ![](img/image_rsrc1HF.jpg)


    仔细阅读欢迎框；它提供了关于您应该先做什么的详细信息，并给出了初步介绍。


