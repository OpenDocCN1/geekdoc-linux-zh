    特别重要：如果你想卸载文件系统以进行检查或修复，你必须确保没有关键进程在上面运行。想象一下，如果你正在卸载一个运行着数据库服务器（如 `MySQL`）的分区。砰，一切都崩溃了，你突然会困惑于为什么你的整个系统变得无法工作了。你需要确保在进行任何操作之前，要么妥善地关闭受影响的服务，要么将文件系统重新挂载为只读模式。


    `umount` 命令是此操作的一个很好的例子。你用它来安全地从系统中移除分区，以便对其进行检查或修复。但请务必：如果你不小心卸载了运行关键系统服务或程序的主驱动器，可能会导致严重的后果。这就是为什么你应该始终双重检查正在操作的是哪个分区，并确保没有活跃的应用程序正在访问它。


    如果你想检查或修复文件系统，`fsck` 命令可以提供帮助。该命令用于检查并修复不一致的文件系统。但同样，需要谨慎。仅在未挂载或只读模式挂载的文件系统上运行此命令。千万不要在正在运行且可写的文件系统上操作。想象一下在处理过程中向硬盘写入某些内容——混乱将不可避免。一个例子是
    `sudo fsck /dev/sda1`，它确保对分区 `/dev/sda1` 进行错误检查。


    另一个重要的工具是 `badblocks`。此命令检查你的硬盘是否存在缺陷块——即无法再正常写入或读取的区域。这是早期检测硬件问题的良好测试。但同样，要小心。如果你有一个大硬盘，此命令可能会运行很长时间。所以不要在正在积极使用的磁盘上使用它，因为它可能导致数据丢失。


    那么 S.M.A.R.T. 呢？这种内置的自检（可以通过 `smartctl` 命令启动）帮助你监控硬盘的健康状况。同样，这种测试比其他测试更安全，但如果你的驱动器已经有了坏块，过度使用可能会恶化状况。请始终准备好备份，并在出现问题时计划更换硬盘。


    `tune2fs` 工具对于自动化文件系统维护也很有用。通过它，你可以指定系统启动多少次后自动检查文件系统。但同样，小心不要设置可能在运行时引起问题的设置。


    对于像 `XFS` 等特殊文件系统，有 `xfs_repair` 命令。`XFS` 是一种专门为大数据量和高性能设计的文件系统。只有在你确定 `XFS` 文件系统损坏时才使用此命令，并且不要忘记：先备份，后检查。


    最后但同样重要：对于 `Btrfs` 文件系统，有 `btrfs check` 命令。`Btrfs` 是一种现代文件系统，提供了快照和压缩等许多酷功能。同样，适用相同的规则：仅对未使用的文件系统执行检查，并在修复期间要非常小心——一步错就很容易导致数据丢失。


    记住：尽管 shell 非常强大，但如果你不小心，它也可能同样危险。始终要深思熟虑地工作，只执行你绝对确定的命令。双检查某事比输错命令并毁掉系统要好。


    即使你输入了一个命令没有立即毁掉系统，你的电脑也可能在一段时间内无法使用。某些命令（特别是访问硬盘或文件系统的命令）可能会消耗大量资源，导致 PC 或服务器被完全占用。鼠标可能会开始卡顿，程序可能会停止响应，在最的情况下，整台电脑似乎死机了。这发生发生并不是因为你弄坏了什么，而是因为你执行的命令正在要求硬件的全部关注。


    以 `dd` 命令为例，它经常用于将数据从一个地方复制到另一个地方——无论是整个驱动器还是分区。此命令处理原始数据，并倾向于完全占用硬盘。所以，如果你正在运行一个
    `dd` 命令（例如将大文件从一个驱动器复制到另一个驱动器），该硬盘可能会被过度使用，导致其他程序都无法运行。系统并没有坏，但只要操作运行，它就处于瘫痪状态。


    `fsck` 或 `badblocks` 等命令也是如此。取决于硬盘的大小和要检查的数据量，这些命令可能会运行数小时。如果你在正在使用的系统上运行这些命令，它会让计算机几乎无法使用，因为硬盘被检查任务完全占用了。


    这里的关键在于：Linux 极其强大且灵活，但这种力量必须谨慎使用。许多命令看起来是无害的，但如果使用不当，可能会产生重大影响。我不可能列出所有存在的 Linux
    命令——那样的书将有数千页，你可能读到一半就放弃了。但建立一种基本的理解是重要的，即使是最看似微不足道的命令，当它访问文件系统或你的计算机资源时，也应该仔细考虑。


    因为记住：你输入的每一个命令都像一个工具。在正确的人手中，它可以带来极佳的改进；但在错误或粗心的人手中，它可以瘫痪甚至在最坏的情况下摧毁你的系统。所以要始终保持谨慎，特别在使用
    root 权限时。这可能让你感到强大，但也像双刃剑——你拥有完全的控制权，但也拥有完全的责任。


    ### 28.5 系统信息与管理


    `df` (Disk Free)：此命令显示硬盘上的可用和用空间。使用 `df -h` 获取易读的输出。


    `du` (Disk Usage)：通过此命令，你可以显示文件和目录的大小。例如，`du -sh /home/username` 显示用户目录的总大小。


    `top`：此命令提供系统资源使用的实时视图。


    ### 28.6 软件管理


    `apt-get`：此命令用于安装、删除或更新软件包。例如，`sudo apt-get update` 更新软件包列表，`sudo apt-get install
    package_name` 安装新软件包。如果你以 `sudo su` 身份登录，可以省略命令前的 `sudo`。


    `dpkg`：通过此命令，你可以直接管理 Debian 软件包。例如，`sudo dpkg -i package.deb` 安装 `.deb` 包。


    ### 28.7 用户管理


    `adduser`：此命令向系统添加新用户。例如，`sudo adduser newUser` 创建新用户账户。


    `usermod`：通过此命令，你可以修改现有用户的属性。例如，`sudo usermod -aG sudo username` 将用户加入 `sudo`
    组，赋予该用户 root 权限。


    ### 28.8 系统监控与控制


    `reboot`：此命令重启系统。通常在需要重启的更改后。


    `shutdown`：通过此命令，你可以关闭系统。例如，`sudo shutdown -h now` 立即关机。


    ### 28.9 自 Shell 命令


    在这里，你可以记录你个人需要并认为特别重要的 shell 命令。我特意留了六页纸，提供了充足的空间。对于刚开始接触 Linux 世界的人来说，这些空间足够记录关键命令和个人笔记了。


