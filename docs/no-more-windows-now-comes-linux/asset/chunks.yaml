- fmt: '

    So, let’s get to the good stuff! Surely, you want to see what software Linux Mint
    has to offer, right? I mean, you didn’t switch to Linux Mint just to end up with
    a blank desktop. No, Linux Mint comes with a solid set of tools right from the
    start, and I can tell you: There are some real gems included!


    ## 1. The Office Suite

    First of all, the office suite. Linux Mint comes with `LibreOffice` right after
    installation – a complete office package that can compete with `Microsoft Office`
    in many respects and is free of charge. Whether you need to write text documents,
    create spreadsheets, or prepare presentations – `LibreOffice` covers all these
    areas. And the best part: It is also compatible with `Microsoft Office`. You can
    easily continue using or sharing your existing `Word`, `Excel`, or `PowerPoint`
    files with colleagues who still use `Microsoft Office`. It’s a full-featured alternative,
    and I dare say you won’t miss a thing.


    ## 2. Image Editing and Multimedia

    ### Image Editing with GIMP

    But that’s far from all. What would a modern operating system be without image
    editing programs? Linux Mint has a solution here as well. With programs like `GIMP`
    (GNU Image Manipulation Program), you have a powerful tool at your disposal that
    can rival the expensive alternatives on the market. Whether you want to make simple
    photo corrections or create complex graphics – `GIMP` is a versatile tool offering
    countless features for every need. And all without worrying about costly licenses.
    Just think about how much you have to pay for `Photoshop`! `GIMP` can do almost
    everything `Photoshop` can. It takes a bit of getting used to, but it’s free.
    That’s a small price to pay.


    ### Video and Music

    Your multimedia needs are also covered. Linux Mint comes with everything you need
    to play your favorite videos or music tracks. The `VLC Media Player` is a fantastic
    tool that plays almost any format you throw at it. Whether it’s an old `AVI` file
    you’ve had on your hard drive for years or the latest HD video – `VLC` handles
    it all. Additionally, there’s the `Rhythmbox` music player, which manages and
    plays your music collection as if it were the most natural thing in the world.
    `Rhythmbox` is pre-installed, but I’ll show you an alternative later that I think
    is better. Also free.


    ### Video Editing

    And for those who want more than just listening to music or watching movies, Linux
    Mint also includes programs for video editing. Tools like `Kdenlive` make it easy
    to cut your own videos, add effects, or create clips. You don’t have to be a pro
    to achieve great results. Linux Mint offers you a range of options to express
    your creativity. However, there are some specific details to consider in video
    editing. More on that later.


    ## 3. Communication and Internet

    ### Email and Web

    Of course, there are also programs for everyday communication. The `Thunderbird`
    email client is pre-installed and helps you keep track of your emails. Whether
    you only have a personal email account or juggle multiple mailboxes for work –
    `Thunderbird` handles it all effortlessly. It supports all common email protocols
    and is also straightforward and easy to use.


    And if you want to browse the internet, `Firefox` is your faithful companion.
    This browser is also pre-installed and offers an excellent combination of speed,
    security, and customizability. For everyday use, it’s more than sufficient, but
    of course, you can also install another browser like `Chrome` or `Opera` at any
    time – the choice is yours.


    ## 4. The Software Manager

    In summary: Linux Mint is not an empty operating system that you need to fill
    with software. Quite the opposite! It already comes with a well-thought-out basic
    setup that is more than enough for most everyday tasks. You can start right away
    without having to spend a lot of time on installations and configurations. And
    if you ever need specific software, the `Software Manager`, Linux Mint’s application
    management tool, is your next stop. There, you’ll find a vast selection of additional
    programs that you can install with just a few clicks.


    Whether you want to work, be creative, or simply relax – Linux Mint offers everything
    you need right after installation.


    Open the Application Manager either through the Start menu or the Welcome dialog:


    ![](image_rsrc1J5.jpg)


    You see here the wonderfully organized Application Management of Linux Mint. No
    ads, no annoying payment options – isn’t that just great? Everything is nicely
    sorted and clear, just as you would wish. There are no hidden costs, no enticing
    offers that suddenly ask for payment after installation. Here, you can focus entirely
    on what really matters: the software.


    The Application Management, also known as the `Software Manager`, is the central
    hub for all your software needs. From here, you have access to a huge selection
    of programs that you can install easily and straightforwardly. Everything is divided
    into clear categories so that you can navigate effortlessly and quickly find what
    you’re looking for. There are no confusing menu structures or bewildering options
    – the application is designed so that even beginners can handle it right away.


    The categories are sensibly arranged and cover all areas that you need for everyday
    computer use. In the “Internet” category, for example, you will find browsers
    like `Firefox` and `Chrome`, as well as email programs like `Thunderbird` or messaging
    tools like `Telegram`. In the “Office Programs” category, there are programs like
    `LibreOffice`, with which you can create your text documents, spreadsheets, or
    presentations. Everything you need to be productive is just a click away.


    If you are interested in multimedia, you can browse the “Video and Sound” category.
    Here you will find the `VLC Media Player` for videos or other music players for
    your music collection. But also programs for image editing, like `GIMP`, or tools
    for video editing, like `Kdenlive`, are represented here.


    The “Graphics and Image Editing” category offers you a selection of drawing and
    graphics programs suitable for both simple tasks and professional projects. For
    developers, there is the “Programming” category, where you can find development
    environments, text editors, and other programming tools.


    In the “Games” section, you can expect numerous titles, from simple casual games
    to more complex games optimized for Linux. If you want to improve your system
    administration, you will find useful programs in the “System Tools” category to
    optimally adjust and manage your Linux Mint system.


    All in all, the Application Management of Linux Mint is a real gem: tidy, efficient,
    and without annoying ads or payment options. You can browse peacefully, select
    the programs that suit you, and start right away. And the best part: everything
    is free and installed on your system with just a few clicks. Another reason why
    Linux Mint is so pleasant to use.

