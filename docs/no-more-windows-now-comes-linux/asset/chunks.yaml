    与此同时，365 服务、Outlook、Teams 等在德国、英国、西班牙、美国和印度全部瘫痪。其影响范围尚无法量化。银行、医院、公司、个人和机场——一切都“宕机”了。我经常在
    Facebook、Instagram 和 LinkedIn 上发布过，这一天终会到来。每当我与 `Telekom`、`WhatsApp-Sim` 或 `Freenet-TV`
    等技术支持人员交流时，我总是说那句话：“人类正在失去对技术的控制！”


    ## 4. 我想要公开我的数据吗？


    考虑到 `Windows`，或者说 `Windows` 背后的 `Microsoft` 公司所带来的所有负面影响，每个人都应该问自己：»我想要吗？«


    我现在将提出许多 »我想要……«的问题，仅仅是为了向你展示你真正应该问自己的问题。


    我想将所有数据都托付给 `Microsoft` 吗？我想让 `Microsoft` 决定我可以使用哪些程序或应用程序吗？我想让 `Microsoft` 在不询问我的情况下对我的
    `PC` 或笔记本电脑进行软件更改吗？我想在 `Start` 菜单中看到广告吗？我想在文件夹和设置中看到广告吗？我想被 `Microsoft` 俯教吗？


    我想让 `Microsoft` 在我的 `PC` 上安装 `AI` 系统吗？我想让这些 `AI` 系统全天候拍摄我的屏幕吗？我想让 `Microsoft`
    为我提供一个旨在将我的数据移动到云端的备份系统吗？我想让我的文件、照片和视频传输到云端，并可能被 `Microsoft` 以及可能的第三方读取、筛选并用于训练
    `AI` 系统吗？我想继续接受那些存在存在问题且测试不足的更新所带来的风险吗？


    我想把我的电子邮件流量、文档和文件放在一个存在故障风险的云端吗？我想让 `Microsoft` 继续工作将我的整个 `PC` 迁移到云端吗？我想放弃所有的数据吗？


    此外还有几个你应该问自己的问题：我能否接受无法访问自己的数据，因为……


    ... 网络再次无法工作了？

    ... `Microsoft` 云端再次崩溃了？

    ... 网络就是太慢了？

    ... `Microsoft` 不喜欢我数据的某些之处？

    ... `Microsoft` 再次被黑客攻击了？

    ... 我的 `Microsoft` 账户被盗取了？


    我想继续为软件付费并为使用 `Microsoft` 的服务付费吗？


    如果你对所有这些问题的回答都是»是«，那么就继续使用 `Windows` 吧。然而，如果你有顾虑，并觉得将所有数据迁移到云端并不理想，且乐意将数据托付给 `Microsoft`
    等人，那么让我们探索一下目前有哪些选择。


    由于 `Windows` 以收集越来越多的用户信息、建立强制账户并日益将其系统迁移到云端而闻名，问题是：你真的想要那样吗？你想要所有的个人数据都存储在互联网上的某个服务器上，而这些服务器是
    `Microsoft` 以及可能的第三方（如黑客）可以访问的吗？这种发展不仅引发了伦理问题，还引发了安全关注，值得仔细审查。


    我们今天所生活的数字世界的特点是持续的连接以及将越来越多数据移动到云端的驱动力。这种中心化的存储初看可能很方便——你可以从任何地方访问文件，你的设置是同步的，你的软件始终是最新版本。但所有这些优势的代价都是昂贵的：对自己数据的控制权。每一次点击，每一次使用云服务，你都放弃了一部分控制权，并将其交给一个业务模式并不一定符合你利益的公司。


    更令人担忧的是系统和数据向云端的转移。你的个人数据——无论是文档、照片、电子邮件，甚至是你的整个计算机环境——都存储在你无法看到或控制的服务器上。这些服务器通常位于遍全球的数据中心，并受相应国家法律的约束。在许多情况下，这意味着你的数据受到其他国家法律法规和执法权的限制，这可能导致隐私丢失和风险增加。


    另一个问题是安全。存储大量数据的服务器是黑客极具吸引的目标。尽管像 `Microsoft` 这样的公司投入了大量资源来确保系统安全，但无法保证云端的数据是安全的。数据泄露、勒索软件攻击和其他网络威胁无处不在，即使是最大、最安全的公司也无法免疫。如果攻击成功，你的数据可能会被盗取、删除或滥用——对你的个人和职业安全可能会产生毁灭性的后果。


    此外，你应该考虑数据存储在云端后会发生什么。关于你的数据如何被使用并没有完全透明。大多数用户假设他们的数据只是被存储，但有迹象表明某些公司还将这些数据用于其他用途。一个特别争议的问题是使用数据训练人工智能
    (`AI`)。`AI` 系统需要大量数据来学习和改进，而你上传到云端的数据理论上可以用于训练此类系统。虽然这可能会改进服务，但它引发了关于隐私和对个人信息控制权的严重问题。


    所有这些发展都指向一个核心问题：你真的想要这些吗？你真的想要像 `Microsoft`——或任何其他公司——对你的个人和数字生活有如此深入的洞察吗？你真的想要让你的数据存储在你无法直接访问且无法亲自监控其安全性的服务器上吗？将数据存储在云端的相关风险是巨大的，在选择这种路径之前，理解这些风险至关重要。


    继续使用 `Windows` 并接受所有这些顾虑，还是选择 `Linux` 这样的替代方案，取决于你。然而，这是一个应该深思熟虑的决定。`Linux` 为你提供了重新获得数据和数字环境控制权的机会。它给了你保护隐私的自由，并让你按照自己想要配置系统——而无需承受不断披露个人信息的压力。在一个日益被少数大公司主导的世界里，这种自由是无价的。


    既然你已经购买了这本书，我假设决定已经做出了。然而，你可能还没有确切知道如何完成一次干净的过渡。在本书中，我为你提供从 `Windows` 到 `Linux
    Mint` 的直接过渡。为什么？我将在下一章回答。


    ## 5. 网络问题


    在德国，人们经常近距离体验网络基础设施的缺陷。无论是速度慢、连接不稳定，甚至是大规模的停机，网络问题都是持续的困扰。在宽带扩张中落后的地区经常与极其糟糕的连接作斗。但即使在理论上覆盖范围更好的城市地区，也经常存在弱点。当你考虑到洪水、风暴或大雪等自然灾害可能会完全瘫痪网络时，这些问题会变得更加严重。此类事件不仅仅是暂时的中断；它们可能导致数天甚至数周无法上网。德国各地区的近期洪水显示了基础设施崩溃得有多快。

