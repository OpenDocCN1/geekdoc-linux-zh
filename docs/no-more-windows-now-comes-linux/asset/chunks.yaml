    那么，让我们进入正题吧！你肯定想看看 Linux Mint 提供了哪些软件，对吧？我的意思是，你切换到 Linux Mint 应该是为了最后只面对一个空白的桌面吧。不，Linux
    Mint 从一开始就带了一了一套非常实用的工具，我可以告诉你：其中包含了一些真正的“宝藏”！


    ## 1. 办公套件

    首先是办公套件。Linux Mint 在安装后就预装了 `LibreOffice` —— 这是一个完整的办公软件包，在许多方面都可以与 `Microsoft
    Office` 能够媲美，而且是免费的。无论你需要编写文本文档、创建电子表格还是准备演示文稿，`LibreOffice` 都能涵盖这些领域。最棒的部分是：它还兼容
    `Microsoft Office`。你可以轻松地继续使用或与在使用 `Microsoft Office` 的同事共享现有的 `Word`、`Excel`
    或 `PowerPoint` 文件。它是一个功能齐全的替代方案，我敢说你不会错过任何功能。


    ## 2. 图像编辑与多媒体

    ### 使用 GIMP 进行图像编辑

    但这远非全部。一个现代操作系统如果没有图像编辑程序，算什么呢？Linux Mint 在这方面也有解决方案。通过 `GIMP`（GNU 图像处理程序）等程序，你拥有了一个强大的工具，可以与市场上昂贵的替代品竞争。无论你想进行简单的照片修正，还是创建复杂的图形，`GIMP`
    都是一个多功能的工具，能为每种需求提供无数特性。而且完全不需要担心昂贵的许可证。想想你为 `Photoshop` 要付多少钱吧！`GIMP` 几乎可以做 `Photoshop`
    能做的一切。这需要一点时间适应，但它是免费的。这是一个很小的代价。


    ### 视频与音乐

    你的多媒体需求也得到了满足。Linux Mint 提供了播放你喜爱的视频或音乐所需的所有工具。`VLC Media Player` 是一个极好的工具，可以播放你交给它的几乎任何格式。无论是你在硬盘上存放了多年的旧
    `AVI` 文件，还是最新的高清 视频，`VLC` 都能处理。此外，还有 `Rhythmbox` 音乐播放器，它可以像世界上最自然的事情管理并播放你的音乐收藏。`Rhythmbox`
    是预装的，但稍后我会向你展示我认为更好的替代方案。同样是免费的。


    ### 视频编辑

    对于那些不仅想听音乐或看电影的人，Linux Mint 也还包含了视频编辑程序。像 `Kdenlive` 这样的工具让你轻松地剪辑自己的视频、添加特效或创建片段。你不需要成为专业人士就能获得很的结果。Linux
    Mint 为你提供了系列选项来表达你的创意。然而，视频编辑中有些特定的细节需要考虑。稍后会详细介绍。


    ## 3. 通信与互联网

    ### 电子邮件与网页

    当然，还有用于日常通信的程序。`Thunderbird` 电子邮件客户端预预装，可以帮你跟踪邮件。无论你只有一个个人邮箱账户，还是为了工作处理多个邮箱箱，`Thunderbird`
    都能轻松地处理一切。它支持所有常见的电子邮件协议，而且直观易用。


    如果你想浏览互联网，`Firefox` 是你忠实的伴侣。这个浏览器也是预装的，提供了速度、安全和可定制性的卓越结合。对于日常使用，它绰绰有余，但当然你也可以随时安装其他浏览器，如
    `Chrome` 或 `Opera` —— 选择权在于你。


    ## 4. 软件管理器

    总结一下：Linux Mint 不是一个需要你用软件填充的空操作系统。恰恰相反！它已经带有了经过深思熟虑的基础设置，对于大多数日常任务绰有余。你可以立即开始，无需花费大量时间在安装和配置上。如果你以后需要特定的软件，Linux
    Mint 的应用程序管理工具 `Software Manager` 就是你的下一个停站。在那里，你会发现大量的额外程序可选，只需点击几次即可安装。


    无论你想工作、创作还是简单地放松，Linux Mint 在安装后就为你提供了你所需的一切。


    通过启动菜单或欢迎对话框打开应用程序管理器：


    ![](img/image_rsrc1J5.jpg)


    你在这里可以看到 Linux Mint 组织得井有序的应用程序管理。没有广告，没有烦人的付费选项 —— 这不很棒吗？一切都分类得整齐且清晰，正如你所希望的那样。没有隐藏成本，没有在安装后突然要求付款的诱人提议。在这里，你可以完全专注于真正重要的事情：软件。


    应用程序管理，也称为 `Software Manager`，是你所有软件需求的中心枢纽。从这里，你可以访问大量的程序选择，并轻松直接地安装它们。所有内容都划分为清晰的类别，以便你轻松导航并快速找到你正在寻找的内容。没有令人困惑的菜单结构或不知无措的选项
    —— 该应用程序的设计即使是初学者也能立即上手。


    类别安排合理，涵盖了日常电脑使用所需的所有领域。例如，在“互联网”类别中，你会找到像 `Firefox` 和 `Chrome` 这样的浏览器，以及像 `Thunderbird`
    这样的电子邮件程序或像 `Telegram` 这样的消息工具。在“办公软件”类别中，有像 `LibreOffice` 这样的程序，通过你可以创建文本文档、电子表格或演示文稿。你需要的一切只需点击。


    如果你对多媒体感兴趣，可以浏览“视频和音频”类别。在这里你会找到用于视频的 `VLC Media Player` 或用于音乐收藏的其他音乐播放器。但这里也代表了图像编辑的程序（如
    `GIMP`）或视频编辑工具（如 `Kdenlive`）。


    “图形和图像编辑”类别为你提供了一系列绘图和图形程序，适用于简单任务和专业项目。对于开发者，有“编程”类别，你可以在那里找到开发环境、文本编辑器和其他编程工具。


    在“游戏”部分，你可以期待许多作品，从简单的休闲游戏到针对 Linux 优化的更复杂的游戏。如果你想提高你的系统管理能力，将在“系统工具”类别中找到实用的程序，以优化调整和管理你的
    Linux Mint 系统。


    总之，Linux Mint 的应用程序管理是一个真正的宝藏：整洁、高效，且没有烦人的广告或付费选项。你可以安静地浏览，选择适合你的程序并立即开始。最棒的部分是：一切都是免费的，并且只需点击几次即可安装到你的系统中。这是
    Linux Mint 如此好用的另一个原因。


