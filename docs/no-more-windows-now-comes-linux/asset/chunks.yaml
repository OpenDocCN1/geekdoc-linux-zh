    你的敏感信息——无论是个人文档、财务数据还是业务关键信息——都存储在云端，而你并不完全清楚谁可以访问它们或它们存储在何处，这应该引发你进行批判性思考。云服务提供的便利和易用性不应掩盖它们所带来的巨大安全和控制风险。当你发现自己处于提供商破产、被黑客攻击或迁移到法律不同的国家的情况下时，这些风险会变得更加严重。


    因此，如果你怀疑将数据存储在云端是否真的安全，你还应该考虑你对这些数据的实际控制权其实有多小。这种不安全模型的替代方案是重新获得对自己数据的控制权——例如使用如
    `Linux` 这样的本地操作系统，让数据保留在你自己的硬件上。在这里，你对谁可以在何时以及何如何访问你的数据拥有完全的控制权，而且不受不稳定或不安全的云提供商的不确定性的影响。


    在这个数据变得日益昂贵的世界，你应该仔细考虑将你的数字宝藏托给谁。失去对自身数据的控制权可能会产生深远的影响，远不止丢失钱包那么简单。它涉及到安全性、机密性，最终涉及到你信息的主权。通过在本地存储数据并依赖那些赋予你控制权的解决方案，你可以确保在这个日益连接的世界里睡得安稳——知道你的数字资产是安全且受保护的。


    应该对全球最大的云提供商进行特别的关注：`Google`、`Amazon`、`Facebook` 和 `Microsoft`。这些科技巨头总部位于美国，与欧盟相比，该国的数据保护法律要宽松得多。这并不是一个微不足道的区别，而是一个可能对你的个人和业务数据处理方式产生巨大影响的因素。这些公司在利用你的数据方面几乎不受限制，这一事实往往被低估——然而，这正是每天都在发生的事情。


    这些美国公司运营的法律环境，该环境允许它们在使用、分析和利用用户数据方面拥有广泛的自由。虽然欧盟的《通用数据保护条例》（`GDPR`）等数据保护法试图保护公民的隐私，但美国的法规要松散得多。这允许大型科技公司按照自己的意愿收集和处理数据。而他们充分利用了这一点。


    尽管有这些松散的数据保护做法，`Google`、`Amazon`、`Facebook` 和 `Microsoft` 仍然受到全球数百万甚至数十亿人的信任。这些公司成功地将自己定位为不可或缺的服务提供者——无论是通过搜索引擎、社交网络、电子商务平台还是云端软件解决方案。许多人每天使用它们的服务，往往没有完全意识到这些公司对他们的个人和职业数据侵入得有多深。他们提供看似免费或廉价的服务，但用户支付的真实代价是失去了对数据的控制权。


    一个特别棘手的问题是这些公司进行的大量数据分析。他们所拥有的能力比欧盟任何经验丰富的技术专家所梦以求的先进得多。上传到云端的每一封邮件、每一份文档、每一张图像都会经过过滤、分析和分类。这种分析不仅是为了改进服务或显示个性化广告，还为了创建全面的用户画像，这些画像可以被用于各种目的——从市场研究到政治影响。


    问题在于，这些过程在欧盟内部既无法透明地追溯，也无法从内部被有效防止。虽然 `GDPR` 试图监管和控制流向美国的数据流，但事实表明，一旦数据离开欧洲边界，用户想要确切知道其数据发生了什么几乎是不可能的。此外，这些公司的条款和隐私政策通常达数百页，且使用的语言即使对专家来说也难以理解。这些文档的设计极其复杂且全面，以至于大多数用户在不阅读的情况下直接接受了。通过这种方式，他们同意了自己连皮毛都不了解的做法。


    许多个人和企业后悔将所有数据迁移到云端只是时间问题。一旦他们放弃了对数据的控制权，就将受于这些大公司决策和做法的影响。如果法律框架发生变化或这些公司决定改变其业务模式，用户可能会发现他们的数据被以他们从未意过的方式使用。


    这一日的到来可能由多种因素触发：重大的数据滥用丑闻、服务条款的突然更改、被另一家对数据保护关注更少的公司收购，甚至是一个限制或控制访问这些数据的政治事件。在数据即新石油的世界里，将这一宝贵资产托给一个在法律未能充分保护这些数据的国家运营的公司是有风险的。


    因此，问题在于，信任这些很大程度上运营在欧盟影响及其严格数据保护法之外的公司是否真的是明智之举。你会把把钱包随手丢在到处并相信没人会碰它吗？可能不会。然而，许多人在将数据托付给这些云服务而却不知道确切谁可以访问、何时以及如何访问时，正是他们所做的。


    因此，了解风险并考虑替代解决方案是非常关重要的。允许你控制自己数据的操作系统和业务（如 `Linux`）提供了一种真正的替代方案。它们为你提供了在本地存储数据并按照你自己的条款保护它的机会，而不必依赖大型科技公司那些晦涩且往往不透明的做法。


    数字世界正变得日益复杂，追踪谁对我们的数据做了什么变得越来越困难。但有一点是明确的：保持对我们自身数据的控制对于我们的数字主权和隐私至关重要。是时候认真对待这一方面，并意识到当我们把数据交给这些大公司时我们正在放弃什么了。因为我们为此付出的代价可能比我们想象的要高得多。


    # 7 云的能耗


    虽然你的电脑、笔记本电脑甚至服务器只消耗几百瓦，如果是较大的服务器则消耗几千瓦，但很难想象云服务消耗了多少能量。你认为仅上传 1 GB 数据到云端需要多少能量吗？请看：


    云服务的能耗是巨大的，而且往往被低估。仅仅向云端上传 1 GB 数据就需要大量的能量。这不仅由于传输本身，还由于运行这些云服务的巨大数据中心中的存储和许多相关过程。这些数据中心由数千台全天运行的服务器组成，需要冷却并需要稳定的电力供应。这些大型服务器场不仅消耗大量的能量，对碳排放也有很大贡献。


    数据中心，特别是由 `Google`、`Amazon` 和 `Microsoft` 等主要提供商运营的数据中心，需要巨大的基础设施来处理每天流过互联网的数据。这些中心通常有几个足球场大，在许多情况下，其耗电量超过了整个城市。服务器本身产生的热量需要通过强大的冷却系统散热，而这些系统又会消耗更多的能量。


