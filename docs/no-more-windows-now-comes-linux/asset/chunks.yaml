  trans: "\n\n![](img/image_rsrc1GW.jpg)\n\n# 别再用 Windows！\n\nRalf-Peter Kleinert\n\
    \n## 这本书：\n\n我的第一次电脑体验是使用 `MSDOS` 和 `Commodore C64` 运行 `BASIC`。随后，我在德意志联邦共和国见证了\
    \ `Windows` 的诞生，我的第一台 `Windows` 是 `Windows 3.1`，它仍然基于 `DOS`。`Windows 95` 同样是一个基于\
    \ `DOS` 的系统。\n\n多年来，我执行了从 `Windows 3.1` 到 `Windows 11` 的无数次安装——通常是因为我在对底层进行捣鼓时导致了操作系统崩溃。直到今天，这是一段奇妙的旅程。但现在，`Windows`\
    \ 和电脑不再仅仅是极客们使用的技术设备。计算机 已经成长为塑造世界进程的系统。\n\n食品生产、医疗保健、技术进步甚至战争——没有了计算机，我们的社会将无法生存。但这本书将仅简要触及这些话题。首先，我想向个人展示即使在今天也能尽可能保持数据私密的方法。而在将数据掌握在自己手中方面，`Windows`\
    \ 变得越来越不再合适。\n\n我想向你们介绍一种 `Windows` 的替代方案，它具有巨大的优势。为了简单起以及从 `Windows` 到 `Linux`\
    \ 的平滑过渡，我选择了非常流行且广泛使用的、基于高度稳定的 `Debian` 的 `Linux Mint`。它的优势显而易见：这个开源系统是由社区开发的，而不是一家以利润为导向的公司。没有社区可能忽略的隐藏代码部分。你对数据拥有完全控制权，没有强制性账户，极其稳定性，并且每个\
    \ `Windows` 软件都有替代方案。最好的部分：一切都是免费的！\n\n今天，我们没有人知道这段旅程最终将通向何方，无论是使用 `Windows` 还是\
    \ `Linux`。然而，在 2024 年，涉及到数据隐私、成本平衡和数据主权，没有比 `Linux` 更好的选择了。简单来说，如果你希望你的数据在 2024\
    \ 年仍然属于自己，`Linux` 是唯一选择。未来会发生什么？让我们拭目以待——这将是非常有趣的！\n\n## 作者：\n\n![](img/image_rsrc1GX.jpg)\n\
    \nRalf-Peter Kleinert，1981 年 1 月出生于柏林附近的海尼格斯多夫，一个真正的东德公民。自从 `Commodore C64` 出世以来，我就学习了我能接触到的所有计算机知识。\n\
    \n它的美好之处在于，我见证了整个发展过程——从缓慢笨拙的机器到今天放在我办公桌下的性能怪兽。例如，智能手机的性能就超过了那时所有的计算机。我对计算机的了解和学习的动力使我越钻越深入这个领域。\n\
    \n现在，我在网站上分享我的部分知识并撰写这本书。程序改进了，互联网诞生了。今天，我主要作为一个社交媒体经理工作。作为自 `Windows 95` 来的 IT\
    \ 和计算机专家，我可以回顾多年充满“计算机问题”的岁月。我相信，正是因为计算机引起的问题，专家们才得以成长。\n\n当社交网络在 `Web 2.0` 开启时，所有的学习突然有了更深层的意义。独自坐在房间里已成为过去。突然，计算机联网了，与人们的交流开始了，而不仅仅是处理一堆软盘。我几乎不知道以前是否有许多志同道合的人。起初，只有极客在网上见面，他们有时会被嘲笑或嘲弄。今天，联网已成常态，因为几乎每个人都在线。\n\
    \n从 2010 年至 2012 年，我在 `Silicon Studio Berlin` 完成了理想的媒体设计师培训。在这里，我能够巩固并扩展我的知识。由于我也有摄影经验的经验，我还额外在“One\
    \ I A Fotostudio”完成了一份实习。摄影是社交媒体管理的一个重要方面，并深化了我在这一领域的技能。\n\n### 我的证书包括：\n\n- IT\
    \ 安全 - 针对中小企业和初创企业的保护\n- 网络技术、网络安全与 `Wireshark`\n- 网络安全 - 防御黑客攻击\n- 使用 `Fail2Ban`\
    \ 的 `Linux Firewall` 防御破解攻击\n- 完整 SQL 大师课程\n- `Linux Administration` 与系统管理\n-\
    \ 在 `Linux Ubuntu` 上安装、设置和使用 `Nextcloud`\n- `Microsoft Azure Administrator`\n\
    - `Microsoft 365 安全管理员`\n- `Microsoft 365 身份与服务`\n- 工业网络安全 2024\n- 使用 `Kali Linux`\
    \ 进行伦理黑客攻击\n- `Microsoft Active Directory Windows Server 2022`\n\n### 额外培训：\n\n\
    - 计算机网络 (`CompTIA Network+`)\n- 计算机安全 (`CompTIA Security+`)\n\n# 别再用 Windows！\n\
