    There’s also no guarantee that the feature will always work in practice. What
    if the thief simply disconnects the laptop from the network or stores it in an
    area without internet access? Then the » `Find My Device` feature can do nothing.
    It seems to me more like a cosmetic feature that Microsoft markets as a cool addition
    without truly considering the practical aspects. At the end of the day, it’s probably
    more of a facade than real protection.


    What does Microsoft actually want to achieve? Do they seriously believe you’ll
    find your laptop with their feature? Not at all! What they really want is for
    you to go to the nearest store, buy a new laptop – of course, with `Windows` again
    – and then recover your data from `OneDrive`. That way, they have a good reason
    to push their cloud services.


    The reality is that the `Find My Device` feature is often just hot air. What’s
    the point if the laptop is stolen? It won’t be long before the thief disconnects
    it from the network and either transfers the data to another hard drive or simply
    sells the laptop as is. The feature is, at best, a placeholder to give customers
    the illusion of protection.


    Microsoft knows full well that in the case of a real theft, the laptop is often
    beyond saving. So, the customer has no choice but to buy a new laptop and recover
    the data from `OneDrive` – if it was backed up there. Otherwise, all that’s left
    is the bitter realization that the `Find My Device` feature is ultimately nothing
    more than a smoke and mirrors act. The real message is: if the laptop is gone,
    it’s gone.


    ## 12.8 Viewing the Collected Data


    If you want a detailed report on the data collected by `Windows 11`, there is
    actually a built-in tool for that. Simply go to `Settings > Privacy and Security
    > Diagnostics and Feedback` and turn on the option to view diagnostic data. This
    will enable the feature that allows you to get a comprehensive overview of the
    data your system has collected.


    Once you enable this option, the system may prompt you to visit the `Microsoft
    Store` to download and install the `Diagnostic Data Viewer` app. This app requires
    about one gigabyte of free storage space on your device. After installation, you
    can open the app and gain access to all telemetry data and information that `Windows
    11` has collected about your usage.


    In the `Diagnostic Data Viewer` app, you can navigate through the collected data
    and see in detail what information is being transmitted from your system to `Microsoft`.
    The app not only provides an overview of the data but also shows which applications
    are sending the most data to `Microsoft`. This can be particularly insightful
    if you want to understand the extent and detail of your usage monitoring. It gives
    you a better insight into the data collection and allows you to better understand
    which aspects of your system usage are included in the telemetry.


    ## 13. Oh man, and now?


    Oh man, and now, exactly! Yes, dear reader, now you know roughly what’s going
    on. Even I, who deals with these topics daily, can’t even begin to fathom what
    data flows to `Microsoft`, when, how, and why. When I think back to how it all
    started when `Windows` was still considered a revolutionary system, it was really
    impressive! You could literally feel the progress and innovations. But today?
    Microsoft has become a greedy and money-hungry data octopus, which is frightening.


    Let’s pause for a moment and consider the reality: What actually happens when
    you turn on your computer? The operating system immediately starts collecting
    data – without any fuss. It’s not just a small information exchange, but a full-blown
    flood of data going to `Microsoft`. You can be sure that your system continuously
    records information about your usage, your preferences, and even your interactions
    with various applications and websites. All this is collected in a vast data treasure
    trove that `Microsoft` eagerly uses to optimize its services, serve targeted ads,
    or further develop its software.


    Now you might be wondering why I’m telling you all this. I’ve had to elaborate
    a bit here and there to give you a comprehensive picture. But how can I seriously
    suggest an alternative operating system like `Linux` if you don’t understand why
    I’m even considering it? The reality is that `Microsoft`’s relentless data collection
    and analysis is becoming increasingly invasive. And the more you learn about it,
    the clearer it becomes why more and more people are turning to alternative systems
    that are less focused on data collection.


    `Linux` is a promising alternative. It might seem more complicated at first glance,
    but it offers far greater control over your privacy. With `Linux`, you decide
    which data is sent and which is not. You are not at the mercy of a commercial
    company that uses your data as currency. This doesn’t mean `Linux` is perfect
    or free from its own challenges, but it gives you the freedom to protect your
    data on your own terms.


    So, the next time you turn on your `Windows` computer and wonder where all that
    data is going, think about the control you want over your system and your data.
    Maybe it’s time to seriously consider alternatives and think about whether you’d
    rather take a step toward more privacy and independence.


    And now we’ve reached the end of all the negative aspects of `Windows`, the cloud,
    and the other tech giants. If that’s not enough to open your eyes, I don’t know
    what will. We’ve thoroughly addressed the problems and concerns arising from the
    relentless data hunger of the big corporations. These points should be enough
    to give you a clear picture of how invasive and opaque the whole affair has become.
    So, have fun now.


    ## 14. What is Linux


    Imagine a world where you have control over your operating system without constantly
    feeling monitored or exploited. A world where freedom, privacy, and adaptability
    are at the forefront. Welcome to the world of `Linux`. But what exactly is `Linux`,
    and how did it evolve into what it is today? Let’s take a journey through the
    history and features of `Linux`.


    The history of `Linux` begins with a vision of freedom and openness. In 1991,
    when the internet was still in its infancy and `Windows` was just beginning its
    rise, a young Finn named `Linus Torvalds` started working. Torvalds was a computer
    science student at the `University of Helsinki`, and he wanted to create an operating
    system based on the principles of openness and collaboration. His goal was to
    develop a free, non-commercial operating system that was accessible to everyone
    and not subject to the constraints of traditional software models.


    Torvalds began developing a new `kernel`, which is the core component of an operating
    system. This kernel, which he named `Linux`, was intended to provide an alternative
    to the commercially popular operating systems like `Windows` and `Unix` at the
    time. The name `Linux` comes from its creator, `Linus Torvalds`, and the fact
    that it is a `Unix`-like system. The kernel was released under the `GNU General
    Public License`, which allowed anyone to use, modify, and distribute the code.


    What started as a small project quickly grew into a global movement. `Linux` attracted
    the attention of developers and technicians who wanted to use the system as a
    basis for their own projects. The open-source philosophy enabled collaborative
    development, with thousands of programmers worldwide contributing to the project.
    This community of developers and users played a crucial role in the growth and
    stability of `Linux`.


    In the following years, more and more `Linux distributions` were created—custom
    versions tailored to different needs and preferences. Distributions such as `Ubuntu`,
    `Fedora`, and `Debian` became popular and helped make `Linux` more accessible
    to the general public. While `Linux` was initially used mostly by tech enthusiasts,
    it has also gained mainstream acceptance in recent years. Today, `Linux` is not
    only ubiquitous on servers, supercomputers, and in the cloud but has also gained
    prominence in the world of desktops and laptops.

