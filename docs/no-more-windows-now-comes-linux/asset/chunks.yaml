    ## 28.10 Shell 命令资源


    如果你想深入学习在 Linux Mint 上使用 shell 操作，网上有许多有用的资源，它们不仅能教你基础知识，还能解释高级技术和命令。像 Tecmint
    这样的网站提供了超过 100 种基本命令的全面列表，你可以逐步学习（LFCS 备考电子书，[`www.tecmint.com/essential-linux-commands/`](https://www.tecmint.com/essential-linux-commands/)）。它们涵盖了从管理用户账户到网络监控详细指南的所有内容。


    另一个很好的来源是 FOSSLinux，[`www.fosslinux.com/103546/the-beginners-guide-to-using-terminal-on-linux-mint.htm`](https://www.fosslinux.com/103546/the-beginners-guide-to-using-terminal-on-linux-mint.htm)，它专门为初学者提供了详细指南。在这里，你会找到关于如何处理基本命令如
    `pwd`（显示工作目录）或 `chmod`（更改文件和文件夹权限）的简单说明。该网站还涵盖了使用 `apt-get` 和 `dpkg` 进行软件包管理，帮助你直接从命令行安装和管理软件（FOSS
    Linux）。


    这里是一些有用的德语网站，可以帮助你学习、参考并更好地理解 Linux Mint shell 命令：


    **Ubuntuusers.de - 命令概述**：该网站对最重要的 Linux 命令提供了详尽的概述，范围从文件管理到网络命令和进程控制。所有内容都呈现得清晰且文档齐全。网络和文件工具列表尤为有用。链接：[`wiki.ubuntuusers.de/Shell/Befehls%C3%BCbersicht/`](https://wiki.ubuntuusers.de/Shell/Befehls%C3%BCbersicht/)


    **HowtoForge.de - 终端实用基本命令**：该网站涵盖了 Linux Mint 和 Ubuntu 终端中重要的基本命令及其用法。你将找到如何安装软件或管理进程的说明。关于使用
    root 账户和进程控制的提示特别有帮助。链接：[`www.howtoforge.de/uncategorized/nutzliche-grundbefehle-fur-das-terminal-unter-linux-mint-11-und-ubuntu-linu/`](https://www.howtoforge.de/uncategorized/nutzliche-grundbefehle-fur-das-terminal-unter-linux-mint-11-und-ubuntu-linu/)


