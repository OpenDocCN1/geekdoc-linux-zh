  trans: '

    简而言之，虽然 Windows 仍然被认为是用户友好性领先的系统，但如今的 Linux 用户完全可以大有一席之地。现代发行版已经取得了巨大进步，提供了能够让普通用户高效、无缝工作的用户友好型体验。尽管
    Windows 可能仍然是某些人的首选，但 Linux 已经成为许多人极具吸引且实用的选择，这已不再是秘密。


    ## 14.3 Linux 硬件要求


    在当今快速发展的科技领域，硬件需求正成为一个日益紧迫的问题。特别是考虑到微软即将发生的变化以及相关的环境影响，Linux 提供了一个值得关注的替代方案。但让我们退后一步，更仔细地审视这种情况。


    多年来，Linux 因其通用性和灵活性赢得了良好的声誉。Linux 的突出特点之一是它能够在各种硬件配置上运行。对于几乎在 2006 年左右甚至更早制造的几乎任何计算机，都有相应的
    Linux 发行版。这些发行版旨在保持低资源占用的同时，提供完整且用户友好的桌面环境。


    `Lubuntu` 或 `Linux Mint Xfce` 等现代 Linux 发行版专门针对旧款或性能较弱的硬件进行了优化。它们提供了一个轻量级的桌面环境，比现代操作系统更复杂的界面需要的更少的系统资源。这意味着即使是技术上仍然运行良好的旧电脑，也可以通过运行高效且最新的
    Linux 发行版进行操作。这意味着旧硬件不必仅仅因为新版本的操作系统有更高要求而被丢弃。


    2025 年即将到来，随之而来的是 `Windows 10` 的终结，因为微软计划将所有用户迁移到 `Windows 11`。然而，这一过渡带来了巨大的挑战。`Windows
    11` 对硬件规格的要求比 `Windows 10` 高，这意味着许多技术上仍然健康的计算机将无法满足新要求。`Windows 11` 的规范包括 `TPM
    2.0` 芯片、安全启动（Secure Boot）以及特定的处理器架构，这些功能并不是所有旧设备都具备的。


    估计显示，2016 年之前制造的数百万台电脑和笔记本可能无法满足 `Windows 11` 的最低要求。这导致了巨大的环境负担，因为功能性设备变得过时。仅仅因为软件制造商无法使其系统向后兼容，就让数十亿设备被新设备取代，这种想法是令人震惊的。这可能导致大量的电子垃圾——这是一个已经达到令人担忧规模的环境问题。


    在这种背景下，Linux 的环保友好性变得尤为明显。由于 Linux 可以在各种硬件配置上运行，并且可以设计为轻量级，它使得旧设备能够继续使用。Linux
    的这种不仅有助于延长硬件寿命，还减少了对新设备的需求。这对环境产生了深远的积极影响，因为它减少了电子垃圾的数量，并最大限度地减少了计算机制造新原材料的需求。


    此外，Linux 社区内部还有许多专门支持旧设备的项目。像 `AntiX` 或 `Puppy Linux` 这样的发行版是为极旧的硬件设计的，提供的用户体验通常不仅功能完备，而且流畅得惊讶。


    在考虑技术的未来时，我们也应该考虑到我们决定对环境的影响。即将向 `Windows 11` 的迁移构成了一项重大挑战，特别是对于那些运行状况良好的旧设备用户而言。鉴于大量处置这些设备可能带来的环境影响，考虑替代解决方案是重要的。


    Linux 为解决这一挑战提供了极佳的方法。凭借其在旧旧和性能较弱的设备上运行的能力，它代表了一个既有利于用户又环境的可持续选择。与其丢弃功能完好的硬件，你可以通过
    Linux 找到一个高效、最新且环保的解决方案。这不仅是一个务实的决定，也是对更具环保意识的未来的贡献。


    ## 15. Linux 能做 Windows 能做的事吗？


    在考虑操作系统时，Windows 毫无疑问处于顶端。然而，关于 Linux 是否能取代 Windows 的问题正变得越来越重要，特别是考虑到 Linux 在科技界不断持续的发展和日益增长的影响。让我们更仔细地观察这个问题，看看
    Linux 是否真的具备成为 Windows 的完全替代方案的实力。


    首先，重要的是承认 Linux 在过去几年取得了巨大进展。Linux 曾被认为是科技爱好者和 IT 专业人员的操作系统，但现在它提供了广泛的功能，这些功能通常可以与
    Windows 的功能竞争。许多 Linux 发行版现在提供完整的桌面环境，这些环境不仅在视觉上吸引人，在功能上也很全面。


    `Ubuntu`、`Fedora` 和 `Linux Mint` 等现代 Linux 发行版提供了用户友好的图形界面，使得与系统的交互像 Windows 一样直观。软件管理通常通过精简的软件中心进行，安装和更新程序像
    Windows 自身的软件管理一样简单。


    另一个重要点是对专业应用程序的支持。虽然 Windows 在历史上一直是许多专业软件解决方案的首选，但替代方案已日益发展。如用于图像编辑的 `GIMP`、用于办公应用程序的
    `LibreOffice` 以及用于 3D 设计的 `Blender` 等程序提供了强大的功能，在许多情况下可以与其商业对手相媲。`Docker`、`Kubernetes`
    和 `Visual Studio Code` 等开发者工具在 Linux 上也可用。


    Linux 特别出色的一个领域是可靠性和安全性。Linux 以其稳定性和健壮性闻名，使其服务器和关键系统的首选。Linux 的开源特性允许社区进行持续的审查和改进，这增强了安全性并最小化了漏洞的风险。


    相比之下，Windows 经常面临安全威胁。Windows 的高度普及使其成为恶意软件和病毒的主要目标。尽管微软采取了所有安全措施，Windows 系统仍然更容易受到攻击，特别是如果它们没有被定期更新。相反，Linux
    凭借其稳健的权限结构和社区的定期安全审查，提供了显著更小的攻击面。


    不仅是私人用户从 Linux 的优势中受益。科学家和大型公司也日益转向 Linux。包括 `Google`、`Amazon` 和 `Facebook` 在内的许多大型公司都使用
    Linux 作为其服务器基础设施。这些公司利用 Linux 的稳定性、安全性和成本效益。Linux 在不牺牲性能的情况下提供成本效益的商业操作系统替代方案，这是一个巨大的优势。

    '
- fmt: '

    In summary, `Linux` can indeed replace `Windows` in many areas. The advanced desktop
    environments, extensive software support, and superior security make it a powerful
    alternative. While `Windows` still remains the leading desktop operating system,
    modern `Linux` distributions have largely closed the gap in terms of user-friendliness
    and functionality.


    The broad acceptance of `Linux` in the scientific and corporate world speaks volumes
    about its performance and reliability. The use of `Linux` on supercomputers and
    by leading technology firms shows that it is not only suitable as a server operating
    system but also as a serious option for desktops and laptops.


    So, if you are considering whether `Linux` could be an alternative to `Windows`
    for you, do not underestimate the progress and benefits. `Linux` offers you the
    freedom, control, and security you need in today’s digital world – and at a fraction
    of the cost and environmental impact associated with commercial operating systems.


    ## 15.1 Linux Desktop Penetration


    How far has `Linux` come on the desktop? Let’s examine the current numbers and
    facts to gain a better understanding of `Linux`’s presence and influence in the
    desktop market.


    According to the latest statistics, `Linux`’s market share on desktops and laptops
    is about 2 to 3 percent. This number may seem small compared to `Windows`, which
    holds over 70 percent of the market. However, it still shows a notable presence
    for an operating system that was long primarily known as a server or developer
    OS.


    `Linux`’s desktop penetration has been steadily increasing in recent years. Various
    factors contribute to this trend. A significant role is played by the growing
    number of user-friendly distributions such as `Ubuntu`, `Linux Mint`, and `Fedora`,
    which aim to make it easier for average users to get started. These distributions
    offer intuitive graphical user interfaces and simple installation processes that
    make the operating system attractive to a broader audience.


    Additionally, the open-source nature of `Linux` has led to growing interest among
    technical enthusiasts and developers who customize and improve the system. This
    has significantly enhanced both its functionality and user-friendliness.


    Besides the general desktop market, `Linux` has taken on a significant role in
    niche markets. For example, many `Chromebooks`—which are popular in educational
    institutions and among cost-sensitive consumers—come equipped with `Chrome OS`,
    which is based on `Linux`. `Linux` also finds more supporters in the fields of
    digital art and 3D design, offering powerful and specialized software solutions
    that are often available for free or at a fraction of the cost of commercial software.


    Another factor contributing to `Linux`’s increasing penetration is its use by
    businesses and educational institutions. Many schools and universities use `Linux`
    for their computer labs to reduce costs and facilitate access to powerful software.
    Businesses are also increasingly adopting `Linux` to cut operational costs and
