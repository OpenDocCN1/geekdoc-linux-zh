    结论：保持警惕，并花时间彻底检查 `Windows 11` 的数据收集选项。这看起来可能很麻烦，但这是保护至少部分隐私的唯一方法。也许，仅仅是，你也可以考虑那些不那么“贪数据”的替代方案。


    我实际上并不想让你感到心里发慌——等等，停。实际上，我确实想让你这么做。而且出于非常特殊的原因：这是让你在不经情的情况下维持日常数字习惯时，看到每天在脸面前的那种不可置信的危险的唯一方法。这本书不仅仅是为了开开你的眼界，更是为了给你一次比喻上的“腹部击”。如果你在读完这些页面后没有感到哪怕一点不适，那么我就没有完成我的目标。因为正是这种不适感让你意识到，如果想让你的数据和数字生活真正属于自己，就必须发生一些根本性的变化。


    悲剧的真相是，我们永远无法通过塑造 `Microsoft` 尤其是 `Windows` 来让我们的数据成为自己的财产。现实是残酷的：你的数据被收集、分析和使用，而且往往在你的不知情或没有明确同意的情况下进行。随着竞争日益转向云端和全球连接，你的数据变得越来越不受保护——充其量是大大型公司的玩物，最坏的情况下，是网络犯罪分子的廉价猎物。


    但别担心，这种困境是有出路的。关键点在于：我可以向你展示一个系统，它在 `2024` 年能够提供你在真正安全且私私的数字环境中所希望的一切。这个系统并不完美——在数字世界里，完美是一种幻象——但它还给了你你应有的控制权。


    你现在可能在想：»这是什么系统？我该如何真正保护我的数据？«答案在于选择正确的工具和正确的平台。是时候告别 `Windows` 了，选择一个尊重你的隐私、让你控制自己的数据，并且不强迫你向大公司的隐私顾虑低头的系统了。


    我所说的这个系统是 `Linux`。它提供了 `Windows` 拒绝提供的灵活性、安全性和控制权。在接下来的章节中，我将引导你一步步完成转换过程——从选择合适的
    `Linux` 发行版，到保护你的数据，以及建立一个真正属于你的数字环境。


    我们是时候停止安于这种不安的感觉并开始采取行动了。因为事实是：如果我们无所作为，情况不会好转。重新获得对我们数字生活的控制权取决于我们，而且没有比现在更好的时候了。


    ## 12. `Windows` 收集哪些数据？


    `Microsoft` 将某些数据收集归为«必要»，并声称这些数据是保持 `Windows` 高效、更新和安全的必需品。但真正让我感到恐惧的是，对我们的数字生活做出决策时所采取的草率假设。这些«必要」数据包括基本细节，如你的设备型号、系统中的硬件组件以及以防系统故障的诊断数据。初看之下，这似乎无害的，但收集的数据深度和范围远超人们对一个操作系统的预期。


    据报道，为了诊断，`Microsoft` 会收集基本的错误报告数据，例如 `Windows` 更新是否成功以及操作系统是否按预期运行。但它并未止于此。它还收集
    `Windows` 的版本和内部版本、所有可选安装程序，以及你安装的所有应用程序和服务。这意味着，`Microsoft` 不仅知道你使用哪些程序，还知道何时以及频率如何。这种对你数字生活的侵入性洞察被
    `Microsoft` 认为是必要的——老实说，这让我脊背发凉。


    更令我不安的是，你无法停止这些«必要»数据的收集。这就像是在没有你明确同意的情况下，剥夺了你对自己系统的控制权。在此范围之外收集的所有数据据说是可选的，但即使在这里人们必须问：我们有多少人甚至知道收集了哪些数据，以及如何禁用这些收集？


    这种强制性的数据收集是另一个信号，表明我们生活在一个世界里，我们的隐私日益成为一种商品，我们往往在毫无察觉和不情愿的情况下将其交出去。对我来说，这是一个令人震惊的信号，说明我们需要重新思考，我们的数据和数字自由对我们是否真的重要。


    ### 12.1. 浏览器数据


    `Windows 11` 通过监控你的网页浏览活动更进了一步。想象一下：每当你上网时，你在像 `Microsoft Edge` 等微软浏览器中输入的每一个搜索词都可能被
    `Microsoft` 跟踪。这不仅仅是对你浏览行为的斜纵一瞥，而是对你所有在线活动的系统性收集。甚至你对微软浏览器配置设置所做的任何更改都可能被记录，反过来影响你的搜索结果。


    真正让我害怕的是这种监控的深度。针对的不仅是你的普通浏览行为，还有你在浏览器中做的每一个细微调整和偏好。这些信息是有价值的——对你来说不是，但对那些利用这些数据预测你的行为、向你投放定向广告，甚至影响你的观点的公司来说。


    但这种数据陷阱是有出路的，至少部分如此。如果你想禁用这种监控，前往 `设置 > 隐私和安全性 > 诊断与反馈` 并关闭«发送可选诊断数据》。这一步至少限制了部分不想要的数据收集。但警告你：这种措施只是杯水一薪。只要你使用
    `Microsoft` 的生态系统，总会有你无法完全关闭的某种程度的监控。


    ### 12.2. 你的输入


    输入，没错！接下来的内容简直令人震惊！`Windows 11`  alleged 收集关于你输入、手写甚至说话的各种匿名数据。是的，你没读错——无论是通过键盘、语音，还是在触摸屏上用笔，所有的输入都会被记录。这些数据据称用于改进相关服务，例如优化
    `Windows` 中的语音识别和手写识别。


    但老实说，谁会对这些感到舒服呢？所有这些输入都被收集和分析以改进用户体验，这种想法听起来不错，但却让人感觉糟糕。即使是你的手写笔记或个人录音也会进入一个匿名数据库，这种想法并不让人放心。当然，你被保证这些数据是«匿名化」的——但在一个数字信息几乎不可能完全匿名的时代，这到底意味着什么呢？


    如果你不想接受现状——而且你不应该接受——有一种方法可以部分遏制这种数据收集。前往 `设置 > 隐私和安全性 > 诊断与反馈`，然后关闭«改进墨迹和打字»。这停止了对你输入的直接监控，但一如既往，只要你还留在
    Windows 世界里，就无法完全躲避窥探的目光。


    这种监控清楚地表明：实用用功能与侵入性数据监控之间的界限正变得越来越模糊。我们需要保持警惕，并积极采取措施保护我们的数字隐私——在完全失去控制权之前。尽管，如果我们诚实的话，我们已经失去了它。我们早已失去了对自己数据的控制权。


    ### 12.3. 产品和服务性能


