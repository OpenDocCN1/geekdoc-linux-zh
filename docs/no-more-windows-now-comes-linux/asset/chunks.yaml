    你可能已经注意到，我带你过的欢迎界面（Welcome Screen）操作顺序略有不同。这其中有简单的原因。首先，我想确保你的系统是最新的。毕竟，在一个新安装但没有打过补丁或更新的操作系统上工作，有什么用呢？你心里很清楚：安全第一！如果我们深入研究
    Linux Mint 的深层功能却忘记了更新系统，那将是灾难性的。因此，我的第一步是应用更新。只有这样，你的 Linux Mint 才是最新的、受保护的，并准备好进行下一步。


    接下来，我想让 `Timeshift`——我们系统备份的忠实伴侣——发挥它的作用。如果你还记得，我们创建了一个初始快照，以确保我们在此为止所做的所有工作都不会丢失。因为有一点是明确的：无论我们付出了多少努力，总会有出错错。在这种情况下，我希望你能够放心，因为你知道
    `Timeshift` 会是你的后盾。无论是更新失败还是软件问题——`Timeshift` 都能确保你的安全。因此：在我们深入研究该问题之前，先创建一个快照。


    然后我们处理了 `Driver Management`（驱动管理）。为什么呢？嗯，驱动对于优化硬件的使用至关重要。如果你的显卡、网络适配器或其他组件运行不正常，整个
    Linux Mint 的体验将大打折扣。所以，对我来说，确保一切都设置正确非常重要。是的，在这里我们也用 `Timeshift` 制作了一个快照。因为正如我常说的那样：防患于缪胜于治疗。


    在完成了所有这些之后，我想带给你一些乐趣。现在你的系统已经更新并安全了，我想是时候让你看点东西了。你只需点开一下 `Application Manager`（应用程序管理器），可能——希望如此——会感到一丝兴奋。让我们诚实吧：想象一下你不需要不断考虑钱包就能获得所有想要的程序，这种感觉很有趣。没有烦人的价格标签，没有“仅限试用版”——一切触手可及，而无需由工资单说了最终决定。


    所以，是的，我刻意遵循了这个顺序，因为对我来说，让你从一开始就站在稳实的基础之上非常重要。现在一切都已就绪，你可以开始探索 Linux Mint 的广大世界了——无需担心。我希望你像我一样喜欢它！


    ## 23.7 第六项任务：桌面颜色


    所以，我们已经走了很远的路了。系统已安装，更新已应用，驱动正在运行，而且最重要的是——我们已经准备了几个 `Timeshift` 备份。老实说，我觉得我们可以给自己点个掌了。我们已经共同取得了许多成就，在过去的几个步骤中，你一定已经熟悉了
    Linux Mint。最棒的部分是：一切都保持得如此整洁、清晰，没有你在其他操作系统中常见的那些华丽装饰和杂乱。Linux Mint 只提供了一种精美、愉快的体验，而不会被成千上万不必要的干扰所淹没。


    既然我们已经有了稳实的基础，可以将注意力转向更具创意性的事情了。是时候给你的 Linux Mint 增加一点个性了！我们将通过处理桌面颜色来实现。为什么不呢？桌面是你看到最多的地方，所以为什么不让它看起来完全如你的意呢？


    如果你一直跟我走到了这里——我非常希望你是这样——我们现在处于同一个位置：系统很稳定，主要工作已经完成，我们可以专注于定制了。我们将从桌面颜色开始，即根据你的个人喜味定制你的
    Mint 桌面。这就是 Linux Mint 的美之处：你不仅可以根据喜好定制界面，还可以轻松调整桌面的调色板。


    你偏于使用微妙、中性颜色的极简风格吗？没问题。或者也许更活泼一些，用大胆的色彩让你的桌面闪闪发光？那也没有问题。Linux Mint 赋予你自由，完全按照你喜欢的方式设计桌面——而且毫无麻烦。一切都组织得良好且结构清晰，所以你不必必在无尽的菜单和设置中挣扎。定制选项可以直接访问且易于实现。


    老实说，谁想要一个看起来和别人一模一样的无聊桌面呢？调整桌面颜色给了你一个为系统增添个人色彩的机会。这就像给你的数字家刷了一层新漆。所以让我们开始吧，让你的
    Mint 桌面变得独一无二！


    ### 定制主题


    点击欢迎界面上第一个部分 »`Desktop Colors`« 下方的绿色按钮，或者进入开始菜单并输入 `theme`。`Themes`（主题）窗口将打开：


    ![](img/image_rsrc1J6.jpg)


    在这里，你可以轻松地在浅色和深色之间切换，或者自定义颜色。尽管尝试尝试。你一定能找到你喜欢的。


    ![](img/image_rsrc1J7.jpg)


    在 `Themes` 对话框中，你对 Linux Mint 桌面的外观拥有完全控制权，最棒的部分是：它极其简单。当你点击 `Advanced Settings...`（高级设置）按钮时，整个定制选项的世界开启了。这就像走进一个数字展示厅，你可以在那里浏览并选择任何你喜欢的东西。相信我，选择是非常丰富的！


    在这里，你可以下载并应用无数的主题模板。无论你是偏好保持一切整洁利落的优雅极简风格，还是更活泼、色彩斑斓的风格来为你的桌面增添一些活力——一切皆有可能。最棒的是是：你并不限于默认的预装设计。得益于高级设置，你有数百个主题可以下载和尝试。想让你的
    Linux Mint 看起来像一个未来的科技系统吗？没问题。或者想要一个经典的怀旧的外观？只需几次点击即可。


    主题模板提供了各种功能：从更改窗口标题栏、调整系统颜色到选择各种图标样式。你可以单独自定义桌面上的图标，更改菜单和按钮的颜色，甚至完全自定义面板或对话框的设计。


    如果你发现某个设计不适合，不用担心。你可以轻松地更改它或切换回另一个。而且这一切都在无需重启的情况下完成。这里提供的灵活性确实令人印象。你可以创建自己独特的桌面体验——完全按照你的想法。


    所以，如果你想让你的桌面真正具有个性化，只需点击 `Advanced Settings...` 并探索 Linux Mint 提供的许多选项。你会惊讶于这些定制选项是如此简单强大。可能性是无限的——尝试吧，让你的
    Mint 桌面成为原创！


    右键点击桌面并选择 `Change Desktop Background`（更改桌面背景）选项。你会对这么多漂亮的图片感到惊讶。Linux Mint 提供了丰富的壁纸选择，你可以浏览以找到桌面的完美图片。从宁静的自然景观到动态图形——总有适合各种口味的选择。


    如果你想进一步根据喜好定制桌面，再次右键点击桌面并选择 `Customize`（定制）。这将带你进入一个新窗口，显示屏幕布局。在这里，你有机会进一步个性化你的桌面环境。


    ![](img/image_rsrc1J8.jpg)


    在这个定制窗口中，你会在底部找到名为 `Desktop Settings`（桌面设置）的按钮。点击它将打开另一个窗口，你可以在那里添加或删除桌面上的各种元素。在这里，你可以决定是否要在桌面上显示`计算机`、`个人文件夹`、`垃圾箱`、`已载设备`和`网络`。

