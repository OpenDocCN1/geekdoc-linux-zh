    在“选择快照位置”对话框中，选择一个兼容的存储设备并点击“下一步”（你无法选择任何不兼容的存储设备）：


    ![](img/image_rsrc1HV.jpg)


    在“选择快照级别”窗口中，你可以为时间和保留策略创建计划。起初，保持所有设置不变。你可以随时进行调整。默认设置是每天创建快照并保留 5 个。这意味着快照将保留过去
    5 天的记录。这对于初始备份很有帮助。


    ![](img/image_rsrc1HW.jpg)


    在“用户个人文件夹”窗口中，保持设置不变。选择“排除所有文件”。快照是为系统设计的。我们稍后将使用备份工具备份个人数据和文件夹。这很重要，因为如果你由于系统错误需要回滚快照，那么个人文档不应该被更改。点击“下一步”：


    ![](img/image_rsrc1HX.jpg)


    现在你看到了“设置完成”。再次检查所有内容，然后点击“完成”：


    ![](img/image_rsrc1HY.jpg)


    现在你又看到了 Timeshift 窗口。点击左上角的“创建”：


    ![](img/image_rsrc1HZ.jpg)


    Timeshift 正在创建第一个快照并复制每个系统文件。由于需要复制所有文件，这需要一些时间。理想情况下，一个专门用于快照的独立硬盘是最好的。如果你有一个外部硬盘，并每天安全地将快照存储在那里，那么几乎不会出任何问题。无论你做什么，你都可以回滚。保留好
    Linux Mint 启动盘；我们可以立即将其作为救援盘使用。Live 环境包含了 Timeshift，万一发生错误，你可以使用它重置系统或将其移动到另一块硬盘。


    ![](img/image_rsrc1J0.jpg)


    当 Timeshift 完成后，你就可以关闭工具了。系统已备份完成，我们可以继续。


    ![](img/image_rsrc1J1.jpg)


    ## 23.2.2 快照总结


    让我们再次总结一下。从一开始就牢记保留系统快照以及随后的定期备份是极其关重要的。设置它们快速又简单——而且说实话，如果你的电脑崩溃了、硬盘故障了或发生了意外错误……相信我的，如果你提前创建了系统快照，你将对此感激不尽。


    Linux 无疑地比 Windows 更健壮、更安全，这一点毫无疑问。操作系统提供了一个稳定的基础，在很大程度上免疫于 Windows 用户面临的许多问题。但让我们不要忘记：Linux
    也是由人编写的，而不是神。错误会发生，软件可能会崩溃，更新有时会引起意想不到的问题。这正是系统快照大显身场的地方——它们是你的安全网。


    简单来说，快照是你的系统在特定时间点的精确映像。它们捕捉操作系统的当前状态并将其存储作为参考。这意味着如果更新更新、安装新软件或更改系统后发生了问题，你可以只需点击一下将一切恢复到之前的状态，而不会影响你的个人文件。


    为什么系统快照如此重要？因为它们允许你无畏地进行实验。想测试新软件或对系统进行更深层的更改吗？没问题！如果某些运行不符合预期，你可以随时返回上一个快照，就像什么都没有发生过一样。


    最好的部分是：快照设置快速并且可以自动创建。像 `Timeshift` 这样的工具处理这项任务，并让你创建定期快照变得特别容易。无论是每天、每周还是每次大更新——都由你决定何时以及多久创建快照。这让你能够自由地专注于实际工作，而不必时刻担心潜在的系统问题。


    快照保存在 Linux 兼容的文件系统上，如 `ext4`。这很重要，因为只有这些文件系统可以正确存储 Linux 流畅运行必需的复杂文件权限和所有权。因此，请确保使用符合这些要求的合适存储介质。


    老实说——创建快照！它们是你应对意外灾难最好的保护，并为你提供了充分享受 Linux Mint 所需的安全感。这是一项收益巨大的努力，可以节省数小时的故障排除和沮丧。


    ## 23.3 第三项任务：驱动管理


    现在，亲爱的读者们，在安装 Linux Mint 并完成初始步骤后，我们再次看到了欢迎界面。此界面提供了一些关键功能，将帮助你入门并确保系统运行顺。我想强调的特别重要的一点之一是“驱动管理”。


    你可能会想为什么这这么重要。嗯，想象你拥有一个强大的硬件——例如一张 `Nvidia GeForce GTX 1050 Ti` 显卡。这张显卡的设计旨在提供卓越的图形性能，无论是用于游戏、视频编辑还是仅仅是桌面使用。但所有这些性能都取决于控制它的软件。这就是驱动程序发挥作用的地方。


    驱动程序是使操作系统与硬件之间能够通信的小型软件程序。没有正确的驱动程序，你的硬件——无论是显卡、Wi-Fi 模块或其他组件——都无法发挥全部潜力。这意味着如果你没有安装正确的驱动程序，你的
    `GeForce GTX 1050 Ti` 可能只被识别为基础显卡，导致性能远低于显卡实际提供的性能。Linux Mint 的平滑动画可能运行得不顺畅，像游戏或图形程序之类的可能会出现问题。


    而这就是 Linux Mint 的驱动管理变得不可或缺的地方。欢迎界面提供了进入驱动管理的快捷方式，让你确保硬件从从起就以最佳状态运行。驱动管理会自动扫描你的系统，寻找具有私有驱动程序的硬件——即专为你的硬件开发的驱动程序。这对于
    `Nvidia` 显卡来说尤为重要，例如我们的 `GeForce GTX 1050 Ti`。


    `Nvidia` 同时提供开源驱动和私有驱动。Linux Mint 自带的开源驱动对于许多用户来说足够了，但它们无法充分利用你的图形性能。另一方面，`Nvidia`
    的私有驱动经过了优化，可以提供可能的图形性能。它们为 3D 图形、游戏和高需求应用程序提供了更好的支持。而且你可以轻松通过驱动管理安装这些驱动。


    它是如何工作的？很简单：打开驱动管理并让它扫描系统。如果你有一张 `Nvidia GTX 1050 Ti`，它会直接向你显示合适的私有驱动。只需点击“安装”，Linux
    Mint 会处理剩下的工作。重启后，你可以确定显卡正在以最高性能运行。


    为什么这如此重要？因为正确的驱动配置确保你能够获得最佳结果。你的硬件运行得更稳定，遇到崩溃或性能瓶颈的问题也会减少。显卡是一个例子，但同样适用于 Wi-Fi
    适配器、声卡或打印机等组件。驱动管理确保你的硬件从一开始就按预期工作。


    点击“驱动管理”下的绿色按钮：


    ![](img/image_rsrc1J2.jpg)


    驱动管理正在搜索驱动程序：


    ![](img/image_rsrc1J3.jpg)


    如果像我这种情况不需要驱动程序，你将看到以下输出：


    ![](img/image_rsrc1J4.jpg)


    ## 23.4 第四项任务


    驱动管理之后。如果你的 Linux Mint 发现并安装了驱动程序，请创建一个新的 `Timeshift` 快照。进入开始菜单，输入 »time,« 然后点击
    `Timeshift`。使用你的密码登录，然后在 `Timeshift` 中点击“创建”。然后你就可以继续。


    ## 23.5 第五项任务：应用程序管理


