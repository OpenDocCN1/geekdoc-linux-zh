- fmt: '

    The idea that your sensitive information—whether personal documents, financial
    data, or business-critical information—is stored in the cloud without knowing
    exactly who can access it or where it is stored should prompt you to think critically.
    The convenience and ease that cloud services offer should not overshadow the significant
    security and control risks they entail. These risks become even greater when you
    find yourself in a situation where the provider goes bankrupt, gets hacked, or
    transitions to another country with different laws.


    So, if you are wondering whether it is truly safe to store your data in the cloud,
    you should also consider how little control you actually have over this data.
    An alternative to this insecure model is to regain control over your own data—such
    as by using a local operating system like `Linux`, where your data remains on
    your own hardware. Here, you have full control over who can access your data,
    when, and how, and you are not subject to the uncertainties of an unstable or
    insecure cloud provider.


    In a world where data is becoming increasingly valuable, you should carefully
    consider whom you entrust with your digital treasures. Losing control over your
    own data can have far-reaching consequences that go beyond the loss of a wallet.
    It concerns security, confidentiality, and ultimately sovereignty over your own
    information. By storing your data locally and relying on solutions that give you
    control, you can ensure that you can sleep peacefully in an increasingly connected
    world—knowing that your digital assets are safe and protected.


    A particularly critical look should be directed at the largest cloud providers
    worldwide: `Google`, `Amazon`, `Facebook`, and `Microsoft`. These tech giants
    are headquartered in the US, a country with much less stringent data protection
    laws compared to the European Union. This is not an insignificant difference but
    a factor that can have massive implications for how your personal and business
    data is handled. The fact that these companies have almost free rein in how they
    use your data is often underestimated—and yet, this is exactly what happens every
    day.


    These American companies operate in a legal environment that grants them extensive
    freedom in the use, analysis, and exploitation of user data. While data protection
    laws like the General Data Protection Regulation (`GDPR`) in the EU attempt to
    protect citizens''‹ privacy, regulations in the US are much looser. This allows
    large tech corporations to collect and process data as they see fit. And they
    take full advantage of this.


    Despite these lax data protection practices, `Google`, `Amazon`, `Facebook`, and
    `Microsoft` enjoy the trust of millions, if not billions, of people worldwide.
    These companies have managed to position themselves as indispensable service providers—whether
    through search engines, social networks, e-commerce platforms, or cloud-based
    software solutions. Many people use their services daily, often without being
    fully aware of how deeply these corporations intrude into their personal and professional
    data. They offer seemingly free or inexpensive services, but the true cost users
    pay is the loss of control over their data.


    A particularly problematic aspect is the extensive data analysis that these companies
    conduct. The capabilities available to them are far more advanced than anything
    even experienced tech specialists in the EU could dream of. Every email, every
    document, every image uploaded to the cloud is filtered, analyzed, and cataloged.
    This analysis is done not only to improve the service or display personalized
    ads but also to create comprehensive user profiles that can be used for various
    purposes—from market research to political influence.


    The problem is that these processes are neither transparently traceable nor effectively
    preventable from within the EU. While the `GDPR` attempts to regulate and control
    the flow of data to the US, practice shows that it is almost impossible for users
    to know exactly what happens to their data once it leaves Europe’s borders. Furthermore,
    the terms and privacy policies of these companies often span hundreds of pages
    and are written in language that is difficult even for experts to understand.
    These documents are designed to be so complicated and comprehensive that most
    users simply accept them without reading them. By doing so, they consent to practices
    they do not even remotely understand.


    It is only a matter of time before many people and businesses will regret moving
    all their data to the cloud. For once they have given up control over their data,
    they are subject to the decisions and practices of these large corporations. If
    legal frameworks change or these companies decide to alter their business models,
    users may find that their data has been used in ways they never intended.


    Such a day could be triggered by a variety of factors: a major data misuse scandal,
    a sudden change in terms of service, acquisition by another company that places
    even less emphasis on data protection, or even a political event that restricts
    or controls access to this data. In a world where data is the new oil, entrusting
    this valuable asset to a company operating in a country whose laws do not sufficiently
    protect this data is risky.


    So the question arises whether it is really wise to place so much trust in companies
    that operate largely outside the EU’s influence and its strict data protection
    laws. Would you simply leave your wallet lying around and trust that no one will
    touch it? Probably not. Yet that is exactly what many do when they entrust their
    data to these cloud services without knowing exactly who can access it, when,
    and how.


    It is therefore crucial to understand the risks and consider alternative solutions.
    Operating systems and services that allow you to control your own data, such as
    `Linux`, offer a real alternative. They provide you with the opportunity to store
    your data locally and protect it on your own terms, without having to rely on
    the opaque and often non-transparent practices of large tech corporations.


    The digital world is becoming increasingly complex, and it is getting harder to
    keep track of who does what with our data. But one thing is clear: retaining control
    over our own data is crucial for our digital sovereignty and privacy. It is time
    to take this aspect seriously and be aware of what we are giving up when we place
    our data in the hands of these large corporations. Because the price we pay for
    it could be higher than we ever imagined.


    # 7 Energy Consumption of the Cloud


    While your computer, laptop, or even a server consumes only a few hundred watts
    or several kilowatt-hours if it’s a larger server, it is hard to imagine how much
    energy is used by cloud services. Do you have any idea how much energy is needed
    to upload just 1 GB of data to the cloud? Well, take a look:


    The energy consumption of cloud services is enormous and often underestimated.
    Uploading just 1 GB of data to the cloud requires a considerable amount of energy.
    This is not only due to the transmission itself but also to the storage and the
    many associated processes in the massive data centers that operate these cloud
    services. These data centers consist of thousands of servers running around the
    clock, which need to be cooled and require a stable power supply. The massive
    server farms not only consume vast amounts of energy but also contribute significantly
    to CO₂ emissions.


    Data centers, especially the operated by major providers such as `Google`, `Amazon`,
    and `Microsoft`, require a massive infrastructure to handle the volume of data
    flowing through the internet daily. These centers are often as large as several
    football fields and, in many cases, consume more electricity than entire cities.
    The servers themselves generate heat that must be dissipated by powerful cooling
    systems, which, in turn, consume even more energy.

