    这正是 IONOS 发挥用场的地方，这是一家位于德国的云供应商，严格遵守 GDPR（通用数据保护条例）。您在 IONOS 所有数据都存储在经过 ISO 27001
    认证的德国数据中心，符合最高安全标准。此外，IONOS 为存储数据提供 AES-256 位加密，如果您在上传前对数据进行加密，即使是服务商也几乎无法访问。与位于美国的云服务相比，这是一个关键的优势，因为后者往往会受到当地政府机构的监控。


    另一个不容低估的一点是 IONOS 卓越的客户服务。其支持不仅易于获取，而且提供专业的协助，这在关键情况下可能至关重要。在与其他更廉价的服务商有过经历后，我最终还是回到了
    IONOS，因为其安全收益和支持远超略高出的成本。


    此外，IONOS HiDrive 服务的价格非常公道。每月约 10 欧元的费用，您不仅获得了符合 GDPR 标准的数据存储，还获得了德国数据中心的优势。这让您能够确信自己的数据不会被轻易解密或滥用——这与那些大型国际服务商不同，它们在数据使用方面往往是不透明的。


    对于那些重视数据保护但仍想利用云服务的人来说，IONOS 配合 HiDrive 绝对值得考虑。德国式数据保护的严谨性、可靠的支持以及公道的价格，使得该供应商成为一个安全的选择，特别是与大型国际竞争对手相比时。


    ## 10. 云之旅结语


    那么现在怎么办？在明确了云服务既有好处也存在巨大风险之后，该如何做？我们中的许多人确实意识到了云服务的优势——易用性、灵活的访问以及随时随地管理数据的能力是不可否认的。然而，与此同时也存在一长串缺点，这些缺点可能在未来才会显现，也许那时已经为时已晚。


    将我们的个人数据存储在云端的主意最初听起来很实用。然而，考虑到这些数据存储在不受我们控制的服务器上，而且通常位于数据保护法律松得得的国家，这可能会令人不安。此外，提供这些服务的科技巨头对这些数据拥有几乎无限的访问权限，并经常根据自己的意愿分析、出售或将其其他用途。这些公司拥有巨大的资源，其议程很少与我们的利益一致。还存在数据泄露、黑客攻击或仅仅是法律法规变化的风险，这些可能随时影响到我们。


    那么可以做些什么来减少这些风险并重获安心呢？你可以采取具体的步骤来保护自己，同时在一定程度上利用云的好处。


    ### 1. 第一步可能是最激进的一步：“把 Windows 扔进垃圾桶”！


    Windows 已经日益成为一个实际上迫使用用户使用云服务的系统。微软勤奋地收集数据，将其推向云端，并通过许多方式强迫用户将数据存储在它的服务器上。切换到另一个操作系统，例如
    `Linux`，可能是第一步。`Linux` 不仅是开源的，而且让你对自己的数据及其存储拥有完全的控制权。有各种发行版易于安装并提供友好的界面。例如，`Linux
    Mint` 以简单著称，特别适合那些从 Windows 过的用户。


    ### 2. 使用加密


    如果你希望继续使用云服务，应该在将数据上传到云端之前对其进行加密。有各种程序和工具可以帮助你安全地加密数据。这确保了即使你的数据落入坏人手中，如果没有相应的密钥，它也是毫无用的。端到端加密是此处的理想方法。


    ### 3. 选择符合 GDPR 的云服务供应商


    如果你不想完全放弃云服务，请选择总部位于欧盟并严格遵守 GDPR 的供应商。`IONOS` 在这里是一个很好的例子。你的数据存储在德国，且该服务商受欧盟严格数据保护法律的约束。这减少了你的数据在未经你许可的情况下被共享或滥用的风险。


    ### 4. 创建本地备份


    不要仅仅依赖云端。在外部硬盘或其他物理存储介质上进行定期备份应该成为一种常例。这些备份也应该被加密。这样，即使云服务暂时不可用，或者在最坏的情况下数据丢失，你手里也有一份数据的副本。


    ### 5. 重新考虑云服务的使用程度


    现在可能是从根本上重新审视你对云服务的依赖了。并不是每个文件都需要存储在云端。问问自己，哪些数据真正属于云端，哪些不属于。那些不能落入坏人手中的敏感数据应该尽可能存储在本地。


    总结来说：这并不是要完全魔化云服务。它有其好处，但应该有意识且谨慎地使用这些好处。风险是真实且多样的，忽视它们可能会导致不 unpleasant 的惊喜。通过采取积极行动，你可以享受云的好处，而不会不必要危及你的安全和隐私。


    ## 11. Windows 11 的数据饥渴


    自 2024 年以来，Windows 将数据收集推向了极端，几乎好像微软突然想要吸收你数字生活的每一个细节。诚然，某些数据对于操作系统的运行是必要的，但并非所有收集的数据都属于这一类。大多数数据收集仅仅是可选的——而且往往是没有必要的。但悲哀的现实是，许多用户甚至不知道收集了什么数据，更不用说拒绝的选择了。


    从 Windows 11 的初始设置开始，你就能看到这个操作系统是如何设计成收集数据的。从位置服务到个性化广告和诊断数据——Windows 试图尽可能多地了解其用户。最糟糕的部分是？除非你明确退出，否则许多功能都是默认开启的。但让我们诚实面对：在安装过程中，谁会仔细阅读每一个窗口和每一个通知呢？


    '
- fmt: '

    In conclusion: Be vigilant and take the time to thoroughly review the data collection
    options of `Windows 11`. It may seem bothersome, but it’s the only way to preserve
    at least some of your privacy. And perhaps, just maybe, you might also consider
    alternatives that are not as data-hungry.


    I don’t actually want to give you a sinking feeling in your stomach—wait, stop.
    Actually, I do want that. And for a very specific reason: it is the only way to
    show you the unbelievable danger staring you in the face every day while you unknowingly
    maintain your everyday digital habits. This book is not just meant to open your
    eyes; it’s meant to give you the proverbial punch in the gut. If you don’t feel
    at least a bit queasy after these pages, then I have failed in my goal. Because
    it is this queasiness that makes you realize that something fundamental needs
    to happen if your data and your digital life are to remain truly your own.


    The sad truth is that we will never have the opportunity to shape `Microsoft`
    and specifically `Windows` in a way that keeps our data our property. The reality
    is sobering: your data is collected, analyzed, and used, often without your knowledge
    or explicit consent. And as the playing field increasingly shifts toward the cloud
    and global connectivity, your data remains increasingly unprotected—at best, a
    plaything for large corporations, at worst, easy prey for cybercriminals.


    But don’t worry, there is a way out of this dilemma. And here’s the crucial point:
    I can show you a system that, in `2024`, offers everything you hope for in a truly
    secure and private digital environment. This system is not perfect—perfection
    is an illusion in the digital world—but it offers you back the control you deserve.


    You might be wondering now: »What is this system? How can I truly protect my data?«
    The answer lies in choosing the right tools and the right platform. It’s time
    to say goodbye to `Windows` and opt for a system that respects your privacy, gives
    you control over your data, and doesn’t force you to bow to the privacy concerns
    of large corporations.


    The system I’m talking about is `Linux`. It offers the flexibility, security,
    and control that `Windows` withholds from you. In the coming chapters of this
    book, I will guide you step by step through the process of making the switch—from
    choosing the right `Linux` distribution to securing your data and setting up a
    digital environment that truly belongs to you.


    It’s time for us to stop settling for uneasy feelings and start taking action.
    Because the truth is: if we do nothing, it won’t get any better. It’s up to us
    to regain control over our digital lives, and there’s no better time than now.


    ## 12. What data does `Windows` collect?


    `Microsoft` classifies some data collection as »necessary« and claims that this
    data is needed to keep `Windows` effective, up-to-date, and secure. But what truly
    scares me is the sheer assumption with which decisions are made about our digital
    lives. These »necessary« data include basic details such as your device model,
    the hardware components in your system, and diagnostic data in case of system
    failures. At first glance, this may seem harmless, but the depth and extent of
    the data collected go far beyond what one would expect from an operating system.


    For diagnostics, `Microsoft` reportedly collects basic error reporting data, such
    as whether a `Windows` update was successfully applied and whether the operating
    system is functioning as intended. But it doesn’t stop there. It also collects
    the version and build of `Windows`, all optional installations, as well as all
    applications and services you have installed. This means that `Microsoft` not
    only knows which programs you use but also when and how often. This invasive insight
    into your digital life is deemed necessary by `Microsoft`—and honestly, it sends
    shivers down my spine.


    What disturbs me even more is the fact that you cannot stop the collection of
    these »necessary« data. It’s as if control over your own system is taken away
    without your explicit consent. All data collected outside this scope is supposedly
    optional, but even here one must ask: How many of us even know what data is collected
    and how to disable this collection?


    This compulsory data collection is yet another sign that we live in a world where
    our privacy increasingly becomes a commodity that we often give away unnoticed
    and unwillingly. To me, this is an alarming sign that we need to rethink if our
    data and digital freedom are truly important to us.


    ### 12.1. Browser Data


    `Windows 11` takes data collection a step further by monitoring your web browsing
    activities. Imagine this: every time you browse the internet, every search term
    you enter in a Microsoft browser like `Microsoft Edge` could be tracked by `Microsoft`.
    This is not just a fleeting glance at your browsing behavior, but a systematic
    collection of all your online activities. Even changes you make to the configuration
    settings in Microsoft browsers could be recorded, which in turn affects your search
    results.


    What really scares me is the depth of this surveillance. It’s not just your general
    browsing behavior that’s targeted, but every tiny adjustment and preference you
    make in your browser. This information is valuable – not to you, but to the companies
    that use this data to predict your behavior, bombard you with targeted ads, or
    even influence your opinions.


    But there is a way out of this data trap, at least partially. If you want to disable
    this monitoring, go to `Settings > Privacy and Security > Diagnostics and Feedback`
    and turn off »Send optional diagnostic data.«. This step at least limits some
    of the unwanted data collection. But be warned: this measure is just a drop in
    the ocean. As long as you use `Microsoft`’s ecosystem, a certain degree of surveillance
    will always remain that you cannot completely turn off.


    ### 12.2. Your Inputs


    Your inputs, exactly! What comes next is truly shocking! `Windows 11` allegedly
    collects anonymized data about everything you type, write by hand, or even speak.
    Yes, you read that right – every input, whether through the keyboard, dictation,
    or on a touchscreen with a pen, is recorded. This data is supposedly used to improve
    relevant services, such as optimizing speech recognition and handwriting reading
    in `Windows`.


    But honestly, who feels comfortable with that? The idea that all these inputs
    are collected and analyzed to improve the user experience might sound nice, but
    it leaves a bad taste. The notion that even your handwritten notes or personal
    dictations end up in an anonymous database is far from reassuring. Of course,
    you are assured that this data is »anonymized« – but what exactly does that mean
    in an era where it’s almost impossible to keep digital information completely
    anonymous?


    If you don’t want to accept this as is – and you shouldn’t – there is a way to
    at least partially curb this data collection. Go to `Settings > Privacy and Security
    > Diagnostics and Feedback` and then turn off »Improve inking and typing«. This
    stops the direct monitoring of your inputs, but as always, if you remain in the
    Windows world, there is no complete protection from prying eyes.


    This kind of surveillance makes it clear: the line between useful functionality
    and invasive data monitoring is increasingly blurred. It is up to us to remain
    vigilant and actively take steps to protect our digital privacy – before we lose
    control over it completely. Which, if we are honest, we have already lost. We
