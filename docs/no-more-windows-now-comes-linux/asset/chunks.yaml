  trans: '

    2017 年的一份绿色和平组织报告显示，最大的云服务提供商的数据中心消耗的能量已经超过了当时的许多小国家。尽管这些公司正试图减少排放并转向可再生能源，但能源需求仍然巨大且在持续增长。


    考虑到许多数据中心位于电力仍主要来自化石燃料的国家，这一点变得尤为关键。这意味着每上传 1 GB 数据的碳足迹比人们想象的要大得多。你上传到云端的 1 GB
    数据需要消耗几千瓦时的能量，而这仅仅是个开始——这些数据需要存储、处理，并可能在全球范围内进行镜像，以确保其随时可用。


    这引出了另一个重要的一点：云端数据的持续可用性和冗余。为了确保你的数据不丢失，它通常存储在跨大陆的多个数据中心。这意味着 1 GB 的数据不仅被存储一次，而且在这些巨大的服务器农场中存储多次，并不断进行同步。能量消耗随之倍倍增加，与之相关的二氧化碳排放也是如此。


    因此，将单个设备（无论是笔记本电脑还是服务器）的能耗与云服务的能耗进行比较，可以很快地看出云服务消耗了大量的资源。虽然你的家用电脑只在使用时才消耗能量，但数据中心的服务器无论数据是否正在被访问，都是持续运行的。


    对于具有环保意识的用户来说，这意味着使用云服务也伴随着生态责任。意识到使用这些服务相关的环境成本是重要的，并且尽可能考虑能源强度更低的替代方案。


    简而言之：云服务可能方便且实用，但它付出了高昂的能源代价，这最终会影响环境。


    ## 8. 德国云服务的优势


    当然，我并不是想声称云服务没有益处。相反，它们无疑有其理由和实用的应用场景。完全忽视云服务的优势是不现实且不公平的。像 `Google Drive`、`Dropbox`
    或 `OneDrive` 等服务提供了巨大的灵活性，允许从任何地方轻松访问数据。这使得它们成为许多用户（尤其是公司）数字日常生活中不可或缺的工具。同步文件、协作项目或仅仅对重要文档进行备份的能力都是实用且高效的。


    我自己也使用云服务，但非常谨慎。我使用 `Ionos` 的云服务就是一个例子。然而，我将自己限制在他们的 `Hidrive` 服务上，我专门将其用于安全存储我的备份数据。这给我了一个优势，即可以在外部位置保护我的数据，而无需依赖那些可能深度侵入我数字生活的云计算服务。关键区别在于我在数据上传到云端之前是如何处理它的：我在我的
    `Linux` 系统上对其进行加密，这样一旦它们落到 `Ionos` 的服务器上，它们只会表现为无法理解的数字乱码。


    这种方法有几个优点。首先，即使有人获取了我在 `Ionos` 服务器上的数据访问——无论是通过安全事件还是未经授权的访问——只要加密没有没有被破解，这些信息将是完全不可读且毫无价值的。其次，由于
    `Ionos` 总部位于德国，我的数据受到德国 `GDPR` 严格数据保护法规的保护。这意味着 `Ionos` 有义务尊重我的隐私，不能简单地解密或进一步处理我的数据。如果发生违规行为，公司将被迫付出巨大的代价——代价大到我再也不必为此担心。


    这与 `Google`、`Amazon`、`Microsoft` 或 `Facebook` 等公司形成了鲜明对比，这些公司总部位于 `USA`，其数据保护标准要松得多。如果认为这些公司在想做的情况下无法解密加密数据，那是天真的。即使是最好的加密也不是不可破解的，而且随着计算能力的提高——关键词是量子计算——未来有一天可能破解即使是最稳健的加密方法。但这不仅是一个技术可行性的问题，还涉及到法律和伦理框架，而
    `USA` 的这些框架比 `EU` 要松散得多。


    这种考量导致了一个重要的发现：虽然云服务确实提供了益处，但我们应该始终意识到其风险和局限性。盲目信任在另一个大陆运营且其目标并不总是与我们价值观一致的大型
    `US` 巨头，总有一天会让我们付出沉痛代价。即使今天一切看起来运行顺畅，我们也必须问自己，我们是否真的准备好从长期放弃对数据的控制。


    这并不意味着我们应该完全避免云服务。它们为本地存储的数据提供了有意义的补充，如果使用得当，可以增加我们数字信息的安全性和可访问性。然而，关键在于以必要的谨慎态度使用正确的服务。这意味着在数据进入云端之前对其进行加密，并选择遵守
    `EU` 严格数据保护法的提供商。


    但我们不能忘记，数据保护是一个不断演变的动态领域。量子计算等技术有一天可能会破坏今天的最佳加密。因此，跟踪该领域的发展并相应调整我们的安全策略至关重要。虽然
    `Ionos` 目前代表了一个值得信赖的解决方案，但未来可能会发生变化——我们必须做好应对准备。


    总之，云服务确实提供了不可否认的益处。然而，选择正确的提供商并妥善管理我们的数据对于保持控制至关重要。如果我们意识到这种责任并采取相应行动，我们就可以利用云服务的同时而不牺牲我们的数字安全和隐私。


    ## 9. Ionos 德国云，HiDrive


    云服务无疑提供了多种优势，特别是在从任何地方访问数据和自动同步方面。然而，使用云服务带来的风险，尤其是使用 `Google`、`Amazon`、`Microsoft`
    和 `Facebook` 这样的大型提供商，不应被低估。

