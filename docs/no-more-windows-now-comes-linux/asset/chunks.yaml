    ![](image_rsrc1GW.jpg)


    No more Windows!


    Ralf-Peter Kleinert


    The book:


    I had my first computer experiences with MSDOS and the Commodore C64 using BASIC.
    Then I witnessed the birth of Windows in the Federal Republic of Germany, and
    my first Windows was Windows 3.1, which was still based on DOS. Windows 95 was
    also still a DOS-based system.


    Over the years, I''ve performed countless installations from Windows 3.1 to Windows
    11—often because I had crashed the operating system by tinkering under the hood.
    It has been a fantastic journey until today. But now, Windows and computers are
    no longer technical devices used only by nerds. Computers have grown into systems
    that shape the course of the world.


    Food production, healthcare, technological progress, and even warfare—without
    computers, our society is no longer viable. But this book will only touch on these
    topics briefly. First, I want to show individuals ways to keep their data as private
    as possible, even today. And Windows is becoming increasingly unsuitable when
    it comes to keeping your data in your own hands.


    I want to introduce you to an alternative to Windows that offers enormous advantages.
    For the sake of simplicity and a smooth transition from Windows to Linux, I have
    chosen to present the very popular and widely used Linux Mint, based on the highly
    stable Debian. The advantages are clear: This open-source system is developed
    by a community, not by a profit-oriented company. There are no hidden code parts
    that could be overlooked by the community. You have full control over your data,
    no mandatory accounts, excellent stability, and alternatives for every Windows
    software. The best part: Everything is free!


    Today, none of us know where the journey will ultimately lead, whether with Windows
    or Linux. However, in 2024, when it comes to data privacy, cost balance, and data
    sovereignty, there is no better alternative to Linux. Simply put, if you want
    your data to remain your own in 2024, Linux is the way to go. What will happen
    in the future? Let’s wait and see—it’s going to be exciting!


    The author:


    ![](image_rsrc1GX.jpg)


    Ralf-Peter Kleinert, born in January 1981 in Hennigsdorf near Berlin, a true GDR
    citizen. Since the Commodore C64 came out, I learned everything about computers
    that I could get my hands on.


    The beauty of it was that I got to witness the entire development—from the sluggish
    clunky machines to the powerhouse that sits under my desk today. A smartphone,
    for example, surpasses all the computers from back then. My knowledge of computers
    and the drive to learn led me deeper and deeper into the subject.


    Now, I’m blogging part of my knowledge on websites and writing this book. The
    programs improved, and the internet emerged. Today, I primarily use it as a Social
    Media Manager. As an IT and computer expert since Windows 95, I can look back
    on many years filled with "computer problems." I believe that it''s precisely
    because of the problems that computers cause that experts are able to grow in
    the first place.


    When social networking began in Web 2.0, all that learning suddenly had a deeper
    meaning. Sitting alone in a room was a thing of the past. Suddenly, computers
    were networked, and communication with people began, rather than just dealing
    with a stack of floppy disks. I barely knew if there were many like-minded individuals
    before. At first, only nerds met online, and they were sometimes ridiculed or
    mocked. Today, networking is normal because almost everyone is online.


    From 2010 to 2012, I completed my desired training as a media designer at Silicon
    Studio Berlin. Here, I was able to solidify and expand my knowledge. Since I also
    had experience in photography, I additionally completed an internship at "One
    I A Fotostudio." Photography is an important aspect of social media management
    and further deepened my skills in this area.


    My certifications include:


    IT Security - Protection for SMEs and Startups


    Network Technology, Network Security, and Wireshark


    Cybersecurity - Protection Against Hacker Attacks


    Linux Firewall with Fail2Ban Against Brute-Force Attacks


    The Complete SQL Masterclass


    Linux Administration and System Management


    Installing, Setting Up, and Using Nextcloud with Linux Ubuntu


    Microsoft Azure Administrator


    Microsoft 365 Security Administrator


    Microsoft 365 Identity and Services


    Industrial Cybersecurity 2024


    Ethical Hacking with Kali Linux


    Microsoft Active Directory Windows Server 2022


    Additional Training in:


    Computer Networks (CompTIA Network+)


    Computer Security (CompTIA Security+)


    No more Windows!


    Now comes Linux!


