    Click through the navigation and start with `Getting Started.`. The dialog is
    really self-explanatory, and I don’t think it requires much explanation from me.


    # 23. Welcome after Installation


    As long as the checkbox `Show this dialog at system startup` is checked in the
    welcome dialog, the screen will appear at every startup. For now, keep this setting
    enabled so you always have the most important information in view. Later, when
    Linux Mint has become second nature, you can turn it off.


    ## 23.1 First Task: Updates


    Scroll down in the welcome dialog under `First Steps` to `Update Manager` and
    click the green button `Start.`.


    ![](image_rsrc1HG.jpg)


    The `Update Manager` will open, and the window will clearly describe what this
    manager does. Read every dialog carefully. This way, you’ll always be one step
    ahead of my book. Click `Confirm.`:


    ![](image_rsrc1HH.jpg)


    After a fresh installation, the `Update Manager` will find a multitude of updates.
    Click the button `Install Updates` at the top.


    You can initially ignore the blue banner asking `Do you want to switch to a local
    mirror server?` A window will open informing you about the upcoming changes. Click
    `OK`:


    ![](image_rsrc1HJ.jpg)


    After you click `OK`, the system will ask for your password. Under Linux, not
    just anyone can install or uninstall software. Linux consistently protects important
    files, folders, settings, and processes with the system administrator’s password.


    This is part of the security concept. Enter your password, and Linux will begin
    installing the updates:


    ![](image_rsrc1HK.jpg)


    After entering the password, the packages will be downloaded:


    ![](image_rsrc1HM.jpg)


    It may take a while for all packages to be downloaded and installed. Allow the
    system to install the updates without interruption. After major updates following
    a new installation, you may be prompted to restart the system. Please do so:


    ![](image_rsrc1HN.jpg)


    To restart, close the `Update Manager` by clicking the `x` in the upper right
    corner of the window.


    Go to the `Start` button on the taskbar (similar to the Windows taskbar) and then
    click the red power button labeled `Shutdown.`. The `Session` window will open.
    Click on `Restart.`:


    ![](image_rsrc1HP.jpg)


    ## 23.2 Second Task: System Snapshots


    So, dear readers, we have now successfully installed Linux Mint together and used
    the `Update Manager` to apply the latest Linux updates. With the first steps completed
    and your system up-to-date, we come to one of the probably most important settings
    in Linux Mint: system snapshots.


    Before we delve into the details and go through the setup step-by-step, let me
    first explain why this feature is so important, how it will be valuable in your
    daily routine, and how it can help you avoid major problems before they even arise.


    A system snapshot, simply put, is a kind of image of your system’s current state.
    Imagine you have just installed Linux Mint, set up all your programs, and maybe
    even started editing some documents or sorting files. Everything is running smoothly,
    but what happens if a major update goes wrong, a program suddenly stabilizes the
    system, or you accidentally delete a critical system file? In such moments, it
    can quickly become frustrating, and often a reinstallation would be the last,
    but unfortunately necessary, option—unless you have taken precautions.


    This is where system snapshots come into play. With a snapshot, you can revert
    your system to an earlier, functional state at any time. This means that even
    after severe errors, you don’t have to start from scratch. The snapshot essentially
    freezes your computer in a perfect state, and if something goes wrong, you can
    easily return to that state. The special thing is that no personal files like
    photos, documents, or videos are lost. So, you protect the system without endangering
    your data.


    The idea behind system snapshots is not new, but in Linux Mint, it is particularly
    user-friendly. The tool you use for this is called `Timeshift.`. It works reliably
    in the background and allows you to create automated snapshots at regular intervals,
    whether daily, weekly, or monthly, according to your needs.


    In a world where many of us rely on computers and digital systems daily, it is
    reassuring to know that you have an emergency plan. Snapshots provide this kind
    of security. They make Linux Mint not only more stable and robust but also give
    you the freedom to experiment, try new programs, or make system adjustments without
    the fear that a wrong decision could ruin the entire system.


    We will now look at how to set up `Timeshift`, what options are available, and
    how to ensure that your system remains secure and functional. Whether you are
    an experienced user or a beginner, system snapshots are an indispensable tool
    that will save you many worries. Get ready to activate this important feature
    and make your Linux Mint system even more resilient and secure.


    ### 23.2.1 Setting Up Timeshift Snapshots


    You can either go to the Welcome screen → `First Steps` → `System Snapshots` and
    click the green `Start` button, or you can go to the `Start` button → `System
    Administration` → `Timeshift`, or you can click the `Start` button and type `time.`.
    All three options will lead you to the `Timeshift` program:


    ![](image_rsrc1HR.jpg)


    Start `Timeshift`. Since `Timeshift` makes deep changes to the system, it always
    requires administrator authentication. Enter your password:


    ![](image_rsrc1HS.jpg)


    After entering your password, the `Timeshift` setup wizard will open. Click on
    the small arrow to open the help section. It describes what `rsync` snapshots
    are. Read through it, then click `Next`:


    ![](image_rsrc1HT.jpg)


    The system will now check the expected snapshot size:


    ![](image_rsrc1HU.jpg)


    Next, the dialog will ask for the storage location. It must be a Linux file system
    to store the snapshots. These snapshots are exact copies of the file system and
    capture the state of your system at a point in time. For `Timeshift` to function
    properly and utilize all its features, the snapshots must be stored on a Linux-compatible
    file system. This is due to the specific requirements related to managing file
    ownership.


    File systems such as `NTFS` or `FAT`, primarily used by Windows, are not fully
    compatible with Linux when it comes to storing information needed on a Linux system.
    While these file systems support basic functions like storing files and folders,
    they cannot manage complex permissions.


    A central aspect of Linux is its permission and ownership system, which ensures
    that certain files can only be modified by specific users or system services.
    Each file and folder on a Linux system has assigned owner and group rights, as
    well as detailed permissions for reading, writing, and executing. These rights
    are crucial not only for security but also for the correct functioning of many
    programs and system processes.


    Therefore, `Timeshift` places great importance on accurately saving these rights
    in the snapshots as they exist on the source system. By storing the snapshots
    on a file system like `ext4`, which supports the same rights and ownership structures,
    `Timeshift` can precisely restore this information. This is critical to ensure
    that after a restoration, the system functions exactly as it did before.


    Thus, `Timeshift` needs to store its snapshots on a file system that supports
    the same functions as the source file system. In most cases, this will be the
    same file system on which Linux is installed—such as `ext4`.

