    打开终端。在底栏底部（Windows 任务栏），你会发现一个带有小美元符号的黑色图标，这就是终端的符号。点击后，将打开一个文本窗口。


    在文本窗口中，将显示登录用户名 @ 计算机名称（`username@pcname: ~$`），这意味着：系统上名为 username 的用户位于名为 pcname：


    ![](img/image_rsrc1JJ.jpg)


    如果你想获得 root 权限，输入 `sudo su`，终端会提示输入密码：


    ![](img/image_rsrc1JK.jpg)


    你现在已以 `root@pcname: /home/your-name#` 的身份登录，并拥有 shell 的绝对权限。使用正确的命令，你可以摧毁整个系统。因此请务必小心。最好关闭终端，打开
    Timeshift 创建一个快照，然后再回到终端！


    ![](img/image_rsrc1JM.jpg)


    现在我将向你展示一些重要的 shell 命令。别担心——你并不非要在 Linux Mint 中使用 shell；系统很大程度上可以通过图形用户界面 (GUI)
    进行管理。这意味着你可以通过点击来浏览大多数设置和操作，而无需查看 shell。但如果你需要某个命令，或者对 shell 能做什么好奇，那么你来对地方了。


    这段简短的介绍不会让你全面掌握 shell——那将是一个终身学习过程，因为它的可能性几乎是无限的。我可以做的是让你对 shell 有基本的了解，并介绍你在日常中使用可能会遇到的关键命令。


    shell 本质上是任何 Linux 系统的核心。命令直接在这里运行，无需经过精美图形界面的绕路。shell 是强大的、是直接的——但也意味着你应该知道自己在做什么。进入
    shell 感觉就像打开引擎盖并直接与引擎进行工作。但像任何引擎一样，你应该对你调整的内容和所在的位置保持小心。


    以下是一些实用的命令，可能会带给你一两个“恍然大悟”的时刻。尽管尝试 shell，但请记住：能力越大，责任越大！你可以实现很多事情，但在按下回车键之前，你应该始终确切知道自己在做什么。不必恐慌——只要用心谨慎，shell
    是一个极佳的工具，只会增强你的 Linux 体验。


    ### 28.1 文件系统


    shell 已经打开，你可以使用加粗的命令。在 Linux Mint 中导航文件系统，请使用以下命令：


    * `cd` (切换目录): 使用此命令，你可以更改当前目录。例如：`cd /home/username/Documents` 将你带到家目录下的 `Documents`
    目录。

    * `cd ..` 返回上一级目录。

    * `cd /home/username/Doc` 并按 `Tab`，如果 `/home/` 下存在 `Documents` 文件夹，将补全单词 `Documents`。

    * `ls` (列出): 此命令显示当前目录的内容。使用 `ls -l` 获取更详细的信息，或使用 `ls -a` 显示隐藏文件。

    * `pwd` (打印工作目录): 此命令显示当前目录的完整路径。


    ### 28.2 管理文件、目录


    * `cp` (复制): 此命令允许你复制文件和目录。例如：`cp file.txt /home/username/targetfolder/` 将文件 `file.txt`
    复制到目标文件夹。

    * `mv` (移动): 此命令移动或重命名文件和目录。例如：`mv oldFile.txt newFile.txt` 将文件 `oldFile.txt`
    重命名为 `newFile.txt`。

    * `rm` (删除): 此命令删除文件或目录。小心，被删除的文件不会移动到回收站。使用 `rm -r` 删除包含内容在内的目录。

    * `mkdir` (创建目录): 创建新目录。例如：`mkdir newFolder` 创建名为 `newFolder` 的目录。

    * `rmdir` (删除目录): 删除空目录。例如：`rmdir emptyFolder` 删除空目录 `emptyFolder`。

    * `cat` (合并): 显示文件内容。例如：`cat file.txt` 输出文件 `file.txt` 的全部内容。

    * `less`: 分页显示文件内容，允许你滚动查看内容。例如：`less file.txt` 允许滚动查看文件 `file.txt` 内容。

    * `head`: 显示文件的前几行。例如：`head -n 10 file.txt` 显示 `file.txt` 的前 10 行。

    * `tail`: 显示文件的最后几行。例如：`tail -n 10 file.txt` 显示 `file.txt` 的后 10 行。

    * `find`: 根据标准在文件系统中搜索文件和目录。例如：`find /home/username -name "*.txt"` 在 `/home/username/`
    目录下搜索所有 `.txt` 文件。

    * `grep`: 在文件中搜索特定的文本模式。例如：`grep searchTerm file.txt` 在文件 `file.txt` 中搜索 `searchTerm`。


    ### 28.3 文件权限、文件属性


    * `chmod` (更改模式): 更改文件或目录的权限。示例：`chmod 755 file.txt` 将 `file.txt` 的权限设置为 `rwxr-xr-x`。

    * `chown` (更改所有者): 更改文件或目录的所有者和所属组。示例：`chown username file.txt` 将 `file.txt` 的所有者改为
    `username`。

    * `stat`: 显示关于文件或目录的详细信息。示例：`stat file.txt` 输出关于该文件的详细信息。


    ### 28.4 文件系统检查


    * `fsck` (文件系统检查): 检查并修复文件系统错误。示例：`fsck` 的用法。

    * `e2fsck` (Ext2/3/4 文件系统检查): 此命令专门用于检查和修复 Ext2、Ext3 和 Ext4 文件系统。示例：`e2fsck -f
    /dev/sda`

    * `tune2fs` (调整 Ext2/4 文件系统): 虽然 `tune2fs` 主要用于调整文件系统参数，但你也可以用它调度某些检查和维护。示例：`sudo
    tune2fs -c 30 /dev/sda1`

    * `badblocks` (检查坏块): 此命令检查硬盘或分区是否存在坏块。它可以帮助识别可能损坏文件系统的硬件问题。示例：`badblocks -v`

    * `smartctl` (S.M.R.T 监控工具): 该工具用于监控和检查硬盘及 SSD 的状态。它利用 S.M.R.T 技术在问题发生前进行检测。示例：`smartctl
    -a /dev/`

    * `xfs_repair` (XFS 文件系统修复): 如果你在使用 XFS 文件系统，此命令用于检查和修复它。XFS 是一种常用于大型文件服务器的文件系统。示例：`sudo
    xfs_repair /dev/sda1`

    * `btrfs check` (Btrfs 文件系统检查): 对于 Btrfs 文件系统，`btrfs check` 命令用于验证和修复文件系统完整性。示例：`sudo
    btrfs check /dev/sda1`

    * `mount -o remount,ro` 和 `umount`: 在运行上述某些命令（特别是涉及直接文件系统修复的命令）之前，你应该将文件系统重新挂载为只读模式或卸载它，以避免潜在的数据丢失。示例：`sudo
    mount -o remount,ro /dev/sda1` 或 `sudo umount /dev/sda1`

