  trans: '

    1. 更新策略：虽然 Windows 更新经常在不方便的时间发生且有时会强制重启系统，但在 Linux Mint 中，你对更新拥有控制权。你可以决定何时以及安装哪些更新。


    2. 隐私：Linux Mint 尊重你的隐私。它没有像 Windows 10 和 11 那样的强制性遥测或数据收集。


    3. 稳定性：Linux Mint 以其稳定性闻名。它基于 Ubuntu 和 Debian 的稳定版本，并接收定期的安全和维护更新，以保持系统的可靠。


    4. 模块化：Linux Mint 是模块化的。这意味着你可以根据需要替换或添加单个组件，而无需重新安装整个系统。


    ## 我的简要结论：


    对于任何寻找用户友好、稳定且安全的 Windows 替代方案的人来说，Linux Mint 都是极佳的选择。凭借其多种桌面环境、高度的可定制性以及优于 Windows
    的众多优势，Linux Mint 为初学者和经验用户提供了一个强大且灵活的操作系统。如果你准备好尝试新事物并从 Linux Mint 的许多优势中受益，那么切换到这个
    Linux 发行版可能正适合你。我们现在一起应对这个问题，不是吗？


    ## 18. 迁移准备


    从 Windows 到 Linux 的迁移是一个大步骤，应该经过良好的计划和准备以确保顺利过渡。本章描述了你在迁移之前和期间应该的所有重要考虑和步骤。这些包括选择正确的发行版（正如我提到的，我将向你介绍
    Linux Mint）、备份数据、准备硬件以及熟悉新系统。


    ### 18.1 你需要什么


    1. 一个比电脑存储空间更大的移动硬盘——用于容纳**所有**数据和 Windows 镜像。确保硬盘状况良好。它在过程中不能发生故障。


    2. 云存储。如果你没有硬盘或硬盘容量不足，也可以使用云存储进行备份。你也可以刻录 DVD。重要的是拥有一个可靠的备份。


    3. Paragon Backup 17 CE。你可以从 Paragon 下载这个免费的备份工具。


    4. 用于 Paragon 救援环境的 USB 盘。我建议使用 `16GB` 的 U 盘。你需要这个 U 盘在发生故障时启动 Paragon 救援环境并创建
    Windows 备份。创建救援 盘后，我建议用永久标记笔对其进行标记。


    5. 用于 Linux 现场运行环境和 Linux 安装程序的第二个 USB 盘。我建议使用 `16GB` 的 U 盘。


    6. 硬件清单。进入控制面板、设备管理器并记录已安装的设备。如果你有一台相当现代的标准 PC 或笔记本电脑，Linux Mint 应该无问题地运行。但像往常一样，细节决定成败。你也可以截图并打印出来。重要的是你以后可以识别电脑中的组件。通常你不需要这个硬件列表——但如果你出于任何原因需要它，最好还是准备好。


    7. 软件清单。记录安装了哪些软件以及你使用了哪些软件。Office、Photoshop 等。在 Linux 中，几乎每个产品都有替代品。然而，特定的程序可能无法在
    Linux 上运行，你可能需要 `WINE`（Wine Is Not Emulator，Wine 不是模拟器）。你需要确切知道你使用哪些产品。


    8. 账户和登录。你需要所有的账户及其登录数据以便在 Linux 中使用。我建议：在你的 Windows 电脑上安装 Firefox 浏览器并创建一个 Firefox
    同步账户，在 Firefox 账户中开启双重身份验证。登录所有服务并将密码保存在 Firefox 中。或者，安装 `Keepass` 或 `KeepassXC`，将你所有的登录信息和账户存储在安全的密码库中。记住包括电子邮件账户、Facebook、Instagram、Twitter、Amazon、银行登录等。


    9. 时间和耐心。你需要时间和耐心。收集所有账户并将它们保存在 Firefox 或 `Keepass` 中。获取硬件和软件的概览。电脑上的数据越多，备份所需的时间就越长。先冷静地完成这一切并确保所有数据安全。只有这样你才能开始迁移本身。


    ### 18.2 数据备份


    在我们开始从 Windows 迁移到 Linux 之前，全面的数据备份至关重要。按照以下步骤操作：


    1. 外部硬盘或云端：将你的重要文件备份到外部硬盘或云端（如果你有一个只有你能访问的可靠存储解决方案）。这确保了在安装过程中发生错误时你的数据得到保护。


    2. 系统镜像：为你的 Windows 系统创建一个完整的系统映像。这允许你在需要时恢复到旧系统。我将在 Paragon 完整备份的章节中详细介绍这一点。这是下一章——因为在对系统进行任何更改之前，对系统驱动器进行完整备份是最工作。


    3. 应用数据：备份配置文件和应用程序数据，特别是当你使用需要迁移数据的特定软件时。


    ### 18.3 Windows 的备份和全备份


    由于对系统进行任何更改都可能发生错误，因此映像备份——系统全备份——是不可缺的。


    你需要一个硬盘或其他存储设备，其大小至少与安装 Windows 的系统驱动器一样大。如果你有一个额外的外部硬盘，其大小至少与电脑中所有包含数据的驱动器一样大则更好。


    我建议个人用户使用免费的 `Paragon Backup 17 CE`，因为它非常可靠，我已经用它进行了多次测试。全备份和映像备份效果非常好。在恢复电脑时我没有遇到过任何错误。我的网站上有一份指南和所有信息供免费下载：[`ralf-peter-kleinert.de/sicherheit-in-der-it/paragon-backup-kostenlos.html`](https://ralf-peter-kleinert.de/sicherheit-in-der-it/paragon-backup-kostenlos.html)


    ## 19. 下载 Linux Mint 和 Rufus


    为了启动 Linux Mint，你需要一个 USB 启动盘。你需要 Linux Mint ISO 镜像来创建启动盘，以及 Rufus 程序来从 ISO 镜像创建启动盘。


    1. 从制造商网站下载 `Linux Mint`：[`www.linuxmint.com/`](https://www.linuxmint.com/)。镜像大小约为
    `3 GB`，下载时间视情况而定。


    2. 从 [`rufus.ie/de/`](https://rufus.ie/de/) 下载 `Rufus`。你可以无需安装即可运行 Rufus。


    3. 准备一个 USB 盘（建议 `16 GB`）并确保它不包含任何重要数据。另外，确保不要使用 Paragon 救援盘。


    ### 19.1 创建 Linux Mint 启动盘


    我专门为这些说明说明下载了 Linux Mint 和 Rufus，格式化了一个 `32 GB` 的 U 盘，并将逐步向你演示整个过程。


