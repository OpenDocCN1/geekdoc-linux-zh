    同样无法保证该功能在实践中始终有效。如果小偷简单地断开笔记本电脑的网络连接，或者将其存放在没有网络的地方怎么办？那么 `Find My Device`（查找设备）功能就无能为力。在我看来，这更像是一个面子工程，微软将其作为一种酷炫的附加功能进行营销，而没有真正考虑实际情况。归根结底，它可能更多是一个装设，而不是真正的保护。


    微软到底想达到什么？他们真的认为你会通过他们的功能找到你的笔记本电脑吗？完全不是！他们真正想要的是让你去最近的商店买一台新的笔记本电脑——当然，还是带 `Windows`
    的——然后从 `OneDrive` 恢复你的数据。这样，他们就有充分的理由推销他们的云服务。


    现实是，`Find My Device` 功能往往只是空头支子。如果电脑被盗了，这有什么意义？没多久，小偷就会断开它的网络，要么将数据传输到另一个硬盘，要么直接按原样卖掉电脑。这个功能充其量顶只是一个给客户提供保护幻觉的占位符。


    微软非常清楚，在发生真实盗窃的情况下，笔记本电脑通常已经无法挽救。所以，客户别选择购买新的笔记本电脑并从 `OneDrive` 恢复数据——如果它备份在那里的话。否则，剩下的只有苦涩地意识到，`Find
    My Device` 功能终究不过是一场烟雾弹。真正的信息是：如果电脑丢了，它就真的丢了。


    ## 12.8 查看收集的数据


    如果你想获得关于 `Windows 11` 收集数据的详细报告，实际上有一个内置工具。只需进入 `Settings > Privacy and Security
    > Diagnostics and Feedback`（设置 > 隐私与安全 > 诊断与反馈），开启查看诊断数据的选项。这将启用让你获取系统收集的数据全面概述的功能。


    一旦你启用此选项，系统可能会提示你访问 `Microsoft Store`（微软商店）下载并安装 `Diagnostic Data Viewer`（诊断数据查看器）应用。该应用需要你的设备上约约
    1GB 的可用存储空间。安装后，你可以打开该应用并访问 `Windows 11` 关于你的使用收集的所有遥测数据和信息。


    在 `Diagnostic Data Viewer` 应用中，你可以浏览收集的数据，详细查看从你的系统传输到 `Microsoft` 的哪些信息。该应用不仅提供了数据的概述，还显示了哪些应用程序向
    `Microsoft` 发送的数据最多。如果你想了解使用监控的范围和细节，这会非常有洞见性。它让你对数据收集有更深入的了解，并让你更好地理解系统使用的哪些方面包含在遥测中。


    ## 13. 噢天，现在怎么办？


    噢老天，现在就是这样！是的，亲爱的读者，现在你大概知道发生了什么了。即使是我这个每天处理这些话题的人，也无法想象哪些数据在何时、以何种方式以及为什么流向了
    `Microsoft`。当我回起在 `Windows` 还被认为是一个革命性系统时这一切是如何开始的，真的令人印象深刻！你可以真切地感受到进步和创新。但今天呢？微软已经变成了一个贪婪、逐利的数据章鱼，这太令人恐惧了。


    让我们停一下考虑一下现实：当你打开电脑时到底发生了什么？操作系统会立即开始收集数据——没有任何声张。这不仅仅是小的信息交换，而是一场流向 `Microsoft`
    的数据洪水。你可以确定，你的系统会不断记录关于你的使用情况、偏好，甚至你与各种应用程序和网站交互的信息。所有这些都被收集在一个巨大的数据宝库中，微软急于利用它们来优化其服务、投放定向广告或进一步开发其软件。


    现在你可能在想我为什么告诉你这些。我必须在这里那里进行一些详细说明，是为了给你一个全面的画面。但如果你不理解我为什么甚至在考虑它，我又怎么能严肃地建议一个像
    `Linux` 这样的替代操作系统呢？现实是，微软无休止的数据收集和分析变得越来越具有侵略性。你对它的了解越多，就越清楚地看到为什么越来越多的人转向那些不关注数据收集的替代系统。


    `Linux` 是一个很有前景的替代方案。它初看之下可能更复杂，但它对你的隐私提供了大得多的控制。通过 `Linux`，你决定哪些数据被发送，哪些不发送。你不再受控于一家将你的数据作为货币的商业公司。这并不意味着
    `Linux` 是完美的，或者没有它它自己的挑战，但它赋予了你按照自己的标准保护数据的自由。


    所以，下一次你打开 `Windows` 电脑并好奇所有数据都去了哪里时，考虑一下你对自己的系统和数据想要的控制权。也许是时候认真考虑替代方案，并思考你是否更愿意向更多的隐私和独立迈出一步了。


    现在我们已经到达了关于 `Windows`、云以及其他科技巨头的所有负面面的终点。如果这还不能让你开眼界，我不知道还有什么可以了。我们已经彻底探讨了由于大公司无休止的数据饥渴而产生的问题和担忧。这些点应该足以让你清晰地看到整件事已经变得多么具有侵略性且不透明。所以，现在尽得开心吧。


    ## 14. 什么是 Linux


    想象这样一个世界：你对自己的操作系统拥有控制权，而不会不断感到被监控或被剥削。自由、隐私和适应性处于领先地位。欢迎来到 `Linux` 的世界。但 `Linux`
    到底是什么，它是如何演变成今天这样的呢？让我们回顾一下 `Linux` 的历史和特征。


    `Linux` 的历史始于对自由和开放的愿景。1991 年，当互联网处于婴儿阶段且 `Windows` 刚刚开始兴起时，一位芬兰年轻人 `Linus Torvalds`
    开始了工作。Torvalds 是赫尔辛基大学的一名计算机科学学生，他想创建一个基于开放和协作原则的操作系统。他的目标是开发一个人人都能使用的、不受传统软件模式限制的免费操作系统。


    Torvalds 开始开发一个新的 `kernel`（内核），这是操作系统的核心组件。这个被命名为 `Linux` 的内核旨在为当时流行的商业操作系统 `Windows`
    和 `Unix` 提供替代方案。`Linux` 的名字来源于创建者 `Linus Torvalds` 以及它是一个 `Unix` 系统的事实。内核根据 `GNU
    General Public License` 发布，允许任何人使用、修改和分发代码。


    这个小项目很快发展成了一场全球运动。`Linux` 吸引了开发人员和技术人员的关注，他们希望将该系统作为自己项目的基础。开源哲学实现了协作开发，全球成千上万的程序员都在该项目做出贡献。


    在随后的几年中出现了越来越多的 `Linux distributions`（Linux 发行版）——根据不同的需求和偏好定制的各个。`Ubuntu`、`Fedora`
    和 `Debian` 等发行版变得流行，并帮助 `Linux` 被普通大众更容易接触。

