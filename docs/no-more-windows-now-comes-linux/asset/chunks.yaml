- fmt: "\n![](image_rsrc1GW.jpg)\n\n# No more Windows!\n\nRalf-Peter Kleinert\n\n\
    ## The book:\n\nI had my first computer experiences with `MSDOS` and the `Commodore\
    \ C64` using `BASIC`. Then I witnessed the birth of `Windows` in the Federal Republic\
    \ of Germany, and my first `Windows` was `Windows 3.1`, which was still based\
    \ on `DOS`. `Windows 95` was also still a `DOS`-based system.\n\nOver the years,\
    \ I've performed countless installations from `Windows 3.1` to `Windows 11`—often\
    \ because I had crashed the operating system by tinkering under the hood. It has\
    \ been a fantastic journey until today. But now, `Windows` and computers are no\
    \ longer technical devices used only by nerds. Computers have grown into systems\
    \ that shape the course of the world.\n\nFood production, healthcare, technological\
    \ progress, and even warfare—without computers, our society is no longer viable.\
    \ But this book will only touch on these topics briefly. First, I want to show\
    \ individuals ways to keep their data as private as possible, even today. And\
    \ `Windows` is becoming increasingly unsuitable when it comes to keeping your\
    \ data in your own hands.\n\nI want to introduce you to an alternative to `Windows`\
    \ that offers enormous advantages. For the sake of simplicity and a smooth transition\
    \ from `Windows` to `Linux`, I have chosen to present the very popular and widely\
    \ used `Linux Mint`, based on the highly stable `Debian`. The advantages are clear:\
    \ This open-source system is developed by a community, not by a profit-oriented\
    \ company. There are no hidden code parts that could be overlooked by the community.\
    \ You have full control over your data, no mandatory accounts, excellent stability,\
    \ and alternatives for every `Windows` software. The best part: Everything is\
    \ free!\n\nToday, none of us know where the journey will ultimately lead, whether\
    \ with `Windows` or `Linux`. However, in 2024, when it comes to data privacy,\
    \ cost balance, and data sovereignty, there is no better alternative to `Linux`.\
    \ Simply put, if you want your data to remain your own in 2024, `Linux` is the\
    \ way to go. What will happen in the future? Let’s wait and see—it’s going to\
    \ be exciting!\n\n## The author:\n\n![](image_rsrc1GX.jpg)\n\nRalf-Peter Kleinert,\
    \ born in January 1981 in Hennigsdorf near Berlin, a true GDR citizen. Since the\
    \ `Commodore C64` came out, I learned everything about computers that I could\
    \ get my hands on.\n\nThe beauty of it was that I got to witness the entire development—from\
    \ the sluggish clunky machines to the powerhouse that sits under my desk today.\
    \ A smartphone, for example, surpasses all the computers from back then. My knowledge\
    \ of computers and the drive to learn led me deeper and deeper into the subject.\n\
    \nNow, I’m blogging part of my knowledge on websites and writing this book. The\
    \ programs improved, and the internet emerged. Today, I primarily use it as a\
    \ Social Media Manager. As an IT and computer expert since `Windows 95`, I can\
    \ look back on many years filled with \"computer problems.\" I believe that it's\
    \ precisely because of the problems that computers cause that experts are able\
    \ to grow in the first place.\n\nWhen social networking began in `Web 2.0`, all\
    \ that learning suddenly had a deeper meaning. Sitting alone in a room was a thing\
    \ of the past. Suddenly, computers were networked, and communication with people\
    \ began, rather than just dealing with a stack of floppy disks. I barely knew\
    \ if there were many like-minded individuals before. At first, only nerds met\
    \ online, and they were sometimes ridiculed or mocked. Today, networking is normal\
    \ because almost everyone is online.\n\nFrom 2010 to 2012, I completed my desired\
    \ training as a media designer at `Silicon Studio Berlin`. Here, I was able to\
    \ solidify and expand my knowledge. Since I also had experience in photography,\
    \ I additionally completed an internship at \"One I A Fotostudio.\" Photography\
    \ is an important aspect of social media management and further deepened my skills\
    \ in this area.\n\n### My certifications include:\n\n- IT Security - Protection\
    \ for SMEs and Startups\n- Network Technology, Network Security, and `Wireshark`\n\
    - Cybersecurity - Protection Against Hacker Attacks\n- `Linux Firewall` with `Fail2Ban`\
    \ Against Brute-Force Attacks\n- The Complete SQL Masterclass\n- `Linux Administration`\
    \ and System Management\n- Installing, Setting Up, and Using `Nextcloud` with\
    \ `Linux Ubuntu`\n- `Microsoft Azure Administrator`\n- `Microsoft 365 Security\
    \ Administrator`\n- `Microsoft 365 Identity and Services`\n- Industrial Cybersecurity\
    \ 2024\n- Ethical Hacking with `Kali Linux`\n- `Microsoft Active Directory Windows\
    \ Server 2022`\n\n### Additional Training in:\n\n- Computer Networks (`CompTIA\
    \ Network+`)\n- Computer Security (`CompTIA Security+`)\n\n# No more Windows!\n\
    # Now comes Linux!\n\nby Ralf-Peter Kleinert\n\nEdition 2 - 2024 \n© 2024 All\
    \ rights reserved.\n\nPaperback\nKDP-ISBN: 979-8336059748\nFont: Vollkorn\nCover:\
    \ Ralf-Peter Kleinert / `Adobe Photoshop`\n\nAll trademarks and product names\
    \ are trademarks of their respective owners.\n\nralf-peter-kleinert.de\n[kontakt@ralf-peter-kleinert.de](mailto:kontakt@ralf-peter-kleinert.de)\n\
    \n## Table of contents\n\n1. [Introduction](#part0007.xhtml)\n2. [Why switch from\
    \ Windows to Linux?](#part0008.xhtml)\n3. [Worldwide IT Outage on July 19, 2024](#part0008.xhtml_a1EZ)\n\
    4. [Do I want to disclose my data?](#part0008.xhtml_a1DV)\n5. [Internet Problems](#part0008.xhtml_a1DA)\n\
    6. [Risks of the Cloud](#part0008.xhtml_a1D)\n7. [Energy Consumption](#part0008.xhtml_a1FG)\n\
    8. [Advantages of Cloud](#part0008.xhtml_a1FH)\n9. [IonDrive](#part0008.xhtml_a1EZ)\n\
    10. [End of Cloud](#part0008.xhtml_a1FS)\n11. [Windows’s Data](#part0008.xhtml_a1FT)\n\
    12. [What does Windows?](#part0008.xhtml_a1)\n    - 12.1 [Browser](#part0008.xhtml_a1EV)\n\
    \    - 12.2 [Inputs](#part0008.xhtml_a1DX)\n    - 12.3 [Product and Services](#part0008.xhtml_a1FU)\n\
    \    - 12.4 [Use of Products](#part0008.xhtml_a1EU)\n    - 12.5 [Installed Programs](#part0008.xhtml_a1ED)\n\
    \    - 12.6 [Location](#part0008.xhtml_a1DR)\n    - 12.7 [Find](#part0008.xhtml_a1DB)\n\
    \    - 12.8 [Collected Data](#part0008.xhtml_a1FZ)\n13. [Oh man, and now?](#part0008.xhtml_a1DC)\n\
    14. [What is Linux?](#part0008.xhtml_a1)\n    - 14.1 [Distribution](#part0008.xhtml_a1F)\n\
    \    - 14.2 [Friendliness](#part0008.xhtml_a1FY)\n    - 14.3 [Hardware](#part0008.xhtml_a1G0)\n\
    15. [Can Linux Do Windows?](#part0008.xhtml_a1)\n    - 15.1 [Penetration](#part0008.xhtml_a1EH)\n\
    16. [Thank You So Far](#part0008.xhtml_a1F)\n17. [Switching from Windows to Linux\
    \ Mint](#part0008.xhtml_a1DU)\n    - 17.1 [What is Linux Mint?](#part0008.xhtml_a1EX)\n\
    18. [Preparation for the Transition](#part0008.xhtml_a1EJ)\n    - 18.1 [What You\
    \ Need](#part0008.xhtml_a12)\n    - 18.2 [Backup](#part0008.xhtml_a1FJ)\n    -\
    \ 18.3 [Full Backup of Windows](#part0008.xhtml_a1EA)\n19. [Download Linux Mint\
    \ and Rufus](#part0008.xhtml_a1FK)\n    - 19.1 [Creating a Linux Mint Boot Stick](#part0008.xhtml_a1ER)\n\
    \    - 19.2 [Starting Linux as a Live System](#part0008.xhtml_a1FN)\n    - 19.3\
    \ [Preparing the Hardware](#part0008.xhtml_a1G4)\n20. [My Recommendation Live\
    \ Mode](#part0008.xhtml_a1F)\n21. [End of Basic Preparations](#part0008.xhtml_a1FW)\n\
    22. [Installing Linux Mint](#part0008.xhtml_a1)\n    - 22.1 [Performing a Complete\
    \ Installation](#part0008.xhtml_a1D)\n23. [Welcome after Installation](#part0008.xhtml_a1R)\n\
    \    - 23.1 [First Task: Updates](#part0008.xhtml_a15)\n    - 23.2 [Second Task:\
    \ System Snapshots](#part0008.xhtml_a19)\n    - 23.2.1 [Setting Up Timeshift Snapshots](#part0008.xhtml_a1D2)\n\
    \    - 23.2.2 [Summary of Snapshots](#part0010.xhtml_a14)\n    - 23.3 [Third Task:\
    \ Driver Management](#part0010.xhtml_a1F)\n    - 23.4 [Fourth Task](#part0010.xhtml_a1Y)\n\
    \    - 23.5 [Fifth Task: Application Management](#part0010.xhtml_a13)\n    - 23.5.1\
    \ [WINE Wine Is Not an Emulator](#part0010.xhtml_a1EW)\n    - 23.5.2 [Windows\
    \ on Linux VirtualBox VMWare](#part0010.xhtml_a17)\n    - 23.6 [Summary Welcome\
