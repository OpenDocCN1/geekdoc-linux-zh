  trans: '

    我个人一直开启这些选项。这让我能够直接从桌面访问我的个人文件夹或垃圾箱等重要功能和位置。因此，你可以自定义哪些图标和文件夹对你来说是最可见且易于访问的。


    这些自定义选项允许你设计出一个既美观又实用的桌面。只需点击几次，你就可以根据自己的需求和偏好个性化你的桌面环境。


    尝试一下吧，让你的桌面变成一个既漂亮又实用的地方！我是这样设置我的桌面的，我觉得它非常棒。


    ![](img/image_rsrc1J9.jpg)


    ## 24. 数据备份工具


    在我放心地让你开始使用全新的 Linux Mint 之前——就像向 20 只鸡撒谷子一样——我们需要先设置数据备份。这和你目前为止为止的所有操作都一样简单。


    只需进入“开始”菜单并输入 »数据`。这将直接带你进入可用的数据备份选项。然后选择“数据备份”工具。这将让你有机会保护你的宝贵数据，并确保在发生意外问题时可以快速恢复所有内容。


    设置数据备份是一个快速且直接的过程。你可以决定是否要安排定期备份、备份哪些文件夹或文件，以及将备份存储在何处。Linux Mint 让你轻松设置一个能够定期保护你数据的备份系统，而无需你不断记住它。


    进入“开始”菜单并输入 »数据`。然后选择“数据备份”工具：


    ![](img/image_rsrc1JA.jpg)


    会弹出一个对话框；点击“个人数据”下的 »立即备份«：


    ![](img/image_rsrc1JB.jpg)


    现在，你可以让备份直接在 `Backups` 文件夹中创建，或者选择不同的文件夹。为了说明，我将它保持这样：


    ![](img/image_rsrc1JC.jpg)


    备份本身会被排除在备份之外：


    ![](img/image_rsrc1JD.jpg)


    在下一个窗口中，选择应该备份的文件夹。通常，这是 »个人文件夹«，它包含了你的文档、图片或视频。点击«包含目录》。最好的方法是从勾选所有文件夹开始：


    ![](img/image_rsrc1JE.jpg)


    然后点击«包含文件》。选择所有文件并点击底部的“打开”：


    ![](img/image_rsrc1JF.jpg)


    点击“应用”，第一个备份将被创建。它会非常快，因为系统还是新的：


    ![](img/image_rsrc1JG.jpg)


    这是一个非常、非常简单的备份工具。我推荐另一个可以按计划执行自动备份、带有加密和密码保护，并且通过互联网备份到云端的工具。当然，它是免费的。不过，对于入门来说，这个工具并不。。它能备份数据。


    ## 25. 更好的备份系统 DejaDup


    首先，进入应用程序管理器，你可以通过“开始菜单”访问它。只需点击“开始菜单”，然后选择“应用程序管理器”。这会打开管理软件的中心程序。在应用程序管理器的顶部搜索框中输入“DejaDup”。这个强大的备份工具将立即显示。


    ![](img/image_rsrc1JH.jpg)


    点击“DejaDup”进入安装页面。在这里，你会看到“安装”按钮。点击它将在你的系统上安装该程序。安装过程通常快速且直接，你很快就能运行。一旦安装过程完成，只需按“启动”即可打开
    DejaDup。


    DejaDup 是一个直观且用户友好的备份工具，提供了多种功能。它允许你对文件和文件夹进行定期备份，而无需不断管理它们。界面组织良好，可以方便访问所有必要的功能。


    当你第一次启动 DejaDup 时，将引导你通过一个简单的设置向导。你可以选择要备份的文件和文件夹，并指定备份位置。DejaDup 支持各种存储目标，如本地驱动器、网络共享，甚至是
    Google Drive 等云服务。


    DejaDup 的一个主要优势是其调度的灵活性。你可以根据需要设置备份周期——无论是每天、每周还是每月。此外，该程序允许增量备份，仅保存自上次备份以来的更改。这节省了空间并加快了备份过程。


    DejaDup 的另一个亮点是它直观的恢复功能。如果发生错误或丢失数据，你可以快速轻松地恢复已备份的数据。这提供了一种额外的安全保障，让你知道在出现问题时，你的重要数据始终可用。


    通过 DejaDup，你拥有了一个强大的工具可以可以使用，它可以帮助你可靠地备份数据，并在紧急情况下快速恢复。它易于使用，并为自定义你的备份策略提供了许多选项。如果你正在寻找一个更好的备份系统来管理数据，DejaDup
    绝对是一个极佳的选择。


    尝试一下，体验保持数据安全是多么简单！


    ## 26. 可能需要的程序


    我想向你介绍几个我认为是预装应用程序更佳替代方案的程序。当然，预装程序已经很好地处理了基本功能但有时切换到更专业或更强大的软件可能会让你从系统中获得更多产出。


    所以，让我们来看看这些微小但な建议，它们可以帮助你提高生产力或增强用户体验。这些程序不仅具有功能性，而且通常提供了预装应用程序并不总是具备的额外功能。


    无论是更好的图像编辑工具、高级文本处理，还是让你的日常任务变得更简单的专用应用程序，我坚信你会在列表中发现一些真正的宝贝。它们不仅易于安装，而且完美契合你的环境。


    当然，需要强调的是，预装程序通常是稳固且可靠的。它们集成良好，并提供了对基本功能的快速访问。然而，一旦你发现了推荐程序的额外性能提升和高级功能，你可能会发现它们提供了标准应用程序可能无法一直提供的益处。


    以下是我的建议，帮助你更高效、更个性化地使用你的 Linux Mint 系统。安装这些程序非常简单，它们会无缝地集成到你的环境之中。


    ### 26.1 数据备份 DejaDup


    Linux Mint 附带了一个基础备份工具，该工具对于初始数据备份非常有用。它提供了备份和偶尔恢复文件的简单选项。然而，当涉及到更全面的功能和更强大的备份解决方案时，我强烈建议考虑
    DejaDup。


    DejaDup 在几个关键方面超越了标准备份工具。DejaDup 最大的优势之一是能够设置自动计划备份。这意味着你可以精确地设置备份间隔——无论是每天、每周还是每月。这种自动化处理确保了你的数据被定期备份，而无需人工干预。


    此外，DejaDup 提供了大量的加密选项，在备份过程中保护你的数据。如果你正在备份敏感信息并希望确保只有你或授权人员可以访问这些数据，这一点尤尤为重要。


    DejaDup 的另一个卓越特性是它支持各种备份目标。除了本地存储外，你还可以将备份保存到 FTP 服务器或云端。这意味着你可以灵活且安全地将数据存储在不同的位置——无论是外部硬盘、网络文件夹还是像
    Google Drive 这样的云服务。

