- fmt: '

    Especially important: If you want to unmount a filesystem to check or repair it,
    you must ensure that no critical processes are running on it. Imagine unmounting
    a partition where your database server, like `MySQL`, is running. Boom, everything
    crashes, and suddenly you’re left wondering why your entire system isn’t working
    anymore. You need to ensure that you either properly shut down the affected service
    beforehand or remount the filesystem in read-only mode before doing anything with
    it.


    A good example of this is the `umount` command. You use it to safely remove partitions
    from the system so they can be checked or repaired. But be warned: If you accidentally
    unmount the main drive where critical system services or programs are running,
    it could have severe consequences. That’s why you should always double-check which
    partition you’re working on and ensure no active applications are accessing it.


    If you want to check or repair the filesystem, the `fsck` command can help. This
    command checks and repairs inconsistent filesystems. But again, caution is needed.
    Only run this command on an unmounted or read-only mounted filesystem. Never work
    with a running, writable filesystem. Imagine writing something to the hard drive
    during the process – chaos is bound to ensue. An example would be the command
    `sudo fsck /dev/sda1`, which ensures that the partition `/dev/sda1` is checked
    for errors.


    Another important tool is `badblocks`. This command checks whether your hard drive
    has defective blocks – areas that can no longer be properly written or read. It’s
    a good test to detect hardware problems early. But again, be careful. If you have
    a large hard drive, this command can run for a long time. So don’t use it on a
    disk that is actively being used, as it could lead to data loss.


    And what about S.M.A.R.T.? This built-in self-test, which you can start with the
    `smartctl` command, helps you monitor the health of your hard drives. Again, this
    test is safer than others, but if your drive already has bad blocks, excessive
    use could worsen the situation. Always have backups ready and plan to replace
    the hard drive if problems arise.


    The `tune2fs` tool can also be useful for automating filesystem maintenance. With
    it, you can specify after how many system boots the filesystem is automatically
    checked. But again, be careful not to make settings that could cause issues during
    runtime.


    For specialized filesystems like `XFS`, there is the `xfs_repair` command. `XFS`
    is a filesystem specifically designed for large data volumes and high performance.
    Use this command only if you are certain that the `XFS` filesystem is damaged,
    and don’t forget: backup first, check afterward.


    Last but not least: For `Btrfs` filesystems, there is the `btrfs check` command.
    `Btrfs` is a modern filesystem that offers many cool features like snapshots and
    compression. Again, the same rule applies: Only perform checks on an unused filesystem,
    and be very careful during repairs – one wrong step can easily lead to data loss.


    Remember: As powerful as the shell is, it can be just as dangerous if you’re not
    careful. Always work thoughtfully and only execute commands that you are absolutely
    certain about. It’s better to double-check something than to mistype a command
    and ruin the system.


    Even if you enter a command and don’t immediately wreck the system, it’s quite
    possible that your computer will become unusable for a while. Some commands, especially
    those that access the hard drive or filesystem, can consume so many resources
    that the PC or server is fully occupied. The mouse might start lagging, programs
    might stop responding, and in the worst case, it may seem like the whole computer
    has frozen. This doesn’t happen because you broke something, but because the command
    you executed is demanding the full attention of the hardware.


    Take the `dd` command as an example, which is often used to copy data from one
    place to another – be it an entire drive or a partition. This command works with
    raw data and has a tendency to fully occupy the hard drives. So if you have a
    `dd` command running that, for example, copies a large file from one drive to
    another, the drive may be so heavily utilized that nothing else runs. The system
    isn’t broken, but it’s crippled as long as the operation is running.


    The same goes for commands like `fsck` or `badblocks`. Depending on the size of
    the drive and the amount of data to be checked, these can run for hours. Especially
    if you run these commands on a system that is in use, it can render the computer
    nearly unusable because the hard drive is fully occupied with the check.


    And here’s the crux: Linux is incredibly powerful and flexible, but that power
    must be used with caution. Many commands seem harmless but can have significant
    effects if not used correctly. I couldn’t possibly list all the Linux commands
    that exist – such a book would have thousands of pages, and you’d probably give
    up halfway through. But it’s important to develop a basic understanding that even
    the most seemingly insignificant command, when it accesses the filesystem or the
    resources of your computer, should be carefully considered.


    Because remember: Every command you enter is like a tool. In the right hands,
    it can bring about wonderful improvements, but in the wrong or careless hands,
    it can cripple or, in the worst case, destroy your system. So always be cautious,
    especially when using root privileges. It may feel empowering, but it’s also a
    bit like a double-edged sword – you have full control, but also full responsibility.


    ### 28.5 System Information and Management


    `df` (Disk Free): This command shows the free and used space on your hard drives.
    Use `df -h` for a human-readable output.


    `du` (Disk Usage): With this command, you can display the size of files and directories.
    For example, `du -sh /home/username` shows the total size of the home directory.


    `top`: This command provides a real-time view of system resource usage and currently
    running processes. It is useful for monitoring system performance.


    ### 28.6 Software Management


    `apt-get`: This command is used to install, remove, or update packages. For example,
    `sudo apt-get update` updates the list of available packages, and `sudo apt-get
    install package_name` installs a new package. If you are logged in as `sudo su`
    (root), you can omit `sudo` before the commands.


    `dpkg`: With this command, you can directly manage Debian packages. For example,
    `sudo dpkg -i package.deb` installs a `.deb` package.


    ### 28.7 User Management


    `adduser`: This command adds a new user to the system. For example, `sudo adduser
    newUser` creates a new user account.


    `usermod`: With this command, you can modify the properties of an existing user.
    For example, `sudo usermod -aG sudo username` adds the user to the `sudo` group,
    giving that user root privileges.


    ### 28.8 System Monitoring and Control


    `reboot`: This command restarts the system. It is often used after making changes
    that require a reboot.


    `shutdown`: With this command, you can shut down the system. For example, `sudo
    shutdown -h now` shuts the system down immediately.


    ### 28.9 Custom Shell Commands


    Here, you can jot down shell commands that you personally need and find particularly
    important. I have generously allocated six pages for this, providing ample space.
    For someone just diving into the world of Linux, this should be more than enough
    room to record key commands and personal notes.


    However, if you belong to the hardcore and power users who maintain an extensive
    collection of commands and notes, these six pages may not suffice. In that case,
    I recommend having additional note material at hand to document your further remarks
    and specific commands.

