    ### 26.2 音乐播放器 Clementine


    Linux Mint 默认带有 Rhythmbox 音乐播放器，它可以可靠地播放您的音乐，还提供了流媒体播放的可能性。Rhythmbox 对许多用户来说是一个可靠的选择，因为它提供了良好的基础功能，并无缝集成到
    Linux Mint 环境中。然而，长期以来我一直在寻找一种不仅能播放音乐还能满足我特定要求的音乐播放器。


