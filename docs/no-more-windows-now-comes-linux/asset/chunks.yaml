    # Product and service performance


    At first glance, this sounds harmless, almost useful. These telemetry data are
    supposed to monitor the state of your device, the operating system, as well as
    apps and drivers. Although it is claimed that this data is only pseudonymized,
    let’s be honest: even pseudonymized data can reveal more about you than you might
    like. What sounds so innocent here are actually details about how quickly `Cortana`
    responds to your voice commands or how long facial recognition takes to complete
    its calculations.


    This data is not only used to improve services but also to provide you with so-called
    »customized experiences.« For example, this could mean receiving recommendations
    for setting changes to optimize battery life or being suggested a cloud storage
    provider when your device’s storage is running low. But just because the data
    currently seems relatively harmless doesn’t mean it will remain so in the future.
    Who knows what surprises technology has in store for us? Perhaps your face is
    particularly well-suited for facial recognition – and that could become problematic
    in the wrong hands.


    If you feel that this form of monitoring goes too far, there are ways to disable
    it. Navigate to `Settings > Privacy and Security > Diagnostics and Feedback`.
    Turn off both »Send optional diagnostic data« and »Improve user experience.« This
    will at least stop some of this data flood.


    But as always, the question remains: How much control do we really have over this
    data, and how much are we willingly giving up without fully understanding the
    potential consequences? It’s worth thinking about before we simply continue our
    digital habits.


    ## 12.4 Use of Products and Services


    The use of products and services in Windows 11 is another chapter in the story
    of data collection. What stands out here is the partially anonymized data that
    Microsoft collects. This information includes, among other things, which apps
    you use and which applications are active when certain errors occur. It also tracks
    whether you have disabled certain help and suggestion features in Windows, all
    with the aim of improving the system’s accuracy and user-friendliness.


    What really bothers me is the way this data is used for »customized experiences.«
    For example, Windows might suggest that you enable certain settings that you have
    deliberately turned off – possibly for privacy reasons. It not only monitors your
    current usage but also how you interact with the operating system settings. This
    data may then be used to suggest alternative Microsoft or third-party applications
    based on the programs you use most frequently.


    If you do not want to accept this form of monitoring – and you should seriously
    consider it – there is a way to disable data collection. Go to `Settings > Privacy
    and Security > Diagnostics and Feedback` and turn off both »Send optional diagnostic
    data« and »Improve user experience.« This will at least reduce the amount of data
    collected about your usage behavior.


    But the question remains: How much of this monitoring is truly necessary, and
    how much is simply superfluous? Do we really need to reveal our preferences and
    dislikes just so the operating system can offer suggestions that we may not even
    want? It’s worth questioning this and adjusting your digital habits accordingly
    to avoid giving up unnecessary control.


    ## 12.5 Your Installed Programs and Software


    Another area where Windows 11 diligently collects data is regarding the apps you
    run on your system, the anti-malware programs and services installed on your computer,
    as well as driver updates and the schedule for Windows updates. Microsoft is also
    interested in when downloads start and finish, and which apps from the `Microsoft
    Store` are installed and might need updating. This information is collected not
    only to ensure the smooth operation of your system but also to provide you with
    tailored recommendations – such as alternative apps you might like.


    Now, the question I ask myself is: Does it really have to be this way? This type
    of monitoring may seem harmless at first glance, but in reality, it gives Microsoft
    deep insights into your usage behavior. It’s like having a constant companion
    who notes everything you do on your computer. Certainly, some of this information
    could theoretically help your system operate more efficiently – but at the cost
    of your privacy?


    If you find this type of data collection too intrusive, you have the option to
    at least stop it. To do this, go to `Settings > Privacy and Security > Diagnostics
    and Feedback` and turn off both »Send optional diagnostic data« and »Improve user
    experience.« This will at least curb some of the unnecessary data collection and
    give you back a bit of control over your own data.


    But the real question remains: How much of this »tailored experience« is truly
    necessary? Do we really need to allow every little thing we do on our computer
    to be monitored and analyzed? It is up to us to find the balance between functionality
    and privacy – and to not relinquish unnecessary control to large tech corporations.


    ## 12.6 Your Location


    Windows 11 also collects location data, supposedly to enable features like »Find
    My Device,« improve the relevance of search results, and provide you with more
    relevant weather and local information. These location data can even be used by
    third-party apps if you grant them permission. But seriously: What business does
    Microsoft have tracking where I’m roaming?


    It’s astonishing that an operating system thinks it’s perfectly fine to constantly
    track my location in the background to supposedly make my life easier. Do they
    really believe that I need weather updates or local news every time I open my
    laptop? What truly leaves me speechless is the sheer audacity with which this
    data can be used not only by the system itself but also by third parties. The
    question arises: Where does the collection of useful information end, and where
    does the abuse of privacy begin?


    Fortunately, there is a way to stop this location tracking – although one must
    wonder why it is enabled by default. To do this, go to `Settings > Privacy and
    Security > Location` and make sure that location services are turned off. Alternatively,
    you can disable location tracking for individual apps by going through the app
    list on this page.


    But honestly: Isn’t this a disgrace? We as users have to dig into the depths of
    the settings just to regain control over our own data. The fact that such a level
    of surveillance is even considered leaves me dumbfounded. Microsoft seems to have
    no limits when it comes to collecting as much information about us as possible.


    ## 12.7 Find My Device


    What does Microsoft actually think about the »Find My Device« feature? Do they
    really believe that a thief who has stolen my laptop will first connect to the
    internet so I can see its location? That’s pure naivety! The reality is quite
    different. A thief who goes so far as to steal a laptop will certainly know how
    to bypass or even disable this feature.


    Of course, the internet connection required for »Find My Device« is the first
    thing a thief would prevent. And even if they don’t do it immediately but just
    remove the hard drive, it’s game over anyway. The laptop itself can be sold in
    a second-hand store, and the data? It’s likely in the hands of the thief or an
    accomplice. The idea that a thief could be tracked via an Ethernet cable is absurd.

