- fmt: '

    The really nice thing about Linux Mint is that you can easily test it as a live
    system without making changes to your existing operating system. With a live USB
    stick or a live DVD, you can start Linux Mint directly from this medium and use
    it fully, as if it were installed on your hard drive. This allows you to experience
    the user interface, the pre-installed applications, and the overall performance
    of the system in a real environment. Additionally, Linux Mint offers a user-friendly
    interface and a variety of applications that work out-of-the-box, which is particularly
    attractive for newcomers to the Linux world. After testing, you can simply restart
    your computer, and your original operating system remains unchanged.


    1. Start `Rufus` and select your stick under “Drive”.

    2. Click the “SELECT” button, find the Linux Mint ISO image file in your downloads
    folder. For me, it is: `linuxmint-21.3-cinnamon-64bit-edge.iso`, and double-click
    the file or select it and click “Open”. `Rufus` will load the file and automatically
    configure the settings for: Partition scheme, target system, drive label, file
    system, and cluster size.


    3. Click “Start” at the bottom. A window will appear saying ISOHybrid image detected.
    Keep the setting on recommended and click “OK”. It is possible that another window
    will open informing you that additional data needs to be downloaded. If so, click
    “Yes”. A warning will appear that all data on the stick will be deleted. If you
    are sure that there is no important data on the stick, click “OK”. `Rufus` will
    then create the stick:


    ![](image_rsrc1GY.jpg)


    When `Rufus` has created the stick, you will see “DONE” in the green area. Click
    “CLOSE”.


    The stick is now ready, and you can use it to start Linux Mint. As mentioned earlier,
    Linux does not even need to be installed to try it out, as Linux Mint can be started
    as a live system and runs directly from the RAM.


    ## 19.2 Starting Linux as a Live System


    For Linux newcomers, it is always advisable to first start the live system of
    Linux Mint to ensure that the hardware of the computer is fully compatible. This
    method allows users to experience the operating system in a real environment without
    altering the existing system. Additionally, it is beneficial to familiarize yourself
    with the Linux Mint interface and features before performing an installation.


    The live system provides the opportunity to gain initial experience and see how
    various programs and settings work. This can ease the transition and flatten the
    initial learning curve, as you will have already developed some familiarity with
    the system before deciding on a full installation.


    ![](image_rsrc1GZ.jpg)


    On the next page, you will see 2 images of the Linux Mint desktop.


    ![](image_rsrc1H0.jpg)![](image_rsrc1H1.jpg)


    ## 19.3 Preparing the Hardware


    Check your hardware for compatibility and make adjustments if necessary:


    1. Drivers: Check for the availability of drivers for your hardware. Most modern
    distributions support a wide range of hardware, but specific devices such as printers
    or graphics cards may require additional drivers.

    2. Partitioning: Consider how you want to partition your hard drive. It is useful
    to create a separate partition for your personal data to protect it during future
    system updates or changes.

    3. Peripherals: Test all your peripherals such as printers, scanners, and external
    drives with the live version of the chosen distribution to ensure they are compatible.


    ## 20. My Recommendation Live Mode


    Before you decide to install Linux Mint on your computer and potentially overwrite
    your existing Windows operating system, I strongly recommend that you first use
    the live mode of Linux Mint. The live mode allows you to try Linux Mint without
    making changes to your current system. Let’s go through why this is such a smart
    decision and why you don’t need to worry. I will cover the proper installation
    of Linux Mint in the next chapter.


    ### 1. No Risks to Your Current System


    The live mode of Linux Mint is a great way to test the operating system without
    endangering your existing Windows or another operating system. In live mode, Linux
    Mint runs directly from the USB stick or DVD without making any changes to your
    hard drive or current operating system. You can use all the features and applications
    of Linux Mint without altering your current setup.


    Why is this important? Because in this mode you can experience Linux Mint fully
    without the risk of accidentally losing data or damaging your current system.
    You don’t have to worry about anything going wrong while testing Linux Mint—your
    Windows system remains intact and untouched.


    ### 2. Full Functionality Without Installation


    In live mode, you have the opportunity to experience the full functionality of
    Linux Mint. You can test all the pre-installed applications, navigate through
    the system, and get familiar with the user interface.


    Why is this useful? Because you can find out if Linux Mint meets your needs before
    making a final decision. You can test the user interface, see how well the software
    runs on your hardware, and check if all the required features are present. This
    gives you a clear overview of how Linux Mint works in practice without committing
    to an installation.


    ### 3. Fast and Safe Testing


    Testing Linux Mint in live mode is not only safe but also quick and easy. You
    don’t have to make any changes or installations on your hard drive—just insert
    the USB stick, restart the computer, and you’re ready to test Linux Mint.


    Why is this advantageous? Because live mode provides a quick way to explore Linux
    Mint without dealing with often time-consuming and complex installation processes.
    You can see within minutes if the system meets your expectations without getting
    lost in the installation details.


    ### 4. Testing Without Commitments


    Live mode allows you to test Linux Mint completely without any obligation. If
    you find that it doesn’t meet your expectations or you can’t find certain features,
    you can simply remove the USB stick and continue using your computer as usual.


    Why is this reassuring? Because you don’t have to make a long-term commitment.
    You can try Linux Mint as you please and immediately return to your existing operating
    system if it’s not right for you. This minimizes the stress and uncertainty often
    associated with installing new operating systems.


    ### 5. Error Diagnosis and Hardware Compatibility


    Another significant advantage of live mode is that it helps you identify potential
    hardware complications before performing a full installation. You can see how
    well Linux Mint works with your hardware—whether all drivers are loaded correctly,
    if there are any issues with screen resolution, or if specific hardware components
    are recognized properly.


    Why is this important? Because you can detect potential issues early without going
    through the hassle of a full installation. If you encounter problems, you can
    address them in live mode or find out if there are solutions before making a decision.


    ### 6. Summary


    In live mode, you can thoroughly test Linux Mint without endangering your existing
    system or making changes to your hard drive. It is the best way to familiarize
    yourself with the operating system’s user interface and features, check hardware
    compatibility, and determine if Linux Mint meets your needs—all without any risk.


    Simply put: Live mode is the ideal solution for anyone worried about potential
    issues during installation. You can safely try Linux Mint and get a comprehensive
    view of the operating system before deciding whether to install it on your computer.


    ## 21. End of Basic Preparations

