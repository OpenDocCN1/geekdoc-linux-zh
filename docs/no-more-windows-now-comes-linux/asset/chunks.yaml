- fmt: '

    A central aspect that distinguishes Linux from Windows is the issue of security.
    Windows, being one of the most widely used operating systems, is a frequent target
    for attacks and malware. Its widespread use makes it an attractive target for
    cybercriminals. Although Microsoft has made significant progress in improving
    security features in recent years, Windows systems remain vulnerable to a variety
    of threats, especially regarding permission management and software installation.


    In contrast, Linux offers several significant security advantages. The open code
    of Linux allows for comprehensive scrutiny by the community. Security issues are
    often quickly discovered and resolved, as a large number of developers continuously
    review the code. Additionally, Linux is based on a strict permission model, where
    applications operate in a highly restricted environment, significantly reducing
    the risk of a successful attack.


    Another advantage of Linux is its modularity and the ability to install only the
    necessary components. This reduces the attack surface and minimizes potential
    security vulnerabilities. Many Linux distributions are also known for its strict
    security protocols and rapid updates, which help protect the system against emerging
    threats.


    Furthermore, Linux comes with a variety of security tools and technologies specifically
    designed to ensure system integrity. Features like `SELinux` (Security-Enhanced
    Linux) and `AppArmor` provide an additional layer of security control beyond traditional
    permissions.


    In summary, Linux not only tells a fascinating story of openness and collaboration
    but also stands as a serious alternative to commercial operating systems like
    Windows. The history of Linux, its widespread adoption, and its security benefits
    make it an attractive choice for those who value control, adaptability, and privacy.


    If you want to free yourself from the widespread control and security concerns
    of major tech corporations, it might be worth taking a look at Linux. In an era
    where privacy and security are becoming increasingly important, Linux offers a
    compelling alternative for users who want more control over their digital lives.


    I have created a separate chapter later in the book on the »History of Linux«.


    ## 14.1 Distribution of Linux


    When we talk about operating systems, one inevitably thinks of Windows as the
    dominant player in the desktop arena. However, if we look beyond this perspective,
    it quickly becomes clear: Linux is now the most widely distributed system worldwide.
    Despite Windows dominant presence on desks around the world, Linux’s distribution
    and influence are hard to match.


    While Windows dominates the desktop market—with an estimated market share of over
    70 percent in desktop operating systems—the situation is quite different on other
    levels. Linux is no longer just a toy for tech enthusiasts or server administrators.
    It has evolved into a universal operating system that is present in almost every
    area of modern technology.


    In the mobile space, for example, where Android is considered the most widely
    used operating system, Android is based on the `Linux kernel`. According to Statista,
    Android holds about 72.2 percent of the global mobile operating system market,
    which indirectly brings Linux to more than 70 percent of smartphones and tablets.
    This figure highlights how dominant Linux is in the mobile device sector—often
    behind the scenes.


    But that’s not all. Linux is also the backbone of most web servers. Estimates
    suggest that over 70 percent of all websites run on servers that use Linux as
    the operating system. This is due to the stability, security, and flexibility
    that Linux servers offer. Major names like Google, Amazon, and Facebook rely on
    Linux servers to operate their vast networks and data centers.


    Additionally, Linux can be found in a wide range of other devices that play a
    role in our daily lives. From smart TVs and routers to some household appliances—Linux
    is everywhere. The broad spectrum of devices running on Linux illustrates the
    versatility and adaptability of the system.


    Going a step further, we see that Linux also plays a central role in the internet
    itself. From major cloud providers to countless web servers and data centers—Linux
    powers a significant portion of the internet. In fact, over 90 percent of the
    world’s largest supercomputers run on Linux, making the system the preferred choice
    for high-performance computing.


    The distribution of Linux extends far beyond desktops and servers. A noteworthy
    area where Linux shows its presence is in embedded systems. According to the Linux
    Foundation, more than 90 percent of embedded systems used in various industries
    are equipped with Linux. This includes everything from cars and airplanes to medical
    devices and industrial controls.


    In summary, Linux is not just present but dominates in many areas of technology.
    While Windows remains unchallenged in the desktop space, no other system can match
    Linux’s omnipresence and influence. From mobile devices to servers to everyday
    appliances and the internet itself—Linux is the invisible powerhouse that drives
    our modern world. While it often remains in the background, its impact on technology
    and digital infrastructure is simply unparalleled.


    ## 14.2 Linux and User Friendliness


    In the past, Linux was indeed more of a domain for so-called nerds and hackers—those
    who weren’t afraid to delve deep into technology and wade through cryptic lines
    of code. Initially, Linux was a project for tech-savvy enthusiasts who weren’t
    daunted by working with the command line and hands-on customization of the system
    to meet their needs. It was a sort of club for the tech-obsessed who wanted to
    earn their freedom and control over the system themselves.


    However, times have changed. Today, in an era where user-friendliness and accessibility
    are top priorities, Linux has evolved rapidly. The original complexity that set
    it apart from other operating systems is largely a thing of the past. Modern Linux
    distributions like `Ubuntu`, `Fedora`, and `Linux Mint` have significantly simplified
    the entry for average users. The development has been swift, and the user interfaces
    today are far from the intimidating, text-based interfaces of the past.


    Of course, Windows remains the operating system known for its user-friendliness
    and ease of use. Many people appreciate the familiar interface and the seamless
    integration of features that Windows offers. It is a system perceived as intuitive
    by millions of users and often considered “easier” to handle, especially for those
    who grew up with Windows or use it professionally.


    But don’t be fooled—modern Linux systems are by no means complicated. On the contrary:
    they have become surprisingly user-friendly and offer a high level of accessibility
    for everyday tasks. Today’s Linux distributions come with graphical installation
    wizards, simple package managers, and a variety of pre-installed applications
    that facilitate getting started. The development towards more user-friendly interfaces
    and intuitive design concepts has made it so that even less tech-savvy users can
    easily work with Linux.


    Installing software on Linux is often as simple as clicking a few buttons. Many
    distributions offer software centers where you can browse and install programs
    easily, without having to struggle through complex installation procedures. Hardware
    compatibility has also greatly improved; modern Linux distributions automatically
    recognize a variety of devices and install the necessary drivers.


    Additionally, there is a thriving community of users and developers ready to offer
    help and support. Online forums, tutorials, and user groups provide valuable resources
    for anyone with questions or needing assistance. This community significantly
    contributes to making the Linux experience pleasant and smooth for newcomers.

