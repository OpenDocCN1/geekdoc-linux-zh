    Open the shell. At the bottom of the bar (in the Windows taskbar), you will find
    a black icon with a small dollar sign, the terminal symbol. After clicking, a
    text window will open.


    In the text window, the name of the logged-in user @ name of the computer will
    appear. (`username@pcname: ~$`), which means: user with the name on the system
    with the name:


    ![](image_rsrc1JJ.jpg)


    If you want to gain root privileges, enter `sudo su`, and the terminal will ask
    for the password:


    ![](image_rsrc1JK.jpg)


    You are now logged in as `root@pcname: /home/your-name#` and have absolute power
    with the shell. With the right commands, you can destroy the entire system. So
    be very careful. It’s best to close the shell, open Timeshift, make a snapshot,
    and then go back to the shell!


    ![](image_rsrc1JM.jpg)


    I will now show you a selection of important shell commands. Don’t worry – you
    don’t have to use the shell in Linux Mint; the system can be largely managed through
    the graphical user interface (GUI). This means you can navigate through most settings
    and actions by clicking, without ever needing to look at the shell. But if you
    ever need a command or are curious about what the shell can do, you are in the
    right place.


    This brief introduction will not provide you with a comprehensive mastery of the
    shell – that would be a lifelong learning process, as the possibilities are nearly
    limitless. What I can do is give you a basic understanding of the shell and introduce
    you to the key commands you might encounter in daily use.


    The shell is essentially the heart of any Linux system. Commands run directly
    here, without the detour through pretty graphical interfaces. The shell is powerful,
    it is direct – but this also means you should know what you are doing. Venturing
    into the shell feels like looking under the hood and working directly with the
    engine. But like any engine, you should be careful about what you tweak and where.


    Here are a few commands that are practical and might give you an Aha moment or
    two. Feel free to try out the shell, but always remember: with great power comes
    great responsibility! You can achieve a lot, but you should always know exactly
    what you are doing before pressing Enter. No need to panic – with care and caution,
    the shell is a wonderful tool that will only enhance your Linux experience.


    ### 28.1 File System


    The shell is open, and you can use the bolded commands. To navigate the file system
    in Linux Mint, use the following commands:


    * `cd` (Change Directory): With this command, you change the current directory.
    For example: `cd /home/username/Documents` takes you to the `Documents` directory
    within your home directory.

    * `cd ..` goes one directory backward.

    * `cd /home/username/Doc` and `Tab` completes the word `Documents` if the folder
    `Documents` is present in `/home/`.

    * `ls` (List): This command displays the contents of the current directory. Use
    `ls -l` for more detailed information or `ls -a` to show hidden files.

    * `pwd` (Print Working Directory): This command shows the full path of the current
    directory.


    ### 28.2 Managing Files, Directories


    * `cp` (Copy): This command allows you to copy files and directories. For example:
    `cp file.txt /home/username/targetfolder/` copies the file `file.txt` to the target
    folder.

    * `mv` (Move): This command moves or renames files and directories. For example:
    `mv oldFile.txt newFile.txt` renames the file `oldFile.txt` to `newFile.txt`.

    * `rm` (Remove): This command deletes files or directories. Be careful, as deleted
    files are not moved to the trash. Use `rm -r` for removing directories including
    their contents.

    * `mkdir` (Make Directory): Creates a new directory. For example: `mkdir newFolder`
    creates a directory named `newFolder`.

    * `rmdir` (Remove Directory): Deletes an empty directory. For example: `rmdir
    emptyFolder` removes the empty directory `emptyFolder`.

    * `cat` (Concatenate): Displays the contents of a file. For example: `cat file.txt`
    outputs the entire content of the file `file.txt`.

    * `less`: Displays the contents of a file page by page, allowing you to scroll
    through the content. For example: `less file.txt` lets you scroll through the
    contents of the file `file.txt`.

    * `head`: Shows the first lines of a file. For example: `head -n 10 file.txt`
    displays the first 10 lines of `file.txt`.

    * `tail`: Shows the last lines of a file. For example: `tail -n 10 file.txt` displays
    the last 10 lines of `file.txt`.

    * `find`: Searches for files and directories in the file system based on criteria.
    For example: `find /home/username -name "*.txt"` searches for all `.txt` files
    in the directory `/home/username/`.

    * `grep`: Searches files for specific text patterns. For example: `grep searchTerm
    file.txt` searches for the `searchTerm` in the file `file.txt`.


    ### 28.3 File Permissions, File Properties


    * `chmod` (Change Mode): Changes the permissions of a file or directory. Example:
    `chmod 755 file.txt` sets the permissions for `file.txt` to `rwxr-xr-x`.

    * `chown` (Change Owner): Changes the owner and group of a file or directory.
    Example: `chown username file.txt` changes the owner of the file `file.txt` to
    `username` and the group to `group`.

    * `stat`: Displays detailed information about a file or directory, including permissions,
    size, and timestamps. Example: `stat file.txt` outputs detailed information about
    the file `file.txt`.


    ### 28.4 Filesystem Check, Filesystem Check


    * `fsck` (File System Check): Checks and repairs filesystem errors. Example: `sudo
    fsck /dev/sda1`.

    * `e2fsck` (Ext2/3/4 Filesystem Check): This command is specific for checking
    and repairing Ext2, Ext3 and Ext4 filesystems. Example: `sudo e2fsck -f /dev/sda1`.

    * `tune2fs` (Tune Ext2/4 Filesystem): Although `tune2fs` is mainly used to adjust
    filesystem parameters, you can also use it to schedule certain checks and maintenance
    of the filesystem. Example: `sudo tune2fs -c 30 /dev/sda1`.

    * `badblocks` (Check Bad Blocks): This command checks a hard drive or partition
    for bad blocks. It can help identify hardware issues that may damage the filesystem.
    Example: `sudo badblocks -v /dev/sda1`.

    * `smartctl` (S.M.R.T. Monitoring Tools): This tool is used to monitor and check
    the status of hard drives and SSDs. It uses S.M.R.T. technology to detect potential
    problems before they occur. Example: `sudo smartctl -a /dev/sda`.

    * `xfs_repair` (XFS Filesystem Repair): If you are using an XFS filesystem, this
    command is used for checking and repairing it. XFS is a filesystem often used
    on large file servers. Example: `sudo xfs_repair /dev/sda1`.

    * `btrfs check` (Btrfs Filesystem Check): For the Btrfs filesystem, the `btrfs
    check` command is used to verify and repair filesystem integrity. Example: `sudo
    btrfs check /dev/sda1`.

    * `mount -o remount,ro` and `umount`: Before running some of the above commands,
    particularly those involving direct filesystem repair, you should remount the
    filesystem in read-only mode or unmount it to avoid potential data loss. Example:
    `sudo mount -o remount,ro /dev/sda1` or `sudo umount /dev/sda1`.


    But be careful! Always exercise caution when tinkering with the core of your system.
    It’s not just a simple task to check or repair a filesystem without potential
    consequences. As soon as you start working with commands like `fsck`, `e2fsck`,
    or even `umount`, you are making deeper changes to the system. And if you don’t
    proceed carefully, you could easily get burned – meaning, you could lose data
    or even disable your system.

