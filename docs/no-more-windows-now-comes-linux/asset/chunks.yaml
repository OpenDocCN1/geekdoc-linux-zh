    Dear readers and interested parties, so far so good. We have now discussed in
    detail why switching from Windows to Linux Mint represents a real alternative.
    I have analyzed the pros and cons of using the cloud and introduced you to the
    installation process of Linux Mint. Ensuring your data and performing backups
    have been crucial steps.


    Although Windows can be customized in many ways to minimize data flow, full control
    is only maintained when the system is offline. I have worked with Windows for
    many years and appreciated it, but current developments raise concerns for me.
    If you have purchased this book, you probably share this skepticism.


    This book is not aimed at Linux professionals, but at anyone who wants to make
    the transition to Linux Mint as smooth as possible. It is impossible to cover
    every aspect of Linux, but I will guide you through the key features and programs
    to ensure you can work productively with your new system.


    Keep in mind that every computer is unique. Hardware configurations can individually
    affect the experience with Linux Mint. So stay tuned for the upcoming chapters,
    where we will get to know the system more closely and prepare for practical work.


    # 22. Installing Linux Mint


    After you have created a Linux Mint boot stick as described earlier, it’s time
    to start Linux Mint.


    ## 1. Prepare and Insert the USB Stick


    Make sure your USB stick is properly prepared and Linux Mint is installed on it.
    Insert the USB stick into an available USB port on your computer.


    ## 2. Restart the Computer


    To boot from the USB stick, you need to restart your computer. You can either
    restart from the Start menu or hold down the power button for a few seconds and
    then press it again to initiate a restart.


    ## 3. Access BIOS/UEFI


    When restarting your computer, you need to enter the BIOS or UEFI setup to adjust
    the boot order. This is where you can specify which medium your computer should
    boot from.


    *   **BIOS/UEFI Access**: Normally, you will see a brief message on the screen
    when starting the computer indicating which key to press to enter BIOS or UEFI.
    This key could be one of the following: `Esc`, `F1`, `F2`, `F8`, `F10`, `F11`,
    `F12`, or `Del`.

    *   **Macs**: If you are using a Mac, hold down the `Alt` or `Option` key after
    the startup sound to access the boot menu.


    ## 4. Select Boot Device


    Once in the BIOS or UEFI menu, you need to change the boot order to ensure that
    your computer boots from the USB stick.


    *   **Boot Menu**: Many systems offer a special key to access the boot menu directly.
    This key might be `F12`, `Esc`, or another key indicated on the screen. Select
    the USB stick as the boot option here.

    *   **BIOS/UEFI Settings**: If you change the boot order directly in BIOS or UEFI,
    navigate to the appropriate settings and set the USB stick as the first boot device.
    Save the changes and exit BIOS/UEFI.


    ## 5. Start Linux Mint


    After adjusting the boot order, your computer will start from the USB stick. Depending
    on the mode your system is running in, you will see different menus:


    *   **EFI Mode**: If your system is running in EFI mode (UEFI mode), you will
    see a `GRUB` menu. `GRUB` is the bootloader that provides you with options on
    how to start Linux Mint. Simply choose the default option to proceed.

    *   **BIOS Mode**: If your system is running in BIOS mode (Legacy mode), you will
    see an `ISOLINUX` menu. This menu offers similar options to `GRUB` but in a different
    format.


    ## 6. Live Mode or Installation


    Once you reach the Linux Mint boot menu, you can choose whether to try Linux Mint
    in Live mode or to install it directly on your computer. Live mode allows you
    to test the system without making changes to your existing installation. If you
    decide to proceed with the installation, simply follow the on-screen instructions
    to install Linux Mint on your computer.


    ### 22.1 Performing a Complete Installation


    I will guide you through the complete installation of Linux Mint 22 Wilma with
    the Cinnamon desktop environment. `Wilma` is the current version of Linux Mint
    as of August 2024. You can download the ISO file here: `https://www.linuxmint.com/download.php`.
    The `ISO` is approximately 2.7 GB in size, so the download will take some time.
    In the previous chapters, I referred to Linux Mint 21 Virginia. Therefore, in
    this chapter, we will use the additional download of version 22 Wilma.


    ![](image_rsrc1H2.jpg)


    As described in Chapter 19, create a Linux Mint startup stick and boot from it.
    You will see the »Welcome to Linux Mint 22« screen. Select the first option, »Start
    Linux Mint.`:


    ![](image_rsrc1H3.jpg)


    The first option will start the live environment. Here, you can initially check
    if everything is working. It’s very similar to what you are used to from Windows.
    At the bottom left, you’ll find the Linux Mint logo as the start button for the
    start menu. The start menu contains applications like Accessories, Graphics, Internet,
    Office, Sound & Video, Administration, Preferences, and more. On the first boot,
    everything will still be in English. However, you can set the operating system
    to German during or after the installation. Test whether all applications, such
    as Office, start correctly. Can you access the internet with `Firefox`? If your
    PC is connected to the internet, everything should work. Since Mint is currently
    running from the stick, everything is a bit slow. But this improves significantly
    after installation.


    ![](image_rsrc1H4.jpg)


    I assume that all tests have worked, that `LibreOffice` has started, that `Firefox`
    can access the internet, and so on.


    Now double-click the CD icon labeled »Install Linux Mint« in the top left. The
    installer will start. Select your desired language. I choose German. Click Continue:


    ![](image_rsrc1H5.jpg)


    Select your desired keyboard layout. I choose German (left window) and German
    (right window). Click Continue:


    ![](image_rsrc1H6.jpg)


    Check the box for »Install multimedia codecs« and click Continue:


    ![](image_rsrc1H7.jpg)


    Choose the installation type. I select »Erase disk and install Linux Mint« because
    I want to switch and have backed up all data. I have a full Windows backup and
    can restore it in case of an error. If it’s the same for you, or if you have a
    separate hard drive for Linux Mint, select it here and also choose `Erase disk...`.
    Click Continue:


    ![](image_rsrc1H8.jpg)


    A warning window will appear, which you should read. It informs you that the chosen
    changes will be written to the disk. If you agree, click Continue:


    ![](image_rsrc1H9.jpg)


    Select your location in »Where are you?«


    ![](image_rsrc1HA.jpg)


    Fill out the »Who are you?« form. Enter your name and name your computer (e.g.,
    Linux-Mint-PC). Choose your username and a secure password. I recommend keeping
    »Require my password to log in« activated.


    You can enable »Encrypt my personal folder« if you wish. However, I recommend
    enabling it later. Then click Continue:


    ![](image_rsrc1HB.jpg)


    The installation is now proceeding, and you can watch the small slideshow. Here
    you will receive information about what Linux Mint can offer you:


    ![](image_rsrc1HC.jpg)


    After the installation, Linux Mint will report success and offer you to restart.
    Click `Restart Now` and then follow the on-screen instructions to remove the installation
    medium and press Enter:


    ![](image_rsrc1HD.jpg)


    After you have removed the stick and pressed Enter, the system will restart and
    the login screen will appear. Enter the password you just set and press Enter:


    ![](image_rsrc1HE.jpg)


    Linux Mint will now start and shortly display its welcome screen:


    ![](image_rsrc1HF.jpg)


    Read the welcome dialog thoroughly; it provides detailed information on what you
    should do first and gives you an initial introduction.

