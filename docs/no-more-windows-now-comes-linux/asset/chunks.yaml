    actors may circulate manipulated installers.


    2\. Install Paragon Backup 17 CE on your Windows computer. Launch Paragon and
    follow the on-screen instructions. Create the rescue environment on a USB stick
    as Paragon suggests (using this Windows image). Select the disk to be backed up
    (usually c:) and choose the entire hard drive. Select the target drive and let
    Paragon perform the backup at its own pace. It depends on the size of your hard
    drive or SSD. The backup may take hours.


    Even without a planned transition from Windows to another system, Paragon is a
    program that can be a lifesaver in an emergency.


    ## 19\. Download Linux Mint and Rufus


    To start Linux Mint, you need a USB boot stick. You need the Linux Mint ISO image
    to create the stick, and the program Rufus, which creates a bootable stick from
    the ISO image.


    1\. Download “Linux Mint” from the manufacturer’s website: [https://www.linuxmint.com/](https://www.linuxmint.com/).
    The image is approximately 3 GB in size, and the download will take accordingly.


    2\. Download “Rufus” from: [https://rufus.ie/de/](https://rufus.ie/de/). You can
    run Rufus without needing to install it.


    3\. Take a USB stick (recommended 16 GB) and ensure that it does not contain any
    important data. Also, make sure that you do not use the Paragon rescue stick.


    ### 19.1 Creating a Linux Mint Boot Stick


    I have specifically downloaded Linux Mint and Rufus for these instructions, formatted
    a 32 GB USB stick, and will show you the process step by step.'
