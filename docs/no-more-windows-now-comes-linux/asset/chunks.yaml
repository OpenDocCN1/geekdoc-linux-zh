    Linux Mint 非常棒的一点在于，你可以轻松将其作为现场系统进行测试，而无需对你现有的操作系统进行任何更改。通过启动 USB 优盘或启动 DVD，你可以直接从这些介质启动
    Linux Mint 并充分使用它，就像它已经安装在你的硬盘上一样。这允许你能够在真实环境中体验用户界面、预装应用程序以及系统的整体性能。此外，Linux
    Mint 还提供了一个易于使用的用户界面和多种开箱即用的应用程序，这对于 Linux 世界的新手来说特别有吸引力。测试完成后，你只需重启电脑，你的原始操作系统将保持保持不变。


    1. 启动 `Rufus` 并在“驱动器”（Drive）下选择你的优盘。

    2. 点击“选择”（SELECT）按钮，在下载文件夹中找到 Linux Mint ISO 镜像文件。对我来说，它是：`linuxmint-21.3-cinnamon-64bit-edge.iso`，双击该文件或选择它并点击“打开”。`Rufus`
    将加载文件并自动配置设置：分区方案、目标系统、驱动器标签、文件系统和簇大小。


    3. 点击底部的“开始”（Start）。将出现一个窗口显示检测到 ISOHybrid 镜像。保持设置为推荐设置并点击“确定”（OK）。可能会打开另一个窗口，你需要你需要额外的数据。如果是这样，点击“是”（Yes）。将弹出一个警告，提示优盘上的所有数据将被删除。如果你确定优盘上没有重要数据，请点击“确定”。`Rufus`
    将随后创建优盘：


    ![](img/image_rsrc1GY.jpg)


    当 `Rufus` 创建优盘后，你将在绿色区域看到“完成”（DONE）。点击“关闭”（CLOSE）。


    优盘现在已准备就绪，可以使用它来启动 Linux Mint。如前所述，尝试 Linux 甚至不需要安装它，因为 Linux Mint 可以作为现场系统启动并直接从
    RAM 中运行。


    ## 19.2 作为现场系统启动 Linux


    对于 Linux 新手来说，始终建议首先启动 Linux Mint 的现场系统，以确保电脑硬件完全兼容。这种方法允许用户在真实环境中体验操作系统，而不会更改现有系统。此外，在执行安装之前，熟悉
    Linux Mint 的界面和功能是有益的。


    现场系统提供了获得初步体验并观察各种程序和设置如何工作的机会。这可以缓解过渡压力并平滑初始学习曲线，因为在决定完全安装之前，你已经对系统有了某种熟悉。


    ![](img/image_rsrc1GZ.jpg)


    在下一页，你将看到 2 张 Linux Mint 桌面的图像。


    ![](img/image_rsrc1H0.jpg)![](img/image_rsrc1H1.jpg)


    ## 19.3 硬件准备


    检查你的硬件兼容性并在必要时进行调整：


    1. 驱动程序：检查硬件是否有可用驱动程序。大多数现代发行版支持广泛的硬件，但特定设备（如打印机或显卡）可能需要额外的驱动程序。

    2. 分区：考虑你想如何划分硬盘。为你的个人数据创建一个单独分区是有用的，以便在未来的系统更新或更改期间保护它。

    3. 外设：使用所选发行版的现场版本测试所有外设（如打印机、扫描仪和外部驱动器），以确保它们兼容。


    ## 20. 我的现场模式建议


    在你决定在电脑上安装 Linux Mint 并可能覆盖你现有的 Windows 操作系统之前，我强烈建议你先使用 Linux Mint 的现场模式。现场模式允许你在不更改当前系统的情况下尝试
    Linux Mint。让我们来看看这为什么这是一个如此明明的决定，以及为什么你不需要担心。我将在下一章介绍 Linux Mint 的正确安装方法。


    ### 1. 对你的当前系统无风险


    Linux Mint 的现场模式是测试操作系统而不危及你现有 Windows 或另一个操作系统的极佳方法。在现场模式下，Linux Mint 直接从 USB
    优盘或 DVD 运行，不会对你的硬盘或当前操作系统进行任何更改。你可以使用 Linux Mint 的所有功能和应用程序，而无需更改当前的设置。


    为什么这很重要？因为在 във模式下，你可以完全体验 Linux Mint，而没有意外丢失数据或损坏你当前系统的风险。你不需要担心在测试 Linux Mint
    时发生任何错误——你的 Windows 系统将保持完好且未受影响。


    ### 2. 无需安装的全功能体验


    在现场模式下，你有机会体验 Linux Mint 的完整功能。你可以测试所有预装应用程序，浏览系统并熟悉用户界面。


    为什么这很有用？因为你可以在做出最终决定之前发现 Linux Mint 是否满足你的需求。你可以测试用户界面，查看软件在你的硬件上的运行情况，并检查是否具备所有所需的功能。这让你让你清晰地了解
    Linux Mint 在实践中的工作方式，而无需承诺进行安装。


    ### 3. 快速且安全的测试


    在现场模式下测试 Linux Mint 不仅安全而且快速方便。你不需要在硬盘上进行任何更改或安装——只需插入 USB 优盘，重启电脑，就可以测试 Linux
    Mint 了。


    为什么这有优势？因为现场模式提供了一种探索 Linux Mint 的快速方法，而无需处理通常非常耗时且复杂的安装过程。你可以在几分钟内判断系统是否符合你的预期，而
    不会迷失在安装细节中。


    ### 4. 无承诺的测试


    现场模式允许你在没有任何义务的情况下完全测试 Linux Linux Mint。如果你发现它不符合你的预期，或者你找不到某些功能，你只需移除 USB 优盘并像往常一样使用电脑即可。


    为什么这让人放心？因为你不需要做出长期承诺。你可以随心所欲地测试，如果它不适合你，可以立即返回原来的操作系统。这减少了安装新操作系统时常见的压力和不确定性。


    ### 5. 故障诊断与硬件兼容性


    现场模式的另一个优势是它可以帮助你在执行安装之前识别潜在的硬件问题。你可以看到 Linux Mint 与你的硬件配合得如何——所有驱动程序是否正确加载、分辨率是否存在任何问题，或者特定硬件组件是否被正确识别。


    为什么这很重要？因为你可以在经历繁琐的全安装之前尽早发现问题。如果遇到问题，你可以在现场模式下解决它们，或者在决定之前寻找解决方案。


    ### 6. 总结


    在现场模式下，你可以在不危及现有系统或更改硬盘硬盘的情况下，彻底测试 Linux Mint。它是熟悉操作系统用户界面和功能、检查硬件兼容性并判断 Linux
    Mint 是否满足你需求的最佳方法，而且没有任何风险。


    简单来说：现场模式是任何担心安装过程中出现问题的人的理想解决方案。你可以安全地尝试 Linux Mint，并在对操作系统有全面的了解后再决定是否在电脑上安装它。


    ## 21. 基础准备结束


