    ## 1. Introduction


    Hello dear readers,


    In this book, I would like to take you on an exciting journey, away from the world
    of Windows to a new, open, and flexible environment: Linux. The switch from an
    established operating system like Windows may seem challenging at first glance,
    but I am convinced that after reading this book, you will be equipped with the
    necessary knowledge and confidence to successfully take this step.


    Together, we will explore the many facets of Linux, from installation to everyday
    use, and show how you can redefine your computing experience with this powerful
    operating system. My goal is not only to teach you the technical basics but also
    to introduce you to the philosophy and freedom that Linux offers. Be ready for
    a change—no more Windows, now comes Linux!


    Sincerely,


    Ralf-Peter Kleinert


    Please rate this book after reading it; only then can I improve.


    ## 2. Why switch from Windows to Linux?


    For reasons of data privacy and security. That’s a straightforward summary.


    Important tip: Never act recklessly or hastily. Even if the decision to switch
    from Windows to Linux is already made! Do not start `killing Windows` until you
    have worked through Chapter 18!


    I have been using Windows since version `Windows 3.1`. Back then, when computers
    were still exotic, it was all extremely interesting and absolutely exciting. But
    over the years, Microsoft evolved into a greedy data octopus. Today, we have reached
    a point where data privacy plays a central role in choosing an operating system.
    Therefore, in my new book “Linux instead of Windows,” I am informing you about
    the disadvantages of Windows and the opposing advantages of Linux. It is clear
    that both systems have pros and cons—but if you say, “The data belongs to me,”
    one candidate stands out negatively.


    Windows, developed by Microsoft and currently the most widely used end-user operating
    system worldwide, offers numerous features and is installed on countless computers.
    However, despite its popularity and versatility, there are significant privacy
    concerns that users should consider. In my book, the main disadvantages of Windows
    concerning privacy are detailed, including mandatory accounts, the integration
    of `OneDrive`, susceptibility to viruses, and update issues.


    A central disadvantage of Windows in terms of privacy is the so-called mandatory
    account. Since `Windows 8`, Microsoft has increasingly pushed for users to sign
    in with a Microsoft account to fully utilize the operating system’s potential.
    This requirement to create an account raises significant privacy concerns, as
    Microsoft gains access to a multitude of personal data. This includes emails,
    contacts, calendar data, and even settings and preferences synchronized across
    various devices. This central data storage carries the risk that sensitive information
    may be collected and possibly used without the users‹ knowledge or consent. Microsoft
    cannot credibly claim that this sensitive data is not used for other services
    or for the development of other services.


    Another significant criticism is the integration of `OneDrive`, Microsoft’s cloud
    storage service, which is often activated without user consent. Files and documents
    are automatically uploaded to the cloud, which not only jeopardizes privacy but
    also limits, often removes, users‹ control over their own data. Particularly in
    environments where sensitive information is processed, this automatic synchronization
    can pose a significant risk. Moreover, we now know that all data uploaded to cloud
    systems is read and analyzed. If there is data gets flagged by Microsoft’s filters,
    accounts can be suspended, and data can be irrievably lost.


    Additionally, Windows is known for its susceptibility to viruses. Due to its widespread
    use, the operating system is a prime target for malware and hacker attacks. These
    threats can lead to the theft or compromise of personal data. Despite continuous
    security updates and integrated protection mechanisms, the risk remains, especially
    for users who do not regularly install security updates or use additional protection
    software.


    Another problem is the frequent and sometimes problematic updates of Windows.
    Microsoft regularly performs updates to close security gaps and improve the performance
    of the operating system. However, these updates often have unexpected side effects
    that can affect the stability of the system. Worse still, some updates are carried
    out without prior notice or user consent, which can lead to unexpected restarts
    and data loss. This update issue not only represents an inconvenience but can
    also endanger the security and privacy of users if unplanned system changes lead
    to new security vulnerabilities.


    It becomes evident daily that Windows, despite its numerous advantages and widespread
    use, has significant drawbacks in terms of privacy. The mandatory account requirement,
    the enforced integration of `OneDrive`, susceptibility to viruses and problematic
    updates pose serious risks to user privacy and security. It is therefore important
    that users are aware of these risks and take appropriate measures to protect their
    data. This includes using additional security software, carefully managing cloud
    services, and regularly reviewing and adjusting the operating system’s privacy
    settings. All this leads to a whole chain of further disadvantages: constant,
    even daily vigilance and checking, paid additional software, and the daily risk
    of complete system failure. And this is no mere assertion. Entire systems can
    be rendered inoperative overnight by faulty updates. In my opinion, Microsoft
    has lost touch with the core and is no longer aware of its position in the world.
    Microsoft, in my view, represents a significant security problem for the entire
    world and should not be allowed to operate as a profit-oriented company without
    government oversight.


    ## 3. Worldwide IT Outage on July 19, 2024


    It was reported everywhere in the news, starting on July 19, 2024, that there
    was a massive crash following a faulty update of a Windows security software from
    the company `Crowdstrike`. I won’t go into the specifics of the manufacturer’s
    problem here, as all the information can be found online.

