- fmt: '

    In the dialog »Select Snapshot Location,« choose a compatible storage and click
    Next (you cannot select any incompatible storage):


    ![](image_rsrc1HV.jpg)


    In the window »Select Snapshot Levels,« you can create a schedule for time and
    retention. Initially, leave everything as is. You can adjust it at any time. The
    default setting is to create daily snapshots and keep 5 of them. This means that
    snapshots will be retained for the past 5 days. This is good for an initial backup.


    ![](image_rsrc1HW.jpg)


    In the window »User Personal Folders,« leave the settings as they are. Select
    »Exclude all files.« The snapshots are intended for the system. We will back up
    personal data and folders later with the backup tool. This is important because
    if you need to revert a snapshot due to a system error, personal documents should
    not be altered. Click Next:


    ![](image_rsrc1HX.jpg)


    Now you see »Setup Complete.« Review everything once more and then click Finish:


    ![](image_rsrc1HY.jpg)


    Now you see the Timeshift window again. Click on »Create« in the top-left corner:


    ![](image_rsrc1HZ.jpg)


    Timeshift is creating the first snapshot and copying each system file. This takes
    a while as all files are copied. Ideally, a separate hard drive dedicated solely
    to snapshots would be best. If you have an external hard drive and securely store
    your snapshots there daily, almost nothing can go wrong. No matter what you do,
    you can always revert. Keep the Linux Mint installation stick; we can use it immediately
    as a rescue stick. The Live environment includes Timeshift, and in case of an
    error, you can use it to reset the system or move it to another hard drive.


    ![](image_rsrc1J0.jpg)


    When Timeshift is finished, you can close the tool. The system is backed up, and
    we can proceed.


    ![](image_rsrc1J1.jpg)


    ## 23.2.2 Summary of Snapshots


    Let’s summarize once more. It is extremely important that you keep systems snapshots
    and later regular backups in mind from the start. Setting them up is quick and
    simple—and, honestly, if your computer crashes, the hard drive fails, or an unexpected
    error occurs... Believe me, you will be more than grateful if you have created
    system snapshots beforehand.


    Linux is undoubtedly more robust and secure than Windows, no question about it.
    The operating system provides a stable foundation that is largely immune to many
    of the issues Windows users face. But let’s not forget: Linux is also programmed
    by people, not gods. Mistakes happen, software can crash, and updates can sometimes
    cause unexpected problems. This is exactly where system snapshots come in—they
    are your safety net.


    Snapshots are, simply put, exact images of your system at a particular point in
    time. They capture the current state of the operating system and store it as a
    reference. This means that if something goes wrong after an update, a new software
    installation, or a system change, you can revert everything to the previous state
    with a single click—without affecting your personal files.


    Why are system snapshots so important? Because they allow you to experiment without
    fear. Want to test new software or make deeper changes to the system? No problem!
    If something doesn’t work as planned, you can always return to the last snapshot
    as if nothing had happened.


    And the best part: Snapshots are quick to set up and can be created automatically.
    Tools like `Timeshift` handle this task and make it particularly easy for you
    to create regular snapshots. Whether daily, weekly, or with each major update—you
    decide when and how often the snapshots are created. This gives you the freedom
    to focus on your actual work without constantly worrying about potential system
    issues.


    The snapshots are saved on a Linux-compatible file system, such as `ext4`. This
    is important because only these file systems can correctly store the complex file
    permissions and ownership rights essential for the smooth operation of Linux.
    Therefore, make sure to use a suitable storage medium that meets these requirements.


    Honestly—make snapshots! They are your best protection against unexpected disasters
    and provide the security you need to fully enjoy Linux Mint. It’s a small effort
    with tremendous benefits that can save you from hours of troubleshooting and frustration.


    ## 23.3 Third Task: Driver Management


    Now, dear readers, after installing Linux Mint and completing the initial steps,
    we are once again greeted by the welcome screen. This screen offers some crucial
    functions that will help you get started and ensure your system runs smoothly.
    One of the particularly important points I want to emphasize is the »Driver Management.«


    You might wonder why this is so important. Well, imagine you have powerful hardware—such
    as an `Nvidia GeForce GTX 1050 Ti` graphics card. This card is designed to provide
    outstanding graphics performance, whether for gaming, video editing, or just general
    desktop use. But all this performance is only as good as the software that controls
    it. This is where drivers come into play.


    Drivers are small software programs that enable communication between the operating
    system and the hardware. Without the correct drivers, your hardware—whether it’s
    the graphics card, the Wi-Fi module, or other components—cannot reach its full
    potential. This means that if you don’t have the correct drivers installed, your
    `GeForce GTX 1050 Ti` might be recognized only as a basic graphics card, resulting
    in much poorer performance than the card actually offers. The smooth animations
    of Linux Mint might not run smoothly, and applications like games or graphic programs
    could have issues.


    And this is where Linux Mint’s Driver Management becomes indispensable. The welcome
    screen provides direct access to Driver Management so you can ensure your hardware
    functions optimally from the start. Driver Management automatically scans your
    system for hardware that has proprietary drivers—drivers specifically developed
    for your hardware. This is especially crucial for `Nvidia` graphics cards, like
    our `GeForce GTX 1050 Ti`.


    `Nvidia` offers both open-source drivers and proprietary drivers. The open-source
    drivers that come with Linux Mint are sufficient for many users, but they don’t
    fully exploit your graphics performance. The proprietary drivers from `Nvidia`,
    on the other hand, are optimized to deliver the best possible graphics performance.
    They provide better support for 3D graphics, games, and demanding applications.
    And you can easily install these drivers via Driver Management.


    So how does it work? It’s simple: Open Driver Management and let it scan your
    system. If you have an `Nvidia GTX 1050 Ti`, it will directly show you the appropriate
    proprietary driver from `Nvidia`. A simple click on “Install” is all it takes,
    and Linux Mint takes care of the rest. After a restart, you can be sure that your
    graphics card is running at maximum performance.


    Why is this so important? Because the right driver configuration ensures that
    you get the best results from your system. Your hardware will run more stable,
    and you’ll experience fewer issues with crashes or performance bottlenecks. The
    graphics card is a good example, but the same applies to other components like
    Wi-Fi adapters, sound cards, or printers. Driver Management ensures that your
    hardware works as it should from the beginning.


    Click the green button under »Driver Management«:


    ![](image_rsrc1J2.jpg)


    The Driver Management is now searching for drivers:


    ![](image_rsrc1J3.jpg)


    If, as in my case, no drivers are needed, you will see the following output:


    ![](image_rsrc1J4.jpg)


    ## 23.4 Fourth Task


    After the driver management. If your Linux Mint has found and installed drivers,
    please create a new `Timeshift` snapshot. Go to the Start menu, type »time,« and
    then click on `Timeshift`. Log in with your password and then click »Create« in
    `Timeshift`. Then you can continue.


    ## 23.5 Fifth Task: Application Management

