  trans: '


    Linux 与 Windows 之间的一个核心区别在于安全问题。Windows 作为最广泛使用的操作系统之一，是攻击和恶意软件的频繁目标。其广泛的普及使其成为网络犯罪分子垂涎的肥肉。尽管微软在近年来改进改进安全功能方面取得了显著进展，但
    Windows 系统仍然容易受到各种威胁的侵害，特别是在权限管理和软件安装方面。


    相比之下，Linux 提供了几项显著的安全优势。Linux 的开放代码允许社区进行全面的审查。由于有大量开发者持续审查代码，安全问题通常会被迅速发现并解决。此外，Linux
    基于严格的权限模型，应用程序运行在高度限制的环境中，这显著降低了攻击成功率的风险。


    Linux 的另一个优势是它的模块化，以及只安装必要组件的能力。这减少了攻击面，并最大限度地减少了潜在的安全漏洞。许多 Linux 发行版也以其严格的安全协议和快速的更新而闻名，有助于保护系统免受新兴威胁的影响。


    此外，Linux 还带有多种专门为确保系统完整性设计的安全工具和技术。如 `SELinux`（增强型 Linux）和 `AppArmor` 等功能提供了传统权限之外的额外安全控制层。


    总之，Linux 不仅讲述了一个关于开放与协作的迷人故事，还作为 Windows 等商业操作系统的严肃替代方案。Linux 的历史、广泛的应用以及它的安全优势，使其成为那些重视控制权、适应性和隐私的人眼中极具吸引力的选择。


    如果你想从大型科技公司的广泛控制和安全忧虑中解脱出来，可能值得关注一下 Linux。在隐私和安全变得日益重要的时代，Linux 为想要对数字生活拥有更多控制权的用户提供了一个极具竞争力的替代方案。


    我在书的后部分创建了一个关于“Linux 历史”的独立章节。


    ## 14.1 Linux 分发


    当我们谈论操作系统时，不可免地会认为 Windows 是桌面领域的主导者。然而，如果我们跳出这个视角，很快就会变得清晰：Linux 现在是全球发行最广泛的系统。尽管
    Windows 在全球桌面电脑上占据主导地位，但 Linux 的分发和影响力是难以比拟的。


    虽然 Windows 主导着桌面市场——估计桌面操作系统的市场份额超过 70%——但在其他领域，情况完全不同。Linux 不再仅仅是技术爱好者或服务器管理员的玩具。它已经演变成一种通用的操作系统，存在于现代技术的几乎每一个领域。


    例如，在移动领域，Android 被认为是最常用的操作系统，而 Android 是基于 `Linux kernel` 的。根据 Statista 的数据，Android
    占据了全球 72.2% 的移动操作系统市场，这间接将 Linux 带到了了超过 70% 的智能手机和平电脑。这一数字凸显了 Linux 在移动设备领域的主导地位——尽管它通常处于幕后。


    但并非如此。Linux 还是大多数 Web 服务器的骨干。估计显示，超过 70% 的网站运行在使用 Linux 作为操作系统的服务器上。这归功于 Linux
    服务器提供的稳定性、安全性和活性。Google、Amazon 和 Facebook 等大品牌都依赖 Linux 服务器来运行其庞大的网络和数据中心。


    此外，Linux 可以在许多在我们日常生活中发挥作用的其它设备中找到。从智能电视、路由器到某些家用电器——Linux 无处不在。运行在 Linux 上的广泛设备说明了该系统的多功能性和适应性。


    更进一步，我们看到 Linux 在互联网本身也扮演着核心角色。从主要的云提供商到数不可计的 Web 服务器和数据中心——Linux 驱动了互联网很大的一部分。事实上，世界上超过
    90% 的超级计算机运行在 Linux 上，使该系统成为高性能计算的首选。


    Linux 的分发远超桌面和服务器。Linux 显示其存在感的一个值得的领域是嵌入式系统。根据 Linux 基金会的数据，各行业使用的各种嵌入式系统中，有超过
    90% 都配备了 Linux。这包括从汽车、飞机到医疗设备和工业控制的各个领域。


    总之，Linux 不仅存在，而且在许多技术领域占据主导地位。虽然 Windows 在桌面领域仍然无人挑战，但没有其他系统可以比 Linux 的无处不在和影响力。从移动设备到服务器，再到日常电器和互联网本身——Linux
    是驱动我们现代世界的隐形力量。虽然它通常处于背景中，但它对技术和数字基础设施的影响是无与伦比的。


    ## 14.2 Linux 与用户友好性


    在过去，Linux 确实是所谓的“极客”和黑客的领域——那些不害怕深挖技术并钻读晦涩代码行的人。最初，Linux 是一个针对精通技术的爱好者的项目，他们并不畏惧使用命令行以及对系统进行手动定制以满足自己的需求。它是技术痴迷者的俱乐部，他们想要自己赢得对系统的自由和控制权。


    然而，时代已经了。在如今用户友好性和易用性成为首要任务的时代，Linux 经历了快速进化。最初与其他操作系统区分开来的复杂性在很大程度上已成为过去。现代 Linux
    发行版如 `Ubuntu`、`Fedora` 和 `Linux Mint` 显著降低了普通用户的入门门槛。这种发展非常迅速，如今的用户界面与过去令人生畏的基于文本的界面相已远。


    当然，Windows 仍然是以其用户友好和易用而闻名的操作系统。许多人喜欢 Windows 提供的熟悉界面和功能的无缝集成。它被数百万用户认为是直观的系统，并且通常被认为更“容易”处理，特别是对于那些在
    Windows 环境中长大或专业地使用它的人来说。


    但不要被欺骗了——现代 Linux 系统一点也不复杂。相反：它们变得出奇地用户友好，并为日常任务提供了高水平的易用性。如今的 Linux 发行版带有图形化安装向导、简单的软件包管理器以及各种预装应用程序，方便了入门。向更友好的界面和直观设计概念的发展，使得即使是技术不太精通的用户也能轻松使用
    Linux。


    在 Linux 上安装软件通常就像点击几个按钮一样简单。许多发行版提供了软件中心，你可以在那里轻松浏览和安装程序，而无需挣扎复杂的安装程序。硬件兼容性也大大提高；现代
    Linux 发行版会自动识别各种设备并安装必要的驱动程序。


    此外，还有一个活跃的用户和开发者社区，随时准备提供帮助和支持。在线论坛、教程和用户小组为任何有疑问或需要帮助的人提供了宝贵的资源。这个社区为新用户获得愉悦和顺畅的体验做出了巨大贡献。


    '
- fmt: '

    In short, while Windows continues to be regarded as the system leading in user-friendliness,
    today’s Linux users can certainly hold their own. Modern distributions have made
    enormous strides and offer a user-friendly experience that enables average users
    to work efficiently and seamlessly. Even if Windows may still be the first choice
    for some, it is no longer a secret that Linux has become an attractive and practical
    option for many.


    ## 14.3 Linux Hardware Requirements


    In today’s rapidly advancing technological landscape, hardware requirements are
    becoming an increasingly pressing issue. Especially in light of upcoming changes
    at Microsoft and the associated environmental impacts, Linux offers a notable
    alternative. But let’s take a step back and examine the situation more closely.


    Over the years, Linux has earned an excellent reputation for its versatility and
    flexibility. One of the standout features of Linux is its ability to run on a
    wide range of hardware configurations. For almost any computer built since around
    2006 or even earlier, there is a suitable Linux distribution. These distributions
    are designed to keep resource usage low while still providing a complete and user-friendly
    desktop environment.


    Modern Linux distributions like `Lubuntu` or `Linux Mint Xfce` are specifically
    optimized for older or less powerful hardware. They offer a lightweight desktop
    environment that requires fewer system resources than the more extensive interfaces
    of modern operating systems. This means that even older computers that are technically
    still functioning well can be operated with an efficient and up-to-date Linux
    distribution. This implies that older hardware doesn’t have to be discarded simply
    because new operating system versions have higher requirements.


    The year 2025 is approaching, bringing with it the final end of `Windows 10`,
    as Microsoft plans to migrate all users to `Windows 11`. However, this transition
    presents significant challenges. `Windows 11` requires higher hardware specifications
    than `Windows 10`, meaning that many computers, still technically sound, will
    not meet the new requirements. `Windows 11` specifications include, among other
    things, a `TPM 2.0` chip, `Secure Boot`, and specific processor architectures,
    which are not present in all older devices.


    Estimates suggest that millions of computers and laptops built before 2016 might
    not meet the minimum requirements for `Windows 11`. This results in a massive
    environmental burden, as functional devices become obsolete. The idea of billions
    of devices being simply replaced by new ones, just because software manufacturers
    cannot make their systems backward compatible, is alarming. It could lead to an
    enormous amount of electronic waste—an environmental issue that is already reaching
    concerning dimensions.


    In this context, Linux’s environmental friendliness becomes particularly evident.
    Since Linux can run on a variety of hardware configurations and can be designed
    to be lightweight, it enables the continued use of older devices. This capability
    of Linux not only helps extend the lifespan of hardware but also reduces the need
    for new devices. This has far-reaching positive effects on the environment, as
    it decreases the amount of electronic waste and minimizes the need for new raw
    materials for computer manufacturing.


    Moreover, there are numerous projects within the Linux community specifically
    aimed at supporting older devices. Distributions like `AntiX` or `Puppy Linux`
    are designed for extremely old hardware and offer a user experience that is often
    not only functional but also surprisingly smooth.


    When considering the future of technology, we should also take into account the
    environmental impacts of our decisions. The upcoming migration to `Windows 11`
    presents a major challenge, especially for users of older devices that are still
    in good working condition. Given the environmental impact that could result from
    the mass disposal of these devices, it is important to consider alternative solutions.


    Linux offers an excellent way to address this challenge. With its ability to run
    on older and less powerful devices, it represents a sustainable option that benefits
    both users and the environment. Instead of discarding functional hardware, you
    can find an efficient, up-to-date, and environmentally friendly solution with
    Linux. This is not only a practical decision but also a contribution to a more
    environmentally conscious future.


    ## 15. Can Linux Do What Windows Can?


    When thinking about operating systems, Windows unquestionably stands at the top.
    However, the question of whether Linux can replace Windows is becoming increasingly
    relevant, especially when considering the ongoing developments and growing influence
    of Linux in the tech world. Let’s take a closer look at this question and find
    out if Linux truly has what it takes to serve as a full-fledged alternative to
    Windows.


    First of all, it is important to recognize that Linux has made significant strides
    in recent years. Linux was once considered the operating system for tech enthusiasts
    and IT professionals, but nowadays it offers a wide range of features that can
    often compete with those of Windows. Many Linux distributions now offer complete
    desktop environments that are not only visually appealing but also functionally
    comprehensive.


    Modern Linux distributions such as `Ubuntu`, `Fedora`, and `Linux Mint` provide
    user-friendly graphical interfaces that make interacting with the system as intuitive
    as with Windows. Software management is often carried out via streamlined software
    centers that make installing and updating programs as easy as Windows’ own software
    management.


    A significant point is also the support for professional applications. While Windows
    has historically been the first choice for many professional software solutions,
    alternatives have increasingly developed. Programs like `GIMP` for image editing,
    `LibreOffice` for office applications, and `Blender` for 3D design offer powerful
    features that are comparable to their commercial counterparts in many cases. Developer
    tools like `Docker`, `Kubernetes`, and `Visual Studio Code` are also available
    on Linux.


    One area where Linux particularly excels is reliability and security. Linux is
    known for its stability and robustness, making it a preferred choice for servers
    and critical systems. The open-source nature of Linux allows for continuous review
    and improvement by the community, which enhances security and minimizes the risk
    of vulnerabilities.


    In contrast, Windows regularly faces security threats. The high prevalence of
    Windows makes it a prime target for malware and viruses. Despite all the security
    measures Microsoft has taken, Windows systems are more susceptible to attacks,
    especially if they are not updated regularly. Linux, on the other hand, with its
    robust permission structure and regular security reviews by the community, offers
    a significantly smaller attack surface for malware.


    It is not just private users who benefit from the advantages of Linux. Scientists
    and large companies are also increasingly turning to Linux. In the world of research
    and development, Linux is widely used as it offers a flexible and customizable
    platform. Supercomputers, considered the most powerful worldwide, run almost exclusively
    on Linux. The `TOP500` index, which lists the 500 most powerful supercomputers,
    shows that more than 90 percent of these machines are operated with Linux.


    In the business world, Linux is also on the rise. Many large corporations, including
    `Google`, `Amazon`, and `Facebook`, use Linux for their server infrastructure.
    These companies utilize Linux for its stability, security, and cost-effectiveness.
    The fact that Linux offers a cost-efficient alternative to commercial operating
    systems without compromising performance is a significant advantage.

