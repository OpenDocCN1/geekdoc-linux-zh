    ## 33\. History of Linux


    The history of Linux begins in 1991 when Linus Torvalds, a 21-year-old student
    at the University of Helsinki, released the first version of his own operating
    system. Frustrated by the high costs and limited flexibility of the then-popular
    MINIX operating system, which was developed for educational purposes, Linus aimed
    to create a free and open operating system aligned with the principles of open-source
    software development.


