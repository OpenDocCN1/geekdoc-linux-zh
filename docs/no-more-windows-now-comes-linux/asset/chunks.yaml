- fmt: '

    I personally keep these options enabled. It makes it easier to access important
    functions and locations like my personal folder or the trash directly from the
    desktop. You can therefore customize which icons and folders are most visible
    and accessible to you.


    These customization options allow you to design your desktop to be both aesthetically
    pleasing and functional. With just a few clicks, you have the freedom to personalize
    your desktop environment according to your needs and preferences.


    Give it a try and make your desktop a place that is both beautiful and practical!
    I have set up my desktop this way and I think it’s great.


    ![](image_rsrc1J9.jpg)


    ## 24. Data Backup Tool


    Before I can confidently let you loose on your brand-new Linux Mint – like throwing
    grains to 20 chickens – we need to set up data backup. It’s just as simple as
    everything else has been so far.


    Just go to the Start menu and type »Data`. This will take you directly to the
    available options for data backup. Then select the data backup tool. This will
    give you the opportunity to protect your valuable data and ensure that in case
    of an unexpected problem, everything can be quickly restored.


    Setting up data backup is a quick and straightforward process. You can decide
    whether you want to schedule regular backups, which folders or files to back up,
    and where to store the backups. Linux Mint makes it easy to set up a backup system
    that regularly secures your data without you having to constantly remember it.


    Go to the Start menu and type »Data`. Then select the data backup tool:


    ![](image_rsrc1JA.jpg)


    A dialog will open; click on »Back Up Now« under Personal Data:


    ![](image_rsrc1JB.jpg)


    Now you can let the backup be created directly in the `Backups` folder or choose
    a different folder. For illustration, I’ll leave it like this:


    ![](image_rsrc1JC.jpg)


    Excluded from the backup are the backups themselves:


    ![](image_rsrc1JD.jpg)


    In the next window, select the folders that should be backed up. Typically, this
    is the »Personal Folder,« which contains your documents, images, or videos. Click
    »Include directories.« It is best to start by selecting all folders by marking
    them:


    ![](image_rsrc1JE.jpg)


    Then click »Include files.« Select all files and click »Open« at the bottom:


    ![](image_rsrc1JF.jpg)


    Click »Apply« and the first backup will be created. It will be very quick because
    the system is still new:


    ![](image_rsrc1JG.jpg)


    This is a very, very simple backup tool. I recommend a different tool that can
    perform automatic backups on a schedule, with encryption and password protection,
    and also back up to the cloud over the internet. Of course, it’s free. However,
    this tool is not bad for getting started. It does back up the data.


    ## 25. Better Backup System DejaDup


    First, go to the Application Manager, which you can access through the Start Menu.
    Simply click on “Start Menu” and then select “Application Manager.” This opens
    the central program for managing your software. In the upper search field of the
    Application Manager, type “DejaDup.“ This powerful backup tool will be displayed
    to you immediately.


    ![](image_rsrc1JH.jpg)


    Click on “DejaDup” to go to the installation page. Here, you will see the “Install”
    button. A click on it will set up the program on your system. The installation
    is usually quick and straightforward, so you’ll be up and running in no time.
    Once the installation process is complete, simply press “Launch” to open DejaDup.


    DejaDup is an intuitive and user-friendly backup tool that offers a range of features.
    It allows you to create regular backups of your files and folders without having
    to constantly manage them. The interface is well-organized and provides easy access
    to all necessary functions.


    When you first start DejaDup, you will be guided through a simple setup wizard.
    You can select which files and folders to back up and specify the location for
    your backups. DejaDup supports various storage targets such as local drives, network
    shares, or even cloud services like Google Drive.


    A major advantage of DejaDup is its flexibility in scheduling. You can set the
    backup cycles according to your needs—whether daily, weekly, or monthly. Additionally,
    the program allows for incremental backups, which only save changes since the
    last backup. This saves space and speeds up the backup process.


    Another highlight of DejaDup is its straightforward restore function. If something
    goes wrong or data is lost, you can quickly and easily restore your backed-up
    data. This provides an extra layer of security, knowing that your important data
    is always available in case of a problem.


    With DejaDup, you have a powerful tool at your disposal that helps you reliably
    back up your data and quickly restore it in case of emergency. It’s easy to use
    and offers many options for customizing your backup strategy. If you’re looking
    for a better backup system to manage your data, DejaDup is definitely an excellent
    choice.


    Give it a try and experience how easy it can be to keep your data safe and secure!


    ## 26. Programs That Might Be Needed


    I’d like to introduce you to a few programs that I believe offer a better alternative
    to the pre-installed applications. Of course, the pre-installed programs handle
    the basic functions well enough, but sometimes it can be beneficial to switch
    to more specialized or powerful software to get even more out of your system.


    So, let’s take a look at these small but valuable recommendations that can help
    you boost your productivity or enhance your user experience. These programs are
    not only functional but often offer additional features that the pre-installed
    applications do not always have.


    Whether it’s better tools for image editing, advanced text processing, or specialized
    applications that make your daily tasks easier, I’m confident you’ll find some
    real gems in this list. They are not only easy to install but also fit perfectly
    into your environment.


    Of course, it’s important to emphasize that the pre-installed programs are generally
    solid and reliable. They are well-integrated and provide quick access to essential
    functions. However, once you discover the additional performance and advanced
    features of the recommended programs, you may find that they offer benefits that
    the standard applications might not always provide.


    Here are my recommendations to help you use your Linux Mint system even more efficiently
    and individually. Installing these programs is straightforward, and they integrate
    seamlessly into your environment.


    ### 26.1 Data Backup DejaDup


    Linux Mint comes with a basic backup tool that is quite useful for initial data
    backups. It provides simple options for backing up and occasionally restoring
    your files. However, when it comes to more comprehensive features and a more powerful
    backup solution, I strongly considering DejaDup.


    DejaDup surpasses the standard backup tool in several key aspects. One of the
    biggest advantages of DejaDup is the ability to set up automatic scheduled backups.
    This means you can precisely set your backup intervals—whether daily, weekly,
    or monthly. This automation ensures that your data is regularly backed up without
    requiring manual intervention.


    Additionally, DejaDup offers extensive encryption options to protect your data
    during the backup process. This is particularly important if you are backing up
    sensitive information and want to ensure that only you or authorized persons have
    access to these data.


    Another outstanding feature of DejaDup is its support for various backup targets.
    In addition to local storage, you can also save your backups on an FTP server
    or in the cloud. This means you can store your data flexibly and securely in different
    locations—whether on an external drive, a network folder, or a cloud service like
    Google Drive.

