    *   `passwd`: `passwd` 命令允许你设置或更改用户的密码。通过运行 `passwd john`，你可以为用户 "john" 设置密码。

    *   `userdel`: 要删除一个用户账户，你可以使用 `userdel` 命令。例如，`userdel john` 将从系统中删除用户 "john"。

    *   `groupadd`: 该命令用于创建一个新组。例如，`groupadd developers` 将创建一个名为 "developers" 的组。

    *   `groupdel`: 要删除一个组，你可以使用 `groupdel` 命令。例如，`groupdel developers` 将删除 "developers"
    组。

    *   `usermod`: `usermod` 命令允许你修改用户账户的各种属性，例如用户名、主目录或所属组。例如，`usermod -l newname
    john` 将用户-将用户 "john" 重命名为 "newname"。

    *   `usermod -aG`: 该命令用于将用户添加到一个或多个组中。例如，`usermod -aG developers john` 将将用户 "john"
