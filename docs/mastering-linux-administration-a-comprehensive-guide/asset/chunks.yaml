    ### SSH 密钥认证（可选）


    SSH 密钥认证是一种更安全的登录远程系统的方法，无需输入密码。它涉及生成一对密钥（公钥和私钥），并将公钥添加到远程服务器上的 `~/.ssh/authorized_keys`
