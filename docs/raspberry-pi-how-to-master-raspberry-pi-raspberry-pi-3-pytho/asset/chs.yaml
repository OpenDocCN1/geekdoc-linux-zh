- "# 树莓派：如何精通树莓派 (树莓派 3, Python, Linux, 计算机编程, 单板计算机, 微处理器, 编程)\n\n\n\n![](img/cover.jpeg)\n\
  \n\n![](img/00002.jpg)\n\n\n![](img/00001.jpg)\n\n\n\n\n\n\n\n# 引言\n\n![](img/00002.jpg)\n\
  \n恭喜你下载树莓派，感谢你的支持。\n\n后续章节将讨论你利用这种功能极其多样的树莓派计算微型板的无数方法——或者说，你如何让它为你所服务。\n\n如果你正在阅读这本书，我确定你至少听过关于这个非常精妙的小装置的一些事。也许你听说过人们在家里制作大型街机柜，他们和朋友可以在那里玩以前喜欢的游戏；也许你见过智能镜子，在人们早晨准备时时显示重要信息流；或者，你只是在网上偶然读了一篇关于它的文章，只想知道它们能做什么。\n\
  \n更有可能的是，由于这是一本编程基础书籍，你正试图理解如何通过编写自己的脚本或使用他人的脚本来充分发挥树莓派的价值。\n\n无论你的理由是什么，我可以说，获取树莓派无疑是你近期做出的最明智的决定之一。你将能够用它做许多酷的事情，并在过程中学到很多技术和工程知识。\n\
  \n市上有许多关于这个主题的书，再次感谢你选择这一本！我们已尽全力确保它包含尽可能多的有用信息，请享用！\n\n# 第一章\n\n![](img/00002.jpg)\n\
  \n## 什么是树莓派？\n\n出于本书的意图和目的，我们将从零开始，并假设你一无所知。因此，为了做到这一点，我们必须从最基础的问题开始。最基础的问题是：什么是树莓派（Raspberry\
  \ Pi）？\n\n正如我所说，树莓派在网上大量的科技 DIY 项目中非常显眼。此外，如果你和工程师或热爱技术的人是朋友，你可能有一两个朋友已经使用过树莓派并开展过项目。\n\
  \n那么，树莓派究竟是什么呢？嗯，从最基础来说，它只是一堆零件。\n\n树莓派是由树莓派基金会于 2012 年开发的。该项目的初衷是开发一种超小且具有成本效益的计算机，用于向发展中国家的学生和那里的儿童教授编程和计算机科学的基本概念，在这些情况下，可用资金通常非常匮乏。\n\
  \n树莓派的设计意图之一是它应该是可扩展的。这意味着它应该是非常开放的；你应该能够为它购买许多改装和硬件选项，并轻松地使用它们。我们将在下一章中详细讨论这一点。\n\
  \n树莓派的成功远超了它的原始意图。正如我所说的，它的初衷仅仅是帮助资金紧张的地区——如发展中国家的公立学校——培养编程和计算机科学知识，但它很快变成了全球各地科技爱好者最喜爱的玩具，因为它让你能以极少的投入完成很多事情。\n\
  \n事实上，在一个极具成本效益的微型板中封装了相当强大的计算能力。然而，我们将在下一章同样讨论这一点。\n\n那么，树莓派究竟是什么？嗯，它是通往可能的门户。当你获得一个树莓派时，你实际上获得了可以用它做的一百万种不同的事情。你可以设置一套自动浇水系统。你可以在你的孩子玩《我的世界》时教他们如何编程。你可以做诸如获取天气自动更新并制作一个早上向你播报天气的闹钟的事情。简而言之，树莓派让你能够以很低的成本做很多事情。你所需要的只是购买树莓派的初始资金、项目材料的开支，以及实现这些目标的才智和技巧。\n\
  \n说了这么多，我想你对树莓派的概念已经有了一个大致的了解，但在结束本章之前，我将再次总结一下：树莓派是一种微型计算机，对于其小尺寸来说，拥有极其强大的处理能力。许多树莓派型号只比信用卡稍大一点！凭借它的处理能力，你能够完成许多以前梦寐以求的事情。\n\
  \n# 第二章\n\n![](img/00002.jpg)\n\n## 内部构造\n\n现在我们已经知道树莓派是什么了，我们需要知道驱动它的动力。从根本上说，树莓派只是一个微型计算机；一组焊接在微小、实用的包装中的计算机零件集合。\n\
  \n然而，尽管体积很小，但树莓派通常相当强大。此外，目前市场上有几个版本可以让你买到。在本章中，我们将讨论每个树莓派型号硬件规格以及它们对你意味着什么。此外，在章节后后部分，我们将讨论可以驱动树莓派的软件。\n\
  \n\n\n\n\n首先，目前市场上共有六种不同的树莓派（Raspberry Pi）。我将简要介绍每个型号的硬件规格，按照从最早到最新的顺序进行。\n\n##\
  \ 树莓派型号\n\n### Raspberry Pi 1 Model A+\n第一个型号是基于树莓派原始版本并经过了一些改进。它被称为 `Raspberry\
  \ Pi 1 Model A+`，是“全功能”树莓派中最低的版本。它有一个 USB 端口且体积非常小。它的功耗也较低。因此，如果你正在进行的项目不需要太多功率也不需要很多\
  \ USB 适配器，那么完全没问题。在 `Raspberry Pi 3` 之前的型号上，一个 USB 端口通常会被蓝牙或 Wi-Fi 适配器占用，后续过程中请记住这一点。\n\
  \n### Raspberry Pi 1 Model B+\n同系列——`Raspberry Pi 1` 的稍改进改进版本被称为 `Model B+`。它具有\
  \ 4 个 USB 端口，因此扩展性更好。在成本和功耗效率方面，它与 `Raspberry Pi 1` 共享许多优点，但价格稍贵一点。（不过，你多花点钱也能换来更多的性能）\n\
  \n### Raspberry Pi 2 Model B\n在第一个版本发布后，自然有了第二个版本。与第一代一样，你可以很容易地获得第二代 `树莓派`，它名其实地称为\
  \ `Raspberry Pi 2`。目前提供的 `Raspberry Pi 2` 只有一个型号即 `Model B`。`Raspberry Pi 2 Model\
  \ B` 比任何一个 `Raspberry 1` 型号都稍贵一点。然而，作为多花一点钱的回报，你获得了一个非常稳固的 ARM 处理器和整 1GB 的内存。记录一下，ARM\
  \ 处理器是一项大发现；`Raspberry Pi 2` 拥有 ARM 处理器意味着可以在设备上可行运行任何类型的 ARM 操作系统。这包括 `Windows\
  \ 10 ARM` 或 ARM 版本的 `Ubuntu`。这自然地意味着你的设备能力比其他情况强得多，因为你有了更广泛的操作系统可以使用。\n\n### Raspberry\
  \ Pi 3 Model B\n我们需要讨论的下一个 `树莓派` 版本是 `Raspberry Pi 3`。这是目前发布的最新版本的树莓派，它在第二代的基础上增加了许多功能。其中包括内置的蓝牙和\
  \ Wi-Fi，因此你不再需要为它们购买单独的适配器，你的 4 个 USB 端口可以专门用于你想要的任何用途，而不是浪费一两个在小小的无线适配器上。CPU 也经过了大幅升级。除外，其大部分规格与\
  \ `Raspberry Pi 2` 相同。然而，取决于你项目的复杂性和特殊性，你可能希望选择 `Raspberry Pi 3`——毕竟，它的 CPU 更好，这意味着你的项目运行得更快、更高效，谁不想要呢？目前市场上只有一个\
  \ `Raspberry Pi 3` 型号——即 `Model B`。\n\n### Raspberry Pi Zero and Zero W\n最后，谈论 `Raspberry\
  \ Pi Zero` 非常重要。那么，什么是 `Raspberry Pi Zero` 呢？嗯，它是你能获得的性价比最高的 `树莓派`。它非常小，每个板仅需 5\
  \ 美元。这非常不错，从价格角度来看，让大量的项目变得超级容易上手。`Raspberry Pi Zero` 在许多方面与 `Raspberry Pi Model\
  \ A+` 共享规格，但要小得多。此外，`Raspberry Pi Zero` 没有标准的 USB 端口。此外，你还可以获得 `Raspberry Pi Zero\
  \ W`，它在很大程度上与 `Raspberry Pi Zero` 相同，但增加了内置 Wi-Fi 和蓝牙连接。取决于你项目的性质，你可能希望选择这种，这样你就可以轻松使用这些功能，而不需要为了这些目的去弄复杂奇特的适配器。`Raspberry\
  \ Pi Zero` 和 `Raspberry Pi Zero W` 在你想制作原型时非常棒，因为它们非常便宜，而且非常适合较小的项目。\n\n## 选择正确的版本\n\
  \n那么，如何知道你应该买哪个版本的树莓派？这真的取决于许多因素。例如，如果你是树莓派的新手，你可能希望选择较便宜的版本，如 `Model A+`、`Model\
  \ B+` 或 `Raspberry Pi Zero`，这样如果你不知道自己在做什么，或者最终不喜欢 `树莓派` 的这种爱好者性质，你就不会花这么多钱。如果你想要一个持续时间更长且在硬件方面更有竞争力的项目，你应该绝对选择可用最新版本的\
  \ `树莓派`。根结底，这是一个预算问题。此外，如果你发现了一个想要参与的项目，你可能希望使用与创建该项目的人完全相同的树莓派版本，仅仅是因为这样做就不会出现任何“翻译错误”，在代码或脚本上也不会有任何障碍。\n\
  \n## 如何购买树莓派\n\n当你决定是时候全力投入并购买一个树莓派时，其实非常简单。首先，访问 `http://raspberrypi.org`。在顶部导航栏上，搜索图标下方有一个写着“Shop”（商店）的“标签”。点击它，你就会被带到树莓派在线商店。点击你喜欢的树莓派版本（如果你愿意，也可以利用这个机会更直接地比较规格），然后在相应的页面向下滚动。在页面下方一点，你会看到写着“Buy\
  \ from our distributors”（从我们的经销商处购买），然后按国家或地区划分的区域。某些链接无法跳转，但如果你从树莓派网站获得了一个损坏链接，只需尝试另一个，直到到达你想去的地方为止。\n\
  \n最终，你会发现自己位于拥有你想要使用的树莓派版本的商店。如果你想这样做，可以利用这个机会看看所有适用于树莓派的配件。不过我要提醒你一下；有很多配件。翻一翻，看看是否有任何你可能需要的项目灵感素材。树莓派是目前支持最好的微型板之一，我确定你一定能出点子。总之，一旦你确定了购买某个特定的树莓派，只需放松。你现在要做的就是等待你的新玩具寄到，然后开始玩，这应该不会太久……对吧？\n\
  \n## 软件\n\n现在我们讨论了硬件和在哪里购买树莓派之后，我觉得谈论驱动树莓派的软件也是恰好的。\n\n型号 2 和 3 的树莓派理论上可以运行任何适用于其架构的\
  \ ARM 操作系统。这在可以使用操作系统方面留下了巨大的选择空间。\n\n通常，大多数人会选择树莓派团队支持的操作系统 `Raspbian`，它是流行的 Linux\
  \ 操作系统 `Debian` 的衍生发行版。`Raspbian` 预装了大量工具，旨在帮助人们在几乎不花钱的情况下获得一个运行的操作系统，以及许多旨在以有趣的方式教人们（主要是孩子们）编程的工具。其中包括诸如\
  \ `Minecraft Pi` 等程序，让人们可以在玩我的世界的同时使用 `Python` 代码来改进游戏体验。此外，还包含了 MIT 创建的 `Scratch`，它通过拼图式的命令来演示程序流和计算机逻辑。\n\
  \n\n\n\n-   [虽然有很多选项可供选择，但如果你倾向于...] For you to truly get `Raspberry Pi` experience,\
  \ you should opt for `Raspbian`, but once you have more experience and want to start\
  \ experimenting, there are things such as `Windows10`, `Arch Linux`, `Gentoo`, `Ubuntu`,\
  \ `Kali Linux`, and `FreeBSD`. All of these have their own uses, depending upon\
  \ what you’re wanting to do and what your goal is with `Raspberry Pi`. But, for\
  \ right now, the `Raspbian` operating system is actually optimized for the `Raspberry\
  \ Pi` and has a huge number of packages just for it, so I highly recommend you work\
  \ with it.\n\n# 第三章\n\n## 设置\n\n此时，我假设你已经拿到你的 Pi。如果你还没有，你仍然可以跳到第 4 章练习，然后在 Pi 到位时再回到这里。如果你的\
  \ Pi 已经到位，那就完美了！你已经准备好进入这一章。本章将重点介绍如何让你的 Pi 运行起来。我主要针对 `Raspberry Pi 3`，但无论你使用的是哪个版本的\
  \ Pi，这些说明大致相同。根据需要进行调整即可。\n\n下面是你为本章需要准备的事项：\n\n- **Raspberry Pi**: 这不言而喻。你需要一个\
  \ `Raspberry Pi` 来进行设置。\n- **屏幕（任何形式，带有 `HDMI` 输入）**: 可以是电视或显示器，差别不大。关键是，无论是哪种，它都必须具备\
  \ `HDMI` 输入。Pi 只提供 `HDMI` 输出，所以你使用的屏幕必须能够接受 `HDMI`。\n- **USB 外设**: 你需要能够控制 Pi。`USB`\
  \ 连接的键盘和鼠标是最佳选择。\n- **MicroSD 卡**: 你至少需要一个 8GB 的 `MicroSD 卡` 供 Pi 使用。所有数据都从 Pi 的\
  \ `SD 卡` 读取。在大多数电脑上，你会有外部硬盘（如 `SATA` 驱动），而 Pi 则使用 `SD 卡`。你其实可以让 Pi 从 `USB` 驱动或外部硬盘读取，但\
  \ `SD 卡` 是最直接、最简便的方法。\n- **电源**: Pi 的电源是 `microUSB`。这种连接方式与大多数智能手机的供电方式相同。线材必须能够提供\
  \ 2.5 安培，否则你会给 Pi 供电不足并可能烧毁它——这比你想象的要容易！请确保使用正确的电压。如果不确定，请参阅第 6 章并向他人咨询。\n- **NOOBS**:\
  \ 安装建议的 `Raspberry Pi` Linux 发行版 `Raspbian` 以前相当困难。最近（至少在相对意义上），`Raspberry Pi` 团队推出了一个名为\
  \ `NOOBS`（“新出于盒装软件”）的实用程序，使过程大幅简化。不再需要通过 `Terminal` 手动将 `Raspbian` 复制到 `SD card`；只需获取\
  \ `NOOBS` 即可。你可以在 [`www.raspberrypi.org/downloads/noobs/`](https://www.raspberrypi.org/downloads/noobs/)\
  \ 下载 `NOOBS` —  — 选择离线安装版，因为该版本会随操作系统一起提供。\n\n下面是操作步骤。第一步是将你的 `microSD card` 插入你的电脑。具体操作取决于你的电脑对\
  \ `SD cards` 的设置；你可能需要购买读卡器或 `microSD` 到 `SD` 适配器。例如，我的电脑支持 `SD cards` 但不支持 `microSD\
  \ cards`，这就是需要适配器的情况。\n\n卡连接到电脑后，你需要将其格式化为 `FAT`。这很简单。\n\n### FAT 格式, Windows\n\n\
  只需插入 `SD card`，然后打开 `Windows Explorer`（旧版 Windows 称其为 “My Computer”）。在屏幕左侧面板中找到\
  \ `SD` 存储设备。右键单击它，然后选择 “Format…”。确保里面没有需要备份的敏感数据。如果有，请先将文件复制到电脑上，然后再格式化。完成后进行格式化。只需选择\
  \ `(MS-DOS) FAT` 并为驱动器命名即可。\n\n### FAT 格式, Mac\n\n打开 `Disk Utility`，并确保已选中正确的卷。如果误选了错误的卷，你可能会丢失重要信息并格式化错误的驱动器！这非常不\
  \ desirable。确认选中正确的驱动器且 `SD card` 上没有重要信息后，点击 “Erase...”，格式类型选择 “MS-DOS”。\n\n###\
  \ FAT 格式, Linux\n\n如果你还没有 `gparted`（你是 `Linux` 用户，当然会有），请获取它。在 `gparted` 中选择合适的驱动器，再次确保选中的是正确的驱动器，然后格式化为\
  \ `fat32`。很简单。\n\n现在，完成以上步骤后，你应该拥有一个已格式化的 `SD card`，准备好安装 `NOOBS` 文件。你只需解压下载的 `NOOBS`\
  \ 压缩包到一个文件夹，然后将所有文件复制到 `SD card` 上（根据电脑速度可能需要几分钟）。随后，插入 `microSD card` 到你的 `Raspberry\
  \ Pi`。接着，开始连接所有必要的线缆到 Pi。最后，请先插入电源，因为 Pi 会在通电时开机。\n\n\n\n\n![](img/00002.jpg)\n\n\
  ## 编程基础\n\n终于，我们来到了你最初购买这本书的目的所在。在本章中，我们将讨论许多编程背后的基础和理念，这些是你为了充分利用树莓派（Raspberry\
  \ Pi）及其背后的硬件所需要的。\n\n有好消息也有坏消息；我先从坏消息开始。坏消息是，提供极其具体的细节是非常的，因为每个项目都有自己的特殊领域、库和要求。我不能简单地告诉你如何为某个项目编写脚本，然后让它神奇地应用到现有的每一个项目中。但我可以教你的是构建几乎每一个树莓派脚本的底层概念，对于如果你希望成为一名精通树莓派的程序员和爱好者来说，这些概念同样至关重要。\n\
  \n这就是好消息上场的地方：你现在就可以开始了。你不需要等你的树莓派到货。事实上，如果我是你，我不会等。在树莓派上进行编程不可避免地会很痛苦，而且如果你有一台电脑，你实际上更适合在电脑上练习技能，这样你就可以处理比在树莓派上更“标准”的键盘/鼠标/显示器设置了。当然，这是主观的，取决于你的经验。\n\
  \n你之所以可以这样做，是因为几乎每一个树莓派脚本运行在 `Python` 上。那么什么是 Python？Python 是一种超级实用的编程语言，它几乎是从 `C++`\
  \ 和 `Java` 等语言的灰烬中产生的。如果你不知道它们是什么，它们本身也是编程语言，比 Python 要复杂得多。（我保证我有说明这一点！）\n\n听着，编程一直有一个特定的目的：解决问题。因此，每种编程语言都是为了解决不同类型而定制的。在计算机历史早期，语言极其晦涩。这部分是因为每一比特存储和内存使用都至关重要，而且必须对内存分配和程序大小有完全的控制。这就是\
  \ `C` 等语言登场的地方。然而，同时，必须有一种对数学家友好的编程语言，他们从编写程序中受益匪浅，但不擅长计算机；这就是 `Fortran` 的用武之地。其他语言也有自己的领域；`Lisp`\
  \ 是为栈式编程设计的。当计算能力变得强大后，面向对象的编程作为组织项目的主导手段成为前沿，而面向对象编程的冠军是 `Java`。在 `Java` 出现不久之前，`C`-风格内存维护的理念和面向对象编程的出现结合在一起，形成了一种名为\
  \ `C++` 的极具影响力的语言。列表还在继续。\n\nPython 是一种脚本语言，而脚本语言也有自己的领域。脚本语言的编写考虑了两个目的。\n\n第一个是，理想情况下，脚本可以在一台电脑上编写，然后在任何地方解释。这意味着如果我在我的\
  \ `Windows` 笔记本电脑上写了一个脚本，并把它发送给使用 `iMac` 的朋友，他们仍然可以完全没有问题地运行该脚本。情况并非总是如此，还有一些相当晦涩的脚本语言，但大多数情况下，它们运行在自己的特殊环境中。\n\
  \n第二个是脚本具有快速的部署时间。这意味着它们中的代码编写速度可以比在另一种语言中更快。比较一下 `Java` 中的这段代码片段：\n\n```\npublic\
  \ class myFile {\n    public static void main(String args[]) {\n        System.out.println(\"\
  Hello world!\");\n    }\n}\n```\n\n与 `Python` 中的这段代码片段相比：\n\n```python\nprint \"\
  Hello world!\"\n```\n\nPython 的片段要短得多。这正是意图所在。脚本语言也有其缺点——坦率地说，在你目前的学习阶段并不会理解这些缺点。但大多数情况下，它们在编写代码花费的时间上是非常高效的，而且与\
  \ `C` 这样的语言相比，它们的学习曲线也相当简单。\n\n那么我说这些的意义何？嗯，你可以在任何电脑上练习 `Python` 编程，然后毫无问题地将其传输到树莓派上。你只需要一个\
  \ `Python` 副本和一个文本编辑器。\n\n本章的重点是让你熟悉编程中我认为可能会让你感到困惑的所有各种怪癖。当你看到那些已经完成项目的人编写的脚本时，这些课程可能看起来并不重要，但当你仔细观察那些脚本时，你会发现底层概念——数据类型、算术、方法等等——是非常普遍的。如果你不知道这些概念是什么，你就指望用脚本做任何事情。\n\
  \n## 安装 Python\n\n那么，让我们从开始起。要开始 `Python` 编程，你需要做的第一件事就是，嗯，获取 `Python`。许多电脑已经安装了它。如果你运行\
  \ `Linux` 或 `Mac`，那么很有可能你已经有了。你可以通过打开 `Terminal`（在 `Mac` 或 `Linux` 中）或 `PowerShell`（在\
  \ `Windows` 中）并输入 `python` 然后按回车来测试。如果你安装了 `Python`，它应该执行一个程序。如果没有，它应该给你抛出一个错误信息。\n\
  \n如果它执行了一个程序，查看程序文本看写了什么。如果显示“Python 3.x”，你需要卸载它并改为获取 `Python 2`。原因很简单：大多数 `Python`\
  \ 脚本是用 `Python 2` 编写的，因为它一直是长期版本。我们在本章中学习 `Python 2`。`Python 2` 和 `Python 3` 之间有很多东西是可以转换的，如果你需要迁移到\
  \ `Python 3` 非常容易。但大多数情况下，如果一个工具是为 `Python 3` 编写的，它也会为 `Python 2` 编写；然而，通常情况反之。由于由于原因，在现在教学和使用\
  \ `Python 2` 是容易的。\n\n如果你没有安装 `Python`，或者你刚刚卸载了 `Python 3` 并想要 `Python 2`，你需要访问\
  \ `http://python.org`。这是 `Python` 的官方网站，你可以在这里找到适用于任何操作系统的 `Python` 副本。\n\n之后，你需要获取一个你喜欢的文本编辑器。在树莓派内部，你将在很大程度上使用控制文本编辑器\
  \ (`Nano`)，但在你的练习电脑上，你可以使用任何你喜欢的工具。它只需要是一个你理解并且你习惯于使用或乐于学习使用的工具即可。我个人非常喜欢 `Atom`\
  \ 文本编辑器，你可以在 `http://atom.io` 获取适用于 `Windows`、`Mac` 和 `Linux` 的版本。喜欢 `Atom` 的理由有很多，但最大它是免费的，并且有大量的旨在让你的生活更简单的插件。\n\
  \n一旦你有了特定的文本编辑器，花一点时间了解它。尝试创建一个新文件、保存它、创建一个项目路径（如果适用）等等。本质上，学习你将要用到的功能。到这时，你应该也设置好了树莓派——你将受益于进入控制台、启动\
  \ `Nano` 并学习如何用它创建、保存、打开和编辑文件。信不信由，这相对简单且有趣。\n\n无论如何，回到你的练习电脑，我们将学习 `Python` 的基础知识，使你能够处理他人的脚本，并最终编写自己的脚本。在此之前，我们还需要做最后一件事。\n\
  \n通过 `Terminal` 或 `PowerShell` 启动 `Python`。如果到目前为止一切按计划进行，你应该看到类似：\n\n```\n>>> Python\
  \ 2.7.12\n```\n\n\n\n\n后面还有一些文本。如果你没看到这些内容并且正在运行 Windows 系统，请确保你已经为 Python 设置了 `PATH`\
  \ 变量。\n\n一旦 Python 运行，输入以下内容：\n\n```\nprint “hello world”\n```\n\n控制台应该打印出 hello\
  \ world。如果是这样，那么恭喜你！你刚刚写了你的第一行 Python 代码；我希望你觉得很有成就感！写完那行代码后，继续输入 `exit()`。这将终止控制台中的\
  \ Python 解释器。\n\n在接下来的课程中，我鼓励你创建自己的文件并尝试这些概念。\n\n## 变量和数据操作\n\n所以，我们正试图在较短的空间内涵盖相当的内容。这意味着其中一些解释可能看起来有些简略，但我并不是故意让它们变得如此——我只是不想在小事上浪费你的时间，而是想涵盖更重要的内容，以免浪费你的时间。\n\
  \n在程序中，有被称为“数据类型”的东西。这些数据类型代表不同形式的不同信息。计算机读取一切都是位（bits）和字节（bytes）；即 1 和 0。我们人类没有那么幸运能以非黑即白的二进制方式思考，所以我们真的必须对事物进行分类和解析。那么，这意味着不同类型的数据被我们和计算机的解释方式是不同的。\n\
  \n例如，如果我给你单词“oyster”（牡蛎）和数字 472，你会说它们是互无关的。对吧？因为它们确实互无关。其中是一个数字，另一个是一个单词。数据类型也是类似的。如果我给你两个单词或两个数字，而你又知道我想表达什么，你就能清楚地看到我在两者之间架起的桥梁。\n\
  \n所以假设你有一个值并想存储它。你要怎么做呢？答案很简单：变量。变量就像代数中的变量一样。`X` 可以是我们想要的任何值，只要它符合方程的要求，对吧？`X`\
  \ 可以取任何值。变量也是如此。我们可以设置定义变量值的“方程”。\n\n在编程的早期时代，你必须定义变量的“类型”。如果你有一个数字，你必须说“数字 x 是一个整数”，或者如果你必须存储某的名字，你必须说“单词\
  \ name 是一个字符串”。嗯，脚本语言既是祝福也是诅咒，因为这种事情已经不再需要了。脚本语言缓解了那种类型定义。这被称为隐式类型。\n\n假设我们想存储某人的名字，名字叫\
  \ Jerry。我们只需创建一个新值，如下所示：\n\n```\nname = “Jerry”\n```\n\n假设我们想存储朋友 Jerry 的年龄——他 42\
  \ 岁。\n\n```\nage = 42\n```\n\n嗯，多亏于我们将这些相关信息存储在变量中，我们稍后可以调用它们。如果我们输入：\n\n```\nprint\
  \ “My friend %s is %d years old.” % (name, age)\n```\n\n它将打印存储在 `name` 和 `age` 中的任何值。所以在在这种情况下，它会打印“My\
  \ friend Jerry is 42 years old.”超级简单。\n\n在 Python 中，有几种类型——\n\n| float | 小数数字 |\
  \ 3.14 |\n| :--- | :--- | :--- |\n| integer | 整数 | 7 |\n| string | 字符序列 | “Skate\
  \ park” |\n| boolean | 真/假 | True |\n\n还有更多，但这些是最大的。\n\n## Python 数学\n\n猜猜计算机在做什么？它们进行计算。而且它们非常、非常、非常擅长此道。难怪编程语言字面上讲为了为了数学而设计的。这里没什么好展示的，我会简要说明一下：\n\
  \n| numberOfCats = 4 + 3 | # numberOfCats 将是 7 |\n| numberOfDogs = 8 / 2 | # numberOfDogs\
  \ 将是 4 |\n| numberOfHamsters = 3² | # numberOfHamsters 将是 9 |\n\n记录一下，带有井号（#）的部分是注释。代码会忽略这些内容。当你输入井号（#`）时，你是在告诉编译器——读取并运行你代码的程序——忽略该行中井号之后的任何内容。简单的概念，当然，但值得涵盖。\n\
  \n## 存在，还是不存在？布尔值和比较运算符\n\n等下当我们处理 if/else 语句时，这里会变得意义得多，但现在，只需关注 True（真）或 False（假）的概念即可。某物可以存在，也可以不存在。\n\
  \n如果我说“3 小于 7”，那是它是真的（true）的。如果我说“7 小于 6”，那么它是假的（false）的。我们允许在 Python 中进行这类评估。事实上，我们被鼓励这样做。\n\
  \n```\nnumber1 = 4\nnumber2 = 5\nprint number1 < number2\n```\n\n这会打印“True”，因为它是真的——5\
  \ 大于 4。这是不言自明的，对吧？Python 看到你进行了比较，它会尝试判断该比较是否准确。如果是，它就返回 `True`。如果不是，它就返回 `False`。\n\
  \n你可以将这些评估存储在变量中。\n\n```\nnumber1 = 4\nnumber2 = 5\neval = number1 < number2\nprint\
  \ eval\n```\n\n这会打印“True”，因为 Python 评估了“number1 < number2”是否为真，并将该评估保存到变量 `eval`\
  \ 中。就像高中里害羞的孩子一样，在 Python 中有很多方法让事物进行自比比较。这里是基础的：\n\n| < | 小于 |\n| :--- | :--- |\n\
  | > | 大于 |\n| <= | 小于等于 |\n| >= | 大于等于 |\n| != | 不等于 |\n| == | 等于 |\n\n既然说了这个话题，要极度小心\
  \ `==` 和 `=` 之间的区别。后者是赋值运算符——用于给变量赋值。前者是比较运算符——用于比较两个值。\n\n## If 和 else\n\n我知道，我们过这些过得非常快。\n\
  \n每个程序的生命周期中总有一个时刻它们必须做出重大决定，这只是成长的一部分。你可以利用条件语句来促进这种决策过程。让我们从一个开始。\n\n```\nbananas\
  \ = 3\nif bananas == 3:\n    print “I have three bananas!”\n```\n\n这个程序做的是是将数字 3\
  \ 赋值给 `bananas`。然后它运行一个检查来看 `bananas` 是否等于 3。如果是，它打印“I have three bananas.”。棒极。如果不是，它就打印……什么都没有。嗯，这真是个棘手。好了。我们如何修复它？我们可以使用\
  \ `else` 语句作为兜底，以防 if 条件不满足。\n\n```\nif bananas == 3:\n    print “I have three bananas!”\n\
  else:\n    print “Huh, well, I don’t seem to have three bananas.”\n```\n\n在这种情况下，如果\
  \ `bananas` 是 3，程序将打印它有 3 根香蕉。如果不是，它将感到困惑并非常清楚地表达出来。但如果它有 0 根香蕉并且很难过并想表达这一点呢？我们已经检查了是否有\
  \ 3 根，不能也检查是否有 0 根，对吧？\n\n错误。这就是 if else 语句派上用场的地方。\n\n让我们在这里加入一个针对 0 根香蕉的 if else\
  \ 语句。观察：\n\n```\nif bananas == 3:\n    print “I have three bananas!”\nelif bananas\
  \ == 0:\n    print “I have no bananas, and this is a problem.”\nelse:\n    print\
  \ “Huh, well, I don’t seem to have three bananas.”\n```\n\n在这种情况下，它检查 `bananas`\
  \ 是否为 3。如果不是，它会检查下一个条件。如果 `bananas` 不是 0，它最终移动到 `else` 语句。if/else 块会在解析到 else 语句之前检查每个条件。\n\
  \n## 列表\n\n有时你需要将连接的值存储在一起。这在 Python 中超级简单。假设我们需要存储学生的成绩。\n\n```\nstudent1Grades\
  \ = [95, 94, 83, 87, 79, 91]\n```\n\n完美。你现在有一个包含 6 个成绩的列表。你可以访问其中的任何一个。但记住，计算机计数从\
  \ 0 开始，而不是从 1。所以如果你想打印列表中的第一个项，你应该使用：\n\n```\nprint student1Grades[0]\n```\n\n##\
  \ # 会打印 95\n\n你可以超级简单地向列表添加项。\n\n```\nstudent1Grades.append(86)\n```\n\n\n\n\n\n\
  你只需要使用 `del` 关键字并提供它们的索引位置即可删除它们。\n\n```python\ndel student1Grades[3] # 将删除索引为“3”的值，即列表中的第四个元素\
  \ - 87\n```\n\n这将删除 `87`并将 `87` 之前的所有内容向后移动一个索引位置。\n\n## 循环\n\n循环是处理程序流的另一种方式。Python\
  \ 中有两种循环：`for` 循环和 `while` 循环。我们将从 `while` 循环开始，因为它们更容易理解。\n\n`while` 循环只要满足条件，就会重复执行：\n\
  \n```python\nx = 1\nwhile x < 10:\n    print x\n    x += 1 # 将 x 加 1 - 等于“x = x\
  \ + 1”\n```\n\n这个循环将打印从 `1` 到 `10` 的数字。\n\n`for` 循环稍有不同，特别是在 Python 中；`for` 循环专门用于遍历列表。让我们以前之前的\
  \ `student1Grades` 示例。如果我们想打印该列表中的每一个成绩，可以这样做：\n\n```python\nstudent1Grades = [95,\
  \ 94, 83, 87, 79, 91]\nfor i in student1Grades:\n    print i # 将打印 95，然后 94，然后 83\
  \ 等……\n```\n\n然而，你也可以用 `for` 循环完成与 `while` 循环相同类型的迭代；它并不专门用于列表遍历。要从 `1` 计数到 `10`，你可以这样做：\n\
  \n```python\nfor num in range(1,10):\n    print num\n```\n\n注意，你可以在 `for` 循环中将迭代变量命名为任何名称。注意这次使用的是\
  \ `num`，而上一次是 `i`。这些关键的小细节将帮助你以后避免困惑。\n\n## 方法\n\n这是本章中要涵盖的最后一个绝对重要的内容。方法是每个优秀程序的基础。它们允许你以非常模块化的方式分解代码，并将程序分为逻辑序列。它们还能防止你反复复制和粘贴代码，使你的代码比通常情况下要漂亮得多。\n\
  \n方法的基本设置如下：\n\n```python\ndef methodname(arguments, if any):\n    # 代码在此处\n```\n\
  \n参数（Arguments）是你可以作为值传递给方法进行处理的内容。\n\n让我们以计算正方形面积的方法为例：\n\n```python\ndef computeArea(length,\
  \ width):\n    print length * width\n```\n\n这样做将允许某人“调用”该方法，如下：\n\n```python\ncomputeArea(3,\
  \ 4)\n```\n\n然后获取给定的参数并对其进行处理。参数不是必须的，但在许多情况下很有帮助。并不是每个函数都会接收参数；某些方法只具有独立用途。\n\n\
  前面的方法将打印 `length * width`，或者说我们刚刚调用的 `3 * 4`。因此，它会打印 `12`。\n\n但是，如果我们不想让它仅仅打印东西呢？一旦打印了值，它就消失了，没有被存储。我们该如何保留这个值呢？这就是返回（returning）发挥作用的地方。\n\
  \n```python\ndef computeArea(length, width):\n    return length * width\n```\n\n\
  这不会打印 `length * width` 的值；而是将它返回。由于它返回了值，这意味着我们可以存储它。假设我们有以下代码：\n\n```python\ndef\
  \ computeArea(length, width):\n    return length * width\n\nl = 3\nw = 6\narea =\
  \ computeArea(l, w)\n```\n\n变量 `area` 将获得 `3 * 6` 或或 `18` 的值，因为我们将变量 `l` 和 `w` 传递给了方法，而方法返回了这些参数相乘的值。\n\
  \n方法在保持代码整洁以及自动化处理你原本必须处理得极其杂乱的过程方面非常有用。出于这个原因，练习这些方法并尽可能地积累相关技能是一个好主意。\n\n## 结语\n\
  \n我们涵盖了编程的许多大基础知识。你还没有准备好去写一个巨大的 15,000 行的程序——没有人在经过一个简单的上手课程后就能做到。然而，你现在知道自己在看什么了。通过时间的积累和接触，你将建立起成为专家程序员所需的技能。本章的重点是教你与树莓派以及你将要做的项目相关的编程基础。在追赶的过程中可能会非常沮丧，因为你将面对的很多项目在软件开发和硬件知识方面似乎领先你几个光年。你必须记住的关键是，每个人都必须从零开始——没有人天生就懂。最终，你会达到一个对任何项目都感到从容的状态。也许，如果你坚持下去，甚至会达到觉得自己领先别人几个光年的境界。\n\
  \n\n\n\nHackaday 是我提到的最后一个。这个社区比 Hackster 上的要紧凑一点。因此，其帖子的管理也稍微严格一些。因为帖子是根据点赞数自动排序，而不是根据日期或最后更新时间（你可以按这些标准排序，不用担心），所以很容易被误导去查看一个超级酷的项目，结果发现它的文件已经过时了，所以要留意项目实际上到底更新有多新、它使用的是哪个版本的\
  \ `Raspberry Pi` 等。很奇妙的是，这个网站在“展示与分享”类项目方面其实更糟糕，但没关系——人们创造了美妙且惊人的事物，他们就是想要展示出来！没问题。它是获取教程和灵感的绝佳来源。要访问\
  \ Hackaday 的树莓派项目，只需点击此链接：[`hackaday.io/projects/tag/raspberry%20pi`](https://hackaday.io/projects/tag/raspberry%20pi)\n\
  \n这些是我最喜欢的获取灵感和项目点意的三个资源。到目前，我已经用 `Raspberry Pis` 做了很多东西，这在很大程度上是因为从这些网站获得的灵感驱动。不过，这不仅仅是看别人的东西；记住，你所能的最棒的东西是你热爱的领域。找一种方法将你自己的热情融入你的下一个项目中。\n\
  \n## 第 6 章\n\n![](img/00002.jpg)\n\n## 你的第一个项目 - 便携式超级主机\n\n这是一个非常有野心的第一个项目，但如果你坚持下去并仔细按照说明操作，你会发现自己拥有了一个非常酷炫的成品。对于视频游戏爱好者来说，这是一个特别棒的项目。\n\
  \n我在书中已经多次提到人们如何使用 `Raspberry Pi` 构建诸如定制街机柜和便携掌持游戏机之类的东西。现在，你将追随他们的脚步，制作你自己的便携掌持游戏机。\n\
  \n所以，你可能想知道这和其他任何类似项目有什么不同？嗯，让这个特定项目脱颖出的最大因素是它要隐蔽得多。通过这个项目你获得的本质上是一个自包含的仿真站。更重要的是，如果你有一个喜欢游戏的孩子，他们可能非常喜欢和你一起完成这个项目。\n\
  \n更酷的是，这个主机看起来是自包含的，但你可以使用任何你喜欢的 `USB controller`，并玩几乎整个游戏历史上的游戏。`Raspberry Pi`\
  \ 唯一出现问题的是 `PS2` 和 `GameCube` 时代——在此之前的都是可以尝试的。\n\n这个项目的最佳目标主机是一个坏掉并闲置在家里的主机。越大越好，设计越平滑/平衡越好。例如，在原始项目中，我使用了一个被闲置很久的\
  \ `NES`。我确信，如果你是一个足够热爱的玩家并决定尝试这个项目，你会在某处拥有一台合适的主机。`NES` 是适合它的完美主机。然而，如果没有 `NES`，任何可以拆卸螺丝并轻松打开和关闭的设备都是棒的。\n\
  \n如果你手里没有闲置的旧坏主机，可以去 eBay 上以非常便宜的价格买到拆空/坏掉的主机。\n\n在进行这个项目时，你需要这些东西：\n\n- 一台坏掉的主机\n\
  - 合页（用于打开和关闭主机的“盖子”）\n- 永久记号笔\n- 带有钻塑料钻头的电钻\n- `Raspberry Pi 3`\n- 屏幕，对于这个建议你买一个小小的显示器。这个\
  \ 5 英寸的应该合适：[`www.amazon.com/Resistive-interface-compatible-Raspberry-Pi/dp/B00U21UA16`](https://www.amazon.com/Resistive-interface-compatible-Raspberry-Pi/dp/B00U21UA16)。关键目标是它在拆空和打磨后能够放入系统的上半部分——说到这儿……\n\
  - 许多不同目数的砂纸或打磨块\n- `USB controller` - 你可以使用任何喜欢的 `Xbox 360 controller`，甚至可以在 Amazon\
  \ 上买一个 `USB NES/SNES controller`。务必检查你买的任何种东西的评论，因为 Amazon 上的某些控制器绝对糟糕。为了质量多花几块钱是值得的——相信我。\n\
  - 可以放入普通 3.5 mm 耳机接口的耳机或扬声器。如果你使用扬声器，扁平的设计要好得多，因为它可以平衡屏幕带来的重量感。\n- 很重的亚麻布，比如旧窗帘\n\
  - 螺丝刀\n\n好了，既然我们已经备齐了所有必要的材料，让我们开始动工吧。我将作为示例使用的系统是一个 `NES`，因为我熟悉它，而且我以前在这个项目上用过它。然而，如果你没用\
  \ `NES`，基本概念是非常类似的。\n\n总之，回到 `NES`。你需要打开它。这非常简单。有一组螺丝将 `NES` 的下半部分固定在上半部分上。你只需要卸下那些螺丝即可。然后，你的\
  \ `NES` 应该就打开了。\n\n现在你需要取出所有的 `NES` 组件。我的意思是主板和所有的电线。不过，如果你愿意的话，可以留着按钮和控制器端口——它们为整个东西增添了某种很美感，而且看起来也很好。除了你决定留下的部分外，你要对它进行彻底拆空。多拆一点，不要少拆一点好——当涉及到重要组件时，你需要操作空间。\n\
  \n我已经告诉过你如何安装 `Raspbian` 了，所以我不想再重来一遍。坦率说，这会浪费你和我的时间。相反，我将假设你可以自己完成所有的 `Raspbian`\
  \ 设置。重要的部分是本指南实际上是关于 `RetroPie`。`RetroPie` 的作用是作为 `Raspbian` 的外壳。它让你在进入 `Raspbian`\
  \ 时，自动加载必要的仿真器包，并基本上瞬间射入你的游戏站中。\n\n实际上，有法律义务指出，除非你真的拥有你正在玩的游戏，否则使用仿真器是违法的。拥有你没有实体拷贝的游戏\
  \ `ROMs` 在字面意义上是非法的。有人来找你的概率极低、极低，但这种可能性确实存在。这是我在推卸责任并说“如果你玩非法 `ROMs` 别说我没警告过你”。\n\
  \n所以，现在开始 RetroPie 的安装。首先，你应该设置好了 `Raspbian`，并且你的 `Raspberry Pi` 应该连接了显示器。一旦 `Raspbian`\
  \ 设置好且我们连接了有线或无线网络，你需要打开 `Terminal`。\n\n在 `Terminal` 中，我们需要更新包。如果你不是非常精通，这非常简单。你只需要输入：\n\
  \n```\nsudo apt-get update\n```\n\n然后按回车。接着你输入：\n\n```\nsudo apt-get upgrade\n```\n\
  \n再次按回车。在完成这一切之后，你的包列表将完全更新，你就可以安装 `RetroPie` 了。\n\n差，差。`RetroPie` 有一组它必须拥有的依赖项，首先。你可以通过进入\
  \ `Terminal` 并从 `git` 仓库安装 `lsb-release` 来获取这些依赖项，如下：\n\n```\nsudo apt-get install\
  \ git lsb-release\n```\n\n完成后，我们只需要获取 `RetroPie` 安装脚本。这也很简单。\n\n> 只输入以下：\n\n```\n\
  cd\n```\n\n并按回车。这将让你进入 C 盘根目录。接下来，你做是从仓库获取 `RetroPie` 脚本，如下：\n\n```\ngit clone --depth=1\
  \ https://github.com/RetroPie/RetroPie-Setup.git\n```\n\n一旦脚本下载完成，你必须让它变得可以执行该脚本。这也很简单！首先，你进入\
  \ `RetroPie` 文件夹：\n\n```\ncd RetroPie-Setup\n```\n\n（大写很重要！注意这一点！）\n\n然后你修改权限：\n\
  \n\n\nchmod +x retropie_setup.sh\n\n然后你给文件夹授予管理员权限：\n\n```bash\nsudo ./retropie_setup.sh\n\
  ```\n\n如果这任何地方不工作，尝试在前面加上关键字 `sudo`，这将提升你到根权限。\n\n随后，你需要再次检查系统的 locale 是否正确。这是因为所有\
  \ RetroPie 模拟器运行所需的东西会使用特定的文件，这些文件会因用户的位置而有所不同。要检查这一点，只需在终端中运行 `locale`。\n\n确保一切已设置好。如果有什么未设置，则需要设置。\n\
  \n有一种非常简单的方法可以做到这一点。首先，确保你了解自己的 locale。例如，你的 locale 可能是 `en_US.UTF-6`。\n\n然后在下面的命令中将斜体的\
  \ `userLocale` 替换为该 locale：\n\n```bash\nsudo update-locale LC_ALL=\"userLocale”\n\
  ```\n\n当然包括引号。\n\n从此，我们只需要安装 RetroPie 本身。\n\n你可以选择全装或部分安装的两种不同方式来安装 RetroPie。如果你只想让某些系统可玩，那么肯定应该进行部分安装。但如果情况并非如此，则全装更加容易且功能更为丰富。\n\
  \n### 全部安装\n\n这里所要做的只是执行 RetroPie-Setup 脚本。当它开始执行时，你最终会看到一张显示“管理包”的屏幕。从这里，你只需切换“Quick\
  \ Install”，然后按回车键确认。这绝对是本书里最容易的事情之一，不是吗？全装安装时，它还会创建你用于存储 ROM 的精确文件夹。如果你基本上遵循本书的指示，它们将位于\
  \ `~/RetroPie/roms`。\n\n### 部分安装\n\n如果你担心 SD 卡的存储空间（或想使用的空间），则该方案更轻。使用此选项，你可以自行决定想要安装哪些模拟器以及哪些不想要安装。请记住，RetroPie\
  \ 运行需要几个必备包：\n\n* RetroArch，RetroPie 的用户界面\n* Emulation Station，系统的支柱，负责启动并整理你放在小文件夹中的\
  \ ROM。\n* RetroPie 菜单，相对显而易见\n* Runcommand，老实说不太确定它的作用，但听起来很重要，且缺少它无法运行\n\n因此你需要安装所有这些包。一旦它们被安装，你就可以浏览可用的包列表，决定想要（或不想要）安装哪些模拟器。\n\
  \n接下来，我们只需让 Emulation Station 在 Pi 启动时第一时间运行。切换此设置实际上非常容易。在 RetroPie 内部，你只需前往 `Setup\
  \ Script`，然后前往 Configuration and Tools 菜单，在那里会有一个 Autostart 子菜单。列出了许多 Pi 的启动条件，但你只需要切换第一个，即读作“开机时启动\
  \ Emulation Station”。\n\n你现在可以尝试重启 Pi，仅为确认一切运行正常。拔掉电源并重启 Pi。如果它在启动时直接进入 Emulation\
  \ Station，则说明你一切做得正确。如果它不这样做，则出现了问题，你需要回退步骤并弄明白哪里出了问题。\n\n如果一切运行正常，我们需要讨论如何在 Raspberry\
  \ Pi 上放置 ROM。把 ROM 放到 Pi 上最简便的方法，无疑是直接使用 USB 驱动器。因此，我将为你介绍此方法。\n\n因此，你首先需要将 USB\
  \ 驱动器格式化为 `FAT32`。我们之前谈过如何做到这一点，但那是针对 SD 卡的。然而，过程完全相同。只需遵循我们之前用于格式化 SD 卡的相同步骤，但针对\
  \ USB 驱动器。\n\n然后，在它格式化后，你打开驱动器并创建一个名为 `retropie` 的文件夹，正是这样。\n\n然后取出你主要电脑中的 USB 驱动器并插入你的\
  \ Pi。驱动器会开始闪烁，这表示正在发生活动的文件系统更改。这就是你想要的。当闪烁停止后，你只需取出驱动器。\n\n将其放回你原来的电脑中。你会看到许多之前不存在的新文件夹。这些是你放置\
  \ ROM 的地方。你只需将 ROM 拖动到对应的系统/模拟器的 ROM 文件夹中，然后即可使用。你可以根据驱动器的容量添加尽可能多的 ROM。传输可能需要一些时间完成，但它会发生的。\n\
  \n当传输完成后，将 USB 驱动器再插回 Pi。它会再次开始闪烁；请稍等。当一切完成后，你只需刷新 Emulation Station。你通过按下 `F4`\
  \ 键来完成。希望你能在 USB 上加载的所有新游戏直接显示在你面前供你游玩。\n\n因此，我们现在进入这项业务的最后阶段：将我们的主机变成真正属于我们自己的项目。我们的\
  \ Raspberry Pi 已经工作正常，RetroPie 为我们处理了所有繁重的工作。现在我们只需要完成项目的敲定。\n\n\n\n\n断开所有连接——如果你还没有这样做的话，甚至要把屏幕也离开\
  \ Pi——然后插上你所有的外设设备，如扬声器、电源、摇杆等。如果你的电源线无法穿过主机外壳，你可以直接钻一个大孔让它穿过去。不过，`microUSB` 连接应该没有问题地装好。然后将\
  \ Pi 放入就位并固定屏幕，屏幕会反过来固定在盖子的整个孔上，你只需要用螺母将其固定即可。在这里要格外小心，这一步非常容易出错。\n\n测试一下以确保一切运行正常。如果是的话，那么恭喜你！你现在拥有了一个自成一体的超级主机，能够玩几乎涵盖\
  \ 30 年的视频游戏。这真美妙。\n\n为了更上一层楼，如果你在选择显示器时明智地 de，显示器将能够通过 `HDMI` 直接将所有内容输出到另一个屏幕上。理论上，只要你有\
  \ `HDMI` 线缆、合适的显示器以及足够的专注精神，你就可以在巨大的投影仪或大平板液晶电视上运行这个系统。\n\n就是这样了。对于一个初学者来说，这是一个非常有野心的项目，我真为你能走到最后感到非常自豪。这绝对不是你与\
  \ `Raspberry Pi` 冒险的终点，我希望我为你提供了足够的方法，让你瞬间迸发出灵感。\n\n# 结论\n\n![](img/00002.jpg)\n\
  \n感谢你读完这本书，希望它内容充实，并能为你提供实现你目标所需的所有工具，无论你的目标是什么。接下来去哪里 - 社区与洞察 - 黑客精神（Hacking）是一个社区。\n\
  \n下一步就是直接投入其中。寻找吸引你的项目并开始做它们，或者构思一些你自己的想法并开始研究它们。\n\n在结束这本书之前，我想说几句话：关于黑客精神（hacking）。当许多人听到“黑客”这个词时，他们想的并不是那些厉害坏蛋。他们想到的是邮件丑闻、`LulzSec`\
  \ 或者躲在绿色终端后的黑暗房间里臭名昭著的人。但那并不是黑客精神。黑客精神远不止于。黑客是一种整体心态。黑客精神关于捣鼓和学习、体验、拆解事物、用旧物创造新物、创造、解决问题，以及在手段并不完全明显的情况下，做出真正、非常不可思议事情的灵性。\n\
  \n通过操作 `Raspberry Pi` 项目，你就是一个黑客。可能不是那种破解他人安全的黑客之类的，但你完全符合这个已经存在了 40 年的黑客亚文化。其原因在于，要真正尝试从无中创造出奇妙的事物，需要某种好奇心、灵性和驱动力。所以，当我说你是黑客时，我是发自内心地认为。通过拿起这本书，你证明了自己是一个黑客。\n\
  \n黑客是才华横溢的人，他们的工作值得赞誉。无论是在重要网络中寻找安全漏洞，无论是在破解电话线路（phreaking），无论是在车库里焊接电路板，还是仅仅在尝试让\
  \ `LED` 屏幕连接到 `Raspberry Pi` 以显示他们想要的文本，他们都是最终将推动世界进步的人。因为他们不仅看到了边界，还能看到边界在哪里断裂，并将边界向后推。我的意思是，朋友，你并不孤单。\n\
  \n今后，如果你有任何问题，有很多很棒的在线社区非常乐意解答各种关于 `Raspberry Pi` 以及其他你可能感兴趣的相关项目（如 `Intel Edison`、`Arduino`\
  \ 等）的问题。那里有大量的资深人士，包括手工爱好者和专业人士，他们非常乐意回答你可能任何问题。\n\n我推荐的两个是官方的 `Raspberry Pi` 论坛\
  \ [`www.raspberrypi.org/forums`](https://www.raspberrypi.org/forums) 以及 `Raspberry\
  \ Pi` 的 Reddit 子板块（拥有超过 150,000 名订阅者！）[`www.reddit.com/r/raspberry_pi/`](https://www.reddit.com/r/raspberry_pi/)。这两个都是非常棒且活跃的板块，让你获取答案并广泛参与整个\
  \ Pi 黑客社区。\n\n同时也请留意其他有问题的初学者，或者更好的是——正在尝试并失败的人。任何人都可以遵循教程，但学习发生在错误中。留意别人犯的错误，以及你自己犯的错误。理解为什么它们是错误，以及如何以其他方式处理让事情更顺畅。总而言之，当你使用\
  \ `Raspberry Pi` 时，尽量让每天都变得有趣、愉快并成为一种学习经历。\n\n最后，我只想感谢你读完这本书，希望我能提供一些价值的帮助和见解。我知道上手\
  \ `Raspberry Pi`——尤其是尝试直接开始编程——本身就是一项艰巨的任务。我真心地希望你在未来的任何项目中都能好运，并回想起阅读这本书的时光是美好的。\n\
  \n如果是这样，我非常希望你在 Amazon 上留下评论。即使你不喜欢，也请留下评价。正是像你们这样的人帮助我创作高质量的内容。\n\n非常感谢阅读，祝你一切顺利。\n"
