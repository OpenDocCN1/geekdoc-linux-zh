    ![](img/00002.jpg)


    恭喜你下载树莓派，感谢你的支持。


    后续章节将讨论你利用这种功能极其多样的树莓派计算微型板的无数方法——或者说，你如何让它为你所服务。


    如果你正在阅读这本书，我确定你至少听过关于这个非常精妙的小装置的一些事。也许你听说过人们在家里制作大型街机柜，他们和朋友可以在那里玩以前喜欢的游戏；也许你见过智能镜子，在人们早晨准备时时显示重要信息流；或者，你只是在网上偶然读了一篇关于它的文章，只想知道它们能做什么。


    更有可能的是，由于这是一本编程基础书籍，你正试图理解如何通过编写自己的脚本或使用他人的脚本来充分发挥树莓派的价值。


    无论你的理由是什么，我可以说，获取树莓派无疑是你近期做出的最明智的决定之一。你将能够用它做许多酷的事情，并在过程中学到很多技术和工程知识。


    市上有许多关于这个主题的书，再次感谢你选择这一本！我们已尽全力确保它包含尽可能多的有用信息，请享用！


    # 第一章


    ![](img/00002.jpg)


    ## 什么是树莓派？


    出于本书的意图和目的，我们将从零开始，并假设你一无所知。因此，为了做到这一点，我们必须从最基础的问题开始。最基础的问题是：什么是树莓派（Raspberry
    Pi）？


    正如我所说，树莓派在网上大量的科技 DIY 项目中非常显眼。此外，如果你和工程师或热爱技术的人是朋友，你可能有一两个朋友已经使用过树莓派并开展过项目。


    那么，树莓派究竟是什么呢？嗯，从最基础来说，它只是一堆零件。


    树莓派是由树莓派基金会于 2012 年开发的。该项目的初衷是开发一种超小且具有成本效益的计算机，用于向发展中国家的学生和那里的儿童教授编程和计算机科学的基本概念，在这些情况下，可用资金通常非常匮乏。


    树莓派的设计意图之一是它应该是可扩展的。这意味着它应该是非常开放的；你应该能够为它购买许多改装和硬件选项，并轻松地使用它们。我们将在下一章中详细讨论这一点。


    树莓派的成功远超了它的原始意图。正如我所说的，它的初衷仅仅是帮助资金紧张的地区——如发展中国家的公立学校——培养编程和计算机科学知识，但它很快变成了全球各地科技爱好者最喜爱的玩具，因为它让你能以极少的投入完成很多事情。


    事实上，在一个极具成本效益的微型板中封装了相当强大的计算能力。然而，我们将在下一章同样讨论这一点。


    那么，树莓派究竟是什么？嗯，它是通往可能的门户。当你获得一个树莓派时，你实际上获得了可以用它做的一百万种不同的事情。你可以设置一套自动浇水系统。你可以在你的孩子玩《我的世界》时教他们如何编程。你可以做诸如获取天气自动更新并制作一个早上向你播报天气的闹钟的事情。简而言之，树莓派让你能够以很低的成本做很多事情。你所需要的只是购买树莓派的初始资金、项目材料的开支，以及实现这些目标的才智和技巧。


    说了这么多，我想你对树莓派的概念已经有了一个大致的了解，但在结束本章之前，我将再次总结一下：树莓派是一种微型计算机，对于其小尺寸来说，拥有极其强大的处理能力。许多树莓派型号只比信用卡稍大一点！凭借它的处理能力，你能够完成许多以前梦寐以求的事情。


    # 第二章


    ![](img/00002.jpg)


    ## 内部构造


    现在我们已经知道树莓派是什么了，我们需要知道驱动它的动力。从根本上说，树莓派只是一个微型计算机；一组焊接在微小、实用的包装中的计算机零件集合。


    然而，尽管体积很小，但树莓派通常相当强大。此外，目前市场上有几个版本可以让你买到。在本章中，我们将讨论每个树莓派型号硬件规格以及它们对你意味着什么。此外，在章节后后部分，我们将讨论可以驱动树莓派的软件。


