    -   [虽然有很多选项可供选择，但如果你倾向于...] For you to truly get `Raspberry Pi` experience, you
    should opt for `Raspbian`, but once you have more experience and want to start
    experimenting, there are things such as `Windows10`, `Arch Linux`, `Gentoo`, `Ubuntu`,
    `Kali Linux`, and `FreeBSD`. All of these have their own uses, depending upon
    what you’re wanting to do and what your goal is with `Raspberry Pi`. But, for
    right now, the `Raspbian` operating system is actually optimized for the `Raspberry
    Pi` and has a huge number of packages just for it, so I highly recommend you work
    with it.


    # 第三章


    ## 设置


    此时，我假设你已经拿到你的 Pi。如果你还没有，你仍然可以跳到第 4 章练习，然后在 Pi 到位时再回到这里。如果你的 Pi 已经到位，那就完美了！你已经准备好进入这一章。本章将重点介绍如何让你的
    Pi 运行起来。我主要针对 `Raspberry Pi 3`，但无论你使用的是哪个版本的 Pi，这些说明大致相同。根据需要进行调整即可。


    下面是你为本章需要准备的事项：


    - **Raspberry Pi**: 这不言而喻。你需要一个 `Raspberry Pi` 来进行设置。

    - **屏幕（任何形式，带有 `HDMI` 输入）**: 可以是电视或显示器，差别不大。关键是，无论是哪种，它都必须具备 `HDMI` 输入。Pi 只提供
    `HDMI` 输出，所以你使用的屏幕必须能够接受 `HDMI`。

    - **USB 外设**: 你需要能够控制 Pi。`USB` 连接的键盘和鼠标是最佳选择。

    - **MicroSD 卡**: 你至少需要一个 8GB 的 `MicroSD 卡` 供 Pi 使用。所有数据都从 Pi 的 `SD 卡` 读取。在大多数电脑上，你会有外部硬盘（如
    `SATA` 驱动），而 Pi 则使用 `SD 卡`。你其实可以让 Pi 从 `USB` 驱动或外部硬盘读取，但 `SD 卡` 是最直接、最简便的方法。

    - **电源**: Pi 的电源是 `microUSB`。这种连接方式与大多数智能手机的供电方式相同。线材必须能够提供 2.5 安培，否则你会给 Pi 供电不足并可能烧毁它——这比你想象的要容易！请确保使用正确的电压。如果不确定，请参阅第
    6 章并向他人咨询。

    - **NOOBS**: 安装建议的 `Raspberry Pi` Linux 发行版 `Raspbian` 以前相当困难。最近（至少在相对意义上），`Raspberry
    Pi` 团队推出了一个名为 `NOOBS`（“新出于盒装软件”）的实用程序，使过程大幅简化。不再需要通过 `Terminal` 手动将 `Raspbian`
    复制到 `SD card`；只需获取 `NOOBS` 即可。你可以在 [`www.raspberrypi.org/downloads/noobs/`](https://www.raspberrypi.org/downloads/noobs/)
    下载 `NOOBS` —  — 选择离线安装版，因为该版本会随操作系统一起提供。


    下面是操作步骤。第一步是将你的 `microSD card` 插入你的电脑。具体操作取决于你的电脑对 `SD cards` 的设置；你可能需要购买读卡器或
    `microSD` 到 `SD` 适配器。例如，我的电脑支持 `SD cards` 但不支持 `microSD cards`，这就是需要适配器的情况。


    卡连接到电脑后，你需要将其格式化为 `FAT`。这很简单。


    ### FAT 格式, Windows


    只需插入 `SD card`，然后打开 `Windows Explorer`（旧版 Windows 称其为 “My Computer”）。在屏幕左侧面板中找到
    `SD` 存储设备。右键单击它，然后选择 “Format…”。确保里面没有需要备份的敏感数据。如果有，请先将文件复制到电脑上，然后再格式化。完成后进行格式化。只需选择
    `(MS-DOS) FAT` 并为驱动器命名即可。


    ### FAT 格式, Mac


    打开 `Disk Utility`，并确保已选中正确的卷。如果误选了错误的卷，你可能会丢失重要信息并格式化错误的驱动器！这非常不 desirable。确认选中正确的驱动器且
    `SD card` 上没有重要信息后，点击 “Erase...”，格式类型选择 “MS-DOS”。


    ### FAT 格式, Linux


    如果你还没有 `gparted`（你是 `Linux` 用户，当然会有），请获取它。在 `gparted` 中选择合适的驱动器，再次确保选中的是正确的驱动器，然后格式化为
    `fat32`。很简单。


    现在，完成以上步骤后，你应该拥有一个已格式化的 `SD card`，准备好安装 `NOOBS` 文件。你只需解压下载的 `NOOBS` 压缩包到一个文件夹，然后将所有文件复制到
    `SD card` 上（根据电脑速度可能需要几分钟）。随后，插入 `microSD card` 到你的 `Raspberry Pi`。接着，开始连接所有必要的线缆到
    Pi。最后，请先插入电源，因为 Pi 会在通电时开机。

