    \n```python\nstudent1Grades = [95, 94, 83, 87, 79, 91]\nfor i in student1Grades:\n\
    \    print i # 将打印 95，然后 94，然后 83 等……\n```\n\n然而，你也可以用 `for` 循环完成与 `while` 循环相同类型的迭代；它并不专门用于列表遍历。要从\
    \ `1` 计数到 `10`，你可以这样做：\n\n```python\nfor num in range(1,10):\n    print num\n\
    ```\n\n注意，你可以在 `for` 循环中将迭代变量命名为任何名称。注意这次使用的是 `num`，而上一次是 `i`。这些关键的小细节将帮助你以后避免困惑。\n\
    \n## 方法\n\n这是本章中要涵盖的最后一个绝对重要的内容。方法是每个优秀程序的基础。它们允许你以非常模块化的方式分解代码，并将程序分为逻辑序列。它们还能防止你反复复制和粘贴代码，使你的代码比通常情况下要漂亮得多。\n\
    \n方法的基本设置如下：\n\n```python\ndef methodname(arguments, if any):\n    # 代码在此处\n```\n\
    \n参数（Arguments）是你可以作为值传递给方法进行处理的内容。\n\n让我们以计算正方形面积的方法为例：\n\n```python\ndef computeArea(length,\
    \ width):\n    print length * width\n```\n\n这样做将允许某人“调用”该方法，如下：\n\n```python\n\
    computeArea(3, 4)\n```\n\n然后获取给定的参数并对其进行处理。参数不是必须的，但在许多情况下很有帮助。并不是每个函数都会接收参数；某些方法只具有独立用途。\n\
    \n前面的方法将打印 `length * width`，或者说我们刚刚调用的 `3 * 4`。因此，它会打印 `12`。\n\n但是，如果我们不想让它仅仅打印东西呢？一旦打印了值，它就消失了，没有被存储。我们该如何保留这个值呢？这就是返回（returning）发挥作用的地方。\n\
    \n```python\ndef computeArea(length, width):\n    return length * width\n```\n\
    \n这不会打印 `length * width` 的值；而是将它返回。由于它返回了值，这意味着我们可以存储它。假设我们有以下代码：\n\n```python\n\
    def computeArea(length, width):\n    return length * width\n\nl = 3\nw = 6\narea\
    \ = computeArea(l, w)\n```\n\n变量 `area` 将获得 `3 * 6` 或或 `18` 的值，因为我们将变量 `l` 和 `w`\
    \ 传递给了方法，而方法返回了这些参数相乘的值。\n\n方法在保持代码整洁以及自动化处理你原本必须处理得极其杂乱的过程方面非常有用。出于这个原因，练习这些方法并尽可能地积累相关技能是一个好主意。\n\
    \n## 结语\n\n我们涵盖了编程的许多大基础知识。你还没有准备好去写一个巨大的 15,000 行的程序——没有人在经过一个简单的上手课程后就能做到。然而，你现在知道自己在看什么了。通过时间的积累和接触，你将建立起成为专家程序员所需的技能。本章的重点是教你与树莓派以及你将要做的项目相关的编程基础。在追赶的过程中可能会非常沮丧，因为你将面对的很多项目在软件开发和硬件知识方面似乎领先你几个光年。你必须记住的关键是，每个人都必须从零开始——没有人天生就懂。最终，你会达到一个对任何项目都感到从容的状态。也许，如果你坚持下去，甚至会达到觉得自己领先别人几个光年的境界。\n\
    \n"
