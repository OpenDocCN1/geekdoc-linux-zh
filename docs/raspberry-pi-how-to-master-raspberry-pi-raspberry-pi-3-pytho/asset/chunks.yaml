    Hackaday is the last one that I mentioned. This community is a little tighter
    than the one on Hackster. The posts are thus a little bit more tightly regulated,
    too. Because the posts are automatically sorted by number of likes rather than
    age or time last updated (you can sort them by those, don’t worry), it’s easy
    to get duped into looking at a super cool project and then have the files be deprecated,
    so be wary of how up to date a project actually is, what version of the `Raspberry
    Pi` it uses, and so forth. This site is actually worse about “show and tell” type
    projects, miraculously, but that’s alright - people make beautiful and amazing
    things and they want to show them off! No problem. It’s an excellent source for
    tutorials and inspiration alike. To access the Hackaday Raspberry Pi projects,
    simply follow this link. [https://hackaday.io/projects/tag/raspberry%20pi](https://hackaday.io/projects/tag/raspberry%20pi)


    Those are my three favorite resources for inspiration and project ideas. I’ve
    made quite a few things with `Raspberry Pis` at this point, largely driven by
    the ideas that I’ve gotten from these sites. It’s not all looking at other people’s
    stuff, though; remember that the best things you’ll ever make are the things you’re
    passionate about. Find a way to loop your own passions into your next project.


    # Chapter 6


    ![](images/00002.jpg)


    ## Your First Project - A Portable Superconsole


    This is a relatively ambitious first project, but if you stick it out and follow
    the instructions carefully, then you’ll find yourself with a really seriously
    cool end product. This is an especially great project for video game enthusiasts.


    I’ve pointed out several times in this book how the `Raspberry Pi` has been used
    by people to build things like custom arcade cabinets and portable handheld consoles.
    Well, now you’re going to follow in those footsteps by making your own portable
    handheld console.


    So, you may be wondering what makes this different from every other project like
    this one? Well, the biggest factor which sets this one in particular apart is
    the fact that it is far more covert. What you get with this project is essentially
    a self-contained emulation station. What’s more is that if you have a child who
    likes gaming, they very well may enjoy taking this project on with you.


    What’s even cooler is that the console may seem self-contained, but you can use
    any `USB controller` you like and play games from literally all throughout the
    history of gaming. The only point at which the `Raspberry Pi` has issues is the
    `PS2` and `GameCube` era - up until then is fair game.


    The optimal target console for this project is one which is broken and is sitting
    around. Bigger is better, and the more smooth/balance of a design, the better.
    For example, on the original project, I used an `NES` that had been sitting around
    forever. I’m sure that, if you’re an avid enough gamer to take this on, you’ll
    have an apt console sitting somewhere. The `NES` is the perfect console for it.
    However, if there isn’t an `NES`, anything that can be unscrewed and opened and
    shut easily is great.


    If you don’t have an old and broken console sitting around, you can go on eBay
    and find gutted/broken consoles for extremely cheap.


    In taking on this project, these are the things you’ll need:


    - A broken console

    - Hinges (to open and close the console “lid”)

    - Permanent marker

    - Drill with bits that are made to drill through plastic

    - `Raspberry Pi 3`

    - Screen, for this I recommend that you grab a smaller display. This 5”one should
    be apt: [https://www.amazon.com/Resistive-interface-compatible-Raspberry-Pi/dp/B00U21UA16](https://www.amazon.com/Resistive-interface-compatible-Raspberry-Pi/dp/B00U21UA16).
    The key objective is that it’s able to fit in the top half of the system after
    gutting and sanding - speaking of which..

    - Numerous grits of either sandpaper or a sanding block

    - `USB controller` - you can use an `Xbox 360 controller` or even get a `USB NES/SNES
    controller` on Amazon. Be sure to check the reviews on whatever you get, as some
    of the controllers on Amazon are absolutely terrible. It’s worth a few dollars
    more for quality - trust me.

    - Headphones or speakers that will fit in ordinary 3.5 mm headphone jacks. If
    you’re using speakers, then a flat design is far preferable because it can balance
    out the heaviness from the screen.

    - Very weighty linen, like old curtains

    - Screwdriver


    Alright, now that we’ve got all the necessary materials out of the way, let’s
    get cracking with this. The system that I’m going to use as an example is an `NES`,
    because it’s what I know and it’s what I’ve done the project on before. However,
    if you aren’t using an `NES`, the basic concepts are rather similar.


    Anyway, back to the `NES`. You need to open it up. This is extremely easy. There
    is a set of screws fastening the bottom half of the `NES` to the top half. All
    that you do is unscrew those. Then, your `NES` should be open.


    Now you need to take all of the `NES` components out. By this, I mean the motherboard
    and all of the wires. You can leave in the buttons and the controller ports, though,
    if you’d like - they add a nice sort of aesthetic to the whole thing and are rather
    nice to look at. Other than what you decide to leave in, you’re gutting it entirely.
    Gut more, not less - you need space to work with when it comes to the important
    components.


    I’ve already told you how to install `Raspbian`, so I’d rather not do so all over
    again. It’d, frankly, be a waste of both your time and mine. Instead, I’m just
    going to assume that you can do all of the `Raspbian` setup yourself. The important
    part is this guide is actually `RetroPie`. What `RetroPie` does is act as a shell
    to `Raspbian`. It makes it so that when you boot into `Raspbian`, you automatically
    load the emulator packages that are necessary and are basically shot into your
    game station instantly.


    There’s a legal obligation, really, to denote that emulator usage is illegal unless
    you actually own the game that you are playing. It’s literally illegal to have
    `ROMs` of games of which you don’t have a tangible copy. The chances of anybody
    coming after you are incredibly, incredibly low, but they are there. This is me
    copping out and saying “don’t say I didn’t warn you” if you play illegal `ROMs`.


    So, going on to RetroPie’s installation. First, you should have `Raspbian` set
    up, of course, and your `Raspberry Pi` should be connected to the display that
    you needed. Once `Raspbian` is set up and we’re connected to either a wired or
    wireless internet connection, you need to open `Terminal`.


    In `Terminal`, we need to update our packages. If you’re not terribly savvy then
    this is simple enough. All that you have to do is type this:


    ```

    sudo apt-get update

    ```


    and press Enter. Then you just type this:


    ```

    sudo apt-get upgrade

    ```


    and Enter again. After all of that is done, your package list will be completely
    updated and you’ll be ready to install `RetroPie`.


    Well, almost. `RetroPie` has a set of dependencies that it has to have, first.
    You can grab these dependencies by going to `Terminal` and installing `lsb-release`
    from the `git` repository, like so:


    ```

    sudo apt-get install git lsb-release

    ```


    When that’s finished, we just need to get the `RetroPie` installation scripts.
    This is pretty simple, too.


    > Just type the following:


    ```

    cd

    ```


    and press Enter. This will make you go to the root of your C drive. Next, what
    you do is grab the `RetroPie` script from the repository, like so:


    ```

    git clone --depth=1 https://github.com/RetroPie/RetroPie-Setup.git

    ```


    Once you have the script download, you have to make it so that a person is able
    to execute the script. This is pretty easy, as well! First, you go to the `RetroPie`
    folder:


    ```

    cd RetroPie-Setup

    ```


    (caps are important! Pay attention to that!)


    Then you change the permissions:

