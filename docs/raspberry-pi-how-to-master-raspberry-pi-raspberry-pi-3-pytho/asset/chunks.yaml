  trans: "\n\n![](img/00002.jpg)\n\n# 编程基础\n\n终于，我们来到了你最初购买这本书的目的所在。在本章中，我们将讨论许多编程背后的基础和理念，这些是你为了充分利用树莓派（Raspberry\
    \ Pi）及其背后的硬件所需要的。\n\n有好消息也有坏消息；我先从坏消息开始。坏消息是，提供极其具体的细节是非常的，因为每个项目都有自己的特殊领域、库和要求。我不能简单地告诉你如何为某个项目编写脚本，然后让它神奇地应用到现有的每一个项目中。但我可以教你的是构建几乎每一个树莓派脚本的底层概念，对于如果你希望成为一名精通树莓派的程序员和爱好者来说，这些概念同样至关重要。\n\
    \n这就是好消息上场的地方：你现在就可以开始了。你不需要等你的树莓派到货。事实上，如果我是你，我不会等。在树莓派上进行编程不可避免地会很痛苦，而且如果你有一台电脑，你实际上更适合在电脑上练习技能，这样你就可以处理比在树莓派上更“标准”的键盘/鼠标/显示器设置了。当然，这是主观的，取决于你的经验。\n\
    \n你之所以可以这样做，是因为几乎每一个树莓派脚本运行在 `Python` 上。那么什么是 Python？Python 是一种超级实用的编程语言，它几乎是从\
    \ `C++` 和 `Java` 等语言的灰烬中产生的。如果你不知道它们是什么，它们本身也是编程语言，比 Python 要复杂得多。（我保证我有说明这一点！）\n\
    \n听着，编程一直有一个特定的目的：解决问题。因此，每种编程语言都是为了解决不同类型而定制的。在计算机历史早期，语言极其晦涩。这部分是因为每一比特存储和内存使用都至关重要，而且必须对内存分配和程序大小有完全的控制。这就是\
    \ `C` 等语言登场的地方。然而，同时，必须有一种对数学家友好的编程语言，他们从编写程序中受益匪浅，但不擅长计算机；这就是 `Fortran` 的用武之地。其他语言也有自己的领域；`Lisp`\
    \ 是为栈式编程设计的。当计算能力变得强大后，面向对象的编程作为组织项目的主导手段成为前沿，而面向对象编程的冠军是 `Java`。在 `Java` 出现不久之前，`C`-风格内存维护的理念和面向对象编程的出现结合在一起，形成了一种名为\
    \ `C++` 的极具影响力的语言。列表还在继续。\n\nPython 是一种脚本语言，而脚本语言也有自己的领域。脚本语言的编写考虑了两个目的。\n\n第一个是，理想情况下，脚本可以在一台电脑上编写，然后在任何地方解释。这意味着如果我在我的\
    \ `Windows` 笔记本电脑上写了一个脚本，并把它发送给使用 `iMac` 的朋友，他们仍然可以完全没有问题地运行该脚本。情况并非总是如此，还有一些相当晦涩的脚本语言，但大多数情况下，它们运行在自己的特殊环境中。\n\
    \n第二个是脚本具有快速的部署时间。这意味着它们中的代码编写速度可以比在另一种语言中更快。比较一下 `Java` 中的这段代码片段：\n\n```\npublic\
    \ class myFile {\n    public static void main(String args[]) {\n        System.out.println(\"\
    Hello world!\");\n    }\n}\n```\n\n与 `Python` 中的这段代码片段相比：\n\n```python\nprint\
    \ \"Hello world!\"\n```\n\nPython 的片段要短得多。这正是意图所在。脚本语言也有其缺点——坦率地说，在你目前的学习阶段并不会理解这些缺点。但大多数情况下，它们在编写代码花费的时间上是非常高效的，而且与\
    \ `C` 这样的语言相比，它们的学习曲线也相当简单。\n\n那么我说这些的意义何？嗯，你可以在任何电脑上练习 `Python` 编程，然后毫无问题地将其传输到树莓派上。你只需要一个\
    \ `Python` 副本和一个文本编辑器。\n\n本章的重点是让你熟悉编程中我认为可能会让你感到困惑的所有各种怪癖。当你看到那些已经完成项目的人编写的脚本时，这些课程可能看起来并不重要，但当你仔细观察那些脚本时，你会发现底层概念——数据类型、算术、方法等等——是非常普遍的。如果你不知道这些概念是什么，你就指望用脚本做任何事情。\n\
    \n## 安装 Python\n\n那么，让我们从开始起。要开始 `Python` 编程，你需要做的第一件事就是，嗯，获取 `Python`。许多电脑已经安装了它。如果你运行\
    \ `Linux` 或 `Mac`，那么很有可能你已经有了。你可以通过打开 `Terminal`（在 `Mac` 或 `Linux` 中）或 `PowerShell`（在\
    \ `Windows` 中）并输入 `python` 然后按回车来测试。如果你安装了 `Python`，它应该执行一个程序。如果没有，它应该给你抛出一个错误信息。\n\
    \n如果它执行了一个程序，查看程序文本看写了什么。如果显示“Python 3.x”，你需要卸载它并改为获取 `Python 2`。原因很简单：大多数 `Python`\
    \ 脚本是用 `Python 2` 编写的，因为它一直是长期版本。我们在本章中学习 `Python 2`。`Python 2` 和 `Python 3` 之间有很多东西是可以转换的，如果你需要迁移到\
    \ `Python 3` 非常容易。但大多数情况下，如果一个工具是为 `Python 3` 编写的，它也会为 `Python 2` 编写；然而，通常情况反之。由于由于原因，在现在教学和使用\
    \ `Python 2` 是容易的。\n\n如果你没有安装 `Python`，或者你刚刚卸载了 `Python 3` 并想要 `Python 2`，你需要访问\
    \ `http://python.org`。这是 `Python` 的官方网站，你可以在这里找到适用于任何操作系统的 `Python` 副本。\n\n之后，你需要获取一个你喜欢的文本编辑器。在树莓派内部，你将在很大程度上使用控制文本编辑器\
    \ (`Nano`)，但在你的练习电脑上，你可以使用任何你喜欢的工具。它只需要是一个你理解并且你习惯于使用或乐于学习使用的工具即可。我个人非常喜欢 `Atom`\
    \ 文本编辑器，你可以在 `http://atom.io` 获取适用于 `Windows`、`Mac` 和 `Linux` 的版本。喜欢 `Atom` 的理由有很多，但最大它是免费的，并且有大量的旨在让你的生活更简单的插件。\n\
    \n一旦你有了特定的文本编辑器，花一点时间了解它。尝试创建一个新文件、保存它、创建一个项目路径（如果适用）等等。本质上，学习你将要用到的功能。到这时，你应该也设置好了树莓派——你将受益于进入控制台、启动\
    \ `Nano` 并学习如何用它创建、保存、打开和编辑文件。信不信由，这相对简单且有趣。\n\n无论如何，回到你的练习电脑，我们将学习 `Python` 的基础知识，使你能够处理他人的脚本，并最终编写自己的脚本。在此之前，我们还需要做最后一件事。\n\
    \n通过 `Terminal` 或 `PowerShell` 启动 `Python`。如果到目前为止一切按计划进行，你应该看到类似：\n\n```\n>>>\
    \ Python 2.7.12\n```\n\n"
- fmt: "\nand then some more text afterward. If you don’t see this and you’re running\
    \ Windows, ensure that you have a `PATH` variable set up for Python.\n\nOnce Python\
    \ is running, type the following:\n\n```\nprint “hello world”\n```\n\nThe console\
    \ should print out hello world back to you. If it does, then congrats! You just\
    \ wrote your first line of Python code; I hope you feel accomplished! Once you’ve\
    \ written that line of code, go ahead and type `exit()`. This will terminate the\
    \ Python interpreter in the console.\n\nI encourage you throughout the rest of\
    \ the lesson to make your own files and experiment with these concepts.\n\n# Working\
    \ with variables and data\n\nSo, we’re trying to cover a fair amount of ground\
    \ in a relatively short amount of space. This means that some of these explanations\
    \ may seem a bit sparse, but I’m not trying to make them so - I’m just trying\
    \ to not drag on about the little things and to cover the bigger things so I don’t\
    \ waste your time.\n\nIn programs, there are things called data types. These data\
    \ types all represent different forms of different information. Computers, they\
    \ read everything as bits and bytes; 1s and 0s. We humans aren’t so fortunate\
    \ as to think in such as a black and white binary sort of way so we really have\
    \ to separate things and parse them up. Well, this means that different types\
    \ of data are interpreted differently, both by us and by computers.\n\nFor example,\
    \ if I gave you the word “oyster” and the number 472, you would say they were\
    \ unrelated. Yes? That’s because they are. One is a number and the other is a\
    \ word. Data types are similar. If I were to give you two words or two numbers,\
    \ and you knew what I was getting at, you’d see quite plainly the bridge that\
    \ I was drawing between the two.\n\nSo let’s say you have a value and you want\
    \ to store it. How do you do so? The answer is simple: variables. Variables are\
    \ much like they were in algebra. `X` can be anything that we want it to be, so\
    \ long as it meets the requirements of the equations, yes? `X` can take on any\
    \ value. Variables are similar. We can set the “equation” which defines the value\
    \ of the variable.\n\nBack in the olden days of programming, you had to define\
    \ the “type” of the variable. If you had a number, you had to say that “the number\
    \ x is an integer”, or if you had to store somebody’s name, you had to say that\
    \ “the word name is a string.” Well, scripting languages are both a blessing and\
    \ a curse because this sort of thing simply isn’t necessary anymore. Scripting\
    \ languages have mitigated that sort of type definition. This is called implicit\
    \ typing.\n\nLet’s say we wanted to store somebody’s name, and the name was Jerry.\
    \ We’d just create a new value, like so:\n\n```\nname = “Jerry”\n```\n\nAnd let’s\
    \ say we wanted to store our friend Jerry’s age - he’s 42.\n\n```\nage = 42\n\
    ```\n\nWell, thanks to the fact that we stored this pertinent information in variables,\
    \ we can recall it later. If we typed:\n\n```\nprint “My friend %s is %d years\
    \ old.” % (name, age)\n```\n\nIt’d print whatever value was stored in `name` and\
    \ `age`. So in this instance, it would print “My friend Jerry is 42 years old.”\
    \ Super easy stuff.\n\nIn Python, there are a few types -\n\n| float | decimal\
    \ numbers | 3.14 |\n| :--- | :--- | :--- |\n| integer | whole numbers | 7 |\n\
    | string | character sequences | “Skate park” |\n| boolean | true/false | True\
    \ |\n\nThere are more, but these are the biggest ones.\n\n# Python Math\n\nGuess\
    \ what computers do? They compute. And they’re very, very, very good at it. It’s\
    \ no wonder, then, that programming languages are literally made to do math. There’s\
    \ not much to show here, I’ll be brief:\n\n| numberOfCats = 4 + 3 | # numberOfCats\
    \ would be 7 |\n| numberOfDogs = 8 / 2 | # numberOfDogs would be 4 |\n| numberOfHamsters\
    \ = 3^2 | # numberOfHamsters would be 9 |\n\nFor the record, the thing with the\
    \ hash mark is a comment. These are ignored by the code. When you enter a hash\
    \ (`#`), you are telling the compiler - the thing which reads and runs your code\
    \ - to ignore anything that comes after the hash mark on that line. Simple concept,\
    \ sure, but worth covering.\n\n# To be, or not to be? Booleans and Comparators\n\
    \nThis will make a lot more sense here in a moment when we deal with if/else statements,\
    \ but for right now, just focus on the idea of True or False. Something can be,\
    \ or it can not be.\n\nIf I were to say “3 is less than 7”, it would be true.\
    \ If I were to say “7 is less than 6”, it would be false. We’re allowed to make\
    \ these kind of evaluations within Python. In fact, it’s encouraged.\n\n```\n\
    number1 = 4\nnumber2 = 5\nprint number1 < number2\n```\n\nThis would print out\
    \ “True”, because it’s true - 5 is greater than 4. That should go without saying,\
    \ right? Python sees that you made a comparison, and it looks to determine whether\
    \ the comparison is accurate or not. If it is, it feeds back `True`. If it isn’t,\
    \ it feeds back `False`.\n\nYou can store these evaluations to a variable.\n\n\
    ```\nnumber1 = 4\nnumber2 = 5\neval = number1 < number2\nprint eval\n```\n\nThis\
    \ would print out “True”, because Python evaluated whether “number1 < number2”\
    \ was true or not, then saved that evaluation to the variable `eval`. Just like\
    \ shy kids in high school, there are a lot of ways for things to compare themselves\
    \ in Python. Here are the basic ones:\n\n| < | Less than |\n| :--- | :--- |\n\
    | > | Greater than |\n| <= | Less than or equal to |\n| >= | Greater than or equal\
    \ to |\n| != | Not equal to |\n| == | Equal to |\n\nWhile we’re on the topic,\
    \ be super wary of the difference between `==` and `=`. The latter is an assignment\
    \ operator - it’s used to give variables to something. The former is a comparison\
    \ operator - it’s used to compare two values.\n\n# If and else\n\nWe’re moving\
    \ rather quickly through all of this, I know.\n\nThere comes a time in every program’s\
    \ life where they have to make big decisions, it’s just a part of growing up.\
    \ You can facilitate this sort of decision making by taking advantage of the conditional\
    \ statements. Let’s start with one.\n\n```\nbananas = 3\nif bananas == 3:\n  \
    \  print “I have three bananas!”\n```\n\nWhat this program does is assign the\
    \ number 3 to `bananas`. It then runs a check to see if `bananas` is equal to\
    \ 3. If it is, it prints “I have three bananas.” Great. If it’s not, it prints…\
    \ nothing at all. Well, that’s a toughy. Alright. How do we fix this? We can use\
    \ `else` statements as a catch-all in case the if condition isn’t met.\n\n```\n\
    if bananas == 3:\n    print “I have three bananas!”\nelse:\n    print “Huh, well,\
    \ I don’t seem to have three bananas.”\n```\n\nIn this case, if `bananas` is 3,\
    \ then the program will print that it has 3 bananas. If not, it will be puzzled\
    \ and express this quite clearly. But what if it has zero bananas and is sad and\
    \ wants to express that? We’ve already checked to see if there are three, we can’t\
    \ check to see if there are 0, too. Right?\n\nWrong. This is where if else statements\
    \ come into play.\n\nLet’s just sandwich an if else statement for zero bananas\
    \ in there. Observe:\n\n```\nif bananas == 3:\n    print “I have three bananas!”\n\
    elif bananas == 0:\n    print “I have no bananas, and this is a problem.”\nelse:\n\
    \    print “Huh, well, I don’t seem to have three bananas.”\n```\n\nIn this case,\
    \ it checks to see if `bananas` is 3. If not, it goes to the next condition and\
    \ checks it. If `bananas` isn’t 0, then it finally moves on to the `else` statement.\
    \ The if/else block will check every condition before resolving itself to the\
    \ else statement.\n\n# Lists\n\nSometimes you need to store connected values together.\
    \ This is super easy in Python. Let’s say you needed to store a student’s grades.\n\
    \n```\nstudent1Grades = [95, 94, 83, 87, 79, 91]\n```\n\nPerfect. You now have\
    \ a list of 6 grades. You can access any of these. Remember, though, that computers\
    \ start counting from 0, not from 1. So if you wanted to print the first item\
    \ in the list, you’d use:\n\n```\nprint student1Grades[0]\n```\n\n# # would print\
    \ 95\n\nYou can add items to a list super easily.\n\n```\nstudent1Grades.append(86)\n\
    ```\n"
