- fmt: '

    Firstly, there are currently six different models of the Raspberry Pi available
    on the market. I’ll shortly go into the hardware specifications on each one, going
    from least to most recently released.


    ## Raspberry Pi Models


    ### Raspberry Pi 1 Model A+

    The first model is based off of the original version of the Raspberry Pi, with
    a few modifications. It’s called the `Raspberry Pi 1 Model A+` and is the lowest
    cost version of the “full” Raspberry Pi. It has a single USB port and is very
    small. It also is rather low on power. Therefore, if you’re undertaking a project
    that doesn’t take much power and doesn’t need many USB dongles, you’ll be fine.
    On models before the `Raspberry Pi 3`, one USB port will generally be taken up
    by a bluetooth or wi-fi dongle, so bear that in mind as we go forward.


    ### Raspberry Pi 1 Model B+

    A slightly better version of the same series - `Raspberry Pi 1` - is available,
    and is called the `Model B+`. It features 4 USB ports and is, thus, more extensible.
    It shares many of the same perks as the `Raspberry Pi 1` in terms of efficiency
    in both cost and power, but is slightly more expensive. (Though you also get a
    bit more power in return for the extra cash)


    ### Raspberry Pi 2 Model B

    After the first version came, naturally, the second version. Much like the first,
    you can very easily get ahold of the second version of the `Raspberry Pi`, aptly
    named the `Raspberry Pi 2`. The only version of the `Raspberry Pi 2` currently
    available is the `Model B`. The `Raspberry Pi 2 Model B` is just slightly more
    expensive than either `Raspberry 1` model. However, in return for the slightly
    bigger chunk of change, you get a super solid ARM processor and a whole gigabyte
    of RAM. For the record, the ARM processor is a big deal; the fact that the `Raspberry
    Pi 2` has an ARM processor means that you could feasibly put any sort of ARM operating
    system on the device. This includes, for example, `Windows 10 ARM` or the ARM
    version of `Ubuntu`. This means, naturally, that your device is capable of far
    more than it would be otherwise, since you have a larger array of operating systems
    to use.


    ### Raspberry Pi 3 Model B

    The next version of the `Raspberry Pi` that we need to discuss is the `Raspberry
    Pi 3`. This is the latest version of the `Raspberry Pi` to be released, and it
    adds many things to the second iteration. Among these are built-in bluetooth and
    wifi, so that you no longer have to get separate dongles for those and your 4
    USB ports can be exclusively used for anything you wish rather than wasting one
    or two on little wireless dongles. The CPU has also been upgraded a fair amount.
    Aside from that, the specs are largely the same as the `Raspberry Pi 2`. However,
    depending upon the complexity and specificities of your project, you may wish
    to opt for a `Raspberry Pi 3` - and after all, its CPU is better, which means
    your project will run faster and more efficiently, and who doesn’t want that?
    There’s only one version of the `Raspberry Pi 3` on the market right now - the
    `Model B`.


    ### Raspberry Pi Zero and Zero W

    Lastly, it’s important that we talk about the `Raspberry Pi Zero`. So, what is
    the `Raspberry Pi Zero`? Well, it’s the most cost-efficient form of the `Raspberry
    Pi` that you can get. It’s rather small, and each board is only $5 a pop. That’s
    not bad at all, and makes a huge number of projects super approachable from a
    standpoint of price. The `Raspberry Pi Zero` shares specs with the `Raspberry
    Pi Model A+` in a lot of ways, but is far smaller. Additionally, the `Raspberry
    Pi Zero` doesn’t have a standard USB port. Additionally, you can get the `Raspberry
    Pi Zero W`, which is largely the same as the `Raspberry Pi Zero` but adds built-in
    wifi and bluetooth connectivity. Depending upon the nature of your project, you
    may wish to opt for this one so that you can easily use these features without
    getting convoluted and bizarre dongles for these purposes. The `Raspberry Pi Zero`
    and `Raspberry Pi Zero W` are great when you want to prototype, because they’re
    extremely cheap, and also are great for projects with a rather small form factor.


    ## Choosing the Right Version


    So, how do you know which version of the Pi you should get? It really depends
    on a number of factors. For example, if you’re new to Pi, you may wish to opt
    for a cheaper version, like the `Model A+`, the `Model B+`, or the `Raspberry
    Pi Zero`, that way if you don’t know what you’re doing or don’t end up liking
    the hobbyist nature of the `Raspberry Pi`, you aren’t out that much money. If
    you’re wanting a project that will last longer and be more competitive hardware
    wise, you should definitely opt for the newest version of the `Raspberry Pi` available.
    Ultimately, it’s a question of budgeting. Additionally, if you find a project
    that you’d like to partake in, you’ll likely want to use the same exact version
    of the Pi that the person who created the project used, just for the simple fact
    that there shouldn’t be any “mistranslations” if you do so, and there shouldn’t
    be any hangups on code or script.


    ## How to Buy Raspberry Pi


    When you decide that it’s time to go all in and buy a Pi, it’s really simple.
    First, you go to `http://raspberrypi.org`. On the top navigational bar, right
    below the search icon, there’s a “tag”that says “Shop”. Click it, and you’ll be
    taken to the Raspberry Pi online store. Click the version of the Pi that you’d
    like (you can also use this opportunity to compare specs more directly, if you
    so desire) and then scroll down on its respective page. A little bit of the way
    down the page, you’ll see where it says “Buy from our distributors” and then sections
    divvied up by one’s country or region. Some of the links don’t carry over, but
    if you get a broken link from the Raspberry Pi website, just try another one until
    you land where you want to be.


    Eventually, you’ll find yourself on a storefront with the version of the Pi that
    you’d like to use. You can take this opportunity to look around at all of the
    gadgets that are available for the Pi, if you’d like to do so. Let me give you
    a heads up, though; there are a lot of them. Poke around a bit and see if there
    is any potential fodder for project ideas that you may have. The Raspberry Pi
    is one of the best supported microboards out there, so I’m sure that you will
    be able to come up with something. Anyhow, once you’ve cemented yourself into
    buying a certain Raspberry Pi, then just relax. All you have to do now is wait
    for your new toy to come in the mail for you to start playing with it, and that
    won’t be too long of a wait… right?


    ## Software


    Now that we’ve talked about the hardware and where to buy a Pi, I feel like it’s
    apt that we talk about the software that you can get powering the Pi.


    The Pis that are model 2 and 3 can theoretically run any ARM-based operating system
    that will run on their architecture. This leaves a lot of options open in terms
    of what operating systems one can use.


    Generally, most people opt to use the Raspberry Pi team sponsored operating system
    `Raspbian`, which is a derivative distribution of the popular Linux-based operating
    system `Debian`. Raspbian comes loaded with a ton of tools that are designed to
    help someone have a working operating system with next to no money down on it,
    as well as a bunch of tools that are intended to teach people - mainly kids -
    programming in fun ways. Among these are things like `Minecraft Pi`, which lets
    people play Minecraft and also use `Python` code in order to improve their experience
    with the game. Additionally included is the MIT-created `Scratch`, where puzzle
    piece commands are used to illustrate program flow and computer logic.


    However, beyond all of the little knick-nacks that come with Raspbian, in the
    end, it’s just a very solid operating system based on a solid operating system.

