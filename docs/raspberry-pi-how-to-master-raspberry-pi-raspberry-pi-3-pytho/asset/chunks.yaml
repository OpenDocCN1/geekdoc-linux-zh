- fmt: "\n![](images/00002.jpg)\n\n# Programming Essentials\n\nAt last, we’ve landed\
    \ at the point for which you bought this book in the first place. In this chapter,\
    \ we’re going to talk about a lot of the fundamentals and ideas behind programming\
    \ that you’re going to need in order to take full advantage of the Raspberry Pi\
    \ and the hardware behind it.\n\nThere’s good news and bad news; I’ll start with\
    \ the bad news. The bad news is that giving extremely specific information is\
    \ rather difficult, because every project is going to have its own niches, libraries,\
    \ and requirements. I can’t just tell you how to write a script for one project\
    \ and then have it magically apply to every single project out there. But what\
    \ I can teach you is the underlying concepts that frame almost every single Raspberry\
    \ Pi script, and that likewise are extremely important if you wish to be an adept\
    \ programmer and hobbyist with the Raspberry Pi.\n\nThat’s where the good news\
    \ comes in: you can start right now. You don’t have to wait for your Pi to come\
    \ in. In fact, I wouldn’t, if I were you. Programming on your Raspberry Pi is\
    \ going to inevitably be a pain and, if you have a computer, you’re actually more\
    \ apt to practice your skills on there so that you can deal with a more “standard”\
    \ keyboard/mouse/monitor setup than you might have on your Pi. This, of course,\
    \ is subjective and relative to your experience, however.\n\nThe reason that you\
    \ can do this is because almost every single Raspberry Pi script runs on `Python`.\
    \ So what is Python? Python is a super useful programming language that was born\
    \ pretty much from the phoenix ashes of languages like `C++` and `Java`. If you\
    \ don’t know what those are, they are programming languages themselves that are\
    \ a fair bit more complex than Python. (I’m going somewhere with this, I promise!)\n\
    \nSee, programming has always had one specific purpose: problem solving. Every\
    \ programming language is thus tailored to solve different sorts of problems.\
    \ Early on in computer history, languages were extremely esoteric. This was partly\
    \ because every bit of storage and memory usage counted, and it was necessary\
    \ that one had complete control over memory allocation and program size. This\
    \ is where languages such as `C` came in. However, at the same time, there had\
    \ to be a programming language that was friendly to mathematicians, who benefited\
    \ greatly from making programs but weren’t adept with computers; this is where\
    \ `Fortran` came in. Other languages, too, had their niches; `Lisp` was designed\
    \ for stack programming. When computing power became a bit stronger, object-oriented\
    \ programming came to the forefront as a dominant means of organizing projects,\
    \ with the champion of object-oriented programming being `Java`. Shortly before\
    \ `Java`, the ideals of `C`-style memory maintenance and the advent of object-oriented\
    \ programming were combined into a super influential language known as `C++`.\
    \ The list goes on and on.\n\nPython is a scripting language, and scripting languages\
    \ have a niche themselves. Scripting languages are written with two purposes in\
    \ mind.\n\nThe first is that the scripts can ideally be written on one computer\
    \ and then interpreted anywhere. This means that if I write a script on my `Windows`\
    \ laptop and I send it to my friend with an `iMac`, they can still run the script\
    \ with absolutely zero problem. This isn’t always the case, and there are some\
    \ rather esoteric scripting languages, but for the most part, they run within\
    \ their own special environments.\n\nThe second is that the scripts have fast\
    \ deployment times. This means that the code in them can be written quicker than\
    \ it could in another language. Compare this code snippet in `Java`:\n\n```\n\
    public class myFile {\n    public static void main(String args[]) {\n        System.out.println(\"\
    Hello world!\");\n    }\n}\n```\n\nwith this code snippet in `Python`:\n\n```python\n\
    print \"Hello world!\"\n```\n\nThe Python snippet is so much shorter. This is\
    \ the intent. Scripting languages have their drawbacks - none of which, frankly,\
    \ you’ll understand at this point in your learning. But for the most part, they’re\
    \ extremely efficient in terms of time spent writing code, and they also have\
    \ a pretty simple learning curve compared to a language like `C`.\n\nSo what’s\
    \ the point of me saying all of this? Well, you can practice your `Python` programming\
    \ on any computer and then transfer it to the Raspberry Pi with no issue. All\
    \ you need is a copy of `Python` and a text editor.\n\nThe point of this chapter\
    \ is to acquaint you with all the various eccentricities of programming that I\
    \ think may throw you off. These lessons may not seem valuable when you look at\
    \ scripts written by people who have already made projects, but when you look\
    \ at those scripts closely, you’ll see that the underlying concepts - data types,\
    \ arithmetic, methods, and so forth - are very prevalent. You can’t expect to\
    \ do anything with a script if you don’t know what these concepts are.\n\n## Setting\
    \ up Python\n\nSo let’s start from the beginning. The first thing that you need\
    \ to do to start programming in `Python` is to, well, get `Python`. Many computers\
    \ already have it. If you’re running `Linux` or `Mac`, then the chances are good\
    \ that you do. You can test to see if you have it by opening either `Terminal`\
    \ (in `Mac` or `Linux`) or `PowerShell` (in `Windows`) and typing `python`, then\
    \ pressing enter. If you have `Python` installed, it should execute a program.\
    \ If not, it should throw you an error message.\n\nIf it executes a program, look\
    \ at the program text to see what it says. If it says “Python 3.x”, you need to\
    \ uninstall it and get `Python 2` instead. The reason for this is simple: most\
    \ `Python` scripts are written in `Python 2`, because it has been the longstanding\
    \ version. We are learning `Python 2` in this chapter. A lot of things transfer\
    \ between `Python 2` and `Python 3` and moving over to `Python 3`, if you need\
    \ to, will be extremely easy. But for the most part, if a utility is written for\
    \ `Python 3`, it will also be written for `Python 2`; however, more often than\
    \ not, the reverse isn’t true. For this reason, it’s easiest to just teach and\
    \ work with `Python 2` at this point in time.\n\nIf you don’t have `Python` installed,\
    \ or you just uninstalled `Python 3` and are looking to get `Python 2`, you need\
    \ to go to `http://python.org`. This is the official `Python` website and is where\
    \ you’ll be able to find a copy of `Python` for virtually any given operating\
    \ system.\n\nAfter this, you’ll need to get a text editor that you’d like to use.\
    \ Within Raspberry Pi, you’ll be largely using the console text editor (`Nano`),\
    \ but on your practice computer, you can use whatever you like. It really just\
    \ needs to be something that you understand and are either comfortable using or\
    \ are content to learn to use. Personally, I love the text editor `Atom`, which\
    \ you can get at `http://atom.io` for `Windows`, `Mac`, and `Linux` alike. There\
    \ are a lot of reasons to love `Atom`, but the biggest are that it’s free and\
    \ there are a ton of plug-ins intended to make your life easier.\n\nOnce you have\
    \ your specific text editor, spend a bit getting to know it. Try making a new\
    \ file, saving it, creating a project path (if applicable), and so forth. Essentially,\
    \ learn the functions that you’re going to use. At this point, you should have\
    \ your Raspberry Pi set up, too - you would benefit from going to the console,\
    \ starting up `Nano`, and learning how to create, save, open, and edit files with\
    \ it. It’s relatively straightforward and fun to use, believe it or not.\n\nAnyway,\
    \ back on your practice computer, we’re going to get to the basics of `Python`\
    \ that will enable you to work with other people’s scripts and, eventually, write\
    \ your own. Before we do that, though, there’s one last thing we need to do.\n\
    \nStart up `Python` via either `Terminal` or `PowerShell`. If everything so far\
    \ has gone according to plan, you should see something that says:\n\n```\n>>>\
    \ Python 2.7.12\n```\n"
  raw: '![](images/00002.jpg)


    Programming Essentials


    At last, we’ve landed at the point for which you bought this book in the first
    place. In this chapter, we’re going to talk about a lot of the fundamentals and
    ideas behind programming that you’re going to need in order to take full advantage
    of the Raspberry Pi and the hardware behind it.


    There’s good news and bad news; I’ll start with the bad news. The bad news is
    that giving extremely specific information is rather difficult, because every
    project is going to have its own niches, libraries, and requirements. I can’t
    just tell you how to write a script for one project and then have it magically
    apply to every single project out there. But what I can teach you is the underlying
    concepts that frame almost every single Raspberry Pi script, and that likewise
    are extremely important if you wish to be an adept programmer and hobbyist with
    the Raspberry Pi.


    That’s where the good news comes in: you can start right now. You don’t have to
    wait for your Pi to come in. In fact, I wouldn’t, if I were you. Programming on
    your Raspberry Pi is going to inevitably be a pain and, if you have a computer,
    you’re actually more apt to practice your skills on there so that you can deal
    with a more “standard” keyboard/mouse/monitor setup than you might have on your
    Pi. This, of course, is subjective and relative to your experience, however.


    The reason that you can do this is because almost every single Raspberry Pi script
    runs on Python. So what is Python? Python is a super useful programming language
    that was born pretty much from the phoenix ashes of languages like C++ and Java.
    If you don’t know what those are, they are programming languages themselves that
    are a fair bit more complex than Python. (I’m going somewhere with this, I promise!)


    See, programming has always had one specific purpose: problem solving. Every programming
    language is thus tailored to solve different sorts of problems. Early on in computer
    history, languages were extremely esoteric. This was partly because every bit
    of storage and memory usage counted, and it was necessary that one had complete
    control over memory allocation and program size. This is where languages such
    as C came in. However, at the same time, there had to be a programming language
    that was friendly to mathematicians, who benefited greatly from making programs
    but weren’t adept with computers; this is where Fortran came in. Other languages,
    too, had their niches; Lisp was designed for stack programming. When computing
    power became a bit stronger, object-oriented programming came to the forefront
    as a dominant means of organizing projects, with the champion of object-oriented
    programming being Java. Shortly before Java, the ideals of C-style memory maintenance
    and the advent of object-oriented programming were combined into a super influential
    language known as C++. The list goes on and on.


    Python is a scripting language, and scripting languages have a niche themselves.
    Scripting languages are written with two purposes in mind.


    The first is that the scripts can ideally be written on one computer and then
    interpreted anywhere. This means that if I write a script on my Windows laptop
    and I send it to my friend with an iMac, they can still run the script with absolutely
    zero problem. This isn’t always the case, and there are some rather esoteric scripting
    languages, but for the most part, they run within their own special environments.


    The second is that the scripts have fast deployment times. This means that the
    code in them can be written quicker than it could in another language. Compare
    this code snippet in Java:


    > > > public class myFile {


    > > > > > public static void main(String args[]) {


    > > > > > > System.out.println(“Hello world!”);


    > > > > > }


    > > > }


    > > > with this code snippet in Python:


    > > > print “Hello world!”


    The Python snippet is so much shorter. This is the intent. Scripting languages
    have their drawbacks - none of which, frankly, you’ll understand at this point
    in your learning. But for the most part, they’re extremely efficient in terms
    of time spent writing code, and they also have a pretty simple learning curve
    compared to a language like C.


    So what’s the point of me saying all of this? Well, you can practice your Python
    programming on any computer and then transfer it to the Raspberry Pi with no issue.
    All you need is a copy of Python and a text editor.


    The point of this chapter is to acquaint you with all the various eccentricities
    of programming that I think may throw you off. These lessons may not seem valuable
    when you look at scripts written by people who have already made projects, but
    when you look at those scripts closely, you’ll see that the underlying concepts
    - data types, arithmetic, methods, and so forth - are very prevalent. You can’t
    expect to do anything with a script if you don’t know what these concepts are.


    Setting up Python


    So let’s start from the beginning. The first thing that you need to do to start
    programming in Python is to, well, get Python. Many computers already have it.
    If you’re running Linux or Mac, then the chances are good that you do. You can
    test to see if you have it by opening either Terminal (in Mac or Linux) or PowerShell
    (in Windows) and typing python, then pressing enter. If you have Python installed,
    it should execute a program. If not, it should throw you an error message.


    If it executes a program, look at the program text to see what it says. If it
    says “Python 3.x”, you need to uninstall it and get Python 2 instead. The reason
    for this is simple: most Python scripts are written in Python 2, because it has
    been the longstanding version. We are learning Python 2 in this chapter. A lot
    of things transfer between Python 2 and Python 3 and moving over to Python 3,
    if you need to, will be extremely easy. But for the most part, if a utility is
    written for Python 3, it will also be written for Python 2; however, more often
    than not, the reverse isn’t true. For this reason, it’s easiest to just teach
    and work with Python 2 at this point in time.


    If you don’t have Python installed, or you just uninstalled Python 3 and are looking
    to get Python 2, you need to go to [http://python.org](http://www.python.org).
    This is the official Python website and is where you’ll be able to find a copy
    of Python for virtually any given operating system.


    After this, you’ll need to get a text editor that you’d like to use. Within Raspberry
    Pi, you’ll be largely using the console text editor (Nano), but on your practice
    computer, you can use whatever you like. It really just needs to be something
    that you understand and are either comfortable using or are content to learn to
    use. Personally, I love the text editor Atom, which you can get at [http://atom.io](http://www.atom.io)
    for Windows, Mac, and Linux alike. There are a lot of reasons to love Atom, but
    the biggest are that it’s free and there are a ton of plug-ins intended to make
    your life easier.


    Once you have your specific text editor, spend a bit getting to know it. Try making
    a new file, saving it, creating a project path (if applicable), and so forth.
    Essentially, learn the functions that you’re going to want to use. At this point,
    you should have your Raspberry Pi set up, too - you would benefit from going to
    the console, starting up Nano, and learning how to create, save, open, and edit
    files with it. It’s relatively straightforward and fun to use, believe it or not.


    Anyway, back on your practice computer, we’re going to get to the basics of Python
    that will enable you to work with other people’s scripts and, eventually, write
    your own. Before we do that, though, there’s one last thing we need to do.


    Start up Python via either Terminal or PowerShell. If everything so far has gone
    according to plan, you should see something that says:


    > > > >>> Python 2.7.12'
