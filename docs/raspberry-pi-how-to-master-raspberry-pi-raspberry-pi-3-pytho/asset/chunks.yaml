    Afterward, you need to double check that your system locale is correct. This is
    because the things which are needed for all of the RetroPie emulators to run take
    specific files which will vary depending upon the location of the user. In order
    to check this, all you have to do is run locale from the Terminal.


    Make sure that everything is set. If something isn’t, then it needs to be. There’s
    a really simple way to do this. First, make sure you understand what your locale
    is. For example, yours could be en_US.UTF-6. Then place that locale in the following
    command in place of the italicized “userLocale”:


    > > > sudo update-locale LC_ALL=“userLocale”


    Including quotes, of course. From here, we just need to install RetroPie itself.


    There are two different ways that you can install RetroPie. You can either do
    a full or a partial install. If you’re only wanting certain systems to be playable,
    then you should definitely do the partial install. However, if that is not the
    case, then the full install is much easier and much more full-featured.


    Full Installation


    All that you do here is execute the RetroPie-Setup script. When it starts to execute,
    you’ll eventually land on a screen where it says “manage packages”. From here,
    you’ll simply toggle “Quick Install” and then comfirm by pressing Enter. Definitely
    one of the easiest things in this whole book, no? When you do a full installation,
    it also creates the exact folders that you’ll need to store your ROMs in. If you’ve
    followed this book relatively to the letter, they’re going to be under ~/RetroPie/roms.


    Partial Installation


    This solution is much lighter on your SD card if you’re wary of how much storage
    you have (or want) to use. Using this option, you’re able to use your own discretion
    at which emulators you do and don’t want installed. Remember that there are a
    few packages that you have to have in order for RetroPie to even run:


    > > > > •RetroArch, the UI for RetroPie


    > > > > •Emulation Station, the backbone of the system which starts and sorts
    the ROMs that you’ve got tucked away in your little folders.


    > > > > •RetroPie Menu, rather self-explanatory


    > > > > •Runcommand, honestly not certain what this one does but it sounds important
    and it doesn’t work without it


    So you need to install all of those packages. Once they’re install, you can seek
    through the list of packages that are available and determine which emulators
    you do (and don’t) want.


    Next, all that we’ve got to do is make it so Emulation Station will run first
    thing when the Pi starts up. Toggling this setting is actually extremely easy.
    From within RetroPie, all that you do is go to Setup Script. From here, you’re
    going to head to the Configuration and Tools menu, wherein there will be an Autostart
    submenu. Numerous different boot conditions for the Pi are listed, but all you’re
    going to do is toggle the first, which reads “Start Emulation Station at boot”.


    You can try restarting your Pi now, just to be certain that everything is in working
    order. Unplug and restart your Pi. If it boots into Emulation Station first thing,
    then you know you did everything right. If it doesn’t, then something went awry
    and you need to retrace your steps and figure out what went wrong.


    If everything is working then we need to talk about how to put ROMs on your Raspberry
    Pi. The easiest way to put ROMs on your Pi, by far, is to simply use a USB drive.
    Thus, this is the method that I’m going to go over for you.


    So, the first thing that you need to do is format your USB drive to FAT32\. We
    talked about how to do this earlier, but with SD cards. The process, however,
    is exactly the same. Simply follow those same steps that we did earlier to format
    the SD card, but relative to the USB drive.


    Then, once it’s formatted, what you do is open the drive and then create a folder
    called “retropie”, exactly like that. Then take your USB drive out of your primary
    computer and insert it into your Pi. The drive will start blinking, this signifies
    that active file system changes are happening. This is what you want. When the
    blinking stops, you just take the drive out.


    Put it back in your original PC. You’ll see a whole lot of new folders that weren’t
    there before. These are where you put your ROMs. You just drag the ROM to the
    correct system/emulator’s ROM folder, and then you’re good to go. You can add
    as many as your drive will hold. It may take a bit for the transfer to complete,
    but it’ll happen.


    When the transfer has completed, put the USB drive back in the Pi. It’s going
    to start blinking again; wait it out. When it’s all done, all you need to do is
    refresh Emulation Station. You do so by pressing the F4 key. Hopefully, you’ll
    see all of the new games that you loaded onto the USB right there for you to play.


    So now we’re in the final stretch of all of this business: taking our console
    and making this project truly ours. We’ve got our Raspberry Pi working, RetroPie
    is taking care of all of the heavy lifting for us. Now all that we’ve got to do
    is seal the deal on the project.


    At this point, we’ve already gutted the console. If you followed my recommendations
    for finding an ideal console (cough cough the NES), then it should be pretty much
    perfect for a hinge layout. This is actually why I’m pushing for the NES on this
    project: its design is so stupidly easy. The NES is two parts, with everything
    important in the pit thereof. So it’s actually pretty much perfect for everything
    we’re wanting to do here, because if we set it up with hinges, it will open/close
    with no issue at all, and will actually look quite good doing it.


    That brings us to our next part of this project: putting the hinges on the console.
    In your mind, visualize where you want the hinges to be and how you want the console
    to open up. Take your Sharpie and try to leave as accurate of marks as possible
    for what you’re wanting. Then take the drill and bore holes there, very slowly,
    using the plastic bits. Once the holes are in place, simply put the hinges on
    and then test them out.


    Now, we just have to start carving our way out within the system for our electronics.
    Figure out how much room that you need for your screen. Is it big enough? What
    will you have to sand down to get it to fit? Figure out what dimensions you’re
    going after and then start sanding out a place for your display/Pi duo. Take it
    very slowly and very carefully, because plastic sands off very quickly and you
    may take far more than you’re intending.


    Once all of that is done, look at the screw holes of the Raspberry pi and determine
    where in the lid of the console you need to bore holes for the display to fit
    and be fastened. The way that I would do this is with a simple nut/screw setup.
    Bore the holes, put the screws through the top and then fasten a bolt so that
    the Pi is secure. This is extremely noticeable, but most people won’t actually
    realize the screws are there at all unless you point the system out. The system,
    thus, maintains its cool and conspicuous edge. There are different ways to do
    this, but honestly, I’m not so sure that they’d be anywhere near as secure as
    this method. If you decide to do something else and your Pi falls in the case
    and your display cracks, it’s not my fault.


    At this point, your Raspberry Pi should be secured, and should move with the lid
    of the console when you open and close it. Before you test, though, put the cloth
    that I told you to have in the bottom half of the console. This is a great idea
    for two reasons specifically:


    > > > > 1\. It’s a form of insurance in case your Pi isn’t secure - your screen
    and Pi will be buffered against the linen rather than the hard plastic.


    > > > > 2\. It’ll balance out the heavy screen and Pi fastened to the lid.'
