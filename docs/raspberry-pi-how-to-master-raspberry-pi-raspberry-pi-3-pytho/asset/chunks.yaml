    断开所有连接——如果你还没有这样做的话，甚至要把屏幕也离开 Pi——然后插上你所有的外设设备，如扬声器、电源、摇杆等。如果你的电源线无法穿过主机外壳，你可以直接钻一个大孔让它穿过去。不过，`microUSB`
    连接应该没有问题地装好。然后将 Pi 放入就位并固定屏幕，屏幕会反过来固定在盖子的整个孔上，你只需要用螺母将其固定即可。在这里要格外小心，这一步非常容易出错。


    测试一下以确保一切运行正常。如果是的话，那么恭喜你！你现在拥有了一个自成一体的超级主机，能够玩几乎涵盖 30 年的视频游戏。这真美妙。


    为了更上一层楼，如果你在选择显示器时明智地 de，显示器将能够通过 `HDMI` 直接将所有内容输出到另一个屏幕上。理论上，只要你有 `HDMI` 线缆、合适的显示器以及足够的专注精神，你就可以在巨大的投影仪或大平板液晶电视上运行这个系统。


    就是这样了。对于一个初学者来说，这是一个非常有野心的项目，我真为你能走到最后感到非常自豪。这绝对不是你与 `Raspberry Pi` 冒险的终点，我希望我为你提供了足够的方法，让你瞬间迸发出灵感。


    # 结论


    ![](img/00002.jpg)


    感谢你读完这本书，希望它内容充实，并能为你提供实现你目标所需的所有工具，无论你的目标是什么。接下来去哪里 - 社区与洞察 - 黑客精神（Hacking）是一个社区。


    下一步就是直接投入其中。寻找吸引你的项目并开始做它们，或者构思一些你自己的想法并开始研究它们。


    在结束这本书之前，我想说几句话：关于黑客精神（hacking）。当许多人听到“黑客”这个词时，他们想的并不是那些厉害坏蛋。他们想到的是邮件丑闻、`LulzSec`
    或者躲在绿色终端后的黑暗房间里臭名昭著的人。但那并不是黑客精神。黑客精神远不止于。黑客是一种整体心态。黑客精神关于捣鼓和学习、体验、拆解事物、用旧物创造新物、创造、解决问题，以及在手段并不完全明显的情况下，做出真正、非常不可思议事情的灵性。


    通过操作 `Raspberry Pi` 项目，你就是一个黑客。可能不是那种破解他人安全的黑客之类的，但你完全符合这个已经存在了 40 年的黑客亚文化。其原因在于，要真正尝试从无中创造出奇妙的事物，需要某种好奇心、灵性和驱动力。所以，当我说你是黑客时，我是发自内心地认为。通过拿起这本书，你证明了自己是一个黑客。


    黑客是才华横溢的人，他们的工作值得赞誉。无论是在重要网络中寻找安全漏洞，无论是在破解电话线路（phreaking），无论是在车库里焊接电路板，还是仅仅在尝试让
    `LED` 屏幕连接到 `Raspberry Pi` 以显示他们想要的文本，他们都是最终将推动世界进步的人。因为他们不仅看到了边界，还能看到边界在哪里断裂，并将边界向后推。我的意思是，朋友，你并不孤单。


    今后，如果你有任何问题，有很多很棒的在线社区非常乐意解答各种关于 `Raspberry Pi` 以及其他你可能感兴趣的相关项目（如 `Intel Edison`、`Arduino`
    等）的问题。那里有大量的资深人士，包括手工爱好者和专业人士，他们非常乐意回答你可能任何问题。


    我推荐的两个是官方的 `Raspberry Pi` 论坛 [`www.raspberrypi.org/forums`](https://www.raspberrypi.org/forums)
    以及 `Raspberry Pi` 的 Reddit 子板块（拥有超过 150,000 名订阅者！）[`www.reddit.com/r/raspberry_pi/`](https://www.reddit.com/r/raspberry_pi/)。这两个都是非常棒且活跃的板块，让你获取答案并广泛参与整个
    Pi 黑客社区。


    同时也请留意其他有问题的初学者，或者更好的是——正在尝试并失败的人。任何人都可以遵循教程，但学习发生在错误中。留意别人犯的错误，以及你自己犯的错误。理解为什么它们是错误，以及如何以其他方式处理让事情更顺畅。总而言之，当你使用
    `Raspberry Pi` 时，尽量让每天都变得有趣、愉快并成为一种学习经历。


    最后，我只想感谢你读完这本书，希望我能提供一些价值的帮助和见解。我知道上手 `Raspberry Pi`——尤其是尝试直接开始编程——本身就是一项艰巨的任务。我真心地希望你在未来的任何项目中都能好运，并回想起阅读这本书的时光是美好的。


    如果是这样，我非常希望你在 Amazon 上留下评论。即使你不喜欢，也请留下评价。正是像你们这样的人帮助我创作高质量的内容。


    非常感谢阅读，祝你一切顺利。

