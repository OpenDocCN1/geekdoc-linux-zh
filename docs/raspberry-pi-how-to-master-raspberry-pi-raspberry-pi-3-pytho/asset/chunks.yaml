    chmod +x retropie_setup.sh


    然后你给文件夹授予管理员权限：


    ```bash

    sudo ./retropie_setup.sh

    ```


    如果这任何地方不工作，尝试在前面加上关键字 `sudo`，这将提升你到根权限。


    随后，你需要再次检查系统的 locale 是否正确。这是因为所有 RetroPie 模拟器运行所需的东西会使用特定的文件，这些文件会因用户的位置而有所不同。要检查这一点，只需在终端中运行
    `locale`。


    确保一切已设置好。如果有什么未设置，则需要设置。


    有一种非常简单的方法可以做到这一点。首先，确保你了解自己的 locale。例如，你的 locale 可能是 `en_US.UTF-6`。


    然后在下面的命令中将斜体的 `userLocale` 替换为该 locale：


    ```bash

    sudo update-locale LC_ALL="userLocale”

    ```


    当然包括引号。


    从此，我们只需要安装 RetroPie 本身。


    你可以选择全装或部分安装的两种不同方式来安装 RetroPie。如果你只想让某些系统可玩，那么肯定应该进行部分安装。但如果情况并非如此，则全装更加容易且功能更为丰富。


    ### 全部安装


    这里所要做的只是执行 RetroPie-Setup 脚本。当它开始执行时，你最终会看到一张显示“管理包”的屏幕。从这里，你只需切换“Quick Install”，然后按回车键确认。这绝对是本书里最容易的事情之一，不是吗？全装安装时，它还会创建你用于存储
    ROM 的精确文件夹。如果你基本上遵循本书的指示，它们将位于 `~/RetroPie/roms`。


    ### 部分安装


    如果你担心 SD 卡的存储空间（或想使用的空间），则该方案更轻。使用此选项，你可以自行决定想要安装哪些模拟器以及哪些不想要安装。请记住，RetroPie 运行需要几个必备包：


    * RetroArch，RetroPie 的用户界面

    * Emulation Station，系统的支柱，负责启动并整理你放在小文件夹中的 ROM。

    * RetroPie 菜单，相对显而易见

    * Runcommand，老实说不太确定它的作用，但听起来很重要，且缺少它无法运行


    因此你需要安装所有这些包。一旦它们被安装，你就可以浏览可用的包列表，决定想要（或不想要）安装哪些模拟器。


    接下来，我们只需让 Emulation Station 在 Pi 启动时第一时间运行。切换此设置实际上非常容易。在 RetroPie 内部，你只需前往 `Setup
    Script`，然后前往 Configuration and Tools 菜单，在那里会有一个 Autostart 子菜单。列出了许多 Pi 的启动条件，但你只需要切换第一个，即读作“开机时启动
    Emulation Station”。


    你现在可以尝试重启 Pi，仅为确认一切运行正常。拔掉电源并重启 Pi。如果它在启动时直接进入 Emulation Station，则说明你一切做得正确。如果它不这样做，则出现了问题，你需要回退步骤并弄明白哪里出了问题。


    如果一切运行正常，我们需要讨论如何在 Raspberry Pi 上放置 ROM。把 ROM 放到 Pi 上最简便的方法，无疑是直接使用 USB 驱动器。因此，我将为你介绍此方法。


    因此，你首先需要将 USB 驱动器格式化为 `FAT32`。我们之前谈过如何做到这一点，但那是针对 SD 卡的。然而，过程完全相同。只需遵循我们之前用于格式化
    SD 卡的相同步骤，但针对 USB 驱动器。


    然后，在它格式化后，你打开驱动器并创建一个名为 `retropie` 的文件夹，正是这样。


    然后取出你主要电脑中的 USB 驱动器并插入你的 Pi。驱动器会开始闪烁，这表示正在发生活动的文件系统更改。这就是你想要的。当闪烁停止后，你只需取出驱动器。


    将其放回你原来的电脑中。你会看到许多之前不存在的新文件夹。这些是你放置 ROM 的地方。你只需将 ROM 拖动到对应的系统/模拟器的 ROM 文件夹中，然后即可使用。你可以根据驱动器的容量添加尽可能多的
    ROM。传输可能需要一些时间完成，但它会发生的。


    当传输完成后，将 USB 驱动器再插回 Pi。它会再次开始闪烁；请稍等。当一切完成后，你只需刷新 Emulation Station。你通过按下 `F4`
    键来完成。希望你能在 USB 上加载的所有新游戏直接显示在你面前供你游玩。


    因此，我们现在进入这项业务的最后阶段：将我们的主机变成真正属于我们自己的项目。我们的 Raspberry Pi 已经工作正常，RetroPie 为我们处理了所有繁重的工作。现在我们只需要完成项目的敲定。


    '
- fmt: '

    Detach everything - even the screen from the Pi, if you haven’t already - and
    plug in all of your peripherals that you’ve got, such as speakers, power, joypads,
    and so forth. If your power cable won’t fit through the case of the console, you
    can just bore a bigger hole to poke it through. However, the `microUSB` connection
    should fit with no problem. Then put the Pi in position and fasten the screen,
    which will in turn fasten through the whole on the lid, which you’ll secure with
    a nut. Be super careful here, it’s really easy to mess this step up.


    Try it out to be sure that everything is in working order. If it is, then congratulations!
    You’ve now got a self-contained superconsole capable of playing nearly 30 years
    worth of video games. That’s pretty beautiful.


    To take this all one step further, if you chose wisely when selecting your display,
    the display will be able to directly output everything to another screen by `HDMI`.
    You could theoretically play this system on massive projectors or huge flat-screen
    TVs so long as you have an `HDMI` cable, the right display, and the raw dedication.


    So there you go. That’s a pretty ambitious project for somebody to start out with,
    and I’m really proud of you for making it to the end of this. It’s certainly not
    the end of your adventures with the `Raspberry Pi`, and I’m hoping that I’ve given
    you more than enough ways to come up with inspiration in a flash.


    # Conclusion


    ![](images/00002.jpg)


    Thank you for making it through to the end of this book, let’s hope it was informative
    and able to provide you with all of the tools you need to achieve your goals whatever
    it may be. Where to Go From Here - Communities and Insight - Hacking is a community.


    The next step is to just jump in. Find projects that appeal to you and start working
    on them, or dream up some of your own and start looking into them.


    Before I bring this book to a close, I’d like to say a few words: hacking. When
    a lot of people hear the word hacking, they don’t think of the best dudes. They
    think of email scandals or `LulzSec` or notorious people in dark rooms behind
    green terminals. But that’s not what hacking is. There’s a lot more to hacking
    than that. Hacking is an entire frame of mind. Hacking is about tinkering and
    learning, experiencing, breaking things apart, making new things from old things,
    creating, problem solving, having the ingenuity to do something really, really
    incredible even though the means aren’t exactly obvious.


    By working with `Raspberry Pi` projects, you are a hacker. Maybe not a hacker,
    breaching people’s security or whatever, but you’d fit right in among the hacker
    subculture that’s existed for going on 40 years now. And the reason for this is
    because it takes a certain amount of curiosity, ingenuity, and drive to truly
    try to make something fantastic out of nothing. So, when I say that you’re a hacker,
    I mean it rather sincerely. By picking up this book, you are showing that you’re
    a hacker.


    Hackers are brilliant people, and the work they do deserves credit. Whether they’re
    finding security holes in important networks, whether they’re phreaking phone
    lines, whether they’re soldering circuit boards in their garage, or whether they’re
    just trying to get the `LED` screen connected to the `Raspberry Pi` to display
    the text they’re wanting, they are the people who ultimately will push the world
    forward. Because they not only see the boundaries, but they see where the boundaries
    break, and they push them back. My point is that you, friend, are in good company.


    Going forward, if you have any questions, there are a number of fantastic online
    communities that are well treated to answering all sorts of questions about `Raspberry
    Pis` and other related projects you may be interested in (`Intel Edison`, `Arduino`,
    etc.). There are a huge number of veterans out there, tinkerers and professionals
    alike, who are more than happy to answer any questions that you might have.


    Two that I recommend are the official `Raspberry Pi` forums at [https://www.raspberrypi.org/forums](https://www.raspberrypi.org/forums)
    and the subreddit for `Raspberry Pi` (with over 150,000 subscribers!) at [https://www.reddit.com/r/raspberry_pi/](https://www.reddit.com/r/raspberry_pi/).
    Both of these are fantastic and active boards for you to get answers and to generally
    engage in the Pi hacking community at large.


    Also keep an eye out for other beginners having questions, or - better yet - trying
    and failing. Anybody can follow a tutorial, but mistakes are where the learning
    happens. Keep watch for the mistakes that others make, as well as the mistakes
    that you yourself make. Understand why they’re mistakes, and how things could
    have been done otherwise in order to make things go smoother. All in all, when
    you’re working with `Raspberry Pi`, just try to make every day fun, enjoyable,
    and a learning experience.


    In the end, I’d just like to say thank you for making it to the end of this book,
    I hope I’ve been able to impart some valuable help and insight. I know that getting
    started with `Raspberry Pi` - especially trying to jump in and start programming
    right away - can be quite a daunting task in and of itself. I genuinely hope that
    as you go forward with any and all of your projects that you experience the best
    of luck and that you look back at your time reading this book fondly.


    If that was the case, then I’d love for you to leave a review on Amazon. And even
    if you didn’t like it, leave a review. It’s people like you who help me produce
    quality content.


    Thank you so much for reading, and I wish you the best.


