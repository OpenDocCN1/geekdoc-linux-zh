    \ to see if there are 0, too. Right?\n\nWrong. This is where if else statements\
    \ come into play.\n\nLet’s just sandwich an if else statement for zero bananas\
    \ in there. Observe:\n\n> > > if bananas == 3:\n\n> > > > > print “I have three\
    \ bananas!”\n\n> > > elif bananas == 0:\n\n> > > > > print “I have no bananas,\
    \ and this is a problem.”\n\n> > > else:\n\n> > > > > > print “Huh, well, I don’t\
    \ seem to have three bananas.”\n\nIn this case, it checks to see if bananas is\
    \ 3\\. If not, it goes to the next condition and checks it. If bananas isn’t 0,\
    \ then it finally moves on to the else statement. The if/else block will check\
    \ every condition before resolving itself to the else statement.\n\nLists\n\n\
    Sometimes you need to store connected values together. This is super easy in Python.\
    \ Let’s say you needed to store a student’s grades.\n\n> > > student1Grades =\
    \ [95, 94, 83, 87, 79, 91]\n\nPerfect. You now have a list of 6 grades. You can\
    \ access any of these. Remember, though, that computers start counting from 0,\
    \ not from 1. So if you wanted to print the first item in the list, you’d use:\n\
    \n|  \n\n> > > > print student1Grades[0]\n\n | # would print 95 |\n\nYou can add\
    \ items to a list super easily.\n\n> > > student1Grades.append(86)"
