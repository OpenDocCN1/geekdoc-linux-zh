  trans: "\n后面还有一些文本。如果你没看到这些内容并且正在运行 Windows 系统，请确保你已经为 Python 设置了 `PATH` 变量。\n\n\
    一旦 Python 运行，输入以下内容：\n\n```\nprint “hello world”\n```\n\n控制台应该打印出 hello world。如果是这样，那么恭喜你！你刚刚写了你的第一行\
    \ Python 代码；我希望你觉得很有成就感！写完那行代码后，继续输入 `exit()`。这将终止控制台中的 Python 解释器。\n\n在接下来的课程中，我鼓励你创建自己的文件并尝试这些概念。\n\
    \n# 变量和数据操作\n\n所以，我们正试图在较短的空间内涵盖相当的内容。这意味着其中一些解释可能看起来有些简略，但我并不是故意让它们变得如此——我只是不想在小事上浪费你的时间，而是想涵盖更重要的内容，以免浪费你的时间。\n\
    \n在程序中，有被称为“数据类型”的东西。这些数据类型代表不同形式的不同信息。计算机读取一切都是位（bits）和字节（bytes）；即 1 和 0。我们人类没有那么幸运能以非黑即白的二进制方式思考，所以我们真的必须对事物进行分类和解析。那么，这意味着不同类型的数据被我们和计算机的解释方式是不同的。\n\
    \n例如，如果我给你单词“oyster”（牡蛎）和数字 472，你会说它们是互无关的。对吧？因为它们确实互无关。其中是一个数字，另一个是一个单词。数据类型也是类似的。如果我给你两个单词或两个数字，而你又知道我想表达什么，你就能清楚地看到我在两者之间架起的桥梁。\n\
    \n所以假设你有一个值并想存储它。你要怎么做呢？答案很简单：变量。变量就像代数中的变量一样。`X` 可以是我们想要的任何值，只要它符合方程的要求，对吧？`X`\
    \ 可以取任何值。变量也是如此。我们可以设置定义变量值的“方程”。\n\n在编程的早期时代，你必须定义变量的“类型”。如果你有一个数字，你必须说“数字 x\
    \ 是一个整数”，或者如果你必须存储某的名字，你必须说“单词 name 是一个字符串”。嗯，脚本语言既是祝福也是诅咒，因为这种事情已经不再需要了。脚本语言缓解了那种类型定义。这被称为隐式类型。\n\
    \n假设我们想存储某人的名字，名字叫 Jerry。我们只需创建一个新值，如下所示：\n\n```\nname = “Jerry”\n```\n\n假设我们想存储朋友\
    \ Jerry 的年龄——他 42 岁。\n\n```\nage = 42\n```\n\n嗯，多亏于我们将这些相关信息存储在变量中，我们稍后可以调用它们。如果我们输入：\n\
    \n```\nprint “My friend %s is %d years old.” % (name, age)\n```\n\n它将打印存储在 `name`\
    \ 和 `age` 中的任何值。所以在在这种情况下，它会打印“My friend Jerry is 42 years old.”超级简单。\n\n在 Python\
    \ 中，有几种类型——\n\n| float | 小数数字 | 3.14 |\n| :--- | :--- | :--- |\n| integer | 整数\
    \ | 7 |\n| string | 字符序列 | “Skate park” |\n| boolean | 真/假 | True |\n\n还有更多，但这些是最大的。\n\
    \n# Python 数学\n\n猜猜计算机在做什么？它们进行计算。而且它们非常、非常、非常擅长此道。难怪编程语言字面上讲为了为了数学而设计的。这里没什么好展示的，我会简要说明一下：\n\
    \n| numberOfCats = 4 + 3 | # numberOfCats 将是 7 |\n| numberOfDogs = 8 / 2 | # numberOfDogs\
    \ 将是 4 |\n| numberOfHamsters = 3² | # numberOfHamsters 将是 9 |\n\n记录一下，带有井号（#）的部分是注释。代码会忽略这些内容。当你输入井号（#`）时，你是在告诉编译器——读取并运行你代码的程序——忽略该行中井号之后的任何内容。简单的概念，当然，但值得涵盖。\n\
    \n# 存在，还是不存在？布尔值和比较运算符\n\n等下当我们处理 if/else 语句时，这里会变得意义得多，但现在，只需关注 True（真）或 False（假）的概念即可。某物可以存在，也可以不存在。\n\
    \n如果我说“3 小于 7”，那是它是真的（true）的。如果我说“7 小于 6”，那么它是假的（false）的。我们允许在 Python 中进行这类评估。事实上，我们被鼓励这样做。\n\
    \n```\nnumber1 = 4\nnumber2 = 5\nprint number1 < number2\n```\n\n这会打印“True”，因为它是真的——5\
    \ 大于 4。这是不言自明的，对吧？Python 看到你进行了比较，它会尝试判断该比较是否准确。如果是，它就返回 `True`。如果不是，它就返回 `False`。\n\
    \n你可以将这些评估存储在变量中。\n\n```\nnumber1 = 4\nnumber2 = 5\neval = number1 < number2\n\
    print eval\n```\n\n这会打印“True”，因为 Python 评估了“number1 < number2”是否为真，并将该评估保存到变量\
    \ `eval` 中。就像高中里害羞的孩子一样，在 Python 中有很多方法让事物进行自比比较。这里是基础的：\n\n| < | 小于 |\n| :---\
    \ | :--- |\n| > | 大于 |\n| <= | 小于等于 |\n| >= | 大于等于 |\n| != | 不等于 |\n| == | 等于\
    \ |\n\n既然说了这个话题，要极度小心 `==` 和 `=` 之间的区别。后者是赋值运算符——用于给变量赋值。前者是比较运算符——用于比较两个值。\n\n\
    # If 和 else\n\n我知道，我们过这些过得非常快。\n\n每个程序的生命周期中总有一个时刻它们必须做出重大决定，这只是成长的一部分。你可以利用条件语句来促进这种决策过程。让我们从一个开始。\n\
    \n```\nbananas = 3\nif bananas == 3:\n    print “I have three bananas!”\n```\n\
    \n这个程序做的是是将数字 3 赋值给 `bananas`。然后它运行一个检查来看 `bananas` 是否等于 3。如果是，它打印“I have three\
    \ bananas.”。棒极。如果不是，它就打印……什么都没有。嗯，这真是个棘手。好了。我们如何修复它？我们可以使用 `else` 语句作为兜底，以防 if\
    \ 条件不满足。\n\n```\nif bananas == 3:\n    print “I have three bananas!”\nelse:\n\
    \    print “Huh, well, I don’t seem to have three bananas.”\n```\n\n在这种情况下，如果\
    \ `bananas` 是 3，程序将打印它有 3 根香蕉。如果不是，它将感到困惑并非常清楚地表达出来。但如果它有 0 根香蕉并且很难过并想表达这一点呢？我们已经检查了是否有\
    \ 3 根，不能也检查是否有 0 根，对吧？\n\n错误。这就是 if else 语句派上用场的地方。\n\n让我们在这里加入一个针对 0 根香蕉的 if\
    \ else 语句。观察：\n\n```\nif bananas == 3:\n    print “I have three bananas!”\nelif\
    \ bananas == 0:\n    print “I have no bananas, and this is a problem.”\nelse:\n\
    \    print “Huh, well, I don’t seem to have three bananas.”\n```\n\n在这种情况下，它检查\
    \ `bananas` 是否为 3。如果不是，它会检查下一个条件。如果 `bananas` 不是 0，它最终移动到 `else` 语句。if/else 块会在解析到\
    \ else 语句之前检查每个条件。\n\n# 列表\n\n有时你需要将连接的值存储在一起。这在 Python 中超级简单。假设我们需要存储学生的成绩。\n\
    \n```\nstudent1Grades = [95, 94, 83, 87, 79, 91]\n```\n\n完美。你现在有一个包含 6 个成绩的列表。你可以访问其中的任何一个。但记住，计算机计数从\
    \ 0 开始，而不是从 1。所以如果你想打印列表中的第一个项，你应该使用：\n\n```\nprint student1Grades[0]\n```\n\n\
    # # 会打印 95\n\n你可以超级简单地向列表添加项。\n\n```\nstudent1Grades.append(86)\n```\n\n"
- fmt: "\nAnd you can delete them just by using the `del` keyword and giving their\
    \ index position.\n\n```python\ndel student1Grades[3] # would delete the value\
    \ at index “3”, so the fourth list element - 87\n```\n\nThis would delete `87`\
    \ and push everything in front of `87` back by one index position.\n\n## Loops\n\
    \nLoops are another way of handling the flow of a program. There are two sorts\
    \ of loops in Python: `for` loops and `while` loops. We’ll start with `while`\
    \ loops, because they’re easier.\n\n`while` loops will repeat themselves for as\
    \ long as a condition is met:\n\n```python\nx = 1\nwhile x < 10:\n    print x\n\
    \    x += 1 #adds 1 to x - is same as “x = x + 1”\n```\n\nThis loop would print\
    \ `1` through `10`.\n\n`for` loops serve a bit of a different purpose, especially\
    \ in Python; `for` loops are meant specifically to iterate through a list. Let’s\
    \ take the `student1Grades` example before. If we wanted to print out every grade\
    \ in that list, we’d do like so:\n\n```python\nstudent1Grades = [95, 94, 83, 87,\
    \ 79, 91]\nfor i in student1Grades:\n    print i # would print 95, then 94, then\
    \ 83, etc…\n```\n\nHowever, you can also do the same type of iteration that you\
    \ can do with `while` loops with `for` loops; it’s not exclusively for list iteration.\
    \ To count from `1` to `10`, you’d do the following:\n\n```python\nfor num in\
    \ range(1,10):\n    print num\n```\n\nNote that you can name the iterator variable\
    \ in a `for` loop anything. Notice how this time, it was `num`, while last time,\
    \ it was `i`. Crucial little details that will save you confusion later.\n\n##\
    \ Methods\n\nThis is the last absolutely critical thing to cover in this chapter.\
    \ Methods are the foundation of every good program. They let you break up your\
    \ code in a very modular way and separate the program into logical sequences.\
    \ They also keep you from having to copy and paste code over and over, making\
    \ your code far prettier than it would be otherwise.\n\nThe basic setup of a method\
    \ is like so:\n\n```python\ndef methodname(arguments, if any):\n    # code here\n\
    ```\n\nArguments are things that you can pass into the method as values to be\
    \ worked with. \n\nLet’s take a method that computes the area of a square, for\
    \ example:\n\n```python\ndef computeArea(length, width):\n    print length * width\n\
    ```\n\nWhat this would do is allow somebody to “call” the method, like so:\n\n\
    ```python\ncomputeArea(3, 4)\n```\n\nand then take the arguments given and do\
    \ something with them. Arguments are not necessary, but they are helpful in many\
    \ cases. Not every function will take arguments; some methods will simply serve\
    \ a standalone purpose.\n\nThe method prior would have printed `length * width`,\
    \ or, as we just called it, `3 * 4`. So it would have printed `12`.\n\nWhat if\
    \ we didn’t want it to just print something, though? Once we print the value,\
    \ it’s gone, it’s not being stored. How can we keep the value? That’s where returning\
    \ comes into play.\n\n```python\ndef computeArea(length, width):\n    return length\
    \ * width\n```\n\nThis won’t print the value of `length * width`; rather, it will\
    \ give it back. Since it’s giving the value back, that means we can store it.\
    \ So let’s say we had the following code:\n\n```python\ndef computeArea(length,\
    \ width):\n    return length * width\n\nl = 3\nw = 6\narea = computeArea(l, w)\n\
    ```\n\nThe variable `area` would take the value of `3 * 6`, or `18`, because we\
    \ passed the variables `l` and `w` to the method, and it returned us the value\
    \ of those arguments multiplied by one another.\n\nMethods are immensely useful\
    \ in keeping your code clean and automating processes that you would otherwise\
    \ have to be extremely messy about. For this reason, it’s a good idea to practice\
    \ them and build up as much skill as you can with them.\n\n## Closing\n\nWe managed\
    \ to hit a lot of the big fundamentals of programming. You aren’t ready to write\
    \ a massive 15,000 line program - nobody would be after a simple crash course.\
    \ However, you know what you’re looking at now. It’s through time and exposure\
    \ that you’ll be able to build up the necessary skills to be an expert programmer.\
    \ The point of this chapter was to teach you the essentials of programming as\
    \ they pertain to a Raspberry Pi and the projects that you’ll be doing. It’s going\
    \ to be incredibly frustrating trying to get up to speed when a lot of the projects\
    \ that you’ll be working with have been developed by people who seem light years\
    \ ahead of you in terms of both software development and hardware know-how. The\
    \ key thing that you’ve got to remember is that everybody had to start from nothing\
    \ - nobody starts out knowing something. Eventually, you’ll get to a point where\
    \ you feel comfortable with any project. Perhaps, if you stick with it, you’ll\
    \ even get to a point where you feel like you’re light years ahead of others.\n"
  raw: 'And you can delete them just by using the del keyword and giving their index
    position.


    del student1Grades[3] # would delete the value at index “3”, so the fourth list
    element - 87


    This would delete 87 and push everything in front of 87 back by one index position.


    Loops? Loops.


    Loops are another way of handling the flow of a program. There are two sorts of
    loops in Python: for loops and while loops. We’ll start with while loops, because
    they’re easier.


    While loops will repeat themselves for as long as a condition is met:


    > > > x = 1


    > > > while x < 10:


    > > > > > print x


    > > > > > x += 1 #adds 1 to x - is same as “x = x + 1”


    This loop would print 1 through 10.


    For loops serve a bit of a different purpose, especially in Python; for loops
    are meant specifically to iterate through a list. Let’s take the student1Grades
    example before. If we wanted to print out every grade in that list, we’d do like
    so:


    > > > student1Grades = [95, 94, 83, 87, 79, 91]


    > > > for i in student1Grades:


    > > > > > print i         # would print 95, then 94, then 83, etc…


    However, you can also do the same type of iteration that you can do with while
    loops with for loops; it’s not exclusively for list iteration. To count from 1
    to 10, you’d do the following:


    > > > for num in range(1,10):


    > > > > > print num


    Note that you can name the iterator variable in a for loop anything. Notice how
    this time, it was num, while last time, it was i. Crucial little details that
    will save you confusion later.


    Methods


    This is the last absolutely critical thing to cover in this chapter. Methods are
    the foundation of every good program. They let you break up your code in a very
    modular way and separate the program into logical sequences. They also keep you
    from having to copy and paste code over and over, making your code far prettier
    than it would be otherwise.


    The basic setup of a method is like so:


    > > > def methodname(arguments, if any):


    > > > > > # code here


    Arguments are things that you can pass into the method as values to be worked
    with.


    Let’s take a method that computes the area of a square, for example:


    > > > def computeArea(length, width):


    > > > > > print length * width


    What this would do is allow somebody to “call” the method, like so:


    > > > computeArea(3, 4)


    and then take the arguments given and do something with them. Arguments are not
    necessary, but they are helpful in many cases. Not every function will take arguments;
    some methods will simply serve a standalone purpose.


    The method prior would have printed length * width, or, as we just called it,
    3 * 4. So it would have printed 12.


    What if we didn’t want it to just print something, though? Once we print the value,
    it’s gone, it’s not being stored. How can we keep the value? That’s where returning
    comes into play.


    > > > def computeArea(length, width):


    > > > > > return length * width


    This won’t print the value of length * width; rather, it will give it back. Since
    it’s giving the value back, that means we can store it. So let’s say we had the
    following code:


    > > > def computeArea(length, width):


    > > > > > return length * width


    > > > l = 3


    > > > w = 6


    > > > area = computeArea(l, w)


    The variable area would take the value of 3 * 6, or 18, because we passed the
    variables l and w to the method, and it returned us the value of those arguments
    multiplied by one another.


    Methods are immensely useful in keeping your code clean and automating processes
    that you would otherwise have to be extremely messy about. For this reason, it’s
    a good idea to practice them and build up as much skill as you can with them.


    Closing


    We managed to hit a lot of the big fundamentals of programming. You aren’t ready
    to write a massive 15,000 line program - nobody would be after a simple crash
    course. However, you know what you’re looking at now. It’s through time and exposure
    that you’ll be able to build up the necessary skills to be an expert programmer.
    The point of this chapter was to teach you the essentials of programming as they
    pertain to a Raspberry Pi and the projects that you’ll be doing. It’s going to
    be incredibly frustrating trying to get up to speed when a lot of the projects
    that you’ll be working with have been developed by people who seem light years
    ahead of you in terms of both software development and hardware know-how. The
    key thing that you’ve got to remember is that everybody had to start from nothing
    - nobody starts out knowing something. Eventually, you’ll get to a point where
    you feel comfortable with any project. Perhaps, if you stick with it, you’ll even
    get to a point where you feel like you’re light years ahead of others. Anyhow,
    speaking of other people’s projects, I’m going to now move on to how you can find
    project ideas that you’ll absolutely love.


    Chapter 5


    ![](images/00002.jpg)


    Project Ideas


    I’m sure that at this point, you’re anxious to actually start working with some
    neat Raspberry Pi projects. Well, let me tell you that I’m more than excited to
    get you started on that path.


    The first thing that we’re going to focus on in this chapter is learning where
    you can actually go to find all sorts of cool projects you might not have thought
    about before. Afterward, we’re going to talk about a super cool project that you
    can do super easily at home - the magic mirror! I mentioned it at the beginning,
    but it truly is an incredibly fun and wow-worthy project that will make your mornings
    brighter and leave visitors speechless.


    So first thing’s first: where can you actually go to find projects?


    Well, there are a lot of resources that you’ve got access to as somebody who is
    interested in Raspberry Pi projects. Really, if you’re just looking for inspiration,
    it’s as simple as Googling “cool raspberry pi projects” - you’ll get a ton of
    hits on really awesome projects! There’ll surely be something that can spark some
    sort of interest for you.


    However, the three best ones that I’ve found in terms of actual tutorials are,
    in no particular order, Instructables, Hackster, and Hackaday. All of them have
    their own strengths and weaknesses.


    Let’s take these one at a time.


    Instructables is an excellent resource. The link that I’m referring to in particular
    is audreyobscure’s “Raspberry Pi projects” page at [http://www.instructables.com/id/Raspberry-Pi-Projects/](http://www.instructables.com/id/Raspberry-Pi-Projects/).
    A lot of these have very in-depth tutorials. The only problem is that some of
    them are rather deprecated and/or esoteric.


    Hackster is by far my favorite. This is primarily because it’s very active. There
    are constantly people posting new projects, ideas, and concepts. Generally, these
    will have tutorials. Unlike Instructables, though, many of the projects are just
    for “show and tell” purposes, or a manner of documenting what the person did without
    documenting how they did it. Regardless, it’s still an excellent resource for
    inspiration, and there’s actually quite a bit that you can learn from it as well.
    The relevant link can be found by going to [http://hackster.io](http://hackster.io)
    and typing “Raspberry Pi” in the search bar, or simply going to [https://www.hackster.io/raspberry-pi](https://www.hackster.io/raspberry-pi).'
