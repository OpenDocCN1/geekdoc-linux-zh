    # Introduction


    ![](images/00002.jpg)


    Congratulations on downloading Raspberry Pi and thank you for doing so.


    The following chapters will discuss the innumerable ways that you can work with
    the super versatile Raspberry Pi computing microboard - or, rather, how you can
    make it work for you.


    If you’re reading this, I’m sure you’ve heard at least a couple things about this
    extremely neat gizmo. Maybe you’ve heard of people building massive arcade cabinets
    at home where they and a friend can play their favorite games from back in the
    day; maybe you’ve seen smart mirrors that show people people feed of important
    information as they get ready in the morning; or maybe, you just ran into an article
    about them online and you’re just wanting to know what they can do.


    More likely, since this is a programming essentials book, you’re trying to understand
    how to get the most out of your Raspberry Pi by writing your own scripts or working
    with other people’s scripts.


    Regardless of your reasoning, I can say that getting the Raspberry Pi will most
    certainly be one of the best decisions that you’ve made recently. You’re going
    to be able to do a whole host of super cool things with it and learn a lot about
    technology and engineering in the process.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy!


    # Chapter 1


    ![](images/00002.jpg)


    ## What is Raspberry Pi?


    For the intents and purposes of this book, we’re going to start from nothing and
    assume that you know, well, nothing. So to do that, we have to start with the
    extremely basic questions. The most basic question of all is this: what is the
    Raspberry Pi?


    As I said, the Raspberry Pi is featured quite prominently in a huge number of
    tech DIY projects all over the web. What’s more is that if you’re friends with
    engineers or people who love technology, you probably have a friend or two that
    have already worked with a Raspberry Pi and carried out a project.


    So what, precisely, is the Raspberry Pi? Well, at its most basic, it’s just a
    bunch of parts.


    The Raspberry Pi was developed in 2012 by the Raspberry Pi foundation. The original
    intent of the project was to develop a super small and cost-effective computer
    that could be used to teach basic concepts regarding programming and computer
    science to both schoolchildren and children in developing countries, situations
    where available funds otherwise are quite sparse.


    One of the intents behind the Raspberry Pi is that it’s supposed to be extensible.
    This means that it’s supposed to be very open-ended; you should be able to buy
    a number of modifications and hardware options for it and use them rather easily.
    We’ll talk more about this in the next chapter.


    The Raspberry Pi was successful far beyond its original intent. While it was meant,
    as I said, to solely help money-tight situations - like public schools in developing
    countries - be allowed to fester a knowledge of programming and computer science,
    it quickly became a favorite toy of tech hobbyists everywhere because it allows
    you to do so much with so little.


    Indeed, packed in a very cost effective microboard is a fair amount of computing
    power. However, we’ll get to that in the next chapter, as well.


    So what exactly is a Raspberry Pi? Well, it’s a gateway to possibility. When you
    get a Raspberry Pi, you’re actually getting a million different things that you
    can do with it, too. You can set up a rig to water the plants automatically. You
    could teach your child how to program while they play Minecraft. You could do
    things like retrieve automatic updates on the weather and make an alarm clock
    that dictates them to you in the morning. In short, the Raspberry Pi enables you
    to do a lot of things for very little cost. All it takes on your end is the initial
    money for the Raspberry Pi, the money that you have to expend for the project
    materials, and the ingenuity and know-how to make it happen.


    So with all of that said, I think you’ve got a fair idea of what the Raspberry
    Pi is conceptually, but I’ll recap once more before I bring this chapter to the
    close: the Raspberry Pi is a microcomputer with a ton of processing power for
    its small size. Many models of the Raspberry Pi are little bigger than a credit
    card! With its processing power, you are enabled to do a lot of things that you
    may have dreamed of before.


    # Chapter 2


    ![](images/00002.jpg)


    ## Under the Hood


    So now that we know what a Raspberry Pi is, we need to know what’s powering it.
    At its base, the Raspberry Pi is just a microcomputer; a collection of computer
    parts soldered together in a tiny, practical package.


    However, despite its small size, the Raspberry Pi is generally rather powerful.
    Moreover, several versions are out on the market right now that you can get your
    hands on. In this chapter, we’re going to be discussing the hardware specifications
    of each Raspberry Pi model and what they mean for you. Additionally, later on
    in the chapter, we’re going to be talking about the software which can power Raspberry
    Pi.

