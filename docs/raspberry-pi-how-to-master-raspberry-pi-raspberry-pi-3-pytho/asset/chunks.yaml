  trans: '


    首先，目前市场上共有六种不同的树莓派（Raspberry Pi）。我将简要介绍每个型号的硬件规格，按照从最早到最新的顺序进行。


    ## 树莓派型号


    ### Raspberry Pi 1 Model A+

    第一个型号是基于树莓派原始版本并经过了一些改进。它被称为 `Raspberry Pi 1 Model A+`，是“全功能”树莓派中最低的版本。它有一个 USB
    端口且体积非常小。它的功耗也较低。因此，如果你正在进行的项目不需要太多功率也不需要很多 USB 适配器，那么完全没问题。在 `Raspberry Pi 3`
    之前的型号上，一个 USB 端口通常会被蓝牙或 Wi-Fi 适配器占用，后续过程中请记住这一点。


    ### Raspberry Pi 1 Model B+

    同系列——`Raspberry Pi 1` 的稍改进改进版本被称为 `Model B+`。它具有 4 个 USB 端口，因此扩展性更好。在成本和功耗效率方面，它与
    `Raspberry Pi 1` 共享许多优点，但价格稍贵一点。（不过，你多花点钱也能换来更多的性能）


    ### Raspberry Pi 2 Model B

    在第一个版本发布后，自然有了第二个版本。与第一代一样，你可以很容易地获得第二代 `树莓派`，它名其实地称为 `Raspberry Pi 2`。目前提供的 `Raspberry
    Pi 2` 只有一个型号即 `Model B`。`Raspberry Pi 2 Model B` 比任何一个 `Raspberry 1` 型号都稍贵一点。然而，作为多花一点钱的回报，你获得了一个非常稳固的
    ARM 处理器和整 1GB 的内存。记录一下，ARM 处理器是一项大发现；`Raspberry Pi 2` 拥有 ARM 处理器意味着可以在设备上可行运行任何类型的
    ARM 操作系统。这包括 `Windows 10 ARM` 或 ARM 版本的 `Ubuntu`。这自然地意味着你的设备能力比其他情况强得多，因为你有了更广泛的操作系统可以使用。


    ### Raspberry Pi 3 Model B

    我们需要讨论的下一个 `树莓派` 版本是 `Raspberry Pi 3`。这是目前发布的最新版本的树莓派，它在第二代的基础上增加了许多功能。其中包括内置的蓝牙和
    Wi-Fi，因此你不再需要为它们购买单独的适配器，你的 4 个 USB 端口可以专门用于你想要的任何用途，而不是浪费一两个在小小的无线适配器上。CPU 也经过了大幅升级。除外，其大部分规格与
    `Raspberry Pi 2` 相同。然而，取决于你项目的复杂性和特殊性，你可能希望选择 `Raspberry Pi 3`——毕竟，它的 CPU 更好，这意味着你的项目运行得更快、更高效，谁不想要呢？目前市场上只有一个
    `Raspberry Pi 3` 型号——即 `Model B`。


    ### Raspberry Pi Zero and Zero W

    最后，谈论 `Raspberry Pi Zero` 非常重要。那么，什么是 `Raspberry Pi Zero` 呢？嗯，它是你能获得的性价比最高的 `树莓派`。它非常小，每个板仅需
    5 美元。这非常不错，从价格角度来看，让大量的项目变得超级容易上手。`Raspberry Pi Zero` 在许多方面与 `Raspberry Pi Model
    A+` 共享规格，但要小得多。此外，`Raspberry Pi Zero` 没有标准的 USB 端口。此外，你还可以获得 `Raspberry Pi Zero
    W`，它在很大程度上与 `Raspberry Pi Zero` 相同，但增加了内置 Wi-Fi 和蓝牙连接。取决于你项目的性质，你可能希望选择这种，这样你就可以轻松使用这些功能，而不需要为了这些目的去弄复杂奇特的适配器。`Raspberry
    Pi Zero` 和 `Raspberry Pi Zero W` 在你想制作原型时非常棒，因为它们非常便宜，而且非常适合较小的项目。


    ## 选择正确的版本


    那么，如何知道你应该买哪个版本的树莓派？这真的取决于许多因素。例如，如果你是树莓派的新手，你可能希望选择较便宜的版本，如 `Model A+`、`Model
    B+` 或 `Raspberry Pi Zero`，这样如果你不知道自己在做什么，或者最终不喜欢 `树莓派` 的这种爱好者性质，你就不会花这么多钱。如果你想要一个持续时间更长且在硬件方面更有竞争力的项目，你应该绝对选择可用最新版本的
    `树莓派`。根结底，这是一个预算问题。此外，如果你发现了一个想要参与的项目，你可能希望使用与创建该项目的人完全相同的树莓派版本，仅仅是因为这样做就不会出现任何“翻译错误”，在代码或脚本上也不会有任何障碍。


    ## 如何购买树莓派


    当你决定是时候全力投入并购买一个树莓派时，其实非常简单。首先，访问 `http://raspberrypi.org`。在顶部导航栏上，搜索图标下方有一个写着“Shop”（商店）的“标签”。点击它，你就会被带到树莓派在线商店。点击你喜欢的树莓派版本（如果你愿意，也可以利用这个机会更直接地比较规格），然后在相应的页面向下滚动。在页面下方一点，你会看到写着“Buy
    from our distributors”（从我们的经销商处购买），然后按国家或地区划分的区域。某些链接无法跳转，但如果你从树莓派网站获得了一个损坏链接，只需尝试另一个，直到到达你想去的地方为止。


    最终，你会发现自己位于拥有你想要使用的树莓派版本的商店。如果你想这样做，可以利用这个机会看看所有适用于树莓派的配件。不过我要提醒你一下；有很多配件。翻一翻，看看是否有任何你可能需要的项目灵感素材。树莓派是目前支持最好的微型板之一，我确定你一定能出点子。总之，一旦你确定了购买某个特定的树莓派，只需放松。你现在要做的就是等待你的新玩具寄到，然后开始玩，这应该不会太久……对吧？


    ## 软件


    现在我们讨论了硬件和在哪里购买树莓派之后，我觉得谈论驱动树莓派的软件也是恰好的。


    型号 2 和 3 的树莓派理论上可以运行任何适用于其架构的 ARM 操作系统。这在可以使用操作系统方面留下了巨大的选择空间。


    通常，大多数人会选择树莓派团队支持的操作系统 `Raspbian`，它是流行的 Linux 操作系统 `Debian` 的衍生发行版。`Raspbian`
    预装了大量工具，旨在帮助人们在几乎不花钱的情况下获得一个运行的操作系统，以及许多旨在以有趣的方式教人们（主要是孩子们）编程的工具。其中包括诸如 `Minecraft
    Pi` 等程序，让人们可以在玩我的世界的同时使用 `Python` 代码来改进游戏体验。此外，还包含了 MIT 创建的 `Scratch`，它通过拼图式的命令来演示程序流和计算机逻辑。


    '
- fmt: '

    There are a lot of options available, though, if you’re inclined. For you to truly
    get `Raspberry Pi` experience, you should opt for `Raspbian`, but once you have
    more experience and want to start experimenting, there are things such as `Windows10`,
    `Arch Linux`, `Gentoo`, `Ubuntu`, `Kali Linux`, and `FreeBSD`. All of these have
    their own uses, depending upon what you’re wanting to do and what your goal is
    with `Raspberry Pi`. But, for right now, the `Raspbian` operating system is actually
    optimized for the `Raspberry Pi` and has a huge number of packages just for it,
    so I highly recommend you work with it.


    # Chapter 3


    ## Setting Up


    At this point, I’m assuming that you’ve gotten your hands on your Pi. If you haven’t,
    you can still proceed to Chapter 4 and practice your chops and then refer back
    to this when your Pi is in.


    If your Pi is in, then perfect! You’re absolutely ready for this chapter. This
    chapter is going to focus on how to get your Pi up and running. I’m focusing specifically
    on the `Raspberry Pi 3`. However, the instructions should be relatively similar
    regardless of which version of the Pi that you’re using. Adapt and do prior.


    So, here are the things you’re going to need for this chapter:


    - **Raspberry Pi**: This one goes without saying. You’re going to need a `Raspberry
    Pi` in order to set up.

    - **Screen of some form with `HDMI` input**: It can be a TV or a monitor, it doesn’t
    matter much. What matters, ultimately, is regardless of which one it is, it has
    `HDMI` input. The Pi exclusively has `HDMI` output, so whatever screen you’re
    using, it has to accept `HDMI`.

    - **USB peripherals**: You’re going to need to control the Pi. A `USB`-connected
    keyboard and mouse are more than optimal for you’re needing here.

    - **MicroSD card**: You’re going to need at least an eight gigabyte `MicroSD card`
    for your Pi. Everything is read off an `SD card` on the Pi. Where on most computers,
    you have an external hard drive, like a `SATA` drive, the Pi runs off the `SD
    card`. You can actually set your Pi up to read off a `USB` drive or external hard
    drive, but the `SD card` is the most direct and easy method.

    - **Power**: The `Raspberry Pi`’s power source is `microUSB`. This sort of connection
    is the same as that powers most smartphones. The cord has to be good enough to
    supply two a half amps, because otherwise you’re underpowering your Pi and may
    fry it - it’s far easier than you would think! Play it safe and be sure that you’re
    using the right voltage. If you’re unsure, refer to Chapter 6 and ask around.

    - **NOOBS**: Installing the suggested `Raspberry Pi` Linux distribution, `Raspbian`,
    used to be rather difficult. Recently, in relative terms at least, the `Raspberry
    Pi` team have released a utility called `NOOBS` (“New Out of Box Software”) that
    makes it dramatically easier than it was. No longer do you need to tamper with
    the `Terminal` just to get a copy of `Raspbian` onto your `SD card`; just get
    a copy of `NOOBS` and you’re good to go. You can get `NOOBS` at [https://www.raspberrypi.org/downloads/noobs/](https://www.raspberrypi.org/downloads/noobs/)
    — get the version which has an offline installation, as this one will come with
    the operating system alongside it.


    So here’s what you do. The first thing you need to do is plug your `microSD card`
    into your computer. How you have to do this will depend upon your computer’s set-up
    for `SD cards`; it’s possible that you may need to go and buy a reader for it,
    or a `microSD` to `SD` adapter. Some computers - mine, for instance - support
    `SD cards` but not `microSD cards`, which is one example of when you would need
    the adapter.


    Once you’ve gotten your card hooked up to your computer, you need to format the
    card to `FAT`. This is simple enough to do.


    ### FAT format, Windows


    All you do is plug the `SD card` in. Then, go to `Windows Explorer`. Windows oldies
    remember this as “My Computer”. From here, find the `SD` storage device in the
    left pane of your screen. Right click it, and then click “Format…”. Make certain
    that you don’t have any sensitive data on there that you need to make a backup
    of. If you do, copy the files to your computer right quick before you format.
    Afterward, carry out the formatting. You simply need to format as `(MS-DOS) FAT`,
    naming the drive whatever you’d like.


    ### FAT format, Mac


    Open the `Disk Utility` and make absolutely certain that you’ve selected the right
    volume. If you accidentally choose the wrong volume, you could lose some very
    important information and format the wrong drive altogether! This is very much
    not desirable. Once you’ve made certain that you’ve selected the correct drive
    and there’s no important information on the `SD card`, you just click “Erase...”
    with the formatting type being “MS-DOS”.


    ### FAT format, Linux


    Get `gparted` if you don’t already have it (you’re a `Linux` user - of course
    you do!). In `gparted`, select the appropriate drive, once again making sure that
    you’ve selected the absolutely correct drive, and then format to `fat32`. Simple.


    Now, once all of that is taken care of, you should have a formatted `SD card`
    that’s ready for the `NOOBS` files. All that you do is take the `NOOBS` zip file
    that you just downloaded, extract it to a folder, and copy all of it to your `SD
    card`. Once every file has been copied (it may take a minute or so, depending
    upon the speed of your computer), the next thing that you have to do is plug the
    `microSD card` into your `Raspberry Pi`. After that, you need to start attaching
    all necessary cables to your Pi. Plug in the power last, because the Raspberry
    Pi will turn on when the power is plugged in.

    '
