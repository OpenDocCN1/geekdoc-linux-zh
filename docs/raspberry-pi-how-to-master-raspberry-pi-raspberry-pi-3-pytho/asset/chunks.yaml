    > > > > •USB peripherals: You’re going to need to control the Pi somehow. A USB-connected
    keyboard and mouse are more than optimal for what you’re needing here.


    > > > > •MicroSD card: You’re going to need at least an eight gigabyte MicroSD
    card for your Pi. Everything is read off of an SD card on the Pi. Where on most
    computers, you have an external hard drive connected, like a SATA drive, the Pi
    runs off of the SD card. You can actually set your Pi up to read off of a USB
    drive or an external hard drive, but the SD card is the most direct and easy method.


    > > > > •Power: The Raspberry Pi’s power source is a microUSB. This sort of connection
    is the same as that which powers most Android smartphones. The cord has to be
    good enough to supply two and a half amps of voltage, because otherwise, you’re
    underpowering your Pi and may fry it - it’s far easier than you would think! Play
    it safe and be sure that you’re using the right voltage. If you’re unsure, refer
    to the communities in Chapter 6 and ask around to be sure.


    > > > > •NOOBS: Installling the suggested Raspberry Pi Linux distribution, Raspbian,
    used to be rather difficult. Recently, in relative terms at least, the Raspberry
    Pi team have released a utility called NOOBS (“New Out of Box Software”) that
    makes it dramatically easier than it was. No longer do you need to tamper with
    the Terminal just to get a copy of Raspbian onto your SD card; just get a copy
    of NOOBS and you’re good to go. You can get NOOBS at [https://www.raspberrypi.org/downloads/noobs/](https://www.raspberrypi.org/downloads/noobs/)
    — get the version which has an offline installation, as this one will come with
    the operating system alongside it.


    So here’s what you do. The first thing you need to do is plug your microSD card
    into your computer. How you have to do this will depend upon your computer’s set-up
    for SD cards; it’s possible that you may need to go and buy a reader for it, or
    a microSD to SD adapter. Some computers - mine, for instance - support SD cards
    but not microSD cards, which is one example of when you would need the adapter.


    Once you’ve gotten your card hooked up to your computer, you need to format the
    card to FAT. This is simple enough to do.


    FAT format, Windows:


    All you do is plug the SD card in. Then, go to Windows Explorer. Windows oldies
    will remember this as “My Computer”. From here, find the SD storage device in
    the left pane of your screen. Right click it, and then click “Format…”. Make certain
    that you don’t have any sensitive data on there that you need to make a backup
    of. If you do, copy the files to your computer right quick before you format.
    Afterward, carry out the formatting. You simply need to format as (MS-DOS) FAT,
    naming the drive whatever you’d like.


    FAT format, Mac:


    Open the Disk Utility and make absolutely certain that you’ve selected the right
    volume. If you accidentally choose the wrong volume, you could lose some very
    important information and format the wrong drive altogether! This is very much
    not desirable. Once you’ve made certain that you’ve selected the correct drive
    and there’s no important information on the SD card, you just click “Erase...”
    with the formatting type being “MS-DOS”.


    FAT format, Linux:


    Get gparted if you don’t already have it (you’re a Linux user - of course you
    do!). In gparted, select the appropriate drive, once again making sure that you’ve
    selected the absolutely correct drive, and then format to fat32\. Simple.


    Now, once all of that is taken care of, you should have a formatted SD card that’s
    ready for the NOOBS files. All that you do is take the NOOBS zip file that you
    just downloaded, extract it to a folder, and copy all of it to your SD card. Once
    every file has been copied over (it may take a minute or so, depending upon the
    speed of your computer), you can then call this part of the installation process
    good.


    The next thing that you have to do is plug the microSD card into your Raspberry
    Pi. After that, you need to start attaching all necessary cables to your Raspberry
    Pi. Plug in the power last, because the Raspberry Pi will turn on automatically
    when the power is plugged in. Plug in all other devices first, such as your monitors,
    keyboard, mouse, any wireless dongles, and your wired internet connection if applicable.


    If everything went well, then as soon as you boot up your Raspberry Pi, you should
    be taken to the NOOBS installation. It should, for the most part, set itself up.
    The entire process is incredibly easy; after all, the Raspberry Pi itself was
    made so that people with pretty much no computer or tech experience at all can
    easily pick it up and start hacking away. The only precaution here is to make
    sure that you select to install Raspbian, because Raspbian is what we’ll be working
    with in this book, and what most Raspberry Pi projects use, actually. Technically,
    the Raspberry Pi can run any ARM operating system, but Raspbian is the best for
    people who are new to Raspberry Pi.


    Spectacularly, once the set-up is done handling itself, it’ll end up restarting.
    At this point, you’re done with the initial set-up. Everything from here is just
    setting up wireless networks and bluetooth devices, if necessary.


    With that, you’re essentially done with setting up your Raspberry Pi. What once
    seemed rather daunting has turned out to be quite easy in reality! Don’t worry
    - the fun is only just beginning, and there is plenty of frustration ahead! But,
    to match all of the frustration, sighs, and head scratching, you’ll get to experience
    the liberating and truly one of a kind feeling of having something work. Engineering
    of all forms is 90% disappointment and 10% payoff. However, the payoff is one
    of the best feelings that you’ll ever have.


    When you’re jumping in from nothing, there is going to be quite a bit that you
    don’t really understand. In order to mitigate that feeling of hopeless ignorance
    and to help you understand some of the code snippets and scripts that you will
    encounter as you go forward and start working with a ton of different projects,
    it’s imperative that I now help you to understand how to write basic Python and
    what all of the underlying concepts behind programming are.


    Chapter 4'
