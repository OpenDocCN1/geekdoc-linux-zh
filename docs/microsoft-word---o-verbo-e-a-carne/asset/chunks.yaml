    [content]

    Nessa liberdade que os `roustainguistas` estão tomando de falsificar um livro
    respeitabilíssimo como é a Bíblia, de adulterar o pensamento e a palavra escrita
    de `Allan Kardec`, de aceitar instrução de Espíritos mistificadores, que tomam
    o nome dos Apóstolos, dos Evangelistas e do Codificador, para sustentarem uma
    tese que este combateu vivamente, e que não pode ser aceita por quem tenha sólida
    cultura evangélica?


    Concordem que o escândalo não é nosso. Lembrem-se de que também houve quem se
    escandalizasse com os ensinos de `Jesus Cristo`. Mas recordem as palavras do Nazareno
    em relação aos que viam escândalo no que dizia `59`.


    ***


    Os dias que estamos vivendo mostram que a humanidade tende para uma fé raciocinada.
    É a incompreensão desse aspecto do problema religioso o que produz o despovoamento
    das religiões dogmatizadoras e ritualísticas e o açodamento de seus sacerdotes,
    principalmente na `Igreja Católica`, contra a doutrina espírita.


    É de lembrar que o `Espiritismo` brotou nos meios Protestantes, os quais, indiscutivelmente
    – apesar das reservas que lhes fazemos – estadeiam um padrão de moralidade pessoal
    e religiosa que não pede meças nem aos Católicos, nem aos Espíritas. Nota-se ainda
    que o estudo sistemático da Bíblia, aliado à observação, `59 Mateus; 5:29 e 30`
    e `1 Pedro; 2:8`.


    ## `68`


    Ao estudo e à análise dos fatos, está levando algumas denominações protestantes
    a se aproximarem do `Espiritismo`, prenunciando um entendimento e, quiçá, uma
    fusão em próximo futuro. E tal fenômeno não é ainda mais acentuado porque de um
    modo geral, os Espíritas revelam um lamentável desconhecimento da Bíblia `60`.


    O trabalho do clero católico – posto algumas confrarias já se dêem ao estudo experimental
    do `Espiritismo` – é no sentido de sua destruição. E nós sabemos, pelo conhecimento
    experimental, pelo lado prático, que os Espíritos levam para o outro plano da
    vida as idéias os cacoetes e as idiossincrasias que os caracterizavam como homens.
    Não é, pois, de admirar que os Espíritos de padres católicos estejam empenhados
    nessa obra de mistificação e de desconhecimento da doutrina, para o que está concorrendo
    grandamente a teoria de `Roustaing` e a orientação prática que os magnatas do
    `roustainguismo` estão imprimindo nos espíritos mais ou menos simplórios, que
    ainda mantém um respeito religioso pela antiga Casa de Ismael, hoje transformada
    em Sinagoga de Satã, como se depreende dos dispositivos de seus estatutos, que
    barram os kardecistas na participação de sua diretoria e exigem a confissão expressa
    do credo `roustainguista`.


    Os espíritas observadores têm encontrado inúmeras criaturas obsidiadas por Espíritos
    e, até, por falanges de padres católicos; jamais as encontramos dominadas por
    Espíritos vindos dos meios protestantes. E porque? Porque em vida tais Espíritos
    aprenderam a letra da Bíblia e souberam, ao menos, viver dentro da lei, embora
    não tenham penetrado todo o conteúdo espiritual que as suas letras encerram.


