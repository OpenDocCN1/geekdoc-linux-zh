    17


    Não podemos separar os princípios éticos do contexto de nenhum problema espiritual.
    Alega-se também que Jesus ensinava em parábolas. Mas as parábolas não são mentiras,
    são formas alegóricas, simbólicas de transmissão da Verdade. A própria Psicologia
    materialista constatou essa necessidade de sermos verdadeiros no ensino das coisas
    mais corriqueiras, condenando as explicações fantasiosas do nascimento das crianças.
    Se a lenda ingênua da cegonha é um mal por ser mentirosa, que dizer do mito absurdo
    do nascimento fingido de Jesus? O uso da alegoria é válido e prepara o advento
    da verdade, mas o uso do fingimento é próprio dos mistificadores, dos embusteiros,
    das criaturas falsas e não de espíritos esclarecidos.


    O mesmo se aplica ao episódio ridículo da permanência de Jesus menino em Jerusalém.
    O menino não era menino, mas um espírito adulto disfarçado em criança. Enganava
    os doutores da lei com suas respostas astuciosas e enganava o povo com suas fugas
    para o Céu, deixando as roupas em mãos dos anjos que o ajudavam na mistificação.
    E por que tudo isso? Porque em Jerusalém, justificam os "ministros de Deus” era
    difícil encontrar lugar para um menino permanecer três dias sozinho. Desculpa
    tola, como se vê, que só tem uma justificativa: `uma mentira puxa a outra`.


    Bem precário seria o poder divino se estivesse submetido à condição de recorrer
    aos ardis humanos, às espertezas comuns dos passadores de conto do vigário, para
    poder trazer a Verdade à Terra. Não são os mestres espirituais que se utilizam
    dessas formas grosseiras de mistificação, mas os espíritos mistificadores, os
    embusteiros vulgares. Justifica-se pois o ardor de João, o evangelista, e de Pedro,
    o apóstolo, ao repelirem a teoria do corpo fluídico, bem como o ardor de Paulo
    ao nos advertir contra as fábulas que desfiguram a Doutrina do Cristo 14.


    A frase do último trecho acima citado: "Voltava para as regiões superiores onde
    pairava e paira ainda. .. " encerra uma malícia diabólica. Afirmando que Jesus
    retornava aos esplendores celestes, como espírito protetor e governador da Terra,
    ela pretende encobrir com essa declaração enfática o ridículo da esperteza do
    menino.


    Os corações ingênuos se comovem com essa falsa abnegação de um deus mitológico,
    obrigado a participar entre os homens de uma pantomima celeste, e o raciocínio
    enganado justifica o mito.


    ## VIII REPETIÇÕES E RETROCESSO


    Esgotada a leitura do primeiro volume, a leitura do primeiro volume de `Os Quatro
    Evangelhos` coloca o leitor num verdadeiro redoinho de repetições. Uma simples
    consulta a cada um dos volumes revela isso.


    Kardec avisou, ao registrar o aparecimento da obra, que ela era demasiado vasta.
    Posteriormente, assinalou, como vimos no próprio artigo na `Revista Espírita`,
    número de 1866 15, e reproduzido para contestação no primeiro volume, que esta
    obra nada mais fez de avançar:


