    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________

    90


    Aquela velha gente podia equivocar-se, mas tinha gestos elegantes como este de
    fechar a introdução com uma mensagem do Espírito do próprio Allan Kardec, dada
    na sociedade, focalizando a questão: "Sim" diz Kardec, "porque ainda que qualquer
    idéia, das aí colecionadas, tivesse de sofrer qualquer retoque ou modificação,
    seria trabalho reservado para uma obra especial, cuja leitura, sendo boa para
    aqueles que já conhecem profundamente a Ciência Espírita, não convém àqueles que
    apenas começam: porque não estando preparados, teriam de fazer passar bruscamente
    por uma inversão todas as idéias arraigadas em seus cérebros, o que é contrário
    às leis naturais, e por isso inconveniente".


    "Não defendo a obra que colecionei, mas o melhor sistema de, com método, lenta
    e suavemente, preparar aqueles que devem conhecer o que de mais elevado poderia
    se apresentar à concepção humana".


    Estas palavras criteriosas estão longe de significar uma adesão de Allan Kardec
    ao roustainguismo. Este não passa de um equívoco que deve ser destruído elegantemente,
    segundo os postulados da doutrina espírita cristã, sintetizado no pensamento agostiniano:
    abraçar os homens mas profligar (destruir) os seus erros.


    *****


    Um paralelo entre os trabalhos de Kardec e de Roustaing mostra o seguinte:


    a) Kardec seguiu critérios científicos; Roustaing, NÃO;

    b) as afirmações fundamentais de Kardec têm concordância universal; as de Roustaing,
    NÃO;

    c) Kardec respeitou a ética nas pesquisas e citações; Roustaing e, principalmente,
    os roustainguistas, NÃO;

    d) Kardec promoveu sempre a discussão, para chegar ao esclarecimento; o roustainguismo
    foge e proíbe a discussão, para evitar a evidenciação do erro;

    e) Kardec é cristão: respeita os textos evangélicos e promove a união; Roustaing
    é anticristão: deforma os textos e exclui os kardecistas;

    f) a obra de Kardec resiste à lógica, à crítica, ao bom senso e à moral; a de
    Roustaing é anti-científica, insensata e imoral, porque infama o caráter de Jesus
    Cristo;

    g) como Espírito, Kardec sustenta a inteireza de sua obra; como Espírito Roustaing
    confessa o seu erro;

    h) os cientistas contemporâneos e posteriores a Kardec que na França, Itália,
    Alemanha, Rússia, Inglaterra e Estados Unidos investigaram o Espiritismo, deixaram
    trabalhos concordantes com a codificação kardeciana; nenhum deles, entretanto,
    tomou conhecimento, do trabalho de Roustaing e qualquer referência indireta de
    sua tese central é no sentido de a condenar;

    i) a obra de Kardec conduz à emancipação do dogmatismo e do ritual religioso;
    a de Roustaing submete o indivíduo aos dogmas e destrói a função social da doutrina
    espírita, que é essa mesma libertação, de que é exemplo a mariolatria dos roustainguistas.


    *****


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________

    91


    Encerremos este trabalho.


    Sabiam os judeus, que estudaram a lei e os profetas, bem como os Saduceus, que
    se haviam apoderado do Templo e punham em leilão o cargo de sumo sacerdote, transformando
    a religião em mercantilismo e a autoridade religiosa em privilégio oligárquico
    de uma família, como se verifica ao tempo da pregação e do sacrifício de Jesus
    Cristo, que era chegado o instante profetizado para a vinda do Messias.


    Por palavras e atos Jesus mostrou-se hostil a entendimentos que confundiam interesses
    religiosos com situações políticas, fosse da conchavo com as autoridades, fosse
    de chefia de uma rebelião.


    Com o correr dos tempos abastardou-se o Cristianismo, ante a pressão das coisas
    materiais, contato com os políticos, proximidade do poder, tentação do conforto
    e do mandonismo. Paralelamente agiam outras forças sutis: o sincretismo religioso,
    marcante na liturgia, no rito, nas práticas externas do culto, já então católico,
    menos por força da generalização de um conceito filosófico do que por um imperativo
    político de religião oficial de um império que dominava o mundo.


    Os dirigentes católicos herdaram, do lado romano, esse espírito de dominação e
    do lado rabínico a capacidade de mercantilismo com as coisas religiosas. Ora,
    para um como para o outro desses aspectos era prejudicial a prática da mediunidade.
    Os médiuns viriam a ser para a hierarquia sacerdotal aquilo que para o rabinismo
    haviam sido os profetas – um aguilhão ou uma chibata. E simplesmente aboliram
    a mediunidade: por todos os processos, inclusive pelas torturas e pelas fogueiras.

