    em apoio à obra de `Roustaing`. Nós solicitamos o autor a exibir aqueles artigos
    do Codificador em cópia fiel e na íntegra. As despesas correrão por nossa conta:
    basta que a `F.E.B.` exiba os originais, que ninguém lhes tira.


    Em oposição à sua afirmação queremos citar de um contemporâneo de `Roustaing`
    e seu admirador. É o Sr. `J. Malgras`, autor de `Pionniers du Spiritisme en France,
    Librairie des Sciences Psychologiques - Paris, 1906`. Depois de algumas páginas
    entusiasmo pelo Sr. `Roustaing`, diz ele, à página 39:


    Felizmente o Sr. `Gomes Braga` diz à página 24: `Kardec` crê no Evangelho e toma-o
    por livro sagrado da `Segunda Revelação`. E logo adiante: `Portanto, o Espiritismo
    codificado por Allan Kardec é cristão, é Revelação iniciada em Moisés, confirmada
    por Jesus e continuada hoje pelos espíritos em obras`. E à página 25 diz: `as
    três Revelações formam um todo solidário, pois, quem nega parte, está inconscientemente
    demolindo sua própria casa`, *etc.*


    É uma felicidade que o próprio Sr. `Gomes Braga` ajude a nossa argumentação. Com
    efeito, à página 13, transcreve palavras de `Kardec` que vêm como costuma dizer,
    a tal de foice: `Ao lermos estas palavras tão claras, pronunciadas por Jesus,
    lembram-nos que Kardec escreveu em "Obras Póstumas" (IV - Palavras de Jesus depois
    de sua morte): Que maior autoridade do que próprias palavras de Jesus? Quando
    ele diz, categoricamente: eu sou, ou não sou tal coisa, quem tem direito de desmenti-lo
    ainda que seja para coloc-lo mais alto? Quem pode, razoavelmente, pretender, melhor
    do que ele, conhecer-lhe a natureza? Que interpretações podem prevalecer contra
    afirmações tão formais e tão numerosas, como estas?`


    O leitor preste bem atenção, releia estas citações e agora veja o que diz João,
    o Apóstolo predileto do Mestre, aquele que foi seu confidente, o depositário máximo
    do seu ensino: aquele que os estudios consideram como tendo tido a tarefa de revelar
    o Cristo e denunciar o anticristo; aquele, tendo sido o mais jovem do grupo, foi
    o que teve vida mais longa e foi respeitado até pelos inimigos; aquele que se
    plantou como uma atalaia da doutrina cristã, deixou-nos o Evangelho filosófico
    e as tremendas profecias do Apocalipse, realizadas umas, em vias de realização,
    outras.


    Vejamos João, VIII:40, Versão de `Almeida`: "Mas agora procurais matar-me, a mim,
    homem que vos tenho dito a verdade que de Deus tenho ouvido; Abraão não fez isto".
    Em `Figueiredo` lê-se: "... mim que sou um homem", etc.; em `Diodati`: "... voi
    cercate d''ccider me, uomo che vi ho proposta la verità", etc.; na versão inglesa:
    "... to kill me, a man that hath told you the truth", etc.; por fim o texto grego:
    Mas para os roustainguistas...


    Há mais ainda. Nas Epístolas, definindo o anticristo, João é claríssimo. Assim,
    1 João, 4:1 a 3 e 6 lemos:


    Na versão de `Almeida`: "Amados, não creiais a todo o espírito, mas provai se
    os espíritos são de Deus; porque já muitos falsos profetas se têm levantado no
    mundo. Nisto conhecereis o Espírito de Deus; todo o espírito que confessa que
    Jesus Cristo veio em carne é de Deus; E todo o espírito que não confessa que Jesus
    Cristo veio em carne não é de Deus; mas este é o espírito do anticristo, do qual
    já ouviste que há-de vir, e eis que está já no mundo. – Nós de Deus; aquele que
    conhece a Deus ouve-nos; aquele que não é de Deus não nos ouve. Nisto conhecemos
    nós o espírito da verdade e o espírito do erro".

