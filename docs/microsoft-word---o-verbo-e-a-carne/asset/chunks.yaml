- fmt: "\n51 Pastorino, C. T. Sabedoria do Evangelho – 1ª Volume – Introdução. Veja\
    \ também o Livro histórico de Werner Keller: *E a Bíblia Tinha Razão*.\n\n52 Oportuna\
    \ observação, pois é evidente a relação entre as forças católicas contrárias ao\
    \ Espiritismo e as forças espirituais que defendem a obra de Roustaing. Todos\
    \ os que escrevem e lutam contra a mistificação roustainguista sabem quanto são\
    \ atacados pelas falanges católicas do espaço, que defendem essa obra como um\
    \ instrumento eficiente de ridicularização e desmoralização do Espiritismo. Os\
    \ grupos roustainguistas estão sempre sob a fascinação dessas forças (H.P.).\n\
    \n# O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________\n\
    \n59\n\numa refutação honesta, uma argumentação lógica, e isso só se consegue\
    \ a custa de muito estudo sistemático e paciente, o que requer anos de devotamento\
    \ para tentar provar possíveis inverdades em textos tão respeitáveis.\n\nMas não\
    \ assim para os roustainguistas. Roustaing deixou-se contaminar pela moda da época,\
    \ de conversar com os Espíritos; tomou gosto e quis tornar-se célebre, rivalizando\
    \ ou superando Kardec. A vaidade foi a brecha por onde entraram os mistificadores.\
    \ O resultado aí está: os Espíritos clericais fizeram um carnaval; acabaram desorganizando\
    \ na França o que Kardec paciente, humilde e sabiamente havia organizado.\n\n\
    Em relação ao caso no Brasil, os mesmos mistificadores encontraram o terreno fácil,\
    \ mercê da incultura geral do povo, da falta de conhecimento sistematizado e assuntos\
    \ religiosos nas camadas mais cultas e, principalmente, da grande falha do brasileiro\
    \ no tocante ao conhecimento do livro singularíssimo que é a Bíblia. O sincretismo\
    \ religioso encarregou-se do resto.\n\nJá é tempo de destruir o equívoco representado\
    \ pelo roustainguismo.\n\n\"Nem de noite nem de dia se apagará; para sempre a\
    \ sua fumaça subirá; de geração em geração será assolada; pelos séculos dos séculos\
    \ ninguém passará por ela. Mas o pelicano e o nossoiço a possuirão; a coruja e\
    \ o corvo nela habitarão; e ele estenderá sobre ela o cordel de confusão e o prumo\
    \ de vaidade. Eles chamarão ao reino os seus nobres, mas nenhum haverá; e todos\
    \ os seus príncipes não serão coisa nenhuma. E crescerão espinhos nos seus palácios,\
    \ urtigas e cardos nas suas fortalezas; e será uma habitação de chacais, um sítio\
    \ para avestruzes\" (Isaías; 34:10 a 13).\n\n\"Eis que todos são vaidade. As suas\
    \ obras não são coisa alguma; as suas imagens de fundição são vento e coisa vã’\
    \ (Isaías; 41:29).\n\n\"Ninguém há que invoque a justiça com retidão, nem há quem\
    \ pleiteie com verdade; confiam na vaidade, e falam mentiras; concebem o mal,\
    \ e dão à luz a iniqüidade\" (Isaías, 59:4).\n\n\"E disseme o Senhor: Os profetas\
    \ profetizam mentiras em meu nome; não os enviei, nem lhes dei ordem, nem lhes\
    \ falei. Visão falsa, adivinhação, vaidade e o engano do seu coração é o que eles\
    \ profetizam\" (Jeremias; 14:14).\n\n\"Viram vaidade e adivinhação mentirosa os\
    \ que dizem: O Senhor diz; quando o Senhor não os enviou; e esperam que seja cumprida\
    \ a palavra. Acaso não tivestes visão de vaidade, e não falastes adivinhação mentirosa,\
    \ quando dissestes: O Senhor dizendo que eu não falei? Portanto assim diz o Senhor:\
    \ Porque tendes falado vaidade, e visto mentiras, por isso eis que sou contra\
    \ vós, diz o Senhor. E a minha mão será contra os profetas que vêem vaidade e\
    \ que adivinham mentira; não estarão no concílio do meu povo, nem escreverão,\
    \ nem entrarão na terra de Israel; eeis que eu sou o Senhor\" (Ezequiel; 13:9).\n\
    \n# O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________\n\
    \n60\n\n## III - Análise das Teses \n\nPostas as coisas neste pé, prossigamos\
    \ na análise. Podemos agrupar as seguintes teses:\n\nI - \"Que a obra exclusiva\
    \ de `Collignon` tem hoje caráter de universalidade, porque espíritos a confirmaram\
