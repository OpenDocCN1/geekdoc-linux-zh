    "The bodies of Elijah and Enoch were doubtless changed or transformed as Paul
    describes in `1 Cor.-15: 51-52` - the verses immediately following the wellknown
    passage, that flesh cannot inherit the kingdom. They were changed finto spiritualized
    bodies like in some degree that with which Christ rose , froco dead. His ressurection
    body seemed to be made of flesh, but it was clearly different froco that which
    he possessed before his death. All the redeemed, the saints who have died before
    Christ''s coming and those who are clive when he comes, are promised these new
    "celestial" bodies for the heavenly life. These are the views of commentators
    who have discussed the subject".


    ### Traduzindo:


    "Que foi o que aconteceu ao corpo de Elias?"


    "Os corpos de Elias e de Enoque sem dúvida foram mudados ou transformados, como
    descreve Paulo em `1 Corintios; 15:51 e 52` - versículos que se seguem imediatamente
    à conhecida passagem de que a carne não pode herdar o reino. Foram mudados em
    corpos espiritualizados, como, de certo modo, aquele com qual o Cristo se ergueu
    de entre os mortos. O corpo de sua ressurreição parecia feito de carne, mas era
    claramente diferente do que possuía antes de sua morte. A todos os redimidos,
    aos santos que morreram antes da vinda do Cristo e aos que estirem vivos quando
    ele vier são prometidos novos corpos “celestiais" para a vida celeste. São estes
    os pontos de vistas dos comentadores que discutiram a matéria" (O normando é nosso).


    Veja-se como os protestantes, que não admitem as aparições de Espíritos, que não
    compreendem se fale em fantasmas e agêneres; que até agora não saíram de uma grande
    confusão, motivada pelo emprego indiscriminado, na Bíblia, dos vocábulos `espírito`,
    `Senhor` e `Deus`; que levaram sua repulsa ao ponto de não admitirem certos livros
    da Bíblia, considerados não canônicos, entre os quais o de Tobias, que é toda
    uma longa história de um espírito materializado; veja-se como os protestantes,
    íamos dizendo, tiveram, em relação ao corpo de Jesus, a compreensão clara dos
    fatos, e lhe deram uma interpretação em harmonia com as Escrituras!


    Mas o esnobismo roustainguista quis ser original e, julgando dizer novidade, foi,
    ressurgir velha e desmoralizada teoria que o iluminado de Patmos denunciara com
    tanta clareza, precisão e sobriedade.


    Em artigo anterior transcrevemos as passagens de Kardec relativas aos agêneres,
    pelas quais se vê que o Codificador foi sistematicamente hostil à teoria do corpo
    fluídico de Jesus. Reptamos o Sr. Gomes Braga a exibir os escritos em que, diz
    s. s., Kardec apoiou a teoria de Roustaing, mas até agora eles não apareceram,
    pela razão muito simples e bastante clara de que Kardec não escreveu, nem como
    homem nem como Espirito.


    Quanto às numerosas comunicações a que se refere o Sr. Braga, são em geral desconhecidas.
    Sabem-se-lhes apenas as referências: teriam sido dadas a `Francisco Cândido Xavier`
    e às duas senhoras, médiuns oficiais da `F. E. B.`: `Zilda Gama` e `América Delgado`.


    Através de `Xavier` é conhecido o trecho de uma obra ditada pelo Espírito de `Humberto
    de Campos`. Pode ser legítima opinião desse Espírito, mas também pode ser uma
    adulteração, de vez que já ficou provado publicamente que, ao reeditar outra obra
    recebida através daquele médium, a `F. E. B.` alterou certa passagem, afeiçoando-a
    aos princípios roustainguistas. É fato do domínio público, como o é que a `F.
    E. B.` não teve defesa.


    Deste jeito, quaisquer outras mensagens de `Chico Xavier`, publicadas pela `F.
    E. B.` afirmando os princípios roustainguistas, são sempre suspeitas.. . E sem
    que isso diminua o médium.


    Aquelas duas senhoras eram médiuns da casa, do mesmo grupo, sujeitas às mesmas
    influências. O ensino dado pelos Espíritos a `Allan Kardec` nos diz da desvalia
    de tais comunicações – desde que não tenham o prestígio da concordância universal
    e quando se não acomodem à lógica, ao bom-senso, à moral e à documentação histórica;
    numa palavra: a unicidade de pontos de vista, em âmbito universal.


    ### E por quê?


    Porque o médium que trabalha isoladamente, ou num centro único, pode estar sob
    a ação de um mistificados, que varia suas vibrações para modificar a maneira de
    sentir do médium; deste jeito, apresenta-se com linguagem diversa e vários nomes,
    para que um disfarce confirme e prestigie o outro; pode ainda estar sob a ação
    de uma falange, que age de plano, em jogo combinado. O mesmo se dá nos centros
    com mais de um médium: podem estar todos sob o domínio de um só Espírito ou de
    uma falange, que age como no caso do médium isolado, aplicando ao conjunto aquelas
    mesmas formas de ação.


    E não é tudo. `Kardec` não teve tempo de entrar em maiores minúcias, que só mais
    tarde foram conhecidas.


    Tudo quanto ele disse sobre o caso, e que damos acima resumidamente, porque já
    o dissemos `in extenso` em artigo anterior, pode ser praticado por um Espírito
    encarnado – o do próprio médium. Em circunstâncias especiais pode o médium chegar
    a exteriorização parcial – e mesmo total – de seu Espírito, readquirir o domínio
    sobre conhecimentos latentes, que não revela em estado normal, ser tomado como
    uma entidade. Neste particular conhecemos atualmente dois casos típicos: uma senhora,
    muito honesta, cristã, caridosa, humilde, dedicada à doutrina; está convencida
    que recebe o Espírito de ilustrado clínico; faz diagnósticos mais menos certos,
    indica remédios com quais obtém curas ou melhoras acentuadas; dá passes com magnífico
    proveito para os beneficiários, seja por sugestão, seja pelo mesmo magnético de
    seus fluidos. O outro é um senhor, médium de incorporação; recebe espíritos de
    várias categorias; mas em certas condições exterioriza-se, seu Espírito volta
    ao passado, recupera e revela grandes conhecimentos e se exprime em magnífica
    forma de orador. Inconsciente do fato, não se inculca este ou aquele Espírito:
    o público é que se encarrega de atribuir um nome – que é sempre, de uma grande
    figura passada do Espiritismo.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    Nosso ponto de vista é que o `Sr. Roustaing` foi enganado. Sem a experiência necessária,
    seu entusiasmo, quiçá mesmo as falhas tão comuns na ordenação de conhecimentos
    das pessoas de muita ilustração; sua direção, no culto das letras jurídicas, naquele
    tempo, do que hoje, desinteressadas das ciências experimentais ou, ao menos, nos
    trabalhos práticos de laboratório que, principalmente eles, dão acuidade e intuição,
    de par com o indispensável alheiamente do fenômeno, a ponto de, no sentido de
    orientar pesquisas e formular hipóteses provisórias, que são prontamente abandonadas,
    desde que os primeiros resultados não se acomodem às grandes verdades e aos princípios
    firmados pelo geral consenso científico.


    Na verdade aquilo era um ovo de Colombo: não haveria mais mistérios, não haveria
    mais milagres; os dogmas cairiam, todos, ante esta simples explicação - um corpo
    fluídico!

    '
