    **II**


    ## **O PREFACIO DE ROUSTAING**


    Começa assim o prefácio: "Submeto ao exame e à meditação de meus


    irmãos. **Os Quatro Evangelhos** e, em seguida, Os Mandamentos explicados em espírito
    **e verdade".** A essa nobre intenção o autor acrescenta um relato da sua vida
    trabalhosa e dos seus estudos, de uma grave enfermidade porque passou e da qual,
    ao sair, foi informado por um clínico "da possibilidade de comunicações do mundo
    corpóreo com o mundo espiritual". Essa notícia, recebida com ceticismo, levou-o
    depois a pesquisar o assunto. Leu **O Livro dos Espíritos** e em seguida **O Livro
    dos Médiuns,** chegando à conclusão de que: "O mundo espiritual era bem o reflexo
    do mundo corporal".


    De posse desse dado consultou a História, compulsou os livros "de filosofia profana
    e religiosa, antiga e recente, os prosadores e os poetas, vendo que as verdades
    contidas naqueles livros se, confirmavam. Leu ainda o Velho e o Novo Testamento,
    que também lhe deram a mesma confirmação. Mas notou uma falta:


    "...tudo permaneceu obscuro, incompreensível e impenetrável... no tocante à revelação
    referente à origem e à natureza espirituais de Jesus, sobre a sua **posição**
    **espírita** em relação a Deus e ao nosso planeta, sobre os seus poderes e a sua
    autoridade". Também permaneciam inexplicáveis as palavras de Jesus: "Deixo a vida
    para 1 “Desconfiai, pois, dos falsos profetas, sobretudo numa época de renovação,
    qual a presente, porque muitos impostores se dirão enviados de Deus. Eles procuram
    satisfazer na Terra à sua vaidade; mas uma terrível justiça os espera, podeis
    estar certos. Espíritos da categoria em que eles dizem achar-se têm de ser não
    só muito bons, como também eminentemente racionais. Pois bem: passai-lhes os sistemas
    pelo crivo da razão e do bom senso e vede o que restará.


    Convinde, pois, comigo, em que, todas as vezes que um Espírito indica, como remédio
    aos males da Humanidade ou como meio de conseguir-se a sua transformação, coisas
    utópicas e impraticáveis, medidas pueris e ridículas; quando formula um sistema
    que as mais rudimentares noções da Ciência contradizem, não pode ser senão um
    Espírito ignorante e mentiroso. É incontestável que, submetendo ao crivo da razão
    e da lógica todos os dados e todas as comunicações dos Espíritos, fácil se torna
