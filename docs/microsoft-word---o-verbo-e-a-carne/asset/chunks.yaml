    que não tiveram oportunidade de conhecê-los? Se Deus é onisciente e onipresente
    então não possuímos livre-arbítrio, estamos encurralados em uma predestinação
    ou carma. Se não utiliza sua onisciência não pode ser Deus. Estas são perguntas
    simples que qualquer senso laico já se fez, ou ainda faz de sua existência. Foram
    estas e muitas outras perguntas muito mais elaboradas que o sistema carma veio
    “resolver” ou tentar explicar. *Explicar o mal e encontrar o meio de fazer que
    os homens o aceitem,* *se não com alegria pelo menos com paz de espírito, têm
    sido a tarefa da maior parte das religiões 34*. Para os ocidentais a palavra carma
    não deve ser levada ao pé da letra, mas de forma a entender que o indivíduo passa
    por situações difíceis e seu futuro é de sua responsabilidade. No Brasil poucas
    correntes filosóficas ou religiosas utilizam a palavra carma como os indianos,
    ou seja, *um fim em si mesmo*. Os esotéricos e os místicos, neste ponto não se
    enquadram os pensamentos esotéricos e místicos judeus, cristãos ou islâmicos,
    apesar de alguns filósofos destes pensamentos aceitarem ou discutirem a possibilidade
    da reencarnação. Os pensamentos cármicos estão mais próximos dos ensinos esotéricos
    e místicos por seguirem e utilizarem boa parte dos ensinos e da filosofia indiana,
    como é o caso do Shankya, do Vedanta do Yoga e alguns outros, ou similares como
    é o caso dos pensamentos de Blavatsky que possui grande influência no meio esotérico
    e Teosófico] .


