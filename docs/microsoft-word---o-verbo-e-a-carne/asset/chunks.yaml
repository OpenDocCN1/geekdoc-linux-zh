    Poderíamos encerrar aqui a nossa análise. Não há mais o que analisar. A revelação
    da revelação abortou nesse episódio lírico-burlesco, ainda nas primeiras páginas
    do primeiro tomo da obra roustainguista de duas mil páginas. Mas acontece que
    o roustainguismo é uma crença e os seus adeptos não aceitarão a nossa conclusão.


    Precisamos de paciência e coragem. Iremos além...


    Por sinal que além desse ato lírico-burlesca só nos resta, no trecho acima, constatar
    o decalque da teoria do perispírito que Roustaing absorveu na leitura de `O Livro
    dos Espíritos,` de Kardec. Lemos acima que o perispírito é um corpo fluídico tangível.
    A expressão `corpo fluídico` é de Kardec. Mas Kardec mostra que esse corpo fluídico
    pode tornar-se tangível no fenômeno das aparições tangíveis. Roustaing misturou
    as coisas e formou `aparentemente` essa nova expressão.


    Outro aspecto curioso de utilização das teorias kardecianas é o do trecho médio
    da transcrição acima, quando Roustaing (ou seja, os espíritos que ditaram a obra)
    dizem que Maria produziu uma irradiação simpática do seu perispírito para atrair
    os fluídos necessários. É essa a teoria explicativa das manifestações mediúnicas.
    O espírito comunicante produz irradrações do seu perispírito que afetam o perispírito
    do médium, provocando o fenômeno semelhante em forma de reação. A mistura dos
    fluidos espirituais do espírito com os fluidos materializados do médium produz
    o elemento necessário, semi-material, que permite a ação do espírito no plano
    material.


    Estamos praticamente diante de um ato de apropriação indébita. Não há nada de
    novo em tudo isso, a não ser o falso emprego da teoria.


    Mas vamos a outro trecho básico, relativo à gravidez de Maria. E juntemos a ele
    o trecho referente ao parto. Vejamô-los:


    "A gravidez de Maria foi obra do Espírito Santo, porque foi obra dos Espíritos
    do Senhor, e como tal aparente e fluídica, de maneira a produzir ilusão, a fazer
    crer numa gravidez real".


    "Os espíritos prepotos à preparação do aparecimento do Messias na Terra reuniram
    em torno de Maria fluidos apropriados que lhe operaram a distensão do abdômen
    e o entumeceram. Ainda pela ação dos fluídos empregados o mênstruo parou durante
    o tempo preciso de uma gestação, contribuindo esse fato para a aparência da gravidez,
    pela intumescência e pelos incômodos causados.


    Maria, sob a inspiração do seu guia e diante desses resultados, que para ela eram
    o cumprimento da anunciação que lhe fizera o anjo ou espírito enviado, acreditou
    na realidade do seu estado".


    "Seu parto foi igualmente obra do Espírito Santo, porque também foi obra dos Espíritos
    do Senhor, e só se deu na aparência, tal como a gravidez, por isso mesmo que resultava
    desta, que fora simplesmente aparente. Tanto quanto da gravidez, Maria teve a
    ilusão do parto, na medida do que era necessário, a fim de que acreditasse, como
    devia acontecer, num nascimento real".


    A intenção do ridículo se torna clara. O episódio lírico-burlesco perde todo o
    lirismo. A análise emperra diante do absurdo, pois o absurdo não pode ser analisado.
    Temos de saltar por cima do abismo e encarar o texto por outro ângulo.


    Os espíritos reveladores empregam neste momento os ingredientes da magia para
    fascinar o leitor. Estamos no plano do irracional. Mas nos enganemos. Por trás
    dos bastidores estão estirados e ativos os fios da magia teatral. O embuste é
    evidente. Não se trata da magia natural, mas da artificial. Numa palavra: do ilusionismo
    intencionado. Não é acaso que o texto inclui a expressão: "de maneira a produzir
    ilusão". Os ilusionistas, seguros do efeito do seu truque, sentem-se à vontade
    para empregar as palavras certas.


    Todos carregamos conosco os resíduos do animismo tribal, da magia primitiva que
    antecedeu a religião. Excita em nós esses resíduos que sobem do inconsciente ao
    consciente e determinam a regressão psicológica. Voltamos à tribo, ao tabu, ao
    animismo dos primórdios. Isso pode acontecer com o homem rude e simples ou com
    o homem ilustrado e ingênuo. E essa regressão pode explicar a aceitação das teorias
    roustainguistas acima por criaturas que ostentam o verniz da civilização. A fé
    ingênua da selva desperta no coração do homem atual e leva a aceitar, emocionado,
    os dogmas do absurdo.


    Apesar dessa explicação podemos perguntar como admitir a utilização desses truques
    ou passes de magia por Espíritos Superiores. Como aceitar o papel de Jesus, sob
    a permissão, pelo menos, de Deus, nesse processo de trapaça espiritual em nome
    da verdade? Se Descartes não houvesse aniquilado o Gênio Maligno nas suas reflexões
    `Discurso do Método` ainda poderíamos recorrer a ele. Mas nesta altura dos tempos
    já nos sobra essa possibilidade.


    ### Infância de Jesus


    "Quando Maria, sendo Jesus na aparência, lhe dava o seio, o leite era desviado
    pelos espíritos que o cercavam, de um modo bem simples: em vez de ser pelo menino,
    que dele precisava, era restituído à massa por uma ação fluídica que se exercia
    sobre Maria, inconsciente dela".


    "Eis o que fez Jesus nos três dias que esteve em Jerusalém. Ao abrir-se o templo
    entrava com a multidão e com a multidão saía quando o templo se fechava. Uma vez
    fora e longe dos olhares humanos, desaparecia, despojando-se do seu invólucro
    fluídico tangível das vestes que o cobriam, as quais, confiadas à guarda dos espíritos
    prepostos a esse efeito eram transportadas para longe das vistas e do alcance
    dos homens. Voltava para as regiões superiores onde pairava e paira ainda, nas
    alturas dos esplendores celestes, como espírito protetor e governador da Terra.
    Ao reabrir-se o templo reaparecia entre os homens, retomando o perispírito tangível
    e as vestes que o faziam passar por um homem aos olhos dos humanos".


    A infância mágica de Jesus, contada na obra de Roustaing, faz lembrar certos Evangelhos
    apócrifos que descreveram a vida do menino através de incríveis peripécias. Nos
    trechos acima vemos a descrição anedótica da amamentação aparente de Jesus. Maria,
    mais uma vez, continuava ilida. O menino fingia mamar. A transformação do sangue
    em leite é um ato de magia, digno de figurar nas histórias para adolescentes.


    A permanência de Jesus em Jerusalém, nos três dias em que esteve perdido para
    os pais, caberia num enredo de aventuras infantis. Os "ministros de Deus" que
    deram a nova revelação criaram uma nova categoria angélica: a dos anjos guardroupas.
    Seria difícil imaginar-se maneira mais adequada de ridicularizar o Espiritismo
    aos olhos das pessoas de bom senso. A aceitação de uma obra como esta pelos espíritas
    e a sua divulgação só pode explicar-se pela falta de discernimento.


    Roustaing é o anti-Kardec. Se Kardec é o bom senso, Roustaing é a falta de senso.
    A esta altura do exame dos textos já não se pode permanecer em atitude neutra
    diante dos absurdos que surgem a cada passo. Estamos em pleno mar da imaginação,
    flutuando ao sabor das ondas. Mas há uma intenção evidente – a de lançar o ridículo
    sobre o Espiritismo.

