    que é bem fácil de explorar".


    Mas vamos ao texto completo que "O Reformador" publicou numa


    página inteira, para que o leitor veja o que se pode chamar um pasticho do Além,
    feito pelos espíritos mistificadores, pois é evidente que a médium América Delgado
    jamais ''cometeria esse crime:


    • **CORPO DE JESUS**


    ## **Guerra Junqueiro**


    De fluidos é formado?... É feito de matéria?...


    Matéria sublimada, ou simplesmente argila? ...


    Um corpo como os mais, sujeito a vil miséria?


    Fluido que nenhum mal polui ou aniquila?...


    Há tanta confusão, oh! meu Jesus amado,


    em torno deste assunto... E diz o mundo inteiro:


    – "Seu corpo, como os mais, também era formado


    do barro de que é feito o humano formigueiro."


    Alguns, já procurando investigar, vaidosos,


    prometem do Saber nas altas ascensões,


    por uma vez rasgar os véus tão misteriosos


    do bisturi das autoconsiderações.. .


    Por isso (é bom dizer), já tem havido atritos


    entre os irmãos que buscam verdadeira luz


    e querem esvoaçar além dos infinitos


    para saber de que era o corpo de Jesus!


    Alguns doutores que a Ciência já perscrutam,


    que julgam separar o joio do bom grão,


    escravos do envoltório, invictos exultam


    e dão nesta resposta a sua conclusão:


    – "Se o Cristo não possuiu um corpo perecível,


    onde o merecimento ao seu martírio insano?


    Na leve fluidez a alma é insensível


    ao sofrimento que depura o ser humano."


    Doutores, um momento: a vossa crença é pura? !


    Abandonais a letra e procurais a Luz?...


    Pois escutai do Além a voz firme e segura;


    fitemos o clarão do astro a, olhos nus:


    – Onde se encerra a vida, na Alma? no Envoltório?


    Quem vibra, quem palpita – o Corpo ou o Clarão?


    Se formos procurar nalgum laboratório,


    dos problemas de Deus a vera solução,


    havemos de encontrar a esterilidade


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    38


    da pobre sapiência, inerme e sem valor,


    do acume da qual a triste Humanidade


    às vezes nem contempla aos astros o fulgor.


    O martírio real é o que retalha a Alma,


    a ponta de um aleive, o fel da ingratidão!


    Aquele que suporta, sem revolta, em calma,


    o espicaçar da crua dilaceração


    é um herói. As feridas que lá, intimamente'
