  trans: '

    Os leitores interessados no assunto não precisam perder muito tempo com a consulta
    aos quatro volumes da obra indigesta. É difícil agüentar essa leitura maçuda.
    Basta examinarem a teoria roustainguista da reencarnação no primeiro volume de
    "Os Quatro Evangelhos". É no exame dos capítulos de Mateus e Lucas sobre a genealogia
    de Jesus (vejam só!) que aparece, em meio do volume, páginas 300 e pouco da edição
    de 1942, a pergunta n.° 58 sobre as `substâncias` `humanas.` O livro foi tão mal
    feito que Guillon Ribeiro teve de reorganizá-lo para a edição brasileira. E assim
    mesmo não é fácil indicar os os tópicos a serem examinados, em virtude da balbúrdia
    do texto. Experimente o lector fazer uma citation dessas.


    A referida pergunta 58 basta para nos mostrar o estado mental do pobre Roustaing,
    que depois de uma doença grave, ao sair do hospital, foi logo envolvido pela falange
    mistificadora. Vamos dar na íntegra a pergunta: `22 Denis, L. O problema do Ser
    do Destino e da Dor, cap. IX.`


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    23


    "Disseram que os espíritos destinados a serem humanizados, por terem errado de
    forma muito grave, são lançados em terras primitivas, ainda virgens do aparecimento
    do homem, do reino humano, mas preparados e prontos para essas encarnações, e
    que ali encarnam em substâncias humanas, às quais não se pode dar propriamente
    o nome de corpos, nas condições de macho e fêmea aptos para a procriação e a reprodução.
    Quais as condições dessas substâncias humanas?"


    Os espíritos reveladores disseram que a evolução espiritual se processa em duas
    linhas: a dos espíritos que no início se desviaram para o mal e portanto ficam
    sujeitos às encarnações, e a dos espíritos que nunca se afastaram do bem e por
    isso evoluem através de mundos etéreos. Mas mesmo esses espíritos bons estão sujeitos
    a cometer um destes três pecados: o ciúme, a inveja e o ateísmo. Assim, quando
    um desses espíritos bons comete um desses pecados é obrigado a encarnar em `substâncias
    humanas.`


    Vejamos os trechos principais da resposta dos espíritos reveladores ao pobre Roustaing
    sobre as `substâncias humanas:`


    "São corpos rudimentares. O homem aporta a essas terras no estado de esboço, como
    tudo o que se forma nas terras primitivas. O macho e a fêmea não são nem desenvolvidos,
    nem fortes, nem inteligentes. – Mal se arrastando em seus seus invólucros, vivem,
    como os animais, do que encontram no solo e lhes conveniente. As árvores e o terreno
    produzem abundantemente para a nutrição de cada espécie. Os animais carnívoros
    não os caçam. A providência do Senhor vela pela conservação de todos. Seus únicos
    instintos são os da alimentação e os da reprodução".


    Notemos a absoluta incapacidade de Roustaing para compreender o que havia leído
    em Kardec sobre o desenvolvimento do princípio inteligente a partir dos reinos
    inferiores da Criação. Os espíritos reveladores, sempre trapaceiros, aproveitam-se
    do precário estado mental e psíquico do advogado convalesccente para elaborar
    a mais ridícula teoria da reencarnação. E terminam essas explicações verdadeiras
    com esta afirmação: "As gerações sucedem desenvolvendo-se. As formas se vão alongando
    e tornando- aptas a prover às necessidades que se multiplicam. Mas não é nossa
    tarefa traçar aqui a história da criação. O espírito vai habitar corpos formados
    de substâncias contidas nas matérias constitutivas do planeta. Esses corpos não
    são aparelhados como os nossos, porém os elementos que os compõem se acham dispostos
    por maneira que o espírito possa usar e aperfeiçoar."


