    abusivo: dir-se-ia que são clichês. Em compensação as traduções contêm inúmeros
    lapsos, que denotam pouca segurança da língua original. Assim, por exemplo, expressões
    como estas: `"Deus não tem pontos de trevas"`, quando no original o `point` não
    é ponto mas segunda negação; quando pergunta se o Templo pode usar o dinheiro
    da prostituição, que a lei condena, e quando se diz que, na impossibilidade de
    recusa, seja tal dinheiro empregado na construção de sentinas, o tradutor verteu
    "guarde-robe" por guardaroupa, o que é terrível ironia, mas altera o pensamento
    fundamental.


    De cincadas que tais está cheia a obra traduzida pela `F. E. B.`. O pior é que
    em muitos casos dá-nos períodos absurdos ou sem sentido.


    Por tudo isto não é possível aceitar a inclusão de Francisco Cândido Xavier entre
    os médiuns que receberam mensagens pró-Roustaing. Além disso, os Espíritos que
    lhe têm ditado obras sabem quanto é delicado o problema e esperavam que o escândalo
    viesse a rebentar mais dia menos dia. Dando mostras de sua longanimidade, ladearam
    o assunto, deixando que os homens o resolvessem.


    Entretanto, cada vez mais a `F. E. B.` se afunda no erro imperdoável de torcer
    o pensamento de `Kardec` e até textos da Bíblia, não só para defender um ponto
    suspeitíssimo de doutrina, más, já agora, para defender posições que foram tomadas
    de assalto.


    Estamos convictos de que os diretores da ex-Casa de Ismael não conseguiriam, perante
    ampla comissão de elementos anti-roustainguistas e de neutros, com a presença
    de médiuns videntes de confiança, que Emmanuel, André Luís ou Humberto de Campos
    respondessem a um questionário apertado sobre a divergência `Kardec-Roustaing`.


    Quanto aos outros dois médiuns, senhoras dignas de todo respeito, é preciso que,
    como médiuns, sejam consideradas independentemente de sexo, porque a mediunidade
    é dom do Espírito.


    Terminantemente suas mensagens não podem ser aceitas ou, pelo menos, não podem
    ainda ser aceitas.


