    "Vós sois uma alma nobre e conheceis culturas

    A ponto de pairar acima dos juristas;

    Prometo que amanhã com as Novas Escrituras!

    Nesta casa hão de estar os quatro Evangelistas!

    Não procureis jamais uma outra sensitiva.

    Madame Collignon reflete a nossa luz;

    No Céu foi preparada, é humilde e ativa,

    Capaz de receber até mesmo Jesus!

    Trabalhai, trabalhai, que os tempos são chegados!

    Que este grupo obedeça ao preposto Roustaing.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________

    42


    E defendei o `Novo Evangelho`, soldados!

    E se preciso for até mesmo com sangue!"


    Já percebebe o leitor a mistificação

    Que Roustaing não viu pela sua vaidade.

    Preposto de Moisés! Que condecoração! ...

    E gargalhava o Umbral daquela ingenuidade.

    E em volta de Roustaing as almas ateístas

    Que andavam a escrever as "Novas Escrituras":

    Um papa e cardeais – ao todo dez sofistas,

    Com aplausos febris de esquálidas figuras!


    No entanto quando vinha o sol pela manhã

    Espiar de mansinho este pobre arlequim,

    Inda estava ele a ler sentado em um divã

    As mensagens do Além sem notar o estopim...

    Brutal fascinação que não acabou cedo!

    Emagreceu Roustaing; a clientela, adeus!

    Que importa! Tinha em mãos do Evangelho o segredo,

    E o mundo o chamaria "um profeta de Deus”!

    E a fraudulenta obra em grossos, vários tomos,

    Enfim mostrou Jesus e arrepiou Paris:

    Nela o Cristo era igual a um desses gordos momos

    Que ao povo fazem rir ao pé de um chafariz!


    Cristo de picadeiro! Um Cristo teatral!

    Vivera, sim, na Terra, e não veio em carne e osso:

    Seu corpo era etéreo, ensina o denso Umbral,

    Por isso, diz Roustaing, arriscava o pescoço...

    Era a revelação do crístico segredo

    Que Jesus, o malandro, ocultara aos patrícios;

    Para ele a coroa era mero brinquedo!

    Para ele era a cruz um dos bons exercícios!

    Esse alegre fantasma, esse artista do Espaço

    Representou na Terra a mais infame farsa;

    No entanto (o livro diz) se não houve fracasso,

    É que se deve muito a Maria, a comparsa.

    A sua atuação superava a Bernhardt.

    Sabia ser suave e tinha o olhar profundo...

    Ao ver Cristo na cruz até faltou-lhe o ar!

    Comoveu a platéia e fez chorar o mundo!

    E esse livro indigno – excremento do Umbral,

    Encontrou no Brasil ferozes defensores!

    Eu explico a razão; dessa obra, afinal,

    Eles foram no Além os vis expedidores! ...

    Ó almas, escutai! Esquecei o passado!

    Libertai-vos do jugo e contemplai a Luz,

    E humildes implorai perdão ao Pai Amado,

    O perdão a Maria e o perdão a Jesus!

    (São Paulo - 1972)


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________

    43


    **JÚLIO ABREU FILHO**


    **ERROS DOUTRINÁRIO**

    **(O Sentindo do Roustainguismo)**


    **Ao**


    ## DR. MANOEL PAULA CERDEIRA


    **em agradecimento por seu conselho e**


    ## por seu exemplo.


    Convertei-vos a mim, filhos apóstatas, diz o Senhor; ... E

    vos darei pastores segundo o meu coração, os quais

    apascentarão com a ciência e a doutrina.

    **(JEREMIAS, 3:14 e 15).**


    Porque não fizemos saber a virtude e a vinda de nosso

    Senhor Jesus, seguindo fábulas artificialmente

    compostas; nenhuma profecia foi produzida por vontade de homem

    algum, mas os homens santos de Deus falaram inspirados

    pelo Espir Santo.

    **(2 PEDRO, 1:16, 20 e 21).**


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________

    44


    **ADVERTÊNCIA**


    Pareceu-nos que os artigos publicados em

    "Aurora", no correr do ano passado, deveriam escapar ao

    destino que, em geral, tem aquilo que se escreve em

    periódicos e jornais – a vida efêmera.

    E por quê?

    Apenas por isto: o esclarecimento levado aos

    Espíritas de fala portuguesa, apresentando o verdadeiro

    sentido do roustainguismo, levá-losia à recusa da

    falsificação; e essa cessaria, quando mais não fosse, pela

    ## falta de clientes.


    A recusa de obras adulteradas ou conducentes a uma

    deformação doutrinária seria uma campanha de não

    cooperação no erro, uma resistência passiva, uma greve

    serena, de braços cruzados.

    Reunindo aqueles artigos em volume, visamos

    apenas a oferecer aos nossos confrades um conhecimento

    exato do problema, porque os Espíritas devem ter

    consciência de seus atos e, assim, não podem cooperar nadeformação dos Evangelhos.


    (*) **NOTA** – As anotações feitas no texto em pé de página, quando de autoria
    de Júlio Abreu Filho, constaram de (J.A.F) – As anotações dadas em pé de página
    de José Herculano Pires constaram de (H.P.).


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________

    45


    ## I. Erros Doutrinários


    A editora da Federação Espírita Brasileira acaba de lançar mais um livro de defesa
    do roustainguismo, de autoria do Sr. Ismael Gomes Braga, intitulado `Elos Doutrinários`
    e constituído, ao que nos parece, de uma série de `erros doutrinários`.

    Tem o autor magníficas qualidades, posto abuse de conhecimentos...


    '
- fmt: '

    por que não seguir, mesmo, as versões em língua portuguesa? A de `João Ferreira
    de Almeida` tem a preferência das várias denominações protestantes; a de `Antônio
    Pereira de Figueiredo`, usada por protestantes e católicos, tem como única diferença
    que os primeiros excluem sete livros, considerados não canônicos.


    # O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________46


    Mas não. O Sr. `Gomes Braga` se faz de muito moderno, despreza os arcaísmos e
    volta suas preferências para duas versões brasileiras recentíssimas: a de `Humberto
    Rohden` e a de `Frei João José Pereira de Castro`, `O. F. M.` e... (notável!)
    para a Bíblia em esperanto!


    Será possível que s. s. ignore que os padres católicos andam "preparando" bíblias,
    alterando profundamente os textos, trocando palavras e até idéias e conceitos,
    ilaqueando a boa fé dos crentes e criando "bases" para o apoio dos dogmas da Santa
    Madre Igreja, principalmente o da Santíssima Trindade e o da Concepção Imaculada?


    Ainda não tivemos oportunidade de examinar a citada versão de `Frei João`. Quanto
    a do Sr. `Humberto Rohden`, um dos padres mais cultos que temos conhecido, trata-se
    apenas do Novo Testamento notavelmente alterado. Nós a possuímos.


    Quem está familiarizado com estes assuntos sabe que atualmente há duas correntes,
    duas tendências muito marcadas na Igreja Católica. Disso deram exemplo, nos últimos
    tempos, entre outras ordens regulares, os dominicanos. Quem não conhece as conferências
    do `Pe. Ducatillon` em `Buenos Aires`, no Rio e em São Paulo?


    `Rohden` era outro exemplo. Seus livros indicam não só que aspirava, como pressentia
    e se preparava para uma transformação que arejasse e saneasse a fé católica. Mas
    seu espírito era demasiadamente grande para caber nas estreitezas dos dogmas.
    Afastou-se da Igreja sem a hostilizar, até porque sabe o perigo que corre um ex-padre
    de sua cultura e de sua estirpe.


    Para se fazer uma idéia da sem-cerimônia a que chegaram os padres católicos, vai
    aqui um exemplo, entre muitos que poderemos aduzir.


    O `Pe. Matos Soares`, português, "preparou" uma versão da Bíblia, publicada em
    quatro volumes, em 1946, no Porto, pela `Tipografia Porto Médico, Ltda.`


    Também a temos em nossa coleção. Traz uma carta laudatória do então Secretário
    de Estado do Vaticano, `Cardeal Pacelli`, hoje Sua Santidade o Papa `Pio XII`.
    Pois no Evangelho de `João (8:25)`, que diz, segundo a versão de `Almeida`: Disseram-lhe
    pois: Quem és tu? Jesus lhes disse:


    Isso mesmo que já desde o princípio vos disse", a redação do `Pe. Matos Soares`
    é: (Eu sou Deus), o princípio de todas as coisas, eu que vos falo''.


    Via de regra fazemos as citações com estrita fidelidade gráfica aos textos. Assim,
    normandos, parêntesis e outros sinais acham-se nos textos citados.


    Há uma passagem em `João`, na qual `Jesus Cristo` fala de si mesmo na primeira
    pessoa e se diz homem. Pois as recentes Bíblias católicas estão "preparadas" de
    tal jeito que o vocábulo "homem" foi eliminado. Considerado isoladamente, o sentido
    será o mesmo. Mas como chega a servir a certos objetivos!


    É claro que os exemplos servem ao dogma da Santíssima Trindade. E os roustainguistas
    navegam nessas águas suspeitas porque a adulteração lhes convém, em apoio à teoria
    do corpo fluídico de `Jesus`.


    Então o caso da Bíblia em esperanto é, como se costuma dizer agora, de amargar.
    Que valor probante pode ter uma Bíblia traduzida numa língua artificial?


    O Sr. `Gomes Braga` deve saber que há muita gente que, mesmo sem ser espírita,
    conhece bem a Bíblia e acompanha o que dizem e escrevem os espíritas, roustainguistas
    ou não. O grande livro está muito estudado e é pena que seja muito mal conhecido
    dos espíritas. Sabem-se-lhe o número de capítulos, de versículos e de palavras;
    conhecem-se a sua geografia, a sua história, a sua filologia. Sabe-se como chegou
    até aos nossos dias, através de tremendas vicissitudes, de lutas, de perseguições,
    de crimes, de abnegação, e de heroísmos. Está hoje traduzido em mais de um milhar
    de línguas e dialetos, no todo ou em parte. Tudo isto custou trabalhos penosos
    e sacrifícios inenarráveis. Haverá, assim de pronto, no mundo esperantista, alguém
    que reúne cultura, bondade, experiência, argúcia, intuição, isenção de ânimo e
    assistência espiritual suficientes para lhe conferir autoridade para fazer uma
    versão verdadeiramente digna da Bíblia?


    Nossa dúvida apoia-se, principalmente, no emprego abusivo que os roustainguistas
    andam fazendo do esperanto, como veremos com mais vagar. Para os legítimos estudiosos
    do grande livro, sua Versão em esperanto é demasiadamente artificial e sem vida,
    porque a língua de `Zamenhoff` não tem espírito nem amarras no tempo e no espaço.


    O terceiro abuso do autor é o desprezo pela lógica, por aquilo que seus leitores
    em geral, e seus opositores em particular, podem aprender e, principalmente, podem
    ter aprendido. Lembre-se s. s. que todo escritor precisa levar em conta o nível
    mental do público; que no seu caso particular de escritor espírita e dá sua responsabilidade
    social, além de se comprometer como homem comum, está se comprometendo como espírita
    e comprometendo a própria doutrina a que pretende servir.


    Tudo isso talvez seja fruto do empolgamento de s. s. pela doutrina de `Roustaing`.
    O certo é que lhe falta lógica e s. s. conta muito com a amnésia dos leitores.


    Mas vamos ao livro.


    Em cento e seis páginas do texto o Sr. `Gomes Braga` pretende provar muitas coisas,
    algumas das quais são:


    I - que a missão de `Kardec` foi notavelmente auxiliada pelo Sr. `Roustaing`,
    "encarregado de organizar o trabalho da fé, dando confirmação às Revelações anteriores";


    II - que a obra exclusiva da `Sra. Collignon` tem hoje caráter de universalidade,
    porque os espíritos a confirmaram através de três médiuns: `Zilda Gama`, `América
    Delgado` e `Francisco Cândido Xavier`;


    III - que `Allan Kardec` não combateou a teoria do corpo fluídico de `Jesus`:
    apenas a pôs de quarantena; posteriormente, como espírito, a apoia; IV - `Jesus
    Cristo` não era homem, mas simples agênere;


    V - que a obra de `Kardec` era destinada aos crentes e a de `Roustaing` às pessoas
    de cultura;


    VI - que "as três Revelações - Velho Testamento, Novo Testamento e Espiritismo
    - formam um todo inseparável, um conjunto único em sua essência e não se pode
    atacar uma parte sem abalar todo o edifício"; a obra de `Roustaing` é uma parte
    desse conjunto;


    VII - que "se não fosse confirmada a natureza excepcional do corpo de `Jesus`
    pelo Espiritismo, as duas Revelações anteriores teriam que cair e o Espiritismo
    não subsistiria";


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________48


    VIII - que "está sobejamente confirmada a natureza excepcional do corpo de Jesus,
    em numerosas comunicações, e com isso consolidada a obra de `Kardec`, e confirmados
    o Cristianismo e o Judaísmo";


    IX - que "negar fé à obra de `Roustaing` é minar o edifício todo, desde Moisés
    até os nossos dias";


    X - que "quem nega que Jesus tenha sido um agênere nega também a codificação kardeciana,
    não é espírita".


    Eis o que há de mais importante, Então vamos às falas.


    Aceitamos – e conosco os kardecistas, isto é, os Espíritas cristãos – como ponto
    de partida, as duas Revelações contidas na Bíblia. Apenas não aceitamos qualquer
    "Bíblia preparada".'
