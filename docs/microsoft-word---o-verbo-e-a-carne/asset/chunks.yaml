    • **A PIEDADE DO POETA**


    As razões que demos acima, para explicar o silêncio do poeta, devemos acrescentar
    agora a sua piedade. Porque ele nô-la revela no soneto explicativo que transmitiu
    a Rizzini, diante da exumação desse trecho pela revista da FEB.


    Denunciar o pasticho seria expor a médium à crítica irreverente e feri-Ia moralmente.
    Guerra Junqueiro silenciou. Mas agora, que ela já não se encontra mais em foco,
    o esclarecimento se torna possível. Veja-se a forma piedosa pela qual o poeta
    explica o velho caso, na precisão silogística de um soneto alexandrino, acabando
    por um pedido de perdão ao leitor:


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    40


    • **FUNERAIS DA SANTA SÉ**


    **(Uma explicação)**


    Espírito, GUERRA JUNQUEIRO


    Médium, JORGE RIZZINI


    Há tempos me invocou no norte do Brasil


    Um médium escrevente a Deus tão devotado,


    Que sua aura possuía a bela cor do anil


    E tudo em torno dele explendia azulado.


    Quem era esse prodígio? Uma alma varonil


    Em corpo feminino, a América Delgado,


    Médium com quem eu fiz de janeiro a abril


    Um livro endereçado ao papa e ao bispado.


    Essa obra, porém, traiu o figurino;


    Mostra-me às vezes mudo e o verso alexandrino


    Não contém elisão ou traz quebrado o pé...


    O filtro era imperfeito. E até meu pensamento


    Sofreu deformações ou carregou-o o vento...


    Perdoa-me, leitor, "Os Funerais da Sé"!


    • **REBATE PIEDOSO**


    Dada a explicação de maneira clara, sintética, serena, o poeta rebate a manobra
    das trevas com a veemência que o caracteriza, más ainda de forma piedosa. Não
    acusa Roustaing, limitando-se a denunciar a sua fraqueza.


    Reconhece nele uma vítima das trevas. Mas ao referir-se à obra volta à sua antiga
    rudeza e a fulmina sem; piedade. Castiga o erro, mas não o pecador, que já pagou
    demais pelo seu orgulho. Pobre Roustaing, "pobre arlequim" vitimado pelas próprias
    ilusões!


    O poema recebido por Rizzini é coerente na forma e no conteúdo.


    Quem estiver habituado à leitura de Guerra Junqueiro sentirá nesse poema o estilo
    e o pensamento do poeta. E sentirá principalmente a sua coerência. Não há contradições
    nesses versos. O que se percebe é um cuidado especial para não exagerar nos tropos,
    para manter o equilíbrio poético e atingir o objetivo do esclarecimento.


    Os versos da quadra final são um apelo comovente aos que aceitaram a manobra das
    trevas para que voltem ao bom senso e peçam perdão a Deus, a Jesus e à sua divina
    Mãe pelo mau conceito que aceitaram e propagaram. Sente-se também, ao longo da
    poema, uma espécie de constrangimento do poeta, que preferia continuar em silêncio.
    O assunto não lhe agrada. Mas o seu amor à verdade o obriga a voltar aos homens
    e dizer-lhes que a verdade foi traída em seu nome, sem que ele pudesse esclarecer
    o caso, em virtude das criaturas boas que não desejava ofender.


    Vamos ao rebate piedoso que as trevas provocaram:


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    41


    • **"OS QUATRO EVANGELHOS"**


    poema de GUERRA JUNQUEIRO recebido


    pelo médium JORGE RIZZINI


    No século passado existia na França


    Um célebre jurista às Leis tanto leal,


    Que ao ver a mendigar na praça uma criança


    Mostrava-lhe, depressa, o Código Penal.


    Na Corte Imperial era ele temido;


    Temiam-no, até mesmo os grandes magistrados.


    E o mestre do Direito impôs o seu partido


    E, por fim, comandou a Ordem dos Advogados!


    Mais realista que o rei, Jean Baptiste Roustaing


    Pedia aos tribunais impiedade aos réus,


    A Lei de Talião para os crimes de sangue,


    E invocava Moisés e a Justiça dos Céus!


    Certo dia, porém, uma antiga cliente,


    Senhora piedosa afeita à Caridade,


    Deu-lhe de Allan Kardec o livro mais recente,


    Um livro que mostrava a Divina Verdade.


    Essa obra continha um celeste tufão


    Nas páginas de luz, em seus puros conceitos,


    E varreu de Roustaing o fel do coração!


    E varreu-lhe da mente os velhos preconceitos!


    E, nessa mesma noite o pálido doutor


    Leu-a mais uma vez em fundas reflexões,


    E dizia, baixinho: "– Esta obra é um primor! !


    Explica as Leis de Deus e explica as provações!"


    E o arguto jurista em sua residência


    Depressa organizou da fina sociedade


    Um grupo de fiéis, mas sem experiência,


    A fim de comprovar dos livros a verdade.


    A médium Collignon então à luz das velas


    Em transe revelou à vesga comitiva:


    "– A partir de hoje sois de Cristo as sentinelas.


    Quem vos fala é Moisés! Minha luz é ostensiva!


    "Por ordem de Jesus iremos restaurar


    O santo Evangelho, as verdades de Deus;


    Roustaing, filho meu, ireis colaborar


    Com Lucas e João, com Marcos e Mateus!'
