  trans: '

    从历史上看，鲁斯丹主义（Roustainguismo）存在的意义仅在于：一个康复者的不安，他被卡德克（Kardec）的作品所震撼，并试图超越它，通过他熟悉的几位同胞媒介的传讯，在高阶灵灵的帮助下阐明福音书中晦涩的点，而这些交流最终由唯一的媒介
    `Madame Collignon` 负责全文的灵媒工作。鲁斯丹本人通过唤起灵体来引发启示，这与卡德克不同，后者研究现象并在灵媒实验过程中被启示所震撼。


    卡德克的科学立场与鲁斯丹的平庸立场对立的。鲁斯丹是一个虚荣的人，他被欺骗性的灵体所误导，接受了最荒唐荒谬的解释来阐明经文问题。这位伟大的律师只不过是一个大天真之辈。


    ### XIII


    ### 巴西的鲁斯丹主义


    鲁斯丹主义渗透巴西的原因是什么？它是如何以及为何在所谓的“母国”扎根的？为什么我们现在面临着这种伪教义的复抬头？在我们看来，这似乎归结为一个宗教形成的问题，其背景是巴西的种族形成以及我们国家发展的中世纪时期。鲁斯丹主义在一个关键时刻到达巴西，当时我们的文化正受到多种欧洲渗透的冲击。其中，从法国传来的灵论（Espiritismo）在上世纪下半叶激发了一些受过教育的灵魂。鲁斯丹主义表现为整合在灵论之中，并紧密地触及了一些前天主教徒的神秘主义敏感性。


    当时的法国是文明的中心，巴黎是世界的大脑。鲁斯丹的作品在法国和灵论的声誉支持下传来。它还带有鲁斯丹的背书——这是一个在波尔尔多法律界受尊敬的名字，并由来自名门法学家家族的
    `Madame Collignon` 进行了灵媒接引。这一整套机制将 `Roustaing` 强加于我们的智力之上。然而不仅如此，这部作品为神秘主义灵性带来了巨大的慰藉，打破了卡德克作品的理性的冰冷，并恢复了基督的超自然地位。


    对于像贝泽拉·梅内泽斯（Bezerra Menezes）这样深信宗教的人来说，他是虔诚天主教徒的典范；还有`安东尼·路易斯·赛翁（Antônio Luiz
    Sayão）`、`比特库尔·桑帕奥（Bittencourt Sampaio）`等，他们的行为证明了宗教情感优于批判理性，鲁斯丹的作品作为救命稻出现，将他们从卡德克的理性中拯救出来。鲁斯丹是回归神奇，回归在精神和肉体上都是神秘且神性的基督。通过这种方式，鲁斯丹还给了这些生物自幼以来就包裹着他们的抒情宗教幻象。


    我们今天很难理解灵论在我们这里发展的宗教氛围。自然，存在理性主义的分歧，它由以下构成：


    道与肉体——对鲁斯丹主义的两次分析

