    legitima, e por Isso mesmo difícil, é vê-Ia na multiplicidade da sua grandeza,
    em que tanto encontramos a aspereza das rochas como a doçura das flores e a riqueza
    mineral.


    Nos poemas que ainda hoje nos envia do Além essa multiplicidade de aspectos continua
    presente. Podemos ver isso em "Parnaso de Além-Túmulo", de Francisco Cândido Xavier,
    como na "Antologia do Mais Além” de Jorge Rizzini. Mas encontramos em "Os Funerais
    da Santa Sé", de América Delgado, uma contradição violenta, ainda não analisada,
    que opõe o poeta positivo da vida terrena a um poeta utópico e até mesmo insensato
    da vida espiritual. O equilíbrio vigoroso do tufão se desfaz em rajadas desnorteantes
    de um vendaval rasteiro. A síntese da inspiração junqueirana se dissolve em imagens
    e apóstrofes vulgares de um misticismo de fundo místico, na condenação insensata
    das leis naturais. Guerra Junqueiro, o pensador, se deteriora numa insensatez
    mitológica de pura desagregação psíquica.


    Sua mente se degenera num processo de regressão, separando Jesus (a fé) de Prometeu
    (a razão) para restabelecer a dualidade por ele mesmo superada de natural e sobrenatural.


    • **CRENÇA E MEIO**


    Publicado em 1932, portanto há quarenta anos, o poema mediúnico "Os Funerais da
    Santa Sé” graças ao prefácio de Guillon Ribeiro, foi aceito pacificamente pelo
    meio espírita. Mas hoje, quando os roustainguistas pretendem arvorá-lo em


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    35


    bandeira de luta, no vale-tudo em que se empenham para a defesa do absurdo, a
    análise mais superficial nos revela a sua fragilidade. O próprio Guerra Junqueiro
    silenciou a respeito durante todos esses anos. Não havia clima para um estudo
    sereno do problema e não convinha levar mais lenha à fogueira: Mas para tudo há
    um limite. Agora, através da mediunidade de Jorge Rizzini, ele nos explica o enigma
    e ao mesmo tempo desfaz a lenda do retrocesso mental.


    Tudo se reduz a um drama de circunstâncias. América Delgado era um belo espírito,
    uma criatura sensível, mas infelizmente rendida às falanges roustainguistas, ou
    como diria Júlio Abreu Filho: à falange vaticanica. O


    **condicionamento à crença** no campo mediúnico foi percebido e denunciado por
    Richet, na Metapsíquica, e é hoje objeto de estudos e pesquisas na Parapsicologia.


    Mas bem antes já havia sido assinalado por Kardec no Espiritismo, como vemos,
    por exemplo, nas explicações do item 443 de **O Livro dos Espíritos.**


    Todos os que estudam Espiritismo sabem que a influência do meio,


    estudada em **O Livro dos Médiuns,** de Kardec, pode determinar e geralmente determina
    graves interferências na comunicação mediúnica. Crença e meio influem nos processos
    de recepção. América Delgado filiara-se á linha de pensamento roustainguista da
    FEB e estava naturalmente sujeita às influenciações nesse sentido.


    Não por sua culpa, mas, como nos explicou certa vez Frederico Figner, em comunicação
    que publicamos no jornal "Mundo Espírita" e deu muito pano para manga, por culpa
    da orientação errada da casa em que se iniciara no Espiritismo e na prática mediúnica.


    Seria possível aplicar o mesmo argumento aos que não aceitam a teoria roustainguista.
    Mas acontece que a orientação kardecista não se funda na crença e sim na razão
    e na pesquisa. O método de Kardec é científico e por isso mesmo exclui os perigos
    do condicionamento à crença e da sujeição ao ambiente. Mas os que fizeram de Kardec
    um mito ao invés de um pesquisador, um visionário ao invés de um homem de bom
    senso, e deram ao seu grupo ou instituição um clima de misticismo cego estarão
    sujeitos aos mesmos riscos dos ambientes roustainguistas.


    Não é esse o caso do médium Jorge Rizzini, que se atém ao bom senso de Kardec
    e procura conhecer as possibilidades e os limites da sua mediunidade.'
