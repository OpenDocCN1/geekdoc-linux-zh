    como representantes principais Dociteu e Saturnino, negavam a realidade carnal
    de Jesus e por isso, não aceitavam seu nascimento, paixão e ressurreição.


    Consideravam seu corpo como “Fantasma” (Fluídico) e os seus feitos, apenas aparente
    .


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    19


    doutrina é nova porque **explica** a encarnação fluídica do Messias. A verdade
    é que pouco importa essa mecânica imaginária.


    A palavra Docetismo vem do grego (doceta) que quer dizer: crença


    numa aparência. Vejamos a definição que lhe dá o **Dictionnaire Encyclopédique**
    **Quillet:** "Heresia do segundo século que consistia em pretender que o filho
    de Deus só tinha carne aparente, que só havia nascido, vivido e sofrido em aparência".
    O


    Roustainguismo, por acaso, diz outra coisa?


    Roustaing escuda-se num sofisma, afirmando: "O Espírito puro não pode aparecer
    em um mundo fluídico, imediatamente inferior às regiões dos fluídos puros que
    ele habita, senão por encarnação ou incorporação fluídica voluntária".


    A encarnação fluídica, é explicada com o exemplo das materializações de Katie
    King por Crookes, com uma diferença: a de que Jesus se serviu, sem que disso realmente
    necessitasse, da mediunidade de Maria. Assim, seu corpo aparente não era carnal
    como o nosso, mas de uma carne refinada. Só a **chamada lógica do** **absurdo,**
    que é uma espécie de antilógica, poderia tornar aceitável esse jogo de palavras.
    E com isso procura safar-se da acusação de docetismo que Kardec lhe fez acertadamente.


    O elemento fundamental desta doutrina incongruente é o preconceito sexual, a consideração
    das leis naturais da procriação como impuras. Teria Jesus esse preconceito? Ele,
    que se dizia filho do homem 18, que condenava e contrariava os preceitos desumanos
    da lei de pureza de Israel, teria exigido um privilégio para a sua encarnação
    entre os homens? Ele que se colocou em tudo ao nosso lado, chegando a afirmar
    que tudo o que fazia nós também podemos fazer – e até mais do que ele fazia –
    teria se recusado a aceitar um nascimento natural? E o Espiritismo, que considera
    as leis naturais como leis de Deus, poderia endossar o docetismo sem cair em contradição
    com os seus princípios fundamentais?


    São estes os problemas que escaparam à perspicácia do advogado de


    Bordeaux, à vaidosa ingenuidade de Roustaing e à simplória teologia dos seus adeptos
    atuais – porque a revelação da revelação se proclama, entre outras coisas, "a
    iniciadora da fase teológica"... Mais uma vez o advogado e seus seguidores, acompanhados
    pelos "ministros de Deus” se esquecem de que o **Livro** **dos Espíritos** começa
    pela definição de Deus. Essa definição iniciou, muito antes de Roustaing, os estudos
    teológicos no Espiritismo.


