    这项分析将支持我们对某些不受疑的版本的研究，这些版本具有国际声誉，或者至少在其语言范围内享有地位。它们是葡萄牙语版本的 `Almeida`（新教版）和 `Figueiredo`（天主教版），后者位于备受尊敬的《巴伊亚圣经》，该书包含了
    Delaunay 牧师为 `Saci` 法文版撰写的注释（即 `Kardec` 所使用的那一个版本，这些注释得到了巴黎大主教 Sibour 先生的批准）；第一版巴西译于
    1863 年由里约热内卢的书商 `B. L. Garnier` 制作，该书中附带了巴伊亚大主教兼巴西首任大主教 `Manoel` 的授权。我们将引用我们拥有的
    1881 年第 2 版。在法语方面，我们将引用 `Louis Segond` 的版本，该版本基于原始希伯来语和希腊语文本，并于 1910 年出版；我们的副本是
    1939 年在英国印刷的忠实复印本。在意大利语中，我们将根据 1946 年的英文再版引用 `Diodati` 版本的文本。在英语中，我们将引用 1913 年在美国印刷的《权威钦定本英文圣经信函版》。


    偶尔，如果 `Gomes Braga` 先生想要更好的来源，我将根据我们拥有的版本引用希腊文本，该版本由 `Brooke Foss Westcott D.
    D.` 和 `Fenton John Anthony Hort, D. D.` 编辑，由 `The Macmillan Company, U. S. A.`
    于 1947 年出版。


    此主题极其严肃，要求来源必须高于任何疑点。


    文章内容很长，不能局限于两或三篇文章。因此，必须以方法论呈现。然而，在进入对十个条目的分析之前，为了让这些文章的潜在读者充分理解我们对引用的圣经来源的严谨性并非单纯的表演，我们必须明确一点：


    a – 巴西灵性联邦（F.E.B.）的图书馆必须拥有精美的圣经副本，值得最高的尊重，尤其在本案例中，因为它们是在灵性环境之外的，早于 `Kardec-Roustaing`
    问题以及天主教篡改文本运动的出版；b – 因为长期以来，我们注意到巴西灵性联邦出版社出版的物中对圣经文本的引用极度漠视，这些引用通常是残缺的、歪的且引用错误；c
    – 因为在 `Roustaing` 作品的特殊案例中，巴西版本竟然毫无顾忌地更改了某些经文，正如我们将有机会看到的那样；借此，他们只能为一个他们大肆宣传的作品招来反感，或至少引起怀疑；


    d - 因为 `Allan Kardec` 作品的巴西语版本一直在被修改和删减，正如在《灵性福音：肉体福音》第 20 章和第 21 章中可以验证的那样，在拥有了来自老派成员的正确翻译后，`F.E.B.`
    的董事们没有进行修订，反而让 `Antônio Lima` 先生在 1931 年根据法文版的第 48 千册了一份翻译——那恰恰是被篡改和残缺的版本。自 1932
    年以来，这直一直是巴西版本的来源。


    由于这些原因以及其他将随时间出现的因素，Roustaing 主义问题引发了巨大的怀疑，必须非常谨慎地对待。


    我们并不刻意支持某个流派的圣洁性，他们并没有收到特定的任务或灵性使命，却以一种如此不基督教的方式接管了所谓的“以斯马埃尔之家”，正如一位老 de Roustaing
    主义者、他的同伴以及该机构的董事 `Leopoldo Cirne` 先生在《反基督，世界之主》中所述的那样，他同样来自 `F.E.B.`。这是因果律。


    在他的教义著作中，`Gomes Braga` 先生引用了 `Kardec` 的片段，据称是为了支持 `Roustaing` 的作品。我们要求作者展示那位编码者的忠实且完整的文章。费用由我们承担：只需让
    `F.E.B.` 展示原件即可，没人能夺走它们。


    与他的主张相反，我们想引用 `Roustaing` 的同代人及其崇拜者。他是 `J. Malgras` 先生，《法国灵性主义先驱》（Pionniers du
    Spiritisme en France, Librairie des Sciences Psychologiques - Paris, 1906）的作者。在写了几页对
    `Roustaing` 先生的赞美后，他在第 39 页写道：


    幸运的是 `Gomes Braga` 先生在第 24 页提到：`Kardec` 相信福音并将其视为“第二次启示”的圣书。紧接着写：`因此，由 Allan Kardec
    编码的灵性是基督教的，它是从摩西开始、经耶稣确认、并由灵体在著作中继续延续的启示。`在第 25 页他写：`三次启示构成了一个统一的整体，因为……`


