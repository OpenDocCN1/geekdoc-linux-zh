    75 cultas; por isso não tolera os congressos 69. Seus líderes intu sua fraqueza
    e não querem expor o flanco: quanto maior seu amor à doutrina, maior seu apego
    às posições.


    *****


    Como prova que a obra de `Roustaing` é realmente uma das mais grossas mistificações
    de que a sociedade já foi vítima, damos a seguir a mensagem obtida em um centro
    espírita no Rio de Janeiro, em 1921, do próprio Espírito de `Jean Baptiste Roustaing`
    70. Antes, porém, é-nos permitido prestar uma homenagem a um médium honesto: o
    saudoso `Porfírio Bezerra Filho`, fundador do `Centro Espírita Cristófilos`, no
    Rio 71.


    `Porfírio` ficou cego em um desastre. A dor o levou ao Espiritismo, onde desenvolveu
    preciosas faculdades mediúnicas: tinha clarividência, clariaudiência, incorporação
    total, psicografia semimecânica, inspiração ou incorporação sutil; via as aúras
    das criaturas, como via os órgãos internos e a cor do som. Aprendeu a doutrina
    depois de cego, ouvindo a filha pequena ler os livros fundamentais. Era um dirigente
    e doutrinador primoroso. Muito aprendemos com ele.


    Em 1924, pediu que comparássemos as obras originais de `Kardec` com as traduções
    em português: tínhamos em suspeita, `Bezerra de Menezes`, o máximo. Tivemos certeza
    e esperamos; `Porfírio` já passou para o outro plano, sem que atendêssemos ao
    pedido.


    Faz-lo agora. E a mensagem: CONFÃO DA MISTICAÇÃO por `J. B. ROUSTAING` Do livro
    `Páginas de Além`, 3ª edição. Rio de Janeiro - 1939. Médium: `Carlos Gomes dos
    Santos` "GUTTA CAVAT LAPIDEM" (`Confiteor`) Que as harmonias espirituais se façam
    em nossas almas são os meus ardentes desejos. "Irmãos, da mesma forma que a gota
    consegue furar a pedra, eu, animada do espírito, também hei-de conseguir, por
    mercê de Deus, arrasar a edificação, em muitos pontos falha, porém.


    69 Os Congressos Espíritas no Brasil foram sempre realizados à revelia da `F.
    E. B`. O movimento de unificação foi seriamente atacado pela `F. E. B.` e o pacto
    áureo só foi possível graças à humildade, tolerância e insistência dos espíritas
    paulistas, tendo à frente `Pedro de Camargo` (`Vinícius`), cujo prestígio venceu
    a `F. E. B`. Mas, para aceitar a unificação, ela exigiu a criação de um conselho
    nacional sob seu controle. Esse órgão, o `Conselho Federativo Nacional`, deformou
    o espírito da unificação e erigiu-se numa espécie de colégio cardício, emitindo
    bulas sobre questões doutrinárias (`H.P.).


    70 Mensagem enviada espontaneamente no Centro Família Espírita, Rua do Carmo,
    15, Rio de Janeiro e publicada num opúsculo de distribuição gratuita pelo diretor
    - fundador daquele Centro, cujo nome citamos com muito agrado e muita saudade
    - `Mariano Rango D''Aragona`, destacada figura de lutador espírita (`J.A.F.").


    71 Este Centro fica no Catete, à Rua `Pedro Américo`, 22 (`J.A.F.").


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    76 Sou, meus irmãos, uma pobre alma que seria contada no número das que já desfrutam
    a felicidade integral, se em mim, na minha consciência, não pairasse um cúmulo
    de desgostos.


    Quando entre vós, nas mesmas condições vossas, tendo sido despertado de minha
    cegueira moral pelos lampejos brilhantíssimos da Luz Divina a nós outorgada por
    intermédio do missionário a que todos veneramos, sob a designação de Allan Kardec,
    quis também seguirlhe as pisadas e para tal o fazer, depois de acurado estudo
    do que ele já havia conseguido dos Espíritos reveladores, pensei alguma coisa
    construir que, se não o ultrapasse, pelo menos muito concorresse para a conquista
    da glória, que tanto me agitava.


    Pensei – de mim para mim – porque somente a ele fora concedida a

    '
- fmt: '

    gloriosa tarefa de rasgar ao mundo o véu negro que esconde o brilho da luz diamantina
    que ilumina as almas? Porque não a outro, de boa vontade, também aspirante das
    recompensas porvindouras?


    "E nestas conjeturas caminhava eu... quando, por uma circunstância toda espiritual,
    fui induzido à execução do plano que em mim agasalhava. Então, comecei por realizar
    o meu intuito, sim o meu intuito, que não era precisamente meu; não vos admireis
    desta negativa, porque vos declaro à face da verdade, que eu nada mais era, naqueles
    instantes, que instrumento dos inimigos invisíveis da verdade, que das sombras
    misteriosas do Além se aproveitavam da minha irreflexão para toldar, como se fora
    isto possível, a brilhantura da água cristalina que emanava daquela fonte maravilhosa
    de que vos falei. Sim, não vos admireis –


    repito – que tenha servido de veiculados da confusão, eu que tanto ansiava pelo
    destaque entre os meus pares.


    "É infelizmente esta a triste verdade que confesso neste momento, como hei confessado
    já noutros pontos, onde me tem permitido Deus que eu faça o meu aparecimento.
    Mas, irmãos, quereis ver até onde vai a minha tortura? Pois bem: em quase todos
    os meios onde tenho feito esta sincera confissão, tenho sido repelido por aqueles
    que, na melhor das intenções, porém despercebidos, vão se envenenando na fonte
    impura dos ensinamentos que hei deixado.


    "Fui, meus irmãos, um joguete dos inimigos da Luz-verdade; pois foram eles os
    autores responsáveis de tudo quanto fiz, contrariando a doutrina lídima que vinha
    sendo ensinada por `Allan Kardec`.


    "Mas – direis – tenho bebido, através do vosso feito, a água pura da verdade.
    E responder-vos-ei: Não, irmãos, a água pura que bebeis, através do estudo de
    minha obra, não é minha, não foi obtida por mim. Esta é dele, porque eu e os que
    me induziam a semelhante atentado, quando não podíamos de todo contrariar, imitávamos,
    dando, todavia, ao, que imitávamos, uma aparência de novidade verdadeira 72.


    "Hoje, porém, que se me depara mais uma ocasião de falar aos homens, venho, olhos
    d''alma fitos do Pai Universal, dizer-vos que mal andei tentando obumbrar a Luz
    brilhantíssima que irradiava do farol divino que é `Allan Kardec`.


    "Irmãos, por caridade, ouvi-me:


    72 Esta declaração bastaria para autentificar a mensagem de `Roustaing`. Tudo
    quanto se encontra de bom e certo em sua obra é cópia e decalque de `Kardec`,
    como demonstramos emnossa análise incluída neste volume. Mas toda essa confissão,
    desde a linguagem até à substância, corresponde exatamente ao que a crítica pode
    apurar na obra de `Roustaing`. (H.P.).


    ## O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    77


    "A verdade está no que vos legou e não no que vos hei deixado.


    Lembrai-vos que há, como sempre houve, usurpadores dos alheios direitos, como
    das alheias glórias; e eu, confesso, fui um deles.


    "Assim, amigos, desta outra face da vida, em benefício vosso e também no meu próprio
    suplico-vos abandonardes, a fonte má que aí deixei e voltardes para aquela, onde
    emana a pureza que é a verdade, esta mesma Verdade que é a Luz.


    "Abri pressurosos os tesouros kardecianos e esquecei – peço-vos, o que aí ficou
    do pobre e muito pobre `Roustaing`.


    "Que Deus vos esclareça para poderdes caminhar, sem maiores tropeços, em busca
    da felicidade eterna. "Adeus!"


    *****


    Que o leitor faça uma pausa e medite. E se, porventura, lhe restarem dúvidas quanto
    a sua autenticidade, examine o seu conteúdo, abstração feita de sua autoria. Entretanto,
    para chamar a atenção para certos ângulos da magna questão para os Espíritas Brasileiros,
    vão aqui algumas opiniões de figuras destacadas do Espiritismo nacional e internacional.


    **"Jesus não precisava de nascer e viver só fluidicamente, porque Ele sabia, já,
    que a sua matéria nunca sofreria as fraquezas terrenas" (`Cairbar Schutel`).**


    **"Se a França, berço da Terceira Revelação, espalhou pelo mundo inteiro as obras
    imortais de `Allan Kardec`, sepultando a outra de `J. B. Roustaing`, não há motivo,
    no mundo novo, de ressuscitar a segunda. Nós, do Alto, atribuímos essa tentativa
    à ignorância ou à cegueira de poucos irmãos, muito longe da Luz do Mestre" (`Jean
    Meyer` 73).**


    **"Pelo fato de que há boas criaturas que acreditam na virgem Maria e no Cristo
    fluídico, não se deve deduzir que semelhante comunicações do astral sejam racionada.
    Não tendes na Terra quase 400 milhões de católicos que baixam a cabeça ao dogma?
    Tudo isso, pelo contrário, prova que o vosso planeta expiatório está ainda na
    infância, ao ponto de imaginar que `Allan Kardec` possa ser superado por `J. B.
    Roustaing` (`Gabriel Delanne`.**


    **"Se `Kardec` é no espaço um astro de infinito esplendor, que eu acompanho como
    satélite, ainda e sempre, onde resplende o autor da ''revelação das revelações''?
    Deviam, já, ter emudecido os Apologistas do segundo, ofuscado pela luz do primeiro"
    (`Flammarion`).**


    **"O pensamento terreno, circunscrito à célula em que vive, difere, muitas vezes,
    no espaço. Aqui, onde não há véus que limitam a vista, compreendem, finalmente,
    a personalidade do Cristo, Sol e Dominador das trevas, sem necessidade de ser
    discutido em várias maneiras pelos mortais. Duas frases são suficientes para defini-lo:
    ''O Verbo fez-se carne'' e ''Eu sou o filho do homem''. Nestas duas frases que
    abrangem maravilhosamente a trajetória de todas as criaturas está a grandiosa,
    de Jesus. Nessa verdadeira trajetória nunca ele se valerá de privilégios que desvalorizam
    a missão específica do Cristo, porque a grandeza do Missionário Celeste está na
    sua adaptação ao planeta a redimir, praticamente, como Evangelizador e Civilizador
    dos povos primitivos. Disse tudo quanto Deus me permitiu afirmar do espaço, nessa
    hora de inúmeras provas do vosso planeta" (`Bezerra de Menezes`).**


    Por fim, de uma carta do Prof. `Ernesto Bozzano`, datada de 18 de fevereiro de
    1939, dirigida a `Rango D''Aragona`:


    74 `Jean Meyer` foi uma notável figura do Espiritismo na França, um dos diretores
    da Sociedade fundada por `Kardec`; fundou o Instituto Metapsico Internacional,
    a União Espírita Francesa, a Sociedade de Estudos Metapsicos e a Casa dos Espíritas.
    Foi Vice-presidente do Congresso Espíita Internacional, reunido em Londres, de
    7 a 12 de setembro de 1928 (`J.A.F.`).


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    78


    "Voltando à figura do Cristo, que aí querem rebaixar às fantasias de um desconhecido
    como `J.B. Roustaing`, se você leu a minha mensagem ao Congresso Espiritualista
    de Barcelona, constatará novamente o meu pensamento.


    O maior profeta de Deus, ou o maior iniciado, como se queira chamá-lo, Ele ficará
    como luz e guia do nosso planeta.


    Acho que os espiritualistas brasileiros, como os ingleses, se preocupam mais em
    conciliar as instituições ''religiosas com as convicções espirituais'' o que é
    impossível. Entre as instruções ''dogmáticas'' – seja qual o seu credo – e a ''liberdade
    de pensamento'' de um autêntico espiritualista, não podem existir acordos.


    O dogmatismo nunca abjurará os seus direitos baseados sobre o princípio de autoridade;
    o que nunca sedará com o Espiritismo, baseado no princípio da revelação contínua.


    O caso de `J. B. Roustaing`, sob o título absoluto de ''A Revelação das Revelações'',
    é, portanto, um fato ''dogmático'', feliz e universalmente liquidado''.


    Parece que estes nomes dispensam carta de recomendação.


    Como se vê, a mensagem de `Roustaing` é a voz de a consciência

