    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    45


    ## **I**


    **Erros Doutrinários**


    A editora da Federação Espírita Brasileira acaba de lançar mais um livro de defesa
    do roustainguismo, de autoria do Sr. Ismael Gomes Braga, intitulado **Elos** **Doutrinários**
    e constituído, ao que nos parece, de uma série de **erros doutrinários.**


    Tem o autor magníficas qualidades de escritor, posto abuse do cientifismo e de
    certas expressões, como em relação à voz "agênere" e "palavra cunhada". A propósito
    convém lembrar que se há uma casa da moeda, onde só cunham legítimos valores,
    lugares existem onde a cunhagem é suspeita... Como quer que seja, talvez para
    contornar as naturais dificuldades de quem assume a tarefa ingrata de defender
    uma tese indefensável, como é o roustainguismo, s. s. comete alguns abusos, que
    reputamos falta de consideração para com o público, principalmente um público
    que, por força de sua orientação filosófica, se deve aplicar na busca da Verdade.


    O primeiro abuso é a exibição de conhecimentos de Biologia, que


    nenhuma ligação têm com o tema em estudo. Na verdade, para sustentar que Jesus
    Cristo não foi homem, mas um, agênere, isto é, um ser não gerado conforme as leis
    normais nas etapas mais altas da escala zoológica, aquele extenso alinhamento
    de nomes arrevesados do início da série animal e sua maneira de procriação, para
    aos mesmos comparar Jesus Cristo, é tão deselegante e pouco sensato, do ponto
    de vista científico, que só teríamos o direito de o esperar de um desses mocinhos
    que estão fazendo o curso de colégio ou a secção de ciências em faculdades de
    filosofia. Nunca em diretores da casa da Avenida Passos ou seus autorizados representantes.


    Por tal processo s. s. só alcança o seguinte: que os espíritas de cultura lamentem
    e se sintam humilhados; que os faltos de cultura vão passando adiante, confiados,
    argumentos que diminuem o conceito em que deve ser tida a doutrina espírita; que
    os adversários façam um péssimo juízo de uma doutrina cujos maiorais se apresentam
    à luta tão mal aparelhados.


    O segundo abuso de s. s. é a marcada preferência por edições recentes da Bíblia,
    "preparadas" pela Igreja Católica.


    Quem aborda temas científicos procura as fontes insuspeitas; apoia-se em autores
    que, por sua grande autoridade ou por sua vetustez, sejam justamente respeitados.


    Ao fazer sua obra, Allan Kardec apoiou-se, quanto à parte moral e


    bíblica, na versão de Saci, que têm o apoio da catolicidade de fala francesa.
    Por que não nos referirmos a ela? E se esta nos falta, ou desejamos reforçar a
    convicção, por que não recorrer, por exemplo, a notável Bíblia Inglesa revista
    em 1611, mais conhecida como a **King James Version** e que se mantém inalterável,
    até mesmo quanto à mutação gráfica sofrida pela língua inglesa? E as versões italianas
    de Diodati e de Luzzi, aquele vindo do último quartel do século XVI e com o título
    de professor de teologia na Universidade de Calvino, em Genebra, e este tendo
    por si toda a imensa e, por todos os títulos, respeitável tradição dos Valdenses?
    E'
