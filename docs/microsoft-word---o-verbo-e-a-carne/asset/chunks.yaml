    obras de `Kardec`, para gerar confusão e nas de `Roustaing`, para criar base lógica
    à argumentação; VIII – alterando textos de obras mediúnicas, como fez com uma
    doada ao médium Francisco Cândido Xavier, para afeiçoá-la à tese roustainguista.


    Ora, estes processos são desmoralizantes. E é o caso de lembrar aos diretores
    da `F. E. B.` que os kardecistas, ainda quando ao par de todas estas coisas, não
    esqueceram a parábola do filho pródigo e são capazes de a pôr em prática.


    Tudo dependeria de querer esse filho pródigo voltar à casa paterna.


    Mas fora preciso que compreendesse o sentido do roustainguismo. E corrigindo-se,
    corrigisse aquela instituição todas as falhas de que é justamente acusada.


    Entretanto não é de esperar que o façam os seus diretores. E não o fazem porque
    não podem ou não querem compreender que são vítimas da mais solerte, pertinaz
    e organizada, ao mesmo tempo paciente, complexa e poderosa falange de Espíritos
    que se possa imaginar: a falange vaticânica.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________

    88


    Fazer a história minuciosa da `F. E. B.` é rastrear o trabalho dessa falange.
    E sua ação tornou-se possível porque, encontrando as brechas, que são as falhas
    humanas, não esbarrou com aquele espírito crítico de que `Kardec` deu exemplo
    e advertência nas reiteradas recomendações que nos legou. Ali faltou, também,
    conhecimento seguro dos Evangelhos e escritos complementares.


    É praxe nas sociedades espíritas aceitar tudo quanto lhes é dito por Espíritos
    e por conferencistas e doutrinadores. Esquecem que, sendo o homem um Espírito
    encarnado e o Espírito um homem desencarnado, são dois aspectos da mesma coisa.


    Conseqüentemente, se há Espíritos que sabem mais do que nós, há homens que sabem
    mais que muitos Espíritos. Como não há análise das comunicações, esses Espíritos
    de falange se vão insinuando: dizem verdades para captar o respeito, fazem diagnósticos
    e indicam medicação certa para conquistar a estima. Mas quando dominaram o terreno
    agem de maneira multiforme no sentido de desmoralizar a doutrina, pelo rebaixamento
    de seu nível e pela derrocada de suas sociedades.


    Para esses Espíritos todas as armas são boas, desde que produzam os resultados
    que objetivam. Têm conhecimentos variados, contam com muitos especialistas nos
    múltiplos setores do saber. Por isso não recuam ante nenhum obstáculo, inclusive
    o da utilização da magia negra, isto é, o do emprego do trabalho mediúnico para
    fins maléficos. Exercitam uma ação violenta sobre os médiuns, já transformando
    a sua psique, já produzindo uma concentração de fluídos em determinados pontos
    do organismo perispiritual dos pacientes, a qual evolui e acaba por atingir certas
    glândulas, determinando um comprometimento endócrino e, por vezes até, o aparecimento
    de lesões orgânicas mais ou menos devastadora, quando não o de neoplasias, algumas
    das quais irremediáveis, já por sua localização, já por sua própria malignidade.


