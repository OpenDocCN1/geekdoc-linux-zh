  raw: 'trabalha para inutilizar a obra de Allan Kardec. Isto vem do tempo de uma
    sociedade que depois, fundindo-se com outra, originou a **F. E. B.: A Sociedade
    Acadêmica Deus,** **Cristo e Caridade".** Esta fez as nossas primeiras traduções
    de Kardec para o vernáculo. Pois naqueles tempos, aí por 1880, já os roustainguistas
    queriam alterar a obra do Codificador, como se vê na primeira edição de **A Gênese,**
    por influência dos **Quatro Evangelhos** de Roustaing. A edição é de 1882 e tal
    confissão vem na introdução; entretanto diz que foi decidido **"como prova de
    homenagem ao seu** **colecionador, nosso Mestre, Allan Kardec, conservá-las com
    o cunho que ele** **imprimiu-lhes".** E acrescenta: **A Sociedade Acadêmica julga
    que não lhe assiste, como a** **ninguém, o direito de alterar o plano e menos
    ainda as bases fundamentais, as** **teorias, a doutrina das obras publicadas pelo
    anoso Mestre; não só por lhe parecer isso** **uma profanação, por serem um legado
    precioso, pois que por elas conhecemos a verdade,** **se nos fez a luz; mas ainda,
    porque anão há lei alguma conhecida que justifique tal**


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    90


    **procedimento; e, se tal lei existisse, seria bárbara, despótica, vandálica,
    porque seria a** **anulação da propriedade, seria a negação do direito”.**


    Aquela velha gente podia equivocar-se, mas tinha gestos elegantes como este de
    fechar a introdução com uma mensagem do Espírito do próprio Allan Kardec, dada
    na sociedade, focalizando a questão: **"Sim"** diz Kardec, **"porque ainda** **que
    qualquer idéia, das aí colecionadas, tivesse de sofrer qualquer retoque ou** **modificação,
    seria trabalho reservado para uma obra especial, cuja leitura, sendo boa** **para
    aqueles que já conhecem profundamente a Ciência Espírita, não convém àqueles**
    **que apenas começam: porque não estando preparados, teriam de fazer passar**
    **bruscamente por uma inversão todas as idéias arraigadas em seus cérebros, o
    que é** **contrário às leis naturais, e por isso inconveniente".**


    **"Não defendo a obra que colecionei, mas o melhor sistema de, com método,** **lenta
    e suavemente, preparar aqueles que devem conhecer o que de mais elevado** **poderia
    se apresentar à concepção humana".**


    Estas palavras criteriosas estão longe de significar uma adesão de Allan Kardec
    ao roustainguismo. Este não passa de um equívoco que deve ser destruído elegantemente,
    segundo os postulados da doutrina espírita cristã, sintetizado no pensamento agostiniano:
    abraçar os homens mas profligar (destruir) os seus erros.


    *****


    Um paralelo entre os trabalhos de Kardec e de Roustaing mostra o seguinte: a)
    Kardec seguiu critérios científicos; Roustaing, NÃO;


    b) as afirmações fundamentais de Kardec têm concordância universal; as de Roustaing,
    NÃO;


    c) Kardec respeitou a ética nas pesquisas e citações; Roustaing e, principalmente,
    os roustainguistas, NÃO;


    d) Kardec promoveu sempre a discussão, para chegar ao esclarecimento; o roustainguismo
    foge e proíbe a discussão, para evitar a evidenciação do erro; e) Kardec é cristão:
    respeita os textos evangélicos e promove a união; Roustaing é anticristão: deforma
    os textos e exclui os kardecistas;


    f) a obra de Kardec resiste à lógica, à crítica, ao bom senso e à moral; a de
    Roustaing é anti-científica, insensata e imoral, porque infama o caráter de Jesus
    Cristo; g) como Espírito, Kardec sustenta a inteireza de sua obra; como Espírito
    Roustaing confessa o seu erro;


    h) os cientistas contemporâneos e posteriores a Kardec que na França, Itália,
    Alemanha, Rússia, Inglaterra e Estados Unidos investigaram o Espiritismo, deixaram
    trabalhos concordantes com a codificação kardeciana; nenhum deles, entretanto,
    tomou conhecimento, do trabalho de Roustaing e qualquer referência indireta de
    sua tese central é no sentido de a condenar;


    i) a obra de Kardec conduz à emancipação do dogmatismo e do ritual religioso;
    a de Roustaing submete o indivíduo aos dogmas e destrói a função social da doutrina
    espírita, que é essa mesma libertação, de que é exemplo a mariolatria dos roustainguistas.


    *****


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    91


    Encerremos este trabalho.


    Sabiam os judeus, que estudaram a lei e os profetas, bem como os Saduceus, que
    se haviam apoderado do Templo e punham em leilão o cargo de sumo sacerdote, transformando
    a religião em mercantilismo e a autoridade religiosa em privilégio oligárquico
    de uma família, como se verifica ao tempo da pregação e do sacrifício de Jesus
    Cristo, que era chegado o instante profetizado para a vinda do Messias. Por palavras
    e atos Jesus mostrou-se hostil a entendimentos que confundiam interesses religiosos
    com situações políticas, fosse da conchavo com as autoridades, fosse de chefia
    de uma rebelião, como pretendente ao trono judaico, para sacudir a dominação romana.
    Por isso o sacrificaram. Vendo, porém, o desenvolvimento posterior do Cristianismo,
    apesar de não expurgado da herança do Judaísmo; vendo que apóstolos e discípulos
    faziam largo proselitismo entre judeus e estranhos, temeram os rabinos por seus
    interesses materiais de exploradores do Templo.


    Precisavam desacreditar os cristãos e justificar O seu crime.


    Ora, os judeus e cristãos conheciam os fenômenos espíritas, de que o Velho Testamento
    estava repleto; estavam na memória de todos os acontecimentos do Pentecostes,
    que não passara de uma grande manifestação coletiva de mediunidade; ademais, sabiam
    os judeus que os primeiros cristãos praticavam a mediunidade. E procuraram tirar
    partido desse fato, soprando que Jesus Cristo fora apenas um espírito materializado,
    desses que Kardec chama de agêneres.


    Daí as duas epístolas de João, o evangelista, apóstolo da predileção de Jesus,
    sem dúvida por ser o mais arguto, o mais evoluído, o mais receptivo, o mais capaz
    de grandes sínteses, como bem o demonstrou no seu **Evangelho filosófico** e no
    **Apocalipse.** João foi a sentinela: deu o grito nas passagens daquelas epístolas,
    citadas no nosso primeiro artigo (1 João, 4:1-3 e 6; 2 João 7) cuja repercussão
    encontramos nas epístolas de Pedro e de Paulo.


    Por que assim procediam os judeus?


    Porque se Jesus tivesse sido um espírito materializado não teria sido o Messias,
    porque não corresponderia às profecias. Não sendo o Messias, era um embusteiro.
    Continuariam os judeus absolvidos e gratificados por sua eliminação, pela consolidação
    de seu prestígio, do mesmo passo que essa primeira heresia prestava o serviço
