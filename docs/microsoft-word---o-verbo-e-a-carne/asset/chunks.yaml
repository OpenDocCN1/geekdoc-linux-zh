    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    17


    Não podemos separar os princípios éticos do contexto de nenhum


    problema espiritual. Alega-se também que Jesus ensinava em parábolas. Mas as parábolas
    não são mentiras, são formas alegóricas, simbólicas de transmissão da Verdade.
    A própria Psicologia materialista constatou essa necessidade de sermos verdadeiros
    no ensino das coisas mais corriqueiras, condenando as explicações fantasiosas
    do nascimento das crianças. Se a lenda ingênua da cegonha é um mal por ser mentirosa,
    que dizer do mito absurdo do nascimento fingido de Jesus? O


    uso da alegoria é válido e prepara o advento da verdade, mas o uso do fingimento
    é próprio dos mistificadores, dos embusteiros, das criaturas falsas e não de espíritos
    esclarecidos.


    O mesmo se aplica ao episódio ridículo da permanência de Jesus menino em Jerusalém.
    O menino não era menino, mas um espírito adulto disfarçado em criança. Enganava
    os doutores da lei com suas respostas astuciosas e enganava o povo com suas fugas
    para o Céu, deixando as roupas em mãos dos anjos que o ajudavam na mistificação.
    E por que tudo isso? Porque em Jerusalém, justificam os


    "ministros de Deus” era difícil encontrar lugar para um menino permanecer três
    dias sozinho. Desculpa tola, como se vê, que só tem uma justificativa: **uma mentira**
    **puxa a outra.**


    Bem precário seria o poder divino se estivesse submetido à condição de recorrer
    aos ardis humanos, às espertezas comuns dos passadores de conto do vigário, para
    poder trazer a Verdade à Terra. Não são os mestres espirituais que se utilizam
    dessas formas grosseiras de mistificação, mas os espíritos mistificadores, os
    embusteiros vulgares. Justifica-se pois o ardor de João, o evangelista, e de Pedro,
    o apóstolo, ao repelirem a teoria do corpo fluídico, bem como o ardor de Paulo
    ao nos advertir contra as fábulas que desfiguram a Doutrina do Cristo 14.


    A frase do último trecho acima citado: "Voltava para as regiões superiores onde
    pairava e paira ainda. .. " encerra uma malícia diabólica. Afirmando que Jesus
    retornava aos esplendores celestes, como espírito protetor e governador da Terra,
    ela pretende encobrir com essa declaração enfática o ridículo da esperteza do
    menino.


    Os corações ingênuos se comovem com essa falsa abnegação de um deus mitológico,
    obrigado a participar entre os homens de uma pantomima celeste, e o raciocínio
    enganado justifica o mito.


    ## **VIII**


    **REPETIÇÕES E RETROCESSO**


    Esgotada a leitura do primeiro volume de **Os Quatro Evangelhos** cai o leitor
    num verdadeiro redemoinho de repetições. Uma simples consulta aos índices de cada
    um dos quatro volumes da obra revela isso. As revelações e os comentários se repetem
    no ritmo de um moinho, sem cessar, lançando sempre o mesmo produto.


    Kardec advertiu, ao registrar o aparecimento da obra, que ela era demasiado vasta.


    Posteriormente assinalou, como vemos no próprio artigo de crítica publicado na
    **Revista Espírita,** número de junho de 1866 15, e reproduzido para contestação
    no primeiro volume da obra de Roustaing, que esta obra nada mais fez do que avançar
    14 “O Cristo foi o iniciador da mais pura, da mais sublime moral, da moral evangélico
    cristã, que há de renovar o mundo, aproximar os homens e torná-los irmãos; que
    há de fazer brotar de todos os corações a caridade e o amor do próximo e estabelecer
    entre os humanos uma solidariedade comum; de uma moral, enfim, que há de transformar
    a Terra, tornando-a morada de Espíritos superiores aos que hoje a habitam. E a
    lei do progresso, a que a Natureza está submetida, que se cumpre, e o *Espiritismo*
    é a alavanca de que Deus se utiliza para fazer que a Humanidade avance” (ESE;
    1:9).


    15 Págs. 188 a 190 – Os Evangelhos Explicados.


