    我需要这些项目来证明这一新启示中`神秘起源`的真实性。这种模仿是清晰可见的。而那些增加的内容总是想象色彩的产物。在这种情况下，正如许多其他情况一样，这些增加显示了对灵性教义的理解和同化的缺失。Roustaing
    在没有任何证据或调查的情况下，面对`上帝的仆人`们所谓的不可无错性，承认上帝为遵循善之路的灵体们设定了一个荒谬的特权：他们“在流体状态中进步，从而达到完美”。这这将使他同时也接受了两个世界层级：物质世界的层级和流体世界的层级。


    然而，Kardec 解释了以下内容：


    > “从初就遵循善之路的灵体们，并不因此就是完美的。如果他们没有坏的倾向，并不意味着他们没有义务获得完善所需的所需的经验和知识”。（**对第 127 项的注释**。）因此，`所有灵体`肉身的必要性在
    Roustaing 主义的文本中，尽管 Roustaing 反对，依然是显而易见的。如果灵体是源自智性原则，通过在自然界中连续且进步的发展而形成的，他们又如何能突然跃过自然法则，进入完美灵体所处的平面，而那里不再需要转世呢？他们可以凭借自由意志在善与恶之间做出选择，但难道这种判别力本身不源于经验和知识吗？如果他们不在进化的自然进程中不经受肉体生存的诱惑和吸引，他们又如何证明自己有保持在善之路的能力呢？


    但对新奇的诱惑、对寻找奇迹出路的渴望、以及对想象力的迷恋，是 Roustaing 主义脚下永恒开启的深渊。`上帝的仆人`们无法忍受人类逻辑的严密性。他们需要假设的、乌托邦的、以及彼得使徒提到的第
    19 个寓言，并通过幻想之门逃避现实。那个在自然界中通过智性原则的逐渐个体化而缓慢形成的灵体，刚刚达到进入——非人类的，而是人类王国——的状态，就已插着伊卡斯的翅膀向太阳飞而去。


    获得进入人类王国的条件后，灵体处于孩子的状态，正如 Kardec 所指出的，它必须在家庭中学习社交的最初基础，随后在学校，接着在社会交往中，在人类关系的第
    20 个过程中，学习生活的重大课程，这些教训将为它进入更高级世界的高等课程做准备。“万物在宇宙中环环相扣”——《灵之经》教导我们——特别是在第 540 项：“从原始原子到大天使，因为它本身也是从原子开始的”。这种一元论的宇宙观，对应于一神论，将上帝的概念和创造的概念连接在统一的结构中，是人类的高级成就，而
    Roustaing 主义试图将其交还古代的二元论。康德认为上帝的概念是人类所能构出的最高思想，因为这个思想是最高综合，是心理抽象的最高程度。但 Roustaing
    主义在他魔幻的幻想中、在他对回归原始状态的疯狂渴望中，粉碎了一这一切。


    我们在它的流体世界和物质世界的理论中看到了这一点，它们之间彼此隔绝，如同创造中两个对立的分支。这是一种第 21 种泛神论，其中上帝和魔鬼将宇宙分为两个同样野蛮的领域：善与恶的领域，因为面对永久的恶，善也无法是纯的。让我们看看文本：


    > “流体世界，注定供从幼年和教育状态起从未失败的灵体居住，它们在进步的道路上始终保持纯洁，在流体状态中进步”。

    >

    > “物质世界——‘旨在让失败灵体转世的不同世界，并作为此类，受人类肉身的限制’”。


    `上帝的仆人`们没有意识到，这不是两个层级，不是一个中断的过程，而是一个自然的连续体，在这个过程中，流体世界代表了物质世界发展的高级阶段。正如谚语所说：他们听到公鸡叫，但不知道在哪里。


    ---

    19 “因为我们向你们传讲我们主耶稣基督的大能和降临时，没有从不讲狡猾的寓言，因为我们是祂威严的目击者”（彼得后书 1:16）。

    20 “人类共同产生了一个人类环境，包含其社会文化和心理构成的全部。这些构成分中的任何一个不能被理解为人类生物构造的产物，正如我们所指出的，这种构造仅提供了人类生产性活动的外部限制。正如人不可能在孤立中发展成为人一样，孤立的人也不可能产生人类。”

    21 伊朗人（波斯人）的古代宗教，其特征是通过承认两个斗争的原则使自然力量神化，`aura-mas`（善之神）和`arimã`（恶之神或魔鬼）。

    22 道与肉体——2 Roustaing 主义分析


    ## ROUSTAING 主义的转世

