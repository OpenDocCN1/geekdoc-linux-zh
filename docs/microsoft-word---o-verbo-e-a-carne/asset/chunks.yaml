    67


    ### 耶稣：人还是无性别者？


    现在让我们考虑以下论点：IV - 耶稣基督不是人，而是一个无性别者；VII - “如果灵应主义没有证实耶稣流体体的特例性质，那么之前的两次启示将崩塌，灵应主义也将无法生存”；以及
