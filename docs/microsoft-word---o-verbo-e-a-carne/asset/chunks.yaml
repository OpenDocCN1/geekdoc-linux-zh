    que decorre das funções mediúnicas, mas sim da magia primitiva ou anímica, bem
    definida por Malinowski 12, que tanto existe nas selvas como nos meios mais civilizados.
    É esse o tipo de magia que constitui a essência do Roustainguismo, na mesma linha
    do pensamento mitológico que gerou a teoria grega do corpo fluídico de Jesus na
    era apostólica, contra a qual se ergueram os apóstolos, como vemos nas epístolas
    de Pedro e João.


    A anedota da amamentação de Jesus exemplifica bem esse tipo de magia.


    Jesus menino não aparece ali como um ser real, mas como um ser artificial, um
    deus mitológico que se disfarça numa criatura humana, como o faziam os deuses
    gregos e romanos para iludirem os homens e pregar-lhes as suas peças. Usando o
    poder mágico da transmutação (alquimia) ou transubstanciação (teologia) o menino
    mitológico (e portanto ante-cristão) mudava o leite materno em sangue e o devolvia
    à circulação no corpo de Maria. É uma adaptação ao Espiritismo do dogma católico
    da eucaristia 13.


    Pode-se alegar que isto seria, possível por meio da ação mediúnica. O caso da
    transformação da água em vinho, citado no Evangelho, poderia justificar essa teoria.
    Mas não podemos esquecer as seguintes diferenças: quando Jesus operou a transformação
    da água não o fez para iludir ninguém, mas para demonstrar os seus poderes e despertar
    a fé nos que deviam ouvi-lo; foi portanto uma ação moralmente lícita, como todas
    as suas ações; essa transmutação (química e não alquímica) não foi uma encenação,
    mas um fato real, ainda hoje constatável na atividade mediúnica. A transmutação
    do leite de Maria implica problemas morais inadmissíveis numa personalidade espiritual
    elevada, tanto mais que por trás dela encontra-se todo o complexo fantasioso e
    absurdo do nascimento fingido. Estaríamos diante desta contradição que minaria
    os alicerces do Cristianismo e de todo conceito espiritual: a `Verdade revelada
    através da mentira`.


