    "amigos" que confundem as próprias idéias, convicções e interesses com a Verdade
    e não temem ofender ao Mestre, que não se zanga e nem protesta, e cujo nome vive
    em suas bocas, mas cuja doutrina nem lhes encheu o cérebro nem lhes melhorou o
