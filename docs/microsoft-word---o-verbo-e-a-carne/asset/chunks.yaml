  raw: '**Historicamente a razão de ser do Roustainguismo é apenas esta: a** **inquietação
    de um convalescente que se impressiona com a obra de Kardec e tem a** **pretensão
    de superá-la, esclarecendo pontos obscuros dos Evangelhos com a ajuda dos** **Espíritos
    Superiores, através de comunicações por alguns médiuns seus conhecidos e** **conterrâneos,
    que por fim são substituídos pela médium única, Madame Collignon,** **responsável
    mediúnica por todo o texto. O próprio Roustaing provoca a revelação** **evocando
    os espíritos, ao contrário de Kardec que estuda os fenômenos e é** **surpreendido
    pela revelação em meio de seus trabalhos de experimentação mediúnica.**


    A posição científica de Kardec opõe-se à posição vulgar de Roustaing um homem
    vaidoso que se deixa levar pelos espíritos mistificadores, aceitando as explicações
    mais ridículas e absurdas para o esclarecimento de problemas escriturísticos.
    O grande advogado não passava de um grande ingênuo.


    **XIII**


    ## **ROUSTAINGUISMO NO BRASIL**


    Quais os motivos da penetração da Roustainguismo no Brasil? Como e porque ele
    conseguiu enraizar-se na chamada "casa mater"? Por que nos defrontamos agora com
    uma recrudescência dessa pseudo-doutrina? Parece-nos que tudo se resume numa questão
    de formação religiosa, tendo por fundo a formação racial brasileira e o período
    medieval do nosso desenvolvimento nacional. O Roustainguismo chegou ao Brasil
    num momento crítico, quando a nossa cultura estava sendo abalada por várias infiltrações
    européias. Entre essas, o Espiritismo, que chegara da França e empolgara alguns
    espíritos cultos na segunda metade do século passado. O Roustainguismo se apresentava
    como integrado no Espiritismo e tocava de perto a sensibilidade mística de alguns
    ex-católicos.


    A França era então o centro da Civilização e Paris o cérebro do mundo. A obra
    de Roustaing chegava amparada pelo prestígio da França e do Espiritismo. Trazia
    ainda a chancela de Roustaing, nome respeitado nos meios jurídicos de Bordeaux,
    e fora recebida mediunicamente por Madame Collignon, pertencente a prestigiosa
    família de juristas. Todo esse aparato impunha **Roustaing** à nossa inteligência.
    Mais do que isso, porém, a obra trazia um grande alívio aos espíritos místicos,
    quebrava a frieza racional da obra de Kardec e restituía ao Cristo a sua condição
    sobrenatural.


    Para homens profundamente religiosos como Bezerra Menezes, que fora exemplo de
    católico praticante, Antônio Luiz Sayão, Bittencourt Sampaio e outros, cujos atos
    atestam o predomínio do sentimento religioso a razão crítica, a obra de Roustaing
    surgia como tábua de salvação, livrando-os do racionalismo kardeciano. Roustaing
    era a volta ao maravilhoso, ao Cristo místico, divino no espírito e no corpo.
    Dessa maneira, Roustaing devolvia a essas criaturas as ilusões da religião lírica
    que as embalara desde a infância.


    Não é fácil compreendermos hoje o clima religioso que o Espiritismo se desenvolveu
    entre nós. Houve, naturalmente, a dissidência racionalista, constituída por


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    32


    elementos que tendiam para o aspecto racional da doutrina. Daí a divisão, acentuada
    por Canuto de Abreu, entre os espíritas místicos e científicos. Divisão que foi
    perdendo o seu sentido na proporção em que a obra Kardec era melhor compreendida,
    revelando a sua essência religiosa e sobretudo a sua natureza de elo entre a Religião
    e a Ciência.


    Como explicar-se a posição do Estado de São Paulo taticamente do Sul, rejeitando
    Roustaing desde o início? Figuras exponenciais como Batuíra e Cairbar Schutel
    revelaram desde o princípio acentuada tendência racional. Eram espíritos analíticos,
    amigos da era cartesiana, do espírito positivo, repelindo os exageros místicos.
    O desenvolvimento cultural de São Paulo contribuiu para a consolidação desse espírito
    em nosso meio doutrinário. Somente alguns espiritistas isolados deixaram se levar
    pelo Roustainguismo, que jamais conseguiu predominar numa só instituição doutrinária.
    Pelo contrário, nos grupos e nas sociedades espíritas os poucos roustainguistas,
    mesmo quando se destacavam por seu prestígio pessoal, dissimulavam habilmente
    a sua posição, como o fazem ainda hoje, evitando atritos.


    A vocação pioneira de São Paulo, o impulso para o futuro que o


    caracterizou desde a sua formação parece ter influído nessa posição kardeciana.
    O


    Roustainguismo, como já vimos, é um impulso de retrocesso, uma volta ao passado.
    E


    uma forma de saudosismo. Toda tendência retrógrada, em qualquer campo das atividades
    humanas, sempre encontrou repulsa no clima mental e cultural paulista. E


    quando falamos desse clima não nos fechamos nas fronteiras do Estado, pois que
    ele abrange todo o Sul do Brasil.


    Referimo-nos acima ao nosso período medieval. São Paulo também passou por esse
    período, que podemos figurar na fase da Civilização Caipira. Assim, os elementos
    básicos de nossa formação racial também estão presentes em São Paulo: o religiosismo
    português, o animismo indígena, o feiticismo do negro, mas sobre eles dominou
    o nacionalismo utilitarista do bandeirante desbravador. Esse espírito de audácia,
    forjado com a matéria prima de Sagres, espantou dos ares do Planalto os fantasmas
    aborígenes e africanos e os resíduos do teologismo medieval.


    Encontramos num livro de Luciano Costa, **Kardec e não Roustaing**, editado pela
    Gráfica Mundo Espírita do Rio de Janeiro, em 1943, a mesma afirmação que sustentamos,
    referente ao sentido retrógrado do Roustainguismo. Não havíamos lido esse livro,
    que só agora nos chegou às mãos. Folheando-o, encontramos alguns trechos valiosos.
    Luciano Costa observa que o Routainguismo nos devolve aos tempos do Cristianismo
    Primitivo, quando o ensino do Cristo não era ainda compreendido, e acentua:


    "Em Roustaing impera, absoluto, sobre todos os seus ensinos, o sentimento religioso
    da Antigüidade. - Em **Os Quatro Evangelhos** as verdades são sempre contrariadas
    pelas mentiras, o natural é prejudicado pelo absurdo e o belo é sempre desfigurado
    pelo horrível. Jesus é fluidificado, purificado e até endeusado; mas também é
    ironizado, ridicularizado, deturpado e estupidificado!"


    Nos idos, de 40 estávamos ainda na mocidade, havíamos nos tornado espírita há
    poucos anos e não tivéramos tempo de aprofundar o conhecimento da Doutrina. A
    FEB fazia então grande propaganda da obra de Roustaing, afirmando que se tratava
    da única interpretação total dos Evangelhos publicada em toda a Cristandade. Nessa
    época o Rev. Othoniel Motta publicou o seu livro **Temas** **Espirituais,** em
    que relata suas experiências espíritas positivas, reconhecendo a veracidade dos
    fenômenos, mas combatendo a doutrina como diabólica. Analisamo-lo, no ardor da
    juventude, num folheto intitulado És Mestre..., publicado na Revista **Internacional
    de Espiritismo,** de Matão, e feito em separata pela Editora "O Clarim".


    Levado pelas informações da FEB citamos de passagem **Os Quatro Evangelhos.**
    E


    um espírita da Bahia escreveu-nos a respeito, felicitando-nos pelo trabalho mas


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    33


    lamentando a citação infeliz. Fomos consultar a obra famosa e ficamos envergonhado.
    Graças a Deus Othoniel não recorreu a ela.


    Caso semelhante aconteceu a Carlos Imbassahy, segundo ele nos relatou pessoalmente.
    Eurípedes Barsanulfo é também citado às vezes como roustainguista em virtude de
    engano produzido pela propaganda. Logo que acordou do engano, Barsanulfo repudiou
    Roustaing. Chico Xavier tem sido vítima de mentirosos envolvimentos e sua obra
    chegou a sofrer deturpações, mas a verdade é que ele nunca apoiou Roustaing. Outros
    companheiros – e entre eles nos parece que se encontra Bezerra de Menezes – acordam
    também em tempo mas não quiseram provocar escândalos no meio doutrinário e preferiram
    silenciar.'
