  trans: '

    第一启示，即旧约，包含了上帝的律法，犹太人称之为 `Torá`（托拉）49；它预言了弥赛的降临；反抗祭司的偏离，并在被称为 `Neblim` 的书集中预言了未来的事件；这些书涵盖了大小先知。其他的历史和诗歌书籍构成了它
    50。


    ### 49 五之经

    五之经在希伯来语中被称为 `Chumash: ”托拉的五分之一”` (`chamishá chumshei Torá`）或 `humash`、`hamishá,`
    `humshé Torah`，或简单称为 `Torá`（教导），是犹太思想中神圣性的最高体现。这部包含了圣经前五卷的法律汇编，包含了 613 条诫律，构成了犹太人宪法的基础。


    五之经曾是许多哲学家、卡巴拉学者、塔木德学者等进行研究、批判和质疑的对象。然而，没有哪一个他们能像 `Maimônides`（迈蒙尼德）在他生前通过著作和研究所做的那样解释律法。这位哲学家在他的著作《Os
    613 mitsvot》（诫命）中“汇总”了 `Torá`，并将其“划分”为准则，分为 248 条积极诫和 365 条否定诫。第一种划分是讨悦上帝的准则或法律，即“你要做的”；第二种是不讨悦上帝的准则，即“你不要做的”。


    因此，五之经并非一部统一的作品。但也不像德国批判传统中的某些学者所说，它是流亡时期祭司的刻意伪造，试图将他们自利的宗教信仰强加于民众，并将其归于 `Moisés`（摩西）及其时代。我们不应让黑格尔主义、反教会主义、反犹太主义和
    1 世纪知识模型所产生的学术偏见扭曲我们对这些文本的看法。


    所有内部证据表明，那些记录并融合这些著作的人，以及在流亡后集结正典时的抄写员，完全相信古老文本的神圣启示，并以虔诚的心按照尽可能可能的准确标准进行抄写，其中包括许多他们显然并不理解的段落（Johnson,
    P. 《犹太人史》，第 94 页及以后）。`Torá` 中出现的所有法律，从割礼到洗手，只有一个目的，即将希伯来人——选民——与周围的民族区分开。


    我们只想向读者强调，每当我们使用“划分、汇总、制定、编写、解释等”等词来描述整个 `Torá` 或律法时，我们只是在做类比，或试图让那些不熟悉犹太思想阅读的人更容易理解这些解释。不存在任何划分、总结，更不存在任何思想能够定义或证明这本书的维度——它在每一个点、每一行都拥有神圣性，并通过其显现（hierofanias）作为解释这种神圣性的目标。


    `Torá` 是统一、不可分割且绝对的，不存在半部分的 `Torá`；要么将 `Torá` 视为整体，否则我们拥有的不是 `Torá`，而是毫无用处的法律碎片。`Torá`
    存在且一直存在于宇宙的基石之中，是它的法律建立了并和谐了整个宇宙；如果没有 `Torá`，生命、土地和宇宙将不复存在。在 `Torá` 以书面形式存在之前，永恒者将其掌握在手中，组织、结构化并圣化了世界。`Torá`
    实际上是创造的计划（Unterman, A. 《犹太传说与传统辞典》，第 179 页）。


    ### 50 著作与先知

    著作和先知可以按以下方式“划分”：


    *   **叙事和历史书籍：** 约书记；士师记；列王纪和撒耳记。

    *   **在先知之中：** 我们有“四个”大先知和十二小先知——术语指的是传道的时间和书的长度，而不是指这些或那些先知的重要性大小。他们都有其重要性。


    在这些提到弥赛的文中，他将是一个人、一个先知、大卫家的后裔。这一切在正确的时间、预定的地点和大预言者预言的条件下实现了。`Jesus Cristo`（耶稣基督）教授了他的教义，他的门徒和门徒将其传下去。这些构成了第二次启示的著作。

