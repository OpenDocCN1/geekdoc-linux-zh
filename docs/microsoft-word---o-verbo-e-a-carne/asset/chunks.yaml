    às regiões dos fluídos puros que ele habita, senão por encarnação ou incorporação
    voluntária". A encarnação fluídica é explicada com o exemplo das materializações
    de King, com uma diferença: a de Jesus se serviu, sem disso realmente precisar,
    da mediunidade de Maria. Assim, seu corpo aparente não era carnal, mas de uma
    carne refinada. Só a chamada do absurdo, que é uma espécie de antilogia, poderia
    tornar aceitável esse jogo de palavras. E com isso procura se livrar da acusação
    de docetismo acertadamente. O elemento fundamental desta doutrina é o preconceito,
    a consideração das leis naturais como impuras. Teria Jesus esse preconceito? Ele,
    que dizia filho do homem, que condenava e contraria os preceitos da lei de pureza,
    teria exigido um privilégio para sua encarnação entre os homens? Ele que se colocou
