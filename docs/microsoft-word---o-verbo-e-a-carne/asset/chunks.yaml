    Passando para a vida de além-túmulo essas figuras destacadas do clero observavam
    os médiuns. E, ou os afeiçoavam ao seu serviço ou os obsidiavam e enlouqueciam,
    para que não viessem prestar serviços esclarecedores e, conseqüentemente, contrários
    aos interesses materiais da Igreja Romana. Pode bem ver-se esse feito das falanges
    vaticânicas na ação exercida nos ambientes reformados, onde se acredita, `ao pé
    da letra`, que as almas imateriais se salvam por meio de um banho no sangue material
    de Jesus, coisa que, além de paradoxal é imoral, por ser a justificação e um crime.
    Igualmente se o vê na crença protestante no Espírito Santo, isto é, nos bons Espíritos
    e na sua evocação, quando, entretanto, recusam a mediunidade, recusam o `batismo
    no fogo do espirito` e discordam dos Pentecostais, assim como estes dos Espíritas.


    Quando chegou o momento de se realizarem as promessa do Cristo, isto é, da vinda
    do Consolador, representado na doutrina espírita, aquelas falanges vaticânicas,
    não podendo abrir brecha na contextura moral e na inteireza de Allan Kardec, procuraram
    agir em paralelo: escolheram uma figura de destaque, de mediunidade sutil, intuitiva
    e de inspiração, avassalaram um médium feminino para o serviço do primeiro, posto
    essa senhora aceitasse as mensagens, e restauraram a velha e desmoralizada heresia
    do corpo fluídico de Jesus, que se prestava admiravelmente para sustentar dois
    dogmas católicos: o da Santíssima Trindade e o Imaculada Conceição.


    Define-se a situação na prática, que é a seguinte:


    I – nos centros roustainguistas a ação das falanges o desenvolvimento porque isto
    seria detrimento para catolicismo; II – nos centros onde a falsa compreensão de
    tolerância mistura kardecismo e roustainguismo, dá-se um choque de correntes de
    Espíritos, manifesto nas dissenções internas que atrofiam os médiuns, as sociedades
    esfacelam; III – nos centros puramente kardecistas, onde, em geral, não há estudo
    largo e profundo do assunto, são freqüentes as crises, devidas ao trabalho de
    falanges; e, mesmo quando se constata que são falanges de padres, a falta de conhecimento
    panorâm da matéria tira aos dirigentes o poder de domínio sobre aquelas impelem.


    Observe-se que nem sempre é seguro o controle através dos videntes. Em geral estes
    não se acham suficientemente instruídos; assim não sabem estabelecer a diferença
    entre:


    a) manifestações de animismo do próprio médium; b) manifestações de Espírito encarnado,
    cujo corpo somático esteja no ambiente ou fora dele; c) apresentação de uma ideoplastia
    por mistificados, que maneja os fluídos e naquela mascara; d) manifestação de
    Espírito veraz. Entretanto não seria difícil explicar essas diferenças de imagens
    astrais, noticiadas pelos videntes, com o fito de assegurar o controle das manifestações.


    Se a Federação Espírita Brasileira se sente com vocação para ser uma federação
    espírita; se a grande maioria dos espíritas brasileiros são kardecistas e desejam
    a modificação do `status quo` pelos roustainguistas; se estes estão realmente
    convencidos das excelências de seu cisma, por que não concordam em tirar limpo
    aquilo que os kardecistas impugnam?


    Para tanto bastaria organizar um grupo selecionado nas seguintes condições:


    I – número igual de kardecistas e roustainguistas, escolhidos entre pessoas de
    cultura e imbuídas da responsabilidade do trabalho em que irão participar; II
    – um grupo de médiuns videntes, previamente submetidos a testes; III – incorporações
    ou mensagens psicográficas através de `Francisco Cândido Xavier`, e de outro médium,
    previamente examinado; IV – evocação dos Espíritos de `Ismael`, `Bezerra de Menezes`,
    `Emmanuel`, `Allan Kardec` e `Roustaing`; V – aceitação de manifestações espontâneas
    de outros Espíritos.


    Nestas sessões far-seiam as seguintes perguntas fundamentais, além de outras,
    decorrentes dos mesmos diálogos:


    1 – Quem está com a razão: Kardec negando ou Roustaing afirmando que Jesus Cristo
    não foi homem?

    2 – É legítima a mensagem atribuída a Roustaing, dado no Rio de Janeiro e publicada
    na obra `Revelações de Além Túmulo`, psicografada pelo médium `Sr Carlos Gomes
    dos Santos`?

    3 – É exato que o Espírito de `Alan Kardec` tenha dado apoio à tese do corpo fluídico
    de Jesus?

    4 – É autêntica a mensagem atribuída a Kardec e publicada pela `Sociedade Acadêmica
    Deus, Cristo e Caridade` na introdução à primeira edição brasileira de `Gênese,
    Os Milagres e As Predições Segundo o Espiritismo`, no ano de 1882?

    5 – Como explicar a contradição entre as declarações de apoio de Kardec à tese
    roustainguista e a mensagem referida na pergunta anterior?

    6 – Porque, desde 1882 até hoje não teria sido possível organizar uma obra de
    desenvolvimento, ampliação e mesmo de correção da obra de Kardec, como seria admissível
    nos termos da citada mensagem?

    7 – São verdadeiras ou falsas as afirmações de João Evangelista em duas epístolas
    contidas na Bíblia, caracterizando como Espírito do Anticristo aquele que nega
    que Jesus Cristo viveu e sofreu na carne?


    Se a `F. E. B.` está com a verdade é magnífica oportunidade de esclarecer seus
    opositores, que também são filhos de Deus. Se não o aceitar é que teme a verdade.
    Restará então aos kardecistas continuar proclamando a verdade com a `F.E.B.`,
    sem a `F.E.B.`, ou apesar da `F.E.B.`.


    ### Indicações de Leitura que fazem análise das Obras de Roustaing.


    - `Kardec`, A. *Revista Espírita*, 1866, editora Edicel.

    - 1861, editora Edicel.

    - 1867, editora Edicel.

    - `Costa`, Luciano. *Kardec e Não Roustaing.*

