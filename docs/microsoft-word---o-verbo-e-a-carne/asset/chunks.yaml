    Os leitores interessados no assunto não precisam perder muito tempo com a consulta
    aos quatro volumes da obra indigesta. É difícil agüentar essa leitura maçuda.
    Basta examinarem a teoria roustainguista da reencarnação no primeiro volume de
    "Os Quatro Evangelhos". É no exame dos capítulos de Mateus e Lucas sobre a genealogia
    de Jesus (vejam só!) que aparece, em meio do volume, páginas 300 e pouco da edição
    de 1942, a pergunta n.° 58 sobre as `substâncias` `humanas.` O livro foi tão mal
    feito que Guillon Ribeiro teve de reorganizá-lo para a edição brasileira. E assim
    mesmo não é fácil indicar os os tópicos a serem examinados, em virtude da balbúrdia
    do texto. Experimente o leitor fazer uma citação dessas.


    A referida pergunta 58, por sua vez, bastaria para nos mostrar o estado mental
    do pobre Roustaing, que depois de uma doença grave, ao sair do hospital, foi logo
    envolvido pela falange mistificadora. Vamos dar na íntegra a pergunta: `22 Denis,
    L. O problema do Ser do Destino e da Dor, cap. IX.`


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    23


    "Haveis dito que os espíritos destinados a ser humanizados, por terem errado muito
    gravemente, são lançados nas terras primitivas, virgens ainda do aparecimento
    do homem, do reino humano, mas preparadas e prontas para essas encarnações, e
    que aí encarnam em substâncias humanas, às quais não se pode dar propriamente
    o nome de corpos, nas condições de macho e fêmea aptos para a procriação e para
    a reprodução. Quais as condições dessas substâncias humanas?"


    Os espíritos reveladores haviam dito que a evolução espiritual se processa em
    duas linhas: á dos espíritos que no início se desviaram para o mal e portanto
    ficam sujeitos às reencarnações, e a dos espíritos que nunca se afastaram do bem
    e por isso evoluem através de mundos etéreos. Mas mesmo esses espíritos bons estão
    sujeitos a cometer um destes três pecados: o ciúme, a inveja e o ateísmo. Assim,
    quando um desses espíritos bons comete um desses pecados é obrigado a encarnar
    em `substâncias humanas.`


    Vejamos os trechos principais da resposta dos espíritos reveladores ao pobre Roustaing
    sobre as `substâncias humanas:`


    "São corpos rudimentares. O homem aporta a essas terras no estado de esboço, como
    tudo o que se forma nas terras primitivas. O macho e a fêmea não são nem desenvolvidos,
    nem fortes, nem inteligentes. – Mal se arrastando nos seus grosseiros invólucros,
    vivem, como os animais, do que encontram no solo e lhes conveniente. As árvores
    e o terreno produzem abundantemente para a nutrição de cada espécie. Os animais
    carnívoros não os caçam. A providência do Senhor vela pela conservação de todos.
    Seus únicos instintos são os da alimentação e os da reprodução".


    Notemos a absoluta incapacidade de Roustaing para compreender o que havia lido
    em Kardec sobre o desenvolvimento do princípio inteligente a partir dos reinos
    inferiores da Criação. Os espíritos reveladores, sempre matiros, aproveitamse
    disso do precário estado mental e psíquico do advogado convalcente para elaborarem
    a mais ridícula teoria da reencarnação. E rematam essas explicações deiras com
    esta afirmação: "As gerações sucedem desenvolvendo-se. As formas se vão alongando
    e tornando aptas a prover às necessidades que se multiplicam. Mas não é nossa
    tarefa traçar aqui a história da criação. O espírito vai habitar corpos formados
    de substâncias contidas nas matérias constitutivas do planeta. Esses corpos não
    são aparelhados como os nossos, porém os elementos que compõem se acham dispostos
    por maneira que o espírito possa usar e aperfeiçoar. Não poderíamos compara-los
    melhor do que criptógamos. Podeis fazer ideia da criação estudando essas larvas
    que vegetam em certas plantas, particularmente nos lírios. São uma massa quase
    inerte, de matérias moles e pouco agregadas, que rasteja ou anda, tendo os membros,
    por assim dizer, em estado lat".


    Roustaing copia e desfigura Kardec acrescentando aos seus ensinos os maiores absurdos.
    Note-se que essas criaturas estranhas, em forma de larvas e lesmas, são encarnações
    de espíritos humanos que haviam atingido alta evolução sem passar pela encarnação
    humana. Depois de desenvolverem a razão em alto grau e de haverem colaborado com
    Deus nos processos da Criação, chegando mesmo a orientar criaturas humanas, voltam
    à condição de criptógamos carnudos.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    24


    Mas porque falam os reveladores em substâncias humanas? Porque não simplificam
    as coisas, dizendo simplesmente que esses espíritos encarnarse em lesmas? Porque
    é preciso enganar os espiritistas que aceitam Kardec e sabem que a evolução espiritual
    é irreversível, que o espírito humanizado não pode regredir ao plano animal. É
    o mesmo processo de sofisma, de tapeação, usado na questão do corpo aparente de
    Jesus, quando falam em `encarnação fluídica` para escaparem ao anátema de João
    contra os que dizem que o Cristo veio em carne. As substâncias humanas dos criptógamos
    são uma invenção absurda e tola. E tanta gente a defender essas bobagens dentro
    Espiritismo!


    Mas o que são criptógamos? Por que esse nome estranho? Tudo tem a sua razão na
    máquina infernal do ilogismo roustainguista, embora seja sempre a anti-razão que
    entra em cena. Apreciemos o assunto à luz da razão para tentar esclarecé-lo.


    A palavra criptógamo é empregada cientificamente para designar certas plantas
    cujos órgãos reprodutores não aparecem, são ocultos. A origem do termo é grega:
    `kryptos`, que quer dizer oculto, e `gamos` que quer dizer casamento, união. Assim,
    criptógamo é um exemplar de espécie vegetal que tem os seus órgãos reprodutores
    escondidos. Os "reveladores" roustainguistas acrescentaram a palavra `carnudo`
    para adaptar a designação ao reino animal. Assim, criptógamo carnudo seria uma
    espécie animal (mas não animal porque formado de substâncias humanas) em que se
    encarnam espíritos humanos que regrediram ao plano vegetal e animal.


    Atenção para isto: quando dizemos que eles regrediram ao plano vegetal e animal
    não estamos forçando a interpretação. Cientificamente os animais semelhantes a
    plantas estão localizados na linha divisória dos reinos vegetal e animal, são
    desenvolvimentos de plantas. Se existissem esses criptógamos carnudos a Ciência
    os catalogaria como formas de passagem dos criptógamos vegetais para o reino animal.


    Temos assim a teoria da Metempsicose, tão seguramente refutada pela lógica de
    Kardec, devolvida ao meio espírita pelo ilogismo roustainguista. Bastaria esse
    triste episódio, colhido no caldeirão diabólico dos absurdos de "Os Quatro Evangelhos”
    para nos provar, sem a menor sombra de dúvida, que essa obra é de autoria das
    trevas e que a sua finalidade é confundir os espiritistas pouco habituados a passar
    as coisas pelo crivo da razão. Mais do que isso, porém, o objetivo evidente é
    o de ridicularizar o Espiritismo para dele afastar as pessoas de bom senso.


    XI


    # OS DEZ MANDAMENTOS


    A apoteose da obra de Roustaing não é a Ressurreição mas o Decálogo.


    O ciclo obsessivo dos retornos periódicos tinha de fechar-se no retorno bíblico.
    "Os Quatro Evangelhos" são uma constante mistura de comentários que vão e vêm,
    como num redemoinho, entre o Velho e o Novo Testamento. É essa também uma técnica
    de fascinação. O leitor se sente aturdido, mas atraído para o torvelinho. Quanto
    mais se aturde, mais se afunda no báratro das idéias em conflito, das explicações
    mil vezes repetidas. Há mesmo um `leit-motiv` exasperante, no estilo do Bolero
    de.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    25

