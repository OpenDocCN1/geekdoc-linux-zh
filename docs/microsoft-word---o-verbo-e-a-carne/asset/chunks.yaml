    isso, não lhe cairão nem um til nem um jota: finalmente, que o roustainguismo
    é um equívoco, que precisa ser destruído quanto antes 57.


    57 NOTA - A posição bíblica do autor parece-nos extremada. Mas a sua posição kardeciana
    é bem clara e lógica, apoiada nos textos acima transcritos. A Bíblia – o Velho
    Testamento – mesmo acrescida pelo Novo Testamento, não seria suficiente para negar
    validade à absurda teoria roustainguista, pois o seu texto tem servido para as
    interpretações mais contraditórias. A explicação de Kardec e o absoluto silêncio
    dos Espíritos Superiores – nestes dois mil anos –


    sobre a velha hipótese do corpo fluídico, parecem-nos mais importantes. Por outro
    lado, a lógica da explicação kardeciana é decisiva. Um Jesus de mentirasó pode
    ser admitido pela antilógica do anticristo. (H.P.).


