    ## XII


    ### 鲁斯坦因主义的生存意义


    鲁斯坦因主义（Roustainguismo）的历史过程过于简单和浅薄。来自波尔多的律师 Jean Baptista Roustaing 在从大病中痊愈后，阅读了《灵之书》和《灵媒书》，并对从灵体那里获得某些启示的可能性深感震撼。正如我们在这项工作的开头看到的，正是
    Roustaing 本人在其作品的序言中告诉我们的。


    他认为自己有能力接收关于基督本质以及他在地球生活中阴暗事实的启发性信息，于是热诚地向上帝祈祷——在 1861 年 6 月 24 日前夕——允许他显现施洗约翰（其名字的圣人）的灵、他父亲的灵以及他守护灵的灵。


    Roustaing 甚至在序言中还给了我们这个宝贵的信息：“这些显现是自发的，令灵媒感到惊讶，因为我并没有告诉过他我的祈祷。这对我来说构成了一个巨大的快乐源泉，向我证明了我的恳求得到了听取，上帝接纳我成为他的仆人”。


    随后 Roustaing 告知：“使徒彼得的灵在 6 月 30 日显现了，这对我和灵媒来说都是意料之外的。我通过灵媒被预知了何时可以以及应该发表这些具有高度价值的交流”。


    每一个心灵主义学习者都知道，这些自大的感唤会带来神学伪造。Kardec 曾写道：“呼唤一块岩石，它就会回答你。总有一群灵体准备好以任何借口发言” 35。那些所请求的交流所带给
    Roustaing 的巨大喜悦，显示了他作为一个初学者的天真。在接受了这些交流并接受了上帝仆人的天任后，Roustaing 将自己交给了伪造者的手。


    将这种轻率与 Kardec 在调查现象和接收首批灵性信息时的谨慎进行对比，一眼就能看出两者之间的区别。Kardec 是谦虚与谨慎；Roustaing 是自大与仓促。


    Kardec 观察、研究、权衡、分析，并投身于深度的探究和详尽的实验。Roustaing 则是充满激情并狂热地投入工作。他没有制定工作计划，没有思考他将面对的问题，没有对交流的灵体进行任何道德和精神层面的身份鉴定。他发现了奇迹，并在陶醉中迷失了自我。


    因此，鲁斯坦因主义的起源是对奇迹的渴望。以至于，当理智且谨慎的 Kardec 拒绝谈论宗教，将心灵主义归类为科学，并将其作为反抗唯物主义的武器提供给各宗教界时，Roustaing
    立即宣称自己是启示者，是上帝手中“用的工具”，旨在通过实现大师的承诺以及最终实现上帝之国，来促进“信仰的统一和人类的兄弟情”。


    让他自己来告诉我们他的精神状态，因为没有人比他更能以不可反驳的方式解释这一点：


    35 Kardec, 《灵媒书》，item 283.


    道与肉体 – 对鲁斯坦因主义的 2 项分析 ______________________________________________


    30


    “随着启示的推进，我的灵魂在发现所有这些真理时变得越来越被惊所困住，我说——噢我的上帝，请支配您的仆人！我是您的，我属于您；我的心、我的时间、我的理性，我将奉献给您的服务；噢，至高的主宰，如果尽管我软弱，我能在您的手中成为一个有用的工具，赢得您的爱、尊重和受造物的心，我将是幸福的。”


    如果说 Kardec 的精神状态是观察，那么 Roustaing 的精神状态就是着迷。Kardec 思考、分析、实验。但 Roustaing 却屈服于灵体，放弃了自己的理性。他想要的无非于此：一个能为造物主赢得受造物爱和尊重的工具，仿佛上帝也需要人类不可靠的帮助来赢得爱和尊重。人们可以辩称他是在对上帝说话，但傲慢的祈祷不是被上帝听取的，而是被执念灵听取的。并不是上帝听见并回应了他。


    但让我们列一个出现的时间顺序时间表：


    1861 年 1 月 – Roustaing 从大病中康复，谈到接收启示的可能性。阅读《灵之书》和《灵媒书》，并将其视为反抗唯物主义的武器。


    1861 年 6 月 – 祈求施洗约翰灵的显现。


    1861 年 6 月 24 日 – 接收施洗约翰灵的显现。


    1861 年 6 月 30 日 – 接收使徒彼得的交流。


    1861 年 12 月 – 接受了 Madame Collignon 的建议。八天后去感谢她的接待。离开时，灵媒感受到了写作的冲动。Roustaing 写道：这是马太的消息；马可、路加、约翰在使徒的协助下，是启示。


    1865 年 5 月 – Roustaing 写道：“……所有材料，无论是福音还是诫律都已准备就。向人类告知、出版启示著作的通知，是我自发地通过灵媒传达的，术语准确。”


    （接收作品的过程持续了三个半年。总之，鲁斯坦因主义只用了四年半才呈现出完整的文本。Kardec 和 Roustaing 之间没有关系。）


