    ## O VERBO E CARNE


    No seu leito de libertação, pouco antes de abandonar o casulo do corpo e voar
    para o Além, Júlio Abreu Filho conversava comigo e Jorge Rizzini sobre questões
    doutrinárias. Surgindo o problema do Roustainguismo, lembrei o seu trabalho a
    respeito e a necessidade de reeditá-lo. Júlio entusiasmou-se com a idéia e incumbiu-me
    de tratar do assunto. Estava presente uma de suas filhas, a Sra. Ceres Nogueira
    Abreu Sacchetta, esposa de meu amigo e colega de imprensa Hermínio Sacchetta.


    Falei a Júlio da necessidade de uma revisão do texto de acréscimo de notas explicativas.
    Ele me autorizou a fazer o que fosse necessário, pois compreendia a exigência
    de atualização. Mas ao reler o trabalho de Júlio vi que era necessário fazer um
    pouco mais. Esse trabalho é polêmico e seguiu os rumos determinados pelas circunstâncias.
    Embora muito valioso, particularmente pelos dados que informam, devia ser amparado
    por um esforço de análise metódica.


    Pensei numa introdução, mas o assunto exigia mais do que pensava. Fui levado a
    escrever um pequeno livro, que é uma introdução analítica, ao livro de Júlio.
    Assim, achei melhor que ambos figurassem num volume único, sob um título geral.


    A escolha do título `O Verbo e a Carne` foi determinada pelo profundo significado
    do versículo 14, capítulo I do Evangelho de João: `O Verbo se fez carne e habitou
    entre nós, cheio de graça e de verdade, e vimos a sua glória, glória como unigênito
    do Pai.` Na polêmica entre kardecistas e roustainguistas esse versículo é pacífico,
    pois o Roustainguismo também aceita a encarnação do Verbo, embora condicionando-a
    ao dogma da encarnação fluídica. Assim, o título evangelico não implicava nenhuma
    afirmação a priori, nenhuma antecipação de conclusões.


    Por outro lado, a relação entre o Verbo e a Carne envolve questões fundamentais
    do Cristianismo, amplamente desenvolvidas pelo Espiritismo. Este volume não trata
    especificamente dessas questões, mas são elas, sem dúvida, o ponto central dos
    dois trabalhos, o meu e de Júlio. Nenhum titulo os unificaria melhor. Muita gente
    pensa que a questão do Roustainguismo deve ser posta de lado. Essa é uma atitude
    confortável, mas não corresponde às exigências da boa compreensão doutrinária.
    Espero que o nosso trabalho – o meu e de Júlio Abreu Filho – concorra para melhor
    entendimento do problema.


    São Paulo, 21 de novembro de 1972.


    José Herculano Pires

