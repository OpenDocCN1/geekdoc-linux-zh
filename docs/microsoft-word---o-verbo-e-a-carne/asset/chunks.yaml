    Por isso Guerra Junqueiro o utiliza para a transmissão de seus poemas e pode servir-se
    dele para desfazer o equívoco de "Os Funerais da Santa Sé". E o faz com um equilíbrio
    inegável, ressalvando as condições espirituais da médium `América Delgado` e evitando
    agressões pessoais a Roustaing, que considera uma vítima. Sua crítica é reservada
    apenas para a obra e para os mistificadores que a ditaram.


    Esse equilíbrio restabelece aos nossos olhos o Guerra Junqueiro que o poema de
    quarenta anos atrás parecia desfigurar. Temos de novo o poeta impetuoso, vigoroso
    nas expressões mas sereno no julgamento. A síntese de razão e fé, característica
    do Espiritismo, e da qual ele foi precursor, reaparece em sua perfeita integridade
    junqueirana.


    ## CORPO DE JESUS


    A revista "O Reformador", órgão oficial da `FEB`, publicou em seu número de março
    deste ano, 1972, como uma das peças de defesa do `Roustainguismo`, o longo trecho
    de "Os Funerais da Santa Sé" que vamos transcrever. É realmente uma peça digna
    de estudo, pois nela temos a demonstração da complexidade do processo de recepção
    mediúnica. O estilo de Guerra Junqueiro se reflete nele, mas a técnica do poeta
    é falha, contrastando com o seu rigor na prática do alexandrino,


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    36


    o verso mais difícil da poética antiga, e no qual Junqueiro se revelou verdadeiro
    virtuoso. Nenhum outro poeta empregou o alexandrino em nossa língua com tanta
    perícia e tamanha constância. Mas no trecho abaixo Junqueiro o utiliza como um
    principiante, um desconhecedor das suas regras.


    Além disso temos de considerar o problema de conteúdo. No começo o poeta critica
    os que "...querem esvoaçar além dos infinitos – para saber o que era o corpo de
    `Jesus`. Ao mesmo tempo ridiculariza "alguns doutores que a `Ciência` já perscrutam".
    Depois menospreza o laboratório para sustentar a tese agnóstica no tocante "aos
    problemas de `Deus`". Começa aí a regressão psíquica de Junqueiro, que volta à
    fé dogmática e cega do clero que sempre combateu, deixando mesmo entender que
    `Jesus` era `Deus`. Nada dessa confusão condiz com o pensamento viril de Guerra
    Junqueiro em vida ou dele após a morte nos poemas do "Parnaso". E notese que "Os
    Funerais da Santa Sé" apareciam precisamente em 1932, juntamente com o "Parnaso",
    numa evidente manobra de reação.


    A seguir, o Junqueiro retrógrado se utiliza do chavão roustainguista da `dor moral:`


    "O martírio real é o que retalha a alma", como se a dor moral pudesse justificar
    a farsa imoral de uma tragédia grega encenada por entidades espirituais para enganar
    os homens. Ninguém ignora que o sofrimento moral é superior ao físico. Por isso
    todos compreendem o martírio do palhaço que faz rir a multidão enquanto o coração
    lhe sangra no peito. Mas ninguém de bom senso pode admitir que uma criatura divina
    fizesse o contrario do palhaço, exibindo um sofrimento falso para sangrar o coração
    do público. E a inteligência lúcida de Guerra Junqueira não percebeu esse contra-senso
    nem encontrou maneira mais lógica de sair da enrascada. Teve mesmo de servir-se
    da surrada e absurda explicação de Roustaing, sempre repetida pelos que a admitem.


    Como se isso não bastasse vemos o velho Junqueiro arcado ao peso fatal dos anos
    – como se ainda estivesse na carne perecível – endossar a mais tola de todas as
    teses roustainguistas: "Se o `Cristo` foi humano, que é da virgindade daquela
    que recebe, ainda imaculada, o verbo que ilumina..." Ou da virgindade física misturado
    a um resíduo mitológico é aprovado ingenuamente pelo poeta de "A Velhice do Padre
    Eterno". Esse velho esclerótico fala da Imaculada como se estivesse num convento
    da Idade Média. E como isso não bastasse, esquecido do magní prefácio a "Os Simples",
    em que definiu em vida e espiriticamente os princípios lógicos da sua fé, acrescenta:
    "Nós vemos em `Jesus` o Sobrenatural!"


    A esses golpes de oratória sacra o poeta ajunta a seguir algumas estrofes contra
    a Igreja, o `Cristo` de barro e de madeira "talhado ainda à moda antiga". E vem
    então a contradição flagrante do apelo: "Livres pensadores, uni-vos, batalhai,
    cumpri vosso dever!" Que livres pensadores serão esses que carregam a pesada canga
    dos dogmas mais absurdos? O velhohote parece desmiolado. Perdeu todo o senso que
    o caracterava. E grita como um alucinado: "...pois do céu é que baixa esta revelação".
    Mas que revelação? A de um `Jesus` etéreo a engambelar os homens com seu corpo
    falso e seu fingido martírio? É isso que Guerra Junqueiro aceita e defende em
    nome da nova era?


    Forma e conteúdo revelam nesses versos a mistificação herética os evangelistas
    e os apóstolos condenaram. Na forma temos a imperícia poética dos mistificadores.
    No conteúdo as contradições e os resíduos do passado mitológico da humanidade.
    Nada disso pertence ao pensamento esclarecido de Guerra Junqueiro.


    A médium `América Delgado`, como `Collignon`, `Rizzini`,

    Guerra Junqueiro denuncia, nos alexandrinos, a falta de que se sente.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    37


    ele jamais faria. Segundo a poética, o alexandrino é um verso de doze sílabas.


