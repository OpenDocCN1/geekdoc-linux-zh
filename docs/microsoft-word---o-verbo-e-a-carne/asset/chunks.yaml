    a que pertence. O resultado é vermos o movimento espírita dividido em áreas kardecistas
    e áreas roustainguistas. O grupo roustainguista da Federação Espírita Brasileira,
    tradicional e apoiado em dispositivos estatutários da "casa mater", sustenta o
    princípio de que Roustaing é o complemento necessário de Kardec. É "a revelação
    da revelação".


    O prestigio da FEB e a sua insistência na divulgação e sustentação do Roustainguismo
    dá certo vigor a este, particularmente no centro e norte do país.


    Mas, ao mesmo tempo, a repulsa a Roustaing é maciça em São Paulo, cuja tradição
    kardecista se, estende a todo o sul, com exceção de um grupo numeroso em território
    gaúcho, compensado, no outro extremo, pela firme posição kardecista do Estado
    do Rio. Entretanto, mesmo na Guanabara, em toda a região fluminense e no norte
    e nordeste não se pode falar de um maciço roustainguimo * , pois há numerosos
    grupos de vigorosas instituições que repelem a "revelação da revelação".


    Vemos assim que o problema é grave e exige um esforço de


    esclarecimento. Durante certo tempo o slogan "ò corpo de Jesus não interessa,
    o que interessa é o seu espírito" conseguiu refrear as divergências. Por outro
    lado o chamado "pacto áureo", lavrado oficialmente entre a FEB e a USE paulista
