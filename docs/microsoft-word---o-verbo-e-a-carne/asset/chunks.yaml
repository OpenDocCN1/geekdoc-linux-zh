    ## 81

    No fundo o roustainguismo não passa de uma deformidade, explicável pela falta
    de estudo rigoroso da doutrina, pela permanência do orgulho e da vaidade, que
    levam o indivíduo a confundir suas próprias idéias com a verdade e seu autoritarismo
    com a lei de Deus.


    Se os roustainguistas fossem lógicos, ante a divisão que o Sr. Gomes Braga estabelece
    na tese em apreço, só lhes restava uma saída: a porta da rua, e a entrega da Federação
    Espírita Brasileira, isto é, seu patrimônio moral e material aos legítimos donos,
    esses crentes sem ilustração e sem talento, mas que nunca venderam gato por lebre,
    nunca falsearam a verdade, e, se pouco conheciam a Bíblia, sabiam, entretanto,
    que toda a lei e os profetas estavam resumidos em "amar a Deus sobre todas as
    coisas e ao próximo como a si mesmo"; sabiam que não bastava não fazer aos outros
    aquilo que não queriam que lhes fosse feito, mas, principalmente, que deviam exercer
    a caridade ativa, fazendo aos outros como quereriam que os outros lhes fizessem.


    Por todas essas coisas a F. E. B. se deve sentir sem força moral para ser aquilo
    que diz o seu nome: federação espírita. Podem os seus generais fazer o que fizerem:
    não passarão, com as suas filiais, de pequenos quistos do erro e da treva, uma
    espécie de câncer a sacrificar a vida da verdadeira coletividade espírita, a travar-lhe
    os movimentos e as realizações em plano social.


    Só o esquecimento, para não dizer a ignorância, da obra de Kardec, no seu tríplice
    aspecto – científico, filosófico e religioso – poderia levar alguém a querer aplicá-la
    exclusivamente aos crentes. Isto seria paradoxal.


    As ciências experimentais permitiram, nestes últimos tempos, um grande avanço
    nos conhecimentos gerais da humanidade. Mas o trabalho de Kardec já foi feito
    com critério científico, sob bases experimentais, levando a generalizações e,
    pois, a uma filosofia, enquanto que o de Roustaing não passou de uma grossa mistificação,
    dada por uma falange de espíritos inverazes, conquanto de alguma ilustração. Isto
    foi feito através de um médium único – o que contraria os métodos científicos
    aplicados aos trabalhos experimentais ou de observação. Logo de saída teve a repulsa
    do médium: a Sra. Collignon que não aceitava as mensagens que recebia para o Sr.
    Roustaing. Isto prova que o espírito daquela senhora não se afinava com os embusteiros;
    que a sua mediunidade estava desenvolvida a ponto de saber distinguir as entidades
    comunicantes; que, apesar desse misterioso domínio que sobre ela exerceram `Roustaing
    e a falange da mentira` (o que nos leva a pensar na variedade de tipos de provas
    a que um Espírito encarnado pode ser submetido), o seu espírito reagia, no propósito
    de evitar que o embuste pudesse vir a fanatizar criaturas de boa vontade e empolgá-las
    ao ponto em que se acham empolgadas, seduzidas, incapazes de raciocínios estritamente
    lógicos, como acontece com a plêiade dos nossos confrades da F. E. B.


    Este trabalho de Roustaing, cheio de incongruências, em desacordo com as mais
    autorizadas escolas de estudos bíblicos, quer do ponto de vista filosófico, quer
    teológico (ou filológico 79), nunca teve a menor repercussão nos grandes meios
    espíritas, como por exemplo, na Inglaterra e nos Estados Unidos, a despeito do
    Sr. Roustaing haver feito uma edição de sua obra, tristemente célebre, em língua
    inglesa, graças a sua fortuna pessoal e não aos reclamos do público e ao empolgamento
    de suas pseudo-verdades.


    *****


    79 Estudo da língua em toda a sua amplitude, e dos documentos escritos que servem
    para documentá-la.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    ## 82

    Passemos à última tese.


    Diz o Sr. Gomes Braga que "está sobejamente confirmada a natureza excepcional
    do corpo de Jesus, em numerosas comunicações, e com isso consolidada a obra de
    Kardec, e confirmados o Cristianismo e o Judaísmo".


    Vamos devagar.


    Se tomarmos isoladamente a primeira parte da tese – "está sobejamente confirmada
    a natureza excepcional do corpo de Jesus", e - a analisarmos à luz da doutrina
    dos espíritos, ditada em vários centros de diversos países, em datas diferentes
    e através de médiuns que se não conheciam; por outras palavras, se a explicarmos
    conforme mensagens medianímicas das quais se excluem a mistificação, a sugestão
    mental e o animismo, isto é, se sintetizarmos a teoria kardeciana sobre o corpo
    de Jesus, chegaremos ao seguinte: Jesus nasceu como qualquer criatura humana;
    seu corpo era constituído de matéria semelhante à dos corpos.


    Depois da ressurreição já diferente. Aí, sim: seu corpo era fluídico; antes não.


    Esta explicação confirma tudo quanto se acha no Velho Testamento em relação à
    vinda do Messias, isto é, no seio de uma família de David. Os Judeus seus contemporâneos
    o sabiam e o confundiram com João Batista; depois da negativa deste, interrogaram
    o próprio Mestre, cujas palavras veladas firmaram as profecias. A explicação também
    confirma tudo quanto se lê no Novo Testamento, desde os Evangelhos até os Atos
    e algumas Epístolas.


    Se, pois, os roustainguistas lessem a Bíblia atentamente e sem espírito preconbido,
    converter-seiam à Verdade. A tese do Sr. Gomes Braga, já discutida no último artigo,
    de que "as três Revelações – Velho Testamento, Novo Testamento e Espiritismo –
    formam um todo inseparável, um conjunto único em sua essência e não se pode atacar
    uma parte sem abalar todo o edifício” é, pois, perfeitamente certa, menos no final,
    quando a "obra de Roustaing é uma parte desse conjunto”.


    E por quê?


    Porque Roustaing, levado pelos tais espíritos, atacou a parte daquele edifício,
    substituindo as verdades ali contidas por uma série de mentiras, entremeadas de
    verdades, para as mascarar. Sua obra está em contradição com o Velho e o Novo
    Testamento, com a boa lógica e com a concordância universal dos ensinos dados
    pelos Espíritos.


    Este duplo aspecto do corpo de Jesus, antes e depois da ressurreição, é aceito
    pela Igreja Anglicana, a qual, representa a mais respeitável escola de teologia
    protestante em nossos dias. Não há muito ela declarou aceitar a manifestação dos
    espíritos. Pois bem: antes disso e relativamente ao corpo de Jesus, seu ponto
    de vista estava expresso no trecho que damos a seguir.


    Na `Read Letter Edition` da `Authorized King James Version`, a que nos referimos
    no primeiro artigo, existe em apenso, entre outras coisas notáveis, um


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


