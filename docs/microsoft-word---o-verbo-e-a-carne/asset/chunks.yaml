    58


    Nesses textos, onde há referências ao Messias, ele será um homem, um profeta,
    um rebento da Casa de David. Tudo isso se cumpriu no tempo certo, no lugar predito,
    nas condições previstas pelos grandes videntes. Jesus Cristo ensina a sua doutrina
    e seus apóstolos è discípulos a transmitem. São os escritos que constituem a Segunda
    Revelação.


    De como se copiavam e se transmitiam esses livros sagrados diremos oportunamente.
    Basta, por hoje, dizer que havia regras rigorosíssimas para se lhes fazerem cópias,
    o que eqüivale quase a um trabalho impresso; conhecem-se o número de capítulos,
    de versículos, de palavras; sabe-se qual o capítulo mediano, qual a palavra central.
    Com um tal luxo de minúcias, difícil é fazer mutilações enxertos ou interpolações.
    Esses escritos estão representando de dezenove a trinta e dois séculos de tradições,
    de resistência, de força moral, de Valor e respeito ao que é espiritual; suportaram
    tremendas vicissitudes, sucessivas destruições, cativeiro e perseguições para
    resistir a tudo e se manterem em tal harmonia que hoje, quanto mais avança a Ciência,
    mais se confirma quanto neles está escrito 51.


    Desses escritos há atualmente quatro grandes códigos que constituem preciosidades
    de um valor incalculável; são eles: o Sináitico, na Biblioteca de Moscou; o Vaticânico,
    em Roma; o Alexandrino, no Museu de Londres e o de Efrem, em Paris. Deles falaremos
    oportunamente com alguns detalhes. Por hoje limitamo-nos a dizer que o primeiro
    tira seu nome de um mosteiro de padres ortodoxos gregos, no **Monte Sinai –**
    o célebre **Mosteiro de Santa Catarina:** tem uma altíssima antigüidade e foi
    descoberto em 1844 por Tischendorf, professor da Universidade de Lípsia; o segundo
    remonta ao quarto século de nossa era e já em 1475 era citado no catálogo da **Biblioteca
    do Vaticano;** o terceiro, que se acha no **Museu de Londres,** procede da África
    e é tido como tendo pertencido a Santa Tecla, que foi abadessa de um convento
    em Alexandria; sua primeira referência é do ano de 1098 quando foi apresentado
    ao patriarca de Alexandria, de onde lhe vem o nome; por fim o último, também chamado
    **Codex Regius Parisienses,** encontra-se na **Biblioteca de Paris;** o nome de
    **Código de Efrem** se deve ao fato de um escriba o haver parcialmente estragado,
    para o utilizar como palimpsesto, aí copiando a obra de um sírio, Pai da Igreja,
    chamado **Efrem** ou **Efraim.**


    Todos são concordes; todo o mundo os respeita – menos a Igreja Católica e com
    ela os Espíritos que vieram inspirar o Sr. Roustaing 52.


    Convenhamos que a maneira porque o fizeram está longe de **"confirmar as** **revelações
    anteriores".** Ao contrário, a tese de Roustaing opõe-se a várias passagens que
    se acham nesses textos, os quais, mesmo para os incrédulos, devem ser sagrados.
    Estes não podem ser assim, levianamente, postos em dúvida ou apontados como inverídicos.
    Para tanto fora mister um estudo comparativo, participação e foram importantes
    de uma forma ou de outra. Os menores são: Ageu, Amós, Habacuque, Joel, Jonas,
    Malaquias, Miquéias, Naum, Obadias, Oséias, Sofonias e Zacarias. Os maiores ou
    principais são: Daniel, Ezequiel, Isaias e Jeremias.


    Temos ainda uma outra divisão que podemos chamá-la de hagiógrafos ou *ketuvim*
    (11 livros), contendo dentro da sua estrutura *o Meguilá* (rolo) que compreende
    cinco livros: Cânticos dos Cânticos, Eclesiastes, Ester, Lamentações e Rute e
    os últimos: Crônicas, Esdras, Jó, Neemias, Provérbio e Salmos. Em alguns escritores
    o livro de Daniel é posto entre os profetas maiores, outras vezes encontramos
    este mesmo livro posto nos hagiógrafos. Apesar de não ser a práxis, na dúvida
    optamos em deixá-lo como o “quarto” profeta maior, pela influência que esse teve
    em todo o exílio e na literatura judaica. Se errarmos perante o Eterno – *que
    seu nome seja louvado* – nos perdoe a falha humana.'
