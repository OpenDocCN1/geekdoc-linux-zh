  trans: '

    Este `critério`, que constitui uma das partes fundamentais do método kardeciano
    de 16, jamais beneficiou a obra de Roustaing. O que nela se encontra, naturalmente
    excluída naturalmente a cópia geral da obra de Kardec, são simples opiniões pessoais
    dos espíritos reveladores, que se enfeitaram, como dizia Kardec, com os nomes
    veneráveis dos evangelistas, dos apóstolos e de Moisés. Esse adorno, por si só,
    não oferece nenhuma garantia de legitimidade. Por outro lado, a vulgaridade da
    linguagem e das interpretações, e mais ainda o ridículo das passagens que já analisamos
    – e de muitas outras que qualquer leitor de bom senso encontrará em abundância
    nos textos – provam de sobra contra a pretensão de revelação da obra.


    A ingenuidade de Roustaing, que foi colhida em sua vaidade pelos espíritos enganadores,
    revela-se na própria publicação de um livro copiado da obra de Kardec, na época
    tão em evidência na França e no Mundo. Uma pessoa de sua posição, dotada de um
    pouco mais de bom senso, não teria a coragem de lançar esse plágio evidente, que
    se denuncia em cada passagem do texto, disfarçado apenas com acréscimos de imaginação,
    os quais não passam, também, de repetições cansativas de hipóteses combatidas
    no Cristianismo desde a era apostólica e condenadas nasístolas do Novo Testamento.


    Essa renovação do Docetismo 17, heresia do século II da era cristã, equivale a
    um retrocesso histórico. A revelação da revelação regride nada menos que dezoito
    séculos. E não obstante pretende provar que corresponde à era moderna, estando
    de perfeito acordo com as conquistas científicas. Roustaing refuta a acusação
    de docetismo que Kardec faz à sua obra, alegando que os Docetas não conheciam
    a mecânica da gravidez aparente e do parto aparente. Entende que a sua 16 “Uma
    só garantia séria existe para o ensino dos Espíritos: a concordância que haja
    entre as revelações que eles façam espontaneamente, servindo-se de grande número
    de médiuns estranhos uns aos outros e em vários lugares. Se, portanto, agradar
    a um Espírito formular um sistema excêntrico, baseado unicamente nas suas ideias
    e com exclusão da verdade, pode-se ter a certeza de que tal sistema se manterá
    circunscrito e cairá, diante das instruções dadas de todas as partes, conforme
    os múltiplos”. (ESE; Introdução).


    17 **Docetas** – do grego `dokein: aparecer`. Seita derivada do gnosticismo, tendo
    como representantes principais Doceteu e Saturnino, negavam a realidade carnal
    de Jesus e, por isso, não aceitavam seu nascimento, paixão e ressurreição. Consideravam
