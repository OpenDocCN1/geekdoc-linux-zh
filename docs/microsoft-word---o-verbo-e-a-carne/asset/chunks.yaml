- fmt: '

    O Espiritismo é uma ciência que trata da natureza, origem e destino dos espíritos,
    bem como de suas relações com o mundo corporal".


    Mais adiante, à página 74, reafirma:


    "O Espiritismo tem por fim combater a incredulidade e suas funestas conseqüências,
    fornecendo provas patentes da existência da alma e da vida futura; ele se dirige,
    pois, àqueles que em nada crê ou que de tudo duvidam, e o número desses não é
    pequeno, como muito bem sabeis; os que têm fé religiosa e a quem esta fé satisfaz,
    dele não têm necessidade".


    "Se hoje há luta entre a Igreja e o Espiritismo, nós temos consciência de não
    tê-la provocado".


    E à página 84 assim aborda a questão dos dogmas:


    "O Espiritismo é, antes de tudo, uma ciência, e não cuida de questões dogmáticas.
    Esta ciência tem conseqüências morais como todas as ciências filosóficas: essas
    conseqüências são boas ou más? É simples julgar-se pelos princípios gerais que
    acabo de expor".


    E já na página seguinte, repisa:


    "Melhor observado depois que se, vulgarizou, o Espiritismo vem derramar luz sobre
    grande número de questões, até hoje insolúveis ou mal compreendidas. Seu verdadeiro
    caráter é, pois, o de uma ciência e não o de uma religião; e a prova disso é que
    ele conta; entre seus aderentes homens de todas as crenças", `etc.`


    E, cinco linhas adiante:


    "Ele repousa, por conseguinte, em princípios independentes das questões dogmáticas.
    Suas conseqüências morais são todas no sentido do Cristianismo, porque de todas
    as doutrinas é esta a mais esclarecida e pura; razão pela qual, de todas as seitas
    religiosas do mundo, os cristãos são os mais aptos para compreendê-lo em sua verdadeira
    essência.


    Podemos expprobá-lo por isso?


    Cada um pode formar de suas opiniões uma religião e interpretar à vontade as religiões
    conhecidas; mas daí a constituir nova igreja, a distância é grande".


    Em perfeita concordância, lemos à página 102:


    Dogma Versão Grega - Dogmatikós, que se funda em princípios ou é relativo a uma
    doutrina. Derivado de igual voz grega, dogma significa opinião dada como certa
    e intangível, ou seja, um Axioma. Por exemplo: a Terra gira em torno do Sol, independente
    das pessoas aceitarem ou não, ela não deixará de girar. É nessa acepção que Kardec
    deixou que alguns Espíritos empregassem o termo dogma da reencarnação. “Como quer
    que seja, não existem dogmas - na linguagem eclesiástica - na Doutrina dos Espíritos,
    onde tudo é demonstrado ou demonstrável e onde não se admite manifestações direto
    de Deus”. .(Kardec, A. Revista Espírita - 1862, março, p. 86 (notas de rodapé
    do tradutor).


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    56


    "Eis porque, sem ser uma religião, o Espiritismo prende-se essencialmente às idéias
    religiosas, desenvolve-as naqueles que não as possuem, fortifica-as nos que as
    têm incertas".


    "A religião encontra, pois, um apoio nele, não para as pessoas de vistas estreitas,
    que a vêem integralmente na doutrina do fogo eterno, na letra mais do que no espírito,
    mas para aqueles que a vêem segundo a grandeza e a majestade de Deus".


    Parece que temos o suficiente 48.


    Como é sabido que todas as religiões se arrogam a posse exclusiva da Verdade e
    o culto do verdadeiro Deus, nenhum elemento forneceram os Espíritos a Kardec para
    constituir o Espiritismo em religião, como se vê dos trechos citados.


    Ele é uma ciência na sua feição prática; e como versa os problemas gerais da evolução
    da vida universal, conduz-nos a generalizações máximas, isto é, a uma filosofia;
    e porque ciência e filosofia lidem com os problemas máximos do ser humano, os
    de sua origem, de suas vicissitudes, assim na matéria como fora dela, e porque
    nos aponta o destino irrefragável do Espírito, problema basilar de todas as religiões
    – mas insolúvel ou erradamente considerado em todas elas – é que o Espiritismo
    tem conseqüências religiosas, mas nunca será uma religião.


    Seu papel é de esclarecer o homem; é de permitir fé pela razão e nunca por imposição
    dogmática. Por isso, fiel ao pensamento expresso dos Espíritos, não o converteu
    em religião nem tratou de a organizar: a fé não se sistematiza a não ser em foro
    íntimo e por ação pessoal. Conseqüentemente, desnecessário lhe era um visionário
    para a sinecura de `organizar o trabalho da fé`. Tudo quanto era essencial, neste
    particular, Kardec já havia apresentado em `O Livro dos Espíritos`, `O Livro dos
    Médiuns` e `A Gênese`, bem como em `O Evangelho Segundo o Espiritismo` e `O Céu
    e o inferno`.


    Se Allan Kardec só se ocupou da obra de Roustaing para a combater na `Revue Spirite
    (Revista Espírita)`, como dissemos no primeiro artigo, é que não reconheceu no
    advogado de Bordéus as qualidades de seu coadjutor.


    Ora, sabe-se que Kardec agia sempre de acordo com os Espíritos missionários, de
    alta estirpe, que lhe davam conselhos, mensagens, idéias, sugestões; que por vezes
    desciam da minuciosa análise de problemas de atualidade ou traçavam os lineamentos
    de problemas porvindouros.


    Seria crível que Allan Kardec se houvesse enganado quanto à tarefa colaboracionista
    de Roustaing? E, dado que se houvesse enganado, por que os Espíritos que o orientavam
    não esclareceram o seu equívoco? Admitindo, ainda, que esses Espíritos houvessem
