    上述引用与其他语言中受人尊敬的圣经完全一致，这些语言在第一篇文章中也曾提到。因此，按照相同的顺序，仅提取出现 `carne`（肉身）一词的经文节，如下：


    - 在 `King James Version`（1611 年版）中：“道成肉身”；


    - “上帝在肉身显现”； - “在肉身中死亡”； - “鉴于 61 O Rev. Othoniel Motta 教授在 20 世纪 40 年代初出版了《灵性主题》一书，在书中描述了他的灵性经验，承认了灵媒交流的真实性，甚至印了一张已故朋友的灵性通信复印，他认出了那者的字迹和签名。尽管如此，他在书的结尾处诉诸于魔鬼的解释。他缺乏那把‘钥匙’（H.P.）。


    # 道与肉身 – 对 Roustainguismo 的 2 种分析 ______________________________________________


    70


    “因此正如基督在肉身为我们受苦一样”； - “凡承认耶稣基督肉身道来的灵都是属神的”； - “凡不承认耶稣基督肉身道来的灵不属神的”； - ... 凡不承认耶稣基督肉身道来的”。


    - `Vulgata Latina`（拉丁武译本），我们之前未引用是因为我们没有，它同样一致： - “Et Verbum carne factum est
    et habitavit in nobis”; - quod manifestam est in carne, justificatum est in spiritu”;
    - “mortificatus quidem carne, vivificatus autem spiritus”; - “Christo igitur passo
    in carne”; - “omnis spiritus qui confitetur Jesus Christum in carne venisse ex
    Deo est”; - “et omnes spiritus qui solvit Jesum ex Deo non est”; - “qui non confitetur
    Jesum Christum in carnem”。


    此前提到过的 `Diodati` 古意大利语圣经写道：“E Ia Parola è stata fatta carne, ed è abitata fra
    noi”； - “在肉身中显现，在灵中得义”； - “在肉身中受苦，但被灵复活”；


    “che Christo ha sofferto per noi in carnes - ogni spirito che confessa Gesú Cristo
    venuto in carne, é da Dio”; - “E ogni Spirito che não confessa Gesú Cristo venuto
    in carne, não é da Dio”; - molti seduttori, i quali non confessano Gesú Cristo
    esser venuto in carne”。


    现在，在法语中，我们不再像之前那样引用 `Segond` 圣经，而是引用 Saci 在 1936 年的 `Lemaistre` 圣经，其根据 1759 年版的文本，这也是
    `Allan Kardec` 使用过的版本。这归于一位对我们文章感兴趣的朋友和同道的热心。以下是相同顺序的章节： - “Et le Verba a été
    fait chair, et il a habité parmi nous”；


    .- “... qui s''est fait voir dans Ia chair, a été justifié par l''Esprít”; - “...
    étant mort en sa chair, mais étant ressuscité par l''Esprit”。 - “...Jésus Christ
    a souffert Ia mort em sa chair”; - “Tout esprit qui confesse que Jesus Christ
    est venu dans une chair véritable, est de Dieu”; - “et tout esprit qui divise
    Jésus Christ n''est point de Dieu”; - “... qui ne confessent point que Jésus Christ
    est venu dans une chair véritable”。


    没有更更好的一致性了；然而，如果我们追溯希腊语原文，在那里我们总能找到 `σχρξ`（肉身）这个词。因此，`Allan Kardec` 有理由反驳（他也确实反驳了）耶稣基督是一个无灵体者（agênere）。如果感兴趣的读者没有读过我们之前的文章（我们在文中转录了
    `编码者`对该主题的 `da` 观点），提醒大家注意以下章节：《灵性福音》第 62 页第 18 页及以后，其中他`支持灵性教义在灵体普遍教学中的权威性`；以及《创世记》第
    63 页，第十四章第 36 项和第十五章第 65 至 67 项，其中 `Kardec` 研究了无灵体者以及耶稣在死前后的身体，并基于实验性工作的科学论证，以及深远的道德论证，得出结论：耶稣基督并非无灵体者。


    `Sr. Gomes Braga` 本人翻译了一篇 `Allan Kardec` 的文章，其中包含了 `编码者`与`圣路易`灵体关于双灵体和无灵体者的对话片段。因此，在我们正在讨论的书中，我们在第
    43 页读到如下内容：


    “5\. 无论是否罕见，只要此类事实发生就值得关注。如果把这样一个生物当成普通人并给他致命伤，会发生什么？他会死吗？ - 回。他会像那个伦敦年轻人一样突然消失。（参见
    1858 年 12 月刊的`Revista Espírita`杂志‘双灵体现象’）”。


    随后，在第 46 页，我们看到：“14\. 如果我们内部有一个这样一个生物，这是一种坏事吗？ - 回。这反而是一件坏事”。


