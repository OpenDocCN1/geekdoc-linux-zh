    道与肉身 – Roustaing 主义的 2 种分析 ______________________________________________


    ---


    ## 道与肉身


    在他生命的解脱之床边，在离开身体的躯壳飞往彼岸之前，Júlio Abreu Filho 与我和 Jorge Rizzini 讨论了一些教义问题。当 Roustaing
    主义的问题出现时，我想起了他关于这方面的工作以及重新出版的必要性。Júlio 对这个主意非常兴奋，并委托我处理这个问题。他的女儿之一 Ceres Nogueira
    Abreu Sacchetta 女士也在场，她是我的朋友兼媒体同事 Hermínio Sacchetta 的妻子。


    我告诉 Júlio，有必要对文本进行修订，并增加说明性注释。他授权我进行必要的修改，因为他理解更新的要求。但当我重读 Júlio 的作品时，发现有必要多做一点。这项工作具有争议性，并且是根据环境决定的方向进行的。尽管它非常有价值，特别是从其提供的数据来看，但它应该得到系统性分析的支持。


    我曾想过写一个引言，但这个主题比我想象的复杂。我被引导写了一本小书，作为 Júlio 书籍的分析性引言。因此，我认为将两者合订为一个卷册，并以一个总标题命名更好。


    标题 `道与肉身` 的选择取决于《约翰福音》第一章第 14 节节的深层意义：“道成肉身，住在在我们中间，充满恩典和真理，我们见过他的荣耀，乃是父独生子的荣耀。”在科德教主义者（kardecistas）和
    Roustaing 主义者的争论中，这一节是定论的，因为 Roustaing 主义也接受道的道身，尽管它将其限制在流体道身的教义之上。因此，这个福音式的标题并不意味着任何先前的断言或对结论的预判。


    相反，道与肉身之间的关系涉及基督教的基本问题，这些问题在灵性论中得到了广泛发展。本卷并没有专门讨论这些问题，但它们无疑是我们两个作品（我的和 Júlio 的）的核心点。


    '
- fmt: '

    Quem foi Roustaing e o que é o Roustainguismo? Essas duas perguntas são muito
    comuns no meio espírita. Como acontece em todos os movimentos doutrinários - religiosos,
    políticos, sociais etc: - o Espiritismo é conhecido apenas superficialmente pela
    maioria dos espíritas. A obra de Roustaing: `Revelação da Revelação – Os Quatro
    Evangelhos –` é muito extensa e complicada, abrangendo quatro volumes de 500 páginas
    em média cada um. Os artigos sobre essa obra, divulgados quase exclusivamente
    pela revista `O Reformador`, da Federação Espírita Brasileira, são em geral longos
    e confusos, além de apaixonados. Os artigos de crítica, raramente publicados num
    ou noutro órgão da imprensa espírita, limitam-se quase sempre a refutar aqueles.


    O leitor espírita vê-se diante do problema de Roustaing como diante de uma muralha
    intransponível. A obra maciça o espanta e as discussões agitadas o perturbam.
    Isso o leva a tomar posições de segunda mão, ficando com a opinião do círculo
    a que pertence. O resultado é vermos o movimento espírita dividido em áreas kardecistas
    e áreas roustainguistas. O grupo roustainguista da Federação Espírita Brasileira,
    tradicional e apoiado em dispositivos estatutários da "casa mater", sustenta o
    princípio de que Roustaing é o complemento necessário de Kardec. É "a revelação
    da revelação".


    O prestigio da FEB e a sua insistência na divulgação e sustentação do Roustainguismo
    dá certo vigor a este, particularmente no centro e norte do país.


    Mas, ao mesmo tempo, a repulsa a Roustaing é maciça em São Paulo, cuja tradição
    kardecista se, estende a todo o sul, com exceção de um grupo numeroso em território
    gaúcho, compensado, no outro extremo, pela firme posição kardecista do Estado
    do Rio. Entretanto, mesmo na Guanabara, em toda a região fluminense e no norte
    e nordeste não se pode falar de um maciço roustainguismo, pois há numerosos grupos
    de vigorosas instituições que repelem a "revelação da revelação".


    Vemos assim que o problema é grave e exige um esforço de esclarecimento. Durante
    certo tempo o slogan "ò corpo de Jesus não interessa, o que interessa é o seu
    espírito" conseguiu refrear as divergências. Por outro lado o chamado "pacto áureo",
    lavrado oficialmente entre a FEB e a USE paulista (União das Sociedades Espíritas
    do Estado de São Paulo) fez cair uma cortina de silêncio sobre a questão. Mas
    em fins de 1971 e princípios de 1972 a própria FEB se incumbiu de rasgar a cortina,
    iniciando pelo Reformador uma campanha de revivescência do Roustainguismo e lançando
    nova edição da semi-esquecida obra mediúnica `Os Quatro Evangelhos`. Verificou-se
    então um fato curioso: as novas gerações de espíritas foram surpreendidas pela
    "novidade" roustainguista, o que mostra como fora longo o silêncio sobre o assunto.
    E alguns pequenos grupos entusiasmados com a "novidade" apareceram aqui e ali,
    agitando de novo o tranqüilo movimento espirita sulino.


    Esse fato mostrou a necessidade de um exame mais atento e desapaixonado da obra
    de Roustaing. Essa a razão de ser deste trabalho.


    Entendemos que, nesta fase de expansão do movimento espírita e de amadurecimento
    da cultura espírita no Brasil, questões desta ordem não podem ser encaradas com
    negligência nem recolocadas em termos de simples polêmica. O Roustainguismo está
    arvorado em nosso território como bandeira de renovação. Essa bandeira permanece
    hasteada no edifício tradicional da FEB. Grandes e nobres vultos do movimento
    espírita brasileiro foram roustainguistas ou são apontados como tal. Temos de
    examinar a obra de Roustaing de maneira objetiva e determinar com segurança o
    seu valor em face da obra fundamental de Kardec.


    Seria lógico revisarmos de início o problema da implantação do Roustainguismo
    no Brasil e analisarmos o sentido da sua doutrina. Mas esses problemas - o histórico
    e o teórico - dependem do conhecimento objetivo dos textos.


    Sem sabermos o que é o Roustainguismo não podemos compreender o fenômeno da sua
    implantação nem examinar o seu significado, do qual deriva naturalmente o seu
    sentido. Por isso, temos de inverter os termos da proposição e começar pelo exame
    objetivo dos textos de Roustaing. Vamos colocar as teses fundamentais do Roustainguismo
    na lâmina do nosso microscópio e submetê-las ao exame histológico. É isso o que
    Kardec chamava `PASSAR PELO CRIVO DA RAZÃO 1.`


    Não temos a pretensão do absoluto. Queremos apenas chegar aos resultados da análise
    e oferece-los aos que debatem o problema sem disporem desses elementos indispensáveis.
    Conseguidos esses elementos, cada qual procederá de acordo com as regras do bom
    senso e dará o seu próprio veredicto. Essa é a nossa intenção ao iniciar este
    trabalho.


    ## II. O PREFACIO DE ROUSTAING


    Começa assim o prefácio: "Submeto ao exame e à meditação de meus irmãos. `Os Quatro
    Evangelhos` e, em seguida, Os Mandamentos explicados em espírito e verdade". A
    essa nobre intenção o autor acrescenta um relato da sua vida trabalhosa e dos
    seus estudos, de uma grave enfermidade e da qual, ao sair, foi informado por um
    clínico "da possibilidade de comunicações do mundoreo com o mundo espiritual".
    Essa notícia, recebida com ceticismo, levou-o depois a pesquisar o assunto. Leu
    `O Livro dos Espíritos` e em seguida `O Livro dos Médiuns,` chegando à conclusão
    de: "O mundo espiritual era bem o reflexo do mundo corporal".


    De posse desse dado consultou a História, compulsou os livros de filosofia profana
    e religiosa, antiga e recente, os poetas, vendo que as verdades contidas naqueles
    se confirmavam. Leu ainda o Velho e Novo Testamento, que também lhe deram a confirmação.
    Mas notou uma falta: "...tudo permanceu obscuro, incompreensível e impenetrável
    no tocante à revelação referente à origem e à natureza espirituais de Jesus, sobre
    a sua posição em relação a Deus e ao nosso planeta, sobre os seus poderes e a
    sua autoridade". Também permaneciam inexplicáveis as palavras de Jesus: "Desconfiai,
    pois, dos falsos profetas, sobretudo numa época de renovação, qual a presente
    porque muitos impostores se dirão enviados de Deus. Eles procuram satisfazer na
    Terra à sua vaidade; mas uma terrível justiça os espera, podeis estar certos.
    Espíritos da categoria em que eles dizem achar-se têm de ser não só bons, como
    também eminentemente racionais. Pois bem: passai-lhes os sistemas pelo crivo da
    razão e do bom senso e vede o que restará.


    Convinde, pois, comigo, em que todas as vezes que um Espírito indica, como remédio
    aos males da Humanidade ou como meio de conseguir-se a transformação, coisas utópicas
    e impraticáveis, medidas pueris e ridículas; quando formula um sistema que as
    mais rudimentares noções da Ciência contradizem, não pode ser senão um Espírito
    ignorante e mentiroso. É incontestável que, submetendo ao crivo da razão e da
    lógica todos os dados e todas as comunicações dos Espíritos, fácil se torna rejeitar
    a absurdidade e o erro. Pode um médium ser fascinado, e iludido um grupo; mas,
    a verificação severa a que procedam os outros grupos, a ciência adquirida, a alta
    autoridade moral dos diretores de grupos, as comunicações que os principais médiuns
    recebam, com um cunho de lógica e de autenticidade dos melhores Espíritos, justiçarão
    rapidamente esses ditados mentirosos e astuçosos, emanados de uma turba de Espíritos
