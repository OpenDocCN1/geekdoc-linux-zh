    52 Oportuna observação, pois é evidente a relação entre as forças católicas contrárias
    ao Espiritismo e as forças espirituais que defendem a obra de Roustaing. Todos
    os que escrevem e lutam contra a mistificação roustainguista sabem quanto são
    atacados pelas falanges católicas do espaço, que defendem essa obra como um instrumento
    eficiente de ridicularização e desmoralização do Espiritismo. Os grupos roustainguistas
    estão sempre sob a fascinação dessas forças (H.P.).


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    59


    uma refutação honesta, uma argumentação lógica, e isso só se consegue a custa
    de muito estudo sistemático e paciente, o que requer anos de devotamento para
    tentar provar possíveis inverdades em textos tão respeitáveis.


    Mas não assim para os roustainguistas. Roustaing deixou-se contaminar pela moda
    da época, de conversar com os Espíritos; tomou gosto e quis tornar-se célebre,
    rivalizando ou superando Kardec. A vaidade foi a brecha por onde entraram os mistificadores.
    O


    resultado aí está: os Espíritos clericais **fizeram um carnaval;** acabaram desorganizando
    na França o que Kardec paciente, humilde e sabiamente havia organizado.


    Em relação ao caso no Brasil, os mesmos mistificadores encontraram o terreno fácil,
    mercê da incultura geral do povo, da falta de conhecimento sistematizado e assuntos
    religiosos nas camadas mais cultas e, principalmente, da grande falha do brasileiro
    no tocante ao conhecimento do livro singularíssimo que é a Bíblia. O sincretismo
    religioso encarregou-se do resto.


    Já é tempo de destruir o equívoco representado pelo roustainguismo.


    "Nem de noite nem de dia se apagará; para sempre a sua fumaça subirá; de geração
    em geração será assolada; pelos séculos dos séculos ninguém passará por ela. Mas
    o pelicano e o ouriço a possuirão; a coruja e o corvo nela habitarão; e ele estenderá
    sobre ela o cordel de confusão e o prumo de vaidade. Eles chamarão ao reino os
    seus nobres, mas nenhum haverá; e todos os seus príncipes não serão coisa nenhuma.
    E crescerão espinhos nos seus palácios, urtigas e cardos nas suas fortalezas;
    e será uma habitação de chacais, um sítio para avestruzes" (Isaías; 34:10 a 13).


    "Eis que todos são vaidade. As suas obras não são coisa alguma; as suas imagens
    de fundição são vento e coisa vã’ (Isaías; 41:29).


    "Ninguém há que invoque a justiça com retidão, nem há quem pleiteie com verdade;
    confiam na vaidade, e falam mentiras; concebem o mal, e dão à luz a iniqüidade"
    (Isaías, 59:4).


    "E disseme o Senhor: Os profetas profetizam mentiras em meu nome; não os enviei,
    nem lhes dei ordem, nem lhes falei. Visão falsa, adivinhação, vaidade e o engano
    do seu coração é o que eles vos profetizam" (Jeremias; 14:14).


    "Viram vaidade e adivinhação mentirosa os que dizem: O Senhor diz; quando o Senhor
    não os enviou; e esperam que seja cumprida a palavra. Acaso não tivestes visão
    de vaidade, e não falastes adivinhação mentirosa, quando dissestes: O


    Senhor diz; sendo que eu tal não falei? Portanto assim diz o Senhor Deus: Porque
    tendes falado vaidade, e visto mentiras, por isso eis que eu sou contra vós, diz
    o Senhor Deus. E a minha mão será contra os profetas que vêem vaidade e que adivinham
    mentira; não estarão no concílio do meu povo, nem nos registros da casa de Israel
    se escreverão, nem entrarão na terra de Israel; e sabereis que eu sou o Senhor
    Deus" (Ezequiel; 13; 6 a 9).


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    60


    ## **III**


    **MÉDIUNS: Zilda Gama, América Delgado e Francisco Cândido Xavier** Postas as
    coisas neste pé, prossigamos na análise. Podemos agrupar as seguintes teses:


    I - "Que a obra exclusiva da Sra. Collignon tem hoje caráter de


    universalidade, porque os espíritos a confirmaram através de três médiuns: Zilda
    Gama, América Delgado e Francisco Cândido Xavier";


    II - Que Allan Kardec não combateu a teoria do corpo fluídico de Jesus; apenas
    a pôs de quarentena: posteriormente, como espírito, a apoia".


    *


    Contestamos, baseado no bom-senso, a afirmativa de que a obra da Sra.


    Collignon tenha hoje - **"caráter de universalidade, porque os Espíritos a confirmaram**
    **através de três médiuns".**


    Quando uma coisa alcança um certo número de países, diz-se que é


    **internacional; universal,** pela própria etimologia, é aquilo que é peculiar
    ou relativo ao **universo, isto é, à totalidade dos países do mundo.** Ninguém
    sabia que um fato, ou a confirmação de um fato na Casa da Avenida Passos pudesse
    ter assim, e **só por** **isto, um caráter universal.** Até parece que esse "universal"
    é mera tradução da voz grega " *catholikos*" e que não estamos longe de ver a
    gente da ex-Casa de Ismael proclamá-la em Vaticano-mirim, como sede gestatória,
    beija-pés e andor para carregar o "pontifex-maximus", à maneira dos cônsules romanos.


    Se não bastar a inanidade do argumento do Sr. Ismael, bastará fazer algumas citações
    da obra de Kardec. É mesmo interessante seguir esta via, porque o Sr. a Braga
    – e nisto estamos de acordo – não admite se mutile ou altere a obra de Allan Kardec.


    Antes, porém, vejamos o caso dos três médiuns.


    Francisco Cândido Xavier, é médium que está desempenhando notável


    tarefa no cenário espírita nacional e deve estar sendo metido levianamente em
    negócio escusos, pois escuso é usar o prestígio por ele conquistado entre os espíritas,
    para valorizar uma teoria que a maioria dos profitentes da doutrina impugna e
    sobre a qual os seus guias mantêm um discreto silêncio. Aquele médium está sendo
    pela F.


    E. B. metido na questão roustainguista como Pilatos no Credo 53.


    É possível que os espíritas recentes o ignorem: mas faz ainda muitos anos o jornal
    **Mundo Espírita** denunciou, em artigos assinados por pessoa de grande estatura
    moral e de projeção social – o Sr. General Araripe de Faria – um caso escabroso
    de adulteração de livro psicografado por Francisco Cândido Xavier. É o caso de
    uma obra que se esgotou e, ao publicar a segunda edição, a F. E. B. alterou certas
    passagens, afeiçoando-as aos princípios roustainguistas.


    Tão grave e indefensável era a acusação, que a Federação Espírita


    Brasileira remeteu-se ao silêncio: apanhou sem tugir nem mugir. Mas nem se arrependeu
    nem Corrigiu: antes seguiu o prolóquio: **"Cesteiro que faz cesto, faz um** **cento".**


    53 Chico Xavier sempre se esquivou a polêmicas. Sua função mediúnica não pode
    ser perturbada. Sua humildade natural o coloca à margem de divergências doutrinárias.
    Mas sua firmeza kardecista se traduz no seu comportamento e nas suas obras, onde
    Kardec e só Kardec está presente. O autor tem razão. Chico é mencionado indevidamente
    nesse caso. (H.P.).


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    61


    Ora, os Espíritos que têm ditado livros a Francisco Cândido Xavier são criteriosos
    e equilibrados; não iriam dizer uma coisa hoje e outra amanhã, defender uma tese
    agora e atacá-la ou defender tese contrária mais tarde, que isto é privilégio
    de certos políticos; não iriam fazer alterações, corrigendas ou aditivos naquilo
    que disseram, e que deve ter passado pelo crivo de minuciosa análise.


    Admitindo mesmo que tivessem tido necessidade de o fazer, teriam tido aquele gesto
    de elementar elegância dos escritores probos e que sabem respeitar o seu público,
    para serem, também eles, respeitados; e, ou escreveriam um prefácio para a nova
    edição modificada, dando conta da alteração, ou poriam, no trecho alterado, uma
    nota em rodapé.


    Fazê-lo subrepticiamente é marcar de suspeição o seu trabalho, quiçá o próprio
    nome, porque deixam de **viver às claras,** como manda o belo lema positivista.'
