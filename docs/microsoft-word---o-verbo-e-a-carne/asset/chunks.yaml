    mandamento possa ser aplicado num sentido mais amplo: `não matarás à espada nem
    a tiros, mas a bombas de hidrogênio.` Sim, porque é possível que a morte coletiva
    de milhões de pessoas se torne uma exigência cármica. E então os Espíritos protetores
    não terão o trabalho minucioso de dirigir as espadas, mas obterão o máximo resultado
    com o mínimo esforço, dirigindo apenas o lançamento da bomba.


    ### A Revelação


    Chegados a esta apoteose, que nos lembra os deuses homéricos participando da destruição
    de Tróia, parece-nos que o caso Roustaing não precisa de mais nenhuma tentativa
    de análise. Tivemos num `flash` a fotografia de corpo inteiro "da revelação da
    revelação". Essa é a obra que vem sendo divulgada como complementação da obra
    de Kardec. Nova edição dos quatro alentados volumes de Roustaing está sendo anunciado
    para todo o Brasil. Artigos veementes são publicados em defesa e louvor dessa
    "última palavra" da Doutrina Espírita. E isso numa fase em que o Espiritismo entra,
    em nosso país, em perfeita conexão com o desenvolvimento nacional, num período
    de intenso crescimento cultural.


    As novas gerações, particularmente as de estudantes universitários, que já podem
    fazer os seus cursos em Faculdades que prenunciam o breve aparecimento das Universidades
    Espíritas, pois fundadas e mantidas por instituições doutrinárias, poderão inteirar-se
    agora dos "novos ensinos" que nos chegam das esferas superiores. Moisés, os evangelistas
    e os apóstolos supriram com grande antecedência as nossas necessidades no campo
    da cultura.


    Devemos estar, nesta hora do mundo, sob a ação de um pesado carma coletivo para
    termos assim de voltar ao exame de livros dessa natureza, editados e reeditados
    como espíritas. Paciência. Os "ministros de Deus" já nos explicaram como tudo
    acontece para o bem dos homens e a alegria dos anjos.


    ### Crítica a Daniken


    Criticando recentemente o livro "Eram os deuses astronautas?", de Daniken, bestseller
    mundial, com grande venda no Brasil, o Prof. Anathol Rosenfeld assinalava o ridículo
    de todas as tentativas de combater as tolices dessa obra.


    Não obstante, escrevia ele, convinha expor-se ao riso das pessoas de bom senso
    para tentar esclarecer o assunto. O ridículo de certas concepções é às vezes tão
    grande que só merece o silêncio. O simples fato de querermos chamar a atenção
    das criaturas de exagerada boa fé para o ridículo da Roustainguismo é também uma
    atitude risível. A esse ridículo nos expomos conscientemente neste trabalho. Vale
    a pena enfrentar essa posição quixotesca pela só esperança de que alguém acorde
    do sono hipnótico ou alguém consiga evitar de cair nele.


    ### Os Quatro Evangelhos


    `Os Quatro Evangelhos` é o cavalo de Tróia do Espiritismo. Nada mais ridículo
    do que os troianos recolhendo o engenho grego em sua cidadela, encantados apenas
    com a grandeza da obra. Ridículo também, por sua inutilidade, o vaticínio de Cassandra,
    pois o deus Apoio já o havia previamente anulado. Mas Cassandra tinha de fazê-lo
    por um dever moral. Os que não a ouviram pereceram e levaram o seu próprio reino
    à destruição total. Temos de enfrentar o ridículo com a coragem moral da profetisa
    troiana. Mormente agora, que o Cavalo de Tróia, trazendo no bojo os inimigos ferozes,
    está sendo de novo exibido aos basbaques do Espiritismo.


    ---

    O Verbo e a Carne – 2 Análises do Roustainguismo


    ### O Conceito de Carma


    `Carma` – Este termo não deve ser utilizado dentro do Espiritismo, por não se
    encontrar em nenhuma das Obras de Allan Kardec. A palavra carma foi “introduzida”
    recentemente no Espiritismo através das chamadas obras subsidiárias, ou seja,
    os livros psicografados “escritos por espíritos através de um médium”, mas não
    é utilizado em nenhum momento nas obras de Kardec. A palavra carma (em sânscrito
    `karma` ou `karman` e em pali `kamma`) utilizada na Índia e por muitas correntes
    filosóficas religiosas, significa em primeira instância “ação”, “trabalho” ou
    “efeito”. No sentido secundário o efeito de uma ação, ou se preferirmos, a soma
    dos efeitos de ações (vidas) passadas se refletindo no presente `28`.


    Na concepção hindu, carma quer dizer “destino” (`canga`) determinado ou fixo,
    ou seja, aqueles cujos atos foram corretos, depois de mortos renascerão através
    de uma mulher brâmane (virtuosa), ao passo que aqueles cujos os atos foram maus,
    renascerão de uma mulher pária (castas inferiores) e sofrerão muitas desgraças,
    acabando como simples escravos `29`.


    *Inclusive uma pessoa nascida numa casta impura (um varredor de ruas, um auxiliar
    de crematório, por exemplo) deve permanecer na profissão herdada. Cumprindo o
    melhor possível e de maneira ordenada a sua função, tornar-se-á um perfeito e
    virtuoso membro da sociedade. Por outro lado, ao interferir nas tarefas de outras
    pessoas, ele será culpado de perturbar a ordem sagrada. (...), mesmo a prostituta,
    que dentro da hierarquia da sociedade está aquém da virtuosa dona de casa, pode
    participar – caso cumpra com perfeição o código de sua desprezível profissão –
    do supra-humano e transindividual Poder Sagrado que se manifesta no cosmo. Ela
    pode até fazer-lo.*


    28 Hinnells, J. R. Dicionário das Religiões, p. 54.

    29 Ling, T. História das Religiões, 1.32.


    30 Zimmer, H. Filosofias da Índia, p. 271.

    31 Kardec, A. O Livro dos Espíritos, perg. 258 e ss.

