    Na verdade todo o ritual católico, nos seus mínimos detalhes, é tirado daqui e
    dali, dos rituais das várias religiões que se encontravam, vivas, mortas ou agonizantes,
    dentro do próprio império.


    Os dirigentes católicos herdaram, do lado romano, esse espírito de dominação e
