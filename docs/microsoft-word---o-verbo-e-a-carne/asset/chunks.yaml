    现在，针对 Xavier 的另一部降灵作品引发了新的怀疑。针对那位灵媒吗？不是：而是针对出版者，针对 `F. E. B.`。这一怀疑是由 Henrique
    Andrade 博士提出的，他是巴西灵性界声誉望，发表在《极光》（Aurora）杂志今年 54 年 4 月 1 日第 191 号。


    这涉及 Humberto de Campos 灵体的一封信息，由巴西灵性联合（Federação Espírita Brasileira）于 1937 年出版在《坟墓之外的纪事》一书的卷册中；以及该灵体在其书《巴西，世界之心，福音之母国》中的一段文字，两者均由该灵媒接收，后者于
    1938 年出版，即在前者仅一年后。


    在信息中，Humberto de Campos 引用了跟随 `Kardec` 足迹的许多知名人物。按照引用的顺序，值得说明其重要性：Camille Flammarion、Gabriel
    Delanne 和 Léon Denis，他们从灵性角度论述了宇宙学和哲学，“开启了宗教思想的新时代”。


    关于 Roustaing，只字未提！……


    然而，一年后，同一个灵体在上述第二部作品中提到，`Kardec` 的使命“将有一群他的助手，他们特别被选出来协助他，即在 Baptista Roustaing
    等个人，他将组织信仰的工作等等……”……


    现在 Roustaing 开始戏弄那三个伟人人物。令人难以置信，这位来自马拉尼州的活跃灵体在第一条信息中打了盹。他怎么能忽略（正如他那样忽略了）根据其分类的灵性第二人物，而
    `F. E. B.` 今日将其与 Allan Kardec 并肩，甚至置在其之上呢？


    我们建议读者参考《极光》中的文章。


    现在允许我们记录一个很久以前收集到的印象：André Luiz、Humberto de Campos 和 Emmanuel 的风格，与过去十二年来 `F.
    E. B.` 的翻译之间的风格相似性。如果进行细致的研究，除了过于华丽的语言外，我们将在那些归属于这些灵体的印刷页面中发现许多相似之处，以及这一阶段 `F.
    E. B.` 两个最“受信”的译者的用词法。


    这种语言上的精致程度与灵性大众的文化水平不符；其中充满了陈词滥调和固定表达。54 1949。这些文章发表于 1949 年，并在次年出版成书。（H.P.）。


    # 与肉身 —— 对 Roustaingu 主义的两个分析

    ______________________________________________

    62


    过分的：可以说是陈词滥调。作为补偿，翻译中包含了许多错误，显示出对原始语言的不熟悉。例如，诸如这些表达：“上帝没有黑暗的焦点”，但在原文中，`point`
    不是点，而是第二重否定；当问及圣殿是否可以使用法律禁止的淫妓钱时，以及当说在无法拒绝的情况下，应将这些钱用于建造厕所时，译者将 "guarde-robe"(衣柜）译成了
    "guardaroupa"(衣服），这是极其可怕的讽刺，但改变了基本思想。


    `F. E. B.` 翻译的作品充满了此类粗心。最糟糕的是，在许多情况下，它给了我们荒谬或毫无意义的句子。


    基于此，无法接受将 Francisco Cândido Xavier 列为接收支持 Roustaing 信息的灵媒之一。此外，那些向他传达作品的灵体知道问题的棘手，并预计丑闻早晚会爆发。他们表现出宽容，回避了该话题，让人们自己解决。


    然而，`F. E. B.` 越发陷入了不可原谅的错误，扭曲 `Kardec` 的思想甚至圣经文本，不仅是为了辩护一个极其可疑的教义观点，现在更是为了维护被强加的立场。


    我们坚信，前 Ismael 之屋的主们无法面对由反 Roustaing 人士和中立人士组成的广泛委员会，并在可靠的预视灵媒出席的情况下，让 Emmanuel、André
    Luís 或 Humberto de Campos 回答关于 `Kardec-Roustaing` 分歧的严苛问题。


    至于另外两位灵媒，这些是受人尊敬的女士，需要作为灵媒独立于性别被考虑，因为灵媒是灵性的恩赐。


