    \ desvios sacerdotais e predizia acontecimentos futuros naquele conjunto de livros\
    \ chamados `Neblim`; estes abarcavam tanto os grandes como os menores profetas.\
    \ Outros livros históricos e poéticos o completavam 50.\n\n### 49 O Pentateuco\n\
    O Pentateuco em hebraico `Chumash: ”os cinco quintos do Torá”` (`chamishá chumshei\
    \ Torá`) ou `humash`, `hamishá,` `humshé Torah` ou simplesmente `Torá` (ensinamento)\
    \ é o máximo da consagração dentro do pensamento judaico. Este compendio de leis\
    \ que compreende os cinco primeiros livros bíblicos, contém 613 mandamentos que\
    \ estruturam a constituição judaica. \n\nO Pentateuco foi alvo de vários estudos,\
    \ criticas e questionamentos por parte de muitos filósofos, cabalistas, talmudistas\
    \ e etc.. No entanto, nenhum deles se empenhou em explicar a lei como `Maimônides`\
    \ o fez em seus escritos e estudos durante sua vida. Este filósofo \"reuniu\"\
    \ O `Torá` em seu Livro `Os 613 mitsvot` (\"mandamentos\") e os \"dividiu\" em\
    \ preceitos, sendo 248 positivos e 365 negativos. A primeira divisão relaciona\
    \ os preceitos ou leis que agradam a Deus, ou \"farás\" e os segundo que desagradam\
    \ a Deus, ou \"não farás\".\n\nO Pentateuco, portanto, não é uma obra homogênea.\
    \ Mas tampouco é, como alguns eruditos na tradição crítica alemã, uma falsificação\
    \ deliberada de sacerdotes do pós-Exílio, procurando impingir suas crenças religiosas\
    \ egoístas as pessoas, atribuindo-as a `Moisés` e sua época. Não devemos permitir\
    \ que os preconceitos acadêmicos criados pela ideologia hegeliana, anticlericalismo,\
    \ anti-semitismo e modelos intelectuais do século XIX distorçam nossa opinião\
    \ sobre esses textos. \n\nToda a evidência interna mostra que aqueles que anotaram\
    \ e fundiram esses escritos, e os escribas que compilaram quando o cânon foi reunido\
    \ depois do Exílio, acreditavam plenamente na inspiração divina dos antigos textos\
    \ e os transcreveram com veneração e seguindo padrões de exatidão mais elevados\
    \ possíveis, incluindo muitas passagens que manifestamente não compreendiam (Johnson,\
    \ P. História dos Judeus, p. 94 e ss.). Todas as leis que aparecem no `Torá`,\
    \ desde a circuncisão ao lavar as mãos só possuíam um objetivo, o de diferenciar\
    \ o povo hebreu – os eleitos – dos povos circunvizinhos.\n\nGostaríamos apenas\
    \ de salientar ao leitor que todas as vezes que utilizamos as frases dividiu,\
    \ reuniu, elaborou, escreveu, explicou e etc., todo O `Torá` ou as Leis. Estamos\
    \ apenas fazendo uma alusão ou tentando deixar as explicações mais accessíveis\
    \ aos não afeiçoados a leituras do pensamento judaico. Não existe divisão, resumo\
    \ nem muito menos pensamento que possa qualificar ou demonstrar a dimensão desse\
    \ livro que possuí o sagrado em todos os pontos e em cada linha e como meta à\
    \ explicação desse sagrado através de suas hierofanias. \n\nO `Torá` é uno, indivisível\
    \ e absoluto, não existe `Torá` pela metade ou se considera O `Torá` como um todo\
    \ ou não teremos `Torá`, mas fragmentos de leis que não nos serve para nada. O\
    \ `Torá` está e sempre esteve presente no próprio alicerce do universo, são suas\
    \ leis que estabelecem e harmonizam todo o cosmo, se não existisse O `Torá` não\
    \ existiria a vida, a terra e o universo. Antes da existência escrita do `Torá`\
    \ na terra, o Eterno o tinha em suas próprias mãos, organizando, estruturando\
    \ e sacralizando o mundo. O `Torá` é na verdade o plano da Criação. Confiou ao\
    \ povo está responsabilidade de restabelecer a harmonia que antes fora quebrado\
    \ por Adão através de seu \"pecado\" (Unterman, A. Dicionário Judaico de Lendas\
    \ e Tradições, p. 179).\n\n### 50 Os escritos e profetas\nOs escritos e os profetas\
    \ podem ser “divididos” da seguinte forma:\n\n*   **Livros narrativos e históricos:**\
    \ Josué; Juizes; Reis e Samuel.\n*   **Entre os profetas:** temos os “quatro”\
    \ maiores ou principais e os doze menores - o termo se refere a tempo de “pregação”\
    \ e a extensão do livro e não a maior ou menor importância deste ou daquele profeta.\
    \ Todos tiveram a sua relevância.\n\nNesses textos, onde há referências ao Messias,\
    \ ele será um homem, um profeta, um rebento da Casa de David. Tudo isso se cumpriu\
    \ no tempo certo, no lugar predito, nas condições previstas pelos grandes videntes.\
    \ `Jesus Cristo` ensina a sua doutrina e seus apóstolos è discípulos a transmitem.\
    \ São os escritos que constituem a Segunda Revelação.\n\nDe como se copiavam e\
    \ se transmitiam esses livros sagrados diremos oportunamente. Basta, por hoje,\
    \ dizer que havia regras rigorosíssimas para se lhes fazerem cópias, o que eqüivale\
    \ quase a um trabalho impresso; conhecem-se o número de capítulos, de versículos,\
    \ de palavras; sabe-se qual o capítulo mediano, qual a palavra central. Com um\
    \ tal luxo de minúcias, difícil é fazer mutilações.\n\n```\nO Verbo e a Carne\
    \ – 2 Análises do Roustainguismo ______________________________________________\n\
    ```\n"
