    ## XII


    ### RAZÃO DE SER DO ROUSTAINGUISMO


    O processo histórico do Roustainguismo é demasiado simples e vulgar. O advogado
    Jean Baptista Roustaing de Bordeaux, leu `O Livro dos Espíritos` e `O Livro dos
    Médiuns`, depois de haver saído de uma grave moléstia, e impressionou-se com a
    possibilidade de receber dos espíritos algumas revelações. Isso é o próprio Roustaing
    quem nos conta no prefácio de sua obra, como vimos no início deste trabalho.


    Considerando-se apto a receber mensagens esclarecedoras sobre a natureza do Cristo
    e os fatos obscuros de sua vida na Terra, orou fervorosamente pedindo a Deus -
    na véspera de 24 de junho de 1861 - que lhe permitisse a manifestação do espírito
    de João Batista (santo do seu nome), do espírito do seu próprio pai e do seu espírito
    protetor.


    Roustaing mesmo nos dá, no prefácio, esta informação valiosa: "Essas manifestações
    se produziram espontaneamente, com surpresa do médium, a quem eu deixara ignorante
    da minha prece. Constituíram para mim uma fonte de alegria imensa, com o que me
    provaram que a minha súplica fora ouvida e que Deus me aceitava por seu servo".


    A seguir Roustaing informa: "O espírito do apóstolo Pedro se manifestou a 30 de
    junho, de modo inesperado tanto para mim quanto para o médium. Fui mediunicamente
    prevenido da época em que poderia e deveria publicar essas comunicações de tão
    alto interesse".


    Todo estudante de Espiritismo sabe que essas evocações pretensiosas acarretam
    mistificações. Kardec chegou a escrever: "Evoca um rochedo e ele te responderá.
    Há sempre uma multidão de Espíritos prontos a tomar a palavra, sob qualquer pretexto"
    35. A imensa alegria que as comunicações pedidas causaram a Roustaing mostra a
    sua ingenuidade de neófito. Aceitas as comunicações e aceita a incumbência de
    servo de Deus, Roustaing se entregava às mãos dos mistificadores.


    Comparando essa facilidade com as reservas de Kardec ao iniciar a investigação
    dos fenômenos e ao receber as primeiras mensagens espirituais, vê-se logo a diferença
    entre os dois. Kardec é a modéstia e a prudência. Roustaing é a pretensão e a
    precipitação.


    Kardec observa, estuda, pesa, analisa e entrega-se à profunda perquirição, a exaustiva
    experimentação. Roustaing se inflama e se atira sofregamente ao trabalho. Não
    traça um plano de trabalho, não medita sobre os problemas que vai enfrentar, não
    submete os espíritos comunicantes a nenhuma prova de identificação moral e espiritual.
    Descobriu o maravilhoso e nele se perde enlevado.


    A gênese do Roustainguismo é portanto o anseio do maravilhoso. Tanto assim que
    enquanto Kardec, sensato e cauteloso, se recusa a falar em religião, atribuindo
    ao Espiritismo o caráter de Ciência e oferecendo-o às religiões como uma arma
    na luta contra o materialismo, Roustaing logo se proclama como o revelador, "instrumento
    útil" nas mãos de Deus para promover "a unidade de crenças e a fraternidade humana
    pela efetivação das promessas do Mestre e, por fim, do Reino de Deus na Terra".


    Deixemos que ele mesmo nos fale do seu estado de espírito, pois ninguém melhor
    para o explicar de maneira irrefutável:


    35 Kardec, O Livro dos Médiuns, item 283.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    30


    "A medida que a revelação se adiantava minha alma se tia encontrando cada vez
    mais presa de admiração ao descobrir todas aquelas verdades e eu dizia: - Disponde
    da vossa criatura, ó meu Deus! Sou vosso, pertenço-vos; meu coração, meu tempo,
    minha razão, eu os consagro ao vosso serviço; serei feliz, oh! soberano Mestre,
    se, mau grado à minha fraqueza, puder tornar-me nas vossas mãos um instrumento
    útil que vos conquiste o amor, o respeito, o coração das vossas criaturas".


    Enquanto em Kardec o estado de espírito era de observação, em Roustaing era de
    fascinação. Kardec ponderava, analisava, experimentava. Mas Roustaing se entregava
    aos espíritos abdicando da própria razão. E não queria ser nada menos do isto:
    o instrumento que conquistasse o amor e o respeito das criaturas para o Criador,
    como se Deus necessitasse da ajuda falível de um homem para fazer-se amado e respeitado.
    Podem alegar que ele se dirigia a Deus, mas as preces orgulhosas não são recebidas
    por Deus e sim pelos espíritos obsessores. Não foi Deus quem o ouviu e atendeu.


    Mas façamos um esquema cronológico do aparecimento:


    Janeiro de 1861 - Roustaing restabelecido de grave moléstia, fala da possibilidade
    de receber a revelação. Lendo `O Livro dos Espíritos` e `O Livro dos Médiuns`,
    debera-se como uma arma na luta contra o materialismo.


    Junho de 1861 - Roga a manifestação de João Batista.


    Dia 24 de junho de 1861 - Recebe a manifestação do espírito de João Batista.


    Dia 30 de junho de 1861 - Recebe a comunicação do apóstolo Pedro.


    Dezembro de 1861 - Atende a sugestão de conhecer Madame Collignon. Oito dias depois
    vai agradecer-lhe o acolhimento. Ao sair, a médium sente impulsos de escrever.
    Roustaing escreve: é uma mensagem de Mateus; Marcos, Lucas, João, assistidos pelos
    apóstolos, a revelação.


    Maio de 1865 - Escreve Roustaing: "...todos os materiais estavam preparados, tanto
    a respeito dos Evangelhos como dos Mandamentos. O aviso de dar a conhecer aos
    homens, de publicar a obra da revelação, me foi espontânea e mediunicamente transmitido
    em termos precisos".


    (O trabalho de recepção da obra durou cerca de três anos e meio. No total, o Roustainguismo
    levou apenas quatro anos e meio para se apresentar em seu texto completo. Não
    houve relação entre Kardec e Roustaing.)

