    lícita, como todas as suas ações; essa transmutação (química e não alquímica)
    não foi uma encenação, mas um fato real, ainda hoje constatável na atividade mediúnica.
    A transmutação do leite de Maria implica problemas morais inadmissíveis numa personalidade
    espiritual elevada, tanto mais que por trás dela encontra-se todo o complexo fantasioso
    e absurdo do nascimento fingido. Estaríamos diante desta contradição que minaria
