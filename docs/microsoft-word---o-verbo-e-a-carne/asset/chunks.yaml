    Como prova de que a obra de `Roustaing` é mesmo uma das mais grossas mistificações
    de que já foi vítima a sociedade, damos adiante a mensagem obtida num centro espírita
    no Rio de Janeiro, em 1921, do próprio Espírito de `Jean Baptiste Roustaing` 70\.
    Antes, porém, seja-nos licito prestar uma homenagem a um médium honesto: o saudoso
    `Porfírio Bezerra Filho`, fundador do `Centro Espírita Cristófilos`, no Rio 71.


    `Porfírio` cegou num desastre. A dor levou-o para o Espiritismo, onde desenvolveu
    preciosas faculdades mediúnicas: tinha a clarividência, a clariaudiência, a incorporação
    total, a psicografia semi-mecânica, a inspiração ou incorporação sutil; via as
    auras das criaturas, como via os órgãos internos e a cor do som. Aprendeu a doutrina
    depois de cego, ouvindo a filha pequena ler os livros fundamentais. Era um primoroso
    dirigente e doutrinador. Muito aprendemos com ele.


    Em 1924 pediu que comparássemos as obras originais de `Kardec` com as traduções
    em português: tinha em suspeita, as quais, por vezes, `Bezerra de Menezes`, o
    max. Tivemos certeza e esperamos; `Porfírio` já passou para o outro plano, sem
    que atendêssemos ao pedido.


    Faz-lo agora. E a mensagem. Hei-la: CONFISSÃO DA MISTICAÇÃO por `J. B. ROUSTAING`
