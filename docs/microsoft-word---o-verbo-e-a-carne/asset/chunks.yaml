    ## VI

    ### “Elos Doutrinários”


    Nos artigos anteriores, de análise do livro do ilustrado Sr. Ismael Gomes Braga,
    intitulado "Elos Doutrinários", havíamo-nos proposto a discutir os dez itens em
    que se podiam agrupar as mais importantes afirmações nele contidas; e o fizemos
    na seguinte ordem:


    (a) no segundo:

    - que a missão de Kardec foi notavelmente auxiliada pelo Sr. Roustaing, "encarregado
    de organizar o trabalho da fé, dando confirmação às Revelações anteriores";


    (b) no terceiro:

    - que a obra exclusiva da Sra. Collignon tem hoje Caráter de universalidade, porque
    os espíritos a confirmaram através de três médiuns: Zilda Gama, América Delgado
    e Francisco Cândido Xavier;

    - que Allan Kardec não combateu a teoria do corpo fluídico de Jesus, apenas a
    pôs de quarentena; posteriormente, como espírito a apoia;


    (c) no quarto:

    - que Jesus não era homem, mas um simples espírito;

    - que "se não fosse confirmada a natureza excepcional do corpo de Jesus pelo Espiritismo,
    as duas Revelações anteriores teriam que cair e o Espiritismo não subsiria";

    - que "quem nega que Jesus tenha sido um espírito nega também a codificação kardeciana,
    não é espírita;


    (d) no quinto:

    - que "as três Revelações – Velho Testamento, Novo Testamento e Espiritismo –
    formam um todo inseparável, um conjunto único em sua essência e não se pode atacar
    uma parte sem abalar todo"; a obra de Roustaing é uma parte desse conjunto;

    - que "negar fé à obra de Roustaing é minar o edifício todo, desde Moisés até
    os nossos dias.


    Todas estas teses foram refutadas honestamente e sem subtergios. Hoje chegamos
    ao fim do exame. Restam duas teses que dizem: V - que a obra de Kardec era destinada
    aos crentes e a de Roustaing às pessoas de cultura; e VIII - que confirmada a
    natureza excepcional do corpo de Jesus, em numerosas comunicações, e com isso
    consolidada a obra de Kardec e confirmados o Cristianismo e Judaísmo".


    Temos que estudar hoje para concluir no próximo artigo. A tese nº V do Sr. Braga
    divide a família espírita em duas: gente crente e gente culta, assim como se disses:
    gente ignorante e gente ilustrada, gente estúpida e gente talentosa, ou ainda,
    gente que tem fé e gente que não tem. Notáveis os rouinguistas! Para essa gente
    culta, ilustrada, talentosa e sem fé, a lógica não existe. S. s. disse de começo
    que Roustaing era missionário e auxiliar de Kardec; depois insinua que está no
    mesmo plano de Kardec; agora está um pouco mais acima: é o mentor, o patrono e
    o oráculo dos espíritas francesos. Isto é entronização anticristã do separatismo.


    O Verbo e a Carne – 2 Análises do Roustainguismo______________________________________________


    80


    Esta contradição vem mostrar que o roustainguismo é mesmo a doutrina do anticristo
    e que a casa dos rouinguistas se transformou na Sinagoga de Satã, pois, conforme
    os Evangelhos, haverá um só rebanho, enquanto que para eles haverá dois: o dos
    que tem fé e o dos têm prosápia (orgulho, soberba), o dos que fazem obras e pregam
    a fraternidade e o dos que falseiam as obras e se constituem em dominadores de
    seus semelhantes.


    Não são estas expressões de ataque; são expressões de fatos. São as declarações
    de um diretor da F. E. B. e os exemplos sistemáticos dessa organização. Querem
    a prova? Aqui a temos; foi por abuso de confiança, tomando procurações dos kardecistas
    votantes, que deveriam reunir em assembleia, na qual seria eleita a direção da
    F. E. B., que, num golpe baixo, os rouinguistas assaltaram o poder; feito isto,
    reformaram os seus estatutos, introduzindo um dispositivo que exige a confissão
    do credo rouinguista para poder participar do conselho e da diretoria; ainda pelos
    estatutos, a diretoria completa o conselho, e este elege a diretoria. Vejam-se
    `Art. 2°, letra a` e `Art. 36°, § 3`.


    Se houvesse essa unidade de vistas que o Sr. Ismael proclama, se não houvesse
    uma divisão de águas, estabelecida pelos rouinguistas, os kardecistas não encontrariam
    ali as portas trancadas. Se ali forem, não se lhes pede colaboração mas subserviência:
    que vão para os estábulos de Ágio, sem esperança de um novo Hércules.


    Por isso dizemos, com sobradas razões, que a F. E. B. explora o nome de Kardec
    e o prestígio de suas obras, para fazer, à custa do Codificador, a propaganda
    do roustainguismo. Até hoje os espíritas de fala portuguesa não dispõem de uma
    edição fiel e completa das obras de Allan Kardec; ao contrário, enquanto duas
    ou mais de suas obras ficam esgotadas durante anos, a F. E. B. cata trechos de
    livros do mestre francês para se aproveitar da expressão de seu nome e enxertar,
    subrepticamente, a propaganda do roustainguismo, que Kardec combateu decididamente.
    Isto pode ser visto numa obra que Kardec não escreveu, mas que o Dr. Guillon Ribeiro
    traduziu - Introdução ao Estudo da Doutrina Espírita.


    Com o roustainguismo o caso é diferente. Para o justificar melhor ainda que no
    original, a F. E. B. não trepidou em alterar certas passagens da Bíblia, fazendo
    uma tradução em desacordo com o original e, pois, fugindo duplamente à verdade
    num tremendo esforço de engodar a massa dos crentes, para explorar a sua simplicidade,
    a sua boa fé, a sua capacidade de pagar para ser ludibriada e depois escarnecida
    pela injusta, ilógica e odiosa divisão do Sr. Gomes Braga.


