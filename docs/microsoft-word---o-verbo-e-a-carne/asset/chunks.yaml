    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    22


    Por sinal que Kardec adverte, no artigo refutado por Roustaing, que não havia
    possibilidade de interpretações discordantes no tocante às questões morais do
    Evangelho. As "muitas moradas da Casa do Pai" constituem um problema de evolução
    moral. Como era preciso discordar de qualquer maneira, para que a "nova revelação"
    fizesse jus ao nome de "revelação da revelação", os "ministros de Deus"


    encontraram como sempre uma saída ilógica.


    **X**


    ## **A METEMPSICOSE DE ROUSTAING**


    Mas há um aspecto do problema da reencarnação em Roustaing que


    merece tratamento especial. Como que tentando reajustar o sistema evolutivo de
    Kardec, admiravelmente harmonioso, coerente e portanto lógico, os "ministros de
    Deus" estabelecem uma estranha ligação entre os mundos fluídicos e os mundos materiais.
    Conseguem isso através de um expediente ridículo, determinando o retrocesso evolutivo
    dos espíritos altamente evoluídos, que nunca precisaram de encarnarse. Esses espíritos
    angélicos repetem no roustainguismo a façanha de Lúcifer, o anjo rebelado, mas
    de maneira deprimente, sem nenhum sinal da grandeza satânica da revolta bíblica.


    Há três pontos que devemos considerar, no exame desse problema, com muita atenção:


    1o.) Roustaing é um decalque de Kardec, mas em sentido caricato. Sua doutrina
    é uma caricatura da Doutrina Espírita com todas as deformações intencionais destinadas
    a ridicularizar o Espiritismo.


    2o.) Roustaing – e com ele os "ministros de Deus" – não foi capaz de compreender
    o problema da evolução do espírito22 em Kardec. O processo contínuo e seqüente
    da evolução foi quebrado pela teoria roustainguista, dando ocasião a um retrocesso
    que devolve a doutrina da reencarnação à metempsicose antiga.


    3o.) O restabelecimento da metempsicose não sendo mais possível, diante da lúcida
    argumentação kardeciana a respeito e da natural evolução da cultura, os pseudo-teóricos
    da "revelação da revelação" foram cair mais uma vez na armadilha do ilogismo,
    oferecendo-nos uma doutrina monstruosa da queda dos anjos, que só não apavora
    porque provoca riso.'
