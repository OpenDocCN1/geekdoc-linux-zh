    línguas, também referidas no primeiro artigo. Assim, transcrevendo na mesma ordem,
    apenas os trechos dos versículos onde aparece a palavra `carne`, lemos:


    - Na `King James Version` (de 1611) : "And the Word was made flesh";


    - "God was manifest in the flesh"; - "being put to death in the flesh"; - "Forasmuch
    61 O Rev. Othoniel Motta publicou, em principies da década de 40, o livro `Temas
    Espirituais,` no qual relata suas experiências espíritas, reconhecendo a realidade
    das comunicações mediúnicas e até mesmo estampando um clichê de comunicação psicográfica
    de amigo falecido, cuja caligrafia e assinatura reconheceu. Apesar disso, concluiu
    o livro apelando para a explicação demoníaca. Faltava-lhe a “chave” (H.P.).


    # O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    70


    "then as Christ hath suffered for us in the flesh"; - "Every spirit that confesseth
    that Jesus Christ is come in the flesh is of God"; - "And every spirit that confesseth
    not that Jesus Christ is come in the flesh is not of God"; - ... who confess not
    that Jesus Christ is come in the flesh".


    - A `Vulgata Latina`, que não havíamos citado anteriormente, porque não a possuíamos,
    assim concorda: - "Et Verbum carne factum est et habitavit in nobis"; - quod manifestam
    est in carne, justificatum est in spiritu"; - "mortificatus quidem carne, vivificatus
    autem spiritus"; - "Christo igitur passo in carne"; - "omnis spiritus qui confitetur
    Jesus Christum in carne venisse ex Deo est"; - "et omnes spiritus qui solvit Jesum
    ex Deo non est"; - "qui non confitetur Jesum Christum in carnem".


    A velha Bíblia italiana de `Diodati`, já anteriormente referida, diz: "E Ia Parola
    è stata fatta carne, ed è abitata fra noi"; - "é stato manifestato em carne, é
    stato giustificado em spirito"; - sendo mortificado in carne, ma vivificado por
    lo Spirito";


    "che Christo ha sofferto per noi in carnes - "ogni spirito che confessa Gesú Cristo
    venuto in carne, é da Dio"; - "E ogni Spirito che não confessa Gesú Cristo venuto
    in carne, não é da Dio"; - "molti seduttori, i quali não confessano Gesú Cristo
    esser venuto in carne".


    Agora, em língua francesa, em vez de citar a Bíblia de `Segond`, como havíamos
    feito anteriormente, transcreveremos as passagens da Bíblia da `Lemaistre` de
    Saci, de 1936, conforme o texto da edição de 1759, a mesma que foi usada por `Allan
    Kardec`. E o fazemos graças à solicitude de um amigo e confrade que se interessou
    por nossos artigos. Eis as passagens, na mesma ordem: - "Et le Verba a été fait
    chair, et il a habité parmi nous";


    .- "... qui s''est fait voir dans Ia chair, a été justifié par l''Esprít"; - "...
    étant mort en sa chair, mais étant ressuscité par l''Esprit". - "...Jésus Christ
    a souffert Ia mort em sa chair"; - "Tout esprit qui confesse que Jesus Christ
    est venu dans une chair véritable, est de Dieu"; - "et tout esprit qui divise
    Jésus Christ n''est point de Dieu"; - "... qui ne confessent point que Jésus Christ
    est venu dans une chair véritable".


    Não se pode desejar melhor concordância; contudo, se nos reportamos aos textos
    gregos, ali encontraremos sempre a voz `σχρξ` carne. Razão pois, tinha `Allan
    Kardec` para impugnar, como impugnou, que Jesus Cristo tivesse sido um agênere.
    E se o leitor interessado não tiver lido nosso artigo anterior, onde fizemos transcrições
    `da` opinião do `Codificador` sobre a matéria, lembramo-lhe as seguintes passagens:
    `O Evangelho Segundo o Espiritismo` 62 páginas 18 e seguintes, onde `apoia a autoridade
    da doutrina` `espírita na universalidade de ensino dos Espíritos`;; e `A Gênese`
    63, Capítulo XIV, item 36 e Capítulo XV, itens 65 a 67, onde `Kardec` estuda os
    agêneres e o corpo de Jesus, antes e depois de sua morte, para concluir com argumentos
    de ordem científica, baseado em trabalhos experimentais e, ainda, com argumentos
    ponderosos de ordem moral, que Jesus Cristo não foi um agênere.


    O próprio `Sr. Gomes Braga` traduz um artigo de `Allan Kardec`, no qual há trechos
    de uma conversa do `Codificador` com o Espírito de `São Luís`, a propósito de
    bicorporeidade e de agêneres. Assim, no livro que estamos discutindo, lemos, à
    página 43 o seguinte:


    "5\. Raros ou não, basta que tais fatos ocorram para merecerem atenção. Que sucederia
    se, tomando um tal ser por um homem ordinário lhe fizessem um ferimento mortal?
    Seria morto? - R. Ele desapareceria subitamente como o jovem de Londres. (Veja-se
    o número de dezembro de 1858, da `Revista Espírita` "Fenômeno de bicorporeidade").


    Mais adiante, à página 46, temos: "14\. Se tivéssemos um desses seres em nosso
    interior, seria isso um mal? - R. Seria antes um mal".

