- fmt: '

    Bastam esses itens para termos a prova da `origem misteriosa` da nova revelação.
    O decalque está claro. E os acréscimos são sempre desenvolvimentos imaginários.
    Neste caso, como em muitos outros, o acréscimo demonstra a falta de compreensão
    e assimilação do ensino espírita. Roustaing admite, ante a infalibilidade dos
    `ministros de Deus` sem nenhuma prova ou investigação a respeito, que Deus estabeleceu
    um privilégio absurdo para os Espíritos que seguiram o caminho do bem: eles "chegam
    à perfeição, tendo progredido no estado fluídico". Isso vai levá-lo a aceitar
    também duas escalas de mundos: a fieira dos mundos materiais e a fieira dos mundos
    fluídicos.


    Entretanto, Kardec explica o seguinte:


    > "Os Espíritos que seguem desde o princípio o caminho do bem nem por isso são
    perfeitos. Se não têm más tendências, não estão menos obrigados a adquirir a experiência
    e os conhecimentos necessários à perfeição". (**Comentário ao item 127.**) Por
    isso, a necessidade da encarnação `para todos os espíritos` está patente, à revelia
    de Roustaing, no texto roustainguista. Se os espíritos procedem do princípio inteligente,
    por desenvolvimentos sucessivos e progressivos através dos reinos da Natureza,
    como podem saltar repentinamente por cima das leis naturais e penetrar no plano
    dos espíritos perfeitos, onde a reencarnação não é mais necessária? Eles podem,
    graças ao livre arbítrio, escolher entre o bem e o mal, mas acaso esse próprio
    discernimento não provém da experiência e do conhecimento? Como provam a sua capacidade
    de manter-se no caminho do bem se não forem submetidos às tentações e atrações
    da existência carnal, no prosseguimento natural da sua evolução?


    Mas a tentação da novidade, o desejo de encontrar uma saída para o maravilhoso,
    a fascinação do imaginário é um abismo permanentemente aberto aos pés do roustainguismo.
    Os `ministros de Deus` não suportam a estreiteza lógica do raciocínio humano.
    Precisam do hipotético, do utópico, da fábula 19 de que falava o apóstolo Pedro
    e escapam da realidade pela porta da fantasia. O espírito que lentamente se formou
    nos reinos naturais, pela progressiva individualização do princípio inteligente,
    mal chegou à condição – não humana, mas de entrar no reino hominal – já se atira
    com asas de Ícaro em direção ao Sol.


    Adquirida a condição de entrar no reino hominal, o espírito está na condição da
    criança, como assinala Kardec, e terá de aprender na família, com os primeiros
    rudimentos da sociabilidade, e posteriormente na escola, depois ainda no trato
    social, no processo das relações humanas 20, as grandes lições da vida que o prepararão
    para os cursos superiores dos mundos mais adiantados. "Tudo se encadeia no Universo"
    – ensina `O Livro dos Espíritos` – e particularmente no item 540: "desde o átomo
    primitivo até o arcanjo, pois ele mesmo começou pelo átomo". Essa concepção monista
    do Universo, que corresponde ao monoteísmo, ligando numa estrutura única o conceito
    de Deus e o conceito de Criação, é a conquista superior do homem que o roustainguismo
    pretende devolver ao pluralismo antigo. Kant considerou a idéia de Deus como a
    mais elevada que o homem pode conceber, porque essa idéia é a síntese suprema,
    o mais alto grau da abstração mental. Mas o roustainguismo esfarela tudo isso
    no seu delírio mágico, no seu desejo insano de retornar ao primitivo.


    É o que vemos na sua teoria dos mundos fluídicos e materiais, desligados entre
    si como dois ramos antagônicos da Criação. Uma espécie de masdeísmo 21, em que
    Deus e o Diabo dividem o Universo em dois reinos igualmente brutais: o do bem
    e do mal, pois nem o bem pode ser puro em face do mal permanente. Vejamos o texto:


    > "Mundos fluídicos, destinados à habitação de espíritos que, desde o estado de
    infância e de instrução, nunca faliram, e que, conservando-se sempre puros na
    senda do progresso, progridem no estado fluídico".

    >

    > "Mundos materiais -- ''Diversos mundos destinados à encarnação dos espíritos
    falidos e, como tais, sujeitos à encarnação humana''".


    Os `ministros de Deus` não perceberam que não se trata de duas fieiras, de um
    processo descontínuo, mas de uma continuidade natural, em que os mundos fluídicos
    representam a fase superior de desenvolvimento dos mundos materiais. Como diz
    o provérbio: ouviram cantar o galo, mas não sabem onde.


    ---

    19 "Porque não seguimos fábulas engenhosas quando vos fizemos conhecer o poder
    e a vinda de nosso Senhor Jesus Cristo, pois nós fôramos testemunhas oculares
    da sua majestade" (2 Pedro; 1:16).

    20 “Os homens em conjunto produzem um ambiente humano, com a totalidade de suas
    formações sócio-culturais e psicológicas. Nenhuma dessas formações pode ser entendida
    como produto da constituição biológica do homem, a qual, conforme indicamos, fornece
    somente os limites externos da atividade produtiva humana. Assim como é impossível
    que o homem se desenvolva como homem no isolamento, igualmente é impossível que
    o homem isolado produza humano.”

    21 Religião antiga dos iranianos (persas), caracterizada pela divinização das
    forças naturais pela admissão de dois princípios em luta, `aúra-mas` (Deus do
    bem) e `arimã` (Deus do Mal ou Demônio).

    22 O Verbo e a Carne – 2 Análises do Roustainguismo


    ## A METEMIPSOSE DE ROUSTAING


    Mas há um aspecto do problema da rearnação em Roustaing que merece tratamento
    especial. Como que tentando reajustar o sistema evolutivo de Kardec, admiravelmente
    harmonioso, coerente e portanto lógico, os `ministros de Deus` estabelecem uma
    estranha ligação entre os mundos fluídicos e os mundos materiais. Conseguem isso
    através de um expediente ridículo, determinando o retrocesso evolutivo dos espíritos
    altamente evoluídos, que nunca precisaram de encarnar. Esses espíritos angélicos
    repetem no roustainguismo a façanha de Lúcifer, o anjo rebelado, mas de maneira
    deimente, sem nenhum sinal da grandeza satânica da revolta bíblica.


    Há três pontos que devemos considerar, no exame desse problema, com muita atenção:


    1o.) Roustaing é um decalque de Kardec, mas em sentido caricato. Sua doutrina
    é uma caricatura da Doutrina Espírita com todas as deformações intencionais destinadas
    a ridicularizar o Espiritismo.


    2o.) Roustaing – e com ele os `ministros de Deus` – não foi capaz de compreender
    o problema da evolução do espírito em Kardec. O processo contínuo e seqüente da
    evolução foi quebrado pela teoria roustainguista, dando ocasião a um retrocesso
    que devolve a doutrina da encarnação à metempsicose antiga (Berger, P. e Luckman,
    T. Ação Social da Realidade, p. 75).


    3o.) O restabelecimento da metempsicose não sendo mais possível, diante da lúcida
    argumentação kardeciana a respeito e da natural evolução da cultura, os pseudo-teóricos
    da "revelação da revelação" foram cair mais uma vez na armadilha do ilogismo,
    oferecendo-nos uma doutrina monstruosa da queda dos anjos, que só não apavora
    porque provoca riso.

