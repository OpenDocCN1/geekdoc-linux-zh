    Ravel, girando em parafuso para levar o leitor ao fundo de um poço. Mas lá não
    se encontra a Verdade em sua nudez lendária e sim o dragão 23 de boca chamejante.


    Toda a força obsessiva de Roustaing, que primeiro o tragou para depois tragar
    os outros, está nesse processo alucinador. Veja-se este slogan repetido do primeiro
    ao quarto volume: `segundo a letra, sob a capa do mistério, sob o prestígio do
    milagre`.


    O leitor o lê e ouve pela primeira vez no prefácio. E dali por diante não deixa
    mais de vê-lo e ouvi-lo. É a técnica umbralina da obsessão, segundo o método hipnótico.


    Repetir, repetir e rodar sem parar. A mente adormece e o espírito se entrega.


    Isso explica a recomendação dos pregoeiros do roustainguismo: voltar à posição
    zero antes de iniciar a leitura da obra, desprevenir a mente, abandonar-se ao
    relax consciencial, abdicar do julgamento. Só assim o leitor se porá em condições
    de abrir o terceiro olho que enriqueceu Lobsang Rampa. E ao abrir esse olho demoníaco
    fechará para sempre os dois que Deus lhe deu para ver com clareza e precisão.


    O tom místico da obra, não do Misticismo `elevado 24` que leva ao êxtase, mas
    do misticismo fanático que arrasta à fascinação, pode ser facilmente exemplificado
    por este breve trecho em que a humildade e a arrogância, a ingenuidade e a esperteza,
    a reverência e a malícia se revezam na movimentação do circuito obsessivo. Roustaing,
    o Revelador, o novo Messias, conta primeiro o que recebeu:


    "Em maio de 1865 todos os materiais estavam preparados, tanto a respeito dos Evangelhos
    como dos Mandamentos. O aviso de dar a conhecer aos homens, de publicar a obra
    da revelação me foi espontânea e mediunicamente transmitido em `termos precisos`."


    E a seguir desencadeia as forças emocionais do caos, que vão num crescendo da
    humildade até à onipotência. Atrás dele estão Moisés, os evangelistas e os apóstolos:


    "Mero instrumento, cumpri meu dever executando tal ordem, entregando à publicidade
    esta, obra, que põe em foco a essência de tudo o que há de sublime na bondade
    e na paternidade de Deus; tudo o que há de devotamento, de abnegação e de sentimentos
    fraternais em Jesus, chamado o Cristo, que tão bem mereceu o título de salvador
    do mundo, de protetor da Terra".


    "A meus irmãos, quaisquer que eles sejam, quaisquer que sejam suas crenças, o
    culto exterior que professem, corre o dever de não se distanciarem sobre esta
    obra senão depois de a terem lido integralmente e de terem seriamente meditado
    na explicação dos Evangelhos e dos Mandamentos. Indivisível no conjunto, suas
    diversas partes são solidárias e mutuamente se apoiam".


    Temos a impressão de ouvir, nesse ritmo solene, o próprio Moisés advertindo o
    povo ou Maomé proclamando a supremacia do Alcorão. Qual o espírito ingênuo e ansioso
    de superação de si mesmo, quem não se emocionará com esse tom de súplica e de
    ordenação ao mesmo tempo? As cabeças se curvam ante a vontade do Eterno. Os corações
    batem descompassados. É a hora em que as correntes de fluídos estrondam como trovões
    e arrebentam em raios no alto do Sinai, segundo a explicação final do livro. A
    hora em que a tábua das leis vai cair sobre Israel. A liberdade cristã é uma promessa
    distante, mas os espíritos crédulos a esperarão através 23 `“... e adoraram o
    dragão, porque deu à besta a sua autoridade; e adoraram a besta, dizendo: Quem
    é semelhante à besta? quem poderá batalhar contra ela?”` (Apocalipse; 13:4).


    > 24 Armstrong, K. Uma História de Deus, cap. 7.


