    \ posteriormente, como espírito, apoia\".\n\nContestamos, baseado no bom senso,\
    \ a afirmativa de que a obra de `Collignon` tenha hoje caráter de universalidade,\
    \ porque espíritos a confirmaram através de médiuns. Quando uma coisa alcança\
    \ um certo número de países, diz-se que é internacional; universal, pela própria\
    \ etimologia é aquilo que é peculiar ou relativo ao universo, isto é, à totalidade\
    \ dos países do mundo. Ninguém sabia que um fato ou a confirmação de um fato na\
    \ Casa de Passos pudesse ter assim, um caráter universal. Até parece que esse\
    \ \"universal\" é mera tradução da voz grega `catholikos` e que não estamos longe\
    \ de ver a gente da Casa de Ismael proclamá-la em Vaticano, como sede gestatória,\
    \ para carregar o `pontifex-maximus`, à maneira dos cônsules romanos.\n\nSe não\
    \ bastar a inanidade do argumento do `Ismael`, bastará fazer algumas citações\
    \ da obra de `Kardec`. É mesmo interessante seguir esta via, porque o Sr. de Braga\
    \ – e nisto estamos de acordo – não admite se mutile ou altere a obra de `Kardec`.\n\
    \nAntes, porém, vejamos o caso dos médiuns. `Francisco Cândido Xavier` é médium\
    \ que está desempenhando notável tarefa no cenário espírita nacional e deve estar\
    \ sendo usado levianamente em negócio, pois é usar o prestígio por ele conquistado\
    \ entre os espíritas para valorizar uma teoria que a maioria dos profitentes da\
    \ doutrina impugna e sobre a qual os seus guias mantêm um discreto silêncio. Aquele\
    \ médium está sendo pela `F. E. B.` usado na questão roustainguista como Pilatos\
    \ no Credo.\n\nÉ possível que os espíritas recentes o ignorem: mas faz ainda muitos\
    \ anos o jornal `Mundo Espírita` denunciou, em artigos assinados por pessoa de\
    \ grande estatura moral e de projeção social – o Sr. General Araripe de Faria\
