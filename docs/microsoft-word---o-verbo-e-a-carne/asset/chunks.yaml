  trans: '

    他是否寻求过与 `Allan Kardec` 结盟，并在目标上并行工作或融合？他是否曾将那些所谓的福音传播者、门徒及其“帮派”的消息提交给其他学者的审慎批判进行审查，而这些学者在
    `Allan Kardec` 执行使命期间就已经拥有丰富的批判能力？41。


    没有；他没有这样做。他寻求了孤立。他从那些直插天空的哥特式教堂中如箭般挺立而出，仿佛在一直宣告着：我！


    `Kardec` 曾允许 `巴黎灵性学会` 受到 Roustaing 者的渗透。当这位编码者离世后，那些“耶稣既不是神也不是人”的追随者便占据了学会的关键职位，并毫无廉耻地篡改了导师的作品。


    这证明了什么？


    一种事业的绝望、一个传教士的失败以及一种固执、一种集体的痴迷，这无疑是且确实是反基督的作品。


    承认这一点很令人难过，但事实是，如果 `Roustaing` 是一位传教士，那么他在第三次启示教义方面尤其是一个失败者，因为他扭曲了 `耶稣基督` 的教义
    42。


    ***


    `Gomes Braga` 先生是否认为 `Roustaing` 被负责组织信仰的工作，并为先前的启示提供了确认？


    正如上文和前文所述，我们已经看到，`Roustaing` 及其追随者在教义领域的行动，因其对圣经文本的扭曲性质，过去和现在都是反基督的，因此不能被视为对 `Kardec`
    使命的辅助。只需记住，正是 Roustaing 主义导致了碎片化和分裂主义进入了法国灵性主义圈层，损害了由 `Allan Kardec` 创立的 `巴黎灵性学会`
    已经在开展的社会事业，尽管此人的注意力主要集中在教义性著作上 43。


    在这样研究了第一个论点的论点的第一部分后，让我们来看第二部分：“负责组织信仰的工作”。


    ***


    `Kardec` 从三个基本维度考虑了灵性论：科学的、哲学的和宗教的；但他从未声称灵性论是一种`宗教` 41 `Camille Flammarion`、`Leon
    Denis`、`Gabriel Delane` 等人。


    42 《四部福音》是对教义以及 `耶稣` 本人生活的扭曲。只有作者提到的集体痴迷才能解释这种对传播这部黑暗作品的执着。（H.P.）。


    43 `救济箱`和`疗养院`是 `Kardec` 理想化的社会援助机构，他在去世前已在 `Vila Segur` 开始建造用于援助的房屋，那片土地是他在 `Segur
    大街`，即 `伤兵广场（Inválidos）` 后方购买的。（H.P.）。


    道与肉身 —— 对 Roustaing 主义的两项分析 ______________________________________________


    54


    宗教 44。在多部著作中，我们一直认为，根据宗教的经典概念 45，宗教受限于社会环境的影响，可以从两个方面来考虑：内在性和外在性。前者通过研究、冥想和应用于生活高层次目标的知识来发展，不通过外部信号感知；后者是时尚、是仪式、是礼仪，是所有向感官诉说并逐渐将宗教实践转化为一种心理自动化的东西。前者提供理解并拓宽精神视界；后者限制智力并制造狂热
    46。


    无论如何，由于宗教领导人的安于现状和利益，最后这一点在所有崇拜、所有时代都占据主导地位。


    因此，宗教的特征本质上如下：1. 一组被强加于理性并转化为信仰条文的教条；2. 一种或或少程度华丽的仪式，我们可以追溯其起源，并在宗教混杂和集体心理现象中寻找其意义，这些现象在所有民族中都可怕地顽固，尽管其产生动因略有不同；3.
    一种指导第二个方面并守护且扩大第一方面的祭司阶级制度。


    尽管在 `Kardec` 的作品中偶尔发现 `dogma（教条）`一词，但它出现更多是指`教义的不可动摇点`，即根据事实和由此产生的结果建立的观点，而不是`信仰的不可动摇点`——后者是建立的，或者说是被强加的，即使它冲击理性且缺乏逻辑论据的支持。正如此，`Kardec`
    系统地告诉我们灵性论不是一种宗教 47。


    44 `Kardec`, A. `Revistarita` 1864, p. 203 – 1868 , págs. 351 a 360.


    45 `Eliade`, M. `Origens`, p. 9.


    46 “宗教痛苦既是真实痛苦的表达，也是对真实痛苦的抗议。受压造物的叹息，受压者的心，


    4..,,,,,,,,.


    4. 单词 `dogma` 的意思是`postulado`。灵性论中有`dogmas of reason, dogmas of faith..,,,,,,,,,.


    47 单词 `dogma` 的意思是`postulado`。灵性论中有`dogmas of reason, dogmas of faith. 有必要建立这种区分。在宗教方面，经典的,,的
    `bergsoniana. 灵性论属于了 `Henri Bergson` 的`静态宗教` `社会`。


