- fmt: '

    Esse `kritérion`, que constitui uma das partes fundamentais do método kardeciano
    16, jamais beneficiou a obra de Roustaing. O que nela se encontra, excluído naturalmente
    o decalque geral da obra de Kardec, é simples opinião pessoal dos espíritos reveladores,
    que se enfeitaram, como dizia Kardec, com os nomes veneráveis dos evangelistas,
    dos apóstolos e de Moisés. Esse enfeite, por si só, não oferece nenhuma garantia
    de legitimidade. Por outro lado, a vulgaridade da linguagem e das interpretações,
    e mais ainda o ridículo das passagens que já analisamos – e de muitas outras que
    qualquer leitor de bom senso encontrará em abundância nos textos – provam de sobejo
    contra a pretensão reveladora da obra.


    A ingenuidade de Roustaing, que foi colhido na sua vaidade pelos espíritos enganadores,
    revela-se na própria publicação de um livro decalcado da obra de Kardec, na época
    tão em evidência na França e no Mundo. Uma pessoa da sua posição, dotada de um
    pouco mais de bom senso, não teria a coragem de lançar esse plágio evidente, que
    se denuncia em cada passagem do texto, disfarçado apenas com os acréscimos de
    imaginação, os quais não passam, também, de repetições cansativas de hipóteses
    combatidas no Cristianismo desde a era apostólica e condenadas nas epístolas do
    Novo Testamento.


    Essa renovação do Docetismo 17, heresia do II século da era cristã, equivale a
    um retrocesso histórico. A revelação da revelação regride nada menos de dezoito
    séculos. E não obstante pretende provar que corresponde à era moderna, estando
    de perfeito acordo com as conquistas científicas. Roustaing refuta a acusação
    de docetismo que Kardec faz à sua obra alegando que os Docetas não conheciam a
    mecânica da gravidez aparente e do parto aparente. Entende que a sua 16 “Uma só
    garantia séria existe para o ensino dos Espíritos: a concordância que haja entre
    as revelações que eles façam espontaneamente, servindo-se de grande número de
    médiuns estranhos uns aos outros e em vários lugares. Se, portanto, aprouver a
    um Espírito formular um sistema excêntrico, baseado unicamente nas suas idéias
    e com exclusão da verdade, pode ter-se a certeza de que tal sistema conservar-se-á
    circunscrito e cairá, diante das instruções dadas de todas as partes, conforme
    os múltiplos”. (ESE; Introdução).


    17 **Docetas** – do grego `dokein: aparecer`. Seita derivada do gnosticismo, tendo
    como representantes principais Dociteu e Saturnino, negavam a realidade carnal
    de Jesus e por isso, não aceitavam seu nascimento, paixão e ressurreição. Consideravam
    seu corpo como “Fantasma” (Fluídico) e os seus feitos, apenas aparente.


    O Verbo e a Carne – 2 Análises do Roustainguismo


    doutrina é nova porque explica a encarnação fluídica do Messias. A verdade é que
    pouco importa essa mecânica imaginária.


    A palavra Docetismo vem do grego (doceta) que quer dizer: crença numa aparência.
    Vejamos a definição que lhe dá `Dictionnaire Encyclopédique`: heresia do segundo
    século que consistia em pretender que o filho de Deus só tinha carne aparente,
    que só havia nascido, vivido e sofrido em aparência.


    Roustainguismo, por acaso, diz outra coisa? Roustaing escuda-se num sofisma, afirmando:
    "O Espírito puro não pode aparecer em um mundo fluídico, imediatamente às regiões
    dos fluídos puros que ele habita, senão por encarnação ou incorporação voluntária".
    A encarnação fluídica é explicada com o exemplo das materializações de King, com
    uma diferença: a de Jesus se serviu, sem que disso realmente necessasse, da mediunidade
    de Maria. Assim, seu corpo aparente não era carnal, mas de uma carne refinada.
    Só a chamada do absurdo, que é uma espécie de antilogia, poderia tornar aceitável
    esse jogo de palavras. E com isso procura safar-se da acusação de docetismo acertadamente.
    O elemento fundamental desta doutrina é o preconceito, a consideração das leis
    naturais como impuras. Teria Jesus esse preconceito? Ele, que dizia filho do homem,
    que condenava e contraria os preceitos da lei de pureza, teria exigido um privilégio
    para a sua encarnação entre os homens? Ele que se colocou em tudo ao nosso lado,
    chegando a afirmar que tudo o que fazia – até mais do que ele fazia – teria recusado
    a aceitar um nascimento natural? O Espiritismo, que considera as leis naturais
    como de Deus, poderia endossar o docetismo sem cair em contradição com os seus
    princípios fundamentais? São estes os problemas que escaparam à perspicácia do
    advogado, à ingenuidade de Roustaing e à simplicidade dos seus adeptos atuais
    – porque a revelação se proclama, entre outras coisas, a iniciadora da fase teológica...
    Mais uma vez o advogado e seus seguidores, acompanhados pelos ministros de Deus,
    esquecem de que o Livro dos Espíritos começa pela definição de Deus. Essa definição
    iniciou, muito antes de Roustaing, os estudos teológicos no Espiritismo.


    ## IX REENCARNAÇÃO E ESCALA DOS MUNDOS


    A encarnação é necessária? perguntou-me um neorstainguista em França, após uma
    palestra. Se não – respondi – porque estamos encarnados? O confrade que atravessava
    a fase deslumbramento provocada pela nova revelação quis demonstrar-me que, segundo
    Roustaing, há espíritos que nunca se encarnaram e não têm necessidade da vida
    corprea. A tese se encontra no cap. 14 do Tomo IV, referente ao cap. 40 do Evangelho
    de João. Os ministros de Deus estudam nesse tópico a evolução da essência espiritual
    e repetem mais uma vez, de maneira necessariamente confusa, o ensino dos Espíritos
    a Kardec: Mateus; 24:27, Lucas; 18:31 e Hebreus; 2:6.


    "Como não ignorais, a essência espiritual, para ir do seu ponto de origem ao período
    preparatório do estado espiritual de inteligência independente, livre responsável,
    revestida de razão e livre arbítrio, tem que passar, conforme explicamos tratando
    do espírito, pelas fases sucessivas e progressivas da materialização nos reinos
    mineral e vegetal e da encarnação no reino animal. Tem que passar depois por aquele
    período preparatório. Transposto esse período e uma vez de posse do livre arbítrio,
    ela se acha na condição de Espírito formado, mas em estado de simplicidade, de
    ignorância, de inocência, cumprindo-lhe passar pela fase da infância e da instrução
    e ser, pelos seus guias, colocada em situação de se servir do livre arbítrio".


    "Então, no gozo da sua independência e da sua liberdade, que de uma e outra decorrem,
    escolhe o Espírito o caminho que prefere tomar. Se se conserva puro no progresso,
    dócil a seus guias, seguindo constantemente a estrada simples e reta que lhe é
    indicada, chegai à perfeição, tendo progredido no estado fluídico. Torna-se assim
    puro Espírito, Espírito que não faliu, de pureza perfeita e imaculada, tal como
    Jesus, protetor e governador do nosso planeta". Roustaing leu no Livro dos Espíritos
    o tópico referente à progressão dos Espíritos. Ali encontrou os seguintes itens:


    120 - Todos os Espíritos passam pela fieira do mal para chegar ao bem?

    R. - Não pela fieira do mal, mas pela da ignorância.


    12,1 - Por que alguns Espíritos seguiram o caminho do bem e outros o do mal?

    R. - Não têm eles o livre arbítrio? Deus não criou Espíritos maus. Criou-os simples
    e ignorantes, ou seja, tão aptos para o bem como para o mal. Os que são maus,
    assim se tornaram por sua vontade.

