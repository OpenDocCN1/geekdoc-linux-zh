    拉威尔（Ravel）正螺旋着旋转，将读者带入井底。但那里发现并非传说中赤裸的真理，而是一只喷着火的 23 号巨龙。


    鲁斯塔因（Roustaing）所有的痴迷力量——他先吞噬了自己，随后吞噬了他人——都在这个幻幻的过程中。看看这个从第一卷到第四卷不断重复的口号：`根据字面，在神秘的外壳下，在神迹的光环下`。


    读者在序言中第一次阅读并听到它。从那以后，他们再也无法不看到、听到它。这是一种根据催眠方法的“门槛式”痴迷技术。


    重复，重复，不停地旋转。大脑陷入沉睡，灵魂交出自我。


    这解释了“鲁斯塔万主义”教士们的建议：在开始阅读作品之前回到零位置，放下大脑戒备，投身于意识的放松，放弃判断。只有这样，读者才能具备开启那只让洛桑·兰帕（Lobsang
    Rampa）受益的第三只眼。而当他们睁开这只魔之眼时，将永远关闭上帝赐给他们用来清晰和精准观察的双眼。


    作品的神秘主义色调，并非那种通往狂喜的“高雅 24”神秘主义，而是那种引人入魔的狂热神秘主义。这段简短的文字很好地说明了谦卑与傲慢、天真与聪明、敬畏与恶意在痴迷回路的运动中轮换。鲁斯塔因，这位启示者、新的救世主，首先讲述了他收到的内容：


    “1865 年 5 月，无论是福音还是律法，所有材料都已准备就。向人类公布、出版启示作品的通知，是我自发地通过媒介以`精确的术语`传达给我的。”


    随后，他引发了混沌的情绪力量，这些力量从谦卑到全能不断增强。在他身后的是摩西、福音书作者和使徒们：


    “我仅仅是一个工具，执行这一命令履行了我的职责，将这部作品交由公众。它聚焦了上帝的善良与父性中一切崇高的本质；它聚焦了耶稣（被称为基督）身上一切奉献、无私和兄弟情谊，他完全配得上世界救世主和地球保护者的称号。”


    “对于我的兄弟们，无论他们是谁，无论他们的信仰如何，无论他们进行何种外在崇拜，他们都有义务在完整读完这部作品，并认真思考对福音和律法的解释之后，不要远离这部作品。作为一个整体它是不可分割的，其各个部分是密不可分且相互支撑的。”


    在这种庄严的节奏中，我们仿佛听到了摩西本人在警告民众，或是穆罕默德在宣布《古兰经》的至高无上。这种天真且渴望超越自我的精神，谁能被这种既是恳求又是命令的语调所打动呢？人们在永者的意志面前低下了头。心跳乱了节奏。根据书中最后的解释，那是流体之链如雷鸣般轰鸣，并在西奈山顶爆发成闪电的时刻。那是法典即将落在以色列之上的时刻。基督的自由是一个遥远的承诺，但迷信的灵将通过启示
    23 `“……他们就拜拜那龙，因为把权柄给了那野兽；又拜拜那兽，说：谁能像那兽呢？谁能与它争战呢？”（启示录；13:4）。`


    > 24 Armstrong, K. 《上帝的历史》，第 7 章。


    道道与肉身——对鲁斯塔万主义的 2 个分析 ______________________________________________


    26


    两千页的内容，等同于被教士教义 25 所扭曲的基督教千年。


    在作品末尾，当“新启示”的资源耗尽，精疲力竭的行者将找到大山和十诫。我们随后回到关于死亡的圣经全景，回到`剑下`26 的屠杀以及对所有暴行行为的神圣辩护。每一个荒谬都有一个解释。每一桩罪行都有其辩护。每一场种族灭绝都有其秘密理由，隐藏在上帝的思想中，但被摩西的魔杖从其神秘中剥夺出来。


    让我们来看看这一辩护推理的`杰作`，它让灵性论变成了从摩西到希特勒、特鲁曼所有种族灭绝的背书。


    选取的圣经片段出自《出埃及记》32:26-29。我们仅抄录主要片段：


    “利未支族的人，他（摩西）对他们说：耶华这以色列的神说：各人拔出腰间的刀，在过营中来来去，杀掉你们的兄弟、你们的朋友、你们的父亲。每人杀死自己的兄弟、朋友、妻子、女儿。利未支族的人，他（摩西）对他们说：耶华这以色列的神说：各人拔出腰间的刀，在过营中来来去，杀掉自己的兄弟、朋友、你们的父亲。每人杀死自己的兄弟、朋友、妻子、女儿。利未支族的人，他（摩西）对他们说：耶华这以色列的神说：各人拔出腰间的刀，在过营中来来去，杀掉自己的兄弟、朋友、你们的父亲。每人杀死自己的兄弟、朋友、妻子、女儿。利未支族的人，他（摩西）对他们说：耶华这以色列的神说：各人拔出腰间的刀，在过营中来来去，杀掉自己的兄弟、朋友、你们的父亲。每人杀死自己的兄弟、朋友、妻子、女儿。”


