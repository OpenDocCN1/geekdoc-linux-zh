    Já agora nova suspeita é levantada contra outra obra psicografada por Xavier.
    Contra o médium? Não: contra os editores, contra a `F. E. B.` Levanta-a o Dr.
    Henrique Andrade, nome prestigioso nos meios espíritas do país, em Aurora, n.°
    191, de 1:° de abril do corrente ano 54.


    É o caso de uma comunicação do espírito de Humberto de Campos, publicada em 1937
    pela Federação Espírita Brasileira, no volume `"Crônicas de Além do Túmulo"` e
    uma passagem do mesmo espírito, no seu livro `"Brasil, Coração do Mundo, Pátria
    do Evangelho"` recebidas ambas por aquele médium e esta publicada em 1938, ou
    seja, apenas um ano após a primeira.


    Na mensagem, Humberto de Campos cita os mais destacados nomes que seguiram o rastro
    de `Kardec`. São eles, pela ordem de citação, tanto vale dizer, de importância:
    Camille Flammarion, Gabriel Delanne e Léon Denis, versando a cosmologia e a filosofia
    sob o ângulo espírita e "inaugurando uma nova época para o pensamento religioso".


    Nem uma palavra sobre Roustaing! ...


    Entretanto, um ano mais tarde, lá vem o mesmo Espírito, na segunda obra referida,
    dizer que a missão de `Kardec` "contaria com uma plêiade de auxiliares de sua
    obra, destacados particularmente para auxiliá-lo, nas individualidades de Baptista
    Roustaing, que organizaria o trabalho da fé, etc."...


    Agora Roustaing passou a perna naqueles três grandes vultos. É incrível que o
    Espírito do ativo maranhense tivesse cochilado na primeira mensagem. Como poderia
    ignorar, como ignorou, a segunda figura do Espiritismo, conforme a sua classificação,
    e que a `F. E. B.` hoje coloca ombro a ombro com Allan Kardec, se não pouco acima?


    Remetemos o leitor para o citado artigo de `Aurora`.


    Agora seja-nos lícito registrar uma impressão que colhemos há muito tempo: a semelhança
    de estilo entre André Luiz, Humberto de Campos e Emmanuel, de um lado e as traduções
    da `F. E. B.`, nestes últimos dez ou doze anos, do outro. Se se fizer um estudo
    meticuloso, além da linguagem demasiado rebuscada, encontraremos muitos símiles
    nas páginas impressas e atribuídas àqueles Espíritos e a fraseologia dos dois
    mais "acreditados" tradutores da `F. E. B.` nesta fase.


    Há um preciosismo de linguagem que não se compadece com o nível cultural da massa
    espírita; há frases feitas e expressões de que fazem um emprego 54 1949. Estes
    artigos foram publicados em 1949 e editados em livro no ano seguinte. (H.P.).


