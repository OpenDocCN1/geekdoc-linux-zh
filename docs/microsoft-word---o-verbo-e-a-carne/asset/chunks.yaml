    ## VII


    ## O Sentido Oculto do Roustainguismo


    Fechemos esta série de artigos de análise do livro do Sr. Ismael Gomes Braga e
    patenteemos o sentido do roustainguismo.


    Nesta análise por vezes fomos ásperos, dessa aspereza chocante mas necessária
    nos ambientes espíritas. Mercê de Deus, entretanto, jamais nos afastamos daquela
    recomendação de Kardec: discutir sem disputar. Nunca deixamos de citar fielmente
    as fontes; nunca faltamos com o respeito à lógica, aos fatos, à verdade.


    Se, de passagem, fizemos referências a pessoas, vivas ou desencarnadas, jamais
    ferimos condições personalíssimas. É que essas criaturas estavam ligadas à projeção
    social de acontecimentos que interessam à gente espirita de modo muito particular.


    Tomaram os espíritas como slogan número um o título de uma obra ditada pelo Espírito
    de Humberto de Campos: Brasil, Coração do Mundo, Pátria do Evangelho. Meditem
    os leitores sobre o conceito aí contido. É possível que o Espírito tenha lá as
    suas razões. Mas como? Quando?


    Os fatos são estes: somos vanguardeiros na fila dos países analfabetos; esquecemos
    que a leitura é necessidade fundamental para a evolução do Espírito; as estatísticas
    mostram elevadíssimo percentual de mortalidade infantil, traduzindo condições
    de vida muito abaixo dos padrões mínimos exigidos pela dignidade humana; a tuberculose,
    que os médicos, a despeito do bacilo, chamam doença social ou moléstia de carência,
    eufemismos sinônimos de fome permanente, faz larga devastação nas Classes médias
    e inferiores. Deixemos de lado quaisquer referências àquilo que não atinja diretamente
    o elemento humano e citemos, ainda, para edificação dos dirigentes espíritas,
    o fato de haverem cientistas de Manguinhos, de parceria com os da Rockfeller Foundation,
    constatado no vale amazônico largas faixas onde o teor de glóbulos vermelhos no
    sangue dos habitantes não vai além dos 35% da taxa normal, o que, por seu caráter
    generalizado, atraiu a atenção para outros aspectos da vida rudimentaríssima daqueles
    nossos irmãos.


    Aproximemos esses fatos de uma frase corrente no pais: Para inglês ver.


    É a orientação que costumamos imprimir às nossas coisas e, parece, a isto se foram
    os espíritas. Aquela civilização importada.


    *****


    Mas um espírito disse... então é dogma.


