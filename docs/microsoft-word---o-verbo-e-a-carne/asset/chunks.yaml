    Testamento ou, por outras palavras, este profetiza e aquele confirma a profecia;
    assim sendo,


    IV - as alterações fundamentais, que o roustainguismo introduz no Novo Testamento,
    abalam infirmando, ou indiretamente alterando o Velho Testamento; V - a obra de
    Allan Kardec está em perfeita concordância com a Bíblia e, em conseqüência, não
    concorda com a de Roustaing.


