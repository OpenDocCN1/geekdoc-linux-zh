    ### A PIEDADE DO POETA


    As razões que demos acima, para explicar o silêncio do poeta, devemos acrescentar
    agora a sua piedade. Porque ele nô-la revela no soneto explicativo que transmitiu
    a Rizzini, diante da exumação desse trecho pela revista da FEB.


    Denunciar o pasticho seria expor médium à crítica irreverente e feri-Ia moralmente.
    Guerra Junqueiro silenciou. Mas agora, que ela já não se encontra mais em foco,
    o esclarecimento se torna possível. Veja-se a forma piedosa pela qual o poeta
    explica o velho caso, na precisão silogística de um soneto alexandrino, acabando
    por um pedido de perdão ao leitor:


