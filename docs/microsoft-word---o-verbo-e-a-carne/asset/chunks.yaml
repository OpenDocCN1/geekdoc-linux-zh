    愤怒如火山焚烧着生命，

    – 枷锁同时束缚并伤害着 –

    粉碎灵魂，却为了使其伟大！……


    如果基督曾是人，那么那位贞洁之女又何在？

    她接纳了那纯洁无染的、

    照亮全个人类的`道`，

    使人类步在真正的道路上吗？！


    耶稣从未陷入过泥沼！


    – `神性本源`，从高处降临

    将众生包裹在同一火焰的光芒中，

    为了引导他们走向善的终点，

    我们理解了基督——`纯洁的本源`！


    我们在耶稣身上看到了超自然，

    被上帝派遣到这片尘世的地球，

    为了将恶的戏丑们逐出去！

    还有谁在对此反抗、颤抖、愤怒，

    因为这个极度荒谬的理论，

    那群知道在祈祷中理解

    那些极易被利用的产物的暴徒。


    因此，圣教自然会造出一个

    一个木制的基督，一个弹簧做的耶稣，

    他在主祭坛上扭曲、闪烁，

    并命令向学校传授教义！

    这个按旧式雕刻的耶稣，

    手里拿着教鞭准备惩罚恶人，

    我们必须从他躲藏的地方将其赶出去。


    让我们粉碎那个木头入侵者，

    他欺骗了顺从的民众，

    他们认为上帝要求乞讨

    而不是施舍！他们正匆忙、鲁莽地，

    跟在那些戴着主教帽和披肩带的戏丑身后……


    噢！让我们释放那些脆弱的孩子，

    怪物们正试图引导他们！……噢！上帝！……

    – 在我们的灵感中赐予无敌的长矛，

    让法利赛人的王座倒塌！

    在我们的灵感中赐予钢铁铠甲，

    能够抵御严酷的刺击，

    而我们不会因疲劳而倒下，

    或在道路的泥泞中沉沦……


    狼群愤怒了，试图夺回

    他们失去的东西。自由思想者，

    `道`与肉身 – 鲁斯坦格主义的 2 个分析 39


    联合吧！战斗吧！履行你们的职责！

    对抗那所有的伪装者；

    让你们的抗议成为坚固的墙，

    恶意的波浪在上面徒劳地撞击

    —— 因为一种奇异的力量缠住了你们，

    并命令你们为了人类的利益而战斗！


    联合吧！释放童心的心；

    召唤孩子们走向未来，走向光明！

    欢呼吧——耶稣……完全是神性的本源……

    噢！去夺回那些跳梁的斗篷吧，

    他们正对你们发动最后的进攻，

    将幼小的生命体束缚在教义中，

    那是生命黑暗中的爱之黎明！……


    去告诉他们：– 你们放任自流了吗？！

    试图再次锁住光明吗？！

    噢，看吧：自由的思想今日是反叛的浪潮，

    上帝的灵感正为此涌动……

    我们并不害怕，不，害怕你们的进攻；

    我们曾像你们一样——顽固而邪恶，

    我们通过自己的生命看到

    我们自己的灵魂在腐烂、在混沌中摇晃……

    我们拥有免疫且受启蒙的本质，

    你们无法穿越过去的黑暗，

    进入人类渴望的光明时代！


    现在，清晰的思想链条

    囚缚并枷锁着你们：你们的反抗是徒劳的，

    因为这启示是从天降下的。

    你们的基督是泥土，你们的基督是粘土！

    而，对于我们来说是本质、光、闪烁，

    – 对你们来说仅仅是一堆

    注定被剥削的破布！

    但那源自旧律法的荒谬，

