    trevas e que a sua finalidade é confundir os espiritistas pouco habituados a passar
    as coisas pelo crivo da razão. Mais do que isso, porém, o objetivo evidente é
    o de ridicularizar o Espiritismo para dele afastar as pessoas de bom senso.


    **XI**


    ## **OS DEZ MANDAMENTOS**


    A apoteose da obra de Roustaing não é a Ressurreição mas o Decálogo.


    O ciclo obsessivo dos retornos periódicos tinha de fechar-se no retorno bíblico.
    **Os** **Quatro Evangelhos** são uma constante mistura de comentários que vão
    e vêm, como num redemoinho, entre o Velho e o Novo Testamento. É essa também uma
    técnica de fascinação. O leitor se sente aturdido, mas atraído para o torvelinho.
    Quanto mais se aturde, mais se afunda no báratro das idéias em conflito, das explicações
    mil vezes repetidas. Há mesmo um **leit-motiv** exasperante, no estilo do Bolero
    de


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


