    Figueiredo 的版本是相同的。在 Diodati 版本中我们读到：“…… ogni spirito que confessa `Gesù Cristo`
    venuto in carne é da Dio; E, ogni spirito que non confessa `Gesù Cristo` venuto
    in carne, non è da Dio; quello è lo spirito d''anticristo”，等。在法语版本中我们看到：“……tout
    spirit qui confesse `Jésus-Christ` venu en chair est de Dieu; et tout esprit qui
    ne confesse pas `Jésus` n''est pas de Dieu, c''est celui de l''antéchrist”，等。在英语版本中我们找到：“……
    Every spirit that confesseth that `Jesus Christ` is come in the flesh is of God,
    and every spirit that confesseth not that `Jesus Christ` is come in the flesh
    is not of God; and this is that spirit of antichrist”，等。最后，希腊语文本说道：哪一个 Roustaing
    主义者有权威反驳 Kardec 的那些话以及这些来自帕特摩启示者的文本呢？这些文本本身拥有十九世纪的普遍声望？


    因为约翰并未停步于此：在一封仅有十三节、写给一位女士以对抗异端的小短信中，他做了开头的问候和最后的建议；但在一个节中，他就给出了良好的教义。


    ![](img/index-52_1.jpg)


    道与肉身 – 对 Roustaing 主义的两次分析 ______________________________________________


    51


    ### 看啊 (约翰福音书 2:7)


    在 Almeida 版本中：“因为已经有许多骗子进入世界了，他们不承认`耶稣基督` 降肉成身。这就是那骗子，是反基督。”


    在 Figueiredo 版本中：“因为世界上兴起了许多冒充者，他们不承认`耶稣基督` 降肉成身。这等等样的人就是冒充者，也是反基督。”在 Diodati
    版本中：“Conciossiachè sieno entrati nel mondo molti seduttori, i quali non confessano
    `Gesù Cristo` esser venuto in carne un tale è il seduttore e I’anticristo.”。在
    Segond 版本中：“Car plusieurs sont entres dans le monde, qui ne confessent point que
    `Jésus-Christ` est venu em chair. Celui qui est tel, c''est le séducteur et I’antéchrist.”。在英语版本中：“For
    many deceivers are entered into the world, who confess not that `Jesus Christ`
    is come in the flesh. This is a deceiver and an antichrist.”。最后在希腊语中：


    这就是 Roustaing 主义者，根据这位基督大使徒对他们精辟的定义。Kardec 在 Gomes Braga 先生亲自引用的那段话中确实是正确的。


    我们看到，从根本上说，Roustaing 主义的问题意味着：头脑和心中缺乏福音。


    在《路加福音》第 20 章中，有一个关于恶农夫的比喻。在最后我们读到这段话：


    “葡萄园的主将对他们做什么呢？”


    “他必将来除掉这些农夫，把葡萄园交给别人。他们听见后就说：愿不可如此！”


    “但他看着他们，说：这经书上写的到底是什么意思呢？匠人所弃的石头，已经用作房角石了。”


    “凡落在那块石头上的，就要被撞碎；凡压在那块石头上的，就要被碾成粉。”


    这块石头就是耶稣基督的教义，正如他的门徒留下的那样。


    对于他们的伪造者来说，这是悲惨的前景！36.


    36 **注** – Soares Matos 神父和天主教圣经及福音伪造者的例子，今天正被那些备受尊敬的新教编辑者所效法。新教内部对文本的篡改针对灵论运动。甚至达到了极点，将神谕者的词替换为
    `médium`（灵媒），将巫师一词替换为灵论者。请看《圣经》版本，改编 João Ferreira de Almeida 的译本，来自巴西圣经协会 - `RA53`
    系列 - 40,000 - 11/65 - 由 `IMPRERES` 印刷，圣保罗。（H.P.）。


    道与肉身 – 对 Roustaing 主义的两次分析 ______________________________________________


    52


    ## II. 作为信仰负责人的 Roustaing


    让我们来看论点。第一个是：


    Kardec 的使命得到了 Roustaing 先生的显著协助，他“负责组织信仰工作，为先前的启示提供确认”。


    首先，我们从更广泛的角度分析 Roustaing 案，试图了解这位伟大的法国律师是否是一个传教士，而且是第三启示的传教士。


    根据灵论教义，地球上的传教士是在彼岸生活中选择或接受了一项在人类之间执行的重要任务的精神。根据逻辑，既然带给我们所有如此丰富材料的大灵体没有离开，使得灵论问题能够在在标准的标准和真正科学的方法下被研究，那么一个传教灵体可能会成功，也可能在使命中失败，因为尽管他们拥有自由意志，他们的力量会与游戏中的其他力量相互作用。


    '
- fmt: '

    Procurou ele aliar-se a `Allan Kardec` e trabalhar em paralelo ou em convergência
    de objetivos? Submeteu as mensagens de seus supostos evangelistas, apóstolos "et
    caterva" ao exame da crítica sensata de outros estudiosos, que os havia em abundância,
    contemporaneamente à missão de `Allan Kardec`? 41.


    Não; não o fez. Buscou o isolamento. Erigiu-se em flecha dessas catedrais góticas,
    que se espeta no céu, como que a dizer sempre: EU!`


    `Kardec` havia permitido na `Sociedade Espírita de Paris` a penetração dos roustainguistas.
    E, quando desencarnou o Codificador, os partidários do `Jesus nem Deus, nem Homem`
    foram se apoderando dos postos-chave da Sociedade e não tiveram vergonha de adulterar
    a obra do mestre.


    Que prova isto?


    Um desespero de causa, a falência do missionário e uma obstinação, uma obsessão
    coletiva, que não podia deixar de ser, como de fato o é, obra do Anticristo.


    É triste confessar, mas a verdade é que se `Roustaing` foi um missionário, foi
    sobretudo um fracassado na doutrina da Terceira Revelação, porque deformou a doutrina
    de `Jesus Cristo` 42.


    ***


    Pretende o Sr. `Gomes Braga` que `Roustaing` tenha sido encarregado de organizar
    o trabalho da fé, dando confirmação às revelações anteriores".


    Já vimos, pelo que ficou dito acima e pelo que dissemos no artigo anterior, que
    a ação de `Roustaing` e de seus prosélitos, no campo da doutrina, por seu caráter
    deformante dos textos bíblicos, foi e é anticristã, não podendo, por isso mesmo,
    ser tomada como de auxílio à missão de `Kardec`. Basta lembrar que foi justamente
    o roustainguismo que levou o fracionamento e o divisionismo aos meios espíritas
    franceses, comprometendo a obra social que a `Sociedade Espírita de Paris`, fundada
    por `Allan Kardec`, já vinha realizando, a despeito da atenção deste estar voltada,
    principalmente, para os escritos doutrinários 43.


    Estudada assim a primeira parte da primeira tese, vejamos a segunda parte: “encarregado
    de organizar o trabalho da Fé".


    ***


    `Kardec` considerou o Espiritismo sob três aspectos fundamentais: o científico,
