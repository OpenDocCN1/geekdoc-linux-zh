    ## II. Roustaing como encarregado da Fé


    Vamos às teses. A primeira delas é:


    A missão de Kardec foi notavelmente auxiliada pelo Sr. Roustaing "encarregado
    de organizar os trabalhos da fé, dando confirmação às revelações anteriores".


    Inicialmente, analisemos o caso Roustaing sob um aspecto mais geral, buscando
    saber se o grande advogado francês foi mesmo um missionário, e missionário da
    Terceira Revelação.


    Conforme os ensinamentos da doutrina espírita, missionário na Terra é o Espírito
    que, na vida de além túmulo, ou escolheu ou aceitou uma tarefa importante a realizar
    entre os homens. Pela lógica, de que se não apartam os grandes Espíritos que nos
    trouxeram todo esse vasto acervo de materiais, que permitiram fossem os problemas
    do Espiritismo estudados sob critérios seguros e métodos realmente científicos,
    um Espírito missionário pode triunfar, como pode falir na sua missão, porque,
    apesar de desfrutar de livre arbítrio, suas forças entram em jogo com outras forças
    do jogo.

