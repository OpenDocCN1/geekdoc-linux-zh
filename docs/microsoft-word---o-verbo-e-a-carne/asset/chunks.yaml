    maioria dos dirigentes espíritas kardecistas ou anti-roustainguistas –


    perdoem-nos que lhes digamos – lêem bastante, mas não fizeram da doutrina um estudo
    sistemático, fichado, arrumado: parece que ignoram que ainda há muita coisa de
    Kardec que é desconhecida em nossa língua; que certos temas, esflorados por ele,
    indicam que tinha em mente obras outras que sua moléstia não permitiu concluir
    ou esboçar 58.


    E até hoje – salvo os seus contemporâneos Flammarion, Léon Denis e Delanne e,
    sob certo aspecto, Bozzano – não surgiu um Espírita que estivesse à altura da
    tarefa de continuador, para a qual é necessário um perfeito conhecimento 58 Toda
    a coleção da Revista Espírita do tempo de Kardec indispensável ao estudo da doutrina,
    só foi publicada no Brasil, a revelia e contra a vontade da F. E. B., na década
    de 60, em tradução de Júlio Abreu Filho. O importante livrinho de Kardec **O Espiritismo**
    **na sua mais simples expressão** só apareceu em 1970\. Bastam esses dois fatos
    para provarem a razão do autor (H.P.).


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    67


    da obra do Codificador e um conhecimento igual, se não maior, da Bíblia, como
    elemento imprescindível ao completo desenvolvimento da parte moral da doutrina,
    enfim para fazer, segundo a expressão feliz de Osvaldo Melo, **não Evangelho**
    **segundo o Espiritismo, mas Espiritismo segundo o Evangelho.**


    Ora, os dirigentes da FEB não estão compreendendo a responsabilidade que lhes
    pesa sobre os ombros. Parece que ignoram que o Espiritismo não foi codificado
    para se converter numa religião – o que fora desconhecer a origem e a função das
    religiões no seu aspecto social – nem, muito menos ainda, para combater as religiões
    existentes, mas para dar elementos científicos, filosóficos e morais que despertem
    a fé nos incrédulos e a fortaleça nos que a têm tíbia e vacilante, nos que a têm
