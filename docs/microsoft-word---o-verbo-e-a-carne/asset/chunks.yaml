    **minha companhia e com o qual diariamente me consagrava a**


    **trabalhos assíduos. Pedira também a graça da manifestação**


    **do espírito de meu pai e do meu guia protetor. Essas**


    **manifestações se produziram espontaneamente, com surpresa**


    **do médium, a quem eu deixara ignorante da minha prece. O**


    **espírito do apóstolo Pedro manifestou-se a 30 de junho de**


    **modo inesperado tanto para mim quanto para o médium".**


    Depois dessas manifestações Roustaing travou conhecimento com Madame Collignon.
    E com essa médium, oito dias mais tarde, começaria o trabalho de recepção de **Os
    Quatro Evangelhos.** Mateus, Marcos, Lucas e João, "assistidos pelos apóstolos",
    deram-lhe extensa comunicação sobre a missão que lhe cabia, de receber a Revelação.
    Em maio de 1865 todo o trabalho estava realizado, preparando "a unidade de crenças
    e a fraternidade humana pela efetivação das promessas do Mestre e, por fim, o
    Reino de Deus na Terra". Roustaing termina o prefácio com estas palavras: "Ficai
    certos, como eu, meus irmãos, de que eles atingirão a meta".


    Como se vê, Roustaing começa o prefácio oferecendo a obra ao exame e à meditação
    dos espíritas, mas conclui afirmando a sua validade. Estende-se em considerações
    sobre o valor da razão e das ciências, mas acaba ordenando "Ficai certos, como
    eu", o que exclui o raciocínio dos leitores.


    Refere seus estudos, seus trabalhos, suas pesquisas como elementos que devem provar
    o valor de suas conclusões, mas não vai além da referência, não oferece dados
    nem qualquer elemento para a avaliação do seu esforço. Tudo repousa apenas na
    sua palavra, no seu auto-julgamento. Entusiasmou-se com **O**


    **Livro dos Espí**ritos e **O Livro dos Médiuns**, mas não percebeu nesses livros
    os seguintes pontos:


    1º) Que a origem e a natureza espirituais de Jesus são as mesmas de todos nós,
    o que o próprio Jesus explicou ao ensinar que somos todos filhos do mesmo pai
    que é Deus, "o meu pai e vosso pai", como disse à Madalena.


    2º) Que a posição espírita de Jesus em relação a Deus é a de um Espírito Superior,
    da qual decorrem os seus poderes e a sua autoridade, dos quais por sua vez decorre
    o sentido espírita das palavras que lhe pareceram inexplicáveis.


    3º) Que o desaparecimento do corpo de Jesus do túmulo não se deu com a pedra selada,
    mas depois do afastamento da pedra, e que a ressurreição, as aparições 2 “Ninguém
    ma tira de mim, mas eu de mim mesmo a dou; tenho autoridade para a dar, e tenho
    autoridade para retomála. Este mandamento recebi de meu Pai”. (João; 10:18).


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    8


    a ascensão de Jesus, bem como as suas profecias, explicam-se pelos poderes mediúnicos.


    4º) Que a necessidade de uma revelação nova, ou revelação da revelação não passava
    de falta de compreensão dos livros que lera.


    5º) Que o seu desejo de receber uma nova revelação e a sua evocação dos espíritos
    pelo médium, com qual vinha trabalhando, já estava condenada no Livro dos Médiuns
    como uma temeridade.


    6º) Que o simples fato de não haver ele comunicado ao médium essas evocações não
    justifica a sua afirmação de que as manifestações foram espontâneas –


    e de que as manifestações posteriores de Pedro e outras apóstolos seriam simples
    conseqüência da sua temeridade.


    A análise desse prefácio nos mostra que Roustaing procedeu como um neófito do
    Espiritismo, deixando que entusiasmo inicial o levasse a uma posição perigosa
    no trato com os médiuns e os espíritos. As advertências de Kardec a respeito não
    foram consideradas por Roustaing, como ainda hoje não o são por muitas pessoas
    demasiado entusiastas e ansiosas de "novas revelações".


    Faltou a Roustaing a compreensão do método kardecista para a realização de experiências
    espíritas 3\. Essa deficiência fundamental, declarada explicitamente por Roustaing
    no seu prefácio, impede-nos de considerar a sua obra como espírita e de aceitar
    as revelações que lhe foram feitas como válidas.


    A situação emocional de Roustaing, por ele mesmo confessada, mal saído de uma
    grave moléstia, e as atitudes que assumiu no trato da mediunidade – sem levar
    em consideração a exigência básica do **consenso universal** – são mais do que
    suficientes para configurarem a sua obra como suspeita.


    Vejamos agora se a análise dos textos posteriores confirma essa


    suspeita ou se a invalida. No caso de a invalidar teremos pelo menos uma razão
    para aceitar a possibilidade de que a obra de Roustaing seja válida, segundo as
    exigências doutrinárias. Essa razão única não será suficiente doutrinariamente,
    mas poderá justificar a atitude dos que a aceitam e propagam.


    **III**


    ## **AS PREMISSAS DO ROUSTAINGUISMO**


    O Roustainguismo é uma tese. Como tese ele se desenvolve segundo as regras do
    silogismo 4\. As suas premissas são colocadas no início do prefácio de **Os**
    **Quatro Evangelhos.** Deixamos esse aspecto do prefácio para analisá-lo em separado,
    objetivando maior clareza na sua apreciação, e também pela sua importância prática
    no tocante à aceitação da tese pelos espíritas.


    Toda tese apresenta duas espécies de verdade ou falsidade: a formal e a substancial,
    que se tornam evidentes na análise do silogismo. Assim, o silogismo 3 "A quem
    não se limite a ficar na superfície, são necessários, não algumas horas somente,
    mas meses e anos, para lhe sondar todos os arcanos. Por aí se pode apreciar o
    grau de saber e o valor da opinião dos que se atribuem o direito de julgar, porque
    viram uma ou duas experiências, as mais das vezes por distração ou divertimento.
    Dirão eles com certeza que não lhes sobram lazeres para consagrarem a tais estudos
    todo o tempo que reclamam". (Kardec, O Livro dos Médiuns, item 14).


    4 [Do gr. syllogismós, ''argumento'', pelo lat. syllogismus.] – Dedução formal
    tal que, postas duas proposições, chamadas premissas, delas, por inferência, se
    tira uma terceira, chamada conclusão. Dessa tese, não é possível que as premissas
    sejam verdadeiras e a conclusão seja falsa. Ex.: *Todos os homens são mortais,
    todos os brasileiros são homens, logo,* *todos os brasileiros são mortais*.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    9


    ou processo de raciocínio pode ser **formalmente verdadeiro,** quando a sua estrutura
    segue rigorosamente as regras lógicas. Vamos a um exemplo simples: 1) **Os Espíritos
    Superiores se manifestam para** re**velar a Verdade.**


    2) **A Revelação da Revelação foi ditada por Espíritos Superiores.**


    3) **Logo, Os Quatro Evangelhos são a Verdade.**


    Este é o silogismo que leva os roustainguistas a aceitar e defender **Os** **Quatro
    Evangelhos.** Ele oferece, de fato, uma verdade formal. Sua estrutura lógica é
    perfeita. A conclusão deriva com precisão da premissa maior e da premissa menor.


    Mas não basta a forma perfeita para nos dar a verdade. Precisamos também e principalmente
    da substância legítima, que nos dá a **verdade substancial.**'
