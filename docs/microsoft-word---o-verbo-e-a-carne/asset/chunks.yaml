    sutil, intuitiva e de inspiração, avassalaram um médium feminino para o serviço
    do primeiro, posto essa senhora lhes não aceitasse as mensagens, e restauraram
    a velha e desmoralizada heresia do corpo fluídico de Jesus, que se prestava admiravelmente
    para sustentar dois grandes dogmas católicos: o da Santíssima Trindade e o da
    Imaculada Conceição.


    **Define-se a situação na prática, que é a seguinte:**


    I – nos centros roustainguistas a ação das falanges tolhe o desenvolvimento das
    grandes tarefas sociais, porque isto seria detrimento para o catolicismo; II –


    nos centros onde a falsa compreensão de tolerância mistura, kardecismo e roustainguismo,
    dá-se um choque de correntes de Espíritos, manifesto nas dissenções internas que
    atrofiam os médiuns, anquilosam as sociedades, quando não as esfacelam; III –
    nos centros puramente kardecistas, onde, em geral, não há estudo largo e profundo
    do assunto, são freqüentes as crises, devidas ao trabalho de falanges; e, mesmo
    quando se constata que são falanges de padres, a falta de conhecimento panorâmico
    da matéria tira aos dirigentes o poder de domínio sobre aquelas, por isso que
    ignoram as causas profundas que as impelem.


    Observe-se que nem sempre é seguro o controle através dos videntes. Em geral estes
    não se acham suficientemente instruídos; assim não sabem estabelecer a diferença
    entre: a) manifestações de animismo do próprio médium; b) manifestações de Espírito
    encarnado, cujo corpo somático esteja no ambiente ou fora dele; c) apresentação
    de uma ideoplastia por um mistificados, que maneja os fluídos ambientes e naquela
    se mascara; d) manifestação de um Espírito veraz. Entretanto não seria difícil
    explicar essas diferenças de imagens astrais, noticiadas pelos videntes, com o
    fito de assegurar o controle das manifestações.


    *****


    Se a Federação Espírita Brasileira se sente com vocação para ser uma federação
    espírita brasileira; se a grande maioria dos espíritas brasileiros são kardecistas
    e desejam a modificação do **status quo** criado pelos roustainguistas; se estes
    estão realmente convencidos das excelências de seu cisma, por que não concordam
    em tirar a limpo aquilo que os kardecistas impugnam?


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    93


    Para tanto bastaria organizar um grupo selecionado nas seguintes condições: I
    – número igual de kardecistas e roustainguistas, escolhidos entre pessoas de cultura
    e imbuídas da responsabilidade do trabalho em que irão participar; II – um grupo
    de médiuns videntes, previamente submetidos a testes; III – incorporações ou mensagens
    psicográficas através de Francisco Cândido Xavier, e de um outro médium, previamente
    examinado;


    IV – evocação dos Espíritos de Ismael, Bezerra de Menezes, Emmanuel, Allan Kardec
    e Roustaing;


    V – aceitação de manifestações espontâneas de outros Espíritos.


    Nestas sessões far-se-iam as seguintes perguntas fundamentais, além de outras,
    decorrentes dos mesmos diálogos:


    1 – Quem está com a razão: Kardec negando ou Roustaing afirmando


    que Jesus Cristo não foi homem?


    2 – É legítima a mensagem atribuída a Roustaing, dado no Rio de Janeiro e publicada
    na obra "Revelações de Além Túmulo", psicografada pelo médium Sr.


    Carlos Gomes dos Santos?


    3 – É exato que o Espírito de Alan Kardec tenha dado apoio à tese do corpo fluídico
    de Jesus?


    4 – É autêntica a mensagem atribuída a Kardec e publicada pela **Sociedade** **Acadêmica
    Deus, Cristo e Caridade** na introdução à primeira edição brasileira de **"A**
    **Gênese, Os Milagres e As Predições Segundo o Espiritismo",** no ano de 1882?


    5 – Como explicar a contradição entre as declarações de apoio de


    Kardec à tese roustainguista e a mensagem referida na pergunta anterior?


    6 – Porque, desde 1882 até hoje não teria sido possível organizar uma obra de
    desenvolvimento, ampliação e mesmo de correção da obra de Kardec, como seria admissível
    nos termos da citada mensagem?


    7 – São verdadeiras ou falsas as afirmações de João Evangelista em duas epístolas
    contidas na Bíblia, caracterizando como Espírito do Anticristo aquele que nega
    que Jesus Cristo viveu e sofreu na carne?


    Se a F. E. B. está com a verdade é magnifica oportunidade de esclarecer seus opositores,
    que também são filhos de Deus. Se não o aceitar é que teme a verdade. Restará
    então aos kardecistas continuar proclamando a verdade com a F.E.B., sem a F.E.B.,
    ou apesar da F.E.B.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    94


    **Indicações de Leitura que fazem análise das Obras de Roustaing.**


    **Kardec**, A. *Revista Espírita*, 1866, editora Edicel.


    ______________________, 1861, editora Edicel.


    ______________________, 1867, editora Edicel.


    **Costa,** Luciano. *Kardec e Não Roustaing.* Editora LAKE.


    **Ferreira**, Carlos Alberto. *Será a Obra de Roustaing Espírita?* Editora Opinião
    E. Capivari.


    **Garcia,** Wilson. *O Corpo Fluídico.* Edições Correio Fraterno do ABC – São
    Paulo.


    **Prestes,** Erasto de C. *Kardec X Roustaing.* Editora ECO, Rio de Janeiro –
    Niterói – 1984.


    **Pires**, J. H. *Agonia das Religiões.* Editora Paidéia, 1989.


    _________ *Revisão do Cristianismo.* Editora Paidéia, 1980.


    _________ *O Espírito e o Tempo.* Editora Paidéia, 1983.


    **Silva**, Gélio L. *Conscientização Espírita.* Editora Opinião E. Capivari –
    SP, 1995.'
