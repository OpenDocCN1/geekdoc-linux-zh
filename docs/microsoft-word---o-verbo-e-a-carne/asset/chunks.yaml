    Nada provou. Sua obra, desnecessariamente extensa fatigante, poderia ser perfeitamente
    reduzida à quinta parte. Parece que a extensão visou apenas a prender o leitor
    e desviar, através do cansaço, seu senso crítico. É o tipo da obra de rábulas
    68 solertes que visam, acima de tudo, a `ganhar a questão` e para os quais todos
    os sofismas e embustes são bons, desde que não se vejam descobertos. Ela prima
    pela falta de método, pela ausência de critérios científicos. Tanto que a tradução
    brasileira feita pela `F. E. B.` procurou `tapar os buracos e dourar a pílula`,
    para o que chegou ao cúmulo de adulterar versículos da Bíblia, no vão esforço
    de dar uma aparência de lógica ao raciocínio canhestro.


    Todos os Espíritas – kardecistas ou não – nos devemos capacitar de que o Espiritismo
    está chamando a atenção do mundo culto pelos fenômenos; estes são susceptíveis
    de generalizações tais que conduzam o homem `à fé pela razão.` Por outro lado,
    quanto mais as ciências progridem, mais se confirmam os postulados da Bíblia.
    E ninguém, com uma dose regular de bom senso, terá a ousadia de alterar os seus
    textos, torcer passagens ou adulterar velhas fontes. Exceção única: padres católicos
    de fala portuguesa e os roustainguistas do Brasil.


    No mundo atual o Cristianismo puro está chamado cada vez mais a tomar o lugar
    que estava ocupado pelo formalismo religioso, porque é ao Cristianismo que cabe
    resolver os problemas humanos, em âmbito interno como em plano social. É que,
    no dizer de Stanley Jones, no seu magníífico `Christ and the Present World Issues:
    "nós não podemos ser religiosos como seres individuais se não o formos como seres
    sociais, porque a vida é una. Ela é vascular: onde quer que seja cortada, sangrará".`
    E adiante acrescenta: `"Por isso a Igreja parece confusa e temerosa. Suas velhas
    razões de ser já não são adequadas. Ela terá que ser devocional num sentido leais
    largo, ou não o ser absolutamente. Se ela deve salvar-se da acusação de que a
    religião é ópio – a envenenar a criatura com a devoção e a emoção – deverá então
    ajustar suas devoções aos largos problemas do bem-estar humano e erigir os seus
    santuários, no coração dos problemas humanos".`


    O Reverendo `Stanley Jones`, atualmente a mais nobre figura do protestantismo
    mundial, o grande missionário da Índia, dá-nos, nestas poucas linhas as tarefas
    da Doutrina Espírita Cristã.


    Nós precisamos tudo fazer para nos tornarmos dignos depositários, ou herdeiros,
    dessa imensa e nobre tarefa. E só o seremos com um estrito, um absoluto apego
    à verdade e um inquestionável respeito ao grande livro que é a Bíblia. Essa deformação
    consciente da Verdade da Bíblia ainda não recebeu dos profitentes – católicos
    e espíritas – a repulsa na altura, o protesto solene, público, bem calmo e bem
    alto, porque em geral o povo, tanto em Portugal quanto no Brasil, desconhece o
    grande livro fundamental de sua crença.


    Este abuso dos falsificadores pode dar um prestígio extenso, mas pouco profundo.
    Tanto isto é verdade em relação ao Espiritismo, que a `F. E. B.` deixa esgotadas
    as poucas obras científicas já traduzidas e engavetadas aquelas cujos direitos
    porventura tenha adquirido. Tirantes as obras de `Francisco Cândido Xavier`, pouco
    se recomenda de sua produção nos últimos vinte anos.


    É por isso que muita gente de certa cultura faz Espiritismo isoladamente; por
    isto a `F. E. B.` não tem prestígio para atrair as camadas mais defendeu com brilhantismo
    a sua tese. `André Moreil`, seu biógrafo mais recente, entende que `Kardec` estudou
    medicina mas não se diplomou. `Albert Caillet` diz que `Kardec` tinha "conhecimentos
    médicos inegáveis" (`H.P.`).


