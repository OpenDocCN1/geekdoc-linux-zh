  trans: '


    这一诫律可以应用于更广泛的意义：`不要用剑杀，也不要用子弹杀，而是要用氢弹杀。`是的，因为数百人的集体死亡可能成为一种因果报应的要求。届时保护灵就不需要细致地引导剑的使用，而是通过引导炸弹的发射就能以最小的努力获得最大的效果。


    ### 启示


    到达这一令我们想起荷马史神灵参与毁灭特洛伊的顶峰时刻，我们认为 Roustaing 案件不需要进行任何进一步的分析了。我们在一个 `flash` 瞬间看到了“启示之启示”的全景照片。这部作品一直被作为卡德克著作的补充进行传播。Roustaing
    那四卷受推崇的书的新版正在全巴西范围内宣布。强力的文章被发表出来捍卫和赞美这一灵论教的“最终定论”。而这正处于灵论主义在我们国家进入与国家发展完美接轨的阶段，一个文化密集成长的时期。


    新一代，特别是大学生群体，他们已经可以在预示着灵性大学即将出现的学院里就读课程（因为这些学院由教义机构建立并维持），现在可以充分了解从高层领域传达给我们的“新教导”。摩西、福音传道者和门徒早已满足了我们在文化领域的巨大需求。


    在世界的这个时刻，我们正处于某种沉重的集体因果作用之下，才不得不重新审查这类以灵论名出版和再版的书籍。耐心吧。“上帝的部长们”已经向我们解释了这一切是如何为了人类的利益和天使的快乐而发生的。


    ### 对丹尼克的批判


    最近批评了丹尼克（Daniken）的世界畅销书《他们是外星人神吗？》（由于该书在巴西销量极高），Anathol Rosenfeld 教授指出，试图反驳书中愚蠢内容的尝试都是荒谬的。


    尽管如此，他写道，应该暴露于常识之者的嘲笑之下以试图澄清这一主题。某些观念的荒谬有时是巨大的，只值得沉默。我们想要让那些过度诚信的人关注到“Roustaing
    主义”的荒谬，这一简单的事实本身也是一种可笑的态度。在这项工作中，我们有意识地让自己处于这种荒谬之中。面对这种堂吉诃式的立场是值得的，仅仅希望有人能从催眠状态中醒来，或者有人能避免陷入其中。


    ---

    道道与肉身 —— 对 Roustaing 主义的两个分析


    ### 因果的概念


    `四部福音`是灵论主义的特洛伊木。没有什么比特洛伊人把希腊器械带回自己的城邦更荒谬的，他们仅仅被这项作品的宏大所吸引。由于其无效，卡珊德拉（Cassandra）的预言也是荒谬的，因为阿波罗神（Apoio）已经提前取消了它。但卡珊德拉出于道德义务必须这样做。那些没有听她说话的人灭了，并将自己的王国推向了彻底的毁灭。我们必须以特洛伊女预言者的道德勇气面对这种荒谬。尤其是现在，这只腹中藏着猛敌的特洛伊木，正再次展示在灵论主义的傻瓜们面前。


