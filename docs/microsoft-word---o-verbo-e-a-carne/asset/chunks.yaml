    “以利亚和以诺克的身体无疑发生了改变或转化，正如保罗在`1 Cor.-15: 51-52`中描述的那样 - 这些节文紧接在那句著名的经文‘肉体不能继承神国’之后。它们被变成了灵性化的身体，就像在某种程度上类似于基督从死中复活时所使用的那种。他的复活身体似乎是由肉体构成的，但显然与他死前所拥有的完全不同。所有被救赎的人，在基督来临之前去世的圣徒，以及在他来临时活着的人，都被许诺了这些用于天堂生活的新“天上”身体。这些是讨论过该主题的注释者的观点。”


    ### 翻译如下：


    “以利亚的身体发生了什么？”


    “以利亚和以诺克的身体无疑发生了改变或转化，正如保罗在`哥林多后书; 15: 51 和 52`中描述的那样 - 这些节文紧接在那句著名的‘肉体不能继承神国’之后。它们被变成了灵性化的身体，就像在某种程度上类似于基督从死中复活时所使用的那种。他的复活身体似乎是由肉体构成的，但显然与他死前所拥有的完全不同。所有被救赎的人，在基督来临之前去世的圣徒，以及在他来临时活着的人，都被许诺了这些用于天堂生活的新“天上”身体。这些是讨论过该主题的注释者的观点”（诺曼人是我们的）。


    看看这些新教徒，他们不承认灵体的显现，不理解所谓的鬼魂或非物质体；他们到为止还因为在圣经中不加区别地使用`灵`、`主`和`神`等词汇而陷入了巨大的混乱中；他们将这种排斥推到了不承认圣经中某些被视为非正典的书籍的程度，其中包括《德拉比记》，那书完全是一个关于灵体物质化的长故事；看看这些新教徒，我们正要说，关于耶稣的身体，他们对事实有着非常清晰的理解，并给出了与经文一致的解释！


    但鲁斯唐主义的虚荣风想要标新立异，并自认为是在发表新见，结果却是复兴了一个被帕特斯岛启示者曾如此清晰、准确和克制地揭露过的陈旧且破败的理论。


    在之前的文章中，我们引用了卡内尔关于非物质体的段落，通过这些可以看出，编写者对耶稣流体体理论持系统性的敌意。我们要求戈梅斯·布拉加先生展示那些他所称的、卡内尔支持鲁斯唐理论的著作，但到目前为止这些著作还没有出现，原因非常简单且清楚：卡内尔既没有以人的身份写过，也没有以灵的身份写过。


    关于布拉加先生提到的许多通信内容，通常是不为人知的。我们只知道这些引用：它们应该是提供给`Francisco Cândido Xavier`（契科·夏维尔）以及`F.
    E. B.`的两位官方灵媒女士的：`Zilda Gama` 和`América Delgado`。


    通过`Xavier` 知道一个由`Humberto de Campos`灵口述的作品片段。这可能是该灵合法的观点，但也可能是一种伪造，因为已经公开证明，在通过该媒介重新编辑另一部作品时，`F.
    E. B.` 修改了某段文字，使其迎合鲁斯唐主义的原则。这是一个公共领域的事实，正如`F. E. B.` 没有辩护一样。


    这样，任何其他由`F. E. B.`发表的、声称具有鲁斯唐主义原则的`Chico Xavier`信息都是令人怀疑的…… 尽管这不会降低该灵媒的价值。


    那两位女士是机构的灵媒，属于同一个小组，受到相同的影响。灵体给`Allan Kardec`（卡内尔）的教导告诉我们此类通信的价值所在——只要它们缺乏普遍赞同的声誉，并且不符合逻辑、常识、道德和历史文献；简而言之：在宇宙范围内的观点唯一性。


    ### 为什么呢？


    因为孤立工作或在单一中心工作的灵媒可能受到一个伪装者的影响，这个伪装者通过改变其震动来改变灵媒的感受方式；这样，它就会用不同的语言和多个名字出现，以便让一个伪装证实并抬高另一个；它可能还会受到阵列的作用，该阵列在平面以组合的方式行动。在有多个灵媒的中心也是如此：他们可能都受同一个灵或一个阵列的支配，就像孤立灵媒的情况一样，对整体应用这些相同的行动形式。


    而且不止于此。`Kardec`没有时间进入更深入的细节，这些细节在以后才为人所知。


    他关于这个案例所说的一切（我们在上面做了简要概述，因为我们在之前的文章中已经详尽地陈述过），可能由一个肉身的灵来执行——即灵媒自身的灵。在特殊情况下，灵媒可以实现其灵的局部甚至完全外显化，重新获得对潜意识知识的控制。我们目前知道两个典型案例：一位非常诚实、基督徒、慈善、谦卑且致力于教义的女士，她坚信自己接收了丰富的临床灵；她做出更准确的诊断，推荐药物并获得显著的治愈或改善；为受益者带来巨大的益处，无论是通过暗示还是通过她自身的磁性作用。另一位先生是入体灵媒；接收各种类别的灵；但在某些条件下，他会外显化，他的灵回到过去，恢复并展示巨大的知识，并以卓越的演讲家形式表达。


    '
- fmt: '

    A vaidade incontida, o orgulho insopitado foram nele maiores que o seu poder de
    análise, que o domínio de si mesmo. E perdeu-se.


    Imagino-o hoje como Espirito lúcido, altamente consciente de seu erro, assistindo
    a multiplicação de suas funestas conseqüências, por dezenas e centenas de pessoas,
    graças à repetição, num pequeno núcleo, das mesmíssimas circunstâncias em que
    um dia se achou, empolgado por uma falange vaticânica, que tudo tem feito, e tudo
    fará para destruir, para desmoralizar o Espiritismo.


    E como lhe deve doer a antevisão de sua responsabilidade kármica! Como deve sofrer
    nesse castigo atroz de não poder chegar aos núcleos que o tomam por patrono, e
    dizer, através dos médiuns: "Vocês estão errados e por minha culpa; essa dedicação
    de vocês, esse empolgamento, esse fanatismo, essas inverdades são o meu inferno.
    E vocês não me escutam; vocês não me aliviam; vocês..."


    Não poderia acabar: o diretor dos trabalhos o enxotaria como um miserável mistificador.


    Kardec deixou uma obra, se não acabada, ao menos com os alicerces feitos, com
    a infra estrutura definida. Nestas nove décadas que decorrem desde o seu aparecimento
    codificado, muito tem evoluído o Espiritismo. Mas ainda não foi necessário alterar
    nenhum ponto, dobre o qual ele houvesse emitido opinião. Muito se avançou no conhecimento
    de detalhes: nunca, porém, se constatou a menor necessidade de substituir uma
    viga, isto é, de mudar um conceito `80`.


    Assim, uma obra tão sólida não necessita ser consolidada por um trabalho a que
    falta base científica, falta lógica, falta esse apoio universal dos próprios Espíritos
    que, `urbe et orbe`, espalharam o imenso material com o qual a doutrina foi codificada
    no seu tríplice aspecto. A verdade não necessita da mentira para se consolidar.


    Esta segunda parte da tese do Sr. Gomes Braga, pelo visto, é uma cavilação (ironia
    maliciosa), como o é a parte final, que diz ficarem assim "confirmados o Cristianismo
    e o Judaísmo".


    Perdoe-nos o Sr. Gomes Braga, perdoe-nos o público. O melhor comentário à afirmação
