    Ao passarem para a vida de além-outro, essas figuras de destaque do clero observavam
    os médiumes. Ou os afeiçoavam ao seu serviço, ou os observavam e enlouqueciam,
    para que não viessem prestar serviços esclarecedores e, consequentemente, contrários
    aos interesses materiais da Igreja Romana. Pode-se bem ver esse feito das falangues
    váticas na ação exercida nos ambientes reformados, onde se acredita, `ao pé da
    letra`, que as almas imateriais se salvam por meio de um banho no sangue material
    de Jesus, algo que, além de paradoxal, é imoral, por ser a justificação e um crime.
    Igualmente vê-se isso na crença protestante no Espírito Santo, ou seja, nos bons
    espíritos e em sua evocação, quando, entretanto, recusam a mediunidade, recusam
    o `batismo no fogo do espírito` e discordam dos pentecostais, assim como estes
    dos dos espíritas.


    Quando chegou o momento de se realizarem as promessas de Cristo, ou seja, a vinda
    do Consolador, representado na doutrina espírita, aquelas falangues váticas, não
    podendo abrir brecha na estrutura moral e na integridade de Allan Kardec, procuraram
    agir em paralelo: escolheram uma figura de destaque, de mediunidade sutil, intuitiva
    e de inspiração, dominaram uma médium feminina para o serviço da primeira, pois
    essa senhora aceitou as mensagens, e restauraram a velha e desmoralizada heresia
    do corpo fluídico de Jesus, que se prestava admiravelmente para sustentar dois
    dogmas católicos: o da Santíssima Trindade e a Imaculada Conceição.


    Define-se a situação na prática, que é a seguinte:


    I – nos centros roustainguistas a ação das falangues impede o desenvolvimento
    porque isso seria em detrimento do catolicismo; II – nos centros onde a falsa
    compreensão de tolerância mistura o kardecismo e o roustainguismo, ocorre um choque
    de correntes de Espíritos, manifestado nas dissências internas que atrofiam os
    médiumes, as sociedades se fragmentam; III – nos centros puramente kardecistas,
    onde, em geral, não há um estudo amplo e profundo do assunto, são frequentes as
    crises, devido ao trabalho das falangues; e, mesmo quando se constata que são
    falangues de padres, a falta de conhecimento abrangente da matéria retira dos
    dirigentes o poder de domínio sobre aquelas que impulsionam.


    Observe-se que nem sempre é seguro o controle através dos videntes. Em geral,
    estes não se encontram suficientemente instruídos; assim não sabem estabelecer
    a diferença entre:


    a) manifestações de animismo do próprio médium; b) manifestações de Espírito encarnado,
    cujo corpo somático esteja no ambiente ou fora dele; c) apresentação de uma ideoplastia
    por mificados, que manipulam os fluidos e nela se mascaram; d) manifestação de
    Espírito veraz. Entretanto, não seria difícil explicar essas diferenças de imagens
    astrais, notificadas pelos videntes, com o intuito de assegurar o controle das
    manifestações.


    Se a Federação Espírita Brasileira se sente com vocação para ser uma federação
    espírita; se a grande maioria dos espíritas brasileiros são kardecistas e desejam
    a modificação do `status quo` pelos roustainguistas; se estes estão realmente
    convencidos das excelências de seu cisma, por que não concordam em limpar aquilo
    que os kardecistas impugnam?


    Para tanto bastaria organizar um grupo selecionado nas seguintes condições:


    I – número igual de kardecistas e roustainguistas, escolhidos entre pessoas de
    cultura e imbuídas da responsabilidade do trabalho em que irão participar; II
    – um grupo de médiumes videntes, previamente submetidos a testes; III – incorporações
    ou mensagens psicográficas por meio de `Francisco Cândido Xavier`, e de outro
    médium, previamente examinado; IV – evocação dos Espíritos de `Ismael`, `Bezerra
    de Menezes`, `Emmanuel`, `Allan Kardec`; V – aceitação de Espíritos.


    Nestas sessões, seriam feitas as seguintes perguntas fundamentais, além de outras,
    decorrentes dos mesmos diálogos:


    1 – quem tem razão: Kardec negando ou Roustaing afirmando que Jesus não foi homem?

    2 – é legítima a mensagem atribuída a Roustaing, dada no Rio de Janeiro e publicada
    na obra `Revelações de Além Túmulo`, psicografada pelo médium `Sr Carlos Gomes
    de Santos`?

    3 – é exato que o Espírito Kardec deu apoio à tese do corpo fluídico?

    4 – é autêntica a mensagem atribuída a Kardec e publicada pela `Sociedade Acadêmica
    Deus, Cristo e Caridade` na introdução à primeira edição de `Gênese, Os Milagres
    e As Predições Segundo o Espiritismo`, no ano de 1882?

    5 – como explicar a contradição entre as declarações de apoio de Kardec à tese
    roustainguista e a mensagem referida na pergunta anterior?

    6 – por que, desde 1882 até hoje, não teria possível organizar uma obra de desenvolvimento,
    ampliação e mesmo de correção da obra de Kardec, como seria admissível nos termos
    da citada mensagem?

    7 – são verdadeiras ou falsas as afirmações de João Evangelista em duas cartas
    contidas na Bíblia, caracterizando como Espírito do Anticristo aquele que nega
    que Jesus Cristo viveu e sofreu na carne?

    '
