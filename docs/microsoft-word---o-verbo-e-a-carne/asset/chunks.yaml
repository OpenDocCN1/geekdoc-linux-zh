    a criação de um conselho nacional sob seu controle. Esse órgão, o `Conselho Federativo
    Nacional`, deformou o espírito do unificação e erigiu-se numa espécie de colégio
    cardinalício, emitindo bulas sobre questões doutrinárias (`H.P.`).


