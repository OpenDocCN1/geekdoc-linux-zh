    Historicamente a razão de ser do Roustainguismo é apenas esta: a inquietação de
    um convalescente que se impressiona com a obra de Kardec e tem a pretensão de
    superá-la, esclarecendo pontos obscuros dos Evangelhos com a ajuda dos Espíritos
    Superiores, através de comunicações por alguns médiuns seus conhecidos e conterrâneos,
    que por fim são substituídos pela médium única, `Madame Collignon`, responsável
    mediúnica por todo o texto. O próprio Roustaing provoca a revelação evocando os
    espíritos, ao contrário de Kardec que estuda os fenômenos e é surpreendido pela
    revelação em meio de seus trabalhos de experimentação mediúnica.


    A posição científica de Kardec opõe-se à posição vulgar de Roustaing, um homem
    vaidoso que se deixa levar pelos espíritos mistificadores, aceitando as explicações
    mais ridículas e absurdas para o esclarecimento de problemas escriturísticos.
    O grande advogado não passava de um grande ingênuo.


    ## XIII


    ### ROUSTAINGUISMO NO BRASIL


    Quais os motivos da penetração da Roustainguismo no Brasil? Como e porque ele
    conseguiu enraizar-se na chamada "casa mater"? Por que nos defrontamos agora com
    uma recrudescência dessa pseudo-doutrina? Parece-nos que tudo se resume numa questão
    de formação religiosa, tendo por fundo a formação racial brasileira e o período
    medieval do nosso desenvolvimento nacional. O Roustainguismo chegou ao Brasil
    num momento crítico, quando a nossa cultura estava sendo abalada por várias infiltrações
    européias. Entre essas, o Espiritismo, que chegara da França e empolgara alguns
    espíritos cultos na segunda metade do século passado. O Roustainguismo se apresentava
    como integrado no Espiritismo e tocava de perto a sensibilidade mística de alguns
    ex-católicos.


    A França era então o centro da Civilização e Paris o cérebro do mundo. A obra
    de Roustaing chegava amparada pelo prestígio da França e do Espiritismo. Trazia
    ainda a chancela de Roustaing, nome respeitado nos meios jurídicos de Bordeaux,
    e fora recebida mediunicamente por `Madame Collignon`, pertencente à prestigiosa
    família de juristas. Todo esse aparato impunha `Roustaing` à nossa inteligência.
    Mais do que isso, porém, a obra trazia um grande alívio aos espíritos místicos,
    quebrava a frieza racional da obra de Kardec e restituía ao Cristo a sua condição
    sobrenatural.


    Para homens profundamente religiosos como Bezerra Menezes, que fora exemplo de
    católico praticante, `Antônio Luiz Sayão`, `Bittencourt Sampaio` e outros, cujos
    atos atestam o predomínio do sentimento religioso a razão crítica, a obra de Roustaing
    surgia como tábua de salvação, livrando-os do racionalismo kardeciano. Roustaing
    era a volta ao maravilhoso, ao Cristo místico, divino no espírito e no corpo.
    Dessa maneira, Roustaing devolvia a essas criaturas as ilusões da religião lírica
    que as embalara desde a infância.


    Não é fácil compreendermos hoje o clima religioso que o Espiritismo se desenvolveu
