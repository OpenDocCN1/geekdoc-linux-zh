    Particularmente para os Espíritas o que mais deve interessar é aquilo que repercute
    no Espírito, que é eterno. Então, nesta questão de falsificar versículos da Bíblia
    e adulterar as obras de Kardec pode não haver escândalo para os Espíritos revestidos
    na matéria e mais preocupados com as exterioridades, com as aparências com os
    proventos materiais e a importância das posições que ocupam, do que propriamente
    com a aquisição de conhecimentos e com a sua utilização, no seno de se melhorarem
    e ajudarem os seus semelhantes a se melhorarem. Mas do outro lado, no plano espiritual,
    o escândalo rola há muitos anos.


    Fosse alguém tentar discutir os mesmos pontos que estamos discutindo nas salas
    da Avenida Passos, e seria Convidado a não tocar no assunto, que é questão fechada;
    fosse uma sociedade adesa à Federação Espírita Brasileira abordar a matéria em
    família, talvez acabasse expulsa, como foi o caso da Federação Gaúcha – por algo
    menos que isso.


    Os roustainguistas não querem a discussão, porque o roustainguismo é uma fascinação,
