    18


    Além dos limites exigidos pelo bom senso, não se afastando – quando naqueles limites
    – da linha por ele traçada em `O Evangelho Segundo o Espiritismo`.


    O Codificador, sempre compreensivo e generoso, não quis aprofundar a análise do
    texto. Isso não o livrou da resposta agressiva que o advogado de Bordeaux lhe
    deu. Na verdade, Kardec poderia ter demonstrado que `Os quatro Evangelhos` não
    passavam de uma repetição de todos os temas por ele já desenvolvidos nos livros
