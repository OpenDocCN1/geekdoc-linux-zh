    Temos ainda de considerar, no exame desses trechos do texto mediúnico de `Os Quatro
    Evangelhos`, o problema da linguagem dos espíritos, que é um dos pontos fundamentais
    da Doutrina para a identificação dos comunicantes. Como se verá nos trechos que
    ainda vamos transcrever, a linguagem da obra é sempre a mesma: vulgar, com evidente
    dificuldade de expressão em vários trechos, com aplicação de expressões impróprias
    como "dentro dos liames da humanidade” e ainda com utilização de certos jogos
    de palavras que revelam segunda intenção. É o que iremos vendo através de exemplos
    do próprio texto. E é bom lembrar que a tradução brasileira é considerada mais
    clara que o original.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    12


    V


    ## O FATALISMO ROUSTAINGUISTA


    O nascimento de João Batista, relatado no Evangelho de Lucas, dá lugar a longos
    comentários no tomo primeiro de `Os Quatro Evangelhos`. Os espíritos comunicantes
    aproveitam o fato para minuciosos ensinos sobre fertilidade e esterilidade humanas.
    O que mais ressalta desses ensinos é o fatalismo islâmico 5 que preside à vida
    do homem na Terra. Vejamos um trecho:


    ```

    "Zacarias era inconsciente, médium, como bem compreendeis:

    vidente, intuitivo pela consciência que tinha da sua visão, e

    audiente. Assim se explica que tenha visto o espírito e lhe tenha

    falado".


    "Foi condenado ao silêncio, não por haver duvidado, porquanto é

    avisado o homem que se põe em guarda contra o desconhecido,

    mas para que aquela enfermidade momentânea corroborasse as

    predições que lhe vinham de ser feitas".


    ...."Insistimos nas palavras do anjo a Zacarias a respeito de Elias,

    palavras essas repetidas e confirmadas mais tarde pela opinião e

    pela voz públicas. Sim. Elias seria João e João fora Elias".

    ```


    (Tomo I, cap. I - Aparição do anjo Zacarias)


    Nesse pequeno trecho há várias contradições. Zacarias era inconscientemente médium
    (expressão que se repete nos textos) mas "era vidente, intuitivo pela consciência
    que tinha da sua visão, e audiente". Afinal, era médium consciente ou inconsciente?
    E o que quer dizer "inconscientemente médium"? Todo médium que tem consciência
    de ver, intuir, ouvir `etc.` não é nem pode ser inconscientemente médium.


    A seguir vemos uma contradição com o texto evangélico: Zacarias não foi condenado
    ao silêncio por haver duvidado do anjo, mas para que "corroborasse as predições
    que lhe vinham de ser feitas" 6. Nessas previsões se inclui a reencarnação de
    Elias em João Batista. Emenda tardia e desnecessária ao texto evangélico tradicional,
    pois a prova dessa reencarnação é dada pela autoridade maior que é Jesus. Qual,
    pois a razão dessa emenda que não pode ser verificada quanto à sua verdade ou
    falsidade?


    Nos longos comentários sobre fertilidade e esterilidade os espíritos criam uma
    teoria de assimilação e repulsão de fluídos pelo organismo humano, mas ao mesmo
    tempo se referem a espíritos incumbidos de controlar esses fluídos para que as
    provas de esterilidade durem o tempo predeterminado. Não se sabe, assim, se a
    prova se cumpre de maneira mecânica, segundo as leis naturais, ou pela vigilância
    dos espíritos. A esterilidade de Isabel era uma prova escolhida por ela e Zacarias.
    Este suplicava um filho em suas preces. Mas não foram às preces que lhe deram
    o filho, pois: "Tendo soado a hora da concepção e do nascimento, nasceu João".


    5 “E a cada homem lhe penduramos ao pescoço o seu destino e, no Dia da Ressurreição,
    apresentar-lhes-emos um livro, que encontrará aberto” (Alcorão; 17:13).


    Corret


    6 o é: “...e eis que ficarás mudo, e não poderás falar até o dia em que estas
    coisas aconteçam; porquanto não creste nas minhas palavras, que a seu tempo hão
    de cumprir-se” (Lucas; 1:20).


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    13


    Os autores espirituais de `Os Quatro Evangelhos` tratam este problema nos termos
    e na linha de pensamento de Kardec. Nada dizem de novo, nada revelam. Mas há uma
    novidade: a confusão que estabelecem nos seus comentários dando a impressão de
    que o fatalismo preside a vida humana na Terra. Apercebendo-se disso, passam então
    a fazer advertências contra a interpretação errônea do que afirmam: "Não vejais,
    nestes pontos de vista, nenhuma fatalidade...”. E esse aviso só serve para mais
    confundir o problema.


    A revelação da revelação nada revela nesse assunto, como se pode ver no texto.
    Limita-se a repetir princípios doutrinários que Roustaing já havia aprendido ao
    ler `O Livro dos Espíritos` e `O Livro dos Médiuns`. Mas ajunta à repetição algumas
    hipóteses absurdas e improváveis que os discípulos e seguidores do "mestre" acreditam
    ser verdades reveladas. Entre essas a de que a mudez de Zacarias foi produzida
    pelo anjo, que impregnou a sua língua de fluidos magnéticos, tornando-a pesada...


    ## VI - O CORPO FLUÍDICO DE JESUS


    ### O CORPO FLUÍDICO DE JESUS


    A teoria central do Roustaing é a do corpo fluídico. Vejamos como se explica:


    ```

    "Jesus, pois, constituiu, ele mesmo, pela ação da vontade, o

    perisprito tangível e quase material que se tornou, tendo em vista o

    planeta que habitais, um corpo relativamente semelhante ao vosso".

    ```


    ### Conclusão da Análise Técnica


    Este pequeno trecho revela uma ingenuidade assustadora. O que fez Maria nesse
    episódio? Encarnou-se na Terra para fingir de mãe, esqueceu-se do papel que ia
    desempenhar – pois era médium inconsciente – mas agiu inconscientemente atraindo
    os fluídos na esperança de representá-lo. Entretanto, no momento decisivo, Jesus
    teve de intervir e constituir ele mesmo o seu corpo fluídico.

