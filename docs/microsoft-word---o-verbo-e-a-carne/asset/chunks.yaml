    na sua feição moral, quase diríamos religiosa, posto que aquilo que tem ganho
    em extensão tenha perdido em profundidade.


    A esses espíritas queremos lembrar o significado de escândalo. Assim o define
    o grande dicionário de Laudelino Freire: "ESCÂNDALO. S.M. Lat. **Scandalum.**


    Ocasião de erro ou pecado, especialmente quando produzida pelo mau exemplo. 2
    -


    Aquilo que pode induzir em erro ou pecado. 3 - Indignação suscitada por ação ou
    palavra indecorosa. 4 - Ofensa, injúria. 5 - Pessoa ou cousa que escandaliza.
    6 -


    Alvoroço, tumulto ou agitação a que dá causa um fato repreensível".


    Diante disso, escândalo é a deformação de textos bíblicos para servir à restauração
    de uma heresia velha de dezenove séculos, já combatida por alguns dos apóstolos
    de Jesus Cristo, principalmente por João.


    Como querem agora esses Espíritas, que se dizem seguidores da doutrina do Cristo,
    que pretendem conhecer os Evangelhos, que a eles fazem referências em artigos
    de jornais e em discursos nas suas sociedades, que se faça vista grossa **"àquilo**
    **que pode induzir em erro",** como não sentem **"ofensa, injúria, coisa que escandaliza"**'
