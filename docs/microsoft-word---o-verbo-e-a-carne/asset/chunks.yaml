    mantido com o Espírito de São Luís, que foi um dos instrutores para a obra de
    codificação da doutrina.


    Ora, se Kardec houvesse posto o assunto de quarentena, não teria publicado esse
    artigo e, quiçá, outros mais; não teria escrito as passagens citadas pouco acima,
    principalmente a que se acha em **A Gênese.**


