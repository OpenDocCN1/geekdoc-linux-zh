    passar pela fase da infância e da instrução e ser, pelos** **seus guias, colocada
    em situação de se servir do livre arbítrio".**


    **"Então, no gozo da sua independência e da sua liberdade, que de uma e** **outra
    decorrem, escolhe o Espírito o caminho que prefere tomar. Se se** **conserva puro
    no do progresso, dócil a seus guias, seguindo**


    **constantemente a estrada simples e reta que lhe é indicada, chegai à** **perfeição,
    tendo progredido no estado fluídico. Torna-se assim puro** **Espírito, Espírito
    que não faliu, de pureza perfeita e imaculada, tal como** **Jesus, protetor e
    governador do nosso planeta".**


    Roustaing leu no **Livro dos Espíritos** o tópico **re**ferente à progressão dos
    Espíritos. Ali encontrou os seguintes itens:


    **120 - Todos os Espíritos passam pela fieira do mal para chegar ao bem?**


    **R. - Não pela fieira do mal, mas pela da ignorância.**


    **12,1 - Por que alguns Espíritos seguiram o caminho do bem e outros o** **do
    mal?**


    **R. - Não têm eles o livre arbítrio? Deus não criou Espíritos maus.**


    **Criou-os simples e ignorantes, ou seja, tão aptos para o bem como** **para o
    mal. Os que são maus, assim se tornaram por sua vontade.**'
