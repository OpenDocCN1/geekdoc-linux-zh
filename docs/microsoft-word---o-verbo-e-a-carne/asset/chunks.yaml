    "Os Docetas (do grego dokein, aparecer), seita numerosa dos Gnósticos, que subsistiu
    durante os três primeiros séculos, tinham a mesma crença".


    Diante de tal clareza de exposição, o Sr. Gomes Braga fica entre as farpas do
    seguinte dilema: ou s. s. não conhece a obra de `Allan Kardec`, ou faz muito pouco
    caso do bom senso e da memória dos Espíritas. Numa, como na outra hipótese, s.
    s. revela-se como não estando à altura de um cargo na direção que, por todos os
    títulos, deveria ter o Espiritismo no Brasil.


    Se `Allan Kardec` se houvesse manifestado aos diretores da `F. E. B.`, a fim de
    se desdizer e apoiar a tese roustainguista, por certo não teria demonstrado degradação
    de seu caráter: aquela capacidade de minúcia, aquela precisão de análise tê-lo-iam
    levado a encarar altamente o assunto e, lizamente confessando seu voto, teria
    encarregado a direção da casa de fazer aquela revisão em sua obra que, há já cerca
    de sessenta anos, a influência roustainguista em vão tentou executar, para adaptá-la
    aos interesses roustainguistas, tonto vale dizer, para entregar a direção espiritual
    da doutrina ao anticristo.


    É por tudo isto que continuamos pensando que a Verdade está na Bíblia e que os
    espíritas precisam aí encontrá-la; que as palavras do Cristo não passarão e, por
    isso, não lhe cairão nem um til nem um jota: finalmente, que o roustainguismo
    é um equívoco, que precisa ser destruído quanto antes 57.


    57 NOTA - A posição bíblica do autor parece-nos extremada. Mas a sua posição kardeciana
    é bem clara e lógica, apoiada nos textos acima transcritos. A Bíblia – o Velho
    Testamento – mesmo acrescida pelo Novo Testamento, não seria suficiente para negar
    valididade à absurda teoria roustainguista, pois o seu texto tem servido para
    as interpretações mais contraditórias. A explicação de `Kardec` e o absoluto silêncio
    dos Espíritos Superiores – nestes dois mil anos – sobre a velha hipótese do corpo
    fluídico, parecem-nos mais importantes. Por outro lado, a lógica da explicação
    kardeciana é decisiva. Um Jesus de mentirasó pode ser admitido pela antilógica
    do anticristo. (H.P.).


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    66


    ## IV


    ### Jesus: Homem ou Agênere?


    Consideremos agora as seguintes teses:


    IV - que Jesus Cristo não era homem, mas um agênere; VII - que "se não fosse confirmada
    a natureza excepcional do corpo fluídico de Jesus pelo Espiritismo, as duas Revelações
    anteriores teriam que cair e o Espiritismo não subsistiria; e X que quem nega
    que Jesus tenha sido um agênere nega também a codificação kardeciana, não é espírita."


    Antes, porém, de entrarmos na análise destas três teses, seja-nos lícito fazer
    algumas considerações tendentes a dar a compreender a nossa atitude e, do mesmo
    passo, atenuar os temores de alguns confrades muito tíbios, que julgam que estamos
    fazendo escândalo.


    Tais confrades têm um modo singular de entender a função evangelizadora: acham
    que não se devem atacar os erros, pois isto seria, a seu ver, uma prova de intolerância;
    mas não raciocinam que, com o silêncio, estão endossando os mesmos erros; não
    pensam que as altas fontes que despejam ensinos errados estão desviando criaturas
    do bom caminho; temem ofender aos "amigos" que confundem as próprias ideias, convicções
    e interesses com a Verdade e não temem ofender ao Mestre, que não se zanga e nem
    protesta, e cujo nome vive em suas bocas, mas cuja doutrina nem lhes encheu o
    cérebro nem lhes melhorou o coração.


    Particularmente para os Espíritas o que mais deve interessar é aquilo que repercute
    no Espírito, que é eterno. Então, nesta questão de falsificar versículos da Bíblia
    e adulterar as obras de `Kardec` pode não haver escândalo para os Espíritos revestidos
    na matéria e mais preocupados com as exterioridades, com as aparências com os
    proventos materiais e a importância das posições que ocupam, do que propriamente
    com a aquisição de conhecimentos e com a sua utilização, no seno de se melhorarem
    e ajudarem os seus semelhantes a se melhorarem. Mas do outro lado, no plano espiritual,
    o escândalo rola há muitos anos.


    Fosse alguém tentar discutir os mesmos pontos que estamos discutindo nas salas
    da Avenida Passos, e seria Convidado a não tocar no assunto, que é questão fechada;
    fosse uma sociedade adesa à `Federação Espírita Brasileira` abordar a matéria
    em família, talvez acabasse expulsa, como foi o caso da `Federação Gaúcha` – por
    algo menos que isso.


    Os roustainguistas não querem a discussão porque o roustainguismo é uma fascinação,
    é uma obsessão coletiva, como obra do anticristo, que é. Por outro lado, a grande
    maioria dos dirigentes espíritas kardecistas ou anti-roustainguistas – perdoem-nos
    que lhes digamos – lêem bastante, mas não fizeram da doutrina um estudo sistemático,
    fichado, arrumado: parece que ignoram que ainda há muita coisa de `Kardec` que
    é desconhecida em nossa língua; que certos temas, indicados por ele, são 58.


