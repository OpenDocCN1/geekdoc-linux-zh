    Esses fatos mostram como é insistente e nefasta a propaganda dessa obra de mistificação
    em nosso meio, mormente por uma instituição tradicional e conceituada. Neste volume,
    `Júlio Abreu Filho` faz denúncias graves de desvirtuamento de obras mediúnicas
    pelo fanatismo roustainguista. Essas denúncias não são de agora, mas publicadas
    há vários anos. Apesar de tudo a propaganda continua e a obra deturpadora vai
    semeando o seu joio na seara. O silêncio estabelecido pelo `"Pacto Áureo"` deu
    resultados negativos, pois toda uma geração espírita se formou nesse período e
    agora está sendo colhida de surpresa pela "novidade" do `Roustainguismo`. Por
    esses frutos podemos avaliar a árvore. Qual o bom fruto que o `roustainguismo`
    produziu? Qual?


    Por tudo isso – e pelas suas consequências desmoralizadoras – é necessário que
    os espíritas sinceros não se calem. É preciso dizer, alto e bom som, nas palestras
    e conferências, nos artigos e nos livros, a verdade sobre a obra de `Roustaing`.
    A análise que acabamos de fazer tinha a pretensão de ser apenas análise – e acabou
    nos levando obrigatoriamente ao terreno da acusação. Porque não é possível calar
    diante da astúcia dos mistificadores e da fascinação dos que a aceitam e aplaudem.


    É dever dos espíritas sinceros combater a mistificação roustainguista neste alvorecer
    da Era Espírita no Brasil. Ou arrancamos o joio da seara ou seremos coniventes
    na deturpação doutrinária que continua maliciosamente a ser feita. O Cristo agênere
    é a ridicularização do Espiritismo, que se transforma num processo de deturpação
    mitológica do Cristianismo. A doutrina do futuro nega-se a si mesma e mergulha
    nas trevas mentais do passado. O homem-espírita, vanguardeiro e esclarecido, converte-se
    no homem da era ante-cristã, no crente simplório das velhas mitologias.


    > "Para o triunfo do mal basta que os bons fiquem de braços cruzados."


    ## Edmund Burke


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________

    34

    XIV


    ## O CASO GUERRA JUNQUEIRO


    Difícil encontrar-se um poeta mais controvertido, porque mais incompreendido do
    que `Guerra Junqueiro`. Considerado genial e até mesmo, à revelia dos camoneanos,
    "o poeta da raça" pelos contemporâneos, foi depois dissecado pela crítica e reduzido
    a um produto do conflito entre o panfletário e o lírico. Mas a própria crítica
    envereda por contradições às vezes insanáveis, encarando o poeta e sua poesia
    pelos ângulos mais diversos. O fato é que não se pode negar o vigor desse espírito
    que encarnou em Portugal o símbolo da fusão mística de `Cristo` e `Prometeu` (a
    fé e a razão) que ele mesmo tentou exprimir em "O Prometeu Libertado".


    Esse entrechoque dialético aturdiu a crítica. Poucos dos seus críticos foram capazes
    de ver, nas três fases clássicas da sua poesia, o desenvolvimento de um processo
    que terminaria na síntese. E está nisso a grandeza do poeta. Os contemporâneos
    tinham razão. `Guerra Junqueiro` foi um gênio da poesia portuguesa.


    Sua obra começa no melodrama, nascendo do povo em tom declamatório, como um tufão
    que se erge da poeira para lançar-se na altura e varrer as nuvens e os astros.
    A voz do povo é o chicote que ele empunha no templo. Mas no final o tufão se amaina
    e volta ao chão para cantar "Os Simples" em modulações líricas, sem com isso perder
    o vigor natural dos titãs.


    Na vida espiritual `Guerra Junqueiro` continua o mesmo. Os críticos de régua em
    punho encontrarão nesse fato um bom motivo para rejeitá-lo, livrando-se facilmente
    da preocupação com a imortalidade. Mas os que estudam, pesquisam e conhecem o
    problema das comunicações mediúnicas o identificam em seus vários aspectos, não
    contraditórios, mas complementares, necessários para nos dar a visão global da
    sua grandeza. É fácil olhar para uma montanha de minérios, como as que vemos em
    `Minas Gerais`, e dizer simplesmente: é estéril e feia, áspera e vulgar. Mas a
    atitude legitima, e por Isso mesmo difícil, é vê-la na multiplicidade da sua grandeza,
    em que tanto encontramos a aspereza das rochas como a doçura das flores e a riqueza
    mineral.


    Nos poemas que ainda hoje nos envia do Além essa multiplicidade de aspectos continua
    presente. Podemos ver isso em "Parnaso de Além-Túmulo", de `Francisco Cândido
    Xavier`, como na "Antologia do Mais Além” de `Jorge Rizzini`. Mas encontramos
    em "Os Funerais da Santa Sé", de `América Delgado`, uma contradição violenta,
    ainda não analisada, que opõe o poeta positivo da vida terrena a um poeta utópico
    e até mesmo insensato da vida espiritual. O equilíbrio vigoroso do tufão se desfaz
    em rajadas desnorteantes de um vendaval rasteiro. A síntese da inspiração junqueirana
    se dissolve em imagens e apóstrofes vulgares de um misticismo de fundo místico,
    na condenação insensata das leis naturais. `Guerra Junqueiro`, o pensador, se
    deteriora numa insensatez mitológica de pura desagregação psíquica.


    Sua mente se degenera em processo de regressão, separando `Jesus` (a fé) de `Prometeu`
    (a razão).


    ## CRENÇA E MEIO


    Publicado em 1932, portanto há quarenta anos, o poema mediúnico "Os Funerais da
    Santa Sé” graças ao prefácio de `Guillon Ribeiro`, foi aceito pacificamente pelo
    meio espírita. Mas hoje quando os roustainguistas pretendem levá-lo em O Verbo
    e a Carne – 2 Análises do Roustainguismo ______________________________________________

    35

    bandeira de luta, no vale-tudo em que se empenham, a análise mais superficial
    revela a sua fragilidade. O próprio `Guerra Junqueiro` silenciou a respeito durante
    esses anos. Não havia clima para um estudo sereno e não convinha levar lenha à
    fogueira: Mas para tudo há um limite. Agora, através da mediunidade de `Jorge
    Rizzini`, ele nos explica o enigma. América Delgado filiara-se à linha de pensamento
    roustainguista da `FEB` e estava naturalmente sujeita às influenciações nesse
    sentido.


    Não por sua culpa, mas, como nos explicou certa vez `Frederico Figner`, em comunicação
    que publicamos no jornal "Mundo Espírita" e deu muito pano para manga, por culpa
    da orientação errada da casa em que se iniciara no Espiritismo.


    Seria possível aplicar o mesmo argumento aos que não aceitam a teoria roustainguista.
    Mas acontece que a orientação kardecista não se funda na crença e sim na razão
    e na pesquisa. O método de `Kardec` é científico e por isso mesmo exclui os perigos
    do condicionamento à crença e da sujeição ao ambiente. Mas os que fizeram de `Kardec`
    um mito ao invés de um pesquisador, um visionário ao invés de um homem de bom
    senso, e deram ao seu grupo ou instituição um clima de misticismo cego estarão
    sujeitos aos mesmos riscos dos ambientes roustainguistas.


    Não é esse o caso do médium `Jorge Rizzini`, que se atém ao bom senso de `Kardec`
    e procura conhecer as possibilidades e os limites da sua mediunidade.

