    das cerimônias e preces de que se compõe o serviço divino. Para a maioria das
    Religiões, os dogmas são revelações diretas de Deus, são imutáveis e inquestionáveis.
    Segundo a “lógica” da teologia das Igrejas cristãs, as revelações cessaram após
    a morte do último apóstolo, ficando as Igrejas impedidas de fazerem novas revelações
    e criar novos dogmas.


