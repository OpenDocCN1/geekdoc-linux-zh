    Como encontrar a verdade substancial desse silogismo? Ela está sempre na premissa
    menor. A verdade é modesta, esconde-se no meio do silogismo. A premissa maior
    enuncia um princípio geral, sobre o qual não há dúvida: "Os Espíritos Superiores
    se manifestam para revelar a Verdade". A premissa menor tira uma conseqüência
    que pode ser verdadeira ou falsa: "A Revelação da Revelação foi ditada por Espíritos
    Superiores".


    A premissa menor é a chave do silogismo, mas o silogismo, por si mesmo, não pode
    provar a sua legitimidade. É então que temos de recorrer à pesquisa, à análise,
    ao exame kardeciano dessa hipótese. Nesse caso temos de nos servir do método de
    `Kardec` para testar os Espíritos. Se não provarmos que eles realmente são superiores
    o silogismo é falso e a tese é substancialmente falsa.


    Mas vejamos agora o silogismo de Roustaing. Ele é colocado, com perfeição formal,
    no início do prefácio de `Os Quatro Evangelhos`. O seu esquema nos oferece todo
    o processo de raciocínio que levou Roustaing a aceitar a obra e a oferecê-la ao
    mundo como uma nova revelação. Vejamô-lo nas próprias palavras de Roustaing, segundo
    a tradução primorosa de Guillon Ribeiro:


    1) Emana esta obra daqueles que prepararam o advento da missão terrena de Jesus,
    participaram do desempenho dessa missão e escreveram esses livros (os Evangelhos)
    ;


    2) Depois de haverem, nos limites da missão terrena que cumpriram, dado testemunho
    de Jesus, eles, despojando da letra o espírito;


    3) Vêm clarear o que parecia trevas e do que era considerado mentira extrair a
    verdade.


    Coloquemos agora, para maior clareza, esse longo silogismo em termos de lógica
    formal. Sua estrutura lógica é éa:


    1) Os Quatro Evangelhos são obra dos precursores, dos evangelistas e dos apóstolos.

    2) Eles agora apresentam os Evangelhos sem o véu da letra.

    3) Logo, Os Quatro Evangelhos são a Verdade.


    Segundo a lógica formal, também chamada lógica menor, este silogismo nos leva
    apenas à verdade formal. Mas para chegarmos à verdade substancial temos de recorrer
    à lógica maior, que exige o exame das premissas. Ao contrário do silogismo que
    demos como exemplo inicial, este silogismo de Roustaing não parte de uma premissa
    formada por um princípio geral, mas por um pressuposto particular. Roustaing admitiu
    a legitimidade dos autores espirituais da obra, mas o seu veredicto pessoal não
    tem validade universal.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________
    10


    Temos assim de analisar as duas premissas. Se a primeira se mostrar substancialmente
    falsa, ou seja, se obtivermos a prova de que os espíritos que ditaram a obra não
    são o que Roustaing supõe, todo o raciocínio estará prejudicado.


    A segunda premissa será falsa, pois seu fundamento é a primeira. E a conclusão,
    resultante lógica de duas premissas falsas, não exprimirá a verdade mas a mentira.


    Todo o nosso empenho, portanto, terá de ser posto no exame do texto, pois somente
    o texto poderá nos revelar a natureza real dos espíritos autores.


    ## IV - OS TEXTOS MEDIÚNICOS


    As matérias que se seguem a esse prefácio de Roustaing são várias e constituem
    complementos do mesmo. Sua finalidade é demonstrar a concordância da teoria roustainguista
    com as pesquisas científicas dos fenômenos espíritas e refutar a crítica de `Kardec`
    a `Os Quatro Evangelhos`. Constituem assim um anteparo do texto. O que nos interessa
    não são os argumentos polêmicos mas a obra em si. Faremos um exame de amostragem,
    colhendo os trechos mais significativos dos textos mediúnicos, aqueles em que
    falara os Espíritos ou autores espirituais. Não seria possível um exame total
    e minucioso da obra, o que exigiria uma obra ainda mais vasta que a de Roustaing.


    Entremos, pois, na apreciação dos seguintes trechos:


    "Os evangelistas eram, sem o saberem, médiuns historiadores inspirados, mas dentro
    dos liames da humanidade, guardando, em face da aptidão mediúnica, a independência
    da natureza que lhes era peculiar. Assim, escrevendo, recebiam a intuição que
    os auxiliava na revelação".


    "A intuição lhes vinha da inspiração divina por intermédio de espíritos superiores
    que desempenhavam o papel de ministros de Deus, agindo sobre a natureza humana,
    livre e falível, de cada um deles".


    "As palavras dos apóstolos passaram de boca em boca durante muito tempo antes
    que fossem escritas, o que deu lugar, de certo modo, às diferenças que se notam
    nas narrativas. Levando em conta o que nas relações mediúnicas há de humano e
    por isso de molde a embaraçá-las, terse-á desvendado o segredo dessas diferenças,
    aliás pouco importantes em si mesmas".


    "Não podendo deixar de ser assim, os evangelistas, em certos casos que vos serão
    assinalados, ficaram privados da inspiração, entregues ao próprio critério, nalguns..."


    (Tomo I, cap. I - Os Evangelhos)


    Nos dois primeiros trechos vemos os evangelistas classificados como médiuns historiadores
    inspirados. Recebiam a inspiração de espíritos. Mas no trecho último vemos que,
    em certos casos, ficaram privados da inspiração.


    A experiência mostra, desde o tempo de `Kardec` até hoje, que os médiuns inspirados,
    mormente quando a serviço de causas elevadas, não


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________
    11


    jamais entregues a si mesmos. [...] nesse caso, teriam falhado no cumprimento
    da missão. Como admitir isso?


    Acontece que essas diferenças são explicadas muito mais simples e objetivamente
    por esta verificação das pesquisas históricas: os evangelistas escreveram seus
    relatos em épocas e locais diferentes, distanciados uns dos outros. Quanto à transmissão
    oral das apóstolos temos de considerar a existência das `logia`, anotações escritas
    de trechos de sermões de Jesus pelos apóstolos. O proto-evangelho de Marcos, também
    designado pela expressão alemã `Urmarcus`, é considerado como o ditado pessoal
    das lembranças do apóstolo Pedro ao seu discípulo Marcos, ainda na língua aramaica.
    Também esses fatos eram ignorados de Deus?


    O Evangelho de Marcos, na forma que conhecemos, foi escrito no ano 45, em grego,
    provavelmente em Roma. O de Mateus foi escrito entre os anos 55 e 60, provavelmente
    na Síria, em hebraico. O de Lucas entre os anos 70 e 80, em grego literário de
    fino lavor, possivelmente na Europa ou na Ásia. O de João nos anos 80, em grego
    e na cidade de Éfeso. Renan, no passado, e Charles Guignebert, no presente, são
    os dois grandes pesquisadores históricos, ambos franceses, que conseguiram melhor
    estabelecer esses dados. Ambos concordam em que os primeiros escritos que deram
    origem aos Evangelhos foram feitos muito cedo, ainda durante a vida de Jesus.

