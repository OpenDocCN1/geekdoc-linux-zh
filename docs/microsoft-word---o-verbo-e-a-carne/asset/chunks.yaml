    surpreso e que morreu no silêncio, quando eu esperava certo reboliço. Até agora
    estou esperando um pouco mais de luzes sobre o laconismo daquela notícia".


    > "Resumidamente, dizia o telegrama que, pela primeira vez, havia sido publicado
    o texto em que a Igreja reconhece que desencarnados possam ser agentes nos fenômenos
    psíquicos. Mais ou menos isto. Não dizia qual era a Igreja, mas quanto à palavra
    Igreja, mormente em nosso meio, não se ajunta nenhum adjetivo, subentende-se 60
    `Kardec` afirmou que a chave das Escrituras Sagradas é o `Espiritismo`. Sem essa
    chave o conhecimento da Bíblia é sempre formal, não substancial. Neste ponto o
    autor se deixou levar pela sua evidente simpatia pelos protestantes, o que vale
    por bonita deção."


    ## `69`


    Quanto à palavra `Igreja`, mormente em nosso meio, não se ajunta nenhum adjetivo,
    subentende-se 60 `Kardec` afirmou que a chave das Escrituras Sagradas é o `Espiritismo`.
    Sem essa chave o conhecimento da Bíblia é sempre formal, não substancial. Neste
    ponto o autor se deixou levar pela sua evidente simpatia pelos protestantes, o
    que vale por bonita deção.


    "E de que a a Igreja reconhece que desencarnados possam ser agentes nos fenômenos
    psíquicos. Mais ou menos isto. Não dizia qual era a Igreja, mas quanto à palavra
    Igreja, mormente em nosso meio, não se ajunta nenhum adjetivo, subentende-se 60
    `Kardec` afirmou que a chave das Escrituras Sagradas é o `Espiritismo`. Sem essa
    chave o conhecimento da Bíblia é sempre formal, não substancial. Neste ponto o
    autor se deixou levar pela sua evidente simpatia pelos protestantes, o que vale
    por bonita deção."


    ***


    Mas vamos às teses.


    Diz a quarta que Jesus não era homem, mas um simples agener.


    Responderemos com a Bíblia. Assim lemos na chamada Bíblia, que nos reportamos
    no primeiro artigo:


    - "E o Verbo se fez carne, e habitou entre nós; e nós vimos a sua glória, como
    Filho unigito do Pai, cheio de graça e de verdade." `João 1:14`

    - "E visivelmente é grande o sacramento da piedade, com que Deus se manifestou
    em carne, foi justificado pelo espírito, foi visto dos anjos, tem sido pregado
    aos gentios, crido no mundo, recebido na glória." `1 Timóteo 3:16`

    - "Porque também Cristo uma vez morreu pelos nossos pecados, o justo pelos injustos,
    para nos oferecer a Deus, sendo sim morto na carne, mas ressuscitado pelo Espírito."
    `I Pedro 3:18`

    - "Havendo pois Cristo padecido na carne, armai-vos vós-outros desta mesma consideração:
    que aquele que padeceu na carne cessou de pecados." `1 Pedro 4:1`

    - "Nisto se conhece o espírito que é de Deus: todo o espírito que confessa que
    Jesus Cristo veio em carne é de Deus." `1 João 4:2`

    - "E todo o espírito que não confessa a Jesus não de Deus; mas este tal é o Anticristo,
    do qual vós tendes ouvido que vem, e ele agora está já no mundo." `1 João 4:3`

