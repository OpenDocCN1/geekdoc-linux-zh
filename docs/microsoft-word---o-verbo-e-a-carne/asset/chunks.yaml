  trans: '


    这些事实表明，这种伪造作品的宣传在我们圈内是多么的顽固和有害，尤其是由一家传统且受推崇的机构所为之。在这卷书中，`Júlio Abreu Filho` 对鲁斯廷格主义（Roustainguismo）狂热对灵媒作品的歪曲提出了严重指控。这些指控并非现在，而是多年前就已经发表了。尽管如此，宣传仍在继续，那部歪曲事实的作品继续在田间播种杂草。“黄金契约”（Pacto
    Áureo）所建立的沉默产生了负面结果，因为整整一代灵学生都在这段时期形成，现在被`鲁斯廷格主义`的“新奇”措手不及。通过这些果实，我们可以评价这棵树。`鲁斯廷格主义`产生了什么好果实？究竟是什么？


    正因这一切——以及其损害名誉的后果——真诚的灵论者不能保持沉默。必须在讲座、会议、文章和书籍中，大声且响亮地说出关于`Roustaing` 作品的真相。我们刚刚进行的分析本意仅仅是分析——结果却不可避免地将我们带入了指控的领域。因为面对伪造者的狡诈以及那些接受并赞美他们者的着迷，是不可能沉默的。


    真诚的灵论者的责任是在巴西灵性主义时代的这一黎明时刻，斗争鲁斯廷格主义的伪造。我们要么拔除田间的杂草，要么对这种恶意持续的教义歪曲听之任之。“无生缘的基督”（O
    Cristo agênere）是对灵性主义的嘲弄，它变成了一个对基督教进行神化的歪曲过程。未来的学说否定了自身，陷入了过去的精神黑暗中。作为先锋和开明的灵论者，变成了前基督教时代的人，变成了对古老神话的单纯信徒。


    > “要让恶获得胜利，好人只需要袖手旁观即可。”


    ## Edmund Burke


    言辞与肉——对鲁斯廷格主义的 2 次分析 ______________________________________________

    34

    XIV


    ## GUERRA JUNQUEIRO 案件


    很难找到一个比`Guerra Junqueiro`更具争议、更被误解的诗人了。他被同时的人视为天才，甚至在无视卡蒙斯（Camanoanos）的情况下被称为“种族的诗人”，后来又被批评界剖析，并被还原为传单文学与抒情文学冲突的产物。但批评界本身有时会陷入无法调和的矛盾，从各种角度审视这位诗人及其诗歌。事实是，不能否定这种精神的活力，这种精神在葡萄牙化身了`基督`与`普罗米修斯`（信仰与理性）神秘融合的象征，而他本人也试图在《被解放的普罗米修斯》（O
    Prometeu Libertado）中表达这种融合。


    这种辩证的冲突震惊了批评界。他的批评者中，很少有人能在他诗歌的三个古典阶段看到一个走向合成过程的发展。这正是这位诗人的伟大之处。同时代的人是对的。`Guerra
    Junqueiro`是葡萄牙诗歌的一位天才。


    他的作品始于通俗剧，诞生于人民，带有宣叙性的语调，像一场台风从尘埃中升起，冲向高空，扫过云层和星星。人民的声音是他在庙里挥着的鞭子。但最后，台风平息了，回到地面，以抒情的调调唱着《简单的人》（Os
    Simples），但并未失去巨人们那自然的活力。


    在灵性生活中，`Guerra Junqueiro`依然如故。拿着尺子的批评者会在这一事实中找到拒绝他的好理由，轻松地摆脱对不朽的关注。但那些研究、调查并了解灵媒交流问题的人，从他多个互不矛盾而是互补的方面识别了他，这些方面对于我们提供他伟大的全局视角是必要的。很容易看待一座矿山，如我们在`Minas
    Gerais`看到的那些，并简单地说：它是贫瘠而丑陋的，粗糙而俗气的。但正确的态度——也因此变得困难——是在其伟大的多样性中看到它，在那里既能找到岩石的粗糙，也能找到花朵的甜美和矿物的财富。


    在他今天从彼岸传给我们的诗中，这种方面的多样性依然存在。我们可以在`Francisco Cândido Xavier`的《彼岸帕纳索》（Parnaso de
    Além-Túmulo）中以及`Jorge Rizzini`的《彼岸选集》（Antologia do Mais Além）中看到这一点。但在`América
    Delgado`的《圣座的葬礼》（Os Funerais da Santa Sé）中，我们找到了一种剧烈的、尚未分析过的矛盾，它将世俗生活的诗人与灵性生活的乌托邦式甚至是愚的诗人对立起来。台风强有力的平衡消散在地面狂风那迷失方向的阵阵中。Junqueiro
    式灵感的合成溶解在具有神秘主义背景的庸俗意象和呼告中，溶解在对自然法则愚蠢的谴责中。作为思想者的`Guerra Junqueiro`退化为一种纯粹精神解体的神话式无知。


    他的大脑在一种回归过程中退化了，将`耶稣`（信仰）与`普罗米修斯`（理性）分开。


    ## 信仰与环境


    发表于 1932 年（即四十年前）的灵媒诗歌《圣座的葬礼》，在`Guillon Ribeiro`的序言下被灵性界和平地接受了。但现在当鲁斯廷格者试图将其引入《言辞与肉——对鲁斯廷格主义的
    2 次分析》______________________________________________

    35

    作为战斗的旗帜，在他们投入的这种不择手段的情况下，最浅的分析揭露了它的脆弱性。`Guerra Junqueiro`本人在那期间对此保持了沉默。当时没有冷静的氛围，不宜火上加油：但万物皆有度。现在，通过`Jorge
    Rizzini`的灵媒，他为我们解释了这个谜团。América Delgado 加入了`FEB`的鲁斯廷格思想路线，自然容易受到这方面的影响。


    这并不是她的错，正如`Frederico Figner`曾在我们发表于《灵性世界》（Mundo Espírita）杂志的一篇引起许多争议的通讯中向我们解释的那样，是因为她进入灵性主义的引导是错误的。


