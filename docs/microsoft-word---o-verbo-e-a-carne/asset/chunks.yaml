    ## **II**


    **Roustaing como encarregado da Fé**


    Vamos às teses. A primeira delas é:


    A missão de Kardec foi notavelmente auxiliada pelo Sr. Roustaing "encarregado
    de organizar os trabalhos da fé, dando confirmação às revelações anteriores".


    Inicialmente, analisemos o caso Roustaing sob um aspecto mais geral, buscando
    saber se o grande advogado francês foi mesmo um missionário, e missionário da
    Terceira Revelação.


    Conforme os ensinamentos da doutrina espírita, missionário na Terra é o Espírito
    que, na vida de além túmulo, ou escolheu ou aceitou uma tarefa importante a realizar
    entre os homens. Pela lógica, de que se não apartam os grandes Espíritos que nos
    trouxeram todo esse vasto acervo de materiais, que permitiram fossem os problemas
    do Espiritismo estudados sob critérios seguros e métodos realmente científicos,
    um Espírito missionário pode triunfar, como pode falir na sua missão, porque,
    apesar de desfrutar de livre arbítrio, suas forças entram em jogo com outras forças
    do meio social, as quais agem como modificadoras de seu impulso inicial, tanto
    em valor ou grandeza como em direção ou ponto de aplicação, de modo que se constata
    um puro fenômeno de mecânica social. Pode triunfar ou falir em conseqüência da
    lei de CAUSA e EFEITO 37, isto é, de seus antecedentes intelectuais, espirituais
    e, sobretudo, morais, cuja ação se haja refletido no passado meio social 38\.
    Pode ver-se rodeado de dificuldades insuperáveis, inerentes umas a seu próprio
    modo de ser, outras à ação de seus amigos e adversários de ambos os planos. Essas
    dificuldades podem ainda derivar-se da extemporaneidade de sua ação missionária,
    da sua inabilidade ou da inadequabilidade de seus métodos, ou mesmo da falta de
    um plano que, como no campo militar, reveste dois aspectos –


    um tático, outro estratégico.


    Como quer que seja, a falência denota uma falha do Espírito que, com a derrota,
    deixa a prova para que não havia preparado suficientemente, não tinha sabido cercar-se
    de companheiros, de auxiliares, de coadjuvantes, encarnados ou desencarnados,
    para uma tarefa que, via de regra, nunca tem cunho exclusivista e pessoal, jamais
    é confiada a um indivíduo isolado: é como se procede nos estados-maiores, onde
    se faz trabalho de equipe. Dentro da lógica, sempre guardada por todos os bons
    Espíritos, atendo-nos à relação "causa-efeito", o fracasso é sempre sinal de inferioridade,
    hipertrofia do Eu, orgulho e vaidade 39.


    Sabe-se pelo ensino dos Espíritos que egoísmo e orgulho 40 constituem as duas
    maiores fontes de males e fracassos. Deu-nos Kardec um belo exemplo de haver operado
    estas debilidades, recusando terminantemente intitular-se autor ou inventor de
    uma escola filosófica, de uma doutrina.


    Honesto como quem mais o foi, não pode ser medido pela craveira daqueles que andam
    se escorando na adulteração do alheio pensamento para sustentar as próprias idéias.
    Esta falta se não a cometeu o próprio Roustaing cometeram-na os Espíritos inspiradores
    de sua obra; cometeram-na os seus partidários, tanto na França quanto no Brasil.


    Ora – já o dissemos – não pode estar com a boa causa da Verdade quem procura esteia-la
    na mentira.


    37 Kardec, A. - QE, c.1 p.90; c.2, n.1 p.151; c.3, n.134 p.203\. - ESE; 5:6 e
    8:14 a 17, 21\. - Gên. 2:1 a 7 e 15:25\. - RE


    1861, set. p.286; out. p.327; - 1862, jan. p.5; abr. p.112; nov. p.323.


    38 Kardec, A. O Livro dos Espíritos, perg. 850.


    39 O isolamento orgulhoso de Roustaing foi realmente o motivo principal da sua
    mistificação. Mas esse isolamento decorria do seu desejo de fazer obra pessoal,
    de ser o missionário da "revelação da revelação" (H.P.).


    40 Kardec, A. ESE; 16:8 e 17:2 – RE 1864, fev. p. 39.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    53


    Assim sendo, podemos aceitar que Roustaing tivesse encarnado com uma certa missão:
    mas é fora de dúvida que faliu porque aceitou inverdades; porque não deu à sua
    obra aquela força moral – que se encontra na obra kardeciana – de propagar a Verdade
    e separar-se da mentira e do erro.


    Por que teria falido?


    Porque ainda tinha, em alta dose, os resquícios da vaidade e do orgulho.'
