    \ `Collignon` tem hoje caráter de universalidade, porque espíritos a confirmaram\
    \ através de médiuns: `Zilda Gama`, `América Delgado` e `Francisco Cândido Xavier'\"\
    ;\n\nII - Que `Allan Kardec` não combateu a teoria do corpo fluídico de Jesus;\
    \ posteriormente, como espírito, apoia\".\n\nContestamos, baseado no bom senso,\
    \ a afirmativa de que a obra de `Collignon` tenha hoje caráter de universalidade,\
    \ porque espíritos a confirmaram através de médiuns. Quando uma coisa alcança\
    \ um certo número de países, diz-se que é internacional; universal, pela própria\
    \ etimologia é aquilo que é peculiar ou relativo ao universo, isto é, à totalidade\
    \ dos países do mundo. Ninguém sabia que um fato ou a confirmação de um fato na\
    \ Casa de Passos pudesse ter assim, um caráter universal. Até parece que esse\
    \ \"universal\" é mera tradução da voz grega `catholikos` e que não estamos longe\
    \ de ver a gente da Casa de Ismael proclamá-la em Vaticano, como sede gestatória,\
    \ para carregar o `pontifex-maximus`.\n\nSe não bastar a inanidade do argumento\
    \ de que a obra de `Collignon` tenha hoje caráter de universalidade, porque espíritos\
    \ a confirmaram através de médiuns, vejamos se não deforma ou altera a obra de\
    \ `Kardec`.\n\n`Chico Xavier` sempre se esquivou a polêmicas. Sua função mediúnica\
    \ não pode ser perturbada. Sua humildade natural a coloca à margem de divergências\
    \ doutrinárias. Mas sua firmeza kardecista se traduz no seu comportamento e nas\
    \ suas obras, onde `Kardec` e só `Kardec` está presente. O autor tem razão. `Chico`\
    \ é mencionado indevidamente nesse caso. (H.P.).\n\n*(Nota: O usuário forneceu\
    \ o texto em português e pediu tradução para o chinês, mas o texto de entrada\
    \ fornecido no bloco final já estava em português e parecia um rascunho de tradução\
    \ ou o original. Reavaliando o prompt: o prompt pede \"traduzir texto inglês para\
    \ chin\", mas o texto fornecido está em Português. Eu farei a tradução para o\
    \ CHINÊS agora).*\n\n[content]\n51 Pastorino, C. T. 福音的智慧 – 第 1 卷 – 前言。请查看 Werner\
    \ Keller 的历史书籍：《《圣经是正确的》》。\n\n52 这是一个及时的观察，因为显然，反对唯灵教的天主教力量与捍卫 Roustaing 作品的灵性力量之间存在联系。所有撰写和反对\
    \ Roustaing 主义伪装的人都知道，他们受到了来自空间中天主教阵营的巨大攻击，这些阵营将该作品视为嘲笑和瓦解唯灵教的有效工具。Roustaing 主义小组一直受到这些力量的迷。（H.P.）。\n\
    \n# 与肉身 – 对 Roustaing 主义的 2 项分析 ______________________________________________\n\
    \n59\n\n诚实的反驳、逻辑的论证，这只有通过大量系统且耐心的研究才能实现，这需要多年的奉献才能试图证明如此推崇文本中可能的虚假。\n\n但对 Roustaing\
    \ 主义者来说并非如此。Roustaing 深受当时与灵体交流的时尚的影响；他产生了兴趣并想要成名，与 Kardec 竞争或超越他。虚荣是伪装者侵入的缺口。结果显而易见：教士阶灵体举行了一场狂欢；他们最终在法国扰乱了\
    \ Kardec 耐心、谦卑且智慧地组织的这一切。\n\n至于巴西的情况，同样的伪装者发现了得得的土壤，这得益于大众的缺乏文化、缺乏系统性的知识以及上层阶级对宗教话题的了解，特别是巴西人对《圣经》这本独特书籍知识方面的巨大缺陷。宗教混杂处理了其余部分。\n\
    \n现在是时候摧毁 Roustaing 主义所代表的误解了。\n\n“无论是黑夜还是白天，它都不会熄灭；它的烟云将永远升起；世代又世代地受其冲击；在万世中无人能经过。但鹈和鼴鼠将拥有它；猫头鹰和乌鸦将居住在里面；并在它上面张开混乱的绳和虚荣的铅垂。他们召集自己的贵族进入王国，但一个也没有；他们所有的君主将一无所有。他们的宫殿将长满刺，堡垒将长满荆棘和蒺草；它将是豺的住所，是鸵的栖息地”（以赛亚书；34:10\
    \ 至 13）。\n\n“凡事都是虚空。他们的作为毫无意义；他们的铸造偶像像是风是虚幻的”（以赛亚书；41:29）。\n\n“无人以正直心肠求公义，无人以真理为辩护；他们信从虚空，说谎话；他们怀奸恶，生出不义”（以赛亚书，59:4）。\n\
    \n“主对我说：先知们用我的名说谎话；我没有派遣他们，也没有给他们命令，也没有对他们说话。他们所预言的是虚假的异象、占卜、虚空和内心的欺骗”（耶勒米亚书；14:14）。\n\
    \n“那些说‘主说’的人看见虚空和谎的占卜，因为主并没有派遣他们，他们却等候话成就。当你们说‘主说我没有说话’时，你们没有看见虚空的异象，没有说谎的话吗？因此主这样说：因为你们说了虚空，看见了谎言，所以我要反对你们。我的手也要反对那些看见虚空、占卜谎言的先知；他们不能进入我民的议会，不能写字，不能进入以色列地；我是耶和华”（以西结书；13:9）。\n\
    \n# 语与肉身 – 对 Roustaing 主义的 2 项分析 ______________________________________________\n\
    \n60\n\n## III - 论点分析 \n\n事态已至此，我们继续分析。我们可以将以下论点分类：\n\nI - “`Collignon` 的作品如今具有普世性特征，因为灵体通过媒介确认了它：`Zilda\
    \ Gama`、`América Delgado` 和 `Francisco Cândido Xavier'\";\n\nII - 即 `Allan Kardec`\
    \ 没有反对耶稣的流体体理论；随后作为灵体，他支持这一理论”。\n\n我们根据常识反对“`Collignon` 的作品如今具有普世性特征，因为灵体通过媒介确认了它”这一说法。当一件达到达到数量的国家时，被称为国际性的；而“普世性”（universal）从词源上来说，是指宇宙特有的或属于宇宙的，即世界上所有国家的整体。没有人知道一个事实或在步道之家（Casa\
    \ de Passos）对事实的确认可以这样具有普世性。似乎这个“普世”仅仅是希腊语 `catholikos` 的翻译，我们并不远看到 Ismael 之家的人在梵蒂冈将其宣布为受孕地，以承载\
    \ `pontifex-maximus`（大教宗），正如罗马人那样。\n\n如果说“`Collignon` 的作品如今具有普世性特征，因为灵体通过媒介确认了它”这一说法的荒谬还不足够，那么看看它是否会扭曲或改变\
    \ `Kardec` 的作品。如果这种论点还不够，还需要引用 `Kardec` 的作品。但在此，让我们看看媒介的情况。`Francisco Cândido\
    \ Xavier` 是一个正在执行卓越任务的媒介，他在巴西灵性领域享有声誉，但他并没有扭曲或改变 `Kardec` 的作品。`Chico Xavier` 总是避开争论。他的灵媒功能不能被干扰。他自然的谦卑让他置于教义分歧的边缘。但他对\
    \ Kardec 式的坚定体现在他的行为和作品中，那里 `Kardec` 只有 `Kardec` 存在。作者是正确的。`Chico` 在这个情况下被提及不当。（H.P.）。\n\
    \n# 语与肉身 – 对 Roustaing 主义的 2 项分析 ______________________________________________\n\
    \n61\n\n那么，那些为 `Francisco Cândido Xavier` 引导书籍的灵体是审慎且平衡的；他们不会今天说一件事，明天说另一件事；现在支持一个理论，以后却攻击或支持相反的理论，那是某些政治人物的特权；他们不会对说出来的内容进行修改、纠正或补充。\n\
    \n秘密地这样做是给自己的工作打上怀疑标记，甚至是给自己的名字标记，因为他们没有在光明下生活，正如那个实实主义格号那样。\n"
