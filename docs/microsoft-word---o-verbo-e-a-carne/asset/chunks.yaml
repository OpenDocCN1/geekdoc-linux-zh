    \ corrigiu: antes seguiu o prolóio: \"Cesteiro que faz cesto, faz um cento\".\n\
    \n`Chico Xavier` sempre se esquivou a polêmicas. Sua função mediúnica não pode\
    \ ser perturbada. Sua humildade natural o coloca à margem de divergências doutrinárias.\
