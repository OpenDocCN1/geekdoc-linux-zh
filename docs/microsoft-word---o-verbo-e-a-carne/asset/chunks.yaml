    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    64


    "Deve-se notar que as aparições tangíveis só têm aparências da matéria carnal,
    mas não as suas qualidades; em razão da sua natureza fluídica, não podem ter a
    mesma coesão, porque na realidade não é carne. Elas se formam instantaneamente,
    e do mesmo modo desaparecem ou se evaporam pela desagregação das moléculas fluídicas.
    Os seres que nestas condições se apresentam não nascem nem morrem como os outros;
    vê-mo-los ou não; os vemos mais, sem se saber donde vêm, como vieram, nem para
    onde vão; não se poderia matá-los, prendê-los, nem encarcerá-los, porque eles
    não têm corpo carnal; os golpes que lhes déssemos cairiam no vácuo".


    "Tal é o caráter dos agêneres, com os quais se pode conversar sem se saber o que
    eles são, mas que não se demoram e não podem tornar-se comensais de uma casa,
    nem figurar entre os membros de uma família.


    No mesmo livro, cap.`XV`, itens `65` a `67`, páginas `400` a `402`, temos:


    "A vida de Jesus na terra apresenta dois períodos o precedente e o seguinte à
    sua morte. No primeiro desde o momento da concepção até ao nascimento, tudo se
    passa, com sua mãe, como nas condições ordinárias da vida.


    Desde o seu nascimento até a sua morte, tudo em seus atos, em sua linguagem e
    nas diversas circunstâncias da sua vida, apresenta os caracteres inequívoco da
    corporeidade. Os fenômenos de ordem psíquica com ele produzidos são acidentais,
    e nada têm de anômalos por se explicarem pelas propriedades do perispírito; encontram-se
    em diferentes graus, noutros indivíduos. Depois de sua morte, ao contrário, tudo
    nele revela um ser fluídico. A diferença entre os dois estados é por tal forma
    acentuada, que não é possível assimilá-los".


    "O corpo carnal tem as propriedades inerentes à matéria propriamente dita, e que
    diferem essencialmente da dos fluídos etéreos; a desorganização opera-se aí pela
    ruptura da coesão molecular. Um instrumento cortante, penetrando no corpo material,
    divide os tecidos; se os órgãos essenciais à vida são atacados, param as suas
    funções, e a morte sobrevem, isto é, a morte do corpo. Esta coesão não existe
    nos corpos fluídicos, a vida não repousa sobre o jogo de órgãos especiais, e não
    podem produzir-se desordens análogas às que se produzem no corpo; um instrumento
    cortante, ou qualquer outro, penetra nele como num vapor, sem ocasionar lesão
    alguma. Eis a razão porque essas espécies de corpo não podem morrer, e porque
    os seres fluídicos, designados por `agêneres`, não podem sofrer a morte".


    “Depois dos suplício de Jesus, o seu corpo lá ficou, sem vida; foi sepultado como
    os corpos comuns, e todos puderam vê-lo e tocá-lo. Depois de sua ressurreição
    quando quis deixar a terra, não tornou a morrer; o elevou-se, apagou-se e desapareceu,
    sem deixar vestígios algum – prova evidente de que esse corpo era de natureza
    diferente daquele que morrera na cruz, onde é preciso concluir, que se Jesus morreu,
    é porque tinha corpo carnal''.


    "Em conseqüência das suas propriedades materiais, o corpo carnal é a sede de sensações
    e dores físicas, que se repercutem no centro sensitivo do Espírito.


    Não é o que sofre; é o Espírito que recebe a repercussão lesões ou alterações
    dos tecidos orgânicos. Em um corpo privado do Espírito a sensação é absolutamente
    nula pela mesma razão, o Espírito, que não tem corpo material, não pode sentir
    os sofrimentos resultantes da matéria, onde é preciso concluir que, se Jesus sofreu
    materialmente, como não se duvidar, é porque tinha corpo material de natureza
    semelhante ao de qualquer pessoa".


    66 - Aos fatos materiais juntamos considerações morais poderos.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    65


    "Se Jesus estivesse, durante a sua vida, nas condições dos seres fluídicos, não
    teria sentido dor, nem nenhuma das necessidades corporais. Supor que assim foi
    é tirarlhe todo o mérito da vida de privações e sofrimentos que escolheu para
    exemplo. Se tudo nele só era aparência, todos os atos de sua vida, o anúncio reiterado
    de sua morte, a cena dolorosa do jardim das Oliveiras, a súplica a Deus para afastar
    de seus lábios o cálice, a sua paixão, a agonia, até seu último grito no momento
    de entregar o Espírito, não teria passado de um vão simulacro para enganar quanto
    à sua natureza e fazer crer no sacrifício ilusório de uma vida, uma simples comédia
    indigna de qualquer homem de bem, com maior razão de um ser tão superior; em uma
    palavra, ele teria abusado da boa fé dos seus contemporâneos e da posteridade.
    Tais são as conseqüências lógicas desse sistema, conseqüências que não são admissíveis,
    porque isso seria rebaix-lo moralmente, em vez de elevá-lo".


