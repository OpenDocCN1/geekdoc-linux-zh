    **REENCARNAÇÃO E ESCALA DOS MUNDOS**


    A encarnação é necessária? perguntou-me um neo-roustainguista em


    França, após uma palestra doutrinária. Se não é – respondi – porque estamos encarnados?
    O confrade, que atravessava a fase de deslumbramento provocada pela "nova revelação”
    quis demonstrar-me que, segundo Roustaing, há espíritos que nunca se encarnaram
    e não têm necessidade da vida corpórea. A tese se encontra no cap. 14 do Tomo
    IV, referente ao cap. 4.0 do Evangelho de João. Os


    "ministros de Deus" estudam nesse tópico a evolução da essência espiritual e repetem
    mais uma vez, de maneira necessariamente mais confusa, o ensino dos Espíritos
    a Kardec:


    18 Mateus; 24:27, Lucas; 18:31 e Hebreus; 2:6.


    O Verbo e a Carne – 2 Análises do Roustainguismo ______________________________________________


    20


    **"Como não ignorais, a essência espiritual, para ir do seu ponto de** **origem
    ao período preparatório do estado espiritual de inteligência** **independente,
    livre responsável, revestida de razão e livre arbítrio, tem** **que passar, conforme
    vos explicamos tratando da origem do espírito,** **pelas fases sucessivas e progressivas
    da materialização nos reinos** **mineral e vegetal e da encarnação no reino animal.
    Tem que passar** **depois por aquele período preparatório. Transposto esse período
    e uma** **vez de posse do livre arbítrio, ela se acha na condição de Espírito**
