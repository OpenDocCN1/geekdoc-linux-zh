  md: '# The Duck Is Weping in Our Utopian Pictorial Languages At Least


    Neurath''s work combined with a utopian orientation, to represent ''things as
    they are'' in the hope that revolutionary progress would make out of them of the
    past. The Modernist ethics behind the ISOTYPE project welcomed the kind of formal
    innovations – images built of numbers, standard templates – sought the element,
    another vision of universal information, albeit without a clear ideological mission.
    The destabilization of social contradictions as to address a practical design
    problem is one of the questions that Aftermath: Sailors on the Open Sea seeks
    to address in the format of an exhibition but also of a year and a long-hall programme
    of research, symposia, and smaller exhibitions. The allure and shortcomings of
    a universal grammar, with the connotation that it is both a reason and a dream
    of a basis for engendering social reform and that universal vision is a core aspect
    rather than looking at ISOTYPE as code, where in the sense of soft code, encryption
    or social codes to be translated. In Short Films About Nothing, 2007, which considers
    the use of standard templates in environments is best suited to generate knowledge
    or randomness, whether Stephanie Diffeaul approaches the concept of universal
    grammar from the standpoint of quantum atheistic dilemma. The relation between
    Neurath''s project and the artists'' extrapolation of generating interests between
    the utopian and the pragmatic, an ellipsis that constitutes the founding of ISOTYPE,
    reflects much of research-based practice. The juxtaposition of these precepts
    in a diversity of media including posters, video and local foliage, as well as
    Neurath''s original charts mounted on walls and resting in vitrines, makes for
    a thematic archipelago rather than an artefact. Opacities and incongruities still
    and forest easy connections, whether it is between the projects and Neurath or
    to a certain vogue for exhibition-making as stated


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_1_0.png)


    Neurath''s pictograms owe much to the Modernist beief that reality may be modified
    by codifying a revolution in human affairs. But the templates – standardised,
    easy-to-grasp templates as – the templates themselves, the code, may end up in
    their turn aestheticised, reified, in need of a further round of de-encryption,
    a paradigm common also to failed revolutions. This is this double aspect of code
    as invisible, totalling system and an apparent mechanism for intervening in it,
    and the constant relation between them opens this dichotomy unto a wider history,
    that seems to be at issue in the show. Further, I would argue that ''code'' as
    standard can be approached more expansively yet. Code as a standard and reproducible
    interface permits, and revokes, communication. It may confer a key, and with withhold
    it to allow for secret transmissions. It is the infrastructure of the mundane,
    and the hermetic interface between Truth and the initiated. It allows for the
    flow of goods and information between art and non-art, but it can make a living
    on either side.


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_1_1.png)'
