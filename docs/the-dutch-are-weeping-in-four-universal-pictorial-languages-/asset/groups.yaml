    ''Tempo House'' and has often come

    mind during my time in the Netherlands.


    [2] Viktor Shlovkovsky, *Third Factory*, Dalkey Archive Press, 1977, p53.


    [3] In *The Politics of Aesthetics*, Jacques Ranciere elaborates further, though
    not much further, on this innocious

    insight.


    [4] SETI@HOME project http://setihome.berkeley.edu/


    [5] Like instance ''social'' web-based media. Or even socially ameliorative art.
    It is traditionally the prerogative of

    forms of cultural activity most intimate to capital (venture capital and YouWeb,
    public art and developer-led

    urbanism) that strives to dissolve its meditations in an problematic address to
    the self-activity of individuals or

    communities. ''Traditionally'' may be a misnomer, since the relative novelty of
    these forms may go some ways towards

    explaining their naivete. Traditionally art fetishes the meditations of its relationship
    to the market, not disavows it.


