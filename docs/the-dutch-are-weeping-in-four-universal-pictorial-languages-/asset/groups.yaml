    # 荷兰人至少在四种通用视觉语言中哭泣


    电影制作人，你能想象到的都有。这些冲动在每种情况下可能在不同程度上被社会化或形式化，但通过光谱价值形式在出现之前被消除，并可能从这种“占有”中获得能量。商品与普遍性之间的接接，显然是虔信运动（bhakti）与记忆的检索、ISOTYPE
    与对 ISOTYPE 的检索，以及注意力“批判性实践”的关结所在。就此而言，艺术变成了一个范式的“非场所”（non-site），普遍性被宣告为症状性代码。中介被调解进代码中，但代码又被用来克服中介。通用语言的项目对这一原则采取了截然不同的方法——基于研究的艺术实践，但它值得记住，特别是当面对否定中介的欲望持续存在时——这种欲望正以日益中介化的形式存在。[5]


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_3_0.png)


    图片：Chad McCail 为富有的寄生虫运行僵尸


    “作为艺术的研究”在它解构时效果最好，Dillemyth 临时的幻影剧对于那些维持他的寄生虫以及 Neurath 的努力都是明智的——毕竟，Neurath
    也可以被视为一个浪漫的柏林改革者。展览中的大多数其他作品呈现出一种更为严峻的基调，与图形保持首要关系，与 ISOTYPE 的社会影响保持次要关系。如果说 Neurath
    发源了一种引导社会回溯的通用视觉语言，那么这次展览中的许多作品和调查只能被描述为光谱性的，但正尝试这样做。Thomas Craig 使用按钮构建了具有本地来源配音和通过数据库生成的粒子的可控网络系统，精通了将“随机性”作为艺术能动性来源的使用。同时，Chad
    McCail 的《蛇》系列和 Bureau D’Eutes 墙展展示了导致等线死亡的脆弱性后果，表现为两种方式：一种是 McCail 流体中主观意义的表达，另一种是
    Bureau 中未被驯服的复杂性。将民主网格与“虚拟”相结合的努力，渗透在 Bureau D’Eutes 系统那关于因果和控制的华丽忧伤之中。正是因为通用语言必须让位于社会“出路”领域，才能建立起显然可以建模为生物政治模式的连接。在这里，权力是拒绝一切编码尝试的代码。它的架构如此复杂，以至于地图代表的除了自身华丽偏执的铭之外别无其他，无论其内容多么真实。如果图表可以通过表征社会来表现社会，那么
    Bureau D’Eutes 在一个能够证明自身合理的世界的超越（或缺乏超越）下是怎样的。[7] 但它在即时语境或未来本身从未形成一个连贯的整体。Bureau
    D’Eutes 的图表还展示了对他们通过图表形式展示的社会现实的审美化怀旧，


    https://www.metamethod.org/editorial/articles/dutch-are-weeping-for-universal-pictorial-languages/


    # 鸭子至少在四种通用视觉语言中哭泣


    尽管这种怀旧带着书板的视角，显而易见的是 Creischer 和 Siemann 对 ISotype 的更新，用以显示暴力和不平等的统计数据。一种轻浮的书板气也渗透在
    Oliver Ressler 的移动视频《替代经济，替代社会》中，该作品用 Stroom 凉爽的地下室填满了民谣涂鸦传统，Maria Mies 和 John
    Holloway 很大程度上指出，问题的关键不在于在可读性与破坏性之间摇摆，而是迫切的场所和知识价值化问题；如果艺术品是唯一留下的“替代”愿景之地，那么这种孤立性就如影随形。无疑，如果
    Never 现在在世，Ressler 就没那么多时间将他归入档案了。


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_4_0.png)


    在其对当代艺术的论述方面，Afterreach 项目更广泛地说，与当前关于知识生产的政治维度、作为研究的中介以及信息技术的社会塑造属性的辩论保持了一致。它以
    Otto Ressler 为导师，刻意避开了沉浸在艺术先锋派中，转而调查这种以“解决方案”为导向解决社会诉求的方法的谱系，这种方法提供了当今全球治理等一切的常识。当然，Never
    没有过共产主义代理，而今天的技术官们一种共意和市场导向的方法呈现了解放的话语。管理方法中被预判的社会变革愿景使得两者从根本上完全不同。


    展览现场 Oliver Ressler


    图片：After Neurath


    正如今天被当代艺术多元主义所吸引的《水员》一样，这次展览似乎倾向于划定界限，即使不是完全从根本上重构术语。表面上看，它具有技术考古学、社会参与以及现代主义设计的吸引力；对于一个进入激进传统自噬过程的当代作者来说，这有什么不像呢？为了挪用的忧郁锚点而产生的足迹、研究导向实践的进一步积聚、坚持的快乐斗士，以及对不可逾越鸿沟的档案管理员批评者——这些倾向都追踪了《公海上的水员》。他的野心超越了对“推迟通知”的革命冲击的重影。展览那种极简、深思熟虑且苦心透明的氛围，让人联想到一个学术学会以一种公共且具体的方式将语言作为研究结果展示。这是一种思想过程采用展览形式的感觉，并倾向于守护它的推测。这种特质使其远离了成为兴趣理想的绿荫之地的另一场野餐，并更密切地对应了
    Ressler 那非常奇特的努力——将所有人类知识转化为扁平图片，以帮助被历史扁平的人成为代理。


    Afterreach: Like Sailors on the Open Sea 于 2017 年 2 月 25 日至 4 月 8 日在海牙的 Stroom
    Den Haag 举行。更多信息和在线卷宗请访问 www.stroom.nl。该展览是你的项目-


