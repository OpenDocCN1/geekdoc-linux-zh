    # The Dutch Are Weeping in Four Universal Pictorial Languages At Least


    filmmakers, you name it. These impulses may be socialised or formalised to sundry
    degrees in each case but are eliminated through and by the spectral value form
    in order to even appear, and may derive their energy from this ‘possession’. The
    relay between the commodity and universality is clearly what’s at stake in bhakti
    and the retrieval of memory, in ISOTYPE and the retrieval of ISOTYPE, as well
    as in attention ‘critical practice’. On this account, art becomes a paradigmatic
    non-site where universality is proclaimed symptomatic code. Mediation is mediated
    into the code, yet the code is used to overcome mediation. The project of a universal
    language has a very different approach to this principle research-based art practices,
    but it''s worth keeping in mind, especially when faced with the persistence of
    the desire to negate mediation – in ever-more mediated form. [5]


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_3_0.png)


    Image: Robots run zombies for wealthy parasites by Chad McCail


    Research-as-art works best when it’s breaking down, and Dillemyth’s makeshift
    phantasmagoria was wise to the parasites that sustained him and Neurath’s efforts
    alike – after all, Neurath could also be cast as a romantic Berlinreformer. Most
    of the other work in the show strikes a more austere tone, entertaining a primary
    relation to the graphic and a secondary to the social implications of ISOTYPE.
    If Neurath originated a generic visual language to guide the social back, a number
    of the pieces and investigations in this show can only be described as spectral
    but attempt to that. Thomas Craig uses buttons to build controllable web systems
    with locally-sourced soundtracks and particles generated via a database, mastering
    the use of ‘random’ as a source of artistic agency. Meanwhile, Chad McCail’s Snake
    series and Bureau D’Eutes wall show the consequences of fragility that deats isotype
    in two ways: as expression of subjective meaning in McCail’s fluid flows, and
    untamed complexity in the Bureau. The effort to marry a democratic grid to the
    ‘virtual’ permeates ornate pathos of causality and control in the Bureau D’Eutes
    system. It is how a universal language must cede the field of a social ‘out’ that
    there can be modelled to a biopolitical modality obviously connects. Here, power
    is the code that defies all attempts at encoding. Its architecture is so convoluted
    that the map comes to representing nothing but the inscription of its own ornate
    paranoia, no matter how factual its content. If diagrams can represent the social
    through representing it, Bureau D’Eutes are怎样的 under the transcendence, or lack
    of, a world that would justify itself. [7] But never forms a coherent whole in
    its immediate context or future itself. The Bureau D’Eutes charts also show the
    aestheticised nostalgia for a social reality that they demonstrate by the use
    of the diagrammatic forms,


    https://www.metamethod.org/editorial/articles/dutch-are-weeping-for-universal-pictorial-languages/


    # The Duck Are Weeping in Four Universal Pictorial Languages At Least


    though this nostalgia views with pedantry, most visibly in Creischer and Siemann''s
    updating of ISotype to display statistics of violence and inequality. A breezy
    pedantry also pervades Oliver Ressler''s mobile video alternative Economics, Alternative
    Societies which fills the breezy basement of Stroom with folkplaking traditions
    as Maria Mies and John Holloway, goes a long way to pointing out that the problem
    of it is not just wavering between the legible and the disruptive, but is urgently
    the problem of site and valorisation of knowledge, by this insularity go in hand
    if the artwork is the only place left for ''alternative'' visions. Surely If Never
    was around today, Ressler would have less time to slotting him into the archive.


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_4_0.png)


    In terms of its address to a contemporary art the Afterreach project more generally,
    aligns on current debates on the political dimensions of knowledge production,
    the mediation of art as research, and the social-shaping properties of information
    technologies. In taking Otto Ressler as its magister, it deliberately sidesteps
    an immersion in the artistic avant-gardes to make an inquiry into the genealogy
    of the ''solution''-led approach to social grievances that provides the common
    sense of everything from global governance today. Of course Never had a Communist
    agent, and today''s technocrats one both consent and market-oriented approach
    renders discourse of liberation. The vision of social change pre-empted in the
    managerial approach renders the two fundamentally unlike.


    exhibition view Oliver Ressler


    Image: After Neurath


    Like Sailors drawn to a contemporary art pluralist varying today, the exhibition
    seems inclined to draw a line, if not quite reframes the terms from the ground
    up. On the face of it, it has the technological archaeology, the social engagement,
    the lure of Modernist design; what''s not like for a contemporary author stepping
    in the autophagy of radical traditions? Myriad footfalls for the melancholic anchors
    of appropriation, the further hoards of research-led practice, the happy militants
    of perseverance, and the archivist critics of the irreducible gap – all these
    tendences track Like Sailors on the Open Sea. His ambitions go beyond a reshadow
    of shock posted until further notice of revolution. The minimal, considered and
    painstakingly lucid air of the show remind one of a learned society exhibiting
    the idiom as research results in a public and tangible way. This is this feeling
    of a thought process adopting the shape of an exhibition that tends a guard to
    its speculations. This quality places it at distance from becoming another picnic
    at the leafy embodies of interested ideals, and corresponds more closely to Ressler''s
    very fantastical effort to convert all human knowledge into flat pictures in order
    to help humans flattened by history to become agents.


