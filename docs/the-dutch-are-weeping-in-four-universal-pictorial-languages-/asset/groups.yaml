    # 静音


    文章


    # 尘埃至少在四种通用图形语言中哭泣


    作者：Marina Visham，2007年5月


    近期的研究项目和展览“内特之后”（After Neurath）重新回顾了奥托·诺拉特（Otto Neurath）的作品。他是维也纳学派的全才，曾试图通过将知识图形化来解决社会变化的谜题。Marina
    Visham 从当前辩论的角度，探讨了诺拉特试图在艺术与非艺术之间架桥的尝试，并对展览作为研究的任何乐观预期设定了唯物主义的界限 [1]。


    ## 编码圆圈


    奥托·诺拉特体现了20世纪上半叶泛左倾的认识论中普遍的激进社会主义与理性主义乐观的结合，他是一位奥地利政治经济学家、科学哲学家和平面设计师。作为维也纳学派的一员，他致力于一种经验主义的社会变革愿景，这种愿景取决于工人阶级全面理解他们的物质条件以及跨越语言或数字划分的权力分布。凭借着“语言分裂，图像统一”的口号，诺拉特及其合作者格德·阿尔茨特（Gerd
    Arzt）和玛丽·里德迈斯特（Marie Reidmeister）创造了 ISOTYPE（国际平面图形教育系统），这是建筑史上的一个早期案例，它几乎完全取代了文字或数字描述，转而采用象形。通过使用此类信息图或公共标志来传达统计数据，ISOTYPE
    被认为是大众教育的理想工具，范围涵盖从世界地图到维也纳狭小的社会与经济博物馆中展示的结核病死亡率和军事去军事化内容。在二战前欧洲飞速政治化的气候下，诺拉特试图通过充满权威色彩的视觉实现来实现激进化，他的职业生涯经历了从1919年红慕尼黑崩溃、到纳粹清洗和占领荷兰的逃亡轨迹。他在1945年作为敌对外国人短暂监禁后，在牛津宁静的环境中结束了生。


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_0_0.png)

    展览海报


    尽管逻辑实证主义的陈述仍然是维特根斯坦所说的“世界是一切存在”，但维也纳学派并不局限于从中推导出的内容。


    https://www.metamu.org/editorial/articles/dutch-are-weeping-four-universal-pictorial-languages-least


    图片：内特之后


    # 尘埃至少在我们的乌托邦图形语言中哭泣


    诺拉特的工作结合了乌托邦导向，旨在表现“事物的本来面”，希望革命性的进步将它们变成过去。ISOTYPE 项目背后的现代主义伦理欢迎这种形式创新——由数字构建的图像、标准模板——寻求这种元素，即另一种通用信息的愿景，尽管缺乏清晰的意识形态使命。为了解决实际设计问题而消除社会矛盾的不稳定性，是《内特之后：公海水手》（Aftermath:
    Sailors on the Open Sea）试图解决的问题之一，它不仅以展览的形式呈现，还作为一个一年的研究、研讨会和小型展览计划。通用语法的吸引力和缺陷在于，它的内涵既是产生社会改革基础的理由也是梦想，且这种通用愿景是一个核心方面，而不是将
    ISOTYPE 视为代码（即软代码、加密或待翻译的社会代码）。在2007年的《无事的短片》（Short Films About Nothing）中，考虑了在最适合生成知识或随机性的环境中使用标准模板，无论
    Stephanie Diffeaul 是否从量子无神论困境的观点接近通用语法的概念。诺拉特项目与艺术家在乌托邦与实用主义之间产生兴趣推演之间的关系（这种构成了
    ISOTYPE 基础的省略号），反映了许多基于研究的实践。这些准则在海报、视频和当地植被在内的多种媒体中并列，以及诺拉特挂在墙上和放置在陈展柜中的原始图表，构成了一个主题性的群岛，而非一件器物。不透明性和不不协调仍然掩盖了显而易见的联系，无论是项目与诺拉特之间的联系，还是如文所述对某种展览制作的时尚。


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_1_0.png)


    诺拉特的象形图很大程度上归于现代主义信念，即现实可以通过对人类事务进行编码来改变。但模板——标准化的、易于理解的模板——模板本身，即代码，可能会被审美化、物化，需要新一轮的解密，这是失败革命中常见的范式。这就是代码作为不可见的、全系统和干预其中的显性机制的双重侧面，而它们之间持续的关系将这种二元法开放到了更广泛的历史中，这似乎是展览关注的问题。此外，我认为作为标准的“代码”可以被更广泛地对待。作为标准和可复制的接口，代码允许并撤销通信。它可能授予一把钥匙，也通过保留它来允许秘密传输。它是平庸的基础设施，是真理与启蒙者之间的封闭接口。它允许艺术与非艺术之间货物和信息的流动，但它可以在任何一方获利。


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_1_1.png)


    # 尘埃至少在四种通用图形语言中哭泣


    奥托·诺拉特的 ISOTYPE


    ## 边缘的注入


    艺术从“非审美集合、外源性的勇敢前沿”中获得了什么？1926年，维克多·舒克洛夫斯写道：“它与艺术有关，但这种联系不是因果的……为了生存，艺术必须利用视频信号运作或制造新的原材料”。[2]
    当前的艺术评论使得这种兼并或内化成为塑造的反射动作，一种召唤总是迟到的幽灵的姿态：政治的、社会的、“真实的”，当历史当下似乎没有新事物时（这一概念本身就是后现代主义的埋葬），但它完全不适合回到具有塑性的虚构性现实，现实总是被视为道德的内在。


    值得关注的不是流离理想的灵质，而是价值的特定形式，在其合法化机制、比例模式和联盟中。在所有艺术都脱离市场（例如，荷兰的普通大众，沉浸在“创意”助学金中），这种价值形式是通过研究实施的。知识的分布是背景也是内容，通过深入诺拉特进步性博览的繁忙活动，《内特之后》反思了它的生产条件，并必然地掩盖了他。这就是代码材料的相似之处。如果代码被理解为艺术的用途（正如本项目所示），它可能会包裹艺术本身的不稳定性，在教化的（反射性的）和倾斜的（破坏性的）的阴暗焦虑下进行持续生产，这些指向其政治教化[3]，即作为新感官、划分模式和生活形式实验室的艺术，与形式法律的顽固之间的分裂，这种分裂将在一个“将到来”的社会中被消除。


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_2_0.png)

    图片：内特之后


    '
