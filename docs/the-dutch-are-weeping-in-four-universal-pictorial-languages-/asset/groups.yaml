    # 荷兰人至少在四种通用视觉语言中哭泣


    由 Steve Ruston 为 Stroom 组织的长期研究项目“Neurath 之后”（After Neurath），持续到 2007 年 10 月

    包含若干活动，包括进一步的展览和谈话计划。


    [1] 文章标题改编自 1983 年 Fall 的歌曲《Tempo House》中的诗句，在荷兰期间经常浮现在脑海。


    [2] Viktor Shlovkovsky, *Third Factory*, Dalkey Archive Press, 1977, p53.


    [3] 在《美学的政治》中，Jacques Rancière 对这种无害的见解进行了进一步阐述，尽管并不深。


    [4] SETI@HOME 项目 http://setihome.berkeley.edu/


    [5] 例如“社交”网络媒体。甚至是社会改善性艺术。传统上，与资本最密切的文化活动形式（风险资本和 YouWeb，公共艺术和开发者主导的城市化）特权，试图通过对个人或社区主体性的问题的应对来消除其沉思。“传统上”可能是一个误词，因为这些形式的相对新颖可能在某种程度上解释了天真。传统艺术痴迷于与其市场关系的沉思，而非否定它。


    [6] 引用处自 Giorgio Agamben 《例外状态》，Kevin Attell 译，University of Chicago Press, 2005，但追溯到
    Walter Benjamin 的《德国悲剧剧的起源》。


    Marina Vishmit <marinar AT artserve.net> 正在研究当代艺术中劳动、时间和对立作为生产的形式。她目前居住在低地国家。


