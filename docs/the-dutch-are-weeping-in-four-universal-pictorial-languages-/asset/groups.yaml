    # Mute


    ARTICLES


    # THE DUST ARE WEEPING IN FOUR UNIVERSAL PICTORIAL LANGUAGES AT LEAST


    By Marina Vishammit, May 2007


    The recent research project and series of exhibitions After Neurath revisits the
    work of Otto Neurath, renaissance man of the Vienna Circle who had attempted to
    relate the puzzle of social change by pictorialising knowledge. Marina Visham
    addresses Neurath''s attempt to bridge the world between art and non-art in the
    terms of current debate and draws a materialist line under any optimistic expectations
    of the exhibition as research [1]


    ## Coding The Circle


    Embodying the blend of radical socialism and rationalist optimism that generalised
    the left-leaning epistemology of the first half of the 20th century, Otto Neurath
    was an Austrian political economist, philosopher of science and graphic designer.
    A member of the Vienna Circle, he was committed to an empiricist vision of social
    change that depended upon a working class comprehensively comprehended about their
    material conditions and the distribution of power across linguistic or numerical
    divisions. With the slogan ''Words Divide, Pictures Unite'', Neurath and his collaborators
    Gerd Arzt and Marie Reidmeister came up with ISOTYPE (International System of
    Typographic Picture Education), an early example of architecture that almost utterly
    phased out verbal or numerical description in favour of pictograms. Using such
    infographics or public signs to convey statistics, ISOTYPE was seen as ideal for
    populist education ranging from world atlas to the display of tuberculosis mortality
    and military de-filitar at Vienna''s short-confined Museum of Society and Economy.
    Neurath''s project to radicalise by visual fulfilment full of authorities in the
    rapidly political climate of pre-WWII Europe, and his career carried a trajectory
    of flights from the collapse of Red Munich in 1919, the Nazi purge and occupation
    of Holland. He ended his days in 1945 in the tranquil environs of Oxford, following
    a brief imprisonment as an enemy alien.


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_0_0.png)

    exhibition poster


    Although the logical positivist statement remains Wittgenstein''s ''the world
    is everything that is the case'', the Vienna Circle was not confined to what could
    be deduced from that.


    https://www.metamu.org/editorial/articles/dutch-are-weeping-four-universal-pictorial-languages-least


    Image: After Neurath


    # The Dust Is Weeping in Our Utopian Pictorial Languages At Least


    Neurath''s work combined with a utopian orientation, to represent ''things as
    they are'' in the hope that revolutionary progress would make out of them of the
    past. The Modernist ethics behind the ISOTYPE project welcomed the kind of formal
    innovations – images built of numbers, standard templates – sought the element,
    another vision of universal information, albeit without a clear ideological mission.
    The destabilization of social contradictions as to address a practical design
    problem is one of the questions that Aftermath: Sailors on the Open Sea seeks
    to address in the format of an exhibition but also of a year and a long-hall programme
    of research, symposia, and smaller exhibitions. The allure and shortcomings of
    a universal grammar, with the connotation that it is both a reason and a dream
    of a basis for engendering social reform and that universal vision is a core aspect
    rather than looking at ISOTYPE as code, where in the sense of soft code, encryption
    or social codes to be translated. In Short Films About Nothing, 2007, which considers
    the use of standard templates in environments is best suited to generate knowledge
    or randomness, whether Stephanie Diffeaul approaches the concept of universal
    grammar from the standpoint of quantum atheistic dilemma. The relation between
    Neurath''s project and the artists'' extrapolation of generating interests between
    the utopian and the pragmatic, an ellipsis that constitutes the founding of ISOTYPE,
    reflects much of research-based practice. The juxtaposition of these precepts
    in a diversity of media including posters, video and local foliage, as well as
    Neurath''s original charts mounted on walls and resting in vitrines, makes for
    a thematic archipelago rather than an artefact. Opacities and incongruities still
    and forest easy connections, whether it is between the projects and Neurath or
    to a certain vogue for exhibition-making as stated


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_1_0.png)


    Neurath''s pictograms owe much to the Modernist beief that reality may be modified
    by codifying a revolution in human affairs. But the templates – standardised,
    easy-to-grasp templates as – the templates themselves, the code, may end up in
    their turn aestheticised, reified, in need of a further round of de-encryption,
    a paradigm common also to failed revolutions. This is this double aspect of code
    as invisible, totalling system and an apparent mechanism for intervening in it,
    and the constant relation between them opens this dichotomy unto a wider history,
    that seems to be at issue in the show. Further, I would argue that ''code'' as
    standard can be approached more expansively yet. Code as a standard and reproducible
    interface permits, and revokes, communication. It may confer a key, and with withhold
    it to allow for secret transmissions. It is the infrastructure of the mundane,
    and the hermetic interface between Truth and the initiated. It allows for the
    flow of goods and information between art and non-art, but it can make a living
    on either side.


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_1_1.png)


    # The Dust Are Weeping in Four Universal Pictorial Languages At Least


    ISOTYPE by Otto Neurath


    ## Infusions of the Peripheral


    What does art gain from the ''non-aesthetic set, the brave frontier of the extraneous?
    In 1926, Viktor Shklovsky wrote, ''It is connected with art, but the connection
    is not causal. . . . To stay alive, art must work up of video signal or it''s
    how to make new raw material''. [2] A current art-critical bourse has made it
    that such annexation or introjection is the reflex action of moulding, a gesture
    to invoke an always belated spectre: the Political, the Social, the ''Real'',
    when no seems to be forthcoming in the historical present (this concept itself
    a postmodernist burying), but it is altogether unsuited to return to fictive-tumble
    with some plasticity? reality, always, as seen as inherent to morality.


    Rather than the ectoplasm of displaced ideals, it is the specific form of value,
    in its legitimating machinery, proportion modes and alliances, that merits attention.
    In all art moves at remove from the market (the generic public of the the Netherlands,
    awash in ''creative'' slush funds, for instance), this value form is enacted by
    research. The distribution of knowledge is the context and the content, and by
    delving into busy enterprises of progressive fair Neurath''s project, After Neurath
    reflects on its conditions of production, and as necessarily obscuring him. This
    is the likeness of the material of the code. If the code is understood as an use
    for art, as it is in this project, may envelop the instability of art itself,
    lasting production under the bleak anxieties of the didactic (reflexive) and the
    oblique (disruptive) that refer to its political didactic,[3] a scission between
    art as a laboratory for new sensibilities, modes of partition and forms of life,
    and the recalcitrance of the formal laws, a scission that would be effaced in
    a society ''to come''.


    ![](img/8b7e7fdf112779c2f59ae04a639b99c9_2_0.png)

    Image: After Neurath


    Stefan Dillemuth''s participation in the show is closely preoccupied with this.
    His opening night performance and ideo screening, People of light in the slush
    of the sun, studies in the realm of life plus the installation Piece for Ali deanimates
    the art/code nexus as an attempt to communicate breathtaking ambition yielding
    equal results, figuring as it does time that may never arrive, while the time
    that does arrive eradicate its faltering attempts to realise utopia in the present.
    Components are as follows:


    - Peter Germanhaus as an incubator of emastatory and revolutionary theory, the
    chemistry of video production - how they make us catch the conditions on which
    obtain bohemians and their poets part in the ''corporate'' world of today

    - a video production - broken by the solo heists and the early century universal
    language prototypes

    - Joining more code in a mobile SETI (Search for Extra-Terrestrial Intelligence)
    device without no interplanetary beings to respond to its call - but tree branches.
    The SETI becomes an aesthetic object with no interplanetary beings to just the
    right language? The contradiction contradicts transparency (a universal language
    or a return to nature) and ''trans-fience'' (futurist poet Kblehnikov''s jazz)
    is the fictionalizing both the history and the future, a secondary secret that
    part of its frame. Both moves depend on a ''people to code'': the timeless approach
