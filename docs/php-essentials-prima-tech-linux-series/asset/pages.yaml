    Like the shell of the same name, the chmod(), chgrp(), and chown()

    functions will modify the permissions, group, and owner of a directory or file.

    the syntax of these functions is


    chmod("filename", mode);

    chgrp("filename", newgroup);

    chown("filename", newcomer);


