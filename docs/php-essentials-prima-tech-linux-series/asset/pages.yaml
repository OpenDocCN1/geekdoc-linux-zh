  md: "# Chapter 7: Advanced PHP Techniques: Web-Based Database Administration\n\n\
    The final step in the modification sequence is to update the fields in the table\
    \ with their new values and return a confirmation to the user. This script, called\
    \ admin_modrecord3.php called the form action in the previous script, is nearly\
    \ identical to admin_addrecord2.php script earlier in this section. Copy admin_addrecord2.php\
    \ to admin_modrecord3.php and open it in your text editor. I'll explain the main\
    \ changes, and you'll be on your way to the next section.\n\nThe first modification\
    \ is part of the if statement that checks required fields. The redirection that\
    \ occurs if a required value is not present should not look something like this:\n\
    \n```\nif (($isbn) || (!$title) || ($price)) {\n    header(\"Location: http://www.yourcompany.com/admin_modrecord1.php\"\
    );\n    exit;\n}\n```\n\nThe next difference is in the SQL statement. The Add\
    \ Product uses the INSERT command. If we used the INSERT command in the modification\
    \ sequence, a second record would be created with the new information. This isn't\
    \ what we want. We want the original record to be updated with the new information.\
    \ Use the UPDATE command, and set the fields to the new values:\n\n```\n$sql =\
    \ \"UPDATE MASTER_PRODUCTS SET ISBN = \\$isbn, TITLE = \\$title, AUTHOR = \\$author,\
    \ PUBLISHER = \\$publisher, CATEGORY = \\$category, TYPE = \\$type, INFO_BLURB\
    \ = \\$info_blurb, PAGE_NUM = \\$page_num, PRICE = \\$price WHERE ISBN = \\$isbn\"\
    ;\n```\n\n> One or more of the columns has an attribute of unique, you could use\
    \ the REPLACE command, which will INSERT a record in a place with a matching unique\
    \ field.\n\n![](img/f8bb5053a1d20d75df488da4d4dbfceb_225_0.png)\n\nThe next change\
    \ occurs in the error statement when checking for a value of $sql_result. A meaningful\
    \ error in this instance would be\n\n```\nif (!$sql_result) {\n    echo \"<P>Couldn't\
    \ update record!\"\";\n} else {\n    continue;\n}\n```\n\nThe final differences\
    \ are purely cosmetic. You'll want the page's title and heading to reflect your\
    \ actions:"
