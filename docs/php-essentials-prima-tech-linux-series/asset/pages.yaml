  md: '# Chapter 2: Basic PHP Techniques


    Variables passed from a form to a PHP script are placed in the global associative
    array $_HTTP_POST_VAR or $_GET_VAR (depending on the form method) and are automatically
    made available to the script.


    > Enabling variable tracking, or placing variables in global arrays, is an option
    configured when the PHP engine is installed on the server. If you are unsure whether
    variable tracking is turned on, you can add the line <?php_track_vars;?> to the
    beginning of your script.


    ![](img/f8bb5053a1d20d75df488da4d4dbfceb_65_0.png)


    For example, the following form has one input text field and therefore passes
    one variable to the goform.php script:


    Upon submission, the goform.php script receives a variable called $your_name,
    with a value of whatever the user typed in the form field. Variables are named
    according to the name attribute of the input field.


    Here are some examples:


    +   - The information typed in the following text field is placed in a variable
    called $phone_number:

