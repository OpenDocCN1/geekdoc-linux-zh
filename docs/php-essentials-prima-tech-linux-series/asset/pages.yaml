  md: '# Using GNPUG


    If you decide to use the open source GNPUG software, there are two parts to the
    puzzle: GNPUG on your Web server (to encrypt) and GNPUG on the recipient''s machine
    (to decrypt). The best place to start is http://www.gnupg.org/, where you can
    follow the links to download the proper version based on your operating system.


    The next sections assume that you have followed the installation and key-creation
    procedures outlined in the GNPUG documentation and have created a valid public
    key for the person who is to receive the encrypted data.


    # Adding a Public Key to the Key Ring


    After GNPUG has been installed on the server and on the recipient''s machine,
    and the necessary key pair for the recipient has been created, recipient''s public
    key must be added to the PHP user''s public key ring. If PHP runs as "www" on
    your Web server, that the user whose key ring must contain the recipient''s public
    key. The following steps add a public key to a user''s key ring:


    +   1. Export an ASCII version of a user''s public key, following the steps in
    the GNPUG documentation.

    2. Upload the public key text file to the PHP user''s directory on the server
    (/home/www/, for example).

    3. Log in to your Web server via telnet or SSH, or walk over to it and type at
    the keyboard if you are so lucky.

    4. Become the PHP user. This might involve the su command, as su www.

    5. Add the key to the key ring: `gpg --import /path/to/keyfile`

    6. Edit the key to assign a trust level: `gpg --edit-key [keyname]`

    7. At the gpg command prompt, type trust.


    You will see a confirmation that the key was added to your key ring. At this point,
    you can delete the text file containing the public key.


    +   8. Select I trust fully.


    If you''ve made it through these steps, you''re ready to encrypt data with GNPUG,
    using your PHP scripts to issue the commands. If you''re stuck on any of these
    steps, or if you don''t have access to the PHP user''s key ring, contact your
    system administrator.'
