    system("/path/to/gpg -encrypt -ao /path/to/temp/output/data -r ''Julie Meloni\njulie@thickbook.com''
    /path/to/temp/input/data");

    ```


    This command should output a file containing an encrypted message. Now, use

    t unlink() function to remove the original plain-text file:


    ```

    unlink("/path/to/temp/input/data");

    ```


    The next step is to place the contents of the output file in a variable, which
    will be

    used later to populate the e-mail message you''ll be sending to the target recipient.


    Assign the value of the encrypted data path to a variable called $encrypted:


    ```

    $encrypted = "/path/to/temp/output/data";

    ```


    Open the encrypted file for reading, and read the entire contents of the file
    to a

    variable called $mail_cont. Close the file when finished reading:


    ```

    $fd = fopen($encrypted, "r");

    $mail_cont = fread($fd, filesize($encrypted));

    close($fd);

    ```


    Remove the encrypted file from the system:


    ```

    unlink("$encrypted");

    ```


    Finally, create the remainder of the e-mail and send it to the target recipient:


    ```

    $recipient = "julie@thickbook.com";

    $subject = "Secret Message";


    $mailheaders = "From: My Web Site\n";

    $mailheaders .= "Reply-To: $sender_email\n\n";

    ```


    ```

    mail("$recipient", "$subject", $mail_cont, $mailheaders);

    ```


    After your mail is sent, return a confirmation to the user by adding a few echo

    statements. You can even include the sender''s name, since you have access to
    the

    variable $sender_name:


    ```

    echo "<H1 align=center>Thank You, $sender_name</h1>";

    echo "<p align=center>Your secret message has been sent.</p>";

    ```


