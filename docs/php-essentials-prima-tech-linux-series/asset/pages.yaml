  md: 'You must build the e-mail by concatenating strings to form one message string.

    "Concatenating" is a fancy word for "smash strings together." Use the newline
    (\n) and tab (\t) characters to add spacing where appropriate. Start building
    the message string called $msg:


    ```

    $php

    $msg = "Sender''s Full Name:\t$sender_name\n";

    ?>

    ```


    In this line, you want the e-mail to display a field label before the variable
    $sender_name so you know that $sender_name is. For all you know, $sender_name
    could be "Dog''s Name."


    Repeat the process, setting up field labels and for $sender_email, $like_site,
    and $message. In these lines, however, use the concatenation operator (=) instead
    of the assignment operator.


    ```

    $msg .= "Sender''s E-Mail:\t$sender_email\n";

    $msg .= "Did You Like the Site?\t$like_site\n";

    $msg .= "Additional Message:\t$message\n";

    // use two newline characters at the end of your content,

    // or to insert additional spacing

    ```


    Your message string ($msg) is now


    "Sender''s Full Name:\t$sender_nameIn''s E-Mail:\t$sender_email\nDid You Like
    the Site?\t$like_site\nAdditional Message:\t$message\n":


    The e-mail client will format this into a nice e-mail with line breaks and tabs
    between elements.


    Now create a variable called $mailheaders to force particular values in the From
    and Reply-To headers of your e-mail:


    ```

    $mailheaders = "From: My Web Site\n";

    $mailheaders .= "Reply-To: $sender_email\n\n"

    ```


    Create the function. In this case, I''ll use my own e-mail address:


    ```

    mail("julie@thickbook.com", "Feedback Form", $msg, $mailheaders);

    ```


    After your message is sent, you should return some sort of text to the browser
    so that the person doesn''t sit there, wondering if the message was sent or not.
    If a user doesn''t know if a message has been sent, chances are good that he or
    she will continue to click the Submit This Form button, thereby flooding your
    mailbox with the same feedback repeatedly.'
