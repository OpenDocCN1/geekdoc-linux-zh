  md: '# Chapter 7: Advanced PHP Techniques: Web-Based Database Administration


    he previous chapters were designed to give you a solid foundation for developing
    applications with PHP. Many dynamic, user-friendly, e-commerce Web sites are simply
    basic concepts put together to form one cohesive unit. For example, a successful
    shopping system needs a product catalog, a method for maintaining the contents,
    some sort of item order tracking, a method to order products securely, and a way
    to tell your boss how a wonderful job you''re doing. In the next two chapters,
    you''ll learn the basics of most of these tasks (except dealing with your boss).


    While the term "Web-Based Database Administration" might seem daunting, don''t
    be afraid—it''s just a fancy label for "data goes in, data comes out." The goal
    of this section is to create a product catalog for an online shopping system,
    which will be fully functional by the end of this chapter. By breaking down the
    elements piece by piece, before you know you''ve created a graphical user interface
    to a product catalog in a MySQL database. You can repeat the steps for any type
    of database-driven system you want to develop: news articles, address books, your
    mother''s recipe collection. If you''re not using the MySQL database, just substitute
    the functions for your particular database for the MySQL database functions. You
    can also find database-specific source code in the "Code" section at


    # Planning Your Product Catalog


    This sample shopping site will be called XYZ Company, and it will sell books.
    The first step in creating this sample shopping site is developing the product
    catalog. It''s up to you to determine if you want to create multiple tables to
    hold your product information or if you want to keep your product information
    in one big table. Because we''re creating only a simple example catalog, we''ll
    use one large table called MASTER_PRODUCTS.


    Let''s sell some books. Think about all the information you''ll need to know in
    order to give us an accurate description of a product:


    +   - ISBN (a standard publishing identification number)

    - Book title

    - Author''s name

    - Publisher

    - Category

    - Type (hardcover or paperback)

    - A paragraph of information about the book'
