    # count()


    count() function counts the number of elements in a variable. It''s usually used
    to count the number of elements in an array, because any variable that is not
    an array will have only one element—itself.


    In the following example, $a is assigned a value equal to the number of elements
    in the $colors array:


    ```

    $a = count($colors);

    ```


    If $colors contains the values "blue", "black", "red", and "green", $a will be
    assigned a value of 4.


    You can create a for loop that loop through an array and print its elements, using
    the result of the count() function as the second expression in the loop. For example:


    ```

    $colors = array("blue", "red", "green");

    for ($i = 0; $i < count($colors); $i++) {

    echo "The current color is $colors[$i].<br>";

    }

    ```


    produces this result:


    +   - The current color is blue.

    - The current color is black.

    - The current color is red.

    - The current color is green.'
