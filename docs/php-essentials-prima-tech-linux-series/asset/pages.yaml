    | 3 | Jane Smith | 1968-04-28 | black |

    | 4 | Jane Smith | 1975-11-05 | green |


    I hope this simple example conveys the importance of having a unique identifier
    for each record in your table.


    # What About Relationships?


    Relational databases get their name from the relationships that exist between
    the multiple tables contained in them. You could have a series of disconnected
    tables in a relational database, but where''s the fun in that?


    Relationships between tables occur because they have fields in common. Usually
    these common fields are the unique fields, or keys, which you learned about a
    moment.


    The simplest example of a relational database is a product catalog and ordering
    mechanism. One table has product information. A third table has order information.
    Instead of creating one large table for orders, containing all product and customer
    information, simply use unique identifiers in the orders table to reference products
    in the product table and customers in the customer table.


    For example, records in the MY_PRODUCTS table will have a unique PRODUCT_ID, a
    TITLE, a DESCRIPTION, and a PRICE:'
