    \ you can effectively delete a cookie by sending a cookie of the same name but\
    \ with a blank value.\n\nSay you've set a cookie such as:\n\n```\nsetcookie(\"\
    valid_user\",\"yes\",time()+14400,\"//\",\"yourdomain.com\",0);\n```\n\nThe name\
    \ of this cookie is valid_user, and the value is \"yes\". To delete this cookie,\
    \ have your script send an identical cookie to the user—identical except for the\
    \ value, which is now blank:\n\n```\nsetcookie(\"valid_user\",\"\",time()+14400,\"\
    //\",\"yourdomain.com\",0);\n```\n\nThis process effectively deletes the cookie\
    \ by assigning a null value to it. No more valid user!\n\n# PHP4 Session Handling\n\
