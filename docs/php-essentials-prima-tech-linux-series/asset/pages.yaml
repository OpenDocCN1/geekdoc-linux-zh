  md: "# Logical Operators\n\nLogical operators, like comparison operators, are often\
    \ found within if...else and while control statements. These operators allow your\
    \ script to determine the status of conditions and, in the context of your if...else\
    \ or while statements, execute certain code based on which conditions are true\
    \ and which are false.\n\nA common logical operator is ||, meaning OR. The following\
    \ example shows the evaluation of two variables and the result of the statement.\
    \ In this example, I really want to drink coffee. I have two options, $drink1\
    \ and $drink2. If either of my options is “coffee”, I will be happy. Otherwise,\
    \ I'll still need caffeine.\n\n```\n$drink1 = \"coffee\";\n$drink2 = \"milk\"\
    ;\nif ($drink1 == \"coffee\") || ($drink2 == \"coffee\") {\n    echo \"I'm happy\"\
    ;\n} else {\n    echo \"I still need caffeine\";\n}\n```\n\nIn this example, because\
    \ the value of the $drink1 variable is “coffee,” the logical OR comparison of\
    \ $drink1 and $drink2 is TRUE, and the script returns “I’m happy!”.\n\nOther logical\
    \ operators include AND (&&) and NOT (!).\n\n# Using PHP Variables: A Calculation\
    \ Script\n\nYou now have a fundamental knowledge of variables and operators—enough\
    \ to create a PHP script that does some sort of variable calculation and displays\
    \ results. To begin, open your favorite text editor, create a file named calc01.php,\
    \ and set up the HTML “shell” around your script:\n\n```\n<!DOCTYPE HTML PUBLIC\
    \ \"-//W3C//DTD HTML 3.2//EN\">\n<HTML>\n<HEAD>\n<TITLE>Calculate Values</TITLE>\n\
    </HEAD>\n<BODY>\n<?php\n// PHP code goes here.\n?>\n</BODY>\n</html>\n```"
