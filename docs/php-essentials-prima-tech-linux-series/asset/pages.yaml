    associated values are sent to the script specified as the form''s ACTION.


    # Commenting Your Code


    Commenting your code is a good habit to have. Entering comments in HTML documents
    helps you (and others who might have to editier your document later) keep track
    of areas of large documents. Commenting also allows you to write notes to yourself
    during the development process.


    HTML comments are ignored by the browser and are contained within <!-- --> tags.
    For example, the following comment reminds you that the code following contains
    its logo graphic:


    ```

    <!-- logo graphic goes here -->

    ```


    Similarly, PHP comments are ignored by the parsing engine. PHP comments are usually
    preceded by double slashes, like this:


    ```

    // this is a comment in PHP code

    ```


    Other types of commenting can be used in PHP files, such as:


    ```

    # This is shell-style comment

    ```


    and


    ```

    /* This begins a C-style comment that spans onto two lines */

    ```


    HTML and PHP comments are used extensively throughout this book to explain blocks
    of code. Get used to reading comments, and try to pick up the habit of using them.
    Writing clean, bug-free code with comments and white space will make you popular
    among your developer peers, because they won''t have to work hard to figure out
    what your code is trying to do.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Your First PHP Script


    In a PHP document, PHP code coexists with HTML, whether it is embedded within
    the HTML or the code itself determines the HTML output. When a Web browser requests
    a PHP document, the document first goes through the PHP engine, which executes
    the PHP code and prints the results in place of the PHP code. The Web server then
    sends this document, now consisting only of HTML, to the Web browser, which displays
    it to the user. This method of code execution is called server-side. Code executed
    by the browser, such as JavaScript, is called client-side.


    To combine PHP code with HTML, the PHP code must be escaped, or set apart, from
    the HTML. The following method is the default configuration of the PHP engine:


    ```

    <php

    // PHP code goes here.

    ?>

    ```


    The PHP engine will consider anything within the <?php opening tag and the ?>
    closing tag as PHP code. You can also escape your PHP code by using the <?? opening
    tag and the <?> closing tag, or by using the <SCRIPT Language=php> opening tag
    and the <SCRIPT> closing tag.


    Now it''s time to write your first script. Your first PHP script will display
    "Hello World! I''m using PHP!" in the browser window.


    First, open your favorite text editor and create a simple text file called first.php.
    In this text file, type the following code:


    ```

    <DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2//EN">

    <html>

    <HEAD>

    <TITLE>My First PHP Script</TITLE>

    </HEAD>

    <body>

    <?php

    echo "<P>Hello World! I''m using PHP!</P>\n";

    ?>

    </body>

    </html>

    ```


    Save this file and place it on your Web server. Now access it with your browser
    at its URL, http://www.yourserver.com/first.php.'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'In your browser window, you should see this:

    Hello World! I''m using PHP!


    If you use your browser to view the source of the document, you should see this:


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 3.2//EN">

    <HTML>

    <HEAD>

    <TITLE>My First PHP Script</TITLE>

    </HEAD>

    <body>

    <p>Hello World! I''m using PHP!</p>

    </body>

    </html>

    ```


    Take a look at the command issued in the PHP code. It contains three elements:
    the command (echo), the string ("<p>Hello World..."), and the instruction terminator
    (;).


    Familiarize yourself with echo, because it will likely be your most-used command.
    The echo() function is used to output information—in this case, print <p>Hello
    World! I''m using PHP!</p> in the HTML file.


    Within the string, the newline character ("\n") ensures that the echoed content
    won''t be printed all in one line in your HTML source file. Although the newline
    character makes no difference to the Web browser file, it is useful when you are
    viewing your source code.


    The instruction terminator, also known as the semicolon, is absolutely required.
    If you do not end your command with a semicolon, the PHP code will not be parsed
    properly by the PHP engine, and ugly errors will occur. For example, this code:


    ```

    <?php

    echo "<p>Hello World! I''m using PHP!</p>\n"

    echo "<p>This is another message.</p>";

    ?>

    ```


    produces this nasty error:

    Parse error: parse error, expecting "." or ":" in /home/devbox/dev-www/phptest/error.php
    on line 9


    Avoid this error at all costs: remember to terminate commands with a semicolon.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# All About Variables


    Very simply put, variables represent data. If you want your script to hold onto
    a specific piece of information, first create a variable and then assign a literal
    value to it using the equal sign (=).


    For example, the variable "username" holds the literal value "joe" when appearing
    in your script


    ```

    $username = "joe";

    ```


    Variable names begin with the dollar sign ($) and are followed by a concise, meaningful
    name. The variable name cannot begin with a numeric character, but it can contain
    numbers and the underscore character (). Additionally, variable names are case-sensitive,
    meaning that $YOURVAR are two different variables.


    Creating meaningful variable names is another step to lessening headaches coding.
    If your script deals with name and password values, don''t create a variable called
    $n for the name and $sp for the password—those are not meaningful variables. If
    you pick up your script weeks later, you might think that $n is the variable for
    "number" rather than "name" and that $sp stands for "page" rather than "password".


    This section describes several kinds of variables. Some variables change values
    as your script runs, and others are assigned values outside of your PHP script—such
    as HTML forms.


    # PHP Variables


    You will create two types of variables in your PHP code: scalar and arrays. Scalar
    variables contain only one value at a time, while arrays contain a list of values
    or another array (thus producing a multi-dimensional array). Within variables,
    their assigned values can be of different types, such as these:


    +   - Integers. Whole numbers (numbers without decimals). Examples are 1, 345,
    and 9922786. You can also use octal and hexadecimal notation: the octal "0123"
    is decimal 83 and the hexadecimal "0x12" is decimal 18.


    +   - Floating-point numbers "floats" or "doubles". Numbers with decimals. Examples
    are 1.5, 87.3446, and 0.8889992.


    +   - Strings. Text and/or numeric information, specified within double quotes
    ("") or single quotes (''\'').


    As you begin your PHP script, plan your variables and variable names carefully,
    and use comments in your code to remind you of the assignments you have made.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Operators


    Values are assigned to variables using different types of operators. A list of
    common operators and operator types follows. For a complete list, see the “Operators”
    section in Appendix A, “The PHP Language.”


    # Assignment Operators


    You''ve already seen an assignment operator at work: the equal sign (=) in username
    = “joe” is the basic assignment operator.


    > The single equal sign does not mean “equal to.” Instead, the single equal sign
    always means “is assigned to.” The double equal sign (==) means “equal to.” Commit
    this to memory to alleviate debugging headaches


    ![](img/f8bb5053a1d20d75df488da4d4dbfceb_58_0.png)


    Other assignment operators include +=, -=, and .=:


    ```

    $ex += 1; // Assigns the value of ($ex + 1) to $ex

    // If $ex = 2, then the value of ($ex += 1) is 3

    $ex -= 1; // Assigns the value of ($ex - 1) to $ex

    // If $ex = 2, then the value of ($ex -= 1) is 1

    $ex .= "coffee"; // Concatenates (adds to) a string. If $ex = "I like"

    // then the value of ($ex .= "coffee") is "I like coffee".

    ```


    # Arithmetic Operators


    Even if you''ve never written a line of code in your life, you already know most
    of the arithmetic operators—they’re basic math!


    +   + addition

    - subtraction

    * multiplication

    / division

    % modulus, or “remainder"


    In the following examples, $a = 5 and $b = 4.


    ```

    $c = $a + $b; // $c = 9

    $c = $a - $b; // $c = 1

    $c = $a * $b; // $c = 20

    $c = $a / $b; // $c = 1.25

    $c = $a % $b; // $c = 1

    ```'
