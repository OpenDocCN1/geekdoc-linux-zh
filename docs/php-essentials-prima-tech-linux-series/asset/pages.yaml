    values to the form, such as purple colors and strange fonts, to that you can make
    a dynamic, user-based Web site using sessions:


    # A Word of Advice


    Although the built-in session support of PHP4 provide greater flexibility and
    security than storing every session variable in a cookie, there are a few places
    for improvement. As PHP4 matures, session management functions will mature as
    well.


    There''s also the cookie aspect of session management: what if a user doesn''t
    accept your PHPESSID cookie? How will PHP know which session file to use if it
    can''t extract a session ID from a cookie? In this case, it becomes your responsibility
    to send the value of PHPESSID via the GET method.


    For example, the session2.php file contains this line:


    <P>Please feel free to <a href="session1.php">change your preferences</a> </p>


    As part of the link, add PHPESSID=[value], like this:


    <P>Please feel free to <a href="session1.php?PHPESSID=<?php echo "$PHPESSID";?>?>">change
    your preferences</a></p>


    It''s a little more work, but it ensures that a session ID of some sort always
    follows the user as he moves through your site.'
