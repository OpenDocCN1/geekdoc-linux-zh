  md: '# Chapter 3: Working with Databases


    If you issue an UPDATE statement without specifying a WHERE expression, you will
    update all the records. For example, to change everyone''s favorite color to red,
    use this UPDATE statement:


    UPDATE can be a very powerful SQL command. For example, you can perform string
    and mathematical functions on existing records and use the UPDATE command to modify
    their values.


    # SELECT


    When you''re creating database-driven Web sites, the SELECT command will likely
    be the most often-used command in your arsenal. The SELECT command causes certain
    records in your table to be chosen, based on criteria that you define. Here is
    the basic syntax of the SELECT command:


    ```

    SELECT [field names]

    FROM [table names]

    WHERE [some expression]

    ORDER BY [field names];

    ```


    To select all the records in a table, such as the FRIEND_INFO table, use this
    statement:


    ```

    SELECT *

    FROM FRIEND_INFO;

    ```


    To select the entries in the FULL_NAME field of the FRIEND_INFO table, use this:


    ```

    SELECT FULL_NAME

    FROM FRIEND_INFO;

    ```


    To select all the records in a table and have them returned in a particular order,
    use an expression for ORDER BY. For example, to view the FRIEND_ID, FULL_NAME,
    and BIRTH_DATE in each record in the FRIEND_INFO table, ordered by youngest friend
    to oldest friend, use the following:


    ```

    SELECT FRIEND_ID, FULL_NAME, BIRTH_DATE

    FROM FRIEND_INFO

    ORDER BY BIRTH_DATE DESC;

    ```


    DESC for "descending."To view from oldest to youngest, use ASC for "ascending":


    ```

    SELECT FRIEND_ID, FULL_NAME, BIRTH_DATE

    FROM FRIEND_INFO

    ORDER BY BIRTH_DATE ASC;

    ```'
