  md: '# Chapter 4: Creating and Populating Databases


    Hopefully, the previous chapter has given you a basic understanding of database
    connectivity with PHP. Now we''ll move past the basic connection and use PHP and
    HTML forms to create database tables and populate these tables with data.


    The following code examples use the MySQL database; however, each of the actions
    can be carried out on any supported database type. Check the PHP Manual at http://www.php.net/manual/
    for the exact function name for your database—it won''t be vastly different.


    # Create a Database Table


    Essentially, to create a simple database table, you only need to give it a name.
    But that would make for a boring table, since it wouldn''t contain any columns
    (fields) and couldn''t hold any data. So, beside the name, you should know the
    number of fields and the types of fields you''d like to have in your table.


    Suppose you open a store, and you want to create a table to hold all your products.
    Think of the types of fields you might need: a product identification number,
    a title, a description, and the price of the item. Now, think of a name for the
    table, such as MY_PRODUCTS.


    Next, you''ll create a sequence of forms that will take your table information
    and send it to your MySQL database. In this first step, you will submit the name
    of the table and the number of fields you want to include. The second step will
    display additional form fields so that you can define the properties of your table
    columns. Finally, the third step will send the request to MySQL, verify that the
    table was created, and display a "success! message.


    # Step 1: Basic Table Definition


    To begin, open your favorite text editor, create a file called show_creatatable1.html,
    and set up an HTML "shell":


    ```

    <DOCTYPE HTML PUBLIC "//W3C//DTD HTML 3.2//EN">

    <HTML>

    <HEAD>

    <TITLE>Create a Database Table: Step 1</TITLE>

    ```'
