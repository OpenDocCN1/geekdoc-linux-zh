    # Configuring Apache to Use PHP3


    Configuring Apache requires that you edit the httpd.conf file, located in your
    Apache configuration (conf) directory. The goal of the configuration is to tell
    Apache what to do with files ending in .php, .html, .php, or anything else you
    use to indicate a PHP file. You''ll be telling Apache to execute an application
    in order to do something with those files—in this case, running the php binary
    (now located in the cgi-bin directory) to parse the PHP code.


