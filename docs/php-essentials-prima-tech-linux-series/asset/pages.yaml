  md: '# Database Connectivity Functions


    Database connectivity functions in PHP tend to follow the same patterns: connect
    to database, get results, close connection, and so on. However, several specific
    database types have their own set of functions, taking into consideration the
    nuances of the software. The following sections show the basic syntax of the database
    functions for common database types. Extended examples for each database can be
    found in Chapter 3, "Working with Databases."


    # Informix Functions


    There are numerous PHP functions for connecting to and querying Informix databases.
    Following are some basic functions and their syntax. See the PHP Manual at http://www.php.net/manual/
    for a complete listing of Informix functions.


    ```

    ifx_connect()

    ```


    Opens a connection to the Informix database. Requires a database name, server
    name, username, and password.


    ```

    $connection = ifx_connect(dbname@SERVERNAME, "username", "password");

    ```


    ```

    ifx_query()

    ```


    Issues the SQL statement. Requires an open connection to the database.


    ```

    $sql_result = ifx_query("SELECT * FROM SOMETABLE",$connection);

    ```


    ```

    ifx_htmlbtbl_result()

    ```


    Automatically formats query results into an HTML table. Requires a query result
    and can optionally include HTML table attributes.


    ```

    ifx_htmlbtbl_result($sql_result,"border=1");

    ```


    ```

    ifx_free_result()

    ```


    Frees the memory resources used by a database query.


    ```

    ifx_free_result($sql_result);

    ```


    ```

    ifx_close()

    ```


    Explicitly closes a database connection.


    ```

    ifx_close($connection);

