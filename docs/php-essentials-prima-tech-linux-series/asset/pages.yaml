  md: '# Downloading and Installing PHP3


    Try to connect to the WebTen server by opening your Web browser and typing http://127.0.0.1.


    You should see a default installation page containing information about the WebTen
    server. If you do not see a default page, or if your installation fails at any
    point, read the WebTen documentation to pinpoint your problem, and then try again.


    # Downloading and Installing PHP3


    The installation process for PHP is so simple that it makes giddy. There are two
    methods for running PHP with a Web server: as a module or a CGI extension. If
    you''re not running Apache or WebTen, the option has been chosen for you: you
    can only run PHP as a module when running one of those two Web servers, so all
    others use the CGI version.


    Running PHP as a module means that the PHP engine is compiled into the Web server.
    Running PHP as a CGI extension is a bit slower, because the PHP engine must start
    as an external process each time a request is made. When PHP runs as a module,
    it''s all one fluid as far as the Web server is concerned—no external processes
    are started. However, installing PHP as a module requires a recompilation of the
    Web server, so it''s a bit more difficult than just plopping in a binary file
    and moving along.


    To get up and running as soon as possible, the following instructions detail the
    installation of PHP as a CGI extension. You can find the instructions for recompiling
    the Apache Web server and using PHP as a module in the PHP Manual, always at http://www.php.net/manual/


    If running Windows or UNIX, point your Web browser to http://www.php.net/(the
    home of everything PHP) and go to the Downloads section. Download the compressed
    tar file of PHP3 source code (UNIX) or the executable file (for Windows). If you''re
    on a Macintosh and using WebTen, PHP3 was installed during your original server
    installation, so you can skip ahead to Chapter 2.


    # Installing PHP3 on Windows


    To install PHP on a Windows machine, follow the installation instructions given
    in this section. If your installation fails at any point, your path to a solution
    be as follows:


    +   1. Reread the PHP INSTALL file.

    2. Read the PHP FAQ at http://www.php.net/'
