  md: '# Chapter B: Advanced PHP Techniques: e-Commerce


    Now that your form is ready to go, open your text editor and create a file called
    do_sendsecret.php. Before anything else in the script, place the plain-text contents
    of the form submission into a variable $msg:


    ```

    <php

    $msg = "Sender''s Full Name:\t$sender_name\n";

    $msg .= "Sender''s E-Mail:\t$sender_email\n";

    $msg .= "Secret Message?\t$secret_msg\n\n";

    ```


    Next, set the GNUPGHOME environment variable so that the form uses the proper
    key ring. Value of GNUPGHOME should be the directory containing the PHP user''s
    key:


    ```

    putenv("GNUPGHOME=/homedir/of/PHP/user/.gnupg");

    ```


    The next step creates a temporary file on your Web server and writes the contents
    of the form submission to this new file. The PHP user must have write permissions
    in this directory. After the contents of $msg are written to the file, the file
    is closed.


    ```

    $fp = fopen("path/to/temp/input/data", "w");

    fputs($fp, $msg);

    close($fp);

    ```


    > If you think users will send encrypted mail via output data concurrently, you
    should assign a unique file name to the input and output data files. Examples
    include using the time() function to get a long integer, or using a user ID or
    session variable kept in a cookie. If you don''t use unique names, and two users
    access the PHP script at exactly the same time, one file will overwrite the other.


    ![](img/f8bb5053a1d20d75df488da4d4dbfceb_253_0.png)


    At this point, you''re ready to encrypt the data you just placed in the temporary
    file. This example uses the system() function to invoke the GNUPG program on your
    Web server. If you are unsure of its location, contact your server administrator.


    To encrypt the contents of a file, GNUPG needs a user ID (corresponding to a public
    key on the key ring), an input file, and a path and name for the output file.
    The following example encrypts the file using the key for Julie Meloni <julie@thickbook.com>,
    which is on a key ring on my server. Substitute the ID of a key on your server.'
