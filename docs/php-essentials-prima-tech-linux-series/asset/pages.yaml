    # HTTP Environment Variables


    When a Web browser makes a request of a Web server, it sends along with the request
    list of extra variables. These are called environment variables, and they can
    be very useful for displaying dynamic content or authorizing users.


    Additionally, the phpinfo() function displays a wealth of information about the
    version of PHP that you are running and your Web server software, in addition
    to the basic HTTP environment. Create a file called phpinfo.php, containing the
    following lines:


    ```

    <?php

    phpinfo();

    ?>

    ```'
