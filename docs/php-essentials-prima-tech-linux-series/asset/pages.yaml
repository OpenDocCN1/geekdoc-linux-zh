  md: '# Chapter 1: Getting Started with PHP


    o, what''s the hoopla about “fip”? First, it''s not “fip”—it''s P-H-P, from its
    original name: “Personal Home Page Tools.” PHP is a server-side scripting language.
    When your Web browser accesses an URL, it is making a request to a Web server.
    If you are requesting a PHP page, something like http://www.yourcompany.com/home.php,
    the Web server wakes up the PHP parsing engine and says, “Hey! You''ve got to
    do something before I send a result back to this person''s Web browser.” The PHP
    parsing engine runs through the PHP code found in home.php and returns the resulting
    output. This output is passed back to the Web server as the HTML code in the document,
    which in turn is passed on to your browser, displays to you.


    # A Brief History of PHP


    In 1994, an incredibly forward-thinking man named Rasmus Lerdorf developed a set
    of tools that used a parsing engine to interpret a few macros here and there.
    They were not extravagant: a guest book, a counter, and some other “home page”
    elements were cool when the Web was in its infancy. He eventually combined these
    tools with a formal interpretation (FI) package he had written, added some database
    support, and released what was known as PHP/FI.


    Then, in the spirit of Open Source software development, developers over the world
    began contributing to PHP/FI. By 1997, more than 50,000 Web sites were using PHP/FI
    to accomplish different tasks—connecting to a database, displaying dynamic content,
    and so on.


    At that point, the development process really started becoming a team effort.
    With primary assistance from Zeev Suraski and Andi Gutmans, the version 3.0 parser
    was created. The final release of PHP3 occurred in June of 1998, when upgraded
    to include support for multiple platforms (it''s not just for Linux anymore!)
    and Web servers, numerous databases, and SNMP (Simple Network Management Protocol)
    and IMAP (Internet Message Access Protocol).


    So where are we? I''m writing this paragraph just two weeks before the end of
    1999, the rapid growth and popularity of PHP are apparent:


    +   - PHP3 is in use over one million Web servers.

    - PHP3 ships with the Red Hat Linux distribution.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'The PHP Development Team is close to releasing a non-beta version of PHP4,
    featuring a super-fast engine called Zend.


    In fact, PHP4 is so close to being released that I''ll detail some of the features
    of this new version later in this book. Code or features that are specific to
    PHP4 are indicated with the New Feature icon.


    ![](img/f8bb5053a1d20d75df488da4d4dbfceb_24_0.png)


    # What Does PHP Do?


    PHP does anything you want, except sit on its head and spin. Actually, with a
    little on-the-fly manipulation and Dynamic HTML, it can probably do that, too.


    According to the PHP Manual, "The goal of the language is to allow Web developers
    to write dynamically generated pages quickly."


    Here are some common uses of PHP:


    +   * Perform system functions: create, open, read from, write to, and close files
    on your system; execute system commands; create directories; and modify permissions

    * Gather data from forms: save the data to the file, send data via e-mail, return
    manipulated data to the user.

    * Access databases and generate content on-the-fly, or create a Web interface
    for adding, deleting, and modifying elements within your database.

    * Set cookies and access cookie variables.

    * Use PHP user authentication to restrict access to sections of your Web site.

    * Create images on-the-fly.

    * Encrypt data.


    # The Future of PHP


    The future of PHP has arrived, with the beta release of PHP4 and the Zend engine
    (created by Zend Technologies). The final version of PHP4 is scheduled for release
    during the first quarter of 2000, and all signs point to a successful launch.


    It is important to note that PHP4 will be nearly 100 percent backward-compatible
    with PHP3. This means that with few minor (and obscure) exceptions, all of the
    code in this book, as well as any other PHP3 code, will work flawlessly using
    PHP4/Zend.


    ![](img/f8bb5053a1d20d75df488da4d4dbfceb_24_1.png)'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 1: Getting Started with PHP


    Here are some PHP4 highlights, besides the “it’s really fast!” feature:


    +   - The Zend Engine (http://www.zend.com/) has increased performance and additional
    support for objects.

    - Server Abstraction Layer

    -Built-in session handling


    # Is PHP Right for Me?


    Only you can decide if PHP should be your language of choice, whether you''re
    developing sites for personal or commercial use on a small or large scale. I can
    only tell you that in the commercial realm, I''ve worked with all of the popular
    serverside scripting languages—Active Server Pages (ASP), ColdFusion, Java Server
    Pages (JSP), Perl, and PHP—on numerous platforms and various Web servers, with
    various degrees of success. PHP is the right choice for me: it''s flexible, fast,
    and simplistic in its requirements yet powerful in its output.


    Before deciding whether to use PHP in a large-scale or commercial environment,
    consider your answers to these questions:


    +   - Can you say with absolute certainty that you will always use the same Web
    server hardware and software? If not, look for something cross-platform and available
    for multiple servers: PHP.

    - Will you always have the same development team, comprised entirely of ASP (or
    ColdFusion) developers? Or will you use whoever is available, thus necessitating
    a language that is easy to learn and syntactically similar to C and Perl? If you
    have reason to believe that your ASP or ColdFusion developers might drop off the
    face of the earth, don''t use those tools; use PHP.

    - Are memory and server load an issue? If so, don''t use bloated third-party software
    that leaks precious memory; use PHP.


    # A Note Regarding Open Source Development


    Open Source software must follow these criteria (they are available in detail
    at http://www.opensource.org/):


    +   - Free redistribution

    - Source code. The program must include source code and allow distribution in
    source code as well as compiled form.

    - Derived works. The license must allow modifications and derived works.

    - Integrity of the author’s source code'
  merge: -1
  pgno: 25
- img_proc: true
  md: '+   - No discrimination against persons or groups

    - No discrimination against fields of endeavor

    - Distribution of license

    - License must not be specific to a product

    - License must not contaminate other software


    PHP is a fine example of Open Source development and distribution. Other examples
    include the following:


    +   - Apache. The Web Server of choice for more than 4.8 million Web sites

    - Linux. The operating system of choice for more people than Microsoft would like
    you to think

    - BIND. The software providing Domain Name Services to the Internet—all of it

    - Sendmail. The most widely-used software for transporting e-mail from sender
    to recipient


    Synonymous with "Open Source" is "volunteerism." Developers contributing to Open
    Source software do not make money from doing so. The cost of equipment, connectivity,
    tools, and, most importantly, brainpower is absorbed directly by the volunteer
    developer, so that you and I have a free (and widely) available piece of software.


    With that in mind, if you or your company would like to help fund development
    of PHP, visit the Funding page at http://www.php.net/funding.php3 for addresses
    and information.


    A portion of the royalties from this book will be sent to the PHP Team, so tell
    your friends and fellow soon-to-be PHP developers!


    # # Installing a Web Server


    Now the fun begins! It''s time to install a Web server, PHP, and a database on
    your own machine. The following instructional steps require Internet access in
    order to download the various software bundles.


    You can find a complete list of popular Web servers at the ServerWatch Web site
    (http://www.serverwatch.com/). The Web servers discussed in this section are chosen
    because of their status as freeware or demeware, as well as their availability
    via download. Only the most basic installation and configurations are documented
    here. I cannot stress enough that you must read the documentation'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Chapter 1: Getting Started with PHP


    that is distributed with each Web server in order to fine-tune and optimize the

    Web server you choose.


    Use Apache both at home and at work, on Windows 98 and Linux machines; if

    were asked for a recommendation, Apache would be. However, you should visit

    tServerWatch Web site for each of the servers listed here and choose the soft-

    ware that fits your own criteria.


    # Downloading and Installing Apache


    Apache is a freeware Web server, available for numerous flavors of UNIX as well
    as

    for Windows 95/98/NT. The Apache Web site is at http://www.apache.org/. I

    suggest you read the product information found there before deciding whether

    Apache is right for you.


    # Apache on Windows


    If you are a Windows user and decide Apache is right for you, head to http://

    www.apache.org/ and download the latest version of the Windows binary file (the

    one with the *.exe extension). This is precompiled and ready to install. It''s

    2.9MB file, grab a cup of coffee first.


    Once you have the executable file on your hard drive, run it by double-clicking
    it or

    typing its location in the Run dialog box under the Start menu.


    You will be asked for the following:


    +   - The Apache installation directory. The default is C:\Program

    Files\Apache Group\Apache\, but you can change this to C:\Apache\ or

    anything else you want.

    - The name that will appear on the Start menu. The default is Apache

    Web Server.

    - The installation type: typical, minimum, or custom.


    Make the selections appropriate to your installation, and continue. The Apache

    installation program will place a default set of configuration files in the conf
    direc-

    , under the installation directory (for example, C:\Program Files\Apache

    Group\Apache\conf). The default configuration files will contain the custom in-\formation—such
    as directory locations—you indicated during the installation

    process. No additional configuration will be necessary for a basic installation
    of\Apache on Windows. If you modify the configuration files, you must restart
    Apache

    for the changes to take effect. Be sure to back up your original files!'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'In addition to other system directories, the installation program will create
    the default document root, hdocs. The document root of a Web server is the directory
    that holds your HTML documents.


    Next, try to run Apache. There are two options: running Apache as a Windows NT
    Service, or running Apache from a console window (the only option available for
    Windows 95/98 users). To install and run Apache as a Windows NT Service, do the
    following:


    +   1. Select Install Apache as Service (NT only) from the Start menu.

    2. After installation is complete, start the service named Apache by opening the
    Services in the Control Panel, selecting Apache, and clicking the Start button.

    3. The Apache web server will continue to run in the background and will automatically
    start whenever your machine starts.

    4. To stop Apache when it is running as a service, you can issue the NET STOP
    command from the command line, or you can go to the Services window in the Control
    Panel, select Apache, and click the Stop button.


    To run Apache from a console window, do the following:


    +   1. Select Start Apache or Start Apache as a Console App from the folder on
    the Start menu. A console window will open, and Apache will run. Keep this window
    open!

    2. To stop Apache, select Shutdown Console App from the folder on the Start menu,
    or close the window manually (although this is an ungraceful way to shut down
    Apache). Read the Apache documentation for additional instructions on signaling
    Apache from the command line.


    Now that Apache is installed and running, open your Web browser and type http://127.0.0.1/.


    You will see the Welcome to Apache! page, containing links to the Web site and
    the Apache manual. If you do not see the Welcome page, or if your installation
    fails at any point, read the Apache documentation and the Apache FAQ to attempt
    to pinpoint your problem, and then try again.


    # Apache on UNIX


    If you use any flavor of UNIX and you decide that Apache is right for you, head
    to http://www.apache.org/ to begin the download process. You have two options:
    downloading the precompiled binary, or downloading the source files and compiling
    Apache yourself.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 1: Getting Started with PHP


    To install precompiled binaries, go to the distribution directory at http://apache.org/dist/
    and select a binary distribution for your operating system. If you''re using Linux,
    you''ll want to get a file from the Linux directory; if you''re using Solaris,
    you''ll want to get a file from the Solaris directory; and so forth.


    Once you have downloaded the zipped tar file, place it in an accessible directory
    (such as /usr/local/) and unzip it using the following command:


    ```

    gunzip [filename].gz

    ```


    This command will create a *.tar file. To unpack it, use this command:


    ```

    tar -xvf [filename].tar

    ```


    This command will create the /usr/local/apache_[version]/ directory, with the
    following subdirectories: cgi-bin, conf, httpdocs, icons, and src. Each subdirectory
    comes with other goodies.


    In addition to the system directories, the default document root was created:
    httpdocs. The document root of a Web server is the directory that holds your HTML
    documents. You should have a binary file called httpd in the src directory. This
    is good; it''s the file that makes Apache go.


    The next step is to edit the configuration files, if necessary. If you look in
    the conf subdirectory of your Apache installation, you will find three generic
    configuration files: srm.conf, conf-dist, access.conf-dist, and httpd.conf-dist.
    Copy these files to srm.conf, access.conf, and httpd.conf, and make the following
    modifications in httpd.conf to produce a basic Web server configuration:


    +   1. Modify the ServerRoot entry so that it points to the top-level Apache directory.


    +   2. Modify the ServerAdmin entry so that it matches your e-mail address (or
    the e-mail address of another system administrator).


    +   3. Modify the ServerName entry so that it matches the name of the Web server.


    +   4. Modify the DocumentRoot entry so that it points to the directory in which
    your HTML files are kept.


    These modifications are the only changes necessary for a basic installation of
    Apache on UNIX. Anytime you modify the configuration files you must restart Apache
    for the changes to take effect. Be sure to back up your original files!


    Now, try to run Apache by running httpd:


    ```

    /usr/local/apache_[version]/httpd

    ```'
