  md: '# Chapter 2: Basic PHP Techniques


    To view a list of your environment variables and their values, place this file
    on your server and access it with your browser at its URL, http://www.yourserver.com/phpinfo.php.


    In this section, you''ll learn how to use two environment variables: REMOTE_ADDR
    and HTTP_USER_AGENT. For a list of HTTP environment variables and their descriptions,
    visit http://hooohoo.ncsa.uiuc.edu/cgi/env.html.


    By default, environment variables are available to PHP scripts as $VAR_NAME. For
    example, the REMOTE_ADDR environment variable is already contained as $REMOTE_ADDR.
    However, to be absolutely sure that you''re reading the correct value, use the
    getenv() function to assign a value to a variable of yours. For example, the following
    code explicitly places the value of the environment variable REMOTE_ADDR into
    a variable called $remote_address:


    ```

    $remote_address = getenv("REMOTE_ADDR");

    ```


    # REMOTE_ADDR


    The REMOTE_ADDR environment variable contains the IP address of the machine making
    the request. Create a script called remote_address.php, containing the following
    code:


    ```

    <?php

    $remote_address = getenv("REMOTE_ADDR");

    echo "Your IP address is $remote_address.\n?>

    ```


    Save this file and place it on your server, and then access it with your browser
    at its URL, http://www.yourserver.com/remote_address.php.


    You should see "Your IP address is [some number]" on your screen. For example,
    I see "Your IP address is 209.244.209.209." This IP address is the currently assigned
    to my computer by my Internet Service Provider.


    In Chapter 5, "User Authentication," you''ll learn how to use the REMOTE_ADDR
    environment variable as a form of user authentication by limiting the display
    of your Web site content to users accessing it from a specific domain or range
    of IP addresses.


    # HTTP_USER_AGENT


    The HTTP_USER_AGENT variable contains the browser type, browser version, language
    encoding, and platform. For example:


    Mozilla/4.61 - (Win98; I)


    refers to the Netscape (Mozilla) browser, version 4.61, in English, on the Windows
    98 platform.'
