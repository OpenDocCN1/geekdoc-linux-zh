  md: '# Xitami on UNIX


    Installing Xitami on a UNIX machine requires you to compile the source code. According
    to the Xitami Web site, compilation of Xitami has been reported as successful
    for the following operating systems:


    +   - Linux

    - IBM RS/6000 AIX

    - HP/UX

    - Digital UNIX (OSF/1)

    - SunOS and Solaris

    - SCO UNIXWare and OpenServer

    - SGI IriX

    - FreeBSD, BSD/OS, NetBSD


    If your operating system is one of these, or if you are confident in your building
    skills, download and install the zipped tar file from http://www.xitami.com/.


    Place the file in an accessible directory such as `/usr/local/` and unzip it:

    gunzip [filename].gz


    This command will create a *.tar file. To unpack it, use this command:


    ```

    tar -xvf [filename].tar

    ```


    You now should have an Xitami directory in `/usr/local/` (or wherever you placed
    the file) containing the full source code, build the script `xibuild`, and other
    directories of goods, such as the Xitami manual.


    To run the `xibuild` script, which compiles Xitami and installs the executable
    program in the appropriate directory, type the following commands at the prompt:

    chmod +x xibuild

    ./xibuild


    Run the Xitami executable, and then open your Web browser and type http://127.0.0.1/.


    You should see the Welcome to Xitami! page, containing links to the Xitami Web
    site and the Xitami manual and FAQ list. If you do not see the Welcome page, or
    if your installation fails at any point, read the Xitami documentation and the
    Xitami FAQ to pinpoint your problem, and then try again.'
