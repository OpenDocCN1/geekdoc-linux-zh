- img_proc: true
  md: 'This statement produces results like this:


    | FRIEND_ID | FULL_NAME | BIRTH_DATE |

    |-----------|-----------|------------|

    | 2 | Mary Smith | 1962-07-25 |

    | 3 | Jane Smith | 1968-04-28 |

    | 1 | Joe Smith | 1970-11-03 |

    | 4 | Joe Smith | 1975-11-07 |


    When preparing ORDER BY clauses, the default order is ASC (ascending).


    You can also perform mathematical and string functions within SQL statements,
    thereby by using SELECT to do more than just echo existing data. For example,
    to quickly find the number of friends in your FRIEND_INFO table, you use


    ```

    SELECT COUNT(FRIEND_ID) FROM FRIEND_INFO;

    ```


    The result of this statement is 4. You could also use the COUNT() function on
    any other field to count the number of entries in the table.


    I could write volumes on the many variations of SELECT commands, but luckily,
    others already have. Additionally, if you are using the MySQL database, the MySQL
    manual contains a wonderful SQL reference. Later in this chapter, as well as in
    Chapters 7 and 8, "Advanced PHP Techniques: Web-Based Database Administration"
    and "Advanced PHP Techniques: e-Commerce,"you will learn more uses of the SELECT
    command.


    # DELETE


    The DELETE command is not nearly as fun as SELECT, but it''s useful nonetheless.
    Like the DROP command, using DELETE without paying attention to what you are doing
    can have horrible consequences in a production environment. Once you DROP a table
    or DELETE a record, it''s gone forever. The basic syntax of the DELETE command
    is as follows:


    ```

    DELETE FROM [table name]

    WHERE [some expression];

    ```


    For example, to delete entries for Joe Smith from your FRIEND_INFO table, you
    could use:


    ```

    DELETE FROM FRIEND_INFO

    WHERE FULL_NAME = ''Joe Smith'';

    ```'
