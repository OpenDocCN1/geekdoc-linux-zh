- img_proc: true
  md: 'Bfore delving directly into PHP scripting, it''s important to get a handle
    on basic HTML techniques. Since PHP is embedded within HTML, or perhaps the script
    itself generates marked-up text, knowing the fundamental structure of HTML will
    help you to avoid potential problems with your script output. example, if your
    PHP script is generating a table layout, and that table does not render on-screen,
    don''t jump to the assumption that there''s a problem with your PHP code. Most
    likely, the problem is a missing table tag!


    # An HTML Refresher


    Hypertext Language, or HTML, isn''t a programming language in the same vein as
    C++ or Java. Instead, it is as its name implies, a markup language. You take a
    simple ASCII text file and “mark up” that by putting text in brackets around other
    text. Now put that page on a Web server and request it in your Web browser by
    typing its URL, such as http://www.yourserver.com/yourpage.html. Your Web browser
    makes a request to the Web server, and the Web server responds with the file.
    This transaction essentially says “Please take the file called yourpage.html that
    exists on this machine, and send it to my Web browser.


    Your Web browser then “renders” the document, taking the file, looking at the
    text in funny brackets, and following the directions they contain. These directions
    tell the Web browser how the information displayed on the page should appear:
    bold, italicized, blue, with line breaks, and so on.


    # HTML Tags


    The “in funny brackets” are HTML tags. These tags define elements of the document:
    titles, headings, paragraphs, lists, and so on. Without tags, the Web browser
    has no way to determine how to display the elements.


    Tags begin with a left-angle bracket (<) and end with a right-angle bracket (>).
    Additionally, tags are usually in pairs: the opening tag and the closing tag.
    Here''s an example:


    +   - <HTML> The opening tag, which tells the browser that everything from that
    forward is HTML.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '&lt;/HTML&gt; Closing tag, tells the browser that the HTML document should
    end at that point. Note the / before tag name, defining it as a closing tag.


    Certain HTML tags can contain attributes, or additional information included in
    the tag, such as alignment directives.


    &lt;P align=center&gt;This is a centered paragraph.&lt;/P&gt;


    The attribute align=center tells the browser to center the paragraph.


    There are two main types of HTML tags: block-level and text-level. An HTML document
    contains one or more block-level elements, or text surrounded by block-level tags.


    # Block-Level Tags


    Block-level tags, such as the logical division &lt;DIV&gt;&lt;/DIV&gt;, contain
    block-level elements. Block-level elements can contain other block-level elements,
    as well as text-level elements. For example, a logical division can contain a
    paragraph, and the paragraph can contain emphasized text:


    ```

    &lt;DIV&gt;

    ```


    &lt;P&gt;This paragraph introduces the next paragraph.&lt;/P&gt;


    &lt;P&gt;This paragraph contains &lt;em&gt;very&lt;/em&gt; useful information.&lt;/P&gt;


    &lt;P&gt;80th paragraphs are within a logical division.&lt;/P&gt;


    ```

    &lt;/DIV&gt;

    ```


    Here are some examples of block-level tags:


    +   - &lt;H1&gt;&lt;/H1&gt;, &lt;H2&gt;&lt;/H2&gt;, &lt;H3&gt;&lt;/H3&gt;, &lt;H4&gt;&lt;/H4&gt;,
    &lt;H5&gt;&lt;/H5&gt;, &lt;H6&gt;&lt;/H6&gt;

    The level 1 heading &lt;H1&gt;&lt;/H1&gt; appears more prominently than other
    level tags, followed by &lt;H2&gt;&lt;/H2&gt; and &lt;H3&gt;&lt;/H3&gt;, through
    &lt;H6&gt;&lt;/H6&gt;. Use level tags in a hierarchical order: level 2 after level
    1, level 3 after level 2, and so on.


    +   - &lt;BLOCKQUOTE&gt;&lt;/BLOCKQUOTE&gt; Use when quoting large blocks of text
    from another document.


    +   - &lt;UL&gt;&lt;/UL&gt; The unordered list. Unordered list items, indicated
    with the &lt;LI&gt; tag, are preceded by a bullet symbol.


    +   - &lt;OL&gt;&lt;/OL&gt; The ordered list. Ordered list items, indicated with
    the &lt;LI&gt; tag, are preceded by a number.


    +   - &lt;TABLE&gt;&lt;/TABLE&gt; Create a table when surrounding the &lt;TH&gt;&lt;/TH&gt;
    and &lt;TD&gt;&lt;/TD&gt; text-level tags.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Chapter 2: Basic PHP Techniques


    +   - <TR></TR> These tags insert a table row within a <TABLE> element. Table
    rows contain <th>header</TH> and <td>data cell</TD> elements.

    - <TH></TH> These tags insert a table header cell within a <TR> element.

    - <TD></TD> These tags insert a table data cell within a <TR> element.


    # Text-level Tags


    Text-level tags are applied to specific text text within block-level elements.
    For example, a paragraph can contain emphasized text and a hyperlink link, both
    examples of text-level elements:


    ```

    <P>This paragraph contains a link to a <em>very/em</em> interesting <a href="http://www.yourserver.com/story.html">story</a></a></P>

    ```


    Here are some examples of text-level tags:


    +   - <strong></strong></strong> Strongly emphasized text.

    - <img></img> Displays an image. No closing tag is necessary.

    - <BR> Inserts a line break. No closing tag is necessary.


    # Creating a Valid HTML Document


    HTML documents have a specific structure that should be followed to avoid display
    problems. Understanding the structure of an HTML document is especially important
    when integrating it with PHP code, because in some instances PHP code must exist
    before certain HTML elements. For example, when creating browser cookies, the
    PHP code used to create and send the cookie must exist before any text, line breaks,
    or other HTML is sent to the browser.


    The following steps will create a structurally sound HTML document:


    +   1. Define the document type according to the HTML standard it follows.

    2. Open the <html> tag, stating that the information that follows is in HTML.

    3. Open the <HEAD> tag. This area contains the title of your document, as well
    as other document information. With the exception of of the document title, none
    of the information in the <HEAD> element is displayed by the browser.

    4. Insert the title of the document within the <TITLE></TITLE> tag pair.

    5. Insert any <META> information. Examples of <META> information include document
    descriptions and expiration dates.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '6. Insert any <LINK> information. Examples of <LINK> information include the
    e-mail address of the document''s author and the location of the associated style
    sheet.


    7. Insert the closing <HEAD> tag: </HEAD>


    8. Open the <BODY> tag. This area contains all of the information displayed by
    the browser. Only one <body> element exists in each document.


    9. Insert your content, in HTML format.


    10. Insert the closing <BODY> tag: </BODY>


    11. Insert the closing <HTML> tag: </HTML>


    Following these steps produces a valid HTML document, something like this:


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 3.2//EN">

    <HTML>

    <HEAD>

    <TITLE>Your Title</TITLE>

    <META NAME="description" CONTENT="My first document">

    <LINK REV="made" HREF="mailto:you@yourserver.com">

    </HEAD>

    <BODY>

    <P>All of your content goes here!</P>

    </BODY>

    </HTML>

    ```


    Understanding valid HTML document structure is the first step in creating error-free
    PHP scripts. The next two sections provide an overview of HTML tables and forms.
    For a selection of in-depth HTML tutorials, visit the "Links" section at http://www.thickbook.com.


    # Understanding HTML Tables


    HTML tables follow a structure as strict as the overall HTML document structure.
    One miscue, such as a missing closing tag, can cause great debugging headaches.
    Many programmers have examined their code for hours, calling in reinforcements
    to help them debug the mystery of the non-displaying pages, only to discover that
    they failed to extend the <TABLE> tag to close the table. This is known as "smack
    the forehead" syndrome. Repeat the mantra "Close all tags" and you probably suffer
    from "smack the forehead" syndrome.


    A simple table contains one row and two columns. The row starts with a <TR> tag
    and ends with a </TR> closing tag. Within the <TR> tag are the <TD> opening tag,
    followed'
  merge: -1
  pgno: 50
- img_proc: true
