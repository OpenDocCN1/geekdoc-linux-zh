  md: 'Here''s a very important point to remember: Unless your form is located on
    a secure server (a Web server with an SSL certificate), the information transmitted
    from the user''s Web browser to the script on your Web server is insecure, since
    there''s no encryption going on. Bear that in mind when you need to create forms
    that send credit card information rather than "secret messages."


    Now that you are ready to go, open your text editor and create a file called do_sendsecret.php.Before
    anything else in the script, place the plain-text contents of the form submission
    into a variable called $msg:


    ```

    <?php

    $msg = "Sender''s Full Name:\t$sender_name\n";

    $msg .= "Sender''s E-Mail:\t$sender_email\n";

    $msg .= "Secret Message?\t$secret_msg\n";

    ```


    Next, set the PGPPATH environment variable so that the form uses the proper key
    ring. This value of PGPPATH should be the directory containing the PHP user''s
    key ring:


    ```

    putenv("PGPPATH=$homedir/of/php/user/.pgp");

    The next step creates a file on your Web server and writes the contents of the
    form submission to this new file. The PHP user must have write permissions in
    this directory. After the contents of $msg are written to the file, the file is
    closed.

    ```


    ```

    $fp = fopen("path/to/temp/input/data", "w+");

    fputs($fp, $msg);

    fclose($fp);

    ```


    > If you think users will send encrypted mail via a form concurrently, you should
    assign a unique file name to the input and output data files. Examples include
    using the time() function to get a long integer, or using a user ID or session
    variable kept in a cookie. If you don''t use unique names, and if two users access
    the PHP script at exactly the same time, one will overwrite the other.


    ![](img/f8bb5053a1d20d75df488da4d4dbfceb_246_0.png)


    At this point, you''re ready to encrypt the data you just placed in the temporary
    file. This example uses the system() function to invoke the PGP program on your
    Web server. If you are unsure of its location, contact your system administrator.


    To encrypt the contents of a file, PGP needs a user ID (corresponding to a public
    key ring), an input file, a path and file name for the output file. The following
    example encrypts the file using the key for Julie Meloni <julia@ethbook.com>,
    which is on a key ring on my server. Substitute the ID of a key on your server.'
