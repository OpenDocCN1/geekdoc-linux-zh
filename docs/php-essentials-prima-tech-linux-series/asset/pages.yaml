    # Comparison Operators\n\nIt should come as no surprise that comparison operators\
    \ compare two values. As with the arithmetic operators, you already know most\
    \ of the comparison operators:\n\n+   - == equal to\n!= not equal to\n- greater\
    \ than\n- less than\n>= greater than or equal to\n<= less than or equal to\n\n\
    In the following examples, $a = 5 and $b = 4.\n\n+   - $a == $b? No; 5 does not\
    \ equal 4. The comparison is FALSE.\n- $a != $b? Yes; 5 does not equal 4. The\
    \ comparison is TRUE.\n- $a > $b? Yes; 5 is greater than 4. The comparison is\
    \ TRUE.\n- $a < $b? No; 5 is not less than 4. The comparison is FALSE.\n- $a >=\
    \ $b? Yes; although 5 does not equal 4, 5 is greater than 4. The comparison is\
    \ TRUE.\n- $a <= $b? No; 5 does not equal 4, and 5 is not less than 4. The comparison\
    \ is FALSE.\n\nComparison operators are often used in conjunction with control\
    \ statements (if...while) to perform a specific task based on the validity of\
    \ expressions. For example, if you are writing a number-guessing program, and\
