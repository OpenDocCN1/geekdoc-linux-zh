    # UPDATE


    The UPDATE command modifies parts of a record without replacing the entire record.
    Here is the basic syntax of the UPDATE command:


    ```

    UPDATE [table name]

    SET [field name] = [''new value'']

    WHERE (some expression);

    ```


    For instance, suppose you have an incorrect birth date in the FRIEND_INFO table:
    Joe Smith, with a FRIEND_ID of 1, was born on November 3 instead of October 3.
    Instead of deleting the record and inserting a new one, just use the UPDATE command
    to change the data in the BIRTH_DATE field:


    ```

    UPDATE FRIEND_INFO

    SET BIRTH_DATE = ''1970-11-03''

    WHERE FRIEND_ID = ''1'';

    ```'
