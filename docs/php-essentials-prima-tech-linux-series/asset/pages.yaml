    \ program continues to the final else statement:\n\n```\nif ($a == \"10\") {\n\
    \    echo \"a equals 10\";\n} elseif ($b == \"8\") {\n    echo \"b equals 8\"\
    ;\n} else {\n    echo \"a does not equal 10 and b does not equal 8\";\n}\n```\n\
    \nYou can use statements alone or as part of an if_else or if_elseif_else statement.\
    \ Whichever you choose, you will find this structure to be an invaluable element\
    \ in your programs!\n\n# while\n\nUnlike the if_elseif_else structure, in which\
    \ each expression is evaluated once and an action is performed based on its value\
    \ of TRUE or FALSE, the while statement continues to loop until an expression\
    \ is FALSE. In other words, the while loop continues while the expression is TRUE.\n\
    \nFor example, in the following while loop, the value of $a is printed on the\
    \ screen and is incremented by 1 as long as the value of $a is less than or equal\
    \ to 5.\n\n```\n$a = 0 // set a starting point\nwhile ($a <= \"5\") {\n    echo\
    \ \"a equals $a<br>\";\n    $a++;\n}\n```\n\nHere is the output of this loop:\n\
    \n+   - equals 0\n- equals 1"
