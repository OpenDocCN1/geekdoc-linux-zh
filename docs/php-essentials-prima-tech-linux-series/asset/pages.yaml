  md: '# Chapter B: Advanced PHP Techniques: e-Commerce


    # # Sending Secure Orders Via E-Mail


    This is it: the moment of truth. This final step will take the contents of the
    checkout form and send them to you via encrypted e-mail, as learned at the beginning
    of this chapter. The PHP script for this step, shop_sender.php, is nearly identical
    to shop_checkout.php, so make a copy of the latter, and I will walk you through
    the changes.


    First, check for required fields. There are a bunch, so be prepared for a big
    if statement!


    The next change is to remove the form elements and print the values of the variables
    as text, a confirmation to the user. For example, within the echo statement, display
    the user''s full name like this:


    ```

    <tr>

    <td><strong>Full Name:</strong></td>

    <td>$full_name</td>

    </tr>

    ```


    Continue the process for the other fields from the checkout form. The next modification
    is part of the while loop that displays the cart items to the user. Keep the original
    echo statement within that loop, but add this after it:


    ```

    $items .= "$sel_item_qty $sel_item_title at $sel_item_price\n";

    ```


    This adds the elements to a string called $items, which we''ll use in a moment.
    Everything else remains the same until all the HTML has been displayed. Now it''s
    time to send the e-mail. Start by creating a $msg variable, and then concatenate
    to your heart''s delight:


    ```

    $msg = "XYZ COMPANY ORDER FORM\n";

    $msg .= "-\-\n\n";

    $msg .= "CUSTOMER INFORMATION\n";

    $msg .= "Full Name: $full_name\n";

    $msg .= "E-mail: $email\n";

    $msg .= "Address Line 1: $address1\n";

    ```'
