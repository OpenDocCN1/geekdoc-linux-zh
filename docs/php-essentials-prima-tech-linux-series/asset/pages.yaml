    # Establishing a Database Connection with PHP


    Using the built-in database connectivity functions in PHP, you can connect to
    virtually any database type and access its data (if you have the proper permissions,
    of course!). If PHP does not contain specific functions for your particular database
    type, you can make generic ODBC connections using PHP''s ODBC functions. Before
    trying to use any of the database connectivity functions, be sure that you have
    a database installed and the proper extensions are loaded and indicated in your
    php.ini or php.ini file.


    In the next pages, you''ll find function definitions and code samples for numerous
    database types. The PHP Manual at http://www.php.net/manual/ is the first place
    you should look to find a complete list of all the functions for supported databases.
    After searching the manual and the FAQ, search the PHP Mailing List Archives.
    Chances good that if you have a database connectivity question, someone else has
    asked it and a developer has answered it. If not, asking a well-phased question
    will undoubtedly elicit numerous responses.


    The following sections are by no means all there is to know about connecting to
    databases with PHP. Instead, these sections detail the basic elements of database
    connectivity:'
