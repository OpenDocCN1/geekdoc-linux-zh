    # for


    Like while loops, for loops evaluate the set of conditional expressions at the
    beginning of each loop. Here is the syntax of the for loop:


    ```

    for (expr1; expr2; expr3) {

    // code to execute

    }

    ```


    At the beginning of each loop, the first expression is evaluated, followed by
    the second expression. If the second expression is TRUE, the loop continues executing
    the code and then evaluating the third expression. If the second expression is
    FALSE, the loop does not continue, and the third expression is never evaluated.


    Take the counting example used in the while loop, rewrite it using a for loop:


    ```

    for ($a = 0; $a <= "5"; $a++) {

    echo "a equals $a<br>";

    }

    ```


    The output is the same as the while loop:


    a equals 0

    a equals 1

    a equals 2

    a equals 3

    a equals 4

    a equals 5


