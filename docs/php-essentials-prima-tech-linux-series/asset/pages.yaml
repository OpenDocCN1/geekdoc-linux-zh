  md: '# Chapter 3: Working with Databases


    To add a column to the table, you could use the following statement, which adds
    a field called HAT_SIZE:


    ```

    ALTER TABLE FRIEND_INFO

    ADD HAT_SIZE char(5);

    ```


    Using the ALTER command alleviates the need to delete an entire table and recreate
    it just because you spelled a field name incorrectly or made other minor mistakes.


    # DROP


    The DROP command is quite dangerous if you''re not paying attention to what you''re
    doing, because it will delete your entire table in the blink of an eye. The syntax
    is very simple:


    ```

    DROP TABLE [table name];

    ```


    If you wanted to delete the FRIEND_INFO table and rely on your brain to remember
    your friends'' birthdays, the command would be


    ```

    DROP TABLE FRIEND_INFO;

    ```


    You can use the DROP command in conjunction with the ALTER command to delete specific
    fields (and all the data contained in them). To delete the HAT_SIZE field from
    the FRIEND_INFO table, issue this statement:


    ```

    ALTER TABLE FRIEND_INFO

    DROP HAT_SIZE;

    ```


    The HAT_SIZE field will no longer exist, but all other fields in your table will
    still be intact.


    # INSERT


    You use the INSERT command to populate your tables one record at a time. The basic
    syntax of the INSERT command is


    ```

    INSERT INTO [table name] ([name of field1], [name of field2], ...)

    VALUES (''value of field 1'', ''value of field 2'');

    ```


    To add a record to the FRIEND_INFO table, where the fields are FRIEND_ID, FULL_NAME,
    BIRTH_DATE, and FAVE_COLOR, the command would be:


    ```

    INSERT INTO FRIEND_INFO (FRIEND_ID, FULL_NAME, BIRTH_DATE, FAVE_COLOR)

    VALUES (''1'', ''Joe Smith'', ''1970-10-03'', ''blue'');

    ```'
