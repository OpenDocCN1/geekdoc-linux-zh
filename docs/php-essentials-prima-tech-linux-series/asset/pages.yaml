    # Connecting to an Oracle Database


    PHP has numerous functions for connecting to Oracle databases. This is good because
    if you''ve spent the money to purchase an Oracle database, you''ll want to be
    able to connect to this newly flagged programming language that''s all the rage.
    The PHP Manual has the definitive list of PHP-to-Oracle connectivity functions;
    however, you need only a few in order to make a simple connection and select some
    data:


    +   - OCILogon() Opens a connection to Oracle. Requires the environment variable
    ORACLE_SID has been set and you have a valid username and password.

    - OCIParse() Parses an SQL statement.

    - OCIExecute() Executes the SQL statement.

    - ONumCols() Gets the number of columns used in the SQL statement.

    - OCIFetch() Gets the next row in the result of a SQL statement and places it
    in a results buffer.

    - OCIResult() Gets the value of the named column in the current result row.

    - OCIFreeStatement() Frees the resources in use by the current statement.

    - OCILogoff() Closes the connection to Oracle.'
