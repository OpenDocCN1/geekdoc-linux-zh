  md: '# Establishing a Database Connection with PHP


    The full script to perform a simple connection and data selection from an ODBC
    datasource could look something like this:


    ```

    <?php

    // create connection

    // substitute your own datasource name, username and password

    $connection = ods_connect("DSN=secretDB","sandman","34Nhjhp") or die("Couldn''t
    connect to the datasource.");


    // create SQL statement

    $sql = "SELECT FULL_NAME, BIRTH_DATE, FAVE_COLOR

    FROM FRIEND_INFO

    ORDER BY BIRTH_DATE ASC";


    // prepare SQL statement

    $sql_statement = odbc_prepare($connection,$sql) or die("Couldn''t prepare statement.");


    // execute SQL statement and get results

    $sql_result = odbc_execute($sql_statement) or die("Couldn''t execute query.");


    // format result in HTML table

    odbc_result_all($sql_result,"border=1");


    // free resources and close connection

    odbc_free_result($sql_result);

    odbc_close($connection);

    ?>

    ```


    See the PHP Manual for additional ODBC functions, and try using your own tables
    and SQL statements instead of the examples just shown. Remember, don''t use the
    DELETE or DROP commands unless you''re really ready and you''ve backed up your
    data!


    Okay, those are the basics of database connectivity; now forge ahead to Chapter
    4, where you''ll learn how to use PHP and HTML forms to create database tables
    and populate them with your data.'
