- img_proc: true
  md: '# Chapter 6: User Tracking and Session Management


    You can''t effectively track visitors on a Web site without a little intervention.
    Every Web server tracks basic accesses, meaning for each “hit,” it keeps a log
    of the latest date and time, the IP or domain name of the user making the request,
    and the name of the file that was sent. This type of log isn''t helpful when you
    want to track buying trends or user preferences, and it doesn''t give you any
    real insight into your user base. The solution to this problem requires definite
    planning but is easy to implement—use cookies!


    However, there are limits to the number of elements you can hold in cookies, and
    some people can''t or don''t want to accept them. Alternative measures can be
    put in place by using the session management functions in PHP4. In this chapter,
    you''ll learn how to develop a system that manages user information using both
    cookies and sessions.


    # Cookies


    Cookies are little pieces of text that are sent to a user''s browser along with
    the pretty pictures and well-worded content of a good Web site. They can help
    you create shopping carts, user communities, and personalized sites. Say you''re
    planned to assign an identification variable to a user so that you can track what
    he does when he visits your site. First, the user logs in, and you send a cookie
    with variables designed to say “This is Joe, and Joe is allowed to be here.” While
    Joe is surfing around your site, you can say “Hello, Joe!” on each and every page.
    If Joe clicks through your catalog and chooses 14 different items to buy, you
    can keep track of these items and display them all in a bunch when Joe clicks
    on Checkout. But what happens when a user doesn''t accept cookies? Are your well-laid
    plans all for naught? Will Joe ever get to buy those 14 items?


    These sorts of identification cookies are valuable in e-commerce sites, where
    you''re creating a shopping system that allows the user to store selected items
    until he''s ready to pay for them. You can use cookies for all sorts of things,
    but because e-commerce sites are popular, we''ll go with that example.'
  merge: -1
  pgno: 171
- img_proc: true
  md: "# Setting Cookies\n\nBefore you go setting cookies, determine how you will\
    \ use them and at what point you will set them. Do you want to check for a cookie\
    \ on every page of your site, and set one it if it doesn't exist? How will you\
    \ use the cookie data? What-ever cookies you decide to use, remember that you\
    \ absolutely must set a cookie before sending any other content to the browser.\
    \ If you remember this, you won't spend hours wondering why you're getting \"\
    Can't send additional information, header already sent\" errors!\n\nIn this example,\
    \ pretend you're building an online coffee shop. Obviously, you can't buy a triple-shot\
    \ super-size latte, but you can order bags of coffee. When I build an e-commerce\
    \ site, I usually check for and set a cookie on every page the site, because I\
    \ usually display a shopping cart icon and the number of items in the user's cart\
    \ on every page. That's just a personal preference, however, and it does require\
    \ every page to be parsed by the PHP engine.\n\nAssume that our online coffee\
    \ store checks for a cookie on every page. The first time a user accesses any\
    \ page on the site, he is assigned a random value as his user identification number.\
    \ From that point forward, the user holds a valid cookie. The PHP code at the\
    \ beginning of each page checks for a cookie and sends one only if one doesnt\
    \ already exist. This method keeps cookie values from being overwritten. Every\
    \ page in the site starts off something like this:\n\n```\n<?php\n// set cookie\
    \ if not already set\nif (isset($id)) {\n  rand((double)microtime()\\*1000000);\n\
    \  $randval = rand();\n  setcookie(\"id\",$randval,time()+14400.\"./\",\"mycoffeeshop.com\"\
