    # Configuring the Web Server


    Configuration directives can be inserted either in the Apache httpd.conf file
    (usually in /usr/local/apache/conf/) or in a separate .htaccess file in protected
    directory. For example:


    +   * To protect http://www.yourdomain.com/privatestuff/ using an .htaccess file,
    place the file in /usr/local/apache/htdocs/privatestuff/.

    * To protect http://www.yourdomain.com/privatestuff/ using httpd.conf, create
    a section in httpd.conf beginning with <Directory /usr/local/apache/htdocs/privatestuff/>
    and ending with </Directory>.


    One drawback of multiple .htaccess files is that you must keep track of all of
    them! When issuing directives in the httpd.conf file, all of the directives are
    in one constant place and are easier to manage. Whether you put the directives
    in an .htaccess file or within a <Directory> </Directory> section of the httpd.conf
    file, the information is the same:


    +   * AuthName. The name of the protected area, or realm, such as "My Private
    Stuff" or "Jane''s Development Area".

    * AuthType. The authentication protocol in use, usually Basic. Digest authentication
    also exists, in which the usernames and passwords are encrypted as they pass between
    browser and server. Digest authentication is unsupported by some older browsers,
    therefore limiting its use in applications.

    * UserFile. The full path to the file containing the usernames and passwords.

    * AuthGroupFile. The full path to the file containing the list of groups, if any.

    * require. Specifies which users and/or groups have access to the protected area.
    For valid-users, just jane, just the group friends, or a combination.


    A sample set of directives might look like this:


    ```

    AuthName "My Private Stuff"

    AuthType Basic

    ```'
