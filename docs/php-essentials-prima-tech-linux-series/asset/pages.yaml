  md: '# Starting a Session and Registering Variables


    We''ll use a simple access counter to get used to the idea of sessions and session
    variables. At the beginning of your page, call the session_start() function. This
    function serves two purposes. First, it checks to see if a session has been started
    for this user and Second, it alerts the PHP engine session variables and other
    session-related functions will be used within the specific script.


    Open your favorite text editor, create a file called count_me.php, and type the
    following:


    ```

    <php

    // count_me.php

    // if a session does not exist for this user, start one

    session_start();

    ?>

    ```


    Next, register the count variable inside your session object:

    Session_register(''count'');


    Now, for long as this session exists, a variable called count also exists. Currently,
    the variable has no value. However, if you increment it, it will have a value
    of "1":


    $count++;


    Put these pieces together, and you''ll have done the following: started a session
    if it hasn''t already started, assigned a session ID to user if one doesn''t exist,
    and registered the variable called count and incremented it by 1 to represent
    the initial time the user has accessed the page.


    Next, to display the value of the $count session variable and show the user how
    many times he has accessed this page in his current session, just print the value
    of $count:

    echocho "<P>You''ve been here $count times. Thanks!</p>"

    The entire access count code should look something like this:


    ```

    <php

    // count_me.php

    // if a session does not exist for this user, start one

    session_start();

    session_register(''count'');

    $count++;

    echo "<P>You''ve been here $count times. Thanks!</p>"

    ?>

    ```'
