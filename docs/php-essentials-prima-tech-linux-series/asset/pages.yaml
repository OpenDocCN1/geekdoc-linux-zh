    # # Operators


    An operator is a symbol that represents a specific action. For example, the +
    arithmetic operator adds two values, and the = assignment operator assigns a value
    to a variable.


    # # Arithmetic Operators


    Arithmetic operators bear a striking resemblance to simple math, as shown in Table
    A.2. In the examples, $a = 5 and $b = 4.


    #  Table A.2 Arithmetic Operators


    | Operator | Name | Example |

    | --- | --- | --- |

    | + | addition | $c = $a + $b; // $c = 9 |

    | - | subtraction | $c = $a - $b; // $c = 1 |

    | * | multiplication | $c = $a * $b; // $c = 20 |

    | / | division | $c = $a / $b; // $c = 1.25 |

    | % | modulus, or "remainder" | $c = $a % $b; // $c = 1 |


    # # Assignment Operators


    The = is the basic assignment operator:

    $a = 124; // the value of $a is 124


    Other assignment operators include +=, -=, =, and .


    ```

    $ex += 1; // Assigns the value of ($ex + 1) to $ex

    // If $ex = 2, then the value of ($ex += 1) is 3.

    $ex -= 1; // Assigns the value of ($ex - 1) to $ex

    // If $ex = 2, then the value of ($ex -= 1) is 1.

    $ex .= "coffee"; // Concatenates (adds) to a string. $ex = "I like ""

    // then the value of ($ex .= "coffee") is "I like coffee".

    ```'
