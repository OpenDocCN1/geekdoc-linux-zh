  md: '# Table A.6 date() Function Formats


    | Character | Meaning |

    |---|---|

    | a | prints "am" or "pm" |

    | A | prints "AM" or "PM" |

    | h | hour, 12-hour format (01 to 12) |

    | H | hour, 24-hour format (00 to 23) |

    | g | hour, 12-hour format without leading zero (1 to 12) |

    | G | hour, 24-hour format without leading zero (0 to 23) |

    | i | minutes (00 to 59) |

    | s | seconds (00 to 59) |

    | Z | time zone offset in seconds (-43200 to 43200) |

    | U | seconds since the Epoch (January 1, 1970 00:00:00 GMT) |

    | d | day of month, two digits (01 to 31) |

    | J | day of month, two digits without leading zero (1 to 31) |

    | d | day of week, long text (Mon to Sun) |

    | I | day of week, long text (Monday to Sunday) |

    | w | day of week, numeric, Sunday to Saturday (0 to 6) |

    | F | month, long text (January to December) |

    | m | month, two digits (01 to 12) |

    | n | month, two digits without leading zero (1 to 12) |

    | M | month, three-letter text (Jan to Dec) |

    | Y | year, four digits (2000) |

    | y | year, two digits (00) |

    | z | day of the year (0 to 365) |

    | t | number of days in the given month (28 to 31) |

    | S | English ordinal suffix (th, nd, st) |


    For example, the following will print the current date in this format: January
    10th 2000, 08:08AM.


    ```

    echo date("F JS Y, h:iA");

    ```'
