    # Modifying Records in the Product Catalog


    If you were really an online bookseller, it''s quite likely that at some point
    you''d want to modify the information in your product catalog. You''ve already
    got the link in your administration menu, so let''s make it active! Before you
    modify a product''s information, you need to select a single record to work with.
    The first step in the modification sequence is to select a record to modify.


    As with just everything related to programming, there are several ways to display
    the selection screen. You could display the title of each book in a list along
    with a radio button to select the record you want to edit. If you have a long
    list of products, you could limit the display to groups of 10 or 15 or some other
    number and use Next and Previous links to display each group. The goal is to pick
    one record whose modifiable content will be displayed in the next step. My sample
    product catalog has only six items, so I''m going to populate a drop-down list
    box with each book''s ISBN and title.


    Open your text editor and create a file called admin_modrecord.php. Since the
    product selection form is also part of the administration area, add the basic
    PHP authentication code used in previous scripts in this chapter. The selection
    form itself is quite basic: it''s just one drop-down list box and a submit button.
    The trick is to populate that list with elements in the MASTER_PRODUCTS table.
    As you''ll soon see, it''s not that tricky!'
