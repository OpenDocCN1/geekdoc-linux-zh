    before asking a question on one of the PHP listing lists.


    # # PHP Syntax


    To combine PHP code with HTML, the PHP code must be escaped, or set apart, from
    the HTML. The PHP engine will consider anything within the tag pairs shown in
    Table A.1 as PHP code.


    | Opening Tag | Closing Tag |

    | --- | --- |

    | <?php | ?> |

    | <?? | ?> |

    | <script language="php"> | </script> |


    Here''s an example that uses all three in the same script, called tagtest.php:


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 3.2//EN">

    <html>

    <head>

    <title>Tag Test</</title>

    </head>

    <body>

    <?php echo "I am using the first tag pair type.<br>"; ?>?>

    ```'
