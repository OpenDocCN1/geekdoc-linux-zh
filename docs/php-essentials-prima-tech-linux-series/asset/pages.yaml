    \ is found, the comma is added to the SQL statement.\n\nThe entire loop should\
    \ look something like this:\n\n```\nfor ($i = 0; $i < count($field_name); $i++)\
    \ {\n  $sql .= \"$field_name[$i] $field_type[$i];\";\n  if ($field_length[$i]\
