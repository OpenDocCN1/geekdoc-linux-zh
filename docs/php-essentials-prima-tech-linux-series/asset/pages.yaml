    Next, create a variable to hold the result ID of the query, carried out by the
    ifx_query() function. The ifx_query() function takes two arguments: the connection
    and the SQL statement you just created.


    ```

    $sql_result = ifx_query($sql,$connection) or die("Couldn''t execute query.");

