  md: '# Chapter 3: Working with Databases


    With this basic understanding of unique fields and the relationships between tables
    in a database, it''s time to learn some of the language of relational databases:
    SQL, or Structured Query Language.


    # Basic SQL


    Although the Structured Query Language (SQL) was developed by IBM, SQL is currently
    under the watchful eye of the American National Standards Institute (ANSI). As
    with all “standards,” there are variations of SQL—proprietary enhancements, if
    you will—for use with Microsoft SQL Server, Oracle databases, and others. However,
    learning the standard set of SQL commands will provide you with a fundamental
    knowledge of SQL that you can use with multiple database systems. Here are the
    commands:


    +   - CREATE. Creates a new table.

    - ALTER. Modifies the definition (structure, data types, and so on) of an existing
    table.

    - DROP. Primarily removes elements such as tables and fields.

    - INSERT. Adds a record to a table.

    - UPDATE. Modifies data in an existing record.

    - SELECT. Performs a query on a table, including mathematical functions, field
    comparison, pattern matching, and so on.

    - DELETE. Permanently removes elements from a table.


    The next several sections contain further descriptions and examples of these basic
    SQL commands. Be sure to read your database documentation thoroughly for the exact
    use of these commands in your own environment, because they might differ slightly
    from these examples, which are geared toward the MySQL user. Additionally, you
    may enter SQL commands directly through a graphical user interface (GUI) or via
    the command line, depending on your database type. The next sections provide only
    examples of the SQL commands themselves; at the end of this chapter, you''ll learn
    to send SQL commands to your database via PHP scripts.


    # CREATE


    The CREATE command creates a table in the selected database. The basic syntax
    is as follows:


    ```

    CREATE TABLE [table name] [(field_name field_data_type,...)] [options]

    ```'
  merge: -1
