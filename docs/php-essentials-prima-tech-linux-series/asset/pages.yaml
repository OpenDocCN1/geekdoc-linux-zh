  md: '# Chapter 5: User Authentication


    ser authentication schemes verify that a user has permission to access certain
    content on a Web site. When initially developing a Web site, you may want to restrict
    access to only certain members of your development team. Or, if your corporate
    Web site contains sensitive financial data, you may want to restrict your financial
    statements to a particular list of investors.


    Web developers usually employ one of the following types of user authentication
    for reasons ranging from ease of installation and ease of maintenance, to how
    the authentication scheme works within their overall application development:


    +   - Basic HTTP. This is the most popular type of authentication. It uses the
    built-in functions of the Web server to limit access to documents and whole directories.
    The popularity of this scheme stems from the fact that any site developer, whether
    he controls his own server or houses his site with an Internet Service Provider,
    has the ability to use Basic HTTP authentication within his document directories.

    - Database-driven. Usernames and passwords are kept in a database table and accessed
    via a script.

    - Limit by IP address. Access is limited to a specific IP or IP range.


    In this section, you''ll learn how to use various forms of user authentication
    in your PHP-enabled Web sites.


    # Basic HTTP Authentication


    HTTP authentication uses a challenge/response scheme to authenticate users. The
    process begins when the user requests a file from a Web server. If the file is
    within a protected area, the server responds with a 401 (Unauthorized Error) and
    the browser displays the familiar username/password dialog box. The user then
    enters a username and password and clicks OK, which sends the information to the
    server for authentication. If the username and password pair is valid, the server
    displays the requested file. Otherwise, the dialog box appears and prompts the
    user to try again.


    To use basic HTTP authentication, you must have available two elements: an authentication-enabled
    Web server and a list of usernames and passwords. However, authentication configuration
    varies among Web servers. Although the Netscape and Microsoft families of Web
    servers have a graphical user interface for creating and administering a username
    and password list, the Apache Web server uses the'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'old school method that requires a user to manually modify the server configuration
    and password files. Because of these differences, be sure to read your Web server
    documentation before diving headfirst into password-protecting your Web site!


    # Configuring HTTP Authentication on Apache


    The first step in configuring basic HTTP authentication is to create the file
    containing usernames and passwords. This file contains a list of all valid users
    for a particular protected area (or realm), along with the matching password for
    each user. You can place this file anywhere on your Web server, preferably in
    a private directory, above the /usr/local/apache/htdocs document root. If your
    password file is kept under the document root (/usr/local/apache/htdocs/), anyone
    with Web access can access your password file via a URL. If your file is called
    passwordfile and it is located in the document root directory, its URL is http://www.yourserver.com/passwordfile.
    This is not a good idea. A good location for a private password file is /usr/local/apache/


    # Creating the Users and Groups Files


    Use the htpasswd program included in the Apache distribution to create the username/password
    file called users with an entry for the user jane, do in the following in the
    /usr/local/apache/ directory:


    +   1. Type htpasswd -c /usr/local/apache/users jane. The -c flag alerts the program
    that the file /usr/local/apache/users must be created.


    +   2. You are prompted to add a password for user jane. Enter the password and
    press Enter.


    +   3. You are prompted to confirm the password. Type the password again, exactly
    as before, and press Enter.


    Open the /usr/local/apache/users file to see the username you just entered, followed
