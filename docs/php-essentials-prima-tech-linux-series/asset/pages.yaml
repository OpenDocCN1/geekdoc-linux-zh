    # Reading Data files


    You can also use PHP to verify that a file has been written to by using the fread()

    function to gather the data into a variable. The fread() function takes two arguments:


    fread([filename], [length]);


    To read the complete file, length can be found using the filesize() function


    fread([filename], filesize([filename]));


    To verify that the file mydata.txt, created in the preceding section, contains
    the

    string "This is a new file.", first create a script called read_data.php containing
    the

    following code:


    ```

    <php

    $file_loc = "/usr/local/apache/htdocs/mydata.txt";

    // this variable contains the full path to the filename

    $whatoread = fopen($file_loc, "r");

    // opens the file for reading only

    $file_contents = fread($whatoread, filesize($file_loc));

    // puts the contents of the entire file into a variable

    close($whatoread);

    // close the file

    echo "The file contains:<br>"$file_contents;

    ?>

    ```'
