  md: '# Comparison Operators


    It should come as no surprise that comparison operators compare two values. A
    value of TRUE or FALSE is returned by the comparison, as shown in Table A.3.


    | Operator | Name | Example | Result (T/F) |

    |---|---|---|--|

    | == | equal to | $a == $b | TRUE if $a is equal to $b |

    | != | not equal to | $a != $b | TRUE if $a is not equal to $b |

    | > | greater than | $a > $b | TRUE if $a is greater than $b |

    | < | less than | $a < $b | TRUE if $a is less than $b |

    | >= | greater than or equal to | $a >= $b | TRUE if $a is greater than or equal
    to $b |

    | <= | less than or equal to | $a <= $b | TRUE if $a is less than or equal to
    $b |


    # Increment/Decrement Operators


    The increment/decrement operators do just what their name implies: add or subtract
    from a variable (see Table A.4).


    | Name | Usage | Result |

    |---|---|--|

    | Pre-increment | ++$a | Increments by 1 and returns $a |

    | Post-increment | $a++ | Returns $a and then increments $a by 1 |

    | Pre-decrement | --a | Increments by 1 and returns $a |

    | Post-decrement | $-- | Returns $a and then increments $a by 1 |


    # Logical Operators


    Logical operators allow your script to determine the status of conditions, and
    in the context of your if_else or while statements, execute certain code based
    on which conditions are true and which are false (see Table A.5).'
