  md: '# Appendix A: Essential PHP Language Reference


    # Variables from HTML Forms


    Depending on the method of your HTML form (GET or POST), the variables will be
    part of the $HTTP_POST_VARS or $HTTP_GET_VARS global associative array. The name
    of the input field will become the name of the variable. For example, the following
    input field produces the variable $first_name:


    ```

    <input type="text" name="first_name" size="20">

    ```


    If the method of this form was POST, this variable could also be referenced as
    $HTTP_POST_VARS["first_name"]. If the method were GET, you could also use $HTTP_GET_VARS["first_name"].


    # Variables from Cookies


    Like from forms, variables from cookies are kept in a global associative array
    called $HTTP_COOKIE_VARS. If you set a cookie called "user" with a value of "Joe
    Smith", like so:


    ```

    SetCookie("user", "Joe Smith", time(3600));

    ```


    a variable called $user will have been placed in $HTTP_COOKIE_VARS, with a value
    of "Joe Smith.\ You can refer to $user or $HTTP_COOKIE_VARS[''user\''] to get
    that value.


    # Environment Variables


    When a Web browser makes a request of a Web server, it sends along with the request
    list of extra variables called environment variables. They can be very useful
    for displaying dynamic content or authorizing users.


    By default, environment variables are available to PHP scripts as $VAR_NAME. However,
    to be absolutely sure that you''re reading the correct value, you can use the
    getenv() function to assign a value to a variable of your choice. Following are
    some common environment variables:


    REMOTE_ADDR gets the IP address of the machine making the request. For example:


    ```

    ?php

    $remote_address = getenv("REMOTE_ADDR");

    echo "Your IP address is $remote_address.";

    ?>

    ```


    HTTP_USER_AGENT gets the browser type, browser version, language encoding, and
    platform. For example:


    ```

    ?php

    $browser_type = getenv("HTTP_USER_AGENT");

    ```'
