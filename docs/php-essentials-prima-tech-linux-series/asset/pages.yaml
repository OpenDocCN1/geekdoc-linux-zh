    # Displaying Browser-Specific Code


    As of this writing, the Browser War still reigns on: no single Web browser is
    used by a majority of Web surfers. Various flavors of Microsoft Internet Explorer
    (MSIE) account for approximately 75 percent of Web browsers in use, while versions
    of Netscape (NS) take up about 24 percent. Throw in the die-hard Lynx, Opera,
    and WebTV users to reach 100 percent.


    Although a 75/25 split might seem like a vast majority, if 150 million people
    have access to the Internet, 25 million non-Microsoft users is a huge number of
    users to consider when developing a good site. There are many nuances to browser-specific
    HTML development, but here are some highlights:


    +   - MSIE 5.0 includes some XML support. NS 4.x does not.

    - MSIE and NS versions 3.x and higher include support for style sheets. Other
    browsers do not.

    - Some versions of NS on UNIX do not include support for style sheets.


    And so. HotWired maintains a browser reference at http://hotwired.lycos.com/webmonkey/reference/browser_chart/


    Using the HTTP_USER_AGENT environment variable, you can discern the specific attributes
    of the browser accessing your page and display code specifically designed for
    that browser type and platform.


    However, having seen some HTTP_USER_AGENT values, you can imagine that there are
    hundreds of slightly different values. It''s time to learn basic pattern matching!


    Create a script called browser_match.php, containing the following code:


    ```

    <?php

    browser_type = getenv("HTTP_USER_AGENT");

    ?>

    ```


    Using the preg_match() PHP function, find a specific block of text within the
    value of HTTP_USER_AGENT. The syntax of preg_match() is


    preg_match("[what you want to find]/", "[where you''re looking]");


    To find "MSIE" somewhere in the HTTP_USER_AGENT value, which you have already
    assigned to the variable $browser_type, use


    (preg_match("/MSIE/i", "$browser_type"));'
