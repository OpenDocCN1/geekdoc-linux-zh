    the script and validating a user within the current browser session, the browser
    will not display the username/password dialog box again, because the browser doesn''t
    know if a different person is sitting in front of the machine or. You must end
    the browser session, restart the browser and access the protected area again,
    in order to validate a different user. An additional problem is that no “global”
    authentication directive exists, such as when you use an .htaccess file in a protected
    directory or create a <Directory>></Directory> block in the Apache configuration
    file. When using PHP-based authentication, the authentication routine must be
    included at the beginning of each file you want to.


