  md: '# Chapter 2: Basic PHP Techniques


    To print a dollar sign, place a backslash (\) before it. Dollar signs must be
    "escaped," or delineated, in this way because dollar signs are also used to indicate
    the presence of a variable. In your script,


    ```

    echo <P>Bags of coffee are \$price.</p>";"

    ```


    to print a dollar sign before the value of $price. The result will look like this:


    Bags of coffee are $10 each.


    Add the escaped dollar sign to other echo statements containing dollar amounts.

    to get the percentage value of $sales_tax, first create a new variable called
    $sales_tax_pct. Then transform the value 0.0825 to 8.25 by multiplying 0.0825
    by 100:


    ```

    $sales_tax_pct = $sales_tax * 100;

    ```


    The variable $sales_tax_pct now contains the value 8.25. Rewrite the echo state-to
    include the new variable and the percent sign:


    ```

    echo <P>Sales tax is $sales_tax_pct% in this location.</p>";"

    ```


    Here''s result:


    Sales tax is 8.25% in this location.


    The final bit of formatting, ensuring that the dollar amount prints to two decimal
    places, involves the use of the sprintf() function. This function takes two arguments:
    the formatting argument and the name of the value to be formatted. The following
    code takes the value of $price, formats it by creating a floating-point number
    with two decimal places, and puts the (10.00) into a new variable called $fmt_price:


    ```

    $fmt_price = sprintf("%0.2f",$price);

    ```


    Repeat this process for the other monetary values in the script: $sub_total and
    $grand_total:


    ```

    $fmt_price = sprintf("%0.2f",$price);

    $fmt_sub_total = sprintf("%0.2f",$sub_total);

    $fmt_sales_tax_amount = sprintf("%0.2f",$sales_tax_amount);

    $fmt_grand_total = sprintf("%0.2f",$grand_total);

    ```


    In your echo statements, replace the old variables with the newly formatted vari-ables.
    Your script should look something like this:


    ```

    <?php

    $price = 10.00;

    $sales_tax = .0825;

    ```'
