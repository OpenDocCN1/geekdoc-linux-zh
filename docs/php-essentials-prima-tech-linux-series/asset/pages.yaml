    the instructions or sample code in this book, and I''ll help you out as much as
    I can.


    Anytime you have a PHP-related question, the path to a solution should be the
    following:


    +   1. Read the PHP FAQ at http://www.php.net/

    2. Reread the PHP FAQ at http://www.php.net/.

    3. Check the mailing list archives. (A list can be found at http://www.php.net/support.php3).

    4. Send a well-phrased question to the very helpful folks on the PHP mailing list.
    Send a quick-e-mail (no HTML formatting!) to php3@php.net. Be sure to include
    as much information, errors, warnings, and so forth as possible.


    While this chapter did not cover the build and configuration of PHP as a server
    module, the installation instructions in the PHP Manual are very easy to follow.


    # Installing a Database


    One of the selling points of PHP is its ability to interface with numerous databases.
    This ability makes PHP a logical choice for generating database-driven dynamic
    content and developing e-commerce applications, project and document management
    applications, and virtually any other application you can imagine that might use
    a database.


    Although the choice of a database is your own personal decision, I use MySQL because
    it is multithreaded, multiplatform, very powerful, and essentially free. Visit
    the MySQL Web site at http://www.mysql.com/ to read more about this database and
    see some benchmark results. If you decide to use another database, the PHP functions
    for database connectivity are located in Chapter 3, “Working with Databases.”
    However, this book''s examples of database usage in the context of application
    development use MySQL as the database.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# # Downloading MySQL


    To download MySQL, go to http://www.mysql.com/ and head to the Downloads section.
    A few words about licensing: MySQL is free for normal usage on-Microsoft platforms.
    If you''re using the Windows version, you can download it for free, but you should
    pay for a $200 license after 30 days. When compared to the less-powerful Microsoft
    SQL Server (around $2,000) and the extremely large and expensive Oracle database,
    MySQL is a steal at $200. Plus, the SQL tutorial included in the MySQL documentation
    is more than worth the licensing fee.


    Licensing requirements tend to change, so always check the MySQL Web site for
    an accurate account of their licensing policies.


    # # Installing and Configuring MySQL for Windows


    To install MySQL for Windows, go to the Downloads area of the MySQL Web site,
    and download the Windows installation file (the one with a *.zip extension).


    Next, unzip the contents into a temporary directory, such as C:\temp.


    Run the setup.exe program from C:\temp by double-clicking the file or by typing
    the location in the Run dialog box. The MySQL installer will place the MySQL files
    into C:\mysql\ by default. To run MySQL, do the following:


    +   1. Open a DOS console and type C:\mysql\bin\

    2. Type mysql to start the MySQL server process in the background.

    3. Type mysqladmin -h to start the administrative interface and display the help
    text. Use the commands listed to create a database and grant yourself a username
    and password.


    If you have any problems during MySQL administration, consult the documentation
    included with your installation.


    # # Installing and Configuring MySQL for UNIX


    To install MySQL on the UNIX platform, go to the Downloads area of the MySQL Web
    site and download the binary distribution specific to your platform.


    Next, place the zipped file in a directory such as /usr/local/. Unzip and unpack
    this file by typing


    ```

    gunzip [filename].tar.gz

    tar - xvf [filename].tar

    ```


    These commands will create a /usr/local/mysql_[version]/ directory structure containing
    the MySQL binaries.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'To run MySQL, do the following:


    +   1. Navigate to the MySQL scripts directory by typing `cd /usr/local/mysql_[version]/scripts/`


    +   2. Type `mysql_install.db` to create an initial database.


    +   3. Type `cd /usr/local/mysql_[version]/bin/`


    +   4. Type `safe_mysql &` to start the MySQL server process.


    +   5. Type `mysqladmin version` to see that MySQL server is indeed running.


    If you have any problems during MySQL administration, consult the documentation
    included with your installation.


    # Using PHP4


    As of this writing, PHP4 is currently in beta for Windows and UNIX platforms.
    You can download and install PHP4 using the source or binary distributions found
    at http://www.php.net/version4/, which also contains PHP4 installation instructions.
    Similar instructions can also be found in the “Tutorials” section at http://www.thickbook.com/.'
  merge: -1
