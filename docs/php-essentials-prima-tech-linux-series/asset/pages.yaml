  md: '# # Downloading and Installing Microsoft IIS


    Microsoft Corporation''s Internet Information Server (IIS) runs on Windows NT
    and is included in NT Service Pack 4. It can also be downloaded for free at http://www.microsoft.com/
    or purchased on CD-ROM for $99. Beware of the download option: IIS is 75MB. That''s
    more than 25 times the size of Apache, and almost 100 times the size of Xitami.


    I don''t recommend using IIS, not only because of the sheer size of the software,
    but also due to the memory requirements and just a personal disdain of the products.
    However, 2.1 million Web sites use IIS or some type of Microsoft Web server, and
    ultimately the choice of Web server is yours. I suggest you read the information
    found at the Microsoft Web site before deciding if IIS is right for you.


    If you choose IIS, the installation is quite simple: run the executable file by
    double-clicking or by typing its location in the Run dialog box under the Start
    menu.


    The Installation Wizard will prompt you to make system-specific selections, such
    as directory locations. Make the selections appropriate to your installation,
    and continue. Restart your machine if necessary. After restarting your machine
    and verifying that IIS is running as an NT service, open your Web browser and
    type http://127.0.0.1.


    You should see a Welcome page, indicating a successful installation. If you do
    not see the Welcome page, or if your installation fails at any point, read the
    IIS documentation to pinpoint your problem, and then try again.


    # # Downloading and Installing WebTen


    WebTen is an Apache-based Web server for the Macintosh (it requires OS 9 or above)
    that is made by Tenon Insystems. Currently it is the only Web server for the Macintosh
    that includes support for PHP.


    You can download and try WebTen free for 14 days, after which time it costs $495.
    I suggest you read the product information found at the WebTen/Tenon Insystems
    Web site (http://www.webten.com/) before deciding if WebTen is right for you.


    After downloading the installation file, double-click the installer application
    file to begin the installation process. Follow the installation steps, which will
    extract and install the WebTen files. After installation is complete, create an
    alias to the WebTen application and place it in the Startup Items folder of your
    System folder. This will ensure that WebTen automatically launches when you start
    your machine.'
