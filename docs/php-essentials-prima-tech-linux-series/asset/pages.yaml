    # Sending E-Mail


    I can''t think of any successful Web site that doesn''t have some sort of feedback
    form or other mechanism for contact. When you see how incredibly easy it is to
    send e mail with PHP, you might scratch your head in amazement and wonder why
    the rest of the world doesn''t do this. That''s a perfectly normal reaction (I
    still feel that way).


    The mail() function takes four arguments: the recipient, the subject, the message,
    and the mail headers. So, if you want to send an e-mail to joe@yourcompany.com
    with a subject of "Check this out!" and a message of "PHP is the best!", your
    entire PHP mail script could look like this:


    ```

    <?php

    mail("joe@yourcompany.com", "Check this out!", "PHP is the best!", "From:\nYou\"
    <you@yourcompany.com>\n");

    ?>

    ```


    The e-mail will arrive in your mailbox like any other mail message:


    Subject: Check this out!

    Date: [date sent]

    From: You <you@yourcompany.com>

    To: joe@yourcompany.com


    PHP is the best!


