  md: 'If you''ve been programming with PHP since the beginning of time, there''s
    probably not much you can get out of this book, except to hint it to your boss
    and say, "Look! Another book on a wonderful language is this. Can we please stop
    using ASP/ Cold Fusion/Java/C++ and migrate to PHP now?" But if you''ve dabbled
    with PHP or never seen a PHP script, this is the book for you. Whether you''re
    a first-time programmer or have a few years of Web application development under
    your belt, you''ll find something useful here. I hope you''ll find a simple "learn-by-example"
    path to developing highly successful Web sites.


    Unlike Web itself, this book is fairly clear. You''ll start by installing the
    software to use PHP, and then you''ll gradually move into "Hello World! scripts
    and eventually create shopping carts and other database-driven applications.


    If you have an account with an Internet Service Provider that has enabled the
    use of PHP for all users on the server, you can skip ahead to Chapter 2. But since
    you can install freely-available Web servers, PHP, and a database or two on your
    machine with a little poking and probing along the way, I recommend doing so.
    It''s a great way to learn the "guts" of what you''re doing (and it looks good
    on a résumé!)


    # For More Stuff


    This book has its own Web site (that, doesn''t it?), at http://www.thickbook.com/.
    At this site you can download all of the code samples in this book, as well as
    all of the samples I didn''t include, as examples geared towards alternative database
    types. You can also use the site to alert me to bugs and other problems you have
    with the examples. Although they have been tested many times, one errant semicolon
    or quotation mark can cause the dreaded error.


    Also, please use the Web site to tell me about examples which I had included.
    I''ll do my best to keep the "Tutorials" section filled with new and exciting
    topics not covered in this book.'
  merge: -1
