    # Counting the Cart Items


    If you plan to show the current user''s shopping cart count on every page, especially
    after he''s just added items, be sure to place the count() query after any code
    that adds to the cart.


    The SQL statement and query functions are pretty straightforward:


    ```

    $item_count = "SELECT SUM(SEL_ITEM_QTY) FROM USER_TRACK WHERE USER_ID = \$user_id";

    $item_result = mysql_query($item_count) or die("Couldn''t count!");

    $item_count_total = mysql_result($item_result,0)->SUM(SEL_ITEM_QTY);

    ```


    Note the use of sum() instead of count(). You could use count(), but what if a
    user has ordered two copies of one book? Instead of showing two items in the cart,
    count() would return 1, since it''s two copies of one item.


    The hardest part is finding a space on your page to show the total number of items
    in the cart, but when you do, you could just say this:


    ```

    <P>Your cart contains

    <php

    if ($item_count_total == "1") (

    necho "1 item.";

    elelse (

    echo "$item_count total items.");

    ```'
