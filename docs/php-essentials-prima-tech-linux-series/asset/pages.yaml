    # Reading and Writing Data Files


    In addition to sending an e-mail full of data, you can create simple PHP scripts
    to

    create, open, and write files on your Web server using the fopen() function.


    # Writing Data Files


    The fopen() function takes two arguments, file name and mode, and returns a file

    pointer. A file pointer provides information about the file and is used as a refer-

    ence. The file name is the full path to the file you want to create or open, and
    mode

    can be any of the following:


    +   - r Opens the existing file in order to read data from it. The file pointer
    is

    placed at the beginning of the file, before any data.

    - r+ Opens the existing file for reading or writing. The file pointer is placed

    at the beginning of the file, before any data.

    - w Opens a file for only writing. If a file with that name does not exist,

    attempts to create a new file. If the file exists, deletes all existing

    contents and places the file pointer at the beginning of the file.

    - w+ Opens a file for reading and writing. If a file with that name does not

    exist, attempts to create a new file. If the file exists, deletes all existing

    contents and places the file pointer at the beginning of the file.

    - a Opens a file for only writing. If a file with that name does not exist,

    tattempts to create a new file. If the file exists, places the file pointer at

    the end of the file, after all other data.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '+   - a+ Opens a file for reading and writing. If a file with that name does
    not exist, attempts to create a new file. If the file does exist, places the file
    pointer at the end of the file, after all other data.


    So, to create a new file in your server document root (for example, /usr/local/apache/htdocs/)
    called mydata.txt, to be used to read and write data, use this code:


    ```

    <?php

    $newfile = fopen("/usr/local/apache/htdocs/mydata.txt", "a+");

    ?>

    ```


    In this example, $newfile is the file pointer. You can refer to this file pointer
    reading, closing, or performing other functions with the file.


    > Remember to read and write from files that are in an area accessible by your
    server process.


    ![](img/f8bb5053a1d20d75df488da4d4dbfceb_86_0.png)


    After you open a file, be sure to close it using the fclose() function:


    ```

    fclose($newfile);

    ```


    But opening a file just to close it again can get boring, so use the fwrite()
    and fputs() function to place data in the open file:


    ```

    fwrite([file], [data]);

    ```


    > For all intents and purposes, fwrite() and fputs() are exactly the same.


    ![](img/f8bb5053a1d20d75df488da4d4dbfceb_86_1.png)


    Create a script called write_data.php, containing the following code:


    ```

    <?php

    $newfile = fopen("/usr/local/apache/htdocs/mydata.txt", "a+");

    fwrite($newfile, "This is a new file.");

    fclose($newfile);

    echo("All done!");

    ?>

    ```


    Be sure to modify the file to match your own environment. Adding the echo statement
    after the file has been opened, written to, and closed will cause the message
    to display after the actions have occurred. If any errors arise, such as problems
    with file permissions, you''ll see those on the screen as well.'
