  md: '# decbin() and bindec()


    decbin() and bindec() functions convert decimal numbers to binary numbers, and
    binary numbers to decimal numbers, respectively. The syntax of these functions
    is


    decbin(number);

    bindec(number);


    For example, the following code takes a decimal number, converts it to binary,
    and converts it back to decimal.


    ```

    <?php

    $orig_dec = 66251125;

    $dec2bin = decbin($orig_dec);

    $bin2dec = bindec($dec2bin);

    ```


    ```

    echo "original decimal number: $orig_dec <br>";

    echo "new binary number: $dec2bin <br>";

    echo "back to decimal: $bin2dec <br>";

    ?>

    ```


    The output of this script is


    +   original decimal number: 66251125

    new binary number: 1111110010111010101101

    back to decimal: 66251125


    # dexch() and hexdec()


    dexch() and hexdec() functions convert decimal numbers to hexadecimal numbers,
    and hexadecimal numbers to decimal numbers, respectively. The syntax of these
    functions is


    dexch(number);

    hexdec(number);


    For example, the following code takes a decimal number, converts it to hexadecimal,
    and converts it back to decimal.


    ```

    <?php

    $orig_dec = 255;

    ```


    ```

    $dec2hex = dexch($orig_dec);

    ```'
