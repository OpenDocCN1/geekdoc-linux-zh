  md: '# Unleash the power of PHP!


    Whether you''re a first-time programmer or have been developing Web applications
    for years, this straightforward guide will open your eyes to the power of PHP.
    Using a learning-by-example approach to programming, PHP Essentials takes you
    from "Hello World" scripts to database-driven applications and e-commerce solutions.
    PHP is used by more than one million servers, and its popularity is growing rapidly.
    You will find this book an invaluable tool for creating dynamic Web pages using
    PHP.


    Julie C. Meloni is the Technical Director for i2i Interactive, a multimedia company
    located in Campbell, CA. She''s been developing Web-based applications since the
    early days of the Web and wholeheartedly believes that Linux is the OS of the
    present, not the future.


    # Learn Faster


    +   * Includes an appendix of essential language structures and functions, with
    examples.


    +   * Takes a linear approach to development that ensures you have a strong foundation
    when learning new tasks.


    +   * Spend more time writing scripts, and less time retyping them—find the scripts
    in the book at www.thickbook.com/.


    # Learn More


    +   * Control your Web server with basic instructions for installation of a Web
    server and PHP.


    +   * Create database-driven applications, using virtually any database type you
    have at your disposal.


    +   * Discover how easily PHP can make e-commerce a reality for you.


    +   * See examples of the new features in PHP⁴, including native session support!


