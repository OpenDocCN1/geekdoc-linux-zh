    # Tracking Your Users'' Shopping Carts


    To keep track of your users'' shopping carts, first create a database table called
    something like USER_TRACK. Use the same table-creation form used to create the
    MASTER_PRODUCTS table earlier in this chapter. Create a seven-field table with
    the following field attributes:


    +   - USER_ID varchar (100). Used to associate the entry with a user; user_id
    is kept in a cookie.

    - SEL_ITEM varchar (25). The ISBN of the book added to the cart.

    - SEL_ITEM_TITLE varchar (100). The title of the book added to the cart.

    - SEL_ITEM_QTY int. The quantity the user wants to purchase.'
