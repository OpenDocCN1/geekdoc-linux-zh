    can use the three-step process in that section to create the MASTER_PRODUCTS table
    for XYZ Company. Start by loading the HTML form in show_createtable1.html, and
    use it to create a nine-field table called MASTER_PRODUCTS, as shown in Figure
    7.1.


    After submitting the form, you''ll see nine rows containing empty form fields.
