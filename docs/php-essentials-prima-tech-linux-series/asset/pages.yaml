  md: 'The previous chapter showed you how to build the product catalog of data store.
    In this chapter, you''ll finish putting together the pieces, and by the time you''re
    through, you will have created a fully-functioning online store.


    # Data Encryption, or Safe and Secure Shopping


    It would be a very bad idea to develop an insecure shopping mechanism. No matter
    large or small your site might be, if it''s insecure, it''s open season for crackers.
    The legal liability aspects differ from country to country, but without a doubt,
    the bulk of the responsibility lies with you, the site designer, to develop a
    safe and secure application. Unless you are doing real-time credit card processing
    and never store credit card data on your system, you utilize some sort of data
    encryption so that sensitive information safely finds its way to the recipient.


    The majority of small-to-midsize e-commerce applications do not utilize realtime
    payment processing. Usually, the customer completes an order form on a secure
    server and an encrypted e-mail is sent to a designated customer service representative.
    The representative uses software to decrypt the e-mail message, from point handling
    the order based on the company''s internal processes. Usually, the customer''s
    credit card is charged and the customer is notified via e-mail that the order
    was placed, when it will be shipped, and so forth.


    This type of e-commerce solution is not difficult to implement. Besides purchasing
    an SSL (secure socket layer) certificate for your server, which encrypts data
    between a Web browser and your server, you are left with only the problem of encrypting
    the e-mail that is sent to the customer service representative. As you learn in
    the next sections, two common types of encryption software are available, both
    of which work perfectly well in a PHP-based e-commerce application.


    # A Brief Glance at Data Encryption


    Author Neal Stephenson wrote an amazing novel called Cryptonomicon, which manages
    to tell a good story while giving an incredible amount of insight into modern
    cryptography. The book is over 900 pages long, so you can see I''m not kidding
    when I say this section is a brief glance at data encryption.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Data Encryption, or Safe and Secure Shopping


    For the purpose of understanding how easily you can encrypt and decrypt data (files,
    e-mail, and so on), I''ll tell you about public-key cryptography. Feel free to
    visit Web sites to learn about other cryptosystems and determine if other methods
    will be of use. A good place to start is the RSA Labs Crypto FAQ found at http://www.rsasecurity.com/rsalabs/fq/


    When using public-key cryptography, you have a pair of keys: public and private.
    As their names suggest, the private key is kept, and the public key is distributed
    to other users. The public and private keys of a particular user are linked via
    complex mathematical structures in a way that is beyond my comprehension but is
    crucial to establishing the key relationship. The public key is used as the basis
    for encrypting a message, and the private key is necessary for the recipient to
    decrypt the encrypted message.


    For example, suppose that Joe has a pair of keys. Jane User also has a pair of
    keys. Joe and Jane want to send encrypted messages to each other, so they exchange
    public keys. Keys are kept on key rings—one for private keys and one for public
    keys—which are essentially files containing key information, just like a real
    key ring is an object that holds your car, house, and other keys together. On
    Joe''s public ring, he has Jane''s public key. On Jane''s public ring, she has
    Joe''s public key. Both Joe and Jane also have private keys that hold only their
    own private keys.


    When Joe wants to send an encrypted message to Jane, he uses his encryption software
    to scramble the message on Jane''s public key. Jane receives the message and uses
    her encryption software to decrypt the message with her secret decoder ring—I
    mean, her private key. Only Jane can decrypt a message that has been encrypted
    using her public key.


    In the early 1990s, Phil Zimmermann developed PGP, or Pretty Good Privacy, which
    quickly became a very popular piece of software for e-mail and file encryption.
    However, due to United export regulations and the import regulations of other
    countries with regards to encryption algorithms, the OpenPGP standard was developed,
    and the GNUPG software was built around it. Unlike PGP software, GNUPG does not
    use patented or restricted encryption algorithms, so it has become a popular alternative
    to PGP.


    Although U.S. export laws were recently modified, both PGP and GNUPG will likely
    continue to coexist in the developer community. After determining which encryption
    software you want to use, follow the steps outlined in either of the following
    sections to learn how to encrypt and send e-mail to specific recipients.'
  merge: -1
