- img_proc: true
  md: 'Forms begin with an opening <FORM> tag and end with the closing </FORM> tag.
    The form''s method and action are defined in the opening <FORM> tag, like this:


    ```

    <FORM METHOD="POST" ACTION="go.php">

    ```


    Two methods exist for sending forms:


    +   - GET The default method. Sends input to a script via a URL. The GET method
    has a limit to the amount of data that can be sent, if you plan to send a large
    amount, use POST.

    - POST Sends input in the body of the submission, allowing for larger form submissions.


    The action is the name of the script receiving the input.


    After defining the method and action, you need a way to get data to your script:
    input elements

    There are three input element tags<INPUT>, <TEXTAREA>, and <SELECT>—and there
    are several types within those elements. Here are the common types:


    +   - Text fields. An input field with a size indicated in the SIZE attribute
    and a maximum length indicated in the MAXLENGTH attribute. Here''s a 20-character
    text field named "Field1" with a character limit of 50 characters:

    - Password fields. Similar to text fields, except each typed character is displayed
    as an asterisk (*). Here''s an example of a 20-character password field named
    "Pass1" with a character limit of 50 characters:

    - Radio buttons. A radio button exists in each group. Each member of the group
    has the same name but different values. Only one of the group can be checked—for
    example, a button with the value "yes" or a button with the value "no". Additionally,
    you can specify which of the values is checked by default. Here''s an example
    of a radio button group named "like_coffee", with "yes" and "no" as available
    answers:

    - Checkboxes. Like radio buttons, checkboxes exist in each group. Each member
    of the group has the same name but different values. However, multiple checkboxes
    in each group can be selected. Additionally, you can specify that


    ```

    <input type="text" name="Field1" size=20 maxlength=50>

    ```


    ```

    <input type="password" name="Pass1" size=20 maxlength=50>

    ```


    ```

    <input type="radio" name="like_coffee" value="yes" checked> yes

    <input type="radio" name="like_coffee" value="no"> no

    ```


    If "yes" stays selected, the script will receive like_coffee-yes.'
