  md: '# Arrays


    In the following example, $fave_colors is an array that contains strings represent-
    array elements. In this case, the array elements (0 to 3) are names of colors.


    ```

    $fave_colors[0] = "red";

    $fave_colors[1] = "blue";

    $fave_colors[2] = "black";

    $fave_colors[3] = "white";

    ```


    Array elements are counted with 0 as the first position.


    # Floats


    Each of the following variables is a float


    ```

    $a = 15;

    $b = -521;

    ```


    # Strings


    A series of characters grouped within double quotes is considered a string.


    ```

    $a = "I am a string.";

    $b = "<p>This book is <strong>cool</strong></p>";

    ```


    You can also reference other variables within your string, which will be replaced
    when your script is executed. For example:


    ```

    $num = 57; // an integer

    $my_string = "I read this book $num times!"; // a string

    ```


    When you run the script, $my_string will become “I read this book 57 times!",'
