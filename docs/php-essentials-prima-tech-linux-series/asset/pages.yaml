  md: '9. Manually issue the command to encrypt the test file: pgpe -r [keyname] -o
    [output file] -a [input file]


    10. When prompted to trust the key file, answer Y.


    11. The output file will contain the encrypted version of the text in the input
    file.


    If you''ve made it through these steps, you''re ready to encrypt data with PGP,
    using your PHP scripts to issue the commands. If you''re stuck on any of these
    steps, or if you don''t have access to the PHP user''s key ring, contact your
