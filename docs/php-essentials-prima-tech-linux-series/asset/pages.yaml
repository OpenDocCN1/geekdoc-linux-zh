    Make the following changes to the php3.ini file:


    +   1. Verify the value of extension_install_dir to the directory you created
    when you extracted the files, such as C:\PHP3\.

    2. Change the value of extension_dir to point to the installation directory, or
    anywhere else you might have placed the *.dll files beginning with php3.

    3. Change the value of doc_root to point to the document root of your web server,
    such as C:\apache\htdocs or C:\wwwroot\.

    4. Select the PHP modules you''d like to have loaded when PHP runs, such as database
    connectivity or encryption modules. For each module you want to use, uncomment
    its line (remove the preceding ;) in the php3.ini file.


    # Configuring Apache to Use PHP


    Apache requires that you edit the httpd.conf file, located in your Apache configuration
    (conf) directory. The goal of the configuration is to tell Apache what to do with
    files ending with .php3, .phtml, .php, or anything else you use to indicate a
    PHP file. You''ll be telling Apache to execute an application in order to do something
    with these files—in this case, to run the php.exe program to parse the PHP code.


    Add the following lines to the file:


    ```

    ScriptAlias /php3/ "c:/path-to-php-dir/"

    Type application/x-httpd-php3 .php3 .phtml

    Action application/x-httpd-php3 /php3/php.exe

    ```


    In the ScriptAlias line, use "C:/PHP3/*" if that is the location of your PHP directory.'
