    # Date and Time Functions


    The basic PHP date and time functions let you easily format timestamps for use
    in database queries and calendar functions, as well as simply printing the date
    on order form receipt.


    # date()


    The date() function returns the current server timestamp, formatted according
    to a given set of parameters. Here is the syntax of the date() function:


    date(format, [timestamp]);


    If the timestamp parameter is not provided, the current timestamp is assumed.
    Table A.6 shows the available formats.'
