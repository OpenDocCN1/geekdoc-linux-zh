- img_proc: true
  md: 'Some common data types are int, double, varchar, date, time, datetime, text,
    and blob. Refer to your database documentation for a list of supported data types
    and any size and data restrictions.


    To create the FRIEND_INFO table used at the beginning of this chapter, the SQL
    statement would be something like this:


    ```

    CREATE TABLE FRIEND_INFO (

    FRIEND_ID char(5) not null,

    FULL_NAME varchar(100),

    BIRTH_DATE date,

    FAVE_COLOR varchar(25),

    UNIQUE_FRIEND_ID (FRIEND_ID)

    );

    ```


    This sample code uses a lot of white space. Space is irrelevant in SQL statements,
    but it certainly makes your code easier to read (and easier to edit later!). The
    preceding statement could just as easily have been written like this:


    ```

    CREATE TABLE FRIEND_INFO (FRIEND_ID char(5) not null, FULL_NAME varchar(100),

    BIRTH_DATE, FAVE_COLOR varchar(25), UNIQUE_FRIEND_ID (FRIEND_ID));

    ```


    The CREATE command defines the attributes of the fields in your table; it gives
    each a type and a length. In this example, the FRIEND_ID field is defined as "not
    null," meaning when a record is added, if the field is empty, it is simply empty,
    or has a default value as "0" for numeric fields. A value of NULL means something
    entirely different from "empty," and is an important distinction to remember.
    FRIEND_ID is also identified as unique, by adding UNIQUE_FRIEND_ID (FRIEND_ID)
    to the SQL statement, meaning that FRIEND_ID always holds unique data: Although
    there may be multiple entries for Joe Smith, there will be only one FRIEND_ID
    of 1, 2, and so on.


    # ALTER


    The ALTER command gives you the opportunity to modify elements of a particular
    table. For instance, you can use ALTER to add fields or change field types. If
    you want to change the size of the FULL_NAME field of the FRIEND_INFO table from
    100 to 150, you could issue this statement:


    ```

    ALTER TABLE FRIEND_INFO

    CHANGE FULL_NAME

    FULL_NAME VARCHAR(150);

    ```'
