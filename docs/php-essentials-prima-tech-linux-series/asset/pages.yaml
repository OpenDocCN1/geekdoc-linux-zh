    # each() and list()


    The each() and list() functions usually appear together, in the context of stepping
    through an array and returning its keys and values. Here is the syntax for these:


    ```

    each($arrayname);

    list($val1, $val2, $val3);

    ```


    For example, when you submit an HTML form via the GET method, each key/value pair
    is placed in the global variable $_HTTP_GET_V. If your input fields are named
    first_name and last_name and the user enters values of Joe and Smith, the key/value
    pairs are first_name/Joe and last_name/Smith. In the $_HTTP_GET_V array, these
    variables are represented as the following:


    ```

    $_HTTP_GET_V[''first_name''] // value is "Joe"

    $_HTTP_GET_V[''last_name''] // value is "Smith"

    ```


    You can use the each() and list() functions to step through the array in this
    fashion, printing the key and value for each element in the array:


    ```

    while (list($key, $val) = each($_HTTP_GET_VARS)) {

    echo "\$key has a value of \$$val<br>";

    }

    ```


    Continuing the example, this would produce the following results:


    +   - first_name has a value of Joe.

    - last_name has a value of Smith.


    # reset()


    The reset() function rewinds the pointer to the beginning of the array. The syntax
    of the reset() function is:


    ```

    reset($array_name);

    ```


    # shuffle()


    The shuffle() function will randomize the elements of a given array. The syntax
    of the shuffle() function is:


    ```

    shuffle($array_name);

    ```'
