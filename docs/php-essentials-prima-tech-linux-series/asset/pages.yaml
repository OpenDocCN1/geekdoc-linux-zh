  md: 'In terms of time, a session is the amount of time during which a user visits
    a site. In the programming world, a session is kind like a big blob that holds
    all sorts of variables and values. This blob of stuff, also known as a session
    object, has an identification string. This identification string, such as 940f8b05a40d5119c030c9c7745aad9,
    is automatically sent to the user when a session is initiated, by a cookie called
    PHESSID. On the server side, a matching temporary file is created with the name-940f8b05a40d5119c030c9c7745aad9.


    # Understanding Session Variables


    Each session object variables are registered with it, such as count or valid.
    Inside the session file on the server, the registered variables and their values
    are kept safe and sound. Since these values and variables are not kept in a database,
    no additional system resources are required to connect to and extract information
    from database tables.


    For example, the session file might look like this:


    ```

    count|s:7:"76"

    valid|s:7:"yes"

    ```


    where count and valid are the names of the registered variables and "76" and "yes"
    are their respective values.


    When you register a session variable, you eliminate the need to send additional
    cookies to the user. To assign values for count and valid to a user without using
    sessions, you''ve have to send two separate cookies, like so:


    ```

    setcookie("count","1",time()+14400,"//","yourdomain.com",0);

    setcookie("valid","yes",time()+14400,"/","yourdomain.com",0);

    ```


    To access session variables, just call the variable name, such as $count or $valid.
    PHP will perform a magic trick when you say something like this:


    ```

    echo "<$count</p>";"

    ```


    The PHP engine takes the value of $PHPESSID (the unique user session ID, stored
    in a cookie), matches it to a temporary session file, looks for count, finds its
    value (say, "76"), and returns it to you:


    ```

    <p>76</p>

    ```


    The only cookie that is sent to the user is the cookie that holds the value of
    $PHPESSID.


    ![](img/f8bb5053a1d20d75df488da4d4dbfceb_176_0.png)


    If the question is

    "How do I maintain

    user-specific

    information with-

    outout setting

    multiple cookies

    and making

    umerous calls to

    a database?"

    ner is to use

    the session

    management

    functions in PHP4.'
