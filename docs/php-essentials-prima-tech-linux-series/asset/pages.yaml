  md: 'Now visualize these fields horizontally, where they become the labels for columns
    in a table:


    | FULL_NAME | BIRTH_DATE | FAVOR_COLOR |


    To create the first record (row) in this table, enter Joe Smith''s information.
    Your table then looks like this:


    | FULL_NAME | BIRTH_DATE | FAVE_COLOR |

    | Joe Smith | 1970-10-03 | blue |


    Add additional records to your table by adding more friends:


    | FULL_NAME | BIRTH_DATE | FAVE_COLOR |

    | Joe Smith | 1970-10-03 | blue |

    | Mary Smith | 1962-07-25 | red |

    | Jane Smith | 1968-04-28 | black |


    Give your table a name, such as FRIEND_INFO, and that''s all there is to it. Tables,
    records, and fields are the basic elements of a database.


    # The Importance of Unique Identifiers


    The FRIEND_INFO table from the preceding section is missing something: a unique
    identifier. You might think that the FULL_NAME field is the unique identifier.
    If so, you better not have additional friends named Joe Smith, Mary Smith, or
    Jane Smith. If FULL_NAME is the unique identifier, no one with those exact names
    can be included in your FRIEND_INFO table.


    Instead, how about a simple FRIEND_ID field? If you have two friends named Joe
    Smith, this ensures you''ll know their favorite color when it''s time to get them
    a birthday present.


    Add the FRIEND_ID field to your FRIEND_INFO table:'
