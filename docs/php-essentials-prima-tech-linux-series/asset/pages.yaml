    # Adding table MASTER_PRODUCTS


    MASTER_PRODUCTS has been created!


    Figure 7.3 Successful table creation!


    If you don''t insert a field length for the PAGE_NUM and PRICE fields, MySQL will
    use the default values for the field type. The default field length for an int
    field is (11), while a float field defaults to (10,2), or the ability to hold
    numbers such as 0000000000.00.


    In the next sections, you''ll create sequences of HTML forms and PHP scripts to
    add, modify, and delete records in your MASTER_PRODUCTS table.


    # Developing an Administration Menu


    Somewhere on the Web site for XYZ Company, you''ll want to have a special series
    of “admin” pages, which only you (or whoever has the correct password) can access
    to make changes to the product catalog. The main elements of the administration
    menu are as follows:


    +   - Add a New Product

    - Modify an Existing Product

    - Delete an Existing Product


    We''ll use a PHP-based authentication scheme, which you learned about in Chapter
    5, “User Authentication.” If you are using the CGI version of PHP, you must substitute
    this authentication scheme with another type from Chapter 5, such as .htaccess-based
    authentication.'
