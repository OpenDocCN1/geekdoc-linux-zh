  md: '# Establishing a Database Connection with PHP


    +   1. Connect to a server

    2. Select a database

    3. Query

    4. View results


    The code samples provided in the next sections are not the only ways to make a
    simple connection and print results. Some of the examples are more verbose than
    they really need to be, but they give you a solid foundation for understanding
    the steps that follow. When you become an expert with your database type, you
    can find your own ways to optimize your query, eliminating extra steps and some
    processing time and resource overhead.


    # Connecting to Informix Databases


    There are more than 35 different PHP functions for Informix connectivity, documented
    in detail in the PHP Manual. However, you only need a few of these functions in
    order to make a simple connection and select some data:


    +   * ifx_connect() Opens a connection to the Informix server. Requires a database
    name, username, and password.

    * ifx_query() Issues the SQL statement.

    * ifx_html_result() Places the results of your SQL statement into a nicely-formatted
    TABLE.

    * ifx_free_result() Frees the resources in by the current connection.

    * ifx_close() Closes the current connection.


    First, you must know the name of your database and the name of the server on which
    it resides. You must also have a valid username and password for that database.
    In this example, the database name is secretDB on localhost, your username is
    sandman, and your password is 34Nhjp. Start your PHP code by creating a connection
    variable:


    ```

    $connection = ifx_connect("secretDB@localhost", "sandman", "34Nhjp")

    or or die("Couldn''t connect to the database.")

    ```


    The die() function is used to print an error message and exit a script when the
    function cannot perform as. In this case, die() would execute if the connection
    failed. The error message would be printed so you know where the error occurred
    ("Couldn''t connect to the database."), and no further actions would take place.
    Using die() properly will alleviate many headaches as you attempt to debug your
    code.'
