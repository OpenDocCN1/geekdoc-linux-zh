  md: 'Here''s the syntax of the setcookie() function in PHP:

    setcookie("name", "value", "expiration", "path", "domain", "security");


    +   - Name. The name parameter holds the name of the variable which will be kept
    in the globalsHTTP_COOKIE_vars and will be accessible in subsequent scripts.

    - Value. The value parameter is the value of the variable passed in the name parameter.

    - Expiration. The expiration parameter sets a specific time at which the cookie
    will no longer be accessible. Cookies without a specific expiration time will
    expire with the current user session (when the browser closes).

    - Path. The path parameter determines for which directories the cookie is valid.
    If a single slash is in the path parameter, the cookie is valid for all files
    and directories on the Web server. If a specific directory is named, this cookie
    is only valid for pages within that directory.

    - Domain. Cookies are only valid for the host and domain that set them, and if
    no domain is specified then the default value is the host name of the server that
    generated the cookie. The domain parameter must have at least 2 periods in the
    string to order to be valid.

    - Security. If the security parameter is 1, then the cookie will only be transmitted
    via HTTPS.


    In our cookie example, we are calling the cookie "id" and assigning to it the
    value $randval. This particular cookie will expire in four hours (the current
    time 14,400 seconds). The cookie is valid for any page below the document root
    in the domain mycoffeeshop.com.


    To ensure that your cookie can be set and accepted by a wide variety of browsers,
    we use some sort of value for each part of the cookie. Don''t skip the expiration
    or the path and hope it works out. You know the minute you skip something "optional,"
    the one browser it won''t work with will belong to the user who wants to buy $10,000
    worth of stuff from your fledgling e-commerce site. A good place to learn about
    the ins and outs of cookies is Netscape''s preliminary cookie specification page,
    at http://www.netscape.com/newsref/std/cookie_spec.html.


    # Reading Cookies


    Now you have a cookie called "id," accessible from every page in the mycoffeeshop.com
    domain. To use that value in subsequent pages, you can get it'
