    When accessed, the script displays this:


    +   - I am using the first tag pair type.

    - I am using the second tag pair type.

    - I am using the third tag pair type.


    When you create PHP scripts, you''re creating a series of instructions that are
    sent to the PHP engine. Each instruction must end with a semicolon (;), also known
    as an instruction separator.


    These are examples of properly terminated instructions:


    ```

    <php

    echo "<P>Hello World! I''m using PHP!</P>\n"

    echo "<P>This is another message.</</P>"

    ?>

    ```


    One of these instructions is missing a semicolon:


    ```

    <php

    echo "<P>Hello World! I''m using PHP!</p>\n"

    echo "<P>This is another message.</</p>"

    ?>

    ```


    so it will produce a nasty error, such as this:

    Parse error: parse error, expecting "*" or ":" in /path/to/script on line 9


    The last important bit of PHP syntax is the method of commenting inside code.
    Use double forward slashes (// to indicate a comment:


    ```

    <php

    // The next statement prints a line of text

    echo "<P>Hello World! I''m using PHP!</P>\n"

    ?>

    ```


    The comment "The next statement prints a line of text" is visible in your source
    code but is not printed in your HTML output.'
