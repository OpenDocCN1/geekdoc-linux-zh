- img_proc: true
  md: 'can''t think of a time when I wouldn''t want to use some sort of database in
    a Web application, be it a simple flat-file operational database or a complex
    relational database. Whether saving form data, tracking inventory, or creating
    dynamic content, if you can grasp basic database concepts, you can begin to create
    simple database-driven Web applications. With the advent of open source, fully-functional
    relational databases, these types of applications are no longer only for those
    with enough money to play the game.


    In this chapter, you''ll learn some rudimentary database theory, basic SQL statements,
    and how to use PHP to connect and retrieve information stored in database tables.
    Although PHP supports numerous database types as well as generic ODBC connections,
    the in-depth examples used throughout this book are based on the MySQL database
    functions. If you are not using MySQL, refer to the PHP Manual online at http://www.php.net/
    to find the functions for your particular database type.


    # Basic Database Theory


    Before I lead you far down the path of database development, you should become
    familiar with the basic structure of a database. Here''s a listing from the largest
    element to the smallest.


    +   1. A database is a collection of tables.

    2. A table contains a set of records.

    3. All records have the same number of fields.

    4. Each field categorizes a piece of data.


    Starting with the smallest element, suppose you have a few uncategorized, seemingly
    random pieces of data: Joe Smith, 1970-10-03, and blue. These pieces of data can
    be placed into categories such as Full Name, Birthday, and Favorite Color. Give
    these fields some database-friendly names, as:


    +   * FULL_NAME

    * BIRTH_DATE

    * FAVE_COLOR'
