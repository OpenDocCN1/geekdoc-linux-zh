    # HTTP Functions


    The built-in functions for sending specific HTTP headers and cookie data are crucial
    aspects of developing large Web-based applications in PHP. Luckily, the syntax
    for these functions is quite easy to understand and implement.


    # header()


    The header() function outputs an HTTP header string, such as a location redirect.
    This output must occur before any other data is sent to the browser, including
    HTML tags.


    > This information bears repeating over and over again: Do not attempt to send
    information of any sort to the browser before sending a header(). You can perform
    any sort of database manipulations or other calculations before the header(),
    but just cannot print anything to the screen, not even a new line character.


    ![](img/f8bb5053a1d20d75df488da4d4dbfceb_350_0.png)


    For example, to use the header() function to redirect a user to a new location,
    use this code:


    ```

    header("Location: http://www.newlocation.com");

    exit; // Follow a header statement with the exit command.

    // This ensures that the code does not continue to execute.

    ```


    # setcookie()


    The setcookie() function sends a cookie to the user. Cookies must be sent before
    any other header information is sent to the Web browser. The syntax for setcookie()
    is


    ```

    setcookie("name", "value", "expire", "path", "domain", "secure");

    ```'
