    After you click on the Create Table button, the table will be created in your
    database, and a confirmation screen will appear (see Figure 7.3).


    For your reference, here is the SQL statement created by the PHP script:


    ```

    CREATE TABLE MASTER_PRODUCTS (

    ISBN varchar(25),

    TITLE varchar(150),

    AUTHOR varchar(75),

    PUBLISHER varchar(75),

    CATEGORY varchar(50),

    TYPE varchar(25),

    INFO_BLURB text,

    PAGE_NUM int(5),

    PRICE float

    );

    ```'
