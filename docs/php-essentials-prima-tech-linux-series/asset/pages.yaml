    or die("Couldn''t connect to the database.");


    // create SQL statement

    $sql = "SELECT FULL_NAME, BIRTH_DATE, FAVE_COLOR

    FROM FRIEND_INFO

    ORDER BY BIRTH_DATE ASC";


    // execute SQL query and get result

    ```'
