  md: '# Using PGP


    If you decide to use the PGP family of software, there are two parts to the puzzle:
    PGP on your Web server (to encrypt) and PGP on the recipient''s machine (to decrypt).
    The best place to start is http://www.pgp.com, where you can follow the links
    to download for free or purchase the pieces of the PGP puzzle. If you''re using
    PGP for noncommutative purposes, it''s free. If you''re using PGP for commercial
    purposes, you must pay for it.


    Most ISPs have PGP installed on their Web servers, and you may very well have
    access to it for the encryption side of the equation. Be sure to check with your
    system administrator about the availability of PGP and how to add keys to the
    PHP user''s key ring if you do not direct control over the server.


    The next sections assume that you have followed the installation and key-creation
    procedures outlined in the PGP documentation, and that you have created a valid
    public key for the person who is to receive the encrypted data.


    # Adding a Public Key to the Key Ring


    After PGP has been installed on the server and on the recipient''s machine, and
    the necessary key for the recipient has been created, recipient''s public key
    must be added to the PHP user''s public key ring. If PHP runs as "www" on your
    Web server, that''s the user whose key ring must contain the recipient''s public
    key. The following steps add a public key to a user''s key ring:


    +   1. Export an ASCII version of a user''s public key, following the steps in
    the PGP documentation.


    +   2. Upload the public key text file to the PHP user''s directory on the server
    (/home/www/, for example).


    +   3. Log in to your Web server via telnet or SSH, or walk over to it and type
    at the keyboard if you are so lucky.


    +   4. Become the PHP user. This might involve the su command, such as su www
    -s /path/to/keyfile


    You will see a confirmation that the key was added to your key ring. At this point,
    you can delete the text file containing the public key.


    +   5. Assign a trust level to the key: pgp -e [keyname]


    +   6. Select always trust.


    +   7. Test this process by creating an input file containing something important,
    such as the line "I want to test this encryption sequence."'
