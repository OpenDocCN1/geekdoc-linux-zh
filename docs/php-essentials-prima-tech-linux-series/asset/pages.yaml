  md: "Reload the page a number of times, and watch the value of $count increment\
    \ by 1 each time.\n\n# Managing User Preferences with Sessions\n\nMoving beyond\
    \ the simple access counter, you can use sessions to manage your users' preferences\
    \ when they visit your site. For example, you can have your users select a background\
    \ color, text color, and their favorite font for displaying site content. In this\
    \ three-step example, you will start a session, ask a user for his display preferences,\
    \ display these preferences on subsequent pages, and allow the user to change\
    \ his mind and reset the values.\n\nFor the first step, create a file called session1.php.\
    \ In this step, start the session if it doesn't exist and register the variables\
    \ we'll use later: $body_color, $text_color, and $font_family:\n\n```\nphp\n//\
    \ File name: session1.php\n// if a session does not yet exist for this user, start\
    \ one\nsession_start();\nif (!$PHPPSESSID) {\n    session_register('body_color');\n\
    \    session_register('text_color');\n    session_register('font_family');\n}\
    \ else if (($body_color) || (!$text_color) || (!$font_family)) {\n    session_register('body_color');\n\
    \    session_register('text_color');\n    session_register('font_family');\n}\n\
    ?>\n```\n\nIn this example, the if-else-if loop is important. This loop registers\
    \ the session variables only if a value for $PHPPSESSID does not exist, or if\
    \ the $body_color, $text_color, and $font_family variables have not been created\
    \ or registered with a session. Since the user will come back to this session\
    \ to reset his display preferences, we have to take into account the fact that\
    \ the values of the variables must always be extracted from the session itself.\
    \ If we just said:\n\n```\nsession_start();\nsession_register('body_color');\n\
    session_register('text_color');\nsession_register(font_family);\n```"
