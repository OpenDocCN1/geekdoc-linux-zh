  md: '# Chapter 2: Basic PHP Techniques


    location. Many types of HTTP headers exist, from those indicating the character
    encoding and expiration date of the document to those that send the 404 - File
    Not Found error message. If you would like to learn more than anyone should know
    about headers, feel free to read the current HTTP 1.1 specification at http://www.w3.org/Protocols/rfc2068/rfc2068.


    The format for sending an HTTP header from a PHP script is


    ```

    header(string);

