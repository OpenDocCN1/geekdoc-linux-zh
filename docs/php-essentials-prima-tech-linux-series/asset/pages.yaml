  md: '# Chapter 3: Working with Databases


    If you make it through the connection, the next step is to create the SQL statement.
    Suppose that the FRIEND_INFO table, used in previous examples, exists in your
    Informix database. You want to view your friends'' names, birthdays, and favorite
    colors, ordered from oldest to youngest friend. Create a variable that holds your
    SQL statement:


    ```

    $sql = *SELECT FULL_NAME, BIRTH_DATE, FAVE_COLOR

    FROM FRIEND_INFO

    ORDER BY BIRTH_DATE ASC;

