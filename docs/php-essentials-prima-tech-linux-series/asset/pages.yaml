    # Making ODBC Connections


    If your development environment does not include one of the specific databases
    mentioned in this chapter, no fear! PHP includes functions for Database Connectivity
    (ODBC), which is useful if, for example, you want to connect to a Microsoft Access
    datasource on Windows NT.


    An increasing number of PHP developers are using the ODBC functions to connect
    to databases; that the ODBC functions are numerous and well-documented in the
    PHP Manual. However, you need only a few of these functions to make a simple connection
    and select some data:


    +   - odbc_connect() Opens a connection to an ODBC datasource. Requires the datasource
    name, username, and password.

    - odbc_prepare() Readies the SQL statement for execution.

    - odbc_execute() Executes the SQL statement.

    - odbc_result_all() Places the results of your SQL statement into a nicely-formatted
    HTML table.

    - odbc_free_result() Frees the resources in use by the current connection.

    - odbc_close() Closes the current connection.


    First, you must know the name of the datasource to which you want to connect,
    as well as a valid username and password. In this example, the database name is
    secretDB'
