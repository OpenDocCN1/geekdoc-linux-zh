  md: '# isset() and unset()


    The isset() function determines whether a variable exists. The unset() function
    explicitly destroys the named variable. Here is the syntax of each:


    ```

    isset($var);

    unset($var);

    ```


    The isset() function returns TRUE if the variable exists and FALSE if it does
    not. For example, if you have a variable called $foo, with a value of "bar", the
    following returns TRUE:


    ```

    $foo = "bar"

    echo isset($foo);

    ```


    Now, if you use the unset() function on $foo, like this:


    ```

    unset($foo);

    ```


    The value of isset($foo) will now be false:


    ```

    echo isset($foo); // FALSE!

    ```'
