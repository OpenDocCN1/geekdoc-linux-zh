  md: '# Question 8


    The MBR is located at:


    # Possible choices:


    +   - cylinder 0, head 0, sector 0

    - cylinder 0, head 1, sector 0

    - cylinder 0, head 0, sector 1

    - cylinder 1, head 0, sector 0

    - None of the choices.


    # ANSWER:


    When the server''s Power-On Self-Test POST process is completed, the hardware
    needs to jump to a specific location in RAM to look for a boot device. When the
    boot device (typically on the hard disk) is found, the hardware will go to the
    position at cylinder 0, head 0, sector 0 and then load and execute the instructions
    there. This is the master boot record MBR.'
  merge: -1
