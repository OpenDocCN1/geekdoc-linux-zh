  - '[PAGE 59]


    # Question 56


    Unusual hidden files that start with a period:


    # Possible choices:


    are normally shown thru the ls command.


    are normally not shown thru the ls command.


    # ANSWER:


    Unusual hidden files that start with a period are normally not shown thru the
    ls command. These files may be used to hide tools and malicious programs. For
    example, a hacker may exploit SUID root programs and leave a SUID program as a
    backdoor. You may use the find command to find them all out.'
  - '[PAGE 60]


    # Question 57


    Unowned files may indicate:


    # **Possible choices:**


    +   - an intrusion

    - system error

    - file system corruption


    ANSWER:


    You may use tripwire to scan for changes in system files. Unowned files may indicate
    an intrusion and should not be permitted.'
  - '[PAGE 61]


    # Question 58


    Linux relies on the __________ file to enable server and client programs to convert
    service names to port numbers.


    # Fill in the blank:


    [ ]


    # ANSWER:


    Linux relies on the /etc/services file to enable server and client programs to
    convert service names to port numbers. Only the "root" user should be allowed
    to make modification to this file. You may even immunize this file via the command
    chattr.'
- md: '

    # Question 59


    Which of the following refers to files that include dynamically loadable kernel
    components?


    # Possible choices:


    - DRM

    - RPM

    - RSM

    - ROM

    - PRM

    - PKG

    - DEB

    - LKM

    - None of the choices.


    ANSWER:


    The term Loadable Kernel Modules (LKM) refers to files that include dynamically
    loadable kernel components. They are normally for loading device drivers and other
    hardware drivers.


    # Question 60


    The controlling of who is allowed to execute tasks via cron is stored in which
    2 files?


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:


    cron and at are used to execute certain tasks at predefined times, and are often
    the attack targets. Note that the controlling of who is allowed to execute tasks
    via cron is stored in the /var/adm/cron/cron.allow and /var/adm/cron/cron.deny
    file.


    # Question 61


    You should restrict su command to certain users only through editing:


    # Fill in the blank:


    [ ]


    # ANSWER:


    The su command allows you to substitute user. In other words, it allows you to
    become other existing users on the system. You should restrict su command to certain
    users only through editing the /etc/pam.d/ directory.


    # Question 62


    Which of the following is a security framework installed with SLE 11?


    # Possible choices:


    - Checkpoint FW

    - NortonAW

    - Stateful Chain

    - Novell AppArmor

    - None of the choices.


    ANSWER:


    Novell AppArmor is a security framework installed with SLE 11. It provides network
    application security via mandatory access control.


    # Question 63


    In the Linux file system, a ______ link is in fact a second name for a file.


    # Possible choices:


    - soft

    - hard

    - virtual

    - symbolic

    - None of the choices.


    # ANSWER:


    In the Linux file system, a hard link is in fact a second name for a file. If
    you fail to check the number of links to a file, an attacker may write to or read
    from this file through their own links in their directory. You don''t want to
    allow for too many links to your files.


    # Question 64


    A _______ link is a special type of file that contains a path name.


    # Possible choices:


    - soft

    - hard

    - virtual

    - symbolic

    - None of the choices.


    ANSWER:


    A symbolic link is a special type of file that contains a path name. An attacker
    can use a symbolic link to cause your application to write to the wrong file.
    Or, he can substitute his data for your own when you read your file. You may want
    to avoid functions that follow symbolic links as much as possible.


    # Question 65


    If you are to export file systems via the NFS service, for security sake you should
    configure the ________ file with the most restrictive access possible.


    # Fill in the blank:


    [ ]


    # ANSWER:


    If you are to export file systems via the NFS service, configure the /etc/exports
    file with the most restrictive access possible (such as read only). You should
    also ensure that the sticky bit is set on /tmp and /usr/tmp.


    # Question 66


    syslog and RMON are identical in functionality under the latest SUSE Linux kernel.


    # Possible choices:


    - True

    - False


    ANSWER:


    False. syslog refers to the standard for forwarding log messages. This work primarily
    in an IP network. The syslog protocol is a client server protocol. RMON (Remote
    Network MONitoring) supports monitoring and protocol analysis of LANs. The configuration
    set in the syslog.conf file determines what gets logged and what does not.


    # Question 67


    To run SuSEconfig manually, what command should you use?


    # Fill in the blank:


    [ ]


    ANSWER:


    SuSEconfig serves as the backend for YaST2. To run SuSEconfig manually, use the
    command SuSEconfig.


    # Question 68


    __________ be used to show information about the available USB buses in the system.
    However, to make use of it the Linux kernel needs to support the interface.


    # Fill in the blank:


    [ __________ ]/[ ]


    # ANSWER:


    Isusb can be used to show information about the available USB buses in the system
    as well as the devices connected to them. To make use of it, the Linux kernel
    needs to support the /proc/bus/usb interface.


    # Question 69


    You may use __________ to protect a file against accidental overwriting.


    # Possible choices:


    - chmod 400

    - chmod 500

    - chmod 600

    - chmod 644

    - chmod 660

    - None of the choices.


    ANSWER:


    You may use chmod 400 file to protect a file against accidental overwriting. You
    may use chmod 644 file to make a publicly readable file changeable only by the
    issuing user. And you may use chmod 660 file so that only those users belonging
    to your group can change this files.


    # Question 70


    sysfs can support bus types (choose all that apply):


    # Possible choices:


    - ISA

    - AGP

    - PCI

    - USB

    - S/390

    - None of the choices.


    ANSWER:


    sysfs is a virtual file system. Through virtual files sysfs can export information
    about the various kernel subsystems, devices and drivers from the kernel''s device
    model. The supported buses include PCI, USB and S/390 buses.


    # Question 71


    Configfs is a RAM-based virtual file system available since the _______ Linux
    kernel.


    # Possible choices:


    - 2.0

    - 2.1

    - 2.3

    - 2.4

    - 2.6

    - 2.9


    ANSWER:


    sysfs is a virtual file system. Configfs is a RAM-based virtual file system since
    the 2.6 Linux kernel and is complementary to sysfs.


    # Question 72


    SysVinit:


    # Possible choices:


    - has a group of processes for controlling the very basic functions of a Linux
    system.

    - has a group of processes for securing the very basic functions of a Linux system.

    - has a group of processes for virtualizing the very basic functions of a Linux
    system.

    - replaces init.

    - None of the choices.


    # ANSWER:


    System V initialization SysVinit is a package that has a group of processes for
    controlling the very basic functions of a Linux system. It includes the init program.
    Configuration can be done via /etc/inittab.


    # Question 73


    A cpio archive can be attached to the kernel image via which?


    # Possible choices:


    - initram

    - initvs

    - initram

    - initramfs

    - None of the choices.


    ANSWER:


    initramfs is introduced since the 2.6 Linux kernel. It has the modules necessary
    for mounting the rootfs. With it, a cpio archive can be attached to the kernel
    image.


    # Question 74


    Configuration changes to GRUB backgrounds and themes may be made to the __________
    file.


    # Fill in the blank:


    [ ]


    # ANSWER:


    GRUB 2 is the default boot loader and manager for many new distributions. Configuration
    changes of the backgrounds and themes may be made to the /etc/default/grub file.
    The default entry is specified via the GRUB_DEFAULT setting within this file.


    # Question 75


    Which of the following can be used to show information about the available USB
    buses in the system?


    # Possible choices:


    - exusb

    - lsusb

    - shusb

    - prtus

    - None of the choices.


    ANSWER:


    lsusb can be used to show information about the available USB buses in the system.
    Ispci, on the other hand, can be used to list all the detailed information about
    the PCI buses and devices.


    # Question 76


    What can be used to control systemd?


    # Possible choices:


    - init.r

    - init.sc

    - systemctl

    - systemcrm

    - systemcfg

    - None of the choices.


    ANSWER:


    systemd is a system and service manager. If it runs as PID 1 on boot, it serves
    as the init system that brings up the various userspace services. systemctl can
    be used to control it.


    # Question 77


    The __________ signal allows the systemd system manager to serialize its state
    and reexecute itself.


    # Fill in the blank:


    [ ]


    ANSWER:


    The SIGTERM signal allows the systemd system manager to serialize its state and
    reexecute itself. This is kind of like systemctl daemon-reexec.


    # Question 78


    The __________ signal allows the systemd manager to start the sigpwr.target unit.


    # Fill in the blank:


    [ ]


    ANSWER:


    nThe SIGPWR signal allows the systemd manager to start the sigpwr.target unit.
    This is just like systemctl start sigpwr.target.


    # Question 79


    __________ being used internally by shutdown for implementing delayed shutdowns.


    # Fill in the blank:


    [ ]


    ANSWER:

    /run/systemd/shutdownd is being used internally by shutdown for implementing delayed
    shutdowns.

    '
  mdcn: '


    # 问题 59


    以下哪项指的是包含动态加载内核组件的文件？


    # 选项范围：


    - DRM

    - RPM

    - RSM

    - ROM

    - PRM

    - PKG

    - DEB

    - LKM

    - 以上均不是正确项。


    答案：


    可加载内核模块 (LKM) 术语指的是包含动态加载内核组件的文件。它们通常用于加载设备驱动程序和其他硬件驱动程序。


    # 问题 60


    控制谁允许通过 cron 执行任务的信息存储在哪些 2 个文件中？


    # 填空：


    [ ] / [ ]


    答案：


    cron 和 at 用于在预定义的时间执行某些任务，并且经常是攻击攻击目标。请注意，控制谁允许通过 cron 执行任务的信息存储在 /var/adm/cron/cron.allow
    和 /var/adm/cron/cron.deny 文件中。


    # 问题 61


    你应该通过编辑以下内容来将 su 命令限制为某些用户：


    # 填空：


    [ ]


    # 答案：


    `su` 命令允许您切换用户。换句话说，它允许您成为系统上的其他现有用户。您应该通过编辑 /etc/pam.d/ 目录将 `su` 命令限制为某些用户。


    # 问题 62


    以下哪项是随 SLE 11 安装的安全框架？


    # 选项范围：


    - Checkpoint FW

    - NortonAW

    - Stateful Chain

    - Novell AppArmor

    - 以上均不是正确项。


    答案：


    Novell AppArmor 是随 SLE 11 安装的安全框架。它通过强制性访问控制提供网络应用安全。


    # 问题 63


    在 Linux 文件系统中，一个 ______ 链接实际上是文件的第二个名称。


    # 选项范围：


    - soft（软的）

    - hard（硬的）

    - virtual（虚拟的）

    - symbolic（符号）

    - 以上均不是正确项。


    # 答案：


    在 Linux 文件系统中，硬链接（hard link）实际上是文件的第二个名称。如果您未能检查指向文件的链接数，攻击者可能会通过他们自己目录中的链接向该文件写入或从中读取。您不希望允许文件有过多的链接。


    # 问题 64


    _______ 链接是一种包含路径名的特殊类型文件。


    # 选项范围：


    - soft（软的）

    - hard（硬的）

    - virtual（虚拟的）

    - symbolic（符号）

    - 以上均不是正确项。


    答案：


    符号链接（symbolic link）是一种包含路径名的特殊类型文件。攻击者可以使用符号链接导致您的应用程序写入错误的文件。或者，当您读取文件时，他可以用他的数据替换您自己的数据。您可能希望尽可能避免跟随符号链接的函数。


    # 问题 65


    如果您要通过 NFS 服务导出文件系统，出于安全起见，您应该将 ________ 文件配置为尽可能严格的访问。


    # 填空：


    [ ]


    # 答案：


    如果您要通过 NFS 服务导出文件系统，请将 /etc/exports 文件配置为尽可能严格的访问（例如只读）。您还应该确保在 /tmp 和 /usr/tmp
    上设置粘滞位（sticky bit）。


    # 问题 66


    syslog 和 RMON 在最新的 SUSE Linux 内核下功能是完全相同的。


    # 选项范围：


    - True（正确）

    - False（错误）


    答案：


    错误。syslog 指的是转发日志消息的标准。这项工作主要在 IP 网络中进行。syslog 协议是一种客户端-服务器协议。RMON（远程网络监控）支持对局域网进行监控和协议分析。syslog.conf
    文件中的配置决定了记录什么以及记录记录。


    # 问题 67


    要手动运行 SuSEconfig，应该使用什么命令？


    # 填空：


    [ ]


    答案：


    SuSEconfig 是 YaST2 的后端。要手动运行 SuSEconfig，请使用命令 SuSEconfig。


    # 问题 68


    __________ 可用于显示系统中可用 USB 总线的信息。然而，为了使用它，Linux 内核需要支持该接口。


    # 填空：


    [ __________ ]/[ ]


    # 答案：


    Isusb 可以显示系统中可用 USB 总线以及连接到这些总线的设备信息。要使用它，Linux 内核需要支持 /proc/bus/usb 接口。


    # 问题 69


    您可以使用 __________ 防止文件意外覆盖。


    # 选项范围：


    - chmod 400

    - chmod 500

    - chmod 600

    - chmod 644

    - chmod 660

    - 以上均不是正确项。


    答案：


    您可以使用 `chmod 400 file` 来保护文件防止意外覆盖。您可以使用 `chmod 644 file` 让一个公共可读的文件仅由发布用户更改。您可以使用
    `chmod 660 file` 使得只有属于您所在组的用户可以更改这些文件。


    # 问题 70


    sysfs 可以支持总线类型（选择所有适用项）：


    # 选项范围：


    - ISA

    - AGP

    - PCI

    - USB

    - S/390

    - 以上均不是正确项。


    答案：


    sysfs 是一个虚拟文件系统。通过虚拟文件，sysfs 可以从内核设备模型导出各种内核子系统、设备和驱动程序的信息。支持的总线包括 PCI、USB 和 S/390
    总线。


    # 问题 71


    Configfs 是自 _______ Linux 内核以来提供的基于内存的虚拟文件系统。


    # 选项范围：


    - 2.0

    - 2.1

    - 2.3

    - 2.4

    - 2.6

    - 2.9


    答案：


    sysfs 是一个虚拟文件系统。Configfs 是自 2.6 Linux 内核以来的一种基于内存的虚拟文件系统，并是对 sysfs 的补充。


    # 问题 72


    SysVinit：


    # 选项范围：


    - 拥一组进程用于控制 Linux 系统最基本的功能。

    - 拥一组进程用于保护 Linux 系统最基本的功能。

    - 拥一组进程用于虚拟化 Linux 系统最基本的功能。

    - 替换 init。

    - 以上均不是正确项。


    # 答案：


    System V 初始化 SysVinit 是一个软件包，它拥有一组进程用于控制 Linux 系统最基本的功能。它包含了 init 程序。可以通过 /etc/inittab
    进行配置。


    # 问题 73


    cpio 存档可以通过哪种附加到内核镜像上？


    # 选项范围：


    - initram

    - initvs

    - initram

    - initramfs

    - 以上均不是正确项。


    答案：


    initramfs 自 2.6 Linux 内核以来引入。它包含了挂载根文件系统（rootfs）所需的模块。通过它，cpio 存档可以附加到内核镜像上。


    # 问题 74


    对 GRUB 背景和主题的配置更改可以在 __________ 文件中进行。


    # 填空：


    [ ]


    # 答案：


    GRUB 2 是许多新发行版的默认引导加载程序和管理器。对背景和主题的配置更改可以在 /etc/default/grub 文件中进行。默认项通过该文件中的
    GRUB_DEFAULT 设置指定。


    # 问题 75


    以下哪项可用于显示系统中可用 USB 总线的信息？


    # 选项范围：


    - exusb

    - lsusb

    - shusb

    - prtus

    - 以上均不是正确项。


    答案：


    lsusb 可用于显示系统中可用 USB 总线的信息。另一方面，lspci 可列出所有 PCI 总线和设备的详细信息。


    # 问题 76


    什么可以用于控制 systemd？


    # 选项范围：


    - init.r

    - init.sc

    - systemctl

    - systemcrm

    - systemcfg

    - 以上均不是正确项。


    答案：


    systemd 是一个系统和服务管理器。如果它在启动时作为 PID 1 运行，它作为启动各种用户态服务的初始化系统。可以使用 systemctl 来控制它。


    # 问题 77


    __________ 信号允许 systemd 系统管理器将其状态序列化并重新执行。


    # 填空：


    [ ]


    答案：


    SIGTERM 信号允许 systemd 系统管理器将其状态序列化并重新执行。这类似于 systemctl daemon-reexec。


    # 问题 78


    __________ 信号允许 systemd 管理启动 sigpwr.target 单元。


    # 填空：


    [ ]


    答案：


    SIGPWR 信号允许 systemd 管理启动 sigpwr.target 单元。这就像 systemctl start sigpwr.target。


    # 问题 79


    __________ 正被 shutdown 命令内部用于延迟关机。


    # 填空：


    [ ]


    答案：

    /run/systemd/shutdownd 正被 shutdown 命令内部用于延迟关机。


    '
