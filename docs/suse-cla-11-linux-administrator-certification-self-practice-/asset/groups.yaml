- md: '

    # Question 13


    /boot is for the kernel. /var is for keeping files that are frequently changing


    # Fill in the blank:


    [ ]


    ANSWER:


    /boot is for the kernel. /var is for keeping files that are frequently changing


    # Question 14


    The good thing about GRUB 2 custom menu is that kernel and system updates will
    change and update it automatically.


    # Possible choices:


    - True

    - False


    ANSWER:


    False. GRUB 2 custom menus offer many benefits over the default one. The custom
    menu will change only when the user edits it. Kernel and system updates will not
    change it.


    # Question 15


    /usr is for user programs. /home is for user files and user specific configurations.


    # Fill in the blank:


    [ ]


    ANSWER:


    /usr is for user programs. /home is for user files and user specific configurations.


    # Question 16


    What is the name of the GRUB 2 menu configuration file?


    # Fill in the blank:


    [ ]


    ANSWER:


    GRUB 2 custom menus offer many benefits over the default one. It is the GRUB 2
    menu configuration file known as grub.cfg that has section remarks showing the
    responsible scripts.


    # Question 17


    /etc/passwd is where the user''s name and other account information are stored.
    On the other hand, /etc/shadow keeps the shadow passwords.


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:


    /etc/passwd is where the user''s name and other account information are stored.
    Passwords are stored here as clear text. /etc/shadow keeps shadow passwords which
    are more secure than clear text passwords.


    # Question 18


    /etc/group stores group names, while /etc/aliases stores users'' nickname for
    email.


    # Fill in the blank:


