    问题 80

    可以使用什么来生成 GRUB 的配置文件？


    # 选项：

    - grub-setconfig

    - grub-mkconfigfile

    - grub-makeconfig

    - grub-mkconfig

    - 以上选项均不是的。


    答案：

    可以使用 `grub-mkconfig` 来生成 GRUB 的配置文件，即 `grub.cfg`。在 GRUB 2 中不再使用 GRUB 的 `menu.lst`。


    问题 81

    当您使用 `GRUB_TIMEOUT=` 时，菜单将根据指定的秒数显示：


    # 选项：

    - GRUBTIMEOUT

    - GRUB_TIMEOUTLOG

    - GRUB_TIMEOUT

    - GRUB_HIDE_TIME

    - GRUB_TIMEOUT_ALTERNATIVE

    - 以上选项均不是的。


    答案：

    当您使用 `GRUB_TIMEOUT=` 时，菜单将按照 `GRUB_TIMEOUT` 中指定的秒数显示。


    问题 82

    可以使用什么来指定 GRUB 使用的背景图像？


    # 选项：

    - GRUB_BACK

    - GRUB_BACKIMG

    - GRUB_BACKGROUND

    - GRUB_BACKGROUND

    - GRUB_BACKGROUND_OPT

    - 以上选项均不是的。


    答案：

    可以使用 `GRUB_BACKGROUND` 来指定 GRUB2 使用的背景图像。您应该在此输入完整路径。


    问题 83

    当您使用 `GRUB_TIMEOUT=` 时，系统将立即启动到默认操作系统。


    # 选项：

    - 0

    - 1

    - 以上选项均不是的。


    答案：

    当您使用 `GRUB_TIMEOUT=0` 时，将不会显示菜单，系统将立即启动到默认操作系统。


    问题 84

    以下哪项作为 synaptic 和 aptitude 等前端工具的后端？


    # 选项：

    - apt-get

    - apt-seek

    - apt-read

    - apt-proc

    - apt-cache

    - 以上选项均不是的。


    答案：

    `apt-get` 是一个处理软件包的命令行工具。它作为 synaptic 和 aptitude 等前端工具的后端。


    问题 85

    默认情况下，SUSE 的 X Window 系统可以使用以下项进行配置：


    # 选项：

    - YaST2

    - XFree86

    - Xconfig

    - libzypp

    - Yast

    - 以上选项均不是的。


    答案：

    默认情况下，SUSE 的 X Window 系统可以使用 YaST2 界面进行配置。或者您也可以通过编辑配置文件进行手动配置。


    问题 86

    您可以使用 ________ 命令来创建 `/etc/xorg.conf` 文件。


    # 空：

    [ ]


    答案：

    您使用名为 YaST 的命令来创建 `/etc/xorg.conf` 文件，它是 X Window 系统的配置文件。


    问题 87

    您可以查看 ________ 文件来识别已创建的分区以及它们挂载的参数。


    # 空：

    [ ]


    答案：

    您可以查看 `/etc/fstab` 文件来识别已创建的分区以及它们挂载的参数。对于敏感分区，考虑设置只读（read-only）参数。


    问题 88

    以下哪项是 SUSE 的软件管理引擎？


    # 选项：

    - YaST2

    - XFree86

    - Xconfig

    - libzypp

    - Yast

    - 以上选项均不是的。


    答案：

    `libzypp` 是 SUSE 的软件管理引擎——它管理产品和模式（patterns）的依赖关系。模式是指带有特殊用途的可安装软件包列表。


    问题 89

    可以通过以下路径访问 YaST LVM 配置部分：


    # 选项：

    - YaST Expert Partitioner

    - YaST Disk Manager

    - YaST Volume Wizard

    - YaST2

    - libzypp

    - 以上选项均不是的。


    答案：

    可以通过 YaST Expert Partitioner 访问 YaST LVM 配置部分。请注意，LVM 主要适用于数据频繁使用的 PC 或数据不断增长的小型服务器。部署
    LVM 的第一步是创建卷组。请通过 YaST 执行此操作，不要对其使用任何命令行工具。


    问题 90

    YaST Partitioner GUI 工具可配置（选择所有适用项）：


    # 选项：

    - 硬盘分区

    - RAID

    - 卷管理 (Volume Management)

    - 加密文件 (Crypt Files)

    - NAT

    - NFS

    - 以上选项均不是的。


    答案：

    您使用 YaST Partitioner GUI 工具来配置或修改硬盘分区。您还可以用它配置 RAID、卷管理、加密文件或 NFS 等功能。


    问题 91

    __________ 指定了主机所属的域名以及名称服务器地址的状态。


    # 空：

    [ ]


    答案：

    `/etc/resolv.conf` 指定了主机所属的域名以及名称服务器地址的状态。`/etc/hosts` 有分配给主机名的 IP 地址。


    问题 92

    /etc/bash.bashrc：


    # 选项：

    - 适用于所有用户

    - 仅适用于主目录所有者

    - 是旧的


    答案：

    您需要知道 `/etc/bash.bashrc` 适用于所有用户，而 `~/.bashrc` 适用于主目录的用户（也就是说，个人偏好和个人脚本应该保留在这里）。


    问题 93

    `unset` 可取消只读的 shell 变量。


    # 选项：

    - True

    - False


    答案：

    False。您需要知道 `unset` 可以取消 shell 变量并从内存中删除。请记住，它不能取消只读的 shell 变量。


    问题 94

    可以使用什么脚本启动、停止或重启网络接口？


    # 空：

    [ ]


    答案：

    `ifup`、`ifdown` 和 `ifstatus` 是您可以用来启动或停止网络接口或查找指定接口状态的脚本。`rcnetwork` 脚本也可以用于启动、停止或重启网络接口。


    书完


