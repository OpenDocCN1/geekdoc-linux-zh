    - IP masquerading

    - port filtering

    - transparent proxy

    - None of the choices.


    ANSWER:

    Ipchains is a firewall and router software that supports features like IP masquerading,
    packet / port filtering and transparent proxy.


    # Question 38


    ______ can be used to ignore the HUP signal. On the other hand,

    ______ can be used to detach a process from the current shell.


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:

    nohup can be used to ignore the HUP (i.c. hangup) signal. On the other hand,

    tmux can be used to detach a process from the current shell.


    # Question 39


    Which of the following enables a Linux server to serve as a file server for Microsoft
    clients?


    # Possible choices:


    - Squid

    - Ipchains

    - SAMBA

    - HuP

    - Yum

    - None of the choices.


    ANSWER:


    SAMBA is a SMB client/server application that enables a Linux server to serve
    as a file server for Microsoft clients.


    # Question 40


    Which of the following has the primary function of caching web contents?


    # Possible choices:


    - Squid

    - Ipchains

    - SAMBA

    - HuP

    - Yum

    - None of the choices.


    ANSWER:


    Squid is a proxy server for caching frequently accessed web content. You can use
    it to control outgoing web access as well.


    # Question 41


    You use ________ to send file contents to the standard output, or use ________
    to move or rename files.


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:


    You use cat to send file contents to the standard output, such as the display.
    You use cd to change directory. You use mv to move or rename files. You use cp
    to copy files, or use dd to convert and copy a file.


    # Question 42


    You use ____ to find out the amount of disk space used on each mounted filesystem,
    or use ____ to create a symbolic link to a file.


    # Fill in the blank:


    [ ] / [ - ]


    # ANSWER:


    You use df to find out the amount of disk space used on each mounted filesystem.
    You use ln to create a symbolic link to a file, or ls to list the available files.
    You use touch to change the time stamp of a file.


    # Question 43


    ________ is for making a directory while ________ is for removing a directory.


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:

    mkdir is for making a directory while rmdir is for removing a directory. You use
    pwd to display the name of the current working directory.


    # Question 44


    You use ________ to find out where the binary files are for a particular command.
    You use ________ to shutdown the Linux system.


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:

    You use whereis to find out where the binary, source and manual page files are
    for a particular command. You use shutdown to shutdown the Linux system.


    # Question 45


    You use ________ to create new user. You may also use ________ to create new users
    in batch form.


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:

    You use useradd to create new user, userdel to delete user account, or userm to
    modify a user account. You may also use newusers to create new users in batch
    form.


    # Question 46


    You use ________ to create a new group, or use ________ to modify existing group.


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:

    You use groupadd to create a new group, groupdel to delete a group, or groupmod
    to modify a group.


    # Question 47


    You use ________ to change the time a user''s password will expire, or ________
    to change the owner of a file to another user.


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:

    You use chage to change the time a user''s password will expire, chgrp to change
    the group ownership of files, or chown to change the owner of a file to another
    user.


    # Question 48


    You use ________ to set or update a user''s password. You may also use ________
    to create the file /etc/shadow.


    # Fill in the blank:


    [ ] / [ ]


    # ANSWER:

    You use passwd to set or update a user''s password. You may also use pwconv to
    create the file /etc/shadow from the file /etc/passwd - that is, to convert clear
    text passwords to shadow passwords.


    # Question 49


    You use ________ to display statistics on users'' connect time, and ________ to
    enable the accounting of processes.


    # Fill in the blank:


    [ ] / [ ]


    # ANSWER:

    You use ac to display statistics on users'' connect time, and accton to enable
    the accounting of processes. You also use last to display a list of users who
    have logged in.


    # Question 50


    You use ________ to turn system quotas on. You also use ________ to turn system
    quotas off.


    # Fill in the blank:


    ANSWER:

    You use quotaon to turn system quotas on. You also use quotaoff to turn system
    quotas off.


    # Question 51


    You use ________ to edit user quotas. You also use ________ to show the various
    users'' limits


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:

    You use edquota to edit user or group quotas. You also use quota to show the various
    users'' limits and current disk usage.


    # Question 52


    What is the default mode of vi?


    # Possible choices:


    - command

    - input

    - output

    - admin

    - None of the choices.


    ANSWER:

    You use vi to invoke the vi text editor. You use head to view the first few lines
    of a file. vi is a mode-oriented editor. The default is command mode. To enter
    text you need to first switch to input mode.


    # Question 53


    You use ________ to view the last few lines, or use ________ to search for pattern
    in a file.


    # Fill in the blank:


    [ ] / [ ]


    ANSWER:

    You use tail to view the last few lines. You use grep to search for pattern in
    a file.


    # Question 54


    The default permissions are ________ for Executable files and ________ for Text
    files.


    # Possible choices:


    - 777/666

    - 666/777

    - 555/666

    - 666/555

    - 022/666

    - 666/022


    None of the choices.


    # ANSWER:


    umask is used to set and determine the default file permissions on the system.
    The default permissions are 777 for Executable files and 666 for Text files. These
    defaults allow all users to execute an executable file but not to execute a text
    file. All users can read and write the text file though.


    # Question 55


    The most common umask is:


    # Possible choices:


    - 022

    - 023

    - 055

    - 066

    - 444

    - 555

    - 666


    ANSWER:

    The most common umask setting is 022. The /etc/profile script is where you may
    have the umask command set for all users.


    # Question 56


    Unusual hidden files that start with a period:


    # Possible choices:


    are normally shown thru the ls command.


    are normally not shown thru the ls command.


    # ANSWER:

    Unusual hidden files that start with a period are normally not shown thru the
    ls command. These files may be used to hide tools and malicious programs. For
    example, a hacker may exploit SUID root programs and leave a SUID program as a
    backdoor. You may use the find command to find them all.


    # Question 57


    Unowned files may indicate:


    # Possible choices:


    - an intrusion

    - system error

    - file system corruption


    ANSWER:

    You may use tripwire to scan for changes in system files. Unowned files may indicate
    an intrusion and should not be permitted.


    # Question 58


    Linux relies on the __________ file to enable server and client programs to convert
    service names to port numbers.


    # Fill in the blank:


    [ ]


    # ANSWER:


    Linux relies on the /etc/services file to enable server and client programs to
    convert service names to port numbers. Only the "root" user should be allowed
    to make modification to this file. You may even immunize this file via the command
    chattr.

