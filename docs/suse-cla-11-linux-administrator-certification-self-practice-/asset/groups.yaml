    # 问题 35


    谈到环境变量，________ 是实际用户的登录名，而 ________ 指定了要使用的语言。


    **填空题：**


    [ ] / [ ]


    答案：


    环境变量可用于配置 shell 的行为。USER 是实际用户的登录名，而 LANG 指定了要使用的语言。


    # 问题 36


    以下哪项可用于维护共享库缓存？


    # 可能的选项：


    - lddset

    - ldcfg

    - ldcache

    - ldconfig

    - lddconf

    - 以上选项均不是。


    答案：

    ldconfig 可用于为命令行指定的目录中找到的最新库创建所需的链接和缓存。简单来说，它维护了共享库缓存。


    # 问题 37


    Ipchains 支持以下功能（选择所有适用项）：


    # 可能的选项：


    - 数据包过滤

    - IP 伪装术 (IP masquerading)

    - 端口过滤

    - 透明代理

    - 以上选项均不是。


    答案：

    Ipchains 是一种防火墙和路由器软件，它支持 IP 伪装术、数据包/端口过滤以及透明代理等功能。


    # 问题 38


    ______ 可用于忽略 HUP 信号。另一方面，______ 可用于将进程从当前 shell 中分离出来。


    # 填空题：


    [ ] / [ ]


    答案：

    nohup 可用于忽略 HUP（即挂断信号 hangup）信号。另一方面，tmux 可用于将进程从当前 shell 中分离出来。


    # 问题 39


    以下哪项能让 Linux 服务器作为微软客户端的文件服务器运行？


    # 可能的选项：


    - Squid

    - Ipchains

    - SAMBA

    - HuP

    - Yum

    - 以上选项均不是。


    答案：


    SAMBA 是一种 SMB 客户端/服务器应用程序，它使 Linux 服务器能够作为微软客户端的文件服务器。


    # 问题 40


    以下哪项具有缓存网页内容的功能？


    # 可能的选项：


    - Squid

    - Ipchains

    - SAMBA

    - HuP

    - Yum

    - 以上选项均不是。


    答案：

    Squid 是一个用于缓存频繁访问网页内容的代理服务器。它也可以用于控制出访问。


    # 问题 41


    你使用 ________ 将内容发送到标准输出，或者使用 ________ 移动或重命名文件。


    # 填空题：


    [ ] / [ ]


    答案：

    你使用 cat 将内容发送到标准输出，例如显示。你使用 cd 更改目录。你使用 mv 移动或重命名文件。你使用 cp 复制文件，或者使用 dd 转换。


    # 问题 42


    你使用 ____ 查看每个挂载文件系统的磁盘空间，或者使用 ____ 创建文件的符号链接。


    # 填空题：


    [ ] / [ ]


    答案：

    你使用 df 查看每个挂载文件系统的磁盘空间。你使用 ln 创建符号链接，或者使用 ls 列出文件。你使用 touch 修改文件的时间戳。


    # 问题 43


    ________ 用于创建目录而 ________ 用于删除目录。


    # 填空题：


    [ ] / [ ]


    答案：

    mkdir 用于创建目录，rmdir 用于删除目录。你使用 pwd 显示当前目录名称。


    # 问题 44


    你使用 ________ 查找二进制文件的位置。你使用 ________ 关闭 Linux 系统。


    # 填空题：


    [ ] / [ ]


    答案：

    你使用 whereis 查找二进制文件和手册页的位置。你使用 shutdown 关闭 Linux 系统。


    # 问题 45


    你使用 ________ 创建新用户。你也可以使用 ________ 以批量形式创建新用户。


    # 填空题：


    [ ] / [ ]


    答案：

    你使用 useradd 创建新用户，userdel 删除用户账户，或者 usermod 修改用户账户。


    # 问题 46


    你使用 ________ 创建新组，或者使用 ________ 修改现有组。


    # 填空题：


    [ ] / [ ]


    答案：

    你使用 groupadd 创建新组，groupdel 删除组，或者 groupmod 修改组。


    # 问题 47


    你使用 ________ 修改用户密码过期时间，或者使用 ________ 更改文件的所有者。


    # 填空题：


    [ ] / [ ]


    答案：

    你使用 chage 修改用户密码过期时间，chgrp 更改文件的组，或者 chown 更改文件的所有者。


    # 问题 48


    你使用 ________ 设置或更新用户密码。你也可以使用 ________ 创建 /etc/shadow 文件。


    # 填空题：


    [ ] / [ ]


    答案：

    你使用 passwd 设置或更新用户密码。你也可以使用 pwconv 从 /etc/passwd 生成 /etc/shadow，即将明文密码影子密码。


    # 问题 49


    你使用 ________ 显示用户登录统计信息，并使用 ________ 开启进程计数。


    # 填空题：


    [ ] / [ ]


    答案：

    你使用 last 显示用户登录统计信息，acct 开启进程计数。你使用 last 显示已登录的用户列表。


    # 问题 50


    你使用 ________ 开启系统配额。你使用 ________ 关闭系统配额。


    # 填空题：


    答案：

    你使用 quotaon 开启系统配额。你使用 quotaoff 关闭系统配额。


    # 问题 51


    你使用 ________ 编辑用户配额。你还使用 ________ 显示各种用户的限制。


    # 填空题：


    [ ] / [ ]


    答案：

    你使用 edquota 编辑用户或组配额。你使用 quota 显示各种用户的限制和当前磁盘占用。


    # 问题 52


    vi 的默认模式是什么？


    # 可能的选项：


    - command

    - input

    - output

    - admin

    - 以上选项均不是。


    答案：

    你使用 vi 调用 vi 编辑器。你使用 head 查看文件的前几行。vi 是一个面向模式的编辑器。默认是命令模式。输入文本需要首先切换到输入模式。


    # 问题 53


    你使用 ________ 查看最后几行，或者使用 ________ 在文件中搜索特定模式。


    # 填空题：


    [ ] / [ ]


    答案：

    你使用 tail 查看最后几行。你使用 grep 在文件中搜索模式。


    # 问题 54


    执行文件的默认权限是 ________，文本文件的默认权限是 ________。


    # 可能的选项：


    - 777/666

    - 666/777

    - 555/666

    - 666/555

    - 022/666

    - 666/022

    以上选项均不是。


    答案：

    umask 用于设置和确定系统上的默认文件权限。执行文件的默认权限为 777，文本文件为 666。这些默认设置允许用户执行可执行文件，但不执行文本文件。不过，所有用户都可以读写文本文件。


    # 问题 55


    最常见的 umask 是：


    # 可能的选项：


    - 022

    - 023

    - 055

    - 066

    - 444

    - 555

    - 666


    答案：

    最常见的 umask 设置是 022。在 /etc/profile 脚本中，你可以为所有用户设置 umask 命令。


    # 问题 56


    以点 (.) 开头的异常隐藏文件：


    # 可能的选项：


    - 通常通过 ls 命令显示。

    - 通常不通过 ls 命令显示。


    答案：

    以点 (.) 开头的异常隐藏文件通常不通过 ls 命令显示。这些文件可能用于隐藏工具和恶意程序。例如，黑客可能利用 SUID root 程序并留下一个 SUID
    程序作为后门。你可以使用 find 命令找到所有它们。


    # 问题 57


    未所有者的文件可能指示着：


    # 可能的选项：


    - 侵入

    - 系统错误

    - 文件系统损坏


    答案：

    你可以使用 tripwire 扫描系统文件的更改。未所有者的文件可能指示了入侵，不应被允许。


    # 问题 58


    Linux 依赖 __________ 文件使服务器和客户端程序将服务名称转换为端口号。


    # 填空题：


    [ ]


    # 答案：

    Linux 依赖 /etc/services 文件使服务器和客户端程序将服务名称转换为端口号。只有“root”用户应该被允许修改此文件。你甚至可以通过 chattr
    命令对该文件进行免疫处理。


