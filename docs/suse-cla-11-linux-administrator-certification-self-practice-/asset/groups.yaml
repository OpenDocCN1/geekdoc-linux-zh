    # Contents Update


    All books come with LIFE TIME FREE UPDATES. When you find a newer version of the
    purchased book all you need to do is go and download. Please check our web site''s
    Free Updates regularly: http://www.examreview.net/free_updates.htm


    # Page Formatting and Typeface


    To accommodate the needs of those with weaker vision, we use LARGER PRINT throughout
    the book whenever practical. The text in this book was created using Garamond
    (size 16). A little bit of page resizing, however, may have happened along the
    actual book printing process.


    # The Exam


    This product covers the SUSE CLA 11 certification exam. We create these self-practice
    test questions referencing the concepts and principles currently valid in the
    exam. Each question comes an answer and a short explanation which aids you in
    seeking further study information. For purpose of exam readiness drilling, this
    product includes questions that have varying numbers of choices. We have 2 while
    some have 5 or 6. Some questions are fill-in-the-blanks. We want to make sure
    these questions are enough to really test your readiness and draw your focus to
    the weak areas. Think of these as challenges presented to you so to assess your
    comprehension of the subject matters. The goal is to reinforce learning, to validate
    successful transference of knowledge and to identify areas of weakness that require
    remediation. The questions are NOT designed to “simulate” actual questions. “realistic”
    or actual questions that are for cheating purpose are not available in any of
    our products.


    # Question 1


    Which of the following is true regarding FUSE (choose all that apply)


    # Possible choices:


    - It needs to be installed as a package.

    - It cannot support ISO images.

    - It cannot support SSH connections.

    - Many FUSE plugins are shipped with SUSE Linux by default.

    - None of the choices.


    # ANSWER:


    File system in userspace FUSE is a kernel module that when combined with plug-ins
    can be used to access almost all file systems via means such as remote SSH connections,
    ISO images, and the like. FUSE itself needs to be installed as a package. FUSE
    plugins, however, are not shipped with SUSE Linux by default.


    # Question 2


    With SUSE Linux, distributions are segmented into:


    # Possible choices:


    - modules

    - units

    - packages

    - services

    - None of the choices.


    # ANSWER:


    Linux distributions are segmented into packages. Each of these packages includes
    the specific Linux flavors plus some specific applications or services.


    # Question 3


    With SUSE Linux, a package is typically provided in the form of:


    # Possible choices:


    - compiled code

    - source code


    # ANSWER:


    A package is typically provided in the form of compiled code so manual compilation
    is not necessary. There are installation and package removal utilities in the
    form of package management system, with package description, version, and dependencies.


    Question 4 __________ is a plugin that can mount CD-ROM images with ISO9660 file
    systems in them.


    # Fill in the blank:


    [ ]


    ANSWER:

    fuseiso is a plugin that can mount CD-ROM images with ISO9660 file systems in
    them. ntfs-3g is a plug in that can mount NTFS volumes with complete read and
    write support.


    # Question 5


    _______ is a plug in that serves as a file system client based on SSH file transfer
    protocol. On the other hand, _______ is a plug in that can mount WebDAV file systems.


    # Fill in the blank:


    [ ] / [ ]


    # ANSWER:


    sshfs is a plug in that serves as a file system client based on SSH file transfer
    protocol. wdfs is a plug in that can mount WebDAV file systems.


    Question 6

    What is the most important command for seeking help on Linux?


    # Possible choices:


    - seek

    - man

    - help

    - ?

    - info

    - None of the choices.


    ANSWER:

    The most important command for seeking help on Linux is man. To specify language,
    use the LANG parameter. To automatically view one screen of information at a time,
    use the less command.


    # Question 7


    More detailed help information can be retrieved via:


    # **Possible choices:**


    - help

    - info

    - manual

    - seek help

    - None of the choices.


    # ANSWER:


    Some programs do not use the man pages. To seek help information on them you need
    to use the info command to access help information stored with more details. The
    info format is fancier.


    # Question 8


    The MBR is located at:


    # Possible choices:


    - cylinder 0, head 0, sector 0

    - cylinder 0, head 1, sector 0

    - cylinder 0, head 0, sector 1

    - cylinder 1, head 0, sector 0

    - None of the choices.


    # ANSWER:


    When the server''s Power-On Self-Test POST process is completed, the hardware
    needs to jump to a specific location in RAM to look for a boot device. When the
    boot device (typically on the hard disk) is found, the hardware will go to the
    position at cylinder 0, head 0, sector 0 and then load and execute the instructions
    there. This is the master boot record MBR.


    # Question 9


    The configuration of LILO can be fine tuned through which file?


    # Fill in the blank:


    [  ]


    # ANSWER:


    The code in the MBR can help find the active partition for executing the code
    there. The LILO program is part of the partition and is generally referred to
    as a "boot loader". The configuration of LILO can be fine tuned through /etc/lilo.conf.


    Question 10

    LILO is capable of finding all the data that it needs from the raw hard disks:


    # Possible choices:


    - as long as there is sufficient partitioning data.

    - even without any partitioning data.


    ANSWER:

    LILO is a bootloader. It is capable of finding all the data that it needs from
    the raw hard disks even without any partitioning data.


    # Question 11

    Which of the following can be supported by GRUB (choose all that apply):


    **Possible choices:**

    - Ext2

    - Ext3

    - ReiserFS

    - Minix

    - FAT

    - None of the choices.


    ANSWER:

    Some distributions use GRUB as the choice of boot loader. SUSE 8.1 uses GRUB2.
    Grand Unified Bootloader GRUB is the "official" boot loader for SUSE. It can support
    many different file systems, including Ext2, Ext3, ReiserFS, Minix, and even the
    DOS FAT file system.


    # Question 12


    In order to create a file to be used a swap, you need to first create the file
    via __________, then you need to prepare the file for usage as swap space using
    ________.


    # Fill in the blank:


    [ ] / [ ]


    # ANSWER:


    In order to create a file to be used a swap, you need to first create the file
    via dd. Then you need to prepare the file for usage as swap space using mkswap.
    What is special about swap is that it has no mount point associated with it.

    '
