    Question 80

    What can be used to generate a configuration file for GRUB?


    # Possible choices:

    - grub-setconfig

    - grub-mkconfigfile

    - grub-makeconfig

    - grub-mkconfig

    - None of the choices.


    ANSWER:

    grub-mkconfig can be used to generate a configuration file for GRUB, which is
    grub.cfg. The menu.lst of GRUB is no longer in use in GRUB 2.


    Question 81

    When you use GRUB_TIMEOUT=, the menu will simply be shown for the number of seconds
    specified in:


    # Possible choices:

    - GRUBTIMEOUT

    - GRUB_TIMEOUTLOG

    - GRUB_TIMEOUT

    - GRUB_HIDE_TIME

    - GRUB_TIMEOUT_ALTERNATIVE

    - None of the choices.


    ANSWER:

    When you use GRUB_TIMEOUT=, the menu is simply shown for the number of seconds
    specified in GRUB_TIMEOUT.


    Question 82

    What can be used to specify the background image to use by GRUB?


    # Possible choices:

    - GRUB_BACK

    - GRUB_BACKIMG

    - GRUB_BACKGROUND

    - GRUB_BACKGROUND

    - GRUB_BACKGROUND_OPT

    - None of the choices.


    ANSWER:

    GRUB_BACKGROUND can be used to specify the background image to use by GRUB2. You
    should enter the full path here.


    Question 83

    When you use GRUB_TIMEOUT=, the system will immediately boot to the default OS.


    # Possible choices:

    - 0

    - 1

    - None of the choices.


    ANSWER:

    When you use GRUB_TIMEOUT=0, no menu will be displayed and the system will immediately
    boot to the default OS.


    Question 84

    Which of the following serves as the back-end to front-end tools such as synaptic
    and aptitude?


    # Possible choices:

    - apt-get

    - apt-seek

    - apt-read

    - apt-proc

    - apt-cache

    - None of the choices.


    ANSWER:

    apt-get is a command-line tool for handling packages. It serves as the back-end
    to front-end tools such as synaptic and aptitude.


    Question 85

    By default, the X Window System of SUSE can be configured with:


    # Possible choices:

    - YaST2

    - XFree86

    - Xconfig

    - libzypp

    - Yast

    - None of the choices.


    ANSWER:

    By default, the X Window System of SUSE can be configured with YaST2 interface.
    Alternatively you can have it configured manually through editing configuration
    files.


    Question 86

    You may use the ________ command to create the /etc/xorg.conf file.


    # Fill in the blank:

    [ ]


    ANSWER:

    You use the command known as YaST to create the /etc/xorg.conf file, which is
    the configuration file of the X Window System.


    Question 87

    You may view the ________ file to identify partitions that have been created,
    as well as the parameters with which they mounted.


    # Fill in the blank:

    [ ]


    ANSWER:

    You may view the /etc/fstab file to identify partitions that have been created,
    as well as the parameters with which they mounted. For sensitive partitions, consider
    to have the read-only parameter set.


    Question 88

    Which of the following is the software management engine for SUSE?


    # Possible choices:

    - YaST2

    - XFree86

    - Xconfig

    - libzypp

    - Yast

    - None of the choices.


    ANSWER:

    libzypp is the software management engine for SUSE – it manages dependencies for
    products and patterns. A pattern refers to installable list of packages that carry
    special purposes.


    Question 89

    The YaST LVM configuration section can be reached via:


    # Possible choices:

    - the YaST Expert Partitioner

    - the YaST Disk Manager

    - the YaST Volume Wizard

    - YaST2

    - libzypp

    - None of the choices.


    ANSWER:

    The YaST LVM configuration section can be reached via the YaST Expert Partitioner.
    realize that LVM is suitable primarily for heavily used PCs or small servers with
    growing data. The first to deploy LVM is to create a volume group. Do this only
    through YaST. You do not want to mess with any command line tools on this.


    Question 90

    The YaST Partitioner GUI tool can be used to configure (choose all that apply):


    # Possible choices:

    - the partitioning of hard disks

    - RAID

    - Volume Management

    - Crypt Files

    - NAT

    - NFS

    - None of the choices.


    ANSWER:

    You use the YaST Partitioner GUI tool to configure or modify the partitioning
    of hard disks. You can also use it to configure functions like RAID, Volume Management,
    Crypt Files, or NFS.


    Question 91

    The __________ specifies the domain to which the host belongs, plus the status
    of the name server address.


    # Fill in the blank:

    [ ]


    ANSWER:

    /etc/resolv.conf specifies the domain to which the host belongs, plus the status
    of the name server address. /etc/hosts has IP addresses assigned to hostnames.


    Question 92

    /etc/bash.bashrc:


    # Possible choices:

    - applies to all users

    - applies to the owner of the home folder only

    - is legacy


    ANSWER:

    You want to know that /etc/bash.bashrc applies to all users, while ~/.bashrc applies
    to the user of a home folder (in other words, personal preferences and personal
    scripts should be kept here).


    Question 93

    unset can be used to unset read-only shell variables.


    # Possible choices:

    - True

    - False


    ANSWER:

    False. You want to know that unset can be used to unset a shell variable and have
    it removed from memory. Keep in mind, it cannot unset read-only shell variables.


    Question 94

    What script can be used to start, stop or restart network interfaces?


    # Fill in the blank:

    [ ]


    ANSWER:

    ifup, ifdown, and ifstatus are scripts you can use to start or stop network interfaces
    or find out the status of the specified interface. The rcnetwork script can also
    be used to start, stop or restart network interfaces.


    END OF BOOK


    Made in the USA

    Middletown, DE

    18 June 2015

