    # 内容更新


    所有书籍均提供**终身免费更新**。当您发现购买的书有更新版本时，只需前往下载即可。请定期查看我们网站的免费更新：http://www.examreview.net/free_updates.htm


    # 页面格式与字体


    为了迎合视力较弱者的需求，在可行的情况下，我们在书中使用了**大号字体**。书中的文本使用 Garamond（16号字体）创建。但在实际的书籍印刷过程中，可能会发生细小的页面尺寸调整。


    # 考试


    本产品涵盖 SUSE CLA 11 认证考试。我们参考当前考试中有效的概念和原理创建了这些自练习题。每道题都带有答案和简短解释，帮助您寻找进一步的学习信息。为了进行考前准备演练，本产品包含了具有不同数量选项的题目。有些有
    2 个选项，有些有 5 个或 6 个。有些题目是填空题。我们希望确保这些题目足以真实测试您的准备情况，并将您的注意力引到薄弱环节。请将这些题目视为提供给您的挑战，以评估您对主题内容的理解程度。目标是强化学习，验证知识的成功迁移，并识别需要弥补的薄弱领域。这些题目**不是**设计用来“模拟”真实题目。我们的任何产品中不提供用于作弊目的的“真实”或实际题目。


    # 第 1 题


    关于 FUSE，以下哪项是正确的（请选择所有适用项）


    # 可能的选项：


    - 它需要作为包安装。

    - 它不支持 ISO 镜像。

    - 它不支持 SSH 连接。

    - 许多 FUSE 插件默认随 SUSE Linux 发行。

    - 以上选项都不对。


    # 答案：


    用户空间文件系统 FUSE 是一个内核模块，与插件结合时，可以通过远程 SSH 连接、ISO 镜像等方式访问几乎所有的文件系统。FUSE 本身需要作为包安装。然而，FUSE
    插件并不默认随 SUSE Linux 发行。


    # 第 2 题


    在 SUSE Linux 中，发行版被分为：


    # 可能的选项：


    - 模块

    - 单元

    - 软件包

    - 服务


    # 答案：


    SUSE Linux 的发行版被分为服务。


    # 第 3 题


    在 SUSE Linux 中，通常以什么形式提供：


    # 可能的选项：


    - 编译后的代码

    - 源代码


    # 答案：


    通常以编译后的代码形式提供。


    # 第 4 题


    __________ 能够挂载 ISO 镜像。


    # 填空：


    [ ]


    # 答案：


    FUSE 本身需要作为包安装。


    # 第 5 题


    __________ 并不是默认随 SUSE Linux 发行的。


    # 填空：


    [ ]


    # 答案：


    FUSE 插件并不默认随 SUSE Linux 发行。


    # 第 6 题


    在 Linux 中，最重要的命令是哪个？


    # 可能的选项：


    - seek

    - man

    - help

    - info


    # 答案：


    在 Linux 中，最重要的命令是 man。


    # 第 7 题


    更详细的帮助信息可以通过获取：


    # 可能的选项：


    - help

    - info

    - manual

    - seek


    # 答案：


    更详细的帮助可以通过 info 获取。


    # 第 8 题


    MBR 位于：


    # 可能的选项：


    - 道 0，头 0， 扇区 0

    - 道 0，头 1，扇扇区 0

    - 道 0，头 0， 扇区 1

    - 道 1，头 0， 扇区 0


    # 答案：


    发行版被分为软件包。


    # 第 9 题


    LILO 的配置可以通过哪个文件进行微调？


    # 填空：


    [  ]


    # 答案：


    LILO 的配置可以通过 /etc/lilo.conf 进行微调。


    # 第 10 题


    LILO 能够从原始磁盘中找到它所需的所有数据：


    # 可能的选项：


    - 只要有足够的分区数据。

    - 即使没有分区数据。


    # 答案：


    LILO 是一个启动加载器。它即使在没有分区数据的情况下也能从原始磁盘找到所需的所有数据。


    # 第 11 题


    以下哪些项被 GRUB 支持（请选择所有适用项）：


    **可能的选项：**


    - Ext2

    - Ext3

    - ReiserFS

    - Minix

    - FAT

    - 以上选项都不对。


    # 答案：


    某些发行版使用 GRUB 作为启动加载器。SUSE 8.1 使用 GRUB2。全局统一引导加载程序 GRUB 是 SUSE 的“官方”启动加载器。它可以支持许多不同的文件系统，包括
    Ext2、Ext3、ReiserFS、Minix 甚至是 DOS FAT 文件系统。


    # 第 12 题


    为了创建一个用于交换空间的文件，你首先需要通过 __________ 创建该文件，然后使用 ________ 将该文件准备用于交换空间。


    # 填空：


    [ ] / [ ]


    # 答案：


    为了创建一个用于交换空间的文件，你首先需要通过 dd 创建该文件，然后使用 mkswap 将该文件准备用于交换空间。


    '
