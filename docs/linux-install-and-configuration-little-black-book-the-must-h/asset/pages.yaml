  md: '# Incremental Backups


    On many systems, especially those that are not often changed at a basic level,
    frequent backups are mostly necessary for particular parts of the file system.
    In this case, you might choose to incremental backups. This process requires five
    media for the first month, then one additional media each month. An incremental
    backup might work like the following:


    +   1. Determine which parts of the file system change frequently and which remain
    the same within most months. For example, the /home part of the file system usually
    changes on a regular basis, as well as the logs stored under /var.

    2. Once per week, back up the parts of the file system that change often.

    3. Once per month, back up the entire file system.

    4. When a new month begins, re-use the weekly tapes.


    # Mixing Schemes


    Which backup scheme is right for your system depends entirely on your needs and
    how the system is used. Often a mix of schemes is useful—for example, doing an
    incremental backup, backing partly every day and then fully each week.


    # Creating A Manual Backup: General


    To create a manual backup, do the following:


    +   1. Choose what segments of the file system you want to back up.

    2. Determine when these segments will be most idle so files will not be in use
    during backup.

    3. Mount the backup media into the file system.

    4. Use the tar package to bundle related files.

    5. If space is an issue, gzip the tar package.


    > TIP: Be sure the bundled archive has a meaningful name, including whatever information
    helps you know it at a glance: version number, program name, any key terms that
    might serve as a reminder.


    +   6. Place the bundle on the backup media if you didn''t archive directly there.'
