  md: 'If you want to know if a particular package is already installed, type

    "rpm -q package-name".


    # Determining What Files Are In An RPM Package


    To get a listing of the files within a package, you have the following

    options:


    +   - If you have not installed the package, then the command is


    rpm -qlp package-name.rpm


    +   - If you have installed the package, then the command is


    rpm -ql package-name


    # Determining What RPM Package A File Is In


    If there is a particular file on your system and you want to know what

    package it is in, perhaps so you can upgrade that package to upgrade

    tfile, first find that file with its full path. Then, type "rpm -qf file-

    with-full-path".


    For example, if you wanted to find the daemon httpd, which lives in

    /etc/rc.d/init.d/, you would type "rpm -qf /etc/rc.d/init.d/httpd".


    # Determining What RPM Package Is For


    You can query a package before installing it to find out what it is, who

    bilt it, and what other pertinent information. To accomplish this, type

    n"rpm -qip package-name.rpm".


    # Verifying A PGP Signed RPM


    If you downloaded an RPM that is PGP signed, you need to verify it

    before you continue. To verify this, do the following:


    +   1. Download and install the PGP package, as shown in Chapter 16.

    2. Add PGP to your path, as shown in Chapter 16.

    3. Locate the directory containing your public keyring.

    4. Create an environment variable named PGPPATH, which is

    equal to the directory name determined in Step 3. This task

    is accomplished depends on the shell you are using. If you are

    using the default (bash) shell, then you do this by typing

    "PGPPATH=path_from_3".'
