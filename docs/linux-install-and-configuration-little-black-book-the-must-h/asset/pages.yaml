- img_proc: true
  md: 'items, such as user information, group information, shell information—and too
    many programs need to access it for you to be able to painfully make it readable
    only by root.


    A commonly used method of dealing with this problem is installing the Shadow password
    suite. This suite moves all passwords into a file that only root can read, eliminating
    the damage someone can do by simply stealing the /etc/passwd file. As you can
    imagine, moving all passwords to a new file has the potential to cause problems
    with some programs and services that require access to that file. If you have
    access to the source code (see the section "Modifying Your Source To Work With
    The Shadow Suite\ or the program settings that tell you you are using the Shadow
    Suite, then this is not an issue. However, there are some cases where you cannot
    use the suite:


    +   * The Linux machine is on a LAN with NIS to exchange usernames and passwords
    with other machines on the network.

    * The Linux machine is used by terminal servers to verify users via NFS, NIS,
    or other method.

    * There is software you must use that has a need to validate users, and you don''t
    have access either to a version built specifically for the Shadow Suite or to
    the source code.


    Set up your machine to use the Shadow Suite, see the section "Converting Your
    System To Use Shadow Passwords." Instructions are also included on how to remove
    the suite (in the section "Converting Your System To No Longer Use Shadow Passwords"),
    in case you find that it gets in the way of other things you need to do.


    # # Custom User Addition Scripts


    Many system administrators find that they develop a familiar routine when creating
    users. In an effort to save themselves work down the road, choose to create a
    shell script to automate the list of tasks into one smooth process.


    As you add each user, make notes of what tasks you must do. The more complex your
    setup, the more involved this process can be. For example, you might need to create
    a Web directory or FTP directory for them or to alter their PATH statement to
    include file paths they commonly need to access.


    Once you have this data compiled, you can begin building your script. A detailed
    discussion on writing shell scripts is given in Chapter 18.'
