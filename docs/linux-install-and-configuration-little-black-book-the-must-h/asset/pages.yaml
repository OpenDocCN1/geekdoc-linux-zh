    # Preparing To Write A Login Script


    Regardless of which tool you use to connect to your ISP, there is the possibility
    that you will need to write a login script for it. To prepare to write this script,
    you need to know exactly what appears on the screen to prompt you at each step
    of the login process. You can get this information from the ISP, or you can dial
    into the account from a machine that is already configured and watch the steps.


    # Writing A Login Script In kppp


    Writing a login script is not a difficult process. To write your script while
    in the kppp program''s New Account dialog box, at the Login Script tab, do the
    following:


    +   1. Make sure Except is chosen in the drop-down list box.

    2. Type part of the first prompt that kppp needs to respond in to the list''s
    list. For example, if the prompt says "Enter User ID,", you would type "ID".

    3. Click the Add Button. The Expect appears in the text box on the bottom of the
    dialog box to the left, and the ID: term appears to its right.

    4. Choose in the drop-down list box.

    5. Enter the text that kppp needs to send in response to the prompt. In this case
    it is the User ID or login name. For example, if the ID is "author" then you would
    type "author" in the text box. The r tells kppp to press Enter afterwards.

    6. Click the Add button. The Send term appears on the left, and authorr appears
    on the right below the previous entry.


    262'
