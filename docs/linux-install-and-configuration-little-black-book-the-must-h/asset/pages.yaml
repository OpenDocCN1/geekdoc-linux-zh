    would add:


    purple.colors.org

    4. Log into each machine that will receive mail from the primary server in turn.
    For the sake of this example, the machine is purple.

    5. Edit the file /etc/sendmail.cf on each machine in turn.

    6. Locate the line that begins with “DR".


