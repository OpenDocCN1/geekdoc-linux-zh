  md: '# Considerations For Configuring Graphics


    The most important devices to configure correctly are your video display devices—the
    monitor and video card. You can recover from misconfigurations of other hardware,
    but you might not be able to recover if you have incorrect display settings. Take
    care to do this segment of the installation correctly.


    > WARNING! You can damage your hardware by using video settings that are higher
    than it can handle.


    # Video Cards


    If you went through the preparations outlined in Chapter 1, you should already
    have the necessary information about your video card. Here are some tips to help
    you set up these devices properly during the install process:


    +   - LIZARD do most of the work for you. It can autoprobe your video card and
