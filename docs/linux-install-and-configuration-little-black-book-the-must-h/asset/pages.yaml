  md: '# Compiling Source Code


    Although it is not possible to give a generic set of step by step instructions
    for compiling all source code, it is possible to give a series of guidelines for
    how to go about it. These guidelines are:


    +   - It is a standard with GNU software to include an INSTALL file with the source
    for a program. Read this file carefully if it is there. If the instructions are
    step by step or very useful, leave them open in a virtual terminal while you work
    in another.


    +   - If there is no INSTALL file, read the README file that comes with the source,
    along with any other text documents sent along with it. If the instructions are
    step by step or very useful, keep them open in a virtual terminal while you work
    on. Even if there is an INSTALL file, it is good to look at any README files as
    well.


    +   - Carefully pay attention to versions of libraries and other programs that
    may be required for the software. You may be fortunate and find that what you
    need to satisfy dependencies is available as an RPM you already have on CD-ROM.


    +   - Although it is not necessary to watch the screen every moment of a software
    compile, it can definitely help you to spot errors if you are having difficulties
    getting source to compile properly. If there is too much information and you cannot
    scroll back far enough, append the following to the end of the make statement:


    ```

    > output

    ```


    This addition places all of the output from the make process into the file named
    output, so you can go through it at your leisure when attempting to debug the
    compile.


    The commands you might use while compiling source are here, in the order you would
    likely use them:


    > NOTE: If the README or INSTALL file does not mention the list of make targets,
    look through the makefile. They will all be in there. It is possible that there
    will be an "all" option within the makefile that automates the entire process
    if it runs properly.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '+   1. make config—Examines your system setup and builds the specific configuration
    file necessary to build the program for your installation.


    +   2. make clean—Removes any files left over from previous failed attempts to
    compile the program.


    +   3. make—Uses the default target, which usually actually compiles the program.


    +   4. make install—Places all of the program''s components into place, giving
    them the proper ownerships and permissions.


    # # Installing A Binary


    Do the following to install a binary package:


    +   1. Uncompress it into a temporary directory, if it is compressed and/or archived.


    +   2. Read any README or INSTALL documentation that comes with the package. It
    does not hurt to look in the makefile as well. Here is where you can do things
    like edit the default paths for the installation if you so choose.


    +   3. Type “make install”.


    # # Installing A Package To Your Path Statement


    If you are using the bash or korn shell, you add a new directory to your path
    statement by doing the following:


    +   1. Log into the account whose path you want to change.


    NOTE: If you want to alter the path for all users at once, edit the file /etc/profile
    as root.


    +   2. Type “PATH=$PATH:additional_path” to append a path to the account''s current
    path statement. For example, if you wanted to append the path /usr/local/bin to
    your path statement, you would type “PATH=$PATH:/usr/local/bin”.


    NOTE: To see your full path statement, type “echo PATH”.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_342_0.png)'
  merge: -1
