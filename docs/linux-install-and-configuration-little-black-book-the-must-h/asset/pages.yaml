    | Table 14.1 | What type of data each level specifies to write to the log file.
    |

    | --- | --- |

    | Level | Data Written To Log |

    | emerg | The system has encountered an emergency and can no longer run. This
    could be a Linux issue, such as as permissions, that has nothing to do with the
    Web server. |

    | alert | The system can continue to function, but will not be able to function
    properly. Unpredictable behavior may result. |

    | crit | The system can continue to function correctly, but this functionality
