  md: '# Immediate Solutions


    # Managing RPMs


    You can manage your RPMs either by hand on the command line or via Red Hat and
    Caldera''s X tools. This section refers to the command line unless explicitly
    stated otherwise.


    NOTE: While the basics of RPMs are covered here, more aspects are included in
    Chapter 16.


    # Installing An RPM Package


    There are three primary flags for installing an RPM package:


    +   **rpm -i** is used to install a new package.

    **rpm -U** is used to upgrade a package or to install it if it is not already
    installed.

    **rpm -F** is used to upgrade a package, but not install it if it is not already
    installed.


    Supplemental flags commonly used with the primaries:


    +   **-v** is used to see verbose messages.

    **-h** is used to see hash marks (#) as progress markers during the install.


    A common combination to use:


    ```

    rpm -Uvh package-name.rpm

    ```


    This command upgrades or installs new packages, using verbose messages and hash
    marks for progress. You can replace the **i** or **F** with the **U**.


    # Removing An RPM Package


    To uninstall an RPM, use the **-e** flag. For example,


    ```

    rpm -e package-name

    ```


    # Listing What RPMs You Have Installed


    To get information on what RPMs you have installed, you use the query flag (**-q**).
    To see all RPMs you''ve installed, type "rpm -qa".


    ![](img/2b916f28ab4fa126e516b3f9293c726b_326_0.png)'
