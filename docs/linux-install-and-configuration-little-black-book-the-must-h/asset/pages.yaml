  md: '# Configuring Drive Sharing, Linux To Windows


    To configure which Linux drives are available to MS Windows machines, do the following:


    +   Log in as root on the Linux box that will serve as the Linux side Samba server.


    +   Edit the file /etc/smb.conf.


    +   Put the text "[global]" in the beginning.


    +   On the next line begin the global options according to the section "Building
    A Samba Configuration File".


    +   Create the individual shares in their own sections. See the section "Building
    A Samba Configuration File" for the details on how to create a share statement.
    Create a statement for each drive you want to share. For a more detailed example
    than in the statement-building section, you might want to offer a share to the
    general public named "public". You need to assign it a space in your file system.
    It''s often recommended that public areas are given their own partition to tighten
    the security bit, so a partition named "/public" is added to the drive. Perhaps
    you don''t want the general public to have write access, but you want them to
    be able to read the files there.


    ```

    [public]

    comment = Items available to the general public.

    path = /public

    public = yes

    readable = yes

    writeable = no

    ```


    +   Save and exit the file.


    +   Restart the Samba daemon by typing /etc/rc.d/init.d/smb stop then "/etc/rc.d/init.d/smb
    start" in Red Hat, or use "samba" instead of "smb" in Caldera.


    > TIP: A tool that tests whether smb.conf is assembled properly or not comes with
    the Samba suite. To run this tool, type the command "testparm".'
