    # Applying A Kernel Source Patch


    Kernels tend to be updated in small increments. Each increment fixes a specific
    bug, adds a new driver or features, or accomplishes some other task. After deciding
    which exact version you want, do the following:


    +   1. Download the major version''s source and then the source for each patch
    that leads up to that version.


    > TIP: If the major version you want to use is the same major version as the kernel
    you currently have, and the version you want to upgrade to is higher than what
    you already have, then you can start with the source on the distribution CD-ROM
    and patch it up from there.


    +   2. Using the cd command, change to the directory /usr/src.

    3. Use ls to list what is in the directory. If there is a /usr/src/linux-version-ext
    already there, this is the source for the kernel you''re already running.

    4. Create a new source directory by typing the command `mkdir linux-newversion-ext`.

    5. Copy the source and patches you downloaded into the new directory.

    6. Unpack the source with the tar and gunzip commands.

    7. Each patch should be handled individually and in order. Unpack the first patch
    with the tar and gunzip commands.

    8. Utilize the patch command to apply the patch to the source by typing `patch
    -p0 original < patchname`.


