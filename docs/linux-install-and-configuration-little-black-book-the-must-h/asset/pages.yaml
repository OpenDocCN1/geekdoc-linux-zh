  md: '# Assigning Value Through Command


    To assign the value of a variable to be the result of a command, put that command
    in back quotes (\`\") using the format:


    ```

    variable=`command''

    ```


    For example, using


    ```

    now=`date''

    ```


    sets the value of the variable "now" to the output of the date command, which
    is the current day, date, and time.


    # Using The Value Of A Variable


    To utilize the value of a variable, type the variable in the format:


    ```

    $variable

    ```


    # Prompting And Receiving Input


    You can also prompt the user within the script itself to enter necessary information.
    To do so, first prompt using the **echo** command (see Echo under "Debugging A
    Script"). Then utilize the **read** command in the format:


    ```

    read variable_name

    ```


    The **read** command tells the script to pause and wait for user input, then continue
    along with the script after Enter is pressed.


    # Ignoring Meta-Characters


    The following is a list of meta-characters that must be cancelled by a backslash
    if you wish to use them as normal characters, perhaps in an echo statement:


    ```

    /. > * ? $

    ```'
