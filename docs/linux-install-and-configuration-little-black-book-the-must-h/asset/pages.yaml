- img_proc: true
  md: "# Table 11.3 Options for the file /etc/host.conf.\n\n| Option | Format of Setting\
    \ | Purpose |\n| :--- | :--- | :--- |\n| alert | On or Off | Scan for attempts\
    \ at IP address spoofing. Any such attempts, if the option is on, are listed in\
    \ your system logs. |\n| multi | On or Off | Determines whether hosts are allowed,\
    \ for host queries, to have more than one IP address in /etc/hosts. |\n| nospoof\
    \ | On or Off | Prevent IP address spoofing by using reverse DNS resolution to\
    \ match the connection's hostname to its IP address. The cost of using this option\
    \ is increased load on your domain server. |\n| order | hosts, bind, nis | Specify\
    \ the order in which the various DNS resolution services are used. The hosts option\
    \ tells the system to look in the /etc/hosts file. The bind option tells the system\
    \ to consult a DNS server. NIS points to Network Information Service to try to\
    \ resolve the hostname (see section \"Determining If You Need NIS\" for more details).\
    \ You can use one, two, or all three of the settings. If you use more than one,\
    \ separate them with a single space. |\n trim | domain name | Tell the system\
    \ to remove the specific domain name and just look in /etc/hosts to resolve the\
    \ IP address. This is useful for speeding up local resolution, especially if you\
    \ are otherwise having DNS problems. |\n\nAfter you finish editing the /etc/host.conf\
    \ file (if this was necessary), you need to configure the DNS itself. To accomplish\
    \ this task, do the following:\n\n+   1. Log in as root.\n2. Edit the file /etc/resolv.conf.\n\
    3. Set the options that are appropriate for your DNS setup. The available options\
    \ for resolv.conf are shown in Table 11.4.\n4. Save and close the file."
