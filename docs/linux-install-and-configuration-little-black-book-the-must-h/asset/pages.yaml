  md: 'express this range is 192.156.12.1/255.255.255.252. Your rule addition statement
    would now look like:


    ```

    ipchains -A input -s 192.156.12.1/255.255.255.252

    ```


    Don''t press Enter yet; you''re still done.


    +   If you don''t want any incoming traffic allowed through the firewall to the
    machines unless it comes from those machines, you''re done. However, you can further
    specialize the rule by telling ipchains which protocol should be used by the incoming
    process that is to be allowed in; you do this with the -p (protocol) flag. The
    Telnet process uses the TCP protocol. Now the rule addition looks like:


    ```

    ipchains -A input -s 192.156.12.1/255.255.255.252 -p TCP

    ```


    Don''t press Enter yet.


    +   Creating a rule that surrounds a specific protocol is fairly broad. Instead,
    you can narrow that rule by specifying the port for the process you''re referring
    to, either by adding it onto the end by name or prefixing the port number with
    a colon. Look in the /etc/services file to find the port number for any network
    service. The rule statement now looks like one of the two lines:


    ```

    ipchains -A input -s 192.156.12.1/255.255.255.252 -p TCP :23 ALLOW

    ipchains -A input -s 192.156.12.1/255.255.255.252 -p TCP Telnet ALLOW

    ```


    You can now press Enter.


    +   The rule is useless unless you actually deny any other kind of traffic. The
    smartest way to do this—because the goal is to make rules for everything you want
    to allow—is to use the -P (policy) flag to deny all input. Then ipchains will
    look for specific rules for what to allow in. Such a policy statement would be:


    ```

    ipchains -P input DENY

    ```'
