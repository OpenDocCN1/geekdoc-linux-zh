  md: '# Copying Files And Directories


    Linux uses the cp command to copy files. The format used with cp is cp original
    destination; or, if you are copying more than one file to the same destination
    directory, use cp original1 original2 original3.


    NOTE: When you copy groups of files, the files'' destination must be a directory.


    The cp command also accepts the wildcards shown in Table 5.2. For example, the
    previous command could be shortened to cp original\*


    # Table 5.2 Wildcards commonly used with the cp command.


    | Flag | Purpose |

    | --- | --- |

    | * | Any grouping of unknown characters |

    | [] | Any one of the characters or range of characters contained within |

    | ? | Any single unknown character |


    # Moving Files And Directories


    Moving items is shorthand for copying, then deleting them. This task is accomplished
    with the mv command in the format mv original destination. The mv command is similar
    to the cp command in that it accepts the wildcards shown in Table 5.2 as well
    as allowing multiple files to be moved simultaneously into a directory.


    TIP: The mv command does not work when transferring files and directories to different
    partitions. A quick work around is to copy the files and directories, then delete
    the originals.


    # Removing Files


    To delete a file, use the rm command in the format rm_file. This command accepts
    the same wildcards as mv and cp (shown in Table 5.2) and, also, the -r flag (as
    discussed in the section "Removing Directories"). The same warnings about doing
    this as root still apply.'
