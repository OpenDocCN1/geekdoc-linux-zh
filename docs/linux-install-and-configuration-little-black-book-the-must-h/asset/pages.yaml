    # Deciding What Partitioning Tool To Use


    Numerous factors come into play when looking at partitioning tools. The primary
    issue is whether there is an existing Windows partition that needs to be resized
    to make room for a Linux partition, or whether there is sufficient unpartitioned
    drive space available. If there is sufficient space, then any of the partitioning
    programs will do. Choosing between them is mostly a matter of what interface makes
    the most sense to you. If you are highly familiar with disk partitioning, then
    any of the tools will do nicely. If this is the first time you have ever needed
    to partition disk drives, then avoid programs like fdisk, which are powerful but
    bare-bones.


    If you need to rearrange a hard drive and the Windows partitions on it to make
    room for Linux, the situation gets more complicated. See the section “Adjusting-Partitions
    Nondestructively With FIPS."


    Additional commercial programs are also available to create, delete, or even nondructively
    alter partitions. Some of the more popular partitioning tools are:


    +   - Partition Commander, available at www.v-com.com.

    - Partition Magic, available at www.powerquest.com.

    - Partition It, available at www.quarterdeck.com.'
