    # # An Example: Installing PGP


    To demonstrate the full process of finding and installing software, we will run
    through an example of installing the encryption package called Pretty Good Privacy
    (PGP). Using this package can increase your security, especially in conjunction
    with other programs—such as RPM''s ability to verify the validity of packages
    with a PGP signature—see Chapter 15 for more information.


    In order to make this a worthwhile example, we include some twists and turns to
    show how to recover from otherwise confusing problems.


    Follow these steps to add PGP to your system and then use it:


    +   1. Locate and download a reliable version of the package. This step is often
    best accomplished by going to the Web site maintained by the package''s creators
    or to one of the trusted Linux downloads sites. Otherwise, you risk fetching an
    altered version of the package, which could damage your system.


    +   2. Install the package. Sometimes this means properly placing a binary or
    using RPM. Or you might need to compile the source, and make **install** at the
    end of the process to put the compiled binaries in place.


    +   3. Locate and read the documentation for the package.


    # # Finding And Downloading PGP


    Locating software packages can be a simple or complex process. The actual location
    of this package is in Step 4. This example serves to detail what steps you might
    go through to find and download PGP. The process might be the following:


    +   1. PGP is not included among the initial RPMs that came with your Red Hat
    or Caldera CD-ROM because of encryption export reasons, so you will not find it.


    +   2. PGP is not on Red Hat or Caldera''s Web sites for the same export reasons.


    +   4. Going to Red Hat''s Web site at **www.redhat.com** and searching on the
    terms “PGP and download” leads to a statement that PGP


