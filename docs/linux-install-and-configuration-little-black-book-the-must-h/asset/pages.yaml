    | LILO Stage | Diagnosis and Suggestions |

    | --- | --- |

    | LI | The first stage of LILO loaded properly, and the second loaded could not
    be run. It is likely that the LILO files are not installed in the proper places.
    See the section "Running LILO" for how to fix this; if the problem persists, see
