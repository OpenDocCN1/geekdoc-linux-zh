  md: '# All Recommended Packages


    The recommended packages installation takes approximately 500MB of disk space.
    What you get with this install is a large number of tools, games, and applications
    that you may find useful or interesting. These applications include Netscape,
    graphics editors, multimedia tools, and a wider range of utilities than are available
    in the minimal install.


    This option is best for those who want to try Linux and the packages that commonly
    come with it, not the commercial packages they would have to buy in order to keep
    them longer than the trial period.


    # All Recommended Packages Plus Commercial


    The recommended plus commercial packages installation takes approximately 800MB
    of disk space. This install includes everything from the recommended version and,
    also, such commercial packages as WordPerfect and the StarOffice suite of applications.


    This option is best for those who want to try a full-fledged desktop machine,
    including word processing and office packages.


    # All Packages


    The full install takes approximately 14GB of disk space. This option installs
    every package that comes with Caldera OpenLinux. These packages include all of
    the graphics manipulation, office, and software development tools.


    This is the best option for those who want to try Caldera OpenLinux with every
    feature available and give it a serious test run. It''s also good for people who
    know they want to use a lot of the advertised by Caldera, but are not yet sure
    which ones. You can test what you want and then remove anything you''re not interested
    in using.


    > TIP: Remember that you can remove or add packages at a later date, regardless
    of which install option you choose in the beginning.'
