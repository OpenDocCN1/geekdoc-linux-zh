  md: '# Choosing A Backup Scheme


    There are various theories regarding how to do backups most efficiently. Which
    scheme is best for your system depends on your needs and how heavily the system
    is used. Here are some methods that highlight the ways of handling system backups.


    # Full Regular Backups


    The Grandfather-Father-Son (GFS) backup scheme requires eleven media for the first
    month, then an additional one for each subsequent month. Say that you have backups
    scheduled to run at 3 A.M. each day. You might handle the GFS scheme as follows:


    +   1. Monday through Sunday before 3 A.M. you insert backup media, labeling each
    one with its appropriate date.


    +   2. When you remove the Sunday media, you label it “Sunday Week 1” and put
    it aside.


    +   3. Monday through Saturday you re-use the exact same media as you did the
    previous week.


    +   4. On Sunday you use a new media.


    +   5. When you remove the Sunday media, you label it “Sunday Week 2” and put
    it aside.


    +   6. Monday through Saturday you re-use the same media as you did the previous
    weeks.


    +   7. On Sunday you use a new media.


    +   8. When you remove the Sunday media, label it “Sunday Week 3” and put it aside.


    +   9. Continue with the cycle.


    +   10. When you remove the fourth Sunday media, label it “Month, Year” and put
    it aside for permanent or at least long-term storage.


    +   11. Repeat the process, always using the same media for Monday through Saturday—until
    wear and tear makes it time to replace them—then the same media for the first
    three Sundays, then saving the last Sunday media for long-term storage.


    In the GFS backup scheme, the “son” is the daily, the “father” is the Sunday weekly,
    and the “grandfather” is the monthly.'
