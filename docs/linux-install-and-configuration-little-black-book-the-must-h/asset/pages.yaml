  md: '# Chapter 9 The Linux System


    (FSSTND), and what function the new partition serves. For example, if the new
    partition is meant to be a shared place for users to work on projects projects
    together, then perhaps a good mount point would be /home/projects.


    +   7. Choose the appropriate file system type. For the Linux partition in question,
    it would be ext2.


    +   8. Choose the rules to apply to the mounted device. The commonly used rules
    are shown in Table 9.2. To get a full listing, type "man mount".


    Because the partition being mounted for the example is meant for all users to
    share project data, the defaults option covers everything necessary.


    +   9. The final field specifies the device''s mount order. If the device is not
    one you have set to automount, then give this a value of zero (0). The root (/)
    partition always has a value of (1). From then on, the items are numbered in order
    of when they should be mounted, with integers from 2 and up.


    +   10. Enter all of the values at the end of the /etc/fstab file. Following the
    example, you would have:


    ```

    /dev/hdb2 /home/projects ext2 defaults 0 2

    ```


    The partition will not automatically mount until the system is rebooted. For now
    it can be mounted manually with the command


    ```

    mount /dev/hdb2 /home/projects

    ```


    Table 9.2 Often used rules for mounting devices automatically through /etc/fstab.


    | Rule | Purpose |

    | auto | Mount the defined device automatically at boot time. |

    | defaults | Mount the defined device with the defaults used for most permanent
    file system additions, such as automount and read-write access. |

    | noauto | Do not mount the defined device at boot time. |

    | nouser | Don''t allow anyone who does not have superuser access to mount this
    device. |

    | ro | Mount the defined device with read-only access. |

    | rw | Mount the defined device with read-write access. |

    | user | Any user is allowed to mount the device. |


