  md: '# In Brief


    One of the first things many people want to do after they get their Linux box
    set up is to connect it to the Internet. Machines that are not hooked up to a
    LAN that is already net-connected generally have to be configured to use a modem
    to make their connections. They might even be serving as the connection between
    the LAN itself and the Internet. This chapter covers making this connection to
    the Internet, as well as how to use some of the Linux Internet clients.


    See the section "Connecting To Your ISP" for the basic steps on how to proceed.


    # The PPP Dialers


    Connecting to the Internet with a modem generally involves configuring a PPP connection.
    Fortunately, both distributions provide you with tools to help with this process:


    +   * The Calder distribution comes with the GUI tool kppp. See the section "Setting
    Up A PPP Connection with kppp" for more information.

    * The Red Hat distribution''s Linuxconf tool can set up your PPP connection as
    well. See the section "Setting Up A PPP Connection with Linuxconf" for more information.

    * The tool ppsestup is also available at the command-line level for both distributions.


    # The Internet Clients


    Each operating system has its own selection of Internet clients; Linux is no exception.
    In general, two different types of tools are available: graphical tools and command-line
    tools. Which type you use is entirely to you and your needs. As usual, command-line
    tools are sometimes cryptic, and GUI tools take up more RAM—and therefore slow
    down your system.


    > TIP: The command-line tools can also be used in a terminal window in the GUI.'
  merge: -1
  pgno: 285
