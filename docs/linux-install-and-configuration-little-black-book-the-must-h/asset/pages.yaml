    access any ports on machines that are also within the LAN without using the proxy
    server, assuming for the sake of the example that the LAN covers the range of
    addresses 192.168.15.*:


    ```

    permit - 192.168.15. - -

    ```


    +   4. Add a line to tell the client machine it has to go through the proxy server
    to access anything outside the LAN. Unfortunately, all lines within this file
    are formatted the same way. The only difference is that this line starts with
    socks5 to denote that it points to the SOCKS version 5 server. The line will look
    similar to the following if the proxy server is located on the machine 192.168.15.3:


    ```

    socks5 - - - 192.168.15.3

    ```


    +   5. Save and exit the file.'
