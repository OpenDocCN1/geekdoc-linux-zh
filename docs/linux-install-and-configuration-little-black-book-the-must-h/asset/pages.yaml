    # Creating Aliases


    After a while it becomes clear that you type certain complex commands a lot, or
    tend to almost always use the same flags for a particular command. To reduce the
    amount of typing you do, you can create aliases, or shortcuts that incorporate
    these specifics into one single command. To create aliases, edit the `.bash_profile`
    file located in your home directory. Regardless of which account you''re logged
    into, you can type `vi ~/.bash_profile`.


    > NOTE: These instructions apply to the bash shell, which is the default shell
    used in Linux.


    Go to the bottom of the file and build your alias statements. They''re done in
    the format `alias name=''command''`. For example, to add an alias that changes
    the `ls` command to be by default `ls -la`, the code added would be


    ```

    alias ls=''ls -la''

    ```


    To utilize the new aliases, log out of the account and then back in.


    > TIP: If you want to get really fancy and have a color monitor, try typing: `alias
    ''ls -laF --colorize=yes''`.


