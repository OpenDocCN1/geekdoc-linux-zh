  md: '# In Brief


    The Shell script is an immensely useful administrative tool. It can be used to
    automate repetitive or complex tasks usually done at the command line. Scripts
    can also be used to automate basic tasks for users who do not have much knowledge
    of Linux, or more complex user tasks that only those who have a solid grounding
    in Linux could otherwise accomplish.


    # The Shells


    A shell is an interface between you and the Linux kernel itself. and you can choose
    which shell you prefer to work with. Each shell has its own specialized features
    that make it interesting and useful to people according to their personal needs.
    Each shell also has its own syntax for dealing with commands, environment variables,
    and more:


    +   - The bash shell is the default in Linux, as well as the shell most used for
    the root account.


    +   - The C shell is so named because its syntax is much like the C programming
    language; it is popular among C programmers for this reason.


    +   - The Korn shell used in Linux is not actually the standard Korn shell, but
    a public domain version called pdksh (Public Domain Korn Shell). It shares some
    features with the C shell and also has a number of new features that make it a
    favorite of many people who write a lot of shell scripts. It is available on the
    Red Hat anda CD-ROMs in its own package.


    | Related solutions: | Found on page: |

    | Mounting Onto The File System | 168 |

    | Installing An RPM Package | 295 |


    # Good Scripting Habits


    Although there is no universal set of instructions for writing shell scripts,
    here are some good habits to follow along the way:


    +   - It is often wise to put all of your shell scripts together in one place,
    for both file and path management purposes. This fact is'
