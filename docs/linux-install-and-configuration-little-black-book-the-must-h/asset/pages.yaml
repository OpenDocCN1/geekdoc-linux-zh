  md: '# Naming The Machine


    To assign a name to the specific machine you are configuring, do the following:


    +   1. Log in as `root`.

    2. Edit the file `/etc/sysconfig/network`.

    3. Locate the line.


    ```

    HOSTNAME=localhost.localdomain

    ```


    **TIP:** This line may look slightly different if you have already assigned a
    host or domain. The HOSTNAME component is the key to look for.


    +   4. Change the word “localhost” to the name of the machine. For example, to
    assign the name “blue” you could change the line to:


    ```

    HOSTNAME=blue.localdomain

    ```


    +   5. Save and close the file. The new hostname will be reflected by exiting
    any login sessions and logging back in, and stopping restarting any programs that
    need the hostname information. In many ways, the easiest method of handling all
    of this is a quick reboot.


    **TIP:** You can change the name of a machine at any time using this method. However,
    if the machine is listed in users'' bookmarks then runs will be broken until users
    find its new location. Changing the machine''s listing in your DNS tables is imperative.


