  md: '# In Brief


    As you become more comfortable with your system, you will find more uses for it.
    Perhaps you will simply want to see what other software is out there. You will
    quickly find that adding Linux software is not always straightforward as the novice
    as in other operating systems. If what you download is an RPM, you are in luck;
    the installation work is done for you by the package manager. If not, you have
    more work ahead of you.


    Fortunately, the task of installing binaries and source becomes easier the more
    you deal with the issue.


    # Choosing Where To Install Software


    If you are the only person using your Linux box, then where you install software
    is not as large an issue in multiuser boxes or on a LAN. But some of these principles
    still apply, because software must be installed in a place that allows it to be
    used as necessary. Haphazard and inconsistent file system policies can eventually
    cause problems.


    # Within The Linux File System Standard


    The Linux file system standard (FSSTND) lays out the structure of the Linux directory
    tree. It is not necessary for you to follow this standard, but there are some
    compelling reasons to do so:


    +   - If you stay within the standard, all of your packages remain together whether
    you place them by hand or with a package manager, such as RPM.


    +   - Staying within the standard allows you to become familiar with the layout
    of other Unix file systems that also follow the standard, which is most of them.
    This makes your system administration skills portable, and it also makes it easier
    if you have to have someone look after your system when you are unavailable.


    +   - Using the standard when you place files manually makes it easier for programs
    to find other programs. Otherwise, you need to modify configuration files or source
    code to tell new programs where to look.


    A brief look at the Linux file system standard is shown in Table 16.1.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Table 16.1 The FSSTND layout.


    | Directory | Use |

    | --- | --- |

    | / | The root directory of your file system |

    | /bin | Binaries necessary for proper command function |

    | /boot | Files needed by your boot loader (LILO) |

    | /dev | Device files used to tell Linux how to access the different aspects of
    your hardware |

    | /etc | Configuration files that apply only to the specific machine |

    | /home | Home directories for your users |

    | /lib | Shared libraries needed by programs within the root system |

    | /mnt | Location to mount temporary file systems, usually each with its own subdirectory
    |

    | /opt | Used by some to house add-on binaries |

    | /root | Home directory for the root user |

    | /sbin | Binaries necessary for proper system function |

    | /tmp | Temporary files for both users and programs |

    | /usr | Public applications for use by most or all users. This portion of the
    file system is sometimes kept centrally on a specific server and then mounted
    by all machines in the LAN, to allow one central /usr management point. |

    | /var | Variable data such as program logs |


    To see the complete FSSTND, go to www.pathname.com or do a Web search on the acronym
    and you will get a number of detailed and general breakdowns.


    # # Permission Issues


    One important item to consider when installing software is what permissions are.
    The issues involved in these considerations are:


    +   - Is the program meant to only be run by root? Or by a specific user or group?
    Or by all users?

    - What is the program trying to do? Does it need to run as a specific user or
    group?

    - What file or directory resources does this program need to access during operation?

    - Do you want the program to be within your default path? The average user''s
    default path?'
  merge: -1
