  md: '# # LINUX

    Install and Configuration

    Little Black Book


    The Essential Guide to Installing and Configuring the Red Hat Caldera Linux Distributions
    for Users and Administrators


    The Linux Install and Configuration Little Black Book is a problem-solving work
    for users who want to have Red Hat or Caldera Linux running quickly and smoothly
    while adhering to their particular specifications. Sets of task-oriented solutions
    guide you through both setup procedures and the tweaking and custom configuration
    that set your system apart. Whether you are setting up a single Linux box or a
    LAN of task-specific machines, the answers you need are in this book.


    This book is written for:


    +   - People who want to set up a Linux box with Red Hat or Caldera and learn
    the intricate ins and outs of configuration and administration.

    - Experienced system administrators who are new to the world of Linux and Unix
    and want to quickly get up to speed.

    - Understand what needs to be done before setting up Linux

    - Install the Red Hat and Caldera Linux distributions

    - Understand and use essential Linux commands

    - Set up Linux to run efficiently and effectively

    - Choose window managers or desktop environments

    - Create and manage user accounts

    - Manage partitions and filesystems

    - Use Samba and NFS

    - Connect to the Internet with your Linux box

    - Set up Linux Internet services

    - Manage file packages with RPM

    - Locate and install new programs

    - Compile and upgrade your Linux kernel

    - Write custom shell scripts

    - Write basic programs using PERL

    - Secure your Linux system


    This book will help you:


    # CORIOLIS OPEN PRESS

    Return To The Source "


    Open Source demands a dazzling class of software that includes all source code—and
    it''s completely free! Coriolis Press books help you understand products like
    Linux, Apache, and, more.


    Little Black Books Are Written For:


    +   - System and network administrators

    - Program and software engineers


    # How Do Little Black Books Help You?


    Little Black Books are terse, easy "thumbable" question-answers and problem solvers.
    The format helps you find what you''re looking for fast, with the diagrams and
    code you need to make it happen.


    # Look For The

    CoriolisOpen” Press Family


    +   - The Commentary series gives you indexed source code and annotations for
    major products.

    - Black Books provide immediate solutions to global programming and administrative
    challenges.

    - Little Books provide command and syntax summaries and quick explanations of
    Open source.

    - The White Papers series provides Open Source documentation in a readable, well-mixed
    format.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_435_0.png)


    User Level: Intermediate to Advanced


