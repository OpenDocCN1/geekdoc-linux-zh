  md: '# Consider Adding A Firewall


    You need to at least consider adding a firewall if:


    +   - You have vital business data that cannot put on a machine that is independent
    from your network. What would happen if this data was stolen? Erased or changed
    by intruders? Although good backup techniques can protect against data loss to
    a certain point, sometimes even a few hours’ of lost data is disastrous.


    +   - Your Web site is in any high profile, whether because of the actions of
    the proprietors or users. If a particular user is controversial and angers people,
    or if the site’s theme is controversial, somebody might try to break in to “punish
    the offender.” If the site is high profile simply by having a well-known name,
    somebody might try to break in just to say they did it.


    +   - You need to abstract how many machines are really in your network and which
    machine has address in order to make it less appealing to intruders.


    | Related solution: | Found on page: |

    | Choosing A Backup Scheme | 365 |


    # Improve Security, But No Firewall Needed


    The answer to your security need may not be a firewall at all:


    +   - Does your entire network need to be connected to the Internet at all? Perhaps
    your office or LAN only needs to have one or two net-connected machines, which
    don’t need to be connected to the rest of the LAN.


    +   - Can the machine with the most vital data be removed from the LAN? That might
    be all that’s necessary.


    +   - Is the Internet connection permanent or on-demand? An on-demand connection
    generally does not need a firewall, unless the amount of time it is connected
    sufficiently close to permanent for a break-in to be possible. This fact is especially
    true if the Internet connection does not have the same IP address every time.


    # Firewall Too Cumbersome


    For some types of network setups and settings, a firewall is more cumbersome than
    it’s worth. Some examples of these types of situations are:


    +   - The users on your site need access to many different types of services on
    the Internet. If so, the firewall will eventually be so'
  merge: -1
  pgno: 410
- img_proc: true
  md: 'poked full of holes as you allow data to go in and out that it will be virtually
    useless; you will waste much of your time debugging the rulesets.


    +   - Some software cannot work through a firewall, but it requires special programming
    to accomplish this. If the software needed within your LAN doesn''t function through
    a firewall, look for another security solution.


    # Tightening Network Drive Access


    When you set up services such as FTP, Samba, or NFS, which allow people to access
    network drives remotely, you automatically open yourself to potential problems.
    One rule in security is to assume that, if you offer a network service, someone''s
    going to try to look for a way in. Follow this general process to tighten network
    drive access:


    +   1. Open the access control files for the service you want to tighten.


    +   2. Examine what exactly you are trying to offer with the service. Are you
    merely trying to accommodate a few people? A project group? The entire office?


    +   3. Identify the exact range of people you are trying to provide the particular
    service to, and narrow it down to a spread of IP addresses or specific hosts on
    a domain.


    +   4. Create precise rules for these groups to use to access the service, and
    deny access to all others.


    # Filtering Packets Out


    Setting up a firewall with ipchains involves configuring the ipchains packet-filtering
    aspects. To set this up, do the following:


    +   1. Log in root.


    +   2. Test to see if ipchains is currently installed on your system by typing
    "rpm -q ipchains". If the package is not installed, see the section "Installing
    ipchains" and then return to this section at Step 3.


    +   3. Type "ipchains -L" to see the chains that currently exist. What do you
    see if you have never set these options before are the lines:'
  merge: -1
