    | a | Enter insert mode directly after the current cursor position. |

    | A | Enter insert mode at the end of the current line. |

    | i | Enter insert mode directly in front of the cursor position. |

    | I | Enter insert mode at the beginning of the line. |

    | 0 | Create a new line below the cursor and move to it, entering insert mode.
    |

    | O | Create a new line above the cursor and move to it, entering insert mode.
