    # # File Permissions And Ownerships


    One thing for the average Macintosh and Windows user to get used to—except for
    Windows NT users, who are familiar with NT''s Access Control List, and those Macintosh
    users who have set up the file sharing feature—is the concept of files and directories
    having owners and permissions. Every directory and file has an owner, a group,
    and a set of permissions. The permissions themselves are broken down into segments
    that pertain to the owner, the group, and all users.


    > NOTE: The Macintosh''s file sharing setup is actually structured after the Unix
    permission setup, so those who are familiar with setting up Mac security will
    have an easy time with Linux permissions.


    The permissions for a file are the first item to the left of a long-format (is
    -l) file listing. These items can be broken down into ten slots.


    # # The Type Bit


    The first bit, or character, of the permission set refers to the type of item
    being referenced, as shown in Figure 5.1. A number of different items can occupy
    this bit:


    +   - -—Means the object is an ordinary file

    - d—Means the object is a directory

    - l—Means the object is a symbolic link (discussed in the section "Creating Links")

    - s—Means the executable runs as the owner of the file, no matter who invokes
    it

    - c—Means the object is a character device driver

    - b—Means the object is a block device driver


    ```

    drwxrwxrwx

    ↑

    Type Bit

    ```


    Figure 5.1 The type bit among the rest of the permission set.


    82'
