    # # Caldera’s Installation Options


    One of the choices offered during the install process involves which packages
    are installed. These choices are broken into four groups:


    +   * Minimum set

    * All recommended

    * All recommended plus commercial

    * All packages


    Although some information is given toward the right-hand side of the screen what
    is involved with these choices, a more detailed description is offered here so
    you can make a more educated decision. The only options that are listed as available
    are the ones you have the hard drive space to support.


    # ## Minimal Install


    The minimal install takes approximately 160MB of disk space. It is by far the
    fastest of the options to install, but that is because it installs the least amount
    of material. What you get with this install are the basic tools that come with
    Linux and KDE (the GUI). Any additional packages, such as Netscape, games, graphics
    tools, or other applications, are not included in this installation option.


    This option is best for machines where you know you are going to heavily customize
    what software is installed and what is not. This is the option to use if you don''t
    intend to use the GUI and plan on disabling it. That is common for a server machine,
    which would only be slowed down by the GUI and whose disk space would be wasted
    by a lot of extra GUI tools.


    **TIP:** With any of the installation options, if you don''t want the machine
    to automatically boot into the GUI, set your startup runlevel to three. This setting
    will boot you directly to the command line.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_60_0.png)


    29'
