    # Mounting A Prepared Device Type


    Once the instructions in “Shortening Common Mount Commands” are followed, you
    can mount the device by first placing it in the drive (for example, an MS-DOS
    floppy) and then typing “mount /mnt/mountpoint” (for example, mount /mnt/dosfloppy).


    # Automatically Mounting A Device At Boot Time


    Setting a device to automount onto the file system involves inserting it into
    /etc/fstab. To accomplish this task, do the following:


    +   1. Log in as **root**.

    2. Open the file /etc/fstab with a command such as vi /etc/fstab.

    3. If you are using vi, type “G” to go to the end of the file, then “o” to open
    a new line.

    4. Entries for /etc/fstab follow the following format:


    ```

    /dev/device mountpoint type rules 0 order

    ```


    +   5. Determine the device you want to mount. For example, perhaps you added
    a second IDE hard drive and allocated its partition for Linux use. The device
    then would be /dev/hdb2.

    6. Create the mount point where you want to mount this device. It is important
    to make sure this junction is carefully considered, because you are making it
    a part of the permanent file system. Typically the /mnt hierarchy is for temporary
    additions, so this time the new partition should be added somewhere else. This
    decision is a matter of taste, the File System Standard'
