  md: '# Chapter 18 Writing Shell Scripts


    The prompt. In this case, the point is to search and replace a URL within a Web
    page as a springboard toward eventually making a more complex package. To accomplish
    this search-and-replace, you use the `sed` command.


    +   Read the man page and other available resources for sed. It is possible to
    accomplish your task using sed without a script around it, but creating a script
    will make it easier for you to do the same or a similar task again without having
    to relearn how to use the complexities of the sed editor.


    +   The first thing you may notice is that to separate components of the search-and-replace
    terms requires. The default delimiter is the front slash (/). However, because
    the search-and-replace terms are URLs, there will be slashes within these terms.
    This issue leaves two choices:


    +   To escape the front slash with the escape character, the back slash (\). Escaping
    a character lets the interpreter know that character is meant just as it is, and
    not as a special character (like a delimiter). For example, to search for the
    URL www.green.org/lime, you would type the search term:


    www.green.org\/lime/


    In the example this option is chosen because it is the standard format used for
    programs that accept regular expressions.


    +   To use an entirely different delimiter. You are not required to always use
    the front slash. For example, because there is no need to use the `http` part
    of the URL in the search-and-replace term, a colon (:) could be used as a delimiter.


    > TIP: A meta-character is a character that gives information about other characters.
    It is a "special character"; rather than just being the character it, it has a
    special purpose. For example, the front slash (/) is often a meta-character when
    used to build sed commands because it is used to break the command into its components.


    +   Now, build the sed statement. The specific thing you want to search for and
    replace is the URL www.peach.org, changing it to `http://watermelon.com/pink`.
    Because the first part, http://, does not need to be changed, the statement looks
    like this:


    www\.peach\.org\/watermelon\.com\/pink//


