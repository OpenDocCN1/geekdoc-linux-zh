    # Installing SOCKS


    To install the SOCKS proxying firewall package, do the following:


    +   1. Download the SOCKS source code from www.socks.nec.com into a temporary
    directory.

    2. Uncompress the source with the gunzip command.

    3. Unpack the source with the tar command.

    4. Change to the new SOCKS directory within the temporary directory with the cd
    command.

    5. Read the INSTALL file with the more command to ensure that the instructions
    in the current version are not different from those listed here.

    6. Be sure that the C compiler is already installed. To check this, type “rpm
    -q egcs”. If the package is not already installed, it is on both the Red Hat and
    Caldera CD-ROMs.

    7. Be sure that the C libraries are already installed. To check this, type “rpm
    -q glibc-dev”. at the prompt. As the autoconfiguration runs, it is not already
    installed, it is on both the Red Hat and Caldera CD-ROMs.

    8. Type “./configure” at the prompt. As the autoconfiguration runs, it prints
    out each feature it is checking on your machine.


    NOTE: Both this phase and the next can take some time to complete.


    +   9. To actually compile the SOCKS server, type “make” at the prompt. Compilation
    messages slowly scroll onto the screen, depending on the speed of your machine.

    10. To place the server and its components where they need to go, type “make install”.

    11. To remove the temporary files generated during the compile process, type “make
    clean”.


    TIP: To find the SOCKS man page, type “man socks5”.'
