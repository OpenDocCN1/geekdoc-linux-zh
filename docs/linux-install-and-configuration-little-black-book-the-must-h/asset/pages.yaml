  md: '# In Brief


    Many Linux users either choose the operating system because they enjoy programming,
    or find that they become at least rudimentary programmers over time as they learn
    more about how to work with their systems and compile the source code they download
    for their system. The more you get into programming, the more important it is
    to know the tools at your disposal and how to upgrade them, because the day eventually
    comes when you downloaded requires to use them.


    # C Programming Tools


    A programming language such as C is compiled, not interpreted. This means that
    it requires a compiler at the very least in order for you to be able to utilize
    the language. On top of this, one of the greatest advantages of the C language
    is its ability to use shared libraries. These libraries contain chunks of code
    that keep programmers from having to reinvent the wheel in accomplish basic tasks.
    There are also specialized libraries available for industry-specific programming,
    such as computer telephony libraries. Some specialized libraries come on the distribution
    CD-ROMs; others are available on the Internet, either for download or for sale.


    > **NOTE:** The C programming language is a complex instrument. This chapter in
    no way claims to teach you how to use it. The focus here is to show what tools
    are available and how to find and install them.


    # C Programming In Linux


    If you come from an MS Windows programming environment where you are used to using
    project files, then programming in C in Linux is going to take some getting used
    to it. You will need to learn how to build a *Makefile* by hand. See the section
    "Building A Simple Makefile" for a starter example.'
