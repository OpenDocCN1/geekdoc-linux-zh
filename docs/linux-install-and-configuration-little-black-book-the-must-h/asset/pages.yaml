    # Stopping The Samba Daemons From Running The Startup Scripts


    If you want smbd and nmbd to run from within inetd, and your system is running
    them by default from the startup scripts, you will need to set the daemons so
    that they will not run from the system startup scripts. To accomplish this, do
    as root.


    +   1. Log in as root.

    2. Type "ls -l /etc/rc.d/rc1.d *samba". If there is a link there, delete it with
    "rm /etc/rc.d/rc1.d filename".

    3. Type "ls -l /etc/rc.d/rc3.d *samba". If there is a link there, delete it with
    "rm /etc/rc.d/rc3.d filename".

    4. Type "ls -l /etc/rc.d/rc6.d *samba". If there is a link there, delete it with
    "rm /etc/rc.d/rc6.d filename".


    # Starting The Samba Daemons By Hand


    To start smbd and nmbd by hand, log in as root and type one of the following:


    +   * If using Red Hat Linux, type "/etc/rc.d/init.d/smb start".

    * If using Caldera OpenLinux, type "/etc/rc.d/init.d/samba start".'
