  md: '# # Shutting Down Your System


    To shut down your system cleanly, use the **shutdown** command. You can use a
    number of variables, depending on what you intend to do. To shut down in order
    to shut the machine off, log on as **root** and type “shutdown -h”.


    If you want the machine to reboot when it''s finished shutting down, type “shutdown
    -r”.


    Either of these commands by itself terminates all processes, including logging
    out users. However, you can add additional flags to customize the command''s behavior.
    If you want to reboot quickly the next time, shut off file system checking for
    the next boot by adding the **-f** flag. For example, to shut the machine off
    for maintenance that does not involve the hard drive and thus avoid the hard drive
    check as it comes back up later, type “shutdown -hf”.


    If you have additional users on the system, you may choose to give them some time
    (in minutes) to save their work and log out. To add a time delay and custom message
    to, say, reboot the system, use the following format:


    ```

    Shutdown -rft 5 Quick maintenance reboot

    ```


    > **TIP:** If you always use the -f flag, you will eventually be forced by the
    operating system to do a file system check.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_78_0.png)'
