  md: '# Immediate Solutions


    # Writing A Script


    There are a number of basic steps for writing a shell script:


    +   1. Begin by editing the text file that will contain your script.

    2. Add the shell identifier line so Linux knows which shell language you are using.

    3. Build your shell script.

    4. Save and exit the script file.

    5. Change the permissions and ownerships of the script so it is executable by
    the right user accounts with, for example, "chmod +x webcast"

    6. Run the script to test it.

    7. Take steps to debug if necessary, then return to Step 6.

    8. Move the completed script to its new home if necessary.

    9. Add to your path statement if necessary.


    # Assigning Value To A Variable


    You can either assign values directly to a variable, or assign the variable to
    be the output of a command. Whether you do one or the other is mostly dependent
    on where the value you want to assign is coming from.


    # Assigning Value Directly


    To assign a value to a variable, use the format:


    ```

    variable=value

    ```


    Remember that if you want to use meta-characters within the value you need to
    cancel or ignore them (see the section "Ignoring Meta-Characters"). Also


    ```

    name="Smith, Adam"

    ```


    ![](img/2b916f28ab4fa126e516b3f9293c726b_358_0.png)'
