  md: 'Other useful variants are:


    +   - **rpm -Vf** is used to verify all installed RPM packages.

    - **rpm -Vf path-to-program** is used to verify the package that a particular
    malfunctioning program belongs to. For example, if you are having difficulties
    with the **korn** shell, which is installed at /bin/ksh, then you might type "rpm
    -Vf /bin/ksh"

    - **rpm -Vp** checks installed packages against your CD-ROM or other media. It
    is used if you want to verify your RPM database, but have lost it.


    **TIP:** Running rpm -Vp regularly—perhaps in a cron job—is a good way of making
    sure no one has changed the packages you installed. This action requires that
    the CD-ROM be in the machine when the cron job will run.


