  md: '# Immediate Solutions


    # Checking Your Current Network Settings


    To check your current network settings, first log in as **root**. Then type “netstat
    -nr”. The *n* flag tells netstat to display addresses as raw IP numbers rather
    than looking up the full domain information, and the *r* flag tells netstat to
    only display information for items using TCP/IP.


    +   **TIP:** A quick way to determine if DNS is working is to try "netstat -nr"
    and then "netstat", or pinging a machine at its IP address and then with its name.


    # Setting The IP''s Address


    To set your machine''s IP address—if not already set during the install—do the
    following:


    +   1. Log in as **root**.

    2. Edit the file /etc/hosts.

    3. Add a new line for your current host. Leave the loopback line (127.0.0.1) intact.
    This should look similar to:


    ```

    127.0.0.1       localhost       localhost.localdomain

    ```


    The new line should be in at least two parts: the IP address, then the machine''s
    full name (including domain). You can also add aliases if you choose. For example,
    if you are configuring the computer “blue” on the domain “colors.org” to have
    the IP address 185.36.20.3, the line you might add beneath the loopback line is:


    ```

    185.36.20.3       blue.colors.org       blue

    ```


    +   4. Save and exit the file. Any login sessions and programs that the domain
    name need to be restarted at this point. Sometimes it is simplest to reboot the
    machine.'
  merge: -1
