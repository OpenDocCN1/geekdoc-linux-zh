  md: '# Moving Commands To The Background


    To move a command you have running on the screen to the background in order to
    free up that terminal for other uses, use the bg (background) command. To move
    a program into the background, do the following:


    +   - Type "jobs" to get the job number for the command.

    - Use the key combination Alt+FX, where X is the number of a function key that
    corresponds to a free terminal.

    - Log into the same account you''re using in the other terminal window.

    - Type "bg job" to move the job into the background.


    TIP: Often a shortcut for accomplishing this task is to press the key combination
    Ctrl+Z while in the terminal that is tied up while showing the process results.


    # Moving Backgrounded Commands To The Foreground


    To move a command you have running in the background to the screen so you can
    work with it, first obtain the job number, as described in the section "Identifying
    Currently Running Commands," and then use the fg (foreground) program in the format
    fg job.


    # Canceling Commands In Progress


    You can cancel commands within Linux in more than one way. The fast way to cancel
    a program that''s currently running is to press Ctrl+C. This method only works,
    however, if you have access to the program itself in a virtual terminal.


    Another way to stop an errant program is by killing its process. To accomplish
    this, do the following:


    +   - Get the process ID by typing "ps", either as the person who ran the program
    or as root. If you''re on as root, type "ps -aux" to see every process that''s
    running regardless of who owns it.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_132_0.png)'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Chapter 5 Using Linux


    +   2. Look through the listing and locate the errant process. Usually you can
    spot it because the program''s name is to the far right of the listing.


    +   3. Look to the left of the process line in the ps output to get its ID number.


    +   4. Type “kill ID” to try to gently stop the process.


    +   5. Use the ps command to see if the process is still running.


    +   6. If it isn’t running, you’re done. If it is running, type “kill -9 ID”.
    This command should take care of it, but it tends to be because the process is
    not cleanly shut down, so it should be avoided when not necessary.


    # Clearing The Screen


    To clear the screen, use the clear command.


    # Running Multiple Commands At Once


    You can string multiple commands together by separating them with a semicolon
    (;). For example, to send the output of the command ls -la /etc/rc.init.d to the
    file systeminits and then view the file with more, use the following:


    ```

    ls -la /etc/rc.init.d > systeminits ; more systeminits

    ```


    Another way to group a number of commands together is with a shell script. Shell
    scripting is discussed in detail in Chapter 18.


    # Logging Out


    To log out of an account, use the logout command.


    102'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Rebooting The Machine


    To reboot a Linux box, type either "reboot" or the more standard "shutdown -r
    now". If the machine locks up and will not accept typing on the keyboard, sometimes
    the key combination Ctrl+Alt+Del will work, but most avoid this whenever possible
    because it may not shut down your system cleanly. However, taking a look in /etc/inittab
    may show that your Ctrl+Alt+Del is aliased to "shutdown -h now". If this is so,
    then it can be used safely to shut down the machine and power it off.


    # Shutting Down The Machine


    To shut your machine down so you can turn the power off, use the halt command
    or the more standard shutdown -h now.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_134_0.png)'
