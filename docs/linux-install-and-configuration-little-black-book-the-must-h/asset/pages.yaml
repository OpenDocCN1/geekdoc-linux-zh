  md: '# # Deciding On A Removable-Rack Hard Drive System


    A removable-rack hard drive is a familiar concept for some people and unheard
    of others. This unit consists of standard hard drives placed into cassettes, which
    are then plugged into a mounting bay that is installed directly in your computer.
    A representation of this concept is shown in Figure 20.1.


    When planning a removable-rack system, follow these considerations:


    +   - Determine the size of the hard drive(s) you want to mount. The drives are
    often 3.5 inches, unless they''re Ultra-Wide (UW) SCSI.


    +   - Determine the type of drive(s) you need to mount; for example, IDE, SCSI
    I, SCSI II, SCSI III, or UW SCSI.


    +   - Ensure that you have the drive bay space required. Many rack mounting kits
    need a 5.25 inch bay, plus approximately one inch of room extra if a fan is included.


    +   - How many drawers might you need? Keep in mind that not all cassettes are
    compatible with all bays, so it''s worth it to order a few extras.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_402_0.png)


    Figure 20.1 Removable-rack hard drives.'
