  md: 'The timing terms in the format are all numeric. They stand for, in order:


    +   - Minutes after the hour the task should occur.

    - Hour of the day (24 hour format) when the task should occur.

    - Day of the month when the task should occur.

    - Month of the year when the task should occur.

    - Day of the week when the task should occur—beginning with Sunday, which is 0.


    These numbers can be used in the following forms:


    +   - Ranges, such as 0-22.

    - Sequences, such as 1,3,5.

    - Singular, such as 12.

    - An asterisk (*), meaning "all".


    The *task* term is the name of the program or script you want to run at the assigned
    time. Include any switches necessary.


    For example, perhaps you want to add an item to the weekly cron file that checks
    disk usage and then mails the results to the root account. This job should run
    at midnight on the fifteenth and thirtieth of each month. The format used to enter
    this item would be:


    00 00 15,30 * * df


    > **TIP:** Why not include instructions to mail the output? All output from system
    cron jobs is automatically mailed to **root**.


    # # Choosing Backup Software


    Quite a few backup packages are available for Linux. Here are some considerations
    to keep in mind when trying to choose them:


    +   - Will the software work with your kernel version?

    - Will the software work with your hardware?

    - Does the software have options that take both your frequency and volume needs
    into account?

    - Does the software support unattended backups?'
