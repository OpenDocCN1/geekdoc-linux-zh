    # # Deciding How Many Partitions To Make


    You must have at least two partitions to run Linux. The first is the root (/)
    partition, which is where all of the files necessary to use Linux are placed (if
    there are only two partitions), and the second is the swap partition. A swap partition
    supplements the RAM in your machine to smooth out the tasks it needs to run. This
    concept is similar to the virtual memory used in Windows. However, swap space
    is not nearly as fast as actual RAM. A good rule in general to follow is to make
    the swap space approximately equal to how RAM you have, with the limitations of
    the kernel.


    The more intensively the machine will be used as a server or administration box,
    the more important it becomes to separate the file system (the Linux file system
    is discussed in greater detail in Chapter 9) out into a number of partitions.
    How necessary is a function of what the computer''s job will be? However, it is
    smart to create some special partitions:


    +   - A separate /boot partition, so that if something happens to the main root
    (/) partition, you can still boot the machine.

    - A separate /var/log partition, so that if the system logs run wild they cannot
    overrun the main partition and crash the machine.

    - A separate /tmp partition, so that programs begin ridiculous numbers of temporary
    files, or if users abuse the directory, the rest of the file system is safe. This
    portion of the file system is also under the most wear and tear and is so likely
    to fail faster other partitions.

    - A separate /home partition, to allow enforcement of disk quotas for users or
    groups to keep from overwriting home data if upgrading or installing a new version
    of a Linux distribution.


    **TIP:** People who are used to Windows are often confused when they try to understand
    the concept of partitions with directory names. To Linux, anything that contains
    files is part of its file system. Whether that item is a harder disk partition,
    a floppy disk, a Zip disk, or a CD-ROM, there are commands for adding that item
    to the file system. As an example, the home partition. In Windows the partition
    might be called E;, but in Linux it''s assigned a more-full name so it can be
    plugged directly into the file system. Instead of having the root (/) partition,
    the home partition is plugged into the file system itself as the home directory
    as well.


    19'
