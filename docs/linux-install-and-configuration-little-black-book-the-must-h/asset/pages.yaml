  md: '# Preparing For Linux


    After deciding to install Linux, it is relatively easy to get. Both distributions
    are available in many computer stores and bookstores on the Internet—and it is
    possible to download either for free. If you think you will want technical support,
    be sure to purchase the CD-ROMs from Red Hat or Caldera themselves, or from another
    distribution that offers support. Otherwise, there are places to order inexpensive
    CD-ROMs (see the section “Finding Inexpensive CD-ROMs for Linux” for more details).


    # Understanding Linux Equipment Needs


    Linux is quite generous in terms of its minimal requirements. Most modern-day
    PCs meet the minimal needs, which are shown in Table 1.1.


