  md: '# # Defining Hosts For SMB Access


    One important feature of Samba is the ability to define specific host access,
    so it is necessary to understand the process involved in doing so. To create a
    host access definition, do the following:


    +   1 Determine whether you want to explicitly allow or deny access to the host
    in question. Then you can begin writing the statement as "hosts allow" or "hosts
    deny".


    NOTE: You can add host definitions to local or global segments of the Samba configuration
    file. Global always overrides local in this context.


    +   2 While you can use domain names or IP addresses, it is often best to use
    IPs to avoid name resolution slowdown or outage problems. Determine which IP address
    or string of addresses you want to allow or deny.


    +   3 Fill out the host entry with the form of the IP address that properly defines
    the string of hosts desired:

    * Allow an entire class IP address, simply don''t fill in the last entry. For
    example, allowing an entire class A might be "hosts allow 10.152.62". This example
    can go as far as "10.152." or "10." as well.

    * Disallow one specific untrusted host with the EXCEPT clause, such as "hosts
    allow 10.152.62 EXCEPT 10.152.62.13".

    * Allow machines in a particular IP class range which also have a specific hostmask
    by using a slash (/) such as "hosts allow 10.152.62.0/255.0.0.0".

    * Include multiple entries with a comma surrounded by spaces, such as "hosts allow
    localhost, 10.152.162".

    * Disallow specific host names to connect to the Samba server in the format "hosts
    deny purple, red".


    +   4 Add additional host entries if necessary.


    NOTE: More about formatting host entries is available in "man smb.conf" and "man
    5 hosts_access".'
  merge: -1
