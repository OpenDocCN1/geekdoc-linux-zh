    # Table 11.5 NFS mounting options.


    | Option | Purpose |

    |---|---|

    | secure\d | Only accepts export requests from Internet ports below 1024. On default.
    |

    | insecure | Accept export requests from any Internet port. |

    | ro | Do not allow NFS users to write to the exported volume. |

    | rw | Allow NFS users to write to the exported volume. On default. Be careful
    with this option, don''t pair it with making the volume accessible to everyone.
    |

    | noaccess | Prevents the NFS client from seeing or accessing directories below
    the current point. |

    | link_relative | Change all symbolic links whose assignments start with a slash
    (/) into relative links by adding the appropriate number of leading slashes and
    dots to point to the proper directory (e.g. ../../dir/file). |

    | link_absolute | Leave symbolic links intact. On default. |


