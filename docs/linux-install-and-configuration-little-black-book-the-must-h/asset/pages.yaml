    # # Upgrading A Kernel


    Upgrading your system’s kernel can be an involved process. The general steps involved
    in doing this are as follows:


    +   - See which kernel you’re currently running (see the section “Determine Which
    Kernel You Are Running” for how to accommodate this).


    +   - Download the kernel version you want to apply. This version may be from
    Red Hat or Caldera itself (in which case, see the section “Updating A Kernel Through
    Red Hat” or “Updating A Kernel Through Caldera” for the rest of the process) or
    from a trusted download site. Either download the entire kernel if you are going
    for a major version change, or the collection of patches necessary to bring the
    main version’s source up to the version you want to use.


    +   - If you need to apply patches, see the section “Applying A Kernel Source
    Patch” for instructions on how to do this. Otherwise, continue.


    +   - Read the README file that comes with the kernel source. This file lists
    where to look to find out other software needs to be upgraded in order to move
    to the new kernel.


    +   - Upgrade the packages that need to be upgraded before you compile the kernel.'
