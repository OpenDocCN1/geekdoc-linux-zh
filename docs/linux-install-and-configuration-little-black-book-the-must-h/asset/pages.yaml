    # Video Modes


    The Caldera installer''s video mode selection feature is configured to automatically
    offer you the modes that your hardware can support. It is not recommended to change
    it to show you every possible mode. Otherwise, you may accidentally choose a mode
    that is not compatible with your hardware, which could damage it.


    It is recommended to use the mode testing feature before moving on the next step
    in the installation process. To do this, click the “Test mode” button and see
    how it looks on your screen.


    # Installing Multiple Operating Systems


    Many people who want to use Linux at home or on a desktop also want to run another
    operating system on the machine—example, Windows. Linux can share a hard drive
    with another operating system so long as the installs are handled carefully. The
    primary issue is the install order. Linux should be installed after the other
    operating system(s) when at all possible.


    > TIP: Be sure to create boot disks for any other operating systems on the machine
    before installing Linux. This step improves the odds that you get back to them
    if something goes wrong during the Linux install. Instructions for making Windows
    boot disks are given in the section "Creating A Windows Boot Disk." Also, remember
    that there is no guarantee that your data will survive your adding another operating
    system to the hard drive. Be sure to make backups of important files and programs!


