    problem, boot with an emergency boot disk and try reinstalling LILO. |

    | 0x09 | DMA attempt across 64K boundary | See the "Editing LILO." Remove the
    compact option from your LILO configuration and boot with the new LILO settings.
    |

    | 0x0c | Invalid media | This error usually results from a drive problem. Reboot
    and give it another try. If several reboots later you still get the same error,
