- img_proc: true
  md: '# Immediate Solutions


    +   - The user running smbd is root.

    - The location of the daemon is /usr/sbin/smbd.

    - The argument to run the program is smbd.


    The resulting statement is:


    ```

    netbios-ssn stream tcp nowait /usr/sbin/smbd

    ```


    +   6. Build the nmb statement. Following the same process as with smbd, the resulting
    statement is:


    ```

    netbios-ns dgram udp root /usr/sbin/nmbd

    ```


    +   7. Save and exit the file.

    8. Restart inetd by typing "kill -HUP 1".


    ![](img/2b916f28ab4fa126e516b3f9293c726b_270_0.png)


    # Configuring The Samba Daemons To Run From System Startup Scripts


    If you installed Samba from an RPM then all of the proper links are in place.
    However, if you installed from source and just want to be sure, then do the following:


    +   1. Log in as root.

    2. See if you already have the necessary smb script in place by changing to the
    directory /etc/rc.d/init.d/ and seeing if the file smb is there.

    3. See if you need to set up symbolic links by first typing "ls -la smb".n4. Look
    in the listing at number directly after the permissions. This number represents
    the number of links to the file. If the number is one you may need to create three
    links.

    5. Type "ls -l /etc/rc.d/rc.1d "samba". If there is a Samba listing there then
    proceed to the next step. If not, create the first link by typing "ln -s /etc/rc.d/init.d/smb
    /etc/rc.d/rc.1d/K33smbd". This link sets the Samba process to be killed when entering
    runlevel 1, or single user mode.

    6. Type "ls -l /etc/rc.d/rc.3d "samba". If there is a Samba listing then proceed
    to the next step. If not, create the second link by typing "ln -s /etc/rc.d/init.d/smb
    /etc/rc.d/rc.3d/S91smbd".


    239'
