  md: '# Immediate Solutions


    # Creating A Perl Program


    There are a number of basic steps for writing a Perl program:


    +   1. Create the text file that will contain the program.

    2. Add the interpreter identifier line so Linux knows what program to run your
    code.

    3. Build your Perl program.

    4. Save and exit the file.

    5. Change the permissions and ownerships of the program so it is executable by
    the right user accounts with the command `chmod +x filename`.

    6. Test the program.

    7. Take steps to debug if necessary, then return to Step 6.


    | Related solutions: | Found on page: |

    | Understanding File And Directory Listings | 86 |

    | Changing File And Directory Permissions | 86 |


    # Running A Perl Program


    There are two different ways to run a Perl program:


    +   * Make the text file that contains the program executable by typing `chmod
    +x filename`. Type the name of the file at the command line to run the program.

    * Leave the text file as a nonexecutable. Type it as an argument for Perl, such
    as `perl filename`.


