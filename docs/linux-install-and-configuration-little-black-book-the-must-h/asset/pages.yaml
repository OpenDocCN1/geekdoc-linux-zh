  md: '# Installing The Samba Package From The Caldera CD-ROMs


    Samba is provided as an RPM on the Caldera CD-ROM. You can install the RPM by
    hand or via the kpackage utility. To install by hand, do the following:


    +   1. Mount the Caldera CD-ROM onto the filesystem.

    2. Change to the directory Packages/RPMS on the CD-ROM (for /mnt/cdrom/Packages/RPMS).

    3. Install both the samba package and the samba documentation package by typing
