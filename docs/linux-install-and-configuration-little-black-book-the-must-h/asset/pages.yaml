- img_proc: true
  md: '# Chapter 11 Configuring LAN


    +   1. Log in as root.

    2. Assign each machine behind the router its number if it does not already have
    one. This should not be actual addresses if you are using the router to connect
    them to the Internet. Instead, they should use the address blocks reserved for
    internal networks. These blocks are as follows:

    * Class A 10.0.0.0-10.255.255.255

    * Class B 172.16.0.0 - 172.31.255.255

    * Class C 192.168.0.0 - 192.168.255.255


    However, this statement is somewhat misleading. The first address is reserved
    as the Network address (for example, the Class B Network address is 172.16.0.0)
    and the Broadcast address is also reserved, which is the last component of one
    of the blocks (for example, the Class A Broadcast address is 10.0.0.255, B is
    172.16.0.255, and C is 192.168.0.255).


    Typically, the second address (ending in .1) is used for the router itself.


    +   3. Create the file /etc/rc.d.masq, which will contain the script (on writing
    shell scripts in Chapter 18) that sets up routing for you.


    +   4. Add the following to the beginning of the script:


    ```

    #!/bin/sh

    # Tell the kernel to load necessary modules automatically,

    # described in man depmod.

    /sbin/depmod -a

    ```


    +   5. Enable IP forwarding by adding the line:


    ```

    echo "1" > /proc/sys/net/ipv4/ip_forward

    ```


    > TIP The Linux IP Masquerade mini HOWTO also suggests that Red Hat users edit
    the file /etc/sysconfig/network and change the statement FORWARD_IPV4=false to
    FORWARD_IPV4=true.


    +   6. Enable timeouts for IP masquerading with the format:


    ```

    /sbin/iptchains -M -S TCPtimeout FINtimeout UDPtimeout

    ```


    The timeout assignments are listed in seconds and each applies to specific aspects
    of TCP/IP traffic:'
  merge: -1
  pgno: 243
- img_proc: true
  md: '+   * The TCPtimeout option sets how long the router will wait before severing
    a connection if there has been no traffic across a TCP/IP client/server connection.
    For example, if a user has connected to an FTP server and allows the connection
    to sit idle for hours, or even forgets and leaves it sitting overnight, this is
    a waste of resources. This option is usually set for a matter of hours, to avoid
    cutting things prematurely. Remember, however, to list the hours as seconds.

    * The FINtimeout option sets how long the router will wait after completing the
    initial TCP/IP connection (receiving the “FIN” packet) before severing the connection.
    This option is usually set for a number of seconds, from perhaps ten to thirty,
    since usually the connection is initiated so data transfer can begin so not be
    immediately silent.

    * Thetimeout option sets how long the router will wait before severing a connection
    if there has been no traffic across a UDP client/server data stream. As UDP does
    not keep a steady connection open as TCP/IP does, the wait times are much shorter,
    typically a matter of a few minutes.


    7. To turn on the forward forwarding add these two lines of code:


    ```

    /sbin/ipchains -P forward DENY

    /sbin/ipchains -A forward -s network/subnetmask -j MASQ

    ```


    The network item is the network number used in your system, and the subnet mask
    is the last portion of that mask, the number after the last period.


    8. Now, you must load modules for each service that requires masquerading to access
    the Internet from behind the router. Table 11.2 lists which modules need to be
    loaded for which services.


    +   9. Save and exit the file.

    10. Change the file''s mode to 700.

    11. Open the file /etc/rc.d/rc.local.

    12. Add the following line to load your script:


    ```

    /etc/rc.d/rc.masq

    ```


    13. Save and exit the file.


    > NOTE: Be sure to go to the other machines on the LAN and set the router as their
    Gateway.'
