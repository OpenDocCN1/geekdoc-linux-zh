  md: '# The Server Class


    If you intend to dedicate an entire machine to Linux, then the Server install
    can be a good choice—especially as a practice run for setting up a server of your
    own. You may find that the default installation for this class is perfect for
    your situation, or you may decide once you have a handle on the machine that you''ll
    go back and to a Custom install.


    Related solutions:| Found on page:

    Finding The Hardware Compatibility List For Red Hat | 12

    Deciding How Many Partitions To Make | 19

    Compiling A Kernel | 184


    This class assumes that you intend to make the machine an actual server, so it
    treats it as such. Some things to keep in mind with the Server class are:


    +   * It wipes all existing partitions and creates its own, each holding a different
    segment of the Linux file system.

    * It erases your entire hard drive, so use only the Server class if it''s the
    only thing you want on that machine.

    * It chooses which packages to install. You have no input in the matter.


    The Server class uses approximately 1.6GB of space to create the following partitions:


    +   * 64MB swap for swap space.

    * 16MB /boot for the first stage of LILO and the kernel.

    * 256MB root (/) partition.

    * 256MB /var partition.

    * 512MB or larger /usr partition.

    * 512MB or larger /home partition.


    These two partitions will grow to fill all available space left on the drive.


    # The Custom Class


    Those who want to have more control over their installations should choose the
    Custom install. This install class allows you to determine where LILO will be
    installed, even if you wish to use it. You can set up partitions the way you feel
    most suits your needs.'
