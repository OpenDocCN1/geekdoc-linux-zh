  md: '# Chapter 4 Installing Red Hat


    on your hard drive to contain the program. To install and use Loadlin,

    do do the following:


    +   1. Download Loadlin from ftp://metalab.unc.edu/pub/Linux/system/boot/dualboot.

    2. Unzip and untar the file. The latest versions of WinZip will do this if you
    have to do on a Windows machine.

    3. Copy the file LOADLIN.EXE into an MS-DOS partition.

    4. After installing Linux, copy the file /boot/vmlinuz to the same partition,
    into the main directory (for example, C:).

    5. Now, to boot Linux, type something similar to the following at the MS-DOS partition''s
    prompt:


    ```

    loadlin c:\vmlinuz root=/dev/hda ro

    ```


    # Boot Disk


    Rather than using LILO or any other boot loader, you can use the custom boot disk
    created toward the end of the install process to boot every time.


    # Restoring Your MBR


    To restore your MBR, log on as root and type "fdisk /mbr".


    > **TIP:** Don''t want to use Fdisk? Programs such as Norton Utilities or North
    AntiVirus are also capable of helping you restore your MBR.


    # Running LILO


    To run LILO so it updates itself and its map, log on as root and type "/sbin/lilo".


    > **TIP:** If you get a "No such file or directory error", type "lilo" and then
    type the path given in response.'
