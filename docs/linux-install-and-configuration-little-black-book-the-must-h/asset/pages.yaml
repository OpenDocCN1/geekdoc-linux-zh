    # # Packaging Schemes


    When you download files or prepare to send files to other people, you encounter
    a number of cryptic file extensions.


    NOTE: In general, when downloading these packages you will want to put them all
    in a standard place. Some people like to use the /tmp directory. Others create
    a /download directory somewhere in their filesystem.


    # # Tar Archive


    Tar is used to bundle files together while maintaining their directory structure.
    This archiving program does not do any compression—unless called with the -z flag,
    in which case it utilizes the GZip program to compress the archive when it is
    finished. Its function is to bundle the files or directories specified with their
    associations and locations intact. Therefore, tar is often used in conjunction
    with a compression program or the compression flag to reduce the amount of space
    the archive uses.


    NOTE: Using tar with gzip as described above is only a GNU tar feature, not a
    standard tar feature. It will not work under Unix systems that use the standard
    tar.


    You can recognize a tar file by the .tar extension.


    TIP: A common practice is to create a "tarball," which has either a .tgz extension
    or .tar.gz. To open a tarball, follow the instructions for unzipping a file, then
    untarring it.


    # # GZip Compression


    A popular form of file compression among Linux users is the program GZip, which
    is GNU''s compression program. You can recognize a file compressed with GZip by
    the .gz extension. Sometimes, although a .z (note the lower case) extension is
    used instead.


    # # Z Compression


    Another form of file compression (available across Unix platforms) is done with
    the program compress. You can recognize a file compressed with the compress program
    by the .Z extension.


    292'
