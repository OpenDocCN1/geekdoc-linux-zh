    # # Working With Tar Archives


    The tar archiving program has many useful features. It is worthwhile to look through
    the tar man pages if you find yourself heavily using this program.


    # ## Listing The Contents Of A Tar Archive


    If you want to see what is in a tar archive before you take it apart, use the
    command


    ```

    tar -tf filename.tar

    ```


    to see just a listing of the file names, or


    ```

    tar -tvf filename.tar

    ```


    to see a listing of the contents as in the same format ls -l uses.


    # ## Untarring A File


    To untar a file, the basic flag is the letter x (extract). A common combination
    of flags used in file extraction is xvf, for example:


    ```

    tar -xvf filename.tar

    ```'
