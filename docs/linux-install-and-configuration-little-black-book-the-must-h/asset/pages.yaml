  md: '# About The Authors


    **Dee-Ann LeBlanc** is a technical writer and trainer currently specializing in
    Linux. She is a Red Hat Certified Engineer and teaches a variety of courses through
    ZDU, including regular stints with Introduction to Unix and Unix Administration.


    Dee-Ann is also the author of Running A Perfect Internet Site With Linux, and
    the lead author for General Linux I1 Exam Prep coming from The Coryolis Group,
    and has written books on Internet tools.


    Dee-Ann enjoys exploring new avenues of Linux, Unix, and the use of computers
    as tools to achieve what needs to be done out in the “real world.” See what she
    is up to today, including the latest contact information, at www.rainsoft.com/dee/write.


    **Isaac-Hajime Yates** is an IT Technician for iMALL Inc. where he troublesho
    end-user problems in the corporate office, evaluates utility software, analyzes
    computing issues, and develops strategies to create and implement batch files
    and programs.


    Isaac also works as a Computer Lab Instructional Specialist for Santa Monica College
    where he supervises student workers and supports anywhere from 70 to 200 workstations
    on a given day.


    He has been working in the computing field since 1995 and has dabbled with Windows,
    Linux, and several other Unix flavors, Mac OS, DOS, programming, HTML, and networking,
    among others.'
