- img_proc: true
  md: '# Acknowledgments


    Every new computer book brings about a fresh set of challenges. In a book such
    as this one, the challenge is to try to think of everything I can that people
    might want to do, or might run into as they install and configure a Linux that
    cause people problems. In addition to my own experience, having a steady stream
    of students ensures that I am always discovering new aspects of Linux as well
    as those people who have helped me who have helped me instruct others, as well
    as those who have added their knowledge to mine to provide a broader range of
    experience for students. These people are Clay Lawrence, Charles Hays, and Garv
    Austin.


    I would also like to thank the very supportive team at The Coriolis Group who
    made this book possible. Stephanie Wall and Dan Young made my experiences with
    The Coriolis Group pleasant, and they were also a good cheering section down the
    stretch. Special thanks to Dennis Groves who helped the items I missed in each
    chapter.


    Thanks to my husband, Robert, for putting up with my weird moods and hours, and
    to all those friends who are still willing to talk to me after I vanished for
    a month or so.


    —Dee-Ann LeBlanc


    I''d like to thank everyone at The Coriolis Group for giving me an opportunity
    to write this book. Special thanks to Dee-Ann LeBlanc who provided me with advice
    when I needed it. It is a huge honor for me to work with her on this book.


    Family and friends have played an enormous role in inspiring me to push myself
    forward in both my work and personal life. I''ve always been grateful for both
    the big and little things people have done to look out for me along the way. So
    by helping to write this book, I am expressing my thanks.


    —Isaac-Hajime Yates'
