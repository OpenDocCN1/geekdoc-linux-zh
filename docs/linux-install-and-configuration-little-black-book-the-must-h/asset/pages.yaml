    for working on shell scripts, ~/bin, is a good place to store Perl programs as
    well. If you like to keep everything segregated, then creating ~/bin/shell and
    ~/bin/perl. For this example, we will store the file in ~bin.


    +   - Change the change to ~/bin directory.


    +   - Edit the file with your favorite text editor—for example, vi phonebook.'
