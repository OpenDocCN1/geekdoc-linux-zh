  md: 'The v flag is for verbose, and the f flag tells tar you are going to give it
    a file''s name.


    **TIP:** Where you open a tar archive depends on how it was initially created.
    Looking at the contents (see the second option in the section "Listing Contents
    Of A Tar Archive") helps to determine how this was done. This action will allow
    you to see the directory structure stored within the tar archive so you can choose
    accordingly where to put the file.


    If you are still unsure, untar in a temporary area and see what kind of structure
    it opens with. You can then untar it again in the appropriate location.


    # Extracting Only The README File From The Tar Archive


    Often it is useful to extract only the README file from a tar archive, so you
    can see where the instructions tell you to unpack the archive without needing
    to do it twice. To accomplish this task:


    +   1. Enter the directory the tar file is stored in.


    +   2. Type the second option listed in the section "Listing Contents Of A Tar
    Archive."


    +   3. Note the format and location of the README file within the archive.


    +   4. Use the following command in full, substituting the appropriate file names
    where necessary:


    ```

    tar xf archive.tar dir/README > README

    ```


    For example, if you had the archive file program.tar and within its directory
    structure you saw listed home/bruce/Read.me, then you would type something to
    the effect of "tar xf program.tar home/bruce/Read.me > README".


    **NOTE:** You can do this without the redirection, but if so then the file will
    be created with the archived directory structure intact. If you followed the example
    without the redirection at the end, the file Read.me would be extracted into the
    directory home/bruce, which would be created for purpose.


    +   5. Read the file README and learn where you are instructed to open the tar
    archive.


