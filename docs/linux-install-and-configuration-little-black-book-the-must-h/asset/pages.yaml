  md: '# Moving An Existing Directory To A New Partition


    Perhaps you have just added a new hard drive and want to move a directory onto
    it and into its own partition. To accomplish this task, do the following:


    +   1. Install the new hard drive into the machine.


    > TIP: This task is best to do when there are no users, other than yourself as
    root, using the machine.


    +   2. Partition it as necessary with your favorite partitioning tool. See Chapter
    2 for details about disk partitioning.


    +   3. Rename the existing directory with a temporary name to assist with the
    shuffle. For example, to move the /home directory onto its own partition, change
    it with mv /home /homet.


    > TIP: Another, and in some ways safer because tar has better protection against
    data loss, handling of this task is with the tar command in the format: mkdir
    /newdir, cd /dir, tar cf - |cd /newdir, tar xf -.


    +   4. Add the new partition to /etc/fstab. See the section “Automating Mounting
    Device At Boot Time” for explicit instructions. For example, if the /home directory
    is moving onto the second SCSI partition, then the entry might be:


    ```

    /dev/sdb1 /home ext2 defaults 0 2

    ```


    +   5. Either reboot the machine to automatically mount the partition, or mount
    it by hand with a command such as mount /dev/sdb1 /home.


    +   6. Copy the entire contents, including all subdirectories, of the segment
    you’re moving onto the partition. For example, if the /home directory, you would
    type “cp -R /hometmp /home”. See the Tip for Step 3 for another way to accomplish
    this task.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_204_0.png)'
