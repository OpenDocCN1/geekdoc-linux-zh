  md: '# Immediate Solutions


    # Adding A New User


    There are two different commands available with which you can add a user: **adduser**
    and **useradd**. Both commands work the same way.

    To add a new user, type "`adduser username`."


    **TIP:** You may find that the default values assigned to a new user are not what
    you want to use. See the section "Viewing New User Defaults" to see if this is
    the case.


    For example, to add the new user account *mary*, type "adduser mary`."


    You must then create a password for the user. See the section "Add Or Change A
    Password" for how to do this.


    **TIP:** To create users, you must be logged in as **root**.


    # Adding Or Changing A Password


    The **root** account has the permissions to add and change passwords for any user.
    The same command is used for either function, `passwd username`."


    **TIP:** You can also change passwords within Linuxconf. See the section "Modifying
    Existing User Information With Linuxconf". Once you click on the user you want
    to modify, you can then click the Passwd button to change that user''s password.


    For example, to change the password for the user *birdy*, type "`passwd birdy`."


    **TIP:** The `passwd` command also works for changing the password for the non-**root**
    account you''re currently logged into. You use it without needing to include the
    username. You would just type "`passwd`."


    ![](img/2b916f28ab4fa126e516b3f9293c726b_184_0.png)'
