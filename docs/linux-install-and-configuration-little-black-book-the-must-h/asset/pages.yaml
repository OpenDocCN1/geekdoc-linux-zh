    # Double-Checking User Entries


    While you cannot completely proof a script against problems, you can attempt to
    anticipate where they might crop up and use methods to deal with them. One of
    the tools provided in many shells is the **test** command. It is also useful in
    conjunction with conditional statements.


    The most basic form of this command (which tests for True) is:


    ```

    test option_flag item_to_test

    ```


    If the test succeeds, the value returned is 0 (True). A failure yields a 1 (False).
    You can test for either value. If you want to test for False instead, use the
    format:


    ```

