    the package Shadow.

    * If you need the package and there is no way to fix the problem, convert back
    to not using the Shadow Suite (see the section “Convert Your System To No Longer
    Use Shadow Passwords”).

    n* /etc/shadow is only accessible by root. Therefore, any program that uses the
    file to authenticate users must run SUID root (see Chapter 5 for more information)
    or SUID shadow.

