  md: '# Automating Backups


    To automate the process of making backups, write a script that runs the necessary
    processes, add this process to your regular cron jobs. In order to add backup
    routines to the systemwide cron setup, do the following:


    +   1. Log in as **root**.

    2. Change to the /etc/crontab directory.

    3. Edit the file corresponding to the frequency you want the backups to run: cron.hourly,
    cron.daily, cron.weekly, or cron.monthly. For example, if you were attempting
    to use the Grandfather-Father-Son, you might do the following group of edits:

    * /etc/crontab/cron.daily

    * /etc/crontab/cron.weekly

    * /etc/crontab/cron.monthly


    Although functionally you could just edit the daily cron file, it is helpful to
    add special reminders in the weekly and monthly files about when to change or
    save tapes.

    4. Add an entry for the backup script or program you want to run in the appropriate
    cron files (see the section "Setting Backups To At Specific Times" for how to
    format the entries). For an entry to run the backup script /root/bin/backup at
    4 A.M., you would add something similar to the following to cron.daily:


    ```

    00 04 * * /root/bin/backup

    ```


    For just a reminder to set aside tapes after Sunday backup, consider an entry
    in cron.weekly such as:


    ```

    00 05 * * 0 echo "Set aside the Sunday tape"

    ```


    Entering this will email that text to **root** at the time specified.

    5. Save and exit the file(s).

    6. Be sure to put a backup media in the backup drive.

    7. Sit back and check to see if the backup is on the media after the job is scheduled.
    If possible, watch the job run. Remember, any output is emailed to **root**.'
