  md: 'descriptors. To create a hard link, use the format In source link. Because
    hard links point to the same exact location on the file system, deleting the original
    file does not invalidate the link. The original isn''t removed until all the hard
    links are deleted.


    # Symbolic Links


    Creating a symbolic link makes a copy of the file at the linked location, with
    its permissions identical to those of the original. To create a symbolic link,
    use the format In -s source link. Because symbolic links do not point to the same
    inode, erasing the origin also deactivates all of them.


    TIP: On the distribution CD-ROMs is an incredibly useful RPM called "symlinks".
    This program can help you track down all of the dead links—symbolic links that
    reside on your system but point to programs that no longer exist.


    # Removing Directories


    There are two ways to remove directories. One uses the rmdir command, which deletes
    only empty directories. A directory can''t contain any files or subdirectories
    if rmdir is to work on it.


    A more efficient, but potentially dangerous, command to use—especially as root—is
    rm -r. This command deletes the directory and all of its contents, including any
    subdirectories. For example you created the directory /testbed and filled it with
    a number of test scripts. The scripts have been modified and those you want to
    have been moved to new locations, while the discards are still there. To remove
    /testbed plus all of its contents, you would type "rm -r / testbed".


    NOTE: The rm -r command is especially dangerous as root, because you have permissions
    to remove anything you want. Many a system administrator has wiped out important
    files at least one time in his her Linux or Unix career by not using this command
    carefully enough. This is not recommended to work as root unless you absolutely
    have to.


