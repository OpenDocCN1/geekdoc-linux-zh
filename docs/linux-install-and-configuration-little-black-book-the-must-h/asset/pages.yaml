- img_proc: true
  md: '# In Brief


    The base for the GUI in Linux is the X Window System, or often just X. On top
    of this run a number of window manager programs (covered in detail in Chapter
    7), but first it is important to get the basics set up properly. The installation
    programs for both Red Hat and Caldera allow you to test the GUI configuration
    before continuing with the install, but sometimes you may decide afterwards that
    you are unhappy with the results, or you may have changed hardware and need to
    change the X setup to reflect this. Remember, it is important that anything involving
    X you have the exact information for your video card and monitor available to
    work with at all possible. If you do not, err on the side of caution.


    # Configuring X


    Setting up X is easier than it used to be, with tools like XF86Setup and Xconfigurator
    at your disposal. However, this fact does not eliminate the need to potentially
    have to edit the raw data files themselves.


    The following devices must be configured in order for your X sessions to run properly:


    +   - Mouse

    - Keyboard

    - Monitor

    - Video Card

    - Color and Graphics Modes


    There are three different methods available for configuring X after the installation
    process is completed: XF86Config, Xconfigurator, and manually.


    # XF86Config


    The XF86Config utility comes with the X server itself and is available with both
    the Caldera and Red Hat distributions. It is semi-graphical and user-friendly
    mainly to those who fully understand the hardware and drivers. However, it does
    contain hardware listings, which save you much time because you don''t have to
    look up specific hardware data.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Xconfigurator


    The program Xconfigurator is specifically a Red Hat distribution tool. This is
    the same routine used during the installation process when configuring X, so it
    should already be familiar to you.


    # Manually


    Unless you are extremely familiar with the hardware in your machine and especially
    video and graphics issues, you will probably not want to configure X manually.
    However, if the other programs fail to give you good results, you might find that
    fiddling with the files manually will repair the problems.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_138_0.png)'
  merge: -1
