  md: '# Converting Your System To Use Shadow Passwords


    To set up your system to use shadow passwords if it is not already configured
    to do so, do the following:


    +   1. Log in as **root**.

    2. Change to the directory /usr/sbin.

    3. Type “pwconv”.


    > NOTE: If the command is not in that directory, see the section “Installing The
    Shadow Password Package”.


    # Converting Your System To No Longer Use Shadow Passwords


    To remove shadowing from your system, do the following:


    +   1. Log in as **root**.

    2. Change to the directory /usr/sbin.

    3. Type “pwunconv”.

    4. Then, remove the shadow utilities. The package names for Red Hat and Caldera
    respectively are listed in the section “Installing The Shadow Password Package”.


    # Locating The Default User Profile


    The generic user profile is found in /etc/profile. The shell assigned to /etc/profile
    determines what format the changes you make in. bash shell is assigned to all
    users by default, so it is often safe to assume that is what your users will use.
    If they choose to change shells, they can customize their own profile (profile).


    > TIP: You can use a series of it/then statements to offer customization for other
    shells. See Chapter 18 for more information on writing shell scripts.'
