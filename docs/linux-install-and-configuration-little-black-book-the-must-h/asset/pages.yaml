  md: '# Echoing, Or Printing Text To The Screen


    You can trace what is happening to the variables in your script by adding statements
    to display pertinent information as the script runs by using the **echo** command.
    For example, if you suspect there a problem with the handling of the variable
    count, you could add the statement


    ```

    echo "The value of the variable count after step one is $count".

    ```


    after the first step of your script. The script interpreter properly sees $count
    as referring to the value of the variable because of the dollar sign ($). If the
    value of count were 14, the script would display


    The value of the variable count after step one is 14.


    when it reaches the echo statement.


    # Unexpected EOF


    When you try to run a script and see Unexpected End Of File (EOF), you likely
    did not properly close all of your if and elif statements.


    # Giving Exit Status


    The shell notices whether a script exits successfully or not, meaning that it
    finishes with no errors, hidden or obvious. To have a script print the exit status
    as it finishes, add the statement:


    ```

    echo $?

    ```


    A more useful variant if a script has a lot of output is:


    ```

    echo "The exit status is $?"

    ```


    If the status is 0, the script finished properly. If it is a 1, there was an error.


    # Commenting Out


    If you cannot seem to locate the bug in your script, it can be useful to start
    commenting sections of code so they will not run. Then you can see whether the
    error persists without those sections.


    The one problem with this method is that the code may break in a new way when
    you comment segments. Be sure to look and see if something done in the section
    you want to ignore is vital to another part of the script.'
  merge: -1
