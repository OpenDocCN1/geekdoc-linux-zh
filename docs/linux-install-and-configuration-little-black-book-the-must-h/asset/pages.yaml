  md: '# In Brief


    There are times when shell scripts (covered in Chapter 18) easily suffice for
    the task you need to accomplish. At other times, however, you might need something
    more powerful. One step up from writing shell scripts is Perl, the Practical Extraction
    and Report Language. It is a mix of shell scripting languages and C programming,
    taking advantage of the strengths of both. Perl is especially popular among Linux
    system administrators for writing applications to run on the Web.


    # Why Use Perl?


    There are a number of reasons to use Perl, or not to use it, depending on how
    the items on the list all appear to you:


    +   - The Perl structure is similar to the C programming language, not a completely
    new construct.

    - The rules are fairly loose (or nonexistent) regarding such things as line length,
    variable name length, and how far nested subroutines can be.

    - The Perl interpreter detects insecure data sources, important assistance for
    any system administrator.

    - If you find yourself using a lot of pipes in a shell script to move between
    countless programs and back again, Perl would be a cleaner option.


    # Perl Programming Example


    Let''s write an example program to demonstrate both the Perl programming process
    and how the language works. Many of the considerations and good practices are
    the same or similar to writing shell scripts.


    # Program Purpose


    The purpose of this Perl program is to input the data necessary to create a small
    phone book, and store that data in a file that can be appended later by using
    this same application.'
