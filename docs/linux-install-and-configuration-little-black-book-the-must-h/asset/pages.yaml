    # Services Available At Boot Time


    At one point in the install process you are shown a list of services that can
    be started at boot time. Pressing F1 the cursor is on the service brings up a
    short description of the service. Here is useful information to help you determine
    which you want to use:


    +   * apmd is a power management daemon on laptop computers. If you are installing
    Linux on a desktop machine that does not rely on battery power, do not run this
    daemon by default.

    * atd tracks jobs created with the at command. The at command allows users and
    system administrators to schedule a one-time job to run at a specific time.

    * cron tracks regularly-run jobs scheduled by editing the systemwide cron files,
    or by users using crontab.

    * gpm allows limited mouse-based features to be used in a non-GUI session. These
    features are generally limited to the ability to select and copy text between
    screens, and pop-up menus. If the machine involved will not have a mouse attached
    to it, do not start this service automatically.

    * keytable loads the keymap selected during the install process. The system''s
    keymap is a file that tells Linux which characters appear when which keys and
    key combinations are pressed. It is a good idea to leave this service on start
    at boot.


