  md: 'Chapter 4 Installing Red Hat


    # # The Master Boot Record


    For some, the simplest option is to install LILO on the primary hard drive''s
    MBR. This location is especially straightforward for those who are only using
    the computer in question as a Linux machine.


    **WARNING!** If the same computer you are installing Linux on is intended to run
    MS Windows, this OS places information on your MBR. Installing MS Windows after
    installing Linux will wipe out LILO if it is already installed on your MBR. This
    situation can be repaired if you created an emergency boot disk for Linux. See
    the section Running LILO for more details. Whenever possible, install MS Windows
    operating systems first and Linux last.


    # # The Linux Root Partition


    Those who have multiple operating systems installed on the same hard drive, or
    each on its own drive, often choose to install LILO on Linux''s root partition.
    Installing LILO on this location can help to avoid any conflicts between your
    operating systems over which uses uses the MBR.


    **WARNING!** You must make the Linux root partition bootable with the program
    used for partitioning if that is where you want to install LILO.


    # # A Floppy Disk


    If you are heavily concerned about potential problems from installing LILO on
    your hard drive, it is best to install LILO to a floppy disk. This allows you
    to only invoke the boot manager when you have the floppy in the drive, which is
    a good solution for those who do not intend Linux to be their primary OS.


    **WARNING!** Be sure to make a backup of your LILO floppy and keep it in a safe
    place.


    # # Considerations For Configuring Video Options


    If you did the preparation in Chapter 1, you should have the information on your
    video card and display already available. Here are some tips to help you fill
    out the required data:


    +   - Often the information you need is available in the hardware manuals.'
