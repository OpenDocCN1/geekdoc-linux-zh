    # Configuring An NFS Client


    To automount NFS partitions that are available to your machine, the following:


    +   1. Log in as root.

    2. Edit /etc/fstab.

    3. Add an entry for each partition you want to mount. Continuing with the example
    in the section Configure An NFS Server, say that you are configuring the machine
    yellow.colors.org to mount the /home partition on blue.colors.org. You would add
    the line:


    ```

    blue:/home /mnt/blue nfs rsize=1024,wsize=1024,hard,intr 0

    ```


    > TIP: To just the NFS file temporarily, use the format "mount host:/directory/mountpoint".
    For example, to NFS mount the directory /home/bruce on the machine purple.colors.org
    to the mount point /mnt/bruce within the same domain, type "mount purple: /home/bruce
    /mnt/bruce".


    # Determining If You Need NIS


    NIS (Network Information Service) is used when you need to keep local host information
    in a central location. NIS is especially useful if:


    +   1. You have a standalone LAN.

    2. You have a large LAN and want to store all workstation addresses on a central
    machine to simplify administration.

    3. You want to give all users the same login account and password for every machine
    on the LAN automatically.'
