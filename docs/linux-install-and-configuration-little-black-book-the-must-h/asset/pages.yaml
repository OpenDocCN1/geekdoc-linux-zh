    # Configuring The Monitor Manually


    To configure or tweak your monitor settings manually, first follow the instructions
    in the section "Adjusting X Manually" and then the following:


    +   1. Search for the text:


    ```

    # *************************************************

    # Monitor section

    # *************************************************

    ```


    To do search within vi, type "/Monitor section" and then press Enter.


    +   2. The section that contains the monitor labels is:


    | Identifier | "MAG DX700T"

    | VendorName | "Unknown"

    | ModelName | "Unknown" |


    These three items can be changed safely in the following ways, so long as you
    are sure not to erase the quotes:


    +   * To assign a new label to the monitor itself, change the text in the Identifier
    tag.

    * To set the name of the manufacturer, change the text in the VendorName tag.

    * To set the model of your monitor, change the text for the ModelName tag.


    +   3. To change the horizontal sync range for your monitor, change the value
    of HorizSync. This value can either be a range of numbers out to one decimal place
    (for example, "40.5-85.3") or a series of numbers out to one decimal place (for
    example,'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Chapter 6 X Configuration


    "40.5, 50.5, 60.5, 70"). In this case, there are no quotes in the code, so it
    might look like:


    HorizSync 40.5-85.35


    **WARNING** Be careful to use the exact range listed in your monitor manual or
    manufacturer''s Web site, or guess on the low side. You can damage your equipment
    if you place the value too high for it to handle.


    +   * To change the vertical refresh rate for your monitor, change the value of
    VertRefresh. This value is in the same format as HorizSync, and the same warnings
    apply.


    +   * To define how the monitor will behave in particular graphics modes, set
    the Mode or ModeLine sections. These two variables define exactly the same terms,
    but are formatted differently. A Mode statement looks like:


    ```

    Mode "1024x768"

    DotClock 45

    HTimings 1024 1048 1208 1264

    VTimings 728x 776 784 817

    Flags "Interlace"

    EndMode

    ```


    The values in this statement are:


    +   * The value associated with Mode itself is the name of the mode. This name
    is usually the resolution of the monitor setting being assigned in the format
    (horizontal pixels)(vertical pixels), with an i added on the end if the monitor
    is interlaced. An interlaced monitor draws the entire screen picture in two passes;
    non-interlaced is preferred because it draws the screen in one pass.


    +   * The DotClock item is a value in MHz that expresses how fast a single pixel
    can be displayed on the monitor. To calculate this value approximately, use this
    formula: (horizontal pixels)x1.28(horizontal refresh rate).


    +   * The HTimings term consists of four different values. The first is the number
    of pixels displayed horizontally (in the example, 1024). The second is the location
    of the exact dot where the horizontal image begins, and the third is where it
    ends. The last value is the total number of horizontal pixels in existence. These
    values are often documented in the monitor manuals.


