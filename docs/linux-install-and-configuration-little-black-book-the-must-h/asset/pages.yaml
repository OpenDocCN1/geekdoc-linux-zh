    # Changing By Letters


    Changing a file''s permissions by using letters may seem straightforward, but
    it gets complex if the changes are extensive. This method involves a plus (+)
    or minus (-) to add or subtract permissions to the various trials, or all at once.
    The triads are o for owner, g for group, and u for user, meaning everyone.


    For example, the file named "text" starts with full permissions (rwxrwrwx). This
    is, in general, a very bad idea. Because this is only a text file, you might first
    remove the executable permissions by typing "chmod -x text". Now the permissions
    look like this: rw-rw--. Perhaps you don''t want anyone else, general users or
    people in your group, to be able to write to it either. Typing "chmod u-w g-w
    text changes the permission set to rw-r-r-.


    # Changing By Numbers


    Changing a file''s permissions by using numbers may seem complex, but once you
    understand how to calculate the values is a relatively simple operation. The values
    are calculated individually for each triad.


    To calculate the numeric value of an item''s permissions, do the following:


    +   1. Divide the permission set into its relative triads. For example, a directory
    named "files" that has full permissions looks like this: drwxrwxrwx. Drop the
    d to divide the permissions into triads: rwx, rwx, and rwx.


    +   2. Each letter has its own value:

    - An r is a 4.

    - A w is a 2.

    - An x is a 1.


    Use this information to fill in each triad. If the bit is off (a dash), the value
    is zero. For the example, all of the triads are the same and their values are
    421.


    +   3. To get the permission value for the triad, sum the numbers. For example,
    "4 + 2 + 1 = 7".


    +   4. All triads are identical, so the permissions for this file are 777.


