    To unload a kernel module that is not in use, do the following:


    +   1. Log in **root**

    2. Type "lsmod" to get a list of modules you currently have running.

    3. To remove a module from those currently loaded—which will only work if the
    module is idle and not being used—**rmmod modname** in the format `rmmod modname`.
    If you get a warning that other modules are dependent on this one and if you want
    to remove them as well (and you may not want to remove them), use the format `rmmod
    -r modname`.


