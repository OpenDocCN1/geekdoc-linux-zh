    # Mathematics With Variables


    When including variables in the mathematical mix, be sure they are not variables
    that contain alphabetical characters (letters). These letters will be converted
    into zeros for the sake of calculation.


    Table 19.2 Mathematical operators used in Perl.


    | Operator | Result |

    | --- | --- |

    | + | Adds the values. |

    | - | Subtracts the preceding value from the following one. |

    | * | Multiplies the values. |

    | / | Divides the preceding value from the following one. |

    | ** | Calculates the value of the preceding to the power of the following. |

    | % | Determines the modulus, or division remainder, of dividing the preceding
    by the following. |


    # Comparing Values


    Each computer language has its own twists and turns for comparing values. Be careful
    not to confuse those Perl uses with scripting or commands with their own specific
    phrasings.


    # Comparing Numbers


    Perl offers a number of operators to use for mathematical comparisons, as shown
    in Table 19.3.'
