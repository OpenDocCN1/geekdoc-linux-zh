- img_proc: true
  md: '# Table 4.4 Using LILO to diagnose a boot hang.


    | LILO Stage | Diagnosis and Suggestions |

    |---|---|

    | Blank | LILO did not start to load. It was either not installed, or not installed
    on an active partition. If you installed LILO on the root Linux partition, sure
    that partition was set to be bootable. |

    | L Error Code | The first stage of LILO loaded properly, but the second could
    not. The hex error code is a clue toward the problem at hand. See Table 4.5 for
    a partial list of error codes and their causes. Often, if the boot fails at this
    stage, either there is a bad disk (hard or floppy) involved or the disk parameters
    are not as LILO and the initial kernel expected. See the section "Determine Disk
    Parameters" for help with this issue. |

    | LI | The first stage of LILO loaded properly, and the second stage was loaded.
    However, the second stage could not be run. Sometimes this problem is caused by
    unexpected disk parameters. Otherwise, the file /boot/boot.b (the actual loader
    portion of LILO) may have been moved without rerunning LILO to update the kernel
    file maps. See the section "Running LILO" for how to care of this problem. |

    | LIL | The second stage of LILO loaded and started properly, but cannot load
    the data it needs from the /boot/map kernel file map. Once again, this problem
    typically happens because of a bad floppy or hard disk, or unexpected disk parameters.
    |

    | LIL? | The second stage of LILO was loaded at an incorrect address. Usually,
    this problem results from a slight error in disk parameters, or moving /boot/boot.b
    without rerunning LILO. |

    | LIL- | The descriptor table was corrupted. This problem can be caused by unexpected
    disk parameters, or from moving the file /boot/map without rerunning LILO. |

    | LILO | LILO loaded and ran properly. |


    TIP: Remember that when you are moving LILO from floppy to MBR, or vice versa,
    you can also move LILO onto the root partition of your Linux installation if you
    change that partition to be bootable (within your partitioning program).'
  merge: -1
