  md: '# Immediate Solutions


    # Locating A Software Package


    Here are some useful strategies for locating Linux software packages:


    +   - If you are on the hunt for new software but don''t have anything specific
    in mind, start surfing the Web. You can spend hours, even days, following the
    links within these sites.

    - If you are looking for software that accomplishes a specific task, first try
    your favorite Linux software repositories. If you can''t find what you''re looking
    for there, try a well-worded Web search. Include the word “Linux” plus other keywords
    that apply to the type of software you want to find. Sometimes it''s necessary
    to keep trying different keywords until you get the results you''re looking for,
    or to filter out certain keywords that are muddying your search efforts.

    - If you know the package you want, it is often best to start at the creator''s
    Web site, whether it is an individual hobbyist or a company. This site will have
    the latest version available and although nothing is one hundred percent reliable,
    it is likely to have a secure version of the software.


    > TIP: There is much discussion in Chapters 15 and 16 of being sure that packages
    are secure. It is important to remember that, although some of the reasons many
    people move to this operating system include the cooperation within the Linux
    community and the small number of viruses at Linux, it is still only secure as
    you make it.

    Linux security issues are discussed in more detail in Chapter 21.


    # Determining If Source Will Compile On Your Machine


    If you choose to download the source for a particular package, (or if you have
    no other choice), you need to take a look and make sure it will compile on your
    machine without needing changes. Look first in'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'the documentation, then in the makefile, to see if there is a Linux target
    available. If not, do the following:


    **NOTE:** Well-constructed makefiles are full of helpful instructions, letting
    you know when to comment out or uncomment code for specific setups.


    +   * If available, choose a BSD compile option. This choice will usually give
    you the least items to change within the the makefile.

    * If there is no BSD option, or if the BSD option will not compile, try the SysV
    (System) compile target.

    * There may not be a named operating system target at all in the makefile—meaning
    that there may not be a series of segments that allow you to choose which operating
    system to compile the code for (for example, Linux, BSD, or Sys V). In that case,
    just try to compile, see what happens, and then edit from there.


    **TIP:** Source code gets easier to work with practice. If you are uncomfortable
    with the process of preparing and compiling source, it is advisable to download
    source that is not mission-critical, practice checking to see if it has compile
    options for your machine, and then compile it. Using this method takes some of
    the pressure off and allows you to give up if you get stuck, coming back later
    after you have learned more from playing with source for other packages.


    Waiting to deal with source for the first time when you are in a rush and really
    need to get a package installed and working is a recipe for frustration.


    # # Altering A Makefile


    Altering a makefile, if you are not familiar with programming, can be a confusing
    and nontrivial procedure. There are some particular issues to keep in mind when
    fussing with makefiles:


    +   * There are often comments scattered throughout a makefile to explain what
    segments you may and may not want to change.

    * It is a good idea to make a backup of the original makefile, especially if you
    are unused to programming.

    * The more C programming you know and understand, the more makefiles make sense.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_340_0.png)'
