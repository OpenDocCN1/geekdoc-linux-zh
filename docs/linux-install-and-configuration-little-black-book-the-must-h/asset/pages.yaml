  md: '# Chapter 20 Configuring System Backups


    +   - If you use removable racks, you can move the drives from one machine to
    another one that has the proper bays.


    **NOTE**: However, moving any drive complete with an operating system on it from
    one machine to another brings configuration issues for specific hardware components.


    +   - If you use removable racks, the media can be stored separately in a safe
    or other secured location.

    - They are the fastest of all available backup options.

    - Disadvantages of using hard drives for backing up are:

    - Hard drives are good backup tools for certain situations, but not necessarily
    for heavy use.

    - If the backup is required because of serious damage to the machine that contains
    both drives, the backup drive could be damaged as well. However, it is also possible
    to back up to a hard drive in another machine.

    - If you do not use removable racks, the media are not changeable.

    - If the backup drive uses the last potential hard drive connector position, then
    it usurps space that could be used by adding a second drive for the file system.

    - If you don''t use removable racks, the media cannot be stored separately in
    a safe or other secured location.


    # Zip Drives


    Zip drives use both regular floppies and Zip disks, which hold 100 or 250MB. People
    often already have them installed on their machines. So when it comes time to
    make backups, the Zip drive is an option to explore if you already have one.


    Advantages of using Zip drives for backups are:


    +   - The Zip disks are reusable.

    - They can be stored separately in a safe or other secured location.

    - Zip drives work fairly quickly.

    - Using a Zip drive is no more difficult than using a floppy.


    Disadvantages of using Zip drives for backups are:


    +   - A Zip disk may not hold enough for some large-scale backups.

    - Zip disks are considerably more expensive than tapes or floppies on a per-byte
    basis.'
