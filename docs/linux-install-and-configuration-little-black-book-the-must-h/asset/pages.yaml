  md: '# CD-ROM Writers


    CD-ROM drives that are able to write to CD-ROMs have gone from high-tech wonders
    to affordable alternatives to normal nonwriteable CD-ROM drives. As such, they
    are a potential backup device for those who already have one and don''t want to
    run out and buy specialized hardware for that purpose.


    Advantages of using CD-ROM writers are:


    +   - They are excellent for data you want to store for long periods of time,
    because they are not prone to degrading.

    - It is easy to store large volumes of CD-ROMs in a small amount of space.

    - Data stored to CD-ROM can be easily shared on other machines as long as they
    have CD-ROM drives.

    - The CD-ROM and writer can be used for other purposes if they are replaced with
    a new backup medium.

    - They can be stored separately in a safe or other secured location.

    - Writeable CD-ROMs are almost as inexpensive as floppy disks, although rewriteable
    CD-ROMs cost more.


    Disadvantages of using CD-ROM writers are:


    +   - If the drive is not a re-writer, a CD-ROM can only be used once. This is
    not a good choice if system backups are frequent.

    - Writing to CD-ROMs is a slow process and requires precise tuning. If your computer
    is busy running other CPU-intensive tasks, this timing can be thrown off, and
    the entire CD-ROM is ruined.

    - Compared with tapes, the storage capacity of a single CD-ROM is small (about
    680Mb).


