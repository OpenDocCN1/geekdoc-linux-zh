  md: '# Introduction


    # What Is Linux?


    Linux is a free version of the Unix operating system, distributed under the GNU
    Public License (GPL). This operating system is available both on the Internet
    from many download sites and from distributions which charge for a combination
    of conveniences like packaging onto a CD-ROM, installation programs, manuals,
    and technical support.


    The Linux operating system is prized for the amount of control a system administrator
    has over the details of its operation, and how the source code for the OS and
    most of its tools is available for modification. A high number of Internet and
    intranet server machines are run using Linux, and thanks to a growing number of
    packages such as office tool suites, may soon become more popular in the desktop
    market as well.


    While there is much documentation available for Linux on the Internet and on the
    CD-ROMs (which the Linux distributions come on), these files are written for a
    variety of levels of users and scattered throughout. The Linux Install and Configuration
    Little Black Book aims to give you a more centralized location for finding the
    information you need to install and run Linux to your specifications.


    # Assumptions About You


    This book assumes that you have already decided to install Linux. The only decisions
    you should have left to make at this point are whether to use the Red Hat or Caldera
    distributions, and assembling the right hardware if this step has not already
    been done. You should have experience administering other operating systems that
    have helped you learn the basics of hardware issues, the Internet, and the various
    applications available to you. All you want to do now is get started.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Some Background About Linux


    The Linux operating system was born back in 1991 when Linux Torvalds, a student
    at the University of Helsinki in Finland, decided to make his own version of the
    Unix operating system as a hobby project. As the basics for the OS slowly came
    together, he began freeing for viewing to the community that was currently using
    Minic, which was a small Unix OS written by Andy Tanenbaum.


    Soon the OS became a hobby for the readers of the Usenet group comp.os.minix and
    with their collective minds and efforts Linux grew and grew, in 1992, Linux version
    1.0 was officially released. As the Linux kernel gained more ground it became
    the choice of the GNU (Gnu''s Unix Project) project''s goal to create a full operating
    system replete with tools such as compilers, editors, network servers, with GPL,
    and more.


    In many ways Linux has become synonymous with GNU''s "free" software approach.
    The free referred to here does not refer to cost, as GNU software can certainly
    be packaged and sold with value-added services. GNU is the forerunner of what
    has now the Open Source movement. This movement states that people should have
    access to the source code for the software and operating system so that they can
    modify it if necessary and even share those modifications.


    There is more to this movement. If you are interested, check out www.gnu.org for
    further information.


    # What You''ll Learn In This Book


    The Linux Install and Configuration Little Black Book concentrates on the installation
    and configuration of the Caldera and Red Linux distributions on PC hardware. This
    book also presents to you what options are available and whether they would be
    useful. Services as Samba, NFS, packet filtering firewalls and anonymous FTP are
    often mentioned in Linux circles but are only necessary if your particular setup
    requires them.


    You''ll learn the benefits of being a Linux setup expert and configuring a machine
    to do exactly what you want. Knowing what is possible and what isn''t is a valuable
    step toward getting the most out of your Linux box or LAN.


    You''ll also learn these essential Linux administrative skills:


    +   - Fine-tuning system security.'
  merge: -1
