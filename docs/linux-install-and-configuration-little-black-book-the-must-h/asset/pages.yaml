  md: '# In Brief


    The Linux programming community has done much to make Linux more GUI-oriented
    than its earlier versions. This fact has done much to relieve those who are used
    to working in a point and click world, those who like to have flashy colors and
    backgrounds on their machines. However, you still need to be able to do much of
    the work in the command-line interface. In fact, it is the capabilities of Linux
    that shine at the command-line level, giving you control over almost every aspect
    of what happens on your system. This characteristic is especially true over server
    machines that function specifically to provide network or Internet services. A
    GUI only slows down these machines, so knowing how to use command-line tools on
    them is essential. Fortunately, you have the option of using either aspect, or
    swapping between the two.


    # Linux Vs. DOS And NT


    Many people find themselves comparing Linux to MS-DOS because of the command-line
    nature of the operating system. However, this is really a case of comparing apples
    to oranges. Linux is a multi-tasking network operating system that requires user
    logins instead of treating everyone as one person, and the security clearance
    assigned to the user depends on the settings given to the user when or her account
    is created.


    DOS, on the other hand, is a uni-tasking system, meaning that it can only do one
    thing at a time. In addition, it is not developed for working and cannot handle
    multiple user accounts; instead, it treats anyone at the console as the same person.
    Linux is mostly like NT when looking at the Microsoft operating system collection—though
    Unix has been around for far longer than both.


    At a very basic level, one of the primary differences get moving to Linux is that,
    in referring to directories, Linux uses forward slashes (/) instead of the back
    slashes (\) used in DOS and Windows. For example, a valid directory in Linux is
    /usr/bin. Linux is also very precise in interpreting what you type. The operating
    system is case sensitive, meaning that typing a capital letter and typing a lowercase
    letter mean two totally different things. Typing "Vi", for example, is not the
    same as typing "vi". This is in sharp contrast to the'
