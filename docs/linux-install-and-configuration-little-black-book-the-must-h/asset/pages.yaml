  md: '# Building A Samba Configuration File


    There are a number of subtleties when it comes to building a statement. One process
    to follow is:


    +   1. Log in as root.

    2. Edit the file /etc/smb.conf.

    3. Begin a statement that defines the server defaults with the code:


    ```

    [global]

    ```


    +   4. There are a large number of parameters available for use globally. A full
    listing is available by typing “man smb.conf”. Table 12.1 lists a selection of
    the more interesting ones. A number of the Samba parameters have nuances depending
    on how they are combined. The man page outlines them well.


    +   5. Fill out the global section with the items you need to assign. For example:


    ```

    add user script = /home/samba/bin/createsmbuser %u

    hosts allow = localhost

    ```


    Table 12.1 Global parameters for the file /etc/smb.conf.


    | Parameter | Purpose | Argument | Dependencies |

    | --- | --- | --- | --- |

    | add user script | If a lot of users from Windows NT will be accessing the file
    system and do not have accounts on the Linux box, this parameter will create necessary
    Linux accounts on the fly. You can write a script that creates a Linux user given
    the argument %u, which is the user name. | Full path to the script. Thoroughly
    test it is going to run as root. | The security option must be set to "server"
    or "domain", the password server parameter must be defined, and if you want the
    user to be deleted in the end then delete user script. |

    | encrypt passwords | If using Windows NT 4 OSP3 or above this option is necessary
    to allow clients to negotiate encrypted passwords with the Samba server. | Create
    a local smbpasswd file or set security to "server" or "domain". | None. |'
