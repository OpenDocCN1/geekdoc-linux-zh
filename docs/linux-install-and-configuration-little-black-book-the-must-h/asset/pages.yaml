  md: '# Reinstalling LILO


    If you decide you would benefit from a fresh LILO install, first make sure you
    have emergency boot disks for all of the operating systems on your machine. Then,
    do the following:


    +   1. Log in as root.

    2. Delete the current LILO installation per the instructions in the section "Removing
    LILO."

    3. Edit your lilo.conf file to reflect the settings you want, if you feel this
    is necessary (see the section "Editing LILO" for help).

    4. Run LILO to place the information back in your MBR (see the section "Running
    LILO" for more assistance).


    # Removing LILO


    Removing LILO from your system is as straightforward as logging in as root and
    typing "lilo -u".


    # Choosing What Services Automatically Start


    You could have all installed services automatically start, but that practice creates
    the following problems:


    +   * Lengthened boot time.

    * Lengthened shutdown time.

    * Heavy use of RAM.


    Ask yourself the following questions when choosing what to start upon bootup:


    +   * Will I use this service at all? For example, it makes no sense to start
    the lpd service at boot time when you have a Linux box that isn''t connected in
    any way to a printer.

    * Will I use this service often enough to warrant paying the prices above?

    * Do I understand what the service offers? If not, press F1 for more information
    about it.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_106_0.png)'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Chapter 4 Installing Red Hat


    Remember, if you choose not to autostart a service at the beginning, you can change
    that fact later. If this is purely a practice run, you may want to experiment
    with starting a bare minimum of services.


    # Shutting Down Your System


    To shut down your system cleanly, use the **shutdown** command. There are a number
    of variables you can use, depending on what you intend to do. If you want to shut
    down and shut off the machine, log on as **root** and begin with "shutdown -h".


    If you want the machine to reboot when it is finally shutting down, begin with
    "shutdown -r".


    Either of these commands terminates all running processes, including logging out
    users. However, you must get more information before the shutdown will proceed.


    Additional flags and items can be added, depending on what you are doing. If you
    want to reboot quickly next time, you can shut off file system checking at boot
    time by adding the *-f* flag. For example, if you wanted to shut down and shut
    off the machine for some maintenance, you could shut off the next file system
    check by typing "shutdown -hf".


    If you have additional users on your system (in minutes) you may choose to give
    them some time to tidy up and log out first. In that case, you would add a time
    remaining count and perhaps a message to the command. For example, to


    +   * Reboot the system.

    * Speed up the boot process by turning off file system checking.

    * Give users five minutes to clean up and log out.


    you would type "shutdown -rft 5 Quick maintenance reboot, back up shortly".


    > TIP: If you continually use the -f option, eventually a file system check will
    be forced by the OS.'
  merge: -1
