  md: '# Table 8.2 Flags used to change user info with usermod (continued).


    | Flag | Name | Comments |

    | --- | --- | --- |

    | f | Inactive Days | The number of days after a password expires to wait before
    disabling the account. This option is only activated if the user does not change
    the password. To not use this option, enter the value -1 (the default). |

    | g | Initial Group | The group name or number you want to assign to the user.
