    # Installing The PGP RPM


    Now you have downloaded the PGP RPM, you can install it by typing “rpm -ivh pgp*”,
    unless you have more than one item in the directory starts with “pgp”. A line
    of hash marks later, and the PGP package is properly installed on your machine.
    This process may seem anticlimactic if you are used to compiling or installing
    binaries.


    # What Now?


    To learn more about the package and how to use it, you now have access to:


    +   - Man pages for the package. In this case, type “man pgp”.


    +   - Additional files that are installed along with PGP. To locate them, type
    “rpm -ql pgp”.


    If there is a file in any form that resembles “Read me first” (maybe readme.1!),
    accept the advice and read that file first. It will have the one or two versions
    behind that of the program you just downloaded and installed.


    +   - Use what you’ve learned to put the program into action. Sometimes the best
    way to learn a program is to fool around it. Just be careful and don’t run programs
    capable of large-scale damage as the root user.


    In the case of PGP, although it can be used as a standalone program, its primary
    uses are integrated with other packages. The first step many take after installing
    PGP is to create their private and public keys, and collect keys from those they
    wish to exchange encoded information with. PGP is also used to verify PGP-signed
    RPM packages, which is why PGP was chosen as an example.


