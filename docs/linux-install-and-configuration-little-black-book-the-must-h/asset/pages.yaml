  md: '# In Brief


    Many key aspects of Local Area Network (LAN) configuration are addressed during
    the install process. However, these values can change as you decide to use another
    machine name here, or alter the IP structure of your network. This chapter covers
    the steps used to change these items after the install process is completed, as
    well as configuration issues not covered during the install.


    # Planning A LAN


    Setting up a LAN needs best if thought and planning are put into it. This analysis
    needs to be done for both the hardware and the software. Some initial issues to
    consider are:


    +   * What combination of Operating Systems (OS) does the LAN need to support?

    * What network services need to be provided? Which OS should they be provided
    in?

    * How much data will be transmitted? How fast a connection between machines will
    be required?

    * How many machines are involved in the network?


    > TIP: There are entire books available on the various aspects of networking.
    Helpful hints are provided in this chapter.


    Once these questions have been addressed you will be better prepared to continue
    with your LAN.


    If you intend to hook up your LAN to the Internet, it is best to choose TCP/IP
    as the communications protocol used between machines, and this book assumes you
    are choosing TCP/IP as your network protocol. This choice prevents the need for
    adding translators if you do eventually decide to hook up to the Internet, and
    it allows you to use Internet tools within your oranget if you so choose.


    > TIP: While there was an opportunity to configure the machine to work within
    the LAN during the installation process, these individual procedures are still
    discussed in this chapter.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Networking Hardware


    The type of cabling and network connections you choose determine the route through
    which data flows in your network, and how quickly it moves. The most commonly
    chosen options are Ethernet and Token Ring.


    # Ethernet


    An Ethernet network is comprised of a long chain of machines with terminators
    on both ends to close the connections, as shown in Figure 11.1. Data is instantaneously
    broadcast to every machine on the network. If the Ethernet card on the machine
    detects that the data is meant for its unique address, the machine receives the
    information. If the data is not meant for its address, the machine ignores it.


    The speeds available in an Ethernet network depend on the cabling solution you
    choose, as shown in Table 11.1.


    NOTE: Twisted-Pair cables look like standard telephone cables. 100baseTX Ethernet
    is also called Fast Ethernet. Performance is best on a network that is inconsistently
    loaded.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_230_0.png)


    Table 11.1 Comparison of Ethernet hardware standards.


    | Standard | Cable | Speed(s) in Mbps | Maximum Cable Length in Feet |

    | --- | --- | --- | --- |

    | 10base5 | Thick Coaxial | 1, 5, 10, 20 | 1500 |

    | 10base2 | Thin Coaxial | 10 | 600 |

    | 10baseT | Twisted-Pair | 10 | 300 |

    | 100baseTX | Twisted-Pair | 100 | 328 |'
  merge: -1
  pgno: 230
- img_proc: true
  md: '![](img/2b916f28ab4fa126e516b3f9293c726b_231_0.png)


    # Token Ring


    A Token Ring network is, as its name implies, a ring-shaped network, as shown
    in Figure 11.2. Data travels in one direction around the ring at 4 or 16Mbps,
    with each machine looking to see if the data meant for it. If the data is not
    meant for particular machine, the data continues around the ring until it finds
    its destination.


    > NOTE: Network performance remains consistent regardless of network size, with
    a maximum of 260 nodes on the network. It is possible to find bridging solutions
    that allow you to use Token Ring on a Fast Ethernet 100Mbps network.


    # Services


    If you are running a single Linux machine at home, then services to run and on
    which machine are not complex issues. However, the heavier the load your servers
    can expect and the larger the network they reside on, the more complicated this
    decision becomes.


    The services, or servers, are also known as daemons. You can often spot them easily
    in a list of processes because they generally end in the letter "d" (for example,
    "httpd\ Exceptions are programs as "sendmail", which do not end in "d" but run
    in a fashion similar to daemons.


    > TIP: Many services, Internet or otherwise, are broken down into two components:
    clients and servers. Clients are what the end user accesses the service with (for
    example, a Web browser). Servers are the programs that wait to provide the information
    the client requests.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Spreading Out Services


    The heavier the load your network needs to support, the more it benefits you to
    spread services across multiple machines. Which services need to reside on which
    will have the heaviest loads. Servers that commonly benefit from having dedicated
    or mostly dedicated computers while under heavy load are:


    +   * Email

    * Web

    * FTP

    * Database

    * News


    Not only do the services benefit from being split onto other machines alone or
    in groups, but other processes benefit as well. When a server on a machine is
    under a heavy load, everything else happening on that computer is slowed down.
    If the load is heavy enough, the machine can become unusable.


    > TIP: If you cannot split services off to other machines, then increasing the
    overloaded computer''s RAM and/or processor speed can help greatly.


    # Determining If You Need Dynamic Routing


    If your network or subnet requires a router, as shown in Figure 11.3, you can
    configure one of the Linux machines to perform this task. Whether this box has
    another job is well up to, but in general since it''s the only machine directly
    connected to the network or Internet, it''s good to make it a single-task machine
    or to place your Internet servers directly on it instead of behind the router.


    Not all networks need an explicit router; in some cases the modem itself can act
    as a router. If your modem does not do routing for you, then an explicit router
    is necessary if you have one or more of the following conditions:


    +   * Only one IP address for the Internet is available for your network, even
    though the network has multiple machines.

    * You want to connect on one or more machines from a different network (one with
    a different block of IP addresses) to the current network.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_232_0.png)'
  merge: -1
