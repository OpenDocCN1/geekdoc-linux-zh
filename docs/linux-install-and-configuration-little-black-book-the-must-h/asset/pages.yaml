  md: '# Finding Help


    Many of the commands in Linux come with extensive documentation. The quickest
    way to get assistance is with the man (short for manual) command. This will bring
    up the manual page for the command, if there is one. To open a man page, type
    “man command"; to exit it, press the q key.


    If the beginning of the man page says that the documentation is no longer maintained
    and should be viewed with the texinfo program instead, use the format info command
    to read the file.


    # Running Commands In The Background


    To run a command without allowing it to take over your login session, use the
    ampersand (&) in the format command &.


    # Identifying Currently Running Commands


    There are two subtly different methods of seeing what''s currently running on
    a machine. One lists the commands currently being run, and the other lists the
    processes.


    # Finding Out What Commands You Are Running


    To see what commands are running in the background, use the jobs feature. Typing
    this lists any commands you may have in the background, if any. The most important
    piece of information in this listing is often the job number, which is the number
    to the far left.


    # Finding Out What Processes You Are Running


    To see what processes you are currently running, use the ps command. This listing
    only reflects what you are doing in the virtual terminal it''s typed within. Once
    again, the most important piece of information is the number at the far left,
    or the Process ID (PID).'
