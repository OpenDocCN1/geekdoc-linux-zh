  md: '# In Brief


    As you look for new files and programs to download, and prepare to send files
    or programs to other people, package management becomes a serious issue. Understanding
    the ins and outs of package and file formats can help reduce your own frustration
    and confusion, because you can much more easily determine the fastest route to
    accomplish things.


    This chapter covers the various types of packaging you will encounter in your
    explorations and how to choose among them.


    # Choosing Package Formats\To Download


    Often you have the opportunity to download a package in more than one format.
    The common choices you are given when downloading Linux software:


    +   - Source

    - Binaries

    - RPMs


    Which one you choose depends on your level of expertise with programming, how
    standard your setup is, and whether you want to customize things highly or try
    them as they come by default.


    # Downloading Source


    Choosing to download the source code for a package is in many ways the most complex
    solution available. It is complex if you download the source, you must compile
    it before you can install it. Reasons to go to this route:


    +   - You are familiar with programming and know ahead of time that you want to
    make some adjustments to the source before compiling.

    - You have tried the other options available and for various reasons they did
    not work properly.

    - Source is the only format through which the program is available.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# In Brief


    Once you have the source you will need to compile it. This topic is covered in
    more detail in Chapter 16.


    # Downloading Binaries


    Choosing to download a binary is often a simple procedure. This is because the
    binary is already compiled version of the program, saving you the potential headaches
    of trying to compile it yourself. The issues you have to deal with when installing
    a binary are:


    +   * The binary may not be fully compatible with your particular Linux setup.

    * You cannot alter the binary itself.

    * How quickly you get the binary properly installed depends on the quality of
    the README file that comes with it.


    NOTE: If the product is Open Source, the source code is available to you if the
    binary is not compatible with your system, although it might be in an alternate
    download area.


    # Downloading RPMS


    The current format of choice for downloading for both Caldera and Red Hat is the
    Red Hat Package Manager (RPM) file. However, don''t always trust that it''s an
    RPM means it is safe. The most worthy sources for RPMS include, but are not exclusive
    to:


    +   * Red Hat''s Web and FTP sites.

    * Caldera''s Web and FTP sites.

    * The company or group who created the software''s Web and FTP sites.

    * Well-known and trusted Linux software download sites.

    * RPMs that are PGP (Pretty Good Privacy, an encryption program)-signed by trusted
    sources.

    * RPMs you make yourself.


    TIP: A trustworthy site is one that takes care to ensure that the downloads it
    offers are what they claim to be. This is especially a concern when the general
    public is allowed to upload packages. Each package must be tested for its validity
    and safety. Even so, it is wise to check each package yourself as much as you
    can, rather than blindly trust what you get.


    These principles apply to any downloads, not just RPMS.'
