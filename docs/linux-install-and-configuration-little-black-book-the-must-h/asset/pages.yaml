    # Setting Backups To Run At Specific Times


    One tool Linux offers is cron. The cron continuously watches its configuration
    files for the system and the individual users for when it needs to run specific
    processes. The configuration files for the systemwide cron are in /etc/crontab
    and consist of: cron.hourly, cron.daily, cron.weekly, and cron.monthly. The cron
    configuration files for each user are stored in /var/spool/crontabs and are modified
    with the crontab program, not by hand.


    The basic format for adding a new process to the system cron files follows the
    following:

    m h d y w task'
