  md: '# In Brief


    The kernel is the Linux operating system itself. While the command interface—the
    shell—does not tend to change often, the kernel is constantly being worked on
    by people all over the world. The temptation is to upgrade immediately each time
    a new version is released. However, this is not necessary with Linux, nor is it
    recommended.


    # Why To Compile


    Many experienced Linux users install their systems, and immediately turn around
    and recompile their kernels. The reason they do this is that, even though Red
    Hat and Caldera provide more optimized kernels from the beginning than they used,
    the only way to fully optimize the kernel is to compile it yourself.


    Here are some reasons for you to consider recompiling the kernel:


    +   - There is a program you want to run, but the operating system keeps telling
    you the kernel doesn''t support a feature it needs.

    - There is a kernel feature you need, such as having between 1GB and 2GB of RAM
    in your machine that can only be activated by compiling the kernel with modifications.

    - You want to optimize the kernel so that it runs its best on the machine in question
    and also takes up less RAM.


    # Why Not To Compile


    If you only want to add a small amount of functionality to your kernel, you may
    not need to compile it at all. By default, Red Hat and Caldera kernels are modular;
    this means that there is a small base kernel, and specific modules are loaded
    and removed as needed. Using modular kernels can free up significant amount of
    RAM, depending on how large the kernel would be otherwise.


    > NOTE: A non-modular kernel, where everything is compiled directly into it, is
    called a monolithic kernel.


    Sometimes adding a new feature is as simple as loading a new kernel module.'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'In Brief


    **TIP**: When Caldera provides an upgraded kernel on its site, the kernel comes
    as a binary RPM, which is simple to install—no compiling necessary.


    # # Kernel Upgrade Issues


    Another reason to compile a kernel is to upgrade to a new version. Because the
    kernel changes so rapidly, it is important not to upgrade every time a new version
    comes out, especially on a production machine that requires stability. Instead,
    many users only upgrade when necessary, or when a major kernel becomes available.
    Reasons to upgrade include:


    +   - You need access to specific device drivers and/or support added to the new
    kernel version.


    +   - Bugs listed as fixed in the new kernel version are adversely affecting your
    machine''s performance.


    +   - Software you want or need to install a newer kernel than you are using.


    +   - It has been a long time since you upgraded and the machine is not critically
    important, so you want to upgrade now while you have the time to fix anything
    that breaks in the process.


    +   - New features have been added to the new versions of the kernel that you
    want to access.


    +   - A security problem has been found and fixed in the new version of the kernel.


    **NOTE**: A flip-side issue is that once you upgrade your kernel, you will likely
    have to upgrade software packages you''ve been using fine up until that point.
    This issue is one reason to try to wait to upgrade kernels until you deal with
    all of the sides involved.


    # # Which Kernels To Use


    It is important to pay attention to kernel numbers when determining which to use.
    There are two different streams of kernel development. One of these paths is highly
    experimental and only recommended for use by those who can afford to running a
    beta kernel on their machine. Generally, the kernel path you want to choose from
    is the production kernel, because it is well tested and ready to be used on a
    machine that cannot afford operating system bugs and downtime.


    However, if there are features that would greatly benefit your system and are
    available only in the latest experimental version, sometimes'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'it is worth attempting. Be sure to keep a copy of a LILO instance for the kernel
    that already works for you, so that you can easily move back to it if the experimental
    kernel causes too many problems. See the section “Adding A LILO Option For The
    New Kernel” for more information.


    # Kernel Configuration Options


    Once you reach the point in the kernel replacement process where you have to configure
    what it supports, you''re faced with the difficulty of understanding the options
    presented to you. Things to eliminate from the kernel are:


    +   - Drivers for hardware you don''t have and don''t intend to install.

    - Math emulation in a machine that has a math coprocessor chip. Almost every machine
    that''s a 486DX and above has such a chip built in.

    - Anything labeled “Experimental” unless you absolutely need it.

    - Networking capabilities you have no use for.


    You can refer to the file Documentation/Configure.help in /usr/src/linux directory
    for a breakdown of the individual options.'
  merge: -1
