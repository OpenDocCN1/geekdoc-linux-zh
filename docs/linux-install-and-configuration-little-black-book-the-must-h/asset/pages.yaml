  md: 'Dear Reader:


    Coriolis Technology Press was founded to create a very elite group of books: the
    ones you keep closest to your machine. Sure, everyone would like to have the Library
    of Congress at arm''s reach, but in the real world, you have to choose the books
    you rely on every day very very carefully.


    To win a place for our books on that coveted shelf beside your PC, we guarantee
    several very important qualities in every book we publish. These qualities are:


    +   * Technical accuracy—It''s no good if it doesn''t work. Every Coriolis Technology
    Press book is reviewed by technical experts in the topic field, and is sent through
    several editing and proofreading passes in order to create the piece of work you
    hold now in your hands.


    +   * Innovative editorial design—We put years of research and refinement into
    the ways we present information in our books. Our books'' editorial approach is
    uniquely designed to reflect the way people learn new technologies and search
    for solutions to technology problems.


    +   * Practical focus—We put only pertinent information into our books and avoid
    any fluff. Every fact included between these two covers must serve the mission
    of the book as a whole.


    +   * Accessibility—The information in a book is worthless unless you can find
    it quickly when you need it. We put a lot of effort into our indexes, and heavily
    cross-reference our chapters, to make it easy for you to move right to the information
    you need.


    Here at the Coriolis Group we have publishing and packaging books, technical journals,
    and training materials since 1989. We are programmers and authors ourselves, and
    we take an ongoing active role in defining what we publish and how we publish
    it. We have put a lot of thought into our books; please write to us at ctp@coriolis.com
    and let us know what you think. We hope that you''re happy with the book in your
    hands, and that in the future, when you reach for software development and networking
    information, you''ll turn to one of our books first.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_4_0.png)'
