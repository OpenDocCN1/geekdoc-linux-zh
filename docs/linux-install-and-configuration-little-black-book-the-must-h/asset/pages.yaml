- img_proc: true
  md: 'For example, if in step 3 you found the keyring in /etc/pgp/rings then you
    would type "PGPATH=/etc/pgp/rings".


    **NOTE:** To test and make sure the path was set properly, type echo "$PGPPATH".


    +   5. Verify the package by typing "rpm -K --checksig package.rpm".


    # Verifying That An Installed RPM Package Has Not Been Changed


    You can verify that a package is missing files or changed without your knowledge
    by checking against the original RPM used to install it. To do so for a single
    package, type "rpm -V package-name".


    If there is nothing wrong, then no data will be given. If some form of change
    is detected, then it is given in the form of:


    SM5DLUG c file


    What each of these stands for is shown in Table 15.1.


    Look for the following in the results:


    +   * If a necessary file is missing, the complete path for that file is shown.

    * If a dependency is missing, the necessary package name is given.

    * Any SM5DLUG listings. Some of these could have been changed simply along the
    lines of normal system maintenance and are fine. However, changes also could be
    the symptom of a problem.


    | Table 15.1 The meaning behind rpm -V output. |

    | Code | Meaning |

    | S | File size. |

    | M | File mode. |

    | 5 | MD5 checksum value. |

    | D | Major and minor file numbers. |

    | L | Symbolic links. |

    | U | File owner. |

    | G | File group. |

    | T | File modification time. |

    | C | Displayed if the file is a configuration file. |

    | file | The complete path to the file that failed verification. |'
