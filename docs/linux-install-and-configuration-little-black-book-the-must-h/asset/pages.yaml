  md: '# Unmounting Off Of The File System


    To remove a device from the file system, use the **mount** command in one of the
    following two formats:


    +   - unmount /dev/device

    - unmount /mnt/mountpoint


    > **NOTE:** Notice that the command to unmount is *mount*. This difference causes
    a lot of confusion.


    # Shortening common Mount Commands


    You can shorten common mount commands by adding references to them in the file
    /etc/fstab. To accomplish this task, do the following:


    +   1. Log in as **root**.

    2. Open the file /etc/fstab with a command such as *vi /etc/fstab*.

    3. Look to see if a line pertaining to what you want to add already exists. For
    example, /mnt/cdrom and /mnt/floppy often already exist in this file because they
    are commonly used. The second column contains the names of the mount points. If
    your idea already exists in the file, exit by typing “:q”, then pressing Enter.

    4. If using **vi**, type “G” to go to the end of the file, then “o” to open a
    new line.

    5. Entries for /etc/fstab follow the following format:


    ```

    /dev/device /mnt/mountpoint type rules dumpable order

    ```


    Because this is a device that will not be automatically mounted at boot time,
    this format can be reduced to:


    ```

    /dev/device /mnt/mountpoint type noauto 0 0

    ```


    +   6. Determine the device you want to mount.

    7. Create the mount point at which you want to mount this device keep in mind
    that this needs to be something easy to remember. If, for example, you are specifically
    creating a short mount command to mount MS-DOS floppies, then consider a mount
    point such as /mnt/dosfloppy.

    8. Choose the appropriate file system type. For the /mnt/dosfloppy example, this
    type is **msdos**.'
