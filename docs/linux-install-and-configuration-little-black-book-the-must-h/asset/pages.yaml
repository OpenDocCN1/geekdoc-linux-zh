    # # Booting Into Linux


    To boot into Linux, do the following:


    +   1. Reboot your computer.


    > **TIP**: If you have LILO on a floppy, be sure to have the disk in the floppy
    drive before rebooting.


    +   2. LILO activates. If the install hangs at this point (you see L, LI, or LIL
    instead of the full LILO), see the section “Diagnosing Boot Hang During LILO.”

    3. Once LILO fully loads, its boot prompt appears as


    LILO boot:


    +   If one of the following cases is true, you don''t need to interact with the
    boot prompt:

    * Linux is the only OS on the computer.

    * Linux is the OS that LILO was set to boot to by default.

    * You are booting into Linux for the first time and have not yet fully set up
    LILO.

    Otherwise, type in the designation for the OS you want to boot into and press
    Enter.


    # # Diagnosing Boot Hang During LILO


    When “LILO” displays on your screen, each letter stands for a part of the boot
    process. Table 4.4 shows the meaning of each error display within the LILO boot.
    You will know if you need this table because the boot will stop at one of the
    stages listed.'
  merge: -1
