  md: '# Immediate Solutions


    # Launching The Installer From The CD-ROM


    The preferred way to install Caldera OpenLinux is from the CD-ROM itself. Most
    modern machines can accommodate this, but not all machines are capable of it.
    You can determine if yours will or will not by following through the process.


    TIP: If you''re installing Caldera on a machine that it has to share with Windows,
    consider the instructions in "Installing Caldera From Windows" instead.


    To install Caldera from a CD-ROM, do the following:


    +   1. Reboot your machine and press the appropriate key to enter the BIOS at
    the beginning of the boot process.


    +   2. Enter the segment of your BIOS that controls which drive order the system
    checks while booting. In some versions of BIOS this menu option is "BIOS FEATURES
    SETUP."


    +   3. Change the boot order of the drives so that CD-ROM comes first in the listing.
    If the only drives that are offered are floppies and hard drives, then your BIOS
    does not support booting from the CD-ROM and you will need to use one of the other
    boot options, either "Installing Caldera From Windows" or "Installing Caldera
    With Boot Disks."


    +   4. Make sure the Caldera CD-ROM 1 is in the CD-ROM drive.


    +   5. Save, then exit the BIOS.


    +   6. As the machine reboots, the install program starts automatically.


