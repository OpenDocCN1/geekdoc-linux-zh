  md: 'TIP: If this command fails, it means that logins are not being logged. To ensure
    that they are, type `touch /var/log/wtmp` as root to create the log file.


    # # Listing Attempted Logins


    To see a list of who last failed to log in to the system, use the **lastb** command.
    As with the **last** command, to see more than the number of attempts, use the
    format `lastb -n number`.


    TIP: If this command fails, it means that logins are not being logged. To ensure
    that they are, type `touch /var/log/wtmp` as root to create the log file.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_408_0.png)


    # # Finding Security Breaches


    When security has been breached, or you think it has been breached, there is a
    good chance that telltale footprints have been left in the system logs or elsewhere.
    Good things to do are:


    +   - The system logs every login and attempted login. See the sections "Listing
    Logins" and "Listing Failed Logins" for instructions on how to get these lists.
    The list of failed logins, especially, will let you quickly see if someone has
    been working hard to gain root access or a user''s password.


    +   - If you are using the Shadow Suite, look in /etc/passwd to see if the Shadow
    Suite is disabled—in which case passwords are now stored in /etc/passwd. It requires
    root access to change this feature, so it has happened you know that the hacker
    has root access on the machine.


    +   - Look to see if unfamiliar user accounts have been created that have unusual
    privileges.


    +   - A hacker who has good tools or knowledge will replace important system functions.
    Use a standalone machine, or one that has not been compromised, to install a copy
    of commands like **ls** onto a floppy disk—the best method is straight from the
    distribution CD-ROM. Then make sure that the creation dates are not recent on
    the system''s versions of the following programs: **ls**, **ps**, and all of the
    networking daemons.'
