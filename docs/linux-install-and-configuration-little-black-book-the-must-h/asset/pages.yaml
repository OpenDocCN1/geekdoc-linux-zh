  md: '# Restoring Full Backups From Tape Or Floppy


    To restore a full backup from floppy or tape, do the following:

    1. Make backups of any surviving files that are more recent than the archive you
    are about to restore.

    2. Put the first media in the drive.

    3. Type the following command to restore your system to its state when fully backed
    up:


    ```

    tar xfsM /dev/fd0

    ```


    4. Restore any newer files from the secondary backups.


    | Related solution: | Found on page: |

