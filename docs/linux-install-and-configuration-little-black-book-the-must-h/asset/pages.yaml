    **NOTE:** Remember that you can install more packages at any time if it turns
    out you have forgotten something.


    # LILO, the Linux LOader


    LILO is a boot manager (a program that allows you to choose which operating system
    you want to use at boot time). LILO—or another boot manager, as listed in Table
    4.1—must be installed regardless of whether you have only Linux, or have multiple
    operating systems installed. This is because your computer cannot boot with Linux
    unless it knows where to find the kernel, which is in many ways the OS itself.
    LILO gives your computer this information.


    You have several options of where to install LILO on your system. Each option
    has its advantages and disadvantages. If you are running other operating systems
    aside Linux on the same machine, be sure that you have emergency boot disks available
    for each of them. Even if you never need them, having these disks available usually
    means you can rest easy if something went wrong with the LILO install.


    **WARNING:** If you intend to dual-boot Linux on a computer that also contains
    NT, it is imperative that you create an updated Emergency Repair Disk before installing
    Linux. This way, if something happens to the boot sector during the install, you
    can recover your NT system.


    If you have Linux and NT sharing a computer, you can use NT''s boot manager instead
    of LILO. The same goes for OS/2 and its boot manager.


    Table 4.1 Alternative boot managers.


    | Boot Manager | Source |

    | System Commander | www.v-com.com |

    | NT OS Loader | NT Distribution Disks |

    | OS/2 Boot Manager | OS/2 Distribution Disks |

    | Partition Magic | www.powerquest.com |


