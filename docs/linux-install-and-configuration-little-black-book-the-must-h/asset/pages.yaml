  md: '# Getting Linux To See More Than One GB Of RAM


    Red Hat Linux 6.0 and later by default sees at least 1GB of RAM with no adjustments.
    If you have more than 1GB—up to 2GB—of RAM, then you can configure Linux to see
    this extra memory by recompiling the kernel. There is more information on recompiling
    the kernel in Chapter 17.'
