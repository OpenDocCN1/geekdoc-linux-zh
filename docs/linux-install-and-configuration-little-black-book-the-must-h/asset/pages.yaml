  md: '# In Brief


    Having recent system backups makes the greatest difference between a traumatic
    system crash and a minor annoyance. You can use a number of backup hardware, software,
    and timing options, depending on the importance of the machine and each segment
    of its file system.


    # Backup Hardware


    A variety of hardware is available for creating system backups. Each type has
    its strengths and drawbacks when it comes to issues like price, storage space,
    and ease of use. Be sure before obtaining any new hardware for backups that you
    check the Hardware Compatibility List for your distribution and ensure that there
    are drivers available.


    When choosing what medium to use for backups, keep in mind not only the price
    of the drive, but the price of the storage components (tapes, disks, and so forth)
    as well.


    # Floppy Disks


    One medium most computer users have access to is the floppy disk. Although it
    is not convenient for backing up large volumes of data, the floppy disk is useful
    for smaller backups, even those that span multiple disks.


    Advantages of using floppy disks for backing up are:


    +   * They are inexpensive.

    * They can be used in almost all machines that have floppy drives and recognize
    the formatting used.

    * They are reusable.

    * They can be stored separately in a safe or other secured location.


    Disadvantages of using floppies are:


    +   * The disks hold a small volume of data.

    * The contents of floppy disks can degrade over time.


    # Tape Drives


    A wide range of tape drives is available on the market. These drives come in many
    prices, access speeds, and storage sizes. The higher'
