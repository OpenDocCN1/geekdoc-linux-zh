- img_proc: true
  md: 'The VTimings term is laid out the same way as the horizontal timings, except
    that it refers to the vertical statistics for the monitor.


    The Flags term calls for any flags necessary to tell the X server specific things
    about your display. Interlace is the one most commonly used.


    A ModeLine statement, however, has all this information on a single line of text.
    So the data given in the previous Mode statement translates to the following ModeLine
    statement:


    ```

    ModeLine "1024x768i" 45 1024 1048 1208 1264 766 778 784 817 Interlace

    ```


    There is usually a long series of these statements, each defining behavior for
    a particular mode type.


    +   Save and exit the file.

