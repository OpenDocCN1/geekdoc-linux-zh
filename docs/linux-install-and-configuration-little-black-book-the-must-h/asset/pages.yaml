    # Installing The Samba Package From The Source


    If you want or need to use the latest source instead of the packages provided
    on the CD-ROMs, follow this procedure:


    +   1. Download the source from www.samba.org/

    2. Unpack the source into the directory of your choosing.

    3. Read the README file for up-to-date information on install procedures and additional
    options.

    4. Compile the source as instructed in the README.

    5. Follow any additional instructions regarding permissions or file moving in
    the README.

    6. Configure Samba as detailed in this chapter unless the README instructs otherwise.


    > NOTE: When new versions of programs become available, both Red Hat and Caldera
    make RPMs and post them on their sites.'
