  md: '# Configuring The Master Server


    The NIS server itself is the program "ypserv" in Red Hat, or "nis-server" in Caldera.
    To configure the machine you intend to use as the NIS master server, do the following:


    +   1. Log in as **root**.

    2. Edit the file /var/yp/securenets.

    3. Leave the line for the local host alone; you need that one in place so you
    can use a client to test NIS from the server machine.

    4. Delete the line that leaves NIS open to all callers. Replace it with one of
    the following types of entries, or a combination of them:

    * To specify an entire network that uses one string of IP addresses, use the format
    "netmask-openings IP-openings". For example, if you have a class C network owning
    192.168.15.0/255.255.0.0. The zeros zeros represent items that are available to
    be changed.

    * To specify a segment of a set of IP addresses, use the same format as but adjust
    the netmask-openings term to allow movement within the IP addresses. For example,
    if you have a C network spanning 192.168.15.0 through 192.168.17.255 that you
    want to allow access to the NIS server, add the entry "255.255.0.0 192.168.15.0".
    The 253 allows the second part of the IP address to grow by two from the starting
    point—the second entry—and the ending zeros allow the full range of changes in
    the addresses.

    5. Save and close the file.

    6. Edit the file /etc/ypserv.conf.

    7. If you are using DNS instead of simply filling out the host files, then change
    the DNS entry to “yes".

    8. Save and exit the file.

    9. In Red Hat type "/etc/rc.d/init.d/ypserv start". In Caldera type "/etc/rc.d/init.d/nis-server
    start".

    10. Generate the NIS database by typing "/usr/lib/yp/ypinit -m".


    # Configuring The Clients


    The NIS client exists of the program ybind, which must be running at all times.
    It''s a good idea to do this on all of the machines, including the servers, since
    they will need clients as well. To set the NIS client up on a machine, do the
    following:'
