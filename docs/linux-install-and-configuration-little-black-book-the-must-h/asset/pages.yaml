  md: '# Chapter 21 Security Issues


    +   - If your networking service logs or any system logs have time holes in them
    and you know you did not shut off system logging, to be very suspicious.


    **TIP:** If security is of great concern to you, consider writing a program to
    watch the logs and report suspicious activity.


    # # Keeping Up With Security Issues


    You can keep an eye on a number of places for security advisors and pointers on
    how to plug newly discovered holes:


    +   - Both the Red Hat and Caldera distributions have announcement lists that
    offer immediate knowledge of when security updates are uploaded to their sites.
    Joining one of these lists is highly recommended. To join the Red Hat, write to
    the address redhat-announce-list-request@redhat.com with the word "subscribe"
    in the subject line, and leave the body of the message empty. To join the Caldera
    list, send an email with a blank subject to the address majordomo@lists.calderasystems.com,
    with the text "subscribe Announce" in the body.

    - If you installed the Red Hat distribution, watch their site regularly (weekly
    or even more often) at www.redhat.com/errata for security updates and fixes.

    - If you installed the Caldera distribution, surf to the updates from www.calderasystems.com/support/resources.

    - One of the central clearinghouses for operating system security information
    on the Internet is the Computer Emergency Response Team (CERT) site. Their Web
    page is www.cert.org.


    # # Determining If A Firewall Is For You


    Firewalls are wonderful protection for some sites, but a constant problem for
    others. Before you implement one, give some thought to whether a firewall is appropriate
    for your LAN, or whether other options might be better for system security.'
