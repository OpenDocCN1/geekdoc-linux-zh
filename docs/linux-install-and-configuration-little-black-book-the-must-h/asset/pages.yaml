  md: '# Editing LILO


    Editing LILO''s configuration file, log on as root and edit the file /etc/lilo.conf
    with your preferred text editor. Make the changes you want to make, save and close
    the file, then re-run LILO (see the section “Running LILO”) to activate the changes.


    For example, if using the vi text editor, the steps would be:


    +   1. Log in as root.

    2. Type "vi/etc/lilo.conf" to edit the file.

    3. Use the arrow keys to move the cursor to where you want to add text.

    4. Press i to enter vi''s Insert mode.

    5. Make the desired changes.

    6. Press the ESC key to enter Insert mode.

    7. Press the colon (:) key to enter Colon mode.

    8. Type "wq" and press Enter to save and exit the file.


    # Determining Disk Parameters


    If at any point you see an error involving disk parameters or geometry, you may
    have a disk that is set up in a kernel that was not expecting.


    > TIP: Before you continue, first see the section “Edit LILO.” In the global section
    type in the word “linear”, save and exit the file (see the section “Running LILO”),
    and then reboot. This sequence might fix your problem.


    To enter your disk geometry, do the following:


    +   1. Write down the hex BIOS code for your hard drive. This code is given as
    part of the error message that led you to this point. It probably said something
    like one of the following examples:


    ```

    geo_query_dev HDIO_GETGEO (dev 0x50)

    Device 0x50: Got bad geometry 24/48/248

    ```


    > TIP: If the error message comes in the second format, the last three numbers
    are actually sectors/heads/cylinders. Write these down and skip directly to Step
    5.'
