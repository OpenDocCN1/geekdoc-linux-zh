    # Preparing To Configure X In Caldera


    To configure your X settings within Caldera, do the following:


    +   1. Log in as root.

    2. Type "init 3" to close the GUI and go to command-line only mode if you are
    currently in the GUI.

    3. Log in as root once again in one of the virtual terminals.

    4. Type "XF86Setup" to run the setup program, which brings you to the screen shown
    in Figure 6.1.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_139_0.png)


    Figure 6.1 The XF86Setup initial screen.


    +   5. If many of the X settings are already correct, choose Yes using the current
    file for the default settings. If you want to make significant changes, choose
    No. Use the Tab key to move between the options. Press Enter once you have made
    your selection. This brings you to the next screen, shown in Figure 6.2.

    6. Press Enter to go into graphics mode. This mode involves a simple GUI with
    a basic configuration that will not damage your monitor, as shown in Figure 6.3.

    7. Once you are in this mode, you can configure the various X settings. Each of
    these is covered in its own individual section.'
