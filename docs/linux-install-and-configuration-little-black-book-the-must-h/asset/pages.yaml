  md: '# Recognizing A Runnableable Program


    There are a few ways you can recognize a runnable program:


    +   - One of the fastest ways to recognize a runnable program is to look at its
    permissions. If the executable (x) bit is set, then it is a runnable program.
    However, if the permissions are improperly set for some reason, this method will
    not suffice.


    +   - If you think a program might be an executable, try looking at its man page
    by typing "man program".


    +   - One way to test whether something is runnable or not is simply to try to
    run it. This can be a bit risky in some ways, depending on what the software or
    script does.'
