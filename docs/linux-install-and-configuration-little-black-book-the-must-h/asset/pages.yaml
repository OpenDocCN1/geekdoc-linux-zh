    you also want development tools, GUI, and Web browsing, networking, services,
    and such features, the system requirements go depending on how many features you
    want to have. In general, the speed of the CPU is not as important as how much
    RAM is installed within it. The more memory your computer has, the better it will
    run with Linux.


    On the flip side of this issue, Linux is one operating system for which it can
    be better to have equipment around for a while. Linux supports most hardware for
    the PC, but not all. Bleeding-edge devices (brand new items that use technology
    which has not been used enough by the general public to be fully supported or
    mature) often take a bit of time to be supported by Linux. For example, brand
    new leading-edge video and sound cards tend to be a problem. To find the status
    of certain hardware technologies under the Linux


