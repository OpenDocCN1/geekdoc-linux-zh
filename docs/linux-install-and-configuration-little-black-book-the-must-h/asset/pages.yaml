  md: '# In Brief


    Now that you have done the preliminary work, it is time to install the operating
    system. It is important not to skip the preparations in Chapters 1 and 2 before
    proceeding. There are too many issues that can catch you off-guard. Issues such
    as hardware not supported by the distribution, or placing the first stage of Linux
    LoOader (LILO) above the 102rd cylinder on your hard drive can make installation
    a miserable experience if you are not prepared.


    The Red Hat 6.0 Linux distribution comes with an installation program that walks
    you through the procedure. This chapter focuses on making the most out of the
    options provided, and dealing with any problems you might encounter. Even though
    the install can be a straightforward process for some people, specific conditions
    can make it more complex. Whether these complexities come from hardware or configuration
    issues this chapter leads you through to resolve them.


    # The Install Process


    When going through the installation process, it is important to read through the
    options. The ease with which you can later up services is determined by what packages
    you choose at this stage. Any mistakes you make here can, however, be corrected
    after the install through a variety of methods:


    +   - Reinstalling Linux

    - Adding or removing software.

    - Additional configuration of software and Linux.

    - Adding or removing modules from the kernel.

    - Recompiling the kernel.


    > TIP: Many people reinstall at least once, if not multiple times, in an effort
    to fix persistent problems or fine-tune after they understand Linux more thoroughly.
    You may want to consider your first install and setup as a process run.


    Once you reach the point where the installer is building your file system, you
