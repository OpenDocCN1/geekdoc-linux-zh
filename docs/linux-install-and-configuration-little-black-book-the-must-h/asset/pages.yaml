    # Doing A Full Backup To Floppy Disks Or Tape Drive


    When backing up floppy disks, often the tar program is used to create the backup
    files. Part of the reason for this is that tar can spread the file across multiple
    disks. To create a backup to floppy disk, do the following:


    +   1. Determine which device driver your floppy is attached to. The example that
    follows assumes /dev/fd0. If you have a tape drive instead, use the driver for
    the tape system.

    2. Make a file system (format) the number of floppy disks or tapes you project
    that you will need. To format each disk, type “mke2fs /dev/driver”. For example,
    “mke2fs /dev/fd0”.

    3. Mount the first floppy or tape.

    4. Type the following tar command:


    ```

    tar cfzM /dev/fd0 /

    ```


    This command begins the archiving process, which will prompt you for new media
    as necessary.

    When the backup is finished, bundle the volumes together, label them in order,
    and put them in a safe and easily accessible place.


