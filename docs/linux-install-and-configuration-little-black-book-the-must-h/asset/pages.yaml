    | Code | Definition | Potential Solutions |

    |---|---|-|

    | 0x00 | Internal error | Try rerunning LILO to rebuild the map file (see "Running
    LILO"). This error can result from corrupted data. |

    | 0x01 | Illegal command | Make sure the drive LILO is installed to be recognized
    properly by your BIOS. You may have too many physical drives installed. If your
