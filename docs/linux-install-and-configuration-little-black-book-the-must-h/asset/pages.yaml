  md: '# Immediate Solutions


    # Making A File System


    Linux has the ability to make several file systems with the mkfs command. The
    most useful of these are the Linux file system ext2 and the MS-DOS file system.
    This feature makes it much simpler for you to transfer data between different
    operating systems.


    To make a Linux file system on a device, do the following:


    +   1. Determine what device you want to make the file system on. Is it a floppy
    disk? In that case, is it in the first floppy disk? If so, the device is likely
    /dev/fd0.


    +   2. Determine if you want to check for bad blocks—physical defects—during the
    formatting process. If so, you will need to include the -c flag.


    > TIP: Another frequently used flag is -v, for verbose. In the examples below
    you would use-cv instead of -c.


    +   3. Determine which type of file system you want to make: Linux''s ext2 or
    MS-DOS.


    +   4. Build the command in one of the following formats:

    - For a Linux floppy use the mke2fs command, in the format mke2fs flags device.
    For example, type "mke2fs -c /dev/fd0".

    - For an MS-DOS floppy, use the mkdosfs command in the format mkdosfs flags device.
    For example, type "mkdosfs -c /dev/fd0"


    > TIP: You may need to install the mkdosfs package as an RPM off the distribution
    CD-ROM.


    # Mounting Onto The File System


    To mount a partition or disk onto the file system, use the mount command. Build
    the command with its options, as follows:


    +   1. Determine what device you want to mount onto the file system. Is it a floppy
    disk? The device in that case is likely /dev/fd0.'
