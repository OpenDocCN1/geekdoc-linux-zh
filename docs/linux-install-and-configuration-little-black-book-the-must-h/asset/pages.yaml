  md: '# # Dialing In From The Command Line


    To dial in from the command line, do the following:


    +   1. Log in as root.


    +   2. Type `ppp-go -c` to connect to the Internet.


    +   3. Type `ifconfig` and see if a *ppp0* section is included. If so, you''re
    up and running. If not, then you may need to work on the modem init script or
    connect script.


    +   4. To hang up, type `ppp-off`.


    # # Dialing In From The Caldera GUI


    To dial in from Caldera''s **kppp** tool, do the following:


    +   1. Log in as **root** in the GUI.


    +   2. Open the **kppp** tool.


    +   3. Choose the connection you want to use from the Connect To drop-down box.


    +   4. Fill in the login ID and password if necessary.


    +   5. Click the Connect button.


    # # Dialing In From The Red Hat GUI


    To dial in from Red Hat''s **Linuxconf** tool, do the following:


    +   1. Log in as **root** to the Red Hat GUI.


    +   2. Click on the PPP/SLIP/PLIP option under Config, Networking.


    +   3. Click on the entry in the configuration listings you want to to dial. The
    PPP interface ppp0 dialog box comes up.


    +   4. Click the Connect button to connect to the Internet.


    +   5. When finished, click the Disconnect button.'
