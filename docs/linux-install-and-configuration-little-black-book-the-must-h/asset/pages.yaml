    # Configuring Name Resolution For The Machine


    To configure Domain Name Service (DNS) within your LAN, you may need to edit multiple
    files. First you must tell your system what DNS services to use. It also needs
    to know what order to use these services in, and what options you want we set.
    The defaults set during the initial install are often sufficient for many people''s
    needs.


    > TIP: Often there is no need to change the file /etc/host.conf. Instructions
    on how to do so are included in case you have a need to change the default file.


    Do the following to accomplish this task:


    +   1. Log in as **root**.

    2. Edit the file /etc/host.conf.

    3. Set the options that are appropriate for your network. The available options
    for host.conf are shown in Table 11.3.

    4. Save and close the file.


    > TIP: If edits are necessary, you must edit /etc/host.conf on each machine within
    the LAN, even if you do not intend to run a Domain Name Server locally. The exception
    to this statement is if the machine is entirely standalone.'
  merge: -1
