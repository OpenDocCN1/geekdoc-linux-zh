  md: '# Chapter 2 Partitioning Hard Drives


    ![](img/2b916f28ab4fa126e516b3f9293c726b_49_0.png)


    # How Much Space To Assign


    The simple but annoying answer to the question of how much space to assign to
    Linux involves what you intend to do with it. If the machine is intended to be
    a server of some sort, then usually it should only contain the Linux operating
    system. A desktop machine can be set up to dual-boot and can have its partitions
    split between multiple operating systems.


    The Red Hat and Caldera distributions have minimum requirements of 500MB and 300MB,
    respectively, but let''s be a little more realistic. You may want programming
    tools, graphical user interfaces, games, text editors, graphics tools, Internet
    programs, and then some. Perhaps your goal is to set up a LAN that, along with
    supporting a number of users, also stores mission-critical data. For instances,
    the drive space required grows into the Gigabytes.


    It is a good idea to have Linux on a separate hard drive instead of sharing with
    another operating system, if you can afford to do so. With prices continually
    falling, a new hard drive could be a wise and inexpensive investment. For the
    features and flexibility Linux has to offer, the extra space prove worth it. However,
    Linux can peacefully coexist with other operating systems, whether on the same
    hard drive or on separate ones. The main reason for separating operating systems
    is that something goes drastically wrong with one, or with the hard drive itself,
    not everything is affected.'
  merge: -1
  pgno: 49
