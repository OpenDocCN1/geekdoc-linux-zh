- img_proc: true
  md: '# In Brief


    Each Internet service now must be configured to your specifications. Some of them
    are automatically installed by the Red Hat and Caldera installers, which saves
    you some work on the installation front.


    **NOTE:** Although this chapter''s title refers to Internet services, these same
    items may be necessary for your isolated LAN or your intranet, even without a
    permanent or dial-up Network connection.


    # Connectivity


    Connectivity issues come into play when you set up many Internet services. Each
    of these issues builds upon the other. These issues are:


    +   * How many users are on the machine? Just one or multiple?

    * Is the machine networked to other machines on a LAN?

    * Does the machine or LAN connect to the Internet?

    * Is the Internet connection permanent?

    * If the connection is not permanent, how often is the machine LAN connected?
    During specific hours? Only when Internet transactions must occur?

    * If the Internet connection is permanent, are people going to be accessing your
    services from the Internet?


    After you answer these questions, you have the information you need to choose
    how to set up each service.


    # Email Considerations


    There is more than one type of email server available, and you may find that you
    need one but not both to handle what needs to be done. The two servers of interest
    are installed by default, which makes your job much easier. These two servers
    are Post Office Protocol (POP) and sendmail.


    The POP server listens for connections from email clients. When a client connects,
    the POP server authenticates them and then allows them to download the mail they
    have waiting. This process prevents mail bouncing whenever a user is not immediately
    available to receive it.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# POP is not meant as an outgoing mail server, although some versions do handle
    this task.


    **TIP:** If you want to assign users accounts that are for mail only, you can
    do so easily with the user management tools. The key issue is that a mail-only
    account has a login shell of /bin/false. This prevents any abuse of the account
    because users (or people who crack their passwords) cannot log in to an actual
    shell. In Red Hat''s Linux X interface there is an option that automatically creates
    specialized accounts for you, with POP-only being one of them.


    Outgoing mail (and incoming mail for people who are continuously connected) is
    the domain of sendmail. While sendmail is notoriously difficult to configure,
    current versions are installed with a default configuration file you can alter
    to suit your needs. Even better, a set of macros is available to help you set
    up a custom configuration file without needing to edit the main file. The things
    you likely want to change or add:


    +   * Create email address aliases (see the section "Configuring Sendmail Aliases")

    * Set up your central mail server (see the section "Configuring Email On Your
    LAN")

    * Set up machines on your LAN to forward to the central mail server (see section
    "Configuring Email On Your LAN")

    * Set up mail delivery for virtual hosts (see "Configuring Email For Virtual Hosts")


    **TIP:** Email aliases allow your various administrators not to have to check
    multiple email accounts, which greatly decreases annoyance on their part and improves
    their response time. Aliases also help by eliminating the problem of mistyped
    email addresses, simplifying logic and complex addresses, and creating simple
    mailing lists that have only a few members by assigning multiple people to one
    alias.


    # Making Changes Cleanly


    One thing to keep in mind when configuring your various network services is that
    the changes will not take effect until you stop and start the service. Often these
    services can be found in the directory /etc/rc.d/init.d/. For example, to stop
    and restart inetd, you would first type "/etc/rc.d/init.d/inetd stop" to stop
    the service. If it stops cleanly, then start it again with:


    ```

    /etc/rc.d/init.d/inetd start

    ```'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'If it doesn''t stop and start cleanly, try stopping and starting it a few times
    more until it does.


    # Virtual Hosting


    It is common today to have one machine providing services for more than one named
    domain. This process is called “virtual hosting”. Whether you want to host two
    or two hundred different domains on the same machine or LAN, the process for setting
    them up is the same. See the section “Setting Up Virtual Hosting” to begin the
    general setup.'
  merge: -1
