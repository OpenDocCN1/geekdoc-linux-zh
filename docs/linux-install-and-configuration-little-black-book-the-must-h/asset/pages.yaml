  md: '# Configuring Printing Services


    **WARNING! It is highly recommended that you use the GUI tools for configuring
    printing services. Additional steps are included in this section to try to help
    avoid any major problems.


    To configure your printing services at the command line level, do the following:


    +   1. Log in as **root**.

    2. Choose the name you will call the printer within your LAN, for example, laser1.

    3. Create a spool directory for the printer in /var/spool/lpd, for example /var/spool/lpd/laser1.

    4. Make sure all three of the directories have their permissions set to 775.

    5. Make sure all three of the directories are owned by **root**, and are set to
    the group daemon.

    6. Change to the printer''s directory. for example,


    ```

    cd /var/spool/lpd/laser1

    ```


    +   7. Create the empty files .seq, errs, lock, and status. For example,

    8. Make sure all three files have their permissions set to 664.

    9. Make sure all three files are owned by **root**, and are set to the group daemon.

    10. Edit a new file called simple_filter.


    ```

    touch .seq errs lock status

    ```


    > **TIP:** This is a very simple filter. You can create more complex ones if you
    need to do so. This file is a shell script. You can learn more about shell scripting
    in Chapter 18.


    +   11. Add the following line to simple_filter so that a carriage return will
    be added before every newline code:

    12. Save and exit the file.


    ```

    while(<STDIN>)(chop $_); print "$\_\r\n";

    ```'
