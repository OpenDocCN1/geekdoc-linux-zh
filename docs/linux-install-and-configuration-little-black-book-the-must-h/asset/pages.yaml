  md: '# In Brief


    Now that you have made your preparations and understand some of the basics behind
    the install process, it is time to install the operating system. It is important
    not to skip the preparations in Chapters 1 and 2 before proceeding. If you do,
    you might have to go back later to learn how to partition your hard drive or how
    to clear space and repartition a drive that was originally designed as a Windows-only
    single partition.


    The Caldera install program, LIZARD, is heavily automated and graphical. However,
    this does not mean that it is completely intuitive. The solutions in this chapter
    offer assistance with the decisions you need to make as you proceed through the
    installation process.


    # The Install Process


    As you go through the Caldera install process, it is important to carefully read
    the screen at each stage. Be sure you understand what the installer is asking
    about or, if not, make the best guess you can and be prepared to have fine-tune
    or reinstall later. Remember that you can correct many mistakes later once you
    understand Linux more, by doing one of the following:


    +   - Reinstalling Linux itself

    - Adding or removing software packages

    - Re-configuring software that is already installed

    - Adding or removing modules from the kernel

    - Recompiling the kernel


    > TIP: Many people reinstall Linux at least once, if not multiple times, to fix
    strange problems that crop up after the initial install or to take advantage of
    understanding the installer questions more thoroughly after the initial installation.
    You might want to consider the first install as a practice run.


    LIZARD is kind enough to provide you with a Tetris-like game to play while it
    installs all of the packages you selected. However, this is also a good time to
    have other things to do because this transfer of data to the hard drive can take
    quite a while. The progress bar will keep you up to date on how much longer you
    have to wait.'
