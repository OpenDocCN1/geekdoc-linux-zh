  md: '# Editing LILO


    To edit LILO''s configuration file, log on as root and edit the file /etc/

    lilo.conf, with your preferred text editor. Make the changes you want

    to make, save and close the file, rerun LILO (see the section

    “Running LILO”) to activate the changes.


    For example, if using the vi text editor (see Chapter 5 for more on

    using vi) the steps would be:


    +   1. Log in as root.

    2. Type "vi /etc/lilo.conf" to edit the file.

    3. Use the error keys to move the cursor to where you want to

    add text.

    4. Press "i" to enter vi Insert mode.

    5. Make the desired changes.

    6. Press the ESC key to exit Insert mode.

    7. Press the colon (:) key to enter Colon mode.

    8. Type "wq" and press Enter to save and exit the file.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_102_0.png)


    # Configuring LILO To Boot Multiple

    Operating Systems


    To add operating systems aside from LILO to your boot options, do

    the following:


    +   1. Open the file /etc/lilo.conf.

    2. Locate the section similar to


    ```

    image=/boot/vmlinuz

    label=linux

    root=/dev/hda2

    ```


    > TIP: You can customize the labels that show when LILO offers a choice of operating

    systems by changing the label for the section to what you want to use. For example,
    instead of

    "label=linux" above, you could change it to "label=Red Hat Linux".


    +   3. Move to the line beneath the image section to add your new

    material.'
