  md: '# Immediate Solutions


    # Adjusting Partitions Nondestructively With FIPS


    If there are existing Windows partitions on the hard drive, you should also want
    to add Linux. You can use the First NonDestructive Interactive Partition Splitting
    (FIPS) utility to resize the current partitions without losing data. Do do the
    following to accomplish this task:


    +   1. Back up important data and programs from the Windows partitions. Although
    FIPS is a nondestructive tool, there is no guarantee that everything will run
    smoothly. Even if the re-partitioning goes well, something could go wrong later
    during the install process and you could lose access to your Windows data. It
    is best to err on the side of caution.


    +   2. Locate the FIPS program and its documentation:

    * On the Red Hat CD-ROM, the program can be found in \dois\. Also inside this
    directory is \fipsdocs, which contains all of the documentation for the program.

    * On the Calder CD-ROM, the package can be found in \coltools\fips.

    * On the Internet, the latest version of FIPS and its documentation are available
    from the creator at http://bmrc.berkeley.edu/people/chaffee/fips/fips.html. A
    FAQ is also included at this address.


    +   3. Read the included documentation. Because the goal is to adjust existing
    partitions with data you would likely rather having to reinstall from backups,
    it is important to read the documentation and be sure you understand what each
    option presented will do.


    +   4. Follow the process outlined in the Fei documentation. Be sure to include
    every step, such as defragmenting the hard drive and backing up the boot sector.
    These items are included for your data''s protection.'
