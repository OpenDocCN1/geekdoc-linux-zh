  md: '# Chapter 9 The Linux File System


    # In Brief


    In Linux there is a lot of talk about the file system. A file system is the collection
    of all partitions, directories, storage devices, and files that make up Linux
    and all its components. Rather than seeing floppy disks, CD-ROMs, tapes, and other
    storage media as outside components, these devices have to be added to the file
    system itself and then released from it when you are finished working with them.
    Even devices, such as monitors and printers, are seen to some extent as part of
    the file system. The device drivers themselves determine how the operating system
    talks to each item.


    # File System Basics


    The main file system is that which is permanently a part of the file and directory
    structure on your machine. It is the structure in which you can change directories
    (cd) without needing to add anything new. The items in the primary file system
    are automatically mounted at boot time through the file /etc/fstab.


    When you want to access something on a removable media, such as a floppy disk
    or CD-ROM, you have to add that item temporarily to the file system. Doing this
    requires that you create a spot called mount point for the disk to exist within
    the file system. Think of the mount point as a kind of docking station, a place
    where the file system docks and makes its files accessible to the rest of the
    file system. Once you create this mount point, you can mount (dock) the disk''s
    contents onto this point and browse the files, copy, delete, or whatever is necessary.
    When you are finished, you then have to unmount the disk before removing it from
    the system, so that no data is lost.


    The specifics of mounting and unmounting disks are covered in the “Immediate Solutions”
    section of this chapter.


    # Linux File System Format


    As you are likely already aware, each operating system uses its own file system
    format. You can''t use an MS-DOS floatted floppy in a Macintosh, or vice versa,
    without special conversion software. Linux also has its own file system, called
    ext2, the Linux Second Extended File System.


    9. The Linux File System


