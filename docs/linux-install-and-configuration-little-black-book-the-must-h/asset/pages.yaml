    # Determining If The Samba Daemons Are Running


    To determine if the two daemons Samba needs are running, log in as root and type
    the command combination "ps -aux | grep *bd*\ If you see smbd and nmbd in the
    process list, both of the daemons are properly running.


    # Configuring The Samba Daemons To Run From Inetd


    To configure the daemons smbd and nmbd to run from within inetd, do the following:


    +   1. Log in as **root**.

    2. Make a backup copy of inetd.conf.

    3. Edit the file /etc/inetd.conf.

    4. Move to where you want to place the code in the file; at the end is fine.

    5. Build the smbd statement. The ordering for what appears in the inetd.conf code
    is:


    ```

    [Service] [Socket] [Protocol] [Flags] [User] [Server Path]

    [Arguments]

    ```


    To build the statement for smbd:


    +   * The service smbd provides netbios-ssn.

    * The type of socket used by smbd is stream.

    * The protocol used by smbd is tcp.

    * The flag you need for this service is **nowait**.


    238'
