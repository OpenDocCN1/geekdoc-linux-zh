  md: '# Immediate Solutions


    # Closing Simple Weak Spots


    Whether you installed Red Hat or Caldera, there are some weak spots you can close
    to help make your system more secure:


    +   1. Deactivate any services you don''t intend to use in /etc/inetd.conf by
    commenting them out (adding a # at the beginning of the line). Each service offered
    opens one more way for someone to attempt to enter your system, so use only the
    services you need.


    +   2. Edit the file /etc/issue.net and remove references to the specific hardware
    and Linux distribution running on the machine. This is the banner that is displayed
    on login screens during remote login sessions, such as Telnet. Anything that gives
    specific information about the machine makes it easy for someone trying to break
    in to know what weaknesses to look for if they are familiar with the type of setup
    shown.


    +   3. Assign specific users to the group console to give them access to commands
    to run while physically at the server machine, and disallow anyone you want access
    to those commands. For example, only members of the group console should be able
    to mount disks if there is a high concern for security.


    +   4. View the contents of the file /etc/security and be sure that the only devices
    listed are physical tys (for example, tty1 through tty8). This limits where people
    can log in from root. Allowing remote users to log in as root is highly dangerous,
    because it reduces any potential intruder''s steps to break into the superuser
    account.


    +   5. Be sure that the only writable part of your FTP server for anonymous users
    is /incoming.


    # Listing Logins


    To see a list of who last logged in to the system, use the last command. If you
    want the default number listed, use the format "last -n number" to tell last how
    many logins to display.'
  merge: -1
