    was related or not. You could use purple.edu for fictitiousdomain, or glass.org
    or anything else that feels appropriate. This tactic is multipurpose, but in general
    it is used either for internal networking reasons, or to gain the slight benefit
    in security because intruders listening on the network will not be able to easily
    find the NIS server to try to gain access to your password files.


    +   8. Save and exit the file.


