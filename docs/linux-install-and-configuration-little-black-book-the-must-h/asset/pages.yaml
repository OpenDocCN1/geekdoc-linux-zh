  md: '# In Brief


    Those who prefer a colorful, point-and-click environment will like this chapter.
    While the X server provides the engine, so to speak, for graphical utilities to
    run on top of, the window managers provide the environment''s look, feel, and
    functionality. This chapter takes you on a tour through which window managers
    are available and covers some basics on how to use them.


    # The Window Managers


    Window managers provide you with interfaces in navigating the X environment. These
    window managers have their own tool boxes, their own way of handling the mouse
    to execute and access commands, their own program menus, and their own unique
    layouts and flavors.


    You can run GUI- and non-GUI-based programs within a window manager, so there
    is no right or wrong choice. Choosing a manager is mostly an issue of what style
    you prefer and how much stability you require, because some of them are more robust
    than others.


    Here is a partial list of the many window managers out there:


    +   * fwm

    * fwm2

    * fwm95

    * mwm

    * twm

    * ctwm

    * qvm

    * afterglow

    * enlightenment

    * blackbox


    The list continues to grow; see the section “Finding Window Managers” for where
    to find those listed and, also, some desktop themes.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Desktop Environments


    Desktop environments complete the full Linux GUI picture. While the X server provides
    the background environment for building and running the GUI and the window managers
    provide the environment for handling the windows themselves (such as title and
    scroll bars), the desktop environment has a set of tools and applications. Many
    of these tools enable you to control the settings of your environment (screensavers,
    fonts, icons, window sizes, and so on) as well as manage your machine (e.g., GUI-based
    mount, Zip, archive, and network management tools). The larger this set of tools
    and the more complex the desktop environment, the more RAM is needed, so keep
    this in mind when you choose between them. The two most talked-about desktop environments
    for X are KDE and Gnome.


    # The KDE Environment


    KDE is the default desktop environment in Caldera and is included with Red Hat
    as well. This is a commercial environment that has been around for some time,
    long enough to reach a point of stability and maturity that attracts a lot of
    fans. However, those who want to develop software for this environment have to
    purchase the professional version of the libraries. Once you are in the GUI in
    Caldera, the desktop environment looks like what is shown in Figure 7.1.


    The reason KDE has now been included on the Red Hat CD-ROMs is that KDE has made
    the free libraries—those that are available to the public—open source. For more
    on this environment, the KDE home page at www.kde.org.


    # The Gnome Environment


    Gnome is the default desktop environment in Red Hat. It is a free environment
    in that it is covered by the GNU Public License (GPL) and is open source. The
    libraries are freely available for developers. However, this environment is slightly
    less mature than KDE, so it is not yet as stable. Once you are in Gnome''s desktop
    environment in Red Hat Linux, the default screen looks like what is displayed
    in Figure 7.2.


    For more on this environment, visit the Gnome home page at www.gnome.org.'
