  md: '# In Brief


    end tape drives can store a number of individual tapes and auto-load

    them when necessary.


    NOTE: To use a tape drive you must install the ftape driver.


    Advantages of using tapes are:


    +   - There is no mistaking backup tapes for available media and

    accidentally overwriting them.


    +   - They are reusable.


    +   - Tapes can be stored separately in a safe or other secured

    location.


    +   - With autoloader tape drives, backups can be automated and run

    unattended.


    Disadvantages of using tapes are:


    +   - If some reason the tape drive does not see the End Of Tape

    (EOT) properly, the tape can be disconnected from the

    spool as it continues to turn. However, instructions are often

    available in the manual that comes with the drive for fixing this

    problem if it occurs.


    +   - Tapes can stretch over time. It is important to remember to re-

    tension them before first using, and before backups. This

    process needs to be done on a regular basis, even if it is not done

    every time the tape is used. Otherwise the stretching can distort

    the data on the tapes and make it difficult to retrieve.


    +   - Only the most expensive tape drives operate quickly.


    # Hard Drives


    Spare hard drives also moonlight as system backup devices. If

    you have nothing else at hand and don''t want to use floppies, con-

    sider putting an old smaller hard drive to work storing important data.


    Advantages of using hard drives for backing are:


    +   - If a partition fails and there is an exact duplicate of it as of

    certain backup time, you can mount the backed-up version

    directly to take the place of the damaged one.


    +   - They are reusable as a backup device.


    +   - They can be used as part of the file system if there is need to

    replace it with a different backup device.


    +   - If you use removable-rack hard drives, they are changeable.


