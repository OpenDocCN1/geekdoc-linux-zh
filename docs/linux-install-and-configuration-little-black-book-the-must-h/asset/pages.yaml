    # Updating A Kernel Through Red Hat


    Once you have the kernel update package—and potentially other packages recommended
    to go along with it—from Red Hat (see the section "Preparing To Update A Kernel
    Through The Distributor" for how to do this), do the following:


    +   1. Log in as **root**.


    +   2. Upgrade the non-kernel files you downloaded with the **rpm** command by
    typing "`rpm -Uvh packagename`".


    **WARNING!** Be sure you have a boot disk on hand in case something goes wrong.


    +   3. It is important not to erase the old version of a kernel before you test
    the new one. Install the kernel files themselves by typing "`rpm -ivh packagename`",
    because upgrading will erase the old kernel.


    +   4. Look in the `/boot` directory to see what the current kernel is called.
    It is likely `/boot/vmlinuz-version-ext`, where `version-ext` is the version of
    the current kernel you''re using (see the section "Determine Which Kernel You
    Are Running") with the final part on the end (for example, `version` is 2.2.5
    and `version-ext` is 2.2.5-15).


    +   5. To build the RAM disk that''s loaded during the boot process and then removed
    from your machine''s memory, type "`mkinitrd /boot/initrd.img version-ext`".


    +   6. See the section "Adding A LILO Option For The New Kernel" for instructions
    on how to add a boot option that calls on the kernel you just installed.


    +   7. See the section "Testing A Kernel Install" for instructions on how to make
    sure things are working properly.


