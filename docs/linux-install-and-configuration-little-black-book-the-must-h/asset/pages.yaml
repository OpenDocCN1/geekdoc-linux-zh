    # Adding A Boot Delay To Allow Time To Select An OS


    Add a new line beneath the boot line at the beginning of the /etc/lilo.conf file.
    The time frame listed is in tenths of a second, to have a delay of five seconds,
    you would add the line “delay=50” and then re-run LILO (as discussed in the section
    “Running LILO”).


    # Setting A Default OS In LILO


    Move the image or other section for the OS to be the first among all the image
    and other settings. If nothing is chosen by the end of the boot delay, LILO boots
    your computer into whatever OS is listed first. Remember to rerun LILO after making
    this change or it will not go into effect.'
