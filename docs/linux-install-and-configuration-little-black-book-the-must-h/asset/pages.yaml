- img_proc: true
  md: '# Immediate Solutions


    # Setting Up Virtual Hosting


    In order to have a machine host services for more than one domain name, you need
    to configure it properly. To set up virtual hosting, de to the following:


    +   1. Log in as root

    2. Your kernel must be configured to support IP aliasing. Most 2.2.x kernels are
    already set up to do so. If it turns out yours is not, then see Chapter 10 for
    instructions on how to compile a new kernel with this option activated.


    > TIP: In the xconfig tool, IP aliasing is toward the bottom of the Networking
    options dialog box.


    +   3. Get the MAC (Media Access Control) address for the Ethernet card in the
    machine by typing "ifconfig" and for the line containing the term "HWaddr". The
    MAC address is a six part group of two units each, which looks like "00-06-97-7F-33-46".
    Every Ethernet card has a unique MAC address.

    4. Make a backup copy of the file you are about to edit, using the `cp` command
    such as `cp /etc/rc.d/rc.sysinit /etc/rc.d/rc.sysinit-original`.

    5. Use the vi command to open the file by typing `vi /etc/rc.d/rc.sysinit`.

    6. Go to the end of the file by typing "G"

    7. Type "O" to start a new line after the cursor position and enter insert mode.

    8. For each virtual host you want to add, add a line in the format `arp -s virtualhost
    MAC`—where:

    * The virtualhost is either the full domain name plus machine name, or an IP address.
    Using an IP address is cleaner, because if you change IP and domain assignments
    later you will not have to come back and change them as well.

    * The MAC address is separated with colons (:) and not dashes (-). For example,
    `arp -s 192.168.60.9 00:06:97:7F:33:46`.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_308_0.png)'
  merge: -1
