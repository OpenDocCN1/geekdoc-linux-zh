  md: '# Immediate Solutions


    # Setting The Date


    To set the date, use the date command with the format date -d mm/dd/yyyy. For
    example, type "date -d 01/19/2010".


    > TIP There is far more to the date command insofar as formatting options go.
    Type "man date" for more information.


    # Setting The Time


    To set the time, use the date command with the format date -s hh:mm:ss. For example,
    type "date -s 14:02:00".


    > TIP There is far more to the time command insofar as formatting options go.
    Type "man date" for more information.


    # Listing The Contents of Directories


    The ls command lists the contents of a directory. It is similar in function to
    the dir command in DOS. Figure 5.3 displays the contents of the /root directory
    obtained with the ls command.


    ```

    [root@samurai ~root]$ ls -s

    total 18

    2 figure-5.1,gif 2 results 1 gmail

    10 figure-5.2,gif 1 mail

    [root@samurai ~root]$

    ```


    Figure 5.3 Files in root directory as listed with the ls command.


    A number of flags can used with this command. The most common are shown in Table
    5.1. One of the most frequently flag combinations is ls -la, which lists all items
    within the directory including hidden files. Hidden files are files that begin
    with a period (.) for their long-format data.'
