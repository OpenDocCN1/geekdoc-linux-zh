  md: '# Accepting Command Line Input


    If you want to accept arguments for a script, you pass them as you invoke the
    script at the command line. These arguments are assigned a value from $1 to $9
    in most shell scripting languages, with the script name itself $0. A space between
    the arguments signifies that you''re moving to the next one, unless you use double
    quotes ("") to mark it off. Here are two examples to clarify the point:


    +   - The first example is:


    myscript a b cdef g


    In this example, the script name and the value of $0 is myscript. The value of
    $1 is a, $2 is b, $3 is cdef, and $4 is g.


    +   - The second example is:


    myscript "a b" cdef g


    In this example, the script name and value of $0 is still myscript. The value
    of $1 is a b. The value of $2 is cdef, and $3 is g.


    # Adding Comments


    A comment is signified in a shell script by the hash mark (#). The comment begins
    directly after this symbol and ends at the end of the line when you press Enter.
    See the two examples below for an idea of what options you have:


    +   1. A comment can begin at the beginning of a line and span several lines.


    > # Comments are very useful in scripts, since you might learn

    # a lot while writing them but forget it by the next time

    # you look at the code.


    +   2. A comment can exist only at the end of the line, after existing code.


    ```

    echo "Hello world." # Prints Hello world.

    ```'
