- img_proc: true
  md: '> >Chain input (policy ACCEPT):

    >Chain forward (policy ACCEPT):

    >Chain output (policy ACCEPT):

    >


    +   4. Choose which chain you want to configure. A chain is a set of rules that
    pertain to a group of packet types:


    +   * The forward chain refers to packets that came into the firewall and now
    need to be sent to another machine in the network.


    +   * The output chain refers to packets being sent out.

    Additional specialized chains can be created.


    +   5. Type "ipchains -chain" to list the rules that currently exist within the
    chain you want to edit. By default, all the chains are empty of rules.


    +   6. Begin a statement to add a new rule by typing "ipchains -A chain" to tell
    ipchains that you want to create a new packet-filtering rule for that chain. For
    example, you will probably want to create rules for the input chain, so type "ipchains
    -A input". Don''t press Enter yet; you''re not done.


    +   7. Now you have to build the statement itself you don''t want to be able to
    Telnet to any machines behind the firewall except from a specific remote work
    site. Set the address(es) for the specific rule you are creating with the -s (source)
    flag in the format:


    +   * A single full IP address, such as 192.168.152.24.


    +   * An entire class of IP addresses, such as 192.168.152.0/255.255.255.0, which
    stands for 192.168.152.0 through 192.168.152.255.


    +   * Hostname, such as blue.


    +   * Full domain name, such as blue.colors.org.


    +   * A range of IP addresses, carefully constructed with a combination of IP
    address and netmask.


    For the example, the goal is to only allow Telnet traffic from three specific
    machines that have the IP addresses 192.156.12.1 through 192.156.12.3. The address
    and netmask combination to


