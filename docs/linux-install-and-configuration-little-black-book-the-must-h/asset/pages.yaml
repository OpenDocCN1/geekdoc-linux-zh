  md: '# Chapter 8 Creating User Accounts


    # In Brief


    Regardless of whether your Linux box is meant to service many users over a network
    or to be a personal desktop machine, it is wise to create user accounts. The primary
    reason for this is that the root account is a very powerful tool, but it''s just
    that, a tool. Everyone makes occasional mistake. Making a mistake as a user can
    be a minor hassle. Making a big mistake as root can bring you to wish you had
    kept backups up.


    **TIP:** Here are some things you should know about root and the Internet: A number
    of Internet services also have special considerations for handling root. For example,
    by default you cannot Telnet to a Linux box as root. It is considered a significant
    security hole to make that available, because a person need only figure out your
    root password to gain access to your entire system. It is much better to require
    least into a user account first, which makes the process longer and more involved,
    and gives you a better chance of detecting it.


    Going out IRC root will get you kicked or banned from many channels. Root access
    allows you to run a number of attack features on a Unix machine, and many IRC
    channels are not willing to find out the hard whether that is your intent or not.


    Sending email or posting to newsgroups as root tends to be frowned upon all, unless
    you are speaking as an administrative function. In this case, it is considered
    more a matter of unnecessarily showing off, and not understanding your system
    well enough to realize you are using root needlessly.


    System security is covered in more detail in Chapter 21, but by a brief discussion
    of passwords follows here.


    # Passwords


    The account password is an important barrier between your system and those who
    might like to steal information and resources from it, or just wreak havoc. If
    your Linux box is on the Internet or by modem, you must choose your passwords
    carefully. This is especially true for administrative passwords, such as the one
    for root, and for your Internet services.


    **TIP:** A good password is not made up of a dictionary word. It includes mixed-case
    letters, numbers, and allowable symbols. A secure password is also longer than
    eight characters.


    150'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# In Brief


    Although you cannot entirely control what users choose, you can do your best to
    educate them. You also can occasionally use tools to keep poorly chosen passwords
    (see the following Tip). Then, you can notify individual users that they need
    to change their passwords, sending them instructions on how to choose better ones.


    **TIP:** A bad password is made up of dictionary words, all lowercase letters,
    or shorter than eight characters. Another type of bad password is something that
    is easily identifiable by anyone who knows the person, such as birthdays, pets''
    names, or names of significant others.


    Whether you run password checks or not depends on your system (see the section
    “Determining System Vulnerability,” later in this chapter), how well it is known,
    and how security conscious you feel the need to be. Whenever you assign a new
    password (temporary or otherwise) or a user changes his or her password, the passwd
    program points out if the user is persistent or she can ignore the warnings and
    use the bad password anyway. Remember, though, that using bad passwords easily
    caught by the passwd program compromises security.


    **TIP:** There are management tools available both at the command-line level and
    the GUI. Which tools you use is mostly a matter of preference. Linuxconf is often
    the tool of choice. Although this chapter focuses on command-line tools, instructions
    for how to do tasks within Linuxconf are also sprinkled throughout.


    # Shadow Passwords


    The passwords stored in the /etc/passwd file are encrypted, so not as vulnerable
    as raw text. This means that you can''t just see someone''s password by looking
    in the file, which is a good first step in security. However, the encryption is
    not strong. It is not difficult to decode the passwords once they are taken from
    the file.


    The reason to worry is that your /etc/passwd file is readable by everyone. An
    intruder needs to break into any user account—by running a password cracker that
    runs through a set of dictionary words, or knowing what kinds of passwords that
    user tends to choose, or a number of other methods discussed in Chapter 21—and
    then he can easily make a copy of your /etc/passwd file and then decrypt the data.
    It might seem a simple thing to fix by changing the permissions on the file, but
    this does not work. Your /etc/passwd file contains vital


    8 Creating User


    151'
