    # Alternatives To Using LILO On Your MBR


    There are a number of other methods of booting a Linux machine that do not require
    LILO to be in your MBR, or even to be-installed at all. Two of them are covered
    here. If you choose to use either of these or any of the others available, when
    asked where to install LILO at the end of the installation process, choose the
    Skip option.


    # Loadlin


    A favorite method some people use to avoid the issue of changing the MBR is installing
    Loadlin. Using this option requires a DOS partition


