  md: '# In Brief


    Partitioning hard drives is one of the most nerve-wracking processes many new
    people to Linux encounter. Fortunately, both distributions discussed in this book
    come with tools to accomplish this task without needing to resort to the cryptic
    fdisk, unless you choose to do so. This chapter covers many of the issues you
    will encounter while pre-pairing partitions, and then creating them.


    # Before You Partition


    As any operating system, Linux needs space to inhabit that is formatted with its
    own file system type. In order to give Linux a home, you need to create two or
    more partitions for it. Imagine a hard drive as a piece of pie, and each partition
    as a slice of pie. Before you partition your hard drive, you need to understand
    the limitations inherent in creating partitions, and have a sense of how much
    space you want for Linux.


    > NOTE: In fact, there is a method of installing Linux inside a Windows partition,
    but not only is it incredibly awkward to set up, it also runs slowly.


    # Partition Limitations


    There are certain limitations on a PC for how many partitions you can create.
    Some of these limitations depend on the type of partition in question. There are
    three types of partitions possible: primary, extended, and logical. A primary
    partition is the most straightforward form, and there can be four of them on a
    drive regardless of how large it is. So, continuing with the pie reference, see
    Figure 2.1.


    An extended partition is not actually used by itself. Instead, you convert one
    of the logical partitions to an extended partition. The reason for this is that
    a logical partition contains data, whereas an extended partition contains other
    partitions. Using these combinations allows you to have more than four partitions
    on a single drive. Figure 2.2 shows one way of dividing the pie so you can have
    two different extended partitions.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '![](img/2b916f28ab4fa126e516b3f9293c726b_48_0.png)


    Figure 2.1 You can create up to four primary partitions on a drive.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_48_1.png)


    Figure 2.2 You can create up to four primary and extended partitions, total, on
    a drive.


    Once you''ve created an extended partition, you can then place up to 12 logical
    partitions inside it. Sometimes people use these because they run into a situation
    where they need more partitions. At other times more planning is involved when
    setting up a new computer, and extended partitions are created for each operating
    system to help locate groups of logical partitions later. This factor is especially
    true for the larger drives that have enough room to support numerous operating
    systems and partitions that are available today. Figure 2.3 shows one method in
    which the drive could be divided using a combination of the three partition types.'
  merge: -1
