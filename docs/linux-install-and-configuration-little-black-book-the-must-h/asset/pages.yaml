  md: '# Chapter 1 Getting Started With Linux


    # # In Brief


    Wherever you look at computer news today, you see Linux mentioned. It''s hard
    enough to follow discussions about a new operating system, and worse when you
    have to try to separate hype from fact. Even worse, you can''t just walk into
    a store and buy a "Linux". More than one distributor offers specially packaged
    versions with individual focuses and features. In this chapter you''ll find the
    information you need to decide whether Linux is right for you, and to help you
    choose the distribution—between Red Hat and Caldera—and hardware that are appropriate
    for your purposes.


    # # What Is Linux?


    Linux is a version of the Unix operating system inspired by the two long-standing
    Unix variants, BSD and System V. At its heart it is a command-line-oriented operating
    system because Unix, its predecessor, was designed to be a tool used by programmers
    to build tools. Even if you aren''t a programmer and don''t intend to use the
    operating system for this purpose, it is important to know how to deal with Linux
    at the command-line level. On a machine that provides intensive server functions,
    it is a waste of RAM and processor time to use a graphical user interface (GUI).
    Although Linux has had a GUI for some time, both Red Hat and Caldera have included
    more and more useful graphical tools for working with the system. Learn to use
    both the command line and the GUI, and you have access to Linux''s full range
    of capabilities.


    # # Why Is Linux Special?


    Linux is in the news so much popularly because of the approach embraced by those
    who develop the operating system. Certainly the idea of peer review is nothing
    new in the scientific community, but in today''s software development world, which
    is rife with buzzwords "proprietary code," it is somewhat of a retroactive revolution.
    It is retroactive because the open source movement takes programming back to the
    computer science part of programming via the scientific method.


    The development of the operating system and the tools available for it is an international
    effort, by its community of users along with Linux Torvalds, the initial author
    of the Linux kernel. On the tool front,'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'is currently gaining support from major developers. IBM and Corel, for example,
    are in the process of porting their commercial products to Linux, and even without
    these items there are thousands of programs and tools available for use under
    Linux. Many of these tools were ported, or translated, by Linux users from other
    Unix flavors.


    For its community, one of the most exciting facets of Linux is that the operating
    system is open source, meaning that all of the source code for it is available.
    Not only is this a boon for those who are developing software for the operating
    system, it means means users have the ability to configure their system to as
    deep a level as they need to, limited only by the talents and the abilities of
    the software and the operating system itself.


    **NOTE:** Many industry pundits are predicting that other operating systems may
    follow suit and go source eventually, offering their code for peer review and
    enhancement. Whether this will happen in practice, only time will tell.


    # # Linux Distributions


    One of the biggest issues raved about during media coverage of Linux is that it
    is “free”. And yet, a number of commercial distributions are available. So how
    can it be?


    Linux is covered under the GNU Public License (GPL). A number of Linux distributions—all
    sharing the standard Linux kernel, though sometimes it is slightly modified—are
    available for download on sites on the Internet, though the operating system is
    so large today that most people would rather buy it on CD-ROM (see the section
    “Finding Inexpensive CD-ROMs For Linux” for more information). Each distribution
    is slightly different, with the differences usually being in the installation-routine
    packages included, or a specific focus on security or usability. Packaged Linux,
    meaning the kernel and accompanying tools and packages, is called a distribution.
    The Linux distributions discussed in this chapter are Caldera and Red Hat.


    Linux is free if you download it from the Internet, or borrow a CD-ROM from someone.
    A typical download this download can take up to twenty-four hours. As the 33.6
    kbps mode demaned the OS got larger and more tedious to download, the Linux distributions
    became more prominent. At first, they were primarily companies that packaged the
    OS on CD-ROMs with value-added features'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Chapter 1 Getting Started With Linux


    such as programs to help with installation and preconfigured services. Today,
    companies like Red Hat and Caldera package large distributions with complex installation
    programs; extra software, such as commercial demos; printed manuals; and technical
    support. Their distributions are still freely available for download—though Caldera''s
    does not come with the full installation program for the download—and users with
    speed connections and CD-ROM burners are happy to use this, but even people with
    such equipment may not want to go to the trouble.


    # Who Uses Linux?


    Linux has finally begun to make strides toward general acceptance. However, it
    is not yet quite the operating system for the masses that the media would have
    everyone believe. The learning curve with Linux is steep for those who are used
    to today''s point and click operating systems. It is like learning a new language.
    There are a whole set of commands to learn, and new many ways of doing and approaching
    things that have long been taken for granted. Having control over the environment
    you work in requires a greater understanding of it, and how to manipulate it without
    causing problems. However, this level of control is exactly what makes the operating
    system perfect for system administrators and people who work with servers and
    LANs. For those who have Unix experience, Linux is much simpler to learn.


    Linux also requires you to be familiar with your system hardware. Power users,
    system administrators, and developers often have an easier time learning Linux
    than general users. However, even for these groups a large dose of patience and
    dedication toward learning and experimenting with the subject is required.


    # Choosing Between Red Hat And Caldera


    Both Caldera and Red Hat offer complete Linux solutions with technical support.
    The specific needs of your setup will eventually decide which distribution to
    choose, or make it apparent that neither is significantly better or worse than
    the other in your case, at which point other factors such as price come into play.
    What follows the information necessary to make the decision: Red Hat or Caldera?


    When comparing the two Linux distributions, the first thing one notices is that
    they share the same advantages, although happens in different forms. Both of the
    distributions have configurable GUIs with tools to simplify many common tasks,
    a certain amount of hardware detection to make the installation process faster
    and less'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# In Brief


    tedious, long lists of video cards and monitors users prevent most from having
    to look up hardware statistics, testing of the GUI settings before completing
    installation, and more. In fact, in many cases programs can be easily used on
    either distribution, with minor tweaking the necessary files are kept somewhere
    else. Also allow you to partition the distribution during the installation process,
    rather than having to have anticipated this issue.


    # 1. Getting Started With Linux


    Red Hat provides a wide variety of installation methods. It is possible to install
    the operating system from the CD-ROM from your local machine, or over a LAN or
    even an Internet connection from an FTP or Web server. Many product comparisons
    choose this Linux distribution for operating servers. Every part of the Red Hat
    distribution is open source as well, meaning that from the GUI to the installation
    program, you can edit the source code and make adjustments if you choose. Finally,
    Red Hat gives you more control over what packages to install, although both distributions
    make it fairly simple to add and remove packages after installation.


    Caldera''s installation program is more polished, allowing testing of keyboard
    and mouse options, addition of user accounts while packages are installed, and
    even a game to play while waiting for the installation to complete. Many product
    comparisons choose this Linux distribution for desktop use and for those who need
    to dual boot, and those who are uncomfortable with disk partitioning are are delighted
    to have Partition Magic included in the bundle.


    In the end, however, the choice between the two operating systems comes down to
    personal preference. They both have a slightly different look and feel, especially
    if you choose their default GUIs, which are not the same. Installing either of
    them can be simple or a mess, depending on the combination of hardware in the
    machine and what settings you choose. For many people, the answer comes down to
    how many others they know are using a specific distribution and could offer them
    assistance at a later date, or by trying both and seeing which works best with
    their hardware setup.


