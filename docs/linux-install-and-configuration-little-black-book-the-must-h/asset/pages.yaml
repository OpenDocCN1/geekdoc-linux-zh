  md: '# Plan The Program


    Before you write the program, it''s important to consider how you want to put
    it together. Doing this can save you time rewriting large segments when you realize
    they cannot handle the functionality needs. Some of the planning issues considered
    for your program are:


    +   - What data does the program need to accept? At the very least, this is a
    name and phone number.


    +   - What format should the name be in? For the sake of future flexibility, break
    it into first and last.


    +   - What format should the phone number be in? Include area code plus seven
    digits. Display a sample format so the user knows how to type it in.


    +   - How will the program know when to ask for more data? The user will not likely
    know ahead of how many entries he or wants to include. Include an iterative loop
    that stops when the assigned exit condition is reached.


    +   - What kind of exit condition should be used? Rather than forcing the user
    to remember a specific word to type in the end, include a question that asks to
    enter $y$ if they want to add another entry, or $n$ if not.


    +   - Include error checking to ensure that the query is answered.


    +   - When doing the file handling, because this program is meant to build a database
    of records, you will likely want to allow people to keep growing this database
    over time. Therefore, opening the file for write access will be done in the format
    of “Create if it does not exist, or append it if it does.


    # Create The Program File


