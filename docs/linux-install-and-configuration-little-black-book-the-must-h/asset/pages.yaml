  md: '# In Brief


    Any Internet-connected computer or LAN needs to have at least some security precautions
    taken against invaders. Some of these precautions are simple to add. They involve
    knowing the system you are working with and where its initial weak points are;
    once you find them, you can plug them. Others are subtler, requiring additional
    software or hardware. The important thing is to know what they are, assess your
    setup''s needs, and implement them correctly.


    # Firewall Options


    Firewalls get a lot of press in discussions about network security, but are by
    no means a fix-all. Their basic function is to filter and block traffic between
    the network or part of the network and the outside world—namely, the Internet.
    In the process of doing their job, they interfere with what would have been routine
    Internet accesses from inside the network, and from the Internet to the network.
    See the section “Determining If A Firewall Is For You” for a list of items to
    help decide whether adding a firewall is the proper solution for your security
    needs.


    # IP Filtering Firewalls


    Implementing an IP filter firewall involves the ipchains package—support for which
    is available in kernel 2.1 and up. This package manages the IP accounting and
    firewalling potential of the Linux kernel itself. Your kernel must be compiled
    with ipchains; if you want to use this function and do not have kernel-level ipchains
    support, see Chapter 10, which covers compiling the kernel.


    To understand the level at which ipchains operates, you need to understand TCP/IP
    network traffic at the packet level. Packets are chunks of data that include the
    information necessary to deliver them to their destination point. Think of a packet
    as a courier package. The packet itself is the data being couried, and the envelope
    has all of the headers necessary to deliver the information not only to the right
    machine, but to the right program. It also contains return address information.


    Ipchains is a packet filter. A packet filter is a program that examines the contents
    of a packet header and, according to a set of rules you'
  merge: -1
  pgno: 405
- img_proc: true
  md: 'created (see the section “Filtering Packets Out” for instructions on how to
    do this), determines whether to let the packets through and where to send them.


    # Proxying Firewalls


    Implementing a proxying firewall involves downloading and installing the software
    that controls what services users can reach outside the network and what they
    cannot. A proxy firewall allows no incoming connections to the machines behind
    it; there is no packet filtering, it is just a brick wall so far as incoming connections
    are concerned.


    The package commonly used to put a proxying firewall in place is called SOCKS
    (see the section “Installing SOCKS” to obtain and install this program; it does
    not come with the distributions).'
  merge: -1
  pgno: 406
