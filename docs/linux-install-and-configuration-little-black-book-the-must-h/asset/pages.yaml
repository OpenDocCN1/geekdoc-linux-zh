    prompt appears as


    LILO boot:


    Press the Tab key to see what operating system labels are available. If you do
    nothing, then LILO will boot you into Linux after several seconds, automatically.


    # Diagnosing Boot Hang During LILO


    When LILO displays on your screen, each letter stands for a part of the boot process.
    Table 3.2 lists the meaning of each error that can occur during this process.
    Table 3.3 is a partial list of error codes and their causes.


    **Table 3.2 Using LILO to diagnose a boot hang.**


    | LILO Stage | Diagnosis and Suggestions |

    | --- | --- |

    | Blank | LILO did not start load. It was not installed or not on an active partition.
    Go back into Partition Magic and be sure your linux root (/) is bootable. |

    | Error Code | The first stage of LILO loaded properly, but the second could not.
    The hex error code is a clue toward the problem. The disk parameters may not be
    what LILO was expecting. See the section "Determining Disk Parameters" for help
    with this issue. |


    (continued)'
