    # Configuring The Slave Servers


    A slave NIS server is not necessary, but it is useful in large networks, or in
    networks where connections or machines are unreliable and access to the master
    NIS server cannot be guaranteed. To set up the slave server, do the following:


    +   1. Log in as root.


    +   2. Edit the file /etc/yp.conf. It should be initially empty.


    +   3. Add a single line to point to the NIS slave server to the NIS server in
    the format “ypserver ipaddress”. Using the IP instead of the name reduces access
    time, it avoids the issue of name resolution.


    +   4. Change to the /var directory.


    +   5. Create the “yp” directory.


    +   6. Edit the file /etc/rc.d/rc.local.


    +   7. At the end of the file add the line:


    ```

    /bin/domainname fictdomain

    ```'
