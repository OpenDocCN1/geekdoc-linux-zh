  md: '# Deleting A User


    To delete a user along with his or her home directory, use `userdel -r username`
    command.


    For example, to fully remove the account belonging to *paula* would type “userdel
    -r paula”.


    > **TIP:** If you have reason to want to remove an account but leave the user''s
    home directory intact, use userdel without the -r option.


    # Deleting A User In Linuxconf


    To delete a user in Linuxconf:


    +   1. Open Linuxconf (as discussed in the section “Open Linuxconf”).

    2. Open the User Information option in Linuxconf (see the section “Modify Existing
    User Information With Linuxconf” for more details).

    3.. Click the Delete button.

    4. Choose one of the three options of how to deal with the account''s data.

    5. Click the Accept button.


    # Determining System Vulnerability


    System vulnerability depends on a number of factors. Answering “Yes” to any of
    the following raises the need to keep a tight watch on passwords (the more Yeses,
    the tighter the watch):


    +   * Is the computer or network connected to the Internet on a constant basis?

    * Is the computer or network physically accessible by a large number of people?

