  md: '# Manipulating Strings


    Perl provides operators to do two types of string manipulation: repetition and
    concatenation.


    # Repeating A String


    To repeat a string, use the format:


    ```

    $string x number_of_repetition

    ```


    For example, perhaps you want to make a divider for the output of a program. If
    the width of the output is 72 characters, you could use the following segment
    of code to print out the divider:


    ```

    $break="-";

    print $break x 72;

    ```


    This saves the onerous task of having to type the print statement with exactly
    72 dashes.


    # Concatenating Strings


    To concatenate strings, or join them together, use the format:


    ```

    $string1 . $string2

    ```


    For example, perhaps you inputted the value of $first and $last names and want
    to store the entire name as a unit, in the format “last, first”.


    To create this new variable, use the line:


    ```

