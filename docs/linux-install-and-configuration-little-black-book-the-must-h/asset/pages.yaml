    # Choosing Which Components And Packages To Install


    When choosing what packages and kernel modules to install for the Custom install
    class, it is important to give thought to what hardware and services you intend
    to run on your Linux pre. The installer presents hundreds of available packages
    broken into groups of components. First, you choose which components you want
    to install; then you decide whether you want to choose certain packages within
    the components or go just with everything. How much you customize your machine
    is entirely to you.


    Keep the following things in mind when choosing what components and packages to
    install:


    +   - Include drivers for any hardware you intend to use. If it''s not installed
    now but you intend to install it next week, it''s worth installing the drivers
    now.

    - Include compilers and libraries for any languages you intend to use. For example,
    if you plan to do C programming, be sure to install gcc.

    - Include networking drivers and software if necessary. Install these even if
    you won''t be setting up your network right away.

    - Include servers for the services you intend to run. If this machine will reside
    on a large enough network, determine which computers will provide which services.
    Spreading such things as mail servers and Web servers across multiple machines
    can greatly speed up each individual task.

    - Include clients for the services you intend to access. How many clients are
    necessary on your server machine depends on your plans for its use. If the server
    is intended to be in a network and serve other machines, you may want to install
    a few clients for testing purposes. Otherwise, the clients be more important to
    install on the end-user machines on your network.

    - If you want to use shells other than bash, be sure to include them.


