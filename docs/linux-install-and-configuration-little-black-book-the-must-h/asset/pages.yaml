- img_proc: true
  md: "# The Triads\n\nThe rest of the permission bits are three sets of three, as\
    \ shown in Figure 5.2. The first three after the type bit are the triad that defines\
    \ the owner's permissions. The second three are the group's permissions, and the\
    \ third set of three refers to access for everyone on the system. Already you\
    \ might see why it is important to set these bits carefully.\n\n# Inside The Triad\n\
    \nReading each triad is an identical process. A triad is made up of three different\
    \ bits:\n\n+   - the read (r) bit\n- the write (w) bit\n- the execution (x) bit\n\
    \nThese bits are always displayed in the same order; that is, rwx. The way to\
    \ tell if one of these bits is on or off is whether it shows as a letter or a\
    \ dash (-). For example, in the permission set rw- the read bit is active and\
    \ the write bit is active, but the execution one is not; therefore, this triad\
    \ is set to have read and write permissions but no execution.\n\n```\ndrwwxrwx\n\
    \  ^ ^ ^\nOwner Group User/Everyone\n```\n\nFigure 5.2 The three permission triads:\
    \ owner, group, and other (the users)."
