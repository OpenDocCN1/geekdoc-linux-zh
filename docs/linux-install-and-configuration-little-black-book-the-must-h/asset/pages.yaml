    # Red Hat''s Install Classes


    Install classes are a feature introduced in Red Hat''s 5.2 release and are available
    in subsequent releases. There are three install classes available:


    +   * Workstation

    * Server

    * Custom


    Each class has its strengths and weaknesses. It''s important to choose the one
    most suited to your needs.


    ![](img/2b916f28ab4fa126e516b3f9293c726b_82_0.png)


    # The Workstation Class


    If you want to do a minimal practice run, the Workstation class is a good choice.
    It is a helpful option for beginners who are unsure about partitioning issues.
    Some things to keep in mind with the Workstation install class are:


    +   * It installs LILO on your Master Boot Record (MBR), whereas you may want
    instead on the Linux partition or a boot disk. If MS Windows is already installed
    on the system, LILO is automatically configured to dual boot.


    +   * It erases all existing Linux partitions on your hard drive, or not they
    are Red Hat Linux, and then uses all unpartitioned space that is left on the drive.


    +   * It chooses which packages to install. You have no input in the matter.


    The Workstation class uses approximately 600MB of space to create the following
    partitions:


    +   * 64MB swap for swap space.

    * 16MB /boot for the first stage of LILO and the kernel.

    * 600MB or larger—expands to fill all available free space on the drive—root (/).


