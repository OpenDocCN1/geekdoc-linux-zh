  md: '# Configuring NIS


    To configure your LAN for NIS, you must configure a Master server and the clients.
    You also have the option of configuring Slave servers which contain copies of
    the NIS databases.


    NOTE: The portmap daemon must be running for the NIS software to run properly.
    Also, ensure that time service is marked to run in /etc/inetd.conf. It''s necessary
    for secure portmapping.


    # Installing The Packages


    The NIS package is available as an RPM on both the Red Hat and Caldera CD-ROMs.
    Install the packages just as you would install any other RPM. Their locations
    are:


    +   * In Red Hat, you can find the code necessary to activate an NIS client in
    the authconfig package. The NIS server itself is in the package ypserv, and the
    client software is in yp-tools and yp-bind. All of these files are available in
    /RedHat/RPM/

    * In Caldera, NIS is broken into two different packages. For a server, install
    the package nis-server. If you want to install a client, use nis-client. These
    packages are both available in /Packages/RPMS/


    NOTE: During the Red Hat install process you were given the option of installing
    an NIS client in the Authentication Configuration dialog box.


    It is possible that these packages are already installed. RPM will tell you if
    this is the case.


    NOTE: Shadow passwords and NIS don''t mix. If there are only certain people who
    need access to the NIS server then remove them from the shadow database and copy
    their passwords from /etc/shadow and back to /etc/passwd. Otherwise, you will
    need to remove shadow passwords from your system.


    | Related solutions: | Found on page: |

    | Installing The Shadow Password Package | 159 |

    | Installing An RPM Package | 295 |'
  merge: -1
  pgno: 260
