    # Setting Up A LAN


    Setting up a Local Area Network works best when a specific process is followed:


    +   1. If the LAN is going to be connected to the Internet, register the domain
    name.

    2. Choose and install the networking hardware.

    3. Configure the Internet Protocol (IP) addresses for each machine, or node, on
    the network as discussed in "Setting The IP Address" and "Setting The IP Address
    In The GUI.\n4. Use the "ping" command in the format "ping address" between various
    randomly-selected machines to ensure that the network is set up at this point.

    5. Name the machines and the domain throughout the network.

    6. Configure routing.

    7. Configure DNS.

    8. Use the "ping" command in the format "ping name" between randomly selected
    machines within the network to ensure it''s set up correctly.

    9. Make security adjustments.

    10. Connect LAN to the Internet if necessary.

    11. If connected to the Internet, first test pings on IP addresses outside the
    domain, then test them on names.'
