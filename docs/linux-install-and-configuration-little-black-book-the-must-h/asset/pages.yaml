  md: '# In Brief


    If your Linux box resides on a network where it must share drives and printers
    with Windows machines or other dissimilar operating systems, Samba (SMB, the Session
    Message Block protocol) is a very useful tool. Samba is one implementation of
    Common Internet File System (CIFS), which is based on the file and printer access
    protocol Microsoft Windows uses internally. CIFS tools are also available for
    a number of other operating systems, making sharing across diverse networks easier.


    **TIP:** If there are a lot of people who will be accessing files over the service,
    and there is a high probability of people accessing files at the same time, use
    Samba instead of NFS. NFS does not do file locking, so multiple people can access
    a file at the same time and all try to change it at once, ending with only one
    user''s changes being stored. However, CIFS clients and servers track file access,
    "locking" a file while it is in so others cannot open it until it is saved and
    exited.


    Also, and this is often the primary reason to choose Samba over NFS, Windows machines
    do not use NFS so you cannot use that service to access data across Linux/Windows
    networks.


    # Samba Components


    Samba comes with two server components (daemons), two client components, and an
    administration tool. Each of these distinct parts has a specific function within
    the Samba suite.


    # Drive And Printer Sharing


    The server component smbd enables drive and printer sharing. The client component
    for accessing smbd server is smclient.


    **NOTE:** If you installed Red Hat Linux with the Server installation class, smbd
    is already installed and should be currently running on your system. It is also
    already configured to run others directly in the system startup scripts.


    # Name Resolution Browsing


    The server component nmbd enables the management and distribution of NetBIOS information.
    It also provides a list of file and print'
