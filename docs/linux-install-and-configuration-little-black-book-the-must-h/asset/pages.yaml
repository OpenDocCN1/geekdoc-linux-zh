    # How This Book Is Organized


    Chapters 1 through 4 handle the process of getting started with and installing
    Linux. The topics include choosing one distribution over another, how to obtain
    the distribution, how to ensure that Linux will run with your hardware, partitioning
    hard drives, and installing each distribution.


    Chapters 5 through 9 cover the basics of using Linux and initially setting it
    up. You''ll learn how to use Linux at the command line level, configure the X
    Windowing System, choose and install a window manager for the GUI, create user
    accounts according to your specifications, and work with the Linux file system.


    Chapters 10 through 14 cover the more advanced portion of using and configuring
    Linux. Topics such as compiling the kernel—the operating system itself—configuring
    your LAN, setting up your Internet connection, and configuring both network and
    Internet services are presented.


    Chapters 15 through 16 cover adding additional items specific to your Linux box.
    How to handle the different types of packages available in the Linux world and
    installing these packages is covered in depth.


    Chapters 17 through 19 cover programming issues such as where to find and how
    to install C programming packages on the distribution CD-ROMs, and how to write
    both shell and Perl scripts.


    Chapters 20 through 21 cover the issues that come up once all the rest is said
    and done. The first of these is setting up a backup routine for your system. The
    second is heightening system security to keep unwanted intruders out.


    # How To Use This Book


    Use the *Linux Install and Configuration Little Black Book* as a reference, it
    suits your needs. Since this book is designed to be brief, it is not necessary
    to read it to cover. Instead, you can read the chapters that interest you and
    look up the specifics on relevant items. Or, never read any of the full chapters,
    though reading Chapters 1 and'
