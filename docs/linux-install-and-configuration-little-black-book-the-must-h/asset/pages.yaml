  md: '# Choosing New User Defaults


    You will likely find that you want to change the user defaults with usadd or adduser
    (see the section "Changing New User Defaults") for how to change the defaults
    once you have selected what you want to change. The following considerations will
    help you decide whether you want to change the defaults, and if so to:


    +   - You may find that you prefer to use a different GROUP for the average new
    user than that assigned by default. Groups are discussed in more detail in Chapter
    5.

    - For some reason you want the default users to have their home directories outside
    the /home hierarchy, you need to change the HOME setting.

    - If you want to render user accounts inactive if they don''t change an expired
    password, change the INACTIVE setting. Enter the number of days you want to wait
    after the password expires before it shuts down the account. Using the default
    value of 0 says that you don''t want accounts automatically deactivated.

    - If your system is sufficiently vulnerable, it is a good idea to have passwords
    expire on a regular basis. Changing the EXPIRE setting to a number tells your
    system how many days a password is valid before it forces the user to change.

    - The default SHELL is usually /bin/bash. If you want to change this, you will
    need to enter the full path for the new default shell.

    - Many savvy system administrators customize new user directories by taking advantage
    of the skeleton directory. This directory contains the files placed in the directory
    of every new account you create. If you want to set up the skeleton directory
    in a location other than the default (often /etc/skel) change the SKEL setting
    to the full path of the new skeleton directory.


    # Changing New User Defaults


    To change the defaults used when creating new user accounts, use the command adduser
    or userr with its appropriate flags. Table 8.1 shows the flags used to change
    each of the default user settings (see the section "Choosing New User Defaults"
    for a more detailed discussion of the settings).'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Table 8.1 Flags used to change generic user defaults with useradd/adduser.


    | User Setting | Flag | Value Format |

    | --- | --- | --- |

    | GROUP | -g | Group number from the file /etc/group |

    | HOME | -d | Full path to the account''s parent home directory (e.g. /home) |

    | INACTIVE | -f | Days |

    | EXPIRE | -e | Days |

    | SHELL | -s | Full path to the shell |

    | SKEL | -k | Full path to the skeleton file |


    For example, if you wanted to do the following:


    +   * Set passwords to expire in 90 days.

    * Automatically deactivate the account if the expired password is not changed
    within 30 days.

    * Change the default shell to /bin/ksh.


    you would use the **adduser -e90 -f30 -s/bin/ksh** command.


    # Modifying Existing User Information


    You change information for specific existing users with the command **usermod**.
    Flags are used to signal which information you want to change. What flags to use
    are shown in Table 8.2.


    > WARNING! If you use the G flag, then any groups not listed with it g will be
    removed from the user''s group definitions.


    | Table 8.2 Flags used to change user info with usermod |

    | Flag | Name | Comments |

    | --- | --- | --- |

    | c | Comment Information | Comment Information used in your finger file. This
    field is better after using the chfn command |

    | d | Home Directory | Enter a new home directory location for this user which
    is automatically created. If you include the m flag after the d flag, the contents
    of the user''s current home directory are moved into the new one |

    | e | Expire Date | If you want the user account to expire on a specific date,
    use this flag and enter the date in the format MM/DD/YY (continued) |'
  merge: -1
