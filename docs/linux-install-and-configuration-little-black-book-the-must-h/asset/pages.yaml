    # Configuring Print Sharing, Windows To Linux


    To configure a printer attached to a Windows machine to be accessible from a Linux
    box via Samba, do the following:


    +   1. Log into each Linux box as **root**.

    2. Add an entry for each Windows printer to the /etc/printcap file on each Linux
    box. You can generate these entries using the printing tools in Red Hat or Caldera''s
    GUIs, or create one by hand. A simple /etc/printcap file might contain:


    ```

    #Name of printer

    laser:\

    #Print spool directory

    sd=/var/spool/lpd/laser:\

    #Suppress the extra header page if you want with the

    #next one.

    :sh:\n#Print files up to 10MB in size.

    :mx#10:

    #Use the log file /var/log/laser.

    if=/var/log/laser:\

    ```'
