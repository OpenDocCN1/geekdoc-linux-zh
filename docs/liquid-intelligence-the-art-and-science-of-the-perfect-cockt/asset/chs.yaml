  \n识别可以使用 Web 浏览器访问 NFS 资源的 NFS 相关协议。\n\n**问题 95**\n\n以下哪个命令用于检查和修复文件系统？\n\na. `mount`\n\
  \nb. `newfs`\n\nc. `fsck`\n\nd. `format`\n\n**问题 96**\n\nNFS 服务器程序将从以下哪些系统运行级别（run\
  \ levels）启动？[选择所有适用项]\n\na. 0\n\nb. s\n\nc. 2\n\nd. 3\n\ne. 6\n\n**问题 97**\n\n以下哪些是\
  \ Solaris 8 软件组？[选择所有适用项]\n\na. 完整发行版 (Entire Distribution)\n\nb. 完整发行版加 OEM 系统支持\
  \ (Entire Distribution Plus OEM System Support)\n\nc. 用户支持 (End User Support)\n\n\
  d. 开发者系统支持 (Developer System Support)\n\n**问题 98**\n\n命名支持单点登录的管理工具。\n\n**问题 99**\n\
  \n以下哪些包含卷管理器但不包含 DiskSuite？[选择所有适用项]\n\n415\n\na. 图形化管理工具\n\nb. 命令行实用\n\nc. 性能分析工具\n\
  \nd. 动态在线调优 (Dynamic online tuning)\n\n**问题 100**\n\n输入用于 `setup_install_server`\
  \ 命令以设置启动服务器的命令行参数。\n\n**问题 101**\n\n输入用于配置 syslog 设施（facility）的文件名称。\n\n**问题 102**\n\
  \n以下哪个不是 AdminSuite 提供的工具？\n\na. 数据库管理器 (Database Manager)\n\nb. 存储管理器 (Storage\
  \ Manager)\n\nc. 网络管理器 (Network Manager)\n\n\n\n答案 a 和 c 正确。`ptree` 和 `ptime` 是\
  \ proc 工具。`pwd` 用于显示当前工作目录。proc 工具的等效命令是 `pwdx` 命令。因此，答案 b 是错误的。\n\n列出信号动作的 proc\
  \ 工具命令是 `psig`，而不是 `psignal`。因此，答案 d 是错误的。\n\n### 问题 8\n\n答案 a 正确。`yppush` 用于将更新的\
  \ NIS 映射传播到 NIS 从机服务器。`ypxfr` 用于传播新映射。因此，答案 d 是错误的。答案 b、c 和 e 中的命令并不存在。\n\n### 问题\
  \ 9\n\n正确答案是 NFS 客户端。\n\n### 问题 10\n\n答案 a-7, b-4, c-2, d-5, e-1, f-6 和 g-3 正确。OSI\
  \ 网络模型的层级从高到低顺次依次为：应用层、表示层、会话层、传输层、网络层、数据链路层和物理层。\n\n### 问题 11\n\n答案 b 和 d 正确。更新默认映射时使用\
  \ `make` 命令。`yppush` 命令用于传播更新非默认映射。使用文本文件添加新映射。因此，答案 a 是错误的。同样，`makedbm` 命令用于新映射。因此，答案\
  \ c 是错误的。\n\n### 问题 12\n\n答案 a、b 和 c 正确。如果有多个 NFS 服务器提供相同资源（如答案 c 所示），可以出多个服务器（用空格分隔）。系统将使用第一个可用资源。\n\
  \n`- nfsserver:/usr/data` 未提供有效的挂载点。因此，答案 d 是错误的。直接映射条目的格式为：挂载点、选项，然后是资源。答案 e 的格式是：挂载点、资源，然后是选项。因此，答案\
  \ e 是错误的。\n\n### 问题 13\n\n答案 a、b、c 和 d 正确。虚拟磁盘管理系统提供了所有功能。\n\n### 问题 14\n\n答案 a、b、c、d\
  \ 和 e 正确。规则条目由一个或多个规则关键字和规则值组成，随后是一个开始脚本（begin script）、然后是配置文件脚本（profile script）和结束脚本（end\
  \ script）。开始和结束脚本是可选的。如果未指定其中一个，则使用连字符 `-` 代替脚本名称。\n\n### 问题 15\n\n答案 c 正确。AdminSuite\
  \ 主机管理器可以添加网络客户端支持。主机管理器不能用于挂载磁盘。因此，答案 a 是错误的。它无法编辑任何 NIS+ 表或启动网络客户端。因此，答案 b 和 d\
  \ 是错误的。\n\n### 问题 16\n\n答案 c 和 f 正确。间接映射（indirect maps）的更改不需要运行 `automount` 命令。`auto_master`\
  \ 和直接映射的更改需要手动执行 `automount` 命令。因此，答案 a、b、d 和 e 是错误的。\n\n### 问题 17\n\n答案 a、b 和 d\
  \ 正确。客户端的主机名、IP 地址和以太地址需要添加到 NIS/NIS+ 中，以支持 JumpStart 安装。安装客户端不需要系统区域设置。因此，答案 c\
  \ 是错误的。由于客户端信息已添加到相应的名称服务中，您不需要识别该名称服务。因此，答案 e 是错误的。\n\n### 问题 18\n\n答案 c 正确。`ypstart`\
  \ 命令用于启动 `ypbind` 程序。`ypinit` 用于 NIS 服务器和客户端。因此，答案 a 是错误的。`ypstop` 用于停止 `ypbind`\
  \ 程序。因此，答案 b 是错误的。`ypcrank` 不存在。因此，答案 d 是错误的。`ypwhich` 用于识别 NIS 服务器。因此，答案 e 是错误的。\n\
  \n### 问题 19\n\n答案 c 正确。用户源（user source facility）用于来自用户程序的消息。如果未指定源，则假设为用户。邮件源（mail\
  \ source）用于与邮件相关的消息。因此，答案 a 是错误的。认证源（auth source）用于与登录验证相关的消息。因此，答案 b 是错误的。内核源（kern\
  \ source）用于来自内核的消息。因此，答案 d 是错误的。\n\n### 问题 20\n\n正确答案是 tables（表）。\n\n### 问题 21\n\
  \n答案 b 和 d 正确。创建 CacheFS 配置需要 `-c` 命令行参数和缓存目录的完整路径。NFS 服务器名称和资源以及本地主机名称不能通过命令行参数指定。因此，答案\
  \ a 和 e 是错误的。`-o` 命令行参数可以指定选项，但不是强制性的。因此，答案 c 是错误的。\n\n### 问题 22\n\n答案 d 正确。以太网地址长度为六个\
  \ 8 位字节或 48 位。可以使用 `ifconfig` 命令显示它。以太网地址是六个而不是五个 8 位字节，且 `ping` 命令无法显示网络接口的以太网地址。因此，答案\
  \ a、b 和 c 是错误的。\n\n### 问题 23\n\n答案 a 和 c 正确。SunInstal 和 Web Start 是交互式安装方法。自定义 JumpStart\
  \ 和 JumpStart 是自动安装方法。因此，答案 b 和 d 是错误的。\n\n### 问题 24\n\n答案 a、c 和 d 正确。`-c`、`-d`\
  \ 和 `-o` 是 `cfsadmin` 的有效命令行参数。`-s` 命令行参数用于执行一致性检查，而不是 `-C`。因此答案 b 是错误的。\n\n###\
  \ 问题 25\n\n答案 c 正确。某些名称服务使用 ASCII 文件并提供主机名和 IP 地址，DNS 是唯一用于互联网的。因此，答案 a、b 是错误的。\n\
  \n### 问题 26\n\n答案 b 正确。条带虚拟文件系统由分区组成。RAID 1 使用镜像方式（而非交叉方式）。因此答案 a 是错误的。拼接虚拟文件系统一次使用分区。因此答案\
  \ c 是错误的。热备（Hot spare）不是文件系统类型。因此答案 d 是错误的。\n\n### 问题 27\n\n答案 a、c 和 d 正确。如果指定了文件名，消息将追加到文件中。如果指定了主机名，消息将发送到主机。如果指定了用户名，消息将显示在用户的标准输出上。另一个有效操作是星号\
  \ `*`，它会将消息显示在所有登录用户的标准输出上。因此答案 b 是错误的。\n\n### 问题 28\n\n答案 a 和 c 正确。不带参数的 `share`\
  \ 命令列出所有本地共享的资源。`dfshares` 可列出本地或远程共享。`dfmounts` 用于列出本地或远程挂。因此答案 b 是错误的。`mountall`\
  \ 用于挂载本地文件系统。因此答案 d 是错误的。`mount` 用于挂载或列出当前挂载的本地文件系统和 NFS 资源。因此答案 e 是错误的。\n\n###\
  \ 问题 29\n\n答案 b 正确。生成创建 NIS 映射的数据文件，应将 `/etc` 文件复制到目录并进行清理。可以修改 `/etc` 文件，但可能会对系统产生不利影响，不是最佳方法。因此答案\
  \ a 是错误的。`makenisdata` 和 `buildmap` 命令不存在。\n\n### 问题 30\n\n正确答案是 rules（规则）。\n\n\
  ### 问题 31\n\n正确答案是 striping（条带化）。\n\n### 问题 32\n\n正确答案是 `cachefslog`。\n\n### 问题\
  \ 33\n\n正确答案是 `unshare`。\n\n### 问题 34\n\n正确答案是 `roleadd`。\n\n### 问题 35\n\n正确答案是\
  \ FNS。\n\n### 问题 36\n\n答案 c 正确。严重级别的排序顺序为：emerg, alert, crit, err, warning, notice,\
  \ info, debug 和 none。\n\n### 问题 37\n\n```\n\n\n答案 a 正确。`ypinit -m` 命令用于配置 NIS 主节点。`ypinit\
  \ -c` 用于配置 NIS 客户端，`ypinit -s` 用于配置 NIS 从用服务器。因此，答案 b 和 c 错误。答案 d 和 e 中的命令不存在。\n\
  \n### 问题 38\n答案 b 正确。`/etc/vfstab` 文件用于在系统启动或使用 `mountall` 命令时自动挂载 NFS 资源。`/etc/dfs/dfstab`\
  \ 文件用于自动共享 NFS 资源。因此，答案 a 错误。`/etc/mnttab` 文件列出了当前挂载的文件系统和 NFS 资源。因此，答案 c 错误。`/etc/dfs/sharetab`\
  \ 文件列出了当前共享的 NFS 资源。因此，答案 d 错误。\n\n### 问题 39\n答案 b 正确。`/dev/vx/dsk` 路径与卷管理器（Volume\
  \ Manager）关联。`/dev/dsk` 与标准文件系统关联。因此，答案 a 错误。`/dev/md/dsk` 与 DiskSuite 虚拟文件系统关联。因此，答案\
  \ c 错误。答案 d 中的路径不存在。\n\n### 问题 40\n正确答案是 ethers。\n\n### 问题 41\n正确答案是 `makedbm`。\n\
  \n### 问题 42\n答案 c 正确。`/etc/defaultdomain` 文件用于存储默认系统域。如果使用了此文件，则每次重启后都不需要定义域名。因此，答案\
  \ a 错误。`domainname` 命令不支持 `-p` 命令行参数。因此，答案 b 错误。\n\n### 问题 43\n答案 a 正确。`bootparams`\
  \ 文件包含了为网络/安装客户端提供启动、根分区和交换区的服务器列表（及路径）。其中一个包含网络客户端的以太网地址和关联的主名。因此，答案 b 错误。`timezone`\
  \ 包含网络客户端的时区信息。因此，答案 c 错误。`hosts` 包含系统主机名和 IP 地址。因此，答案 d 错误。`vfstab` 包含了自动挂载的文件系统列表。因此，答案\
  \ e 错误。\n\n### 问题 44\n正确答案是 WebNFS。\n\n### 问题 45\n答案 c 正确。`fsck` 命令用于检查和修复文件系统。`mount`\
  \ 命令用于挂载文件系统。因此，答案 a 错误。`newfs` 命令用于在磁盘格式化后创建文件系统。因此，答案 b 错误。`format` 命令用于格式化文件系统。因此，答案\
  \ d 错误。\n\n### 问题 46\n答案 d 正确。NFS 服务器程序在运行级别 3 启动。运行级别 0 是关机状态；在此状态下服务正在关闭。因此，答案\
  \ a 错误。运行级别 4 用于管理，不允许用户访问系统。因此，答案 b 错误。除 NFS 服务器外的所有网络服务都在运行级别 2 启动。因此，答案 c 错误。运行级别\
  \ 6 是重启状态，系统正在重启。因此，答案 e 错误。\n\n### 问题 47\n答案 a、b、c、d 都正确。从最小到大，软件组分别是：终端用户支持（End\
  \ User Support）、开发者系统支持（Developer System Support）、整个发行版（Entire Distribution）以及整个发行版加\
  \ OEM 系统支持（Entire Distribution Plus OEM System Support）。\n\n### 问题 48\n正确答案是 Solaris\
  \ Management Console。\n\n### 问题 49\n答案 c 和 d 正确。卷管理器包含性能分析工具和动态在线调，但 DiskSuite 不包含。卷管理器和\
  \ DiskSuite 都提供了图形化管理工具和命令行实用。因此，答案 a 和 b 错误。\n\n### 问题 50\n正确答案是 `-b`。\n\n### 问题\
  \ 51\n正确答案是 `/etc/syslog.conf`。\n\n### 问题 52\n答案 c 正确。AdminSuite 包含用于管理网络客户端的主机管理器（Host\
  \ Manager），而不是网络客户端管理器（Network Client Manager）。数据库管理器、存储管理器和串口管理器都包含在 AdminSuite\
  \ 中。因此，答案 a、b、d 错误。\n\n### 问题 53\n答案 d 正确。`/etc/dfs/sharetab` 文件列出了当前共享的资源。答案 a\
  \ 和 b 不存在。`/etc/vfstab` 文件包含了在系统启动或使用 `mountall` 命令时自动挂载的文件系统列表。\n\n### 问题 54\n\
  答案 a 正确。`/dev/dsk` 与标准文件系统关联。`/dev/vx/dsk` 与卷管理器关联。`/dev/md/dsk` 与 DiskSuite 虚拟文件系统关联。因此，答案\
  \ c 错误。\n\n### 问题 55\n正确答案是 `syslog`。\n\n### 问题 56\n答案 a、b、c、d 都正确。在配置文件中必须定义 `install_type`\
  \ 关键字。\n\n### 问题 57\n答案 b 正确。Intel 客户端从本地软磁盘或 CD-ROM 获取启动镜像。只有 SPARC 客户端使用 TFTP。因此，答案\
  \ d 错误。\n\n### 问题 58\n答案 a-4,b-5,c-1,d-2 和 e-3 都正确。TCP/IP 模型从高到低层分别是：应用层、传输层、网络层、数据链路层和物理层。\n\
  \n### 问题 59\n答案 a 正确。应指定只读（ro）挂载选项来设置故障转移。因此，答案 b、c、d 错误。\n\n### 问题 60\n正确答案是 `root`。`root=`\
  \ 命令行参数用于指定具有 root 权限的客户端。\n\n### 问题 61\n答案 b、c、d 正。`swap` 命令用于添加、列出和删除交换空间。`mkfile`\
  \ 命令用于创建交换空间。因此，答案 a 错误。\n\n\n\n\n- 测试命令有 `probe-scsi`、`test-all`、`test floppy`、`test\
  \ /memory` 和 `test net`。\n\n- 设备别名（非易失性）使用 `nvalias` `name value` 设置，使用 `devalias`\
  \ 查看，使用 `nvunalias` `name` 删除。临时设备别名可以使用 `devalias` `name value` 创建。\n\n- 使用 `eeprom`\
  \ 查看和修改 OpenBoot 参数\n\n- SPARC 键盘命令通过 `/etc/default/kbd` 启用，包括使用 `stop` 跳过 POST，`stop+a`\
  \ 终止操作系统，以及 `stop+d` 进入诊断模式。\n\n## 5. 启动过程\n- 内核模块通过 `/etc/system` 配置。模块位于 `/platform/sparc/kernel`\
  \ 或 `/platform/i86pc/kernel`、`/kernel` 以及 `/usr/kernel`。\n- `init` 是启动过程的最后一步，并启动\
  \ `/etc/inittab` 中列出的程序。\n\n## 6. 运行级别控制\n- 八个运行级别分别是：`0`（关机）、`s`（单用户）、`1`（管理）、`2`（不带\
  \ NFS 服务器的多用户（仅 NFS 客户端））、`3`（带 NFS 服务器的多用户）、`4`（未使用）、`5`（关机）和 `6`（重启）。\n- 命令为 `init`\
  \ 和 `shutdown`。使用 `who -r` 确定当前或上一个运行级别。\n\n## 7. 文件权限\n- 使用 `chmod` 或 `setfacl`\
  \ 设置文件权限并修改 ACL。使用 `getfacl` 查看 ACL。\n\n## 8. 用户和组账户\n- 使用 `useradd` 添加、`usermod`\
  \ 修改、`userdel` 删除用户账户。\n- 使用 `groupadd` 添加、`groupmod` 修改、`groupdel` 删除组账户。\n- 使用\
  \ `passwd account` 修改 `account` 的密码。\n\n## 9. 初始化文件\n- Bourne shell 使用 `.profile`\
  \ 进行登录初始化；C shell 使用 `.login`、`.cshrc`（shell 启动）和 `.logout`；korn shell 使用 `.profile`\
  \ 和使用通过导出的 `ENV` 变量定义的自定义 shell 启动文件。\n- 系统配置文件 `/etc/profile` 在用户登录初始化文件之前调用。\n\
  - 模板为 `/etc/skel/local.profile`、`/etc/skel/local.login` 和 `/etc/skel/local.cshrc`\
  \ 文件。\n\n## 10. 查看和终止进程\n- 使用 `ps`、`prstat` 和 `pgrep` 查看进程属性，使用 `kill`（需要进程 ID——默认信号为\
  \ SIGTERM）和 `pkill` 进行终止。\n\n## 11. 进程调度\n- `cron` 通过 `/etc/cron.d/cron.allow` 和\
  \ `/etc/cron.d/cron.deny` 控制。使用 `crontab` 编辑 crontabs。\n- `crontab` 格式为：分钟、小时 (0-23)、日、月、星期\
  \ (0-6)、命令。\n- `at` 命令允许使用 AM/PM 或 24 小时制进行一次执行。\n\n## 12. 设备名称\n- `physical` 由系统使用，逻辑（原始和块）用于磁盘/磁带设备，`instance`\
  \ 提供简化的名称。\n- `/etc/path_to_inst` 文件提供了物理名称和实例名称之间的映射。\n- 显示名称的命令有 `df`（逻辑块）、`dmesg`（物理和实例）、`format`（物理和逻辑）、`mount`（逻辑原始）、`prtconf`（实例）和\
  \ `sysdef`（实例）。\n- `devfsadm` 维护 `/dev` 和 `/devices` 目录。`devfsadm` 支持动态配置。\n\n##\
  \ 13. 磁盘分区\n- 磁盘标签或卷目录（VTOC）包含磁盘几何结构和分区表。\n- 分区表定义了分区的位置和大小。\n- 使用 `fmthard` 或 `format`\
  \ 创建分区表并使用 `prtvtoc` 显示。\n\n## 14. 热插\n- 支持热插的 SCSI 和 PCI 设备可以在不启动系统的情况下添加或删除。\n\
  - 使用 `cfgadm` 对热插设备进行动态配置。\n\n## 15. 文件系统基础\n- 文件系统类型有 HSFS（CD-ROM）、PCFS（软盘）、通用磁盘格式\
  \ (UDF)（光介质）和 UFS（默认硬盘）。\n- 挂载点有 `/`（内核文件）、`/usr`（系统文件）、`/home`、`/var`、`/opt`、`/tmp`\
  \ 和 `/proc`。\n- 文件系统命令有 `mkfs` 或 `newfs` 创建 UFS，`fsck` 检查以及 `mount` 使其可用（除 `mount`\
  \ 外的所有命令均使用原始设备）。\n- UFS 的 `mount -o` 选项包括访问时间的 `atime`、允许键盘中断的 `intr` 以及支持大文件的\
  \ `largefiles`。\n- 当使用卷管理时，CD-ROM 通过 `vold` 自动挂载，并使用 `mount` 手动挂载。使用 `eject cdrom`\
  \ 卸载。\n- 软盘通过 `vold` 使用 `volcheck` 挂载，并使用 `eject` 卸载（无命令行参数或 `floppy0` 等）。\n\n##\
  \ 16. 文件和目录\n- 文件类型有：普通、目录 (d)、链接 (l)、块 (b)、字符 (c)、Door (D)、FIFO (p) 和套接字 (s)。\n\
  - 使用 `link` 或 `ln` 创建硬链接（限制于同一文件系统）。使用 `ln -s` 创建软链接。使用 `unlink`、`rm` 或 `rmdir`\
  \ 删除任一类型的链接。\n- 使用 `compress` (`uncompress`)、`gzip` (`gunzip`) 或 `zip` (`unzip`)\
  \ 压缩（解压缩）文件。只有 `zip` 会压缩一组文件/目录。\n\n## 17. 备份和恢复命令\n- 使用 `mt -f device` `command`\
  \ 控制磁带。如果没有给出 `device`，则假设为 `/dev/rmt/0n`。命令有：`asf` 定位带，`bsf n` `skip n` `EOF` 标记向后，`fsf`\
  \ `skip n` `EOF` 标记向前，`rewind`（倒带）、`erase`（清除）和 `status`（状态）。\n- 使用 `ufsdump` `commands`\
  \ `raw_device` 备份文件系统。命令 `0-9` 表示备份级别（0 为文件系统），`f` 输出文件，`v` 验证备份。如果没有给出 `commands`，则假设为\
  \ `9uf /dev/rmt/0`。\n- 使用 `ufsrestore f backup_device` 恢复文件系统或选定的文件。如果没有给出 `backup_device`，假设为\
  \ `/dev/rmt/0`。\n- 使用 `tar commands backup_device directory` 命令：`c` 创建，`r` 替换，`x`\
  \ 提取，`v` 详细模式。使用 `f` 指定输入/输出文件或设备。\n- 使用 `cpio` 创建/提取存档。`find` 可以根据修改日期、文件类型等生成包含在归档中的文件列表。\n\
  \n## 18. 目录树导航\n- 元字符 `?`（任意字符）、`*`（零或多个字符）和 `[ ]`（字符范围）可用于生成相对或绝对（从根目录）路径名还可以还可以当前目录（`.`）和父目录（`..`）。\n\
  \n## 19. vi 编辑器\n- 模式：命令（默认）、输入（输入数据并以 `<ESC>` 结束）、最后一行（文件和搜索，从命令模式通过冒号、斜杠或问号进入）。\n\
  - 使用光标移动键：`<h>` 左、`<j>` 下、`<k>` 上和 `<l>` 右。\n\n## 20. 远程访问\n- 使用 `telnet` 或 `rlogin`\
  \ 进行远程登录。使用 `ftp` 或 `rcp` 进行远程复制。使用 `rsh` 执行远程 shell 命令。\n- `ftp` 子命令：`ascii`、`binary;`、`get`、`put;`、`hash;`、`lcd`、`cd;\
  \ mget`、`mput`。\n- 使用 `rcp file user@host:path`（`user@` 可省略）。\n- 使用 `rsh host command`。\n\
  \n## 第二部分\n## 网络环境\n## 1. TCP/IP 支持\n- 七层 OSI 网络模型 包含：应用、表示、会话、传输、网络、数据链路和物理。\n\
  - 五层 TCP/IP 网络模型 包括：应用、传输、网络、数据链路和物理。\n- `以太网地址` 由六字节 8 位数据（48 位）组成。\n- `地址解析协议\
  \ (ARP)` 将 IP 地址映射到以太网地址。\n- `反向 ARP (RARP)` 从以太网地址映射。\n- 配置文件有 `/etc/inet/hosts`（主机名和\
  \ IP 地址）、`/etc/nodename`（本地主机名）以及 `hostname.interface`（本地主机名或 IP 地址）。\n- 使用网络命令如\
  \ `ping` 和 `spray` 测试连通性。使用 `ifconfig` 和 `netstat` 查看网络接口配置并检查网络统计数据。\n- `远程过程调用\
  \ (RPC)` 服务通过 `rpcbind` 注册并可以使用 `rpcinfo` 查看。\n\n\n\n\n\no 网络服务由 `inted` 控制并使用 `/etc/inet/inted.conf`\
  \ 文件进行配置。\n\n## Syslog 与审计\n\n### 2. syslog\no `/etc/syslog.conf` 包含 `source.priority\
  \ action` 语句。默认的 syslog 文件为 `/var/adm/messages`。\no `Sources`（源）包括 `auth`、`cron`、`daemon`、`kern`、`lpr`、`local0-7`、`mail`、`mark`、`news`、`user`\
  \ 和 `uucp`。`*` 用于指定除 `mark` 以外的所有源。\no `Priorities`（优先级）包括 `emerg,alert,crit,err,warning,notice,info,debug,\n\
  o `Actions`（动作）包括 `/filename`（追加到文件）、`@host`（发送到主机）、账户名（显示在终端上）和 `*`（显示在所有登录的终端）。\n\
  o 可以 `m4 macros` 在 `syslog.conf` 文件中包含条件语句。\n\n## 高级磁盘管理\n### 3. DiskSuite 和 Enterprise\
  \ Volume Manager 都支持条带（striped）和拼接（concatenated）虚拟设备以及 RAID 配置。\no DiskSuite 设备使用\
  \ `/dev/md/dsk` 和 `/dev/md/rdsk` 路径，而 Volume Manager 设备使用 `/dev/vx/dsk` 和 `/dev/vx/rdsk`\
  \ 路径。\no Volume Manager 还包括性能分析工具和动态在线调整。\n\n## 伪文件系统\n### 4. 基于内存的文件系统包括：\no 用于远程数据本地缓存的\
  \ `CacheFS`、用于进程状态的 `PROCFS`、用于交换空间的 `SWAPFS` 以及快速访问临时文件的 `TMPFS`。\no `proc tools`\
  \ 用于显示存储 `/proc` 下 `PROCFS` 中的进程信息。这些包括 `pcred`、`pflags`、`pfiles`、`pldd`、`pmap`、`prun`、`psig`、`pstack`、`pstop`、`ptime`、`ptree`、`pwait`\
  \ 和 `pwdx`。\no 默认 `TMPFS` 包括 `/tmp` 和 `/var/run`。文件在卸载或系统重启时会丢失。\n\n## 交换空间\n###\
  \ 5. 用于临时存储内存数据的磁盘存储空间。\no 使用 `mkfile` 配置更多的交换空间。\no 使用 `swap` 用于添加 (`-a`)、列出 (`-l`)、删除\
  \ (`-d`) 和显示统计信息 (`-s`) 交换空间。\n\n## 基于角色的访问控制 (RBAC)\n### 6. 允许根据需要授予特权操作和命令的访问权限。\n\
  o `role` 是通过 `su` 命令访问的特殊用户账户。\no `profiles` 是分配给角色的授权和特权操作集。\no `authorizations`\
  \ 是分配给角色的执行受限功能的权利。\n### 7. RBAC 数据库由四个文件组成：\no `usr_attr` 定义角色，并将授权和配置分配给角色和用户账户。用冒号分隔的字段为\
  \ `name`、`qualifier`、`reserved1`、`reserved2` 和 `attributes`。\no `prof_attr` 定义配置。字段为\
  \ `name`、`reserved1`、`reserved2`、`description` 和 `attributes`。\no `auth_attr` 定义授权。字段为\
  \ `name`、`reserved1`、`reserved2`、`sort description`、`long description` 和 `attributes`。\n\
  o `exec_attr` 定义特权操作。字段为 `name`、`policy`、`type`、`reserved1`、`reserved2`、`ID` 和 `attributes`。\n\
  \n## NFS\n### 8. NFS 客户端在运行级别 2 ，服务器在运行级别 3 。\no NFS 是默认的分布式文件系统类型，在 `/etc/dfs/dfstypes`\
  \ 文件中指定。\no 使用 `share` 和 `shareall`（共享 `/etc/dfs/dfstab` 中列出的所有资源）提供 NFS 资源。使用 `unshare`\
  \ 和 `unshareall`（取消共享 `/etc/dfs/sharetab` 中列出的所有资源）移除资源。`dfshares` 可列出本地或远程共享。\n\
  o 使用 `mount` 和 `mountall`（挂载 `/etc/vfstab` 中列出的所有资源）访问 NFS 资源。使用 `umount` 和 `umountall`（卸载\
  \ `/etc/mnttab` 中列出的所有资源）停止访问。`dfmounts` 可列出本地或远程共享。\no 客户端故障转移通过指定包含多个 NFS 服务器（逗号分隔）的\
  \ `/etc/vfstab` 和 `-o ro`（只读）挂载选项来配置。\no WebNFS 允许 Web 浏览器访问 NFS 资源。`share` 命令的命令行可以将公共文件句柄与共享\
  \ (`public`) 相关，并指定使用文件代替列出目录 (`index`)。\n### 9. AutoFS 按需挂载 NFS 资源并在空闲 10 分钟后卸载它们。\n\
  o 使用 `automount -t n` 命令指定 `n` 秒的空闲时间限制。\no 配置文件——`/etc/auto_master` 文件列出了直接和间接映射。直接映射文件提供完整的挂载点和资源列表（`system:path\
  \ system:path` 等）。间接映射文件列出相对于 `/etc/auto_master` 中指定目录的挂载点和资源列表（`system:path system:path`\
  \ 等）。\n当 `/etc/auto_master` 文件或任何直接映射更改时，必须执行 `automount` 命令。\n### 10. CacheFS 用于在客户端本地缓存\
  \ NFS 资源。\no 使用 `cfsadmin` 创建、检查、调整和删除缓存。\no 使用 `mount` 命令的行参数在缓存中挂载 NFS 资源。这些是指定资源类型\
  \ (NFS) 的 `backfstype` 和指定缓存完整路径的 `cachedir`。然后通过缓存访问资源，根据需要自动更新。\n\n## 名称服务\n###\
  \ 11. 域名系统 (DNS) 和轻量级目录访问协议 (LDAP) 是全局命名系统。其他都是企业命名系统。\n### 12. DNS 是一种互联网服务并使用数据文件。\n\
  ### 13. 网络信息服务 (NIS)\no NIS 使用映射。`ypinit -m` 初始化主服务器，`ypinit -s` 用于可选从服务器，`ypinit\
  \ -c` 用于客户端。\no 使用 `make` 更新自动分发的默认映射。使用 `makedbm` 和 `ypxfr` 创建并分新映射。使用 `makedbm`\
  \ 和 `yppush` 更新并分非默认映射。\n### 14. 网络信息服务增强 (NIS+)\no 使用表格；支持身份验证（限制访问）和授权（限制已验证用户的操作）。\n\
  o 可选的 NIS+ 副本提供服务器冗余。\n### 15. 也支持 `/etc` 文件、轻量级目录访问协议 (LDAP) 和联邦命名服务 (FNS)。\n###\
  \ 16. 名称服务切换文件 `/etc/nsswitch.conf` 决定使用哪些名称服务以及顺序。\n\n## Solaris 管理控制台\n### 17.\
  \ 使用一组图形用户界面 (GUI) 管理工具远程管理多个 Solaris 系统的域。\no 工具包括用户管理器、进程管理器、日志查看器、作业调度器、挂载和共享管理器、磁盘/分区管理器和串口端口管理器。\n\
  o 其他功能：单点登录和 RBAC 管理。\n\n## AdminSuite\n### 18. 使用一组 GUI 管理工具远程管理多个 Solaris 系统。\n\
  o 工具包括主机管理器、存储管理器（磁盘管理器和文件系统管理器）、数据库管理器、串口端口管理器、用户管理器、组管理器和打印机管理器。\no 其他功能：支持 NIS、NIS+\
  \ 和 `/etc` 文件名称服务。\n\n## 高级安装\n### 19. 安装阶段包括系统配置、系统安装和后安装。\n### 20. 网络安装包括安装服务器和启动服务器：\n\
  o *安装服务器*——提供用于安装的软件镜像，并使用 `setup_install_server` 命令设置。\no *启动服务器*——提供启动文件且必须与客户端处于同一子网。它使用\
  \ `setup_install_server -b` 命令设置。\no *安装客户端*——在安装/启动服务器上使用 `add_install_client host\
  \ platform` 定义。\n### 21. JumpStart 根据平台和硬件配置自动完成安装：\no 使用规则文件，该文件列出了不同的配置并为每种配置指向一个配置文件。\n\
  o 规则文件条目由关键字和值组成，用于识别系统或系统组，随后是可选的开始脚本名称或连字符 (-)、配置文件，然后是可选的结束脚本名称或连字符 (-)。\no 配置文件条目由关键字和值组成。\n\
  \n\n\n\nSolaris 8 通过增加访问控制列表（ACL）功能扩展了标准的 Unix 文件权限。ACL 提供了为特定用户和组添加权限的能力，同时包含一个默认权限（掩码）。除了支持所有者、组和其他人的标准读/写/执行权限外，ACL\
  \ 还可以用于为额外的用户账户和组账户设置读/写/执行权限，并定义控制赋予用户和组账户的最大允许权限的掩码。目录的 ACL 包含默认条目，决定分配给在该目录下创建的文件和子目录的权限。`setfacl\
  \ (1M)` 命令用于设置 ACL，`getfacl (1M)` 命令用于显示 ACL。\n\n### 地址解析协议 (ARP)\n一种用于从 IP 地址映射到以太网地址的协议。\n\
  \n###架构 (architecture)\n平台的变体。对于 SPARC 平台，架构类型包括 `sun4c` 和 `sun4m`。\n\n### 授权 (基于角色的访问控制)\n\
  执行受限管理功能（如关闭系统）的权限。\n\n### AutoClient\n一种网络客户端，使用小型本地磁盘作为交换空间，以及根目录和用户文件系统的缓存副本。\n\
  \n### AutoFS\n一种网络服务和文件系统类型。当尝试访问 AutoFS 资源时，它们会自动挂载，并在空闲一段时间后自动卸载。\n\n### AutoFS\
  \ 映射\n用于配置 AutoFS 服务的文件。AutoFS 映射有三种类型：识别其他映射的 `/etc/auto_master` 文件、识别挂载点完整路径及关联\
  \ NFS 资源的直接映射（direct maps），以及识别挂载点部分路径及关联 NFS 资源的间接映射（indirect maps）。\n\n### 启动服务器\n\
  一种网络服务器，在通过网络安装期间为安装客户端提供启动所需的文件。安装客户端启动后，启动服务器即完成了其功能。安装的剩余部分由安装服务器支持。通常，安装服务器和启动服务器位于同一系统中。但是，如果安装客户端与安装服务器不在同一个子网，则必须在安装客户端所在的子网上设置启动服务器。\n\
  \n### Bourne shell (sh)\n一种由 AT&T 贝尔实验室的 Steven Bourne 开发的一种 Unix shell 版本。被称为 `sh`。Bourne\
  \ shell 是 Solaris 操作系统的默认 shell。\n\n### C shell (csh)\n一种一种在加州大学伯克利分校开发的 Unix shell\
  \ 版本。被称为 `csh`。\n\n### CacheFS\n一种存储服务和文件系统类型。CacheFS 用于在本地存储远程 NFS 资源的副本。这样做允许更快的访问并减少网络流量。\n\
  \n### 客户端\n一种使用服务器提供的服务的网络计算机系统。\n\n### 客户端/服务器 (client/server)\n计算机系统的一种操作模型，其中服务集中在服务器上，并通过网络由一个或多个客户端访问。\n\
  \n### 客户端侧故障转移 (client-side failover)\n当原始 NFS 服务器不可用时，自动切换到另一个提供资源“副本”的 NFS 服务器。\n\
  \n### 通用桌面环境 (CDE)\n一种图形用户界面。\n\n### 拼接条带虚拟设备\n一种通过在设备末尾拼接附加切片而扩展的条带虚拟设备。\n\n###\
  \ 拼接虚拟设备\n由两个或更多部分组成的设备。\n\n### 直接映射\n一种 AutoFS 映射类型，用于识别挂载点的完整路径及关联 NFS 资源。\n\n\
  # 目录\n用于组织文件的文件夹。\n\n### 磁盘组\n一组共享共同配置的卷管理器 (VM) 磁盘集合。\n\n### 磁盘标签\n参见卷表目录。\n\n\
  ### 无盘客户端\n一种没有任何本地存储的网络客户端。\n\n### 领域\n一组使用名称服务作为单一实体进行管理的系统。\n\n### 域名系统 (DNS)\n\
  互联网上用于将主机名解析为 IP 地址的名称服务。\n\n### 双工复制 (duplexing)\n将正在写入一个在线设备的数据复制到另一个离线设备的技术。双工复制提供了数据的实时备份，在发生故障时可以恢复在线状态。\n\
  \n### 动态主机配置协议 (DHCP)\nDHCP 客户端用于从 DHCP 服务器请求主机配置信息的协议。请求的信息包括 IP 地址、子网掩码、默认路由器等。\n\
  \n### 动态重配置\n一种系统能力，通过允许系统在不重启的情况下识别新的硬件（甚至软件）配置来支持热插。\n\n### 企业级卷管理器 (Enterprise\
  \ Volume Manager)\n一种虚拟磁盘管理系统。除了支持磁盘镜像和多种 RAID 配置外，它还提供统计和动态调优功能。\n\n### /etc 文件\n\
  Unix 系统提供的原始名称服务。其他系统的信息存储在 `/etc` 目录下的文件中。\n\n### 以太网地址\n网络接口的唯一 48 位数据链路层地址。也称为硬件地址、物理地址或媒体访问控制\
  \ (MAC) 地址。\n\n### 联邦命名服务 (FNS)\n一种符合 X/Open 联邦命名规范 (XFN) 的名称服务。\n\n### 文件\n一组被视为单元的字节，用于存储、检索和操作。\n\
  \n### 文件服务器\n一种用于提供对共享或公共数据远程访问的独立网络系统。\n\n## 文件系统\n包含在分区中的文件和目录的逻辑集合。在将文件系统设置为可用（挂载）、检查和修复时，它可以可以被视为一个单一实体。\n\
  \n## 组账户\n用于管理用户账户集合的唯一名称和关联的组 ID。\n\n### 组 ID (GID)\n分配给组账户的唯一数字 ID，用于组所有权和权限。\n\
  \n### 主机\n一种为本地和/或远程登录的用户提供资源的计算机系统。\n\n### 热插 (hot plugging)\n一种硬件能力，允许在不关闭系统的情况下更改系统组件。\n\
  \n### 热迁移 (hot relocation)\n卷管理器用于在备用磁盘或磁盘组内的空空间上重建故障的子磁盘，然后用重建的子磁盘替换故障的子磁盘的过程。\n\
  \n### 热备盘 (hot spare)\n\n\n\n\n`DiskSuite` 自动替换故障分区的磁盘分区。\n\n### 热备池 (hot spare\
  \ pool)\n由 `DiskSuite` 管理的热备驱动器集合。\n\n### 间接映射 (indirect map)\n一种 AutoFS 配置文件，用于识别指向挂载点的部分路径以及相关的\
  \ NFS 资源。这些部分路径相对于 `/etc/auto-master` 文件中指定的目录。\n\n### 初始化文件模板 (initialization file\
  \ templates)\n创建用户账户主目录时，会从 `/etc/skel` 目录下的模板拷贝每个用户的登录和 shell 启动初始化文件。\n\n### 初始化文件\
  \ (initialization files)\n每个用户主目录都关联多个初始化文件。这些文件用于指定在相关事件发生时执行的命令。根据使用的登录 shell，可能有登录初始化文件、shell\
  \ 启动文件或注销文件。登录初始化文件中的命令在用户登录时执行。所有常用的 shell 都提供登录初始化文件。shell 启动文件中的命令在登录用户启动 shell\
  \ 时都会执行。`csh` 和 `ksh` 都提供此功能。`ENV` 参数用于定义 `ksh` shell 启动初始化文件。只有 `csh` 提供在用户注销时自动执行命令的文件。\n\
  \n### 安装客户端 (install client)\n将通过网络进行安装的系统。有关安装客户端的基本信息需要通过名称服务（`NIS`/NIS+）或在安装服务器或启动服务器上\
  \ `/etc` 目录下的文件可用。\n\n### 安装服务器 (install server)\n一种网络服务器，在网络安装过程中，为安装客户端安装 Solaris\
  \ 操作系统提供必要的发行文件。这些文件可以直接从挂载在本地 CD-ROM 驱动器的 Solaris 发行版 CD 或从本地硬盘提供。\n\n### 安装 (installation)\n\
  四种安装方法为 `SunInstall`、`WebStart`、`JumpStart` 和 `Custom JumpStart`。这四种方法都可以本地 CD-ROM\
  \ 或网络安装资源来获取发行文件。安装过程分为三个阶段：系统配置、系统安装和安装后处理。\n\n### JumpStart\n一种自动化安装过程，它基于系统架构和硬件的标准配置来确定要安装的系统配置。\n\
  \n### JumpStart 配置目录 (JumpStart configuration directory)\n包含用于自定义 JumpStart 安装的文件的目录。它为相似系统组提供了自动化完成安装系统配置阶段的方法。该目录可以位于软磁盘上（称为\
  \ `profile diskette`），也可以位于网络服务器上（称为 `profile server`）。JumpStart 目录中的两种基本类型文件是规则文件和一个或多个配置文件。\n\
  \n### 内核 (kernel)\n管理计算机物理和逻辑资源的软件集合。这些管理服务包括控制内存和其他存储设备的分配、控制外围设备（输入/输出）的访问以及控制进程或任务的调度和执行。内核是操作系统三个部分之一（其他部分是\
  \ shell 和文件系统）。\n\n### 内核模块 (kernel modules)\n分为相关功能组的内核软件。某些模块是操作系统小型通用核心的一部分，某些模块提供特定平台的操作，其他模块是设备驱动程序。这种架构允许根据所需功能包含或排除内核部分，或者在不替换整个内核的情况下更新内核部分。设备驱动程序在访问设备时加载。\n\
  \n### Korn shell (Korn shell)\n由 AT&T Bell 实验室的 David Korn 开发的 Unix shell 版本，称为\
  \ `ksh`。它结合了 Bourne shell 和 C shell 的优良特性。\n\n### 轻量级目录访问协议 (LDAP)\n许多供应商用于提供访问目录服务的常用协议。\n\
  \n### 本地主机 (localhost)\n本地系统的环回 IP 地址；通常为 `127.0.0.1`，可以是任何以 `127` 开头的地址。\n\n###\
  \ 逻辑设备名称 (logical device name)\n一种用于标识磁盘、磁带和 CD-ROM 设备的命名规范，并提供原始访问（一次一个字符）或块访问（通过缓冲区访问大块数据）。所有逻辑设备名称都位于\
  \ `/dev` 目录下，`/dev/dsk` 子目录将设备标识为块磁盘设备（`/dev/rdsk` 子目录指示为原始磁盘）。\n\n### m4 宏 (m4\
  \ macro)\n一种用于控制条件语句执行的解释型命令语法。\n\n### 手册页 (man page)\nSolaris 8 系统参考手册中的页面，用于描述命令、系统调用、库例、文件格式等。\n\
  \n### 强制锁定 (mandatory locking)\n一种特殊的文件权限，防止程序在另一个程序打开该文件时读取或写入该文件。\n\n### 内存管理\
  \ (memory management)\n一种跟踪可用内存、根据需要将其分配给进程并在进程释放或终止时回收这些内存的方法。\n\n### 元设备 (metadevice)\n\
  `DiskSuite` 用于管理物理磁盘的基础虚拟磁盘。\n\n### 镜像 (mirroring)\n将正在写入一个在线设备的数据复制到另一个离线设备的技术。镜像提供了数据的实时备份，当原始设备故障时，可以将其恢复在线状态以替换原始设备。通常，两块磁盘共享同一个控制器。\n\
  \n### 挂载点 (mount point)\n挂载文件系统中的目录，作为另一个文件系统的访问点。\n\n### 挂载 (mounting)\n将文件系统或\
  \ NFS 资源与目录（挂载点）关联的过程，以便用户和程序可以访问它。\n\n### 多任务处理 (multitasking)\n一次执行多个一个进程或任务的能力。\n\
  \n### 多用户 (multiuser)\n系统支持多个并发用户的能力。\n\n### 名称服务 (name service)\n一种网络服务，为用户和系统跨网络通信所需的信息提供中心化位置。名称服务不仅存储信息，还提供了管理和访问这些信息的机制。\n\
  \n### 名称服务切换 (name service switch)\n用于选择使用哪些名称服务以及使用顺序的配置文件。\n\n### 命名空间 (namespace)\n\
  关于名称服务网域内系统的信息集合。\n\n### 网络客户端 (network client)\n包含很少或没有本地存储空间的系统。启动和运行所需的某些或所有文件通过网络远程访问。\n\
  \n### 网络文件系统 (NFS)\n一种网络服务和文件系统类型。该服务允许本地存储（如文件系统）通过网络被其他系统访问。NFS 协议第 3 版由 `RFC\
  \ 1813` 定义。\n\n### 网络信息服务 (NIS)\n一种将信息存储在映射中并向请求这些这些信息的 NIS 客户端提供服务的名称服务。\n\n###\
  \ 网络信息服务增强 (NIS+)\nNIS 的增强版本，将信息存储在表中。使用身份验证和授权提供安全性。\n\n### 非易失性随机访问存储器 (NVRAM)\n\
  用于存储 OpenBoot 参数的内存区域，该区域不受系统掉电或重启的影响。\n\n### 开放系统互连模型 (OSI network model)\n由国际标准组织\
  \ (ISO) 开发的网络模型，由七层服务组成。每层负责处理网络通信的不同方面。\n\n### Open 窗口 (Open Windows)\n一种图形化用户界面。\n\
  \n### OpenBoot\nSun 系统的标准固件。OpenBoot 用于启动操作系统、运行诊断以及修改存储在非易失性内存 (NVRAM) 中的启动相关参数。\n\
  \n\n\n\n提供 Forth 解释器。OpenBoot 固件仅适用于 SPARC 平台，但在 Intel x86 平台上也提供有限的功能。\n\n### 操作系统发行版本\n\
  操作系统的版本，例如 Solaris 的 7 或 8。\n\n### 操作系统 (OS) 服务器\n为网络客户端提供按需访问操作系统文件权限的网络服务器。\n\n\
  ### 操作系统 (OS) 服务\n支持特定网络客户端的一组文件。OS 服务是根据平台、系统架构和操作系统发行版本的组合进行标识和配置的。\n\n## 网络安装\n\
  可以使用安装服务器通过网络安装 Solaris，该服务器的 `CD-ROM` 驱动器中带有 Solaris 发行版光盘，或者其硬盘上有 Solaris 发行版光盘文件的副本。可能还需要一个引导服务器。\n\
  \n### 分区\n由分区表定义的连续磁盘扇区集合。一旦在分区表中定义了分区，就可以在该分区内创建文件系统。\n\n### 分区表\nVTOC（卷卷表）中的一个表，包含磁盘上每个分区的条目。\n\
  \n### 密码年龄\n`/etc/shadow` 文件的参数决定了密码年龄策略。这些参数强制执行某项以保护密码完整性的策略。\n\n### 设设备部件部件 (PCI)\n\
  一种基于插槽和卡的总线机制，用于将视频适配器、网卡、声卡等连接到计算机系统。\n\n### 平台\n特定的硬件类型——SPARC 或 Intel x86 兼容。\n\
  \n### plex\n一组组织的卷管理器（Volume Manager）子磁盘集合，用于支持各种级别的 RAID。\n\n### 安装后阶段\n安装过程中的阶段，在此阶段安装任何补丁和应用程序，并设置用户账户和环境等自定义配置。\n\
  \n### 预配置系统信息\n有两种方法可以预配置系统信息：使用 `sysidcfg` 文件和使用名服务。\n\n### 特权操作\n一种 Solaris 命令，执行时将其\
  \ UID 和/或 GID 设置为适当的值，以允许正常操作。\n\n### 进程\n当前由计算机系统执行的任务或程序。\n\n### 配置文件（基于角色的访问控制）\n\
  用于向角色分配授权和/或特权操作机制。\n\n### 配置文件软磁盘\n包含 JumpStart 配置目录的软磁盘；即一个规则文件和一个或多个配置文件。\n\n\
  ### 配置文件\n一个定义如何在系统上安装 Solaris 8 软件的文本文件。与规则文件一样，配置文件包含引导安装的关键字和关联值。\n\n### 配置文件服务器\n\
  提供通过网络访问自定义 JumpStart 配置目录的服务器，消除了在安装大量系统时创建和分发多个软磁盘的需要。\n\n### 伪文件系统\n一种基于内存的文件系统。\n\
  \n### RAID\n冗余磁盘阵列（Redundant Array of Inexpensive Disks）。\n\n### 远程认证数据库\n用于确定哪些远程主机和用户被认为是信任。`rlogin`、`rsh`\
  \ 和 `rcp` 命令使用远程认证数据库。该数据库由两种类型的文件组成：适用于整个系统的 `/etc/host.equiv` 文件，以及适用于单个用户账户并位于用户账户主目录下的\
  \ `.rhosts` 文件。\n\n### 远程过程调用 (RPC)\n一种允许客户端请求远程服务器执行某个过程或进程的机制。\n\n### 征求意见 (RFC)\n\
  用于发布与网络相关的策略和协议的文档，以便相关方可以提交意见并建议更改。一段时间后，RFC 可能会被美国政府和行业采用为标准。TCP/IP 和 NFS 等协议已由\
  \ RFC 定义。\n\n### 反向地址解析协议 (RARP)\n一种用于从以太地址映射到 IP 地址的协议。\n\n### 角色\n基于角色的访问控制机制提供的特殊类型用户账户，用于授予一组超级用户权限以执行某些管理任务。\n\
  \n### 基于角色的访问控制 (RBAC)\n一种用于根据执行任务的需求向账户授予特权操作或命令访问的机制。\n\n### 规则文件\n一个文本文件，其中每个要自动安装的系统或系统组都有一个条目或规则。每条规则根据一个或多个属性标识系统（或系统组），并标识一个为该系统或系统组提供配置细节的唯一配置文件。每条规则由一个或多个关键字和值组成，随后是配置文件名。\n\
  \n### 运行控制 (rc) 脚本\n用于启动和停止各种进程和服务的脚本（通常为 Bourne）。rc 脚本通常由两部分组成：启动部分和停止部分。当系统启动或关闭时，执行相应的部分。\n\
  \n### 服务器\n为远程客户端提供资源的计算机系统。\n\n### setgid\n一种特殊的文件访问模式，将执行程序的用户账户的有效 GID 设置为该程序组所有者的\
  \ GID。setgid 权限的绝对模式为 2000，符号模式为 `s`。\n\n### setuid\n一种特殊的文件访问模式，将执行程序的用户账户的有效 UID\
  \ 设置为该程序所有者的 UID。setuid 权限的绝对模式为 4000，符号模式为 `s`。\n\n### SGML\n标准通用标记语言，用于提供一种通用的文档内容编码方法，而不将其与特定格式关联。见\
  \ Bourne shell。\n\n### share\n将 NFS 资源开放以供远程 NFS 客户端挂载的过程。\n\n### 终端\n一个提供用户与内核之间接口的软件模块。操作系统的三个部分之一（另外两个部分是内核和文件系统）。\n\
  \n### 信号发送给进程的通知，用于指示应执行的事件或操作。信号可用于终止进程。\n\n### 切片\n见分区。\n\n### 小型计算机系统接口 (SCSI)\n\
  一种基于总线的外部设备连接机制，通常用于磁盘驱动器和磁带驱动器。\n\n### 软件集群\n软件包的逻辑分组。之所以需要软件集群，是因为某些软件分布在多个包中，但所有包需要作为一个单元进行分发和安装。\n\
  \n### 软件配置集群\n见软件组。\n\n### 软件组\n软件集群的集合。根据系统的预期用途，应选择最合适的软件组来安装操作系统。\n\n### 软件包\n\
  一个易于安装的 Solaris 8 系统和应用程序软件集合。这些软件包由文件和目录组成，可以作为单个压缩文件从 `CD-ROM` 或磁带拷贝到系统上，然后解压进行安装。软件包中还包含有关软件包的信息，如其标题、存储要求和版本。还包含了妥善安装软件所需的任何自定义脚本。\n\
  \n### 软件补丁\n一个易于安装的文件和目录集合，旨在更新或修复已安装软件包的问题。\n\n### SPARC\n由太阳微系统（Sun Microsystems）开发的计算机体系。它使用精简指令集处理器，比使用标准指令集运行的处理器具有卓越的性能。\n\
  \n### 独立系统\n使用本地磁盘空间存储所有操作系统文件、应用程序和用户数据的系统，包括根目录 `/`、`/usr`、`/export/home` 和 `/var`\
  \ 文件系统。同样，独立系统为系统的虚拟内存提供本地交换分区。独立系统可以自主运行，可以是联网或非联网的。\n\n\n\n\n# sticky bit (粘位)\n\
  一种特殊的文件权限。当它设置在一个对所有人开放写权限的目录上时，仅允许创建该目录下文件和子目录的用户账户删除这些文件和子目录。粘位对于任何用户都可以访问的 `/tmp`\
  \ 目录特别有用。粘位权限的绝对模式为 `1000`，符号模式为 `t`。\n\n# striped virtual device (条带化虚拟设备)\n由两个或多个分区（slices）组成的设备。这些分区位于同一块物理磁盘上，也可以位于若干块物理磁盘上。分区的大小也可以不同。它们以交错的方式进行寻址。也就是说，当需要空间时，会先从第一个分区分配一个块，然后从第二个分区分配一个块，以此此类推。\n\
  \n# subdisk (子磁盘)\n`Volume Manager` 用于分配存储的基本单位。子磁盘是 `VM` 磁盘公共区域的一部分。\n\n# SunInstall\n\
  一个交互式 Open Windows 安装程序，可用于安装 Solaris 8 软件，但不支持捆绑软件的安装。\n\n# superuser (超级用户)\n\
  特殊的管理员账户，在数据和服务的访问方面提供最高权限，因为它可以覆盖系统上的任何文件权限。\n\n# swap space (交换空间)\n作为虚拟内存使用的磁盘空间。交换空间可以位于本地磁盘上，也可以位于通过网络访问的远程磁盘。\n\
  \n# syslog (系统日志)\n用于收集系统程序和应用程序消息的设施。这些消息通过源设施（source facility）和优先级进行标识。`/etc/syslog.conf`\
  \ 文件为每种源和优先级的组合分配一个操作。\n\n# syslog actions (syslog 操作)\n当 `syslogd` 守护进程接收到标识为 `source.priority`\
  \ 的 syslog 消息应执行的操作。\n\n# syslog priority levels (syslog 优先级)\nsyslog 消息可以通过优先级或严重性识别。这种识别为根据重要性处理消息提供了另一种机制（粒度更精细）。\n\
  \n# syslog source facilities (syslog 源设施)\n生成 syslog 消息的设施可用于确定消息发送或存储的位置。这样做可以根据源为不同类型的消息创建独立的日志文件。\n\
  \n# system configuration phase (系统配置阶段)\n安装过程中的一个阶段，在此识别系统的基本信息，如主机名和域名。这些信息可以选择性提前设置或预配置。\n\
  \n# system installation phase (系统安装阶段)\n安装过程中的一个阶段，在此安装系统软件。系统软件是 Solaris 8 软件组之一。\n\
  \n# system profile (系统配置文件)\n对于使用 `sh` (Bourne shell) 或 `ksh` (Korn shell) 作为登录\
  \ shell 的账户，系统配置文件（`/etc/profile`）中的命令会在用户的登录初始化文件之前执行。\n\n# system run levels (系统运行级别)\n\
  定义的八级别，每个级别与特定功能相关，用于关闭或重启系统并控制系统服务和资源。\n\n# Transmission Control Protocol/Internet\
  \ Protocol (TCP/IP) network model\n一种由五层服务组成的网络模型。每层都负责处理网络通信的不同方面。\n\n# UFS file\
  \ system logging (UFS 文件系统日志)\nUFS 文件系统的更新在应用之前会记录在日志中。在系统故障的情况下，系统可以重启，并且 UFS 文件系统可以快速使用日志，而无需使用\
  \ `fsck` 命令。\n\n# user account (用户账户)\n用于控制个人访问计算机及其资源的唯一名称和用户 ID。\n\n# user ID\
  \ (UID) (用户 ID)\n分配给用户账户的唯一数字 ID，用于文件和进程的所有权及访问权限。\n\n# Veritas File System (vxfs)\
  \ (Veritas 文件系统)\n`Enterprise Volume Manager` 支持的虚拟文件系统类型。\n\n# virtual disk management\
  \ system (虚拟磁盘管理系统)\n允许以标准 Solaris 文件系统不支持的方式使用物理磁盘软件包。它可以克服磁盘容量和架构限制，提高性能和可靠性。此外，通过使用图形化管理工具增强了管理性。\n\
  \n# virtual file system (虚拟文件系统)\n提供更高性能和数据可靠性的增强型文件系统。\n\n# volume (卷)\n由多达 32\
  \ 个 plex 组成的 `Enterprise Volume Manager` 虚拟磁盘设备。卷是操作系统和应用程序查看和操作的虚拟对象。\n\n# Volume\
  \ Manager (VM) disk (卷管理器磁盘)\n分配给 `Enterprise Volume Manager` 的物理磁盘分区或分区。\n\n# volume\
  \ table of contents (VTOC) (卷表)\n包含分区表和关于磁盘的各种几何数据，如每磁道的扇区数、每个柱道的轨道等。\n\n# WebNFS\n\
  一种允许 Web 浏览器访问 NFS 资源的协议。该协议由 `RFCs 2054` 和 `2055` 定义。\n\n# Web Start\n一种使用 Web\
  \ 浏览器界面的交互式安装方法。\n\n# x86 Intel compatible (x86 Intel 兼容)\n一种基于最初由 Intel 设计微处理器的计算机架构。\n\
