  \ `mount` 命令挂载并像访问其他文件系统一样访问。`umount` 命令也用于卸载磁盘盘或。\n\n\n\n\nCD-ROM。然而，在 Solaris\
  \ 环境中，通过使用*卷管理 (Volume Management)*挂载这些类型的介质变得更加简单。卷管理提供了自动挂载可移动卷（软磁盘和 CD-ROM）的功能。此服务由卷管理守护进程\
  \ `vold`(1M) 提供。默认情况下，`vold` 是启用的。\n\n## 使用 CD-ROM\n\n当将 CD-ROM 插入 CD-ROM 驱动器时，`vold`\
  \ 程序会识别格式正确的 CD-ROM 并自动将其挂载到 `/cdrom` 目录下。首个 CD-ROM 挂载在 `/cdrom/cdrom0`，第二个挂载在 `/cdrom/cdrom1`，依此类推。如果\
  \ CD-ROM 经过分区（通常是这样的），每个切片（slice）或分区都会被挂载。例如，如果 CD-ROM 卷包含六个切片（`s0` 到 `s5`），则每个切片都会挂载（`/cdrom/cdrom0/s0`\
  \ 到 `/cdrom/cdrom0/s5`）。挂载后，这些分区可以像其他只读磁盘驱动器一样使用。\n\n当不再需要 CD-ROM 时，可以使用 `eject\
  \ cdrom` 命令自动卸载与其相关的分区并从驱动器弹出 CD-ROM。如果挂载了多个 CD-ROM，你需要指定挂载点：例如，`eject cdrom0`。更多详情请参见\
  \ `eject`(1) 手页。\n\n## 使用软磁盘\n\n与 CD-ROM 不同，软磁盘不会被 `vold` 程序自动挂载。相反，你可以使用 `volcheck`(1)\
  \ 命令指示 `vold` 扫描所有软磁盘驱动器并挂载找到的所有磁盘。软磁盘挂载在 `/floppy` 目录下。首个软磁盘挂载在 `/floppy/floppy0`，第二个挂载在\
  \ `/floppy/floppy1`，依此类推。挂载后，软磁盘可以像任何（小容量）读写磁盘驱动器一样使用。\n\n当不再需要软磁盘时，可以使用不带命令行参数的\
  \ `eject` 命令将其卸载。或者，如果挂载了多个软磁盘，提供挂载点的名称作为命令行参数：例如，`eject floppy0`。\n\n## 监控文件系统使用情况\n\
  \n可以使用多个命令来监控文件系统使用情况。这些命令是 `df`(1)、`du`(1) 和 `quot`(1M)。\n\n`df` 命令（不带命令行参数）会显示每个文件系统的挂载点、逻辑块设备名称、空闲\
  \ 512 字节块的数量以及该文件系统可以创建的文件数。（`-k` 命令行参数以 1,024 字节块或千字节列出大小，而不是 512 字节块）。该命令也可显示文件系统占用的磁盘空间。以下列表了\
  \ `df` 命令的用法：\n\n```\n# df\n/proc (/proc ): 0 blocks 948 files\n/ (/dev/dsk/c0d0s0\
  \ ): 56098 blocks 35834 files\n/usr (/dev/dsk/c0d0s6 ): 181578 blocks 168053 files\n\
  /var (/dev/dsk/c0d0s3 ): 307080 blocks 147835 files\n/export/home (/dev/dsk/c0d0s7\
  \ ): 1854626 blocks 488828 files\n/opt (/dev/dsk/c0d0s5 ): 15272 blocks 109653 files\n\
  /tmp (swap ): 311360 blocks 9985 files\n/usr2 (/dev/dsk/c0d1s7 ): 2039566 blocks\
  \ 256508 files\n#\n```\n\n`du` 命令列出分配给每个子目录的 512 字节块数以及当前目录的总和。几个常用的命令行参数包括：`-a`\
  \ 列出所有非目录文件，`-k` 以 1,024 字节块（千字节）列出大小而非 512 字节块，以及 `-s` 仅报告指定文件的总和。以下列表使用 `du` 命令确定分配给\
  \ `/etc/openwin` 目录及其内容的存储空间大小：\n\n```\n# cd /etc/openwin\n# du\n4 ./etc/devdata/SUNWaccel/monitors/pnp\n\
  6 ./etc/devdata/SUNWaccel/monitors\n8 ./etc/devdata/SUNWaccel\n10 ./etc/devdata\n\
  12 ./etc\n10 ./server/etc\n12 ./server\n2 ./devdata/profiles\n4 ./devdata\n30 .\n\
  #\n```\n\n`quot` 命令列出每个用户拥有的文件系统的 1,024 字节块数。你必须指定文件系统（挂载点）或 `-a`（所有已挂载的文件系统）作为命令行参数。另一个有用的命令行参数是\
  \ `-f`，它会在可用空间之外显示文件数量。以下列表了 `quot` 命令：\n\n```\n# quot /export/home\n```\n\n## 文件和目录概念\n\
