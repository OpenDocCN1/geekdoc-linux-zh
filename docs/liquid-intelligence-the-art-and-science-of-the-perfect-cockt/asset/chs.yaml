  \ device”的错误了）。\n\n让我们提供用户实际文本的清理版本：\n*完整设备路径*通过列出由斜杠分隔的*节点名称*来根据其在设备树中的位置标识设备；根由斜杠开头。完整设备路径中的每个节点名称具有以下格式：\n\
  \n`driver-name`@ *unit-address*: *device arguments*\n\n`driver-name` 表示设备名称，`@ unit-address`\
  \ 是父节点地址空间中的设备物理地址，`:device arguments` 定义了关于设备的额外信息。例如，以下设备地址表示 SPARC 系统上的一个分区：\n\
  \n```\n/dev/scsi/c0t0d0\n```\n`driver-name` 表示设备名称，`@ unit-address` 是父节点地址空间中的设备物理地址，`:device\
  \ arguments` 定义了关于设备的额外信息。（等等，用户的文本有重复的“device device”，我将忽略重复并保留句子）。\n\n### 实例名称\n\
  \n实例名称是映射到或与物理设备名称关联的缩写名称。这些名称允许快速方便地识别设备，而无需使用长且通常复杂的物理设备名称。实例名称通常\n\n\n\n\n由一个短的驱动程序绑定名称（例如\
  \ `sd`）以及一个实例号组成。例如，`sd0` 可能是第一个 SCSI 磁盘的实例名称，而 `fd0` 可能是第一个软驱驱动器的实例名称。\n\n你使用 `/etc/path_to_inst`\
  \ 文件将物理设备名称（也称为全设备路径名）与实例名称进行映射。当你使用 `touch /reconfigure` 命令或 `boot -r` 命令重新配置系统时，该文件会自动重建。`/etc/path_to_inst`\
  \ 文件的格式由三个用制表符分隔的字段组成。这些字段的描述见表 8.1。\n\n### 表 8.1：`/etc/path_to_inst` 文件的字段\n\n\
  | 字段 | 描述 |\n| :--- | :--- |\n| 物理名称 | 全物理设备名称或全路径设备名称 166 |\n| 实例号 | 唯一数字（通常从 0\
  \ 开始） |\n| 驱动程序绑定名称 | 分配给设备驱动程序的名称 |\n\n以下列表显示了 x86 Solaris 8 操作系统的 `/etc/path_to_inst`\
  \ 文件。每个字段之间的制表符已被替换为适当数量的空格以提高可读性：\n\n```\n\"/pci@0,0\" 0 \"pci\"\n\"/pci@0,0/pci-ide@0,1\"\
  \ 0 \"pci-ide\"\n\"/pci@0,0/pci-ide@0,1/ide@1\" 1 \"ata\"\n\"/pci@0,0/pci-ide@0,1/ide@1/sd@1,0\"\
  \ 0 \"sd\"\n\"/pci@0,0/pci-ide@0,1/ide@1/st@1,0\" 0 \"st\"\n\"/pci@0,0/pci-ide@0,1/ide@0\"\
  \ 0 \"ata\"\n\"/pci@0,0/pci-ide@0,1/ide@0/cmdk@1,0\" 1 \"cmdk\"\n\"/pci@0,0/pci-ide@0,1/ide@0/cmdk@0,0\"\
  \ 0 \"cmdk\"\n\"/pci@0,0/pci1039,1@2\" 0 \"pci_pci\"\n\"/pci@0,0/pci1039,1@2/display@0\"\
  \ 1 \"vgatext\"\n\"/pci@0,0/display@a\" 0 \"vgatext\"\n\"/isa\" 0 \"isa\"\n\"/isa/lp@1,378\"\
  \ 0 \"lp\"\n\"/isa/i8042@1,60\" 0 \"i8042\"\n\"/isa/i8042@1,60/keyboard@0\" 0 \"\
  kb8042\"\n\"/isa/i8042@1,60/mouse@1\" 0 \"mouse8042\"\n\"/isa/pnpTCM,5090@pnpTCM,5090,240c3297\"\
  \ 0 \"elx\"\n\"/isa/asy@1,3f8\" 0 \"asy\"\n\"/isa/fdc@1,3f0\" 0 \"fdc\"\n\"/isa/fdc@1,3f0/fd@0,1\"\
  \ 1 \"fd\"\n\"/isa/fdc@1,3f0/fd@0,0\" 0 \"fd\"\n\"/options\" 0 \"options\"\n\"/objmgr\"\
  \ 0 \"objmgr\"\n\"/pseudo\" 0 \"pseudo\"\n```\n\n### devfsadm 和 devfsadmd 命令\n\n\
  `devfsadm`(1M) 命令及其守护进程版本 `devfsadmd`(1M) 用于维护 `/dev/` 和 `/devices` 目录。随着设备驱动程序加载到内核，`devfsadm`\
  \ 程序会创建相应的 `/devices` 特殊文件和 `/dev` 链接以提供对设备的访问。`devfsadmd` 程序在系统启动的后期启动，并处理支持重新配置和热插拔（动态重新配置）活动所需的任何\
  \ `/devices` 和 `/dev` 修改。`devfsadm` 还维护 `path_to_inst` 文件。可以使用 `devfsadm` 命令根据需要手动管理\
  \ `/dev` 和 `/devices` 文件。\n\n### 确定磁盘设备名称\n\n你可以使用几个命令来识别磁盘设备名称。它们包括：\n\n- `df`(1M)\n\
  - `dmesg`(1M)\n- `format`(1M)\n- `mount`(1M)\n- `prtconf`(1M)\n- `sysdef`(1M)\n\n\
  更多信息请参阅每个命令相应的系统参考手册页。\n\n### df 命令\n\n`df` 命令按文件系统的基础列出空闲块（可用存储空间）和文件（可以创建的额外文件数量）。系统使用逻辑块磁盘设备名称标识，如下列表所示：\n\
  \n```\n# df\n/ (/dev/dsk/c0d0s0 ): 28658862 blocks 1862425 files\n/boot (/dev/dsk/c0d0p0:boot):\
  \ 17722 blocks -1 files\n/proc (/proc ): 0 blocks 1868 files\n/dev/fd (fd ): 0 blocks\
  \ 0 files\n/etc/mnttab (mnttab ): 0 blocks 0 files\n/var/run (swap ): 1135576 blocks\
  \ 21076 files\n/tmp (swap ): 1135576 blocks 21076 files\n/export/home (/dev/dsk/c0d0s7\
  \ ): 384784 blocks 98147 files\n```\n\n### dmesg 命令\n\n`dmesg` 命令收集并显示来自 syslog（通常为\
  \ `/var/adm/messages`）的诊断消息。这些消息在系统启动期间生成，并使用实例名称（以及物理名称）识别设备。以下列表显示了 `dmesg` 命令的部分输出：\n\
  \n```\n# dmesg\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\nApr 3 21:39:05 solaris8 genunix:\nSunOS Release 5.8 Version Generic_108529-01\
  \ 32-bit\n```\n\n### format 命令\n\n`format` 命令用于格式化磁盘。注意，在 `format` 命令的情况下，磁盘选择如下：\n\
  \n```\n# format\nSearching for disks...\n0: /dev/dsk/c0d0\n```\n\n### mount 命令\n\
  \n`mount` 命令列出挂载的文件系统。文件系统使用逻辑块磁盘设备名称标识，如下列表所示：\n\n```\n# mount\n/ (/dev/dsk/c0d0s0\
  \ ): 28658862 blocks 1862425 files\n/boot (/dev/dsk/c0d0p0:boot): 17722 blocks -1\
  \ files\n/proc (/proc ): 0 blocks 1868 files\n/dev/fd (fd ): 0 blocks 0 files\n\
  /etc/mnttab (mnttab ): 0 blocks 0 files\n/var/run (swap ): 1135576 blocks 21076\
  \ files\n/tmp (swap ): 1135576 blocks 21076 files\n/export/home (/dev/dsk/c0d0s7\
  \ ): 384784 blocks 98147 files\n```\n\n### prtconf 命令\n\n`prtconf` 命令显示系统配置。设备使用驱动程序绑定名称和实例号识别，这些构成了实例名称。以下列表显示了\
  \ x86 Solaris 8 系统上的 `prtconf` 命令输出：\n\n```\n# prtconf\nSystem Configuration: Sun\
  \ Microsystems i86pc\nMemory size: 128 Megabytes\nSystem Peripherals (Software Nodes):\n\
  i86pc\n+boot (driver not attached)\nmemory (driver not attached)\naliases (driver\
  \ not attached)\nchosen (driver not attached)\ni86pc-memory (driver not attached)\n\
  i86pc-mmu (driver not attached)\nopenprom (driver not attached)\noptions, instance\
  \ #0\npackages (driver not attached)\ndelayed-writes (driver not attached)\nitu-props\
  \ (driver not attached)\n```\n\n### sysdef 命令\n\n`sysdef` 命令显示系统配置或定义，列出了所有硬件设备，包括伪设备和系统设备、可加载模块以及可调内核参数。与\
  \ `prtconf` 命令一样，`sysdef` 使用驱动程序绑定名称和实例号识别设备，这些构成了实例名称。以下列表显示了 `sysdef` 命令的部分输出：\n\
  \n```\n# sysdef\n*\n* Hostid\n*\n3093740b\n*\n* i86pc Configuration\n*\n*\n* Devices\n\
  *\n+boot (driver not attached)\nmemory (driver not attached)\naliases (driver not\
  \ attached)\nchosen (driver not attached)\n```\n\n\n\n\n通常，添加、删除或替换 `SCSI` 驱动器和\
  \ `PCI 适配器卡` 等系统组件需要关闭系统、更换组件，并在下次系统启动时重新配置系统。*热插拔*（Hot-plugging）允许你在不关闭系统的情况下更改此类硬件系统组件*动态重配置*（Dynamic\
  \ reconfiguration）通过允许系统识别新的硬件（甚至是软件）配置来支持热插拔。\n\n并非所有的 SCSI 和 PCI 设备都支持热插拔。这是支持高可用计算机配置的最新代系统组件及其相关设备的特性。还需要记住，并非所有支持热插拔的设备都被\
  \ Solaris 环境。请检查 Solaris 8 Sun Platform Guide 或 Solaris 8 (Intel Platform Edition)\
  \ 硬件兼容性列表，获取 Solaris 8 操作系统支持的热插拔设备列表。\n\n`cfgadm(1M)` 命令提供了 Solaris 8 环境下的动态重配置能力。你可以使用此命令来更改系统组件配置、测试系统组件并显示系统组件状态。`cfgadm`\
  \ 命令支持在 SPARC 和 Intel 兼容平台上的热插拔 SCSI 设备，以及 Intel 兼容平台上的 PCI 适配器卡。\n\n系统中支持热插拔并需要动态重配置的组件被称为*接入点*（attachment\
  \ points）。一个接入点由一个*占用者*（occupant，可以添加到或从系统中移除设备）和一个*接收器*（receptacle，接受占用者的插槽或连接器）组成。接收器有三种状态：\n\
  \n* *空（Empty）—*无占用者。\n* *断开（Disconnected）—*占用者与系统隔离（通常用于测试占用者或占用者未配置时）。\n* *已连接（Connected）—*占用者已配置且系统可用（这是正常状态）。\n\
  \n占用者通常处于未配置状态或已配置状态。已配置是正常的操作状态。\n\n接入点（接收器和占用者）的整体状态可以是 `ok`、故障中（failing）、失败（failed）、不可用（unusable）或未知（unknown）。接入点的状态是在运行过程中发生错误或为识别和隔离故障组件而运行诊断测试的结果。\n\
  \n### 热插拔 SCSI 控制器和设备\n\n`cfgadm` 命令显示有关热插拔配置的信息、连接和断开 SCSI 控制器，并配置或取消配置 SCSI 设备。\n\
  \n接入点使用*接入点 ID*（AP_Ids）表示。例如，SCSI 控制器使用 `c0` 和 `c1` 等 ID 表示。连接到控制器 `c1` 的 SCSI 设备如\
  \ `/dev/dsk/c1t3d0` 的 `AP_Id` 为 `c1::dsk/c1t3d0`，而连接到控制器 `c0` 的磁带机 `/dev/rmt/0`\
  \ 的 `AP_Id` 为 `c0::rmt/0`。有关接入点 ID 的更多信息，请参阅 `cfgadm(1M)` 手页。\n\n你可以使用 `-al` 命令行参数显示\
  \ SCSI 控制器和设备的信息。以下 `cfgadm` 命令显示这些信息：\n\n```bash\ncfgadm -al\n```\n\n| AP_Id |\
  \ Type | Receptacle | Occupant | Condition |\n|---|---|---|---|---|\n| c0 | scsi-bus\
  \ | connected | configured | unknown |\n| c0::rmt/0 | tape | connected | configured\
  \ | unknown |\n| c1 | scsi-bus | connected | configured | unknown |\n| c1::dsk/c1t3d0\
  \ | disk | connected | configured | unknown |\n\n你可以使用 `cfgadm -c disconnect AP_Id`\
  \ 命令断开 SCSI 控制器。例如，要断开 `c1` 控制器，使用以下命令：\n\n```bash\ncfgadm -c disconnect c1\n```\n\
  \n同样，要连接 `c1` 控制器，使用以下命令：\n\n```bash\ncfgadm -c connect c1\n```\n\n添加 SCSI 设备（如磁盘）需要\
  \ `cfgadm -x insert_device AP_Id` 命令。例如，在 SPARC 系统上向 `c0` 控制器添加磁盘，使用此命令：\n\n```bash\n\
  cfgadm -x insert_device c0\n```\nAdding device to SCSI HBA: /devices/sbus@1f,0/SUNW:fas@0,880000\n\
  This operation will suspend activity on SCSI bus: c0\nContinue (yes/no)? y\nSCSI\
  \ bus quiesced successfully.\nIt is now safe to proceed with hotplug operation.\n\
  Enter y if operation is complete or n to abort (yes/no)? y\n\n你可以根据需要使用类似的 `cfgadm`\
  \ 命令替换（`cfgadm -x replace_device AP_Id`）、删除（`cfgadm -x remove_device AP_Id`）、配置（`cfgadm\
  \ -c configure AP_Id`）或取消配置（`cfgadm -c unconfigure AP_Id`）SCSI 设备。此外，可以使用 `cfgadm\
  \ -t AP_Id` 命令对接入点进行诊断测试。\n\n### 热插拔 PCI 适配器卡\n\n`cfgadm` 命令显示有关热插拔配置、连接、断开、配置和取消配置\
  \ PCI 适配器卡的信息。\n\nPCI 设备的接入点 ID（AP_Ids）基于 PCI 总线和槽位。例如，PCI 总线 1 的槽位 0 的 `AP_Id`\
  \ 为 `pci1:hpc0_slot0`。有关接入点 ID 的更多信息，请参阅 `cfgadm(1M)` 手页。\n\n`cfgadm` 命令（不带任何命令行参数）显示\
  \ PCI 设备的信息。你可以使用以下 `cfgadm` 命令显示这些信息：\n\n```bash\ncfgadm\n```\n\n| AP_Id | Type\
  \ | Receptacle | Occupant | Condition |\n|---|---|---|---|---|\n| pci1:hpc0_slot0\
  \ | unknown | empty | unconfigured | unknown |\n| pci1:hpc0_slot1 | ethernet | connected\
  \ | configured | ok |\n| pci1:hpc0_slot2 | unknown | empty | unconfigured | unknown\
  \ |\n| pci1:hpc0_slot3 | unknown | empty | unconfigured | unknown |\n\n你可以根据需要断开（`cfgadm\
  \ -c disconnect AP_Id`）、连接（`cfgadm -c connect AP_Id`）、配置（`cfgadm -c configure AP_Id`）或取消配置（`cfgadm\
  \ -c unconfigure AP_Id`）PCI 设备。此外，可以使用 `cfgadm -t AP_Id` 命令对接入点进行诊断测试。\n\n### 分区\n\
  \nSolaris 8 操作系统要求驱动器支持逻辑结构以便使用其存储空间。逻辑结构由一个小的*磁盘标签*（也称为卷索引 VTOC）组成，磁盘其余部分被划分为*切片*或分区。一旦定义了分区，就可以在该分区创建文件系统。与文件系统关联的物理和逻辑设备名称实际上是其所在分区的名称。\n\
  \n### 磁盘标签或 VTOC\n\n磁盘标签或 VTOC 包含关于磁盘的各种几何数据，例如每道扇区、每磁道轨道、可用磁道等。此外，磁盘标签包含*分区表*。\n\
  \n### 分区\n\n分区（或磁盘切片）是分区表定义的连续扇区集合。一旦在分区表中定义了分区，就可以在该分区创建文件系统。分区表包含磁盘上每个分区的条目。表\
  \ 8.2 描述了分区表的字段。\n\n\n\n\n\n...分区标签。\n\n表 8.3：分区标签。\n\n| 分区类型 | 标签值 |\n| :--- |\
  \ :--- |\n| unassigned (未分配) | 0 |\n| boot (启动) | 1 |\n| root (根) | 2 |\n| swap\
  \ (交换) | 3 |\n| usr (用户) | 4 |\n| backup (备份) | 5 |\n| stand (备用) | 6 |\n| var (变量)\
  \ | 7 |\n| home (用户) | 8 |\n| altsctr | 9 |\n| cache (缓存) | a |\n\n你可以使用 `format`\
  \ 命令或 `fmthard(1M)` 命令创建分区表。\n\n要显示分区表，请使用 `format` 命令或 `prtvtoc(1M)` 命令。\n\n一旦分区表填充了适当的信息（已定义了磁盘分区），就可以就可以分区内创建文件系统；然而，并不是所有的分区都用于存储文件系统。\n\
  \n### 使用 format 命令对磁盘进行分区\n\n你可以使用 `format` 命令来创建或修改分区表。选择磁盘后，会显示格式菜单（Format Menu）。从该菜单中，选择\
  \ Partition（分区）以显示分区菜单，如下所示：\n\n分区菜单：\n```\n0 - change '0' partition\n1 - change\
  \ '1' partition\n2 - change '2' partition\n3 - change '3' partition\n4 - change\
  \ '4' partition\n5 - change '5' partition\n6 - change '6' partition\n7 - change\
  \ '7' partition\nselect - 选择预定义的表\nmodify - 修改预定义的分区表\nname - 命名当前表\nprint - 显示当前表\n\
  label - 将分区映射和标签写入磁盘\n!<cmd> - 执行 <cmd>，然后返回\nquit\n```\n\n要修改现有分区，请选择分区编号（0 到 7），然后输入标签、标志位、起始磁道以及以字节或磁道为单位的分区大小。可以选择并使用预定义的表。或者，你可以使用现有的分区表作为起点来创建自定义表。要保存自定义表，请选择格式菜单中的\
  \ Save 选项。\n\n### 使用 prtvtoc 命令显示 VTOC\n\n`prtvtoc` 命令显示物理磁盘驱动器的 VTOC（卷表表）。除了显示分区表外，它还会显示磁盘几何结构。以下列表显示了\
  \ x86 IDE 磁盘驱动器 `prtvtoc` 命令的输出：\n\n```\n# prtvtoc /dev/rdsk/c0d0s0\n# prtvtoc /dev/rdsk/c0d0s0\n\
  * /dev/rdsk/c0d0s0 partition map\n*\n* Dimensions:\n* 512 bytes/sector\n* 63 sectors/track\n\
  * 16 tracks/cylinder\n* 1008 sectors/cylinder\n* 38769 cylinders\n* 38767 accessible\
  \ cylinders\n*\n* Flags:\n* 1: unmountable (不可挂载)\n* 10: read-only (只读)\n*\n* Unallocated\
  \ space:\n* First Sector Last\n* Sector Count Sector\n* 32183424 6893712 39077135\n\
  *\n* First Sector Last\n* Partition Tag Flags Sector Count Sector Mount Directory\n\
  0 2 00 1052352 30720816 31773167 /\n1 3 01 3024 1049328 1052351\n2 5 00 0 39078144\
  \ 39078143\n7 8 00 31773168 410256 32183423 /export/home\n8 1 01 0 1008 1007\n9\
  \ 9 01 1008 2016 3023\n#\n```\n\n### format 命令\n\n`format(1M)` 命令支持对磁盘驱动器进行格式化、分析、修复、标记和分区。`format`\
  \ 命令提供了一个交互式菜单，可以从中选择子命令和子菜单。表 8.4 描述了这些 `format` 子命令和子菜单。\n\n表 8.4：format 命令的子命令和子菜单。\n\
  \n| 子命令或子菜单 | 描述 |\n| :--- | :--- |\n| **disk** | 选择磁盘 |\n| **type** | 定义磁盘类型 |\n\
  | **partition** | 为所选磁盘创建/修改分区表（子菜单） |\n| **current** | 显示所选磁盘的信息 |\n| **format**\
  \ | 格式化并分析所选磁盘 |\n| **fdisk** | 为所选磁盘运行 `fdisk(1M)` 程序（仅兼容 Intel） |\n| **repair**\
  \ | 修复所选磁盘上的缺陷扇区 |\n| **show** | 翻译磁盘地址（仅兼容 Intel） |\n| **label** | 向所选磁盘写入标签 |\n\
  | **analyze** | 对所选磁盘进行表面分析（子菜单） |\n| **defect** | 显示所选磁盘的缺陷列表（子菜单） |\n| **backup**\
  \ | 搜索备份标签 |\n| **verify** | 显示所选磁盘的标签 |\n| **save** | 保存新的磁盘/分区定义 |\n| **inquiry**\
  \ | 显示所选磁盘的厂商、型号和版本（仅限 SPARC） |\n| **volname** | 为所选磁盘定义一个八字符的卷名 |\n| **! *cmd***\
  \ | 使用用户的 shell 执行 `cmd`，然后返回 `format` 命令 |\n| **Quit** | 退出 `format` 命令 |\n\n当\
  \ `format` 命令启动时，它会列出可用磁盘驱动器，你可以选择其中一个。`format>` 字符串作为命令提示符。\n\n以下列表显示了启动 `format`\
  \ 命令：\n\n```\n# format\nSearching for disks…done\nAVAILABLE DISK SELECTIONS:\n0.\
  \ c0d0 <DEFAULT cyl 38767 alt 2 hd 16 sec 63>\n/pci@0,0/pci-ide@0,1/ide@0/cmdk@0,0\n\
  1. c0d1 <DEFAULT cyl 1019 alt 2 hd 255 sec 63>\n/pci@0,0/pci-ide@0,1/ide@0/cmdk@1,0\n\
  Specify disk (enter its number): 0\nselecting c0d0\nController working list found\n\
  [disk formatted, defect list found]\nWarning: Current Disk has mounted partitions.\n\
  \nFORMAT MENU:\n1 - disk\n2 - type\n3 - partition\n4 - current\n5 - format\n6 -\
  \ fdisk\n7 - repair\n8 - show\n9 - label\n10 - analyze\n11 - defect\n12 - backup\n\
  13 - verify\n14 - save\n15 - inquiry\n16 - volname\n17 - ! *cmd*\n18 - quit\n```\n\
  \n考试警报：`format` 命令的基本理解和通用用法是一个测试目标。请熟悉 `format` 子命令、子菜单及其预期用途。\n\n```\n# format\n\
  Searching for disks…done\nAVAILABLE DISK SELECTIONS:\n0. c0d0 <DEFAULT cyl 38767\
