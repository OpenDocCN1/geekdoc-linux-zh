  \n（注：此处原文内容与前文重复，已按要求保留翻译逻辑）\n\n## 文件和目录概念\n\n（注：此处原文内容与前文重复，已按要求保留翻译逻辑）\n\n###\
  \ 文件类型\n\n`du` 命令列出分配给每个子目录的 512 字节块数以及当前目录的总和。几个常用的命令行参数包括：`-a` 列出所有非目录文件，`-k`\
  \ 以 1,024 字节块（千字节）列出大小而非 512 字节块，以及 `-s` 仅报告指定文件的总和。以下列表使用 `du` 命令确定分配给 `/etc/openwin`\
  \ 目录及其内容的存储空间大小：\n\n（注：代码块已保留）\n\n### 文件类型表格\n\n| 类型 | 描述 |\n| :--- | :--- |\n|\
  \ Regular | 普通文件。用于数据和可执行文件。 |\n| `d` | 目录。用于组织文件。 |\n| `b` | 块型设备设备。通常位于 `/dev`。\
  \ |\n| `c` | 字符型设备设备。通常位于 `/dev`。 |\n| `l` | 符号链接。文件或目录的另一种路径。 |\n| `D` | 门：远程过程调用\
  \ (RPC) 机制。 |\n| `p` | 先优先或命名管道数据结构。 |\n| `s` | 网络 (AF_UNIX) 套接字结构。 |\n\n### 链接类型\n\
  \n如前所述，文件和目录被*链接*到目录中。此链接存储在目录中的一个项，并提供了定位和访问文件或目录的引用。\n\n该目录项实际上是文件或目录在文件系统内部位置的指针，被称为*硬链接*。因为链接根据其在文件系统中的位置指向文件或目录，所以链接无法指向不同文件系统的文件或目录。因此，硬链接意味着文件或目录位于当前文件系统中。\n\
  \n*软链接*或*符号链接*提供了一种引用另一个文件系统中文件或目录的机制。目录项不是指向文件系统中的位置，而是另一个文件或目录的完整路径名称。使用符号链接允许你在不同文件系统中创建指向同一文件或目录的多个路径和文件名。\n\
  \n\n\n\n\n你可以使用 `link`(1M) 和 `ln`(1) 命令创建硬链接。然而，只有 `ln` 命令可以用于创建符号链接（使用 `-s` 命令行参数）。`unlink`(1M)\
  \ 命令用于删除硬链接或软链接。当指向某个文件或目录的所有硬链接都被删除时，该文件或目录将被移除。你也可以使用 `rm`(1) 和 `rmdir`(1) 命令来删除硬链接或软链接。\n\
  \n## 文件和目录压缩\n\n对目录和文件进行压缩可以减少磁盘驱动器上的空间，更重要的是，可以减少磁带和光介质等备份设备上的空间。Solaris 支持三种实用程序来压缩和解压（即扩展）数据：\n\
  \n* `compress`(1) 和 `uncompress`(1)\n* `gzip`(1) 和 `gunzip`(1)\n* `zip`(1) 和 `unzip`(1)\n\
  \n### The compress and uncompress Commands\n\n`compress` 命令使用自适应 Lempel-Ziv 编码算法来压缩作为命令行参数指定的一个或多个文件（用空格分隔）。使用\
  \ `compress` 命令压缩的文件将被赋予 `.Z` 扩展名。你可以使用 `uncompress` 命令解压文件，并将文件名作为命令行参数（用空格分隔）。请注意，`compress`\
  \ 命令只能用于普通文件，且每个文件都是单独压缩的。下面的列表显示了这些命令用法：\n\n```bash\n# ls -l\ntotal 3\n-rw-r—r—\
  \ 1 root other 103306 Apr 6 02:27 file4\n# compress file4\n# ls -l\ntotal 3\n-rw-r—r—\
  \ 1 root other 41280 Apr 6 02:27 file4.Z\n# uncompress file4\n# ls -l\ntotal 3\n\
  -rw-r—r— 1 root other 103306 Apr 6 02:27 file4\n```\n\n你可以使用 `zcat`(1) 命令查看用 `compress`\
  \ 命令压缩的文件内容。然而，`zcat` 命令不会像 `uncompress` 命令那样生成解压后的文件或删除压缩文件。\n\n### The gzip and\
  \ gunzip Commands\n\n`gzip` 命令使用自适应 Lempel-Ziv 编码 (LZ77) 算法来压缩作为命令行参数指定的一个或多个文件（用空格分隔）。使用\
  \ `gzip` 命令压缩的文件将被赋予 `.gz` 扩展名。你可以使用 `gunzip` 命令解压文件，并将文件名作为命令行参数（用空格分隔）。请注意，`gzip`\
  \ 命令只能用于普通文件，且每个文件都是单独压缩的。下面的列表显示了这些命令用法：\n\n```bash\n# ls -l\ntotal 3\n-rw-r—r—\
  \ 1 root other 103306 Apr 6 02:27 file4\n# gzip file4\n# ls -l\ntotal 70\n-rw-r—r—\
  \ 1 root other 32757 Apr 6 02:27 file4.gz\n# gunzip file4\n# ls -l\n-rw-r—r— 1 root\
  \ other 103306 Apr 6 02:27 file4\n```\n\n你可以使用 `gzcat`(1) 命令查看由 `gzip` 命令压缩的文件内容。然而，`gzcat`\
  \ 命令不会像 `gunzip` 命令那样生成解压后的文件或删除压缩文件。\n\n### The zip and unzip Commands\n\n`zip`\
  \ 命令将作为命令行参数指定的一个或多个文件和/目录压缩成单个归包。由 `zip` 命令创建的归包将被赋予 `.zip` 扩展名。你可以使用 `unzip` 命令解压归包，并将归包作为命令行参数。下面的列表显示了这些命令用法：\n\
  \n```bash\n# ls -lR\ntotal 2\ndrwxr-xr-x 2 root other 512 Apr 6 03:15 dir1\n./dir1:\n\
  total 296\n-rw-r—r— 1 root other 27 Apr 6 03:04 file1\n-rw-r—r— 1 root other 389\
  \ Apr 6 03:04 file2\n-rw-r—— 1 root other 34341 Apr 6 03:04 file3\n-rw-r—r— 1 root\
  \ other 103306 Apr 6 03:04 file4\n# zip dir1.zip dir1/*\nadding: dir1/file1 (deflated\
  \ 33%)\nadding: dir1/file2 (deflated 59%)\nadding: dir1/file3 (deflated 68%)\nadding:\
  \ dir1/file4 (deflated 68%)\n# rm -r dir1\n# ls -l\ntotal 88\n-rw-r—r— 1 root other\
  \ 44284 Apr 6 03:15 dir1.zip\n# unzip dir1.zip\nArchive: dir1.zip\ninflating: dir1/file1\n\
  inflating: dir1/file2\ninflating: dir1/file3\ninflating: dir1/file4\n```\n\n## Backing\
  \ Up and Restoring\n\n你可以使用 `mt` 命令进行备份和恢复。`mt` 命令用于控制磁带操作，将磁带移动到数据集的开始、重置磁带并擦除。\n\
  \n### The mt Command\n\n`mt`(1) 命令用于控制磁带操作。`mt` 命令用于控制磁带操作，将磁带移动到数据集的开始、重置磁带并擦除。\n\
  \n| Command | Description |\n| :--- | :--- |\n| `asf *count*` | 在 `count` 个块后定位\
  \ |\n| `bsf *count*` | 向后跳过 `count` 个 EOF 标记 |\n| `bsr *count*` | 向后跳过 `count` 个记录\
  \ |\n| `eof *count*` | 写入 `count` 个 EOF 标记 |\n| `erase` | 擦除整个磁带 |\n| `fsf *count*`\
  \ |向前跳过 `count` 个 EOF 标记 |\n| `fsr *count*` | 向前跳过 `count` 个记录 |\n| `rewind` | 重置磁带\
  \ |\n| `status` | 显示磁带状态 |\n\n如果没有在 `-f` 命令行参数后指定原始磁带设备，则假设 `/dev/rmt/0`。下面的列表将磁带移动到第五个数据集（即跳过四个\
  \ EOF 标记）：\n\n```bash\n# mt -f /dev/rmt/0 fsf 4\n```\n\n### The ufsdump and ufsrestore\
  \ Commands\n\n`ufsdump`(1M) 和 `ufsrestore`(1M) 命令用于备份和恢复 UFS 文件系统或指定的文件/目录。这些命令可以执行增量备份和恢复。\n\
  \n文件系统命令提供了多个命令行参数。大部分与更改备份介质的默认特性有关。表 9.7 列出了 `ufsdump` 命令更重要的命令行参数。\n\n| Argument\
  \ | Description |\n| :--- | :--- |\n| `0` 到 `9` | 备份级别（0 为整个文件系统） |\n| `a *archive_file*`\
  \ | 使用 `archive_file` 存储备份表 |\n| `c` | 使用盒带代替标准的半英寸卷带 |\n| `f *dump_file*` | 使用\
  \ `dump_file` 代替 `/dev/rmt/0` |\n| `u` | 在 `/etc/dumpdates` 中记录备份级别和日期 |\n| `v`\
  \ | 备份后验证备份介质 |\n\n你将这些单字符参数组合指定，随后是文件（`archive_file`、`dump_file` 等），顺序与单字符参数相同。除了适当的命令行参数外，你必须指定要备份的文件（通常是文件系统的逻辑原始设备名）。\n\
  \n**Exam Alert:** 为了确保备份可用，在执行备份之前，文件系统应当卸载，或者系统应处于单用户运行级别。\n\n\n\n\n\n如果没有指定除文件以外的命令行参数进行转储，默认值为\
  \ `/dev/rmt/0` 上的 `9uf`。此命令使用 `/dev/rmt/0` 作为转储文件创建一个级别 9 的备份，并将备份记录在 `/etc/dumpdates`\
  \ 文件中。\n\n203\n\n备份级别决定了哪些文件被备份。如果指定为 `0`，则备份整个文件系统；否则，将备份自使用较低数字备份级别备份以来已更改的所有文件。下行使用\
  \ `ufsdump` 将由逻辑原始设备名称 `/dev/rdsk/c0t1d0s5` 标识的整个文件系统备份到默认磁带设备（`/dev/rmt/0`）。备份将经过验证：\n\
  \n```\n# ufsdump 0vu /dev/rdsk/c0t1d0s5\n```\n\n# 使用 ufsrestore 命令恢复文件系统\n\n`ufsrestore`\
  \ 命令用于恢复使用 `ufsdump` 命令备份的文件系统。与 `ufsdump` 命令一样，`ufsrestore` 命令支持 `-f dump_file`\
  \ 命令行参数，用于识别包含备份的介质。如果未指定此参数，则默认使用 `/dev/rmt/0` 设备。下行使用 `ufsrestore` 命令从 `/dev/rmt/1`\
  \ 设备恢复文件系统备份到当前目录：\n\n```\n# ufsrestore f /dev/rmt/1\n```\n\n`ufsrestore` 命令还支持交互式恢复能力，通过使用\
  \ `-i` 命令行参数启用。\n\n# 使用 ufsrestore 命令恢复选文件\n\n你可以使用 `ufsrestore` 命令的提取（`-x`）命令行参数从备份中恢复选定的文件，而不是整个文件系统。要从备份中恢复的文件或目录也作为命令行参数列在\
  \ `ufsrestore` 命令中。下行从 `/dev/rmt/1` 设备上的根文件系统备份中提取 `/etc/passwd` 文件和 `/etc/default`\
  \ 目录（及其内容），并将它们恢复到 `/etc` 目录：\n\n```\n# ufsrestore xf /dev/rmt/1 /etc/passwd /etc/default\n\
  ```\n\n# tar 命令\n\n`tar`(1) 命令创建磁带存档，并从存档中添加或提取文件。表 9.8 列出了 `tar` 命令的五个基本功能。\n\n\
  表 9.8：tar 功能。\n\n| 功能 | 描述 |\n| :--- | :--- |\n| **c** | 创建（覆盖）磁带存档 |\n| **r** |\
  \ 替换磁带存档中的命名文件 |\n| **t** | 列出磁带存档中的文件 |\n| **u** | 更新磁带存档中的命名文件 |\n| **x** | 从磁带存档中提取所有命名文件\
  \ |\n\n204\n\n除了这些功能外，`-f tar_file` 命令行参数指定备份设备。如果不使用此命令行参数，则使用 `TAPE` 环境变量指定的备份设备或在\
  \ `/etc/default/tar` 文件中标识的备份设备。要备份的文件或目录列在功能和参数之后的命令行参数中。你可以使用 `-v` 选项在文件被添加到存档或从存档中提取时显示其名称。\n\
  \n在某些情况下，使用 `tar` 命令创建目录和文件的单一存档，其存档占用的空间将比所有原始文件和目录更少。因此，使用 `tar` 命令可以减少存储空间需求。\n\
  \n# 使用 tar 命令备份目录\n\n下行使用 `tar` 命令将 `/export/home` 目录备份到 `/dev/rmt/0` 磁带驱动：\n\n\
  ```\n# tar cf /dev/rmt/0 /export/home\n```\n\n# 使用 tar 命令恢复目录\n\n下行使用 `tar` 命令从\
  \ `/dev/rmt/0` 磁带驱动恢复 `/export/home` 目录：\n\n```\n# tar xf /dev/rmt/0 /export/home\n\
  ```\n\n# cpio 命令\n\n你也可以使用 `cpio`(1) 命令创建目录和文件的存档。`cpio` 命令以三种模式运行：\n\n- *拷贝出（`-o`\
  \ 命令行参数）*——读取目录和文件名列表，然后将其内容和控制信息复制到存档格式\n- *拷贝入（`-i` 命令行参数）*——读取存档以提取目录和文件，并在系统的指定位置重新创建它们\n\
  - *通过模式（`-p` 命令行参数）*——读取目录/文件列表（同其内容），并在系统的指定位置重现它们\n\n205\n\n表 9.9 列出了最常用的 `cpio`\
  \ 命令行参数。详情请参见 `cpio`(1) 手册页。\n\n表 9.9：选定的 cpio 命令行参数。\n\n| 参数 | 描述 |\n| :--- | :---\
  \ |\n| **-a** | 重置文件访问时间（与 `-i` 使用） |\n| **-A** | 追加到存档（与 `-o` 使用） |\n| **-d** |\
  \ 根据需要创建目录（与 `-i` 和 `-p` 使用） |\n| **-i** | 拷贝入（从存档中提取） |\n| **-I file** | 读取 `file`\
  \ 的内容作为输入存档（与 `-i` 使用） |\n| **-L** | 跟随符号链接（与 `-o` 使用） |\n| **-m** | 保留修改时间（与 `-i`\
  \ 和 `-p` 使用） |\n| **-o** | 拷贝出（创建存档） |\n| **-O file** | 使用 `file` 作为输出存档（与 `-o`\
  \ 使用） |\n| **-p** | 通过 |\n| **-t** | 打印存档内容；创建文件（与 `-i` 使用） |\n| **-u** | 无条件拷贝文件；旧文件将覆盖新文件（与\
  \ `-i` 和 `-p` 使用） |\n| **-v** | 打印文件名（详细模式） |\n\n下行显示了 `cpio` 命令的一些典型。第一个 `cpio`\
  \ 命令使用 `ls` 命令的输出生成要放入命名存档的文件列表。第二个 `cpio` 命令出存档内容。第三个 `cpio` 命令从存档提取文件：\n\n```\n\
  # ls\nfile1 file2 file4\n\n# ls | cpio -ov archive\n# cpio -ivt archive\n# cpio\
  \ -um archive\n```\n\n206\n\n# find 命令\n\n你可以使用 `find`(1) 命令生成特定目录的文件列表（或符合指定标准的文件列表）。`find`\
  \ 命令与 `cpio` 命令结合时特别有用。\n\n至少需要一个命令行参数：目录名称。默认情况下，该目录及其所有文件都会被列出。`find` 命令提供了多种命令行参数。表\
  \ 9.10 列出了一些有用的。\n\n表 9.10：选定的 find 命令行参数。\n\n| 参数 | 描述 |\n| :--- | :--- |\n| **-atime\
  \ n** | 列出在 `n` 天前访问的或在 `+n` 天后访问的文件 |\n| **-ctime n** | 列出状态在 `n` 天前更改的或在 `+n`\
  \ 天后更改的文件 |\n| **-exec cmd** | 对每个列出的文件执行 `cmd` |\n| **-group grp** | 列出属于组名或 GID\
  \ `grp` 的文件 |\n| **-mtime n** | 列出在 `n` 天前修改的或在 `+n` 天后修改的文件 |\n| **-name pattern**\
  \ | 列出名称匹配 `pattern` 的文件 |\n| **-newer file** | 列出比 `file` 更新的文件 |\n| **-print**\
  \ | 打印选定的文件（即使未指定也始终为） |\n| **-type c** | 列出指定类型的文件（`b` 块、`c` 字符、`d` 目录、`D` 门、`f`\
  \ 文件、`l` 链接、`p` 管道或 `s` 套接字） |\n| **-user usr** | 列出由用户名或 UID `usr` 拥有的文件 |\n\n\
  为了让 `find` 命令更加强大（且更难以理解），这些命令行\n\n\n\n\n可以使用 `and` (`-a`) 和 `or` (`-o`) 运算符将参数组合成复杂的表达式。\n\
  \n例如，表达式 `-type p -a -user dla` 将导致 `find` 只列出用户账户 dla 拥有的普通（普通）文件。\n\n下方的列出使用 `find`\
  \ 命令生成文件列表。第一个 `find` 命令列出 `/export/home/sarah` 目录下的所有文件。此文件列表用于生成 `sarah.cpio`\
  \ 归包。第二个 `cpio` 命令列出 `/etc` 下在过去两天内修改过的文件。重复相同的命令并将其作为 `cpio` 命令的输入，以创建 `etc.cpio`\
  \ 归包：\n\n```\n# find /export/home/sarah | cpio -o -O sarah.cpio\n```\n544 块\n\n\
  ```\n# find /etc -mtime -2\n```\n/etc/saf/zsmon/_pmpipe\n/etc/saf/_sacpipe\n/etc/mnttab\n\
  /etc/utmppipe\n\n```\n# find /etc/ -mtime -2 | cpio -o -O etc.cpio\n```\n16 块\n\n\
  #\n\n# 恢复根目录或 /usr 文件系统\n\n偶尔，根目录或 `/usr` 文件系统需要恢复。假设文件系统已经备份且备份可用，可以使用以下步骤：\n\n\
  1. 选择一个可用的分区，或者如果需要额外的硬件，请在系统中安装新磁盘，然后对其进行格式化并创建一个大小适当的分区。\n2. 使用 `newfs` 命令或其他命令（如\
  \ `mkfs` 命令）创建文件系统。\n208 \n3. 将新文件系统挂载到临时挂载点。切换到该临时挂载点。\n4. 使用 `ufsrestore` 命令将根或\
  \ `/usr` 备份还原到新文件系统。\n5. 删除由 `ufsrestore` 命令创建的 `restsymtable` 文件。\n6. 卸载新文件系统。\n\
  7. 使用 `fsck` 命令检查新文件系统。修改 `/etc/vfstab` 以识别新的根或 `/usr` 分区。\n8. 如果你正在恢复根文件系统，请使用\
  \ `installboot(1M)` 命令在新文件系统上创建启动块。\n9. 重启系统。\n\n### 练习题\n\n### 问题 1\n\n以下哪些项可以使用\
  \ `ufsdump` 命令进行备份？[选择所有适用项]\n\na. 硬盘上的文件系统\nb. 硬盘上的文件\nc. CD-ROM 上的文件系统\nd. 硬盘上的目录\n\
  \n答案 a、b 和 d 是正确的。你可以使用 `ufsdump` 命令备份硬盘上的文件系统、文件和目录。CD-ROM 上的文件系统不是 UFS 文件系统，无法使用\
  \ `ufsdump` 命令备份。因此，答案 c 是错误的。\n\n### 问题 2\n\n输入可用于指示卷管理器守护进程（Volume Manager daemon）挂载磁盘的命令。\n\
  \n正确答案是 `volcheck`。\n\n## 问题 3\n\n使用哪个命令行参数来禁用对大于 2GB 文件的支持？\n\na. `-o no2gfiles`\n\
  b. `-o nobigfiles`\n209\nc. `-o largefiles`\nd. `-o nolargefiles`\n\n答案 d 是正确的。`-o\
  \ nolargefiles` 命令行参数禁用了对大于 2GB 文件的支持。`-o no2gfiles` 和 `-o nobigfiles` 不是有效的命令行参数。因此，答案\
  \ a 和 b 是错误的。`-o largefiles` 将启用（而非禁用）大文件支持。因此，答案 c 是错误的。\n\n## 问题 4\n\n以下哪个文件系统通常用于用户可访问的命令？\n\
  \na. root\nb. `/usr`\nc. `/var`\nd. `/home`\n\n答案 b 是正确的。`/usr` 文件系统通常用于系统命令。根文件系统用于内核和设备驱动程序。因此，答案\
  \ a 是错误的。`/var` 文件系统用于日志记录和打印（spooling）。因此，答案 c 是错误的。`/home` 文件系统用于用户主目录。因此，答案 d\
  \ 是错误的。\n\n## 问题 5\n\n以下哪些命令可以创建 UFS 文件系统？\n\na. `newfs /dev/rdsk/c0d1s7`\nb. `mkfs\
  \ -t UFS /dev/rdsk/c0d1s7`\nc. `newfs /dev/dsk/c0d1s7`\nd. `newfs /dev/dsk/c0t1d1s7`\n\
  \n答案 a 是正确的。`newfs /dev/rdsk/c0d1s7` 创建一个 UFS 文件系统。指定 UFS 文件系统的正确命令行参数是 `-F`。因此，答案\
  \ b 是错误的。`newfs /dev/dsk/c0d1s7` 和 `newfs /dev/dsk/c0t1d1s7` 使用的是物理设备。\n\n## 问题\
  \ 6\n\n以下哪些命令使用逻辑设备名？[选择所有适用项]\n\n210\na. `mount`\nb. `umount`\nc. `fsck`\nd. `newfs`\n\
  \n答案 a 和 b 是正确的。`mount` 和 `umount` 使用逻辑设备。`fsck` 和 `newfs` 使用的是物理设备名。\n\n## 问题 7\n\
  \n以下哪些文件系统类型通常可以使用 `mount` 命令进行挂载？[选择所有适用项]\n\na. UDF\nb. UFS\nc. TMPFS\nd. HSFS\n\
  \n答案 a、b、c 和 d 是正确的。UDF、UFS、TMPFS 和 HSFS 都可以挂载。\n\n## 问题 8\n\n以下哪些 `tar` 命令可以用于备份\
  \ `/etc` 目录？\n\na. `tar -cvf /etc`\nb. `tar cvf /etc`\nc. `tar -cvf-etc`\nd. `tar\
  \ -cvf /etc/`\n\n答案 a 是正确的。`tar -cvf /etc` 可以备份 `/etc` 目录。正确的参数顺序是。因此，答案 b 是错误的。因此，c\
  \ 和 d 是错误的。\n\n## 问题 9\n\n`fsck` 命令可以执行哪些功能？[选择所有适用项]\n\na. 挂载文件系统\nb. 修复文件系统\n\
  c. 检查损坏\nd. 显示每个用户空间\n\n答案 b 和 c 是正确的。`fsck` 命令可以修复文件系统并检查损坏。挂载文件系统是 `mount` 和 `umount`\
  \ 命令的功能。因此，答案 a 是错误的。显示每个用户空间是命令的功能。因此，答案 d 是错误的。\n\n## 问题 10\n\n关于命令 `find / -mtime\
  \ +7 | cpio -o -O 7days.cpio`，以下哪个叙述正确？\n\na. / 目录下所有修改时间大于 7 天的文件和目录将用于创建 7days.cpio\
  \ 归包。\nb. / 目录下修改时间大于 7 天的文件将用于创建 7days.cpio 归包。\nc. 该命令因为 `find` 的参数错误而失败。\nd.\
  \ / 目录下所有修改时间小于等于 7 天的文件和目录将用于创建 7days.cpio 归包。\ne. 该命令因为 `cpio` 的参数错误而失败。\n\n答案\
  \ a 是正确的。/ 目录下所有修改时间大于 7 天的文件和目录将用于创建 7days.cpio 归包。指定的 `find` 命令也会列出目录。因此，答案 b\
  \ 是错误的。`find` 或 `cpio` 的命令行参数都没有问题。因此，答案 c 和 e 是错误的。`-mtime` 命令行参数数字前的加号 (+) 意味着*更多；*减号\
  \ (-) 则意味着*更少*。因此，答案 d 是错误的。\n\n\n\n\n`compress` 和 `gzip` 命令一次只能压缩单个文件（不支持目录）。\n\
  \n因此，答案 a 和 c 是错误的。\n\n### 第 12 题\n哪个文件包含了在系统启动期间或使用 `mountall` 命令时需要挂载的文件系统列表？\n\
  \na. `/etc/vfstab`\nb. `/etc/default/fs`\nc. `/etc/mnttab`\nd. `/etc/autofs`\n\n\
  答案 a 是正确的。`/etc/vfstab` 文件系统包含了在系统启动或使用 `mountall` 时需要挂载的文件系统列表。`/etc/default/fs`\
  \ 包含默认的文件系统类型。因此，答案 b 是错误的。`/etc/mnttab` 包含当前已挂载的文件系统列表。因此，答案 c 是错误的。答案 `/etc/autofs`\
  \ 不存在。因此，答案 d 是错误的。\n\n### 第 13 题\n哪些命令可以用于加载到设备 `/dev/rmt/0n` 的磁带在重绕后定位到第三个数据集？[请选择所有适用项]\n\
  \na. `mt -f /dev/rmt/0n fsf 2`\nb. `mt fsf 2`\nc. `mt -f /dev/rmt/0n fsf 3`\nd.\
  \ `mt fsf 3`\ne. `mt asf 3`\n\n答案 a、b 和 e 是正确的。`mt -f /dev/rmt/0n fsf 2`、`mt fsf\
  \ 2` 和 `mt asf 3` 命令可以将加载到设备 `/dev/rmt/0n` 的磁带在重绕后定位到第三个数据集。`mt -f /dev/rmt/0n fsf\
  \ 3` 和 `mt fsf 3` 命令会将磁带定位到第四个数据集的开头。因此，答案 c 和 d 是错误的。\n\n### 第 14 题\n以下哪项可用于跨文件系统链接文件？\n\
  \na. 硬链接 (Hard)\nb. 符号链接 (Symbolic)\nc. 字符特殊 (Character special)\nd. 门 (Door)\n\n\
  答案 b 是正确的。符号链接可以用于跨文件系统链接文件。硬链接根据文件在当前磁盘上的位置引用文件，因此无法引用另一个磁盘上的文件。因此，答案 a 是错误的。字符特殊和门是文件类型，而不是链接。因此，答案\
  \ c 和 d 是错误的。\n\n### 需要了解更多吗？\nMulligan, John P., *Solaris 8 Essential Reference*\
  \ (Riders, Indianapolis, IN, 2001), ISBN 0-7357-1007-4.\n\nSun Microsystems, *System\
  \ Administration Guide, Volume* 1. 提供打印版（部件号 805-7228-10）、可在 Web 端 `docs.sun.com`\
  \ 获取，以及随 Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\nSun Microsystems, *System Reference\
  \ Manual, Section 1 - User Command* s. 提供打印版（部件号 806-0624-10），可在 Web 端 `docs.sun.com`\
  \ 获取，以及随 Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\nSun Microsystems, *System Reference\
  \ Manual, Section 1M - Administration Command* s. 提供打印版（部件号 806-0625-10），可在 Web\
  \ 端 `docs.sun.com` 获取，以及随 Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\n214\n第 10 章：系统基础\n\
  \n**你需要理解的术语：**\n* 目录树\n* 元字符\n* 绝对路径和相对路径\n\n**你需要掌握的技巧：**\n* 使用绝对路径和相对路径在目录树中导航\n\
  * 使用元字符选择目录和文件\n* 创建和删除目录\n* 创建、拷贝、重命名和删除文件\n* 使用 `vi` 编辑器\n* 在系统之间传输数据\n* 在远程系统上执行程序\n\
  \n本章涵盖了一些系统基础，包括导航 Unix 目录树、使用 `vi` 编辑器以及访问远程系统。本章涵盖了*基本命令语法*、*编辑器*和*远程连接*测试目标。\n\
  \n### Unix 目录树\nUnix 数据存储设施是包含文件和其他目录的目录集合。这些文件和目录按照分级结构组织，以根目录（`/`）为起点。因此，Unix\
  \ 数据存储以倒置树的形式组织，其中目录作为分支，文件作为叶子。\n\n### 元字符\n元字符是字符或字符组合，可以用于表示目录名或文件名的全部或部分。元字符允许用一个短语表示较长的目录/文件名，甚至是一系列目录/文件名。三种标准\
  \ shell（Bourne、C 和 Korn）支持表 10.1 中列出的元字符。\n\n表 10.1：目录/文件名元字符。\n\n| 元字符 | 描述 |\n\
  | :--- | :--- |\n| `?` | 匹配任意单个字符。 |\n| `*****` | 匹配任意字符零次或多次出现。 |\n| `[...]` |\
  \ 表示字符集，其中任意一个字符都可以进行匹配。常用的字符集可以表示为范围。例如，小写字母（`[a-z]`）、大写字母（`[A-Z]`）和数字（`[0-9]`）经常被使用。\
  \ |\n\n示例将很好地说明元字符的使用。给定一组从 `filea`, `fileb` 到 `filez` 的文件，你可以指定以下元字符表达式作为 `ls`\
  \ 命令的参数，以表示所有 26 个文件：\n\n```bash\nls file[abcdefghijklmnopqrstuvwxzy]\nls file[a-ef-jk-op-tu-z]\n\
  ls file[a-mn-z]\nls file[a-z]\nls file*\nls file?\n```\n\n因此，元字符可以用于引用具有共同前缀或共同后缀的文件。例如，给定一组以\
  \ `.c` 结尾的 C 语言源文件，你可以使用 `********.c` 元字符表达式引用所有这些文件。\n\n### 目录树导航\n当用户登录系统时，用户位于\
  \ Unix 目录树的某个位置——通常是用户账户的家目录。当前目录被称为*当前工作目录*，可以使用 `pwd(1)` 命令显示。\n\n用户可以使用 `cd(1)`\
  \ 命令在目录树中移动。当不带任何命令参数使用使用时，`cd` 将用户重定位到 `HOME` 参数指定的目录（通常是用户的家目录）。新目录可以作为命令参数指定。如果目录存在且用户对该目录具有执行权限，则用户将重定位到该目录。可以使用完整的目录名、部分目录名加元字符或（在某些情况下）所有元字符来指定新目录。\n\
  \n也可以指定从根目录（`/`）开始的*完整*或*绝对路径*，或者从当前工作目录开始的*部分*或*相对路径*。你可以使用单个点（`.`）引用当前目录，使用双点（`..`）引用当前目录上目录（*父目录*）。例如：\n\
  \n```\n$ pwd\n/export/home/dla\n$ cd ..\n$pwd\n/export/home\n$ cd .\n$pwd\n/export/home\n\
  $ cd /export/home\n$pwd\n/export/home\n$ cd dla\n$pwd\n/export/home/dla\n```\n\n\
  你还可以在同一路径中使用 `..` 引用多个父目录。例如：\n\n```bash\n$ pwd\n/export/home/dla\n$ cd ../..\n\
  $pwd\n/export\n```\n\n元字符 `?` 和 `*****` 也可以指定目录。记住 `?` 可以表示任意单个字符，而 `*****` 可以表示任意数量的任意字符。假设目录\
  \ dla 是 `/export/home` 下匹配所有元字符表达式的唯一目录，那么以下命令都将导致当前工作目录更改为 `/export/home/dla`：\n\
  \n```bash\ncd /export/home/dla\ncd /export/home/dl?\ncd /export/home/d?a\ncd /export/home/d??\n\
  cd /export/home/?la\ncd /export/home/?l?\ncd /export/home/??a\ncd /export/home/???\n\
  cd /export/home/*\ncd /export/home/d*\ncd /export/home/*a\ncd /export/home/*l*\n\
  cd /export/home/?l*\n```\n\n\n\n\n\n几个命令允许您创建、移动和删除目录：\n\n- `mkdir`(1)—创建一个目录。\n\
  - `mv`(1)—移动文件或目录。\n- `rmdir`(1) 或 `rm`(1)—删除目录。\n\n## 使用 mkdir 命令创建目录\n\n`mkdir`(1)\
  \ 命令创建作为命令行参数指定的目录。该命令行参数可以是绝对路径（从 `/` 开始）或相对于当前目录的相对路径。该目录将由创建目录的用户账户以及该所有者的所属组所有。它将根据当前的\
  \ `umask` 或由 `-m` `mode` 命令行参数指定的访问权限来创建，其中 `mode` 是一组使用绝对模式格式定义的权限。若要创建多个目录，请将它们作为命令行参数指定（用空格隔开）。\n\
  \n通常情况下，创建新目录要创建的父目录必须已经存在。但是，如果你指定了 `-p` 命令行参数，则会创建创建任何父目录。以下示例显示了 `mkdir` 命令的几种用法。第一个使用\
  \ `umask` 权限创建目录。第二个使用指定的权限创建目录。第三个会失败，因为必要的父目录不存在。第四个 `mkdir` 命令使用 `-p` 命令行参数来创建父目录：\n\
  \n```bash\n# mkdir exam\n# ls -l exam\n\ntotal 0\n# ls -ld exam\ndrwxr-xr-x 2 root\
  \ other 512 Apr 13 17:32 exam\n# mkdir -m 777 test2\n# ls -ld test*\ndrwxr-xr-x\
  \ 2 root other 512 Apr 13 17:32 exam\ndrwxrwxrwx 2 root other 512 Apr 13 17:33 test2\n\
  # mkdir /exam/Solaris/8\nmkdir: Failed to make directory \"/exam/Solaris/8\";\n\
  No such file or directory\n# mkdir -p /exam/Solaris/8\n# ls -lR /exam\n/exam:\n\
  total 2\ndrwxr-xr-x 3 root other 512 Apr 13 17:33 Solaris\n/exam/Solaris:\ntotal\
  \ 2\ndrwxr-xr-x 2 root other 512 Apr 13 17:33 8\n/exam/Solaris/8:\ntotal 0\n```\n\
  \n## 使用 mv 命令移动目录\n\n`mv`(1) 命令移动目录及其内容就像移动普通文件一样：\n\n```bash\n# mv /exam /test\n\
  # ls -lR /test\n/test:\ntotal 2\ndrwxr-xr-x 3 root other 512 Apr 13 17:33 Solaris\n\
  /test/Solaris:\ntotal 2\ndrwxr-xr-x 2 root other 512 Apr 13 17:33 8\n/test/Solaris/8:\n\
  total 0\n```\n\n## 使用 rmdir 或 rm 命令删除目录\n\n可以使用 `rmdir`(1) 或 `rm`(1) 命令删除目录。`rmdir`\
  \ 命令删除作为一个或多个命令行参数（用空格隔开）指定的目录。如果目录包含文件或其他目录，删除将失败。如果指定了 `-p` 命令行参数，则所有为空的父目录也将删除。`-s`\
  \ 命令行参数用于抑制错误消息。例如：\n\n```bash\n# rmdir /test/Solaris/8\n# ls -lR /test\n/test:\n\
  total 2\ndrwxr-xr-x 2 root other 512 Apr 13 19:15 Solaris\n/test/Solaris:\ntotal\
  \ 0\n# rmdir -p /test/Solaris\n# ls -lr /test\n/test: No such file or directory\n\
  ```\n\n`rm`(1) 命令也可以删除作为命令行参数（用空格隔开）指定的一个或多个目录。只有在指定了 `-R` 或 `-r` 命令行参数时，才能删除目录。这两个命令行参数中的任何一个都会递归删除被删除目录下的所有文件和目录。注意，你可以使用\
  \ `rmdir` 命令来删除父目录（被删除目录之上的目录）。例如：\n\n```bash\n# mkdir -p /test/Solaris/8\n# rm\
  \ /test\nrm: /test is a directory\n# rm -r /test\n# ls -lr /test\n/test: No such\
  \ file or directory\n```\n\n`-i` 命令行参数为删除命令提供了交互式控制：\n\n```bash\n# mkdir -p /test/Solaris/8\n\
  # rm -r -i /test\nrm: examine files in directory /test (yes/no)? y\nrm: examine\
  \ files in directory /test/Solaris (yes/no)? y\nrm: examine files in directory /test/Solaris/8\
  \ (yes/no)? y\nrm: remove /test/Solaris/8: (yes/no)? y\nrm: remove /test/Solaris:\
  \ (yes/no)? y\nrm: remove /test: (yes/no)? y\n```\n\n通常情况下，如果 `rm` 命令遇到写保护的文件，它将提示确认删除该文件。然而，如果你指定了\
  \ `-f` 命令行参数，写保护的文件将在无需确认的情况下删除。`-f` 命令行参数不能与 `-i` 命令行参数一起指定。\n\n##\n\n通常，系统程序和应用程序创建文件。这些文件可以根据需要复制、移动（或重命名）和删除。这些操作通过以下命令完成：\n\
  \n- `cp`(1)—复制一个或多个文件。\n- `mv`(1)—移动或重命名文件。\n- `rm`(1)—删除一个或多个文件。\n\n## 使用 cp 命令复制文件\n\
  \n`cp`(1) 命令将一个或多个文件复制到另一个目录，或创建一个具有不同名称的现有文件的副本。注意，当你复制多个文件时，它们不能被重命名。当你将一个或多个文件复制到另一个目录时，最后一个命令行参数是目标目录，所有之前的命令行参数都是待复制的文件。待复制的文件可以是完整的文件名、通过元字符选择的多个文件，或它们的组合。多个文件名之间用空格隔开。在接后的示例中，前两个\
  \ `cp` 命令将一个文件复制到不同的名称。第三个命令将几个文件复制到另一个目录：\n\n```bash\n# cp file1 file2\n# ls -l\n\
  total 2\n-rw-r--r-- 1 root other 1024 Apr 13 20:48 file1\n-rw-r--r-- 1 root other\
  \ 1024 Apr 13 20:48 file2\n# cp file1 xfile\n# ls -l\ntotal 2\n-rw-r--r-- 1 root\
  \ other 1024 Apr 13 20:48 file1\n-rw-r--r-- 1 root other 1024 Apr 13 20:48 xfile\n\
  # cp file2 xfile\n# ls -l\ntotal 3\n-rw-r--r-- 1 root other 1024 Apr 13 20:48 file1\n\
  -rw-r--r-- 1 root other 1024 Apr 13 20:48 file2\n-rw-r--r-- 1 root other 1024 Apr\
  \ 13 20:48 xfile\n# cp file* /tmp\n# ls -l /tmp\ntotal 1\n-rw-r--r-- 1 daemon 1952\
  \ Apr 6 00:52 ab2.soc.cache\n-rw-r--r-- 1 root other 10336 Apr 6 02:10 comp\n-rw--------\
  \ 1 root other 30782 Apr 4 18:57 dtdbcache_\n-rw-r--r-- 1 root other 10336 Apr 13\
  \ 20:49 file1\n-rw-r--r-- 1 root other 10336 Apr 13 20:49 file2\n-rw-rw--r-- 1 root\
  \ sys 5032 Apr 4 18:56 ps_data\n-rw-r--r-- 1 root other 0 Apr 9 00:45 sdtvolcheck390\n\
  -rw-r--r-- 1 root other 10336 Apr 13 20:49 xfile\n```\n\n## 使用 mv 命令移动和重命名文件\n\n\
  `mv`(1) 命令可用于：\n- 将一个或多个文件移动到另一个目录。\n- 在当前目录重命名文件。\n- 将文件移动到另一个目录并重命名。\n\n当你移动一个或多个文件时，最后一个命令行参数是目标目录，所有之前的命令行参数都是待移动的文件。待移动的文件可以是完整的文件名、通过元字符选择的多个文件，或任何组合。文件名必须用空格隔开。例如：\n\
  \n```bash\n# ls -R /test\n/test:\nSolaris\n/test/Solaris:\n8\n/test/Solaris/8:\n\
  310-011 310-012 sysadmin\n# mv /test/Solaris/8/310* /test/Solaris/8/sysadmin\n#\
  \ ls -R /test\n/test:\nSolaris\n/test/Solaris:\n8\n/test/Solaris/8:\nsysadmin\n\
  /test/Solaris/8/sysadmin:\n310-011 310-012\n```\n\n单个文件可以在当前目录中重命名，也可以移动到另一个目录并同时重命名。在接后的示例中，第一个\
  \ `mv` 命令重命名了 310-011 文件。第二个命令将其移动到另一个目录（父目录或 `..` 目录）。第三个命令将 310-012 文件移动到父目录并同时重命名：\n\
  \n```bash\n# ls\n310-011 310-012\n# mv 310-011 part1\n# mv part1 ..\n# mv 310-012\
  \ ../part2\n```\n\n## 使用 rm 命令删除文件\n\n`rm`(1) 命令删除作为命令行参数指定的一个或多个文件。待删除的文件可以是完整的文件名、通过元字符选择的多个文件，或任何\n\
  \n\n\n\n组合。多个文件名之间必须用空格分隔。`-i` 命令行参数提供了对 `remove` 命令的交互控制。通常情况下，如果 `rm` 命令遇到受保护的文件，它会提示确认删除该文件。然而，如果你指定了\
  \ `-f` 命令行参数，受保护的文件将被删除而无需确认。`-f` 命令行参数不能与 `-i` 命令行参数同时指定。例如：\n\n```\n# ls\nfile1\
  \ file2 xfile\n# rm xfile file*\n# ls\n```\n\n考试提示：以点字符`.`开头的文件和目录名称（例如 `.profile`）不会包含在使用元字符的多个文件/目录指定中。例如，`*profile`\
  \ 不包含 `.profile`。以点开头的文件必须通过在前面加点来单独指定，如 `.p*`。\n\n## vi 编辑器\n\n`vi`(1) 命令是一个面向屏幕的文本编辑器。在本节中，我们将介绍三种操作模式、光标位置控制、文本操作（添加、删除、复制和移动）以及搜索/替换功能。\n\
  \n注意在对 `vi` 文本编辑器的描述中，我们使用符号 `<` 和 `>` 来定义你应该在键盘上按下的按键。例如，`<a>` 表示你应该按下标记为“a”的键，`<Enter>`\
  \ 表示你应该按下标记为“Enter”或“Return”的键。\n\n### 操作模式\n\n`vi` 编辑器有三种操作模式：\n- 命令模式 (Command)\n\
  - 输入模式 (Input)\n- 最后一行模式 (Last Line)\n\n命令模式是初始且默认的操作模式。在此模式下，支持文件导航，你可以查看文件的不同部分。你可以通过使用命令向前或向后滚动文件（屏幕上的垂直移动）以及在显示器的左右之间移动来控制视图。命令模式还支持字符、单词和行的删除。\n\
  \n输入模式允许添加、删除或修改文本。该模式提供了多种命令来操作文件的文本内容。\n\n最后一行模式支持输入命令以保存更改、执行搜索以及执行其他 `ex`(1)\
  \ 和 `ed`(1) 命令。\n\n### 命令模式\n\n命令模式的主要功能是导航和删除。导航允许你将光标定位在文件内所需的位置。然后，你可以对文件内容执行删除或输入模式操作（添加或修改）。\n\
  \n#### 光标定位\n\n表 10.2 列出了常用的光标定位键盘序列。更多命令请参阅 `vi`(1) 手页。\n\n表 10.2：vi 编辑器的光标定位（命令模式）键盘序列。\n\
  \n| 序列 | 描述 |\n| :--- | :--- |\n| `<up arrow>` | 将光标向上移动一行。 |\n| `<down arrow>`\
  \ | 将光标向下移动一行。 |\n| `<left arrow>` | 将光标向左移动一个字符。 |\n| `<right arrow>` | 将光标向右移动一个字符。\
  \ |\n| `<h>` | 将光标向左移动一个字符。 |\n| `<j>` | 将光标向下移动一行。 |\n| `<k>` | 将光标向上移动一行。 |\n\
  | `<l>` | 将光标向右移动一个字符。 |\n| `<Ctrl><f>` | 向前移动整个屏幕。 |\n| `<Ctrl><b>` | 向后移动整个屏幕。\
  \ |\n| `<Ctrl><d>` | 向向前半个屏幕。 |\n| `<Ctrl><u>` | 向后移动半个屏幕。 |\n\n注意有两组单字符/行光标定位命令。一组使用专用的光标（箭头）键，另一组使用小写字母键。这些双重命令使得\
  \ `vi` 文本编辑器可以在没有光标键或由于某些原因光标键未识别的键盘上使用。此外注意你可以在这些光标定位命令之前输入一个数字，以便一次移动多行或多个字符。例如，`20j`\
  \ 将光标向下移动 20 行，`10<right arrow>` 将光标向右移动 10 个字符。\n\n#### 文本删除\n\n命令模式也支持删除。表 10.3\
  \ 列出了常用的文本删除序列。\n\n表 10.3：vi 编辑器的文本删除（命令模式）键盘序列。\n\n| 序列 | 描述 |\n| :--- | :--- |\n\
  | `<x>` | 删除当前字符。 |\n| `<d><w>` | 删除当前单词。 |\n| `<d><d>` | 删除当前行。 |\n\n与光标定位命令一样，你可以在这些文本删除命令之前输入一个数字，以一次删除多个字符、单词或行。例如，`5x`\
  \ 删除后五个字符，`10dd` 删除后 10 行。考试提示：了解命令模式的作用以及光标定位和文本删除序列。还要记住命令模式是默认模式。\n\n### 输入模式\n\
  \n输入模式提供了操作文本的能力。也就是说，你可以插入（光标前）、追加（光标后）、更改和替换文本。。表 10.4 列出了用于操作文本的输入模式键盘序列。你从命令模式进入输入模式，它会一直有效，直到你按下\
  \ `<Esc>` 键终止它（`r` 除外，它仅对一个字符有效）。然后 `vi` 编辑器将返回命令模式。\n\n表 10.4：vi 编辑器的文本操作（输入模式）键盘序列。\n\
  \n| 键键 | 描述 |\n| :--- | :--- |\n| `<a>` | 在光标后追加。 |\n| `<A>` | 追加到文件末尾。 |\n| `<i>`\
  \ | 在光标前插入。 |\n| `<I>` | 在第一个非空字符前插入。 |\n| `c` | 更改行。 |\n| `<C>` | 更改行的剩余部分。 |\n\
  | `<o>` | 在当前行下方插入新行。 |\n| `<O>` | 在当前行上方插入新行。 |\n| `<r>` | 替换字符。 |\n| `<R>` | 替换文本。\
  \ |\n| `<s>` | 替换字符。 |\n| `<S>` | 替换行。 |\n\n你可以将 `<c>` 键与 `<w>` 组合更改当前单词 (`cw`)，或与\
  \ `<$` 组合更改当前行的剩余部分 (`c$`)。考试提示：了解输入模式的作用以及文本操作序列。还要记住 `<Esc>` 终止输入模式并将 `vi` 编辑器返回命令模式。\n\
  \n### 最后一行模式\n\n最后一行模式用于执行搜索并输入与 `ed` 和 `ex` 相关的命令。你通过按下以下键盘字符从命令模式进入最后一行模式：\n-\
  \ 冒号 `:` —— 指定 `ed` 或 `ex` 命令；主要是文件控制命令（如写入文件）或执行 shell 命令。\n- 正斜杠 `/` —— 从当前位置开始向文件末尾搜索文本模式（模式）。\n\
  - 问号 `?` —— 从当前位置开始向文件开头搜索文本模式（模式）。\n\n一旦进入最后一行模式，你就可以指定要执行的操作。当你按下 `<Enter>` 时，指定的操作将被执行，`vi`\
  \ 编辑器返回命令模式。\n\n#### 文件控制与执行\n\n表 10.5 列出了一些用于文件控制和命令执行常用的最后一行模式键盘序列。更多信息请参阅 `vi`(1)\
  \ 手页。\n\n表 10.5：vi 编辑器的文件控制和执行（最后一行模式）键盘序列。\n\n| 序列 | 描述 |\n| :--- | :--- |\n| `:<e>\
  \ <name>` | 编辑 `name` 文件。 |\n| `:<e>!` | 放弃更改并重新编辑。 |\n| `:<w>` | 将更改写入文件。 |\n|\
  \ `:<w>!` | 忽略文件权限写入更改。 |\n| `:<q>` | 退出。 |\n| `::>q>!` | 放弃更改并退出。 |\n| `:<! <cmd>`\
  \ | 执行指定的 `ed` 或 `ex` `cmd` 命令。 |\n\n\n\n表 10.6 列出了一些用于测试搜索的常用底行模式（Last Line mode）键盘序列。更多信息请参阅\
  \ `vi`(1) 手页。\n\n### 表 10.6：`vi` 编辑器的文本搜索（底行模式）键盘序列。\n\n| 序列 | 描述 |\n| :--- | :---\
  \ |\n| `</> *text*</>` | 向前搜索 `text`（末尾的斜杠可选）。 |\n| `<?> *text*<?>` | 向后搜索 `text`（末尾的问号可选）。\
  \ |\n\n如果找到了该文本，光标将定位在指定文本的开头。当遇到文件末尾（或开头）时，搜索将从文件内容的开头（或末尾）继续。按下 `</>` 或 `<?>`\
  \ 紧接按下 `<Enter>` 可重复上一次搜索。\n\n### 文本搜索与替换\n\n`vi` 编辑器支持文本搜索和替换功能。它们将搜索并替换定位文本的能力合并为一个单一操作。表\
  \ 10.7 列出了文本搜索和替换的键盘序列。\n\n### 表 10.7：`vi` 编辑器的文本搜索与替换（底行模式）键盘序列。\n\n| 序列 | 描述 |\n\
  | :--- | :--- |\n| `<:><s></> *old*</> *new*</>` | 在当前行中搜索 `old` 的第一次出现并将其替换为 `new`（末尾的斜杠可选）。\
  \ |\n| `<:><s></> *old*</> *new*</><g>` | 在当前行中搜索所有 `old` 出现处并将其替换为 `new`。 |\n|\
  \ `<:><1><,><$><s></> *old*</> *new*</>` | 在所有行中搜索 `old` 的第一次出现并将其替换为 `new`（末尾的斜杠可选）。\
  \ |\n| `<:><1><,><$><s></> *old*</> *new*</><g>` | 在所有行中搜索所有 `old` 出现处并将其替换为 `new`。\
  \ |\n| `<:><g></>old</><s></></> *new*</>` | 在所有行中搜索 `old` 的第一次出现并将其替换为 `new`（末尾的斜杠可选）。\
  \ |\n| `<:><g></> *old*</><s></></> *new*</><g>` | 在所有行中搜索所有 `old` 出现处并将其替换为 `new`。\
  \ |\n\n注意 `g` 用于表示全局搜索，且“全局”有两个含义。第一个含义是指当前行。全局替换会影响当前行上的所有出现处，而不仅仅是第一次出现。因此，键盘序列末尾的\
  \ `g` 指当前行上的所有出现处。“全局”的第二种含义指的是所有行。\n\n有两种机制可以处理所有行。第一种使用 `1,$` 序列表示所有行。当此序列与 `s//`\
  \ 序列配合使用时，`vi` 会对文件中的所有行进行搜索和替换。第二种机制使用 `g/ *old*/` 序列定位包含短语 `old` 的所有行。当该序列配合 `s//`\
  \ 序列执行替换时，不需要在 `s//` 序列的第一个字段中指定 `old` 文本。尽管 `1,$s/ *old*/ *new*/**` 和 `g/ *old*/s//\
  \ *new*/**` 使用不同的方法，但结果是相同的。也就是说，每行中 `old` 的第一次出现会被替换为 `new`。注意，你可以在这两个命令的末尾添加 `<g>`\
  \ 以影响 `old` 的所有出现处。\n\n**考试提醒** 了解底行模式的用途以及文件控制、搜索和搜索与替换的键盘序列。还要记住 `<Enter>` 会终止底行模式并将\
  \ `vi` 编辑器返回命令模式。\n\n### 访问远程系统\n\nSolaris 8 提供了几个命令用于执行远程登录、远程拷贝和远程命令执行：\n\n- `telnet`(1)—远程网络终端实用\n\
  - `ftp`(1)—文件传输协议实用\n- `rlogin`(1)—远程登录\n- `rcp`(1)—远程拷贝\n- `rsh`(1)—远程 shell 执行\n\
  \n`ftp` 和 `telnet` 命令都要求用户使用远程系统上设置的有效用户名和密码登录远程系统。`rlogin`、`rcp` 和 `rsh` 命令统称为“r\
  \ 命令”，它们都可以使用远程认证数据库，而不是需要用户名和密码来验证用户。\n\n### 远程登录\n\n两个命令提供了通过网络作为本地用户登录远程系统的能力。这些是\
  \ `telnet` 命令和 `rlogin` 命令。\n\n#### telnet 命令\n\n`telnet` 命令用于通过网络远程登录系统。用户必须提供在远程系统上定义的有效用户名和密码，因为\
  \ `telnet` 命令使用标准的 Unix 登录/密码认证。\n\n远程系统的主机名或 IP 地址通常作为命令行参数指定。如果未指定此地址，则 `telnet`\
  \ 命令将进入交互模式。远程系统会提示用户名和密码。下面的示例使用 `telnet` 命令通过 `dla` 用户名登录到远程系统 `solaris8`：\n\n\
  ```bash\n$ telnet solaris8\nTrying 192.168.99.8…\nConnected to solaris8.\nEscape\
  \ character is '^]'.\nSunOS 5.8\nlogin: dla\nPassword:\nLast login: Sun Feb 3 22:34:56\
  \ from winnt40\nOS 5.8\n```\n\n#### rlogin 命令\n\n`rlogin` 命令也可用于通过网络远程登录系统。如果远程认证数据库已正确设置，用户可能无需提供用户名和密码即可登录。此功能将在本文稍后介绍。\n\
  \n如果数据库未正确设置，用户必须像 `telnet` 命令一样，提供远程系统上定义的有效用户名和密码。如果在本地系统上执行 `rlogin` 命令的用户名在远程系统中也存在，则不需要指定用户名（假设是相同的）。如果要在远程系统使用另一个用户账户，则必须在\
  \ `rlogin` 命令中使用 `-l` 命令行参数指定用户名。下面的列表显示了使用 `rlogin` 登录远程系统 `solaris8` 的三个示例。在第一个示例中，数据库已设置，允许本地账户\
  \ (dla) 登录远程系统上的相同账户。在第二个示例中，数据库未设置。假设用户名为 `dla` 并提示密码。在第三个示例中，使用了不同的用户账户 (sarah)，并通过\
  \ `-l` 命令行指定了用户名：\n\n```bash\n$ rlogin solaris8\nLast login: Sun Feb 4 21:32:12\
  \ from solaris8\nOS 5.8\n$\n\n$ rlogin solaris8\nPassword:\nLast login: Sun Feb\
  \ 4 21:33:45 from solaris8\nOS 5.8\n$\n\n$ rlogin -l sarah solaris8\nPassword:\n\
  Last login: Sun Feb 4 21:28:44 from solaris8\nOS 5.8\n$\n```\n\n### 远程拷贝\n\n有两个命令可用于系统之间拷贝文件。这些是\
  \ `ftp`(1) 命令和 `rcp`(1) 命令。\n\n#### ftp 命令\n\n`ftp` 命令通过网络在本地系统和远程系统之间拷贝一个或多个文件。用户必须提供远程系统上定义的有效用户名和密码，因为\
  \ `ftp` 命令使用标准的 Unix 登录/密码认证。\n\n远程系统的主机名或 IP 地址通常作为命令行参数指定。如果未指定此地址，则 `ftp` 命令将进入交互模式。远程系统会提示用户名和密码。\n\
  \n一旦登录到远程系统，你可以通过以下方式在系统之间传输文件：\n\n\n\n\n发布适当的 `ftp` 子命令。要将文件从本地系统复制到远程系统，请使用 `put`\
  \ 子命令。要将文件从远程系统复制到本地系统，请使用 `get` 子命令。表 10.8 列出了常用的 `ftp` 子命令。\n\n### 表 10.8：常用的\
  \ ftp 子命令\n\n| 子命令 | 说明 |\n| :--- | :--- |\n| `?` | 列出 `ftp` 子命令。 |\n| `ascii` |\
  \ 将传输模式设置为 ASCII（执行行尾字符映射）。ASCII 是默认模式。 |\n| `binary` | 将传输设置为二进制模式（不执行行尾字符映射）。\
  \ |\n| `cd path` | 将远程当前目录更改为 `path`。 |\n| `get remote local` | 将远程系统上的文件 `remote`\
  \ 复制到本地系统上的文件 `local`。如果未指定 `local`，则文件在本地系统上具有相同的名称。 |\n| `hash` | 每发送或接收 8,912\
  \ 字节打印一个井号 (#) 字符。 |\n| `help subcommand` | 显示 `subcommand` 的短描述。 |\n| `lcd path`\
  \ | 将本地当前目录更改为 `path`。 |\n| `ls` | 列出远程当前目录的内容。 |\n| `mget meta` | 从远程系统复制多个文件到本地系统。通过\
  \ `meta` 指定一组文件，它是一个包含一个或多个元字符的表达式。 |\n| `mput meta` | 从本地系统复制多个文件到远程系统。通过 `meta`\
  \ 指定一组文件，它是一个包含一个或多个元字符的表达式。 |\n| `put local remote` | 将本地系统上的文件 `local` 复制到远程系统上的文件\
  \ `remote`。如果未指定 `remote`，则文件在远程系统上具有相同的名称。 |\n| `quit` | 退出 `ftp` 命令。 |\n\n以下示例使用\
  \ `ftp` 命令通过 `dla` 用户账户名访问远程系统 solaris8。使用了不同的子命令（斜体表示）在在系统之间传输文件：\n\n```\n$ ftp\
  \ solaris8\nConnected to solaris8.\n220 solaris8 FTP server (SunOS 5.8) ready.\n\
  Name (solaris8:dla): dla\n331 Password required for dla.\nPassword:\n230 User dla\
  \ logged in.\nftp> cd /tmp\n250 CWD command successful.\nftp> ls\n200 PORT command\
  \ successful.\n150 ASCII data connection for /bin/ls (0 bytes).\nab2.socat.cache\n\
  dtdbcache_:0\nfile.txt\nmp5eaaNc\nmpfnaOFc\nmpjAaWMc\nmpqvaOMc\nps_data\nsdtvolcheck388\n\
  226 ASCII Transfer complete.\n100 bytes received in 0.0032 seconds (30.14 Kbytes/s)\n\
  ftp> lcd /export/home/dla\nLocal directory now /export/home/dla\nftp> get file.txt\n\
  200 PORT command successful.\n150 ASCII data connection for xx (3448 bytes).\n226\
  \ ASCII Transfer complete.\n233 local: file.txt remote: file.txt\n3529 bytes received\
  \ in 0.0044 seconds (776.02 Kbytes/s)\nftp> binary\n200 Type set to I.\nftp> mget\
  \ mp\nmget mp5eaaNc? n\nmget mpfnaOFc? y\n200 PORT command successful.\n150 ASCII\
  \ data connection for mpfnaOFc (16198 bytes).\n226 ASCII Transfer complete.\nlocal:\
  \ mpfnaOFc remote: mpfnaOFc\n16726 bytes received in 0.0074 seconds (221.89 Kbytes/s)\n\
  mget mpjAaWMc? y\n200 PORT command successful.\n150 ASCII data connection for mpjAaWMc\
  \ (0 bytes).\n226 ASCII Transfer complete.\nmget mpqvaOMc? n\nftp> quit\n221 Goodbye.\n\
  ```\n\n### rcp 命令\n\n你也可以使用 `rcp`(1) 命令将指定文件从本地系统复制到指定的远程系统。目标地格式为 `host:path`，其中\
  \ `host` 是远程系统的名称，`path` 是目录或文件的完整路径。如果远程系统上使用了不同的用户账户，则在 `host` 之前通过 `@` 符号指定。\n\
  \n`rcp` 命令使用远程身份验证数据库。以下列表显示了本地上的 `dla` 用户账户尝试将文件复制到远程“system solaris 8”上两个不同用户账户的家目录。请注意第二次尝试失败了，因为远程系统上的远程身份验证数据库不允许本地\
  \ `dla` 用户账户访问远程的 `sarah` 用户账户：\n\n```\n$ rcp /tmp/file.txt solaris8:/export/home/dla/file.txt\n\
  $ rcp /tmp/file.txt sarah@solaris8:/export/home/dla/file.txt\n```\n\n### 远程 Shell\
  \ 执行\n\n`rsh`(1) 命令可以在远程系统上执行命令。`rsh` 命令至少需要两个参数：远程主机的名称和要执行的命令。\n\n### rsh 命令\n\
  \n`rsh` 命令至少需要两个参数：远程主机的名称和要执行的命令。与 `rcp` 命令一样，它使用了远程身份验证数据库。\n\n### 远程身份验证数据库\n\
  \n远程身份验证数据库用于确定哪些远程主机和用户被认为是“受信任的”。`rlogin`、`rsh` 和 `rcp` 命令（统称为“r 命令”）使用远程身份验证数据库。该数据库由两种类型组成：适用于整个系统的\
  \ `/etc/hosts.equiv` 文件，以及适用于用户账户的 `.rhosts` 文件。\n\n远程身份验证程序首先检查远程系统的主机名是否列在 `/etc/hosts.equiv`\
  \ 文件中。如果列出，远程身份验证成功并授予用户访问权限。\n\n如果远程系统的主机名未列出，则继续远程身份验证。将检查用户账户名（与远程用户账户名匹配）的家目录，确定远程系统的主机名是否列在\
  \ `.rhosts` 文件中。如果列出，远程身份验证成功并授予用户访问本地系统的权限。\n\n这两个文件都由主机名组成（每行一个）。单独的主机名或带有加号 (+)\
  \ 前缀的主机被被受信任主机并允许访问。如果主机名带有减号 (-) 前缀，则被视为不可信并拒绝访问。\n\n可选地，主机名后面可以跟一个用户账户名。如果这种格式用于\
  \ `/etc/hosts.equiv` 文件中，且远程用户账户与指定的用户账户匹配，则允许以任何用户身份访问。如果允许以任何用户身份访问系统，则用户要么作为\
  \ `rlogin` 命令的命令行选项提供用户账户，要么被提示输入该账户。如果可选格式用于 `.rhosts` 文件中，远程用户将以指定的用户账户身份访问。\n\
  \n### 练习题\n\n**问题 1**\n\n以下哪些命令使用远程身份验证数据库来验证用户？\n\n[选择所有适用]\n\na. `telnet`\nb.\
  \ `rlogin`\nc. `rcp`\nd. `ftp`\ne. `rsh`\n\n答案 b、c、e 是正确的。r 命令 (`rlogin`, `rcp`\
  \ 和 `rsh`) 使用远程身份验证数据库。\n\n\n\n认证数据库。`telnet` 和 `ftp` 命令仅使用 Unix 用户名和密码进行认证。因此，答案\
  \ a 和 d 是错误的。\n\n### 问题 2\n\n哪个 `mkdir` 命令行参数会根据需要创建任何父目录？\n\na. `-P`\nb. `-c`\n\
  c. `-p`\n236\nd. `-m`\n\n答案 c 正确。`mkdir` 的 `-p` 命令行参数会根据需要创建任何父目录。`-P`、`-c` 和 `-m`\
  \ 不是 `mkdir` 命令的有效命令行参数。因此，答案 a、b 和 d 是错误的。\n\n## 问题 3\n\n以下哪个 `vi` 命令会将所有的文本字符串\
  \ `old` 替换为文本字符串 `new`？\n\na. `:g/ *old*/s// *new/**`\nb. `:!/ *old*/ *new*/g`\n\
  c. `:s/ *old*/ *new*/g`\nd. `:1,$s/ *old*/ *new/**`\ne. `:1,$s/ *old*/ *new*/g`\n\
  \n答案 e 正确。`:1,$s/ *old*/ *new*/g` 命令将所有的文本字符串 `old` 替换为文本字符串 `new`。`:g/ *old*/s//\
  \ *new/**` 和 `:1,$s/ *old*/ *new/**` 命令将每行中第一个 `old` 替换为 `new`。因此，答案 a 和 d 是错误的。`:!/\
  \ *old*/ *new*/g` 将无法工作，因为 `!` 用于执行 shell 命令。因此，答案 b 是错误的。`:s/ *old*/ *new*/g` 将所有的\
  \ `old` 替换为 `new`，但仅限于当前行。因此，答案 c 是错误的。\n\n## 问题 4\n\n将以下每个 `ftp` 子命令与其描述匹配。\n\n\
  a. `binary` 1. 将多个文件传输到远程系统。\nb. `hash` 2. 将多个文件传输到本地系统。\nc. `ascii` 3. 传输过程中不映射换行符。\n\
  d. `mput` 4. 传输过程中映射换行符。\ne. `mget` 5. 本地系统上的工作目录。\nf. `lcd` 6. 每传输 8,192 个字符打印一个“#”。\n\
  \n答案 a-3, b-6, c-4, d-1, e-2 和 f-5 正确。`binary` 模式不映射传输数据中的换行符。`hash` 子命令每传输 8,192\
  \ 个字符就标记一个“#”字符。`ascii` 模式映射传输数据中的换行符。`mput` 子命令将多个文件传输到远程系统。`mget` 子命令将多个文件传输到本地系统。`lcd`\
  \ 子命令更改本地工作目录。\n237\n\n## 问题 5\n\n以下哪个 `rsh` 命令的正确语法？\n\na. `rsh -c *command* -s\
  \ *system*`\nb. `rsh -s *system* -c *command*`\nc. `rsh *system command*`\nd. `rsh\
  \ *command system*`\ne. `rsh *system*: *command*`\n\n答案 c 正确。系统名应指定在命令之前。空格分隔系统和命令。其他语法选择均无效。因此，答案\
  \ a、b、d 和 e 是错误的。\n\n## 问题 6\n\n给定文件列表 `abc`、`abc123` 和 `123abc`，以下哪个元字符表达式将选择这些文件中的一个或多个？[选择所有适用]\n\
  \na. `abc*`\nb. `?*123`\nc. `*2*`\nd. `??2*`\n\n答案 a、b 和 c 正确。`abc*` 会选择 `abc` 和\
  \ `abc123`。`?*123` 会选择 `abc123`。`*2*` 会选择 `abc123` 和 `123abc`。`??2*` 不选择任何指定的文件，因为\
  \ 2 没有出现在第三字符。因此，答案 d 是错误的。\n\n## 问题 7\n\n以下哪些 `vi` 模式在终止时会返回命令模式？[选择所有适用]\n\na.\
  \ 输入（Input）\nb. 最后行（Last Line）\nc. 搜索（Search）\nd. 替换（Replace）\ne. 文件控制（File control）\n\
  238\n答案 a 和 b 正确。Input 和 Last Line `vi` 模式在终止时返回命令模式。虽然搜索、替换和文件控制是功能，但它们不是 `vi`\
  \ 模式。因此，答案 c、d 和 e 是错误的。\n\n## 问题 8\n\n以下哪个 `rcp` 命令目标文件的正确格式？\n\na. `system*****:\
  \ *file*`\nb. `system*****@ *file*`\nc. `system*****! *file*`\nd. `file*****@ *system*`\n\
  \n答案 a 正确。`system*****: *file*` 是 `rcp` 命令目标文件的正确格式。另一种格式是 `user*****@ *system*:\
  \ *file*`，其中 `user` 指定应作为文件所有者的用户。其他格式无效。因此，答案 b、c 和 d 是错误的。\n\n（注：剩余内容包含大量重复的乱码和占位信息，已根据要求保留核心内容并进行格式排版优化）\n\
  \n\n\n（考试）。因为你无法在书中的题目上使用鼠标，所以你需要将 a, b, c, … 项与 1, 2, 3, … 项进行匹配。\n\n## 选择正确答案\n\
  \n显然，通过任何考试的唯一方法就是选择足够的正确答案以获得及格分数。然而，这些考试不像 SAT 和 GRE 考试那样标准化；在某些情况下，问题的措述非常奇怪，解读它们可能是一项真正的挑战。在这种情况下，你可能需要依靠排除法技巧。你几乎总是可以从问题的可能选项中立即排除至少一个答案，因为它符合以下条件之一：\n\
  \n- 答案不适用于该情况。\n- 答案描述了一个不存在的问题、无效的选项或想象的状态。\n- 答案因为题目本身的原因可以被排除。\n\n在排除掉所有明显错误的答案后，你可以利用所掌握的知识进一步排除其他答案。寻找那些听起来正确，但指的是题目所描述的情况中不存在或不可用的操作、命令或特性。\n\
  \n如果你仍然需要在两个或多个潜在的正确答案之间进行盲猜，请重新阅读问题。尝试想象每个可能的剩余答案将如何改变该情况。对术语要特别敏感；有时词汇的选择（例如用\
  \ `print` 代替 `display`）就能导致正确与错误答案的区别。\n\n只有当你用尽了排除答案的能力，但仍不清楚剩余可能性中哪一个是正确的，才应该猜答案。不回答的问题不会给你提供任何分数，但猜题至少让你有机会做对题目；只是在盲猜时不要太匆忙。\n\
  \n**考试警示**：由于你参加的是固定长度的测试，你可以等到最后一轮复习已标记的题目（就在你即将用完时间或没有未回答题目时）再开始做猜。猜题应该是你的最后手段！\n\
  \n241\n\n## 解码歧义\n\n你会发现，许多考试题考察的是你对与问题本身并不直接相关的事物的知识。这意味着，你必须从中选择的答案——即使是错误的答案——与问题本身一样都是技能评估的一部分。\n\
  \n如果你对各种系统管理主题不了解，那么你可能无法排除明显错误的答案，因为它们涉及的系统管理领域与当前问题所涵盖的领域不同。换句话说，你对 Solaris 系统管理的了解越深，就越容易区分正确答案和错误答案。\n\
  \n题目通常会泄露答案，但你必须保持警惕以发现线索。通常，微妙的提示会出现在题目的文中，其方式看起来几乎与情况无关。你必须意识到，每个问题本身都是一项测试，你需要检查并成功地应对每个问题以通过考试。寻找微小的线索，例如引用\
  \ `raw` 设备而非 `block` 设备名称，以及无效的命令。如果你能正确理解题目，这些微小细节可以指向正确答案；如果错过了，它们可能会让你陷入盲猜的境地。\n\
  \n认证考试的另一个常见困难是词汇。务必复习每个章节开头介绍的关键术语。\n\n## 在框架内操作\n\n测试题随机顺序出现，一个题目中提到的许多元素或问题可能也会出现在其他题目中。一个问题的错误答案是另一个题目的正确答案，反之亦然的情况并不少见。请花时间阅读每个问题的每一个答案，即使你立即识别出了该题目的正确答案。额外的阅读可能会引发记忆，或者提醒你某个函数或命令，帮助你解决考试中其他地方。\n\
  \n由于你参加的是固定长度的测试，你可以随意地多次查看任何问题。如果你不确定某个问题的答案，请勾选提供的框进行标记，以便以后返回。你还应该标记你认为可以用来回答其他问题的信息的题目。测试软件的设计允许你在选择时标记每个问题；利用这个框架来增加你的优势。你想要再次看到的所有内容都应该标记；\n\
  \n242\n\n## 决定记忆什么\n\n为了考试必须进行的记忆量取决于你的阅读程度以及你对 Solaris 的熟悉程度。至少，你可能需要记住第一部分的所需的几类信息：\n\
  \n- 文件系统管理和维护（创建、挂载、备份和恢复）\n- 与访问控制列表 (ACLs) 相关的命令\n- 用户管理（创建、修改和删除用户/组账户）\n- 基本命令语法和元字符的使用\n\
  \n对于第二部分，请务必记住以下信息：\n\n- NFS\n- NIS\n- JumpStart\n\n## 准备考试\n\n在学习之后，准备考试最好的方法是至少参加一次考试。出于这个原因，本章包含了一份考试；题目位于随后的页面（与本书中之前的章节不同，答案并不紧跟在题目之后；你必须翻到第\
  \ 12 章）。\n\n给自己留 90 分钟参加考试，遵守诚信原则，不要回过看书中的文本，也不要跳到答案页。当时间用完或你完成题目后，你可以在第 12 章检查你的工作。特别注意错误答案的解释；它们也可以帮助加强你对材料的知识。学会识别正确答案是好的，但理解为什么错误答案是错误的同样有价值。\n\
  \n此外，复习每个章节末的所有题目。它们从与模拟测试不同的视角涵盖了这些主题。这种复习应该帮助你更好地理解相关主题之间的异同。\n\n243\n\n## 考试\n\
  \n放松。一旦你坐在测试电脑前，你就无法做更多来增加知识或准备了。深吸气，伸一下身体，开始阅读第一个问题。\n\n不需要着急；你有充足的时间完成每个问题，并返回你跳过或标记为返回的题目。如果你读了两次题目仍然毫无头，可以标记它。简单和复杂的题目在整个测试中随机混合。不要在测试早期花费过多时间在一道难题上，从而欺骗自己，这剥夺了你回答测试结束题目所需的时间。\n\
  \n在固定长度的测试中，你可以阅读整个测试，并在返回标记的\n\n\n\n\n\n针对第二次访问的问题，确定你回答每个问题有多少时间。在回答每个问题时，撤销其标记。继续复习剩余的标记问题，直到时间耗尽或你完成测试。\n\
