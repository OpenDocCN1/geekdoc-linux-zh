  \ -D domainname ] name\n```\n\n::::::::::::::\n/usr/share/man/cat4/passwd.4\n::::::::::::::\n\
  \n## 文件格式 `passwd(4)`\n\n### 名称\n`passwd` - 密码文件\n\n### 语法\n`/etc/passwd`\n\n###\
  \ 说明\n`/etc/passwd` 是关于用户账户信息的本地数据源。密码文件可以与其他密码源结合使用，包括 NIS 映射 `passwd.byname` 和\
  \ `passwd.bygid` 以及 NIS+ 表 `passwd`。程序使用 `getpwnam(3C)` 例行程序来访问这些信息。\n\n每个 `passwd`\
  \ 条目都是单行，其格式如下：\n```\nusername:password:uid:gid:gcos-field:home-dir:login-shell\n\
  ```\n其中\n- `username` 是用户的登录名。建议该字段符合 `pwck(1M)` 执行的检查。\n- `password` 是一个空字段。用户的加密密码存储在\
  \ `/etc/shadow` 文件的对应条目中。\n- `pwconv(1M)` 依赖于 `/etc/passwd` 密码字段中的特殊值 `'x'`……\n\n\
  ### 关于格式和搜索的说明\n请注意，之前的示例（显示帮助页的）以 *正在重格式页面。请稍候……完成*。帮助页存储为 `nroff`(1) 源文件或 `sgml`(5)\
  \ 源文件。要显示帮助页，它们由 `nroff` 命令“实时”格式化。`sgml` 类型的帮助页在由 `nroff` 命令格式化之前会通过一个 SGML 预处理器。\n\
  \n任何对帮助页的搜索基本上都是暴力搜索——即搜索每个包含帮助页的目录，直到找到该帮助页为止。为了加快搜索，可以使用索引。`man` 命令格式化帮助页。下面的示例使用\
  \ `-f` 命令搜索关键词：\n\n```bash\nman -f passwd\n```\n\n### 关键命令和文件总结\n- `passwd(1)`：更改登录密码和密码属性\n\
  - `passwd(4)`：密码文件\n- `getpwnam(3C)`：访问用户信息的例行程序\n- `pwck(1M)`：检查密码字段\n- `pwconv(1M)`：转换密码文件\n\
  - `nroff(1)`：格式化帮助页\n- `sgml(5)`：帮助页的 SGML 源文件\n\n\n\n\n正在重新格式化页面。请等待……完成。\n\n###\
  \ 练习题\n\n### 第 1 题\nSolaris 8 操作系统的三个部分是什么？[选择所有适用项]\n\na. 磁盘驱动器\nb. 内核\nc. 文件系统\n\
  d. 系统控制台\ne. 内存管理\nf. Shell\ng. 进程控制\n\n答案 `b`、`c` 和 `f` 是正确的。Solaris 8 操作系统的三个部分是`kernel`、`file\
  \ system` 和 `shell`。磁盘驱动器和系统控制台是硬件设备。因此，答案 `a` 和 `d` 是错误的。内存管理和进程控制是`kernel`的功能。因此，答案\
  \ `e` 和 `g` 是错误的。\n\n### 第 2 题\nSolaris 8 系统提供的常用 shell 是什么？\n\na. Corn shell\n\
  b. Sea shell\nc. Bourne shell\nd. Berkeley shell\n\n答案 `c` 是正确的。Solaris 8 提供 `Bourne\
  \ shell`。答案 `a` 和 `b` 是错误的，因为它们听起来和 `Korn` 和 `C` shell 相似，但拼写不同。答案 `d` 即 `Berkeley\
  \ shell`并不存在。\n\n### 第 3 题\n以下哪个文件用于存储在用户登录系统时应执行的命令？\n\na. `.cshrc` 文件\nb. `.Profile`\
  \ 文件\nc. `.startup` 文件\nd. profile 文件\ne. `.login` 文件\n\n答案 `e` 是正确的。`.login` 文件是\
  \ `C shell` 的登录初始化文件。`.cshrc` 文件是 `C shell` 的 启动初始化文件。因此，答案 `a` 是错误的。答案 `b` 的名称与\
  \ `Bourne` 和 `Korn` 的登录初始化文件名相似，但正确的文件使用的是小写的 `p`。在 Unix 中，文件名是区分大小写的，因此答案 `b` 是错误的。`.startup`\
  \ 文件不是标准的初始化文件。因此，答案 `c` 是错误的。如果答案 `d` 以点开头，则是正确的。\n\n### 第 4 题\n系统维护命令记录在*Reference\
  \ Manual*（参考手册）的哪一个章节中？\n\na. 1\nb. `1M`\nc. 2\nd. 4\n\n答案 `b` 是正确的。系统维护命令记录在第 `1M`\
  \ 章。用户命令记录在第 `1` 章，系统调用记录在第 `2` 章，文件格式记录在第 `4` 章。因此，答案 `a`、`c` 和 `d` 是错误的。\n\n###\
  \ 第 5 题\n一个账户设置为使用 `Bourne shell`。哪个文件用于存储用户登录系统时执行的命令？\n\na. `.cshrc` 文件\nb. `.profile`\
  \ 文件\nc. `.startup` 文件\nd. `.logon` 文件\ne. `.login` 文件\n\n答案 `b` 是正确的。`.profile`\
  \ 文件用于存储用户登录系统时执行的命令。`C shell` 的启动初始化文件是 `.cshrc`。因此，答案 `a` 是错误的。答案 `c` 和 `d` 是错误的，因为它们不是登录初始化文件的标准名称。答案\
  \ `e` 是 `C shell` 的登录初始化文件。\n\n### 第 6 题\n以下哪些是内核的功能？[选择所有适用项]\n\na. 进程控制\nb. 硬件接口与控制\n\
  c. 内存管理\nd. 进程间通信\n\n答案 `a`、`b`、`c` 和 `d` 是正确的。它们都是`kernel` 的功能。\n\n### 第 7 题\n\
  以下哪些 shell 有受限版本可用？[选择所有适用项]\n\na. C shell\nb. Korn shell\nc. Bourne shell\n\n答案\
  \ `b` 和 `c` 是正确的。`Korn` 和 `Bourne` shell 提供受限版本。`C shell` 不提供受限版本；因此，答案 `a` 是错误的。\n\
  \n### 第 8 题\n可以使用哪些命令显示 `passwd`(4) 手页？[选择所有适用项]\n\na. `man -s 4 passwd`\nb. `man\
  \ -a passwd`\nc. `man passwd`\nd. `man passwd -s 4`\n\n答案 `a` 和 `b` 是正确的。答案 `a`\
  \ 只显示 `passwd(4)`，而答案 `b` 同时显示 `passwd(1)` 和 `passwd(4)`。`man passwd` 只显示 `passwd(1)`；因此，答案\
  \ `c` 是错误的。`man passwd -s 4` 显示 `passwd(1)` 并产生错误信息，因为 `-s 4` 被误解为手册页的名称（命令行参数必须在手册页名称之前指定）。因此，答案\
  \ `d` 是错误的。\n\n## 想了解更多吗？\n\nBach, Maurice J., *The Design of the Unix Operating\
  \ System* (Prentice-Hall, Englewood Cliffs, NJ, 1987), ISBN 0-13-201799-7.\nKernighan,\
  \ Brian W., and Rob Pike, *The Unix Programming Environment* (Prentice-Hall, Englewood\
  \ Cliffs, NJ, 1984), ISBN 0-13-937681-X.\nRosenblatt, Bil and Mike Loukides (Editor),\
  \ *Learning the Korn Shell* (O’Reilly & Associates, Englewood Cliffs, NJ, 1993),\
  \ ISBN 1-56-592054-6.\nSorbel, Mark G., *A Practical Guide to Solaris* (Addison-Wesley,\
  \ Reading, MA, 1999), ISBN 0-201-89548.\nSun Microsystems, *Reference Reference,\
  \ Section 1 - User Commands*. Available in printed form (806-0624-10), on the Web\
  \ at docs.sun.com.\n\n# 第 3 章：安装与维护 Solaris\n\n### 你需要的术语：\n- 软件集群\n- 软件组\n- 软件包\n\
  - 补丁\n\n### 你需要掌握的技术：\n- 安装 Solaris\n- 添加和删除软件包\n- 列出已安装的软件包\n- 添加和删除补丁\n- 列出已安装的补丁\n\
  \n本章的第一节介绍了 Solaris 8 发布。接下来，我们将详细介绍安装操作系统。最后两个章节总结了用于软件管理和补丁管理的命令。\n\n## Solaris\
  \ 8 发布版\nSolaris 8 系统和应用软件以文件和目录集合的形式交付，称为软件包。你可以从光盘或磁带将这些软件包作为单个文件复制到系统并进行解压。软件包中包含了有关软件包的信息，如标题、存储要求和版本。\n\
  \n有时系统软件分布在多个软件包中，但你需要作为一个单元进行发布和安装。两个或多个相关软件包的集合被称为软件集群。软件集群是软件包的逻辑分组。\n\nSolaris\
  \ 8 操作系统预配置为不同的软件组，每个软件组由不同的软件集群和软件包组成。软件组见表 3.1。\n\n表 3.1：Solaris 8 软件组。\n\n| 软件组\
  \ | 内容 |\n| :--- | :--- |\n| 核心 (Core) | 操作系统文件 |\n| 用户系统支持 | 核心 + 窗口环境 |\n| 开发者系统支持\
  \ | 用户支持 + 开发环境 |\n| 全发行 | 开发者支持 + 增强功能 |\n| 全发行 Plus OEM | 全发行 + 第三方硬件驱动程序 |\n\n\
  注意 某些 Solaris 文档将操作系统的预配置软件组称为软件配置集群或简单的集群。软件集群一词也用于引用软件包的集合，因此这种引用可能会引起混淆。\n\n\
  Entire Distribution 仅适用于 SPARC 平台。\n\n## 安装 Solaris\nSolaris 8 有四种安装方式。其中两种是交互式的：Solaris\
  \ 交互式安装程序 (SunInstall ) 和 Solaris Web Start 将在本章介绍。另外两种是自动的：JumpStart 和自定义 JumpStart。这些是考试\
  \ 310-012 的目标，将在第 21 章介绍。\n\nSunInstall 是一个交互式 Windows 安装程序，可安装 Solaris 8 软件，但它不支持软件包的安装。你可以使用软件包自带的安装程序来安装任何软件包。\n\
  \n\n\n\n你已完成 Solaris 8 软件的安装。\n\nWeb Start 允许你使用类似于 浏览器的界面安装 Solaris 8，而不是使用 SunInstall\
  \ 的 Open Windows 界面。默认情况下，所有的 Solaris 和捆绑软件都会被安装；但可以更改此默认设置，让你选择特定的软件。\n\n默认情况下，Web\
  \ Start 会设置系统磁盘，包括根分区（root）和交换分区（swap）。它还允许更改系统分区的大小，并提供布局文件系统（Layout File Systems）工具来设置其他磁盘。`/opt`\
  \ 分区会自动为捆绑软件创建。Web Start 还允许你创建额外的分区和文件系统。\n\n## 硬件要求\n\nSolaris 8 可以安装在 Sun SPARC\
  \ 平台，也可以安装在 Intel x86 或兼容平台上。两者的硬件要求相似。\n\n### SPARC 硬件上的 Solaris 8\n\nSolaris 8\
  \ 可以安装在大多数 sun4c、sun4u 和 sun4m 平台组上。请参阅*Solaris 8 Sun 硬件平台指南》，确定特定平台是否支持其他设备和外设，例如磁盘驱动器、CD-ROM\
  \ 驱动器、磁带驱动器、软盘驱动器、SCSI/PCI 主适配器、图形加速器、网络接口以及键盘/鼠标组件。\n\n**考试提示**：你可以使用 Solaris 8\
  \ 安装程序安装 32 位或 64 位 Solaris 操作系统。在 Sun UltraSPARC 系统上安装时，默认选择 64 位版本，但你也可以选择 32\
  \ 位版本。然而，你可能需要升级某些 UltraSPARC sun4u 平台上的 Flash PROM 以提供 64 位支持。*Solaris 8 Sun 硬件平台指南*提供了有关如何确定特定系统的\
  \ Flash PROM 是否必须升级的信息，并提供了更新 Flash PROM 的步骤。\n\nSolaris 8 至少需要 64MB 内存。最小 Solaris\
  \ 8 软件组（用户系统）的推荐空间为 1.6GB 硬盘空间。对于最大的软件组（带有 64 位支持的完整发行版加 OEM 版），需要 2.4GB 硬盘空间。需要\
  \ CD-ROM 驱动器或适用于网络安装的相应环境。\n\n### Intel 硬件上的 Solaris 8\n\nSolaris 8 可以安装在大多数 Pentium\
  \ 或更高版本的 Intel 兼容 CPU 上，包括 AMD 和 Cyrix 处理器。请参阅*Solaris 8 (Intel 平台版) 兼容列表》，确定特定\
  \ CPU 是否支持其他设备和外设，例如系统总线、磁盘驱动器、CD-ROM 驱动器、磁带驱动器、软盘驱动器、SCSI/PCI 主适配器、图形加速器、网络接口以及键盘/鼠标组件。如果系统没有\
  \ CD-ROM 驱动器或无法从 CD-ROM 驱动器启动，则需要软盘驱动器。\n\nSolaris 8 至少需要 64MB 内存。最小 Solaris 8 软件组（带有\
  \ 32 位支持的用户系统）的推荐空间为 1.6GB 硬盘空间。对于最大的软件组（完整发行版），推荐 2.4GB 硬盘空间。需要 CD-ROM 驱动器或适用于网络安装的相应环境。\n\
  \n## 使用 Web Start 在新系统上安装 Solaris 8\n\n如果你在一个新系统上安装 Solaris 8，优的安装方法是使用 Web Start\
  \ 从本地 CD-ROM 驱动器安装。（网络安装在本章稍后部分简要描述，并在第 21 章中详细介绍）。可以使用命令行界面或图形界面访问 Solaris Web\
  \ Start。\n\n安装在逻辑上分为三个阶段：\n* 准备\n* 配置\n* 软件安装\n\n### 准备\n\n以下列表总结了从本地 CD-ROM 驱动器在\
  \ SPARC 或 Intel 兼容平台上准备安装 Solaris 8 的必要步骤：\n\n1. 验证系统硬件是否支持。对于 SPARC 系统，请参阅*Solaris\
  \ 8 Sun 平台指南》。对于 Intel 兼容系统，请参阅*Solaris 8 (Intel 平台版) 兼容列表*。\n2. 如果系统联网（将连接网络），决定是否使用动态主机配置协议\
  \ (DHCP)。如果不使用，确定主机名、IP 地址和子网掩码信息。\n3. 确定域名。如果使用命名服务，确定服务器主机名和 IP 地址。命名服务的选择有域名系统\
  \ (DNS)、网络信息服务 (NIS) 或 NIS+。\n4. 通过选择软件组（用户、开发、完整发行版或完整发行版加 OEM）并识别主目录所需的额外软件和空间，确定所需的磁盘空间。\n\
  5. 确定安装 Solaris 使用的语言。\n6. 将适当的 Solaris 8 安装 CD-ROM（英文或多语言版）插入 CD-ROM 驱动器。对于无法从\
  \ CD-ROM 驱动器启动的 Intel 兼容设备，将 Solaris 8 设备配置助手软盘插入软盘驱动器。\n7. 开启电源启动系统。\n8. 对于 Intel\
  \ 兼容系统，将运行“设备配置助手”以识别硬件配置。\n9. 如果你使用多语言 CD-ROM，Web Start 安装程序会提示你选择安装期间使用的语言。选择适当的语言。\n\
  10. 对于 SPARC 平台，安装程序提示你选择“初始安装 (Initial Install)”或“升级 (Upgrade)”。选择“初始安装”。\n11.\
  \ 对于 Intel 兼容平台，如果未找到适用于 Solaris 的适当分区，将执行类似于 MS-DOS FDISK 的工具来定义分区。\n12. 安装程序提示你确认重新格式化默认磁盘，请求交换空间的大小，并确认交换空间可以位于磁盘开头（如果找不到交换空间，则提示位置）。安装程序将微根目录和特定平台文件复制到磁盘，然后重启系统。\n\
  13. 对于 SPARC 平台，系统启动后会自动启动 Web Start 界面。\n14. 对于 Intel 兼容平台，安装程序会提示你进行窗口配置（显卡和显示器）并进行测试以确保配置正确。如果没有正确的配置，将无法显示图形界面和\
  \ Solaris 桌面。几秒后，启动 Web Start 界面。\n\n安装进入配置阶段阶段\n\n### 配置\n\n以下步骤使用 Web Start 图形界面收集必要的配置信息。在这一系列屏幕中，通常在当前屏幕上提供所需信息并点击“下一步\
  \ (Next)”按钮后会显示下一个屏幕：\n\n1. 显示欢迎界面。\n2. 在网络连接界面，选择“联网 (Networked)”（如果你不知道网络配置，请联系你的网络管理员）。\n\
  3. 在 DHCP 界面，选择说是启用 DHCP；否则选择否。如果不使用 DHCP：\n    * 在主机名界面，在对话框中输入主机名。\n    * 在 IP\
  \ 地址界面，在对话框中输入系统名的 IP 地址。\n    * 在掩码界面，在对话框中输入子网掩码。\n4. 在 IPv6 界面，选择说是启用 IPv6；否则选择否。\n\
  5. 在命名服务界面，选择 NIS+、NIS、DNS 或无 (None)。如果你选择了一种命名服务：\n    * 在域名界面，在对话框中输入域名。\n   \
  \ * 如果选择了 NIS 或 NIS+，在名称服务器界面，选择“查找一个 (Find One)”或“指定一个 (Specify One)”。如果你选择“指定一个”，将打开名称服务器信息界面，指定服务器主机名和\
  \ IP 地址。\n    * 如果选择了 DNS，在 DNS 服务器地址界面，输入最多三个 IP 地址。\n\n\n\n\n在对话框中输入 DNS 服务器的地址。在\
  \ DNS 搜索列表屏幕上，最多输入六个用于解析对话框中 DNS 查询的域名。如果没有识别到任何域名，则仅搜索为系统指定的域名。\n\n6. 在时区屏幕上，选择指定时区的方法：`Geographic\
  \ Region`（地理区域）、`Offset From GMT`（GMT 偏移）或 `Time Zone File`（时区文件）：\n   - 如果选择 `Geographic\
  \ Region`，将打开 `Geographic Region` 屏幕。选择一个区域或国家以及关联的时区。\n   - 如果选择 `Offset From GMT`，将打开\
  \ `Offset From GMT` 屏幕。移动滑动条直到屏幕显示与 GMT 不同的小时数（加或减）。\n   - 如果选择 `Time Zone File`，将打开\
  \ `Time Zone File` 屏幕。输入时区文件名（通常为 `/usr/share/lib/zoneinfo`）。\n\n7. 在日期和时间屏幕上，在相应的对话框中输入年、月、日、时和分。\n\
  \n8. 在根密码屏幕上，输入 root 账户的密码。\n\n9. 在电源管理屏幕上，选择开启或关闭电源管理，以及是否在每次重启时提示进行选择。\n\n10.\
  \ 在代理服务器配置屏幕上，选择 `Direct Connection To The Internet`（直接连接到）或 `Use Proxy Configuration`（使用代理配置），并输入代理服务器的主机名和端口。\n\
  \n11. 确认信息屏幕总结了您的选择。点击 `Confirm`（确认）继续软件安装阶段，或点击 `Back`（返回）更改一个或多个选择。安装过程将进入软件安装阶段。\n\
  \n## 软件安装\n\n以下步骤使用 `Web Start` 图形界面在带有本地 CD-ROM 驱动器的网络 SPARC 或 Intel 系统上安装 Solaris\
  \ 8 软件。屏幕序列中，通常在您提供当前屏幕所需的信息并点击 `Next`（下一步）按钮后，将显示下一个屏幕：\n\n1. 在欢迎屏幕上，点击 `Next`。安装\
  \ CD 将弹出。\n2. 在插入 CD 屏幕上，在 CD-ROM 驱动器中插入标记为 `Solaris 8 Software 1 of 2` 的 CD-ROM\
  \ 后，点击 `OK`。\n3. 在选择安装类型屏幕上，选择 `Default Install`（默认安装）或 `Custom Install`（自定义安装）。如果选择\
  \ `Default Install`，则跳过步骤 4 到 10；安装将从第 11 步继续。\n4. 在选择软件本地化屏幕上，根据地理区域选择软件本地化。\n\
  5. 在选择系统区域屏幕上，选择初始区域。\n6. 在选择产品屏幕上，选择应安装的任何附加产品（如 `AnswerBook2`）。\n7. 在附加产品屏幕上，如果此时不安装其他产品，请选择\
  \ `None`（无），或选择以下项之一：\n   - 如果选择 `Product CD`（产品 CD），Solaris 8 软件 CD-ROM 将弹出并显示\
  \ `Insert CD` 对话框。在插入要扫描的产品 CD-ROM 后点击 `OK`。将显示 `Scanning CD` 屏幕。扫描 CD-ROM 后，将显示\
  \ `Select Products` 屏幕；它将列出在 CD-ROM 上找到的软件产品。选择要安装的产品。弹出产品 CD-ROM，插入 Solaris 8 软件\
  \ CD-ROM，并点击 `OK`。\n   - 如果选择 `Kiosk Download`（自助机下载），将显示 `Scanning Download` 屏幕。`Web\
  \ Start` 扫描 Kiosk 下载目录（`/webstart/kiosk/download`）后，将显示 `Select Products` 屏幕；它将列出下载目录中找到的软件产品。选择要安装的产品并点击\
  \ `OK`。\n   - 如果选择 `Local Or Network File System`（本地或网络文件系统），将显示 `Specify Network\
  \ File System Path`（指定网络文件系统路径）屏幕。输入应安装的附加产品的相应路径。`Web Start` 扫描指定路径后，将显示 `Select\
  \ Products` 屏幕；它将列出找到的软件产品。选择要安装的产品并点击 `OK`。\n8. 在选择 Solaris Cluster 配置屏幕上，选择所需的软件组。\n\
  9. 在磁盘选择屏幕上，选择另外一个磁盘用于 Solaris 8 软件。\n10. `Lay Out File Systems`（文件布局）屏幕显示默认的文件系统布局。要修改文件系统布局，突出列出的磁盘/文件系统项并点击\
  \ `Modify`（修改）。将打开 `Disk` 对话框，您可以在其中将磁盘上的文件系统分配到不同的分区（slices）和/或修改每个文件系统的大小。点击 `Apply`\
  \ 保存配置并返回到 `Lay Out File Systems` 屏幕。完成磁盘布局修改后，点击 `Next`。\n11. 在 `Ready To Install`（准备安装）屏幕总结了您的选择。点击\
  \ `Install Now`（立即安装）开始安装，或点击 `Back` 更改一个或多个选择。\n12. `Installing…` 屏幕显示消息和进度条以显示软件安装状态。当\
  \ Solaris 8 软件 1 of 2 CD-ROM 的安装完成后，CD-ROM 将弹出。\n13. 安装摘要屏幕显示安装状态。要查看更多信息，点击 `Details`（详情）。\n\
  14. 如果您选择了附加产品，将打开 `Specify Media`（指定介质）屏幕，您可以选择 `CD` 或 `Network File System`（网络文件系统）作为源：\n\
  \   - 如果选择 `CD`，将显示 `Insert CD` 对话框。在插入产品 CD-ROM 后点击 `OK`。将显示 `Reading CD`（读取 CD）、`Launching\
  \ Installer`（启动安装程序）、`Extracting`（提取）和 `Installing`（正在安装）屏幕。\n   - 如果选择 `Network\
  \ File System`，将显示 `Specify Network File System Path`（指定网络文件系统路径）屏幕。输入应安装的附加产品的相应路径。将显示\
  \ `Launching Installer`、`Extracting` 和 `Installing` 屏幕。\n15. 在重启屏幕上，点击 `Reboot`（立即重启）重启系统。\n\
  \n系统重启后，以 root 账户登录并选择 `OpenWindows` 或 `CDE` 作为桌面。您现在已完成网络系统的安装。\n\n## 升级现有 Solaris\
  \ 系统\n\n升级允许将现有系统配置与新的 Solaris 8 操作系统合并。然而，成功升级需要计划和偶尔的人为操作。\n\nSunInstal 和自定义 `JumpStart`（见第\
  \ 21 章）可用于升级。`Web Start` 和标准 `JumpStart` 无法升级旧版本的 Solaris（Solaris 7 或更早版本）。\n\n\
  ### 升级之前\n\n在升级之前，您应该完成以下任务：\n\n1. 检查 Solaris 发布说明，确定 Solaris 8 的任何更改是否影响当前操作。这些信息包括不再\
  \ Solaris 提供的软件或您需要安装的补丁。\n2. 验证硬件符合 `Web Start` 安装准备阶段的描述。\n3. 使用 CD-ROM 或网络安装\
  \ Solaris。根据方法，验证 CD-ROM 驱动器工作正常或网络连接正常。\n4. 某些 Sun 应用程序（如 `DiskSuite`）无法自动升级。在使用软件之前需要进行手动配置。检查应用程序提供的文档。\n\
  5. 如果系统安装了任何第三方软件，请咨询软件供应商以验证该软件可以在 Solaris 8 上运行。您可能需要购买第三方软件的新版本。\n6. 备份现有系统。如果升级失败，您可能需要恢复到现有系统，直到确定并解决失败原因。\n\
  7. 收集升级过程中可能提示的配置信息，例如主机名、网络接口、IP 地址、子网掩码和域名。通过预配置系统配置信息（后文将介绍），可以避免在安装期间响应提示。\n\
  \n\n\n\n8. 准备一个在升级过程中可能需要的备份介质。如果需要重新分配磁盘空间，您需要将文件系统复制到备份介质，然后在调整完系统磁盘上的空间后重新加载它们。可以使用本地设备（如未使用的系统磁盘、磁带或磁盘片）以及远程文件系统作为备份介质。\n\
  \n9. 如果您正在使用 Solaris 8 发行 CD，请将其插入系统 CD-ROM 驱动器。对于无法从 CD-ROM 驱动器引导的 x86 平台，请将设备配置助手（Device\
  \ Configuration Assistant）磁盘片插入 `A:` 驱动器。如果通过网络安装，请设置安装服务器以及可能的启动服务器。\n\n10. 重启系统。\n\
  \n### 升级期间\n\n如果系统磁盘的当前布局没有为升级提供足够的空间，`SunInstall` 将使用自动布局功能根据需要重新定位磁盘空间。如果自动布局失败或您想使用不同的布局，则必须手动指定磁盘布局。\n\
  \n如果系统配置信息没有预先配置，您将在需要提示时提供适当的信息。\n\n### 升级后\n\n现有系统配置与 Solaris 8 操作系统系统的合并可能无法完全成功，您可能需要进行一些手动清理。检查\
  \ `/a/var/sadm/system/data/upgrade_clean` 文件，以确定在重启系统之前需要检查并可能修改的配置问题。解决任何清理问题后，重启系统。\n\
  \n## 预配置系统配置信息\n\n您可以通过两种方式预配置安装所需的系统配置信息：名称服务方法或 `sysidcfg` 文件方法：\n\n- **名称服务方法**——此方法将系统信息添加到可用的名称服务（`NIS`\
  \ 或 `NIS+`）中。在安装期间，从名称服务中检索信息并用于配置系统。这是 SPARC 安装的推荐方法。\n- **Sysidcfg 方法**——此方法创建一个名为\
  \ `sysidcfg` 的文件，其中包含配置信息。该文件必须符合定义的格式（关键字和语法）。该文件必须位于本地驱动器，且远程驱动器的本地磁盘片驱动器必须可以通过网络访问。\n\
  \n## 网络安装\n\n通常情况下，使用本地 CD-ROM 驱动器通过 Solaris 8 发行 CD 安装系统。但是，如果设置了适当的系统，可以通过网络安装软件。这些系统是：\n\
  \n- **安装服务器**——通过将 Solaris 8 发行 CD 的内容复制到其磁盘驱动器中，或者在其 CD-ROM 驱动器中提供发行 CD 而创建的服务器。\n\
  - **启动服务器**——用于启动与安装服务器位于不同子网的客户端。启动服务器应该与客户端位于同一个子网中。\n\n您可以通过使用 `Solstice Host\
  \ Manager` 将系统信息添加（预配置）到 `NIS/NIS+`，或者通过将信息添加到安装服务器或启动服务器的配置文件中来设置网络安装的系统。\n\n##\
  \ 软件包管理\n\nSun Microsystems 和第三方供应商提供的软件都是易于操作的文件集合以及可执行的安装/删除程序，这些被称为*软件包*（packages）。由于根目录和\
  \ `/usr` 文件系统都是本地的，因此可以非常直接地在独立系统或服务器上安装或删除软件包。\n\n## 软件包工具\n\nSolaris 8 软件包工具提供了一个安装和删除软件包的便捷机制。这些是标准的\
  \ Unix 命令，可以通过 `shel` 命令行界面访问。此外，系统管理工具 `admintool(1M)` 提供了一个用于安装和删除包的图形用户界面（GUI）。\n\
  \n最常用的命令行软件包工具是：\n\n- `pkgadd(1M)`——安装软件包\n- `pkginfo(1)` *和* `pkgparam(1)`——显示软件包信息\n\
  - `pkgrm(1M)`——删除软件包\n- `pkgchk(1M)`——检查软件包的安装是否正确\n\n### 使用 `pkgadd` 命令安装软件包\n\n\
  `pkgadd` 命令可以从磁盘或 CD-ROM 安装软件包。通常，通过网络、磁带或磁盘片获取的软件在安装之前会复制到系统上的一个输出目录（spool directory）。默认的软件包输出目录为\
  \ `/var/spool/pkg`，但您可以使用具有足够可用空间的任何位置。\n\n要使用 `pkgadd` 命令安装位于默认输出目录中的一个或多个软件包，只需指定包名作为命令行参数。例如，要安装\
  \ `SUNWast` 软件包，您可以使用以下命令：\n\n```\npkgadd SUNWast\n```\n\n```\nProcessing package\
  \ instance <SUNWast> from </var/spool/pkg>\nUsing </> as the package base directory.\n\
  ## Processing package information.\n## Processing system information.\n1 package\
  \ pathname is already properly installed.\n## Verifying package dependencies.\n\
  ## Verifying disk space requirements.\n## Checking for conflicts with packages already\
  \ installed.\n## Checking for setuid/setgid programs.\nThis package contains scripts\
  \ which will be executed with super-user permission during the process of installing\
  \ this package.\nDo you want to continue with the installation of <SUNWast>?\nInstalling\
  \ Automated Security Tools as <SUNWast>\nInstalling part 1 of 1.\nInstallation of\
  \ <SUNWast> was successful.\n```\n\n如果软件包被转存到系统中的不同目录，您需要使用 `-d` 命令行参数指定备用输出目录。例如，如果使用\
  \ `/tmp` 目录将 `SUNWast` 软件包转存到系统，请使用以下命令：\n\n```bash\npkgadd -d /tmp SUNWast\n```\n\
  \n要安装位于 CD-ROM 上的软件包，使用 `-d` 命令行参数指定 CD-ROM 的路径。例如，可以使用 `pkgadd` 命令从 `/cdrom/cdrom0`\
  \ 安装 `SUNWast`：\n\n```bash\npkgadd -d /cdrom/cdrom0 SUNWast\n```\n\n实际上，`pkgadd`\
  \ 命令不需要包名。如果没有指定包名，`pkgadd` 命令将向您列出指定输出目录或 CD-ROM 上可用的软件包列表。\n\n您使用 `-s` 命令行参数将软件包转存到输出目录而不是安装它。以下命令将\
  \ `SUNWast` 软件包从第二个 CD-ROM 转存到 `/var/spool/pkg` 目录：\n\n```bash\npkgadd -s /var/spool/pkg\
  \ -d /cdrom/sol_8_600_ia_2/Solaris_8/Product SUNWast\n```\n\n当使用默认输出目录时，命令行参数只需指定单词\
  \ *spool* 即可。\n\n### 使用 `admintool` 安装软件包\n\n在启动 `admintool` 命令后，从浏览菜单中选择 `Software`。显示软件窗口，如图\
  \ 3.1 所示。\n\n安装软件包，从编辑菜单中选择 `Add`。显示源介质窗口，您可以在其中选择 CD-ROM 或硬磁盘。图 3.2 显示源介质的软件位置设置为\
  \ CD With Volume Management。其他选项是 CD Without Volume Management 和硬磁盘。如果您正在使用 CD-ROM，请填入正确的\
  \ CD 路径。\n\n如果软件包已转存到磁盘，请将软件位置选择为硬磁盘。\n\n\n\n（如图 3.3 所示），并在必要时指定卷存目录。\n\n60\n\n\
  ![](img/index-62_1.png)\n\n![](img/index-62_2.png)\n\n图 3.3：Admintool：设置源媒体（硬盘）窗口。\n\
  \n选择合适的源媒体后，点击 OK。将打开“添加软件”窗口，如图 3.4 所示。\n\n图 3.4：Admintool：添加软件窗口。\n\n系统列出了 CD-ROM\
  \ 上或卷存目录中的可用软件包。图 3.4 显示了 `/var/spool/pkg`\n目录中的一个软件包，即自动化安全增强工具包。要安装该软件包，请选择软件包标题左侧的复选框并点击“添加”按钮。\n\
  \n`admintool` 命令调用 `pkgadd` 命令并打开一个窗口显示结果。\n\n### 使用 pkginfo 命令获取软件包信息\n\n不带任何命令行参数的\
  \ `pkginfo` 命令会显示已安装软件包的列表。以下示例显示了已安装软件包的部分列表：\n\n```\n# pkginfo\n\nsystem AMImega\
