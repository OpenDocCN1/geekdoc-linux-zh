  \n187\n\n# 第 9 章：文件系统管理\n\n**你需要理解的术语：**\n\n- 文件系统\n- 文件系统的类型\n- Solaris 8 默认文件系统\n\
  - `mkfs`、`mkfs_ufs` 和 `newfs` 命令\n- `fsck` 命令\n- `/etc/mnttab` 和 `/etc/vfstab` 文件\n\
  - `mount` 和 `umount` 命令\n- `mountall` 和 `umountall` 命令\n- `df`、`du` 和 `quot` 命令\n\
  - 文件类型（普通、目录和特殊）\n- 链接类型（符号链接和硬链接）\n- `compress`、`gzip` 和 `zip` 命令\n- `mt` 命令\n\
  - `ufsdump` 和 `ufsrestore` 命令\n- `tar`、`cpio` 和 `find` 命令\n\n**你需要掌握的技巧：**\n\n-\
  \ 创建（制作）文件系统\n- 检查和修复文件系统\n- 挂载和卸载文件系统\n- 监控使用情况\n- 备份和恢复文件系统、目录\n- 恢复根目录或 `/usr`\
  \ 文件系统\n- 识别不同类型的文件\n- 压缩文件和目录\n\n本章的第一部分回顾了文件系统的一些基本信息，包括创建、检查、挂载、卸载和使用监控。第二部分提供了文件和目录概念的概述。第三部分描述了用于备份文件、目录和文件系统的命令。本章涵盖了*文件系统*、*目录*以及*备份与恢复*目标。\n\
  \n188\n\n### 文件系统基础\n\n文件系统*是分区中文件和目录的逻辑集合。当你使其可用（挂载）、检查和修复它时，它可以被视为单个实体。\n\nSolaris\
  \ 8 环境支持的三种文件系统是基于磁盘、基于内存（伪）和基于网络的。第一部分关注磁盘文件系统。第二部分涵盖伪文件系统（第 16 章）和网络文件系统（第 18\
  \ 章）。\n\n磁盘文件系统存储在本地系统的物理磁盘、CD-ROM 和软盘上。表 9.1 列出了磁盘文件系统格式。\n\n表 9.1：磁盘文件系统。\n\n\
  | 格式 |  |\n| :--- | :--- |\n| 高山文件系统 (HSFS) | CD-ROM 文件系统的默认格式 |\n| PC 文件系统 (PCFS)\
  \ | 软盘文件系统的默认格式；相同的磁盘格式 |\n| 通用磁盘格式 (UDF) | 称为数字光盘 (DVD)的光学媒体 |\n| Unix 文件系统 (UFS)\
  \ | 硬文件系统的默认格式 |\n\n伪文件系统是基于内存的，并提供特殊系统信息（如进程）。使用了多种伪文件系统格式，包括系统缓存的 CacheFS、提供替代路径的文件系统\
  \ (LOFS)、临时文件系统 (TMPFS) 和进程文件系统 (PROCFS)。\n\n### Solaris 8 默认文件系统\n\n供 Solaris 8\
  \ 操作系统使用的磁盘空间是挂载文件系统的集合。根目录是挂载根文件系统的位置。挂载其他文件系统的位置称为*挂载点*，通常是根文件系统的子目录，通常用于指代文件系统本身。例如，挂载在\
  \ `/usr` 的文件系统通常被称为*usr 文件系统*。表 9.2 列出了 Solaris 8 操作系统的默认文件系统。\n\n表 9.2：默认文件系统。\n\
  \n| 文件系统用途 | 描述 |\n| :--- | :--- |\n| root (`/`) | 分层文件系统树的顶端。包含关键系统文件，如内核和设备驱动程序。\
  \ |\n| `/usr` | 用于管理和使用系统的文件，如命令和程序。 |\n| `/home` | 用户目录。在某些系统中，可能是 `/export/home`\
  \ 或网络文件系统。 |\n| `/var` | 变化的增长系统文件，如日志、队列和缓冲区。 |\n| `/opt` | 第三方软件和应用程序。 |\n| `/tmp`\
  \ | 每次系统启动时清除的临时文件。 |\n| `/proc` | 活动进程的信息。 |\n\n所有磁盘文件系统都是 UFS。两个内存文件系统（`/tmp`\
  \ 和 `/proc`）分别是类型 `TMPFS` 和 `PROCFS`。\n\n**考试警报** 因为内核文件位于根文件系统中，而系统文件位于 `/usr`\
  \ 文件系统。\n\n### 创建文件系统\n\n你可以使用 `mkfs`、`mkfs_ufs` 和 `newfs` 命令来创建文件系统。`mkfs_ufs`\
  \ 和 `newfs` 命令用于创建 UFS 文件系统。使用 `mkfs` 和 `newfs` 命令可以计算将要使用的参数。使用 `mkfs` 和 `newfs`\
  \ 命令的命令行参数可以计算要创建文件系统。`-N` 命令行选项导致 `newfs` 命令计算将要调用 `mkfs` 命令的参数。`-v` 命令行参数用于预览文件系统参数。此外，另一个\
  \ `newfs` 命令行选项是 `-N`，它导致 `newfs` 命令计算将要使用的参数。大多数 `mkfs` 命令行参数都可以指定为 `newfs` 命令行参数。如果指定了其中任何一个，它们将覆盖任何计算出的参数并传递给\
  \ `mkfs` 命令。详情请参见 `newfs(1M)` 和 `mkfs(1M)` 手页。\n\n如果你直接使用 `mkfs` 命令，你应该包含 `-F` 命令行参数以标识要创建的文件系统类型。如果你没有指定文件系统类型，则默认使用\
  \ `/etc/default/fs` 文件中列出的类型。本地（基于磁盘）文件系统的默认类型是 UFS。\n\n```\nnewfs -v /dev/rdsk/c0d1\n\
  ```\n(y) 在 /dev/rdsk/c0d1 上创建文件系统？\n\n```\nnewfs -v /dev/rdsk/c0d1\n```\n(y) 在 /dev/rdsk/c0d1\
  \ 上创建文件系统？\n\n```\nnewfs -v /dev/rdsk/c0d1\n```\n(y) 在 /dev/rdsk/c0d1 上创建文件系统？\n\
  \n\n\n\n\n# 检查和修复文件系统\n\n当定义文件系统的数据损坏时，文件系统就会损坏。这种损坏可能是由软件错误或底层物理磁盘硬件的故障引起的。\n\n\
  `fsck` (1M) 命令检查（审计）文件系统的逻辑一致性，并尝试进行必要的修复以消除任何不一致性。`fsck` 命令会检查超级块（superblock）、索引节点（inodes）、间接块和目录数据块。\n\
  \n`fsck` 命令通常在文件系统作为系统启动的一部分自动挂载时执行。它也可以手动在一个或多个文件系统上执行。只有对未挂载的文件系统才应该进行检查和修复，因为更改可能会影响访问文件系统的程序，从而导致更严重的损坏。可以指定一个或多个原始逻辑设备名称（分区）作为命令行参数。与\
  \ `mkfs` 命令一样，您应该使用 `-F` 命令行参数来指定正在检查的文件系统类型。以下列表显示了如何使用 `fsck` 命令检查之前创建的 1GB 文件系统：\n\
  \n```\n# fsck -F ufs /dev/rdsk/c0d1s7\n* /dev/rdsk/c0d1s7\n* Last Mounted on\n*\
  \ Phase 1 - Check Blocks and Sizes\n* Phase 2 - Check Pathnames\n* Phase 3 - Check\
  \ Connectivity\n* Phase 4 - Check Reference Counts\n* Phase 5 - Check Cyl groups\n\
  2 files, 9 used, 1019783 free\n#\n```\n\n如果您没有指定 `-F` 命令行参数，则默认使用 `/etc/default/fs`\
  \ 文件中定义的文件系统类型。此外，如果没有指定分区（原始逻辑设备名称），则会检查 `/etc/vfstab` 文件列出的所有文件系统。\n\n考试告警：与创建文件系统的命令一样，`fsck`\
  \ 命令期望原始逻辑设备名称。您可以使用 `fsck` 命令检查和修复 CacheFS、UDF 和 UFS 文件系统。请记住先卸载文件系统。\n\n# 挂载和卸载文件系统\n\
  \n使用 `mount` (1M) 命令使文件系统变得可访问。该命令将文件系统与当前挂载文件系统的一个子目录关联。\n\n`mount` 命令通常带有两个命令行参数调用：与文件系统关联的逻辑块设备名称（分区）以及应该挂载文件系统的挂载点。如果只指定了一个命令行参数（设备名称或挂载点），则会在\
  \ `/etc/vfstab` 文件中搜索匹配参数的条目，如果找到，将使用 `/etc/vfstab` 文件条目的信息挂载文件系统。此外，可以指定 `-F` 命令行来识别挂载的文件系统类型。挂载的文件系统列在\
  \ `/etc/mnttab` 文件中（除非指定了 `-m` 命令行）。如果使用 `mount` 命令时不带任何命令行参数，将显示 `/etc/mnttab`\
  \ 文件列出的所有挂载文件系统。\n\n`mount` 命令支持作为命令行参数指定的多个选项。一个重要的选项是 UFS 大文件支持。默认情况下，UFS 文件系统支持大文件（大于\
  \ 2GB）。此默认设置与指定 `-o largefiles` 作为命令行参数相同。要禁用大文件支持，请在 `mount` 命令中指定 `-o nolargefiles`\
  \ 作为命令行参数。如果指定了此选项且文件系统中存在大文件，则挂载将失败。\n\n表 9.3 列出了 `mount` 命令常用的命令行参数。\n\n表 9.3：选定的\
  \ mount 命令命令行参数。\n\n| 参数 | 用途 |\n| :--- | :--- |\n| `-F type` | 指定文件系统类型（NFS、UFS\
  \ 等） |\n| `-m` | 挂载文件系统不在 `/etc/mnttab` 中创建条目 |\n| `-o` | 指定文件系统特定的选项 |\n| `-p`\
  \ | 列出已挂载的文件系统（简略列表） |\n| `-r` | 以只读模式挂载文件系统 |\n| `-v` | 列出已挂载的文件系统（详细列表） |\n\n\
  可以使用逗号分隔指定多个文件系统特定的选项（`-o`）。一些频繁使用的 UFS 选项包括：\n\n- `atime` — 使用标准的访问时间记录（默认值）。\n\
  - `intr` — 允许通过键盘中断杀死等待文件系统 I/O 的进程（默认值）。\n- `largefiles` — 允许大于 2GB 的文件（默认）。\n\
  - `noatime` — 通过不更新文件访问时间来减少文件系统活动。\n- `nointr` — 不允许通过键盘中断杀死等待文件系统 I/O 的进程。\n-\
  \ `nolargefiles` — 不允许大于 2GB 的文件。如果文件系统中存在此类文件，则挂载将失败。\n- `nosuid` — 禁止在文件上执行 `setuid`。\n\
  - `suid` — 允许在文件上执行 `setuid`（默认值）。\n\n以下（简略）列表显示了 `mount` 命令的使用：\n\n```\n# mount\n\
  /proc on /proc read/write\n/ on /dev/dsk/c0d0s0 read/write/largefiles\n/usr on /dev/dsk/c0d0s0\
  \ read/write/largefiles\n/var on /dev/dsk/c0d0s0 read/write/largefiles\n/opt on\
  \ /dev/dsk/c0d0s0 read/write/largefiles\n/tmp on /dev/dsk/c0d0s0 read/write/largefiles\n\
  # mount -F ufs /dev/rdsk/c0d1s7\n* /dev/rdsk/c0d1s7\n* Last Mounted on\n* Phase\
  \ 1 - Check Blocks and Sizes\n* Phase 2 - Check Pathnames\n* Phase 3 - Check Connectivity\n\
  * Phase 4 - Check Reference Counts\n* Phase 5 - Check Cyl groups\n2 files, 9 used,\
  \ 1019783 free\n#\n# mount\n/proc on /proc read/write\n/ on /dev/dsk/c0d0s0 read/write/largefiles\n\
