  \ SUNWatfsu AutoFS, (Usr)\nsystem SUNWaudd Audio Drivers\nsystem SUNWaudh Audio\
  \ Header Files\nsystem SUNWaudio Audio applications\n.\n.\n.\n#\n```\n\n每个软件软件包都包含一个名为\
  \ `pkginfo` 的文件，其中包含有关软件包的各种信息。该文件还用于存储安装过程中和之后生成的信息，例如安装日期以及应用于该软件包的任何补丁列表。要查看特定软件包的\
  \ `pkginfo` 文件内容，请使用 `pkginfo` 命令并指定 `-l` 命令行参数以及软件包名称。例如，要显示 SUNWast 软件包的 `pkginfo`\
  \ 文件，请使用以下 `pkginfo` 命令：\n\n```\n## pkginfo -l SUNWast\n\nPKGINST: SUNWast\nNAME:\
  \ Automated Security Enhancement Tools\nCATEGORY: system\nARCH: i386\nVERSION: 11.8.0,REV=2000.01.08.18.17\n\
  BASEDIR: /\nVENDOR: Sun Microsystems, Inc.\nDESC: administrative utilities for improving\
  \ system\nsecurity by monitoring or restricting access to\nsystem files and directories\n\
  PSTAMP: catsup20000108183522\nINSTDATE: Jan 13 2001 21:31\nHOTLINE: Please contact\
  \ your local service provider\nSTATUS: completely installed\nFILES: 41 installed\
  \ pathnames\n1 shared pathnames\n8 directories\n29 executables\n232 blocks used\
  \ (approx)\n#\n```\n\n62\n\n![](img/index-64_1.png)\n\n### 使用 admintool 获取软件包信息\n\
  \n通过 `pkginfo` 命令获取的相同信息也可以使用 `admintool` 命令获取。要显示已安装软件包列表，请从“浏览”（Browse）菜单中选择“软件”（Software）。示例列表请参见图\
  \ 3.1。\n\n要查看特定软件包的 pkginfo 文件的选定内容，请在列表中突出显示软件包名称并点击“显示详情”（Show Details）按钮。将显示“软件详情”窗口，如图\
  \ 3.5 所示。\n\n图 3.5：Admintool：软件详情窗口。\n\n**提示** 每个已安装软件包的 `pkginfo` 文件以及与其他软件包相关的文件位于\
  \ `/var/sadm/pkg` 目录下的一个与软件包同名的子目录下。\n\n### 使用 pkgrm 命令删除软件包\n\n`pkgrm` 命令用于删除已安装的软件包。要删除一个或多个软件包，只需指定软件包名称作为命令行参数。例如，要删除\
  \ SUNWast 软件包，请使用以下命令：\n\n```\n# pkgrm SUNWast\n\nThe following package is currently\
