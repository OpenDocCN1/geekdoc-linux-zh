  \ II\n\n## 第 13 章：Solaris 网络环境\n**你需要理解的术语：**\n* OSI 网络模型\n* TCP/IP 网络模型\n* 以太网地址\n\
  * 网络类\n* TCP/IP 配置文件\n* 服务器和客户端\n* 独立工作站\n* 文件服务器\n* 无盘客户端\n* AutoClient\n\n**你需要掌握的技巧：**\n\
  * 在 Solaris 8 系统上配置 TCP/IP\n* 检查远程系统的状态\n* 检查网络接口状态\n* 区分独立、无盘和 AutoClient 配置\n\n\
  本章的第一部分涵盖了基础网络概念，如 OSI 和 TCP/IP 模型，以及 TCP/IP 实现的细节。本章的这部分涵盖了 *Solaris 网络环境* 测试目标。\n\
  \n本章的第二部分涵盖了不同类型 Solaris 8 配置的概念和组件，包括独立系统、无盘客户端和 AutoClient。本章的这部分涵盖了 *客户端/服务器关系*\
  \ 测试目标。\n\n### 网络模型\n尽管多年来开发了各种网络模型，但大多数商用网络使用以下两种模型之一：\n* 开放系统互连 (OSI) 模型\n* 传输控制协议/网协议\
  \ (TCP/IP) 模型\n在这两个模型中，TCP/IP 模型占据主导地位。\n\n### 开放系统互连模型\n由国际标准组织 (ISO) 开发的 OSI 网络模型包含七层。每层负责处理网络通信的一个方面。发送数据时，每层对数据进行处理并将其传递给下一层。接收数据时，每层也对数据进行处理并将其传递给下一层。\n\
  \n这种分层方法允许开发不同类型的处理（服务），而无需开发所有层。新的服务被链接到相应层级的*协议栈*中。ISO/OSI 七层（从低到高）为：\n* **物理层**：第一层关注设备之间的物理接口。它控制物理介质上的比特流传输，并处理物理介质的机械和电气特性。\n\
  * **数据链路层**：第二层提供错误检测和控制。它通过将比特分组成帧并提供同步、错误控制和流量控制为物理层增加了可靠性。基本上，它控制跨网络介质的数据传输。\n\
  * **网络层**：第三层负责确定要通信的系统之间的网络路径。它理解用于连接系统的数据通信和交换技术。\n* **传输层**：第四层提供端到端的错误恢复和流量控制。这些服务为层提供了可靠性，并确保数据无误且按顺序不重复。\n\
  * **会话层**：第五层为应用程序之间的通信提供控制结构。它负责建立、维护和终止连接。\n* **表示层**：第六层处理数据表示或语法的差异。该层在格式之间映射数据，以便应用程序理解数据。\n\
  * **应用层**：第七层提供用户实用程序，如远程登录、文件传输等。\n\n### 传输控制协议/网协议 (TCP/IP) 模型\n与 OSI 网络模型一样，TCP/IP\
  \ 网络模型由一组服务层栈组成。与 OSI 模型不同，它使用五层而不是七层提供了相同的功能。在大多数情况下，OSI 和 TCP/IP 网络的底层四层提供了相似的功能；OSI\
  \ 的顶三层（会话、表示和应用）组成了 TCP/IP 应用层。\n\nTCP/IP 五层（从低到高）为：\n* **物理层**：第一层关注设备之间的物理接口。它控制物理介质上的比特流传输，并处理物理介质的机械和电气特性。\n\
  * **数据链路层**：第二层提供错误检测和控制。它通过将比特分组成帧并提供同步、错误控制和流量控制为物理层增加了可靠性。该层通过一种方式提供系统之间的数据交付\n\
  \n\n\n\n媒体地址或硬件地址，例如以太网或媒体访问控制（MAC）地址。\n\n- **网络层—** 第三层负责在互联网上确定想要通信的系统之间的路径。它理解用于互连系统的数据通信和交换技术。该层管理网络寻址和数据路由，根据分配的网际协议（IP）地址定位远程主机，并确定用于传输数据的数据网络路径（路由）。这一层的数据通常被称为\
  \ `datagrams`（数据报）。\n- **传输层—** 第四层提供端端的错误恢复和流量控制。这些服务为该层提供了可靠性，并确保数据无误、顺序正确且不重复。该层控制数据的交换和流。这一层的数据通常被称为\
  \ `packets`（数据包）。\n- **应用层—** 第五层提供远程登录、文件传输等用户实用程序。这一层的数据通常被称为 `messages`（消息）或\
  \ `streams`（流）。\n\n图 13.1 提供了 OSI 和 TCP/IP 网络模型的对比。\n图 13.1：OSI 和 TCP/IP 网络模型。\n\
  \n# TCP/IP 网络\n\nSolaris 操作系统支持 TCP/IP 网络模型。尽管 Solaris 可以使用多种类型的网络硬件架构（如以太网、令牌环和光纤分布式数据接口\
  \ FDDI）与其他系统通信，但以太网是事实上的网络架构。\n\n## 以太网的特性与功能\n\nTCP/IP 模型的数据链路层控制跨网络介质的数据传输。在以太网局域网（LAN）中，数据链路层使用以太网帧来封装和传输数据。\n\
  \n以太网局域网上的主机被分配与数据链路层相关的唯一地址。这些地址被称为 `Ethernet` 地址、`hardware` 地址、`physical` 物理地址或\
  \ `MAC` 地址。\n\n通常，由制造网络接口卡（NIC）的公司分配这些地址，每个 NIC 关联一个唯一地址。因此，以太网地址与 NIC 相关，而不是与系统。有两个\
  \ NIC 的系统（例如连接到两个网络的路由器）将有两个以太网地址。\n\n以太网地址由 48 位（6 字节数据）组成。通常，以太网地址显示为六个冒号分隔的两位十六进制数。例如，`00:40:05:37:9d:db`\
  \ 是用于生成本书大部分列表的系统的以太网地址。\n\n在局域网上传输的以太网帧包含应该接收并响应该帧的 NIC 以太网地址。局域网上的所有主机都会接收所有传输的以太网帧。任何接收到的、与\
  \ NIC 以太网地址匹配的帧将被读取和处理。\n\n以太网地址仅用于局域网，不通过路由器。因此，任何发送到不在当前局域网主机的以太网帧将使用路由器的以太网地址作为目的地址。同样，从路由器发送到主机的以太网帧将使用路由器的以太网地址作为源地址。\n\
  \n然而，大多数 TCP/IP 应用使用 IP 地址对主机。通常需要将 IP 地址转换为以太网地址。由于每个主机都有唯一的 IP 地址和以太网地址，因此一个过程在这两个地址之间进行映射。\n\
  \n## 地址解析协议与反向 ARP\n\n这种在以太网地址和 IP 地址之间进行映射的过程被称为 `address resolution`。用于从 IP 地址映射以太网地址的协议被称为地址解析协议（ARP）。该过程的细节在意见请求（RFC）\
  \ 826《一种以太网地址解析协议》中规定。\n\n在某些情况下，已知以太网地址但需要确定 IP 地址。这一过程被称为反向地址解析协议（RARP）。该过程的细节在\
  \ RFC 903《一种反向地址解析协议》中规定。\n\n需要解析以太网地址的主机会广播一个 ARP 请求，其中包含 IP 地址作为数据。该消息基本上是在询问：*具有此\
  \ IP 地址的主机的以太网地址是什么？* 注意，ARP 请求是一个以太网广播。这意味着，以太网帧的目的以太网地址为全 F（`FF:FF:FF:FF:FF:FF`）。匹配指定\
  \ IP 地址的主机响应包含其以太网地址的 ARP 回复。该地址是以太网帧数据的一部分。\n\n当已知以太网地址时，使用相同的过程解析 IP 地址。广播一个 RARP\
  \ 请求（目的以太网地址为 `FF:FF:FF:FF:FF:FF`），其数据中包含一个以太网地址。适当的主机响应包含请求 IP 地址的 RARP 回复。\n\n\
  有时系统可能需要代表另一个系统响应 ARP 或 RARP 请求。这一过程被称为 `proxy ARP`；某些协议栈（通常是路由器）设计有这种能力。\n\n##\
  \ IP 网络的分类\n\n在 TCP/IP 网络模型中，传输层的 IP 用于将网络划分为类。最常用的三种 IP 网络类是 A、B 和 C。表 13.1 总结了这些不同\
  \ IP 网络类的特征。\n\n表 13.1：IP 地址分类。\n\n| 类别 | 第一个字节 | 默认子网掩码 | 最大掩码 | 理论主机数 |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| A | 1 到 126 | 255.0.0.0 | 16,777,216 |\n| B |\
  \ 128 到 191 | 255.255.0.0 | 65,536 |\n| C | 192 到 223 | 255.255.255.0 | 256 |\n\n\
  第一个字节为 127 的地址不被视为类 A 或类 B 的一部分。它专门用于称为“回回”（loopback）的特殊用途。子网掩码用于将 IP 地址的网络部分与主机部分分开。\n\
  \n## TCP/IP 配置文件\n\nSolaris 8 使用多个文件来配置 TCP/IP 环境。这些文件用于识别系统的主机名和 IP 地址。以下三个文件用于配置\
  \ TCP/IP：\n\n- `/etc/inet/hosts`\n- `/etc/nodename`\n- `/etc/hostname.interface`\n\
  \n接下来的几节将深入研究这些文件。\n\n### /etc/inet/hosts 文件\n\n`/etc/hosts` 文件（是 `/etc/inet/hosts`\
  \ 的符号链接）包含主机名及其关联 IP 地址的列表。该文件用于将主机名转换为 IP 地址。表 13.2 总结了 `/etc/inet/hosts` 文件的格式。\n\
  \n表 13.2：/etc/inet/hosts 文件格式。\n\n| 列 | 说明 |\n| :--- | :--- |\n| IP 地址 | 点点十进制表示法的\
  \ IP 地址 |\n| 主机名 | 系统的主机名或节点名 |\n| 别名 | 系统的备主机名 |\n\n列由一个或多个制表符或空格分隔。如果定义了多个别名，应使用空格或制表符将它们分开。\n\
  \n**考试警示** 至少，`/etc/inet/hosts` 文件应包含本地主机（IP 地址 `127.0.0.1`）的项目以及系统上安装的每个网络接口的条目。可以为\
  \ `/etc/inet/hosts` 文件添加其他系统的额外条目。如果没有使用名称服务，这样做允许使用主机名而不是 IP 地址访问远程系统。\n\n### /etc/nodename\
  \ 文件\n\n`/etc/nodename` 文件仅包含一个条目：本地系统的默认主机名。您应该根据 RFC 952《DOD 互联网主机表规范》分配主机名或节点名。\n\
  \n### /etc/hostname.interface 文件\n\n系统上安装的每个网络接口都存在一个 `/etc/hostname.interface`\
  \ 文件。\n\n\n\n\n文件名中的 `interface` 部分反映了网络接口的制造厂商和类型。例如，如果一个基于 Intel x86 的系统安装了单个\
  \ 3COM Etherlink III 网络适配器，文件名为 `/etc/hostname.lex0`。对于具有两个网络接口的 SPARC 5 平台，文件名分别为\
  \ `/etc/hostname.le0` 和 `/etc/hostname.le1`。\n\n`/etc/hostname.interface` 文件应只包含一个条目：分配给该接口的主机名或\
  \ IP 地址。\n\n**考试警示**：如果使用了主机名，则该主机名也必须列在 `/etc/inet/hosts` 文件中。还要注意，如果系统上安装了多个网络接口，`/etc/hostname.interface`\
  \ 文件将包含不同的主机名。只有与 `/etc/nodename` 文件中定义的主机名相的主的主名（或 IP 地址）被视为系统的默认主机名。\n\n## 检查网络连接性\n\
  \nSolaris 8 提供了两个命令来检查系统之间的连通性以及两个系统网络接口的正常运行：`ping`(1M) 命令和 `spray`(1M) 命令。\n\n\
  ### ping 命令\n\n`/usr/sbin/ping` 命令使用 Internet 控制消息协议 (ICMP) 向另一个主机发送 `ECHO_REQUEST`\
  \ 数据报。当主机接收到 `ECHO_REQUEST` 数据报时，它会响应一个 `ECHO_REPLY` 数据报。这种基本的回显机制用于验证两个主机之间的连通性，以及两个主机直到\
  \ IP 所在网络层的网络接口和协议栈的正常运行情况。以下列表使用 `ping` 命令发送了一个 ICMP `ECHO_REQUEST` 数据报：\n\n```\n\
  $ /usr/sbin/ping solaris8\nsolaris8 is alive\n$\n```\n\n表 13.3 列出了 `ping` 命令支持的一些更常用的命令行参数。更多详情请参阅\
  \ `ping`(1M) 手册页。\n\n表 13.3：ping 命令行参数。\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `-i interface`\
  \ | 使用指定的接口地址 |\n| `-I interval` | 指定传输之间的间隔（默认为 1 秒） |\n| `-n` | 显示地址而不是主机名 |\n\
  | `-r` | 跳过路由表（远程主机在本地网络上） |\n| `-R` | 在 IP 头中记录路由 |\n| `-s` | 持续发送 ICMP 数据包直到被中断\
  \ |\n| `-t time` | 为 IP 数据包指定生存时间（秒） |\n| `-v` | 显示详细信息（冗余模式） |\n\n至少必须指定主机名或 IP\
  \ 地址。所有这些命令行参数都可以在主机名或 IP 地址之前指定。\n\n当你不带任何命令行参数使用 `ping` 命令时（仅指定主机名），你可以在主机名之后指定一个超时时间。默认超时时间为\
  \ 20 秒。当你配合 `-s` 命令行参数使用 `ping` 时，可以在主机名之后指定数据包大小和计数。以下列表使用 `ping` 命令向 `sparc20`\
  \ 主机发送了五个数据包（每个包包含 60 字节的数据）：\n\n```\n$ /usr/sbin/ping -s sparc20 60 5\nPING sparc20:\
  \ 60 data bytes\n68 bytes from sparc20 (192.168.99.208): icmp_seq=0. time=1. ms\n\
  68 bytes from sparc20 (192.168.99.208): icmp_seq=1. time=0. ms\n68 bytes from sparc20\
  \ (192.168.99.208): icmp_seq=2. time=0. ms\n68 bytes from sparc20 (192.168.99.208):\
  \ icmp_seq=3. time=0. ms\n68 bytes from sparc20 (192.168.99.208): icmp_seq=4. time=0.\
  \ ms\n---sparc20 PING Statistics---\n5 packets transmitted, 5 packets received,\
  \ 0% packet loss\nround-trip (ms) min/avg/max = 0/0/1\n$\n```\n\n### spray 命令\n\n\
  `/usr/sbin/spray` 命令使用远程过程调用 (RPC) 机制向主机发送用户数据报协议 (UDP) 数据包流。在远程，spray 守护进程 `sprayd`(1M)\
  \ 接收这些数据包并确认接收。`spray` 命令与 `sprayd` 程序一起用于验证两个主机之间的连通性，以及两个主机直直到应用层的网络接口和协议栈的正常运行情况。\n\
  \n以下列表使用 `spray` 命令测试网络连通性：\n\n```\n$ /usr/sbin/spray sparc20\nsending 1162 packets\
  \ of length 86 to sparc20 …\n706 packets (60.757%) dropped by sparc20\n1801 packets/sec,\
  \ 154924 bytes/sec\n$\n```\n\n表 13.4 列出了 `spray` 命令支持的命令行参数。更多详情请参阅 `spray`(1M)\
  \ 手册页。\n\n表 13.4：spray 命令行参数。\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `-c count` | 发送的数据包数量\
  \ |\n| `-d delay` | 数据包之间的微秒延迟 |\n| `-l length` | 数据包长度（KB） |\n| `-t type` | 传输类型（UDP）\
  \ |\n\n## 查看网络接口配置和统计\n\n提供了两个命令查看网络接口配置和统计信息：`ifconfig` 和 `netstat`。\n\n### netstat\
  \ 命令\n- `-a`: 列出所有套、路由表项和网络接口的状态。\n- `-D`: 列出 DHCP 配置的网络接口状态。\n- `-f family`: 仅列出指定协议族的信息。可以是\
  \ `inet` (IP v4)、`inet6` (IP v6) 或 `unix` (Unix)。\n- `-g`: 列出每个接口的多组成员。\n- `-i`:\
  \ 列出所有网络接口的统计信息。\n- `-I interface`: 仅列出指定网络接口的统计信息。\n- `-m`: 列出 STREAMS 统计。\n- `-M`:\
  \ 显示多组路由表。\n- `-n`: 显示网络地址而不是网络名称。\n- `-p`: 显示每个接口的硬件（以太网）地址。\n- `-P protocol`:\
  \ 仅列出指定协议的统计信息。\n- `-r`: 显示动态路由表。\n- `-s`: 列出按协议的统计。\n- `-v`: 列出额外的套和路由表信息。\n\n\n\
  \n\n\n考试注意：你可以使用 `ifconfig` 或 `netstat -p` 命令来显示与网络接口相关的以太网地址。\n\n## 开放网络计算 (ONC)\
  \ 和远程过程调用机制\n\nSun Microsystems 开发了一个支持分布式服务的环境。该环境被称为 Sun 的开放网络计算增强 (ONC+) 技术。ONC+\
  \ 技术是一系列技术、服务和工具的集合。其主要组件包括：\n\n- `Applications`——网络文件系统 (`NFS`) 和网络信息服务增强 (`NIS+`)\
  \ 服务。它们使用 `RPCs` 完成客户端与服务器之间的交互。\n- `远程过程调用 (RPC)`——一种允许客户端请求远程服务器执行过程或处理的机制。\n\
  - `外部数据表示 (XDR)`——一种与机器无关的数据表示方法。客户端和服务器都将数据转换为 `XDR` 格式或从该格式转换。该机制为所有数据提供了标准格式，以克服不同硬件架构之间数据字节顺序、数据类型大小和字节对齐的差异。\n\
  - `传输层接口 (TLI)`——一个指向 `TCP/IP` 的接口，允许 `RPC` 机制具有协议无关性。你可以选择面向连接的协议（如 `TCP`）或无连接的协议（如\
  \ `UDP`），而无需更改客户端或服务器代码。\n- `Sockets`——另一种可用于 `TCP/IP` 接口的机制，支持协议无关的客户端和服务器编程。\n\
  \n在 `TCP/IP` 模型中，所有的 `ONC+` 组件都位于应用层。从 OSI 模型来说，这些组件分布在会话层 (`RPC`)、表示层 (`XDR`) 和应用层\
  \ (`NFS` 和 `NIS+`)。请注意，应用程序调用 `XDR` 例程来翻译数据。一旦翻译完成，数据要么在本地处理，要么传递给 `RPC` 例程以发送到远程系统。\n\
  \n## 注册 RPC 服务\n\n为了让系统使用基于 `RPC` 构建的分布式服务，提供服务的程序必须被识别（注册）。`rpcbind`(1M) 守护进程管理系统上的\
  \ `RPC` 服务。每个 `RPC` 程序都被分配一个唯一的数字。当 `RPC` 程序启动时，它会联系本地的 `rpcbind` 守护进程并提供其 `RPC`\
  \ 程序号、版本等。当远程客户端尝试使用本地 `RPC` 服务时，它会联系本地 `rpcbind` 守护进程以获取有关服务的信息（基于 `RPC` 程序号），并请求建立服务的连接。因此，`rpcbind`\
  \ 守护进程为本地服务提供了注册可用性的方法，为远程客户端提供了识别服务并建立连接的方法。你可以使用 `rpcinfo`(1) 命令联系本地或远程的 `rpcbind`\
  \ 守护进程，并请求其列出当前注册的 `RPC` 服务。以下列表使用 `rpcinfo` 命令列出本地服务，并由于远程主机名被指定为命令行参数，列出了远程系统上的服务：\n\
  \n```\n# rpcinfo\nprogram version netid address service owner\n100000 4 ticots solaris8.rpc\
  \ rpcbind superuser\n100000 3 ticots solaris8.rpc rpcbind superuser\n100000 4 ticotsord\
  \ solaris8.rpc rpcbind superuser\n100000 3 ticotsord solaris8.rpc rpcbind superuser\n\
  100000 4 ticlts solaris8.rpc rpcbind superuser\n100000 3 ticlts solaris8.rpc rpcbind\
  \ superuser\n100000 4 tcp 0.0.0.0.0.111 rpcbind superuser\n100000 3 tcp 0.0.0.0.0.111\
  \ rpcbind superuser\n100000 2 tcp 0.0.0.0.0.111 rpcbind superuser\n100000 4 udp\
  \ 0.0.0.0.0.111 rpcbind superuser\n.\n.\n.\n\n# rpcinfo sparc20\nprogram version\
  \ netid address service owner\n100000 4 ticots sparc8.rpc rpcbind superuser\n100000\
  \ 3 ticots sparc8.rpc rpcbind superuser\n100000 4 ticotsord sparc8.rpc rpcbind superuser\n\
  100000 3 ticotsord sparc8.rpc rpcbind superuser\n100000 4 ticlts sparc8.rpc rpcbind\
  \ superuser\n100000 3 ticlts sparc8.rpc rpcbind superuser\n100000 4 tcp 0.0.0.0.0.111\
  \ rpcbind superuser\n100000 3 tcp 0.0.0.0.0.111 rpcbind superuser\n100000 2 tcp\
  \ 0.0.0.0.0.111 rpcbind superuser\n100000 4 udp 0.0.0.0.0.111 rpcbind superuser\n\
  .\n.\n.\n```\n\n`RPC` 服务通常列在 `/etc/rpc` 文件中。该文件列出了常见的 `RPC` 服务名称、其 `RPC` 程序号以及任何别名。更多信息请参阅\
  \ `rpc`(4) 手册页。\n\n## 控制网络服务\n\n大多数的互联网和 `RPC` 服务由 `inetd`(1M) Internet 服务守护进程自动管理。这些服务被指定为\
  \ `/etc/inet/inetd.conf` 文件（或 `/etc/inetd.conf`，它是指向 `/etc/inet/inetd.conf` 的符号链接）中的条目。\n\
  \n由 `inetd` 守护进程控制的互联网和 RPC 服务在系统启动时自动启动，你也可以执行 `/etc/init.d/inetd start` 命令手动启动它们。同样，所有由\
  \ `inetd` 守护进程控制的互联网和 RPC 服务在系统关闭时自动停止，你也可以执行 `/etc/init.d/inetd stop` 命令手动停止它们。\n\
  \n你可以通过 `kill` 命令向提供服务的进程发送信号来停止单个互联网和 RPC 服务。然而，应该重新配置 `inetd` 守护进程，使其不会重试重启服务。\n\
  \n要重新配置 `inetd` 守护进程，请编辑 `/etc/inet/inetd.conf` 文件并删除该服务的条目。然后使用 `kill` 命令向 `inetd`\
  \ 守护进程发送挂断信号 (SIGHUP)。此信号将导致 `inetd` 守护进程重新读取 `/etc/inet/inetd.conf` 文件。你也可以使用（如前所述）`/etc/init.d/inetd`\
  \ 脚本来停止并重启 `inetd` 守护进程，或者你可以重启系统。\n\n## Solaris 网络环境\n\nSolaris 8 网络环境支持几种不同的系统配置，包括独立式（standalone）、无盘启动式和\
  \ AutoClient。这些配置提供了不同的功能，并影响部署和支持成本。\n\n### 独立式配置\n\n*独立式（standalone）系统拥有本地磁盘空间，用于存储所有的操作系统文件、应用程序和用户数据。这些数据包括根\
  \ `/`、`/usr`、`/export/home` 和 `/var` 文件系统。同样，它为系统的虚拟内存提供了本地交换空间。独立式系统可以自主运行，可以是联网的也可以是未联网的。你可以将网络化的独立式系统作为服务器（例如文件服务器），提供对共享或公共数据的远程访问。\n\
  \n### 文件服务器概念\n\n*文件服务器（file server）是一个作为服务器运行的独立式系统，允许客户端通过网络访问文件。有几类文件服务器。\n\n\
  Solaris 环境中一种重要的文件服务器类型是*操作系统 (OS) 服务器*。OS 服务器为那些无法通过本地硬盘文件系统获取全部或部分操作系统文件的客户端系统提供访问。\n\
  \nOS 服务器可以同时支持多个版本的操作系统。这不仅包括不同的操作系统版本（例如 Solaris 8、Solaris 7 和 SunOS 2.5），还包括不同的硬件平台（如\
  \ SPARC 和 Intel x86 兼容机）。\n\n### 无盘配置\n\n*无盘客户端（diskless client）*正如其名，没有用于本地存储操作系统或应用程序的硬盘。存储由可通过网络访问的*无盘客户端服务器*提供。为了让无盘客户端启动并运行，必须从\
  \ OS 服务器远程挂载其根 `/` 和 `/usr` 文件系统。\n\n除了通过网络为所有相同版本的无盘客户端提供一组通用的操作系统文件外，OS 服务器还提供分配供使用的硬盘空间用于\n\
  \n\n\n\n每个客户端都使用交换空间（swap space）。该磁盘空间用于无盘客户端虚拟内存系统的交换空间，以及每个无盘客户端特有的用户账户 `/home`\
  \ 文件系统。\n\n与独立配置（standalone configuration）相比，无盘配置更便宜且更容易维护，因为只有极少数的系统（OS 服务器）需要硬盘。公共文件只需要一份副本，并且该副本在许多客户端之间共享。此外，每个客户端特有的数据都存储在\
  \ OS 服务器上，简化了备份和恢复程序。\n\n由于客户端上不存储任何数据，因此客户端硬件可以轻松更换或升级。无盘配置的主要缺点是对网络的依赖以及给网络带来的负载。如果无盘客户端无法通过网络访问\
  \ OS 服务器，它无法运行。此外，由于所有数据（包括交换空间中的数据）都是远程访问的，即使在正常运行条件下，网络负载极大。\n\n## AutoClient\
  \ 配置\n\n`AutoClient` 与无盘客户端相似，但它具有有限的本地存储空间（至少 100MB）。与无盘客户端一样，`AutoClient` 必须从配置为\
  \ AutoClient 服务器的 OS 服务器远程访问其根目录 `/` 和 `/usr` 文件系统。与无盘客户端不同，`AutoClient` 使用本地磁盘空间来存储或缓存根\
  \ `/` 和 `/usr` 文件系统。\n\n此外，本地硬盘被用于交换空间。与无盘配置一样，OS 服务器为每个无盘客户端特有的 `/home` 和 `/var`\
  \ 文件系统提供磁盘空间。\n\n与无盘配置相比，`AutoClient` 配置的略贵一些，因为它的客户端需要硬盘；但硬盘很小。与无盘配置一样，公共文件只需要一份副本，并且该副本在客户端之间共享。此外，每个客户端特有的数据都存储在\
  \ OS 服务器上，简化了备份和恢复程序。因此，在客户端硬件方面，`AutoClients` 与无盘客户端一样可以轻松地更换或升级。\n\n`AutoClient`\
  \ 配置减少了（在某些情况下消除了）无盘配置的缺点。在 `AutoClient` 缓存了操作系统后，它不再需要为了这些文件访问 OS 服务器。此外，本地交换空间消除了很大一部分网络负载。\n\
  \n## 配置比较\n\n表 13.6 提供了 Solaris 8 网络环境中支持的各种系统配置之间显著差异的比较。\n\n### 表 13.6：系统配置比较。\n\
  \n| 系统类型 | 本地交换 | 本地文件系统 | 远程文件 |\n| :--- | :--- | :--- | :--- |\n| 独立系统 | 是 | `root`,\
  \ `/usr`, `/var` | 无 (`/export/home`) |\n| 无盘客户端 | 否 | 无 | `root`, `/usr`, `/var`,\
  \ `/home` |\n| AutoClient | 是 | `root`, `/usr` | `/var`, `/home` |\n\n作为服务器的独立系统通常提供文件系统——例如\
  \ `/export/root`、`/export/home` 和 `/export/swap`——用于存储无盘客户端和 AutoClient 远程访问的文件。此外，服务器和独立系统提供用于存储应用程序软件的\
  \ `/opt` 文件系统。\n\n### 练习题\n\n### 问题 1\n下列可以作为文件服务器？\na. AutoClient\nb. 无盘客户端\nc.\
  \ 非网络独立系统\nd. 网络连接独立系统\n\n**答案 d 正确。** 网络连接独立系统同时满足文件服务器的两个基本要求：它是联网的，并且它有存储空间。`AutoClient`\
  \ 只有少量的本地存储空间。因此，答案 a 错误。无盘客户端没有任何本地存储空间。因此，答案 b 错误。非网络独立系统没有联网，且无法将其存储空间提供给其他系统。因此，答案\
  \ c 错误。\n\n### 问题 2\nTCP/IP 网络模型有多少层？\na. 4\nb. 5\nc. 6\nd. 7\n\n**答案 b 正确。** TCP/IP\
  \ 网络模型有五层。这些层（从下到上）分别是物理层、数据链路层、网络层、传输层和应用层。OSI 网络模型有七层。\n\n### 问题 3\n输入显示网络统计信息的命令名称。\n\
  \n正确答案是 `netstat`。\n\n### 问题 4\n下列哪些具有本地交换空间？[选择所有适用]\na. 非网络独立系统\nb. AutoClient\n\
  c. OS 服务器\nd. 无盘客户端\ne. 网络连接独立系统\n\n**答案 a, b, c 和 e 正确。** 非网络独立系统、`AutoClient`、OS\
  \ 服务器和网络连接独立系统都拥有用于交换空间的本地硬盘。只有无盘客户端没有本地硬盘，因此无法拥有本地交换空间。因此，答案 d 错误。\n\n### 问题 5\n\
  下列哪些命令可以确定网络接口的以太地址？[选择所有适用]\na. `ifconfig -a`\nb. `netstat -a`\nc. `netstat -p`\n\
  d. `netstat -r`\ne. `netstat -e`\n\n**答案 a 和 c 正确。** `ifconfig -a` 和 `netstat -p`\
  \ 命令可以确定网络接口的以太地址。`netstat -a` 显示套接字的信息。因此，答案 b 错误。`netstat -r` 显示路由表。因此，答案 d 错误。`netstat\
  \ -e` 不存在。因此，答案 e 错误。\n\n### 问题 6\n下列哪些层位于 OSI 网络模型的传输层和应用层之间？[选择所有适用]\na. 会话层\n\
  b. 数据链路层\nc. 表示层\nd. 网络层\n\n**答案 a 和 c 正确。** 会话层提供连接管理，表示层提供数据映射。数据链路层和网络层位于传输层之下。因此，答案\
  \ b 和 d 错误。\n\n### 问题 7\n下列哪个陈最能描述 RARP？\na. 使用 IP 地址确定以太地址。\nb. 使用以太地址确定 IP 地址。\n\
  c. 使用 IP 地址确定网络掩码。\nd. 使用 IP 地址确定硬件地址。\ne. 使用以太地址确定网络掩码。\n\n**答案 b 正确。** RARP 使用以太地址确定\
  \ IP 地址。ARP 使用 IP 地址确定以太地址或硬件地址。因此，答案 a 和 d 错误。两者都不用于确定网络掩码。因此，答案 c 和 e 错误。\n\n\
  ### 问题 8\n输入与 `/etc/hosts` 文件建立符号链接的文件名称。\n\n正确答案是 `/etc/inet/hosts`。\n\n## 想了解更多吗？\n\
  \nFinlayson, Mann, Mogul, and Thelmer, Request For Comment 903: “反向地址解析协议”（1984\
  \ 年 6 月）。可用于 `www.nic.com/ftp/rfc/rfc903.txt`。\n\nPlummer, David, Request For Comment\
  \ 826, “一种以太地址解析协议”（1982 年 11 月）。可用于 `www.nic.com/ftp/rfc/rfc826.txt`。\n\n\n\n\n\
  \nSun Microsystems，*系统参考手册，第 1M  - 管理命令*。提供纸质版（部件号 806-0625-10）、Web 上的 `docs.sun.com`，以及随\
  \ Solaris 8 操作系统提供的在线文档 AnswerBook2。\n\n# 第 14 章：Syslog 和审计实用程序\n\n### 你需要理解的术语：\n\
  - `syslog` 设施\n- `syslog` 源设施\n- `syslog` 严重性级别\n- `m4` 宏\n- `logger` 命令\n- `who`、`whodo`\
  \ 和 `lastlogins` 命令\n\n### 你需要掌握的技巧：\n- 配置 `syslog` 设施\n- 启用 syslog 消息以跟踪 root 登录账户的使用情况\n\
  - 使用 `who`、`whodo` 和 `last` 命令审计登录账户的使用\n\n本章的第一部分介绍了 Solaris 8 `syslog` 设施。该机制提供了在本地或远程系统上的一个或多个文件中记录用户和系统消息的能力。本章涵盖了\
  \ *Solaris Syslog* 测试目标。\n\n本章的第二部分描述了三个用于审计登录账户使用的命令（`who`、`whodo` 和 `last`）。\n\
  \n## syslog 设施\n`syslogd`(1M) 命令接受来自系统（内核和设备驱动程序）和用户程序发送给它的消息，并根据 `/etc/syslog.conf`\
  \ 文件中的目对其进行处理。这些消息可以报告从紧急情况到调试细节的任何内容。用途包括监控登录和记录黑客尝试。通常，`syslogd` 命令将这些消息写入指定的日志文件，但也支持其他处理选项。syslog\
  \ 消息根据其源（*源设施*）和优先级或*严重性级别*进行分类。\n\n### 源设施\n为了对日志消息的处理提供更好的控制，可以使用生成消息的设施来确定消息发送或存储的位置。因此，你可以根据源为不同类型的消息维护单独的日志文件。表\
  \ 14.1 列出了 `/etc/syslog.conf` 文件中识别消息源和控制处理的关键字。\n\n**表 14.1：syslog 源设施。**\n\n|\
  \ 关键字 | 说明 |\n| :--- | :--- |\n| `auth` | 登录身份验证 |\n| `cron` | `at`(1) 和 `cron`(1M)\
  \ 命令 |\n| `daemon` | 系统守护进程 |\n| `kern` | 内核 |\n| `lpr` | 线路打印机溢出系统 |\n| `local0`\
  \ 到 `local7` | 由本地定义 |\n| `mail` | 系统邮件 |\n| `mark` | `syslogd`(1M) 产生的时间戳 |\n|\
  \ `news` | USENET 网络新闻系统 |\n| `user` | 用户程序 |\n| `uucp` | UUCP 系统 |\n| 除 `mark`\
  \ 以外的所有设施 |\n\n`user` 设施是默认设施，如果 syslog 消息中的源未指定设施关键字，则使用该设施。\n\n### 优先级（严重性）级别\n\
  除了源设施外，syslog 消息还可以通过优先级或严重性来识别。这种识别机制为根据重要性处理消息提供了第二种机制（粒度更细）。表 14.2 列出了 `/etc/syslog.conf`\
  \ 文件中用于识别消息严重性并控制处理的关键字。这些关键字根据严重性程度进行排序（从最严重到最不）。\n\n**表 14.2：syslog 严重性级别。**\n\
  \n| 关键字 |  |\n| :--- | :--- |\n| `emerg` | 紧急状态 |\n| `alert` | 需要立即关注的情况 |\n| `crit`\
  \ | 关键性状况 |\n| `err` | 其他错误 |\n| `warning` | 警告消息 |\n| `notice` | 可能需要特殊处理的情况 |\n\
  | `info` | 非紧急信息 |\n| `debug` | 通常由程序中的调试消息生成 |\n| `none` | 用于防止记录指定源生成的消息的特殊关键字\
  \ |\n\n## 自定义系统消息处理\n为了控制 syslog 消息的处理，你可以在 `/etc/syslog.conf` 文件中添加条目。这些条目采用一个或多个设施/严重性关键字组合的形式，后跟一个制表符和一个操作。设施和严重性识别特定的源设施和消息严重性，而操作决定了如何处理消息。设施/关键字和/或操作可以使用\
  \ `m4`(1) 宏进行可选定义，该宏用于判断当前系统是否配置为 syslog 主机。\n\n### 设施/严重性关键字组合\n设施和严重性关键字由点号 (`.`)\
  \ 分隔，识别特定的源设施和消息严重性。例如，`kern.emerg` 识别来自内核的紧急错误消息。\n\n存在三种特殊情况：\n- 指定了设施关键字但后面没有跟点号和严重性关键字。该关键字用于识别所有级别的严重性。例如，如果单独指定了设施关键字\
  \ `mail`，则处理邮件消息的所有严重性级别。\n- 设施关键字后跟一个点号和 `none` 严重性关键字。这种组合指定不处理来自指定设施的任何消息。例如，`mail.none`\
  \ 表示不处理任何邮件消息。\n- 使用星号 (`*`) 设施。该设施指定应处理所有源设施（`mark` 设施除外）。例如，`*.notice` 表示发送到 syslog（来自\
  \ `mark` 以外的所有源）的所有 `notice` 级消息都应被处理。\n\n你可以在 `/etc/syslog.conf` 条目中通过分号 (`;`)\
  \ 字符分隔，从而指定多个一个设施/严重性组合。\n\n### 操作\n每个条目都有一个关联的操作。表 14.3 列出了操作的四种形式。\n\n**表 14.3：syslog\
  \ 操作。**\n\n| 操作 | same |\n| :--- | :--- |\n| `/*filename` | 将识别出的 syslog 消息追加到指定文件中（必须以斜杠\
  \ `/` 字符开头）。 |\n| `@host` | 将识别出的 syslog 消息转发到指定远程主机上的 `syslogd` 守护进程（必须以 `@` 字符开头）。\
  \ |\n| `login account` | 如果指定的账户当前登录系统，则将识别出的 syslog 消息写入指定登录账户关联的标准输出（通常是显示器）。可以指定多个登录账户（用逗号分隔）。\
  \ |\n| | 将识别出的 syslog 消息写入当前登录系统的所有登录账户的标准输出。 |\n\n### 由 m4 宏控制的可选条目\n你可以在设施/关键字列或操作列中使用指定的\
  \ `m4` 宏 `ifdef(condition, define_if_true, define_if_false)` 在 `/etc/syslog.conf`\
  \ 文件中定义可选条目。\n\n`ifdef()` 宏提供了一个条件控制语句。如果 `condition` 为真，则生效 `define_if_true` 表达式。否则，生效\
  \ `define_if_false` 表达式。\n\n对于 `/etc/syslog.conf` 文件，唯一相关的 `condition` 是 `LOGHOST`\
  \ 关键字。该关键字用于确定本地系统在 `/etc/hosts` 文件中是否有 `loghost` 别名。该别名表示关联主机配置为存储本地 syslog 消息以及可能的来自远程主机的\
  \ syslog 消息。以下 `/etc/hosts` 条目显示 solaris8 系统标识为 **loghost**：\n\n```\n192.168.99.8\
  \ solaris8 loghost\n```\n\n下行显示了在 `/etc/syslog.conf` 文件的操作列中使用 `m4` `ifdef` 宏的典型示例：\n\
  \n```\nauth.notice ifdef('LOGHOST', /var/log/authlog, @loghost)\n```\n\n该条目指定对于\
  \ `auth.notice` 消息，如果本地系统在 `/etc/hosts` 文件中识别为 `loghost`，则将其添加到 `/var/log/authlog`\
  \ 文件。或者，如果本地系统未识别为 `loghost`，则将消息转发到识别为 `loghost` 的系统。\n\n\n\n\n以下列表显示了使用 `m4` `ifdef`\
  \ 宏，根据本地系统是否为 `loghost` 来可选地定义整个 `/etc/syslog.conf` 文件条目：\n\n```m4\nifdef('LOGHOST',\
  \ ,\n\nuser.err /dev/sysmsg\n\nuser.err /var/adm/messages\n\nuser.alert 'root, operator'\n\
  \nuser.emerg *\n\n)\n```\n\n该宏指定，如果本地系统被定义为 `loghost`，则不执行任何操作（即 `define_if_true`\
  \ 表达式为空）。如果本地系统不是 `loghost`，则应本地处理 `user.err`、`user.alert` 和 `user.emerg` 消息。\n\n\
  ## `/etc/syslog.conf` 文件\n\n`/etc/syslog.conf` 文件中的条目决定了 syslog 消息的处理方式。`syslogd`\
  \ 守护进程每次启动或接收到 `SIGHUP`(1) 信号时都会读取 `/etc/syslog.conf` 文件。表 14.4 汇总了本地记录消息的系统的默认\
  \ syslog 消息处理（`/etc/syslog.conf` 内容）。也包含了之前描述的用于 `user` 消息的 `m4` 宏。\n\n表 14.4：默认\
  \ `/etc/syslog.conf` 文件。\n\n| 设施/严重 | 操作 | 描述 |\n| :--- | :--- | :--- |\n| `.err;kern.notice;`\
  \ | `/dev/sysmsg` | 所有 `error`、`kernel.notice`、`auth.notice` 和 `auth.notice` 消息都写入\
  \ `/dev/sysmsg` 文件。 |\n| `.err;kern.debug;` | `/var/adm/messages` | 所有 `error`、`kern.debug`、`daemon.notice;``daemon.notice`\
  \ 和 `mail.crit` `mail.crit` 消息都写入 `/var/adm/messages` 文件。 |\n| `.alert;kern.err;`\
  \ | operator | 所有 `alert`、`kern.err` 和 `daemon.err` `daemon.err` 消息写入 operator 登录账户（如果当前登录）。\
  \ |\n| `.alert` | root | 所有 `alert` 消息写入 root 账户（如果当前登录）。 |\n| `.emerg` | * | 所有\
  \ `emerg` 消息写入所有当前登录的账户。 |\n\n复习习提示：除非存在针对特定设施/严重性组合的条目，否则使用该特定组合生成的消息将被丢弃。请小心不要删除任何现有条目，除非这些消息正在由新条目处理。最常用的默认日志文件是\
  \ `/var/adm/messages`。\n\n## 由 `logger` 命令生成的消息\n\n`logger`(1) 命令可以用于用户、shell 脚本或程序生成\
  \ syslog 消息。表 14.5 列出了 `logger` 命令的命令行参数。\n\n表 14.5：`logger` 命令的命令行参数。\n\n| 参数 |\
  \ 描述 |\n| :--- | :--- |\n| `message` | 指定消息文本。 |\n| `-f file` | 使用 `file` 内容作为消息。\
  \ |\n| `-i` | 在每条消息中包含 `logger` 命令的进程 ID (PID)。 |\n| `-p priority` | 指定消息优先级，格式为\
  \ `facility.level` 或数字。默认为 `user.notice`。 |\n| `-t tag` | 在每条消息中包含 `tag`。 |\n\n\
  以下示例使用 `logger` 命令记录具有 `user.err` 优先级的消息：\n\n```bash\n$ logger -p user.err \"This\
  \ is a user error\"\n$ tail /var/adm/messages\nMar 31 20:09:38 solaris8 su: [ID\
  \ 810491 auth.crit]\n'su root' failed for dla on /dev/pts/5\nMar 31 20:20:31 solaris8\
  \ su: [ID 810491 auth.crit]\n'su root' failed for dla on /dev/pts/5\nMar 31 20:38:12\
  \ solaris8 su: [ID 810491 auth.crit]\n'su dla' failed for dla on /dev/pts/7\nApr\
  \ 19 00:41:02 solaris8 dla: [ID 702911 user.error]\nThis is a user error\n#\n```\n\
  \n## 由 `login` 命令生成的消息\n\n`login`(1) 命令用于登录系统，可以配置为当 root 账户登录系统时生成 `auth.notice`\
  \ syslog 消息。此外，多次尝试以 root 登录会被记录为 `auth.crit` syslog 消息。如果 `/etc/default/login`\
  \ 文件包含以下条目，则 `login` 命令将生成这些消息：\n\n```text\nSYSLOG=YES\n```\n\n## 由互联网服务生成的消息\n\n\
  互联网服务守护进程 `inetd`(1M) 用于启动标准互联网服务，可以配置为通过记录客户端 IP 地址、TCP 端口号和内核名称作为 `daemon.notice`\
  \ syslog 消息来跟踪传入的 TCP 连接。要启用此记录，请在 `/etc/default/login` 文件中为 `inetd` 命令添加 `-t` 命令行参数。\n\
  \n## 审计账户和进程\n\n有多个命令可以监控系统使用情况。此外，你可以使用 `w` 命令识别当前正在运行的进程。\n\n## `w` 命令\n\n你可以使用\
  \ `w` 命令来确定当前登录的账户。在不带参数的情况下，`w` 命令列出用户名、设备、登录时间和空闲时间。以下输出显示了当前登录的用户：\n\n```bash\n\
  $ w\nUSER             FROM             LOGIN@TIME    IDLE   WHAT\nroot         \
  \    .                18:57             0.00s /bash\n```\n\n## `whodo` 命令\n\n`whodo`(1)\
  \ 命令显示用户正在执行什么。你可以使用此命令确定系统上正在运行的进程。以下显示了 `whodo` 命令的部分输出：\n\n```bash\n$ whodo\n\
  USER             FROM             LOGIN@TIME    IDLE   WHAT\nroot             .\
  \                18:57             0.00s /bash\ndla              192.168.1.10  \
  \   20:02             w\n```\n\n## `last` 命令\n\n`last`(1) 命令显示登录和注销信息。你可以使用此命令确定哪些账户已登录，并显示账户最后使用的时间（从最近开始）。以下显示了\
  \ `last` 命令的部分输出：\n\n```bash\n# last\ndla ftp winnt40 Apr 6 02:10 - 02:33 (5+00:22)\n\
  root console :0 Wed Apr 4 18:57 still logged in\nreboot system boot Wed Apr 4 18:56\n\
  root console :0 Wed Apr 4 18:52 - 18:53 (00:01)\nreboot system boot Wed Apr 4 18:51\n\
  root console :0 Tue Apr 3 21:46 - 18:49 (21:02)\n```\n\n如列表所示，`dla` 账户于 4 月 6 日\
  \ 2:10 登录 `winnt40` 系统并在同一天的 2:33 注销。列表还显示 `root` 账户仍处于登录状态。要列出特定登录账户的信息，可以将账户名称作为命令行参数，如下所示：\n\
  \n```bash\n# last dla\ndla ftp winnt40 Apr 6 02:10 - 02:33 (5+00:22)\n```\n\n**问题\
  \ 1**\n\n哪个命令用于确定特定登录账户最后使用的时间？\n\na. **logins**\nb. **last**\nc. **whodo**\nd.\
  \ **ps**\n\n答案 b 正确。**logins** 命令显示的是登录账户的属性，而不是使用情况。\n\n\n\n登录账户的。因此，答案 a 是错误的。`whodo`\
  \ 和 `ps` 命令列出与进程有关的信息。因此，答案 c 和 d 是错误的。\n\n### 问题 2\n\n修改了 `/etc/syslog.conf` 文件以捕获来自特定用户应用程序的消息，但日志文件中仍然不包含任何此类消息。以下哪种原因可以解释这种情况？[选择所有适用项]\n\
  \na. 添加的 `/etc/syslog.conf` 条目中存在拼写错误。\nb. 没有重启 `syslogd` 程序。\nc. 用户应用程序没有生成预期的设施（facility）和/或级别（severity）消息。\n\
  d. `syslogd` 程序没有运行。\ne. 检查了错误的日志。\n\n答案 a、b、c、d 和 e 都是正确的。这些都是导致 syslog 无法按预期运行的原因。带有拼写错误的条目会被忽略，或者导致其他条目被误读。`syslogd`\
  \ 命令仅在启动或接收到 `SIGHUP` 信号时读取 `/etc/syslog.conf` 文件。`/etc/syslog.conf` 条目必须与用户应用程序提交消息时使用的预期设施/级别匹配。如果\
  \ `syslogd` 命令没有运行，它就无法接收和处理消息。请确保消息已发送到预期的日志文件中。\n\n### 问题 3\n\n识别结合 `who` 命令和\
  \ `ps` 命令的命令名称。正确答案是 `whodo`。\n\n### 问题 4\n\n以下哪些项是 syslog 消息的源设施？[选择所有适用项]\n\n\
  a. `login`\nb. `news`\nc. `local8`\nd. `kern`\n\n答案 b 和 d 是正确的。`news` 和 `kern` 是\
  \ syslog 消息的源设施。`auth`（而不是 `login`）是与登录系统相关的源设施。因此，答案 a 是错误的。本地定义的八个源源设施是 `local0`\
  \ 到 `local7`。因此，答案 c 是错误的。\n\n### 问题 5\n\n以下哪些项是 `logger` 命令的有效命令行参数？[选择所有适用项]\n\
  \na. `-p`（指定优先级）\nb. `-l`（将消息发送到 `loghost` 系统）\nc. `-t`（指定包含在消息中的标签）\nd. `-L`（指定应使用的日志文件）\n\
  \n答案 a 和 c 是正确的。`-p` 和 `-t` 命令行参数对 `logger` 命令有效。`-l` 和 `-L` 命令行参数不存在。因此，答案 b 和\
  \ d 是错误的。在本地处理消息或将其发送到 `loghost` 和日志文件是由 `/etc/syslog.conf` 文件中的条目指定的。\n\n### 问题\
  \ 6\n\n以下是星号 (`*`) 在 `/etc/syslog.conf` 文件中的有效用途？[选择所有适用项]\n\na. 代表所有源设施\nb. 代表所有级别\n\
  c. 代表所有消息\nd. 将消息写入所有登录用户\n\n答案 d 是正确的。你可以使用星号将消息写入所有登录用户。星号可以表示除 `mark` 以外的所有源设施。因此，答案\
  \ a 是错误的。没有符号或关键字可以表示所有级别或所有消息。因此，答案 b 和 c 是错误的。\n\n### 问题 7\n\n识别用于列出当前登录系统的登录账户的命令。正确答案是\
  \ `last` 命令或 `who` 命令。\n\n### 问题 8\n\n以下哪些是级别？[选择所有适用项]\n\na. `alert`\nb. `notice`\n\
  c. `none`\nd. `mail`\n\n答案 a、b 和 c 是正确的。`alert`、`notice` 和 `none` 是级别。`mail` 是源设施，而不是级别。因此，答案\
  \ d 是错误的。\n\n### 问题 9\n\n输入用于大多数 syslog 消息的默认日志文件名称。正确答案是 `/var/adm/messages`。\n\
  \n### 问题 10\n\n以下哪个 `/etc/syslog.conf` 条目会导致用户警报消息发送到 `loghost`？\n\na. `user.alert\
  \ ifdef('LOGHOST',/var/adm/alerts,@loghost)`\nb. `usr.alert ifdef('LOGHOST',/var/adm/alerts,@loghost)`\n\
  c. `usr.alert ifdef('LOGHOST',@loghost,/var/adm/alerts)`\nd. `user.alrt ifdef(@loghost,/var/adm/alerts.LOGHOST)`\n\
  \n答案 a 是正确的。`/etc/syslog.conf` 条目 `user.alert ifdef('LOGHOST',/var/adm/alerts,@loghost)`\
  \ 会导致用户警报消息发送到 `loghost`。其他答案具有无效的设施 (`usr`)、级别 (`alrt`) 或 `m4` 宏定义。因此，答案 b、c 和\
  \ d 是错误的。\n\n## 想要了解更多吗？\n\nSun Microsystems, *System Administration Guide*, *Volume\
  \ 2*。提供印刷质版（部件号 805-7229-10）、网络版 `docs.sun.com`，以及随 Solaris 8 操作系统一起提供的在线文档 AnswerBook2。\n\
  \nSun Microsystems, *System Reference Manual, Section 1 - User Commands*。提供印刷质版（部件号\
  \ 806-0624-10）、网络版 `docs.sun.com`，以及随 Solaris 8 操作系统一起提供的在线文档 AnswerBook2。\n\nSun\
  \ Microsystems, *System Reference Manual, Section 1M - Administration Commands*。提供印刷质版（部件号\
  \ 806-0625-10）、网络版 `docs.sun.com`，以及随 Solaris 8 操作系统一起提供的在线文档 AnswerBook2。\n\n##\
  \ 第 15 章：高级磁盘管理\n\n**你将需要的术语：**\n* 虚拟文件系统\n* 组合与条带\n* 镜像\n* 冗余磁盘阵列 (RAID)\n* DiskSuite\
  \ 虚拟机\n* Sun StorEdge Volume Manager\n\n**你将掌握的技术：**\n* 识别 RAID 级别\n* 识别文件系统路径\n\
  * 区分 DiskSuite 和 Volume Manager\n\n本章涵盖了*磁盘管理*测试目标。本章的第一部分回顾了磁盘管理命令。下一部分引入并描述了虚拟文件系统。最后两个部分简要描述了适用于\
  \ Solaris 8 的两种磁盘管理软件：Solstice DiskSuite 和 Sun StorEdge Volume Manager。\n\n### 基础磁盘管理\n\
  \n本节提供了 Solaris 8 操作系统提供的基础磁盘管理命令的简要回顾。这些命令在第 9 章中有更详细的介绍。\n\n注意 复习第 9 章应被视为准备工作的一部分。\n\
  \n### 虚拟文件系统\n\n虚拟磁盘管理系统允许你以标准 Solaris 文件系统不支持的方式使用物理磁盘。本节总结了这些优势，并描述了提供虚拟文件系统的几种技术。\n\
  \n#### 虚拟磁盘管理系统的优势\n\n虚拟磁盘管理系统可以克服磁盘容量和架构限制\n\n\n\n提高性能和可靠性。此外，通过使用图形化管理工具增强了可管理性。\n\
  \n## 克服磁盘限制\n\n虚拟磁盘管理系统允许将多个磁盘上的分区合并并视为单个分区。这不仅可以使文件系统比最大的物理磁盘还要大，还可以利用物理磁盘上的所有可用存储区域。\n\
  \n## 提高性能\n\n通常，使用多个磁盘代替单磁盘可以通过将负载分散到多个物理磁盘上来提高性能。\n\n## 提高可靠性\n\n虚拟磁盘管理系统通常支持数据冗余或高可用性功能，例如镜像（mirroring）和廉价冗余磁盘阵列（RAID）配置。此外，热备用（hot\
  \ sparing）和文件系统日志等功能可以缩短恢复时间。\n\n## 增强可管理性\n\n虚拟磁盘管理系统通常为磁盘管理和维护提供简单的图形化用户界面。该界面允许对复杂的磁盘配置和文件系统进行简单且几乎无误的管理。\n\
  \n图形化界面通常包含物理磁盘和虚拟磁盘文件系统的视化表示。此外，它通常支持拖放功能，允许快速更改配置。\n\n## 串联虚拟设备\n\n与由单个分区（slice）组成的标准\
  \ Solaris 文件系统不同，串联虚拟文件系统由两个或多个分区组成。这些分区可以位于同一个物理磁盘上，也可以位于多个物理磁盘上。分区的大小也可以不同。\n\n\
  串联意味着分区是按顺序进行寻址的。也就是说，当需要空间时，它会从串联中的第一个分区分配。一旦该空间被完全用完，就会从第二个分区分配空间，依此类推。\n\n串联虚拟设备的主要优势在于，它提供了一种方法，可以使用那些可能因为太小而无法使用的分区。此外，使用多个物理磁盘进行串联可以在磁盘之间提供某些负载均衡，并可以实现磁头移动优化。\n\
  \n然而，使用多个磁盘增加了任何一个磁盘发生故障导致虚拟设备故障的概率。\n\n## 条带虚拟设备\n\n条带式虚拟设备与串联虚拟设备一样，可以由两个或多个分区组成。分区可以位于同一个物理磁盘上，也可以位于多个物理磁盘上。分区的大小也可以不同。\n\
  \n与串联设备不同，分区是以交错的方式进行寻址的。也就是说，当需要空间时，它会从第一个分区分配一个块，然后从第二个分区分配一个块，依此类推。\n\n条带式设备的主要优势是，当分区位于多个物理磁盘上时，它提供了性能提升，因为它允许同时进行多次读取和写入。这种并发活动之所以可能，是因为条带虚拟设备中的每个物理磁盘都可以同时被访问。此外，与串联虚拟设备一样，条带式设备提供了一种方法，可以使用那些可能因为太小而无法使用的分区。\n\
  \n与串联虚拟设备一样，多个磁盘增加了任何一个磁盘发生故障导致虚拟设备故障的概率。\n\n注意：串联条带虚拟设备是指通过在设备末尾串联额外的分区而扩展的条带式虚拟设备。\n\
  \n## 镜像与双主备\n\n`Mirroring`（镜像）是将正在写入到在线设备的数据复制到另一个离线设备的技术。这种技术提供了数据的实时备份，在原始设备故障时，可以将其上线以替换原始设备。通常，这两个磁盘共享同一个控制器。然而，如果控制器故障，则两个磁盘都无法访问。\n\
  \n`Duplexing`（双主备）与镜像类似，不同在于每个磁盘都有自己的控制器。这种方法提供了更多的冗余性，并允许在单个磁盘或单个控制器故障时访问数据。\n\n\
  ## RAID 配置\n\n提高数据可用性的方法之一是将磁盘排列成各种称为“廉价冗余磁盘阵列”的配置。表 15.1 列出了 RAID 的各个级别。\n\n| 表\
  \ 15.1：RAID 级别。\n\n| 级别 | 说明 |\n| :--- | :--- |\n| 0 | 条带或串联 |\n| 1 | 镜像和双主备 |\n\
  | 2 | 海明纠码 (ECC)，用于检测和纠正错误 |\n| 3 | 带有校验信息的位交错条带（独立磁盘用于校验） |\n| 4 | 带有校验信息的块交错条带（独立磁盘用于校验）\
  \ |\n| 5 | 带有分布式校验信息的块交错条带 |\n| 6 | 带有两个独立分布式校验方案的块交错条带 |\n| 7 | 带有异步 I/O 传输和分布式校验信息的块交错条带\
  \ |\n| 10 | 镜像条带化或条带化镜像（RAID 0 和 1 的组合） |\n| 53 | 与 RAID 5 类似，但数据来自 RAID 3 磁盘（一组\
  \ RAID 3 磁盘上的数据使用 RAID 5 方法复制到另一组磁盘上） |\n\n虚拟磁盘管理系统实现了这些 RAID 级别之一或多个，但并非全部。通常支持的\
  \ RAID 级别是 0、1 和 5。\n\n## UFS 文件系统日志\n\n使用 UFS 文件系统日志，对 UFS 文件系统的更新在应用之前会记录在日志中。在系统故障的情况下，系统可以重启，并使用日志而不是\
  \ `fsck` 命令快速恢复 UFS 文件系统的一致性。\n\n`fsck` 命令是一种耗时且并不总是 100% 准确的恢复文件系统的方法。它读取并验证定义文件系统的信息。如果系统在更新期间崩溃，则更新可能只完成了一部分。`fsck`\
  \ 命令必须通过删除这些部分更新来纠正信息。\n\n通过 UFS 文件系统日志，只有记录在案的更新会被应用到文件系统。如果系统崩溃，日志中记录了应该完成的内容；此日志可用于快速恢复文件系统恢复一致性。\n\
  \n## Solstice DiskSuite\n\nSolstice DiskSuite 是一种软件产品，可增加存储容量和数据可用性，在某些情况下还可以提高性能。\n\
  \nDiskSuite 使用称为元设备（metadevices）的虚拟磁盘来管理物理磁盘。元设备是一个或多个物理磁盘分区（卷）的集合。你可以使用基本的磁盘管理命令操作元设备，但\
  \ `format` 命令除外。通常，元设备可以被视为分区或卷。\n\n考试警示：与可以使用原始 (`/dev/rdsk`) 和块 (`/dev/dsk`) 逻辑设备名称访问的标准\
  \ Solaris 文件系统一样，DiskSuite 下的虚拟文件系统也通过 `/dev/md/rdsk` 或 `/dev/md/dsk` 下的原始或块设备名称进行访问。元设备（即分区名称）以字母\
  \ `d` 开头，后跟数字。例如，`/dev/md/dsk/d0` 是块元设备 `d0`。\n\n由于你可以构建包含来自多个物理磁盘分区的元设备，因此它可以用于创建一个比最大的物理磁盘更大的文件系统。对于\
  \ SPARC 平台，元设备可以包括 IPI、SCSI 和 SPARCStorage Array 驱动器。对于 x86 平台，元设备可以包括 SCSI 和 IDE\
  \ 设备。此外，小到无法使用的分区可以组合以创建可用的存储。\n\nDiskSuite 支持四种元设备。它们列在表 15.2 中。\n\n| 表 15.2：DiskSuite\
  \ 元设备类型。\n\n| 元设备 | 说明 |\n| :--- | :--- |\n| Simple（简单） | 直接使用或作为镜像和转换（trans）的构建块\
  \ |\n\n\n\n\n\n# 元设备（三种简单的元设备类型是条带、级联和级联条带）\n\n## 镜像 (Mirror)\n用于在简单元设备之间复制数据以提供冗余。\n\
  \n## RAID 5\n用于带有校验位的数据复制，允许数据重构。\n\n## 传输 (Trans)\n用于 UFS 文件系统日志\n\nDiskSuite 允许你通过添加更多分片（slices）来动态扩展元设备。然后，就可以扩展该元设备上的\
  \ UFS 文件系统。\n\n## 热备池 (Hot Spare Pools)\n`hot spare pool` 是一个分片的集合，用于自动替换故障分片。当发生磁盘错误时，`DiskSuite`\
  \ 会在热备池中定位一个大小至少等于故障分片的热备（热分片），并将该热备分片分配为故障分片的替换品。假设采用镜像或 RAID  5 配置，故障分片的数据将从镜像数据复制到其替换品，或使用校验信息进行重建。\n\
  \n## 管理 (Administration)\n有两种方法可以管理 DiskSuite 对象。第一种是 DiskSuite 工具，它提供图形化用户界面。第二种是统称为\
  \ DiskSuite 命令行界面的命令集。\n\n## DiskSuite 工具 (DiskSuite Tool)\nDiskSuite 工具也称为 `metatool`\
  \ 命令，用于设置和管理 DiskSuite 配置。它提供了 DiskSuite 对象和底层物理磁盘的图形化视图。你可以通过拖拽操作快速修改 DiskSuite\
  \ 配置。然而，DiskSuite 工具并不支持所有的 DiskSuite 操作。这些操作必须使用命令行界面完成。\n\n## DiskSuite 命令行界面\
  \ (DiskSuite Command-Line Interface)\n命令行界面提供了一系列用于创建和管理 DiskSuite 对象的命令。大多数命令都以\
  \ `meta` 前缀开头，例如用于初始化元设备的 `metainit` 命令。更多信息请参考 DiskSuite 手册。\n\n## Sun StorEdge\
  \ 卷管理器 (Sun StorEdge Volume Manager)\nSun StorEdge Volume Manager 是一款软件产品，与 DiskSuite\
  \ 一样，可增加存储容量和数据可用性。与 DiskSuite 不同，Volume Manager 包含了性能分析工具和动态在线调整，以提供存储的最优利用。\n\n\
  注意，Sun StorEdge Volume Manager 也称为 Solaris Enterprise Volume Manager 和 Veritas Volume\
  \ Manager。自 1997 年以来，Sun Microsystems 一直以自己的品牌销售 Veritas 产品。卷管理器支持被称为 Veritas 文件系统\
  \ (`vxfs`) 的虚拟文件系统。\n\n考试告警：与可以使用原始 (`/dev/rdsk`) 和块 (`/dev/dsk`) 逻辑设备名称访问的标准 Solaris\
  \ 文件系统类似，卷管理器下的虚拟文件系统是通过位于 `/dev/vx/rdsk` 或 `/dev/vx/dsk` 的原始或块设备名称访问的。通常，磁盘组和卷位于这些路径下，例如\
  \ `/dev/vx/dsk/salesdg/salesvol` 用于销售组织的存储空间。诸如 `c0t0d0s3` 和 `disk01` 等名称也用于识别 `/dev/vx`\
  \ 目录结构下的设备。\n\nStorEdge Volume Manager 使用 `VM disk` 管理存储。`VM disk` 是分配给卷管理器的物理磁盘分区。每个\
  \ VM disk 包含一个用于分配存储的公共区域和一个存储配置信息的私有区域。`disk group`（磁盘组）是共享相同配置的 VM disk 集合。初始使用一个默认磁盘组；但可以定义额外的组以提供更好的管理。\n\
  \nVM disk 的公共区域被划分为 `subdisks;`（子磁盘）；子磁盘是卷管理器用于分配存储的基本单元。可以组织子磁盘的 `plex` 集合以支持以下数据可用性方法：\n\
  * 级联虚拟设备\n* RAID 0 级（条带化）\n* RAID 1 级（镜像）\n* RAID 5 级（带有分布式校验信息的块交错条带化）\n* RAID\
  \ 10 (RAID 1 + RAID 0)\n\n`volume`（卷）是一个由最多 32 个 plex 组成的虚拟磁盘设备。卷是操作系统和应用程序查看和操作的虚拟对象。\n\
  \n## 热迁移 (Hot Relocation)\n当子磁盘故障时，Volume Manager 会自动响应，在磁盘组内的备用磁盘或空空间上重构故障的 Volume\
  \ Manager 对象，然后用重建的子磁盘替换故障的子磁盘。\n\n## 管理 (Administration)\nVolume Manager 提供了三种管理磁盘组的方法：图形用户界面\
  \ (Visual Administrator)、一组命令行工具以及面向菜单的 `vxdiskadm` 界面。\n\n## 可视化管理员 (Visual Administrator)\n\
  Visual Administrator 也称为 `vxva` 命令，用于设置和管理卷 Manager 配置。它提供了 Visual Manager 对象和底层物理磁盘的图形化视图。你可以通过拖拽操作快速修改卷\
  \ Manager 配置。\n\nVisual Administrator 让你通过彩色图标的图形形式或弹出表单数值形式显示卷 Manager 对象性能和活动水平的统计数据。可以监控的统计数据包括读/写、块读/写、总\
  \ I/O 以及平均读写时间。\n\n## 命令行工具 (Command-Line Utilities)\n命令行工具提供了一系列用于创建和管理 Volume\
  \ Manager 对象的命令。大多数命令以 `vx` 前缀开头，例如用于向卷 Manager 配置中添加物理磁盘的 `vxdiskadd` 命令。更多信息请参考卷\
  \ Manager 手册。\n\n## vxdiskadm 菜单界面 (The vxdiskadm Menu Interface)\n`vxdiskadm` 命令为命令行工具提供了菜单驱动的界面。它消除了熟悉\
  \ `vx` 命令及其命令行参数的需要。\n\n## 练习题 (Practice Questions)\n\n### 问题 1\nVolume Manager\
  \ 支持以下哪些虚拟设备或 RAID 级别？[多选]\na. 级联虚拟设备\nb. RAID 0 级\nc. RAID 1 级\nd. RAID 5 级\ne.\
  \ RAID 10\n\n### 问题 2\n（此处省略翻译逻辑逻辑）\n大多数命令都以 `meta` 前缀开头，例如用于初始化元设备的 `metainit`\
  \ 命令。更多信息请参考 DiskSuite 手册。\n\n（注：由于原文文本在某些部分存在重复或截断，翻译已按要求确保行对应的完整性。）\n\n\n\n\n\
  交错模式。因此，答案 b 是错误的。热备用不是文件系统类型。\n\n因此，答案 d 是错误的。\n\n### 问题 7\n\n输入用于描述该技术的词汇：该技术将数据同时写入在线磁盘和离线磁盘，以便在需要时提供一个实时替换磁盘。\n\
  \n正确答案是镜像（mirroring）。\n\n309\n\n### 问题 8\n\n识别与 DiskSuite 磁盘管理器关联的虚拟系统的路径。\n\na.\
  \ `/dev/dsk/c0d0s0`\nb. `/dev/vx/dsk/mktdg/mktvol`\nc. `/dev/md/dsk/d0`\nd. `/dev/ds/dsk/d3`\n\
  \n答案 c 是正确的。与 DiskSuite 磁盘管理器关联的虚拟系统路径为 `/dev/md/dsk/d0`。`/dev/dsk/c0d0s0` 路径与标准文件系统关联。因此，答案\
  \ a 是错误的。`/dev/vx/dsk/mktdg/mktvol` 与卷管理器（Volume Manager）虚拟文件系统关联。因此，答案 b 是错误的。`/dev/ds/dsk/d3`\
  \ 不存在。因此，答案 d 是错误的。\n\n### 问题 9\n\n以下哪项是用于准备新磁盘使用的第一个命令？\n\na. `mount`\nb. `newfs`\n\
  c. `fsck`\nd. `format`\n\n答案 d 是正确的。首先使用 `format` 命令准备新磁盘供使用。`mount` 命令用于挂载文件系统。因此，答案\
  \ a 是错误的。`newfs` 命令用于在磁盘格式化后创建文件系统。因此，答案 b 是错误的。`fsck` 命令用于检查文件系统。因此，答案 c 是错误的。\n\
  \n### 问题 10\n\n以下哪些管理方法可以配合卷管理器（Volume Manager）使用？[选择所有适用项]\n\na. 图形化管理工具\nb. 命令行程序\n\
  c. 菜单驱动的命令行界面\nd. 客户端/服务器远程工具\n\n310\n\n答案 a、b 和 c 是正确的。你可以在卷管理器上使用图形化管理工具、命令行程序和菜单驱动的命令行界面。不存在客户端/服务器远程工具。因此，答案\
  \ d 是错误的。\n\n### 想了解更多信息？\n\nSun Microsystems，*Solstice DiskSuite 4.2.1 Reference\
  \ Guide*。纸质版（部件 806-3204-10）及网络 `docs.sun.com`。\n\nSun Microsystems，*Solstice DiskSuite\
