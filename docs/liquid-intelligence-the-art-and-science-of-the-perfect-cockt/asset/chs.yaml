  \ 问题 55\n\n输入与 `man` 命令配合使用的、用于显示第 4 节手册页的命令行参数。\n\n## 问题 56\n\n以下哪个命令可以用于备份位于 `c0t1d0s5`\
  \ 磁盘驱动上的整个文件系统？\n\na. `ufsdump 0u /dev/dsk/c0t1d0s5`\nb. `ufsdump 0u /dev/rdsk/c0t1d0s5`\n\
  c. `ufsdump 9u /dev/rdsk/c0t1d0s5`\nd. `ufsdump 9u /dev/dsk/c0t1d0s5`\n\n## 问题 57\n\
  \n可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\n第 12 章：答案\n\n### 问题 1\n\n可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\
  \n第 12 章：答案\n\n### 问题 2\n\n可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\n第 12 章：答案\n\
  \n## 问题 3\n\n可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\n第 12 章：答案\n\n## 问题 4\n\n\
  可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\n第 12 章：答案\n\n## 问题 5\n\n可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\
