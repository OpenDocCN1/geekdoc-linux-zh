  \ This allowed me to keep up with the writing schedule.\n\n# 引言\n\n**概述**\n\nWelcome\
  \ to *Solaris 8 System Administrator Exam Cram*. This book will help you get ready\
  \ to take—and pass—the two exams required to obtain the Sun Certified System Administrator\
  \ for\n\n\n\n\n\n# Solaris 8 认证\n\n在本引言中，我将概括介绍 Sun 实施的认证计划，以及 `Exam Cram` 系列书籍如何帮助你准备\
  \ Solaris 8 认证考试。\n\n`Exam Cram` 系列书籍旨在帮助你理解并掌握通过 Solaris 认证考试所需的科目和材料。这些书籍严格针对考试备考和复习。它们并不会教你某个主题上需要知道的所有知识。相反，我将为你展示并剖析你可能在考试中遇到的问题和难题。\n\
  \n尽管如此，为了应对任何 Solaris 考试做好充分准备，我建议你在读完本引言后，立即进行书中包含的自测（Self-Assessment）。该工具将帮助你根据理想和现实两种情况，对照\
  \ Solaris 8 系统管理员的要求来评估你的知识储备。\n\n根据你从该练习中学到的内容，你可能决定从某些课堂培训开始学习，或者阅读 Sun 及第三方供应商提供的许多系统管理指南之一。我强烈建议你安装、配置并上手操作\
  \ Solaris 8 以及你将要测试的其他软件，因为在理解认证考试中可能遇到的问题时，没有什么比亲身实践和熟悉感更有效的了。书本学习至关重要，但实践才是最好的老师！\n\
  \n## Solaris 认证系统管理员\n\n目前的认证计划包含两项独立的考试。以下是每项考试的简要描述：\n\n- `Sun Certified System\
  \ Administrator for the Solaris 8 Operating Environment, Part 1 (Exam 310-0011)`——第一部分考试（Part\
  \ 1）涵盖基础系统管理。测试的知识包括：系统的安装、软件包管理、补丁、启动过程、系统安全和文件权限、账户管理、磁盘和文件系统管理、备份与恢复。\n- `Sun\
  \ Certified System Administrator for the Solaris 8 Operating Environment, Part 2\
  \ (Exam 310-012)`——第二部分考试（Part 2）涵盖高级主题以及用于增强系统管理能力的若干附加软件包。测试的知识包括 Solaris 8 网络环境和网络客户端；设备管理；虚拟磁盘管理系统；网络文件系统\
  \ (`NFS`）以及自动挂载和缓存；命名服务如 `DNS`、`NIS` 和 `NIS+`；以及使用 `JumpStart` 进行自动化安装。\n\n- 要成为认证系统管理员，个人必须通过这两项考试。你必须在参加第二部分考试之前通过第一部分考试。无论如何，这种顺序是优的，因为测试的知识是从第一场考试向第二场考试递进的。\n\
  \n整个过程花费一年左右的时间并不罕见，许多人发现自己必须参加多次考试才能通过。`Exam Cram` 系列的主要目标是让你在适当的学习和准备下，尽可能在第一次尝试就通过两项考试。\n\
  \n由于认证与 Solaris 操作系统的特定版本相关，因此并不要求进行重新认证。然而，一旦某个 Solaris 版本过时，在该版本上的认证价值将变得乎其微。对你来说，致力于下一个\
  \ Solaris 认证更符合你的利益。\n\n过去，Sun 将上一个版本的认证要求和测试目标作为下一个版本的起点。因此，一旦通过了某个 Solaris 版本的认证，你就应该非常熟悉下一个\
  \ Solaris 版本认证的大多数测试目标。我估计在 Solaris 7 和 Solaris 8 之间，大约有 25% 的测试目标发生了变化。\n\n关注 Sun\
  \ 认证计划的最佳地点是 Sun 官网。目前 Sun 系统管理员计划的 URL 为 `http://suned.sun.com/US/certification/sysadmin.html`。Sun\
  \ 的认证网站更新频繁，如果此 URL 无法使用，请尝试使用 Sun 网站（`www.sun.com`）上的搜索工具，使用“certification”或引用词“certified\
  \ system administrator”作为搜索字符串。这将帮助你找到有关公司认证计划的最新、准确的信息。\n\n## 参加认证考试\n\n遗憾的是，考试并非免费。你参加的每场考试都需要支付\
  \ 150 美元，无论通过或失败。在美国和加拿大，考试由 Sylvan Prometric 管理。\n\n首先，你必须从 Sun Educational Services\
  \ 购买考试券。在美国，可以联系电话为 `1-800-422-8020`。这需要使用信用卡。优惠券自购买之日起有效期为一年。\n\n接下来，联系 Sylvan\
  \ Prometric 注册考试。在美国，他们的电话是 `1-800-795-3926`。你也可以使用 Sylvan 网站（`www.2test.com`）。\n\
  \n预约考试请至少提前一天打电话。要取消或重新安排考试，你必须在计划测试时间至少一天前打电话（否则可能会被收取 150 美元的费用）。\n\n在拨打 Sylvan\
  \ Prometric 电话时，请为负责电话销售人员准备好以下信息：\n\n- 你的姓名、组织机构、邮寄地址和社会安全号码。\n- 你想参加的考试名称。\n-\
  \ Sun 优惠券编号。（此信息可能不需要，因为 Sylvan Prometric 的工作人员可能已经有了。）\n\n如果你在考试前五天以上注册，将通过邮件发送预约确认函；如果少于五天，将通过传真发送。还会提供一份你必须签署才能参加考试的《考生协议》（Candidate\
  \ Agreement）。\n\n考试当天，请尝试至少提前计划时间 15 分钟到达。你必须提供两份身份证明，其中一份必须是带身份证。\n\n所有考试都是完全闭卷的。事实上，你不允许携带任何物品进入考试区域。我建议你在开始考试前复习有关该考试的关键信息。（`Exam\
  \ Cram` 书籍提供了一份简要参考——位于书前的 Cram Sheet，它以提取的形式列出了书中的核心信息。）\n\n你有时间调整心态、心理回顾这些关键信息，甚至在正式开始前参加一次模拟考试。我建议在参加第一次考试前进行模拟测试；它们在布局、行为和控制上大相同，所以你可能不需要做多次。\n\
  \n当你完成 Solaris 8 认证考试时，测试软件会告诉你你是通过还是失败。结果被分为几个主题领域。无论通过还是失败，我建议你索要保留测试管理员为你打印的详细报告。你可以利用该报告帮助你在必要时准备下一次尝试，即使你通过了，报告也会显示你可能需要复习的领域。如果你需要重考，你将不得不联系\
  \ Sylvan Prometric，安排新的考试日期并再次支付 150 美元。\n\n## 跟踪认证状态\n\nSun 维护着一个数据库，显示你通过的考试以及相应的成绩。该数据库可以通过\
  \ `www.galton.com/~sun` 访问。通过两项考试后，你将收到一个包含若干元素的欢迎包。正式认证通常需要四到六周（通常在 30 天内），所以不要指望一夜拿到证书。一旦认证，你将收到一个包含以下内容的包裹包：\n\
  \n\n\n\n\n- 一张 `Solaris 8` 系统管理员证书，适合装裱\n- 一份标志页，其中包含可直接打印的艺术作品，用于信头纸、名片等。\n- 一枚\
  \ Sun 认证系统管理员胸针\n\n许多人认为，认证带来的益处远超 Sun 公司为这一精英群体的新晋成员所提供的额外福利。我开始看到越来越多的职位招聘公告要求或规定申请者拥有\
  \ `Solaris` 认证，而且许多完成了该计划的个人都有资格获得加薪和/或承担更多责任。作为对辛勤工作和渊广博知识的官方认可，`Solaris` 认证是许多\
  \ IT 组织的荣誉标志。\n\n## 如何准备考试\n\n至少情况下，准备 `Solaris 8` 考试需要你获取并学习以下材料：\n\n字体 打印形式的 `Solaris\
  \ 8` 文档、随 `Solaris 7` 附带的 CD-ROM 文档（`AnswerBook2`），或网站 `docs.sun.com` 上的文档。\n- Sun\
  \ 认证页面上的考试目标和样题（`http://suned.sun.com/US/certification/solaris/sysadmin.html`）。另见第\
  \ 1 章的“测试目标”（Test Objectives）部分。书中包含一张章节与测试目标的交叉引用表。\n- `Exam Cram` 书。这是你在参加考试前应该读的第一本书也是最后本书。\n\
  \n此外，在追求 `Solaris 8` 系统管理专家知识的过程中，你可能会发现以下任何或所有材料大有用：\n\n- `实战经验`(Hands-on Experience）——从\
  \ `www.sun.com` 网站获取一份 `Solaris 8`。在阅读书籍时，请尝试这些命令并探索细节。经验是学习和记忆通过考试所需细节的最好方法。`Solaris\
  \ 8` 操作系统可以免费下载，也可以通过支付介质和运费通过 CD-ROM 获取。\n- `课堂培训`(Classroom Training）——Sun 提供课堂和基于计算机的培训，你会发现这些对帮助你准备考试很有用。但要警告你：这些课程相当贵（每天培训费用在\
  \ 440 美元左右）。然而，它们确实提供了一种压缩的学习形式，帮助你“复习”你的 `Solaris` 知识。测试与 Sun 提供的课堂培训紧密相关，因此我建议参加课程，以掌握\
  \ `Solaris` 特定的（以及课堂特定的）术语。\n- `其他出版物`(Other Publications)——你会在书中找到对其他出版物和资源的直接引用，关于\
  \ `Solaris` 的材料并不缺；但许多并非专门为 `Solaris 8` 编写的。出于这个原因，我没有引用大部分出版物。为了帮助你筛选现有的一些出版物，我在每章的结尾都以“想了解更多？”（Need\
  \ To Know More?）部分结束，提供涵盖主题的更完整、更详尽资源的提示。该部分将告诉你去哪里寻找更多细节。\n\n这些要求和推荐的材料代表了 `Solaris\
  \ 8` 系统管理员主题和软件无与伦比的来源和资源。在接下来的章节中，我将解释这本书是如何运作的，并给你一些理由，说明为什么这本书也应该出现在你的要求和推荐材料列表中。\n\
  \n## 关于本书\n\n每个主题 `Exam Cram` 章节都遵循固定的结构，并对特别重要或有用的材料提供了视觉提示。一个典型章节的结构如下：\n\n- `开头热点列表`(Opening\
  \ Hotlists)——每章开头都列出了你在完全熟悉该章节主题之前必须学习和理解的术语、工具和技术。热点列表之后跟着一两个介绍段落，为章节的其余部分定调。\n\
  - `主题覆盖`(Topical Coverage)——在开头热点列表之后，每章涵盖一系列与章节主题相关的课题。在整个部分，我将使用特殊的 `Exam Alert`（考试警报）布局突出最可能出现在考试中的材料，如下：\n\
  \nExam Alert 考试警报：这是考试警报的样子。通常情况下，考试警报强调最可能出现在一个或多个认证测试题中的概念、术语、软件或活动。因此，任何以 Exam\
  \ Alert 格式单独列出的信息都值得你给予异常的关注。事实上，《The Cram Sheet》中出现的大部分事实都以 Exam Alert 的形式出现在正文中。\n\
  \n- 即使某些材料没有被标记为 `Exam Alert`，本书的*所有*内容至少在间接层面上都与测试有关。这本书非常紧凑，以便于快速备考，因此你会发现每个章节的核心内容都是关键知识。\n\
  \n- 我还提供了一些提示，将帮助建立更好的系统管理知识基础。虽然这些信息可能不在考试范围内，但它们高度相关，并将帮助你成为一个更好的应试者。\n\nTip 提示：这是提示的格式。密切关注这些内容，你很快就会成为考试大师！\n\
  \n- `练习题`(Practice Questions)——此部分提供了一系列模拟测试题以及对正确答案和错误答案的解释。\n- `细节与资源`(Details\
  \ And Resources)——每一章都以标题为“想了解更多？”（Need to Know More?）的部分结束。该部分提供了指向 Sun 和第三方资源的直接提示，提供章节主题的更多细节。此外，该部分尝试对每个主题的质量和深度进行评分。如果你在这个集合中发现了喜欢的资源，请使用它；但不要强迫自己使用所有资源。相反，我只推荐我经常使用的资源，因此我的任何建议都不会浪费你的时间或金钱。\n\
  \n书的大部分内容都遵循这一结构，但还有几个元素我想特别指出。第 11 章和第 22 章包含了模拟测试，对书中内容进行了很好的回顾。第 12 章和第 23 章提供了测试题的答案。最后，请查看位于\
  \ `Exam Cram` 书前面的 The Cram Sheet。它是一份非常有价值的工具，代表了我认为你在参加考试前应该记忆的知识、数据和提示的浓缩汇编。\n\
  \n\n\n\n你可以通过电子邮件 `solaris@unixcert.net` 与我联系。你也可以将你的问题或建议发送至 `cipq@coriolis.com`。请记住在邮件中包含书名。\n\
  \n有关认证、在线讨论论坛、样本测试、内容更新等更多最新信息，请访问 Certification Insider 网站：`www.certificationinsider.com`。\n\
  \n感谢，祝你阅读愉快！\n\n---\n\n## 12\n\n## 自我评估\n\n在本 `Exam Cram` 中我包含了一份自我评估，以帮助你评估应对 Solaris\
  \ 8 认证系统管理员认证的就绪程度。它还应该帮助你理解掌握此书的主题时需要掌握的内容——即 `Exam 310-011`，“Solaris 8 操作系统下的\
  \ 认证系统管理员，第一部分”和 `Exam 310-012，“Solaris 8 操作系统下的 认证系统管理员，第二部分”。但在进行这项自我评估之前，让我们先谈谈在追求\
  \ Solaris 8 系统管理员认证时可能会面临的问题，以及理想的候选人是什么样的。\n\n### 现实世界中的 Solaris 8 系统管理员\n\n在下一节中，我描述了一个理想的\
  \ Solaris 8 系统管理员候选人，尽管我很清楚只有极少数实际候选人能达到这一理想。事实上，我对那个理想候选人的描述可能看起来相当惊人。但请放心，虽然获得\
  \ Solaris 8 系统管理员认证的要求可能看起来非常严苛，但它们绝不是不可实现的。然而，你应该清醒地意识到，这确实需要时间、花费一些费用并投入大量的精力。\n\
  \n通过了解许多人已经走在你前面，你可以获得所需的所有现实动力。你可以追随他们的足迹。如果你愿意认真地对待这一过程，并付出努力以获得必要的经验和知识，你就可以参加并并通过认证测试。事实上，`Exam\
  \ Crams` 和配套的 `Exam Preps` 设计初衷就是为了让你准备这些考试时尽可能轻松。但你必须准备！\n\n当然，其他 Solaris 认证也是也是如此的，包括：\n\
  \n*   Solaris 8 网络管理员，侧重于网络方面，但只需要一次考试。Solaris 8 系统管理员认证是先决条件。\n*   Solaris 7 系统管理员，与\
  \ Solaris 8 类似，但针对的是之前的 Solaris 版本，需要两次考试。\n*   Solaris 7 网络管理员，侧重于 Solaris 7 环境的网络方面，只需要一次考试。\n\
  \n### 理想的 Solaris 8 系统管理员候选人\n\n为了让你对理想的 Solaris 8 系统管理员候选人是什么样有一个直观的，这里有一些关于此类人员可能具有背景和经验的相关统计数据。如果你不符合这些资格（或者，事实上你甚至完全够不上），不要担心，因为这个世界并非理想化，而你的短板所在恰恰是你需要做更多工作的地方。理想的候选人将具有：\n\
  \n*   在 Unix 操作系统方面的学术或专业培训，更具体说是基于 Solaris 构建的 AT&T System V Release 4 (`SVR4`)\
  \ Unix 操作系统。\n*   三年以上的专业系统管理经验，包括安装和升级操作系统的经验、性能调优、故障排除、创建用户以及管理备份和恢复方案的经验。\n\n\
  我相信，所有认证候选人中，不到半的人符合这些要求。事实上，大多数人可能只符合这些要求的一半（至少在他们开始认证过程时是这样）。但是，由于所有获得证书的人都已经挺过了这场磨炼，所以你也能挺过来——特别是如果你听从这份自我评估告诉你的关于你已经了解的以及你需要学习的信息。\n\
  \n### 测试一下你自己\n\n接下来的系列问题和观察旨在帮助你弄清在追求 Solaris 认证过程中将面临多少工作，以及在探索过程中可能会咨询哪些资源。在回答时请务必绝对诚实，否则你将在未准备好参加的考试上浪费金钱。这里没有对错之分，只有通往认证之路的步骤。只有你自己才能决定在广阔的候选人中你真正属于哪里。\n\
  \n然而，从一开始有两点应该是明确的：\n\n*   即使是平庸的计算机背景也会帮助。\n*   对 Solaris 操作系统和技术的实操经验是成功的关键要素。\n\
  \n### 教育背景\n\n1. 你上过任何与计算机相关的课程吗？[是/否]\n   如果是，请跳转到问题 2；如果否的，请跳转到问题 4。\n\n2. 你上过任何关于\
  \ Unix 操作系统的课程吗？[是/否]\n   如果是，你可能能够处理与 Solaris 操作系统和系统管理相关的讨论。如果你生疏了，请复习基础 Unix\
  \ 概念和网络。如果答案是否，请考虑在该领域进行基础阅读。我强烈推荐一本优秀的 Solaris 系统管理书籍，如 Mark Sobell (1999) 写的 `A\
  \ Practical Guide to Solaris`。或者，如果这本书对你没有吸引，可以在你喜欢的在线书店查看其他类似书目的评论。然而，不要指望有一个长长的列表。就可用书目而言，Solaris\
  \ 8 仍然很新。\n\n3. 你上过任何网络概念或技术课程吗？[是/否]\n   如果是，你可能能够处理网络术语、概念和技术（但要做好频繁偏离正常用法的准备）。如果你生疏了，请复习基础网络概念和术语。如果你的答案是否，你可能想查看一些关于传输控制协议/网际协议\
  \ (`TCP/IP`) 的书籍。\n\n4. 你对 Unix 或网络进行过任何阅读吗？[是/否]\n   如果是，请回顾问题 2 和 3 的要求。如果你符合这些要求，请进入下一节“实操经验”。如果你回答否，请参考这两个主题的推荐阅读。这种深厚的背景对你准备\
  \ Solaris 考试会有很大帮助。\n\n### 实操经验\n\n所有 Solaris 测试成功的另一个关键是实操经验。如果我在完成这项自我评估后只能给你留下一个感悟，那应该是：投入时间去安装、配置和使用你被反复深入测试的各种\
  \ Solaris 命令和工具是不可替代的。\n\n5. 你是否安装、配置并使用过 Solaris 8？[是/否]\n   如果是，确保理解 `Exam 310-011`\
  \ 中涵盖的基础概念。如果你还没有用过 Solaris 8，你必须为 SPARC 或 Intel x86 兼容平台获取一个副本。然后学习安装和管理。\n\n提示\
  \ 你可以从 Sun 上的培训与认证页面 `http://suned.sun.com` 获取 Solaris 考试的目标、练习题和其他信息。\n\n提示 如果你有资金或你的雇主愿意买单，请考虑在\
  \ Sun 培训教育中心参加课程。\n\n### 测试你的考试就绪情况\n\n无论你是参加特定主题的正式课程来准备考试，还是使用书面\n\n\n\n\n对于自学材料，为\
  \ Solaris 认证考试做一些准备是关重要的。每次尝试的费用为 150 美元，无论通过与否，你都希望尽力第一次尝试就通过。这就是学习的用武之地。\n\n我在书中为每一章都包含了一些练习考试题和一份样本测试，因此，如果你在章节题上的得分不高，你可以进行更多学习，然后应对每部分末的样本测试。如果你在第一部分测试中没有获得至少\
  \ 66% 的分数，在第二部分测试中没有获得 70% 的分数，你可能需要调查网络上提供的其他练习测试资源（使用你喜喜欢的搜索引擎查找它们）。\n\n对于任何特定学科，如果你已经尝试了自学材料并参加了考试但仍然失败了，请考虑参加课程。如果你负担得起这项费用，那么与讲师和同学交流的机会将产生天差覆地的差异。有关\
  \ Sun 课程的信息，请访问 `http://suned.sun.com` 上的认证计划页面。\n\n如果你负担不起课程，也请访问认证计划页面，因为那里也包含免费样本题。即使你无法花费太多资金，也应该从商业供应商那里购买一些低成本的练习考试，因为它们比任何其他工具都能帮助你更好地评估通过测试的准备。访问\
  \ `www.unixcert.net` 网站查看其他可用资源。\n\n### 6. 你是否针对所选测试科目参加过模拟考试？[是或否]\n\n如果是——而且你在第一部分得了\
  \ 66% 或以上的分，在第二部分得了 70% 或以上的分——你可能已经准备好应对实战了。如果你的分数没有超过那个关键阈值，请继续努力直到你突破那个屏障。如果你回答否，请获取所有你能找到（或负担得起）的免费和低预算模拟测试并开始努力。坚持直到你能轻松地突破通过分数线。\n\
  \n**提示**：评估测试准备情况没有比方法比参加一次高质量的模拟考试，并在第一部分获得 66% 或以上、第二部分获得 70% 或以上的通过。当我在准备时，目标是\
  \ 80% 以上，以便为 Solaris 考试中偶尔出现的“异常因素”留出空间。\n\n## 评估应对 310-011 和 310-012 考试的准备情况\n\n\
  除了上一节中的通用考试准备信息外，还有其他资源可以帮助你准备考试。我想到了两个网站。它们是 `www.solarisguide.com` 和 `www.solariscentral.org`。此外，通过新闻服务或\
  \ `google.com` 可以获得 comp 新组 `comp.unix.solaris` 和 `comp.sys.sun.admin`。`groups.google.com`\
  \ 上的小组很好。这些是就你难以理解的话题提问并获得良好答案的好佳地方，或者仅仅观察他人提的问题（当然还有他们的答案）。`www.sun.com/blueprints`\
  \ 上的 Sun Blueprints 程序提供了关于各种 Solaris 主题的深度文章。\n\n我还建议你在准备参加考试时查看这些书籍中的一本或几：\n\n\
  * Mulligan, John P. *Solaris 8 Essential Reference*. New Riders, 2001.\n* Sun Microsystems.\
  \ 针对 Solaris 8 的三卷 *System Administration Guide* (Sun Micro Systems, 2000)。\n\n\
  最后一点说明：希望在考试的背景下，强调实践经验的重要性是有意义的。当你复习考试材料时，你会发现对 Solaris 8 命令、工具和实用程序的实践经验是无价的。\n\
  \n### 前进，穿过迷雾！\n\n一旦你评估了自己的准备情况，进行了正确的背景学习，获得了有助于你理解工作产品和技术的实践经验，并复习了许多帮助你准备测试的信息源，你就准备好进行一轮模拟测试了。当你的分数足够正面并让你通过考试时，你就准备好去迎接实战了。如果你遵循我的评估方案，你不仅知道需要学习什么，还知道什么时候在\
  \ Sylvan 预约考试日期。祝你好运！\n\n# 第一部分：考试 310-011\n\n* 第 1 章：Solaris 8 认证考试\n* 第 2 章：系统概念\n\
  * 第 3 章：安装和维护 Solaris 8\n* 第 4 章：启动和关闭系统\n* 第 5 章：系统安全与文件权限\n* 第 6 章：用户环境\n* 第 7\
  \ 章：进程控制\n* 第 8 章：磁盘管理\n* 第 9 章：文件系统管理\n* 第 10 章：系统基础\n* 第 11 章：样本测试 I\n* 第 12 章：答案密钥\
  \ 1\n\n## 第 1 章：Solaris 8 认证考试\n\n**你需要理解的术语：**\n\n* 多选择题格式\n* 单选按钮\n* 复选框\n* 示例\
  \ (Exhibit)\n* 拖放与放置\n* 填空（自由问答）\n* 仔细阅读\n* 排除法\n\n**你需要掌握的技术：**\n* 评估你的考试准备情况\n\
  * 准备参加认证考试\n* 练习（以完美）\n* 充分利用测试软件\n* 时间规划\n* 将最难的问题留到最后\n* 猜题（作为最后的手段）\n\n从经验来说，应试并不是大多数人预想的那样，无论他们准备得有多充分。在大多数情况下，熟悉程度可以缓解考试焦虑。通俗点说，这意味着当你参加第四次或第五次考试时，可能不会像第一次考试那样紧张。无论是第一次还是第十次考试，了解测试细节（每道题花多少时间、你所处的环境等）将帮助你专注于内容而不是环境。同样，掌握一些基本的应试技巧可以帮助你识别并可能击败你在测试中不可避免遇到的陷阱。在本章中，我将解释测试环境和软件，并描述一些你应该能够利用的成熟应试策略。\n\
  \n### 评估你的准备情况\n\n在参加任何 Solaris 考试之前，我强烈建议你阅读并完成书中附带的自测（位于在本章之前）。这将帮助你将自己的知识储备与\
  \ Solaris 8 系统管理员认证的要求进行对比，并识别出你的背景或经验中可能需要改进、增强或进一步学习的部分。如果你掌握了正确的基础，获得 Solaris\
  \ 认证将容易得多。\n\n一旦你完成了自测，你就可以处理那些背景或经验可能无法达到理想候选人标准的领域。但你也可以同时处理各个测试的科目，这样你在弥补某些领域的同时也可以继续进展。\n\
  \n一旦你完成了这本《考试冲刺》，阅读了补充材料并参加了第 11 章和第 22 章的模拟测试，你就能很清楚地知道什么时候准备好参加正式考试。虽然我强烈建议你继续练习，直到分数超过第一部分的\
  \ 66% 标记和第二部分的 70% 标记，但分别达到 71% 和 75%是一个很好的目标，以便在真实的考试情况下为自己留出余地（在真实考试中，压力的作用比练习时更大）。一旦你达到那个点，你就准备好出发了。但如果你在完成书中的模拟考试时没有获得该分数，你应该继续参加模拟测试并学习材料，直到达到那里。你会发现\n\
  \n\n\n\n关于“自-评估”中其他练习测试提供商的更多信息，以及关于如何学习和准备的更多建议。现在，让我们进入考试本身！\n\n### 测试目标\n\n两场考试的测试目标已发布在\
  \ Sun 网站 `http://suned.sun.com/US/certification/solaris/sysadmin.html`。表 1.1 和表\
  \ 1.2 提供了章节与测试目标的快速交叉引用表。\n\n### 表 1.1：章节与考试 310-011（第一部分）测试目标对照。\n\n| 章节 | 测试目标\
  \ |\n| :--- | :--- |\n| 2 | 系统概念 |\n| 3 | 安装 |\n| 4 | 启动 Prom、初始化与关闭 |\n| 5 | 安全\
  \ |\n| 6 | 用户管理 |\n| 7 | 进程控制 |\n| 8 | 磁盘配置与格式化 |\n| 9 | 文件系统、文件与目录、备份与恢复 |\n| 10\
  \ | 基础命令语法、编辑器、远程连接 |\n\n### 表 1.2：章节与考试 310-012（第二部分）测试目标对照。\n\n| 章节 | 测试目标 |\n\
  | :--- | :--- |\n| 13 | 客户端/服务器关系与 Solaris 网络环境 |\n| 14 | Solaris Syslog |\n| 15\
  \ | 磁盘管理 |\n| 16 | Solaris 伪文件系统与交换空间 |\n| 17 | 基于角色的访问控制 (RBAC) |\n| 18 | NFS、AutoFS\
  \ 与 CacheFS |\n| 19 | 命名服务与 NIS |\n| 20 | Solaris 管理控制台与 Solstice AdminSuite |\n\
  | 21 | JumpStart 自动安装 |\n\n### 测试现场\n\n当你到达预约考试的 Sylvan Prometric 测试中心时，需要向测试协调员签到。他或她会要求你提供两种形式的身份证明，其中一种必须是照片\
  \ ID。一旦你签完到并到了你的时间段，将被要求留下随携带的所有书籍、包包或其他物品，将被引导进入一间封闭房间。通常，该房间内配有一到六台电脑，每个工作站之间用隔断板隔开，以防止你看到他人屏幕上的内容。\n\
  \n你将获得一支笔或铅笔和一张白纸，或者在某些情况下，一张可擦的塑料片和一支可擦毛毡笔。你可以在这张纸上写任何你想写的信息，并且可以在纸的两面都写。我建议你尽可能记忆“备习题单”（本书书封内侧）上的材料，然后在坐在考试机器前时，立即将这些信息写在白纸上。考试期间，你可以随时查阅这张纸，但在离开房间时必须上交。\n\
  \n大多数测试室都有一面带有大窗户的墙。这允许测试协调员监控房间，防止考生互相交谈，并观察可能发生的任何异常情况。测试协调员会预先加载你参加的 Solaris\
  \ 认证考试，一旦你坐在机器前，即可开始考试。\n\n每场 Solaris 认证考试都允许你花最多 90 分钟来完成测试（考试本身会告知你，并维护一个屏幕计数器/时钟，以便你随时检查剩余时间）。第一部分包含\
  \ 57 道题，第二部分包含 61 道题，这些题目是从题库中随机选出的。\n\n**提示**：及格分数随考试而异。对于考试 310-011，及格分数为 66%，对于考试\
  \ 310-012，及格分数为 70%。\n\n所有的 Solaris 认证考试均为计算机生成，并采用单选题、拖放或填空格式。尽管这听起来可能很简单，但这些目的构造不仅是为了检查你对基础\
  \ Solaris 系统管理的熟练程度，还要求你评估一组或多组情况或需求。通常，你会被要求对一个问题给出多个答案；同样，你可能被要求从一系列选项中为问题选择最佳或最有效的解决方案，而所有这些选项在技术上都是正确的。这些测试是一场真正的冒险，涉及到真实的思考。本书将向你展示预期内容，以及如何处理你可能在考试中遇到的问题、谜题和困境。\n\
  \n### 测试布局与设计\n\n问题 1 描绘了一个典型的测试题。这是一道单选题，要求你选择一个唯一的正确答案。问题之后是每个潜在答案的简要摘要，以及其正确或错误的原因。\n\
  \n### 问题 1\n\n以下哪项是 Solaris 启动过程的最后一个阶段？\na. `init`\nb. `Boot PROM`\nc. `BIOS`\n\
  d. `Kernel initialization`\ne. `Boot programs`\n\n答案 `a` 是正确的。这些都是 SPARC 或 Intel\
  \ x86 启动过程的阶段。`boot PROM` 和 `BIOS` 阶段测试硬件。因此，答案 `b` 和 `c` 是错误的。`boot programs` 阶段定位并加载启动程序，然后\
  \ `kernel initialization` 阶段加载内核。因此，答案 `d` 和 `e` 是错误的。只有之后才会发生 `init` 阶段来初始化操作系统。在考试期间，你需要将光标放在\
  \ `a` 旁并点击即可。\n\n### 问题 2\n\n以下哪些命令可以列出已安装的补丁？[选择所有项]\na. `showrev -p`\nb. `patchinfo`\n\
  c. `patchlist all`\nd. `patchadd -p`\n\n答案 `a` 和 `d` 是正确的。答案 `b` 和 `c` 不存在。对于这类问题，必须选择多个答案。对于问题\
  \ 2，你需要将光标放在 `a` 和 `d` 旁的复选框上并点击两者，以获得正确答案的分数。\n\n\n\n\n请务必非常仔细地阅读这类问题。在面前没有任何答案的情况下，没有什么可以触动你的记忆，这会让猜测几乎变得不可能。因为这个问题特别要求提供完整路径，所以诸如\
  \ `system` 这样在技术上可能正确的答案将被标记为错误。请尝试提供尽可能具体的描述。\n\n## 如何有效使用测试软件\n\n一个广为人知的应考原则是先从头到尾通读整个测试，但在第一遍时只回答那些你认为绝对有把握的问题。在随后的几遍中，你可以深入研究更复杂的问题，因为你已经知道需要处理多少这类问题。\n\
  \n幸运的是，测试软件让这种方法易于实现。在每个问题的底部，你会发现一个复选框，允许你标记该问题以便稍后访问。（注意，标记问题会使复习更容易，但你可以反复点击\
  \ `Forward` 和 `Back` 按钮返回任何问题。）当你阅读每个问题时，如果只回答你确信无疑的问题，并将你不确定的问题标记为待复习，你就可以随着解决掉难题，继续处理一个不断短的未解决问题列表。\n\
  \n**提示**：在回答较难的问题之前完全通读测试，至少有一个潜在好处：有时，你会在后面的问题中发现信息，为前面的问题提供更多启发。其他时候，你在后面的问题中读到的信息可能会引起你对事实、数字或行为的记忆，这些也有助于前面的问题。无论如何，如果你推迟那些你不完全确定答案的问题，你就会占据优势。\n\
  \n继续做题，直到你对所有答案都完全确定，或者你知道时间将用完。如果还有未回答的问题，你需要快速扫视并进行猜测。不回答意味着该题不会得分，而猜测至少有机会是正确的。（空白答案和错误答案得分相同，均为错误。）\n\
  \n**提示**：在测试时间的最后阶段，进行猜测也比留白或不回答要好。\n\n## 认真对待考试\n\n关于参加任何考试，我能给你的最重要建议是：仔细阅读每个问题。有些问题是故意模糊的，有些使用了双重否定，另一些则在术语的使用上极其精细。我我自己参加过多次练习测试和正式考试，在几乎每一次参加的测试中，我至少漏掉了一道题，因为我读得不够仔细或不够深入。\n\
  \n以下关于如何处理过快跳到答案倾向的一些建议：\n\n*   确保你读了问题中的每一个字。如果你发现自己正不耐烦地向前跳读，请回去重新开始。\n*   在阅读时，尝试用你自己的话重新表述问题。如果你能做到这一点，你应该能够更容易地选出正确答案。\n\
  *   在初次通读后返回某个问题时，再次重读每一个字——否则，你的大脑会很快陷入定式。有时，在注意力转移到别处后重新审视问题可以让你发现之前遗漏的内容，但强烈的倾向是看到你以前看过的东西。请尽一切避免这种倾向。\n\
  *   如果你返回某个问题超过两次，请尝试向自己解释你不理解该问题的什么部分，为什么答案看起来不合理，或者似乎缺失了什么。如果你对这个主题反复琢磨一段时间，你的潜意识可能会提供所缺失的细节，或者你可能会注意到一个指向正确答案的“陷阱”。\n\
  \n最重要的是，尝试通过思考你作为 Solaris 系统管理员所掌握的知识——包括涉及的命令、特征、行为、事实和数字——来处理每一个问题。通过回复习你所掌握的知识（以及你在信息表上写下的内容），你通常会回想起或理解足够的内容，从而确定问题的答案。\n\
  \n## 答题策略\n\n根据我参加过的测试，答案中出现的几个有趣的趋势变得显而易见。对于那些只需要单个答案的问题，通常会有两个答案是显然错误的，而两个答案看起来是合理的。但当然，只有一个是正确的。除非答案跃然映入你的脑海中（如果是这样，请重读问题以寻找陷阱；有时那些往往是你最容易错的题），否则请从排除那些显然错误的答案开始答题过程。\n\
  \n在“显然错误”的类别中，要寻找的内容包括：虚假的命令选项或文件名、不存在的软件或命令选项，以及你从未见过的术语。如果你为考试做了了功课，那么没有任何有效信息对你来说应该是完全全新的。在这种情况下，不熟悉或怪异的术语可能意味着一个完全虚假的答案。只要你确定了什么是正确的，排除错误的就是很容易的。\n\
  \n许多问题都假设某个特定 Solaris 命令的默认行为正在生效。了解并理解各种命令的默认设置至关重要。如果你知道默认值并理解它们的含义，这些知识将帮助你解开许多棘结。\n\
  \n同样，在处理需要多个答案的问题时，你必须知道并选择所有正确选项才能得分。这同样也是为什么仔细阅读如此重要的一个例子。\n\n在你完成测试时，考试提供的另一个计数器将很有用：已完成的问题数和待处理的问题数。通过确保在完成四分之一时间时已完成四分之一的问题来分配时间。在完成四分之三时再次检查。对于有\
  \ 57 道题的 `310-011` 考试和有 61 道题的 `310-012` 考试，这意味着 30 分钟后完成 20 道，60 分钟后完成 40 道。\n\n\
  如果你在 80 分钟后还没有做完，用最后的 10 分钟对剩余问题进行猜测。记住，猜测比空白答案更有价值，因为空白总是错误的，而猜测可能是正确的。\n\n\n\n\
  \n提示：如果你在第 11 章的练习测试中得分未达到 66%，或者在第 22 章的练习测试中得分未达到 70%，你可能需要进一步练习。\n\n凭借书中提供的信息以及增加知识的决心，你理应能够通过认证考试。但如果你不虚、、付诸努力，在最终通过考试之前，你可能需要花费多次考试费。如果你认真准备，考试将会一帆风顺。祝你好运！\n\
  \n## 额外资源\n\n到目前为止，关于 Solaris 认证考试的最佳信息来源源于 Sun 公司本身。由于其产品和技术（以及随之而来的测试）变化频繁，因此获取考试相关信息的最佳途径是在线。\n\
  \n如果你还没有访问过 Solaris 认证页面，请现在就去。在我写这一章时，认证主页位于：\n\n`http://suned.sun.com/US/certification/solaris/sysadmin.html`。\n\
  \n注意：当你阅读此内容时，该页面可能已经不在那里了，或者已经被某些新的、不同的内容所取代，因为 Sun 网站的内容经常更新。如果发生了这种情况，请阅读本章稍后标题为“应对网络上的变化”的部分。\n\
  \n此网页将指向认证页面中的额外信息。以下是你需要检查的：\n\n- `Overview—` 认证流程和考试的概述。\n- `Supporting Courseware—`\
  \ Sun 提供的课堂课程和自学进的计算机辅助培训，涵盖了考试目标中列出的信息。\n- `Exam Objectives—` 考试将涵盖的主题的详细列表。\n\
  - `Sample Questions—` 数量有限的示例题和答案。\n- `Registration—` 关于购买 Sun 优惠券以及在 Sylvan Prometric\
  \ 注册以安排考试的信息。\n- `FAQs`— 常见问题解答；你的问题可能在此处找到答案。\n\n当你浏览这些内容时（我强烈建议你这样做），你可能会发现其他我在这里没有提到的内容，它们也同样引人入胜且充满价值。\n\
  \n## 应对网络上的变化\n\n早晚，我与你分享的关于 Solaris 认证页面的所有细节，以及我在书中其他部分提到的所有网络资源，都将过时或被更新的信息所取代。在某些情况下，你在这里找到的\
  \ URL 可能会引导你进入替代页面；在其他情况下，URL 将失效，给你留下 dreaded“404 File not found”错误信息。\n\n当发生这种情况时，请不要放弃。在网络上总有办法找到你想要的内容——只要你愿意投入一些时间和精力。首先，大多数大型或复杂的网站（Sun\
  \ 的网站在这两方面均符合如此）都提供搜索引擎。只要你能进入 Sun 的主页（我确信它将在 `www.sun.com` 留存很长一段时间），你就可以使用这个工具帮助你找到你需要的内容。\n\
  \n你的搜索请求越聚焦，结果中包含你可以使用的信息的概率就越大。例如，你可以搜索字符串“training and certification”来产生大量关于主题的通用数据，但如果你正在寻找\
  \ Sun 认证系统管理员（Sun Certified System Administrator）测试的细节，使用如下搜索字符串将更有可能更快地找到目标：\n\n\
  ```\n\"Administrator\" AND \"certification\"\n```\n\n同样，如果你想找到培训和认证的下载，请尝试如下搜索字符串：\n\
  \n```\n\"training and certification\" AND \"download page\"\n```\n\n最后，不要害怕使用 `www.search.com`、`www.altavista.com`\
  \ 或 `www.excite.com` 等通用搜索工具来搜索相关信息。尽管 Sun 在线提供了关于其认证考试的信息，但该领域还有大量的第三方信息、培训和协助来源，它们并不需要像\
  \ Sun 那样遵循统一步调。底线是：如果你在书中说所在的地方找不到某东西，就开始到处寻找。如果情况变得糟糕，你可以随时给我发邮件！我或许会有线索。我的电子邮箱地址是\
  \ `solaris@unixcert.net`。\n\n# 第 2 章：系统概念\n\n### 你需要理解的术语：\n\n- 内核 (Kernel)\n- 壳\
  \ (Shell)\n- 文件系统 (File system)\n- 守护进程 (Daemon)\n- 《Solaris 8 参考手册》\n\n### 你需要掌握的技术：\n\
  \n- 区分操作系统的不同部分\n- 区分三种 Shell\n- 使用 `man` 命令查看在线手册页\n\n本章涵盖了 Solaris 8 操作系统的一些基本概念。第一部分简要总结了\
  \ Solaris 8 的新功能。第二部分介绍了操作系统的结构和组件。下一部分总结了三种 Shell，最后部分提供了在线参考手册的概述。本章涵盖了“系统概念（System\
  \ Concepts）”测试目标。\n\n## Solaris 8 的新功能\n\nSolaris 的最新版本中增加了以下增强功能：\n\n- `Internet\
  \ Protocol version 6 (IPv6)`——下一代 IP，克服了与当前 IP 版本（版本 4）相关的许多局限性。其主要优势是更大的地址空间和地址的自动配置。在\
  \ Solaris 8 中，可以同时配置配置 IPv4 和 IPv6。\n- `Java 2 软件开发包 (SDK)`——最新版本的 Java SDK 使 Solaris\
  \ 成为机器无关软件开发的强大平台。\n- `Universal Disk Format (UDF) file system`——允许在 CD-ROM、DVD、硬盘和软磁盘之间进行方便的数据交换。\n\
  - `Graphical wizards`——增加了一些新的图形向导以提高系统易用性。最著名的是安装向导和 DHCP Manager。此外，支持 X 程序的 X\
  \ Server 已升级到行业标准 X11R6。\n\n## 操作系统的三个部分\n\nSolaris8 与所有的 Unix 操作系统变体一样由三部分组成：内核、Shell\
  \ 和文件系统。这些部分将在后面的节中讨论。\n\n### 内核\n\n`kernel` 是管理计算机物理和逻辑资源的软件集合。这些管理服务包括控制内存和其他存储设备的分配、控制外围设备（输入/输出），以及控制进程或任务的调度和执行。在大多数情况下，这些服务对用户是透明的。用户发出任务请求，内核处理底层硬件的复杂性并分配逻辑资源以完成任务。\n\
  \n物理资源通过软件模块控制，称为 `device drivers`（设备驱动），它们了解如何与硬件通信并控制其操作。通常，每个设备都有一个唯一的驱动程序，通过硬件制造商、模型有时还有硬件版本进行标识。\n\
  \n逻辑资源包括进程和内存。`process` 是任务或程序。内核维护定义和控制进程的内部数据结构；它还控制进程的调度、执行和终止。内核服务是内存管理和进程间通信。内存管理涉及跟踪可用内存、根据需要分配并在进程释放或终止时回收。进程间通信涉及处理进程之间的协作通信。\n\
  \nSolaris 8 内核支持多个用户，每个用户都可以执行一个或多个进程或任务。因此，Solaris 8 既是一个多用户系统，又是一个多任务系统。\n\n\n\
  \n\n内核通过允许任务在短的时间片内访问系统资源来实现这种级别的支持。任务被允许执行一个或多个时间片，然后被挂起以允许另一个任务执行。这种方法在所有活动任务之间提供了时间分用，并产生所有任务都在同时运行的假象。一个似乎一直在执行的任务（通常按需提供服务）被称为\
  \ `daemon`（守护进程）。\n\n### Shell\n\n`shell` 是一个提供用户与内核之间接口的软件模块。它接受用户请求并将其提交给内核。它还接收来自内核的状态信息和数据，并将它们呈现给用户。通常情况下，shell\
  \ 从终端或网络连接接收用户输入；然而，输入也可以来自文件、设备甚至另一个进程。此外，来自内核的输出通常发送到用户的终端或网络连接。同样，这些输出也可以被重定向到文件、设备或另一个进程。\n\
  \n`shell` 还提供了一种内置的编程语言，可用于自动化重复任务。这种自动化包括流控制，以及处理数值和字符串数据的能力。\n\nSolaris 8 提供了几种不同的\
  \ shell，每种都有其独特的优势。某些 shell 提供了历史/回溯机制，允许用户通过输入几个控制序列来重新执行之前的命令，而无需重新输入命令。其他 shell\
  \ 则提供了内置的数学处理功能。\n\n## 文件系统\n\n`file` 是一组被视为单元进行存储、检索和处理的字节。`file system` 是存储在磁盘驱动器上分级结构中的文件集合。一种特殊类型称为\
  \ `directory`（目录），充当文件夹并用于组织文件。文件系统可以被认为是一棵倒置树，目录是分支，文件是叶子。Unix 系统顶层目录的名称 `root`\
  \ 就源于这种比喻。\n\nUnix 操作系统通过提供创建、挂载（使其可访问）、检查、修复、复制和备份文件系统的实用程序，支持了文件系统概念。Unix 系统上可访问的存储空间通常被分为多个文件系统。这种划分使得维护更加容易并提升了性能。\n\
  \n### 三种常用的 Shell\n\nSolaris 8 环境提供了几种 shell。最常用的三种 shell 是 Bourne shell (`sh`)、C\
  \ shell (`csh`) 和 Korn shell (`ksh`)。\n\nBourne shell 由 Steven Bourne 在 AT&T 贝尔实验室开发，是原始\
  \ Unix 操作系统提供的 shell。Unix 操作系统是由 Ken Thompson 和 Dennis Ritchie 在 20 世纪 70 年代在贝尔实验室设计和开发的。最流行的版本是\
  \ Unix System V。\n\n**考试警报**：Bourne shell 是 Solaris 8 操作系统的默认 shell。\n\nC shell\
  \ 是由加州大学伯克利分校的 Bill Joy 开发的，并由该大学开发的 Unix 操作系统版本提供，称为伯克利软件发行版 (BSD) Unix。\n\nKorn\
  \ shell 由 David G. Korn 在 AT&T 贝尔实验室设计和开发。Korn shell 在 Bourne shell 的基础上增加了许多 C\
  \ shell 的功能以及自身的新功能而来的。表 2.1 比较了这三种 shell 的特性。\n\n### 表 2.1：Solaris 8 shell 的特性。\n\
  \n| 特性 | sh | csh | ksh |\n| :--- | :--- | :--- | :--- |\n| **别名 (Aliasing)** |\
  \ 否 | 是 | 是 |\n| 允许为复杂的字符串分配一个短而简单的名称，然后在命令中使用名称代替字符串。这样做可以实现向 shell 中添加自定义命令的假象。\
  \ | | | |\n| Bourne shell | 是 | 否 | 是 |\n| 因为 Korn shell 是 Bourne shell 语法的兼容增强版本，它们使用相同的语法。\
  \ | C shell 是独立开发的，其语法基于 C 语言语言。 | | | |\n| **默认提示符 (Default prompt)** | $ | % |\
  \ $ |\n| Bourne 和 Korn shell 的默认提示符都是美元符号 (`$`) 字符，而 C shell 的默认提示符是系统主机名后跟百分号 (`%`)\
  \ 字符。 | | | |\n| **历史记录 (History)** | 否 | 是 | 是 |\n| C shell 和 Korn shell 的历史功能跟踪用户定义的数量之前的命令。无需重新输入命令，你可以从历史记录中复制并执行它。\
  \ | | | |\n| 历史编辑能力 | 否 | 否 | 是 |\n| 允许你修改并重用之前的命令。 | | | |\n| 历史 | 否 | ! | *n |\n\
  | 通过几次按键重复上一个命令的执行。对于 `csh`，`n` 是历史列表列表中命令的编号。 | | `fc` | |\n| **初始化文件 (Initialization\
  \ file)** | .profile | .login | .profile |\n| 存储用户登录系统时应执行一次的命令。 | | | |\n| 初始化\
  \ | 否 | .cshrc | 用户定义的命令，用户每次启动 shell 时都会执行以执行命令。对于 Korn shell，用户可以使用 `ENV` 参数指定\
  \ shell 初始化文件的名称。 | | | | |\n| 内联编辑 | 否 | 否 | 是 | 允许你编辑已输入但尚未执行的命令。因此，你可以修正拼写错误而不是重新输入整个命令。在纠正错误时可以使用\
  \ emacs 或 vi 编辑命令。 | | | | |\n| 注销文件 | 否 | .logout | 否 | 存储用户注销时应执行的命令。 | | | |\
  \ |\n| 覆盖保护 | 否 | 是 | 是 | 防止文件被覆盖；可以通过使用 `noclobber` 参数设置。 | | | |\n| 重复上一个 | 否\
  \ | !! | 否 | 通过几次按键重复上一个命令的便捷快捷方式。 | | | |\n| 受限版本 | 否 | rsh | rksh | 旨在只需要 Unix\
  \ 系统有限访问权限的用户。通过将用户限制在单个目录并防止重定向输出来增强安全性。确保不要混淆受限 Bourne shell (`/usr/lib/rsh`)\
  \ 和用于在远程系统执行命令的远程 shell (`/usr/bin/rsh`)。Korn shell 的受限版本是 `/usr/bin/rksh`。 | |\
  \ | |\n| 来源 | AT&T | Berkeley | AT&T | Bourne shell 和 Korn shell 都源自 AT&T 贝尔实验室，而\
  \ C shell 来自加州大学伯克利分校。 | | | |\n\n**考试警报**：在配置用户账户时使用初始化文件是一个重要概念。确保你理解它们的用法并与相应的\
  \ shell 关联。\n\n## 在线参考手册\n\n《Solaris 8 参考手册》（纸质版）是一套多卷手册，记录了 Solaris 8 操作系统提供的命令、系统调用、库函数、特殊文件等。这种格式源于\
  \ AT&T 贝尔实验室开发的最初版本 Unix 操作系统，并被采纳几乎每个 Unix 版本的权威文档。\n\n为了方便起见，Solaris 8 系统和大多数其他\
  \ Unix 版本都提供了参考手册的在线版本。可以使用 `man`(1) 命令在终端/显示器屏幕查看在线参考手册的页面或主题。在线参考手册还包含在 Solaris\
  \ 8 AnswerBook2 在线文档中，允许您使用 HTML Web 浏览器搜索、显示和打印参考手册页面，例如\n\n\n\n\n\nNetscape Navigator。*Reference\
  \ Manual*（参考手册）的页面被称为 *man pages*。\n\n*Reference Manual*分为多个*sections*（章节）。每个章节处理一组相关的命令或操作系统的不同方面。表\
  \ 2.2 描述了 *Reference Manual* 的各个章节。\n\n### 表 2.2：*Solaris 8 参考手册*的章节。\n\n| 章节 |\
  \ 描述 |\n| :--- | :--- |\n| 1 | 所有用户可用的命令。包括 BSD 兼容包 (1B) 中的命令、用于系统间通信的命令 (1C)、与*表单和菜单语言解释器*\
  \ (1F) 相关的命令以及特定 SunOS 系统的命令 (1S)。 |\n| 1M | 用于系统维护和管理的命令。某些命令仅限于系统管理员登录账户（如 `root`）。\
  \ |\n| 2 | C 语言程序可用于用于访问和控制系统资源的低级操作系统系统调用。 |\n| 3 | 系统库中提供的函数，C 语言程序可以使用它们访问和控制系统资源。此章节根据库函数进行细分（基础、网络、线程、curses\
  \ 等）。 |\n| 4 | 各种系统配置文件的格式。还包括 C 语言数据结构定义的描述，可以通过 C 语言程序访问某些系统文件。 |\n| 5 | 杂项，如标准、环境和宏。\
  \ |\n| 6 | 任何可用的游戏或演示。 |\n| 7 | 与特定硬件、设备驱动程序以及 STREAMS I/O 子系统相关的特殊文件。 |\n| 9 |\
  \ 两个内核级设备驱动规范：设备驱动程序接口 (DDI) 和驱动程序/内核接口 (DKI)。此章节根据主题（入口、函数、数据结构等）进行细分。 |\n\n请注意章节\
  \ 8 未使用。在原始的 AT&T Unix System V 操作系统中，章节 8 用于描述特殊的系统维护程序。对于 Solaris，这些程序在 *System\
  \ Administration Guide* 以及其他指南和手册中描述。\n\n通常，*Reference Manual* 的每个章节都打印成独立的一卷。当在文中引用\
  \ man page 时，可以在命令名称后的括号中指定章节号。此数字在在线手册中可能并不重要，但如果你试图在一叠超过一英尺高的打印手册中查找手册页，知道章节号（即哪一卷）可以节省大量的时间和精力。因此，`man`(1)\
  \ 表示 `man` 命令位于章节 1：“用户命令”。\n\n## 使用 man 命令\n\n尽管可以使用纸质版 *Reference Manual* 和 AnswerBook2，但第一部分的测试目标中包含了将使用在线\
  \ man pages 作为一项要求。`man`(1) 命令用于显示作为命令行参数指定的一个或多个 man pages。表 2.3 出了出了 `man` 命令可用的命令行参数。\n\
  \n### 表 2.3：man 命令的命令行参数。\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `name` | Solaris 命令、文件等的名称，由同名的\
  \ man page 描述。除 `-f`、`-k` 和 `-M` 参数外，所有参数都至少需要一个 `name`。可以指定多个 `name`（用空格隔开）。 |\n\
  | `-` | 不自动将输出通过 `more`(1) 命令发送（该命令提供分页、下划线等功能）。 |\n| `-a` | 显示所有匹配指定 `name` 的 man\
  \ pages（不不分章节）。 |\n| `-d` | 显示用于定位 `name` man page 的调试信息（使用的搜索方法、搜索的章节等）。 |\n| `-f\
  \ file …` | 列出引用指定 `file` 的 man pages（需要预先格式化的 man pages）。可以指定多个 `file`（用空格隔开）。注意，此参数用于定位\
  \ man page 中引用的文件，而不是 man page（因此，不需要 man page `name` 参数）。 |\n| `-F` | 强制在所有 man\
  \ 章节中搜索 `name`，而不是使用 windex 数据库来定位 man pages（windex 与预格式化的 man pages 相关）。 |\n| `-k\
  \ keyword …` | 打印包含指定 `keyword` 的所有 windex 数据库条目的摘要（仅限预格式化的 man pages）。可以指定多个 `keyword`（用空格隔开）。注意，此参数用于定位数据库中的关键词，而不是\
  \ man page（因此，不需要 man page `name` 参数）。 |\n| `-l` | 列出所有匹配指定 `name` 的 man pages（不分章节）。\
  \ |\n| `-M path` | 为 man page 文件指定替代目录 `path`。此参数可以与其他任何参数配合使用。 |\n| `-r` | 重新格式化指定的\
  \ `name` man page。输出不会直接显示，而是捕获到文件中，供后续 `man` 命令使用。 |\n| `-s section …` | 仅搜索指定的章节或多个章节（用空格隔开）。\
  \ |\n| `-t` | 使用 `troff`(1) 对指定的 `name` man page 进行排版。如果 `-t` 配合 `-f` 使用，输出不会显示，而是捕获到文件中供后续\
  \ `man` 命令使用。 |\n| `-T macro` | 使用指定的 `nroff`(1) 宏而不是标准的 man 软件包。 |\n\n\n\n\n\n\
  ```bash\npasswd -r ldap [ -egh ] [ name ]\npasswd -r nis [ -egh ] [ name ]\npasswd\
  \ -r nisplus [ -egh ] [ -D domainname ] [ name ]\npasswd -r nisplus -s [ -a ]\n\
  passwd -r nisplus [ -D domainname ] -s [ name ]\npasswd -r nisplus [ -l ] [ -f ]\
  \ [ -n min ] [ -w warn ]\n[ -x max ] [ -D domainname ] name\n```\n\n### 说明\n\n`passwd`\
  \ 命令用于更改密码或列出密码。\n\n请注意 `man -s 1 passwd` 会提供相同的结果。在未指定章节的情况下，系统将按章节搜索帮助页（man pages），并打印第一个找到的章节。要显示\
  \ `passwd`(4) 帮助页，你必须像下面的示例那样指定章节：\n\n```bash\nman -s 4 passwd\n```\n\n正在重格式页面。请稍候……完成\n\
  \n## 文件格式 `passwd(4)`\n\n### 名称\n`passwd` - 密码文件\n\n### 语法\n`/etc/passwd`\n\n###\
  \ 说明\n`/etc/passwd` 是关于用户账户信息的本地数据源。密码文件可以与其他密码源结合使用，包括 NIS 映射 `passwd.byname` 和\
  \ `passwd.bygid` 以及 NIS+ 表 `passwd`。程序使用 `getpwnam(3C)` 例行程序来访问这些信息。\n\n每个 `passwd`\
  \ 条目都是单行，其格式如下：\n```\nusername:password:uid:gid:gcos-field:home-dir:login-shell\n\
  ```\n其中\n- `username` 是用户的登录名。建议该字段符合 `pwck(1M)` 执行的检查。\n- `password` 是一个空字段。用户的加密密码存储在\
  \ `/etc/shadow` 文件的对应条目中。\n- `pwconv(1M)` 依赖于 `/etc/passwd` 密码字段中的特殊值 `'x'`。如果这个\
  \ `'x'` 值……\n\n### 考试提示\n由于很难记住 Solaris 8 的所有命令（尤其是所有的命令行参数），`man` 命令提供快速获取详细信息的方法。请记住，多个帮助页可能具有相同的名称，因此知道哪个章节可能包含该信息，并理解使用\
  \ `-s` 命令行参数来指定适当章节非常重要。如果你忘记了 `man` 命令行参数，可以使用 `man man` 来显示它们。\n\n下面的示例使用 `-a`\
  \ 命令行参数来显示所有 *passwd* 帮助页：\n\n```bash\nman -a passwd\n```\n\n正在重格式页面。请稍候……完成\n\n\
  ::::::::::::::\n/usr/share/man/cat1/passwd.1\n::::::::::::::\n\n## 用户命令 `passwd(1)`\n\
