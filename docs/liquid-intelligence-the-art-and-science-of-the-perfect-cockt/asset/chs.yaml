  \ 1.0 User’s Guide*。纸质版（部件 805-5709-10）、网络 `docs.sun.com` 以及随 Solaris 8 操作系统附带的在线文档\
  \ AnswerBook2 可。\n\n311\n\n## 第 16 章：伪文件系统与交换空间\n\n**你需要理解的术语：**\n- 伪文件系统（Pseudo\
  \ file systems）\n- proc 工具（proc tools）\n- 交换空间（Swap space）\n\n**你需要掌握的技术：**\n- 识别伪文件系统\n\
  - 使用 proc 工具监控进程状态\n- 交换空间\n\n本章介绍了*伪文件系统与交换空间*，目标是：识别伪文件系统、使用 proc 工具监控进程状态、创建和删除交换空间。第一部分介绍了伪文件系统，第二部分介绍了交换空间。\n\
  \n### Solaris 伪文件系统\n\nSolaris 支持多种伪文件系统。这些系统被称为内存文件系统。由于它们是内存的，当系统卸载或重启时，伪文件系统将消失。表\
  \ 16.1 描述了这些伪文件系统。\n\n| 名称 | 缩写 | 用途 |\n| :--- | :--- | :--- |\n| 缓存文件系统 | CacheFS\
  \ | 缓存 |\n| 描述符文件 | FDFS | |\n| 先进后出文件 | FIFOFS | |\n| 回环文件系统 | LOFS | |\n| 名称文件系统\
  \ | NAMEFS | |\n| 进程文件系统 | PROCFS | |\n| 特殊文件系统 | SPECFS | |\n| 交换文件系统 | SWAPFS\
  \ | |\n| 临时文件系统 | TMPFS | |\n\n在九种伪文件系统中，`FDFS`、`FIFOFS`、`NAMEFS`、`SPECFS` 和 `SWAPFS`\
  \ 在后续章节中介绍。其余的是 `CacheFS`、`PROCFS` 和 `TMPFS`。\n\n### 进程文件系统 (PROCFS)\n\n进程文件系统是用于提供状态和其他信息的内存文件系统。`/proc`\
  \ 目录包含每个进程的一个目录。目录名称为进程 ID (PID)。`/proc` 目录下的文件提供了进程的各种信息。`/proc` 目录由 root 用户所有，权限为\
  \ 555（所有者/组/其他可读），任何用户都不应尝试修改这些文件。这些文件由内核直接管理。\n\n313\n\n### proc 工具\n\n使用 proc\
  \ 工具从 `/proc` 提取状态和其他信息，这是一组命令行程序。这些工具具有停止/启动的能力。\n\n要检查的进程的 PID 作为命令行参数指定。如果需要检查多个进程，应用空格隔开\
  \ PID。表 16.2 提供了 proc 工具列表。\n\n| 命令 | 目的 |\n| :--- | :--- |\n| `pcred` | 列出凭据（有效和真实的\
  \ UID/GID） |\n| `pflags` | 显示跟踪标志以及挂起和持有信号 |\n| `pfiles` | 列出所有打开的文件 |\n| `pldd`\
  \ | 列出使用的动态库 |\n| `pmap` | 显示内存地址映射 |\n| `prun` | 重启进程 |\n| `psig` | 列出信号动作 |\n\
  | `pstack` | 显示堆栈跟踪 |\n| `pstop` | 停止进程 |\n| `ptime` | 显示进程执行时间 |\n| `ptree` | 显示进程树（进程及任何子进程）\
  \ |\n| `pwait` | 等待进程终止 |\n| `pwdx` | 显示当前工作目录 |\n\n考试提示：熟悉 proc 工具的名称和目的。记忆表 16.2\
  \ 就足够了。\n\n以下列表显示了某些 proc 工具的示例用法。它们用于检查由 dla 用户账户（UID = 1001 和 GID = 10）执行 `vi\
  \ /etc/passwd` 命令创建的进程（PID = 763）。用户当前位于 dla 的家目录（`/export/home/dla`）：\n\n```\n\
  $ pflags 763\n763: vi /etc/passwd\ndata model = _ILP32 flags = PR_ORPHAN\n\n/1:\
  \ flags = PR_PCINVAL|PR_ASLEEP [ read(0x0,0x8045d47,0x1) ]\n\n$ pcred 763\n763:\
  \ e/r/suid=1001 e/r/sgid=10\n```\n\n\n\n\n```\n$ pfiles 763\n\n763: vi /etc/passwd\n\
  \nCurrent rlimit: 256 file descriptors\n\n0: S_IFCHR mode:0620 dev:102,0 ino:429381\
  \ uid:1001 gid:7\nO_RDWR\n\n1: S_IFCHR mode:0620 dev:102,0 ino:429381 uid:1001 gid:7\n\
  O_RDWR\n\n2: S_IFCHR mode:0620 dev:102,0 ino:429381 uid:1001 gid:7\nO_RDWR\n\n3:\
  \ S_IFCHR mode:0666 dev:102,0 ino:429338 uid:0 gid:3\nO_RDWR\n\n4: S_IFREG mode:0600\
  \ dev:102,0 ino:880003 uid:1001 gid:10\nO_RDWR\n\n6: S_IFCHR mode:0620 dev:102,0\
  \ ino:429381 uid:1001 gid:7\nO_RDWR\n$ ptree 763\n\n759 /usr/openwin/bin/xterm -display\
  \ winnt40:0\n760 sh\n763 vi /etc/passwd\n$\n\n$ pwdx 763\n\n763: /export/home/dla\n\
  $\n```\n\n## 临时文件系统 (TMPFS)\n\n临时文件系统是一种基于内存的文件系统，用于提高文件系统的读写性能（因为内存 I/O 速度远快于基于磁盘的\
  \ UFS I/O）。`TMPFS`实例中的文件不是永久的，当文件系统被卸载或系统重启时，这些文件将会丢失。通常，`TMPFS` 用于临时文件（例如程序编译时创建的中间文件）。它可以显著加快需要创建、读取、写入和删除临时文件的操作。\n\
  \nSolaris 8 操作系统两个 TMPFS 实例。第一个是 `/tmp`，可以被任何需要临时文件的用户账户或进程使用。`/tmp` 目录由 root 账户拥有，访问模式为\
  \ `1777`（所有者/组/其他具有读取/写/执行权限并设置了粘位；见第 5 章）。另一个 TMPFS 实例是 `/var/run` 目录，用于系统重启不需要所需的临时系统文件。该目录由\
  \ root 账户拥有，访问模式为 `755`（所有者具有读写执行权限，组和其他具有读取/执行权限）。\n\n**考试提示**：务必理解 TMPFS 及其用途。同时要熟悉\
  \ Solaris 8 操作系统自动提供的两个实例。\n\n## 回环文件系统 (LOFS)\n\n回环文件系统是一种基于内存的文件系统，用于为现有数据提供替代路径名称。也就是说，可以使用两个不同的路径访问同一份数据。随后在原始文件系统中挂载的任何文件系统也会出现在\
  \ `LOFS` 中。然而，随后挂载在 `LOFS` 中的任何文件系统都不会出现在原始文件系统中。\n\n## 缓存文件系统 (CacheFS)\n\n缓存文件系统是一种基于内存的文件系统，用于提高远程文件系统和慢设备（如\
  \ CD-ROM 器）的性能。它将之前从远程文件系统或慢设备读取的数据存储在本地系统的 `CacheFS` 中。当再次读取这些数据时，将使用本地 `CacheFS`\
  \ 中的副本 own 远程文件系统或慢设备上的数据。\n\n`CacheFS` 经常与网络文件系统 (`NFS`) 一起使用。详见第 17 章。\n\n## 交换空间\
  \ (Swap Space)\n\nSolaris 8 通过使用硬盘上的空间临时存储当前未使用的内存内容，从而支持虚拟内存的概念。当需要这些内容时，系统会将内存的另一个区域交换到交换文件，然后将请求的内容换入。\n\
  \n只要有足够的内存可用，就不会使用交换空间。当系统负载增加且资源（主要是内存）需求旺盛时，可能会开始发生交换。\n\n请记住，伪文件系统（例如 `/tmp`\
  \ TMPFS 实例）使用内存。随着 `/tmp` 空间被占用，系统将被迫使用更多交换空间。大量使用 `/tmp` TMPFS 实例可能会导致系统耗尽交换空间。\n\
  \n## 默认交换空间\n\n在初始安装 Solaris 8 时，硬盘上的一个分区被定义为默认交换空间。其大小基于物理内存量。表 16.3 列出了建议的交换空间大小。Solaris\
  \ 安装程序使用这些建议来确定交换空间的默认大小。\n\n### 表 16.3：建议的交换空间大小。\n\n| 内存配置 | 建议的交换空间大小 |\n| :---\
  \ | :--- |\n| 少于 64MB | 32MB |\n| 64 到 127MB | 64MB |\n| 128 到 511MB | 128MB |\n\
  | 512MB 或更大 | 256MB |\n\n如果系统因为增加了内存或负载过重需要更多交换空间，则在不重新安装 Solaris 8 并调整交换空间分区大小的情况下无法增加交换空间分区的大小。但可以使用其他文件系统分区的可用空间来添加交换空间。\n\
  \n## 添加更多交换空间\n\n`mkfile(1M)` 命令可以使用挂载分区的可用空间配置额外的交换空间。该命令创建一个指定大小的文件，其内部具有适当的布局。然后你可以使用\
  \ `swap(1M)` 命令将该文件添加到系统交换空间。\n\n`mkfile` 命令期望至少两个命令行参数。第一个是指定文件大小的数字。大小后面应接 `k`\
  \ 或 `K` 表示千字节，`b` 或 `B` 表示块，或 `m` 或 `M` 表示兆字节，以识别合适的单位。确保在大小和单位之间*不要*留空格。如果没有指定单位，则假设大小为字节。第二个命令行参数是文件名。通过列出多个由空格分隔的文件名，可以创建多个指定大小的文件。支持另外两个命令行参数：`-n`，表示根据需要分配磁盘空间直到指定大小（而不是在创建文件时全部分配），以及\
  \ `-v`，指定详细报告模式（列出文件名和大小）。\n\n可以使用 `swap -a` 命令将交换空间文件添加到系统交换空间。至少必须作为命令行参数指定文件名。请确保使用文件的完整（绝对）路径名。为了在系统重启时激活交换空间文件，请将它们列在\
  \ `/etc/vfstab` 文件中。`/etc/vfstab` 条目应包含交换文件的完整路径名并被识别为交换文件系统。系统重启期间，会为 `/etc/vfstab`\
  \ 中列出的每个交换文件系统执行 `/sbin/swapadd` 脚本。\n\n**考试提示**：理解用于添加、删除和列出交换空间的程序和命令。\n\n## 管理交换空间\n\
  \n除了用于添加交换空间外，`swap` 命令还支持用于列出交换空间 (`-l`)、列出交换空间统计 (`-s`) 和删除交换文件 (`-d`) 的命令行参数。以下列表创建了一个\
  \ 32MB 的交换文件，将其添加到系统交换空间，并使用 `swap` 命令管理交换空间：\n\n```bash\n# swap -l\nswapfile dev\
  \ swaplo blocks free\n/dev/dsk/c0d0s1 102,1 8 1049320 1049320\n# pwd\n/\n# mkfile\
  \ 32m swapfile\n# swap -a /swapfile\n# swap -l\nswapfile dev swaplo blocks free\n\
  /dev/dsk/c0d0s1 102,1 8 1049320 1049320\n/swapfile - 8 65528 65528\n# swap -s\n\
  total: 50732k bytes allocated + 12040k reserved = 62772k used, 585196k available\n\
  # swap -d /swapfile\n# swap -l\nswapfile dev swaplo blocks free\n/dev/dsk/c0d0s1\
  \ 102,1 8 1049320 1049320\n```\n\n### 练习题\n\n### 题 1\n\n将每个伪文件系统与其用途匹配。\n\na. CacheFS\
  \ 1. 临时文件\nb. PROCFS 2. 替代路径\nc. TMPFS 3. 进程信息\nd. LOFS 4. 本地缓存\n\n答案 a-4, b-3,\
  \ c-1 和 d-2 正确。\n\n### 题 2\n\n哪个 **swap** 命令行参数会将交换文件添加到系统交换空间？\n\na. `-a`\nb. `-d`\n\
  c. `-l`\nd. `-s`\n\n\n\n\n答案 a 是正确的。`swap` 命令的命令行参数 `-a` 将交换文件添加到系统交换空间。`-d` 从系统交换空间中删除交换文件。因此，答案\
  \ b 是错误的。`-l` 列出交换空间分区和任何交换文件。因此，答案 c 是错误的。-。`-s` 列出关于交换空间使用的统计信息。因此，答案 d 是错误的。\n\
  \n## 第 3 \n\n319\n\n`/tmp` 目录是 Solaris 8 系统上通常存在的两个 TMPFS 实例之一。以下哪一个是另一个？\n\na.\
  \ `/etc/run`\nb. `/var/run`\nc. `/etc`\nd. `/var/tmp`\ne. `/ (root)`\n\n答案 b 是正确的。`/var/run`\
  \ 是 Solaris 8 系统上通常存在的另一个 TMPFS 实例。`/etc/run` 和 `/var/tmp` 不存在。因此，答案 a 和 d 是错误的。`/etc`\
  \ 和 `/ (root)` 不可能是正确的，因为存储在 TMPFS 实例中的文件在系统重启时将会丢失。如果 `/etc` 或 `root` 是 TMPFS 实例，系统在关机后将无法启动。\n\
  \n## 第 4 \n\n以下哪些命令是 proc 工具？[请选择所有适用项]\n\na. `pstop`\nb. `pfiles`\nc. `pstart`\n\
  d. `pwdx`\ne. `psig`\nf. `pmem`\n\n答案 a, b, d 和 e 是正确的。`pstop` 命令停止指定的进程(们)。`pfiles`\
  \ 命令列出指定进程(们)打开的文件。`pwdx` 命令显示指定进程(们)当前的工作目录。`psig` 命令列出与指定进程(们)相关的挂起信号。`prun` 命令而不是\
  \ `pstart` 命令用于重启指定的进程(们)。因此，答案 c 是错误的。`pmap` 命令而不是 `pmem` 命令用于显示指定进程(们)的内存使用情况。因此，答案\
  \ f 是错误的。\n\n## 第 5 \n\n以下哪项是 `mkfile` 命令的正确语法？\n\na. `mkfile -s 32m /swapfile`\n\
  b. `mkfile 32 M swapfile`\nc. `mkfile 32m /swapfile`\n320\nd. `mkfile 32m -f /swapfile`\n\
  \n答案 c 是正确的。`mkfile` 命令的正确语法是 `mkfile 32m /swapfile`。`mkfile` 命令不使用 `-s` 或 `-f`\
  \ 等命令行参数。因此，答案 a 和 d 是错误的。大小单位（`m` 或 `M`）不应与大小分开。因此，答案 b 是错误的。\n\n## 第 6 \n\n以下哪些可能需要额外的交换空间？[请选择所有适用项]\n\
  \na. 添加了物理内存。\nb. `/tmp` 文件系统被密集使用。\nc. 系统负载增加。\nd. 系统中添加了多个内存密集型应用程序。\n\n答案 a,\
  \ b, c 和 d 都是正确的。所有这些都可能需要额外的交换空间。\n\n## 第 7 \n\n以下哪些伪文件用于提供本地访问？[选择所有适用项]\n\na.\
  \ TMPFS\nb. LOFS\nc. SWAPFS\nd. PROCFS\ne. CacheFS\n\n答案 a 和 e 是正确的。TMPFS 和 CacheFS\
  \ 用于数据。TMPFS 实例在系统关闭或重启时将会丢失，CacheFS 实例用于数据。因此，答案 b 是错误的。SWAPFS 提供交换空间。因此，答案 c 是错误的。PROCFS\
  \ 提供信息。因此，答案 d 是错误的。\n\n需要了解更多吗？\n\n321\n\nMigan, John., *Solaris Essential Reference*\
  \ (Riders, Indianapolis, 2001), ISBN 0-7357-\n\nSun Microsystems, *Role-Based Access\
  \ Control*. Available in printed form 806-0728-10\n\nSorbel, Mark., *A Practical\
  \ Guide to Solaris* (Addison-Wesley, MA, 1999), ISBN 0-201-\n\nSun Microsystems,\
  \ *System Administration, Volume 1*. Available in printed form 806-\n\nSun Microsystems,\
  \ *System Reference, Section 1 - User Commands*. Available in printed form 806-025-\n\
  \n322\n\n## 第 17 章 基于角色的访问控制 (RBAC)\n\n**你需要理解的术语：**\n\n- 角色 (Roles)\n- 配置文件 (Profiles)\n\
  - 授权 (Authorizations)\n- 特权操作 (Privileged operations)\n\n**你需要掌握的技术：**\n\n- 创建并分配角色\n\
  - 显示 RBAC\n\n本章涵盖了基于角色的访问控制的目标。第一部分描述了访问控制的目的。第二部分提供了用于实现访问控制的配置文件的细节。最后部分总结了用于管理\
  \ RBAC 的命令。\n\n### 基于角色的访问控制的目的\n\n在过去，Solaris 系统管理一直是使用 root 超级账户进行的。即使用户账户只需要少数特权操作或命令来完成任务，它也获得了对系统的完全控制。这种“全或无”的访问方法一直是一个安全问题。Solaris\
  \ 的一项新功能基于角色的访问控制（RBAC）解决了这个问题。\n\nRBAC 子系统支持一种特殊的账户类型，称为“角色”。角色被授予一组特权来执行特定的任务，例如打印管理。尽管角色是一种用户账户，但它们只能通过\
  \ `su` 命令访问。也就是说，角色不能通过标准的登录程序直接访问。我们通过分配配置文件和授权为角色（以及普通账户）授予特权。\n\n*配置文件*是授权和特权操作的集合。你可以将配置文件视为用于简化特权集分配的分组机制。例如，设备管理配置文件包含了管理系统设备所需的所有授权。\n\
  \n*授权*是执行受限功能的权利，例如关闭系统。一个授权可能不对应单一 Solaris 命令。例如，可以使用多个命令来关闭系统。如果用户账户被分配了 `solaris.system.shutdown`\
  \ 授权，则该账户可以使用任何相应的命令执行关闭。与 Solaris 系统相关的授权集由 Sun Microsystems 定义，无法修改。\n\n相反，*特权操作*是在执行时将\
  \ UID 和/或 GID 设置为相应值的 Solaris 命令，以允许适当的操作。\n\n总之，可以将授权和特权操作分配给普通账户和角色，从而实现特权的受控委托。\n\
  \n### RBAC 数据库\n\nRBAC 数据库由四个属性数据库或文件组成。这些文件共同定义了 RBAC 的属性（角色、配置文件、授权和特权操作）。RBAC\
  \ 数据库还提供了一种机制，将配置文件、授权和特权操作与普通账户及角色关联起来。\n\n四个 RBAC 数据库文件为：\n\n- 用户属性数据库 (user_attr)\
  \ 定义角色并向角色和普通账户分配授权和配置文件。也称为扩展用户属性数据库。\n\n\n\n\n\n- `Profile Attributes Database\
  \ (prof_attr)`—：定义配置（Profiles）。\n- `Authorization Attributes Database (auth_attr)`—：定义权限（Authorizations）。\n\
  - `Execution Attributes Database (exec_attr)`：定义特权操作。也称为配置执行属性数据库。\n\n**考试提示**：用户属性数据库\
  \ (`user_attr`) 位于 `/etc` 目录下。其他三个数据库位于 `/etc/security` 目录下。\n\n图 17.1 显示了四个数据库文件之间的关系。用户属性数据库通过引用配置属性数据库中的项，将配置分配给用户账户和角色。同样，用户属性数据库通过引用权限属性数据库中的项，将权限分配给用户账户和角色。\n\
  \n![](img/index-326_1.png)\n\n图 17.1：RBAC 数据库文件之间的关系。\n\n配置属性数据库通过引用权限属性数据库中的项，将权限分配给配置。执行属性数据库中定义的特权操作通过在执行属性数据库中包含配置的名称，与某个配置关联。\n\
  \n## 用户属性数据库 (`user_attr`)\n\n`/etc/user_attr` 文件是 RBAC 的核心数据库。它将配置和/或权限分配给用户账户。它还定义了角色（作为一个或多个权限和/或配置）。表\
  \ 17.1 列出了 `user_attr` 文件的冒号分隔字段。\n\n表 17.1：用户属性数据库的字段。\n\n| 字段 | 用途 |\n| :--- |\
  \ :--- |\n| Name | 用户账户名称（在 `/etc/passwd` 文件中定义）或角色的名称。 |\n| Qualifier | 留供后用（空字段）。\
  \ |\n| Res1 | 留供后用（空字段）。 |\n| Res2 | 留供后用（空字段）。 |\n| Attributes | 由分号分隔的 `key=value`\
  \ 对列表，决定分配给用户账户或角色的属性。有效键有 `auths`（一个或多个权限名称，用逗号分隔）、`profiles`（一个或多个配置名称，用逗号分隔）、`roles`（一个或多个角色，用逗号分隔）以及\
  \ `type`（如果 `name` 字段是普通用户账户则设置为 `normal`，如果 `name` 是角色则设置为 `role`）。 |\n\n以下列表显示了\
  \ `/etc/user_attr` 文件中的若干示例项（换行的已缩进以提高可读性）：\n\n```\nprt_adm::::type=role;profiles=Printer\
  \ Management;auths=solaris.system.date\nprof_adm::::type=role;auths=solaris.profmgr.*\n\
  role_adm::::type=role;auths=solaris.role.*\namber::::type=normal;roles=prt_adm\n\
  morgan::::type=normal;roles=prof_adm,role_adm\ndana::::type=normal;auths=solaris.jobs.*;profiles=Printer\
  \ Management;roles= prof_adm,role_adm\n```\n\n第一项定义了 `prt_adm` 角色，该角色被分配了 Printer\
  \ Management 配置。此外，该角色还分配了权限 `solaris.system.date`，这允许该角色设置系统日期。\n\n第二项定义了 `prof_adm`\
  \ 角色，该角色被分配了所有与 RBAC 配置管理相关的权限。注意，通配符 `*` 可以用于表示*任意*（类似于 shell 通配符）。\n\n第三项定义了 `role_adm`\
  \ 角色，该角色被分配了所有与 RBAC 角色管理相关的权限。\n\n第四项将 `prt_adm` 角色分配给普通用户账户 `amber`。登录后，`amber`\
  \ 可以使用 `su` 命令变为 `prt_adm` 并执行分配给该角色的任何任务。\n\n第五项将 `prof_adm` 和 `role_adm` 角色分配给普通用户账户\
  \ `morgan`。登录后，`morgan` 可以使用 `su` 命令变为 `prof_adm` 和 `role_adm`，然后执行分配给这些角色的任何任务。\n\
  \n第六项为普通用户账户 `dana` 分配了大量的访问控制。该控制包含了与 `solaris.jobs` 相关的所有权限（`cron` 和 `at` 任务管理）、Printer\
  \ Management 配置、`prof_adm` 角色以及 `role_adm` 角色。\n\n以下列表显示了 `user_attr` 文件中唯一的默认项。该项用于\
  \ root 超用户账户。基本上，它分配了所有的权限和配置：\n\n```\nroot::::type=normal;auths=solaris.*,solaris.grant;profiles=All\n\
  ```\n\n## 执行配置属性数据库 (`prof_attr`)\n\n`/etc/security/prof_attr` 文件用于将权限属性数据库 (`auth_attr`)\
  \ 中的权限和执行属性数据库 (`exec_attr`) 中的特权操作分配给名为“执行配置”（或简称为“配置”）的单一实体。随后你可以在 `user_attr`\
  \ 文件中引用这些配置，将它们分配给角色或直接分配给用户账户。\n\n表 17.2 列出了 `prof_attr` 文件的冒号分隔字段。\n\n| 字段 | 用途\
  \ |\n| :--- | :--- |\n| Name | 配置名称（区分大小写）。 |\n| Res1 | 留供后用（空字段）。 |\n| Res2 | 留供后用（空字段）。\
  \ |\n| Description | 配置的描述。 |\n| Attributes | `key=value` 对列表（用分号分隔），决定配置中包含的权限和操作。有效键有\
  \ `auth` 和 `help`。 |\n\n以下列表显示了 `/etc/security/prof_attr` 文件中的两个项。行进行了折行和换进以提高可读性。\n\
  \n```\nAudit Review:::View the audit trail:auths=solaris.audit.read;help=AuditReview.html\n\
  Printer Management:::Control Access to Printer:help=PrinterMgmt.html\n```\n\n第一项定义了\
  \ Audit Review 配置。语句“View the audit trail”是一个简洁但准确的描述。`Attributes` 字段引用了 `solaris.audit.read`\
  \ 权限并指定了帮助文件（位于 `/usr/lib/help/profiles/locale/C` 目录下）。执行属性数据库中定义的任何与 Audit Review\
  \ 配置关联的特权操作也是允许的。\n\n第二项定义了 Printer Management 配置。`Attributes` 字段仅指定了帮助文件。然而，执行属性字段中与\
  \ Printer Management 关联的所有操作都是允许的。表 17.3 列出了由 `prof_attr` 文件定义的默认配置。注意 Device 配置属性使用了\
  \ `solaris.device.*;`；通配符表达式意味着所有 `solaris.device` 权限都包含在内。\n\n表 17.3：默认 RBAC 配置。\n\
  \n| 名称 | 描述 | 权限 | 帮助 |\n| :--- | :--- | :--- | :--- |\n| All | 标准 Solaris | N/A\
  \ | All.html |\n| Audit Control | 管理 solis.audit.config | AuditControl.html |\n\
  | audit subsystem | solis.jobs.admin | | |\n| Audit Review | 查看 solis.audit.read\
  \ | AuditReview.html |\n| Device | 控制访问 solis.device.* | DevMgmt.html |\n| Management\
  \ to removable media | | | |\n| Printer | 控制访问 N/A | PrinterMgmt.html |\n| Management\
  \ to printers | | | |\n\n## 权限属性数据库 (`auth_attr`)\n\n`/etc/security/auth_attr` 文件用于定义权限（使用受限函数的权利），可以按用户账户进行授予。随后你可以在\
  \ `user_attr` 文件中引用这些权限，将它们分配给角色或直接分配给用户账户。表 17.4 列出了 `auth_attr` 文件的冒号分隔字段。\n\n\
  表 17.4：权限属性数据库的字段。\n\n| 字段 | 用途 |\n| :--- | :--- |\n| Name | 权限名称，由由点 (.) 分的一个多个关键字组成，标识系统、子系统和功能。如果名称以点结尾，则该项仅为描述一组相关权限的标题。\
  \ |\n| Res1 | 留供后用（空字段）。 |\n| Res2 | 留供后用（空字段）。 |\n| Short Description | 权限的简短描述。\
  \ |\n| Long Description | |\n\n\n\n\n\n关于授权的详细描述。\n\n### 属性\n\n一组零或多个 `key`=`value`\
  \ 键对（用分号分隔），用于描述该授权。\n\n目前，唯一有效的键是 `help;`，它定义了与授权关联的帮助文件。\n\n以下列表显示了 `/etc/security/auth_attr`\
  \ 文件中的三个条目：\n\n```\nsolaris.grant:::Grant All Rights::help=PriAdmin.html\nsolaris.audit.:::Audit\
  \ Management::help=AuditHeader.html\nsolaris.audit.config:::Configure Auditing::help=AuditConfig.html\n\
  ```\n\n第一条目定义了 `solaris.grant` 授权。`Short Title`（短标题）字段标识授权为 Grant All Rights。`Attributes`（属性）字段标识帮助文件（位于\
  \ `/usr/lib/help/auths/locale/C` 目录下）。\n\n第二条目定义了审计管理权限集的 `Short Title` 字段（注意 `Name`\
  \ 字段末尾的点）。第三条目定义了 `solaris.audit.config` 授权，它允许配置系统审计（帮助文件定义为 `AuditConfig.html`）。\n\
  \n表 17.5 列出了由 `auth_attr` 文件定义的默认授权。\n\n**表 17.5: 默认 RBAC 授权。**\n\n| Name | Description\
  \ | help |\n| :--- | :--- | :--- |\n| All | 标准 Solaris | All.html |\n| solaris.*\
  \ | 主要管理员 | PriAdmin.html |\n| solaris.grant | 授予所有权限 | PriAdmin.html |\n| solaris.audit.config\
  \ | 配置审计 | AuditConfig.html |\n| solaris.audit.read | 读取审计轨迹 | AuditRead.html |\n\
  | solaris.device.allocate | 分配设备 | DevAllocate.html |\n| solaris.device.config |\
  \ 配置设备 | DevConfig.html |\n| solaris.device.grant | 授权设备 | DevGrant.html |\n| solaris.device.revoke\
  \ | 取消或收回设备 | DevRevoke.html |\n| solaris.jobs.admin | `cron` 和 `at` | JobsAdmin.html\
  \ |\n| solaris.jobs.grant | 授权 `cron` 和 `at` | JobsGrant.html |\n| solaris.jobs.user\
  \ | 创建 `cron` 或 `at`作业 | JobsUser.html |\n| solaris.login.enable | 启用登录 | LoginEnable.html\
  \ |\n| solaris.login.remote | 远程登录 | LoginRemote.html |\n| solaris.profmgr.assign\
  \ | 将配置分配给用户或角色 | ProfmgrAssign.html |\n| solaris.profmgr.write | 创建、修改和删除配置 | ProfmgrWrite.html\
  \ |\n| solaris.role.assign | 将角色分配给用户 | RoleAssign.html |\n| solaris.role.write\
  \ | 添加、修改和删除角色 | RoleWrite.html |\n| solaris.system | 机器管理 | SysHeader.html |\n\
  | solaris.system.date | 设置日期时间 | SysDate.html |\n| solaris.system.shutdown | 关闭系统\
  \ | SysShutdown.html |\n\n注意，所有这些授权都是针对 Solaris 系统（由 Sun Microsystems 开发）的。如果其他组织增加了新的授权，应使用创建该组织的的反序\
  \ Internet 域名进行标识。例如，由 `unixcert.net` 组织创建的授权将以 `net.unixcert` 前缀开头。\n\n### 执行属性数据库\
  \ (exec_attr)\n\n`/etc/security/exec_attr` 文件用于将特权操作（使用指定的 UID 和/或 GID 执行的命令）与配置（profiles）相关联。你可以将这些配置分配给用户账户或角色。表\
  \ 17.6 列出了 `exec_attr` 文件的冒号分隔字段。\n\n**表 17.6: 执行属性数据库字段。**\n\n| Field | Use | Name\
  \ |\n| :--- | :--- | :--- |\n| Name | 相关配置的名称（必须与 `prof_attr` 文件条目中的名称完全匹配）。 | |\n\
  | Policy | 安全策略。目前，超级用户策略 `suser` 是唯一的有效条目。 | |\n| Type | 实体类型。目前，命令类型 `cmd` 是唯一的有效条目。\
  \ | |\n| Res1 | 未来备用（空字段）。 | |\n| Res2 | 未来备用（空字段）。 | |\n| ID | 要执行的命令（使用全路径名或带有元字符的部分路径指定）。\
  \ | |\n| Attributes | `key`=`value` 键对列表（用分号分隔），决定执行期间应用到命令的属性。有效的键为 `euid`（设置有效\
  \ UID）、`uid`（设置实际 UID）、`egid`（设置有效 GID）和 `gid`（设置实际 GID）。有效值为 UID、用户账户名、GID 和组组账户名。\
  \ | |\n\n以下列表显示了 `/etc/security/exec_attr` 文件中两个与打印机管理配置关联的条目。\n\n```\nPrinter Management:suser:cmd:::/usr/bin/enable:euid=lp\n\
  Printer Management:suser:cmd:::/usr/bin/disable:euid=lp\n```\n\n第一条目定义了执行 `enable(1)`\
  \ 命令为特权操作。它将以 `lp` 的有效 UID 执行。第二条目定义了执行 `disable(1)` 命令为特权操作。它也将以 `lp` 的有效 UID 执行。\n\
  \n表 17.7 列出了由 `exec_attr` 文件定义的默认特权操作。所有操作的 `Policy` 字段均设置为 `suser`，`Type` 字段设置为\
  \ `cmd`。\n\n**表 17.7: 默认 RBAC 执行属性。**\n\n| Profile Name | Command | Attributes |\n\
  | :--- | :--- | :--- |\n| Audit Control | /etc/init.d/audit | euid=0;egid=3 |\n\
  | Audit Control | /etc/security/bsmconv | uid=0 |\n| Audit Control | /etc/security/bsmunconv\
  \ | uid=0 |\n| Audit Control | /usr/sbin/audit | euid=0 |\n| Audit Control | /usr/sbin/auditconfig\
  \ | euid=0 |\n| Audit Control | /usr/sbin/auditd | uid=0 |\n| Audit Review | /usr/sbin/auditreduce\
  \ | euid=0 |\n| Audit Review | /usr/sbin/praudit | euid=0 |\n| Audit Review | /usr/sbin/auditstat\
  \ | euid=0 |\n| Printer Management | /etc/init.d/lp | euid=0 |\n| Printer Management\
  \ | /usr/bin/cancel | euid=0 |\n| Printer Management | /usr/bin/lpset | egid=14\
  \ |\n| Printer Management | /usr/bin/enable | euid=lp |\n| Printer Management |\
  \ /usr/bin/disable | euid=lp |\n| Printer Management | /usr/sbin/accept | euid=lp\
  \ |\n| Printer Management | /usr/sbin/reject | euid=lp |\n| Printer Management |\
  \ /usr/sbin/lpadmin | egid=14 |\n| Printer Management | /usr/sbin/lpfilter | euid=lp\
  \ |\n| Printer Management | /usr/sbin/lpforms | euid=lp |\n| Printer Management\
  \ | /usr/sbin/lpmove | euid=lp |\n| Printer Management | /usr/sbin/lpshut | euid=lp\
  \ |\n| Printer Management | /usr/sbin/lpusers | euid=lp |\n\n**考试警示：** 请熟悉所有四个 RBAC\
  \ 文件的格式以及每个字段的用途。\n\n### 管理 RBAC\n\n你可以使用以下命令来管理 RBAC：\n\n- `auths(1)` 显示分配给用户账户的授权\n\
  - `profiles(1)` 显示分配给用户账户的配置\n- `roles(1)` 显示分配给用户账户的角色\n- `roleadd(1M)` 添加角色定义\n\
  - `roledel(1M)` 删除角色定义\n- `rolemod(1M)` 修改角色定义\n\n#### 显示 RBAC 分配\n\n如果你在不带命令行参数的情况下使用\
  \ `auths`、`profiles` 和 `roles` 命令，将列出当前用户账户的授权、配置和角色。要列出另一个用户账户的授权、配置和角色，请指定该用户作为命令行参数。例如：\n\
  \n```\n$ auths root\nsolaris.*,solaris.grant\n$ profiles root\nAll\n$ roles root\n\
  roles: root : No roles\n$\n```\n\n#### 角色管理\n\n`roleadd`、`rolemod` 和 `roledel` 命令用于管理\
  \ RBAC 角色。\n\n#### 使用 roleadd 命令创建角色\n\n`roleadd(1M)` 命令提供了快速添加角色的方法。至少需要作为命令行参数指定名称。表\
  \ 17.8 列出了 `roleadd` 命令支持的命令行参数。\n\n**表 17.8: roleadd 命令的命令行参数。**\n\n| Argument\
  \ | Description |\n| :--- | :--- |\n| ***role*** | 指定新角色的名称（必填）。 |\n| -A *authorizations*\
  \ | 指定一个或多个授权（用逗号分隔）*.* |\n| -b *base* | 定义一个基础目录。如果主目录 |\n\n\n\n\n\n- 若未指定 -d，角色名称将被添加到\
  \ `base` 并用作主目录。\n\n`-c comment`\n指定放置在 `/etc/passwd` 文件中 `gcos` 字段的注释。\n\n`-d directory`\n\
  定义角色的主目录。\n\n`-e date`\n指定角色的过期日期。在指定日期之后，该角色将被禁用。\n\n`-f days`\n指定角色在禁用之前允许非活动的最大天数。\n\
  \n`-g group`\n定义现有组的 GID 或名称，该组将作为角色的主组。\n\n`-G group`\n定义现有组的 GID 或名称，该组将作为角色的附加组。\n\
  \n`-k template_dir`\n指定包含（默认模板 `.profile` 的目录，该模板用于用户配置。\n\n`-m`\n如果主目录不存在则创建它。主目录由\
  \ `-b` 以及角色名或 `-d` 定义。\n\n`-o`\n允许指定现有 UID。这意味着可以使用重复的 UID 创建角色（参见 `-u`）。\n\n表 17.8:\
  \ `roleadd` 命令的命令行参数。\n\n| 参数 | 说明 |\n| :--- | :--- |\n| `-p profiles` | 指定一个或多个执行配置（用逗号分隔）。\
  \ |\n| `-s shell` | 指定登录 shell；默认是 Bourne Shell (`/bin/sh`)。 |\n| `-u uid` | 指定角色的\
  \ UID。它必须是一个十进制整数。如果未指定，将分配下一个可用的 UID。 |\n\n考试警示：`roleadd` 命令支持与 `useradd` 命令相同的命令行参数，但\
  \ `roleadd` 不支持 `-R` 命令行参数，因为角色不能包含其他角色。\n\n以下示例了如何使用 `roleadd` 命令创建一个角色：\n\n```bash\n\
  roleadd -A solaris.system.date -P \"Printer Management\" prt_adm\n```\n\n此命令创建了\
  \ `prt_adm` 角色。它将 `solaris.system.date` 授权和 `Printer Management` 配置分配给该角色。\n\n为了方便操作，`roleadd`\
  \ 命令还支持 `-D` 命令行参数，允许为授权（`-A`）、基目录（`-b`）、组（`-g`）、过期日期（`-e`）、最大最大非活动时间（`-f`）以及执行配置（`-P`）分配默认值。后续使用\
  \ `roleadd` 命令时，如果没有指定，将使用这些默认值。\n\n考试警示：使用 `roleadd` 命令创建的角色没有密码。这些角色是被锁定的，在使用\
  \ `passwd(1)` 命令为角色定义密码之前，它们无法使用。\n\n### 使用 rolemod 命令修改角色\n\n`rolemod(1M)` 命令修改现有角色。其命令行参数与\
  \ `roleadd` 命令相同，但有以下例外：\n\n- 不可用基目录（`-b`）。使用 `-d` 指定新目录。如果主目录不存在，请不要忘记包含 `-m`。\n\
  - 不可用设置默认值（`-D`）。\n- 不可用模板目录（`-k`）。\n- 如果要修改角色名称，则使用 `-l role` 指定一个新的角色名称。\n\n请记住，如果更改了角色，除非使用了\
  \ `-d` 和 `-m` 命令行参数，否则主目录的名称不会发生改变。\n\n### 使用 roledel 命令删除角色\n\n`roledel(1M)` 命令删除一个角色。该命令不仅从\
  \ `user_attr` 文件中删除了角色定义，还修改了其他 `user_attr` 条目中的所有角色分配。角色作为命令行参数指定。仅支持另一个命令行参数：`-r`\
  \ 删除与角色关联的主目录。\n\n### 练习题\n\n#### 题 1\n下列哪一个 RBAC 数据文件不在 `/etc/security` 之下？\na.\
  \ `auth_attr`\nb. `exec_attr`\nc. `prof_attr`\nd. `user_attr`\n\n答案 d 正确。`user_attr`\
  \ 文件位于 `/etc` 目录下。所有其他文件都在 `/etc/security` 目录下。因此，答案 a、b 和 c 都是错误的。\n\n#### 题 2\n\
  下列哪项不能分配给角色？\na. 一个配置\nb. 一个授权\nc. 另一个角色\nd. 多个配置\n\n答案 c 正确。角色不能被分配给另一个角色。一个或多个授权和/或一个或多个配置可以分配给角色。因此，答案\
  \ a、b 和 d 都是错误的。\n\n#### 题 3\n执行属性数据库文件（Execution Attributes Database）与哪个其他 RBAC\
  \ 属性数据库文件相关？\na. 授权属性数据库文件\nb. 配置属性数据库文件\nc. 用户属性数据库文件\n\n答案 b 正确。执行属性数据库文件中列出的特权操作与配置属性数据库文件中列出的配置相关。授权属性数据库定义了与配置相关的特权操作，不直接相关于命令执行。因此答案\
  \ a 是错误的。用户属性数据库将用户和角色与授权及配置关联。这些也不直接相关。\n\n#### 题 4\n下列哪些键允许出现在用户属性文件的 `attribute`\
  \ 字段中？[选择所有适用项]\na. `auths`\nb. `help`\nc. `profile`\nd. `roles`\ne. `type`\n\n\
  答案 a、c、d 和 e 正确。用户属性文件的 `attribute` 字段可用于授权、配置和角色。`type` 键标识普通用户账户或角色。`help` 键仅在授权数据库支持。因此，答案\
  \ b 是错误的。\n\n#### 题 5\n下列哪项是角色的定义？\na. 分配了授权和配置的特殊用户账户。\nb. 用于访问限制函数的权限。\nc. 用于授权和配置分配的机制。\n\
  d. 不需要密码的用户账户。\ne. 通过登录命令访问的用户账户。\n\n答案 a 正确。*用于访问限制函数的权限*是授权的定义。因此，答案 b 是错误的。*用于授权和配置分配的机制*是配置的定义。因此，答案\
  \ c 是错误的。角色与其他用户账户一样需要密码，并且只能通过 `su(1)` 命令访问。因此，答案 d 和 e 是错误的。\n\n#### 题 6\n下列哪些键可以用于\
  \ RBAC 执行属性数据库的 `attribute` 字段中？[选择所有适用项]\na. `auths`\nb. `gid`\nc. `help`\nd. `profiles`\n\
  e. `uid`\n\n答案 b 和 e 正确。执行属性数据库 `attribute` 字段的有效键为 `egid`、`gid`、`euid` 和 `uid`。`auths`\
  \ 键只能在授权和配置数据库文件中指定。因此，答案 a 。`help` 键仅在授权和配置文件中支持。因此，答案 c 。`profiles` 键只能在用户属性文件中指定。\n\
  \n#### 题 7\n下列哪项描述了 RBAC 用户属性文件的格式？\na. `name:qualifier:res1:res2:attributes`\n\
  b. `name:res1:res2:description:attributes`\nc. `name:res1:res2:short description:long\
  \ description:attributes`\nd. `name:policy:type:res1:res2:ID:attributes`\n\n答案 a\
  \ 正确。RBAC 用户属性文件使用格式 `name:qualifier:res1:res2:attributes`。`name:res1:res2:description:attributes`\
  \ 是配置属性文件的格式。因此，答案 b 是错误的。`name:res1:res2:short description:long description:attributes`\
  \ 是授权属性数据库的格式。\n\n\n\n\n因此，答案 c 是错误的。`name:policy:type:res1:res2:ID:attributes`\
  \ 是执行属性数据库文件的格式。因此，答案 d 是错误的。\n\n337\n\n### 想要了解更多吗？\n\nMulligan, John P., *Solaris\
  \ 8 Essential Reference* (New Riders, Indianapolis, IN, 2001), ISBN 0-7357-1007-4.\n\
  \nSun Microsystems, *System Administration Guide, Volume 2*。提供纸质版（部件号 805-7229-10）、可通过\
  \ Web `docs.sun.com` 获取，以及通过 Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\nSun Microsystems,\
  \ *System Reference Manual, Section 1 - User Commands*。提供纸质版（部件号 806-0624-10）、可通过\
  \ Web `docs.sun.com` 获取，以及通过 Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\nSun Microsystems,\
  \ *System Reference Manual, Section 1M - System Administration Commands*。提供纸质版（部件号\
  \ 806-0625-10）、可通过 Web `docs.sun.com` 获取，以及通过 Solaris 8 操作系统提供的在线文档 AnswerBook2\
  \ 获取。\n\n338\n\n### 第 18 章：网络文件系统\n\n### 你需要理解的术语：\n\n* 网络文件系统 (NFS)\n* 资源共享与挂载\n\
  * WebNFS\n* 自动文件系统 (AutoFS) 服务\n* 缓存文件系统 (CacheFS) 服务\n\n#### 你需要掌握的技巧：\n\n* 共享和取消\
  \ NFS 资源\n* 挂载和卸载 NFS 资源\n* 确定 NFS 资源是否共享或挂载\n* 配置 AutoFS 映射\n* 管理 CacheFS 缓存\n\n\
  本章涵盖了与文件系统相关的最后主题。第一部分涵盖了网络文件系统 (NFS) 以及用于管理 NFS 的命令。下一部分描述了支持 NFS 的 AutoFS 和 CacheFS\
  \ 服务。本章涵盖了 `NFS`、`AutoFS` 和 `CacheFS` 测试目标。\n\n#### NFS 环境\n\nNFS 服务使用服务器/客户端模型，允许系统远程访问其他系统的存储。NFS\
  \ 协议由请求意见稿 (RFC) 1813 定义，“NFS 版本 3 协议规范”。\n\nNFS 服务器允许运行不同操作系统的具有不同架构的计算机跨越网络访问其存储空间。NFS\
  \ 服务还允许多个系统访问相同的信息，从而消除冗余、提高一致性并减少管理工作。\n\nNFS 客户端以某种透明的模式访问这些信息。也就是说，远程资源在大多数操作和应用程序中显示并可以被视为本地存储空间。\n\
  \n339\n\n#### NFS 管理\n\n在客户端通过 NFS 访问文件系统或目录（即 `mounted` 挂载）之前，它们必须被 `shared`（共享），或者在旧术语中被称为\
  \ `advertised`（发布）。一旦资源被共享，授权的 NFS 客户端就可以挂载它们。\n\n**考试提示** 共享 NFS 资源的另一个术语是 `exporting`。该术语偶尔出现在\
  \ Solaris 文档中，但最常见的是 NFS 资源的目录名，例如 `/export/home` 或 `/export/swap`。\n\n#### 共享 NFS\
  \ 资源\n\n可以使用 `share(1M)` 命令共享 NFS 资源，并使用 `unshare(1M)` 命令取消共享。此外，`/etc/dfs/dfstab`\
  \ 文件中标识的任何资源在系统启动或使用 `shareall(1M)` 命令时会自动共享。共享资源会自动记录在 `/etc/dfs/sharetab` 文件中。当使用\
  \ `unshareall(1M)` 命令时，`/etc/dfs/sharetab` 文件列出的所有资源将自动取消共享。\n\n**考试提示** 实际上，当系统由于启动或管理员的操作进入系统运行级别\
  \ 3 时，NFS 服务器会启动并共享标识的资源。当系统运行级别变为 3 以外的任何级别时，资源将取消共享且 NFS 服务器将停止。记住 NFS 客户端是在运行级别\
  \ 2 的。\n\n#### share 命令\n\n`share` 命令共享 NFS 资源，以便 NFS 客户端可以挂载并访问它们。至少，你必须将要共享的目录完整路径（或文件系统的挂载点）作为命令行参数。\n\
  \n此外，还支持另外三个命令行参数。`-d` 命令行参数后是所共享数据的描述。`-F nfs` 命令行参数用于指定文件系统类型。如果没有指定，则假设使用 `/etc/dfs/fstypes`\
  \ 文件中列出的默认文件系统类型 (NFS)。`-o` 命令行参数后是一个或多个 NFS 特有的选项（用逗号隔开）。NFS 的 `share` 命令选项如表 18.1\
  \ 所示。有关这些选项相关设置的详情，请参阅 *System Reference Manual* 中的 `share(1M)` 描述。\n\n表 18.1：share\
  \ 命令的 NFS 特有选项。\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `aclok` | 允许对 NFS 版本 2 客户端进行访问控制\
  \ |\n\n340\n\n表 18.1：share 命令的 NFS 特有选项。\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `anon=uid*`\
  \ | 为匿名用户分配 uid |\n| `index=file*` | 为 WebNFS 显示 *file* 的内容而不是列出目录 |\n| `nosub`\
  \ | 防止客户端挂载子目录 |\n| `nosuid` | 防止客户端对文件设置 uid 或 setgid 访问 |\n| `public` | 指定公共文件句柄\
  \ |\n| `ro` | 允许只读访问 |\n| `ro=list*` | 允许对 *list* 指定的客户端进行只读访问 |\n| `root=list*`\
  \ | 允许对 *list* 指定的用户进行 root 访问 |\n| `rw` | 允许读/写访问 |\n| `rw=list*` | 允许对 *list*\
  \ 指定的客户端进行读/写访问 |\n| `sec=mode*` | 使用 *mode* 指定的一种或多种安全模式来身份验证客户端 |\n| `window=value*`\
  \ | 设置客户端凭证的最长寿命为 *value* 秒 |\n\n以下列表使用 `share` 命令允许 NFS 客户端挂载 /export/home 文件系统，包括\
  \ WebNFS 客户端。所有客户端都具有只读访问权限：\n\n```\nshare -F nfs -o public,ro /export/home\n```\n\
  \n如果你在不带任何命令行参数的情况下使用 `share` 命令，将列出共享资源。\n\n#### unshare 命令\n\n`unshare` 命令停止 NFS\
  \ 资源的共享，使 NFS 客户端无法再次挂载和访问。至少，你必须将当前共享的目录完整路径（或文件系统的挂载点）作为命令行参数。\n\n341\n\n仅支持另一个命令行参数：`-F\
  \ nfs`，用于指定文件系统类型。如果没有指定，则假设 `/etc/dfs/fstypes` 文件中列出的默认文件系统类型 (NFS)。\n\n以下列表使用\
  \ `unshare` 命令停止 /export/home 文件系统的共享：\n\n```\nunshare -F nfs /export/home\n```\n\
  \n#### /etc/dfs/dfstab 文件\n\n`/etc/dfs/dfstab` 文件指定系统变为级别 3 或使用 `shareall` 命令时自动共享的资源。\n\
  \n可以使用任何文本编辑器修改此文件。要自动共享资源，请在 /etc/dfs/dfstab 文件中添加一行包含 `share` 命令的内容，以及手动输入所需的命令行参数和选项。要删除资源的自动共享，请从\
  \ /etc/dfs/dfstab 中删除相应的 `share` 命令。参见之前描述的 `share` 命令示例。\n\n**注意** 你可能会疑惑为什么与 NFS\
  \ 相关的某些目录、文件甚至命令使用 *dfs* 或 *df*。这种用法源于 Unix 操作系统的 System V (5) 版本。最初，分布式文件系统 (DFS)\
  \ 有两种变体：NFS 和远程文件系统 (RFS)。\n\n\n\n\n被用于管理和配置两种类型的文件系统。从那时起，RFS 已经消失，留下了 DFS 遗产。\n\
  \n## shareall 和 unshareall 命令\n\n`shareall` 命令共享一个或多个资源。如果没有指定 `-F nfs` 命令行参数，则假设默认文件系统类型为\
  \ (NFS)。如果没有作为命令行参数指定文件名（包含一个或多个 `share` 命令的文件），则默认使用 `/etc/dfs/dfstab` 文件。\n\n\
  `unshareall` 命令取消共享所有当前共享的资源。如果没有指定 `-F nfs` 命令行参数，则假设默认文件系统类型为 (NFS)。\n\n## dfshares\
  \ 命令\n\n`dfshares`(1M) 命令列出本地或远程系统上的共享资源。如果作为命令行参数指定远程系统的主机名（或 IP 地址），将列出该系统上共享的资源。\n\
  \n342\n\n此外，还支持另外两个命令行参数。`-F nfs` 命令行参数用于指定文件系统的类型。如果未指定，则假设使用 `/etc/dfs/fstypes`\
  \ 文件中列出的默认文件系统类型 (NFS)。如果指定了 `-h` 命令行参数，则不显示描述资源列表列的表头。\n\n此外，你可以从 `/etc/dfs/sharetab`\
  \ 文件获取本地共享资源的信息。该文件由 `share`、`shareall`、`unshare` 和 `unshareall` 命令更新，以反映当前共享的资源。\n\
  \n## 挂载 NFS 资源\n\n由 NFS 服务器共享的 NFS 资源可以使用 NFS 客户端通过 `mount`(1M) 命令挂载，并使用 `umount`(1M)\
  \ 命令卸载。此外，`/etc/vfstab` 文件中标识任何 NFS 资源会在系统启动或使用 `mountall`(1M) 命令时自动挂载。同样，`/etc/mnttab`\
  \ 文件中列出的 NFS 资源将通过 `umountall`(1M) 命令卸载。\n\n### mount 命令\n\n`mount` 命令用于像其他任何标准\
  \ Solaris 文件系统一样挂载 NFS 资源，以便 NFS 客户端可以挂载并访问它们。对于 NFS，你将当前共享目录的主机名（或 Internet 协议\
  \ [IP] 地址）和路径作为命令行参数，后跟一个挂载点。主机名和路径之间用冒号（`:`）分隔。通用的 `mount` 命令行参数列在表 18.2 中。配合 `-o`\
  \ 命令行参数的一些较重要的 NFS 特有选项列在表 18.3 中（多个 NFS 特有选项之间用逗号分隔）。更多信息，请参阅*系统参考手册*中的 `mount_nfs`(1M)\
  \ 页面。\n\n表 18.2：mount 命令命令行参数。\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `-F *stype*` |\
  \ 指定文件系统类型 |\n| `-m` | 在不创建 `/etc/mnttab` 条目的情况下挂载文件系统 |\n| `-o` | 指定 NFS 特有选项（见表\
  \ 18.3） |\n| `-O` | 覆盖现有的挂载点 |\n| `-r` | 以只读方式挂载文件系统 |\n\n表 18.3：mount 命令的 NFS 特有选项。\n\
  \n| 选项 | 描述 |\n| :--- | :--- |\n| `hard` | 如果服务器没有响应，继续尝试挂载资源 |\n| `intr` | 允许在等待\
  \ `hard` 挂载时通过键盘中断杀死进程 |\n| `nointr` | 不允许在等待 `hard` 挂载时通过键盘中断杀死进程 |\n| `public`\
  \ | 指定公共文件句柄 |\n| `retrans= *n*` | 重传 NFS 请求 `n` 次 |\n| `retry= *n*` | 重试挂载操作 `n`\
  \ 次 |\n| `ro` | 以只读方式挂载资源 |\n| `rw` | 以读/写方式挂载资源 |\n| `soft` | 如果服务器没有响应，返回错误并退出\
  \ |\n| `timeo= *n*` | 设置 NFS 超为 `n` 十分之一秒 |\n\n以下列表使用 `mount` 命令将 sun 系统的 `/export/home`\
  \ 文件挂载到 `/sun_home` 挂载点。该资源是软挂载的（1,000 次尝试）并具有只读访问权限：\n\n```bash\n# mount -F nfs\
  \ -o soft,retry=1000,ro sun:/export/home /sun_home\n```\n\n如果你在不带任何命令行参数的情况下使用 `mount`\
  \ 命令将显示所有当前挂载的文件系统（标准 Solaris 文件系统和 NFS 资源）。\n\n## umount 命令\n\n`umount` 命令用于卸载文件系统和\
  \ NFS 资源，以便 NFS 客户端不再能访问它们。对于 NFS，你将当前共享目录的主机名（或 IP 地址）和路径作为命令行参数，后跟一个挂载点。支持另外两个命令行参数。第一个是\
  \ `-V`，显示当前挂载的文件系统；第二个是 `-a`，在可能的情况下执行卸载。以下列表使用 `mount` 命令挂载 sun 系统的 `/export/home`\
  \ 文件：\n\n```bash\n# umount /export/home\n# \n solaris:/export/home\n```\n\n344\n\
  \n## /etc/vfstab 文件\n\n`/etc/vfstab` 文件又称为*文件系统表*，指定了系统启动或使用 `mountall` 命令时自动挂载的资源。可以使用任何文本编辑器修改此文件。要自动挂载\
  \ NFS 资源，向 `/etc/vfstab` 文件中添加一行。要删除 NFS 资源的自动挂载，从 `/etc/vfstab` 文件中删除该行。表 18.4\
  \ 列出了与挂载 NFS 资源相关的（制表符）字段和 vfstab 条目中的相应值。连字符表示无条目。表 18.4：NFS 资源的 vfstab 条目字段。\n\
  \n| 字段 | 描述 |\n| :--- | :--- |\n| **Device To Mount** | 使用 *system*:*resource* 格式，其中\
  \ *system* 是主机名或 IP 地址，*resource* 是共享资源的完整路径 |\n| **Device To fsck** | 使用连字符 `-`\
  \ 表示无条目，因为不 应该使用 `fsck` 命令检查远程 NFS 资源 |\n| **Mount Point** | 指定挂载 NFS 资源的子目录 |\n\
  | **FS Type** | 使用 `nfs` 表示 NFS 资源 |\n| **fsck Pass** | 使用连字符 `-` 表示无条目 |\n| **Mount\
  \ At Boot** | 使用 `yes` 表示启动或执行 `mountall` 命令时挂载；否则使用 `no` |\n| **Mount Options**\
  \ | 指定任何所需的 NFS 挂载选项 |\n\nNFS 支持*客户端故障转移*。也就是说，如果 NFS 资源不可用，客户端可以切换到提供该资源“副本”的另一个\
  \ NFS 服务器。通过在 /etc/vfstab 文件中添加条目来启用此故障转移功能。在 **Device To Mount** 字段中，列出提供副本的系统并用逗号分隔。你还应该在\
  \ **Mount Options** 字段中指定只读选项（`-o ro`）。例如，为从 **alpha** 或 **beta** NFS 服务器可用并挂载在\
  \ /usr/local 的 /export/local 资源提供客户端故障转移，向 /etc/vfstab 文件添加以下条目：\n\n345\n\n```bash\n\
  alpha,beta:/export/local - /usr/local nfs - no -o ro\n```\n\n考试提醒 只读资源（`-o ro` 挂载选项）应为客户端故障转移进行配置。还要确保系统主机名或\
  \ IP 地址有效并用逗号分隔。\n\n## mountall 和 umountall 命令\n\n`mountall` 命令用于挂载一个或多个本地文件系统和/或远程\
  \ (NFS) 共享文件系统或目录。如果没有指定文件名（包含一个或多个\n\n\n\n\n如果未通过命令行参数指定资源（resources），则默认使用 `/etc/vfstab`。`mountall`\
  \ 命令将仅挂载文件系统表（或指定的文件）中 `Mount At Boot`（启动挂载）设置为 `yes` 的资源。\n\n如果使用 `-F` 命令行选项指定文件系统类型，则只挂载该类型的文件系统。如果指定\
  \ `-l` 命令行参数，则只挂载本地文件系统或目录。如果指定 `-r` 命令行参数，则只挂载远程共享文件系统或目录。\n\n`umountall` 命令用于卸载所有当前挂载的资源。它也支持\
  \ `mountall` 命令支持的 `-F`、`-l` 和 `-r` 命令行参数。此外，它还支持 `-h` `host` 命令行参数，指定仅卸载从该主机挂载的资源。`-k`\
  \ 命令行参数可以使用 `fuser`(1M) 命令杀死进程以允许卸载。此外还有 `-s` 命令行参数，防止并行执行卸载操作。当前挂载的文件资源通常列在 `/etc/mnttab`\
  \ 文件中。\n\n## dfmounts 命令\n\n`dfmounts`(1M) 命令列出本地或远程系统（及其客户端）当前挂载的资源。如果你将远程系统的主机（或\
  \ IP 地址）作为命令行参数，将列出挂载在该系统（及其客户端）上的资源。\n\n此外，支持另外两个命令行参数。`-F nfs` 命令行参数用于指定文件系统类型。如果没有指定，则假设使用\
  \ `/etc/dfs/fstypes` 文件列出的默认文件系统类型（NFS）。如果指定 `-h` 命令行参数，则不显示描述列表列的头部。以下列表使用 `dfmounts`\
  \ 命令列出名为 `solaris` 的本地系统上的 NFS 资源：\n\n```\ndfmounts\nRESOURCE SERVER PATHNAME CLIENTS\n\
  - solaris /export/home uxsys2.ambro.org\n```\n\n## WebNFS\n\nWebNFS 扩展了 NFS 协议，允许\
  \ Web 浏览器或 Java App 访问 NFS 共享资源。它允许客户端系统在不需要 NFS 客户端的情况下访问 NFS 资源。浏览器可以使用 NFS 统一资源定位符（URL）访问\
  \ NFS 资源，格式为 `nfs://*server*/path*`。WebNFS 服务器和客户端规范由 RFC 2054 和 2055 定义。\n\n`share`\
  \ 命令支持两个与 WebNFS 访问相关的 NFS 特定选项。第一个是 `public` 选项。每个服务器有一个与服务器根文件系统关联的公共文件句柄。NFS\
  \ URL 相对于该公共文件句柄。例如，访问主机服务器上 `/usr/data` 共享资源下的目标目录需要使用 `nfs://server/usr/data/target`\
  \ NFS URL。但是，如果在共享 `/usr/data` 目录时指定了 `public` 选项，公共文件句柄将与 `/usr/data` 目录关联；这种关联允许使用\
  \ `nfs://server/target` NFS URL 访问相同的数据。\n\n第二个选项是 `index`，用于指定一个包含信息的文件，显示显示替代目录列表。以下列表使用\
  \ `share` 命令启用相对于 `/export/home` 目录的读写 NFS 和 WebNFS 访问：\n\n```\nshare -F nfs -o\
  \ rw,public,index=index.html /export/home\n```\n\n## 自动文件系统服务\n\n自动文件系统（AutoFS）服务是一种客户端服务，用于根据需要自动挂载和卸载\
  \ NFS 资源。该服务简化了手动跟踪资源的流程，并可以减少网络流量。此外，AutoFS 消除了在 `/etc/vfstab` 文件中添加 NFS 挂载的需求。它可以加快启动和关机，且用户不需要根密码即可挂载/卸载\
  \ NFS 资源。\n\n`automount`(1M) 命令在系统启动（系统运行级别 2）时运行并初始化 AutoFS 服务。此外，`automountd`(1M)\
  \ 命令在此时启动。该命令是一个持续运行的守护进程，提供自动挂载和卸载。\n\n默认情况下，如果资源 10 分钟内未被访问，则会被卸载。你可以使用 `automount`\
  \ 命令并包含 `-t` 命令行参数以及代表时间（秒）的数字来修改此默认时间。\n\nAutoFS 服务的配置由 AutoFS 映射控制，这些映射定义了本地挂载点并将远程\
  \ NFS 资源与挂载点关联。`automount` 命令在初始化期间读取这些映射。\n\n## AutoFS 映射\n\n三种类型的 AutoFS（或 automount）映射是\
  \ auto_master、direct（直接）和 indirect（间接）。所有映射都在 `/etc` 目录下。\n\n### /etc/auto_master\
  \ 文件\n\n`auto_master` 文件将目录与间接映射关联。此外，`auto_master` 文件引用了一个或多个直接映射。\n\n`auto_master`\
  \ 文件中的条目由三个字段组成：\n\n- `Mount point`（挂载点）：挂载 NFS 资源的本地目录的完整路径的初始部分。\n- `Map name`（映射名称）：映射（直接或间接）的文件名或特殊的内置映射。你可以通过名称中的第一个字符识别内置映射，该字符是连字符（`-`）。\n\
  - `Mount options`（挂载选项）：零或多个（逗号分隔）的 NFS 特定挂载选项，如前文表 18.3 所示。\n\n使用符号 `/-` 的特殊挂载点表示映射名称字段中列出的映射是实际包含挂载点的直接映射。此外，仅包含关键字\
  \ `+auto_master` 的特殊条目用于包含属于网络信息服务（NIS）或 NIS+ 的 AutoFS 映射。\n\n以下列表显示了 `/etc/auto_master`\
  \ 文件的内容：\n\n```\n# Master map for automounter\n+auto_master\n/net -hosts -nosuid,nobrowse\n\
  /home auto_home -nobrowse\n/xfn -xfn\n/- auto_direct\n```\n\n如前所述，`/net` 和 `/xfn`\
  \ 条目引用了内置映射。`/home` 条目引用间接映射 `/etc/auto_home`，而 `/` 条目引用直接映射 `/etc/auto_direct`。\n\
  \n`-hosts` 内置映射使用主机数据库。`-xfn` 内置映射使用通过联邦命名服务（FNS）共享的资源。\n\n## 直接映射\n\n直接映射同时提供挂载点和\
  \ NFS 资源。直接映射中的条目由三个字段组成：\n\n- `Mount point`（挂载点）：通常是准备用挂载点的完整路径。\n- `Mount options`（挂载选项）：零或多个（逗号分隔）的\
  \ NFS 特定挂载选项，如前文表 18.3 所示。\n- `NFS resource`（NFS 资源）：格式为 `server:file` 的文件，标识由系统服务器共享的文件系统。由于多个\
  \ NFS 服务器可能提供相同的资源，可以指定多个资源（用空格分隔）。将使用第一个可用资源。\n\n以下列表显示了 `/etc/auto_master` 文件引用的\
  \ `/etc/auto_direct` 文件内容：\n\n```\n/usr/local/bin nfsserver:/usr/local/bin\n/usr/games\
  \ -ro nfsserver:/usr/games\n```\n\n在此示例中，名为 `nfsserver` 的主机共享的 `/usr/local/bin`\
  \ 和 `/usr/games` 目录以相同名称挂载点挂载到本地系统上。\n\n**考试提醒**：初始直接映射的默认名称为 `auto_direct`。\n\n\
  ## 间接映射\n\n间接映射提供 `/etc/auto_master` 挂载点的剩余部分并标识应挂载在客户端上的 NFS 资源。间接映射中的条目由三个字段组成：\n\
  \n- `Key`（键）：通常是提供挂载点剩余目录。\n- `Mount options`（挂载选项）：零或多个（逗号分隔）的 NFS 特定挂载选项，如前文表\
  \ 18.3 所示。\n\n\n\n\n\n- `NFS resource`—格式为 `server`:`file` `system` 的文件，用于标识由系统服务器共享的文件系统。\n\
  \n以下列表显示了 `/etc/auto_home` 文件的内容：\n\n```bash\ndla solaris:/export/home/dla\nguest\
  \ -rw,nosuid nfsserver:/export/home/guest\n```\n\n在此示例中，间接映射由 `auto_master` 文件中的\
  \ `/home` 条目引用。它包含两个条目。第一个条目标识 `/home/dla` 挂载点，用于挂载名为 `solaris` 的主机 `/export/home/dla`\
  \ 目录。第二个条目标识 `/home/guest` 挂载点，用于挂载名为 `nfsserver` 的主机 `/export/home/guest` 目录。\n\
  \n考试提醒：初始直接映射的默认名称为 `auto_home`。\n\n## 运行 automount 命令\n\n当对 AutoFS 映射进行更改时，你可能需要手动执行\
  \ `automount` 命令。对 `/etc/auto_master` 文件的任何更改都需要执行 `automount` 命令才能生效。当对直接映射进行添加或删除时，也必须执行该命令。\n\
  \n## 缓存文件系统服务\n\n缓存文件系统（CacheFS）是一种客户端服务，提供在 NFS 客户端本地缓存远程访问的 NFS 资源的能力。这样做不仅可以提高客户端访问数据的速度，还可以减少网络流量和\
  \ NFS 服务器的负载。\n\n在创建缓存后，可以将远程 NFS 资源挂载“到”缓存中。首次访问该资源时，数据将从远程 NFS 服务器复制到本地缓存。随后的访问将来自本地缓存而非远程\
  \ NFS 服务器。与其他类型的文件系统一样，可以使用 `mount` 命令手动挂载远程 NFS 资源，在系统启动时通过将其添加到 `/etc/vfstab`\
  \ 文件，或者在需要时使用 AutoFS 机制（在上一节描述）。\n\n注意：根（`/`）系统和 `/usr` 文件系统无法使用 CacheFS 机制进行缓存。然而，这两个文件系统可以使用\
  \ AutoClient 配置进行缓存，第 13 章将对其进行简要描述。\n\n## 配置缓存\n\n`cfsadmin`(1M) 命令用于创建、检查、调整和删除缓存。`cachefsstat`(1M)\
  \ 命令也可用于显示缓存统计信息。\n\n你指定 `-c` 命令行参数来创建缓存，后跟用于缓存的目录的完整路径。此外，可以使用 `-o` 命令行参数（用逗号分隔）指定多个选项。以下列表使用\
  \ `cfsadmin` 命令在 `/cache` 目录下创建一个缓存。可缓存的最大文件大小设置为 10MB：\n\n```bash\n# cfsadmin -c\
  \ -o maxfilesize=10 /cache\n```\n\n使用 `-l` 命令行参数列出挂载在缓存中的文件系统和缓存状态。额外的命令行参数包括 `-s`\
  \ 执行一致性检查，`-u` 更新缓存参数，以及 `-d` 删除缓存。所有这些命令行参数后都应该紧跟缓存目录的完整路径。\n\n使用 `mount` 命令在缓存中挂载远程\
  \ NFS 资源需要指定远程文件系统、本地缓存和本地挂载点。\n\n应使用 `-F` 命令行参数来标识文件系统类型为 CacheFS。此外，需要使用 `-o`\
  \ 命令行参数指定至少两个缓存特定的挂载选项：`backfstype`，用于标识正在挂载的文件系统类型（通常为 NFS）；以及 `cachedir`，用于标识缓存目录。以下列表使用\
  \ `mount` 命令将主机 `sparc20` 的 `/export/home` 文件系统挂载到 `/home` 挂载点（称为*前端文件系统*），并使用 `/cache`\
  \ 作为缓存目录。该行已换行以提高可读性：\n\n```bash\n# mount -F cachefs -o backfstype=nfs,cachedir=/cache\n\
  sparc20:/export/home /home\n```\n\n## 检查缓存状态\n\n显示缓存文件系统的状态，使用 `cfsadmin` 命令并指定\
  \ `-l` 命令行参数，后跟缓存名称。\n\n显示关于缓存的以下信息：\n\n- `maxblocks`—缓存可以使用的最大存储空间（以前端文件系统块的百分比表示）。\n\
  - `minblocks`—缓存可以使用的最小存储空间（以前端文件系统块的百分比表示）。\n- `threshblocks`—达到 `minblocks` 后无法再获取额外资源的阈值（以前端文件系统块的百分比表示）。\n\
  - `maxfiles`—缓存可以使用的最大文件数量（以前端文件系统块的百分比表示）。\n- `minfiles`—缓存可以使用的最小文件数量（以前端文件系统块的百分比表示）。\n\
  - `threshfiles`—达到 `minfiles` 后无法再获取额外 inode 的阈值（以前端文件系统 inode 的百分比表示）。\n- `maxfilesize`—缓存中允许的最大文件大小。\n\
  - `mount info`—正在挂载的资源及其本地挂载点。斜杠（`/`）字符显示为下划线（`_`）字符。\n\n可以使用 `cfsadmin -u` 命令修改最大、最小和阈值参数。以下列表使用\
  \ `cfsadmin -l` 命令显示缓存状态：\n\n```bash\n# cfsadmin -l /cache\ncfsadmin: list cache\
  \ FS information\nmaxblocks 90%\nminblocks 0%\nthreshblocks 85%\nmaxfiles 90%\n\
  minfiles 0%\nthreshfiles 85%\nmaxfiles 3MB\nsparc20:_export_home:_home\n```\n\n\
  ## 显示缓存统计信息\n\n显示有关缓存文件系统性能的统计信息，使用 `cachefsstat`(1M) 命令并指定缓存文件系统的挂载点。\n\n显示关于缓存文件的以下统计：\n\
  \n- `cache hit rate`—在缓存文件系统中查找文件或目录的尝试成功百分比，后是实际命中和缺失的计数。\n- `consistency checks`—执行的一致检查的数量，后是通过和失败的计数。\n\
  - `modifies`—修改操作的数量。\n- `garbage collection`—回收未使用资源的尝试次数。\n\n以下列表使用 `cachefsstat`\
  \ 命令显示缓存文件统计：\n\n```bash\n# cachefsstat /home\n/home\ncache hit rate: 57% (8 hits,\
  \ 6 misses)\nconsistency checks: 14 (14 pass, 0 fail)\nmodifies: 0\ngarbage collection:\
  \ 0\n```\n\n考试提醒：注意 `cfsadmin -l` 命令报告缓存的配置状态（可调参数），而 `cachefsstat` 报告缓存的内容。\n\n\
  ## 检查缓存的一致性\n\n为了确保缓存中的信息是最新的，系统会自动定期执行一致性检查。这些检查可能会产生大量的网络活动。为了减少网络流量，你可以禁用自动一致性检查并手动（按需）检查一致性。\n\
  \n禁用自动一致性检查（即请求按需一致性检查），在挂载文件系统时指定 `demandconst` 选项。该行已换行以提高可读性：\n\n```bash\n# mount\
  \ -F cachefs -o backfstype=nfs,cachedir=/cache,demandconst\nsparc20:/export/home\
  \ /home\n```\n\n要按需执行一致性检查，使用 `cfsadmin -s` 后跟跟缓存文件系统的挂载点作为命令行参数：\n\n```bash\n#\
  \ cfsadmin -s /home\n```\n\n## 管理缓存日志\n\n`cachefslog`(1M) 命令用于设置、验证和停止 CacheFS 日志。`cachefswssize`(1M)\
  \ 命令用于分析日志以确定建议的工作\n\n\n\n\n设置缓存大小。缓存太小会导致访问延迟和更高的网络流量（缓存命中率低）。缓存太大则会浪费文件系统空间。\n\
  \n要设置 CacheFS 日志，请使用 `cachefslog` 命令并配合 `-f` 命令行参数，其后紧跟用于日志的文件名以及缓存文件系统挂载的目录名称（而不是缓存本身的名称）。例如，要在挂载在\
  \ `/home` 的缓存文件系统上设置一个名为 `/var/tmp/home_log` 的日志，请使用以下 `cachefslog` 命令：\n\n```\n\
  # cachefslog -f /var/tmp/home_log /home\n/var/tmp/home_log: /home\n#\n```\n\n要验证缓存日志功能是否已开启，请使用\
  \ `cachefslog` 命令，并仅将缓存文件系统的挂载点作为命令行参数：\n\n```\n# cachefslog /home\n/var/tmp/home_log:\
  \ /home\n#\n```\n\n要停止记录，请使用 `cachefslog` 命令并配合 `-h` 命令行参数，其后紧跟缓存文件系统的挂载点：\n\n```\n\
  # cachefslog -h /home\nnot logged: /home\n#\n```\n\n要确定合适的缓存大小，请设置 CacheFS 日志并允许其运行一段时间（例如一天或一周），以提供代表性工作负载的快照。然后，停止记录并使用\
  \ `cachefswssize` 命令，将日志文件名作为命令行参数：\n\n```\n# cachefswssize /var/tmp/home_log /home\n\
  end size: 72k\nhigh water size: 72k\ntotal for cache\ninitial size: 53888k\nend\
  \ size: 72k\nhigh water size: 72k\n#\n```\n\n对于每个挂载在缓存中的文件系统，都会显示 `end size`（停止记录时的缓存工作集大小）和\
  \ `high water size`（最大缓存工作集大小）。在本示例中，仅挂载了一个文件系统（`/home`）。\n\n`total for cache` 摘要包含了缓存的\
  \ `initial size`。如果 `high water size` 等于 `initial size`，则缓存可能太小了。如果 `high water\
  \ size` 远小于 `initial size`，则缓存可能太大。\n\n### 练习题\n\n### 问题 1\n使用哪个命令可以将来自 Solaris\
  \ 系统（IP 地址为 192.168.39.7）的 `/export/home` 文件系统挂载到 `/mnt` 挂载点？\n\na. `mount -F nfs\
  \ -h solaris /export/home /mnt`\nb. `mount -F nfs 192.168.39.7:/export/home /mnt`\n\
  c. `mount -F nfs /mnt solaris:/export/home`\nd. `mount -F nfs /export/home@solaris\
  \ /mnt`\n\n答案 b 是正确的。`-F` 文件系统类型之后的第一个参数应该是共享资源的系统主机名或 IP 地址。其他答案均未使用适当的语法或命令行参数。因此，答案\
  \ a、c 和 d 是错误的。\n\n### 问题 2\n输入用于在本地磁盘上临时存储 NFS 资源的文件系统类型名称。\n\n正确答案是 CacheFS。\n\
  \n#### 问题 3\n以下哪些是 AutoFS 映射（maps）的类型？[选择所有适用项]\n\na. direct\nb. indirect\nc. linked\n\
  d. auto_master\ne. auto_home\n\n答案 a、b 和 d 是正确的。direct、indirect 和 auto_master 是\
  \ AutoFS 映射的类型。`linked` 名称与 AutoFS 功能关联。因此，答案 c 是错误的。auto_home 是间接映射（indirect map）的常用名称。因此，答案\
  \ e 是错误的。\n\n#### 问题 4\n以下哪些情况需要手动执行 `automount` 命令？[选择所有适用项]\n\na. 添加到 auto_master\n\
  b. 添加到直接映射（direct map）\nc. 添加到间接映射（indirect map）\nd. 从 auto_master 删除\ne. 从直接映射删除\n\
  f. 从间接映射删除\n\n答案 a、b、d 和 e 是正确的。在 auto_master 或直接映射中添加或删除内容后，你必须手动执行 `automount`。间接映射的更改不需要运行\
  \ `automount` 命令。因此，答案 c 和 f 是错误的。\n\n#### 问题 5\n以下哪个命令用于创建 CacheFS 配置？\n\na. `cfsadm`\n\
  b. `cachefsinit`\nc. `cfsadmin`\nd. `newcache`\ne. `cfscreate`\n\n答案 c 是正确的。`cfsadmin`\
  \ 命令创建 CacheFS 配置。其他命令均不存在。因此，答案 a、b、d 和 e 是错误的。\n\n#### 问题 6\n识别用于使 NFS 资源可挂载或列出已可用这些这些资源的命令。\n\
  \n正确答案是 `share`。\n\n#### 问题 7\n将每个命令与其操作匹配：\n\na. `cachefswssize` 1. 显示缓存文件系统统计信息\n\
  b. `cachefslog -h` 2. 显示缓存状态\nc. `cachefslog -f` 3. 显示缓存工作集大小\nd. `cachefsstat`\
  \ 4. 开始缓存日志\ne. `cfsadmin -l` 5. 停止缓存日志\n\n答案 a-3, b-5, c-4, d-1 和 e-2 是正确的。`cachefswssize`\
  \ 命令显示缓存工作集的大小。对于 `cachefslog` 命令，`-h` 停止日志，`-f` 开始日志。`cachefsstat` 命令显示与缓存内容相关的统计数据，而\
  \ `cfsadmin -l` 显示缓存本身的状态。\n\n#### 问题 8\n使用哪个命令可以确定任何已挂载的 NFS 资源？[选择所有适用项]\n\na.\
  \ `share`\nb. `dfmounts`\nc. `nfsmounts`\nd. `mountall`\ne. `mount`\n\n答案 b 和 e\
  \ 是正确的。你可以使用 `dfmounts` 和 `mount` 命令确定任何已挂载的 NFS 资源。`share` 用于共享 NFS 资源。因此，答案 a\
  \ 是错误的。`nfsmounts` 不存在。因此，答案 c 是错误的。`mountall` 用于挂载资源而不是列出 NFS 资源。因此，答案 d 是错误的。\n\
  \n#### 问题 9\n使用 NFS 时，以下哪些结果是？[选择所有适用项]\n\na. 引入冗余\nb. 提高一致性\nc. 减少管理工作\nd. 减少网络流量\n\
  \n答案 b 和 c 是正确的。使用 NFS 提高了一致性并减少了管理工作。NFS 通过为多个客户端提供单一数据副本消除了冗余。因此，答案 a 是错误的。NFS\
  \ 是一个网络应用程序，使用它会增加网络流量。因此，答案 d 是错误的。\n\n#### 问题 10\n识别用于 `share` 命令的 `-o` 命令行参数的\
  \ NFS 特有选项，用于更改公共句柄。\n\n正确答案是 `public`。\n\n#### 问题 11\n哪个文件包含一个或多个与 `shareall` 命令使用的\
  \ `share` 命令？\n\na. `/etc/nfs/nfstab`\nb. `/etc/nfs/shares`\nc. `/etc/dfs/dfstab`\n\
  d. `/etc/dfs/sharetab`\n\n答案 c 是正确的。`/etc/dfs/dfstab` 文件包含一个或多个与 `shareall` 命令使用的\
  \ `share` 命令。`/etc/nfs/nfstab` 和 `/etc/nfs/shares` 文件不存在。因此，答案 a 和 b 是错误的。`/etc/dfs/sharetab`\
  \ 是包含共享资源的文件。因此，答案 d 是错误的。\n\n#### 问题 12\n命令 `cfsadmin -s xyz` 失败。以下可能的可能是是什么？\n\
  \na. xyz 是挂载点。它应该是缓存的名称。\nb. 在挂载 xyz 时没有指定 `demandconst` 选项。\nc. 尚未启动缓存日志。\nd. 缓存太太小。\n\
  \n答案 b 是正确的。`cfsadmin -s xyz` 命令失败可能是因为在挂载 xyz 时没有指定 `demandconst` 选项。xyz 必须是一个挂载点而不是缓存名称。因此，答案\
  \ a 是错误的。`-s` 命令行参数执行一致性检查；它与日志或缓存大小无关。因此答案 c 和 d 是错误的。\n\n**需要了解更多吗？**\n\nStern,\
  \ Hal, *Managing NFS and NIS* (O’Reily & Associates, Sebastopol, CA, 1991), ISBN\
  \ 0-937175-75-7.\n\nSun Microsystems, *System Administration Guide, Volume 1*. 可通过打印版（部件号\
  \ 805-7228-10）、Web 上的 **docs.sun.com** 以及随 Solaris 8 操作系统附带的在线文档 AnswerBook2 获取。\n\
  \n\n\n\n\nSun Microsystems, *系统管理指南，第 3 *。提供打印版（部件号 806-0916-10）、网页版 `docs.sun.com`，以及通过\
  \ Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\n358\n\nSun Microsystems, *系统参考手册，第 1M\
  \ 部分 - 管理命令*。提供打印版（部件号 806-0625-10）、网页版 `docs.sun.com`，以及通过 Solaris 8 操作系统提供的在线文档\
  \ AnswerBook2 获取。\n\nSun Microsystems, *系统参考手册，第 4 部分 - 文件格式*。提供打印版（部件号 806-0633-10）、网页版\
  \ `docs.sun.com`，以及通过 Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\nCallaghan, B. J.,\
  \ 请求征求 2054，“WebNFS 客户端规范”（1996 年 10 月）。访问地址 `www.nic.mil/ftp/rfc/rfc2054.txt`。\n\
  \nCallaghan, B. J., 请求征求 2055，“WebNFS 服务器规范”（1996 年 10 月）。访问地址 `www.nic.mil/ftp/rfc/rfc2055.txt`。\n\
  \nCallaghan, B. J., “WebNFS”（1997 年 4 月）。访问地址 `www.sun.com/webnfs`。\n\nCallaghan,\
  \ B. J., B. Pawlowski, and P. Staubach, 请求征求 1813，“NFS 版本 3 协议规范”（1995 年 6 月）。访问地址\
  \ `www.nic.mil/ftp/rfc/rfc1813.txt`。\n\n359\n\n# 第 19 章：名称服务\n\n### 你需要理解的术语：\n\n\
  * 名称服务\n* `/etc` 文件配置\n* 域名命名系统 (DNS)\n* 网络信息服务 (NIS)\n* 网络信息服务加+ (NIS+)\n* 轻量级目录访问协议\
  \ (LDAP)\n* 身份验证与授权\n* 名称服务切换器\n\n### 你需要掌握的技术：\n\n* 配置名称服务切换器\n* 配置 NIS 主服务器和从服务器\n\
  * 配置 NIS 客户端\n* 更新和添加 NIS 映射\n\n本章描述了 Solaris 8 操作系统支持的名称服务。第一部分提供了概述。第二部分详细介绍了网络信息服务\
  \ (NIS)。第三部分总结了网络信息服务加+ (NIS+)。本章涵盖了*命名服务*和 *NIS* 测试目标。\n\n### Solaris 名称服务\n\n\
  *名称服务*或*命名服务*提供了一个中心化的位置，用于存储用户和系统在跨网络通信时所需的信息。名称服务不仅存储这些信息，还提供了管理和访问这些信息的机制。这些信息被称为*命名空间*，通常包括以下内容：\n\
  \n* 主机名及其 IP 地址\n* 用户账户及其密码\n* 访问权限\n\n360\n\n如果没有中心化的名称服务，每个系统都必须维护自己一份信息的副本。例如，默认情况下，Solaris\
  \ 8 系统使用 `/etc/hosts` 文件将主机名解析为 IP 地址。这种方法对于少量系统是可行的，但对于大量系统来说，它将变成维护的噩梦。中心化的名称服务消除了冗余，提高了一致性并减少了管理工作量。\n\
  \n### 支持的命名服务\n\nSolaris 8 操作系统支持五种命名服务：\n\n* 原始的 Unix 名称配置，称为 `*/etc files*` \n\
  * 域名命名系统 (DNS)\n* 网络信息服务 (NIS)\n* 网络信息服务加+ (NIS+)\n* 联邦命名服务 (FNS)，它符合 X/Open 联邦命名规范\
  \ (XFN)\n\n`/etc/files`、`NIS` 和 `NIS+` 被视为企业级命名服务。也就是说，它们在局域网环境中运行良好，但无法扩展到全球级别（互联网环境）。为了解决这个扩展问题，可以使用\
  \ `FNS` 通过轻量级目录访问协议 (`LDAP`) 或 `DNS` 将 `NIS` 或 `NIS+` *联邦化*到全局命名服务（如 `X.500`）。通过链接这些命名服务，企业级名称服务管理的信息可以在范围内访问。\n\
  \n目前，Sun Microsystems 尚未完全采用 X.500/LDAP 作为一种命名服务，也没有在 Solaris 8 发行版中提供 `LDAP` 服务器。然而，它确实提供\
  \ `LDAP` 客户端和一个 `LDAP` 数据缓存机制。\n\n**考试警示：** 在这些命名服务中，`NIS` 和 `NIS+` 在考试中的涵盖最详尽。`/etc`\
  \ 文件和 `DNS` 会简要介绍。`FNS` 可能不会被提及。但请务必理解企业级（`NIS` 和 `NIS+`）与全局（`DNS` 和 `LDAP`）命名服务的区别。\n\
  \n### 域名命名系统 (DNS)\n\n`DNS` 是 TCP/IP 协议族的一部分，是互联网使用的名称服务。它提供主机名到 IP 地址的解析以及 IP 地址到主机名的解析。`DNS`\
  \ 命名空间被分为若干域，这些域又被分为子域（或区域）。一个或多个 `DNS` 服务器可以负责一个区域（权威）。所有的 `DNS` 服务器共同工作，为整个命名空间提供名称解析服务。\n\
  \n361\n\nSolaris 8 提供的 DNS 服务器是 8.1 版本。该伯克利名称域 (BIND) 程序被称为*互联网名称守护进程* (`innamed`)。命名空间的信息使用一种名为*记录*的预定义语法存储在文本文件中。\n\
  \n`innamed` 程序使用以下数据文件：\n\n* `/etc/named.conf`: BIND 配置文件，用于标识 DNS 服务器具有权威性的区域以及关联的数据文件\n\
  * `/etc/resolv.conf`: 当配置为 DNS 客户端时，该文件标识应用于名称解析的 DNS 服务器\n* `named.ca`: 互联网根服务器的名称和\
  \ IP 地址\n* `hosts`: DNS 地址（A 类型）记录，用于将主机名解析为 IP 地址（不要与 `/etc/hosts` 文件混淆）\n* `hosts.rev`:\
  \ DNS 针（PTR 类型）记录，用于将 IP 地址解析为主机名\n* `named.local`: 本地或回环接口的 DNS 记录\n\n`named.ca`、`hosts`、`hosts.rev`\
  \ 和 `named.local` 文件通常位于 `/var/named` 目录下，但也可以位于 `/etc/named.conf` 指定的任何目录。\n\n\
  ### 网络信息服务 (NIS)\n\n`NIS` 是一种分布式名称服务。它是用于识别和定位网络对象及资源的机制。它以平台无关的方式为全网络的信息提供了统一的存储和检索方法。数据文件（映射映射）可以分布在\
  \ NIS 服务器之间以提高可用性，但仍可以从中心位置进行管理和更新。本章的第二部分提供了有关 `NIS` 的更多细节。\n\n### 网络信息服务加+ (NIS+)\n\
  \n`NIS+` 与 `NIS` 非常相似，但包含了更多功能。与 `NIS` 不同，`NIS+` 命名空间是动态的，因为任何授权用户都可以随时使更新生效。`NIS`\
  \ 命名空间是分级结构，类似于 Unix 文件系统。这种结构允许命名空间符合组织的层级结构，并可以分为多个可以独立管理的域。\n\n虽然 `NIS` 的安全性较弱，但\
  \ `NIS+` 包含了一套安全系统，同时使用身份验证和授权来维护其命名空间的完整性。*身份验证*是一种在访问远程系统时限制为特定用户访问的方法。身份验证可以在系统级和网络级进行设置。凭据用于验证用户的身份。对于\
  \ `NIS+`，每次访问请求都会通过检查用户的凭据进行身份验证。\n\n*授权*是一种在用户获得访问（通过身份验证）后，限制其在远程系统上可以执行的操作的方法。对于\
  \ `NIS+`，命名空间中的每个组件都指定了它将接受来自每个用户的操作类型。\n\n362\n\n### 名称服务切换器\n\n\n\n\n\n由于 Solaris\
  \ 8 支持五种不同的命名服务，因此我们需要一种方法来选择应该使用哪些命名服务以及它们的使用顺序。这种功能由 `name service-switch` 提供，它由\
  \ `/etc/nsswitch.conf` 文件和五个模板组成，这些模板可以简化 `nsswitch.conf` 文件的设置。\n\n应用程序使用标准程序获取名称解析以及系统和其他网络信息。这些程序查询\
  \ `/etc/nsswitch.conf` 文件来确定应该查询哪些命名服务。\n\n`/etc/nsswitch.conf` 文件包含命名服务支持的种类型数据的条目。每个条目由一个标识信息类型的关键字组成，随后是一个或多个信息源。源关键字通过一个或多个空格字符与信息关键字和其他源关键字隔开。表\
  \ 19.1 列出了 17 种信息关键字。除了 Solaris 支持的五种命名服务外，通过命名服务切换的信息源字段，还支持三种额外的名称解析方法。这些是：`compat,`（用于密码和组信息）、`ldap`（使用外部\
  \ LDAP 服务）以及 `users,`（用于打印机）。表 19.2 列出了 8 个信息源关键字。\n\n表 19.1: `/etc/nsswitch.conf`\
  \ 信息关键字。\n\n| Information Keyword | Description |\n| :--- | :--- |\n| **aliases**\
  \ | 邮件别名 |\n| **automount** | 自动文件系统 (AutoFS) 配置信息 |\n| **bootparams** | 无盘工作站根分区、交换和转分区的位置\
  \ |\n| **ethers** | 系统的以太网地址 |\n| **group** | 组名和成员信息 |\n| **hosts** | 主机名和网络 (IP\
  \ 版本 4) 地址 |\n| **ipnodes** | 主机名和网络 (IP 版本 6) 地址 |\n| **netgroup** | 域中定义的网络组和成员\
  \ |\n| **netmasks** | 与已知网络相关的子掩码 |\n| **networks** | 网络及其关联名称 |\n| **passwd** |\
  \ 用户账户的密码信息 |\n| **printers** | 打印机别名数据库 |\n| **protocols** | 域内使用的 IP 协议 |\n| **publickey**\
  \ | 用于身份验证的公钥 |\n| **rpc** | 域内使用的 RPC 服务的远程过程调用 (RPC) 程序号 |\n| **sendmailvars**\
  \ | `sendmail`(1M) 程序使用的变量 |\n| **services** | IP 服务名称及其端口号 |\n\n表 19.2: `/etc/nsswitch.conf`\
  \ 源关键字。\n\n| Source Keyword | Description |\n| :--- | :--- |\n| **compat** | 使用旧式语法处理密码和组信息\
  \ |\n| **dns** | 使用 DNS 解析查询 |\n| **files** | 使用 `/etc/` 文件解析查询 |\n| **ldap** |\
  \ 使用 LDAP 解析查询 |\n| **nis** | 使用 NIS 解析查询 |\n| **nisplus** | 使用 NIS+ 解析查询 |\n| **users**\
  \ | 仅对打印机有效 |\n| **xfn** | 仅对打印机有效 |\n\n当查询或搜索这些命名服务（DNS、`/etc` 文件、LDAP 以及 NIS 或\
  \ NIS+）时时，它们将返回四种搜索状态消息之一：\n\n- `SUCCESS`—已找到请求的信息。\n- `UNAVAIL`—服务未响应。\n- `NOTFOUND`—请求的数据不存在。\n\
  - `TRYAGAIN`—服务繁忙；请稍后再试。\n\n对于这四个搜索状态消息中的每一个，每个源都可以关联一个操作。该操作可以是 `return`（停止查找）或\
  \ `continue`（尝试下一个源）。例如，下面的列表显示了 `/etc/nsswitch.conf` 文件中的一个 `hosts` 条目：\n\n```\n\
  hosts: nisplus dns files\n```\n\n`SUCCESS` 状态消息的默认操作是返回信息。其他状态消息（`NOTFOUND`、`TRYAGAIN`\
  \ 和 `UNAVAIL`）的默认操作是：如果存在则继续到下一个源，如果不存在则返回。\n\n当应用程序尝试将主机名解析为 IP 地址时，首先搜索 `NIS+`。如果找到了，将其返回给应用程序。如果未找到，则搜索\
  \ `DNS`。如果找到了，将其返回给应用程序。如果未找到，则搜索 `/etc` 文件配置（`/etc/hosts` 文件）。如果找到了，返回返回应用程序；否则返回错误。\n\
  \n**考试警示** 注意，命名服务的搜索顺序从左到右。也就是说，搜索将从最左侧的服务开始，并在必要时持续持续到查询最右侧的服务。\n\nSolaris 8 发行版包含五个模板，以简化\
  \ `/etc/nsswitch.conf` 文件的设置。这些模板为 Solaris 8 环境中最常用的命名服务提供了标准化的设置。它们是：\n\n- `DNS`\
  \ (`/etc/nsswitch.dns`)\n- `LDAP` (`/etc/nsswitch.ldap`)\n- `NIS` (`/etc/nsswitch.nis`)\n\
  - `NIS+` (`/etc/nsswitch.nisplus`)\n- 原生 Unix `/etc` 文件配置 (`/etc/nsswitch.files`)\n\
  \n在系统安装期间，根据所选的命名服务（如果有），将这些文件之一的内容拷贝到 `/etc/nsswitch.conf` 文件。列表 19.1 显示了 `/etc/nsswitch.nisplus`\
  \ 文件的默认内容。要使用此配置，请将此文件拷贝到 `/etc/nsswitch.conf` 文件。注释以井 #字符开头。可以通过源关键字后的方括号（`[]`）使用\
  \ `message=action` 语句为状态消息定义操作。\n\n列表 19.1: `/etc/nsswitch.nisplus` 文件的内容。\n\n```\n\
  #\n# /etc/nsswitch.nisplus:\n#\n# 这是一个可以拷贝到 /etc/nsswitch.conf 的示例文件；# 它\n# 结合文件使用了\
  \ NIS+ (NIS 版本 3)。\n#\n# 此文件中的 \"hosts:\" 和 \"services:\" 仅在\n# /etc/netconfig 文件中\
  \ \"inet\" 传输层\n# 的 nametoaddr_libs 为 \"-\" 时才使用。\n#\n# 以下两行消除了 /etc/passwd\n# 和\
  \ /etc/group 中的 \"+\" 条目。\npasswd: files nisplus\ngroup: files nisplus\n\n# 仅当 nisplus\
  \ 宕机时查询 /etc \"files\"。\nhosts: nisplus [NOTFOUND=return] files\nipnodes: files\n\
  \n# 取消下行的注释并注释上面的行，以便\n# 从 ipnodes 数据库中解析\n# 同时 IPv4 和 IPv6 地址。请注意\n# IPv4 地址在搜索\
  \ hosts 数据库之前\n# 会在所有 ipnodes 数据库中进行搜索。在开启此选项之前，\n# 请参考\n#《网络管理指南》以获取有关使用 IPv6 的更多详细信息。\n\
  #ipnodes: nisplus [NOTFOUND=return] files\n\n# 取消下行的注释并注释上面的行，以同时使用\n# DNS\n# 和\
  \ NIS+。你还必须设置 /etc/resolv.conf 文件以进行 DNS # 名称\n# 服务器查找。请参见 resolv.conf(4)。\n#hosts:\
  \ nisplus dns [NOTFOUND=return] files\n#services: nisplus [NOTFOUND=return] files\n\
  #networks: nisplus [NOTFOUND=return] files\n#protocols: nisplus [NOTFOUND=return]\
  \ files\n#rpc: nisplus [NOTFOUND=return] files\n#ethers: nisplus [NOTFOUND=return]\
  \ files\n#netmasks: nisplus [NOTFOUND=return] files\n#bootparams: nisplus [NOTFOUND=return]\
  \ files\n#publickey: nisplus\n#netgroup: nisplus\n#automount: files nisplus\n#aliases:\
  \ files nisplus\n#sendmailvars: files nisplus\n#printers: user nisplus files xfn\n\
  #auth_attr: files nisplus\n#prof_attr: files nisplus\n#project: files\n```## 网络信息服务\
  \ (NIS)\n\nNIS 与其他网络应用程序一样，遵循客户端/服务器模型。本章本节介绍了 NIS 的组件、如何配置这些组件以及如何添加和更新 NIS map。\n\
  \n### NIS 组件\n\nNIS 由主服务器、可能的从服务器以及多个客户端组成。服务器存储 NIS map 并根据请求向客户端提供其中包含的信息。\n\n\
  ### NIS Map\n\nNIS 将信息存储在称为 map 的文件中，map 是两列表。第一列用作键，第二列是与键关联的信息。由于 map 是按键组织的，相同的信息可能出现在多个\
  \ map 中。\n\n\n\n\n\n示例、主机以及关联 IP 地址出现在两个映射中：`hosts.byname`（以主机名为主键，IP 地址为信息）和 `hosts.byaddr`（以\
  \ IP 地址为主键，主机名为信息）。表 19.3 列出了 NIS 映射。这些映射在物理上位于 `/var/yp` 目录下，与其他几个 NIS 文件存储在一起。\n\
  \n### 表 19.3：NIS 映射。\n\n| 关键字 | 映射 | 描述 |\n| :--- | :--- | :--- |\n| `aliases` |\
  \ `mail.aliases`, `mail.byaddr` | 邮件地址和别名 |\n| `bootparams` | `bootparams` | 无盘工作站根、交换和转储分区的位置\
  \ |\n| `ethers` | `ethers.byaddr`, `ethers.byname` | 系统的以太网地址 |\n| `group` | `group.bygid`,\
  \ `group.byname` | 组名、组 ID (GID) 和成员信息 |\n| `hosts` | `hosts.byaddr`, `hosts.byname`\
  \ | 主机名和网络 (IPv4) 地址 |\n| `ipnodes` | `ipnodes.byaddr`, `ipnodes.byname` | 主机名和网络\
  \ (IPv6) 地址 |\n| `netgroup` | `netgroup`, `netgroup.byhost`, `netgroup.byuser` |\
  \ 域定义的网络组和成员 |\n| `netmasks` | `netmasks.byaddr` | 与已知网络关联的网络掩码 |\n| `networks`\
  \ | `networks.byaddr`, `networks.byname` | 网络及其关联名称 |\n| `passwd` | `netid.byname`,\
  \ `passwd.adjunct.byname`, `passwd.byname`, `passwd.byuid` | 用户账户的密码信息 |\n| `protocols`\
  \ | `protocols.byname`, `protocols.bynumber` | 域内使用的 IP 协议 |\n| `rpc` | `rpc.bynumber`\
  \ | 域内 RPC 服务的程序号 |\n| `services` | `services.byname`, `services.byservice` | IP\
  \ 服务及其端口号 |\n\n**考试警示**：NIS 以前被称为黄页（Yellow Pages）。由于这个原因，许多 NIS 文件和命令都包含 `yp` 前缀。\n\
  \n### NIS 主服务器和从服务器\n每个 NIS 环境（或域）必须仅有一个 NIS 主服务器。NIS 映射存储在主服务器上。为了提供负载均衡和冗余，可以配置一个或多个从服务器。每当主服务器上的\
  \ NIS 映射更新时，它们就会传播到从服务器。\n\n### NIS 客户端\nNIS 客户端向 NIS 服务器请求映射中包含的信息。客户端不区分主服务器和从服务器。\n\
  \n**考试警示**：取决于 `/etc/nsswitch.conf` 文件的配置，NIS 服务器也可以是 NIS 客户端。请记住，NIS 服务器也需要解析主机名、网络地址等以供自身使用。\n\
  \n### 配置 NIS 服务器和客户端\n配置 NIS 主服务器、从服务器和客户端的程序均非常相似。本节给出了每项操作的步骤。\n\n每个系统都应被识别为该域的成员。你通过使用\
  \ `domainname`(1M) 命令并将域名作为参数来这样做。例如，如果一个系统将成为 sun.com 域的一部分，你使用以下命令设置该域：\n\n```\n\
  # domainname sun.com\n```\n\n### NIS 主服务器\n在配置 NIS 主服务器之前，你必须准备好用于构建映射的数据。默认情况下，映射将从\
  \ `/etc` 文件构建。然而，建议将 `/etc` 文件复制到另一个目录，以便你可以对这些源文件进行任何必要的更改，而不影响本地系统。使用以下步骤准备数据：\n\
  \n1. 验证 `/etc` 文件是否是最新的。这些文件包括 `auto_home`, `auto_master`, `bootparams`, `ethers`,\
  \ `group`, `hosts`, `netgroup`, `netmasks`, `networks`, `passwd`, `protocols`, `rpc`,\
  \ `service` 和 `shadow`。\n2. 选择一个用于构建大多数映射的目录（`DIR` 目录）以及另一个用于构建 `passwd` 映射的目录（`PWDIR`\
  \ 目录）。\n3. 将所有文件（`/etc/passwd` 除）复制到 `DIR` 目录，并将 `/etc/passwd` 文件复制到 `PWDIR` 目录。\n\
  4. 验证 `/etc/mail/aliases` 文件是最新的，但不要将其复制到 `DIR` 目录。\n5. 从复制的源文件中删除注释和其他不必要的信息。验证文件格式是否正确。\n\
  6. 修改 `/var/yp/Makefile` 以识别选定的 `DIR` 和 `PWDIR` 目录。\n\n使用以下步骤配置 NIS 主服务器。作为程序的一部分，映射将自动构建：\n\
  \n1. 为了确保系统使用 `/etc` 文件配置进行名称服务切换，将 `/etc/nsswitch.files` 文件复制为 `/etc/nsswitch.conf`\
  \ 文件。\n2. 为每个 NIS 从服务器向 `/etc/hosts` 中添加条目。\n3. 如果必要，使用 `domainname`(1M) 命令设置域名。\n\
  4. 运行 `ypinit`(1M) 命令初始化 NIS 主服务器并构建映射，如下：\n\n```\nypinit -m\n```\n5. 根据 `ypinit`\
  \ 命令的提示提供信息。这些信息包括 NIS 从服务器列表，以及在遇到错误时 `ypinit` 命令是否应该退出。\n6. 通过将 `/etc/nsswitch.nis`\
  \ 文件复制到 `/etc/nsswitch.conf` 文件来启用 NIS。\n\n要启动 NIS 主服务器，可以重启系统或运行所示的 `ypstart`(1M)\
  \ 命令：\n\n```\n/usr/lib/netsvc/yp/ypstart\n```\n\n### NIS 从服务器\n你可以使用以下步骤将系统配置为 NIS\
  \ 从服务器：\n\n1. 将系统配置为 NIS 客户端。如果必要，使用 `domainname` 命令设置域名。\n2. 更新 `/etc/nsswitch.conf`\
  \ 文件以使用 NIS，可以通过将 `/etc/nsswitch.nis` 模板文件复制到其中，或手动编辑相应的配置。\n3. 以 root 账户登录系统并运行所示的\
  \ `ypinit` 命令：\n\n```\nypinit -c\n```\n4. `ypinit` 命令将提示输入一个或多个 NIS 服务器。输入最近的 NIS\
  \ 服务器的主机名。此步骤完成了客户端的设置。\n5. 在 `/etc/hosts` 文件中为 NIS 主服务器添加条目。\n6. 如果 `ypbind`(1M)\
  \ 命令正在运行，使用以下命令停止它：\n\n```\n/usr/lib/netsvc/yp/ypstop\n```\n7. 使用以下命令重启 `ypbind`\
  \ 命令：\n\n```\n/usr/lib/netsvc/yp/ypstart\n```\n8. 从 `/var/yp` 目录运行 `ypinit` 命令，如下所示（其中\
  \ `*master*` 是 NIS 主服务器的主机名）：\n\n```\n# cd /var/yp\n# ypinit -s *master*\n```\n\
  要启动 NIS 从服务器，可以重启系统或重复步骤 6 和 7。只有主服务器生成的映射会被复制到从服务器。生成映射的原始文件仅位于主服务器上。\n\n### NIS\
  \ 客户端\n你可以使用以下步骤将系统配置为 NIS 客户端：\n\n1. 如果必要，使用 `domainname` 命令设置域名。\n2. 更新 `/etc/nsswitch.conf`\
  \ 文件以使用 NIS，可以通过将 `/etc/nsswitch.nis` 模板文件复制到其中，或手动编辑相应的配置。\n3. 以 root 账户登录系统并运行所示的\
  \ `ypinit` 命令：\n\n```\nypinit -c\n```\n4. `ypinit` 命令将提示输入一个或多个 NIS 服务器。输入最近的 NIS\
  \ 服务器的主机名。\n\n### 更新和添加 NIS 映射\n更新默认映射（配置时自动生成的）相当。编辑相应的源文件，然后从 `/var/yp` 目录运行 `make`(1)\
  \ 命令。必须更新的映射名称必须作为命令行参数传递给 `make` 命令。`make` 命令更新映射并自动将更新后的映射传播到从服务器。以下列表显示了更新 hosts\
  \ 映射并传播到从服务器的命令：\n\n```\n# cd /var/yp\n# make hosts\n```\n添加新映射（称为*非默认映射*），在主服务器的\
  \ `/var/yp` 目录下创建一个包含适当信息的文本文件。然后，运行 `makedbm`(1M) 命令添加\n\n\n\n\n该映射。`makedbm` 命令需要两个命令行参数：源文件名称和应创建的映射名称。`ypxfr`(1M)\
  \ 命令用于分发当前在从服务器上尚不存在的新映射。新映射的名称作为命令行参数指定。以下行代码从 `apps.txt` 源文件创建了新映射 `apps`：\n\n\
  ```\n# cd /var/yp\n# makedbm apps.txt apps\n# /usr/lib/netsvc/yp/ypxfr apps\n```\n\
  \n要更新并传播非默认映射，请编辑源文件，然后运行 `makedbm` 命令以重新构建该映射。如需传播更新后的映射，请使用 `yppush`(1M) 命令并将映射名称指定为命令行参数。以下行代码从\
  \ `apps.txt` 源文件重新构建 `apps` 映射并将其传播到从服务器上：\n\n```bash\n# cd /var/yp\n# makedbm apps.txt\
  \ apps\n# /usr/lib/netsvc/yp/yppush apps\n```\n\n## 验证 NIS 配置\n\n有几个命令可以访问 NIS 配置信息。你可以使用这些命令来验证客户端配置并检查映射的内容。更多细节请参阅*系统参考手册*：\n\
  \n* `ypcat`(1)—列出指定映射的内容。\n* `ypmatch`(1)—返回与指定映射中指定键匹配的数据。\n* `ypwhich`(1)—返回 NIS\
  \ 服务器或映射主机的名称。当配合 `-m` 命令行参数使用时，`ypwhich` 命令返回所有可用映射的列表。\n\n## 网络信息服务增强 (NIS+)\n\
  \nNIS+ 与 NIS 类似，但提供了额外的功能。除了提供集中化管理和域数据访问外，它还支持层次级域，并可以配置以反映组织结构。NIS 仅提供扁平域。NIS\
  \ 不提供认证，而 NIS+ 提供数据加密标准 (DES) 认证。此外，NIS 以批模式传播更新信息，而 NIS+ 则立即传播增量更新。与 NIS 类似，NIS+\
  \ 支持可选地使用冗余服务器（称为*副本*）。这些副本提供了负载均衡功能，并在主 NIS+ 服务器故障时提供备用服务器。\n\nNIS 将数据存储在称为*映射*（maps）的文件中，而\
  \ NIS+ 将数据存储在称为*表*（tables）的文件中。NIS+ 为 NIS 映射中存储的所有数据提供了表，并为凭据、时区和自动挂载信息提供额外的表。表\
  \ 19.4 列出了 NIS+ 表。\n\n### 表 19.4：NIS+ 表\n\n| 表 | 说明 |\n| :--- | :--- |\n| auto_home\
  \ | 用户主目录的位置 |\n| auto_master | AutoFS 映射信息 |\n| bootparams | 根、交换和转储的位置 |\n| partitions\
  \ | 无盘工作站的分区 |\n| cred | NIS+ 主体的凭据 |\n| ethers | 系统的以太网地址 |\n| group | 组名、GID 和成员信息\
  \ |\n| hosts | 主机名和网络 (IP) 地址 |\n| mail_aliases | 邮件地址和别名 |\n| netgroup | 域中定义的网络组和成员\
  \ |\n| netmasks | 与已知网络相关的子网掩码 |\n| networks | 网络及其关联名称 |\n| passwd | 用户账户的密码信息\
  \ |\n| protocols | 域内使用的 IP 协议 |\n| rpc | 域内使用的 RPC 服务的 RPC 程序号 |\n| services |\
  \ IP 服务及其端口号 |\n| timezone | 域内工作站的时区 |\n\n这些表存储在域命名的目录下。该目录包含另外三个目录：`ctx_dir.domain`，用于\
  \ xfn (FNS) 数据；`org_dir.domain` 用于存储表；以及 `groups_dir.domain` 用于组信息。\n\n### 练习题\n\
  \n### 题 1\n以下哪些命名服务要求在运行它的每个系统上手动配置数据？\na. NIS\nb. NIS+\nc. DNS\nd. `/etc` 文件\n\n\
  答案 `d` 正确。NIS 要求在运行它的每个系统上手动配置数据。所有其他命名服务都提供了一种方法，可以更新一个主数据库并将更改传播到每个需要的系统上。因此，答案\
  \ a、b 和 c 是错误的。虽然对于少量系统来说，使用 `/etc` 文件简单简单快速，但对于大量系统使用 NIS、NIS+ 或 DNS 可以减少维护工作。\n\
  \n### 题 2\n输入一种根据用户凭据限制 NIS+ 资源访问的方法名称。\n正确答案是 `authentication`（认证）。\n\n### 题 3\n\
  以下哪些是 NIS+ 提供的功能 [选择所有适用项]\na. 认证\nb. 时区支持\nc. 更新的批处理传播\nd. 层次级域架构\ne. 扁平域架构\n\n\
  答案 a、b 和 d 正确。NIS+ 提供认证、时区支持和层次级域架构。更新批处理传播和扁平域架构是 NIS 的特点。因此，答案 c 和 e 是错误的。\n\n\
  ### 题 4\nSolaris 8 操作系统支持以下哪些命名服务？[选择所有适用项]\na. NIS\nb. NIS+\nc. FNS\nd. DNS\ne.\
  \ `/etc` 文件配置\n\n答案 a、b、c、d 和 e 正确。Solaris 8 操作系统支持 NIS、NIS+、FNS、DNS 和 `/etc` 文件配置。\n\
  \n### 题 5\n以下哪一个命令用于配置 NIS 客户端？\na. `ypinit -m`\nb. `ypinit -c`\nc. `ypinit -s`\n\
  d. `nisclient`\ne. `nisinit -c`\n\n答案 `b` 正确。`ypinit -c` 命令用于配置 NIS 客户端。`ypinit\
  \ -m` 用于配置主服务器。因此，答案 a 是错误的。`ypinit -s` 用于配置从服务器。因此，答案 c 是错误的。答案 d 和 e 中的命令不存在。\n\
  \n### 题 6\n以下哪项*不是*有效的搜索状态消息类型？\na. SUCCESS\nb. NOTFOUND\nc. TRYLATER\nd. UNAVAIL\n\
  \n答案 `c` 正确。`TRLATER` 不存在；正确的关键字是 `TRYAGAIN`。SUCCESS、`NOTFOUND` 和 `UNAVAIL` 是有效的搜索状态消息。因此，答案\
  \ a、b 和 d 是错误的。\n\n### 题 7\n识别用于提供 DNS 服务的 BIND 程序名称。\n正确答案是 `in.named` 程序。\n\n\
  ### 题 8\n以下哪些是可以在 `/etc/nsswitch.conf` 文件中使用的类型关键字？[选择所有适用项]\na. hosts\nb. ipaddr\n\
  c. protocols\nd. services\n\n答案 a、c 和 d 正确。`hosts`、`protocols` 和 `services` 关键字可以使用\
  \ `/etc/nsswitch.conf` 文件。`ipaddr` 不是有效关键字。IP 地址是 `hosts` 信息的一部分。因此，答案 b 是错误的。\n\
  \n### 题 9\nNIS 用来存储 NIS 客户端请求信息的文件统称为什么？\n正确答案是 `maps`。\n\n### 题 10\n以下哪一个命令用于将新的\
  \ NIS 映射传播到 NIS 从服务器？\na. `yppush`\nb. `ypupdate`\nc. `yppropagate`\nd. `ypxfr`\n\
  e. `ypmaps`\n\n答案 `d` 正确。`ypxfr` 命令用于将新的 NIS 映射传播到 NIS 从服务器。yppush` 用于传播已更新的映射。因此，答案\
  \ a 是错误的。答案 b、c 和 e 中的命令不存在。\n\n### 题 11\n以下哪些命名服务可以在环境中运行并被认为是全局命名服务？[选择所有适用项]\n\
  a. NIS+\nb. DNS\nc. NIS\nd. X.500/LDAP\n\n答案 b 和 d 正确。DNS 和 X.500/LDAP 被认为是全局命名服务。NIS\
  \ 和 NIS+ 是企业级命名服务，无法进行全球扩展。\n\n\n\n\n\nSun Microsystems, *Solaris Naming Administration\
  \ Guide*。提供打印版（部件号 806-1387-10）、通过 Web `docs.sun.com` 访问，以及通过 Solaris 8 操作系统提供的在线文档\
  \ AnswerBook2 获取。\n\nSun Microsystems, *Solaris Naming Setup and Configuration Guide*。提供打印版（部件号\
  \ 806-1386-10）、通过 Web `docs.sun.com` 访问，以及通过 Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\
  \nHoward, L., Request For Comment 2307, “An Approach for Using LDAP as a Network\
  \ Information Service”（1998 年 3 月）。可通过 `ftp.isi.edu/in-notes/rfc2307.txt` 访问。\n\n\
  Wahl, M. et al., Request For Comment 2251, “Lightweight Directory Protocol (v3)””（1997\
  \ 年 12 月）。可通过 `ftp.isi.edu/in-notes/rfc2251.txt` 访问。\n\n# 第 20 章：Solaris 管理控制台与\
  \ Solstice AdminSuite\n\n## 你需要理解术语：\n- Solaris 管理控制台 (Solaris Management Console)\n\
  - Solstice AdminSuite\n- 主机管理器 (Host Manager)\n- 存储管理器 (Storage Manager)\n- 数据库管理器\
  \ (Database Manager)\n- 串口管理器 (Serial Port Manager)\n- 用户管理器 (User Manager)\n- 组管理器\
  \ (Group Manager)\n- 打印机管理器 (Printer Manager)\n\n### 你需要掌握的技术：\n- 识别管理控制台的功能和特性\n\
  - 识别 AdminSuite 的功能和能力\n- 识别主机管理器支持的系统类型\n- 识别存储管理器两个工具的功能\n- 识别数据库管理器的数据\n\n本章通过要描述这些工具的功能和特性，涵盖\
  \ *Solaris 管理控制台*和 *Solstice AdminSuite* 测试目标。\n\n## Solaris 管理控制台\n\nSolaris 管理控制台是一种用于远程管理由\
  \ Solaris 系统组成的多个域的管理工具。一组图形用户界面 (GUI) 管理工具被集成到一个单一接口框架中。在管理控制台中注册的 Solaris 系统被视为表示主机和服务的图标树。这些工具包括：\n\
  \n- `User Manager`——用户账户管理\n- `Process Manager`——活动进程管理\n- `Log Viewer`——查看控制台日志内容\n\
  - `Job Scheduler`——查看和管理任务调度\n- `Mounts and Shares Manager`——查看和修改网络文件系统 (NFS) 挂载和共享\n\
  - `Disk/Partition Manager`——查看和修改磁盘及分区配置\n- `Serial Port Manager`——查看和修改串口配置\n\n\
  ### 其他特性\n管理控制台提供了*单点登录*功能。通过登录管理控制台，你可以访问由控制台管理的所有主机和服务。这种单点登录消除了单独登录每个主机的需要。\n\
  \n新的基于色的访问控制 (RBAC) 特性可以使用管理控制台进行管理，允许你在维护集中控制的同时，向多位管理员委派特定权利。\n\n管理控制台允许在远程主机上执行应用程序，并使用本地\
  \ GUI 进行监控。它消除了在本地系统上安装应用程序的需要。\n\n## Solstice AdminSuite\n\n图形化管理工具 AdminSuite\
  \ 是以下工具的集合：\n- `Host Manager`——管理 AutoClient 服务器、独立服务器和无盘客户端\n- `Storage Manager`——管理分区和文件系统\n\
  - `Database Manager`——管理网络相关数据\n- `Serial Port Manager`——管理串口配置\n- `User Manager`——管理用户账户\n\
  - `Group Manager`——管理组账户\n- `Printer Manager`——管理打印机和打印服务器\n\nAdminSuite 执行的许多功能也可以通过\
  \ `admintool` 命令完成。这些包括串口管理、用户和组账户管理以及打印机管理。对于这些情况，AdminSuite 的 GUI（窗口）与 `admintool`\
  \ 命令提供的窗口看起来非常相似。\n\n**考试提示：** Solstice AdminSuite 在考试的第二部分未进行详细介绍。然而，你应该熟悉七种 AdminSuite\
  \ 管理工具以及组成存储管理器的两个工具的功能。\n\n## 主机管理器\n\n主机管理器提供了添加和维护服务器及客户端支持的能力。你可以用它执行包括在内的任务：\n\
  - 为所有类型的系统配置（AutoClients、无盘客户端、操作系统 [OS] 服务器和独立系统）添加和修改系统支持，包括转换系统类型\n- 为 AutoClients\
  \ 或无盘客户端设置根密码\n\n系统支持包括提供软件服务，例如用于安装的引导和安装服务，用于磁盘空间有限的系统的 OS 服务。主机管理器提供了将独立系统转换为\
  \ OS 服务器、将 AutoClient 转换为独立系统等能力。此外，你可以使用主机管理器为 OS 服务器添加 OS 服务（例如，添加对另一种操作系统的支持）或删除不再需要的\
  \ OS 服务。主机管理器的另一个功能是设置用于执行网络安装的安装、引导和配置服务器。\n\nAdminSuite 为主机管理器的以下操作提供了命令行等效命令：\n\
  - `admhostadd`——为新系统或 OS 服务器添加支持\n- `admhostdel`——删除现有系统或 OS 服务器的支持\n- `admhostmod`——修改现有系统\n\
  - `admhostls`——列出现有主机\n\n## 存储管理器\n\n存储管理器由两个工具组成：磁盘管理器和文件系统管理器。磁盘管理器允许查看和编辑分区相关信息。你可以用它执行以下操作：\n\
  - 查看和修改 x86 和 SPARC slice 参数（即更改 slice 的起始结束地址）\n- 指定磁盘标签\n- 查看和修改 x86 fdisk 分区\n\
  - 将磁盘特性复制到一个或多个相似磁盘\n\n文件系统管理器支持创建和修改文件系统。你可以用它执行以下操作：\n- 创建文件系统\n- 创建挂载点\n- 挂载和卸载文件系统\n\
  - 共享和取消共享网络文件系统 (NFS) 资源\n- 修改一个或多个系统的 `/etc/vfstab` 文件\n- 向现有自动文件系统 (AutoFS) 映射添加条目\n\
  \n文件管理器还提供了选择挂载和共享选项的能力，例如特定的 NFS 挂载选项。\n\nAdminSuite 未为存储管理器提供任何命令行界面，因为你可以使用标准的\
  \ Solaris 命令执行磁盘和文件系统任务。\n\n## 数据库管理器\n\n数据库管理器用于查看和修改网络相关的系统信息。这些信息可以存储在选定的主机上（`/etc`\
  \ 文件）、网络信息服务 (NIS) 或网络信息服务+ (NIS+) 中。你可以使用数据库管理器查看和修改包含以下类型信息的文件、映射或表（取决于命名服务）：\n\
  - 系统别名\n- AutoFS 映射内容\n- 引导参数\n- 以太网地址\n- 组\n- 主机名和 IP 地址\n- 区域信息\n- 网络组\n- 网络掩码\n\
  - 网络名称\n- 用户账户信息\n- 网络协议\n- RPC 配置\n- 网络服务\n- 时区信息\n\nAdminSuite 未为数据库管理器提供任何命令行。对于\
  \ `/etc` 文件命名服务，你可以使用任何文本编辑器修改信息。对于 NIS 和 NIS+，请使用适当程序根据需要修改映射和表。\n\n## 串口管理器\n\n\
  串口管理器为 AdminSuite 提供了一个图形化界面，用于查看和修改选定主机上串口的设置。使用串口管理器，你可以执行以下操作：\n\n\n\n\n\n- 查看串口设置\n\
  - 添加终端\n- 添加调制解调器\n- 禁用端口服务\n- 删除端口服务\n\nAdminSuite 为串口管理器（Serial Port Manager）的以下操作提供了命令行等：\n\
  \n- `admserialdel`—删除端口服务\n- `admserialls`—列出端口服务\n- `admserialmod`—修改端口服务\n\n##\
  \ 用户管理器 (User Manager)\n\n用户管理器用于查看和修改用户账户信息。这些信息可以存储在选定的主机上（`/etc` 文件中）、NIS 或 NIS+\
  \ 中。你可以使用用户管理器查看和修改包含以下类型信息的文件、映射或表（取决于名称服务）：\n\n- 系统别名\n- 目录的 AutoFS 映射内容\n- 用户凭据信息\n\
  - 组账户信息\n- 用户账户信息\n- 密码信息\n\nAdminSuite 为用户管理器提供了以下命令行等：\n\n- `admuseradd`—添加用户账户\n\
  - `admuserdel`—删除用户账户\n- `admuserls`—列出用户账户\n- `admusermod`—修改用户账户\n\n## 组管理器 (Group\
  \ Manager)\n\n组管理器用于查看和修改组账户信息。这些信息存储在选定的主机上（`/etc/group` 文件）、NIS 映射或 NIS+ 表中。AdminSuite\
  \ 为组管理器提供了以下命令行等：\n\n- `admgroupadd`—添加组账户\n- `admgroupdel`—删除组账户\n- `admgroupls`—列出组账户\n\
  - `admgroupmod`—修改组账户\n\n## 打印机管理器 (Printer Manager)\n\n打印机管理器为 AdminSuite 提供图形界面，以执行以下操作：\n\
  \n- 在打印服务器上安装打印机\n- 安装网络打印机\n- 给打印客户端访问打印机的权限\n- 修改打印机的现有信息\n- 删除对打印机的访问\n- 从打印服务器上删除打印机\n\
  \nAdminSuite 未为打印机管理器提供任何命令行。你可以在相应的系统上使用 Solaris LP 服务命令管理打印机。\n\n### 练习题\n\n###\
  \ 问题 1\n输入存储管理器（Storage Manager）包含的两个工具之一名称。\n\n正确答案是磁盘管理器（Disk Manager）或文件系统管理器（File\
  \ System Manager）。\n\n### 问题 2\nAdminSuite 由七个工具组成。其中六个是打印机管理器、主机管理器、用户管理器、数据库管理器、存储管理器和串口管理器。请写第七个工具名称。\n\
  \n正确答案是组管理器（Group Manager）。\n\n### 问题 3\n以下哪个 AdminSuite 管理器用于挂载文件系统？\n\na. 卷管理器（Volume\
  \ Manager）\nb. 磁盘管理器（Disk Manager）\nc. 文件系统管理器（File System Manager）\nd. 挂载管理器（Mount\
  \ Manager）\ne. 分区管理器（Partition Manager）\n\n答案 `c` 正确。文件系统管理器用于挂载文件系统。磁盘管理器用于管理磁盘分区。因此答案\
  \ `b` 是错误的。答案 a、d 和 e 中的管理器不存在。\n\n### 问题 4\n以下哪些是管理控制台（Management Console）工具？[多选]\n\
  \na. 用户管理器（User Manager）\nb. 挂载与共享管理器（Mounts and Shares Manager）\nc. USB 端口管理器（USB\
  \ Port Manager）\nd. 作业调度器（Job Scheduler）\ne. 串口管理器（Serial Port Manager）\n\n答案 a、b、d\
  \ 和 e 正确。用户管理器、挂载与共享管理器、作业调度器和串口管理器都是管理控制台工具。管理控制台不提供管理 USB 端口的功能。因此答案 `c` 是错误的。\n\
  \n### 问题 5\n识别哪种 AdminSuite 管理器可以修改 `/etc/protocols` 文件。\n\n正确答案是数据库管理器（Database\
  \ Manager）。\n\n### 问题 6\n以下哪项不是 AdminSuite 提供的工具？\n\na. 数据库管理器（Database Manager）\n\
  b. 存储管理器（Storage Manager）\nc. 并行端口管理器（Parallel Port Manager）\nd. 打印机管理器（Printer\
  \ Manager）\n\n答案 `c` 正确。AdminSuite 包含串口管理器，而不是并行端口管理器。数据库管理器、存储管理器和打印机管理器都包含在 AdminSuite\
  \ 中。因此答案 a、b 和 d 是错误的。\n\n### 问题 7\n使用主机管理器（Host Manager）可以执行哪些任务？[多选]\n\na. 添加\
  \ OS 服务\nb. 移除 OS 服务\nc. 将 AutoClient 转换为独立系统\nd. 设置启动服务器\ne. 设置 AutoClient 系统的根密码\n\
  \n答案 a、b、c、d 和 e 正确。你可以使用主机管理器执行所有这些任务。\n\n### 问题 8\n识别哪种管理控制台功能，该功能消除了登录控制台所管理的每台主机的需求。\n\
  \n正确答案是单登录（single login）。\n\n### 问题 9\n以下哪个命令是 AdminSuite 提供的？\n\na. `admsliceadd`\n\
  b. `admfilesysdel`\nc. `admdbls`\nd. `admserialmod`\ne. `admprinteradd`\n\n答案 `d`\
  \ 正确。AdminSuite 包含 `admserialmod` 命令。答案 a、b、c 和 e 中列出的命令不存在。\n\n## 想要更多信息？\n\nSun\
  \ Microsystems, *Solstice AdminSuite 2.3 Administration Guide*. 提供印刷版（部件号 802-7048）并可在\
  \ `docs.sun.com` 网上查看。\n\nSun Microsystems, *Solstice AdminSuite 2.3 Installation\
  \ and Release Notes*. 提供印刷版（部件号 805-3027）并可在 `docs.sun.com` 网上查看。\n\n## 第 21 章：跨网络安装和\
  \ JumpStart\n\n**你需要理解的术语：**\n\n- 安装阶段\n- 安装方法\n- 软件包、集群和组\n- 跨网络安装\n- 安装服务器\n-\
  \ 启动服务器\n- 自定义 JumpStart\n- JumpStart 规则文件和配置文件\n\n**你需要掌握的技巧：**\n\n- 安装系统\n- 预配置系统安装信息\n\
  - 设置并使用跨网络安装\n- 设置 JumpStart 配置目录\n\n本章的第一部分涵盖了与系统安装相关的概念和术语，特别是跨网络安装。其中一些信息在第 3\
  \ 章中提到过，因为它们涉及第一部分考试的目标。第 3 章中的某些信息在此处重复，但重点略有不同。\n\n本章的第二部分涵盖了使用 JumpStart 功能实现跨网络安装。*JumpStart\
  \ - 自动安装*测试目标由本章涵盖。\n\n## 服务器安装\n\n本节包含了安装的各个阶段、可以安装在系统上的软件配置以及跨网络安装。\n\n### 安装阶段\n\
  \n安装包括三个阶段：*系统配置*阶段识别必要的系统信息，*系统安装*阶段将软件复制到系统上，而*安装后*阶段根据需要更新系统软件。\n\n### 系统配置阶段\n\
  \n在系统配置阶段，会识别有关系统的基本信息，例如主机名和域名。可选，可以提前设置这些信息或进行*预配置*。\n\n你可以使用两种方法预配置系统信息。第一种使用\
  \ `sysidcfg` 文件，第二种使用名称服务。\n\n考试警报 如果系统没有预配置，则在安装期间会执行 `sysidtool`(1M) 来提示信息。`sysidtool`\
  \ 命令由五个程序组成：`sysidnet`、`sysidnis`、`sysidsys`、`sysidroot` 和 `sysidpm`。\n\n### 系统安装阶段\n\
  \n在系统安装阶段，将使用四种安装方法之一安装选定的 Solaris 8 软件组（本章稍后介绍）：\n\n- SunInstall（标准交互式安装）\n- Web\
  \ Start\n- JumpStart\n- 自定义 JumpStart\n\n两种交互式安装方法（SunInstall 和 Web Start）是第一部分考试目标，已在第\
  \ 3 章讨论过。两种自动安装方法（JumpStart 和自定义 JumpStart）是第二部分考试目标，将在本章稍后描述。\n\n考试警报 所有四种安装方法都可以使用跨网络安装。\n\
  \n\n\n\n在本章后面的部分将进行描述。然而，考试 310-012 仅涵盖了在 JumpStart 中使用的网络安装。\n\n## 安装后阶段\n\n在安装后阶段，会安装任何适当的补丁以及任何单独购买的应用程序。此外，还会将任何自定义配置（例如用户账户和环境）应用于系统。通常，在安装后阶段还会进行系统安全加固。\n\
  \n## 预配置系统信息\n\n如前所述，在系统配置阶段，会识别关于系统的基本信息（如主机名和域名）。这些信息可以在 `sysidcfg` 文件中、所使用的名称服务（`NIS`\
  \ 或 `NIS+`）中，或在交互式对话框中手动定义。\n\n## 使用 sysidcfg 文件\n\n要使用 `sysidcfg` 文件方法，你需要为每个系统创建一个文件，其中包含一组格式为\
  \ `keyword=value` 的行，例如 `timezone=US/CENTRAL`。文件可以通过网络（通过网络文件系统 [NFS]）可用，也可以挂载在本地磁盘驱动器的磁盘上可用。\n\
  \n`sysidcfg` 文件中可以定义以下信息：\n\n- 名称服务（`NIS`、`NIS+`、`DNS` 或无），以及服务器的主机名和网络协议（IP）地址\n\
  - 域名\n- 网络接口（启用 `DHCP` 或指定 IP 地址和子掩码；启用 `IPv6`）\n- Root 密码\n- 系统区域\n- 终端（键盘、鼠标、显示器和显卡类型）\n\
  - 时区（时区和时间服务器）\n\n## 使用 NIS\n\n对于名称服务方法，每个系统的条目会被添加到网络信息服务（`NIS`）或网络信息服务增强（`NIS+`）数据库中。名称服务见第\
  \ 19 章。\n\n可以使用 `NIS`/`NIS+` 定义以下系统定义信息：\n\n- 名称服务（隐含）\n- 主机名和 IP 地址\n- 系统区域\n-\
  \ 时区（时区和时间服务器）\n\n> **考试警示**：`sysidcfg` 文件中可以定义许多名称服务中无法定义的信息，包括域名、大多数网络接口参数（子掩码、`DCP`\
  \ 使用和 `IPv6` 使用）、root 密码以及终端信息（显示器、键盘、鼠标等）。\n\n系统区域（特定语言和地区）存储在 `/etc/locale` 文件中，并可以为系统名或域名指定。对于\
  \ `NIS`，你可以通过修改和执行 `NIS` Makefile 来构建 `locale.byname` 映射。`/etc/locale` 文件用作 `local.byname`\
  \ 映射的信息源。对于 `NIS+`，你使用 `nistbladm` 命令构建区域表并添加条目。\n\n## 软件配置\n\nSolaris 8 系统软件以几种不同的配置分发，如后续章节所示。\n\
  \n### 软件软件包\n\nSolaris 8 系统和应用程序软件以文件和目录集合的形式交付，称为*软件包*。这些软件包可以从 CD-ROM 或磁带作为单个压缩文件复制到系统上，然后解压进行安装。软件包中还包含了有关该包的信息，如标题、存储要求和版本。此外还包含了正确安装软件所需的任何自定义脚本。\n\
  \n### 软件集群\n\n有时，系统软件分发在多个软件包中，但这些软件包需要作为一个单元分发和安装。两个或多个相关软件包的集合被称为*软件集群*。软件集群是软件包的逻辑分组。\n\
  \n### 软件组\n\n*软件组*（也称为*软件配置集群*）是软件集群的集合。根据系统的预期用途，应选择最合适的软件组来安装操作系统。表 21.1 描述了五种软件组。\n\
  \n**表 21.1：Solaris 8 软件组。**\n\n| 软件组 | 内容 |\n| :--- | :--- |\n| 核心 (Core) | 操作系统所需的最小文件。\
  \ |\n| 用户支持系统 | 支持普通用户的系统典型配置。由 Core 软件组加上：窗口化软件：通用桌面环境 (CDE) 和 Open Windows；基础网络和打印机支持；标准\
  \ Unix 和补丁工具；Java 虚拟机。 |\n| 开发者系统支持 | 旨在作为软件开发环境。由用户支持系统软件组加上：编程工具和库；扩展终端、X 窗口和内核探测支持；CDE/Motif\
  \ 开发者软件和运行时；在线手册页。 |\n| 完整发行版 (Entire Distribution) | Solaris 8 发行版包含的所有文件。由开发者系统支持软件组加上：AnswerBook2（在线基于\
  \ Web 的文档）；增强的安全功能，包括磁盘配额和系统计算；增强的网络支持，包括 Unix-to-Unix 拷贝协议 (UUCP)、动态主机配置协议 (`DHCP`)\
  \ 服务器、点对点协议 (PPP) 和网络信息服务 (`NIS`)。 |\n| 完整发行版+ (Entire Distribution Plus) | 包括可选硬件\
  \ OEM 系统组件的模块和驱动程序。由完整发行版软件组加上：PCI 驱动程序；SunFastEthernet 和 FastWide SCSI 适配器驱动程序。\
  \ |\n\n## 网络安装\n\n通常，Solaris 直接从 Solaris 发行 CD 安装。这需要每个系统配备 CD-ROM 驱动器。然而还有另一种方法：可以使用远程服务器通过网络安装\
  \ Solaris，该服务器的 CD-ROM 驱动器中有 Solaris 发布 CD，或者其硬盘上有 Solaris 发布 CD 文件的副本。\n\n网络安装可用于两种交互式安装方法（Solaris\
  \ 交互式安装或 Web Start，见第 3 章）或两种自动安装方法（JumpStart 和自定义 JumpStart）。\n\n要执行网络安装，必须设置一个或多个网络服务器，包括一个安装服务器和可能的引导服务器。此外，你必须在本地\
  \ `NIS` 或 `NIS+` 名称服务中或相应安装服务器的 `/etc` 文件中添加安装客户端的信息。\n\n### 安装服务器\n\n*安装服务器*是一个系统，在网络安装期间，为安装客户端安装\
  \ Solaris 操作系统提供必要的发行文件。这些文件可以直接从挂载在本地 CD-ROM 驱动器的 Solaris 发布 CD 提供，或从本地硬盘提供。\n\n\
  如果你将发行文件复制到本地硬盘，则可以使用一个安装服务器为多个版本（Solaris 8、Solaris 7、Solaris 2.6 等）和/或多个平台（SPARC\
  \ 和 Intel x86）提供文件。此外，本地硬盘通常比本地 CD-ROM 驱动器访问发行文件更快。\n\n要将系统设置为安装服务器，请在本地 CD-ROM\
  \ 驱动器中挂载 Solaris 8 Software (1 of 2) 发行 CD。然后使用 Solaris 发布 CD 上 `Solaris_8/Tools`\
  \ 目录下的 `setup_install_server` 命令将发行文件复制到本地硬盘。需要一个命令行参数：复制发行文件的目标目录完整路径。虽然你可以使用任何目录，但按照惯例，目录命名为\
  \ `/export/install`。以下行执行来自发行 CD `Solaris_8/Tools` 目录的 `setup_install_server` 命令以设置安装服务器：\n\
  \n```bash\n#setup_install_server /export/install\n```\n\n`setup_install_server`\
  \ 命令将软件的 CD 镜像复制到指定的目录。\n\n\n\n\n目录 `Product` 和 `Tools` 目录都会被复制。此外，在 `Tools` 目录中创建一个包含服务器网络子网掩码的\
  \ `netmask`(4) 文件。\n\n一旦设置好安装服务器，你就可以将其他 Solaris 发行版 CD 中的产品（例如 Solaris 8 软件 (2\
  \ of 2) 或 Solaris 8 语言）添加到安装服务器中。用于存储与安装服务器相关文件的目录必须作为命令行参数指定。若要向安装服务器添加内容，请将补充\
  \ CD 插入本地 CD-ROM 驱动器，并在 CD 上执行 `add_to_install_server`(1M) 命令。以下行从发行版 CD 的 `Solaris_8/Tools`\
  \ 目录执行 `add_to_install_server` 命令，以将其添加到安装服务器：\n\n```bash\n./add_to_install_server\
  \ /export/install\n```\n\n`add_to_install_server` 命令支持两个额外的命令行参数。第一个是 `-s`，允许选择要安装的产品。默认情况下，所有产品都会安装。第二个是\
  \ `-p product_path`，其中 `product_path` 是安装产品的备用目录。\n\n默认情况下，安装服务器支持 SunInstall 安装程序（见第\
  \ 3 章）。然而，可以修改安装服务器以使用 Solaris Web Start 程序。可以使用 `modify_install_server`(1M) 命令（位于\
  \ Solaris 8 安装 CD 上）将启用 Web Start 的微根（miniroot）从 CD 复制到安装服务器配置中。\n\n要修改安装服务器，将 Solaris\
  \ 8 安装 CD 插入本地 CD-ROM 驱动器，并在 CD 上执行 `modify_install_server` 命令。以下行从发行版 CD 的挂载点执行\
  \ `modify_install_server` 命令以修改安装服务器：\n\n```bash\n./modify_install_server /export/install\n\
  ```\n\n### 启动服务器\n\n*启动服务器*（boot server）是一个包含在网络安装过程中，通过网络启动 SPARC 安装客户端所需文件的系统。在安装客户端启动后，启动服务器就完成了它的功能。剩余的安装过程由安装服务器支持。由于\
  \ Intel 兼容的安装客户端从本地软盘或本地 CD-ROM 启动，因此它们不使用启动服务器进行安装。\n\n通常，安装服务器和启动服务器位于同一系统上。事实上，当一个系统被设置为安装服务器时，它也会被设置为启动服务器。然而，如果安装客户端与安装服务器位于不同的子网，则必须在安装客户端所在的子网上设置启动服务器。\n\
  \n考试提示：启动服务器必须与 SPARC 安装客户端处于同一子网中，因为客户端使用启动协议（BOOTP）从启动服务器获取启动信息。通常，此协议不会通过路由器（连接子网的设备）传输。\n\
  \n若仅将系统设为启动服务器，该系统必须通过本地 CD-ROM 驱动器或远程共享的 CD-ROM 驱动器访问 Solaris 软件发行 CD。\n\nSolaris\
  \ 软件发行 CD 上 `Solaris_8/Tools` 目录下的 `setup_install_server` 命令会将启动软件复制到启动服务器。需要两个命令行参数：`-b`，指定正在设置启动服务器；以及用于复制启动文件的空目录的完整路径。虽然可以使用任何目录，但按照惯例，该目录命名为\
  \ `boot` 并位于 `/export/install` 目录下。以下行从发行版 CD 的 `Solaris_8/Tools` 目录执行 `setup_install_server`\
  \ 命令以设置启动服务器：\n\n```bash\n./setup_install_server -b /export/install/boot\n```\n\n\
  ### 添加安装客户端\n\n当系统或安装客户端通过网络安装时，关于安装客户端的基本信息需要通过名称服务（NIS/NIS+）或安装服务器或启动服务器上 `/etc`\
  \ 目录下的文件可用。\n\n你可以使用 Solstice Host Manager 程序来添加这些信息，或者如果没有 Host Manager，则可以使用 `add_install_client`\
  \ 命令。\n\n考试提示：`add_install_client` 命令仅用于更新安装服务器或启动服务器上的 `/etc` 文件。请使用适当的 NIS 或 NIS+\
  \ 过程将客户端信息添加到这些名称服务中。至少，你必须添加客户端的 `hostname`、`IP address` 和 `Ethernet address`。\n\
  \n根据环境，你可以修改以下 `/etc` 文件以支持网络安装：\n\n* `/etc/bootparams`(4)—每个客户端对应一个条目，用于定义启动客户端所需的各种路径和参数\n\
  * `/etc/dfs/dfstab`(4)—任何应共享的 NFS 资源的条目\n* `/etc/ethers`(4)—将以太网地址映射到系统主机的条目\n*\
  \ `/etc/exports`(4)—任何应共享的 NFS 资源的条目\n* `/etc/hosts`(4)—将主机名映射到 IP 地址的条目\n* `/etc/inetd.conf`(4)—启用简易文件传输协议（FTP）守护程序的条目\n\
  \n以下行使用 `add_install_client` 命令为网络安装设置系统。在此示例中，使用命令行参数 `sun4m` 来识别该系统为 SPARC 平台：\n\
  \n```bash\nadd_install_client host sun4m\n```\n\n表 21.2：`add_install_client` 的命令行参数。\n\
  \n| 参数 | 描述 |\n| :--- | :--- |\n| `-c server:path` | 指定 JumpStart 目录的 `server` 和\
  \ `path`。 |\n| `-d` | 将客户端定义为 DHCP 客户端。 |\n| `-e address` | 指定以太网地址。 |\n| `-i address`\
  \ | 指定 IP 地址。 |\n| `-n server:service` | 指定 `service` 和名称服务 `netmask`。也可以定义 `netmask`。\
  \ |\n| `-p server:path` | 指定包含 sysidcfg 文件的 `server` 以及 sysidcfg 文件的绝对 `path`。 |\n\
  | `-s server:path` | 指定 CD 镜像的 `server` 和 `path`（仅当向启动服务器添加客户端时需要）。 |\n\n### 安装/启动服务器守护进程\n\
  \n安装服务器和启动服务器使用若干网络守护进程支持网络安装：\n\n* `in.rarpd`(1M)—反地址协议（RARP）守护程序提供以太网地址到 IP 地址的映射。客户端使用此服务根据分配的以太网地址确定其\
  \ IP 地址。\n* `in.tftpd`(1M)—简易文件传输协议（TFTP）守护程序为 SPARC 安装客户端提供了一种无需登录服务器即可获取启动镜像的方法。\n\
  * `nsfd`(1M)—NFS 守护程序为客户端通过网络访问文件系统。\n* `rpc.bootparamd`(1M)—启动协议（BOOTP）守护程序从 `/etc/bootparams`\
  \ 文件为客户端提供启动信息。\n\n#### RARP 守护程序 (in.rarpd)\n\n`/etc/sbin/in.rarpd` 守护程序提供以太网地址到\
  \ IP 地址的映射。当接收到 RARP 请求时，`in.rarpd` 程序尝试确定指定以太网地址分配的 IP 地址。查找过程首先查找以太网\n\n\n\n\n\
  获取系统主机名的地址，然后查找该主机名以确定其 IP 地址。\n\n查找主机名（基于以太网地址）的过程由名称服务切换（`/etc/nsswitch.conf`）文件中\
  \ `ethers` 关键字的配置决定。它可以从 NIS（`ethers.byaddr` 映射表）、NIS+（`ethers` 表）或 `/etc/ethers`\
  \ 文件获取。`/etc/ethers` 文件的格式请参阅 `ethers`(4)。\n\n查找 IP 地址（基于获取的主机名）的过程由名称服务切换（`/etc/nsswitch.conf`）文件中\
  \ `hosts` 关键字的配置决定。它可以从 DNS、NIS（`hosts.byname` 映射表）、NIS+（`hosts` 表）或 `/etc/hosts`\
  \ 文件获取。`/etc/hosts` 文件的格式请参阅 `hosts`(4)。\n\n#### TFTP 守护进程 (in.tftpd)\n\n`/usr/sbin/in.tftpd`\
  \ 守护进程为 SPARC 安装客户端提供了一种简单的方法，通过简易文件传输协议（TFTP）从安装/引导服务器获取引导镜像。与标准的文件传输协议（FTP）不同，TFTP\
  \ 不需要用户身份验证（帐户名和密码）即可访问文件。引导镜像通常存储在 `/tftpboot` 目录下。\n\n#### NFS 服务器守护进程 (nsfd)\n\
  \n`/usr/lib/nfs/nfsd` 守护进程通过 NFS 提供对 Solaris 8 发行文件的网络访问。这些文件通过 `rpc.bootparamd`\
  \ 守护进程提供的引导参数识别。\n\n## 引导参数服务器守护进程 (rpc.bootparamd)\n\n`/user/sbin/rpc.bootparamd`\
  \ 守护进程提供 NFS 共享名称以及引导安装客户端所需的其他信息。信息的来源由名称服务切换（`/etc/nsswitch.conf`）文件中 `bootparams`\
  \ 关键字的配置决定。它可以从 NIS（`bootparams` 映射表）、NIS+（`bootparams` 表）或 `/etc/bootparams` 文件获取。`/etc/bootparams`\
  \ 文件的格式请参阅 `bootparams`(4)。\n\n**考试警示** 由于支持网络安装需要这四个守护进程（无论是否使用 JumpStart），因此在配置网络安装客户端时，`add_install_client`\
  \ 命令将在需要时配置并启动它们（在安装/引导服务器上）。\n\n## 使用 JumpStart 实现自动化安装\n\nJumpStart 功能提供了一种自动安装\
  \ Solaris 操作系统的机制。JumpStart 的两种方法是 JumpStart 和自定义 JumpStart。\n\n**考试警示** JumpStart\
  \ 不仅可以实现安装自动化，还可以用于自动安装大量配置完全相同的系统。如果你需要使用相同配置安装 100 台服务器，JumpStart 提供了一种简化此任务的方法。\n\
  \nJumpStart 让你能够通过向本地 CD-ROM 驱动器插入 Solaris 发行 CD 并启动系统或通过网络启动，在新的 SPARC 平台上自动安装\
  \ Solaris 操作系统。安装的软件由默认配置文件决定。默认配置根据硬件模型和硬盘大小进行选择。安装的软件无法手动选择。\n\n所有新的 SPARC 平台都预装了\
  \ JumpStart 引导镜像。可以使用 `re-preinstall`(1M) 命令将此引导镜像复制到现有的 SPARC 平台。\n\n自定义 JumpStart\
  \ 让你能够通过向本地 CD-ROM 驱动器插入 Solaris 发行 CD 并启动系统或通过网络启动，在新的 SPARC 或 Intel x86 平台上自动安装\
  \ Solaris 操作系统。安装的软件由自定义配置文件决定。使用这种方法，你可以以相同的方式自动安装系统组。自定义配置文件以及其他 JumpStart 配置位于\
  \ JumpStart 配置目录。\n\n### JumpStart 配置目录\n\nJumpStart 配置目录包含用于自定义 JumpStart 安装的文件。它提供了一种方法，为相似系统的组实现安装配置阶段自动化。该目录可以存在于软磁盘上（称为*配置文件磁盘*/profile\
  \ diskette），也可以位于网络服务器上（称为*配置文件服务器*/profile server）。配置文件服务器通过网络提供自定义 JumpStart 配置文件，消除了在安装大量系统时创建和分配多个配置文件磁盘的需求。JumpStart\
  \ 目录中的两种基本文件类型是规则文件和一个或多个配置文件。\n\n**考试警示** 第二部分考试 (310-012) 继续将*配置文件*（profile file）称为*类文件*（class\
  \ file），尽管它早在在 Solaris 2.6 系统文档中就被重命名了。当你看到引用类文件的 JumpStart 问题时，请记住这一点。\n\n### 规则文件\n\
  \n规则文件是一个文本文件，其中每个要自动安装的系统或系统组包含一个条目或*规则*（rule）。每个规则根据一个或多个属性识别系统（或系统组），并识别一个唯一的配置文件，该文件提供该系统或系统组的配置细节。\n\
  \n每个规则由一个或多个关键字和值组成，随后是开始脚本名称、配置文件，然后是结束脚本（所有用制表符或空格分隔）。关键字（及关联值）包括：\n\n* `any`\n\
  * `arch`（后跟处理器类型值）\n* `disksize`（后跟磁盘值）\n* `hostaddress`（后跟 IP 地址值）\n* `hostname`（后跟主机名值）\n\
  * `memsize`（后跟物理内存值）\n* `model`（后跟平台名称值）\n\n每个规则指定一个或多个这些关键字和值，以唯一标识一个系统或系统组。紧随关键字和值之后的是开始脚本名称。这是一个在安装开始前执行的\
  \ Bourne shell 脚本。如果不需要开始脚本，应用连字符 `-` 代替。开始脚本之后是 JumpStart 目录中的配置文件名称，该文件提供该系统或系统组的配置细节。配置文件之后是结束脚本名称。结束脚本是在安装完成后执行的\
  \ Bourne shell 脚本。如果不需要结束脚本，应用连字符 `-` 代替。\n\n以下列表是规则文件中几个条目的示例：\n\n```\nhostname\
  \ sample_host - host_class set_root_pw\nnetwork 924.222.43.0 && \\\narch sun4c -\
  \ net924.4c -\narch i386 x86-begin x86-class -\nany - - any_machine -\n```\n\n第一个条目列出了名为\
  \ `sample_host` 的主机的 JumpStart 安装。没有指定开始脚本，使用 `host_class` 文件作为配置文件或类文件，并在安装后调用结束脚本\
  \ `set_root_pw` 设置 root 账户密码。\n\n第二个条目实际上跨行。第一行尾的反斜杠字符（`\\`）将条目延续到下一行。对于位于网络 `924.222.43.0`\
  \ 且为 SPARC `sun4c` 平台的系统，使用 `net924.4c` 配置文件或类文件。没有指定开始或结束脚本。\n\n第三个条目适用于所有 `i386`\
  \ 或 Intel 平台。首先执行 `x86-begin` 脚本，然后使用 `x86-class` 配置文件或类文件引导安装。没有指定结束脚本。\n\n第四个条目提供了一个默认值。任何被其他规则覆盖的系统都使用\
  \ `any_machine` 配置文件进行安装。没有指定开始或结束脚本。\n\n### 配置文件\n\n配置文件（或类文件）是一个文本文件，定义了如何在系统上安装\
  \ Solaris 8 软件。与规则文件一样，配置文件包含引导安装的关键字和关联值。\n\n\n\n\n关键字及关联值包含以下内容：\n\n- `boot_device`（后跟将用作启动设备的分区）\n\
  - `cluster`（后跟要安装、添加或删除的软件组名称）\n- `filesys`（后跟要挂载的远程文件系统的路径和挂载点）\n- `install_type`（后跟安装类型：`initial_install`\
  \ 初始安装或 `upgrade` 升级）\n- `package`（后跟要添加或删除的软件包名称）\n- `partitioning`（后跟磁盘分区类型：`default`\
  \ 默认、`existing` 现有或 explicit）\n- `root_device`（后跟将用作根设备的分区）\n- `system_type`（后跟系统类型：`standalone`\
  \ 独立系统或 `server` 服务器）\n\n以下列出了在 Solaris 8 发行版 CD 上作为 JumpStart 示例提供的 `any_machine`\
  \ 配置文件的内容：\n\n```\ninstall_type initial_install\nsystem_type standalone\npartitioning\
  \ default\ncluster SUNWCuser\ncluster SUNWCxgl delete\npackage SUNWaudmo add\nfilesys\
  \ any 40 swap\nfilesys any 50 /opt\n```\n\n`install_type` 条目必须指定为配置文件中的第一个项目。此示例将安装标识为初始而非\
  \ `upgrade`。系统类型为 `standalone`，采用 `default` 磁盘分区。End User Support 软件组（即 `cluster`）将被安装，但\
  \ `xgl` 簇将被删除，`audmo` 软件包将被添加。对于文件系统布局，任何分区都将用于 `swap`（大小为 40MB），任何分区都将用于 `/opt`\
  \ 文件系统（大小为 50MB）。\n\n## 验证\n\n在使用规则文件配置文件之前，你必须使用 `check` 命令（位于 Solaris 8 发行版 CD\
  \ 的 Tools 目录下）对它们进行验证。如果规则文件和所有配置文件设置正确，则会在 JumpStart 配置目录中创建一个 `rules.ok` 文件。\n\
  \n## 启动 JumpStart 客户端\n\n启动时，JumpStart 客户端尝试查找与系统相关的规则文件和配置文件。如果磁盘驱动器中挂载了包含 JumpStart\
  \ 配置目录的软盘，客户端将使用它。\n\n否则，客户端将通过 RARP 广播联系运行在 `install/boot` 服务器上的 `in.rarpd` 守护进程，并根据以太网地址获取客户端名称或\
  \ IP 地址。然后，客户端将使用 BOOTP 联系运行在 `install/boot` 服务器上的 `in.bootparamd` 守护进程。请求包含客户端名称或\
  \ IP 地址。根据这些信息，`in.bootparamd` 守护进程从 `/etc/bootparam`、`NIS` 或 `NIS+` 提供启动参数。这些参数之一是\
  \ `install_config`，它定义了配置文件服务器以及 JumpStart 配置目录的路径。其他参数包括提供启动的 TFTP 服务器（仅限 SPARC）以及通过网络提供\
  \ Solaris 8 软件分发的 NFS 服务器，也通过相同的程序获取。一旦定位 JumpStart 目录，规则文件将决定使用适当配置文件或类文件。配置文件中的详细信息将指导安装。\n\
  \n安装文件将从挂载在本地 CD-ROM 驱动器中的发行 CD 获取，或者从 `install boot` 参数指定的安装服务器和路径获取。\n\n### 练习题\n\
  \n### 第 1 题\n\n下列哪个命令用于设置安装服务器？\n\na. `setup_install_server`\nb. `setup_install_server\
  \ -b`\nc. `install_server_setup`\nd. `server_setup -i`\n\n答案 `a` 正确。`setup_install_server`\
  \ 命令用于设置安装服务器。`-b` 命令行参数用于安装启动服务器。因此，答案 `b` 是错误的。答案 `c` 和 `d` 中的命令不存在。\n\n### 第\
  \ 2 题\n\n以下哪项是在与安装服务器分离开的独立系统上设置启动服务器的原因？\n\na. 启动服务器不能存在于安装服务器上。\nb. 一个或多个安装客户端与安装服务器不在同一子网内。\n\
  c. 所有安装客户端不在同一子网内。\nd. `NIS` 或 `NIS+` 无法定位安装服务器上的启动服务器。\n\n答案 `b` 正确。如果一个或多个安装客户端与安装服务器不在同一子网内，你应该在独立于安装服务器的系统上设置启动服务器。启动服务器可以存在安装服务器上。因此，答案\
  \ `a` 是错误的。客户端与其他客户端之间的位置并不决定是否需要启动服务器；客户端相对于安装服务器的位置决定了是否需要独立的启动服务器。因此，答案 `c` 是错误的。`NIS`\
  \ 和 `NIS+` 并不查找内容，它们仅作为信息数据库使用。因此，答案 `d` 是错误的。\n\n### 第 3 题\n\n输入用于向安装服务器或启动服务器添加安装客户端信息的命令名称（不带命令行参数）。\n\
  \n正确答案是 `add_install_client`。\n\n### 第 4 题\n\n以下哪些安装方法可以使用网络安装资源？[选择所有适用项]\n\na.\
  \ Custom JumpStart\nb. Web Start\nc. JumpStart\nd. Interactive installation（交互式安装）\n\
  \n答案 `a`、`b`、`c` 和 `d` 正确。所有四种安装方法都可以使用网络安装资源。\n\n### 第 5 题\n\n以下哪些项是自动方法？[选择所有适用项]\n\
  \na. SunInstall\nb. Custom JumpStart\nc. Web Start\nd. JumpStart\n\n答案 `b` 和 `d`\
  \ 正确。Custom JumpStart 和 JumpStart 是自动方法。`SunInstall` 和 `Web Start` 是交互式方法。因此，答案\
  \ `a` 和 `c` 是错误的。\n\n### 第 6 题\n\n输入用于将 Solaris 8 发行版 CD 的内容添加到安装服务器的命令名称。\n\n正确答案是\
  \ `add_to_install`。\n\n### 第 7 题\n\n以下文件应该存在于 JumpStart 配置目录中？[选择所有适用项]\n\na. 一个或多个\
  \ JumpStart 配置文件\nb. `check`\nc. 规则文件\nd. `rules.ok` 文件\n\n答案 `a`、`c` 和 `d` 正确。配置文件和规则文件是\
  \ JumpStart 配置目录中必须创建的两种类型的文件。如果设置正确，会在 JumpStart 目录中创建 `rules.ok` 文件。必须执行位于 Solaris\
  \ 8 发行版 CD 中的 `check` 命令来验证规则和配置文件。因此，答案 `b` 是错误的。\n\n### 第 8 题\n\n将每个 `add_install_client`\
  \ 命令行参数与其用途匹配。\n\na. `-c` 1. 指定安装服务器路径\nb. `-d` 2. 指定配置文件服务器和 JumpStart 配置目录路径\n\
  c. `-p` 3. 指定客户端为 DHCP 客户端\nd. `-s` 4. 指定 sysidcfg 文件的服务器和路径\n\n答案 `a-2`、`b-3`、`c-4`\
  \ 和 `d-1` 正确。`-c *server*: *path` 命令行参数指定存放规则和类文件的配置文件服务器和 JumpStart 配置目录。`-d` 命令行参数指定客户端将使用\
  \ DHCP 获取 IP 地址、子网掩码等。`-p *server*: *path` 命令行参数指定 sysidcfg 文件的服务器和路径。`-s *server*:\
  \ *path` 命令行参数指定安装服务器和安装镜像路径。\n\n### 第 9 题\n\n用于自定义 JumpStart 安装定义如何安装系统的文件。\n\n\
  正确答案是 `profile`。\n\n### 第 10 题\n\n以下哪些项是 Solaris 8 软件组？[选择所有适用项]\n\na. Entire Distribution\n\
  b. Basic\nc. End User Support\nd. Java Development Environment\n\n答案 `a` 和 `c` 正确。Entire\
  \ Distribution 和 End User Support 是 Solaris 8 的软件组。答案 `b` 和 `d` 中的组不存在。\n\n\n\n\n\
  \n输入包含启动参数并由 `add_install_client` 命令更新的文件名。\n\n正确答案是 `/etc/bootparams`。\n\n## 了解更多？\n\
  \nBecker, George, Mary E. S. Morris, and Kathy Slattery, *Solaris Implementation*\
  \ (SunSoft Press, 1995), ISBN 0-13-353350-6.\n\nSun Microsystems, *Solaris Advanced\
  \ Installation Guide*。提供纸质版（部件号 806-0957-10）、可通过 Web `docs.sun.com` 以及随 Solaris\
  \ 8 操作系统提供的在线文档 AnswerBook 获取。\n\nSun Microsystems, *System Reference Manual, Section\
  \ 1 - User Commands*.提供纸质版（部件号 806-0924-10）、可通过 Web `docs.sun.com` 以及随 Solaris 8\
  \ 操作系统提供的在线文档 AnswerBook 获取。\n\nSun Microsystems, *System Reference Manual, Section\
  \ 1M - Administration Commands*.提供纸质版（部件号 806-0925-10）、可通过 Web `docs.sun.com` 以及随\
  \ Solaris 8 操作系统提供的在线文档 AnswerBook 获取。\n\nSun Microsystems, *System Reference Manual,\
