  \ 8 操作系统提供的在线文档 AnswerBook2 获取。\n\nSun Microsystems, *System Reference Manual, Section\
  \ 1M-Administration Commands*。提供印刷版（部件号 806-0625-10）、可在 Web 端 `docs.sun.com` 获取，并通过\
