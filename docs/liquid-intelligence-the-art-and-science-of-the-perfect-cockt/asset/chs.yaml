  \ was successful.\n#\n```\n\n### 使用 admintool 删除软件包\n\n也可以使用 `admintool` 删除已安装的软件包。首先，要显示已安装软件包列表，从“浏览”（Browse）菜单中选择“软件”（Software）。删除软件包，在列表中突出显示其名称并在“编辑”（Edit）菜单中选择“删除”（Delete）。将弹出一个窗口确认删除软件包。`admintool`\
  \ 命令调用 `pkgrm` 命令并打开一个窗口显示结果。\n\n图 3.6：Admintool：警告窗口。\n\n### 补丁管理\n\n64\n\n*补丁*（patch）是用于更新或修复问题的文件集合。例如，一个补丁可能用于修复命令或解决安全问题。由于大多数系统和应用程序是以软件包形式安装的，补丁是更新其他软件包的特殊软件包。一组补丁可以组合成补丁簇*。获取补丁、跟踪补丁以及偶尔删除补丁是系统管理员的关键技能。\n\
  \n### 获取补丁和补丁信息\n\n可以通过多种方式从 Sun Microsystems 获取补丁。两种常用方法是从 Sun 购买或自行下载补丁。\n\nSun\
  \ 服务客户可以访问在线补丁数据库和扩展补丁集。补丁可以从 Sun 的 Web 或 FTP 站点下载。此外，Sun 服务客户每六到八周收到一张补丁光盘。\n\n\
  其他人可以通过 sunsolve.com 获取支持系统的推荐补丁，或者通过匿名 FTP `sunsolve1.sun.com/pubs/patches` 获取。获取\
  \ Solaris 补丁的另一个站点是 `www.ibiblio.org/pub/sun-info`。\n\n**提示** Sun 每月提供一份报告，总结支持系统的推荐和安全补丁。与补丁一样，这些信息可以在\
  \ sunsolve.com 以及系统支持。\n\n补丁用八位数字标识。前六位数字识别基础补丁，后两位识别修订版本。例如，补丁号 110906-01 是 Solaris\
  \ 8 版本 find() 的更新。\n\n### 安装补丁\n\n使用 `patchadd` 命令安装补丁。必须使用 `patchadd` 命令行参数指定相应的系统配置类型。您还需要指定目标目录。此外，可以使用单个\
  \ `patchadd` 命令安装多个补丁。\n\n无论修复的是什么类型的系统配置，`patchadd` 命令通常在被补丁软件所在的系统（*目标目录*）上本地执行。然而，如果目标目录可以通过网络文件系统\
  \ (NFS) 服务访问，就可以通过网络远程安装补丁。\n\n如果补丁在光盘上，您可以直接从光盘安装。从 Sun Web 或 FTP 站点下载的补丁必须位于系统硬盘上。补丁所在的区域是\n\
  \n\n\n\n在安装前存储的目录称为 `spool directory`（暂存目录）。\n\n提示：虽然补丁没有强制要求的 `spool directory`，但最常用的位置是\
  \ `/var/spool/patch` 目录。不过，你可以使用系统上任何具有足够可用空间的位置。\n\n如果补丁是通过下载获取的，那么它很可能经过了 `zipped`（压缩），以便更方便、快速地下载。某些补丁（主要针对\
  \ SPARC 平台）使用 `gzip`(1) 命令压缩，文件名以 `.gz` 结尾。另一些则使用 `zip`(1) 命令压缩，文件名以 `.zip` 结尾。`zip`\
  \ 命令被同时用于 SPARC 和 Intel x86 平台。要解压或 `unzip` 当前目录下的 x86 `find` 补丁 (110906-01)，请使用如下所示的\
  \ `unzip11) 命令：\n\n```\nunzip 110906-01.zip\nArchive: 110906-01.zip\ncreating: 110906-01/\n\
  inflating: 110906-01/.diPatch\ncreating: 110906-01/SUNWcsu/\ninflating: 110906-01/SUNWcsu/pkgmap\n\
  inflating: 110906-01/SUNWcsu/pkginfo\ncreating: 110906-01/SUNWcsu/install/\ninflating:\
  \ 110906-01/SUNWcsu/install/checkinstall\ninflating: 110906-01/SUNWcsu/install/copyright\n\
  inflating: 110906-01/SUNWcsu/install/i.none\ninflating: 110906-01/SUNWcsu/install/patch_checkinstall\n\
  inflating: 110906-01/SUNWcsu/install/patch_postinstall\ninflating: 110906-01/SUNWcsu/install/postinstall\n\
  inflating: 110906-01/SUNWcsu/install/preinstall\ncreating: 110906-01/SUNWcsu/reloc/\n\
  creating: 110906-01/SUNWcsu/reloc/usr/\ncreating: 110906-01/SUNWcsu/reloc/usr/bin/\n\
  inflating: 110906-01/SUNWcsu/reloc/usr/bin/find\ninflating: 110906-01/README.110906-01\n\
  ```\n\n当前目录下将创建一个与补丁同名的子目录，解压后的文件将放置在该子目录中。\n\n随后，你使用 `patchadd` 命令来安装补丁。由于补丁没有默认的\
  \ `spool directory`，你必须将补丁的全路径作为命令行参数指定。以下示例显示了在独立系统上安装 x86 `find` 命令补丁的过程：\n\n\
  ```\npatchadd 110906-01\nChecking installed patches…\nVerifying sufficient filesystem\
  \ capacity (dry run method)…\nInstalling patch packages…\nPatch number 110906-01\
  \ has been successfully installed.\nSee /var/sadm/patch/110906-01/log for details\n\
  Patch packages installed:\nSUNWcsu\n```\n\n注意，该补丁修改了 `SUNWcsu` 软件包（核心 Solaris 软件）。`patchadd`\
  \ 命令实际上是一个 `ksh` 脚本，它调用 `pkgadd` 命令来安装补丁。\n\n若要将补丁应用于无盘客户端（diskless client）或 AutoClient\
  \ 的磁盘可启动根镜像，请使用 `-R` 命令行参数并指定客户端根镜像的路径。例如，对一个使用当前系统 `/export/root/client` 目录下存储的根镜像的无盘客户端应用\
  \ Solaris 8 x86 `find` 命令补丁，需要以下命令：\n\n```\npatchadd -R /export/root/client /var/spool/patch/110906-01\n\
  ```\n\n若要将补丁应用于操作系统（OS）服务，请使用 `-S` 命令行参数并指定该服务（有关 OS 服务器的信息请第 13 章）。例如，对 OS 服务器上名为\
  \ `Solaris_8x86` 的 x86 Solaris 8 OS 服务应用 Solaris 8 `find` 命令补丁，需要以下命令：\n\n```\n\
  patchadd -S Solaris_8x86 /var/spool/patch/110906-01\n```\n\n若要将补丁应用于网络安装镜像（用于通过网络安装系统的镜像）的微根，请使用\
  \ `-C` 命令行参数并指定网络安装镜像的路径。例如，对网络安装服务器上名为 `Solaris_8x86` 的 x86 Solaris 8 镜像应用 Solaris\
  \ 8 `find` 命令补丁，需要以下命令：\n\n```\npatchadd -C /export/Solaris_8x86/Tools/Boot /var/spool/patch/110906-01\n\
  ```\n\n可以使用 `patchadd` 命令配合 `-M` 参数并指定目录来安装多个补丁。例如，要安装 `108529-05`、`108653-23` 和\
  \ `108976-07` 补丁，可以创建一个包含这些名称的列表，然后使用以下命令：\n\n```\npatchadd -M /var/spool/patch/\n\
  ```\n\n**确定安装了哪些补丁**\n\n可以使用两个命令生成独立系统的已安装补丁列表：\n\n- `showrev -p`\n- `patchadd -p`\n\
  \n这两个命令生成的列表几乎相同。以下示例展示了 `showrev`(1) 命令的用法（输出已为了易读进行了格式处理）：\n\n```\n$ showrev -p\n\
  Patch: 110906-01\nObsoletes:\nRequires:\nIncompatibles:\nPackages: SUNWcsu\nPatch:\
  \ 108632-06\nObsoletes:\nRequires: 109000-01, 109038-01, 109067-02, 108994-01, 108969-01\n\
  Incompatibles:\nPackages: SUNWcsr, SUNWnisr, SUNWncar\n```\n\n如果发生以下情况，`patchadd`\
  \ 命令将执行失败：\n\n- 被补丁的软件包未安装或仅部分安装。\n- 补丁架构与系统架构不匹配。\n\n\n\n如前所述，可以使用 `-C`、`-R` 和\
  \ `-S` 命令行参数进行配置。例如，要显示应用于名为 Solaris8x86 的 OS 服务的补丁，可以使用以下 `patchadd` 命令：\n\n```bash\n\
  patchadd -S solaris8x86 -p\n```\n\n要显示应用于特定包的补丁列表，请使用 `pkgparam` 命令。以下示例列出了应用到 SUNWcsu\
  \ 包的补丁：\n\n```bash\n$ pkgparam SUNWcsu PATCHLIST\n108529-01 108826-01 108900-01\
  \ 108980-04 108986-01 108990-02\n109010-01 109020-01 109028-01 109044-02 109046-02\
  \ 109092-01\n109138-01 109146-01 109148-01 109150-01 109278-01 108965-02\n108976-02\
  \ 109004-01 109006-01 109008-01 109012-01 109016-01\n109018-01 109022-01 109024-01\
  \ 109032-01\n109034-01 109036-01\n69\n110906-01\n```\n\n### 移除补丁\n\n`patchrm` 命令用于通过指定补丁编号作为命令行参数来移除或回补丁。`patchadd`\
  \ 命令支持的系统配置同样适用于 `patchrm` 命令。你同样可以使用如前所述的 `-C`、`-R` 和 `-S` 命令行参数。例如，从名为 client5\
  \ 的无盘客户端的可启动根镜像中移除补丁 110906-01，可以使用以下 `patchrm` 命令：\n\n```bash\npatchrm -R /export/root/client5\
  \ 110906-01\n```\n\n由于在安装过程中可以使用 `patchadd` 命令的 `-B` 命令行参数更改默认备份目录，因此 `patchrm`\
  \ 命令也支持 `-B` 参数。此外，你还可以使用 `-f` 命令行参数强制 `patchrm` 命令移除已被其他补丁取代的补丁。\n\n只要满足以下条件，就可以移除已安装的补丁并将系统恢复到安装补丁之前的状态：\n\
  * 该补丁未被另一个补丁需要或已被后来的补丁废弃。\n* 该补丁不是使用 `patchadd -d` 安装的（该参数会告知 `patchadd` 在更新或替换文件之前不保存副本）。\n\
  \n### 练习题\n\n### 第 1 题\n下列哪些可以用于安装多个补丁？[多选]\na. `patchadd -M /var/spool/patch 104567-03\
  \ 106583-10 103276-04`\nb. 使用 `patchadd` 分别安装每个补丁。\nc. `patchadd -M /var/spool/patch\
  \ patchlist`\n\n**答案 a、b、和 c 正确。** 所有答案都可以用于安装多个补丁。答案 a 中的命令安装了位于 `/var/spool/patch`\
  \ 目录下的三个补丁。答案 c 中的命令使用了一个名为 `patchlist` 的文件，该文件包含要安装的补丁列表。当然，可以使用 `pkgadd` 命令一次一个地安装几个补丁（答案\
  \ b）。\n\n### 第 2 题\n下列哪些可以用于安装包？[多选]\na. `admintool`\nb. `pkgtool`\nc. `pkgadd`\n\
  d. `pkgrm`\ne. `pkginfo`\n\n**答案 a 和 c 正确。** 你可以使用 `admintool` 和 `pkgadd` 安装包。`pkgtool`\
  \ 并不存在。因此，答案 b 是错误的。`pkgrm` 用于移除包，而 `pkginfo` 用于显示包的信息。因此，答案 d 和 e 是错误的。\n\n###\
  \ 第 3 题\n安装 Solaris 8 最常用的两种方法是什么？[多选]\na. 磁带 (Tape)\nb. 软光盘 (CD-ROM)\nc. 网络传输 (Over-the-network)\n\
  d. 磁盘 (Diskette)\ne. 网页 (Web)\n\n**答案 b 和 c 正确。** Solaris 8 最常用通过 CD-ROM 或通过网络安装。磁带和磁盘是有效的启动设备，但并不用于安装。因此，答案\
  \ a 和 d 是错误的。答案 e Web 是不可行的。\n\n### 第 4 题\n下列哪项是包的默认缓存目录（spool directory）？\na. `/var/spool`\n\
  b. `/var/sadm/pkg`\nc. `/tmp`\n\n**答案 d 正确。** `/var/spool/pkg` 是默认的缓存目录。`/var/spool`\
  \ 是错误的。`/var/sadm/pkg` 是错误的。\n\n### 第 5 题\n下列哪项是包的默认缓存目录？\na. 苹果系统 (Macintosh system)\n\
  b. SPARC\nc. Pentium\n\n**答案 a 正确。** `/var/spool/pkg` 是默认缓存目录。\n\n### 第 6 题\n下列哪些命令可以显示选定的补丁信息？[多选]\n\
  a. `patchinfo`\nb. `patchadd -l`\nc. `patchlist`\n\n**答案 a、b 正确。** 你可以使用 `patchinfo`、`patchadd\
  \ -l` 或 `patchlist` 文件。\n\n### 第 7 题\n下列哪些可以用于移除补丁？\na. `rmpatch`\nb. `patchrm`\n\
  c. `-p`\nd. `patchadd -d`\n\n**答案 b 正确。** 你可以使用 `patchrm` 移除补丁。答案 a 不是有效命令。`-p`\
  \ 不存在。`patchadd -d` 命令用于添加补丁但不保存文件。\n\n### 第 8 题\n下列哪些命令可以列出已安装的补丁？[多选]\na. `showrev\
  \ -p`\nb. `pkginfo`\nc. `patchlist`\nd. `patchadd -p`\n\n**答案 a 和 d 正确。** 你可以使用\
  \ `showrev -p` 和 `patchadd -p` 列出已安装的补丁。\n\n### 第 9 题\n在升级过程中，磁盘空间需要重新分配。下列哪些可以作为备份介质？[多选]\n\
  a. 空闲系统磁盘\nb. 磁带\nc. 磁盘\nd. CD-ROM\ne. 远程文件系统\n\n**答案 a、b、c 和 e 正确。** 空闲系统磁盘、磁带、磁盘或远程文件系统都可以作为备份介质，前提是提供了足够的存储。CD-ROM\
  \ 正如其名，是只读的。只读介质无法备份。\n\n### 第 10 题\n在使用 Web Start 进行自定义安装时，可以选择哪些项目？[多选]\na. 文件系统布局\n\
  b. 软件本地化\nc. 额外的软件产品\nd. 系统区域\ne. 软件组或集群\n\n**答案 a、b、c、d 和 e 正确。** 文件系统布局允许你添加文件系统和/调整调整文件的大小。软件本地化可用于选择地理区域（如北美），系统区域进一步定义了系统语言。软件组和额外的产品也可以选择。这些项目仅在选择自定义安装时可用。\n\
  \n\n\n\n\n随 Solaris 8 操作系统一同提供的 AnswerBook2。\n\nSun Microsystems，*Solaris 8 (Intel\
  \ 平台版) 安装指南*。提供打印版（部件号 806-0956-10）、通过 Web `docs.sun.com` 访问，以及通过 Solaris 8 操作系统提供的在线文档\
  \ AnswerBook2 获取。\n\nSun Microsystems，*Solaris 8 (SPARC 平台版) 安装指南*。提供打印版（部件号 806-0955-10）、通过\
  \ Web `docs.sun.com` 访问，以及通过 Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\nSun Microsystems，*Solaris\
  \ 8 1/01 Sun 硬件平台指南*。提供打印版（部件号 806-6513-10）、通过 Web `docs.sun.com` 访问，以及通过 Solaris\
  \ 8 操作系统提供的在线文档 AnswerBook2 获取。\n\nSun Microsystems，*系统管理指南，第 1 卷*。提供打印版（部件号 805-7228-10）、通过\
  \ Web `docs.sun.com` 访问，以及通过 Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\nSun Microsystems，*系统参考手册，第\
  \ 1 部分 - 用户命令*。提供打印版（部件号 806-0624-10）、通过 Web `docs.sun.com` 访问，以及通过 Solaris 8 操作系统提供的在线文档\
  \ AnswerBook2 获取。\n\nSun Microsystems，*系统参考手册，第 1M 部分 - 系统管理命令*。提供打印版（部件号 806-0625-10）、通过\
  \ Web `docs.sun.com` 访问，以及通过 Solaris 8 操作系统提供的在线文档 AnswerBook2 获取。\n\n# 第 4 章：启动与关机\n\
  \n**你需要理解的术语：**\n* OpenBoot\n* 非易失性 RAM (NVRAM)\n* 设备别名 (Device aliases)\n* 启动过程\n\
  * 内核模块 (Kernel modules)\n* init 程序\n* 系统运行级别 (run levels)\n* rc 脚本\n\n**你需要掌握的技巧：**\n\
  * 创建和删除设备别名\n* 故障排除启动问题\n* 修改系统运行级别\n* 使用 rc 脚本添加系统服务\n\n本章介绍了与系统启动和关机相关的主题。第一节涵盖了\
  \ Sun SPARC 平台上系统固件的关键方面，包括 *Boot PROM* 测试目标。第二节总结了适用于 SPARC 和 Intel x86 平台的启动过程。本节涵盖了*启动过程*测试目标。第三节描述了系统运行级别、不同运行级别下可用的服务以及如何在运行级别之间切换。此外还包含了如何在选定的运行级别下添加自定义服务的描述。本节包含了*初始化与关机*测试目标。\n\
  \n## Boot PROM 固件 (OpenBoot)\n\n系统的启动可编程只读存储器 (PROM) 用于存储在系统硬件完成上电自检 (POST) 后立即执行的固件。该固件被称为\
  \ OpenBoot，它是 Sun 系统的标准固件。OpenBoot 固件仅适用于 SPARC 平台，但在 Intel x86 平台上也提供有限的功能。\n\n\
  OpenBoot 用于启动操作系统、运行诊断、修改存储在非易失性 RAM (NVRAM) 中的启动相关参数，并提供 *Forth* 解释器。\n\n目前提供两个支持版本的\
  \ OpenBoot：版本 2.x 和版本 3.x。OpenBoot 2.x 随着 SPARCstation 2 和 SPARCstation IPX 系统引入。OpenBoot\
  \ 3.x 是 OpenBoot 2.x 的增强版本；它基于电气电子工程师学会 (IEEE) 标准 1275-1994，“启动固件标准”。OpenBoot 3.x\
  \ 用于 Sun Ultra 系列和更更新的 SPARC 平台。\n\nOpenBoot 为系统控制台提供了命令行界面。该命令行界面有两种模式：\n* *受限监控器\
  \ (Restricted Monitor)*——允许管理员启动操作系统、继续挂起的操作或启动 Forth 监控器。受限监控器的提示符为 `>` 符号。\n*\
  \ *Forth 监控器 (Forth Monitor)*——允许管理员启动操作系统、运行诊断并修改系统配置参数。Forth 监控器的提示符为单词 `ok`，通常称为\
  \ *OpenBoot 提示符*。\n\n系统配置参数存储在系统 NVRAM 中。这些参数了系统的初始配置和相关的通信特性，即使系统断电也会保留其值。\n\n\
  你可以使用 OpenBoot `printenv` 命令查看这些参数的值。要修改它们，请使用 OpenBoot `setenv` 命令。\n\n### 重要 OpenBoot\
  \ 命令\n\n一些重要的 OpenBoot 命令用于显示系统配置信息、执行硬件测试和控制系统启动。所有这些命令都在 Forth 监控器或 OpenBoot `ok`\
  \ 提示符下输入。\n\n表 4.1 列出了显示系统配置数据的 OpenBoot 命令，表 4.2 列出了用于执行基本硬件测试的 OpenBoot 命令。表 4.3\
  \ 列出了你可以选择不同启动设备的 OpenBoot `boot` 命令的变体。\n\n### 表 4.1：显示系统配置数据的 OpenBoot 命令。\n|\
  \ 命令 | 说明 |\n| :--- | :--- |\n| `banner` | 显示开机 banner |\n| `devalias` | 列出设备别名\
  \ |\n| `enet-addr` | 显示以太网地址 |\n| `idprom` | 显示格式化的 ID PROM 内容 |\n| `module-info`\
  \ | 显示速度 (2.x 版本) |\n| `printenv` | 列出所有 NVRAM 参数 |\n| `show-devs` | 列出所有设备 |\n\
  | `speed` | 显示速度 (3.x 版本) |\n| `traps` | 列出异常类型 |\n| `version` | 显示启动 PROM 的版本 |\n\
  \n### 表 4.2：执行硬件测试的 OpenBoot 命令。\n| 命令 | 说明 |\n| :--- | :--- |\n| `pcia-probe-list`\
  \ | 测试外围组件互连 (PCI) 总线 |\n| `probe-scsi` | 测试小型系统接口 (SCSI) 总线 |\n| `probe-scsi-all`\
  \ | 测试所有设备 |\n| `test-all` | 测试一组设备 |\n| `test floppy` | 测试磁盘 |\n| `test /memory`\
  \ | 测试系统内存 |\n| `test net` | 测试以太网接口 |\n| `watch-clock` | 监控系统时钟 |\n| `watch-net`\
  \ | 监控网络连接 |\n\n### 表 4.3：选择不同启动设备的 OpenBoot 命令。\n| 命令 | 说明 |\n| :--- | :--- |\n\
  | `boot cdrom` | 从本地 CD-ROM 启动 |\n| `boot disk` | 从默认硬盘启动 |\n| `boot floppy` | 从磁盘启动\
  \ |\n| `boot net` | 从网络启动 |\n| `boot tape` | 从 SCSI 磁带驱动器启动 |\n\n`boot` 命令支持你可能需要的选项。`-a`\
  \ 选项请求交互启动，以便 OpenBoot 在需要时提示。此外，`-s` 选项导致 OpenBoot 启动到单用户模式而不是默认系统运行级别。当你从硬盘启动时，默认设备由\
  \ `boot-device` NVRAM 配置参数指定。从 OpenBoot `ok` 提示符使用以下命令显示默认设备：\n\n```\nprintenv boot-device\n\
  boot-device = disk\n```\n\n根据需要更改默认设备。例如，将默认启动设备更改为别名为 `disk2` 的设备，可以使用命令。然后使用 `reset`\
  \ 保存新值并重启：\n\n```\nsetenv boot-device disk2\nreset\n```\n\n### 设备别名\n\nOpenBoot\
  \ 使用完整设备路径识别系统硬件，该路径表示设备类型及其在系统中的位置。设备路径由系统总线、地址以及可能的驱动程序组成。以下是 SCSI 硬盘分区的完整设备名称示例：\n\
  \n```\n/sbus@1f,0/SUNW,fas@e,880000/sd@3,0:a\n```\n\n\n\n\n有关设备名称的更多详细信息，请参阅第 8\
  \ 章。由于设备名称通常很长、复杂且难以输入，OpenBoot 允许您为完整的设备名称分配一个 `device alias`（设备别名）；该别名短且易于记忆和输入。\n\
  \n### 创建设备别名\n\n可以通过两种方法创建设备别名。第一种使用 `devalias` 命令。使用此命令创建的别名会在系统重启时丢失。第二种使用 `nvalias`\
  \ 命令。使用此命令创建的别名存储在非易失性内存中，直到您使用其他 OpenBoot 命令将其删除为止。这两个命令使用相同的语法结构。\n\n例如，在 OpenBoot\
  \ `ok` 提示符下输入以下两个命令，都会将别名 `disk2` 分配给名为 `/sbus/esp/sd@2,0` 的设备（SC 磁盘）：\n\n```\n\
  ok devalias disk2 /sbus/esp/sd@2,0\nok nvalias disk2 /sbus/esp/sd@2,0\nok\n```\n\
  \n每当 OpenBoot 环境中需要设备名称时，您都可以使用别名。当您输入 `nvalias` 命令时，它会被存储在非易失性内存中。这部分内存被视为名为 `nvramrc`\
  \ 的 OpenBoot 参数。`nvramrc` 参数的内容被称为 `script`。除了存储用户定义的命令外，该参数还被设备驱动程序用于保存启动配置变量、补补设备驱动程序代码以及存储错误补丁或其他特定安装的设备配置信息。\n\
  \n如果 OpenBoot 参数 `use-nvramrc` 设置为 `true`，会在系统启动期间执行脚本。使用 `nvalias` 命令在 `nvramrc`\
  \ 中定义的任何别名将被设置，随后这些别名可以在脚本的后续部分或作为一个或多个 OpenBoot 参数的值。\n\n### 显示设备别名\n\n您可以使用 `devalias`\
  \ 命令显示已定义的设备别名。如果您在不带任何命令行参数的情况下输入命令，将列出所有定义的设备别名。如果将别名作为命令行参数，`devalias` 命令将仅显示指定的别名。以下示例显示了在\
  \ SPARC 20 工作站的 OpenBoot `ok` 提示符下使用 `devalias` 命令：\n\n```\nok devalias\nscreen\
  \ /iommu@f,e000000/sbus@f,e001000/cgsix@2,0\nttyb /obio/zs@0,100000:b\nttya /obio/zs@0,100000:a\n\
  keyboard /obio/zs@0,0\nfloppy /obio/SUNW,fdtwo\nscsi /iommu/sbus/espdma@f,400000/esp@f,800000\n\
  net-aui /iommu/sbus/ledma@f,400010:aui/le@f,c0000\nnet-tpe /iommu/sbus/ledma@f,400010:tpe/le@f,c0000\n\
  net /iommu/sbus/ledma@f,400010/le@f,c0000\ndisk /iommu/sbus/espdma@f,400000/esp@f,800000/sd@3,0\n\
  cdrom /iommu/sbus/espdma@f,400000/esp@f,800000/sd@6,0:d\ntape /iommu/sbus/espdma@f,400000/esp@f,800000/st@4,0\n\
  tape1 /iommu/sbus/espdma@f,400000/esp@f,800000/st@5,0\ntape0 /iommu/sbus/espdma@f,400000/esp@f,800000/st@4,0\n\
  disk3 /iommu/sbus/espdma@f,400000/esp@f,800000/sd@3,0\ndisk2 /iommu/sbus/espdma@f,400000/esp@f,800000/sd@2,0\n\
  disk1 /iommu/sbus/espdma@f,400000/esp@f,800000/sd@1,0\ndisk0 /iommu/sbus/espdma@f,400000/esp@f,800000/sd@0,0\n\
  ok devalias disk\ndisk /iommu/sbus/espdma@f,400000/esp@f,800000/sd@3,0\nok\n```\n\
  \n### 删除设备别名\n\n由 `nvalias` 命令定义的别名存储在脚本中，直到您使用 `nvunalias` 命令将其删除，或者将系统配置恢复为默认值。要删除别名，请在\
  \ `ok` 提示符下执行：\n\n```\nok nvunalias disk2\n```\n\n\n\n并导致其执行。内核初始化其数据结构，并根据 `ufsboot`\
  \ 程序基于 `/etc/system` 文件开始加载其他内核模块。在所有必要的模块加载并初始化后，内核启动 `/sbin/init` 程序。\n\n## Intel\
  \ x86 启动过程\n\nIntel x86 启动过程包含以下阶段：\n\n1. **BIOS—** 在此阶段，将执行 POST（上电自自检）诊断。然后，从磁盘读取主引导记录\
  \ `mboot`，以找到包含 `pboot` 程序的活动分区。\n2. **启动程序—** 在此阶段，加载 `pboot` 程序，并转定位并加载主启动程序 `bootblk`。然后，在根文件系统中定位并加载二级启动程序（即\
  \ `boot.bin` 或 `ufsboot`）。\n3. **内核初始化—** 在此阶段，`boot.bin` 或 `ufsboot` 程序将核心内核加载到内存中导致其执行。内核初始化其数据结构并开始加载其他内核模块。在所有必要的模块加载并初始化后，内核启动\
  \ `/sbin/init` 程序。\n4. **init—** 在 init 阶段，`init` 程序根据 `/etc/inittab` 文件包含的信息启动其他进程。这些进程包括一个调用\
  \ `rc` 脚本的程序，用于设置各种系统服务。\n\n## 内核模块\n\n内核软件被分为一组相关函数，称为 `modules`。某些模块是操作系统小型通用核心的一部分。某些模块提供特定于平台的操作，而其他模块则是设备驱动程序。这种架构允许根据所需的功能包含或排除内核部分，或者允许在不替换整个内核的情况下更新内核部分。设备驱动程序是动态内核模块，在访问设备时加载。\n\
  \n内核模块存储在三个目录下——两个位于根文件系统下，一个位于 `/usr` 文件系统：\n\n* `/platform/sparc/kernel` 用于 SPARC\
  \ 平台，或 `/platform/i86pc/kernel` 用于 x86 平台——特定于平台的模块。\n* `/kernel`—启动所需的通用内核模块。\n\
  * `/usr/kernel`—具有特定指令集的平台使用的通用内核模块。\n\n`/etc/system` 文件用于确定加载哪些内核模块并定义各种内核参数。该文件的格式为一个或多个关键字后跟一个或多个参数。支持的关键字包括：\n\
  \n* `exclude—` 防止模块加载。\n* `forceload—` 强制加载模块。\n* `moddir—` 更改通用内核模块目录。\n* `rootdev—`\
  \ 设置根设备的物理路径名。\n* `rootfs—` 定义根文件系统的类型。\n* `set—` 设置内核或模块变量。\n\n## init 程序\n\n启动过程的最后一个阶段是\
  \ `init` 程序。`init` 程序用于控制系统进程和服务。它的主要目的是根据系统的当前状态创建或停止进程。系统状态被称为 `system run level`（系统运行级别）。根据系统在处于特定运行级别下应支持的活动类型，定义了几个运行级别，例如维护、单用户、多用户等。关于在特定运行级别下应该运行哪些进程和服务的信息存储在\
  \ `/etc/inittab` 文件中。\n\n默认运行级别通过 `/etc/inittab` 中的 `initdefault` 条目定义。以下示例显示将运行级别\
  \ 3 设置为默认运行级别：\n\n```\nis:3:initdefault:\n```\n\n每个运行级别（4 除外）在 `/etc/inittab` 文件中都有一个条目，标识要执行的\
  \ `rc` 程序。此外，每个运行级别都有一个关联的目录，该目录包含 `rc` 脚本，当该运行级别变为当前运行级别时，`rc` 程序应执行这些脚本以启动或停止进程和服务。\n\
  \n`init` 程序还会根据 `/etc/default/init` 设置默认环境变量。这些包括本地变量和基于位置系统参数（例如时区）。\n\n## 系统运行级别\n\
  \n为了给系统管理员提供方便关闭或重启系统以及控制系统服务和资源的方法，定义了八个系统运行级别（也称为 `init states`）并分配了特定的功能。表 4.5\
  \ 描述了这八个运行级别。\n\n### 表 4.5：八个系统运行级别。\n\n| 运行级别 | init 状态 | 功能 |\n| :--- | :--- |\
  \ :--- |\n| 0 | 关机 (Power Down) | 系统正在关闭。所有用户被强制登出系统。所有操作系统服务都按顺序停止。当此过程完成后，系统处于固件模式。对于\
  \ SPARC 平台，固件模式是 `ok` OpenBoot 提示符。关闭系统和外围设备的电源是安全的。 |\n| 1 | 单用户 (Single User)\
  \ | 系统准备进行维护。任何用户都已登出系统。除了最基本的操作系统服务外，任何服务都按顺序停止。任何挂载的文件系统保持挂载状态。启动一个具有超级用户权限的命令行界面并与系统控制台关联，以便系统管理员可以在不受用户或应用程序干扰的情况下执行维护工作（如系统备份）。\
  \ |\n| 1 | 管理 (Administrative) | 任何已登录的用户不受影响。多个用户可以登录并使用可用的系统资源。除了最基本的操作系统服务外，所有服务都按顺序停止。任何挂载的文件系统保持挂载状态。启动一个具有超级用户权限的命令行界面并与系统控制台关联，以便系统管理员可以在允许用户访问的情况下进行维护。\
  \ |\n| 2 | 多用户 (Multiuser) | 系统配置为正常运行。多个用户可以登录并使用系统资源。除了网络文件系统 (NFS) 服务器外，所有服务都按顺序停止。任何挂载的文件系统保持挂载状态。\
  \ |\n| 3 | 带 NFS 的多用户 (Multiuser with NFS) | 系统配置为正常运行。这通常是默认系统状态。多个用户可以访问并使用系统资源。所有服务（包括资源共享\
  \ NFS 服务器）都已。任何挂载的文件系统保持挂载状态。 |\n| 4 | 备用 (Alternative) | 目前此状态未使用且不可用。 |\n| 5 |\
  \ 关机 (Power Down) | 系统正在关闭。所有用户都已登出系统。所有操作系统服务都按顺序停止。当此过程完成后，关闭系统和外围设备的电源是安全的。如果系统硬件支持，电源会自动关闭。\
  \ |\n| 6 | 重启 (Reboot) | 系统将关闭（运行级别 0），然后重启并恢复到默认运行级别（由 `/etc/inittab` 文件定义，通常为\
  \ 3）。 |\n\n**考试警报** Solaris 有八个运行级别，其中七个被使用。尽管没有为运行级别 4 定义功能，但它被认为是有效的运行级别。还要注意\
  \ NFS 客户端在运行级别 2 启动，而 NFS 服务器在运行级别 3 启动。\n\n## 更改系统运行级别\n\n有时你需要更改系统运行级别——例如在关闭系统添加或删除硬件、执行备份、准备预期停电或准备将系统物理移动到另一个位置时。表\
  \ 4.6 列出了你使用的命令。\n\n\n\n\n从命令行更改系统的运行级别（run level）。\n\n### 表 4.6：用于更改系统运行级别的命令。\n\
  \n| 命令 | 路径 | 运行级别(s) | 描述 |\n| :--- | :--- | :--- | :--- |\n| `halt` | `/usr/sbin`\
  \ | 0 | 停止处理器 |\n| `init` | `/sbin` | 0,1,2,3,4,5,6,s | 进程控制初始化 |\n| `poweroff`\
  \ | `/usr/sbin` | 5 | 停止处理器并关闭系统（如果可能） |\n| `reboot` | `/usr/sbin` | 6 | 重启系统 |\n\
  | `shutdown` | `/etc` | 0,1,5,6,s | 用于兼容性（指向 `/usr/sbin/shutdown` 的符号链接） |\n| `shutdown`\
  \ | `/usr/sbin` | 0,1,5,6,s | 更改系统的运行级别 |\n| `telinit` | `/etc` | 0,1,2,3,4,5,6,s\
  \ | 用于兼容性（指向 `/usr/sbin/init` 的符号链接） |\n| `uadmin` | `/sbin` | 0,5,6 | 用于管理控制 |\n\
  \n`halt`(1M) 命令通常会将关机信息记录到系统日志中，向系统审计文件写入关机记录，调用 `sync`(1M) 命令将任何挂起的信息写入磁盘，并停止处理器。你可以通过命令行参数防止系统和账户日志记录以及磁盘同步。`halt`\
  \ 命令会切换到运行级别 0，但不会执行与运行级别 0 相关的 rc 脚本，而 `shutdown`(1M) 和 `init`(1M) 命令会。\n\n你可以使用\
  \ `init`(1M) 和 `telinit`(1M) 命令切换到八个运行级别中的任何一个。系统在 `/etc/inittab` 文件中为每个运行级别确定的命令将被执行，而任何不在\
  \ `/etc/inittab` 中的正在运行进程都将收到一个 SIGTERM 信号（或可能是 SIGKILL 信号，见第 7 章）以将其终止。对于每个运行级别，`/etc/inittab`\
  \ 中的条目会运行相应的 rc 脚本来启动和停止进程。\n\n**考试警示** `init` 命令的独特之处在于，它是唯一可以用于切换到任何系统运行级别的命令。虽然表\
  \ 4.6 中列出的所有命令都可以关机/重启系统（运行级别 0, 1, 5, 6, s），但只有 `init` 命令可以将系统从运行级别 s 或 1 引导至级别\
  \ 2 或 3。\n\n`poweroff`(1M) 命令将系统切换到运行级别 5。通常，它会将关机信息记录到系统日志中，向系统审计文件写入关机记录，调用 `sync`(1M)\
  \ 将任何挂起的信息写入磁盘，停止处理器，并在可能的情况下关闭电源。`poweroff` 命令等于 `init 5` 命令。\n\n`reboot`(1M) 命令将系统切换到运行级别\
  \ 6。通常，它会将重启信息记录到系统日志中，向系统审计文件写入关机记录，调用 `sync` 将任何挂起的信息写入磁盘，并启动多用户模式的重启。\n\n**考试警示**\
  \ `reboot` 命令的独特之处在于，它可以使用 `--` 参数向 OpenBoot `boot` 命令传递参数。例如，命令 `reboot -- -rv`\
  \ 将 `-rv` 命令行参数传递给 OpenBoot `boot` 命令；然后它们会被传递给内核。在这种情况下，`r` 导致重新配置（探测所有设备和构建节点），`v`\
  \ 启用详细模式。\n\n`shutdown` 命令（在 `/usr/sbin` 和 `/etc` 目录下均存在）提供了缓冲期和警告消息功能，还会执行相应的 rc\
  \ 脚本。你可以使用 `shutdown` 命令切换到运行级别 0, 1, 5, 6 和 s。\n\n不带任何命令行参数的 `shutdown` 命令将产生一分钟的缓冲期，并在\
  \ 1 分钟、30 秒和现在发出警告消息。`shutdown` 命令将在广播 `shutdown now` 消息并继续运行级别切换之前提示用户确认以继续操作。随后，系统将切换到运行级别\
  \ s。\n\n`uadmin`(1M) 命令提供基本管理功能，例如关机或重启系统。通常，它由各种系统管理程序调用，不供普通使用。\n\n**考试警示** 你可以使用\
  \ `who -r` 命令来确定系统的当前运行级别以及切换到该运行级别的日期。\n\n### 运行控制 (rc) 脚本\n\n如前所述，每个运行级别（4 除外）在\
  \ `/etc/inittab` 文件中都有条目，用于指定要执行的 rc 程序。此外，每个运行级别都有一个关联的目录。该目录包含 rc 脚本，当该运行级别成为当前级别时，由\
  \ rc 程序执行以启动或停止进程和服务。这些 rc 程序和 rc 脚本目录使用基于运行级别的标准命名规范。\n\n对于运行级别 0，rc 程序是 `/etc/rc0`，`/etc/rc0.d`\
  \ 是脚本目录。同样，对于运行级别 1，rc 程序是 `/etc/rc1`，`/etc/rc1.d` 是脚本目录。相同的命名规范也适用于运行级别 2、3 和 s。运行级别\
  \ 5 和 6 没有独立的目录，而是使用 `/etc/rc5.d` 和 `/etc/rc6.d`。\n\n通常，脚本是用于启动和停止服务的 Shell 脚本。一个\
  \ rc 脚本通常包含部分：启动部分和停止部分。正如名称所暗示，启动部分用于启动服务，而停止部分则用于停止服务。\n\n例如，自动执行维护命令的标准 Unix\
  \ 程序是 `cron` 命令。它通常在运行级别 2 启动，在运行级别 0、1、5、6 和 s 停止。要在运行级别 2 启动 `cron`，你可以将 cron\
  \ rc 脚本复制到 `/etc/rc2.d` 并命名为 `S75cron`。脚本开头的 `S` 表示 rc 程序通过调用 `start` 参数在特定级别（在本例中为级别\
  \ 2）启动服务。同样，你可以将相同的 cron rc 脚本链接到 `/etc/rc0.d`、`/etc/rc1.d` 和 `/etc/rcs.d` 目录并命名为\
  \ `K40cron`。脚本开头的 `K` 表示 rc 程序通过调用 `stop` 参数在特定级别停止服务。\n\n注意，cron rc 脚本文件名包含的数字是不同的。这些数字提供了\
  \ rc 程序按照特定顺序启动或停止服务的方法。数字较小的 rc 脚本会在数字较大的之前执行。这种顺序是必要的，因为某些服务需要其他服务的存在才能正常运行。例如，网络应用程序需要网络服务可用。因此，启动应用程序的\
  \ rc 脚本数字应该比启动网络服务的 rc 脚本数字大。此外，服务应该以反序停止。在网络应用程序的情况下，停止应用程序的 rc 脚本数字应该比停止网络服务的\
  \ rc 脚本数字小。\n\n所有 rc 脚本的副本都放在 `/etc/init.d` 目录下。要启动或停止特定服务，系统管理员只需要在一个目录中找到相应的 rc\
  \ 脚本即可。\n\n### 添加 rc 脚本\n\n使用以下步骤为新服务添加 rc 脚本：\n\n\n\n\n1. 编写一个 shell 脚本接受命令行参数\
  \ `start` 和 `stop`，并带有执行这些函数的相应操作。\n2. 以超级用户身份，将新的 `rc`脚本复制到 `/etc/init.d` 目录。\n\
  3. 确定启动服务的运行级别（run level），通常为 2。\n4. 确定控制启动顺序的两位数字（00 到 99）。查看相应 rc 目录中的其他启动 rc\
  \ 脚本，并选择一个未被使用的数字：该数字应大于任何所需的服务，但小于任何将使用新服务的服务。\n5. 将新脚本从 `/etc/init.d` 目录复制或链接到相应的\
  \ rc 目录，命名为以 `S` 开头，后跟所选的两位数字，然后是服务名称。\n6. 确定服务应该停止的运行级别（通常为 0、1 和 5），这意味着该脚本需要链接到一个或多个\
  \ rc 目录。\n7. 确定控制停止顺序的两位数字（00 到 99）。查看相应 rc 目录中的其他停止 rc 脚本，并选择一个未被使用的数字：该数字应小于任何所需的服务，但大于任何使用该服务的服务。\n\
  8. 将新脚本从 `/etc/init.d` 目录复制或链接到相应的 rc 目录，命名为以 `K` 开头，后跟所选的两位数字，然后是服务名称。\n\n### 练习题\n\
  \n### 第 1 题\nSun Microsystems 目前支持哪些 OpenBoot 版本？[选择所有适用项]\na. 1.x\nb. 2.x\nc. 3.x\n\
  d. 4.x\n\n答案 b 和 c 是正确的。Sun Microsystems 目前支持 OpenBoot 2.x 和 3.x 版本。1.x 版本已不再支持。因此，答案\
  \ a 是错误的。4.x 版本并不存在。因此，答案 d 是错误的。\n\n### 第 2 题\n可以使用哪种 OpenBoot 命令来查看系统配置信息？\na.\
  \ `env`\nb. `display`\nc. `banner`\nd. `list`\ne. `show`\n\n答案 c 是正确的。你可以使用 `banner`\
  \ 命令查看系统配置信息。Solaris 8 的 `env` 命令列出当前环境中的 变量。因此，答案 a 是错误的。答案 b、d 和 e 中的命令不存在，尽管存在一个\
  \ `show-dev` OpenBoot 命令。\n\n### 第 3 题\n以下哪些 OpenBoot 命令用于测试硬件？[选择所有适用项]\na. `probe-scsi`\n\
  b. `test floppy`\nc. `test net`\nd. `watch-clock`\ne. `test memory`\n\n答案 a、b、c\
  \ 和 d 是正确的。`probe-scsi`、`test floppy`、`test net` 和 `watch-clock` 命令分别测试 SCSI 控制器、软磁盘驱动器、网络接口和系统时钟。测试内存的正确命令是\
  \ `test /memory`（注意 `memory` 前面有 `/`）。因此，答案 e 是错误的。\n\n### 第 4 题\n说明用于删除非易失性设备别名的\
  \ OpenBoot 命令。\n正确答案是 `nvunalias` 或 `set-defaults`。\n\n### 第 5 题\n使用哪种紧急键盘命令来中止启动过程？\n\
  a. stop\nb. stop+a\nc. stop+b\nd. stop+s\ne. stop+!\n\n答案 b 是正确的。`stop+a` 紧急键盘命令中止启动过程。`stop`\
  \ 键盘命令跳过 POST（上电自检）。因此，答案 a 是错误的。答案 c、d 和 e 中的键盘命令不存在。\n\n### 第 6 题\n提供从 CD-ROM\
  \ 启动系统的 OpenBoot 命令。\n正确答案是 `boot cdrom`。\n\n### 第 7 题\n以下哪个 Solaris 启动过程的最后阶段？\n\
  a. init\nb. Boot PROM\nc. BIOS\nd. Kernel Initialization\ne. Boot Programs\n\n答案\
  \ a 是正确的。`init` 阶段是 Solaris 启动过程的最后。所有答案都是 SPARC 或 Intel x86 启动过程阶段。Boot PROM 和\
  \ BIOS 阶段测试硬件，Boot Programs 阶段定位并加载启动程序，然后 Kernel Initialization 阶段加载内核。只有之后才能进入\
  \ `init` 阶段初始化操作系统服务。因此，答案 b、c、d 和 e 是错误的。\n\n### 第 8 题\n给出决定键盘中止序列启用或禁用的文件完整路径名。\n\
  正确答案是 `/etc/default/kbd`。\n\n### 第 9 题\n以下哪些默认目录用于存储内核模块？[选择所有适用项]\na. `/kernel`\n\
  b. `/usr/kernel`\nc. `/var/kernel`\nd. `/etc/system`\ne. `/etc/kernel`\n\n答案 a 和\
  \ b 是正确的。`/kernel` 和 `/usr/kernel` 默认目录用于存储内核模块。答案 c 和 e 中的目录不存在。`/etc/system` 目录用于配置系统内核。因此，答案\
  \ d 是错误的。\n\n### 第 10 题\n以下哪些命令可以切换到系统运行级别 2 或 3？\na. `init`\nb. `reboot`\nc. `shutdown`\n\
  d. `poweroff`\ne. `uadmin`\nf. `halt`\n\n答案 a 是正确的。可以使用 `init` 命令切换到系统运行级别 2 或 3。`reboot`、`shutdown`、`poweroff`\
  \ 和 `halt` 命令不是为此。`uadmin` 命令不可直接使用。\n\n### 第 11 题\nSolaris 8 中有多少个运行级别？\na. 6\n\
  b. 7\nc. 8\nd. 9\n\n答案 c 是正确的。Solaris 8 有八个级别。答案 a 和 d 不可行。你可能认为 Solaris 8 有 7 个级别，因为运行级别\
  \ 4 没有被使用，但运行级别 4 被计算在内。因此，答案 b 是错误的。\n\n### 第 12 题\n说明用于列出或创建设备别名的 OpenBoot 命令。\n\
  正确答案是 `devalias`。\n\n\n\n\n\n用户账户。本章的文件权限部分讨论了如何使用基本和扩展访问控制来控制对文件中数据的访问。大多数 `Security`（安全）测试目标在本章涵盖。\n\
  \n## 系统安全\n\nUnix 系统安全基于对文件（程序和数据）的访问控制。你通过定义用户账户和组账户并授予这些账户不同级别的文件访问权限来控制访问。用户账户受密码保护。\n\
  \n管理账户拥有访问系统数据和工具的权限，允许它们执行系统维护。这些账户包括 `root`、`sys`、`bin` 和 `adm`。\n\n多个账户管理文件用于存储与用户和组账户相关的信息，例如用户名和密码。\n\
  \n## 超级用户（Root）账户\n\n`root` 或或超级用户账户是一个特殊的管理账户，它提供了对数据和服务的终极访问权限，因为它可以覆盖系统上的任何文件权限。为了实施良好的系统安全，你必须限制对超级用户账户的访问并尽可能地对其进行监控。Solaris\
  \ 8 提供了几种限制和监控超级用户账户的方法，将在后续章节中讨论。\n\n### 限制和监控超级用户账户\n\n你可以限制 `root` 账户使其无法远程登录系统；而是必须从系统控制台登录。这种限制可以通过\
  \ `/etc/default/login` 文件中的以下条目来实现：\n\n```\nCONSOLE=/dev/console\n```\n\n默认情况下，`root`\
  \ 账户是被限制的。要禁用此功能，请编辑 `/etc/default/login` 文件，并在条目开头加上 shell 注释字符（`#`）。\n\n将 `root`\
  \ 登录限制在控制台上将强制任何远程访问超级用户账户的人必须使用普通系统账户登录，然后使用 `su` 命令变成超级用户。你可以通过多种方式监控和记录 `su`\
  \ 命令的使用。`/etc/default/su` 文件控制这种监控和记录。\n\n若要在系统控制台上显示 `su` 命令的使用情况，请向 `/etc/default/su`\
  \ 文件中添加以下条目：\n\n```\nCONSOLE=/dev/console\n```\n\n使用 `su` 命令的失败和成功尝试都会显示在控制台上。默认情况下，控制台上不会显示\
  \ `su` 命令的使用。要启用此功能，请编辑 `/etc/default/su` 文件并移除条目开头的 shell 注释字符（`#`）。注意，该条目与 `/etc/default/login`\
  \ 文件中限制 root 登录到系统控制台的条目相同。\n\n以下示例显示了两次使用 `su` 命令时在控制台上显示的消息。第一个显示了从登录用户 `dla`\
  \ 尝试在名为 `solaris8` 的系统中变为 root 失败。第二个显示了成功成为 root。以日期开头的消息无论 `/etc/default/su` 文件中的\
  \ `CONSOLE` 条目如何都会显示。以 `SU` 开头的消息之所以显示是因为 `/etc/default/su` 文件中的 `CONSOLE` 条目未注释：\n\
  \n```\nMar 29 02:46:01 solaris8 su: 'su root' failed for dla\non /dev/pts/5\n\n\
  SU 03/29 02:49 + pts/5 dla-root\nMar 29 02:49:16 solaris8 su: 'su root' succeeded\
  \ for dla\non /dev/pts/5\n```\n\n你可以通过向 `/etc/default/su` 文件中添加以下条目，将 `su` 命令的使用记录到专门用于\
  \ `su` 日志的文件（尽管此处显示的是默认值，但你可以使用任何文件作为 `sulog`）：\n\n```\nSULOG=/var/adm/sulog\n```\n\
  \n使用 `su` 命令的失败和成功尝试都会被记录。默认情况下，`su` 命令的使用记录在 `sulog` 中。要禁用此功能，请编辑 `/etc/default/su`\
  \ 文件并在条目开头添加 shell 注释字符（`#`）。\n\n以下行显示了 `/var/adm/sulog` 文件的内容：\n\n```\nSU 03/18\
  \ 01:46 + console root-daemon\nSU 03/22 00:58 + pts/5 dla-root\nSU 03/29 02:42 +\
  \ pts/5 dla-guest\nSU 03/29 02:43 + pts/5 dla-root\nSU 03/29 02:46 - pts/5 dla-root\n\
  SU 03/29 02:49 + pts/5 dla-root\n```\n\n日期后面的加号（`+`）或减号（`-`）分别表示成功或失败。下一个字段指示输入命令的位置，最后一个字段列出了源和目的用户账户。\n\
  \n你还可以使用系统日志（`syslog`）设施记录 `su` 命令的使用。要启用它，请向 `/etc/default/su` 文件添加以下条目：\n\n```\n\
  SYSLOG=YES\n```\n\n必须正确配置 `syslog` 设施以捕获并记录这些消息。`syslog` 设施是第二部分（考试 310-012）的目标，将在第\
  \ 14 章涵盖。默认情况下，`su` 命令的使用记录在 `syslog` 设施中。要禁用此功能，请编辑 `/etc/default/su` 文件并在 `SYSLOG`\
  \ 条目开头添加 shell 注释字符（`#`）。\n\n## sysadmin 组\n\n属于 sysadmin 组的用户账户可以在不损害安全的情况下执行某些系统活动（添加用户、打印机等）。要启用此功能，将\
  \ uid 设置为 `root` 并指定属于 `sysadmin` 组。\n\n## 用户和组管理文件\n\n三个管理文件用于存储与用户和组账户相关的信息，例如用户名和密码：\n\
  \n* `/etc/passwd`\n* `/etc/shadow`\n* `/etc/group`\n\n`/etc/passwd` 文件是一个定义用户账户的\
  \ ASCII 文件。每行代表一个用户账户，由冒号分隔的字段组成。\n\n| 字段 | 目的 |\n| :--- | :--- |\n| 用户名 | 分配给用户账户的唯一名称。\
  \ |\n| 密码 | 在之前的 Unix 版本中，密码字段包含加密密码。出于安全考虑，密码已移动到 `/etc/shadow` 文件。此字段通常放置 `x`\
  \ 表示密码在 shadow 文件中。 |\n| UID | 分配给用户账户的唯一数字标识。用户账户创建的进程或文件将由此 UID 所有。系统管理员账户 `root`\
  \ 分配的 UID 为 0。系统维护账户的 UID 小于 100，而用户账户从 101 开始。 |\n| GID | 用户组的数字标识。组定义在 `/etc/group`\
  \ 文件中。 |\n| 注释 | 关于所有者的信息，如真实姓名、电话、邮寄地址等。此字段中的 `&` 被解释为用户名字段的内容。 |\n| Home | 用户登录后初始目录的完整路径。\
  \ |\n| 登录 shell | 作为命令解释器的初始 shell 的完整路径。如果此字段为空，默认值为 `/usr/bin/sh`。 |\n\n以下列表显示了\
  \ Solaris 8 `/etc/passwd` 文件的默认内容：\n\n```\nroot:x:0:1:Super-User:/:sbin/sh\ndaemon:x:1:1::/:\n\
  bin:x:2:2::/usr/bin\nsys:x:3:3::/:\nadm:x:4:4:Admin:/var/adm\nlp:x:71:8:Line Printer\
  \ Admin:/usr/spool/lp\nuucp:x:5:5:uucp Admin:/usr/lib/uucp\nnuucp:x:9:9:uucp Admin:/var/spool/uucublic:/usr/lib/uucp/uucico\n\
  listen:x:37:4:Network Admin:/usr/net/nls\nnobody:x:60001:60001:Nobody:/:\nnoaccess:x:60002:60002:No\
  \ Access User:/:\nnobody4:x:65534:65534:SunOS 4.x Nobody:/:\n```\n\n\n\n\n\n`/etc/shadow`\
  \ 文件是一个 ASCII 文件，用于存储本地用户账户的密码以及任何密码限制或老化设置。为了保护密码，该文件的权限仅限于超级用户。每行代表一个用户账户的密码，由九个用冒号分隔的字段组成。表\
  \ 5.2 列出了 `/etc/shadow` 文件中条目的字段。\n\n### 表 5.2：`/etc/shadow` 字段\n\n| 字段 | 用途 |\n\
  | :--- | :--- |\n| 用户账户 | 将 `/etc/shadow` 条目与 `/etc/passwd` 文件中定义的用户账户关联。 |\n| 密码\
  \ | 关联用户账户的 13 位加密密码。如果该字段包含 `NP`，则该账户仅用于拥有进程或文件（`setuid`），不能用于登录系统。如果字段包含 `LK`，则账户被锁定，无法访问系统。如果字段为空，则没有密码，用户在第一次使用账户时被强制输入密码。\
  \ |\n| 最后更改 | 1970 年 1 月 1 日与最后一次修改密码之间的天数。 |\n| 最小 | 用户更改密码前所需的最少天数。 |\n| 最大 |\
  \ 密码有效的最大天数。 |\n| 警告 | 密码过期前警告用户的天数。 |\n| 闲 | 账户在必须更改密码前可以处于活动状态的天数。 |\n| 过期 | 1970\
  \ 年 1 月 1 日与账户过期日期之间的天数。 |\n| 标记 | 留供以后使用。 |\n\n以下行显示了 Solaris 8 `/etc/shadow` 文件中的访客条目，它使用了除了标记字段外的所有字段：\n\
  \n```\nguest:on7GbE18yYAek:10688:5:30:5:20:10844:\n```\n\n### `/etc/group`\n`/etc/group`\
  \ 文件是一个 ASCII 文件，用于存储本地系统上组的信息。每行代表一个组，由四个用冒号分隔的字段组成。表 5.3 列出了 `/etc/group` 文件中条目的字段。\n\
  \n### 表 5.3：`/etc/group` 字段\n\n| 字段 | 用途 |\n| :--- | :--- |\n| 组名 | 组的唯一名称。 |\n\
  | 密码 | 与组关联的密码。如果存在密码，`newgrp`(1) 命令会提示用户输入。 |\n| GID | 唯一的数字组标识符。 |\n| 用户 | 属于该组的用户账户逗号分隔列表。\
  \ |\n\n以下列表显示了 Solaris 8 `/etc/group` 文件的部分默认内容：\n\n```\nroot::0:root\nother::1:\n\
  bin::2:root,bin,daemon\nsys::3:root,bin,sys,adm\nadm::4:root,adm,daemon\nuucp::5:root,uucp\n\
  mail::6:root\n```\n\n## 文件权限与所有权\n文件权限决定了对文件和目录可以执行的操作，以及谁可以执行这些操作。Solis 8 提供了两种文件权限：提供基本安全性的标准权限，以及扩展标准权限的扩展权限。\n\
  \n### 标准文件权限\n文件和目录可以具有读、写和执行权限。你可以为三类系统账户分配权限：拥有文件的用户账户、具有组权限的组账户以及其他人。这些被称为 `user`、`group`\
  \ 和 `other` 权限。用户、组和其他人的读、写、执行权限可以相互独立设置。\n\n你使用两种表示法来指定文件权限（也称为 `file access mode`）：绝对模式和符号模式。`Absolute\
  \ mode`（也称为 `octal mode`）是分配给每个账户类权限的数值。表 5.4 列出了绝对模式。\n\n### 表 5.4：绝对文件权限模式\n\n\
  | 绝对模式 | 描述 |\n| :--- | :--- |\n| 001 | 其他人执行 |\n| 002 | 其他人写 |\n| 004 | 其他人读 |\n\
  | 010 | 组执行 |\n| 020 | 组写 |\n| 040 | 组读 |\n| 100 | 用户执行 |\n| 200 | 用户写 |\n| 400\
  \ | 用户读 |\n\n文件的访问模式通过相加这些绝对模式（用户权限 + 组权限 + 其他权限）决定。例如，一个具有用户读 (400) 和用户写 (200)\
  \ 权限但对组或其他人没有其他权限的文件，其访问模式为 `400 + 200`，即 `600`。在该文件上加上组读 (040) 和组写 (020)，得到的访问模式为\
  \ `600 + 060`，即 `660`。加上其他人读 (004) 和其他人写 (002) 得到 `666`。加上用户执行 (100) 得到的文件访问模式为\
  \ `766`。\n\n另一种表示法是符号模式。使用这种模式，读访问由字母 `r` 表示，写访问由字母 `w` 表示，执行由字母 `x` 表示。字母 `u`、`g`\
  \ 和 `o` 分别代表用户、组和其他人的权限。符号模式支持添加权限 (`+`)、移除权限 (`-`) 和仅设置指定的权限 (`=`)。\n\n使用 `u+x`\
  \ 为用户添加执行权限，`g-w` 从组移除写权限，`o=r` 为其他人仅设置读访问（即它移除了任何其他权限）。\n\n`ls`(1) 命令使用与符号模式类似的方法来表示文件访问模式。以下列表显示了\
  \ `ls` 命令的输出：\n\n```bash\n# ls -l\ntotal 2\n-rw-rw-rw- 1 sarah other 384 Jan 24\
  \ 11:53 file1\n-rwxrw-rw- 1 sarah other 1237 Jan 24 11:53 file2\n-rw-r--r-- 1 sarah\
  \ other 23678 Jan 24 11:53 file3\n#\n```\n\n`ls` 命令列出三组 `rwx` 权限：分别用于用户、组和其他人。在缺少权限的情况下，会显示连字符\
  \ (`-`)。在之前的列表中，名为 `file1` 的文件用户、组和其他人都具有读/写权限（绝对模式为 666）。名为 `file2` 的文件用户具有读/写/执行权限，组和其他人具有读/写权限（绝对模式为\
  \ 766）。名为 `file3` 的文件用户具有读/写权限，组和其他具有读权限（绝对模式为 644）。使用 `ls` 命令列出文件权限将在后文中讨论。\n\n\
  ### 默认权限\n当创建文件时，会为其分配一组默认权限。默认权限使用 `umask`(1) 命令定义。`umask` 命令设置一个权限掩码，该掩码不包含在文件访问模式。例如，为了赋予所有者权限并移除组和其他人的写权限，`umask`\
  \ 值为 `022`。这意味着，用访问模式 666 创建的文件将减去 `umask` 的 022 值。你应该将 `umask` 命令添加到用户的登录初始化文件内容，以提供一致的权限掩码。\n\
  \n`umask` 为 `022` 会移除新创建目录和文件的组和其他人的写权限。在之前的示例中，`file1` 以默认模式 666 创建。减去 022 的 `umask`\
  \ 得到 644，即 `rw-r--r--`。目录 `dir1` 以默认模式 777 创建。减去 022 的 `umask` 得到 755，即 `rwxr-xr-x`。\n\
  \n以下列表显示了 `umask` 命令对创建的文件和目录的影响：\n\n```bash\n### umask 022\n# >file1\n# mkdir dir1\n\
  # ls -l\ntotal 2\ndrwxr-xr-x 2 root other 512 Mar 30 02:28 dir1\n-rw-r--r-- 1 root\
  \ other 0 Mar 30 02:28 file1\n```\n\n考试警示：记住目录创建时*带有*执行权限 (777)，而文件创建时*并不带有*执行权限\
  \ (666)。包含执行权限（值为 1, 3, 5 或 7）的 umask 将只会影响目录。\n\n以下列表显示了使用 `umask` 命令修改默认 umask：\n\
  \n```bash\n# umask 111\n# >file2\n# mkdir dir2\n# ls -l\ntotal 2\ndrw-rw-rw 2 root\
  \ other 512 Mar 30 02:29 dir2\n-rw-rw-rw- 1 root other 0 Mar 30 02:29 file2\n```\n\
  \n```bash\n### umask 027\n# >file3\n# mkdir dir3\n# ls -l\ntotal 2\ndrwxr-x-- 2\
  \ root other 512 Mar 30 02:48 dir3\n-rw-r---- 1 root other 0 Mar 30 02:48 file3\n\
  ```\n\n\n\n\n\n你可以使用 `chmod`(1) 命令修改现有文件和目录的访问模式。\n\n`chmod` 命令可以使用绝对模式（absolute\
  \ mode）或符号模式（symbolic mode）。\n\n绝对模式非常直观，如下列表所示：\n\n```\n# ls -l file1\n-rwxrwxrw-\
  \ 1 dla other 636 Jan 24 12:39 file1\n# chmod 645 file1\n# ls -l file1\n-rw-r--r-x\
  \ 1 dla other 636 Jan 24 12:39 file1\n```\n\n当你使用符号模式时，使用字母 `u`、`g` 和 `o` 来定义系统账户类别（用户、组或其他其他）。使用加号\
  \ `+` 字符添加权限，而使用减号 `-` 字符移除权限。要指定多个更改，请用逗号隔开。以下列表显示了使用符号模式的 `chmod` 命令：\n\n```bash\n\
  # ls -l file1\n-rwxrwxrw- 1 dla other 636 Jan 24 12:40 file1\n# chmod u-x,g-w,g-x,o-w,o+x\
  \ file1\n# ls –l file1\n-rw-r---r-x 1 dla other 636 Jan 24 12:40 file1\n```\n\n\
  ### 特殊权限\n\n文件和目录上可以设置若干特殊权限。它们如下：\n\n- **设置用户 ID (setuid)**——在执行时将有效 UID 设置为所有者\n\
  - **设置组 ID (setgid)**——在执行时将有效 GID 设置为所属组\n- **强制锁 (Mandatory locking)**——在程序打开文件时防止其读取或写入该文件\n\
  - **粘滞位 (Sticky bit)**——仅允许所有者删除特定目录下的文件或目录\n\n`setuid` 和 `setgid` 权限会影响安全性，并允许用户账户或组账户在程序执行期间临时变为另一个用户账户或组账户。你可以使用\
  \ `chmod` 命令控制这些权限，就像控制读、写和执行文件权限一样。\n\n当配合 `chmod` 命令时，`setuid` 权限的绝对模式为 4000，符号模式为\
  \ `s`。\n\n**考试警报**：必须设置用户执行权限 `setuid` 才能生效。在 `ls` 命令的输出中，用户账户执行权限字段显示为 `s`。如果对没有执行权限的文件添加了\
  \ `setuid`，则处于一个未定义状态。该状态在 `ls` 命令的用户执行权限字段中显示为 `S`。\n\n以下列表显示了使用绝对模式的 `chmod` 命令为文件添加\
  \ `setuid` 权限，然后使用符号模式从文件中移除 `setuid` 权限：\n\n```bash\n# ls -l file1\n-rwxr--r--\
  \ 1 dla other 636 Jan 24 12:41 file1\n# chmod 4744 file1\n# ls -l file1\n-rwsr--r--\
  \ 1 dla other 636 Jan 24 12:41 file1\n# chmod u-s file1\n# ls -l file1\n-rwxr--r--\
  \ 1 dla other 636 Jan 24 12:41 file1\n```\n\n当配合 `chmod` 命令时，`setgid` 权限的绝对模式为 2000，符号模式为\
  \ `s`。\n\n**考试警报**：必须设置组执行权限 `setgid` 才能生效。在 `ls` 命令的输出中，组账户执行权限字段显示为 `s`。如果对没有组执行权限的文件添加了\
  \ `setgid`，则该文件将启用强制锁。这种锁在 `ls` 命令的组执行权限字段中显示为 `l`。\n\n以下列表显示了使用 `chmod` 命令为文件添加和移除\
  \ `setgid` 权限。注意第三个 `chmod` 示例，如果对没有组执行权限的文件添加了 `setgid` (`g+s`)，则启用的是强制锁而非 `setgid`：\n\
  \n```bash\n# ls -l file1\n-rwxr-xr-- 1 dla other 636 Jan 24 12:42 file1\n# chmod\
  \ g+s file1\n# ls -l list\n-rwxr-sr-- 1 dla other 636 Jan 24 12:42 file1\n# chmod\
  \ 764 file1\n# ls -l\n-rwxrw-r-- 1 dla other 636 Jan 24 12:42 file1\n# chmod g+s\
  \ file1\n# ls -l\n-rwxrwlr-- 1 dla other 636 Jan 24 12:42 file1\n```\n\n另一种特殊文件权限是粘滞位。最初，它被用于标记执行后应保留在内存中的程序。对于频繁使用的程序设置粘滞位，通过使用内存中留的镜像而不是从磁盘重新加载，可以节省时间和\
  \ CPU 周期。\n\n当在允许所有人写入权限的目录上设置粘滞位时，只有创建该目录下的文件和子目录的用户账户才能删除这些文件和子目录。这种限制对于 `/tmp`\
  \ 目录特别有用，因为任何用户账户都可以访问它。\n\n当配合 `chmod` 命令时，粘滞位权限的绝对模式为 1000，符号模式为 `t`。在 `ls` 命令的输出中，粘滞位权限在执行权限字段显示为\
  \ `t`。以下列表显示了使用 `chmod` 命令移除并添加粘滞位：\n\n```bash\n# ls -l file1\n-rwxrwxrw- 1 dla\
  \ other 636 Jan 24 12:39 file1\n# chmod u-t file1\n# ls -l file1\n-rwxrwxrw- 1 dla\
  \ other 636 Jan 24 12:39 file1\n# chmod 1777 file1\n# ls -l file1\n-rwxrwxrwt 1\
  \ dla other 636 Jan 24 12:39 file1\n```## 扩展文件权限：访问控制列表\n\nSolaris 通过添加访问控制列表（ACL）扩展了标准的\
  \ Unix 权限。ACL 允许你为特定的用户和组添加权限。目录的 ACL 包含了适用于该目录下创建的文件和子目录的默认项。默认权限可以为标准用户、组和其他特定的用户或组定义。\n\
  \n使用两个命令管理 ACL：`setfacl` 命令设置 ACL，`getfacl` 命令显示 ACL。\n\n**考试警报**：使用 `setfacl` 命令对文件和目录添加、修改和删除\
  \ ACL 是一项规定的测试能力。\n\n### 使用 setfacl 设置 ACL\n\n你使用 `setfacl`(1) 命令设置和修改 ACL。它支持三个命令行参数：\n\
  \n- `-d`: 删除指定的 ACL 项\n- `-m`: 添加/更改指定的 ACL 项\n- `-s`: 用指定的项替换整个 ACL\n\n标准用户和组权限的\
  \ ACL 项使用格式 `entry::permissions` 来指定，其中 `entry` 是关键字 `user` 或 `group`（或单字母缩写 `u`\
  \ 或 `g`），`permissions` 是定义权限所需的 `r`、`w`、`x` 和 `-` 的组合。\n\n标准其他权限和用于最大权限的掩码使用略不同的语法。格式为\
  \ `entry:permissions`，其中 `entry` 是关键字 `other` 或 `mask`（或单字母缩写 `o` 或 `m`），`permissions`\
  \ 是定义权限所需的 `r`、`w`、`x` 和 `-` 的组合。\n\n以下行显示了使用 `setfacl` 命令将用户权限设置为读/写，并将组权限和其他权限设置为只读：\n\
  \n\n\n\n\n# setfacl -s u::rw-,g::r--,o:r-- file1\n\n其他用户和其他组的 ACL 条目使用格式 `entry*:\
  \ *id*: *permissions*` 来指定，其中 `entry` 是关键字 `user` 或 `group`（或单字母缩写 `u` 或 `g`）；`id`\
  \ 是用户名、UID、组名或 GID；`permissions` 是定义权限所需的 `r`、`w`、`x` 和 `-` 的适当组合。\n\n下一行显示了使用 `setfacl`\
  \ 命令为用户账户 `guest` 添加读/写权限，并为组账户 `staff` 添加只读权限：\n\n```bash\nsetfacl -m u:guest:rw-,g:staff:r--\
  \ file1\n```\n\n除了之前描述的所有 ACL 条目外，你还可以为目录定义额外的条目。这些条目指定了在该目录下创建的文件和子目录的默认 ACL 条目。要建立默认值，请使用之前描述格式并在\
  \ `entry` 字段开头添加 `d:`。所有标准的的用户、组和其他默认值以及默认掩码（mask），必须在初始同时定义。\n\n例如，要为目录 `shlog`\
  \ 定义默认 ACL 条目，可以使用以下 `setfacl` 命令：\n\n```bash\nsetfacl -m d:u::rw-,d:g::rw-,d:o:r--,d:m:r--\
  \ shlog\n```\n\n## 使用 getfacl 显示 ACL\n\n要显示文件或目录的 ACL，请使用 `getfacl` 命令。以下列表显示了使用\
  \ `getfacl` 命令显示的 `shlog` 目录 ACL：\n\n```bash\ngetfacl shlog\n\n# file: shlog\n#\
  \ owner: shlog\n# group: staff\nuser::rwx\ngroup::r-x #effective:r-x\nmask:r-x\n\
  other:r-x\ndefault:user::rw-\ndefault:group::rw-\ndefault:mask:r--\ndefault:other:r--\n\
  #\n```\n\n当你使用 `ls` 命令时，具有 ACL 的文件会在文件条目前显示一个“+”符号。\n\n## 修改文件所有权\n\n使用两个命令来控制文件所有权：\n\
  \n- `chown`(1M)—更改文件用户账户所有权\n- `chgrp`(1M)—更改文件组账户所有权\n\n### 修改文件用户账户\n\n`chown`\
  \ 命令用于更改文件或目录的所有者用户账户。你可以指定用户账户名或关联的 UID，以及一个或多个应由指定用户账户拥的文件。以下列表使用 `chown` 命令将多个文件的所有权更改为\
  \ `guest` 用户账户（其 UID 为 1001）。每个 `chown` 命令前后都紧跟着 `ls` 命令，该命令列出了文件的所有权和权限：\n\n```bash\n\
  ls -l\ntotal 18\n-rw-rw-rw- 1 root other 120 Feb 28 07:38 data\n-rw-rw-rw- 1 root\
  \ other 6528 Feb 28 07:38 junk\n-rw-r--r-- 1 root other 636 Feb 28 07:39 list\n\n\
  chown guest junk\n\nls -l\ntotal 18\n-rw-rw-rw- 1 root other 120 Feb 28 07:38 data\n\
  -rw-rw-rw- 1 guest other 6528 Feb 28 07:38 junk\n-rw-r--r-- 1 root other 636 Feb\
  \ 28 07:39 list\n\nchown 1001 data list\n\nls -l\ntotal 18\n-rw-rw-rw- 1 guest other\
  \ 120 Feb 28 07:38 data\n-rw-rw-rw- 1 guest other 6528 Feb 28 07:38 junk\n-rw-r--r--\
  \ 1 guest other 636 Feb 28 07:39 list\n```\n\n`chown` 命令支持递归命令行参数 `-R`。当你用它更改目录的所有者时，该目录下下任何文件或子目录的所有权也会随之更改。\n\
  \n尽管存在单独的更改文件组账户所有权的命令，但你可以在用户账户名或 UID 后跟一个冒号（`:`）以及组账户名或 GID，从而使用 `chown` 命令同时更改所有所有。下面的示例使用\
  \ `chown` 命令同时更改用户账户所有权和组账户所有权：\n\n```bash\nls -l\ntotal 18\n-rw-rw-rw- 1 guest\
  \ other 120 Feb 28 07:38 data\n-rw-rw-rw- 1 guest other 6528 Feb 28 07:38 junk\n\
  -rw-r--r-- 1 guest other 636 Feb 28 07:39 list\n\nchown sys:staff data junk list\n\
  \nls -l\ntotal 18\n-rw-rw-rw- 1 guest other 120 Feb 28 07:38 data\n-rw-rw-rw- 1\
  \ guest other 6528 Feb 28 07:38 junk\n-rw-r--r-- 1 guest other 636 Feb 28 07:39\
  \ list\n```\n\n### 修改文件组\n\n`chgrp` 命令用于更改文件的组所有权。你可以指定组账户名或关联的 GID，以及一个或多个应由指定组拥有的文件。以下示例使用\
  \ `chgrp` 命令将文件的组更改为 `staff` 组：\n\n```bash\nls -l\ntotal 18\n-rw-rw-rw- 1 root other\
  \ 120 Feb 28 07:38 data\n-rw-rw-rw- 1 root other 6528 Feb 28 07:38 junk\n-rw-r--r--\
  \ 1 root other 636 Feb 28 07:39 list\n\nchgrp staff junk\n\nls -l\ntotal 18\n-rw-rw-rw-\
  \ 1 root other 120 Feb 28 07:38 data\n-rw-rw-rw- 1 root staff 6528 Feb 28 07:38\
  \ junk\n-rw-r--r-- 1 root other 636 Feb 28 07:39 list\n```\n\n`chgrp` 命令也支持递归命令行参数\
  \ `-R`。当你用它更改目录的组所有权时，该目录下任何文件或子目录的组所有权也会随之更改。\n\n## 显示权限和所有权\n\n`ls`(1) 命令显示权限和所有权。`ls`\
  \ 命令支持表 5.5 中描述的命令行参数。\n\n表 5.5：ls 命令的命令行参数。\n\n| 参数 | 描述 |\n| :--- | :--- |\n|\
  \ `name` | 要显示信息的目录或文件的名称。要指定多个名称，请用空格分隔并或使用通配符（见第 10 章）。如果一个或多个 *names* 是目录，则列出这些目录的内容。如果没有指定\
  \ *names*，则列出当前目录下的所有目录/文件。 |\n| `-a` | 列出所有目录和文件，包括那些 |\n\n\n\n\n以点开头（这些通常不显示）。\n\
  \n`-A`\n\n列出所有目录和文件，包括以点开头的项（当前目录 `.` 和父目录 `..` 除外）。\n\n`-b`\n\n使用八进制 `*ddd` 记法显示文件/目录名中的不可打印字符。\n\
  \n`-c`\n\n使用最后 i-node 修改的时间进行排序或列出。\n\n`-C`\n\n生成按列排序的多列输出（默认值）。\n\n`-d`\n\n列出目录名，而不是目录内容。\n\
  \n`-f`\n\n将所有 `names` 解释为目录。\n\n`-F`\n\n通过在末尾标记字符来指示文件类型。目录用斜杠（`/`）标记，门 [sic: 可能是*链接*]\
  \ 用大于号（>`）标记，可执行文件用星号（`*`）标记，FIFO 用竖线（`|`）标记，符号链接用和符号（@`）标记，套接字用等号（`=`）标记。\n\n112\n\
  表 5.5：`ls` 命令的命令行参数。\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `-g` | 列出文件权限、ACL 指示、链接数、组、字节大小和最后修改时间戳。与\
  \ `-l` 相同但不列出所有者。 |\n| `-i` | 列出 i-node。 |\n| `-l` | 列出文件权限、ACL 指示、链接数、所有者、组、字节大小和最后修改时间戳。\
  \ |\n| `-L` | 对于符号链接，列出引用的目录/文件而不是链接。 |\n| `-m` | 跨页显示信息，用列分隔。 |\n| `-n` | 列出文件权限、ACL\
  \ 指示、链接数、所有者的 UID、组的 GID、字节大小和最后修改时间戳。与 `-l` 相同但列出 UID 和 GID 而不是所有者和组。 |\n| `-o`\
  \ | 列出文件权限、ACL 指示、链接数、所有者、字节大小和最后修改时间戳。与 `-l` 相同但不列出组。 |\n| `-p` | 在目录末尾标记斜杠（`/`）。\
  \ |\n| `-q` | 目录/文件名中的任何非打印字符使用问号（`?`）。 |\n| `-r` | 反转排序顺序（`zyx`… 而不是 `abc`…，或者从旧到新）。\
  \ |\n| `-R` | 递归列出子目录的内容。 |\n| `-s` | 以块显示大小（包括间接块）。 |\n| `-t` | 按修改时间排序而不是按目录/文件的字母排序。与\
  \ `-u` 结合时按访问时间排序；与 `-c` 结合时按 i-node 修改时间排序。 |\n| `-u` | 使用最后访问时间进行排序和显示。 |\n| `-x`\
  \ | 显示跨页排序的多列而不是按列排序。 |\n| `-1` | 每行显示一个目录/文件。 |\n\n113\n`ls` 命令支持多种命令行参数，用于显示和排序人们可能想要关于目录和文件的几乎所有信息。\n\
  \n**考试警示** 更重要的命令行选项有 `-a`、`-d`、`-F`、`-l`、`-r`、`-R`、`-t` 和 `-1`。务必理解这些命令行参数对 `ls`\
  \ 命令显示信息的影响。\n\n当你使用一种长列表格式（`-g`、`-l`、`-n` 或 `-o`）时，文件权限和额外信息显示在每个目录/文件的前 11 个字符中。表\
  \ 5.6 列出了文件权限字段第一个字符中使用的字符。\n\n表 5.6：`ls` 命令显示文件中权限字段第一个字符使用的字符。\n\n| 字符 | 描述 |\n\
  | :--- | :--- |\n| b | 特殊文件 |\n| c | 字符特殊文件 |\n| d | 目录 |\n| D | 门 |\n| l | 符号链接\
  \ |\n| p | FIFO 或命名管道 |\n| s | 套接字 |\n| - | 普通文件 |\n\n表 5.7 列出了文件权限字段第 2 到 11 位使用的字符。\n\
  \n表 5.7：`ls` 命令显示文件中权限字段第 2 到 10 位的字符。\n\n| 字符 | 描述 |\n| :--- | :--- |\n| l | 强制锁定\
  \ |\n| r | 读取权限 |\n| s | 设置 UID（在第四位时）或设置 GID（在第七位时） |\n| S | 未定义状态 |\n| t | 粘滞位\
  \ |\n| T | 未定义状态 |\n| w | 写权限 |\n| x | 执行权限 |\n| - | 未授予权限 |\n\n114\n第 11 位通常是空格，除非在目录/文件上定义了\
  \ ACL。在这种情况下，第 11 位会出现一个加号（`+`）。以下列表显示了 `ls` 命令输出中权限字段部分的示例：\n\n```\nls -l\ntotal\
  \ 2\ndrwxrwxrwt 2 sarah other 512 Jan 24 13:49 dir1\n-rwsrwxr-x 1 sarah other 1112\
  \ Jan 24 13:53 file1\nlrwxrwsr-x 1 sarah other 1112 Jan 24 13:53 file2\n-rwxlrwx+\
  \ 1 sarah other 1112 Jan 24 13:53 file3\n```\n\n输出中的 `dir1` 显示它是一个目录，权限为 `drwxrwxrwt`。\n\
  \n### 练习题\n\n**问题 1**\n哪个命令用于确定创建文件的默认访问模式？\na. `setfacl`\nb. `chmod`\nc. `umask`\n\
  d. `getfacl`\ne. `ls`\n\n答案是 c。`umask` 决定创建文件的默认访问模式。`setfacl` 和 `chmod` 用于现有文件。因此，a\
  \ 和 b 是错误的。\n\n**问题 2**\n115\n关于执行 `ls -F` 输出，哪些是正确的？[多选]\na. 目录后面跟着斜杠（`/`）。\nb.\
  \ 符号链接后面跟着星号（`*`）。\nc. 目录后面跟着加号（`+`）。\nd. 可执行文件后面跟着星号（`*`）。\ne. 符号链接后面跟着和符号（@`）。\n\
  \n答案 a、d、e 是正确的。在 `ls -F` 的输出中，目录后面跟着斜杠（`/`），可执行文件后面跟着星号（`*`），符号链接后面跟着和符号（@`）。符号链接后面不是星号（`*`）。因此，b\
  \ 是错误的。目录后面不是加号（`+`）。因此，c 是错误的。\n\n**问题 3**\n给出（不带命令行参数）为用户 `george` 的的文件添加读/写权限的命令。\n\
  \n答案是 `setfacl`。\n\n**问题 4**\n要限制 root 直接登录系统控制台，需要修改哪个文件？\na. `/dev/console`\n\
  b. `/etc/passwd`\nc. `/etc/default/login`\nd. `/etc/default/su`\n\n答案是 c。要限制 root\
  \ 登录控制台，必须修改 `/etc/default/login` 文件。`/dev/console` 是控制台的路径。因此，a 是错误的。`/etc/passwd`\
  \ 是密码文件。因此，b 是错误的。`/etc/default/su` 是控制 `su` 命令行为的文件。因此，d 是错误的。\n\n**问题 5**\n用户密码存储在哪里？\n\
  116\n答案是 `/etc/shadow`。\n\n**问题 6**\n文件 `test` 目前的访问模式为 `644`。以下哪些将添加强制锁定？[多选]\n\
  a. `chmod 2664 test`\nb. `chmod 2674 test`\nc. `chmod g+s test`\nd. `chmod g+l test`\n\
  e. `setfacl -s u::rw-,g::rws,o:r-- test`\n\n答案 a、c、d 是正确的。这些答案中的 `chmod` 命令将添加强制锁定。\n\
  \n\n\n锁定。`chmod 2674 test` 命令也添加了组执行权限，这会导致 setgid 权限而不是强制锁定。因此，答案 b 是错误的。`setfacl`\
  \ 命令无法用于添加或删除强制锁定。因此，答案 e 是错误的。\n\n### 问题 7\n文件 `/etc/default/su` 控制 `su` 命令的行为，包括以下哪些内容？[多选]\n\
  \na. 在系统控制台上显示 `su` 用法\nb. 将超级用户的使用限制在系统控制台上\nc. 记录失败的 `su` 尝试\nd. 启用 syslog 记录\
  \ `su` 使用情况\ne. 记录成功的 `su` 尝试\n\n答案 a、c、d 和 e 是正确的。你可以使用 `/etc/default/su` 来控制 `su`\
  \ 行为，包括在系统控制台上显示 `su` 用法、记录失败的 `su` 尝试、通过 syslog 记录 `su` 使用情况以及记录成功的 `su` 尝试。通过编辑\
  \ `/etc/default/login` 文件可以将超级用户的使用限制在系统控制台上。因此，答案 b 是错误的。\n\n### 问题 8\n以下哪项显示启用了\
  \ setuid 权限的文件的访问模式？\n\na. `srwxrwxrwx`\nb. `-rwsrwxrwx`\nc. `-rwxrwsrwx`\nd. `-rwxrwxrws`\n\
  e. `-rwxrwxrwt`\n\n答案 b 是正确的。`-rwsrwxrwx` 文件访问模式显示该文件已启用 setuid。`srwxrwxrwx` 和 `-rwxrwxrws`\
  \ 不是有效的文件访问模式。因此，答案 a 和 d 是错误的。`-rwxrwsrwx` 显示 setgid，`-rwxrwxrwt` 显示粘滞位（sticky\
  \ bit）。因此，答案 c 和 e 是错误的。\n\n### 问题 9\n文件 `test` 目前的访问模式为 `644`。以下哪项将为组所有添加写权限？[多选]\n\
  \na. `chmod test 664`\nb. `chmod 664 test`\nc. `chmod test g+w`\nd. `chmod g+w test`\n\
  e. `setfacl -s u::rw-,g::rw-,o:r-- test`\n\n答案 b、d 和 e 是正确的。这些命令都会为组所有添加写权限。尽管 `setfacl\
  \ -s` 命令替换了现有的 ACL，但原始访问模式会随新添加的组写权限一起恢复。使用 `setfacl -m` 同样有效，但未被列为答案。`chmod test\
  \ 664` 和 `chmod test g+w` 不符合正确的语法。因此，答案 a 和 c 是错误的。\n\n### 问题 10\n将以下每个 `ls` 命令行参数与其功能进行匹配。\n\
  \na. `-R` 1. 显示目录名称而不是目录内容\nb. `-l` 2. 使用 `/`、`>`、`*`、`@` 等字符识别文件类型\nc. `-a` 3.\
  \ 递归列出子目录的内容\nd. `-F` 4. 列出文件权限、所有者、组、大小等\ne. `-d` 5. 列出以点 (.) 开头的目录/文件名\n\n答案 a-3,\
  \ b-4, c-5, d-2 和 e-1 是正确的。`-R` 递归列出目录内容；`-l` 列出权限、所有者等；`-a` 列出以点开头的名称；`-F` 识别文件类型；`-d`\
  \ 列出目录名称。\n\n## 想了解更多吗？\nMulligan, John P., *Solaris 8 Essential Reference* (New\
  \ Riders, Indianapolis, IN, 2001), ISBN 0-7357-1007-4.\n\nSun Microsystems, *System\
  \ Administration Guide, Volume 2*。提供打印版（部件号 805-7229-10）、可在 Web `docs.sun.com` 获取，以及随\
  \ Solaris 8 操作系统提供的在线文档 AnswerBook2。\n\nSun Microsystems, *System Reference Manual,\
  \ Section 1 - User Commands*。提供打印版（部件号 806-0624-10）、可在 Web `docs.sun.com` 获取，以及随\
  \ Solaris 8 操作系统提供的在线文档 AnswerBook2。\n\nSun Microsystems, *System Reference Manual,\
  \ Section 1M - System Administration Commands*。提供打印版（部件号 806-0625-10）、可在 Web `docs.sun.com`\
  \ 获取，以及随 Solaris 8 操作系统提供的在线文档 AnswerBook2。\n\nSun Microsystems, *System Reference\
  \ Manual, Section 4 - File Formats*。提供打印版（部件号 806-0633-10）、可在 Web `docs.sun.com`\
  \ 获取，以及随 Solaris 8 操作系统提供的在线文档 AnswerBook2。\n\n# 第 6 章：用户环境\n\n### 你需要理解的术语：\n-\
  \ 用户和组账户\n- `admintool` 命令\n- 密码老化策略\n- 初始化文件和模板\n- 系统配置文件（System profile）\n\n####\
  \ 你需要掌握的技巧：\n- 创建和删除用户账户\n- 密码管理\n- 创建和删除组账户\n- 自定义初始化文件\n- 识别与监控\n\n## 账户管理\nSolaris\
  \ 8 系统通过用户和组账户控制对数据和资源的访问。用户、组账户以及密码的管理是关键的系统活动。\n\n#### 用户账户\n你可以使用命令行工具或 `admintool`\
  \ 命令添加、修改或删除用户账户。这些命令行工具包括：\n- `useradd`\n- `usermod`\n- `userdel`\n\n#### 使用 admintool\
  \ 命令创建账户\n当启动 `admintool` 命令时，会显示用户窗口，如图 6.1 所示。要显示添加用户窗口，请从下拉菜单中选择 Add。添加用户窗口如图所示，由三个部分组成：用户身份、账户安全和主目录。\n\
  \n用户身份部分提供了添加用户账户必须定义的信息。这些信息都存储在 `/etc/passwd` 文件中，辅助组信息存储在 `/etc/group`。表 6.1\
  \ 列出了用户身份部分的字段。\n\n| 字段 | 描述 |\n| :--- | :--- |\n| 用户名 (User Name) | 唯一的用户账户名，最多包含八个大小写字母或数字。\
  \ |\n| 用户 ID (User ID) 与用户账户关联的 UID。这是一个唯一的数字，通常在 1000 到 60000 之间。系统会自动提供从 1000\
  \ 开始的可用数字。 |\n| 主组 (Primary Group) | 分配给用户的组。默认值为 10 (staff)。指定的组在添加成员之前必须存在。 |\n\
  | 辅助组 (Secondary Groups) | 分配给用户的其他组（用逗号分隔）。指定的组在添加成员之前必须存在。 |\n| 注释 (Comment) |\
  \ 放在 `/etc/passwd` gcos 字段中的任何文本。 |\n| 登录 Shell (Login Shell) |可以选择 Bourne（默认）、C\
  \ 或 Korn shell。要指定另一个 shell，请从下拉菜单中选择 Other 字段中输入 shell 名称。 |\n\n账户安全部分提供了确定如何定义密码以及设置密码老化策略的信息。所有这些信息存储在\
  \ `/etc/shadow` 文件中。表 6.2 列出了账户安全部分的字段。\n\n\n\n\n## 表 6.2: Admintool：添加用户窗口的账户安全字段。\n\
  \n| 字段 | 说明 |\n| :--- | :--- |\n| 密码 | 选项包括：首次登录前清除、账户锁定、无密码——仅限 setuid 或普通密码。 |\n\
  | 最小更改 | 密码更改之间所需的最少天数。 |\n| 最大更改 | 密码有效的最大天数。 |\n| 最大不活跃 | 在更改密码之前，账户可以处于非活动状态的最大天数。\
  \ |\n| 过期日期 | 账户过期的日期。 |\n| 警告 | 密码过期前对用户进行警告的天数。 |\n\n主目录（Home Directory）部分用于定义账户的主目录，并在必要时创建它。该路径存储在\
  \ `/etc/passwd` 文件中。根据所选的登录 shell 类型，会在主目录中创建相应的初始化文件。\n\n### 使用 admintool 命令修改账户\n\
  \n要修改用户账户，如果 `admintool` 命令尚未激活，请启动该命令。从“浏览 (Browse)”下拉菜单中选择“用户 (Users)”来显示用户窗口（见图\
  \ 6.1）。\n\n点击所需的账户条目将其高亮，然后从“编辑 (Edit)”下拉菜单中选择“修改 (Modify)”。\n\n显示“修改用户”窗口。窗口中的字段已填充了所选用户的信息。修改用户窗口与“添加用户”窗口类似（见图\
  \ 6.2）。\n\n根据需要更改字段并点击“应用 (Apply)”以保存更改。\n\n![](img/index-125_1.png)\n\n### 使用 admintool\
  \ 命令删除账户\n\n要删除用户账户，如果 `admintool` 命令尚未激活，请启动该命令。从“浏览 (Browse)”下拉菜单中选择“用户 (Users)”来显示用户窗口（见图\
  \ 6.1）。\n\n点击所需的账户条目将其高亮，然后从“编辑 (Edit)”下拉菜单中选择“删除 (Delete)”。\n\n将显示“警告”窗口，如图 6.3\
  \ 所示。点击“删除 (Delete)”删除用户账户。\n\n图 6.3：Admintool：警告窗口。\n\n**考试警示** 由于使用 `admintool`\
  \ 命令创建、修改和删除用户账户非常简单且直观，考试 310-011 侧重于使用 `useradd`、`usermod` 和 `userdel` 命令来管理用户账户。\n\
  \n### 使用 useradd 命令创建账户\n\n`useradd`(1M) 命令提供了一种添加新用户账户的快速方法。至少，你必须将账户名作为命令行参数。表\
  \ 6.3 列出了 `useradd` 命令支持的命令行参数。\n\n#### 表 6.3：useradd 命令的命令行参数。\n\n| 参数 | same |\n\
  | :--- | :--- |\n| `account` | 指定新用户账户的（必需）。 |\n| `-A authorizations` | 指定一个或多个权限\
  \ *.* |\n| `-b base` | 定义基础目录。如果没有指定主目录 (`-d`)，则将 `account` 名称添加到 `base` 并用作主目录。\
  \ |\n| `-c comment` | 指定一个存放在 `/etc/passwd` 文件注释 (gcos) 字段中的注释。 |\n| `-d directory`\
  \ | 定义账户的主目录。 |\n| `-e date` | 指定账户的过期日期。在指定日期之后，账户将被禁用。 |\n| `-f days` | 指定账户在禁用之前可以处于非活跃状态的最大天数。\
  \ |\n| `-g group` | 定义现有组的 GID 或名称，该组将作为用户账户的主组。 |\n| `-G group` | 定义现有组的 GID 或名称，该组将作为用户账户的辅助组。\
  \ |\n| `-k template_dir` | 指定包含用于用户账户的模板（默认）`.profile` 的目录。 |\n| `-m` | 如果主目录不存在则创建它。主目录由\
  \ `-b` 和 `account` 名称或 `-d` 定义。 |\n| `-o` | 允许你指定已存在的 UID。也就是说，你可以创建一个具有重复 UID 的账户（见\
  \ `-u`）。 |\n| `-p profiles` | 指定一个或多个执行配置。 |\n| `-R roles` | 指定一个或多个用户角色。 |\n| `-s\
  \ shell` | 指定登录 shell；默认是 Bourne shell (`/bin/sh`)。 |\n| `-u uid` | 指定用户账户的 UID。它必须是一个十进制整数。如果没有指定\
  \ `uid`，则分配下一个可用的可用 UID。 |\n\n以下示例使用 `useradd` 命令创建一个用户账户：\n\n```\n# useradd -d\
  \ /export/home/user1 -m -g other -u 1050 user1\n```\n\n此命令创建了 user1 用户账户，分配 UID\
  \ 1050，使其成为 other 组的成员，并创建其主目录 `/export/home/user1`。\n\n为了方便方便，`useradd` 命令还支持 `-D`\
  \ 命令行参数，允许你为权限 (`-A`)、基础目录 (`-b`)、组 (`-g`)、过期日期 (`-e`)、最大不活跃时间 (`-f`)、执行配置 (`-P`)\
  \ 和角色 (`-R`) 分配默认值。后续使用 `useradd` 命令时不指定，将使用这些默认值。\n\n例如：\n\n```\n# useradd -D -b\
  \ /export/home -g\n```\n\n**考试警示** 使用 `useradd` 命令创建的账户没有密码。这些账户是锁定的，直到使用 `passwd`\
  \ 命令为账户定义密码。\n\n由于 `useradd` 命令还支持 `-D` 命令行参数，这允许你为权限 (`-A`)、基础目录 (`-b`)、组 (`-g`)、过期日期\
  \ (`-e`)、最大不活跃时间 (`-f`)、执行配置 (`-P`) 和角色 (`-R`) 分配默认值。后续使用 `useradd` 命令时不指定，将使用这些默认值。\n\
  \n```\n# useradd -D -b /export/home -g other\n```\n\n因为定义了基础和组，user2 账户是 other 组的成员，且主目录为\
  \ `/export/home/user2`。\n\n### 使用 usermod 命令修改账户\n\n`usermod`(1M) 命令用于修改现有用户账户。命令行参数与\
  \ `useradd` 命令相同，但有以下异常：\n\n- 基础目录 (`-b`) 不可用。使用 `-d` 指定新目录。\n- 设置默认 (`-D`) 不可用。\n\
  - 模板目录 (`-k`) 不可用。\n- 如果要修改账户名，请使用 `-l account`。\n\n请记住，如果更改了账户名，主目录不会更改，除非你使用了\
  \ `-d` 和 `-m` 命令行参数。以下示例使用 `usermod` 命令将 user1 更改为 user3：\n\n```\n# ls -l\ntotal\
  \ 22\ndrwx------ 2 root 8192 Jan 13 21:05 lost+found\ndrwxr-x-- 2 user3 other 512\
  \ Mar 31 13:23 user1\ndrwxr-x-- 2 user2 other 512 Mar 31 13:45 user2\n\n# usermod\
  \ -l user3 -d /export/home/user3 -m user1\n```\n\n### 使用 userdel 命令删除账户\n\n`userdel`(1M)\
  \ 命令用于删除用户账户。你将用户账户作为命令行参数。仅支持另一个命令行参数 `-r`——它用于删除主目录：\n\n```\n# userdel -r user3\n\
  ```\n\n## 组账户\n\n你可以使用命令行工具或 `admintool`(1M) 命令添加、修改或删除组账户。使用 `admintool` 命令可以减少或消除可能影响所有组账户的拼写错误或其他错误。\n\
  \n然而，`admintool` 命令需要图形界面，因此使用它比手动使用命令行工具更耗时。这些命令行工具是：\n\n- `groupadd`(1M)\n- `groupmod`(1M)\n\
  - `groupdel`(1M)\n\n`admintool` 命令和命令行工具都将在后续章节中描述。\n\n### 使用 admintool 命令创建组\n\n\
  \n\n\n要创建一个组帐户，如果 `admintool` 命令尚未启动，请启动它。从“浏览”（Browse）下拉菜单中选择“组”（Groups）来显示组窗口。组窗口如图\
  \ 6.4 所示。\n\n127\n\n![](img/index-129_1.png)\n\n![](img/index-129_2.png)\n\n图 6.4：Admintool：组窗口。\n\
  \n然后，从“编辑”（Edit）下拉菜单中选择“添加”（Add）来显示添加组（Add Group）窗口。添加组窗口如图 6.5 所示。\n\n图 6.5：Admintool：添加组窗口。\n\
  \n在“组名”（Group Name）字段中输入唯一的组名称。在“组 ID”（Group ID）字段中使用下一个可用的 GID 数字或输入一个唯一的 GID。在“成员列表”（Members\
  \ List）字段中输入一个或多个用逗号分隔的用户帐户名称。点击确定，新组将显示在组窗口中。\n\n### # 使用 admintool 命令修改组\n\n要修改组帐户，如果\
  \ `admintool` 命令尚未启动，请启动它。从“浏览”（Browse）下拉菜单中选择“组”（Groups）来显示组窗口（见图 6.4）。\n\n点击所需的帐户条目将其高亮，然后从“编辑”（Edit）下拉菜单中选择“修改”（Modify）。将显示修改组（Modify\
  \ Group）窗口。该窗口的字段将填充有关所选组的信息。修改组窗口与添加组窗口相似（见图 6.5）。根据需要更改字段并点击“应用”以保存更改。\n\n###\
  \ # 使用 admintool 命令删除组\n\n要删除组帐户，如果 `admintool` 命令尚未启动，请启动它。从“浏览”（Browse）下拉菜单中选择“组”（Groups）来显示组窗口（见图\
  \ 6.4）。\n\n128\n\n点击所需的帐户条目将其高亮，然后从“编辑”（Edit）下拉菜单中选择“删除”（Delete）。将显示一个与图 6.3 所示类似的警告窗口，但它列出的是组而不是用户。点击“删除”以删除组帐户。\n\
  \n**考试警示** 由于使用 `admintool` 命令创建、修改和删除组帐户变得非常简单直观，考试 310-011 重点关注使用 `groupadd`、`groupmod`\
  \ 和 `groupdel` 命令来管理组帐户。\n\n### # 使用 groupadd 命令创建组\n\n`groupadd`(1M) 命令提供了一种添加新组帐户的快速方法。至少，你必须将组帐户名称作为命令行参数。`groupadd`\
  \ 命令支持另外两个命令行参数。第一个是 `-g gid`，它指定应与组关联的唯一 GID。它必须是一个十整数。如果你不指定 GID，则将分配下一个最大的可用\
  \ GID。另一个命令行参数是 `-o`，它允许你为组分配重复的 GID。\n\n以下示例使用 `groupadd` 命令创建一个组：\n\n```\n# groupadd\
  \ -g 1000 newgroup\n```\n\n### # 使用 groupmod 命令修改组\n\n`groupmod`(1M) 命令用于修改现有的组帐户。命令行参数与\
  \ `groupadd` 命令的命令行参数相同，区别在于如果正在修改组帐户名称，则使用 `-n name` 指定新的组帐户名称。以下示例使用 `groupmod`\
  \ 将组 `newgroup` 改为 `ngroup`：\n\n```\n# groupmod -n ngroup newgroup\n```\n\n### #\
  \ 使用 groupdel 命令删除组\n\n`groupdel`(1M) 命令用于删除组帐户。组帐户作为命令行参数指定：\n\n```\n# groupdel\
  \ ngroup\n```\n\n### # 密码管理\n\n密码管理涉及设置参数以控制密码有效期、根据需要更改用户密码，并可能锁定用户帐户以防止其使用。\n\n\
  #### # 密码有效期\n\n`/etc/shadow` 文件的参数（你通过 `admintool` 命令的“添加用户帐户”或“修改用户帐户”窗口中的“帐户安全”字段设置）决定了密码有效期策略。这些参数包括密码有效期（最大更改\
  \ Max Change）、多久可以更改一次（最小更改 Min Change）以及在必须密码之前帐户可以非活跃多久（最大非活跃 Max Inactive）。它们强制执行密码完整性的策略。\n\
  \n请注意，在这三个密码有效期参数中，只有“最大非活跃”（Max Inactive）可以使用 `useradd` 命令指定并使用 `usermod` 命令进行修改。\n\
  \n#### # 密码要求\n\n除非由 root 等超级用户帐户指定，否则密码必须满足以下要求：\n\n- 密码必须包含由 `/etc/default/passwd`\
  \ 文件中的 `PASSLENGTH` 参数指定的字符数。默认为六个。\n- 密码必须包含至少两个字母和至少一个数字字符（在前 `PASSLENGTH` 个字符内）。\n\
  - 密码不能与用户帐户名称相同、用户帐户名称的反转或用户帐户名称的循环移动。在进行要求检查时，任何大写字母都会映射为小写字母。因此，访客帐户的密码不能为 `guest`、`tseug`、`uestg`、`estgu`、`GUEST`\
  \ 等。\n- 新密码与旧密码至少至少三个三个字符。再次，大小写字母在要求检查时是等价的。\n\n**考试警示** 密码可以是任何长度，但只有前八个字符是有意义的。例如，如果定义密码为\
  \ `administration`，可以使用它登录系统。\n\n### # 使用 admintool 命令更改密码\n\n要更改用户的密码，如果 `admintool`\
  \ 命令尚未启动，请启动它。从“浏览”（Browse）下拉菜单中选择“用户”（Users）来显示用户窗口。\n\n130\n\n![](img/index-132_1.png)\n\
  \n![](img/index-132_2.png)\n\n你可以通过两种方式选择用户帐户：双击帐户条目，或点击帐户条目将其高亮，然后从“编辑”（Edit）下拉菜单中选择“修改”（Modify）。使用任何一种方法，都会显示修改用户（Modify\
  \ User）窗口，如图 6.6 所示。注意当前的密码设置显示在“密码”字段中。在图 6.6 中，帐户已设置了普通密码。\n\n图 6.6：Admintool：修改用户（普通密码）窗口。\n\
  \n要修改密码，将鼠标光标放在“密码”字段上并按住左键。然后，将鼠标光标移动到“普通密码”项目上并释放按钮。将显示设置密码（Set User Password）窗口，如图\
  \ 6.7 所示。\n\n图 6.7：Admintool：设置密码窗口。\n\n在“输入密码”和“确认密码”字段中输入相同的密码。每个输入的字符都会显示星号。点击确定。要保存密码，在修改用户窗口中点击确定。\n\
  \n### # 使用 passwd 命令更改密码\n\n除了 `admintool` 命令外，`passwd11) 命令是更改用户帐户密码的唯一方法。在不带任何命令行参数使用时，`passwd`\
  \ 命令更改当前用户帐户的密码。例如：\n\n```\n$ passwd\npasswd: 更改 dla 的密码\n登录密码:\n新密码:\n重新输入新密码:\n\
  passwd (SYSTEM): 已成功更改更改密码\n$\n```\n\n请注意，在指定新密码之前必须输入当前密码。当 root 等超级帐户使用 `passwd`\
  \ 命令时，不需要输入当前密码。\n\n提供了多种命令行参数来支持更改密码。表 6.4 列出了较较重要的命令行参数。\n\n表 6.4：passwd 命令选定的命令行参数。\n\
  \n| 参数 | 描述 |\n| :--- | :--- |\n| `account` | 指定要更改密码的用户帐户的名称 |\n| `-as` | |\n\n\
  \n\n\n# 列所有用户账户的密码属性\n\n（显示 `LK` 表示锁定，`PS` 表示密码，等等）\n\n`-d`\n\n删除指定账户的密码\n\n`-l`\n\
  \n锁定指定账户使其无法访问\n\n超级用户可以更改另一个用户账户的密码。用户账户作为命令行参数指定。例如：\n\n```bash\n# passwd dla\n\
  \nNew password:\n\nRe-enter new password:\npasswd (SYSTEM): passwd successfully\
  \ changed for dla\n#\n```\n\n132\n\n![](img/index-134_1.png)\n\n## 使用 admintool\
  \ 命令锁定用户账户\n\n可以锁定账户以防止其被使用。如果 `admintool` 命令尚未激活，请启动该命令。从浏览（Browse）下拉菜单中选择“用户”（Users）来显示用户窗口。\n\
  \n你可以通过两种方式选择用户账户：双击账户条目，或者点击账户条目将其高亮，然后从编辑（Edit）下拉菜单中选择“修改”（Modify）。使用任一种方法，都会显示“修改用户”（Modify\
  \ User）窗口。\n\n要锁定账户，将鼠标光标置在“密码”（Password）字段上并按左键。然后，将鼠标光标移动到“账户已锁定”（Account Is Locked）项目上并释放鼠标按钮。“密码”字段中将显示“账户已锁定”，如图\
  \ 6.8 所示。要保存更改，点击“修改用户”窗口中的“确定”。\n\n图 6.8：Admintool：修改用户（账户已锁定）窗口。\n\n## 初始化文件\n\
  \n每个用户账户主目录都关联有几个初始化（或启动）文件。这些文件指定了在相关事件发生时要执行的命令。根据所使用的登录 shell，可能存在登录初始化文件、shell\
  \ 启动文件或注销文件。表 6.5 列出了各种初始化文件。\n\n表 6.5：初始化文件。\n\n| 文件 | sh | csh | ksh |\n| :---\
  \ | :--- | :--- | :--- |\n| 登录初始化文件 | `.profile` | `.login` | `.profile` |\n| shell\
  \ 启动文件 | N/A | `.cshrc` | |\n| 用户定义 | N/A | | |\n| 注销文件 | N/A | `.logout` | N/A\
  \ |\n\n登录初始化文件中的命令在用户登录时执行。三种常见的 shell 都提供登录初始化文件。shell 启动文件中的命令在登录用户启动 shell 时都会执行。`csh`\
  \ 和 `ksh` 都提供此功能。`ENV` 参数用于定义 `ksh` shell 启动初始化文件的名称。只有 `csh` 提供在用户注销时自动执行命令的文件。\n\
  \n**考试警报** 了解 Bourne shell 以及 C 和 Korn shell 的初始化文件名称及其用途是非常重要的。\n\n## 系统配置文件 (Profile)\n\
  \n对于使用 Bourne shell (`sh`) 或 Korn shell (`ksh`) 作为登录 shell 的用户账户，系统配置文件中的命令会在用户的登录初始化文件之前执行。该文件命名为\
  \ `/etc/profile`，执行时，它会设置默认终端类型（`TERM`），然后调用 `umask(1)` 将默认文件权限掩码设置为 `022`。如果用户的主目录中不包含名为\
  \ `.hushlogin` 的文件，则将使用 `quot(1M)` 显示用户的存储配额，显示当日消息（如果有），并且如果用户收到了新邮件，则显示通知消息。\n\
  \n以下列表显示了 Solaris 8 系统 `/etc/profile` 的默认内容：\n\n```bash\n# The profile that all\
  \ logins get before using their own .profile.\ntrap \"\" 2 3\nexport LOGNAME PATH\n\
  if [ \"$TERM\" = \"\" ]\nthen\n  if /bin/i386\n  then\n    TERM=sun-color\n  else\n\
  \    TERM=sun\n  fi\n  export TERM\nfi\n# Login and -su shells get /etc/profile\
  \ services.\n# -rsh is given its environment in its .profile.\ncase \"$0\" in\n\
  \  -sh | -ksh | -jsh)\n    if [ ! -f .hushlogin ]\n    then\n      /usr/sbin/quota\n\
  \      # Allow the user to break the Message-Of-The-Day only.\n      trap \"trap\
  \ '' 2\" 2\n      /bin/cat -s /etc/motd\n      trap \"\" 2\n      /bin/mail -E\n\
  \      case $? in\n        0)\n          echo \"You have new mail.\"\n         \
  \ ;;\n        2)\n          echo \"You have mail.\"\n          ;;\n      esac\n\
  \    fi\nesac\numask 022\ntrap 2 3\n```\n\n134\n\n## 初始化文件模板\n\n当创建用户账户并指定主目录时，设置用户账户包括将相应的默认初始化文件复制到用户的主目录。这些初始文件或模板存储在\
  \ `/etc/skel` 目录。\n\n对于使用 `sh` 或 `ksh` 作为登录 shell 的用户账户，`/etc/skel/local.profile`\
  \ 文件会被复制到用户主目录下的 `.profile` 文件。以下列表显示了 `/etc/skel/local.profile` 文件的默认内容：\n\n```bash\n\
  stty istrip\nPATH=/usr/bin:/usr/ucb:/etc:.\nexport PATH\n#\n# If possible, start\
  \ the windows system\n#\nif [ \"`tty`\" = \"/dev/console\" ] ; then\n  if [ \"$TERM\"\
  \ = \"sun\" -o \"$TERM\" = \"sun-color\" -o \"$TERM\" = \"AT386\" ]\n  then\n  \
  \  if [ ${OPENWINHOME:-\"\"} ] ; then\n      OPENWINHOME=/usr/openwin\n    fi\n\
  \  fi\n  fi\nfi\n```\n\n135\n\n对于使用 `sh` 或 `ksh` 作为登录 shell 的用户账户，`/etc/skel/local.profile`\
  \ 文件会被复制到用户主目录下的 `.profile` 文件。以下列表显示了 `/etc/skel/local.profile` 文件的默认内容：\n\n```bash\n\
  stty istrip\nPATH=/usr/bin:/usr/ucb:/etc:.\nexport PATH\n#\n# If possible, start\
  \ the windows system\n#\nif [ \"`tty`\" = \"/dev/console\" ] ; then\n  if [ \"$TERM\"\
  \ = \"sun\" -o \"$TERM\" = \"sun-color\" -o \"$TERM\" = \"AT386\" ]\n  then\n  \
  \  if [ ${OPENWINHOME:-\"\"} ] ; then\n      OPENWINHOME=/usr/openwin\n    fi\n\
  \  fi\n  fi\nfi\n```\n*（注：原文在模板部分存在一些重复/碎片；我已根据提供的片段清理了逻辑流。）*\n\n对于使用 `csh` 作为登录\
  \ shell 的用户账户，`/etc/skel/local.login` 文件会被复制到用户主目录下的 `.login` 文件。以下列表显示了 `/etc/skel/local.login`\
  \ 文件的默认内容：\n\n```csh\nstty istrip\nPATH=/usr/bin:/usr/ucb:/etc:.\nexport PATH\n\
  #\n# If possible, start the windows system\n#\nif [ \"`tty`\" = \"/dev/console\"\
  \ ] ; then\n  if [ \"$TERM\" = \"sun\" -o \"$TERM\" = \"sun-color\" -o \"$TERM\"\
  \ = \"AT386\" ]\n  then\n    if [ ${OPENWINHOME:-\"\"} ] ; then\n      OPENWINHOME=/usr/openwin\n\
  \    fi\n  fi\n  fi\nfi\n```\n\n136\n\n此外，对于使用 `csh` 作为登录 shell 的用户账户，`/etc/skel/local.cshrc`\
  \ 文件会被复制到用户主目录下的 `.cshrc` 文件。以下列表显示了 `/etc/skel/local.cshrc` 文件的默认内容：\n\n```csh\n\
  stty istrip\nPATH=/usr/bin:/usr/ucb:/etc:.\nexport PATH\n#\n# If possible, start\
  \ the windows system\n#\nif [ \"`tty`\" = \"/dev/console\" ] ; then\n  if [ \"$TERM\"\
  \ = \"sun\" -o \"$TERM\" = \"sun-color\" -o \"$TERM\" = \"AT386\" ]\n  then\n  \
  \  if [ ${OPENWINHOME:-\"\"} ] ; then\n      OPENWINHOME=/usr/openwin\n    fi\n\
  \  fi\n  fi\nfi\n```\n\n`/etc/skel` 目录还包含一个简单的 `.profile`，可以作为默认：\n\n```bash\n#\
  \ This is the default profile provided to a user.\n# They are expected to edit it\
  \ to meet their own needs.\nMAIL=/usr/mail/${LOGNAME}\n```\n\n使用 `admintool` 命令创建账户时，根据所选登录\
  \ shell 将相应的 `/etc/skel` 文件复制到用户主目录。当你使用 `useradd` 命令时，所有的 `/etc/skel` 文件（`.profile`、`local.cshrc`、`local.login`\
  \ 和 `local.profile`）都会被复制。相应的需要手动设置。\n\n可以通过修改初始化文件模板为新用户账户提供自定义环境。此外，你可以修改系统配置文件（`/etc/profile`），在登录初始化期间为所有用户自定义环境。\n\
  \n**考试警报** 请记住，系统配置文件 `/etc/profile` 在用户的配置文件之前执行。这种执行顺序让你能够在用户有机会进行修改之前控制并限制用户环境。\n\
  \n要定制单个用户账户，可以修改用户主目录中的初始化文件。大多数情况下，这种更改包括添加要自动执行的命令或定义 shell 参数。\n\n## 在 .profile\
  \ 中定义 shell 变量\n\n在 `.profile` 中定义并出的变量将成为用户环境的一部分。这些变量适用于用户执行的程序和 shell。\n\n`.profile`\
  \ 中定义的常用 shell 变量是 `LPDEST`，用于指定默认打印机。要在用户账户的 `.profile` 中将 HPLaser 定义为默认打印机，请包含以下：\n\
  \n```bash\nLPDEST=HPLaser\nexport LPDEST\n```\n\n或者，你可以将两个命令写在同一行并用分号隔开\n\n\n\n\n\
  \n分号：\n\n`LPDEST=HPLaser; export LPDEST`\n\n类似的语法也可用于使用 `ksh` 作为登录 shell 的用户账户：\n\
  \n`export LPDEST=HPLaser`\n\n虽然为 `csh` 用户账户定义变量不是认证要求，但此处显示了两种 `csh` 定义变量的语法：\n\n\
  `set LPDEST=HPlaser`\n\n`setenv LPDEST HPlaser`\n\n**考试警示**：对用户登录初始化文件所做的更改在用户重新登录或通过在\
  \ `.profile` 前加一个点（.）和空格来执行该文件之前，不会生效。这种技术会执行 `.profile` 并使其成为当前环境的一部分。\n\n### 提取\
  \ .profile (Sourcing .profile)\n\n对于使用 Solaris 通用桌面环境 (CDE) 的用户账户，你可以配置启动桌面的 `/usr/dt/bin/Xsession`\
  \ 命令，使其在启动过程中读取用户主目录下的 `.login`（用于 csh）或 `.profile`（用于 sh 和 ksh）登录初始化文件并进行读取和处理。这些登录初始化文件是作为启动过程的一部分。\n\
  \n`Xsession` 调用的第一个用户特定文件是位于用户主目录下的 `.dtprofile` 文件。默认 `.dtprofile` 文件的最后一行是：\n\n\
  `DTSOURCEPROFILE=true`\n\n此行会导致自动执行（或提取）`.login` 或 `.profile` 文件。要更改此默认行为并防止提取登录初始化文件，请将\
  \ `true` 改为 `false`。\n\n### 登录和注销程序 (Login and Logout Procedures)\n\n节介绍命令行登录和注销程序。请记住，从系统控制台可以使用图形用户界面\
  \ (GUI) 登录 Solaris CDE。\n\n#### 登录 Solaris 8 系统\n\n`login`(1) 命令用于登录（进入或连接到）系统。当通过网络或\
  \ tty 设备连接到系统时，通常使用 `login` 命令与用户交互，以提示并获取用户账户名和密码。这些信息将与 `/etc/passwd` 和 `/etc/shadow`\
  \ 文件中的条目进行比较，以确定是否应允许用户访问系统。如果是，则启动 `/etc/passwd` 文件中指定的登录 shell，为用户提供一个系统界面。如果不是，`login`\
  \ 命令将再次尝试几次以获取有效的用户账户和密码。如果所有尝试均失败，则断开与系统的连接。\n\n#### 登录失败尝试 (Failed Login Attempts)\n\
  \n在五次尝试失败后，失败尝试将保存在 `/var/adm/loginlog` 文件。通过创建 `loginlog` 文件启用此日志，通过删除它可以禁用。创建该文件时应仅赋予\
  \ root 读写权限。\n\n#### 注销 Solaris 8 系统 (Logging Out of a Solaris 8 System)\n\n在大多数情况下，你可以使用\
  \ `exit`(1) 命令注销（或在某些圈子里称为退出）系统。所有的 shell 都识别此命令。对于 `csh`，也可以使用 `logout`(1) 命令退出系统。\n\
  \n### 识别和监控用户 (Identifying and Monitoring Users)\n\n你可以使用多个命令来识别和监控用户：\n\n* `id`(1M)—显示真实和有效的\
  \ UID 和 GID\n* `finger`(1)—显示本地和远程用户的信息\n* `last`(1)—显示登录和注销信息\n* `who`(1)—显示当前登录到系统的用户\n\
  * `whodo`(1M)—显示谁在做什么\n\n### id 命令\n\n`id` 命令显示调用进程或指定用户账户的真实和有效的 UID 和 GID。如果你在调用\
  \ `id` 时使用 `-a` 选项，则将返回用户 ID 所在的所有组。以下行显示了执行 `id` 命令的结果：\n\n```bash\n### id -a\n\
  uid=0(root) gid=1(other)groupsgroups=1(other),0(root),2(bin),3(sys),4(adm),5(uucp),6(mail),7(tty),8(lp),9(nuucp),12(daemon)\n\
  ```\n\n### finger 命令\n\n`finger` 命令显示登录到本地系统或指定远程系统的用户信息。命令行参数 `-l` 会显示详细信息。你也可以将登录用户的账户名作为命令行参数，将显示的信息限制为单个用户。以下列表显示了\
  \ `finger` 命令的结果：\n\n```bash\n$ finger\nLogin Name TTY Idle When Where\nroot Super-User\
  \ console 36 Sun 01:47 :0\ndla Darrell pts/7 1:35 Sat 20:37 winnt40\n\n$ finger\
  \ -l\nLogin name: root In real life: Super-User\nDirectory: / Shell: /sbin/sh\n\
  On since Mar 18 01:47:03 on console from :0\n36 minutes Idle Time\nNo unread mail\n\
  No Plan.\nLogin name: dla In real life: Darrell\nDirectory: /export/home/dla Shell:\
  \ /bin/sh\nOn since Mar 31 20:37:53 on pts/7 from winnt40\n1 hour 36 minutes Idle\
  \ Time\nUnread mail since Fri Feb 9 13:53:42 2001\nNo Plan.\n\n$ finger dla\nLogin\
  \ name: dla In real life: Darrell\nDirectory: /export/home/dla Shell: /bin/sh\n\
  On since Mar 31 22:14:03 on pts/5 from winnt40\nUnread mail since Fri Feb 9 13:53:42\
  \ 2001\nNo Plan.\nLogin name: dla In real life: Darrell\nDirectory: /export/home/dla\
  \ Shell: /bin/sh\nOn since Mar 31 20:37:53 on pts/7 from winnt40\n1 hour 43 minutes\
  \ Idle Time\n```\n\n你也可以通过在主机名前指定 `@` 使用 `finger` 命令显示登录到远程系统的用户信息。例如，要显示登录到系统 sparc20\
  \ 的用户，使用 `finger` 命令：\n\n```bash\n$ finger @sparc20\nLogin Name TTY Idle When Where\n\
  root Super-User console 7d 21:25 :0\n```\n\n### last 命令\n\n`last` 命令显示登录和注销活动。该命令非常有用，它可以识别当前在系统上以及最近用户。以下列表显示了\
  \ `last` 命令的结果：\n\n```bash\n$ last\nroot console :0 Sun Mar 18 01:47 still in\n\
  reboot system boot Sun Mar 18 01:45\nroot console :0 Sun Mar 18 01:02 - 01:44 (00:41)\n\
  reboot system boot Sun Mar 18 00:55\ndla winnt40 Sat Mar 17 21:14 - 21:16 (00:02)\n\
  root console :0 Sat Mar 17 20:53 - 00:43 (03:49)\nreboot system boot Mon Mar 5 01:54\n\
  dla winnt40 Sun Feb 18 20:23 - 00:05 (03:42)\nroot console :0 Sat Feb 10 12:17 -\
  \ down (22:36)\nreboot system boot Fri Feb 9 13:51\ndla pts/8 solaris8 Sun Feb 4\
  \ 21:29 - 23:38 (02:08)\ndla pts/7 winnt40 Feb 2 23:50 - down (14:00)\nroot console\
  \ :0 Sat Jan 27 18:41 - down (19:10)\nreboot system boot Sat Jan 27 18:34\ndla ftp\
  \ solaris8 Fri Jan 19 01:46 - 01:59 (00:13)\nroot console :0 Sat Jan 13 21:44 -\
  \ down (20:50)\nreboot system boot Sat Jan 13 21:42\n```\n\n### who 命令\n\n`who`\
  \ 命令显示当前登录到系统的用户，以及可选的关于进程、系统重启等。以下列表显示了两个 `who` 命令的结果。第二个命令使用 `-a` 命令行参数提供了额外信息，如上次重启、运行级别和其他细节：\n\
  \n```bash\n# who\nroot console Mar 18 01:47 (:0)\nroot pts/4 Mar 18 01:49 (:0.0)\n\
  dla pts/5 Mar 20 03:34 (winnt40)\nroot pts/6 Mar 29 02:42 (:0.0)\n\n### who -a\n\
  . system boot Mar 18 01:45\n. run-level 3 Mar 18 01:46 3 0 S\nrc2 . Mar 18 01:46\
  \ old 78 id=s2 term=0 exit=0\nrc3 . Mar 18 01:46 old 279 id=s3 term=0 exit=0\nsac\
  \ . Mar 18 01:46 old 306 id=sc\nLOGIN console Mar 18 01:46 0:15 307\nzsmon . Mar\
  \ 18 01:46 old 309\nroot + console Mar 18 01:47 0:15 330 (:0)\nroot + pts/4 Mar\
  \ 18 01:49 old 428 (:0.0)\ndla + pts/5 Mar 20 03:34 .1712 (winnt40)\nroot + pts/6\
  \ Mar 29 02:42 0:14 7099 (:0.0)\n```\n\n#### whodo 命令\n\n`whodo` 命令允许系统管理员将 `who`\
  \ 信息与进程信息相结合，生成用户正在做什么的列表。以下列表显示了 `whodo` 命令的结果：\n\n```bash\n### whodo\nThu Mar\
  \ 29 04:15:13 EST 2001\nsolaris8\nconsole root 1:47\n? 330 0:00 Xsession\npts/3\
  \ 374 0:00 sdt_shell\npts/3 390 0:06 dtsession\npts/6 7099 0:00 sh\npts/4 428 0:00\
  \ sh\npts/5 dla 3:34\npts/5 1712 0:00 sh\n142\npts/5 7124 0:00 sh\n```\n\n\n\n\n\
  \npts/5 7179 0:00 whodo\n\n### 练习题\n\n### 第 题\n用户账户初始化文件模板存储在何处？\n\na. 在用户家目录下\n\
  b. 在 `/etc/skel` 目录下\nc. 在 `/usr/skel` 目录下\nd. 在 `/skel` 目录下\n\n答案 `b` 正确。用户账户初始化文件模板存储在\
  \ `/etc/skel` 目录中。用户的模板副本（而非模板本身）存储在家目录下。因此，答案 `a` 是错误的。`/usr/skel` 和 `/skel` 目录并不存在。因此，答案\
  \ `c` 和 `d` 是错误的。\n\n### 第 题\n下列哪些项是 `admintool` 命令中“密码”（Password）字段的有效设置？[选择所有适用项]\n\
  \na. 正常密码 (Normal Password)\nb. 账户已锁定 (Account is locked)\nc. 首次登录前清除 (Cleared until\
  \ first login)\nd. 无密码 — 仅 setuid (No password — setuid only)\ne. 一次性密码 (One-time\
  \ Password)\n\n答案 `a`、`b`、`c` 和 `d` 正确。正常密码、账户已锁定、首次登录前清除以及无密码 — 仅 setuid 是 `admintool`\
  \ 命令密码字段的有效设置。Solaris 8 不提供一次性密码功能。因此，答案 `e` 是错误的。\n\n### 第 题\n输入用于命令，该命令将用户定义的\
  \ Bourne shell 变量添加到用户环境中，以便其他程序可以使用该变量。\n\n143\n\n正确答案是 `export`。\n\n### 第 题\n\
  在使用 `useradd` 或 `usermod` 命令时，可以指定以下哪些命令行参数？[选择所有适用项]\n\na. `-u uid`\nb. `-g gid`\n\
  c. `-d home_directory`\nd. `-l account`\n\n答案 `a`、`b` 和 `c` 正确。可以使用指定的 `useradd`\
  \ 命令行参数定义 UID、GID 和家目录，并使用相同的 `usermod` 命令行参数进行修改。`-l` 命令行参数仅用于 `usermod` 命令，以指定新的账户名称。`useradd`\
  \ 命令的账户名称不使用 `-l` 命令行参数。因此，答案 `d` 是错误的。\n\n### 第 题\n可以使用哪个命令更改分配给现有组的（即用户账户）？\n\n\
  a. `usermod`\nb. `groupmod`\nc. `groupadd`\nd. `groupmem`\n\n答案 `a` 正确。`usermod`\
  \ 命令每个要从组中添加或删除的用户账户都要使用一次。`groupmod` 命令和 `groupadd` 命令不影响组成员关系。因此，答案 `b` 和 `c`\
  \ 是错误的。`groupmem` 命令不存在。因此，答案 `d` 是错误的。\n\n### 第 题\n输入系统配置文件（profile）的完整路径。\n\n\
  正确答案是 `/etc/profile`。\n\n144\n\n### 第 题\n`useradd` 命令的 `-P` 命令行参数指定什么？\n\na. 账户密码\n\
  b. 执行配置 (Execution profile)\nc. 初始化文件 (profile) 模板\nd. 主组\n\n答案 `b` 正确。`useradd`\
  \ 命令的 `-P` 命令行参数指定执行配置。无法使用 `useradd` 命令指定密码；所有使用 `useradd` 创建的账户在使用 `passwd` 或\
  \ `admintool` 命令定义密码之前都是锁定的。因此，答案 `a` 是错误的。无法指定模板；但是，可以使用 `-k` 命令行参数指定 profile 模板目录。因此，答案\
  \ `c` 是错误的。主组由 `-g` 命令行参数指定。\n\n### 第 题\n`/var/adm/loginlog` 文件用于记录什么？\n\na. 登录\n\
  b. 注销\nc. 失败的登录\nd. 成功的登录\ne. 所有登录和注销\n\n答案 `c` 正确。`/var/adm/loginlog` 文件记录失败的登录尝试。`last`\
  \ 命令用于确定登录、注销以及登录和注销。因此，答案 `a`、`b`、`d` 和 `e` 是错误的。此外，可以使用 `who` 命令识别当前登录系统的用户。\n\
  \n### 第 题\n当与 `usermod` 命令配合使用时，`-o` 命令行选项有什么作用？\n\na. 现有的用户信息被覆盖。\nb. 可以指定重复的 UID。\n\
  c. 显示指定用户的信息。\n145\nd. 可以指定重复的 GID。\ne. 删除用户账户。\n\n答案 `b` 正确。`usermod` 命令的 `-o`\
  \ 命令行选项允许指定重复的 UID。其他答案中列出的操作不受 `usermod` 命令的支持。因此，答案 `a`、`c`、`d` 和 `e` 是错误的。\n\n\
  ### 第 题\n使用 `admintool` 命令创建用户账户时，以下哪些项可以指定登录 shell？[选择所有适用项]\n\na. Bourne (`/bin/sh`)\n\
  b. C (`/bin/csh`)\nc. Korn (`/bin/ksh`)\nd. 其他（指定路径）\n\n答案 `a`、`b`、`c` 和 `d` 正确。当使用\
  \ `admintool` 创建用户账户时，可以选择 Bourne、C 或 Korn 作为登录 shell，也可以指定其他路径。\n\n哪些命令可以使用 root\
  \ 修改密码？[选择所有适用项]\n\na. `admintool`\nb. `passmgmt`\nc. `usermod`\nd. `passwd`\n\n\
  答案 `a` 和 `d` 正确。root 使用 `admintool` 和 `passwd` 修改密码。`passmgmt` 和 `usermod` 不提供此类功能。\n\
  \n哪个命令显示当前登录系统的用户？[选择所有适用项]\n\n146\na. `who`\nb. `last`\nc. `whodo`\nd. `id`\n\n\
  答案 `a`、`b` 和 `c` 正确。`who`、`last` 和 `whodo` 命令显示当前登录的用户。`id` 命令显示用户的真实 UID 和组。因此，答案\
  \ `d` 是错误的。\n\n\n\n\n\n`ps`(1)、`prstat`(1M) 和 `pgrep`(1) 命令用于查看进程属性，而 `kill`(1)\
  \ 和 `pkill`(1) 命令用于终止进程。\n\n## ps 命令\n\n`ps` 命令用于显示活动进程的信息。在不带任何命令行参数的情况下，`ps` 命令会显示与执行命令的用户账户具有相同有效用户\
  \ ID (UID) 的进程。表 7.1 列出了 `ps` 命令支持的命令行参数。\n\n### 表 7.1：ps 命令的命令行参数。\n\n| 参数 | 描述\
  \ |\n| :--- | :--- |\n| `-a` | 显示所有非进程组组和与终端关联的进程 |\n| `-A` | 显示所有进程（等同于 `-e`） |\n\
  | `-c` | 显示备用列 |\n| `-d` | 显示所有非进程会话首的进程 |\n| `-e` | 显示所有进程 |\n| `-f` | 使用完整列表显示格式\
  \ |\n| `-g Process Group ID` | 显示指定进程组 ID 的进程 |\n| `-G Group ID` | 显示指定组 ID (GID)\
  \ 的进程 |\n| `-j` | 显示会话和进程组 ID |\n| `-l` | 使用长列表显示格式 |\n| `-L` | 显示每个轻量级进程 (LWP)\
  \ 的信息 |\n| `-n Name` | 使用备用名称列表文件（忽略） |\n| `-o Format` | 使用备用显示格式 |\n| `-p Process\
  \ ID` | 显示指定进程 ID (PID) 的进程 |\n| `-P` | 显示执行进程的处理器编号（仅在多处理器系统上有意义） |\n| `-s Process\
  \ Session ID` | 显示指定会话 ID 的进程 |\n| `-t Terminal Device` | 显示与指定终端设备路径关联的进程 |\n|\
  \ `-u Effective User ID` | 显示指定有效用户 ID 的进程 |\n| `-U Real User ID` | 显示指定实际用户 ID\
  \ 的进程 |\n| `-Y` | 在长列表中显示备用列 |\n\n通过 `ps` 命令及其若干种显示格式，可以获取大量关于进程的信息。\n\n**考试警示**：进程的默认显示信息包括其进程\
  \ ID (PID)、其关联的终端设备 (TTY)、累积执行时间 (TIME) 以及程序或命令名称 (CMD)。除非特别省略，否则所有格式都包含这些信息。\n\n\
  所有用于指定 ID（如进程组 ID、实际组 ID、PID、进程会话 ID、有效 UID 和实际 UID）的命令行参数都接受多个 ID（用逗号分隔）。对于实际和有效用户\
  \ ID 以及实际组 ID，你可以指定数字 ID 或账户名称。以下列表使用了带有不同命令行参数的 `ps` 命令：\n\n```bash\n$ ps -udla\n\
  PID TTY TIME CMD\n781 ? 0:19 xterm\n782 pts/5 0:00 sh\n910 pts/5 0:10 telnet\n913\
  \ pts/6 0:01 sh\n\n$ ps -tpts/5\nPID TTY TIME CMD\n782 pts/5 0:00 sh\n910 pts/5\
  \ 0:10 telnet\n\n$ ps -f -udla\nUID PID PPID C STIME TTY TIME CMD\ndla 781 1 0 Aug\
  \ 28 ? 0:19 xterm -display\ndla 782 781 0 Aug 28 pts/5 0:00 sh\ndla 910 782 0 Aug\
  \ 28 pts/5 0:10 telnet solaris\ndla 913 911 0 Aug 28 pts/6 0:01 -sh\n```\n\n`PPID`\
  \ 列列出进程的父 PID，`C` 列列出处理器利用率（已过时），`STIME` 显示开始日期。\n\n## prstat 命令\n\n`prstat`(1M)\
  \ 命令生成活动进程的统计报告。如果你不带任何命令行参数使用它，将按 CPU 使用率排序显示所有活动进程的信息。报告大约每三秒更新一次，直到被杀死为止。以下列表显示了\
  \ `prstat` 命令的使用：\n\n```bash\n$ prstat\nPID USER SIZE RSS STATE PRI NICE TIME CPU\
  \ PROCESS/NLWP\n793 dla 1032K 844K cpu0 58 0 0:00.00 0.1% prstat/1\n789 dla 2960K\
  \ 2132K sleep 58 0 0:00.00 0.1% xterm/1\n217 root 1908K 1100K sleep 53 0 0:00.00\
  \ 0.1% nscd/7\n312 root 1936K 660K sleep 48 0 0:00.00 0.1% mibiisa/12\n397 root\
  \ 64M 47M sleep 59 0 0:00.07 0.0% perfmeter/1\n790 dla 808K 628K sleep 41 0 0:00.00\
  \ 0.0% sh/1\n177 root 1576K 0K sleep 30 0 0:00.00 0.0% lockd/1\n229 root 2692K 0K\
  \ sleep 48 0 0:00.00 0.0% lched/1\n165 root 1940K 696K sleep 58 0 0:00.00 0.0% named/1\n\
  250 root 804K 480K sleep 58 0 0:00.00 0.0% utmpd/1\n188 root 2720K 664K sleep 58\
  \ 0 0:00.00 0.0% automountd/1\n143 root 2144K 672K sleep 58 0 0:00.00 0.0% rpcbind/1\n\
  129 root 1552K 300K sleep 59 0 0:00.00 0.0% inpd/1\n122 root 1304K 220K sleep 58\
  \ 0 0:00.00 0.0% routed/1\nTotal: 64 processes, 146 lwps, load averages: 0.11, 0.04,\
  \ 0.05\n```\n\n`prstat` 命令行参数允许你根据 PID、所有者 UID、使用的 CPU 等选择要监控的进程。表 7.2 列出了 `prstat`\
  \ 命令行参数。\n\n### 表 7.2：prstat 的命令行参数。\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `-a` | 显示进程和用户的单独报告\
  \ |\n| `-c` | 新报告而不是覆盖初始报告 |\n| `-C sets` | 报告指定 sets 的进程 |\n| `-L` | 报告每个 LWP |\n\
  | `-m` | 报告微状态信息 |\n| `-n number` | 将报告限制在窗口或 number 行。默认使用整个显示 |\n| `-p pids` |\
  \ 报告 pids 列出的进程 |\n| `-P cpus` | 报告在列出的 cpus 上执行的进程 |\n| `-R` | 以实时模式执行 `prstat`\
  \ |\n| `-s key` | 根据 key（cpu、time、size 或 pri）降序排序报告 |\n| `-S key` | 根据 key（cpu、time、size\
  \ 或 pri）升序排序报告 |\n| `-t` | 报告每个用户的使用摘要 |\n| `-u euids` | 报告有效 UID 在列中的进程 |\n| `-U\
  \ uids` | 报告实际 UID 在列中的进程 |\n| `-v` | 使用详细模式报告，包括用户模式和系统模式的时间百分比 |\n\n以下示例使用 `prstat`\
  \ 命令列出与 `dla` 关联的进程：\n\n```bash\n$ prstat -c -u dla\nPID USER SIZE RSS STATE PRI\
  \ NICE TIME CPU PROCESS/NLWP\n9830 dla 812K 696K cpu0 48 0 0:00.00 0.2% prstat/1\n\
  9789 dla 2960K 2136K sleep 59 0 0:00.00 0.1% xterm/1\n9790 dla 808K 628K sleep 48\
  \ 0 0:00.00 0.0% sh/1\nTotal: 3 processes, 3 lwps, load averages: 0.00, 0.00, 0.01\n\
  ```\n\n**考试警示**：确保你理解 `ps` 和 `prstat` 都提供关于活动进程的信息。`ps` 命令提供更多面向用户的信息（父 PID、TTY、开始日期等），而\
  \ `prstat` 命令提供更多面向系统的信息（进程大小、优先级、CPU 利用率等）。\n\n## kill 命令\n\n`kill`(1) 命令通过向进程发送会导致退出的信号来终止进程。存在许多类型的信号。通常用于终止进程的信号见表\
  \ 7.3，基础信号的完整列表可以在 `signal`(3HEAD) 中找到。\n\n### 表 7.3：用于终止进程的信号。\n\n| 符号名称 | 值 |\
  \ 描述 |\n| :--- | :--- | :--- |\n| `SIGHUP` | 1 | 挂断 (Hangup) |\n| `SIGINT` | 2 |\
  \ 中断 (Interrupt) |\n| `SIGKILL` | 9 | 杀死 (Kill) |\n| `SIGTERM` | 15 | 终止 (Terminate)(`kill`\
  \ 和 `pkill` 命令的默认信号) |\n| `SIGUSR1` | 16 | 用户信号 1 |\n| `SIGUSR2` | 17 | 用户信号 2 |\n\
  \n接收这些信号的进程默认响应是终止，但这种行为可以按进程进行更改。你可以使用符号名称（不包括 *SIG* 前缀）或数值值来指定信号。如果未指定信号，默认发送\
  \ SIGTERM (15)。要终止的进程 PID 为\n\n\n\n必须知道哪些进程将被终止。以下列表使用 `kill` 命令向多个进程发送了 `KILL`\
  \ 信号 (9)：\n\n```\n### kill -KILL 4220 4224 4229\n\n#\n\n4229 Killed\n4224 Killed\n\
  4220 Killed\n\n### kill -9 4247\n\n#\n\n4247 Killed\n```\n\n以减号前缀的 PID 被解释为进程组 ID，并且信号将发送到该进程组中的所有进程。\n\
  \n## pgrep 和 pkill 命令\n\n`pgrep`(1) 和 `pkill`(1) 命令支持通过名称或其他属性（如 `UID`、`GID` 等）查看和终止进程。表\
  \ 7.4 列出了 `pgrep` 和 `pkill` 命令共同支持的命令行参数。\n\n表 7.4: 常用 pgrep 和 pkill 命令行参数。\n\n\
  | 参数 | 描述 |\n| :--- | :--- |\n| `pattern` | 用于匹配程序名和/或参数的正则表达式 |\n| `-f` | 针对完整参数匹配模式，而不是程序名\
  \ |\n| `-g Process Group ID` | 匹配指定进程组 ID 的进程 |\n| `-G Real Group ID` | 匹配指定真实组\
  \ ID 的进程 |\n| `-n` | 仅匹配符合指定条件的最新进程 |\n| `-P Parent Process ID` | 匹配指定父进程 ID 的进程\
  \ |\n| `-s Process Session ID` | 匹配指定会话 ID 的进程 |\n| `-t Terminal Device Path` |\
  \ 匹配指定终端设备路径的进程 |\n| `-u Effective User ID` | 匹配指定有效用户 ID 的进程 |\n| `-U Real User\
  \ ID` | 匹配指定真实用户 ID 的进程 |\n| `-v` | 匹配所有不符合指定条件的进程 |\n| `-x` | 仅匹配完全符合模式的进程 |\n\n\
  `pattern` 是一个用于根据程序名选择进程的正则表达式。以下行显示了使用 `ps` 和 `grep`(1) 命令获取 `admintool` 命令的 PID\
  \ 与使用 `pgrep` 命令获取之间的区别：\n\n```bash\n$ ps -eaf|grep admintool\nroot 2898 1096 0\
  \ Sep 04 pts/7 0:02 admintool\n$ pgrep adm*\n2898\n```\n\n当你在指定 `pattern` 的同时 `-f`\
  \ 命令行参数时，`pattern` 将与程序参数进行比较而不是程序名。此外，如果你指定了 `-x` 命令行参数，将禁用对 `pattern` 的正则表达式解释，此时\
  \ `pattern` 必须精确匹配程序名或程序参数。\n\n所有类型的命令行参数 ID 都接受多个 ID（用逗号分隔）。在真实和有效用户 ID 以及真实组 ID\
  \ (`-G`) 的情况下，可以指定数字 ID 或账户名。\n\n`pgrep` 命令额外支持两个命令行参数。`-d` 命令行参数指定当指定的 `pgrep`\
  \ 条件匹配到多个 PID 时，用于分隔 PID 的分隔符。默认情况下，该分隔符是换行符。以下列表显示了使用 `pgrep` 命令列出 `dla` 用户账户拥有的进程，以及指定空格作为分隔符的效果：\n\
  \n```bash\n$ pgrep -u dla\n781\n782\n910\n913\n$ pgrep -d' ' –u dla\n781 782 910\
  \ 913\n```\n\n分隔符命令行参数允许 `pgrep` 命令的输出作为其他命令或 shell 脚本的输入。另一个命令行参数是 `-l`，它包含匹配进程的\
  \ PID 程序名称。以下列表显示了 `-l` 命令行参数的使用：\n\n```bash\n$ pgrep -l\n781 xterm\n782 sh\n910\
  \ telnet\n913 sh\n```\n\n\n\n每周日和周四早晨 3:10。\n\n### 考试警报\n系统管理员的一项关键技能是理解并使用 `crontabs`\
  \ 来调度日志维护、系统备份和其他例行维护。\n\n## 操作 Crontabs\n\n你可以使用 `crontab`(1) 命令来创建、列出、编辑和删除 `crontabs`。`crontab`\
  \ 命令的一项功能（编辑其他用户的 crontab 文件的能力）仅对超级用户（root）可用。\n\n当在不带任何命令行参数的情况下执行 `crontab` 时，它会读取标准输入（通常是键盘）。当通过\
  \ `Ctrl+D` 终止命令时，所输入的数据将用于为执行该 `crontab` 命令的用户账户创建 `crontab`（或覆盖现有的 `crontab`）。当指定文件名作为命令行参数时，则将使用指定文件的内容来创建/覆盖用户的\
  \ crontab。\n\n当你使用带有 `-e` 命令行参数执行 `crontab` 时，将调用由 环境变量 `EDITOR` 指定的编辑器在用户 crontab\
  \ 上进行操作。如果未设置 `EDITOR` 参数，则使用 `ed`(1) 文本编辑器。这种机制允许编辑与调用者用户账户相关的 crontab。\n\n`crontab\
  \ -l` 命令显示用户 crontab 的内容，而 `crontab -r` 命令删除用户的 crontab。\n\n### 考试警报\n当 `cron` 守护进程启动时，它会读取所有现有的\
  \ crontabs。因为它通常不会重新读取 crontabs，除非使用 `crontab` 命令进行了更改，否则它将无法感知到任何变化。`crontab` 命令会通知\
  \ `cron` 守护进程 crontab 已发生更改或添加。随后 `cron` 守护进程会更新其信息。\n\n超级用户可以指定一个用户名来控制另一个用户账户的\
  \ crontab。该账户名可以配合 `-l` 或 `-r` 命令行参数列出或删除另一个用户账户的 crontab；但是，不要在 `-e` 命令行参数中指定用户账户。\n\
  \n### 考试警报\n如果超级用户尝试通过使用 `crontab -e` 命令并将用户账户作为命令行参数来修改另一个用户账户的 crontab，结果将是不可预测的。相反，请使用\
  \ `su`(1) 命令变为另一个用户账户，然后使用 `crontab -e` 命令。\n\n## 访问控制\n\n对 `crontab` 命令的访问受两个文件的控制：`cron.allow`\
  \ 和 `cron.deny`，它们都位于 `/etc/cron.d` 目录下。这些文本文件包含了用户名的列表（每行一个），允许或拒绝访问该命令。\n\n如果用户的用户名被列在\
  \ `/etc/cron.d/cron.allow` 文件中，则允许用户访问 `crontab` 命令。如果 `cron.allow` 文件不存在，则当用户的用户名未列在\
  \ `/etc/cron.d/cron.deny` 文件中时，允许用户访问。此外，如果两个文件都不存在，用户将被拒绝访问。\n\n如果存在 `cron.allow`\
  \ 或 `cron.deny` 任何一个，这些访问规则也适用于 root 账户。默认情况下，`/etc/cron.d/cron.deny` 文件会被创建并包含所有初始非管理用户账户。如果两个文件都不存在，只有超级用户可以提交作业。\n\
  \n注意，`/usr/lib/cron` 目录是 `/etc/cron.d` 目录的符号链接。因此，可以使用任何一个路径访问 crontab 控制文件。即可以使用\
  \ `/etc/cron.d/cron.allow` 或 `/usr/lib/cron/cron.allow`，以及 `/etc/cron.d/cron.deny`\
  \ 或 `/usr/lib/cron/cron.deny`。\n\n## at 命令\n\n在不修改 crontab 的情况下执行一次或多个命令的简单方法是使用\
  \ `at`(1) 命令。提交用于稍后执行的命令被分组为一个 at 作业（at-job），并分配一个业业 ID。\n\n`at` 命令的基本格式为 `at *time`，其中\
  \ `time*` 指定执行命令的时间。你可以使用 a.m./p.m. 或 24 小时格式的任意组合，并结合 `now`、`today`、`tomorrow`\
  \ 等关键词来指定时间。以下列表显示了若干类型的时间规范：\n\n```\nat now\nat 10am\nat 2pm\nat noon\nat 3pm +\
  \ 1 week\nat 3pm next week\nat 2am jan 24\nat 1400 tomorrow\n```\n\n你可以从标准输入输入要执行的命令并用\
  \ `Ctrl+D` 结束，或者使用 `-f *file` 命令行参数指定从哪个文件读取命令。at 作业存储在 `/var/spool/cron/atjobs`\
  \ 目录下。\n\n`at` 命令支持其他命令行参数，用于指定使用 Bourne shell (`-b`)、C shell (`-c`) 或 Korn shell\
  \ (`-k`) 执行命令，以及在命令执行时是否应通过邮件通知用户 (`-m`)。与 `crontab` 命令一样，`at` 命令支持 `-l` 和 `-r`\
  \ 命令行参数，并允许列出和移除 at 作业。\n\n`batch` 命令等同于 `at now`，允许通过标准输入输入批量作业。\n\n`at` 和 `batch`\
  \ 命令的使用受 `/etc/cron.d/at.allow` 和 `/etc/cron.d/at.deny` 文件的控制。这些文件与 `cron` 访问文件类似，但空\
  \ `at.deny` 文件允许所有人访问。\n\n注意，`/usr/lib/cron` 目录是 `/etc/cron.d` 目录的符号链接。因此，可以使用任何一个路径访问\
  \ at 控制文件。即可以使用 `/etc/cron.d/at.allow` 或 `/usr/lib/cron/at.allow`，以及 `/etc/cron.d/at.deny`\
  \ 或 `/usr/lib/cron/at.deny`。\n\n### 练习题\n\n### 问题 1\n使用 `pkill` 命令选择进程可以使用哪些标准？\n\
  [多选]\na. 程序名\nb. 开始时间\nc. 真实或有效 UID\nd. 终端设备\n\n### 问题 2\n输入用于列出、编辑和删除 crontab 文件的命令。\n\
  \n### 问题 3\n当使用 `kill` 命令未指定信号时，默认向指定的进程发送何种信号？\na. SIGHUP\nb. SIGINT\nc. SIGKILL\n\
  d. SIGTERM\n\n### 问题 4\ncrontab 文件中字段的顺序是什么？\na. 月、日、时、分、星期、命令\nb. 命令、星期、分、时、日、月\n\
  c. 分、时、日、月、星期、命令\nd. 秒、分、时、日、月、星期、命令\n\n### 问题 5\n哪个命令可以使用 a.m./p.m. 时间表示法调度命令执行？\n\
  \n### 问题 6\n使用 `pgrep` 命令选择进程可以使用哪些标准？\n[多选]\na. 程序名\nb. 进程 ID (PID)\nc. 真实或有效 UID\n\
  d. 终端设备\n\n\n\n因为 `pgrep` 命令用于确定进程 ID（PID）。因此，答案 b 是错误的。\n\n161\n\n### 问题 7\n\n\
  `/etc/cron.d/cron.deny` 文件存在，但 `/etc/cron.d/cron.allow` 文件不存在。关于访问 cron 权限，以下哪些陈述是正确的？[选择所有适用项]\n\
  \na. 在没有 `cron.allow` 文件的情况下，包括 root 在内的任何人都都不允许创建、编辑或删除 crontab 文件。\nb. 在没有 `cron.allow`\
  \ 文件的情况下，只有 root 允许创建、编辑或删除 crontab 文件。\nc. 任何未列在 `cron.deny` 文件中的用户账户都可以创建、编辑或删除其\
  \ crontab 文件。\nd. 任何列在 `cron.deny` 文件中的用户账户都不能创建、编辑或删除其 crontab 文件。\n\n答案 c 和 d\
  \ 是正确的。未列在 `cron.deny` 文件中的用户账户可以创建、编辑或删除其 crontab 文件，而列在 `cron.deny` 文件中的用户账户则不能创建、编辑或删除其\
  \ crontab 文件。如果存在 `cron.deny` 但不存在 `cron.allow`，任何未列在 `cron.deny` 文件中的账户都可以使用 cron\
  \ 服务。因此，答案 a 和 b 是错误的。\n\n### 问题 8\n\n除了 `ps` 命令外，还可以什么命令可以查看活动进程的信息？\n\n正确答案是 `prstat`。\n\
