  \n## 问题 7\n\n可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\n第 12 章：答案\n\n## 问题 8\n\n\
  可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\n第 12 章：答案\n\n## 问题 9\n\n可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\
  \n第 12 章：答案\n\n## 问题 10\n\n可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\n第 12 章：答案\n\
  \n## 问题 11\n\n可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\n第 12 章：答案\n\n## 问题 12\n\
  \n可以使用三种命名约定来引用磁盘。其中两种约定是物理设备名称和逻辑设备名称。256\n\n第 12 章：答案\n\n\n\n\n\n## 问题 15\n答案\
  \ a、b、c、d 均正确。由于在使用 `mkfs` 时未指定文件系统类型，因此假设使用 `/etc/default/fs` 文件指定的默认文件系统类型，即 UFS。所有其他命令都指定了\
  \ UFS 文件系统类型或用于 UFS 文件系统。\n\n## 问题 16\n答案 b 和 d 正确。由于没有使用 `-m` 命令行参数，所有挂载的文件系统都列在\
  \ `/etc/mnttab` 文件中。不带命令行参数的 `mount` 命令会显示 `/etc/vfstab` 文件中列出的所有文件系统。答案 a 是 `mountall`\
  \ 命令的描述，而不是 `mount` 命令。`mountall` 命令挂载 `/etc/vfstab` 中的所有文件系统。因此，答案 a 是错误的。`mount`\
  \ 命令显示的是 `/etc/mnttab` 的内容，而不是 `/etc/vfstab` 文件。因此，答案 c 是错误的。\n\n## 问题 17\n259\n\
  答案 b 正确。路径应该是 `/dev/dsk` 而不是 `/dev/rdsk`，后者标识的是原始设备（raw device）。因此，答案 a 是错误的。物理设备名称位于\
  \ `/devices` 目录下，而不是 `/dev` 目录。因此，答案 c 和 d 是错误的。\n\n## 问题 18\n答案 d 正确。问号 (`?`) 可以用于进入\
  \ `vi` 的末行模式（Last Line mode）。`%`、`$` 和 `#` 字符不用于切换 `vi` 模式。因此，答案 a、b、c 是错误的。\n\n\
  ## 问题 19\n答案 a-3、b-4、c-1 和 d-2 正确。PCFS 用于软盘，UFS 用于磁盘驱动器；UDF 用于 DVD，HSFS 用于光盘（CD-ROM）。\n\
  \n## 问题 20\n答案 a、b、c 和 f 正确。`format`、`newfs`、`fsck` 和 `prtvtoc` 命令显示或可以使用逻辑原始设备名。`mount`\
  \ 和 `df` 命令显示或期望逻辑块设备。因此，答案 d 和 e 是错误的。\n\n## 问题 21\n答案 a、c 和 e 正确。你可以使用 OpenBoot\
  \ 命令启动操作系统、查看和修改 NVRAM 参数以及运行诊断。只有在 Solaris 8 操作系统中才能更改根密码并设置系统时间。因此，答案 b 和 d 是错误的。\n\
  \n## 问题 22\n正确答案是 `pgrep`。可以使用 `ps` 命令，但它会列出不仅仅是进程的 PID。\n\n## 问题 23\n260\n答案 a\
  \ 和 c 正确。你可以使用 `rlogin` 和 `telnet` 登录远程系统。`login` 用于登录本地系统。因此，答案 b 是错误的。`rsh` 用于在不登录系统的情况下在远程系统上执行命令。因此，答案\
  \ d 是错误的。\n\n## 问题 24\n答案 a、c 和 d 正确。`ps` 命令的目的是识别进程及其所有者。程序/命令名允许人类用户确定需要处理的进程的\
  \ PID（例如使用 `kill` 命令终止进程）。进程 ID (PID) 唯一标识一个进程。可能会列出多个同名的进程。要唯一标识进程所有者，需要用户名（选项中没有）或与进程关联的终端设备。父进程\
  \ ID 仅在选格式中显示，例如由 `-l` 命令行参数生成的格式。\n\n## 问题 25\n`slices` 或 `partitions` 均正确。\n\n\
  ## 问题 26\n`setfacl` 或 `chmod` 均正确。\n\n## 问题 27\n答案 b 正确。NFS 服务器服务通常在运行级别 3 启动。运行级别\
  \ 2 是未启用服务器功能的多用户模式。因此，答案 a 是错误的。运行级别 4 不被使用。因此，答案 c 是错误的。运行级别 5 用于关机系统。因此，答案 d\
  \ 是错误的。\n\n## 问题 28\n正确答案是 `ps`。\n\n## 问题 29\n261\n答案 d 正确。客户账户可以使用 `passwd` 命令更改其密码。客户账户不是也不应该是\
  \ sysadmin 组的成员。因此，答案 a 是错误的。`passmgmt` 和 `usermod` 命令不支持更改密码。因此，答案 b 和 c 是错误的。\n\
  \n## 问题 30\n答案 b 和 c 正确。`/etc/hosts.equiv` 和 `.rhosts` 与远程认证数据库相关。`/etc/hosts` 用于将主机解析为\
  \ IP 地址，不是远程认证数据库的一部分。因此，答案 a 是错误的。`/etc/system` 用于配置 Solaris 内核。因此，答案 d 是错误的。\n\
  \n## 问题 31\n答案 c 正确。`.profile` 是从 `/etc/skel/local.profile` 拷贝的。`/etc/skel/default.profile`\
  \ 不存在。因此，答案 a 是错误的。`/etc/profile` 是系统配置文件。因此，答案 b 是错误的。`/.profile` 是 root 账户配置。因此，答案\
  \ d 是错误的。\n\n## 问题 32\n答案 b 正确。使用 `admintool` 锁定账户是临时防止用户账户被使用的优方法。所有其他选项都会导致问题或无法防止用户账户被使用。因此，答案\
  \ a、c 是错误的。\n\n## 问题 33\n答案 d 正确。umask 执行权限不影响文件。umask 022 的结果是 644，即用户 `rw-`、组\
  \ `r--`、其他 `r--`。答案 a、c 是错误的。\n\n## 问题 34\n答案 a 和 d 正确。`admintool` 和 `pkgrm` 可用于删除软件包。`pkgtool`\
  \ 不存在。因此，答案 b 是错误的。`pkgadd` 用于安装软件包。因此，答案 c 是错误的。`pkginfo` 用于显示软件包信息。因此，答案 e 是错误的。\n\
  \n262\n## 问题 35\n答案 c 正确。`-rwxrwsw` 显示开启了 setgid 的文件模式。`srwxrwx` 和 `-rwxrws` 不是有效的访问模式。因此，答案\
  \ a 和 d 是错误的。`-rwxrwt` 显示粘滞位（sticky bit）。因此，答案 b 和 e 是错误的。\n\n## 问题 36\n正确答案是 `/etc/system`。\n\
  \n## 问题 37\n答案 a、b、c 正确。要从光盘安装软件包，可以使用设置了卷卷卷管理的 `admintool`、`pkgadd -d /cdrom/cdrom0`\
  \ 或未设置卷卷管理的 `admintool`。`-s` 命令行参数用于暂存（spool）软件包，而不是安装。因此，答案 d 是错误的。\n\n## 问题 38\n\
  答案 b 正确。`last` 命令显示退出系统的用户。`who` 和 `whodo` 命令显示当前登录系统的人。因此，答案 a 和 c 是错误的。`id` 显示用户的真实和有效\
  \ UID、GID 以及所属组。因此，答案 d 是错误的。\n\n## 问题 39\n答案 a 和 b 正确。执行 `admintool` 的账户必须是 root\
  \ 或 sysadmin 组的成员。登录系统的设备不影响访问。因此，答案 c 是错误的。sys 组和 adm 组不能开启 `admintool` 的访问。因此，答案\
  \ d 和 e 是错误的。\n\n## 问题 40\n正确答案是 `mt`。\n\n263\n## 问题 41\n答案 c 正确。使用 `setenv boot-device\
  \ disk2` 命令更改系统启动设备。其他答案都不是有效的 OpenBoot 命令。\n\n## 问题 42\n正确答案是 `groupdel` 或 `admintool`。\n\
  \n## 问题 43\n`admintool` 或 `pkginfo` 均正确。\n\n## 问题 44\n答案 c 正确。`setfacl` 的 `-s` 命令行参数会导致\
  \ ACL 被替换，而不是添加（`-m`）或删除（`-d`）。因此答案 a、b、d 是错误的。指定的访问模式 `rw-r--r--` 是 644，而不是 622。因此答案\
  \ e 是错误的。\n\n\n\n\n\n# 问题 45\n答案 d 正确。`eeprom` 命令可修改 NVRAM 参数。`setenv` 和 `set` 命令用于设置\
  \ shell 参数。因此，答案 a 和 b 是错误的。答案 c 和 e 中的命令不存在。\n\n# 问题 46\n答案 b 正确。你必须使用 `patchrm`\
  \ 逐个移除每个补丁。`patchrm` 命令不支持像 `patchadd` 命令那样的 `-M` 命令行参数。因此，答案 a 和 c 是错误的。\n\n# 问题\
  \ 47\n正确答案是 `shutdown`。\n\n# 问题 48\n答案 a 正确。在 `/etc/default/kbd` 文件中添加 `KEYBOARD_ABORT=enable`\
  \ 将配置系统允许你使用键盘序列来终止系统操作。答案 b、c 和 d 中的选项不会产生有意义的结果。\n\n# 问题 49\n`admintool` 或 `pkgrm`\
  \ 都是正确的。\n\n# 问题 50\n答案 a、b、c 和 d 都是正确的。任何一种情况都会导致 `patchrm` 命令失败。\n\n# 问题 51\n\
  答案 b 和 c 正确。如果你的当前工作目录是 `/var/spool/patch`，则不需要完整路径。`pkgadd` 命令可用于安装包，而不是补丁。因此，答案\
  \ a 是错误的。`patch` 命令是用于更新文本文件的用户命令，与系统补丁无关。因此，答案 d 是错误的。\n\n# 问题 52\n答案 b 正确。系统配置文件\
  \ `/etc/profile` 在用户主目录下的 `.profile` 之前执行。答案 a 和 c 是错误的。\n\n# 问题 53\n答案 b 正确。所有其他阶段发生在\
  \ Boot PROM (SPARC) 或 BIOS (x86) 阶段之后。因此，答案 a、c 和 d 是错误的。\n\n# 问题 54\n答案 a、c 和 d\
  \ 都是正确的。`-v` 启用详细模式。指定的设备必须是原始设备。此外，使用 `newfs` 命令的主要优势是它能计算出所有必要的 `mkfs` 命令行参数。`newfs`\
  \ 命令只能用于创建 UFS 文件系统。因此，答案 b 是错误的。\n\n# 问题 55\n正确答案是 `-s 4`。\n\n# 问题 56\n答案 b 正确。命令\
  \ `ufsdump 0u /dev/rdsk/c0t1d0s5` 备份位于由 `c0t1d0s5` 标识的磁盘驱动器整个文件系统。`ufsdump 0u /dev/dsk/c0t1d0s5`\
  \ 使用设备名称（`/dev/dsk`）而不是原始设备名称（`/dev/rdsk`）。因此，答案 a 是错误的。`ufsdump 9u /dev/rdsk/c0t1d0s5`\
  \ 使用 dump 级别 9 而不是 dump 级别 0。因此，答案 c 是错误的。在命令 `ufsdump 9u /dev/dsk/c0t1d0s5` 中，dump\
  \ 级别和设备名称都是错误的。因此，答案 d 是错误的。\n\n# 问题 57\n正确答案是 `instance`。\n\n## 第二部分：考试 310-012\n\
