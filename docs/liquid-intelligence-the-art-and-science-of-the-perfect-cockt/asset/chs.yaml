  “driver-name` 表示设备名称，`@ unit-address` 是父节点地址空间中的设备物理地址，`:device arguments` 定义了关于设备的额外信息。例如，以下设备地址表示\
  \ SPARC 系统上的一个分区：`/dev/scsi/c0t0d0”（等等，用户的文本实际上是：）“driver-name` 表示设备名称，`@ unit-address`\
