  \n\n\n\n不像在第 17 章和第 18 章中的 War-FTP 漏洞利用示例中那样将我们的缓冲区变量设置为包含 1,100 个 `A` 的字符串，我们将在示例\
  \ 19-3 中创建一个变长度的字符串数组。\n\n### 示例 19-3. 一个简单的 TFTP 模糊测试程序\n\n```python\n#!/usr/bin/python\n\
  import socket\nbufferarray = [\"A\"*100] ❶\naddition = 200\nwhile len(bufferarray)\
  \ <= 50: ❷\n        bufferarray.append(\"A\"*addition) ❸\n        addition += 100\n\
  for value in bufferarray: ❹\n        tftppacket = \"\\x00\\x02\" + \"Georgia\" +\
  \ \"\\x00\" + value + \"\\x00\" ❺\n        print \"Fuzzing with length \" + str(len(value))\n\
  \        s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM) ❻\n        s.sendto(tftppacket,('192.168.20.10',69))\n\
  \        response = s.recvfrom(2048)\n        print response\n```\n\n数组中的第一个项将是\
  \ 100 个 `A` 的字符串 ❶。但在向 TFTP 服务器发送任何数据包之前，让我们创建其余模糊测试字符串，并通过以 100 为增量添加新的模糊测试字符串将其追加到数组中。使用\
  \ `while` 循环，我们将向数组追加逐渐变长的字符串，直到其长度达到 50 个元素 ❷。每循环一次 `while` 循环，数组就会追加一个新元素 ❸。在我们创建完模糊测试字符串且\
  \ `while` 循环退出后，我们将进入 `for` 循环 ❹，它将依次获取数组的每个元素，并将其发送合法 TFTP 数据包的 Mode 字段中 ❺。\n\n\
  我们的数据包符合 TFTP RFC 的规范。我们使用了模式 `02`（写请求）和文件名 `Georgia`。来自数组的 `A` 字符串被放入 Mode 字段中。希望我们不断增长的字符串之一会导致程序崩溃。\n\
  \n设置网络套接字与我们在上一章中用 Python 攻击 FTP 时学到的有所不同。因为 TFTP 是 UDP 协议，我们需要设置 UDP 套接字而不是 TCP\
