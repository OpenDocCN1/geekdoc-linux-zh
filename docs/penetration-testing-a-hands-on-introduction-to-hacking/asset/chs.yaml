  \ `fuzzing` 的技术在易受攻击程序中寻找潜在漏洞。我们还将涵盖处理公共漏洞代码并安全地将其移植以满足我们的需求，以及构建自己的 Metasploit\
  \ 模块的基础。最后，我们将讨论我们的目标可能实施的一些漏洞利用缓解技术。\n\n## 模糊测试程序\n\n在第 17 章 中，我们使用一个 1,100 字节的利用字符串利用了\
  \ War-FTP 1.65 版本的用户名（Username）字段缓冲区溢出。自然而然的问题是，我们是如何知道用户名字段中的 1,100 个 `A` 会导致程序崩溃的？更重要的是，安全研究人员是如何首次发现这个漏洞的？在某些情况下，程序的源代码是公开的，因此，寻找漏洞的研究人员只需要精通安全编码实践即可。在其他情况下，我们可以使用一种名为\
  \ `fuzzing` 的流行方法向程序发送各种输入，希望发生一些奇怪的事情。\n\n### 通过代码审查发现 Bug\n\n在第 16 章 中，我们使用了一个简短的\
  \ Linux 程序来说明缓冲区溢出漏洞。在审计该程序的源代码时（如示例 19-1 所示），我们看到了 `strcpy` 函数❶。正如在该章中讨论的，该函数没有进行边界检查，可能存在安全风险。\n\
  \n示例 19-1. 易漏洞的 C 代码\n\n```\n#include <string.h>\n#include <stdio.h>\n\nvoid overflowed()\
  \ {\n        printf(\"%s\\n\", \"Execution Hijacked\");\n}\n\nvoid function(char\
  \ *str){\n        char buffer[5];\n        strcpy(buffer, str); ❶\n}\nvoid main(int\
  \ argc, char *argv[])\n{\n        function(argv[1]); ❷\n        printf(\"%s\\n\"\
  , \"Executed normally\");\n}\n```\n\n通读这段源代码，我们看到用户输入（第一个程序参数）被传递给 `function` ❷。然后，使用\
