  \ 抽出时间来到詹姆斯·麦迪逊大学，并在比赛后访问了 CCDC 团队。就在那天，我决定在信息安全领域发展事业。\n\n感谢 John Fulmer 在无线章节中为我提供加密细节方面的帮助。\n\
  \n感谢 Rachel Russell 和 Micheal Cottingham，做我的第一批信息安全伙伴。\n\n感谢 Jason 和 Rachel Oliver\
  \ 提供技术和内容审查，还感谢你们在 ShmooCon 和 Black Hat 上打造了完美的烟熏眼妆。\n\n感谢 Joe McCray，我的信息安全大哥，在我学习如何经营信息安全业务时担任我的导师。\n\
  \n感谢 Leonard Chin 给了我第一次参加大型国际会议的经历，以及成为会议培训师的信心。\n\n感谢 Brian Carty 帮助我构建了在线实验室。\n\
  \n感谢 Tom Bruch 在我没有工作时让我住进他家里，那时我 DARPA 的补助还没到账。\n\n感谢 Dave Kennedy 为我提供了几次绝佳的机会介绍。\n\
  \n感谢 Grecs 帮助在他的网站上推销我的课程。\n\n感谢 Raphael Mudge 引荐我加入了 DARPA 网络快速通道计划以及许多其他绝佳的机会。\n\
  \n感谢 Peter Hesse 和 Gene Meltser，迫使我在职业生涯的关键节点勇敢向上迈升。\n\n感谢 Jayson Street，你比我还要挑食，这使得我在国外的讲师晚宴上几乎看起来像个正常人。你是最棒的。\n\
  \n感谢 Ian Amit 在我刚起步时向我推荐了几个很棒的演讲机会。\n\n感谢 Martin Bos，你太棒了。你懂我的意思。\n\n感谢 Jason Kent\
  \ 提供的所有全球首发升级以及用于定义的精妙反复说明，其中一些出现在了书中。\n\n感谢我在詹姆斯·麦迪逊大学的教授们，特别是 Samuel T. Redwine——你们带给我的启发远超你们想象。\n\
  \n感谢 No Starch Press 的人们在开发本书期间提供的帮助与支持，包括 Alison Law、Tyler Ortman 和 KC Crowell。特别感谢我的编辑以及\
  \ No Starch 的出版经理 Bill Pollock。\n\n## 引言\n\n我决定写这本书，是因为它正是我在开始信息安全职业时希望拥有的那种书。虽然现在的信息网站确实比我刚开始时要多得多，但我发现对于初学者来说，知道先读什么以及从哪里获取预期的基础技能仍然很困难。同样，市场上有很多书——有几本关于高级主题的好书，需要一些背景知识；也有许多针对初学者的好书，涵盖了大量的理论。但我还没有找到任何一本书，能向那些给我邮件寻求信息安全起步之法的可能的渗透测试者说明我想说的一切。\n\
  \n在我的教学生涯中，我一直发现最喜欢的课程是《渗透测试导论》。学生们对知识的渴求让与他们相处非常有趣。因此，当 No Starch Press 找我写书时，这是我提议的书。当我宣布它时，许多人认为我正在写一本关于移动安全的书，但在考虑这一点时，我认为一本渗透测试导论会对我最想触达的读者产生最大的影响。\n\
  \n## 鸣谢\n\n像这样的一本书如果没有信息安全社区多年来的奉献工作，是不可能实现的。书中讨论的工具和技术和我同事在执行任务时经常使用的工具，它们是通过全球渗透测试人员和其他安全专家的共同努力开发的。我为其中一些开源项目做过贡献（例如\
  \ `Mona.py`，我们将在漏洞开发章节中使用它），我希望这本书能激励你也做同样的事。\n\n我想借此机会感谢 Offensive Security 创建并维护了领域内及本书广泛使用的\
  \ `Kali Linux` 渗透测试发行版。很大一部分功劳也属于 `Metasploit Framework` 的核心开发者以及其大量的社区贡献者。同时也感谢所有向社区分享知识、发现和技术的渗透测试人员和研究人员，使我们能更有效地评估客户的安全态势，并让像我这样的老师能将其与学生一起使用。\n\
  \n还要感谢那些优秀书籍、博客文章、课程的创作者，他们帮助我实现了成为专业渗透测试人员的目标。现在，我希望将我获得的知识分享给其他有志向的渗透测试者。\n\n\
  在本书书中学习这本书，你需要了解如何在计算机上安装软件。仅此而已。你不需要成为 `Linux` 专家，也不需要了解网络协议原理的细节。当你遇到不熟悉的话题时，如果需要，我鼓励你在我的解释之外进行一些课外研究——我们将逐步讲解所有对你来说可能是新出的工具和技术，从\
  \ `Linux` 命令行开始。当我进入信息安全领域时，我做过最接近黑客的操作就是让 `Windows XP` SP2 之前的开始菜单显示为“Georgia”而不是“开始”。当时我对自己还感到非常自豪。\n\
  \n然后我参加了大学生网络防御竞赛（CCDC），当时所有的红队成员都在以极快的速度使用命令行，从拥挤房间的另一侧让我的桌面上弹出窗口。我只知道我想像他们一样。从那时起，我付出了许多努力，并且在我努力达到信息安全最高水平时，还会有更多的努力。我只希望通过这本书能激励更多的人遵循同样的道路。\n\
  \n### 第一部分：基础\n\n在 `渗透测试入门` 中，我们从渗透测试阶段的一些基本定义开始。在 `第一章` 中，我们构建了自己的小型实践实验室，我们将用它来完成书中的练习。对于很多书，你可能只需要在你现有的平台上下载几个程序，但为了模拟渗透测试，我们的方法要复杂一些。我建议你花时间建立你的实验室，并与我一起完成实操案例。虽然这本书可以作为实战中的参考和提醒，但我认为最好是先在家里练习你的渗透测试技能。\n\
  \n\n\n\n\n在`第 2 章`中，我们将从使用 Kali Linux 以及通用 Linux 操作系统的基础知识开始。接下来，`第 3 章`将涵盖编程基础。某些读者可能在这些领域已经具备了知识，可以跳过这些部分。当我刚开始学习时，我在\
  \ `C` 和 `Java` 方面有一些编程经验，但我没有脚本编写背景，几乎没有 Linux 基础——而我遇到的大多数黑客教程都默认你具备这些技能。因此，我在这里提供了一个入门指南。如果你是这些领域的新手，请务必在书外继续你的学习。基于\
  \ Linux 的操作系统作为移动设备和网络服务的平台正变得越来越流行，因此即使你不打算从事信息安全行业，这些技能也将令你受益浅。同样，无论你的职业如何，了解如何为常用任务编写只会会让生活变得更容易。\n\
  \n我们在`第 4 章`中将介绍 Metasploit Framework 的基础用法，这是一个我们将在书中贯穿始终的工具。尽管我们也会学习在没有 Metasploit\
  \ 的情况下执行许多任务，但它是许多许多渗透测试人员的首选工具，并且不断进化以包含最新的威胁和技术。\n\n# 第二部分：评估\n\n接下来，我们开始进行模拟渗透测试。在`第\
  \ 5 章`中，我们首先从收集目标数据开始——包括通过搜索网络上的公开信息以及与我们的目标系统进行交互。然后，我们将在`第 6 章`中通过结合系统查询和研究来寻找漏洞。在`第\
  \ 7 章`中，我们将查看可能包含敏感数据的流量捕技术。\n\n### 第三部分：攻击\n\n接下来，在`第 8 章`中，我们将使用各种工具和技术（包括 Metasploit\
  \ 和纯手动利用）来利用我们在网络上发现的漏洞。然后，我们在`第 9 章`中研究攻击网络安全中最薄弱的环节——密码管理的方法。\n\n我们接下来查看一些更高级的漏洞利用技术。并不是所有漏洞都存在于网络监听的服务中。Web\
  \ 浏览器、PDF 阅读器、`Java`、`Microsoft Office`——它们都遇到过安全问题。随着客户努力保护其网络，攻击客户端软件可能是获取网络中立足点的关键。我们在`第\
  \ 10 章`中查看如何利用客户端攻击。在`第 11 章`中，我们将客户端攻击与社会工程结合起来，即攻击“人为因素”——这是环境中无法通过补丁修补的部分。毕竟，通过客户端攻击，相关软件必须打开某种恶意文件，因此我们必须说服用户提供帮助。在`第\
  \ 12 章`中，我们将查看一些绕过杀毒软件的方法，因为你的许多客户都会部署它。如果你在系统上拥有足够的权限，你可能可以直接关闭杀毒程序，但更好的解决方案是在不被检测到的情况下直接绕过杀毒程序，即使你将恶意程序保存到硬盘上也可以。\n\
  \n在`第 13 章`中，我们将进入渗透测试的下一阶段：后利用。有人说，渗透测试在漏洞利用之后才真正开始。在这里，你利用访问权限来寻找更多待攻击的系统、窃取的敏感信息等。如果你继续学习渗透测试，你将花费大量时间研究最新、最强大的后利用技术。\n\
  \n在后利用之后，我们将查看成为一名全能渗透测试人员所需的额外技能。我们将在`第 14 章`中简要评估自定义 Web 应用程序的安全性。如今每个人都有网站，所以这是一项值得培养的技能。接下来我们将在`第\
  \ 15 章`中查看无线网络的安全性评估，研究破解常用加密系统的方法。\n\n### 第四部分：漏洞利用开发\n\n`第 16 章`、`第 17 章`、`第 18\
  \ 章`以及`第 19 章`讨论了编写自己漏洞利用程序的基础。我们将学习寻找漏洞、使用常用技术对其进行利用，甚至编写我们自己的 Metasploit 模块。在这些章节之前，我们的大部分练习依赖于工具和公开的漏洞利用程序。随着你在信息安全领域的不断进步，你可能想要发现新的漏洞（称为\
  \ `zero-days`）并向厂商报告以获取可能的赏金。然后你可以发布公共利用程序和/或 Metasploit 模块，帮助其他渗透测试人员测试其客户的环境中是否存在你发现的问题。\n\
  \n### 第五部分：移动黑客\n\n最后，在`第 20 章`中，我们将渗透测试中一个较新的领域作为结束——评估移动设备的安全性。我们将查看我自己的工具智能手机渗透测试框架（Smartphone\
  \ Pentest Framework）。也许在掌握了书中的技能后，你也会尝试开发并发布你自己的安全工具。\n\n当然，这本书没有涵盖信息安全的每一个方面，也没有涵盖每一个工具或技术。如果那样的话，这本书将长好几倍，而且出版时间会晚得多，而我需要回到我的研究中去。所以这就是你要的：一个关于黑客技术的实战介绍。能在进入信息安全旅程的这一一步与你们在一起是我的荣幸。我希望你从书中中学到很多，并激励你继续学习，成为这个令人兴奋且快速发展的领域的活跃成员。\n\
  \n## 渗透测试入门\n\n*渗透测试*（*Penetration testing*，或 *pentesting*，不要与测试圆珠笔或钢水笔搞混）涉及模拟真实攻击，以评估与潜在安全泄露相关的风险。在渗透测试中（与漏洞评估不同），测试人员不仅发现攻击者可以利用的漏洞，还会尽可能地对漏洞进行利用，以评估攻击者在成功利用后可能获得什么。\n\
  \n偶尔会有新闻报道说某家大公司遭受了网络攻击。通常情况下，攻击者并没有使用最新、最强大的 `zero-day`（软件发行者尚未修补的漏洞）。拥有巨额安全预算的大公司受于其网站上的\
  \ SQL 注入漏洞、针对员工的社会工程学攻击、面向的服务的弱密码等问题。换句话说，公司正在通过安全漏洞丢失专有数据并泄露其客户的个人详情。在渗透测试中，我们在攻击者之前发现这些问题，并建议如何修复它们以及避免未来的漏洞。\n\
  \n\n\n\n\n你的渗透测试范围会因客户而异，你承担的任务也是如此。某些客户拥有极佳的安全态势，而另一些客户可能存在漏洞，允许攻击者突破防御边界并访问内部系统。\n\
  \n你还可能被要求评估一个或多个自定义 Web 应用程序。你可能需要执行社交工程和客户端攻击来获取客户内部网络的访问权限。某些渗透测试要求你像内部人员一样——即恶意员工或已经突破边界的攻击者——执行`internal\
  \ penetration test`（内部渗透测试）。某些客户会要求`external penetration test`（外部渗透测试），即你通过互联网模拟攻击。有些客户可能希望你评估其办公室无线网络的安全性。在某些情况下，你甚至可能审计客户的物理安全控制。\n\
  \n## 渗透测试的阶段\n\n渗透测试始于`pre-engagement`（前期约定）阶段，这涉及到与客户讨论他们的渗透测试目标、规划范围（测试的范围和参数）等。当渗透测试人员和客户对范围、报告格式和其他议题达成一致后，实际测试就开始了。\n\
  \n在`information-gathering`（信息收集）阶段，渗透测试人员搜索有关客户的公开信息，并识别连接其系统的潜在方式。在`threat-modeling`（威胁建模）阶段，测试人员利用这些信息来确定每个发现的价值，以及如果该发现允许攻击者入侵系统，对客户产生的影响。这种评估使测试人员能够制定行动计划和攻击方法。\n\
  \n在渗透测试人员开始攻击系统之前，他/她会进行`vulnerability analysis`（漏洞分析）。在此阶段，渗透测试人员尝试发现系统中的漏洞，以便在`exploitation`（利用）阶段利用。成功的利用可能会导致`post-exploitation`（后渗透）阶段，即利用利用的结果寻找额外信息、敏感数据、其他系统的访问权限等。\n\
  \n最后，在`reporting`（报告）阶段，渗透测试人员为高管和技术人员人员总结发现的结果。\n\n### Note\n\n关于渗透测试的更多信息，一个很好的起点是《渗透测试执行标准》(PTES)，地址为`[http://www.pentest-standard.org/]`。\n\
  \n### Pre-engagement\n\n在渗透测试开始之前，渗透测试人员与客户进行前期互动，以确保所有人对渗透测试达成共识。渗透测试人员与期望简单漏洞扫描的客户之间的沟通误解可能会导致尴尬的局面，因为渗透测试要具侵入性得多。\n\
  \n前期约定阶段是你应该花时间理解客户渗透测试的业务目标的阶段。如果这是他们的第一次渗透测试，是什么促使他们寻找渗透测试人员？他们最担心哪些暴露风险？他们是否有任何在测试时需要小心处理的脆弱设备？（我遇到过从风力发电机到连接在网络上的患者医疗设备无什么没有的。）\n\
  \n就客户的业务提问。什么对他们最重要？例如，对于顶尖在线供应商来说，几小时的停机可能意味着数千美元的收入损失。对于当地银行来说，在线银行网站宕机几小时可能会让一些客户不满，但这种停机影响远没有信用卡数据库泄露那么毁灭性。对于信息安全供应商来说，其首页被贴满攻击者的无礼信息可能会导致声誉受损，并雪演变成巨大的收入损失。\n\
  \n在渗透测试前期约定阶段需要讨论并达成一致的其他重要事项包括：\n\n#### Scope（范围）\n\n* 哪些 IP 地址或主机在范围内，哪些不在范围内？客户允许你执行哪些类型的操作？你是否允许使用利用程序并可能导致服务崩溃，还是应该将评估仅限于检测可能存在的漏洞？客户是否理解即使是简单的端口扫描也可能导致服务器或路由器崩溃？你是否允许执行社交工程攻击？\n\
  \n#### The testing window（测试窗口）\n\n* 客户可能希望你仅特定的时间内或日期进行测试。\n\n#### Contact information（联系信息）\n\
  \n* 如果你发现了严重问题，应该联系谁？客户是否期望你 24 小时待命？他们是否倾向于你使用加密邮件？\n\n#### A “get out of jail\
  \ free” card（免死金牌）\n\n* 确保你有权对目标进行渗透测试。如果目标不属于该公司（例如，因为它由第三方托管），请确保客户已获得第三方的正式批准进行渗透测试。无论如何，确保你的合同中包含一份在发生意外情况时限制你责任的声明，并获得执行测试的书面许可。\n\
  \n#### Payment terms（付款条款）\n\n* 如何以及何时支付报酬，金额是多少？\n\n最后，在你的合同中加入保密协议条款。客户将感谢你对对渗透测试及任何发现保密的书面承诺。\n\
  \n### Information Gathering（信息收集）\n\n接下来是信息收集阶段。在此阶段，你分析免费获取的信息源，这一过程被称为收集`open\
  \ source intelligence (OSINT)`（开源情报）。你还开始使用端口扫描器等工具来了解互联网或内部网络上存在哪些系统以及运行着什么软件。我们将在`Chapter\
  \ 5`中详细探讨信息收集。\n\n### Threat Modeling（威胁建模）\n\n根据信息收集阶段获得的知识，我们进入威胁建模。在这里，我们像攻击者一样思考，并根据收集到的信息制定攻击计划。例如，如果客户开发专有软件，攻击者可以通过访问开发和测试源代码的内部系统并将公司机密卖给竞争对手来破坏该组织。\n\
  \n### Vulnerability Analysis（漏洞分析）\n\n接下来，渗透测试人员开始主动发现漏洞，以确定他们的利用策略可能成功。失败的利用可能会导致服务崩溃、触发入侵检测警报并破坏你成功的机会。通常在此阶段，渗透测试人员运行漏洞扫描器，扫描器利用漏洞数据库和一系列活动检查对系统中存在的漏洞做出最佳猜测。但尽管漏洞扫描器是强大的工具，但它们无法完全替代批判性思维，因此在此阶段我们也进行手动分析并验证结果。我们将在`Chapter\
  \ 6`中探索各种漏洞识别工具和技术。\n\n### Exploitation（利用）\n\n现在是好玩的部分：利用。在这里，我们针对发现的漏洞运行利用程序（有时使用\
  \ `Metasploit` 等工具），以尝试访问客户系统。正如你所看到的，某些漏洞非常容易利用，例如使用默认密码登录。我们将在`Chapter 8`中查看利用。\n\
  \n### Post Exploitation（后渗透）\n\n\n\n\n\n有人说，渗透测试只有在漏洞利用之后（即后利用阶段）才真正开始。你已经进入了系统，但这种入侵对客户来说到底意味着什么？如果你破解了一个未打补丁的遗留系统，该系统不属于任何域，也没有与其他高价值目标联网，且该系统不包含任何攻击者感兴趣的信息，那么该漏洞的风险将远低于你能够利用域控制器或客户的开发系统的风险。\n\
  \n在后利用阶段，我们会收集有关受攻击系统的信息，寻找感兴趣的文件，在必要时尝试提升权限等。例如，我们可能会转储密码哈希，以查看我们是否可以对其进行逆向破解，或者使用它们访问额外的系统。我们还可能尝试通过对受攻击机器进行`pivoting`（（渗透）来攻击之前无法访问的系统。我们将在第\
  \ 13 章中详细讨论后利用。\n\n## 报告\n\n渗透测试的最后一个阶段是报告。在这一阶段，我们以有意义的方式向客户传达我们的发现。我们会告诉他们哪些做法是正确的，哪里需要改进安全态势，你是是如何进入的，发现了什么，以及如何修复问题等。\n\
  \n编写一份良好的渗透测试报告是一门需要实践才能掌握的艺术。你需要向从负责修复漏洞的 IT 人员到向外部审计签署变更的高层管理人员每一个人清晰地传达你的发现。例如，如果一个非技术人员读到“然后我使用\
  \ `MS08-067` 获取了一个 shell”，他或她可能会想：“你的意思是，像贝壳（seashell）吗？”表达这种想法的更好方式是提到你能够访问或更改的私有数据。像“我能够读取你的电子邮件”这样的陈述会引起几乎任何人的共鸣。\n\
  \n渗透测试报告应该包含执行摘要和技术报告，正如后续章节讨论的那样。\n\n### 执行摘要\n\n执行摘要描述了测试目标，并对发现提供了高层概述。其目标受众是负责安全计划的高管。你的执行摘要应包含以下内容：\n\
  \n* **背景** . 对测试目的的描述，以及对任何高管来说可能不熟悉的术语的定义，例如 `vulnerability`（漏洞）和 `countermeasure`（防御措施）。\n\
  * `整体态势` . 对测试有效性的概述、发现的问题（例如利用了 `MS08-067` 漏洞）以及导致漏洞的通用问题（如缺乏补丁管理）。\n* `风险概况` .\
  \ 与相似组织相比，组织安全态势的整体排名，分为高、中、低等水平。你还应该包含对排名的解释。\n* `通用发现` . 对识别出的问题的概括性，以及关于已部署的任何防御措施有效性的统计数据和指标。\n\
  * `建议总结` . 修复渗透测试中发现的问题所需任务的高层概述。\n* `战略路线图` . 为客户提供改进其安全态势的短期和长期目标。例如，你可能会告诉他们现在应用某些补丁以解决短期疑虑，但如果没有长期的补丁管理计划，客户在新的补丁发布后将仍然处于同样的境地。\n\
  \n### 技术报告\n\n报告的这一部分提供了测试的各个细节。它应该包含以下内容：\n\n* **引言** . 范围、联系人等详细信息的清单。\n* `信息收集`\
  \ . 信息收集阶段发现的详细情况。特别感兴趣的是客户的互联网足迹。\n* `漏洞评估` . 漏洞评估阶段发现的详细情况。\n* `利用验证` . 利用验证阶段发现的详细情况。\n\
  * `后利用` . 后利用阶段的详细情况。\n* `风险暴露` . 风险的详细情况。\n* `结论` .\n\n## 总结\n\n本章简要介绍了渗透测试的各个阶段，包括准备、信息收集、威胁建模、漏洞分析、利用、后利用和报告。\n\
  \n# 第一部分 基础\n\n## 第 1 章 搭建你的虚拟实验室\n\n在学习本书的过程中，你将通过使用虚拟机软件在单台物理机运行运行操作系统来学习各种工具和技术。\n\
  \n## 安装 VMware\n\n作为搭建虚拟实验室的第一步，下载并安装 VMware。`VMware Player` 可供 Windows 和 Linux\
  \ 免费使用（http://www.vmware.com/products/player/）。VMware 还为 Windows 提供 `VMware Workstation`（http://www.vmware.com/products/workstation/），包含快照等额外功能。`VMware\
  \ Workstation` 可免费 30 天，之后你需要购买它或切换回 `VMware Player`。\n\nMac 用户可以免费试用 30 天的 `VMware\
  \ Fusion`（http://www.vmware.com/products/fusion/），之后费用约为 50 美元。作为 Mac 用户，我在书中将全程使用\
  \ `VMware Fusion`，但也包含了 `VMware Player` 的设置说明。\n\n下载与你的操作系统架构（32 位或 64 位）匹配的 VMware\
  \ 版本。如果你在安装 VMware 时遇到任何问题，可以在 VMware 网站找到大量支持。\n\n## 安装 Kali Linux\n\n`Kali Linux`\
  \ 是一个基于 Debian 的 Linux 发行版，预装了我们在书中使用的各种安全工具。本书是针对 `Kali 1.0.6` 编写的，这是写作时的版本。你可以在本书的网站（http://nostarch.com/pentesting/）找到包含\
  \ Kali 1.0.6 的种子链接。随着时间的推移，Kali 会发布新版本。如果你愿意，可以从 http://www.kali.org/ 下载最新版本的 Kali。但请注意，我们在书中使用的许多工具仍在开发中，因此如果你使用较新版本的\
  \ Kali，某些练习可能会与书中的演示有所不同。如果你希望一切都按照书中运行，我建议使用种子文件中提供的 `Kali 1.0.6` 版本（文件名为 `kali-linux-1.0.6-vm-i486.7z`），这是一个预构建的\
  \ VMware 镜像。\n\n\n\n\n\n1. 一旦解压 7-Zip 压缩包，在 VMware 中进入 `File` ▸ `Open`，并指向解压后的 `Kali\
  \ Linux 1.0.6 32 bit` 文件夹中的 `Kali Linux 1.0.6 32 bit.vmx` 文件。\n\n2. 虚拟机打开后，点击 `Play`\
  \ 按钮。当弹出如图 1-1 所示所示，选择 `I copied it`（我复制过）。\n\n3. 当 Kali Linux 启动时，你将看到如图 1-2 所示的提示。选择顶部高亮的（默认）选项。\n\
  \n![启动 Kali Linux 虚拟机](img/httpatomoreillycomsourcenostarchimages2030194.png.jpg)图\
  \ 1-1. 启动 Kali Linux 虚拟机![启动 Kali Linux](img/httpatomoreillycomsourcenostarchimages2030196.png.jpg)图\
  \ 1-2. 启动 Kali Linux\n\n4. Kali Linux 启动后，你将看到一个如图 1-3 所示的登录界面。\n\n![Kali 登录界面](img/httpatomoreillycomsourcenostarchimages2030198.png.jpg)图\
  \ 1-3. Kali 登录界面\n\n5. 点击 `Other` 并输入 Kali Linux 的默认凭据 `root:toor`，如图 1-4 所示。然后点击\
  \ `Log In` 按钮。\n\n![登录 Kali](img/httpatomoreillycomsourcenostarchimages2030200.png.jpg)图\
  \ 1-4. 登录 Kali\n\n6. 你将看到一个如图 1-5 所示的界面。\n\n![Kali Linux GUI](img/httpatomoreillycomsourcenostarchimages2030202.png.jpg)图\
  \ 1-5. Kali Linux GUI\n\n### 为你的虚拟机配置网络\n\n由于我们将使用 Kali Linux 通过网络攻击目标系统，因此我们需要将所有的虚拟机放在同一个虚拟网络中（我们将在第\
  \ 13 章中查看在网络之间切换的示例，该章节涵盖了漏洞利用）。VMware 提供三种虚拟网络连接选项：桥接（bridged）、NAT 和主机 only（host\
  \ only）。你应该选择桥接选项，以下是关于每个选项的一些信息：\n\n* `bridged network`（桥接网络）使用与主机系统相同的连接将虚拟机直接连接到本地网络。对于本地网络而言，我们的虚拟机只是另一个节点，拥有自己的\
  \ IP 地址。\n* `NAT`（network address translation 的写，网络地址翻译）在主机上建立一个私有网络。该私有网络将虚拟机的出站流量翻译到本地网络。在本地网络上，来自虚拟机的流量看起来来自主机的\
  \ IP 地址。\n* `host-only`（主机网络）将虚拟机限制在主机的本地私有网络中。虚拟机能够与 host-only 网络中的其他虚拟机以及主机本身通信，但它无法与本地网络或互联网发送或接收任何流量。\n\
  \n### 注意事项\n\n由于我们的目标虚拟机具有多个已知的安全漏洞，在将它们连接到本地网络时要要小心，因为该网络上的其他人也可以攻击这些机器。出于此原因，我不建议在你不信任其他用户的公共网络上通过此书进行学习。\n\
  \n默认情况下，Kali Linux 虚拟机网络适配器设置为 NAT。以下是在 Windows 和 Mac OS 上更改该选项的方法。\n\n#### Microsoft\
  \ Windows 上的 VMware Player\n\n要更改 Windows 版 VMware Player 虚拟网络，启动 VMware Player\
  \ 并点击你的 Kali Linux 虚拟机。选择 `Edit virtual machine settings`，如图 1-6 所示。（如果你仍在 VMware\
  \ Player 中运行 Kali Linux，请选择 `Player` ▸ `Manage` ▸ `Virtual machine settings`。）\n\
  \n![更改 VMware 网络适配器](img/httpatomoreillycomsourcenostarchimages2030204.png.jpg)图\
  \ 1-6. 更改 VMware 网络适配器\n\n在下一个屏幕上，在 `Hardware` 选项卡中选择 `Network Adapter`，并在 `Network\
  \ connection` 部分中选择 `Bridged` 选项，如图 1-7 所示。\n\n![更改网络适配器设置](img/httpatomoreillycomsourcenostarchimages2030206.png.jpg)图\
  \ 1-7. 更改网络适配器设置\n\n现在点击 `Configure Adapters` 按钮，并勾选你与主机操作系统正在使用的网络适配器。如图 1-8 所示，我只选择了\
  \ Realtek 无线适配器。完成选择后，按下 `OK`。\n\n![选择网络适配器](img/httpatomoreillycomsourcenostarchimages2030208.png.jpg)图\
  \ 1-8. 选择网络适配器\n\n#### Mac OS 上的 VMware Fusion\n\n要更改 VMware Fusion 中的虚拟网络连接，进入\
  \ `Virtual Machine` ▸ `Network Adapter` 并将 NAT 更改为 Bridged，如图 1-9 所示。\n\n![更改网络适配器](img/httpatomoreillycomsourcenostarchimages2030210.png.jpg)图\
  \ 1-9. 更改网络适配器\n\n### 将虚拟机连接到网络\n\n一旦进行切换，Kali Linux 应该会自动从桥接网络获取 IP 地址。要验证你的 IP\
  \ 地址，点击 Kali 屏幕左上角的终端图标（带有 `>_` 符号的黑色矩形）打开 Linux 终端（或选择 `Applications` ▸ `Accessories`\
  \ ▸ `Terminal`）。然后运行命令 `ifconfig` 查看你的网络信息，如示例 1-1 所示。\n\n示例 1-1. 网络信息\n\n```\n\
  root@kali:~# ifconfig\neth0      Link encap:Ethernet  HWaddr 00:0c:29:df:7e:4d\n\
  \          inet addr:192.168.20.9  Bcast:192.168.20.255  Mask:255.255.255.0\n  \
  \        inet6 addr: fe80::20c:29ff:fedf:7e4d/64 Scope:Link\n--snip--\n```\n\n###\
  \ 注意事项\n\n提示符 `root@kali:~#` 是超级用户（root）提示符。我们将在第 2 章中学习更多关于此以及我们用于设置的其他 Linux 命令。\n\
  \n该虚拟机的 IPv4 地址为 `192.168.20.9`，如示例 1-1 中加粗显示所示。（你的机器 IP 地址可能会不同。）\n\n#### 测试你的网络访问\n\
  \n现在确保 Kali Linux 可以连接到互联网。我们将使用 `ping` 网络工具检查是否可以访问 Google。确保你的电脑已连接互联网，打开 Linux\
  \ 终端，并输入以下内容。\n\n```\nroot@kali:~# ping www.google.com\n```\n\n如果你看到类似的内容，说明你在线。（我们将在第\
  \ 3 章中学习更多关于 `ping` 命令。）\n\n```\nPING www.google.com (50.0.2.221) 56(84) bytes of\
  \ data.\n64 bytes from cache.google.com (50.0.2.221): icmp_req=1 ttl=60 time=28.7\
  \ ms\n64 bytes from cache.google.com (50.0.2.221): icmp_req=2 ttl=60 time=28.1 ms\n\
  64 bytes from cache.google.com (50.0.2.221): icmp_req=3 ttl=60 time=27.4 ms\n64\
  \ bytes from cache.google.com (50.0.2.221): icmp_req=4 ttl=60 time=29.4 ms\n64 bytes\
  \ from cache.google.com (50.0.2.221): icmp_req=5 ttl=60 time=28.7 ms\n64 bytes from\
  \ cache.google.com (50.0.2.221): icmp_req=6 ttl=60 time=28.0 ms\n--snip--\n```\n\
  \n### 安装 Nessus\n\n\n\n\n\n虽然 Kali Linux 几乎包含了我们可能需要的每一个工具，但我们仍然需要安装一些额外的程序。首先，我们将安装\
  \ Tenable Security 的 Nessus Home 漏洞扫描器。该扫描器仅供家庭免费使用（你会在 Nessus 网站上看到限制说明）。请注意，Nessus\
  \ 的开发非常活跃，因此当前版本及其 GUI 自本书本书出版以来可能发生了一些变化。\n\n请使用以下步骤从 Kali 内部安装 Nessus Home：\n\n\
  1. 打开 `Applications` ▸ `Internet` ▸ `Iceweasel Web Browser`，并在地址栏输入 `http://www.tenable.com/products/nessus-home/`。完成“注册获取激活码”信息并点击\
  \ `Register`。（使用真实的电子邮件地址——稍后你需要用到激活码。）\n\n2. 到达下载页面后，选择适用于 Linux Debian 32 位平台的最新版本\
  \ Nessus（截至本文编写为 `Nessus-5.2.5-debian6_i386.deb`），并将其下载到根目录（默认下载位置）。\n\n3. 打开 Linux\
  \ 终端（点击 Kali 屏幕顶部的终端图标）以打开 root 提示符。\n\n4. 输入 `ls` 查看根目录下的文件列表。你应该能看到刚刚下载的 Nessus\
  \ 文件。\n\n5. 输入 `dpkg -i` 后跟你下载的文件名（你可以输入文件名的第一个字母并按 tab 键自动补全），然后按回车键开始安装过程。由于 Nessus\
  \ 需要处理各种插件，安装可能需要一段时间。。进度由一行哈希符号（`#`）显示。\n\n```\nSelecting previously unselected\
  \ package nessus.\n(Reading database ... 355024 files and directories currently\
  \ installed.)\nUnpacking nessus (from Nessus-5.2.5-debian6_amd64.deb) ...\nSetting\
  \ up nessus (5.2.5) ...\nnessusd (Nessus) 5.2.5 [build N25109] for Linux\nCopyright\
  \ (C) 1998 - 2014 Tenable Network Security, Inc\n\nProcessing the Nessus plugins...\n\
  [###########                                                 ]\n```\n\n6. 一旦返回 root\
  \ 提示符且没有错误，Nessus 应该已经安装完成，你会看到类似下面的消息。\n\n```\nAll plugins loaded\nFetching the\
  \ newest plugins from nessus.org...\nFetching the newest updates from Nessus.org...\n\
  Done. The Nessus server will start processing these plugins within a minute\nnessusd\
  \ (Nessus) 5.2.5 [build N25109] for Linux\nCopyright (C) 1998 - 2014 Tenable Network\
  \ Security, Inc\n\nProcessing the Nessus plugins...\n[##################################################]\n\
  \nAll plugins loaded\n\n - 你可以通过输入 /etc/init.d/nessusd start 来启动 nessusd\n - 然后访问\
  \ https://kali:8834/ 来配置你的扫描器\n```\n\n7. 现在输入以下内容来启动 Nessus。\n\n```\nroot@kali:~#\
  \ /etc/init.d/nessusd start\n```\n\n8. 在 Iceweasel 浏览器中打开 URL `https://kali:8834/`。你应该看到一个\
  \ SSL 证书警告，类似于图 1-10 所示。\n\n### 注意\n\n如果你在 Kali 的 Iceweasel 浏览器之外访问 Nessus，则需要访问\
  \ `https://<ipaddressofKali>:8834`。\n\n![Invalid SSL certificate warning](img/httpatomoreillycomsourcenostarchimages2030212.png.jpg)图\
  \ 1-10. 无效的 SSL 证书警告\n\n9. 展开 `I Understand the Risks` 并点击 `Add Exception`。然后点击\
  \ `Confirm Security Exception`，如图 1-11 所示。\n\n![Confirming the security exception](img/httpatomoreillycomsourcenostarchimages2030214.png.jpg)图\
  \ 1-11. 确认安全异常\n\n10. 点击打开的 Nessus 页面左角的 `Get Started`，并在后续页面输入用户名和密码。我的示例中选择了 `georgia:password`。如果你选择了其他的，请记住它，因为我们将在第\
  \ 6 章中使用 Nessus。（注意，我在本书中使用的密码都很差，你将遇到的许多客户也是这样。在生产环境中，你应该使用比 `password` 好得多的密码。）\n\
  \n11. 在下一页输入你通过 Tenable Security 收到的激活码。\n\n12. 在 Tenable Security 注册后，选择下载插件选项（下载需要一些时间）。一旦\
  \ Nessus 处理完插件，它将进行初始化。\n\n当 Nessus 完成插件下载并配置软件后，你应该能看到 Nessus 登录界面，如图 1-12 所示。你应该可以使用设置期间创建的账户凭据登录。\n\
  \n![Login screen of the Nessus web interface](img/httpatomoreillycomsourcenostarchimages2030216.png.jpg)图\
  \ 1-12. Nessus Web 界面登录界面\n\n要关闭 Nessus，只需关闭浏览器中的标签页即可。我们将在第 6 章中回到 Nessus。\n\n\
  ### 安装额外的软件\n\n我们还没有结束。请遵循这些指令完成你的 Kali Linux 安装。\n\n#### Ming C 编译器\n\n我们需要安装一个交叉编译器，以便可以将\
  \ C 代码编译并运行在 Microsoft Windows 系统上。Ming 编译器包含在 Kali Linux 仓库中，但默认没有安装。使用此命令安装它。\n\
  \n```\nroot@kali:~# apt-get install mingw32\n```\n\n#### Hyperion\n\n我们将使用 Hyperion\
  \ 加密程序来绕过杀毒软件。Hyperion 目前未包含在 Kali 仓库中。使用 `wget` 下载 Hyperion，解压它，并使用你上一步安装的 Ming\
  \ 交叉编译器对其进行编译，如示例 1-2 所示。\n\n示例 1-2. 安装 Hyperion\n\n```\nroot@kali:~# wget http://nullsecurity.net/tools/binary/Hyperion-1.0.zip\n\
  root@kali:~# unzip Hyperion-1.0.zip\nArchive:  Hyperion-1.0.zip\n   creating: Hyperion-1.0/\n\
  \   creating: Hyperion-1.0/FasmAES-1.0/\nroot@kali:~# i586-mingw32msvc-c++ Hyperion-1.0/Src/Crypter/*.cpp\
  \ -o hyperion.exe\n--snip--\n```\n\n#### Veil-Evasion\n\nVeil-Evasion 是一个生成可执行负载的工具，你可以用它绕过常见的杀毒解决方案。首先使用命令\
  \ `wget` 下载 Veil-Evasion Kali（参见示例 1-3）。接下来，解压下载的 `master.zip` 并进入 `Veil-master/setup`\
  \ 目录。最后，输入 `./setup.sh` 并遵循默认提示。\n\n示例 1-3. 安装 Veil-Evasion\n\n```\nroot@kali:~#\
  \ wget https://github.com/Chrisuncer/Veil/archive/master.zip\n--2015-11-26 09:54:10--\
  \  https://github.com/Chrisuncer/Veil/archive/master.zip\n--snip--\n2015-11-26 09:54:14\
  \ (880 KB/s) - `master.zip' saved [665425]\n\nroot@kali:~# unzip master.zip\nArchive:\
  \  master.zip\n948984fa75899dc45a1939ffbf4fc0e2ede0c4c\n   creating: Veil-Evasion-master/\n\
  --snip--\n  inflating: Veil-Evasion-master/tools/pyherion.py\nroot@kali:~# cd Veil-Evasion-master/setup\n\
  root@kali:~/Veil-Evasion-master/setup# ./setup.sh\n=========================================================\n\
  \ [Web]: https://www.veil-evasion.com | [Twitter]: @veileasion\n=========================================================\n\
  \n [*] Initializing Apt Dependencies Installation\n--snip—\nDo you want to continue?\
  \ [Y/n]? Y\n--snip--\nroot@kali:~#\n```\n\n#### Ettercap\n\nEttercap 是用于执行中间人攻击的工具。在第一次运行它之前，我们需要对\
  \ `/etc/ettercap/etter.conf` 配置文件进行几处更改。在 Kali root 提示符中使用 nano 编辑器打开它的配置文件。\n\n\
  ```\nroot@kali:~# nano /etc/ettercap/etter.conf\n```\n\n\n\n\n\n首先，将 `userid` 和\
  \ `groupid` 的值改为 `0`，以便 Ettercap 能够以 root 权限运行。向下滚动到文件中看到以下行的地方。将等号（`=`）后面的任何值替换为\
  \ `0`。\n\n```\n[privs]\nec_uid = 0                # nobody is the default\nec_gid\
  \ = 0                # nobody is the default\n```\n\n现在向下滚动到文件的 `Linux` 部分，并取消示例\
  \ 1-4 中 ❶ 和 ❷ 处所示两行的注释（删除开头的 `#` 字符），以设置 Iptables 防火墙规则重定向流量。\n\n示例 1-4. Ettercap\
  \ 配置\n\n```\n#---------------\n### Linux\n#---------------\n\n### if you use ipchains:\n\
  \   #redir_command_on = \"ipchains -A input -i %iface -p tcp -s 0/0 -d 0/0 %port\
  \ -j REDIRECT %rport\"\n   #redir_command_off = \"ipchains -D input -i %iface -p\
  \ tcp -s 0/0 -d 0/0 %port -j REDIRECT %rport\"\n\n### if you use iptables:\n   ❶\
  \ redir_command_on = \"iptables -t nat -A PREROUTING -i %iface -p tcp --dport %port\
  \ -j\n     REDIRECT    --to-port %rport\"\n   ❷ redir_command_off = \"iptables -t\
  \ nat -D PREROUTING -i %iface -p tcp --dport %port -j\n     REDIRECT    --to-port\
  \ %rport\"\n```\n\n按 `ctrl-X` 然后按 `Y` 保存更改并退出文件。\n\n### 设置 Android 模拟器\n\n现在我们将在\
  \ Kali 上设置三个 Android 模拟器，用于第 20 章中的移动测试。首先我们需要下载 Android SDK。\n\n1. 在 Kali 内部打开\
  \ Iceweasel 浏览器并访问 `[`developer.android.com/sdk/index.html`](https://developer.android.com/sdk/index.html)`。\n\
  \n2. 下载适用于 32 位 Linux 的当前版本 ADT 束，并将其保存到根目录。\n\n3. 打开终端，列出那里的文件（`ls`），并使用 `unzip`\
  \ 解压你刚刚下载的压缩包（`x` 代表你的文件名，因为自本文编写以来版本可能已经发生了变化）。\n\n```\nroot@kali:~# unzip adt-bundle-Linux-x86-xxxxxxxxxxx.zip\n\
  ```\n\n4. 现在使用 `cd` 进入新目录（目录名与去掉 `.zip` 扩展的文件名相同）。\n\n```\n### cd sdk/tools\n###\
  \ ./android\n```\n\n5. Android SDK Manager 应该打开，如图 1-13 所示。\n\n![The Android SDK\
  \ Manager](img/httpatomoreillycomsourcenostarchimages2030218.png.jpg)图 1-13. Android\
  \ SDK Manager\n\n我们将下载 Android SDK 工具和 Android SDK 平台工具（默认勾选）的任何更新，以及 Android 4.3\
  \ 和几个带有特定漏洞的旧版本 Android（Android 2.2 和 Android 2.1）。选择每个 Android 版本左侧的复框。然后（保持 Updates/New\
  \ 和 Installed 勾选）点击 `Install packages`，如图 1-14 所示。接受许可协议，Android SDK 将下载并安装选定的包。安装可能需要几分钟。\n\
  \n![Installing Android software](img/httpatomoreillycomsourcenostarchimages2030220.png.jpg)图\
  \ 1-14. 安装 Android 软件\n\n现在是时候我们的 Android 虚拟设备了。打开 Android SDK Manager 并选择 `Tools`\
  \ ▸ `Manage AVDs`。你应该看到图 1-15 所示的窗口。\n\n![Android Virtual Device Manager](img/httpatomoreillycomsourcenostarchimages2030222.png.jpg)图\
  \ 1-15. Android 虚拟设备管理器\n\n我们将根据 Android 4.3、2.2 和 2.1 创建三个 Android 模拟器，如图 1-16\
  \ 所示。为每个模拟器使用图中所示的值，但将 `Target` 的值设置为你想要构建的模拟器的 Android 版本（Android 4.3 的 Google\
  \ API 版本 [Google APIs version 18]、2.2 [Google APIs version 8] 和 2.1 [Google APIs\
  \ version 7]）。在 AVD Name 字段中填入描述性值。添加一个小的 SD 卡值（100MB 应该绰有余），以便你可以将文件下载到 Android\
  \ 模拟器。将 Device 设置为 `Nexus 4`，Skin 设置为 `Skin with dynamic hardware controls`。其他选项保持默认值。\n\
  \n![Creating an Android emulator](img/httpatomoreillycomsourcenostarchimages2030224.png.jpg)图\
  \ 1-16. 创建 Android 模拟器\n\n一旦你构建了三个模拟器，你的 AVD Manager 应该就像图 1-17 图 1-17. 在 Android\
  \ 虚拟设备管理器中创建的 Android 模拟器\n\n要启动模拟器，选中它并点击 `Start`。然后在弹出窗口中点击 `Launch`，如图 1-18 所示。\n\
  \n![Launching an emulator](img/httpatomoreillycomsourcenostarchimages2030228.png.jpg)图\
  \ 1-18. 启动模拟器\n\n模拟器首次启动可能需要几分钟，但一旦它启动，你就应该有一个看起来和用起来都像真实设备。Android 4.3 模拟器如图 1-19\
  \ 所示。\n\n![Android 4.3 emulator](img/httpatomoreillycomsourcenostarchimages2030230.png.jpg)图\
  \ 1-19. Android 4.3 模拟器\n\n### 注意\n\n在 Kali 中运行 Android 模拟器，你可能需要通过增加内存和 CPU 核心来提高虚拟机的性能。我可以在为\
  \ Kali 分配 3GB RAM 和两个 核心的情况下运行所有模拟器。你可以在 VMware 产品的虚拟机设置中进行这些更改。你可以给 Kali 的资源量取决于宿主机上的可用资源。作为替代，与其在\
  \ Kali 上运行 Android 模拟器，你可以在宿主机系统或局域网上的其他系统上安装 Android 和模拟器。第 20 章中的练习只要模拟器能与 Kali\
  \ 通信就可以运行。\n\n### 手机渗透测试框架\n\n接下来，下载并安装 Smartphone Pentest Framework (SPF)，我们将将其用于移动攻击。使用\
  \ `git` 下载源码。切换到此处所示的下载好的 *Smartphone-Pentest-Framework* 目录。\n\n```\nroot@kali:~#\
  \ git clone -b SPFBook https://github.com/georgiaw/Smartphone-Pentest-Framework.git\n\
  root@kali:~# cd Smartphone-Pentest-Framework\n```\n\n现在用 nano 文本编辑器打开 `kaliinstall`\
  \ 文件。前几行如示例 1-5 所示。注意引用 `/root/adt-bundle-linux-x86-20131030/sdk/tools/android*`\
  \ 的行。如果你的 ADT 束文件夹名称不同（由于发布了后续版本），请更改此值，以匹配你在上一节中安装 Android ADT 的正确位置。\n\n\n\n\n\
  \n```\nroot@kali:~/Smartphone-Pentest-Framework# nano kaliinstall\n#!/bin/sh\n##\
  \ 安装必要的包\necho -e \"$(tput setaf 1)\\nInstallin serialport, dbdpg, and  expect for\
  \ perl\\n\"; echo \"$(tput sgr0)\"\necho -e \"$(tput setaf 1)#########################################\\\
  n\"; echo \"$(tput sgr0)\"\necho $cwd;\n#apt-get -y install libexpect-perl libdbd-pg-perl\
  \ libdevice-serialport-perl;\napt-get install ant\n/root/adt-bundle-linux-x86-20131030/sdk/tools/android\
  \ update sdk --no-ui --filter android-4 -a\n/root/adt-bundle-linux-x86-20131030/sdk/tools/android\
  \ update sdk --no-ui --filter addon-google_apis-google-4 -a\n/root/adt-bundle-linux-x86-20131030/sdk/tools/android\
  \ update sdk --no-ui --filter android-14 -a\n/root/adt-bundle-linux-x86-20131030/sdk/tools/android\
  \ update sdk --no-ui --filter addon-google_apis-google-14 -a\n--snip--\n```\n\n\
  现在运行 `kaliinstall` 脚本，如下所示。\n\n```\nroot@kali:~/Smartphone-Pentest-Framework# ./kaliinstall\n\
  ```\n\n这将设置好 SPF，我们将在第 20 章中使用它。\n\n最后，我们需要对 SPF 的配置文件进行最后一次更改。切换目录到 `Smartphone-Pentest-Framework/frameworkconsole`\
  \ 并使用 `nano` 打开 `config` 文件。寻找选项 `#LOCATION OF ANDROID` `SDK` 选项。如果你的 ADT 绑定包文件夹名称与本文编写时的版本相比已发生变化，请在以\
  \ `ANDROIDSDK=` 开头的行中进行相应修改。\n\n```\nroot@kali:~/Smartphone-Pentest-Framework# cd\
  \ frameworkconsole/\nroot@kali:~/Smartphone-Pentest-Framework/frameworkconsole#\
  \ nano config\n--snip--\n#LOCATION OF ANDROID SDK\nANDROIDSDK = /root/adt-bundle-linux-x86-20131030/sdk\n\
  --snip--\n```\n\n## 目标虚拟机\n\n我们将使用三台自定义构建的目标机器来模拟客户端环境中常见的漏洞：Ubuntu 8.10、Windows\
  \ XP SP3 和 Windows 7 SP1。\n\n你可以在 [`www.nostarch.com/pentesting/`](http://www.nostarch.com/pentesting/)\
  \ 找到包含 Ubuntu 虚拟机的种子下载链接。目标系统使用 7-Zip 归档压缩，压缩包密码为 `1stPentestBook?!`。你可以使用 `7-Zip`\
  \ 程序打开所有平台的压缩包。对于 Windows 和 Linux 包，请使用 [`www.7-zip.org/download.html`](http://www.7-zip.org/download.html)；对于\
  \ Mac OS，请使用 [`ez7z.en.softonic.com/mac/`](http://ez7z.en.softonic.com/mac/) 中的\
  \ Ez7z。压缩包解压后即可使用。\n\n要设置 Windows 虚拟机，你需要安装并配置 Windows XP SP3 和 32 位 Windows 7 SP1。安装媒体源包括\
  \ TechNet 和 MSDN（微软开发者网络）等。（你应该能够在没有许可证密钥的情况下对 Windows 虚拟机进行 30 天的试用。）\n\n## 创建\
  \ Windows XP 目标\n\n你的 Windows XP 目标应该是 Windows XP SP3 的基础安装，且没有额外的安全更新。（访问我的网站 [`www.bulbsecurity.com/`](http://www.bulbsecurity.com/)\
  \ 获取更多关于寻找 Windows XP 副本的信息。）一旦有了 Windows XP SP3 副本，以下是在 Microsoft Windows 或 Mac\
  \ OS 上安装它的方法。\n\n### Microsoft Windows  VMware Player\n\n要在 Windows 版 VMware Player\
  \ 上安装 Windows XP：\n\n1.  在 VMware Player 中选择**创建新虚拟机**(Create A New Virtual Machine)，并将虚拟机向导指向\
  \ Windows XP 安装磁盘或 ISO 镜像。根据你的源磁盘或镜像，可能会提供使用快速安装（Easy Install）的（如果你安装的是带有许可证密钥的版本），或者你会看到黄色三角形警告，“无法检测此磁盘映像中的操作系统。您需要指定将安装哪种操作系统。”在后一种情况下只需点击**下一步**(Next)。\n\
  \n2.  在“选择客户操作系统”对话框中，在“客户操作系统”部分选择**Microsoft Windows**，并在下拉框中选择你的 Windows XP 版本，如图\
  \ 1-20 所示，然后点击**下一步**(Next)。\n\n    ![Selecting your version of Windows XP](img/httpsatomoreillycomsourcenostarchimages2030232.png.jpg)图\
  \ 1-20. 选择你的 Windows XP 版本\n\n3.  在下一个对话框中，输入 `Bookxp XP SP3` 作为你虚拟机的名称，并点击**下一步**(Next)。\n\
  \n4.  在“指定磁盘容量”对话框中，接受为虚拟机推荐的 40GB 硬盘大小，并勾选**将虚拟磁盘存储为单个文件**(Store virtual disk as\
  \ a single file)，如图 1-21 所示，然后点击**下一步**(Next)。\n\n    ![Specifying the disk capacity](img/httpsatomoreillycomsourcenostarchimages2030234.png.jpg)图\
  \ 1-21. 指定磁盘容量\n\n    ### 注意\n\n    虚拟机不会占用整个 40GB；它只会在需要时在你的硬盘上占用空间。这只是一个最大值。\n\
  \n5.  在“准备好创建虚拟机”对话框中（如图 1-22 所示），点击**自定义硬件**(Customize Hardware)。\n\n    ![Customizing\
  \ your hardware](img/httpsatomoreillycomsourcenostarchimages2030236.png.jpg)图 1-22.\
  \ 自定义你的硬件\n\n6.  在“硬件”对话框中，选择**网络适配器**(Network Adapter)，并在“网络连接”字段中，选择**桥接模式：直接连接到物理网络**(Bridged:\
  \ Connected directly to the physical network)。接下来，点击**配置适配器**(Configure Adapters)并选择你用于连接互联网的适配器，如图\
  \ 1-23 所示。然后点击**确定**(OK)、**关闭**(Close)和**完成**(Finish)。\n\n    ![Configuring your\
  \ network adapter](img/httpsatomoreillycomsourcenostarchimages2030238.png.jpg)图\
  \ 1-23. 配置你的网络适配器\n\n现在你应该可以运行你的 Windows XP 虚拟机了。请继续参考安装和激活 Windows 中的安装和激活 Windows\
  \ 的说明来安装和激活 Windows。\n\n### Mac OS  VMware Fusion\n\n在 VMware Fusion 中，前往**文件**(File)\
  \ ▸ **新建**(New) ▸ **从磁盘或映像导入**(Import from disk or image)，并将其指向 Windows XP 安装磁盘或映像，如图\
  \ 1-24 所示。\n\n按照提示创建 Windows XP SP3 的全新安装。\n\n    ![Creating a new virtual machine](img/httpsatomoreillycomsourcenostarchimages2030240.png.jpg)图\
  \ 1-24. 创建新虚拟机\n\n### 安装和激活 Windows\n\n作为安装过程的一部分，系统将提示你输入 Windows 许可证密钥。如果你有一个，请在此处输入。如果没有，你应该能够对虚拟机进行\
  \ 30 天的试用。若要在不输入许可证密钥的情况下继续，请在提示密钥时点击**下一步**(Next)。弹出的窗口将警告你建议输入许可证密钥，并询问你现在是否要输入一个，如图\
  \ 1-25 所示。只需点击**否**(No)。\n\n    ![License key dialog](img/httpsatomoreillycomsourcenostarchimages2030242.png.jpg)图\
  \ 1-25. 许可证密钥对话框\n\n如图 1-26 所示，在提示时，将**计算机名称**(Computer name)设置为 `Bookxp`。将**管理员密码**(Administrator\
  \ password)设置为 `password`。\n\n    ![Setting the computer name and Administrator\
  \ password](img/httpsatomoreillycomsourcenostarchimages2030244.png.jpg)图 1-26. 设置计算机名称和管理员密码\n\
  \n\n\n\n\n在提示时，你可以将日期/时间以及 TCP/IP 设置保持默认值。同样，将 Windows XP 目标留为工作组 `WORKGROUP` 的一部分，而不是加入域，如图图\
  \ 1-27 所示。\n\n![Workgroup settings](img/httpatomoreillycomsourcenostarchimages2030246.png.jpg)图\
  \ 1-27. 工作组设置\n\n告诉 Windows 不要自动安装安全更新，如图图 1-28 所示。这一步非常重要，因为我们将运行的一些漏洞利用依赖于缺失的\
  \ Windows 补丁。\n\n![Turning off automatic security updates](img/httpatomoreillycomsourcenostarchimages2030248.png.jpg)图\
  \ 1-28. 关闭自动安全更新\n\n随后你将会被提示激活 Windows。如果你输入了许可证密钥，请继续激活。否则，你可以选择`不，每隔几天提醒我一次`，如图图\
  \ 1-29 所示。\n\n![Activating Windows](img/httpatomoreillycomsourcenostarchimages2030250.png.jpg)图\
  \ 1-29. 激活 Windows\n\n现在创建用户账户 `georgia` 和 `secret`，如图图 1-30 所示。我们将在设置完成后为这些用户创建密码。\n\
  \n![Adding users](img/httpatomoreillycomsourcenostarchimages2030252.png.jpg)图 1-30.\
  \ 添加用户\n\n当 Windows 启动时，以用户 `georgia` 身份登录且无需密码。\n\n### 安装 VMware Tools\n\n现在安装\
  \ VMware Tools，这将让你更方便地使用虚拟机，例如允许你从宿主机系统复制/粘贴并将程序拖入虚拟机中。\n\n#### Microsoft Windows\
  \ 上的 VMware Player\n\n在 VMware Player 中，通过`播放` ▸ `管理` ▸ `安装 VMware Tools` 安装 VMware\
  \ Tools，如图图 1-31 所示。VMware Tools 安装程序应会在 Windows XP 中自动运行。\n\n![Installing VMware\
  \ Tools in VMware Player](img/httpatomoreillycomsourcenostarchimages2030254.png.jpg)图\
  \ 1-31. 在 VMware Player 中安装 VMware Tools\n\n#### Mac OS 上的 VMware Fusion\n\n通过`虚拟机`\
  \ ▸ `安装 VMware Tools` 安装 VMware Tools，如图图 1-32 所示。VMware Tools 安装程序应会在 Windows XP\
  \ 中自动运行。\n\n![Installing VMware Tools in VMware Fusion](img/httpatomoreillycomsourcenostarchimages2030256.png.jpg)图\
  \ 1-32. 在 VMware Fusion 中安装 VMware Tools\n\n### 关闭 Windows 防火墙\n\n现在从 Windows 开始菜单打开控制面板。点击`安全中心`\
  \ ▸ `Windows 防火墙`来关闭 Windows 防火墙，如图图 1-33 所示。\n\n![Turning off the Windows firewall](img/httpatomoreillycomsourcenostarchimages2030258.png.jpg)图\
  \ 1-33. 关闭 Windows 防火墙\n\n### 设置用户密码\n\n再次在控制面板中，进入“用户账户”。点击用户 `georgia` 然后选择`创建密码`。将\
  \ `georgia` 的密码设置为 `password`，如图图 1-34 所示。对用户 `secret` 执行相同的操作，但将 `secret` 的密码设置为\
  \ `Password123`。\n\n![Setting a user password](img/httpatomoreillycomsourcenostarchimages2030260.png.jpg)图\
  \ 1-34. 设置用户密码\n\n### 设置静态 IP 地址\n\n接下来，设置静态 IP 地址，这样在你阅读本书时，你的网络信息就不会改变。但首先，我们需要确定默认网关的地址。\n\
  \n确保你的 Windows XP 系统在 VMware 中设置为使用桥接网络。默认情况下，你的虚拟机将通过 DHCP 自动获取 IP 地址。\n\n要找到默认网关，通过`开始`\
  \ ▸ `运行`，输入 `cmd` 并点击`确定`来打开 Windows 提示符。在提示符中输入 `ipconfig`。这将显示网络信息，包括默认网关。\n\n\
  ```\nC:\\Documents and Settings\\georgia>ipconfig\n\nWindows IP Configuration\n\n\
  Ethernet adapter Local Area Connection:\n\n        Connection-specific DNS Suffix\
  \  . : XXXXXXXX\n        IP Address. . . . . . . . . . . \n        Subnet Mask .\
  \ . . . . . . . . . \n        Default Gateway . . . . . . . . . .\n```\n\n![Setting\
  \ static IP address](img/httpatomoreillycomsourcenostarchimages2030262.png.jpg)图\
  \ 1-35. 设置静态 IP 地址\n\n（注：提供的文本在最后部分包含一些重复/乱码句子；上述内容已清理，以保持核心教学流程的顺畅。）\n\n### 让 XP\
  \ 表现像 Windows 域的成员\n\n最后，我们需要修改 Windows XP 中的一项设置，使其行为像是 Windows 域的成员一样。\n\n1. 选择`开始`\
  \ ▸ `运行` 并输入 `secpol.msc` 以打开本地安全策略面板。\n2. 展开`本地策略`并双击`安全选项`。\n3. 双击`网络访问：本地帐户的共享和安全模型`并选择`经典\
  \ - 本地用户按自己的身份验证`。\n\n\n\n\n\n在本节中，我们将在 Windows XP 虚拟机上安装一些带有漏洞的软件。我们将在稍后的章节中对这些软件进行攻击。打开你的\
  \ Windows XP 虚拟机，在以用户 `georgia` 身份登录的情况下，按照指示安装此处列出的每个软件包。\n\n### Zervit 0.4\n\n\
  从 `[`www.exploit-db.com/exploits/12582/`](http://www.exploit-db.com/exploits/12582/)`\
  \ 下载 Zervit 0.4 版本。（点击 Vulnerable App 选项下载文件）。解压下载的压缩包，并双击 Zervit 程序以打开并运行它。然后当软件启动时，在控制台中输入端口号\
  \ `3232`。在允许列出目录时回答 `Y`，如 图 1-37 所示。当你重启 Windows XP 时，Zervit 不会自动重启，因此如果你重启了系统，需要重新启动它。\n\
  \n![Starting Zervit 0.4](img/httpatomoreillycomsourcenostarchimages2030266.png)图\
  \ 1-37. Starting Zervit 0.4\n\n### SLMail 5.5\n\n从 `[`www.exploit-db.com/exploits/638/`](http://www.exploit-db.com/exploits/638/)`\
  \ 下载并运行 SLMail 5.5 版本，并在提示时使用默认选项。对于所有选项只需点击 `Next` 且不要更改任何内容。如果你收到关于域名的警告，只需忽略它并点击\
  \ `OK`。我们在这里并不需要发送任何电子邮件。\n\n一旦 SLMail 安装完成，重启你的虚拟机。然后打开 `开始` ▸ `所有程序` ▸ `SL Products`\
  \ ▸ `SLMail` ▸ `SLMail Configuration`。在“用户”选项卡（默认）中，右键点击 `SLMail Configuration`\
  \ 窗口并选择 `新建` ▸ `用户`，如 图 1-38 所示。\n\n![Adding a user in SLMail](img/httpatomoreillycomsourcenostarchimages2030268.png)图\
  \ 1-38. Adding a user in SLMail\n\n点击新创建的用户图标，输入用户名 `georgia` 并填写用户信息，如 图 1-39 所示。邮箱箱名称应为\
  \ `georgia`，密码为 `password`。完成后完成后保持默认设置并按下 `OK`。\n\n![Setting the user information\
  \ in SLMail](img/httpatomoreillycomsourcenostarchimages2030270.png.jpg)图 1-39. Setting\
  \ the user information in SLMail\n\n### 3Com TFTP 2.0.1\n\n接下来，从 `[`www.exploit-db.com/exploits/3388/`](http://www.exploit-db.com/exploits/3388/)`\
  \ 以压缩包格式下载 3Com TFTP 2.0.1 版本。提取文件并将 `3CTftpSvcCtrl` 和 `3CTftpSvc` 复制到 `C:\\Windows`\
  \ 目录，如 图 1-40 所示。\n\n![Copying 3Com TFTP to C:\\Windows](img/httpatomoreillycomsourcenostarchimages2030272.png.jpg)图\
  \ 1-40. Copying 3Com TFTP to C:\\Windows\n\n然后打开 `3CTftpSvcCtrl`（蓝色的 `3` 图标）并点击\
  \ `Install Service`，如 图 1-41 所示。\n\n![Installing 3Com TFTP](img/httpatomoreillycomsourcenostarchimages2030274.png.jpg)图\
  \ 1-41. Installing 3Com TFTP\n\n点击 `Start Service` 首次启动 3Com TFTP。从现在起，它将在你启动电脑时自动启动。按\
  \ `Quit` 退出。\n\n### XAMPP 1.7.2\n\n现在从 `[`www.oldapps.com/xampp.php?old_xampp=45/`](http://www.oldapps.com/xampp.php?old_xampp=45/)`\
  \ 安装旧版本的 XAMPP 软件，版本 1.7.2。（Windows XP 上旧版本的 Internet Explorer 似乎在打开此页面时有些困难。如果你遇到问题，请从主机系统下载软件并将其复制到\
  \ Windows XP 桌面。）\n\n1. 运行安装程序并接受显示的默认选项。安装完成后，选择选项 `1\\. start XAMPP Control Panel`，如\
  \ 图 1-42 所示。\n\n![Starting XAMPP Control Panel](img/httpatomoreillycomsourcenostarchimages2030276.png)图\
  \ 1-42. Starting XAMPP Control Panel\n\n2. 在 XAMPP 控制面板中，安装 Apache、MySQL 和 FileZilla\
  \ 服务（勾选服务名称左侧的 `Svc` 复框）。然后点击每个服务的 `Start` 按钮。你的屏幕应该看起来像 图 1-43 所示。\n\n![Installing\
  \ and starting XAMPP services](img/httpatomoreillycomsourcenostarchimages2030278.png.jpg)图\
  \ 1-43. Installing and starting XAMPP services\n\n3. 在 XAMPP 控制面板中点击 FileZilla 的\
  \ `Admin` 按钮。管理面板如 图 1-44 所示。\n\n![FileZilla Admin panel](img/httpatomoreillycomsourcenostarchimages2030280.png)图\
  \ 1-44. FileZilla Admin panel\n\n4. 点击 XAMPP 控制面板中新创建的用户图标，输入用户名 `georgia` 并填写用户信息，如\
  \ 图 1-39 所示。邮箱箱名称应为 `georgia`，密码为 `password`。完成后保持默认设置并按下 `OK`。\n\n![Setting the\
  \ user information in SLMail](img/httpatomoreillycomsourcenostarchimages2030270.png.jpg)图\
  \ 1-39. Setting the user information in SLMail\n\n5. 访问 `Edit` ▸ `Users` 打开用户对话框。\n\
  \n6. 在添加账户对话框中，选中 `georgia` 并按下 `OK`。\n\n![Adding a user in SLMail](img/httpatomoreillycomsourcenostarchimages2030268.png.jpg)图\
  \ 1-45. Adding a user\n\n7. 在 `Settings` 下勾选 `Password` 框并输入 `password`。\n\n8. 在提示共享文件夹时，浏览到\
  \ Windows  `Documents` 文件夹并选择它，如 图 1-46 所示。\n\n9. 关闭各个窗口。\n\n![Sharing a folder](img/httpatomoreillycomsourcenostarchimages2030272.png)图\
  \ 1-46. Sharing a folder\n\n### Adobe Reader\n\n现在从 `[`www.oldapps.com/xampp.php?old_xampp=45/`](http://www.oldapps.com/xampp.php?old_xampp=45/)`\
  \ 安装 Adobe Reader 8.1.2。按照默认提示安装。完成后点击 `Finish`。（在这里你可能需要将文件下载到主机系统并复制到 Windows\
  \ XP。）\n\n### War-FTP\n\n接下来，从 `[`www.exploit-db.com/exploits/3570/`](http://www.exploit-db.com/exploits/3570/)`\
  \ 下载并安装 War-FTP 1.65 版本。从 `exploit-db.com` 下载可执行文件到 `georgia` 桌面并运行以安装。你不需要启动 FTP\
  \ 服务；我们将在 第 16 章 到 第 19 章 讨论漏洞开发时开启它。\n\n### WinSCP\n\n从 `[`winscp.net/`](http://winscp.net/)`\
  \ 下载并安装最新版本的 WinSCP。选择 `Typical Installation` 选项。你可以取消勾选插件。完成后点击 `Finish`。\n\n###\
  \ Immunity Debugger and Mona\n\n现在我们将通过安装调试器来完成 Windows XP，一种有助于检测计算机程序错误的工具。我们将在漏洞开发章节中使用调试器。访问\
  \ Immunity Debugger 注册页面 `[`debugger.immunityinc.com/ID_register.py`](http://debugger.immunityinc.com/ID_register.py)`。完成注册后点击下载按钮。运行安装程序。\n\
  \n当询问是否安装 Python 时，点击 `Yes`。接受许可协议并按照默认安装提示操作。当你关闭安装程序时，Python 安装将自动运行。\n\n\n\n\n\
  \n一旦安装了 Immunity Debugger 和 Python，从 `http://redmine.corelan.be/projects/mona/repository/raw/mona.py/`\
  \ 下载 `mona.py`。将 `mona.py` 复制到 `C:\\Program Files\\Immunity Inc\\Immunity Debugger\\\
  PyCommands`，如图 1-47 所示。\n\n打开 Immunity Debugger，在窗口底部的命令提示符中输入 `!mona config -set\
  \ workingfolder c:\\logs\\%p`，如图 1-48”所示。此命令告诉 mona 将输出记录到 `C:\\logs\\<program name>`，其中\
  \ `<program name>` 是 Immunity Debugger 当前正在调试的程序名称。\n\n现在我们的 Windows XP 目标机器已设置完毕并准备就绪。\n\
  \n![Installing Mona](img/httpatomoreillycomsourcenostarchimages2030286.png.jpg)图\
  \ 1-47. 安装 Mona![Setting up Mona’s logs](img/httpatomoreillycomsourcenostarchimages2030288.png)图\
  \ 1-48. 设置 Mona 的日志\n\n## 设置 Ubuntu 8.10 目标机器\n\n由于 Linux 是开源的，你可以直接从本书的种子文件中下载\
  \ Linux 虚拟机作为的一部分。解压 7-Zip 压缩包 `BookUbuntu.7zip` 并使用密码 `1stPentestBook?!` 打开压缩包。在\
  \ VMware 中打开 `*.vmx` 文件。如果提示信息显示虚拟机似乎正在使用，点击**采取所有权 (Take Ownership)**，并像处理 Kali\
  \ 一样选择**我已复制过（I copied it）**。虚拟机本身的用户名和密码为 `georgia:password`。\n\n一旦加载了 Ubuntu 虚拟机，请确保\
  \ VMware 中的网络接口设置为桥接模式（Bridged），并点击屏幕右上角的网络图标（两台电脑）将虚拟机连接到网络。如果提示更新，请不要安装任何更新。与\
  \ Windows XP 一样，我们将利用该系统上的过时软件。现在这台虚拟机已全部设置完毕。（我将在第 2 章中向你演示如何在 Linux 中设置静态 IP 地址。）\n\
  \n## 创建 Windows 7 目标机器\n\n与 Windows XP 一样，你需要通过加载镜像或 DVD 在 VMware 中安装一个 Windows\
  \ 7 SP1。32 位 Windows 7 专业版 SP1 的 30 天试版可以运行，但如果你想继续使用，需要在 30 天后进行激活。要找到合法的 Windows\
  \ 7 SP1 版本，请尝试以下方法：\n\n*   访问 `http://www.softpedia.com/get/System/OS-Enhancements/Windows-7.shtml`。\n\
  *   访问 `http://technet.microsoft.com/en-us/evalcenter/dn407368`。\n\n### 注意\n\n你的学校或工作场所可能可以使用\
