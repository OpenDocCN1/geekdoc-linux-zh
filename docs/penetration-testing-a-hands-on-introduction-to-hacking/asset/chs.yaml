  \ SEH 传递给程序。当我们在没有调试器的情况下运行 War-FTP 并遇到错误，执行流会自动传递给 SEH，执行 `POP POP RET`、短跳转，最后执行我们的\
  \ shellcode。\n\n\n\n\n我们已成功为 War-FTP 构建了一个 SEH 覆盖利用程序。尽管 War-FTP 允许我们通过直接覆盖返回地址或\
  \ SEH 来利用缓冲区溢出漏洞，但某些易受攻击的程序不会以一种允许你控制 EIP 的方式崩溃，但会允许你覆盖 SEH。在这些情况下，了解利用此类崩溃的步骤对于创建一个可行的利用程序至关重要。由于结构化异常处理的工作机制，每当你遇到这种类型的崩溃时，你可以认为\
  \ NSEH 位于 `ESP+8`。当你覆盖 SEH 时，你会发现指向下一个 SEH 记录的指针位于 `ESP+8`。在从未用 `SafeSEH` 编译的模块中执行一系列\
  \ `POP POP RET` 指令后，你需要执行一个短跳转以到达攻击字符串中的你的 shellcode。如果你继续进行利用程序开发，可能会遇到另一个挑战，即\
  \ `\\xEB` 是坏字符，因此你需要找到其他执行跳转的方法。\n\n在下一章中，我们将通过一些零碎内容完成对漏洞开发基础知识的学习，例如首先使用称为 `fuzzing`（模糊测试）的技术发现崩溃，将公共漏洞代码移植以满足我们的需求，以及编写我们自己的\
  \ Metasploit 模块。\n\n# 第 19 章 模糊测试、漏洞移植与 Metasploit 模块\n\n在本章中，我们将回顾更多的基础漏洞开发技术。我们将研究使用名为\
  \ `fuzzing` 的技术在易受攻击程序中寻找潜在漏洞。我们还将涵盖处理公共漏洞代码并安全地将其移植以满足我们的需求，以及构建自己的 Metasploit\
  \ 模块的基础。最后，我们将讨论我们的目标可能实施的一些漏洞利用缓解技术。\n\n## 模糊测试程序\n\n在第 17 章 中，我们使用一个 1,100 字节的利用字符串利用了\
