  \ 并赋予其可执行权限。\n\n### 将公共漏洞移植以满足需求\n\n有时你可能会在渗透测试中发现一个可利用的漏洞，但没有相应的 Metasploit 模块来利用它。虽然\
  \ Metasploit 团队和社区的贡献模块编写者非常努力地让 Metasploit 跟上当前的威胁，但并不是每个已知的漏洞都移植到了框架中。\n\n我们可以尝试通过下载目标软件并开发一个可行的利用程序来实现，但这种方法并不总是可行。相关软件可能带有极其昂贵的许可费用，导致你在渗透测试中亏损，或者可能无法从供应商或其他处获得。此外，你的渗透测试可能有有限的时间限制，因此你更好的做法是寻找环境中其他的漏洞，而不是花费大量时间在开发自定义漏洞上。\n\
  \n\n\n\n\n开发自己的工作利用程序的一种方法是使用公开的利用程序作为基础，并将其迁移到你的环境中。即使某个漏洞缺少对应的 Metasploit 模块，你也可能在\
  \ Exploit Database (`http://www.exploit-db.com/`) 或 SecurityFocus (`http://www.securityfocus.com/`)\
  \ 等网站上找到概念证明（PoC）利用代码。尽管在使用公开利用代码时应始终保持谨慎（互联网上并非所有程序都如其描述的那样有效），但经过尽职调查，我们可以安全地使用公开的利用代码。\n\
  \n让我们从 Exploit Database 中一个针对 3Com TFTP 2.0.1 长传输模式漏洞的公开利用程序开始，它可以在网上 `http://www.exploit-db.com/exploits/3388/`\
  \ 找到，并在示例 19-5 中展示。\n\n#### 示例 19-5. 3Com TFTP 的公开利用程序\n\n```perl\n#!/usr/bin/perl\
  \ –w ❶\n#===============================================================\n#    \
  \            3Com TFTP Service <= 2.0.1 (Long Transporting Mode) Overflow Perl Exploit\n\
  #                               By Umesh Wanve (umesh_345@yahoo.com)\n#===============================================================\n\
  # Credits : Liu Qixu 被认为发现了此漏洞。\n# Reference : http://www.securityfocus.com/bid/21301\n\
  # Date : 27-02-2007\n# Tested on Windows 2000 SP4 Server English ❷\n#          \
