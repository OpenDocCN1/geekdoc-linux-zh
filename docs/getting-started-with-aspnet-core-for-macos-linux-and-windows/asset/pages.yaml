    \ Core, you can visit the official website on https://github.com/aspnet/EntityFramework.\n\
    \n# 6.4 Demo Database Application\n\nIn this section, we will build a simple ASP.NET\
    \ Core MVC to access PostgreSQL through Entity Framework Core.\nLets start!\n\n\
    # 6.4.1 Build PostgreSQL Database\n\nFirst, you create a database, for instance,\
    \ demodb. Then, create a table for your testing. The following is a script for\
    \ creating a table.\n\n```\nCREATE TABLE public.product\n(\n  id integer: NOT\
    \ NULL DEFAULT nextval('product_id_seq'::regclass),\n  quantity integer,\n  is_discount\
    \ boolean,\n  name text,\n  product_code text\n) WITH (\n  OIDS=FALSE\n);\nALTER\
    \ TABLE public.product\nOWNER TO postgres;\n```\n\nYou may create a login user\
    \ for accessing this database.\n\n# 6.4.2 Creating an ASP.Net Core MVC Project\n\
    \nWe can create ASP.NET Core MVC project using yo aspnet. You can use Web Application\
    \ template.\n\n# 6.4.3 Configure ASP.Net Core MVC Project\n\nThe next step is\
    \ to load .NET Framework Core for PostgreSQL into our project. You add these libraries\
    \ into project.json file under dependencies.\n\n```\n\"Npgsql.EntityFrameworkCore.PostgreSQL\"\
    : \"1.1.0\",\n\"Microsoft.EntityFrameworkCore.Design\": {\n  \"version\": \"1.1.0\"\
    ,\n  \"type\": \"build\"\n}\n```"
