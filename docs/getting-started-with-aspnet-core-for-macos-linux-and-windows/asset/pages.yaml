  md: '# 3.4 Building ASP.NET Core MVC Application


    The second demo is to build ASP.NET Core MVC application from scratch. We develop
    a simple entry form and utilize ASP.NET Core MVC session. The following is our
    scenario:


    +   * User fills a form to create a new product

    * User clicks Save button to save the data

    * The data will be stored to a session stack

    * Then, the data will be shown on another page


    We start to develop.


    # 3.4.1 Creating a Project


    Firstly, we create a project by yo aspnet. Open Terminal and type this command:


    ```

    $ yo aspnet

