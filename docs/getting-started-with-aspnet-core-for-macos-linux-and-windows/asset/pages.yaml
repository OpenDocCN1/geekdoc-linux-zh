  md: "# ### 3.4.3.1 Creating Model\n\nA model holds a data. In our case, we create\
    \ a module, called Product, which consists of four properties. Create a file,\
    \ called Product.cs, and write this code.\n\n```\nusing System.ComponentModel.Annotations;\n\
    namespace ProductApp.Models\n{\n    public class Product\n    {\n        [Required]\n\
    \        [MinLength(4)]\n        [Display(Name = \"Name\")]\n        public string\
    \ Name { get; set; }\n        [Display(Name = \"Product Code\")]\n        public\
    \ string ProductCode { get; set; }\n        [Display(Name = \"Quantity\")]\n \
    \       public int Quantity { get; set; }\n        [Display(Name = \"Is Discount\"\
    )]\n        public bool IsDiscount { get; set; }\n    }\n}\n```\n\nSave this file\
    \ into Models folder.\n\n# ### 3.4.3.2 Creating Controller\n\nNow we create MVC\
    \ controller, called Home controller. Create a file, called HomeController.cs,\
    \ and write this code.\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Threading.Tasks;\nusing Microsoft.AspNetCore.Mvc;\n\
    \nusing ProductApp.Models;\nnamespace ProductApp.Controllers\n{\n    public class\
    \ HomeController : Controller\n    {\n        public IActionResult Index()\n \
    \       {\n            return View();\n        }\n        public IActionResult\
    \ Create()\n        {\n            var product = new Product();\n            return\
    \ View(product);\n        }\n        [HttpPost]\n        public IActionResult\
    \ Create(Product obj)\n        {\n            }\n```"
