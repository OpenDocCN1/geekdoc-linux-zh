  md: "To manipulate Product table, we define two methods, Save() and GetProductByCode(),\
    \ in our object.\n\n```\nusing System.Linq;\nusing PostgresDemo.Models;\n\nnamespace\
    \ PostgresDemo.Data\n{\n    public class ProductRepo\n    {\n        private readonly\
    \ DbContext _databaseContext;\n        public ProductRepo(DbContext databaseContext)\n\
    \        {\n            _databaseContext = databaseContext;\n        }\n     \
    \   public Product GetProductByCode(string code)\n        {\n            return\
    \ _databaseContext.Products.SingleOrDefault(x => x.ProductCode == code);\n   \
    \     }\n        public void Save(Product product)\n        {\n            var\
    \ productFromDb = _databaseContext.Products.SingleOrDefault(x => x.Id == product.Id);\n\
    \            if(productFromDb != null)\n            {\n                productFromDb\
    \ = product;\n            }\n            else\n            {\n               \
    \ _databaseContext.Products.Add(product);\n            }\n            _databaseContext.SaveChanges();\n\
    \        }\n    }\n}\n```\n\nThese objects will be called from Controller.\n\n\
    #  6.4.5 Develop ASP.Net MVC Controllers\n\nWe create Product Controller to handle\
    \ our View and push data to UI. The following is ProductCategory class implementation.\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Threading.Tasks;\n```"
