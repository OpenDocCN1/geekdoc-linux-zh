  md: "To activate EF Core on our project, we add a database context in ConfigureServices()\
    \ in Startup.cs file. Add these codes.\n\n```\npublic void ConfigureServices(IServiceCollection\
    \ services)\n{\n    // Add framework services.\n    services.AddDbContext<ApplicationDbContext>(options\
    \ =>\n        options.UseSqlite(Configuration.ConnectionString(\"DefaultConnection\"\
    )));\n\n    services.AddIdentity<ApplicationUser, IdentityRole>()\n        .AddEntityFrameworkStores<ApplicationDbContext>()\n\
    \        .AddDefaultTokenProviders();\n\n    services.AddMvc();\n\n    // Add\
    \ postgresql\n    var connectionString = Configuration[\"DbContextSettings:ConnectionString\"\
    ];\n    services.AddDbContext<DemoDbContext>(opts => opts.UseNpgsql(connectionString));\n\
    \n    // Add application services.\n    services.AddTransient<IEmailSender, AuthMessageSender>();\n\
    \    services.AddTransient<ISmsSender, AuthMessageSender>();\nn}\n```\n\n# ##\
