    # # Hello, world!


    Welcome to your new single-page application, built with:


    +   - ASP.NET Core and C# for cross-platform server-side code

    - Angular 2 and TypeScript for client-side code

    - Webpack for building and bundling client-side resources

    - Bootstrap for layout and styling


    To get you started, we''ve set up:


    +   - Client-side navigation. For example, click Counter then Back to return here.

    - Server-side rendering. For faster initial loading and improved SEO, the resulting
    HTML of your Angular 2 app is transferred to the browser where a client-side copy
    of the app takes over.

    - Webpack dev middleware. In development mode, there''s no need to run the webpack
    build tool. Your client-side resources are dynamically built on demand. Updates
    are available as soon as you modify any file.

    - Hot module replacement. In development mode, you don''t even need to reload
    the page after making some changes. Within seconds of saving changes to files,
    your Angular 2 app will be rebuilt and a new instance is injected into the page.

    - Efficient production builds. In production mode, development-time features are
    disabled, and the webpack build tool produces minified CSS and JavaScript files.


    You can click menu Fetch data to see Angular 2 feed remote data.'
