- md: "\n# ASP.NET Core MVC Demo\n\nAccess ASP.NET Core API.\n\n```\nGet JSON data\
    \ »\n```\n\n| Product Name | Code | Quantity | Is Discount |\n|---|---|---|---|\n\
    | Product 0 | PR0 | 0 | true |\n| Product 1 | PR1 | 1 | true |\n| Product 2 |\
    \ PR2 | 2 | true |\n| Product 3 | PR3 | 3 | true |\n| Product 4 | PR4 | 4 | true\
    \ |\n| Product 5 | PR5 | 5 | true |\n| Product 6 | PR6 | 6 | true |\n| Product\
    \ 7 | PR7 | 7 | true |\n| Product 8 | PR8 | 8 | true |\n| Product 9 | PR9 | 9\
    \ | true |\n\n# 5. ASP.NET Core and Angular 2\n\nIn this chapter I'm going to\
    \ explain how to work with ASP.NET Core MVC and Angular 2.\n\n## 5.1 Getting Started\n\
    \nIn this section, we develop a simple app to work with ASP.NET RESTful and AngularJS.\n\
    AngularJS is an open-source JavaScript framework, maintained by Google, that you\
    \ can visit official website on http://angularjs.org/.\nIn this chapter, we explore\
    \ to integrate Angular 2 into ASP.NET Core.\n\n## 5.2 ASP.NET Core and Angular\
    \ 2 Project Template\n\nYou can learn Angular 2 on the official website, https://angular.io.\
    \ We develop Angular 2 using JavaScript and TypeScript.\nThe idea to integrate\
    \ ASP.NET Core MVC and Angular 2 is to merge the both projects, ASP.NET Core and\
    \ Angular 2. Fortunately, we can use aspnetcore spa template, https://github.com/aspnet/JavaScriptServices.\n\
    You can use this template by typing this command on Terminal.\n\n```\n$ npm install\
    \ -g yo generator-aspnetcore-spa\n```\n\nIf done, you can build a sample project\
    \ from this project template.\n\n## 5.3 Run Demo: ASP.NET Core Angular SPA\n\n\
    In this section, we run program sample from aspnetcore spa template.\n\n### 5.3.1\
    \ Creating a Project\n\nYou can create ASP.NET Core with Angular 2 by typing this\
    \ command.\n\n```\n$ yo aspnetcore-spa\n```\n\nSelect Angular 2 as framework.\n\
    \n# aspnetcore_angular2 — yo TERM_PROGRAM=Apple_Terminal — 80x24\n\n```\nagusk$$\
    \ cd aspnetcore_angular2/\nagusk$$ yo\n? 'Allo Agus! What would you like to do?\
    \ Aspnetcore Spa\n\nMake sure you are in the directory you want to scaffold into.\n\
    This generator can also be run with: yo aspnetcore-spa\n```\n\n![](img/03410162e36ac22ee4df2780b4d3848c_41_0.png)\n\
    \n- Framework\n- Angular 2\n- Aurelia\n- Knockout\n- React\n- React with Redux\n\
    \nGiven a project name, called ProductAng.\n\n# aspnetcore_angular2 — yo TERM_PROGRAM=Apple_Terminal\
    \ — 80x24\n\n```\nagusk$$ cd aspnetcore_angular2/\nagusk$$ yo\n? 'Allo Agus! What\
    \ would you like to do? Aspnetcore Spa\n\nMake sure you are in the directory you\
    \ want to scaffold into.\nThis generator can also be run with: yo aspnetcore-spa\n\
    ```\n\n![](img/03410162e36ac22ee4df2780b4d3848c_41_1.png)\n\n- Framework Angular\
    \ 2.\n- What type of project do you want to create? project.json (compatible with\
    \ .NET Core tooling preview 2 and Visual Studio 2015)\n- Do you want to include\
    \ unit tests? No\n- Your project name (aspnetcore_angular2) ProductAng\n\n## 5.3.2\
    \ Running the Program\n\nTo run the program, you do it as usual. Open Terminal\
    \ and navigate to project folder. Then, type these commands.\n\n```\n$ dotnet\
    \ restore\n$ dotnet build\n$ dotnet run\n```\n\nYou open a browser and navigate\
    \ to http://localhost:5000/. You should SPA with Angular 2.\n\n![](img/03410162e36ac22ee4df2780b4d3848c_42_0.png)\n\
    \n## Hello, world!\n\nWelcome to your new single-page application, built with:\n\
    \n- ASP.NET Core and C# for cross-platform server-side code\n- Angular 2 and TypeScript\
    \ for client-side code\n- Webpack for building and bundling client-side resources\n\
    - Bootstrap for layout and styling\n\nTo get you started, we've set up:\n\n- Client-side\
    \ navigation. For example, click Counter then Back to return here.\n- Server-side\
    \ rendering. For faster initial loading and improved SEO, the resulting HTML of\
    \ your Angular 2 app is transferred to the browser where a client-side copy of\
    \ the app takes over.\n- Webpack dev middleware. In development mode, there's\
    \ no need to run the webpack build tool. Your client-side resources are dynamically\
    \ built on demand. Updates are available as soon as you modify any file.\n- Hot\
    \ module replacement. In development mode, you don't even need to reload the page\
    \ after making some changes. Within seconds of saving changes to files, your Angular\
    \ 2 app will be rebuilt and a new instance is injected into the page.\n- Efficient\
    \ production builds. In production mode, development-time features are disabled,\
    \ and the webpack build tool produces minified CSS and JavaScript files.\n\nYou\
    \ can click menu Fetch data to see Angular 2 feed remote data.\n\n## 5.4 What's\
    \ The Next?\n\nYou can do more practices for AngularJS by reading several tutorial\
    \ in Internet or books. I also wrote a book about AngularJS Programming by Example.\
    \ This book helps you learn about AngularJS programming. Please visit my blog,\
    \ http://blog.aguskurniawan.net/post/AngularJS.aspx . This book uses the first\
    \ version of AngularJS. Currently, I'm working on my new book for Angular 2.\n\
    \n![](img/03410162e36ac22ee4df2780b4d3848c_44_0.png)\n\n# 6. ASP.NET Core, Entity\
    \ Framework Core and PostgreSQL\n\nIn this chapter I'm going to explain how to\
    \ work with ASP.NET Core MVC, Entity Framework Core and PostgreSQL.\n\n## 6.1\
    \ Getting Started\n\nIn this chapter, we learn how to work with ASP.NET Core MVC,\
    \ Entity Framework Core and PostgreSQL.\n\n## 6.2 PostgreSQL\n\nIn this chapter,\
    \ we use PostgreSQL. You can install it on.\n\n![](img/03410162e36ac22ee4df2780b4d3848c_45_0.png)\n\
    \n## 6.3 Entity Framework Core\n\nIn this section, we build ASP.NET Core MVC using\
    \ Entity Framework Core. \n\n## 6.4 Data Access\n\nAfter loaded EF Core inside\
    \ our project, we develop classes to access PostgreSQL. We create Model and Data\
    \ objects.\n\n### 6.4.1 Build Database\n\nFirst, we create a table in PostgreSQL.\n\
    \n```sql\nCREATE TABLE product (\n  id SERIAL PRIMARY KEY,\n  name TEXT NOT NULL,\n\
    \  product_code TEXT,\n  quantity INTEGER,\n  is_discount BOOLEAN\n);\nALTER TABLE\
    \ product OWNER TO postgres;\n```\n\n### 6.4.2 Creating an ASP.NET Core Project\n\
    \nWe create ASP.NET Core MVC project.\n\n### 6.4.3 Configure Database\n\nNext,\
    \ we add connection string to appsettings.json.\n\n```json\n{\n  \"ConnectionStrings\"\
    : {\n    \"DefaultConnection\": \"Data Source=localhost;Port=5432;Database=PostgresDemo;User\
    \ ID=agusk;Password=agusk\"\n  },\n  \"Logging\": {\n    \"LogLevel\": {\n   \
    \   \"Default\": \"Debug\",\n      \"Microsoft\": \"Information\"\n    }\n  }\n\
    }\n```\n"
