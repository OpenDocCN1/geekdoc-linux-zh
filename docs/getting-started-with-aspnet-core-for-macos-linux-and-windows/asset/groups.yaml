  mdcn: "\n为了操作 Product 表，我们在我们的对象中定义了两个方法：`Save()` 和 `GetProductByCode()`。\n\n```csharp\n\
    using System.Linq;\nusing PostgresDemo.Models;\n\nnamespace PostgresDemo.Data\n\
    {\n    public class ProductRepo\n    {\n        private readonly DbContext _databaseContext;\n\
    \        public ProductRepo(DbContext databaseContext)\n        {\n          \
    \  _databaseContext = databaseContext;\n        }\n        public Product GetProductByCode(string\
    \ code)\n        {\n            return _databaseContext.Products.SingleOrDefault(x\
    \ => x.ProductCode == code);\n        }\n        public void Save(Product product)\n\
    \        {\n            var productFromDb = _databaseContext.Products.SingleOrDefault(x\
    \ => x.Id == product.Id);\n            if(productFromDb != null)\n           \
    \ {\n                productFromDb = product;\n            }\n            else\n\
    \            {\n                _databaseContext.Products.Add(product);\n    \
    \        }\n            _databaseContext.SaveChanges();\n        }\n    }\n}\n\
    ```\n\n这些对象将从 Controller 中调用。\n\n## 6.4.5 开发 ASP.Net MVC \n\n我们创建了 Product Controller\
    \ 来处理视图并将数据推送到 UI。以下是 ProductCategory 类的实现。\n\n```csharp\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\nusing System.Threading.Tasks;\n\
    using Microsoft.AspNetCore.Mvc;\nusing PostgresDemo.Data;\nusing PostgresDemo.Models;\n\
    \nnamespace PostgresDemo.Controllers\n{\n    public class ProductController :\
    \ Controller\n    {\n        private readonly ProductRepo _productRepository;\n\
    \        public ProductController(DemoDbContext databaseContext)\n        {\n\
    \            _productRepository = new ProductRepo(databaseContext);\n        }\n\
    \n        public IActionResult Index()\n        {\n            return View();\n\
    \        }\n\n        public IActionResult Create()\n        {\n            return\
    \ View();\n        }\n        [HttpPost]\n        public IActionResult Create(ProductViewModel\
    \ obj)\n        {\n            // 数据库处理\n            ////\n            Product\
    \ o = new Product();\n            o.Id = obj.Id;\n            o.Name = obj.Name;\n\
    \            o.ProductCode = obj.ProductCode;\n            o.Quantity = obj.Quantity;\n\
    \            o.IsDiscount = obj.IsDiscount;\n            _productRepository.Save(o);\n\
    \            return RedirectToAction(\"Save\");\n        }\n\n        public IActionResult\
    \ Save()\n        {\n            return View();\n        }\n\n        public IActionResult\
    \ ActionResult ListProduct()\n        {\n            return View(new ProductViewModel());\n\
    \        }\n        [HttpPost]\n        public IActionResult List(string code)\n\
    \        {\n            Product obj = _productRepository.GetProductByCode(code);\n\
    \            ProductViewModel o = new ProductViewModel();\n            if(o!=null)\n\
    \            {\n                o.Id = obj.Id;\n                o.Name = obj.Name;\n\
    \                o.ProductCode = obj.ProductCode;\n                o.Quantity\
    \ = obj.Quantity;\n                o.IsDiscount = obj.IsDiscount;\n          \
    \  }\n            return View(o);\n        }\n    }\n}\n```\n\n为了在项目中激活 EF Core，我们在\
    \ `Startup.cs` 文件的 `ConfigureServices()` 方法中添加数据库上下文。添加这些代码。\n\n```csharp\npublic\
    \ void ConfigureServices(IServiceCollection services)\n{\n    // 添加框架服务。\n   \
    \ services.AddDbContext<ApplicationDbContext>(options =>\n        options.UseSqlite(Configuration.ConnectionString(\"\
    DefaultConnection\")));\n\n    services.AddIdentity<ApplicationUser, IdentityRole>()\n\
    \        .AddEntityFrameworkStores<ApplicationDbContext>()\n        .AddDefaultTokenProviders();\n\
    \n    services.AddMvc();\n\n    // 添加 postgresql\n    var connectionString = Configuration[\"\
    DbContextSettings:ConnectionString\"];\n    services.AddDbContext<DemoDbContext>(opts\
    \ => opts.UseNpgsql(connectionString));\n\n    // 添加应用服务。\n    services.AddTransient<IEmailSender,\
    \ AuthMessageSender>();\n    services.AddTransient<ISmsSender, AuthMessageSender>();\n\
    }\n```\n\n## 6.4.6 开发 ASP.NET Core MVC 视图\n\n开发完 Controller 后，我们开发视图。我们在 Views\
    \ 中创建 Product。然后创建如图所示的四个视图文件。\n\n![](img/03410162e36ac22ee4df2780b4d3848c_52_0.png)\n\
