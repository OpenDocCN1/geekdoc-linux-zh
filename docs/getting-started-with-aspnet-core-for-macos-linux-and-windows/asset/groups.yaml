    <div class=\"editor-label\">\n    <div style=\"float: left;\">\n        @Html.CheckBoxFor(model\
    \ => model.IsDiscount)\n    </div>\n    @Html.LabelFor(model => model.IsDiscount)\n\
    </div>\n<br/>\n<input type=\"submit\" value=\"Save\" />\n</fieldset>\n```\n\n\
    Save.cshtml 文件的实现。\n\n```cshtml\n@{\n  Layout = \"Views/Shared/Layout.cshtml\"\
