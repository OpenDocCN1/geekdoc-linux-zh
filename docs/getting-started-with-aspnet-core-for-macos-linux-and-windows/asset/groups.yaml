    # Preface


    This book was written to help anyone want to get started with ASP.NET Core. It
    describes ASP.NET Core deploying and the basic elements of ASP.NET Core and shows
    how to work with several ASP.NET Core features.


    Agus Kurniawan


    Depok, January 2017'
