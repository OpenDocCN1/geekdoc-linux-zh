    # 2.3 Testing


    To test our .NET Core, we build a simple Console application. From Terminal, type
    these commands.


    ```

    $ mkdir hello

    $ cd hello

    $ dotnet new

    ```


    Now you can reload all required libraries for .NET Core application. Then, run
    the program.


    ```

    $ dotnet restore

    $ dotnet run

    ```


