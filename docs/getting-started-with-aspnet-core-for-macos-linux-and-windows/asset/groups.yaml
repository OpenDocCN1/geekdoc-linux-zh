    \nIn this section, we create a new project for ASP.NET Core MVC. Open Terminal\
    \ or Command Prompt. Then, you can type this command on Terminal.\n\n```\n$ yo\
    \ aspnet\n```\n\nSelect Web Application with Bootstrap for UI framework. Given\
    \ the project name, for instance, MvcDemo.\n\n```\ncodes – TERM_PROGRAM=Apple_Terminal\
    \ SHELL=/bin/bash — 80×26\nagusk$ yo aspnet\n      Welcome to the\n      marvellous\
