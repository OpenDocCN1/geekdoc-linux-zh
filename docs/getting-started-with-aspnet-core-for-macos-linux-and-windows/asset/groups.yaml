    \ class=\"btn btn-primary btn-large\">Create &raquo;</a></p>\n</div\n```\n\n以下是\
    \ Create.cshtml 文件的实现。\n\n```cshtml\n@using PostgresDemo.Models\n@model ProductViewModel\n\
    @{\n  Layout = \"Views/Shared/Layout.cshtml\";\n  ViewBag.Title = \"Create Product\"\
