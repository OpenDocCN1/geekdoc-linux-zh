    Now listening on: http://localhost:5000\nApplication started. Press Ctrl+C to\
    \ shut down.\n\nYou can open a browser and navigate to http://localhost:5000.\
    \ You can see the form which is shown in Figure below.\n\n## 3.4 Building ASP.NET\
    \ Core MVC Application\n\nThe second demo is to build ASP.NET Core MVC application\
    \ from scratch. We develop a simple entry form and utilize ASP.NET Core MVC session.\
    \ The following is our scenario:\n\n- User fills a form to create a new product\n\
    - User clicks Save button to save the data\n- The data will be stored to a session\
    \ stack\n- Then, the data will be shown on another page\n\nWe start to develop.\n\
    \n### 3.4.1 Creating a Project\n\nFirstly, we create a project by yo aspnet. Open\
    \ Terminal and type this command:\n\n```\n$ yo aspnet\n```\n\nPlease select Empty\
    \ Web Application. Given project name, ProductApp.\n\n![](img/03410162e36ac22ee4df2780b4d3848c_16_0.png)\n\
    \n![](img/03410162e36ac22ee4df2780b4d3848c_17_0.png)\n\nYou should select Empty\
    \ Web Application. You can load this folder using Visual Studio Code.\n\n### 3.4.2\
    \ Configuring ASP.Net MVC Project\n\nWe need to create a config file, called project.json,\
    \ on the project root folder. It consists of required libraries. We write this\
    \ script for project.json to enable MVC on ASP.Net Core.\n\n- Controllers\n- Models\n\
    - Views\n\n```json\n{\n  \"dependencies\": {\n    \"Microsoft.NETCore.App\": {\n\
    \      \"version\": \"1.1.0\",\n      \"type\": \"platform\"\n    },\n    \"Microsoft.AspNetCore.Diagnostics\"\
    : \"1.1.0\",\n    \"Microsoft.AspNetCore.Mvc\": \"1.1.0\",\n    \"Microsoft.AspNetCore.Razor.TagHelpers\"\
    : {\n      \"version\": \"1.0.0-preview-2-final\",\n      \"type\": \"build\"\n\
    \    },\n    \"Microsoft.AspNetCore.Server.IISIntegration\": \"1.1.0\",\n    \"\
    Microsoft.AspNetCore.Server.Kestrel\": \"1.1.0\",\n    \"Microsoft.AspNetCore.SpaServices\"\
    : \"1.1.0-*\",\n    \"Microsoft.AspNetCore.StaticFiles\": \"1.1.0\",\n    \"Microsoft.Extensions.Configuration.EnvironmentVariables\"\
    : \"1.1.0\",\n    \"Microsoft.Extensions.Configuration.Json\": \"1.1.0\",\n  \
    \  \"Microsoft.Extensions.Configuration.CommandLine\": \"1.1.0\",\n    \"Microsoft.Extensions.Logging\"\
    : \"1.1.0\",\n    \"Microsoft.Extensions.Logging.Console\": \"1.1.0\",\n    \"\
    Microsoft.Extensions.Logging.Debug\": \"1.1.0\",\n    \"Microsoft.Extensions.Options.ConfigurationExtensions\"\
    : \"1.1.0\"\n  },\n  \"tools\": {\n    \"Microsoft.AspNetCoreCore.Razor.Tools\"\
    : \"1.0.0-preview2-final\",\n    \"Microsoft.AspNetCore.Server.IISIntegration.Tools\"\
    : \"1.0.0-preview2-final\",\n    \"Microsoft.DotNet.Watcher.Tools\": \"1.0.0-preview2-final\"\
    \n  },\n  \"frameworks\": {\n    \"netcoreapp1.1\": {\n      \"imports\": [\n\
    \        \"dotnet5.6\",\n        \"portable-net45+win8\"\n      ]\n    },\n  \
    \  \"buildOptions\": {\n      \"emitEntryPoint\": true,\n      \"preserveCompilationContext\"\
    : true,\n      \"compile\": {\n        \"exclude\": [\"node_modules\"]\n     \
    \ }\n    },\n    \"runtimeOptions\": {\n      \"configProperties\": {\n      \
    \  \"System.GC.Server\": true\n      }\n    },\n    \"publishOptions\": {\n  \
    \    \"include\": [\n        \"appsettings.json\",\n        \"ClientApp/dist\"\
    ,\n        \"Views\",\n        \"web.config\",\n        \"wwwroot\"\n      ],\n\
    \      \"exclude\": [\n        \"wwwroot/dist/*.map\"\n      ]\n    }\n  }\n}\n\
    ```\n\nThen, you create the following folder:\n\n![](img/03410162e36ac22ee4df2780b4d3848c_18_0.png)\n\
    \n## 3.4.3 Writing Program\n\nIn this section, we write our ASP.NET Core program.\n\
    \n### 3.4.3.1 Creating Model\n\nA model holds a data. In our case, we create a\
    \ module, called Product, which consists of four properties. Create a file, called\
    \ Product.cs, and write this code.\n\n```csharp\nusing System.ComponentModel.Annotations;\n\
    namespace ProductApp.Models\n{\n    public class Product\n    {\n        [Required]\n\
    \        [MinLength(4)]\n        [Display(Name = \"Name\")]\n        public string\
    \ Name { get; set; }\n        [Display(Name = \"Product Code\")]\n        public\
    \ string ProductCode { get; set; }\n        [Display(Name = \"Quantity\")]\n \
    \       public int Quantity { get; set; }\n        [Display(Name = \"Is Discount\"\
    )]\n        public bool IsDiscount { get; set; }\n    }\n}\n```\n\nSave this file\
    \ into Models folder.\n\n### 3.4.3.2 Creating Controller\n\nNow we create MVC\
    \ controller, called Home controller. Create a file, called HomeController.cs,\
    \ and write this code.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Threading.Tasks;\nusing Microsoft.AspNetCore.Mvc;\n\
    \nusing ProductApp.Models;\nnamespace ProductApp.Controllers\n{\n    public class\
    \ HomeController : Controller\n    {\n        public IActionResult Index()\n \
    \       {\n            return View();\n        }\n        public IActionResult\
    \ Create()\n        {\n            var product = new Product();\n            return\
    \ View(product);\n        }\n        [HttpPost]\n        public IActionResult\
    \ Create(Product obj)\n        {\n        }\n    }\n}\n```\n"
