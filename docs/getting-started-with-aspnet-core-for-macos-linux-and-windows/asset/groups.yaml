    # 5. ASP.NET Core and Angular 2


    In this chapter I''m going to explain how to work with ASP.NET Core MVC and Angular
    2.


    # 5.1 Getting Started


    In this section, we develop a simple app to work with ASP.NET RESTful and AngularJS.

    nAngularJS is an open-source JavaScript framework, maintained by Google, that
    you can visit official website on http://angularjs.org/.

    In this chapter, we explore to integrate Angular 2 into ASP.NET Core.


    # 5.2 ASP.NET Core and Angular 2 Project Template


    You can learn Angular 2 on the official website, https://angular.io. We develop
    Angular 2 using JavaScript and TypeScript.

    The idea to integrate ASP.NET Core MVC and Angular 2 is to merge the both projects,
    ASP.NET Core and Angular 2. Fortunately, we can use aspnetcore spa template, https://github.com/aspnet/JavaScriptServices.

    You can use this template by typing this command on Terminal.


    ```

    $ npm install -g yo generator-aspnetcore-spa

    ```


    If done, you can build a sample project from this project template.


    # 5.3 Run Demo: ASP.NET Core Angular SPA


    In this section, we run program sample from aspnetcore spa template.


    # 5.3.1 Creating a Project


    You can create ASP.NET Core with Angular 2 by typing this command.


    ```

    $ yo aspnetcore-spa

    ```


    Select Angular 2 as framework.'
