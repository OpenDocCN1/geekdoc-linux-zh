    \ world!\n\n欢迎来到你的新单页应用，它构建于：\n\n- 用于跨平台服务器代码的 ASP.NET Core 和 C#\n- 用于客户端代码的 Angular\
    \ 2 和 TypeScript\n- 用于构建和打包客户端资源的 Webpack\n- 用于布局和样式的 Bootstrap\n\n为了帮助你入门，我们已经设置了：\n\
