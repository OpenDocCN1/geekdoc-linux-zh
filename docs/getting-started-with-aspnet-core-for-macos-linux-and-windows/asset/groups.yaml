    # # 1. Preparing Development Environment


    # ## 1.1 ASP.NET Core


    ASP.NET Core is a lean and composable framework for building web and cloud applications.
    ASP.NET Core is fully open source and available on GitHub, http://github.com/aspnet/home
    .


    This book will focus on how to develop ASP.NET Core 1.1 on OS X, Linux and Windows
    platforms. We use ASP.NET Core 1.1 version.


    # ## 1.2 System Requirements


    For testing, I use Debian/Ubuntu Linux, macOS and Windows 10. You can use any
    Linux distribution which inheritance from Debian based.


    # ## 1.3 Development Tools


    In general, we can use any editor to write ASP.NET Core program. You use Sublime
    Text, http://www.sublimetext.com/ , to write ASP.NET Core codes. Microsoft also
    released Visual Studio Code and you can download it on https://code.visualstudio.com/
    . In this book, I use Visual Studio Code to develop ASP.NET Core program.'
