    \  id: feeds\n  # We'll later add a button\n  # feeds\n```\n\nThat's a big, but\
    \ it defines everything about the appearance of our main screen.\n\nWe encourage\
    \ you to experiment with changing the various properties until it's unclear what\
    \ they are doing. Just one more rule is needed, then we can run the program:\n\
    \n```\nManager:\n  HomeScreen:\n```\n\nThe ScreenManager will display HomeScreen\
    \ by default. When you run the code to see what it looks like:\n\n> Experiment\
    \ with the various properties until it's unclear what they're doing\n\nThe next\
    \ step is to download and parse the given feed. If you want to use the Python\
    \ feedparser library which can then parse the XML for us, you should install it\
    \ easily with pip:\n\n```\npip install feedparser\n```\n\nBefore we get to use\
    \ it, we need another screen to display the results. Here is the Python code:\n\
    \n```\nclass Feed(Screen):\n  pass\nBoxLayout:\n  orientation: 'vertical'\n  size_hint:\
    \ None\n  height: dp\n  root: root\nScrollableGridLayout:\n  id: feeds_entries\n\
    \  ScrollView:\n```\n\n...and just like before, the kv:\n\n```\n<FeedScreen(Screen):\n\
    \  pass\n```\n\nThis time we have a label showing its name (all Screens have a\
    \ name property, we'll set it shortly), another scrollable list that will contain\
    \ buttons for each feed item, and a Button to return to the main screen.\n\nThe\
    \ text_size is a tuple describing the box that must fit it, so if it's too wide\
    \ it will insert a line break. In this case the width is locked to the vertical\
    \ alignment. We take the height of the label which is shaped by text based on\
    \ that result, it will automatically refit to its width, which will then get all\
    \ the text correct in final entry to our EntryButton:\n\nOverall\n\nYou'll notice\
    \ that if we make these buttons at once, it's not very efficient - if there are\
    \ hundreds of feeds it will slow the widgets and the gui. This problem can be\
    \ solved by using a Listview which can internally attach the button, but it shouldn't\
    \ be a problem for most.\n\n```\nimport feedparser\nfrom kivy.network.urlrequest\
    \ import UrlRequest\nclass Manager(ScreenManager):\n  def get_feed(self, name):\n\
    \    self.feed_name = name\n  def get_feed(self, result):\n    self.feed_name\
    \ = result.feed_name\n    add_widget(self, Feed(name=result.feed_name))\n```\n\
    \nThe idea is that we want to view the feed we can call the get_feed method with\
    \ name to be a unique identifier string; we use the feed_name current property\
    \ of the ScreenManager.\n\nWe have introduced the UrlRequest. This is a long list\
    \ of HTTP requests used by performing the request in the background, calling a\
    \ callback function.\n\nFinally, we have to actually populate the screen when\
    \ the callback passed to the UrlRequest completes (Fig. 0).\n\nThe following is\
    \ the code used to define the appearance of the new EntryButton. First, a dynamic\
    \ class of a text label that matches the length of the text:\n\n```\n<ResizingLabel:\n\
    \  size_hint_y: None\n  size_hint_width: 1\n  height: self.text_size[1]+dp(10)\n\
    ```\n\nAt this point you can run the app and actually fetch the feed! Pressing\
    \ the button will immediately show our new screen, which is populated with entries\
    \ as they arrive. A couple of seconds depends on the feed and the request, but\
    \ the app should remain responsive to touch.\n\n```\n# include the HomeScreen\
    \ rule\nFixedSizeButton:\n  text: 'Fetch'\n  on_press: manager.root.get_feed(feed_input.text)\n\
    id: feed_input\n```\n\nWith the basics working, now it's a good time to clean\
    \ up the rest of the app. For a start,\n\n42 www.linuxuser.com"
