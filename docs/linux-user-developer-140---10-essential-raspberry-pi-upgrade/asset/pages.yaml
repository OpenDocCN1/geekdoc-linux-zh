    \ $POST globals to handle them, so if we then return them to the newly mapped\
    \ $GET object. Now, we can start dealing with requests... although there is one-sided\
    \ catch.\n\n# Cheat sheet\n\nMake simple changes for more optimised code\n\n#\
    \ Returning null values\n\nWhen passing a parameter to a function, using a \"\
    ?\" before the datatype will allow that value to be null rather than throwing\
    \ an error.\n\n# Data type inference\n\nHack allows you to declare variables without\
    \ explicitly stating their type. But, with so, the HHVM can better optimise it\
    \ to execute the code.\n\n# Class initialisation\n\nIn order to use properties\
    \ in a class, they must be initialised, which you can do like so...\n\n# class\
