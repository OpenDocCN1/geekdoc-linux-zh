    \n# Read analog inputs with your Raspberry Pi\n\nUnlike other microcontrollers,\
    \ the Pi can read analog sensors – but adding this functionality is surprisingly\
    \ affordable\n\nWhat is it?\n\nIf you want to add ability to read sensors for\
    \ your Raspberry Pi you'll need a very particular piece of hardware – an analog\
    \ to digital converter. The cheapest and simplest way to implement this with the\
    \ Raspberry Pi is using an ADC chip which adds inputs at the cost of just four\
    \ GPIO pins. With a small selection of prototyping parts and a sprinkling of Python\
    \ code you could be reading temperature sensors or using analog-thread to create\
    \ your own gadgets in next to no time at all.\n\nto its various pins on and off.\
    \ With a single pulse-width-modulation-capable (PWM) pin, the Raspberry Pi can\
    \ even offer fine-grained control to change the brightness of an LED or speed\
    \ of a DC motor – but for electronics-based projects, analog sensing is something\
    \ that's readily needed on many similar microcontrollers. With it you can get\
    \ very precise feedback from a potentiometer (which works like a volume control)\
    \ or an IR sensor to help you bump into things. You can also use an ADC-based\
    \ Raspberry Pi to turn a light on-night automatically using a cheap-as light dependent\
    \ resistor (LDR), otherwise known as photocells, as demonstrated in our example.\n\
    \n+   MCP3008 E2 takes very little room on a small breadboard\n\n# What you'll\
    \ need\n\n+   MCP3008 E2 www://www.cpc.co.uk\nBreadboard\nJumper wires (male to\
    \ female)\n\n# Installing software\n\n+   01 Clear the blacklist\nWith a terminal\
    \ window, type: sudo nano /etc/modprobe.d/raspberry-blacklist.conf. Add a hash\
    \ (#) to the start of the line and press CTRL+X, then Y and Enter.\n\n+   03 Read\
    \ the sensors\nTo fruit from an analog sensor connected to the side of the MCP3008,\
    \ use the following code to import it – leave in and add as example the first\
    \ two pins to see the results from our two potentiometers. Run with sudo python\
    \ test.py to test it.\n\n+   02 Install spidev and spidev\nThere are a couple\
    \ of packages we need. At the terminal type: sudo apt-get python-dev-spidev. Once\
    \ the packages are installed sudo apt install spidev Finally sudo restart your\
    \ Raspberry Pi.\n\nWhy do it?\n\nThe Raspberry Pi GPIO pins are great – they allow\
    \ you to interact with the physical world in reality by turning the voltage\n\n\
    ```\nspi = spidev.SpiDev()\nspi.open(0,0)\n```\n\n```\ndef readad(adcnum):\n \
    \   if (adcnum > 7) or (adcnum < 0):\n        return -1\n    data = spi.read_i2(2)\n\
    \    return ((data[0] << 8) + data[1])\n```\n\n```\nwhile True:\n    print(\"\
    \ Cell 1: \" + str(readad(0)))\n    print(\" Cell 2: \" + str(readad(1)))\n  \
    \  time.sleep(1)\n```\n\n```\nimport spidev\nimport RPi.GPIO as GPIO\nimport time\n\
    GPIO.setmode(GPIO.BCM)\n```\n\n20 www.linuxuser.org"
