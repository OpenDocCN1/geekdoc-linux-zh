    jack, amplified speaker terminals (not populated), expansion header

    - Inputs: 3.5mm amplified headset jack, 3.5mm line-level jack, digital to I2S
    jack, dual MEM microphones


    Pogo-pins used for temporary test connections, mean no soldering is needed on
    the P header


    +   - A plastic stand-off secures the Wolfson Audio Card to the Pi via one of
    the holes


    # Also consider


    The Wolfson Audio board uses the main P1 GPIO header as the smaller P5 header


    +   - Additional features of the WMS102 codec are available on the expansion header


    ![](img/a17757b82ff78d9c8d36ac46319604f3_78_1.png)


    P5 header, which carries an audio signal, from the board made in Model Revision
    2 BCM2835. This board is shared by the Model A; Original B, with 256KB of memory,
    link the P6 connector and other headers to connect with the board.


    As installing your partition is straightforward, so so avoiding soldering is easy.
    The Wolfson board uses pogo-pins – normally used for accessory memory testing
    – that pass is done under the pads and is secured in place via a stand-off in
    one of the holes.

    Software installation is a bit more awkward. The Wolfson audio board requires
    patches to the Linux kernel which are not part of the standard distribution. Running
    with two partitions, one for each OS, or using a prepartitioned version that is
    provided by the Wolfson project Next is ideal, but it would be nice to see the
    partition scheme included in the manual.

    Once installed, configuration is simple: input and output modes, which are toggled
    using bundled shell scripts. One script sets the board up to use its digital inputs
    and outputs, another to use the analogue and still to enable the headset


