  md: '# Twitter clients


    Keep up with Twitter without resorting to closed-source web apps


    # REVIEW


    # Birdie


    # The newcomer will soon be getting an overhaul, but how is it currently?


    # Chogqok


    It''s been around a while, but was quick to be updated during the API changes


    ![](img/a17757b82ff78d9c8d36ac46319604f3_74_0.png)


    +   - Add multiple accounts to Birdie to monitor multiple feeds at a time


    # Interface


    Birdie has a simple yet decent interface, copying the style of the web and phone
    interface for Twitter with icons and profile picture. There are no columns, however,
    would have been a nice addition, especially with the way it handles multiple accounts
    and is the only client that has to support lists.


    # Interface


    Chogqok is confusing and not what we''d expect from something heavily tied to
    KDE. The simple-layout has only one redundant button that, customise, can''t be
    changed to anything useful. The aesthetics are pretty de down


    # Twitter features


    Like the rest of the clients, notifications are strictly limited to mentions.
    However, you can post tweet replies, even if you have never seen the feeds of
    the tweets you''ve created and add more. You can also add pictures easily and
    links are automatically shortened within a tweet.


    # Twitter features


    Tweets, replies, and the trifecta of basic features that all these clients seem
    to need. There''s no tweet scheduling available, although at least you can post
    pictures, unlike Gwhibber. There''s also support for multiple accounts and you
    edit lists, but not single


    # Installation


    Birdie is not included in any package managers and binaries exist only for a different
    distribution. Locating them is not difficult, but you do need download the kde
    widget to work properly - with the GTK desktop rendering as your environment.


    # Installation


    The only issue with Chogqok installation is that it requires KDE elements. If
    you use a GNOME or GTK desktop, you''ll be seeing popular and older styles; this
    means the API settings have been back-ported to a few back-ported along with it.


    # Customizability


    There''s not even a Settings, everything about Birdie - apart from the accounts
    you''ve added - is fixed. The update period is fixed and with no proper desktop
    integration you''re at the merch of the app when it updates with news.


    # Customizability


    Chogqok is the most customise client in this test, with an excellent menu that
    allows you to edit some interface options, rules,, shortcuts, and a bit more.
    There''s also a plug-in, however there''s no community behind Chogqok to support
    it, which leaves you with the default plugins and nothing extra of it.


    # Overall


    Birdie looks great and it should be really good, but it''s missing some fairly
    things such as columns, notifications and even just basic customisation. Hopefully
    these are being looked at the next version.


    # Overall


    Chogqok is fine, but not really good enough compared to its rivals. Bad interface
    with red customisation options makes it frustrating to use and you''re not getting
    better use out of Twitter functions than the other clients.


    > 5


