    # MINI PC


    # Matrix TBS2910 £125 / $200


    With a quad-core processor, scads of RAM and 16GB of on-board storage, can this
    mini PC bring the ARM architecture back to the desktop?


    > **Pros**

    A powerful processor with mini-PC Express expansion and another attraction really
    makes the Matrix stand out from the crowd


    > **Cons**

    Poor software supports the Matrix drive with a Windows-only tool left between
    OS options


    The Matrix mini-PC is an interesting beast. At its heart, a powerful single-board
    computer reminiscent of a suited-up Raspberry Pi; however, has a very different
    target market in mind for its design.


    Designed and built by TBS Technologies, a company specialising in digital TV products,
    the Matrix aims to be first in its field. The transparent casing is clearly distinct
    from the matte black of its metal products, although the bright red printed critical
    bits


    The secret lies in its intended use: unlike the majority of ARM-based boards on
    the market today, the Matrix includes a mini-PC Express slot on this side. This
    is designed for use with digital TV tuners – separately to turn the Matrix into
    a powerful set-top box solution.


    Accordingly, the board comes with a Linux distributed Matrix TV on its NAND flash,
    which is expandable using a full-size SD card on the side or by removing the board
    from the case and using a micro-FT slot on the board. This boots into the XMCMC
    user interface — formerly known as XMedia Centre, allowing usual smoothing and
    playback of media from remote and local storage.


    It''s here another feature of the Matrix that shines: an on-board SATA hard drive,
    complete with a SATA power connector for a 2.5-inch hard drive. Although the SATA
    cable comes out of the casing at front – not the best choice for an aesthetic
