  md: '# A brand new Firefox


    Mozilla has overhauled Firefox for the first time in years with a familiar design
    and a greater focus on customisation


    It''s been over two years since Mozilla went the route of Chromium following Google''s
    Chrome, necessitating regular updates to Firefox. The overall design of the browser
    hasn''t changed much in that time, with updates focusing on or streamlining features
    - this was all since the releases were increased. However, all has changed with
    the release of Firefox 29 - a major visual update that Mozilla calls the biggest
    change since Firefox 4.


    The first noticeable change is the way tabs are presented. Dispensing with the
    chunky tab and Firefox menu, Mozilla has worked to adapt the look of Chromium
    and Chrome down to the curved tabs sitting tab has also introduced more customisation,
    allowing you to customise the interface even. Although you won''t be able to change
    the tabs back to the previous style, this is what you preferred.


    The idea is to make the interface more streamlined and simpler when it needs to
    be, avoiding clutter.


    > The idea is to make the interface more streamlined and simpler when it needs
    to be


    ![](img/a17757b82ff78d9c8d36ac46319604f3_11_0.png)


    The new Firefox aesthetic is simpler, more streamlined and easier to use


    and use-cases. We work to do that for everyone, but if we leave little room for
    choice we might alienate some users. We want the browser to reflect all values
    to which we''re absolutely committed to.

    "Customisation allows the person to use the browser how they want and spend more
