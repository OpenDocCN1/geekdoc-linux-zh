    \ is it?\n\nAn IR reference sensor such as the GPZD120 offers a great way to sense\
    \ the world, using the infrared-red light to 'ping' its surroundings in the same\
    \ way as a bat locates in the dark. The closer an obstacle to the sensor, the\
    \ higher you'll be receiving from its analog reading (between 10 and 123).\n\n\
    # ## Why do you need it?\n\nThese sensors are perfect for Raspberry Pi projects\
    \ that require any acknowledgement of their surroundings. For example, you could\
