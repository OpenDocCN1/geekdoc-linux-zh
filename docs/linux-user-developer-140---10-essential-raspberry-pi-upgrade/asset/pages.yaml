  md: '# # Use Google Docs on Linux with Grive


    Get Google Drive on Ubuntu, Fedora and openSUSE


    TUTORIAL


    ![](img/a17757b82ff78d9c8d36ac46319604f3_30_0.png)


    # 01 Ubuntu repository


    Grive Tools is not included in Ubuntu or Ubuntu-based distros, you''ll need to
    add a third-party repository to install it. Add with this:


    ```

    sudo add-apt-repository ppa:fanclub/grive-tools

    ```


    Follow up with the usual sudo apt-get update before we continue.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_30_1.png)


    # 02 Ubuntu install


    After the apt-get install, Grive will appear in the software centre. If you want
    to go there and install it, we already have a terminal open we might as well:


    ```

    sudo apt-get install grive-tools

    ```


    ![](img/a17757b82ff78d9c8d36ac46319604f3_30_2.png)


    # 03 Fedora dependencies


    You''ll need to install specific dependencies for openSUSE, Fedora and RHEL-based
    distros. Specifically, open a terminal and install with:


    ```

    sudo yum install gjson-json-devel qt-base-devel openssl-devel libxml2-devel curl-devel

    ```


    The same packages will be installed on the other distros.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_30_3.png)


    # 04 Grive package


    Grive is not in the repositories of any of these distros, however binaries exist
    if you don''t want to build it from source. Go to RPMSEEK and search for Grive,
    pick the version for your distro and download it.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_30_4.png)


    # 05 Install the download


    Once installed, the package: you can do it graphically or with:


    ```

    sudo yum install grive-tools-1.9.noarch.rpm

    ```


    After that, go to the Resources link for Grive Tools and find the location on
    the website, download this binary and install it allide:


    # 06 Start the setup


    Setup how to actually get Grive Tools working on both systems is the same, we''ll
    cover it at once mentioning any extras that need to be done for a specific distro.
    The first thing you''ll need to do is look for Grive Setup in your list of programs.


    # 07 Log into your account


    If you haven''t already created a Google account, you''ll need to get one sorted
    before continuing. Otherwise, click Next to bring up a browser that points towards
    Google and ask to log. Make sure you''re logged in to the correct address before
    continuing:


    ![](img/a17757b82ff78d9c8d36ac46319604f3_30_5.png)


    # 08 Connect your account


    You''ll be asked if the specific account you want to allow: you''ll need to continue
    continuing, otherwise you can''t sync your drive data. It will then give you a
    pop-up when the browser opens.


    # 09 Code input


    Press Next to accept the code. A new Google Drive window will show your files
    being synced to your PC. This will take a while depending on how much you you
    have stored on your account.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_30_6.png)


