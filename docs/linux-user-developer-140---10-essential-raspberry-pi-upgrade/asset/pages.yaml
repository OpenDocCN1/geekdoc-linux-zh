  md: "# # Create a cross-platform RSS reader with Kivy\n\nDiscover the wide range\
    \ of widgets and behaviors Kivy offers\n\nTUTORIAL\n\nFinally, a method to handle\
    \ creating (Fig. 03).\nThis does nothing more than create and populate the EntryScreen\
    \ with the information it needs. We will use these for those screens to be created\
    \ by the EntryButtons by adding an extra line at the top of their key definitions:\n\
    \n> The behaviors and techniques available to you are a great base from which\
    \ to structure your app\n\n```\n**EntryButton:\non_release:\n  app.root.new_entry_screen(self,\
    \ data, self.feed_one())\n```\n\nThis leaves only one issue: the EntryScreen has\
    \ an 'Open browser' button to a method that will only work on Android. It's not\
    \ complex to add: we can use Python's webbrowser module to open in a full browser,\
    \ but that would work on any desktop system. What about iOS?\n\nThe answer is\
    \ to use Kivy's API to directly call the native functions responsible for displaying.\
    \ We will provide an Android example here, without going into the details, but\
    \ with normal Android development experience. We are directly calling the native\
    \ API with an example of Java snippet. Kivy is perfect for projects requiring\
    \ more Pythonic than some tasks (Fig. 04).\n\nWe should also add an on_pause method\
    \ to our App class, returning True to let Kivy know the app can handle the pausing\
    \ when you open the browser on Android, and you can use the back button to return\
    \ to it.\n\n```\n# Add to the RSSManager\ndef_on_pause(self):\n```\n\nThat's everything!\
    \ You can run your program and finally view the information for each RSS feed\
    \ entry, opening a link to the full article.\n\nThrough this article we've provided\
    \ a bare-bones RSS reader, but you've seen many more of the behaviors and techniques\
    \ available to help you to structure your app.\n\nAs a last note, here are the\
    \ instructions from the previous chapter that would still work for this app, but\
    \ will need a couple of extra changes in your builder.spec to use the feedparser\
    \ module and access the internet through android permissions system. We suggest\
    \ it as shown in Fig. 05\n\n```\n# Add to the RSSManager\ndef new_entry_screen(self,\
    \ data, parent):\n```\n\n```\ntitle = data.get('title').encode('ignore')\ntags\
    \ = ', '.join(data.get('tags')).encode('ignore')\nauthor = data.get('author').encode('ignore')\n\
    published = data.get('published').encode('ignore')\nsumary = data.get('summary').encode('ignore')\n\
    url = data.get('url').encode('ignore')\n```\n\n```\nscreen = EntryScreen(title=title,\
    \ tags=tags, author=author, summary=summary, parent=parent, name=title, url=url)\n\
    ```\n\n```\nself.add_widget(screen)\nself.current = screen\n```\n\n```\nimport\
    \ webbrowser\nfrom kivy.utils import platform\n```\n\n```\n# Add this to the EntryScreen\n\
    def on_pause(self):\n  if platform == 'android':\n```\n\n```\n    from jnius import\
    \ autoclass\n    context = autoclass('org.kivy.android.Activity').mActivity\n\
    \    Intent = autoclass('android.content.Intent')\n    intent = Intent(Intent.ACTION_VIEW)\n\
    \    intent.setData(Intent.parseURI(self.url, 'text/html'))\n    context.startActivity(intent)\n\
    ```\n\n```\nelse:\n    import webbrowser\n    webbrowser.open(self.url)\n```\n\
    \n```\n# builder.spec\ntitle = Kivy RSS Reader\nrequirements = feedparser,kivy\n\
    # installing the module\n```\n\n```\norientation = portrait\nfullscreen = 0\n\
