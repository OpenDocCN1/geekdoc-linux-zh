    \ activity in your target area. Alternatively, you could employ sensors on an\
    \ autonomous robot to avoid obstacles at high speed, to tell it to turn right.\n\
    \ntest code we produced for the MCP3008 shows you how easy it is to read and decode\
    \ readings from these sensors to make a robot move independently detect things:\n\
