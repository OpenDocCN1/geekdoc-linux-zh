    high-fidelity 24-bit audio multichannel with high dynamic range. Despite being
    limited by the 5MB/s bandwidth, the high-sample-rate, high-bit-rate outputs are
    clear and crisp. Thus, well worked, and the multi-output interface is useful for
    any projects that use the Raspberry Pi Compact or its Nano.


