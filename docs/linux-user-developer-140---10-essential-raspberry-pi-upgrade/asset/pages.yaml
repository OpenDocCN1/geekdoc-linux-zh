    \ performance.\n\n+   1. Optimise everything worked on it\n2. Optimise your custom\
    \ code-base to make the load that is able to handle.\n\nFacebook opted for the\
    \ speed of development over cost, so they did by the bucket load. The first of\
    \ those we used was HHHop, a tool for converting a subset of PHP into what would\
    \ become HHVM. Most, other technologies, like WebScale, were optimized with MySQL\
    \ 5.6 for large-scale applications.\n\nWith out of the box, rather than perfecting\
    \ their over level or more over our language, Facebook decided to invest time\
    \ and dollars in the technologies they could use. As a result of their work, Hack,\
    \ which has delivered Facebook a doubled speed increase in the execution of its\
    \ desktop site without affecting the development.\n\nThe next step in Facebook's\
