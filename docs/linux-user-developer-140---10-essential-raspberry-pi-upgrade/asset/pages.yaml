    > The plotting capabilities of Octave are very impressive


    All work is done by the linspace(D, 5, 100) command, which divides the [US] space
    into 100 points, it returns all 100 points, creating a much more pleasant output.


    # Advanced plotting examples


    This step will create a graph and improve its output by using Octave. First, the
    usual commands from the previous step will suffice.


    ```

    octave:> c = [1 -2 -3];

    octave:>4 myVals = linspace(0, 5, 100);

    octave:>5 y = polyval(c,myVals);

    ```


    The next command changes the width of the line that is being sketched:


    ```

    octave:>6 plot(myVals, y, "linewidth");

    ```


    The command below displays the "f(x)" string on the y-axis:


    ```

    octave:>7 set(gca,"label",text \u2192("","f(x)","fontsize",25));

    ```


    The following command adds a beautiful grid to the output:


    ```

    octave:>8 grid on

    ```


    The next command draws a legend on the output:


    ```

    octave:>9 legend("Linux User" and \u2192(\Developer");

    ```


    # Output formats


    After executing all the commands of the previous step, you might like to save
    the output to a file. The following command will do the job:


    ```

    octave:>10 print("LU.png","-dpng");

    ```


    The last command saves the graphics in PNG format using the "LU.png" filename.
    Other supported formats include Encapsulated PostScript (eps), PostScript (ps),
    PDF (pdf), JPEG (jpg or jpg), GIF (gif), Tex picture (tex) and LaTeX picture (platex).


