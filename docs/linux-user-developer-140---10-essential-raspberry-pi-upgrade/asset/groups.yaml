    # Tutorial Use Google Docs on Linux with Grive Tools


    Large file tip

    Google Drive - not just Grive - always seems to have issues with uploading larger
    files. We suggest splitting them into smaller files using split on a compressed
    file to make them a specific size. You can do it in a terminal:


    File types

    One of the major things you may have noticed is which documents have and have
    not been downloaded by Grive. On the official clients, links will be added that
    you can jump straight to pure Google Docs files, which are actually DOC, ODT or
    PDF if they are downloaded by the system. The latter files are downloaded if they''re
    properly stored in Drive. The upload is properly stored locally and will still
    sync between the cloud and other systems.


    ```

    split -b 500m file.4 newfilename

    ```


    ![](img/a17757b82ff78d9c8d36ac46319604f3_31_0.png)


    ### 10 Desktop notifications

    Once the search is complete, search for again in your programs and look for Google
    Drive Indicator.


    Click on this and it will automatically launch a Dropbox-style toolbar notifier
    for Google Drive. This is also similar to the kind of notifier on desktops with
    an official client,


    ### 16 Location

    Very simply, the Grive folder is kept in the home folder under Google Drive. If
    you''re using GNOME it''s actually opening the files in the GNOME file manager;
    for some reason it also that in Unity and non-GNOME desktop environment.


    ### 11 Access Google Drive

    You can quickly access the contents of your Google Drive by finding the app of
    the same name in your program list. It links straight to your folder for access,
    so you can also add it to favorites or quick bar if you wish. There''s also an
    option to turn off the notifier.


    > With the death of Ubuntu, Grive Tools is a great alternative to Canonical''s
    own cloud storage solution


    ![](img/a17757b82ff78d9c8d36ac46319604f3_31_1.png)


    ### 12 Drive options

    You can access syncing options from the indicator to make sure Grive works as
    you want to. Access them by clicking on the toolbar icon and select preferences.
    A couple of options you''d find useful checked are ''Start Drive'' when computer
    turns on, and ''On screen notifications'',


    ### 13 Auto-sync

    Unlike the official clients, you cannot select which folders follow and do not
    get synced on client. Depending on how you plan to use it, you can turn on Auto-sync
    so that everything is synced up and down at all times, or you can turn it off
    manually when everything is ready.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_31_2.png)


    # Use Google Docs on Linux with Drive Tools


    Get Google Drive on Ubuntu, Fedora and OpenSUSE


    TUTORIAL


    ## 17 Backup to Drive


    One of the benefits of cloud storage for files is that the storage is off-site
    and difficult to lose. This makes it ideal for backing up other documents and
    settings. The simplest and quickest way to do this is to copy a file to the Drive
    folder and upload it.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_32_0.png)


    ## 20 First backup


    Click Run to head up to the first backup operation. You''ll see a verbose list
    of the files and operations as it''s finished, along with any errors that occurred
    along the way. If you have automatic sync turned on, it will start uploading the
    backed up files to Drive.


