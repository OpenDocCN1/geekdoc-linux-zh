    # 通过 BOINC 捐献树莓派 CPU 算力


    使用 BOINC 将你的树莓派处理能力捐献给公益事业，在此过程中帮助攻愈疾病


    ![](img/a17757b82ff78d9c8d36ac46319604f3_65_0.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_65_1.png)


    Rob Zwloot 擅长复杂系统建模，是一位精通 Python、Django 和 PHP 的 Web 开发人员。他热爱实验计算。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_65_2.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_65_3.png)


    ## 你需要什么


    启动自己的 BOINC 农场总有几个理由：你始终可以使用 BOINC（一种计算志愿服务）捐献给更有意义的事业。这些事业包括医学科学的蛋白质折叠、处理大型对撞机数据以及寻找外星生命——所有这些都能从树莓派中获益。


    ## 选择“空闲时 100%”以充分利用树莓派


    02 我们现在可以从树莓派的仓库安装 BOINC 以及运行它所需的其他软件包。准备就绪后，回到终端并使用命令安装所有它们：


    ```

    $ sudo apt-get install boinc-manager boinc-client

    ```


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_0.png)


    03 首次启动。如果树莓派尚未进入桌面环境，请启动 LXDE。进入“程序 (Programs)”菜单->“系统工具 (System Tools)”找到 BOINC
    Manager。点击打开它并开始创建账户的过程。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_1.png)


    05 身份识别。点击“下一步 (Next)”后，你需要创建一个 BOINC 账户。每个项目都需要一个新账户；这允许你以自己的名让多个系统向同一个项目捐献。完成账户创建或登录即可——某些项目会要求你在单独的网页上命名。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_2.png)


    | 选择项目点击名称或输入进行选择 |

    | 类别 (Categories) | 项目详情 |

    | --- | --- |

    | 项目 (Projects) | BOINC 是一个运行各种科学项目的平台 |

    | Worldhome | Worldhome 支持物理、医学、天文学等的研究 |

    | Grid5100 | Einstein 支持天文学的研究 |

    | Einstein | Einstein 支持物理、天文学等的研究 |

    | 社区 (community community) | URL: http://www.boinc.net/projects/ |


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_3.png)


    04 添加项目。在这里你可以为 BOINC 添加新项目；如果你还没有决定想使用哪个项目，请查看所有可能性。现在确保选中了“添加项目 (Add Project)”，并选择你所属的类别以缩小搜索范围；选择一个项目并点击“下一步”。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_4.png)


    06 配置 BOINC。点击“高级 (Back advanced)”选项卡查看更多 BOINC 的设置。进入“工具 (Tools)”->“偏好 (Preferences)”并选择“磁盘和内存使用
    (Disk and memory usage)”选项卡；从这里，你想将“内存使用 (Memory Usage)”更改为 100% 的“空闲 (idle)”，以充分利用树莓派。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_5.png)


    08 如果你计划从树莓派运行命令来处理数据以避免影响你的系统，你可能需要 SSH 登录它，它有一个可以访问的专用命令行工具：


    ```

    $ boincrun

    ```


    09 计算数据。当树莓派开启时，它会找到一个很小的空间来保持活动并通电。未来你可以使用命令行或登录监控界面来添加更多项目。


    07 添加更多项目。点击简单视图（Simple view）返回原始窗口。在底部有一个“添加项目 (Add Project)”按钮，它允许你不仅添加 BOINC
    批准的项目，还可以添加带有 BOINC 链接但不一定包含在目录中的项目。


    ## 常见问题 什么是树莓派计算模块 (compute module)？


    Rob Zwloot 擅长复杂系统建模，是一位精通 Python、Django 和 PHP 的 Web 开发人员。他热爱计算的透明性。（注：原文此处似乎有重复/碎片化的作者简介）。


    如果你喜欢这个…… 树莓派 Model A 通常被遗忘，但 Model B 作为一个树莓派的旗舰版本，它对于大多数需要大量树莓派或不需要 Model B 所有端口的项目来说仍然很棒。


    进一步阅读：查看树莓派博客上的原始公告，获取有关如何获取计算模块的信息：bit.ly/3uezo


    ![](img/a17757b82ff78d9c8d36ac46319604f3_67_0.png)


    '
