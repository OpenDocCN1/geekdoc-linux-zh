    # 教程：使用 Zummo 管理客户：游戏化 CRM


    ![](img/a17757b82ff78d9c8d36ac46319604f3_39_0.png)


    左侧菜单栏上的“线索”（Leads），一旦某个线索通过——即同意购买你的产品/服务，你就可以将其转换为“联系人”（contact），这要求你创建一个账户或为该线索创建一个账户。如果你选择跳过账户，则会创建一个没有生命周期场景的联系人。“机会”（Opportunity）是账户内的某种可用项；例如，你可能在账户中有一个寻找某种产品的机会。你可以通过左侧菜单栏上的“机会”链接查看机会。Zummo
    并不强制将账户或联系人与机会关联，但这样做是有意义的。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_39_1.png)


    ## Zumro 的性能可能足以与一些老成熟的营销工具一分高下


    它支持营销活动；只需进入“营销”（Marketing）链接即可看到开始的步骤。凭借对电子邮件、社交媒体和跟踪的全支持，Zumro 的性能可能足以与老成熟的营销工具一分高下。在此处通过他们的演示探索更多：http://zumro.com/demos/stable/app-projects/demo/link


    任务仅在“进行中”（Working On）和“已完成”（Completed）状态下运行。注意，分配到“某天”（Someday）类别的任务会被移到其他类别。要将它们移回，只需拖放即可，项目主页将为你显示所有活动状态的项目列表。还有更多选项可以让你的生活更轻松，请务必查看他们的演示页面以获取更多信息。


    ## 05 项目


    CRM 的一部分是你向客户提供的内容。你可以进入左侧菜单栏上的“产品”（Products）链接，查看产品目录项和类别。每个类别都可以拥有产品以及你正在提供的产品/服务——产品就是你销售的东西。你可以创建一个新产品。它可以根据实际情况链接到账户、联系人和机会。另一个重要方面是营销，毕竟你需要告诉人们你的产品产品，然后他们才会来购买！Zumro


    你可能会想，这本应该是一个 CRM，但项目管理是如何融入其中的呢？答案是肯定的。你可以在你的 CRM 中管理项目，但如果你不想，也可以使用你的 CRM 工具。Zumro
    中的项目也将帮助你建立起更好的项目流程。首先，在左侧菜单栏中创建一个“项目”（Projects）链接。一如既往，你可以将项目链接到账户或机会。项目创建后，你就可以向项目添加任务。所有任务都属于四个类别之一：“某天”（Someday，等同于待办列表）、在迭代中处理的“待办”（To
    Do）任务、“进行中”（Working On）任务……


    ![](img/a17757b82ff78d9c8d36ac46319604f3_39_2.png)


    ## 07 报告


    你可能需要进行跟踪，Zumro 让你非常轻松地做到。只需进入“报告”（Reports）链接，你就应该看到创建报告的选项。这里需要注意的是，与其内置报告不如你可以从零开始报告——按照你想要的方式。首先，你需要选择报告类型并为报告配置参数，然后就可以了。这些报告保存后，下次需要检查时，点击你想查看的报告即可。配置并管理设置。最后，还有等级，它随着用户勋章和收藏的提高而增加。


    # 使用 Zummo 管理客户：游戏化 CRM


    将你的 CRM 游戏化，防止无聊的客户干扰业务


    ## 教程


    ![](img/a17757b82ff78d9c8d36ac46319604f3_40_0.png)


    ## 08 游戏化


    如果你遵循了之前的步骤，Zumro 的游戏化将对你有帮助，因为你现在已经看到画廊与界面是如何设置的。Zumro 的运作非常简单——当用户与系统交互时，他们会获得勋章，这比没有奖励更好——这样他们就能继续下去。有勋章、收藏和硬币，当你完成某些操作时为你的工作增加价值。还有相关的纪念品，可以在应用程序的任何角落给出。另一方面，随着你改进收藏也可以获得硬币。Zumro
    允许你用硬币兑换虚拟或真实的奖励，这些可以……


    ## 09 智能功能


    作为你建立的业务，你可以使用 Zumro CRM 来捕获线索。网站联系表单只需将电子邮件发送到预定义的地址。投入精力获取线索有意义吗？你的 Zumro CRM
    允许你创建线索，这些线索可以嵌入你的网站中，当有人填写表单时，你就拥有了。只需点击 Zumro 页面右侧的“设置”图标并点击“网页表单”（Web Forms）链接。创建表单并将代码粘贴到你的网站联系页面。此功能是“工作流”（Workflow），它可以根据设定的触发器自动创建任务、会议或项目。结合让你为不同模块创建内容的“设计”（Design）向导，你将在如何处理你的业务上获得巨大的自由！


    ## 10 移动端


