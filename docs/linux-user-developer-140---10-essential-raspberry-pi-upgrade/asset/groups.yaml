    ### Turpial


    Turpial 是一个适用于 Linux 的纯 Twitter 客户端。它的设计理念是极简主义和轻量化，汲取了 FeatherDeck 和 Hootsoot
    等其他客户端的优秀功能，如定时和列。它已经已经寂了几年，它应该位居首位吗？


