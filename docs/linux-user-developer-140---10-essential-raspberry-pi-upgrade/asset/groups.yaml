    ![](img/a17757b82ff78d9c8d36ac46319604f3_77_0.png)


    # PERIPHERAL

    Wolfson Audio Card for Raspberry Pi

    £27.04/$33.62


    Can a compact product piggybacked onto the Raspberry Pi microcomputer''s GPIO
    header turn into an audio powerhouse?


    The Raspberry Pi packs a lot of hardware into a sub-£30, credit card-sized packaging.
    From its ability to drive Full HD displays to its so-networking with no drivers
    - even the most ardent would admit that this marvel leaves more than a little
    to be desired.


    That''s the thinking behind the board, a good-quality Wolfson Audio Card, from
    the eponymous sound specialist. Taking the form of a piggybacked board that sits
    on the Pi''s general-purpose input-output (GPIO) header, it upgrades the Pi''s
    audio capabilities without a USB port.


    Although digital audio via HDMI is acceptable, it is extremely low quality. Even
    with a 3.5mm jack and quality external amplifier, the audio is crackly and unpopulated.
    A good-quality codec chip could have improved matters immensely. Taking digital
    audio data directly from the BCM2835 system-on-chip processor, the codec could
    have any number of digital or analogue outputs at extremely high level of quality.


    First, the outputs: The Wolfson board offers a headset connector with stereo analogue
    audio input, analogue output, with unpopulated jacks for external speakers and
    an S/PD digital connection. The connection is something like the Pi''s audio header
    but high-quality analogue audio input, a matching/PD digital input, and most importantly,
    a pair of MEMS microphones directly on the board itself.


    All this is connected via the GPIO header, but there''s a slight catch: the Wolfson
    Audio board uses the


    Pro

    Wolfson Audio board benefits from a massive upgrade to the Pi''s audio capabilities
    in an experiment.


    Cons

    Setup is very easy with no drivers required in Raspberry OS stuck around an external
    kernel or completing your you


    # Wolfson Audio Card for Raspberry Pi


    Can a compact circuit board turn the Pi into an audio powerhouse?


    # REVIEW


    ![](img/a17757b82ff78d9c8d36ac46319604f3_78_0.png)


    # Technical specs


    - Compatibility: Raspberry Pi Model-A, Model B Revision 2 Only

    - Processor: Wolfson WM8966 Codec

    - Dimensions: 72.2x69.1x25.3mm

    - Weight: 21g

    - Power: DC 5v

    - Outputs: 3.5mm amplified headset jack, 3.5mm line-level jack, digital to I2S
    jack, amplified speaker terminals (not populated), expansion header

    - Inputs: 3.5mm amplified headset jack, 3.5mm line-level jack, digital to I2S
    jack, dual MEM microphones


    Pogo-pins used for temporary test connections, mean no soldering is needed on
    the P header.


    - A plastic stand-off secures the Wolfson Audio Card to the Pi via one of the
    holes


    # Also consider


    The Wolfson Audio board uses the main P1 GPIO header as the smaller P5 header.


    - Additional features of the WM102 codec are available on the expansion header


    ![](img/a17757b82ff78d9c8d36ac46319604f3_78_1.png)


    P5 header, which carries an audio signal, from the board made in Model Revision
    2 BCM2835. This board is shared by Model A and B, with 256KB of memory, the link
    and other headers to connect with the board.


    Installing your partition is straightforward, so avoiding soldering is easy. The
    Wolfson board uses pogo-pins – normally used for accessory testing – that is done
    under the pads and is secured in place via a stand-off. Software installation
    is a bit more awkward. The board requires patches to the Linux kernel which are
    not part of standard distribution. Running with two partitions, one for each OS,
    or using a pre-partitioned version that is ideal, but would be nice to see the
    scheme included in the manual. Once installed, configuration is simple: input
    and output, which are toggled using the bundled scripts. However, once you''ve
    set up your configuration the audio can be deleted.


    The audio quality of the board is impressive. The WM102 codec provides high-fidelity
    multichannel with high dynamic range. Despite being limited by the bandwidth,
    the high-sample rate outputs are clear and crisp. Thus, well worked, and the multi-interface
    is useful for any projects that use the Raspberry Pi or its Nano.


    # Summary

    There''s no denying that the Wolfson Audio Card is an impressive upgrade to the
    audio capabilities of the Raspberry Pi. The output quality, even with high-definition
    source, is great, and the board offers great flexibility. Unfortunately, the software
    fails to match the performance of the hardware and requires a bit more work.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_78_2.png)


    Cambridge Audio USB-powered digital to analog converter (DAC) with microphone.
    It has a built-in amplifier and outputs audio from the Pi. It would be what I
    needed for high-quality audio the sound quality is good, but it''s a great choice
    if you''re on a budget.


    # DAC Sound Card

    Designed to support the application as a functional sound card, it provides digital
    output and single channel. It''s not worth it if you want to play back music with
    high-quality audio, but it''s a cheap choice for audio if you''re on a budget.


