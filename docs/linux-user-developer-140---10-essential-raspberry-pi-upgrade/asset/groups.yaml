    ## 你可以用百万做什么？


    Windows XP、英国国家医疗服务（NHS）和 550 万英镑。Simon 并不是唯一一个……


    原始开发者可能更倾向于将代码保持内部专有，并作为自由源码发布。


    相比之下，LLVM 已经甚至鼓励了专有语言和架构的开发——例如基于 Clang 和 LLVM 的 Nvidia NVCC。CC 的源码对自由软件和开源开发者来说是不可访问的。


    最近的 Windows 版本以及因此一直在尝试获得该操作系统的支持。


    它不得不这样。不再有安全补丁，不再有更新，由于许多公司停止支持 XP 的决定，NHS 留下了大量变得脆弱的计算机。


    Richard Stallman 关注了这一点 http://www.gnu.org/


    在自由软件运动中，我们为用户的自由而战。我们的价值观与开源完全不同，这使得“更好”成为最终目标。如果 GCC 从自由平台变为非自由平台，我们无法再主张自由的自由。


    问题就在这里。我们大多数人想到的很多事情都是：英国医疗服务应该花一些钱。大多数人的理想软件将完美地产生。但它面临的非常现实的问题是许多不受支持的系统。但这不是它可以尝试的最佳解决方案。政府在某种程度上对这个问题负责。


    > Simon Bray 是一个跨 Linux 和 Mac OS 平台的作家兼编辑。


    GCC 和 LLVM 得出了不同的结论，因为它们并不共享我们的价值观和目标。他们反对我们定义自由的方式，并看到了其中的不一致性，且不妥协。我会将他们的工作描述为开源，而不是谈论自由。


    用 550 万英镑可以做很多事情。你可以雇佣数百人工作一年，或者启动一些……


    至少，这里有一个机会投入数百万英镑，只为了一个产品提供 15 个月的支持。这种做法长期来看并不真正可行。


    然而，从长期来看，GCC 与自由源码是不可分割的。Unix 从八代和九代的 Unix 中中学了东西。Linux 和操作系统是工具，并且通常是共享的。GCC
    是免费的，在 NHS 机器严重依赖 Windows 操作系统的这段时间内，GCC 对英国医疗服务有巨大的益处。除了支持之外没有其他许可，同时也提供了。


    正如所指出的，微软不希望人们在没有收益的情况下使用 Windows 以外的任何操作系统；它认为它少于软件且不属于任何人。


    因此，估计显示，如果 NHS 使用 XP，可以节省数百万英镑。

