    # Take pictures with your Pi


    Add an eye to your Pi and open up to photos, videos, and optical sensing


    # What you''ll need


    Latest version of Raspian

    www.raspberrypi.org


    Raspberry Pi Camera module

    £20.60 from www.pc-cornnell.com


    # What is it?


    This year, the Raspberry Pi camera is a small printed circuit board (PCB) which
    has a digital camera sensor of 1.3 megapixels, to take photos, and display a live
    preview of what the camera can see.


    # Why do it?


    Because of the size and portability of the Pi, it''s as convenient as a camera,
    but with more control via specialised libraries and software. Taking pictures
    and videos with a webcam, which connects to a USB port, this camera boards into
    a slot that doesn''t take up any of your ports, a connector specially designed
    with the future in mind.


    # How to use it


    Turn on your Raspberry Pi and make sure to disconnect the power. In the HDMI port
    or the other port there''s a connector. Pull the tab on both sides to insert the
    camera into the opening on the HDMI. Gently push the tabs to secure it connect
    the Raspberry Pi back up to power. To start using it, you will need to activate
    the camera module within the config settings.


    # Enable the camera module


    01 Update your Pi

    You will need to make sure it is up to date. Open the LXTerminal and update the
    firmware with the following:


    +   - sudo apt-update

    - sudo apt-get apt-get-upgrade


    02 Enter configuration

    Once the updates are complete you can update the configuration files. This is
    the same


    one saw after installing Raspian. Staying in the terminal, until you


    ```

    $ raspi-config

    ```


    03 Enable the camera module

    Go to the Camera option and change the setting to Enable. Then, go to the main
    interface and it will reboot the Pi with the camera working after login. The camera
    is now accessible via the command line


    and operation is simple. To take a picture, use:


    ```

    $ raspistill

    ```


    This video will display a first second preview before saving an image. Use videos
    with:


    ```

    $ raspvidideo

    ```


    The records are saved in your home folder. There are options you can add command
    to let you control exposure, preview length, framerate and resolution. There''s
    also the camera Python module that you can control it Python.


    # Add a power switch


    # Turn on the Pi off with no switch


    # What you''ll need


    USB Cable with Switch £4


    www.pinpi..com


    # What is it?


    It''s a binary switch switching between a male and female USB A: the connector
    present on every USB cable. In our case, a port connects to source of the power
    for the Pi, allowing it to interrupt the flow of electricity and effectively turn
    it off and on.


    # Why do it?


    As many users of the Raspberry Pi already know, once the Pi is turned off you
    will need need


    # How to use it


    to disconnect and reconnect the power in order for it to start booting up your
    Pi. This switch allows you to do this task and it in a more traditional manner.


    The main component in this setup is the USB Cable with Switch from Pinoroni, you
    will also need a micro USB cable to connect to the female end and a maine adapter
    that allows you to directly plug a USB port into it.


