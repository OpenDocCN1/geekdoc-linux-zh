    ### Birdie


    Linux 领域最近的一个客户端，在过去一年中变得非常流行。Birdie 将在今年某个时候推出 2.0 版本，不过我们目前正在寻找它。它目前不在仓库中，但网站上提供了二进制文件和源码。


