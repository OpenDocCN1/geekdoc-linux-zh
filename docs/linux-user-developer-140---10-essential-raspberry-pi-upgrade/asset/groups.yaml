    # # Tails 1.0

    We finally have a ''stable'' release –but how secure is it?


    # REVIEW


    ![](img/a17757b82ff78d9c8d36ac46319604f3_82_0.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_82_1.png)


    Before any network connections are made we can change some of ''Tails'' settings,
    including MAC address spoofing and settings


    # All of the privacy options are upfront in places you need to be


    it can be difficult to recover your presence on this type of storage. Having it
    installed to the USB drive means that the data is not recoverable, while having
    it loaded from RAM makes it much simpler to wipe your traces.


    Tails can be started from an SD card or USB stick to make it easier to carry and
    more practical than a normal desktop. Tails leaves nothing behind except the storage
    you used.


    # Private tools


    From the moment you use Tails, it''s concerned about your security. By properly
    connecting to the network or loading the desktop you can include making a MAC
    address spoofing to secure your connection and set up a VPN if needed, as you
    can choose or not to set it as an anonymous proxy that is defeated by turning


    After those options are set, you''ve gone into a GNOME 2.0 desktop environment.
    Debian still has GNOME 2.0 in the repository, so it works just as well. Tails
    tells you what it''s doing, such as synchronising the clock so it can connect
    directly to the network.


    We would like to give full disclosure regarding our review process, especially
    when using virtual machines or taking screenshots of live distros. Tails recognised
    that we were using a VM for the purpose of and informed of us all with the dangers
    of doing so.


    All of the privacy options are much upfront in the places you''d need to be. On
    the task bar there is the help icon, which allows you to quickly recount your
    network with the New Identity option. There''s also a browser map where you''re
    curious where your traffic is going.


    Finally, there''s an ever-present OpenPGP app in the toolbar that encrypts sensitive
    data and avoids JavaScript, which is just what we need.


    # Your daily apps


    Tails comes with tools to help stay private on the Internet. Tails includes a
    selection of apps that help you work on whatever you want. All the Open Source
    software is included, and also with various video editing tools like Audacity
    and media players like VLC.


    One of the most unexpected aspects of Tails is how easy it is to use. Mainstream
    Linux avoids the way that Tails has already made it seem like a chore to do due
    to all the configuration required. Tails sets up everything automatically and
    effectively while leaving you to get on with whatever task requires that level
    of. secrecy.


    For the technical savvy people that might need to use Tails for data collection,
    it''s perfect for the job.


    # Summary


    As Tails claims, it is very easy to use. Handling the security and privacy of
    things such as setting up tor, recurring connections and RAM on shutdown automatically,
    while making you know what it''s doing, Tails is everything set out to be.


