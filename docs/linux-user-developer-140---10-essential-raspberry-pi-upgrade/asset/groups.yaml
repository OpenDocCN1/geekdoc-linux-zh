- md: "\n# THE ESSENTIAL GUIDE FOR CODERS & MAKERS\nPRACTICAL\nRaspberry Pi\n\n68\
    \ “The Compute Module isn’t a new Raspberry Pi model or the oft-rumoured Model\
    \ C”\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_56_0.png)\n\n# Contents\n\n-\
    \ 58 The BrickPi Bookreader\n- 60 Learn the basics of Minecraft Pi\n- 62 Mine\
    \ Bitcoins with your Pi\n- 64 Pledge spare CPU cycles\n- 66 What's the Compute\
    \ module?\n\n# MINICOMPUTERS\n\n# CHAPTER 10\n\nMINICOMPUTERS, MINICOMPUTERS.\
    \ The history of the computer has been a history of shrinking sizes. In the early\
    \ days, computers filled entire rooms. Then, they shrank to the size of refrigerators.\
    \ Today, we have computers that fit in the palm of our hand. But where did it\
    \ all begin? \n\nThe first micro-sized computer, the Altair 8800 in 1971, was\
    \ about the size of a toaster. It didn't have a keyboard or a screen. You had\
    \ to flip switches to enter data and look at lights to see the result. But it\
    \ was the spark that started the computer revolution. \n\nIn 1977, the Apple II\
    \ was released. It was the first computer that was truly easy to use. It had a\
    \ keyboard and a screen, and it could display color. This was the moment computers\
    \ became more than just tools for scientists; they became tools for everyone.\
    \ \n\nSince then, computers have continued to shrink and become more powerful.\
    \ In 2012, the Raspberry Pi changed everything. It was small, powerful, and affordable.\
    \ It was the beginning of the age of microcomputers.\n\nLooking somewhat like\
    \ a section in a Rube Goldberg machine, the Bookreader is a fully functional robot.\n\
    \nLeft: The wheel turns the pages individually, although it does so with precise\
    \ timing and not sensing for the moment\n\nBelow: The next project for Dexter\
    \ Industries is an easy-to-assemble Raspberry Pi robot that makes use of the camera\n\
    \n# Components list\n\n- Raspberry Pi\n- BrickPi\n- Raspberry Pi camera\n- BrickPi\
    \ power pack\n- SD card with Raspberry Pi OS Wheezy installed\n- BrickPi\n- 2x\
    \ Lego EV3 motors\n- Lego wheel and beams\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_57_0.png)\n\
    \n![](img/a17757b82ff78d9c8d36ac46319604f3_57_1.png)\n\n# My Pi Project\n\n# BrickPi\
    \ Reader 2\n\n# A robotic mechanical reader of books that uses the Raspberry Pi\
    \ and Lego Mindstorms\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_58_0.png)\n\n\
    Where did the idea of the Bookreader 2 come from?\n\nWhen the Raspberry Pi camera\
    \ module released, I thought it would be great if we could use the camera with\
    \ some of the robots and that we'd have a lot of comments.\n\nWe put something\
    \ together that was just an arm to turn the Kindle and the camera, which would\
    \ be really interesting but got the wrong type of attention. \"We're already stuffed\
    \ enough,\" said. The point that we were trying to show a tour with Raspberry\
    \ Pi, so we put together a mechanical version that would turn pages.\n\nwidely\
    \ distributed and most accessible system. It's sort of delightful to learn about\
    \ some SOC systems. The Raspberry Pi foundation and the Raspberry Pi in general\
    \ have cultivated a high educational foundation. But we wanted to do more for\
    \ education - and that's what we've done and that's sort of how.\n\nIt's like\
    \ to think of ourselves as an education company and it's the best choice. It's\
    \ not a gift but the fact that there are many people using it and contributing,\
    \ but it's the fact that so many people using it and making up other hardware\
    \ with the Raspberry Pi is quite easy because the community had already ready\
    \ for us to do it.\n\nDid you have problems with the turning functionality via\
    \ the wheel?\n\nNo. We saw there were a couple of things when we did it with the\
    \ Legos and they'd done it a little bit differently. We wanted to use the EV3\
    \ system camera because the BrickPi is fully turned right now. With the EVO, so\
    \ we had to make some modifications to get some sort of perfect thing, and if\
    \ I were to redo this again we would have the control motors and the way the wheels\
    \ fully turns. Then there are not here.\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_58_1.png)\n\
    \nJohn Cole is a camera engineer who designed the Bookreader 2 and wanted to try\
    \ his hand at something else he started electronics and robotics projects.\n\n\
    Like it? The one of the core of the project was to learn some basic robotics with\
    \ Lego Mindstorms.\n\nWhat plans do you have for future Raspberry Pi projects\
    \ and BrickPi?\n\nWe are developing the BrickPi. one of the limitations was just\
    \ to get with the BrickPi we needed a Lego Mindstorms motor to turn the pages\
    \ without any soldering. The camera that we made last year the Raspberry Pi was\
    \ sort of the inspiration for it. We wanted a solution where you could just plug\
    \ in the camera and start turning pages.\n\nFuture projects about the Bookreader\
    \ 2 and dexterlinux.com.\n\nIts best add-on for the Raspberry Pi is exactly what\
    \ it is.\n\nThe BrickPi is a platform for connecting the Raspberry Pi and Lego\
    \ Mindstorms. It connects the Kindle with last year's generation of the EVO to\
    \ the Raspberry Pi so you have a very powerful and cool device that can be configured\
    \ in different ways and you can hold your heart.\n\nHow long did it take to develop\
    \ the Bookreader 2 after the first?\n\nIt was a couple of months. We put the BrickPi\
    \ out but then some people came with ways to make care of stuff and so we found\
    \ a couple of hours to do the programming and the hardware; it looks really cool\
    \ but it was really simple. The voice recognition is easy and there are sorts\
    \ of tutorials on how to do it and that read sort of stuff, so all we made the\
    \ Lego model and we were in business.\n\nWhy create BrickPi for the Raspberry\
    \ Pi?\n\nThe Raspberry Pi is great. I guess there are other Linux systems out\
    \ there, including Its Beones, so Raspberry Pi has two huge things going for it\
    \ and the first one is it's...\n\nlinux.couk.com\n\n# Tutorial Program\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_59_0.png)\n\
    \n# Tutorial Program\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_59_0.png)\n\n\
    # Tutorial Program\n\nMinecraft is a revolutionary game in which the protagonist,\
    \ known only as Steve, is tasked with surviving in an infinite blocky world. The\
    \ deeper you dig into, the rarer the materials become.\n\n# Tutorial Program Install\
    \ Minecraft\n\nYou might think there is no documentation to help you decide how\
    \ to work with Minecraft, but anyway, one thing good software knows is that the\
    \ code for a program should be documented. For example, all the block types and\
    \ variables you can use in the game are found in '/home/mcpi/mcpi/python/minecraft.py'\
    \ - they are well commented so you can find all of the functions you need and\
    \ set them as 'entity'.\n\n# Tutorial Program with Raspberry Pi\n\nRaspberry Pi\
