    # Volunteer CPU power with BOINC Pi


    Lend your Raspberry Pi''s processing power to a good cause using BOINC, helping
    to cure disease along the way


    ![](img/a17757b82ff78d9c8d36ac46319604f3_65_0.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_65_1.png)


    Rob Zwloot''s models model complex systems and is a web developer proficient in
    Python, Django and PHP. He loves to experiment with computing


    ![](img/a17757b82ff78d9c8d36ac46319604f3_65_2.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_65_3.png)


    ## What you''ll need


    There are always a few reasons for starting your own BOINC farm with this issue:
    you can always donate to a more worthy cause using BOINC, a computing volunteering
    service. These causes include protein folding for medical sciences, crunching
    Large Hadron Collider data and the search for extraterrestrial intelligence—all
    of which can benefit from the Raspberry Pi.


    ## Select ''100% while idle'' to make the most of the Raspberry Pi


    02 We can now install BOINC from Raspberry''s repositories along with some other
    packages to run it. Once you''re ready, come out to the terminal and install all
    of them with:


    ```

    $ sudo apt-get install boinc-manager boinc-client

    ```


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_0.png)


    03 First launch. If Raspberry is not already on the desktop environment, start
    to launch LXDE. Go to the Programs menu System Tools to find BOINC Manager. Click
    on that to open it and begin the process of creating an account.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_1.png)


    05 Identify yourself. After clicking Next you''ll need to create a BOINC account.
    You will need a new account for each project; this allows you to have multiple
    systems donating to the same project under your name. Create the account or login
    finish once - some projects will ask you to make a name on a separate web page.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_2.png)


    | Choose a project Click the name or type to select |

    | Categories | Project details |

    | --- | --- |

    | Projects | BOINC is a platform for running various scientific projects |

    | Worldhome | Worldhome supports research in physics, medicine, astronomy, and
    more. |

    | Grid5100 | Einstein supports research in astronomy. |

    | Einstein | Einstein supports research in physics, astronomy, and more. |

    | community community | URL: http://www.boinc.net/projects/ |


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_3.png)


    04 Add a project. Here you can add a new project to BOINC; if you haven''t made
    a decision on what project you want to use look over all of the possibilities.
    Now make sure Add Project is selected and choose the categories you are in to
    narrow down your search; choose a project and click next.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_4.png)


    06 Configure BOINC. Click on the Back advanced tab to see more settings for BOINC.
    Go to Tools Preferences and select the ''Disk and memory usage'' tab; from here
    you want to change Memory Usage to 100% ''idle'' to make the most of the Raspberry
    Pi.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_66_5.png)


    08 If you plan to launch command from the Raspberry Pi crunching data out of the
    way of your system, you might need to SSH into it it has its own command line
    tool that can be accessed:


    ```

    $ boincrun

    ```


    09 Crunch the numbers. when the Raspberry Pi is turned on, it will find a little
    space to stay active and powered on. You can add more projects in the future using
    the command line or by logging into monitor.


    07 Add more projects. Simple view to return to the original window. In the bottom
    section there''s an Add Project button that allows you to only add BOINC-approved
    projects, but also projects with a BOINC link that are not necessarily included
    in the directory.


    ## FAQ What is the Raspberry Pi compute module?


    Rob Zwloot models complex systems and is a web developer proficient in Python,
    Django and PHP. He loves transparency with computing. (Note: original text seems
    to have a duplicate/fragmented author bio here).


    If you like this... The Raspberry Pi Model A is usually forgotten but Model B
    being the flagship version of the Pi, It''s still great for most projects that
    require a large number of Pis, or not all the ports of the Model B.


    Further reading: Check out the original announcement on the Raspberry Pi blog
    for information on where you can get the computer module bit bit.ly/3uezo


    ![](img/a17757b82ff78d9c8d36ac46319604f3_67_0.png)


    ## What is the Raspberry Pi Compute Module?


    ## You can get the Raspberry Pi website as a stick – but what exactly is the Compute
    Module?


    I like the Raspberry Pi website''s redesign! It''s very nice. I went to have a
    look at it and discovered a new Raspberry Pi. Is it a new Raspberry Pi model like
    a stick?


    That would be the Raspberry Pi Compute Module. And no, the Compute Module version
    of the Raspberry Pi is not a new Raspberry Pi model or the off-raspberry Raspberry
    Pi C.


    Is it a Raspberry Pi 2 then?

    No, it''s a radically different form factor of the Raspberry Pi that adds chips
    and such as the original version.


    Wait, there''s a ''rumoured'' Compute Raspberry Pi? What would it be?

    We currently have two models of Raspberry Pi. The computer Model [text cut/fragmented].


    If you like this... The Raspberry Pi Model A is usually forgotten but Model B
    being the flagship version of the Pi, It''s still great for most projects that
    require a large number of Pis, or not all the ports of the Model B.


    (Note: The source text contains significant repetition and fragmented sections
    in the latter half. I have processed the coherent sections based on the instructions
    provided.)

