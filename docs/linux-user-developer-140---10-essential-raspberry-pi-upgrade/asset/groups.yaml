    # 开源


    您的 Linux 新闻与观点来源


    www.linuxuxer.co.uk 直接向我们发送电子邮件... 获取最新新闻和观点，请发送至 linuxuxer@imagine-publishing.co.uk


    # 开发


    ## Canonical 弃用


    Android 版 Ubuntu (Ubuntu for Android)


    ### Ubuntu Touch 重心正在转移


    Canonical 已经确认其 Ubuntu for Android 已不再处于活跃开发状态，因为公司正寻求通过一系列硬件发布来推动 Ubuntu Touch
    手机操作系统。


    Ubuntu for Android 早于 2012 年 2 月宣布，作为一种适用于智能手机和平板电脑的可安装应用程序。当您不在家里或办公室时，该设备可以连接到显示器、键盘和鼠标，并作为运行
    Ubuntu 的全功能桌面设备使用。


    自发布以来，Canonical 一直使用 Ubuntu Touch 的核心组件，这是一种计划用于由社区资助的 Ubuntu Touch Edge 手机设计的移动操作系统，但由于


    ![](img/a17757b82ff78d9c8d36ac46319604f3_9_0.png)


    - Canonical 已停止了 Ubuntu Touch 的 Android 版本开发


    未能达到其 3000 万美元的目标。由于几个硬件合作伙伴的支持，Ubuntu Touch 有望在今年晚些时候发布——而 Ubuntu for Android
    则并非如此。尽管公司对其积极推广并在其网站上仍有展示，但 Ubuntu for Android 可能不会发布。在一份已从公共视图中移除的内部错误报告中，Canonical
    的 Matthew Thomas 表示，“Ubuntu for Android 已不再进行开发，因此[其]页面应该从网站上下线，该页面将保留，除非公司能找到发布合作伙伴为”


    Canonical 随后确认，Ubuntu for Android 将一直保持挂起状态，除非有基于该软件的设备


    # 来源

    ## 红帽收购 Inktank


    ### Ceph 将整合至 RHEL


    红帽公司（Red Hat）宣布收购了大规模存储初创公司 Inktank，该公司成立于 2012 年，旨在开发 Ceph 存储技术。


    该公司的 Ceph 技术提供了与 Openstack 兼容的块存储解决方案，这些方案现在正与红帽的 GlusterFS 文件系统并列，用于大规模存储解决方案。


    “我们非常欢迎 Inktank 加入红帽家族。这次收购汇聚了一个充满活力的社区，我们将共同努力使其成为云对象存储的事实标准，”红帽首席技术官 Steven
    Stevens 说道。“在这笔交易中，Inktank 在围绕 Ceph 构建强大的生态系统方面表现得出色，我们期待在这一成功的基础上不断扩展。这些世界级存储技术的实力将为转向超越纯本地限制的云存储解决方案的客户提供极具吸引力的能力。”


    “与红帽联手是我们所有人非常兴奋的事，”Inktank 首席执行官 Kevin Wolfe 补充道，“我们对存储技术的愿景在云计算时代的数据管理中至关重要。加入红帽无疑有助于我们更好地服务行业，并完全满足对现有云平台深度集成存储解决方案的需求。”


    Inktank 的现有客户包括思科（Cisco）、欧洲核研究组织（CERN）和德国电信（Deutsche Telekom），该公司与戴尔（Dell）和阿尔卡塞尔（Alcatel）拥有合作伙伴关系。Inktank
    在洛杉矶和旧金山的现有办公室预计将保持开放。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_9_1.png)


    - Inktank 的 Ceph 存储技术现在完全由 Linux Red Hat 拥有


    10 linuxuxer.co.uk


    # 新闻

    Linux 社区最新动态

    开源


    硬件


    ## 树莓派面临竞争


    ### 高性能替代主板上市


    受欢迎的树莓派（Raspberry Pi）单板机正准备通过两块新板子迎接高端竞争，这两块板子模仿了其外形，并包含 26 脚输入插针：树莓派的连接性，外带有红外、千兆以太网、三个按钮、麦克风以及
    SATA 和 5V 电源。


    HummingBoard 是一种商业化实现。HummingBoard 以与树莓派相同的布局设计，拥有 2GB RAM、四核处理器，以及蓝牙和 Wi-Fi。


    Banana Pi 是另一种选择。Banana Pi 采用了 AllWinner A30 系统芯片（SoC），拥有 1GB RAM、双核处理器。它在 2GB
    RAM 类似于 512MB RAM 版本的 ARM 树莓派 Model B。


    开发


    ## Debian 宣布放弃 ARM 支持


    ### 测试分支（testing branch）的重心转移


    Debian 官方宣布放弃对 ARM 架构的支持，重心已转向测试分支。


    “目前，我们决定放弃 ARM 支持，这是由于缺乏志愿者以及工具链中的某些问题，”Debian 的 Phil Kern 说道。“在测试分支中的 ARM 支持将不再移除，除非我们找到足够的志愿者来维护它。”


