    # Operating systems


    - **Tails 1.0** The most secure distro available in the open source scene and
    one made by other than Edward Snowden. **OpenMandriva 2014.0** takes us back to
    a classic distro on Mandrake from way back when. **Mythuntu** Take control of
    your home''s digital media with this popular spin of Ubuntu 14.0. **Lubuntu 14.04
    LXDE** environment puts a classic spin on the Ubuntu core — great if you''re not
    a fan of Unity or GNOME.


    - In a security-concerned distros world, Tails is a distro that will keep your
