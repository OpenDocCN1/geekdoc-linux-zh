    What does it offer over a normal Raspberry Pi?

    It''s mainly the small form-factor, with the bonus of being a little cheaper than
    a full Raspberry.


    The module

    The Compute Module can be used on its own custom hardware, slotting into a standard
    GPIO connector. You have access to all the Raspberry Pi''s functional units along
    with onboard memory to install a distro or custom OS.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_68_1.png)


    Now that we''ve noticed it doesn''t seem to have any of the normal inputs and
    outputs, how do we connect power it?


    The connectors on one side of the module are SODIMM, a standard that is used for
    laptop and mini-PC memory. You can create custom parts to connect these Raspberry
    modules and save on space if needed.


    The I/O board

    On the I/O board is not very useful, requiring the Compute Module to properly
    expose its features like the HDMI port, a standard USB port


    Laptop connectors? Does that mean I can plug it into anything?

    No, not many. It''s not and it won''t fit. You would likely break the module or
    the laptop if you tried to test it in. There wouldn''t be much of use of it in
    a laptop tough.


    connectors. Then a micro USB port can be used as a USB slave.


    So really is there no use for the Compute Module by a normal person at?


    ![](img/a17757b82ff78d9c8d36ac46319604f3_68_2.png)


