    # Welcome

    to issue 140 of Linux User & Developer This issue


    **Bob Zotsleet** studied aerospace engineering, using Python to model complex
    simulations. This month he tracked an elusive and anonymous dive-bomb (page 23).
    He''s since named his cat to Nemo and has been seen around away wearing sunglasses
    and sandals at last.


    **Richard Schnley** started using computers long before Windows tools that maintain
    the command line, and is his most productive working environment. Richard believes
    it is to free ourselves from the troubles of MS Small Business (page 37).


    **Alexander Taylor** is a graduate student in Physics who can create Python platform,
    Kivy. He makes apps and tutorials at it.net. His project development series can
    be found on pages 42-45.


    **Sean Tracy** is a creative technologist living in the south coast. He spends
    a lot of time on Linux, Mac, and Android. In this issue Sean discusses the change
    from the makers of Facebook that promises more and less stress than page 33.


    **Jon Masters** is a Linux kernel hacker who has been working on Linux for 18
    years, since he interrupted university at age 30. Jon lives in Cambridge, Manchester
    and works for an enterprise Linux vendor. You can find his brilliant Kernel Column
    on pages 16-17.


    **Gareth Halcree** is our resident reporter and brings us the latest developments
    from all over the open source starting page 8. Elsewhere, Gareth reviewed the
    Wireless Audio Card for Raspberry Pi and a new mini-PC (pages 78-81).


    ![](img/a17757b82ff78d9c8d36ac46319604f3_2_0.png)


