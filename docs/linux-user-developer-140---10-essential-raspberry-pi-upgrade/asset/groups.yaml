    \nSave and exit. This will redirect your server to /var/www/hack. You can then\
    \ route only the traffic to Hack you can modify with Proxy, but at your discretion.\
    \ We have everything in this place. Here is a file at /var/www/hack, if you cannot\
    \ create it or change the line, in which case you'll get an error on reload. We're\
    \ mostly good to go. The test file will write a little while into your log. Access\
