  mdcn: "\n\n# 新闻\n\n## 开源\n\n随着1.0版本的发布，我们正展望未来。基于 Debian 7 的 1.1 版本即将发布，新状态将是每周定期更新：“我们希望关注限制安全漏洞的影响、隔离关键应用程序并提供当日安全更新。这些更新对用户来说是不可见的，但它们会让\
    \ Tails 从内部变得更加可持续、更健壮。”\n\n通过他们的努力，Tails 正为需要的人带来安全的在线环境。团队正努力确保其持久存在——而这只能通过开源来实现。\n\
    \n## 匿名开发者\n\nTails 的成员不对公众公开他们的身份，他们的解释很有道理。\n“人们说 Tails 传统上一直使用化名来隐藏工作。这是出于不同的原因。我们中的一些匿名者仅仅认为，我们的工作、我们所做的以及我们的做法足以让人信任\
    \ Tails，无需这样做。\n此外，当今互联网的主宰者——如 Google、Facebook 等营销巨头以及间谍机构——确实希望我们的生活在在线上变得越来越透明。为了应对这种趋势，对于开发防御隐私和匿名性的操作系统的人来说，这似乎是一个逻辑合理的立场。”\n\
