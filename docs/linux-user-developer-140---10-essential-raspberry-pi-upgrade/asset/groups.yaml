    # Your view

    Mozilla, Bitcoins, Ubuntu One, Red Hat, Heartbleed

    LETTERS


    ![](img/a17757b82ff78d9c8d36ac46319604f3_94_0.png)


    # Web Designer


    Development for the web is a huge part of modern computing, majority of services
    available online and in the cloud. We pride ourselves on having some fantastic
    open source web design tutorials. Web Designer is dedicated to bringing many of
    these features at the same level of quality. Regularly covers the newest technologies
    such as HTML5, CSS3, jQuery, WordPress, and mobile apps. Web Designer is the best
    choice for those who want a decent web development magazine. You can find out
    more at www.webdesigner.com


    ![](img/a17757b82ff78d9c8d36ac46319604f3_94_1.png)


    Its cancellation on 1 April caused some confusion, however it was the next day.


    # Ubuntu None


    # Public Red Hat


    # Heartbeat


    That was interesting news that Canonical was shutting down Ubuntu One. I didn''t
    personally use it like it was going quite from the way they talked about it; adding
    music streaming and features. I hear they''ve cancelled development of Ubuntu
    on Android; can''t say I ever experienced problems with it. Anyone have information
    about Ubuntu TV? Has anyone announced any of these non-dist products ever come
    out?


    I''m excited to see Red Hat Linux 7 RC is getting active; it''s close to the final
    version of RHEL 7. I''m not sure if this was their intention, but it helps the
    decision makers at my company in body to get them to switch to an open source
    system. Give a take on Red Hat and offer the full version support they need. A
    cheaper way and I might add it to our. I hope they do this before too late.


    Heartbeat was quite the mean thing, you know? All from home error, as well as
    on what seems to be a faulty part of Open. It seems like no one''s decided to
    use the right software to fix it; in fact, this volatility could have been avoided
    by using better software. Development from the community team to fix it and increase
    awareness of the system''s good condition, and is something that would only get
    in open source properly. Hopefully the heartbeat will be resolved quickly soon-ish.


    Kyle


    Nitin Das


    It was a massive hope for many. Canonical really talked about the success of Ubuntu
    One. There was a dedicated userbase for the cloud, and so on the Ubuntu system;
    especially when compared to the state of other cloud Linux services, it was one
    of the better choices.


    It''s a full-version of the system, completely of what''s necessary to make to
    open; since speaking of CentOS, it''s the servers offering an alternative to off,
    more and more not stable enough for public beta and such. SUSE is using with a
    new version and may follow example if the numbers are good. Here''s hope.


    The reaction from the community was very good. Plus Heartbeat is generally updating
    the servers, there''s always one or two forgotten servers hidden away where they
    could cause problems. They don''t want you to lose any data and will fix it right
    after discovery. If you want to know more about Heartbeat and how to fix it, head
    to heartbeat.com for information.


    Canonical is still about what''s happening with their other projects. There''s
    supposed to be some Ubuntu phone by the end of next year, again there there are
    no specific details about what exactly they are. Ubuntu won''t be going any time
    soon but it would be a bit of a shame to see all these other Canonical products
    disappear.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_94_2.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_94_3.png)


    www.linuxuker.com


    # On the DVD


    Your disc


    # On the DVD


    Find out what lies in store for you issue

    140''s Linux User & Developer DVD...


    Welcome to the Linux User & Developer DVD,

    our latest disc filled to the brim with new distros as well as free and libre
    software for your testing.


    For issue 140 we''ve put together a disc of new distros and packages that you
    may not have of, along with the usual selection of tutorial-specific software.
    We''ve got the 1.0 version of the new Tails along with the new OpenMandriva. Joining
    them are a pair of excellent distros: Sheffield Ubuntu and home media server Myuntu.
    To start, insert the DVD into your optical drive, restart your PC, from disc to
    access the different distros.


    # Distros


    This issue we''ve included four distros for you to play, including Tails 1.0,
    Ubuntu 2014.04, 14.04 and Myubuntu 14.04.


    # Tutorial Files


    If you want to use with some of our other tutorials, selected project files are
    available here.


    # Software


    20 of the latest and greatest software packages covering a variety of different
    functions.


    # Tutorial Archives


    Our extensive archive of previous tutorials lists some of our best features.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_95_0.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_95_1.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_95_2.png)


    Welcome to the Linux User & Developer DVD (issue 140). This issue includes four
    distros for you to try out: Tails 1.0, Ubuntu 2014.04, 14.04 and Myubuntu 14.04.


    ![](img/a17757b82ff78d9c8d36ac46319604f3_95_3.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_95_4.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_95_5.png)


    A range of helpful software packages for your Linux machine. All you need to find
    the tutorials in the magazine.


    # How to burn an ISO


    Want to try a new distro? Here''s how to start...


    STEP 1: Grab a new ISO from our cover disc to your hard drive; go to the Disc
    tab, click ISO and Save. Afterward, find an ISO online. If you''re not sure if
    you need 32-bit or 64-bit version, the former is.


    STEP 2: Open or install Brasero. If it''s not already installed on yours, locate
    it in your repository on the left. Then open the project and select ''Burn''.


    STEP 3: Burn your disc image – click here to select the image you just put on
    hard. Once selected, ensure you''ve got a CD or DVD inserted and click ''Create''.


    # On the DVD

    Welcome to Linux User & Developer LIVE-BOOTING CODE


    # Editor''s picks


    - **Tails 1.0** The first release of the most secure distro, with automatic routing
    built into its internet use perfectly secure and private.

    - **OpenMandriva 2014.0** The newest version of Mandriva. Based on an older fork
    of Mandrake — it brings back some of Mandrake tools to make it a more classic-style.

    - **Lubuntu 14.04** One of our favourite spins of Ubuntu uses LXDE, replacing
    unity for a lightweight and useful distro. This is the latest version of the distro
    using 14.04 LTS.


