    ## 开源 (OpenSource)


    您的 Linux 新闻与观点


    ## JON MASTERS


    ## 内核专栏


    Jon Masters 总结了内核社区的最新动态，包括 Linux 3.15 合并窗口和正在进行的开发。


    由内核内 BPF（伯克利数据过滤器 - 借自 BSD 的概念）网络包过滤代码通过 JIT（即时）编译完成。我们将在下期中总结 3.15 的情况。


    设备并在稍后以一种略微激进的方式重新归一化，这可能需要从那些关闭的设备中保存额外的状态信息。但如果这些设备处于睡眠状态，则可能需要唤醒它们，仅在系统挂起时再次将其关闭。


    ### 更智能的系统挂起


    Rafael J Wisarski 发布了一系列补丁，旨在改进系统挂起-恢复的体验。Linux 支持多种挂起概念，其中就包括全系统挂起概念。全系统挂起是指关闭每个硬件设备（如磁盘、屏幕和网络）的能力，然后将整个系统置于可以恢复的低功耗状态。


