    ### Gwibber


    Ubuntu 默认的社交媒体客户端，涵盖了 Twitter、Facebook 以及其他几个社交网络。它独立于 Ubuntu 开发，并变得比官方网页更轻量、更具一致性——但它的流行意味着它是最佳选择吗？


