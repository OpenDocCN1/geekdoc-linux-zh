    # 欢迎

    阅读《Linux User & Developer》第 140 期。本期


    **Bob Zotsleet** 学习航空航天工程，使用 Python 进行复杂模拟建模。本月他追踪了一个行踪诡测且匿名的俯冲攻击（第 23 页）。此后他给他的猫命名为
    Nemo，最近看到他戴着墨镜和拖鞋出现在附近。


    **Richard Schnley** 在 Windows 维护命令行行的工具出现很久就开始使用电脑了，命令行一直是他最高效的工作环境。Richard 认为这让我们从
    MS Small Business 的困扰中解放出来（第 37 页）。


    **Alexander Taylor** 是一位物理学专业的研究生，能够创建 Python 平台 Kivy。他在 it.net 上制作应用和教程。他的项目开发系列可以在第
    42-45 页找到。


    **Sean Tracy** 是一位居住在南岸的创意技术人员。他花费大量时间在 Linux、Mac 和 Android 上。在本期中，Sean 讨论了 Facebook
    开发者带来的变化，这承诺了减轻压力（第 33 页）。


    **Jon Masters** 是一位 Linux 内核黑客，在 Linux 世界工作了 18 年，从他 30 岁辍学开始。Jon 住在剑桥和曼彻斯特，并在企业
    Linux 供应商工作。你可以在第 16-17 页看到他精彩的内核专栏。


    **Gareth Halcree** 是我们的驻地记者，为我们带来来自全球开源领域的最新动态，从第 8 页开始。此外，Gareth 测评了树莓派无线音频卡和新款微型电脑（第
    78-81 页）。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_2_0.png)


    - 使用 Give 用于 Google Drive

    - 升级你的树莓派

    - 使用 Hack 和 Octave 编程

    - 使用 Kivy 创建 RSS 阅读器


    欢迎阅读最新版本的《Linux User》，这是英国和美国最喜爱的 Linux 和开源杂志。


    树莓派是英国技术的极致体现，是小型计算领域的革命，真正捕捉了全球黑客和制造爱好者的想象。当然，在一个比信用卡还小一点的设备中包含了如此多的技术。虽然 GPIO（通用输入输出）允许树莓派与现实世界连接，但如果没有创意辅助，爱好者在项目和树莓派上能做的有很多限制。


    不断增加的插件、小配件和更新列表可以帮助你的项目活起来。在第 18 页，我们挑选了最喜欢的产品，并展示了如何将其整合到你的项目和小设备中。


    如果你发现自己在办公室花费的时间超过了价值，那就不值得。本月我们展示了如何规避 Google 拒绝为其云存储服务提供开放客户端（第 30-33 页），以及如何配合
    Zentral 使用 MS Small Business Server（第 34-37 页），并使用汇总的 CRM 服务 Zuma（第 38-41 页）帮助你留住客户。Russell
    Burns，


