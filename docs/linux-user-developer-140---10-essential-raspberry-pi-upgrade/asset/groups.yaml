    Welcome to the latest edition of Linux User, the UK and America''s favourite Linux
    and open source magazine.


    The Raspberry Pi is British at its best and a revolution in small form computing
    that has really captured the imaginations of hackers and makers all over the world.
    Of course, there''s so much technology packed into a device little smaller than
    a credit card. While the GPIO (General Purpose Input/Output) allows the Pi to
    connect with the real world, there are many limitations to what enthusiasts can
    do with their projects and Raspberry Pi without a helping of ingenuity.


    There''s a growing list of add-ons, gadgets and updates to help make your projects
    to life. On page 18 we''ve selected our favourites and show how to integrate them
    into your projects and gadgets.


    If you find yourself spending more time at the office than worth, is not. This
    month we show how to dodge Google''s refusal to allow an open client for their
    Cloud Storage service (pages 30-33), and how to use MS Small Business Server with
    the Zentral (pages 34-37) and help you keep your customers engaged with Zuma,
    the gathered CRM service (pages 38-41). Russell Burns,


