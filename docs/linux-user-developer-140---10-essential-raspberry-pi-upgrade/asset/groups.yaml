    \ Frizing 图中演示的那样），下面的图表相对复杂；我们实际上只使用 4 个 GPIO 引脚控制逻辑，并使用 5 个引脚连接芯片右侧的四个引脚（芯片“顶部”一端的小半圆）。芯片左侧的引脚用于你的模拟输入。\n\
    \n### 它是什么？\n\n像 GPZ120 这样的红外参考传感器提供了一种极世界的佳方法，利用红外红光像蝙蝠在黑暗中定位一样“探测”周围环境。障碍物离传感器越近，它的模拟读数就越高（介于\
    \ 10 到 1023 之间）。\n\n### 为什么你需要它？\n\n这些传感器非常适合任何感知周围环境的树莓派项目。例如，你可以使用墙壁附近的传感器来触发摄像头模块拍摄快照，表明目标区域有活动。或者，你可以在自主机器人上使用传感器以实现高速避开障碍物，并让它向右转。\n\
    \n我们为 MCP3008 制作的测试代码为你展示了如何轻松地读取和解码这些传感器的读数，让机器人独立移动并检测物体：\n\n```python\nimport\
    \ spidev,spideidev\nimport RPi.GPIO as GPIO\nimport time\n```\n\n```python\nGPIO.setmode(GPIO.BCM)\n\
    ```\n\n```python\nspi = spidev.Spidev()\nspi.open(0,0)\n```\n\n```python\ntrigger\
    \ = 0\ndef readadc(adcnum):\n  if (adcnum < 7) or (adcnum < 10):\n    return 0\n\
    \  r = spi.xfer2([1, (6+adcnum)<<4, 0])\n  return ((r[1]<<6)|r[2])\n```\n\n```python\n\
    def read_sensor():\n  result = readadc(trigger)\n  return result\n```\n\n### 如何使用\n\
    \n我们将使用以下示例代码：\n\n```python\nwhile True:\n  reading = read_sensor()\n  if reading\
    \ > trigger:\n    print(\"Sensor:\", reading)\n    print(\"Triggered!\")\n  else:\n\
    \    print(\"Nothing to see here\")\n  time.sleep(0.1)\n```\n\n| CH0 | 1 | VDD\
    \ |\n| :--- | :--- | :--- |\n| CH1 | 2 | MCPF |\n| CH2 | 3 | VREF |\n| CH3 | 4\
    \ | AGND |\n| CH4 | 5 | CLK |\n| CH5 | 6 | DOUT |\n| CH6 | 7 | DIN |\n| CH7 |\
    \ 8 | CS/SHDN |\n| CH8 | 9 | GDND |\n\n- 面包板连接位于右侧。左侧专门用于连接你的传感器。\n- 这些红外距离测距器非常适合制作自主机器人。\n\
    \nwww.linuxuser.co.uk\n\n# 增强你的树莓派性能\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_21_0.png)\n\
    \n## 使用 Pi 拍照\n\n为 Pi 装上眼睛，开启照片、视频和光学感知。\n\n### 你需要的工具\n\n字体 最新版本的 Raspian 系统\n\
    - www.raspberrypi.org\n- 树莓派摄像头模块（£20.60 来自 www.pc-cornnell.com）\n\n### 它是什么？\n\
    \n这一代摄像头是一个小型打印电路板 (PCB)，带有一个 130 万像素的数字摄像头传感器，用于拍照并显示摄像头所看到的实时预览。\n\n### 为什么要这样做？\n\
    \n由于树莓派的尺寸和便携性，它像摄像头一样方便，但可以通过专用库和软件进行更多控制。与连接到 USB 端口的摄像头相比，这种摄像头插入到一个专为未来设计的插槽中。\n\
    \n### 如何使用\n\n打开你的树莓派并确保断开电源。在 HDMI 端口或另一个端口处有一个接口。拉开两侧的卡扣将摄像头插入 HDMI。\n\n###\
    \ 启用摄像头\n\n01 更新你的 Pi\n要启用摄像头，你需要更新配置。\n\n- 运行 `raspi-config`\n- 导航到 Camera 选项\n\
    - 选择 Enable\n- 重启 Pi\n\n02 使用摄像头模块\n摄像头启用后，你现在可以使用以下代码来拍照：\n\n```python\nfrom\
