    with a temperature sensor it can predict short-term changes in the weather.


    ### Why do we need?

    Being able to predict the weather has obvious benefits of knowing or not to bring
    an umbrella or sunglasses to work. However, you can also use it in home automation
    to open windows or curtains when it''s hot or to starting rain.


