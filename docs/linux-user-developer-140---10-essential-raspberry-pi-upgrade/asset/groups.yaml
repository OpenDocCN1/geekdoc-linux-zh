    ## 技术规格


    | 操作系统 | Matrix TV (基于 Linux 的 Kodi 界面) |

    | :--- | :--- |

    | 处理器 | Fre-freescale i.MX6 Quad @1GHz |

    | 内存 | 2GB DDR4 |

    | 存储 | 16GB 板载 eMMC 闪存，SD 卡和 TF 卡槽 |

    | 尺寸 | 136 x 98 x 45mm（不含外壳为 129.4 x 86.3 x 27mm） |

    | 重量 | 250g（含外壳） |

    | 端口 | 3x USB 2.0, 1x USB, HDMI, 光音频, 模拟音频, 千兆以太网, mini-PCI Express, UART, SATA,
    红外 |

    | 额外 | GPIO 引脚, 802.11b/g/n Wi-Fi 卡 |


    - Matrix 使用随附的 5V 电源运行，在重负载使用下功耗异常地低

    - 得益于快速处理器，千兆以太网能够实现高速吞吐量


    ![](img/a17757b82ff78d9c8d36ac46319604f3_80_1.png)


    - 板载的 802.11b/g/n Wi-Fi 芯片连接到机箱侧的小天线


    ## TV 发版流畅且无故障


    Cubeboard 2

    £27.90


    使用 Matrix TV 发版正如你对拥有 2GB 内存和四核 1GHz 处理器的设备的预期那样，流畅且无故障。它同时支持 mini-PCI 和 USB 端口，方便的命令行可以轻松添加有线千兆以太网和板载
    Wi-Fi 等多种网络系统。


    Cubeboard 2 的性能比 Matrix 上的 Pi 更强，拥有双核/四核处理器和 1GB 内存。它是一个小巧的 100mm x 60mm 高重心外壳。Matrix
    的许多功能已板载，但更多信息请见 newmatrix.co.uk。


    然而，Freescale i.MX6 处理器的原始性能允许你尝试更大更好的选择。在面对 Raspberry Pi 3 BCM... 运行单线程任务，切换到多线程软件包可能会导致接近一天结束。


    11.10. 由于对 Ubuntu 11 的支持已于去年 5 月过期，想将 Matrix 作为通用机器的用户可以这样做。一个问题是，使用内部 NAND 闪存来切换正面
    USB 端口需要系统和特殊的升级。该实用是为 Windows 用户提供的——在 Linux 内核支持桌面版之后。在无法访问 Windows 的情况下，他们在切换操作系统时可能会遇到相当头疼的问题。


    > Gareth Hoffmann


    ## 总结


    Raspberry Pi

    £25.00

    Raspberry Pi 的性能不如 Matrix，但毫无疑问，它只有 1GB 内存和单核 ARMv6 处理器，而 Matrix 是四核 ARM。它的连接性软件支持要成熟得多。


    Matrix 拥有充足的处理能力，但你可能为此付出代价。如果你正在寻找一个用于数字电视接收的 Linux 机顶盒，那很遗憾；有限的缓存和过时的操作系统镜像意味着它缺乏作为通用或嵌入式
    Linux 机器的可能性能。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_80_2.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_80_3.png)


    当进行高强度计算时，连接到大尺寸散热器的风扇会启动；虽然声音并不算大，但确实存在。Matrix 也采用被动散热。你可以在软件中禁用它或直接拔掉——但这样做会有处理器过热的风险。


