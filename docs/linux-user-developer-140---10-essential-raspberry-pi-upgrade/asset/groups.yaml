    with extended GPIO ports it might lack the analog output and jack, although with
    the SD card slot that is little redundant.


    So could you get just inside instead of a Raspberry Pi?

    You could have been much more expensive


    than a normal Pi. You''d also miss out on the extra USB slot and ethernet port
    and it''s also a bit bigger than the normal Raspberry Pi.


    What exactly would you use the I/O board?

    Well, as mentioned before, the Compute Module is mainly for processing parts that
    would like to use the specific GPIO functional units. They can do that, by prototyping
    so developers figure exactly what they are connecting and how to. The I/O boards
    help with this by offering every useful input and output and the bare minimum
    to display the Raspberry Pi on a screen if it needs.


    And, it''s for more than just normal users, unless something is stopping them
    from getting it?


