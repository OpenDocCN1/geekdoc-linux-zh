    # 打造你自己的树莓派超级计算机


    **Joey Bernard**


    作为一名真正的全能奇，他将时间分配在制作家具、研究科学计算问题以及编写 Android 应用程序之间。


    ## 既然你已经构建了树莓派超级计算机，现在来学习编写 Python 代码的基础知识，以充分利用这些性能


    ## 为什么选择 Pi？


    它是树莓派的官方语言。请访问 www.raspberrypi.org 阅读文档。


    你可能曾考虑过一个使用树莓派集群的项目。其构建过程相对简单。你只需要几台电脑，通过以太网和一个或多个交换机连接起来。这在你的电脑上很容易实现。但你能用它做什么呢？这才是困难之处。你不能简单地运行普通程序并期望获得任何形式的加速。你实际上需要编写并行程序，来利用你所收集的所有力量。


    并行程序分为两类：共享内存和消息传递。在共享内存中，线程之间通过传递消息传递消息进行通信。最常用的库是 MPI，它由一个 C 语言库和一个 Python 模块指定。你可以通过
    `pip` 安装它。


    为了发送消息，你需要某种方法来对执行线程。这些线程由数字索引，`rank` 将包含数字以及该特定通信器中存在多少线程。你可以这样做：


    ```python

    comm = MPI.COMM_WORLD

    rank = comm.rank()

    size = comm.size()

    ```


    因此，变量将包含线程总数，而 `rank` 将包含该特定的排名。


    在 MPI 中，各种线程被分组为通信器。通信器内的所有线程都可以在指定的通信器中对话。当 MPI 启动时，会创建一个包含所有可用线程的默认通信器。这样，你就可以隔离分组


    现在你需要某种发送和接收消息的方法。发送和接收默认函数是阻塞的。当你发送消息时，该线程将阻塞直到消息被接收。接收也是如此：它将阻塞并等待传入的消息被完全接收。还有非阻塞发送和接收
    Python 对象的方法，你可以使用 `pickle` 实现。


    ## 通信器中的所有线程都可以相互通信，但不能与通信器外的线程通信


    程序，所有的并行线程在相同的物理硬件和全局内存上运行。通过这种方式，信息在共享内存的线程之间来回传递。这种内存类型的唯一严格限制是你被局限在一个物理机器上。


    然而，你也可以从这些线程的子集中创建新的通信器，以控制它们之间的相互访问。这在扩展规模时非常有用。


    第二类并行程序是消息传递。在这种类型的程序中，执行可以存在一台或多台机器上，只要它们能以某种方式相互通信。这通常通过标准的以太网网络完成。然后信息就会来回传递


    但这也很复杂。使用 MPI 的将仅仅是使用该库。你需要导入 `mpi4py` 模块的函数，类似于：


    如果你在其他语言中具有任何 MPI 经验，你会发现你不需要初始化该库。在 Python 中，这是在导入模块时自动完成的，因此这为你节省了时间


    所以，我们正在向排名为 1 的目标节点发送信息。第一个参数是“tag”（标签），你可以在代码中使用它来标记不同类型的消息。因此，你可以决定将消息标记为 1


    ![](img/a17757b82ff78d9c8d36ac46319604f3_70_0.png)


    # 完整代码列表


    并且控制措施被标记为 2。这样一来，`recv` 函数就能对不同类型的消息执行不同的操作。在接收端，你将调用：


    ```python

    data = recv(source, tags=)

    ```


    敏锐的你可能注意到任何可能的 bug。如果你在 `recv` 函数中设置源不是 1，或者 tag 是 10 呢？那么，它将阻塞并等待每条消息到达。这类函数很难捕捉，因为它们不会让你的程序崩溃，而只是会锁死。通过这些不同版本的函数，你可以开始编写更复杂的代码。


    如果你正在使用 NumPy，你可以处理这些数组而无需解析它们。现在你已经写好了代码，如何运行它呢？在其他语言中，你可以使用脚本导入并解析来自你树莓派网络的数据；然后你可以在所有四块板上运行你的代码：


