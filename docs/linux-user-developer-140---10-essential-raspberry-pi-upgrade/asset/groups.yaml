    \n# LINUX\nLinux 基金会宣布核心基础设施倡议\n\n### 汇聚知名企业，寄希望于提高代码质量\n\n在近期 OpenSSL 出现 Heartbleed\
    \ 漏洞后（该漏洞可能导致内存数据泄露，包括攻击者的密钥），Linux 基金会现已了核心基础设施倡议，旨在寻找并支持关键开源软件项目，以提高代码质量。\n\n\
    通过与创始成员 Amazon、Cisco、Disney、Facebook、Google、IBM、Intel 和 Microsoft 合作，核心基础设施倡议旨在识别需要支持和专业知识的开源项目，这可能提高它们的质量和可靠性。\n\
    \n遗憾的是，第一个受益于该计划的项目将是 OpenSSL，它预计将获得针对开发者的奖金资金，以及额外的资源来帮助修复具有像 Heartbleed 那样巨大漏洞的安全包——其结果是极性的。\n\
    \n“我们正在扩大对可能需要支持的 Linux 基金会项目的工作，”Linux 基金会执行主任 Jim Zemlin 表示，“全球经济建立在开源软件之上，Linux\
    \ 基金会已能够 100% 地专注于 Linux 开发，现在我们现在能够为其他关键开源项目支持额外的开发者和全职贡献者。我们感谢这些领导者致力于确保 OpenSSL\
    \ 等关键开源项目的持续增长和可靠性。”\n\n核心基础设施倡议得到了其重要创始成员数百万美元的支持，所有成员的业务都依赖于开源软件。总体目标是改变任务关键项目的资助方式，实现从被动捐赠转向主动。\n\
    \n“维护关键软件的健康对于互联网的安全是每个人的利益，”来自哥伦比亚的、软件自由法律中心创始主任 Eben Miguel 支持该基金会的举措解释道，“Linux\
    \ 基金会和加入该倡议的公司正致力于继续维护和改进让网络对所有人安全的免费开源软件。这是符合公共利益的业务和合作，我们都应该感谢 Linux 基金会实现了这一切。”\n\
    \n基础设施倡议的进一步资金将以社区捐赠的形式征集，这些资金将由社区持有。\n\nLinux 基金会和加入该倡议的公司正致力于继续维护和改进让网络对所有人安全的免费开源软件。这是符合公共利益的业务和合作，我们都应该感谢\
