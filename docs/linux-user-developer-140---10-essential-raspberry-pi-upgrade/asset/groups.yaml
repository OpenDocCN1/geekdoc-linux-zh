    # Interface


    Gwibber is incredibly simplistic, showing only one column of information at a
    time. This is a little frustrating, due to a graphic glitch, when you go fullscreen
    you can see multiple columns with different content they''re resized. Otherwise,
    navigating tabs and around the menus is easy enough.


    Turpial has a modern interface that is reminiscent of some of the Twitter apps
    seen as TweetDeck. Like TweetDeck, Turpial shows columns of various feeds you
    can monitor. Controls for tweets are almost hidden in the corner, which is strange
    for a main feature.


    # Twitter features


    Not really taking advantage of the API, Gwibber has your timeline, your mentions
    and DMs. The mentions don''t include other Twitter notifications such as follows,
    favourites and retweets and you can properly edit your profiles.


    Unfortunately, due to the limitations on third-party apps, Turpial is also having
    to pay with the limits of features; notifications are limited to mentions and
    allow you to see your favourites and retweets which have actually been seen. Lists
    aren''t included, however you can sort tweets by delaying them by a set period
    of time.


    # Installation


    It''s open, in default repos. It''s lightweight and slim, but does require GTK+
    on KDE or other distros. Most importantly, it''s properly updated across platforms
    to use the 1.1 API and the https protocol that has been enforced since.


    Turpial is the app that has the most problem with getting installed and working.
    It takes a while for the devs to react to the API change and even then to update
    the Twitter library to keep up with other updates are not available. These libraries
    have to be installed manually using Python and to get it to work on some.


    # Customizability


    Very little customization is available, with a few settings allowing you to change
    the link shortener and period before updating your feed. Even though this isn''t
    an official GNOME app, it appears to be very reminiscent of the current trend
    of dumbed software for the GNOME desktop.


    Not the most customizable client here, but it does lot more than Gwibber. You
    can set the universal delay for delayed tweets - something which can''t be individually
    - as well as what we getts, notifications and other things that are useful to
    integrate with the OS.


    # Overall


    There''s very little reason to use Gwibber over the web version of Twitter; only
    the small benefit of notifications is incredibly intuitive and you''re better
    off with another client from the test or Android app.


    Turpial is not perfect, but it''s a very good piece of software. It makes an effort
    to give you as much information as possible without breaking the token bank, as
    well as integrating the rest of the desktop.


