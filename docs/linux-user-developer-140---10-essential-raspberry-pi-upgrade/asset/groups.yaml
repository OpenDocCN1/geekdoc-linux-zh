    # 评测用于树莓派的 Wolfson 音频卡


    - 板上的对微型 MEMS 麦克风提供了立体声录制能力

    - 3.5mm 接口提供线路电平立体模拟音频输入和输出

    - 一对 S/PD 接口提供数字输入和输出能力

    - 耳机孔作为音频输出和外部麦克风输入


    ![](img/a17757b82ff78d9c8d36ac46319604f3_77_0.png)


    # 外设

    用于树莓派的 Wolfson 音频卡

    £27.04/$33.62


    一个挂载在树莓派微电脑 GPIO 引脚上的紧凑产品能变成音频性能怪兽吗？


    树莓派在小于 30 英元的、信用卡大小的包装内集成了大量的硬件设备。从其驱动全高清显示器的能力到无需驱动程序的网络功能 - 即使是最狂热的粉丝也会承认，这个奇迹仍有许多不足之处。


    这正是块板背后的设计理念：一张来自同名音频专家的高质量 Wolfson 音频卡。它以挂载在树莓派通用输入/输出 (GPIO) 引脚上的板载板形式出现，在没有
    USB 端口的情况下升级了树莓派的音频能力。


    虽然通过 HDMI 进行数字音频是可以接受的，但质量极低。即使有 3.5mm 接口和高质量的外部放大器，音频也是嘈杂且不充实的。高质量的解码芯片可以极大地改善状况。通过从
    BCM2835 系统上芯片直接获取数字音频数据，解码器可以以极高质量实现任意数字或模拟输出。


    首先是输出端：Wolfson 板提供了一个带有立体声模拟音频输入、模拟输出的耳机连接器，并留有用于外部扬声器的空置插座以及一个 S/PD 数字连接。该连接类似于树莓派的音频引脚，但具有高质量的模拟音频输入、匹配/PD
    数字输入，最重要的是直接在板上自带了一对 MEMS 麦克风。


    所有这些都通过 GPIO 引脚连接，但有一个小陷阱：Wolfson 音频板使用了


    优点 (Pro)

    Wolfson 音频板在一次实验中受益于树莓派音频能力的巨大升级。


    缺点 (Cons)

    在 Raspberry OS 中设置非常简单，不需要驱动程序，卡在外部内核周围或完成你的...


    # 用于树莓派的 Wolfson 音频卡


    一个紧凑的电路板能将树莓派变成音频性能怪兽吗？


    # 评测


    ![](img/a17757b82ff78d9c8d36ac46319604f3_78_0.png)


    # 技术规格


    - 兼容性：仅支持树莓派 A 型号、B 型修订 2 版

    - 处理器：Wolfson WM8966 解码器

    - 尺寸：72.2x69.1x25.3mm

    - 重量：21g

    - 电源：DC 5v

    - 输出：3.5mm 放大耳机孔、3.5mm 线路电平接口、数字转 I2S 接口、放大扬声器端子（未空置）、扩展引脚

    - 输入：3.5mm 放大耳机孔、3.5mm 线路电平接口、数字转 I2S 接口、双 MEMS 麦克风


    用于临时测试连接的 Pogo-pins 意味着 P 引脚上不需要焊接。


    - 一个塑料限位柱通过其中一个孔将 Wolfson 音频卡固定在树莓派上


    # 同样需要考虑


    Wolfson 音频板使用主 P1 GPIO 引脚作为较小的 P5 引脚。


    - WM102 解码器的额外功能可在扩展引脚上可用


    ![](img/a17757b82ff78d9c8d36ac46319604f3_78_1.png)


    P5 引脚承载音频信号，来自由 Model Revision 2 BCM2835 制造的板卡。该板由 A 型和 B 型共享，具有 256KB 内存，以及与板卡连接的链接和其他引脚。


    安装你的分区非常简单，因此很容易避免焊接。Wolfson 板使用 pogo-pins（通常用于配件测试），这些针位于焊盘下方，并通过限位柱固定。软件安装稍微有些麻烦。该板需要
    Linux 内核补丁，这些补丁不是标准发行版的一部分。运行两个分区（每个对应一个操作系统）或使用预分区的版本是理想的，但如果能在手册中包含该方案就更好了。安装后，配置非常简单：输入和输出可以使用随附脚本进行切换。然而，一旦你设置了配置，音频就可以被删除。


    该板的音频质量令人印象深刻。WM102 解码器提供了具有高动态范围的高保真多声道。尽管受到带宽限制，但高质的输出非常清脆。


    总结 (Summary)

    不可否认，Wolfson 板是树莓派音频能力的一次巨大升级。尽管受限于带宽，但其硬件性能非常出色。然而，软件方面还需要改进。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_78_2.png)


    这种内置数字模拟转换器 (DAC) 的 USB 供电，用于 Matrix 的音乐。它的音质很好，但对于预算有限的用户来说这是一个廉价的选择。


    # DAC 音频卡

    设计用于支持数字电视机，它的音质很好，但对于预算有限的用户来说这是一个不错的选择。


