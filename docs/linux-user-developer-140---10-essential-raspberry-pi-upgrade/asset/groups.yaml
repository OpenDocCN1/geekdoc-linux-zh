    \ postType(): string {\n  if ($_SERVER['REQUEST_METHOD'] == 'GET') {\n    return\
    \ 'GET';\n  } else {\n    return 'POST';\n  }\n}\n```\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_53_0.png)\n\
    \n# Handling GET AND POST\n\nPreviously mentioned is the missing interoperability\
    \ with certain PHP features. $GET and $POST fall into this category. Hack code\
    \ is unaware (although, if you are not running Hack in strict mode, you can still\
