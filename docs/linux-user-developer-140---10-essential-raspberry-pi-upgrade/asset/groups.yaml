    # Make your own Raspberry Pi supercomputer


    **Joey Bernard**


    As a true renaissance man, he splits his time between building furniture, researching
    with scientific computing problems and writing Android apps.


    ## Now that you have built your Raspberry Pi supercomputer, learn the basics of
    how to write Python code to take advantage of all of this power


    ## Why Pi?


    It''s the official language of the Raspberry Pi. Read the docs at www.raspberrypi.org.


    One project you may have thought about using a cluster of Raspberry Pis. The build
    is relatively easy. All you need is to have a few computers, linked over Ethernet
    with one or more switches. This is easy to do at your computer. But what can you
    do with it? This is where the hard part comes. You can''t simply run regular programs
    and expect any kind of speed up. You need to actually write a parallel program
    that takes advantage of all of power you have collected.


    There are two categories of parallel programs: shared memory and message passing.
    In shared memory, between threads by passing message-passing messages. The most
    common library for this is MPI, which is specified by a C library and a Python
    module for Python. You can install it with pip.


    In order to send messages, you need some way to address threads of execution.
    These are indexed by numbers, and rank will contain the number (a rank) and how
    many threads exist in this particular communicator. You can do this with:


    ```python

    comm = MPI.COMM_WORLD

    rank = comm.rank()

    size = comm.size()

    ```


    So the variable will contain the total number of threads, and rank will contain
    this particular rank.


    In MPI, the various threads are grouped into communicators. All of the threads
    within a communicator can talk to each other in the given communicator. When MPI
    starts, a default communicator is created containing all of the available threads.
    This way, you can isolate groups


    Now you need some way to send and receive messages. The default functions for
    sending and receiving messages are blocking. When you send a message, that thread
    will block until the message is received. The same on receive: it will block and
    wait until the incoming message is completely received. There are non-blocking
    ways to send and receive Python objects, which you can do using pickle.


    ## All of the threads within a communicator can talk to each other, but not with
    threads outside the communicator


    programs, all of the parallel threads run execution on the same physical hardware
    and global memory. In this way, information is passed back and forth between the
    threads from shared memory. The only strict limit on this type of memory is that
    you are confined to one physical machine.


    However, you also have the option of creating new communicators from subsets of
    these threads to control access to each other. This is very useful when scaling.


    The second category of parallel programs is message passing. In this type of program,
    execution can exist on one or more machines, as long as they can communicate with
    each other in some fashion. This is usually done over a regular Ethernet network.
    Then information passes back and forth


    But this is also complicated. Using MPI, it will be just to use the library. You
    will need to import the functions of the mpi4py module, with something:


    If you have any experience with MPI in another language, you will find that you
    do not need to initialize the library. In Python, this is done automatically when
    you import the module, so that saves you


    So, we are sending information to the destination at rank 1. The first parameter
    is a ''tag'' that you can use in code to label different types of messages. So
    you could decide that messages are tagged with a 1


    ![](img/a17757b82ff78d9c8d36ac46319604f3_70_0.png)


    # Full code listing


    and control measures are tagged with a2. This way, making the recv function do
    something different with different types of messages. On the receiving end, you
    would call:


    ```python

    data = recv(source, tags=)

    ```


    The observant of you might have noticed any possible bugs. If you had in the recv
    function that the source was not 1, or the tag 10? Then, it would block and wait
    for every message to arrive. These types of functions are hard to catch, since
    they don''t crash your program, they just lock up. With these different versions
    of the function, you can start to write some more complex code.


    If you are using NumPy, you can handle these arrays without having to parse them.
    Now that you have written the code, how to run it? With other languages, you could
    use a script to import and parse data from your Raspberry Pi networked together;
    you could then run your code across all four boards:


    ```bash

    # import mqtt

    mppy --host 192.168.0.102, 192.168.0.103, 192.168.0.104, 192.168.0.105

    my_program.py

    ```


    Now that your Raspberry Pi is connected to the IP addresses, and your code is
    in the file, first of all, you have enough to start playing on your Raspberry
    Pi and see what with MPI you can use for high-performance computing. In a later
    issue we look at some of the more advanced functions available to write even more
    complex code.


