    \ dependencies first: `sudo apt-get install build-essential libgmp-dev lib64-dev\
    \ z-dev`\n\nThe concept of cryptocurrencies has come in recent years as a sort\
    \ of reaction to the way currencies are controlled. Cryptocurrencies are decentralized\
    \ and not controlled by any entity. In the past couple of years, Bitcoin has taken\
    \ off to become a very valuable commodity, units of pounds. While you find a standard\
    \ currency, you can also mine them with a working computer. The concept of mining\
    \ basically is that you're increasing the security of the Bitcoin system by logging\
    \ transactions properly; users who donate processing power to this endeavour get\
    \ paid for it. This is where we come in, turning your Raspberry Pi into a Bitcoin\
    \ mine.\n\n02 Download locations\nTo make the building easier, it's best to create\
    \ a directory for our files now. Still in the terminal, use: `mkdir bitcoin` After\
    \ you've done that, move to the new directory with: `cd bitcoin`\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_64_0.png)\n\
    \n07 Start mining\nWith worker details secure, go back to your Raspberry Pi and\
    \ cd to the cpminer folder again. To begin mining, enter the following command:\n\
    `./miner --url [pool address] --username [password]`\ncpminer will then show your\
    \ hasrate as it, which probably be a touch slow at this stage.\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_64_1.png)\n\
    \n03 Get cpminer\nVisit SourceForge for cpminer and download the latest version\
    \ of the source from there to this new directory. it will be the latest version\
    \ with no OS attached to the title. At the time of writing it is `cpminer-2.3.3.tar.gz`.\n\
    \n| Overclock preset |\n| --- |\n| 700MHz ARM, 200MHz core, 400MHz GPU, 400MHz\
    \ HDMI, 0 overclock |\n| 800MHz ARM, 250MHz core, 400MHz GPU, 400MHz HDMI, 1 overclock\
    \ |\n| 900MHz ARM, 250MHz core, 500MHz GPU, 2 overclock |\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_64_2.png)\n\
    \n08 increase mining speed\nIf you want to try and get a few more hashes per second\
    \ from your Pi, you can always overclock it. In the terminal, open `raspi-config`\
    \ and find the overclock option. You should be aware that overclocking may seriously\
    \ reduce your Pi's lifespan.\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_64_3.png)\n\
    \n04 Extract the files\nIf you're on the desktop you can easily extract the files\
    \ from the file manager. Otherwise go back to the terminal and unpack it with:\n\
    `$ tar -xzvf cpminer-1.0.2.tar.gz`\nFollow up moving into the new cpminer folder\
    \ with: `cd cpminer`\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_64_4.png)\n\n\
    05 Build cpminer\nTo build cpminer we will be using two standard compiling commands:\
    \ --config and make. Both may take a while, and it seems likely to take the longest\
    \ time. If you've followed the preceding steps properly, compiling should not\
    \ be an issue for you.\n\n![](img/a17757b82ff78d9c8d36ac46319604f3_64_5.png)\n\
    \n09 Future prospects\nYou're unlikely to make much out of Raspberry Pi this way;\
    \ if you want to make a serious amount of Bitcoins you'll need to increase your\
    \ hasrate. You can expand your operation by attaching USB miners to the Raspberry\
    \ Pi and powering it up exponentially.\n"
