    ### Gwibber


    Ubuntu''s default social media client, covering Twitter, Facebook and a few other
    social networks. It has developed independently of Ubuntu and has developed to
    be lightweight and more consistent than the official webpages - but does its popularity
    mean it''s the best choice?


    Download: bit.ly/QCpaUB


    ### Turpial


    After the Turpial, Turpial is a pure-Twitter client for Linux. It''s designed
    to be minimalist and lightweight, taking the best features such as scheduling
    and columns from other clients like FeatherDeck and Hootsoot. It''s been underground
    for a few years now, should it be at the top?


    Download: bit.ly/1mun55K


    ### Birdie


    A recent client on the Linux scene that has gone quite popular over the last year.
    Birdie will be getting a 2.0 version at some point this year, however we''re looking
