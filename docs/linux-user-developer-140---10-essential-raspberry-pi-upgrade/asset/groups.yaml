    ### Chogok


    本次组测中唯一的 Qt 和 KDE 客户端。Chogok 支持 Twitter 以及其他几个微博客平台。它的功能不像此处列出的客户端那样齐全，但它非常轻量，并且在
    KDE 及其他桌面环境中集成得更好。


