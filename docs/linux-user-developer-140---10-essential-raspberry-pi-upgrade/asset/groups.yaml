    # # OpenSource


    06 News | 14 Opinion | 94 Letters


    SECURITY


    # # The importance of Tails


    With concerns over online privacy at its highest since the birth of the internet,
    we now speak exclusively to the anonymous developers behind Tails...


    The last year has been a rollercoaster ride for the IT and open source community,
    especially security and privacy is concerned. The world of governments of super
    nations are saying more than they ever before. The Heartbleed bug earlier year
    revealed that we can trust our trusted tool. In the midst of this, Tails takes
    privacy seriously. As our review starting on page 82, it also achieves a high-quality
    rating.


    Tails started five years ago, the developers, an anonymous group of like-minded
    FOSS hackers told us, at that time we were all for it and had been involved in
    free software communities


    But we felt that something was missing from the panorama: a toolbox that would
    bring all the essential privacy technologies together and make them ready to use
    and accessible to a larger public. Some, such as Inognito, which can be considered
    as the ancestor of Tails.


    Tails was built with two specific things in mind sustainability and usability.


    Sustainability refers to how a project can be relied on by its users. The team
    goes on explain the importance of usability: the best security tool is no of use
    if people who really need it cannot use it. Tools must be hard to misuse, which
    should prevent you from making critical mistakes, or ask you to make security
    decisions that you are not able to make.


    > The best security tool is of no use people who really need it on the field cannot
    use it


    ![](img/a17757b82ff78d9c8d36ac46319604f3_5_0.png)


    Popular rhetoric dismissing online privacy''s Importance usually centres on having
    nothing.


    ...The characteristics of digital communications are as the way the internet is
    built but create a yet interesting challenge. The Tails tell us, it is really
    easy to use privacy on the internet, but not so easy to defeat this spying by
    using Tor.


    "We look at the people who are using Tails and Tor, they come from very different
    backgrounds: journalists, dissident bloggers, privacy-conscious scholars, whistleblowers,
    business leaders, victims of intimate partner abuse, and law enforcement officers.
    We think that each of them equally finds online privacy is important but they
    all have their own reasons.


