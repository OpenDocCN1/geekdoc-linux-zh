    ![](img/a17757b82ff78d9c8d36ac46319604f3_94_0.png)


    # 网页设计师


    网页开发是现代计算的重要组成部分，在线和云端提供的大多数服务均基于此。我们对拥有一些极佳的开源网页设计教程感到自豪。《Web Designer》杂志致力于将这些许多功能带到同等的质量水平。它定期涵盖
    HTML5、CSS3、jQuery、WordPress 和移动应用等最新技术。对于那些想要一本优秀的网页开发杂志的人来说，《Web Designer》是最佳选择。您可以在
    www.webdesigner.com 查看到更多信息。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_94_1.png)


    它在 4 月 1 日的停刊引起了一些困惑，不过那是在第二天。


    # Ubuntu 无此


    # 公共红帽


    # 心跳 (Heartbeat)


    关于 Canonical 将关闭 Ubuntu One 的消息真很有趣。我个人并没有使用过它，因为它看起来不像他们描述的那样正在发展；比如添加音乐流媒体和功能。我听说他们取消了
    Ubuntu 在 Android 上的开发；不能说我曾遇到过它的什么问题。有人有关于 Ubuntu TV 的信息吗？有人宣布过这些非发行版产品是否会推出吗？


    看到红帽 Linux 7 RC 变得活跃，我很兴奋；它已经接近 RHEL 7 的最终版本了。我不确定这是否是他们的意图，但这确实有助于帮助我们公司的决策者让他们切换到开源系统。对红帽给出看法，并提供他们所需的完整版本支持。这是一种更便宜的方法，我可能还会把它加入我们的考虑中。我希望他们在太晚之前这么做。


    Kyle


    Nitin Das


    Heartbeat 这件事挺过分的，你知道吗？全都是由于内部错误，而且似乎是 Open 的某个故障部分导致的。似乎没有人决定使用正确的软件来修复它；事实上，这种不稳定性本可以通过使用更好的软件来避免。由社区团队进行开发来修复它并提高对系统良好状态的意识，这是只有在开源领域才能真正实现的事情。希望心跳问题很快就能解决。


    Kyle


    Nitin Das


    这对许多人来说是一个巨大的希望。Canonical 确实谈到了 Ubuntu One 的成功。云端以及 Ubuntu 系统上有一群专门的用户群；特别是与其它云
    Linux 服务的现状相比，它是更好的选择之一。


    它是系统的完整版本，完全包含了开启所需的全部内容；既然提到了 CentOS，它是服务器提供的一个关闭方案的替代方案，越来越不稳定，不足以进行公测等等。SUSE
    正在使用一个新版本，如果数据良好，可能会效仿此例。这里有希望。


    社区的反应非常好。此外，由于 Heartbeat 通常在更新服务器，总会有一两个隐藏在角落被遗忘的服务器，它们可能会引起问题。他们不希望你丢失任何数据，并会在发现后立即修复。如果你想了解更多关于
    Heartbeat 以及如何修复它，请访问 heartbeat.com 获取信息。


    Canonical 仍在关注他们其他项目的进展。预计在明年年底会有某种 Ubuntu 手机，再次，关于它们具体是什么样的还没有没有具体细节。Ubuntu 短期内不会消失，但看到所有其他
    Canonical 产品消失将是很遗憾的。


    ![](img/a17757b82ff78d9c8d36ac46319604f3_94_2.png)


    ![](img/a17757b82ff78d9c8d36ac46319604f3_94_3.png)


