    这是一个 2.8 英寸电容式 TFT 触摸屏，由 Adafruit 项目组专为树莓派设计。它可以直接插在树莓派的上方，且尺寸与树莓派本身一样大。


    ### 为什么要这样做？

    有许多理由让你想要给树莓派添加一个屏幕，但对每个人来说，关键点在于 Pi 非常小且便携，不像显示器那样笨重。如果你在途中，可以在手机上使用 VPN，而屏幕是直接连接到树莓派的，不需要网络连接。此外，由于不需要携带其他设备，它非常强大。


    它开启了一个无限可能。计算机、触摸屏控制面板、视频摄像头……任何可以从你的树莓派拥有脱离主显示器的屏幕和输入设备中获益的设备。


    致谢：CC-SA Philip Burgess, Adafruit


    ### 如何使用？

    你只需要连接来自 Pimor at Friends 的 TFT。这需要进行焊接，然后将其切换到传统的命令行模式。现在它会再次开启，除非你配置树莓派，具体来说，是为了启动-
    TFT 将不会开启


    一旦你登录，开始使用以下命令下载文件：


    ```

    $ wget http://adafruit-download.s3.amazonaws.com/raspberry-pi/libftftdisplay-adafruit.py.gz

    $ wget http://adafruit-download.s3.amazonaws.com/raspberry-pi/dev-driver-adafruit.py.gz

    $ wget http://adafruit-download.s3.amazonaws.com/libftftdisplay-adafruit.py

    ```


    ## 你需要什么

    PiTFT Mini 工具包 - 320x240 2.8 TFT 触摸屏

    https://www.adafruit.com


    ```

    $ wget http://adafruit-download.s3.amazonaws.com/raspberry-pi/libftftdisplay-adafruit.py.gz

    $ wget http://adafruit-download.s3.amazonaws.com/raspberry-pi/boot-loader-adafruit-11263.bit

    ```


    ```

    $ sudo modprobe fbtft789

    $ sudo modprobe fbtft_device name=adafruit rotate=90

    ```


    ```

    $ export FB_DRM=/dev/fb1

    ```


    到这一点你应该能在屏幕上看到图像了，但之后它将不再工作。如果想退出请按 CTRL+C。为了让它在首次启动时工作！请编辑 /etc/modules 并添加：


    ```

    spi-bcm708

    fbtft_device

    ```


    保存文件，现在使用以下命令打开 Adafruit 配置：


    ```

    $ sudo nano /etc/modprobe.d/adafruits

    ```


    ```

    options fbtft_device name=adafruit

    rotate=90 frequency=120000

    ```


    你的屏幕已经旋转了 90 度，现在我们需要对触摸功能也进行操作，以使其方向正确。我们现在需要创建一个目录和文件来处理这个问题：


