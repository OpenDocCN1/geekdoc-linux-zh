    # # Control motors and steppers


    Controlling motors on your Pi is child''s play with PiBorg


    # ### What is it?


    There''s a fundamental drive installed in all tinkerers and it goes something
    very much like, ''If you can, add motors to it''. The Raspberry Pi is no exception
    and in fact, adding motors has become a cottage industry of its own, with everyone
    and its Kickstarter-funded loggers getting a piece of the action.


    solutions) and it offers its own expansion header so you can daisy-chain boards
    together and still access the all-important ground of the market, but it''s certainly
    one of the best far from the cheapest motor driver on the project-user-friendly
    way.


    There are countless ways you can control motors with the Raspberry Pi, starting
    from a simple IC chip the old L293D that can be bridged with ease. Another option,
    is to purchase an add-on board with a suitable motor driver already installed.
    We chose to demonstrate the PiBorg - a board so versatile you can daisy-chain
    to run a robot powerful enough to tear a caravan...


    # ### How to use it


    Setting up the guys with PiBorg has been incredibly thoughtful. The PiBorg comes
    with two colour-coded three cables to connect the board to your Raspberry Pi.
    With a mounting kit you can easily connect the board to your PiBorg without losing
    access to any of the connectors. The board is well documented as per their instructions,
    the installation process proceeds to the software side. See the PiBorg installation
    guide for full details.


    # ### Why use it?


    Because you can control your Raspberry Pi, from a motorised dolly to time-lapse
    photography, to autonomous and remote-controlled home. We used PiBorg''s Raspberry
    for a couple of motor sizes, it doesn''t hog the entire GPIO header (a real-duty
    heavy-bear) with many other


    The Python library supplied by PiBorg is very versatile and feels right for all
    purposes so should not be any difficulties. The library also includes a (Help)
    text that breaks down and lists every function and its parameters in plain English.


    > Just two three-wire cables are needed between the Pi and the Reverse


    # ### What you''ll need


    PiBorg Raspberry Pi £ 31

    www.piborg.com/piborg


    # ## PicoBorg software installation


    If you thought the hardware was easy, the software is equally automatic...


    +   01 Download the examples


    +   Create a folder for the Python module and example scripts to go in. At the
    terminal type:

    `mkdir ~/piborg`


    Navigate into the folder (cd ~/piborg).


    +   02 Run the script


    +   The Raspberry uses I2C for communication, but instead of manually setting
    things up, all you need to do is install the dependencies with `sudo ./install.sh`,
    then run the example script by typing `./install.sh` at the command prompt.

    It really is straightforward.


