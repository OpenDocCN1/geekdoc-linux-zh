    # Signs up big names in the hope of improving code quality


    In the wake of the recent Heartbleed vulnerability in OpenSSL, which could leak
    memory data up to include keys to attackers, the Linux Foundation has now announced
    the Core Infrastructure Initiative, which seeks to find and support projects of
    critical open-source software in the hope of improving code quality.


    In partnership with founding members Amazon, Cisco, Disney, Facebook, Google,
    IBM, Intel, and Microsoft, the Core Infrastructure Initiative looks to identify
    open source projects that are in need of support and expertise that may improve
    the quality and reliability of them.


    Unfortunately, the first project to benefit from the initiative will be OpenSSL,
    which is expected to receive fellowship funding for developers as well as additional
    resources to help fix the security package with a hole as gaping as Heartbleed
    - extreme results.


    "We are expanding the work we do for the Linux Foundation projects that may need
    support," Jim Zemlin, executive director of The Linux Foundation. "Our global
    economy is built on open source software and The Linux Foundation has turned to
    be able to focus 100 cent on Linux development, we will now be able to support
    additional developers and full-time contributors for other essential open source
    projects. We are thankful for these leaders'' commitment to ensuring the continued
    growth and reliability of critical open source projects such as OpenSSL"


    The Core Infrastructure Initiative is backed by millions of dollars from its significant
    founding members, all of whom are reliant on open source software for their businesses.
    The overall aim is to change the way mission-critical projects are funded, making
    the switch from reactive donation to proactive.


    "Maintaining the health of critical software to the security and safety of internet
    is everyone''s interest," explained Eben Miguel of Colombia, founding director
    of the Software Freedom Law Centre, in support of the Foundation''s move. "The
    Linux Foundation, and the companies joining this Initiative, are being dedicated
    to continue maintaining and improving the free and open source software that makes
    the Net work safe for all. This is business and collaboration in the public interest
    and we should all be grateful to The Linux Foundation for it happen"


    Further funding for the Infrastructure Initiative is requested in the form of
    donations from the community, which will be held by the Linux Foundation. This
    use of a neutral organization will help ensure that the projects are funded and
    retain independence that could be lost if sponsorship was used for funding. For
    more details, see bit.ly/timz2ds.


    Jim Zemlin, the Linux Foundation''s executive director, says the initiative will
