  md: '# Communicating with Others


    Your electronic mail address: `userID@showme.missouri.edu`


    For example: `c123456@showme.missouri.edu` ctruman@showme.missouri.edu`


    There are two different e-mails systems available on SHOWME. They are Pine and
    Elm. Both systems are menu driven. You may choose whichever meets your e-mail
    needs.


    # Pine


    Pine is a menu based electronic mail program. To run the program, type `pine`
    from your Unix prompt. The first time you invoke pine, you will see the following
    screen.


    | PINE 3.87 MAIN MENU Folder: (CLOSED) 0 Messages |

    | Welcome to Pine... |

    | A Program for Internet News and Email. Pine offers the ability to: |

    |-Access local and remote message folders using a simple user-interface |

    |-Send documents, graphics, etc (via the MIME standard for attachments) |

    | COMMANDS IN PINE: The last two lines on the screen tell you what commands are
    available for the current situation. Usually there are more commands than can
    be shown on two lines, so use the TAB key to see what OTHER COMMANDS are available.
    The "O" is optional; it is not necessary for a command to be visible before using
    it (except when Pine is used in function-key mode); then F2 is required.) |

    | PINE CONFIGURATION: Pine will create a default configuration file, .pinerc,
    in your home directory. You may edit this file to select various options. It will
    also create a "mail" subdirectory for your saved-message folders. PLEASE type
    "?" from the Main Menu for help.

    | PINE is a trademark of the University of Washington. |


    Type any character to continue :'
  merge: -1
  pgno: 11
