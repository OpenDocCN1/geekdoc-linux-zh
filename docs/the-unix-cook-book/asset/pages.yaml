  md: '# vi Editor Reference


    vi is a basic, full screen editor common to most Unix operating systems. The program
    is actually a combination of vi\ (the full screen) and ed (the background macros).
    You invoke the ''ed'' section of the vi editor when you use the '':,'' commands.
    A quick reference is provided here.


    > REMEMBER: All Unix Commands are Case Sensitive!!


    # Abbreviations


    | # | a numeric value before the command i. #G would mean 32G |

    | ^X | control-X |

    | <sp> | space |

    | <cr> | carriage return (the return or enter key) |

    | <string> | a string of characters |


    # Movement Commands


    a number before a movement command repeats that the number of times. If no number
    is typed before the command, the number is assumed to be 1.


    | #h (or arrow) | left |

    | #j (or arrow) | down |

    | #l (or right arrow) | right |

    | #k (or up arrow) | end of line |

    | #$ | first char of line |

    | #w | move a word forward |

    | #b | move a word backwards |

    | #G | goto to line # |

    | # | sentence forward |

    | #( | sentence backward |

    | #( | paragraph forward |

    | #( | paragraph backward |

    | ^F | screen forward |

    | ^B | screen backward |


    # Searching


    | /<string> | search for next occurrence of <string> |

    | ?<string> | search for previous occurrence of <string> |'
