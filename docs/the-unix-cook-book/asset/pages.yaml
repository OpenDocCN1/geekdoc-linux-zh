  md: '# Miscellaneous Operators


    | :set number | display line number |

    | :set all | show options and values |

    | :firstline, lastlines/original/new/g | substitute original text with new (g
    means global replacement) |


    An example of the substitute command: :1,$s/University of Missouri/MU/g

    Which says: Starting at l1, for all lines, change all the occurrences of "University
    of Missouri" to be "MU".


    # Editor Reference


    x is The Hessling Editor. It is intended to be similar to VM/CMS/XEDIT. It is
    a good editor for those of you who are already familiar with editing files MIZZOUI
    and aren''t quite ready to pico or vi. Most of the commands are similar to XEDITs.
    There are some differences, however., the function keys being of these; a table
    is below.


    # Standard x Function Key Assignments


    Settings may vary. Enter from the command line to see current settings.


    | F1 | SOS Edit |

    | F2 | Split/Join |

    | F3 | Quit --If nothing has been changed, terminate editing. |

    | F4 | nop |

    | F5 | Undefined |

    | F6 | ? |

    | F7 | Backward l |

    | F8 | Forward l |

    | F9 | File |

    | F10 | Shift Right 55 columns |

    | F11 | Shift Left 55 columns |

    | F12 | Do Prefix Command |


    # Movement Commands


    | down arrow | move cursor down one line, scrolling if necessary |

    | enter | execute command on command line or next line |

    | left arrow | move cursor left one column scrolling if necessary |

    | right arrow | move cursor right one column scrolling if necessary |

    | up arrow | move cursor up one line scrolling if necessary (previous command
    if on command line) |


