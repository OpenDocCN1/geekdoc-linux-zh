    This screen is common throughout the program. At the top of the screen, pine will
    display the version number of the program, followed by the menu option you are
    currently working in. At the top right of the screen is the current folder and
    how many messages reside there. In the center of the screen are the options from
    this menu, and at the bottom single letter commands are listed.


    # To Send Mail


    +   - Press C from the main menu of pine to compose a message.

    - Enter names into To: field.

    - (You can use nicknames that you have set up in the Address Book)

    - Press <tab> to move on, fill in other fields as desired (especially the subject
    field).

    - Press <tab> to move to the body of the note.

    - enter the text of the note.

    - Press X (control-X) to send, then Y to confirm.


    # Editing Your Note


    +   - Words autowrap as you type.

    - To insert letters, words, or sentences, move to where you want to insert & type.

    - Backspace key will delete letters.

    - Space will be added to the note as needed (as you type).

    - Use ^J (control-J) to rejustify text after editing.

    - Spell check by pressing ^T (control-T).'
