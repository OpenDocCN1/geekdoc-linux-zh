    # Printing


    The lpr command is used to print files in Unix. The format of the command is:


    ```

    lpr [-options] filename(s)

    ```


    The most common option you would want to specify the printer destination, -P.
    (Notice: this is a Capital P) There is no default printer destination in SHOWME.
    If you wanted to print the file homeworkl.sas to the printer in the Heinkel Computing
    Lab the command would be:


    ```

    lpr -P fhprpl homeworkl.sas

    ```


    Following is a table of the most comfy used printers on campus:


    | Printer Name | Location |

    |---|---|

    | asprl | 10 Arts & Sciences |

    | bpprl | 7 Middlebush |

    | eepril | 17 Engineering Complex West |

    | fhprpl | 23 Heinkel Building |

    | physprl | 127 Physics |


    # Submitting Batch Jobs to the Compute Cluster


    The Compute Cluster is available to users who have numerically intensive batch
    work. The cluster machines are shared via IBM''s LoadLeveler Software. Software
    available on the cluster machines include: FORTRAN (including IMSL), SAS 6.09,
    Gaussian 92 and Mathematica.'
