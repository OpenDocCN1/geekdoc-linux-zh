    ## Creating and Modifying UNIX Disk Files


    Three of the most popular editors on SHOWME are: pico, vi and x. Pico is the easiest
    for beginners, x is almost identical to XEDIT on MIZZOU1 CMS and vi is a Unix
    standard.


    ## The Pico Editor Reference


    Pico is a simple, displayed text editor. Commands are displayed at the bottom
    of the screen and context-sensitive help is provided, by pressing ^g (Control-G).
    As characters are typed they are immediately inserted into the text. Editing commands
    are entered using control-key combinations. To start editing a new file enter
    pico from the SHOWME prompt. The screen should look something like:


    ```

    PICO 2.1                               New Buffer


    ^G Get Help    ^O Write Out ^R Read File ^Y Prev Page ^K Cut Text    ^C Cur Pos

    ^X Exit        ^J Justify   ^W Where is ^V Next Page ^U Uncut Text ^T To Spell

    ```


    Now you are begin typing in your file. You do this by simply typing in your text.
    When you finish typing your file ^o (Write Out). Pico will prompt you to name
    file. Filenames should be fairly descriptive and meaningful to you and SHOWME.
    For example, if you are entering in a SAS program you might want to name something
    like homework1.sas. File and Directory Names earlier in this Cookbook for more
    information on naming.


    If you want to edit an existing file, rather than creating a new one, enter pico
    <filename> from the SHOWME prompt. Where <filename> is the name of the file you
    want to edit.


    ## Control Key Commands


    | Key | Description |

    | --- | --- |

    | Ctrl-f | Moves cursor forward a character |

    | Ctrl-b | Moves cursor backward a character |

    | Ctrl-p | Moves cursor to the previous line |

    | Ctrl-n | Moves cursor to the next (following) line |

    | Ctrl-a | Moves cursor to the beginning of the current line |

    | Ctrl-e | Moves cursor tot he end of the current line |

    | Ctrl-v | Moves cursor forward one page |

    | Ctrl-y | Move cursor backward one page |

    | Ctrl-w | Searches for a string of text |

    | Ctrl-l | Refreshes the screen display |

    | Ctrl-d | Deletes the character at the cursor position |

    | Ctrl-k | Cuts selected text |

    | Ctrl-u | Pastes the text block, which was last cut, at the cursor position |

    | Ctrl-r | Inserts an external file at the cursor position |

    | Ctrl-o | Saves the current file |

    | Ctrl-x | Exits Pico |

    | Ctrl-i | Inserts a tab at the current cursor position |

    | Ctrl-j | Justifies the current paragraph |

    | Ctrl-t | Invokes the spelling checker |

    | Ctrl-g | Help |

    | Ctrl-t | Justify text |

    | DELETE key | Delete character to the left |

