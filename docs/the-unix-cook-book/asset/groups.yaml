    # vi Editor Reference


    vi is a basic, full screen editor common to most Unix operating systems. The program
    is actually a combination of vi (the full screen) and ed (the background macros).
    You invoke the ''ed'' section of the vi editor when you use the '':,'' commands.
    A quick reference is provided here.


    > REMEMBER: All Unix Commands are Case Sensitive!!


    # Abbreviations


    | # | a numeric value before the command e.g. 32G would mean 32G |

    | ^X | control-X |

    | <sp> | space |

    | <cr> | carriage return (the return or enter key) |

    | <string> | a string of characters |


    # Movement Commands


    a number before a movement command repeats that the number of times. If no number
    is typed before the command, the number is assumed to be 1.


    | #h (or arrow) | left |

    | #j (or arrow) | down |

    | #l (or right arrow) | right |

    | #k (or up arrow) | end of line |

    | #$ | first char of line |

    | #w | move a word forward |

    | #b | move a word backwards |

    | #G | goto to line # |

    | # | sentence forward |

    | #( | sentence backward |

    | #( | paragraph forward |

    | #( | paragraph backward |

    | ^F | screen forward |

    | ^B | screen backward |


    # Searching


    | /<string> | search for next occurrence of <string> |

    | ?<string> | search for previous occurrence of <string> |


    # Undoing Changes


    | | |

    | u | undo latest change |

    | U | Undo all changes to current line |

    | :q! | quit without saving changes |

    | :e! | re-edit the file |


    # Deleting and Moving


    Everything deleted is stored into a buffer. This is done by putting a "a" and
    <a-z> before the delete command. The deleted text will be written into the buffer
    designated by the letter. To append text to a buffer, a capital letter <A-Z> is
    used.


    | | |

    | # | delete characters after the cursor |

    | #X | delete characters before the cursor |

    | #dd | delete lines |

    | #dw | delete words |

    | D | delete the rest of the line |

    | P | put back most recently deleted text before the cursor |

    | P | put back most recently deleted text after the cursor |


    # Inserting & Changing Text


    All of these commands are finished by pressing the escape key <esc> .


    | | |

    | a | append text |

    | i | insert text |

    | #r | replace # characters |

    | #R | overwrite rest of line |

    | #J | join # lines together |

    | :s/<string1>/<string2> | substitute all <string1> with <string2> |


    # Writing, Editing, & Quitting vi


    | | |

    | :q | quit vi |

    | :q! | quit without changing file |

    | :w | write the file |

    | :w <string> | write to file <string> |

    | :w >> <string> | append to the end of file <string> |

    | :w! <string> | overwrite the file <string> |

    | :wq | write file and quit |

    | :f <string> | set current filename to <string> |

    | :cd <string> | change directory to <string> |

    | :r <string> | read in file <string> |


    Unix Cookbook - May 7, 1999 - mrg - Version 1.0


    # Miscellaneous Operators


    | :set number | display line number |

    | :set all | show options and values |

    | :firstline, lastlines/original/new/g | substitute original text with new (g
    means global replacement) |


    An example of the substitute command: :1,$s/University of Missouri/MU/g

    Which says: Starting at l1, for all lines, change all the occurrences of "University
    of Missouri" to be "MU".


    # Editor Reference


    x is The Hessling Editor. It is intended to be similar to VM/CMS/XEDIT. It is
    a good editor for those of you who are already familiar with editing files in
    and aren''t quite ready for pico or vi. Most of the commands are similar to XEDITs.
    There are some differences, however., the function keys being of these; a table
    is below.


    # Standard x Function Key Assignments


    Settings may vary. Enter from the command line to see current settings.


    | F1 | SOS Edit |

    | F2 | Split/Join |

    | F3 | Quit --If nothing has been changed, terminate editing. |

    | F4 | nop |

    | F5 | Undefined |

    | F6 | ? |

    | F7 | Backward l |

    | F8 | Forward l |

    | F9 | File |

    | F10 | Shift Right 55 columns |

    | F11 | Shift Left 55 columns |

    | F12 | Do Prefix Command |


    # Movement Commands


    | down arrow | move cursor down one line, scrolling if necessary |

    | enter | execute command on command line or next line |

    | left arrow | move cursor left one column scrolling if necessary |

    | right arrow | move cursor right one column scrolling if necessary |

    | up arrow | move cursor up one line scrolling if necessary (previous command
    if on command line) |


    Unix Cookbook - May 7, 1999 - mrg - Version 1.0


    # Searching


    These commands are performed from the command line.


    | /<string> | search for next occurrence of <string> |

    | ?<string> | search for previous occurrence of <string> |


    # Command Line Commands


    These commands are performed from the command line.


    | /<string> | search for next occurrence of <string> |

    | ?<string> | search for previous occurrence of <string> |


    # Prefix Commands


    These commands are performed from the command line.


    | a | add line |

    | / | make current line |

    | c | copy line |

    | m | move line |

    | d | delete line |

    | " | duplicate line |

    | p | prior to line |

    | f | following line |

    | > | shift line |

    | < | shift line |

    | cc | copy line |

    | mm | move line |

    | dd | delete line |

    | " | duplicate line |

    | >> | shift line right |

    | << | shift line left |


    # Programming Environments


    | Language | Extension | To Run: |

    |---|---|---|

    | FORTRAN | .f | lf |

    | C | .c | xc |

    | Pascal | .p | xp |

    | SAS | .sas | sas |

    | Mathematica | .ma | math |


    # Printing


    The lpr command is used to print files in Unix. The format of the command is:


    ```

    lpr [-options] filename(s)

    ```


    The most common option you would want to specify the printer destination, -P.
    (Notice: this is a Capital P) There is no default printer in SHOWME. If you wanted
    to print the file homework.sas to the printer in the Computing Lab the command
    would be:


    ```

    lpr -P fhprpl homework.sas

    ```


    Following is a table of the comfy used printers:


    | Printer Name | Location |

    |---|---|

    | asprl | 10 Arts & Sciences |

    | bpprl | 7 Middlebush |

    | eepril | 17 Engineering Complex West |

    | fhprpl | 23 Heinkel Building |

    | physprl | 127 Physics |


    # Submitting Batch Jobs to the Compute Cluster


    The Compute Cluster is available to users who have numerically batch work. The
    cluster machines are shared via IBM''s LoadLeveler Software. Software available
    on the machines include: FORTRAN (including IMSL), SAS 6.09, Gaussian 92 and Mathematica.


    Interactive shell scripts are available for easy job submission.


    | Shell Script Name | For Software: |

    |---|---|

    | fsub | FORTRAN and C |

    | ssub | SAS 6.09 |

    | msub | Mathematica |

    | gsub | Gaussian 92 |


    There are four job queues setup.


    | Job Queue Name | CPU Time | Priority | Software |

    |---|---|---|---|

    | short | 10 minutes | highest | all |

    | medium | 2 hours | ↑ | all |

    | long | 200 hours | | FORTRAN and SAS |

    | g92 | 300 hours | lowest | Gaussian 92 |


    Users can submit as many jobs as they wish, but only three jobs owned by any user
    can run at the same time. This prevents any one from flooding the queues, but
    still allows for all three machines being kept busy when only one user is active.
    More information about the Compute Cluster is available in `gopher`.

