    # Submitting Batch Jobs to the Compute Cluster


    The Compute Cluster is available to users who have numerically intensive batch
    work. The cluster machines are shared via IBM''s LoadLeveler Software. Software
    available on the cluster machines include: FORTRAN (including IMSL), SAS 6.09,
    Gaussian 92 and Mathematica.'
  - '[PAGE 23]


    Interactive shell scripts are available for easy job submission.


    | Shell Script Name | For Software: |

    |---|---|

    | fsub | FORTRAN and C |

    | ssub | SAS 6.09 |

    | msub | Mathematica |

    | gsub | Gaussian 92 |


    There are four job queues setup.


    | Job Queue Name | CPU Time | Priority | Software |

    |---|---|---|---|

    | short | 10 minutes | highest | all |

    | medium | 2 hours | ↑ | all |

    | long | 200 hours | | FORTRAN and SAS |

    | g92 | 300 hours | lowest | Gaussian 92 |


    Users can submit as many jobs as they wish, but only three jobs owned by any user
    can run at the same time. This prevents any one from flooding the queues, but
    still allows for all three machines being kept busy when only one user is active.
    More information about the Compute Cluster is available in `gopher`.


    > REMEMBER: All Unix Commands are Case Sensitive!!


