    | F5 | 未定义 |

    | F6 | ? |

    | F7 | 向后移动 |

    | F8 | 向前移动 |

    | F9 | 文件 |

    | F10 | 向右移动 55 列 |

    | F11 | 向左移动 55 列 |

    | F12 | 执行前缀命令 |


    # 移动命令


    | 向下箭头 | 光标向下移动一行，必要时滚动屏幕 |

    | 回车 | 在命令行或下一行上执行命令 |

