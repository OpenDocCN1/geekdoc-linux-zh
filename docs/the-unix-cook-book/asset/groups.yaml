- md: '

    # Session Control and Job Management


    Brackets around a word [ ] indicate that this is an option of the command. A word
    in italics indicates you need to supply what is in italics.


    | | |

    |---|---|

    | clear | Clear terminal screen. |

    | jobs | List stopped and background jobs. Only valid in C Shell. |

    | bg [%job] | Continue job in background. [Default:current job]. Only valid in
    C Shell. |

    | fg [%job] | Continue job in foreground. [Default:current job]. Only valid in
    C Shell. |

    | stop [%job] | Stop job running in background. [Default:current job]. Only valid
    in C Shell |

    | %job [&] | Continue job in [in background if &]. Only valid in C Shell |

    | nice command & | Run job in background at low priority. See also at command.
    |

    | time command | Show how much CPU and real time command uses |

    | history [n] | List most recent n commands. If you want to do this, you must
    previously set history = m, where m is the number of commands you want remembered.
    Only valid in a C Shell |

    | ps [options] | Show a process. The default is only yours |

    | -a | All processes controlled by terminal. |

    | -g | Show group leaders (top level processes). |

    | -tx | Processes on tty x, e.g. -pt2 or -tty2 |

    | -u | User oriented output. Processes for specific user. |

    | -x | Show even processes with no terminal. |

    | kill 123 | Kill process 123 [system-wide numbering, use "ps"]. |

    | kill %1 | Kill job 1 [your process 1, use "jobs"] |

    | at time [commandfile] | Run program/script at a later time. e.g.: 0300 0300
    friday 0300 jan 25 |


    # File and Directory Names


    Each file name may contain any of the ascii characters and be up to 255 characters
    in length.


    **Capitalization counts!** File stuff is different from file Stuff.


    If a filename contains characters special to a shell (such as: > | & ? or blank)
    you must enclose it in double or single quotes. For example:


    ```

    ''My #1 File'' or "tmp/huh?" or ''Read Me\!''

    ```


    Unix files are arranged in a hierarchical structure, much like DOS files are stored.
    Path names are the vehicles for moving up and down the directory tree. The directory
    tree starts with / (called root).


    If I wanted to reference absolutely a file in c123456''s sub True it would look
    something like:


    ```

    /home/c123456/files/assign1.c

    ```


    The total path name length must not exceed 1024 characters.


    Your home directory will be: /home/userid. If you are user ID c123456 then your
    home directory will be: /home/c123456.


    | | |

    |---|---|

    | | The current directory. |

    | .. | The directory above the current one. |

    | -c987654 | Home directory for user ID c987654 |

    | ~ | Your own home directory. |


    # Directory and File Management


    | cat files | conCATenate: Copy files to standard: output as one file. |

    | cd directory | Change Working Directory. |

    | chgrp group files | CHange GRouP id for files. |

    | chmod wholelevel files | CHange MODE for files: set security access. |

    | | who can be: |

    | u | User |

    | g | Group |

    | a | All |

    | | ± can be: |

