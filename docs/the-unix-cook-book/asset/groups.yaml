    # File and Directory Names


    Each file name may contain any of the ascii characters and be be up to 255 characters
    in length.


    **Capitalization counts!** File stuff is different from file Stuff.


    If a filename contains characters special to a shell (such as: > | & ? or blank)
    you must enclose it in double or single quotes. For example:


    ```

    ''My #1 File'' or "tmp/huh?" or ''Read Me\!''

    ```


    Unix files are arranged in a hierarchical structure, much like DOS files are stored.
    Path names are the vehicles for moving up and down the directory tree. The directory
    tree starts with / (called root).


    ![](img/01a10e500e9d28f7d728bbecf2ffd29c_7_0.png)


