    XEDIT 类似。但也有一些不同之处，功能键如下下表所示。


    # 标准 x 功能键分配


    设置可能有所不同。从命令行输入以查看当前设置。


    | F1 | SOS 编辑 |

    | F2 | 分割/合并 |

    | F3 | 退出 -- 如果没有任何更改，则终止编辑。 |

