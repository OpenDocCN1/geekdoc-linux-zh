    # vi 编辑器参考


    vi 是一种大多数 Unix 操作系统常用的基础全屏编辑器。该程序实际上是 vi（全屏界面）和 ed（后台宏）的结合。当你使用 `:,` 命令时，你调用的是
    vi 编辑器的 ''ed'' 部分。这里提供了一个快速参考。


    > 记住：所有的 Unix 命令都是区分大小写的！


    # 缩写


    | # | 命令前的数字值，例如 32G 表示 32G |

    | ^X | control-X |

    | <sp> | 空格 |

    | <cr> | 回车（return 键或 enter 键） |

    | <string> | 字符字符串 |


    # 移动命令


    移动命令前的数字表示该操作重复的次数。如果命令前没有输入数字，则默认为 1。


    | #h (或向左箭头) | 向左 |

    | #j (或向下箭头) | 向下 |

    | #l (或向右箭头) | 向右 |

    | #k (或向上箭头) | 行尾 |

    | #$ | 行首 |

    | #w | 向前移动一个单词 |

    | #b | 向后移动一个单词 |

    | #G | 跳到第 # 行 |

    | # | 向前一个句子 |

    | #( | 向后一个句子 |

    | #( | 向前一个段落 |

    | #( | 向后一个段落 |

    | ^F | 翻页 |

    | ^B | 翻页 |


    # 搜索


    | /<string> | 搜索 <string> 下一次出现的位置 |

    | ?<string> | 搜索 <string> 上一次出现的位置 |


    # 撤销更改


    | | |

    | u | 撤销最近一次更改 |

    | U | 撤销当前行的所有更改 |

    | :q! | 不保存修改退出 |

    | :e! | 重新编辑文件 |


    # 删除与移动


    所有删除的内容都存储在缓冲区中。这通过在删除命令前加上 "a" 和 <a-z> 实现。删除的文本将写入该字母指定的缓冲区。要向缓冲区追加文本，则使用大写字母
    <A-Z>。


    | | |

    | # | 删除光标后的字符 |

    | #X | 删除光标前的字符 |

    | #dd | 删除行 |

    | #dw | 删除单词 |

    | D | 删除行的剩余部分 |

    | P | 将最近删除的文本粘贴在光标前 |

    | P | 将最近删除的文本粘贴在光标后 |


    # 插入与修改文本


    所有这些命令都通过按下退出键键 <esc> 完成。


    | | |

    | a | 追加文本 |

    | i | 插入文本 |

    | #r | 替换 # 个字符 |

    | #R | 覆盖行的剩余部分 |

    | #J | 合并 # 行 |

    | :s/<string1>/<string2> | 将所有的 <string1> 替换为 <string2> |


    # 写入、编辑与退出 vi


    | | |

    | :q | 退出 vi |

    | :q! | 在不更改文件退出 |

    | :w | 写入文件 |

    | :w <string> | 写入文件 <string> |

    | :w >> <string> | 追加到文件 <string> 的末尾 |

    | :w! <string> | 覆盖文件 <string> |

    | :wq | 写入文件并退出 |

    | :f <string> | 将当前文件名设置为 <string> |

    | :cd <string> | 切换目录到 <string> |

    | :r <string> | 读取文件 <string>


