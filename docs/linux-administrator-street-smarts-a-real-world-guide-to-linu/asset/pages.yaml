    \ such as `/dev/hda` and `/dev/hda9`, GRUB uses strings of the form (hd`x`, `y`),\
    \ where `x` is a disk number and `y` is a partition number. (The `y` and preceding\
    \ comma may be omitted to refer to an entire disk or its MBR.) Both the `x` and\
    \ the `y` are numbered starting from 0, which contrasts with Linux’s numbering\
    \ partitions starting with 1. Thus, Linux’s `/dev/hda9` is GRUB’s `(hd0,8)`. GRUB\
    \ doesn’t distinguish between ATA and SCSI disks; `hd0` is the first disk recognized\
    \ by the BIOS, `hd1` is the second disk, and so on.\n\nListing 5.3 shows a typical\
    \ GRUB configuration file. Like the LILO configuration file, it consists of a\
    \ series of global options followed by stanzas (beginning with the keyword `title`)\
    \ for the OSs or kernels it boots. You should be able to figure out what most\
    \ of these options mean, even if a few of them remain mysterious.\n\n# Listing\
    \ 5.3: Sample GRUB Configuration File\n\n```\n```plain\ndefault=0\ntimeout=4\n\
    \nsplashimage=(hd0,3)/grub/splash.xpm.gz\n\ntitle Linux (2.6.10)\n    root (hd0,3)\n\
    \    kernel /bzImage-2.6.10 ro root=/dev/hda9 mem=256M\n    boot\n\ntitle Windows\n\
    \    rootnoverify (hd0,1)\n    chainloader +1\n    boot\n```\n```\n\nThe procedure\
    \ for adding a kernel to GRUB is very similar to the procedure to add a kernel\
    \ to LILO:\n\n+   1. Install the new kernel file, typically in `/boot`. Ensure\
    \ that you do *not* overwrite the existing kernel file, though. You should have\
    \ done this as part of the kernel recompilelation in Phase 2.\n+   2. Copy the\
    \ stanza for the existing kernel file in your GRUB configuration file. The result\
    \ is two identical stanzas."
  merge: -1
