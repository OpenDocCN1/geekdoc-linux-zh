    # ## Task 5.6: Check Filesystem Integrity


    Unfortunately, computers aren''t perfect. Bugs, hardware failures, power outages,
    and other problems can cause data corruption. If left uncorrected, such problems
    can cause further data corruption, possibly leading to the loss of all the data
    on a disk. For this reason, Linux provides a tool, `fsck`, which checks the integrity
    of your filesystem''s basic data structures. Knowing how to use `fsck` can help
    you keep your system healthy and fix problems when they occur.


    > The `fsck` tool checks the *filesystem*''s data structures. It won''t help you
    if *individual data files* become garbled unless that problem is directly related
    to a filesystem issue.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_244_0.png)


