    # # Task 1.3: Manage Links


    Native Linux filesystems have always supported a feature known as *links*. A link
    is a way to refer to a file in one location from another location or to use multiple
    names for a single file. Linux supports two types of links, which are described
    shortly. They''re created and managed with the `ln` command. In this task, you''ll
