  img_proc: true
- pgno: 337
  md: "This line activates both user and group quota support for the /dev/hdc5 partition,\
    \ which is mounted at /home. Of course, you can add other options if you like.\n\
    \nDepending on your distribution, you may need to configure the quota package’s\
    \ SysV startup scripts to run when the system boots. Phase 3 describes SysV startup\
    \ script management in detail. Typically, you’ll type a command such as chckrootquota\
    \ on; however, you should check on the SysV scripts installed by your distribution’s\
    \ quota package. Some distributions require use of commands other than chckrootquota\
    \ to do this task, as described in Phase 3. Whatever its details, this startup\
    \ script runs the quotaon command, which activates the quota support.\n\nAfter\
    \ installing software and making configuration file changes, you must activate\
    \ the sys- tems. The simplest way to do this is to reboot the computer, and this\
    \ step is necessary if you had to recompile your kernel to add quota support directly\
    \ into the kernel. If you didn’t do this, though, you should be able to get by\
    \ with less disruptive measures: using modprobe to install the kernel module if\
    \ necessary, running the SysV startup script for the quota tools, and remounting\
    \ the filesystems on which you intend to use quotas by typing mount -o remount\
    \ /mount-point, where /mount-point is the mount point in question.\n\n# ## Setting\
    \ Quotas for Users\n\nAt this point, quota support should be fully active on your\
    \ computer but the quotas themselves are not set. You can set the quotas by using\
    \ edquota, which starts the Vi editor (described in Phase 1) on a temporary configuration\
    \ file (/etc/quota.tab) that controls quotas for the user you specify. When you\
    \ exit from the utility, edquota uses the temporary configuration file to write\
    \ the quota information to low-level disk data structures that control the kernel’s\
    \ quota mechanisms. For instance, you might type edquota sally to edit sally’s\
    \ quotas. The con- tents of the editor will show the current quota information:\n\
    \nQuotas for user sally:\n\n/dev/hdc5: blocks in use: 3209, limits (soft = 5000,\
    \ hard = 6500)\n            inodes in use: 403, limits (soft = 1000, hard = 1500)\n\
    \nThe temporary configuration file provides information on both the number of\
    \ disk blocks in use and the number of inodes in use. (Each file, symbolic link,\
    \ or directory consumes a single inode, so the inode limits are effectively limits\
    \ on the number of files a user may own. Disk blocks vary in size depending on\
    \ the filesystem and filesystem creation options, but they typ- ically range from\
    \ 512 bytes to 8KB.) Changing the use information has no effect, but you can alter\
    \ the soft and hard limits for both blocks and inodes. The hard limit is the maximum\
    \ num- ber of blocks or inodes that the user may consume; the kernel will not\
    \ permit a user to surpass these limits. Soft limits are somewhat less stringent;\
    \ users may temporarily exceed soft limit values, but when they do so, the system\
    \ issues warnings. Soft limits also interact with a grace period; if the soft\
    \ quota limit is exceeded for longer than the grace period, the kernel begins\
    \ treating it like a hard limit and refuses to allow the user to create more files.\
    \ You can set the grace period by using edquota with its -t option, as in edquota\
    \ -t. Grace periods are set on a per-filesystem basis rather than a per-user basis."
  merge: -1
  img_proc: true
- pgno: 338
  md: 'A few more quota-related commands are useful. The first is *quotacheck*, which
    verifies and updates quota information on quota-enabled disks. This command is
    normally run as part of the *quota* package''s SysV *startup* script, but you
    may want to run it periodically (say, once a week) as a *cron* job. (Phase 3 describes
    *cron* jobs.) Although theoretically not necessary if everything works correctly,
    *quotacheck* ensures that quota accounting doesn''t become inaccurate. The second
    useful auxiliary quota command is *repquota*, which summarizes the quota information
    on the filesystem you specify or on all filesystems if you pass it the -a option.
    This tool can be very helpful in keeping track of disk usage. The *quota* command
    has a similar effect. The *quota* tool takes a number of options to use them modify
    their outputs. For instance, -g displays group quotas, -1 omits NFS mounts, and
    -4 limits output to filesystems on which usage is over the limit. Consult *quota*''s
    *man* page for still more obscure options.


    # Setting CPU and Memory Limits


    PAM enables you to set limits on the number of times individuals can log in, how
    much CPU time they can consume, how much memory they can use, and so on. Specifically,
    you use a PAM module called *pam_limits* to do this job. Most major Linux distributions
    use this module as part of their standard PAM configuration, so chances are you
    won''t need to add it; however, you will still need to configure *pam_limits*.
    This is done by editing its configuration file, */etc/security/limits.conf*. This
    file contains comments (denoted by hash marks, #) and limit lines that consist
    of four fields:


    *domain* *type* *item* *value*


    Each of these fields specifies a particular type of information:


    +   - **The *domain*** The *domain* describes the entity to which the limit applies.
    It can be a username; a group name, which takes the form *@groupname*; or an asterisk
    (*) wildcard, which matches everybody.

    +   - **Hard or soft limits** The *type* field specifies the limit as *hard* or
    *soft*. A *hard* limit is imposed by the system administrator and cannot be exceeded
    under any circumstances, whereas a *soft* limit may be temporarily exceeded by
    a user. You can also use a dash (-) to signify a limit is both *hard* and *soft*.

    +   - **The *limited item*** The *item* field specifies what type of item is being
    limited. Examples include *core* (the size of core files created in certain types
    of program crashes), *data* (the size of a program''s data area), *fsize* (the
    size of files created by user), *nofile* (the number of open data files), *rss*
    (the resident set size), *stack* (the stack size), *cpu* (the CPU time of a single
    process in minutes), *nproc* (the number of concurrent processes), *maxlogins*
    (the number of simultaneous logins), and *priority* (the process priority). The
    *data*, *rss*, and *stack* items all relate to memory consumed by a program. These
    and other measures of data capacity are measured in kilobytes.

    +   - **The *value*** The final field specifies the value that''s to be applied
    to the limit.'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'As an example, consider the types of limits suggested in this task''s Scenairo
    section. If you want to limit CPU time to 30 minutes and memory use per program
    to 30MB (equally divided between data, RSS, and stack), you might use a configuration
    like this:


    ```

    @users hard cpu 30

    @users hard data 10240

    @users hard stack 10240

    @users hard rss 10240

    ```


    All members of the `users` group are limited in the ways specified: CPU time cannot
    exceed 30 minutes and memory used by programs may not exceed 10MB for each of
    the data, stack, and RSS memory. These limits don''t apply to users who aren''t
    members of the `users` group, such as `root` and the accounts used to run most
    servers.


    > CPU time and total system access time are two entirely different things. CPU
    time is calculated based on the amount of time that the CPU is actively processing
    a user''s data. Idle time (for instance, when a user''s shell is active but no
    CPU-intensive tasks are running) doesn''t count. Thus, a user can log in and remain
    logged in for hours even with a very low hard CPU time limit. This limit is intended
    to prevent problems caused by users who run very CPU-intensive programs on systems
    that should not be used for such purposes.


    One particularly radical approach to security is to use the `/etc/nologin` file.
    If this file is present, only `root` may log into the computer. In many respects,
    this is like setting critical system limits to 0 for all other users. This file
    is most likely to be useful on dedicated server systems that have no regular console
    or remote shell users.


    # Criteria for Completion


    To complete this task, you should have implemented both disk quotas and limits
    on CPU time and memory use. Disk quota limits prevent users from consuming excessive
    amounts of disk space, while CPU and memory limits prevent user processes from
    running away and consuming ridiculous amounts of CPU time and memory. All three
    types of limits can be useful on multi-user systems with limited resources, but
    you''ll have to be careful in setting these limits: If they''re set too low, they''ll
    interfere with users'' legitimate uses of the computer.


    # Task 7.3: Set Good User and System Passwords


    Passwords are the "keys" to a computer system. Unlike physical keys, though, passwords
    are chosen by their users, and some passwords are better than others. If your
    users set poor passwords, the task of crackers who want to break into your system
    becomes easier. Therefore,'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'you should know how to set passwords that are hard to break. Just as important,
    your **users** should know how to set good passwords. Thus, you should share the
    techniques described in this task with your users to improve your *overall* system
    security.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_340_0.png)


    > The mainstream media uses the term **hacker** to refer to computer miscreants.
    This word has an older and more honorable meaning, though: In the Linux world,
    *hacker* often refers to people who are skilled with computers, and particularly
    with computer programming, and who use their skills for productive purposes. Many
    Linux developers consider themselves hackers in this positive sense. Thus, I use
    another word, *cracker*, to refer to individuals who break into and otherwise
    disrupt the operation of computers.


    The same rules that apply to user passwords apply to the **root** password, but
    the **root** password is even more critical. Thus, you should be particularly
    diligent about setting a good **root** password, keeping it secret, and changing
    it from time to time.


    # ## Scenario


    As part of routine security maintenance, you want to change both your user password
    and your **root** password. Phase 1 describes the `passwd` utility, which is used
    to change your password; but to use this tool most effectively, you need to know
    how to generate a good password—or *two* good passwords, one for your user account
    and one for the computer’s **root** account. (Ordinary users without superuser
    access need only generate one good password for each computer, of course.)


    # ## Scope of Task


    This task is basically a mental one; it can be done without access to a computer.
    Of course, in *practice* you’ll ultimately need to use your Linux system and its
    `passwd` utility to change your password.


    # ## Duration


    This task should take half an hour or less to complete. Once you’re familiar with
    the techniques of password generation, you should be able to create a new one
    in under a minute.


    # ## Setup


    No special setup is required to complete this task; you can do it using your mind
    alone (and this book for reference). To actually set your password, of course,
    you’ll need to log into your Linux system and use the `passwd` utility.


    # ## Caveats


    As a purely mental activity, password generation poses no particular risks *per
    se*. The risks really apply to the consequences of doing this task incorrectly.
    A poor password might be'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'guessed or otherwise discovered by a cracker, granting full access to your
    account (or the computer, in the case of the root password). Crackers can use
    network sniffers (tools to monitor network activity), social engineering (tricking
    people into revealing their passwords), dictionary attacks (encrypting every word
    in a dictionary and comparing the results to what’s stored in a stolen encrypted
    password file), and other techniques to break into a computer. Even a good password
    can be a risk if you write it down or store it on a disk file.


    # Procedure


    Generating a good password requires two main steps: First, you should select a
    base for the password. The base should be relatively easy to remember but hard
    to guess. Second, you should modify the base in various ways to make it even harder
    to guess. Once you’ve selected and implemented your password, you should take
    various steps to keep it from being compromised.


    # Selecting a Solid Base


    The password base is a string that’s memorable but that shouldn’t appear in any
    language’s dictionary as a single word. One reasonable procedure for picking a
    base is to use an acronym. For instance, you might use yiuutd, for yesterday I
    went to the dentist. (Of course, this specific example is a poor one because it’s
    been used as an example in this book. A cracker who reads this book might add
    yiuutd to a dictionary, and it might spread from there.) Another option for a
    base is to use two short and unrelated words, such as bunpen. You won’t find bunpen
    in a dictionary, although you will find its constituent words. (Again, this specific
    example is now a poor base because it’s appeared in this book.) A variant on the
    multiword approach is to use fragments of multiple words, such as asepho, derived
    from baseball and telephone. As a general rule, an acronym is the safest choice,
    providing it doesn’t happen to spell anything.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_341_0.png)


    > These examples are all six characters long. Subsequent modifications add characters,
    and passwords on some OSs are limited to eight characters in length, hence the
    six-character length. Modern Linux distributions are not so limited, and in fact
    eight characters is a more reasonable minimum safe password length than a maximum.
    You might need to generate short passwords for some purposes, though, such as
    for retrieving email from your ISP or logging onto Web pages.


    There are many common types of strings you should never use as a password, or
    even as a password’s base:


    +   *   The name of any relative, friend, co-worker, or pet

    +   *   The name of any character in a book, movie, or play or the name of a favorite
    work of fiction or art

    +   *   Your own name or your username

    +   *   Any other personally relevant information, such as your Social Security
    number or street address'
  merge: -1
  img_proc: true
- pgno: 342
  md: '+   * Particularly for the root password, any word signifying great power,
    such as deity or boss

    +   * Particularly for workstations, a name or word that appears in plain sight
    of the terminal, such as the monitor''s model number

    +   * Any single word in any language, even if it''s spelled backwards

    +   * Any obvious misspelling of a word, such as r0cket, where the number 0 replaces
    the letter o in the word

    +   * Any ascending or descending sequence of numbers or letters, such as 54321
    or g hijk

    +   * Any string of identical characters, such as mmmmm

    +   * Any string of characters that appears on the keyboard, such as qwerty


    The first six prohibitions are designed to protect against targeted attacks—the
    sort that seem to have a 100 percent chance of working in the movies. The rest
    of the prohibitions are designed to protect against words that are likely to appear
    in cracker dictionaries. These dictionaries are larger than ordinary dictionaries;
    they can include words in many languages, common misspellings, and nowords that
    people are likely to try using.


    # ### Modifying the Base


    Once you''ve selected a base by creating an acronym or combining multiple words
    or word fragments, you should modify that base. These modifications move the base
    farther from the original and make it harder for a cracker to guess the password,
    even if the base appears in the cracker''s dictionary. You can make modifications
    such as the following:


    **Adding random punctuation, numbers, or control characters** You can add punctuation,
    numbers, or even control characters to the password. Ideally, you should place
    these features randomly within the base, as in y3@u##L|j or b#wn@pp#. The number
    of possible additions of even just two characters is so large that password-cracking
    programs can''t check every possibility. One exception: Many people start or end
    passwords with numbers, so crackers often try the hundred password variants that
    result from this change, rendering the change ineffective.


    **Changing case at random** Linux''s passwords are case sensitive, so randomly
    altering the case of passwords can be an effective strategy. For instance, your
    password might become Yir9wTTJ\D or b#UNp0@eN. This modification isn''t effective
    on all systems or password types, though. For instance, the passwords used by
    some versions of SMB/CIFS, and hence by Linux''s Samba server, are case insensitive.


    **Reversing the order of one base word** If you use a pair of words as the base,
    you can reverse the order of one of the two words, as in NU#bbp0eN. By itself,
    this modification isn''t extraordinarily effective, but it does increase the cracker''s
    search space by a modest amount.


    As a general rule, adding punctuation, numbers, or control characters is the single
    most effective modification you can make. Altering the case of random characters
    can also be an important modification, at least for Linux''s primary passwords.


    When you''re done, the password should resemble gibberish but be memorable to
    you personally. Automated password-cracking tools will very probably be unable
    to match your password, which is the goal of the exercise. As an ordinary user,
    you can then change the password by using the `passwd` command, as described in
    Phase 1.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '![](img/f430a19bdf014c43ad7c2d594afd5b21_343_0.png)


    > Try not to change your password over an unencrypted link such as a Telnet session.
    Doing so poses the risk that the password-change transaction will be monitored
    by a cracker. If some suspicious event compels you to change your password over
    an insecure link, change it again as soon as possible over a secure link.


    # ## Protecting Passwords from Abuse


    Once you''ve generated a password, you normally use it. Simultaneously, though,
    you must protect the password from discovery by means other than password cracking.
    Certain practices put passwords at risk of discovery by others, and other practices
    can help prevent this discovery, or at least minimize the risk if your password
    is found out. Steps you can take to improve your password security include:


    +   *   **Use encryption** Whenever possible, use encrypted protocols, such as
    SSH, rather than unencrypted protocols, such as Telnet. This rule is particularly
    important on the Internet at large; when you send an unencrypted password over
    the Internet, it probably passes through about a dozen routers, any one of which
    could be compromised. Unfortunately, it''s not always possible to use encryption.
    For instance, many ISPs support only unencrypted tools for recovering email using
    the Post Office Protocol (POP).

    +   *   **Change your password frequently** If you change your password often,
    you minimize the time period during which crackers can abuse it should it be discovered.
    As the system administrator, you can enforce a password-change time by using the
    `-x` parameter to `passwd`. For instance, typing `passwd -x 30 ferd` enforces
    a 30-day maximum password lifetime on the `ferd` account.

    +   *   **Use unique passwords for each account** If you have multiple accounts,
    don''t reuse the same password on each account. Using unique passwords for all
    your accounts will minimize the risk should the password for one account be discovered.
    Unfortunately, the proliferation of password-protected Web sites makes this advice
    practically impossible to follow for Web sites. You may need to categorize your
    sites according to sensitivity, and assign unique passwords only to sites that
    are particularly sensitive, such as online banking sites. Alternatively, many
    Web browsers can now remember passwords for you; however, this approach has its
    own perils, which are described next.

    +   *   **Store passwords only in your head** Writing down passwords is potentially
    very dangerous; if the paper on which a password is written falls into the wrong
    hands, your account becomes instantly insecure. Likewise, storing your password
    in a computer file is risky; if your primary account is compromised, the secondary
    accounts protected by passwords stored in the primary account''s files may also
    be attacked. Unfortunately, some tools are very awkward or impossible to use without
    storing passwords on disk; for instance, Fetchmail (`http://catb.org/~esr/fetchmail/`)
    is virtually worthless if it can''t read a password from its configuration file.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '**Beware of suspicious notices and activity** If your login failed but you
    think you typed the password correctly, change your password at once—especially
    if you logged in using a public terminal. If somebody’s lurking nearby when you
    log in, be careful to shield the terminal as you type the password. Never give
    your password to anybody else. As a general rule, odd occurrences—both in software
    and in human behavior—should be treated with suspicion. These events may have
    perfectly innocent explanations, but if in doubt, take appropriate actions to
    protect your account. Changing your password is cheap insurance against many types
    of attack.


    Many of these protective measures are essentially defenses against social engineering.
    Others defend against network sniffing or other dangers. All of them must be practiced
    by ordinary computer users, which means that you, as a system administrator, must
    find a way to educate your users. In some cases this is easy; for instance, if
    you’re running Linux on a personal workstation, you may be the only user. In other
    cases, you may need to include password education in a formal user training program.


    One other step you may want to consider as a system administrator is auditing
    your users’ passwords. You can run a password-cracking program, such as Crack
    (`http://www.crypticide.org/users/alect/`), to discover weak user passwords. You
    can then notify users of their weak passwords and give them some time to correct
    the matter. For the best security, transfer the password file via floppy disk
    to a computer that’s not connected to the network and run the password-cracker
    on it. This practice will minimize the chance that a miscreant will stumble upon
    your password cracking.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_344_0.png)


    Although discovering weaknesses in your system security in order to correct problems
    is an admirable goal, most organizations have strict policies forbidding activities
    such as password cracking. To avoid running afoul of such policies, even though
    you’re doing it in the service of improving system security, be sure to clear
    password-cracking activity with somebody who has the proper authority. Obtain
    this authorization in the form of a written and signed document, not merely a
    verbal approval. Failure to obtain permission to crack users’ passwords may cost
    you your job or even result in criminal charges being filed against you.


    # Criteria for Completion


    To complete this task, you should have generated two new passwords: one for your
    user account and one for **root**. Both passwords should be built from a hard-to-guess
    base with modifications that make the password even harder to guess. The final
    part of this task relates to ongoing practices rather than a single objective;
    you must employ safe and avoid unsafe practices with respect to protecting your
    password in day-to-day use. Because all users with regular Linux accounts have
    passwords, all of your users should be made aware of these password generation
    and protection practices.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# # Task 7.4: Monitor for Security Breaches


    Many Linux features fall into the “set and forget” category—you can configure
    them in a way that’s reasonable and then leave that configuration in place until
    new local needs, a software upgrade, or some other factor forces you to make a
    change. Sadly, this isn’t true of security. Because crackers are constantly discovering
    new vulnerabilities and means of attack, a configuration that was, to the best
    of your knowledge, perfectly good yesterday may be hopelessly unsafe today. Even
    if you believe a computer was reasonably secure, it’s possible that a cracker
    could exploit a vulnerability you didn’t know about. For these reasons, you should
    keep on the alert for security breaches and take steps to keep your system secure.


    # ## Scenario


    You’ve configured a computer with what you believe is an adequate level of security.
    You must now plan how to keep the computer’s security level reasonable and monitor
    it for intrusion in case you’ve overlooked a vulnerability. To do this, you’ll
    use software update tools, monitor security resources, and monitor your system
    for signs of intrusion.


    # ## Scope of Task


    In some sense, this task is an open-ended one; your security monitoring task is
    never complete. Creating a basic plan for security monitoring is more bounded,
    though.


    # ## Duration


    Planning your security monitoring regimen should take an hour or two. Actually
    implementing that plan will require countless hours over the next weeks, months,
    and years.


    # ## Setup


    To plan to monitor your system for security breaches requires little in the way
    of setup; you’ll just need a regular account on an Internet-connected computer
    to refer to some Internet resources. Actually doing the monitoring, though, requires
    user access to the computer and occasionally **root** access.


    # ## Caveats


    Planning your monitoring activities is fairly risk free; however, implementing
    them isn’t. Some parts of this task require **root** access, for which the usual
    caveats apply. Aside from those caveats, most security monitoring tasks are fairly
    innocuous and unlikely to cause harm. One exception is installing updated software,
    which runs the risk of causing a serious cascade of problems if the new software
    doesn’t work exactly like the old version.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Procdure


    Keeping your system secure can be a full-time job if you do everything that’s
    possible. To keep this task manageable, I focus on just four subtasks: keeping
    an eye on Interneten security information, maintaining your system software, using
    Tripwire, and using chkrtookit.


    # Monitoring Internet Security Resources


    You should get into the habit of reviewing several security Web sites and other
    resources to learn about new threats:


    **CERT/CC** The Computer Emergency Response Team Coordination Center (http://www.cert.
    org) hosts general security information, including information on the latest threats.
    Periodically reviewing this site will help you keep up-to-date with security developments.


    **US-CERT** The United States Computer Emergency Readiness Team (http://www.us-cert.gov)
    has taken over some of the duties formerly held by CERT/CC. In practice, both
    sites are worth monitoring.


    **CIAC** The Computer Incident Advisory Capability (http://ciac.llnl.gov/ciac/),
    run by the U.S. Department of Energy, is similar to CERT/CC and US-CERT in many
    respects, but its Web page gives greater emphasis to current threats and less
    coverage of general security practices.


    **CVE** The Computer Vulnerabilities and Exposures (http://cve.mitre.org) site
    is dedicated to maintaining a dictionary of vulnerability names. This information
    can be useful in facilitating communication about problems. The CVE contains less
    in the way of descriptions of the vulnerabilities and exploits it names, though.


    **SecurityFocus and Bugtraq** The SecurityFocus Web site (http://www.securityfocus.com)
    is yet another general security site. One of its important features is that it
    hosts the Bugtraq mailing list (http://www.securityfocus.com/archiv e/1), which
    can be a good way to keep informed—subscribe, and alerts about new threats will
    be delivered to your email account soon after they’re made public.


    **Linux Security** The Linux Security site, http://www.linuxsecurity.com, is very
    similar to CERT/CC, US-CERT, CIAC, and SecurityFocus in many ways. Linux Security,
    though, caters to Linux in particular and so may be more helpful in addressing
    Linux-specific issues or in pointing to Linux-specific fixes.


    **Distributions’ Web sites** Most Linux distributions maintain security information
    on their Web sites. Go to your distribution’s main page and look for links relating
    to security. These sites can provide specific upgrade instructions for your distribution
    in particular.


    **Product Web pages and mailing lists** Many programs have Web pages and mailing
    lists, and these can be good resources for learning of security problems related
    to these programs. Of course, regularly perusing all of the pages related to the
    hundreds of programs that make up a Linux system can be a full-time job. You might
    want to keep an eye on the Web pages or mailing lists for any high-profile server
    programs that you run, such as the Apache Web server or the sendmail mail server.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '**Security newsgroups** Several Usenet newsgroups are devoted to security.
    Of particular interest are the groups in the `comp.security` hierarchy.


    I recommend you investigate most or all of these resources and then keep up with
    a few of them. For instance, you might check the CER T/CC and Linux Security Web
    sites on a daily basis, subscribe to the Bugtraq mailing list, and check your
    distribution’s security page on a weekly basis. Keeping up with security developments
    in this way will alert you to new risks quickly—with any luck, quickly enough
    to avoid problems caused by crackers who might try to exploit weaknesses soon
    after they’re discovered.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_347_0.png)


    Many of these resources offer RDF Site Summary (RSS) feeds of their content. This
    protocol enables you to use a news aggregator program, such as Amphetadesk (<http://www.disobey.com/amphetadesk/>
    ) or BlogBridge (<http://www.blogbridge.com>), to track security problems and
    learn about them as soon as possible.


    # Keeping Your Software Up-to-Date


    Phase 3 provided information on using the Yum and Advanced Package Tools (APT)
    utilities to retrieve data on updated packages and to download and install these
    packages. Because many security problems are caused by software bugs, you’re well
    advised to keep your software up-to-date. That said, many of the updates offered
    by your distribution’s maintainer are not security related and so can be bypassed
    if you don’t want to bother upgrading them. I recommend you pay particular attention
    to server updates and to software that’s used by root or that’s installed with
    the set user ID (SUID) bit enabled. If in doubt, read up on the updated software
    on your distribution’s or the package’s Web page; you can learn from these sources
    what new features and bug fixes a new package includes.


    # Using Tripwire


    Should somebody manage to break into your computer, Tripwire (<http://www.tripwire.org>
    ) may be your best bet to detect that fact. This utility records a set of information
    about all the important files on a computer, including various types of checksums
    and hashes—short digital “signatures” that enable you to quickly determine whether
    or not a file has been changed. (These can also be used in other ways; for instance,
    Linux uses hashes to store passwords.) With this database stored in a secure location,
    you can check your system periodically for alteration. If an intruder has modified
    any of your files, Tripwire will alert you to this fact. If you like, you can
    run a Tripwire verification on a regular basis—say, once a week in a cron job.


    Many distributions ship with Tripwire, but it may not be installed by default.
    The utility is controlled through two configuration files: `tw.cfg` and `tw.pol`,
    which often reside in `/etc/tripwire`. The `tw.cfg` file controls overall configuration
    options, such as where `tw.pol` resides, how Tripwire sends reports to the system
    administrator, and so on. The `tw.pol` file includes information on the files
    Tripwire should monitor, among other things. Both files are binary files created
    from text-mode files called `twcfg.txt` and `twpol.txt`, respectively. You'
  merge: -1
  img_proc: true
- pgno: 348
  md: "may need to edit twpol.txt to eliminate references to files that you don't\
    \ have on your system and to add information on files that you do have but that\
    \ the default file doesn't reference. Use the twin $t$ al . $s h$ program (which\
    \ often resides in /etc/tripwire) to generate the binary configuration files and\
    \ other critical database files. This utility will ask you to set a pair of passwords,\
    \ which are like passwords but are typically longer, to control access to the\
    \ Tripwire utilities. You'll then need to enter these passphrases to have the\
    \ utility do its encoding work.  \n\nOnce you've generated the basic setup files,\
    \ type tripwire --init to have Tripwire generate initial checksums and hashes\
    \ on all the files it's configured to monitor. This process is likely to take\
    \ a few minutes. Thereafter, typing tripwire --check will check the current state\
    \ of the system against the database, and typing tripwire --update will update\
    \ the database (say, in case you upgrade a package). The --init and --update operations\
    \ require you to enter the passphrase, but --check doesn't. Therefore, you can\
    \ include an automated Tripwire check in a cron job. (Phase 3 describes cron jobs\
    \ in more detail.)\n\n> **NOTE**  \n> Tripwire is best installed and initialized\
    \ on a completely fresh system, before connecting the computer to the Internet\
    \ but after all programs have been configured. Although it's possible to install\
    \ it on a system that's been up and running for some time, if that computer has\
    \ already been compromised without your knowledge, Tripwire won't detect that\
    \ fact.\n\n# Using chkr00tkit\n\nThe chkr00tkit program (http://www.chkr00tkit.org)\
    \ is something of a last-resort method of detecting intrusion and is the closest\
    \ thing in the Linux world to Windows virus scanners. (Linux virus scanning programs\
    \ also exist, but they're intended mainly to check for Windows viruses on Samba\
    \ shares. Linux viruses are not a problem in the real world, at least not as of\
    \ late 2006.)  \n\nMany crackers use root kits, which are prepackaged intrusion\
    \ tools. When an intruder runs a root kit against a target, the root kit software\
    \ probes for known weaknesses (such as servers with known security bugs), breaks\
    \ in, and installs software to enable simpler access by the intruder. The intruder\
    \ can then log in using Telnet, SSH, or the like and gain full control of the\
    \ system.\n\n> **NOTE**  \n> Intruders who use root kits are often referred to\
    \ as script kiddies. These miscreants have minimal skill; they rely on the root\
    \ kit to do the real work of the intrusion. Some people prefer to reserve the\
    \ term cracker for more skilled intruders, but others consider script kiddies\
    \ to be crackers with minimal expertise.\n\nUsing chkr00tkit is fairly straightforward:\
    \ Type its name. The result is a series of lines summarizing checks that the software\
    \ performs. These lines should all end with not infected, no suspect files found,\
    \ or a similar reassuring message. If any message alerts you to an intrusion,\
    \ you should take immediate corrective measures."
  merge: -1
  img_proc: true
- pgno: 349
  md: '# Criteria for Completion


    To complete this task, you should have a plan in place to keep yourself and your
    system up-to-date concerning security. You should have reviewed several security
    Web sites and other Internet resources and be prepared to monitor them regularly.
    You should plan to use Yum, APT, or another system package tool to keep yourself
    informed of package updates and to install them when necessary. You should also
    plan to use Tripwire and chkrrootkit on a regular basis (perhaps run from cron)
    to monitor your system for intrusion. In reality, this task is never complete;
    you''ll be performing these tasks (and perhaps others) in perpetuity in order
    to keep your system secure.'
  merge: -1
