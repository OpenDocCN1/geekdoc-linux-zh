- pgno: 237
  md: 'Normally, `mount` can correctly identify the filesystem type, but on occasion
    it needs an extra nudge. You might use this option when mounting a FAT filesystem,
    since Linux supports three FAT filesystem codes: `msdos` mounts the partition
    with short DOS filenames, `vfat` supports long Windows filenames, and `umsdos`
    provides a Linux-only method of encoding long filenames and Unix-style ownership
    and permission information on the disk. You can also mount an ext3 filesystem
    using the `ext2` type code if you don''t want to use the journal. On rare occasion,
    this approach can help you get around filesystem corruption on an ext3 filesystem.
    Occasionally Linux fails to identify the filesystem type, in which case you must
    supply it.


    Another useful `mount` option is `-a`, which causes `mount` to examine the `/etc/fstab`
    file and mount all the filesystems described there (except for those that use
    the `noauto` option, as described in Task 5.5). This is particularly useful if
    you''re temporarily unmounting filesystems for maintenance or if you''ve just
    made changes to `/etc/fstab`. You don''t pass any device filename or mount point
    when you use this option; just type `mount -a`.


    Still more mount options can be passed with the `-o` parameter, which accepts
    an option name. These are summarized in Table 5.2.


    **TABLE 5.2 Important Filesystem Options for the `mount` Command**

    | Option | Supported Filesystems | Description |

    | :--- | :--- | :--- |

    | `loop` | All | Causes the loopback device to be used for this mount. Allows
    you to mount a file as if it were a disk partition. For instance, `mount -o loop
    image.img /mnt/image` mounts the file `image.img` as if it were a disk. |

    | `remount` | All | Changes one or more mount options without explicitly unmounting
    a partition. To use this option, you issue a mount command on an already-mounted
    filesystem but with remount along with any options you want to change. This feature
    can be used to enable or disable write access to a partition, for example. |

    | `ro` | All | Specifies a read-only mount of the filesystem. This is the default
    for filesystems that include no write access and for some with particularly unreliable
    write support. |

    | `rw` | All read/write filesystems | Specifies a read/write mount of the filesystem.
    This is the default for most read/write filesystems. |

    | `uid=value` | Most filesystems that don''t support Unix-style permissions, such
    as vfat, hfs, ntfs, and hfs | Sets the owner of all files. For instance, `uid=500`
    sets the owner to whoever has Linux user ID 500. (Check Linux user IDs in the
    `/etc/passwd` file.) |'
