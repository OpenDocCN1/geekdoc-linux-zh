    ```


    Listing 7.1 consists of three broad parts. The first three calls to iptables clear
    out all pre-existing firewall rules. This is particularly important in a script
    that you''re creating or debugging because you don''t want to simply add new rules
    to existing ones; the result would likely be a confusing mishmash of old and new
    rules. The next three calls to iptables set the default policy to DROP on all
    three chains. This is a good basic starting point for a firewall. The remaining
    calls to iptables configure Linux to accept specific types of traffic:


    Loopback traffic The script sets the system to accept traffic to and from the
    loopback interface (that is, 127.0.0.1). Certain Linux tools expect to be able
    to use this interface, and because it''s purely local, the security risk in accepting
    such traffic is very slim. Note that the lines that enable this access use both
    the IP address (via the `-d` and `-s` options) and the lo interface name (via
    the `-o` and `-i` options). This configuration protects against someone spoofing
    the loopback address—an attacker pretending to be 127.0.0.1 from another computer.
    This configuration, like most iptables configurations, requires two iptables rules:
    one to enable incoming traffic and one to enable outgoing traffic.


    DNS traffic The second block of rules enables UDP traffic to and from port 53,
    which handles DNS traffic. A configuration like this one is necessary on most
    systems to enable the computer to use its local DNS server. You could strengthen
    this configuration by specifying only your local DNS server''s IP address. (If
    you have multiple DNS servers, you''d need one pair of rules for each one.)


    Client traffic Listing 7.1 enables TCP packets to be sent from unprivileged ports
    (those used by client programs) to any system. This configuration allows new,
    established, or related out-'
