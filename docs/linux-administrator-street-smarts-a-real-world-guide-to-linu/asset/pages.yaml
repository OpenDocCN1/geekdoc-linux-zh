- pgno: 214
  md: '![](img/f430a19bdf014c43ad7c2d594afd5b21_214_0.png)


    Phase 1 described commands used to manipulate files—cp, mv, rm, and so on. The
    files these commands manipulate aren’t just thrown onto blank hard disks like
    so many spoons and forks in a drawer.


    Linux, like any OS, needs a set of data structures on the disk in order to help
    it find files on the disk, something like partitions or plastic organizers to
    help you keep your spoons and forks separate in your drawers. These data structures
    fall into two broad categories: partitions, which split a disk into a few distinct
    parts, and file systems, which are data structures within partitions that enable
    Linux to organize and find files. This phase is devoted to creating and otherwise
    manipulating partitions and file systems. Along the way you’ll learn everything
    you need to know if you want to add a new hard disk to your system or perform
    basic maintenance on your partitions and file systems.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_214_1.png)


    This task maps to portions of the CompTIA Linux+ objectives 1, 2, and 3 and to
    portions of the LPIC objectives 102 and 104.


    # ## Task 5.1: Plan a Partition Scheme


    Before you can use a disk, you must partition it, and before you partition it
    you must decide how you want to partition it. To do so you must understand the
    basics of how your computer’s partitioning system works and what function partitions
    serve in your computer. This task addresses these issues and enables you to plan
    a partitioning scheme for a disk.


    # ### Scenario


    You’ve just purchased or built a new computer and you want to install Linux on
    it. To do so, you must decide how to partition the computer to hold Linux, including
    space for system files, user files, a swap partition, and so on. The computer
    has a single 120GB hard disk on which you’ll be storing Linux and all the system’s
    data files.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_214_2.png)


    You must also plan a partitioning scheme if you add a disk to an existing computer.
    Typically, in that situation you’ll move some data from the old disk to the new
    one and recycle cleared partitions from the old disk to some new purpose. For
    instance, you might move the contents of /home from the old disk to the new one
    and then reuse the old /home partition as /usr/local.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Scope of Task


    This task is a paper-and-pencil exercise that involves planning for future activities.
    As such, it poses no risks and requires no special access to any computer. You
    might, however, want to check current systems'' configurations to estimate how
    much space they require.


    # Duration


    You should be able to complete this task, including obtaining estimates of existing
    systems'' disk use, in half an hour or so. Once you''re familiar with typical
    disk use patterns, you should be able to plan a partitioning scheme in 5 minutes
    or less.


    # Setup


    In theory, you can perform this task with nothing but paper and a pen or pencil.
    In practice, you''ll find it helpful to review the configurations of one or more
    existing computers. Ideally, your review systems should run the same Linux distribution
    you plan to install on the new one and should be used in similar ways. Having
    user (non-**root**) access to any computers you plan to review will be necessary,
    and occasionally **root** access to these systems can be helpful.


    # Caveats


    Planning disk partitioning poses no risks per se, unless you damage systems whose
    existing layouts you check. The biggest risk is with making incorrect choices.
    If you make a partition too small, correcting that mistake can be tedious and
    time-consuming and, depending on how you make the correction, can require system
    downtime. With today''s big hard disks, it''s usually better to err on the side
    of making a partition too large instead of too small. Another risk-avoidance strategy
    is to use Logical Volume Management (LVM), which is a way to create partitions
    that can be easily resized. LVM is more complex than traditional partitioning,
    though, and I don''t describe it in this book.


    # Procedure


    You should do three things to complete this task: review existing systems'' configurations,
    use those configurations and knowledge of your new system''s needs to estimate
    its disk space requirements, and design a layout that suits your purposes. If
    you have no existing systems whose layouts you can review, you''ll have to go
    by more general guidelines. Before you do these things, though, you should understand
    some background information on disk partitioning.


    # Understanding x86 Disk Partitioning


    A disk partition is just a way to carve up disk space so that multiple OSs can
    use a single computer or so that a single OS can treat parts of the disk in different
    ways. Partitioning requires writing data to the disk to define the partitions,
    but as usual in the computer world, multiple disk partitioning schemes exist.
    The most common is the x86 partitioning system that''s used by most x86 and x86-64
    (aka AMD64) computers. This partitioning scheme traces its history back to the
    mid-1980s, when a big hard disk was 10MB in size (about one-sixtieth the size
    of a modern CD-R).'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Given the small size of hard disks and the number and nature of the OSs that
    can run on x86 hardware at the time, the designers of the original x86 partitioning
    scheme saw no need to support more than four partitions per disk. This limit was
    therefore hard-coded into the data structures. As OSs became more plentiful and
    flexible, the four-partition limit became a problem and a scheme to expand the
    limit was retrofitted onto the x86 partitioning system: One of the four original-style
    (primary) partitions became a placeholder (extended) partition for additional
    (logical) partitions. In practice, the number of logical partitions is limited
    by OS addressing issues, such as the number of Linux device nodes that can refer
    to them. The end result, therefore, is that you can have up to three primary partitions
    and an arbitrary number of logical partitions on a disk (with a single extended
    partition holding the logical partitions) or up to four primary partitions.


    Primary partitions are defined in the Master Boot Record (MBR), which is the first
    sector on the hard disk. The MBR also holds the boot loader, which is the software
    that the computer loads when it boots the computer. Task 5.7 describes how to
    install a boot loader. Logical partitions are defined in the extended partition''s
    space.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_216_0.png)


    Most non-x86 systems use other partitioning schemes, and most of these partitioning
    systems don''t distinguish between primary, extended, and logical partitions.


    Linux is a clone of Unix systems, which developed independently of the x86 computer
    hardware during the 1980s. Unix, and hence Linux, has traditionally used partitions
    as a way to split up logical parts of the OS. In principle, you can drop Linux
    into a single partition, which will hold the root ( / ) directory and all its
    subdirectories; however, this approach has limitations. You can''t use different
    filesystem types (ext3fs, ReiserFS, and so on) for different directories, a disk
    error in the one filesystem will affect everything, you can''t use filesystem
    options as a security tool (say, to prevent writing to certain directories), disk
    partitioning can simplify system upgrades by enabling you to wipe some partitions
    clean while preserving others, you''ll need to either do without swap space or
    create it in a file on your main filesystem, and so on. On the other extreme,
    if you create too many partitions, judging the appropriate size for each one can
    become very difficult, and the probability of running out of space on one or more
    partitions goes up.


    A typical Linux system uses between three and a dozen or so distinct partitions,
    but details differ greatly from one computer to another. With the exception of
    swap partitions, each partition is assigned a mount point—a directory that corresponds
    to a partition''s files. For instance, if you mount a partition at /usr, Linux
    will look for that partition whenever you try to access files in the /usr directory
    tree. Much of what you''ll do in this task is deciding how many separate partitions
    to create and how large to make them.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_216_1.png)


    If your Linux system dual-boots between Linux and another OS, you''ll have to
    remember to include one or more partitions for the other OS. Some OSs are fussy
    about requiring primary partitions, but Linux is very flexible in this respect.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# ## Reviewing Existing Systems


    If you have access to existing Linux computers that run software similar to what
    you plan for your new system, you can review their partitions. You can use `df`
    to do this job:


    ```

    ```

    $ df

    Filesystem      1K-blocks      Used Available Use% Mounted on

    /dev/sdb6          977180     362768     614412  38% /

    udev             256024       188      255836   1% /dev

    /dev/sdb5         6291260    4820608    1470652  77% /usr

    /dev/sda7         2564012    346868     2217144  14% /usr/local

    /dev/sda8         3145628     832012    2313616  27% /usr/portage

    /dev/sdb7         2097084    163748     1933336   8% /var

    /dev/sdb12        17825244  11834228    5991016  67% /home

    /dev/sda1         101089      3511       61803  37% /boot

    ```

    ```


    This example shows seven partitions and one virtual filesystem (udev, mounted
    at /dev). Pay particular attention to the partitions'' sizes (the `1K-blocks`
    column, which shows the file-system sizes in kilobytes) and to how full each partition
    is (the `Use%` column). The partition device names in the first column are unimportant
    for your purposes, but the mount points in the final column are important. Figure
    5.1 shows the filesystems from this example (except for /dev, which isn''t a disk
    filesystem) in graphical form, which should help you visualize how they''re organized.


    **FIGURE 5.1** Linux enables you to access partitions as directories in its directory
    tree.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_217_0.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Ideally, you should review at least two or three computers that will be similar
    to the one you''re building. This should give you an idea of the range of partitioning
    schemes and the sizes of the partitions. One complication is the fact that partition
    layouts can differ substantially from one computer to another. For instance, you
    might find a layout like the one shown here on one computer but another computer
    might not split /usr off from the root partition. This can make estimating the
    amount of space in each directory tree difficult. The du command, used in conjunction
    with its -S option, can be a handy stand-in:


    ```

    ```

    # du -S /usr

    6032044 /usr

    ```

    ```


    This command displays the disk space consumed in the /usr directory tree (5.8GB),
    including all partitions mounted in that tree (such as /usr/portage and /usr/local
    in the preceding example). Although you can issue this command as an ordinary
    user, doing so is likely to produce an underestimate for some directory trees
    since ordinary users may not be able to read all the directories in a given directory
    tree. Because du scans every file in the directory tree to arrive at its estimate
    of disk use, the command can take several minutes to execute if the directory
    tree you specify holds lots of files.


    Using du in this way is most likely to be helpful if you''ve already got an idea
    about how you want to partition a disk-for instance, if you know you want to split
    /usr off into its own partition.


    # ### Estimating Disk Space Requirements


    To estimate disk space requirements, I recommend you begin with a fundamental
    split between system data and user data. System data includes program files, system
    configuration files, the package system database, and so on. Most system data
    is installed via your package management system, although it also includes locally
    compiled programs (typically stored in /usr/local) and a few other odds and ends.
    This contrasts with user data, most of which resides in the /home directory. Some
    systems place a great deal of user data in other locations, though. For instance,
    a system that functions as a mail server is likely to have significant user data
    in the form of mail spools, which might reside in /var/spool/mail. To proceed,
    you''ll need to know where most of your user data will reside and how much user
    data the system will hold.


    If the system you''re creating should be similar to one you''ve reviewed as an
    example, you could use the example system''s partition layout and sizes as a model.
    You might need to make adjustments if a partition seems squeezed for size or if
    you know you''ll have need for more or less disk space. Your estimate of user
    data needs may require a change, particularly if the two systems will be dissimilar
    in this respect but similar in terms of installed software, and hence system data
    needs.


    Once you''ve estimated your user and system data needs, you can begin planning
    how much disk space to allocate to each. In the preceding example, the root partition,
    /usr, and /boot hold system data, while /home and /var hold user data. This gives
    estimates of about 6.1GB required for system data and 11.4GB for user data. The
    120GB disk specified in the Scenario is more than big enough to hold all of this
    data. Of course, you''re not reproducing this example system exactly, so you should
    adjust your estimates accordingly. For instance, if the new system will have software
    similar to the first one, but if users will be storing huge multimedia files,
    you might plan to devote huge portions of the disk to user data.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Planning Your Partitions


    At this point, you can begin planning how to create specific partitions. You can
    create partitions to hold files at any location in the directory tree you like,
    with a few exceptions. The /etc, /bin, /sbin, and /lib directories should never
    be split off onto their own partitions; they should always reside on the root
    partition. The /dev and /proc filesystems are usually handled by their own special
    virtual filesystem drivers, although until recently /dev was usually an ordinary
    directory on the root partition. These filesystems are normally set up when you
    install Linux, so you shouldn’t need to deal with them explicitly.


    If you’re new to Linux administration and have no compelling reason to do otherwise,
    I recommend using a simple partitioning scheme:


    /home This partition is worth splitting off because it’s relatively easy for new
    administrators to estimate its size and because it’s often helpful to keep user
    data separate from system data.


    /usr This partition is one of two system data partitions that might reasonably
    be split off by new administrators. It holds most program files and so should
    be the largest of the system data partitions—much larger even than the root filesystem
    in most cases. (Some distributions place significant files in /opt, though, so
    be aware of that fact.)


    /boot On older computers, a separate /boot partition can be handy because you
    can place that partition where the boot loader will be able to access it using
    the old Basic Input/Output System (BIOS) calls. Newer BIOSes are less restrictive,
    though.


    Further subdivisions are generally infeasible because your experience might not
    be sufficient to tell you how much disk space needs will fluctuate. Installing
    new software, upgrading existing software, temporary disk space requirements associated
    with building software, temporary and permanent disk space demands by users, and
    so on all place demands for space in specific directories. If you create many
    partitions, each one will have less free space than would be the case with fewer
    partitions, so you’ll be more likely to run out of disk space.


    If you’re a more experienced administrator or if you have a compelling reason
    to do so, you can further subdivide your system. Popular additional partition
    splits include the following:


    /tmp This directory holds temporary files. Some administrators like to keep it
    as a separate partition so that if a runaway process creates ridiculously large
    temporary files, this fact won’t cause disk space problems in more critical directories.


    /var This directory holds miscellaneous temporary and user files, including spool
    directories and package databases. It’s most often split off as a separate partition
    on systems that function as servers in which /var holds significant quantities
    of files.


    /usr/local If you build significant numbers of programs locally and install them
    in this directory, keeping it as a separate filesystem can be beneficial. You
    can wipe out your regular system partitions and re-install Linux from scratch
    while leaving your locally compiled software untouched.


    /usr/portage This directory is important on Gentoo systems but not on others.
    It holds files related to the Gentoo package system, and keeping it as a separate
    partition enables you to more easily monitor its disk use, but at the cost of
    an increased risk of running out of disk space.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '/opt   Commercial packages often install in /opt, and some distributions place
    KDE or other big open source packages there as well. Using a separate partition
    is useful for the same reason that keeping /usr/local1 separate is useful.


    Site-specific partitions   You may create site-specific directories. For instance,
    you might create a directory tree to hold Web pages on a Web server. If such a
    directory holds a significant number of files, separating the partition may be
    worth considering.


    Once you have a list of partitions, you should go back to your disk space estimates
    and assign each one a size. If you know how much space each will take, double
    each estimate. This will give you room for growth and slack space in case you
    underestimate your disk space.


    You can now add up your disk space estimates and see how they compare to your
    available disk space (120GB). If your estimates exceed your available disk space,
    you can either cut back on your estimates or plan to buy a second disk or a bigger
    disk. Buying more disk space is almost always the better idea, although if you
    went overboard on your disk space estimates, revising them may be reasonable.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_220_0.png)


    Disk manufacturers define *gigabyte* as 1,000,000,000 (109) bytes, but most disk
    utilities define it as 1,073,741,824 (230) bytes. Between this fact and the overhead
    required when creating partitions and file systems, you can find a rude shock
    when you discover that your disk holds less data than you anticipated. Be sure
    to take these differences into consideration when computing disk space.


    Before proceeding further, add another partition for swap space. A good size for
    a Linux swap partition is about twice the size of your computer''s RAM. If you''re
    adding a second disk and the first one already has an adequate swap partition,
    you needn''t add another. You should also remember space for non-Linux partitions
    if your system dual-boots between Linux and another OS.


    If your disk space estimates are significantly below your available disk space,
    you can begin increasing your allocations to match available disk space. (You
    can safely exclude your swap partition from this procedure.) One approach is simply
    to increase each partition''s size proportionately. This approach is simple, but
    you''ll likely end up with huge amounts of space you''ll never use in partitions
    such as /boot (if you use this partition). Another approach is to increase partitions''
    sizes based on your estimate of which ones are most likely to hold more or bigger
    files in the future. As a general rule, /home is a good candidate for big increases
    in size. Others depend on the use to which the computer is put--/var might be
    a good candidate in some cases, /usr/local in others, and so on. A third approach,
    and one that''s the most flexible, is to leave some or all of the extra space
    unallocated. If you run into problems with a partition being too small in the
    future, you can then allocate some or all of the extra space to a new partition,
    move files from a single directory tree in the affected partition to the new partition,
    and then mount the new partition at the *appropriate* location. You might end
    up with an odd separate partition, such as /usr/lib or /var/www, but at least
    your partitions will be reasonably sized.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'For x86 systems, you should decide which partitions will be primary partitions
    and which ones will be logical partitions. As a general rule, it’s best to keep
    as few primary partitions as possible. Typically, *either* the root filesystem
    or /*boot* as a primary partition and everything else as logical partitions in
    a single extended partition works well. This approach gives you the option of
    more easily creating primary partitions in the future, if this becomes necessary—say,
    to support a dual-boot between Linux and Windows or FreeBSD.


    # ## Criteria for Completion


    To complete this task, you should have a plan for how to partition your disk,
    including partition sizes and planned mount points for each partition. Your plan
    should include the Linux filesystems, Linux swap space, and possibly space for
    non-Linux OSs. If your disk is big enough, you might include some unallocated
    space. With your written partitioning scheme in hand, you can proceed to actually
    creating these partitions using *fdisk* or your Linux distribution’s installation
    program.


    # # Task 5.2: Use *fdisk* to Create Partitions


    Linux’s traditional tool for creating, deleting, and otherwise manipulating hard
    disk partitions is known as *fdisk*. This program is named after the DOS and Windows
    FDISK tool, but Linux’s *fdisk* isn’t a clone of the DOS/Windows FDISK. Being
    able to manipulate your disk partitions with *fdisk* (or a similar tool) is necessary
    when you add a disk to a system, and perhaps when you install Linux. (Most distributions
    provide other tools for partitioning the disk during installation.)


    > **NOTE** GNU Parted (http://www.gnu.org/software/parted/) is an alternative
    disk partitioning program that’s growing in popularity. It includes support for
    operations such as moving and resizing partitions, which *fdisk* lacks.


    > **NOTE** Hard disks are ordinarily partitioned, as are many removable disks,
    such as Zip disks. Floppy disks, CD-R discs, and some other removable disks (such
    as magneto-optical disks) are not normally partitioned.


    # ## Scenario


    You need to expand the disk space in two computers. You’ve replaced the disk in
    one computer with a larger disk, and now you want to use the first computer’s
    disk to expand the'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'second computer''s disk space. You plan to use the new disk to house the /home2
    partition (which will hold new users'' home directories) and to expand the computer''s
    swap space. Therefore, you need to delete the existing partitions from this disk
    and create two new partitions, one to hold the new filesystem and one for the
    swap space.


    # ## Scope of Task


    This task covers using fdisk to view an existing partition table, delete existing
    partitions, and create new partitions. These tasks are potentially dangerous,
    but they can be performed quickly.


    # ## Duration


    This task should take about half an hour to complete. Once you''re familiar with
    the operation of fdisk, making changes should take just a minute or two. The operations
    surrounding such changes are likely to take far more time, though. Physically
    installing hard disks, creating file-systems, backing up or moving data, and so
    on are likely to require several minutes to over an hour. This task is focused
    simply on the partition manipulations, though.


    # ## Setup


    Prior to performing this task, you should install a hard disk whose existing partitions
    you can safely delete—perhaps an old disk that you no longer use. You must have
    root access to your computer to perform this task, so you should log in and acquire
    root privileges. Check that you can access the new disk.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_222_0.png)


    # ## Caveats


    Modifying partition tables is extremely dangerous. If you make a mistake, you
    can easily wipe out your entire Linux installation. Thus, you should exercise
    extreme care in performing this task. Check, double-check, and triple-check every
    action. If you''re in any doubt, back out of the operation. Once you''re using
    fdisk, type q to quit from the program without writing your changes.


    # ## Procedure


    This task involves three main sub-tasks: examining existing partitions, deleting
    existing partitions, and creating a new partition. I also briefly describe some
    of the other fdisk options.'
