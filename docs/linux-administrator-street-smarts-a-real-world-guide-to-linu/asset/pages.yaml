- pgno: 209
  md: 'Task 4.5: Use Online Documentation 183


    # Task 4.5: Use Online Documentation


    Most Linux systems install large amounts of documentation, but even more information
    is avail-able on the Internet at large. Knowing what online sites are useful and
    how to search for docu-mentation online will help you maintain your reputation
    as a street-smart Linux administrator.


    # Scenario


    You’re configuring a Linux workstation to be used primarily for word processing.
    The indi-vidual who will be using this system wants to have a wide variety of
    fonts available, and you’ve bought a commercial font CD-ROM with a suitable selection.
    You have no idea how to install these fonts, though. To learn, you must consult
    online documentation.


    # Scope of Task


    To perform this task, you must locate and read online documentation concerning
    font instal-lation in Linux. This task is fairly open-ended, but a small number
    of resources will probably net a good deal of information in a short period of
    time.


    # Duration


    You should be able to complete this task in half an hour or an hour; however,
    as just noted, this task is fairly open-ended. You can spend hours reading about
    Linux fonts (or most other Linux topics) on the Internet. On the other end of
    the scale, if you’re lucky or have a specific enough query with a well-known answer,
    you may find that answer in a matter of just a few minutes.


    # Setup


    This task requires that you have access to a computer with Internet access. If
    you use a Linux computer, you can log in as an ordinary user; **root** access
    is not required to perform this task. (You might need **root** access to actually
    install fonts, though.) Chances are you’ll want to use a GUI Web browser, so you
    should log in using a GUI session or type **startx** once you’ve logged into a
    text-mode session.


    # Caveats


    Reading online documentation poses few risks aside from the risk that you might
    find incor-rect information on the Internet. Internet information resources vary
    in quality even more than does Linux system documentation.


    # Procedure


    To begin this task, you’ll look at one of the most important online Linux documentation
    sources, the Linux Documentation Project (LDP; http://tldp.org). The LDP isn’t
    the only source of online information, though, so I describe several others as
    well.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# ## The Linux Documentation Project


    The LDP is dedicated to providing more tutorial information than is commonly provided
    by `man pages`. You''ll find several types of information at this site:


    **HOWTOs** Linux HOWTO documents are short and medium-length tutorial pieces intended
    to get you up to speed with a topic or technology. In the past, smaller HOWTOs
    were classified separately, as mini-HOWTOs; however, the distinction between the
    two types of document has diminished greatly in recent years. HOWTOs have varying
    focus—some describe particular programs, whereas others are more task oriented
    and cover a variety of tools in service to the task. As the name implies, they''re
    generally designed to tell you how to accomplish some task. Perusing the HOWTO
    index reveals that the Linux Font HOWTO (`http://tldp.org/HOWTO/Font-HOWTO/index.html`)
    is likely to be relevant to your goal.


    **Guides** Guides are longer documents, often described as book length. (In fact,
    some of them are available in printed form.) Guides are intended as thorough tutorial
    or reference works on large programs or general technologies, such as Linux networking
    as a whole. As I write this, no guides directly address the issue of fonts in
    Linux.


    **FAQs** A *frequently asked question* (FAQ) is, as the name implies, a question
    that comes up often—or more precisely, in the sense of the LDP category, a question
    and an answer to it. LDP FAQs are organized into categories, such as the F2F FAQ
    and the WordPerfect on Linux FAQ. Each contains multiple questions and their answers,
    often grouped in subcategories. If you have a specific question about a program
    or technology, an appropriate FAQ can be a good place to look first for an answer.
    As I write this, no FAQ is devoted exclusively to fonts; however, some FAQs, such
    as the WordPerfect on Linux FAQ and the WINE FAQ, provide at least some information
    on fonts within the FAQs'' topic areas.


    LDP documents vary greatly in their thoroughness and quality. Some (particularly
    some of the guides) are incomplete; you can click on a section heading and see
    an empty page or a comment that the text has yet to be written. Some LDP documents
    are very recent, but others are outdated, so be sure to check the date of any
    document before you begin reading—if you don''t, you might end up doing something
    the hard way, or in a way that no longer works. Despite these flaws, the LDP can
    an excellent resource for learning about specific programs or about Linux generally.
    The better LDP documents are excellent, and even those of marginal quality often
    present information that''s not obvious from `man` pages, `info` pages, or official
    program documentation.


    **NOTE** Most Linux distributions include the LDP documents in one or more special
    documentation packages. Check your distribution''s package list to locate them.
    If you have fast always-up Internet access, though, you might want to use the
    online versions of LDP documents because you can be sure they''re the latest available.
    Those that ship with a distribution can be weeks or months out-of-date by the
    time you read them.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Additional Online Help Resources


    Several additional online resources exist to provide documentation and help. Each
    of these sources has its own unique strengths and weaknesses:


    +   - **Program Web pages** Most Linux programs have associated Web pages, and
    these Web pages frequently include documentation. This resource is particularly
    helpful if you want to evaluate competing products or read up on one before installing
    it. Program information included in package files often points you to a program’s
    Web page. For instance, type `rpm -qpi packagename.rpm` to find information on
    `packagename` in an RPM system. Because fonts aren’t programs and most font foundries
    barely know that Linux exists, you’re unlikely to find font information in this
    way; however, you might locate a Linux fonts Web page in a Web search, as described
    shortly.


    +   - **Vendor Web pages** Companies often provide Linux information on their
    Web pages. These are usually identical to the program Web pages just described
    in the case of commercial programs, but sometimes they’re not. For instance, you
    might be able to locate Linux information relating to a video card or printer
    on the manufacturer’s Web site. Also, don’t forget your distribution maintainer’s
    Web site. These are particularly useful when dealing with distribution-specific
    issues.


    +   - **Web searches** Random Web sites often host useful information, but the
    trick is in locating them. You can use search engines such as Google (`http://www.google.com`)
    and Yahoo! (`http://www.yahoo.com`) to search the Web for keywords you specify.
    With luck, this will turn up a helpful Web site. Searching on *Linux fonts* on
    Google turns up over 27 million hits. The first page of his alone includes several
    tutorials and informational articles, including the Linux Font HOWTO.


    +   - **Web forums** A Web forum is a Web site that enables people to post messages
    to it. Many distributions support Web forums in which users discuss issues related
    to the distribution. These forums can be very useful resources and are often the
    first place you’ll see new problems discussed, as well as fixes for those problems.
    If you don’t know of any Web forums for your program or topic, you might locate
    one via a Web search or another resource, such as a vendor’s Web page.


    +   - **Usenet newsgroups** Usenet news is a forum that’s similar in concept to
    a Web forum, but Usenet was around long before Web forums. Usenet posts are similar
    to e-mail messages in many ways except that they’re public. Most ISPs and organizations
    such as universities maintain Usenet news servers, and you as an individual can
    access these using Linux programs like `tin` (`http://www.tin.org` or Pan (`http://pan.reblebase.com`).
    The Google Groups Web site (`http://groups.google.com`) maintains a database of
    newsgroup postings, so you can search for help in the form of previous queries
    about your problem. You should probably do this before posting a new cry for help;
    a quick search often turns up an answer much more quickly than does a new posting.
    Usenet is the most open of the major forum systems, which unfortunately means
    that it attracts more in the way of verbally abusive posts and off-topic discussions.
    Although there’s no Linux fonts group, queries about Linux fonts would be reasonable
    in the `comp.fonts` newsgroup or in some Linux-specific groups, such as `comp.os.linux.setup`
    or `comp.os.linux.x`.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '**Mailing lists** Mailing lists are similar to Web forums and Usenet newsgroups
    except that discussions are carried out via email messages. (In fact, some forums
    are carried in multiple forms, so you can choose which you prefer.) Check vendor
    Web sites, distribution Web sites, and the Web sites for specific programs for
    information on mailing lists related to the product in question.


    **IRC** *Internet Relay Chat (IRC)* is a system for real-time interactions with
    other users. It’s similar to the instant messaging systems that are also quite
    popular, but IRC involves public discussions. To use IRC, you must install an
    IRC client, such as Xchat (http://www.xchat.org). You then point the client to
    an IRC server, which links with other servers in an IRC network, and join an IRC
    channel (which is a specific discussion forum, similar to a Usenet newsgroup).
    Check http://www.irchelp.org/irchelp/networks/ for information on IRC networks.


    By taking advantage of any or all of these resources, you can learn a great deal
    about Linux in a short period of time or solve almost any Linux problem. Not all
    resources are appropriate for solving all problems, though.


    > Even if you don’t make extensive use of any given information resource, you
    should at least take some time to familiarize yourself with the *type* of information
    to be found in each of these sources. Knowing what information a resource can
    provide can be very valuable if and when you need to locate that type of information.


    # ## Criteria for Completion


    To complete this task, you should read some online documentation concerning Linux
    fonts. The Font HOWTO document is particularly likely to be helpful, but you might
    also obtain useful information via a Web search or by other means. The open-ended
    nature of this task means that there’s no fixed stopping point; you can read for
    a few minutes or a few days.'
  merge: -1
  img_proc: true
