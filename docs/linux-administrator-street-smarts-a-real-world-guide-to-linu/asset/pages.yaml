    # # Task 2.5: Configure Disk Devices


    Disk input/output is at the heart of a Linux system. Everyday operations—launching
    programs, saving files, and so on—entail reading from and writing to disks. Thus,
    your hard disk configuration is a major factor in your overall system performance
    and stability.


    Task 2.2 described how to learn some of the basics of your hard disk configuration.
    Phase 5 covers high-level hard disk *configuration*—partitioning and preparing
    filesystems. This task covers low-level hard disk identification and tuning procedures.


    # ## Scenari o


    You''re preparing a new computer that''s to function as a file server on your
    local network. In order to provide the best performance, you want to check the
    hard disk configuration and, if necessary, tweak it to improve its speed.


    # ## Scope of Task


    This task involves running a few utilities to verify the presence of particular
    types of disk hardware and to check your hard disk performance. You may also want
    to run programs to improve disk performance and modify boot files to make these
    changes persistent across reboots.'
