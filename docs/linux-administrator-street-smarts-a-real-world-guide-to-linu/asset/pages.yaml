- pgno: 125
  md: 'In this example, X is instructed to try 1280×1024, 1024×768, 800×600, and 640×480
    displays, in that order. If X’s mode lines (specified by the ModelLine entries
    in the Monitor section or as obtained from the monitor itself, HorizSync, and
    VertRefresh entries don’t permit use of a particular resolution, X ignores it
    and tries the next one in the list. The Virtual line tells X to create a virtual
    display as large as the specified size. For instance, if X can only manage a 1024×768
    display, that display will act like a panning window onto a larger 1280×1024 display.
    The display will pan when you move your mouse close to the edge of the physical
    display.


    In addition to the Screen section, you should examine the ServerLayout section.
    This section ties together one or more Screen sections and one or more InputDevice
    sections. Depending upon how you made your changes, you might or might not need
    to adjust this section.


    # ### Testing Your Changes


    Once you’ve saved the changes to your X configuration file, you can test them.
    One way to do this is to type startx at a text-mode command prompt. (You can do
    this as an ordinary user.) X should start up and you should be able to use your
    new mouse, video card, and monitor. If X fails to start, examine the error messages
    it displays. If you’re lucky, you’ll immediately spot a typo or other simple error
    you can fix. If you’re less lucky, you might need to spend time fiddling with
    the Modes line in your Screen section’s Display subsection, reading documentation
    on your video driver, or otherwise troubleshooting the problem.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_125_0.png)


    Starting X via the startx command may start up a different window manager or desktop
    environment than you see when you log in via a GUI login prompt. If this happens,
    don’t worry; just read on...


    Once you’re sure your new configuration is working, you can bring it up, normally.
    If your system normally presents a GUI login prompt, rebooting will bring it up,
    or you can read Task 2.9, “Manage X Logins,” to learn how to start, stop, and
    reconfigure the GUI login tool.


    # ## Criteria for Completion


    This task involves changing hardware and modifying your X configuration. To complete
    the entire task, you should have swapped out your computer’s video card, monitor,
    and mouse and gotten a working system using the new hardware. If you don’t have
    access to replacement hardware, you should at least have read the description
    of what to do and become familiar with the X configuration file generally.


    # # Task 2.9: Manage X Logins


    The X Display Manager Control Protocol (XDMCP) is the tool that Linux uses to
    provide GUI logins. Most distributions use the X Display Manager (XDM), the KDE
    Display Manager (KDM), or the GNOME Display Manager (GDM) as XDMCP servers, and
    the default configurations are reasonable ones for workstations. Sometimes, though,
    you need to modify'
  merge: -1
  img_proc: true
