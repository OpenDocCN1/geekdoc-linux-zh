- pgno: 231
  md: '# Task 5.3: Create Filesystems


    When choosing a filesystem, be sure to check on your distribution’s filesystem
    support. Although you can compile support for any Linux native filesystem yourself
    and install its support tools, not all distributions support all Linux native
    filesystems in their default configurations. JFS and XFS are the most often omitted
    filesystems, but sometimes even ReiserFS isn’t supported. Ext3fs is supported
    by all but very old Linux distributions, and ext2fs is supported by everything
    but truly ancient (early 1990s) distributions.


    You can use multiple filesystems on a single Linux system. For instance, you might
    use ext2fs on a small */boot* partition and ReiserFS on other partitions. Using
    multiple filesystems enables you to tune the filesystem to the needs of the partition,
    but it does add some overhead in kernel memory requirements.


    In addition to its native filesystems, Linux supports a large number of non-native
    and specialized filesystems. These filesystems lack certain features that Linux
    requires in its native filesystems, such as support for Unix-style ownership and
    permissions, or they don’t perform reliably enough to be used as native filesystems.
    Examples of these filesystems appear in Table 5.1. Although you won’t create and
    use any of these filesystems for Linux-only use on your hard disk, you should
    be aware of their existence in case you need to install Linux on a dual-boot system
    or create or read removable media that should be readable on non-Linux systems.


    # TABLE 5.1 Common Non-Linux Filesystems


    | Filesystem Name | Linux Filesystem Type Code | Native OS or Use |

    | --- | --- | --- |

    | File Allocation Table (FAT) | msdos, umsdos, or vfat, depending on feature set
    | DOS, Windows, and OS/2; useful for cross-platform removable disks. |

    | New Technology File System (NTFS) | ntfs | Windows NT/200x/XP. |

    | High-Performance File System (HPFS) | hpfs | OS/2 and early versions of Windows
    NT. |

    | Hierarchical File System (HFS) | hfs | MacOS. |

    | Extended Hierarchical File System (HFS+) | hfsp1us | MacOS. |

    | Minix Filesystem | minix | Minix; early versions of Linux (but too limited for
    serious modern Linux use except on floppies). |

    | Unix File System (UFS) | ufs | Several Unix and Unix-like OSs; limited in Linux
    mainly by poor write support. |'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# TABLE 5.1 Common Non-Linux Filesystems (continued)


    | Filesystem Name | Linux Filesystem Type Code | Native OS or Use |

    |---|---|---|

    | ISO-9660 | iso9660 | CD-ROMs and similar media; Linux includes Joliet and Rock
    Ridge support for long file-names and Unix-style permissions and ownership. |

    | Universal Disc Format (UDF) | udf | DVDs and read/write optical media. |


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_232_0.png)


    > Linux can create many, but not all, of the filesystems described in Table 5.1.
    To create an ISO-9660 or UDF filesystem, you''d ordinarily use the `mkiso fs`
    utility, which creates a disk file that holds an image of the filesystem and all
    the files it''s to contain. You can then write that image file to a CD-R or similar
    disc using `cdrecord`. Various GUI tools, such as X-CD-Roast and ERoaster, provide
    point-and-click interfaces to this process.


    In addition to disk-based filesystems, Linux supports various filesystems that
    provide access to files on other computers. The most important of these are the
    Network File System (NFS) and the Server Message Block/Common Internet File System
    (SMB/CIFS). NFS is most often used between Linux and Unix systems, whereas SMB/CIFS
    is used on DOS and Windows networks. You don''t create an NFS or SMB/CIFS filesystem
    on your disk, though; instead, these filesystems are network protocols that give
    remote access to ext2s, ReiserFS, FAT, ISO-9660, or any other disk filesystem.
    You can use the nfs filesystem type code with a `mount` command to mount an NFS
    export or use the smbfs or cifs type code to mount an SMB/CIFS share.


    # Creating a Filesystem


    To create a filesystem, you use the `mksfs` tool, to which you pass the filesystem
    type code using the `-t` option and the device file for the partition or disk
    that should hold the filesystem:


    ```

    `# mksfs -t ext3 /dev/sda1`

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_232_1.png)


    > Remember to check, double-check, and triple-check your command! You do not want
    to enter the wrong device filename! If you accidentally omit the partition number
    (as in `/dev/sda` rather than `/dev/sda1`), you''ll create a filesystem on the
    entire disk, wiping out all the disk''s partitions.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'The output of the `mkfs` command varies depending on the file system you''ve
    selected. The file system creation process typically takes just a few seconds,
    although this varies depending on the size and speed of the disk, the file system
    in question, and other factors.


    In reality, `mkfs` is just a front end to file system-specific tools, most of
    which use the name `mkfs.file system`, where `file system` is the file system
    name, such as `ext3` or `jfs`. The `mke2fs`, `mkext3fs`, `mkreiserfs`, and `mkdosfs`
    programs are additional names for creating `ext2fs`, `ext3fs`, ReiserFS, and FAT
    file systems, respectively.


    Once you''ve created a file system, you should check it by mounting it, as described
    in Task 5.4. You can then verify its size using `df` and be sure that you can
    write files to the disk and read them back.


    # ### Creating Swap Space


    Swap space enables your computer to treat disk space as if it were RAM—slow RAM,
    but memory in which active data can reside when real RAM is insufficient. For
    it to do so, though, you must first prepare a disk file or partition to be used
    as swap space. You do this with the `mkswap` command:


    ```

    ```bash

    # mkswap /dev/sda5

    ```

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_233_0.png)


    > As with the `mkfs` command, `mkswap` is potentially extremely destructive. Review
    the command carefully to be sure you''ve specified the correct disk and partition.


    Another option for swap space is to use an ordinary disk file. You can create
    a disk file of any size using `dd`:


    ```

    ```bash

    # dd if=/dev/zero of=/swap bs=1048576 count=500

    ```

    ```


    This example creates a file in the root directory, called `/swap`, that''s 500MB
    in size (500 units of 1,048,576 bytes each). Of course, in practice you''d put
    the file wherever you have available disk space. In any event, you can then prepare
    it much as you''d prepare a swap partition:


    ```

    ```bash

    # mkswap /swap

    ```

    ```


    To verify that your swap space is properly configured, you can test it by first
    using `free` to examine the amount of available swap space, then using `swapon`
    to activate the swap space, and then using `free` again:


    ```

    ```bash

    # free

    ```

    ```


    | |total|used|free|shared|buffers|cached|

    |---|---|---|---|---|---|---|

    |Mem:|512052|505548|6504|0|63064|106176|

    |~/+ buffers/cache:|336308|175744||| |||

    |Swap:|1261560|276004|985556||||


    ```

    ```bash

    # swapon /dev/sda5

    ```

    ```'
