    # ## Testing Disk Performance


    Now that you know what your hard disks are, you can test their performance. You
    can do this with the hdparm utility, which includes two performance-testing options:
    -t tests raw disk input/output speed and -T tests cached disk input/output speed.
    The latter test is effectively a test of your system''s memory (RAM) performance,
    but if you use both options, hdparm includes a correction factor for memory performance
    when reporting the non-cached results, improving accuracy. You can test either
    ATA or SCSI disk performance using this command:


    ```

    `# hdparm -tT /dev/hdb


    /dev/hdb:

    Timing cached reads: 932 MB in 2.01 seconds = 463.37 MB/sec

    Timing buffered disk reads: 120 MB in 3.03 seconds = 39.60 MB/sec`

    ```'
