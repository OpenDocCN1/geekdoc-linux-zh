  md: '# Duration


    This task should take about half an hour to complete. A single run of `fsck` can
    take anywhere from a few seconds to many minutes (perhaps even over an hour),
    depending on the size of the filesystem, the speed of the disk, the number of
    files stored on the filesystem, and so on.


    # Setup


    You should have access to the disk you prepared in Tasks 5.2 and 5.3 or to some
    other convenient partition that''s not required for system operation. (If necessary,
    you can create a filesystem on a floppy disk and use it to complete this task.)
