  md: 'details. In fact, you can do just about all of your package maintenance using
    the **yum** command rather than the **rpm** command. Yum still relies on RPM to
    do its “dirty work,” though, and sometimes using **rpm** is necessary. For instance,
    if you want to install a package that you’ve obtained from a source other than
    a Yum repository, you must use **rpm** or some other derivative tool, such as
    a GUI front end to **rpm**.


    One potential problem with Yum is that it downloads packages to your hard disk
    and then installs them, but it doesn’t automatically delete packages. To ensure
    that your hard disk doesn’t fill up with package files you no longer need, type
    **yum clean packages** from time to time. This command removes the package files
    on a one-time basis.


    # ## Criteria for Completion


    To complete this task, you should have performed five types of package maintenance
    tasks with RPM: removing packages, upgrading packages, installing packages, querying
    packages, and verifying packages. You should also have used Yum to check for package
    updates from a Yum repository and optionally to update some or all of your system’s
    packages.


    # # Task 3.2: Use Debian Packages


    Debian packages are conceptually similar to RPM packages, but the two package
    types aren’t interchangeable. You can perform the same basic types of operation
    with both packaging systems—installing packages, updating packages, uninstalling
    packages, and so on. To use Debian packages, you’ll use the **dpkg** command to
    operate on specific package files or packages. The Debian Advanced Package Tools
    (APT) suite provides network-centric package retrieval and updating features similar
    to those of Yum.


    # ## Scenario


    A Debian system you’re administering requires several package changes:


    +   - To minimize security risks, you plan to remove the **vsftpd** (FTP server)
    package, which isn’t needed on this computer.

    +   - You need to upgrade the **apt** package to the latest version, **0.6.44.2**.

    +   - You want to install the Z Shell (**zsh**) package, which isn’t currently
    installed.

    +   - You’re not sure what the **xpdf-reader** package does, so you want to query
    it.

    +   - You want to check for, and possibly install, system updates from an archive
    site.


    > **Note**

    > In practice, your system is unlikely to be configured with precisely the installed
    packages implied by this list. Feel free to substitute other packages for those
    listed here as you follow along on your own system.'
