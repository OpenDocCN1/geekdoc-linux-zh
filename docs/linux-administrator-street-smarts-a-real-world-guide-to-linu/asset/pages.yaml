- pgno: 253
  md: '+   3. Modify the name (`title`) of one of the stanzas to reflect the new kernel
    name. You can use any name you like, but it’s typical to use a moderately long
    and descriptive name.


    +   4. Adjust the `kernel` line in the new kernel’s stanza to point to the new
    kernel file. Note that the kernel file reference is relative to the GRUB root
    directory, which is specified by the `root` option. This will be the Linux root
    (/) directory unless you have a separate `/boot` partition, in which case the
    GRUB root directory is the Linux `/boot` directory. In Listing 5.3, the kernel
    is specified without the `/boot` directory name, so the system presumably uses
    a separate `/boot` partition.


    +   5. If you want to make the new kernel the default, change the `default` line
    to point to the new kernel. GRUB numbers its stanzas starting with 0.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_253_0.png)


    > It’s generally best to hold off on making the new kernel the default until you’ve
    tested it. If you make this change too early and then can’t get around to fixing
    problems with the new kernel for a while, you might find yourself accidentally
    booting the bad kernel. This is normally a minor nuisance.


    +   6. Save your GRUB configuration file changes.


    There’s no need to re-install your MBR code in the way you do with LIL0. The existing
    GRUB MBR code should find your GRUB configuration file changes and implement them.
    If your GRUB installation is damaged and you’ve booted using an emergency disk,
    however, you can re-install GRUB using the `grub-install` command:


    ```

    # grub-install (hd0)

    ```


    This command installs the GRUB MBR code to the MBR of the first disk, `(hd0)`—normally
    `/dev/hda` or `/dev/sda`. If your setup is odd or complex, you may need to use
    the interactive grub utility instead. Consult its `info` page for details.


    # Testing Your Changes


    At this point, you should be able to test your changes. Shut down and reboot your
    computer. You should see your new kernel appear as a menu option (or as an option
    you can type at a `lilo:` or `boot:` prompt; in the case of simpler LIL0 configurations).
    Selecting this option should boot you into your new kernel. Once you’ve booted
    and logged in, type `uname -a`. This command produces a line or two of output
    summarizing various system information, including the kernel version number. Verify
    that the kernel version number matches what you expect. If it doesn’t, review
    your boot loader configuration to be sure you remembered to change the kernel
    filename.


    If the kernel doesn’t boot, or if it begins to boot but then hangs before finishing,
    it’s possible that your boot loader configuration is incorrect. Reboot into your
    old kernel and check to be sure you didn’t introduce any typos, particularly in
    the `LIL0 root=` line or in the `GRUB root=` option on the `kernel` line. It’s
    also possible that your freshly compiled kernel is lacking a critical driver or
    filesystem. Remember that the kernel must be able to read your root (/) filesystem,'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'which means it needs drivers for your disk controller and the file system you
    used on your root partition. If necessary, go back to Phase 2, review your kernel
    configuration, and recompile it.


    If you’ve gotten everything working, then you may want to go back to the boot
    loader configuration procedures described earlier. For both LILO and GRUB, repeat
    the steps beginning with step 5 to make your new kernel the default. Thereafter,
    your system should boot into the new kernel. You might even want to delete or
    comment out old kernel configurations. This is particularly helpful if you upgrade
    your kernel regularly, to keep your boot loader configuration uncluttered.


    # ## Criteria for Completion


    To complete this task, you should have successfully added a new kernel (the one
    you compiled in Phase 2) to your boot loader’s configuration. This task requires
    you to identify which boot loader your system uses, modify its configuration file,
    re-install the MBR code (for LILO only), and test the configuration by rebooting
    into your new kernel.'
