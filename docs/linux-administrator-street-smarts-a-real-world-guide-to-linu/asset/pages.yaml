  md: 'entirely different from one another. Therefore, you must start by determining
    which boot loader your system uses. You can then proceed to modifying your installed
    boot loader. Whichever one you modify, you''ll conclude by rebooting your computer
    to test the new configuration.


    # ## Boot Loader Principles


    The LILO and GRUB boot loaders both consist of several components:


    +   * A small piece of code that resides in the MBR or boot sector of the boot
    partition. The BIOS runs this code when the system boots, and this code is then
    responsible for loading your kernel into memory and running it. For simplicity''s
    sake, I refer to this component as MBR code, even when it''s installed outside
    of the MBR.

    +   * Support files, including configuration files and ancillary code. The boot
    loader calls upon these files, either at boot time or when placing the code in
    the MBR, to perform tasks that are too complex for the simple MBR code to perform.

    +   * Linux utility programs. These programs place code in the MBR and otherwise
    configure the boot loader.


    When you install a LILO or GRUB package, you''re really installing the utility
    programs and at least some support files. Actually installing the MBR code requires
    running a utility program. In the case of LILO, you must do this every time you
    make a change to the boot loader configuration. In the case of GRUB, the MBR code
    doesn''t change once it''s installed; instead, you change configuration files
    that the MBR code reads (with the help of additional support files) at boot time.


    Boot loaders (that is, their MBR code) can reside either in the MBR or in the
    boot sector (that is, the first sector) of a disk partition or removable disk.
    If the MBR code resides in the MBR, it''s referred to as a primary boot loader.
    Generally speaking, this is the simplest and best configuration for a Linux-only
    system. If the MBR code resides outside of the MBR, in the boot sector of a bootable
    partition, then LILO or GRUB becomes a secondary boot loader. Another boot loader
    must then reside in the MBR. This primary boot loader is most often the simple
    boot loader that''s been used on x86 systems since the days of DOS. This approach
    has an advantage in dual-boot scenarios because DOS and Windows have a habit of
    overwriting the MBR code when they''re installed. Thus, if you install Linux and
    then install or upgrade Windows, LILO or GRUB can be wiped out. Putting your Linux
    boot loader in a partition keeps it safe and you can begin using it again by using
    DOS''s FDISK to mark the Linux boot partition as being bootable.


    The assumption in the rest of this task is that your Linux boot loader configuration
    works; you just need to add a new kernel to it. If your boot loader has stopped
    working, you might need to use DOS''s FDISK, as just noted, to mark a primary
    Linux partition as bootable, or you might need to use a Linux emergency disk to
    re-install LILO''s or GRUB''s MBR component.


    # ## Identifying Your Boot Loader


