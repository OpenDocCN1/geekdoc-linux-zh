    # Obtaining CUPS Printer Definitions


    Linux programs that print typically generate one of two types of files: plain
    text or PostScript. Linux printer queues typically recognize these two types of
    files, and perhaps some others such as common graphics file formats, and convert
    the printed file into a format that the printer can understand. Most commonly,
    the printer queue first converts non-PostScript to PostScript and then uses Ghostscript
    (`http://www.cs.wisc.edu/~ghost/`) to convert PostScript to a format that the
    printer can understand. (Of course, the Linux printing system bypasses Ghostscript
    when it uses a true PostScript printer.) To do all of this, you must install printer
    definitions, which tell the printer queue what PostScript options to use to convert
    PostScript into the desired format for your printer.


    The basic version of CUPS ships with support for just a few printers, including
    raw queues that do no processing and a few models from Hewlett-Packard, Epson,
    and Okidata. If you use another printer, you should obtain extra CUPS printer
    definitions. These definitions may consist of PostScript Printer Definition (PPD)
    files, appropriate behind-the-scenes “glue” to tell CUPS how to use them, and
    possibly Ghostscript driver files. These printer definitions can be obtained from
    several sources:


    **Your Linux distribution** Many distributions ship extra printer definitions
    in a package called `cups-drivers` or something similar, so check your distribution
    for such a package. In truth, this package is likely to be the Foomatic or Gutenprint
    package under another name.


    **Foomatic** The Linux Printing Web site hosts a set of utilities and printer
    definitions known collectively as Foomatic (`http://www.linuxprinting.org/foomatic.html`).
    These provide many additional printer definitions for CUPS (as well as for other
    printing systems).


    **Gutenprint** The Gnu Image Manipulation Program (GIMP) is a major Linux bitmap
    graphics program that supports its own printer drivers. These in turn have been
    spinned off into a package called Gutenprint (formerly GIMP Print), which can
    be integrated with CUPS to provide additional printer options. Check `http://gutenprint.sourceforge.net`
    for more information.


    **Your printer manufacturer** A few printer manufacturers make Linux printer definitions
    available for their printers. Sometimes these are open source definitions that
    they’ve repackaged, but sometimes the manufacturers have written their own Ghostscript
    drivers or definitions. Check your printer manufacturer for details.


    **ESP Print Pro** Easy Software Products (ESP) is the company that first developed
    CUPS. Although CUPS is open source, ESP offers a variety of printer definitions
    for CUPS for a price. See `http://www.easysw.com/printpro/` for more details.


    If you’re printing to one of the basic printers supported by the standard CUPS
    definitions, you may not need to add anything else. You might also find that your
    distribution has installed'
