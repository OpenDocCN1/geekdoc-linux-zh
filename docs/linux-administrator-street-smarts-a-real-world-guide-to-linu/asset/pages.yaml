- pgno: 140
  md: 'working with entirely different packages. Package management requires superuser
    access, so you should log in as an ordinary user and acquire root privileges.


    # ## Caveats


    The usual caveats concerning working as root apply. In addition, package management
    runs the risk that you’ll render parts of your system inoperable. In particular,
    mistakenly removing software that you need is an obvious risk. Upgrading software
    can cause problems if the new software contains new bugs or if its operation has
    changed in ways that are detrimental. On rare occasion, packages fail to properly
    flag configuration files and so upgrading the package can wipe out your configuration
    files. If you upgrade packages that use configuration files, be sure to back them
    up first. These risks are all magnified when doing whole-system updates, simply
    because such updates may upgrade many different packages in a single operation.


    # ## Procedure


    This task involves exercising various features of the rpm program, concluding
    with the network-enabled RPM wrapper Yum. The rpm program takes an operation (denoted
    by a single dash and a one-letter code or a double dash and a longer operation
    name), an arbitrary number of options (from zero upward) specified in a similar
    way, and a package name, a package filename, or an on-disk filename. Generally
    speaking, when you’re working with installed packages, you specify a package name,
    such as zsh. Package filenames are the names of the files in which uninstalled
    packages are stored. They can be anything but are conventionally the package name
    followed by version number and architecture information and the .rpm filename
    extension, as in zsh-4.2.5-1.2.2.i386.rpm. Sometimes you can use an on-disk filename,
    typically with the help of the -ffile (or -f) option. This can be handy if you
    want to discover what package owns a given file.


    # ### Deleting an Unused Package


    To delete a package, you use the --erase (or -e) option to rpm, which takes a
    package name as an option:


    ```

    ```

    # rpm -e vsftpd

    ```

    ```


    If the operation completes successfully, you’ll see no other messages. If you
    try to delete a package that’s not installed, rpm will tell you so. Similarly,
    rpm will complain if you try to delete a package that’s depended upon by other
    packages—for instance, if you try to delete a library package upon which program
    packages rely. If you see such a message, you have three choices:


    +   - Abandon the attempt to delete the package.

    +   - Delete the packages that depend upon the one you’re trying to delete. You
    can add their names to the command line to delete multiple packages at once. You’ll
    need to judge for yourself whether this action is reasonable.

    +   - Use the --nodeps option to tell rpm to ignore dependency problems. This
    option is not generally recommended because it can result in failures when you
    try to use the packages that depend upon the one you’re trying to remove.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# ## Upgrading an Existing Package


    To upgrade a package, you must either have a package file on your hard disk or
    have a complete URL to the package file on a server. You can find Fedora Core
    5 RPMs at various mirror sites; consult http://fedora.redhat.com/Download/mirrors.html
    for details. The base OS RPMs for x86 can be found in the 5/1386/os/Fedora/RPMS
    directory under the one listed on the mirrors page, while updated packages are
    in the updates/5/1386/ directory. (Substitute your platform’s CPU code for 1386
    if you’re not using the x86 distribution.)


    To upgrade the yum package, you can download the latest version (yum-2.6.1-0.fc5.noarch.rpm
    at the time of this writing) and install it from your hard disk:


    ```

    # rpm -Uvh yum-2.6.1-0.fc5.noarch.rpm

    ```


    The --upgrade (-U) option specifies an upgrade of an existing package, while the
    -vh (--verbose --hash) option tells rpm to display a progress bar as a series
    of hash marks (#). Instead of downloading the package, you can tell rpm to install
    directly from a network repository by placing the complete URL to the package
    in front of its filename, including an http:// or ftp:// specification for a Web
    or FTP site, respectively. This option can be a handy shortcut, but the extra
    typing can be tedious.


    No matter how you upgrade a package, rpm performs dependency checks. If an upgraded
    package includes additional dependencies, or depends upon newer versions of packages
    than you’ve got installed, rpm will complain and will refuse to proceed. Although
    you can overcome this problem with the --nodeps option, this is asking for trouble.
    Instead, you should cancel your upgrade plans or upgrade the dependencies first.


    As with deleting a package, you can list multiple packages for upgrade on a single
    command line. This is particularly handy when performing upgrades of a package
    and its dependencies; just list them all, in any order, and rpm will upgrade them
    all.


    # ## Installing a New Package


    You can install a new package much like you can upgrade an existing one, but you
    use the --install (-i) operation rather than --upgrade (-U):


    ```

    # rpm -ivh zsh-4.2.5-1.2.2.i386.rpm

    ```


    As with upgrades, you can install directly from an FTP or Web site by passing
    a complete URL in front of the RPM filename.


    Many administrators prefer to install software with the --upgrade (-U) operation;
    if this operation is fed a package filename for a package that isn’t already installed,
    rpm will install it without further comment, aside from its usual dependency checks.
    This can be handy because you needn’t know whether or not a package is already
    installed and you can mix upgrades and fresh installations on a single command
    line.


    # ## Querying a Package


    If you don’t know what a package does, you can use the --query (-q) operation,
    which takes a package name as an argument. For the operation to be useful, you’re
    likely to specify the'
  merge: -1
  img_proc: true
- pgno: 142
  md: '--info (-i) or --list (-l) options, which display general information on the
    package and a list of the files it contains, respectively. To find out what **xpdf**
    does, you’d use -i:


    ```

    # **rpm -qi** xpdf

    Name : xpdf Relocations: (not relocatable)

    Version : 3.01 Vendor: Red Hat, Inc.

    Release : 12.1 Build Date: Sun 12 Feb 2006

    \U0001d13d:32:24 PM EST

    Install Date: Tue 27 Jun 2006 06:57:45 PM EDT Build Host:

    \U0001d148:bcl-13.build.redhat.com

    Group : Applications/Publishing Source RPM: xpdf-3.01-12.1.src.rpm

    Size : 7758073 License: GPL

    Signature : DSA/SHA1, Mon 06 Mar 2006 04:21:30 PM EST, Key ID

    \U0001d148:4269d04f2a6fd2

    Packager : Red Hat, Inc. <http://bugzilla.redhat.com/bugzilla>

    URL : http://www.foolabs.com/xpdf/

    Summary : A PDF file viewer for the X Window System.

    Description :

    Xpdf is an X Window System based viewer for Portable Document Format (PDF) files.
    Xpdf is a small and efficient program which uses standard X fonts.

    ```


    This output indicates that **xpdf** is a tool for viewing PDF files. It also includes
    information on when the package was installed, where it was built, and so on.
    If you’d passed -l instead of or in addition to -i, you’d get a list of files
    contained in the package.


    Instead of passing a package name, you can pass a package filename by using the
    **--package** (-p) option, as in **rpm -qpi** **xpdf-3.01-12.1-i386.rpm**, or
    you can query the package that owns a specific file on the computer by passing
    the **--file** (-f) option, as in **rpm -qfi** **/usr/bin/xpdf**. You can also
    query all the packages that are installed on the system by using the **--all**
    (-a) option. This action is most useful without the -i or -l options, in order
    to obtain a simple list of all the installed packages. If you redirect the output
    to a file or pipe it through **less**, you can then perform further queries on
    packages you don’t recognize in order to track down packages that may be bloating
    your system.


    # ## Verifying a Package


    RPM maintains a database of all the files it’s installed from every package it’s
    installed, along with checksum information on these packages. You can use this
    information to verify a package’s integrity with the **--verify** (-V) operation:


    ```

    # **rpm -V** samba

    ...T /usr/bin/smbcontrol

    SMS...T /usr/bin/smbstatus

    missing d /usr/share/doc/samba-3.0.22/html/docs/using_samba/figs/sam2_0811.gif

    ```'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Task 3.1: Use RPM


    If the package verifies completely properly, rpm displays no output. If any files
    don''t match what Samba has recorded in its database, it displays an eight-character
    code summarizing the problem (or missing if the file is missing), an optional
    code reporting the type of file, and the filename. The preceding example output
    indicates three potential problems with the package:


    +   - The `/usr/sbin/smbcontrol` file''s time stamp doesn''t match what RPM has
    recorded, as indicated by the T as the final character of the eight-character
    code. This usually isn''t a major problem; it can happen because of an accidental
    use of the touch utility against the file or because the file was accidentally
    moved and then copied back to its original location.


    +   - The `/usr/sbin/smbstatus` file''s time stamp doesn''t match what RPM has
    recorded. Furthermore, the file size (S), mode (M), and MD5 sum (5) don''t match.
    In other words, the file has been changed or replaced. Such problems can be caused
    by disk corruption, security breaches, or legitimate editing or replacement of
    individual files. Sometimes these issues appear on configuration files. A properly
    constructed package should flag configuration files as such, and so an RPM verify
    operation won''t report changes, but not all packages are properly constructed
    in this way.


    +   - The `sam2_0811.gif` file in a deep Samba documentation directory is missing.
    This file is flagged as being a documentation file (the d between the eight-character
    code and the filename). Missing files usually indicate disk corruption, security
    breaches, or accidental deletions by root.


    If a package doesn''t verify properly and you have reason to think that the cause
    is non-sinister, you might want to uninstall the package and then install it again.
    This will correct any problems with the package—but be careful to back up your
    configuration files, just in case they haven''t been properly flagged as such
    by the package maintainer.


    You can use the `--all` (-a) option with `--verify` (-V) to check all the packages
    on your system. This operation is likely to take many minutes to complete and
    will very probably produce rather lengthy output. Redirecting this output to a
    file for later perusal makes sense. Most of the verification failures in this
    output will be innocent and related to configuration files that aren''t correctly
    flagged or to packages that do some sort of post-installation modification to
    their own files. Nonetheless, you may want to verify your whole system from time
    to time to catch any problems that might develop.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_143_0.png)


    > Packages that don''t verify properly can be a sign of a system break-in, but
    more often such problems are innocent. Pay attention to the type of problem that
    rpm reports. Time stamp discrepancies are usually innocent and missing files are
    typically accidents that aren''t usually serious, for instance. Changed MD5 checksums
    on program files are potentially much more serious, though.


    # Performing a System Update


    The ultimate in package updates is using Yum to update *every* package installed
    on your system. If your distribution shipped with Yum, chances are it''s already
    configured properly. If not, you can obtain Yum from its home page, `http://fedoraproject.org/wiki/Fedora_Yum_Repo`.
    Configuring'
