- pgno: 119
  md: '# ## Scope of Task


    This task describes changing the three specified pieces of hardware; however,
    you''re unlikely to rush out and buy new hardware just to complete this task.
    In this case, you should read along and review your existing configuration file
    without changing it. If you happen to have spare hardware, you might try temporarily
    installing and configuring it, though.


    # ## Duration


    This task will take about an hour or two to complete, including installing the
    new hardware. If you don''t actually replace any hardware, it should take only
    about half an hour to review the configuration file options. In real life, replacing
    hardware often results in unexpected complications, which can increase the time
    to perform tasks such as this.


    # ## Setup


    If you have an extra video card and want to try actually replacing the hardware,
    you should shut down the computer and perform the physical replacement. Be sure
    to follow the usual *safety precautions* when working inside the computer—unplug
    the computer from the wall outlet and ground yourself before touching anything
    inside the computer. Replacing the mouse doesn''t require opening the computer,
    but some older (non-USB) mice should only be plugged in or unplugged when the
    computer is powered down.


    Once you''ve replaced the hardware, or if you don''t have spares and intend to
    just read along, boot the computer. Some distributions will detect hardware changes
    and reconfigure themselves automatically, but others won''t. Because this task
    is intended to teach you how to reconfigure the system yourself, you should tell
    your computer not to make automatic changes if it offers to do so.


    If you''ve changed your video card, chances are you won''t see a GUI login screen.
    Changing the monitor alone might or might not result in a blank screen, and changing
    the mouse alone might result in a system for which the mouse doesn''t work. In
    any of these cases, press Ctrl+Alt+F1 to get a text-mode login prompt and log
    in. If you need to make real changes, type **su** to acquire superuser privileges;
    if not, continue using your regular account.


    # ## Caveats


    Swapping hardware runs some risk of damaging it. Be careful not to touch delicate
    components unnecessarily, and ground yourself by touching a radiator or plumbing
    before handling the video card or touching any other internal components. (You
    can also buy anti-static wrist straps or work pads that connect to your building''s
    electrical grounding system.) There''s also a chance of your injuring yourself,
    particularly if you work on a computer that''s plugged into a wall outlet. Ordinarily,
    the 120-volt AC from the wall outlet is reduced to much lower-voltage DC current
    inside the case, but a fault could expose you to more dangerous current.


    As usual, *if you make actual changes to your configuration as root*, you run
    the risk of damaging your system software. Backing up your X configuration file
    will enable you to recover if you make an *error* when editing that file. A backup
    will also enable you to easily restore your original configuration if you make
    test changes and then swap your hardware back to its original state.'
  merge: -1
