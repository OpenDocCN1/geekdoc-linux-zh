- pgno: 80
  md: '![](img/f430a19bdf014c43ad7c2d594afd5b21_80_0.png)


    Linux software requires hardware to be useful, and managing that hardware requires
    its own set of street smarts. Phase 2 focuses on this topic, beginning with low-level
    hardware configuration in the


    Basic Input/Output System (BIOS) and resolving hardware conflicts. This phase
    then moves on to Linux utilities for identifying and configuring your hardware,
    and particularly the Universal Serial Bus (USB), hard disk, and power management
    subsystems. The kernel is a critical part of the hardware equation, so this phase
    looks at configuring and compiling the kernel. Finally, this phase concludes with
    three tasks related to the X Window System (or X for short), Linux''s GUI environment.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_80_1.png)


    > This phase maps to portions of the ComptIA Linux+ objective 6 and to portions
    of the LPIC objectives 101, 105, and 110.


    # # Task 2.1: Set BIOS Options


    The BIOS is a low-level set of software functions that were designed in the 1980s
    to simplify the creation of OSs such as Microsoft''s original Disk Operating System
    (DOS). The BIOS would handle functions such as keyboard input, screen output,
    and even low-level disk input/output. Over the years, as computers and OSs grew
    in complexity, the BIOS became less and less important in handling these I/O tasks.
    Nonetheless, the BIOS remains important because it controls the computer''s initial
    boot sequence and hardware initialization. If the BIOS doesn''t know your hard
    disk exists, or if it configures your hard disk incorrectly, the computer won''t
    boot. Improper BIOS settings can also cause unreliable operation, clocks that
    are set incorrectly, an inability to access on-board hardware devices, and other
    problems. Thus, care should be taken when setting BIOS options, and checking these
    options is a wise precaution whenever putting a new computer into operation.


    # ## Scenario


    You''ve just assembled a new computer from parts. Before booting it and attempting
    to install Linux, you want to check its BIOS options to see that they''re sensible.
    You should pay particular attention to the disk options and to the system clock
    setting. When assembling a computer from parts, you are responsible for setting
    basic BIOS options. When you buy a preassembled computer, in theory the BIOS should
    be set correctly; however, errors do sometimes appear, so checking the BIOS options
    is a sensible precaution. The clock is likely to need adjustment even with a store-bought
    computer.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Scope of Task


    This task is a fairly short one, but you may need to do some research to complete
    it successfully. You must understand more about your hardware than is necessary
    for completing most other tasks in this book.


    # Duration


    This task can be completed in 15 to 30 minutes; however, you must first know a
    bit about your hardware (as described in the next section, “Setup”). You’re unlikely
    to need to perform this task very often once a computer is up and running, although
    you may need to do it when you add or remove hardware.


    # Setup


    You need a minimally functional x86 or x86-64 computer. This computer needs to
    be able to start up far enough to enter its BIOS utility, But it doesn’t need
    to have Linux—or any other OS—installed. (You may use a computer with a working
    OS, but this isn’t required.)


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_81_0.png)


    > This task describes x86 and x86-64 (aka AMD64 or EMTr64T) BIOSs, such as Intel’s
    Pentium and Celeron series and AMD’s Athlon CPUs. Computers that use PowerPC,
    SPARC, and other CPUs are likely to have radically different BIOSs. Even among
    x86 and x86-64 systems, variations are substantial, and a few exotic systems don’t
    even use BIOSs that closely resemble the ones described here


    You must know something about your hardware and, in particular, your disks (both
    hard disks and floppy disks). You should know the make, model number, and capacity
    of all your hard disks and know how they’re connected. In the case of the more
    common Advanced Technology Attachment (ATA) drives, you should know if you have
    the older Parallel ATA (PATA) or the newer Serial ATA (SATA) drives. Some drives
    are Small Computer System Interface (SCSI) devices, which work on different principles
    and usually connect via a separate SCSI host adapter. You should know which, if
    any, of the motherboard’s on-board devices (sound, video, Ethernet, etc.) you’re
    using.


    If you’re assembling a computer from parts, as described in “Scenarilo”, you should
    know this information because you designed the computer. If you’re using an existing
    Linux computer as a stand-in, you may need to dig out the computer’s documentation
    or skip ahead to Task 2.2 to learn this information.


    # Caveats


    Adjusting BIOS settings inappropriately can make a computer unbootable. Although
    you’re unlikely to damage the Linux installation, in the sense of the data on
    the hard disk, you could be in for some frustration if you make changes and can’t
    remember what they were. Thus, you should take careful notes of any changes you
    make.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Although all mainstream x86 and x86-64 BIOSs provide similar options, details
    differ substantially from one computer to another. The examples shown here should
    therefore be considered rough guidelines only; you may need to consult your motherboard’s
    manual or study the onscreen display, experiment, and apply your intelligence
    to figure out how to perform the tasks described here.


    # ## Procedure


    To perform this task, you must boot (or reboot) your computer, but if bypass the
    Linux boot process to enter the low-level BIOS utilities. There you can check
    and, if necessary, change a host of settings related to your hardware.


    # ## Entering the BIOS Setup Utility


    When you boot an x86 or x86-64 computer, you’ll see a series of text-mode (and
    sometimes graphical) displays, the details of which vary depending on your computer.
    Prior to the beginning of the Linux boot process, you’re likely to see the name
    of the motherboard or computer manufacturer, a simple RAM check that counts up
    the amount of memory installed in the computer, a display of your installed PATA
    hard disks, and perhaps information on some of the devices built into the motherboard
    (RS-232 serial ports, parallel printer ports, and so on). Unfortunately for your
    comprehension of this information, these displays are likely to appear and disappear
    so quickly that you may have trouble reading them all. A recent trend has been
    to hide most or all of this information behind a graphical display, but some computers
    provide BIOS options to do away with the graphics and show the traditional text-mode
    information.


    One of the pieces of information that’s likely to be displayed, albeit for just
    a second or two, is a prompt for how to enter the BIOS setup utility. Typically,
    you must press one or more keys at some point during the boot process, such as
    Delete or F12. If your computer is currently running, shut it down, start it up
    again, and look for a prompt for how to enter the BIOS setup utility in the first
    few seconds of the boot process. If you don’t see such a prompt, consult your
    computer’s or motherboard’s manual for the information, or try pressing the Delete
    key; that’s a common method for entering the setup utility.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_82_0.png)


    The BIOS setup utility modifies data stored in complementary metal oxide semiconductor
    (CMOS) memory, which is a small store of non-volatile on-chip memory on the motherboard.
    For this reason, this utility is often referred to as the CMOS setup utility.


    # ## Touring the BIOS


    Upon successfully entering the BIOS setup utility, you’ll see a screen that provides
    a menu of options, as shown in Figure 2.1. (Some BIOS utilities jump directly
    into option-setting screens, with some way to select other screens among the options.)
    Take a few moments to peruse the options. In the case of Figure 2.1, most of the
    main categories, such as Standard CMOS Features and Integrated Peripherals, give
    some clue as to the functions contained within them, but they aren’t entirely
    clear to the uninitiated.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '**FIGURE 2.1** BIOS setup utilities provide a menu of options from which you
    can select the features you want to adjust.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_83_0.png)


    To move among the options, you typically use the keyboard''s cursor keys, as prompted
    in the list of keyboard shortcuts near the bottom of the screen. You can then
    press the Enter key to enter a submenu or change an option. Once you enter a submenu,
    press the Esc key to exit from that menu. If these keys don''t have the desired
    effects, though, you may need to use other keys; consult the onscreen prompts
    or your documentation for details.


    Try perusing the options for your system now, but don''t change anything. Some
    of the options should make at least some sense to you, but others will most likely
    be confusing. Don''t try to figure out what every option means; the goal is simply
    to give you a general idea of what features your motherboard supports and what
    you can adjust, not for you to learn what every option does.


    # ### Setting Disk Options


    The first option you should check for this task is your disk settings. In the
    BIOS depicted in Figure 2.1, these options are accessible from the Standard CMOS
    Features menu, so select that option from the main screen if your BIOS uses this
    layout. The result (for this BIOS) is depicted in Figure 2.2. This screen enables
    adjustment of both disk and time options.


    Integrated Device Electronics (IDE), aka PATA, hard disks are auto-detected by
    most motherboards and so should appear in the list of disks. Figure 2.2 shows
    two hard disks detected: a Maxtor 91024D4 and a Western Digital (WDC) WD800JB-00EATA0.
    These are configured as the master and slave drives on the primary PATA controller.
    If a hard disk you''ve installed doesn''t appear, you can try selecting the drive
    (by primary/secondary and master/slave location) and selecting the auto-detect
    option in the menu that appears. If this doesn''t work, chances are a cable is
    loose, the drive isn''t connected to the power supply, or its master/slave setting
    is misconfigured. Shut down the computer, check the connections and settings,
    and reboot into the BIOS utility.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# FIGURE 2.2 PC BIOSs enable you to adjust hard disk and system clock settings.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_84_0.png)


    If the computer still doesn''t auto-detect a PATA drive, something more serious
    could be wrong. A few very old drives might not be detected correctly, and the
    BIOS enables you to move the setting off of Auto onto User or various drive-specific
    settings. Unless your hard drive is a refugee from the early 1990s or before,
    though, you shouldn''t need to set these options.


    > SATA and SCSI drives aren''t detected by the BIOS in the same way PATA drives
    are. If you have an SATA or SCSI drive, it''s normal for the drive to not appear
    on the IDE drive list.


    Figure 2.2 shows a CD-RW drive as the secondary slave device. On rare occasion,
    CD-ROM, CD-RW, and similar drives aren''t detected correctly. If this happens
    to you, select the device by position and move the selector off of Auto and onto
    CDROM. This should fix the problem—assuming, of course, that a more fundamental
    misconfiguration or loose cable isn''t the root cause of the problem.


    In addition to hard drives, the BIOS enables you to configure your floppy drives.
    Unlike hard drives, floppy drives aren''t auto-detected. To tell your BIOS about
    your floppy drive (or drives), move the cursor to the text to the right of Floppy
    Drive A or Floppy Drive B, press the Enter key, and select the appropriate drive
    type. Figure 2.2 shows one 3.5-inch and one 5.25-inch drive installed, but of
    course your system may be different.


    > In DOS and Windows, floppy drives are identified as A: and B:. Linux doesn''t
    use these designations; on most systems, floppy drives are mounted as /mnt/floppy,
    /media/floppy, or something similar. The BIOS doesn''t know this, though, and
    refers to floppy drives as A and B.'
  merge: -1
  img_proc: true
- pgno: 85
  md: "Most BIOSs provide some form of boot device option. The BIOS depicted in Figures\
    \ 2.1 and 2.2 places this option on the Advanced BIOS Features screen under the\
    \ name Boot Sequence. You can select which device the BIOS attempts to boot first,\
    \ second, and third and whether or not the BIOS should look on other devices after\
    \ that. This option is a very useful security feature because it can prevent an\
    \ intruder from booting a floppy or other removable disk to gain access to the\
    \ computer. To be a truly useful security feature, though, this option must be\
    \ combined with a BIOS password. Even then, if the intruder can open the computer,\
    \ the hard disk could be stolen or modified. Nonetheless, setting the computer\
    \ to boot only from a hard disk can be part of an overall security strategy.\n\
    \n# Setting the Clock\n\nAll x86 and x86–64 computers include a clock on the motherboard\
    \ to keep the time while the computer is shut down. You can set your motherboard’s\
    \ clock by moving the cursor to the appropriate items on the System Time and System\
    \ Date lines and adjusting them. Most BIOSs require you to enter the time in a\
    \ 24-hour format, so be sure to make the appropriate conversion.\n\nBefore you\
    \ set your clock, though, be aware that Linux keeps time based on Coordinated\
    \ Universal Time (UTC), which is closely related to Greenwich Mean Time (GMT).\
    \ If your computer boots only Linux, your best bet is to set the motherboard’s\
    \ clock to UTC/GMT. Check <http://www.greenwichmeanlime.com> for the current time\
    \ as GMT. If your Linux installation currently works, though, you might do well\
    \ to not adjust your motherboard’s clock, even if it’s set for local time; such\
    \ a change would necessitate a change in your Linux configuration.\n\nIf your\
    \ computer boots both Linux and an OS that keeps its time as local time, you can\
    \ set your hardware clock to local time and Linux can make the adjustment internally.\
    \ This feature is normally set at system install time.\n\nIt’s possible to set\
    \ the hardware clock from within Linux. To do so, use the hwclock command. Typing\
    \ hwclock --show or hwclock -r displays the current hardware clock time; hwclock\
    \ --hctosys or hwclock -w sets Linux’s software clock based on the value of the\
    \ hardware clock; and hwclock --sys2hcl or hwclock -s sets the hardware clock\
    \ based on the software clock. Ordinarily you don’t need to use these commands,\
    \ although they are used in system startup and shutdown scripts to set the software\
    \ clock from the hardware clock when booting and to set the hardware clock from\
    \ the software clock when shutting down. If you find your hardware clock has drifted\
    \ badly off the current time, though, you can type hwclock --sys2hct to correct\
    \ the problem once you set your software clock appropriately. You can do this\
    \ with the Network Time Protocol (NTP, <http://www.ntp.org>) for a long-term solution\
    \ or on a one-time basis via the date command.\n\n> NOTE\n> \n> With the exception\
    \ of displaying the current time, you need root privileges to use hwclock or date.\n\
    \n# Enabling and Disabling On-Board Devices\n\nModern motherboards usually contain\
    \ a plethora of devices that were, in years past, implemented as separate plug-in\
    \ cards—sound “cards,” network ports, Universal Serial Bus (USB) ports, RS-232\
    \ serial ports, parallel ports, and so on. Not everybody wants to use all of these"
  merge: -1
  img_proc: true
- pgno: 86
  md: 'features, though, and some of them offer configuration options that you might
    want to adjust. To do so, you must access the appropriate BIOS utility screen.
    In the case of the BIOS depicted in Figure 2.1, you should select the Integrated
    Peripherals menu. The result is the screen shown in Figure 2.3, in which you can
    enable or disable the floppy disk (FDC Function), RS-232 serial ports, parallel
    ports, and more. (This area''s options won''t fit on one screen; they continue
    as you move the cursor down the list.)


    # FIGURE 2.3 Modern BIOSs enable you to disable on-board devices if you so desire.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_86_0.png)


    Disabling on-board devices disconnects them electronically from the rest of the
    motherboard. The result is that Linux won''t be able to use those devices. The
    advantage is that they also won''t consume valuable interrupt request (IRQ) lines
    and other resources.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_86_1.png)


    > If you know you won''t be using a hardware feature built into your motherboard,
    either because you don''t need it at all or because you intend to use a better
    plug-in card for that function, disable the feature in the BIOS. This reduces
    the odds of your encountering IRQ conflicts or other problems related to an unused
    device consuming resources or otherwise interfering with the hardware you are
    using.


    # Additional BIOS Options


    Most BIOSs provide options I don''t describe here. Power management, RAM and PCI
    bus timing options, CPU speed, and more can all be controlled from the BIOS. Most
    such options are of interest to those who want to tweak the best possible performance
    from their computers, sometimes at the cost of reliability. If in doubt, leave
    the options at their factory defaults. Some BIOSs, including the one depicted
    in Figure 2.1, provide an explicit option to reset the configuration to the factory
    default (Load BIOS Setup Defaults in Figure 2.1) or to a high-performance state
    (Load High Performance Defaults in Figure 2.1). Such options can be useful'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'emergency tools; if you tweak some settings, find that they don''t work, and
    can''t seem to get the BIOS working as you like it again, use the restore function.


    You can also set a BIOS password on most computers. Using one will prevent somebody
    without the password from accessing the BIOS or perhaps booting the computer.
    This can be a useful feature in a high-security installation, but it''s a bit
    inconvenient if the computer must be rebooted regularly.


    One important option (or set of options) relates to exiting from the BIOS utility.
    In most cases, at least two exit options exist: One saves your changes and exits,
    whereas the other discards your changes and exits. These: One saves your changes
    and exits, whereas the other discards your changes and exits. These options are
    the final two in the second column in Figure 2.1. When you''re done persisting
    (and possibly modifying) your BIOS settings, you should select whichever of these
    options you believe is most appropriate. The computer will then reboot normally—into
    Linux if it''s installed. If you''ve made any changes to the BIOS, try to verify
    that they''ve had the desired effect in Linux.


    # ### Criteria for Completion


    To complete this task, you should peruse your BIOS and verify that the computer
    is configured correctly, particularly with respect to its hard disks, floppy disks,
    and on-board devices. If necessary, you should change these options and, if Linux
    is already installed, reboot into Linux and verify that any changes you made had
    the desired results.


    # # Task 2.2: Learn about Your Hardware


    The x86 PC architecture, and therefore the x86-64 architecture derived from it,
    has evolved over a period of more than two decades. For this reason, many parts
    of the design of these systems are limiting or strange—what seemed a good solution
    to a problem in the 1980s might be inadequate today. Furthermore, old methods
    of manually configuring hardware must continue to be supported today, or they
    may have left behind vestiges of themselves in today''s hardware and software.


    One consequence of these facts is that configuring PC hardware can be difficult.
    Adding a new card or other device can sometimes break a working computer, and
    the many different types of hardware can lead to confusion. This task examines
    how you can learn about your hardware from within Linux in order to avoid problems
    when adding new hardware. The next task expands on this topic and looks at troubleshooting
    procedures


    # ### Scenario


    To prepare for planned system upgrades, you must create an inventory of hardware
    in your computer, including the resources this hardware consumes. This inventory
    will enable you to decide what additional hardware you can add, as well as any
    secondary upgrades you might need to support the ones you plan (for instance,
    whether you need to add a new disk controller to support additional hard drives).'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# # Scope of Task


    This task involves running commands that report on system status, examining configuration
    and log files, and examining the contents of files in the `/proc` pseudo-filesystem.


    # ## Duration


    This task should take about half an hour to complete. If you need to obtain a
    specific piece of information in the future, you should be able to do so in a
    few seconds to a few minutes once you’re familiar with the files and utilities
    in question.


    # ## Setup


    To prepare for this task, log into your Linux computer. Because some of these
    commands require **root** access, you may want to open two sessions, one as a
    regular user and one as **root**; or you can switch back and forth or run all
    the commands as **root** (although the latter option increases the risks involved
    in performing this task). Having a working printer will enable you to easily create
    a hard copy of some of the configuration files and text output created by the
    commands described in this task.


    # ## Caveats


    The usual caveats concerning **root** access to the computer apply to the parts
    of this task that require this access.


    Some of the commands and procedures described here don’t give a complete accounting
    of the resources used by your computer unless all the relevant drivers are loaded.
    Thus, it’s possible your hardware inventory will be missing some items. You should
    have a general idea of what hardware is already installed and be able to activate
    that hardware before taking your inventory.


    # # Procedure


    This task involves looking up data in two basic ways. First, you’ll check system
    resources used by (optimally) all the hardware installed in your system. Second,
    you’ll check information resources devoted to specific types of devices and for
    the system generally.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_88_0.png)


    Each *device*, in the context of this task, is a hardware subsystem. This subsystem
    may be a physically separate component (such as a scanner or external hard disk),
    a plug-in component (such as a PCI card), or a device that’s integrated on the
    motherboard (such as the motherboard’s built-in audio hardware). The physical
    form of a device is often impossible to determine from within Linux.


    # ## Checking IRQs


    IRQs were mentioned earlier, in Task 2.1. Early PCs supported just eight IRQ lines,
    numbered 0 to 7. Each device, in the form of motherboard features or plug-in Industry
    Standard Architecture (ISA) card, used a single IRQ. Later PCs expanded the number
    of IRQs to 15,'
  merge: -1
  img_proc: true
- pgno: 89
  md: "numbered 0 to 15 (IRQ 2 serves as an interface to the higher IRQs, with IRQ\
    \ 9 serving as a substitute for IRQ 2). The latest designs support larger numbers\
    \ of IRQs—typically 24 or more. Each hardware device, such as a hard disk controller,\
    \ sound card, or USB port, uses a single interrupt line to signal the CPU when\
    \ it needs attention. Hardware connected to these devices, such as individual\
    \ hard disks or USB devices (printers, mice, and so on), don’t need IRQs themselves;\
    \ they communicate with their controllers, which in turn communicate with the\
    \ CPU.\n\nIRQs are limited in number. Particularly on older computers that use\
    \ the ISA bus, IRQs shouldn’t be shared between devices. Modern computers can\
    \ usually share IRQs between devices without problems.\n\nIRQs are assigned by\
    \ jumpers or dip switches on older cards or motherboards or automatically via\
    \ *Plug and Play* (PnP) technology on newer ISA cards, Peripheral Component Interconnect\
    \ (PCI) cards, and devices built into modern motherboards. When adding a device,\
    \ it’s best to assign it its own IRQ, either manually or by tweaking the way the\
    \ motherboard or OS does so.\n\nYou can check which IRQs are currently in use\
    \ by examining the contents of the `/proc/interrupts` pseudo-file:\n\n```\n```\n\
    $ cat /proc/interrupts\n\n               CPU0\n0:      503295414  IO-APIC-edge\
