- pgno: 56
  md: '30 Phase 1 · Working on the Command Line


    # Understanding the Basics of Account Management


    Linux and Unix systems have traditionally stored account information in the /etc/passwd
    file. This file consists of a series of lines, each of which represents a single
    account, as in:


    ```

    dsmith:x:512:100:Dale Smith:/home2/dsmith:/bin/bash

    ```


    This line consists of a series of colon-delimited fields that contain the account’s
    username, password, UID number, group ID (GID) number, a free-form comment, home
    directory, and default shell. Note that in this example the password field contains
    a single x. This is a code that means the password is encoded in another file,/etc/shadow.
    Most Linux systems today use this shadow password system as a way of increasing
    security; the /etc/passwd file must be world-readable to enable programs to access
    information such as the user’s default shell and the comment field. Even an encrypted
    password could be broken if it were readable, so the shadow password system locks
    this sensitive data, as well as additional account information, in /etc/shadow,
    which is readable only by root. The format of the /etc/shadow file is similar
    to that of /etc/passwd in that it consists of colon-delimited fields. The first
    two fields contain the username and encrypted password, while remaining fields
    contain account aging and other advanced information.


    Account management involves creating, deleting, or modifying the information in
    /etc/passwd and /etc/shadow. In principle, this can be done with a text editor,
    and in fact some extraordinarily street-savvy administrators work this way. Most
    administrators, though, use command-line or GUI tools to help manage the task.
    These tools obviate the need to remember what fields hold what data and minimize
    the risk of encountering problems from typos, such as accidentally deleting a
    colon.


    The basic Linux account management tools are useradd, userdel, and usermod. These
    tools add, delete, and modify existing user accounts, respectively. Linux also
    provides groupadd, groupdel, and groupmod tools to perform similar tasks with
    groups, although some of the details of operation differ.


    # Adding User Accounts


    To add an account, you use the useradd command. At its simplest, you can use this
    command followed by the username you want to use:


    ```

    # useradd tbrown

    ```


    This command creates an account called tbrown, using defaults for various account
    parameters. On most systems, the user’s home directory will be /home/tbrown, the
    shell will be /bin/bash, the comment field will be empty, and the UID and GID
    will be assigned based on the lowest available numbers for both. Most importantly,
    the account’s password will be disabled (more on that shortly).


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_56_0.png)


    Some systems give each user a unique GID, and create an appropriate group to go
    with it, as a default policy. Other systems assign new users to an existing group,
    typically users, as a default policy.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'You can create an account with different defaults by placing appropriate parameters
    between `useradd` and the account name. Alternatively, you can create an account
    with the defaults and then use `usermod` to change them. Some features you’re
    particularly likely to want to adjust include:


    **Comment** The `-c comment` parameter passes the comment field for the user.
    Some administrators store public information like a user’s office or telephone
    number in this field. Others store just the user’s real name or no information
    at all.


    **Home directory** You specify the account’s home directory with the `-d home-dir`
    parameter. This defaults to `/home/username` on most systems.


    **Do or do not create a home directory** The `-M` option forces the system to
    *not* automatically create a home directory, while `-m` forces the system to create
    one. Which behavior is the default varies from one system to another.


    **Default group** You set the name or GID of the user’s default group with the
    `-g default-group` option. The default for this value varies from one distribution
    to another.


    **Default shell** Set the name of the user’s default login shell with the `-s
    shell` option. On most systems, this defaults to `/bin/bash`.


    **Specify a UID** The `-u UID` parameter creates an account with the specified
    user ID value (*UID*). This value must be a positive integer, and it is normally
    above 500 for user accounts. System accounts typically have numbers below 100.
    The `-o` option allows the number to be reused so that two usernames are associated
    with a single UID.


    **No user group** In some distributions, such as Red Hat, the system creates a
    group with the same name as the specified username. The `-n` parameter disables
    this behavior.


    This list of options isn’t complete; consult `useradd`’s man page for more options.
    As an example of some of these options in action, suppose you want to place Trevor
    Brown’s real name in the comment field and set his home directory to `/home2/trevor`.
    You could do so at account creation time by including appropriate parameters:


    ```

    # useradd -c "Trevor Brown" -d /home2/trevor tbrown


    ```


    After typing this command (or the simpler version shown earlier), be sure to check
    for the existence of the home directory. If it’s not present, you must create
    it yourself and change its ownership (including its group):


    ```

