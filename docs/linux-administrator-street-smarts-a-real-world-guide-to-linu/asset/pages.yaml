    At the time of this writing, an ATA-8 standard is under discussion, but it has
    not yet been finalized. In practice, hardware often leads standards, so devices
    with ATA-8 features will likely become available before the standard is finalized.


    If you''re certain that your ATA disk *and* its controller both support a particular
    mode (say, ATA-7), you can activate it as follows:


    ```

    # hdparm -X udma6 /dev/hda

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_108_1.png)


    Specifying a DMA mode that''s too advanced for your hardware can result in the
    hardware becoming unresponsive. In the case of a hard disk, this can mean that
    you won''t be able to access the disk or cleanly shut down the computer. Thus,
    you should not use hdparm in this way unless you''re willing to take a risk.


    Using hdparm to adjust your disk''s performance creates a temporary change—once
    you reboot the computer, your system will revert to its default behavior. In most
    cases, this is fine, because your computer sets the appropriate mode at boot time.
    If you find that adjusting your DMA mode improves performance, though, you may
    want to add your hdparm command to an appropriate system startup script. Appropriate
    startup scripts vary from one distribution to another. On Red Hat, Fedora Core,
    Mandrake, and Slackware, the script is */etc/rc.d/rc.local*; on openSUSE, edit
    */etc/rc.d/boot.local*; for Debian and its derivatives, create a script in the
    */etc/rc.boot* directory; and on Gentoo, edit */etc/conf.d/local.start*.


    Another way to tweak disk performance is to change the driver. To do this, you''ll
    need to know about the ATA controller or SCSI host adapter that handles the disk.
    You may be able to find updated drivers in a newer kernel, on your hardware manufacturer''s
    Web page, or on a third-party Web page. Try doing a Web search, if necessary.
    Another option, particularly for'
