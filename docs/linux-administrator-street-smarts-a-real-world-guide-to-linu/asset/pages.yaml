- pgno: 223
  md: "# ## Examining the Partition Table\n\nBefore modifying any disk’s partitions,\
    \ you should first examine the existing partition table. The quickest way to do\
    \ this, particularly if you don’t need to perform other fdisk actions, is to use\
    \ the -l option to the command along with the device filename for the disk:\n\n\
    ```\n# fdisk -l /dev/sda\n```\n\n```\nDisk /dev/sda: 100 MB, 100663296 bytes \
    \ \n4 heads, 48 sectors/track, 1024 cylinders  \nUnits = cylinders of 192 * 512\
    \ = 98304 bytes\n```\n\n| Device | Boot | Start | End | Blocks | Id | System |\n\
    | :----- | :-: | :---: | :-: | :----- | :-: | :----- |\n| /dev/sda1 | | 1 | 510\
    \ | 48936 | 83 | Linux |\n| /dev/sda2 | | 511 | 1024 | 49344 | 5 | Extended |\n\
    | /dev/sda5 | | 511 | 1024 | 49320 | 83 | Linux |\n\nThis example shows that the\
    \ disk is 100MB in size and contains three partitions, /dev/sda1, /dev/sda2, and\
    \ /dev/sda5. The second partition, though, is marked as an extended partition;\
    \ it serves only as a placeholder for logical partitions, and only one logical\
    \ partition exists: /dev/sda5. In other words, there are really only two partitions\
    \ on which you might store data: /dev/sda1 and /dev/sda5.\n\nLinux numbers primary\
    \ (including extended) partitions from 1 to 4 and logical partitions from 5 upward.\
    \ The primary partitions can have discontinuous numbers; for instance, a disk\
    \ could have /dev/sda1 and /dev/sda3 but not /dev/sda2 or /dev/sda4. Logical partitions\
    \ are numbered sequentially, though, so if there’s a /dev/sda6 there should also\
    \ be a /dev/sda5.\n\nIf you intend to operate on the disk, as you must for this\
    \ task, you should enter fdisk’s interactive mode by passing the device filename\
    \ without options, as in fdisk /dev/sda to modify the first SCSI disk. The program\
    \ displays a prompt that reads Command (m for help):. You can then verify the\
    \ disk’s contents by typing p. The output should resemble that shown earlier.\n\
    \n![](img/f430a19bdf014c43ad7c2d594afd5b21_223_0.png)\n\n> Always check a disk’s\
    \ current partitions before modifying them. Checking the partitions may alert\
    \ you to a careless mistake or typo made when you entered the disk device. If\
    \ you fail to verify that you’re working on the correct disk on a multi-disk system,\
    \ you could easily wipe out your Linux installation.\n\nIf you modify a brand-new\
    \ disk or a disk that has previously been used in a non-x86 system, it could show\
    \ nothing at all or gibberish for the partition table. In the latter case, you\
    \ might be able to delete the nonsense partitions using the commands described\
    \ next, or you can type o in fdisk to write a fresh MBR:\n\n```\nCommand (m for\
    \ help): o  \nBuilding a new DOS disklabel. Changes will remain in memory only.\n\
    ```"
  merge: -1
