  md: '# ## Scope of Task


    This task investigates the most common Linux printing tools and utilities, including
    text-mode commands and GUI print dialog boxes.


    # ## Duration


    This task should take about half an hour to an hour to complete. Once you''re
    familiar with the commands, you can use them in just a few seconds, although of
    course print jobs can take anywhere from a few seconds to several hours to complete,
    depending on the number of pages to be printed, the type of material on the pages
    (graphics often take longer than text to print), and the speed of the printer.


    # ## Setup


    You must have completed Task 6.10 or have an existing working print queue on your
    system. You can submit print jobs and perform most other parts of this task as
    an ordinary user, but modifying print jobs that don''t belong to you requires
    `root` privileges, as does manipulating print queues as a whole.


    To complete this task, you''ll need PostScript documents. You can generate such
    documents from many programs. Check GUI programs'' print dialog boxes for options
    to print to disk; such options generally produce PostScript output. Alternatively,
    you can use sample PostScript documents that ship with Ghostscript. These are
    usually stored in the `/usr/share/doc/ghostscript-version/examples` or `/usr/share/ghostscript/version/examples`
    directory, where *version* is the Ghostscript version number. The `alphabet.ps`
    and `colorcir.ps` files should print on most printers. (The latter prints in color
    on color printers.) Some files don''t print correctly on all printers.


    # ## Caveats


    If you manipulate your print queue as `root`, the usual `root` precautions apply.
    Other than this caveat, printing is unlikely to cause serious damage to your computer.
    You could, though, end up printing reams of gibberish. This can happen if your
    printer is misconfigured—if CUPS sends codes for, say, an Epson inkjet printer
    to an HP laser printer, the result could get ugly. You can also print reams of
    paper under some circumstances if you attempt to print a file that''s damaged
    or that''s of a type that CUPS''s algorithms misidentify. This can sometimes happen
    with PostScript files that contain stray characters at their start; CUPS misidentifies
    the file as plain text and prints it as such, resulting in many pages of PostScript
    code being printed rather than the formatted document you expected. Such problems
    may require reconfiguration of the printer queue. Of course, it''s also possible
    to just plain waste a lot of paper and ink or toner by unnecessarily printing
    documents that really are big.


    # ## Procedure


    The `lpr` program is the most basic Linux printing tool: It''s a text-mode program
    that prints a file you specify to the printer you indicate. Once you''ve submitted
    print jobs, you can learn'
