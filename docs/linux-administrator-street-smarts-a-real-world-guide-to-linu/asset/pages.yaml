- pgno: 201
  md: 'exist, create one. Use a working file as a template, modifying it for the new
    file. Pay particular attention to the *prerotate* or *postrorate* scripts, which
    tell *logrotate* how to tell *syslogd* to temporarily suspend and then resume
    logging. You may need to consult the documentation for the program that’s creating
    the log file to learn how to force that program to begin using a new log file.


    # Reviewing Log File Contents


    Log files do no good if they simply accumulate on the system. Their purpose is
    to be used as a means of identifying problems. When a server isn’t responding
    as you expect, when a computer refuses login it should be accepting (or accepts
    logins is should be refusing), or when a system’s network interface isn’t coming
    up (to name just three types of problems), you should check your log files as
    part of your troubleshooting procedures. Several procedures, many of which involve
    tools described elsewhere in this book, can help you do so:


    **Paging through whole log files** You can use a pager program, such as *less*
    (described in Phase 1), to view the entire contents of a log file. A text editor
    can fill the same role.


    **Searching for keywords** You can use *grep* (described in Phase 1) to pull lines
    that contain keywords out of log files. This can be particularly handy when you
    don’t know which log file is likely to hold an entry. For instance, typing `grep
    mail /var/log/*` locates all lines in all files in the `/var/log` directory that
    contain the string `mail`.


    **Examining the start or end of a file** You can use the *head* or *tail* command
    to examine the first or last several lines of a log file. The *tail* command is
    particularly handy; you can use it to look at the last few entries just after
    you take some action that you expect to produce some diagnostic log file entries.


    **Monitoring log files** In addition to checking the last few lines of a log file,
    *tail* can monitor a file on an ongoing basis, echoing lines to the screen as
    they’re added to the file. You do this with the `-f` option to *tail*, as in `tail
    -f /var/log/messages`.


    **Advanced log analysis tools** Various packages exist expressly for the purpose
    of analyzing log files. For instance, there’s Logcheck, which is part of the Sentry
    Tools package (`http://sourceforge.net/projects/sentrytools/`). This package comes
    with some distributions, such as Mandriva and Debian. Unfortunately, it requires
    a fair amount of customization for your own system, so it’s most easily implemented
    if it comes with your distribution, preconfigured for its log file format.


    Log file analysis is a skill that’s best learned through experience. Many log
    file messages are cryptic, and they can be cryptic in different ways for different
    programs. Consider the requirement outlined in this task’s Scenario: You must
    examine your log files for mail server activity. Using `grep` to search for `mail`
    should turn up such activity, but the results are likely to be copious. In practice,
    most logging configurations store mail-related activities in `/var/log/mail`,
    so you might want to use *tail* or *less* to peruse the last lines of that file.
    You’re likely to see lines like these:


    ```

    Jul 16 23:59:01 speaker postfix/pickup[1047]: 186783C3: uid=500 from=<sally>

    Jul 16 23:59:01 speaker postfix/cleanup[2269]: 186783C3:

    message-id=<448B0B04.mail11QP11S3EX@mail1.example.com>

    ```'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Actually interpreting these lines requires some knowledge of the software involved.
    Log file entries begin with time stamps and typically identify the computer (*speaker*)
    and software (`postfix`) that generated the entries. Beyond that, information
    is likely to be software specific. In the case of this example, mail was picked
    up at 23:59:01 from `sal1y` and a subsequent cleanup operation was performed on
    what was presumably the same message, now given a message ID code. If your missing
    email matches these times and username, these log file entries indicate that the
    mail was received on the system you''re checking, so the problem could be in mail
    server configuration or in the mail client used to read the mail. If you can''t
    find mail server entries for the missing messages, it could be that the problem
    is on the sending system, or perhaps your mail server software has crashed or
    is otherwise unable to respond.


    Overall, you should examine your log files from time to time to become familiar
    with their contents. This will help you spot abnormalities when the system begins
    misbehaving or when you want to use log files to help track down an unwelcome
    visitor.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_202_0.png)


    **TIP**


    Log file entries can be conspicuous by their absence as well as by suspicious
    content within them. Intruders often try to cover their tracks by editing log
    files to remove the entries that betray their unauthorized accesses. Sometimes,
    though, they''re sloppy about this and they just delete all the log entries from
    the time in question. If you notice unusual gaps in your log files, such as a
    gap of an hour with no entries on a system that normally logs a couple dozen entries
    in that period, you may want to investigate further.


    # ## Criteria for Completion


    To complete this task, you should have performed two system logging configuration
    changes:


    You should have added new system logging for certain kernel-related and emergency
    messages, and you should have configured the log rotation to keep more system
    log files and to add log file rotation for your new log file. You should also
    have examined the `/var/log/mail` (or other appropriate) log file to try to track
    down recent email activity.


    # # Task 4.4: Use System Documentation


    When you maintain a system log book or configure your system to create log files,
    you''re creating documentation for your own or other administrators'' use. Fortunately,
    you''re not the only one to do this; Linux ships with a wide variety of documentation,
    which you can read to learn how standard programs work, what options go in configuration
    files, and so on. Chances are you''ve already used some of these types of documentation,
    but you might not fully understand them or know where to look to find the information
    you need. This task will help you learn to use the system''s existing documentation.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# **Scenario**


    You don''t fully understand the Linux printing system, but you want to be able
    to use a printer you''ve attached to your computer. You do know that the `lpr`
    command is involved in printing. Using this information as a starting point, you
    want to learn as much as possible about the Linux printing tools.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_203_0.png)


    Phase 6 includes two tasks devoted to printing.


    # **Scope of Task**


    This task requires you to learn about Linux''s printing tools using documentation
    installed on your system. As such, you must have appropriate software installed
    and you must be able to use the basics of the Linux information commands.


    # **Duration**


    This task is somewhat open-ended; you can read as little or as much from each
    information source as you see fit. If you read minimally, you can complete the
    task in just a few minutes. If you read thoroughly and follow all the links to
    additional information that you''ll find, you can easily spend hours reading about
    most topics. Chances are you''ll spend between half an hour and an hour on this
    task, though.


    # **Setup**


    To begin this task, log into your computer as an ordinary user. You don''t need
    root access to perform this task. Some information sources are in Hypertext Markup
    Language (HTML; the format used for Web pages), PostScript, or Portable Document
    Format (PDF). Such documents are most easily read from GUI programs such as Web
    browsers and PDF viewers, so you might want to log into your system in GUI mode.


    # **Caveats**


    There are few risks involved in accessing online documentation, unless of course
    you do so as root and mistype a command. Linux''s system documentation is somewhat
    spotty, though; some packages come with extremely complete and well-written documentation,
    whereas others come with documentation that''s next to useless. This situation
    has improved over time, though, and today you''re more likely than not to find
    documentation that will be helpful. Occasionally, documentation lags the software
    it describes, so it may omit mention of important new features or changes to options.
    Be aware of this fact, and if something doesn''t work the way the documentation
    suggests, try using online information sources, as described in the next task.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '178 Phase 4 · Documenting the System


    # Procedure


    To learn about Linux printing, you''ll begin with the man system and the one printing
    command you know: `lpr`. This starting point will be enough to provide you with
    some basic information and pointers to additional documentation. You can also
    search the system for extra information. Finally, you''ll check GUI programs for
    their own built-in documentation.


    # Start with man


    Earlier phases of this book have referred to man pages for utilities, configuration
    files, and so on. Linux''s man system provides documentation that can be considered
    a reference manual on various Linux topics. That is, man pages aren''t intended
    to teach you how to use a tool in a tutorial fashion but to document the tool''s
    major features, command-line options, and so on. To be sure, if you''re familiar
    with Linux generally, you can learn about a subject by reading relevant man pages,
    but you''ll probably find the style terse and the entries may be confusing if
    you lack relevant background information.


    Nonetheless, a man page is a good place to start if you know the name of a program
    or configuration file but don''t have much more information. Try typing `man lpr`
    now. You''ll see lpr''s man page appear in the less pager. The man page for `lpr`,
    like most man pages, is broken down into several sections, with titles like Synopsis,
    Description, Options, and See Also. The man page for `lpr` is only about three
    screens long, so you should take the time to read it before going further with
    this task.


    The Synopsis section specifies how the command may be used in terms of the options
    it can take. The style for this specification can be confusing if you''re not
    used to it, but it''s fairly simple. The most important point is that anything
    enclosed in square brackets ([ ]) is an option; you may omit these options if
    you don''t want to use them. The specific options are described in more detail
    later in the man page, in the Options section. This section, like most others,
    is written in plain English.


    If all you wanted to do was to print a single file, `lpr`''s man page provides
    the information you need to do so. From the Synopsis and Options, you should be
    able to figure out that you can type the command name followed by the name of
    the file you want to print, with optional additional parameters between these
    two elements. For instance, you might try the following command:


    ```

    ```

    $ lpr sample.html

    ```

    ```


    This command prints the sample.html file on your default printer. One fact about
    `lpr` that''s not well described in its man page, though, is that it applies various
    filters to input files. These filters attempt to convert files of various types
    into formats that may be printed. Unfortunately, these filters don''t always do
    what you expect or want. For instance, because it''s an HTML file, you might have
    expected sample.html to print as the Web page that it is. Unless your system is
    configured with an HTML filter, though, the preceding command will result in a
    printout of the raw HTML file. The system I''m using for testing lacks such a
    filter—but it includes filters for many graphics formats, so printing a graphics
    file results in a printout of the image.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/f430a19bdf014c43ad7c2d594afd5b21_205_0.png)


    Although most programs provide man pages, some developers have begun to favor
    info pages. The info page system closely resembles the man page system, but info
    pages use a hypertext format so that you can more easily move from one topic to
    another. Type `info info` to learn more about the info page system. Most projects
    that favor info pages provide a man page "stub" that points you to the info page.


    # Additional man-Related Tools


    One of the problems with man pages is that it can be hard to locate help on a
    topic unless you know the name of the command, system call, or file you want to
    use. Fortunately, methods of searching the manual database exist and can help
    lead you to an appropriate man page:


    +   * **Summary search** The `whatis` command searches summary information contained
    in man pages for the keyword you specify. The command returns a one-line summary
    (the Name section of the man page, in fact) for every matching man page. You can
    then use this information to locate and read the man page you need. This command
    is most useful for locating all the man pages on a topic. For instance, typing
    `whatis lpr` returns lines confirming the existence of the man page entries for
    `lpr`. If you didn''t know that command to use for printing, though, `whatis`
    might not help you as much—on my test system, at least, `whatis printing` and
    `whatis print` both return no results.


    +   * **Thorough search** The `apropos` command performs a more thorough search,
    of both the Name and Description sections of man pages. The result looks much
    like the result of a `whatis` search except that it''s likely to contain many
    more items. In fact, doing an `apropos` search on a very common word, such as
    `the`, is likely to return so many hits as to make the search useless. Even `apropos
    printing` returns 83 hits on my system. A search on a less common word is likely
    to be more useful. (The exact number of hits returned by `apropos` will vary by
    system, depending on the packages installed.)


    # Using the CUPS HTML Documentation


    Toward the end of most man pages, including that of `lpr`, you''ll find a section
    entitled See Also. This section contains pointers to additional system documentation.
    Many of these pointers are to other man pages. You can identify these by the number
    in parentheses following a name, such as `lpstat(1)`. You can use `man` to call
    up these other man pages, as in `man 1 lpstat`.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_205_1.png)


    Linux man pages are classified in sections. Each section holds entries for a particular
    type of tool, such as commands, configuration files, or system calls. Sometimes
    the same name is used in multiple sections—say, when a configuration file has
    exactly the same name as the command it configures. In such cases, you can add
    the section number before the name, as in `man 1 lpstat`, to disambiguate the
    reference.'
  merge: -1
  img_proc: true
- pgno: 206
  md: "In the case of `lpr`'s man page, the See Also documentation includes a pointer\
    \ to a useful piece of non-man documentation: `http://localhost:631/documentation.html`.\
    \ The `localhost` hostname refers to your own computer, so this URL isn't network\
    \ documentation; instead, it's documentation hosted on your own system and accessible\
    \ via the Common Unix Printing System (CUPS) server, which handles printing, and\
    \ your Web browser. Enter the URL in a Web browser and you should see the CUPS\
    \ links to various documentation files on your own computer, as shown in Figure\
    \ 4.1. You can click the links to view the documentation in HTML or PDF forms.\n\
    \n> **NOTE**  \n> Most Linux systems today use CUPS for printing; however, older\
    \ Linux distributions used other printing systems, which didn't make documentation\
    \ available in quite this way.\n\n# FIGURE 4.1 The CUPS package includes extensive\
    \ local documentation that’s accessible via a Web browser.\n\n![](img/f430a19bdf014c43ad7c2d594afd5b21_206_0.png)"
  merge: -1
  img_proc: true
- pgno: 207
  md: '# # Looking for Additional Documentation


    At this point, you’ve found most of the CUPS-specific documentation that’s available
    on a typical Linux system. Sometimes, though, man pages aren’t informative and
    they may not reference additional documentation. In such cases, you can try using
    your Linux package system to track down additional documentation. To do this,
    you can obtain a listing of all the files in the package that holds any of the
    program files, man pages, or other files associated with the software you’re investigating.
    You’ll first need to locate a relevant file:


    ```

    ```

    $ whereis lpr

    lpr: /usr/bin/lpr /usr/share/man/man1/lpr.1.gz

    ```

    ```


    With an RPM Package Manager system, you can then pass the -qfl option, along with
    a filename, to the rpm utility:


    ```

    ```

    $ rpm -qfl /usr/bin/lpr

    ```

    ```


    This command produces a list of all the files installed from the package to which
    /usr/bin/lpr belongs. You can pipe the output through less to peruse it or use
    grep to search on key strings, such as doc to locate miscellaneous documentation,
    man to locate man pages, or pdf to locate documentation in PDF format. (Non-man
    page documentation usually goes in a directory called documentation, docs, doc,
    or something similar, and man pages always reside in directories called man.)


    If your distribution uses Debian packages rather than RPMs, you can use dpkg -S
    to locate the package that holds a file, followed by dpkg -L to display the files
    installed by that package. Similar commands exist for other package systems, such
    as Gentoo’s emerge utility.


    If you try searching for extra documentation for lpr in this way, chances are
    you won’t find much. In fact, you might not even find the HTML documentation described
    earlier. The reason is that, on some systems, this documentation is installed
    from the cups package whereas lpr is often installed from the cups-client package.
    Other distributions place both files in a single package, though. The splitting
    of package-relevant files is not uncommon, and it does sometimes complicate searching
    for documentation.


    Even if you find copious amounts of documentation, some of it may not be very
    helpful. Distribution maintainers sometimes provide program compilation instructions
    and other files that are important for developers but not for administrators or
    users.


    # # Using GUI Programs’ Documentation


    Many users are more comfortable with GUI programs and their help systems than
    with man pages and other types of text-based documentation. With the increasing
    availability of complex GUI programs in Linux, documentation tools for such users
    are becoming more accessible. For the most part, they’re restricted to large programs
    and desktop environments. Figure 4.2 shows the result of having searched on the
    keyword print in the OpenOffice.org help system. Using this resource, you can
    learn a lot about OpenOffice.org’s printing system and how to send documents to
    your OS’s main printing system (such as CUPS). You’ll learn relatively little
    about CUPS itself, though.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/f430a19bdf014c43ad7c2d594afd5b21_208_0.png)


    # FIGURE 4.2   Large GUI programs frequently include extensive help systems.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_208_1.png)


    The xman program provides a GUI interface on the Linux man page system. The xman
    program is primitive by modern GUI standards and it doesn’t support many man features.
    You can’t even pass the name of a command you want to look up directly on the
    command line; you’ve got to search for it within xman. Nonetheless, it may be
    useful if you or your users are more comfortable with GUI tools than with command-line
    programs.


    # Criteria for Completion


    To complete this task, you should have used several system documentation resources,
    starting with the man system and related tools, moving on to non-man documentation
    provided with a package, and continuing with searching for documentation using
    package tools and GUI programs’ help systems. None of these methods of obtaining
    information is guaranteed to give you the information you desire, but chances
    are one of them will do the job, or at least provide you with clues you’ll be
    able to use in an online documentation search.'
