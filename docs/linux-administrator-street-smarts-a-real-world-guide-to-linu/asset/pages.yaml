- pgno: 320
  md: '+   If a user runs the BSD or CUPS lp rm and passes a dash (-) to the program,
    it removes all the jobs belonging to the user. LPRng uses a !1 instead of a dash
    for this purpose.


    +   If root runs the BSD or CUPS lp rm and passes a dash (-) to the program, it
    removes all print jobs belonging to all users. Again, LPRng uses a !1 for this
    purpose.


    This program may be run by root or by an ordinary user, but as just noted, its
    capabilities vary depending on who runs it. Ordinary users may remove only their
    own jobs from the queue, but root may remove anybody’s print jobs.


    Suppose the print job you identified earlier with lpq is improper. You could remove
    it from the queue:


    ```

    $ lp rm 1048

    ```


    As shown, this command will work only if you’re the owner of the job in question
    (recall that a leading dollar sign, $, denotes a command issued by an ordinary
    user). If root issues this command, it will terminate any print job. Of course,
    if the job has already been sent to the printer, this command will have no effect.


    # Controlling the Print Queue with lpc


    The lpc utility starts, stops, and reorders jobs within print queues. The lpc
    utility takes commands, some of which require additional parameters. You can pass
    the printer name with -P, as with other printer utilities, or you can pass this
    information without the -P parameter. In the latter case, the print queue name
    appears immediately after the command.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_320_0.png)


    > Although lpc is an important part of the BSD LPD and LPRng printing system,
    its functionality in CUPS is very limited. Instead, CUPS uses its Web-based control
    system to enable, disable, and otherwise modify printer status and individual
    print jobs.


    You can use several commands with lpc, including status, abort, start, stop, disable,
    enable, and topq. Of these commands, only status works with CUPS, so I don’t describe
    lpc in great detail. If you’re using a system with the older BSD LPD or LPRng
    printing systems, though, you might want to peruse the man page for the program
    to learn more about its capabilities.


    If you’re using CUPS, you can disable a queue by clicking the Stop Printer link
    for the printer on the CUPS Web interface (Figure 6.4). When you do so, this link
    changes to read Start Printer, which reverses the effect. The Jobs link also provides
    a way to cancel and otherwise manage specific jobs.


    Although ordinary users may run lpc, for the most part, they can’t do anything
    with it. Typical lpc operations require superuser privileges.


    # Using GUI Printing Tools


    The text-mode printing tools are very useful for handling print jobs on the command
    line, and they’re also used behind the scenes by many GUI programs. Some of these
    programs use elaborate'
