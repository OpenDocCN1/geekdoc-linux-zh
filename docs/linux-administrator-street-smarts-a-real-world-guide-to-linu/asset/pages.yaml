- pgno: 297
  md: '# Setting User Web Page Options


    To enable ordinary users to create their own Web pages, you must enter or uncomment
    the following lines:


    ```

    UserDir enable

    UserDir public\_html

    ```


    Most default Apache configuration files include the first of these options, but
    set to disable, and a commented-out version of the second option. Look for these
    options in the existing file and set them in this way. (You can change public\_html
    to another directory, if you like.)


    The public HTML options rely on an Apache module called mod\_userdir. If this
    module isn''t loaded, these features won''t work. Near the start of your Apache
    configuration file, you should see a series of LoadModule lines. Look for one
    that loads the mod\_userdir module:


    ```

    LoadModule userdir\_module modules/mod\_userdir.so

    ```


    If you can''t find such a line, or if it''s commented out, add it or uncomment
    it. If your line differs slightly from the one shown here, leave it as is.


    To prepare user Web pages, first ensure that the public\_html directory is present
    in a user''s home directory. You can then copy HTML files into this directory,
    including one called index.html. (Use a variant of Listing 6.4 if you like.) Finally,
    ensure that the public\_html directory has world read and execute permissions
    and that the user''s home directory has world execute permissions. If these permissions
    aren''t present, Apache won''t be able to read the user''s Web pages.


    Upon restarting Apache, you should now be able to access user Web pages by using
    a URL of the form http://www.pangaea.edu/~user/, where user is the username. The
    same page should appear no matter what hostname you use to access the server.
    If this process doesn''t work, consult your Apache error logs, which are usually
    located in a subdirectory of the /var/log directory.


    # Criteria for Completion


    To complete this task, you should have enabled an Apache server and set it up
    to deliver two different Web sites depending on the hostname used to access the
    server (www.pangaea.edu or www.mesozoid.edu, for instance). You should also reconfigure
    the server to enable user Web pages, as maintained by individual users in their
    own home directories. Once you''ve finished this task, be sure to disable or (better)
    uninstall the Apache server unless you have a valid reason for running it. Because
    of its high profile, Apache is even more of a security risk than most servers
    and so should not be left running unnecessarily.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Task 6.8: Manage a File Sharing Server


    A file sharing server enables users working on separate computers to store their
    files on one central computer. The same technologies enable users to share files
    directly with one another from their workstations (using a so-called peer-to-peer
    configuration). File sharing, either using a central server or a peer-to-peer
    arrangement, is a great boon for many offices because it can simplify sharing
    of files between users. In the case of centralized servers, backup of the most
    critical work files is also simplified. As you might expect, Linux can function
    as a file sharing server, and this task describes how to configure Linux in this
    way, using either of two protocols.


    # Scenario


    Your office network includes several types of workstations, which run Linux, Mac
    OS X, and Windows OSs. You want to enable users of all of these platforms to easily
    collaborate on projects, and you’ve determined that a file sharing server will
    help accomplish this goal. Therefore, you want to configure a Linux system, sirius.example.com,
    as a file sharing server. The Linux and Mac OS X clients, being Unix-like OSs,
    will use the Network File System (NFS) to access the Linux server. The Windows
    systems, on the other hand, will use their native Server Message Block/Common
    Internet File System (SMB/CIFS) protocol.


    You want to give users home directories on the server computer, enabling them
    to read and write their own files. You also want to share two more directories:
    /opt/c1part holds a clip art collection that should be readable, but not writable,
    to all users; and /home/xfers is a directory that’s dedicated to file transfers
    (it should be readable and writable to all users).


    # Scope of Task


    This task is fairly involved because it requires configuring two servers: Linux’s
    native NFS server for NFS and the Samba server for SMB/CIFS. Fortunately, both
    servers ship with default configurations that should be close to what you need
    in most ways. The Samba server requires more extensive changes to meet the scenario’s
    requirements.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_298_0.png)


    # Duration


    This task should take one to two hours to complete. Making small changes to each
    server’s configuration should take very little time, but setting a server up from
    scratch—particularly a Samba server—requires attending to a number of small but
    important details.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Task 6.8: Manage a File Sharing Server


    273


    # Setup


    You must have `root` access to the file server computer (`sirius.example.com`
    in this example). This task assumes that the NFS server and Samba packages are
    installed on this computer. If they''re not installed, you should attend to this
    matter using your distribution''s package management system (described in Phase
    3). NFS is usually installed as part of a package called `nfs-utils`, while Samba
    is usually installed as `samba, smb`, or something similar.


    Before proceeding further, you should create the directories you want to export.
    Presumably `/home` already exists and holds users'' home directories. You should
    create the `/home/xfers` subdirectory within this directory and give all users
    write privileges to this directory by changing its mode to `0777`. You should
    also create `/opt/clipart` and populate it with some clip art files if this directory
    and its files don''t already exist. Ensure that world read permissions exist on
    this directory and its files.


    # Caveats


    The usual `root`-access caveats apply to this task. In addition, both NFS and
    Samba are potentially dangerous servers to have installed. Both servers have the
    potential to hide bugs that can lead to security breaches. In addition, if they
    are misconfigured, you could give inappropriate access to critical system files
    or to confidential user files via either server. You should be very careful about
    the directories that you share and about the security-related options you apply
    to the directories that you do share.


    # Procedure


    To perform this task, you must configure both NFS and Samba. NFS configuration
    is relatively simple. Samba configuration can be quite complex, but most default
    Samba setups are close to adequate as delivered. Once you''ve configured both
    servers, you should test them from appropriate client systems.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_299_0.png)


    > In NFS parlance, directories that are made available to other computers are
    called `exports`. Such directories are called `shares` in the Samba world. Both
    words can also be used as verbs to describe the act of making the directory available.


    # Configuring NFS


    NFS uses a `trusted hosts` security model, meaning that the server trusts the
    client to do the authentication. This may seem naive in today''s world, but it
    was the norm in the days when NFS was created. The result of this design is that
    you must be `very careful` about the clients you trust. In fact, setting up that
    trust relationship is a large part of NFS configuration.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'In Linux, NFS server configuration is handled through a file called /etc/exports.
    This file contains lines that begin with a directory that’s to be shared followed
    by a list of hostnames or IP addresses that may access it, with their options
    in parentheses:


    ```

    /home taurus(rw, async) littrow(rw) 192.168.1.0/24(rw)

    /opt/clippart taurus(ro, all_squash) 192.168.1.0/24(ro)

    ```


    These examples share two directories: /home and /opt/clippart. The first of these
    exports gives users access to their home directories and to /home/xfers. Two computers
    (taurus and littrow), along with the entire 192.168.1.0/24 network block, may
    access /home, but only taurus and the same network block may access the /opt/clippart
    export. You can also specify hosts using wildcards (such as *.tuna.edu, which
    matches all systems in the tuna.edu domain), using IP addresses (as in 192.168.1.39),
    or as an NIS netgroup if your network supports NIS (as in @agroup). The options
    in parentheses specify security restrictions and other server features, such as
    the following:


    +   secure and insecure The default operation is secure, which denies access requests
    from port numbers above 1024. On Unix and Linux systems, only root may initiate
    connections using these secure ports, so this is a security feature—but not a
    very effective one in today’s environment. You can disable this protection by
    specifying the insecure option.

    +   ro and rw These options specify read-only or read/write access to the export,
    respectively. The default has changed over time; most current systems use ro as
    the default, but some older ones used rw. I recommend you set this option explicitly
    to avoid any potential for confusion.

    +   sync and async Ordinarily, an NFS server is supposed to complete certain operations
    by writing data to disk before responding to the client. This configuration is
    denoted by the sync option. You can improve performance by specifying async instead,
    which allows the server to respond to clients before the disk operation is completed.
    The drawback is that data loss is more likely in the event of a server crash.

    +   root_squash and no_root_squash By default, NFS treats accesses from the client’s
    root user (UID 0) as if they were coming from a local anonymous user, as set by
    the anonuid and anongid options, described shortly. This squashing is a security
    measure that can be overridden by specifying the no_root_squash option. Ordinarily,
    you shouldn’t use this option because it opens the door to abuses should a client
    system be compromised. It might be necessary in some cases, though.

    +   all_squash and no_all_squash Just as root access can be squashed, access by
    other users can be squashed. Specifying all_squash does so, giving access by all
    users a low privilege status. This configuration can be useful if you want to
    share a public directory to which users should be unable to write.

    +   anonuid and anongid You can set the UID and GID of the anonymous account used
    for squashing operations. To do so, use these options, an equal sign, and the
    UID or GID number, as in anonuid=703.


    In most cases, just a few options are necessary for most exports. You should always
    specify rw or ro, simply to avoid the possibility of confusion since the default
    for this option has'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'changed in the past. The async option can be a useful one if you want the best
    possible performance, but it increases the risk of losing data in the event of
    a server crash. As an added security measure, you might want to use the all_squash
    option on publicly accessible NFS exports, such as the clip art export in this
    example. (This will render files'' groups ineffective in controlling access, though.)


    You can specify different options for different computers. For instance, you might
    give one system full read/write access to the server but deliver read-only access
    to others. This configuration enables one person or a group of people (the users
    of the read/write systems) to change the contents of an export—for instance, to
    update that clip art collection.


    Because NFS was designed for Unix-to-Unix file sharing, it supports Unix-style
    ownership and permissions. Thus, you can use ordinary Linux file ownership and
    permissions tools, as described in Phase 1, to control access to files in NFS
    exports. Furthermore, Linux ownership and permission information will be preserved
    on NFS exports. This fact is most important for the /home/x/fers directory: given
    0777 (\-rwxrwxrwx) directory permissions, users will be able to create files in
    this export, but other users might or might not be able to read those files, depending
    on the files'' permissions. You must educate your users about these matters if
    they''re to make effective use of this directory.


    # Configuring Samba


    Samba was designed to share files with DOS, Windows, and OS/2 systems, and this
    fact leads to design complications. Specifically, Samba''s primary target client
    OSs support different file-system features than does Linux, so Samba must somehow
    find a way to support system bits, hidden bits, case-insensitive filenames, and
    so on. Samba''s task is also complicated by the need to provide security based
    on usernames and passwords, including a password encryption scheme that''s incompatible
    with the one Linux uses to store its own passwords. SMB/CIFS uses its own naming
    system, separate from TCP/IP hostnames, as well as dedicated network components
    to support this naming system and other SMB/CIFS features. For all of these reasons,
    Samba is a very complex server compared to NFS. To configure it, you must first
    understand its configuration file. With that knowledge in hand, you can proceed
    to setting global Samba options for your network and configuring the shares you
    want to create.


    # Understanding the Samba Configuration File


    Samba''s configuration file, smb.conf, is usually stored in the /etc/samba or
    /etc directory. Look for yours and load it into a text editor. The file contains
    comments denoted by hash marks (#) or semicolons (;). Configuration lines consist
    of an option name, an equal sign (=), and a value:


    ```

    netbios name = SIRIUS

    server string = Share and Enjoy

    ```


    These configuration lines are placed in configuration file sections, each of which
    begins with a name in square brackets:


    ```

    [global]

    ```'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'The [global] section sets global options that apply to the server as a whole.
    It also sets default values for share options. Each share definition begins with
    a configuration section name, which specifies the name by which the share can
    be accessed (with a couple of important exceptions, as described shortly). For
    instance, The [cl1part] section creates a share that clients can access as CLIPART.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_302_0.png)


    SMB/CIFS share names are case insensitive. Most smb.conf files use lowercase for
    share names in section headings. I use uppercase when referring to the shares
    as referenced from clients because they were historically used in this way beginning
    with older clients, such as DOS, that used uppercase filenames and share names.


    # Setting Global Samba Options


    Review the [global] section of your smb.conf file. Chances are most of the options
    can remain as they are; most distributions provide options that work reasonably
    well on most networks. The first two options require your attention are netbios
    name and workgroup:


    ```

    ```

    netbios name = SIRIUS

    workgroup = OFFICE

    ```

    ```


    These options set the Network Basic Input/Output System (NetBIOS) name and work-group
    name for the computer. The NetBIOS name is the SMB/CIFS equivalent of the DNS
    hostname. If you don’t set this option, Samba uses the first part of your DNS
    hostname, which is usually a reasonable choice.


    The workgroup option, though, must be set. The workgroup name is a name that SMB/
    CIFS applies on top of the NetBIOS name, similar to a domain name that’s used
    in conjunction with a DNS hostname. In most simple configurations, all the computers
    on a LAN should have the same workgroup name. Thus, you should discover what that
    name is for your site and set it appropriately in Samba.


    Another two or three global options that require attention relate to password
    authentication:


    ```

    ```

    security = User

    # password_server = 192.168.1.1

    encrypt_passwords = Yes

    ```

    ```


    The security option sets the security model used by Samba: User, Share, Server,
    or Domain. The first option is the best for a stand-alone server; it tells Samba
    to authenticate users based on a local password database. The Share option emulates
    Windows 9x/Me security, in which shares have passwords but no usernames. The Server
    and Domain options both defer authentication to another computer (known as a Domain
    controller). You can use Server authentication fairly easily by setting the password
    server option to point to your domain controller. (The preceding examples show
    this parameter commented out because it’s not needed for user-level security.)
    Using Domain in authentication also requires setting password'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'server, but you must also use external tools to explicitly join the domain—a
    topic that''s beyond the scope of this task.


    The encrypt passwords option tells Samba whether or not to encrypt passwords.
    Setting this option to Yes is required if you use a domain controller for authentication.
    If you use encrypted passwords with the User or Share options for security, Samba
    stores encrypted passwords itself, independently of the Linux passwords. This
    requires you to set up passwords, which can be a hassle. If you set encrypt passwords
    = No, Samba can use Linux''s existing password database, but passwords are sent
    in unencrypted form. Worse, all modern versions of Windows refuse to use unencrypted
    passwords by default, as a security precaution. You can reconfigure Windows clients,
    but this requires effort on all the clients. Thus, it''s usually better to encrypt
    your passwords.


    Finally, you should check that the following options are set as shown:


    ```

    local master = No

    domain master = No

    preferred master = No

    ```


    These options all refer to master browser configuration. On an SMB/CIFS network,
    a master browser is a computer that maintains lists of computers in each workgroup
    or domain. If you''re adding a Linux server to an existing network, you should
    not attempt to configure it as a master browser since incorrect configuration
    can lead to serious problems.


    You''ll find many additional global options in your smb.conf file. Unless you
    understand an option, the best course of action is usually to leave it set at
    its default value. You can consult the man page for smb.conf to learn more about
    all of these options.


    # Setting Samba Passwords


    Because encrypted passwords are the norm, chances are you''ll want to set encrypt
    passwords = Yes and set up a Samba encrypted password database. To do this, you''ll
    need to use your Linux shell and issue the smbpasswd command:


    ```

    # smbpasswd -a fred

    ```


    This command prompts you to enter a password, then to repeat this entry. It then
    creates a Samba password for fred using the password you entered. You must repeat
    this process for every user who should have an account. In practice, you might
    want to have users visit you so that they can type their own passwords.


    > The first time you use the smbpasswd command, it will complain about the lack
    of an /etc/samba/smbpasswd file. This complaint looks like an error message, but
    the utility creates the file, so nothing is wrong or needs your attention.


    The smbpasswd command will create Samba passwords only for users who already have
    regular Linux accounts. If the server computer lacks such accounts, you should
    first create them, as described in Phase 1.'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Creating passwords in this way is unnecessary if you set **security** to **Server**
    or **Domain**. In these cases, you can instead rely on the domain controller for
    authentication; however, you must still have local Linux accounts for all the
    system''s users. Methods of more tightly integrating the two systems, so that
    Samba automatically creates local accounts for users with existing domain accounts,
    *do* exist. These methods are well beyond the scope of this task, though.


    # ## Sharing Home Directories


    The scenario for this task specifies that users should be able to access their
    home directories. For NFS, this was done by exporting the `/home` directory. Although
    creating a share for `/home` is possible with Samba, a better approach is the
    `[homes]` share. This share name is a special case: It enables a share whose name
    and shared directory vary depending on the user who accesses the server. If `fred`
    accesses the server, the share''s name is `fred` and it shares `fred`''s home
    directory (probably `/home/fred`). If `sally` accesses the server, the share''s
    name is `sally` and it shares `sally`''s home directory (probably `/home/sally`).
    Most sample `smb.conf` files include a `[homes]` share definition that looks something
    like this:


    ```

    ```

    [homes]  comment = Home Directories  browseable = no  writable = yes  valid users
    = %S  create mode = 0644  directory mode = 0755

    ```

    ```


    The share''s options can vary from these, and for the most part you shouldn''t
    adjust them. You should ensure that the `writable = yes` option (or its synonyms,
    `writable = yes` or `read only = no`) is present; that ensures that users can
    write to their own home shares. The `create mode` and `directory mode` options
    set the file permissions for files and directories created via this share. You
    can adjust these options if you want stricter or looser permissions on users''
    files.


    # ## Sharing the /opt/clipart and /home/xfers Directories


    The clip art and data transfer shares both require their own definitions:


    ```

    ```

    [clipart]  comment = Clip Art Files  path = /opt/clipart  write list = sally  writable
    = No  create mask = 0644  directory mask = 0755  [xfers]  comment = Data transfer
    directory

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 305
  md: '```

    path = /home/xfers

    writable = Yes

    create mode = 0666

    directory mode = 0777

    ```


    These two shares give read-only access to the /opt/cl1part directory and read/write
    access to the /home/xfers directory. The cl1part share also grants Sally write
    access. This exception to the usual read-only access is a good way to enable one
    user to maintain an ordinarily read-only share.


    The create mode and directory mode options in the [xfers] share give all users
    full read and write access to all the files and directories created via this share.
    This configuration is useful for an open data-transfer directory that’s used for
    exchanging files. With this configuration, all users are guaranteed access to
    all other users’ files. When exchanging files transferred via NFS, though, the
    Unix-style permissions of the NFS client apply, and these might be more restrictive.


    # Testing Your Configuration


    After making changes to your NFS and Samba configurations, you can test the changes.
    To begin with, you’ll need to tell the server processes about the changes.


    In the case of NFS, you should type exportfs -ra as root to tell the server to
    re-examine /etc/exports and implement any changes you’ve made. Many distributions’
    SysV startup scripts for NFS also do this when you pass them the reload option.


    For Samba, you should use its SysV startup script; typing /etc/init.d/smb reload
    as root usually does the job, although you may need to change the path to the
    script or the script name. (Some distributions use samba rather than smb as the
    script name.)


    Once you’ve made these changes, you should test both the NFS and Samba configurations
    from appropriate clients. For NFS clients (Linux and Mac OS X systems in this
    scenario), you should mount both of the NFS exports and test access. Be sure you
    can read files from both exports (except for any directories to which you have
    restricted access) and that you can write files to your home directory and the
    /home/xfers subdirectory on the /home export. For the Samba shares, test your
    home share, the XFERS share, and the CLIPART share from a Windows system or other
    SMB/CIFS client. Be sure you can write to the first two shares but not to the
    third one. If you have problems with any of these operations, review your configurations
    and try again. Log files can also be very helpful. In most cases, Samba creates
    a whole host of log files in its own subdirectory of /var/log.


    # Criteria for Completion


    To complete this task, you should have created matching NFS exports and Samba
    shares to provide read/write access to users’ home directories and to the /home/xfers
    directory and read-only access to the /opt/cl1part directory. The NFS configuration
    is relatively simple because NFS was designed for Unix-to-Unix file sharing. The
    Samba configuration is potentially much more complex, but most Linux distributions
    ship with smb.conf files that come close to most users’ needs. Nonetheless, you’ll
    need to set a few Samba options to match your local network.'
