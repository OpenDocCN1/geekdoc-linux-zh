- pgno: 74
  md: 'Variables that are passed to the script are frequently called parameters. They’re
    represented by a dollar sign ($) followed by a number from 0 up—$0 stands for
    the name of the script, $1 is the first parameter to the script, $2 is the second
    parameter, and so on. To understand how this might be useful, consider the task
    of adding a user. As described earlier, in Task 1.6, creating an account for a
    new user typically involves running at least two commands—`useradd` and `passwd`.
    You might also need to run additional site-specific commands, such as commands
    that create unusual user-owned directories aside from the user’s home directory.


    As an example of how a script with a parameter variable can help in such situations,
    consider Listing 1.3. This script creates an account and changes the account’s
    password (you’ll be prompted to enter the password when you run the script). It
    creates a directory in the /shared directory tree corresponding to the account,
    and it sets a symbolic link to that directory from the new user’s home directory.
    It also adjusts ownership and permissions in a way that may be useful, depending
    on your system’s ownership and permissions policies.


    # Listing 1.3: A Script That Reduces Account-Creation Tedium


    ```

    #!/bin/sh

    useradd -m $1

    passwd $1


    mkdir -p /shared/$1

    chown $1.users /shared/$1

    chmod 775 /shared/$1

    ln -s /shared/$1 /home/$1/shared

    chown $1.users /home/$1/shared

    ```


    When you use Listing 1.3, you need type only three things: the script name with
    the desired username and the password (twice). For instance, if the script is
    called mkuser, you might use it like this:


    ```

    # mkuser sjones

    Changing password for user sjones

    New password:

    Retype new password:

    passwd: all authentication tokens updated successfully

    ```


    Most of the scripts’ programs operate silently unless they encounter problems,
    so the interaction (including typing the passwords, which don’t echo to the screen)
    is a result of just the passwd command. In effect, Listing 1.3’s script replaces
    seven lines of commands with one. Every one of those lines uses the username,
    so by using this script, you also reduce the chance of an error.


    Another type of variable is assigned within scripts themselves—for instance, they
    can be set from the output of a command. These variables are also identified by
    leading dollar signs, but they’re typically given names that at least begin with
    a letter, such as $Addr or $Name. These variables are the same as variables you
    can set at the command line (as described earlier, in Task 1.8), but unless you
    use the export command, they don’t become environment variables.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'For instance, consider Listing 1.4, which displays the current IP address of
    the computer on which it runs. This script uses the variable $ip, which is extracted
    from the output of `ifconfig` using `grep` and `cut` commands. (The trailing backslash
    on the second line of the script indicates that the following line is a continuation
    of the preceding line.) When assigning a value to a variable from the output of
    a command, that command should be enclosed in back-quote characters (`''`), which
    appear on the same key as the tilde (`~`) on most keyboards. These are *not* ordinary
    single quotes, which appear on the same key as the regular quote character (`''`)
    on most keyboards.


    # ### Listing 1.4: Script Demonstrating Assignment and Use of Variables


    ```

    ```shell

    #!/bin/sh

    ip=`ifconfig eth0 | grep inet | cut -f 2 -d " '' ")`

    echo ''Your IP address is $ip''

    ```

    ```


    Listing 1.4 relies on the networking command `ifconfig`, which is described in
    more detail in Phase 6. You can type `ifconfig` by itself to see what its output
    includes. The second line of Listing 1.4 uses `grep` and `cut` to isolate the
    IP address from the rest of the `ifconfig` output.


    Scripts like Listing 1.4, which obtain information from running one or more commands,
    are useful in configuring features that rely on system-specific information or
    information that varies with time. You might use a similar approach to obtain
    the current hostname (using the `hostname` command), the current time (using `date`),
    the total time the computer''s been running (using `uptime`), free disk space
    (using `df`), and so on. When combined with conditional expressions (described
    shortly), variables become even more powerful because then your script can perform
    one action when one condition is met and another in some other case. For instance,
    a script that installs software could check free disk space and abort the installation
    if there''s not enough disk space available.


    One special type of variable was mentioned earlier in this chapter: environment
    variables. Environment variables are assigned and accessed just like shell script
    variables. The difference is that the script or command that sets an environment
    variable uses the `export` command to make the value of the variable accessible
    to programs launched from the shell or shell script that made the assignment.
    Environment variables are most often set in shell startup scripts, but the scripts
    you use can access them. For instance, if your script calls X programs, it might
    check for the presence of a valid $DISPLAY environment variable and abort if it
    finds this variable isn''t set. By convention, environment variable names are
    all uppercase, whereas non-environment shell script variables are all lowercase
    or mixed case.


    # ## Using Conditional Expressions


    Scripting languages support several types of *conditional expressions*. These
    enable a script to perform one of several actions contingent on some condition—typically
    the value of a variable. One common command that uses conditional expressions
    is `if`, which allows the system to take one of two actions depending on whether
    some condition is true. The `if` keyword''s conditional expression appears in
    brackets after the `if` keyword and can take many forms. For instance, `-f` *file*
    is true if *file* exists and is a regular file; `-s` *file* is true if *file*
    exists and has a size greater than 0; and `string1 = string2` is true if the two
    strings have the same values.'
