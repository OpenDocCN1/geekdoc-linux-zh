    size, access modes supported (PIO, DMA, and UDMA), and more. Even if most of this
    information is like Greek to you, having a record of it should be useful, so save
    it to a file or print it for future reference.

    Unfortunately, both the /proc/ide directory tree and hdparm are useful only for
    PATA drives or for SATA drives that are managed by drivers in the PATA section
    of the Linux kernel. For SCSI drives and SATA drives that are handled by drivers
    in the SCSI section of the Linux kernel, less information is available through
    these methods. There is a /proc/scsi directory tree, but its contents are more
    concerned with the SCSI host adapter than with the devices it handles.'
