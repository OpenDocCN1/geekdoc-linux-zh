    near the top, commented out with hash marks (#), indicating directories on an
    FTP or Web site from which you can obtain updated packages. (These lines may be
    uncommented if you did a netwrok install initially.)


    **WARNING** Don''t add a site to /etc/apt/sources.list unless you''re sure it
    can be trusted. The apt-get utility does automatic and semiautomatic upgrades,
