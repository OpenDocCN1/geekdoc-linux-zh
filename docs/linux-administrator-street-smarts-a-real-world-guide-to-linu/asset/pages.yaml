    You should log into your Linux system and then use su to acquire superuser privileges.
    Alternatively, you may log in directly as root, although using su is preferable,
    as described in Task 1.1. You may perform this task from a text-mode login or
    within an xterm window from a GUI login. For this task, it is assumed that two
    accounts already exist on the computer—sjones and dsmt h. If your computer lacks
    these accounts (they aren''t standard), you can create them yourself by following
    the instructions for creating the first account, but change the usernames.


    # Caveats


    Account maintenance operations are potentially risky. You might accidentally delete
    or modify the wrong account. Even account creation poses risks, particularly when
    you use advanced options; you might accidentally give two accounts the same user
    ID (UID) codes, which would make them essentially interchangeable. Thus, you should
    be particularly cautious when using these commands. Because these commands require
    root access to work, the usual caveats concerning working as root also apply.


    This task assumes that you''re working on a Linux system that uses a local account
    database. Linux systems on LANs often refer to another computer for account management.
    On such systems, you would ordinarily modify accounts on the password server system
    instead of on the individual workstations and servers.


    # Procedure


    Before delving into account management tools, you should understand the fundamentals
    of how Linux manages its passwords. With a basic understanding in hand, you can
    proceed to the three parts of this task: adding an account, deleting an account,
    and modifying an account.'
