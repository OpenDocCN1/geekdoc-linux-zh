- pgno: 156
  md: '# **Scope of Task**


    This task is more about planning and preparing than actually doing. It''s therefore
    less hands-on than most other tasks in this book. You''ll need to research hardware
    and software options and plan a backup strategy for your critical file server
    computer.


    # **Duration**


    This task should take about 1 to 3 hours to complete. Actual system backups typically
    take anywhere from a few minutes to many hours, depending on the amount of data
    to be backed up and the speed of the hardware. Fortunately, backups can be performed
    with little or no user intervention, so the time you actually spend tending to
    backups, once your strategy is in place, will be minimal.


    # **Setup**


    Much of this task involves researching current hardware and planning your backup
    strategy. You can do this by using any computer with Internet access. You''ll
    also need to log into your Linux computer as an ordinary user in order to read
    documentation and perhaps write scripts.


    # **Caveats**


    Actually planning a backup strategy is fairly risk free; however, implementing
    the strategy does pose risks. You''ll need *root privileges* to install software
    and probably to back up the computer, and this presents the usual dangers. The
    riskiest part of a backup is restoring data; it''s possible to overwrite important
    files on a partially working system, making whatever problem it''s experiencing
    worse.


    # **Procedure**


    This task involves a great deal of planning: You must pick your backup hardware,
    plan a backup schedule, choose the software to be used with the hardware, prepare
    backup commands, and plan how to restore data.


    # **Selecting Backup Hardware**


    Just about any device that can store data and read it back can be used as a backup
    medium. The best backup devices are inexpensive, fast, high in capacity, and reliable.
    They don''t usually need to be *random access* devices, though. Random access
    devices are capable of quickly accessing any piece of data. Hard disks, floppy
    disks, and CD-ROMs are all random access devices. These devices contrast with
    *sequential access* devices, which must read through all intervening data before
    accessing the sought-after component. Tapes are the most common sequential-access
    devices.


    Traditionally, tapes have been the backup medium of choice. Although they''re
    sequential-access devices, they''re inexpensive on a per-gigabyte basis, and tapes
    have usually had capacities that match or exceed the capacities of typical computer
    hard disks. In the past few years,'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'though, the price gap between tapes and other media—particularly recordable
    DVDs and hard disks—has been narrowing. Thus, these devices are now often used
    for backups. Typically, recordable DVDs (or the lower-capacity CD-R or CD-RW media)
    are used for backing up basic system installations or particular projects, while
    hard disks mounted in special removable drive bays are used for complete system
    backups. Tapes can fill either role.


    If you decide to use a tape drive, your choices aren’t over. Several competing
    tape formats are in common use. These include Travan, which dominates the low
    end of the spectrum; digital audio tape (DAT), which is generally considered a
    step up; digital linear tape (DLT) and Super DLT, which are well respected for
    use on servers and networks; 8mm, which is similar to DAT but has higher capacities;
    and Advanced Intelligent Tape (AIT), which is a high-end tape medium. Each of
    these competes at least partially with some of the others. Travan drives tend
    to be quite inexpensive (typically $200–$500), but the media are pricey. The other
    formats feature more costly drives ($500–$4,000 for a single drive), but the media
    cost less. Maximum capacities vary: under 1GB for obsolete forms of Travan, 20GB
    for top-of-the-line Travan, and 160GB for the largest Super DLT drives. Overall,
    Travan is a good solution for low-end workstations; DAT is best used on high-end
    workstations, small servers, and small networks; and the other formats are all
    good for high-end workstations, servers, and networks.


    If you decide to use hard disks in removable mounts as a backup medium, you’ll
    need ordinary internal drives and mounting hardware. The hardware comes in two
    parts: a mounting bay that fits in the computer and a frame in which you mount
    the hard disk. To use the system, you slide the frame with hard drive into the
    mounting bay. You can get by with one of each component, but it’s best to buy
    one frame for each hard drive, which effectively raises the media cost. A similar
    alternative is to use external hard disks with FireWire or USB connectors. These
    can be convenient, but the external housings add to the cost. From a Linux software
    point of view, removable hard disk systems work like regular hard disks or other
    removable disk systems, like Zip disks. Most of these systems use Advanced Technology
    Attachment (ATA) disks, which you’ll access as /dev/hdb, /dev/hdc or some other
    ATA device identifier. External hard disks are usually accessed as if they were
    Small Computer System Interface (SCSI) devices. In either case, the disks are
    likely to be partitioned, and the partitions are likely to hold ordinary Linux
    filesystems.


    Optical media (recordable DVDs, CD-Rs, and CD-RWs) are odd from a software interface
    perspective: You must use tools such as cdrecord to write to them rather than
    accessing their device files directly. CD-R and CD-RW drives and media are very
    well standardized, from both a software and a hardware perspective, so buy these
    based on price and features. Several competing recordable DVD formats exist, though,
    and the market is constantly changing. If you need the higher capacity of a recordable
    DVD, you should research the current marketing and formats before buying. (You
    should be able to use cdrecord or similar Linux programs to write to any recordable
    DVD drive, though.)


    You should go online and check backup hardware options from computer retailers.
    Decide what basic format to use based on your needs. For a departmental file server,
    a high-capacity tape or removable disk option is probably best. Check current
    prices for both the drives (or removable mounts) and their media. Look up data
    transfer speeds and capacities and decide which options are most appealing and
    why.'
  merge: -1
  img_proc: true
- pgno: 158
  md: "# Planning a Backup Schedule\n\nRegular computer backup is important, but precisely\
    \ *how* regular is a matter that varies from one system to another. If a computer’s\
    \ contents almost never change (as might be true of a dedicated router or a workstation\
    \ whose user files reside on a file server), backups once a month or even less\
    \ often might be in order. For critical file servers, once a day is not too often.\
    \ You’ll have to decide for yourself just how frequently your systems require\
    \ backup.\n\nEven the most zealous backup advocate must admit that creating a\
    \ full backup of a big system on a regular basis can be a tedious chore. A backup\
    \ can easily take several hours, depending on backup size and hardware speed.\
    \ For this reason, most backup packages support *incremental backups*. An incremental\
    \ backup scheme involves creating a full backup first. On subsequent backups,\
    \ only those files that have changed since the last full or incremental backup\
    \ are backed up. This scheme saves backup time and reduces the need for backup\
    \ capacity, but at a cost: Data restoration becomes more complex because you may\
    \ need to use multiple backup media to restore your data.\n\nDespite these problems,\
    \ incremental backups can be an extremely useful tool for helping make backups\
    \ manageable. They can also reduce wear and tear on backup devices and media,\
    \ and they can minimize the time it takes to restore files if you know that the\
    \ files you need to restore were backed up on an incremental tape.\n\n> **WARNING**\
    \  \n> Whether you perform incremental backups or nothing but complete backups,\
    \ you should maintain multiple backups. Murphy’s Law guarantees that your backup\
    \ will fail when you need it most, so having a backup for your backup (even if\
    \ it’s from a week or a month earlier!) can help immensely. A typical backup plan\
    \ includes a rotating set of backup tapes. For instance, you might have two tapes\
    \ per week—one for a full backup on one day and one for several incremental backups.\
    \ Eight tapes will then hold backups for four weeks.\n\nYou should also consider\
    \ how much data to back up. Sometimes, backing up an entire computer is the best\
    \ approach. A full backup like this enables you to quickly recover the entire\
    \ system if it should fail. Often, though, a partial backup is tempting because\
    \ it can save backup time and media. You might back up just the /home directory\
    \ on a workstation or whatever directory holds a file server’s files. Such a backup\
    \ enables you to recover lost user files easily, but if the entire system goes\
    \ south, you’ll need to re-install the base OS from scratch and then recover user\
    \ files from the backup.\n\n> **TIP**  \n> If you decide to do a partial backup,\
    \ be sure to include your system configuration files. Backing up /etc should do\
    \ this job. You might not want to restore the entire /etc directory over whatever\
    \ you re-install, but if you back it up you’ll at least be able to restore changes\
    \ to important configuration files with relative ease.\n\nAt this point, you should\
    \ plan your backup schedule. How often do you want to create full backups? What\
    \ about incremental backups? Bear in mind that there are no completely right or\
    \ wrong answers to these questions, although some backup plans will become unwieldy\
    \ or will prove to be inadequate when ultimately tested."
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Choosing Backup Software


    You can back up a Linux system, or a portion thereof, using any of many different
    programs. Some of the more popular programs for creating backups include the following:


    +   * **AMANDA**  The Advanced Maryland Automatic Network Disk Enabler (AMANDA)
    is a powerful network-based backup tool. It builds on dump or tar to enable one
    computer to serve as a backup station for potentially dozens of other computers.
    The project’s home page is http://www.amanda.org.


    +   * **BRU**  The Backup and Restore Utility (BRU) is a commercial backup package
    for Linux and other Unix-like systems. It creates an archive of backup files at
    the start of the backup, so you can easily view a list of backed-up files and
    select those you want to restore from the list. It can be used to back up individual
    systems or an entire network. The core utility is text based, but BRU also comes
    with a unique GUI front end. You can read more at http://www.bru.com.


    +   * **cp**  The standard Linux cp command can be used to create backups on disk
    media but not on tapes. Ordinarily, cp modifies file characteristics, such as
    the owner; however, if you add certain options, such as -a, cp does a better job
    of preserving this information.


    +   * **cpio**  This program is a popular archiving tool for Linux. You can use
    it to create an archive directly on a tape, or you can pipe its output through
    dcrecord to create a cpio-format optical disc.


    +   * **tar**  The tar program has long been a staple in the Linux world. It’s
    conceptually very similar to cpio, but tar has become the standard archive format
    for exchanging file collections on the Internet. Its name stands for tape archiver,
    so you might expect, it can be used to archive a filesystem directly to tape.
    You can also use it with dcrecord to create a tar-format optical disc.


    +   * **dump**  This program has traditionally been a popular Unix and Linux backup
    tool; however, it has several limitations. Most importantly, it can’t be counted
    upon for 100 percent reliable operation with modern kernels. For this reason,
    Linus Torvalds himself recommends against its use, and it’s hard to argue with
    such a recommendation!


    As a general rule, tar is the most popular and lowest-common-denominator backup
    tool, but it’s not always the best choice. AMANDA and BRU are particularly worthy
    of note for backing up a network. AMANDA includes automatic backup scheduling
    tools that can greatly simplify the backup and restore procedures. The cost is
    that it takes a great deal of effort to configure AMANDA on both the backup server
    and its clients.


    > > **WARNING**

    > > Most backup programs don’t encrypt their data. An unauthorized individual
    who obtains your backup can read sensitive data even if the files have restrictive
    permissions on the original hard disk. Therefore, you should treat backup media
    as you would other sensitive documents. If you deal in unusually sensitive data,
    you may want to consider adding encryption to your backups to protect them in
    the event they’re stolen or “borrowed.”'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# ### Preparing Backup Commands


    Once you''ve decided on your hardware, backup schedule, and software, you can
    begin preparing the commands you''ll need to back up your software. To do this,
    you should peruse the man pages or other documentation for your backup software.
    The approach you take can vary greatly depending on the decisions you''ve made
    to date. Therefore, your solution might be very different from another person''s
    solution.


    As an example, consider using `tar` to back up a computer. Specifically, suppose
    you want to back up the root directory `/`, `/home`, and `/usr`. These directories
    are backed up to a SCSI tape drive (`/dev/st0`) with the following command:


    ```

    ```

    # tar --create --verbose --one-file-system --file /dev/st0 / /home /usr

    ```

    ```


    The `--create` option tells `tar` to create a backup; `--verbose` causes it to
    display a list of files as they''re backed up; `--one-file-system` tells `tar`
    to not descend into filesystems mounted on those specified for backup; `--file
    /dev/st0` specifies `/dev/st0` as the backup device; and the remaining options
    list the directories that are to be backed up. This command can be abbreviated
    as follows:


    ```

    ```

    # tar cvf /dev/st0 / /home /usr

    ```

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_160_0.png)


    Using `--one-file-system` and backing up each partition explicitly is generally
    a good idea. If you try to simply back up the root partition and all mounted partitions,
    your backup will include the contents of `/proc`, any removable media that happen
    to be mounted, and perhaps other undesirable directories. The extra data will
    consume space on your backup media and may cause problems when you restore the
    data.


    Studying `tar`''s man page will give you information on additional `tar` options.
    One that deserves explicit mention is the method of creating incremental backups:


    ```

    ```

    # tar cpvif /dev/st0 --listed-incremental /var/log/incr.dat / /home /usr

    ```

    ```


    This command backs up all three partitions to `/dev/st0`. The `--listed-incremental
    /var/log/incr.dat` option tells `tar` to use `/var/log/incr.dat` as an index of
    previously backed-up files. When you run this command to create a full backup,
    this file should be empty or nonexistent; `tar` then populates it with a date
    code and information about each directory that''s been backed up. If you later
    add files to a directory, `tar` can determine which files are new and back them
    up.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_160_1.png)


    You may want to use output redirection (>) to store the verbose output of `tar`
    in a file when backing up. This procedure will create a file that lists the contents
    of the backup, which can make it easier to locate files for restore. When you
    perform an incremental backup, store the data to different files or use the appending
    output redirection (>>) so that you don''t wipe out the full backup''s file list.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'In many cases, you can use *cron* to schedule automatic backups on a regular
    basis. (The upcoming Task 3.8, “Schedule Jobs to Run in the Future,” describes
    *cron* in more detail.) To do so, you would create one or more *backup* scripts
    (Phase 1 describes scripting) and enter them as *cron* jobs to be run at regular
    times, such as once a day. When *cron* is so configured, all you need to do to
    perform a *backup* is to swap *backup* media.


    If you’ve opted to use *recordable* optical media (CD-R, CD-RW, or recordable
    DVD drives), you should be aware that you can’t write directly to these media
    using *tar* or similar tools. Instead, you must create a *tarball* on disk and
    then either write that *tarball* or wrap the *tarball* in an ISO-9660 *filesystem*
    and write it to disk. The tool for writing to optical media is *cdrecord*; consult
    its *man* page for details of its operation.


    # Planning a Restore Strategy


    Creating *backups* is advisable, but doing this isn’t enough. You must also have
    some way to restore *backups* in case of *disaster*. This *task* involves two
    *aspects*: *partial* restores and *emergency* recovery.


    Partial restores involve recovering just a few *noncritical* files. For *instance*,
    users might come to you and ask you to *restore* files from their *home* *directories*.
    You can do so *fairly* easily by using the -extract (x) tar command, as in the
    following *lines*:


    ```

    ```

    # cd /

    # tar xvlpf /dev/st0 home/username/file name

    ```

    ```


    > **NOTE** This *sequence* involves *changing* to the *root* *directory* and *issuing*
    a *relative* *path* to the *file* or *directory* that *must* be *restored*. This
    is *required* because *tar* normally *strips* away the *leading* / in the *names*
    of *files* it *backs* up, so the *files* are *recorded* in the *archive* with
    *relative* *filenames*. If you *try* to *restore* a *file* with an *absolute*
    *filename*, it won’t *work*.


    With most *backup* *programs*, you’ll *need* to know the *exact* *name* of the
    *file* or *directory* you *want* to *restore* in *order* to do *this*. If you
    *don’t* know the *exact* *filename*, you *may* need to use the -list (t) command
    to tar (or its *equivalent* in other *programs*) to *examine* the *entire* *contents*
    of the *tape*, or at *least* *everything* until you *see* the *file* you *want*
    to *restore*.


    > **TIP** If you *use* *incremental* *backups*, you *can* use the *incremental*
    *file* *list* to *locate* the *name* of the *file* you *want* to *restore*.


    A *much* *more* *serious* *problem* is the *fact* of *recovering* a *system* that’s
    *badly* *damaged*. If your *hard* *disk* has *crashed* or your *system* has been
    *invaded* by *crackers*, you *must* *restore* the *entire* *system* *from* *scratch*,
    without the *benefit* of your *normal* *installation*. You *can* *take* *any*
    of *several* *approaches* to *this* *problem*, *including* the *following*:


    Distribution’s *installation* disk Most *Linux* *distributions’* *installation*
    *disks* have *some* sort of *emergency* recovery *system*. These *may* come as
    *separate* *boot* *floppy* *images* or as *options*'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'to type during the boot process. In any event, these images are typically small
    but functional Linux systems with a handful of vital tools, such as fdisk, mkfs,
    Vi, and tar. Check your distribution’s documentation or boot its boot media and
    study its options to learn more.


    CD-based Linux system Several Linux systems are now available that boot from CD-ROM.
    One example is Knoppix (http://www.knoppix.com); another is a demo version of
    openSUSE (http://www.novell.com/linux/). Both of these systems can be used to
    help recover or restore a corrupted Linux installation.


    Emergency system on removable disk You can create your own emergency system on
    a removable disk. If you have a moderately high-capacity removable disk, like
    a Zip or LS-120 disk, you can create a moderately comfortable Linux system on
    this disk. The ZipSlack distribution (a variant of Slackware, http://www.slackware.com)
    is particularly handy for this purpose because it’s designed to fit on a 100MB
    Zip disk. You can use this even if your regular installation is of another version
    of Linux.


    Emergency recovery partition If you plan ahead, you might create a small emergency
    installation of your preferred distribution alongside the regular installation.
    You should not automatically mount this system in /etc/fstab. This system can
    be useful for recovering from some problems, like software filesystem corruption,
    but it’s not useful for others, like a total hard disk failure.


    Partial reinstallation You can reinstall a minimal Linux system and then use it
    to recover your original installation. This approach is much like the emergency
    recovery partition approach, but it takes more time at disaster recovery. On the
    other hand, it will work even if your hard disk is completely destroyed.


    Whatever approach you choose to use, you should test it before you need it. Learn
    at least the basics of the tools available in any system you plan to use. If you
    use unusual backup tools (such as commercial backup software), be sure to copy
    those tools to your emergency system or have them available on a separate floppy
    disk. If you’ll need to recover clients via network links, test those setups as
    well.


    You may not be able to completely test your emergency restore tools. Ideally,
    you should boot the tools, restart a system, and test that the system works. This
    may be possible if you have spare hardware on which to experiment, but if you
    lack this luxury, you may have to make do with performing a test restore of a
    few files and testing an emergency boot procedure—say, using LOADLIN (a DOS-based
    boot loader that can boot a Linux system when LILO or GRUB isn’t installed or
    working). Note that a freshly restored system will not be bootable; you’ll need
    a kernel on a DOS boot floppy and LOADLIN, or some other emergency boot system,
    to boot the first time. You can then reinstall LILO or GRUB to restore the system’s
    ability to boot from the hard disk.


    # # Criteria for Completion


    This task is about planning a backup strategy. To complete it, you should have
    a complete plan for backing up a departmental file server. This plan should include
    specifics on the hardware you'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'plan to use, your backup schedule, the software you intend to use, commands
    or procedures to perform backups (perhaps including scripts to be called by cron),
    and a plan for restoring data (both partial and full restores). If possible, you
    should implement and test your backup plan. If this isn''t possible and you''re
    administering a true production Linux system, make it possible. Murphy''s Law
    applies to backups, and if you don''t plan for disaster, it will strike.


    # Task 3.5: Manage Running Processes


    Running processes must sometimes be monitored and even terminated. You might want
    to monitor a process if you have reason to believe it might consume undue amounts
    of CPU time or if the process is taking a long time to do its job. If you conclude
    that the process is hung (that is, unresponsive to input), is working but is consuming
    too much CPU time, or is otherwise misbehaving, you may want to terminate it.


    # Scenario


    Users of a multi-user Linux system are reporting sluggish performance. You must
    troubleshoot this problem and, if appropriate, terminate any program that''s misbehaving
    or simply consuming too much CPU time.


    # Scope of Task


    This task involves checking running processes in various ways and terminating
    those processes. Most of the commands are fairly simple, but some of them have
    many options.


    # Duration


    This task should take about half an hour to complete, although you can spend more
    time studying all the ps options if you like. Performing simple checks of processes
    can take just a few seconds, but you may want to do this job multiple times each
    day on a working system. In fact, for critical systems, you might want to set
    up a cron job (described in Task 3.8) to perform checks of system load on a regular
    basis.


    # Setup


    You need access to a working Linux system with an X server installed. You should
    log into your Linux system as an ordinary user; root access is not required to
    complete this task, although in real situations it often is needed. In order to
    simulate an out-of-control process, you should launch glxgears from X. The glxgears
    program is a simple program to test the speed of OpenGL 3D extensions to X; it
    produces a window in which three simulated 3D gears spin continuously. Every few
    seconds, it displays benchmark data in frames per second (FPS). The point of using
    glxgears is that it tends to hog CPU time, similar to the way many out-of-control
    programs do, enabling you to practice tracking excessive CPU use.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Caveats


    This task presents few risks, although when performing real-life process management
    as **root**, the usual `root` caveats apply. It''s possible that you''ll terminate
    the wrong process if you enter a typo, and this risk can have more serious consequences
    when you work as **root**—you could accidentally terminate a critical server,
    for instance.


    # Procedure


    To perform this task, you''ll use three process-monitoring tools. First, you''ll
    check the overall system load—that is, how much of the system''s available CPU
    time all the running programs are demanding. Second, you''ll obtain static process
    listings. Third, you''ll use a dynamic tool that''s particularly helpful for spotting
    processes that are out of control. Once you''ve identified an out-of-control process,
    you can terminate it.


    # Checking System Load


    The system load is most often measured as a *load average*, which is a number
    from 0 upward. A load average of 0.0 means that no processes are demanding CPU
    time. A load average of 1.0 means that programs are demanding exactly as much
    CPU time as the CPU has to offer. A load average greater than 1.0 means that programs
    are demanding more CPU time than is available, requiring the kernel to ration
    CPU time. Typically, load averages are measured over some period of time, such
    as the last minute or the last 5 minutes.


    Lightly loaded systems often have load averages between 0.0 and 1.0. Such systems
    perform as well as they can, given the efficiency of the code they run and the
    speed of the CPU. (Such systems could be sluggish because of poor disk performance
    or other reasons, though; load averages only tell you about demands on CPU time.)
    When the load average climbs above 1.0, efficiency drops—programs become sluggish
    because they must compete with other programs for CPU time. Thus, ideally your
    system''s load average shouldn''t rise above 1.0.


    In practice, though, load averages do often exceed 1.0, particularly for short
    periods of time. If you run a CPU-intensive program in the background and also
    do something else, the load average will rise above 1.0, although perhaps not
    by much—it might reach 1.3 or so. Systems that are intended as multi-user computers
    often have load averages well over 1.0, and this isn''t necessarily a problem
    if the CPU is fast enough. For instance, if System A has a CPU load of 2.0 and
    a CPU that''s three times as fast as System B, System A may be faster than System
    B. The easiest way to check your system load is to use the `uptime` command, which
    displays the amount of time the system has been running, the number of users who
    are logged in, and the load averages over the past 1, 5, and 15 minutes:


    ```

    $ uptime

    13:24:49 up 31 days, 17:24, 6 users, load average: 2.34, 2.28, 1.79

    ```


    > **NOTE** The number of users reported by `uptime` is the number of simultaneous
    logins of various types. All of these logins could be by the same user.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Task 3.5: Manage Running Processes


    This example shows load averages of 2.24, 2.28, and 1.79, meaning that programs
    are demanding roughly twice as much CPU time as is available. This could indicate
    that two programs are trying to run full out and other programs are making lesser
    demands or that more than two programs are requesting something less than full
    CPU time. You''ll need to perform additional tests to find out precisely what''s
    happening. The fact that the CPU load is higher for the shorter intervals (1 and
    5 minutes) than for the longer one (15 minutes) is a clue that the CPU hogging
    began in the last few minutes.


    # Obtaining Static Process Listings


    The main process-monitoring tool in Linux is **ps**. This program supports a huge
    number of options, which fall into three broad classes:


    +   **Unix98 options**  These single-character options may be grouped together
    and are preceded by a single dash (-).


    +   **BSD options**  These single-character options may be grouped together and
    must *not* be preceded by a dash.


    +   **GNU long options**  These multi-character options are never grouped together.
    They''re preceded by two dashes (–).


    For a complete list of **ps** options, consult the program''s *man* page. Some
    of the more useful **ps** features include the following:


    +   **Display help**  The `--help` option presents a summary of some of the more
    common **ps** options.


    +   **Display all processes**  By default, **ps** displays only processes that
    were run from its own terminal (`xterm`, text-mode login, or remote login). The
    `-A` and `-e` options cause it to display all the processes on the system, and
    `x` displays all processes owned by the user who gives the command. The `x` option
    also increases the amount of information that''s displayed about each process.


    +   **Display one user''s processes**  You can display processes owned by a given
    user with the `-U` *user*, `U` *user*, and `--user` *user* options. The *user*
    variable may be a username or a user ID.


    +   **Display extra information**  The `-f`, `-l`, `j`, `l`, `u`, and `v` options
    all expand the information provided in the **ps** output. Most **ps** output formats
    include one line per process, but **ps** can display enough information that it''s
    impossible to fit it all on one 80-character line. Therefore, these options provide
    various mixes of information.


    +   **Display process hierarchy**  The `-H`, `-f`, and `--forest` options group
    processes and use indentation to show the hierarchy of relationships between processes.
    These options are useful if you''re trying to trace the parentage of a process.


    +   **Display wide output**  The **ps** command output can be more than 80 columns
    wide. Normally, **ps** truncates its output so that it will fit on your screen
    or `xterm`. The `-w` and `w` options tell **ps** not to do this, which can be
    useful if you direct the output to a file, as in `in ps w > ps.txt`. You can then
    examine the output file in a text editor that supports wide lines.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'As an example, consider a command to display all of a particular user''s processes:


    ```

    $ ps U jennie

    PID TTY   STAT TIME COMMAND

    12172 pts/15 S+   0:00 bash

    12182 pts/15 S+   0:00 xterm

    12184 pts/21 Ss   0:00 bash

    12189 pts/21 S+   0:00 xv gearse.jpg

    ```


    This output indicates that the user **jennie** is running four processes: two
    instances of **bash**, an **xterm**, and the xv program, which was passed **geese.jpg**
    as a command-line option. You should note the output column that''s labeled **PID**.
    This acronym stands for *process ID*, and it''s a unique way to identify a particular
    process. Certain methods of terminating processes or changing their priorities
    require you to know the PID, so if you plan to terminate a process or change its
    priority, you should note and remember the PID.


    This output isn''t particularly helpful in finding runaway processes; however,
    you can use the u option to generate a display that includes a column (marked
    **%CPU**) that shows the percentage of total CPU time that goes to particular
    processes. This option is particularly helpful with the a option, which display
    all running processes rather than just those associated with the current login
    session:


    ```

    $ ps au

    ```


    If you try this command, though, you''ll find that the output is quite lengthy;
    you may need to pipe it through **less** to peruse the output and spot the CPU
    hogs. If you try this, you should find that **g1xgeears** is consuming a great
    deal of CPU time. Another trick that''s useful is to use **grep** to locate specific
    processes by name:


    ```

    $ ps au | grep g1xgears

    rodsmith 12049 30.0 0.9 23292 5116 pts/4 RL+ 13:07 12:09 g1xgears

    rodsmit h 12248 0.0 0.1 2612 532 pts/15 S+ 13:47 0:00 grep g1xgears

    ```


    This approach isn''t really very helpful for locating CPU hogs unless you already
    suspect a particular program and merely want to confirm that suspicion. This method
    is helpful if you suspect a process is acting up in some way, even if it''s not
    CPU related. For instance, a process might not have terminated correctly, in which
    case you can use this method to quickly locate its PID number (which is in the
    second column in this output format).


    # Locating Processes Dynamically


    Although **ps** is the basic Linux process-identification tool, another tool is
    more helpful in many cases. This program is known as **top**, and it''s a dynamic
    variant of **ps**—by default, **top** enters an interactive mode in which it updates
    its display on a regular basis (every 3 seconds, by default). Furthermore, **top**
    sorts its process listing according to criteria you select, with the default being
    CPU time. This makes **top** particularly helpful for locating CPU hogs. Figure
    3.1 shows typical **top** output.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Task 3.5: Manage Running Processes




    ![](img/f430a19bdf014c43ad7c2d594afd5b21_167_0.png)


    Figure 3.1 shows that the biggest CPU user is glxgears, with a PID of 12049. This
    process is consuming 94.8 percent of the available CPU time. If you watch the
    top output for a while, particularly if you run it in an xterm and work in other
    X windows, you’ll see the top display change over time. If you type in a word
    processor, for instance, its process will probably rise to the top of the list
    while you type, even with a CPU hog like glxgears running.


    You can tell top to sort its list by criteria other than CPU use, too. One of
    the most helpful of these options is to sort by memory use. Type **M** (without
    pressing the Enter key) to have top sort by the %MEM (memory use) field. Typing
    **N** sorts by PID number, **T** sorts by cumulative CPU time, and **P** returns
    to the default of percentage CPU time. (Cumulative CPU time is the total CPU time
    the process has used. This value can climb quite high even for programs that aren’t
    CPU hogs if they run for long enough.)


    When you’re done with top, type **q**. This command terminates the program.


    # Terminating Processes


    Now that you’ve identified the CPU-hogging program as glxgears, you must decide
    what to do about it. Several possibilities exist:


    **Do nothing** You might decide to do nothing. Some processes legitimately consume
    a lot of CPU time. Knowing what’s a legitimate CPU user requires knowledge of
    your local system. Perhaps a user is running a legitimate CPU-intensive simulation
    or data analysis and you wouldn’t want to terminate such processes.


    **Investigate further** If you don’t recognize the process’s name, you might try
    consulting its man page or otherwise investigating the process. This should give
    you information that will help you make a decision.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# **Contact the process''s owner**


    If you think the process may be out of control but you''re not positive of that,
    you might try contacting the owner of the process. For instance, most word processors
    consume CPU time in brief bursts. If a word processor is consuming 90 percent
    or more of the system''s CPU time on a continuous basis, that fact is suspicious
    and could indicate that the process has *hung*—that is, that it''s stopped responding
    to input but is still consuming CPU time. Before terminating the process, though,
    you should contact the user who owns it to be sure that the program isn''t being
    used for something legitimate. Perhaps the user is running a lengthy mail merge
    or printing a book-length document.


    # **Reduce the process''s priority**


    If the process has a legitimate reason for being run but is interfering with other
    users, you might consider reducing its priority. This will let the process run,
    but other processes will get more CPU time. Task 3.6, “Adjust Process Priorities,”
    describes this approach.


    # **Terminate the process**


    Finally, you might decide to terminate the process. This action is something of
    a last resort, and you normally take it only when processes are misbehaving. (You
    can use the same command to shut down servers, but most distributions provide
    startup and shutdown scripts that are better for this task.)


    The basic command for process termination is `kill`, and it takes a PID number
    as an argument:


    ```

    $ kill 12049

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_168_0.png)


    After killing a process, you should check to be sure that it''s been terminated.
    Some processes don''t respond when you kill them in this way; you may need to
    add an option to have `kill` send a more forceful signal to the process:


    ```

    $ kill -9 12049

    ```


    When used without an argument, `kill` sends a `TERM` signal (signal number 15)
    to the process, which is a polite way to ask a process to shut down. The `-9`
    parameter passes a `KILL` signal to the process, which terminates all but the
    most badly behaved processes. You can usually substitute `-KILL` or `-SIGKILL`
    for `-9`, but details vary from one shell and implementation to another.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_168_1.png)


    Another way to kill processes is to use `top`. If you type `k` from within `top`,
    the program displays the prompt `PID to kill`: just above the process list. You
    can then type the PID of the offending process, whereupon `top` asks for the signal
    number to pass to the process. Type **15** or press the **Enter** key to pass
    a `TERM` signal to the process, or type **9** to deliver a `KILL` signal. You
    can send other signals in the same way.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'In addition to `kill` and `top`, another tool for killing processes is `killall`.
    This program works much like `kill`, but it accepts a process name, rather than
    a PID number, as a way to identify the process to be killed. Although `killall`
    can be a quick and easy way to kill a process if you know its name, it can be
    dangerous because it kills all instances of that process. For instance, if `root`
    were to type `killall bash`, all `bash` shells would be terminated. Thus, you
    should be sure you want to terminate all instances of a process before using `killall`.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_169_0.png)


    > Some Unix-like systems implement a `killall` program that kills all running
    processes, not just all running processes of a particular name. Thus, you should
    never use `killall` on an unfamiliar system unless you''re sure that the program
    works in the way you expect!


    After killing the `g1xgears` process, wait a short time and then use `uptime`
    and `top` again. You should find that your load average has dropped, although
    it will take a few minutes for the longer-term load average figure to change significantly.


    # ## Criteria for Completion


    To complete this task, you should have determined your system''s CPU load, identified
    running processes with `ps`, used `top` to identify CPU-hogging programs, and
    terminated processes with `kill`, `killall`, or `top`. These tools will help you
    manage your Linux system, keeping misbehaving processes from causing too many
    problems. Running `uptime` every now and then on critical systems will help you
    keep the systems working well by enabling you to spot runaway processes before
    they cause too much damage.


    # # Task 3.6: Adjust Process Priorities


    Sometimes a program has a legitimate need to consume a lot of CPU time but you
    don''t want it to consume that CPU time at the expense of other processes. For
    such situations, the ability to downgrade a process''s priority is useful, and
    of course Linux provides that ability. You can also increase a process''s priority
    if it should have precedence when the kernel doles out CPU time. Knowing how to
    make these adjustments will enable you to keep your system running smoothly without
    going to the extreme measure of terminating processes.


    # ## Scenario


    A computer is functioning as a multipurpose system with several important processes
    running. Some of these processes consume a lot of CPU time, but you want to keep
    them from interfering with other processes. Thus, you want to adjust their process
    priorities. You''ll both adjust the priorities of existing processes and run new
    processes with modified priorities.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Scope of Task


    This task involves learning to use the `nice` and `renice` commands, which enable
    you to adjust process priorities. To do this, you’ll need multiple test processes
    on which to experiment so that you can judge the effect of the commands.


    # Duration


    This task should take about half an hour to complete. In day-to-day practice,
    adjusting the priority of a process takes just a few seconds once you’re familiar
    with the relevant commands.


    # Setup


    To begin this task, you should log in as an ordinary user. (Real-world applications
    of this task’s principles often require *root* access, though. As with killing
    processes, ordinary users may adjust their own process priorities, but only *root*
    may adjust the priorities of other users’ processes.) Either log in using a GUI
    login prompt or log in using text mode and start an X session by typing `startx`.
    I recommend using X simply because it lets you launch and easily control multiple
    programs. If necessary, you could use text-mode processes and multiple virtual
    terminals instead, but you’ll need to find another CPU-intensive program to use
    for experimentation.


    # Caveats


    This task can be performed as an ordinary user, although you won’t be able to
    increase the priority of your tasks except as *root*. Thus, if you want to experiment
    with this ability, you’ll need to perform some parts of the task as *root*, with
    all the usual caveats that entails. Even as an ordinary user, if you mistype a
    command, you could conceivably cause a program to begin behaving very sluggishly.
    Recovering from such problems should be possible, but you’ll need to either exit
    from and restart the affected process or increase its priority as *root*.


    # Procedure


    To perform this task, you’ll use the `nice` command to launch programs with priorities
    that you specify and you’ll use the `renice` command to alter the priorities of
    existing processes. Before you jump into these details, though, you should understand
    the meaning of the numbers you’ll be setting.


    # Understanding Process Priorities


    Every Linux process has an associated priority number, which ranges from −20 to
    19. The default priority value is 0. Confusingly, negative priority numbers correspond
    to *increased* priority, whereas positive numbers correspond to *decreased* priority.


    The Linux kernel is responsible for doling out CPU time; the kernel decides for
    how long a given process will run before giving CPU time to a competing process.
    When no programs are making major demands on CPU time, even a low-priority process
    will get plenty of CPU'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'time; it''s only when CPU time becomes scarce (that is, when the load average
    climbs above 1) that process priorities become important.


    Ordinarily, if two processes are competing for CPU time and both have the same
    priority, the kernel divides CPU time equally between them. The effect of changing
    the priority of one process is to alter the proportion of CPU time given to the
    two processes. If the process priorities differ by just 1 (say, nice values of
    0 and 1), they''ll still get close to equal amounts of time, but the process with
    a higher nice value will get slightly less CPU time. As the difference in nice
    values increases, so does the proportion of CPU time given to the two processes.
    A process with a nice value of 19 is given so little priority that it runs only
    when no other process is demanding CPU time. This makes a nice value of 19 appealing
    for processes that are CPU intensive but not critical to overall system operation,
    such as distributed computing projects like Folding@Home (http://folding.stanford.edu).


    Intermediate nice values, such as 10, are useful when you want a job to run at
    a reasonable pace but not interfere too much with other processes. For instance,
    you might run a program compilation at a nice value of 10 if you or other users
    are doing work on the system while the compile is running.


    Most user programs, such as Web browsers, word processors, and shells, spend most
    of their time idling, waiting for keyboard input. Even if you''re typing furiously,
    the program takes far less time to process your keystrokes than you take making
    them. Thus, if you''re running, say, a word processor and a CPU-intensive ray-tracing
    program, running the ray-tracing program with a reduced priority won''t rob it
    of much CPU time; however, when your finger dies hit a key in the word processor,
    that action will take priority, so you''ll see less of a performance drop in the
    word processor than you''d see if you ran the ray tracer at normal priority.


    # ### Launching Programs with Specified Priorities


    To launch a program with reduced priority, type nice followed by the name of the
    program:


    ```

    $ nice glxgears

    ```


    This command launches the glxgears program with a nice value of 10 (the default).
    Alternatively, you can specify a particular value by using the -n value, --adjustment=value,
    or -value options before the command you''re running with nice. For instance,
    the following three commands are all equivalent to the previous one:


    ```

    $ nice -n 10 glxgears

    $ nice --adjustment=10 glxgears

    $ nice -10 glxgears

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_171_0.png)


    The -value form of adjustment makes a confusing situation worse; it looks like
    you''re specifying a negative value, but in fact the dash just indicates that
    the following number is an option to nice.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'For the purpose of this task, launch two instances of `glxgears`, one with
    normal priority and one with a `nice` value of 10. Try monitoring both processes
    using `top` (described earlier, in Task 3.5). This utility displays the `nice`
    values of processes using its `NI` column, so identifying the two processes should
    be easy. You’ll find that the `nice`-launched process will have a lower `%CPU`
    value and will rack up total CPU time (in the `TIME+` column) more slowly. You’ll
    probably also notice the difference in the rate of the gears’ spinning in the
    two windows.


    > You can use `nice` in scripts, including system startup scripts, if you want
    to regularly run a program with reduced priority.


    # Adjusting Existing Processes’ Priorities


    With your two instances of `glxgears` running, it’s time to look at how to adjust
    running processes’ priorities. You can do this with the `renice` command; however,
    with `renice` you need a way to tell the program what processes’ priorities to
    adjust. You can do so by user-name (via the `-u` option), by group ID (GID, via
    the `-g` option), or by PID (via the `-p` option). Only the final option is possible
    when you run `renice` as an ordinary user; the other methods may only be used
    by `root`. You pass `renice` an absolute priority value prior to any methods used
    to identify processes.


    For instance, suppose you want to equalize the two `glxgears` instances so that
    they both run at a `nice` value of 10. If the PID of the higher-priority instance
    is 2562, you’d use the following command to do the job:


    ```

    $ renice 10 -p 2562

    ```


    This command sets the priority of PID 2562 to a `nice` value of 10. This will
    only work if you own PID 2562 and if it currently has a higher priority (that
    is, a lower `nice` value). If you run the command as `root`, these last two restrictions
    don’t apply.


    If you continue to monitor the processes with `top`, you’ll see their CPU use
    equalize. The speed of the spinning of the gears in their windows will also equalize.
    Both sets of gears may spin slowly, though, particularly if your system is running
    other CPU-intensive tasks. If you like, you can experiment with different `nice`
    values to see the effect. You can even increase processes’ priorities by giving
    them negative values, but only if you do so as `root`.


    # Criteria for Completion


    To complete this task, you should have launched processes with varying priorities
    by using the `nice` command. You should also have successfully adjusted the priorities
    of processes you’ve already run. Using `nice` and `renice` can be an effective
    way to minimize the impact of programs that legitimately consume a lot of CPU
    time on a system that serves functions in addition to being a platform for the
    CPU-intensive program.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# # Task 3.7: Manage Runlevels


    When a Linux system boots, it enters one of seven *runlevels*, which are numbered
    from 0 to 6. Each runlevel corresponds to a specific set of running processes—servers,
    system loggers, hardware-monitoring utilities, and so on. Certain runlevels have
    particular meanings, as you can define others as you see fit. Even if you don''t
    redefine your runlevels, you should know how to switch between them because most
    distributions configure runlevels in such a way that switching between them can
    sometimes be useful.


    # ## Scenario


    You''ve installed Linux on a system that''s to function as a mail server computer.
    The basic installation for Linux on this computer starts it in runlevel 5, in
    which X runs; however, as X is unnecessary for a mail server that will seldom
    or never be used from the console, you want to change the system''s runlevel to
    3, in which X does not run. You also want to review the sub-systems that are started
    in runlevel 3 and adjust them to suit your purposes.


    # ## Scope of Task


    This task requires you to manage runlevels in various ways—to change runlevels
    both temporarily and permanently as well as to change what software is run in
    your chosen runlevel. Doing so requires you to understand how Linux manages runlevels
    and how to change these runlevels.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_173_0.png)


    Most Linux distributions start X in runlevel 5 but not in runlevel 3. A few distributions
    start X in other ways, though. Debian, for instance, doesn''t work in quite this
    way, although you can configure it to do so by adding the *xdm*, *kdm*, or *gdm*
    service to runlevel 5. Gentoo uses named runlevels rather than numbered runlevels
    and requires you to add the *xdm* service to your current run-level (probably
    named *default*) in order to start X when the system boots.


    # ## Duration


    This task should take about half an hour to complete. Once you''re familiar with
    the tools involved, changing the current runlevel or changing the programs that
    are launched in a given runlevel should take just a few seconds.


    # ## Setup


    Ideally, the computer should be configured to start in runlevel 5, but if your
    system starts in runlevel 3 or some other runlevel, you can reconfigure your system
    to run in runlevel 5 by'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'changing the appropriate numbers in the following procedure; this will cause
    most distributions to start X when they boot.


    To prepare for this task, log into your Linux system. Because your changes will
    shut down X, do not use a GUI login. If X is running, close all your X programs
    and log out of your X session. You should acquire root privileges in your text-mode
    login.


    # Caveats


    As always, working with root presents certain risks. Changing runlevels can start
    up or shut down programs—after all, that''s the point of changing runlevels. If
    your understanding of the services offered in various runlevels is imperfect,
    the result can be unexpected changes in programs that are running on your computer.
    Some runlevels are used to shut down or reboot the computer, so a mistake in changing
    runlevels can result in an unexpected system shutdown or reboot. Changing the
    software that runs in particular runlevels can cause odd problems if you mistakenly
    remove a critical item or add something inappropriate.


    # Procedure


    You can change the current runlevel on either a temporary or a permanent basis.
    Temporary changes remain in effect until you reboot the computer or manually change
    the runlevel again. Permanent changes take effect the next time you reboot the
    computer or when you type a command to explicitly enable them. Although the predefined
    runlevels that ship with most Linux distributions are good starting points, you
    may need to change what services are provided by one or more runlevels for various
    reasons. For instance, you might need to add a server to your default runlevel
    if you want the server to run by default, or remove a server from a runlevel if
    you don''t want it to run or if you intend to run it from a super server. (Phase
    6 describes super server configuration.)


    # Temporarily Changing the Runlevel


    To change the runlevel on a one-time basis, you use the telinit command:


    ```

    # telinit 3

    ```


    > WARNING

    > On most systems, this command shuts down X. Be sure you don''t have any X programs
    running with unsaved data before you type this command!


    This command shifts the system into runlevel 3, where it remains until you enter
    another telinit command or reboot the computer. Most Linux systems run in runlevel
    3 or 5, but others are available; Table 3.1 summarizes their purposes on most
    systems. Some runlevels have conventional purposes across distributions, but other
    runlevels have distribution- or system-specific functions.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Linux Runlevels and their Functions


    | Runlevel Number | Purpose |

    | :--- | :--- |

    | 0 | Shuts down the computer |

    | 1 | Single user mode |

    | 2 | Multi-user mode without Network File System (NFS) support or X |

    | 3 | Multi-user mode with NFS support but without X |

    | 4 | User-defined |

    | 5 | Multi-user mode with NFS support and X |

    | 6 | Reboots the computer |


    > > **WARNING**

    > >

    > > Do not use telinit to change to runlevels 0 or 6 unless you intend to shut
    down or reboot the computer. For these purposes, most administrators prefer to
    use the shutdown command, as in `shutdown -h now` to shut down or `shutdown -r
    now` to reboot.


    You can switch to runlevel 1 by passing 1 or S as the runlevel number. This runlevel
    is useful for performing certain types of low-level maintenance and recovery tasks
    that might be difficult or impossible with regular multiuser services running.
    For instance, you’re more likely to be able to unmount filesystems for checking,
    repair, and other changes from single-user mode than from multi-user mode.


    # Permanently Changing the Runlevel


    When the Linux kernel boots, it launches the init program, which is in charge
    of handling startup tasks. This program has a PID number of 1 and is at the root
    of the process tree—all other processes are started by init, either directly or
    indirectly. To control init, you edit its configuration file, /etc/inittab. This
    file specifies the default runlevel and provides other options that enable you
    to control the system startup process.


    > > **NOTE**

    > >

    > > The telinit command is normally a symbolic link to init. On most systems,
    you can use init instead of telinit to change runlevels, although telinit is the
    preferred name for this function.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'To change the runlevel, one line in `/etc/inittab` is important:


    ```

    id:5:initdefault:

    ```


    This line, like others in `/etc/inittab`, is a colon-delimited set of options.
    The `id` and `initdefault` options identify this line as specifying the default
    runlevel, and the number in the field between these two options denotes the default
    runlevel. Thus, to permanently change a system to use runlevel 3 rather than runlevel
    5 when it boots, you must edit this line and change 5 to 3. Making this change
    will have no immediate effect, although you can implement any changes by typing
    `telinit Q` or `telinit q`.


    The `/etc/inittab` file holds various other options, including those that launch
    programs that present text-mode login prompts (``getty``, ``mingetty``, or similar
    programs). Some distributions include a line that launches the GUI login prompt:


    ```

    x:5:once:/etc/X11/prefdm -nodmaemon

    ```


    This line launches the `prefdm` program, which chooses which of several X Display
    Manager Control Protocol (XDMCP) programs to use depending on settings in other
    configuration files. You shouldn''t need to adjust this option unless you want
    to disable X or change the way it works in runlevel 5. Not all distributions use
    this method to start X in runlevel 5, though; some use startup scripts, such as
    those described next, to do the job. These scripts are active only in runlevel
    5.


    # ### Changing the Services in a Runlevel


    Changing runlevels enables you to switch between sets of standard running servers
    and other programs; however, most systems support just a limited number of runlevels,
    so if your desired set of services isn''t specified in any runlevel, changing
    runlevels alone won''t let you select the services you want. To do this, you''ll
    need to edit the runlevels in another way.


    Linux uses a variant of the Unix System V (or SysV) initialization (or `init`
    for short) script system. As implemented in Linux, SysV `init` scripts, or links
    to them, are stored in a series of directories named after the runlevels they
    control. Typical locations include `/etc/rc.d/`, `/rc?.d`, `/etc/init.d/rc?.d`,
    and `/etc/rc?.d`, where `?` is a runlevel number. Some distributions provide symbolic
    links so that you can use two or more paths to reach these directories.


    Within each runlevel directory, `init` scripts have names of the form `A##name`,
    where `A` is either S or K, `##` is a two-digit number, and `name` is the name
    of the service (typically it''s the name of the script to which a symbolic link
    in the runlevel directory points). Programs that control the process pass `start`
    or `stop` options to the `init` scripts depending on the lead letter of the filename:
    S to start or K (for *kill*) to stop the service.


    Thus, in principle the task of managing the services that run in a given runlevel
    boils down to changing the filenames of the `init` script symbolic links in the
    runlevel directories: Change the lead S to a K to stop a service or vice versa
    to start it. Unfortunately, in practice it''s a bit more complex than this because
    of service dependencies—some services depend on another already being running
    before they can be started. That''s where the numbers come in; they denote the
    sequence in which services are started and stopped. Unfortunately, there''s no
    standardization across distributions in terms of the SysV startup script sequence
    numbers, so manually editing'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Task 3.7: Manage Runlevels


    them is inadvisable unless you''re intimately familiar with your distribution''s
    startup script sequence. Fortunately, tools to do the job exist, although the
    precise tools you''ll find vary from one distribution to another:


    **chkconfig**  This command-line utility is most common on Red Hat and related
    distributions; some don''t include it. Pass it the `--list` parameter to see a
    summary of services and whether or not they''re enabled in each runlevel. You
    can add or delete a service in a given runlevel by using the `--level` parameter,
    as in `chkconfig --level 5 smb on`, which enables Samba in runlevel 5. (Pass it
    `off` rather than `on` to disable a service.)


    **rc-update**  This tool is Gentoo''s equivalent of `chkconfig`. To add a script
    to a runlevel, type `rc-update add script runlevels`, where `script` is the name
    of the SysV startup script and `runlevels` is one or more runlevel names. Replace
    `add` with `del` to remove a script from a runlevel. For instance, typing `rc-update
    add samba default` adds the `samba` startup script to the `default` runlevel,
    causing Samba to run when the system boots.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_177_0.png)


    **ntsysv**  This is a text-mode utility that, like `chkconfig`, is most common
    on Red Hat and related distributions. It presents a menu of services run at the
    runlevel specified with the `--level` parameter. You can enable or disable a service
    by moving the cursor to the runlevel and pressing the spacebar.


    **ksysv**  This GUI tool supports enabling or disabling services in any runlevel
    from 1 through 6. Locate and select the service in the Start or Stop section of
    the given runlevel, right-click the entry, and then select Cut from the pop-up
    menu. This removes its start or stop entry. You can then drag the service from
    the Available Services list to the runlevel''s Start or Stop list. The system
    will create an entry in that runlevel and give it a sequence number based on the
    location to which you dropped it.


    **Distribution-specific tools**  Many distributions'' general system administration
    tools, such as Red Hat''s Service Configuration tool and SuSE''s YaST, provide
    the means to start and stop SysV services in specific runlevels. Details vary
    from one distribution to another, so consult your distribution''s documentation
    to learn more.


    All of these tools except `ksysv` handle changes to the SysV sequence numbers
    automatically, so you shouldn''t need to worry about that detail. Changes made
    with these tools (or by manually editing the runlevel scripts) won''t take effect
    immediately; they''ll occur only when you switch into or out of the relevant runlevel
    or when you reboot the computer. If you want to start or stop a service immediately,
    you can do so by locating the startup script (either the script itself or a link
    in a runlevel directory) and pass it the `start` or `stop` option. For instance,
    if you want to stop the sendmail server, on most systems you''d type something
    like this:


    ```

    ```

    # /etc/init.d/sendmail stop

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Unless your system is already functioning as a mail server computer, temporarily
    stopping (and subsequently restarting) the mail server should pose no problems.
    The precise location of the `sendmail` script varies from one distribution to
    another, and in fact the scripts to start a single service might have different
    names on different systems. For instance, some systems start Samba with a script
    called `samba`, others use `smb`, and still others use separate `smb` and `nmb`
    scripts. Sometimes alternative servers exist to fill the same role; for instance,
    some distributions use Postfix or Exim rather than sendmail to handle mail delivery,
    and their SysV startup scripts are likely to reflect this fact. Thus, you may
    need to do some digging to find the correct startup script.


    In addition to starting (with `start`) and stopping (with `stop`) services, most
    SysV startup scripts include options to perform additional actions. The most common
    of these is `restart`, which typically calls the `stop` and `start` actions in
    sequence, resulting in a restart of the service. This can be handy if you’ve made
    changes to configuration files and want to implement them; however, restarting
    a service can be disruptive, since it can disconnect remote users or otherwise
    interrupt ongoing work. Sometimes a `reload` action will cause programs to re-examine
    their configuration files and implement changes without causing much disruption.


    # ## Criteria for Completion


    To complete this task, you should have changed your system’s runlevel on a temporary
    basis by using `telinit`; changed it permanently by editing `/etc/inittab`; used
    `chkconfig`, `ntsysv`, or similar tools to change services that are automatically
    started in a runlevel; and used SysV startup scripts to temporarily start, stop,
    or restart services. Mastering these commands will enable you to control what
    software your system runs when it boots, as well as change what servers and other
    background services your system provides without rebooting it.


    # # Task 3.8: Schedule Jobs to Run in the Future


    Sometimes routine tasks need to be performed at specific times in the future or
    even at regular intervals in the future. For instance, Linux maintains log files
    in the `/var/log` directory. Left unchecked, these files will grow to enormous
    size and eventually fill your hard disk. To prevent this from happening, all Linux
    distributions run a program that temporarily suspends logging; deletes, renames,
    or compresses existing log files; and then resumes logging. The result is that
    log files don’t overrun the system. To do this, though, Linux uses a utility,
    known as `cron`, that runs programs at specified times in the future. You can
    create your own `cron` jobs to do the same. In fact, you can create both system
    `cron` jobs and user `cron` jobs; the former usually run as `root` and perform
    system maintenance, whereas the latter run as an ordinary user to perform tasks
    for that user. (You can create user `cron` jobs as `root` or run system `cron`
    jobs as a non-root user, though.) An additional tool for running programs in the
    future is `at`; this utility runs a program on a one-time basis in the future.
    You might use it to schedule a CPU-intensive job to run in off hours, to remind
    yourself of something you’ve got to do at a particular time, or for various other
    reasons.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# ## Scenario


    You have need to perform three tasks on an automated basis in the future. First,
    you want to have your system automatically check the CPU load average once an
    hour during business hours and email the results to you so that you can monitor
    the system''s performance over time. Second, you want the system to automatically
    use the Advanced Package Tools (APT) to check for (but not automatically install)
    new packages for your distribution on a daily basis, again emailing the results
    to your account. Finally, you want the computer to email you a reminder about
    a dentist''s appointment next week.


    # ## Scope of Task


    This task involves using both `cron` and `at` to schedule jobs to run in the future.
    System and user `cron` jobs are very similar to each other, but `at` is used in
    an entirely different way.


    # ### Duration


    This task should take half an hour to an hour to complete. Once you know the techniques,
    you can modify or create new `cron` jobs in a minute or two, although in practice
    you might need to write scripts to handle certain tasks, and this can take anywhere
    from a few seconds to several hours, depending on the complexity of the scripts.
    You can schedule a single task to run in the future with `at` in a matter of a
    minute or less, although once again, if you need to write a support script, this
    can extend the time requirements.


    # ## Setup


    You need a working Linux system to complete this task. The scenario specifies
    using APT, so you''ll need a Debian system or a non-Debian system with APT installed;
    however, you can substitute Yum or other network package utilities for APT if
    necessary. Most of this task can be performed as an ordinary user, but the second
    part requires `root` privileges. You might also need `root` access to configure
    the system to permit ordinary users to use `cron` or `at`.


    # ## Caveats


    Whether you run them as an ordinary user or as `root`, `cron` and `at` jobs pose
    a special risk because if you make a mistake in setting them up, they can wreak
    havoc unattended. For user `cron` jobs, the potential for havoc is limited to
    things like filling up certain disk partitions with useless files or consuming
    inordinate amounts of CPU time. A misconfigured system `cron` job is potentially
    more damaging, though. For this reason, you should always test scripts you intend
    to run from `cron` manually before running them unattended. If possible, you should
    also monitor the first automatic run of `cron` jobs so that you can step in if
    something seems to be going wrong.


    # ## Procedure


    Performing this task requires creating two `cron` jobs and one `at` job. The procedures
    for the two `cron` jobs are similar, but the `at` job requires using different
    tools and techniques.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# ## Creating User *cron* Jobs


    The *cron* (or *crond* on some systems) utility runs continuously in the background
    on most Linux systems, having been started by a SysV startup script. (Try using
    *ps* to locate *cron*, and check for its SysV startup script.) Once a minute,
    *cron* looks for the presence of user *crontab* *files*, which are usually stored
    in */var/spool/cron/crontabs* or */var/spool/cron/tabs*. (System *crontab* files
    also exist but are stored elsewhere, as described later.) Rather than directly
    editing user *crontab* files, the usual procedure is to use the *crontab* utility
    to install them. To begin, though, you should check for the presence of an existing
    user *crontab* file:


    ```

    $ crontab -l

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_180_0.png)


    > **NOTE**

    > This command uses a lowercase `-L` as an option, not a number `-1`.


    If you have no user *crontab* file, the utility replies *no crontab for user*,
    where *user* is your username. If you''ve already got a *crontab* file, the utility
    displays it. In that case, you can edit it by typing *crontab* -e, which loads
    your *crontab* file into the editor specified by the *$EDITOR* or *$VISUAL* environment
    variable. Alternatively, you can create a new *crontab* file or edit a copy you''ve
    already got and install it as described shortly. If you want to delete your *crontab*
    file, type *crontab* -r.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_180_1.png)


    > **NOTE**

    > The superuser may examine any user''s *crontab* file by using the `-u` *username*
    option, as in *crontab* -u *sally* -l to examine *sally*''s *crontab* file. This
    same technique can be used to edit or delete a user''s *crontab* file.


    Listing 3.1 shows a *crontab* file that achieves the goal specified in the Scenario
    section: It creates this file in your home directory under any name that you like
    (perhaps *my-crontab*). It runs *uptime* once an hour and emails the result to
    the username *sally*. (You should change all three instances of *sally* to your
    own username, of course.) The file consists of a number of variable specifications
    (for *SHELL*, *PATH*, and so on). These aren''t always necessary, and you can
    add more if they would be helpful. The *MAILTO* variable specifies the user who''s
    to receive a report of activity, including any output produced by the commands
    that *cron* runs. It''s not actually used in this example, but I''ve included
    it because it''s a common sight in *crontab* files. Likewise, the *HOME* variable
    isn''t strictly required in this example but is typically included in *crontab*
    files.


    # **Listing 3.1:** Sample User Crontab File


    ```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=sally

    HOME=/home/sally


    0 8-17 * * 1-5 uptime | mail -s `uptime report` sally

    ```'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Task 3.8. Schedule Jobs to Run in the Future


    The final line of Listing 3.1 specifies the commands that are to be run and the
    times at which this should occur. This line begins with five fields that specify
    the time. The fields are, in order, the minute (0–59), the hour (0–23), the day
    of the month (1–31), the month (1–12), and the day of the week (0–7; both 0 and
    7 correspond to Sunday). For the month and day of the week values, you can use
    the first three letters of the name rather than a number if you like. In Listing
    3.1, the command is to run **Monday through Friday** (1–5 in the final time field)
    on the hour (0 in the first time field) from 8:00 AM through 5:00 PM (8–17 in
    the second time field). The asterisks in the day of the month and month time fields
    indicate that the **cron job should run in every month and every day of the month,
    except when other restrictions exist** (such as in the day of the week field).


    The actual command to be run follows the time specification. In this case, it’s
    the **uptime** command, which is piped through **mail**, which is a simple text-mode
    mail utility. The **-s** option to **mail** specifies a subject line, and a username
    follows this.


    > Omitting the pipe character (|) and the entire **mail** command would work for
    this task since **cron** would email the output of the **uptime** command to the
    user specified by the **MAILTO** variable, but the email with the **uptime** output
    would lack a **Subject:** header.


    You may find that you want to specify the times at which **cron** jobs run in
    various ways. For instance, you might want to run a **cron** job every other hour
    or twice a day. You can specify multiple values in several ways:


    +   - An asterisk (*) matches all possible values.

    +   - A list separated by commas (such as 0,6,12,18) matches any of the specified
    values.

    +   - Two values separated by a dash (–) indicate a range, inclusive of the end
    points. For instance, **8–17** in the hour field specifies a time of from 8:00
    AM to 5:00 PM.

    +   - A slash, when used in conjunction with some other multi-value option, specifies
    stepped values—a range in which some members are skipped. For instance, */10 in
    the minute field indicates a job that’s run every 10 minutes.


    With this information in hand, you should be able to create your own **cron jobs**.
    You’re not restricted to using system utilities such as **uptime**, either—you
    can create your own custom scripts to perform complex actions. You can create
    a single crontab file with multiple **cron** jobs, one per line. Once you type
    in Listing 3.1 and save it, you can enter it as your user crontab file by passing
    it to the **crontab** command:


    ```

    $ crontab my-crontab

    ```


    Once it’s installed, you can wait until the hour rolls around to be sure that
    it’s working as expected—check your email inbox to see if a message with **uptime**
    output appears.


    > For testing purposes, try entering a value in the minute time field that’s just
    a minute or two in the future. (Change the hour and day-of-week fields, too, if
    you’re doing this test outside of the range shown in Listing 3.1.) This way you
    won’t have to wait until the hour ends to see if your **cron job** is working
    as you expect.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Access to user cron jobs may be restricted in various ways:


    +   • The crontab or cron executable programs may have permissions that prevent
    certain users from using these programs.


    +   • The /etc/cron.allow file may contain names of users who may use the facility,
    with all others being denied access.


    +   • The /etc/cron.deny file may contain names of users who may not use the facility,
    with all others being granted access.


    If none of these access control mechanisms is in use, any user with login (shell)
    access may create user cron jobs.


    # Creating System cron Jobs


    System cron jobs are just like user cron jobs, but with a couple of important
    exceptions:


    +   • System cron jobs are specified in /etc/crontab. This file typically tells
    cron to run all the scripts in the /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly,
    and /etc/cron.monthly directories at the specified intervals.


    +   • The /etc/crontab file is just like a user crontab file, with one exception:
    A username specification appears between the time specification and the command.
    When cron runs the job, it runs it as the specified user.


    The easiest way to create a system cron job is to drop a script to do the task
    into an appropriate /etc/cron.interval directory. For instance, to update your
    APT package listing once every day, you could put a file with the contents of
    Listing 3.2 in your /etc/cron.daily directory. Be sure the script is executable!
    If you do this, the script will execute on a daily basis at whatever time /etc/crontab
    specifies for its daily system cron jobs. (This time varies from one distribution
    to another.)


    # Listing 3.2: Sample Script to Update Your APT Database


    ```

    #!/bin/bash

    (apt-get update ; apt-get -s upgrade) | mail -s ''APT update'' $ally

    ```


    > If your system doesn’t use APT, you can substitute another command, such as
    yum check-update, for the two apt-get commands in parentheses in Listing 3.2.
    Note that APT requires two commands to retrieve the updated package listing and
    check it for new packages, whereas yum takes just one command to do this job.


    If the default system cron jobs don’t run at times that are convenient for you
    or if you want to run a system cron job as a non-root user, you can edit the /etc/crontab
    file. Treat it just like a user crontab file, except that you must include a username
    between the time specification and the command that’s to be run. Alternatively,
    you could create a user cron job; even root can have user cron jobs, and you can
    use the root account to create user cron jobs even for accounts that lack login
    access, such as accounts that exist for the benefit of servers.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Running a Single Future Job


    Sometimes cron is overkill. You might simply want to run a single command at a
    specific point in the future on a one-time basis rather than on an ongoing basis.
    For this task, Linux provides another command: at. In ordinary use, this command
    takes a single option: a time. (Options to fine-tune at’s behavior are also available.)
    The program then prompts you to enter commands that it will execute at the specified
    time. When you’re done entering commands, press Ctrl+D to terminate input. Alternatively,
    you can pass a file with commands by using the -f parameter to at, as in at -f
    commands.txt noon to use the contents of commands.txt as the commands you want
    to run at noon.


    The scenario requires that you email yourself a reminder about a dentist’s appointment.
    If that appointment is seven days and a few hours in the future, you might do
    the job like this:


    ```

    ```

    $ at now + 7 days

    warning: commands will be executed using /bin/sh

    at> echo "Dentist''s appointment at 3:00" | mail -s "Reminder" sally

    ```

    ```


    This sequence will cause an email message with a subject of “Reminder” and the
    specified text to be emailed to the sally account in precisely seven days. If
    specifying the time in precisely this way is inconvenient or impossible, you can
    use any of several other ways:


    +   - **Time of day** You can specify the time of day as *HH:MM*, optionally followed
    by *AM* or *PM* if you use a 12-hour format. If the specified time has already
    passed, the operation is scheduled for the next day at that time.

    +   - **noon, midnight, or teatime** These three keywords stand for what you’d
    expect (teatime is 4:00 PM).

    +   - **Day specification** To schedule an at job more than 24 hours in advance,
    you must add a day specification after the time of day specification. This can
    be done in numeric form, using the formats *MMDDYY*, *MM/DD/YY*, or *DD.MM.YY*.
    Alternatively, you can specify the date as *month-name day* or *month-name day
    year*.

    +   - **A specified period in the future** You can specify a time using the keyword
    **now**, a plus sign (+), and a time period, as in **now + 2 hours** to run a
    job in 2 hours.


    The at command has several support tools. The most important of these is atd,
    the at daemon. This program must be running for at to do its work. Check for its
    presence using ps. If it’s not running, look for a SysV startup script and ensure
    that it’s enabled, as described Task 3.7, “Manage Runlevels.”


    Other at support programs include atq, which lists pending at jobs; atrm, which
    removes an at job from the queue; and batch, which works much like at but executes
    jobs when the system load level drops below 0.8. These utilities are all fairly
    simple. To use atq, simply type its name. (The program does support a couple of
    options, but chances are you won’t need them; consult atq’s man page for details.)
    To use atrm, type the program name and the number of the at job, as returned by
    atq. For instance, you might type **atrm 12** to remove at job number 12.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The **at** facility supports access restrictions similar to those of **cron**.
    Specifically, the `/etc/at.allow` and `/etc/at.deny` files work analogously to
    the `/etc/cron.allow` and `/etc/cron.deny` files. There are a few wrinkles with
    **at**, though. Specifically, if neither `at.allow` nor `at.deny` exists, only
    **root** may use **at**. If `at.allow` exists, the users it lists are granted
    access to **at**; if `at.deny` exists, everybody *except* those mentioned in this
    file is granted access to **at**. This differs from **cron**, in which everybody
    is granted access if neither access-control file is present. This tighter default
    security on **at** means that the program is seldom installed with restrictive
    execute permissions, but of course you could use program file permissions to deny
    ordinary users the ability to run **at** if you want an extra layer of security.


    # ## Criteria for Completion


    To complete this task, you must have created a user **cron** job, a system **cron**
    job, and an **at** job. The user **cron** job should use **uptime** to deliver
    a report of the system load to your user account on an hourly basis during business
    hours. The system **cron** job should update your APT (or other package management)
    database and issue a report on available updated packages. The **at** job should
    deliver a reminder of a dentist''s appointment you''ve scheduled in a week. Each
    of these methods of scheduling jobs to run in the future is very useful in helping
    to maintain your system and for performing other tasks.'
  merge: -1
  img_proc: true
