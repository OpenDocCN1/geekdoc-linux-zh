  md: 'form of options presented by the boot loader at boot time, configuration files
    on your computer, and so on. Specifically, you should look at the following items:


    **Boot-time options** In its simplest form, LILO presents a boot prompt that reads
    `lilo:` or `boot:`. You can then press the Tab key to see a list of options or
    type an option name to boot that kernel or OS. GRUB is more visibly interesting;
    it presents a list of options, which often have multi-word names; you select from
    them by using the keyboard''s arrow keys. Modern LILO configurations often present
    similar menus, though, so spotting which boot loader your system uses at boot
    time can be tricky unless it''s LILO configured to use a non-labeled boot prompt.


    **Configuration files** LILO uses a configuration file called `/etc/lilo.conf`.
    GRUB uses a configuration file called `/boot/grub/grub.conf` or `/boot/grub/menu.lst`,
    depending on your distribution. If your system has one of these files but not
    the others, you can be pretty sure that your system uses the associated boot loader.
    Some systems have both LILO and GRUB configuration files, though, so this identification
    method isn''t always perfectly reliable.


    **Support programs** Both LILO and GRUB use ordinary program files to install
    themselves to the MBR. For LILO, this program is called `lilo`, and for GRUB,
    it''s `grub`. Both program files are likely to reside in `/sbin`, but check `/bin`,
    `/usr/bin`, `/usr/sbin`, `/usr/local/bin`, and `/usr/local/sbin` to be complete.


    **Package presence** Try using your package manager to locate the boot loader''s
    package. LILO is typically installed as `lilo` and GRUB is generally installed
    as `grub` or `grub-static`. It''s conceivable that you''ll miss a package if it''s
    installed under some other name, though, so this method of identification isn''t
    perfectly reliable.


    The worst-case scenario when you search for evidence of LILO and GRUB is to find
    indications of both packages'' presence. This can happen if your system has undergone
    upgrades that included a change from one boot loader to another or if a previous
    administrator experimented with both boot loaders. In this case, you might want
    to reboot, take notes on the OSes and kernels that are presented as boot options,
    and compare these options to the ones shown in both boot loader configuration
    files.


    Assuming you can identify the boot loader your system uses, you should proceed
    to configuring it. You should read the section on the other boot loader for completeness,
    but don''t attempt to use it; if it''s improperly configured, the result can be
    an unbootable system.


    # ## Adding a Kernel to LILO


    The LILO configuration file, `/etc/lilo.conf`, consists of a series of lines that
    set options, mostly by specifying an option name, an equal sign (`=`), and an
    option value. Listing 5.2 shows an example. The `boot=` option is a particularly
    important global option; it identifies where the MBR code will reside. Give it
    a disk identifier (such as `/dev/hda`) and the code goes in the MBR of the specified
    disk; give it a partition identifier (such as `/dev/hda3`) and the code goes in
    the boot sector of the specified partition. In addition to the global options,
    each Linux kernel configuration begins with an `image=` line, which points to
    a Linux kernel image file. Subsequent lines are typically (but not always) indented
    and provide options that are passed to the kernel, that identify the kernel, and
    so on. Non-Linux OSes may be booted by LILO and typically begin with an `other=`
    line. An `image=` or `other=` line and all subsequent lines up until the next
    `image=` or `other=` line are called a *stanza*.'
