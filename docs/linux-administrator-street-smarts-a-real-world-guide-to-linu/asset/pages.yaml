- pgno: 104
  md: '# Duration


    This task should take half an hour or so to complete. Once you’re familiar with
    the tools involved, you can check and tune your hard disk configuration in a few
    minutes.


    # Setup


    Log into your Linux computer and acquire **root** privileges. Most of the tools
    you’ll use in this task cannot be run as an ordinary user, although one or two
    can be.


    # Caveats


    Aside from the usual caveats about using **root** privileges, checking your disk
    hardware configuration isn’t particularly risky; however, tweaking that configuration
    is dangerous. Setting incorrect disk options can cause a computer to lock up completely,
    requiring a hard reset, which in turn can sometimes cause data loss. Thus, if
    you have important data files on your computer, be sure to back them up before
    proceeding with this task.


    # Procedure


    This task involves three steps: identifying your disk hardware, testing your disk
    performance, and adjusting options that influence disk performance. You’ll perform
    the first two tasks no matter what type of disk hardware you have. You might or
    might not actually do the final part of the task, depending on your disk hardware
    and the results of your disk performance test.


    # Identifying Your Hardware


    Linux treats hard disks as belonging to one of two categories:


    **ATA disks** Advanced Technology Attachment (ATA) disks, also known as Integrated
    Device Electronics (IDE) disks, have long been the most common type on x86 hardware.
    Modern x86 motherboards invariably include ATA controllers, and ATA drives have
    typically been less expensive than other types of drives. In the past few years,
    ATA has spawned a subtype, Serial ATA (SATA); the older ATA drives are now often
    referred to as Paralle ATA (PATA).


    **SCSI disks** Small Computer System Interface (SCSI) disks have traditionally
    been used on high-performance workstations and servers. In the past, they were
    common on Macintosh computers too, but many modern Macs use ATA disks. SCSI disks
    tend to be more expensive than ATA disks of similar capacity, but manufacturers
    often release their best-performing designs as SCSI disks, and SCSI has some inherent
    design advantages compared to ATA, so you do get better performance for that extra
    cost.


    Several other types of disk devices exist, but Linux tends to treat them as if
    they belonged to one of these two categories—in most cases, as SCSI disks. In
    fact, many Linux SATA drivers appear in the SCSI driver category, although this
    isn’t universally true. USB and FireWire drives are also usually treated as SCSI
    disks. For the remainder of this task, therefore, I will refer to ATA and SCSI
    disks, but your actual disk hardware might be neither of these things.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'If you have an SATA disk, it could be either an ATA disk or a SCSI disk from
    the Linux driver perspective.


    If your Linux system is up and running and if you can use your disk, one easy
    way to identify it is to use the **df** command:


    ```

    $ df

    ```


    ```

    Filesystem            1K-blocks      Used Available Use% Mounted on

    /dev/sdb6               977180    322112    655068  33% /

    udev                  256024       196    255828   1% /dev

    /dev/mapper/usr        6291260   5762756   528504  92% /usr

    /dev/mapper/home      17825244  11384232  6441012  64% /home

    /dev/hda6              101089     35111    61803  37% /boot

    ```


    This command displays free space statistics for mounted filesystems. This example
    output shows four types of filesystem:


    **ATA filesystem** The last entry in the output (//dev/hda6, mounted at /boot/)
    is for an ATA disk. Such disks have device filenames of the form /dev/hd*xn*,
    where *x* is a letter from a onward and *n* is a number from 1 upward.


    **SCSI filesystem** SCSI disks have device filenames of the form /dev/sd*xn*,
    where *x* is a letter from a onward and *n* is a number from 1 upward. The first
    entry in the preceding output, for the root (/) filesystem, is for a SCSI disk.


    **LVM filesystems** The preceding output shows two Logical Volume Management (LVM)
    filesystems, /usr and /home. These filesystems reside on volumes that constitute
    one or more physical partitions managed by Linux LVM tools and identified by entries
    in the /dev/mapper directory tree. LVM is a way to create more flexible partitions,
    but its configuration is beyond the scope of this task. LVM filesystems can reside
    on underlying ATA, SCSI, or both types of disk.


    **udev filesystem** Finally, the /dev directory is handled, on this system, by
    the udev filesystem. As described in Task 2.4, this is a pseudo-filesystem that
    automatically adds device entries for your hardware. It doesn''t correspond to
    any real disk hardware.


    You should be aware that df can only identify hardware that''s currently being
    used in the form of mounted filesystems. If you see LVM filesystems, they could
    reside on a disk that''s not otherwise identified by df output. For instance,
    in the preceding example, there might be a /dev/sda, /dev/hdb, or other disks
    that aren''t immediately obvious from the df output. One way to track down such
    additional disks is by using fdisk to display the partition tables of disk devices:


    ```

    # fdisk -l /dev/sdb

    ```


    ```

    Disk /dev/sdb: 81.9 GB, 81964302336 bytes

    16 heads, 63 sectors/track, 158816 cylinders

    Units = cylinders of 1008 * 512 = 516096 bytes

    ```'
