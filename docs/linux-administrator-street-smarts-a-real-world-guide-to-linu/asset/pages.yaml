    # Checking I/O Addresses


    I/O addresses are similar to IRQs in that the PC architecture supports a limited
    number of them and most devices require an I/O address for communication with
    the CPU. There are, however, more I/O addresses than IRQs, so conflicts for I/O
    addresses are rarer than are IRQ conflicts. You can learn about your used I/O
    addresses by examining the /proc/ioports pseudo-file; so copy it to a file in
    your home directory or print it:


    ```

    $ cat /proc/ioports | lpr

    ```


    Many of the same caveats that apply to /proc/interrupts also apply to /proc/ioports.
    In particular, demand for an I/O port might not show up until after a device is
    used. Table 2.2 summarizes some of the more common I/O ports; however, this table
    is incomplete, particularly with respect to more modern devices with less fixed
    I/O port addresses.


    TABLE 2.2 Common Linux Devices


    | Linux Device | Windows Name | Typical IRQ | I/O Address |

    |:-------------|:-------------|:------------|:------------|

    | /dev/ttyS0   | COM1 | 4 | 0x03f8 |

    | /dev/ttyS1   | COM2 | 3 | 0x02f8 |'
