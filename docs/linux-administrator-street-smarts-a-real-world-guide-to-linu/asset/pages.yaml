- pgno: 122
  md: "Mouse or Mouse1 and a Driver line with a name of mouse. To use a new USB wheel\
    \ mouse, you must ensure that three Option lines are set:\n\n**Protocol** The\
    \ Protocol option tells X how to communicate with the mouse. Several protocols\
    \ have been used over the years, but modern PS/2 and USB mice all use the PS/2\
    \ protocol or variants of it. Wheel mice almost invariably use the IMPS/2 protocol,\
    \ so you should set this line to that value.\n\n**Device** The Device option tells\
    \ X what Linux device file interfaces to the mouse. This could be /dev/mouse,\
    \ /dev/input/mouse0, or something similar. If you're replacing one USB mouse with\
    \ another, you shouldn't need to adjust this option. The Linux udev filesystem,\
    \ used on most modern distributions, should automatically create an appropriate\
    \ device file, but the name might differ from one distribution to another.\n\n\
    **ZAxisMapping** This strangely named option tells X about the wheel on the mouse.\
    \ It should be set to a value of 4 5. Behind the scenes, wheel movements are sent\
    \ from the mouse to the computer as button presses, and this option tells X to\
    \ treat the presses of these buttons (numbers 4 and 5) as wheel movements. Note\
    \ that not all programs recognize wheel movements, but most modern X programs\
    \ do.\n\nIn sum, a proper configuration for a modern USB wheel mouse looks something\
    \ like this:\n\n```\n    Section \"InputDevice\"\n    Identifier \"Mouse1\"\n\
    \    Driver \"mouse\"\n    Option \"Protocol\" \"IMPS/2\"\n    Option \"Device\"\
    \ \"/dev/input/mouse0\"\n    Option \"ZAxisMapping\" \"4 5\"\n    EndSection\n\
    ```\n\nAs noted earlier, though, the Device file might differ from /dev/input/mouse0.\
    \ If you're installing something other than a modern USB mouse, you may need to\
    \ make more radical changes, such as changing the Protocol and omitting or changing\
    \ the ZAxisMapping line.\n\n# # Changing the Monitor Configuration\n\nThe Monitor\
    \ section tells X about your monitor's capabilities. Two options are particularly\
    \ critical for this section: HorizSync and VertRefresh. These lines tell X about\
    \ your monitor's horizontal and vertical refresh rates, respectively. Traditional\
    \ cathode ray tube (CRT) monitors use an electron beam to \"paint\" a picture\
    \ on the screen, but the electron beam has a limited scanning speed. The horizontal\
    \ and vertical refresh rates are the limits on the display's speed for both horizontal\
    \ scanning (to display a single line of pixels) and vertical scanning (to display\
    \ an entire screen). The horizontal and vertical refresh rates are measured in\
    \ megahertz (MHz) and hertz (Hz), respectively. Although LCD monitors don't use\
    \ electron beams, many of them do have analog interfaces so that they can be used\
    \ with traditional video cards; thus, these values are important for LCD monitors\
    \ as well as for CRT monitors."
  merge: -1
  img_proc: true
- pgno: 123
  md: "Unfortunately, you can’t tell just by looking at a monitor what its horizontal\
    \ and vertical refresh limits are; you’ll have to crack open the monitor’s manual.\
    \ This information should appear somewhere, probably on a technical specifications\
    \ page. If you don’t have your monitor’s manual, try the manufacturer’s Web site.\
    \ Once you have the information, copy it to the **Monitor** section:\n\n```\n\
    HorizSync 30.0-80.0\nVertRefresh 55-75\n```\n\nYou can also examine, and perhaps\
    \ change, other options in the **Monitor** section. The **Identifier** line is\
    \ used in the **Screen** section for tying things together. You don’t need to\
    \ change this unless you’ve copied the whole **Monitor** section so as to leave\
    \ the original intact. If you’ve done this, be sure to change the reference in\
    \ the **Screen** section when you get to it. The **VendorName** and **ModeName**\
    \ lines provide model information for human consumption.\n\nOne of the most confusing\
    \ types of lines is the **Modeline**. These lines provide timing information to\
    \ enable X to display screens of different resolutions. In the days of XFree86\
    \ 3.3.6 and earlier, **Modeline** entries were commonplace. With XFree86 4.x and\
    \ X.org-X11, the X server is able to communicate with the monitor to obtain equivalent\
    \ information from the monitor itself—at least, when using modern video hardware.\
    \ Thus, you probably don’t need to add or adjust any **Modeline** entries when\
    \ you replace a monitor.\n\n# Changing the Video Configuration\n\nThe main function\
    \ of the **Device** section is to identify your video card’s driver. This is done\
    \ via the **Driver** line. For most boards with nVidia chipsets, such as the one\
    \ described in this task’s **Scenario** section, you would specify a driver of\
    \ **nv**. The resulting section would look something like this:\n\n```\nSection\
    \ ‘Device’\n    Identifier     “mx4000”\n    BoardName      “EVGA e-GeForce MX4000”\n\
    \    Driver         “nv”\n    Option         “DPMS”\nEndSection\n```\n\n![](img/f430a19bdf014c43ad7c2d594afd5b21_123_0.png)\n\
    \n> Video card manufacturers are increasingly providing their own X drivers, and\
    \ in fact nVidia is particularly good in that respect. If you use the video card\
    \ manufacturer’s driver, you would specify it instead of the driver that comes\
    \ with your X server, such as nv idla rather than nv. Read the documentation that\
    \ comes with the manufacturer’s drivers for detailed installation instructions.\n\
    \nThe **Identifier** option is used to tie things together later in the file;\
    \ change it only if you copied the entire section to create a new one, and then\
    \ be sure to change it in the **Screen** section, too. The **BoardName** option\
    \ is for human use, so change it or not, as you see fit. Additional"
