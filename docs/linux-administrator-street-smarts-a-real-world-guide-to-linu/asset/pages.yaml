- pgno: 63
  md: '# Task 1.7: Use Streams, Pipes, and Redirection




    requires you to enter text either as a command-line option or via standard input.
    Thus, you’d redirect standard input from the error-messages.txt file. You’d also
    have to redirect standard output to save the result in a file:


    ```

    $ text2gif < error-messages.txt > error-graphics.gif

    ```


    You can use a graphics program, such as the GIMP, to view the error-graphics.gif
    file to verify that it contains the correct image.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_63_0.png)


    > When using the redirection operators, you start a command line with the program
    name and then “point” the operators toward their destinations—the input redirection
    operator points left, toward the command name, whereas the output redirection
    operators point right, toward the filename of the file you want to create.


    # Piping Data between Programs


    The preceding example showed text2gif operating on a file that was created by
    another program. This approach is common in Linux; so common, in fact, that a
    variant of the redirection operator exists to simplify matters. This tool is known
    as a pipe or a pipeline, and it’s a way to send standard output from one program
    directly into another, without using any on-disk file. The symbol for a pipe is
    a vertical bar (|), located above the Enter key on the same key that holds the
    backslash (\) character on most keyboards. You place the pipe character between
    the commands. For instance, instead of saving the output of netstat –p in a file
    and then examining that file with less, you can pipe the result directly into
    less:


    ```

    $ netstat –p | less

    ```


    Another common use of a pipe is to send the results of a lengthy command through
    grep, which searches for lines containing a particular string that you specify.
    For instance, to search for the lines in the netstat output that refer to Firefox,
    you might issue the following command:


    ```

    $ netstat –p | grep firefox

    ```


    You can create a pipeline containing multiple commands and even redirect the output
    of the final command:


    ```

    $ netstat –p | grep firefox | text2gif > netstat-output.gif

    ```


    # Additional Pipe and Redirection Tricks


    Pipes and redirection can be combined in complex ways and obscure variants may
    be used. For instance, the &1 and &2 strings refer to standard output and standard
    error, respectively. This fact enables you to pipe standard error without also
    piping standard output:


    ```

    $ netstat –p 2>&1 > /dev/null | text2gif > error-message.gif

    ```'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'This example relies on subtle order effects: On the command line, standard
    error is redirected to standard output before standard output is redirected to
    /dev/null; however, bash interprets these redirections in the opposite order.
    Thus, this command will send nothing as input to `text2gif` if you reverse the
    order of the two redirection operators. Also, when redirecting to `&1` or `&2`,
    you should include no space between the redirection operator and its destination.


    # ### Criteria for Completion


    This task demonstrated the use of pipe and redirection operators for standard
    input, standard output, and standard error. You should now be able to apply these
    operators in working with Linux commands that generate textual output or expect
    textual input. (A few commands, such as `text2gif`, generate binary output on
    standard output and rely on you to be able to redirect or pipe it appropriately.)


    # ## Task 1.8: Manage the Shell Environment


    Linux shells are simply programs, and like many programs, the details of their
    operation can be customized. You can change the command prompt, set the directories
    in which the shell searches for program files, and so on. These features are adjusted
    via *environment variables*, which you can set on the command line or in configuration
    files. Other programs can also use environment variables, so in some cases, setting
    an environment variable in a `bash` configuration file can affect programs launched
    from `bash`.


    # ### Scenario


    You dislike your current `bash` prompt and want to change it to something that
    includes the date and time. You also need to set an environment variable that
    tells various programs what editor to use when calling an external text editor.
    You want to test these changes and then make them permanent by modifying your
    `bash` configuration file.


    # ### Scope of Task


    To perform this task, you''ll need to type a few commands at the command line
    and edit a configuration file. Consult Task 1.5 for information on using Vi for
    file editing, or use your favorite text-based or GUI editor.


    # ### Duration


    This task will take about half an hour to complete. Once you know how to change
    environment variables, you''ll be able to do so in under a minute—but it may take
    longer than that to determine what environment variable needs changing!'
