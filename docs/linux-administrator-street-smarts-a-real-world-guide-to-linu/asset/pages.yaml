- pgno: 37
  md: '# Setup


    You need perform no special setup to do this task; just log into your computer
    and acquire *root* privileges.


    # Caveats


    Because this task is performed as *root* and uses powerful file-manipulation commands,
    a potential for devastating errors exists. Certain typos, when entered as *root*,
    can obliterate an entire Linux installation. Be very careful when performing this
    task, or any other task that requires *root* privileges. When you type a command,
    remove your hands from the keyboard, proofread the command, and be sure it’s the
    correct command *before* you press the Enter key to finalize it.


    All of these commands can be used by ordinary users, with the partial exception
    of *chown*; only *root* may use *chown* to change the primary owner of a file,
    although ordinary users may use *chown* to change the group of a file. These examples
    show *root* using the commands because the task is an administrative one that
    requires *root* privileges because of the locations of the files.


    # Procedure


    To perform this task, you must create a shared directory, copy files to the new
    directory, remove extraneous files, and set the ownership and permissions on the
    new directory and the files you’ve copied. These actions utilize some of the most
    important Linux file-manipulation commands, such as *mkdir*, *cp*, *rm*, *chown*,
    and *chmod*.


    # Creating a Shared Directory


    To create the shared directory, use the *mkdir* command, which creates (makes)
    a directory (hence the command’s name). This command takes the name of the directory
    you want to create as an argument. For instance, to create a directory called
    */home/project7*, you’d type this:


    ```

    #  mkdir  /home/project7

    ```


    Thereafter, the */home/project7* directory should exist. By default, this directory
    is owned by the user who issued the *mkdir* command and has permissions based
    on the defaults for that user. You can tell *mkdir* to create a directory with
    specific permissions by adding the *-m* *mode* option between *mkdir* and the
    directory name. Another method of adjusting permissions is described shortly,
    in “Setting File and Directory Permissions.”


    Ordinarily, *mkdir* doesn’t create directories in the path up to the final directory
    specified; for instance, *if* */home* didn’t exist, the preceding command would
    return an error message. Adding the *-p* or *--parents* option, though, causes
    *mkdir* to create intervening directories. This can be handy, but it also means
    that if you mistype a directory name (say, */hom* instead of */home*), *mkdir*
    will merrily create a new directory tree named after your typo.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# ## Copying Files


    Linux’s file-copying command is `cp` (which is short for *copy*). In its most
    basic form, `cp` copies a single file from one location to another:


    ```

    ```

    # cp /etc/fstab /home/project7/

    ```

    ```


    This command copies the `/etc/fstab` file to the `/home/project7` directory; you’ll
    find the copy there under the same name as the original. You can rename the copy
    as you make it by specifying a filename along with the target directory:


    ```

    ```

    # cp /etc/fstab /home/project7/sample-file

    ```

    ```


    For clarity, I’ve shown the target directory alone with a trailing slash (/) in
    the first of these examples. This indicates that `project7` is a directory, not
    a file, and will result in an error message if `/home/project7` doesn’t exist.
    Linux will accept a directory name as a target without a trailing slash, though.
    For instance, if `/home/project7/sample-file` were a directory, the second command
    would copy `/etc/fstab` into that directory under the name `fstab`.


    You can copy an entire directory tree by using one of the recursion options (`-r`
    and `-R`):


    ```

    ```

    # cp -R /etc/X11/ /home/project7/

    ```

    ```


    This command copies the entire contents of the `/etc/X11` directory, including
    all its subdirectories, to `/home/project7`. Using `-r` in place of `-R` is likely
    to result in the same behavior, but some versions of `cp` produce subtly different
    effects for these two commands.


    For information on other `cp` options, consult the `man` page for the command.


    # ## Removing Extraneous Files


    Now that you’ve created the new project directory and placed some files in it,
    you may want to do some housecleaning. For this task, you may want to first change
    into the directory in which you want to operate so that you don’t need to type
    the complete path to each file:


    ```

    ```

    # cd /home/project7/X11/

    ```

    ```


    If you type `ls`, you’ll see a list of files and directories. Perhaps your project
    doesn’t need access to the `xorg.conf` file; you can remove it with `rm`:


    ```

    ```

    # rm xorg.conf

    ```

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_38_0.png)


    Be sure you type this command from within your copied directory tree (`/home/project7/X11`).
    If you type this command from the original `/etc/X11` directory, X is unlikely
    to work the next time you start it!


    As with `cp`, you can use the `-r` or `-R` option to recursively delete an entire
    directory tree:


    ```

    ```

    # rm -r mwm/

    ```

    ```'
  merge: -1
  img_proc: true
