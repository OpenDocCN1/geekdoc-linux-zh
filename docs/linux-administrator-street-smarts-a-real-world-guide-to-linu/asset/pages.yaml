- pgno: 110
  md: '# # Scope of Task


    This task involves configuring a kernel using its configuration tools, compiling
    the kernel, installing kernel modules, and copying the kernel to a location from
    which it can be booted. Actually booting and using the new kernel requires modifying
    your boot loader configuration, which is described in Phase 5.


    # ## Duration


    This task will take from one to three hours to complete, depending on how carefully
    you study your kernel options and the speed of your computer. Once you''re familiar
    with kernel options, you should be able to change one or two options in just a
    few minutes, but compiling the kernel will still take several minutes to over
    an hour.


    # ## Setup


    To begin, you should download the kernel source code. As I write, the latest version
    is `2.6.17.7`, and it is available from [http://www.kernel.org](http://www.kernel.org).
    You can use this version or a more recent version, at your discretion. The kernel
    comes as a bzip2ed tarball, which ends in a `.tar.bz2` filename extension, or
    as a gzipped tarball, with a `.tar.gz` filename extension. The former is the more
    compact file and so is what I describe using.


    Before you can configure or compile the kernel, you must uncompress it in a convenient
    directory. The traditional location for the kernel is in `/usr/src/linux`. This
    directory is usually a symbolic link to a directory that includes the kernel version
    number (such as `/usr/src/linux-2.6.17`; the final number is usually omitted).
    If you want to configure and compile your kernel as an ordinary user, which is
    best from a safety point of view, you may want to extract the tarball in your
    home directory and then create a symbolic link to that directory in `/usr/src`,
    first deleting any existing symbolic link:


    ```

    ```

    $ tar xvjf linux-2.6.17.7.tar.bz2

    $ su

    Password:

    # cd /usr/src

    # rm linux

    # ln -s /home/yourname/linux-2.6.17 linux

    ```

    ```


    Of course, you should change `yourname` in the final command to the name of your
    home directory. At this point, your kernel is ready for configuration.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_110_0.png)


    If you''ve previously compiled a kernel, or if you want to use the starting configuration
    for your distribution''s default kernel as a starting point, you can copy the
    `.config` file from your old kernel''s directory to the new kernel''s directory.
    You can then type `make oldconfig` to have the kernel configuration utility ask
    only about changed options, leaving old ones intact.'
