    # Task 6.6: Operate a Mail Server


    Email is a very important Internet feature; it enables users to send messages
    to one another to be read at the recipient’s leisure. This function requires computers
    that run Simple Mail Transfer Protocol (SMTP) server software such as the popular
    sendmail (http://www.sendmail.org). This software accepts messages that are created
    in email client programs such as mutt or KMail and delivers the messages across
    the Internet to another mail server. The recipient server then stores the messages
    in a form that enables their retrieval by local programs or via another server
    that runs a protocol such as the Post Office Protocol (POP) or the Internet Message
    Access Protocol (IMAP).


    This task focuses upon sendmail configuration, which is the most central and critical
    part of the email delivery equation. A full email server is likely to support
    POP or IMAP in addition to SMTP or might support user logins and access via mail
    client programs. Be aware that SMTP is a complex protocol and SMTP server configuration
    is correspondingly complex. This task barely scratches the surface. If you have
    a need to configure a real email server, you should consult a book that’s dedicated
    to the software you choose to run.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_284_0.png)


    Although sendmail is the most popular SMTP server software on the Internet at
    large, it’s not the only option. Postfix (http://www.postfix.org), Exim (http://www.exim.org),
    and qmail (http://www.qmail.org) are all popular in Linux, and some Linux distributions
    use one of these as the default mail server rather than sendmail. If your system
    is configured in this way, you must either replace your current mail server with
    sendmail (which could render it inoperative until you fix it) or simply read through
    this task without actually changing your configuration.


    # Scenario


    You are in charge of setting up the mail server for Pangaean University (pangaean.edu),
    which also manages mail for the Institute for Mesozoic Studies (mesozoi.c.edu).
    You must configure the server to accept mail addressed to users at either domain
    name. You must set up several email aliases, redirecting mail for certain users
    (such as postmaster) to specific users on the system. You must also configure
    some Linux workstations'' mail server programs to relay mail through the main
    Pangaean University mail server system (mail.pangaean.edu).'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# Scope of Task


    This task requires changing the sendmail configurations on several computers,
    the most important being the main mail server computer for the university. Fortunately,
    the changes to the secondary servers should all be identical, so this part of
    the task shouldn''t take long on a per-computer basis.


    # Duration


    This task should take about an hour to complete. (In reality, if you had to reconfigure
    enough computers to relay through mail1.pangaea.edu, the task could take substantially
    longer, but this task describes just one such reconfiguration.) Once you''re familiar
    with email configuration, making small changes should take just a few minutes.
    Unfortunately, sendmail uses one of the more complex Linux configuration files,
    so learning the basics can take a while.


    # Setup


    You need root access to two computers to complete this task: a system that''s
    configured to accept outside mail (mail1.pangaea.edu in this example) and another
    computer that you''ll configure to relay mail through the first one.


    # Caveats


    This task presents the usual risks associated with working as root. In addition,
    mail server configuration poses its own risks. Like any server, sendmail presents
    security risks in the event of a bug or misconfiguration. Worse yet is the problem
    of spam, which is unsolicited bulk email. Any domain is likely to be inundated
    with spam, and real mail servers are often configured with add-on software such
    as SpamAssassin (http://spamassassin.apache.org) to deal with the problem. Potentially
    worse, certain misconfigurations of sendmail can make it easy for spammers to
    abuse your system and make it part of the spam delivery chain. Such open relay
    configurations can get your mail server listed on various mail blacklists, blocking
    legitimate email that originates from your site.


    > Linux uses sendmail (or another mail server) for handling local mail. All major
    Linux distributions provide default mail server configurations that make the mail
    server fairly safe to run. Typically, the servers are configured so that they
    don''t listen to external network ports. You must undo some of these safeguards
    to configure sendmail as a working Internet mail server.


    # Procedure


    Before you proceed to configuring your sendmail software, you should understand
    a few email basics. You can apply this knowledge to setting some basic mail server
    options. You can then proceed to examining your sendmail configuration files,
    setting hostname options, configuring the system to accept mail, setting redirection
    options, and setting relay options.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Email Basics


    Several protocols exist to manage email. The most common of these is SMTP, which
    is designed as a push mail protocol, meaning that the sending system initiates
    the transfer. This design is good for sending data, so SMTP is used through most
    of a mail delivery system. The final stage, though, often employs a pull mail
    protocol, such as POP or IMAP. With these protocols, the receiving system initiates
    the transfer. This is useful when the receiving system is an end user''s workstation,
    which might not be powered on at all times or able to receive incoming connections.


    SMTP was designed to enable a message to be relayed through an arbitrary number
    of computers. For instance, an end user might compose a message on a workstation
    (say, `client.example.com`), which is sent to the local SMTP server (`mail.example.com`).
    This server looks up a recipient system using DNS and sends the message to that
    system (for instance, `mail.pangaia.edu`). This system enables the message might
    be read, either directly or via a POP or IMAP server. In the latter case, the
    final recipient system would be a fourth computer (such as `wegener.pangaia.edu`).
    This arrangement is illustrated in Figure 6.3. Bear in mind that the number of
    links in this chain is variable and depends on how each system is configured.
    In the simplest case, local email stays on just one system. In theory, an arbitrarily
    large number of computers can be involved in an email exchange, although in practice
    it''s rare to see email pass through more than half a dozen systems.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_286_0.png)


    At each step in a relay chain, mail is altered. Most importantly, each server
    adds a *header* to the email, which is a line that provides information about
    the message. In particular, mail servers add `Received:` headers to document the
    path the mail has taken. In theory, this enables you to trace the email back to
    its source. Unfortunately, spammers and other email abusers often forge email
    headers, which greatly complicates such analysis.


    Because an SMTP server can function as both a server (receiving mail from other
    systems) and a client (sending mail to other systems), you must deal with both
    sides of the configuration equation. Sometimes a system will never function in
    one role or the other, which can simplify matters—but you must then be careful
    not to accidentally configure the system incorrectly. In particular, open relay
    configurations, in which a mail server relays mail from anybody, should be avoided.


    # Sendmail Configuration Files


    Sendmail uses a number of configuration files, each with its own unique purpose:


    `sendmail.cf` This file is the official primary sendmail configuration file. It
    includes information relating to relaying options, the server''s hostname, and
    so on. Unfortunately, its syntax'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'is very difficult for most people to understand, so in practice, it''s usually
    created from another file that''s easier to edit. You can usually find `sendmail.cf`
    in `/etc/mail`.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_287_0.png)


    If your system lacks a `sendmail.cf` file, it''s possible that your computer is
    running Postfix, Exim, or some other mail server program, or your system might
    not be running any mail server at all.


    **The `m4` file** The file that''s used to generate the `sendmail.cf` file is
    called an `m4` file, after the `m4` program that does the translation. This file''s
    name varies from one system to another, but it usually ends in `.mc`. Examples
    include Red Hat''s or Fedora''s `/etc/mail/sendmail.mc` and Slackware''s `/usr/share/sendmail/cf/cf/linux.smtp.mc`.
    This file is sometimes not installed with the main sendmail package; you may need
    to install it from its own package, such as `sendmail-cf`.


    **aliases** The `/etc/aliases` file (which sometimes appears in `/etc/mail` instead
    of `/etc`) holds username translations, as described in "Redirecting Mail" later
    in this task. Sendmail actually reads a binary version of this file, `aliases.mc`,
    which is generated via the `newaliases` program, as described later.


    **access** The `access` file (which is usually stored in `/etc` or `/etc/mail`)
    controls mail relaying, as described in "Configuring Sendmail as a Relay" later
    in this task.


    **local-host-names** This file contains a list of hostnames that sendmail will
    treat as local. That is, if the server receives mail addressed to a user at one
    of these names, the server will attempt to deliver that mail to a local user of
    that name. If this file isn''t used (its use can be disabled in `sendmail.cf`),
    or if it''s empty, sendmail accepts mail addressed only to its own name.


    If you check the `/etc/mail` directory, you''ll see several additional configuration
    files. These files are important for more advanced configurations, but for the
    basic configuration tasks described in this task, you can ignore them.


    To configure sendmail, you''ll edit an `m4` file and then convert it to a `sendmail.cf`
    file with `m4`:


    ```

    # m4 < myconfig.mc > sendmail.cf

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_287_1.png)


    If you issue this command in the same directory in which the original `sendmail.cf`
    file resides, the command copies over the existing `sendmail.cf` file. For added
    safety, back up that file first. You can then restore it from the backup if something
    goes wrong.


    Generally speaking, you''ll want to start with the `m4` file provided by your
    distribution but rename it to something appropriate. After you make a change and
    create a new `sendmail.cf` file, you must pass the `reload` or `restart` parameter
    to the sendmail SysV startup script, as described in Phase 3:


    ```

    # /etc/init.d/sendmail reload

    ```'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'You should be aware that the m4 file uses the dn1 string to denote comments.
    Thus, if a line begins with dn1, it''s a comment line. If you want to use that
    line in your configuration, remove the dn1 characters.


    # ## Hostname Options


    All mail servers must know their own hostnames. This information is used in a
    variety of ways, such as when initiating communications with other servers and
    as identification to be added to usernames for the benefit of clients that don''t
    provide this detail. Ordinarily, sendmail retrieves its hostname from system calls
    designed for this purpose. (In most cases, these calls deliver the name that was
    in /etc/HOSTNAME or /etc/hostname at boot time.) Sometimes, though, you might
    want to override this hostname. For instance, your mail server might be known
    by multiple names and you want to set one for the system and another for sendmail
    alone. Sometimes you want outgoing email to omit the machine name, as in alfred@pangaea.edu
    rather than alfred@wegner.pangaea.edu. To make such a change, look for lines like
    the following in the m4 file:


    ```

    MASQUERADE_AS(`pangaea.edu'')

    FEATURE(masquerade_envelope)

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_288_0.png)


    The MASQUERADE_AS line includes two types of single-quote marks. The first one
    (`'') is a backtick, which appears to the left of the 1 key on most keyboards.
    The second ('') is an ordinary single quote, which is to the left of the Enter
    key on most keyboards. Be sure to get these right or your configuration won''t
    work!


    If you don''t see such lines in your file, add them. You can then change the MASQUERADE_AS
    address to whatever you like. This change will add the specified hostname to any
    addresses in the From: header of outgoing mail that lack this information. The
    FEATURE(masquerade_envelope) line takes things further, substituting the specified
    address for those that users specify in their mail clients.


    # ## Accepting Mail


    Recently, sendmail configurations have begun to include a line like the following
    in their m4 files:


    ```

    DAEMON_OPTIONS(`Port=SMTP,Addr=127.0.0.1, Name=M1A'')dn1

    ```


    This line has the effect of limiting sendmail to listening on the 127.0.0.1 (localhost)
    address. The result is that the server is available to local programs but not
    to other computers. This is a desirable configuration for most workstations and
    even non-mail servers. If you want sendmail to accept incoming mail or to function
    as a mail relay, though, you should remove this line. Ideally, you should comment
    it out by adding dn1 to the start of the line. You can then rebuild your sendmail.cf
    file and have the server reread its configuration.


    If you want sendmail to accept mail addressed to users of a whole domain or to
    a hostname other than the one the computer has, you should add those domain names
    or hostnames to the'
  merge: -1
  img_proc: true
- pgno: 289
  md: '/etc/mail/local-host-names file. In the case of the mail.pangaee.edu server,
    you should add both pangaee.edu and mesozoic.edu to this file in order to have
    the server accept mail addressed to both domains. You should also ensure that
    the following line is present in your m4 file:


    ```

    FEATURE(use_cw_file)

    ```


    > Accepting mail addressed to a domain requires configuring your domain''s DNS
    records. Specifically, you must add a new or change an existing mail exchanger
    (MX) record to point to the mail server computer—mail.pangaee.edu in this example.
    If you don''t know how to do this, you should consult with whoever maintains your
    domain''s DNS server.


    # ### Redirecting Mail


    Email aliases enable one address to stand in for another one. For instance, all
    mail servers are supposed to maintain an account called postmaster. Email to this
    account should be read by somebody who''s responsible for maintaining the system.
    One way to do this is to set up an alias linking the postmaster name to the name
    of a real account. You can do this by editing the aliases file, which usually
    resides in /etc/ or sometimes in /etc/mail/.


    The aliases file format is fairly straightforward. Comment lines begin with hash
    marks (#) and other lines take the following form:


    ```

    name: addr1[,addr2[,...]]

    ```


    The name that leads the line is a local name, such as postmaster. Each address
    (addr1, addr2, and so on) can be a local account name to which the messages are
    forwarded, the name of a local file into which messages are stored (denoted by
    a leading slash), a command through which messages are piped (denoted by a leading
    vertical bar character), the name of a file whose contents are treated as a series
    of addresses (denoted by a leading :include: string), or a full e-mail address
    (such as fred@example.com).


    A typical default configuration includes a few useful aliases for accounts such
    as postmaster. Most such configurations map most of these aliases to root. Reading
    mail as root is inadvisable, though—doing so increases the odds of a security
    breach or other problem because of a typo or bug in the mail reader. Thus, you
    may want to set up an alias line like the following:


    ```

    root: yourusername

    ```


    This redirects all of root''s mail, including mail directed to root via another
    alias, to yourusername. Once you make this, or any other, change to the aliases
    file, you must rebuild its binary counterpart, aliases.db. To do so, use the newaliases
    command:


    ```

    # newaliases

    ```'
  merge: -1
  img_proc: true
- pgno: 290
  md: "Another approach to redirecting mail is to do so on the user level. In particular,\
    \ you can edit the `~/.forward` file in a user's home directory to have mail for\
    \ that user sent to another address. Specifically, the `~/.forward` file should\
    \ contain the new address—either a username on the current computer or an entire\
    \ email address on another computer. This approach has the advantage that it can\
    \ be employed by individual users—say, to consolidate email from multiple systems\
    \ into one account without bothering system administrators. A drawback is that\
    \ it can't be used to set up aliases for nonexistent accounts or for accounts\
    \ that lack home directories. The `~/.forward` file could also be changed or deleted\
    \ by the account owner, which might not be desirable if you want to enforce a\
    \ forwarding rule that the user shouldn't be able to override.\n\n# ## Configuring\
    \ Sendmail as a Relay\n\nAll modern Linux distributions configure themselves so\
    \ that they do *not* relay mail by default—or at least, they configure themselves\
    \ so that they relay mail for only a very limited set of computers. The most common\
    \ type of relay configuration in sendmail uses the following control line (or\
    \ one similar to it) in the `m4` file:\n\n```\nFEATURE(`access_db')\n```\n\nThis\
    \ line tells the system to read the `access` file (stored in `/etc` or `/etc/mail`)\
    \ for information on who may relay messages. Listing 6.3 shows a typical `access`\
    \ file. This example file enables relaying for the local computer (as `localhost`,\
    \ `localhost`, `localhost`, and `127.0.0.1`) and for the local network (`172.25.98.0/24`).\
    \ Most default configurations omit this last option, which appears in Listing\
    \ 6.3 to fulfill the requirement in the scenario that the server relay mail for\
    \ the `pangaea.edu` domain. The assumption is that `pangaea.edu` has a rather\
    \ small network, consisting of that one block of IP addresses. Alternatively,\
    \ you could specify all the domain's network blocks or use the domain name itself—IP\
    \ addresses are safer, though, because they're harder to forge. If your system\
    \ shouldn't be relaying mail, the `access` file should lack any lines beyond the\
    \ ones for local relaying.\n\n# **Listing 6.3:** A Typical `access` File for Controlling\
    \ Mail Relaying\n\n```\n# by default we allow relaying from localhost...\nlocalhost\
    \ localhost.localdomain\t\tRELAY\nlocalhost\t\t\t\tRELAY\n127.0.0.1\t\t\t\tRELAY\n\
    # Relay for the local network\n172.25.98\t\t\t\tRELAY\n```\n\nSome other `m4`\
    \ file relaying options are also available in sendmail. Most of these include\
    \ the word `relay` in their names, such as `relay_entire_domain`. Unless you've\
    \ learned a great deal about email configuration and management, I recommend *you*\
    \ avoid using such options. In fact, one of these options, `promiscuous_relay`,\
    \ should *never* be used. It tells the computer to indiscriminately relay *all*\
    \ mail. In the days before spam, such configurations were considered a courtesy.\
    \ Today, they're madness!"
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Because open relays are such a threat, you should explicitly check for them.
    Review your access file and look for any option with the word relay in the m4
    configuration file. You can also use services that will connect to your mail server
    and attempt to relay mail as a way of testing your system, then give you a report
    of the results. One of these is hosted at http://www.abuse.net/relay.html. Be
    careful, though—it’s conceivable that a spammer somewhere has set up such a service
    as a way of locating open relays to abuse, so you should only use a trusted service.


    # ### Outgoing Relay Configuration


    Many Linux mail servers, particularly on workstations and small networks, should
    be configured to use an outgoing mail relay, aka a smart relay. This is the case
    for the workstations described in this task’s scenario. To configure these systems
    to use Pangaea University’s main mail server for outgoing mail, enable outgoing
    relaying in the workstations’ m4 files:


    ```

    FEATURE(`nullclient`, `mail.pangaea.edu`)

    ```


    In reality, you would change mail.pangaea.edu to the hostname of the computer
    that should relay the mail. You should also remove or comment out two other lines,
    if they’re present:


    ```

    MAILER(local)dn1

    MAILER(smtp)dn1

    ```


    Another way to make similar changes is to use the SMART_HOST feature:


    ```

    define(`SMART_HOST'', `mail.pangaea.edu`)

    ```


    The difference between the two is that the nullclient method is intended for very
    simple configurations that contain few other options. A workstation that should
    send all its email via the outgoing relay might use this option. SMART_HOST, by
    contrast, can be used in more complex configurations in which some mail remains
    local and some is relayed.


    When you’ve made these changes, rebuild sendmail.cf, and restarted or reloaded
    sendmail, the server should send all non-local mail to the specified mail server.
    This is handy if your ISP blocks direct outgoing SMTP connections (as many home-oriented
    ISPs do as an anti-spam measure) or if you want your organization’s mail to be
    filtered through a single powerful mail server system.


    # ### Criteria for Completion


    To complete this task, you should have configured one mail server to accept mail
    for two entire domains (pangaea.edu and mesozoic.edu). You should also have adjusted
    the server to redirect mail for postmaster (and, perhaps, some other addresses)
    to specific local users of your choice. Finally, you should have configured at
    least one other system’s sendmail configuration to direct its mail through the
    first one. These options can be tricky to implement, so be sure to test them by
    sending and reading mail using local mail clients such as mutt or KMail.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Task 6.7: Run a Web Server


    The World Wide Web (WWW or Web for short), to many people, synonymous with the
    Internet, although in reality the Web is just part of the Internet. The Web is,
    though, an extremely visible and popular part of the Internet. Naturally, Linux
    can function as a Web server computer. Several programs to handle this job exist,
    but Apache (http://httpd.apache.org) is the most popular by a wide margin. Apache,
    like sendmail, is a complex and powerful tool. This task can therefore only present
    the most basic Web server features and options; for more information, you should
    consult a book on the topic.


    # Scenario


    In addition to configuring the mail server described in Task 6.6, you must configure
    the Pangaean University Web server, www.pangaean.edu. The Web server should display
    Web pages housed in the /var/web/pangaean directory tree. This system should respond
    to the www.mesoziC.edu address by displaying a different set of Web pages than
    the ones displayed when accessed as http://www.pangaean.edu; the http://www.mesoziC.edu
    pages should be located in the /var/web/mesoziC directory. The Web server should
    also display users'' home pages, accessed using the usual user Web page format—http://www.pangaean.edu/~user/
    or http://www.mesoziC.edu/~user/ for its two addresses. You will use Apache to
    accomplish these goals.


    # Scope of Task


    To perform this task, you must install and configure the Apache Web server. Most
    of the Apache default options are suitable for a simple Web site, but you''ll
    need to tweak or verify a few of them to ensure that the goals laid out in the
    scenario are met.


    # Duration


    This task should take half an hour to an hour to complete. Real-world Apache configuration
    changes can take anywhere from a couple of minutes to many hours, depending on
    the complexity of the configuration, your experience, and whether or not you run
    into any unexpected problems.


    # Setup


    You must have root access to a Linux system that runs Apache. If the computer
    you''re using doesn''t currently run Apache, you should download and install it.
    Because Apache ships with all major Linux distributions, check your distribution''s
    package system first; Apache usually ships as a package called apache or httpd,
    so look for both of these names. (Phase 3 describes Linux package management.)


    In addition to the Linux system on which you''re configuring the Web server, you
    should have access to another computer and its Web browser. You''ll use this system
    to test your Apache configuration changes.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'The Linux system you''re configuring must be accessible under two different
    hostnames (`www.pangaea.edu` and `www.mesozoic.edu` in this example). This configuration
    normally requires editing DNS server entries; however, you might be able to achieve
    the same effect by editing the `/etc/hosts` file on your client computer.


    # Caveats


    The usual **root**-access cautions apply to this task. In addition, Web servers
    are unusually visible network servers. Crackers frequently attack Web server computers,
    and if the Web server software (or any other server running on the computer) is
    buggy or misconfigured, the result can be a serious compromise of the computer.
    This can lead to defacement of your Web pages, theft of your data, use of your
    system for further attacks on your own or other networks, and so on. For this
    reason, you should be very cautious about configuring a Web server. If you don''t
    need to run Web server software on your computer, you should shut it down or,
    better yet, uninstall the software when you''re done with this task. As a general
    rule, if you''re running a Web server on the Internet at large, you should learn
    more about Apache than you can learn from this task alone. If you want to run
    Apache on a well-protected computer on a local network (say, behind a NAT router
    for use by local users), the risks are much less substantial.


    # Procedure


    To complete this task, you must first prepare directories for storing your Web
    pages. You should then find and understand the Apache configuration files. You
    can then configure Apache to use the directories you''ve created, both for the
    main domain Web pages and for user Web pages.


    # Preparing Your Web Space


    The scenario for this task specifies that the `/var/web/pangaea` and `/var/web/mesozoic`
    directories should hold the Web pages for the two main Web sites hosted by your
    Web server. You can create these directories using ordinary Linux directory-creation
    commands:


    ```

    ```

    # mkdir -p /var/web/pangaea

    # mkdir /var/web/mesozoic

    ```

    ```


    The `-p` option on the first command ensures that the `/var/web` directory will
    be created if it doesn''t already exist. When you create these directories as
    **root**, they''ll be owned by **root** and, in all probability, other users won''t
    be able to create files in them. Chances are other users have been tasked with
    creating the actual Hypertext Markup Language (HTML) files that make up each Web
    site. Thus, you might want to change the ownership, group ownership, or permissions
    of these directories to enable other users to write to them. For instance, suppose
    the computer has a **wmaster** group and users of this group should be able to
    modify Web pages. You might enable this access by changing ownership and permissions
    in this way:


    ```

    ```

    # cd /var/web

    # chgrp wmaster mesozoic pangaea

    # chmod 0775 mesozoic pangaea

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'Alternatively, you could give ownership of these directories to individual
    users, employ different groups for each directory, or use any other security scheme
    you see fit. Giving world write access (0777 permissions) is inadvisable, though;
    this sort of permission gives anybody who has an account on the computer—or who
    breaks into any user’s normal account—the ability to write to the Web space directories.


    Actually creating Web pages requires creating or editing HTML files. Traditionally,
    Apache loads a file called index.html or index.htm as the default page for a site.
    Listing 6.4 shows a simple HTML file you can use as a placeholder. Change the
    file’s identification lines (the lines beginning <TITLE> and <CENTER>) for each
    site so that you can verify that Apache is delivering the correct file for each
    of its hostnames. Creating complex HTML files and Web sites is a topic that’s
    well beyond the scope of this task.


    # **Listing 6.4:** Sample HTML File


    ```

    <DOC/TYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">

    <HTML><HEAD>

    <TITLE>Pangaea University</TITLE>

    </HEAD>

    <CENTER><H1 ALIGN="CENTER">Pangaea University’s Web Page</H1></CENTER>


    <p>This is a sample Web page. The server is willing, but the Web site is weak.</p>

    </body>

    </html>

    ```


    # ## Touting Apache Configuration Files


    Apache’s main configuration file takes on various names depending on the distribution.
    The most common are **httpd.conf**, **httpd2.conf**, **apache.conf**, and **apache2.conf**.
    (Apache 2.0 and later packages sometimes use a 2 in the configuration filename.)
    The location of the Apache configuration file also varies from one system to another,
    but common places include */etc/apache*, */etc/apache2*, */etc/httpd*, */etc/htpd*,
    or the conf subdirectory of any of these. The name of the Apache executable can
    vary, but it is usually **httpd**.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_294_0.png)


    > If you can’t find your Apache configuration file, use your package manager to
    find it. For instance, if you installed Apache on an RPM-based system as apache,
    you could type **rpm -qI apache | grep conf**. This command lists all the files
    in the apache package and narrows the list to those that include the string conf.
    Phases 3 and 1 describe package management and grep, respectively.


    Whatever its name, the Apache configuration file consists of comments, denoted
    by hash marks (#), and directive lines that take the following form:


    *Directive Value*'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'The *Directive* is simply an option name or command, such as `LoadModule`,
    `Listen`, or `MaxClients`. In most cases, the `Value` is a filename, number, or
    other single value that’s assigned to the *Directive*. Sometimes the `Value` consists
    of multiple items; for instance, `LoadModule` takes a two-part directive that
    consists of a module name and a module filename. The parts of such a multi-part
    `Value` are separated by spaces.


    Some option lines are grouped together in blocks, which are identified by beginning
    and ending lines in angle brackets (`<>`), with the name of the ending angle bracket
    line beginning with a slash (`/`):


    ```

    ```apache

    <IfModule perchild.c>

    NumServers        5

    StartThreads       5

    MaxThreadsPerChild 20

    </IfModule>

    ```

    ```


    Typically, these blocks apply only if a particular condition exists. For instance,
    the `<IfModule perchild.c>` block shown here applies only if the `perchild.c`
    module is available and loaded. (Modules are described shortly.)


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_295_0.png)


    Several servers other than Apache have adopted Apache-like configuration file
    formats. Thus, familiarizing yourself with this style of configuration file can
    be helpful even if you don’t need to administer Apache.


    # ## Configuring Your Domains


    Apache uses the `DocumentRoot` directive to specify where the server looks for
    Web pages. You should locate this line and change it to point to whichever directory
    you want to hold Apache’s default Web site:


    ```

    `DocumentRoot ''/var/web/pangaea''`

    ```


    Chances are you’ll find a `<Directory>` reference to the directory that the server
    used as its default Web space location; you should find this option and change
    it to point to your new default directory:


    ```

    `<Directory "/var/www/html">`

    ```


    As described earlier, such lines specify the beginnings of directive blocks. In
    this case, the Apache configuration file is setting options that apply to the
    default server directory. If you fail to change the directory specified on this
    line, Apache will apply its defaults to your new directory. These defaults might
    or might not be appropriate for your site.


    To support `http://www.mesozoic.edu` addressing, you must use the `NameVirtualHost`
    directive and implement a `<VirtualHost>` directive block for each hostname, with
    the default name’s configuration appearing first:'
  merge: -1
