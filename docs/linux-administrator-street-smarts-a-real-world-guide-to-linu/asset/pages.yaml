- pgno: 65
  md: '# ## Setup


    To prepare for the task, log into your user account on your Linux system. (You
    can—and should—perform this task as an ordinary user.) You may perform this task
    in either a text-mode or a GUI login, but in the latter case, you must launch
    an **xterm** or similar command prompt window.


    # ## Caveats


    Performing this task as **root** poses the usual risks of accidentally damaging
    the installation. If you badly corrupt your own **bash** configuration file, it’s
    conceivable (but unlikely) that you’ll be unable to log in again. If this happens,
    use a **root** login to copy */etc/skel/.bashrc* to your user home directory and
    change the ownership of the copied file to your normal user account.


    # ## Procedure


    To complete this task, you’ll change two environment variables. First you’ll do
    this temporarily so that your changes affect just a single login session. You’ll
    then make your changes permanent by editing a user configuration file. At the
    end of this procedure, I describe several other important environment variables,
    which you might choose to change if you so desire.


    # ### Adjusting Your Shell Prompt


    The prompt in **bash** is controlled through the **$PS1** variable. You set a
    variable by specifying the variable name (minus the leading dollar sign, $), an
    equal sign (=), and the value to which you want to set the variable. In most cases,
    you should surround the value of the prompt by quotes (’). For instance, you can
    set your **bash** prompt to read Your **command**? by typing the following:


    ```

    ```

    $ PS1="Your command? "

    ```

    ```


    Pay attention to the spaces (and lack thereof), particularly around the equal
    sign; adding spaces around the equal sign will cause this command to fail. If
    you want a space between the prompt and the point at which you begin typing, be
    sure to include one at the end of the new prompt string.


    The scenario presented earlier, though, specified that you want to include the
    time and date in the command prompt. To do this, you must include special strings
    that serve as stand-ins for other data. *Specifically*, the current date can be
    denoted by \d and the time can be denoted by \@. Thus, you can set your prompt
    to include the date and time by issuing the following command:


    ```

    ```

    $ PS1="\d \@ $ "

    ```

    ```


    The result might resemble the following, although of course the date and time
    shown in the prompt will change with the real date and time:


    ```

    ```

    Thu Jun 08 11:44 AM $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'In most distributions, the system is configured with default prompts that include
    your username, the computer''s hostname, and the current directory, but details
    differ. You can learn what your shell prompt is by typing **echo** `\$PS1`. This
    command displays the contents of the `\$PS1` variable. Consult the man page for
    **bash** for more information on common substitution strings, including those
    found in your distribution''s default shell prompt.


    Setting the `\$PS1` variable as just described has one important limitation: The
    change is restricted to the current running instance of **bash**. Any program
    launched from **bash** will inherit the default value of `\$PS1`. This is true
    even of **bash** itself. With your altered prompt displayed, try typing **bash**
    to launch another shell from the current one. Your command prompt will be replaced
    by your default prompt. Typing **exit** from the new shell will return you to
    the original one with the modified prompt.


    To make a change that can be inherited by programs launched from your current
    session, you must use the **export** command after setting the variable:


    ```

    ```bash

    $ PS1="\d \@ \$ "

    $ export PS1

    ```

    ```


