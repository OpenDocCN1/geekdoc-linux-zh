- pgno: 124
  md: "Option lines set miscellaneous features, some of them driver- or board-specific.\
    \ Unless you know to do otherwise, it's probably best to leave them as they are.\n\
    \nIf you don't know what driver to use, consult your X server's documentation.\
    \ You may be able to find some clues by examining the X driver module files. These\
    \ appear in a directory such as /usr/lib/xorg/modules/drivers/ or /usr/lib64/modules/drivers/,\
    \ depending on your distribution and X server. Drivers have names that end in\
    \ _drv.o; the part before that string is the driver name that you would enter\
    \ on the Driver line. You may see a name that seems promising for your card, in\
    \ which case you can consult the man page for that driver—for instance, type man\
    \ trident if you think the trident_drv.o file might be appropriate for your hardware.\n\
    \n![](img/f430a19bdf014c43ad7c2d594afd5b21_124_0.png)\n\nX drivers, like most\
    \ Linux drivers, are written for chipsets, not cards. The manufacturer of your\
    \ video card might not be the same as the manufacturer of your video chipset,\
    \ so you might need to dig a bit to figure out who made the video chipset.\n\n\
    # # Putting It All Together\n\nThe Screen section ties together the Monitor and\
    \ Device sections, so be sure you point to the correct sections:\n\n```\n```1\n\
    Device \"mx400\"\nMonitor \"monitor1\"\n```\n```\n\nIf you didn't change the Identifier\
    \ lines in the earlier sections, you shouldn't need to make any changes here.\n\
    \nIn addition to pointing to the correct Monitor and Device sections, the Screen\
    \ section tells X what resolution and color depth to use. The DefaultDepth option\
    \ sets the default color depth, in bits per pixel:\n\n```\n```1\nDefaultDepth\
    \ 24\n```\n```\n\nAs a general rule, 24 is a good value here for modern hardware;\
    \ however, older hardware might work better with 16-, 15-, or even 8-bit color,\
    \ at the cost of a reduced number of colors in the display. Occasionally 32-bit\
    \ color depth works better than 24-bit color. The greater the color depth, the\
    \ slower the display will be, but this slowness is generally not a serious problem\
    \ with even low-end modern video hardware.\n\nSetting the DefaultDepth line tells\
    \ X which Display subsection to use. These subsections specify what video resolutions\
    \ to use:\n\n```\n```\nSubsection \"Display\"\n   Depth 24\n   Modes \"1280x1024\"\
    \ \"1024x768\" \"800x600\" \"640x480\"\n   Virtual 1280 1024\nEndSubsection\n\
    ```\n```"
