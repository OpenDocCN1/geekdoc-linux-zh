  md: 'Partition number (1-5): **5**

    Hex code (type L to list codes): **82**

    Changed system type of partition 5 to 82 (Linux swap / Solaris)


    Finally, you should review your changes to be sure they''re correct and then save
    the partition table:


    Command (m for help): **p**


    Disk /dev/sda: 100 MB, 100663296 bytes

    4 heads, 48 sectors/track, 1024 cylinders

    Units = cylinders of 192 * 512 = 98304 bytes


    | Device | Boot | Start | End | Blocks | Id | System |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | /dev/sda1 | | 1 | 815 | 78216 | 83 | Linux |

    | /dev/sda2 | | 816 | 1024 | 20064 | 5 | Extended |

    | /dev/sda5 | | 816 | 1024 | 20040 | 82 | Linux swap / Solaris |


    Command (m for help): **w**

    The partition table has been altered!


    Calling ioctl() to re-read partition table.

    Syncing disks.


    > **TIP** You may want to type **p** after every major change to be sure it was
    correct. I didn''t do so in this example to keep it brief.


    When specifying the partition''s position and size, you give fdisk a starting
    cylinder number and either an ending cylinder number or a size in bytes, kilobytes
    (+**nK**), megabytes (+**nM**), or gigabytes (+**nG**). This example used both
    methods of specifying a size. Typically, you''ll give a size in megabytes or gigabytes
    for most partitions, but use an end cylinder number for the final partition on
    the disk.


    By default, fdisk creates partitions with a type code of **0x83**, which denotes
    a Linux filesystem. Many other partition type codes exist, most of them corresponding
    to non-Linux filesystems. You can see a list of the most common codes by typing
    **L** when Linux prompts you for a type code or by typing **1** from the main
    fdisk prompt.


    The preceding sequence ends with the w command, which writes the changes to disk
    and exits from the program. If your examination of the disk''s partition reveals
    problems, you should instead type **q** to quit from fdisk without saving changes.
    Like most text editors, fdisk doesn''t actually write the changes you enter until
    you tell it to do so.


    In most cases, the Linux kernel won''t be aware of the changes you''ve made until
    you reboot the computer. If this is true, fdisk will warn you with a message to
    that effect when you exit.'
