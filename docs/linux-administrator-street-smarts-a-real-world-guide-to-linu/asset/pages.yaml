- pgno: 235
  md: 'intend to mount the partition manually at first, in order to test that the
    filesystem works as intended. In Task 5.5, you’ll mount the partition permanently.


    # Scope of Task


    This task explores the mount and umount commands, which mount and unmount a partition,
    respectively. (The umount command is spelled correctly; it contains just one n.)
    The basics of these commands are fairly simple, but mount, in particular, supports
    important options you should understand.


    # Duration


    This task should take about half an hour to complete. Once you’re familiar with
    these commands, you’ll be able to use them in a matter of seconds.


    # Setup


    You need root access to your computer to perform this task. This task is written
    with the assumption that you’ve completed the previous two tasks and so have a
    partition you can mount and unmount at will. If not, you should create an appropriate
    partition. In a pinch, you can create a filesystem on a floppy disk (/dev/fd0)
    and use it.


    # Caveats


    Because you need root access to perform this task, the usual caveats concerning
    superuser status apply. In addition, you should be aware of the risks of mounting
    and unmounting filesystems. If you accidentally mount a filesystem over a populated
    directory tree (say, /home), the files in that directory tree will become inaccessible.
    You can restore the original files by unmounting the filesystem, but in the meantime
    you may run into any of many different problems, depending on the directory tree
    you’ve blocked. Linux prevents unmounting filesystems on which files are open,
    so you’re unlikely to be able to accidentally unmount a truly critical filesystem.
    You could accidentally unmount a filesystem that’s important but not currently
    in use, though. Fortunately, these mount-specific problems are all easily corrected.
    In a worst-case scenario, rebooting should restore the system to normal.


    # Procedure


    This task involves mounting a filesystem and then unmounting it. Between these
    two fairly basic operations, I describe additional capabilities of the mount command.
    These extra features are handy when you want to give ordinary users the ability
    to mount a filesystem or when you need to fine-tune the mount operation.


    # Mounting a Filesystem


    Before you can mount your new filesystem, you must prepare a mount point for it.
    You already know how to do this, although you may not realize it because a mount
    point is nothing'
