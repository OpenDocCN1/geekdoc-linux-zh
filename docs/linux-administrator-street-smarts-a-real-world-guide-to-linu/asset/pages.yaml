    so you want to check and repair it with `fsck`.


    # ### Scope of Task


    This task involves using a single `fsck` command and a couple of preparatory and
    clean-up commands, so the task itself is fairly limited. You should understand
    some of what `fsck` can and cannot do before you proceed, though.'
