- pgno: 324
  md: '![](img/f430a19bdf014c43ad7c2d594afd5b21_324_0.png)


    The phrase “last but not least” definitely applies to this phase of the book.
    Security is covered last because it relies on skills you’ve learned in previous
    phases. Security is, though, an extremely


    important topic—your computer is worse than useless if it’s taken over by miscreants
    intent on spreading spam, attacking other computers, stealing your data, or other
    things you’d rather not have them do.


    This phase begins with a look at ways you can block unwanted network access of
    your computer. You can then begin setting security restrictions aimed at improper
    user-level access of the computer. One specific and very important user-level
    security restriction is to set good passwords, so that topic is given its own
    task. Finally, despite your best efforts, security breaches could occur, so this
    phase concludes with a look at ways you can monitor for intruders.


    > NOTE

    > This task maps to portions of the CompTIA Linux+ objective 4 and to portions
    of the LPIC objective 114.


    # Task 7.1: Blocking Unwanted Network Access


    The largest phase of this book is Phase 6, which includes 11 tasks. This size
    is justified and reflects the importance of networking for Linux—or for computers
    in general, for that matter. Most server computers are necessarily network-accessible
    at all times, and many business workstations are similarly connected. Even many
    residential computers have always-up broadband connections. With such constant
    network access comes constant exposure to network threats. Understanding the basic
    nature of these threats and knowing how to block them will go a long way toward
    keeping your computer safe.


    > NOTE

    > Computer security is a matter of degrees, not of absolutes. There’s no way to
    make a computer completely and 100 percent safe from intrusion. Even if you disconnect
    it from the network, it could be stolen by a burglar. Unfortunately, steps that
    help keep a computer (relatively) safe from intruders also often make it less
    convenient to use the computer. You must decide, on a case-by-case basis, whether
    a particular security measure provides a benefit worthy of its drawbacks.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# Scenario


    Your network runs several server computers—mail servers, Web servers, file sharing
    servers, and so on. You’ve been given the job of reviewing the network security
    for these systems and devising a plan to improve that security, with an emphasis
    on preventing unwanted network access to the computers by unauthorized individuals.
    (In other words, this task doesn’t cover issues such as burglaries or abuse by
    people who have passwords to the systems in question.)


    # Scope of Task


    This task’s scope is rather broad and covers several security measures you can
    take. As such, each measure is outlined fairly broadly; you’ll need to do more
    work beyond this task to create working and practical solutions for real-world
    networks.


    # Duration


    Most of the network security measures described here can be implemented in a few
    minutes, but to really tweak them for your specific network requires additional
    research on your network’s configuration and perhaps on the tools you’ll be using.
    Thus, the entire task will take anywhere from an hour to several hours to complete,
    depending on how thoroughly you implement the solutions described here and how
    many computers you lock down.


    # Setup


    This task assumes that your network is functioning in at least a basic way, including
    having a working Internet connection. You’ll need **root** access to many (perhaps
    all) of the computers on your network. You may also need access to the network’s
    wiring or wireless infrastructure. If your network includes a router, you’ll need
    **root** access (or its equivalent) to the router.


    # Caveats


    The usual **root** access caveats apply to this task. Furthermore, the types of
    changes described in this task have the potential to disrupt network access. Thus,
    it’s possible that you’ll interfere with some or all users’ ability to use the
    network servers or even to use the clients on their desktop systems. You should
    always test accessibility after making a change. You should test conditions that
    both should and should not be blocked.


    # Procedure


    This task involves examining several aspects of your system’s security. Specific
    subtasks are shutting down unused servers, implementing access rules in the servers
    you leave running, implementing access control rules in *xinetd*, implementing
    access control rules using TCP Wrappers, setting up local firewall rules, and
    configuring a stand-alone firewall computer. On most computers, you’ll implement
    *xinetd* or TCP Wrappers rules, but not both. You’ll do all of these tasks but
    the stand-alone firewall configuration on individual client and server computers
    on your network; the stand-alone firewall is a single computer (typically your
    existing router) that you configure to protect other computers.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '> Security is best applied in layers, even when each layer does a similar job.
    If one layer fails, the next layer may succeed.


    # ## Shutting Down Unused Servers


    The first step to improving network security is to shut down unused servers. Intruders
    often gain access to victims’ computers by exploiting bugs or misconfigurations
    of servers that run on the computers. If a server isn’t running, it can’t be exploited
    in this way. The trick is to identify the servers that are running on your computer.


    One approach to identifying servers is to use the netstat program, which was introduced
    in Phase 6. Its --listening (-l) option provides a listing of the ports to which
    any server is listening and waiting for external connections. Adding the --program
    (-p) option causes netstat to display the name and process ID (PID) number of
    the process that’s doing the listening. To get a complete listing, you must issue
    the command as root:


    ```

    ```

    # netstat -lp

    ```


    ```


    Active Internet connections (only servers)



    | Proto | Recv-Q | Send-Q | Local Address | Foreign Address | State | PID/Program
    name |

    |---|---|---|---|---|---|---|

    | tcp | 0 | 0 | *:nfs | *.* | LISTEN | - |

    | tcp | 0 | 0 | *:netbios-ssn | *.* | LISTEN | 10265/smbd |

    | tcp | 0 | 0 | *:sunrpc | *.* | LISTEN | 10098/portmap |

    | tcp | 0 | 0 | *:ftp | *.* | LISTEN | 10480/xinetd |

    | tcp | 0 | 0 | *:ssh | *.* | LISTEN | 10316/sshd |

    | tcp | 0 | 0 | *:ipp | *.* | LISTEN | 9906/cupsd |


    This example’s output has been truncated, but it shows several servers that are
    listening for connections, including NFS, Samba (smbd), FTP, SSH, and CUPS (ipp).
    The Sun RPC (portmap process) is required for NFS and certain other servers. You
    can see the PID numbers and process names for most of these servers; NFS is the
    only exception, because it’s handled by the kernel, which has no PID number.


    One limitation of this approach is indicated by the FTP server, which points to
    the xinetd process. Servers that are launched by a super server show up as being
    handled by the super server. Thus, you must also refer to the super server configuration
    to figure out precisely what the server is.


    Other methods of identifying running servers exist, too. These include examining
    SysV startup scripts and your super server configuration and performing a port
    scan from another computer. You can examine your startup scripts and configuration
    files, if you like. Port scanning is a moderately complex topic in and of itself,
    and it’s got some major legal drawbacks—performing unauthorized port scans can
    land you in trouble, so it’s best not to do it, even with good intentions, unless
    you’ve studied the issues and obtained whatever permissions you need to do such
    scans.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'Once you’ve identified running servers, you can begin shutting down those that
    you don’t need. Only you (or others at your site) can decide which servers are
    necessary and which aren’t. Once you’ve made this determination, the best way
    to shut down an unwanted server is generally to uninstall it, as described in
    Phase 3. If this isn’t possible, you should be able to remove the its SysV startup
    script from your runlevel’s configuration (as described in Phase 3) or remove
    its configuration from your super server configuration (as described in Phase
    6). In all of these cases, you should be sure to manually shut down the server
    (or restart your super server, if the server you’ve disabled is launched in that
    way), as described in the relevant phases of this book.


    # ## Using Server Access Rules


    Many servers provide their own unique access control methods. The details of these
    methods vary greatly from one server to another, so I can’t do more than describe
    the rough outline of what you can change in this section.


    Some servers provide access rules that enable you to grant access to some computers
    while denying access to others. For instance, in Samba, you can use the hosts
    allow or hosts deny directives, which take hostnames, IP addresses, or network
    block addresses as options:


    ```

    hosts allow = 192.168.1. goodqull.example.com

    ```


    This example grants access to all computers on the 192.168.1.0/255 network block
    and to the goodqull.example.com computer. You can specify this directive in the
    [global] section, in which case it applies to the server as a whole, or in the
    section for an individual share, in which case it applies just to that share.


    Similar access control rules exist in Apache (the Allow from and Deny from options
    in the Apache configuration file), CUPS (which also uses Allow from and Deny from,
    but in /etc/cups/cupsd.conf), and several other servers. As described in Phase
    6, Linux’s NFS server relies on IP address trusted hosts authentication exclusively,
    so setting these options carefully is particularly important with NFS. You should
    consult the documentation for each of your servers to learn if you can block access
    by IP address or hostname.


    As a general rule, it’s best to use IP addresses or network block addresses in
    options such as these. When you use a hostname or domain name, the server relies
    on the Domain Name System (DNS) to identify computers. If you—or perhaps even
    another—DNS server has been compromised or contains inaccurate information, your
    security rules will be that much less effective.


    Many servers use usernames and passwords to control access. Task 7.3 describes
    how to generate good passwords. You may want to review your server’s password
    access options, if they exist. For instance, as described in Phase 6, Samba supports
    both encrypted and unencrypted passwords, with the former being preferable. SSH
    enables you to disable direct root logins, which can improve security slightly.
    You can also use host keys instead of or in addition to passwords with SSH, which
    can improve convenience—but if a client’s key is stolen, the server system can
    then be compromised.


    # ## Using xinetd Access Restrictions


    Most Linux distributions use xinetd as a super server, and xinetd provides some
    powerful access control features. The distributions that use xinetd use a main
    configuration file called'
  merge: -1
  img_proc: true
- pgno: 328
  md: '/etc/xinetd.conf, but this file is largely empty because it calls separate
    files in the /etc/xinetd.d directory to do the real work. This directory contains
    separate files for handling individual servers. Phase 6 includes information on
    basic xinetd configuration. Security is handled on a server-by-server basis through
    the use of configuration parameters:


    **Network interface** The bind option tells xinetd to listen on only one network
    interface for the service. For instance, you might specify bind = 192.168.23.7
    on a router to have it listen only on the Ethernet card associated with that address.
    This feature is extremely useful in routers, but it is not as useful in computers
    with just one network interface. (You can use this option to bind a server only
    to the loopback interface, 127.0.0.1, if a server should be available only locally.
    You might do this with a configuration tool like the Samba Web Administration
    Tool, or SWAT.) A synonym for this option is interface.


    **Allowed IP or network addresses** You can use the only_from option to specify
    IP addresses, networks (as in 192.168.78.0/24), or computer names on this line,
    separated by spaces. The result is that xinetd will accept connections only from
    these addresses.


    **Disallowed IP or network addresses** The no_access option is the opposite of
    only_from; you list computers or networks here that you want to blacklist.


    **Access times** The access_times option sets times during which users may access
    the server. The time range is specified in the form hour:min-hour:min, using a
    24-hour clock. Note that this option only affects the times during which the server
    will make its initial response. If xinetd''s access_times option is set to 8:00-17:00
    and somebody logs in at 4:59 PM (one minute before the end time), that user may
    continue using the system well beyond the 5:00 PM cutoff time.


    You should enter these options into the files in /etc/xinetd.d that correspond
    to the servers you want to protect. Place the lines between the opening brace
    ({) and closing brace (}) for the service. If you want to restrict all your xinetd-controlled
    servers, you can place the entries in the default section in /etc/xinetd.conf.


    # # Using TCP Wrappers


    Although the inetd super server doesn''t provide xinetd''s access control tools,
    you can use inetd in conjunction with another package, known as TCP Wrappers,
    to provide similar access controls. This package provides a program known as tcpd.
    Instead of having inetd call a server directly, inetd calls tcpd, which does two
    things: It checks whether a client is authorized to access the server, and if
    the client has this authorization, tcpd calls the server program.


    TCP Wrappers is configured through two files: /etc/hosts.allow and /etc/hosts.deny.
    The first specifies computers that are allowed access to the system in a particular
    way, the implication being that systems not listed are not permitted access. By
    contrast, hosts.deny lists computers that are not allowed access; all others are
    granted access to the system. If a computer is listed in both files, hosts.allow
    takes precedence.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'Both files use the same basic format. The files consist of lines of the following
    form:

    *daemon-list* : *client-list*


    The *daemon-list* is a list of servers, using the names for the servers that appear
    in *etc/services*. Wildcards are also available, such as ALL for all servers.

    The *client-list* is a list of computers to be granted or denied access to the
    specified daemons. You can specify computers by name or by IP address, and you
    can specify a network by using a leading or trailing dot (.) when identifying
    networks by name or IP address block, respectively. For instance, .tuna.edu blocks
    all computers in the tuna.edu domain, and 192.168.7. blocks all computers in the
    192.168.7.0/24 network. You can also use wildcards in the *client-list*, such
    as ALL (all computers). EXCEPT causes an exception. For instance, when placed
    in hosts.allow, 192.168.7. EXCEPT 192.168.7.105 blocks all computers in the 192.168.7.0/24
    network except for 192.168.7.105.

    The *man* pages for *hosts.allow* and *hosts.deny* (they''re actually the same
    document) provide additional information on more advanced features. You should
    consult them as you build TCP Wrappers rules.


    > Remember that not all servers are protected by TCP Wrappers. Normally, only
    those servers that inetd runs via tcpd are so protected. Such servers typically
    include, but are not limited to, Telnet, FTP, TFTP, rlogin, finger, POP, and IMAP
    servers. A few servers can independently parse the TCP Wrappers configuration
    files, though; consult the server''s documentation if in doubt.


    # ## Setting Up Local Firewall Rules


    The Linux kernel is capable of filtering packets based on various low-level attributes,
    such as the source and destination IP addresses, the source and destination port
    numbers, and whether a packet is the first one of a session or a continuation
    of an existing connection. For it to do so, though, you must use a utility that
    modifies the kernel''s packet filter table. In the 2.4.x and later kernels, this
    utility is known as *iptables*. The 2.2.x kernel used a simpler tool, known as
    *ipchains*, to do this job, and the 2.0.x kernel used *ipfwadm* for this task.
    Each later kernel includes support for the older tools, so you can continue using
    *ipchains* or even *ipfwadm* with more recent kernels if you like; however, to
    access the full features of your kernel, you should use the latest packet filtering
    tool available for it.


    To understand packet filter firewall rules, consider Figure 7.1, which shows the
    configuration of the filter table. In normal packet handling, one or more of three
    chains is involved: INPUT, OUTPUT, and FORWARD. To protect a computer from unwanted
    outside access, you''d write INPUT chain rules to block input packets from untrusted
    sources. You might also write OUTPUT chain rules to prevent abuses by local users
    or as a secondary line of defense for your local computer. (To gain full control
    of your computer, an intruder needs to receive data from your system, not just
    send data to it, so OUTPUT chain blocks can be helpful in protecting the computer.)'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# FIGURE 7.1 Linux uses a series of rules, which are defined in chains that
    are called at various points during processing, to determine the fate of network
    packets.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_330_0.png)


    All of the chains implement a default policy. This policy determines what happens
    to a packet if no rule explicitly matches it. The default for the default policy
    is ACCEPT, which causes packets to be accepted. This policy is sensible in low-security
    situations, but for a more secure configuration, you should change the default
    policy to DROP or REJECT. The former causes packets to be ignored. To the sender,
    it looks as if a network link was down. The REJECT policy causes the system to
    actively refuse the packet, which looks to the sender as if no server is running
    on the targeted port. This option requires explicit kernel support. Both DROP
    and REJECT have their advantages. DROP reduces network bandwidth use and reduces
    the system’s visibility on the network, whereas REJECT can improve performance
    for some protocols, such as auth/ident, which may retry a connection in the event
    a packet is lost. Using either DROP or REJECT as a default policy means that you
    must explicitly open ports you want to use. This is more secure than using a default
    policy of ACCEPT and explicitly closing ports because you’re less likely to accidentally
    leave a port open when it should be closed.


    To create firewall rules, you use the `iptables` command. You should probably
    start with the `-L` option, which lists the current configuration:


    ```

    ```

    # iptables -L -t filter

    Chain INPUT (policy ACCEPT)

    target     prot opt source               destination


    Chain FORWARD (policy ACCEPT)

    target     prot opt source               destination


    Chain OUTPUT (policy ACCEPT)

    target     prot opt source               destination

    ```

    ```


    The `-t filter` part of this command specifies that you want to view the filter
    table. This is actually the default table, so you can omit this part of the command
    if you like. In any event,'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'the result is a list of the rules that are defined for the specified (or default)
    table. In this case, no rules are defined and the default policy is set to ACCEPT
    for all three chains in the table. This is a typical starting point, although
    depending on your distribution and your installation options, it''s possible yours
    will have rules already defined. If so, you should track down the script that
    sets these rules and change or disable it. Alternatively, or if you just want
    to experiment, you can begin by flushing the table of all rules by passing `-F
    CHAIN` to `iptables`, where CHAIN is the name of the chain. You can also use `-P
    CHAIN POLICY` to set the default policy:


    ```

    # iptables -t filter -F FORWARD

    # iptables -t filter -P FORWARD DROP

    ```


    These two commands flush all rules from the FORWARD chain and change the default
    policy for that chain to DROP. Generally speaking, this is a good starting point
    when configuring a firewall, although using REJECT rather than DROP has its advantages,
    as described earlier. You can then add rules to the chain, each of which matches
    some selection criterion:


    ```

    # iptables -A INPUT -p tcp --dport 445 -s 172.24.1.0/24 -j ACCEPT

    ```


    In this case, the iptables command implements three rules, all of which apply
    to the INPUT chain (-A INPUT). First, the packet must be a TCP packet (-p tcp).
    Second, the destination port number must be 445 (--dport 445). Finally, the source
    IP address must be on the 172.24.1.0/24 network block (-s 172.24.1.0/24). Packets
    that match all of these rules will be accepted; those that fail to match even
    a single rule will be dropped (assuming this is the default configuration) unless
    they match some other rule in the chain.


    > > **NOTE**

    > > The iptables command accepts a large number of rules, some of which are demonstrated
    shortly. Read the command''s man page for more details.


    A complete chain is created by issuing multiple iptables commands, each of which
    defines a single rule. You can then view the result by typing iptables -L, as
    described earlier. Listing 7.1 shows a sample iptables firewall script.


    # Listing 7.1: A Sample Linux Firewall Script for Use on a Workstation


    ```

    #!/bin/bash


    iptables -F INPUT

    iptables -F FORWARD

    iptables -F OUTPUT


    iptables -P INPUT DROP

    iptables -P FORWARD DROP

    iptables -P OUTPUT DROP

    ```'
  merge: -1
  img_proc: true
