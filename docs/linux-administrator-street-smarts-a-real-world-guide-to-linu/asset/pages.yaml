    \ or /etc/rc.d/rc.local.\n\n> **WARNING**\n> \n> For security reasons, you shouldn’t\
    \ leave oftpd running indefinitely unless you have a valid reason to run an anonymous\
    \ FTP server on your computer. Disable it and, ideally, uninstall the software\
    \ when you’re done with this task.\n\n# Criterias for Completion\n\nThis task\
    \ requires you to install a program from source code. To do this, you must download,\
    \ decompress, prepare, compile, install, and test the software. A failure to accomplish\
    \ any of these sub-goals will prevent ultimate completion of the task. As a small\
    \ program, oftpd is less likely to cause problems than some other packages. Nonetheless,\
    \ it’s possible that a system-specific incompatibility on your computer will cause\
    \ a problem. Resolving such problems can be frustrating, particularly if you’re\
    \ new to the software-compilation task.\n\n# Task 3.4: Perform System Backups\n\
    \nTo keep your system running well, you must master the techniques of software\
    \ installation, upgrading, and management described in the preceding tasks. Even\
    \ with those and other system administration tools at your disposal, though, your\
    \ system can fail in minor or major ways. For instance, you or a user can accidentally\
    \ delete files, hard disks can fail, or your system can be compromised and damaged\
    \ by an intruder. To protect against such problems, you should regularly back\
    \ up your computer and be prepared to recover part or all of your system from\
    \ your backup when this becomes necessary. Note my use of the word when; Murphy’s\
    \ Law ensures that, sooner or later, you will encounter a situation that will\
    \ require a backup for proper recovery. Without that backup, you will lose data.\n\
    \n# Scenario\n\nYour company’s file server is a critical piece of infrastructure\
    \ that holds hundreds of hours of employees’ work. It therefore requires backup,\
    \ and you’ve been tasked with planning a backup strategy for that server. To do\
    \ so, you must select backup hardware, plan a backup schedule, decide what software\
    \ to use with that hardware, determine what Linux commands and utilities to use\
    \ to implement the backup plan, and plan how to restore data when it becomes necessary."
