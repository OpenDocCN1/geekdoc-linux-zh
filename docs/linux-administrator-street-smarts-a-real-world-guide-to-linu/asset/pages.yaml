- pgno: 76
  md: "To better understand the use of conditionals, consider the following code fragment:\n\
    \n```\nif [ -s /tmp/tmpstuff ]\nthen\n\techo \"/tmp/tmpstuff found; aborting!\"\
    \n\texit\nfi\n```\n\nThis fragment causes the script to exit if the file /tmp/tmpstuff\
    \ is present. The then keyword marks the beginning of a series of lines that execute\
    \ only if the conditional is true, and fi (if backwards) marks the end of the\
    \ if block. Such code might be useful if the script creates and then later deletes\
    \ this file, since its presence indicates that a previous run of the script didn't\
    \ succeed or is still working.\nAn alternative form for a conditional expression\
    \ uses the test keyword rather than square brackets around the conditional:\n\n\
    ```\nif test -s /tmp/tmpstuff\n```\n\nYou can also test a command's return value\
    \ by using the command as the condition:\n\n```\nif [ command ]\nthen\n\taddional-commands\n\
