- pgno: 148
  md: 'The `--install` (-i) action specifies an installation of a new package or an
    upgrade of an existing package. The output of the program summarizes its actions,
    as shown here. If you like, you can specify multiple package files on a single
    command line and `dpkg` installs or upgrades them all.


    No matter how you upgrade a package, `dpkg` performs dependency checks. If an
    upgraded package includes additional dependencies, or depends upon newer versions
    of packages than you''ve got installed, `dpkg` will complain and will refuse to
    proceed. Although you can overcome this problem with the `--force-depends` option,
    this is asking for trouble. Instead, you should cancel your upgrade plans or upgrade
    the dependencies first.


    # ### Installing a New Package


    With `dpkg`, package installs and upgrades are performed in precisely the same
    way, using the `--install` (-i) action. The output differs slightly when you install
    a fresh package:


    ```

    ```

    # dpkg -i zsh_4.3.2-13_powerpc.deb

    Selecting previously deselected package zsh.

    (Reading database ... 106653 files and directories currently installed.)

    Unpacking zsh (from zsh_4.3.2-13_powerpc.deb) ...

    Setting up zsh (4.3.2-13) ...

    ```

    ```


    Note that, compared to the upgrade output, the installation output omits the words
    `replace` and `replacing`. Other than this subtle difference, you''d be hard-pressed
    to tell the difference between an upgrade and a fresh installation based on the
    `dpkg` command or output.


    # ### Querying a Package


    If you don''t know what a package does, you can use the `--status` (-s) action,
    which takes a package name as an argument. This action displays general information
    on the package:


    ```

    ```

    # dpkg -s xpdf-reader

    Package: xpdf-reader

    Status: install ok installed

    Priority: optional

    Section: text

    Installed-Size: 1792

    Maintainer: Hamish Moffatt <hamish@debian.org>

    Source: xpdf

    Version: 3.00-12

    Provides: pdf-viewer, postscript-preview

    Depends: lesstif2, libc6 (>= 2.3.2.ds1-4), libfreetype6 (>= 2.1.5-1), libgcc1
