- pgno: 279
  md: 'you must configure the FTP server to run. The server you''ve chosen can be
    run from a super server, so you must reconfigure your super server to handle the
    FTP server.


    # ## Scope of Task


    This task requires modifying one or two super server configuration files. As such,
    the changes required are fairly minor; however, you should be aware of the potential
    pitfalls of running servers via a super server. Two super servers are common in
    Linux, and this task covers both of them, although you''re likely to be able to
    modify just one super server''s configuration.


    > > **NOTE**

    > > This task is focused on the super server side of the task. Configuring an
    FTP server, or any other server that''s launched from a super server, requires
    attention to server-specific configuration and security details that aren''t covered
    in this task.


    # ## Duration


    This task should take about half an hour to complete, although if you have access
    to computers running both `inetd` and `xinetd`, the total time could approach
    one hour. Once you''re familiar with the details of super server configuration,
    you should be able to add a new server in just a few minutes.


    # ## Setup


    You must have *root* access to a computer that''s already running a super server
    (`inetd` or `xinetd`). As described in the scenario, your FTP server package should
    already be installed. This task uses the Netkit FTP server (http://www.hcs.harvard.edu/~dholland/computers/netkit.html),
    which is usually called *ftpd* or in. *ftpd*, as an example. Many, but not all,
    other FTP servers can be used instead, or you can use an entirely different server,
    such as a Telnet server, if you prefer.


    # ## Caveats


    The usual *root*-access caveats apply to this task. In addition, adding servers
    that run via a super server—or by any other means—opens your computer to potential
    security problems. Buggy servers or poor server security options can make your
    system vulnerable to attack. For this reason, you should undo your configuration
    changes after you''re done with this task, unless you have a real need to run
    an FTP server. If so, you should carefully review the security and other configuration
    options for your server.


    # ## Procedure


    This task requires modifying your super server configuration; however, two super
    servers are common on Linux: `inetd` and `xinetd`. Thus, you must first determine
    which super server you have installed. After you''ve done so, you can modify the
    configuration for your particular'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'server. (If your system runs `inetd`, you may want to read both the `inetd`
    and `xinetd` sections, because `xinetd` configuration is rather like an expanded
    version of `inetd` configuration.) The final part of this task is to test your
    configuration to be sure it''s working correctly.


    # ## Identifying Your Super Server


    Linux distributions have traditionally used `inetd`, but they''ve been slowly
    shifting to `xinetd`. Both super servers offer similar basic features, but `xinetd`
    provides *more* features, particularly in the area of access control options.
    Using `xinetd`, you can restrict who may access a server based on IP address,
    network port, time of day, and more. You can use a package called TCP Wrappers
    in conjunction with `inetd` to provide similar access controls. An additional
    advantage of `xinetd` is that its configuration file can be split into parts.
    This enables distributions that use `xinetd` to provide `xinetd` configuration
    files with individual servers, simplifying configuration.


    Type `ps ax | grep inetd` to see which super server is running on your system—the
    output should include a line with either the `inetd` or the `xinetd` command.
    Some systems run neither super server, though. If you can''t find a trace of either
    server, use your package manager to search for the `inetd` and `xinetd` packages.
    If one is installed, you might need to modify your SysV configuration to launch
    the server in your runlevel, as described in Phase 3. If neither package is installed,
    install one (preferably `xinetd`) using your distribution''s package management
    tools, as described in Phase 3.


    # ## Configuring `inetd`


    You control servers that launch via `inetd` through the `/etc/inetd.conf` file.
    This file consists of a series of lines, one for each server. A typical line resembles
    the following:


    ```

    ```text

    ftp stream tcp nowait root /usr/sbin/tcpd /usr/sbin/ftpd -l

    ```

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_280_0.png)


    If your system doesn''t use `ftpd`, or if it''s called `in.ftpd` or is located
    in a directory other than `/usr/sbin`, adjust the command appropriately. The `-l`
    option is specific to `ftpd` and so may also need to be changed for your FTP server.


    Each line consists of several fields separated by one or more spaces. The meanings
    of these fields are as follows:


    **Service name** The first field (`ftp` in the preceding example) is the name
    of the service as it appears in the `/etc/services` file.


    **Socket type** The socket type entry tells the system what type of connection
    to expect—a reliable two-way connection (`stream`), a less-reliable connection
    with less overhead (`dgram`), a low-level connection to the network (`raw`), or
    various others. The differences between these types are highly technical; your
    main concern in editing this entry should be to correctly type the value specified
    by the server''s documentation.


    **Protocol** This is the TCP/IP Transport-layer protocol used, usually `tcp` or
    `udp`.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '**Wait/no wait** For `dgram` socket types, this entry specifies whether the
    server connects to its client and frees the socket (`nowait`) or processes all
    its packets and then times out (`wait`). Servers that use other socket types should
    specify `nowait` in this field.


    **User** This is the username used to run the server. The `root` and `nobody`
    users are common choices, but others are possible as well. As a general rule,
    you should run servers as a low-privilege user whenever possible as a security
    precaution. Some servers require `root` access, though. Consult the server’s documentation
    for details.


    **Server name** This is the filename of the server. In the preceding example,
    the server is specified as `/usr/sbin/ctcpd`, which is the TCP Wrappers binary.
    This program provides some security checks, enabling you to restrict access to
    a server based on the origin and other factors.


    **Parameters** Everything after the server name consists of parameters that are
    passed to the server. If you use TCP Wrappers, you pass the name of the true target
    server (such as `/usr/sbin/ftpd`) in this field, along with its parameters.


    The hash mark (`#`) is a comment symbol for `/etc/inetd.conf`. Therefore, if a
    server is running via `inetd` and you want to disable it, you can place a hash
    mark at the start of the line. If you want to add a server to `inetd.conf`, you’ll
    need to create an entry for it. Most servers that can be run from `inetd` include
    sample entries in their documentation. Many distributions ship with `inetd.conf`
    files that include entries for common servers as well, although many of them are
    commented out; remove the hash mark at the start of the line to activate the server.


    After modifying `inetd.conf`, you must restart the `inetd` super server itself.
    This super server normally runs as a standard SysV server, so you can restart
    it by typing something similar to the following:


    ```

    # /etc/rc.d/init.d/inetd restart

    ```


    Alternatively, you can tell `inetd` to reload its configuration by passing the
    SysV startup script the `reload` parameter rather than `restart`. The `restart`
    option shuts down the server and then starts it again. When you use `reload`,
    the server never stops running; it just rereads the configuration file and implements
    any changes. As a practical matter, the two are quite similar. Using `restart`
    is more likely to correctly implement changes, but it’s also more likely to disrupt
    existing connections.


    Instead of using the SysV startup scripts, you can use `kill` or `killall` (described
    in Phase 3) to pass the `SIGHUP` signal to `inetd`. This signal causes many servers,
    including `inetd`, to reread their configuration files. For instance, you might
    type `kill -HUP pid` if you know the process ID (PID) of `inetd` or `killall -HUP
    inetd` to have all instances of `inetd` reread their configuration files. (Ordinarily,
    only one instance of `inetd` runs on a system.) In practice, this should work
    very much like the `reload` option to the SysV startup script—in fact, such scripts
    often use this technique to implement this option.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_281_0.png)


    > It’s generally wise to disable as many servers as possible in `inetd.conf` (or
    the `xinetd` configuration files, if you use `xinetd`). As a general rule, if
    you don’t understand what a server does, disable it. This will improve the security
    of your system by eliminating potentially buggy or misconfigured servers from
    the equation.'
  merge: -1
  img_proc: true
- pgno: 282
  md: "# Configuring xinetd\n\nThe **xinetd** program is an extended super server.\
    \ It provides the functionality of **inetd** plus security options that are similar\
    \ to those of TCP Wrappers. Modern versions of Fedora, Mandriva, Red Hat, openSUSE,\
    \ and a few other distributions use **xinetd** by default. Other distributions\
    \ may use it in the future. If you like, you can replace **inetd** with **xinetd**\
    \ on any distribution.\n\nThe `/etc/xinetd.conf` file controls **xinetd**. On\
    \ distributions that use **xinetd** by default, though, this file contains only\
    \ global default options and a directive to include files stored in `/etc/xinetd.d`.\
    \ Each server that should run via **xinetd** then installs a file in `/etc/xinetd.d`\
    \ with its own configuration options. Look for a file called `ftp`, `ftpd`, `in.ftpd`,\
    \ or something similar in the `/etc/xinetd.d` directory. If it's present, you\
    \ can edit this file to activate your FTP server. If not, you can either create\
    \ this file and add an FTP entry as described shortly or add such an entry to\
    \ your `/etc/xinetd.conf` file.\n\nWhether the entry for a service goes in `/etc/xinetd.conf`\
    \ or a file in `/etc/xinetd.d`, it contains information similar to that in the\
    \ `inetd.conf` file. The **xinetd** configuration file, though, spreads the information\
    \ across multiple lines and labels it more explicitly. Listing 6.2 shows an example\
    \ that's equivalent to the earlier `inetd.conf` entry. This entry provides precisely\
    \ the same information as the `inetd.conf` entry except that it doesn't include\
    \ a reference to `/usr/sbin/tcpd`, the TCP Wrappers binary. Because **xinetd**\
    \ includes similar functionality, it's generally not used with TCP Wrappers.\n\
    \n# Listing 6.2: Sample xinetd Configuration Entry\n\n```\nservice ftp\n{\n  \
    \  socket_type     = stream\n    protocol        = tcp\n    wait            =\
    \ no\n    user            = root\n    server          = /usr/sbin/in.ftpd\n  \
    \  server_args     = -l\n}\n```\n\n![](img/f430a19bdf014c43ad7c2d594afd5b21_282_0.png)\n\
    \nYour existing **xinetd** configuration file for your FTP server may not be identical\
    \ to Listing 6.2. If it's not, it's probably best to leave the configuration as\
    \ you found it, with the exception of the `disable` option (described next) and\
    \ any other options you research and that you know you want to modify.\n\nOne\
    \ additional **xinetd** parameter is important: `disable`. If you include the\
    \ line `disable = yes` in a service definition, **xinetd** ignores the entry.\
    \ Some servers install startup files in `/etc/xinetd.d` that have this option\
    \ set by default; you must edit the file and change the entry to read `disable\
    \ = no` to enable the server. You can also disable a set of servers by listing\
    \ their names in the `default` section of the main `xinetd.conf` file on a line\
    \ called `disabled`, as in `disabled = ftp shell`."
  merge: -1
  img_proc: true
- pgno: 283
  md: 'As with inetd, after you make changes to *xinetd*''s configuration, you must
    restart the super server. You do this by typing a command similar to the one used
    to restart *inetd*. As with that command, you can use either *reload* or *restart*,
    with similar effects:


    ```

    # /etc/rc.d/init.d/xinetd restart

    ```


    Also as with *inetd*, you may pass the *SIGHUP* signal to *xinetd* via the *kill*
    or *killall* command to have it reload its configuration file. This approach may
    be preferable if you’re using a distribution, such as Slackware, that doesn’t
    use a conventional *SysV* startup script to launch *xinetd*.


    # ## Testing Your Configuration


    After making the changes described in the last two sections, your FTP server should
    now be accessible. You can test it by using the text-mode *ftp* program or a GUI
    FTP program such as *gftp*:


    ```

    ```

    $ ftp localhost

    Connected to localhost (127.0.0.1),

    220 www.example.com FTP server (Version 6.4/OpenBSD/Linux-ftpd-0.17) ready.

    Name (localhost:rodsmith): rodsmith

    334 AUTH SSL OK.

    [S5L Cipher AES256-SHA]

    331 Password required for rodsmith.

    Password:

    230-

    230 User rodsmith logged in.

    Remote system type is UNIX.

    Using binary mode to transfer files.

    ftp>

    ```

    ```


    You can then type FTP commands, such as *ls*, *cd*, *get*, *put*, and *exit*.
    (If you test using a GUI client, you’d use appropriate point-and-click operations
    instead.) This example shows connecting to the computer using the *localhost*
    interface. If successful, it proves that the server is running and accessible
    to the local computer; however, super server, TCP Wrappers, or FTP server configuration
    options could limit accesses from other computers. Thus, you should test in the
    same way using a remote computer as well. If you have problems with remote access,
    examine your configuration files for options that restrict access, such as the
    *only_from* option in *xinetd* or any FTP options in */etc/hosts.allow* or */etc/hosts.deny*
    if you use TCP Wrappers.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_283_0.png)


    Unless you really want to run an FTP server, remember to disable it by removing
    its super server configuration and reloading or restarting your super server when
    you’re done. Better yet, remove the FTP server package from your computer; a server
    that’s not installed can’t be run!'
