    from a onward. SCSI drives have identifiers of the form `/dev/sdx`, where *x*
    is a letter from a onward. SATA drive identifiers can take either form, depending
    on the driver that handles the SATA controller.


    The partition information can be useful in certain disaster recovery situations.
    It can also be helpful if you need to add, remove, or otherwise modify your partitions.
    For these reasons, you should archive this information to a file or print it.
    Phase 5 describes Linux partition management in greater detail.


    # ## Checking PCI and USB Data


    Modern computers use the PCI bus to connect most devices. Even devices that are
    built into the motherboard, such as USB controllers, are likely to use the PCI
    bus internally. You can learn about PCI devices from the `/proc/pci` pseudo-file.
    Much of the information retrieved from this pseudo-file will seem meaningless
    to you unless you’re a hardware expert; nonetheless, it can prove useful in debugging
    problems, once you learn what certain key things mean. Thus, you should copy this
    pseudo-file or print it out for future reference.


    The `/proc/bus/usb/devices` pseudo-file holds information on USB devices. As with
    the `/proc/pci` pseudo-file, much of the information will seem like gibberish,
    but it’s worth saving. With the USB information, though, you may at least be able
    to spot manufacturer names or device model numbers.'
