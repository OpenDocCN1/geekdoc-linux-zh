- pgno: 195
  md: 'should review Phase 1''s coverage of scripting and read the **man** pages for
    `grep` and `cut`. These two commands will enable you to extract any data you like
    from the system summary commands; you can then recombine your extracted data into
    convenient columns.


    # Criteria for Completion


    To complete this task, you should have obtained baseline performance data on your
    CPU load average, free memory, disk speed, and disk free space. With this information
    recorded in your system log book, you can begin planning how to monitor such data
    over the long term. Such monitoring will enable you to spot trouble before it
    occurs.


    # Task 4.3: Use System Log Files


    You''re not the only one who should be creating logs concerning system activities:
    Your computer should, too. Linux systems run a *log daemon* or *system logger*,
    which is a tool that copies messages from other processes (mostly servers, but
    also the kernel and occasionally non-server processes) to log files. These log
    files typically reside in the `/var/log` directory. Log file street smarts entails
    the ability to do three things with log files: configure the log daemon to log
    data in appropriate files, rotate the log files so they don''t fill your hard
    disk, and interpret the data found in your log files.


    # Scenario


    You need to make several changes to your system''s logging facility. Specifically,
    you want to display emergency log entries on the consoles of logged-in users,
    log all kernel activities to the `/var/log/kernel` file, and send non-trivial
    kernel events to a second system (`logger.pangaea.edu`). You also want to modify
    your system''s log rotation schedule to keep old compressed log files for longer
    than it currently does and to rotate the `/var/log/kernel` file. Once these tasks
    are completed, you need to examine current log files to check on your mail server''s
    activities over the past day or so because several messages that should have arrived
    on the system have not appeared in users'' inboxes.


    # Scope of Task


    This task involves three distinct subtasks, each of which is fairly complex in
    and of itself: modifying system logging, modifying log file rotation, and examining
    current log files.


    # Duration


    This task should take about an hour to complete. Once you''re familiar with the
    procedures involved, you can perform individual log file tasks in considerably
    less time. Examining log files is particularly speedy, although if you need to
    trace activity over time, you can spend hours porusing log files.'
  merge: -1
  img_proc: true
- pgno: 196
  md: "# Setup\n\nThis task requires no special setup. You need `root` access to your\
    \ computer, though. To redirect logging to another system, you need working network\
    \ access and the other computer must be configured to accept system logs from\
    \ remote computers.\n\n# Caveats\n\nAs usual, *working as `root`* is potentially\
    \ risky. For security reasons, most log files can only be read by `root`, so you\
    \ need `root` access even if you don’t intend to change your configuration. Misconfiguring\
    \ your log files can result in system logs disappearing or being sent to inappropriate\
    \ files or remote systems.\n\n# Procedure\n\nBefore actually configuring your\
    \ system logging options, you should know a bit about the programs that manage\
    \ it—particularly `syslogd` and related tools. With the basics under your belt,\
    \ you can adjust the syslog configuration files as well as the files that manage\
    \ log file rotation. You can examine log files using tools with which you’re already\
    \ familiar, such as `grep` and `less`, although a few twists are particularly\
    \ handy when studying log files.\n\n# Understanding `syslogd`\n\nThe traditional\
    \ Linux system logger is `syslogd`, which is often installed from a package called\
    \ `sysklogd`. The `syslogd` daemon handles messages from servers and other user-mode\
    \ programs. It’s usually paired with a daemon called `klogd`, which is usually\
    \ installed from the same `sysklogd` package as `syslogd`. The `klogd` daemon\
    \ manages logging of kernel messages.\n\n> NOTE\n> Other choices for system loggers\
    \ exist. For instance, syslog-ng is a replacement that supports advanced filtering\
    \ options, and meta1og is another option.\n> \n> This chapter describes the traditional\
    \ `syslogd` logger. Others are similar in principle, and even in some specific\
    \ features, but differ in many details.\n\nThe basic idea behind a system logger\
    \ is to provide a unified means of handling log files. The daemon runs in the\
    \ background and accepts data delivered from servers and other programs that are\
    \ configured to use it. The daemon can then use information provided by the server\
    \ to classify the message and direct it to an appropriate log file. This configuration\
    \ enables you to consolidate messages from various servers in a handful of standard\
    \ log files, which can be much easier to use and manage than potentially dozens\
    \ of log files from the various servers running on the system.\n\nIn order to\
    \ work, of course, the log daemon must be configured. In the case of `syslogd`,\
    \ this is done through the `/etc/syslog.conf` file. The next section describes\
    \ this file’s format in more detail."
  merge: -1
  img_proc: true
- pgno: 197
  md: "# ## Setting Logging Options\n\nThe format of the /etc/syslog.conf file is\
    \ conceptually simple but provides a great deal of power. Comment lines, as in\
    \ many Linux configuration files, are denoted by hash marks (#). Noncomment lines\
    \ take the following form:\n\n```\nfacility.priority\taction\n```\n\nIn this line,\
    \ the *facility* is a code word for the type of program or tool that has generated\
    \ the message to be logged; the *priority* is a code word for the importance of\
    \ this message; and the *action* is a file, remote computer, or other location\
    \ that’s to accept the message. The *facility* and *priority* are often referred\
    \ to collectively as the *selector*.\n\nValid codes for the *facility* are auth,\
    \ authpriv, cron, daemon, kern, lpr, mail, mark, news, security, syslog, user,\
    \ uucp, and local0 through local7. Many of these names refer to specific servers\
    \ or program classes. For instance, mail servers and other mail-processing tools\
    \ typically log using the *mail* facility. Most servers that aren’t covered by\
    \ more specific codes use the *daemon* facility. The *security* facility is identical\
    \ to *auth*, but *auth* is the preferred name. The *mark* facility is reserved\
    \ for internal use. An asterisk (*) refers to all facilities. You can specify\
    \ multiple facilities in one selector by separating the facilities with commas\
    \ (,).\n\nValid codes for the *priority* are debug, info, notice, warning, warn,\
    \ error, err, crit, alert, emerg, and panic. The *warning* priority is identical\
    \ to *warn*, *error* is identical to *err*, and *emerg* is identical to *panic*.\
    \ The *error*, *warn*, and *panic* priority names are deprecated; you should use\
    \ their equivalents instead. Other than these identification pairs, these priorities\
    \ represent ascending levels of importance. The *debug* level logs the most information;\
    \ it’s intended, as the name implies, for debugging programs that are misbehaving.\
    \ The *emerg* priority logs the most important messages, which indicate very serious\
    \ problems.\n\nWhen a program sends a message to the system logger, it includes\
    \ a facility code and a priority code; the logger logs the message to a file if\
    \ you’ve configured it to log messages with the specified combination. Ordinarily,\
    \ the system logs messages that arrive with the specified *priority* or higher.\
    \ Thus, if you specify a *priority* code of *alert*, the system will log messages\
    \ that are classified as *alert* or *emerg* but not messages of *crit* or below.\
    \ An exception to this rule is if you precede the priority code by an equal sign\
    \ (=), as in =*crit*, which describes what to do with messages of *crit* priority\
    \ *only*. An exclamation mark (!) reverses the meaning of a match. For instance,\
    \ !*crit* causes messages *below* crit priority to be logged. A priority of *\
    \ refers to all priorities.\n\nYou can specify multiple selectors for a single\
    \ action by separating the selectors by a semicolon (;). Note that commas are\
    \ used to separate multiple facilities within a single selector, whereas semicolons\
    \ are used to separate multiple selectors as a whole. Examples of complete selectors\
    \ appear shortly.\n\nMost commonly, the *action* is a filename, typically of a\
    \ file in the /var/log directory tree. Other possibilities include a device filename\
    \ for a console (such as /dev/console) to display data on the screen, a remote\
    \ machine name preceded by an @ sign (@), and a list of usernames of individuals\
    \ who should see the message if they’re logged in. For the last of these options,\
    \ an asterisk (*) means all logged-in users."
  merge: -1
  img_proc: true
- pgno: 198
  md: 'The Scenario, presented earlier, specifies that emergency log events should
    be displayed to all currently logged-in users and that kernel messages should
    be logged in `/var/log/kernel` and non-trivial kernel events should be sent to
    a second system (`logger.pangaea.edu`). To begin with the first requirement, you
    should create this entry in `/etc/syslog.conf`:


    ```

    * .emerg *

    ```


    This line sends all **emerg-level** messages to the consoles of all users who
    are logged into the computer using text-mode tools. If a message matches both
    this specification and another one (probably an existing rule), such events will
    be logged in the way specified by the existing rule *and* displayed on users’
    consoles.


    The second Scenario requirement is to log kernel messages to `/var/log/kernel`
    and non-trivial kernel events to a second system, `logger.pangaea.edu`. To do
    so, you’d create entries like this:


    ```

    kern.* /var/log/kernel

    kern.err @logger.pangaea.edu

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_198_0.png)


    > The specification in the Scenario was a bit vague: What constitutes a “non-trivial”
    kernel message? For purposes of this task, I’ve used *err* as the cutoff point,
    but you could legitimately use just about any other priority code.


    The first of these rules logs all kernel messages to `/var/log/kernel`. (It’s
    possible that your configuration already sends kernel messages to this or some
    other file, so check to see if you’re duplicating functionality before making
    changes.) The next line sends *err*-level messages to `logger.pangaea.edu`. (This
    system must be configured to accept remote logs, which is a topic not covered
    in this book.)


    Most distributions ship with reasonable system logger settings, but you may want
    to examine these settings and perhaps adjust them. If you change them, though,
    be aware that you may need to change some other tools. For instance, all major
    distributions ship with tools that help rotate log files. If you change the files
    to which *syslog* logs messages, you may need to change your log file rotation
    scripts as well. This topic is covered in the next section.


    In addition to the system logger’s options, you may be able to set logging options
    in individual programs. For instance, you might tell programs to record more or
    less information or to log routine information at varying priorities. Some programs
    also provide the means to log via the system log daemon or via their own mechanisms.
    Details vary greatly from one program to another, so you should consult the program’s
    documentation for details.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_198_1.png)


    > Most programs that use the system log daemons are servers and other system tools.
    Programs that individuals run locally seldom log data via the system log daemon,
    although there are some exceptions to this rule, such as the Fetchmail program
    for retrieving email from remote servers.'
  merge: -1
  img_proc: true
- pgno: 199
  md: "# Rotating Log Files\n\nLog files are intended to retain information on system\
    \ activities for a reasonable period of time; however, system logging daemons\
    \ provide no means to control the size of log files. Left unchecked, log files\
    \ can therefore grow to consume all the available space on the partition on which\
    \ they reside. To avoid this problem, Linux systems employ log file rotation tools.\
    \ These tools rename and optionally compress the current log files, delete old\
    \ log files, and force the logging system to begin using new log files.\n\nThe\
    \ most common log rotation tool is a package called logrotate. This program is\
    \ typically called on a regular basis via a cron job. (This tool is described\
    \ in Phase 3.) The logrotate program consults a configuration file called /etc/logrotate.conf,\
    \ which includes several default settings and typically refers to files in /etc/logrotate.d\
    \ to handle specific log files. A typical /etc/logrotate.conf file includes several\
    \ comment lines, denoted by hash marks (#), as well as lines to set various options,\
    \ as illustrated by Listing 4.3.\n\n# Listing 4.3: Sample /etc/logrotate.conf\
    \ File\n\n```\n# Rotate logs weekly\nweekly\n\n# Keep 4 weeks of old logs\nrotate\
    \ 4\n\n# Create new log files after rotation\ncreate\n\n# Compress old log files\n\
    compress\n\n# Refer to files for individual packages\ninclude /etc/logrotate.d\n\
    \n# Set miscellaneous options\nnotifempty\nnomail\nnoolddir\n\n# Rotate wtmp,\
    \ which isn't handled by a specific program\n/var/log/wtmp {\n    monthly\n  \
    \  create 0664 root utmp\n    rotate 1\n}\n```"
  merge: -1
  img_proc: true
- pgno: 200
  md: "![](img/f430a19bdf014c43ad7c2d594afd5b21_200_0.png)\n\nBecause log file rotation\
    \ is handled by cron jobs that typically run late at night, it won't happen if\
    \ a computer is routinely turned off at the end of the day. This practice is common\
    \ with Windows workstations but is uncommon with servers. Either Linux workstations\
    \ should be left running overnight as a general practice or some explicit steps\
    \ should be taken to ensure that log rotation occurs despite routine shutdowns.\n\
    \nMost of the lines in Listing 4.3 set options that are fairly self-explanatory\
    \ or that are well explained by the comments that immediately precede them—for\
    \ instance, the weekly line sets the default log rotation interval to once a week.\
    \ If you see an option in your file that you don't understand, consult the man\
    \ page for logrotate.\n\nThe Scenario for this task specifies that you want to\
    \ keep log files for longer than is the current setting. As just noted, Listing\
    \ 4.3 specifies a four-week log file rotation, so log files are deleted after\
    \ this period. To keep log files longer, change the rotate option from 4 to a\
    \ higher value—6, 8, 10, or whatever you deem appropriate.\n\nThe last few lines\
    \ of Listing 4.3 demonstrate the format for the definition for a specific log\
    \ file. These definitions begin with the filename for the file (multiple filenames\
    \ may be listed, separated by spaces) followed by an open curly brace ({). They\
    \ end in a close curly brace (}). Intervening lines set options that may override\
    \ the defaults. For instance, the /var/log/wtmp definition in Listing 4.3 sets\
    \ the monthly option, which tells the system to rotate this log file once a month,\
    \ overriding the default weekly option. Such definitions are common in the individual\
    \ files in /etc/logrotate.d, which are typically owned by the packages whose log\
    \ files they rotate.\n\nTo rotate the /var/log/kernel file, you can either add\
    \ a definition such as the one for wtmp directly to /etc/logrotate.d or create\
    \ a new file in /etc/logrotate.d for your new log file. Listing 4.4 shows a file\
    \ that will do the trick for /var/log/kernel.\n\n# Listing 4.4: A Sample File\
    \ for /etc/logrotate.d\n\n```\n/var/log/kernel {\n    rotate 6\n    size=100k\n\
    }\n```\n\nThis file tells logrotate that it must handle the /var/log/kernel file.\
    \ It also includes the size option, which tells logrotate to rotate the log file\
    \ if it exceeds the specified size. This is a very useful option to keep your\
    \ log files from growing out of control.\n\nIn most cases, servers and other programs\
    \ that log data either do so via the system logging daemon or ship with a configuration\
    \ file that goes in /etc/logrotate.d to handle the server's log files. These files\
    \ usually do a reasonable job; however, you might want to double-check them. You\
    \ should also check the /var/log directory and its subdirectories every now and\
    \ then. If you see huge numbers of files accumulating, or if files are growing\
    \ to unacceptable size, you may want to check the corresponding logrotate configuration\
    \ files. If an appropriate file doesn't"
