- pgno: 111
  md: '# Task 2.6: Configure and Compile a Kernel


    85


    # Caveats


    Kernel configuration can seem quite intimidating to the uninitiated, and making
    mistakes can result in an unbootable kernel. If you''re careful not to overwrite
    your old kernel, though, and to keep its entry active in your boot loader, compiling
    a new kernel need not be particularly dangerous, aside from the usual cautions
    whenever you use *root* privileges.


    # Procedure


    Creating a custom kernel involves five steps: configuring the kernel, compiling
    the kernel, installing kernel modules, installing the kernel, and configuring
    your boot loader. The procedure described here covers the first four of these
    steps. Boot loader configuration is covered in Phase 5


    # Configuring the Kernel


    The most tedious part of kernel preparation, and the part that''s most likely
    to lead to confusion and head-scratching, is that of configuring the kernel. In
    this process, you''ll select the drivers, features, and other kernel options that
    you want to use. To begin the process, type the following commands in an *xterm*
    window:


    ```

    $ cd /usr/src/linux

    $ make xconfig

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_111_0.png)


    > Typing *make xconfig* produces a GUI configuration tool. If you prefer, you
    can use a text-based configuration tool by typing *make menuconfig*. You''ll be
    able to set the same options, but the user interface isn''t as pretty. Typing
    *make config* produces an even cruder text-based configuration tool. Typing *make
    oldconfig* to update an old configuration for a new kernel uses this simplest
    form of configuration prompting.


    The result, after a delay of several seconds to a minute or two, is a window similar
    to the one shown in Figure 2.5. This is the main kernel configuration window,
    and it''s broken into three sections: a set of kernel configuration areas on the
    left; a set of specific configuration options, and sometimes sub-areas, on the
    top right; and a pane that holds explanations of specific options on the bottom
    right.


    In the GUI configuration tool, you can add or remove support for an option by
    clicking the box to its left. Some options have arrows to the left, indicating
    sub-options, which may be hidden or expanded. Sometimes clicking the sub-option
    arrow produces an entry menu of new options.


    Many kernel features can be compiled directly into the main kernel file, denoted
    by a check mark (as in the *IEEE1284 Transfer Modes* option in Figure 2.5), or
    as a kernel module, denoted by a dot (as in the *PC-Style Hardware* option in
    Figure 2.5). Compiling a feature directly into the main kernel file increases
    the size of this file and means that the option will'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'always be available, including when the system first boots. This may be desirable
    if you''re customizing a kernel for a single system, and it''s recommended for
    boot hardware such as hard disk controllers. Compiling a feature as a module means
    that it need not be loaded if the hardware isn''t present on the computer or at
    a particular time. This is handy if you''re compiling a kernel that will be used
    for multiple computers or if you just want to keep the size of the kernel to a
    minimum. Some features can only be compiled directly into the kernel, or they
    only affect other options and so appear as check-mark options. A few features
    enable you to select from one of a set of options, such as CPU types.


    # **FIGURE 2.5**  The Linux kernel provides many configuration options to optimize
    performance.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_112_0.png)


    Unfortunately, a complete description of all the kernel options would go more
    than fill this entire book. I recommend you do a quick pass through the kernel
    to get a feel for the options you''re given. If you''ve copied a working .config
    file for your computer or from your distribution and then typed make xconfig,
    that configuration should make a good starting point for further tweaks via make
    config or make menuconfig. Pay particular attention, though, to options relating
    to boot devices. In particular, you should compile in support for your ATA disk
    controller or SCSI host adapter, as well as for whatever filesystems you use on
    your hard disk. If you compile these options as modules, the kernel won''t have
    them for accessing the disk, which will bring the boot process to a grinding halt.
    (Distributions use boot RAM disks to get around this problem, but for a custom
    kernel, it''s easier to compile the drivers directly into the main kernel file.)'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'As a general rule, you can compile support for hardware that you don’t use
    to boot the kernel and read the initial configuration files—such as Ethernet cards,
    parallel ports, and sound cards—as kernel modules. Doing so will help keep the
    kernel file small, which is generally desirable. It also means that you need to
    be less certain of the hardware you’ve got installed—if you’re not sure what Ethernet
    card you’re using, you can compile support for anything that sounds promising
    without worrying about bloating your kernel.


    Look for options you can safely omit. For instance, if you know you don’t have
    any video capture cards, you can omit those drivers, saving compile time and reducing
    kernel size. If in doubt, read the description for an option and follow its advice.


    Going through all the options is likely to take at least half an hour, and probably
    an hour or two if you’re not already familiar with kernel configuration. When
    you’re done, exit from the kernel configuration tool. You’ll be asked if you want
    to save the configuration; respond Save Changes.


    # ## Compiling the Kernel


    Compiling the kernel is remarkably simple; it can be done with one command:


    ```

    $ make

    ```


    Although this command looks simple, it starts a process that can be quite time-consuming.
    Depending on the speed of your CPU and the number of kernel options you’ve chosen
    to compile, this process can take anywhere from a few minutes to over an hour.
    During this time, you’ll see a series of messages appear summarizing the kernel
    files that are being compiled. You may also see occasional warnings; don’t worry
    about those. If you see an error message and compilation stops, though, it could
    be you’ve selected incompatible options or run into a bug. Unfortunately, such
    problems are tricky to resolve without extensive knowledge of the relevant subsystems.
    If the message seems to relate to a feature you don’t need, though, you could
    try disabling it. Sometimes compiling an option into the main kernel file rather
    than as a module will work around a problem.


    # ## Installing Kernel Modules


    Once the kernel has finished compiling, you’ll see a message to that effect. You
    can then install kernel modules. This step requires *root* privileges:


    ```

    # make modules_install

    ```


    This command installs the kernel modules in the `/lib/modules/version` directory
    tree, where *version* is the kernel version number. This process shouldn’t take
    very long; no compilation is involved, just file copies. After you type this command,
    use `ls` to verify that an appropriate directory has appeared in `/lib/modules`.


    # ## Installing the Kernel


    The final step described in this task is kernel installation—copying the kernel
    file to the `/boot` directory. You can do this as *root* with a single `cp` command:


    ```

    # cp /usr/src/linux/arch/i386/boot/bzImage /boot/bzImage-2.6.17.7

    ```'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'This example command assumes you''re using a 32-bit x86 system and that you''re
    installing a 2.6.17.7 kernel. If you''re using a non-x86 platform, the source
    directory will be different. Specifically, `i386` will be something else, and
    `bzImage` may be another name. You can install the kernel under any name you like;
    `bzImage-2.6.17.7` is a convenient and descriptive name for a kernel of this version
    number.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_114_0.png)


    > Traditionally, Linux kernels are called `vmlinuz`, `vmlinux`, or `bzImage`,
    with the last of these being the most common for locally compiled kernels on x86
    and related platforms.


    In addition to the kernel file itself, you may want to copy the `System.map` file,
    which appears in the `/usr/src/linux` directory, to the `/boot` directory. As
    with the kernel file, you may want to rename it to include the kernel version
    number. Once this is done, you can replace the `/boot/System.map` symbolic link
    with one that points to the new file you''ve just copied. The `System.map` file
    is not strictly necessary for system operation. It holds the addresses within
    the kernel of `symbols`—variable names and so on. This information is necessary
    for some debugging operations, so some tools that report details of system crashes
    and other problems may not work correctly without this file.


    Incidentally, both of these files are copied to `/boot` simply because this is
    the most common location for compiled kernels and related files. Some distributions
    place their kernels in the root (/) directory, but even with these distributions,
    I recommend using `/boot` for your own kernels in order to keep the root directory
    uncluttered.


    # Criteria for Completion


    To complete this task, you should have successfully configured and compiled your
    kernel, installed the kernel modules, and copied the kernel file to the `/boot`
    directory. Unfortunately, actually testing your kernel''s viability will require
    you to learn how to manage a boot loader, which is a topic that''s covered in
    Phase 5.


    # Task 2.7: Use Power Management Features


    Computers run on electricity, but this power source isn''t infinite. This limitation
    is particularly relevant on laptop computers, which often run on batteries. Thus,
    hardware manufacturers provide options to help minimize a computer''s use of energy,
    and Linux provides software tools to help you manage power use. Most of these
    options enable you to automatically shut down power-hungry devices, such as hard
    disks and monitors, when they''re not in use.


    # Scenario


    You''ve installed Linux on a laptop computer, but now you need to check power
    management options to improve battery life when the computer is taken on the road.
    To do so, you''ll have'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'to determine whether your system is using Advanced Power Management (APM) or
    the newer Advanced Configuration and Power Interface (ACPI) subsystem.


    # Scope of Task


    This task requires investigating your system with a few commands. You may then
    want to edit some configuration files or startup scripts. You''ll need to use
    either APM or ACPI, and in either case you should also investigate options for
    managing your hard disk''s power consumption.


    # Duration


    This task should take half an hour to an hour to complete. If you need to configure
    power management on many systems, each one will take just a few minutes—more time
    if the systems are substantially different from each other, but very little time
    if they''re nearly identical to one another.


    # Setup


    Log into the computer and acquire `root` privileges. No special hardware or software
    configuration is required, although if you''re running a particularly old or bare-bones
    Linux distribution, you might need to install APM or ACPI software. Although the
    scenario describes a laptop computer, you can investigate power management features
    even on a desktop computer.


    # Caveats


    As always, working as `root` can be dangerous. Power management tools are unlikely
    to cause catastrophic problems, although you could accidentally set some inconvenient
    options, such as a too-short hard disk power-down time, which will cause sluggish
    and erratic performance.


    # Procedure


    To use power management features, you''ll need to activate kernel support and
    then investigate APM and ACPI options on your system. You''ll also want to modify
    your hard disk options for managing hard disk power consumption.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_115_0.png)


    > Distributions and GUI environments are increasingly providing point-and-click
    interfaces to power management tools. These interfaces can be convenient and useful,
    but they differ from one distribution or environment to another.


    # Activating Kernel Support


    Both APM and ACPI rely on kernel features to work. General kernel configuration
    procedures are described earlier, in Task 2.6, “Configure and Compile a Kernel.”
    The power management features can be compiled into the kernel by activating appropriate
    options under the Power Management Options menu—both APM and ACPI have their own
    submenus with options to enable assorted specific features, such as support for
    fan control, or to enable basic support at system boot time. Generally speaking,
    enabling an option will do no harm, even if it doesn''t'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'apply to your system. You should read the description to see if it applies,
    though. A few APM options in particular can cause problems. The RTC Stores Time
    In GMT option can cause your system time to be set strangely after a suspend operation
    if it’s set incorrectly, and a few other options can cause problems with some
    hardware, as detailed in their descriptions.


    When you configure your kernel, keep in mind that Linux will use APM or ACPI,
    but not both. In practice, whichever kernel system loads first will control the
    computer’s power management. The simplest way to deal with this situation is to
    compile support for one protocol or another, not both. Another approach is to
    compile both systems as modules and load only the desired modules at boot time.
    In practice, if you try to use APM or ACPI features, as described in the next
    couple of sections, and they don’t work, the cause could be the presence of support
    for the other system in the kernel.


    If you’re using your distribution’s stock configuration, chances are it includes
    a reasonable default APM/ACPI configuration. It may try loading ACPI and then
    use APM as a fallback, for instance. In any event, you can try using one set of
    tools and then the other if that doesn’t work. You may need to consult distribution-specific
    documentation to learn the details of how it’s configured on your system, though.


    # Using APM


    To use APM features effectively, you need some way to tell the computer when to
    enter power-conserving states. This task is accomplished with the apmd package,
    which ships with most Linux distributions and may be installed automatically.
    The main apmd program is a daemon, which means that it runs in the background
    waiting for some event to occur. Most daemons, including apmd, should be started
    when the computer boots. Once running, apmd monitors the system’s battery status,
    and if the battery’s charge gets too low, apmd kicks the system into a suspend
    mode in which most functions are shut down and only the system’s RAM is maintained.


    The apmd program will also suspend the hard disk if it’s gone unused for a long
    enough time. (You can also use the hdparm utility to control hard disk power management
    more directly.) If you want to manually control APM features, you can do so with
    the apm utility. Typing this command presents basic power management information,
    such as how much battery power is left. The -s and -S parameters cause the system
    to go into suspend and standby modes, respectively. Suspend mode shuts off power
    to most devices, leaving only the CPU and memory operating, and those at minimum
    power. Standby mode leaves more devices powered up, so the system can recover
    more quickly, but there’s less power savings in this mode. A fully charged laptop
    can usually last several hours in standby mode and a day or more in suspend mode.
    Many laptops include a key sequence that will force the system into suspend or
    standby mode. In most cases, apmd will detect such a keystroke and honor the request.
    Consult your laptop’s documentation for details.


    # Using ACPI


    Linux’s ACPI handling is similar to its APM handling in broad strokes, but of
    course the details differ. In particular, an ACPI daemon runs instead of an APM
    daemon. The acpid program is a common ACPI daemon. This daemon is controlled through
    files in /etc/acpi/events. All the files in this directory whose names do not
    begin with a dot ( . ) are parsed and interpreted as sets of events and actions
    to be taken in response to each event. Each event line begins with the string
    event=, and each action line begins with action=. The actions point to scripts
    or Linux commands.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'One simple ACPI configuration file contains nothing but comments and a very
    simple action/event pair, as seen here:


    ```

    event=.*

    action=/etc/acpi/default.sh %

    ```


    This configuration essentially passes all responsibility over to a shell script,
    `/etc/acpi/default.sh`. A shell script can be more complex than the simple default
    ACPI parser, but this approach may be overkill for you.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_117_0.png)


    **Event names are not fully standardized.** Thus, you may need to monitor your
    own system to identify important events'' names. Check the `/proc/acpi/event`
    file when you perform an ACPI-related event, such as closing the lid of a laptop
    computer. This file should change to display the event name, which you can then
    reference in your Linux ACPI configuration file.


    You can use files in the `/proc/acpi` directory to monitor your system and to
    change defaults. Try using `cat` to view the contents of some of these files,
    as in **`cat /proc/acpi/event`** to view recent ACPI events. Various tools can
    link into these files to provide you with useful information, such as your CPU''s
    temperature and battery status. The `acpi` program is one of these tools; type
    `acpi -V` to have the system display all the information it can.


    # ## Setting Hard Disk Options


    You can use the `hdparm` utility to tell hard disks to enter a low-power suspend
    mode after a specified period of inactivity. To do so, use the `-S` option to
    `hdparm`, which takes a value from Table 2.4 to specify the idle time before the
    drive enters suspend mode.


    **TABLE 2.4 hdparm -S Options**


    | Value | Meaning |

    | :--- | :--- |

    | 0 | Power-saving mode disabled; disk doesn''t power down. |

    | 1-240 | Suspend mode entered in multiples of 5 seconds; for instance, 12 means
    to enter suspend mode after 60 seconds of inactivity. |

    | 241-251 | Enter suspend mode after 1 to 11 units of 30 minutes of inactivity.
    |

    | 252 | Enter suspend mode after 21 minutes of inactivity. |

    | 253 | Enter suspend mode after a vendor-defined time. |

    | 255 | Enter suspend mode after 21 minutes and 15 seconds of inactivity. |'
  merge: -1
  img_proc: true
- pgno: 118
  md: "Suppose you want to configure the laptop to enter suspend mode after 5 minutes\
    \ (300 seconds) of disk inactivity. That’s 60 5-second units, so you’d pass a\
    \ value of 60 to hdparm:\n\n```\n```bash\n# hdparm -S 60 /dev/hda\n```\n```\n\n\
    /dev/hda: \nsetting standby to 60 (5 minutes)\n\nAs with tuning hard disk performance,\
    \ any change you enter at the command line will be lost once you reboot. To make\
    \ your change permanent, you should enter an appropriate hdparm command in a local\
    \ startup script, as described earlier, in “Tweaking Disk Performance” in Task\
    \ 2.5.\n\nOne important caveat regarding hard disk power management is that Linux\
    \ tends to generate a lot of disk activity on a regular basis. Certain Linux tools\
    \ check system files very frequently to be sure they’ve not changed, and other\
    \ tools generate log file entries on a regular basis—sometimes even when nothing’s\
    \ happened. Thus, it’s possible that you won’t see much benefit from using hard\
    \ disk power management features. If your hard disk doesn’t seem to be shutting\
    \ down, or if it comes back to life very frequently, you may want to try to track\
    \ down the source of the activity. You may be able to modify a program’s configuration\
    \ to keep it from generating so much disk activity.\n\n# **Criteria for Completion**\n\
    \nTo complete this task, you should have investigated your power management options.\
    \ Your system probably uses APM or ACPI, but not both. In either case, you can\
    \ also minimize power use by configuring your system’s hard disk to power down\
    \ after an appropriate period of inactivity.\n\n# **Task 2.8: Configure X Options**\n\
    \nSeveral implementations of the X Window System (X for short) are available,\
    \ but the most common ones today use identical configuration file formats. The\
    \ older XFree86 3.3.6 and earlier configuration file differs in some important\
    \ details, but such old versions of XFree86 are becoming quite rare. The rarer\
    \ commercial implementations of X use their own configuration file formats, which\
    \ I don’t describe.\n\n# **Scenario**\n\nAs part of ongoing system upgrades at\
    \ your site, you’ve replaced the video card, monitor, and mouse on one computer.\
    \ The new video card is a generic board that uses an nVidia GeForce video chipset;\
    \ the monitor is a 17-inch liquid crystal display (LCD) device capable of 1280×1024\
    \ resolution; and the mouse is a USB model with a scroll wheel. Changing this\
    \ hardware necessitates making several alterations to the X configuration file."
