- pgno: 318
  md: 'about them with the help of `lpr`, control them using `lpc` and related utilities,
    or delete them with `lprm`. GUI programs provide their own printing dialog boxes
    and options. These utilities are increasingly CUPS aware, which provides you with
    better control over your printing options than was possible in pre-CUPS times.


    # # Printing Files with lpr


    Linux uses the `lpr` program to submit print jobs. This program accepts many options
    that you can use to modify the program’s action:


    +   * **Specify a queue name** The `-P*queuename*` option enables you to specify
    a print queue. This is useful if you have several printers or if you’ve defined
    several queues for one printer. If you omit this option, the default printer is
    used.


    +   * **Delete original file** Normally, `lpr` sends a copy of the file you print
    into the queue, leaving the original unharmed. Specifying the `-r` option causes
    `lpr` to delete the original file after printing it.


    +   * **Job name specification** Print jobs have names to help identify them,
    both while they’re in the queue and once printed (if the queue is configured to
    print banner pages). The name is normally the name of the first file in the print
    job, but you can change it by including the `-J *jobname*` option. The `-C *jobname*`
    and `-T *jobname*` options have the same effect.


    +   * **Raw printing** If you know your print job can be handled by your printer
    without any filtering, you can use the `-1` or `-oraw` option to bypass the normal
    CUPS print filters. This is handy if you’ve got a PostScript printer and CUPS
    is misidentifying a PostScript file as plain text or if you’re printing a plain-text
    or printer-specific file on a non-PostScript printer.


    > **WARNING**

    > Raw printing of text files can result in the last page of the document not emerging
    from the printer. Most printers have a page eject button that you can use to force
    the printer to eject the page when the print job is complete.


    +   * **Number of copies** You can specify the number of copies of a print job
    by including the number after a dash, as in `-3` to print three copies of a job.


    Suppose you have a file called `report.txt` that you want to print to the printer
    attached to the `texmark` queue. The printer can handle plain text just fine,
    so you want to bypass Ghostscript, which consumes CPU time and can result in slower
    printing:


    ```

    $ lpr -Ptexmark -l report.txt

    ```


    You can print multiple files on one command line, but if they’re of different
    types, you shouldn’t ordinarily use `-1` to bypass Ghostscript:'
