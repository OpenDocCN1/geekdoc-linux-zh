    # Task 5.7: Configure a Boot Loader


    Most Linux software is stored in filesystems, which are normally held (on hard
    disks) in partitions. One critical piece of software, though, resides partly outside
    of filesystems and perhaps even outside of partitions. This software is the *boot
    loader*, which is the first program that a computer runs when it boots, outside
    of the BIOS. The boot loader is responsible for loading the Linux (or other OS’s)
    kernel into memory and running it. Most Linux systems use one of two boot loaders:
    the Linux Loader (LILO) or the Grand Unified Boot Loader (GRUB). Knowing how to
    configure these boot loaders will enable you to upgrade your kernel or pass new
    options to your kernel.'
