    Command (m for help): p


    # ## Deleting Existing Partitions


    To delete partitions, you use the d command within fdisk. If you’re still within
    the fdisk command you launched earlier, you could delete the logical, extended,
    and primary partitions as follows:


    +   Command (m for help): d

    +   Partition number (1-5): 5


    +   Command (m for help): d

    +   Partition number (1-5): 2


    +   Command (m for help): d

    +   Selected partition 1


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_224_0.png)


    Instead of deleting partitions one by one, you can use the o command, as just
    described. This command wipes out all the partitions, which is what’s needed for
    this task. If you only wanted to delete some of the partitions, o would be inappropriate.


    Note that fdisk didn’t prompt for a partition number for the final deletion; only
    one partition was left, so there was no need. You should delete logical partitions
    before you delete the extended partition that carries them. You can delete primary
    partitions before or after deleting extended and logical partitions, though.


    At this point, you should have no partitions on the disk. Verify this fact by
    using the p command:


    Command (m for help): p


    ```

    Disk /dev/sda: 100 MB, 100663296 bytes

    4 heads, 48 sectors/track, 1024 cylinders

    Units = cylinders of 192 * 512 = 98304 bytes

    ```


    | Device  | Boot | Start | End | Blocks | Id | System |

    |---|---|---|---|---|---|---|



    When no partitions are left, p displays the usual partition list header but no
    data after that point.'
