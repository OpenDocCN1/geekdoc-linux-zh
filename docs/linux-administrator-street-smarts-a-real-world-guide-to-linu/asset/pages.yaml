  md: 'these configurations. When this happens, knowing where to look and how to change
    the options is important.


    # ## Scenario


    Your workplace has purchased a powerful Linux computer (called **ganda1f**) and
    installed an expensive commercial software package on this computer. In order
    to enable users on other systems to use this software, you want to enable remote
    XDMCP logins; once the system is so configured, users will be able to log into
    **ganda1f** from their own workstations in order to run this software.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_126_0.png)


    *Methods of remote access other than XDMCP exist and are often preferable to XDMCP.*
    Remote XDMCP logins are particularly desirable when a network has X terminals
    — low-powered computers that consist of a keyboard, a mouse, a monitor, and enough
    hardware and software to run an X server but not much else. X terminals can provide
    multiple users with access to a computer running an XDMCP server at minimal cost.


    # ## Scope of Task


    This task involves adjusting your XDMCP configuration to permit remote X-based
    logins. Doing so can be tricky in some ways, so you must pay careful attention
    to the details of this task.


    # ### Duration


    This task should take about an hour to complete. If you were to reconfigure multiple
    computers along these lines, each one would take just a few minutes once you’re
    familiar with the procedure.


    # ### Setup


    Boot the Linux computer you’re configuring (and that I’ll refer to as **ganda1f**).
    Log in and acquire *root* privileges; like most system configuration tasks, this
    one requires superuser privileges.


    To fully test this configuration, you’ll need access to a second computer with
    an X server. This computer may be, but does not need to be, a Linux system. If
    you’re using a Linux computer for this task, the best approach is to shut down
    its own XDMCP server; you can then launch X with appropriate options to connect
    to **ganda1f**’s XDMCP server.


    # ### Caveats


    As usual, working as *root* poses certain risks. You should back up configuration
    files before making changes to them so that you can recover from typos or other
    errors.


    Configuring an XDMCP server as described in this task poses security risks because
    it provides a server through which outsiders might be able to access your computer.
    This risk is worth taking if you need the functionality and if your network is
    properly protected by firewalls that'
