- pgno: 225
  md: "# ## Creating New Partitions\n\nNow that the disk is cleared of its existing\
    \ partitions, you can create new ones and save your changes. You can begin by\
    \ creating a new Linux data partition. Make it somewhat smaller than the available\
    \ disk space—say, 80MB on the 100MB Zip disk:\n\n```\n```\nCommand (m for help):\
    \ n\nCommand action\n  e   extended\n  p   primary partition (1-4)\np\nPartition\
    \ number (1-4): 1\nFirst cylinder (1-1024, default 1): 1\nLast cylinder or +size\
    \ or +sizeM or +sizeK (1-1024, default 1024): +80M\n```\n```\n\nWith the first\
    \ partition created, it’s time to create the second one, for swap space. You could\
    \ do this by creating a second primary partition; however, so you can see how\
    \ it’s done, try first creating an extended partition and then creating a logical\
    \ partition within it:\n\n```\n```\nCommand (m for help): n\nCommand action\n\
    \  e   extended\n  p   primary partition (1-4)\ne\nPartition number (1-4): 2\n\
    First cylinder (816-1024, default 816):\nUsing default value 816\nLast cylinder\
    \ or +size or +sizeM or +sizeK (816-1024, default 1024):\nUsing default value\
    \ 1024\n```\n```\n\n```\n```\nCommand (m for help): n\nCommand action\n  l   logical\
    \ (5 or over)\n  p   primary partition (1-4)\nl\nFirst cylinder (816-1024, default\
    \ 816):\nUsing default value 816\nLast cylinder or +size or +sizeM or +sizeK (816-1024,\
    \ default 1024): 1024\n```\n```\n\nAt this point, your partitions exist but the\
    \ Linux swap partition has a type code of 0x83 (hexadecimal 83, or decimal 131),\
    \ which denotes a Linux filesystem partition. To avoid confusion, you should set\
    \ the partition type of 0x82, which denotes a Linux swap partition:\n\n```\n```\n\
    Command (m for help): t\n```\n```"
  merge: -1
