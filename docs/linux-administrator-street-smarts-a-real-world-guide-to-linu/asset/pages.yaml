- pgno: 306
  md: '# Task 6.9: Manage an SSH Server


    Unix-like systems have long supported remote access, and Linux is no exception
    to this rule. Although tools such as Telnet and rlogin are available for remote
    text-mode access, these protocols are insecure and limited. Today, the Secure
    Shell (SSH) is the preferred method of providing remote text-mode access to a
    Linux system. In fact, you can even tunnel an X session through SSH, meaning that
    an SSH connection will link your local X server to the remote system, enabling
    you to run X programs remotely. SSH''s greatest feature, though, is its built-in
    encryption. When you use SSH, the risk of your data being intercepted is slim—or
    more precisely, anybody snooping on your data will find it useless because of
    SSH''s encryption.


    # Scenario


    Your mail server, configured in Task 6.6, is located in a physically inconvenient
    site. To enable easier configuration of this system from your desk, you want to
    configure the SSH server to accept remote logins. To provide the best security,
    you want to disable direct SSH logins as root, requiring remote users to log in
    as ordinary users and then, if they require root access, to use su or some other
    means to acquire superuser privileges. You also want to use SSH''s key generation
    tools to create and use encryption keys as a substitute for ordinary SSH passwords,
    simplifying the login process.


    # Scope of Task


    This task requires configuring an SSH server and creating SSH keys for an ordinary
    user account. Fortunately, most Linux distributions provide reasonable default
    SSH server configurations, so the first part of this task is fairly simple. SSH
    key generation is a bit more obscure, but SSH keys are very powerful tools.


    # Duration


    This task should take half an hour to an hour to complete. Simple changes to SSH
    server configuration take very little time. You can generate SSH keys very quickly,
    too, once you know how.


    # Setup


    You must have both ordinary user and root access to the system you''ll be using
    as an SSH server (mail.panqaee.edu in this example). Presumably you''ll do this
    work at the console, although you could do it via another remote login protocol
    if one is enabled. If this is a text-mode protocol such as Telnet, disabling this
    protocol after you''ve got SSH working will greatly improve the computer''s security.
    You''ll also need access as an ordinary user to another system to test the configuration.


    If the SSH server package isn''t already installed on the computer, install it
    now. In most cases, it''s available in a package called openssh or openssh-server.
    Major modern Linux distributions invariably ship with SSH (the OpenSSH implementation,
    to be precise), but you can download it from its Web site, http://www.openssh.com,
    if necessary.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'This task assumes you’re using OpenSSH, which is the most common SSH implementation
    in Linux. SSH Tectia (http://www.ssh.com) was the original SSH implementation,
    but it’s uncommon in Linux because it’s a commerical package. Various less-common
    SSH implementations also exist, but most are configured differently from OpenSSH.


    # Caveats


    Because you must be **root** to configure OpenSSH, the usual **root** caveats
    apply. Because SSH is a server that grants users full shell access to the computer,
    a misconfiguration or bug in SSH can quickly lead to security problems. Thus,
    you should be careful not to make mistakes, and if a system doesn’t really need
    an SSH server, you should disable it or, better yet, uninstall the package when
    you’re done with this task.


    # Procedure


    This task requires completing two subtasks. First, you must configure the basic
    SSH server options. This task is fairly straightforward but requires **root**
    access. The second part of this task requires setting up SSH keys to enable quicker
    logins. This part of the task is somewhat more involved but you can do it as an
    ordinary user.


    # Configuring the SSH Server


    The SSH server is configured through the `/etc/ssh/sshd_config` file, and the
    SSH client is configured through the `/etc/ssh/ssh_config` file. These filenames
    are very similar, so be sure not to confuse them! Both files consist of comments
    (indicated by hash marks, #) and key-word/argument pairs, as in this example:


    ```

    PermitRootLogin no

    ```


    For the most part, both the client and server configurations are reasonable with
    most distributions. You might want to change a few options, though. Table 6.1
    summarizes some additional SSH server options (in `sshd_config`) that you might
    want to change. Pay particular attention to the `PermitRootLogin` server option
    (it should be set to no to conform with the requirements outlined in this task’s
    scenario) and to the X forwarding options. Using SSH to initiate a connection
    that supports X-based applications can be a convenient method of remote GUI access,
    but this configuration requires support in the client and server.


    In Linux, the primary SSH client is called, naturally enough, `ssh`. In its simplest
    form, you type the program name followed by the system to which you want to connect.
    Ordinarily, the remote server then prompts you for a password. The first time
    you connect, the system also informs you that it can’t verify the authenticity
    of the remote site. To test your configuration thus far, you’d do something like
    this from a second Linux system:


    ```

    alfred@werner:~$ ssh mail.pangaea.edu

    ```


    ```

    The authenticity of host ''mail.pangaea.edu (192.168.1.6)'' can''t be established.

    ```'
