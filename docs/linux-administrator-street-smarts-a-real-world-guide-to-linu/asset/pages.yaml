    # ## Adding User-Controlled Mounts


    Linux requires filesystems to be mounted in order to access them in an ordinary
    way, but Linux doesn''t permit ordinary users to mount and unmount arbitrary filesystems.
    This can lead to a problem: How can an ordinary user access a floppy disk, CD-ROM,
    or other removable media? This problem can even extend to network mounts, which
    if keeping them permanently mounted is unnecessary or undesirable. One solution
    to these problems is to use an automounter, which is a software tool that checks
    for accesses to particular directories and automatically mounts a filesystem when
    it detects such accesses. Many Linux distributions that are intended for use on
    desktop computers ship with automounter support. Another approach is to enable
    ordinary users to mount and unmount filesystems that are specified in `/etc/fstab`.
    This is done by adding options to the `/etc/fstab` entry for a file:


    +   - **users**: This option enables ordinary users to mount and unmount the filesystem
    using a simplified syntax, as described shortly.

    +   - **user**: This option works just like `users` except that the system remembers
    who mounted the filesystem. Only that user (or `root`) may unmount the filesystem.

    +   - **owner**: This option works very much like `user` except that only the
    user who owns the mount point (or `root`) may mount the filesystem. This is handy
    if you want to give just one user the right to mount a filesystem.

    +   - **noauto**: This option tells Linux to not automatically mount the filesystem
    when it boots or when you type `mount -a`. This is most helpful for removable
    media, but you can use it with any filesystem except those that are required for
    system operation.


