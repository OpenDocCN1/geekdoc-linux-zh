    # ### Performing a System Update


    The ultimate in package updates is using APT to update every package installed
    on your system. Debian-based systems include a file, /etc/apt/sources.list, that
    specifies locations from which important packages can be obtained. If you installed
    the OS from a CD-ROM drive, this file will initially list directories on the installation
