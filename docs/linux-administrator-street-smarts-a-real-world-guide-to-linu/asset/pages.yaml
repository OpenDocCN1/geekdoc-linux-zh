    # Making Your Changes Permanent


    Chances are you don''t want to type a series of commands to adjust your environment
    variables every time you log into your Linux system or launch a new `xterm` window.
    You can automate the process by modifying `bash` configuration files. Table 1.4
    summarizes the locations and names of these files.


    **TABLE 1.4** Common bash Configuration Files


    | Type of File | Login File Location | Non-Login File Location |

    | :--- | :--- | :--- |

    | Global | `/etc/profile` and files in `/etc/profile.d` | `/etc/bashrc` or `/etc/bash.bashrc`
    |

    | User | `~/.bash_login`, `~/.profile`, or `~/.bash_profile` | `~/.bashrc` |


    The `bash` configuration files can be either global (they apply to all users)
    or user (they apply to individual users), and either login files (they apply to
    login sessions, such as those initiated from a text-mode login prompt) or non-login
    files (they apply to non-login sessions, such as those started in `xterm` windows).
    The precise names used for these files varies from one distribution to another.
    The most common user configuration files are `~/.bashrc` and `~/.profile`, so
    look for those files. To make your changes permanent, you must locate existing
    lines that set the environment variables you want to modify or add new lines.


