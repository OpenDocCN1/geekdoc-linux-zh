  md: 'This command''s output shows that several devices are consuming IRQs. Some
    of these, such as timer (IRQ 0) and rtc (IRQ 8), are motherboard devices. Others,
    such as nvidia (IRQ 16) and sym53c8xx (IRQ 18), are plug-in cards. Knowing which
    is which is a matter of knowing the hardware in your system.


    In this example, two IRQs are shared: 16 (eth0 and nvidia) and 19 (three USB controllers).
    This example system is a fairly modern x86-64 system that can handle such IRQ
    sharing, so this isn''t a problem.


    Notably absent from this output are IRQs for some standard devices, such as the
    floppy controller, RS-232 serial ports, and parallel printer port. The reason
    for their absence is that these devices had not been accessed when the command
    was issued. If a device is used (say, by mounting a floppy disk), its entry will
    appear in subsequent accesses of /proc/interrupts. Thus, if you don''t use a device,
    its entry might not appear in /proc/interrupts but it could still claim its interrupt
    at some future time. In creating an inventory of used IRQs, you should take this
    fact into consideration and use every device that your system contains before
    creating your inventory. Table 2.1 summarizes some of the common IRQs and their
    uses. This table omits IRQs for some common modern devices, such as USB ports,
    which are likely to map to different IRQs on different systems.


    # **TABLE 2.1** IRQs and Their Common Uses


    | IRQ | Typical Use | Notes |

    | --- | --- | --- |

    | 0 | System timer | Reserved for internal use. |

    | 1 | Keyboard | Reserved for keyboard use only. |

    | 2 | Cascade for IRQs 8–15 | The original x86 IRQ-handling circuit can manage
    just 8 IRQs; 2 are tied together to handle 16 IRQs, but IRQ 2 must be used to
    handle IRQs 8–15. |

    | 3 | Second RS-232 serial port (COM2 : in Windows) | May also be shared by a
    fourth RS-232 serial port. |

    | 4 | First RS-232 serial port (COM1 : in Windows) | May also be shared by a third
    RS-232 serial port. |

    | 5 | Sound card or second parallel port (LPT2 : in Windows) |  |

    | 6 | Floppy disk controller | Reserved for the first floppy disk controller.
    |

    | 7 | First parallel port (LPT1 : in Windows) |  |

    | 8 | Real-time clock | Reserved for system clock use only. |'
