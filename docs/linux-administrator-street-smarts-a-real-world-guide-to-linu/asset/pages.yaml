- pgno: 28
  md: '![](img/f430a19bdf014c43ad7c2d594afd5b21_28_0.png)


    Linux''s tools for running programs and manipulating files are simple, unglamorous,
    and powerful. Although you can use GUI tools to drag and drop files, real Linux
    street smarts requires you to be able to manage your files from the command line
    by using odd-sounding commands such as `ls`, `cp`, `ln`, and `mv`. In the first
    few tasks of this phase, you''ll learn to use some of the most basic of these
    tools. Don''t think that the basic nature of these commands is unimportant, though;
    like the foundation of a house, these commands support more dramatic parts of
    the structure. Specific tasks described in this phase include using basic command-line
    features; managing files, directories, and links; finding files; and editing files.


    Later tasks in this phase go further, examining streams, pipes, redirection, the
    shell environment, and shell scripts. You''ll also learn about managing accounts.
    Most of the tasks in this phase assume you have both a normal user account and
    **root** access, but you must also be able to create, delete, and otherwise manage
    normal user accounts for yourself or other users of a Linux system.


    > NOTE: This phase maps to portions of the CompTIA Linux+ objectives 2 and 3 and
    to portions of the LPIC objectives 103, 104, 109, and 111.


    # # Task 1.1: Use Basic Command-Line Features


    Before delving into the details of commands used to manage, find, and manipulate
    files, you must be able to use basic command-line features. Linux supports several
    *shells*, which are programs that accept typed commands and display their output.
    Some shell commands are built into the shell, but many others are actually external
    programs. Knowing how to use your shell''s features will enable to you to be more
    productive at the Linux command line. The most common Linux shell is the Bourne
    Again Shell (*bash*), and it is the one described here. Other shells, such as
    *tcsh* and *zsh*, support similar features, although some details differ.


    # ## Scenario


    A user is experiencing problems with the *what is* program, a standard Linux script
    that the user frequently runs. As the administrator, you must check that this
    script exists and that it''s not obviously corrupt. In the process, you''ll use
    several important Linux command-line features.'
  merge: -1
  img_proc: true
- pgno: 29
  md: "> NOTE\n> \n> Actually correcting a problem such as the one described here\
    \ is likely to require the use of Linux's package management tools. These are\
    \ described in Phase 3, “Managing Software.”\n\n# ## Scope of Task\n\nThis task\
    \ is fairly straightforward. It requires little time and effort. You might want\
    \ to continue experimenting with **bash** after you’ve completed this task, though.\n\
    \n# ## Duration\n\nThis task will take about half an hour to complete. Once you’re\
    \ familiar with the commands, using each one takes just seconds.\n\n# ## Setup\n\
    \nYou must have access to a working Linux system. For the specific examples shown\
    \ in this task, your system should be configured to give you a **bash** shell\
    \ by default and the **what is** program must be installed. Both of these conditions\
    \ are usually true. If your Linux computer is not currently turned on, do so now\
    \ and wait for it to finish booting.\n\n# ## Caveats\n\nMost Linux systems configure\
    \ **bash** as the default shell for all users. If your account is configured to\
    \ use **tcsh** or some other shell, some of the commands and procedures described\
    \ here won’t work. Even with **bash**, a few details differ from one account or\
    \ computer to another. Most commonly, the form of the command prompt varies from\
    \ one system to another and sometimes even from one account to another. For simplicity\
    \ and brevity, this book denotes user shell commands with a leading dollar sign\
    \ ($), which is often used as part of real **bash** prompts, as in:\n\n```\n$\
    \ 1s\n```\n\nThis line means to type **1s** at a user command prompt. Some systems\
    \ use a prompt that ends in a greater-than sign (>) instead of a dollar sign.\n\
    \nMost Linux systems provide a different prompt (often terminating in a hash mark,\
    \ #) for the superuser (**root**) account. When a command must be typed as **root**,\
    \ this book shows command lines beginning with this symbol:\n\n```\n# 1s\n```\n\
    \nWhen short commands appear inside paragraph text, the prompt ($ or #) is omitted."
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Procedure


    To complete this task, you must log into your account on the affected workstation
    and enter several Linux commands. In the process, you''ll learn how to type and
    edit commands, how to use command completion, and how to use command history.
    You''ll also learn a few of the more common Linux commands.


    # Logging In


    The first task is logging into the Linux system. From the console, there are two
    ways to log in: using a graphical user interface (GUI) login manager or using
    a text-mode console. In either case, you type your username and then your password,
    typically in response to a **login** or **username** prompt and a **password**
    prompt, respectively.


    Upon a successful text-mode login, you''ll be greeted by a Linux command prompt
    and you can begin issuing Linux commands. GUI logins, though, present you with
    a graphical desktop environment—probably the K Desktop Environment (KDE) or the
    GNU Network Object Model Environment (GNOME). Although GUI desktop environments
    are convenient for end users, they don''t usually present you with a text shell
    by default. To access one, you must locate an appropriate option from the menuing
    system. Look for entries called Shell, Terminal, or **xterm**. If all else fails,
    look for an option to run a command by name and type **xterm** in the dialog box.
    This should launch an **xterm** window, as shown in Figure 1.1. Your default shell
    should be running in this window.


    If your computer displays a GUI login prompt but you''d prefer to work in a purely
    text-mode session, press Ctrl+Alt+F1. This key sequence switches to the first
    virtual console, which normally holds a text-mode session. You can switch between
    several (usually six) text-mode consoles by pressing Alt+F1 through Alt+F6 for
    each of the first six virtual consoles. The X Window System, Linux''s GUI environment,
    normally runs in virtual console 7, so pressing Alt+F7 from a text-mode session
    switches to X if it''s running.


    FIGURE 1.1 An xterm window enables you to type text-mode commands in a GUI session.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_30_0.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'For this task, you should log in as an ordinary user. In fact, it’s good practice
    to *always* log in as an ordinary user. You can subsequently acquire superuser
    privileges from your ordinary user account if you need such access (described
    shortly in “Obtaining Superuser Privileges”).


    Logging in as an ordinary user and then obtaining superuser privileges is better
    than logging in directly as *root* because this two-step process leaves a trace
    in the system log file of who acquired *root* privileges. On systems with multiple
    administrators, this can make it easier to track down who caused problems if an
    administrator makes a mistake.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_31_0.png)


    > The Linux system administration account is conventionally called *root*, but
    it’s possible to configure Linux with aliases for this name. Under any name, this
    account is often referred to as the *superuser* account.


    # Verifying the Presence of a File


    To verify that a file is present, use the `ls` command. This command’s name stands
    for *list*; it shows a list of files that match a file specification you provide.
    (Task 1.2 describes file specifications in more detail.) For now, check for the
    presence of the *what1s* file, which is located in the `/usr/bin` directory:


    ```

    $ ls /usr/bin/what1s

    /usr/bin/what1s

    ```


    Used without any extra parameters, `ls` displays the names of all the matching
    files. Because this example provides the complete name of a single file, only
    that filename is displayed, on the line immediately following the command’s line.


    If you type the name of a directory, `ls` displays the names of all the files
    in that directory. Try this with the `/usr/bin` directory now—but be prepared
    for copious output! The `/usr/bin` directory holds the program files associated
    with many (but not all) Linux commands.


    Like many Linux commands, `ls` accepts options that modify its actions. One of
    the most important is `-1` (that’s a lowercase *L*, not a number *1*), which generates
    a “long” listing:


    ```

    $ ls -l /usr/bin/what1s

    -rwxr-xr-x  1 root root 2409 Nov 19  2004 /usr/bin/what1s

    ```


    I describe what this output means in more detail in Task 1.2.


    # Examining the File


    Now that you know the command file is present, you can examine it. Three commands
    are very handy for examining text files:


    +   * **cat** This command’s name is short for *concatenate*, and it’s used to
    merge two or more files together. If it’s passed just one filename, though, it
    copies the file to the screen. This can be a good way to look at a short text
    file. Try it on the *what1s* file by typing `cat /usr/bin/`'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'whatis. Unfortunately, the whatis file is too long to fit on a standard 80x25
    screen, although it might fit on an extra-large screen or resized xterm.


    more This command is a simple pager—it displays text a page (that is, a screenful)
    at a time. When you''re done reading a page, press the spacebar and more displays
    the next page.


    less Unix (and hence Linux) programmers aren''t afraid to display their (sometimes
    quirky) senses of humor. The more program is limited—for instance, it doesn''t
    let you page backward in a file. Thus, when it came time to improve more, the
    authors of the improved program called it less as a joke. You can use the keyboard''s
    arrow keys and various other options to move back and forth in the file. When
    you''re done, press the Q key to exit from the program. Type man less to learn
    more about less. (The man command is described in more detail shortly, in “Getting
    Help.”)


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_32_0.png)


    All of these commands are intended to work on text files. When fed non-text files,
    such as binary program files, cat is likely to cause a lot of annoying beeping
    and may leave your screen displaying gibberish when you type new commands. Typing
    reset should restore the screen to usability. Both more and less cope a bit better
    with binary files, but you''re not likely to be able to learn much from them.
    Recent versions of less are often smart enough to recognize certain common binary
    file types and pass them through a translator so you can see their contents in
    text form.


    # Working with Directories


    Whenever you''re running a shell, you''re working in a specific directory. When
    you refer to a file without providing a complete path to the file, the shell works
    on the file in the current working directory. (Similar rules apply to many programs.)
    The cd command changes the current working directory. For instance, typing cd
    /home/sally changes the current directory to /home/sally. The tilde (~) character
    is a useful shortcut; it stands for your home directory, so cd ~ will have the
    same effect as cd /home/sally if your home directory is /home/sally. Many Linux
    systems display the current working directory in their prompts. In Figure 1.1,
    the current working directory is the home directory (~); that character appears
    in the command prompt and will be replaced by other directory names if you use
    cd to change directories. If your prompt doesn''t include this information and
    you want to know what directory you''re working in, type pwd. This command''s
    name stands for print working directory; it displays the current working directory''s
    name.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_32_1.png)


    Unlike DOS and Windows, Linux doesn''t use drive identifier letters, such as C:.
    All directories reside in a single unified directory tree. Removable disks and
    multiple disk partitions are mounted within that tree, as described in Phase 5,
    “Managing Partitions and Filesystems.” Another important difference between Linux
    and Windows is that Linux uses a forward slash (/) to separate directories, whereas
    Windows uses a backslash (\) for this purpose.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # Using Command Completion


    Many users find typing commands to be tedious and error prone. For this reason,
    Linux shells include various tools that can help speed up operations. The first
    of these is *command completion*: Type part of a command or (as an option to a
    command) part of a filename and then press the Tab key. The shell tries to fill
    in the rest of the command or the filename. If just one command or filename matches
    the characters you''ve typed so far, the shell fills it in and places a space
    after it. If the characters you''ve typed don''t uniquely identify a command or
    filename, the shell fills in what it can and then stops. Depending on the shell
    and its configuration, it may beep. If you press the Tab key again, the system
    responds by displaying the possible completions. You can then type another character
    or two and, if you haven''t completed the command or filename, press the Tab key
    again to have the process repeat.


    The most fundamental Linux commands have fairly short names—cd, pwd, and so on.
    Some other commands are much longer, though, such as traceroute or sane-find-scanner.
    Filenames can also be quite lengthy—up to 255 characters on many filesystems.
    Thus, command completion can save a lot of time. It can also help you avoid typos.


    To try out command completion, type the preceding ls command to verify the presence
    of the whatis program, but press the Tab key once or twice after you type the
    wh portion of the whatis name. Chances are you''ll see a list of *half a dozen*
    or more possible completions. Add the a from the whatis name and press the Tab
    key again. Your system might then complete the whatis name or display a shorter
    list of possible completions, depending upon whether or not other files with names
    beginning w ha appear in your /usr/bin directory.


    # # Using Command History


    Another helpful shell shortcut is the *shell history*. The shell keeps a record
    of every command you type (stored in ~/.bash_history in the case of bash). If
    you''ve typed a long command recently and want to use it again, or use a minor
    variant of it, you can avoid the command out of the history. The simplest way
    to do this is to press the up arrow key on your keyboard; this brings up the previous
    command. Pressing the up arrow key repeatedly moves through multiple commands
    so you can find the one you want. If you overshoot, press the down arrow key to
    move down the history. The Ctrl+P and Ctrl+N keystrokes double for the up and
    down arrow keys, respectively.


    Another way to use the command history is to search through it. Press Ctrl+R to
    begin a backward (reverse) search, which is what you probably want, and begin
    typing characters that should be unique to the command you want to find. The characters
    you type need not be the ones that begin the command; they can exist anywhere
    in the command. You can either keep typing until you find the correct command
    or, after you''ve typed a few characters, press Ctrl+R repeatedly until you find
    the one you want. The Ctrl+S keystroke works similarly but searches forward in
    the command history, which might be handy if you''ve used a backward search or
    the up arrow key to look back and have overshot. In either event, if you can''t
    find the command you want or change your mind and want to terminate the search,
    press Ctrl+G to do so.


    Try out these features now: use the up arrow key to recall your previous command,
    and press Ctrl+R and a portion of that command to search for it.'
