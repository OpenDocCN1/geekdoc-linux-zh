- pgno: 34
  md: '# ## Editing Commands


    Frequently, after finding a command in the history, you want to edit it. The bash
    shell, like many shells, provides editing features modeled after those of the
    Emacs editor:


    **Move within the line** Press `Ctrl+A` or `Ctrl+E` to move the cursor to the
    start or end of the line, respectively. The left and right arrow keys will move
    within the line a character at a time. `Ctrl+B` and `Ctrl+F` will do the same,
    moving backward and forward within a line. Pressing `Ctrl` plus the left or right
    arrow keys will move backward or forward a word at a time, as will pressing `Esc`
    and then B or F.


    **Delete text** Pressing `Ctrl+D` or the Delete key deletes the character under
    the cursor, while pressing the Backspace key deletes the character to the left
    of the cursor. Pressing `Ctrl+K` deletes all text from the cursor to the end of
    the line. Pressing `Ctrl+X` and then Backspace deletes all the text from the cursor
    to the beginning of the line.


    **Transpose text** Pressing `Ctrl+T` transposes the character before the cursor
    with the character under the cursor. Pressing `Esc` and then T transposes the
    two words immediately before (or under) the cursor.


    **Change case** Pressing `Esc` and then U converts text from the cursor to the
    end of the word to uppercase. Pressing `Esc` and then L converts text from the
    cursor to the end of the word to lowercase. Pressing `Esc` and then C converts
    the letter under the cursor (or the first letter of the next word) to uppercase,
    leaving the rest of the word unaffected.


    **Invoke an editor** You can launch a full-fledged editor to edit a command by
    pressing `Ctrl+X` followed by `Ctrl+E`. The bash shell attempts to launch the
    editor defined by the `$FCEDIT` or `$EDITOR` environment variable or Emacs as
    a last resort. (Environment variables are described later in this phase.)


    These editing commands are just the most useful ones supported by bash; consult
    its man page to learn about many more obscure editing features. In practice, you''re
    likely to make heavy use of command and filename completion, command history,
    and perhaps a few editing features.


    Try editing your previous command by pulling it out of the history and then changing
    it. For instance, you might add the `-l` option to the command that did not use
    it or verify the presence of another file, such as `/usr/bin/who`.


    # ## Getting Help


    Linux provides a text-based help system known as `man`. This command''s name is
    short for manual, and its entries (its man pages) provide succinct summaries of
    what a command, file, or other feature does. For instance, to learn about `man`
    itself, you would type `man man`. The result is a description of the `man` command.


    The `man` utility uses the `less` pager to display information. When you''re done,
    press Q to exit from `less` and the `man` page it''s displaying.


    Some programs have moved away from `man` pages to `info` pages. The basic purpose
    of `info` pages is the same as that for `man` pages, but `info` pages use a hypertext
    format so that'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'you can move from section to section of the documentation for a program. Type
    **info info** to learn more about this system.


    Both man pages and info pages are usually written in a terse style. They''re intended
    as reference tools, not tutorials; they frequently assume basic familiarity with
    the command, or at least with Linux generally. For more tutorial information,
    you must look elsewhere, such as this book or the Web. The Linux Documentation
    Project (http://tldp.org) is a particularly relevant Web-based resource for learning
    about various Linux topics.


    # ## Obtaining Superuser Privileges


    To fully administer a Linux system, you must sometimes use the superuser account,
    which goes by the name root. Although you can log directly into the root account,
    it''s generally best to instead log into a regular user account and then acquire
    superuser privileges.


    One way to do this is to use the su command, whose name stands for switch user.
    You can actually acquire any user''s identify in this way by typing the target
    username after the command, as in su hyde to acquire hyde''s privileges. If you
    omit a username, root is assumed, so typing su alone is equivalent to typing su
    root. In any of these cases, you must know the target user''s password, so only
    users who know the root password may acquire superuser privileges via su. Once
    you''re using the root account, though, you can use su to acquire any user''s
    privileges without a password. This can be a helpful problem-solving tool, since
    you can locate problems that are user specific.


    Try using su to acquire root privileges. Depending upon your system configuration,
    chances are your prompt will change. For instance, a Fedora Core system shows
    the following prompts:


    ```

    ```text

    [sally@halrloprillalar ~]$ su

    Password:

    [root@halrloprillalar sally]#

    ```

    ```


    # ## Logging Out


    Once you''re done, you should log out. This is a particularly important security
    measure if your computer is in a public place. If you''re using a login shell
    (that is, if you logged into the shell via a login prompt), you can log out by
    typing logout at the command prompt. If you''re using an xterm window or have
    used su to acquire another user''s privileges, though, you should type exit to
    log out. (In fact, exit will also work with login shells.)


    If you logged into an X session using a GUI login tool, you should log out from
    that session. Most desktop environments provide an obvious way to do that via
    their main menuing systems. Typically, you''ll see a power button icon or a menu
    option titled "log out" or "exit." Some environments give you the option of logging
    out, rebooting the computer, or shutting down the computer. Be sure to save files
    and exit from programs that open files before logging out of an X session. You
    needn''t worry about shutting down xterm windows or other programs that don''t
    open disk files, though.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Don’t shut down or reboot Linux by pressing the power or reset buttons on the
    computer’s case. Like most modern OSs, Linux requires a controlled shutdown to
    avoid damaging the data on its hard disk. If you want to shut down the system,
    use a shutdown option at a GUI login prompt or type `shutdown -h now` as root.
    Replace `-h` with `-r` if you want to reboot the computer rather than shut it
    down. As a practical matter, if the computer has completely frozen, you may need
    to perform an uncontrolled shutdown, but you should try to avoid this practice
    whenever possible.


    # Criteria for Completion


    You have completed this task when you’ve verified the presence of the `what is`
    command in `/usr/bin` and checked to see that it’s a shell script (that is, a
    program that consists of text-mode commands that a shell executes). In the process,
    you’ll learn about file-examination commands, command completion, command history,
    the Linux `man` system, and acquiring superuser access. If a user were really
    having problems with the `what is` command, though, it might be missing or corrupt,
    in which case you’d be unable to find it in `/usr/bin` or it might contain gibberish
    rather than text-mode commands.


    # Task 1.2: Manage Files and Directories


    Many Linux features are implemented via files and directories. To perform some
    operations, you may need to move, rename, delete, or otherwise modify files and
    directories. Thus, an understanding of the commands used to accomplish these jobs
    is necessary for effective use of Linux. This task gives you practice with these
    commands.


    # Scenario


    A new project is starting at your place of work. To prepare, you must create a
    directory to hold files that are to be accessible to all the members of this project,
    who are already members of the `users` group. You must also populate this new
    directory with a few files (which, for purpose of this exercise, you’ll copy from
    the `/etc` directory).


    # Scope of Task


    This task requires creating, copying, and managing the permissions of both files
    and directories.


    # Duration


    This task should take about half an hour to complete. Once you’ve learned the
    task, you should be able to perform similar tasks in just a few minutes.'
