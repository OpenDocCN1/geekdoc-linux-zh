  md: 'For instance, with $X$ not running, you might type the following command at
    a text-mode prompt:


    ```

    $ /usr/X11R6/bin/X -query ganda1f.luna.edu

    ```


    This command starts $X$, but rather than launch your local display manager and
    other software, $X$ connects to ganda1f.luna.edu to present a login prompt on
    that system. When you log in, you’ll be using ganda1f via the keyboard and display
    of your local computer.


    > If you have slow computers that you want to continue using, one way is to convert
    them into $X$ terminals. Install Linux on these systems, configure them to start
    in text mode, and create custom SysV or local startup scripts to launch $X$. Users
    can then log into other systems, using the old systems only for their displays,
    keyboards, and mice.


    # Criteria for Completion


    To complete this task, you should have successfully reconfigured your $X$DM, $K$DM,
    or $G$DM software to accept remote logins via $X$DMCP. You can test for successful
    completion of this task by using another Linux computer or even a non-Linux system
    with an $X$ server package installed.


    For security reasons, you should reverse your changes after you’ve tested them,
    unless you want to use the remote-access features of an $X$DMCP server. If this
    is the case, you should review your network security features and employ firewall
    rules to prevent outside access to your $X$DMCP server (on UDP port 177) and to
    the $X$ server (on TCP port 6000).


    # Task 2.10: Use $X$ for Day-to-Day Operations


    $X$, like many Linux tools, is highly modular. The $X$ server itself provides
    networking features but only fairly minimal graphics features: the ability to
    create windows, draw simple shapes, display text, and so on. $X$ does not, by
    itself, provide the ability to display dialog boxes, tools for moving or resizing
    windows via the mouse, program menu bars, and so on. These features are all provided
    by add-on tools. Some of these tools, known as *widget sets*, are chosen by programmers;
    you as a user or system administrator have no choice over what widget sets your
    programs use. Other add-on tools, though, can be chosen by users and system administrators.
    Window managers provide decorative borders around windows and enable users to
    move and resize windows. They also often provide a few additional features, such
    as tools for launching programs and the ability to maintain multiple desktops,
    each with its own set of programs running. Desktop environments go further; they
    provide a collection of useful utilities, including calculators, file browsers,
    tools to set $X$ options, and so on. Desktop environments are usually built atop
    particular window managers, but most window managers are independent of desktop
    environment projects. Some advanced Linux users run “bare” window managers to
    avoid expending system resources on running a full desktop environment, but novices
    and other advanced users often prefer to run a complete desktop environment.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'The K Desktop Environment (KDE; `http://www.kde.org`) and the GNU Network Object
    Model Environment (GNOME; `http://www.gnome.org`) are the two most popular desktop
    environments for Linux. Both attempt to provide a wide range of tools but in the
    process end up consuming vast amounts of memory. A few others, such as XFce (`http://www.xfce.org`)
    and Xde (`http://www.xpde.com`), focus on other goals, such as slimmer resource
    requirements or a “look and feel” that mimics that of Windows XP, respectively.
    You can consult `http://xwinman.org` for information on these and other window
    managers and desktop environments.


    Knowing how to install and select a window manager or desktop environment will
    enable you to get the most out of your system—you can pick a slim window manager
    alone if your system is short on memory or a big desktop environment if you’ve
    got lots of RAM and want all the creature comforts. As a system administrator,
    you can choose which options to make available. As a user, you can select which
    option to use as a personal default or on a per-session basis.


    # Scenario


    The **gandalf** computer, which you’ve just configured for remote access in the
    previous task, has a dozen users, and they have different preferences concerning
    their desktop environments. To satisfy these users, you must make several environments
    available as login options:


    +   - KDE

    +   - GNOME

    +   - XFce

    +   - IceWM (`http://www.icewm.org`)

    +   - FVWM (`http://www.fvwm.org`)


    The first three of these environments are full desktop environments, but the last
    two are window managers alone. You must configure **gandalf** to enable users
    to select any of these environments at login time.


    # Scope of Task


    To complete this task, you must modify your system to present certain login-time
    options. This entails installing software and modifying your KDM or GDM configuration
    to present the relevant options to users. XDM provides relatively limited login
    environment selection options—specifically, XDM runs the `.xsession` script in
    the user’s home directory. This script can launch any window manager or desktop
    environment that the user desires, but the user cannot select an environment on-the-fly
    at the moment of login. Thus, I don’t describe XDM configuration in detail for
    this task.


    # Duration


    This task should take half an hour to an hour to complete. Once you’re familiar
    with the procedure, you should be able to add desktop environments to a system
    in a few minutes, assuming you don’t run into problems installing the software.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Setup


    Begin by logging into the computer and acquiring **root** privileges. Although
    the scenario specifies that the computer is configured for remote access, that’s
    not necessary to complete this task—the configuration changes required are identical
    whether or not the XDMCP server is actually configured for remote access. Because
    your changes will require restarting your XDMCP server, and therefore terminating
    any X session, you should work from a text-mode login or at least be prepared
    to have your X session shut down when you implement the changes. If the computer
    doesn’t display an XDMCP GUI login prompt when it boots, configure it to do so,
    or at least so that such a server is installed and *can* be run.


    # Caveats


    As usual, working as **root** poses the risk of accidentally causing problems
    on your system. Mistakes in the configurations you implement could conceivably
    cause X to fail to start, although it’s more likely that you simply won’t see
    the options you’d intended to add or that you won’t be able to launch those environments.


    # Procedure


    To add new environments to the options available at login time, you must both
    install software and configure your XDMCP server. KDM and GDM are configured in
    similar ways, so you’ll follow just one procedure no matter which environment
    you’re using. Once you’ve made your changes, you should check that you can log
    in and launch your chosen desktop environment or window manager.


    # Installing New Environments


    In order to use a window manager or desktop environment, you must install it on
    your computer. Unfortunately, this task is complex enough that I can’t fully describe
    it here. If you need help, consult Phase 3, “Managing Software.”


    Fortunately, most Linux distributions install a variety of window managers and
    desktop environments as default options. Chances are you’ve got KDE or GNOME (and
    quite possibly both of them) installed already, along with at least one or two
    bare window managers. FVWM is often installed by default, and IceWM may be as
    well. To check for these window managers and desktop environments, look for the
    following program files: **startkde** (KDE), **gnome-session** (GNOME), **startxfce4**
    or **xfce4-session** (Xfce), **icewm** or **icewm-session** (IceWM), and **fvwm**
    (FVWM).


    If a window manager or desktop environment isn’t installed, you can install it
    using your distribution’s package system or from the source code provided by the
    package’s developers, as described in Phase 3. Alternatively, you can ignore it
    or substitute another window manager that is installed in your system.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_134_0.png)


    > Many window managers include the letters **wm** in their names and in their
    executables’ names. Therefore, you can type `ls /usr/bin/*wm* /usr/X11R6/bin/*wm*`
    to locate likely substitute window managers.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Configuring KDM and GDM


    Modern versions of both KDM and GDM rely on files stored in /usr/share/xsessions
    to determine what options to present for possible login sessions. This directory
    holds files with names of the form environment.desktop, where environment is the
    environment name (such as KDE or GNOME). The precise names vary from one distribution
    to another, so you should be able to spot the session file for your environment
    of choice—if it exists. For this task, look for kde.desktop, gnome.desktop, xfce.desktop,
    icewm.desktop, and fvwm.desktop or similar files. (Some distributions capitalize
    parts of certain environment names, and there may be other variations of some
    of these names.)


    If a session file doesn’t exist for your environment, you can create one. The
    simplest way to do this is probably to copy an existing file and make appropriate
    changes. Listing 2.2 shows a sample file that launches IceWM. You should change
    the Name and Comment entries if you create a file for another environment. These
    fields present a name and a comment, both of which are visible to users. Just
    as important, you should change the Exec and TryExec lines, which point to the
    program that’s used to launch the environment. KDE uses startkde, GNOME uses gnome-session,
    Xfce uses startxfce4 or xfce4-session, and most bare window managers, including
    fvwm, use their own names. (Listing 2.2’s IceWM window manager is an exception;
    it uses icewm-session, although icewm also works with some IceWM packages.)


    # Listing 2.2: Sample X Session File for GDM and KDM


    ```

    [Desktop Entry]

    Encoding=UTF-8

    Name=IceWM

    Comment=This session logs you into IceWM

    Exec=icewm-session

    TryExec=icewm-session

    # no icon yet, only the top three are currently used

    Icon=

    Type=Application

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_135_0.png)


    Most X session files include a large number of Name and Comment lines, each of
    which includes a language code, such as Name[fr] for French. You can delete all
    of these except for the language your system actually uses or even just leave
    the bare Name and Comment lines, as in Listing 2.2.


    Most distributions provide a large number of session files for a wide variety
    of window managers and desktop environments. Sometimes these come with the GDM
    and KDM programs; they’re likely to be buried in an obscure directory such as
    /usr/share/apps/kdm/sessions/ or /usr/kde/3.5/share/apps/kdm/sessions/. Sometimes
    window manager or desktop environment packages ship with a suitable session file;
    these files may be buried in'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'obscure locations or may be automatically installed in `/usr/share/xsessions`.
    In the latter case, you need do nothing special, since the act of installing the
    environment automatically adds it to your GDM and KDM menus.


    # Testing Your Configuration


    Once you’ve added an X session file, you must restart your XDMCP server, as described
    earlier in “Identifying Your XDMCP Server” in Task 2.9. When KDM or GDM starts
    up again, you should see your new session in its list of available sessions, such
    as the Session Type selector in Figure 2.7, which shows a KDM login prompt. The
    details of where this selector appears varies from one system to another. In GDM,
    the relevant option is usually called Session rather than Session Type.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_136_0.png)


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_136_1.png)


    Many distributions remember users’ choices for login sessions and use those choices
    as their defaults or give users the option of changing their defaults when they
    select a new session. Other distributions, though, including the popular Fedora
    and Red Hat, require the user to run a special program to make these changes explicit.
    For Fedora and Red Hat, this program is the Desktop Switching Tool (switcdesk).


    # Criteria for Completion


    To complete this task, you should have successfully added new window managers
    and desktop environments to your KDM or GDM login prompt. Doing so requires installing
    the software and creating X session files in the `/usr/share/xsessions` directory.
    Some distributions make this task very easy by placing appropriate files in this
    directory when you install the relevant desktop environment or window manager.'
