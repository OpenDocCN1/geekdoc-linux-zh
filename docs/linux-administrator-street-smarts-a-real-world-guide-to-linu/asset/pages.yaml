    cautions, checking a filesystem is theoretically safe, even if you accidentally
    enter the wrong partition device code. Checking a filesystem that''s currently
    mounted, though, is not safe; changes made by the filesystem check code can cause
    the kernel to become confused and result in additional corruption. Fortunately,
    `fsck` checks to see if you''re calling it on a mounted filesystem and warns you
    about this. Be sure to read all the messages displayed by `fsck` as it operates.
    If you see a warning you don''t understand or that causes you concern, tell the
    software to stop and research that message before proceeding.


    # Procedure


    To perform a disk check, you use the filesystem check (`fsck`) program. Ordinarily,
    its use is fairly straightforward. On occasion, though, you might want to use
    additional tools to give your filesystem a tune-up.


