- pgno: 239
  md: 'You can specify either the mount point or the device filename to unmount a
    filesystem, so you could substitute /dev/sda1 for /home2 in the preceding example.
    You’re unlikely to use options, aside from the mount point or device filename;
    however, umount does support several. You should check its man page for details,
    but a few options you might want to use on occasion are listed here:


    **Remount read-only on failure** The umount command fails if files are open on
    the filesystem. The -r option causes the command to attempt to switch the mount
    to read-only mode if this happens. This can be helpful because it can limit damage
    if you’re about to do something that could damage filesystems, say by crashing
    the computer.


    **Unmount all filesystems** The -a option causes umount to unmount all filesystems
    that are recorded in /etc/mtab (a file that the system uses to track mounted filesystems).
    You wouldn’t ordinarily use this option, but you can combine it with the next
    one to unmount all filesystems of a particular type.


    **Operate on specific filesystem types** The -t fstype option tells umount to
    operate only on filesystems of the specified type.


    **Force unmount** The -f option forces an unmount of an NFS mount even if it doesn’t
    respond. This option has no effect with most filesystem types, though; it’s intended
    to enable you to unmount an NFS mount if the server goes down or becomes unreachable.


    # ## Criteria for Completion


    To complete this task, you should have mounted a filesystem (such as the one created
    in Task 5.3), verified that it’s mounted, and unmounted it. This task also presents
    a number of filesystem options. You might use these in the future, but you don’t
    need to use them to complete this task.


    # # Task 5.5: Use /etc/fstab


    The mount command is useful for enabling access to a filesystem on a one-time
    basis. If you want to make a filesystem permanently accessible, though, you must
    modify the /etc/fstab file, which describes all the filesystems that Linux mounts
    at boot time. You can also tell your system about swap space in /etc/fstab.


    # ## Scenario


    You want to permanently add the filesystem and swap space you created in Task
    5.3 to the computer. In addition, you want to add an NFS export (/opt/expon the
    nfs server computer, to be mounted at /opt) in read-only mode and an entry for
    a Zip drive you’ve added to the system. The Zip drive entry should enable ordinary
    users to mount and unmount disks.'
