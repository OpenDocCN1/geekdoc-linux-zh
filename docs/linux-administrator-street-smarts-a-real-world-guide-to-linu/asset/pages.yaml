- pgno: 241
  md: '| /dev/hdb5 | /windows | vfat | uid=500,umask=0 | 0 | 0 |

    | /dev/hdc | /mnt/cdrom | iso9660 | users,noauto | 0 | 0 |

    | /dev/fd0 | /mnt/floppy | auto | users,noauto | 0 | 0 |

    | /dev/nda4 | swap | swap | defaults | 0 | 0 |


    The meaning of each field in this file is as follows:


    **Device** The first column specifies the mount device. These are usually device
    filenames that reference hard disks, floppy drives, and so on. Some distributions,
    such as Red Hat, have taken to specifying partitions by their labels, as in the
    *LABEL=/home* entry in Listing 5.1. When Linux encounters such an entry, it tries
    to find the partition whose filesystem has the specified name and mount it. This
    practice can help reduce problems if partition numbers change, but many filesystems
    lack these labels. It’s also possible to list a network drive, as described shortly
    in “Adding Network Mounts.”


    **Mount point** The second column specifies the mount point. This should usually
    be an empty directory in another filesystem. The root (/) filesystem is an exception.
    So is swap space, which is indicated by an entry of *swap*.


    **Filesystem type** The filesystem type code is the same as the type code used
    to mount a filesystem with the **mount** command. You can use any filesystem type
    code you can use directly with the **mount** command. A filesystem type code of
    *auto* lets the kernel auto-detect the filesystem type, which can be a convenient
    option for removable media devices. Auto-detection doesn’t work with all filesystems,
    though.


    **Mount options** Table 5.2 describes several common mount options, which are
    passed using the *-o* command-line option to **mount**. You may specify multiple
    mount options, separated by commas. For instance, *uid=500,umask=0* for */*windows*
    in Listing 5.1 sets the user ID (owner) of all files to 500 and sets the umask
    to 0. Type **man mount** or consult filesystem-specific documentation to learn
    more.


    **Backup operation** The next-to-last field contains a *1* if the **dump** utility
    should back up a partition or a *0* if it should not. If you never use the **dump**
    backup program, this option is essentially meaningless. The **dump** program is
    no longer a recommended backup tool for Linux, making this field unimportant in
    most cases.


    **Filesystem check order** At boot time, Linux uses the *fsck* program to check
    filesystem integrity. The final column specifies the order in which this check
    occurs. A *0* means that *fsck* should *not* check a filesystem. Higher numbers
    represent the check order. The root partition should have a value of *1*, and
    all others that should be checked should have a value of *2*. Some filesystems,
    such as ReiserFS, should not be automatically checked and so should have values
    of *0*.


