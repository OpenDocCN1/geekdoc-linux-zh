  img_proc: true
- pgno: 312
  md: '# ## Scenario


    You''ve just obtained a new printer and you want to configure your computer to
    use it. Your printer is connected directly to your computer via a USB port. (CUPS
    can also handle printers connected via parallel or RS-232 serial ports and network
    printers, but a few configuration details differ for these types of printers.)


    # ## Scope of Task


    This task requires using the Web-based configuration tool that''s part of CUPS.
    This tool guides you through the setup process, but a few steps provide the opportunity
    for slipsups that can cause problems.


    # ## Duration


    This task should take about half an hour to complete, or more if you run into
    problems. Unfortunately, each printer configuration task is unique, so you''re
    as likely to encounter problems the 10th or 100th time you install a printer as
    the first time—although if you really do install a hundred unique printers, you''ll
    have seen the most common types of problems and know how to work around them!


    # ## Setup


    This task requires that your computer be running CUPS, which most modern distributions
    do. You''ll also need **root** access, both for installing printer drivers and
    for configuring CUPS via its Web interface. You may also need to restart the CUPS
    server: After you plug in a USB-based printer, you should turn the printer on
    and then restart the CUPS server as **root**. In most cases, you can do this via
    SysV startup scripts, as in **/etc/init.d/cups restart**. You must do this because
    CUPS looks for USB printers when it starts up, so if you add or turn on a printer
    after the system has booted, you must restart CUPS so that it can find and use
    the printer. For this reason, you should also ensure that any USB printer is powered
    on before you boot the computer. This step isn''t necessary for printers that
    connect via a parallel or RS-232 serial port or for network printers (unless they''re
    USB models that are managed by a computer that runs CUPS).


    # ## Caveats


    With the exception of restarting CUPS, as just described, and installing printer
    definitions, you won''t be entering commands as **root**, which reduces the risks
    associated with this task. You will, however, be using the CUPS Web-based configuration
    tool as **root**, and you can damage your printer configuration if you make a
    mistake. In particular, you could delete or make unwanted changes to an existing
    working printer configuration.


    # ## Procedure


    This task requires you to perform two specific subtasks. First, you must obtain
    and install CUPS printer definitions (aka printer drivers). These may already
    be installed on your system,'
