- pgno: 227
  md: 'The filesystem type code is part of the partition table but doesn''t actually
    create a filesystem. Linux ignores the filesystem type code for most purposes,
    but many OSs use these codes to determine what partitions to mount. A few type
    codes are used by multiple OSs for different purposes. This is true of the Linux
    swap partition type code, 0x83, which is also used by Solaris to mark its native
    filesystems. Such collisions can be confusing and potentially dangerous in certain
    dual-boot scenarios but are harmless if your computer doesn''t dual-boot between
    the OSs in question.


    # Using Advanced Options


    You can do much more with fdisk than examine, delete, and add partitions, although
    those are the three primary functions of the utility. Typing \textbf{m} at the
    \textit{fdisk} command prompt reveals a list of supported commands. In fact, \textit{fdisk}
    supports \textit{two} sets of commands. The second menu, for experts, is accessible
    by typing \textbf{x} from the main menu. Here are some of the highlights from
    both menus:


    Disk verification\quad You can perform a basic sanity check on the disk by typing
    \textbf{v} from either menu. Ideally, you''ll see a message to the effect that
    there are a certain number of unallocated sectors. Because the x86 partition table
    allocates space by cylinders rather than sectors, there are likely to be a few
    unallocated sectors even when all available space has been used.


    Toggle the bootable flag\quad Typing \textbf{a} from the main menu enables you
    to toggle the bootable flag for a partition. This flag tells a standard DOS MBR
    boot loader which partition to boot. If you use a Linux boot loader in the MBR,
    this flag is unimportant.


    Change CHS geometry\quad The x86 partition table uses a cylinder/head/sector (CHS)
    system for identifying each sector. This system necessitates the use of fictitious
    CHS relationships for modern disks, though. You can change the way the system
    maps these values by using the \textbf{c}, \textbf{h}, and \textbf{s} options
    in the experts menu. Ordinarily you wouldn''t do this with a disk that''s already
    got partitions on it. The main reason to use this option would be if a disk''s
    CHS geometry is being incorrectly detected by the kernel and \textit{fdisk}.


    Change partition order\quad If you delete and create logical partitions, their
    numbering and on-disk order might not match. This situation shouldn''t cause problems
    with Linux, but it can be confusing and can cause problems for some OSs. You can
    type \textbf{f} from the expert menu to synchronize partition numbers and on-disk
    order. If you do this, you may need to adjust entries in \textit{/etc/fstab},
    as described shortly in Task 5.5, \textquotedblleft Use \textit{/etc/fstab}.\textquotedblright


    Additional options are available but are extremely obscure or require extremely
    advanced knowledge to use. If you''re interested, type \textbf{m} to see the options.


    # Criteria for Completion


    To complete this task, you should have successfully deleted existing partitions
    from a disk you intend to reuse in a new computer and created two new partitions
    in the resulting empty space.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'One of these partitions should be for Linux filesystems and the other should
    be marked as Linux swap space. To do this, you can use the Linux `fdisk` utility,
    which is powerful but not the most user-friendly tool around. When using `fdisk`—or
    any other disk partitioning software—you should exercise extreme care to be sure
    you don’t accidentally wipe out important partitions.


    # # Task 5.3: Create Filesystems


    Creating partitions alone won’t make a disk usable. *A filesystem* does this job:
    A filesystem is a set of data structures that enable the computer to write files
    to the disk and to find those files at a later date. Linux supports many different
    filesystems, so you’ll have to decide which ones you want to use. You can then
    create them and, as described later in Tasks 5.4 and 5.5, actually access them.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_228_0.png)


    > The word *filesystem* has two meanings. As used in this phase, the term refers
    to the data structures that enable an OS to store data on a disk. Another meaning
    of the word is more or less synonymous with the term *directory tree*. Which meaning
    is meant is usually clear from context. When there is ambiguity, I use additional
    words, such as *low-level filesystem*, to disambiguate the meaning.


    # ## Scenario


    This task’s scenario is a continuation of the one in Task 5.2, “*Use `fdisk` to
    Create Partitions.*” Using the partitions you created in that task, you want to
    create a filesystem and prepare the swap space for use. To do so, you’ll use Linux’s
    filesystem creation tools as well as a specialized tool for preparing swap space
    for use.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_228_1.png)


    > Creating a filesystem is sometimes called *formatting a disk*. This phrase is
    a bit imprecise, though, as it can refer to either *low-level formatting* or *high-level
    formatting*. Low-level formatting of hard disks is done at the factory, but you
    can low-level-format a floppy disk using the Linux `fdformat` utility. Creating
    a filesystem is synonymous with high-level-formatting a disk.


    # ## Scope of Task


    This task is fairly simple and straightforward, although it’s a potentially very
    dangerous task—specifying the wrong partition when you create a filesystem can
    destroy a lot of data!


    # ## Duration


    This task will take about 15 or 30 minutes to complete. You’ll spend much of that
    time mulling over the Linux filesystem options. Once you’re familiar with the
    tools used to create filesystems, you’ll be able to do the job in a few seconds.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Task 5.3: Create Filesystems


    # Setup


    To perform this task, you must have a disk with partitions you’re not currently
    using so that you can create new filesystems on the partitions. The disk you prepared
    in Task 5.2 is ideal, but in a pinch you can use a floppy disk (accessed as /dev/fd0)
    to practice. You must also have root access to your computer, so you should log
    in and acquire superuser privileges.


    # Caveats


    Creating a new filesystem writes low-level data structures to the disk. This act
    renders it nearly impossible to recover old filesystem data. Thus, if you mistakenly
    create a new filesystem on a disk that holds important data, you will effectively
    destroy that data. In theory, most or all of the data can be recovered, but such
    recovery requires specialized skills. Acquiring such skills is impractical in
    the short term, and hiring somebody who possesses those skills is expensive. Thus,
    you should be extremely cautious when you create a new filesystem. Check, double-check,
    and triple-check your command before you press the Enter key.


    # Procedure


    This task involves three sub-tasks. First, you must decide what filesystem to
    use. Different filesystems have different strengths and weaknesses, so you should
    spend some time learning about their differences. Second, you must create a data
    filesystem. Third, you must prepare your swap partition for use. These final two
    parts of the task take very little time to actually execute.


    # Deciding What Filesystem to Use


    Filesystems consist of data structures along with rules for how to access them,
    including details such as what characters are legal in filenames, how long filenames
    may be, and what sort of ancillary information (creation dates, permissions, and
    so on) are stored with files. Some of the data structures, and the algorithms
    that interact with them, influence a filesystem’s speed and reliability. For these
    reasons, selecting the correct filesystem for the job is an important decision
    for any computer.


    Over the past few years, Linux has seen the transition to journaling filesystems
    from older non-journaling filesystems. A journaling filesystem records a journal
    of disk activity before data structures are changed. The idea is that, in the
    event of a power failure or system crash, the journal will hold information on
    all the disk’s data structures that could possibly be in need of repair. The journal
    therefore speeds up recovery after power failures or system crashes—with a non-journaling
    filesystem, the disk check utility (fsck in Linux) must check all the filesystem’s
    data structures, which can be quite time-consuming on large disks. For this reason,
    use of a journaling filesystem is advisable in Linux, particularly for large disks.
    The journal consumes disk space, though, and with some journaling filesystems,
    the disk space requirements can be significant on small media. Thus, you might
    want to use a non-journaling filesystem for small removable media such as floppies
    and Zip disks, and even for some small disk partitions, such as /boot, if it’s
    a separate partition.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Linux native filesystems (that is, those that Linux can use for its root filesystem
    and other critical directories, such as /usr) all provide more or less the same
    set of features in terms of filenames, permissions, and so on. Thus, non-administrative
    users may not know or care what filesystem you use so long as it works. The different
    Linux filesystems do offer different performance features and advanced options,
    though:


    **Ext2fs**  The *Second Extended File System* (*ext2fs* or *ext2*) is the traditional
    Linux native filesystem. It was created for Linux and was the dominant Linux filesystem
    throughout the late 1990s. Ext2fs has a reputation as a reliable non-journaling
    filesystem. Ext2fs has since been eclipsed by journaling filesystems, but it still
    has its uses. In particular, ext2fs can be a good choice for a small /boot partition,
    if you choose to use one, and for small (sub-gigabyte) removable disks. On such
    small partitions, the size of the journal used by more advanced filesystems can
    be a real problem, so the non-journaling ext2fs is a better choice. The ext2 filesystem
    type code is *ext2*.


    **Ext3fs**  The *Third Extended File System* (*ext3fs* or *ext3*) is basically
    ext2fs with a journal added. The result is a filesystem that''s as reliable as
    ext2fs but that recovers from power outages and system crashes much more quickly.
    The ext3 filesystem type code is *ext3*.


    **ReiserFS**  This filesystem was designed from scratch as a journaling filesystem
    for Linux and is a popular choice in this role. It''s particularly good at handling
    partitions with large numbers of small files (say, smaller than about 32KB) because
    ReiserFS uses various tricks to squeeze the ends of files into each other''s unused
    spaces. This small savings can add up to a large percentage of file sizes when
    files are small. You can use *reiserfs* as the type code for this filesystem.


    **JFS**  IBM developed the *Journaled File System* (*JFS*) for its AIX OS and
    later re-implemented it on OS/2. The OS/2 version was subsequently donated to
    Linux. JFS is a technically sophisticated journaling filesystem that might be
    of particular interest if you''re familiar with AIX or OS/2 or want an advanced
    filesystem to use on a dual-boot system with one of these OSs. As you might expect,
    this filesystem''s type code is *jfs*.


    **XFS**  Silicon Graphics (*SGI*) created its *Extents File System* (*XFS*) for
    its IRIX OS and, like IBM, later donated the code to Linux. Like JFS, XFS is a
    very technically sophisticated filesystem. XFS has gained a reputation for robustness,
    speed, and flexibility on IRIX, but some of the XFS features that make it so flexible
    on IRIX aren''t supported very well under Linux. Use *xfs* as the type code for
    this filesystem.


    In practice, most administrators seem to choose ext3fs or ReiserFS as their primary
    filesystems; however, JFS and XFS also work well, and some administrators prefer
    them. Hard data on the merits and problems with each filesystem are difficult
    to come by, and even when they do exist, they''re suspect because filesystem performance
    interacts with so many other factors. For instance, as just noted, ReiserFS can
    cram more small files into a small space than can other filesystems, but this
    advantage is not very important if you''ll be storing mostly larger files.


    > If you''re using a non-x86 platform, be sure to check filesystem development
    on that platform. A filesystem might be speedy and reliable on one CPU but sluggish
    and unreliable on another.'
