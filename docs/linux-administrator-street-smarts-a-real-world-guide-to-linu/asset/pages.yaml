- pgno: 335
  md: '# Criteria for Completion


    To complete this task, you should have developed a plan for improving your local
    network’s security. You should identify and shut down unused servers, implement
    server-specific access control rules, examine *xinetd* or TCP Wrappers access
    control options, and implement iptables firewall control rules on both individual
    systems and on your Linux router (if your network uses one). For a small network,
    this task can take just an hour or two, particularly if you implement only modest
    improvements. For a large network, or if you intend to perform an extensive security
    audit, this task can take many hours to complete.


    # Task 7.2: Enable User-Level Security Restrictions


    Computers exist to help their users; however, sometimes users can become a problem.
    This can happen because a user is a “bad apple” or because a user does undesirable
    things through ignorance or sloppiness. For all of these reasons, Linux provides
    tools to limit the amount of damage that a user can do.


    # Scenario


    A multi-user Linux system has been experiencing problems every few days because
    of user processes that consume too much disk space, CPU time, or memory. To head
    off such problems in the future, you want to configure Linux to place limits on
    the amount of each of these resources that an individual user can consume.


    # Scope of Task


    This task involves making changes to two main Linux subsystems: limiting CPU time
    and memory using Pluggable Authentication Modules (PAM) and limiting disk use
    via the Linux disk quota system. Each of these tools requires its own configuration,
    so you’ll be working with both systems.


    # Duration


    This task should take about 1 to 2 hours to complete. Once you’ve finished the
    task, you should be able to tweak the configurations in much less time.


    # Setup


    You must have *root* access to a Linux workstation to perform this task. The disk
    quota restrictions require kernel support. As of the 2.6.\$x$ kernels, the ext2fs,
    ext3fs, and ReiserFS filesystems support quotas, but you must explicitly enable
    support via the Quota Support kernel option in'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'the filesystem area when recompiling your kernel. Many distributions ship with
    this support pre- compiled, so recompiling your kernel may not be necessary, but
    you should be aware of this option if you do recompile your kernel.


    # Caveats


    The usual root cautions apply to this task. In addition, setting limits that are
    too restrictive can cause problems for users: They may be unable to create files
    or their processes may be unceremoniously terminated if they exceed the CPU time
    and memory limits.


    # Procedure


    Disk quotas are more difficult to set than CPU time and memory limits. To enable
    disk quotas, you must both configure various tools (including, perhaps, recompiling
    your kernel) and enable quota support for various users. CPU time and memory limits,
    by contrast, are set by PAM options.


    # Enabling Quota Support


    Quotas require support in both the kernel for the filesystem being used and various
    user-space utilities. If your kernel lacks quota support, consult Phase 2 for
    information on recompiling your kernel.


    Two general quota support systems are available for Linux. The first was used
    through the 2.4.x kernels and is referred to as the quota v1 support. The second
    was added with the 2.6.x kernel series and is referred to as the quota v2 system.
    This description applies to the latter sys- tem, but the former works in a similar
    way.


    Outside of the kernel, you need support tools to use quotas. For the quota v2
    system, this package is usually called **quota**, and it installs a number of
    utilities, configuration files, SysV startup scripts, and so on.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_336_0.png)


    > You can install the support software from source code, if you like; however,
    this job is handled most easily using a package from your distribution. This description
    assumes that you install the software in this way. If you don''t, you may need
    to create SysV or local startup scripts to initialize the quota support when you
    boot your computer. The *Quota Mini-HOWTO*, at `http:// en.tldp.org/HOWTO/Quota.html`,
    provides details of how to do this.


    You must modify your /etc/fstab entries for any partitions on which you want to
    use the quota support. In particular, you must add the usrquota filesystem mount
    option to employ user quotas and the grpquota option to use group quotas. Entries
    that are so configured resemble the following:


    ```

    /dev/hdc5 /home ext3 usrquota,grpquota 1 1

    ```'
