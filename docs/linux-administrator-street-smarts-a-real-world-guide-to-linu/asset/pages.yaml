- pgno: 146
  md: '# # Scope of Task


    This task involves using the `dpkg` program to perform four types of operations:
    removing packages, upgrading packages, installing packages, and querying packages.
    A fifth sub-task, updating the system, involves using APT.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_146_0.png)


    > The Debian package system doesn''t provide an exact equivalent to the verify
    operation of the RPM system.


    # ## Duration


    This task will take about an hour to complete. Individual package operations can
    take anywhere from a few seconds to a few minutes to perform, so once you''re
    familiar with Debian package management, you can manage packages quite quickly.


    # ## Setup


    You must have a working Debian system to complete the task in precisely the way
    described. If you''re using another Debian-based distribution, you can still complete
    this task, but you must locate other packages to install, upgrade, and verify.
    These packages might be different versions of the ones described here or you might
    try working with entirely different packages. Package management requires superuser
    access, so you should log in as an ordinary user and acquire `root` privileges.


    # ## Caveats


    The usual caveats concerning working as `root` apply. In addition, package management
    runs the risk that you''ll render parts of your system inoperable. In particular,
    mistakenly removing software that you need is an obvious risk. Upgrading software
    can cause problems if the new software contains new bugs or if its operation has
    changed in ways that are detrimental. On rare occasions, packages fail to properly
    flag configuration files and so upgrading the package can wipe out your configuration
    files. If you upgrade packages that use configuration files, be sure to back them
    up first. These risks are all magnified when doing whole-system updates, simply
    because such updates may upgrade many different packages in a single operation.


    # ## Procedure


    This task involves exercising various features of the `dpkg` program, concluding
    with the network-enabled APT. The `dpkg` program takes an action (denoted by a
    single dash and a one-letter code or a double dash and a longer operation name),
    an arbitrary number of options (from zero upward) specified in a similar way,
    and a package name, a package file name, or an on-disk filename. Generally speaking,
    when you''re working with installed packages, you specify a package name, such
    as `zsh`. Package filenames are the names of the files in which uninstalled packages
    are stored. They can be anything, but are conventionally the package name'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'followed by version number and architecture information and the `.deb` filename
    extension, as in `zsh_4.3.2-13_powerpc.deb`. Sometimes you can use an on-disk
    filename, typically with the help of the `--file` (or `-f`) option. This can be
    handy if you want to discover what package owns a given file.


    # ## Deleting an Unused Package


    To delete a package, you use the `--remove`, `--purge`, `-r`, or `-P` action to
    `dpkg`, which takes a package name as an option:


    ```

    # dpkg -r vsftpd


    (Reading database ... 106705 files and directories currently installed.)


    Removing vsftpd ...

    Stopping FTP server: vsftpd.

    ```


    If the operation completes successfully, you''ll see messages similar to those
    shown in this example. The `--remove` and `-r` options remove the entire package
    *except* for configuration files, which are left intact; the `--purge` and `-P`
    options remove configuration files as well as all other package files. If you
    try to delete a package that''s not installed, `dpkg` will tell you so. Similarly,
    `dpkg` will complain if you try to delete a package that''s depended upon by other
    packages—for instance, if you try to delete a library package upon which program
    packages rely. If you see such a message, you have three choices:


    +   1. Abandon the attempt to delete the package.

    +   2. Delete the packages that depend upon the one you''re trying to delete.
    You can add their names to the command line to delete multiple packages at once.
    You''ll need to judge for yourself whether this action is reasonable.

    +   3. Use the `--force-depends` option to tell `dpkg` to ignore dependency problems.
    This option is not generally recommended because it can result in failures when
    you try to use the packages that depend upon the one you''re trying to remove.


    # ## Upgrading an Existing Package


    To upgrade a package, you must have a package file on your hard disk. You can
    find Debian packages at various mirror sites, and the Debian package database
    at [http://www.debian.org/distrib/packages](http://www.debian.org/distrib/packages)
    is a very useful resource for locating packages.


    To upgrade the `apt` package, you can download the latest version (`apt_0.6.44.2-powerpc.deb`
    at the time of this writing—note that this is a PowerPC package; make appropriate
    changes for your CPU architecture!) and install it directly from your hard disk:


    ```

    # dpkg -i apt_0.6.44.2-powerpc.deb


    (Reading database ... 106653 files and directories currently installed.)


    Preparing to replace apt 0.5.28.6 (using apt_0.6.44.2-powerpc.deb) ...

    Unpacking replacement apt ...

    Setting up apt (0.6.44.2) ...

    ```'
  merge: -1
