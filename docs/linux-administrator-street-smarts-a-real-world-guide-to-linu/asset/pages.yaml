    # # Task 1.4: Find Files


    A complete Linux system is likely to contain thousands of files. Although Linux
    uses a hierarchical directory structure designed to place files in particular
    locations depending upon their types, sometimes files get lost. You might know
    that a file is present but be unable to locate it because you''ve forgotten its
    location or because it''s been accidentally moved. In such cases, knowledge of
    Linux''s file-location commands can be invaluable.


    # ## Scenario


    Returning to the scenario from Task 1.1, suppose you didn''t find the whatis executable
    where you expected it, in /usr/bin. Your task now is to see if the file might
    be located somewhere else on the computer. To do this, you''ll use several Linux
    commands that are designed to help you find files.


    # ## Scope of Task


    This task covers three Linux commands for locating files: find, locate, and whereis.
    Each of these three commands has its own unique strengths and weaknesses, and
    you should learn the basics of all three of them.'
