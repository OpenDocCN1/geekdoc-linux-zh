    # Task 5.4: Manually Mount and Unmount Filesystems


    Preparing partitions and creating filesystems on them are *necessary* prerequisites
    to using a hard disk in Linux. To actually make the disk space available for use,
    though, you must take the final step: You must *mount* the filesystem—that is,
    associate it with a directory so that users can write files to the disk and read
    them back. You can perform this task manually on a one-time basis, as described
    in this task, or in a way that makes filesystems available whenever the computer
    boots, as described in the next task, “Use /etc/fstab.” You should also know how
    to undo a mount operation so that the disk is no longer accessible. This is most
    often done with removable media, but some system maintenance tasks require you
    to unmount partitions that are normally mounted.


    # Scenario


    Having created a new partition to store new users’ home directories in Task 5.2,
    and having created an ext3 filesystem on it in Task 5.3, you’re now ready to mount
    the partition. As specified in Task 5.2’s Scenario section, this new filesystem
    should be available as /home2. You'
