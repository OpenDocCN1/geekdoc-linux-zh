- pgno: 121
  md: 'fairly complex, but the font settings in the X configuration file have been
    falling in importance in recent years. Most X programs now use *Xft fonts*, which
    are configured via files in the `/etc/fonts/` directory.


    **ServerFlags** You can set miscellaneous server options in this section. Chances
    are you won''t need to adjust it unless you need to alter advanced or obscure
    options, such as the X server''s built-in power-saving options. (Most desktop
    environments provide other ways to set such options.)


    **Module** Modern X servers are modular, in the sense that they consist of a main
    program file (such as `/usr/X11R6/bin/Xorg`) and separate module files that contain
    drivers for specific video hardware, font-handling routines, and so on. The **Module**
    section tells X which of these modules to load. Chances are you won''t need to
    adjust this section.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_121_0.png)


    Most Linux drivers reside in the Linux kernel; however, X works with the video,
    mouse, and keyboard hardware at a low enough level that it provides its own drivers.


    **InputDevice** Most X configuration files contain at least two **InputDevice**
    sections: one for the mouse and one for the keyboard. You can adjust these sections
    to better match your hardware, and the upcoming section "Changing the Mouse Configuration"
    describes how to do this if you change your mouse.


    **Monitor** The **Monitor** section tells X about your monitor''s capabilities.
    This section is very important for proper X functioning, and the upcoming section
    "Changing the Monitor Configuration" describes how to adjust it.


    **Device** This section provides information on your video card, including the
    driver it''s to use and hardware-specific options. The upcoming section "Changing
    the Video Configuration" describes how to adjust it if you change your video card.


    **Screen** In order to work correctly, X needs to know how to combine the monitor
    and video card information set in the **Monitor** and **Device** sections. This
    is the job of the **Screen** section. You can also set options such as the display
    resolution in this section.


    **ServerLayout** XFree86 4.x and X.org-X11 use the **ServerLayout** section to
    combine all the other sections into a coherent whole. This enables you to define
    multiple mice, use several displays, and so on. Earlier versions of XFree86 lacked
    this section, the result being less flexibility; these older versions of X could
    only use a single display and mouse, for instance.


    For more information on all of these sections and the options you can set in them,
    consult the X configuration file man page—type **man XF86Config** if you use XFree86
    or **man xorg.conf** if you use X.org-X11.


    # Changing the Mouse Configuration


    Because you''ve replaced your mouse, you should first locate the **InputDevice**
    section that describes the old mouse. Chances are it begins with an **Identifier**
    line with a name such as'
