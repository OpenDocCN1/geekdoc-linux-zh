- pgno: 186
  md: '![](img/f430a19bdf014c43ad7c2d594afd5b21_186_0.png)


    Your ability to use, maintain, and improve a Linux computer is only as good as
    your knowledge of that computer. For this reason, you should take care to document
    the system’s operation.


    Part of this task involves keeping records yourself, such as information on major
    configuration options you’ve set. You should also keep data on the system’s baseline
    performance so that you can know whether, for instance, your hard disk speed has
    really dropped or whether it’s just your imagination. The computer maintains log
    files of its own, and knowing how to configure and use them is as important as
    creating and maintaining your own documentation. In addition to system-specific
    forms of documentation, more generic Linux documentation is available and can
    be helpful. This includes system documentation tools such as man and info pages,
    as well as online resources. Knowing how to use these tools will help you manage
    your Linux computer.


    **NOTE**: This task maps to portions of the CompTIA Linux+ objective 5 and to
    portions of the LPIC objectives 108 and 111.


    # # Task 4.1: Maintain a System Log Book


    A system log book is a physical paper book in which you record notes about your
    computer. You should begin the system log book when you first install Linux; that
    way, you can record the name and version number of the Linux distribution you
    install along with the installation options you select. As you maintain, upgrade,
    and otherwise modify the system, you can write about your changes in the log book.
    This will give you an invaluable record in case of problems or when you need a
    reminder about how something is configured.


    # ## Scenario


    To improve system documentation, you want to start a system log book for the Linux
    computer you’re managing. Ideally, you should do this when you install Linux on
    the computer, but if Linux is already pre-installed, you can still begin a log
    book, record what you know, and keep it updated as time goes on.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# ## Scope of Task


    Unlike most tasks in this book, this one is open-ended. The point of a log book
    is to record changes as they occur, so you''ll pull it out and add to it whenever
    you make important changes to your system.


    # ## Duration


    Starting a log book and recording the basic information you need for it will take
    about half an hour or an hour. Because this is an ongoing task, though, it''s
    never really completed. Every time you make a major change to your system, you
    should take a few seconds to record details in your log book.


    # ## Setup


    Obtain a suitable book for use as a log book. It can be a spiral-bound notebook,
    a lab book, a three-ring binder, a legal notepad, or whatever other type of book
    you find convenient. A three-ring binder has the advantage that you can insert
    printouts in it, but you can staple or otherwise attach printouts to other types
    of log books.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_187_0.png)


    A system log book should be recorded on a physical medium such as paper, not on
    a disk file. Part of the purpose of a log book is to aid in disaster recovery,
    when disk files will be inaccessible.


    Most of the information you record in your notebook requires **root** access to
    obtain, so when you begin the notebook, you should log in and acquire **root**
    access.


    # ## Caveats


    Writing on paper obviously poses no risks to your Linux installation, so maintaining
    a log book is a fairly low-risk endeavor. There are a couple of caveats, though.
    First, you should not record any extremely sensitive data in the log book, such
    as the **root** password or (if you use one) your Basic Input/Output System (BIOS)
    password. Second, if you type any extra commands as **root** to obtain information
    or printouts for the log book, the usual risks of running any command as **root**
    apply.


    # ## Procedure


    To perform this task, you must decide what sorts of entries belong in your log
    book. The key is to determine what sorts of information is likely to be useful
    as log book entries in the future. Remember that actually locating information
    in a log book will become important; you don''t want to record too much information
    or the important parts may become difficult to find.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Starting the Log Book


    You should begin the log book with basic identifying information on the computer—where
    it was bought, where it resides, what hardware it includes, and so on. You may
    be able to use some of the hardware identification commands described in Phase
    2, “Managing Hardware and the Kernel,” to fill in some of this information.


    You should also include basic software information, such as the Linux distribution
    you’ve installed, the kernel you’re running (including whether it’s a kernel delivered
    with the distribution or one you compiled yourself), and any important nonstandard
    software packages you’ve installed (such as commercial programs or programs developed
    in-house).


    One type of hardware and software information that may become vital is partition
    information. You may want to print the output of the partition tables for your
    hard disks, as revealed by fdisk -1 /dev/hda and similar commands for other disks,
    and include those printouts in the log book. Writing the mount points for these
    partitions next to their printout entries can be a handy addition. This information
    can become critical if your partition table is ever overwritten; if you’re lucky,
    you can re-create your existing partition tables based on the printouts.


    You may want to include notes about intended uses for the machine, perhaps including
    descriptions of particular files and directories. For instance, you might make
    a note of the fact that /var/htm1 contains the Web pages served by a Web server
    computer. Likewise, the fact that the computer uses Apache to serve these Web
    pages may be a useful addition. Such information may be very well known to you,
    but if somebody else needs to administer the computer, its presence in the log
    book could be useful.


    TIP Ask yourself if information you record might be helpful in recovering the
    system in an emergency situation. This could be an attempt to recover an existing
    system (such as restoring an accidentally wiped partition table) or an attempt
    to re-create the system from scratch (such as installing Linux from scratch on
    a new computer if the original was stolen). If information would be helpful, record
    it. If not, omit it.


    # Adding Log Book Entries


    As you administer the system, you should add log book entries. You don’t need
    to record every trivial thing you do, but you should record information that affects
    how the computer works in a basic way. For instance, you should probably mention
    alterations to configuration files, security-related software upgrades, and changes
    to the hardware installed in the computer.


    TIP Rather than record line-by-line changes to configuration files, back up your
    configuration files to a convenient medium, such as a Zip disk or CD-R. You should
    have no problem backing up the entire /etc directory tree to such media. You can
    store this configuration backup with your log book so that you can access it easily
    if the need arises.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# ### Using the Log Books


    System log books can be helpful in various situations. Some of these are emergency
    situations, but others involve more mundane and routine operations:


    **Disaster recovery** Most dramatically, if your system is damaged in some way,
    the log book can be invaluable for learning how it was configured before it was
    damaged. This can help you bring the system back to a working state by reproducing
    partition tables, directory layouts, installed software sets, major configuration
    options, and so on. Of course, proper backups (described in Phase 3) are even
    more important for disaster recovery, but sometimes log book data can enable you
    to recover more quickly than restoring a backup would require or can help you
    determine how to recover the backup (such as how large to make various partitions).


    **System checks** Log books can help you verify that your system is (or is not)
    working correctly. Recording benchmarks, such as those described in Task 4.2,
    “Monitor System Performance,” in a log book will enable you to spot when your
    system begins operating sluggishly. You can also verify that the correct packages
    are installed. Keeping backups of configuration files can help you spot accidental
    or malicious changes to those files.


    **System reproduction** Sometimes it’s desirable to reproduce a system without
    copying it file-by-file. For instance, you might want to give workstations to
    new employees and configure them in the way that existing workstations are configured.
    A system log book will help you in this task.


    **Personnel training** When new administrators are hired, system log books can
    help them become familiar with existing systems and administrative policies.


    # ### Criteria for Completion


    To complete this task, you should create a system log book for your Linux computer.
    Be sure it includes basic identifying information and major system options. Keeping
    a disk with the /etc directory tree on it with the log book is also helpful. In
    a real-world situation, the log book will never be complete; it will change as
    the system changes.


    # ## Task 4.2: Monitor System Performance


    “The computer is slow!” This complaint is a common one in offices and computer
    centers around the world. Frequently, users aren’t more specific than this, so
    it becomes your job to figure out precisely where the bottleneck exists—does the
    computer have too little RAM, are runaway processes sapping CPU speed, has the
    disk kicked itself into a low-performance mode, or is something else wrong? Keeping
    track of basic system benchmarks will help you quickly identify the cause of problems
    when they occur.


    # ### Scenario


    To help you identify problems in the future, you want to record baseline information
    on your system’s overall performance. You also want to set up a procedure to perform
    similar tests on'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'a regular basis so you can track system performance and, perhaps, spot trends
    that might lead to trouble down the road if left uncorrected.


    # ## Scope of Task


    This task involves running several benchmark programs and system information utilities
    and recording the results in your system log book. You’ll also need to set up
    a procedure to help you run these tasks on a regular basis in the future.


    # ### Duration


    This task should take about half an hour or an hour to complete. Ongoing performance
    testing will take a few minutes per test, but you can use `cron` to help automate
    this task.


    # ### Setup


    Some of the commands described in this task can be performed as an ordinary user,
    but others require `root` access. Thus, you should log in and acquire `root` privileges.
    You should have your system log book, which you prepared in Task 4.1, “Maintain
    a System Log Book,” ready. You may want to print some of these test results rather
    than copy them by hand, in which case having a working printer will be necessary.


    # ### Caveats


    The usual caveats about working as `root` apply to the commands that require this
    level of access. Performance tests, although useful, can sometimes be misleading,
    so you should be alert to results that seem weird—they might indicate a mistyped
    command or a failure of the utility to produce meaningful results.


    # ### Procedure


    To monitor your system performance, you should be prepared to run a number of
    different types of tests. Broadly speaking, system performance is determined by
    three types of hardware: your CPU, your memory (RAM), and your disks (particularly
    your hard disks). After you perform these tests, you should devise a system to
    help you perform new tests on a regular basis.


    # ## Testing Your CPU


    Two factors influence your CPU performance: the overall CPU speed and system load.
    The CPU’s speed is determined by its hardware design and, to a lesser extent,
    motherboard BIOS settings. Although it’s a poor CPU benchmark, the Linux kernel
    includes a test of CPU speed, which it calls BogoMIPS. You can find it by searching
    for that string in the `dmesg` output:


    ```

    ```

    $ dmesg | grep Bogo

    Calibrating delay using timer specific routine.. 4005.24 BogoMIPS (1pj=2002621)

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'If this command produces no results, the relevant line may have scrolled out
    of the kernel ring buffer. You may be able to find it in a log file, such as /var/log/dmesg,
    if it exists on your system.


    The BogoMIPS value isn''t very useful for comparisons from one system to another;
    it''s used mainly in some internal kernel timing loops. Nonetheless, it could
    clue you in if BIOS options related to CPU performance have been altered, so it''s
    worth looking for this information and recording it in your system log file.


    Task 3.5.1 in Phase 3 included a description of the system load average, which
    is a measure of how much of your available CPU time is being used by running programs.
    If your load average, as reported by uptime or top, climbs above 1, this means
    that programs are demanding more CPU time than your system can provide. Although
    a load average above 1 is not necessarily a sign of trouble (some systems are
    supposed to operate with load averages at or above this level), a change in the
    load average may be cause for concern. Thus, you should record a baseline load
    average for your system in your system log book-in fact, you should take several
    baseline readings. It''s not uncommon for the load average to vary substantially
    over the course of a day, a week, or even longer periods. (An academic system''s
    load average might spike near the end of the term, for instance.) Understanding
    these cycles will help you determine whether or not your system''s load average
    is out of line.


    For purposes of this task, set aside a page or two in your log book for load averages
    and record your current load average as the first entry. You will make additional
    recordings of this data in the future for comparison purposes.


    # ## Testing Your Memory


    Memory performance per se doesn''t really vary much unless your RAM goes bad,
    which tends to produce program crashes and other very serious problems. Testing
    memory therefore focuses on another factor: memory used. The free command displays
    overall memory use:


    ```

    $ free


    total used free shared buffers cached

    Mem: 512052 485200 26852 0 63388 92680

    -/+ buffers/cache: 329132 182920

    Swap: 1261560 225724 1035836

    ```


    This output shows the total memory, the amount of that total that''s been used,
    and the amount of the total that''s free. (For the moment, ignore the shared,
    buffers, and cached columns.)


    Each line of the output shows the values for a different type of memory. The first
    line, Mem, shows the RAM use. In this example, 485,200MB of 512,052MB are in use,
    leaving 25,852MB free. This may seem like a dire situation; however, these numbers
    include the amount of memory devoted to buffers and caches (that''s where the
    buffers and cached columns come in). Linux uses every last byte of memory it can
    for disk caches and buffers, which improves disk performance, so the free memory
    value of the free output is almost always a very low number. The -/+ buffers/cache
    line shows a more realistic view of the amount of memory that''s being used by
    programs: 329,132MB, leaving 182,920MB available.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'The final line of the free output, Swap, shows swap space use. This is disk
    space that’s treated like memory. When memory demands grow too large, swap space
    is used to hold currently inactive programs and data, freeing real RAM for active
    processes. Phase 5, “Managing Partitions and Filesystems,” describes creating
    and activating swap space. The problem with swap space is that it’s slow. When
    your system uses swap space, the whole computer can seem sluggish. To be sure,
    some swap space use is normal, and the 225,724MB of swap space use shown in the
    preceding example is not excessive. If your RAM is fully used and the amount of
    swap space in use on your system is very large, though, this may be a sign that
    you need to increase the RAM installed in the computer. Alternatively, you can
    take steps to reduce your RAM demands, such as shutting down running programs
    that you’re not actively using or switching from a memory-intensive desktop environment
    to a slimmer re bar window manager system. (Phase 2 describes some of these options.)


    Just as with CPU use, memory use can fluctuate over time. Thus, to truly evaluate
    memory use, you should monitor it over hours, days, weeks, or perhaps even longer
    periods. If you notice a spike in memory use, it could be a legitimate normal
    operation or a sign of something amiss.


    To track down the source of a sudden (or slow) increase in memory use, use top.
    Phase 3, “Managing Software,” described this utility, with an emphasis on its
    ability to track CPU use. By typing M once top is running, you can track the leading
    users of memory. If your system is running out of memory, you may find that some
    program is chewing up ridiculous amounts. Shutting down that program may solve
    the problem, at least temporarily.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_192_0.png)


    Some programs suffer from memory leaks, in which memory is allocated but never
    returned to the available memory pool. When this happens, the program’s memory
    demands grow continuously. A small memory leak in a program that’s started and
    stopped quickly may not be a serious problem, but a bigger memory leak or one
    in a program that’s run for long periods can lead to huge memory demands. Shutting
    down and restarting the program usually returns memory to the system, but the
    problem will recur. Notify a program’s developers if you think it’s got a memory
    leak that’s causing you serious problems.


    # Testing Your Disks


    Phase 2 described the hdparm utility, and in particular its -t and -T options.
    This utility, used with these options, tests basic disk input speed:


    ```

    # hdparm -tT /dev/sdb


    /dev/sdb:

    Timing cached reads: 2672 MB in 2.00 seconds = 1334.87 MB/sec

    Timing buffered disk reads: 144 MB in 3.02 seconds = 47.66 MB/sec

    ```'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'The **Timing cached reads** line reveals disk input from Linux’s own cache
    and so is more of a measure of RAM performance than disk performance. The **Timing
    buffered disk reads** line, though, is a reasonable low-level measure of disk
    performance.


    Disk performance, at least as measured by **hdparm**, is unlikely to change over
    time. It could change if you compile a new kernel and you use a different driver
    or driver options or if the new kernel’s driver includes changes that affect performance.
    Disk performance can also vary with configuration changes made with **hdparm**’s
    performance-tuning options, as described in Phase 2. Such changes could be incorporated
    in updated system startup scripts provided in a package update. Thus, you might
    want to record a baseline for disk performance and check your performance whenever
    you upgrade your kernel or key boot files. (Boot file changes will only show their
    effects after a reboot, though.)


    Another disk performance issue relates to disk capacity. The **df** command displays
    information on how much disk space is available in each of the computer’s mounted
    partitions:


    ```

    $ df

    Filesystem          1K-blocks    Used Available Use% Mounted on

    /dev/sdb6            977180  362972   614208  38% /

    udev                256024     188   255836   1% /dev

    /dev/mapper/usr      6291260 4814944  1476316  77% /usr

    /dev/mapper/var      2097084  163504  1933580   8% /var

    /dev/mapper/home     1782524  1168750  6137740  66% /home

    /dev/hda6            101089   35111   61803  37% /boot

    ```


    Pay particular attention to the **Use%** column of this output; this reveals how
    much of the space on a disk is in use, expressed as a percentage. As a general
    rule, if used disk space climbs above 80 percent, you should consider cleaning
    unnecessary files from that partition, increasing the size of the partition, or
    adding a new hard disk and moving some or all of that partition’s files to it.


    # Performing Ongoing Tests


    How you test your system’s performance over time depends on your own needs, abilities,
    and preferences. If the system isn’t a mission-critical computer, you might just
    perform manual tests every now and then, or perhaps only if you suspect problems.
    This approach might be reasonable for a Linux computer you run only as an **X**
    terminal, for instance.


    A more complex monitoring system might use **cron** to run a script that automatically
    calls some performance-testing commands. Listing 4.1 shows an example of such
    a script that you type this script into a file and run it, you’ll see that it
    simply prints the output of each command. To actually use the script in Listing
    4.1 for performance monitoring, you might create a **cron** job to run it at a
    regular time—perhaps every hour or two. You could email the output of the script
    to yourself or redirect it to a log file—say, /var/log/performance. If you do
    the latter, though, you should take care to delete it occasionally. In fact, you
    could create another **cron** job to do this task as well. The two **cron** jobs
    together might look something like Listing 4.2, which is for a user **cron** job,
    although it would have to be run as **root** to create a file in the /var/log
    directory. Listing 4.2'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'would run the monitoring script (called `/usr/local/bin/perftest`) every half
    hour, appending the results to `/var/log/performance`. On the first of each month
    at 3:20 AM, the second entry in Listing 4.2 renames this file to `/var/log/performance.old`,
    overwriting any existing file by that name. A more elegant approach would be to
    add the file to your system''s log rotation queue, which is usually handled by
    a program called logrotate, as described in Task 4.3.


    # **Listing 4.1:  A Script to Run a Series of System Health Tests**


    ```

    ```

    #!/bin/bash

    echo ""

    echo ''System performance test for `date`''

    echo ""


    echo ''CPU load test:''

    uptime

    echo ""


    echo ''Memory test:''

    free

    echo ""


    echo ''Disk space test:''

    df

    echo ""


    echo ''End of test''

    echo ''--------------------''

    ```

    ```


    # **Listing 4.2:  A cron Job to Run a System-Monitoring Script**


    ```

    ```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=steve


    30 * * * * /usr/local/bin/perftest >> /var/log/performance

    20 3 1 * * mv -f /var/log/performance /var/log/performance.old

    ```

    ```


    Listings 4.1 and 4.2 provide a fairly crude way to monitor your system''s performance.
    Gleaning specific information from the log file requires scrolling through it
    to search for the desired data. You can create more sophisticated scripts, if
    you like. Perhaps you could extract the data that interests you and summarize
    it in columns or even convert this summary to graphical form. Such a sophisticated
    tool can be convenient to use, but it will require considerably more work to design
    and implement. If you want to give it a try, you can start with Listing 4.1, but
    you'
  merge: -1
