    inherit the changed command prompt. Even this change, though, won''t affect new
    logins or new **xterm** windows; to make your change truly permanent, you must
    adjust configuration files, as described shortly in "Making Your Changes Permanent."


    # ### Setting a Program-Specific Environment Variable


    Many environment variables affect non-bash programs. One of these that you might
    want to adjust is `\$EDITOR`. Some Linux programs launch an external text editor
    for certain operations, and these programs often consult the `\$EDITOR` environment
    variable to determine what program to use. First, check what program your account
    is configured to use by default:


    ```

    ```bash

    $ echo $EDITOR

    /usr/bin/vi

    ```

    ```


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_66_0.png)


    > Although the `\$EDITOR` variable is frequently defined, it isn''t *guaranteed*
    to be. If a variable isn''t set, displaying it with **echo** will show an empty
    line as output.


