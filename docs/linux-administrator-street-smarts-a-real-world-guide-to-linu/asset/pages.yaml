- pgno: 138
  md: '![](img/f430a19bdf014c43ad7c2d594afd5b21_138_0.png)


    An OS is defined largely by its software. The software isn''t static, though;
    once you''ve installed a package, you may need to remove it, upgrade it, or replace
    it with something entirely dif-


    ferent. Package management software, such as the RPM Package Manager (RPM) and
    Debian package tools, help you to do this. In addition to understanding package
    management, to be truly "street smart" in the Linux world, you should know how
    to install software from source code. This will enable you to tweak the software
    in various ways and to install unusual soft- ware that''s not available in a binary
    package for your distribution. Being able to back up your installed software and
    user files will help you ensure that your system operates smoothly, with minimal
    downtime.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_138_1.png)


    > Task 3.1 covers RPM and Task 3.2 covers Debian packages. Ordinarily, a single
    computer runs just one of these two systems, not both, so if you have access to
    one computer running one Linux distribution, you''ll be able to perform only one
    of these tasks. A few Linux distributions, such as Slackware and Gentoo, use other
    package management tools, so neither of these tasks applies directly to them.


    Even once it''s installed, running software needs management—you may need to determine
    what''s running, terminate some running programs, and rein in others that are
    causing problems. On a bigger scale, you should know how to adjust Linux runlevels,
    which are sets of system software and servers that you can start or stop all at
    once. Finally, Linux relies heavily on cron and similar utilities, which enable
    you to schedule processes to run at particular times in the future. Doing so lets
    you schedule routine automated tasks, such as checking for available system software
    upgrades, at convenient times.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_138_2.png)


    > This phase maps to portions of the CompTIA Linux+ objectives 1, 2, and 3 and
    to portions of the LPIC objectives 102, 103, 106, and 111.


    # Task 3.1: Use RPM


    RPM is the most popular of the Linux package managers. It enables you to install,
    upgrade, uninstall, query, and verify the integrity of packages. RPM works on
    individual package files whose filenames end in .rpm. These files are compressed
    archive files, similar to compressed'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'tarballs or zip files, but they include additional data, such as information
    on dependencies— packages upon which the RPM file depends for normal operation.
    Managing software via RPMs requires using the rpm utility program, which provides
    commands for installing, remov- ing, and otherwise manipulating packages. Over
    the past few years, meta-packaging tools, such as the Yellow Dog Updater, Modified
    (Yum), have been developed. These tools provide a front-end to download and install
    or update multiple files from network repositories, which greatly simplifies the
    task of keeping a system up-to-date.


    # ## Scenario


    A Fedora Core 5 system you''re administering requires several package changes:


    +   * To minimize security risks, you plan to remove the vsftpd (FTP server) package,
    which isn''t needed on this computer.

    +   * You need to upgrade the yum package to the latest version, 2.6.1-0.fc5.

    +   * You want to install the Z Shell (zsh) package, which isn''t currently installed.

    +   * You''re not sure what the xpdf package does, so you want to query it.

    +   * You suspect corruption in the samba package and so want to verify its integrity.

    +   * You want to check for, and possibly install, system updates from an archive
    site.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_139_0.png)


    > In practice, your system is unlikely to be configured with precisely the installed
    packages specified in this list. Feel free to substitute other packages for those
    listed here as you follow along on your own system.


    # ## Scope of Task


    This task involves using the rpm program to perform five types of operation: removing
    pack- ages, upgrading packages, installing packages, querying packages, and verifying
    packages. A sixth sub-task, updating the system, involves using Yum.


    # ## Duration


    This task will take about an hour to complete. Individual package operations can
    take any- where from a few seconds to a few minutes to perform, so once you''re
    familiar with RPM, you can manage packages quite quickly.


    # ## Setup


    You must have a working Fedora Core 5 system to complete the task in precisely
    the way described. If you''re using another RPM-based distribution or another
    version of Fedora Core, you can still complete this task, but you must locate
    other packages to install, upgrade, and verify. These packages might be different
    versions of the ones described here or you might try'
  merge: -1
