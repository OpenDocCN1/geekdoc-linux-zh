- pgno: 333
  md: 'going traffic but allows only established or related incoming traffic. (This
    ability is provided by stateful inspection, hence the -m state and --state options.)
    This configuration effectively blocks the ability to run servers on unprivileged
    ports. Thus, an intruder or malicious authorized user won''t be able to log on
    to an unauthorized server that runs on such a port—at least not without root access
    to change the configuration.


    # SSH server traffic


    The final block of options enables access to the SSH server (TCP port 22). This
    access, though, is restricted to the 172.24.1.0/24 network (presumably the local
    network for the computer). This configuration uses stateful packet inspection
    to outgoing traffic from the SSH server for established and related data but not
    for new or invalid packets. Incoming packets to the server are permitted for new,
    existing, or related traffic, but not for invalid packets.


    A configuration such as the one in Listing 7.1 is suitable for a workstation that
    runs an SSH server for remote administration but that otherwise runs no servers.
    For a computer that runs many servers, you might need to add several additional
    blocks of rules similar to the SSH block, each one customized to a particular
    server.


    # Setting Up a Stand-Alone Firewall


    If your network includes a Linux router, such as the one configured in Phase 6,
    you can use iptables to set up firewall rules on the router system. The emphasis
    in such a configuration would be on the FORWARD chain rather than the INPUT and
    OUTPUT chains, although such a system would likely need to perform some INPUT
    and OUTPUT chain configuration to support its own administration and use. To protect
    your network using a firewall, you''d typically block outside access to servers
    that should only be accessible locally, such as your Samba server ports. You might
    also block certain types of outgoing connections. This configuration can be helpful
    in preventing abuses by local “bad apple” users or by worms or viruses that have
    infected your systems. For instance, you might block outgoing email (SMTP) connections
    except from your local mail server computer; this would prevent local workstations
    from becoming sources of spam if they''re compromised by spambots. Of course,
    you should also protect the firewall computer itself. The most radical way to
    do this is to drop all outside access attempts to the server itself. Listing 7.2
    shows a firewall script that implements these rules. This script makes heavier
    use of variables than does Listing 7.1; this type of configuration can make the
    script easier to change or use on multiple systems.


    # Listing 7.2: A Sample Firewall Script for a Router


    ```

    ```bash

    #!/bin/bash

    # Router firewall rules.


    # The local network interface

    LOCALNET=192.168.1.0/24


    # The interface that links to the Internet

    INTERNET=192.168.24.0/24

    ```

    ```'
