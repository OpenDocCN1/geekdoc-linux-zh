    # Adjusting the USB Hot-Plug Configuration


    Once you have the USB vendor and product ID codes, you can begin modifying the
    udev configuration to support these devices. Most distributions that use the 2.6.x
    kernel use udev, which dynamically creates entries in the /dev directory tree
    for your hardware. When udev works well, it’s pretty transparent; however, when
    it fails, it can require modifying some obscure configuration files. These files
    control the names, ownership, and permissions assigned to device files, among
    other things. Most distributions place these configuration files in the /etc/udev/rules.d
    directory. Packages can place udev rules files in this directory to ensure that
    the devices they use are given suitable device files. For instance, on a Fedora
    Core 5 system, the udev package installs default rules files, including 50-udev.rules,
    50-udev-early.rules, and 51-hotplug.rules. On the same distribution, the sane-backends
    package installs the 60-1ibsane.rules file, expanding the set of udev rules. Each
    udev rules file must have a name that ends in .rules. Most rules files have names
    that begin with a number; these numbers determine the order in which the rules
    are implemented. Before proceeding further, take some time to peruse the udev
    rules files. They may seem intimidating, but a general familiarity with their
    forms can be helpful. When creating new rules, you have two choices: modify an
    existing rules file or create a new rules file. The former option can be a bit
    simpler, but it runs the risk that your changes may be overwritten by package
    upgrades. Thus, you may want to create a new rules file. Listing 2.1 shows a sample
    file, which you might name 61-minolta.rules.


    # Listing 2.1: Sample udev Rules File


    ```

    ```SUBSYSTEM=="usb_device", ACTION=="add", GOTO="minolta_rules_end"


    # Minolta DiMAGE Scan Elite 5400

    SYSFS{idVendor}=="0686", SYSFS{idProduct}=="400e", SYMLINK+="scan-elite"```

    ```'
