    # # Task 6.10: Add a Printer Using CUPS


    Although you might not think of printing as being particularly network related
    unless you use a networked printer, in Linux the printing tools are all network
    enabled. Traditionally, Linux has used the Berkeley Standard Distribution (BSD)
    Line Printer Daemon (LPD) printing system or compatible tools, such as LPing.
    Since 2000, though, most Linux distributions have switched to the Common Unix
    Printing System (CUPS), which uses entirely different, but still network-enabled,
    protocols. This task steps you through the process of adding a printer to CUPS.
    The next task describes the tools you can use to print and manage your CUPS printer
    queue.


    > Unlike most Linux tools, CUPS is best administered through a GUI tool, which
    in the case of CUPS is a Web-based utility. Some distributions provide their own
    unique GUI printer configuration tools. You can use such distribution-specific
    tools if you like, but their details differ from those described here.'
