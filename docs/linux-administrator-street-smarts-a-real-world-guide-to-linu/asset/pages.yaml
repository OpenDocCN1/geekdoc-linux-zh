- pgno: 284
  md: '# Criteria for Completion


    To complete this task, you should have configured your super server to enable
    an FTP server. This task requires first identifying which super server your computer
    runs and then making appropriate changes to the `/etc/inetd.conf` file or to a
    file in the `/etc/xinetd.d` directory. You must then verify that the FTP server
