- pgno: 107
  md: 'Ideally, you should run this command two or three times to ensure that you''re
    getting consistent results. (Normal disk accesses by background processes can
    throw off the results of a disk benchmark.) This example shows a disk input speed
    of 39.60MB/s, with a cased (memory) read speed of 463.37MB/s. If you compare the
    numbers you obtain to the ones found on your hard disk manufacturer''s data sheet,
    you''ll probably be disappointed. Disk manufacturers generally advertise benchmark
    results taken under ideal circumstances, and it''s not unusual to get results
    showing half the speed the manufacturer claims. Also, manufacturers often advertise
    their drives'' *interface* speed, which will be better than the speed for reading
    data off the actual disk platters. *Be sure* to look up the disk''s *internal*
    data transfer rate; this will be the limiting factor for all but short data transfer
    bursts.


    As a general rule, modern hard disks are likely to achieve speeds of at least
    30MB/s, and quite possibly well above that level. A speed of 16MB/s or less, at
    least with a new disk, indicates that the disk is seriously misconfigured.


    # ### Tweaking Disk Performance


    If you find that your disk performance is truly sub-par, you may want to attempt
    to improve it. Linux''s ATA drivers provide the ability to tune disk performance
    in software, but this option doesn''t exist for SCSI drivers. Thus, if you have
    SCSI devices and find that performance is sub-par, you may need to look at your
    SCSI cabling, SCSI termination, and other issues.


    ![](img/f430a19bdf014c43ad7c2d594afd5b21_107_0.png)


    To tune an ATA disk''s performance, you can use the **hdparm** utility, but you
    use the -X *mode* option to set the Direct Memory Access (DMA) transfer mode.
    Table 2.3 summarizes ATA disk DMA transfer modes and hardware. You can specify
    modes in several ways, the most mnemonic of which are **sdma*x*** for simple DMA
    level *x*, **mdma*x*** for multiword DMA level *x*, and **udma*x*** for UltraDMA
    level *x*.


    **Table 2.3**  ATA Hardware Types


    | Official Name | Unofficial Names | Maximum Speed | Added DMA Modes | Cable Type
    |

    | :------------- | :--------------- | :------------ | :-------------- | :---------
    |

    | ATA-1           | IDE             | 11.1MB/s      | 0, 1, 2, Multiword 0 | 40-wire  |

    | ATA-2           | EIDE            | 16.6MB/s      | Multiword 1, Multiword 2
    | 40-wire  |

    | ATA-3           |                 | 16.6MB/s      |                 | 40-wire  |'
