    \n### 调度原则\n\n线程调度原则首先适用于采用 1:1 方案实现的多线程系统（此处只调度内核线程），也适用于实现进程模块的系统。在后一种情况下，可以用“进程”一词代替“线程”一词，并且调度所需的信息可以存储在这些进程的结构中。对于用户线程数量与内核线程数量不匹配的多线程系统（1:M\
    \ 和 M:N 方案），使用更复杂的调度原则。它们需要两个调度器：一个用于内核级操作，另一个用于用户模式。\n\n### 调度的类型\n\n区分长期调度、中期调度和短期调度。\n\
    \n#### 长期调度\n\n长期调度意味着确定哪些程序应进入系统以执行负载。由于它不依赖于系统的当前状态，因此也称为静态调度。在批处理系统中，它扮演了重要角色，当时可以预知需要完成哪些进程，并且可以安排任务。在交互系统（例如，具有时间共享的系统）中，加载进程原则上由用户参与，不受调度控制；因此，它们通常使用简化的长期调度策略。系统允许创建进程和线程以达到某个最大限制，之后尝试创建新进程或线程将导致错误。这种策略还基于用户心理，用户在过载系统中感到不适时，可能会中断与系统的工作，这会导致负载降低。\n\
