    \ 使用间隔较长。那些大部分时间都在等待 I/O 的线程被称为*I/O 密集型*。这类线程对处理器的负载要小得多，它们对处理器使用间隔的平均长度较小。处理器的时钟速度越高，越多的线程可以被归类为第二类。\n\
