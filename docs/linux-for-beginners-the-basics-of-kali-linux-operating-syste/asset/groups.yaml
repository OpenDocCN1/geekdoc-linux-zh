    # Conclusion


    Thank you for making it through to the end of Linux For Beginners, let’s hope
    it was informative and able to provide you with all of the tools you need to achieve
    your goals whatever they may be.


    In Linux, unlike other operating systems, by default, the work with Linux is not
    done in a graphical way, but by entering commands manually. Linux has several
    programs that are responsible for interpreting the commands entered by the user
    and perform the appropriate actions in response. These programs called shell are
    the typical mode of communication on all UNIX systems including Linux. For many
    people having to enter the commands manually may seem intimidating and difficult,
    although as you must have seen in the book Linux commands are relatively simple
    and very powerful.


    Linux is also a multitasking and multi-user operating system and it is capable
    of running several programs (or tasks) simultaneously and host several users simultaneously.
    Therefore, all users of Linux must have a user account on the system that establishes
    its privileges. Linux organizes users into groups so that privileges can be established
    for a particular workgroup, for access to certain files or system services.


    Finally, there is another fundamental concept when installing and using Linux,
    which is a Super User or User root. This user is the system administrator and
    is created during installation. As an administrator, you can access and modify
    (as well as destroy) all system information, so try to avoid working as a root
    user as much as possible. We hope you learned all of this and a lot more is seen
    from this book.


    Finally, if you found this book useful in any way, a review on Amazon is always
    appreciated!'
