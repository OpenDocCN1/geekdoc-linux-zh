  mdcn: "\n# 创建进程与线程\n\n如果一个进程是通过 `fork()` 系统调用创建的，那么在该进程的地址空间分配之后（通常是主应用程序流），会自动创建一个线程（或流程）。你可以使用适当的系统调用从用户代码中创建线程。\n\
    \n许多操作系统都有特殊的线程来创建系统内核（内核代码也可以在线程中执行）。在创建线程时，系统必须遵循以下步骤：\n\n1.  创建反映 OS 中线程的数据结构。\n\
