    boundary registers*. For each process in two CPU registers store two values -
    the *base address* ( base ) and *limits* ( bounds ). Each access to a logical
    address is converted to a physical address by adding a logical address to the
    base address. If the received physical address does not fall within the range
    ( base, base + bounds ), consider that the address is incorrect and generate an
    error.'
