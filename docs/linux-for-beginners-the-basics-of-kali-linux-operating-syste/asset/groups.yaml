    # Interprocess


    So far, we have considered the interaction of flows of one process. The main feature
    of this interaction is the ease of technical implementation of data exchange between
    them - one process flow using one address space and therefore, can freely access
    the co-usage of variant data as if they were their own. Since there are no technical
    difficulties with the implementation of data exchange, the main problem that needs
    to be solved in this case is the synchronization of flows.


    On the other hand, each thread is executed within the address space of a process,
    so the task of organizing interaction between the flows of different processes
    is often a problem. The question itself about interprocess interaction ( interprocess
    communication or IPC ). For streams of different processes, the issues of synchronization
    are also relevant, but in most cases, they are not based on the concept of shared
    data (such default data for processes are missing). In addition, the challenge
    of securing exchange between protected address spaces is added. Approaches to
    its solution define different types of interprocess interaction.


