- raw:
  - '[PAGE 8]


    Every UNIX file system has a unique root or root origin represented by / . Under
    this directory you will find all the files that the operating system can access.
    These files are organized in different directories whose mission and name are
    standard for all Unix systems.


    +   - / : Root of the file system

    +   - / dev: Contains system files representing the devices that are physically
    installed in the computer

    +   - / etc: This directory is reserved for system configuration files


    In this directory, no binary files (programs) should appear. Under this, two other
    subdirectories should appear:


    +   - / etc / X11: X Window configuration files

    +   - / etc / skel: Basic configuration files that are copied to the user''s directory
    when one is created new

    +   - / lib: Contains the libraries needed to run programs that reside in / bin
    (not libraries of user programs)

    +   - / proc: Contains special files that either receive or send information to
    the system kernel (It recommends not modifying the contents of this directory
    and its files)

    +   - / sbin: Contains programs that are only accessible to the superuser or root

