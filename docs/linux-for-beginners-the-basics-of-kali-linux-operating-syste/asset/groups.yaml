    \ 密集型）\n\n### 调度机制与策略\n\n应区分调度*机制*和*策略*。调度机制包括上下文切换工具、线程同步工具等，而调度策略是决定何时切换上下文的工具。系统中负责策略的部分称为*调度器*，为此使用的算法称为*调度算法*。\n\
    \n对于调度策略有各种评估标准，其中一些适用于所有系统，另一些仅适用于批处理系统或交互系统。如今，最常用三个标准来评估目标达成情况。\n\n- **最小响应时间。**\
