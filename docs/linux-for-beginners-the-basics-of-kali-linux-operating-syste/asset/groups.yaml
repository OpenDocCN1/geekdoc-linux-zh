    \ attributes.\n- The new process probably can set a new stack (as a consequence,\
    \ call `clone()`, two processes can share a common memory segment, making stack\
    \ sharing unacceptable for general use).\n\nSupport for `clone()` means implementing\
    \ a 1:1 multithreading scheme. The primary entities in the system are processes,\
    \ not threads (in Linux, the entities managed by the kernel are called processes,\
    \ not kernel threads). The traditional multithreading implementation on Linux\
    \ determines that user threads are mapped to processes in the kernel. Therefore,\
    \ it is impractical to look at thread data structures in Linux separately - it\
    \ is displayed with the same `task_struct` structure as the process.\n\n## The\
    \ Disadvantages of Traditional Multitasking Support For Linux\n\nMultithreading\
    \ basics in the Linux kernel have not undergone fundamental changes since the\
    \ `clone()` system call. In the meantime, Linux has evolved from an experimental\
    \ system to an industry-wide system where enterprise-class heavy-duty applications\
    \ are implemented.\n\nThis use of the system has led to the implementation of\
    \ multi-threaded high reliability and scalability.\n\nIt became apparent that\
    \ the `clone()` system call implementation did not meet these requirements. We\
    \ had the full implementation of multithreaded processing facilities at the system\
    \ level in the kernel.\n\nThread control is part of the standard POSIX 1996 corresponding\
    \ API which was named POSIX Threads.\n\n## Linux Kernel Threads\n\nIn addition\
    \ to user processes and threads, Linux also supports a special kind of scheduled\
    \ objects that are already known as kernel threads. Such threads are scheduled\
    \ as normal processes and threads, each with its own id (pid). Differences of\
    \ kernel threads from processes and user threads are that:\n\n- The thread functions\
    \ for them are defined in the kernel code.\n- They run only in kernel mode.\n\
    - They have inaccessible areas of memory: memory allocated in user mode.\n\n##\
    \ The Thread Management Software Interface\n\n### Creating Threads\n\nTo add a\
    \ new thread to the current process, POSIX uses the `pthread_create()` function\
    \ with the following syntax:\n\n```c\n#include <pthread.h>\nint pthread_create(pthread_t\
    \ *th, pthread_attr_t *attr,\n                   void *(*thread_fun)(void *),\
    \ void *arg);\n```\n\nConsider the parameters of this function:\n\n- `th` is a\
    \ pointer to a predefined structure of type `pthread_t` which will then be passed\
    \ to other functions to work with threads; then call the API to handle the thread\
    \ (thread handle).\n- `attr` is a pointer to a structure with thread attributes\
    \ (you need to pass a null pointer to use the default attributes; some attributes\
    \ will be reviewed later).\n- `thread_fun` is a pointer to a thread function that\
    \ should be described as:\n\n```c\nvoid *mythread_fun(void *value)\n{\n    //\
    \ executing the thread code\n}\n```\n\n- `arg` - the data passed to the thread\
    \ function (there they will get a parameter value).\n\nAn example of creating\
    \ a POSIX thread:\n\n```c\n#include <pthread.h>\n// thread function\nvoid *thread_fun(void\
    \ *num)\n{\n    printf(\"thread number %d\\n\", (int)num);\n}\n// ....................\n\
    pthread_t th;\n// create the second thread\npthread_create(&th, NULL, thread_fun,\
    \ (void *)++thread_num);\n// there are two threads running in parallel\n```\n\n\
    The new thread begins to run in parallel with the thread that created it. For\
    \ example, if a thread was created inside the `main()` function, then two threads\
    \ would continue to execute: an original program executing the `main()` code and\
    \ a new one.\n\n### Completion of POSIX Threads\n\nTo end a thread, just go to\
    \ the end of its thread function `thread_fun()` or call `pthread_exit()` from\
    \ it:\n\n```c\n#include <pthread.h>\nvoid pthread_exit(void *retval);\n```\n\n\
    The `retval` parameter specifies the return code. Here is an example of ending\
    \ a thread:\n\n```c\nvoid *thread_fun(void *num)\n{\n    printf(\"thread number\
    \ %d\\n\", (int)num);\n    pthread_exit(0);\n}\n```\n\nThere are two different\
    \ situations for the application startup code:\n\n- Executing the `return` statement\
    \ or executing all statements by the end of `main()` completes the whole process\
    \ with all threads also completing their execution.\n- Executing the `pthread_exit()`\
    \ function inside the `main()` function completes only the initial thread; this\
    \ action does not affect other threads in the program - they will continue executing\
    \ until they are completed.\n\nCalling the `pthread_exit()` function is used only\
    \ to join threads because it does not release the thread resources - this is the\
    \ responsibility of the thread joiner.\n\n### Waiting For Completion Of Threads\n\
    \nTo await completion of threads, use the `pthread_join()` function. It has the\
    \ following syntax:\n\n```c\nint pthread_join(pthread_t thread, void **status);\n\
    ```\n\nThis function blocks the thread where it was called until the thread specified\
    \ by the handle completes its execution. If the `status` is not a null pointer,\
    \ it will point to the data returned by the thread after the call (argument to\
    \ `pthread_exit()`). If the thread is already complete by the time the `pthread_join()`\
    \ function is called, its information should be read immediately.\n"
