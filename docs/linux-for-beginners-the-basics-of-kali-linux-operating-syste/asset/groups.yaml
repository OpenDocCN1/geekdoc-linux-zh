    \ `clone()` 实现中，对进程标识符 (pid)、父进程 ID 以及一些其他重要属性没有特殊用法。\n- 新进程可能可以设置一个新的栈（结果是，调用\
    \ `clone()` 后，两个进程可以共享一个公共内存段，这使得栈共享对于通用用途来说是不可接受的）。\n\n对 `clone()` 的支持意味着实现了\
