    \n## 进程间交互的类型\n\n进程间交互的实现通过三种基本方法完成：*消息传递*、*内存分配*和*映射内存*。\n\n另一种 IPC 方法是考虑此前讨论过的信号技术。\n\
    \n## 映射内存\n\n在许多操作系统中，映射内存是其他类型的进程间交互和系统决策所基于的基本系统机制。当然，映射内存通常与文件系统接口结合使用，在这种情况下，我们谈论的是*映射到内存的文件*（内存映射文件）。\n\
    \n这项技术确保特殊的系统调用（通常是 `mmap()`）将进程地址空间的一部分唯一地映射到包含该部分的文件。此后，对该内存的写入操作会导致映射文件的内容发生变化，这立即对所有有权访问该文件的应用程序可见。其他应用程序也可以在其地址空间中映射同一个文件，并通过该文件进行通信。\n\
    \n## 结论\n\n- 同一交互进程中的流可以访问托管在该进程地址空间中的共享数据。任何流都可以随时修改这些数据，从而导致竞争状态，其结果取决于流的执行顺序。\n\
    - 流同步机制用于确保对共享数据的正确访问；其中最主要的是确保互斥访问，即在特定时间只有一个流可以访问此类数据。使用阻塞来实现互斥。\n- 可以使用各种同步原语来解决同步问题。最简单的原语包括信号量、互斥锁、条件变量、读写锁和屏障。\n\
