    \ init，因此 P 的 ppid 将为 1。\n\n与进程相关的是一组安全属性：\n\n- 实际用户和进程组标识符 (uid, gid) 对应于启动该程序的用户，使得生成的相应进程在该用户的上下文中出现在系统中。\n\
