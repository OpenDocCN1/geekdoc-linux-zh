    One of the trends of modern operating systems is that in privileged mode, a small
    proportion of kernel functions, which are a microkernel, are implemented. Other
    OS functions are performed by user-mode processes (server processes). Servers
    are responsible for supporting the file system for dealing with process memory.


    The micronucleus communicates between system components and performs a basic resource
    allocation. To execute a system call, the process (client process) accesses the
    microkernel. The microkernel sends a request to the server, the server performs
    the work and sends the response back. And the micronucleus forwards it to the
    client. Customers can not only be single users and other operating units.


    The advantages of a micro-core approach are:


    - The small size of microkernel which simplifies its development and debugging

