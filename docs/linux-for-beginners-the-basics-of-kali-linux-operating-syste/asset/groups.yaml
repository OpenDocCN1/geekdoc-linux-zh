    \ Linux 中单独查看线程数据结构是不切实际的——它与进程一样，使用相同的 `task_struct` 结构显示。\n\n## Linux 传统多任务支持的缺点\n\
    \n自 `clone()` 系统调用以来，Linux 内核中的多线程基础未发生根本性变化。在此期间，Linux 已经从实验系统演变为一个行业通用的系统，其中实现了企业级重型应用。\n\
    \n这种系统的使用导致了多线程高可靠性和可扩展性的实现。\n\n显然，`clone()` 系统调用的实现并不满足这些要求。我们在内核系统级别拥有完整的多线程处理设施实现。\n\
    \n线程控制是标准 POSIX 1996 相应 API 的一部分，该 API 被称为 POSIX 线程。\n\n## Linux 内核线程\n\n除了用户进程和线程，Linux\
    \ 还支持一种特殊类型的调度对象，即已知的内核线程。这些线程像普通进程和线程一样被调度，每个都有自己的 ID (pid)。内核线程与进程和用户线程的区别在于：\n\
    \n- 它们的线程功能在内核代码中定义。\n- 它们仅在内核模式下运行。\n- 它们拥有不可访问的内存区域：用户模式下分配的内存。\n\n## 线程管理软件的接口\n\
    \n### 创建线程\n\n为了向当前进程添加新线程，POSIX 使用 `pthread_create()` 函数，其语法如下：\n\n```c\n#include\
    \ <pthread.h>\nint pthread_create(pthread_t *th, pthread_attr_t *attr,\n     \
    \              void *(*thread_fun)(void *), void *arg);\n```\n\n考虑一下该函数的参数：\n\n\
    - `th` 是指向预定义结构体 `pthread_t` 类型的指针，然后传递给其他函数以处理线程；然后调用 API 来处理该线程（线程句柄）。\n- `attr`\
    \ 是指向包含线程属性结构的指针（要使用默认属性，需要传递空指针；某些属性稍后将被审查）。\n- `thread_fun` 是指向线程函数的指针，应描述为：\n\
    \n```c\nvoid *mythread_fun(void *value)\n{\n    // 执行线程代码\n}\n```\n\n- `arg` -\
    \ 传递给线程函数的数据（在那里它们将获得参数值）。\n\n创建 POSIX 线程的示例：\n\n```c\n#include <pthread.h>\n\
    // 线程函数\nvoid *thread_fun(void *num)\n{\n    printf(\"线程编号 %d\\n\", (int)num);\n\
    }\n// ....................\npthread_t th;\n// 创建第二个线程\npthread_create(&th, NULL,\
    \ thread_fun, (void *)++thread_num);\n// 有两个线程正在并行运行\n```\n\n新线程开始与创建它的线程并行运行。例如，如果在\
    \ `main()` 函数中创建了一个线程，则两个线程将继续执行：一个执行 `main()` 代码的原始程序，以及一个新线程。\n\n### POSIX 线程的完成\n\
    \n要结束一个线程，只需到达其线程函数 `thread_fun()` 的末尾，或者从中调用 `pthread_exit()`：\n\n```c\n#include\
    \ <pthread.h>\nvoid pthread_exit(void *retval);\n```\n\n`retval` 参数指定返回代码。这是一个结束线程的示例：\n\
    \n```c\nvoid *thread_fun(void *num)\n{\n    printf(\"线程编号 %d\\n\", (int)num);\n\
    \    pthread_exit(0);\n}\n```\n\n对于应用程序启动代码，有两种不同的情况：\n\n- 执行 `return` 语句或执行完\
    \ `main()` 中的所有语句会结束整个进程，所有线程也同时结束其执行。\n- 在 `main()` 函数内执行 `pthread_exit()` 函数仅结束初始线程；此操作不影响程序中的其他线程——它们将继续执行直到完成。\n\
    \n调用 `pthread_exit()` 函数仅用于连接线程，因为它不释放线程资源——这是线程连接者的责任。\n\n### 等待线程完成\n\n要等待线程完成，请使用\
    \ `pthread_join()` 函数。其语法如下：\n\n```c\nint pthread_join(pthread_t thread, void\
    \ **status);\n```\n\n此函数会阻塞调用它的线程，直到由句柄指定的线程完成其执行。如果 `status` 不是空指针，它将在调用后指向线程返回的数据（`pthread_exit()`\
    \ 的参数）。如果在调用 `pthread_join()` 函数时线程已经完成，应立即读取其信息。\n\n"
