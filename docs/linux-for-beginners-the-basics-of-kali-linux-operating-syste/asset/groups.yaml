    \ \\ ^ ~ \"* *; -? [] ! & ~ <>  \n+   \t* To use files with these characters or\
    \ spaces you must enter the name of the file between quotation marks\n+   * Numbers\
    \ can also be used if desired.\n+   * Uppercase and lowercase letters are considered\
