    ## 互斥锁\n\n互斥锁的概念在很大程度上与此前定义的阻塞概念相吻合（第 5.2 节）。被称为互斥锁（Mutexes）的同步原语能够阻止一段代码在多个流中同时执行。实际上，互斥锁是操作系统级阻塞的一种实现。顾名思义，互斥锁消除了互斥性（注：此处原文用词略有歧义，通常指实现互斥访问）。其主要任务是在代码已在某个线程中执行时，阻塞所有试图访问该代码的线程。互斥锁有两种状态：空闲和忙。初始状态为“空闲”，并支持两种可能的原子操作。\n\
