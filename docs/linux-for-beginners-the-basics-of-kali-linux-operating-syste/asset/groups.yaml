    virtual memory.


    ## Virtual File System

    - Provides a universal interface for interacting with various file systems and
    I/O devices.


    ## Device Drivers

    - Provide direct access to peripherals. They are accessed through the virtual
    file system interface.


    ## Network Interface

    - Provides access to the implementation of network protocols and network device
    drivers.


    ## Interoperability Subsystem

    - Offers mechanisms that allow different processes in the system to communicate
    with each other.


    Some of these subsystems are logical components of the system; they are loaded
    into memory with the core and remain there permanently. Components of other subsystems
    (such as device drivers) are implemented such that their code can be loaded on
    demand. To accomplish this, Linux supports the concept of kernel modules.


    ### Kernel Modules


    The Linux kernel makes it possible to load and unload individual sections of code
    on demand. These sections are called *kernel modules* and run in privileged mode.
    Kernel modules offer a number of advantages:


    - Code modules can be loaded into memory after the system is up, which simplifies
    debugging kernel components, especially drivers.

    - They have the ability to change a set of core components at runtime; modules
    that are currently not in use can be unloaded from memory.

    - Modules are an exception to the rule that code extending kernel functionality
    under the Linux license must be open source. This allows hardware manufacturers
    to develop drivers for Linux, even if they do not have access to the kernel source
    code.


    Linux module support has three components:


    - Module management tools make it possible to load modules into memory and facilitate
    communication between modules and the rest of the kernel.

    - Driver logging tools allow modules to report to another part of the kernel that
    a new driver has been initialized.

    - Conflict resolution tools allow device drivers to reserve hardware resources
    and protect them from being accidentally used by other drivers.


    A single module can register multiple drivers if required (for example, for two
    different access mechanisms). The modules can be loaded in advance—at system start-up
    (boot modules) or when a program triggers their functions. After loading, the
    module code resides in the same address space as the other kernel code. A module
    error is critical to the system.


    ## Features of System Libraries


    Linux system *libraries* are *dynamic libraries* that are only loaded into memory
    when needed. They perform a number of functions:


    - Implementation of system call wrappers.

    - Extension of system call functionality (such libraries include the C language
    I/O library, which implements functions such as `printf()` based on system calls).

    - Implementation of user-mode service functions (sorting, string processing, etc.).


    ## User Application


    Linux user applications use functions from system libraries and interact with
    the kernel through system calls.


    ## Installation


    Unlike what happens with Microsoft Windows, installing Linux is not a simple process
    since Linux allows the control and customization of a greater number of parameters
    and options. In spite of everything, developers are making great progress toward
    making the installation of Linux the least traumatic process possible, depending
    on the simplicity of the specific distribution used.


    Before proceeding to install Linux, it is necessary to take into account a number
    of fundamental aspects. The first is to read the information contained in the
    installation CD; this information can appear in two different ways: as regular
    HOW-TOs or in the form of manuals developed for the distribution.


    The general steps to follow for the installation of this operating system, in
    most of its distributions, are summarized in the following steps:


    ### Installation Process


    - **Language Choice**: The installation program gives us the possibility to configure
    our system in a large number of languages that exist.

    - **Acceptance of the License Agreement**: Acceptance of the license agreement
    with the company that owns the distribution.

    - **Configuration of Keyboard and Mouse**: Configuration of the type and model
    of our keyboard and mouse.

    - **Choice of Security Level**: There are four default security levels to choose
    from, depending on the use of the computer on which we are performing this installation,
    ranging from an internet client to a server with a large number of connections
    to support.


    ### Partitioning


    One of the main concepts to consider before installation is partitioning. Each
    operating system organizes the information of the files it contains differently,
    using its own file system. For reference, the file system names of different operating
    systems vary. This generally prevents multiple mixed operating systems from being
    installed on the same hard drive. To solve this problem, there are so-called partitions,
    with which a hard disk is divided so that it can contain different file systems.
    For all practical purposes, making a partition is equivalent to the hard drive
    being divided into two, although of course it is not divided in a physical but
    logical way.


    The fundamental problems when installing Linux come from the fact that in most
    cases the user wants to keep Windows and all programs for this system. There are
    currently several distributions that allow the installation of Linux on a Windows
    file system, either in what is called a disk image (a very large file), as with
    some older distributions, or directly in the Windows file system (e.g., WinLinux
    2000). However, to obtain good performance, it is preferable to install Linux
    on a partition different from that of Windows, using Linux''s own file system.
    It is usually necessary to perform a partition of the hard disk, since Windows,
    when installed, usually appropriates the entire size of the hard drive.


    Until recent times, this division meant the inevitable loss of all information
    contained on the hard disk. At present, during the installation of Linux distributions,
    it is allowed to divide the hard disk without losing information, in order to
    reduce the size of the Windows partition and create a new one during the installation
    of Linux. In the case of Red Hat or Mandrake, there is a possibility of automatic
    assignment, which will be useful if one does not know how to manipulate the partitions.


    For Linux, at least one root native partition must be created. It should be of
    the desired size, and a swapping partition must be created that is at least twice
    the size of the RAM of your equipment, up to a maximum of 512 MB. During this
    process, care must be taken not to erase the partition where Windows resides,
    since in that case ALL the information will be lost permanently.


    - **System Installation**: Selection of the various packages to be included with
    the Linux operating system and its subsequent installation.


    Some of these packages are:


    - Workstation

    - Server

    - Graphic environment

    - Office workstation

    - Web server / FTP

    - KDE station

    - Play Station

    - Mail

    - Gnome station

    - Multimedia station

    - Database server

    - Internet station

    - Firewall Server / Router

    - DNS / NIS

    - Scientific workstation

    - Console tools

    - Network server


    ### System Configuration


    - **Root Password**: The installation program asks you to enter a root or administrator
    password with which you will be able to have access to all the configuration areas
    of the system, which is not possible as a normal user.

    - **Creation of a User**: The installation program asks for a login and password
    for the creation of the first user, which does not have the necessary administrator
    permissions for security reasons.

    - **Boot Loader**: Another point to consider is how you want to boot Linux. If
    Windows exists, the easiest way is to install LILO or GRUB, programs that are
    responsible for booting both operating systems according to what the user indicates
    when starting the PC. It must be selected when setting the option of saving the
    boot loader in the first sector of the disk. Problems will arise to boot Linux
    if there is an option to reinstall Windows again, since this operating system
    assumes control of the PC and boot system, removing LILO (and preventing Linux
    boot). Another very simple way would be to use the boot floppy disk that is created
    during the installation of Linux.

    - **Installation Exit**: The user is informed of the installed services and the
    installation program is finished.


    Once Linux is first started, the initial wizard will start and allow you to configure
    basic system items, such as the type of desktop to use (KDE, Gnome, WindowMaker,
    etc.) and some services like mail.


    ## Conclusions


    - The OS architecture defines a set of components, as well as how they interact
    with each other and with the environment.

    - The most important aspect for studying the architecture of the OS is the concept
    of the core of the system. The core feature of the kernel is that it runs in privileged
    mode.

    - The main types of OS architecture are monolithic and microkernel-based architecture.
    Monolithic architecture requires that the core functions of the system be concentrated
    in the kernel, its most important advantage being performance. In microkernel
    systems, in privileged mode...

