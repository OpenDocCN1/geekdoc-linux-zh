    \n流包含以下元素：\n\n- 处理器的状态（由其寄存器中的当前数据组成），包括处理器当前指令的计数器。\n- 流堆栈（内存区域，其中调用其代码中的局部流变量和函数返回地址）。\n\
    \n## 进程和流状态\n\n流允许以下状态：\n\n- *创建* (new) - 线程正在创建过程中。\n- 执行 (running) - 指令流处理器执行（在特定时间，在单个处理器上，只有一个线程可以处于此状态）。\n\
    - 等待 (waiting) - 等待某个事件流（如完成操作）；此状态也称为阻塞和终止流。\n- 就绪 (ready) - 流期望调度器在其拥有所有必要资源（除\
    \ CPU 时间外）时切换 CPU 到它。\n- 终止 (terminated) - 线程已完成执行（除非其资源已从系统中移除，否则它进入附加状态 - 僵尸状态）。\n\
    \n流在待机和就绪状态之间的转换基于任务调度或流调度。在调度线程时，确定哪些线程需要在完成 I/O 操作后恢复，如何组织系统期望。待机和执行状态之间的转换需要处理器时间调度。基于此类调度的算法，确定哪些已完成的线程需要在特定时间执行，何时需要中断线程的执行以切换到另一个就绪线程，等等。\n\
    \n对于实施进程模型的系统，通常谈论的是进程状态，而不是流状态，以及进程调度；实际上，在这种情况下，进程的状态明显对应于其单个流的状态。\n\n## 进程和流的描述\n\
    \n正如我们已知，操作系统的主要任务之一是分配资源给进程和流。这些资源主要是 CPU 时间（在调度期间在流之间分配）、I/O 和内存（在进程之间共享）。\n\
