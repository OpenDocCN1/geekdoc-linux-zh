    multithreading or implement a *flow model*. A process in such a system is called
    a *multithreaded process*


    In the future, the term “flow” is used to refer to the sequence of executing commands,
    except in situations where the implementation of the process model will be discussed.


    # # Process and Flow Components


    The elements of the process include:


    +   - Protected address space

    +   - Data common to the whole process (these data can be shared usage of all
    its streams)

    +   - Resource usage information (open files, network connections)

    +   - Process flow information


    The stream contains the following elements:


    +   - The state of the processor (a set of current data from its registers), including
    the counter of the current instruction of the processor

    +   - Flow stack (the memory area where the local flow variables and function
    return addresses are called in its code)


    # # Process And Flow States


    The following states are allowed for the stream:


    +   - *Creation* ( new ) - the thread is in the process of creation

    +   - Execution ( running ) - instruction stream processor performs (at a particular
    time on a single processor, only one thread can be in this state)'
