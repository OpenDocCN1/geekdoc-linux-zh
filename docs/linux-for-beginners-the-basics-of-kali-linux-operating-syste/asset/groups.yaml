    \ CPU usage (CPU bound)\n\n### Scheduling Mechanisms and Policy\n\nThe scheduling\
    \ *mechanism* and *policy* should be differentiated. Scheduling mechanisms include\
    \ context switching tools, thread synchronization tools, etc., and scheduling\
    \ policies are tools for determining when to switch contexts. The part of the\
    \ system that is responsible for policy is called the *scheduler* and the algorithm\
    \ used for this - *scheduling algorithm*.\n\nThere are various evaluation criteria\
    \ for scheduling policies, some of which apply to all systems, others to batch\
    \ systems or interactive systems only. Today, three criteria are most commonly\
    \ used to evaluate goal achievement.\n\n- **Minimum response time.** This is the\
    \ most important criterion for interactive systems. Response time refers to the\
    \ time between running a thread (or typing an interactive command) and getting\
    \ the first response. For modern systems, we have taken the time of 50-150 ms.\n\
    \n- **Maximum throughput.** This is the number of tasks that the system can perform\
    \ per unit of time (for example, per second). Such a criterion is appropriate\
    \ to apply in batch systems; in interactive systems, it can be used for background\
    \ tasks. To increase throughput, you must:\n    - Reduce wasted load time (for\
    \ example, the time it takes to switch context)\n    - Use resources more efficiently\
    \ (to ensure that neither the processor nor the I/O devices are idle)\n\n- The\
    \ third criterion is *fairness*, which means that the CPU time is allocated according\
    \ to its importance. Fairness provides such a distribution of processor time that\
    \ all threads advance in their execution, and none stagnate. Note that implementing\
    \ a fair scheduling policy does not always reduce the average response time. Sometimes\
    \ this requires making the system less fair.\n\n### Scheduling Principles\n\n\
    The principles of thread scheduling are applicable first of all to multithreaded\
    \ systems with 1:1 scheme implementation (only kernel threads are scheduled here),\
    \ as well as to systems with the implementation of process modules. In the latter\
    \ case, the term “process” can be used instead of the term “thread” and the information\
    \ necessary for scheduling can be stored in the structures of these processes.\
    \ More complex scheduling principles are used in multithreaded systems for which\
    \ the number of user threads does not match the number of kernel threads (Schemes\
    \ 1:M and M:N). They require two schedulers: one for kernel-level operation, the\
    \ other for user mode.\n\n### Types of Scheduling\n\nDistinguish between long-term\
    \ scheduling, medium-term scheduling, and short-term scheduling.\n\n#### Long-Term\
    \ Scheduling\n\nLong-term scheduling means determining which of the programs should\
    \ be in the system to perform the load. This scheduling is also called static\
    \ because it does not depend on the current state of the system. It played an\
    \ important role in batch systems when it was known in advance what processes\
    \ needed to be completed and the tasks could be scheduled. In interactive systems\
    \ (e.g., systems with time-sharing) loading processes is principally engaged by\
    \ users, and it is not subject to scheduling; so they usually use a simplified\
    \ long-term scheduling strategy. The system allows you to create processes and\
    \ threads to reach some maximum limit, and then further attempts to create a new\
    \ process or thread will cause an error. This strategy is also based on the psychology\
    \ of users, who, feeling uncomfortable in an overloaded system, can interrupt\
    \ work with it, which leads to reduced load.\n\n#### Medium-Term Scheduling\n\n\
    Medium-term scheduling controls the transition of suspended threads to the ready\
    \ state and back. In the control unit which is ready for execution, threads are\
    \ immediately organized in a structure called the queue of ready threads (or ready\
    \ queue).\n\nThe transition to a suspended state can be caused by the following\
    \ factors:\n\n- Waiting for an I/O operation\n- Waiting for the completion of\
    \ another thread (joining)\n- Blocking a thread because it needs to be synchronized\
    \ with other threads\n\nUsually, for the correct organization of this waiting,\
    \ in addition to the queue of ready threads, they implement an additional set\
    \ of queues. Each such queue is associated with a resource that may cause thread\
    \ waiting (e.g., an I/O device); these queues are called *scheduling queues* or\
    \ *waiting queues*. The mid-term scheduler manages all these queues by moving\
    \ threads between them and the queue of ready threads.\n\n#### Short-Term Scheduling\n\
    \nShort-term scheduling or *CPU scheduling* is the most important type of scheduling.\
