    \  else\n        sleep ();\n}\n```\n\n- **释放互斥锁**（`mutex_unlock`）：互斥锁变为空闲；如果有多个流在等待，则从中选择一个，该流开始执行，占用互斥锁并进入临界区。在大多数实现中，流的选择是随机的。只有所有者才能释放互斥锁。以下是该操作的伪代码：\n\
    \n```c\nmutex_unlock (mutex_t mutex)\n{\n    if (mutex.owner != this_thread)\n\
    \        return error;\n    mutex.state = free;\n    if (waiting_threads ())\n\
    \        wakeup (some_thread);\n}\n```\n\n某些实现提供了第三种操作：尝试获取互斥锁（`mutex_trylock`）：如果互斥锁空闲，则行为类似于\
    \ `mutex_lock`；如果忙，则立即返回错误并继续执行。以下是使用互斥锁实现临界区的最简单实现。\n\n```c\nmutex_t mutex;\n\
    mutex_lock (mutex);\n// 临界区\nmutex_unlock (mutex);\n```\n\n互斥锁与二元信号量的主要区别在于，互斥锁只能由其所有者释放，而信号量可以由任何有权访问它的流进行修改。\n\
    \n## 进程间通信\n\n到目前为止，我们讨论的是同一进程内流之间的交互。这种交互的主要特征是数据交换在技术实现上的便捷性——一个进程中的流使用同一个地址空间，因此可以像访问自己的数据一样自由访问共享变量数据。由于数据交换在实现上没有技术困难，在此情况下需要解决的主要问题就是流的同步。\n\
