    \n# 第 3 章：进程与流管理\n\n考虑操作系统的两个主要抽象，用于描述程序代码的执行——进程和流——以及它们在操作系统中的实现特性、它们可能驻留的状态，以及与它们交互的基本机制（创建、完成和终止等手段等）。\n\
    \n## 进程和流的基本概念\n\n### 现代操作系统中的进程和流\n\n在现代操作系统中，内核代码（属于其各个子系统）和用户程序代码同时执行。不同的操作各不相同：一些程序和子系统遵循处理器的指令。其他忙于\
    \ I/O，还有一些等待用户或其他应用的请求。为了简化系统中这些操作的管理，建议分配一组基本活动元素，并定义操作系统与这些元素交互的接口。\n\n*进程*是指操作系统的抽象，它结合了在特定时间点执行某个程序所需的一切。程序是存储在磁盘上的机器指令序列，如有必要，会被加载到内存中并执行。可以说，在运行时，程序代表一个进程。程序与进程之间的一一对应关系仅在特定时间点建立：一个进程在同一时间可以执行多个程序的代码，一个程序的代码可以同时执行多个进程。\n\
    \n成功的程序需要某些资源。它们包括：\n\n- 顺序执行程序代码所需的资源（主要是 CPU 时间）。\n- 允许存储确保执行程序代码的信息的资源（CPU\
