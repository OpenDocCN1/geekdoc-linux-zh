    +   Waiting (waiting ) - awaiting some event flow (such as completion operations);
    this state is also called with a blocked and terminated flow


    +   Readiness (ready ) - Stream expects scheduler switches CPU at him when it
    has all the necessay resources, in addition to CPU time


    +   Terminated ( terminated ) - the thread has completed execution (unless its
    resources have been removed from the system, it goes into an additional state
    - a zombie state)


    The transition of flows between standby and readiness states is based on task
    planning or flow planning. When scheduling threads, determine which threads need
    to be restored after completing the I/O operation, how to organize the system
    expectations. The transition between standby and execution states requires a processor
    time schedule. Based on the algorithms of such planning, determine which of the
    finished threads need to be executed at a specific time, when do you need to interrupt
    the execution of the thread to switch to another ready thread and so on.


    With regard to systems that implement the process model, it is customary to talk
    about the state of processes, not flows, and the planning of processes; in fact,
    the states of the process in this case clearly correspond to the states of its
    single flow.


