    allocate (for example, if there are three threads, and it is necessary for thread
    A to occupy 50% of the processor and threads B and C, 25% each, it is possible
    to give stream A two tickets and flows B and C one each).

    - To change priorities, selecting and adding tickets on the go.


    Although most of these tasks can be solved by lottery planning, only approximately,
    with some likelihood, in practice, they are quite satisfactory. The longer the
    system works, the closer the results will be to the theoretical values (by the
    law of large numbers). In fact, lottery planning takes advantage of the fact that
    all planning ideology is largely heuristic since one cannot accurately predict
    the nature of flow behavior in the system.


    ## Implementation Of Planning In Linux


    Consider two options for implementing Linux scheduling - the traditional one (which
    includes kernels up to 2.4 inclusive) and the new one included in the 2.6 kernels.

    The Linux kernel does not distinguish between processes and flows when planning,
    so for certainty, we will continue to discuss process planning. All processes
    in the system can be divided into three groups: real-time with FIFO scheduling,
    real-time with circular scheduling, normal.


    ## Real-Time Scheduling Of Kernel Processes


    Regarding real-time processes, it is enough to say that:


    - They will always have priority over normal processes when planning.

    - The FIFO scheduling process is performed until it itself gives in to the processor
    (for example, as a result of suspension or termination) or until it is superseded
    by a higher-priority real-time process.

    - The same applies to the circular scheduling process, except that it will be
    further displaced after the quantum of time is exhausted.


    ### Traditional Scheduling Algorithm


    Consider an algorithm for scheduling ordinary processes. At the core of the algorithm
    is the allocation of CPU time to the *epoch* (epochs). During the epoch, each
    process has a quantum of time, the length of which is calculated at the time of
    the epoch. For the most part, different processes have quanta of different lengths.
    When the process has exhausted its quantum, it is displaced and during the current
    era, it will no longer be performed. Management is given to another process. If,
    however, the process is paused for I/O or due to synchronization, its quantum
    is not considered exhausted and it may be exhausted by the scheduler during the
    current era. The era ends when all ready-to-complete processes have exhausted
    their quanta. In this case, the scheduling algorithm recalculates the quanta for
    all processes and begins a new era. The quantum, which is set at the beginning
    of the era, is called the *basic quantum of the processing time*. Its values can
    be dynamically modified by the *nice*() and *setpriority*() system calls. The
    descendant process always inherits the basic quantum of its ancestor.


    There are two types of process priority: fixed, for real-time processes that are
    set only during the process creation, and dynamic, for normal processes, which
    depend on the basic priority and the time remaining until the quantum is exhausted.

