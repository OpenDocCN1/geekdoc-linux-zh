    \ space$）。\n\n这些部分的划分也有其合理性，因为在同一个地址空间中可能存在多个顺序执行的指令序列，它们共享相同的数据。需要区分为指令序列和地址空间，这导致了流的概念。\n\
    \n线程（控制流）是指使用共享进程空间的一组顺序执行的处理器指令。由于同一时间可以有多个线程，操作系统的任务是组织处理器在它们之间切换并安排它们的执行。在多处理器系统中，单个线程的代码可以在独立的处理器上执行。\n\
    \n因此，$process\\ is$ 被称为一个或多个线程以及这些线程在其中执行的受保护地址空间的集合。\n\n进程地址空间的安全性是其最重要的特征。进程代码和数据不能被另一个进程直接读取或覆盖；从而保护自己免受严重\
    \ bug 和未经授权的访问尝试。\n\n自然，只有 $direct$ 访问是不可接受的（例如，使用简单的数据传输指令写入内存）；进程间的数据交换原则上是可能的，但为此目的，$special\\\
    \ means$，即所谓的 $interprocess\\ interaction$ 手段，应该被使用。这些工具比直接访问更复杂，运行速度更慢，但提供了对数据访问时意外错误的保护。\n\
    \n与进程不同，管理总内存的流，其流数据不针对其他流的访问进行安全保护，前提是所有流都在同一进程的地址空间中执行。这提供了额外的应用程序开发能力，但使编程复杂化。\n\
    \n受保护的进程地址空间建立了在单台机器上执行代码的抽象，而线程提供了在单个专用处理器上顺序执行指令的抽象。进程的地址空间并不总是对应于 RAM 地址。例如，它可能映射文件或\
    \ I/O 控制器的寄存器，因此向该空间中的特定地址写入要么写入文件，要么执行 I/O 操作。这种技术被称为 *内存映射 (memory mapping)*。\n\
    \n## 进程和流模型\n\n进程（安全地址空间）的最大数量以及它们执行的线程数在不同系统中可能有所不同。\n\n- 在单任务系统中，只有一个地址空间，其中在任意时刻只能执行一个流。\n\
    - 一些嵌入式系统也有一个地址空间（一个进程），但允许许多线程执行。在这种情况下，可以组织并行计算，但未实现数据保护。\n- 在类似传统 UNIX 版本的系统中，允许许多进程，但在进程地址空间内只执行一个线程。这是传统的单线程\
    \ *进程模型*。此模型中流的概念不适用，但使用术语“进程间切换”、“进程调度”、“进程指令序列”等（在此，术语进程指单个流）。\n- 大多数现代操作系统（如\
    \ Windows XP 系列、UNIX 的现代版本）可以在每个进程的地址空间中拥有许多进程。这些系统支持多线程或实现 *流模型*。此类系统中的进程被称为\
