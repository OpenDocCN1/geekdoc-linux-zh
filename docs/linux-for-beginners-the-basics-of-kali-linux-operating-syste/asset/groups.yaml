    \n# 目录\n\n- 引言\n- 第 1 章：基本操作系统概念\n- 第 2 章：操作系统架构\n- 第 3 章：进程与流程管理\n- 第 4 章：进程与流程规划\n\
    - 第 5 章：流程交互\n- 第 6 章：内存管理\n- 结论\n\n# 引言\n\n恭喜您选择*《初学者 Linux 指南》*，感谢您的支持！\n\n\
    市面上有很多关于此主题的书，再次感谢您选择这一本！我们已尽一切努力确保本书尽可能包含有用的信息，祝您阅读愉快！\n\n访问 Linux 系统有三种方式：\n\
    \n- 通过文本控制台。在这种方法中，用户直接连接到安装了 Linux 的计算机，然后通过非图形化系统访问它。\n- 通过图形会话管理器（X 窗口）。在这里，用户直接连接到安装了\
    \ Linux 的计算机，并通过图形化程序访问系统。\n- 使用 telnet 或安全 shell 从远程计算机访问。\n\n在以上任何情况下，都会出现以下内容（或多或少）：\n\
    \n- 登录：（输入用户名）\n- 密码：（输入密码，密码在屏幕上不可见）\n    - 出于安全原因，密码必须满足某些条件，例如：\n        -\
    \ 包含至少六个字符\n        - 包含至少一个数字或特殊字符以及两个字母字符\n        - 与登录名不同\n\n首次访问系统时，使用的密码将是系统管理员提供的密码。在\
    \ Linux 中，根据处于图形模式还是文本模式，结束工作会话的方法有几种。\n\n在文本模式下：\n\n1. 按 <ctrl> d 键\n2. 输入 exit\
    \ 命令。\n\n在图形模式下：\n\nX 窗口的输出取决于正在运行的窗口管理器，稍后将会解释。\n\n# Linux 文件系统结构\n\n## 文件：类型\n\
    \nLinux 文件系统的核心是文件，它不过是操作系统用于在物理设备（如硬盘、软盘、CD-ROM 或 DVD）上存储信息的结构。当然，文件可以包含您想要的任何类型信息，从\
    \ PNG 或 JPEG 格式的图片，到文本或 HTML 格式的网页。文件系统是允许 Linux 处理其所包含文件的结构。\n\n所有 Linux 文件都有一个名称，必须符合某些规则：\n\
    \n- 文件名长度在 1 到 255 个字符之间。\n- 您可以使用除斜杠 / 以外的任何字符，但不建议使用在 Linux 中具有特殊含义的字符，这些字符包括：=\
    \ \\ ^ ~ \" * ; - ? [ ] ! & ~ < >\n    - 要使用包含这些字符或空格的文件，必须将文件名放在引号之间。\n- 如有需要，也可以使用方法数字。\n\
    - 大写字母和小写字母被视为不同，因此 letter.txt 与 Letter.txt 或 letter.Txt 不同\n\n与 Windows 一样，可以使用特定的“类型”标准，通过在名称末尾使用一系列字符来标记不同类型的文件，以指示相关文件类型。因此，文本文件、HTML、PNG\
    \ 或 JPEG 图像分别具有 .txt、.htm（或 .html）、.png 和 .jpg（或 .jpeg）扩展名。\n\n尽管如此，Linux 只区分三种类型的文件：\n\
    \n- 文件或普通文件，即上述提到的文件。\n- 目录（或文件夹），是一种以结构化方式分组其他文件的特殊文件。\n- 特殊文件是 Linux 的基础，因为它们代表连接到计算机的设备，例如打印机。这样，在该文件中输入信息相当于向打印机发送信息。对于用户来说，这些设备的外观和使用方式与普通文件相同。\n\
    \n## 链接\n\n链接是一种普通文件类型，其目的是为指定文件创建新名称。一旦创建符号链接，它就可以像将文件内容复制到另一个文件一样访问链接到的文件，其优势在于实际上并未进行复制。当您希望一组人协同处理同一个文件时，符号链接特别有用，因为它们允许共享文件，同时集中修改。\n\
    \n例如，假设存在一个名为 balance.1999.txt 的文件，为其创建符号链接 balance.txt。对 balance.txt 的任何访问都会由系统解释为访问\
    \ balance.1999.txt 的内容。\n\n## 路径\n\n在任何现代操作系统中，文件结构都是层次化的，并依赖于目录。通常，文件系统结构类似于树形结构，每个节点由一个目录或文件夹组成，其中包含其他目录或文件。在\
    \ Windows 中，每个磁盘驱动器都被识别为作为其他文件根的基本文件夹。在 Linux 中，存在一个称为 / 的单一根节点，所有文件和目录都悬挂在该节点下，且该节点独立于连接到计算机的设备。\n\
    \n文件或目录的路径是访问特定文件时必须遍历的目录序列，由 / 分隔。\n\n路径有两种形式：\n\n- 绝对路径，显示文件的完整路径，/home/luis/Carta.txt\n\
    - 相对于特定目录的路径，例如，如果我们找不到 / home 目录，相对于文件 Letter.txt 的路径是 Luis / Letter.txt\n\n\
    为了使问题更加复杂，所有目录都包含两个特殊目录：\n\n- 当前目录，用点“.”表示\n- 父目录，用冒号“..”表示\n\n位于 /home 目录中，您可以通过\
    \ /home/luis/Carta.txt（绝对路径）或 /luis/Carta.txt（相对路径）访问 Carta.txt。在 Luis 目录下，可以是\
    \ ./Carta.txt 或简单地 Letter.txt。\n\nLinux 文件系统遵循所有 UNIX 约定，这意味着它具有确定的、兼容且与其余 UNIX\
    \ 系统同构的结构。与 Windows 或 MS-DOS 不同，任何 Unix 系统上的文件系统都不直接链接到硬件结构，也就是说，它不取决于给定计算机拥有\
    \ 1、2 还是 7 个硬盘来创建 c:\\、d:\\ 或 m:\\ 驱动器。\n\n"
