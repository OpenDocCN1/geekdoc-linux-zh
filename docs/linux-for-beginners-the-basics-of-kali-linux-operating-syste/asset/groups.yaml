    The protected alert process space sets the abstraction of code execution on a
    single machine, and the thread provides an abstraction of sequential command execution
    on a single dedicated processor. The address space of the process does not always
    correspond to RAM addresses. For example, it may display files or registers of
    the I / O controllers, so writing to a specific address in this space will either
    write to a file or perform an I / O operation. This technology is called the *reflection
    in memory ( memory mapping ).*


    # Process and Flow Models


    The maximum number of processes (secure address spaces) and the threads that they
    execute may vary across systems.


    +   In single-tasking systems, there is only one address space in which one stream
    can be executed at any one time


    +   Some embedded systems also have one address space (one process), but it allows
    many threads to execute. In this case, parallel computations can be organized,
    but data protection is not implemented


    +   In systems similar to traditional UNIX versions, many processes are allowed,
    but only one thread is executed within the process address space. This is a traditional
    single-threaded *process model*. The concepts of flow in this model do not apply
    but use the term "switching between processes", "process planning", "sequence
    of process commands" and the like (here by the term process, we mean a single
    flow)


    +   Most modern operating systems (such as the Windows XP line, modern versions
    of UNIX ) can have many processes in the address space of each process. These
    systems support'
