  md: '# # Chapter 4:

    ## Process and Flow Planning


    The ability to run streams in parallel depends on the number of processors available.
    If the processor is single, parallel execution is impossible in principle (only
    one thread can be executed at any one time). If the number of processors is N
    > 1, parallel execution can only be implemented for N threads (one thread per
    processor).


