    # ## System Calls Fork() Exec()


    In the first approach, the descendant''s address space is created as an exact
    copy of the ancestor''s address space. This operation is implemented by a system
    call, which is POSIX systems, which is called fork(). In this case, not only the
    address space is copied, but also the counter of the mainstream process commands,
    so after calling fork() the ancestors and descendants will follow the same instruction.
    The developer must determine which of the two processes should be managed. This
    can be done based on the differences between the fork() return codes for the ancestor
    and the descendant.


