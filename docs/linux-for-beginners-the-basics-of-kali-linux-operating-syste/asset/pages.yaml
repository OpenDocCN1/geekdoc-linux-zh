- pgno: 4
  md: '# Introduction


    Congratuations on choosing *Linux For Beginners* and thank you for doing so.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy it!


    There are three ways to access a Linux system:


    +   - Through a text console. In this method the user connects directly to the
    computer that has Linux installed and then they can access it through a non-graphical
    system

    +   - From a graphical session manager (X Window). Here the user connects directly
    to the computer that has Linux installed and accesses the system through a graphical
    program

    +   - From a remote computer using telnet or secure shell.


    In any of the previous situations, the following will appear (more or less):


    +   - Login: (Username is typed)

    +   - Password: (The password is typed, which is not visible on the screen)

    +     - For security reasons the password must meet certain conditions such as:

    +       - Contain at least six characters

    +       - Contain at least one numerical or special character and two alphabetic
    characters

    +       - Be different from the login name


    The first time the system is accessed, the password used will be the one provided
    by the administrator of the system. There are several'
  merge: -1
  img_proc: true
