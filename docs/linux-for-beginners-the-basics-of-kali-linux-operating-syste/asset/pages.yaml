- pgno: 100
  md: '# # Chapter 6:

    # Managing Memory


    Different types of memory are organized into a hierarchy. At the lower levels
    of such a hierarchy, there is a cheaper and slower memory of a larger volume,
    and as the hierarchy moves upwards the memory becomes more expensive and faster
    (and its volume becomes smaller). The cheapest and slowest storage device is the
    hard drive. It is also called secondary storage. Faster and more expensive memory
    is stored in the memory chips installed on the computer - a memory called the
    main memory. Faster storage facilities have different cache processors, and at
    least, these caches are more limited.

    Managing memory is a rather difficult task. The required memory characteristics
    are often not enough identified, and in order not to interfere with the work of
    the user, it is necessary to implement means of coordination of different types
    of memory. Thus, the current application cannot fit entirely in the main memory,
    while unused code can use tymch and COBOL stored on the hard drive. In this section,
    we look at technologies that use primary memory.


    # ## Fundamentals of Virtual Memory Technology


    We first consider the prerequisites for introducing the concept of virtual memory.
    In this situation, each process is loaded into its own continuous portion of physical
    memory, and the next process begins immediately after the previous one. If you
    analyze the memory allocation features of this approach, the following questions
    may arise.


    +   * How do I perform processes that require more physical memory than installed
    on my computer?

    +   * What happens when the process performs a write operation at the wrong address
    (eg P2- at 0x7500)?'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   - What should I do if a process (such as P1) needs more memory to execute?


    +   - When will the process receive information about the specific physical memory
    address, which memory will start executing it, and how should the memory addresses
    used in its code be converted?


    +   - What should I do if the process doesn''t need all the memory allocated to
    it?


    Direct loading of processes into physical memory does not provide an answer to
    these questions. Obviously, some memory translation tools are needed to allow
    processes to use address sets that are different from physical memory addresses.
    Before we understand the peculiarities of these addresses, let us briefly dwell
    on the peculiarities of composing and downloading applications.


    The program usually resides on disk as a binary executable file obtained after
    compilation and layout. It must be loaded into memory (process address space)
    for its execution. Modern architectures allow processes to be located anywhere
    in physical memory, and the same program can accommodate different processes loaded
    into different memory locations. It is unknown in advance which memory area the
    program will be loaded into.


    During execution, the process accesses different addresses, in particular, when
    a function is called, it uses its address (this is the code address), and the
    global variable accesses the memory address to store the value of that variable
    (this is the data address).


    The programmer does not normally use memory addresses directly in his program,
    instead, they use symbolic names (functions, global variables, etc.). Due to compilation
    and layout, these names are linked to moving addresses (such addresses are specified
    in relative units, such as "100 bytes from the beginning of the module"). When
    running the program, the relocated addresses, in turn, are bound to absolute addresses
    in memory. In fact, each bind is a mapping of one set of addresses to another.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '+   * Memory protection. Addressing errors that occur in a process code should
    only affect the execution of that process. When the P2 process does a write operation
    at 0x7500, it must be interrupted by an error. The memory security strategy is
    that a valid address range is stored for each process, and each memory access
    operation is checked for an address belonging to that range


    +   * Lack of binding to physical memory addresses. The process can be performed
    regardless of its memory location and physical memory size. The process address
    space is allocated as a large static address set, with each address of the set
    being moved. Processor and hardware should be able to convert these addresses
    to physical addresses of main memory (the same address placeable at different
    times or for different processes may correspond to different places including
    his address))


    # # The Concept Of Virtual Memory


    Virtual memory - a technology that introduces I level additional conversions between
    memory addresses used by the process and physical memory addresses used by the
    desktop app. Such transformations should ensure that the memory is protected and
    that the process is not bound to physical memory addresses.


    With virtual memory, the physical memory of the process address space can be fragmented,
    since the bulk of the memory occupied by the process remains free most of the
    time. There is a so-called ninety to ten rule or a localization rule that states
    that 90% of memory accesses in the process account for 10% of its address space.
    You can move the addresses so that only the sections of the process address space
    that are actually in use at that time correspond to the main memory.


    In this case, unused partitions of the address space can be mapped to slower memory,
    such as hard disk space, and at this time other processes can use the main memory,
    which previously displayed the'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'addresses of these partitions. When a partition is needed, its data is loaded
    from disk to main memory, perhaps instead of partitions that became unnecessary
    at a particular moment (and which, in turn, will now be stored on disk). Data
    can be read from disk at a village thus a key memory LDPE time addressing them.


    In this way, you can significantly increase the size of the process address space
    and ensure that processes larger than the main memory are executed.


    # Problems of virtual memory implementation: Memory fragmentation


    The main problem that occurs when using virtual memory is the efficiency of its
    implementation. Because address conversions need to be done every time memory
    is accessed, careless implementation of these conversions can have the worst effect
    on the performance of the entire system. If most memory accesses make the system
    actually have to access the disk (which is tens of thousands of times slower than
    the main memory), it will be virtually impossible to operate such a system. The
    issue of improving the performance of virtual memory implementation will be discussed.


    Another problem is the memory fragmentation that occurs when free memory cannot
    be used. There are internal and external memory fragmentations. The external is
    reduced to the fact that due to the allocation and subsequent freeing of memory,
    it creates free blocks of small size - holes. Because of this situation may arise
    in which it is impossible to provide a continuous memory block size N, because
    there is no contiguous free block of size S ≥ N, although in general, the amount
    of free memory space more than N. So in the above case, there is not enough space
    to execute the P5 process due to external fragmentation.


    Internal fragmentation is the result that, on request, memory blocks larger than
    actually used are allocated, resulting in unused areas inside the dedicated blocks
    that can no longer be allocated to something else.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Logical And Physical Memory Addressing


    The most important concept of the concept of virtual memory is addressing the
    logical and physical memory.


    Logical or Virtual Address - An address generated by a program running on some
    processor. Addresses that use the instructions of a particular processor are logical
    addresses. A set of logical addresses is called a logical address space.


    Physical Address - The address that the memory chip operates on. An application
    in modern computers never deals with physical addresses. A special MMU ( memory
    management unit ) is responsible for converting logical addresses into physical
    ones. The totality of all available physical addresses is called a physical address
    space. So, if your computer has a 128MB chipset, then that amount of memory is
    physically addressed. Usually, much more memory is logically addressed.


    The specifics of converting logical addresses into physical ones are determined
    by different approaches to managing memory, the study of which will be the topic
    of this section.


    # Approach Of Base And Boundary Registers


    When implementing virtual memory, it is necessary to protect memory, move processes
    in memory, and share memory across multiple processes.


    One of the easiest ways to meet these requirements is to approach the *base and
    boundary registers*. For each process in two CPU registers store two values -
    the *base address* ( base ) and *limits* ( bounds ). Each access to a logical
    address is converted to a physical address by adding a logical address to the
    base address. If the received physical address does not fall within the range
    ( base, base + bounds ), consider that the address is incorrect and generate an
    error.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'This approach is the simplest example of a dynamic movement of processes in
    memory. All the other approaches that will be discussed in this section are different
    options for developing this basic scheme. For example, the fact that each process
    has its own values of base and boundary registers when using this approach is
    the simplest implementation of the process address space concept, which is based
    on the fact that each process has its own memory mapping.


    To organize memory protection in this situation, it is necessary that the use
    of the user cannot change the value of the base and border registers. It is enough
    to make such changes available only in the preferred mode of the processor.


    The advantages of this approach include simplicity, modest hardware requirements
    (only two registers are required), and high efficiency. However, today it is practically
    not used because of a number of disadvantages, due primarily to the fact that
    the address space of the process is still mapped to one continuous block of physical
    memory: it is unclear how to dynamically expand the address space of the process;
    different processes cannot share memory; no code and data distribution.


    In this approach, only one pair of base address-limit values is allocated to the
    process. The natural evolution of this idea was the mapping of the process address
    space through several physical memory ranges, each of which sets its own pair
    of the base address and boundary values. That’s how the concept of memory segmentation
    came about.


    # # Memory Segmentation


    # ## Features Of Memory Segmentation


    Memory segmentation allows you to depict a logical address space as a set of independent
    variable-length blocks called segments. Each segment usually contains data for
    one purpose, for example, one may have a stack, the other, a program code, etc.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Each segment has a name and length (for ease of implementation, use names alongside
    names). The logical address consists of a segment number and an offset within
    the segment; the application program works with such segments. Compilers often
    create separate segments for different application data (code segment, the data
    segment, stack segment). When a program is loaded into memory, it creates a table
    of process segment descriptors, each element of which corresponds to one segment
    and consists of a base address, boundary value, and access rights.


    When forming an address, its segment portion points to the corresponding element
    of the process segment descriptor table. If the offset is greater than the limit
    setpoint (or if the process access rights do not match the segment set rights),
    then the hardware generates an error. When all is well, the sum of the base and
    offset in the case of pure segmentation will result in a physical address in the
    main memory. If a segment is uploaded to a disk, trying to access it causes it
    to be loaded from the disk into the main memory. As a result, each segment corresponds
    to a contiguous block of memory of the same length, located in an arbitrary location
    of physical memory or on a disk. Here are the benefits of memory segmentation.


    +   • There is an opportunity to organize several independent segments of memory
    for the process and use them to store data of different nature. However, the access
    rights to each such segment can be set differently

    +   • Individual segments can be shared by different processes, and their segment
    descriptor tables must contain the same elements that describe that segment

    +   • Physical memory corresponding to the process address space should not necessarily
    be continuous now. In fact, segmentation allows individual portions of the address
    space to be mapped, not to the main memory, but to the disk and reloaded as needed,
    ensuring that processes of any size are executed'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'This approach is not without its disadvantages.


    +   The need to introduce an additional layer of memory conversion causes a decrease
    in performance (this drawback is inherent in any full implementation of virtual
    memory). Appropriate hardware support is required for effective segmentation implementation


    +   Managing variable length memory blocks with the need to store them on a disk
    can be quite complicated


    +   The requirement that each segment corresponds to a contiguous block of the
    physical memory of the appropriate size causes external memory fragmentation.
    Internal fragmentation does not occur in this case because the segments have a
    variable length and you can always select a segment of the length required to
    execute the program


    Today, segmentation is used rather limited, primarily because of the fragmentation
    and complexity of implementing efficient memory and disk-sharing. Wider use of
    memory allocation got into blocks of fixed length - page memory organization that
    will be discussed.


    # # Segmentation Implementation In IA-32 Architecture


    In the IA-32 architecture, logical addresses in the program are formed using segmentation
    and look like a “shift selector”. The values of the selector are loaded into a
    special register of the processor (segment register) and used as an index in the
    table of descriptiors of the segment, which is in memory and is an analog of the
    table of segments, described earlier. Six segment registers are supported in IA-32
    architecture. This means that the executable code at the same time can address
    these six independent d cops.


    The selector contains a descriptor index in the table, bits of the local or global
    table indicator, and the required privilege level. For system set common global
    descriptor table'
  merge: -1
  img_proc: true
- pgno: 108
  md: '( Global Descriptor Table, GDT ), and for each task - *local descriptor table*
    ( Local Descriptor Table, LDT ).


    The descriptors in IA-32 are 64 bits long. They define the properties of software
    objects (for example, memory segments or descriptor tables). Handle contains the
    value *base* (*base* ), which corresponds to the address of the object (for example,
    the beginning segment); limit value (*limit* ); object type (segment, descriptor
    table, etc.); protection characteristics.


    Access to tables of descriptors is supported by hardware. If the security characteristics
    specified in the handle do not correspond to the privilege level specified by
    the selector, it will not be possible to access the memory using it. They provide
    memory protection.


    However, it has never been mentioned that a physical address is stored in the
    handle. The fact is that for the IA-32 architecture, due to the conversion of
    the logical address, they receive not another physical address, but another type
    of address, which is called a linear address.


    # ## Page Memory Organization


    The main technologies of virtual memory implementation other than segmentation
    owned *-page memory organization* ( paging ). Its main idea is the allocation
    of memory blocks of fixed length. These blocks are called *pages and so are we*.
    This technology is the most common approach to virtual memory implementation in
    modern operating systems.


    # ## Basic Principles Of Page Organization Of Memory


    In the case of page memory organization, a logical address is also called a linear
    or virtual address. Such addresses belong to one set (for example, a 32 bits non-negative
    number can be a linear address). Physical memory is divided into blocks of fixed
    length - *frames*, or page blocks ( frames ). Logical memory, in turn, divided
    into blocks of the same length - *page*. When the process starts, its pages are
    loaded into available physical memory frames from disk or'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'other media. The paging organization must have hardware support. Each address
    generated by the processor is divided into two parts: the page number and the
    page offset. The page number is used as an index in the page table.


    A page table is a data structure containing page-table entries ( PTE ), each of
    which contains information about the page number, the number of the corresponding
    physical memory frame (or directly it''s the base address) and access rights.
    The page number is used to find the item in the table. After finding it, the page
    frame is added to the base address of the corresponding frame, which determines
    the physical address.


    Page size is a power of 2, modern OS uses pages ranging from 2 to 8 KB. In custom
    addressing modes, you can work with larger pages. For each process, they create
    their own page table. When the process begins to run, the OS calculates its page
    size and the number of frames in physical memory. Each page is uploaded to a corresponding
    frame, after which its number is written to the process page table.


    The process of memory mapping is different from the actual physical memory state.
    At the logical level, all memory is represented by a continuous block and belongs
    only to this process, and physically it is spread over the address space of the
    memory chip, alternating with the memory of other processes. The process cannot
    access memory whose address is not specified in its page table (so memory protection
    is implemented).


    The operating system must have information about the current state of physical
    memory (frame occupancy, frame number, etc.). This information is usually stored
    in a frame table. Each element corresponds to the frame and contains all the information
    about it.


    # Comparative Analysis Of Page Organization Of Memory And Segmentation'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Page memory organization and segmentation have more in common than differences.
    The main difference between the two approaches is that all pages have a fixed
    length and segments have a variable length. Other basics (no requirement for continuity
    of physical memory, ability to unload memory blocks to disk, need to support conversion
    tables, etc.) are fundamentally different. Let''s take a look at the main benefits
    of page memory organization over page memory segmentation. They are determined
    primarily by the fact that all pages have the same length.


    +   The implementation of memory allocation and memory is simplified. All pages
    are equal in terms of process, so you can maintain a list of free pages and, if
