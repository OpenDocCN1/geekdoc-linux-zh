- pgno: 6
  md: 'As in Windows, a certain "type" criterion can be used to mark the different
    kinds of files using a series of characters at the end of the name that indicates
    the type of file in question. So, the text files, HTML, PNG or JPEG images have
    extensions .txt, .htm (or .html), .png and .jpg (or .jpeg) respektively.


    Despite this, Linux only distinguishes three types of files:


    +   * Files or ordinary files are those mentioned above


    +   * Directories (or folders), is a special file that groups other files in a
    structured way


    +   * Special files are the basis on which Linux sits since they represent the
    devices connected to a computer, such as a printer. In this way, enter information
    in that file is equivalent to sending information to the printer. For the user,
    these devices have the same appearance and use than ordinary files


    # Links


    Links are an ordinary file type that have the goal to create a new name for a
    determined file. Once the symbolic link is created, it allows access to the file
    that links in the same way as if we had copied the contents of it to another file,
    with the advantage that it has not really been copied. The symbolic links are
    especially useful when you want a group of people to work on the same file since
    they allow sharing the file but centralizing the modifications.


    As an example, you can assume the existence of a file called balance.1999.txt,
    to which a link is created symbolic balance.txt. Any access to balance.txt is
    translated by the system so that you access the balance content.1999.txt.


    # The Path'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'In any modern operating system, the file structure is hierarchical and depends
    on the directories. In general, the file system structure resembles a tree structure,
    each node being composed of a directory or folder, which contains other directories
    or files. In Windows, each disk drive is identified as a basic folder that serves
    as root to others. On Linux, there is a single root called / from which all files
    and directories hang, and that is independent of which devices are connected to
    the computer.


    The path or path of a file or directory is the sequence of directories that must
    be traversed to access a certain file separated by /.


    There are two forms of the path:


    +   ❖ The absolute path that shows the entire path to a file, /home/luis/Carta.txt


    +   ❖ The path relative to a certain directory, for example, if we cannot find
    the / home directory, the path relative to the file Letter.txt is Luis / Letter.txt


    +   ○ To complicate matters further, all directories contain two special directories:


    +   ❖ The current directory, represented by the point “.”


    +   ❖ The parent directory represented by a colon “..”


    Being in the directory/home you can access Carta.txt with /home/luis/Carta.txt
    (absolute path) or /luis/Carta.txt (relative path). In Luis as ./Carta.txt or
    simply Letter.txt.


    The Linux file system follows all UNIX conventions, which means it has a structure
    determined, compatible and homogeneous with the rest of UNIX systems. Unlike in
    Windows or MS-DOS the file system on any Unix system is not directly linked to
    the hardware structure, that is, it does not depend on whether a given computer
    has 1, 2 or 7 hard drives to create the c:\, d:\ or m:\ drives.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'Every UNIX file system has a unique root or root origin represented by / .
    Under this directory you will find all the files that the operating system can
    access. These files are organized in different directories whose mission and name
    are standard for all Unix systems.


    +   - / : Root of the file system

    +   - / dev: Contains system files representing the devices that are physically
    installed in the computer

    +   - / etc: This directory is reserved for system configuration files


    In this directory, no binary files (programs) should appear. Under this, two other
    subdirectories should appear:


    +   - / etc / X11: X Window configuration files

    +   - / etc / skel: Basic configuration files that are copied to the user''s directory
    when one is created new

    +   - / lib: Contains the libraries needed to run programs that reside in / bin
    (not libraries of user programs)

    +   - / proc: Contains special files that either receive or send information to
    the system kernel (It recommends not modifying the contents of this directory
    and its files)

    +   - / sbin: Contains programs that are only accessible to the superuser or root

    +   - / usr: This is one of the most important directories of the system since
    it contains the usage programs common to all users. Its structure is usually similar
    to the following:

    +   - / usr / X11R6: Contains the programs to run X Window

    +   - / usr / bin: General purpose programs, which includes the C / C ++ compiler

    +   - / usr / doc: General system documentation

    +   - / usr / etc: General configuration files

    +   - / usr / include: C / C ++ header files (.h)

    +   - / usr / info: GNU information files

    +   - / usr / lib: General libraries of the programs

    +   - / usr / man: Manuals accessible with the man command'
  merge: -1
  img_proc: true
- pgno: 9
  md: '+   ✢ /usr/sbin: System administration programs

    +   ✢ /usr/src: Source code of programs


    In addition to the previous ones, there are other directories that are usually
    located in the /usr directory, such as the folders of the programs that are installed
    in the system.


    +   ✢ /var: This directory contains temporary information about the programs (which
    does not imply that you can delete its content, in fact, it should not be done)'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Chapter 1:


    # Basic Operating System Concepts


    # The Concept Of The Operating System, Its Purpose, And Function


    # The Concept of An Operating System


    The main idea and start of our modern day operating systems was the need to create
    ISG including them in the use of computer systems (By *computer cybernetic system*,
    we mean a set of hardware and software). The computer cybernetic system initially
    developed for liability solutions and practical problems of users. Because it
    was difficult to do this with hardware alone, applications were created. These
    programs required general operations of hardware management, distribution of hardware
    from resources, and the like. These operations are grouped under a separate layer
    of software, which is known as the operating system.


    Further, the capabilities of operating systems went far beyond the basic set of
    operations required by applications, but the intermediate position of such systems
    between applications and hardware remained unchanged.


    # Purpose Of The Operating System


    Operating systems provide us with a score of cybernetic system, and secondly,
    efficiency and reliability of its work. The first function is characteristic of
    the OS as an extended machine, the second - the OS as a distributor of hardware
    resources.


    # Operating System As An Extended Machine


    Using the operating system, the application programmer (and through his programs
    and the user) should have the impression that they are working with an advanced
    machine. The hardware is not'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'well adapted for direct use in applications. For example, if you consider working
    with I / O devices at the command level of the respective controllers, you can
    see that the set of such commands is limited, and for many devices - primitive.
    The operating system hides such a hardware interface but instead offers the programmer
    an application programming interface that uses higher-level concepts (called abstractions).


    For example, when working with a disk, a typical abstraction is a file. It is
    easier to work with files than directly with a disk controller (no need to consider
    moving the drive heads, starting and stopping the motor, etc.), as a result, the
    programmer can focus on the essence of his application. The operating system is
    responsible for interacting with the disk controller.


    Abstraction highlighting makes it easy for OS and application code to change when
    migrating to new hardware. For example, if you install a new type of disk device
    on your computer (provided that it is supported by the OS), all its features will
    be taken into account at the OS level, and applications will continue to use the
    files as before. This characteristic of the system is called hardware independence.
    OS can be said to provide a hardware-independent environment for executing applications.


    # Operating System As A Resource Allocator


    The operating system must allocate resources efficiently. It acts as the manager
    of these resources and provides them to applications on demand. There are two
    main types of resource allocation. In the case of the *spatial distribution* of
    resource access will be for multiple customers simultaneously, and each one of
    them can use the resources (the shared memory). In the case of *temporal distribution,
    the system queues* and, according to it, allows them to use the entire resource
    for a limited time (so the processor is distributed in single-processor systems).


    When allocating resources, the OS resolves possible conflicts, prevents unauthorized
    access of programs to those resources, on'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'which they have no rights, ensures the efficient operation of the computer
    system.


    # Classification Of Modern Operating Systems


    Consider the classification of modern operating systems, depending on their scope.
    First of all, note the OS of *large* computers (mainframes). The main characteristic
    of the hardware for which they are designed is the performance of I / O: large
    computers provide a large number of peripherals (disks, printers, terminals, etc.).
    Such a computer cybernetic system is used for the reliable processing of large
    amounts of data. This OS should effectively support this process (in batch mode
    or time allocation). An example of an OS of this class would be IBM''s OS /390.


    The following category includes *server* operating systems. The main feature of
    such operating systems is the ability to serve a large number of user requests
    for shared resources. Network support plays an important role for them. There
    are specialized server Oses that exclude elements that are not related to the
    performance of their basic functions (for example, support for user applications).
    Universal servers ( UNIX or Windows XP systems ) are now more commonly used to
    implement servers.


    The most massive category is *personal* OS. Some operating systems in this category,
    developed with the expectation of the user (Windows 95/98 / Me) by Microsoft are
    simplified versions of the universal OS. Particular attention in the personal
    OS is given to the support of the graphical user interface and multimedia technologies.
    There is also a *real-time* OS. In such a system, each operation must be guaranteed
    to be performed within a specified time range. Real-time OS can control the flight
    of a spaceship, process or video demonstration. There are specialized real-time
    OSes such as QNX and VxWorks.


    Another category is *embedded* OS. These include managing applications for various
    microprocessor systems used in military'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'technology, consumer electronics systems, smart cards, and other devices. Such
    systems pose special requirements: placing a small amount of memory and support
    for specialized OS devices. Often, built-in OS is developed for a specific device;
    universal systems include embedded Linux and Windows CE.


    # ## Functional Components Of Operating Systems


    An operating system can be considered as a set of components, each of which is
    responsible for the implementation of a specific function of the system. Consider
    the most important features of the modern OS and the components that implement
    them.


    The way the system is built from components and their relationship is determined
    by the architecture of the operating system. Each operating system is going to
    be a bit different in the kind of work that it can handle, and its organizational
    structure, so learning this and how to put it all together can be important.


    # ## Process And Flow Management


    As we mentioned, one of the most important functions of OS is to execute applications.
    Code and application data is stored in the computer cybernetic system on disk
    in a special executable manner. After the user decides to run either OS to perform
    a file system creates the basic unit of a computer, called a process. You can
    specify the following: a process is a program that executes it.


    The operating system allocates resources between processes. These resources include
    CPU time, memory, devices, disk space as files. For the allocation of memory of
    each process, undertake its address space - set address memory, which allows you
    access. The process space is stored in the address space. The allocation of disk
    space for each process formed a list of open files similarly.


    The processes protect the resources they possess. For example, the process address
    space cannot be accessed directly from other processes (it is secure), and when
    working with files, a mode can be'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'specified that denies access to the file to all processes except the current
    one.


    The allocation of processor time between processes is necessary because the processor
    executes instructions one by one (ie, at a particular time, only one process can
    physically execute on it), and for the user, the processes should appear as sequences
    of instructions executed in parallel. To achieve this effect, the OS provides
    the processor with each process for a short time, after which it switches the
    processor to another process; in this case, the execution of the processes resume
    from the place where they were interrupted.


    In a *multiprocessor system*, processes can run in parallel on different processors.


    Modern operating systems in addition to processes can support multitasking, which
    provides in the process, the presence of several sequences of instructions (*threads*),
    which run in parallel to the user, like most processes in the OS. Unlike processes,
    threads do not provide resource protection (for example, they share the address
    space of their process).


    # ## Memory Management


    While executing the code, the processor takes instructions and data from the computer''s
    (main) memory. This memory is displayed as an array of bytes, each of which has
    an address.


    As mentioned, the main memory is a type of resource between processes. OS is responsible
    for the allocation of memory. The address space is protected during the process
    and released only after the execution process is completed. The amount of memory
    available to the process can vary in the course of the distribution of memory.


    OS must be capable of programs, individually or in the aggregate amount available
    for the main memory. To this end, virtual memory technology must be realized.
    This technology allows placing in the'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'main memory only those instructions and processes that are needed at the current
    time, while the contents of the rest of the address space are stored on disk.


    # # I / O Management


    The operating system is responsible for managing I / O devices connected to the
    computer''s memory. Support for such devices in the OS is usually performed at
    two levels. The first lower level includes *device drivers* - software modules
    that control devices of a particular type, taking into account all their features.
    The second level includes a *versatile I / O interface* convenient for use in
    applications.


    The OS should implement a common I / O driver interface through which they interact
    with other system components. This interface makes it easy to add drivers for
    new devices. Modern OSes provide a large selection of ready-made drivers for specific
    peripherals. The more devices the OS supports, the more chance it has of practical
    use.


    # # File Management And File Systems


    For OS users and programmers, disk space is provided as a set of *files* organized
    into a *file system*. A file is a set of files on a file system that can be accessed
    by name. The term "file system" can be used for two concepts: the principle of
    organizing data in the form of files and a specific set of data (usually the corresponding
    part of the disk) organized in accordance with this principle. As part of the
    OS, it can be implemented simultaneously supported and ICA several file systems.


    File systems are considered at the logical and physical levels. The logical level
    defines the external representation of the system as a collection of files (usually
    located in directories), as well as performing operations on files and directories
    (creation, deletion, etc.). The physical layer defines the principles of allocation
    of data structures of the file system on the drive.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# # Network Support


    # ## Network systems


    Modern operating systems are adapted to work on the network, they are called *network
    operating systems*. Networking support enables the OS to:


    +   - To make local resources (disk space, printers, etc.) publicly available
    over the network, ie to function as a server

    +   - Refer to other computer resources through a network that is functioning
    as a client


    Implementing the functionality of server and client based on *vehicles* responsible
    for the transmission of data between computers according to the rules specified
    network protocols.


    # ## Distributed systems


    Network OSes do not hide the presence of a network from the user. The network
    support in them does not determine the structure of the system and enriches it
    with additional capabilities. There are also *distributed* OSs that allow pooling
    the resources of several computers in a *distributed system*. It appears to the
    user as one computer with multiple processors working in parallel. Distributed
    and multiprocessor systems are two major categories of OS that use multiple processors.


    # ## Data security


    Data security in the OS means ensuring the reliability of the system (data protection
    against loss in case of failure) and protection of data against unauthorized access
    (accidental or intentional). To protect against unwarranted access, the OS should
    ensure the availability of *authentication* of users (such means allow to determine
    whether the users are actually who they say they are. This is usually used for'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'system passwords) and their *authorization* (to verify user rights which have
    been authenticated to perform a specific operation).


    # User Interface


    There are two types of user interaction means running: *shell* ( shell ) and *a
    graphical user interface* ( GUI ). The command interpreter enables users to interact
    with the OS using a special command language (online or through startup) to execute
    batch files. Commands of this language force the OS to perform certain actions
    (for example, run applications, work with files).


    The graphical user interface allows it to interact with the OS by opening windows
    and executing commands with menus or buttons. There are many approaches to implementing
    a GUI: for example, in Windows systems, its support systems are built into the
    system, and in UNIX, they are external to the system and rely on standard I /
    O controls.


    # Conclusions


    +   * An operating system is a level of software that lies between the levels
    of applications and computer hardware. Its main purpose - to make use of computer
    systems easier and improve efficiency


    +   * The main functional components of the OS include process management, memory
    management, I / O management, file management and file system support, network
    support, data protection, user interface implementation'
  merge: -1
  img_proc: true
- pgno: 18
  md: "# ## Chapter 2:  \n# Operating System Architecture\n\nAn operating system can\
    \ be considered as a set of components, each of which is responsible for certain\
    \ functions. The set of such components and the order of their interaction with\
    \ each other and with the external environment is determined by the *architecture\
    \ of the operating system*.\n\nConsider the basic concepts of operating system\
    \ architecture, approaches to them, features of OS interaction with the external\
    \ environment. Let’s consider the implementation of the architecture on the example\
    \ of Linux.\n\n# **Basic Concepts Of Operating System Architecture**\n\n# ###\
    \ System Kernel - Privileged Mode And User Mode\n\nThe basic components of the\
    \ OS, which are responsible for its most important functions, are usually in the\
    \ memory constantly and are executed in a privileged mode, called the *kernel\
    \ of the operating system*.\n\nCurrent approaches to the design of OS architecture\
    \ differently define the functionality of the kernel. The most important functions\
    \ of the OS, the teaching of which, of course, lay in the core include interrupt\
    \ processing, memory control, input-output control. The kernel’s reliability and\
    \ performance make it more demanding.\n\nThe core feature of the kernel is that\
    \ it runs in privileged mode. Consider the features of this model. To ensure efficient\
    \ resource management computer’s memory operating system should have certain privileges\
    \ regarding applications. It is necessary that applications do not operate the\
    \ OS, and simultaneous OS should be able to intervene in a program, such as CPU\
    \ or switching solution liabilities conflict in the struggle for resources."
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Realizing these benefits requires hardware support for processors. They must
    support at least two modes - *privileged* (protected mode kernel mode, kernel
    mode ) and *user mode* ( user mode ) in the invalid user commands that are critical
    to system operation (switching tasks to appeal to memory, given the limits access
    I / O devices, etc.).


    Consider how different CPU modes are used when interacting with the kernel and
    applications. After loading the kernel switches, the processor in privileged mode
    and gets complete control of a computer. Each application is started and executed
    in user mode, where it does not have access to kernel resources and other applications.
    When you need to perform an action implemented in the kernel, the application
    makes a *system call*. The kernel intercepts it, switches the processor to privileged
    mode, performs an action, switches the processor back to user mode and returns
    the result of the application.


    A system call is slower than a call to a user-implemented function because the
    processor switches between modes twice. For some OSes, some of the functionality
    is implemented in user mode, so you don''t need to use system calls to access
    it.


    # Implementation of Operating System Architecture


    Consider several approaches to implementing an operating system architecture.
    In real OS, they usually use some combination of these approaches.


    # Monolithic Systems


    The OSEs, in which all the basic functions are concentrated in the kernel, are
    called *monolithic systems*. In the implementation of a monolithic kernel, the
    OS becomes more productive (the processor does not switch between modes during
    the interaction between its components), but less reliable (all its code is executed
    in privileged mode, and the error in each of the components is critical).'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'A monolithic kernel does not mean that all of its components must reside in
    the memory. Modern operating systems allow placing code fragments (*kernel modules*)
    dynamically in the kernel address space. The implementation of kernel modules
    also makes it possible to achieve its extensibility (to add new functionality,
    it is enough to develop and load the appropriate module in memory).


    # ## Multilevel Systems


    Components of *multilevel* OS form a hierarchy of levels (layers), each of which
    relies on functions of the previous level. The lowest level interacts directly
    with the hardware, the highest level implements system calls.


    In traditional multilevel operating systems, transferring control from the top
    to the bottom is implemented as a system call. The top-level must have the right
    to execute this call and these rights are verified with the support of the hardware.
    An example of such a system is the Multics OS, developed in the ''60s. The practical
    application of this approach is limited today because of poor performance.


    Levels can also be isolated in a monolithic kernel; in this case, they are programmatically
    supported and cause system implementation to be disrupted. In the monolithic system,
    a kernel determines the levels:


    +      - *Abstraction means from equipment* that one interacts with the hardware
    directly, releasing other components of the system from such interaction

    +      - *Core kernels* that are responsible for the most basic, simplest kernel
    actions, such as writing a block of data to disk. By these means, upper-level
    instructions are executed with the management of resources

    +      - *Resource management tools* (or resource managers) that implement basic
    OS functions (process management, memory, input-output, etc.). At this level,
    the most important'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   resource management decisions are made that are made using the core kernel


    +   A system call interface that is used to communicate with system and application
    software


    # Micronucleus Systems


    One of the trends of modern operating systems is that in privileged mode, a small
    proportion of kernel functions, which are a microkernel, are implemented. Other
    OS functions are performed by user-mode processes (server processes). Servers
    are responsible for supporting the file system for dealing with process memory.


    The micronucleus communicates between system components and performs a basic resource
    allocation. To execute a system call, the process (client process) accesses the
    microkernel. The microkernel sends a request to the server, the server performs
    the work and sends the response back. And the micronucleus forwards it to the
    client. Customers can not only be single users and other operating units.


    The advantages of a micro-core approach are:


    +   The small size of microkernel which simplifies its development and debugging


