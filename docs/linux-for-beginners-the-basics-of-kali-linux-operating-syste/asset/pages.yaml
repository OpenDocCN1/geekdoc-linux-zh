  md: '# # Chapter 5:

    ## Flow Interaction


    Let''s consider the basic principles of interaction of flows of one process. The
    focus will be on synchronizing access to the shared data of such streams.


    # ## Basic Principles Of Flow Interaction


    Threads that are executed in a parallet process can be independent or interact
    with each other. A stream is independent if it does not affect the execution of
    other process threads, does not detect the impact on their part, and has no data
    in common with them. Its implementation is clearly dependent on the input data
    and is called deterministic.


    All other threads are interacting. These threads have data shared with other threads
    (they are in the address space of their process). Their implementation depends
    not only on the input data but also on the execution of other threads, ie they
    are *non-deterministic* (let us consider further examples of such non-deterministic).


    Independent thread execution results can always be repeated, which is not the
    case with interacting threads. Data Worms are common to several streams, called
    shared data. This is the most important concept of multi-threaded programming.
    Any stream can change this data at any time. Mechanisms for ensuring correct access
    to shared data are called flow synchronization mechanisms.


    Working with independent streams is easier than interacting with threads. A programmer
    may disregard the fact that others are running concurrently with such threads,
    and ignore the state of the shared data that the thread is working with.


    However, there are several reasons why you cannot implement thread interaction.'
  merge: -1
  img_proc: true
