    # # Multi-Level Page Tables


    To address the logical address space of a large volume with a single page table,
    it has to be very large. For example, in an IA-32 architecture with a standard
    page size of 4 KB (addressing inside such a page requires 12 bits) the index in
    the table remains 20 bits, which corresponds to a page table of 1 million elements.


    To avoid such large spreadsheets, the technology of *tiered page tables* is proposed.
    Page tables themselves are broken down into pages whose information is stored
    in top-level page tables. The number of levels rarely exceeds 2, but can reach
    4.


    When there are two levels of tables, the logical address is broken down into an
    index in the top-level table, an index in the lower-level table, and offset. This
    technology has two main advantages. First, page tables are smaller in size, so
    they can be searched faster. Second, not all page tables should be in memory at
    a specific point in time. For example, if the process does not use some memory
    block, then the contents of all the lower-level pages of an unused block may be
    temporarily stored on the disk.


    # ## Implementation Of Page Tables In IA-32 Architecture


    The IA-32 architecture utilizes a two-tier page organization, starting with the
    Intel 80386. A table-top level called *directory pages* for each task should be
    given a separate directory page, a physical address that is stored in a special
    control register and where it automatically loads the hardware when switching
    context. Table bottom level is called a *page table*.


    The linear address is divided into three fields:'
  merge: -1
  img_proc: true
