    ## The Great VüDü Linux Teen Zombie Massacree


    BOB AND I ATTRACTED a pack of zombies when we stopped to fuel up and check our
    email at the Gas & Grep in Buffalo Springs. I hoped we''d lost them, but hope
    was all I had. Bob said they were the fresh remains of a high school football
    team who''d been drowned and de-souled by water daemons at a lakeside party.


    Young, strong corpses have the speed and stamina to run down a deer. Until the
    sun and wind finally turned their flesh to stinky jerky, they''d be dangerous
    enough to make a vampire crap bats. And fresh zombies are persistent as porn site
    pop-up ads. If they take a fancy to the smell of your blood, they might track
    you for days, stopping only if live meat falls in their laps.


    It''d be months before they got the Dead Man Shamble and could be taken out with
    a well-placed head shot. Of Course, with the right software and hardware, you
    could kill the most problem zombie, but that was some fairly arcane stuff, even
    for experienced hackers.


    If my editor was right, Bob was one of only about five genuine cyberspirit experts
    in the U.S. But so far he seemed more like a second-rate grease monkey than a
    computer guru. I had my doubts.


    “Maybe we should go back to the Gas & Grep,” I suggested. “Bubba said he had a
    sick badger in one of his pens. Wouldn’t this work better with a fresh animal?”


    More important, Bubba had plenty of guns and ammunition; all I had was a 6-shot
    Beretta in the thigh pocket of his cargo pants. Bob had a small deer rifle in
    the gun rack of his cab. Not nearly enough firepower if the zombie teen squad
    showed up.


    “Taint no challenge, little lady,” Bob said, his voice dripping with scorn and
    tobacco juice. “Any fool with a copy o’ Red Hat and a pair of pliers can put Linux
    on a live badger, or even a fresh-kilt one.”


    Bob hit a pothole, and I nearly lost my grip on my Treo PDA. My nice shiny Nokia
    phone had fallen out of my pocket when the dead kid in the tattered Godsmack tee
    shirt was chasing me through the parking lot by the gas pumps, and I’d be damned
    if I was going to lose anything else on this trip.


    I was going to kill my editor for sending me on this Texas Hellride. Absolutely
    kill her. Or at least demand a paid vacation. I could still hear Wendy’s simpering
    wheedle: “The highway patrol says the Lubbock area is all clear; you’ll be perfectly
    safe, Sarah.”


    Safe, my ass.


    Bob was warming to his rant. “This zombie business is war. Little lady, the kind
    Patton never dreamt of. We are fighting the gall-darned Forces o’ Darkness. We
    gotta use some serious finesse, and there’s nothing that spells finesse like installing
    a home defense system on a dead badger. You write that down, little lady. The
    readers o’ Mac need to know this stuff if they’re gonna keep them em’ and theirs
    safe.”


    I dutifully typed it down on Treo. I’d gotten pretty quick with the thumb keyboard,
    but as a precaution against being dropped in the mud I stuck the PDA down in a
    unlubricated clear polyurethane condom and tied off the end with a rubber band.
    The condom, though dry, was still pretty slick, adding an extra layer of challenge
    to note-taking.


    “Hot damn, come to papa!” Bob abruptly swerved onto the shoulder and slammed on
    the brakes. The Ford slew to a stop in the caliche beside a stand of mesquites.


    In the glow of the headlights was a dead badger, all four legs stiff in the air.
    It was on the large side, maybe close to twenty pounds. Bob hopped out of the
    truck and ran over to the badger, turning it over and feeling around in the blood-matted
    fur.


    “The legs and spine and skull are in right fine shape,” he yelled at me, as excited
