    machine on. Oh well; she had hours to kill, so she might as well precook fresh
    fries for the freezer.


    Mark, one of the busboys, gave her a look of surprise as he carefully loaded the
    last of the dishes into the washer. He had clear blue eyes, caramel-hued hair,
    and always smelled like gingerbread.


    “I didn''t think you were still here, Miz Legrasse.” He always called everybody
    even slightly older than him Miz or Mister. She hadn’t decided if that was sweet
    or annoying.


    “Well, I shouldn''t be, but my car won''t start,” she replied, her face caught
    between a reflexive smile and a frown.


    “Oh, no.” His eyes widened. “I have jumper cables....”


    She shook her head. “The alternator belt’s toast. I could use panty hose to get
    myself home, if I was wearing any. You don’t have any, do you?”


    He blinked, shuffled his feet, turned a little pink. “No, ma’am, I don’t. May
    I give you a ride home?”


    She paused, gazing at the lean muscles in his forearms. He looked like he ought
    to be a tennis pro serving aces in the Australian sun, or modeling tight jeans
    under hot lights, not hauling dirty dishes in a Cleveland diner that pretended
    to be Basque or mostly served the same Panera sandwiches and pasta you’d find
    at any casual restaurant chain.


    Mark seemed to be the most beautiful, polite, considerate, gosh-darned charming
    guy she’d ever met.


