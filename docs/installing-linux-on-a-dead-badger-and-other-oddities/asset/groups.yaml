    says I look sickly, so I figured I could play dead pretty easily."


    John says the young woman took pity on his situation and got him a copy of the
    call response script.


    "I memorized it front to back - I was always good at that when I was doing theatre.
    We made this deal where I give her $50 out of each paycheck and she diverts the
    rest to my bank account; as far as accountants know, the money''s going to cover
    a private lawsuit that was filed against me before I died. The agency girl works
    things so I slip in and out on partial shift changes. That way, I don''t have
    to work more than 16 hours at a stretch.


    I have to put this mix of rotten fish and catnip in my hair. The fish makes me
    smell dead, and zombies have catnip. They won''t come near my brains when I''m
    wearing that stuff, not as long as management feeds them on time, anyhow. Alley
    cats follow me home all the time now, though – the dryads are running a makeshift
