    \ didn't get kinder. Afterward, Lucy naturally figured that humor was right up\
    \ there with electrophoresis on the list of things she should never try again.\
    \ So, she spent the next few years designing web sites, editing for various online\
    \ magazines, and trying to write the best, most serious speculative fiction she\
    \ possibly could.\n\nThat changed in 2002 when she discovered a site called Everything2.com.\
