    America by storm as the hottest trend in pets.


    Sixteen-year-old Melissa Eager’s bedroom is decorated entirely with paintings
    and statuettes of winged cats, which she has acquired at science fiction conventions
    around the country.


    "I love love faery cats," says Eager. "And I had no idea they were real until
    I saw one at a shop in Mill Valley. It was all black, and it had long, shiny wings
    like a raven. So pretty! I was all like, ‘Mom, I will totally die if you don''t
    get me!"


    The purchase of the cat - “Skynight” - Balinese Sylstopper was not an easy decision
    for Eager’s mother, Victoria Knott.


    "The shopkeeper wanted $2,500 for it. I could see paying for a good handbag, but
    for a cat? I just wasn''t sure.


    "But Missy kept pestering me. And it occurred to me that if I bought the cat,
    maybe she would stop spending so much time and money at those silly sci-fi conventions.
    I keep arranging dates with perfectly nice


