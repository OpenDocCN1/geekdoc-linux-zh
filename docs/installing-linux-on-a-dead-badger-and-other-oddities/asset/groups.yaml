    # 你的公司网络


    比以太网要容易。我的意思是，你以前经历过在旧建筑里拉电缆吗？那可真是麻烦了。


    “但有了**灵露网（Ichornet）**，”他说，“你只需要在建筑的关键部位插上这些小蛋，它们就会生长并遍布整个结构。我们几乎没费什么精力，在六小时内就让网络运行起来了！”


    林勒（Winkler）表示，在一周内，他们的灵露网出现了问题。我们的服务台员工告诉我们，他们的电脑被恶灵附体了。但秘书们总是说是 Windows 机器的问题，所以我们没当回事。


    “但后来，人们开始听到可怕的声音……你们知道，‘滚出去，否则我们会吃掉你的内脏。’这种事导致五六个人不得不请休假。我们其他人，你们知道的，只是调大了 iPod
    的音量并继续工作。”


    “当电缆没有固定好时，一切真的变得完透了。当我说‘电缆’时，我实际上指的是‘触须’。它们闯进了水管。”


    林勒不想详细谈论那次事故。“当我正在尿尿时，它抓住了我。灵露网现在的运动饮料瓶非常短缺，如果你明白我的意思的话。”


    然而，他愿意向游客展示他残破的腿。当他掀起裤子时，可以看到膝盖上方布满了大口子。它们随着他的心跳在抽动。


    “是的，这太恶心了，”他说，“当地的**你的公司网络**


    ![](img/582e6f49f5ffe20b2ab3795d619f8453_34_0.png)驱魔师阻止了。他对这件事很务实。“可能会更糟。至少它只是抓住了我的腿。”


    灵露网的制造者 **Kronozon 公司**坚持认为他们的产品没有错。


    “在公司大门外，”Kronozon 的发言人说，“我们收到了许多来自人类的支持电话。他们显然没有读过那本鬼的手册。”


    “网络需要不断的新鲜肉类作为诱饵，但这些人类做了什么？他们用罐装动物泥石堵住了营养枢纽。”


    ![](img/582e6f49f5ffe20b2ab3795d619f8453_35_0.png) 你的公司网络


    难怪这可怜的网络会进水管——那些电缆让它口渴了！愚蠢的人类——在垃圾邮件的攻击下没有任何网络可以正常运行。


    兰斯·施莱弗（Lance Shriver）作为公司的首席执行官对林勒的事故表示遗憾。“在这个困难的时期，我们正在为他尽全力，并努力以一种成本效益高的方式抚并保护网络。”


    施莱弗对员工解决灵露网问题充满信心。“我们必须修复它，因为根据合同，我们无法在明年 7 月之前更换它。我们的主要项目已经落后了，而且对股东有责任在今年实现盈利。”


    “我们已经给了每位员工圣水和一把砍刀；在此之后，就取决于个人在工作环境中保持警惕了。”


    施莱弗同意，在与 Kronon 的合同到期后，他们将切换到一个不那么反复的网络解决方案。


    “现在，我们正在考虑**以太网（Aetherweb）**，”他说，“它和普通的以太网差不多，但具有我们保持竞争力所需的所有赛博优势。”


    旧金山 Monkeybrain Computing 的系统专家阿曼达·奥布莱恩（Amanda O’Brien）被广泛认为是网络局域网调试专家。她不同意以太网是一个简单的网络解决方案。


    # 你的公司网络


    “但我告诉你，管理它是一件大麻烦。你看，未屏蔽的电缆会发出这种灵性气息，吸引周围几英里的各种怪异生物。你必须找人给这个地方祝福或施放保护护咒，但覆盖范围总有漏洞。超自然的东西经常进到这里。”


    “你知道当你拆掉门廊灯的罩时，里面全是死虫子吗？我们的网络机房现在就是那样。我们的‘虫子’不是死的。”


    奥布莱恩回忆起期的经历时打了个颤。“精灵是最糟糕的。我讨厌该死的精灵。”


    她掀起上衣露出一排白色的疤痕。“一个小精这样弄了我。其他的 IT 员工起初嘲笑我，但后来我说：‘好吧，如果你们这么厉害，就去把你们疯狂的忍者技能用在那个可爱的精灵身上。试试看。’”


    “他们回来时满脸是血。如果你不小心，精灵会让你落得极其惨状。”


    奥布莱恩对任何她从网络机房赶出去的实体都没有什么好感。“巨魔几乎和精灵一样糟……没那么危险，但烦人三倍。如果一个巨魔进入了你的网络，它会永远在那里闹腾。我发现这可怜的网络进了水管——那些电缆让它彻底疯了！你只需要等它无聊并离开。”


    自从那个小精事故后，奥布莱恩采取了亲力亲为的方法来移除


    触须


    奥布莱恩表示，应急计划是困难的，因为你永远不知道会有什么。然而，她说，在大多数情况下几个基本步骤可以确保良好的结果。首先，让祭司或巫师待命，并留好他们的联系方式。其次，随身携带一件厚外套和裤子。皮夹可以提供很好的保护，但
    Carhartts 工作服也是。而且如果有人搞砸了安装，Carhartts 不会变成行尸。第三，储备圣水并在口袋里放一个水壶。圣水越多越好。第四，在冰箱里随时好新鲜生肉作为诱饵，并准备好灵露心蛋糕作为精灵诱饵。精灵喜欢樱桃馅心的天使蛋糕，而魔物和地精喜欢花生酱果酱味麦片。只需确保员工不要吃了你的储备。第五点是，你必须准备容器。大多数精灵可以被关在咖啡罐里——铁质会让它们动弹不得。用灵露网把它们引出机房，把罐子扣在它们身上，用一个不锈钢饼垫滑进罐底，用胶带粘住饼垫，然后把它们带走。对于灵体，你需要真正的银器。我们为偶尔进来的小精准备了一个纯银香槟桶。对于比那更大的东西，你必须寻求协助。”

