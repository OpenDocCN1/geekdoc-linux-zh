    # Authorities Concerned Over Rise of Teen Linux Gangs


    Boston, M.1 — On Friday evenings, scruffy bands of teenagers gather in alleys
    behind Micro Centers, Best Buys, and Apple Stores across the country. Going by
    names like “Team Mayhem” and “The Pipes,” the Bawls-swigging teens trade Linux
    installation advice, brag about their video game prowess, and sneer at authorities.


    “We’re very concerned about what these kids are doing in their spare time,” says
    FBI spokesman Mark Brasslathe. “Just a few years ago, they would have been safe
    in their parents'' basements with their PlayStations, but cybernancy has changed
    that all. Now they’re fast becoming a threat to the public welfare.”


    One young gangster, who goes by the name “Retinoid,” agrees that cyberspace technologies
    have radically changed the teen geek community.


    “Two years ago, I installed Linux on my first dead badger,” says Retoid, who sports
    an orange Tux Penguin tee shirt that marks him as a member of The Pipes. “It was
    just wicked cool. We ran a warez FTP site off it and everything. But trying to
    run a game server on it was slower than an ice cream truck. So we'
- md: '

    thought, why not make a badger network cluster for distributed processes?”


    Retinoid and his friends were initially stumped when they couldn’t find another
    badger.


    “But then my kid sister’s pet Chihuahua got killed by our neighbor’s cat, and
    we were like, “Why not?” Retinoid says. “Turns out Linux will install on damn
    near anything as long as you know how to hack the code. We programmed little ChiChi
    to sing along with Kid Rock MP3s, and we took him with us to our next LAN party.
    Everyone loved it!”


    Retinoid and gangmate “Pork_Sashimi” spent that summer building a redundant array
    of reanimated roadkill (RARR).


    “The_RARR was totally kick-ass,” says Pork_Sashimi. “We had it serving up deathmatches
    and movies all day and night. Later on, we put an eyecam video interface on a
    dead possum, and we were able to remote control it into the ductwork of this sorority
    house down the street. Yeah, baby!”


    Sixteen-year-old “DoomBarbie” says she met Pork_Sashimi in an online chat room.
    “He was all sexist and stuff, and he kept asking me to send him JPEGGs of myself
    with my shirt off. He even traced my IP address and sent the Pussy Possum to my
    house. Can you believe it got him back,”


    LUCY SYNDER


    Pork_Sashimi totally apologized to me! He admitted he got what he deserved and
    said he was sorry for acting like an idiot. How often does that happen on the
    Intarweb?


    Impressed with her hacking skills, Pork_Sashimi recruited DoomBarbie for The Pipes.
    Her presence soon put a stop to their virtual voyeurism.


    “It’s not that I mind porn or anything,” she says.

    But they were all oohing and ahhing over this grainy-ass footage they got from
    a rat they sent into a strip bar, and I just started going off on the fake boobies.
    I was all like, ‘That one’s fake, and so’s that one, and you can even see that
    sear on that one!” I guess it wasn’t so much fun for them after that.


    However, larger crimes loomed on their horizon when 23-year-old MIT dropout Dr.
    Hoonboi joined the group and took over as leader.


    “The hackers love me ‘cause they know that I can code,” says Dr. Hoonboi. “These
    kids, they had all the potential, but they were wasting ‘til I came along”


    Dr. Hoonboi declines to describe his group’s exploits in any detail, but Agent
    Brasslathe makes serious allegations against the gang.


    “We’ve linked them to incidents in Vermont in which FBI agents were attacked during
    Patriot Act investigations,” Brasslathe says.


    “Our agents are in the process of confiscating records from several libraries
    to determine which patrons have been reading works by Chuck Palahniuk, William
    Gibson, and other authors of terrorist-sympathizer literature,” he says.


    According to Brasslathe, agents were subduing the


