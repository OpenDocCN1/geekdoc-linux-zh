    那些前途可限量的年轻人，结果她去参加完聚会带回来了一群整天都在看小说和玩游戏的男孩！


    “所以，我让米西同意，如果我给她买了那只猫，在她拿到商业学位之前就不许再参加聚会了。在哈佛大学。如果她一直走在成功的道路，那么这只猫就是一项好的投资，”诺特（Knott）说道。


    异域猫育种员凯尔·萨利斯（Kyle Salinas）表示：“自从‘闪烁事件’（Shimmer Incident）之后，仙猫就变得极其受欢迎。现在人们真的能看到这些猫了，它们几乎是自动畅销。”


    萨利斯说，仙猫——科学分类为 *Felis fae* 属——大约在公元前300年左右在欧洲和亚洲被创造。猫在欧洲繁荣到了黑暗时代。


    “考虑到普通的流浪猫曾因为被认为是魔的仆而被吊死，你可以想象迷信的人对仙猫会有怎样的反应，在少数情况下，仙猫曾是各种恶魔的宠物，”萨利斯说。


    大多数巫师和法师会在他们的飞行灵宠施上隐身咒以确保它们的安全。然而，在愤怒的人群抓住了猫的主人后，咒语并没有被打破，灵宠保持着隐形，它们的幼猫也是如此。


    萨利斯说，因为具有隐身性，仙猫被排除在动物志谱之外，并且经常被误认为其他实体，如女妖（banshees）、骚灵鬼（poltergeists）和博格特（boggarts）。


    “仙猫发情时的声音听起来非常像女妖，”他说，“而且如果一只隐形的幼猫在深夜进入


    ![](img/582e6f49f5ffe20b2ab3795d619f8453_44_0.png)


    进入房子并发现了一堆猫薄荷或狼草根，大多数居民都会确信自己需要一位驱魔师。”


    如果不是因为安格斯·闪烁（Angus Shimmer），仙猫可能一直一直保持隐身状态。


    “这完全是一个意外，”闪烁说，他现在是密斯卡托尼州立大学（Miskatonic State）的魔法学副教授。“我当时还是本科生，我的室友在对我开恶玩笑。他们偷走了我的每一本咒书，让它们隐形了，并把它们藏在宿舍周围的树上。


    “伙计，我当时气疯了，”闪烁说，“而且风暴要来了——我确定在找到它们之前，我的书都会毁掉。”


    闪烁说他爬上钟楼是为了在校园范围内施一个广范围的反转咒。就在他念完咒时，闪电击中了塔楼。


    除了在马萨诸塞州特伯里（Tewbury）的一栋哨屋（Whistle House）后面发现《邓威奇恐怖》（The Dunwich Horror）之类的惊喜外，全世界的人震惊发现仙猫住在他们的棚和花园里。


    “我完全不知道这些东西是真实的，”艺术家吉姆·比默（Jim Beemer）说，“我的意思是，我甚至不喜欢猫，但我厌倦了去艺术展却一件作品也卖不出去，而街角科幻展会上的那些画带翅膀的狗便的可爱蜡笔画却卖得火朝天。所以，是的，我妥协了。我不觉得自豪。我总得想办法还艺术贷款的，对吧？


    “但那天早上我醒来时，发现我的露台上有一只该死的 L U C Y A·S N Y O E 带着翅膀的猫。而且它正在啃着一只该死的小矮人。我每天下午去厕所检查自己，但噢，不，他们不留我，因为我并没有产生幻觉，”比默说。


    “现在甚至曼哈顿的收藏家都想要带翅膀的狗便的照片。没人关心我的静物画或风景画，”他说，“那只猫每天都在外面，用它那可爱的翅膀和死的小矮人嘲笑我。缠着我。我被一只猫缠扰了。天哪。整个世界都疯了。我需要喝一杯……我的波本在哪？”


    苏格兰仙猫爱好者爱德维娜·科顿（Edwina Cotton）也对这些飞行猫科种感到惊讶。


    “我一直在花丛里发现小精灵（pixies）和矮人（brownies）的小尸体，”她说，“我一直以为是我的小侄子用弹弓在捣鬼，结果发现我的温室里住着一只可爱的羽毛虎猫崽。”


    “我把小猫带进室内是为了防止它杀掉其他的仙猫，”科顿说，“但和我其他的猫相比，它可真不好对付！”


    萨利斯同意仙猫是普通的家猫更具挑战性的宠物。


    “仙猫需要空间、高天花板和栖息的地方。如果你住在小房子里，户外鸟舍也可以。但你不能只是把仙猫锁在鸟笼里并指望它过得好，”他说，“大多数品种在狭窄环境下会嚎叫或拒绝进，但某些欧洲血统的品种可以短距离传送，如果它们感到被困住就会这样做。如果发生这种情况，你的窗帘就可以走了。”


    他补充说，并不是所有的宠物主都意识到仙猫是为了特定的目的而繁殖的。


    ## F A E R Y   C A T S


    “这些生物确实美丽且神奇。但它们的工作是杀死仙类。如果它们不能完成工作，就会感到沮丧和无聊。”


    加密兽医研究员鲁迪·布鲁格斯（Rudy Briggs）花了多年时间追踪仙猫的起源。


    “我们已经追到了欧洲血统。”

