  mdcn: "\n\n千万不要相信。艾玛盯着自己冰冷、疼痛的双脚。她母亲曾承诺过要买像芭蕾舞演员那粉色丝绸舞鞋……却拒绝让她上真正的舞蹈课。\n\n艾玛内心有些东西硬化了，像是在油锅里炸了太久的薯条。它开始冒烟了。她用镊子把它捞出来，用冷水冲掉那具作响的尸体，扔进垃圾桶。去她她母亲那些老迷信吧。去她那多年来对冷青蛙变成热王子的等待吧。她拿起手机拨给了本尼。\n\
    \n“我们还没结束——”他开始说道。\n\n“结束了，”她回答道，“你是个几乎没用的废物，一个糟糕的男朋友。我再也不想见到你。再见。”她用力按下了“挂断”键，并删除了联系方式。\n\
    \n她拿出马克的便签，开始输入他的号码。一个连杀杀对于如何处理可疑的暴徒或许会有实用的想法。如果他只是个为了学费而工作的纯真孩子——好吧，她确实需要人送她回家。\n\
    \n再多一只手来清理那该死的炸油机也不坏。\n\n## 作者致谢\n\n我要感谢对这些故事提供建议的编辑们：来自《小镇醉酒汉》（The Town Drunk）的\
    \ Brit Marshalk 和 Eugie Foster，以及来自《太空服与六把枪》（Spacesuits and Sixguns）的 David L.\
    \ Duggins。特别感谢《奇异地平线》（Strange Horizons）的 Kyle Niedzwiecki 和 David Horwich；他们的投入确实让这些故事顺利了进展。当然，我想感谢\
    \ Pete S. Allen 出版这部合集，并感谢 Malcolm McClinton 和 D.E. Christman 提供的插画。最后，我要感谢我的丈夫\
    \ Gary A. Braunbeck 给予的爱与支持。\n\n本合集中的以下故事曾发表于：\n\n- “在死死的獾鼠上安装 Linux：用户笔记”——《奇异地平线》，2004年4月5日。\n\
    - “你的公司网络与黑暗力量”——《奇异地平线》，2005年6月20日。\n- “仙女猫：最可爱的杀手”——《奇异地平线》，2006年2月27日。\n- “墓地夜班”——《小镇醉酒汉》，2006年11月：\n\
    \    - “病人不需要咖啡休息”\n    - “业务外包提供死后生活”\n    - “企业吸血鬼将牙刺入商业世界”\n    - “失业者装死寻找工作”\n\
    - “当局对青少年 Linux 帮兴起的担忧”——《小镇醉酒汉》，2006年12月。\n- “醒醒吧猴子，你要死了”——《恐怖世界》，2007年3月。\n\
    - “大 VüDü Linux Linux 僵尸大屠杀”——《太空服与六把枪》，2007年春。\n\n## 关于作者\n\nLUCY A. SNYDER 在德克萨斯那个充满牛仔和仙人掌的地区长大。尽管每当牛仔竞技来到小镇，孩子们就能放假，但年轻的露西渴望生活在一个季节更丰富、中暑病例更少的地方。她第一次尝试写诗的灵感源于她喜爱的宠物圈蜘蛛在四年级一次外足活动中的逃脱：\n\
    \n> 我有一只大而茸茸的蜘蛛\n> 我给它起名叫西西先生\n> 它在校车上逃脱了\n> 它不在你的午盒里，对吧？\n\n成年后她依然对蜘蛛着迷，她获得了生物学学士学位，并打算成为一名科学家。遗憾的是，她在大四时发现自己在电泳方面糟糕得离谱。尽管决心要体验秋和春天，她还是搬到了印第安纳州的布鲁明顿攻读新闻学硕士学位。她想，如果她不能做科学，至少可以在报纸上描写科学。\n\
    \n搬进宿舍后不久，她卖出了第一篇科幻短小说。\n\n她非常激动，全身投入小说创作，两年后，她进入了位于密歇歇根州东兰辛的克拉里恩科幻幻想作家工作坊。在克拉里恩，她学习了许多关于情节、人物塑造以及保留商业收据的知识。但在工作坊接近结束时，她犯了一个错误，提交了一个幽默的幻想故事。那周的导师这样开始评价她的故事：“这个故事代表了当今科幻和幻想写作中的所有问题……”\n\
    \n他的批评并没有变得温和。此后，露西自然地认为，幽默和电泳一样列在她永远不要再次尝试的事情清单上。因此，她在接下来的几年里设计网站，为各种在线杂志编辑，并试图写出她认为最好的、最严肃的推想小说。\n\
    \n这一切在2002年发生了，当时她发现了一个名为 Everything2.com 的网站。在 E2，她发现自己可以描写脑海中出现的几乎任何奇异的事情，并能为此找到感兴趣的读者。抛开对创作畅销故事的顾虑，露西开始尝试对她来说完全全新的写作形式。\n\
    \n2004年初，一位 E2 用户发布了在极其过时的硬件上安装 Linux 的说明。在网站的聊天室里，另一个用户讽刺地评论道：“他接下来要做什么，告诉我们如何在死死的獾鼠上安装\
    \ Linux 吗？”\n\n露西一直在为了网页设计工作阅读大量糟糕的技术文档，这个想法让她觉得非常有趣。如何在死死的獾鼠上安装 Linux？你会用哪种版本？由\
    \ Linux 驱动的獾鼠有什么用处？\n\n她发布了《如何在死死的獾鼠上安装 Linux》，这很快成为了网站的宠儿。后来，她修改了这篇文章并将其卖给了《奇异地平线》的编辑部，扩展版本从热门网站\
    \ Slashdot 链接，导致该杂志获得了巨大的流量。即使是今天，“在死死的獾鼠上安装 Linux：用户笔记”仍然是 SH 最受欢迎的主题之一。\n\n\
    露西继续创作并销售幽默故事。今天，在她出版的40多篇短小说中，有近一半以及她的许多已散文包含了讽刺或其他强烈的幽默元素。她的几篇非獾主题幽默作品出现在她的第一个合集《火花与阴影》（Sparks\
    \ and Shadows）中，该书由 HW Press 于2007年5月出版。\n\n更多关于 Lucy 的请访问：www.lucysnyder.com\n\
    \n## 关于艺术家\n\nD.E. CHRISTMAN 是一个只想把你吓死的艺术家。而且他从中获得了极大的乐趣。他灵感源自洛苏鲁的作品被描述为“扭曲、疯狂且奇异地令人毛骨悚然”（The\
    \ Horror-Web），他对这个描述感到非常自豪。他的艺术作品出现在许多画廊、艺术展、杂志、书封以及专门从事死亡和奇异主题的网站上。\n\n他通过自己的公司\
    \ Grendel’s Den Studio 为生，为印刷和网络制作艺术和设计。他也被认为是费城顶尖的僵尸专家之一，并就他对活死人和那个著名的巫毒诅咒奴隶的知识进行过各种采访和演讲。\n\
    \n更多关于 D.E. 的信息请访问：www.grendelsden.net\n\nMALCOLM MCCLINTON 从他记忆开始就开始描绘科幻和幻想主题。但直到九年前，插画只是一个爱好，是他用来放松的事情。他的大部分努力都在学术界，在那里那里物理人类学和考古学获得了高级学位。但在挖掘现场劳作了五六年后，他感到精疲力竭，随后在黑马漫画找了一份制作工作。\n\
    \n这次职业转变重新燃了他的创作动力，三年后他离开去追求自己的绘画和项目。从那以后，他一直以插画维持生。他自己创造了一个良好的小众领域，同时满足了他天生的反权威倾向、隐居的性格以及对崇拜的需求。\n\
    \n更多关于 Malcolm 的请访问：hanged-man.deviantart.com\n\nLucy Snyder 的其他作品：\n\n**Sparks\
