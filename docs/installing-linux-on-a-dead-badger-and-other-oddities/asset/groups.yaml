    young men with good prospects, and then she goes to a convention and brings home
    boys who spend all their time reading novels and playing games!


    “So, I got Missy to agree that, if I got her the cat, no more conventions for
    her until she gets her business degree. At Harvard. If it keeps on the proper
    path to success, then the cat has been a good investment,” Knott says.


    Exotic cat breeder Kyle Salinas says, “Faery cats have become extremely popular
    ever since the Shimmer Incident. Now that people can actually see the cats, they
    practically sell themselves.”


    Salinas says faery cats – scientifically classified in the genus Felis fae – were
    created in Europe and Asia around 300 B.C. The cats thrived in Europe until the
    Dark Ages.


    “Considering that plain old alley cats were hung for being minions of the Devil,
    you can imagine how superstitious folk reacted to faery cats, which in rare instances
    were the pets of various demons,” says Salinas.


    Most witches and wizards put an invisibility charm on their flying familiars to
    keep them safe. However, after the angry mobs caught the cats'' masters, the spells
    remained unbroken and the familiars stayed invisible, as did their kittens.


    Salinas says that, because of their invisibility, faery cats were left out of
    bestiaries and were often mistaken for other entities such as banshees, poltergeists,
    and boggarts.


    “A faery cat in heat does sound very much like a banshee,” he says. “And if an
    invisible kitten gets into


    ![](img/582e6f49f5ffe20b2ab3795d619f8453_44_0.png)


