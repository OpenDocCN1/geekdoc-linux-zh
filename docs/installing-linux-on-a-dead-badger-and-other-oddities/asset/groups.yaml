- md: "\n# INSTALLING LINUX\n\nOn A Dead Badger\n\n(And Other Oddities)\n\nWritten\
    \ by Lucy A. Snyder\n\nand\n\nIllustrated by DE Christman and Malcolm McClinton\n\
    \nCreative Guy Publishing\n\n# Installing Linux on a Dead Badger (and Other Oddities)\n\
    \nby Lucy A. Snyder\nIllustrated by DE Christman and Malcolm McClinton\n\nCopyright\
    \ ©2007 Lucy Snyder. No portion of this book may be reproduced in any way, except\
    \ short quotation for the purpose of review, without the express written consent\
    \ of the author.\n\nPublished by Creative Guy Publishing.\nwww.creativeguypublishing.com\n\
    CGP-4014\nISBN-10: 1-894953-47-9\nISBN-13: 978-1-894953-47-4\nOctober 2007\nTrade\
    \ edition\n\nCover design ©2007 Lucy Snyder.\nCover and interior artwork (p.73)\
    \ ©2007 Malcolm McClinton\nInterior artwork (pp 14, 22, 26, 29, 30, 34, 39, 47,\
    \ 51, 54, 61, 65, 97)\n©2007 DE Christman.\n\nThe illustration on p. 22 incorporates\
    \ Tux the Penguin, created by Larry Ewing, he writes “Permission to use and/or\
    \ modify this image is granted provided you acknowledge me (lewing@isc.tamu.edu)\
    \ and 'The GIMP' if someone asks...\" Mr. Ewing, please consider yourself heartily\
    \ acknowledged, and warmly thanked.\n\nAll rights reserved.\n\nPublished in Canada.\n\
    Library and Archives Canada Cataloguing in Publication\n\nSnyder, Lucy A., 1971-\n\
    Installing Linux on a Dead Badger: (and Other Oddities) / Lucy A.\nSnyder.\n\n\
    ISBN 1-894953-47-9\n\n+ 1. Computers--Humor. 2. Zombies--Humor. 1. Title.\n\n\
    PN6231.E4865 2007 813'.6 C2007-905004-2\n\nAll daft words are dedicated to Linux\
    \ users around the world.\n\nAll daft words are dedicated to Everything’s hot\
    \ inner beauty.\n\nAll white space is dedicated to the eye of the beholder.\n\n\
    # Table of Contents\n\n+ Installing Linux on a Dead Badger................................7\n\
    + Authorities Concerned Over Rise of Teen Linux Gangs.......19\n+ Your Corporate\
    \ Network And The Forces Of Darkness......25\n+ Faery Cats: The Cutest Killers......................................37\n\
    + Dead Men Don't Need Coffee Breaks........................45\n+ Business Insourcing\
    \ Offers Life After Death..................49\n+ Corporate Vampires Sink Teeth\
    \ Into Business Business........53\n+ Unemployed Playing Dead To Find Work........................59\n\
    + Trolls Gone Wild......................................................63\n+\
    \ The Great VuDu Linux Teen Zombie Massacre...............67\n+ Wake Up Naked\
    \ Monkey You're Going To Die..................81\n+ In The Shadow of the Fryolator......................................87\n\
    + Author's Acknowledgements......................................101\n+ About\
    \ the Author.....................................................103\n+ About\
    \ the Artists.....................................................107\n\n# Installing\
    \ Linux on a Dead Badger:\nUser’s Notes\n\nLET’S FACE IT: any script kiddie with\
    \ a pair of pliers can put Red Hat on a Compaq, his mom’s toaster, or even the\
    \ family dog. But nothing earns you geek points like installing Linux on a dead\
    \ badger. So if you really want to earn your wizard hat, just read the following\
    \ instructions, and soon your friends will think you’re slick as caffeinated soap.\n\
    \nMinimum Installation Requirements:\n\n- one (1) pocketknife\n- one (1) screwdriver,\
    \ flathead, to install Duppy card (see item 4 below)\n- one (1) computer with:\n\
    \  * CD drive\n  * USB, Ethernet, or a free slot for wireless networking card\n\
    \  * Telnet or SSH client installed\n  * cyberspectral controller program such\
    \ as FleshGolem (Mac OS X and Linux), Phranken (Windows 98, ME, 2000), or ItzalLive\
    \ (Mac OS 8.1-9x and Amiga)\n- one (1) Duppy card (available in CardBus and PCI\
    \ models) or SpiritInTheSky external adapter (available in ethernet and USB models)\n\
    - VDü Linux (available from Twisted Faces Software)\n- minimum 3' x 3' (1m x 1m)\
    \ fireproof surface, in secure, ventilated area\n- privacy\n- one (1) dead badger,\
    \ good condition\n\n# Optional Installation Requirements:\n\n- one (1) gallon\
    \ of holy water (Bless! brand exorcise water is ideal) in a silver or silver-plated\
    \ bucket\n- one (1) pair latex gloves\n- one (1) fluid ounce of flea-killing shampoo\
    \ such as Ecto-Soothe or Mycodex\n- running water and a large sink or bathtub\n\
    \nThe following test installation was conducted on the concrete floor of the garage\
    \ of a detached single-story house, on unconsecrated ground, using a 400Mhz clamshell\
    \ iBook, and began shortly after local sunset.\n\nStep 1: Find a suitable badger.\
    \ Specimens from zoos are ideal, but suitable badgers can be found as roadkill\
    \ along highways in many parts of North America, the British Isles, continental\
    \ Europe, Asia, and parts of Africa.\n\n- Other animals of family Mustelidae and\
    \ Vombatidae can be used in place of a badger, but an adapter may be required.\
    \ See Appendix I for details.\n\nStep 2: Once you have obtained a dead badger,\
    \ check it carefully for structural damage, particularly in the spine, skull,\
    \ and legs. Dead badgers do not heal, and a badger with broken legs will display\
    \ limited mobility.\nBrain and spinal cord damage is likely to interfere with\
    \ the Linux installation and render any successfully-installed system unstable,\
    \ as well as voiding all explicit and implicit warranties according to the laws\
    \ of any and every state, country, or alternate dimension, present or future.\n\
    \n- As a precaution against infection, wear latex gloves at all times when handling\
    \ your dead badger. It is highly recommended that you wash the carcass with a\
    \ suitable flea-killing shampoo.\n\nStep 3: Obtain a copy of FleshGolem or other\
    \ spiritual controller program. This test was conducted with a copy of FleshGolem\
    \ downloaded from the Apple site. Follow all installation instructions carefully,\
    \ including addenda in the readme.txt file.\n\n- All spiritual controllers should\
    \ be compatible with either Duppy cards.\n\nStep 4: Insert Duppy card or attach\
    \ external SpiritTheSky adapter. Duppy cards work best if you're using a Mac with\
    \ an Airport slot; response on the external SpiritTheSky adapter may be sluggish.\
    \ Further notes below apply only to Duppy card installation on the test iBook.\n\
    \n- The card has a hinged lid and a clear cover over what looks like a small,\
    \ shallow ivory box. Open and place a small amount of hair and blood from the\
    \ badger in the compartment, then close the cover, being careful not let stray\
    \ hairs stick out of the compartment.\n\nStep 5: Install Duppy card security antenna\
    \ (included with card) in badger. Badgers may be run without security antennas,\
    \ but this is not recommended. Insecure badgers may be hacked by anyone with a\
    \ compatible card and badger bits. Each Duppy antenna system is uniquely coded\
    \ so that a properly installed system will allow only the original user to run\
    \ the badger.\n\n- To install antenna, make a small incision with the pocketknife\
    \ at the nape of the badger's neck. Insert the antenna down the badger's back\
    \ under the hide. Antenna must lie as flat as possible along the spine, or security\
    \ will be suboptimal. Antenna may also be installed by cutting the badger's back\
    \ skin open, but requires post-installation stitching to restore integrity; this\
    \ method is recommended for licensed taxidermists only.\n\nStep 6: Install your\
    \ badger's operating system. VDü is the preferred Linux distribution for badgers\
    \ and related species (see Step 1). This distro was designed by German software\
    \ engineers who contributed to the SuSE project before they started up Twisted\
    \ Faces Software in Jamaica. An alternative distribution is Pooka, which is available\
    \ for download at.\n"
  mdcn: "\n\n# 安装 LINUX\n\n在死獾鼬身上\n\n（以及其他奇事）\n\n作者：Lucy A. Snyder\n\n插图：DE Christman\
    \ 和 Malcolm McClinton\n\nCreative Guy 出版\n\n# 在死獾鼬身上安装 Linux（以及其他奇事）\n\n作者：Lucy\
    \ A. Snyder\n插图：DE Christman 和 Malcolm McClinton\n\n版权 ©2007 Lucy Snyder。未经作者明确书面许可，除评论目的的简短引用外，不得以任何方式复制本书任何部分。\n\
    \nCreative Guy 出版\nwww.creativeguypublishing.com\nCGP-4014\nISBN-10: 1-894953-47-9\n\
    ISBN-13: 978-1-894953-47-4\n2007年10月\n贸易版\n\n封面设计 ©2007 Lucy Snyder。\n封面及内页插图（第73页）©2007\
    \ Malcolm McClinton\n内页插图（第14, 22, 26, 29, 30, 34, 39, 47, 51, 54, 61, 65, 97）\n\
    ©2007 DE Christman.\n\n第22页的插图包含了 Larry Ewing 创建的企鹅 Tux，他写道：“如果有人询问，允许使用和/或修改此图像，只需注明我（lewing@isc.tamu.edu）和‘The\
    \ GIMP’……”Ewing 先生，请接受我们诚挚的致意和热烈的感谢。\n\n所有权利保留。\n\n出版于加拿大。\n加拿大图书馆与档案馆编书数据\n\n\
    Snyder, Lucy A., 1971-\n《在死獾鼬身上安装 Linux：（以及其他奇事）》/ Lucy A. Snyder。\n\nISBN 1-894953-47-9\n\
    \n+ 1. 计算机--幽默。2. 僵尸--幽默。1. 标题。\n\nPN6231.E4865 2007 813'.6 C2007-905004-2\n\n\
    所有的荒唐话都献给全世界的 Linux 用户。\n\n所有的荒唐话都献给万物的炽热内在美。\n\n所有的留白都献给观者眼中。\n\n# 目录\n\n+ 在死獾鼬身上安装\
    \ Linux................................................7\n+ 对青少年 Linux 帮兴起的关注当局.......................19\n\
    + 你的企业网络与黑暗力量......................................25\n+ 仙猫：最可爱的杀手......................................37\n\
    + 死人不需要咖啡休息........................................45\n+ 业务外包提供死后生活......................................49\n\
    + 企业吸血鬼刺入业务领域........................53\n+ 失业者装死寻找工作........................................59\n\
    + 失控的巨魔......................................................63\n+ 大大的 VuDu Linux\
    \ 青少年僵尸大屠杀...............67\n+ 醒醒吧光猴，你要快死了..................................81\n\
    + 在 Fryolator 的阴影下......................................87\n+ 作者致谢.....................................................101\n\
    + 关于作者.....................................................103\n+ 关于艺术家.....................................................107\n\
    \n# 在死獾鼬身上安装 Linux：\n用户笔记\n\n面对现实吧：任何拿着一把钳子的脚本小子都能把 Red Hat 装在 Compaq 电脑、他妈妈的烤面包机，甚至是家里的狗身上。但没有什么能比在死獾鼬身上安装\
    \ Linux 更更能赢得极客积分了。所以，如果你真的想赢得你的巫师帽，只需阅读以下指令，很快你的朋友就会觉得你像咖啡因肥皂一样滑溜。\n\n最低安装要求：\n\
    \n- 一个（1）折叠刀\n- 一个（1）十字螺丝刀，用于安装 Duppy 卡（见下方第4项）\n- 一台电脑，带有：\n  * CD 驱动器\n  * USB、以太网或无线网卡的空槽\n\
    \  * 已安装 Telnet 或 SSH 客户端\n  * 网络光谱控制程序，如 FleshGolem（Mac OS X 和 Linux）、Franken（Windows\
    \ 98, ME, 2000）或 ItzalLive（Mac OS 8.1-9x 和 Amiga）\n- 一个（1）Dippy 卡（CardBus 和 PCI\
    \ 型）或 SpiritInTheSky 外部适配器（提供以太网和 USB 型）\n- VDü Linux（从 Twisted Faces Software\
    \ 获取）\n- 至少 3' x 3'（1m x 1m）的防火表面，位于安全、通风区域\n- 隐私\n- 一个（1）状况良好的死獾鼬\n\n# 可选安装要求：\n\
    \n- 一加仑圣水（Bless! 驱魔水为理想）放在银或镀银桶中\n- 一（1）双乳胶手套\n- 一盎司杀灭跳子的洗发水，如 Ecto-Soothe 或 Mycodex\n\
    - 流动的水和一个大水槽或浴缸\n\n以下测试安装是在独立单层房屋的车库混凝地上进行的，位于未经过圣化的土地上，使用一台 400Mhz 壳式 iBook，并在当地日落后不久开始。\n\
    \n第 1 步：寻找一只合适的獾鼬。动物园的标本是理想的，但在北美、英国列群岛、欧洲大陆、亚洲和非洲部分地区，可以在高速公路沿线找到死的路障。\n\n- 鼬科和簍簍鼠科的其他动物可以代替獾鼬，但可能需要适配器。详情见附录\
    \ I。\n\n第 2 步：一旦获得一只死獾鼬，仔细检查其结构性损伤，特别是脊椎、头骨和腿部。死獾鼬不会愈合，腿断了的獾鼬活动能力将有限。\n大脑和脊髓损伤可能会干扰\
    \ Linux 安装，并导致任何成功安装的系统不稳定，同时根据任何和所有州、国家或未来或其他维度的法律，使所有显式和隐含保证失效。\n\n- 为了防止感染，在处理你的死獾鼬时请始终佩戴乳胶手套。强烈建议使用合适的杀跳子洗发水冲洗尸体。\n\
    \n第 3 步：获取 FleshGolem 或精神控制程序的副本。本次测试使用的是从 Apple 网站下载的 FleshGolem 版本。仔细遵循所有安装指令，包括\
    \ readme.txt 文件中的附录。\n\n- 所有精神控制程序都应兼容 Duppy 卡。\n\n第 4 步：插入 Duppy 卡或连接外部 SpiritTheSky\
    \ 适配器。Dippy 卡在带有 Airport 插槽的 Mac 上效果最好；外部 SpiritTheSky 适配器的响应可能缓慢。下方的备注仅适用于在测试\
    \ iBook 上安装 Duppy 卡。\n\n- 卡片有一个铰页盖，透明覆盖物下方是一个像小型浅象牙盒的东西。打开它，将少量獾鼬的毛和血液放入格中，然后关上盖子，注意不要让杂毛露在格外。\n\
    \n第 5 步：在獾鼬中安装 Duppy 卡安全天线（随卡附）。獾鼬可以在没有安全线的情况下运行，但不建议。不安全的獾鼬可能会被任何拥有兼容卡和鼬碎片的人黑入。每个\
    \ Duppy 天线系统都有唯一编码，因此正确安装的系统仅允许原始用户运行该鼬。\n\n- 要安装天线，用折叠刀在獾鼬颈后部切一个小口。将天线插入獾鼬背部皮下。天线必须尽可能贴着脊椎放置，否则安全性将不理想。天线也可以切开獾鼬的背部皮肤安装，但在安装后需要缝合以恢复完整性；此方法仅建议执证的标本师使用。\n\
    \n第 6 步：安装你的獾鼬操作系统。VDü 是獾鼬及相关物种的首选 Linux 发行版（见第 1 步）。该发行版由德国软件工程师设计，他们在牙买加创立 Twisted\
    \ Faces Software 之前曾为 SuSE 项目做过贡献。另一种发行版是 Pooka，下载地址见。\n\n"
