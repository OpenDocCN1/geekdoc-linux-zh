- md: "\nnever believe it. Emma stared down at her cold, aching feet. Feet that her\
    \ mother promised the pink silk of ballerina... but denied actual dance lessons.\n\
    \nSomething hardened inside Emma like a French fry left too long in the vat. It\
    \ started to smoke. She fished him out with the tongs, discarded his crackling\
    \ corpse with cold water and dumped it in the trash. Screw her mother's old wives\
    \ tales. Screw years of waiting for cold frogs to turn into hot princes. She fetched\
    \ her phone and called Benny.\n\n“We’re not finished yet—” he began.\n\n“Yes,\
    \ we are,” she replied. “You’re a nearly useless human being and a crappy boyfriend.\
    \ I never want to see you again. Goodbye.” She hit the “end” button fiercely and\
    \ deleted his entry.\n\nShe pulled out Mark’s Post-It and began to punch in his\
    \ number. A serial killer might have practical ideas on how to dispatch fishy\
    \ thugs. And if he was just a genuinely sweet kid working his way through school\
    \ – well, she sure could use a ride home.\n\nAnother hand to clean the damn Fryolator\
    \ wouldn’t hurt, either.\n\n## Author’s Acknowledgements\n\nI would like to thank\
    \ the editors who gave me suggestions on these stories: Brit Marshalk and Eugie\
    \ Foster of *The Town Drunk*, and David L. Duggins of *Spacesuits and Sixguns*.\
    \ Very special thanks go to Kyle Niedzwiecki and David Horwich of *Strange Horizons*;\
    \ their input really got the ball rolling on these stories. And of course I'd\
    \ like to thank Pete S. Allen for publishing this collection, and to thank Malcolm\
    \ McClinton and D.E. Christman for their artwork. Last but not least, I'd like\
    \ to thank my husband, Gary A. Braunbeck, for his love and support.\n\nThe following\
    \ stories in this collection were previously published:\n\n- “Installing Linux\
    \ on a Dead Badger: User’s Notes” – Strange Horizons, April 5, 2004.\n- “Your\
    \ Corporate Network and the Forces of Darkness” – Strange Horizons, June 20, 2005.\n\
    - “Faery Cats: The Cutest Killers” – Strange Horizons, February 27, 2006.\n- “Graveyard\
    \ Shift” – The Town Drunk, November 2006:\n    - “Dead Men Don’t Need Coffee Breaks\"\
    \n    - “Business Insourcing Offers Life-After Death\"\n    - “Corporate Vampires\
    \ Sink Teeth Into Business World\"\n    - “Unemployed Playing Dead To Find Work\"\
    \n- “Authorities Concerned Over Rise of Teen Linux Gangs” – The Town Drunk, December\
    \ 2006.\n- “Wake Up Naked Monkey You’re Going To Die” – Horror World, March 2007.\n\
    - “The Great VüDü Teen Linux Zombie Massacree” – Spacesuits and Sixguns, Spring\
    \ 2007.\n\n## About the Author\n\nLUCY A. SNYDER grew up in the cowboys-and-cactus\
    \ part of Texas. Although the kids got a school holiday whenever the rodeo came\
    \ to town, young Lucy yearned to live in a land that featured more seasons and\
    \ fewer cases of sunstroke. Her first attempts at poetry were inspired by the\
    \ escape of her beloved pet tarantula during a 4th grade field trip:\n\n> I had\
    \ a big fuzzy spider\n> I named him Mister Squissy\n> He got loose on the schoolbus\n\
    > He's not in your lunchbox, is he?\n\nStill fascinated with spiders as an adult,\
    \ she earned a BS in biology and intended to become a scientist. Unfortunately,\
    \ she discovered in her senior year that she was horribly bad at electrophoresis.\
    \ Still determined to experience autumn and spring, she moved to Bloomington,\
    \ Indiana to get her MA in journalism. She figured that if she couldn't do science,\
    \ at least she could write about it in newspapers and\n\nSoon after she moved\
    \ into the dorm, she made her first science fiction short story sale.\n\nThrilled,\
    \ she dedicated herself to fiction writing, and two years later she got into the\
    \ Clarion Science Fiction & Fantasy Writers' Workshop in East Lansing, Michigan.\
    \ At Clarion, she learned a great deal about plot, characterization, and the importance\
    \ of keeping business receipts. But near the end of the workshop, she made the\
