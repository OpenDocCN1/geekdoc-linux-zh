    “Squirrels are much more vicious than most people realize,” explains Brasslathe.
    “As a result of squirrel bites, two agents contracted Sumatran Rat Monkey Fever,
    which is evidently very common in zombified wild animals. The agents are still
    in a medical asylum awaiting brain transplants.”


    Children’s librarian April Easley was preparing to read to a group of preschoolers
    when the FBI raided her workplace.


    “These guys in suits came in demanding our circulation records, and we said, ‘No,
    way.’ So then they pulled out the guns and the pepper spray. Sunny Saturday Storytime
    was completely ruined,” she laments.


    ## LUCY A. SYNDER


    “They had our aide Bobby in a headlock and wrestling him to the floor when the
    squirrels came out of nowhere. Those furry little critters completely sent the
    FBI guys to school. All us librarians were cheering; “Yeah, go squirrels!”


    “And the kids learned an important lesson that day: they may look cute and cuddly,
    but don’t piss off a squirrel,” Easley says.


    “Next week our patrons are voting on a new library mascot, and I’m pretty sure
    Speedreader Squirrel is going to beat the paws off Benny the Bookworm,” she says.


    Brasslathe is upset that people like Easley view the zombie rodent attack as heroic.
    “Punks like this Dr. Hoonboi character are a threat to American freedom. Today
    he’s interfering with terrorist investigations. Who knows what he might do tomorrow?”


    Dr. Hoonboi denies having unleashed undead squirrels on the FBI.


    “I’m much more a bunny man, myself,” says Dr. Hoonboi. “If they have some real
