    but I got hella burned out in grad school.


    John quit his PhD program just as Internet start-ups were discovering riches,
    and he quickly found work as a Web designer. However, his good job didn''t last;
    the dot-com bust left him unemployed with no money to continue his schooling.


    “I couldn''t even get a job grilling weenie,” he says. “Nobody’s in a hurry to
    hire you for entry level work if you''ve got a graduate degree. They think you''ll
    cut and run the moment you get something better. Which you will, but who expects
    anyone to make those jobs a career anyway?”


    During his two-year unemployment, John made ends meet by moving into a dilapidated
    farmhouse at the edge of the city with six dryads who had lost the forest to a
    failed condominium development. His parents also lent him money until his father
    was forced into early retirement.


    "But then I finally got a job at the Hawt Shawpz call center on the westside.
    Eight bucks an hour wasn''t much, but it made my rent."


    Disaster struck when Hawt Shawpz replaced their live call staff with zombloyees
