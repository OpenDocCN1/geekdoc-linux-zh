    # In The Shadow of the Fryolator


    EMMA LEGRASSE CRANKED the key in her Ford Festiva''s ignition a third time, to
    no avail. She stared through the smeared windshield at the snow-blanketed hood
    and entertained a fleeting daydream of a sweet frosted fairyland ruled by a benevolent
    Jelly Donut King. Dismissing her snappy fancy, she opened her phone and called
    her boyfriend.


    “Yo,” answered Benny, far too loudly. She could hear him typing furiously. A dragon
    roared through his computer speakers. “Sup, Em?”

    “Hi honey, my car won’t start—”

    “More Do’Ts! More Do’Ts! Don’t go near the whelps, dumbass!” Benny screamed in
    her car. Through the ringing she heard a fireball woosh and a computerized voice
    groan in death. “What an idiot! Uh, whanja say?”

    “My car. Won’t start. I’m kinda stranded here at the diner. Could you come pick
    me up, please?”

    “Sure, I guess, after the raid,” he replied, his voice flush with indifference.

    “After?” The darned raids lasted forever. There wasn’t a bus, and a cab would
    be at least $50. She wouldn’t get home until after midnight. “Honey, please, I’ve
    been cooking for 10 hours straight, and I’ve got to be back here at 8 a.m.—”

    “Em, we’ve gotten wiped in this dungeon twice— we gotta take Zirconia out this
    time! I’m talking; I can’t leave now! Look, I’ll see you later. Gimme a call if
    you catch a ride or somethin’”


    The line went dead. Emma managed to resist smashing her cell phone against the
    dashboard in frustration. Heaven forbid she ever got pregnant from her Mountain
    Dew-addled sperm—she’d have to call a cab if she went into labor on a game night.


    Why do I put up with this? she wondered, then almost immediately heard the echoes
    of her mother’s lectures that a girl had to have a man in her life, that men weren’t
    perfect, that a good girl made to do with what she got.


    Criminy. Benny was preferable to her mother’s hand-wringing and dire tales about
    the fate of single women. If Emma reported a breakup, her mother inevitably brought
    up the urban legend about the elderly woman who was devoured by rats the day after
    her divorce. That story never got old.


    She dropped the phone and her car keys back in her purse and rubbed her numb hands
    on her black pants, staring balefully at the snowy hood. Cars weren’t rocket science,
    no matter what her ex-boyfriend from Flint had tried to convince her. Changing
    a spark plug was easier than building a computer—which she had done, thank-you
    very much—or even just making a really good risotto.


    Emma yanked the hood release and heaved the door open. The mucus in her nose froze
    with her first breath, her sneaker-clad feet sank ankle-deep in the powdery snow
    as she went to the front of the car to wrestle the hood open. Her fingers felt
    like they’d been beaten with a hammer by the time she succeeded. She twisted on
    her keychain flashlight and examined the engine. The alternator belt hung limply
    on its rusty spindles, a section ragged snapped apart. Viscous pink icicles dripped
    from the cold-gnawed edges of the belt. Had her transmission gone bad, too? Darn
    it.


    Shivering, she slammed the door shut and picked her way through the snow and icy
    car droppings to the back door of the Zuberoa Diner. She pushed into the warmly-lit
    hallway beside the cozy employee lounge, stomped the snow off her shoes, and hung
    her purse and coat by the door.


    A weird, musky-fishy odor greased the air; she first noticed it around noon. She’d
    taken out the trash and searched the kitchen for errant sprats and prawns, to
    no avail. Maybe something had fallen between the counter and the fridge; she’d
    get one of the guys to help her pull it away from the wall if the stink persisted.


    She spotted a gleaming, patterned trail of oil or slime leading from the door
    to the kitchen. Darn it, she’d told the busboys not to wheel their bikes through
    there. The tires always tracked mud and grass and who-knew-what onto the floor.
    Who’d be riding a bike on a day like this, anyhow? Probably Carlos; he was training
    for the Mountain Madness race.


    Emma hurried into the kitchen to warm her aching hands against the polished insulated
    sides of the stainless steel Fryolator. The ghosts of French fries past filled
    her defrosting nostrils, and the warm, oily air stung her cheeks. The new short-order
    guy had forgotten the closedown checklist again and left the machine on. Oh well;
    she had hours to kill, so she might as well precook fresh fries for the freezer.


    Mark, one of the busboys, gave her a look of surprise as he carefully loaded the
    last of the dishes into the washer. He had clear blue eyes, caramel-hued hair,
    and always smelled like gingerbread.


    “I didn''t think you were still here, Miz Legrasse.” He always called everybody
    even slightly older than him Miz or Mister. She hadn’t decided if that was sweet
    or annoying.


    “Well, I shouldn''t be, but my car won''t start,” she replied, her face caught
    between a reflexive smile and a frown.


    “Oh, no.” His eyes widened. “I have jumper cables....”


    She shook her head. “The alternator belt’s toast. I could use panty hose to get
    myself home, if I was wearing any. You don’t have any, do you?”


    He blinked, shuffled his feet, turned a little pink. “No, ma’am, I don’t. May
    I give you a ride home?”


    She paused, gazing at the lean muscles in his forearms. He looked like he ought
    to be a tennis pro serving aces in the Australian sun, or modeling tight jeans
    under hot lights, not hauling dirty dishes in a Cleveland diner that pretended
    to be Basque or mostly served the same Panera sandwiches and pasta you’d find
    at any casual restaurant chain.


    Mark seemed to be the most beautiful, polite, considerate, gosh-darned charming
    guy she’d ever met.


    There had to be something horribly, horribly wrong with him. Benny, after all,
    never once called her “ma’am” or “miz” and tweeted out a silent-but-deadly on
    their second date.


    Mark’s sweet, innocent face was surely a mask for a serial killer.


    Or another Laird of Warmongrel fanatic.


    “Thank you, but my boyfriend said’d get me,” she replied.


    “Oh.” Mark still looked concerned. “Are you sure you’ll be okay by yourself? I
    don’t live far from here ... please take my phone number, just in case.”


    Mark wrote his number in neat print on a yellow Post-It, said goodbye and went
    out to his Jeep. Emma folded the note sticky-side in and stuck it in her pants
    pocket. After he pulled out of the parking lot, she locked the doors and hauled
    one of the tall stools from the bar into the kitchen. The heck with standing to
    cook; she’d been on her feet most of the day and her arches were killing her.


    She suddenly remembered her mother cupping her pink heels when she was a little
    girl, telling her she had beautiful feet, feet like a ballerina. Emma roomed with
    a real ballerina in college and learned dancers’ feet were cracked and callused.
    While Emma was at class, the ballerina ate all the Krispy Kremes and denied it
    afterward, as if her poor battered feet slipped out of bed at night and somehow
    devoured the donuts on their.


