    \ Funnybones，Paul Kane 作品\n\nPaul Kane - 《孤独（在）》和《触摸火焰》的作者回归了，这次不是为了恐吓你，而是为了挠痒你的笑穴。在这书中，你将发现他最荒诞的幽默恐怖故事集，范围从《恋爱中的德库拉》到《爱丽丝·克鲁姆的最后诱惑》……还没忘了粉丝最爱的《骨头兄弟》。\n\
