    says Don Frites, owner of the O’Burger diner chain. "The new crop of vampires
    has been great. They’re sharp, efficient, and we can partly pay them in cow blood
    from our affiliate slaughterhouses. Normally that stuff would just go right down
    the drain, and now it’s keeping our night managers very happy.”


    Ed Rudge, Outreach Director for Cybermantic Staffing Solutions Inc. (CSS), says
    the corporate demand for vampires has increased nearly 1000% over the past year.


    "Electricity is cheaper at night, so it makes sense for businesses to have third-shift
    zombly crews working factories and assembly lines, cleaning, trimming corporate
    lawns – the possibilities are endless," says Rudge.


    "But zombly present unique management challenges: they''re not very bright, and
    they crave living flesh. Normal managers stand a good chance of having their heads
    cracked open when their z-crews get hungry. Vampires are in demand largely because
    they don''t smell very good to the zombombies. The z-crews listen to vampires
    instead of trying to get their sweet, juicy brains.


    Financial analyst Bentley Chazworth says vampirism is no passing fad.


    ![](img/582e6f49f5ffe20b2ab3795d619f8453_59_0.png)


    L U C Y A. S N Y D R


    “Let’s face it, domestic zombie workers are cheaper than Chinese orphans. With
    a couple of cow brains and a vampire, you can run a windowless zombie call center
    around the clock. But you’ve got to have that vampire,” he says. “Unless you have
    a degree from a top school like Harvard, the job market’s tight for live workers.
