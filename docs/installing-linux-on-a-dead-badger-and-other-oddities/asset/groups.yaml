    way.”


    # Business Insourcing Offers Life After Death


    Atlanta, G.A — The zombie insourcing movement is revolutionizing the U.S. healthcare
    industry.


    "Medical costs and insurance premiums have been rising 10-20% every year, and
    over 50 million consumers don''t have health coverage" says Ed Rudge, Outreach
    Director for Cybermantic Staffing Solutions Inc. "That means that a whole lot
    of consumers are going to default on their medical bills.


    "In the past," Rudge says that cybermancy has created solutions that benefit both
    families and the medical industry.


    "When an uninsured patient is circling the drain, CSS pays a small fee to the
    hospital or attending physician so we can come in to speak to the families," he
    says.


    "We show them their projected bill and tell them they have two options. First
    option is their loved one dies. Second option is they sign their loved ones to
    a post-mortem labor contract, the bill goes away, and they get to see their loved
    ones on Sundays.


    "Our corporate priests visit the patient shortly before death and perform a ritual
    to download the soul and its memories into a duppy jar,” says Rudge.


    "We’ll raise the body, preserve it, and install the operating system. The soul
    can express itself through the OS via our proprietary software. It gives the zombly
    and their family the sense that they still have an intact personality and free
    will, but our programming controls all their on-the-job behaviors."


    Rudge explained that after a patient’s corpse has been reanimated, CSS contracts
    with employers who pay $3-$4 per hour for the undead employee’s work. Families
    get 15%, and the rest is divided between CSS and the physicians and hospitals
    that were owed money at the time of the patient’s death.


    "Most hospital-raised undead retain fair intelligence and motor skills, and we
    can work 120 hours a week,” Rudge says. “The Sunday reunions I see would just
    warm your heart. Most families are so thrilled to have their loved ones back they
    don’t mind the way they smell one little bit."


    Rudge estimates that most undead workers should be physically sound for ten years
    or so. “Hospitals tell us ten years is the magic number to get most bills paid
    off, so our cybersiritual experts have been working hard to guarantee that our
    zombombies will hold up under extended physical labor conditions. A call drone
    should last much, much longer."


    50-year-old CSS Contractee #1542A, who goes by name “Chip,” expressed dismay over
    his wife’s decision to sign his corpse over to the company.


