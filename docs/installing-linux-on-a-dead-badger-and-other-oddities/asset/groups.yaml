    # Dead Men Don’t Need Coffee Breaks


    Brooklyn, NY – Corporations across North America are eagerly embracing new necrotechnologies
    that enable them to employ the life-challenged.


    "People are still a little uncomfortable with terms like ‘animated corpse,’ admits
    to HR consultant Mindy Axedame. ‘We prefer to refer to it simply as a kind of
    insourcing. We bring in the newly undeceased, which are an incredibly cost-effective
    resource for any company that needs non-managerial labor."


    Rick Flint, CEO of the popular online discount retailer Hawt Shawpz, is thrilled
    with the new employment trend. ‘Just last year, our entire call center was alive.
    We had to pay each of those 200 people $7 or $8 an hour. And they wanted sick
    leave, and health benefits – it was nuts. We only netted 14 million last year;
    I can’t afford frills and absenteeism.’


    But since Hawt Shawpz started insourcing the undeceased, Flint says, the company
    has become vastly more productive. ‘The dead don’t call in sick or slack off on
    Fridays. They don’t complain about rats in the walls. They’re never late, because
    we bus them in from our corporate crypt. It’s great! I can work a zomboyee


