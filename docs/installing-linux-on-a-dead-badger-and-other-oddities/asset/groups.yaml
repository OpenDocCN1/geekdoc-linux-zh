    门。


    我让獾獾跳到了 Runs On Stumps 身上。当獾獾咬住它的后颈时，那只僵尸僵直了，皮肤变得苍白如灰。僵尸那 NecroNled 肉体在獾獾的牙齿和狂暴的爪子下像黏土一样崩塌。


    “干得好！”鲍说道，“其他的死没这么快，因为它们伤得没那么重。”


    我攻击下一只僵尸，它的肩膀只有一个浅浅的散弹枪伤。獾獾的牙齿刺入它的脖子，僵尸咆哮着将獾獾撞向一堆空电脑机箱。我听到扬声器里传出一声沉闷的断裂声，獾獾颤抖了一下。


    屏幕闪烁着：


    # 警告！正在进行脊髓抽取！


    无法进入战斗模式。

    是否通过 IKnowKungFu 继续？(Y/N)


    “开火！开火！开火！”我内心的青少年在吟唱。

    我按下“Y”键，屏幕变红了。獾獾跳起来，向空中升并悬浮在天板板上扫描目标。那只咬断獾獾脊椎的僵尸正像石棉一样剥落，剩下的三只僵尸包围了鲍，他的散弹枪显然卡壳了。


    这时鲍抬头看到了獾獾，用嘴唇嘟动了一句“噢该死”，然后倒在地上，护住头。


    獾獾对着僵尸向下尖叫，下颚咬合和爪子的速度快过了电脑的追踪。它像一把毛茸茸的电锯一样穿透了一只僵尸的头部，又撕碎了其他的。我瞥见鲍在商店后面绝望地爬向寻找掩护的地方。獾獾进进出出，速度越来越快，像一个小小的、毛茸茸死的超人。


    # 警告！即将过载！


    我向 iBook 比了一个“四指礼”，但程序被锁定了。正当我正要按下电源键时，獾獾爆炸了。


    你知道物质是如何转化为能量的吗？我后来发现，NecroNull 之所以埋在 FleshGolem 选项中的原因是，当 IKnowKungFu 引发精神过载时，它会使傀儡中所有仍然活着的物质变成能量。通常是几个细菌细胞，也许是一条垂死的圆线虫。这不足以比拟核武器的威力，但足以创造出一个惊人的爆炸。


    这是 Bug 还是特性？我想这取决于你必须杀死多少僵尸，以及你有多么想让它们消失。


    爆炸声震动了整栋大楼，我被摔倒在地。iBook 啪嗒一声掉在肮脏的地板上，键盘弹出，屏幕变黑。我站起来，小心翼翼地打开门。鲍蜷缩在后门旁，已经昏迷。电脑店完全一片狼藉。烟雾和僵尸血弥漫在浓厚的铁锈色雾气中。窗户碎了，前门被炸飞了。视线内没有一个僵尸。两个穿着粉色工作服的中年妇女站在人行道上，眯着眼睛看向黑暗处。其中一个手里拿着一把莫斯伯（Mossberg）枪。她们的脸和工作服上沾满了烟灰。


    “你还好吗？”年长点的女性喊道。


    “我没关系，但鲍需要救护车，”我回答道，“你们店里有电话吗？”


    “有的，我会告诉那帮伙子的，”她说。花了三天时间才回到文明世界。之后，我做了任何一个好孩子会做的事：我松开了手……的。


    # 僵尸大屠杀


    这是 Bug 还是特性？我想这取决于你必须杀死多少僵尸，以及你有多么想让它们消失。


