    # In The Shadow of the Fryolator


    EMMA LEGRASSE CRANKED the key in her Ford Festiva''s ignition a third time, to
    no avail. She stared through the smeared windshield at the snow-blanketed hood
    and entertained a fleeting daydream of a sweet frosted fairyland ruled by a benevolent
    Jelly Donut King. Dismissing her snappy fancy, she opened her phone and called
    her boyfriend.

    “Yo,” answered Benny, far too loudly. She could hear him typing furiously. A dragon
    roared through his computer speakers. “Sup, Em?”

    “Hi honey, my car won’t start—”

    “More Do’Ts! More Do’Ts! Don’t go near the whelps, dumbass!” Benny screamed in
    her car. Through the ringing she heard a fireball woosh and a computerized voice
    groan in death. “What an idiot! Uh, whanja say?”

    “My car. Won’t start. I’m kinda stranded here at the diner. Could you come pick
    me up, please?”

    “Sure, I guess, after the raid,” he replied, his voice flush with indifference.

    “After?” The darned raids lasted forever. There wasn’t a bus, and a cab would
    be at least $50. She'
  - '[PAGE 93]


    wouldn’t get home until after midnight. “Honey, please, I’ve been cooking for
    10 hours straight, and I’ve got to be back here at 8 a.m.—”


    “Em, we’ve gotten wiped in this dungeon twice— we gotta take Zirconia out this
    time! I’m talking; I can’t leave now! Look, I’ll see you later. Gimme a call if
    you catch a ride or somethin’”


    The line went dead. Emma managed to resist smashing her cell phone against the
    dashboard in frustration. Heaven forbid she ever got pregnant from her Mountain
    Dew-addled sperm—she’d have to call a cab if she went into labor on a game night.


    Why do I put up with this? she wondered, then almost immediately heard the echoes
    of her mother’s lectures that a girl had to have a man in her life, that men weren’t
    perfect, that a good girl made to do with what she got.


    Criminy. Benny was preferable to her mother’s hand-wringing and dire tales about
    the fate of single women. If Emma reported a breakup, her mother inevitably brought
    up the urban legend about the elderly woman who was devoured by rats the day after
    her divorce. That story never got old.


    She dropped the phone and her car keys back in her purse and rubbed her numb hands
    on her black pants, staring balefully at the snowy hood. Cars weren’t rocket science,
    no matter what her ex-boyfriend from Flint had tried to convince her. Changing
    a spark plug was easier than building a computer—which she had done, thankyouverymuch—or
    even just making a really good risotto.


    Emma yanked the hood release and heaved the door open. The mucus in her nose froze
    with her first


