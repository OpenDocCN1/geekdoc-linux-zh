    你的獾受了某种脑损伤，你可以尝试修改后的安装，但那真的非常棘手。而且狂犬病让整件事变得像场赌博。在尝试之前，读读那该死的手册吧。


    当死死的拳头猛烈敲击着保护电脑商店前窗的胶胶板时，我的心猛地跳了一下。我听不到隔壁传来的任何声音；我希望这意味着里面的女人已经赶走了攻击者。


    “别管那个没关系；即使他们穿过了木板，还得穿过窗上的栅栏。我们有的是时间。”


    鲍布从桌里掏出一张卷起来的小块羊皮纸。“这里面有系统配置信息、灵魂程序组件和你的密码。你得把这些全部写在圣的羊皮纸上，用类似以诺克文（Enochian）或灵魂脚本（SoulScript）之类的字体。写整齐。卷起来，塞进獾的喉咙，一直到胃子里。”他用螺丝刀示范了一下。


    僵尸仍然在捣弄胶胶板。其中几只发现了一个松动的边缘，正用力将一块板从砖墙上拉下来。一只僵尸把灰色的手臂插进栅栏间。玻璃破裂了，碎片掉了一地。


    我的手抖得厉害没法做笔记，于是把 Treo 放在一边，从大腿口袋里掏出贝雷塔手枪。我的状态也不怎么能打准。


    “你现在还用不上那个，”鲍布锐地说道，显然他对我停止记笔记感到不耐烦。“那些栅栏挡它们比你手里那把小气枪管用。”


    # 露·斯尼（LUCY SNYER）


    我不情愿把手枪插回腰带，捡起 Treo。

    他打开 VüDü 盒子，掏出一卷散发着草本香气的纸。“这是 VüDü 背后的全部代码。”他把它折成了小野兽的形状。


    他展开卷轴，开始把它折成


    ![](img/582e6f49f5ffe20b2ab3795d619f8453_78_0.png)


    一个像獾一样的折纸形状。“自己做纸真的很难，所以别弄丢了。在这类东西上，开源只能带你走很短一段。”


    僵尸已经把窗上的第一块胶胶板完全扯掉了。三只僵尸正吼着并晃动栅栏，其他的在敲击和拉扯剩下的板子。我的胃像拧成了一个酸性的结块；那些栅栏看起来真没那么结实。每当用力一次，我都能看到空心砖里的螺栓在松动，只有那么一点点。我


    # 大 VÜDU LINUX 英国青少年僵尸大屠杀


    在想如果我往后门冲出去，能坚持多远。


    我在心里咒了温迪一千次。一次假期加一台新电脑甚至根本无法弥补这趟旅程。


    鲍布正心不在经地忽略那些僵尸。弄完折纸獾后，他用獾的血在纸上涂了一个一尺宽的五角星。他把尸体放在顶端，把折纸獾放在中间。


    “现在，烧掉这张纸，念上你的咒语。”他拿出打火机，打开 VüDü 手册，一边点燃纸张一边开始念唱。明亮的绿色火焰喷薄而出，烟雾环绕着獾的尸体。我们看着烟雾流进獾的口和鼻。它在呼吸时颤抖了一下。


    “我们搞定獾了！”他掏出橘色的 iPad 开始疯狂地敲击字。


    獾试图爬起来，它僵硬的腿像哈利·鲍豪森的定格动画一样抽动着。它抬起头朝我们吼着，露出长长的犬齿。它听起来更像是一只愤怒的灰熊熊；我不认为某种小小的东西能产生这样的威胁。我向后退了一步，以防万一。


    “这就是为什么我们管它们叫獾，小姑娘……当它们发疯的时候……”


