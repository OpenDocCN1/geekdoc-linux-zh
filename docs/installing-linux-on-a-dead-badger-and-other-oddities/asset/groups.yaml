    \ forms of writing that were completely new to her.\n\nIn early 2004, an E2 user\
    \ posted instructions for installing Linux on an extremely obsolete piece of hardware.\
    \ In the site's chat room, another user sarcastically commented, \"What's he going\
    \ to do next, tell us how to install Linux on a dead badger?\"\n\nLucy, who'd\
    \ been reading reams of bad technical documentation for her web design jobs, was\
    \ much amused by the notion. How would you install Linux on a dead badger? What\
    \ flavor would you use? What would a Linux-powered badger be good for?\n\nShe\
    \ posted \"How to Install Linux on a Dead Badger\", and it quickly became a site\
    \ favorite. Later, she revised the piece and sold it to the articles department\
