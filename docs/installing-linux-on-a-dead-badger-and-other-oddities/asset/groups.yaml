    Infinity will get me back on the front lines with my buddies.”


    Pike’s Infinity Labor recruiter, Rusty Tiburon, praises the young Marine’s decision
    and hopes other servicemen and women will follow suit. “Now that we have the technology,
    it’s downright un-American to just lay there and rot when you could be doing your
