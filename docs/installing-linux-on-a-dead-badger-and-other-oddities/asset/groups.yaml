    “我想，为什么不为分布式进程建立一个獾鼬的网络集群呢？”


    Retinoid 和他的朋友们最初在找不到另一只獾鼬时一头雾水。


    “但后来，我妹妹养的那只吉奇被我们邻居的猫杀了，我们就在想，‘为什么不能呢？’”Retinoid 说，“事实证明，只要你懂得如何破解代码，Linux 几乎可以在任何破东西上安装。我们编写了小
    ChiChi 让它伴着 Kid Rock 的 MP3 歌曲唱歌，并带着它参加了下一次局域网派对。大家都迷死它了！”


    Retinoid 和他的死党“Pork_Sashimi”在那个夏天构建了一个“活化路尸冗余阵列（RARR）”。


    “`The_RARR` 简直酷毙了，”Pork_Sashimi 说，“我们让它全天候地运行死亡对决和播放电影。后来，我们在一只死负鼠身上安装了摄像头视频接口，我们就能远程控制它进入街角那所女学生学院的通风管道里了。没错，宝贝们！”


    十六岁的“DoomBarbie”说她在在线聊天室里遇到了 Pork_Sashimi。“他满脑子性别歧视之类的，一直要我发自己脱光衣服的 JPEG 照片。他甚至追踪了我的
    IP 地址，把那只‘猫咪负鼠’送到了我家里。你能相信这居然让他报了应吗，”


    LUCY SYNDER


    Pork_Sashimi 完全向我道歉了！他承认自己自得其报，并对表现得像个傻瓜一样表示歉。这种事在内网上发生的频率有多高呢？


    对她的黑客技术留印象深刻，Pork_Sashimi 招募 DoomBarbie 加入了“管道（The Pipes）”。她的出现很快结束了他们的虚拟窥淫癖。


    “我并不是介意色情片之类的，”她说。

    但他们对从一只派进脱衣舞场的老鼠身上拍到的那些模糊的视频赞叹绝口，而我只是开始对着那些假胸大肆其舌。我说：‘那个是假的，那个也是假的，你甚至能看到那个上面的接痕！’我猜在那之后他们就没那么好玩了。


    然而，当 23 岁的 MIT 退学学生 Hoonboi 博士加入小组并接手领导时，更大的犯罪正向他们席面浮来。


    “黑客们爱我，因为他们知道我会写代码，”Dr. Hoonboi 说，“这些孩子本很有潜力，但在我出现之前他们一直在虚耗天赋。”


    Dr. Hoonboi 拒绝详细描述他小组的战绩，但 Brasslathe 特工对该帮派提出了严厉指控。


    “我们将他们与佛特蒙州的一些事件联系在一起，在那些事件中，FBI 特工在执行《爱国法》调查期间遭到了攻击，”Brasslathe 说。


    “我们的特工正在没收几家图书馆的记录，以确定哪些读者正在阅读查克·帕拉尼克、威廉·吉布斯以及其他恐怖分子同情文学作者的作品，”他说。


    根据 Brasslathe 的说法，特工们正在制服


    ## 关注的当局


    ![](img/582e6f49f5ffe20b2ab3795d619f8453_27_0.png)


    图书员，当几十只松鼠突然从空调通风口涌而出时。一些松鼠疯狂袭击特工，另一些松鼠则在撕碎记录。


    “松鼠比大多数人想象的要凶残得多，”Brasslathe 解释道，“由于松鼠咬伤，两名特工感染了苏门特拉猴子热，这显然在僵尸化的野外动物中非常常见。这些特工仍在精神收院等待脑移植。”


    儿童图书管理员 April Easley 正准备向一群学前儿童朗读故事时，FBI 搜查了她的工作场所。


    “那些穿西装的家伙冲进来索我们要我们的借阅记录，我们说：‘不，没门。’于是他们掏出了枪和胡椒喷。阳光明媚的周六故事时间完全被毁了，”她哀叹道。


    ## LUCY A. SYNDER


    “当我们的助手 Bobby 被锁住脖子并按在地上摔跤时，松鼠突然凭空冲了出来。那些毛茸茸的小家伙完全让那些 FBI 哥们大开了眼界。我们所有的图书员都在欢呼：‘噢，上吧松鼠！’”


    “孩子们那天学到了重要的一课：它们看起来可能很可爱惹人怜，但千万别惹怒松鼠，”Easley 说。


    “下周我们的读者将投票选出一个新的图书馆吉祥物，我确信‘速读松鼠（Speedreader Squirrel）’会赢过‘书虫本尼’的，”她说道。


    Brasslathe 对像 Easley 这样把僵尸鼠攻击视为英雄行为的人感到不悦。“像 Dr. Hoonboi 这样的人类是对美国自由的威胁。今天他在干扰恐怖主义调查。谁知道他明天会做什么？”


    Dr. Hoonboi 否认向 FBI 释放了僵尸松鼠。


    “我本人更是个兔子控，”Dr. Hoonboi 说，“如果他们有真正的证据，尽管放来。否则他们应该换个新牌子的肥料了。他们很幸运我有这样一个完全专注的禅师，正忙于修禅而没空请律师。”


    每当“管道”成员聚会时，Dr. Hoonboi 都会进行打气：“在我发现那只死獾鼬的真相之前，我还是个孩子，坐在黑暗中玩着幼稚的东西。但 Linux 让我变成了一个男人，并开启了我的视野，通向一个充满无限可能、阳光明媚的世界。”


    “时候了，”Dr. Hoonboi 经常告诉“管道”成员，“让极客来继承地球吧。”


    ## 关注的当局


    ## 你的公司网络与黑暗力量


    纽约，纽约 – 赛博术（Cybermancy）是目前最热门的新趋势。全球范围内的公司正急于部署赛博术策略，以通向利润的大门。


    “这是一件大好事吗？”Mindy Axedame 说，她为许多财富 500 强公司提供咨询。“这些技术允许与死者交流。这意义太大了。如果一个关键员工心脏病发作，你现在可以询问那些通常会随之消失的问题，”Axedame
    说。


    “但这超出了会议室通灵（Ouija）的范畴——你可以让死人工作！或者运尸体来招募。这极具成本效益。”


    Axedame 同意，这种技术提供了尚未获得公众认可或法律的解决方案。“对于联邦政府来说，僵尸工人处于灰色地带。而且可以打赌工会会反对。但由于你不需要支付最低


    ![](img/582e6f49f5ffe20b2ab3795d619f8453_31_0.png)


    最低工资


    她很快指出，赛博术不仅仅是将尸体变成资产。“这些新技术让公司与某些令人兴奋的跨维度资源进行接口。就在上周，我的一个客户将系统连接到了 Ngoleth 之云——它是一个存在于我们相邻维度的集体意识。股市预测的流入使我的客户裁减了
    30% 以上的技术人员。”


    Axedame 预计与超自然资源建立网络将为公司节省大量资金。“噢，这些实体给出的预言简直是纯金。我的客户将摆脱许多高薪职位，”她说，“说真的，云只需要小猫咪作为报酬。而且猫咪比图书员便宜得多！当你的电脑连接着掌控宇宙黑暗秘密的生物时，谁还需要公司图书馆？”


    但随着这一新技术边界的兴起，计算机网络的物理和精神安全——以及维护它们的人——变得至关重要。


    密斯卡托尼亚大学信息科学（CIS）部门主任 Erwin Mandrake 教授特别担心公司做出冲动的网络决策。“大多数人没有意识到，即使是简单的 Aetherweb
    局域网对 IT 员工来说也面临着真正危险的挑战，”他说，“但与 Ichornet 相比，带有所有怪癖和陷阱的 Aetherweb 就像小兔子一样安全。”


    Mandrake 对 Ichornet 近期的流行感到特别愤愤。“从第一天起，它就写满了‘坏主意’三个字。”


    Zerical, Inc. 的网络工程师 Billy Winkler 和他的同事曾期待安装 Ichornet。“该死，是的，它看起来是个很棒的产品，”他在病床上说道，“部署它比建立无线网络更快、更简单，而且它领先于”

