  md: '# Authorities Concerned Over Rise of Teen Linux Gangs


    Boston, M.1 — On Friday evenings, scruffy bands of teenagers gather in alleys
    behind Micro Centers, Best Buys, and Apple Stores across the country. Going by
    names like “Team Mayhem” and “The Pipes,” the Bawls-swigging teens trade Linux
    installation advice, brag about their video game prowess, and sneer at authorities.


    “We’re very concerned about what these kids are doing in their spare time,” says
    FBI spokesman Mark Brasslathe. “Just a few years ago, they would have been safe
    in their parents'' basements with their PlayStations, but cybernancy has changed
    that all. Now they’re fast becoming a threat to the public welfare.”


    One young gangster, who goes by the name “Retinoid,” agrees that cyberspace technologies
    have radically changed the teen geek community.


    “Two years ago, I installed Linux on my first dead badger,” says Retoid, who sports
    an orange Tux Penguin tee shirt that marks him as a member of The Pipes. “It was
    just wicked cool. We ran a warez FTP site off it and everything. But trying to
    run a game server on it was slower than an ice cream truck. So we'
