  md: 'MALCOLM MCCLINTON has been drawing and painting science fiction and fantasy
    subjects as long as he can remember. But until nine years ago, illustrating was
    only a hobby, something he would do to relax. Most of his efforts had been in
    academia, where he earned advanced degrees in physical anthropology and archaeology.
    But after spending five or six years laboring at excavation sites, he burned out
    and subsequently took a job at Dark Horse Comics doing production work.


    This career change reignited his creative drive and after three years he left
    to pursue his own painting and projects. He has been illustrating as a means of
    making a living ever since. He has created a nice little niche for himself that
    satisfies his natural anti-authoritarianism, his reclusive nature and his need
    for adulation all at once.


    For more information about Malcolm, please visit: hanged-man.deviantart.com'
