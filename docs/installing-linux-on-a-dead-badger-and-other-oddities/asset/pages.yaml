  md: '# About the Author


    LUCY A. SNYDER grew up in the cowboys-and-cactus part of Texas. Although the kids
    got a school holiday whenever the rodeo came to town, young Lucy yearned to live
    in a land that featured more seasons and fewer cases of sunstroke. Her first attempts
    at poetry were inspired by the escape of her beloved pet tarantula during a 4th
    grade field trip:


    > I had a big fuzzy spider

    I named him Mister Squissy

    He got loose on the schoolbus

    He''s not in your lunchbox, is he?


    Still fascinated with spiders as an adult, she earned a BS in biology and intended
    to become a scientist. Unfortunately, she discovered in her senior year that she
    was horribly bad at electrophoresis. Still determined to experience autumn and
    spring, she moved to Bloomington, Indiana to get her MA in journalism. She figured
    that if she couldn''t do science, at least she could write about it in newspapers
    and'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'Soon after she moved into the dorm, she made her first science fiction short
    story sale.


    Thrilled, she reded herself to fiction writing, and two years later she got into
    the Clarion Science Fiction & Fantasy Writers'' Workshop in East Lansing, Michigan.
    At Clarion, she learned a great deal about plot, characterization, and the importance
    of keeping business receipts. But near the end of the workshop, she made the mistake
    of turning in a funny fantasy story. The instructor that week began his evaluation
    of her tale thusly: "This story represents everything that''s wrong with the science
    fiction and fantasy being written today..."


    His criticism didn''t get kinder. Afterward, Lucy naturally figured that humor
    was right up there with electrophoresis on the list of things she should never
    try again. So, she spent the next few years designing web sites, editing for various
    online magazines, and trying to write the best, most serious speculative fiction
    she possibly could.


    That changed in 2002 when she discovered an site called Everything2.com. At E2,
    she discovered she could write about pretty much any weird thing that popped into
    her head, and she would find an interested audience for it. Setting aside concerns
    about producing sellable stories, Lucy began to experiment with forms of writing
    that were completely new to her.


    In early 2004, an E2 user posted instructions for installing Linux on an extremely
    obsolete piece of hardware. In the site''s chat room, another user sarcastically
    commented, "What''s he going to do next,"'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'tell us how to install Linux on a dead badger?


    Lucy, who''d been reading reams of bad technical documentation for her web design
    jobs, was much amused by the notion. How would you install Linux on a dead badger?
    What flavor would you use? What would a Linux-powered badger be good for?


    She posted "How to Install Linux on a Dead Badger", and it quickly became a site
    favorite. Later, she revised the piece and sold it to the articles department
    at Strange Horizons, which expanded version got linked from the popular Slashdot
    site, resulting in a huge surge of traffic for the magazine. Even today, "Installing
    Linux on a Dead Badger: User''s Notes" is still one of the most popular features
    at SH.


    Lucy has continued to write and sell funny stories. Today, nearly half of her
    40+ published short stories and many of her published essays contain elements
    of satire or other strong humor. Several of her non-badger humor pieces appear
    in her first collection, Sparks and Shadows, which was published by HW Press in
    May 2007.


    For more information about Lucy, please visit: www.lucysnydercom.com'
