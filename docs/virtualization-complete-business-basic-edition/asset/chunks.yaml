    `Initial Template`(pictured below). When finished click `Save`.


    ![](images/00278.jpg)


    Now we''ll test the new `Authentication Server`. Select the server under the `Settings`
    tab the click `Save and Test`(shown below).


    ![](images/00310.jpg)


    The test should run successfully as shown below. If not, re-check your settings
    and try again. When finished click `Close`(pictured below).


    ![](images/00064.jpg)


    To maintain the highest level of security we only want `Zentyal` Authenticating
    `VPN Users`. Make sure to change `Authentication Server` back to `Local Database`
    after the test(shown below).


    ![](images/00308.jpg)


    The final step is to enable the `Zentyal` server as a `Backend` for authentication
    in the `OpenVPN` server. To do this click `VPN>OpenVPN` then edit the server making
    sure the new `Zentyal Server` is highlighted as shown below. When finished don''t
    forget to save the changes!


    ![](images/00268.jpg)


    ## 2.10-Snort IDS


    A critical component of any modern business network is intrusion detection or
    `IDS`. When it comes to `IDS`, `Snort` is the most popular package used today!
    The concept behind `IDS` is to monitor transmission protocols for uncharacteristic
    behavior and then kill the connection when this behavior is detected. This is
    precisely the way `Antivirus` and `Malware` providers find new threats and create
    updates to counter those threats.


    Most `IDS` systems are setup to monitor external connections by default. My recommendation
    is to monitor your internal connections instead. This method catches malicious
    code that can be brought in through portable devices such as smart-phones and
    USB thumb drives.


    NOTE: `Snort` can be rather complicated to setup for those unfamiliar with it.
    This will be a quick run-through do to the many configuration options, so please
    make sure to duplicate my settings exactly! Let''s get `Snort` working now!


    ### 2.10.1-Install Snort Package


    To begin: click `System>Packages`(shown below).


    ![](images/00156.jpg)


    If you do not see `Snort` under `Installed Packages` download and install it under
    the `Available Packages` tab(pictured below).


    ![](images/00251.jpg)


    Once the package is installed click `Services>Snort`(pictured below).


    ![](images/00135.jpg)


    ### 2.10.2-Snort Global Settings


    Under the `Global Settings` tab(shown below) make sure `Emerging Threats` is checked.


    ![](images/0291.jpg)


    ### 2.10.3-Snort Interfaces


    Under the `Snort Interfaces` tab add an interface by clicking the `+` button.
    Since we have configured the `LAN` interface for monitoring we will the `LAN`
    interface.


    ![](images/0298.jpg)

    ![](images/0275.jpg)


    ### 2.10.4-Updating Threat Rules


    Under the `Updates` tab(shown below) simply click the `Update` button in the middle
    of the page.


    ![](images/00234.jpg)


    ### 2.10.5-Threat Rule Categories


    Threat rule categories are specific to the selected interface. Since we have configured
    the `LAN` interface for monitoring you must edit that specific interface by clicking
    the `edit(e)` button on the right under the `Snort Interfaces` tab. Next, click
    the `LAN Categories` tab and select ONLY the rules shown below.


    ![](images/00260.jpg)

    ![](images/00149.jpg)

    ![](images/00155.jpg)

    ![](images/00365.jpg)


    ### 2.10.6-Add Alerts To Suppression List


    Once `snort` is running you WILL start seeing alerts as seen in the list below.
    You can add low-risk alerts to the suppression list by clicking the `plus(+)`
    button in the `SID` column(shown below).


    ![](images/00288.jpg)


    ### 2.10.7-Block Offenders At Source


    Once you have monitored your normal network traffic and established a suppression
    list it''s time to let `Snort` work. You can now go back to the `Snort Interface`
    settings and enable offenders to be blocked at the source.

