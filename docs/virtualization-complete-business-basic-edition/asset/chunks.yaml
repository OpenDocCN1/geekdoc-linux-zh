    ## 2.9.4-Authenticate Zentyal Domain Users


    Now that we have a VPN server let''s configure it so Domain users can authenticate
    and use it! To do this you first need to have `Zentyal` installed as covered in
    [Book 4: Zentyal Domain Controller](#index_split_054.html_filepos220923)


    With `Zentyal` installed let''s proceed by clicking `System>User Manager`(shown
    below).


    ![](images/00272.jpg)


    Next, click the `Servers` tab(shown below). Notice: the list below is already
    pre-populated with `ZentyalDC1` for your reference. Your installation should only
    show the `Local Database` at this point.


    To add a new server click the `+` Button(shown below).


    ![](images/00337.jpg)


    Next, you will need to enter your `Zentyal Domain Controller` information(shown
    below). NOTICE: The `Base DN` syntax must be entered exactly. If your domain is
    `xyz.com` then the `Base DN` should be `DC=xyz,DC=com` or it will NOT work. This
