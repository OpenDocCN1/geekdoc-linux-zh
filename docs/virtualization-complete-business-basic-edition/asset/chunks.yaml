  trans: '


    请注意：Proxmox 默认使用安全端口 `8006`。


    你的输入应该类似于此：


    https://192.168.10.2:8006


    随后你将看到如下所示的安全连接警告。点击 `I Understand the Risks`（我了解风险）。


    ![](img/00355.jpg)


    下一步：点击如下所示的 `Add Exception`（添加异常）。


    ![](img/00001.jpg)


    然后：点击如下所示的 `Confirm Security Exception`（确认安全异常）。


    ![](img/00026.jpg)


    现在使用用户 `root` 和你在安装期间设置的密码登录。


    ![](img/00088.jpg)


    Proxmox VE 是社区版，但你可以选择一个订阅账户以获得全方位支持。这并非必须的，但每次登录时你都会看到订阅提醒（如下所示）。我觉得 Proxmox
    是一款非常优秀的软件，真的并不介意看到弹出提醒！毕竟！它是免费的！


    ![](img/00327.jpg)


    你现在将看到 Web 管理界面（如下所示）。你将在这里创建和配置你的虚拟机。


    ![](img/00114.jpg)


    ## 1.4-网络适配器


    现在你需要配置网络适配器，以便它们可以用于你创建的任何虚拟机（VM）。注意，在默认视图（数据中心视图）中不显示网络选项卡。你必须在节点视图（node view）中才能看到网络选项卡。在下所示的情况下，节点名为
    `proxmox5`。


    点击节点（如下所示）


    ![](img/00328.jpg)


    点击如下所示的 `Network`（网络）选项卡


    ![](img/00299.jpg)


    点击如下所示的 `Create >> Linux Bridge`（创建 >> Linux 网桥）


    ![](img/00091.jpg)


    你现在将看到 Linux 网桥对话框（如下所示）。为你为每个网络适配器创建一个网桥。你可以看到（在本指南中）我使用了行业标准命名约定填充表格，并保持了 `eth(x)`
    和 `vmbr(x)` 端口之间的 1:1 关系。对于初次用户，我建议遵循这一规则，但你也可以轻松地映射为 `vmbr1 >> eth2`。系统中只有一个默认互联网网关，它在安装期间已预配置并由
    `vmbr0` 使用，因此请将此字段留空。


    **注意：** 对于 IP 地址字段，请确保使用系统中不会被使用的子网（例如 `10.10.x.x`）。同时，请确保为你选择的 IP 地址范围使用适当的子网掩码。如果你不网络地址划分，请
    Google CIDR 获取更多信息。网络工程的复杂性超出了本分步指南的范围，但互联网上有很多丰富的知识。


    完成后，点击 `Create`（创建）


    ![](img/00213.jpg)


    **注意：** 对你希望在新 Proxmox 服务器上使用的每个适配器重复上述步骤。例如：`vmbr2 >> eth2 @ 10.10.30.2/255.255.255.0`


    更改在系统重启之前不会生效。


    使用节点视图右上角的按钮立即重启（你应该已经处于节点视图中了）。


    ![](img/00301.jpg)


    当系统完成重启后，屏幕应该会自动刷新。如果活动列中出现 `yes` 值（如下所示），你就可以验证你的虚拟接口已就绪。再次对你打算使用的网络适配器重复此过程。你可以看到我有
    3 个物理适配器，但只有 2 个已配置并准备就绪。


    ![](img/00349.jpg)


    ## 1.5-添加 LVM 存储


    在添加 LVM 存储之前，你需要安装 `PuTTY`。PuTTY 是一个很好的开源控制台，允许通过 SSH（安全外）访问其他计算机。你可以在此处下载：[PuTTY
    控制台](http://www.chiark.greenend.org.uk/~sgtatham/putty/download.html)


    安装完成后，打开它，检查 SSH 连接，输入你的 Proxmox 服务器的 IP 地址，然后点击 `Open`。


    ![](img/00102.jpg)


    针对如下所示的 PuTTY 安全警报点击 `Yes`


    ![](img/00002.jpg)


    使用用户 `root` 和你在安装 Proxmox 时设置的密码登录


    现在输入以下命令：


    ```

    cat /proc/partitions

    ```


    ![](img/00077.jpg)


    此命令将生成如下所示的硬盘设备列表。我们对一个看起来尚未投入的新设备感兴趣。如下所示，唯一可能的设备是 `/dev/sdb`，因为它完全没有分区。现在我们有足够的信息用该磁盘设置逻辑设备了。


    ![](img/00137.jpg)


    现在你已经知道要使用哪块磁盘，可以使用以下命令创建物理卷（PV）：


    ```bash

    pvcreate /dev/sdb

    ```


    ![](img/00209.jpg)


    你现在将看到物理卷确认


    ![](img/00335.jpg)


    现在你已经知道要使用哪块磁盘，可以使用以下命令创建卷组（VG）：


    ```bash

    vgcreate lvstorage /dev/sdb

    ```


    ![](img/0036.jpg)


    你现在将看到卷组确认


    ![](img/00199.jpg)


    完成后，你可以关闭 PuTTY 程序。


    Proxmox VE 是社区版，但你可以选择一个订阅账户以获得全方位支持。这并非必须的，但每次登录时你都会看到订阅提醒（如下所示）。我觉得 Proxmox
    是一款非常优秀的软件，真的并不介意看到弹出提醒！毕竟！它是免费的！


    ![](img/00327.jpg)


    你现在将看到 Web 管理界面（如下所示）。你将在这里创建和配置你的虚拟机。


    ![](img/00114.jpg)


    ## 1.6-配置 LVM 存储


    现在你已经通过命令行添加了卷组，是时候配置它在 Proxmox 中如何使用了。这里需要注意的一点是（在本指南中）通过 Web 界面使用的 LVM 存储将用于虚拟机镜像。


    开始之前，请确保在数据中心视图，然后点击 `Storage`（存储）选项卡（如下所示）。接着点击 `Add >> LVM`（如下所示）。


    ![](img/0068.jpg)


    你现在应该看到 LVM 对话框（如下所示）。现在可以选择你使用 PuTTY 创建的 `lvstorage` 卷组。为 `ID` 字段输入一个唯一的名称（如下所示）。


    完成后：点击 `Add`（添加）。


    ![](img/0125.jpg)


    你现在应该在树形视图中看到新的 LVM 存储（如下所示）。点击 `summary` 选项卡显示你新存储的可用大小（如下所示）。


    ![](img/0330.jpg)


    ## 1.7-配置 NFS 存储


    NFS 可能是你使用的所有存储类型中最多的一种。它是一种基于网络的存储，因此你需要在本地子网中配置 NAS 才能使用它。在 Proxmox 中，NFS 可镜像、备份、模板、ISO
    和容器存储。多年来，我广泛测试了 Proxmox 中所有类型的存储。如之前提到的，我本地镜像存储的首选是基于 LVM 的！嗯，我对网络后端存储的偏好是 NFS！它提供了可媲拟
    iSCSI 的性能，但没有任何复杂性。


    '
- fmt: "\nIn this section I will demonstrate the configuration of an existing NFS\
    \ share to be used for VM backup archives. In production you will probably want(at\
    \ least) an additional share for CD/DVD ISO files. Backups and ISO's are the ones\
