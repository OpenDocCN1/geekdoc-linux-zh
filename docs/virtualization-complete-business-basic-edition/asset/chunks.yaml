    To proceed:  click Add CIFS Share(pictured below).


    ![](images/00069.jpg)  


    Start by typing an appropriate Name and selecting the dataset Path as shown below!


    ![](images/00123.jpg)  


    Now, enter a comment if you wish and set all other options according to your needs.
     Notice that I have set this share to Read Only and Browsable to Network Clients(shown
    below).


