  trans: "\n\n注意：由于 WAN 端口对 Mac 地址有特殊匹配要求，你无法将这些适配器与其他虚拟机（VM）共享。解决方案是计划使用哪些 Proxmox\
    \ 服务器来运行路由器实例，然后仅为这些机器添加额外的网络适配器。为了能够轻松移动你的互联网网关，这点小小的代价是完全值得的。\n\n你还可能使用一个小型的\
    \ 5 口交换机来实现路由网关的离线迁移。只需选择另一个你想用于 `pfSense` 冷备份（关机状态）的 Proxmox 服务器，在该机器上重复地址匹配程序，并与你运行中的\
    \ `pfSense` 以及你的入站互联网连接一起插入 5 口交换机中即可。\n\n总结一下：你的入站互联网连接插入到 5 口交换机，每个 `pfSense`\
    \ 虚拟机的 WAN 端口也连接到该交换机。更多信息请参阅 `(Option-3) 简单的离线路由器迁移`。\n\n### DMZ 和 WAN2\n我不建议在完成初始\
    \ `pfSense` 安装之前安装这些额外的适配器。如果你遵循这本完整指南，那么 DMZ 至少还需要另外一个虚拟适配器。当那个时候来临时，只需返回本节并重复添加新网络适配器的过程即可。\n\
    \n现在你的配置已经完成，你需要知道如何启动它。只需在节点树中选择该虚拟机，并点击右上角的启动按钮即可。或者，如果你正在安装操作系统，你可能希望选择控制台以便响应提示。只需点击控制台中的启动选项（如下所示）。一旦你的虚拟机启动，它看起来就像任何其他操作系统启动一样。如要遵循\
    \ `pfSense` 的安装步骤，请点击此处：`第 2 卷：pfSense` \n\n![](img/00348.jpg)\n\n### 1.10-虚拟机备份与恢复\n\
    请利用早早在 `.3-最佳实践` 中提到的以下信息。\n\n#### 简化的灾难恢复\n如果你的任何 Proxmox 服务器发生故障，最要恢复的项**永远**是你的虚拟机镜像备份。将它们视为“主恢复镜像”！没有了这些，你就迷失了，因此尽可能拥有多个副本至关重要！\n\
    \n我首选的方法是选择一个 NAS（虚拟化或独立）作为我的主要虚拟机镜像备份服务器。该服务器将为 Proxmox 托管 `NFS` 镜像备份共享。此共享手动复制（仅在设置期间进行一次）到系统中的所有其他\
    \ NAS 服务器，并使用 `Rsync` 按计划同步。\n\n如果某台机器故障，我可以更换它，重新安装 Proxmox，重新安装任何 NAS 硬盘，重新映射我的\
    \ `NFS` 备份并恢复虚拟机镜像。再次，你将在 15 分钟或更短时间内恢复运行！这种方法非常好，而且经过了时间的考验，非常可靠！\n\n注意：有一个限制！如果提供虚拟机镜像备份的\
    \ NAS 是虚拟化的（例如 `(Option-3) 简单的离线路由器迁移`），它将无法备份自己的虚拟机镜像！简单的解决方法是在另一个空闲的 freeNAS\
    \ 节点上创建一个名为 `netbackups2` 的另一个 `NFS` 共享。再次，我们将使用 `Rsync` 自动将此数据集同步到所有 freeNAS\
    \ 节点。请参阅 `.3.7-系统图` 以深入了解系统架构和流程。\n\n在 U 盘上保留副本：另一个强烈建议的提示是将你的虚拟机镜像备份拷贝到 U 盘或\
    \ DVD 上，然后存储在防火箱箱中。你可以轻松地将虚拟机镜像备份映射为只读的 `samba` 共享，以便从任何 Windows 机器或安卓手机访问。使用\
    \ `.3-最佳实践` 中描述的小空间占用方法，可以确保你的整个虚拟机镜像备份存档都能轻松放入现代的 64-128GB U 盘中。\n\n#### 如何备份你的虚拟机\n\
    Proxmox 为你提供了一个方便的备份界面。只需从节点树视图中选择你想备份的虚拟机，然后点击“备份”选项卡。在最右侧选择你的备份位置，然后点击“立即备份”按钮（如下所示）。\n\
    \n![](img/00295.jpg)\n\n随后你将看到备份对话框（如下所示）。选择你的选项然后点击“备份”。\n\n![](img/00220.jpg)\n\
    \n进度对话框将出现，显示任务的当前状态（如下所示）。就是这样！\n\n![](img/00049.jpg)\n\n注意：镜像备份**永远**是不够的。你仍然想要从虚拟机内部执行传统的备份。重要：我强烈建议你**不要**尝试备份远大于\
    \ 80GB 或使用设备直通（在...中解释）的虚拟机镜像磁盘。\n\n例如：`第 3 卷：freeNAS` 中涵盖的 freeNAS 虚拟机构建。\n\n\
    #### 恢复你的虚拟机\n在节点树中选择你的备份以恢复。在本示例中，我选择了 `NFS`。（images/0271.jpg）一旦选择，你应该能看到存档列表。选择你想恢复的存档。（images/0229.jpg）完成后，点击“恢复”按钮。（images/0284.jpg）一旦进程开始，你将看到任务查看器，可以在那里查看状态。（images/0099.jpg)\n\
    \n### 1.11-虚拟机硬件\n#### 网络适配器\n在某些时刻，你可能想要添加或编辑你的硬件。Proxmox 提供了广泛的选项，包括添加、编辑和删除磁盘以及网络适配器。它还允许对磁盘进行移动、限流和调整大小。你之前已经为\
    \ `pfSense` 添加了网络适配器，所以硬件选项卡并不陌生。\n\n要添加新桥，点击“添加 >> 网络”（images/0062.jpg）。在本示例中我选择了\
    \ `vmbr1`，但可以很容易更改。（images/0031.jpg）现在你将在列表中看到新添加的适配器。\n\nMAC 地址注意：你看到的硬件地址是一个别名，而不是真实的硬件地址！（images/0250.jpg）只需点击硬件选项卡下的编辑按钮，即可更改所选适配器的\
    \ Mac 地址、模型或桥。下面的图 1-3 显示了编辑对话框。\n\n#### 硬盘\n添加硬盘同样简单。让我们为 Zentyal 域控制器创建一个新的\
    \ 32Gb IDE 硬盘。（images/0022.jpg）点击添加 >> 硬盘（images/0033.jpg）。你将看到“添加：硬盘”对话框。注意默认总线是\
    \ `VIRTIO`。`VIRTIO` 是一种高性能驱动，但可能与你的安装不兼容。对于兼容性最好、最简单的总线，我建议使用 `IDE`。注意默认格式是 `Qcow2`。我**始终**使用\
    \ `Raw` 格式！它是性能最高且兼容性最好的格式。此外，保持缓存默认以防止数据丢失！\n\n"
- fmt: "\nOnce added your new disk will appear red until the VM is power-cycled(pictured\
    \ below).\n\n> ![](images/00261.jpg)\n\n## 1.12-Adding Pass-Through Disks\n\n\
    As mentioned in the [.3-Best Practices](#index_split_006.html_filepos28974) section,\
    \ I use hybrid servers. Essentially, you are creating a Proxmox virtualization\
    \ host with a built in NAS server. You install the NAS just like any other VM\
    \ with its OS residing on a virtual disk. However, the actual storage drives will\
    \ reside on physical LVM storage assigned through a technique known as hardware\
    \ pass-through.\n\nThis method allows for a very small backup footprint because\
    \ your only backing up the NAS operating system and NOT the data. It also provides\
    \ moderately better disk throughput for data read/write cycles. I have tested\
    \ sustained throughput rates in the range of 30-60 Megabytes/sec using Gigabit\
    \ adapters. Bonding your adapters does yield better performance but I like to\
    \ keep it simple!\n\nThe biggest advantage is that your data is NOT stored in\
    \ a virtual disk file! Even if you destroy the VM the data remains safe!\n\nNow\
    \ that you have an understanding let's add a 6TB striped volume to a new install\
    \ of freeNAS. As you can see the freeNAS install only has one 8GB IDE disk where\
    \ the OS resides(pictured below).\n\n![](images/00108.jpg)\n\nLet's open PuTTY\
    \ and login as root on your Proxmox server. Then we need to find our disks using\
    \ the following command(pictured below):\n\n```bash\ncat /proc/partitions\n```\n\
    \n![](images/00109.jpg)\n\nAs you can see, the largest disks(picture above) are\
    \ `/dev/sdb` and `/dev/sdc`.\n\nAlso notice that there are `/dev/sdb1` and `/dev/sdc1`\
    \ as well. This indicates a single partition exists on each disk. The partition\
    \ sizes indicate that all available space is not being used. We need to change\
    \ that! To edit `/dev/sdb` type the following command:\n\n```bash\nfdisk /dev/sdb\n\
    ```\n\nYou will now see something like this(pictured below):\n\n![](images/00158.jpg)\n\
    \nNow press: `m` >> `Enter`\n\nYou will see the help screen(shown below). We are\
    \ interested in an creating empty DOS partition table.\n\n![](images/00219.jpg)\n\
    \nNow press: `o` >> `Enter` \n\nFollowed by: `w` >> `Enter`\n\nThis series of\
    \ commands will create a new empty DOS partition table and write changes to disk.\n\
    \nNext we need to repeat these steps for `/dev/sdc`. Do NOT worry about the lack\
    \ of partitions! The beauty of this method is that LVM doesn't care!\n\nLet's\
    \ verify our disks again to ensure the partitions are gone using the following\
    \ command:\n\n```bash\ncat /proc/partitions\n```\n\n![](images/00240.jpg)\n\n\
    As you can see(above), `/dev/sdb` and `/dev/sdc` can now be used to full capacity.\n\
    \nWe will now create LVM physical volumes(PV's) using the following commands:\n\
    \n```bash\npvcreate /dev/sdb\npvcreate /dev/sdc\n```\n\nOR\n\n```bash\npvcreate\
    \ /dev/sd[b,c]\n```\n\n![](images/00226.jpg)\n\nThe output above shows successful\
    \ creation.\n\nNext, we will create a volume group(VG) containing both disks with\
    \ the following command:\n\n```bash\nvgcreate freenas4 /dev/sd[b,c]\n```\n\n![](images/00360.jpg)\n\
    \nThe output above shows our VG created successfully.\n\nFor the final step we\
    \ will create a striped logical volume(LV) using all available space. LVM Striping\
    \ is equivalent to RAID-0 for maximum disk throughput.\n\nType the following command\
    \ to create the stripe:\n\n```bash\nlvcreate -l 100%FREE -i2 -n 6tbstore freenas4\n\
    ```\n\nwhere: `i2`(number of stripe members), `n`(name)\n\n![](images/00089.jpg)\n\
    \nThe above output shows our LV stripe successfully created.\n\nAs I mentioned\
    \ earlier, Linux LVM is extremely powerful and flexible. I would highly recommend\
    \ learning it well. Below are 3 more very useful LVM commands:\n\n```bash\npvscan\n\
    ```\n\nThis command lists ALL known physical volumes(pictured below).\n\n![](images/00087.jpg)\n\
    \n```bash\nvgscan\n```\n\nThis command lists ALL known volume groups(pictured\
    \ below).\n\n![](images/00073.jpg)\n\n```bash\nlvscan\n```\n\nThis command lists\
    \ ALL known logical volumes(pictured below).\n\n![](images/00224.jpg)\n\nYou can\
    \ see the newly created 6TB striped volume above. Now we're ready to assign this\
    \ volume to the freeNAS-4 VM. You will notice the ID number of freeNAS-4 is 800\
    \ and IDE1 or IDE3 is available(pictured below).\n\n![](images/00108.jpg)\n\n\
    To assign the new disk we will issue the special QEMU command as follows:\n\n\
    ```bash\nqm set 800 -ide1 /dev/freenas4/6tbstore\n```\n\nThe command entered into\
    \ PuTTY looks like this(pictured below).\n\n![](images/00132.jpg)\n\nThe output\
    \ above shows our LV stripe successfully created. (Wait, I apologize, the source\
