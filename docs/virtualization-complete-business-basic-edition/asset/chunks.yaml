  trans: "\n在本节中，我将演示如何配置现有的 NFS 共享，以用于虚拟机（VM）备份归档。在生产环境中，你可能（至少）还需要另外一个用于存储 CD/DVD\
    \ ISO 文件的共享。备份和 ISO 文件是我最常需要的！\n\n开始之前，请确保你处于数据中心（Datacenter）视图，然后点击 `Storage`\
    \ 选项卡（如下所示）。\n\n接下来，点击 `Add` >> `NFS`（如下所示）。\n\n![](img/00207.jpg) \n\n现在你应该能看到\
    \ `NFS` 对话框（如下所示）。输入你的 NAS 存储的 IP 地址。为 `ID` 字段输入一个唯一名称（如下所示）。从下拉列表中选择合适的 `NFS\
    \ Export`。你还可以选择每个虚拟机允许的备份存档数量。\n\n完成后：点击 `Add`。\n\n> **NOTE**：通常情况下，我会选择一个指示存储类型的名称，例如\
    \ `NFS_NetBackups`。\n\n![](img/00216.jpg) \n\n你现在应该能在树形视图中看到新的 `NFS` 存储（如下所示）。\n\
    \n![](img/00307.jpg) \n\n## 1.8-配置 iSCSI 存储\n\n本书将介绍的 Proxmox 第三个也是最后一个存储选项是 `iSCSI`。这种存储类型通常由拥有数百台服务器的大型企业使用，其中网络速度是限制因素，且会有周期性的性能波动。由于它是网络后端存储，与专用硬件安装相比，虚拟机性能会受到影响。因此，我不建议将其用于任何关键的生产应用。\n\
    \n尽管它具有网络带来的限制，但它非常灵活，当与高质量硬件配合时，可以产生非常合理的性能。`iSCSI` 的优势在于需要频繁分配临时存储空间的大型测试环境。它可以欺骗操作系统使其认为拥有额外的本地磁盘，因此可能性是无限的。例如：它可以轻松地配置一个基于\
    \ `LVM` 的镜像阵列，映射到特定目录，然后挂载并用于虚拟机镜像、容器、模板等。要学习如何在 freeNAS 中设置 `iSCSI targets`，请点击此处：3.16.3-iSCSI\
    \ Target Shares \n\n要映射 `iSCSI target`，请确保你位于 `Datacenter` >> `Storage` 中，然后点击\
    \ `Add` >> `iSCSI`（如下所示）。\n\n![](img/00122.jpg) \n\n你将看到下面的对话框。输入 `ID` 和 `Portal`\
    \ 信息，然后从下拉列表中选择 `Target`（如下所示）。如果你不想将目标配置为用于挂载的 `LVM disk`，请确保勾选 `Use LUN's directly`\
    \ 选项。\n\n![](img/00124.jpg) \n\n继续：点击 `Add` 按钮（如下所示）。\n\n![](img/00103.jpg) \n\
    \n当目标成功添加后，它将作为一个新的存储设备出现（如下所示）。\n\n![](img/00254.jpg) \n\n你现在应该可以通过节点树中选择它来查看内容信息（如下所示）。\n\
    \n![](img/00106.jpg) \n\n## 1.9-创建虚拟机配置\n\n现在你已经配置好了 Proxmox，可以创建你的第一个虚拟机（VM）了！让我们设置一个\
    \ `pfSense` 路由器配置吧！\n\n开始：点击右上角的 `Create VM`。\n\n![](img/00020.jpg) \n\n现在为你的新虚拟机分配\
    \ `ID` 和 `Name`。\n\n继续：点击 `Next` \n\n![](img/00264.jpg) \n\n接下来，选择 `OS type`。`pfSense`\
    \ 是基于 BSD 的，所以选择 `(other)`。\n\n继续：点击 `Next` \n\n![](img/00255.jpg) \n\n下一步假设你已经设置了\
    \ `ISO storage` 并且正在使用最新版本的 `pfSense-LiveCD`。在本指南中，我使用的是 `2.2.4 Release` 版本。如果你没有任何\
    \ `ISO storage`，可以从节点树视图中点击 `local`，然后上传你的 CD/DVD 镜像。或者，你可以将 ISO 刻录到磁盘，然后选择 `Use\
    \ physical CD/DVD Drive`（如下所示）。\n\n继续：点击 `Next` \n\n![](img/00151.jpg) \n\n接下来，将配置硬盘参数。对于此\
    \ `pfSense` 安装，请使用 `IDE device type` 并配合 `8GB disk`。你可以选择 `local` 或你在本指南中之前配置的\
    \ `lvstorage`。\n\n> **NOTE**：经过广泛测试，我首选的磁盘配置始终是使用 `IDE Bus`、`Raw disk Format`\
    \ 和 `Default Cache` 设置。\n\n完成后：点击 `Next` \n\n![](img/00241.jpg) \n\n现在选择用于处理的\
    \ `CPU cores` 数量。不要设置超过你可用的核心数，否则你的虚拟机将无法启动！对于 `CPU type`，我推荐 `KVM`。在某些情况下，你的虚拟机可能会无法启动。如果是那样，请选择\
    \ `QEMU`。\n\n**SPECIAL CASE**：基于 BSD 的 `pfSense` 是那些**必须**选择 `QEMU` CPU 类型的情况之一。\n\
    \n> **NOTE**：如果你的虚拟机无法启动，通常可以追溯到不正确的 `CPU type`。此外，你通常会选择 `64 bit`，除非你有 `64 bit`。\n"
- fmt: "\nNOTE: Because of this special Mac matching requirement for the WAN ports\
    \ you won't be able to share these adapters with other VM's. The solution is in\
    \ planning which Proxmox servers will be used for router instances then add extra\
    \ network adapters to only those machines. That's a small price to pay for the\
    \ ability to easily move your internet gateway.\n\nIt's also possible to use a\
    \ small 5 port switch to allow offline migration of your routing gateway. Just\
    \ select another Proxmox server you want to use for a `pfSense` cold copy(off-state),\
    \ repeat the address matching procedure on that machine, and plug into the 5 port\
    \ switch along with your live `pfSense` and your incoming internet.\n\nIn summary:\
    \ your incoming internet connection plugs into the 5 port switch and each `pfSense`\
    \ VM WAN port also plugs into that switch. Please see `[(Option-3) Easy Offline\
    \ Router Migration](#index_split_006.html_filepos46754)` for more information.\n\
    \n### DMZ and WAN2\nI don't suggest installing these extra adapters until after\
    \ the initial `pfSense` installation is completed. You will need at least one\
    \ more virtual adapter for DMZ if following this complete guide. When that time\
    \ comes just refer back to this section and repeat the process for adding a new\
    \ network adapter.\n\nNow that your configuration is complete you need to know\
    \ how to boot it. Simply select the VM in the node tree and click the start button\
    \ in the upper right hand corner. Alternatively, if installing an OS you may wish\
    \ to select the console so you can respond to prompts. Just click the start option\
    \ in the console(pictured below). Once your VM starts up it will look like any\
    \ other operating system booting. To follow the install of `pfSense` click here:\
    \ `[Book 2: pfSense](#index_split_021.html_filepos107409)` \n\n![](images/00348.jpg)\n\
    \n### 1.10-VM Backup & Restore\nPlease take advantage of the following information\
    \ as mentioned earlier in `[.3-Best Practices](#index_split_006.html_filepos28974)`.\n\
    \n#### Disaster Recovery Simplified\nIf any of your Proxmox servers go down the\
    \ single most important item to recover will ALWAYS be your VM image backups.\
    \ Think of them as Master Recovery Images! Without these you are lost so it is\
    \ important to have as many copies as possible!\n\nMy preferred method is to select\
    \ a NAS(virtualized or standalone) to use as my primary VM image backup server.\
    \ This server will host the `NFS` image backup share to Proxmox. This share is\
    \ manually replicated(only once during setup) to all other NAS servers in the\
    \ system and synchronized on schedule using `Rsync`.\n\nIf a machine goes down\
    \ I can replace it, re-install Proxmox, re-install any NAS drives, re-map my `NFS`\
    \ backups, and restore the VM images. Once again, you're back running in 15 minutes\
    \ or less! This method has served me very well and is rock solid time tested!\n\
    \nNOTE: There is a caveat! If the NAS serving your VM image backups is virtualized\
    \ such as `[(Option-3) Easy Offline Router Migration](#index_split_006.html_filepos46754)`\
    \ it will not be able to backup its own VM image! The simple work around for this\
    \ is to create another `NFS` netbackups share on a different freeNAS node called\
    \ `netbackups2`. Once again, we will use `Rsync` to automatically synchronize\
    \ this dataset across all freeNAS nodes. Please refer to the `[.3.7-System Diagrams](#index_split_006.html_filepos39206)`\
    \ to gain more insight on system architecture and flow.\n\nKEEP A COPY ON THUMB-DRIVE:\
    \ Another highly recommended tip is to copy your VM image backups to a thumb-drive\
    \ or DVD then store them in a fireproof safe. You can easily map a read-only `samba`\
    \ share of your VM image backups to be accessible from any windows machine or\
    \ android phone. Using the small footprint method described in `[.3-Best Practices](#index_split_006.html_filepos28974)`\
    \ ensures your entire VM image backup archive will easily fit on a modern 64-128GB\
    \ USB thumb-drive.\n\n#### How To Backup Your VM\nProxmox provides you with a\
    \ convenient backup interface. Simply select the VM you wish to backup from the\
    \ node tree view and click the Backup tab. Choose your backup location at the\
    \ far right followed by the Backup Now button(pictured below).\n\n![](images/00295.jpg)\n\
    \nYou will then be presented with the backup dialog(pictured below). Choose your\
    \ options then click Backup.\n\n![](images/00220.jpg)\n\nThe progress dialog will\
    \ appear showing the current status of the job(pictured below). That's it!\n\n\
    ![](images/00049.jpg)\n\nNOTE: Image backups are NEVER enough. You will still\
    \ want to perform traditional backups from within the guest. IMPORTANT: I highly\
    \ recommend that you do NOT try to backup VM image disks that are much larger\
    \ than 80Gb or that use device pass-through(explained in ).\n\nFor example: The\
    \ freeNAS VM build covered in `[Book 3: freeNAS](#index_split_003)`\n\n#### To\
    \ Restore Your VM\nTo restore a VM select your backup in the node tree. For this\
    \ example I have selected `NFS`. (images/0271.jpg) Once selected you should see\
    \ the list of archives. Choose the archive you wish to restore. (images/0229.jpg)\
    \ When finish click the Restore button. (images/0284.jpg) Once the process begins\
    \ you will see the task viewer where you can watch the status. (images/0099.jpg)\n\
    \n### 1.11-VM Hardware\n#### Network Adapters\nAt some point you may want to add\
    \ or edit your hardware. Proxmox offers a wide range of options including adding,\
    \ editing, and removing both disk and network adapters. It also allows for moving,\
    \ throttling, and resizing of disks. You already added a network adapter earlier\
    \ in this chapter for use with `pfSense` so the hardware tab should not be strange.\n\
    \nTo add a new bridge click Add >> Network (images/0062.jpg) For this example\
    \ I have chosen `vmbr1` but that can be changed very easily. (images/0031.jpg)\
    \ Now you will see your newly added adapter in the list.\n\nMAC address NOTE:\
    \ The hardware address you see is an alias and not the actual hardware address!\
    \ (images/0250.jpg) You can change the Mac address, Model, or Bridge of any selected\
    \ adapter simply by clicking the edit button under the hardware tab. Figures (1-3)\
    \ below show the edit dialog.\n\n#### Hard Disk\nAdding a new disk is equally\
    \ simple. Let's create a new 32Gb IDE drive for a Zentyal Domain Controller. (images/0022.jpg)\
    \ Click Add >> Hard Disk (images/0033.jpg) You will see the Add: Hard Disk dialog.\
    \ Notice the default Bus is `VIRTIO`. `VIRTIO` is a high performance driver but\
    \ may not be compatible with your installation. For the most compatible least\
    \ troublesome Bus I recommend `IDE`. Also notice the default Format is `Qcow2`.\
    \ I ALWAYS use `Raw` format! It is the highest performing and most compatible\
    \ Format. Also, stick with Cache default to avoid data loss!\n"
