    Since we have already configured the LAN interface this step is again redundant.
    The values(pictured below) should match those you entered during the console stage
    of installation.


    To proceed: click `Next`


    ![](images/00170.jpg)


    Next you will change the default Admin Password(pictured below) to a more secure
    one(make sure to do this).


    To proceed: click `Next`


    ![](images/00090.jpg)


    Now, pfSense will reload the configuration changes(pictured below).


    To proceed: click `Reload`


    ![](images/00086.jpg)


    Congratulations! You are done with the initial setup.


    To proceed: click the here link as pictured below


    ![](images/00185.jpg)


    ## 2.6-Changing Themes


    The default theme and dashboard will look something like the picture shown below.
    Notice that everything is left justified. My preference is to change this to center
    justified for easier navigation and mobile phone compatibility.


    ![](images/00116.jpg)


    Let''s change the default theme to `NERVCENTER` by selecting `System>General Setup`
    as shown below.


    ![](images/00008.jpg)


    Now scroll to the bottom and select the `NERVCENTER` theme from the dropdown list(pictured
    below). Don''t forget to save the changes!


    ![](images/00323.jpg)


    Your new `NERVCENTER` theme should look something like this(pictured below).


    ![](images/00115.jpg)


    ## 2.7-Configure DHCP Server


    The next step is to enable the DHCP server on the LAN. This will assign IP addresses
    to any machine connected locally.


    To proceed: click `Services>DHCP Server` as pictured below.


    ![](images/00025.jpg)


    You should see the following window(shown below). Check the box: `Enable DHCP
    server on LAN interface`


    ![](images/00315.jpg)


    Once the service box is checked you will need to set a range(pictured below).
    My preference is to use a range (`x.x.x.100-x.x.x.200`). This allows for static
    reservation addressing before and after the range which is very useful. Also notice
    the Deny unknown clients switch(pictured below). I prefer to keep this unchecked
    until all entries are added to the system. Once everything is verified and working
    you can check this box and save changes. This will prevent unauthorized hardware
    from obtaining addresses on your system(very useful and highly recommended).


    ![](images/00347.jpg)


    ### 2.7.1-WINS, DNS, Gateway, and Domain


    When a client connects to the DHCP server it receives all the information from
    the following entries. In this example we will be installing Zentyal to act as
    a directory server for the `YOURWEBS.US` domain. The WINS servers entries below
    are the addresses of `ZentyalDC1` and `ZentyalDC2` respectively. The DNS and Gateway
    entries are the pfSense LAN interface IP.


    ![](images/00290.jpg)


    The picture below shows another security switch that I prefer to keep turned off
    until everything is verified to be working. By Enabling Static ARP Entries pfSense
    will prevent ANY hardware NOT listed from communicating with the LAN adapter.
    This is yet another powerful tool to help keep your network secure(strongly recommended)!


    ![](images/00190.jpg)


    ### 2.7.2-DHCP Client Reservations


    If you scroll to the bottom of the page you will see the Static mappings table.
    The one pictured below is pre-populated to give you an idea what the table will
    look like after making a few entries. I strongly recommend entering EVERY hardware
    address in your network here with full descriptions(as shown below). Not only
    is it necessary if you wish to enable static ARP entries(shown above), but it
    comes in handy if you need to quickly look up the IP address of any machine on
    your network.


    To make an entry: click the `+` button on the right side(shown below).


    ![](images/00344.jpg)


    Next you should see the DHCP entry form(shown below). I have included a sample
    entry for reference(shown below). After making an entry be sure to save your changes.
    NOTE: There is really NO need to make WINS, DNS, Gateway, or any other entries
    here. By default the pfSense interface IP will control ALL clients automatically.


    ![](images/00194.jpg)


    ## 2.8-Firewall Settings


    The last thing you''ll need to do is setup a couple firewall rules. We will allow
    ALL traffic between LAN clients and allow ALL LAN clients out on the WAN. First
    we''ll add the LAN to LAN rule.


    To proceed: click `Firewall>Rules` as shown below


    ![](images/00143.jpg)


    ### 2.8.1-LAN Rules


    You should see tabs with the names of your network interfaces. Some of my tabs(pictured
    below) have different names. I have simply renamed them! For Example: I have renamed
    `LAN` to `JAB`. The only interfaces we''re going to concern with are `LAN` and
    `WAN`.


    To add our LAN to LAN rule: click the `+` button on the right side(shown below).


    ![](images/00246.jpg)


    The picture below shows the completed LAN to LAN rule. Duplicate this rule.


    ![](images/0035.jpg)


    ### 2.8.2-WAN Rules


    Next we''ll setup a rule allowing all outbound on the WAN. I have renamed `WAN`
    to `JAB` in this server.


    To add our WAN to ANY rule: click the `+` button on the right side(shown below).


    ![](images/00329.jpg)


    The picture below shows the completed WAN to ANY rule. Duplicate this rule.


    ![](images/0042.jpg)


    ## 2.9-OpenVPN


    VPN is a tunneling protocol which allows secure remote access to your system.
    Once connected to the VPN clients can work as though they were onsite. In order
    for VPN to work you must have a static IP and all remote machines have have client
    installed. Configuring VPN manually can be quite challenging, even to professionals,
    but the pfSense developers have included a fantastic wizard to get you up and
    running. NOTE: even with the wizard this will be a lengthy chapter so get your
    coffee and pay attention! Let''s get started!


    ### 2.9.1-OpenVPN Client Utility


    To begin: click `System>Packages`


    ![](images/00156.jpg)


    If you do not see OpenVPN Client Utility under Installed Packages download and
    install it under the `Available` tab(pictured below).


    ![](images/00251.jpg)


    ### 2.9.2-OpenVPN Setup Wizard


    Once the OpenVPN Client Utility is installed go to the main dashboard screen then
    click `VPN>OpenVPN`


    ![](images/00146.jpg)


    Next, click the `Wizards` tab(pictured below).


    ![](images/00030.jpg)


    For now, select `Local User Access` from the dropdown then click the `Next` button(shown
    below).


    ![](images/00021.jpg)


    You will now need to establish a Certificate Authority (CA). Complete the form
    as shown below then click Add new CA.


    ![](images/00054.jpg)


    Next, you will need to create a New Server Certificate. Keep the Key length at
    1024 bits for best results. When finished click `Create new Certificate`(pictured
    below).


    ![](images/00181.jpg)


    In the General Information section below I have left Protocol and Port values
    at default. The Interface should normally be `WAN` but I have renamed mine to
    `JAB` in this server. This helps for identification purposes when you have several
    WAN connections all hosting VPN tunnels.


    ![](images/00274.jpg)


    The Cryptographic Settings(shown below) should also be left at default unless
    you know what you are doing.


    ![](images/00208.jpg)


    For Tunnel Settings(shown below) I have allowed 1 client in the `10.10.10.0/24`
    Tunnel Network. This client will have access to the `192.168.0.0/24` Local Network.


    ![](images/00221.jpg)

    '
