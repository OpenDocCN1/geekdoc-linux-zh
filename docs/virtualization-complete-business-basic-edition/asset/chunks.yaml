    要继续：点击 `Next`


    ![](img/00170.jpg)


    接下来您将把默认 Admin 密码（如下所示）更改为更安全的密码（请务必这样做）。


    要继续：点击 `Next`


    ![](img/00090.jpg)


    现在，pfSense 将重新加载配置更改（如下所示）。


    要继续：点击 `Reload`


    ![](img/00086.jpg)


    恭喜！您已完成初始设置。


    要继续：点击此处所示的链接


    ![](img/00185.jpg)


    ## 2.6-更改主题


    默认主题和仪表板看起来类似于下面的图片。请注意所有内容都是左对齐的。我倾向于将其更改为居中对齐，以便于导航和手机兼容。


    ![](img/00116.jpg)


    让我们通过选择所示所示 `System>General Setup` 将默认主题更改为 `NERVCENTER`。


    ![](img/00008.jpg)


    现在滚动到底部并从下拉列表中选择 `NERVCENTER` 主题（如下所示）。别忘记保存更改！


    ![](img/00323.jpg)


    您的新 `NERVCENTER` 主题看起来应该是这样（如下所示）。


    ![](img/00115.jpg)


    ## 2.7-配置 DHCP 服务器


    下一步是在 LAN 上启用 DHCP 服务器。这将为任何连接到本地的机器分配 IP 地址。


    要继续：点击如下所示的 `Services>DHCP Server`。


    ![](img/00025.jpg)


    您应该看到下面的窗口（如下所示）。勾选框：`Enable DHCP server on LAN interface`


    ![](img/00315.jpg)


    一旦勾选了服务框，您将需要设置一个范围（如下所示）。我倾向于使用一个范围（`x.x.x.100-x.x.x.200`）。这允许在范围前后进行静态保留地址分配，非常非常用。还要注意如下所示的
    Deny unknown clients 关。我倾向于在所有条目添加到系统之前保持未勾选状态。一旦一切通过验证并运行，您就可以勾选此框并保存更改。这将防止未经授权的硬件在您的系统中获取地址（非常有用且强烈推荐）。


    ![](img/00347.jpg)


    ### 2.7.1-WINS, DNS, 网关和域


    当客户端连接到 DHCP 服务器时，它将接收来自以下目的的所有信息。在本例中，我们将安装 Zentyal 作为 `YOURWEBS.US` 域的目录服务器。下面的
    WINS 服务器地址分别是 `ZentyalDC1` 和 `ZentyalDC2` 的地址。DNS 和网关条目是 pfSense LAN 接口 IP。


    ![](img/00290.jpg)


    下面的图片显示另一个安全开关，我倾向于在验证一切正常之前保持关闭。通过启用 Static ARP Entries，pfSense 将防止任何未列出的硬件与
    LAN 适配器通信。这是另一个帮助保持网络安全的强大工具（强烈推荐）！


    ![](img/00190.jpg)


    ### 2.7.2-DHCP 客户端预留


    如果您滚动到页面底部，将看到静态映射表。下面的图片是预填充的，以便让您了解在输入几个条目后表格的样式。我强烈建议在此输入网络中的**每一个**硬件地址并附带完整描述（如下所示）。如果您希望启用静态
    ARP 条目（如上所示），这是必要的；但如果您需要快速查找网络上任何机器的 IP 地址，这也会非常方便。


    要添加条目：点击右侧的 `+` 按钮（如下所示）。


    ![](img/00344.jpg)


    接下来您应该看到 DHCP 条目表单（如下所示）。我包含了一个示例条目作为参考（如下所示）。输入条目后，务必保存您的更改。注意：真的不需要在这里创建 WINS、DNS、网关或任何其他条目。默认情况下，pfSense
    接口 IP 将自动控制所有客户端。


    ![](img/00194.jpg)


    ## 2.8-防火墙设置


    您需要做的最后件事是设置几个防火墙规则。我们将允许 LAN 客户端之间的所有流量，并允许所有 LAN 客户端访问 WAN。首先我们添加 LAN 到 LAN
    的规则。


    要继续：点击如下所示的 `Firewall>Rules`


    ![](img/00143.jpg)


    ### 2.8.1-LAN 规则


    您应该看到带有网络接口名称的标签页。我的某些标签（如下所示）名称不同。我只是地重命名了它们！例如：我将 `LAN` 重命名为 `JAB`。我们要关心的接口只有
    `LAN` 和 `WAN`。


    添加 LAN 到 LAN 规则：点击右侧的 `+` 按钮（如下所示）。


    ![](img/00246.jpg)


    下面的图片显示了完成的 LAN 到 LAN 规则。复制此规则。


    ![](img/0035.jpg)


    ### 2.8.2-WAN 规则


    我们将设置一个允许 WAN 所有出站流量的规则。在此服务器上，我将 `WAN` 重命名为 `JAB`。


    添加 WAN 到 ANY 规则：点击右侧的 `+` 按钮（如下所示）。


    ![](img/00329.jpg)


    下面的图片显示了完成的 WAN 到 ANY 规则。复制此规则。


    ![](img/0042.jpg)


    ## 2.9-OpenVPN


    VPN 是一种隧道协议，允许安全地访问您的系统。一旦连接到 VPN，客户端就像在现场一样工作。为了让 VPN 工作，您必须拥有静态 IP 且远程机器都安装了客户端。手动配置
    VPN 对专业人士来说也很有挑战性，但 pfSense 开发人员包含了一个很棒的导来帮助您运行。注意：即使有向导，这一章也很长！让我们开始吧！


    ### 2.9.1-OpenVPN 客户端


    开始：点击 `System>Packages`


    ![](img/00156.jpg)


    如果在已安装包中没有看到 OpenVPN，请在 `Available` 标签页下载并安装它（如下所示）。


    ![](img/00251.jpg)


    ### 2.9.2-OpenVPN 设置向导


    安装 OpenVPN 后，回到主面板并点击 `VPN>OpenVPN`


    ![](img/00146.jpg)


    接下来，点击 `Wizards` 标签页（如下所示）。


    ![](img/00030.jpg)


    现在，从下拉列表中选择 `Local User Access`，然后点击 `Next` 按钮（如下所示）。


    ![](img/00021.jpg)


    您现在需要建立一个证书体系 (CA)。按照所示填写表单，然后点击 Add new CA。


    ![](img/00054.jpg)


    接下来，您需要创建一个新的服务器证书。为了获得最佳效果，将密钥长度保持为 1024 位。完成后点击 `Create new Certificate`如下所示）。


    ![](img/00181.jpg)


    在下面的常规信息部分，我保留了默认的协议和端口值。接口应该是 `WAN`，但在本服务器上我重命名为 `JAB`。这在您有多个托管 VPN 隧道的 WAN 连接时有助于识别。


    ![](img/00274.jpg)


    除非您知道自己在做什么，否则加密设置（如下所示）也应保持默认。


    ![](img/00208.jpg)


    对于隧道设置（如下所示），我允许 1 个客户端进入 `10.10.10.0/24` 隧道网络。客户端将访问 `192.168.0.0/24` 本地网络。


    ![](img/00221.jpg)


