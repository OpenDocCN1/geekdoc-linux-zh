    Book 4:  Zentyal Domain Controller


    4.1-Introduction To Zentyal


    Zentyal started in 2004 as an Open Source project.  It has a very loyal global
    community and is actively developed.  Zentyal Small Business Server CE is actually
    a fully fledged business solution.  The latest versions leverage the powerful
    Samba 4 package which effectively emulates a Microsoft Domain Controller.  It
    comes as a complete standalone distribution in CD\DVD ISO format which makes installation
    a breeze!  This makes Zentyal a no brainer for inclusion as a modular building
    block in our 4 in 1 system.


    In our system we will use it as an Active Directory Domain Controller.  In this
    book I am using the Zentyal 4.0 64 bit version.  You can download this exact version
    at Sourceforge here:  [zentyal-4.0-amd64.iso](http://sourceforge.net/projects/zentyal/files/Old%20versions/zentyal-4.0-amd64.iso/download) 
    NOTE:  The latest version is now called Zentyal Server Development Edition.  The
    interface remains largely the same but I would still recommend matching the version
    I have use to avoid any issues.  If you are comfortable with the latest version
    it can be downloaded directly from the Zentyal home page here:  [Zentyal Server
    Development Edition](http://www.zentyal.org/server/) 


    4.2-Installing Zentyal


