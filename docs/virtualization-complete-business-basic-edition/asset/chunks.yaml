    添加组与添加用户非常相似。在屏幕左侧点击 `Users and Computers` 列表项。你现在应该能看到 `Users and Computers`
    模块屏幕（如下）。注意，在我们的示例中，顶层项目显示 `YOURWEBS.US` 域以及该域下的所有关联项。要添加新组，请选择 `Groups` 文件夹（如下蓝所示）。此操作将导致页面底部的
    `+` 按钮变为绿色（所示）。点击绿色的 `+` 按钮将打开 `Add Group` 对话框。


    ![](img/00297.jpg)


    当 `Add Group` 对话框出现时，用适当的信息填写表单，然后点击 `ADD`（所示）。


    ![](img/00341.jpg)


    ## 4.8 额外的域控制器


    在安装期间，Zentyal 被配置为名为 `ZentyalDC2` 的独立服务器。这样做是有意的，为了演示如何将角色从独立服务器更改为额外的域控制器。假设已经有一个名为
    `ZentyalDC1` 的 Zentyal 域控制器，它已被配置为 `yourwebs.us` 域的独立服务器。


    要更改 `ZentyalDC2` 的角色：点击 `Domain>Settings`，然后从下拉菜单中选择 `Additional domain controller`。如下所示输入
    `ZentyalDC1.yourwebs.us` 控制器的信息。**重要**：IP 地址必须是 `ZentyalDC1` 的地址，而不是作为 `yourwebs.us`
    DNS 服务器的 `pfSense` 路由器的地址。完成后别忘记保存更改！


    ![](img/00296.jpg)


    ## 4.9 关机与重启


    如果你需要关机或重启服务器，这很简单！可以在导航树的 `System` 下找到控制选项（所示）。


    ![](img/00174.jpg)


    ## 4.10 升级 Zentyal


    在主屏幕上，当有可用升级时你会收到提醒（所示）。除非绝对必要，否则我强烈建议不要升级。对于基于 Linux 的软件，我的倾向是找到可以运行的版本并一直使用它们，直到有更好的解决方案出现。如果没有坏，就不要尝试去修复它！这确实适用！在我们的
    Zentyal 安装中，它仅被用于在数据库中存储用户。此外，它是虚拟化的，因此只要你希望使用它，它将一直保持兼容性。


    ![](img/00203.jpg)


    ## 4.11 加入 Zentyal 域


    现在 Zentyal 已经配置了域控制，所有网络客户端都应该能够访问它。这里的关键词是“访问”（ACCESS）而不是“加入”（JOIN）！在管理域时，理解这一点非常！常见的误解是认为必须加入域才能拥有权限，事实并非如此。事实上，有时保持在
    `WORKGROUP`（工作组）中同时对域委托的共享具有用户访问权限可能是更好的选择。一个很好的例子：某些软件通常需要管理员权限才能运行。某些非常昂贵的高级
    CAD 软件不仅需要权限而且必须以 `Administrator`（管理员）身份运行！


    ### 避免 IT 独裁


    当你选择将客户端加入域时，它变得具有限制性，并且管理用户偏好变得越来越困难。并不是所有用户都有相同的需求或偏好。这会让 IT 管理员的角色变得非常有挑战性！他们必须在维护系统安全完整性的同时，不疏远终端用户。使用你的域控制权限进行过度限制可能会创建一个敌对的工作场所，让同事们鄙视
    IT 员工！运行在层 2 硬件过滤网络上的正确实现的 IDS 系统可以粉碎几乎攻击！这允许管理员在放松用户账户设置的同时，仍保持强大的网络安全。


    ### 4.11.1 工作组身份验证


    如上所述，有时保持在 `WORKGROUP` 中同时对域进行身份验证是更好的。这是目前最易实现的系统，并为管理员提供了广泛的灵活性。让我们看看它是如何工作的。为了本书的内容，我有一个名为
    `YOURWEBS.US` 的域，我们已经设置 Zentyal 为该域控制器。在 `System Properties>Computer Name` 对话框中（所示），客户端工作站命名为
    `win7pro`，`WORKGROUP` 设置为 `YOURWEBS`。基本上，只需去掉最后的域后缀（`.US`），即可让我们的系统能够浏览由域控制的网络资源。如果你需要更改工作组名称，请点击
    `Change` 按钮（所示）以匹配系统中设置的域名。


    ![](img/00032.jpg)


    点击上述 `Change` 按钮后会出现以下对话框。只需在显示 `YOURWEBS` 的地方（所示）输入你的新工作组名称，然后点击 `OK`


    ![](img/00201.jpg)


    在第 3.20 章中，我们将 `freeNAS-4` 文件服务器加入了 `YOURWEBS.US`，因此我们已经能够利用网络共享访问控制。如果你需要查看 `freeNAS`
    域权限，请点击此处：3.20-Domain Membership


