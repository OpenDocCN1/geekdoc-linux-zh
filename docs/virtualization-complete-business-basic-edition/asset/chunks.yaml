- fmt: "\nIn this system `freeNAS-3` is setup to serve special Proxmox NFS shares\
    \ for Templates, Containers, ISO, and VM Image Backups. It will provide load balancing\
    \ by hosting shares for network client backups. This also includes backup related\
    \ `(NO DATA DRIVES) `iSCSI` targets to be mapped from within guest operating systems.\
    \ `freeNAS-3` can host `iSCSI` and `NFS` targets for Proxmox VM images but should\
    \ be avoided due to weaker performance. All shares are manually replicated during\
    \ setup to `freeNAS-1` and `freeNAS-2` where they are automatically synchronized\
    \ once per hour using `Rsync`. `freeNAS-3` is only available to network clients\
    \ for backup purposes.\n\n**IMPORTANT**: There is a caveat! Since `freeNAS-3`\
    \ is virtualized it will not be able to backup its own VM image! You MUST backup\
    \ this VM image to a different NFS share hosted by `freeNAS-1`(`nfs.netbackups2`)\
    \ then use `Rsync` once again to automatically synchronize the dataset to all\
    \ other nodes. **NOTE**: `nfs.netbackups2` will ONLY be used for `freeNAS-3` VM\
    \ Image Backups while ALL other VM Image Backups will be sent to the `nfs.netbackups`\
    \ share.\n\n### freeNAS-2 Role In (Option-3) System\n\n`freeNAS-2` does not host\
    \ anything and is not available to network clients. It receives `Rsync` backups\
    \ on schedule from `freeNAS-1` and `freeNAS-3` for disaster recovery usage. It\
    \ could also be used to load balance by serving read only shares for files that\
    \ don't change much.\n\nWith a little `Rsync` magic, all NAS servers end up containing\
    \ the same datasets. The end result is a fully virtualized web administered business\
    \ solution with 3 mirrored NAS servers, active directory, domain control, DHCP,\
    \ DNS, firewall, intrusion detection, and VPN capability!\n\n### Book 1: Proxmox\
    \ VE\n\n#### 1.1-Introduction To Proxmox\n\nWith an active community and rock\
    \ solid distribution Proxmox shines! You can download it in CD/DVD ISO format\
    \ from the Proxmox website here: [Proxmox VE](http://proxmox.com/en/downloads)\
    \ For the purpose of this book I have used Proxmox VE 3.4. Once you have it downloaded,\
    \ burn it to disk, insert it, and follow the simple installation routine. For\
    \ those who aren't familiar Proxmox is a complete open source virtualization management\
    \ platform. It offers enterprise class features such as `HA`, clustering, live\
    \ migration, web management, and hardware pass-through capability. It also is\
    \ capable of running on the newest `ZFS` file system and allows both `KVM` and\
    \ `Open VZ` container virtualization types.\n\nWith advancements in modern hardware\
    \ there is really no reason NOT to virtualize. It makes management and maintenance\
    \ simple while affording greater compatibility lending to longer software/hardware\
    \ life cycles.\n\nIf you rely on Windows XP 32 bit for some over-priced software\
    \ package you're no longer going to have to upgrade do to hardware failure on\
    \ the physical machine. Simply virtualize that machine from backup!\n\n**NOTE**:\
    \ Proxmox is a powerful platform and its feature cannot be completely covered\
    \ in this book. This guide was designed as a step-by-step to get you up and running\
    \ quickly. I highly recommend tapping the wealth of online resources available\
    \ for a more thorough understanding.\n\n#### 1.2-Installing Proxmox\n\nInsert\
    \ the Proxmox disk and boot the machine. You will be greeted by the following\
    \ window.\n\nTo continue: Press `Enter`\n\n![](images/00084.jpg)\n\nEULA\n\nThe\
    \ next screen (shown below) contains the END USER LICENSE AGREEMENT (EULA). I\
    \ know you will carefully read this from beginning to end! When finished reading:\n\
    \nTo continue: Click `I Agree`\n\n![](images/00081.jpg)\n\n**Configuring The Hard\
    \ Disk**\n\nThis step assumes a simple install with one drive and no raid. My\
    \ personal preference here is to only have one disk attached to the motherboard\
    \ for a fresh install. Just detach all disks with exception of the one used for\
    \ the OS. This avoids any possible `MBR` issues if you ever need to remove disks\
    \ due to failure. It's easy to get confused if you have multiple hard disks installed\
    \ in any machine. For this reason I like to include a hard disk ID map. This can\
    \ be as simple as a sticky note or magic marker IDs on each disk.\n\n**NOTE**:\
    \ It has been long advised by the Proxmox developers to only install to a single\
    \ disk partitioned and managed by `LVM`. `Raid` has not been supported until recently.\
    \ My personal opinion is that raid really doesn't matter. A properly maintained\
    \ system will always be pulled from service before a catastrophic disk failure\
    \ happens. There are ALWAYS warning signs! From an engineering perspective a parity\
    \ array such as `RAID(1, 5, 6, or 10)` introduces extended duty cycles and heat\
    \ buildup thus shortening motor life. A striping array such as `RAID-0` reduces\
    \ duty cycles and heat buildup thus increasing motor life. It also provides increased\
    \ throughput as a bonus! It is the only `RAID` I use for these stated reasons!\n\
    \nBack to the install! By clicking the options button below you will notice that\
    \ Proxmox now allows for `ZFS` (Wait, the original text says \"Proxmox now allows\
    \ for...\" but let's re-read the source text carefully). \n\n*Wait, re-reading\
    \ provided source text:*\n\nThe next screen (shown below) contains the END USER\
    \ LICENSE AGREEMENT (EULA). I know you will carefully read this from beginning\
    \ to end! When finished reading:\n\nTo continue: Click `I Agree`\n\n![](images/00081.jpg)\n\
    \n**Configuring The Hard Disk**\n\nThis step assumes a simple install with one\
    \ drive and no raid. My personal preference here is to only have one disk attached\
    \ to the motherboard for a fresh install. Just detach all disks with exception\
    \ of the one used for the OS. This avoids any possible `MBR` issues if you ever\
    \ need to remove disks due to failure. It's easy to get confused if you have multiple\
    \ hard disks installed in any machine. For this reason I like to include a hard\
    \ disk ID map. This can be as simple as a sticky note or magic marker ID's on\
    \ each disk.\n\n**NOTE**: It has been long advised by the Proxmox developers to\
