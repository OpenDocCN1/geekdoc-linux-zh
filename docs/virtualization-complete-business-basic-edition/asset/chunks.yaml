    \ servers, active directory, domain control, DHCP, DNS, firewall, intrusion detection,\
    \ and VPN capability!\n\nBook 1:  Proxmox VE\n\n1.1-Introduction To Proxmox\n\n\
    With an active community and rock solid distribution Proxmox shines!  You can\
    \ download it in CD/DVD ISO format from the Proxmox website here:  [Proxmox VE](http://proxmox.com/en/downloads)  \
    \ For the purpose of this book I have used Proxmox VE 3.4\\.  Once you have it\
    \ downloaded , burn it to disk,  insert it, and follow the simple installation\
    \ routine.  For those who aren't familiar Proxmox is a complete open source virtualization\
    \ management platform.  It offers  enterprise class features such as  HA, clustering,\
    \ live migration, web management, and hardware  pass-through capability.  It also\
    \ is capable of running on the newest ZFS file system and allows both KVM and\
    \ Open VZ container virtualization types.\n\nWith advancements in modern hardware\
    \ there is really no reason NOT to virtualize.  It makes management and maintenance\
    \ simple while affording greater compatibility lending to longer software/hardware\
    \ life cycles.\n\nIf you rely on Windows XP 32 bit for some over-priced software\
    \ package you're no longer going to have to upgrade do to hardware failure on\
    \ the physical machine.  Simply virtualize that machine from backup!\n\nNOTE:\
    \  Proxmox is a powerful platform and it's feature-set cannot be completely covered\
    \ in this book.  This guide was designed as a step-by-step to get you up and running\
    \ quickly.  I highly recommend tapping the wealth of online resources available\
