    Adding a group is very much the same as adding a user. On the left side of the
    screen click the `Users and Computers` list item. You should now see the `Users
    and Computers` module screen(shown below). Notice that in our example the top
    level item shows the `YOURWEBS.US` domain and all associated items under that
    domain. To add a new group select the `Groups` folder(shown in blue below). This
    action will cause the `+` button at the bottom of the page to turn green(pictured
    below). Clicking the green `+` button will open the `Add Group` dialog.


    ![](images/00297.jpg)


    When the `Add Group` dialog appears fill the form with the appropriate information
    then click `ADD`(shown below).


    ![](images/00341.jpg)


    ## 4.8 Additional Domain Controller


    During installation Zentyal was configured as a Standalone server named `ZentyalDC2`.
    This was done purposefully to demonstrate how to change the role from Standalone
    to Additional domain controller. Let''s assume there was already a Zentyal domain
    controller named `ZentyalDC1` configured as a Standalone server for the `yourwebs.us`
    domain.


    To change the `ZentyalDC2` role: Click `Domain>Settings` then select `Additional
    domain controller` from the dropdown. Enter the information for the `ZentyalDC1.yourwebs.us`
    controller as shown below. **IMPORTANT**: The IP address MUST be that of `ZentyalDC1`
    and NOT that of the `pfSense` router which acts as the DNS server for `yourwebs.us`.
    Don''t forget to save your changes when finished!


    ![](images/00296.jpg)


    ## 4.9 Shut Down & Reboot


    If you should need to shutdown or restart your server that''s easy! The control
    can be found under `System` in the navigation tree(shown below).


    ![](images/00174.jpg)


    ## 4.10 Upgrading Zentyal


    On the main screen you will be alerted when there are upgrades available(shown
    below). I would strongly recommend against upgrades unless it is absolutely necessary.
    My preference with Linux based software is to find versions that work and stick
    with them until a better solution comes along. If it isn''t broken don''t try
    to fix it! This really does hold true! In the case of our Zentyal installation
    it is only being used to hold users in a database. Furthermore, it is virtualized
    and because of this, will remain compatible for as long as you wish to use it.


    ![](images/00203.jpg)


    ## 4.11 Joining Zentyal Domains


    Now that Zentyal is configured for domain control all network clients should be
    able to access it. The keyword here is access NOT join! This is important to understand
    when administering a domain! The common misconception is that you must join a
    domain to have privilege and that is simply NOT the case. In fact, sometimes it
    may be preferred to simply remain in a `WORKGROUP` while still having user access
    to shares that are delegated under a domain. A good example: It is very common
    for some software to require Administrative privilege to run. Some very expensive
    high level CAD software not only require privileges but must be run as `Administrator`!


    ### Avoiding The IT Dictatorship


    When you elect to join clients to a domain it becomes restrictive and increasingly
    difficult to manage user preferences. Not all users have the same requirements
    or preferences. This can make the IT Administrators role very challenging! They
    must maintain the security and integrity of the system while at the same time
    not alienating the end users. Using your domain control authority to be overly
    restrictive can create a hostile workplace where co-workers despise the IT Staff!
    A properly implemented IDS system running on a layer 2 hardware filtered network
    will crush just about attack! This allows Administrators to relax user account
    settings while still maintaining strong network security.


    ### 4.11.1 Workgroup Authentication


    As mentioned above, it is sometimes preferred to remain in a `WORGROUP` while
    still authenticating against a domain. This is by far the simplest system to implement
    and affords a wide range of flexibility to Admins. Let''s take a look at how this
    works. For the purpose of this book I have a domain named `YOURWEBS.US` which
    we have setup Zentyal to be a domain controller for. In the `System Properties>Computer
    Name` dialog(pictured below) the client workstation is named `win7pro` and the
    `WORKGROUP` is set to `YOURWEBS`. Essentially, just by dropping the domain suffix(`.US`)
    off the end enables our system to browse network resources that are domain controlled.
    If you need to change your workgroup name click the `Change` button(shown below)
    to match the domain name setup in your system.


    ![](images/00032.jpg)


    The following dialog appears when you click the `Change` button above. Simply
    type your new Workgroup name where you see `YOURWEBS`(pictured below) then click
    `OK`


    ![](images/00201.jpg)


    In Chapter 3.20 we joined our `freeNAS-4` fileserver to the `YOURWEBS.US` so we
    are already able to take advantage of network share access control. If you need
    to review `freeNAS` domain permissions click here: [3.20-Domain Membership](#index_split_052.html_)

    '
