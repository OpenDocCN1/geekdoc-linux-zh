    4.11.1-Workgroup Authentication


    As mentioned above, it is sometimes preferred to remain in a WORGROUP while still
    authenticating against a domain.  This is by far the simplest system to implement
    and affords a wide range of flexibility to Admins.  Let''s take a look at how
    this works.  For the purpose of this book I have a domain named YOURWEBS.US which
    we have setup Zentyal to be a domain controller for.  In the System Properties>Computer
    Name dialog(pictured below) the client workstation is named win7pro and the WORKGROUP
    is set to YOURWEBS.  Essentially, just by dropping the domain suffix(.US) off
    the end enables our system to browse network resources that are domain controlled.
     If you need to change your workgroup name click the Change button(shown below)
    to match the domain name setup in your system. 


    ![](images/00032.jpg)  


    The following dialog appears when you click the Change button above.  Simply type
    your new Workgroup name where you see YOURWEBS(pictured below) then click OK 


    ![](images/00201.jpg)  


    In Chapter 3.20 we joined our freeNAS-4 fileserver to the YOURWEBS.US so we are
    already able to take advantage of network share access control.  If you need to
    review freeNAS domain permissions click here:  [3.20-Domain Membership](#index_split_052.html_filepos214725) 
    Let''s map a network share from freeNAS-4 using YOURWEBS.US domain credentials
    as shown below.


    ![](images/00058.jpg)  


    Opening FreeNAS-4 reveals it''s share.  Simply right click the share then select
    Map network drive(pictured below).


    ![](images/00172.jpg)  


    When mapping from a WORKGROUP client it is important to check the box Connect
    using different credentials(shown below).


    ![](images/00237.jpg)  


    You should then be prompted for the credentials as shown below.  Notice that the
    username MUST be formatted to include the domain without any suffix when connecting
    from a WORKGROUP client.  The entry should look something like this: YOURDOMAIN\username 


    ![](images/00019.jpg)  


    After credentials have been accepted you should see your new share mapping(shown
    below).


    ![](images/00205.jpg)  


    4.11.2-Join The Domain In Windows


    To join a network client to the domain is referred to as binding and will severely
    restrict user preferences.  To achieve the bind click the Change button(shown
    below).


    ![](images/00032.jpg)  


    Next, select the Domain option(shown below).


    ![](images/00201.jpg)  


    Type the domain name without any suffix(shown below).


    ![](images/00034.jpg)  


    Finally, type the full domain Administrator credentials when prompted.  Notice
    that the username MUST be formatted to include the full domain when binding a
    client.  The entry should look something like this: YOURDOMAIN.XYZ\username 


    ![](images/00273.jpg)  


    When the client machine is successfully bound you will see the welcome dialog
    after which you will be prompted to reboot.


    ![](images/00193.jpg)  


    4.12-Configuration Backups


    Besides using VM image backups it is also wise to keep a copy of the Zentyal configuration.
     The configuration backup is especially important when developers rewrite the
    build in a way that breaks certain packages on update.  In these instances your
    VM image backup will only get you back to the version you were using.  I have
    NOT had this happen with Zentyal, so don''t worry too much!


    To access the configuration backup page:  click System>Configuration Backup(pictured
    below).


    ![](images/00126.jpg)  


    Next, select Local then click the BACKUP button(pictured below).


    ![](images/00306.jpg)  


    You should now see your new configuration backup in the Backups'' list(shown below).


    ![](images/00236.jpg)  


    Download your new configuration by clicking the Download Configuration button(shown
    below).


    ![](images/00214.jpg)  


    Save your configuration to disk when the download begins.  HINT:  I recommend
    keeping a copy of this file on thumb drive!


    ![](images/00279.jpg)  


    Restoring your Zentyal configuration should be self-explanatory!  Simply use the
    RESTORE option instead!


