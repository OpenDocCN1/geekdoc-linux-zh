    # Book 3: freeNAS


    ## 3.1-Traditional Storage Fails


    For years I relied on traditional storage servers usually configured with either
    `RAID(1, 5, 6, or 10)`. My preferred file system was `XFS` because it was cutting
    edge and relatively trouble free. The problem was that a file server consumes
    the entire hardware resource of that machine even when there is no demand. Furthermore,
    you need multiple machines dedicated to storage in order to maintain data redundancy.


    Another observation was that `RAID` is NOT perfect! If you select hardware `RAID`
    and the controller dies have fun getting the system back up in a timely manner!
    If you select software `RAID` and the file system degrades you''ll take a huge
    performance hit while it rebuilds.


    Large arrays can easily take 24hrs to complete this process. During this time
    the IT Department gets flooded with calls about poor system performance! To make
    matters worse, the automatic backup starts running it''s nightly incremental causing
    performance to plummet! There had to be a better way!


    ### What Makes A Good Storage System


    How do you define a good storage system? First, I asked myself what was MOST important?
    Well, that''s not easy to answer after being in the field and experiencing problems!
    There are several key elements involved!


    For me, they are:


    - The data storage platform MUST be reliable and compatible for years

    - Complete system disaster recovery MUST be simple and fast

    - The storage input/output MUST be fast

    - Daily end-users restore requests must be simple and fast

    - Data MUST be redundantly stored

    - Data corruption MUST be minimized


    If I cannot meet ALL of these expectations then the storage platform choice is
    wrong! According to these needs traditional `RAID(1, 5, 6, or 10)` storage simply
    could not work! This requires an explanation!


    ### Duty Cycles


    When engineers design electronic components they commonly provide a `Duty Cycle
    Rating`. This.this special rating helps determine how long a component can perform
    under load before heat buildup starts irreversibly degrading components. Now,
    let''s apply this concept to a hard disk array!


    When a parity array such as `RAID(1, 5, 6, or 10)` is written to it must synchronize
    the data cache without interruption or it WILL degrade. If it degrades, it WILL
    rebuild! If it rebuilds, it introduces extended duty cycle and heat buildup. This
    heat buildup irreversibly degrades components leading to eventual failure.


    A striping array such as `RAID-0` never synchronizes or degrades. This reduces
    duty cycle and heat buildup thus increasing component life. It also provides increased
    throughput as a bonus!


    ### Simplicity & Redundancy


    `RAID-0` (striping array) fits the performance demand perfectly. It can NEVER
    degrade! It either works or it doesn''t! What about simplicity and redundancy?


    So here''s the magic! We build our system using ONLY non-parity striping arrays
    then use `RSync` to replicate the data over several NAS machines. This gives the
    performance of `RAID-0` while maintaining data redundancy.


    This method provides data input/output rates that beat ANY `RAID-10` storage.
    Furthermore, when virtualized, ALL platform compatibility issues for on the fly
    upgrades are gone. Best of all, `Linux LVM` provides a simple method of creating
    `UUID` serialized stripe volumes. This means bullet-proof booting and easy physical
    migrations to other machines.


    It seems that all the requirements are satisfied except end-user restore requests
    and minimizing data corruption. Waite, there''s freeNAS with `ZFS`!


    ## 3.2-freeNAS & ZFS


    The final requirements are satisfied with the addition of the self-healing `ZFS`
    file system. The best purpose built distribution for this is `freeNAS`. When setup
    according to this book you can expect very respectable performance when compared
    to bare metal file servers. `freeNAS` is very complete with active directory integration,
    snapshot backups, and a super built-in `RSync` script for hands free duplication
    across nodes. Let''s get on with the installation!


    NOTE: `freeNAS` is a powerful platform and it''s feature-set cannot be completely
    covered in this book. This guide was designed as a step-by-step to get you up
    and running quickly. I highly recommend tapping the wealth of online resources
    available.


    ### 3.3-Installing freeNAS


    Before installation can begin you must create the VM configuration.


    Next, power on the `freeNAS` VM making sure you have the CD image loaded. NOTE:
    `freeNAS` is a powerful platform and it''s feature-set cannot be completely covered
    in this book. This guide was designed as a step-by-step to get you up and running
    quickly. I highly recommend tapping the wealth of online resources available.


