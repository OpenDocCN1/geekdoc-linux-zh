    freeNAS 开发者明智地决定为每一个操作都提供退出破坏性操作的机会。请注意红色背景的对话框（如下所示）。


    ![](img/00037.jpg)


    我提供了一个预填充的卷，并设定了我偏好于使用的数据集命名规范。`ds` 前缀仅表示我正在操作名为 `pool0` 的卷下的数据集。请注意，数据集是可以嵌套在其他数据集中的（如下所示）。


    ![](img/00253.jpg)


    你可以随时编辑现有的数据集。让我们来看名为 `ds.filestore/protected` 的数据集属性（如下所示）。


    ![](img/00067.jpg)


    要查看数据集属性，请点击 `Edit ZFS Options`（如下所示）。


    ![](img/00147.jpg)


    如果你需要为该数据集提供更多额外空间，请根据你的需求更改两个配额值（如下所示）。


    ![](img/00017.jpg)


    请务必注意**不要**超过父数据集的大小（如下所示）！


    ![](img/00033.jpg)


    ## 3.14-ZFS 权限


    通常，当你创建一个数据集时，需要为用户设置适当的权限。出于本例的目的，我们将设置公共权限，即完全开放的权限。不过不必担心，你也可以在 `Shares` 标签页下通过
    IP 地址限制公共共享。我可以肯定地说，即使你的共享设置了公共权限，只要按照本书的设置配置了 `pfSense` 并使用硬件过滤，你就是非常安全的！


    现在让我们为 `ds.backups` 数据集设置权限（如下所示）。


    ![](img/00244.jpg)


    继续：点击 `Change Permissions`（如下所示）


    ![](img/00138.jpg)


    你现在应该能看到 `Permissions` 对话框（如下所示）。为了启用该数据集的公共访问，我勾选了 `Mode` 下 `Owner`、`Group` 和
    `Other` 的所有复选框。勾选框意味着嵌套在此数据集下的**所有**数据集也将将被更改权限。即使在域下进行了配置，`ACL` 也可以保持默认的 `Unix`。如果你需要特定的用户或组权限，可以使用下拉框进行选择。


    注意：如果你在连接共享时遇到问题，这里就是你开始排故障的地方。按如下重置权限将确保能够访问数据集。


    ![](img/00014.jpg)


    ## 3.15-freeNAS 服务


    你的服务器可以配置为托管各种服务，这些服务可以在 `Services` 标签页下找到（如下所示）。在书中，我们将主要关注 `CIFS`、`iSCSI`、`NFS`、`Rsync`
    和 `SSH`。


    ![](img/00316.jpg)


    ### 3.15.1-CIFS（Windows 共享）服务


    首先我们来看 `CIFS`（称为 SAMBA）。该服务是 Windows 兼容网络的骨干，并将是你主要的文件共享协议。现在让我们来看 `CIFS` 的配置选项。


    继续：点击扳手图标（如下所示）


    ![](img/00006.jpg)


    默认配置选项（如下所示）将允许在 Windows 网络中共享文件，其作为名为 `freenas` 的计算机，位于名为 `WORKGROUP` 的 `Workgroup`
    中。你需要根据自己的需求更改这些名称！例如：我的域名是 `yourwebs.us`，我的工作组是 `YOURWEBS`。因为我运行了多个 freeNAS 服务器，所以我使用了诸如
    `freeNAS-1`、`freeNAS-2`、`freeNAS-3` 等名称。


    ![](img/00233.jpg)


    ### 3.15.2-NFS（Linux 共享）服务


    接下来，我们来看 `NFS`。该服务是原始的基于 Linux 文件共享协议。今天你可以在 Windows 上安装服务来连接 `NFS` 共享。我倾向于将我的
    `NFS` 共享限制为 Linux 机器。如果你需要 Windows 访问，只需启用一个只有你有权限的临时 `CIFS` 共享即可。现在让我们来看 `NFS`
    的配置选项。


    继续：点击扳手图标（如下所示）


    ![](img/00044.jpg)


    你唯一需要更改的配置选项是 `Bind IP Address`（如下所示）。可以将 `NFS` 绑定到与 `CIFS` 共享不同的 IP 地址。为了获得最佳性能，我建议使用两个网络适配器，一个用于
    `CIFS`，另一个用于 `NFS` 和 `Rsync`。


    ![](img/00005.jpg)


    ### 3.15.3-iSCSI Target 服务


    接下来我们来看 `iSCSI` 全局选项。`iSCSI` 是一种强大的网络协议，对初学者可能有点挑战性。它允许创建序列化共享，让操作系统误认为它有多个物理驱动器。现在让我们来看
    `iSCSI` 的 `Global Configuration` 选项。


    继续：点击扳手图标（如下所示）


    ![](img/00206.jpg)


    你现在应该看到如下所示的 `Target Global Configuration` 屏幕。在这个屏幕上你唯一需要的是 `Base Name`。


    ### 3.15.4-Rsync（备份）服务


    现在我们来看 `Rsync`（备份）。`Rsync` 是一个社区中广泛使用的强大工具。它提供了极佳的备份。让我们来看 `Rsync` 的配置选项。


    继续：点击扳手图标（如下所示）


    ![](img/00153.jpg)


    ### 3.15.5-SSH（安全外壳）服务


    最后，我们来看 `SSH` 服务。`SSH` 意为安全外壳。它允许通过类似 `PuTTY` 的控制台进行远程登录。让我们来看 `SSH` 的配置选项。


    继续：点击扳手图标（如下所示）


    ![](img/00304.jpg)


    ## 3.16-添加网络共享


    ### 3.16.1-NFS 共享


    如书中之前提到的，我倾向于使用 `NFS` 进行 Proxmox 备份。现在我们将创建一个名为 `netbackups` 的共享，将用于 Proxmox 虚拟机镜像备份。


    继续点击 `Sharing>NFS`（如下所示）


    ![](img/00259.jpg)


    接下来，点击 `Add NFS Share`（如下所示）。


    ![](img/00129.jpg)


    当对话框出现时，输入相应的信息（如下所示）。注意我授权了 3 个 Proxmox 服务器 IP 地址。在 `Maproot User` 下选择 `root`。


    ### 3.16.2-Windows 共享


    设置 Windows 共享与 `NFS` 非常相似。现在我们将创建一个名为 `netbackups` 的共享，用于 Windows Windows 访问 Proxmox
    虚拟机镜像备份。


    继续：点击 `Add CIFS Share`（如下所示）。


    ![](img/00069.jpg)


