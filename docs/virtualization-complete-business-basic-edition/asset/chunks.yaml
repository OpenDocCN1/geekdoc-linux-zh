    Next, we''ll look at NFS.  This service is the original Linux based file sharing
    protocol.  Today you can install services on windows to connect to NFS shares.
     I prefer to keep my NFS shares locked down to only Linux machines.  If you need
    windows access just enable a temporary CIFS share that only you have permissions
    for.  Let''s look at the configuration options for NFS now.


    To proceed:  click the wrench icon(shown below)


    ![](images/00044.jpg)  


    The only configuration option that you will ever need to change is the Bind IP
    Address(shown below).  It is possible to bind NFS to a different IP than that
    used for CIFS shares.  For best performance I recommend having 2 network adapters,
    one for CIFS and the other for NFS and Rsync.


    ![](images/00005.jpg)  


    3.15.3-iSCSI Target Service


    Next, we''ll look at iSCSI Global options.  iSCSI is a powerful networking protocol
    and can be a little challenging to beginners.  It allows serialized shares to
    be created in such a way that the guest operating system is fooled into believing
    it has multiple physical drives.  Let''s look at the Global Configuration options
    for iSCSI now.


    To proceed:  click the wrench icon(shown below)


    ![](images/00206.jpg)  


    You should now see the Target Global Configuration screen as shown below.  The
    only thing on this screen that you should touch would be the Base Name.  For example:
     you may want to change org.example (pictured below) to something like us.freenas1.yourwebs 


    CAUTION:  Be careful when changing the Base Name or your server might not be visible
    for mapping.  If this happens revert back to default:  iqn.2011-03.org.example.istgt 


    ![](images/00361.jpg)  


    3.15.4-Rsync(Backup) Service


    Now, we''ll look at Rsync configuration options.  Rsync is a powerful backup utility
    which is widely used in the Linux community.  It is light weight and very good
    at what it does!  freeNAS provides excellent scripting for Rsync backups!  We''ll
    cover that later!  Let''s look at the configuration options for Rsync now.


    To proceed:  click the wrench icon(shown below)


    ![](images/00153.jpg)  


    The configuration for the Rsync service is simple.  There really isn''t any!  Keep
    the default TCP port value(pictured below).


    ![](images/00112.jpg)  


    3.15.5-SSH(Secure Shell) Service


    Finally, we''ll look at SSH configuration options.  SSH stands for secure shell.
     It allows remote logins via a console program such as the PuTTY program used
    earlier in the book.  Let''s look at the configuration options for SSH now.


    To proceed:  click the wrench icon(shown below)


    ![](images/00304.jpg)  


    Make sure to match ALL checkboxes that I have checked(pictured below).  No further
    configuration is needed.


    ![](images/00202.jpg)  


    Now that we''ve covered the important service configuration options make sure
    they''re all enabled by clicking each of the service switches(shown below).  They
