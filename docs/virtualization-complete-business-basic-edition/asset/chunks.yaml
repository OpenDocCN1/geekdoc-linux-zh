    \ before the new disk will appear.\n\n![](images/00200.jpg)\n\n## 3.5-Set Storage\
    \ For No Backup\n\nIMPORTANT: It is extremely important that we ONLY backup the\
    \ `freeNAS` primary disk(`ide0`) and NOT the `6TB` storage drive. If this were\
    \ to happen it would seriously degrade your system performance! Your backups should\
    \ be configured using `RSync` from within the `freeNAS` guest. This behavior can\
    \ easily be avoided by editing the disk properties as shown below.\n\n![](images/00055.jpg)\n\
    \nNotice the disk properties(pictured below) indicate that secondary disk(`ide1`)\
    \ will NOT be included in backups.\n\n![](images/00052.jpg)\n\nThe `freeNAS-4`\
    \ VM(above) can now be booted and the new `6TB` disk configured as a `ZFS` stripe.\n\
