    \ pass-through）的技术分配的物理 LVM 存储上。\n\n这种方法使得备份占用非常小，因为你只备份了 NAS 操作系统**而不是**数据。它还能为数据读写循环提供中较好的磁盘吞吐量。我使用千兆网适配器测试过持续吞吐量在\
