  raw: 'Once added your new disk will appear red until the VM is power-cycled(pictured
    below).


    > ![](images/00261.jpg)


    1.12-Adding Pass-Through Disks


    As mentioned in the [.3-Best Practices](#index_split_006.html_filepos28974) section,
    I use hybrid servers.  Essentially, you are creating a Proxmox virtualization
    host with a built in NAS server.  You install the NAS just like any other VM with
    its OS residing on a virtual disk.  However, the actual storage drives will reside
    on physical LVM storage assigned through a technique known as hardware pass-through.


    This method allows for a very small backup footprint because your only backing
    up the NAS operating system and NOT the data.  It also provides moderately better
    disk throughput for data read/write cycles.  I have tested sustained throughput
    rates in the range of 30-60 Megabytes/sec using Gigabit adapters.  Bonding your
    adapters does yield better performance but I like to keep it simple!


    The biggest advantage is that your data is NOT stored in a virtual disk file!
     Even if you destroy the VM the data remains safe!


    Now that you have an understanding let''s add a 6TB striped volume to a new install
    of freeNAS.  As you can see the freeNAS install only has one 8GB IDE disk where
    the OS resides(pictured below).


    ![](images/00108.jpg)  


    Let''s open PuTTY and login as root on your Proxmox server.  Then we need to find
    our disks using the following command(pictured below):


    # cat /proc/partitions


    ![](images/00109.jpg)  


    As you can see, the largest disks(picture above) are /dev/sdb and /dev/sdc.


    Also notice that there are /dev/sdb1 and /dev/sdc1 as well.  This indicates a
    single partition exists on each disk.  The partition sizes indicate that all available
    space is not being used.  We need to change that!  To edit /dev/sdb type the following
    command:


    # fdisk /dev/sdb


    You will now see something like this(pictured below):


    ![](images/00158.jpg)  


    Now press: m >> Enter 


    You will see the help screen(shown below).  We are interested in an creating empty
    DOS partition table.


    ![](images/00219.jpg)  


    Now press: o >> Enter 


    Followed by: w >> Enter 


    This series of commands will create a new empty DOS partition table and write
    changes to disk.


    Next we need to repeat these steps for /dev/sdc.  Do NOT worry about the lack
    of partitions!  The beauty of this method is that LVM doesn''t care!


    Let''s verify our disks again to ensure the partitions are gone using the following
    command:


    # cat /proc/partitions


    ![](images/00240.jpg)  


    As you can see(above), /dev/sdb and /dev/sdc can now be used to full capacity.


    We will now create LVM physical volumes(PV''s) using the following commands:


    # pvcreate /dev/sdb


    # pvcreate /dev/sdc


    OR


    # pvcreate /dev/sd[b,c]


    ![](images/00226.jpg)  


    The output above shows successful creation.


    Next, we will create a volume group(VG) containing both disks with the following
    command:


    # vgcreate freenas4 /dev/sd[b,c]


    ![](images/00360.jpg)  


    The output above shows our VG created successfully.


    For the final step we will create a striped logical volume(LV) using all available
    space.  LVM Striping is equivalent to RAID-0 for maximum disk throughput.


    Type the following command to create the stripe:


    # lvcreate -l 100%FREE -i2 -n 6tbstore freenas4


    where: i2(number of stripe members), n(name)


    ![](images/00089.jpg)  


    The above output shows our LV stripe successfully created.


    As I mentioned earlier, Linux LVM is extremely powerful and flexible.  I would
    highly recommend learning it well.  Below are 3 more very useful LVM commands:


    # pvscan


    This command lists ALL known physical volumes(pictured below).


    ![](images/00087.jpg)  


    # vgscan


    This command lists ALL known volume groups(pictured below).


    ![](images/00073.jpg)  


    # lvscan


    This command lists ALL known logical volumes(pictured below).


    ![](images/00224.jpg)  


    You can see the newly created 6TB striped volume above.  Now we''re ready to assign
    this volume to the freeNAS-4 VM.  You will notice the ID number of freeNAS-4 is
    800 and IDE1 or IDE3 is available(pictured below).


    ![](images/00108.jpg)  


    To assign the new disk we will issue the special QEMU command as follows:


    # qm set 800 -ide1 /dev/freenas4/6tbstore


    The command entered into PuTTY looks like this(pictured below).


    ![](images/00132.jpg)  


    The result of this command is evident by the new IDE1 drive shown in the freeNAS-4
    hardware window(pictured below).  NOTE:  You will need to refresh the tab page
    before the new disk will appear.


    ![](images/00111.jpg)  


    The freeNAS-4 VM(above) could now be booted and the new 6TB disk configured as
    a ZFS stripe.


    PLEASE REMEMBER:  It is important to note that freeNAS-4 is now tied to the Proxmox3
    server by its hardware pass-through disk.  It cannot be moved to another physical
    machine unless the physical disks are removed.  The other VM''s(pictured above)
    can be moved to another physical machine easily using a simple backup/restore.
     They are NOT tied in any way to the Proxmox3 server.


    1.13-Troubleshooting Proxmox


    Troubleshooting Proxmox is easy!  There isn''t any!  You may occasionally have
    a VM locked.  Simply issue the following command:


    # qm unlock [vm-ID]


    Example:  # qm unlock 800


    where 800 is the vm- ID number(pictured above) in node tree view


    You may also have a new VM configuration fail to boot.  Changing the CPU type
    from KVM to QEMU or from QEMU to KVM usually works.


    Finally:  Some operating systems may require you to partition and format the VM
    disk before they will boot.


    1.14-Upgrading Proxmox


    When it comes to updates and upgrades to Proxmox I have found the KISS(keep it
    simple stupid) method works the best.  DO NOT under ANY circumstance try to update
    or upgrade a perfectly functional install!  Linux is not like Windows!  When things
    go wrong they tend to go wrong in a VERY bad way!


    There are ways of updating using apt and aptitude commands but I DO NOT recommend
    this and it would take a whole chapter just to cover.  You will spend less time
    if you simply backup your VM''s, restore them to different nodes, then re-install
    the Proxmox node in question with the latest distribution release. 


    With the DVD it takes 10-15 minutes to install and configure!  Through command
    line upgrade it can take 45-60 minutes IF everything goes right!  That''s a BIG
    IF!  When you''re the only IT Administrator with 200 machines/users to babysit
    you tend to avoid the IF scenarios and go with the sure shot every time! 


    Book 2:  pfSense


    2.1-Introduction To pfSense


    About 1 year after placing Proxmox in production at work I got a call.  I was
    told that one client decided to change encryption on our VPN tunnel to something
    more secure.  I soon realized that our existing equipment could NOT be upgraded
    so I began searching for alternatives.  That''s when I decided on pfSense!


    My first install was bare metal and worked just fine.  It wasn''t long before
    I began pondering the idea of a virtualized routing platform.  The great debate
    was whether virtualized routers were up to the task from a security standpoint.
     I just couldn''t let the idea rest unless I tried it!  Well, I must say, that
    7 years later I''m glad I decided to virtualize.


    The security question was soon put to the test after experiencing some issues
    with an ATT gateway.  I ended up spending the whole day on the phone with ATT
    starting at level-1 and eventually making it to TOP level-6 support.  This is
    where the network engineers spend their days!  To make a long story short, ATT
    Network Engineers could NOT test my gateways without pfSense being disabled.'
