    \n```bash\nvgscan\n```\n\n此命令列出所有已知的卷组（如下所示）。\n\n![](img/00073.jpg)\n\n```bash\n\
    lvscan\n```\n\n此命令列出所有已知的逻辑卷（如下所示）。\n\n![](img/00224.jpg)\n\n你可以看到上方新创建的 6TB 条带卷。现在我们准备好将此卷分配给\
    \ freeNAS-4 虚拟机了。你会发现 freeNAS-4 的 ID 号是 800，且 IDE1 或 IDE3 是可用的（如下所示）。\n\n![](img/00108.jpg)\n\
