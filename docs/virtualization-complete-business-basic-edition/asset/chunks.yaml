    \n## 1.12-Adding Pass-Through Disks\n\nAs mentioned in the [.3-Best Practices](#index_split_006.html_filepos28974)\
    \ section, I use hybrid servers. Essentially, you are creating a Proxmox virtualization\
    \ host with a built in NAS server. You install the NAS just like any other VM\
    \ with its OS residing on a virtual disk. However, the actual storage drives will\
    \ reside on physical LVM storage assigned through a technique known as hardware\
    \ pass-through.\n\nThis method allows for a very small backup footprint because\
    \ your only backing up the NAS operating system and NOT the data. It also provides\
    \ moderately better disk throughput for data read/write cycles. I have tested\
    \ sustained throughput rates in the range of 30-60 Megabytes/sec using Gigabit\
    \ adapters. Bonding your adapters does yield better performance but I like to\
    \ keep it simple!\n\nThe biggest advantage is that your data is NOT stored in\
    \ a virtual disk file! Even if you destroy the VM the data remains safe!\n\nNow\
    \ that you have an understanding let's add a 6TB striped volume to a new install\
    \ of freeNAS. As you can see the freeNAS install only has one 8GB IDE disk where\
    \ the OS resides(pictured below).\n\n![](images/00108.jpg) \n\nLet's open PuTTY\
    \ and login as root on your Proxmox server. Then we need to find our disks using\
    \ the following command(pictured below):\n\n```bash\ncat /proc/partitions\n```\n\
    \n![](images/00109.jpg)\n\nAs you can see, the largest disks(picture above) are\
    \ `/dev/sdb` and `/dev/sdc`.\n\nAlso notice that there are `/dev/sdb1` and `/dev/sdc1`\
    \ as well. This indicates a single partition exists on each disk. The partition\
    \ sizes indicate that all available space is not being used. We need to change\
    \ that! To edit `/dev/sdb` type the following command:\n\n```bash\nfdisk /dev/sdb\n\
    ```\n\nYou will now see something like this(pictured below):\n\n![](images/00158.jpg)\n\
    \nNow press: `m` >> `Enter`\n\nYou will see the help screen(shown below). We are\
    \ interested in an creating empty DOS partition table.\n\n![](images/00219.jpg)\n\
    \nNow press: `o` >> `Enter`\n\nFollowed by: `w` >> `Enter`\n\nThis series of commands\
    \ will create a new empty DOS partition table and write changes to disk.\n\nNext\
    \ we need to repeat these steps for `/dev/sdc`. Do NOT worry about the lack of\
    \ partitions! The beauty of this method is that LVM doesn't care!\n\nLet's verify\
    \ our disks again to ensure the partitions are gone using the following command:\n\
    \n```bash\ncat /proc/partitions\n```\n\n![](images/00240.jpg)\n\nAs you can see(above),\
    \ `/dev/sdb` and `/dev/sdc` can now be used to full capacity.\n\nWe will now create\
    \ LVM physical volumes(PV's) using the following commands:\n\n```bash\npvcreate\
    \ /dev/sdb\npvcreate /dev/sdc\n```\n\nOR\n\n```bash\npvcreate /dev/sd[b,c]\n```\n\
    \n![](images/00226.jpg)\n\nThe output above shows successful creation.\n\nNext,\
    \ we will create a volume group(VG) containing both disks with the following command:\n\
    \n```bash\nvgcreate freenas4 /dev/sd[b,c]\n```\n\n![](images/00360.jpg)\n\nThe\
    \ output above shows our VG created successfully.\n\nFor the final step we will\
    \ create a striped logical volume(LV) using all available space. LVM Striping\
    \ is equivalent to RAID-0 for maximum disk throughput.\n\nType the following command\
    \ to create the stripe:\n\n```bash\nlvcreate -l 100%FREE -i2 -n 6tbstore freenas4\n\
    ```\n\nwhere: `i2`(number of stripe members), `n`(name)\n\n![](images/00089.jpg)\n\
    \nThe above output shows our LV stripe successfully created.\n\nAs I mentioned\
    \ earlier, Linux LVM is extremely powerful and flexible. I would highly recommend\
