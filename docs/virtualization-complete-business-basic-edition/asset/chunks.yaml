- fmt: '

    While writing this book I had to make a decision where to put this section. I
    feel so strongly about my chosen methods that I decided to cover it right here
    in the beginning. No need to worry if you don''t fully grasp some of these methods
    right now! As you progress they will be re-introduced and further explained, where
    they will make much more sense!


    Over the years, as advancements came, I tested and deployed. I''ve tried `HA`,
    clustering, `iSCSI` backed storage, `QCow` vs `Raw` vs `vmdk` disk, `OpenVz` vs
    `KVM`, `virtio` drivers, and the list goes on! Along the way I learned some hard
    lessons! So, this section is dedicated to tips and tricks that will make your
    deployments super simple and maximize the use of your hardware. Here we go!


    ## 3.1 Hybrid Servers


    Take advantage of modern hardware by building hybrid platforms. Essentially, you
    create a virtualization host with a built in bare metal NAS server. You install
    the `NAS` just like any other `VM` with its OS residing on a virtual disk. The
    actual storage drives will reside on a physical `LVM` array assigned through a
    technique known as hardware pass-through. This method provides very respectable
    data read/write performance! I have tested sustained throughput rates in the range
    of 30-60 Megabytes/sec using Gigabit adapters.


    The biggest advantage is that your data is NOT stored in a virtual disk file!
    Even if you destroy the `VM` the data remains safe! This approach maximizes the
    use of your hardware resource and makes management, maintenance, and disaster
    recovery MUCH easier!


    For example: The following scenarios should help understand cost and benefit!


    *   **Scenario 1**: Let''s assume you have 2 `Proxmox` servers, 2 brand(x) `NAS/SANs`,
    and 1 brand(x) `Router`. You have consumed 5 positions in your rack and you cannot
    use 3 of those positions for anything else. If a `NAS` or `Router` goes down due
    to hardware failure you WILL be down for 6-24hrs at the minimum unless you have
    an exact duplicate laying around.

    *   **Scenario 2**: Let''s assume you have 5 `Proxmox` servers un-clustered. You
    have consumed 5 positions in your rack and each position can host anything! Some
    or all of these could be hybridized using hardware pass-through for `NAS` drives
    and extra network adapters for routing. If any machine went down you simply transfer
    the hot-swap storage drives for the `NAS` to the next `Proxmox` server, map a
    couple network adapter Mac addresses for the `Router`, restore your virtual machine
    images, and you''re back running in 15 minutes or less! It is also important to
    note that this method does NOT cripple `Proxmox` in any way with respect to other
    `VM`s you wish to install providing you have enough disk and network resources.


    ## 3.2 Disaster Recovery


    If any of your `Proxmox` servers go down the single most important item to recover
    will ALWAYS be your `VM` image backups. Think of them as Master Recovery Images!
    Without these you are lost so it is important to have as many copies as possible!
    My preferred method is to select a `NAS`(virtualized or standalone) to use as
    my primary `VM` image backup server. This server will host the `NFS` image backup
    share to `Proxmox`. This share is manually replicated(only once during setup)
    to all other `NAS` servers in the system and synchronized on schedule using `Rsync`.
    If a machine goes down I can replace it, re-install `Proxmox`, re-install any
    `NAS` drives, re-map my `NFS` backups, and restore the `VM` images. Once again,
    you''re back running in 15 minutes or less! This method has served me very well
    and is rock solid time tested!


    **KEEP A COPY ON THUMB-DRIVE**: Another highly recommended tip is to copy your
    `VM` image backups to a thumb-drive or DVD then store them in a fireproof safe.
    You can easily map a read-only `samba` share of your `VM` image backups to be
    accessible from any windows machine or android phone. Using the small footprint
    method described below ensures your entire `VM` image backup archive will easily
    fit on a modern 64-128GB USB thumb-drive.


    ## 3.3 KVM Preferred


    `Proxmox` allows for 2 types of virtualization, `KVM` and `OpenVZ`. The key difference
    between the two, is that `KVM` is fully virtualized, where `OpenVZ` is partially
    virtualized. While `OpenVZ` does yield performance benefits over `KVM`, it loses
    in every other way. My choice is to only use `KVM`! I will always choose compatibility
    and easy disaster recovery over performance! If you require more performance get
    better hardware! You can easily build a water-cooled over-clocked rocket with
    8 or more cpu cores and 32Gb or more RAM on the cheap today!


    ## 3.4 Small Footprint Virtualization


    My preferred approach is what I term small footprint virtualization. Let''s assume
    you have a 2008 Windows Server with a need for 500GB capacity. There are 2 installation
    approaches that will work!


    *   **Scenario 1**: You could create a `VM` with virtual disks totaling 500GB.
    With this method you''re looking at large image backups that take a long time
    to complete! Should you need to move or recover using a backup it will also take
    a long time!

    *   **Scenario 2**: With small footprint virtualization you create a `VM` with
    as small a disk as allowable, then use a network backed resource such as `iSCSI`
    from within the guest to map the additional capacity. This method allows for super
    fast backup and restore at the expense of some performance.


    In production environments the flexibility of small footprint virtualization exceeds
    any minor performance hits. It allows you to backup and restore a `VM` with large
    capacity to another machine quickly. This comes in very handy if you need to pull
    a machine down for maintenance.


    ## 3.5 Clustering


    In this book I do not cover clustering because it does NOT fit the simplicity
    model. Clustering is great for managing a large number of servers from a single
    interface but does add complexity to the system! It also relies heavily on network
    backed storage which reduces overall VM performance compared to dedicated hardware.
    When a cluster breaks you may want to plan on an all-nighter! Keeping your `Proxmox`
    servers un-clustered still allows for most recoveries and moves within minutes!


    ## 3.6 Maximize Performance


    Another preferred approach I will share based on experience should be a no-brainer.
    Any `VM` will perform better if it has dedicated disk and network hardware. If
    you can spare the extra disks and network adapters it is highly recommended!


    I think a good general rule is to allow no more than 2 `VM` guests per physical
    device. One being a low throughput guest while the other can be high throughput.
    For example: a domain controller only handling authentication can easily share
    a disk and network adapter with a multi-domain email server.


    **SSD DRIVES**: I have had very good luck running up to 6 small footprint `VM`
    installs on just one SSD drive. Each one of these had dedicated network adapters!

