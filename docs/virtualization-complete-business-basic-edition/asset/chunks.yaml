    # 第 3 卷：freeNAS


    ## 3.1-传统存储失效


    多年来，我一直依赖传统的存储服务器，通常配置为 `RAID(1, 5, 6, 或 10)`。我首选的文件系统是 `XFS`，因为它非常前沿且相对没有故障。问题在于，文件服务器即使在没有需求时也会消耗该机器的所有硬件资源。此外，为了维护数据冗余，你还需要多台专用存储的机器。


    另一个观察结果是，`RAID` 并不完美！如果你选择了硬件 `RAID` 且控制器坏了，那就祝运你能够及时恢复系统运行吧！如果你选择了软件 `RAID` 且文件系统降级，在重建期间你将遭受巨大的性能损失。


    大型阵列可能轻松花费 24 小时才能完成这个过程。在此期间，IT 部门会收到大量关于系统性能低下的电话轰炸！糟糕的是，自动备份开始运行每日增量备份，导致性能急剧下降！一定有更好的方法！


    ### 什么是良好的存储系统


    你如何定义一个良好的存储系统？首先，我问自己什么是**最重要的**？在领域内工作并经历过问题后，这并不容易回答！这里涉及到几个关键元素！


    对我来说，它们是：


    - 数据存储平台**必须**是多年可靠且兼容的

    - 完整的系统灾难恢复**必须**简单且快速

    - 存储输入/输出**必须**是的

    - 每日终端用户的恢复请求**必须**简单且快速

    - 数据**必须**进行冗余存储

    - 数据损坏**必须**降至最低


    如果我不能满足**所有**这些预期，那么存储平台的选择就是错误的！根据这些需求，传统的 `RAID(1, 5, 6, 或 10)` 存储根本无法工作！这需要解释！


    ### 负载周期 (Duty Cycles)


    当工程师设计电子元件时，他们通常会提供“负载周期额定”（Duty Cycle Rating）。这种特殊额定有助于确定组件在热量积累开始不可逆地损坏组件之前可以在负载下运行多久。现在，让我们把这个概念应用于磁盘阵列！


    当写入一个校验阵列（如 `RAID(1, 5, 6, 或 10)`）时，它必须不中断地同步数据缓存，否则它**会**降级。如果它降级，它**会**重建！如果它重建，就会引入持续的负载周期和热量积累。这种热量积累会不可逆地损坏组件，导致最终故障。


    条带阵列（如 `RAID-0`）永远不会同步或降级。这减少了负载周期和热量积累，从而增加了组件寿命。它还作为额外奖励增加了吞吐量！


    ### 简单性与冗余


    `RAID-0`（条带阵列）完美契合性能需求。它**永远不会**降级！它要么工作，要么失效！那么简单性和冗余性呢？


    这里就是魔法所在！我们**仅**使用非校验条带阵列构建系统，然后使用 `RSync` 在多台 NAS 机器上复制数据。这提供了 `RAID-0` 的性能，同时保持了数据冗余。


    这种方法提供的数据输入输出速率优于**任何** `RAID-10` 存储。此外，当虚拟化后，所有在线升级的平台兼容性问题消失消失。最重要的是，`Linux
    LVM` 提供了一种创建 `UUID` 序列化条带卷的简单方法。这意味着弹性的启动并可以轻松地物理迁移到其他机器。


    似乎所有要求都满足了，除了终端用户恢复请求和最小化数据损坏。等等，还有带有 `ZFS` 的 freeNAS！


    ## 3.2-freeNAS & ZFS


    随着自愈能力 `ZFS` 文件系统的加入，最后的要求得到了满足。这种用途为此身定制的发行版是 `freeNAS`。按照本书进行设置，与裸机文件服务器相比，你可以获得非常可观的性能。`freeNAS`
    非常完整，具有活动目录集成、快照备份以及一个超级内置的 `RSync` 脚本，用于跨节点的人工复制。让我们开始安装吧！


    注意：`freeNAS` 是一个强大的平台，其功能集无法在书中完全涵盖。本指南旨在作为逐步操作指南，帮助你快速运行。我强烈建议利用丰富的在线资源。


    ### 3.3-安装 freeNAS


    在开始安装之前，你必须创建虚拟机配置。


    接下来，开启 `freeNAS` 虚拟机，确保已加载 CD 镜像。注意：`freeNAS` 是一个强大的平台，其功能集无法在书中完全涵盖。本指南旨在作为逐步操作指南，帮助你快速运行。我强烈建议利用丰富的在线资源。


    ### 3.4-为 freeNAS 添加透通磁盘


    此时 freeNAS 还没有可用于共享的存储驱动器。我们现在要把第 1.12 章中创建的 LVM 条带卷作为透通硬盘添加。你可能想重温该章节！


    首先，打开 PuTTY 程序并以 root 身份登录你的 Proxmox 服务器。


    为了分配新磁盘，我们将执行如下特殊的 QEMU 命令：


