    Once finished, your new Windows share will be visible in the list(pictured below).


    ![](images/00281.jpg)


    ## 3.16.3-iSCSI Target Shares


    I have elected to save iSCSI for last because it takes the most time to configure.
    Please pay attention closely! To setup an iSCSI target you''ll first need to add
    a dataset to be mapped. For this example I have created a `40Gb` dataset named
    `example.trgt012` nested within the `ds.iscsitrgts` dataset(pictured below). This
    naming convention helps me identify the intended type of share I''m working with.


    ![](images/00188.jpg)


    Once you have created a dataset go to the `Services` tab as shown below.


    To proceed: click the wrench icon(shown below)


    ![](images/00206.jpg)


    Next go straight to the `Portals` tab then click `Add Portal`(shown below)


    ![](images/00293.jpg)


    When the dialog screen appears(shown below) you will notice the default IP Address
    is set to `0.0.0.0` implying that ANY interface will be used. This setting is
    fine! You may also wish to add a comment.


    To proceed: click `OK`


    ![](images/00118.jpg)


    Next, we''ll setup Initiators! To proceed: click `Add Initiator`(shown below)


    ![](images/00345.jpg)


    You should now see the `Add Initiator` dialog(pictured below). Since you are in
    a Layer 2 hardware protected network it is safe to keep the default settings.


    To proceed: click `OK`(shown below)


    ![](images/00056.jpg)


    Now Now''ll setup Access Groups!


    To proceed: click `Add Authorized Access`(shown below)


    ![](images/00063.jpg)


    When the dialog appears as shown below enter the appropriate information. For
    this example I have set the `User` as a network client named `win7pro` and the
    `Peer User` as my active directory Username: `lsurber`


    NOTE: The `Secret` and `Peer Secret` cannot be the same! I choose an arbitrary
    `Secret` while using my active directory password for the `Peer Secret`.


    To proceed: click `OK`(shown below)


    ![](images/00179.jpg)


    Next up is Targets! To proceed: click `Add Target`(shown below)


    ![](images/00105.jpg)


    You should now see the `Target` Dialog screen shown below. My preference is to
    use the name of the dataset(`example.trgt012`) as the `Target Name`. Now, select
    the `Portal Group ID` and the `Initiator Group ID` establish earlier. You could
    also choose an `Authentication Group` number. I have left this set to none for
    this example.


    To proceed: click `OK`(pictured below)


    ![](images/00148.jpg)


    You should now see your newly created `Target` as shown below.


    ![](images/00061.jpg)


    Next we''ll configure the Extent!


    To proceed: click `Add Extent`(pictured below)


    ![](images/00139.jpg)


    Once again, I have chosen to use the dataset name for the `Extent Name` and set
    the `Extent size` to `40g`. This matches the quota I set for the dataset when
    it was created. My preference and recommendation is to use the `File Extent Type`.
    Now choose the appropriate `Path` to the extent. NOTICE: I have selected the nested
    dataset `example.trgt012` for the path.


    After selecting your path: click `Close`(shown below)


    ![](images/00009.jpg)


    To proceed: click `OK`(shown below)


    ![](images/00045.jpg)


    I have purposely created this common error for your reference(shown below). NOTICE:
    because this is a `File Extent Type` you cannot simply select the dataset as the
    `Path` to the extent. Also, notice the correct `Extent size` syntax was wrong!
    It should have been `40GB`.


    ![](images/00134.jpg)


    To correct the `Path` to the extent I will simply add `/trgt012` to the end of
    the selected dataset. You may be starting to understand why naming is important!


    With everything corrected click `OK`(shown below)


    ![](images/00100.jpg)


    Finally, we can Associate the Target with the Extent!


    To proceed: click `Add Target/Extent`


    ![](images/00358.jpg)


    When the dialog appears simply select the `Target` and `Extent` to associate from
    the dropdowns. You can leave `LUN ID` set to `Auto`.


    To proceed: click `OK`(shown below)


    ![](images/00162.jpg)


    When the target has been successfully added to the system it will appear as shown
    below. Congratulations!


    ![](images/00218.jpg)


    ## 3.17-ZFS Snapshot Backups


    Probably, the BEST feature of the ZFS file system is copy on write. This feature
    allows backups to be restored almost instantly from snapshot archives. When setup
    and used properly you will NEVER need another form of backup software... EVER!!!
    I STRONGLY suggest using my best practices method. It involves running 2, 3, or
    4 freeNAS servers all with the same datasets.


    Any dataset hosting live data will be considered a primary dataset. Each primary
    dataset will need to be manually replicated (once during setup) to all other freeNAS
    nodes. The primary datasets(hosting live data) will be configured as `Rsync push
    tasks` on the node hosting the live shares. The backup datasets(backup data only)
    will be configured as `Rsync modules` on any node NOT hosting live shares. With
    this method all datasets are replicated over every freeNAS node automatically.


    ZFS snapshots can then be setup on each node using a different schedule. The primary
    datasets can be set to hourly or daily snapshots while the rest are set to weekly,
    monthly, etc.  Let''s setup a snapshot now!


    To proceed: click `Add Periodic Snapshot`(shown below)


    ![](images/0340.jpg)


    For this snapshot task I am selecting the `ds.backups` dataset.


    ![](images/0040.jpg)


    Once again, the `Recursive` switch means that ALL nested datasets under `ds.backups`
    will be included in the snapshot.


    ![](images/0036.jpg)


    Once saved, your snapshot task will appear in the list.


    ![](images/0060.jpg)


    Notice that the new snapshot task was run almost immediately under the `ZFS Snapshots`
    tab.


    ![](images/0070.jpg)


    ## 3.18-Restore A Snapshot In Windows


    As an IT Administrator, it is very common to have end users calling on a daily
    saying they accidentally deleted their files. ZFS snapshots make this daily task
    easy to deal with on systems running 7 or higher! Let''s look at snapshot restore
    on a Windows 7 machine.


    ![](images/0321.jpg)


    Let''s assume a user deleted a file from the mapped Z drive. To see available
    snapshots simply right click the drive then choose `Properties`.


    ![](images/166.jpg)


    When the dialog appears select the `Previous Versions` tab. You will then have
    the option to `Open`, `Copy`, or `Restore` any files over the range of snapshots.


    ![](images/283.jpg)


    ## 3.19-Rsync Replication


    As mentioned previously, Rsync is a powerful backup utility widely used in the
    Linux community. It''s poor man''s High- Availability without a fence device!
    In ways it''s better! Of course, you won''t have millisecond failover and true
    HA, but you will have several copies of data that can be accessed very quickly(5-10
    minutes) if needed. The biggest BONUS here is price! A true hardware fenced High-Availability
    storage farm will cost you between $20000 and $100000 US Currency!


    In order to setup Rsync for first run make sure you have created identical datasets
    on every freeNAS node. So, if you have 3 servers planned, then you will have 3
    sets of identical datasets for the Rsync backups.

