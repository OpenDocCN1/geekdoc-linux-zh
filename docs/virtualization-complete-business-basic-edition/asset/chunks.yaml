    of memory resource!


    To continue: Click Next 


    ![](images/00024.jpg)  


    Next you will setup the network bridge.  We will set the pfSense LAN adapter to
    vmbr0\.  This is safe with a router because the only traffic passing through is
    internet, which is low bandwidth relative to the network adapters maximum capacity.
     For adapter model select Intel E1000\.  I strongly recommend it!


    NOTE:  Normally you will NOT want to use vmbr0 for VM''s because it is the default
    adapter for the user interface!  You can use it!  Just try to avoid doing so unless
    the VM is low bandwidth.


    To continue: Click Next 


    ![](images/00362.jpg)  


    Finally you will confirm the configuration.


    To continue: Click Finish 


    ![](images/00243.jpg)  


    At this point you should be able to see your new VM configuration in the node
    tree as pictured below.  You can click the various tabs at the top for additional
    configuration options.  You can also edit individual items within the configuration
    by clicking on them and selecting edit


    ![](images/00196.jpg)  


    Since your pfSense router only has one network adapter we will need to add another.
     The new adapter is needed for your WAN(Internet) connection.  It is important
     that you know the correct Mac/Hardware address for this to work.  If you followed
    the directions to this point you should have labeled the adapters making it easy
    to match the Mac/Hardware addresses by looking at the back of the machine.


    Let''s continue: Click Add >> Network Device 


    ![](images/00180.jpg)  


    Now add a new network bridge(shown below).  For this example I have chosen vmbr1
    but that can be changed very easily whenever you want.


    ![](images/00035.jpg)  


    Now you will see your newly added adapter in the hardware list(pictured below).


    MAC address NOTE: The hardware address you see is an alias and not the actual
    hardware address!  That''s why you labeled them!


    ![](images/00095.jpg)  


    Now let''s double check the association between vmbr1 and eth1\.  We just want
    to make certain that vmbr1 doesn''t point to eth4 instead.  To check the association
    go to the network tab in node view(pictured below).  You can clearly see associations
    between all the adapters.  We still don''t know the real Mac address though!


    ![](images/00242.jpg)  


    To find out which adapter to plug your internet into will require an additional
    step.  I know this may seem complicated but it''s really not that bad once you
    wrap your head around it.  You will use a special Linux command called ifconfig.


    # ifconfig eth1


    Let''s find that Mac now!


    Open up your PuTTY program and login as root like you did when we setup the storage.


    Now type the command below followed by the Enter key.


    # ifconfig eth1


    The results will show the actual Mac/Hardware address as picture below.


    ![](images/00015.jpg)  


    Now that you have the real HW address you can match the labeled adapter and plug
    in your internet.'
