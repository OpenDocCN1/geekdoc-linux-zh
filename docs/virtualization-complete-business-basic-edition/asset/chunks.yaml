     Before installation can begin you must create the VM configuration.  I recommend
    a 12Gb IDE virtual disk with 8Gb of Ram for this install.  If you need to review
    those steps again click here: [1.9-Creating VM Configuration](#index_split_015.html_filepos77013).
     You may also want to add a DHCP client reservation in pfSense before you begin
    the actual install.


