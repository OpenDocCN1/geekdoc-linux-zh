    ![](images/00342.jpg)  


    2.9-OpenVPN


    VPN is a tunneling protocol which allows secure remote access to your system.
     Once connected to the VPN tunnel clients can work as though they were onsite.
     In order for VPN to work you must have a static IP address and all remote machines
    must have a client connector installed.  Configuring VPN manually can be quite
    challenging, even to professionals, but the pfSense developers have included a
    fantastic wizard to get you up and running with minimal effort.  NOTE:  even with
    the wizard this will be a lengthy chapter so better get your coffee and pay close
    attention!  Let''s get started!


    2.9.1-OpenVPN Client Export Utility


    To begin:  click System>Packages(shown below).


    ![](images/00156.jpg)  


    If you do not see OpenVPN Client Export Utility under Installed Packages download
    and install it under the Available Packages tab(pictured below).


    ![](images/00251.jpg)  


    2.9.2-OpenVPN Setup Wizard


    Once the OpenVPN Client Export Utility is installed go to the main dashboard screen
    then click VPN>OpenVPN(pictured below).


    ![](images/00146.jpg)  


    Next, click the Wizards tab(pictured below).


    ![](images/00030.jpg)  


    For now, select Local User Access from the dropdown then click the Next button(shown
    below).


    ![](images/00021.jpg)  


    You will now need to establish a Certificate Authority (CA).  Complete the form
    as shown below then click Add new CA.


    ![](images/00054.jpg)  


    Next, you will need to create a New Server Certificate.  Keep the Key length at
    1024 bits for best results.  When finished click Create new Certificate(pictured
    below).


    ![](images/00181.jpg)  


    In the General Information section below I have left Protocol and Port values
    at default.  The Interface should normally be WAN but I have renamed mine to JAB
    in this server.  This helps for identification purposes when you have several
    WAN connections all hosting VPN tunnels.


    ![](images/00274.jpg)  


    The Cryptographic Settings(shown below) should also be left at default unless
    you know what you are doing.


    ![](images/00208.jpg)  


    For Tunnel Settings(shown below) I have allowed 1 client in the 10.10.10.0/24
    Tunnel Network.  This client will have access to the 192.168.0.0/24 Local Network.


    ![](images/00221.jpg)  '
