    freeNAS developers wisely decided to give every opportunity to opt out of destructive
    actions. Notice the dialog with a Red background(pictured below).


    ![](images/00037.jpg)


    I have provided a pre-populated volume with dataset naming conventions that I
    prefer to use. The `ds` prefix simply indicates that I am working with a dataset
    under the volume named `pool0`. Notice that it is possible to nest the datasets
    within other datasets(pictured below).


    ![](images/00253.jpg)


    You can edit an existing dataset at any time. Let''s look at the properties of
    the dataset named `ds.filestore/protected` (pictured below).


    ![](images/00067.jpg)


    To view the dataset properties click `Edit ZFS Options`(shown below).


    ![](images/00147.jpg)


    If you need additional space for this dataset change both quota values according
    to your needs(shown below).


    ![](images/00017.jpg)


    Pay close attention NOT to exceed the size of the parent dataset(shown below)!


    ![](images/00033.jpg)


    ## 3.14-ZFS Permissions


    Generally, when you create a dataset you will need to set appropriate permissions
    for users. For the purpose of this example we will setup public permissions, which
    are wide open. No need to worry though, you can also restrict a public share by
    IP address under the `Shares` tab. I can say with confidence, even with public
    permissions set on your shares, so long as `pfSense` is setup according to this
    book, using hardware filtering, that you are quite secure!


    Let''s set permissions on the `ds.backups` dataset now(pictured below).


    ![](images/00244.jpg)


    To proceed: click `Change Permissions`(pictured below)


    ![](images/00138.jpg)


    You should now see the `Permissions` dialog(pictured below). To enable public
    access to this dataset I have checked every box under `Mode` for `Owner`, `Group`,
    and `Other`. The recursive check box means that ALL datasets nested under this
    one will have permissions changed as well. `ACL` can be left defaulted to `Unix`
    even if configured under a domain. If you need specific user or group privileges
    they can be selected using the dropdown box.


    NOTE: If you have trouble connecting to a share this is where you start your troubleshooting.
    Resetting permissions as shown below will guarantee access to the dataset.


    ![](images/00014.jpg)


    ## 3.15-freeNAS Services


    Your server can be setup to host a variety of services which can be found under
    the `Services` tab(pictured below). In this book we will be primarily concerned
    with `CIFS`, `iSCSI`, `NFS`, `Rsync`, and `SSH`.


    ![](images/00316.jpg)


    ### 3.15.1-CIFS(Windows Sharing) Service


    First we''ll look at `CIFS` (otherwise known as `SAMBA`). This service is the
    backbone of Windows compatible networks and will be your primary file sharing
    protocol. Let''s look at the configuration options for `CIFS` now.


    To proceed: click the wrench icon(shown below)


    ![](images/00006.jpg)


    The default configuration options(pictured below) will allow sharing of files
    in a Windows network as a computer named `freenas` within the `Workgroup` named
    `WORKGROUP`. You will need to change these names according to your needs! For
    example: My domain name is called `yourwebs.us` and my workgroup is called `YOURWEBS`.
    Because I have more than one freeNAS server running I use names such as `freeNAS-1`,
    `freeNAS-2`, `freeNAS-3`, etc.


    ![](images/00233.jpg)


    ### 3.15.2-NFS(Linux Sharing) Service


    Next, we''ll look at `NFS`. This service is the original Linux based file sharing
    protocol. Today you can install services on windows to connect to `NFS` shares.
    I prefer to keep my `NFS` shares locked down to only Linux machines. If you need
    windows access just enable a temporary `CIFS` share that only you have permissions
    for. Let''s look at the configuration options for `NFS` now.


    To proceed: click the wrench icon(shown below)


    ![](images/00044.jpg)


    The only configuration option that you will ever need to change is the `Bind IP
    Address`(shown below). It is possible to bind `NFS` to a different IP than that
    used for `CIFS` shares. For best performance I recommend having 2 network adapters,
    one for `CIFS` and the other for `NFS` and `Rsync`.


    ![](images/00005.jpg)


    ### 3.15.3-iSCSI Target Service


    Next, we''ll look at `iSCSI` Global options. `iSCSI` is a powerful networking
    protocol and can be a little challenging for beginners. It allows serialized shares
    to be created in such a way that the guest operating system is fooled into believing
    it has multiple physical drives. Let''s look at the `Global Configuration` options
    for `iSCSI` now.


    To proceed: click the wrench icon(shown below)


    ![](images/00206.jpg)


    You should now see the `Target Global Configuration` screen as shown below. The
    only thing on this screen you should touch is the `Base Name`.


    ### 3.15.4-Rsync(Backup) Service


    Now, we''ll look at `Rsync` (Backup). `Rsync` is a powerful utility widely used
    in the community. It provides excellent backups. Let''s look at the `Rsync` configuration
    options.


    To proceed: click the wrench icon(shown below)


    ![](images/00153.jpg)


    ### 3.15.5-SSH(Secure Shell) Service


    Finally, we''ll look at `SSH` (Secure Shell). `SSH` stands for secure shell. It
    allows remote logins via a console such as `PuTTY`. Let''s look at the `SSH` configuration
    options.


    To proceed: click the wrench icon(shown below)


    ![](images/00304.jpg)


    ## 3.16-Add Network Shares


    ### 3.16.1-NFS Shares


    As mentioned earlier in the book, I prefer to use `NFS` for Proxmox backups. We
    will now create a share called `netbackups` which will be used for Proxmox VM
    image backups.


    To proceed click `Sharing>NFS`(pictured below)


    ![](images/00259.jpg)


    Next, click `Add NFS Share`(pictured below).


    ![](images/00129.jpg)


    When the dialog appears type in the appropriate information(pictured below). Notice
    that I have authorized 3 Proxmox server IP addresses. Under `Maproot User` select
    `root`.


    ### 3.16.2-Windows Shares


    Setting up a Windows share is very similar to `NFS`. We will now create a share
    called `netbackups` which can be used to access Proxmox VM image backups from
    Windows.


    To proceed: click `Add CIFS Share`(pictured below).


    ![](images/00069.jpg)

