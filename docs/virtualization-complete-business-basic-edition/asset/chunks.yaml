    A critical component of any modern business network is intrusion detection or
    IDS.  When it comes to IDS Snort is the most popular package used today!  The
    concept behind IDS is to monitor transmission protocols for uncharacteristic behavior
    and then kill the connection when this behavior is detected.  This is precisely
    the way Antivirus and Malware providers find new threats and create updates to
    counter those threats.


    Most IDS systems are setup to monitor external connections by default.  My recommendation
    is to monitor your internal connections instead.  This method catches malicious
