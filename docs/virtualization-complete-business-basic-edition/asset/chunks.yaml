    ![](images/00013.jpg)  


    Next you will see the configuration console(pictured below).  Use your arrow down
    to Accept These Settings followed by the Enter key.


    ![](images/00300.jpg)  


    Now, choose the Quick/Easy Install (pictured below)


    ![](images/00065.jpg)  


    Hit OK (pictured below)


    ![](images/00270.jpg)  


    You will want to select the Standard Kernel (pictured below) for our install.


    ![](images/00010.jpg)  


    Next, select Reboot (pictured below).


    ![](images/00016.jpg)  


    When the system reboots you will notice the DEFAULT credentials are:


    Username: admin 


    Password: pfsense 


    ![](images/00265.jpg)  


    2.3-Assigning Network Interfaces


    Next, you will setup the network!  Since pfSense is a BSD based distribution your
    network interfaces are named differently.  If you have used e1000 Gigabit they
    will show up as em(x).  If you have used Realtek adapters they will be named re(x).
     Please pay close attention now!  This is the only tricky part to the install!


    Notice in the picture below that em1 has been assigned an IP Address and is defaulted
    to the LAN interface.  This is NOT correct!  The ONLY possible way a DHCP address
    could have been assigned is if the em1 interface (pictured below) was actually
    connected to the Internet Router.  We need to flip these interfaces around so
    the LAN becomes em0.


    NOTE:  I find it easiest to ALWAYS set the LAN to the first interface which is
    ALWAYS going to be em0 or re0.


    To assign em0 to the LAN select option 1 then press ENTER 


    ![](images/00326.jpg)  


    You will see the following prompt(pictured below).  Type n for NO then press  ENTER.
     We do NOT want VLAN.  Also notice the interface mac addresses.  These should
    match those in your Proxmox vm configuration.


    ![](images/00367.jpg)  


    Next, you will be prompted for the WAN interface name.  Type em1 then press ENTER.


    ![](images/00171.jpg)  


    pfSense will now ask for the LAN interface name(pictured below).  Type em0 then
    press ENTER.


    ![](images/00245.jpg)  


    Since we will NOT setup an optional  interface(opt1) right now simply press the
    ENTER key which indicates NO SELECTION(pictured below).


    ![](images/00223.jpg)  


    Your interfaces will now be assigned(shown below).  Type y then press ENTER.


    ![](images/00225.jpg)  


    2.3-Assigning IP Addresses


    Now you will need to set the IP address of the LAN adapter  This will be the address
    the web interface runs on.  It will also serve as the default gateway and DNS
    server on your local network.  NOTE:  I prefer to set this address as the last
    in the subnet(x.x.x.254).


    To proceed:  select option 2 then press ENTER 


    ![](images/00117.jpg)  


    Next, type the number of the interface you wish to configure.  In our case we
    want the LAN adapter which is number 2 in the list(pictured below).


    To proceed:  Type 2 then press ENTER 


    ![](images/00317.jpg)  


    You will now be prompted for the new LAN IPv4 address.  For the purpose of the
    tutorial I have used 192.168.0.254(pictured below).


    To proceed:  Type the LAN IP you will use then press ENTER 


    ![](images/00144.jpg)  


    Next you will be asked to provide a Subnet mask bit count in CIDR notation.  This
    will almost ALWAYS be 24 for a local network.


    To proceed:  Type 24 then press ENTER 


    ![](images/00177.jpg)  


    The next few prompts can be skipped by pressing ENTER which indicates NO SELECTION(pictured
    below).


    To proceed:  press ENTER 


    ![](images/00318.jpg)  


    You will NOT need IPv6 configured(pictured below) on your LAN so this step can
    be skipped.


    To proceed:  press ENTER 


    ![](images/00082.jpg)  


    To make the console configuration as simple as possible we will NOT enable DHCP
    on the LAN at this time(pictured below).  That will be setup using the web interface.


    To proceed:  Type n then press ENTER 


    ![](images/00267.jpg)  


    You will now be prompted to revert the web interface(pictured below) from secure(https)
    to non-secure(http).  You may wish to leave it set to secure.


    To proceed:  Type n then press ENTER 


    ![](images/00351.jpg)  


    The configuration should now be complete.


    To proceed:  press ENTER 


    ![](images/00003.jpg)  


    2.4-Reset Admin Password


    At some point you may wish to default the Admin credentials.  The menu option
    is number 3(pictured below).


    ![](images/00078.jpg)  


    If you select option 3 and press y indicating YES the credentials will be reset.
     The defaults  are:


    Username: admin 


    Password: pfsense 


    ![](images/00075.jpg)  


    2.5-Web Configuration Wizard


    You are now ready to open your web browser to the LAN address you just set(https://192.168.0.254)
    for a first login.  For the purpose of this tutorial I have used Mozilla Firefox.


    To continue(pictured below): click I Understand the Risks 


    ![](images/00257.jpg)  


    Next(pictured below):  click Add Exception 


    ![](images/00178.jpg)  


    Now(pictured below):  click Confirm Security Exception 


    ![](images/00228.jpg)  


    To proceed:  login(pictured below) using the default password: pfsense


    ![](images/00256.jpg)  


    Once logged in the wizard will start(pictured below).  Simply follow the prompts.


    To proceed: click Next 


    ![](images/00160.jpg)  


    pfSense now offers Gold Subscription signup(pictured below).  This is NOT required
    in any way to use the software.


    To proceed:  click Next 


    ![](images/00110.jpg)  


    You will now be prompted to enter some basic information about your router(pictured
    below).  To specify a .com domain other than localdomain or YOURWEBS you MUST
    have a registrar such as Go Daddy.


    For example:  I have a registered YOURWEBS.US domain so I can enter that below.
     If I didn''t have that domain registered I could still use YOURWEBS leaving off
    the .US suffix.  This will work just fine with my local Zentyal domain controller
    install.  Regardless what name you choose, the domain entry should match that
    of the Zentyal controller we''ll be setting up later in the book.  My preference
    here is to register a domain that will NOT be used by the public but that still
    resolves to my WAN IP address.


    You may also wish to use Google DNS servers(8.8.8.8 and 8.8.4.4) as alternates
    instead of your ISP.  This option can sometimes solve name resolution issues.


    To proceed:  click Next 


    ![](images/00048.jpg)  


    Now enter your Time server(recommend default) and Timezone information(pictured
    below).


    To proceed:  click Next 


    ![](images/00119.jpg)  


    Since the WAN was already configured earlier this is redundant.  It should almost
    ALWAYS be configured for DHCP (pictured below) with most ISP''s today.


    ![](images/00057.jpg)  


    Scrolling down to the bottom of the screen reveals the following options(pictured
    below).  You want both of these checked for WAN interfaces.


    To proceed:  click Next 


    ![](images/00182.jpg)  '
