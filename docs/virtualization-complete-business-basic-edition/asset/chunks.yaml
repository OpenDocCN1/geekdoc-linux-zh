    3.19.3-Tips On Using Rsync


    Setting up Tasks and Modules can be confusing at first so be patient and think
    about what you''re doing.


    *   > > Remember that when configuring Rsync in Push mode(used in this book) live
    datasets will have a Task and backup datasets will have a Module.


    *   > > Avoid having live datasets on every freeNAS node.  You should have at
    least 1 freeNAS node where NO live data is hosted.  This normally means there
    will be NO Rsync Push Tasks on that machine.


    *   > > Double check every Task and Module you create.  This will help prevent
    overwriting important live data.


    *   > > When setting up a new freeNAS server with a large amount of data only
    add a few modules at a time.  You would experience a big performance hit if several
    Terabytes of data tried to synchronize all at once.


    *   > > Use good naming practices to avoid confusion.


    *   > > Use dedicated network adapters and an isolated subnet to dramatically
    improve performance.  You may also want to limit adapter throughput OR use 100
    Base virtual adapters for these dedicated links.


    3.20-Domain Membership


    A domain directory consists of a central database and allows MUCH easier management
    of Users, Groups, and Network Services.  Most domains are managed by Microsoft
    active directory running on a Windows server.  In this book I have included an
    open source alternative which leverages the powerful Samba4 platform running on
    Zentyal Small Business Server.


    Although freeNAS is capable of acting as a Domain Controller, I prefer to use
    Zentyal because it keeps things modular and it can be readily setup for Master/Slave
    control.  This method is preferred because it adds redundancy to the central database!


    Let''s add this freeNAS server to a Zentyal controlled domain.  In the tradition
    of keeping things simple and compatible I will use the older NT4 database style(shown
    below).


    To configure Domain Directory Service click System>General then select NT4 from
    the dropdown list(shown below).  Don''t forget to save the setting!


    ![](images/00346.jpg)  


    Next, go to Services>Directory Services and click the wrench icon(pictured below)


    ![](images/00128.jpg)  


    You should now see the Directory Service dialog(shown below).  Enter the Domain
    Controller IP address instead of the host name.  This is the address of the Zentyal
    server.  NOTE:   This address should also be entered in your pfSense DHCP static
    reservation list.


    PAY ATTENTION HERE:  With the NT4 based directory you DO NOT need to enter .com,
    .org, .us, etc domain suffixes.  Also, your Workgroup Name is limited to 15 characters.
     I have entered YOURWEBS in the Workgroup Name even though the domain name I will
    be controlling is YOURWEBS.US(pictured below).


    ![](images/00007.jpg)  


    Earlier we setup CIFS(Windows) shares on your new freeNAS server.  When configuring
    the machine for domain membership the CIFS Workgroup settings should match those
    for Directory Services.


    Double check your settings now by going to Services>CIFS then clicking the wrench
    icon.  I have included my settings for your reference(pictured below).  Remember
