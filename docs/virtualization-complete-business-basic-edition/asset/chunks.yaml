    在 `Snort Interfaces`（Snort 接口）选项卡下，通过点击 `+` 按钮添加接口。由于我们已配置了 `LAN` 接口进行监控，我们将使用
    `LAN` 接口。


    ![](img/0298.jpg)

    ![](img/0275.jpg)


