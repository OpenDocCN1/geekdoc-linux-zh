    # `qm set 800 -ide1 /dev/freenas4/6tbstore`


    在 PuTTY 中输入的命令如下（如下图所示）。


    ![](img/00356.jpg)


    该命令的结果通过 `freeNAS-4` 硬件窗口中显示的新 `IDE1` 驱动器清晰可见（如下所示）。注意：你需要在新磁盘出现之前刷新标签页。


    ![](img/00200.jpg)


    ## 3.5-不备份的存储设置


    **重要**：我们**仅**备份 `freeNAS` 主磁盘(`ide0`)，而**不**备份 `6TB` 存储驱动器。如果发生这种情况，将严重降低你的系统性能！你的备份应该在
    `freeNAS` 虚拟机内部使用 `RSync` 进行配置。通过如下所示编辑磁盘属性可以轻松避免这种行为。


    ![](img/00055.jpg)


    注意磁盘属性（如下所示），次要磁盘(`ide1`) 将**不会**被包含在备份中。


    ![](img/00052.jpg)


    现在可以启动 `freeNAS-4` 虚拟机（上图），并将新的 `6TB` 磁盘配置为 `ZFS` 条带。


    请记住：需要注意的是，`freeNAS-4` 现在通过其硬件直通磁盘与 `Proxmox3` 服务器绑定。除非移除物理磁盘，否则无法将其移动到其他物理机器。


    ## 3.6-通过控制台启动 freeNAS


    现在，通过打开右上角的 `Proxmox` 控制台启动新的 `freeNAS` 虚拟机。当控制台出现时，点击 `Start` 按钮（如下所示）。


    ![](img/00195.jpg)


    启动控制台窗口是为了确保虚拟机正常启动并通过 `DHCP` 分配适当的 IP 地址。注意控制台显示底部我们的网页界面地址为 `http://192.168.0.22`


    ![](img/00189.jpg)


    ## 3.7-初始登录


    现在你可以打开浏览器并输入 `freeNAS` 虚拟机的地址。我使用并推荐 Mozilla Firefox。


    你看到的第一个屏幕是 `root` 用户密码更改对话框（如下所示）。设置一个强密码！


    ![](img/00051.jpg)


    一旦设置好密码，你应该就能看到完整的网页管理界面（如下所示）。


    ![](img/00287.jpg)


    ## 3.8-freeNAS 导航


    导航非常直观！你在主屏幕顶部会找到一系列标签。左侧列中还有一个树状结构（如下所示）。


    ![](img/00187.jpg)


    ## 3.9-网络配置


    在安装期间，`freeNAS` 默认接受 `DHCP`，主机设置为 `freenas`。当你运行任何类型的服务器时，并不想要 `DHCP`。此外，当你的网络上运行多台
    `freenas` 机器时，它们不能具有相同的名称！让我们现在更改它！


    在 `Network` > `Global Configuration` 标签（如下所示）下，你可以更改 `Hostname`、`Domain`、`Gateway`
    和 `Nameserver` 信息。在这种情况下，我将 `Gateway` 和 `Nameserver` 设置为运行在 Proxmox 上的 `pfSense`
    器的 IP 地址。别忘记保存更改！


    ![](img/00096.jpg)


    现在，点击 `Network Summary`（如下所示）标签来验证我们的网络接口名称和地址。这将用于设置静态地址映射。


    ![](img/00097.jpg)


    接下来，点击 `Interfaces` > `Add Interface`（如下所示）。


    ![](img/00041.jpg)


    当接口对话框出现时（如下所示），输入相应的 `Interface Name` 和 `IP Address`。`Netmask` 几乎**总是** (`(255.255.255.0)`）。这是家庭或业务预留范围最常用的
    `Netmask`。


    ![](img/00269.jpg)


    完成后，你应该能在 `Interfaces`（如下所示）下看到列出的条目。


    ![](img/00292.jpg)


    ## 3.10-用户与组


    ### 3.10.1-添加新用户


    如果你在本地没有运行域，则需要将用户添加到你的服务器或服务器。在主界面的最右侧，你会找到 `Account` 按钮（如下所示）。


    继续：点击 `Account`


    ![](img/00159.jpg)


    然后你应该看到默认的 `Users` 和 `Groups` 页面。你可以使用页面顶部的标签轻松进行导航。


    添加成员：点击 `Add User`（如下所示）


    ![](img/00161.jpg)


    `Add User` 对话框随后会显示（如下所示）。根据需要输入新的 `User` 信息。我包含了示例数据供参考。


    ![](img/00071.jpg)


    在输入表单底部有一个区域允许你为新用户选择 `Auxiliary groups`。让我们将 `John Smith` 添加到 `ftp` 组！只需双击 `Available`
    列中相应的组即可。


    ### 3.10.2-添加新用户（根据文本流修正：添加组）


    *注：源文本具有重复编号和混乱的章节。我将按照提供的内容进行处理。*

