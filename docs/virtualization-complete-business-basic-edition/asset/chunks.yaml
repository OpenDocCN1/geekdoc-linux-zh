    \ will set your root password and email address.  Make sure to use a strong root\
    \ password!\n\nTo continue: Click Next \n\n![](images/00018.jpg)  \n\nNetwork\
    \ Configuration\n\nNext you will setup your network.  Your settings should look\
    \ something like this(where x can be substituted for any number between 0 and\
    \ 255):\n\nFQDN: proxmox1.yourdomain.com\n\nIP Address:  192.168.x.2\n\nNetmask:\
    \ 255.255.255.0\n\nGateway: 192.168.x.254\n\nDNS: 192.168.x.254\n\nNOTE:  We choose\
    \ 192.168.x.254 for both gateway and DNS because it lies outside the DHCP address\
    \ range defaults(192.168.x.100-192.168.x.200) on most routers.  For specific rules\
    \ on private IP addressing do an internet search for RFC 1918 guidelines.  I highly\
    \ recommend using pfSense for a managed endpoint/routing platform!  I have used\
    \ it for 7 years virtualized without incident!  It will handle all DHCP, DNS,\
    \ NAT, VPN, and Intrusion Detection.  You can download it here:  [pfSense router](https://www.pfsense.org/download/) \n\
    \nTo continue: Click Next \n\n![](images/00369.jpg) \n\nInstallation Successful\n\
    \nTo continue: Click Reboot \n\n![](images/00353.jpg) \n\nPLEASE NOTE:  When Proxmox\
    \ reboots take note of the address for logging in to the web interface.  It should\
    \ match the address set in the previous network configuration screen.\n\nExample:\
    \  https://192.168.10.2:8006\n\n![](images/00198.jpg)  \n\nAt this point you need\
    \ to login as root using the password you provided during installation and issue\
    \ a shutdown.  The command is shown below.  Only type the word poweroff followed\
    \ by the Enter key.\n\n# poweroff\n\nHIGHLY RECOMMENDED:  Once the machine powers\
    \ down you will install any additional network adapters and hard disks.  I recommend\
    \ labeling the network adapters used in the system with MAC/Hardware address.\
    \  If you are not familiar with MAC/hardware addresses they usually look something\
    \ like this  92:26:b9:c2:42:15 and should be clearly identified on your device.\
    \  You need the ability to identify each network port externally using its MAC.\
    \  I personally write the last 4 digits of the MAC on each adapter bracket with\
    \ magic marker for easy identification.\n\nI have found that some USB network\
    \ adapters do work well and will be pre-labeled with ID and serial.  I use these\
    \ for low bandwidth connections such as the pfSense router.\n\nWhen finished start\
    \ the machine for the next step in the setup.\n\n1.3-Initial Login\n\nNow the\
    \ you have completed the install it is time to login.  Open your favorite web\
    \ browser (I use Mozilla Firefox) then enter the ip address you chose during installation."
