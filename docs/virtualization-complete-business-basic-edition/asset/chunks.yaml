    \ stressful. So much so, that I can remember times when I questioned whether or\
    \ not to remain in the field! I can honestly say that virtualization has changed\
    \ things for the better! The ease of management and maintenance that it provides\
    \ has brought back that flame that inspired me so many years ago. I don't think\
    \ there's a day that passes where I am not awe-inspired with how well this system\
    \ works! It's like the terminator! Please keep in mind, that none of this would\
    \ be possible if it were not for the hard work and dedication of the open source\
    \ development community! So, please! Support the community where you can!\n\n\
    In closing, I would like to thank all those who have purchased and read this book.\
    \ Many thousands of hours went into production testing and research before I felt\
    \ confident that this system was the system! I hope that it has been instrumental\
