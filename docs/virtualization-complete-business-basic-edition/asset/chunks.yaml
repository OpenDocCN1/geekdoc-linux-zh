    Let''s add an `Rsync` task for the primary dataset named `netbackups`! This dataset
    contains important live data and is where Proxmox stores ALL of the VM image backups
    in a system configured like [(Option-2) Optimized For Network Backed Storage](#index_split_006.html_filepos42952)!


    To proceed: click `System`>`Rsync Tasks`>`Add Rsync Task` (shown below)


    ![](images/00157.jpg)


    You should now see the task dialog box. Click `Browse` and select the appropriate
    dataset(as shown below).


    ![](images/00199.jpg)


    Notice(below) that I have chosen the `netbackups` dataset which is nested under
    `ds.backups`! Please `NOTE` that when `Rsync` runs it will backup the entire `netbackups`
    dataset folder. This is `IMPORTANT` to remember when setting up the backup datasets
    on other nodes.


    > ![](images/00113.jpg)


    Next you will need to enter the Remote Host IP address and Remote Module Name.
    Notice, I have chosen `freenas5.netbackups` as the module name(pictured below).
    This identifies `freenas5` as the remote node and `netbackups` as the dataset
    folder I am backing up. Now, if I want to replicate `netbackups` to another server(`freenas-2`),
    the module names will uniquely identify each replication.


    Leave `Rsync` mode set to `module` and `Direction` set to `Push`. You may wish
    to enter a description that will indicate the frequency of the backups.


    ![](images/00120.jpg)


    Next, select the desired frequency of the backup by adjusting the sliders(fig.
    1-3 below). `NOTE`: Every 15 minutes may be too frequent for good performance!
    This is just an example! I generally use 1 hour for files that change frequently
    and 1 day for static files.


    fig. 1

    ![](images/00258.jpg)


    fig. 2

    ![](images/00332.jpg)


    fig. 3

    ![](images/00247.jpg)


    You may also choose a specific month(shown Below)


    ![](images/00167.jpg)


    Or, choose a specific day of the week(shown below).


    ![](images/00169.jpg)


    The default `User` is set to `root`(shown below). I would `NOT` change this unless
    you know what you''re doing.


    ![](images/00230.jpg)


    I like to use the options set as shown below.


    ![](images/00142.jpg)

    ![](images/00050.jpg)

    ![](images/00131.jpg)


    The screenshot below shows what a working `Rsync Tasks` table looks like. These
    tasks are configured on a fileserver named `freeNAS-1` hosting live data. All
    datasets are pushed to `Remote Modules` on nodes `freeNAS-2` and `freeNAS-4` every
    hour.


    ![](images/00092.jpg)


    ## 3.19.2-Add The Rsync Module


    Let''s setup an `Rsync Module` for a backup dataset on one of the other `freeNAS`
    nodes to synchronize the `netbackups` dataset now!


    To proceed: click `Services`>`Rsync` (shown below)


    ![](images/00130.jpg)


    Now, click `Add Rync Module`(shown below)


    ![](images/00136.jpg)


    You should now see the module dialog box(pictured below). Enter the `Module name`
    from the `Rsync` push task you previously configured(`freenas5.netbackups`). You
    may wish to use the same `Comment` from the `Rsync` push task. Leave the `Access
    Mode` set to `Read/Write` and `User` set to `root`.


    `NOTICE`: I have added the IP address of the primary `freeNAS` push task node
    in the `Hosts allow` field to limit access.


    `MOST IMPORTANT`: It is critical the `Path` be set to `/mnt/pool0/ds.backups`
    and NOT `/mnt/pool0/ds.backups/netbackups` or you will end up with a nested copy
    that looks something like this `/mnt/pool0/ds.backups/netbackups/netbackups`.


    ![](images/00152.jpg)


    The screenshot below shows what a working `Rsync Modules` table looks like. These
    Modules are configured on a machine named `freeNAS-4`. All datasets are pushed
    from `freeNAS-1` every hour.


    ![](images/00079.jpg)


    ## 3.19.3-Tips On Using Rsync


    Setting up Tasks and Modules can be confusing at first so be patient and think
    about what you''re doing.


    - > > Remember that when configuring `Rsync` in `Push mode`(used in this book)
    live datasets will have a `Task` and backup datasets will have a `Module`.

    - > > Avoid having live datasets on every `freeNAS` node. You should have at least
    1 `freeNAS` node where NO live data is hosted. This normally means there will
    be NO `Rsync Push Tasks` on that machine.

    - > > Double check every `Task` and `Module` you create. This will help prevent
    overwriting important live data.

    - > > When setting up Tasks and Modules, add a few at a time to avoid a performance
    hit if you tried to synchronize all data at once.

    - > > Use good naming practices to avoid confusion.

    - > > Use dedicated network adapters.

    - > > Use the `Directory Service` switch.


    ## 3.20-Domain Membership


    A domain consists of and allows management of `Users`, `Groups`, and `Network
    Services`. Although `freeNAS` is capable of acting as a `Domain Controller`, I
    prefer it for redundancy.


    Let''s add this `freeNAS` server to domain. To configure Domain Service click
    `System`>`General` then select `NT4` from the dropdown list.


    ![](images/0346.jpg)


    Next, go to `Services`>`Directory Services` and click the wrench icon


    ![](images/0128.jpg)


    You should now see the `Directory Service` dialog(shown below). Enter the `Domain
    Controller` IP address instead of the host name. `NOTE`: this address should also
    be entered in your `pfSense DHCP static reservation`.


    `PAY ATTENTION HERE`: With `NT4` directory you DO NOT need to enter `.com`, `.org`,
    `.us` etc suffixes. Also, your `Workgroup Name` is limited to 15 characters. I
    have entered `YOURWEBS` in the `Workgroup Name` even though the domain name I
    will controlling is `YOURWEBS.US`(pictured below).


    ![](images/00007.jpg)


    Earlier we setup `CIFS`(Windows) shares on your new `freeNAS` server. When configuring
    the machine for domain membership the `CIFS Workgroup settings should match those
    for `Directory Services`.


    Double check your settings now by going to `Services`>`CIFS` then clicking the
