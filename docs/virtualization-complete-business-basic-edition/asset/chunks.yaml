    At this point there is no storage drive for freeNAS to use for shares. We will
    now add the LVM striped volume that was created in Chapter 1.12 as a pass-through
    hard disk. You may wish to revisit that chapter!


    To begin, open the PuTTY program and login as root on your Proxmox server.


