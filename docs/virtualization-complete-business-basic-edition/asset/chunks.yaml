    If you have not created a dataset yet go back a do so now.  Otherwise, click close
    after your dataset selection(pictured below).


    ![](images/00212.jpg)  


    Now, carefully review your entries then click OK to proceed(pictured below).


    ![](images/00252.jpg)  


    You should now see the new NFS netbackups share in the list(pictured below).


    ![](images/00343.jpg)  


