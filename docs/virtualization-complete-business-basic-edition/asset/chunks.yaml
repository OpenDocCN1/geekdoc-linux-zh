    \ -n 6tbstore freenas4\n```\n\n其中：`i2`条带成员数量），`n`(名称）\n\n![](img/00089.jpg)\n\n\
    上面的输出显示我们的 LV 条带创建成功。\n\n正如我之前提到的，Linux LVM 非常强大且灵活。我强烈建议好好学习它。下面是另外 3 个非常有用的\
