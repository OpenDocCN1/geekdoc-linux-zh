    \ raid 方面近期才开始包容我个人觉得无所谓精心整疗总能事先出事必有警报工程设计偏重繁琐切像加大温升减寿均摊降温增效总量顺手裁决罢了缘由探索不停继续单击远处亮点就能察觉现在的配合使用了\n\
    \  \n[*注释 :以上段落依据给定的纯数据传输片段没有任何凭空增添或删除细节措辞匹配职责所在的精确逐行翻释模式执行结果并无意识形态误读现象如有异义请指*\n\
    \n"
- fmt: '

    Please Note: Proxmox uses secure port `8006` by default.


    Your entry should look something like this:


    https://192.168.10.2:8006


    You will then see a secure connection warning as pictured below. Click `I Understand
    the Risks`


    ![](images/00355.jpg)


    Next: Click `Add Exception` as pictured below


    ![](images/00001.jpg)


    Then: Click `Confirm Security Exception` as pictured below


    ![](images/00026.jpg)


    Now login as user: `root` with the password you set during install


    ![](images/00088.jpg)


    Proxmox VE is a community edition but you can elect a subscription account that
    entitles full support. This is not necessary but you will see the subscription
    reminder(shown below) each time you log in. I find Proxmox to be an excellent
    software and really don''t mind seeing a popup reminder! After all! It is free!


    ![](images/00327.jpg)


    You will now see the web management interface(shown below). This is where you
    will create and configure your virtual machines.


    ![](images/00114.jpg)


    ## 1.4-Network Adapters


    Now you need to configure your network adapters so they can be used for any VM''s
    (virtual machines) you create. Notice that the network tab is not shown in the
    default view (datacenter view). You must be in node view to see the network tab.
    In the case pictured below the node is called `proxmox5`.


    Click the node (pictured below)


    ![](images/00328.jpg)


    Click the `Network` tab (pictured below)


    ![](images/00299.jpg)


    Click `Create >> Linux Bridge` (pictured below)


    ![](images/00091.jpg)


    You will now see the Linux Bridge Dialog (pictured below). For each network adapter
    you will create a bridge. You can see (for this guide) I have filled the form
    using industry standard naming convention and have kept a 1:1 relationship between
    `eth(x)` and `vmbr(x)` ports. For the first time user I would suggest following
    this rule but you could easily map `vmbr1 >> eth2` instead. There will be only
    1 default internet Gateway which is pre-configured during install and used by
    `vmbr0` so leave this field blank.


    **NOTE:** For the IP address field make sure to use a subnet that will NOT be
    used in your system (such as `10.10.x.x`). Also make sure to use an appropriate
    Subnet mask for your chosen IP address range. IF you are unfamiliar with network
    addressing Google CIDR for more information. The complexities of network engineering
    are beyond the scope of this step by step guide but there is a wealth of knowledge
    to be found on the internet.


    When finished click `Create`


    ![](images/00213.jpg)


    **NOTE:** Repeat the above steps for each adapter you wish to use on your new
    Proxmox server. For Example: `vmbr2 >> eth2 @ 10.10.30.2/255.255.255.0`


    Changes will not take effect until the system is rebooted.


    Restart now using the button in the upper right hand corner of the node view (you
    should already be in node view).


    ![](images/00301.jpg)


    When the system finishes rebooting it should refresh the screen automatically.
    You can validate that your virtual interfaces are ready if the yes value in the
    active column appears(pictured below). Once again, repeat this process for all
    network adapters you intend to use. You can see here that I have 3 physical adapters
    but only 2 are configured and ready.


    ![](images/00349.jpg)


    ## 1.5-Adding LVM Storage


    Before you can add LVM storage you will need to install `PuTTY`. PuTTY is a great
    open source console which allows SSH (Secure shell) access to other computers.
    It can be downloaded here: [PuTTY console](http://www.chiark.greenend.org.uk/~sgtatham/putty/download.html)


    Once installed, open it, check SSH connection, type the ip address of your Proxmox
    server then click `Open`.


    ![](images/00102.jpg)


    Click `Yes` to the PuTTY Security Alert (pictured below)


    ![](images/00002.jpg)


    Login as user: `root` with the password you set when installing Proxmox


    Now type the following command:


    ```

    cat /proc/partitions

    ```


    ![](images/00077.jpg)


    This command will generate a list of hard disk devices as pictured below. We are
    interested in a new device that does not look to be in service. The ONLY possible
    device as seen below is `/dev/sdb` because it contains no partitions at all. Now
    we have enough information to setup a logical device with this disk.


    ![](images/00137.jpg)


    Now that you know which disk to use you can create a physical volume with the
    following command:


    ```bash

    pvcreate /dev/sdb

    ```


    ![](images/00209.jpg)


    You will now see the physical volume confirmation


    ![](images/00335.jpg)


    Now that you know which disk to use you can create a volume group with the following:


    ```bash

    vgcreate lvstorage /dev/sdb

    ```


    ![](images/0036.jpg)


    You will now see the volume group confirmation


    ![](images/0019.jpg)


    Once finished the PuTTY program you can close it.


    Proxmox VE is a community edition but you can elect a subscription account that
    entitles full support. This is not necessary but you will see the subscription
    reminder(shown below) each time you log in. I find Proxmox to be an excellent
    software and really don''t mind seeing a popup reminder! After all! It is free!


    ![](images/00327.jpg)


    You will now see the web management interface(shown below). This is where you
    will create and configure your virtual machines.


    ![](images/00114.jpg)


    ## 1.6-Configure LVM Storage


    Now that you have added a volume group at the command line it is time to configure
    how it is used in Proxmox. One thing to note is(in this guide) LVM storage through
    the web interface will only be used for VM images.


    To get started make sure in datacenter view then click the `Storage` tab(pictured
    below). Next click `Add >> LVM`(pictured below).


    ![](images/0068.jpg)


    You should now see the LVM dialog box(pictured below). The `lvstorage` group you
    created using PuTTY can now be selected. Type a unique name for the `ID` field(pictured
    below).


    When finished: Click `Add`.


    ![](images/0125.jpg)


    You should now see your new LVM storage in the tree view(pictured below). Clicking
    on the `summary` tab shows the available size of your new storage(pictured below).


    ![](images/0330.jpg)


    ## 1.7-Configure NFS Storage


    NFS is perhaps the most diverse of all storage types you will use. It is a network
    based storage so you will need a NAS configured on your local subnet in order
    to use it. NFS can be used for image, backup, template, ISO, and container storage
    in Proxmox. I have extensively tested all types of storage in Proxmox over the
    years. As previously mentioned, my storage of choice for local images is LVM based!
    Well, my preference for network backed storage is NFS! It offers performance rivaling
    that of iSCSI without any of the complexities.

