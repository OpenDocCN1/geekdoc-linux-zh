    除了使用虚拟机镜像备份外，保留一份 `freeNAS` 配置副本也是明智之举。当开发者重写构建方式导致某些软件包在更新时损坏时，配置备份变得尤为重要。在这种情况下，你的虚拟机镜像备份只能让你恢复到之前使用的版本。我在
    `freeNAS` 上**从没有**遇到过这种情况，所以不用太担心！


    要访问配置备份页面：点击 System > Settings > General（通用），然后点击 Save Config（保存配置，如下图所示）。


    ![](img/00012.jpg)


    当下载对话框出现时（如下所示），请将配置文件保存到磁盘。提示：我建议在优 盘上保留一份副本！


    ![](img/00204.jpg)


    恢复你的 freeNAS 配置应该是显而易懂的！只需使用 UploadConfig 选项即可。


    # 第 4 卷：Zentyal 域控制器


    ## 4.1 Zentyal 简介


    Zentyal 起于 2004 年，是一个开源项目。它拥有忠诚的全球社区，并活跃开发中。Zentyal Small Business Server CE 实际上是一个完整的业务解决方案。最新版本利用强大的
    Samba 包，该包可以有效模拟 Microsoft 域控制器。它是一个 CD/DVD ISO 格式的完整独立发行版，这使得安装变得非常简单。这是 Zentyal
    作为模块构建块包含在我们系统中的最新版本。在我们的系统中，我们将将其作为活动控制器来使用。你可以从 Sourceforge 下载旧版本（例如：http://sourceforge.net/projects/zentyalseries/OldVersion/zental-40-am64.iso）。我没有在
    Linux Mint (桌面) 或 Server 上安装过该版本。界面基本保持相同，但发送速度将比在旧版引擎中看到的更快。这种方法是可能的，消除了专业术语。**粗体文本**````examplseuccedesrialzingfinees
    "xtra#$%^&**()"``applycations Reflectionshedulaflow"""`

    '
