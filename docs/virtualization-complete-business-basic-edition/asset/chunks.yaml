    \ advised by the Proxmox developers to only install to a single disk partitioned\
    \ and managed by LVM.  Raid has not been supported until recently.  My personal\
    \ opinion is that raid really doesn't matter.  A properly maintained system will\
    \ always be pulled from service before a catastrophic  disk failure happens.  There\
    \ are ALWAYS warning signs!  From an engineering perspective a parity array such\
    \ as RAID(1, 5, 6, or 10) introduces extended duty cycles and heat buildup thus\
    \ shortening motor life.  A striping array such as RAID-0 reduces duty cycles\
    \ and heat buildup thus increasing motor life.  It also provides increased throughput\
    \ as a bonus!  It is the only RAID I use for these stated reasons!\n\nBack to\
    \ the install!  By clicking the options button below you will notice that  Proxmox\
    \ now allows for ZFS raid configuration.  As mentioned above I do not use this\
    \ but it is an option if you desire.  If you are following my instructions, which\
    \ you should be, we will be performing a default installation to the primary target\
    \ disk (/dev/sda) so close the options dialog if you opened it.\n\nTo continue:\
    \ Click Next \n\n![](images/00249.jpg)  \n\nChoose Your Location And Time\n\n\
    Next you will setup your default location and time zone.\n\nTo continue: Click\
