    \n## 3.17-ZFS 快照备份\n\nZFS 文件系统可能最好的功能就是写时复制（copy on write）。此功能允许几乎立即从快照存档恢复备份。如果设置和使用得当，你**永远**不需要其他形式的备份软件……永远不需要！！！我强烈建议使用我的最佳实践方法。它涉及运行\
