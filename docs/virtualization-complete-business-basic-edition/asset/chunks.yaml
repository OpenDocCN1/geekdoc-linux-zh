    \ only have one disk attached to the motherboard for a fresh install. Just detach\
    \ all disks with exception of the one used for the OS. This avoids any possible\
    \ `MBR` issues if you ever need to remove disks due to failure. It's easy to get\
    \ confused if you have multiple hard disks installed in any machine. For this\
    \ reason I like to include a hard disk ID map. This can be as simple as a sticky\
    \ note or magic marker ID's on each disk.\n\n**NOTE**: It has been long advised\
