    \ disk and boot the machine.  You will be greeted by the following window.\n\n\
    To continue: Press Enter \n\n![](images/00084.jpg)  \n\nEULA\n\nThe next screen\
    \ (shown below) contains the END USER LICENSE AGREEMENT (EULA).  I know you will\
    \ carefully read this from beginning to end!  When finished reading:\n\nTo continue:\
    \ Click I Agree \n\n![](images/00081.jpg)  \n\nConfiguring The Hard Disk\n\nThis\
    \ step assumes a simple install with one drive and no raid.  My personal preference\
    \ here is to only have one disk attached to the motherboard for a fresh install.\
    \  Just detach all disks with exception of the one used for the OS. This avoids\
