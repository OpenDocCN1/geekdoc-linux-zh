    在 `Updates`（更新）选项卡如下所示，只需点击页面中间的`Update` 按钮。


    ![](img/00234.jpg)


    ### 2.10.5-威胁规则类别


    威胁规则类别针对特定的接口。由于我们已配置 `LAN` 接口进行监控，您必须点击 `Snort Interfaces` 选项卡右侧的 `edit(e)` 按钮来编辑特定接口。接下来，点击
    `LAN Categories` 选项卡并仅选择所示规则。


    ![](img/00260.jpg)

    ![](img/00149.jpg)

    ![](img/00155.jpg)

    ![](img/00365.jpg)


