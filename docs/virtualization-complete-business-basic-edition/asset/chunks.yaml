  raw: "It doesn't seem too long ago that being an IT Administrator could be hugely\
    \ stressful.  So much so, that I can remember times when I questioned whether\
    \ or not to remain in the field!  I can honestly say that virtualization has changed\
    \ things for the better!  The ease of management and maintenance that it provides\
    \ has brought back that flame that inspired me so many years ago.  I don't think\
    \ there's a day that passes where I am not awe-inspired with how well this system\
    \ works!  It's like the terminator!  Please keep in mind, that none of this would\
    \ be possible if it were not for the hard work and dedication of the open source\
    \ development community!  So, please!  Support the community where you can!\n\n\
    In closing, I would like to thank all those who have purchased and read this book.\
    \  Many thousands of hours went into production testing and research before I\
    \ felt confident that this system was the system!  I hope that it has been instrumental\
    \ in building your personal or business based infrastructure.  Once you are bitten\
    \ by the virtualization bug it's seemingly impossible to turn back!  For this\
    \ reason I will continue with future projects focused on an even more complete\
    \ business solution.  Of notable mention, would be my plans to incorporate PBX,\
    \ multi-domain email, and multi-domain webhosting servers into this already robust\
    \ system.  So, thanks again and stay tuned for more upcoming Virtualization Complete\
    \ releases such as BUSINESS PLUS, BUSINESS PRO, BUSINESS ADVANCED, and perhaps\
    \ ENTERPRISE!\n\n.5-Additional Resources\n\n[www.proxmox.com](http://www.proxmox.com/):\
