    一旦 `snort` 运行，您将开始如列表所示看到告警。您可以通过点击 `SID` 列中的`plus(+)` 按钮将低风险告警添加到抑制列表如下所示。


    ![](img/00288.jpg)


    ### 2.10.7-从源头阻止攻击者


    在您已经监控了正常网络流量并建立了抑制列表后，现在是让 `Snort` 工作了。您现在可以返回 `Snort Interface` 设置并启用从源头阻止攻击者。


