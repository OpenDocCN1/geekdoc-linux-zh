- fmt: "\nOver the years `Snort IDS` running on `pfSense` has caught numerous offenders\
    \ and killed the connections immediately. Whenever I install new software it's\
    \ packet sniffed with `Wireshark` before ever going into production! Furthermore,\
    \ network monitors such as `Nagios Core` provide a wealth of information to keep\
    \ IT Administrators informed. With proper firewall rules and Layer-2 hardware\
    \ filtering it is EXTREMELY unlikely that you will be hacked!\n\n**NOTE**: `pfSense`\
    \ is a powerful platform and it's feature-set cannot be completely covered in\
    \ this book. This guide was designed as a step-by-step to get you up and running\
    \ quickly. I highly recommend tapping the wealth of online resources available\
    \ for a more thorough understanding.\n\nOk! Enough said! Before installation can\
    \ begin you must create the VM configuration. I recommend a `8Gb` `IDE` virtual\
    \ disk with `4Gb` of `Ram` for this install. If you need to review those steps\
    \ again click here: [1.9-Creating VM Configuration](#index_split_015.html_filepos77013)\
    \ \n\n## 2.2-Installing pfSense\n\nNow, power on the `pfSense` VM making sure\
    \ that you have the CD or disk image loaded.\n\nYou should see the following screens:\n\
    \n![](images/00359.jpg) \n\nNow, when you see the prompt(shown below) press the\
    \ `(I)` key. If you don't catch it in time just reset the VM.\n\n![](images/00013.jpg)\
    \ \n\nNext you will see the configuration console(pictured below). Use your arrow\
    \ down to `Accept These Settings` followed by the `Enter` key.\n\n![](images/00300.jpg)\
    \ \n\nNow, choose the `Quick/Easy Install` (pictured below)\n\n![](images/00065.jpg)\
    \ \n\nHit `OK` (pictured below)\n\n![](images/00270.jpg) \n\nYou will want to\
    \ select the `Standard Kernel` (pictured below) for our install.\n\n![](images/00010.jpg)\
    \ \n\nNext, select `Reboot` (pictured below).\n\n![](images/00016.jpg) \n\nWhen\
    \ the system reboots you will notice the `DEFAULT` credentials are:\n\nUsername:\
    \ `admin`\n\nPassword: `pfsense`\n\n![](images/00265.jpg) \n\n## 2.3-Assigning\
    \ Network Interfaces\n\nNext, you will setup the network! Since `pfSense` is a\
    \ BSD based distribution your network interfaces are named differently. If you\
    \ have used `e1000` Gigabit they will show up as `em(x)`. If you have used `Realtek`\
    \ adapters they will be named `re(x)`. Please pay close attention now! This is\
    \ the only tricky part to the install!\n\nNotice in the picture below that `em1`\
    \ has been assigned an IP Address and is defaulted to the `LAN` interface. This\
    \ is NOT correct! The ONLY possible way a DHCP address could have been assigned\
    \ is if the `em1` interface (pictured below) was actually connected to the Internet\
    \ Router. We need to flip these interfaces around so the `LAN` becomes `em0`.\n\
    \n**NOTE**: I find it easiest to ALWAYS set the `LAN` to the first interface which\
    \ is ALWAYS going to be `em0` or `re0`.\n\nTo assign `em0` to the `LAN` select\
    \ option 1 then press `ENTER` \n\n![](images/00326.jpg) \n\nYou will see the following\
    \ prompt(pictured below). Type `n` for `NO` then press `ENTER`. We do NOT want\
    \ `VLAN`. Also notice the interface mac addresses. These should match those in\
    \ your Proxmox vm configuration.\n\n![](images/00367.jpg) \n\nNext, you will be\
    \ prompted for the `WAN` interface name. Type `em1` then press `ENTER`.\n\n![](images/00171.jpg)\
    \ \n\n`pfSense` will now ask for the `LAN` interface name(pictured below). Type\
    \ `em0` then press `ENTER`.\n\n![](images/00245.jpg) \n\nSince we will NOT setup\
    \ an optional interface(`(opt1)`) right now simply press the `ENTER` key which\
    \ indicates `NO SELECTION` (pictured below).\n\n![](images/00223.jpg) \n\nYour\
    \ interfaces will now be assigned(shown below). Type `y` then press `ENTER`. \n\
    \n![](images/00225.jpg) \n\n## 2.3-Assigning IP Addresses\n\nNow you will need\
    \ to set the IP address of the `LAN` adapter This will be the address the web\
    \ interface runs on. It will also serve as the default gateway and DNS server\
    \ on your local network. **NOTE**: I prefer to set this address as the last in\
    \ the subnet(`x.x.x.254`).\n\nTo proceed: select option 2 then press `ENTER` \n\
    \n![](images/00117.jpg) \n\nNext, type the number of the interface you wish to\
    \ configure. In our case we want the `LAN` adapter which is number 2 in the list(pictured\
    \ below).\n\nTo proceed: Type `2` then press `ENTER` \n\n![](images/00317.jpg)\
    \ \n\nYou will now be prompted for the new `LAN` `IPv4` address. For the purpose\
    \ of the tutorial I have used `192.168.0.254`(pictured below).\n\nTo proceed:\
    \ Type `192.168.0.254` then press `ENTER` \n\n![](images/00144.jpg) \n\nNext,\
    \ you will be prompted for the Subnet mask in CIDR notation. To proceed: Type\
    \ `24` then press `ENTER` \n\n![](images/00317.jpg) -> (Wait, correcting based\
    \ on text flow)\n*Self-correction: The text provided has some fragmented sentences.\
    \ I will follow the sequence provided.*\n\nTo proceed: Type `24` then press `ENTER`\
    \ \n\n![](images/00177.jpg) \n\n## 2.4-Reset Password\n\nAt some point you may\
    \ wish to default the `Admin` credentials. \n\nUsername: `admin`\n\nPassword:\
    \ `pfsense`\n\n![](images/00265.jpg) \n\n## 2.5-Web Configuration\n\nYou are now\
    \ ready to open your browser to the LAN address you just set: `https://192.168.0.254`.\n\
    \n"
