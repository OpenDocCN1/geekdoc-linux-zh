    \ is that raid really doesn't matter. A properly maintained system will always\
    \ be pulled from service before a catastrophic disk failure happens. There are\
    \ ALWAYS warning signs! From an engineering perspective a parity array such as\
    \ `RAID(1, 5, 6, or 10)` introduces extended duty cycles and heat buildup thus\
    \ shortening motor life. A striping array such as `RAID-0` reduces duty cycles\
    \ and heat buildup thus increasing motor life. It also provides increased throughput\
