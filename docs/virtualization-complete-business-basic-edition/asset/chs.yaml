  \n# 第 3 卷：freeNAS\n\n## 3.1-传统存储失效\n\n多年来，我一直依赖传统的存储服务器，通常配置为 `RAID(1, 5, 6, 或 10)`。我首选的文件系统是\
  \ `XFS`，因为它非常前沿且相对没有故障。问题在于，文件服务器即使在没有需求时也会消耗该机器的所有硬件资源。此外，为了维护数据冗余，你还需要多台专用存储的机器。\n\
  \n另一个观察结果是，`RAID` 并不完美！如果你选择了硬件 `RAID` 且控制器坏了，那就祝运你能够及时恢复系统运行吧！如果你选择了软件 `RAID` 且文件系统降级，在重建期间你将遭受巨大的性能损失。\n\
  \n大型阵列可能轻松花费 24 小时才能完成这个过程。在此期间，IT 部门会收到大量关于系统性能低下的电话轰炸！糟糕的是，自动备份开始运行每日增量备份，导致性能急剧下降！一定有更好的方法！\n\
  \n### 什么是良好的存储系统\n\n你如何定义一个良好的存储系统？首先，我问自己什么是**最重要的**？在领域内工作并经历过问题后，这并不容易回答！这里涉及到几个关键元素！\n\
  \n对我来说，它们是：\n\n- 数据存储平台**必须**是多年可靠且兼容的\n- 完整的系统灾难恢复**必须**简单且快速\n- 存储输入/输出**必须**是的\n\
  - 每日终端用户的恢复请求**必须**简单且快速\n- 数据**必须**进行冗余存储\n- 数据损坏**必须**降至最低\n\n如果我不能满足**所有**这些预期，那么存储平台的选择就是错误的！根据这些需求，传统的\
  \ `RAID(1, 5, 6, 或 10)` 存储根本无法工作！这需要解释！\n\n### 负载周期 (Duty Cycles)\n\n当工程师设计电子元件时，他们通常会提供“负载周期额定”（Duty\
  \ Cycle Rating）。这种特殊额定有助于确定组件在热量积累开始不可逆地损坏组件之前可以在负载下运行多久。现在，让我们把这个概念应用于磁盘阵列！\n\n\
  当写入一个校验阵列（如 `RAID(1, 5, 6, 或 10)`）时，它必须不中断地同步数据缓存，否则它**会**降级。如果它降级，它**会**重建！如果它重建，就会引入持续的负载周期和热量积累。这种热量积累会不可逆地损坏组件，导致最终故障。\n\
  \n条带阵列（如 `RAID-0`）永远不会同步或降级。这减少了负载周期和热量积累，从而增加了组件寿命。它还作为额外奖励增加了吞吐量！\n\n### 简单性与冗余\n\
  \n`RAID-0`（条带阵列）完美契合性能需求。它**永远不会**降级！它要么工作，要么失效！那么简单性和冗余性呢？\n\n这里就是魔法所在！我们**仅**使用非校验条带阵列构建系统，然后使用\
  \ `RSync` 在多台 NAS 机器上复制数据。这提供了 `RAID-0` 的性能，同时保持了数据冗余。\n\n这种方法提供的数据输入输出速率优于**任何**\
  \ `RAID-10` 存储。此外，当虚拟化后，所有在线升级的平台兼容性问题消失消失。最重要的是，`Linux LVM` 提供了一种创建 `UUID` 序列化条带卷的简单方法。这意味着弹性的启动并可以轻松地物理迁移到其他机器。\n\
  \n似乎所有要求都满足了，除了终端用户恢复请求和最小化数据损坏。等等，还有带有 `ZFS` 的 freeNAS！\n\n## 3.2-freeNAS & ZFS\n\
  \n随着自愈能力 `ZFS` 文件系统的加入，最后的要求得到了满足。这种用途为此身定制的发行版是 `freeNAS`。按照本书进行设置，与裸机文件服务器相比，你可以获得非常可观的性能。`freeNAS`\
  \ 非常完整，具有活动目录集成、快照备份以及一个超级内置的 `RSync` 脚本，用于跨节点的人工复制。让我们开始安装吧！\n\n注意：`freeNAS` 是一个强大的平台，其功能集无法在书中完全涵盖。本指南旨在作为逐步操作指南，帮助你快速运行。我强烈建议利用丰富的在线资源。\n\
  \n### 3.3-安装 freeNAS\n\n在开始安装之前，你必须创建虚拟机配置。\n\n接下来，开启 `freeNAS` 虚拟机，确保已加载 CD 镜像。注意：`freeNAS`\
  \ 是一个强大的平台，其功能集无法在书中完全涵盖。本指南旨在作为逐步操作指南，帮助你快速运行。我强烈建议利用丰富的在线资源。\n\n### 3.4-为 freeNAS\
  \ 添加透通磁盘\n\n此时 freeNAS 还没有可用于共享的存储驱动器。我们现在要把第 1.12 章中创建的 LVM 条带卷作为透通硬盘添加。你可能想重温该章节！\n\
  \n首先，打开 PuTTY 程序并以 root 身份登录你的 Proxmox 服务器。\n\n为了分配新磁盘，我们将执行如下特殊的 QEMU 命令：\n\n\n\
  \n\n# `qm set 800 -ide1 /dev/freenas4/6tbstore`\n\n在 PuTTY 中输入的命令如下（如下图所示）。\n\n\
  ![](img/00356.jpg)\n\n该命令的结果通过 `freeNAS-4` 硬件窗口中显示的新 `IDE1` 驱动器清晰可见（如下所示）。注意：你需要在新磁盘出现之前刷新标签页。\n\
  \n![](img/00200.jpg)\n\n## 3.5-不备份的存储设置\n\n**重要**：我们**仅**备份 `freeNAS` 主磁盘(`ide0`)，而**不**备份\
  \ `6TB` 存储驱动器。如果发生这种情况，将严重降低你的系统性能！你的备份应该在 `freeNAS` 虚拟机内部使用 `RSync` 进行配置。通过如下所示编辑磁盘属性可以轻松避免这种行为。\n\
  \n![](img/00055.jpg)\n\n注意磁盘属性（如下所示），次要磁盘(`ide1`) 将**不会**被包含在备份中。\n\n![](img/00052.jpg)\n\
  \n现在可以启动 `freeNAS-4` 虚拟机（上图），并将新的 `6TB` 磁盘配置为 `ZFS` 条带。\n\n请记住：需要注意的是，`freeNAS-4`\
  \ 现在通过其硬件直通磁盘与 `Proxmox3` 服务器绑定。除非移除物理磁盘，否则无法将其移动到其他物理机器。\n\n## 3.6-通过控制台启动 freeNAS\n\
  \n现在，通过打开右上角的 `Proxmox` 控制台启动新的 `freeNAS` 虚拟机。当控制台出现时，点击 `Start` 按钮（如下所示）。\n\n![](img/00195.jpg)\n\
  \n启动控制台窗口是为了确保虚拟机正常启动并通过 `DHCP` 分配适当的 IP 地址。注意控制台显示底部我们的网页界面地址为 `http://192.168.0.22`\n\
  \n![](img/00189.jpg)\n\n## 3.7-初始登录\n\n现在你可以打开浏览器并输入 `freeNAS` 虚拟机的地址。我使用并推荐 Mozilla\
  \ Firefox。\n\n你看到的第一个屏幕是 `root` 用户密码更改对话框（如下所示）。设置一个强密码！\n\n![](img/00051.jpg)\n\
  \n一旦设置好密码，你应该就能看到完整的网页管理界面（如下所示）。\n\n![](img/00287.jpg)\n\n## 3.8-freeNAS 导航\n\n\
  导航非常直观！你在主屏幕顶部会找到一系列标签。左侧列中还有一个树状结构（如下所示）。\n\n![](img/00187.jpg)\n\n## 3.9-网络配置\n\
  \n在安装期间，`freeNAS` 默认接受 `DHCP`，主机设置为 `freenas`。当你运行任何类型的服务器时，并不想要 `DHCP`。此外，当你的网络上运行多台\
  \ `freenas` 机器时，它们不能具有相同的名称！让我们现在更改它！\n\n在 `Network` > `Global Configuration` 标签（如下所示）下，你可以更改\
  \ `Hostname`、`Domain`、`Gateway` 和 `Nameserver` 信息。在这种情况下，我将 `Gateway` 和 `Nameserver`\
  \ 设置为运行在 Proxmox 上的 `pfSense` 器的 IP 地址。别忘记保存更改！\n\n![](img/00096.jpg)\n\n现在，点击 `Network\
  \ Summary`（如下所示）标签来验证我们的网络接口名称和地址。这将用于设置静态地址映射。\n\n![](img/00097.jpg)\n\n接下来，点击\
  \ `Interfaces` > `Add Interface`（如下所示）。\n\n![](img/00041.jpg)\n\n当接口对话框出现时（如下所示），输入相应的\
  \ `Interface Name` 和 `IP Address`。`Netmask` 几乎**总是** (`(255.255.255.0)`）。这是家庭或业务预留范围最常用的\
  \ `Netmask`。\n\n![](img/00269.jpg)\n\n完成后，你应该能在 `Interfaces`（如下所示）下看到列出的条目。\n\n\
  ![](img/00292.jpg)\n\n## 3.10-用户与组\n\n### 3.10.1-添加新用户\n\n如果你在本地没有运行域，则需要将用户添加到你的服务器或服务器。在主界面的最右侧，你会找到\
