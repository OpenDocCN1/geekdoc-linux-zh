  \ `yourwebs.us`，我的工作组是 `YOURWEBS`。因为我运行了多个 freeNAS 服务器，所以我使用了诸如 `freeNAS-1`、`freeNAS-2`、`freeNAS-3`\
  \ 等名称。\n\n![](img/00233.jpg)\n\n### 3.15.2-NFS（Linux 共享）服务\n\n接下来，我们来看 `NFS`。该服务是原始的基于\
