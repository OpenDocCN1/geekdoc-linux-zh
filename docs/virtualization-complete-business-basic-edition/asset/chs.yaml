  \n当目标成功添加到系统后，它将如所示。恭喜！\n\n![](img/00218.jpg)\n\n## 3.17-ZFS 快照备份\n\nZFS 文件系统可能最好的功能就是写时复制（copy\
  \ on write）。此功能允许几乎立即从快照存档恢复备份。如果设置和使用得当，你**永远**不需要其他形式的备份软件……永远不需要！！！我强烈建议使用我的最佳实践方法。它涉及运行\
  \ 2、3 或 4 台 freeNAS 服务器，且它们都具有相同的数据集。\n\n任何托管实时数据的数据集将被视为主数据集。每个主数据集都需要手动复制（设置时一次）到所有其他\
  \ freeNAS 节点。\n\n托管实时数据的数据集将配置为托管共享节点的 rsync push 任务。而备份数据的数据集将配置为非托管共享节点的 rsync\
  \ 。你可以在每个节点上设置不同的 ZFS 快照。主数据集可以设置为每小时或每天，而其他可以设置为每周、每月等。现在来设置快照！\n\n要继续：点击 `Add\
  \ Periodic Snapshot`如下所示\n\n![](img/0340.jpg)\n\n在此快照任务中，我选择了 `ds.backups` 数据集。\n\
  \n![](img/0040.jpg)\n\n## 3.18-在 Windows 中恢复快照\n\n作为管理员，经常会有终端用户打电话说他们不小心删除了文件。ZFS\
  \ 快照让运行 7 或更高系统的此类任务变得简单！让我们看看 Windows 7 机器上的快照恢复。\n\n![](img/0321.jpg)\n\n假设用户从映射的\
  \ Z 盘删除了一个文件。要查看可用快照，只需右键点击驱动器并选择 `Properties`（属性）。\n\n![](img/166.jpg)\n\n当对话框出现时，选择\
  \ `Previous Versions`（以前的版本）选项卡。你将获得对快照范围内的任何文件进行“打开”、“复制”或“恢复”的选项。\n\n![](img/283.jpg)\n\
  \n## 3.19-Rsync \n\n如之前所述，Rsync 是一种在 Linux 社区广泛使用的强大备份工具。它是无需围栏设备的廉价高可用性方案！在某些方面它甚至更好！当然，你不会获得毫秒级的故障转移和真正的高可用，但如果需要，你将拥有多个可以快速访问（5-10\
  \ 分钟）的数据副本。这里最大的奖励是价格！一个真正的硬件围栏的高可用存储集群将花费你 20000 到 100000 美元！\n\n为了设置首次运行 Rsync，请确保在每个\
  \ freeNAS 节点上都创建了相同的数据集。\n\n\n\n\n让我们为名为 `netbackups` 的主数据集添加一个 `Rsync` 任务！此数据集包含重要的实时数据，并且在配置为\
  \ (选项-2 针对网络备份存储进行优化 的系统中，Proxmox 存储所有虚拟机镜像备份的这里！\n\n要继续操作：点击 `System`>`Rsync Tasks`>`Add\
  \ Rsync Task`（如下所示）\n\n![](img/00157.jpg)\n\n现在你应该能看到任务对话框。点击 `Browse` 并选择适当的数据集（如下所示）。\n\
  \n![](img/00199.jpg)\n\n注意（下文），我选择了嵌套在 `ds.backups` 下的 `netbackups` 数据集！请**注意**（`NOTE`），当\
  \ `Rsync` 运行时，它将备份整个 `netbackups` 数据集文件夹。在其他节点上设置备份数据集时，记住这一点**非常重要**（`IMPORTANT`）。\n\
  \n> ![](img/00113.jpg)\n\n你需要输入远程主机 IP 地址和远程模块名称。注意，我选择了 `freenas5.netbackups` 作为模块名称（如下所示）。这会将\
  \ `freenas5` 识别为远程节点，并将 `netbackups` 识别为我正在备份的数据集。现在，如果我想同步 `netbackups` 到另一个服务器（`freenas-2`），模块名称将唯一标识每次同步。将\
  \ `rsync` 模式设置为 `module`并将 `Direction` 设置为 `Push`。你可能需要输入一个描述备份频率的说明。\n\n![](img/120.jpg)\n\
  \n接下来，通过调整滑块（图 1-3）选择所需的备份频率。**注意**（`NOTE`）：每 15 分钟一次对于性能可能太频繁了！这只是一个示例！通常对于频繁变化的文件小时一次，对于静态文件使用每天一次。\n\
  \n图 1\n![](img/258.jpg)\n\n图 2\n![](img/332.jpg)\n\n图 3\n![](img/247.jpg)\n\n你也可以选择特定的月份（如下）\n\
  \n![](img/167.jpg)\n\n或者，选择每周的某一天（如下所示）。\n\n![](img/169.jpg)\n\n默认 `User` 设置为 `root`（如下所示）。除非你清楚自己在做什么，否则**不要**（`NOT`）更改此处。\n\
  \n![](img/230.jpg)\n\n我喜欢使用所示的选项。\n\n![](img/142.jpg)\n![](img/050.jpg)\n![](img/131.jpg)\n\
  \n下面的截图显示了 `rsync Tasks` 表的样子。这些任务配置在名为 `freeNAS-1` 的文件服务器上。所有数据集每小时推送到 `freeNAS-2`\
  \ 和 `freeNAS-4` 节点。\n\n![](img/092.jpg)\n\n## 3.19.2-添加 Rsync 模块\n\n让我们另一个 `freeNAS`\
  \ 节点上的备份数据集设置 `rsync Module` 以同步 `netbackups` 数据集！\n\n要继续操作：点击 `Services`>`rsync`（如下所示）\n\
  \n![](img/130.jpg)\n\n现在，点击 `Add Rsync Module`（如下所示）\n\n![](img/136.jpg)\n\n现在你应该看到模块对话框（如下所示）。从之前配置的\
  \ `rsync` 推任务（`freenas5.netbackups`）中输入 `Module name`。你可能希望使用与 `rsync` 推任务相同的 `Comment`。将\
  \ `Access Mode` 设置为 `Read/Write` `User` 设置为 `root`。\n\n**注意**（`NOTICE`）：我在 `Hosts\
  \ allow` 字段中添加主 `freeNAS` 推任务节点的 IP 地址以限制访问。\n\n**最重要的是**（`MOST IMPORTANT`）：`Path`\
  \ 设置为 `/mnt/pool0/ds.backups` 是关键的，而不是 `/mnt/pool0/ds.backups/netbackups`，否则你将得到类似这样的嵌套副本：`netbackups/netbackups`。\n\
  \n![](img/152.jpg)\n\n下面的截图显示了 `rsync Modules` 表。这些模块配置在名为 `freeNAS-4` 的机器上。所有数据集每小时从\
  \ `freeNAS-1` 推送。\n\n![](img/079.jpg)\n\n## 3.19.3-使用 Rsync 的技巧\n\n刚设置任务和模块可能会困惑，请保持耐心并思考你在做什么。\n\
  \n- > > 记住在 `Push mode`（本书中使用）中配置 `rsync` 时，实时数据集将有一个 `Task`，备份数据集将有一个 `Module`。\n\
  - > > 避免每个 `freeNAS` 节点上都有实时数据集。你应该至少有一个不托管实时数据的 `freeNAS` 节点。这通常意味着该机器上没有 `rsync\
  \ Push Tasks`。\n- > > 双检你创建的每个 `Task` 和 `Module`。这有助于防止覆盖重要的实时数据。\n- > > 设置任务和模块时，一次添加几个，以避免尝试同步所有数据时的性能影响。\n\
  - > > 使用良好的命名规范以避免混淆。\n- > > 使用专用网络适配器。\n- > > 使用 `Directory Service` 开关。\n\n##\
  \ 3.20-域成员\n\n域由 `Users`、`Groups` 和 `Network Services` 组成。虽然 `freeNAS` 能够充当 `Domain\
  \ Controller`，但我为了冗余更如此。\n\n让我们将此 `freeNAS` 服务器加入域。要配置域服务，点击 `System`>`General`\
  \ 然后从下拉列表中选择 `NT4`。\n\n![](img/0346.jpg)\n\n接下来，进入 `Services`>`Directory Services`\
  \ 并点击扳手图标\n\n![](img/0128.jpg)\n\n现在你应该看到 `Directory Service` 对话框（如下所示）。输入 `Domain\
  \ Controller` IP 地址而不是主机名。**注意**（`NOTE`）：此地址也应该输入你的 `pfSense DHCP static reservation`。\n\
  \n**注意这里**（`PAY ATTENTION HERE`）：使用 `NT4` 目录，你**不需要**输入 `.com`、`.org`、`.us` 等后缀。此外，你的\
  \ `Workgroup Name` 限制为 5 个字符。我在 `Workgroup Name` 中输入了 `YOURWEBS`，尽管我管理的域名是 `YOURWEBS.US`（如下所示）。\n\
  \n![](img/00007.jpg)\n\n之前我们在新的 `freeNAS` 服务器上设置了 `CIFS`(Windows) 共享。在配置机器加入域身份时，`CIFS`\
  \ 工作组设置应与 `Directory Services` 匹配。\n\n现在通过 `Services`>`CIFS` 并点击扳手图标来双检你的设置。我包含了我的设置供参考（如下所示）。记得保存你的更改！\n\
  \n![](img/294.jpg)\n\n现在你可以通过点击所示开关来启用 `Directory Service`。启用后它应该变为蓝色。\n\n![](img/0285.jpg)\n\
  \n最后一步是重建缓存。进入 `System`>`Settings`>`Advanced`，点击页面底部的 `Rebuild LDAP/AD Cache`如下所示）。**注意**（`NOTE`），有时需要重启服务器使所有更改生效。\n\
  \n![](img/0217.jpg)\n\n### 3.20.1-域权限\n\n由于服务器现在是活跃的域成员，你应该能在数据集的 `Permissions`\
  \ 对话框中看到额外的 `Users` 和 `Groups`。为了演示，我包含了之前创建的 `netbackups` 数据集的 `permissions` 对话框。注意下拉列表底部额外的\
  \ `Users`（如下所示）。\n\n![](img/0215.jpg)\n\n作为一个示例，我更改了 `netbackups` 数据集的者权限（如下所示）。有了这些新权限，只有域管理员才能访问该数据集。\n\
  \n![](img/00331.jpg)\n\n## 3.21-配置备份\n\n\n\n\n除了使用虚拟机镜像备份外，保留一份 `freeNAS` 配置副本也是明智之举。当开发者重写构建方式导致某些软件包在更新时损坏时，配置备份变得尤为重要。在这种情况下，你的虚拟机镜像备份只能让你恢复到之前使用的版本。我在\
  \ `freeNAS` 上**从没有**遇到过这种情况，所以不用太担心！\n\n要访问配置备份页面：点击 System > Settings > General（通用），然后点击\
  \ Save Config（保存配置，如下图所示）。\n\n![](img/00012.jpg)\n\n当下载对话框出现时（如下所示），请将配置文件保存到磁盘。提示：我建议在优\
  \ 盘上保留一份副本！\n\n![](img/00204.jpg)\n\n恢复你的 freeNAS 配置应该是显而易懂的！只需使用 UploadConfig 选项即可。\n\
  \n# 第 4 卷：Zentyal 域控制器\n\n## 4.1 Zentyal 简介\n\nZentyal 起于 2004 年，是一个开源项目。它拥有忠诚的全球社区，并活跃开发中。Zentyal\
  \ Small Business Server CE 实际上是一个完整的业务解决方案。最新版本利用强大的 Samba 包，该包可以有效模拟 Microsoft\
  \ 域控制器。它是一个 CD/DVD ISO 格式的完整独立发行版，这使得安装变得非常简单。这是 Zentyal 作为模块构建块包含在我们系统中的最新版本。在我们的系统中，我们将将其作为活动控制器来使用。你可以从\
  \ Sourceforge 下载旧版本（例如：http://sourceforge.net/projects/zentyalseries/OldVersion/zental-40-am64.iso）。我没有在\
  \ Linux Mint (桌面) 或 Server 上安装过该版本。界面基本保持相同，但发送速度将比在旧版引擎中看到的更快。这种方法是可能的，消除了专业术语。**粗体文本**````examplseuccedesrialzingfinees\
  \ \"xtra#$%^&**()\"``applycations Reflectionshedulaflow\"\"\"`\n\n\n\n\n添加组与添加用户非常相似。在屏幕左侧点击\
  \ `Users and Computers` 列表项。你现在应该能看到 `Users and Computers` 模块屏幕（如下）。注意，在我们的示例中，顶层项目显示\
  \ `YOURWEBS.US` 域以及该域下的所有关联项。要添加新组，请选择 `Groups` 文件夹（如下蓝所示）。此操作将导致页面底部的 `+` 按钮变为绿色（所示）。点击绿色的\
  \ `+` 按钮将打开 `Add Group` 对话框。\n\n![](img/00297.jpg)\n\n当 `Add Group` 对话框出现时，用适当的信息填写表单，然后点击\
  \ `ADD`（所示）。\n\n![](img/00341.jpg)\n\n## 4.8 额外的域控制器\n\n在安装期间，Zentyal 被配置为名为 `ZentyalDC2`\
  \ 的独立服务器。这样做是有意的，为了演示如何将角色从独立服务器更改为额外的域控制器。假设已经有一个名为 `ZentyalDC1` 的 Zentyal 域控制器，它已被配置为\
  \ `yourwebs.us` 域的独立服务器。\n\n要更改 `ZentyalDC2` 的角色：点击 `Domain>Settings`，然后从下拉菜单中选择\
  \ `Additional domain controller`。如下所示输入 `ZentyalDC1.yourwebs.us` 控制器的信息。**重要**：IP\
  \ 地址必须是 `ZentyalDC1` 的地址，而不是作为 `yourwebs.us` DNS 服务器的 `pfSense` 路由器的地址。完成后别忘记保存更改！\n\
  \n![](img/00296.jpg)\n\n## 4.9 关机与重启\n\n如果你需要关机或重启服务器，这很简单！可以在导航树的 `System` 下找到控制选项（所示）。\n\
  \n![](img/00174.jpg)\n\n## 4.10 升级 Zentyal\n\n在主屏幕上，当有可用升级时你会收到提醒（所示）。除非绝对必要，否则我强烈建议不要升级。对于基于\
  \ Linux 的软件，我的倾向是找到可以运行的版本并一直使用它们，直到有更好的解决方案出现。如果没有坏，就不要尝试去修复它！这确实适用！在我们的 Zentyal\
  \ 安装中，它仅被用于在数据库中存储用户。此外，它是虚拟化的，因此只要你希望使用它，它将一直保持兼容性。\n\n![](img/00203.jpg)\n\n##\
  \ 4.11 加入 Zentyal 域\n\n现在 Zentyal 已经配置了域控制，所有网络客户端都应该能够访问它。这里的关键词是“访问”（ACCESS）而不是“加入”（JOIN）！在管理域时，理解这一点非常！常见的误解是认为必须加入域才能拥有权限，事实并非如此。事实上，有时保持在\
  \ `WORKGROUP`（工作组）中同时对域委托的共享具有用户访问权限可能是更好的选择。一个很好的例子：某些软件通常需要管理员权限才能运行。某些非常昂贵的高级\
  \ CAD 软件不仅需要权限而且必须以 `Administrator`（管理员）身份运行！\n\n### 避免 IT 独裁\n\n当你选择将客户端加入域时，它变得具有限制性，并且管理用户偏好变得越来越困难。并不是所有用户都有相同的需求或偏好。这会让\
  \ IT 管理员的角色变得非常有挑战性！他们必须在维护系统安全完整性的同时，不疏远终端用户。使用你的域控制权限进行过度限制可能会创建一个敌对的工作场所，让同事们鄙视\
  \ IT 员工！运行在层 2 硬件过滤网络上的正确实现的 IDS 系统可以粉碎几乎攻击！这允许管理员在放松用户账户设置的同时，仍保持强大的网络安全。\n\n###\
  \ 4.11.1 工作组身份验证\n\n如上所述，有时保持在 `WORKGROUP` 中同时对域进行身份验证是更好的。这是目前最易实现的系统，并为管理员提供了广泛的灵活性。让我们看看它是如何工作的。为了本书的内容，我有一个名为\
  \ `YOURWEBS.US` 的域，我们已经设置 Zentyal 为该域控制器。在 `System Properties>Computer Name` 对话框中（所示），客户端工作站命名为\
  \ `win7pro`，`WORKGROUP` 设置为 `YOURWEBS`。基本上，只需去掉最后的域后缀（`.US`），即可让我们的系统能够浏览由域控制的网络资源。如果你需要更改工作组名称，请点击\
  \ `Change` 按钮（所示）以匹配系统中设置的域名。\n\n![](img/00032.jpg)\n\n点击上述 `Change` 按钮后会出现以下对话框。只需在显示\
  \ `YOURWEBS` 的地方（所示）输入你的新工作组名称，然后点击 `OK`\n\n![](img/00201.jpg)\n\n在第 3.20 章中，我们将\
  \ `freeNAS-4` 文件服务器加入了 `YOURWEBS.US`，因此我们已经能够利用网络共享访问控制。如果你需要查看 `freeNAS` 域权限，请点击此处：3.20-Domain\
  \ Membership\n\n\n\n\n似乎就在不久前，IT 管理员的工作还压力巨大。以至于我至今仍记得那些怀疑自己是否该继续留在这个行业的时刻！我可以实话实说，虚拟化技术让一切变得更好！它带来的便捷管理和维护能力，重新点燃了我多年前初入行时的热情之火。我没有一天不对这套系统的出色运行感到惊叹不已！它简直就像终结者一样强大！\n\
  \n请记住，这一切都离不开开源开发社区的辛勤付出与奉献精神所以请您尽可能支持社区！\n\n最后我想感谢所有购买并阅读本书的朋友们。在确信这套系统就是最佳选择之前,我们投入了数千小时进行生产测试与研究.我希望这本书能对您构建个人或企业基础设施有所助益.一旦被虚拟化的魅力所吸引就几乎无法回头!正因如此我将继续专注于未来项目打造更完善的企业级解决方案特别值得一提的是我计划将\
  \ PBX、多域邮箱以及多域名网站托管服务器集成到这一本就强大的系统中再次感谢各位敬请期待更多即将发布的 Virtualization Complete 系列版本例如`BUSINESS\
  \ PLUS``BUSINESS PRO```BUSINES ADANCED`,甚至可能还有 `ENTERPRISE`!\n\n## .5-其他资源\n\n-\
