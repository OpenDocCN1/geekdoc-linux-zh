  \ 管理界面（如下所示）。你将在这里创建和配置你的虚拟机。\n\n![](img/00114.jpg)\n\n## 1.4-网络适配器\n\n现在你需要配置网络适配器，以便它们可以用于你创建的任何虚拟机（VM）。注意，在默认视图（数据中心视图）中不显示网络选项卡。你必须在节点视图（node\
  \ view）中才能看到网络选项卡。在下所示的情况下，节点名为 `proxmox5`。\n\n点击节点（如下所示）\n\n![](img/00328.jpg)\n\
  \n点击如下所示的 `Network`（网络）选项卡\n\n![](img/00299.jpg)\n\n点击如下所示的 `Create >> Linux Bridge`（创建\
  \ >> Linux 网桥）\n\n![](img/00091.jpg)\n\n你现在将看到 Linux 网桥对话框（如下所示）。为你为每个网络适配器创建一个网桥。你可以看到（在本指南中）我使用了行业标准命名约定填充表格，并保持了\
  \ `eth(x)` 和 `vmbr(x)` 端口之间的 1:1 关系。对于初次用户，我建议遵循这一规则，但你也可以轻松地映射为 `vmbr1 >> eth2`。系统中只有一个默认互联网网关，它在安装期间已预配置并由\
  \ `vmbr0` 使用，因此请将此字段留空。\n\n**注意：** 对于 IP 地址字段，请确保使用系统中不会被使用的子网（例如 `10.10.x.x`）。同时，请确保为你选择的\
  \ IP 地址范围使用适当的子网掩码。如果你不网络地址划分，请 Google CIDR 获取更多信息。网络工程的复杂性超出了本分步指南的范围，但互联网上有很多丰富的知识。\n\
  \n完成后，点击 `Create`（创建）\n\n![](img/00213.jpg)\n\n**注意：** 对你希望在新 Proxmox 服务器上使用的每个适配器重复上述步骤。例如：`vmbr2\
  \ >> eth2 @ 10.10.30.2/255.255.255.0`\n\n更改在系统重启之前不会生效。\n\n使用节点视图右上角的按钮立即重启（你应该已经处于节点视图中了）。\n\
  \n![](img/00301.jpg)\n\n当系统完成重启后，屏幕应该会自动刷新。如果活动列中出现 `yes` 值（如下所示），你就可以验证你的虚拟接口已就绪。再次对你打算使用的网络适配器重复此过程。你可以看到我有\
  \ 3 个物理适配器，但只有 2 个已配置并准备就绪。\n\n![](img/00349.jpg)\n\n## 1.5-添加 LVM 存储\n\n在添加 LVM\
  \ 存储之前，你需要安装 `PuTTY`。PuTTY 是一个很好的开源控制台，允许通过 SSH（安全外）访问其他计算机。你可以在此处下载：[PuTTY 控制台](http://www.chiark.greenend.org.uk/~sgtatham/putty/download.html)\n\
  \n安装完成后，打开它，检查 SSH 连接，输入你的 Proxmox 服务器的 IP 地址，然后点击 `Open`。\n\n![](img/00102.jpg)\n\
  \n针对如下所示的 PuTTY 安全警报点击 `Yes`\n\n![](img/00002.jpg)\n\n使用用户 `root` 和你在安装 Proxmox\
  \ 时设置的密码登录\n\n现在输入以下命令：\n\n```\ncat /proc/partitions\n```\n\n![](img/00077.jpg)\n\
  \n此命令将生成如下所示的硬盘设备列表。我们对一个看起来尚未投入的新设备感兴趣。如下所示，唯一可能的设备是 `/dev/sdb`，因为它完全没有分区。现在我们有足够的信息用该磁盘设置逻辑设备了。\n\
  \n![](img/00137.jpg)\n\n现在你已经知道要使用哪块磁盘，可以使用以下命令创建物理卷（PV）：\n\n```bash\npvcreate /dev/sdb\n\
  ```\n\n![](img/00209.jpg)\n\n你现在将看到物理卷确认\n\n![](img/00335.jpg)\n\n现在你已经知道要使用哪块磁盘，可以使用以下命令创建卷组（VG）：\n\
  \n```bash\nvgcreate lvstorage /dev/sdb\n```\n\n![](img/0036.jpg)\n\n你现在将看到卷组确认\n\
  \n![](img/00199.jpg)\n\n完成后，你可以关闭 PuTTY 程序。\n\nProxmox VE 是社区版，但你可以选择一个订阅账户以获得全方位支持。这并非必须的，但每次登录时你都会看到订阅提醒（如下所示）。我觉得\
  \ Proxmox 是一款非常优秀的软件，真的并不介意看到弹出提醒！毕竟！它是免费的！\n\n![](img/00327.jpg)\n\n你现在将看到 Web\
  \ 管理界面（如下所示）。你将在这里创建和配置你的虚拟机。\n\n![](img/00114.jpg)\n\n## 1.6-配置 LVM 存储\n\n现在你已经通过命令行添加了卷组，是时候配置它在\
  \ Proxmox 中如何使用了。这里需要注意的一点是（在本指南中）通过 Web 界面使用的 LVM 存储将用于虚拟机镜像。\n\n开始之前，请确保在数据中心视图，然后点击\
  \ `Storage`（存储）选项卡（如下所示）。接着点击 `Add >> LVM`（如下所示）。\n\n![](img/0068.jpg)\n\n你现在应该看到\
  \ LVM 对话框（如下所示）。现在可以选择你使用 PuTTY 创建的 `lvstorage` 卷组。为 `ID` 字段输入一个唯一的名称（如下所示）。\n\n\
  完成后：点击 `Add`（添加）。\n\n![](img/0125.jpg)\n\n你现在应该在树形视图中看到新的 LVM 存储（如下所示）。点击 `summary`\
  \ 选项卡显示你新存储的可用大小（如下所示）。\n\n![](img/0330.jpg)\n\n## 1.7-配置 NFS 存储\n\nNFS 可能是你使用的所有存储类型中最多的一种。它是一种基于网络的存储，因此你需要在本地子网中配置\
  \ NAS 才能使用它。在 Proxmox 中，NFS 可镜像、备份、模板、ISO 和容器存储。多年来，我广泛测试了 Proxmox 中所有类型的存储。如之前提到的，我本地镜像存储的首选是基于\
  \ LVM 的！嗯，我对网络后端存储的偏好是 NFS！它提供了可媲拟 iSCSI 的性能，但没有任何复杂性。\n\n\n\n\n在本节中，我将演示如何配置现有的\
  \ NFS 共享，以用于虚拟机（VM）备份归档。在生产环境中，你可能（至少）还需要另外一个用于存储 CD/DVD ISO 文件的共享。备份和 ISO 文件是我最常需要的！\n\
  \n开始之前，请确保你处于数据中心（Datacenter）视图，然后点击 `Storage` 选项卡（如下所示）。\n\n接下来，点击 `Add` >> `NFS`（如下所示）。\n\
  \n![](img/00207.jpg) \n\n现在你应该能看到 `NFS` 对话框（如下所示）。输入你的 NAS 存储的 IP 地址。为 `ID` 字段输入一个唯一名称（如下所示）。从下拉列表中选择合适的\
  \ `NFS Export`。你还可以选择每个虚拟机允许的备份存档数量。\n\n完成后：点击 `Add`。\n\n> **NOTE**：通常情况下，我会选择一个指示存储类型的名称，例如\
  \ `NFS_NetBackups`。\n\n![](img/00216.jpg) \n\n你现在应该能在树形视图中看到新的 `NFS` 存储（如下所示）。\n\
  \n![](img/00307.jpg) \n\n## 1.8-配置 iSCSI 存储\n\n本书将介绍的 Proxmox 第三个也是最后一个存储选项是 `iSCSI`。这种存储类型通常由拥有数百台服务器的大型企业使用，其中网络速度是限制因素，且会有周期性的性能波动。由于它是网络后端存储，与专用硬件安装相比，虚拟机性能会受到影响。因此，我不建议将其用于任何关键的生产应用。\n\
  \n尽管它具有网络带来的限制，但它非常灵活，当与高质量硬件配合时，可以产生非常合理的性能。`iSCSI` 的优势在于需要频繁分配临时存储空间的大型测试环境。它可以欺骗操作系统使其认为拥有额外的本地磁盘，因此可能性是无限的。例如：它可以轻松地配置一个基于\
  \ `LVM` 的镜像阵列，映射到特定目录，然后挂载并用于虚拟机镜像、容器、模板等。要学习如何在 freeNAS 中设置 `iSCSI targets`，请点击此处：3.16.3-iSCSI\
  \ Target Shares \n\n要映射 `iSCSI target`，请确保你位于 `Datacenter` >> `Storage` 中，然后点击 `Add`\
  \ >> `iSCSI`（如下所示）。\n\n![](img/00122.jpg) \n\n你将看到下面的对话框。输入 `ID` 和 `Portal` 信息，然后从下拉列表中选择\
  \ `Target`（如下所示）。如果你不想将目标配置为用于挂载的 `LVM disk`，请确保勾选 `Use LUN's directly` 选项。\n\n\
  ![](img/00124.jpg) \n\n继续：点击 `Add` 按钮（如下所示）。\n\n![](img/00103.jpg) \n\n当目标成功添加后，它将作为一个新的存储设备出现（如下所示）。\n\
  \n![](img/00254.jpg) \n\n你现在应该可以通过节点树中选择它来查看内容信息（如下所示）。\n\n![](img/00106.jpg) \n\
  \n## 1.9-创建虚拟机配置\n\n现在你已经配置好了 Proxmox，可以创建你的第一个虚拟机（VM）了！让我们设置一个 `pfSense` 路由器配置吧！\n\
  \n开始：点击右上角的 `Create VM`。\n\n![](img/00020.jpg) \n\n现在为你的新虚拟机分配 `ID` 和 `Name`。\n\n\
  继续：点击 `Next` \n\n![](img/00264.jpg) \n\n接下来，选择 `OS type`。`pfSense` 是基于 BSD 的，所以选择\
  \ `(other)`。\n\n继续：点击 `Next` \n\n![](img/00255.jpg) \n\n下一步假设你已经设置了 `ISO storage`\
  \ 并且正在使用最新版本的 `pfSense-LiveCD`。在本指南中，我使用的是 `2.2.4 Release` 版本。如果你没有任何 `ISO storage`，可以从节点树视图中点击\
  \ `local`，然后上传你的 CD/DVD 镜像。或者，你可以将 ISO 刻录到磁盘，然后选择 `Use physical CD/DVD Drive`（如下所示）。\n\
  \n继续：点击 `Next` \n\n![](img/00151.jpg) \n\n接下来，将配置硬盘参数。对于此 `pfSense` 安装，请使用 `IDE\
  \ device type` 并配合 `8GB disk`。你可以选择 `local` 或你在本指南中之前配置的 `lvstorage`。\n\n> **NOTE**：经过广泛测试，我首选的磁盘配置始终是使用\
  \ `IDE Bus`、`Raw disk Format` 和 `Default Cache` 设置。\n\n完成后：点击 `Next` \n\n![](img/00241.jpg)\
  \ \n\n现在选择用于处理的 `CPU cores` 数量。不要设置超过你可用的核心数，否则你的虚拟机将无法启动！对于 `CPU type`，我推荐 `KVM`。在某些情况下，你的虚拟机可能会无法启动。如果是那样，请选择\
  \ `QEMU`。\n\n**SPECIAL CASE**：基于 BSD 的 `pfSense` 是那些**必须**选择 `QEMU` CPU 类型的情况之一。\n\
  \n> **NOTE**：如果你的虚拟机无法启动，通常可以追溯到不正确的 `CPU type`。此外，你通常会选择 `64 bit`，除非你有 `64 bit`。\n\
  \n\n\n\n注意：由于 WAN 端口对 Mac 地址有特殊匹配要求，你无法将这些适配器与其他虚拟机（VM）共享。解决方案是计划使用哪些 Proxmox 服务器来运行路由器实例，然后仅为这些机器添加额外的网络适配器。为了能够轻松移动你的互联网网关，这点小小的代价是完全值得的。\n\
  \n你还可能使用一个小型的 5 口交换机来实现路由网关的离线迁移。只需选择另一个你想用于 `pfSense` 冷备份（关机状态）的 Proxmox 服务器，在该机器上重复地址匹配程序，并与你运行中的\
  \ `pfSense` 以及你的入站互联网连接一起插入 5 口交换机中即可。\n\n总结一下：你的入站互联网连接插入到 5 口交换机，每个 `pfSense`\
  \ 虚拟机的 WAN 端口也连接到该交换机。更多信息请参阅 `(Option-3) 简单的离线路由器迁移`。\n\n### DMZ 和 WAN2\n我不建议在完成初始\
  \ `pfSense` 安装之前安装这些额外的适配器。如果你遵循这本完整指南，那么 DMZ 至少还需要另外一个虚拟适配器。当那个时候来临时，只需返回本节并重复添加新网络适配器的过程即可。\n\
  \n现在你的配置已经完成，你需要知道如何启动它。只需在节点树中选择该虚拟机，并点击右上角的启动按钮即可。或者，如果你正在安装操作系统，你可能希望选择控制台以便响应提示。只需点击控制台中的启动选项（如下所示）。一旦你的虚拟机启动，它看起来就像任何其他操作系统启动一样。如要遵循\
  \ `pfSense` 的安装步骤，请点击此处：`第 2 卷：pfSense` \n\n![](img/00348.jpg)\n\n### 1.10-虚拟机备份与恢复\n\
  请利用早早在 `.3-最佳实践` 中提到的以下信息。\n\n### 简化的灾难恢复\n如果你的任何 Proxmox 服务器发生故障，最要恢复的项**永远**是你的虚拟机镜像备份。将它们视为“主恢复镜像”！没有了这些，你就迷失了，因此尽可能拥有多个副本至关重要！\n\
  \n我首选的方法是选择一个 NAS（虚拟化或独立）作为我的主要虚拟机镜像备份服务器。该服务器将为 Proxmox 托管 `NFS` 镜像备份共享。此共享手动复制（仅在设置期间进行一次）到系统中的所有其他\
  \ NAS 服务器，并使用 `Rsync` 按计划同步。\n\n如果某台机器故障，我可以更换它，重新安装 Proxmox，重新安装任何 NAS 硬盘，重新映射我的\
  \ `NFS` 备份并恢复虚拟机镜像。再次，你将在 15 分钟或更短时间内恢复运行！这种方法非常好，而且经过了时间的考验，非常可靠！\n\n注意：有一个限制！如果提供虚拟机镜像备份的\
  \ NAS 是虚拟化的（例如 `(Option-3) 简单的离线路由器迁移`），它将无法备份自己的虚拟机镜像！简单的解决方法是在另一个空闲的 freeNAS 节点上创建一个名为\
  \ `netbackups2` 的另一个 `NFS` 共享。再次，我们将使用 `Rsync` 自动将此数据集同步到所有 freeNAS 节点。请参阅 `.3.7-系统图`\
  \ 以深入了解系统架构和流程。\n\n在 U 盘上保留副本：另一个强烈建议的提示是将你的虚拟机镜像备份拷贝到 U 盘或 DVD 上，然后存储在防火箱箱中。你可以轻松地将虚拟机镜像备份映射为只读的\
  \ `samba` 共享，以便从任何 Windows 机器或安卓手机访问。使用 `.3-最佳实践` 中描述的小空间占用方法，可以确保你的整个虚拟机镜像备份存档都能轻松放入现代的\
  \ 64-128GB U 盘中。\n\n### 如何备份你的虚拟机\nProxmox 为你提供了一个方便的备份界面。只需从节点树视图中选择你想备份的虚拟机，然后点击“备份”选项卡。在最右侧选择你的备份位置，然后点击“立即备份”按钮（如下所示）。\n\
  \n![](img/00295.jpg)\n\n随后你将看到备份对话框（如下所示）。选择你的选项然后点击“备份”。\n\n![](img/00220.jpg)\n\
  \n进度对话框将出现，显示任务的当前状态（如下所示）。就是这样！\n\n![](img/00049.jpg)\n\n注意：镜像备份**永远**是不够的。你仍然想要从虚拟机内部执行传统的备份。重要：我强烈建议你**不要**尝试备份远大于\
  \ 80GB 或使用设备直通（在...中解释）的虚拟机镜像磁盘。\n\n例如：`第 3 卷：freeNAS` 中涵盖的 freeNAS 虚拟机构建。\n\n###\
  \ 恢复你的虚拟机\n在节点树中选择你的备份以恢复。在本示例中，我选择了 `NFS`。（images/0271.jpg）一旦选择，你应该能看到存档列表。选择你想恢复的存档。（images/0229.jpg）完成后，点击“恢复”按钮。（images/0284.jpg）一旦进程开始，你将看到任务查看器，可以在那里查看状态。（images/0099.jpg)\n\
  \n### 1.11-虚拟机硬件\n### 网络适配器\n在某些时刻，你可能想要添加或编辑你的硬件。Proxmox 提供了广泛的选项，包括添加、编辑和删除磁盘以及网络适配器。它还允许对磁盘进行移动、限流和调整大小。你之前已经为\
  \ `pfSense` 添加了网络适配器，所以硬件选项卡并不陌生。\n\n要添加新桥，点击“添加 >> 网络”（images/0062.jpg）。在本示例中我选择了\
  \ `vmbr1`，但可以很容易更改。（images/0031.jpg）现在你将在列表中看到新添加的适配器。\n\nMAC 地址注意：你看到的硬件地址是一个别名，而不是真实的硬件地址！（images/0250.jpg）只需点击硬件选项卡下的编辑按钮，即可更改所选适配器的\
  \ Mac 地址、模型或桥。下面的图 1-3 显示了编辑对话框。\n\n### 硬盘\n添加硬盘同样简单。让我们为 Zentyal 域控制器创建一个新的 32Gb\
  \ IDE 硬盘。（images/0022.jpg）点击添加 >> 硬盘（images/0033.jpg）。你将看到“添加：硬盘”对话框。注意默认总线是 `VIRTIO`。`VIRTIO`\
  \ 是一种高性能驱动，但可能与你的安装不兼容。对于兼容性最好、最简单的总线，我建议使用 `IDE`。注意默认格式是 `Qcow2`。我**始终**使用 `Raw`\
  \ 格式！它是性能最高且兼容性最好的格式。此外，保持缓存默认以防止数据丢失！\n\n\n\n\n一旦添加，你的新磁盘将显示为红色，直到虚拟机重启（如下所示）。\n\
  \n> ![](img/00261.jpg)\n\n## 1.12-添加直通磁盘 (Pass-Through Disks)\n\n正如 .3-最佳实践 节中所提到的，我使用的是混合服务器。本质上，你正在创建一个带有内置\
  \ NAS 服务器的 Proxmox 虚拟化主机。你像安装其他虚拟机一样安装 NAS，其操作系统位于虚拟磁盘上。然而，实际的存储驱动器将位于通过名为“硬件直通”（hardware\
  \ pass-through）的技术分配的物理 LVM 存储上。\n\n这种方法使得备份占用非常小，因为你只备份了 NAS 操作系统**而不是**数据。它还能为数据读写循环提供中较好的磁盘吞吐量。我使用千兆网适配器测试过持续吞吐量在\
  \ 30-60 Megabytes/sec 之间。对适配器进行绑定（Bonding）可以获得更好的性能，但我喜欢保持简单！\n\n最大的优势是你的数据**不是**存储在虚拟磁盘文件中！即使你销了虚拟机，数据也是安全的！\n\
  \n现在你已经有了了，，让我们为新安装的 freeNAS 添加一个 6TB 的条带卷。如你所见，freeNAS 安装只有一个 8GB 的 IDE 磁盘，操作系统就位于其中（如下所示）。\n\
  \n![](img/00108.jpg)\n\n打开 PuTTY 并以 root 身份登录你的 Proxmox 服务器。然后我们需要使用以下命令找到我们的磁盘（如下所示）：\n\
  \n```bash\ncat /proc/partitions\n```\n\n![](img/00109.jpg)\n\n如你所示，最大的磁盘（上图）是 `/dev/sdb`\
  \ 和 `/dev/sdc`。\n\n此外注意还有 `/dev/sdb1` 和 `/dev/sdc1`。这表示每个磁盘上存在一个单分区。分区的大小表明可用空间并未被使用。我们需要改变这一点！要编辑\
  \ `/dev/sdb`，输入以下命令：\n\n```bash\nfdisk /dev/sdb\n```\n\n你现在会看到类似的内容（如下所示）：\n\n![](img/00158.jpg)\n\
  \n现在按：`m` >> `Enter`\n\n你将看到帮助屏幕（如下所示）。我们感兴趣的是创建一个空的 DOS 分区表。\n\n![](img/00219.jpg)\n\
  \n现在按：`o` >> `Enter` \n\n接着按：`w` >> `Enter`\n\n这一系列命令将创建一个新的空 DOS 分区表并将更改写入磁盘。\n\
  \n接下来，我们需要对 `/dev/sdc` 重复这些步骤。**不要**担心缺少分区！这种方法的精妙之处在于 LVM 并不不在乎！\n\n让我们使用以下命令再次验证磁盘以确保分区已删除：\n\
  \n```bash\ncat /proc/partitions\n```\n\n![](img/00240.jpg)\n\n如你所见（上方），`/dev/sdb`\
  \ 和 `/dev/sdc` 现在可以完全使用。\n\n我们现在将使用以下命令创建 LVM 物理卷（PV）：\n\n```bash\npvcreate /dev/sdb\n\
  pvcreate /dev/sdc\n```\n\n或者\n\n```bash\npvcreate /dev/sd[b,c]\n```\n\n![](img/00226.jpg)\n\
  \n上面的输出显示创建成功。\n\n接下来，我们将使用以下命令创建一个包含两个磁盘的卷组（VG）：\n\n```bash\nvgcreate freenas4\
  \ /dev/sd[b,c]\n```\n\n![](img/00360.jpg)\n\n上面的输出显示我们的 VG 创建成功。\n\n最后一步，我们将使用所有可用空间创建一个条带逻辑卷（LV）。LVM\
  \ 条带化等同于 RAID-0，可获得最大的磁盘吞吐量。\n\n输入以下命令创建条带：\n\n```bash\nlvcreate -l 100%FREE -i2\
  \ -n 6tbstore freenas4\n```\n\n其中：`i2`条带成员数量），`n`(名称）\n\n![](img/00089.jpg)\n\n\
  上面的输出显示我们的 LV 条带创建成功。\n\n正如我之前提到的，Linux LVM 非常强大且灵活。我强烈建议好好学习它。下面是另外 3 个非常有用的 LVM\
  \ 命令：\n\n```bash\npvscan\n```\n\n此命令列出所有已知的物理卷（如下所示）。\n\n![](img/00087.jpg)\n\n\
  ```bash\nvgscan\n```\n\n此命令列出所有已知的卷组（如下所示）。\n\n![](img/00073.jpg)\n\n```bash\nlvscan\n\
  ```\n\n此命令列出所有已知的逻辑卷（如下所示）。\n\n![](img/00224.jpg)\n\n你可以看到上方新创建的 6TB 条带卷。现在我们准备好将此卷分配给\
  \ freeNAS-4 虚拟机了。你会发现 freeNAS-4 的 ID 号是 800，且 IDE1 或 IDE3 是可用的（如下所示）。\n\n![](img/00108.jpg)\n\
  \n要分配新磁盘，我们将发布如下特殊的 QEMU 命令：\n\n```bash\nqm set 800 -ide1 /dev/freenas4/6tbstore\n\
  ```\n\n在 PuTTY 中输入的命令看起来如下（如下所示）。\n\n![](img/00132.jpg)\n\n上面的输出显示我们的 LV 条带创建成功。（等等，抱歉，原文逻辑在此处有跳跃，剩余部分我将严格遵循提供的文本进行）。\n\
  \n*自我纠正：重新处理提示中提供的剩余文本块。*\n\n正如我之前提到的，Linux LVM 极其强大且灵活。我强烈建议好好学习它。下面是另外 3 个非常有用的\
  \ LVM 命令：\n\n```bash\npvscan\n```\n\n此命令列出所有已知的物理卷（如下所示）。\n\n![](img/00087.jpg)\n\
  \n```bash\nvgscan\n```\n\n此命令列出所有已知的卷组（如下所示）。\n\n![](img/00073.jpg)\n\n```bash\n\
  lvscan\n```\n\n此命令列出所有已知的逻辑卷（如下所示）。\n\n![](img/00224.jpg)\n\n你可以看到上方新创建的 6TB 条带卷。现在我们准备好将此卷分配给\
  \ freeNAS-4 虚拟机了。你会发现 freeNAS-4 的 ID 号是 800，且 IDE1 或 IDE3 是可用的（如下所示）。\n\n![](img/00108.jpg)\n\
  \n要分配新磁盘，我们将发布如下特殊的 QEMU 命令：\n\n```bash\nqm set 800 -ide1 /dev/freenas4/6tbstore\n\
  ```\n\n在 PuTTY 中输入的命令看起来如下（如下所示）。\n\n![](img/00132.jpg) （等等，提供的文本在此处结束，但下面还有一个块。我现在将处理最后一个块。）\n\
  \n\n\n多年来，运行在 `pfSense` 上的 `Snort IDS` 捕到了许多违规者并立即切断了连接。每当我安装新软件时，在投入生产之前都会使用 `Wireshark`\
  \ 对其进行包嗅探！此外，像 `Nagios Core` 等网络监控工具提供了丰富的信息，让 IT 管理员掌握动态。通过正确的防火墙规则和二层硬件过滤，你被黑客攻击的概率极低！\n\
  \n**注意**：`pfSense` 是一个强大的平台，其功能集在本书中无法完全涵盖。本指南旨在作为一个分步教程，帮助你快速上手。我强烈建议利用丰富的在线资源，以获得更深入的理解。\n\
  \n好了！话不多说！在安装之前，你必须创建虚拟机配置。我建议为此安装使用 `8Gb` 的 `IDE` 虚拟磁盘和 `4Gb` 的 `Ram`。如果你需要再次查看这些步骤，请点击此处：1.9-Creating\
  \ VM Configuration \n\n## 2.2-安装 pfSense\n\n现在，启动 `pfSense` 虚拟机，确保你已经加载了光盘或磁盘镜像。\n\
  \n你应该能看到以下屏幕：\n\n![](img/00359.jpg) \n\n现在，当你看到提示（如下所示）时，按下 `(I)` 键。如果你没有及时捕捉，只需重置虚拟机。\n\
  \n![](img/00013.jpg) \n\n接下来，你将看到配置控制台（所示）。使用下方向键选择 `Accept These Settings`，然后按\
  \ `Enter` 键。\n\n![](img/00300.jpg) \n\n现在，选择 `Quick/Easy Install`（所示）\n\n![](img/00065.jpg)\
  \ \n\n点击 `OK`（所示）\n\n![](img/00270.jpg) \n\n你可能想要为我们的安装选择 `Standard Kernel`（所示）。\n\
  \n![](img/00010.jpg) \n\n接下来，选择 `Reboot`（所示）。\n\n![](img/00016.jpg) \n\n当系统重启时，你会注意到\
  \ `DEFAULT` 凭据如下：\n\n用户名：`admin`\n\n密码：`pfsense`\n\n![](img/00265.jpg) \n\n## 2.3-分配网络接口\n\
  \n接下来，你将设置网络！由于 `pfSense` 是基于 BSD 的发行版，你的网络接口命名方式不同。如果你使用了 `e1000` 千兆网，它们将显示为 `em(x)`。如果你使用了\
  \ `Realtek` 适配器，它们将被命名为 `re(x)`。请务必注意！这是安装过程中唯一棘手的部分！\n\n注意下面的图片，`em1` 被分配了 IP 地址并默认设置为\
  \ `LAN` 接口。这是**不正确**的！DHCP 地址的唯一可能分配方式是 `em1` 接口（所示）实际上连接到了互联网路由器。我们需要交换这些接口，让 `LAN`\
  \ 变成 `em0`。\n\n**注意**：我发现始终将 `LAN` 设置为第一个接口是最简单的，而第一个接口总是是 `em0` 或 `re0`。\n\n要将\
  \ `em0` 分配给 `LAN`，选择选项 1 然后按 `ENTER` \n\n![](img/00326.jpg) \n\n你将看到以下提示（所示）。输入\
  \ `n` 表示 `NO`，然后按 `ENTER`。我们不需要 `VLAN`。还要注意接口的 MAC 地址。这些地址应该与你 Proxmox 虚拟机配置中的匹配。\n\
  \n![](img/00367.jpg) \n\n接下来，系统将提示输入 `WAN` 接口名称。输入 `em1` 然后按 `ENTER`。\n\n![](img/00171.jpg)\
  \ \n\n`pfSense` 现在会询问 `LAN` 接口名称（所示）。输入 `em0` 然后按 `ENTER`。\n\n![](img/00245.jpg)\
  \ \n\n由于我们现在不会设置可选接口（`(opt1)`），直接按 `ENTER` 键即可，这表示 `NO SELECTION`（所示）。\n\n![](img/00223.jpg)\
  \ \n\n你的接口现在将被分配（所示）。输入 `y` 然后按 `ENTER`。 \n\n![](img/00225.jpg) \n\n## 2.3-分配 IP\
  \ 地址\n\n现在你需要设置 `LAN` 适配器的 IP 地址。这将是 Web 运行的地址。它也将作为你本地网络上的默认网关和 DNS 服务器。**注意**：我倾向于将此地址设置为子网中的最后一个（`x.x.x.254`）。\n\
  \n要继续：选择选项 2 然后按 `ENTER` \n\n![](img/00117.jpg) \n\n接下来，输入你想要配置的接口编号。在我们案例中，我们需要\
  \ `LAN` 适配器，它是列表中的第 2 个（所示）。\n\n要继续：输入 `2` 然后按 `ENTER` \n\n![](img/00317.jpg) \n\
  \n现在你将收到提示输入新的 `LAN` `IPv4` 地址。为了教程演示，我使用了 `192.168.0.254`（所示）。\n\n要继续：输入 `192.168.0.254`\
  \ 然后按 `ENTER` \n\n![](img/00144.jpg) \n\n\n\n\n由于我们已经配置了 LAN 接口，这一步是多余的。这些值（如下所示）应与您在安装控制台阶段输入的值匹配。\n\
  \n要继续：点击 `Next`\n\n![](img/00170.jpg)\n\n接下来您将把默认 Admin 密码（如下所示）更改为更安全的密码（请务必这样做）。\n\
  \n要继续：点击 `Next`\n\n![](img/00090.jpg)\n\n现在，pfSense 将重新加载配置更改（如下所示）。\n\n要继续：点击 `Reload`\n\
  \n![](img/00086.jpg)\n\n恭喜！您已完成初始设置。\n\n要继续：点击此处所示的链接\n\n![](img/00185.jpg)\n\n\
  ## 2.6-更改主题\n\n默认主题和仪表板看起来类似于下面的图片。请注意所有内容都是左对齐的。我倾向于将其更改为居中对齐，以便于导航和手机兼容。\n\n![](img/00116.jpg)\n\
  \n让我们通过选择所示所示 `System>General Setup` 将默认主题更改为 `NERVCENTER`。\n\n![](img/00008.jpg)\n\
  \n现在滚动到底部并从下拉列表中选择 `NERVCENTER` 主题（如下所示）。别忘记保存更改！\n\n![](img/00323.jpg)\n\n您的新 `NERVCENTER`\
  \ 主题看起来应该是这样（如下所示）。\n\n![](img/00115.jpg)\n\n## 2.7-配置 DHCP 服务器\n\n下一步是在 LAN 上启用\
  \ DHCP 服务器。这将为任何连接到本地的机器分配 IP 地址。\n\n要继续：点击如下所示的 `Services>DHCP Server`。\n\n![](img/00025.jpg)\n\
  \n您应该看到下面的窗口（如下所示）。勾选框：`Enable DHCP server on LAN interface`\n\n![](img/00315.jpg)\n\
  \n一旦勾选了服务框，您将需要设置一个范围（如下所示）。我倾向于使用一个范围（`x.x.x.100-x.x.x.200`）。这允许在范围前后进行静态保留地址分配，非常非常用。还要注意如下所示的\
  \ Deny unknown clients 关。我倾向于在所有条目添加到系统之前保持未勾选状态。一旦一切通过验证并运行，您就可以勾选此框并保存更改。这将防止未经授权的硬件在您的系统中获取地址（非常有用且强烈推荐）。\n\
  \n![](img/00347.jpg)\n\n### 2.7.1-WINS, DNS, 网关和域\n\n当客户端连接到 DHCP 服务器时，它将接收来自以下目的的所有信息。在本例中，我们将安装\
  \ Zentyal 作为 `YOURWEBS.US` 域的目录服务器。下面的 WINS 服务器地址分别是 `ZentyalDC1` 和 `ZentyalDC2`\
  \ 的地址。DNS 和网关条目是 pfSense LAN 接口 IP。\n\n![](img/00290.jpg)\n\n下面的图片显示另一个安全开关，我倾向于在验证一切正常之前保持关闭。通过启用\
  \ Static ARP Entries，pfSense 将防止任何未列出的硬件与 LAN 适配器通信。这是另一个帮助保持网络安全的强大工具（强烈推荐）！\n\n\
  ![](img/00190.jpg)\n\n### 2.7.2-DHCP 客户端预留\n\n如果您滚动到页面底部，将看到静态映射表。下面的图片是预填充的，以便让您了解在输入几个条目后表格的样式。我强烈建议在此输入网络中的**每一个**硬件地址并附带完整描述（如下所示）。如果您希望启用静态\
  \ ARP 条目（如上所示），这是必要的；但如果您需要快速查找网络上任何机器的 IP 地址，这也会非常方便。\n\n要添加条目：点击右侧的 `+` 按钮（如下所示）。\n\
  \n![](img/00344.jpg)\n\n接下来您应该看到 DHCP 条目表单（如下所示）。我包含了一个示例条目作为参考（如下所示）。输入条目后，务必保存您的更改。注意：真的不需要在这里创建\
  \ WINS、DNS、网关或任何其他条目。默认情况下，pfSense 接口 IP 将自动控制所有客户端。\n\n![](img/00194.jpg)\n\n##\
  \ 2.8-防火墙设置\n\n您需要做的最后件事是设置几个防火墙规则。我们将允许 LAN 客户端之间的所有流量，并允许所有 LAN 客户端访问 WAN。首先我们添加\
  \ LAN 到 LAN 的规则。\n\n要继续：点击如下所示的 `Firewall>Rules`\n\n![](img/00143.jpg)\n\n### 2.8.1-LAN\
  \ 规则\n\n您应该看到带有网络接口名称的标签页。我的某些标签（如下所示）名称不同。我只是地重命名了它们！例如：我将 `LAN` 重命名为 `JAB`。我们要关心的接口只有\
  \ `LAN` 和 `WAN`。\n\n添加 LAN 到 LAN 规则：点击右侧的 `+` 按钮（如下所示）。\n\n![](img/00246.jpg)\n\n\
  下面的图片显示了完成的 LAN 到 LAN 规则。复制此规则。\n\n![](img/0035.jpg)\n\n### 2.8.2-WAN 规则\n\n我们将设置一个允许\
  \ WAN 所有出站流量的规则。在此服务器上，我将 `WAN` 重命名为 `JAB`。\n\n添加 WAN 到 ANY 规则：点击右侧的 `+` 按钮（如下所示）。\n\
  \n![](img/00329.jpg)\n\n下面的图片显示了完成的 WAN 到 ANY 规则。复制此规则。\n\n![](img/0042.jpg)\n\n\
  ## 2.9-OpenVPN\n\nVPN 是一种隧道协议，允许安全地访问您的系统。一旦连接到 VPN，客户端就像在现场一样工作。为了让 VPN 工作，您必须拥有静态\
