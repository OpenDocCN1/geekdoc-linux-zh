  \n![](img/00268.jpg)\n\n## 2.10-Snort IDS\n\n任何现代业务网络的关键组件都是入侵检测或 `IDS`。在涉及到 `IDS`\
  \ 时，`Snort` 是今天最流行的程序包！`IDS` 的概念是监控传输协议以发现异常行为，并在检测到此类行为时切断连接。这正是`反病毒软件`和`恶意软件`供应商发现新威胁并创建更新以应对这些威胁的方法。\n\
  \n大多数 `IDS` 系统默认监控外部连接。我的建议是监控您的内部连接。这种方法可以捕获通过智能手机和 USB 闪盘等便携设备引入的恶意代码。\n\n注意：对于不熟悉\
  \ `Snort` 的人来说，它的设置可能相当复杂。由于许多配置选项，这将是一个快速浏览的过程，因此请务必完全复制我的设置！让我们现在让 `Snort` 运行起来！\n\
