  \n![](img/00033.jpg)\n\n## 3.14-ZFS 权限\n\n通常，当你创建一个数据集时，需要为用户设置适当的权限。出于本例的目的，我们将设置公共权限，即完全开放的权限。不过不必担心，你也可以在\
