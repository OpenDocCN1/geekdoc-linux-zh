  md: '# Chapter 4. Sound card in home projects


    Using the above basic circuit you can drive several channels simultaneously. In
    this case you should introduce several modules; each with a LM567C chip, Each
    of them will control its own load. The inner oscillator of each module has to
    be configured for operating with its own unique frequency by selecting the appropriate
    values of your R1–C5 pairs (see Fig.4.5). The functional diagram of such a multichannel
    control system is shown in Fig.4.7:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_165_0.png)


    Fig.4.7


    In this circuit the sound card produces various frequencies which are delivered
    through a buffer to the n inputs of n tone-decoder modules. Each of those n modules
    is configured to sense a particular frequency f, ... fs. A sound card in this
    configuration must generate a pure sinusoidal signal while frequency may be one
    of f, ... fn. For reliable functioning the pass-bands of the tone-decoders must
    not overlap – in this case the low-level active signal appears only on one output
    at a time for each predetermined input frequency. As a sound card is capable of
    generating signals in the range of 20 – 20000 Hz, you can thus use multiple modules
    for driving multiple loads.


    The audio signal generated by a sound card may be easily converted into a DC voltage.
    We can build circuits where this voltage will change linearly when the input frequency
    varies over some range. Generating a DC voltage controlled by the frequency may
    be of use when designing robotic systems, for testing various circuits and motor
    handling. To achieve a high precision using a frequency–to voltage (F-to-V) converter
    with high linearity. One low-cost and effective solution is based on the popular
    chip LM131/231/331. This part may implement both V–to–F and F–to–V conversion
    providing high linearity of about 0.01%. The schematic circuit of such a F-to-V
    converter is shown in Fig.4.8:'
  merge: -1
  pgno: 165
- img_proc: true
  md: '![](img/c0e2a8f44eadc53b4372ff3151186ecc_166_0.png)


    Fig.4.8


    This circuit functions quite well up to a frequency of 3 KHz. The frequency range
    is determined by the Rt– Ct pair; for other ranges you recalculate values of Rt
    and Ct using the function in Fig.4.8.


    The C3 and Rt pair represents the simple low-pass filter suppressing the noise
    riding on a useful signal V_OUT at the output of the LM231 (pin 1). The input
    frequency fs should be the square wave, so you must precisely convert the sound
    card’s output signal into square pulses. A higher precision output voltage V_OUT
    may be reached when applying an active low-pass filter instead of the C3–RL pair.
    You may also use F–to–V chips when building similar circuits. For example, it’s
    possible to build the circuit using the low-cost AD537 chip.


    Let''s see how to operate with sound and build embedded projects using MATLAB.
    In many aspects MATLAB simplifies the design of those projects, for it provides
    an easy program interface for writing software.


    # # Processing low-level input signals


    Sometimes you may wish to capture low-level audio signals generated by various
    transducers that measure some physical quantity (light, proximity, vibration,
    etc.). We can certainly pick those signals using a microphone or line input of
    a sound card, provided that we place in an additional gain stage between the output
    of the transducer and the output of the sound card. This allows amplifying of
    the weak signals before they go to an internal preamplifier of a sound card. This
    preamplifier usually has a limited sensitivity (a signal-to-noise ratio, SNR),
    so an additional external amplifier comes in handy. For instance, when dealing
    with a vibration sensor I applied a simple amplifier with a low-cost and widely
    used TL0081 opamp (Fig.4.9):'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Chapter 4. Sound card in home projects


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_167_0.png)


    The opamp is connected as a non-inverting amplifier for AC signals – the R3, R4
    and C2 components form the feedback circuit. The capacitor C2 connected in series
    with R3 exhibits very low impedance for audio signals, so the gain for AC signals
    can be calculated as:


    Gain = 1 + R4/R3


    In our case, the gain is 11V/V, however, you can easily adjust it by changing
    values of R3 and R4. It would be wise to use R3 and R4 in the range several KOhm
    through to tens of KOhm. Remember that low values of resistors result in a greater
    power consumption, while higher resistances increase overall noise of this circuit.


    For DC signals the opamp is connected as a voltage follower. The voltage divider
    (R1-R2) provides a bias to the non-inverting input of A1 to half of the supply
    voltage (2.5V). The signal from the source is fed to the non-inverting input through
    C1; the amplified signal goes to the sound card input via capacitor C4.


    # Processing sound in MATLAB


    Operating with audio signals in MATLAB is extremely simple for it provides an
    excellent programming interface to process audio data. There are lots of functions
    which allow manipulating audio data. They are described in detail in the appropriate
    reference manual. But let''s see some practical examples.


    To read the microphone input and then play this via the line-out output of the
    sound card you may use the following sequence (Listing 4:5):'
