  md: '# Chapter 5. Network and wireless systems for home and laboratory


    Thus, input frequencies ranging from about 900 to 1100Hz will be amplified with
    a gain of 2 while signals beyond the bandpass be lowered (attenuated).


    The second stage that follows is a tone decoder where the popular chip LM567 is
    used. This stage is configured to trigger its output when frequencies around 1000Hz
    arrive at pin 3. As you already know, the LM567 recognizes the signal within the
    configured bandpass resulting in a voltage drop on pin 8. This level is kept low
    until the frequency of the input signal goes outside the given range. Signals
    outside the bandpass draw pin 8 high. The high level on pin 8, in turn, drives
    the power switch (Q1 and Q2) that connects/disconnects the power to the motor
    M. The low level on pin 8 opens Q2 feeding power to the motor M, while the high
    level breaks the power to the motor.


    In the same way we can configure the control circuit to function with signals
    around 2000Hz or another frequency. For each particular frequency we need to recalculate
    appropriate values of time dependent components in both the filter and the tone
    decoder. This circuit is nothing perfect; easily improve as you want.


    That''s all about the receiver part of our control system. Let''s go to the transmitter
    which delivers the control signal from the PC to our receiver. The transmitter
    circuit is extremely simple and includes only a few components. It is designed
    as a Colitts oscillator in a common base configuration relating to RF signals
