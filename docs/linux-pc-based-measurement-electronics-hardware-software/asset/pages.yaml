  md: '# Network and wireless systems for home and laboratory


    By now we know how network applications communicate with each other. The next
    question is how to program a network application to transfer or receive some data.
    To make things clear, it will be useful to see the hierarchy of network applications.
    Every day you are faced with various types of applications.. A widely used web
    browser is an example of such a kind of application As a general rule for programming
    network applications, a special four-layer conceptual model that is known as DARPA
    model was introduced.


    This model maps the TCP/IP protocol suite and includes Application, Transport,
    Internet and Network Interface layers (Fig.5.2):


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_184_0.png)


    Fig.5.2


    This model allows an understanding of how the network applications interact with
    each other. The Network Interface layer (also called Network Access layer) provides
    for sending TCP/IP packets on the network medium and receiving TCP/IP packets
    of the network medium. Note, that the TCP/IP suite was designed to be independent
    of the network access method, frame format, and medium. Therefore, we can use
    TCP/IP to communicate across different network types that use various LAN technologies
    (Ethernet, 802.11 wireless LAN, WAN technologies). Because of its independence
    from any specific network technology TCP/IP can also be easily adapted to new
    technologies.


    The Internet layer is responsible for addressing, packaging, and routing. Among
    others the Internet layer includes the Internet Protocol (IP) that addresses,
    routes, fragments, and resembles packets.


    Next, a Transport layer provides the Application layer with session and datagram
    communication services. The core protocols of the Transport layer are TCP and
    UDP. TCP provides a one-to-one,'
