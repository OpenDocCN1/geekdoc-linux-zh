  md: '# Switching a LED


    Switch on/off of data port latches occurs in the endless while() loop. Each iteration
    begins by reading the byte from the data port latches into the bRead variable
    by calling the in() function. This function takes a single parameter that is the
    address of the hardware port (0x37, in our case). After a byte has been read the
    program reverses all the bits of the bRead variable. The inverted value of bRead
    is then written back to the data port by executing the outb() function which takes
    two parameters. The first parameter contains the value of the byte to be written,
    while the second points to the address of the hardware register, in our case,
    is 0x37. The sleep() function ends the current iteration implementing a 10 s delay
    before the next iteration begins. The compilation of the source code can be accomplished
    by typing the following command in the terminal window:


    ```

    $ gcc -o ioperm_example ioperm_example.c

    ```


    After successful compilation we can execute the application by entering


    ```

    $ sudo ./ioperm_example

    ```


    To break execution of an application we can press Ctrl+C. To test our application
    we can attach a multimeter to the parallel port. One probe of the multimeter should
    be tied to the pin 24 or 25 ("ground") of the parallel interface of the DB–25
    connector, while the other probe touches any of the pins 2–9. While the application
    is running you can observe the voltage swing on the selected pin every 10s. Another
    way to test our application is to assemble a simplest circuit with an LED and
    resistor attached in series to one of the pins 2-9 as shown in Fig.2.2 (here pin
    2 is used):


