  md: '# Chapter 5. Network and wireless systems for home and laboratory


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_259_0.png)


    Fig.5.31. Advanced FM transmitter


    The RF amplifier uses the Q2 transistor that may be the same as that of the RF
    oscillator or you can use almost any RF bipolar transistor instead (I used type
    2SC9018, although BFS17, BFR92, BFR93A will suit). The RF amplifier is connected
    as a common emitter stage and is biased through the R3 resistor; the RF signal
    from the oscillator is fed to the base of Q2 through the capacitor C5. The amplified
    RF signal from the collector of Q2 goes to the antenna. We have no resonant circuits
    here, this stage doesn''t require tuning. The great advantage of this modified
    circuit is that we get a higher stability of the carrier frequency because the
    RF amplifier isolates the oscillator circuit from the antenna. This circuit may
    also operate from 2.7 through 5V, you will need to adjust the resonant circuit
    of the oscillator stage after you have altered the supply voltage to the transmitter.
    Additionally, you can extend the distance of a reliable transmission if you apply
    the longer (30 – 40 cm) antenna.


    # Conclusion


    We have considered designs of distributed systems using the network capabilities
    of the Linux operating system and MATLAB. In many projects we applied a TCP/IP
    protocol stack as a basis for communication between applications. The high reliability
    and versatility of the TCP networking allows us to easily and confidently connect
    various systems and applications. With TCP/IP you can easily convert your local
    system into a distributed system consisting of different subsystems developed
    with different hardware/software tools. Due to its inter-processing capabilities
    the Linux operating system allows building of distributed systems running on the
    same computer – this comes in handy when different parts of systems are written
    in different languages. The same is also true for TCP/IP networked systems that
    may be successfully executed on the same host. The home and laboratory distributed
    systems controlled by Linux may also be built using low-cost wireless devices
    with minimal modifications.


