  md: '# # Single-channel wireless control system


    The FM transmitter/receiver pair may also be used to implement a computerized
    control over some remote device or actuator. In this case we can modify the FM
    transmitter as shown in Fig.5.24:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_252_0.png)


    Fig.5.24


    Here we connect bit 0 of the data port (address 0x378) to the gate of the power
    MOSFET IRFZ24 (Q1). Setting/clearing of this bit allows switching on/off of the
    RF transmitter. The program sets bit 0, the switch Q1 is turned on feeding the
    transmitter. The FM receiver then picks up the signal that may be used to trigger
    some load. Thus we get the simplest one-channel control system. On the receiver
    side the FM signal may trigger, for example, a D-type flip-flop that, in turn,
    may switch on/off some power switch where a bipolar transistor or power MOSFET
    might be used. To control the load we apply the circuit shown in Fig.5.22. In
    this case the signal on the collector of Q1 can drive, for example, a Darlington
    transistor or a power MOSFET.

    The source code of the program which produces pulses that periodically turn on/off
    the FM transmitter- is shown in Listing 5.23:


