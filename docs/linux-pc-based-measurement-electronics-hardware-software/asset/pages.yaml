  md: '# Software development


    Before a call of the inp() or out() function wherever inside the program, one
    of the ioperm() or iopl() functions must be executed. Both these functions tell
    the kernel to allow the user''s application to access the I/O ports – this gives
    port permissions to non-privileged tasks. Failure to do this will cause the application
    to receive a "Segmentation fault" error. As we will use these functions frequently,
    let''s look at them in detail.


    First of all, the program where ioperm() and/or iopl() functions are called requires
    root privileges when started. In order to provide root privileges for a given
    application we need to type a sudo command the name of the program to be executed.
    For example, if we try to execute the application named myprogram we have to type:


    ```

    $ sudo ./myprogram

    ```


    Some systems restrict you from using the sudo command in some way, in which case
    use a su instead of sudo to become a superuser (root) and launch the program.
    Another way to execute the program that talks to hardware is to login as root,
    but in this case you should be very careful while working in the operating system
    with such privileges!

    You should also remember that both functions work only with the x86 architecture;
    other architectures don''t support these given functions – they do not exist or
    will always return an error.

    The ioperm() function has the following synopsis:


    ```

    int ioperm(unsigned long from, unsigned long num, int turn_on);

    ```


    As you can see, the function takes 3 parameters. The from parameter points to
    the starting address which is affected by the turn_on parameter. The num parameter
    holds the number of bytes which will be affected starting from the port address
    from. Setting turn_on into "1" allows read/write operations, clearing this parameter
    forbids access to the given ports. Using the ioperm() function requires unist.h
    (for libc5) or sys/io.h (for glibc) header files to be inserted at the beginning
    of a source code. If you are not certain about which file you can use simply include
    both in the source code.

    ioperm() function affects only the 0x3ff I/O ports – this is enough to get to
    the standard parallel port with addresses from 0x378. But if we have some expansion
    board with a built-in parallel interface, the hardware addresses of this parallel
    port may be outside of the range of 0x3ff. In this case we need to call the iopl()
    function that allows you to access the full I/O space which spans 65536 hardware
    ports. Permissions the ioperm() function grants are not inherited for a new process
    created by a fork() function, although this happens when an exec() function is
    called.

    iopl() function allows you to change I/O privilege level for a given process and
    has the following synopsis:


    ```

    #include <sys/io.h>

    int iopl(int level);

    ```'
