  md: '# Chapter 1. PC in home projects


    as it might seem because of performance and compatibility problems. Another frustration
    when us-ing modules is that some features, as accessing bits in hardware registers
    (a common task when dealing with hardware) or even reading some registers are
    poorly supported – that induces a developer to write a complex and, sometimes
    ugly code for low-level processing.


    As a result, the performance of low-level I/O operations with hardware degrades
    causing a loss of data accuracy, especially when you write a control code for
    time-dependent processes such as an analog-to-digital or a digital-to-analog conversion.


    In these cases C code comes handy. You may put any low-level code written in C
    into a shared library, where functions may be easily called from Java, Python,
    etc by using standard methods-defined in these languages. This approach works
    forever and everywhere regardless of Linux distributions and Python/Java/PHP/etc.
    Using “pure” C for implementing low-level I/O operations over hardware has a lot
    of time and effort. From this point of view I have implemented the C source code
    so that it be possible to easily build a shared library, if required. Of course,
    the C source code may be compiled as a console application as well.


    Another approach which we will discuss in Chapter 5 is based on using ‘sockets’.
    We can write, for example, two standalone applications in different languages,
    C and Python, which can interact with each other using sockets. We can write in
    C a simple daemon that will acquire data from some sensor and pass this data through
    a local or TCP socket to another application written in Python. In this case we
    don''t need to adapt the Python application for implementing operations with hardware
    – all that we do is to provide code for reading data through the socket dedicated
    for both applications.

    Naturally, this approach requires knowledge of network programming in C and Python.
    The same is true for Java or PHP.


    The asterisk (*) denotes the size of data processed by the out* and in* functions.


    The embedded projects we choose to consider herein require accessing of PC peripherals
    via hardware registers (ports), so we need to apply some library functions to
    accomplish this task. These functions are specific and exist only in Linux systems
    developed for the x86 platform. We can use abbreviations in* and out* when describing
    these functions. The out* functions perform output from the port, while the in*
    functions perform the input from the port. Alternatively, it''s said that out*
    functions write data to the port and inp* functions read data from the port.


    The asterisk (*) denotes the size of data processed by the out* and in* functions.
    For example, the b-suffix functions (in(), out()) are byte-width and the w-suffix
    functions (inw(), out()) are word-width. As to our projects, we deal with a single
    byte, so we apply inb() and outb() functions. The above functions were primarily
    designed for kernel use, but can be used from a user application. This may require
    -O or -02 options to be included for compiling source code, although the later
    versions of the gcc compiler (included in Ubuntu, Knoppix and other modern versions)
    allow excluding these options.


