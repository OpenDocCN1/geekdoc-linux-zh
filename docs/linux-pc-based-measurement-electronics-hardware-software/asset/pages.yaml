  md: '# Parallel port hardware


    Before using a parallel interface we know its representation in the Linux operating
    system. To identify the parallel interface(s) in Linux we must type the dmesg
    command in the terminal window. Below you can see the output that the above command
    produced on my PC:


    ```

    $ dmesg | grep purport

    [ 12.099395] purport_pc 00:08: reported by Plug and Play ACPI

    [ 12.099456] purport0:PC-style at 0378, irq 7 [PCSPP,TRISTATE]

    [ 12.330428] purport_serial 0000:01:05.0: PCI INT A -> GSI 21

    (level, low) -> IRQ 21

    [ 12.330481] purport1:PC-style at 09800 [PCSPP,TRISTATE, EPP]

    [ 13.089058] lp0: using purport0 (interrupt-driven).

    [ 13.090917] lp1: using purport1 (polling).

    ```


    In the Linux operating system, parallel interfaces are denoted as purportX where
    X = 0, 1, ... From the above listing you can can see that the system recognized
    two parallel ports which are purport0 and purport1. The purport0 interface is
    usually assigned a base address 0378 (hexadecimal) is the address of the data
    port. Next address is "base address + 1" to the status port (0379); base address
    + 2 is 037A is assigned to the control port. In all embedded projects we will
    apply 0378 and, if needed, 0379 addresses are the most common values for desktop
    PCs.


    The second parallel port is denoted as purport1 resides on the PCI expansion board
    and has the base address 09800 by the PnP subsystem. Both parallel interfaces
    can control via separate lines denoted as "irq" (irq 7 is assigned to purport0
    and irq 21 for purport1). We don''t use interrupts in our projects for this requiring
    a device driver that is beyond the scope of this book.


    Sometimes you could encounter the parallel interface with a base address 0278
    instead of 0378. We use 0378 and 0379 addresses in our projects, you should change
    these addresses on proper everywhere in the source codes. If, for instance, I
    wanted to use the expansion board with the base address 09800, I would change
    0378-0379 to 09800-09801.


    The data port may be read to/from the status register and the control register
    may be read from/written to. The standard parallel port works with TTL-compatible
    levels of signals, therefore we can build circuits using ordinary analog and digital
    chips that need a single +5V power supply. The current, the interface can sink
    and source, may differ from port to port. Usually, a value of current may be 10-12
    mA, so external circuitry should be attached to the parallel port via buffers.


    We can read an external digital signal through status port and output a digital
    signal through data port. Although we can read the data port, we haven''t got
    the benefit of this because the byte read represents a state of output latches
    of the data port, not the true input signal.


    Let''s see how one can operate the parallel interface under Linux by examining
    a simple project with the LED attached to some bit of the data port. This project
    demonstrates a common programming technique we use when dealing with the parallel
    interface.


