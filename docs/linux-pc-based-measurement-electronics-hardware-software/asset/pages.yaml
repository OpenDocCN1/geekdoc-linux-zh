  md: '# Chapter 2. Parallel port in the home design


    A parallel port is very convenient for building various embedded systems to be
    controlled from a PC. In this chapter we will discuss how to operate the parallel
    port''s hardware and design some embedded projects which may be useful at home
    or in a laboratory. We will discuss the electronics we need and software that
    controls our circuits, but first we should recall how the standard parallel port
    hardware functions.


    # Parallel port hardware


    When you begin to plan your projects you usually have two alternatives: use a
    standard parallel port of the desktop PC located on the motherboard or apply a
    parallel interface built-in. Nowadays some desktop PCs and most laptops/ netbooks
    are not equipped with a parallel interface, so you would need to obtain one of
    the numerous low-cost expansion boards for your embedded projects. All projects
    discussed in this chapter were designed using the PC''s parallel interface, but
    they are valid for any external parallel interface. The only thing you should
    know to do when using an external parallel interface is to alter the hardware
    addresses in the source code of the control programs.


    From a developer''s point of view, a parallel port offers 8 lines to output (write)
    data to external circuits and 5 input lines to read data from external devices.
    Control programs may interact with a parallel port via three hardware registers
    (called "ports") that accept reading and writing operations. External circuitry
    which we will design is attached to the parallel port via a DB-25 standard connector
    on the back panel of the PC or via the same connector on an expansion board.


    The parallel port hardware provides 4 control lines, 5 status lines and 8 data
    lines. All signal lines can be accessed via three hardware registers called "data
    register", "status register" and "control register". These registers are frequently
    referred to as "data port", "status port" and "control port", respectively. Fig.2.1
    shows the physical layout of the bits of the hardware port and their respective
    DB-25 pins:'
