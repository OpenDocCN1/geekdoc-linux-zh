    be as shown in Fig.4.11:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_173_0.png)


    Fig.4.11


    In the second example our sound card generates the signal that resembles a square
    wave by applying a Fourier series method. Any periodic function can be expressed
    as a series involving sines and cosines, known as a Fourier series. The square
    wave signal may be represented as a sum of various weighted odd harmonics of the
    sine function. By using this approach we can represent, for example, the square
    wave as shown below:


    Square wave = 4/π * [ (sin(x)/1 + sin(3x)/3 + sin(5x)/5 + sin(7x)/7 + ...]


    From a practical point of view we can take the first four terms from the above
    expression to design an approximate square wave. Below you can see a full listing
    of the program in Matlab (Listing 4.10):'
