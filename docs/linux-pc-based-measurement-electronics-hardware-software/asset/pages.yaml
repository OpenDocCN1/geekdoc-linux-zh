    Let''s discuss this source code. Here we use a timer event to implement our task.
    As Linux (and UNIX) systems allow us to raise events caused by the timers we can
    apply this for our needs. Use an interval timer in Linux we have several methods
    at our disposal. One of them that provides a good timing is based using the setitimer()
    function. In general, configuring the timer involves the following steps described
    later.


    First, we need to configure the appropriate structures and set parameters for
    our timer. In our case we define structure sa of the sigaction type and timer
    of the itimerval type:


    ```

    struct sigaction sa;

    struct itimerval timer;

    ```


    Then we determine the signal to be processed and point out the function which
    is called after a timer event has occurred. Two following statements do to that:


    ```

    sa.sa_handler = &timer_handler;

    saction(SIGALRM, &sa, NULL);

    ```


    In case a timer handler will toggle the output latches of the data port each 5
    milliseconds. The timing intervals expressed in microseconds (us) must be set
    for the timer structure:


    ```

    timer.it_value.tv_sec = 0;

    timer.it_value.tv_use = 5000; // 5 ms interval before alarm

    timer.it_interval.tv_sec = 0;

    timer.it_interval.tv_use = 5000;

    ```


    Here tv_use is set to 5ms (500µs). The last thing we must do is to actually start
    the timer by executing the following statement:


    ```

    setitimer(ITIMER_REAL, &timer, NULL);

    ```


    The first parameter of the setitimer() function takes the ITIMER_REAL constant
    which means that the timer will work with real time intervals between events.
    The second parameter of this function points to the timer structure. After the
    timer starts the program enters an endless while() loop.

