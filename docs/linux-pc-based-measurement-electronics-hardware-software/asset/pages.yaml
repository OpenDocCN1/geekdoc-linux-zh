  md: 'Press the ‘Enter’ key and look what happens. If a PIR-sensor has been activated,
    the text “Alarm!” appears in the terminal window where a cat ... command is running.
    You may put the cat ... command into a background by adding ''&’ at the end command.
    In this case you must remember the process identifier (PID) of the given process,
    so that you can terminate the background process when needed.


    Entering the following command will output it''s PID onto the screen:


    ```

    $ cat < /dev/ttyS0&

    [3] 2563

    ```


    As you can see, the PID is equal to 2563, so you can terminate the process having
    this PID by using the following command:


    ```

    $ sudo kill 2563

    [3] Terminated cat < /dev/ttyS0

    ```


    Besides putting the cat... command into a background, you may also schedule checking
    of the PIR-detector by periodically polling its state. This requires development
    of a simple BASH-script, which will execute the echo ... command after some predefined
    interval expires. Below you can find the source code of such a demo script where
    we check the state of this security system every 5 seconds:


    ```

    #!/bin/bash

    while

    true

    do

    echo ALARM! > /dev/ttyS0

    sleep 5

    done

    ```


    Here the “ALARM!” string is sent every 5 seconds to the /dev/ttyS0 device inside
    the endless loop. Reception of this string must be checked using the cat < /dev/ttyS0&
    command, running in a background. You must save this source code in a file and
    make this file executable. For example, after we have saved the source in the
    file name as program we need to set an appropriate permission using chmod +x command:


    ```

    $ chmod +x program

    ```'
