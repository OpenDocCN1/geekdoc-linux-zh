- img_proc: true
  md: '# Listing 4.5


    ```

    >> ro = audiorecorder(11025, 16, 1);

    >> record(ro, 5);

    >> pause(ro);

    >> p = play(ro);

    ```


    Let''s examine this code. First we create an audio recorder object through which
    we can operate with audio data. The statement is


    ```

    >> ro = audiorecorder(11025, 16, 1);

    ```


    creates the audiorecorder object ro using the sampling rate 11025 Hz, the sample
    size 16 bits, and the number of channels equal to 1 (mono mode). The audiorecorder
    function could be invoked without parameters as shown below:


    ```

    ro = audiorecorder;

    ```


    When the audiorecorder function is called without parameters it is assumed that
    this function takes default arguments: sampling rate 8000 Hz, sample size 8 bit,
    and 1-channel for sound processing. The default parameters are useful when operating
    with most sound cards, because this configuration is supported by just about all
    devices.


    As the sampling rates, they can take the following values: 8000, 11025, 22050,
    and 44100. The sample size must be 8 or 16 if we deal with Linux OS and the number
    of channels can be 1 for mono mode or 2 for stereo mode. The MATLAB documentation
    hints that the current implementation of audiorecorder is not intended for long,
    high-sample-rate recording because it uses system memory for storage and does
    not use disk buffer. When large records are recorded, MATLAB performance may degrade.
    There are various methods (mainly described at MATLAB forums) for improving performance,
    so I encourage you to investigate those approaches


    Let''s back to our code. After the audiorecorder object ro has been created we
    can recording sound during the next 5 seconds from the microphone/line input (you
    should set the input source before using). The following statement does this:


    ```

    >> record(ro, 5);

    ```


    After pausing we play back the sound just recorded by invoking a play function:


    ```

    >> p = play(ro);

    ```'
