  md: '# Chapter 4. Sound card in home projects


    Another approach to generate signals is to create a basic signal, usually sinusoid,
    programmatically and then apply some additional circuitry to convert the basic
    signal, say into a square wave, sawtooth or other waveform. The benefit of this
    method is that we can gain several signals at a time – the basic signal on the
    Line Out output and additional waveforms somewhere in external circuitry.


    Let''s see how to manipulate audio signals in both OSS and ALSA systems.


    # Programming sound with OSS


    Before attempting to program a sound device using OSS revisit /dev/dsp in detail.
    The /dev/dsp device appears in Linux as the digital sampling and digital recording
    device. This device is responsible for implementing multimedia applications. Specifically,
    when the program writes to that device it causes the digital-to-analog converter
    (DAC) to produce sound. Again, reading the device activates the analog-to-digital
    converter (ADC) that starts recording and analysis of the result. The name DSP
    stands for "Digital Signal Processor" which is a specialized chip optimized for
    digital signal processing and analysis; modern sound cards have a built-in DSP
    chip dedicated to sound processing. Some sounds cards may provide more than one
    digital sampling device. For example, a second device will be available as /dev/dsp1.
    Unless stated otherwise, this device operates in the same manner as /dev/dsp.


    In fact, the DSP device really includes two devices, the DAC and ADC. Opening
    for read-only access allows you to use the analog-to-digital converter for sound
    input. Opening for write only will access the D/A converter for sound output.Generally
    speaking, the program should open the device either for read or for write. It
    is possible to perform both read and write operations on the device at a time,
    although with some restrictions. Note that only one process can access the device
    at a time; another attempt to reopen it will fail with an error code EBUSY.


    Reading from the DSP device returns digital samples obtained from the A/D converter.
    Analog data is converted into digital samples by the digital converter under control
    of the kernel sound driver and stored in a buffer internal to the kernel. When
    an application program invokes the read() call, the data is transferred to the
    calling program''s data buffer. It is important to understand that the sampling
    rate is dependent on the kernel driver, and not the speed at which the application
    program reads. When from /dev/dsp you will not encounter an end-of-file (EOF)
    condition. If data is read too slowly, less than the sampling rate, excess data
    will be discarded resulting in gaps in the digitized sound. If you read the device
    too quickly, the kernel sound driver will block your process until the required
    amount of data is available.


    The input source which is used for audio data reading depends on the mixer – the
    default is the microphone input. The format of the digitized data depends on what
    parameters were taken by the ioctl() call when configuring an audio device. Each
    time the device is opened, its parameters


    144'
