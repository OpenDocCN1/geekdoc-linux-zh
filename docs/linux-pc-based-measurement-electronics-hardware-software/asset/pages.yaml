  md: '# Chapter 5. Network and wireless systems for home and laboratory


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_247_0.png)


    Fig.5.20


    Note that the distance of a reliable communication between the transmitter and
    receiver depends on both the power of the signal emitted by the transmitter and
    the sensitivity of the receiver. With this particular system the distance may
    vary from both 30 to 50 m. If you are experienced in RF systems, you may increase
    the distance by introducing an RF power amplifier driven from the RF oscillator
    stage of the transmitter. Another way to extend the range of action of the transmitter
    is to apply an external antenna (piece of wire) about 10–15 cm long. The antenna
    is added to the point where the LC tank of the RF oscillator is connected to the
    collector of the transistor. To lessen the loading influence of the antenna on
    the stability of the carrier frequency it would be worth connecting the antenna
    to the LC tank by a capacitor of 10–20 pF. Of these two options, use of an RF
    amplifier would be the technically preferred solution isolation of the RF oscillator
    from incoming interference and increasing power of the output RF signal. You may
    combine both approaches to obtain an even better performance. Anyway, I encourage
    you to explore the numerous technical sources concerning design of RF.


    After the signal has been captured it will be converted to a TTL-compatible voltage
    level passing to an input of the PC''s parallel interface. Once a voltage drop
    detected (the PIR-sensor has fired) the control program outputs an appropriate
    message on screen. This is in general how the wireless security system function.


    To build our system, therefore, the following components were created:


    +   PIR-detector (PIR-sensor). A Passive Infrared Sensor is an advanced version
    of a motion sensor. PIR sensors ''know'' how to identify people using infrared
    radiation that people emit, which stems from body heat. PIR sensor is completely
    passive and reacts only to drastic changes in levels of infrared radiation emitted
    in the surveillance area, caused by the movement of a person in a room. This prevents
    false alarms when the floor gets cold at, for instance. These sensors are so designed
    that they don''t react to pets moving around their surveillance area. This part
    may usually be purchased from some of the larger electronic shops through the
    Internet. When seeking out a PIR-sensor select a fully assembled module that includes
    the PIR sensor itself, conditioning circuit and Fresnel lens to provide the greatest
    distance of the protected area. Usually such a


