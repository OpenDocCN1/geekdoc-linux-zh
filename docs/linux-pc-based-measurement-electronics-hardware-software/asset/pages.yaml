    This circuit may be easily modified to handle AC loads (we will discuss this later).
    The circuit shown in Fig.3.6 can be improved to switch on/off the DC load each
    time the next byte is sent via TD. The following circuit (Fig.3.7) illustrates
    this concept:


    Here the bipolar signal in the range of -12V to +12V goes to the base of transistor
    Q1 operating in a switch mode. Q1 forms the unipolar series of pulses with magnitude
    within the range of 0 to about +55V corresponds to TTL logic signals. The TTL
    pulse on the collector of Q1 goes to the input pin 2 of the timer, the LM555 timer
    configured as a monostable multivibrator. Upon the falling edge of the pulse on
    pin 2 of the timer, the LM555 generates a single pulse on output pin 3. The duration
    of this pulse will be about 0.7 × R3 × C1 and should be chosen to exceed the total
    interval taken by UART to transfer a single byte. In this case each byte being
    transmitted via TD will cause a single pulse on the A1 output.'
