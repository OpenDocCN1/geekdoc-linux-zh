  md: '# Chapter 2. Parallel port in the home design


    # Processing analog signals: common technique


    In the previous project we applied the analog-to-digital converter to process
    an analog signal. Such simple digitization system exhibits good results in many
    home embedded projects with a low-level noise. If you apply a low-noise analog
    signal from your sensor and your power source doesn''t generate much noise, it
    is reasonable to connect an analog-to-digital converter''s input directly to the
    signal source. Many practical applications where such conditions are met will
    exhibit good performance and accuracy.


    Unfortunately, in real life any analog signal has some noise wedged, We need to
    get rid of this unwanted component by applying some additional circuitry. From
    the simplest point of view noise may be regarded as a combination of various signals
    originated from various external and internal sources. In designing a noiseless
    circuit is a very complicated task, so we will not discuss this topic here. The
    processing of noise based on using analog conditioning circuits in practice. The
    simplest and effective way to get rid of noise from a signal of interest is based
    on using analog low-pass filters (LPF).


    Often we deal with analog signals which fall into the full-scale range (FSR) of
    the analog-to-digital converter. Sometimes signals are too small so they must
    be amplified before entering the converter''s input. Putting all this together,
    we can figure the general scheme of an analog conditioning chain (Fig.2.9) – as
    you can see, at the first stage the sensor''s signal may be increased by an Amplifier
    block. Using this stage achieves the only goal of increasing-attenuate the magnitude
    of an original signal so that it would match the FSR of the following analog-to-digital
    converter.


    The Amplifier block is usually built on either an operational (''op amp'') or
    instrumentation amplifier, depending on the type of the output signal that the
    particular sensor provides. You can find a lot of information about op amps and
    their use on the Internet. In this book guide we don''t use the Amplifier stage
    in our projects, although you may need to do that in your own projects.


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_37_0.png)


    Fig.2.9


    36'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Processing analog signals: common technique


    An amplified analog signal is fed into an analog low-pass filter (Low-Pass Filter
    in Fig.2.9). The analog low-pass filter removes or at least attenuates out-of-band
    noise riding on the signal. Since all analog signals have some noise, the filter
    stage is almost always required. You can, however, accept some reasonable degree
    of noise in your particular system when it doesn''t affect the results you expect.
    In these cases you can exclude the low-pass filter stage from the signal chain.
    The low-pass filter always precedes the analog-to-digital converter (Analog-to-digital
    converter in Fig.2.9), because the noise must be suppressed before it appears
    at the converter''s input. The signal of interest remains coupled with a noise
    signal, an analog-to-digital converter provides a "dirty" binary code which cannot
    be cleaned evenly with digital filters. After digitization the binary representation
    of an analog signal may be processed in a "digital world" by a microcontroller
    or processor of a PC.


    For analog signals with relatively high voltages you can apply a successive approximation
    register (SAR) analog-to-digital converter having a relatively wide FSR. If the
    sensor yields a low-level output delta analog-to-digital converter a developer
    may either amplify the signal or utilize some kind of a $\Sigma-\Delta$ (sigma-delta)
    analog-to-digital converter that can process 16 to 24-bit resolution. Using $\Sigma-\Delta$
    gives an additional benefit, because some electronic components may be excluded
    from your design. However, you should remember that $\Sigma-\Delta$ converters
    are still slow compared to SAR converters, which provides a lower resolution (typically
    12 bit) compared to $\Sigma-\Delta$, but has a higher conversion speed. All the
    projects described in this book are based on using SAR analog-to-digital converters.
    Both types of converters (SAR and $\Sigma-\Delta$) provide either SPI or I2C interface
    for the interaction with microcontrollers or processors.


    Let''s see in brief how an analog low-pass filter functions. Recall, that a LPF
    weeds out frequency noise coupled with a useful signal. The simplest low-pass
    filter shown in Fig.2.10 is a simple RC pair (resistor and capacitor):


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_38_0.png)


    Fig.2.10'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Chapter 2. Parallel port in the home design


    Such a filter will attenuate noise frequencies f = 1/(2\pi×R1×C1). The frequency
    determined by this expression is frequently called a “cut-off” frequency. The
    point where the frequency is equal to


    1/(2\pi×R1×C1) is called the “pole”; the pole indicates the point where signals
    with frequencies higher than 1/(2\pi×R1×C1) start to drop. In many cases the low-pass
    filter is designed so that it could attenuate the 50 or 60 Hz noise coming from
    the power supply. The cut-off frequency of the filter may be chosen very low (some
    Hz or less).


    The higher efficiency may be reached by using so-called “multi-pole” filters based
    on an active filter topology. Such filters are known as “active filters”; they
    usually include at least one operational amplifier and some resistors and capacitors.
    One of the popular low-pass active filter topologies known as a “Sallen-Key” filter
    is given in Fig.2.11:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_39_0.png)


    Compared to the simplest RC-filters, active filters have better characteristics.
    Additionally, active filters allow buffering of a high-impedance signal source
    from an analog-to-digital converter’s relatively low impedance input. Also active
    filters may have a gain 1V/V that allows amplifying small analog signals.


    The low-pass active filter shown in Fig.2.11 is, in fact, a voltage follower with
    a gain of 1V/V in the pass-band. Since there are two capacitors the filter has
    two poles (2nd order filter). Higher order filters can improve the frequency response,
    although their schematic circuit is more complicated compared with the simplest
    filter topology.


    In practice, the 2nd order low-pass filter will be a good choice for most applications.
    The analog channel with the $\Sigma-\Delta$ analog-to-digital converter may include
    the simplest low-pass filter based on a single RC-pair (see Fig.2.10) instead
    of an active LPF.


    In simple circuits with a low noise it is possible to use the non-inverting low-pass
    filter, implemented as a voltage follower with a single RC pair (Fig.2.12):'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Processing analog signals: common technique


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_40_0.png)


    Fig.2.12


    You can also use a simple inverting low-pass active filter shown in Fig.2.13:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_40_1.png)


    Fig.2.13


    As absolutely “clean" analog signals do not exist, some sort of the noise will
    exist. It is up to you whether to ignore noise or not, although using low-pass
    filters can prevent many problems when designing analog conditioning circuits.


    Unlike analog sensors, their digital counterparts provide a “pure" binary code
    on their outputs. This code may be additionally processed and analyzed by a micro-controller
    or processor. This significantly simplifies the design of embedded systems because
    conditioning circuits may be simplified or excluded.


    A digital sensor usually employs amplifying, filtering, and a digitization of
    signals inside the chip. Digital sensors have their own built-in digitizing system
    (SAR or, more frequently, sigma-delta converter) and may contain some additional
    circuitry such as filters and amplifiers. The developer usually config operating
    modes of the digital sensor by writing values to inner registers before starting
    a measurement. Afterwards data being measured may be read into the microcontroller
    or processor according to a device''s timing diagram.


    Most digital sensors have an interface compatible with the SPI or FC standard
    protocols. Though using digital sensors simplifies the design, there are however,
    some drawbacks. It is still difficult, for example, to gain a high precision for
    these sensors when a physical quantity changes over a wide range. Anyway, the
    choice of sensor is up to the developer.'
