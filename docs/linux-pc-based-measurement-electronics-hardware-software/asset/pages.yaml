  md: '# Chapter 5. Network and wireless systems for home and laboratory


    Upon pressing Ctrl-C the SIGINT signal is delivered to the process and the sig_handler()
    function is called. The first statement of sig_handler() closes the listening
    socket (the server variable), then sends a kill signal to the process by calling
    a kill() function:


    ```

    kill(PID, SIGTERM);

    ```


    The kill() destroys the process with identifier PID indicated by the left parameter
    of this function. The PID variable must contain the process identifier after executing
    the following statement in the main program:


    ```

    PID = getpid();

    ```


    That''s all about the TCP Server. Note that for brevity and clarity I don''t process
    possible errors that the network libraries functions (socket, bind, accept, etc.)
    may return when completed. But if you want to write a reliable network application
    you must consider at least the most common situations that may errors (breaking
    a communication channel, a wrong IP-address or port, exceeding the limit of listing
    connections, etc.). I encourage you to explore the great mound of documentation
    on this topic online.

    Now let''s back to our network system. We will see how to implement a TCP client
    application operating with the server, described above. Imagine that the TCP client
    has to send some text string to the TCP server. In most aspects the TCP client
    functions like the server. The simplest client application should execute the
    following sequence:


    +   1. create a socket through which the connection to the server will be established;

    2. connect to the server via its IP-address / port. After successful establishing
    the connection the client may either send some data to the server or receive data
    from it;

    3. close an active connection to the server thus terminating the communication.


    In the client application we don''t need to bind to sockaddr structure it takes
    place at the server, instead we use the connect() function to establish a connection
    to the server. The C source code of a simple TCP client passing data to the server
    is shown in Listing 5.2:


    # Listing 5.2


    ```

