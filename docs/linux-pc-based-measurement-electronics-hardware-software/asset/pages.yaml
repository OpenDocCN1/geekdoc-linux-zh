  md: '# Chapter 4. Sound card in home projects


    As you can see the recording / playing of sound is not complicated, because MATLAB
    executes all the operations for you using just a few functions. More complicated
    algorithms may be realized when we involve timers and program loops.

    The following example exhibits how to generate a sinusoid waveform programmatically.
    We already considered how to create a sinusoidal waveform in C (see Listing 4.1).
    Implementing the same task in MATLAB is extremely simple (Listing 4.6):


    # Listing 4.6


    ```

    >> cf = 10000;

    >> sf = 11025;

    >> d = 3.0;

    >> n = d * sf;

    >> s = (1:n)/sf;

    >> s = sin (2 * pi * cf * s);

    >> sound (s, sf);

    ```


    Here the cf variable holds the frequency in Hz (1000Hz, in our case). The sf variable
    determines a sampling rate equal to 11025 samples per second. Besides the variables
    above we need to set a time interval (duration) for sounding. The sound will last
    3 seconds, so we set 3 in the d variable. The following statement saves a total
    number of samples needed for playing in the n variable. This value is determined
    as a product of d and n. To understand this, you may recall the curve in Fig.4.2.


    The next step is to create a buffer where the samples will be held. Obviously
    the size of such a buffer must be at least equal to n to hold all possible values.
    The buffer is defined as an array s which values from 1/sf to n/sf:


    ```

    >> s = (1:n)/sf;

    ```


    As we want to play a sinusoid waveform we should design it as is shown below:


    ```

    >> s = sin (2 * pi * cf * s);

    ```


    Finally, we can play a sound buffer using the sound function:


    ```

    >> sound (s, sf);

    ```


    Besides sinusoids you can create other waveforms (square, triangle, sawtooth,
    etc.), although this involves a bit more maths than in the simple case of the
    pure sinusoid.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'When we want to create a continuous sound in MATLAB we may apply a timer object.
    The following example demonstrates this approach. First of all let''s define the
    callback function (name it as playSnd) for our timer and save the code of this
    function in a function M-file that will be named as playSnd.m. The source code
    of the playSnd function you can see below in Listing 4:7:


    # Listing 4.7


    ```

    function playSnd(obj, event)

    %UNTITLED Summary of this function goes here

    % Detailed explanation goes here

    cf = 1000;

    sf = 44100;

    d = 1.0;

    n = sf * d;

    s = (1:n) / sf;

    s = sin(2 * pi * cf * s);

    soundsc(s, sf);


    ```


    The playSnd function will be invoked each time the timer fires. The second part
    of our software is located inside M-file and has the following source code (Listing
    4.8):


    # Listing 4.8


    ```

    t = timer(''StartDelay'', 5, ''Period'', 5, ''TasksToExecute'', 5, ''ExecutionMode'',
    ''fixedRate'');

    t.StartFcn = disp(''Timer started'');

    t.StopFcn = disp(''Timer stopped'');

    t.TimerFcn = ''playSnd'';

    start(t);

    ```


    The very first statement creates the timer object t. After an initial delay of
    5 s the timer starts firing every 5 s (the Period parameter) until 5 cycles have
    passed (the TasksToExecute parameter). To complete the configuration of the timer
    t''s set its mode to ''fixedRate''. The StartFcn and StopFcn functions allow display
    of appropriate messages after the timer t has started or stopped, respectively.


    The TimerFcn parameter is assigned a ''playSnd'' which corresponds to the playSnd
    callback function saved in playSnd.m file. As you know from the previous chapter
    TimerFcn determines a function that will be executed when a timer fires. That''s
    all configuring the timer object.'
