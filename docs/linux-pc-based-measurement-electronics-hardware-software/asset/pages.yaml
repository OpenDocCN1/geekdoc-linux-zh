  md: '# Chapter 2. Parallel port in the home design


    So far we discussed systems which operate mainly with digital signals. The following
    embedded project concerns analog signals. Despite the “digital world” of electronics
    that surrounds us real world of course actually operates on analog signals. These
    mainly originate from a physical environment or various electronic circuits. Temperature,
    humidity, pressure, light and other physical quantities are continuous (analog)
    by nature, so all need analog sensors and analog conditional circuits before they
    reach microcontrollers or processors. Even digital sensors are not “purely digital”
    because they use analog circuits to process the analog signals inside their modules.


    Since a PC does not “understand” analog signals we need to convert them into a
    digital form. This process is called a “digitization”. To convert(ize) an analog
    signal into its binary representation, we need a special device usually called
    an “analog-to-digital converter” (ADC). An analog-to-digital converter converts
    an analog signal and converts it into a digital bit stream. This bit in turn,
    may be “pulled out” of the ADC by the software running on a PC via some interface,
    such as SPI, PC, etc. Finally, a digital image of the analog signal may be used
    in the PC by high-level software for complex processing and interpretation of
    results.


    # Measuring analog signals


    This project illustrates how to measure an analog signal represented as a voltage
    level which could be output from a typical sensor. As usual, this is a classic
    embedded project which includes both hardware and software. The hardware is very
    simple and includes a 12-bit successive approximation (SAR) analog-to-digital
    converter, type MCP3201, wired to the PC parallel port via a SPI-compatible interface
    (Fig.2.7):


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_33_0.png)


    Fig.2.7'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Measuring analog signals


    The SPI transfer are controlled via those lines by the program running on the
    PC. The analog-to-digital conversion and data transfer in the range of 0 to +5V
    is placed on input pin 2 of the MCP3201 chip. The CS control line frames the conversion
    process and must be low while the conversion is in progress. The program controls
    this line via bit 1 of the data port (pin 3 of the DB-25 connector). The output
    bit appears on the Dout line connected to bit 3 (pin 15 of the DB-25 connector)
    of the status port (0x379). The software reads each of this bit stream (MSB first)
    and saves it into an integer variable. After all data bits have been captured
    the application takes the lowest 12 bits which represent the original analog signal.
    The CLK line provides the pulses when synchronizing the data transfer. These pulses
    appear on pin 2 (bit 0 of the data port). Each separate bit is set on Dout on
    the falling edge of the clock pulse. should be latched by the control application
    on a rising edge of the clock pulse. To complete the conversion the program must
    raise the CS line.

    What just said is illustrated by the timing diagram in Fig.2.8:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_34_0.png)


    Note, that the MSB bit appears first on the Dout line after the 3rd CLK pulse
    has gone low. As you can see, a data transfer cycle requires 15 iterations.

    The circuit should be powered from a +5V noiseless power supply. The bypass capacitor
    of 10 uF should be placed as close as possible to the power pin of the MCP3201
    chip. The MCP3201 device may be replaced using a similar successive approximation
    ADC with an SPI-compatible interface. For instance, you may use a LTC1286 or a
    LTC1297 device (Linear Tech.), etc. in this case you would need to reconsider
    the circuit connections and modify the source code according to the timing diagram
    of the device selected.

    Let''s discuss the software. The source code of our control application is presented
    below (Listing 2.6):'
