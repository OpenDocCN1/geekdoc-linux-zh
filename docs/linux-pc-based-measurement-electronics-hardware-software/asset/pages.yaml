- img_proc: true
  md: '# Chapter 4. Sound card in home projects


    A sound card is usually packaged together with proprietary software and drivers,
    though Linux operating systems automatically detect and load open source drivers
    for popular cards. The software interfaces with the sound card allow the user
    to set parameters, control and check on hardware. Some packages include tools
    for recording, CD burning, editing or composing. In to successfully apply a sound
    card to embedded projects we need to know how an audio signal is represented in
    a PC. The original audio signal is analog by its nature and appears as a time-continuous
    voltage that changes over time. To process such a signal we need to break it into
    many discrete pieces, and then represent each piece as a binary value. This process
    is usually called digitization and is illustrated in Fig.4.2:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_141_0.png)


    Fig.4.2


    It is supposed that a sinusoid voltage signal with a frequency Fc arrives on the
    input of the sound card (this may be a microphone or a line input). This continuously
    changing signal is converted into digital samples at at some predefined rate.
    In other words at regularly spaced moments in time the input voltage at that instant
    is sampled and held constant until the next sample is taken. This reduces the
    total amount of information to a certain number of discrete voltages. Each sample
    is stored in memory buffer allocated for storing this audio data. The size of
    this buffer must be enough to contain a desired number of samples.


    To implement the digitization of an analog sound card contains a built-in analog-to-digit
    converter (ADC) that captures separate samples and as a binary code to a given
    magnitude of an input voltage. The particular code is moved to a memory location
    in the buffer and a pointer is incremented to prepare a place for a next value.
    Thus, the buffer gets filled with samples gathered over some predefined time interval.
    Briefly, this is how digitization is implemented.


    140'
