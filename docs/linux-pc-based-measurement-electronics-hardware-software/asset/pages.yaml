    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_257_0.png)


    > Fig.5.29. Simple FM transmitter circuit


    The C2 capacitor of 1nF ensures that the low-frequency audio signal will freely
    travel to the base of Q1 while RF frequencies go straight to the “ground”. The
    frequency range of the transmitter is defined by the resonant circuit (tank) composed
    of L1, C3 – C4 components and the base – emitter capacitance of the transistor
    Q1 (BF199). The audio signal voltage swing when applied to the base'
