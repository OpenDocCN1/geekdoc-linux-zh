    Designing embedded projects from this book requires some basic skills in electronics
    and programming. The software source code was designed using the C language, so
    you should be familiar with at least the basics of programming in this language.
    As our projects also include hardware, you must know how to assemble and test
    your circuitry.


    All embedded projects from this book may be represented in general as shown in
    Fig.1.1:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_13_0.png)


    Fig.1.1


    As you can see, our system may capture signals from sensors, analyze data obtained
    and issue control signals for actuators (motors, relays, heaters, etc.). All the
    signals from sensors pass through some external circuitry (called the “User’s
    board”) to the PC where they can be processed by control software. The control
    program running on the PC executes some algorithm which analyzes data received
    and makes “decisions” about a behaviour of our system. In the simplest case the
    “User’s board” provides some kind of hardware interface (SPI, FC, etc.) between
    sensors/actuators and a PC and does nothing else.


    On the other hand, “User’s board” may be designed with some “intelligence” to
    make a rough data processing prior to passing data to a PC. In this case “User’s
    board” could be equipped with a micro-controller or microprocessor. Most of our
    projects don’t require a separate “intellectual” external module so we use very
    simple development boards without any “intelligence”. Nevertheless, we will discuss
    a couple of the projects with micro-controller boards when designing distributed
    systems.'
