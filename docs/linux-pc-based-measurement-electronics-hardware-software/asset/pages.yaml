  md: '# Wide-band digitally controlled oscillator


    The LTC6903 device is a low-power, self contained digital frequency source providing
    a precision frequency from 1 kHz to 68 MHz, set-able through a serial port. The
    LTC6903 requires no external components other than a power supply bypass capacitor,
    and it operates over a single wide supply range of 2.7V to 5.5V. In our project
    the supply voltage will be 5.0V. As the datasheet, the LTC6903 features a proprietary
    feedback loop that linearizes the relationship between the digital control setting
    and the output frequency, resulting in a very simple frequency setting equation:


    $f = 2^{OCT} \times 2078 (Hz) / (2 - DAC/1024) (1),$


    where 1 kHz < f < 68 MHz, OCT is a 4-bit integer value (0-15) represented by the
    serial port register bits OCT [3:0] and DAC is a 10-bit integer value (from 0
    through 1023) represented by the serial port bits DAC[9:0].nThe output frequency
    can be set programmatically via a 3-wire SPI-compatible interface as shown in
    Fig.2.15:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_48_0.png)


    Fig.2.15


    The SPI signal lines are controlled via bit 0 through bit 2 of the data port (0x378).
    The output frequency appears on the CLK output (pin 6) or on pin 5 (the reversed
    signal). The OE signal line attached to the source voltage allows both CLK outputs.
    In order to lessen the noise and increase the accuracy by a bypass capacitor of
    0.1uF should be tied to the power pins of the LTC6903 as possible. It is also
    desirable to cut off any excess of the capacitor''s leads as much as possible
    to minimize their series inductance

    Let''s see how to configure the LTC6903''s output frequency.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Chapter 2. Parallel port in the home design


    The appropriate output frequency of LTC6903 can be set by using the formula (1).
    Configuring the frequency involves the following steps:


    +   1. Selection of the appropriate value of OCT from the Table 2 shown below:


    Table 2. Output Frequency Range vs. OCT Setting (Frequency Resolution 0.001 *
    f)


    | f ≥ | f < | OCT |

    |---|---|---|

    | 34.05 MHz | 68.03 MHz | 15 |

    | 17.02 MHz | 34.01 MHz | 14 |

    | 8.511 MHz | 17.01 MHz | 13 |

    | 4.256 MHz | 8.503 MHz | 12 |

    | 2.128 MHz | 4.252 MHz | 11 |

    | 1.064 MHz | 2.126 MHz | 9 |

    | 532 KHz | 1063 KHz | 8 |

    | 266 KHz | 531.4 KHz | 7 |

    | 133 KHz | 265.7 KHz | 6 |

    | 66.5 KHz | 132.9 KHz | 5 |

    | 33.25 KHz | 66.43 KHz | 4 |

    | 16.62 KHz | 33.22 KHz | 3 |

    | 8.312 KHz | 16.61 KHz | 2 |

