  md: '# Chapter 5. Network and wireless systems for home and laboratory


    As we are dealing with sockets, we need to invoke some library functions referred
    to in sys/socket.h header file. That is the reason we need to place the include
    <sys/socket.h> directive at the beginning of the source code. Often writing a
    C network application it is convenient to operate with symbolic names instead
    of IP-addresses which are, in general, binary numbers. The C language comprises
    some library functions defined in a header file that implement conversions between
    native binary code IP addresses and their symbolic representation, so we add the
    reference to this library in the source code.


    In our program we define server and client variables of int type containing descriptors
    of the listening and working sockets respectively. The buf variable will hold
    bytes received from the client in a current session. Also we need to define the
    structure name addr of a sockaddr_in type. This is a basic structure which must
    be filled with basic parameters needed for configuring the listening socket. We
    need to configure sin_addr, sin_port and sin_family fields. The program starts
    by creating the listening socket:


    ```

    server = socket(AF_INET, SOCK_STREAM, 0);

    ```


    Initializing the server socket is provided by a socket library function taking
    three parameters. On the left must be AF_INET (since we work with a TCP stack).
    With TCP the data is presented as a byte stream without losses, the second parameter
    we work with SOCK_STREAM. Finally, the last parameter is on the right defines
    the type of protocol used. As the first two parameters completely define the type
    of protocol, we can assign zero to this parameter. Note that for simplicity we
    don''t process any errors that might appear when working with sockets. You must
    foresee similar situations and provide appropriate handling in those cases. Let''s
    go back to our code.


    After the socket has been successfully created we must bind its descriptor with
    the addr structure using the following statement:


    ```

    bind(server, (struct sockaddr*)&addr, sizeof(addr));

    ```


    The left parameter of the bind() function holds the descriptor of the listening
    socket (server, in the given case). The following parameter takes the address
    (pointer) of the addr structure that must have been already configured properly;
    the right parameter holds the size of the addr structure. After binding, the program
    puts the socket into the listening state. The following statement does that:


    ```

    listen(server, 15);

