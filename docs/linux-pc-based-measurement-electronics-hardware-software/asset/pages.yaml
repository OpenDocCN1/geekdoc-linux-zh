  md: "```\nvoid WriteByte(int b1)\n{\n    int i1;\n    for (i1 = 0; i1 < 8; i1++)\n\
    \    {\n        outb(0x0, MCR); // SCL goes low\n        if ((b1 & 0x80) != 0)\
    \ // if MSB of b1 = 1, SDA is assigned 1\n        {\n            outb(SDA, MCR)\n\
    \            tmp = SDA;\n        } else\n        {\n            outb(0x0, MCR);\
    \ // if MSB of bit 1 = 0, SDA is assigned 0\n            tmp = SDA;\n        }\n\
    \        outb(tmp << SCL, MCR);\n        b1 = b1 << 1;\n    }\n    outb(SCL, MCR);\n\
    \    outb(SCL | SDA, MCR);\n}\n```\n\nRecall, the signal line of the IC interface\
    \ is controlled by RTS and the SDA line is led by DTR from the serial port.\n\
    Two variables, cmd and dat, are used. The cmd variable holds the code of the command\
    \ that is to be sent to the IC device in a first byte. The command is a combination\
    \ of the device and the code of the operation (read/write). In our case, the code\
    \ of the command will be 0x70. The dat variable contains the data that appears\
    \ on P0–P7 outputs after a write is completed. Writing data to the IC bus for\
    \ the PCF8574 device takes four steps: issuing the “start sequence”, writing the\
    \ first byte which contains the command, writing the data byte that must be the\
    \ P0–P7 outputs and These steps will be executed inside the main program that\
    \ invokes the appropriate functions in the right order. The I2CStart function\
    \ generates the “start sequence”. The WriteByte(cmd) function passes the first\
    \ byte (command, cmd variable) to the PCF8574A device. The WriteByte(dat) function\
    \ passes the data byte which is outputted to the P0–P7 pins. Finally, the I2Cstop\
    \ function generates the stop sequence which ends a data transfer via the IC interface.\n\
    \nThe design may be improved upon increasing the number of outputs up to 14 replacing\
