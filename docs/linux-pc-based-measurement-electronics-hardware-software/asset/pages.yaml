    # Digitally controlled DC voltage source


    Many embedded systems require digitally controlled DC voltages for the controlling
    and testing of various devices such as robots, motors, etc. Often such a DC voltage
    is also useful for building voltage-controlled circuits such as amplifiers and
    oscillators. The obvious way to create a digitally DC voltage is to use some type
    of digital-to-analog converter (DAC). This project is dedicated to building simplest
    8-bit digital-to-analog converter based on the MCP41010 digital potentiometer
    from Microchip Corp. With being, let''s discuss how this potentiometer works.
    Some excerpts from the device''s datasheet will help us.


    According to the datasheet, the MCP41XXX/42XXX devices constitute digital digital
    potentiometers used in place of standard mechanical potentiometers. Digital potentiometers
    have resistance values of 10K, 50K and 100K (ohms). In our project we apply a
    MCP41010 device which has a maximum resistance of 10K. Each potentiometer is made
    up of a variable resistor and an 8-bit (2^8 = 256 positions) data register that
    determines the wiper position. There is a nominal wiper resistance of 52 Ohm for
    the 10K version, 125 Ohm for the 50K and 100K versions. The resistance between
    the wiper and either of the resistor endpoints varies linearly according to the
    value stored in the data register.'
