  md: '# Chapter 5. Network and wireless systems for home and laboratory


    connection-oriented, reliable communications service. TCP establishes connections,
    sequences and acknowledges packets sent, and recovers packets lost during transmission.
    In contrast to TCP, UDP provides a one-to-one or one-to-many, connectionless,
    unreliable communications service. UDP is used when the amount of data to be transferred
    is small (for example, a data block that would fit into a single packet), when
    an application developer does not want the overhead associated with TCP connections,
    or when the applications or upper-layer protocols provide reliable delivery. TCP
    and UDP operate over both IPv4 and IPv6 layers. In our projects we will use TCP/IP


    The Application layer allows applications to access the services of the other
    layers, and defines the protocols that applications use to exchange data. The
    Application layer contains many protocols, and more are always being developed.
    The most widely known Application protocols help users exchange information via
    the Internet. The well known Hypertext Transfer Protocol (HTTP) transfers files
    that make up pages on the World Wide Web. The File Transfer Protocol (FTP) transfers
    individual files, typically for an interactive user session and the Simple Mail
    Transfer Protocol (SMTP) transfers mail messages and attachments. Additionally,
    some Application protocols help manage TCP/IP networks.


    How, in practice, do those layers relate to writing our applications? To answer
    this question we should consider how Windows operating systems support the development
    of network applications. Windows network applications use two main application
    programming interfaces (APIs) to access TCP/IP services: Windows Sockets and NetBIOS.
    Nowadays the Windows Sockets is the most commonly used API for developing network
    applications in Windows. Almost all TCP/IP applications as services and tools
    supplied with Windows are examples of Windows Sockets applications. Windows Sockets
    provides services that allow applications to use a specific IP-address and port
    to initiate and accept a connection to a specific destination IP-address and port,
    send and receive data, and close a connection.


    +   There are three types of sockets that may be used in network applications:

    - stream sockets, which provide a two-way, reliable, sequenced, and undplicated
    flow of data using TCP.

    - datagram sockets, which allow bidirectional flow of data using UDP.

    - raw sockets, which allow protocols to access the IP packet directly, without
    using TCP or UDP.


    As mentioned earlier, the socket functions are the endpoint for network communication.
    Recall that two sockets each end of the connection create a bidirectional communication
    path. An application creates a stream or datagram socket by specifying the IP–address
    of the host and the port application is using. When developing the network application
    you also need to specify the type of service (TCP for connection-based service
    and UDP for connectionless). Once we are going to use TCP protocol in our applications,
    we need to specify that explicitly.

    The TCP protocol has a great advantage compared to other protocols, such as UDP,
    IP, etc. because it provides for correct delivery of data from the PC to the PC.
