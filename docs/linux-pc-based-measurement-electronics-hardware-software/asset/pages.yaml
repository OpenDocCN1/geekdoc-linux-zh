  md: '# Chapter 2. Parallel port in the home design


    The MCP1XXX series provides 256 resistor taps and accepts a power supply from
    2.7 through 5.5V. In our project we will feed the MCP4010 device with +5V. This
    also means that the LSB will be equal to 5 / 2^8 = 0.0195 V. If, for example,
    an application writes a binary code equivalent to 100 (decimal) to the device,
    the digital potentiometer yields 0.0195 × 100 = 1.95 V at its output. Let''s go
    back to our project. The schematic circuit of the project is shown in Fig.2.18:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_53_0.png)


    Fig.2.18


    The digital potentiometer is controlled via a SPI-compatible interface from the
    parallel port of the PC. The three lines (SCK, SI and CS) are controlled by the
    application, running in Linux. The binary code that corresponds to the particular
    DC output value is shifted bit by bit from the port data register (0x378) to the
    digital potentiometer. The output analog Volt appears on the PW0 line (pin 6 of
    MCP40110) that represents the “wiper” of the potentiometer.


    As we apply the MCP40110 device, the total resistance between PA0 and PB0 outputs
    is 10K. If your circuit needs to provide a low output impedance and/ or drive
    a higher load, you must use an additional buffer at the Volt output. For example,
    you may apply an op-amp based voltage follower (shadowed box in Fig.2.18).


    In our design we use the digital potentiometer MCP4010 device in the so-called
    “potentiometer mode” where all three terminals of the device are tied to different
    nodes in the circuit. This allows the potentiometer to output a voltage proportional
    to the input voltage. This mode is sometimes referred to as a “voltage divider”
    mode. The variable voltage Vdiv is provided by adjusting the wiper (PW0) position
    between two endpoints PA0 and PB0 (Fig.2.19). Note reversing the polarity of the
    PA0 and PB0 terminals will not affect operation.


    52'
