  md: '# Chapter 1. PC in home projects


    Nowadays the personal computer is readily recognised as a powerful tool in office,
    scientific and industrial applications. The modern desktop PC or laptop may also
    serve as a basis for developing various embedded systems for home and laboratory
    experiments. With our PC we can measure physical quantities, control actuators
    and build home security systems, to name but a few. Often such "Do-It-Yoursel"
    (DIY) systems can compete with industrial applications in terms of performance
    and capabilities. The other advantage of DIY projects is that they can be very
    inexpensive.


    By combining innovative approaches you can create your own, powerful, PC-based
    home research center or configure your PC as a home center. You can also design
    your PC-based home system to be controllable remotely using Internet or e-mail.
    Nowadays, modern technologies help individuals to build very complicated systems
    because many solutions that were too expensive a while ago have become cheaper
    and accessible for the professional developers and hobbyists—instance, wireless
    technologies. Another aspect that allows construction of complex systems by individuals
    is that modern chips are usually multifunctional and programmable; this significantly
    simplifies design of embedded systems.


    Manufacturers often provide the familiar, standard interfaces (SPI, PC, etc.)
    for configuring your chips, a developer does not necessarily need to know the
    inner, sometimes very complicated architecture of a particular chip—it is enough
    to configure some hardware registers and start working. This book is dedicated
    to designing home and laboratory systems running on the PC with a Linux operating
    system. All the projects discussed here will work on a desktop PC or laptop with
    serial interfaces built-in or installed. Some projects require a sound card, which
    you can use either a built-in device that resides on a motherboard or take a stand-alone
    sound card.


    Using Linux for these purposes has some advantages over Windows. The most obvious
    advantage using Linux is that it is free. Also, with Linux, you have the power
    to control just every aspect of the operating system.

    As we want to build embedded systems we must master control hardware. This task
    is essentially simpler in Linux than in Windows because the Linux operating system
    provides easy access to hardware registers from user software. Linux is perfect
    for old computers which can be easily transformed into home laboratories and control
    centers. This is almost impossible with Windows because of its great demands hardware
    resources. Compared to Windows, Linux requires knowledge of the operating system,
    patience and a strong learning curve. You must have the desire to read and figure
    things out on your own, rather than trusting everything to the OS. To start with,
    we need a Linux operating system to be installed on a computer. All the projects
    designed for this book have been tested under Ubuntu 10.10 desktop version of
    Linux, but you can'
