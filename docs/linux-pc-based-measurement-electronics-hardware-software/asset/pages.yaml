  md: '# Chapter 4. Sound card in home projects


    The statement


    start(t)


    starts our timer running.


    By setting the TasksToExecute parameter to an appropriate value you can control
    the interval when a timer is active. We can also convert any waveform into square
    or sawtooth by using the circuit shown in Fig.4.4. Thus we can have three types
    of signals (sinusoid, square and sawtooth) at a time using a single channel of
    a given sound. The last topic we will discuss in this chapter relates to visualization
    and estimation of audio data. The simplest way to see and estimate an audio signal
    is to take an oscilloscope, place a probe at the input or output of the sound
    card and capture the signal. However, the oscilloscope is an expensive device;
    so many hobbyists don''t have one. Fortunately, there are several software methods
    of viewing and measuring the parameters of a sound signal. As to Linux, in order
    to observe an audio signal we can apply one of the free programs known as “audio”
    or “sound” editors.


    Here we should mention two approaches to the visualization and estimation of audio
    signals. When we try to observe a signal arriving at the input of the sound card,
    we simply switch to the “record” mode usually available in all audio editors and
    capture the audio signal continuously or during some predetermined time. Then
    we can save the captured signal to WAV-file and/or start processing audio data.
    This is a common way of dealing with the input audio data using Audacity, GoldWave
    or many other audio editors.


    Another approach may be taken when we want to estimate that our sound card yields
    on its output. We connect to the input (“line-in”) using an audio dale, capture
    the audio signal generated by a sound card and evaluate it. The sound may be created
    programmatically using a C++ program or launching, for example, Matlab and then
    may be captured by the audio editor, such as Audacity or GoldWave. When you apply
    this method, you have to configure your sound card to operate in a duplex mode
    – in that case the built-in Digital-to-Analog (DAC) converter of the sound card
    will generate an audio stream that will be picked by the Analog-to-Digital (ADC)
    converter responsible for digitizing the data. Obviously, the input and output
    audio data must have the same format (sampling rate and number of bits per sample)
    to avoid errors. It is also desired that the power levels of both input and output
    signals should be to a mid-scale. Let’s see in the following examples where we
    use a Matlab environment to write a program to generate sound. Remember that the
    output of the sound card must be linked to the “line-in” input. In these experiments
    I used an “old” ESS1869 sound card plugged into an “ancient” Pentium 4 PC; this
    configuration, however, exhibited satisfactory performance. The following source
    code (Listing 4.9) saved in a pure_sinwave_test.m file generates a sine waveform:'
