  md: 'The same result might be achieved by opening a /dev/dsp device. A sound card
    mostly offers three main features:


    +   - Digital sample input/output;

    - Frequency modulation output;

    - A midi interface;


    Each of these features is provided through its own device interface. For digital
    samples it will be /dev/dsp; the frequency modulation is processed via /dev/sequencer
    and the MIDI interface will be provided through /dev/midi. The sound settings
    (volume, balance, etc.) are controlled via the /dev/mixer interface.


    Although the above cat allows you to read the configuration of the sound device,
    refrain from writing any code based on this information because it describes general
    features of your device. This information may be changed over time, such as after
    the sound driver has been enhanced. We must practice deal with a /dev/dsp device
    when programming a sound card. As mentioned, nowadays pretty all Linux operating
    systems support the ALSA system, so we will discuss its programming architecture
    and features. Before dealing with ALSA it is worth checking if your sound card
    has an appropriate ALSA driver. All supported sound chips are enumerated on the
    ALSA web site www.alsa-project.org together with the appropriate drivers. There
    are two preferred application approaches to use a sound card to our home projects.-
    The first; we can use it to produce test waveforms (sinusoid, square wave, triangle,
    sawtooth, etc.). These signals are quite handy when tuning up various circuits.
    Thus, use of sound card allows us to quickly build an almost costless, but very
    useful signal generator. We may further consider at least two methods to fulfill
    this approach.


    We can realize this signal generator entirely in software written in say, the
    C programming language. In this case we must calculate the waveforms by using
    some math functions accessible from the math.h library. In this way we can build
    the signal of interest mathematically, then calculate samples, fill a memory buffer
    with these samples and, finally, play the sound. This approach doesnt require
    designing any circuitry except for perhaps introducing some external buffer stage
    on the Line-out output of the sound card. This could be a very simple circuit,
    For example, a voltage follower on a wide-band op amp - that isolates the sound
    card output from the target device(s). In this way we can get an extremely low-cost,
    but quite good performance low-frequency signal generator which forms signals
    of predetermined waveforms using the DAC of the sound card.'
