    This circuit setting/ clearing the RTS or DTR bits in the MCR causes raising/falling
    the appropriate TTL output. As to CTS and DSR, the appropriate bit in the MSR
    register will be set/cleared when the appropriate line becomes high/low. These
    conditions simplify programming because a logical state of "1” in the MCR/MSR
    corresponds to the high level on the appropriate line, while a logical "0” results
    in a high low on the signal line.


