    \ & 0x8;\n        if (dataStatusPort != 0) {\n            binData = binData |\
    \ mask;\n            outb(0x1, dataPort); // CLK goes high\n            mask =\
    \ mask >> 1;\n        }\n        outb(0x3, dataPort);\n        binData = binData\
    \ & 0xFF;\n        total = 5.08 / 4096 * binData;\n    }\n    printf(\"MCP3201\
    \ gives following result: %5.3f V\\n\", total);\n    return 0;\n}\n```"
