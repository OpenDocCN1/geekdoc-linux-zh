    # Using data lines in embedded projects


    Let''s see how we can apply the TD line to implement simple home automation tasks.
    Recall that the data stream stream through TD line is a sequence of bits. Each
    bit in this sequence is represented as a voltage-age swing that ranges from, nominally,
    -12V to +12V. We may apply such a bit sequence to switch on/off external devices
    attached to the RS-232 interface. Implementing this task requires some simple
    circuitry which may be easily assembled and tested.


    Below (Fig.3.6) you can see a simple demo circuit which allows switching on a
    DC load (a LED, in our case) when a byte is sent through the TD pin.'
