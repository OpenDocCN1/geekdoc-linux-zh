  md: '# Simple low-frequency oscillator


    The second method to realize time-dependent embedded systems is to use simple
    circuitry with some low-cost and widely used components. You should entrust the
    main job in such projects to software. This approach works well for projects accepting
    time resolutions to milliseconds. In these projects we may program time intervals
    within the capabilities of the operating system. This method allows practical
    realization of lost time-constrained embedded systems, such as digital-to-analog
    converters, pulse-width modulators, etc. In the following sections we will discuss
    some useful and low-cost embedded projects where Linux interval timers are used.


    # Simple low-frequency oscillator


    When we want to have a costless precision square-wave oscillator operating up
    to 200-300Hz, we can accomplish this task entirely in software. The output signal
    may be taken from any of the data port pins. The only thing you need is to provide
    some buffering for an external load. The schematic circuit of such a software
    oscillator is shown in Fig.2.24:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_64_0.png)


    Fig.2.24


    As you now know the parallel port''s output buffers provide output currents of
    about 10-12 mA. When a load consumes a higher current you will need to connect
    hardware buffers between your parallel port hardware and the load. It is possible
    to use any kind of single-supply analog comparators with a high slew rate and
    TTL-compatible output or some Schmitt trigger chip from the TTL74XX series. If
    you have a capacitive load you must ensure that your buffers can operate properly
    under such conditions.


    The source code of our project is based on using an interval timer signaling with
    a frequency of 100Hz. The source code of our oscillator is shown below (Listing
    2.11).'
