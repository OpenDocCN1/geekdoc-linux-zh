    # Programming using ALSA


    Programming sound using ALSAs capabilities gives the developer key advantages
    over OSS. When ALSA you are allowed to configure most audio parameters and that
    provides you greater flexibility and creative power while processing sound signals.
    In addition, the developer gains a great degree of control over audio processing
    from your applications.

    If you want to work with the ALSA sound system you should be aware that ALSA is
    configured in the system''s kernel. After ALSA has been installed, the /proc/asound
    directory is created, so you can simply check for its presence in a file system.
    Once configured the ALSA sound system operating of the sound card using ALSA API
    calls.


