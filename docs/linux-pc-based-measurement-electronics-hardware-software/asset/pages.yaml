  md: "# Interfacing external circuitry to the serial port\n\nNote that the length\
    \ of an RS-232 cable from the DB-9 connector and our circuit may extend to 12\
    \ m.\nLet's see how to program the control lines. You already know from the previous\
    \ chapter how to deal with hardware registers of a parallel port. The same is\
    \ true for serial port hardware. We will mainly use four functions: ioperm(),\
    \ iopl(), in() and out(). Recall, the first two grant access to the hardware from\
    \ a user application, and in() and out() provide reading/writing/from/the hardware\
    \ ports. In order to become more familiar with the serial port hardware let's\
    \ consider the details of two simple demo projects.\nThe following project shows\
    \ how to program the RTS control line in gcc. Type the following C source code\
    \ (Listing 3.3):\n\n# Listing 3.3\n\n```\n#include <unistd.h>\n#include <sys/io.h>\n\
    \n#define MCR 0x3FC // Modem Control Register = base + 4\n\nint main(void) {\n\
    \    char bRead = 0x2;\n    iopl(3);\n    while (1) {\n        outb(bRead, MCR);\n\
    \        sleep(5);\n        bRead = ~bRead;\n    }\n    return 0;\n}\n```\n\n\
    This application toggles the RTS line (bit 2 of MCR) every 5 seconds. As the program\
    \ requires privileges at starting, you must use the sudo command to launch a program\
