  md: '# Expanding output lines with decoder


    For an expander chip we use the BCD-to-decimal decoder (1-of-10) type 74HC42.
    The 74HC42 accepts four active high BCD inputs and provides 10 mutually exclusive
    active low outputs. The logic design of this chip ensures all outputs are high
    when binary codes greater than nine are applied to the inputs. In our scheme we
    use two (A0 and A1) inputs which are driven by the DTR and RTS signals, respectively.
    Thus we are capable of gaining 2^2 = 4 outputs that range Y0 to Y3.


    # Listing 3.8


    ```

    #include <stdio.h>

    #include <unistd.h>

    #include <sys/io.h>

    #include <stdlib.h>


    int main(void)

    {

    int MCR = 0x3FC; // Modem ControlRegister

    int chOutput = 0;


    iopl(3);

    while (1)

    {

    outb(chOutput, MCR);

    sleep(10);

    chOutput++;

    if (chOutput > 3)

    break;

    }


    return 0;

    }

    ```


    This program sequentially toggles outputs Y0-Y3 with a 10 second delay between
    switching.. Setting A0-A1 lines is implemented in a while (1) loop. The following
    statement


    outb(chOutput, MCR);


    sequentially writes the values in the range 0 to 3 into the MCR register. This
    code effects the A0-A1 inputs of the decoder and causes switching on an appropriate
    output of Y0-Y3. With this circuit we gain 2 inputs (CTS and DSR) and 4 outputs
    for our embedded system.


    109'
