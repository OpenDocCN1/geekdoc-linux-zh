    Let''s discuss IP-addresses and ports in detail.

    An IP address is an identifier that is assigned to the "network interface" or
    a set of interfaces. The "network interface", from the first point of view, appears
    to be the network card of your PC together with appropriate software controls
    data transfer via this device. Each IP address can identify the source or destination
    of IP packets (data blocks travelling over the network). Nowadays many IP-addresses
    are formed according to the IPv4 standard, though in the future ipv4 will be replaced
    with IPv6. The reason for this is obvious: IPv4 addresses are 32 bits long but
    an IPv6 address is 128 bits long, which is four times larger than an IPv4 address.
    This allows us to significantly extend the Internet address space that is about
    to be overloaded.


    When enabling TCP/IP on a network interface we should assign it to one or more
    logical IPv4 addresses, either automatically or manually. expressed as 32-digit
    strings consisting of 0s and 1s, but this is so common, dotted decimal notation
    was introduced, which periods represent four decimal numbers from 0 to 255. Each
    decimal number (octet) represents 8 bits or 1 byte of the 32-bit address. For
    example, the IPv4 address 11000010000010001111000100000010 is expressed as 194.15.28.10
    in a dotted decimal notation.


    Besides the IP-address the application must supply the TCP port number of the
    destination application. The port provides a location for sending segments. Each
    port must be identified by its unique number. Port numbers below 1024 are the
    well known ones assigned by the Internet Assigned Numbers Authority (IANA) for
    predefined network applications. For instance, a port with number 23 is reserved
    for Telnet; port 80 is reserved for HTTP, etc.


