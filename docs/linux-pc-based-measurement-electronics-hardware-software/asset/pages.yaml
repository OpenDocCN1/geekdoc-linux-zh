    It is worth using a high precision potentiometer R2 – which also affects the accuracy
    of this circuit. Actually, the best result would be achieved by applying a specialized
    single-chip voltage reference instead of R2. When designing this project you should
    also evaluate your read load by Q1 and select an appropriate power transistor.
    Additionally, common precautions must be taken into account when wiring devices
    to the parallel port. Lastly, if you are going to use some expansion board with
    the parallel interface, remember to replace addresses 0x378-0x379 in the source
    code with appropriate values.


    # Expanding input lines of the parallel port


    Often you need more inputs to capture signals from external circuits just as the
    parallel port can provide. The simplest way to expand the number of inputs is
    to use a multiplexer which can direct multiple input signals to a single output.
    The following embedded project demonstrates how to do that. The hardware part
    of the project is presented in the following schematic circuit (Fig.2.5):


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_30_0.png)


    Fig.2.5


    This circuit allows using up to 8 additional inputs with the parallel port. As
    you can see the “heart” of this circuit is a multiplexer type 74HC4051. This circuit
    provides reading of the A0-A7 digital inputs one at a time. The TTL-compatible
    signal of the selected input goes to the single X output of the 74HC4051. The
    X output, in turn, is attached to an input of the parallel port. In our case X
    goes to pin 12 of the DB-25 connector. This given pin represents bit 5 of the
    status port (register). Thus, the program may know the state of the X output by
    reading bit 5 of the status port. As the usual program uses an address 0x378 for
    the data port and address 0x379 for the status port (register). The program selects
    an input channel for reading by setting the 3-bit digital code on the S0–S2 select
    inputs'
