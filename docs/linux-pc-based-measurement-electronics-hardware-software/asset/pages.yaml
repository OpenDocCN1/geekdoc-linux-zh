  md: '# Chapter 3. Home projects with a serial port


    +   - How to connect it to external devices. The following simplified diagram
    shown in Fig.3.1 illustrates interfacing UART to external circuits:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_79_0.png)


    Fig.3.1


    As you can see, the UART may be controlled from a microcontroller or microprocessor
    as shown on the left side of Fig.3.1. The baud rate is configured using an oscillator
    circuit and software division of a clock. Configuring modes of operations is implemented
    by writing particular values into internal hardware registers which are responsible
    for the UART’s functioning. Each standard UART may be accessed through 7 hardware
    drivers. As usual, the addresses of these registers are relative to “base” address.
    In the case of a built-in UART,as will be found on most motherboards, UART interfaces
    with external devices using several output signals (eg. SOUT, RTS and DTR) and
    several input signals (eg. SIN, DSR, DCD, CTS and RI) which pass through RS-232
    line-driver devices to form standard voltage levels for the serial interface.

    An user can see all these signals on the DB25 connector on the back of the PC.
    Except SOUT which appears as TD and SIN which is assigned RD, all other signals
    keep their original names at the DB25. SIN and SOUT signals are data lines for
    data transfer between communication devices. These lines may be used to create
    a so-called “null-modem” link which allows transferring of data between communication
    devices without any additional signals. With this configuration the SOUT (TD)
    signal line of the first device is connected to SIN (RD) of the second device
    and vice versa, SIN (RD) of the first device is connected to SOUT (TD) of the
    second device. The “null-modem” configuration is often used to connect a microcontroller
    development board to the PC. The “null-modem” configuration is shown in Fig.3.2:'
