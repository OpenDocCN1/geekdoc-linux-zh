  md: '# Chapter 2. Parallel port in the home design


    The bWrite variable holds the byte which is written to the data port; the value
    of bWrite is reversed after the byte has been written to the data port. Each iteration
    repeats every 10 seconds (function sleep(10)). The Read variable holds the value
    of bit 5 of the status port. As pin 2 and pin 12 are tied together, the value
    of bit 5 echos has been written to bit 0 of the data port. The program code separates
    bit 5 of the status port by executing the following statement


    ```

    bRead = inb(0x379) & 0x20;

    ```


    Depending on the value of the bRead variable the program outputs one of two messages
    by calling the printf() library functions. By now we, in general, how to operate
    with the parallel port programmatically, so we can start designing more useful
    and complicated projects. The following project will be a simple thermostat system
    that switches on/off a heater when some temperature conditions are met.


    # Simple thermostat system


    This demo project shows a practical small thermostat system controlled via the
    parallel port. Suppose we want to build a system that could control the temperature
    inside an oven. Our system function in various ways, but we select the simplest
    algorithm described below. When the oven exceeds a given threshold a heater element
    is turned off. Otherwise, when the temperature inside the oven drops below the
    same threshold the heater element will be turned on. Additionally, our system
    has to check the temperature conditions every 20 s, although most other intervals
    may be set as well. The schematic circuit of this system is shown in Fig.2.4:


    This system includes an LM35DZ temperature sensor which produces an analog voltage
    proportional to a temperature of an environment with a factor of 10mV/C. For example,
    if the LM35''s output voltage is equal to 0.29 V, the temperature of the environment
    is 29°C. The sensor''s output signal passes to the non-inverting input (pin 3)
    of the voltage comparator LM2903 (A2). The inverting input (pin 2 of A2) is tied
    to the reference voltage that comes from the wiper of the potentiometer R2 attached,
    in turn, to the +5V power supply. Reference voltage defines the threshold and
    may be selected randomly by a user. If the sensor''s output voltage on the non-inverting
    input exceeds the reference voltage on the inverting input (pin 1 of A2) of the
    comparator goes high. Otherwise, if the sensor''s output becomes less than the
    reference voltage the comparator''s output goes low. The program checks the comparator''s
    output via bit 3 of the status port (address 0x379).'
