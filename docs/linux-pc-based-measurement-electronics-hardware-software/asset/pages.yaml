  md: '# Simple remote control system using FM transmitter and receiver


    As you can see, the point where the signal for our control circuit may be taken
    from is between the output of the audio amplifier and the capacitor (usually electrolytic
    used) through which the signal is coupled to the speaker. Anyway, if you would
    find this point within your FM receiver, you would need to probe the circuit and
    take any point where the audio signal emerges. If you have some experience in
    assembling electronic circuits, this task will not get you into trouble. The next
    step is to amplify (if necessary) the audio signal just found, then convert it
    into a digital representation. Finally, our digital signal will drive the load
    through some power switch. The demo control circuit which performs all that is
    shown below (Fig.5.28):


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_256_0.png)


    Fig.5.28


    As you can see, the audio signal is fed to the active filter input (just to the
    left side of R2 in the schematic) through a voltage divider R1 and a capacitor
    C1. You will have to adjust the level of the audio signal from the FM receiver
    so that it will be about 0.1–0.3V. If you pick the signal, for example, after
    the last amplifier stage of the receiver, you will surely need to attenuate the
    signal, so that is where the adjustable band divider may come in.


    The active bandpass filter built around the TL081 opamp operates at a central
    frequency of 1000Hz with a bandwidth of 200Hz. Additionally, the filter provides
    a gain of 2V/V, so the magnitude of the signal on pin 6 of A1 is twice as high
    as that on the left lead of resistor R2.


