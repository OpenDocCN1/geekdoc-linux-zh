  md: "# Chapter 5. Network and wireless systems for home and laboratory\n\nAs the\
    \ source code of our pre-forked TCP server may seem a little complicated, we will\
    \ analyze it in detail. This server may fork 5 child processes - this is defined\
    \ by a MAXCON constant. The current number of processes being executed is held\
    \ in the cntChild variables. This variable is decremented in the sig_child handler\
    \ which is called while the process terminates. This handler processes the SIGCHILD\
    \ event that fires when a child process is complete. On the other hand, when a\
    \ new process is created the cntChild variable will be incremented. Thus the TCP\
    \ server provides 5 pre-forked processes running simultaneously.\n\nThe main job\
    \ is implemented in a for( ) loop. First, the server checks the number of active\
    \ processes running by executing if...else control statement:\n\n```\nif (cntChild\
    \ < MAXCON)\n{\n  ..\n}\nelse\n  sleep(1);\n```\n\nWhen there are no incoming\
    \ requests from clients for all 5 child processes are in an idle state. In this\
    \ case the server gets paused for 1 s by invoking the sleep(1) function and checks\
    \ the number of child processes again. Suppose, some request has arrived at the\
    \ server. Then since some of the running processes (usually with the lowest PID)\
    \ take care of servicing this request. Initially, a new working connection is\
    \ created by the following statement:\n\n```\nclient = accept(server, 0, 0);\n\
    ```\n\nAfter the socket has been successfully created the accept() call returned\
    \ a positive value, if the control statement that follows reads data through the\
    \ open connection:\n\n```\nif (client > 0)\n{\nbRead = recv(client, buf, sizeof(buf),\
    \ 0);\nif (bRead > 0)\n{\n  buf[bRead] = \"\\0\";\n  printf(\"RECEIVED: %s\\n\"\
    , buf);\n}\n}\n```"
