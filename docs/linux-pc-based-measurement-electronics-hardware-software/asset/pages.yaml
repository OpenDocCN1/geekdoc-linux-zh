- img_proc: true
  md: 'To play back audio data, we must read the digital samples from a memory buffer
    and deliver them to a digital–to-analog converter (DAC). The DAC converts each
    binary code obtained into a voltage and then passes the analog signal to an amplifier
    to increase the magnitude of the voltage. As you may guess, the sample rate with
    which the DAC restores a binary code into a continuous analog signal should be
    equal to that which the ADC during digitization.


    In order for a computer to represent sound accurately, the number of samples must
    be sufficiently high that the audio signal can be digitized accurately. For this
    happen it has been mathematically proven that the frequency Fsample (see Fig.4.2)
    of sampling also the sampling rate must be at least twice as high as the highest
    possible frequency Fc of the input signal. As the high limit of a sound signal
    is about 20kHz, the sampling rate Fsample must be at least 40kHz or even higher.
    The standard for recording sound is 44100 samples per second, although the most
    modern audio devices operate at higher sampling rates. After digitization has
    been completed the audio data in a buffer may be saved in one file having a special
    format known to audio applications (.wav or another) or may be played back producing
    sound via speakers.


    A sound card may be successfully applied to various home and laboratory projects.
    Possible applications include low-level, low-frequency input signals from various
    sources, conversion/decoding, and modulating signals, generating waveforms for
    testing and measurement purposes and so on. The sound may even be used in control
    systems capable of triggering multiple loads. Using the sound card in embedded
    projects involves both hardware and software, so we will discuss both aspects.
    Let''s start from learning how the users application may operate with sound in
    the Linux environment.


    The program interacts with a sound card using specific software interfaces; each
    of basically includes the kernel and the user parts. A user parts tasks to the
    specific kernel driver. The configuration of the kernel part of a sound interface
    depends on the sound system used in Linux. We will consider in brief of the most
    popular sound systems: OSS (Open Sound System) and ALSA (Advanced Linux Sound
    Architecture).


    The Open Sound System is based on using standard UNIX devices which are accessed
    through standard-POSIX API calls such as read, write, ioctl, etc. OSS aims to
    write sound-based applications that work with any sound control hardware, though
    the hardware interface varies greatly from one to another. This sound system is
    deprecated because it doesn''t allow low-level sound processing and configuring.
    Nowadays some modern distributions of Linux have limited support for OSS, preferring
    to use the ALSA sound system. Nevertheless, the OSS sound system is still used
    because of its simplicity and clarity in the cases when the developer needs to
    operate with only basic POSIX API calls. OSS may with dev/mixer, /dev/sndstat
    /dev/dsp, /dev/audio, /dev/sequencer and /dev/music devices.


    Let''s discuss OSS first. Once we deal with the given sound system we must know
    what OSS device are presented and configured in the Linux system.


    First of all we have to confirm that Linux discovered our sound card and properly
    configured it. The common way to check the presence of the device is to examine
    a /dev/sndstat device that is the simplest provided by the sound driver. This
    is a read-only file which contains reports'
