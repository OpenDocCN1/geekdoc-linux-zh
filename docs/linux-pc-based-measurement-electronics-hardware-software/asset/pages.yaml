    # Using MATLAB in home projects


    This section will be dedicated to making use of the popular and powerful development
    tool called MATLAB®. This application is widely used for building various embedded
    systems for home and laboratories. As you may know, MATLAB is used for maths and
    computation, in development of multiple data acquisition systems, for modeling,
    simulation and prototyping. Other uses include scientific and engineering graphics,
    application development with a graphical user interface. MATLAB is an interactive
    system that allows you to solve many technical problems providing C language tools.
    It is not the intention of this book to provide a detailed description of all
    capabilities of MATLAB. We will see how to apply MATLAB for embedded projects
    where a serial interface is used. The advantage of using such a powerful tool
    as MATLAB in an embedded design is that you need only build your hardware and
    provide an interface to your device, while other tasks including data processing,
    maths and visualization of end results will be easily realized inside the MATLAB
    environment.


    To operate with MATLAB you should have some experience in programming in this
    development environment. For my experiments I used the R2009b Linux version of
    this product, although older versions set as well. Detailed instructions on how
    to configure your MATLAB in Linux may be found on sites relating to Linux and
    MATLAB.


    Let''s see how to program data transfer via a serial interface using MATLAB. Consider
    the general scheme where we have the external device (this may be some measurement
    device, microcontroller based data acquisition system, etc.) attached to the serial
    port and controlled by MATLAB. The most common case is when your application sends
    some command to the external device and receives an answer. Let’s go to a practical
    example. Our embedded system will contain a simple 8051 family microcontroller
    development board (I personally used 8052 board from Rigel Corp.) attached to
    the serial interface /dev/tty0 (Fig.3.27).


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_122_0.png)'
