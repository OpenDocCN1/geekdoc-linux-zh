    The TCP server is implemented as a high-performance server based on pre-forking.
    This means, that the server creates a number of child processes starting up, each
    of them services the separate client request. This allows handling of new clients
    with minimal delays and provides more performance for multiple clients. With such
    a TCP server hardware may be handled simultaneously from several remote devices
    (PCs, mobile phones, etc.) without loss of performance. Pre-forking is widely
    used when designing high-performance server applications. For instance, the popular
    Web server Apache has been developed using this programming technique.'
