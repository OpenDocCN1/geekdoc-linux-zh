  md: '# Preface


    Nowadays personal computers have become an integral part of our life. You probably
    realized that PC technology (known as ''embedded PCs'') has been adopted into
    many systems for automation and control in laboratories and industry. Possessing
    the advanced computational capabilities of a modern computer, and under the control
    of a lean, fast operating system such as Linux, these systems can readily assemble
    measurements from complex physical quantities, control equipment or provide data
    acquisition and analysis. PC technology extends further, into communication systems,
    home automation and so on.


    This book is written for both hardware and software hobbyists and developers who
    would like to learn how to use a personal computer as a centre in embedded projects;
    thus, designing and building various measurement and control systems to be controlled
    by their desktop or laptop PC running a Linux operating system. The PC''s present,
    base peripherals (serial/parallel ports and sound card) are already well suited
    for many measurement and control systems. PC hardware provides a convenient interface
    for appliances to measure temperature, humidity, pressure, light or other physical
    quantities. Additionally, PC peripherals can be used to trigger motors, relays,
    lamps and other loads depending on predetermined conditions. By combining specific
    input and output signals travelling through PC peripheral devices a developer
    can quickly build embedded systems implementing even complex tasks.


    Designing embedded systems involves both hardware and software. As the electronics
    and programming are often regarded as separate areas of engineering that almost
    never cross, you might otherwise assume that working with both hardware and software
    is an extremely difficult task. This book makes the task quite manageable.


    Linux has been chosen as the operating environment for all of the projects. You
    will need to be already relatively comfortable or, at least, keen inquiring in
    a Linux environment and, as such, must be familiar with basic shell commands.


    The software part of the embedded projects described herein is written in C. You,
    ideally, have some knowledge of programming in this language. On the other hand,
    you don''t need to be a guru in C programming - all programs from this book are
    very simple and clear, so keen beginners will easily understand the source code.
    I also assume that you have at least a rudimentary understanding of local area
    networks and the Internet - which will help in your understanding of how some
    of the distributed applications work.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Most embedded projects described in this book deal with some straightforward
    electronic circuits connected to the PC. Those circuits must be built manually,
    so some experience in assembling and testing simple electronic devices will be
    useful. Luckily, assembling and testing of the circuits presented here will not
    require an in-depth knowledge of electronics or module functionality - you only
    need to interface the prescribed circuitry to the PC. However, if you wish to
    develop circuits for yourself, the relevant timing diagrams are described in detail.
    All of my circuits have been built and tested using low-cost and widely used electronic
    components; allowing you to design simple, yet effective electronic devices.


    You will see that it is possible to build your own complete PC-based embedded
    systems using simple low cost (or zero cost) software tools and low-cost electronic
    chips. I hope that this book encourages you in your own future designs.'
