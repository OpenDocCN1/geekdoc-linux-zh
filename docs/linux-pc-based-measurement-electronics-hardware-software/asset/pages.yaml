  md: '# PC peripherals in embedded projects


    analog and digital circuits, so we need to use RS-232-to-TTL converter which,
    in our projects, will be realized by an industry standard driver/receiver chip
    from Maxim Inc., the MAX232. We will consider various projects including digitizing
    systems for analog sensors, systems that control temperature and humidity. All
    this will be discussed in detail in Chapter 3 "Home projects with a serial port".


    Last in the list of peripherals which we want to discuss is a sound card. Usually
    the sound card comes as a built-in device on the motherboard, although you can
    still acquire stand-alone modules for various experiments. We use a sound card
    in embedded projects when we need to generate various signals going to external
    circuits and/or capturing signals from external sources for further processing.
    There are a lot of applications called "software oscilloscopes" that implement
    these tasks, most sound cards can reliably process relatively low frequencies,
    usually 20-40 KHz. However, such oscilloscopes are in handy as a cheap alternative
    to professional devices, especially when we need to measure low frequency signals.
    Programming sound cards in Linux is a complex task enough, so we will discuss
    how to design our home sound laboratory using free software and a popular application,
    Matlab/Simulink by The MathWorks, Inc. The latter is not completely free, though
    you can use a low-cost Student Edition for building your home or laboratory applications.
    We will discuss a sound card in embedded projects in Chapter 4 "Sound card in
    home projects".


    # Software development


    All the projects from this book require control software. The control applications
    used were developed. Developed using a standard and free gcc compiler, which the
    "GNU C compiler". The latest version of gcc applied to the development was 4.3.4,
    though earlier versions can be used as well. Writing applications in gcc requires
    some basic skills in C programming, so I expect that you are familiar at least
    with the basics of C.


    The C language has many great advantages over other popular tools, such as Java,
    Python, etc. Languages like Java and Python shield the programmer from having
    to worry about memory allocation and pointers. This is usually a good thing, since
    operations with memory are error-prone when building a high-level program. On
    the other hand, when dealing with low level code as the part of the operating
    system that controls a device, C provides a uniform, clean interface for using
    a group of special functions (we will discuss this in this chapter).


    The Java, Python and PHP languages are widely used for writing high-level applications
    having graphical user interfaces (GUI) having numerous extended capabilities,
    but all these tools are inappropriate for low-level operations.


    Implementing the control over hardware within, say, a Java or Python application
    is essentially a complex task and requires special external modules (for example,
    pySerial or pyParallel in Python) being developed for accessing hardware registers.
    That doesn''t simplify the task as much'
