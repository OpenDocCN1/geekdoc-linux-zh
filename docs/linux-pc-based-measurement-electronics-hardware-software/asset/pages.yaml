  md: 'You may develop another configuration for your own output stage by using, for
    instance, a single transistor TIP127 driven directly from pin 8 of LM567C as well.

    If you want to drive some AC load you can apply, for example, an optotriac (MOC3023,
    3061, 3063, etc.) with its LED connected to the collector of Q1 through a resistor.
    In this configuration the R3 resistor and LED must be connected in series and
    the value of R3 must be recalculated so, that an optotriac''s LED will be turned
    on when Q1 is open. Naturally, you will not need the stage with the POWER MOSFET
    Q2 anymore. You may also substitute for the LM567C chip using LM567 or NE567.

    Below (Fig.4.6) you can see my assembled circuit. As an external load I used a
    PC''s 12V fan connected to the drain of the POWER MOSFET IRF510. Also I took a
    control signal from the single channel of a sound card (you may apply both audio
    channels if driving two loads at a time, but this also requires two tone-decoders).


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_164_0.png)


    Fig.4.6'
