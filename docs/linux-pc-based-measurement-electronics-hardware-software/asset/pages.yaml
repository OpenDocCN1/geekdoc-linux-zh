  md: '# Chapter 5. Network and wireless systems for home and laboratory


    Let''s see what happens on the receiver part of our system. Once captured by the
    receiver, the signal is demodulated, so we can hear a "pure" audio signal of 1000
    or 2000Hz from the speaker. As we don''t need acoustics, we must convert the generic
    signal so it can drive our motor or relay. The simple way to do that is to pick
    the signal out of the audio amplifier stage of the receiver, but prior to the
    speaker and redirect it to a bandpass filter. The bandpass filter, in turn, has
    to pass only signals whose frequency falls into its pass band and attenuate signals
    beyond the pass band.


    As we use 1000Hz and 2000Hz signals, we must apply two bandpass filters at the
    output of the audio amplifier stage of the FM receiver. Depending on where the
    audio signal is taken, it might be necessary to amplify it before delivering to
    the control circuit. In that case we can introduce an amplification stage before
    the bandpass filter or we can provide the signal gain within the bandpass filter
    itself.


    As we have formed an analog signal, we must convert it into digital that will
    switch on/off our load. Additionally, if our load consumes a high power, we might
    need an additional buffer driving such a load.


    Let''s go to the practice and see how our RC system may be implemented in "real
    life". We will design a single control channel operating at a frequency of 1000Hz
    – you can easily recalculate the system for operation with other frequencies.
    We will begin our discussion with the receiver part. First of all, we need to
    grab the audio signal obtained by the receiver. The best point to do that is the
    output of an audio amplifier of FM receiver. This is where the signal goes straight
    to the speaker, usually through a capacitor as shown in Fig. 5.27:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_255_0.png)


    254'
