  md: '# Digitally controlled DC voltage source


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_54_0.png)


    Fig.2.19


    As you can see, the voltage divider consists of PA0–PW0 and PW0–PB0 resistors.
    In the case of the MCP41010, the full resistance between the PA0 and PB0 nodes
    is 10K. The resistance of each “resistor” of this voltage divider may be calculated
    according to the following formulas:


    ```

    $R_{TA}(Dn) = (R_{AB}) \times (256 - Dn) / 256 + R_W$

    $R_{WB}(Dn) = (R_{AB}) \times (Dn) / 256 + R_W$

    ```


    where $R_{TA}$ is a resistance between the Terminal PA0 and the wiper (Fig.2.19),
    $R_{WB}$ is a resistance between the Terminal PB0 and the wiper, $R_W$ is a wiper
    resistance, $R_{AB}$ is the overall resistance for particular potentiometer (10K,
    in our case) and $Dn$ is the digital equivalent of an 8-bit binary code that determines
    the output voltage of the potentiometer. In our project we ignore the resistance
    because it is very low, for very precision circuits this value should be considered.
    When the device is first powered on, the data registers will be set to mid-scale
    (0x80). Let’s discuss how to program the MCP41010 chip. In order to provide an
    appropriate output voltage from the device we need to write a 16-bit value into
    the data register of the chip; the timing diagram shows how to configure the digital
    potentiometer (Fig.2.20):


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_54_1.png)


    Fig.2.20


    As you can see, the 16-bit code consists of command and data bytes. while the
    data byte will be the digital code (Dn) for the output voltage. For more detail
    you can explore the appropriate datasheet where there is a lot of information
    about configuring the device.'
