  md: '# Chapter 5. Network and wireless systems for home and laboratory


    So far we discussed nowadays embedded projects working locally on your desktop
    or laptop. But often nowadays you may also wish to control your hardware or get
    data from some remote place. This may be required when, for example, you want
    to operate your system at home from your workplace or vice versa.. In these cases
    you need to build some distributed system consisting of some relatively independent
    parts (subsystems) where each may function on a standalone PC. You might also
    wish to modify an embedded project already built so that it would be possible
    to pass data to another application, such as MySQL, OpenOffice or a text editor
    running on the same machine or somewhere on the Internet. Putting your local application
    in some distributed environment may provide new facilities for your system. For
    example, you may arrange your distributed system so that one application would
    execute high-level operations such as visualization of results and/or providing
    a nice graphical user interface. The above examples illustrate just a few numerous
    situations where you might start thinking about building a distributed system.
    This chapter will help you in understanding many aspects of designing distributed
    systems in Linux.


    In general, there are some common methods for developing distributed systems in
    Linux – we will discuss two of them at the beginning of this chapter with the
    remainder dedicated to the practical aspects of designing distributed systems.
    The methods herein are based on using networking features of Linux. These common
    features are TCP/IP and local sockets that underlie networking.


    Now, when referring to the “distributed application” we will mean the “network
    application” and vice-versa., Making distributed systems requires a lot of network
    programming and knowledge of, at least, the basic concepts of development of network
    applications. The key term in network programming is “socket”, so we will consider
    it in detail before detailing our application. The term “socket” may be regarded
    as an “address” or “endpoint” assigned to a network application. The TCP/IP socket
    is determined by two basic parameters, IP-address and port. Two network applications
    may interact with each other only via sockets.


    The IP-address identifies a PC on the network and should be unique for the particular
    network. The port is a number which when coupled with the IP-address identifying
    the socket for the particular network application. This is a very simplified description,
    but in spite of this it help make make things clearer. An interaction between
    two network applications may be illustrated by Fig.5.1.'
