    As the IP loopback address 127.0.0.1 in Linux is associated with the name “localhost”,
    we can use this name in network commands. The first command taken with a -l parameter
    displays the state of the listening socket waiting for requests. The second netstat
    command typed without parameters excites the active connections to the server.
    We can see that there were three active connections opened on ports 36213, 36214
    and 36212. Each of these ports was allocated dynamically by the system after a
    new working connection had been accepted. The netstat command has a lot of other
    parameters which provide you with more various and useful information concerning
    network activity – you may view Linux documentation for further details.


