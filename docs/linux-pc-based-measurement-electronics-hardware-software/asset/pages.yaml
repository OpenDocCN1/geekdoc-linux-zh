  md: 'First of all, let''s examine the variables used. The binData variable collects
    the binary code by bit. After the last iteration has been completed this value
    will hold a binary code representing the actual analog signal. The total variable
    of a double type holds the final value of the analog voltage; this value will
    be output onto the screen by the printf() function. Look at the following statement:


    ```

    total = 5.08 / 4096 * binData;

    ```


    Here the constant of 5.08 is equal to the reference voltage (in volts) applied
    to pin 1 of the MCP3201 converter. This reference voltage comes from my specific
    power source; maybe you will use another value of reference voltage for your own
    circuit. The value of the reference voltage divided by 4096 (2¹²) gives the size
    (in volts) of the LSB of the converter. In our case this value will be 5.08 /
    4096 = 0.00124V (1.224mV). The program multiplies the binary code held in binData
    by the LSB and saves the final value of the input voltage in the total variable.


    The dataStatusPort variable holds a bit captured from the bit stream output by
    the ADC. The value is used when the program writes a particular data bit into
    the appropriate position in the binData variable.

    The control application implements the timing diagram of the conversion inside
    of the for() loop. Since the full conversion process requires 15 iterations, the
    program sequentially reads 15 bits. Only the first 12 lowest order bits are of
    interest to us, therefore we throw away a higher 3 bits by executing the statement


    ```

    binData = binData & 0FFF;

    ```


    After typing the source code we can save it in the ADC.c file and compile the
    source by using the command:


    ```

    $ gcc -o ADC.c

    ```


    To launch the application we would enter:


    ```

    $ sudo ./ADC

    ```


    The projects discussed may be used as templates for designing more complex systems.
    Now it is time to discuss analog conditioning circuits.'
