  md: '# DEVICE 1 DEVICE 2


    DB9 DB9


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_80_0.png)


    Fig.3.2


    The TD pin of DEVICE 1 is connected to the RD pin of DEVICE 2 and TD of DEVICE
    2 is attached to the RD pin of DEVICE 1. This configuration allows bidirectional
    data flow between both devices with minimal wiring. Such an interface is frequently
    used when transferring data between PCs and microcontrollers. The only requirement
    for this configuration is that both devices should operate at the same frequencies.


    From a first point of view it seems that the developer can''t squeeze anything
    else from SIN/SOUT signals besides their basic functions, but we will see how
    these data transfer lines may be successfully applied to control embedded devices.


    Besides data the serial interface comprises more signal lines known as control
    lines. We can use two output lines (RTS, DTS) and two input lines (CTS and DTS)
    in an embedded design. All those signals were initially introduced for synchronization
    (“handshaking”) of data transfer, but may come in handy when designing miscellaneous
    embedded projects. Let''s see how to operate with these signals in our control
    devices.


    Each time we want to manipulate one of the RTS, DTS, CTS or DTS signals we need
    to access two hardware registers, Modem Control Register (MCR) and Modem Status
    Register (MSR). The MCR register (port) contains bits with which the program can
    set/clear RTS (Request-To-Send) and DTS (Data-Terminal-Ready) signals. MCR has
    the address that is calculated as “base + 4”. For the standard UART where the
    base address is 0x38 the MCR will have the address 03FC. The MCR port is for reading/writing
    operations. The RTS line may be placed in active state (low voltage level) by
    setting bit 1 of the MCR. Again, deactivating the RTS (raising a voltage level)
    occurs after bit 1 has been cleared. As we can see, the level of the RTS signal
    will be inverted in relation to the state of the RTS in MCR.


