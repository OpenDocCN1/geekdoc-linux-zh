    Beside that we must short pins 3, 12 and 13 of the A2 inverter (see Fig.3.15).

    With these four lines RTS, DTR, CTS and DSR we can build a variety of control
    and measurement systems. By using one control (output) line (RTS or DTR) and one
    status (input) line (CTS or DSR) we can build simple conditioning systems to keep
    some physical parameter (temperature, humidity, pressure, etc.) within a predefined
    range.


    # Simple thermostat system


    This project describes a simple thermostat system using the LM35DZ temperature
    sensor which controls the heater of an oven. The schematic circuit for the given
    system is shown in Fig.3.16.


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_100_0.png)


    Fig.3.16


    A similar circuit was discussed when we were building the serial port lines RTS
    and CTS instead of parallel port. But this circuit uses the drive the oven by
    switching on/off the heater, while CTS checks the temperature threshold point.
    Below is provided a C source code for this project (Listing 3.5).


