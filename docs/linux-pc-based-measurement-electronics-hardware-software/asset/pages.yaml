    # Processing input analog signals


    This next project illustrates how to measure an analog signal represented as a
    time continuous voltage. Usually we deal with analog signals when measuring some
    physical quantities (temperature, light, pressure, etc.) using analog sensors.
    The hardware part of this project includes a 12-bit successive approximation (SAR)
    analog-to-digital converter, type MCP3201, wired to the PC port via an SPI-compatible
    interface (Fig.3.22):


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_111_0.png)


    Fig.3.22


    The SPI interface involves three signal lines, CS, CLK and Dout. Analog-to-digital
    conversion (ADC) and data transfer are controlled via those lines by the program
    running on the PC. The analog input signal in the range of 0 --+5V enters the
    input (pin 2) of the MCP3201 chip. The CS control lines frames the conversion
    process and must be low while the conversion is in progress. The pro-'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'gram controls this line via the DTR bit of the MCR (pin 4 of the DB–9 connector).
    The output bit appears on the Dout pin connected to the CLK line (pin 8 of the
    DB–9 connector).


    The software reads each bit of this bit stream (MSB first) and saves it into an
    integer variable. After all data bits have been captured the application takes
    the lowest order 12 bits which represent the original analog signal. The clock
    pulses synchronizing the data transfer are on the CLK pin connected to RTS. The
    ADC yields each bit on Dout on the falling edge of CLK; bit should be latched
    by the control application on a rising edge of the clock pulse. To complete the
    conversion process the control program must then raise the CS line.

    A full conversion process is represented by the timing diagram shown in Fig.3.23:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_112_0.png)


    Fig.3.23


    Note, the MSB bit first appears on the Dout line after the 3rd CLK pulse has gone
    low. As you can see, a full conversion cycle takes 15 CLK pulses, while a data
    transfer requires 12 cycles. The circuit should be powered from a +5V ‘noiseless’
    power supply. The bypass capacitor, 10 uF, should be placed as close as possible
    to the power pin of the MCP3201 chip. If desired, the MCP3201 may be replaced
    with a similar alternative successive approximation ADC having an SPI-compatible
    interface. For instance, you may use a LTC1286 or LTC1297 device (Linear Tech.),
    etc. In this case you need to reconsider all circuit connections and modify the
    source code according to the timing diagram of your device selected.


