  md: '# Chapter 2. Parallel port in the home design


    The other advantage of I²C is that it allows multiple devices to be attached to
    the same bus. This feature greatly expands the capabilities of PC-based measurement
    systems where many devices need to be controlled. The simplified diagram of an
    I²C bus with three devices attached is shown in Fig.2.29:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_71_0.png)


    Fig.2.29


    Communications over an I²C bus require two wires SCL and SDA. The SCL line is
    used to synchronize all data transfers via the I²C bus, while SDA is the data
    line. All devices on the I²C bus are connected to the SCL and SDA lines. Additionally,
    all devices must be attached to a third wire that is "ground" or "common wire"
    for a given circuitry. SCL and SDA operate as "open collector" or "open drain"
    signal lines, so we need two pull-up resistors between +5V power supply and the
    signal lines. Note, that the I²C bus requires only two pull-up resistors, regardless
    of the number of devices attached. The "open collector" configuration allows driving
    of the line only when the device''s output becomes low. The value of the resistors
    may vary from about 2KΩ to 30–40 KO. Greater values tend to slow the performance
    of the bus. The common value for pull-up resistors is 4.7K. Let''s see how devices
    communicate on the I²C bus.'
