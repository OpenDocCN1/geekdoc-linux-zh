    \ probe of a multimeter (set as a volt meter) to pin 7 (RTS line) of the DB-9\
    \ connector and the second probe to pin 5. After the program has started you will\
    \ see the voltage swing in the range of 0V to +5V on pin 3 of the 74HC132 inverter.\
    \ This is a means by which we can also test the DTR output – in this case we must\
    \ change the initial value of the bRead variable (see Listing 3.3) from 0x2 to\
