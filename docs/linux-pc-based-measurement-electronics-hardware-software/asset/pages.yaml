    The total variable of a double type holds the final value of the input analog
    voltage; the printf () outputs this value after the following calculation has
    been processed:


    total = 5.00 / 4096 * binData;


    Here the constant of 0.05 denotes the reference voltage (in volts) applied to
    pin 1 of the MCP3201 converter. Usually, this reference varies around 5.00V, so
    you must type an exact value in the above statement. A higher accuracy of analog-to-digital
    conversion is achieved by using a precision voltage reference; in that case the
    accuracy of the voltage reference determines the overall accuracy of a given circuit.

    The value of the reference voltage divided by 4096 (2^12) gives a size (in volts)
    of the LSB of the converter. In this case value will be 5.00/4096 = 0.00122V (1.22mV).
