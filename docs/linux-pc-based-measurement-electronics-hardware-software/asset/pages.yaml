    # Designing distributed applications with MATLAB


    This section is dedicated to making distributed applications using MATLAB. As
    an advanced scientific and engineering tool, MATLAB provides support for networking
    with TCP and UDP protocols. We will consider the basic principles of designing
    TCP/IP based distributed applications in the MATLAB environment. If you experiment
    with networking in MATLAB you may notice that designing network applications in
    that environment is simple and straightforward. This is because MATLAB operates
    with high-level library functions especially developed to simplify network programming.
    On the other hand, it is difficult to provide full functionality and high flexibility
    using the MATLAB network functions, as could be achieved when writing network
    applications, in C or Python. Nevertheless, many times it would be wise to use
    MATLAB network features for data transfer between applications and interaction
    applications with each other.

    Being a powerful engineering and scientific tool, MATLAB is often configured as
    a network client.


    When we start building a network client application in MATLAB, we first need to
    create a TCP/IP object using the tcpip() function. This function takes two arguments,
    the name of the remote host and a remote port value. If port is 80 the tcpip()
    function may take a single argument that is the name of the remote host. In our
    projects we will configure some common parameters of a TCP/IP object created by
    tcpip(). If you want to know more about setting parameters for TCP/IP objects,
    you may refer to the "Configuring Properties During Object Creation" section of
    the MATLAB help. You can also find lots of useful information on numerous MATLAB
    forums on the Internet.'
