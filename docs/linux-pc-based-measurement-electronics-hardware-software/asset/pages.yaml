  md: '# Chapter 3. Home projects with a serial port


    This serial continues the discussion concerning home project designs. Here we
    will see how to build various embedded systems using a serial port (interface)
    of the PC. The serial interface that is also known as RS-232 is a standard interface
    used for data transfer between various devices, such as modems, PCs and communication
    devices. Many developers and hobbyists are familiar with the primary function
    of RS-232 . However, serial interfacing may be successfully applied in designing
    embedded projects to perform various data acquisition and control functions. Many
    such projects can use the serial port protocol - together with data transfer systems
    - allows building and integration of home or laboratory embedded systems with
    complex post-processing data processing algorithms.


    Since we are going to discuss the serial port hardware and software, you should
    make yourself familiar at RS-232 basics. We will not discuss RS-232 in detail;
    we will cover the practical aspects of using RS-232 features in real projects.
    The great capabilities for data processing are provided by the popular MATLAB®
    development environment from The Mathworks, Using MATLAB developers, researchers
    and hobbyists can realize many complex projects, including the design of embedded
    systems based using PC peripherals (serial port, sound card, etc.). We will consider
    serial port based examples developed especially to work in the MATLAB environment.


    # Serial port basics


    The heart of the serial interface is a special register-based digital circuit
    called a UART. The term "UART" stands for Universal Asynchronous Receiver / Transmitter.
    Most motherboards used in desktop PCs and notebooks have UARTs integrated in their
    chipsets and similarly expansion cards often have a built-in serial interface.
    Despite the variety of practical realizations of serial interfaces most of them
    use modern UARTs compatible with a classic 8250 UART device. The most popular
    and widely used derivatives on the market are 1650/650/750/etc. chips. All of
    these share backward compatibility and have common basic hardware registers and
    signal lines which will be useful for our home projects.


    Although modern UARTs are complicated devices with complex architectures, their
    operation is simple enough from the developer''s point of view. When dealing with
    a UART, we should be aware of two things:


    +   - How to program it. Being a modern device, a UART is configured and controlled
    using some hardware registers (ports), so we can gain full control over our UART
    by accessing its hardware registers programmatically;'
