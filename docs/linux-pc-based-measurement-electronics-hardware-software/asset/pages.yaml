  md: "# Chapter 3. Home projects with a serial port\n\n# Pressure measurement with\
    \ the MPX4115 sensor\n\nAs the sensitive element for our pressure measurement\
    \ system we will apply the MPX4115A-pressure sensor. It was designed to sense\
    \ absolute air pressure in altimeter or barometer applications. This BAP sensor\
    \ integrates an on-chip, bipolar op-amp circuitry and thin resistor networks to\
    \ provide a high level analog output signal and temperature compensation. The\
    \ MPX4115A allows pressure measurements from 15 to 115 kPa (2.2 to 16.7 psi) that\
    \ corresponds to the output voltage 0.2 through 4.8V. As you can see, the transfer\
    \ function shown in Fig.3.24 has high linearity.\n\n![](img/c0e2a8f44eadc53b4372ff3151186ecc_115_0.png)\n\
    \nFig.3.24\n\nThe MPX4115A sensor provides the output voltage V_{OUT} that may\
    \ be calculated as:\n\n$V_{OUT} = V_s \\times (P \\times 0.009 - 0.095) \\pm (\t\
    ext{Pressure Error} \\times \\text{Temp.Factor} \\times 0.009 \\times V_s)$\n\n\
    where $V_s = 5.1V \\pm 0.25V$.\nWhen the measurements are taken in a temperature\
    \ range of $0^{\\circ}\\mathrm{C} - 85^{\\circ}\\mathrm{C}$, the Temp.Factor is\
    \ unity. Pressure measurement yields a pressure error equal to $\\pm3.45$kPa in\
    \ the range of 20 to 250 kPa. To simplify calculations lets ignore the possible\
    \ but minimal errors in a given project, thus the above formula can be rewritten\
    \ as follows:\n\n$V_{OUT} = V_s \\times (P \\times 0.009 - 0.095)$\n\nFrom this\
    \ equation we may found out the pressure P:\n\n$P = (V_{OUT} / V_s + 0.095)$"
