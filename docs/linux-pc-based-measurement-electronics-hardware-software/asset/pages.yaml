    # Table 3.1. Serial Port Control Pin Properties


    | Property Name | Description |

    |---|---|

    | RequestToSend | Specify the state of the RTS signal |

    | DataTerminalReady | Specify the state of the DTR signal |

    | PinStatus | Indicates the state of CD, CTS, DSR and RI lines |


