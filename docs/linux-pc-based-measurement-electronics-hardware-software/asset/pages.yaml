  md: '# # Chapter 4. Sound card in home projects


    This chapter describes using a sound card of a PC in your home and laboratory
    projects. Most applications dealing with a sound card usually perform sound recording
    and playback. Some advanced applications can also process audio signals, changing
    their parameters. We will discuss another use of sound cards when the audio output
    signals actually control external circuits. Before going to real projects recall
    in brief some basics concerning a sound card.


    Many times a sound card comes as a built-in device port. there are many professional
    sound cards implemented as separate standalone modules. These modules are usually
    praised in high-quality audio processing and may include additional specialized
    inputs/outputs beyond standard (typical) sound cards. All sound cards provide
    the basic interfaces as shown in Fig.4.1:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_140_0.png)


    Fig.4.1


    Many times the sound card interfaces (ports) are denoted as "Line In", "Mic In"
    and "Line Out", although you can find other designations as well. The **Line In**
    port allows listening to or recording from external devices such as digital audio
    players, microphone preamplifiers or other sources of audio signals. This port
    can process relatively powerful signals which have sufficient magnitude for direct
    processing. Another port of a sound card is the microphone (**Mic In**). This
    interface is intended for capturing relatively weak signals arriving directly
    from microphones or, for example, FM receivers. Sometimes the microphone input
    may be used to capture signals from special sensors, such as pulse or vibration
    detectors used in medicine, physics and biology. The common use of this input
    may be recording notes, lectures, daily personal logs, audio blogs or podcasts.
    The **Line Out** port provides a preamplified audio signal that is ready for playing
    via speakers or may be directed to other devices for further processing.'
  merge: -1
