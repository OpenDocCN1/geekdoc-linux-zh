  md: '# Using the I2C interface


    Each device on the I2C bus can be either "master" or "slave". The "master" controls
    the bus by driving the SCL clock line. Other devices are "slaves" respond to the
    "master". When working as the "master", a device can initiate a data transfer
    over the I2C bus. Usually, there is only single "master" on the I2C bus and multiple
    slaves. In embedded systems I2C devices and a PC work together, the PC will be
    the "master", while all other devices function as "slaves". Note, both "master"
    and "slave" can transfer data over the I2C bus, though operation is controlled
    by the "master". The simplified timing diagram of the I2C bus is shown in Fig.2.30.


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_72_0.png)


    Fig.2.30


    When working with an I2C bus, we should follow two rules. First, data transfer
    may be initiated only when the bus is not busy. Second, during data transfer,
    the data line must remain stable whenever the SCL clock line is high. Changes
    in the data line while the clock line is high will be interpreted as control signals.
    Thus, each data bit can be clocked only on a rising edge of the SCL pulse. The
    control signals are known as "start sequence" "start condition" and "stop sequence".
    Each transaction with the "slave" begins with the "start sequence" and ends with
    the "stop sequence". Start and stop sequences are initiated by the "master". In
    order to issue the "start sequence" the master lowers the SDA line while the SCL
    remains high (see Fig.2.30).


    The "stop sequence" is generated when the master raises the SDA line from low
    to high while the SCL is high. When data is being transferred, SDA must remain
    stable and not while SCL is high. Various I2C devices may require different transactions,
    so the number of bytes transferred between start and stop sequences is not limited
    and is determined by the "master".'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Chapter 2. Parallel port in the home design


    Nevertheless, each transaction begins with the address byte which must contain
    the address of the “slave” device and the type of operation. Addresses of IC devices
    are either 7 or 10 bits. Most devices use 7 bit addresses that allow attachment
    of up to 128 devices on the IC bus. Besides the 7 bits of the address, the “master”
    sends an 8th bit that indicates the “master” is to / reading from the “slave”;
    if the bit is zero the “master” is writing to the “slave”, a value of “1” in this
    bit indicates that the “master” is reading from the “slave”. The 7 bit address
    takes the higher 7 bits of the byte, while the Read/Write (R/W) bit is the LSB
    (Least Significant Bit) as shown in Fig.2.30.


    Depending upon the state of the R/W bit types of data transfer may be performed.
    When data is transferred from the “master” to the “slave”, the address byte transmitted
    by the “master” contains the “slave’s” address. Next follows a number of data
    bytes. The “slave” returns an acknowledgment after each received byte.

    The second case is when data is transferred from the “slave” to the “master”.
    The address byte, as usual, contains the “slave’s” address. The “slave” also returns
    an acknowledgment bit. Next follows a number of data bytes transmitted by the
    “slave” to the “master”. The “master” returns an acknowledgment bit after all
    bytes has been received. At the end of the last received byte, a “Not Acknowledge”
    bit is returned.


    The IC interface may be successfully applied for interfacing various devices to
    the parallel port as well as for expanding input/output signal lines when dealing
    with numerous digital signals. The following simple project illustrates how to
    expand the number of output lines of the parallel port using the PCF8574A I/O
    expander controlled through the IC bus. Below you can see the circuit (Fig. 2.31):


    This circuit is simple and consists of two chips. The buffer A1 forms TTL.compatible
    signals from the PC’s parallel port to the PCF8574A IC I/O expander is controlled
    via standard SCL and SDA lines. The control signals come from bits 0 of the data
    port of the parallel port. An 8-bit binary code (data byte) then appears on POP7
    pins of the expander. The LEDs attached to it will be triggered depending on the
    binary code received.'
