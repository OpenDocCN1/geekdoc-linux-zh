  md: '# Simple client-server system


    The listen function sets the server socket to listen to incoming requests. The
    TCP server terminated must close the descriptor of the listening socket. The right
    parameter, that is 15, determines the maximum number of working connections processing
    at any time. By now we have finished the configuration of our listening socket.
    The next step is to arrange an endless loop in which our program will process
    the incoming requests from clients. Here, we use the for() loop. The loop begins
    with


    ```

    client = accept(server, 0, 0);

    ```


    statement pauses (blocks) the program until the request from the client is delivered.
    In this case the client variable is assigned the descriptor of a new connection
    just established. Following this all operations will be processed using the client
    socket. After data transfer has completed the connection must be deleted by using
    close() function. All active connections will be closed anyway by the system after
    the program has ended, I recommend you to close all descriptors when you no longer
    need them in your programs. Assuming that the client socket has been created successfully,
    we read data prepared by the client using the recv() library function:


    ```

    bRead = recv(client, buf, sizeof(buf), 0);

    ```


    The bRead variable contains a number of bytes received after recv() returns. If
    this value is not positive, you must handle it in your code. If bRead is greater
    than zero, this means that some data has been received, so we can process it.
    In our case we simply output data onto a screen by calling the printf() library
    function thus creating a null-string. Before outputting we need to place a terminated
    0 after the last byte in the buf variable thus creating a null-terminated string.
    After displaying the string we have to close the working connection (the client):


    ```

    close(client);

    ```


    The above statement completes an iteration, the program goes back to the first
    statement of the for () loop and keeps waiting for a new request. Our TCP server
    application will be ended by pressing Ctrl-C. We need to correctly shutdown our
    server, we have configured an event handler responding to the Ctrl-C occurrence.
    If a user has pressed Ctrl-C, the SIGINT signal arises. To configure the SIGINT
    signal handler we place the following statements:


    ```

    memset(&sa, 0, sizeof(sa));

    s_sa_handler = &sig_handler;

    sigaction(SIGINT, &sa, NULL);

    ```


