  md: '# Recommendations and Conclusion


    We discussed some useful projects achievable by using a standard parallel port
    of the PC and some popular software. All projects will also work with PCI expansion
    boards equipped with the parallel interface as well. When you use an expansion
    board, replace addresses 0x378 and 0x379 with the values assigned to the PCI card
    by your system. When designing projects you should care about proper layout of
    your circuits.\ When laying out circuits for your embedded systems some precautions
    must be implemented. Place bypass capacitors as close as possible to device power
    pins. A bypass capacitor value requirement may vary depending on the chip; therefore
    you must consult a datasheet on any particular part. Digital and analog traces
    should be separated as much as possible on the board, with no traces running underneath
    the device or the bypass capacitor. Extra precautions should be taken to keep
    traces with high-frequency signals (such as clock lines) as far as possible from
    analog traces. Use of an analog ground plane is recommended in order to keep the
    ground potential the same for all devices on the board.'
