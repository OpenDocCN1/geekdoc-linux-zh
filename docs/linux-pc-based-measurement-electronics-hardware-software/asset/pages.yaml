  md: '# Chapter 1. PC in home projects


    Every project in this book, developed for use on a local PC, can be easily fitted
    into a distributed system comprising different computers scattered all over the
    world. We can select various methods for designing such distributed systems, although
    the easiest way is to use TCP/IP network technologies or e-mail. Both approaches
    will be discussed in Chapter 5 “Network and wireless systems for home and laboratory”.


    # PC peripherals in embedded projects


    Embedded projects described in this book are built using parallel/serial ports
    and a sound card. Here we discuss in brief each of these interfaces. The parallel
    port (or parallel interface), being one of the oldest interfaces of the PC, is
    still frequently used in embedded systems for interfacing to external circuitry.
    The standard parallel interface allows you to output (write) data via 8 lines
    and to input (read) data via 5 lines, although we can easily expand the number
    of lines by adding some.


    The parallel port of the PC usually resides on the motherboard for desktop PCs
    and may be accessed via hardware registers (ports). It’s possible to add extra
    parallel interfaces to the PC by using one of the numerous expansion boards. As
    for laptops, you can easily select numerous PCMCIA-to-parallel or USB-to-parallel
    expansion cards to add. Attaching external circuitry to the PC by the parallel
    port is implemented via a DB25 standard connector on the back panel of the PC
    for a built-in interface or via the same connector on the expansion card.

    Embedded projects where a parallel interface is used are discussed in Chapter
    2 “Parallel port in the home design”.


    There will be discussed, for instance, a 12-bit digitizing system, a wide-band
    oscillator working from 1kHz through 68MHz, digital-to-analog converters with
    digital potentiometers and other projects.


    Another popular hardware resource is a serial port (or serial interface). This
    interface is based on the RS-232 standard and is widely used in designing PC-based
    measurement and control systems. The serial interface comes in handy when we want
    to build a low-cost reliable data transfer systems with minimal effort. The serial
    port also serves as a basis for RS-422/RS-485 protocols which are used for building
    distributed systems. With high-performance UART chips it is possible to work at
    921K Baud.


    Many modern PCs are not equipped with the serial port interface, so we need to
    acquire one from the numerous expansion boards containing two or more serial ports.

    The heart of the serial port is the UART (Universal Asynchronous Receiver/Transmitter)
    that provides all the signals required for the RS-232 interface. The UART is completely
    controlled via hardware registers of the PC, so we can configure this interface
    and triggering signals. The PC’s serial interface provides standard RS-232 levels
    of signals that are not compatible with single supply


    14'
