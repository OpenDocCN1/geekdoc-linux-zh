  md: '# Writing byte to the parallel port


    Our TCP server works with a listening port 1991 waiting for incoming requests
    from the client started in MATLAB. To gain access to our hardware from the server
    we need to introduce two functions, iopl() and outb() for accessing address 0x378.
    Recall, iopl() function takes a single parameter that determines a level of privileges
    we set this parameter to 3. The outb() function will write the byte received from
    the TCP client to the data port. The main job is achieved by the following sequence
    of code:


    ```

    client = accept(server, 0, 0);

    bRead = recv(client, &bRead, sizeof(char), 0);

    if (bRead > 0)

    outb(bVal, 0x378)

    close(client);

    ```


    If the client request has been accepted the server creates a working connection
    (the client socket) and takes the byte by the TCP client using the recv() call.
    This byte will be temporarily held in the bVal variable before writing to the
    data port. It is worthwhile to know if something was received, so we check the
    condition bRead > 0. If the data set is available we can write its value to the
    data port using the outb(bVal, 0x378) statement. After we close the working connection
    by the close(client) call. The MATLAB command sequence takes just several statements
    shown in Listing 5.17


