  md: '# Home wireless systems


    In the previous section we discussed distributed systems based on using some popular
    network protocols. Nevertheless, there is another way to design distributed systems
    – by using wireless tech-nologies. It may at first seem too complicated to design
    such a sort of distributed system, especially for inexperienced readers, but,
    luckily for us we can easily apply already proven and ready-to-use devices which
    we slightly modify for our needs.


    First, let''s imagine the simplest wireless systems work. Everywhere in this section,
    when discussing wireless systems we will mean operating at radio frequencies (RF)
    of about 300 MHz or higher. Usually the simplest wireless system provides a unidirectional
    data transfer from an RF transmitter to RF receiver, although there are many systems
    capable of implementing a bidire-ction flow. To pass the useful signal using RF
    we must apply some kind of modulation that allows placing our data into a RF carrier
    frequency. The most popular type of modulation used in relevant wireless devices
    is “Frequency Modulation” (FM) which changes the carrier frequency over a narrow
    band by changes in amplitude of the modulating signal. Many times you can see
    the abbreviation “FM transmitter” or “FM receiver” indicating that FM modulation
    is applied to the particular transmitter/receiver.


    As a basis for building our wireless projects – and to show how simple it can
    be -we use a low-cost, ready-to-use wireless doorbell. That device may be easily
    found everywhere on the marketplace. The typical wireless doorbell consists of
    two modules, an FM transmitter and FM receiver. The FM transmitter module passes
    the signal each time a user presses the call button on its front panel. At this
    moment power supply connects to the RF oscillator which beams the signal modulated
    by a lower frequency, usually 32 KHz, over a distance of about 30–50m. This signal
    may be captured by the FM receiver module located inside distance from the transmitter.
    Once the signal from the transmitter has been detected, the receiver yields a
    sound or some melody going to a built-in speaker.


    So, how could we adapt our doorbell to operate as a control system handled by
    a PC’s soft-ware? There are several ways to achieve that. We might replace, for
    example, the mechanical button in the FM transmitter with an electronic switch
    controlled by software running on the PC – this allows switching on/off the load
    (relay, motor, valve, etc.) attached to the FM receiver. It is also poss-ible
    to attach some sensor connected via some conditioning circuit (a comparator, for
    example) to the FM transmitter. The conditioning circuit may control the FM transmitter,
    so the program running on the remote PC will know of some physical parameter (temperature,
    pressure, etc.).


    In spite of a variety of wireless doorbells most of them actually operate in a
    similar manner. Each device is activated by pressing a user button which connects
    the power supply (9– 12 V battery) to'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Home wireless systems


    the FM transmitter circuit. Being pressed for a short time the button causes a
    radio signal transmission to the FM receiver. Upon receiving the FM signal the
    receiver enables a sound synthesizer chip to provide some sound signal or melody
    that goes to a speaker. When released, the cuts off the power feeding the FM transmitter,
    so the transmission ends. Connecting the mechanical switch to the power circuit
    of the transmitter prevents current from flowing when not in use and thereby prolongs
    the battery life. We can control the FM transmitter electronically by replacing
    the mechanical button with some electronic circuit handled by software.


    Another common feature that can be applied to home projects from the FM receiver
    circuit. As was mentioned above, upon receiving a signal from the FM transmitter
    the receiver enables a sound synthesizer chip generates some sound. The sound
    chip provides a relatively powerful signal that can directly drive a low-impedance
    load as a speaker. We may exploit this signal and redirect it to our control circuit
    that drives some load. In this way we can use the sound signal to turn/off actuators,
    relays, valves, etc.


    So, let''s go to the practice. Our first project will be a simple but effective
    wireless security system with a Passive Infrared Sensor (PIR-detector or PIR-sensor).
    Recall, that we have already built a simple security system using the PIR-detector
    circuit attached to the serial interface. Now we want to design a wireless variant
    of the security system with this same sensor.


    As you will recall, the PIR-detector tracks a (human body heat) movement and issues
    a signal which may be further processed in some appropriate way. In our system
    the signal generated by the PIR-detector switches on the FM transmitter, which
    in turn, beams the FM signal to the remote receiver. The sound chip is enabled
    and the sound output signal sends to a circuit that converts sound into a TTL-compatible
    signal. This signal arrives at an input of the parallel interface which is monitored
    by software. The program checks to see if the voltage level of the signal has
    dropped.


    When this occurs, the program interprets it as an alarm signal and outputs the
    appropriate message to a screen. This may be useful when guarding your home or
    outbuilding located somewhere nearby.


    To make things clearer, let''s see the simplified functional diagram of our wireless
    security system shown in Fig.5.20.


    As you can see, both the PIR -detector and FM transmitter may be placed, for example,
    within some remote building we want to protect, while the FM receiver may be placed
    away from this by some distance range that would be possible to reliably receive
    the alarm signal. You must remember that the radio signal of a very high frequency
    can be significantly attenuated or even lost when it is passed through some physical
    barrier ( e. g. building, metal fence, etc.), so it is worthwhile taking time
    to place both transmitter and receiver to ensure a good r.f. connection.


