    8000 kHz and a single channel to capture and play. This works for most sound cards.
    Let''s go back to our source code. As our program produces a 1000Hz tone for 5
    s we need to fill the buffer buf with appropriate values. This task is accomplished
    inside a for() loop that repeats n times. Here the variable x of a double type
    will hold the current value of a sinusoidal curve responding to a particular il
    sample. The following statement calculates the value of a sinusoidal for il sample
    and saves the sample in the variable x:


    ```

    x = sin (il * 2.0 * M_PI * (double) FREQUENCY / (double) RATE);

    ```


    This formula becomes clear when we recall that a sinusoidal curve is represented
    in math. The simplest case, a sinusoidal signal may be expressed as follows:


    ```

    y = sin (2πft),

    ```


    where f is a frequency and t is a time interval. In our case we need to jump from
    a t variable to a value, depending on the current sample. This value may be calculated
    as il divided by RATE. After x has been calculated its value should be adjusted
    according to an 8-bit unsigned char. This is achieved using the following statement:


    ```

    buf[il] = (char)(127*x + 128);

    ```


    After the for loop exits, the buffer buf will contain all il samples recalculated
    as the 8-bit values. After filling the buffer we can write it to the /dev/dsp
    audio device by invoking a write() function:


    ```

    status = write(fd, buf, sizeof(buf));

    ```


    As some time is required to complete playing, the following statement should be
    executed:


    ```

    status = ioctl(fd, SOUND_PCM_SYNC, 0);

    ```


    Finally, we need to close a file descriptor:


    ```

    close(fd);

    ```


