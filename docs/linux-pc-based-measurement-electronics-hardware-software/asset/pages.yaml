    # Hardware access from network applications


    By now know how to build a simple "client-server" distributed system based on
    TCP/IP network protocol suite. Using this programming architecture we can easily
    design embedded systems capable of implementing a remote control or a data acquisition.
    Several demo demo projects described below show practical aspects in realizing
    such distributed systems.


    Suppose we want to write a byte to the hardware port on the local PC from a remote
    host. Let''s select the data port of the standard parallel interface with an 0x378
    (you should select the appropriate address assigned to the data port of your parallel
    interface). We will test such a system on the same machine, so the IP-address
    will be 127.0.0.1 for both server and client applications.

    Our distributed system will operate in the following way: the TCP client sends
    a data byte to the server that sits on port 7171 waiting for requests. The server,
    after accepting the request receives a byte from the client and writes it to the
    data port. This, in brief, is how our system works.

    Let''s begin with the C source code for the TCP server (Listing 5:6):


