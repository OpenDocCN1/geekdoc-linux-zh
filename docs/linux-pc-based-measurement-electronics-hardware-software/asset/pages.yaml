  md: 'When we talk about ''PC-based projects'' assume that we don''t need to deal
    with ''real-time'' high-speed events. What does this mean? Suppose for instance,
    that we want to build a system where we need to read data from some sensor every
    1 microsecond. If we try to realize such a system under Linux or Windows, we will
    more than likely encounter serious problems because of a ''tight timing''. In
    this case a proper solution requires either real-time operating system installed
    on a PC or an ''intellectual'' development board with a microcontroller/microprocessor.
    Luckily, many real-life systems don''t need to have such performance, so we can
    freely use control software developed under Linux in our embedded projects.


    Many times you need to control your embedded system remotely, for example, from
    your workplace or when you are or when you are travelling. This comes in handy
    when you have to get data from a remote system implementing some continuous task
