    \       sleep(20);\n    }\n    return 0;\n}\n```\n\nLet's discuss this source\
    \ code. The control algorithm is implemented in the endless while() loop. Each\
    \ iteration begins by reading the Modem Status Port (MSR) and saving the byte\
    \ read in the CTS variable. If CTS is non-zero means the temperature has exceeded\
    \ the threshold, so the heater must be switched off by executing the statement\n\
    \noutb(0x0, MCR);\n\nThe zero value of CTS indicates the temperature is below\
    \ the threshold, so the heater must now be switched on:\n\noutb(0x2, MCR);"
