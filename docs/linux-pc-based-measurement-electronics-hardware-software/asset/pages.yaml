  md: '# Interfacing sound card to external circuits


    When developing hardware interfaces to our sound card we must know the electrical
    characteristics of the audio signal. The magnitudes of those signals must be kept
    within specified levels; usually, for input signals the peak voltage should not
    be higher than 1V. Higher levels may damage your sound card, so you need to assemble
    simple circuitry to limit the upper level of input signals. We may accept this
    level to be about 1V or even less. Additionally we must be sure that an input
    signal is free of high-frequency noise, so it would benefit introducing an active
    low-pass filter between the signal source and the sound card line input. A possible
    solution is shown in the schematic circuit of Fig.4.3.


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_161_0.png)


    Fig.4.3


    In this circuit the input signal from an external source enters the single channel
    Ch1 through the voltage divider R1–R2 that allows you to lower the voltage level
    simply by adjusting the value of the variable resistor R2. Protection diodes D1–D2
    further restrict this level to a safe value. The diodes operate with audio frequencies,
    of tens of kilohertz, so we should select high-speed parts such as 1N4148/1N4448
    or similar. The input signal is delivered to the active low-pass filter TL0811
    opamp (A1) via capacitor C1. As you can see from Fig.4.3, the input and output
    signals of this circuit are AC coupled through capacitors C1 and C5 having sufficiently
    high values – this lessens the cut-off frequency of the circuit. Usually the input
    signal is also AC coupled to the soundcard itself.


    The output audio signal may be a basis for designing various signal generators.
    Using simple circuitry we can gain further signals from a single audio output.
    One possible approach I use in my home laboratory is based on the following circuit
    (Fig.4.4).'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Interfacing a sound card to external circuits


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_162_0.png)


    Fig.4.4


    This circuit, in fact, consists of two sub-circuits or stages. The first stage
    is built using the opamp A1 configured as a comparator. This comparators output
    swings from low to high depending on the level of an AC signal on the inverting
    input (pin 2). We take the sinusoid signal from our sound card, deliver it to
    the inverting input of A1 and get a series of pulses on the comparator''s output
    (pin 1). These pulses have the same frequency as the input signal on the inverting
    input of A1. Those pulses go to the second stage (opamp A2) that functions as
    an integrator. The output of A2 (pin 7) yields a sawtooth signal. The capacitor
    C3 charges and discharges through separate chains (D1-R7 and D2-R8) which allow
    separate configuring of the rising and falling edges of a sawtooth signal on pin
    7 of A2. The resistor R8 allows setting the slope of the waveform. Values of R7,
    R8 and C3 are selected to obtain the best performance and linearity in the range
    of 1 to 3 kHz. You may experiment with these values while configuring this circuit.
    To further improve the circuit you may replacing the D1-D2 diodes with Schottky
    diodes. In general, this circuit operates well over a wide band of input frequencies.


    The output signal may be successfully applied to control multiple loads using
    tone-decoder circuits. One channel of such a circuit is shown in Fig.4.5:'
  merge: -1
  pgno: 162
- img_proc: true
  md: "# Chapter 4. Sound card in home projects\n\n![](img/c0e2a8f44eadc53b4372ff3151186ecc_163_0.png)\n\
    \n$f_0 = 1.1 \times R1 \times C5 \\quad BW = 100 \times \frac{V_i}{f_0 \times\
    \ C2} \\quad \\text{in % of } f_0$\n\n. Fig.4.5\n\nHere we use a popular chip\
    \ LM567C. The LM567C is a tone-decoder which provides a low-level voltage level\
    \ on its output (pin 8) when an input signal ($Vi$ in Fig.4.5) falls into the\
    \ given pass-band. The tone-decoder circuit includes a voltage controlled oscillator\
    \ with center frequency $f_0$ defined as shown in Fig.4.5. The bandwidth (BW)\
    \ of the tone–decoder is dependent on the central frequency $f_0$ and the capacitor\
    \ C2. External components R1–C5 and C2 are used to independently set the center\
    \ frequency, bandwidth and output delay. The built-in oscillator of the LM567C\
    \ runs at a frequency determined by the R1–C5 pair attached to pins 5–6. The external\
    \ frequency produced by a sound sound card passes onto pin 3 via capacitor C3.\
    \ If this frequency becomes equal to the built-in oscillator, the output of the\
    \ tone–decoder (pin 8) goes low. If the external frequency is beyond BW the output\
    \ level on pin 8 goes high. In our case the center frequency $f_0$ will be about\
    \ 900 Hz. If an input frequency is equal to the pass-band results in raising the\
    \ voltage level on pin 8. The output of the tone–decoder goes low. The input frequency\
    \ before-. Thus, by changing the frequency on the LM567C’s input we can switch\
    \ on/off some load connected to pin 8 of A1. The output of the tone–decoder yields\
    \ TTL–compatible levels and can drive a load up to 100 mA. To provide a control\
    \ for For heavy loads we would add an additional stage of power transistor (bipolar\
    \ or MOSFET). A typical example would use a stage with a POWER MOSFET IRF510 (Q2)\
    \ driven by the output of A1 by bipolar transistor 2N3904 (Q1)."
