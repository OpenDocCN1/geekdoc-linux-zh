  md: "# Chapter 3. Home projects with a serial port\n\n# Listing 3.5\n\n```\n#include\
    \ <stdio.h>\n#include <sys/io.h>\n#include <unistd.h>\n\nint main(void)\n{\n \
    \   int MCR = 0x3FC; // Modem Control Register = base + 4\n    int MSR = 0x3FE;\
    \ // Modem Status Register = base + 6\n\n    int CTS;\n    iopl(3);\n    while\
