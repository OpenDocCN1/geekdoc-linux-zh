    PC may be realized in various ways. There is no so-called ‘preferred method’ for
    designing such systems, although you may apply such popular interfaces as SPI
    and I2C to provide communications with the PC. Using a SPI interface allows building
    of relatively simple measurement systems, though you may easily expand your SPI-based
