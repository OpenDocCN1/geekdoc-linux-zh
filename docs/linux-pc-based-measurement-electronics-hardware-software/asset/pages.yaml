    (IP-address and port) passes them to the client. As you see, the working socket
    is the IP-address of the TCP Server, but a different port (1029, in our case).
    Data transfer between the TCP server and the TCP Client 1 will be accomplished
    via this working socket which must be closed after operations have completed.


    Again, when the TCP Client 2 establishes connection to the TCP Server, the new
    connection with IP-address 194.15.28.11 and port 1030 is opened. Note, that the
    “listening socket” working on port 8089 is not involved in the data transfer process
    between the TCP Server and clients. This socket only spies for incoming requests
    from clients and the TCP Server to create a new working connection when needed.
    When the TCP Server completes its functions it must close the “listening” socket
    as well. Usually, we need at least two PCs (one server and one client) to realize
    client-server configuration.


    We can build and test our client-server configuration using a single PC. This
    is because all operating systems reserve a “loopback interface” with the IP-address
    127.0.0.1. This interface is frequently used when testing network applications
    or when debugging the TCP/IP configuration. This IP-address doesn''t tie to any
    network card; it is a pure “virtual” interface. We will develop our distributed
    systems described in this chapter using this “loopback interface”. Note that in
    real life you use real IP-addresses, so you should replace “127.0.0.1” with a
    valid address in the source code of your applications or use names of hosts if
    you have some name system.


    Many times you may want to have a distributed system functioning locally on your
    PC. For example, this may be the case when some application provides measurement
    of some physical quantities (temperature, pressure, light, humidity, etc.) and
    passes data to another application that executes high-level processing (e.g. Openfile,
    MySQL, etc.). These systems may interact with each other via TCP sockets, but
    there is actually another method based on UNIX domain sockets also known as IPC
    (inter-process communication) sockets. Often those sockets are called “local sockets”.


    A local socket is a data communications endpoint that is similar to a Internet
    (TCP) socket, but does not use a network protocol for communication. Local sockets
    were introduced in POSIX systems, including Linux, for inter-process communication.
    UNIX domain connections appear as byte streams, like network connections, but
    all data remains within the local computer. UNIX domain sockets utilize the file
    system as name space, i.e. they are referenced by processes as *inodes* in the
    file system. In this way two standalone processes may open the same local socket
    in order to communicate with each other. In real life, the actual communication
    where data travels across local sockets does not use the file system, but...


