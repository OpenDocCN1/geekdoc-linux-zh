    +   * SDO (Serial Data Output). When SPI communication is selected, the SDO pin
    is the serial data output for the SPI bus. When 3-wire communication is selected,
    this pin must be tied to the SDI pin (SDI and SDO pins function as a single I/O
    pin when tied together.)

    * SDI (Serial Data Input). When SPI communication is selected, the SDI pin is
    the serial data input for the SPI bus. When 3-wire communication is selected,
    pin must be tied to the SDO pin (SDI and SDO pins function as a single I/O pin
    when tied together.)


    Before using the DS1722 sensor we need to configure it by writing an appropriate
    data byte to the configuration/status register containing the bits shown in Table
    3.


    Table 3. Configuration/status register’s bits


    | bit 7 | bit 6 | bit 5 | bit 4 | bit 3 | bit 2 | bit 1 | bit 0 |

    |---|---|---|---|---|---|---|--|

    | 1 | 1 | 1 | 1SHOT | R2 | R1 | R0 | SD |


    SD is a ‘shutdown bit’. If SD is “0”, the DS1722 will continuously perform temperature
    conversions and store the last completed result in the temperature register. If
    SD is changed to “1”, the conversion in progress will be completed and stored
    and then the device will revert to a low-power shutdown mode.The communication
    port remains active. The user has read/write access to the SD bit and the power
    up default is “1” (shutdown mode).


    1SHOT bit means “One-shot temperature conversion”. If the SD bit is “1”, a “1”
    written to the 1SHOT bit will cause the DS1722 to perform one temperature conversion
    and store the results in the temperature register at addresses 0x1 (LSB) and 0x2
    (MSB). The user has read/write access to the 1SHOT bit, although writes to this
    bit will be ignored if the SD bit is a “0”. The power-up default of the one-shot
    bit is “0”.

    R0–R2 bits define thermometer resolution. In our project we will select an 8-bit
    resolution, so these bits will be set to 0. The user has read/write access to
    the R2, R1 and R0 bits and the power-up default state is R2 =“0”, R1 =“0”, and
    R0 =“1” that corresponds to 9-bit conversions.


    The application can write the byte to the configuration/status register by using
    address 0x80. To read the data byte from the configuration/status register the
    must use address 0x0. The temperature low byte (LSB) may be read at the address
    0x1 and the high byte (MSB) may be read at address 0x2. In our project we will.
    Writing of the data byte to the sensor is presented in the timing diagram shown
    below (Fig.2.22):'
