  md: '# Simple remote control system using FM transmitter


    of Q1 changes the inner capacitances of the transistor thus providing an angle
    (FM) modulation of a carrier frequency of the oscillator. With the given values
    the transmitter operates in a center range of about 88 to 108 MHz; the central
    frequency is adjusted by mechanically squeezing or stretching L1, no other tuning
    is needed. You should adjust the coil until the FM radio goes silent–this indicates
    that the carrier frequency from the transmitter is being picked up by the receiver.
    The signal of the transmitter may be received within 100m around or so. The drawing
    below is the copper side of the peb for this transmitter which I assembled for
    this project (Fig.5.30):


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_258_0.png)


    **Fig.5.30.** Assembled FM transmitter


    Some words about the above design. You can apply almost any high-frequency bipolar
    transistor (2N3904, 2N4401, 2SC9018, etc.). The circuit can operate over a wide
    range of supply voltages (I tested it at 2.7V through 5V). Remember that when
    you change the supply voltage the inner capacitances of Q1 also changes and that
    results in altering of the carrier frequency of the oscillator, so you will have
    to re-adjust the resonant circuit as mentioned above.


    To extend a distance you can either increase the sensitivity of your receiver
    (for example, by adding an RF amplifier stage before the receiver input) or increase
    the power of the signal from your transmitter. Simple designing and tuning the
    small signal RF amplifier for the receiver may be too difficult for inexperienced
    readers, I would like to offer a modified variant of the FM transmitter just discussed.
    I simply added a power RF amplifier to the output of the RF oscillator, so it
    resulted in higher power output signal. The modified FM transmitter circuit appears
