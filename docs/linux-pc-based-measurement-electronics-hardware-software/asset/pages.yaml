  md: '# Simple thermostat system


    The last statement within a while() loop is the sleep(20) function which performs
    a 20 second delay before repeating the cycle. This delay can be selected randomly
    by the developer to suit. The electronic components chosen for this circuit may
    be easily substituted with similar parts. For example, instead of using the LM2903
    you could use a single-supply comparator with a TTL output. If you want to reach
    a higher precision, consider use of a comparator with a low offset voltage – this
    minimizes the error introduced by the comparator when configuring a threshold
    voltage. It is worthwhile to use a high precision potentiometer for R1 – which
    also affects the accuracy of this circuit. The best result will be achieved by
    using a specialized single-chip voltage reference instead of R1. When designing
    this project you should also evaluate the requirements of your real load driven
    by Q1 and select an appropriate power transistor. Additionally, precautions must
    be taken into account when wiring devices to the (vulnerable) serial port. Finally,
    if you are going to use some expansion board with the serial interface, don''t
    forget to replace the addresses 0x3F in the source code with appropriate values.
    The circuit shown in Fig.3.15 drives a DC load. If we want to use on/off control
    an AC load we must change our circuit. One of the possible solutions is shown
    in Fig.3.17:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_102_0.png)


    Fig.3.17


    Here the Q1 transistor drives the reed relay RL1. Each time the RTS line becomes
    high Q1 is turned on and RL1 is energized. As a result, the relay contact closes
    an AC circuit thus connecting power for the heater. When the RTS signal goes low,
    the Q1 transistor cuts off, breaking power to the RL1 relay which, in turn, feeds
    the heater. The 1N4004 diode protects Q1 from high back-emf voltage from the relay
    coil cut out of the transistor. With this circuit you can apply any low-power
    relay. An alternative is to use an optocoupler circuit with an optotriac which,
    in turn, will drive a power triac. One of the possible practical approaches is
    shown in Fig.3.18:'
