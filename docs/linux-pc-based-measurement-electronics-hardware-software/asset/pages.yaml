  md: "# Home security system\n\n# # Home security system\n\nFirst of all let's look\
    \ at the hardware. It consists of the Passive Infrared Sensor (PIR) and only several\
    \ more components. The PIR-circuit is attached to the serial port /dev/ttyS0 via\
    \ the optocoupler MOC3063. First of all let's see in brief what a PIR-sensor is\
    \ and how it works.\nA passive Infrared Sensor is an advanced version of a motion\
    \ sensor. PIR sensors can identify the presence of people by detecting the infrared\
    \ radiation that they emit, from body heat. The PIR sensor is completely passive\
    \ and reacts only to drastic changes in levels of infrared radiation emitted in\
    \ their surveillance area, typically caused by the movement of a person in a room.\
    \ This prevents false alarms when the floors cool at night, for sensors are designed\
    \ so that they don't react to people moving around their surveillance area.\n\
    \ our project we use the PIR detector module KC7783. This is a fully assembled\
    \ and tested PIR module (KC7783 with KC778B IC) with 3 connections: Power, Ground\
    \ and Output. The module can be powered from +4 ~12V DC power supply (in our project\
    \ we use the standard TTL-compatible 5V power source). In this module RE200B PIR\
    \ sensor is used. The output signal is an active pulse of approximately 0.5 seconds\
    \ minimum which remains active as long as there is motion. The device can \"sense\"\
    \ touch within up to 10 feet. The size of this module is 35mm x 25mm; it can be\
    \ easily mounted on the wall. In fact, you can freely apply almost any PIR-sensor\
    \ manufactured to generate TTL-compatible signals.\nBesides the PIR sensor module\
    \ there are also additional electronic components that are needed to interface\
    \ the PIR sensor module to the serial port. The full schematic circuit of our\
    \ device is shown in Fig.3.9.\n\n![](img/c0e2a8f44eadc53b4372ff3151186ecc_88_0.png)\n\
    \nFig.3.9\n\nThis application operates in the following way. The control program\
    \ running on the PC continuously sends data through the TD output data line (pin\
    \ 3 of the DB-9 connector) of the serial port and tries to receive the same data\
    \ on the RD line (pin 2 of DB-9). If the PIR sensor is not being excited it yields\
    \ a low-level voltage on its output, the LED of the optotriac is off. That, in\
    \ turn, holds the triad closed, therefore nothing goes from TD to RD because of\
    \ a very high resistance between TD and RD."
