    # Timing in Linux


    Here, we will see how to build circuits where time dependencies are implemented.
    When we start talking about timing in desktop operating systems as Windows or
    Linux we must understand that it is a difficult and complicated matter. Many times
    when we want to operate with tight time interval constraints and/or high frequencies
    we need special equipment as expensive I/O expansion cards and device drivers
    for implementing some real-time tasks. Nevertheless, we can successfully implement
    many projects with demanding time requirements even with a home PC.


    First, you could take some multifunction chip which provides some real-time solution
    inside its chip. In this case you will not need to worry about implementing precision
    time circuits; all you must do is to program a chip using some kind of interface
    (SPI, FC, etc) to gain the functionality that you need. We have already discussed
    a similar solution when designing the wide-band oscillator based on the LTC6903.
    As you recall, our control application had to configure that device via a SPI-compatible
    interface; all other jobs were performed by the chip. The benefit of such an approach
    for designing your embedded system is obvious: you can concentrate on providing
    some simple hardware interface and programming the data transfer algorithm.'
