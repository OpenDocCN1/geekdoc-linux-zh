    an active low-pass filter which includes operational amplifier A2, type MCP601,
    and a R1C6 filter is an optional stage; it is come when noise attenuation is needed.
    The analog signal from the pressure sensor then passes to the converter''s input
    (pin 2 of A4). The conversion process is controlled via an SPI-compatible interface
    built using the RTS, CTS and DTR signal lines. As usual, the MAX32 chip converts
    RS-232 signals to TTL-compatible levels.'
