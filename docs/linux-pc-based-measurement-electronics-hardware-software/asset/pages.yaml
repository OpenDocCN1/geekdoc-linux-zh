    Fig.3.28


    This circuit is simple, requiring few components. The MAX232 chip converts RS-232
    signal levels from the PC''s serial port to TTL-compatible levels needed to operate
    IC bus. The IC interface uses a PCF8574 I/O expander provides standard SCL and
    SDA signals controlled by the RTS (ready-to-send) and DTR. An 8-bit binary code
    (data byte) is passed from the serial port of the PC to the IC I/O expanders (P0-P7
    pins).


    According to the IC specifications, the data byte passes via the serial data (SDA)
    signal line, while the synchronization is provided by the serial clock (SCL) line.
    For a more complete understanding of how the timing diagram of IC is implemented
    you may wish to refer to the datasheet of the PCF8574A chip. The A0-A2 address
    lines define the address of the device on the IC bus. In a given case those lines
    are connected to “ground”. Remember, that each device on the IC bus must have
    a unique address. Anyway, when assigning the address you should consult the device’s
    datasheet. That’s all about hardware.


