    to -1 after the fork() call has failed for some reason. In that case only the
    error message is displayed. Since we need to decrement the cntChild variable after
    the child process has finished, signal handling is introduced in this program.
    In Linux, the termination of a child process may be captured by the SIGCHLD event
    handler. The sig_child() function that is called when a child process terminates,
    simply decrements the cntChild variable.


