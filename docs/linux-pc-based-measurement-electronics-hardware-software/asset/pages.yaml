    After tobj has been created successfully it appears in the MATLAB workspace. Now
    we can operate with this TCP/IP object when implementing network operations. The
    common sequence when working with a TCP/IP object is as follows:


    +   1. open the object using the fpen() function;

    2. execute read/write operations using fscanf/fread/fprintf or another appropriate
    function;

    3. close the TCP/IP object after completing operations using the fclose() function.


