    # Using the I2C interface


    Building measurement systems become significantly simplified when applying digital
    sensors. Digital sensors comprise all signal conditioning stages inside a single
    module chip and output the result as a binary code. Using such chips simplifies
    circuitry also saves electronic components, because digital sensors require few
    (if any) external components to provide their functionality. You may find many
    single-chip digital sensors to measure temperature, humidity, pressure, light,
    etc.


    The digital code on the sensor''s output may be transferred to the target system
    via one of the popular interfaces such as SPI, I2C, etc. This time we will consider
    of I2C. An I2C interface is a good solution for building a measurement system
    that must be controlled via a serial port of the PC. This is because this interface
    requires only two signal lines that the serial port can simply provide.'
