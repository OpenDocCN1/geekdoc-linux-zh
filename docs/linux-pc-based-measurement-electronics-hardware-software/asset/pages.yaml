    # Measuring temperature with the DS1722 digital sensor


    The DS1722s allows measuring temperatures from -55°C to +120°C with an accuracy
    of 2.0°C and requires no external components. Additionally, the DS1722s may be
    configured to operate with a resolution from 8 to 12 bits (1.0°C to 0.0625°C).
    Such a configurable resolution will be useful in applications where thermal runaway
    conditions must be detected most quickly. Data may be read/write to the device
    via a SPI or 3-wire interface. In our project we will utilize the SPI interface.
    The schematic circuit of our system is shown in Fig.2.21:


    ![](img/c0e2a8f44eadc53b4372ff3151186ecc_57_0.png)


    Fig.2.21


    When you see, the temperature sensor is attached to the parallel port of the PC
    via a 4-wire SPI compatible interface. This 4-wire mode is selected by connecting
    SERMODE (pin 7 of DS1722S) to the +5V supply. The device communicates with the
    PC with the following signal lines:


    +   - CE (Chip Enable). This signal must be asserted for communication to take
    place for either the SPI or 3-wire interface.

    - SCLK (Serial Clock Input). This signal is used to synchronize data movement
    on the serial interface for either the SPI or 3-wire interface.


