    # Digitally controlled pulse width modulator


    When we are considering how to get a DC signal from the frequency we may consider
    a pulse width modulation (PWM). The PWM is a most common method used in robotics
    and automatics for DC motor speed control. Pulse width modulation is the process
    of switching the power to a device on and off at a frequency, varying with on
    and off times. On these and off times are referred to as "duty cycle". The diagram
    below (Fig.2.26) shows the waveforms of 25%, 50%, and 75% duty cycle signals.


    As you can see from the diagram, a 25% duty cycle signal is ON for 25% of the
    wavelength and OFF for 75%, while a 75% duty cycle signal is ON for 75% and OFF
    for 25%. These signals are sent to the motor at a high enough frequency that the
    pulsing has no discernible effect on the motor. The end result of the PWM process
    is that the overall power sent to the motor can be adjusted from fully OFF (0%
    duty cycle) to fully ON (100% duty cycle) with good efficiency and stable control.


    66'
