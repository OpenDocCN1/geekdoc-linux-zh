  md: "# Programming sound with OSS\n\nare to default values. The default parameters\
    \ are as follows: 8-bit unsigned sample, one channel\n(mono) and an 8 kHz sampling\
    \ rate.\n\nWriting a sequence of digital samples to the DSP device, as you already\
    \ know, produces a sound.\nAgain, the format of audio signal is set by invoking\
    \ ioctl() with appropriate\nparameters, but default settings are the same as those\
    \ defined for input signals (8-bit unsigned data,\nmono and 8kHz sampling rate).\n\
    \nIf the data is being written too slowly, there will be dropouts or pauses in\
    \ the sound output. Writing\ndata faster than the sampling rate will simply cause\
    \ the kernel driver to block the calling\nuntil the sound hardware is ready to\
    \ process the new data. As in the case of capturing\ninput data, you can change\
    \ the default parameters using ioctl() calls. In general, you should\nset the\
    \ parameters after opening the device, but before any read/write operations. Note,\
    \ that you\nalso should set the parameters in the order in which they are listed\
    \ below.\n\nIf a parameter is out of range, the driver will set it to the closest\
    \ value. For example, attempting to use\n16-bit sampling with an 8-bit sound card\
    \ will result in the driver selecting 8 bits, but no error will be\nreturned.\
    \ It would be worth verifying that the value returned is acceptable to your application.\
    \ All of\nioctl() calls for the DSP device take the parameters with names starting\
    \ with SOUND_PCM.\nParameters that are similar to SOUND_PCM_READ_XXX are used\
    \ to return the current value of a\nparameter. To change the values, the ioctl()\
    \ calls should take the parameters that may look like\nSOUND_PCM_WRITE_XXX. As\
