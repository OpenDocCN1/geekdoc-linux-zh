    # debian106 登录


    _ 登录系统后，你将能够添加更多软件，以使用基于 XFCE 桌面的图形用户界面。在安装过程的这一步，只有以管理员 root 用户身份登录才能添加更多软件。要这样做，请在登录提示处输入
    `root`，按 `Enter` ，等待 `Password:` 文本出现，然后输入你之前定义的 root 用户密码。Linux 系统将用一条登录消息欢迎你（见下文）。登录消息将显示当前运行的
    Linux 内核版本以及使用建议。


    ```

    Debian GNU/Linux 10 debian106 tty1

    debian106 login: root

    Password:

    Linux debian106 4.19.0-11-amd64 #1 SMP Debian 4.19.146-1 (2020-09-17) x86_64

    Debian GNU/Linux 系统包含的程序是自由软件；每个程序的具体分发条款在 /usr/share/doc/*/copyright 中的单独文件中说明。Debian
    GNU/Linux 在适用法律允许范围内不提供任何担保。

    ```


    在欢迎消息之后，Debian 会打开一个命令行提示符：


    ```

    root@debian106 ~#

    ```


    此命令行提示符由四个部分组成：![](img/image_rsrc2AS.jpg) `root`：登录用户的名称。![](img/image_rsrc2AT.jpg)
    `debian106`:Linux 系统的主机名。![](img/image_rsrc2AU.jpg) `~`：当前目录。在这种情况下，它是当前登录用户的家目录。如果没有其他设置，对于普通用户定义为
    `/home/username`，对于管理员用户定义为 `/root`。`~` 只是此的缩写。![](img/image_rsrc2AV.jpg) `#`:登录符号。`#`
    符号代表 root 用户，而 `$` 用于没有管理员权限的普通用户。今后在使用各种命令时你会看到这个符号。


    **重要**：你现在是以管理员 root 用户身份登录的。请小心输入你输入的命令，并在疑问时双重检查。任何错误都可能导致你必须修复 Linux 系统。


    ## 4.3 添加图形用户界面


    在当前阶段，Debian 系统已完全激活并可以按样使用。对于适合普通用户的桌面系统，它仍然缺少一个漂亮且易于使用的图形用户界面，使其看起来和感觉与你习惯的
    Windows 或 macOS 系统更加熟悉。在这一步中，我们将改变这一点并安装 XFCE 桌面管理器。为此，我们将安装以下软件包：


    ![](img/image_rsrc2AW.jpg) `aptitude` 软件包管理器。![](img/image_rsrc2AX.jpg) `xdm`
    显示管理器。![](img/image_rsrc2AY.jpg) `xfce4` 桌面环境。


    Debian 使用 `apt` 软件包管理器来处理软件包的安装、更新和删除以及相关的包列表。此外，`apt` 会解析所有的软件包依赖，并确保系统上有相关的软件。在我们案例中，必须从软件包镜像检索并安装约
    170 MB 的数据。如之前所示，这需要可用的互联网连接来下载所需的软件包。


    要安装这三个软件包，请在命令行提示符处输入以下命令。只需在 `#` 符号后输入命令即可：


    ```

    root@debian106 ~# apt-get install aptitude xdm xfce4

    ```


    `apt` 将显示有关要安装软件包的更多信息。这包括依赖包列表和推荐软件包。最后，你将看到命令行提示符。输入 `Y` 或按 `Enter` 来安装 `aptitude`、`xdm`
    和 `xfce4` 以及依赖包。对于 `xdm` 显示管理器，必须确认两个对话框。在两个框上都按 `Enter` 以确认使用 `xdm`。


    检索要安装的软件包需要一段时间。完成后，命令行提示符将再次出现。要激活有关图形桌面环境的更改，请重启系统。在命令行提示符处如下输入 `reboot` 命令：


    ```

    root@debian106 ~# reboot

    ```


    重启 Linux 系统后，Debian 用图形启动界面欢迎我们（见下文）。按 `Enter` 以默认设置启动 Linux 系统。![](img/image_rsrc2AZ.jpg)
    几秒后将看到图形登录界面。使用之前创建的名为 `user` 的普通用户登录系统。输入 `user`，按 `Enter` 并输入该用户的密码。然后再次按 `Enter`
    确认并登录。


    接下来，将看到 XFCE 桌面（见下文）。桌面带有几个默认元素：顶部导航栏、底部导航栏和桌面图标。这些元素在下文有详细解释。![](img/image_rsrc2B0.jpg)![](img/image_rsrc2B1.jpg)


    **顶部导航栏**：显示访问不同应用程序、四个虚拟桌面屏幕、时钟以及各种用户操作按钮，如锁定屏幕、切换用户、切换到待机模式和退出当前会话。![](img/image_rsrc2B2.jpg)
    **底部导航栏**：此栏包含多个按钮，用于隐藏所有打开的窗口并显示空桌面、打开终端、文件管理器、浏览器、查找应用程序以及直接打开文件管理器。![](img/image_rsrc2B3.jpg)
    **桌面图标**：从上到有垃圾桶、链接到计算机的文件管理器图标和家目录。在桌面上右键点击可以打开访问各种应用程序的上下文菜单。![](img/image_rsrc2B4.jpg)


    ## 4.4 添加额外的软件包


    到目前为止，你的 Linux 系统可用的软件相当有限。下一步要做的是使用这四个 Debian 软件包添加一些功能：![](img/image_rsrc2B5.jpg)
    `firefox-esr`：Mozilla Firefox 浏览器（扩展支持版）。![](img/image_rsrc2B6.jpg) `gnome-terminal`：由
    GNOME 项目维护的终端模拟器。![](img/image_rsrc2B7.jpg) `xscreensaver`：X11 系统的基础屏保。![](img/image_rsrc2B8.jpg)
    `vlc`：Video Lan Client (VLC) 视频播放器。


    将在终端模拟器的命令行安装三个软件包（将在指南稍后部分详细介绍终端）。目前你的系统中安装了 X11 终端模拟器 `xterm`。要打开 `xterm`，点击底部导航栏中的终端按钮，或从上下文菜单选择
    Application > System > Xterm。第一步打开 `xterm`。接下来，在命令行提示符旁输入命令 `su` 并按 `Enter`：


    ```

    user@debian106: ~$ su

    ```


    `Password:` 你可能记得之前的步骤，只有管理员用户才能 Debian 系统上安装、更新或删除软件。`su` 命令是 switch user 的缩写，用于更改你的当前角色。如果不带额外名称，角色将变为管理员
    root 用户。在密码提示处输入管理员用户的密码并按 `Enter`。


    作为管理员用户，按照如下方式安装软件包：`firefox-esr`、`gnome-terminal`、`xscreensaver` 和 `vlc`：


    ```

    root@debian106: ~# apt-get install firefox-esr gnome-terminal xscreensaver vlc

    ```


    输出所示：![](img/image_rsrc2B9.jpg) 安装这四个软件包后，你可以切换回普通用户角色。按 `Ctrl+D` 退出管理员部分，再次按
    `Ctrl+D` 关闭 `xterm`。


    安装 Firefox 有以下效果：![](img/image_rsrc2BA.jpg) 应用程序菜单中可以使用新软件 `Firefox`。![](img/image_rsrc2BB.jpg)
    命令行可以使用新命令 `firefox`。![](img/image_rsrc2BC.jpg) 底部导航栏的地球图标链接到 Firefox 浏览器。![](img/image_rsrc2BD.jpg)
    安装 GNOME terminal 软件包有以下效果：![](img/image_rsrc2BE.jpg) 命令行和应用程序菜单均可以使用新软件 `gnome-terminal`。![](img/image_rsrc2BF.jpg)
    底部导航栏的终端图标链接到 GNOME terminal。


