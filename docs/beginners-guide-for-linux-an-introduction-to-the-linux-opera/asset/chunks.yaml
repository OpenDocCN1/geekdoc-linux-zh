    在删除文件和目录时为了安全起见，请结合使用 `-i`（对应 `--interactive`交互）和 `-v`（对应 `--verbose`详细）。在删除文件之前，`rm`
    将请求你的显式确认并打印状态消息。


    ### 切换目录


    `cd`（更改目录）命令允许你在系统中移动。若要向上移动一级到根目录，请使用此命令：


    ```

    cd ..

    ```


    若向下移动到子目录，请输入 `cd` 命令后跟目录名称。命令 `cd /home/user/test` 将直接带你进入 `/home/user/test`
    目录。正如之前解释的那样，有一些快捷方式可用。命令 `cd ~`（波浪号）和 `cd $HOME` 始终将你带回到主目录，而 `cd /` 则将带你进入 `/`
    目录。


    **提示：** 由于 Linux 是区分大小写的，因此 `cd` 与 `CD` 相同。在使用大写和小写字母时请小心。


    ### 重命名目录


    `mv` 命令是 move（移动）的缩写，用于移动和重命名文件及目录。它需要两个名称：原始文件的名称及其新名称。若要将目录名称从 `lpic1` 改为 `lpic-1`，请输入以下：


    ```

    mv lpic1 lpic-1

    ```


    原始文件将被移除，新条目将接收时间戳。使用选项 `-i`（或 `--interactive`）可以防止覆盖现有文件。


    ### 5.3 基于终端的文件管理器


    在命令行中导航 Linux 并不是最理想的情况。基于终端和图形化的文件管理器是极好的替代方案。基于终端的文件管理器运行在终端内部，不会在桌面上打开单独窗口。有很多程序可用，因此我们只向你介绍我们最喜爱的几款。


    #### GNU Midnight Commander (mc)

    www.midnight-commander.org

    这是一个免费的、全屏的、文本模式可视化文件管理器，允许你搜索、复制、移动以及删除单个或多个文件，甚至是整个目录树。`mc` 集成了查看器和编辑器。

    ![](img/image_rsrc2BM.jpg)


    #### Vi 文件管理器 (vifm)

    https://vifm.info

    与 `mc` 类似，Vi 文件管理器 (`vifm`) 带有基于 curses 界面的两个导航窗口。它为管理文件和目录提供了类似 Vi(m)的环境。如果你熟悉
    Vi 的按键绑定，那么这就是适合你的文件管理器。

    ![](img/image_rsrc2BN.jpg)


    ### 5.4 图形化文件管理器


    与基于终端的文件管理器类似，图形化文件管理器协助在 Linux 中导航。这些文件管理器会在单独窗口中打开，但提供了更好的用户体验。同样，有很多程序可用，我们只在下方列出我们的喜好。


    #### Konqueror

    https://packages.debian.org/stretch/konqueror

    Konqueror 是 KDE 桌面环境强大的文件管理器。Konqueror 提供了简单的文件管理功能，如复制、移动、搜索和删除文件及目录，以及一些高级功能，如访问压缩包、浏览和刻录音频
    CD，以及对 FTP、SFTP 服务器和 SAMBA（Windows）共享的支持。


    #### Nautilus

    https://wiki.gnome.org/Apps/Nautilus

    Nautilus 是 GNOME 桌面上的文件管理器。它提供了对 Linux 系统文件的便捷导航和管理。这包括简单的文件管理功能，如复制、移动、搜索和删除文件及目录，以及轻松访问本地和远程文件。


    #### Dolphin

    www.kde.org/applications/system/dolphin/

    Dolphin 是作为 KDE 应用程序包的一部分开发的轻量级文件管理器。为简单、灵活和完全自定义而设计，允许用户非常轻松地在 Linux 系统中浏览、定位、打开、复制和移动文件。


    #### Thunar

    https://docs.xfce.org/xfce/thunar/start

    Thunar 是用于 XFCE 桌面的现代轻量级文件管理器。它的设计旨在快速、响应且易于使用。我们在这里列出它是因为它具有简洁直观的界面并提供了重要的用户选项。


    # 6 终端与 Shell 简介


    使用 Linux 操作系统需要你了解终端（terminal）和命令行（command line）。了解它们是什么并稍微熟悉它们的用法以及可用命令至关重要。但不要担心，我们将详细描述每一个项。这些术语听起来比实际要吓人得多。


    以文本格式与系统通信的能力是程序员对 Linux 产生青睐的原因之一，因为这是程序员向计算机发出指令的标准方式。另一个原因是这种方式允许对系统进行绝对控制，而其他操作系统即使有它们自己的命令行解释器也无法提供这种控制。


    一些初学者甚至报告说，使用并熟悉以这种文本格式发布命令使得向程序开发的过渡变得更加容易和快捷。


    ## 6.1 什么是终端？


    终端被描述为“一个在其他显示架构中模拟视频终端的程序。尽管它通常与 shell 或文本终端同义，但‘终端’一词涵盖了所有远程终端，包括图形界面。图形用户界面内部的终端模拟器通常被称为终端窗口”。


    准确来说，终端仅仅是外层软件。在终端内部运行着一个被称为 `shell` 的命令行解释器。终端是你通过 GUI 与 `shell` 交互的方式。


    Debian 支持很很长的终端软件列表。这包括 `Aterm`，以及 `GNOME terminal`、`Kterm`、`Mate Terminal`、`Rxvt`、`Xterm`
    和 `Xvt`。这些不同的终端软件实现在稳定性、对字符集的支持、设计、颜色和字体，以及应用背景图像或处理透明度的方面有所不同。


    在书中，我们将使用 `GNOME terminal`，因为它稳定、简单且易于调整。要增大或减少终端窗口内显示内容的大小，请使用组合键 `CTRL+` 和 `CTRL-`。


    ## 6.2 什么是 Shell？


    简单来说，`shell` 是一个复杂的命令行解释器。`shell` 读取你的命令，在某些条件下对其进行修改，然后执行结果。


    在从命令行读取和执行实际结果之间，`shell` 必须解释你输入中的特殊字符。下表显示了可用的特殊字符：


    | 字符 | 含义 |

    | :--- | :--- |

    | `$name` | 变量替换 |

    | `name=` | 变量赋值 |

    | `''command''` | 引用

    | `$( command )` | 命令替换 |

    | `< > >>` | 输入和输出重定向 |

    | `2> 2>>` | 输入和输出重定向 |

    | `\|` | 命令管道 |

    | `* [ ] ?` | 通名创建（通配符匹配） |

    | `;` | 命令分隔 |

    | `&` | 在后台运行命令 |

    | `\|\| &&` | 在特定条件下运行命令 |

    | `{ } ( )` | 分组命令 |


    出于好奇，shellid 通过以下过程将命令行分为单个单词以确定命令：


    | 步骤 |  | 特殊字符 |

    | :--- | :--- | :--- |

    | 1 | 读取直到命令分隔符 | `\n`, `&`, `\|`, `\|\|`, `&&`, `;`, `$(...)`, `\"..."`, `''...''`
    和 标记（命令替换） |

    | 2 | 标记（输入/输出重定向，值赋值） | `$name`，见步骤 1 和 2 的标记 |

    | 3 | 分为单个单词 | `$name`，见步骤 1 和 2 的标记 |

    | 4 | 变量替换 | `$name`，见步骤 1 和 2 的标记 |

    | 5 | 命令替换 | `$name`，根据 IFS 见步骤 1 和 2 的标记 |

    | 6 | 输入/输出重定向 | `<`, `>`, `>>`, `2>`, `2>>` |

    | 7 | 变量赋值 | `name=` |

    | 8 | 分为单词 | |

    | 9 | 创建文件名 | |

    | 10 | 命令执行 | |


    '
- fmt: '

    - In steps 1 and 2, tagging happens for steps 5 to 7 only, and no further action
    takes place. Steps 5 to 7 are executed if tagging is completed. Next, the shell
    removes all the special characters. In step 10 the command-line contains only
    the arguments that are needed to execute the command. The shell interprets the
    first word as the name of the command to be executed, and the remaining words
    are its arguments: `command arg1 arg2 arg3 ...`


    ## 6.3 Available Shells


    Your Linux system allows the usage of various shells. Each shell is available
    as a separate software package through the Debian package manager, `Aptitude`,
    we installed earlier. The list of shells is quite long, so we list only a selection
    of the available shells that are the most popular:![](image_rsrc2BP.jpg)


    - Almquist Shell (ash)![](image_rsrc2BR.jpg)

    - Bourne Again Shell (bash)![](image_rsrc2BS.jpg)

    - Debian Almquist Shell (dash)![](image_rsrc2BT.jpg)

    - Z Shell (zsh)![](image_rsrc2BU.jpg)

    - C Shell (csh)![](image_rsrc2BV.jpg)

    - Korn Shell (ksh)![](image_rsrc2BW.jpg)

    - Tenex C Shell (tcsh)


    Unless otherwise stated, the examples in this guide are based on the Bourne Again
    Shell (bash). At the time of writing this is the default shell on Debian. Which
    other shells are allowed in your Linux system, is set up in the configuration
    file `/etc/shells`. Using the `cat` command, you can see the list of allowed shells.
    `cat` will be discussed in detail in Chapter 7. For now, know that the command
    simply outputs the contents of a file to the screen.


    ```bash

    $ cat /etc/shells

    ```


    ```

    #/etc/shells: valid login shells

    /bin/sh

    /bin/dash

    /bin/bash

    /bin/rbash

    /usr/bin/screen

    ```


    $

    The name of the shell that is currently in use in the terminal, is kept in the
    shell variable named `$0`. The following simple command outputs the shell’s name:


    ```bash

    $ echo $0

    bash

    ```


    $

    To change the shell that is currently in use, have a look at the configuration
    file `/etc/passwd` and the `chsh` command covered in Chapter 10.


    ## 6.4 Shell Scripting


    At first glance, a shell script may sound daunting but it is quite straightforward.
    In the simplest form, it is just a sequence of UNIX/Linux commands that are stored
    in a file, and are executed line-by-line by the command line interpreter. A shell
    script is similar to typing single commands in the terminal, but they are executed
    as a batch. This makes it much faster and helps to automate tasks. For this guide,
    we will not be delving into the programming intricacies of shell scripting. But
    it is worth noting the recommended structure of a shell script.![](image_rsrc2BX.jpg)


    - **Shebang line** - defines which program will be used to properly process the
    instructions that follow the shebang line. The line starts with a `#!` which is
    a two-byte number indicating that the following lines are an executable shell
    script. The shebang is followed by the path to the interpreter or program that
    is to process the instructions.![](image_rsrc2BY.jpg)

    - **Docstring** - a short description of what the script does and the software
    license of the code. This can be a single line but also an extensive description.
    Such lines start with a `#` and are treated as comments by the shell.![](image_rsrc2BZ.jpg)

    - **Commands** - the combination of single commands that are to be executed by
    the shell. As mentioned, this can be as little as a oneline instruction such as
    what we have in our example below, to a fully-fledged program.![](image_rsrc2C0.jpg)

    - **Exit state** - defines the return value(s) of the script. Unless explicitly
    stated otherwise, the exit state of the last command executed in the script will
    be returned. It is common to return 0 on success and a value between 1 and 255
    in the event of an error.


    The following basic script contains all the single elements we mentioned above.
    The purpose of the script is to determine the uptime of the computer.


    ```bash

    #!/bin/bash


    # determine the uptime of the system


    # Released under GNU Public License (GPL)


    uptime


    # define exit state: no error


    exit 0

    ```


    There are two ways to execute a shell script. We can either call a shell such
    as Bash to run it or set the executable flag for the script and run it afterward.
    The first option uses Bash and looks as follows:


    ```bash

    $ bash uptime.sh

    12:20:31 up 7 days, 2:09, 6 users, load average: 0,74, 0,40, 0,27

    ```


    $

    The second method is based on two steps. First, we set the executable flag for
    the script using the `chmod` command as follows:


    ```bash

    $ chmod u+x uptime.sh

    ```


    $Then we can run the script:


    ```bash

    $ ./uptime.sh

    12:26:07 up 7 days, 2:14, 6 users, load average: 0,23, 0,34, 0,28

    ```


    ## 7 Text Processing


    Linux runs on text files for the most part. For example, the configuration files
    that are stored in `/etc` are stored as text files. Linux offers a rich set of
    text processing commands that are quite comprehensive and also time-saving. Knowing
    what they are and how they work will play a vital role in many of the upcoming
    chapters that delve deeper into Linux. In this chapter, we will have a look at
    these commands and show how to use them.


    ### 7.1 Text Processing Commands


    #### cat


    Short for concatenate, `cat` outputs the contents of a file to the screen or standard
    output. The command `cat /etc/passwd` will output all the lines of the file `/etc/passwd`
    to the screen.


    ```bash

    $ cat /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin

    bin:x:2:2:bin:/bin:/usr/sbin/nologin

    sys:x:3:3:sys:/dev: /usr/sbin/nologin

    sync:x:4:65534:sync:/bin:/bin/sync

    games:x:5:60:games:/usr/games:/usr/sbin/nologin

    man:x:6:12:man:/var/cache/man:/usr/sbin/nologin

    lp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologin

    mail:x:8:8:mail:/var/mail:/usr/sbin/nologin

    news:x:9:9:news:/var/spool/news:/usr/sbin/nologin

    ```


    `cat` can also write to a text file using the redirect operator (`>`). To do this,
    simply use the redirect operator and the name of your text file. For example:


    ```bash

    cat > output.txt hello world

    this is a test

    to see if works

    ```


    Follow this by pressing `Ctrl+D` to exit and type `cat output.txt` to see the
    result.


    ```bash

    $ cat output.txt

    hello world

    this is a test

    to see if works

    ```


    $Other useful options for `cat` are: ![](image_rsrc2C1.jpg)`E` (short for `--show-ends`):
    outputs a `$` at the end of each line.![](image_rsrc2C2.jpg)`n` (short for `--number`):
    numbers all output lines.![](image_rsrc2C3.jpg)`s` (short for `--squeeze-blank`):
    suppresses repeated empty output lines.`cat` can also output multiple files at
    once. The command `cat /etc/passwd /etc/group` will output the contents of `/etc/passwd`
    and `/etc/group`. Keep in mind that the original files are not affected. The next
    example below outputs the contents of the file `output.txt` twice and continuously
    numbers all the output lines using the option `-n`.


    ```bash

    $ cat -n output.txt output.txt

    1 hello world

    2 this is a test

    3 to see if works

    4 hello world

    5 this is a test

    6 to see if works

    ```


    $For a more substantial example, we are going to create three text files named
    `file1`, `file2`, and `file3`. Use the commands `cat > file1`, `cat > file2` and
    `cat > file3` to create the files. Do not forget to press `Ctrl+D` to exit and
    use the command `cat file1 file2 file3` to see them all at once.


    ```bash

    $ cat > file1

    this is file one


    $ cat > file2

    this is file two


    $ cat > file3

    this is file three


    $ cat file1 file2 file3

    this is file one

    this is file two

    this is file three

    ```


    $Using the redirect operator, we can then write all three files to a single file.


    ```bash

    $ cat file1 file2 file3 > bigfile

    ```


    $ cat bigfile

    this is file one

    this is file two

    this is file three

    ```


    $tac


    The `tac` command works in the same manner as the `cat` command but displays the
    lines in reverse order. Using `bigfile` from the previous section, let’s display
    the file using `tac`:


    ```bash

    $ tac bigfile

    this is file three

    this is file two

    this is file one

    ```

    '
