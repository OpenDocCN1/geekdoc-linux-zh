- fmt: "\n![](image_rsrc2BG.jpg)The entry `Open Terminal Here` from the context menu\
    \ refers to the GNOME terminal. To see the changes, select the entry `Open Terminal\
    \ Here` from the context menu. The image below shows the terminal window. It comes\
    \ with a white background and a bigger font that is easier to read.![](image_rsrc2BH.jpg)\n\
    \n# 4.5 Exiting Linux\n\nTo use Linux properly, you also have to learn how to\
    \ exit Linux and to reboot the system. Below you will learn how to quit the XFCE\
    \ desktop environment, to shut down the Linux system, and to reboot the system.\
    \ We will look at two methods, the first is based on the graphical interface and\
    \ the second can be used on non-graphical systems like servers and wireless routers.\n\
    \n## Quitting the XFCE Desktop Environment\n\nThe easiest way to quit the XFCE\
    \ desktop and to log out from your current session is to click on the button in\
    \ the right corner of the navigation bar. The button is labeled with your username,\
    \ which in our case is Debian. From the small menu select the last item labeled\
    \ Log Out. Alternatively, you can choose either the item labeled Log Out from\
    \ the button in the upper-left corner.![](image_rsrc2BJ.jpg)A second window opens\
    \ that contains the buttons labeled Log Out, Restart, Shutdown, and Hibernate.\
    \ Click on Log Out to quit your session. Subsequently, you will return to the\
    \ login screen.\n\n## Shutting Down the Linux System\n\nThe way to shut down the\
    \ entire Linux system is similar to exiting XFCE. Click on the button in the right\
    \ corner of the navigation bar and select the Shut Down. From the next dialog\
    \ click the button labeled Shut Down to stop the Linux system. From a terminal\
    \ session, you can run the commands `halt` or `shutdown -h` as an administrative\
    \ user. A regular user is not allowed to issue these commands: `halt`\n\n## Rebooting\
    \ the Linux System\n\nTo restart the Linux system, click on the button in the\
    \ right corner of the navigation bar and select the item labeled Restart. From\
    \ the next dialog click the button labeled Restart to reboot the Linux system.\
    \ From a terminal session, you can run the command `reboot` or `shutdown -r` as\
    \ an administrative user. Again, a regular user is not allowed to issue these\
    \ commands: `reboot`. Subsequently, the system will reboot and you will return\
    \ to the boot screen. ![](image_rsrc2BK.jpg)\n\n# 5 Navigating Linux\n\nFilesystems\
    \ on UNIX/Linux systems contain different types of entries. This includes regular\
    \ files, directories (or folders), symbolic links, block and character devices,\
    \ named pipes, and sockets. This chapter deals with directories and the corresponding\
    \ tools.\n\n## 5.1 The Filesystem Standard (FHS)\n\nModern Linux systems have\
    \ a rather consistent directory structure, which is based on the Filesystem Standard\
    \ (FHS). This definition specifies which main directories exist, and which content\
    \ is stored in them. The FHS is maintained by the Linux Foundation. The latest\
    \ version of FHS is 3.0 and was released back in 2015. The Linux distributions\
    \ mentioned in Chapter 3 follow FHS structure. Below are the common directories\
    \ that are use:\n\n| Directory | Description |\n| :--- | :--- |\n| `/` | Primary\
    \ hierarchy and root directory of the entire filesystem |\n| `/bin` | Essential\
    \ command binaries for all the users |\n| `/boot` | The boot loader |\n| `/etc`\
    \ | contains host-specific system-wide configuration files |\n| `/home` | The\
    \ home directories of the users |\n| `/lib` | Libraries essential for the binaries\
    \ in `/bin` and `/sbin` |\n| `/media` | Mount points for removable media |\n|\
    \ `/proc` | processes and is the virtual filesystem of the Linux kernel |\n| `/root`\
    \ | The home directory for the root user |\n| `/sbin` | Essential system binaries\
    \ |\n| `/tmp` | Temporary data and files |\n| `/usr` | System Resources, contains\
    \ user utilities and applications |\n| `/var` | Variable data, such as log files\
    \ and database files |\n\nSome Linux distributions have additional directories\
    \ like `/opt` or use symbolic links. Linux also has some abbreviations in use\
    \ which can be quite helpful in your daily work:\n\n| Abbreviation | Description\
    \ |\n| :--- | :--- |\n| `$HOME` | A local variable that contains the user's home\
    \ directory |\n| `~` | Points to the user's home directory like `/home/tom` |\n\
    | `.` | Points to the current directory |\n| `..` | Points to the parent directory\
    \ |\n\nYou can use these abbreviations on the command line in a terminal and in\
    \ shell scripts to shorten commands. Next, we will look at some of these commands.\n\
    \n## 5.2 Commands for Directories\n\nAs with files, Linux offers a range of commands\
    \ to list, create, remove and rename directories. You can use these commands in\
    \ your terminal.\n\n### Listing Directories\n\nTo list the directories, use the\
    \ command `ls` with the switch `-d` (short for `--directory`) as follows:\n\n\
    ```bash\nls -d */\nfinances/\nprojects/\nwork/\n...\n```\nThis example lists the\
    \ names of the directories in the current directory. The dotted line (`...`) in\
    \ the output indicates that the list is longer and the output is shortened here.\n\
    \nTwo common ways of using the `ls` command are without any options and with the\
    \ options `-la` (short for `-l -a` which means long-all). The first output displays\
    \ the entry names only for regular files, whereas the second output lists both\
    \ regular and hidden entries. \n\n```bash\nls -la\n```\n\nIn order to list all\
    \ the directories including the hidden ones starting with a period (`.`) use the\
    \ `find` command as follows:\n\n```bash\nfind . -maxdepth 1 -type d\n./projects\n\
    ./.mozilla\n./.ipython\n./.dbus\n./video\n...\n```\n\nThe `tree` command searches\
    \ the directory recursively and outputs an entire directory structure quite nicely.\
    \ The switch `-d` limits the output to directories only and looks as follows:\n\
    \n```bash\ntree -d\n.\n|–––– archive\n| |–––– ballet-zebola\n| | |–––– documents\n\
    | | |–––– invoices\n| | |–––– charles-darwin-university\n| |–––– projects\n|––––\
    \ .dbus\n|–––– .ipython\n|–––– .mozilla\n...\n```\n\n### Creating Directories\n\
    \nTo create a directory, use the `mkdir` command (make directory). The next example\
    \ creates a new entry named `training` in the current directory:\n\n```bash\n\
    mkdir training\n```\n\nThe switch `-v` (short for `--verbose`) prints an additional\
    \ message that the command succeeded. \n\n```bash\nmkdir -v training\nmkdir: directory\
    \ \"training\" created\n```\n\nThe switch `-p` (short for `--parents`) allows\
    \ you to create entire subdirectory structures. Parent directories that do not\
    \ exist yet are created as well. The following example creates the directory `training`\
    \ as well as its subdirectories `linux` (level 1) and `lpic1` (level 2).\n\n```bash\n\
    mkdir -p training/linux/lpic1\n```\n\nTo create two subdirectories on the same\
    \ level, make use of the underlying command line interpreter’s capabilities. The\
    \ Bash uses values in curly brackets `{ }` to achieve this. The next example shows\
    \ you how to create the two directories `training/linux/lpic1` and `training/linux/lpic2`\
    \ in one go:\n\n```bash\nmkdir -p training/linux/{lpic1,lpic2}\n```\n\n### Removing\
    \ Directories\n\nRemoving a directory is done using the `rmdir` command (remove\
    \ directory). The next example removes the entry named `training` in the current\
    \ directory:\n\n```bash\nrmdir training\n```\n\nAs with `mkdir`, the switch `-v`\
    \ (short for `--verbose`) prints an additional message that the command succeeded.\n\
    \n```bash\nrmdir -v training\nmkdir: directory is removed, \"training\"\n```\n\
    \nThis works well, as long as the directory is empty. In case your directory contains\
    \ any entries like files or subdirectories, the `rmdir` command will complain\
    \ when using this message, and keep the directory unchanged:\n\n```bash\nrmdir\
    \ training\nrmdir: failed to remove 'training': Directory not empty\n```\n\nTo\
    \ solve this situation the `rm` command (remove) combined with the switch `-r`\
    \ (short for `--recursive`) becomes quite handy. Then, `rm` removes all the entries\
    \ recursively. The following example combines the two switches `-r` and `-v` to\
    \ delete one file and three directories.\n\n```bash\nrm -rv training/\n\"training/lpic1/introduction.txt\"\
    \ was removed\nDirectory was removed: \"training/lpic1\"\nDirectory was removed:\
    \ \"training/lpic2\"\nDirectory was removed: \"training/\"\n```\n"
