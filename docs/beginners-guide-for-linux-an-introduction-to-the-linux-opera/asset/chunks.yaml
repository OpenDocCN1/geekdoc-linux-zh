    ## 16.2 Local and Remote Users


    The security of a Linux system includes the users and their accounts. In Chapter
    10 we had a look at basic commands such as `w`, `who`, and `users`. Now we will
    address more sophisticated methods of detecting user information.


    To see which local accounts exist, you can have a look at the file `/etc/passwd`
    and verify the entries. The user ID of a regular user account starts at `1000\.`.
    In order to see which local users logged into the system, the `lslogins` command
    can be used. `lslogins` extracts the user information from the different configuration
    files and displays the results in a very nice way. Invoked as a regular user without
    further switches, it displays the user ID, the account name, the number of logins,
    and the content of the GECOS field.![](image_rsrc2J5.jpg)


    Invoked as an administrative user, `lslogins` adds the information for the two
    columns `PWD-LOCK` and `PWD-DENY`. These columns show if the associated account
    is locked or if login via password was denied.![](image_rsrc2J6.jpg)


    In order to see the detailed information for a specific user, `lslogins` utilizes
    the switches `-u` followed by a username, as well as `--time iso` to display the
    time in a readable format.


    ### lslogins -u user --time iso


    ```

    Username: user

    UID: 1000

    Gecos field: Debian User,123,456,135

    Home directory: /home/user

    Shell: /bin/bash

    No login: no

    Password is locked: no

    Password not required: no

    Login by password disabled: no

    Primary group: user

    GID: 1000

    Supplementary groups: Bluetooth, cdrom, floppy, audio, dip, video, plugdev, netdev
    Supplementary group IDs: 111, 24, 25, 29, 30, 44, 46, 108

    Hushed: no

    Password expiration warn interval: 7

    Password changed: 2018-08-20

    Maximum change time: 99999

    Running processes: 32

    Last logs:

    2020-10-05T12:11:19+0200 systemd[438]: Time has been changed

    2020-10-05T12:11:52+0200 systemd[438]: Time has been changed

    2020-10-05T12:12:24+0200 systemd[438]: Time has been changed

    ```


    As explained above, `lslogins` evaluates the local login attempts only. To retrieve
    login attempts from remote systems, use the `getent` command. It also evaluates
    databases that support the Name Service Switch library (NSS) which is configured
    in `/etc/nsswitch.conf` and covers services like Lightweight Directory Access
    Protocol (LDAP) and Network Information Systems (NIS). To get information for
    user `caro` invoke `getent` as follows:


    ```bash

    $ getent passwd caro

    ```

    caro:x:1005:1005:Caro,,,:/home/caro:/bin/bash

    ```


    The two commands `last` and `lastlog` can also be used to show which users logged
    in last. `last` reports a detailed login as shown below. The columns contain the
    username, the terminal, and the session information.


    ```bash

    $ last

    ```

    user pts/13 :0 Fri Oct 5 14:11 - 14:24 (00:13 elapsed)

    ```

    `lastlog` prints the statistics for which users logged in last. The first example
    shows this for all users and the second for a specific user.![](image_rsrc2J7.jpg


    ## 16.3 Restricting Remote Access


    Linux has the ability to limit remote access to the system. The two files `/etc/hosts.allow`
    and `/etc/hosts.deny` regulate access from other systems. The limitation covers
    single hosts, IP addresses, and entire network segments. The file `/etc/hosts.allow`
    explicitly allows access, and `/etc/hosts.deny` forbids access. Because access
    to a service is allowed in `/etc/hosts.allow`, a rule denying access to that service
    in `/etc/hosts.deny` is ignored.


    The first example illustrates how to limit access via SSH for all devices that
    have a hostname ending in `example.net`:


    ```

    /etc/hosts.allow

    ALL: all

    ```

    ```

    ssh: .example.net

    ```

    The second example limits access for devices that have an IP address from the
    `192.168.30.*` subnet:


    ```

    /etc/hosts.allow

    ALL: all

    ```

    ```

    sshd: : 192.168.30.*

    ```

    The third example shows how to allow access for all devices that have a hostname
    ending in `example.net` except `login.example.net`:


    ```

    /etc/hosts.allow

    sshd : .example.net EXCEPT login.example.net

    ```

    Note that TCP-wrapped services do not cache the rules from the host files, so
    any changes to `/etc/hosts.allow` or `/etc/hosts.deny` will take effect immediately
    without restarting network services.


    ## 16.4 Unused Software


    Apart from ports and accounts, we must also have a look at the software that is
    installed on the system. As we mentioned earlier, when it comes to software, the
    less the better. Install only those packages that you really need. If there are
    unwanted packages that provide services that are not in use, remove them. The
    fewer packages installed, the less chance of unpatched code and security issues.


    Software packages that are left-overs can be identified using `deorphan`. The
    example below shows that `deorphan` discovered two packages, `iceweasel` and `netcat`.
    The first column displays the package size, followed by the package category (`main/oldlibs`),
    the package name, and then the package class (`extra`).


    ```bash

    $ deorphan -szP

    235 main/oldlibs iceweasel extra

    32 main/oldlibs netcat extra

    ```

    Packages that are no longer needed can be removed using the command below. This
    cleans the system from unused libraries and old dependencies that are left over.

    ```bash

    $ apt-get autoremove

    ```

