    ![](img/image_rsrc28F.jpg)

    提供的支持：支持可以是免费的（基于社区），也可以是付费的（基于支持合同）。在选择发行版时，我们建议选择一个稳定、定期更新且符合你使用 PC 真实初衷的版本。在下方，你将找到每种主要
    Linux 发行版的简要描述。


    ![](img/image_rsrc28G.jpg)

    ### Debian GNU/Linux

    Debian GNU/Linux（简称 Debian）建立于 1993 年，是一个遵循 GNU 标准的完全免费且基于局域的工作框架。超过 1,000 名设计人员自愿地持续投入工作。Debian
    的改进背后没有公司，这意味着其中不涉及任何商业利益。


    其一个主要目标是为有效传递服务的 PC 提供一个稳定且稳固的工作框架。它面向那些明确自己需要的客户，Debian 工程师也维护并使用他们自己的产品。软件包以
    `.deb` 格式提供，并根据相应的许可证进行分类：


    ![](img/image_rsrc28H.jpg)

    - `Main`：自由软件。

    ![](img/image_rsrc28J.jpg)

    - `Contrib`：依赖非自由软件的自由软件。

    ![](img/image_rsrc28K.jpg)

    - `Non-free`：具有非自由许可证的软件包。


    Debian 在服务器和工作站框架上运行良好。它支持广泛的设计，如 `ARM EABI (arm)`、`IA-64 (Itanium)`、`MIPS`、`MIPSel`、`powerpc`、`s390`（32
    和 64 位），以及 `sparc`、`i386`（32 位）和 `amd64`（64 位）。每个版本的代号取决于电影《玩具总动员》中的人物名字，例如 Debian
    GNU/Linux 9 的 `Stretch` 和 Debian GNU/Linux 10 的 `Buster`。


    ![](img/image_rsrc28M.jpg)

    ### Ubuntu

    Ubuntu 是一个由 Canonical 公司资助的免费 Linux 发行版。它依赖于 Debian，但更关注新手。这就是为什么它为每个任务只包含一个工具。Ubuntu
    组以整合需要稳定性的扩展和组件而闻名。这是我们在与新手交流时听到的最大的抱怨之一。对于这类新手，我们不建议业学者使用 Ubuntu。名气并不等同便利。我们的主要建议是
    Debian，Mint 是一个不错的次选方案。


    软件包以 `.deb` 格式提供，并根据 Canonical 的支持情况分类：


    ![](img/image_rsrc28N.jpg)

    - `Main`：由 Canonical 支持的自由软件。

    ![](img/image_rsrc28P.jpg)

    - `Restricted`：由 Canonical 支持的非自由软件。

    ![](img/image_rsrc28R.jpg)

    - `Universe`：不受支持的自由软件。

    ![](img/image_rsrc28S.jpg)

    - `Multiverse`：不受支持的非自由软件。


    Ubuntu 有三个授权版本：Ubuntu Desktop、Ubuntu Server 和 Ubuntu Core（用于物联网）。支持多种架构，如 `i386`、`IA-32`、`amd64`、`ARMhf
    (ARMv7 VFPv3-D16)`、`ARM64`、`powerpc (64 bit)` 和 `s390x`。最初于 2004 年发布，每年发布两次：一次在
    4 月，一次在 10 月。发布版本通过版本号反映：`18.04` 指 2018 年 4 月发布。版本的代号基于一个形容词和一种动物，例如 Ubuntu 14.10
    的 `Utopic Unicorn`。


    ![](img/image_rsrc28T.jpg)

    ### Linux Mint

    Linux Mint 旨在提供一种 Windows 客户会欣赏的更自然的工作体验，同时提供开箱即用的硬件、视觉和音效支持。Mint 的 Cinnamon 桌面版本因其与
    Windows 环境相似而深受粉丝青睐，甚至支持类似的键盘快捷键。由于其良好的稳定性，我们可以放心地推荐这个发行版。


    Mint 是一个依赖于 Ubuntu 的非商业发行版，并遵循类似的发布策略。底层发行版可以追溯到 2006 年。从 2014 年开始，在 Ubuntu 发布一个月后，每年发布两次版本。版本的代号是以
    "a" 结尾的女性名字，例如版本 6 的 `Felicia`。Linux Mint 支持 `IA-32` 和 `amd64` 两种设计。


    ![](img/image_rsrc28U.jpg)

    ### Red Hat Enterprise Linux (RHEL)

    RHEL 是一个商业 Linux 发行版。它依赖于 Red Hat Linux（发布于 1995 年至 2004 年之间）或更多的 Fedora 19 和
    20。其独特版本追溯到 2000 年。它对商业客户的关注包含了长期支持、准备和认证计划（见第 1 章）。Red Hat 的社区项目被称为 Fedora（见下文）。


    软件包以 `.rpm` 格式（Red Hat 软件包管理器）提供。RHEL 支持 `arm (64 bit)`、`i386`、`amd64`、`powerpc`
    以及 `s390` 和 `zSeries`。该版本针对服务器和工作站。版本的代号给人一种随机的感觉，因为它没有遵循 Debian 或 Ubuntu 使用的计划。


    ![](img/image_rsrc28V.jpg)

    ### Fedora

    Fedora 是一个面向工作站客户的社区 Linux 发行版。它依赖于 Red Hat Enterprise Linux (RHEL) 并由 Red Hat
    支持。它于 2003 年 Red Hat Linux 支持结束时发布。从 2020 年开始，它提供以下版本：


    ![](img/image_rsrc28W.jpg)

    - `Workstation`：用于 PC。

    ![](img/image_rsrc28X.jpg)

    - `Server`：用于服务器。

    ![](img/image_rsrc28Y.jpg)

    - `IoT`：用于物联网生态系统。


    Fedora 支持 `amd64`、`armhf`、`powerpc`、`MIPS`、`s390` 和 `RISCV` 模型。该版本的周期较短，另一个版本通常像时钟一样准时跟随。版本的代号没有特定的命名计划，通常由城市名称组成。


    ![](img/image_rsrc28Z.jpg)

    ### CentOS

    CentOS 源自 Community Enterprise Operating System。与 Fedora 类似，它依赖于 RHEL 并在软件包方面保持兼容。这允许在
    CentOS 上使用最初基于 RHEL 开发和提供的软件。与 Fedora 不同，它专注于两个工作站和服务器的大企业级用途，并提供长期支持。CentOS 的底层版本追溯到
    2004 年 5 月。软件包来自三个不同的仓库：


    ![](img/image_rsrc290.jpg)

    - `Base`：常规、稳定的软件包。

    ![](img/image_rsrc291.jpg)

    - `Updates`：安全、错误修复或增强更新。

    ![](img/image_rsrc292.jpg)

    - `Addons`：构建构成主 CentOS 发行版的大软件包所需的包，但上游未提供。


    CentOS 适用于 `i386` 和 `amd64` 模型。不支持其他模型。


    ![](img/image_rsrc293.jpg)

    ### openSUSE

    Linux 发行版 openSUSE 的基础是 SUSE Linux 循环和商业版的 SUSE Linux Professional，后者于 1994 年发布第一个版本。SUSE
    的名称是第一家德国所有者 Gesellschaft für Software-und Systementwicklung GmbH 的缩写。


    OpenSUSE 依赖于 Red Hat Linux 和 Slackware 的构建，并采用 `.rpm` 作为软件包格式。它适用于 `i586`、`x86-64`
    和 `ARM` 设计。openSUSE 项目旨在像时钟一样准时交付另一个版本。与 Fedora 类似，版本的代号没有遵循良好的命名方案。


    ![](img/image_rsrc294.jpg)

    ### Arch Linux

    Arch Linux 是一个免费 Linux 发行版，于 2002 年发布第一个版本。它遵循滚动更新的标准，这使得应用程序每月更新一次。目前，核心小组由约
    25 名设计人员组成，并由许多工程师（受信用户）支持。Arch Linux 使用 `Pacman` 作为软件包管理框架。软件包存储在四个仓库中：


    ![](img/image_rsrc295.jpg)

    - `Core`：用于基础系统的软件包。


    ![](img/image_rsrc296.jpg)

    - `Extra`：额外的软件包，如桌面环境和数据库。


