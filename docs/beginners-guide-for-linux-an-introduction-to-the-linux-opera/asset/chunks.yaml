    for the KDE desktop environment. Konqueror offers simple file management functionalities
    such as copying, moving, searching, and deleting files and directories, plus some
    advanced features and functionalities such as access to archives, browse and rip
    audio CDs, and support for access to FTP and SFTP servers and SAMBA (Windows)
    shares.Nautilus


    https://wiki.gnome.org/Apps/NautilusNautilus is the file manager on the GNOME
    desktop. It offers easy navigation and management of files on a Linux system.
    This includes simple file management functionalities such as copying, moving,
    searching, and deleting files and directories, as well as easy access to local
    and remote files.Dolphin


    www.kde.org/applications/system/dolphin/Dolphin is a lightweight file manager
    developed as part of the KDE applications package. Designed for simplicity, flexibility,
    and full customization, it allows users to browse, locate, open, copy, and move
    files around a Linux system with a lot of ease.Thunar


    https://docs.xfce.org/xfce/thunar/startThunar is a modern, lightweight file manager
    for the XFCE desktop. It is designed to be fast, responsive, and easy to use.
    We list it here because it has a clean and intuitive interface with important
    user options available.6\. Introduction to Terminals and ShellsWorking with the
    Linux operating system requires you to know about the terminal and the command
    line. It is essential to know what these are and to be slightly familiar with
    their usage and the standard commands available. But don’t fear, we will describe
    each in detail. These terms sound much more intimidating than they are in reality.The
    ability to communicate with the system in a text-based format is one reason why
    programmers have a soft spot for Linux, as this is the normal way for programmers
    to give instructions to computers. Another reason is the absolute control this
    allows you over the system that other operating systems just cannot provide, even
    with their own command line interpreters.Some beginners have even reported that
    using and becoming familiar with issuing commands in this text-based format has
    made the transition to program development much easier and quicker.6.1 What is
    a Terminal?A terminal is described as “a program that emulates a video terminal
    within some other display architecture. Though typically synonymous with a shell
    or text terminal, the term terminal covers all remote terminals, including graphical
    interfaces. A terminal emulator inside a graphical user interface is often called
    a terminal window”.To be precise, a terminal is simply the outer software. Inside
    a terminal runs a command line interpreter that is called a shell. The terminal
    is your way of interacting with the shell via a GUI.Debian supports a long list
    of terminal software. This includes the Aterm, as well as the GNOME terminal,
    the Kterm, the Mate Terminal, the Rxvt, the Xterm, and the Xvt. These different
    implementations of terminal software vary in terms of stability, support for character
    sets, design, colors and fonts, as well as the possibility to apply background
    images or work with transparencyIn this book, we will use the GNOME terminal because
    of its stability, simplicity, and adjustability. To increase and decrease the
    size of the content that is displayed inside the terminal window, use the two-key
    combinations CTRL+ and CTRL-.6.2 What is a Shell?Simply speaking, a shell is a
    sophisticated command-line interpreter. The shell reads your commands, modifies
    them under certain conditions, and then executes the result.Between reading from
    the command-line and the execution of the actual result, the shell has to interpret
    special characters that are part of your input. The table below displays the available
    special characters:Character


    $name


    name=


    ''command''


    $( command ) < > >> 2> 2>> |


    " '' \Meaning


    Substitution of a variable Assignment of a variable Substitution of a command
    Substitution of a command Redirection of input and output Pipelining of commands


    Quoting


    * [ ] ? Creation of file names (globbing) ; Separation of commands


    & Run the command in the background || && Run the commands under certain conditions
    { } ( ) Cramp commandsPurely for interest, the shell divides the command-line
    into single words to determine the commands, through the following process:


    Step Description Special Characters1 Read until the command separator \n & | ||
    && ; $(...) \ "..." ''...'' and tagging (substitution of


    commands)2 Tagging (input-/output redirection, assignment of values)3 Division
