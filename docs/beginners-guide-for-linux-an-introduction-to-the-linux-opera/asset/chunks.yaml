    ### pgrep

    `pgrep` 是用于进程的 `grep` 命令（之前见过过）。该命令遍历当前运行的进程，并输出匹配给定模式的进程 ID。


    下面的示例展示了两次调用。第一次调用请求 `pgrep` 搜索名称中包含 `xterm` 字符串模式的进程，并只输出结果进程 ID。第二次调用使用了两个选项
    `-l`（`-list-name` 的缩写）和 `-a`（`--list-full` 的缩写）来显示进程 ID 和对应的进程名称。


    ```bash

    $ pgrep xterm

    741

    $ pgrep -la xterm

    741 xterm

    749 xterm

    ```


    ### top and htop

    `top` 命令根据活动情况显示进程。最活跃的进程位于顶部，随后是活跃程度较低的进程。列表每秒更新一次。单列包含进程 ID (PID)、进程所有者的用户名
    (`USER`)、进程优先级 (`PR`)、nice 值 (`NI`)、虚拟内存使用 (`VIRT`)、保留内存 (`RES`)、共享内存 (`SHR`)、CPU
    和内存使用百分比 (`%CPU` 和 `%MEM`)、进程运行时间 (`TIME`) 以及用于调用进程的命令 (`COMMAND`)。


    `htop` 是一个额外的软件包（请参考第 4 章和第 14 章关于安装额外软件包的内容），包含一个更具交互性的 `top` 版本。列的布局与 `top`
    。使用导航键和功能键来选择、排序或删除进程。


    功能键如下：

    - `F1`: 显示帮助。

    - `F2`: 配置 htop。

    - `F3`: 在进程列表中搜索。

    - `F4`: 过滤终端输出。

    - `F5`: 将进程显示为进程树。

    - `F6`: 更改进程的排序顺序。

    - `F7`: 降低选中进程的 nice 值。

    - `F8`: 增加选中进程的 nice 值。

    - `F9`: 终止选中进程。

    - `F10`: 退出程序。


    ## 15.2 前台进程与后台进程

    进程有两种：前台进程和后台进程。前台进程通过终端会话初始化并控制。换句话说，必须有用户连接系统才能启动这些进程，且进程在执行期间会占用终端。相比之下，后台进程不连接终端，不需要显式的任何用户输入。因此，它们在等待完成时不占用终端，允许你运行多个进程。


    可以使用 `&` 符号在后台初始化进程。


    ```bash

    $ process1 &

    ...

    ```


    要将运行中的进程发送到后台，请使用 `bg` 命令加上作业 ID。或者使用 `fg` 将进程发送到前台。你可以使用 `jobs` 命令显示当前正在运行的作业及其相关的作业
    ID。


    ```bash

    $ process1 &

    $ process2 &

    $ jobs

    [1]+ Running process1

    [2]- Running process2

    ```


    ## 15.3 停止与终止进程

    如果一个运行中的程序无响应并导致系统负载过高，我们可以做什么来停止并移除它？幸运的是，我们有几个选项可以让我们向程序发送特定信号来停止它。在此情况下使用的命令是
    `kill` 命令以及相应的选项。其中，我们有以下选项：


    - `SIGHUP` (1) - 挂断信号。程序可以监听此信号并对其采取行动。当你关闭终端时，此信号会被发送给运行在终端中的进程。

    - `SIGINT` (2) - 中断信号。此信号被发送给进程以中断它们。程序可以处理此信号并对其采取行动。你也可以通过在运行程序的终端窗口中输入 `CTRL+C`
    直接签发出此信号。

    - `SIGTERM` (15) - 终止信号。此信号被发送给进程以将其终止。同样，程序可以处理此信号并对其采取行动，例如在终止之前将数据写入文件。这是 `kill`
    命令在未指定信号时发送的默认信号。

    - `SIGKILL` (9) - 强制杀死信号。此信号会导致 Linux 内核立即终止进程。程序无法监听此信号。


    要终止并杀死名为 `hangingProgram` 的程序，你必须首先识别该程序。你可以通过使用 `pgrep` 如下找到相关的进程：


    ```bash

    $ pgrep hangingProgram

    3167

    ```


    接下来，向识别出的进程发送 `SIGTERM` 信号：


    ```bash

    $ kill -SIGTERM 3167

    ```


    作为替代，你可以按照如下方式调用 `kill`：


    ```bash

    $ kill -15 3167

    ```


    或者你可以通过按下 `CTRL+Z` 停止挂起的进程，然后使用此命令删除进程：


    ```bash

    $ kill -SIGKILL 3167

    ```


    如上所示，该命令的效果相同：


    ```bash

    $ kill -9 3167

    ```


    ## 15.4 调整进程优先级

    你机器的处理器可以同时管理多个任务。我们可以为 CPU 在查看不同待执行任务时设定遵循的指南。这些指南被称为 niceness 或 nice 值。Linux
    的 niceness 范围从 -20 到 19，数字越小代表任务的优先级越高。如果 nice 值很高（如 19），该任务将被设置为最低优先级，CPU 将在任何有机会时处理它。默认
    nice 值为零。


    你可以使用 `ps` 如下显示进程的 nice 值：


    ```bash

    $ ps -o pid,comm,nice -p 1808

    PID COMMAND NI

    1808 bash 0

    ```


    第一列包含进程 ID (`PID`)，第二列包含命令，第三列包含 nice 值 (`NI`)。如上面的示例所示，PID 为 `1808` 的 `bash`
    进程的 nice 值为 0。可以使用 `renice` 命令调整现有进程的 nice 值。要将上述进程的 nice 值降低到 10，执行以下命令。请记住，只有
    root 用户可以对进程应用负的 nice 值。


    ```bash

    $ renice 10 -p 1808

    ```


    ## 16 系统与网络安全

    本章的核心思想是建立对如何设置和运行安全系统的基本理解。在接下来的部分中，我们将关注更具实操性的方法，查看开放端口的检测、现有及活跃用户、限制远程访问、更新软件以及利用可用的计算能力。


    ### 16.1 开放端口

    如果你从一开始就跟着操作，可能记得我们在安装 Linux 发行版时采用了极简安装。我们只安装了实际需要的软件包，并在以后需要时事后安装其他软件。我们建议所有新安装都这样做，因为其结果是一个非常精简、高性能且所需资源最少的系统。第二个原因是有限的软件限制了系统内部潜在安全问题的数量。


    作为下一步，我们将检查从 Linux 系统外部可用的服务数量。这被称为端口扫描。协助我们的工具是命令行工具 `netcat` 和 `nmap`（Network
    Mapper 的缩写），以及其图形版本 `zenmap`。


    #### netcat

    以下 `nc` (`netcat`) 命令开始扫描本地桌面系统 (`localhost`) 在端口 1 到 1024 之间的可用网络服务。`-zv` 选项启用端口的详细扫描：


    ```bash

    $ nc -zv localhost 1-1024

    localhost [127.0.0.1] 631 (ipp) open

    localhost [127.0.0.1] 111 (sunrpc) open

    localhost [127.0.0.1] 80 (http) open

    ```

