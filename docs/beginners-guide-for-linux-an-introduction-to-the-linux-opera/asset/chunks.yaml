    ![](img/image_rsrc2BG.jpg)右键菜单中的 `Open Terminal Here` 项指向 GNOME 终端。要查看更改，请从右键菜单中选择
    `Open Terminal Here`。下面的图片显示了终端窗口。它具有白色背景和更大的字体，更容易阅读。![](img/image_rsrc2BH.jpg)


    # 4.5 退出 Linux


    为了正确使用 Linux，你还需要学习如何退出 Linux 以及重启系统。在下面，你将学习如何退出 XFCE 桌面环境、关闭 Linux 系统以及重启系统。我们将介绍两种方法：第一种基于图形界面，第二种用于服务器和无线路由器等非图形化系统。


    ## 退出 XFCE 桌面环境


    退出 XFCE 桌面并退出当前会话简单的方法是点击导航栏右上角的按钮。该按钮标记有你的用户名，在我们的例子中是 Debian。从弹出菜单中选择最后一个标记为
    Log Out（注销）的选项。或者，你可以选择左上角按钮中的 Log Out 选项。![](img/image_rsrc2BJ.jpg)会打开第二个窗口，其中包含
    Log Out（注销）、Restart（重启）、Shutdown（关机）和 Hibernate（休眠）按钮。点击 Log Out 退出会话。随后，你将返回登录界面。


    ## 关闭 Linux 系统


    关闭整个 Linux 系统的方法与退出 XFCE 类似。点击导航栏右上角的按钮并选择 Shut Down（关机）。在接下来的对话框中点击 Shut Down
    按钮停止 Linux 系统。在终端会话中，你可以以管理员身份运行 `halt` 或 `shutdown -h` 命令。普通用户不允许执行这些命令：`halt`


    ## 重启 Linux 系统


    要重启 Linux 系统，点击导航栏右上角的按钮并选择 Restart（重启）项。在接下来的对话框中，点击 Restart 按钮重启 Linux 系统。在终端会话中，你可以以管理员身份运行
    `reboot` 或 `shutdown -r` 命令。同样，普通用户不允许执行这些命令：`reboot`。随后，系统将重启，你也会返回启动界面。![](img/image_rsrc2BK.jpg)


    # 5 Linux 导航


    UNIX/Linux 系统上的文件系统包含不同类型的条目。包括普通文件、目录（或文件夹）、符号链接、块设备和字符设备、命名管道和套接字（sockets）。本章将涉及目录及相应的工具。


    ## 5.1 文件系统标准 (FHS)


    现代 Linux 系统具有相当一致的目录结构，该结构基于文件系统标准 (FHS)。此定义规定了哪些主目录以及其中存储了哪些内容。FHS 由 Linux 基金会维护。FHS
    的最新版本是 3.0，于 2015 年发布。第 3 章提到的 Linux 发行版遵循 FHS 结构。以下是常用的目录：


    | 目录 |  |

    | :--- | :--- |

    | `/` | 整个文件系统的主层次结构和根目录 |

    | `/bin` | 所有用户的基本命令二进制文件 |

    | `/boot` | 引导加载 |

    | `/etc` | 特定主机的系统级配置文件 |

    | `/home` | 用户的家目录 |

    | `/lib` | `/bin` 和 `/sbin` 中二进制文件必需的库 |

    | `/media` | 可移动介质的挂载点 |

    | `/proc` | 进程，是 Linux 内核的虚拟文件系统 |

    | `/root` | root 用户的家目录 |

    | `/sbin` | 关键系统二进制文件 |

    | `/tmp` | 临时数据和文件 |

    | `/usr` | 系统资源，包含用户程序和应用程序 |

    | `/var` | 可变数据，如日志文件和数据库文件 |


    某些 Linux 发行版拥有额外的目录如 `/opt` 或使用符号链接。Linux 还有一些常用的缩写，这对你的日常工作非常有帮助：


    | 缩写 | 描述 |

    | :--- | :--- |

    | `$HOME` | 包含用户家目录的本地变量 |

    | `~` | 指向用户家目录，例如 `/home/tom` |

    | `.` | 指向当前目录 |

    | `..` | 指向父目录 |


    你可以在终端命令行和脚本中使用这些缩写来缩短命令。接下来，我们将查看其中一些命令。


    ## 5.2 目录命令


    与文件一样，Linux 提供了一系列命令来列出、创建、删除和重命名目录。你可以在终端中使用这些命令。


    ### 列目录


    要列出目录，请使用 `ls` 命令配合开关 `-d`（`--directory` 的缩写），如下所示：


    ```bash

    ls -d */

    finances/

    projects/

    work/

    ...

    ```

    此示例列出了当前目录下的目录名称。输出中的点号（`...`）表示列表更长，此处进行了缩短。


    使用 `ls` 命令的两种常用方式：不带任何选项，以及带有选项 `-la`（`-l -a` 的缩写，意为详细显示所有）。第一个输出仅显示普通文件的条目名称，而第二个输出则列出普通文件和隐藏条目。


    ```bash

    ls -la

    ```


    要列出包括以点（`.`）开头的隐藏目录在内的所有目录，请如下使用 `find` 命令：


    ```bash

    find . -maxdepth 1 -type d

    ./projects

    ./.mozilla

    ./.ipython

    ./.dbus

    ./video

    ...

    ```


    `tree` 命令递归搜索目录并非常漂亮地输出整个目录结构。开关 `-d` 将输出限制为目录，显示如下：


    ```bash

    tree -d

    .

    |–––– archive

    | |–––– ballet-zebola

    | | |–––– documents

    | | |–––– invoices

    | | |–––– charles-darwin-university

    | |–––– projects

    |–––– .dbus

    |–––– .ipython

    |–––– .mozilla

    ...

    ```


    ### 创建目录


    要创建目录，请使用 `mkdir` 命令（make directory）。下一个示例在当前目录下创建一个名为 `training` 的新条目：


    ```bash

    mkdir training

    ```


    开关 `-v`（`--verbose` 的缩写）会打印一条确认命令执行成功的额外信息。


    ```bash

    mkdir -v training

    mkdir: directory "training" created

    ```


    开关 `-p`（`--parents` 的缩写）允许你创建整个子目录结构。尚的父目录也会被创建。以下示例创建了目录 `training` 及其子目录 `linux`（第
    1 层）和 `lpic1`（第 2 层）。


    ```bash

    mkdir -p training/linux/lpic1

    ```


    要在同一级创建两个子目录，请利用底层命令行解释器的功能。Bash 使用大括号 `{ }` 中的值来实现这一点。下一个示例展示了你如何一次性创建 `training/linux/lpic1`
    和 `training/linux/lpic2` 两个目录：


    ```bash

    mkdir -p training/linux/{lpic1,lpic2}

    ```


    ### 删除目录


    删除目录使用 `rmdir` 命令（remove directory）。下一个示例删除了当前目录中名为 `training` 的条目：


    ```bash

    rmdir training

    ```


    与 `mkdir` 一样，开关 `-v`（`--verbose` 的缩写）会打印一条命令执行成功的额外信息。


    ```bash

    rmdir -v training

    mkdir: directory is removed, "training"

    ```


    只要目录是空的，这种方法就有效。如果你的目录包含任何文件或子目录等条目，`rmdir` 命令在使用此信息时会报错并保持目录不变：


    ```bash

    rmdir training

    rmdir: failed to remove ''training'': Directory not empty

    ```


    为了解决这种情况，`rm` 命令（remove）配合开关 `-r`（`--recursive` 的缩写）变得非常实用。此时，`rm` 会递归删除所有条目。以下示例结合了开关
    `-r` 和 `-v` 来删除一个文件和三个目录。


    ```bash

    rm -rv training/

    "training/lpic1/introduction.txt" was removed

    Directory was removed: "training/lpic1"

    Directory was removed: "training/lpic2"

    Directory was removed: "training/"

    ```


