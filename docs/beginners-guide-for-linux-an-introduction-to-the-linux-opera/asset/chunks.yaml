    aufsautofs

    autofs4

    bdev

    befs

    bfs

    binfmt_misc

    binfmt_misc.ko

    btrfs

    cachefiles

    ceph

    ...

    The following command extends the commands from above in order to mount the first
    partition of the second SCSI disk (`/dev/sdb1`) as `/space` using an `ext3` filesystem:


    ```bash

    mount -t ext3 /dev/sdb1 /space

    ```


    ## 12.5 Unmounting a Filesystem

    If the filesystem is busy or in use, it cannot be unmounted. To find out which
    programs are using the filesystem the `lsof` command from the `lsof` package comes
    into play. `lsof` is short for list of open files. The example below demonstrates
    how to use the command, and shows this for the directory `/home/user/Music`.![](image_rsrc2GJ.jpg)

    This gives a list of programs that are using the directory. Also, if a user is
    working in that directory, you will have to change the directory with the `cd`
    command. To unmount the directory `/space` which we mounted in the previous section,
    you must again be logged in as a root user. Next, test if any other programs are
    using `/space` by invoking the command `lsof /space`. If any programs are running,
    stop them and try again. Also, make sure that no terminals are connected to `/space`.


    ```bash

    su

    Password:

    # lsof /space

    ...

    ```


    Then type `umount /space`. If you do not get an error message, then `/space` was
    successfully unmounted. Alternatively, run the `umount` command with the option
    `-v` (short for `--verbose`) to see the transaction message. Finally, type `df
    -k` to see the new partition state.


    ```bash

    umount /space

    # exit

    ```


    ## 12.6 Automating Mount Points

    To automatically mount a mount point during startup of the system, add an entry
    in the configuration file `/etc/fstab`. `fstab` abbreviates file system table.
    The example below displays the content of the configuration file:


    ```bash

    # cat /etc/fstab


    # /etc/fstab: static file system information.

    #

    # Use ''blkid'' to print the universally unique identifier for a

    # device; this may be used with UUID= as a more robust way to name

    # devices that works even if disks are added and removed. See

    # fstab(5).

    #

    # <file system><mount point><type><options><dump><pass>

    # / was on /dev/sda1 during installation

    UUID=dc78e6f6-8a4f-4be0-9192-e4ca37838765 / ext4 errors= 0 1defaults 0 2

    # /home was on /dev/sda7 during installation

    UUID=ac2823cc-a7b4-4bf3-808e-e13401e11eaf /home ext4

    # /tmp was on /dev/sda5 during installation

    UUID=faef6770-b865-43d2-b1f6-56352413d7c4 /tmp ext4 defaults 0 2

    # /var was on /dev/sda6 during installation

    UUID=d2f4fd43-4f76-414c-9afa-6a53d4cd1d9c /var ext4 defaults 0 2

    # swap was on /dev/sda2 during installation

    UUID=9ef7106a-c885-4cbe-aaa1-8e2b77ee73cf none swap sw 0 0

    /dev/sr0/media/cdrom0 udf,iso9660 user,noauto 0 0

    ```


    The columns (fields) in the file `/etc/fstab` are:


    ![](image_rsrc2GK.jpg)

    `filesystem` - specifies the UUID (`UUID=xxxxx`), name (`/dev/sdb1`), or the label
    of the filesystem (`LABEL=home`).![](image_rsrc2GM.jpg)

    `mount point` - defines the directory where the filesystem will be mounted.![](image_rsrc2GN.jpg)

    `type` - a comma-separated list of allowed filesystem types.![](image_rsrc2GP.jpg)

    `options` - a comma-separated list of options.![](image_rsrc2GR.jpg)

    `dump` - dump information in file with 0 = off and 1 = on.![](image_rsrc2GS.jpg)

    `pass` - the order the filesystem is checked, starting with 1. 0 means last. Keep
    in mind that the single columns are separated by a tabulator and spaces do not
    work properly. Tip: To find the UUID for the mount point, look in `/dev/disk/by-uuid`.


    To add a device to mount automatically, extend the file `/etc/fstab` by simply
    adding a line. In order to mount the partition `/dev/sdb1` as `/space` with an
    `ext3` filesystem at startup, add this line on older systems:


    ```text

    /dev/sdb1 /space ext3 defaults 0 0

    ```


    On contemporary systems that support UUIDs, use the following line. Note to replace
    the value of `7ca005b2-a7ff-4757-bfdf-81004d4072ef` with the UUID of your partition:

    ```text

    UUID=7ca005b2-a7ff-4757-bfdf-81004d4072ef /space ext3 defaults 0 0

    ```

    Now `/dev/sdb1` will always be mounted as `/space` at startup. You may wonder
    what the advantage is of using a UUID. By using a UUID the partition is clearly
    identified, even if the order of the disks changes. To generate a UUID (or to
    regenerate a new one) use the `uuidgen` command line tool. It offers two options.
    The first is `-r` (short for `--random`) which generates a random-based UUID.
    This method creates a UUID consisting mostly of random bits. This is the default
    value if not explicitly specified.


    ```bash

    uuidgen -r

    4d545248-cf36-4d24-91ab-64a9ed276072

    ```


    The second option is `-t` (short for `--time`) which generates a time-based UUID.
    This method creates a UUID based on the system clock plus the system’s ethernet
    hardware address if present.


    ```bash

    uuidgen -t

    4afa1166-bcf1-11e8-9a0a-68f728ff3d63

    ```

    The `uuidgen` command writes the newly generated UUID to stdout. You can copy
    and paste the new UUID directly into `/etc/fstab to have a unique identifier for
    a partition to be referenced.


    ## 12.7 Setting up New Partitions

    The idea behind `fdisk` and its counterparts, `cfdisk` and `gparted`, is to view
    the partitions on a disk and to add, remove or edit partitions. In this section,
    we will have a look at `fdisk`, which is a standard package for Debian and is
    also available on all major Linux distributions. Both `cfdisk` and `gparted` are
    nonstandard packages and may require separate installation. We discuss the installation
    of additional packages in Chapter 4 and Chapter 14.


    In order to use `fdisk`, as a root user type `fdisk` followed by the name of the
    drive. The next example shows this for the first SCSI disk named `/dev/sda`.


    ```bash

    fdisk /dev/sda

    ```

