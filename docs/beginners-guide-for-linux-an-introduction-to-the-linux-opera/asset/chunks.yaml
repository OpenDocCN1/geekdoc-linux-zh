    # su and sudo


    To change your role from one user to another, you can utilize the `su` command.
    `su` abbreviates switch user. Invoked without further options, you change to the
    root user as follows:

    ```bash

    $ su

    ```

    Password:


    # Working as the administrative root user comes with great responsibility and
    presumes that you know exactly what you are doing. To work as a different user
    than root, invoke the `su` command with the desired user’s name as follows:

    ```bash

    $ su felix

    ```

    Password:


    The `su` command changes the current role permanently. In order to run only a
    single command as an administrative user, use the `sudo` command. This requires
    the Debian `sudo` package to be installed and the additional user to be added
    to the configuration file `/etc/sudoers` using the `visudo` command.


    # adduser


    The `adduser` command creates new user accounts. The example below shows the information
    that is required. This includes a new entry in the file `/etc/passwd` as well
    as the creation of a new group, plus home directory. Furthermore, prepared data
    from the directory `/etc/skel` is copied into the previously created home directory.
    Afterward, the account information is modified using the `chsh` command.


    ```bash

    # adduser caro

    ```

    Adding user ''caro'' …

    Adding new group ''caro'' (1002) …

    Adding new user ''caro'' (1002) with group ''caro'' … Creating home directory
    ''/home/caro'' …

    Copying files from ''/etc/skel'' …

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    Changing the user information for caro

    Enter the new value, or press ENTER for the defaultFull Name []: Caro

    Room Number []:

    Work Phone []:

    Home Phone []:

    Other []:Is the information correct? [Y/n] y


    # Having set up the new user, the entry in `/etc/passwd` looks as follows:

    ```bash

    # grep caro /etc/passwd

    ```

    caro:x:1002:1002:Caro, , , :/home/caro:/bin/bash


    ```


    # deluser


    Deleting user accounts is done with the help of the `deluser` command while deleting
    a group can be done via `delgroup`. To delete a user without deleting any of the
    user’s files, use the following command as the root user:

    ```bash

    # deluser felix

    ```

    The `deluser` command has the following options available to fine-tune its execution:

    - `--group`: delete a group, same as `delgroup`.

    - `--system`: delete a user only if it is a system user.

    - `--backup`: backup the user''s files contained in the home directory to a file
    named `/$user.tar.gz` or `/$user.tar.bz2`.

    - `--backup-to`: backup the user''s files contained in the home directory to a
    specified file.

    - `--remove-all-files`: remove all files from the system that are owned by the
    user. If a backup is specified, the files will be deleted after performing the
    backup.


    ```bash

    # deluser --remove-all-files felix1

    ```


    # Filesystems


    A filesystem is a way of controlling how data is stored on a drive. If data was
    not structured, there would be no way of knowing where a particular entry ends
    and the next one begins. Filesystems separate the data into pieces and each piece
    has a unique name. This way, information is easily isolated and identified. Each
    group of data on a filesystem is called an entry. Entries in a filesystem can
    be files, directories (also named folders), references (also named links), sockets,
    and fifos (also known as named pipes).


    Each entry in the filesystem contains the following data about it:

    - `name`: the name of the entry.

    - `permissions`: which user is the owner of the entry and is allowed to read,
    write, and execute the entry.

    - `creation time, last modified time, last access time`: the time the entry was
    created, modified, or accessed last.

    - `file size, number of blocks, IO blocks`: how much disk space does the entry
    need in the filesystem.

    - `inode number`: short for index node and refers to the block number where the
    data entry starts.

    - `number of symlinks`: number of references or symbolic links that point to that
    entry.


    You can retrieve the above information by using the `stat` command. `stat` is
    part of the Debian package `coreutils` and only requires the name of an entry
    to be examined. The example below displays the information for the file documentation.pdf.


    ```bash

    $ stat documentation.pdf

    File: documentation.pdf Size: 512 Blocks: 8 Device: 808h/2056d Access: (0644/-rw-r--r--)
    Access: 2020-09-04 18:44:30.071901792 -0400

    Modify: 2020-09-04 18:44:22.358157773 -0400

    Change: 2020-09-06 18:08:14.528658813 -0400

    Birth:

    ```


    $Midnight Commander (mc) also displays this information in a slightly more refined
    way:

    IO Block: 4096 regular file Inode: 260927 Links: 1

