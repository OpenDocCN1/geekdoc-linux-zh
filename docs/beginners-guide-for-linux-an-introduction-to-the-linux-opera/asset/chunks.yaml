- fmt: "\n$Processes in Linux are assigned several files. The example below shows\
    \ the file structure for the process with the Process ID (PID) of 433. Following\
    \ this, we look at the purpose and contents of the files generally available.|\
    \ – 433\n\n| |– attr |\n| |– cwd -> /home/user | |– fd |\n| |– fdinfo |\n| |–\
    \ map_files |\n| |– net |\n| | |– dev_snmp6 | | |– netfilter |\n| | |– stat |\n\
    | |– ns |\n| |– root -> / |\n| |– task |\n| |– 433 |\n\n`/proc/PID/cmdline` -\
    \ Command line arguments.\n`/proc/PID/cpu` - Current and last CPU in which the\
    \ process was executed.\n`/proc/PID/cwd` - Link to the current working directory.\n\
    `/proc/PID/environ` - Values of the environment variables.\n`/proc/PID/exe` -\
    \ Link to the executable of this process.\n`/proc/PID/fd` - Directory that contains\
    \ all file descriptors.\n`/proc/PID/maps` - Maps to executables and library files.\n\
    `/proc/PID/mem` - Memory held by this process.\n`/proc/PID/root` - Link to the\
    \ root directory of this process.\n`/proc/PID/stat` - Status of the process.\n\
    `/proc/PID/statm` - Process memory status information.\n`/proc/PID/status` - Process\
    \ status in human readable form.\n\nIf you want to learn more about the `/proc`\
    \ filesystem, check out the Man Page (short for Manual Pages) for `/proc`. It\
    \ covers much more than what is relevant for the scope of this guide. Access to\
    \ Man Pages is discussed in Chapter 19.9.3 Command Line Tools.\n\n## Detect CPU\
    \ Using cpuid\nIn order to get more information about the CPU in your Linux system,\
    \ use the `cpuid` command. This tool is available from the Debian package named\
    \ `cpuid`. An example of the detailed information returned by this command is\
    \ shown below.\n\n```\n$ cpuid CPU 0:\nvendor_id = \"GenuineIntel\"\nversion information\
    \ (1/eax):\nprocessor type = primary processor (0)\nfamily = Intel Pentium Pro/II/III/Celeron/Core/Core\
    \ 2/Atom, AMD Athlon/Duron - , Cyrix M2, VIA C3 (6)\nmodel = 0xd (13)\nstepping\
    \ id = 0x4 (4)\nextended family = 0x0 (0)\nextended model = 0x3 (3)\n(simple synth)\
    \ = Intel Pentium II / Pentium III / Pentium M / Celeron / Celeron M / - Core\
    \ / Core 2 / Core i / Xeon / Atom (unknown model)\nmiscellaneous (1/ebx):\nprocess\
    \ local APIC physical ID = 0x0 (0)\ncpu count = 0x10 (16)\nCLFLUSH line size =\
    \ 0x8 (8)\nbrand index = 0x0 (0)\nbrand id = 0x00 (0): unknown\nfeature information\
    \ (1/edx):\nx87 FPU on chip = true\nvirtual-8086 mode enhancement = true\ndebugging\
    \ extensions = true\npage size extensions = true\ntime stamp counter = true\n\
    RDMSR and WRMSR support = true\nphysical address extensions = true\nmachine check\
    \ exception = true\nCMPXCHG8B inst. = true\nAPIC on chip = true\n```\n\n## Detect\
    \ Hardware Using dmidecode\nThe command `dmidecode` reports detailed data about\
    \ installed system components such as the processor, motherboard, and RAM. This\
    \ information is based on the Desktop Management Interface (DMI), which is a framework\
    \ that classifies the individual components of a desktop, notebook, or server\
    \ by abstracting them from the software that manages them. This tool is available\
    \ via the Debian package of the same name. The example below shows the output\
    \ when executed in Debian via a VirtualBox environment.\n\n```bash\n# dmidecode\n\
    # dmidecode 3.0\nGetting SMBIOS data from sysfs. SMBIOS 2.5 present.\n10 structures\
    \ occupying 450 bytes. Table at 0x000E1000.Handle 0x0000, DMI type 0, 20 bytes\n\
    BIOS Information\nVendor: innotek GmbH\nVersion: VirtualBox\nRelease Date: 12/01/2006\n\
    Address: 0xE0000\nRuntime Size: 128 kB\nCharacteristics:\nISA is supported\nPCI\
    \ is supported\nBoot from CD is supported\nSelectable boot is supported\n8042\
    \ keyboard services are supported(int 9h)\nCGA/mono video services are supported\
    \ (int 10h)\nACPI is supportedHandle 0x0001, DMI type 1, 27 bytes System Information\n\
    Manufacturer: innotek GmbH Product Name: VirtualBox Version: 1.2\nSerial Number:\
    \ 09.4\n```\n\n## Graphical Tools\nGraphical tools are also available that can\
    \ collect and display hardware information. These tools provide a graphical user\
    \ interface, which many users prefer. Some of these tools include Hardware Lister\
    \ (`lshw-gtk`) and the Debian package `hardinfo`. The image below presents memory\
    \ information using `hardinfo`. \n\n## 10. User and Group Management\n### 10.1\
    \ Storage of User and Group Data\nLinux is a multi-user operating system, which\
    \ means multiple users can have access to the system at the same time. For the\
    \ system to manage these different users and groups, it stores this data in several\
    \ configuration files:\n\n- `/etc/passwd` - user data.\n- `/etc/shadow` - encrypted\
    \ user passwords.\n- `/etc/group` - group data.\n- `/etc/gshadow` - encrypted\
    \ group passwords.\n\nThese files are text-based databases and have a defined\
    \ structure. Below we will look at each of them in more detail. The contents of\
    \ these files can be changed using a text editor, or with the commands `passwd`,\
    \ `chage`, `chfn`, `chsh` and `usermod`.\n\n#### /etc/passwd\nThis file contains\
    \ all user attributes except the password. Each line consists of seven columns,\
    \ and the columns are separated by a colon (`:`). The attributes are the username,\
    \ the password, the user ID, the group ID, the `GECOS` field, the user’s home\
    \ directory, and the user’s login shell.\n\nThe first attribute `username` refers\
    \ to the username and it must be unique to the system. The `password` field only\
    \ contains an `x`. The value of the password itself has moved to `/etc/shadow\
    \ (see next section) and the attribute is only kept for backward compatibility.\
    \ `UID` refers to the User ID, and the range of the numeric value can be between\
    \ 0 and 65535. On Debian, the root user has a UID of 0, services then range from\
    \ 1 to 999, and regular users start at 1000. The example below shows the info\
    \ for a root user and a regular user.\n\n```bash\n$ grep root /etc/passwd\nroot:x:0:0:root:/bin/bash\n\
    \n$ grep user /etc/passwd\nuser:x:1000:1000:Debian User,123,456:/home/user:/bin/bash\n\
    ```\n\nThe `GID` attribute refers to the Group ID for the user’s primary group.\
    \ `GECOS` is short for General Comprehensive Operating System and contains the\
    \ user’s full name and sometimes a comma-separated list of user data like room\
    \ and telephone number. `Home` is the user’s home directory and `shell` is the\
    \ default shell for the user. To be precise, it is the program that is executed\
    \ as soon as the user logs in.\n\n#### /etc/shadow\nThis file contains the encrypted\
    \ passwords and expiration data of users. The format is similar to `/etc/passwd`\
    \ which we discussed above. Each line consists of eight columns, and the columns\
    \ are separated by a colon (`:`). The attributes are the username, the password,\
    \ the date of the last change, the minimum usage value, the maximum usage value,\
    \ the warning time, the inactivity period, and the expiration date.\n\nThe first\
    \ attribute `username` again refers to the UNIX username, but in this instance,\
    \ the `password` field does contain the user’s encrypted password. `lastchange`\
    \ indicates the days since 1/1/1970 that the password was last changed. The next\
    \ two attributes `minimum` and `maximum` show the minimum number of days before\
    \ the user can change their password, and the maximum number of days the password\
    \ is still valid. `Warn` shows the number of days before the password expiring,\
    \ that the user will be warned to change the password. The `inactive` attribute\
    \ is the number of days after expiration until the user is disabled, and the `expiration\
    \ date` is the number of days after 1/1/1970 since the account has been disabled.\
