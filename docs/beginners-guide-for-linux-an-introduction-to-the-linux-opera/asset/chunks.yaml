    # 12. 磁盘存储管理


    在本章中，我们将介绍如何处理存储设备和文件系统，这包括设备命名、分区类型和方案，以及分区的挂载和卸载。


    ## 12.1 设备命名


    在 Linux 中，一切皆文件，目录是一个文件，设备也是一个文件。系统上的每个驱动器都表示为 `/dev` 文件夹内部的块设备。当系统启动时，会运行 `udev`
    服务，它会检测 `/dev` 中的所有设备并据此进行相应的挂载。


    在 `/dev` 内部，IDE 驱动器的名称从 `hda`、`hdb` 直到 `hdp`。其他设备类型如 SCSI、USB、SATA 和 PATA 表示为
    `sda`、`sdb` 直到 `sdp`。CD 或 DVD 驱动器等设备接收如 `cdrom` 或 `dvd` 的标签，而 SD 卡通常被标记为 `mmcblk`。


    如果一个驱动器要在系统中运行，必须至少有一个分区。一个驱动器最多可以有 16 个分区，每个分区都有自己的文件系统。在每个设备内部，设备 `/dev/sda`
    的分区被标记为 `sda1`、`sda2` 直到 `sda16`。Linux 的限制是十六个驱动器，每个驱动器十六个分区。


    ## 12.2 主分区、扩展分区和逻辑分区


    每个驱动器可以有四个主分区，或者三个主分区和一个扩展分区。此外，扩展分区可以包含最多十六个逻辑分区。如果系统仅包含四个主分区，它们如下所示编号为 `sda1`
    到 `sda4`：


    ```

    /dev/sda1

    /dev/sda2

    /dev/sda3

    /dev/sda4

    ```


    如果系统包含三个主分区和一个扩展分区（其中包含逻辑分区），主分区 `sda4` 将消失并被逻辑分区 `sda5`、`sda6`、`sda7` 等取代：


    ```

    /dev/sda1

    /dev/sda2

    /dev/sda3

    /dev/sda5

    /dev/sda6

    /dev/sda7

    ```


    第一个逻辑分区始终编号为 `sda5`。因此，即使主分区少于三个，它们的编号也如下：


    ```

    /dev/sda1

    /dev/sda5

    /dev/sda6

    ```


    要查看分区结构，来自 `util-linux` 包的 `lsblk` 命令非常有帮助。`lsblk` 是 list block devices（列出块设备）的缩写。该命令可以输出所有使用的块设备（如下例所示）以及所有未使用的设备（如下例例所示）。


    ![](img/image_rsrc2G1.jpg)


    这七列代表以下信息：


    ![](img/image_rsrc2G2.jpg)


    - `NAME` - 设备的名称。

    - `MAJ:MIN` - 设备的主号和次号。

    - `RM` - 如果设备是固定的则为 0，如果设备可以移除则为 1。

    - `SIZE` - 人类可读格式的设备大小。

    - `RO` - 如果设备是只读的为 1，否则为 0。

    - `TYPE` - 设备类型。Loop 代表回环设备，disk 代表硬硬盘，part 指磁盘的分区，lvm 是由逻辑卷管理器 (LVM) 运行的分区，rom
    指 CD/DVD 罗马。

    - `MOUNTPOINT` - 列出设备挂载到的目录。


    要列出已挂载的文件系统，请使用 `mount` 命令或 `findmnt` 命令。这两个命令都是 `mount` 包的一部分。在不带进一步选项的情况下调用，`findmnt`
    会打印所有挂载的文件系统。这个列表可能很长。为了只选择 `ext4` 文件系统，可以使用选项 `-t ext4`（`--type ext4` 的缩写）。


    四个输出列包含以下信息：


    ![](img/image_rsrc2G9.jpg)


    - `TARGET` - 挂载点，即系统中设备挂载到的目录。

    - `SOURCE` - 设备名称。

    - `FSTYPE` - 文件系统类型。

    - `OPTIONS` - 用于挂载设备时使用的选项。


    ## 12.3 udev, df 和 du


    `udev` 是用户空间 `/dev` 的缩写，是 Linux 内核的设备管理器。一旦 `udev` 运行，它找到的驱动器将显示在 `/dev/disk`
    目录。它包含几个下面列出的带有符号链接的子目录。注意，子目录的数量取决于 Linux 版本并取决于 Linux 内核的版本。每当 Linux 系统识别磁盘时，信息就会显示在这里。我们可以使用这些信息找到哪些挂载点正在使用。


    `/dev/disk/by-id`


