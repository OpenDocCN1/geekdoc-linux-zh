    `su` 命令会永久更改当前角色。若只想以管理员身份运行单条命令，请使用 `sudo` 命令。这需要安装 Debian 的 `sudo` 软件包，并使用 `visudo`
    命令将额外用户添加到配置文件 `/etc/sudoers` 中。


