    # debian106 login


    _Having logged into the system you will be able to add further software to be
    able to use a graphical user interface, based on the XFCE desktop. At this step
    of the installation process, adding further software can only be done by logging
    in as the administrative root user. To do so, type in `root` at the login prompt,
    press `Enter`, wait for the text `Password:` to appear and type in the password
    set for the root user you defined earlier. The Linux system will welcome you with
    a login message (see below). The login message will display the version of the
    Linux kernel that is currently running and the usage advice.


    ```

    Debian GNU/Linux 10 debian106 tty1

    debian106 login: root

    Password:

    Linux debian106 4.19.0-11-amd64 #1 SMP Debian 4.19.146-1 (2020-09-17) x86_64

    The programs included with the Debian GNU/Linux system are free software; the
    exact distribution terms for each program are described in the individual files
    in /usr/share/doc/*/copyright. Debian GNU/Linux comes with ABSOLUTELY NO WARRANTY,
    to the extent permitted by applicable law.

    ```


    After the welcome message, Debian opens a command-line prompt:


    ```

    root@debian106 ~#

    ```


    This command-line prompt consists of four components: ![](image_rsrc2AS.jpg) `root`:
    the name of the user who logged in.![](image_rsrc2AT.jpg) `debian106`: the hostname
    of the Linux system.![](image_rsrc2AU.jpg) `~`: the current directory. In this
    case, it is the home directory of the user currently logged in. If not otherwise
    set, this is defined as `/home/username` for regular users and `/root` for the
    administrative user. `~` is just an abbreviation of this.![](image_rsrc2AV.jpg)
    `#`: the login symbol. The `#` symbol represents the root user whereas `$` is
    used by regular users without administrative rights. You will see this going forward
    when using various commands.


    **Important**: You are now logged in as the administrative root user. Take care
    which commands you type in and check twice if in doubt. Any mistakes can lead
    to having to repair your Linux system.


    ## 4.3 Adding a Graphical User Interface


    At its current stage, the Debian system is fully active and can be used as-is.
    For a desktop system suitable for a regular user, it still lacks a nice and easy-to-use
    graphical interface to make it look and feel more familiar to the Windows or macOS
    systems you have gotten used to. In this step, we will change that and install
    the XFCE desktop manager. To do so, we will install the following packages:


    ![](image_rsrc2AW.jpg) The `aptitude` package manager.![](image_rsrc2AX.jpg) The
    `xdm` display manager.![](image_rsrc2AY.jpg) The `xfce4` desktop environment.


    Debian uses the package manager `apt` to handle the installation, the update,
    and the removal of software packages and the related package lists. Also, `apt`
    resolves all the package dependencies and ensures that the relevant software is
    available on the system. In our case, roughly 170 MB of data has to be retrieved
    from the package mirror and installed. As pointed out earlier, this requires a
    working internet connection to download the needed software packages.


    To install the three packages, type in the following commands at the command-line
    prompt. Just type the command after the `#` symbol:


    ```

    root@debian106 ~# apt-get install aptitude xdm xfce4

    ```


    `apt` will display further information regarding the packages to be installed.
    This includes the list of depending packages and recommended packages. At the
    end, you will see a command-line prompt. Type `Y` or press `Enter` to install
    `Aitude`, `xdm`, and `xfce4` as well as the depending packages. For the `xdm`
    display manager, two dialog boxes have to be confirmed. Press `Enter` on both
    to confirm the use of `xdm`.


    The retrieval of the software packages to be installed takes a while. When finished,
    the command-line prompt will appear again. To activate the changes regarding the
    graphical desktop environment, restart the system. Type the command `reboot` at
    the command-line prompt as follows:


    ```

    root@debian106 ~# reboot

    ```


    Having restarted the Linux system, Debian welcomes us with a graphical boot screen
    (see below). Press `Enter` to start the Linux system with the default settings.![](image_rsrc2AZ.jpg)
    A few seconds later a graphical login screen will be visible. Log in to the system
    with the regular user named `user` as created earlier. Type in `user`, press `Enter`
    and type in the password for the user. Then, press `Enter` again to confirm and
    log in.


    Next, the XFCE desktop will be visible (see below). The desktop comes with several
    default elements: an upper navigation bar, a lower navigation bar, and desktop
    icons. These elements are explained in more detail below.![](image_rsrc2B0.jpg)![](image_rsrc2B1.jpg)


    **Upper navigation bar**: this shows buttons to access the different applications,
    the four virtual desktop screens, the clock, and a button for various user actions
    such as to lock the screen, change the user, change to standby mode, and exit
    the current session.![](image_rsrc2B2.jpg) **Lower navigation bar**: this bar
    contains several buttons to hide all the opened windows and show the empty desktop,
    to open a terminal, the file manager, a web browser, to find an application, and
    to open the file manager directly.![](image_rsrc2B3.jpg) **Desktop icons**: from
    top to bottom there is a trash bin, file manager icons that link to the computer,
    and the home directory. A right-click on the desktop opens a context menu that
    allows you to access the various applications (see below).![](image_rsrc2B4.jpg)


    ## 4.4 Adding Additional Packages


    Up until now the software available to be used on your Linux system has been rather
    limited. The next thing to do is to add some functionality with these four Debian
    packages:![](image_rsrc2B5.jpg) `firefox-esr`: the web browser Mozilla Firefox
    (Extended Support Release).![](image_rsrc2B6.jpg) `gnome-terminal`: a terminal
    emulation maintained by the GNOME project.![](image_rsrc2B7.jpg) `xscreensaver`:
    a basic screensaver for the X11 system.![](image_rsrc2B8.jpg) `vlc`: the video
    player Video Lan Client (VLC).


    The installation of the three packages will be done using the command-line in
    a terminal emulator (we will look at terminals in detail later in the guide).
    Currently on your system, the X11 terminal emulator `xterm` is installed. To open
    `xterm`, click on the terminal button in the lower navigation bar or select the
    entry Application > System > Xterm from the context menu. As step one, open `xterm`.
    Next, type in the command `su` next to the command-line prompt as follows and
    press `Enter`:


    ```

    user@debian106: ~$ su

    ```


    `Password:` You may remember from the previous steps that only an administrative
    user can install, update, or remove software on a Debian system. The `su` command
    abbreviates switch user and changes your current role. Used without an additional
    name, the role changes to the administrative root user. At the password prompt
    type in the password for the administrative user and press `Enter`.


    As an administrative user, install the packages: `firefox-esr`, `gnome-terminal`,
    `xscreensaver`, and `vlc` as follows:


    ```

    root@debian106: ~# apt-get install firefox-esr gnome-terminal xscreensaver vlc

    ```


    The output is seen below:![](image_rsrc2B9.jpg) After the installation of the
    four packages, you can switch back to your role as a regular user. Press `Ctrl+D`
    to quit the admin part, and press `Ctrl+D` again to close `xterm`.


    The installation of Firefox has the following effects:![](image_rsrc2BA.jpg) The
    new software `Firefox` is available from the application menu.![](image_rsrc2BB.jpg)
    The new command `firefox` is available from the command-line.![](image_rsrc2BC.jpg)
    The earth icon from the lower navigation bar links to the Firefox web browser.![](image_rsrc2BD.jpg)
    The installation of the GNOME terminal package has the following effects:![](image_rsrc2BE.jpg)
    The new software `gnome-terminal` is available from both the command-line and
    the application menu.![](image_rsrc2BF.jpg) The terminal icon from the lower navigation
    bar links to the GNOME terminal.

