    # 如如上述示例所示，该账户没有过期日期。为了将此值设置为 2019 年 12 月 31 日，请调用 `usermod` 命令并带有选项 `-e`（`--expiredate`
    的缩写）以及用户名。


    ```

    usermod -e 2019-12-31 user

    ```


    为了锁定和解锁用户账户，`usermod` 命令有两个选项：


    - `-L`（`--lock` 的缩写）和 `-U`（`--unlock` 的缩写）。下一个示例锁定了名为 `user` 的用户的账户。用户仍然可以工作并完成会话，但无法再次登录系统。


    ```

    usermod -L user

    ```


    # /etc/group

    此文件包含用户组属性。每行由四列组成，列之间再次通过冒号分隔。属性分别是组名、密码、组 ID 以及其成员列表。`groupname` 属性类似于 `username`
    属性，指的是 UNIX 组名，该名称在系统中必须是唯一的。密码字段包含一个 `x`，因为该值已移动到 `/etc/gshadow` 文件，该字段仅为了向后兼容而保留。


    `members` 属性提供了一个访问该组的用户的逗号分隔列表。`GID` 是唯一的组 ID，其数值范围在 0 到 65535 之间，分配方式与 `UID`
    类似。用户 `root` 的 `GID` 为 0，`services` 范围从 1 到 999，普通用户从 1000 开始。以下代码段显示了 root 和普通用户的情况。


    ```

    $ grep root /etc/group

    root:x:0:


    $ egrep "^user" /etc/group

    user:x:1000:

    ```


    下面的示例显示了 `user` 所属组的名称。


    ```

    $ grep user /etc/group

    cdrom:x:24:user

    floppy:x:25:user

    audio:x:29:user,pulse dip:x:30:user

    video:x:44:user

    plugdev:x:46:user users:x:100:

    netdev:x:108:user bluetooth:x:111:user user:x:1000:

    ```


    # /etc/gshadow

    此文件包含组的加密密码和用户数据。格式与 `/etc/shadow` 类似。每行由四列组成，通过冒号分隔。属性分别是组名、密码、管理员和成员列表。


    `groupname` 属性仍然 UNIX 组名，密码是加密后的密码。管理员可以使用 `gpasswd` 命令添加或删除其他成员，而成员是组中的非管理员成员。


    ## 10.2 用户和组命令

    有多个命令可以管理 Linux 系统中的用户和组。我们将查看查看和更改用户信息、更改密码、创建和删除用户账户所需的命令，以及组命令。除非另有说明，这些命令都可以作为普通用户运行。


    ### whoami

    此命令按如下格式返回你的当前用户 ID：


    ```

    $ whoami

    user

    ```


    ### users, who and w

    `who` 命令显示当前登录到你的 Linux 系统的用户。输出的第一列以用户的登录名开始。紧接着是终端名称，其中 `console` 代表登录终端，`pts`
    是伪终端会话（pseudo-terminal session）的缩写。最后两列包含登录时间和用户所在的主机名。


    ```

    $ who

    user console 2020-08-20 09:36 (:0)

    user pts/2 2020-08-20 09:47 (:0)

    user pts/3 2020-08-20 09:47 (:0)

    ```


    `w` 通过增加额外信息扩展了 `who` 的输出。`w` 的单列包含用户的登录名（`LOGIN`）、终端名称（`TTY`）、用户所在的主机名（`FROM`）、登录时间（`LOGIN@`）、空闲时间（`IDLE`）、CPU
    使用率（`JCPU` 和 `PPU`）以及用户执行的最后一个命令（`WHAT`）。


    相比之下，`users` 仅以空格分隔列表单行输出用户名。


    ```

    $ users

    user user user

    ```


    ### id and groups

    `id` 命令输出当前用户的用户组信息（见下文）。从左到右，列显示用户 ID（`UID`）、组 ID（`GID`）以及用户所属的组名。


    ```

    $ id

    uid=1000(user) gid=1000(user) groups=1000(user), 24(cdrom), 25(floppy), 29(audio),
    30(dip), 44(video), 46(plugdev), 108(netdev), 111(bluetooth)

    ```


    要列出用户所属的所有组名，你也可以调用 `groups` 命令。输出是组名的空格分隔列表。


    ```

    $ groups

    user cdrom floppy audio dip video plugdev netdev bluetooth

    ```


    ### passwd

    如第 4 章所述，Linux 系统至少有两个用户：一个管理员 root 用户和一个我们简称为 `user` 的普通用户。每个账户也通过密码进行保护。


    要更改密码，请使用 Debian `passwd` 软件包中的 `passwd` 命令。如下所示，首先输入当前密码，按回车，然后输入新密码，按回车确认，再次输入新密码并按回车再次确认。


    ```

    $ passwd

    Changing password for user.

    (current) UNIX password:

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    ```


    作为普通用户，你只被允许更改自己的密码。管理员 root 用户也可以为自己和其他用户设置新密码。在这种情况下，我们通过添加用户名来调用 `passwd`。


    ```bash

    # passwd felix

    Changing password for felix.

    (current) UNIX password:

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    ```


    # 密码以哈希值存储在名为 `/etc/shadow` 的文件中。该文件的内容对管理员用户可见。下面的示例显示了如何借助 `grep` 命令提取用户 `user`
    的信息。


    ```

    $ grep user /etc/shadow

    user:$6$R$17763:0:9999:7:::

    ```


    # chfn

    此命令同样来自 Debian `passwd` 软件包，用于更改存储在系统 `/etc/passwd` 中的用户信息。基础设置在安装 Debian 系统时已经完成。要修改这些信息，你可以在交互模式下不带进一步参数运行
    `chfn`，或带有以下一个或多个选项来适配特定值：


    - `-f` 或 `--full-name`：更改用户的全名。

    - `-h` 或 `--home-phone`：更改用户的家庭电话。

    - `-r` 或 `--room`：更改用户的房间号。

    - `-w` 或 `--work-phone`：更改用户的办公电话。


    下面的示例将家庭电话更改为 135：


    ```

    $ chfn -h 135

    Password:

    ```


    # chsh

    此命令（同样来自 Debian `passwd` 软件包）更改你用于登录 Linux 系统的 shell。同样，这些信息存储在 `/etc/passwd`
    中。允许使用的 shell 决限于名为 `/etc/shells` 的配置文件中的项。`chsh` 的工作与 `chfn` 命令类似。不带进一步选项调用时，将使用交互式方法：


    ```

    $ chsh

    Password:

    Changing the login shell for user

    Enter the new value, or press ENTER for the default

    Login Shell [/bin/sh]: /bin/bash

    ```


    要修改你本人其他用户的 shell，请将用户名作为参数调用 `chsh` 命令。注意，只有管理员可以为其他用户执行此操作。下一个示例显示了如何为用户 `felix`
    执行。


    ```bash

    # chsh felix

    Changing the login shell for felix

    ```


