    此外，在 XFCE 桌面上右键点击文件图标，会打开属性窗口，显示日常使用所需的大部分信息。


    ## 11.1 常用文件系统类型


    有很多文件系统非常流行并广泛使用。包括 `FAT`、`ext2`、`ext3`、`ext4`、`JFS`、`XFS`、`ZFS`、`ReiserFS` 和
    `SWAP`。让我们详细查看每一个。


    ### 文件分配表 (FAT)

    FAT 于 1977 年引入软盘，随后在 DOS 和 Microsoft Windows 9X 时代被用于硬盘。直到今天，它几乎被所有的操作系统支持，并且作为不同系统之间的数据传输媒介非常有用。它通常用于
    USB 闪存器等外部介质。原始的 `FAT` 系统仅为 8 位系统，最大文件大小为 8MB，支持 6:3 的文件名且没有子目录。`FAT` 有 3 种主要变体：


    - `FAT12` - 12 位文件分配表。支持 4KB 簇最大 16MB 的卷大小，或 8KB 簇最大 32MB 的卷大小。

    - `FAT16` - 16 位文件分配表。支持 32KB 簇最大 2GB 的卷大小，或 64KB 簇最大 4GB 的卷大小。文件名必须是 8:3 格式的
    OEM 字符或 256 UCS 字符。

    - `FAT32` - 支持 512B 扇区最大 2TB、2KB 扇区和 32K 簇最大 8TB，或 4KB 扇区和 64K 簇最大 16TB。文件名必须是
    8:3 格式的 OEM 字符或 256 UCS 字符。


    ### 第二扩展文件系统 (ext2)

    这是 Linux 的第一个消费级文件系统，在 `ext3` 于 2001 年成为主流之前，它是 RedHat 和 Debian 等 Linux 发行版的默认文件系统。今天，它仍然用于数字内存卡等存储设备，因为在这些设备上不需要
    `ext3` 或 `ext4` 的日志功能。这可以提高性能并尽量减少写入次数。


    ### 第三扩展文件系统 (ext3)

    `ext3` 是 `ext2` 的日志版本，可以直接从 `ext2` 升级，而无需备份和恢复操作。`ext3` 的速度没有 `ext4`、`JFS`、`XFS`
    或 `ReiserFS` 快，但它使用的 CPU 资源比 `ReiserFS` 或 `XFS` 少。`ext3` 支持最大 16GB 的文件和 32TiB
    的文件系统。


    ### 第四扩展文件系统 (ext4)

    `ext4` 是 `ext3` 的扩展，具有额外的功能，如大文件系统支持。它支持最大 16TiB 的文件和 1EiB 的文件系统。此外，它还具有“区”（extents）特性。区是一个连续的块范围，这使得处理超大文件更加高效。


    ### 日志文件系统 (JFS)

    `JFS` 最初为 IBM 的 AIX Unix 操作系统开发，后来移植到 OS/2。`JFS` 是一个完全的 64 位文件系统，使用区，支持无限的小文件以及高达
    4 PB 的大文件。它是极大型文件系统的理想选择。


    ### XFS

    `XFS` 是 Silicon Graphics (SGI) 于 1993 年为 IRIX 操作系统开发的日志文件系统。它将物理卷划分为分配，允许更高效的并行
    I/O 和文件系统带宽，并支持高达 8EiB 的大文件。


    ### ZFS

    泽字节文件系统 (`ZFS`) 结合了文件系统和逻辑卷管理器 (`LVM`)。由 SUN Microsystems 于 2005 年发布，它具有扩展性，并包含了针对数据损坏的广泛保护、对高存储容量的支持、高效的数据压缩、文件系统与卷管理的集成、快照和写时复制复制、连续完整性检查和自动修复、RAID-Z
    以及针对网络文件系统 (`NFS`) 第 4 版本的原生访问控制列表 (`ACLs`)。`OpenZFS` 和 `ZFS on Linux` 两个项目继续该文件系统的开发。


    ### ReiserFS

    `ReiserFS` 是一种通用日志文件系统，使用基于 B+树的 Apple 分区映射来管理目录内容。`ReiserFS` 版本 3 是 SUSE、Elive、Xandros、Linspire
    和 YOPER 发行版的默认文件系统。对 `ReiserFS` 版本 4 的支持已下降到除了与较新的 Linux 内核兼容外，开发已停止。


    ### 交换空间 (Swap Space)

    Linux 使用交换空间在内存页空闲时将其交换出。用户无法访问交换空间，且不能用于普通文件存储。交换空间的使用建议如下：


    - **桌面系统** - 使用系统总内存的 2 倍。这样当同时运行许多大型程序时，未使用的内存可以保存到磁盘，使程序运行得更高效。

    - **服务器系统** - 使用总内存的 0.5 倍。服务器不应进行大量的交换，一半内存就足够。

    - **内存小于 1GB 的旧系统** - 使用尽可能多的交换空间，因为系统需要大量的交换才能高效运行。


    除了使用独立的交换分区外，也可以使用交换文件。这是通过 `dd` 在现有分区上创建一个固定大小的文件来实现的。这种方法的优点是不需要固定的交换分区，以后可以为了效率调整其大小。


    ## 11.2 文件系统命令


    以下命令用于管理文件系统：


    - `fdisk` 和 `cfdisk` - 显示、创建和删除驱动器带有文件系统的分区。

    - `mkfs` - make file system 的缩写，创建一个文件系统。

    - `mkswap` - make swap 的缩写，创建一个交换文件系统。

    - `badblocks` - 显示文件系统上的坏块。

    - `fsck` - file system check 的缩写，检查并修复 Linux 文件系统。

    - `dumpe2fs` - 显示文件系统的信息。

    - `file` - 确定文件系统中条目的类型。

    - `link` 和 `unlink` - 创建和删除文件的链接。

    - `ln` - link 的缩写，创建硬链接和软链接。

    - `ls` - 显示条目（文件、目录、链接、套接字或 fifo）的信息。

    - `lsof` - 显示打开的文件列表。

    - `stat` - 显示条目保留的所有信息。

    - `sync` - 将驱动缓存与磁盘同步。

    - `mount` 和 `umount` - 启用或禁用带有文件系统的设备。

    - `tune2fs` - 调整 `ext2`、`ext3` 和 `ext4` 文件系统上的参数。


    ## 11.3 实际示例


    在下面的示例中，我们将查看如何使用上面过的命令。我们将模拟一个内存磁盘，在其上面创建一个适当的文件系统，将其挂载并在其上存储数据。首先，我们将使用 `dd`
    创建一个大小为 10MB 的文件，如下：


    ```bash

    $ dd if=/dev/zero of=memory.image bs=512b count=40

    ```


    该文件只包含零，因为数据是从名为 `/dev/zero` 的设备读取的，该设备只返回零 (`if=/dev/zero`)。输出以 512 字节的块大小写入
    40 次到 `memory.image` 文件。下面的示例显示了 `dd` 的输出以及使用 `ls` 查看输出文件的大小。


    ```bash

    $ dd if=/dev/zero of=memory.image bs=512b count=40

    40+0 records in

    40+0 records out

    10485760 bytes (10 MB, 10MiB) copied, 0.0156379 s, 671 MB/s


    $ ls -lah memory.image

    -rw-r--r-- 1 user user 10M Sep 9 05:28 memory.image

    ```


    接一步，我们使用 `mkfs.ext4` 命令在该文件上创建一个 `ext4` 文件系统：


    ```bash

    $ /sbin/mkfs.ext4 memory.image 10M

    mke2fs 1.43.4 (31-Jan-2017)

    Discarding device blocks: done

    Creating filesystem with 10240 1k blocks and 2560 inodes

    Filesystem UUID: 52c89176-a665-48b3-9bf6-2abb9b2ad721

    Superblock backups stored on blocks:8193

    Allocating group tables: done

    Writing inode tables: done

    Creating journal (1024 blocks): done

    Writing superblocks and filesystem accounting information: done

    ```


