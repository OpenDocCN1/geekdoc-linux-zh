    # 12. Disk Storage Management


    In this chapter we will look at how to deal with storage devices and filesystems,
    this includes naming the devices, partition types and schemes, as well as mounting
    and unmounting partitions.


    ## 12.1 Naming the Devices


    Everything in Linux is a file, a directory is a file and a device is a file too.
    Every drive on the system is represented as a block device inside the `/dev` folder.
    When the system starts up, the `udev` service is run, which detects all devices
    in `/dev` and then mounts them accordingly.


    Inside `/dev`, IDE drives have the names `hda`, `hdb` all the way up to `hdp`.
    Other device types such as SCSI, USB, SATA, and PATA are represented as `sda`,
    `sdb` up to `sdp`. Drives such as CD or DVD drives receive labels like `cdrom`
    or `dvd` whereas it is common that SD cards are labeled with `mmcblk`.


    Each drive must have at least one partition if it is to run on the system. A drive
    can have up to 16 partitions, each with its own filesystem. Within each device,
    partitions are then labeled `sda1`, `sda2` up to `sda16` for the device `/dev/sda`.
    Linux has a limit of sixteen drives with sixteen partitions each.


    ## 12.2 Primary, Extended, and Logical Partitions


    Each drive can have up to four primary partitions, or three primary partitions
    and one extended partition. Furthermore, an extended partition can contain up
    to sixteen logical partitions. If a system contains only four primary partitions,
    they are numbered `sda1` through `sda4` as follows:


    ```

    /dev/sda1

    /dev/sda2

    /dev/sda3

    /dev/sda4

    ```


    If a system contains three primary partitions and one extended partition, which
    contains logical partitions, primary partition `sda4` falls away and is replaced
    with logical partitions `sda5`, `sda6`, `sda7` etc:


    ```

    /dev/sda1

    /dev/sda2

    /dev/sda3

    /dev/sda5

    /dev/sda6

    /dev/sda7

    ```


    The first logical partition is always numbered as `sda5`. So even if there are
    less than three primary partitions, they are numbered as follows:


    ```

    /dev/sda1

    /dev/sda5

    /dev/sda6

    ```


    To see the partition structure, the command `lsblk` from the `util-linux` package
    is quite helpful. `lsblk` abbreviates the term list block devices. The command
    can output all the block devices that are in use (such as the first example below)
    as well as all the unused devices (as per the second example below).


    ![](image_rsrc2G1.jpg)


    The seven columns represent the following information:


    ![](image_rsrc2G2.jpg)


    - `NAME` - the name of the device.

    - `MAJ:MIN` - the major and the minor number of the device.

    - `RM` - 0 if the device is fixed, and 1 if the device can be removed.

    - `SIZE` - the size of the device in a human-readable format.

    - `RO` - 1 if the device is read-only, and 0 if not.

    - `TYPE` - the type of device. Loop represents a loop device, disk a hard disk,
    part refers to a partition of a disk, lvm is a partition run by a Logical Volume
    Manager (LVM), and rom refers to a CD/DVD rom.

    - `MOUNTPOINT` - lists the directory the device is mounted to.


    To list the mounted filesystems, use either the `mount` command or the `findmnt`
    command. Both commands are part of the `mount` package. Invoked without further
    options, `findmnt` prints all the mounted filesystems. This list can be quite
    long. In order to only select the `ext4` filesystems the option `-t ext4` (short
    for `--type ext4`) can be used.


    The four output columns contain the following information:


    ![](image_rsrc2G9.jpg)


    - `TARGET` - the mount point, which is the directory the device is mounted to
    in the system.

    - `SOURCE` - the device name.

    - `FSTYPE` - the filesystem type.

    - `OPTIONS` - the options which were used to mount the device.


    ## 12.3 udev, df and du


    `udev` is an abbreviation of userspace `/dev` and is a device manager for the
    Linux kernel. Once `udev` runs, the drives it found are shown in the `/dev/disk`
    directory. This contains several subdirectories with symbolic links as listed
    below. Note that the number of subdirectories is specific to the Linux release
    and depends on the version of the Linux kernel. Whenever a disk is recognized
    by the Linux system, the information is shown here. We can use this information
    to find which mount points are in use.


    `/dev/disk/by-id`


    This shows the partition names that Linux sees and which mount points point to
    them.


    ```bash

    # ls -al /dev/disk/by-id

    total 0

    drwxr-xr-x 2 root root 220 Sep 5 07:14 .

    drwxr-xr-x 7 root root 140 Sep 5 07:14 ..

    lrwxrwxrwx 1 root root 9 Sep 5 07:14 ata-VBOX_CD-ROM_VBO01f00…/sr0

    lrwxrwxrwx 1 root root 9 Sep 5 07:14 ataVBOX_HARDDISK_VBb9372…/sda

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part1…/sda1

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part2…/sda2

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part3…/sda3

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 ata-VBOX_HARDDISK…part5…/sda5

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part6…/sda6

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part7…/sda7

    lrwxrwxrwx 1 root root 9 Sep 5 07:29 ataVBOX_HARDDISK_VBc544…/sdb

    ```


    `/dev/disk/by-path`


    This shows lower-level hardware definitions and which mount points mount to them.


    ```bash

    # ls -al /dev/disk/by-path

    total 0

    drwxr-xr-x 2 root root 220 Sep 5 07:14 .

    drwxr-xr-x 7 root root 140 Sep 5 07:14 ..

    lrwxrwxrwx 1 root root 9 Sep 5 07:14 pci-0000:00:01.1-ata1…/sr0

    lrwxrwxrwx 1 root root 9 Sep 5 07:14 pci-0000:00:0d.0-ata1…/sda

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 pci0000:00:0d.0…part1…/sda1

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 pci0000:00:0d.0…part2…/sda2

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 pci0000:00:0d.0…part3…/sda3

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 pci-0000:00:0d.0…part5…/sda5

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 pci0000:00:0d.0…part6…/sda6

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 pci0000:00:0d.0…part7…/sda7

    ```


    `/dev/disk/by-label`


    This shows which labels are applied to which mount points.


    ```bash

    # ls -al /dev/disk/by-label

    total 0

    drwxr-xr-x 2 root root 220 Sep 5 07:14 .

    drwxr-xr-x 7 root root 140 Sep 5 07:14 ..

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 home -> ../../sda7

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 root -> ../../sda1

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 tmp -> ../../sda5

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 var -> ../../sda6

    ```


    `/dev/disk/by-uuid`


    This shows the UUID labels for each mount point.


    ```bash

    # ls -al /dev/disk/by-uuid

    total 0

    drwxr-xr-x 2 root root 140 Sep 5 07:14 .

    drwxr-xr-x 7 root root 140 Sep 5 07:14 ..

    lrwxrwxrwx 1 root root 10 Sep 5 07:14 9ef7106a-c885-4cbeaaa1…/sda2

