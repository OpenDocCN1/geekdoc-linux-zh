    ![](image_rsrc2GV.jpg)![](image_rsrc2GW.jpg)13\. Working with LinksLinks are not
    unique to Linux but are a slightly different concept if you come from a Windows-based
    system. Links are useful when you require a file to be in more than one place
    at the same time. Such as having a file in your downloads folder and in your music
    folder, without having to create a copy which takes up space.If you keep large
    archives of the same photos or videos in different locations (which many photographers
    and videographers tend to do) using links can potentially save you gigabytes of
    space. There are two types of links in a Linux filesystem: hard links and soft
    links. We will explain both of them in more detail next.13.1 Hard LinksHard links
    allow for greater flexibility when organizing your files. For instance, you could
    have your music organized per artist in one location and per genre in another
    location, without having more than one physical copy on your system.A hard link
    links a filename to the place on the drive where the file is stored (reference
    to an inode). It is merely an additional name for an existing file. Each file
    can have more than one hard link, but it must have at least one. If no links to
    the file exist, the file is deleted and the space on the drive is freed up for
    other files. However, the data in the file is still there and can be recovered
    as long as it is not written over.Every filename on the system is a hard link.
    Hard links cannot point to directories, soft links, characters or block devices,
    pipes or sockets. If more than one hard link points to a file, they must be on
    the same filesystem. To create a link Linux utilizes two commands: link and ln.
    The link command is used solely for hard links. It calls the link() system function
    and does not perform error checking when attempting to create the link. In contrast,
    ln has error checking and can create both hard and soft links.The command below
    creates three hard links named link1, link2, and link3 to the file test. The touch
    command is used to update the access date or modification date of a file and works
    in two ways: if the file already exists, the timestamp for access and modification
    of the file is set to the current timestamp. In case the file does not exist yet,
    an empty file will be created that has the current timestamp.$ touch test


    $ ln test link1


    $ ln test link2


    $ ln test link3


    $The output of ls -i shows two columns: the inode number and the filename (-i
    is short for -inode). You can see that the inode number is the same for the four
    files, and link1, link2, link3, and test point to the same inode.$ ls -i test
    link*


    260930 link1


    260930 link2


    260930 link3Furthermore, the stat command gives more detailed information about
    this entry.$ touch test


    $ ln test link1


    $ ln test link2


    $ ln test link3'
