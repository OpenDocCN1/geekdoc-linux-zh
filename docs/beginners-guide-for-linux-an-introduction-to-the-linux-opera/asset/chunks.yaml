    ## 18. 日志文件


    在 Linux 管理中，有时你需要弄清楚系统为何以出乎意料的方式运行。这就是日志文件的用用场。这类文件记录了系统的行为，并帮助你找出任何时间点发生了什么。日志文件存储在
    `/var/log` 目录。哪些日志文件对你重要取决于你的系统和需求。


    ### 18.1 重要的日志文件


    下面说明的日志文件是服务器系统中最重要的文件之一。


    #### `/var/log/messages`

    这是 Linux 中最重要的日志文件。它持久地记录通用系统事件，例如系统错误消息、系统启动和关闭，以及网络配置的变化。下面的示例包含了电话（USB 设备）连接时立即记录的日志消息：


    ```text

    Oct 4 15:10:37 debian106 kernel: [532994.056321] usb 2-2: USB disconnect, device
    number - 16

    Oct 4 15:10:37 debian106 kernel: [532994.391279] usb 2-2: new high-speed USB device
    number 17 using xhci_hcd

    Oct 4 15:10:37 debian106 kernel: [532994.520991] usb 2-2: New USB device found,
    idVendor=04e8, idProduct=6860

    Oct 4 15:10:37 debian106 kernel: [532994.520993] usb 2-2: New USB device strings:
    Mfr - =1, Product=2, SerialNumber=3

    Oct 4 15:10:37 debian106 kernel: [532994.520994] usb 2-2: Product: SAMSUNG_Android

    Oct 4 15:10:37 debian106 kernel: [532994.520995] usb 2-2: Manufacturer: SAMSUNG
    ...

    ```


    #### `/var/log/lastlog`

    该文件记录了哪些用户登录了 Linux 系统。使用 `lastlog` 命令查看登录统计数据。我们在第 16 章中详细讨论过这个命令。


    #### `/var/log/auth.log`

    Debian 和 Ubuntu 服务器中所有认证相关的事件都记录在这里。如果你正在查找任何涉及用户授权机制的记录，可以在此日志文件中找到。


    ```text

    Oct 1 07:30:01 debian106 CRON[4251]: pam_unix(cron:session): session opened for
    user root by (uid=0)

    Oct 1 07:30:01 debian106 CRON[4251]: pam_unix(cron:session): session closed for
    user root

