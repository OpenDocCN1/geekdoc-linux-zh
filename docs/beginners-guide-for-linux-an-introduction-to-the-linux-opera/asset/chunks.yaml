    ## 7.3 Combining Commands

    Linux commands on their own are already quite powerful, but you can boost their
    functionality even further by combining them using a pipe or redirecting the input/output.
    We will demonstrate how to achieve this below.


    ### Piping

    Piping (using the keyboard character `|` found above the `\`) is a way of connecting
    two or more commands in a chain. The output of one command is not sent to `stdout`
    but directly given as an input to the next command. This direct connection between
    commands allows them to operate simultaneously and permits data to be transferred
    directly between them continuously, rather than having to pass it through temporary
    text files or the display screen. Pipes are unidirectional, in other words, data
    flows from left to right through the pipeline. The example below shows the two
    commands `cat` and `wc` being used to count the number of words in a file.$ `cat
    file2 | wc -w`


    ```

    this is file two

    with a second line

    8

    ```


