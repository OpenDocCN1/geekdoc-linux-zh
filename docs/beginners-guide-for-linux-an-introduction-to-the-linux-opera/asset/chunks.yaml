    ### 13.2 Soft Links


    A soft link, also named a symbolic link, is a link to another filename in the
    filesystem. It is much like a shortcut on a Windows-based system. Unlike a hard
    link, a symbolic link does not contain the data in the target file, it simply
    points to another entry somewhere in the filesystem. This difference gives symbolic
    links certain qualities that hard links do not have, such as the ability to link
    to directories, characters, block devices, or to files on remote computers networked
    through NFS.


    To create a soft link in Linux, we will use the same `ln` command but with the
    `-s` option. `-s` is short for `--symbolic`.


    ```bash

    $ touch test

    $ ln -s test softlink1

    $ ln -s test softlink2

    $ ln -s test soft link3

    ```


    Again, the output of `ls -i` shows two columns: the inode number and the filename.
    You will see that the inode number is different for the four files, and `softlink1`,
    `softlink2`, `softlink3`, and `test` point to different inodes.


    ```bash

    $ ls -i test softlink*

    260931 softlink1

    260932 softlink2

    260933 softlink3

    ```


    If you invoke the `ls` command with the option `-l` (for long format) the output
    is as shown below. The left-most column starts with an `l` for link, and the right-most
    column shows the name of the file the soft link points to.


    ```bash

    $ ls -l softlink*

    lrwxrwxrwx 1 user user 4 Sep 15 14:05 softlink1 -> test

    lrwxrwxrwx 1 user user 4 Sep 15 14:05 softlink2 -> test

    lrwxrwxrwx 1 user user 4 Sep 15 14:05 softlink3 -> test

    ```


    ### 13.3 Practical Example


    In this example, we will look at how to connect two files using hard links, and
    how to unlink them again. First, we create a file named `file1` using `echo` and
    redirect the output. `echo` is a built-in shell command and is intended to output
    text. The command also prints the values of variables.


    ```bash

    $ echo "This is File One" > file1

    $ cat file1

    This is File One

    ```


    Next, link `file2` to `file1` and output the contents of `file2` to `stdout`.


    ```bash

    $ link file1 file2

    $ cat file2

    This is File One

    ```


    Now they are both the same file. Let’s make a change to `file2` and see what happens.


    ```bash

    $ echo "This is line Two" >> file2

    $ cat file1

    This is File One

    This is line Two

    ```


    As you can see from the example below, `file1` and `file2` are both treated as
    the same file.


    ```bash

    $ ls -l

    total 0

    $ echo "This is File One" > file1

    $ cat file1

    This is File One

    $ link file1 file2

    $ ls

    file1 file2

    $ cat file2

    This is File One

    $ echo "This is line Two" >> file2

    $ cat file2

    This is File One

    This is line Two

    $ cat file1

    This is File One

    This is line Two

    ```


    Unlinking `file1` deletes the hard link to `file1` but `file2` is still there
    and the file will not be deleted.


    ```bash

    $ unlink file1

    $ ls

    file2

    ```


    Unlinking `file2` deletes the hard link and also deletes the file, due to no remaining
    hard links to the file. The file no longer exists and the space it took up on
    the hard drive is marked for overwriting.


    ```bash

    $ unlink file1

    $ ls

    file2

    $ cat file2

    This is File One

    This is line Two

    $ unlink file2

    $ ls

    $ ls -al

    total 8

    drwxr-xr-x 2 jk jk 4096 Sep 18 08:22 .

    drwxr-xr-x 23 jk jk 4096 Sep 18 08:15 ..

    ```


    ## 14. Package Management


    In today’s world, software can be quite complex. Part of this complexity stems
    from programs being split into single components made available as single packages,
    such as binary data, shared libraries, and documentation. This concept of software
    development is called modularity and is generally accepted and in widespread use.
    Debian, for instance, offers more than 50,000 different packages.


    Package management covers all actions needed to handle these software packages
    including installation, configuration, removal, and updating packages. It also
    covers resolving package dependencies (packages that depend on each other).


    ### 14.1 Understanding Package Architecture


    To explain the Linux package architecture, we will be using Debian for illustration.
    The Debian distribution is known for its stability and exceptional packaging system.
    The descriptions that follow are valid for all Linux distributions that are derived
    from Debian, such as Ubuntu, Linux Mint, Knoppix, Kali Linux, Grml, and Xandros.
    Keep in mind that the names of packages may differ, so too the distribution-specific
    package mirrors and the names of package classes.


    The Debian package management ecosystem contains quite a number of different components
    such as package lists, package sources, package mirrors, different software packages,
    software to manage the package setup, and the package cache. These components
    are explained in more detail below.


    #### Package Lists

    Debian contains a list of available software packages. This list is referenced
    in the file `/etc/apt/sources`, and for specific components and personal additions
    in the directory `/etc/apt/sources.list.d`. As an example, the messenger Skype
    uses the file `skype-stable.list`. The lists use a text format with one package
    source per line:


    ```text

    deb http://ftp.de.debian.org/debian/ stretch main contrib non-free

    deb-src http://ftp.de.debian.org/debian/ stretch main contrib non-free

    ```


    Each line either refers to a binary package type (`deb`) or to a source package
    type (`deb-src`). The package type is followed by the package source, which refers
    to a repository that provides the software packages. Next, the line contains the
    name of the Debian release, which can be specified either as the nickname of the
    release or the branch.


    The nickname originates from a character in the film Toy Story. The branch refers
    to the development stage of the release, and can be oldoldstable (preprevious
    release), oldstable (previous release), stable (current release), testing (next
    release), unstable (future release), or experimental. After the name of the branch,
    the package classes are named.


    The entries for security updates of Debian 9 Stretch look as follows:


    ```text

    deb http://security.debian.org/ stretch/updates main contrib non-free deb

    src http://security.debian.org/ stretch/updates main contrib non-free

    ```


    In order to refresh the package list from the referenced package sources, invoke
    the following command:


    ```bash

    # apt-get update

    ```


    ```text

    Get:1 http://security.debian.org/debian-security stretch/updates InRelease [94.3
    kB]

    Ign:2 http://ftp.us.debian.org/debian stretch InRelease

    Get:3 http://ftp.us.debian.org/debian stretch-updates InRelease [91.0 kB]

    Get:4 http://security.debian.org/debian-security stretch/updates/main Sources
    [179 kB]

    Get:5 http://security.debian.org/debian-security stretch/updates/main amd64 Packages
    [447 kB]

    Hit:6 http://ftp.us.debian.org/debian stretch Release

    Get:8 http://ftp.us.debian.org/debian stretch-updates/main Sources.diff/Index
    [5,164 B]

    Get:9 http://ftp.us.debian.org/debian stretch-updates/main amd64 Packages.diff/Index
    [5,164 B]

    Get:10 http://ftp.us.debian.org/debian stretch-updates/main Translation-en.diff/Index
    [3,688 B]

    Get:11 http://ftp.us.debian.org/debian stretch-updates/main Sources 2018-07-31-2010.17.pdiff
    [385 B]

    ```


    #### Package Sources

    The Debian project maintains an official list of package sources named package
    mirrors. This list is divided into primary and secondary package mirrors. Primary
    package mirrors offer the full spectrum of supported architectures, while secondary
    mirrors only offer a subset. For the United States, the official primary package
    mirror is:ftp.us.debian.org.


    You can view the current state of your desired package mirror at the following
    address:


    https://mirror-master.debian.org/status/mirror-status.html


    ![](image_rsrc2GX.jpg)


    #### Package Types

    Debian divides its packages into three categories:

