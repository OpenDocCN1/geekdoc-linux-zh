    ## 17. 使用 objdump 识别引用的库


    `ldd` 的替代方案是 `objdump`。下面的示例结合了 `objdump` 和 `grep`，以便过滤出包含所需共享对象的行。程序 `mc` 需要下面所示的八个共享库。`grep`
    将在第 7 章详细讨论。目前，只需知道该命令作为过滤器处理文本数据，并仅打印匹配指定字符的文本行。


    ```bash

    $ objdump -p /usr/bin/mc | grep NEEDED

    NEEDED libslang.so.2

    NEEDED libgpm.so.2

    NEEDED libext2fs.so.2

    NEEDED libssh2.so.1

