    ![](img/image_rsrc2DU.jpg)

    **ISOLINUX** - 源自 `SYSLINUX` 项目的引导程序，通常用于 Linux Live CD 和可启动安装 CD。


    ![](img/image_rsrc2DV.jpg)**gummiboot** - 一种带有文本模式界面的基于 EFI 的计算机引导程序。它旨在作为 `GNU
    GRUB` 的极简替代方案，能够自动检测可启动镜像（包括 Linux 内内核镜像、操作系统和其他引导程序），不需要配置文件，提供基于菜单的基本界面，并可以与
    `systemd` 集成以提供性能数据。


    ![](img/image_rsrc2DW.jpg)**Libreboot** - 一个旨在仅执行位或 64 位操作系统的轻量级系统。下面的图片显示了 Libreboot
    的菜单。


    ![](img/image_rsrc2DX.jpg)**rEFInd** - 一个具有 GUI 界面的 EFI 计算机启动管理器。`rEFInd` 可用于启动多个操作系统，并提供了进入和浏览
    EFI 预启动环境的方法。


    ![](img/image_rsrc2DY.jpg)


    ## 8. 审查启动过程


    Linux 会生成日志文件，以便审查启动过程并读取其附的消息。在 Linux 8 之前，启动日志以文本文件存储在 `/var/log/boot`。Linux
    8 引入了 `systemd`，格式和位置发生了变化。要检索启动日志，请如下所示使用 `journalctl`（必须是 root 用户）：


    ```bash

    journalctl -b

    ```


    `Systemd` 以特殊格式存储日志消息。`journalctl` 读取日志并按时间顺序显示消息。最早的条目在前，可以使用方向键来回滚动。输出包含四列：日期（时间戳）、主机名、消息类型
    `kernel` 以及消息本身....


    ```

    Aug 20 09:36:08 debian106 kernel: Linux version 4.9.0-7-amd64 (debian-kernel@lists.
    Aug 20 09:36:08 debian106 kernel: Command line: BOOT_IMAGE=/boot/vmlinux-4.9.0-7-am
    Aug 20 09:36:08 debian106 kernel: x86/fpu: Legacy x87 FPU detected


    ```


    Aug 20 09:36:08 debian106 kernel: e820: BIOS-provided physical RAM map:


    Aug 20 09:36:08 debian106 kernel: BIOS-e820: [mem 0x0000000000000000-0x00 Aug
