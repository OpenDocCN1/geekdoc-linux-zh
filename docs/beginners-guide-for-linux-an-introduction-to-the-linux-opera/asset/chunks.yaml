    ## Creating New Filesystems


    So far we have empty partitions only. These partitions need to be filled with
    the appropriate filesystems. We will mount the new filesystems as follows:

    - `/dev/sdb1` `/mnt/root` `ext2`

    - `/dev/sdb5` `swap`

    - `/dev/sdb6` `/mnt/home` `ext4`


    To do this, first we create the mount points that we need:


    ```bash

    # mkdir /mnt/root

    # mkdir /mnt/home

    ```


    Then to add the filesystems, we issue the following commands:


    ```bash

    # mkfs /dev/sdb1

    mke2fs 1.43.4 (31-Jan-2017)

    Creating filesystem with 1048576 4k blocks and 262144 inodes

    Filesystem UUID: 8e70eeac-83cb-43f1-a402-a10fdecab950

    Superblock backups stored on blocks:32768,98304,163840,229376,294912,819200,884736

    Allocating group tables: done

    Writing inode tables: done

    Writing superblocks and filesystem accounting information: done


    ```bash

    # mkfs.ext4 /dev/sdb6

    mke2fs 1.43.4 (31-Jan-2017)

    Creating filesystem with 3931392 4k blocks and 983040 inodes

    Filesystem UUID: e7ab67d6-53a6-4c1a-9ee2-5f36d183bef5

    Superblock backups stored on blocks:32768,98304,163840,229376,294912,819200,884736,1605632,2654208

    Allocating group tables: done

    Writing inode tables: done

    Creating journal (16384 blocks): done

    Writing superblocks and filesystem accounting information: done

    ```


    Next, we have to set up `/dev/sdb5` as a swap partition. `mkswap` creates a swap
    filesystem, and `swapon` activates the partition as swap space.


    ```bash

    # mkswap /dev/sdb5

    Setting up swapspace version 1, size = 1024 MiB (1073737728 bytes)

    no label, UUID=a6e9f014-500b-4659-a45f-86d09238d11c


    # swapon /dev/sdb5

    ```


    It is a good idea to give each partition its own label. To do this we use `tune2fs`
    in combination with the option `-L` (volume label). The partition `/dev/sdb1`
    is associated with the directory `/root`, and the partition `/dev/sdb6` is associated
    with the directory `/home`.


    ```bash

    # tune2fs -L root /dev/sdb1

    # tune2fs -L home /dev/sdb6

    ```


    Now we can mount the new partitions using the `mount` command. Type `df` to see
    the result.


    ![](image_rsrc2GT.jpg)


    As the final step, let us add entries to the configuration file `/etc/fstab` in
    order to be able to auto-mount these filesystems at startup. First make a copy
    of `/etc/fstab` as `/etc/fstab.bak`.


    ```bash

    # cp /etc/fstab /etc/fstab.bak

    ```


    Then in order to get the block IDs of the new partitions, type `lsblk -f`. The
    option `-f` (short for `--fs`) extends the output with additional filesystem information.


    ![](image_rsrc2GU.jpg)


    Now edit the configuration file `/etc/fstab` and add the last two lines as shown
    below.


    ```bash

    # cat fstab


    # /etc/fstab: static file system information.

    #

    # Use ''blkid'' to print the universally unique identifier for a

    # device; this may be used with UUID= as a more robust way to name

    # devices that works even if disks are added and removed. See

    # fstab(5).

    #

    # <file system><mount point><type><options><dump><pass>

    # / was on /dev/sda1 during installation UUID=dc78e6f6-8a4f-4be0-9192-e4ca3783876

    ```

