    debian106 kernel: BIOS-e820: [mem 0x0000000000000000-0x00 Aug 20 09:36:08 debian106
    kernel: BIOS-e820: [mem 0x00000000000f0000-0x00 Aug 20 09:36:08 debian106 kernel:
    BIOS-e820: [mem 0x0000000000100000-0x00 Aug 20 09:36:08 debian106 kernel: BIOS-e820:
