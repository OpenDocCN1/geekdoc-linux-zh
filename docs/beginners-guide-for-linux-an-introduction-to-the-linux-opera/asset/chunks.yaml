    \ (SEA)\n\n## 2. 软件许可证\n\n与大多数可用的项目一样，编程程序还附带有相应的许可。产品许可描述了该产品的使用方式，并允许或限制其使用。对于商业软件，在严格的限制内允许修改和复制。例如，许可限制你只能供\
    \ 5 个用户使用，并要求你在添加第六个或第七个用户时获取另一个许可许可。常见的许可证有微软的共享源（Shared Source）和 Apple 许可。\n\
    \n对于开源编程，许可证的限制要少得多。它明确允许修改和复制，有时为了特定的客户和原因进行升级，这也是受欢迎的。其目标是确保产品现在和未来对所有人都是开放的。所谓的“拷贝左”（Copyleft）变体在必要时生效，并确保每个人对受保护程序的重新限制正如预期那样可以忽略不计。用于单个\
    \ Linux 部分及其工具的常用许可证是 `GNU 公共许可证` (`GPL`)、`BSD 许可证` 和 `Apache 许可证`。\n\n开源编程许可证遵循几项基本规则：![](img/image_rsrc283.jpg)为了任何目的使用程序（无限使用的自由\
    \ 0）。\n\n![](img/image_rsrc284.jpg)了解程序如何工作以及如何根据你的需求更改（读取程序源码的权利 自由 1）。![](img/image_rsrc285.jpg)制作软件副本以帮助他人（重新分发的权利\
    \ -自由 2）。\n\n![](img/image_rsrc286.jpg)改进软件并发布你的更改，以便所有其他用户也能从你的改进中获益（自由 3）。这确保了开放编程的性质不断提高，并且每个人都能获得这些升级。使用\
    \ `GPL` 时，必须使用类似的许可证分发。其他开源许可证（如 `BSD`）没有这一硬性要求。\n\n## 3. Linux 发行版\n\n有一些可能会让\
    \ Linux 初学者困惑的术语。首先是它的名称，`Linux` 与 `GNU/Linux`。正如第 1 节之前描述的，`Linux` 指的是 Linux\
    \ 内核本身。实际上，许多客户将 `Linux` 指代整个操作系统，包括内核、库和工具。`Linux` 术语偶尔也用来指代运行在 `Linux` 上或为该操作系统提供的每一个项目。\n\
    \n此外，`GNU/Linux` 的描述需要一些澄清。带有此前缀的 Linux 发行版是由 GNU 框架工具和程序配置而成的。其中一个模型是 `Debian\
    \ GNU/Linux`。正如第 1 节目前强调的，`GNU` 项目源于理查德·斯塔尔曼（Richard M. Stallman）和他创建一个自由 UNIX\
    \ 框架的梦想。他在 MIT 的经历以及与不同伙伴的合作使他决定利用当时许多免费程序来重构他需要的工具。这包含了 `TeX` 排版框架以及 `X11` 窗口框架。他在可能的情况下通过\
    \ `GPL` 许可证发布了这些重构的工具，以便让任何感兴趣的人都能免费获取他的工作。\n\n### 3.1 什么是 Linux 发行版？\n\nLinux\
    \ 发行版是一系列组合在一起的软件包。发行版由一个软件设计师小组维护，小组中的每个人都专注于发行版的某个特定包。总之，他们确保了单个软件包是前瞻性的，并且不会与同一发布版本的其他包发生冲突。\n\
    \n截至 2020 年的 `Debian GNU/Linux 10`，官方仓库包含超过 59,000 个不同的软件包。仓库是具有特定用途的软件包目录。`Debian\
    \ GNU/Linux` 根据开发状态对其软件包进行分类。官方仓库名为 `stable`，镜像稳定包的当前发布。不同的仓库名为 `testing` 和 `unstable`，工作原理类似但不考虑官方包。\n\
    \n通常，一个 Linux 发行版包含 Linux 内核包、引导加载程序、GNU 工具和库、带有窗口环境的图形工作区域环境，以及额外的软件，如网络浏览器、电子邮件客户端、数据集和文档。产品以两种方式提供：源代码和编译好的二进制包。这允许你看到产品是如何规划的，对其进行深入研究，并根据你自己的需求进行修改。这一过程被描述为第\
    \ 2 节列表中的自由 1。\n\n根据 Linux 发行版的重点不同，它还包含特定用途的包，例如网络或测量设备、教育目的逻辑程序以及视视频应用程序。更多细节见下文。\n\
    \n### 3.2 选择 Linux 发行版\n\n根据 `Distrowatch`，存在超过 600 个不同的 Linux 应用。一个重要的问题是：应该使用哪种\
    \ Linux 应用？根据我们的经验，我们有以下建议![](img/image_rsrc287.jpg)对于初学者：`Ubuntu`、`Xubuntu`、`openSUSE`、`Linux\
    \ Mint`。(image_rsrc288.jpg)对于有经验的高级用户：`Debian GNU/Linux`、`Red Hat Enterprise Linux`\
    \ (`RHEL`)、`Fedora`、`CentOS`。\n\n![](img/image_rsrc289.jpg)对于开发者：`Arch Linux`、`Gentoo`、`Slackware`。对于书中的模型，我们使用\
    \ `Debian GNU/Linux`。尽管这个应用被认为是领先，但它仍然对新手非常友好，我们将在本指南中展示这一点。但选择它的最重要的原因是它的稳定性，以及我们在过去\
    \ 20 年在服务器和桌面系统持续使用中对该发行版的信任。其他的 Linux 应用对我们来说差异很大。我们看到初学者犯的最大错误是决定在开始时引入一个不稳定的发行版，这通常会摧毁你的整个\
    \ Linux 体验并让你完全放弃 Linux。你可以自由选择其他的 Linux 发行版。只需确保没有严重的兼容性问题即可。本书的大部分适用于大多数发行版。但如果你是一个完全的初学者，我们强烈建议在此期间至少坚持\
    \ Debian，因为我们将逐步介绍它的安排和配置。\n\n"
