    # 15. 进程管理


    理解程序的执行对于成为一名优秀的管理员至关重要，对普通用户也有用。程序的运行实例被称为进程。每个进程都被分配一个进程 ID (PID)，允许系统跟踪所有进程。系统进程
    PID 为 0，然后初始进程 PID 为 1，以此类推。初始进程 PID 1 指向旧系统上的 `/sbin/init` 或现代系统上的 `/sbin/systemd`。


    ### 15.1 使用 ps 和 pstree


    要列出所有运行中的进程，请使用 `ps` 命令或 `pstree` 命令。


    ```bash

    # ps


