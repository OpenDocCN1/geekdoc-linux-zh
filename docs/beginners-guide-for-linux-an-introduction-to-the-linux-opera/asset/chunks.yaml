    ## 17. Identifying Referenced Libraries using objdump


    An alternative to `ldd` is `objdump`. The following example combines `objdump`
    and `grep` in order to filter only the lines that contain the required shared
    objects. The program `mc` requires the eight shared libraries seen below. `grep`
    will be discussed in greater detail in Chapter 7. For now, know that the command
    works on text data as a filter and only prints the lines of text that match the
    specified characters.


    ```bash

    $ objdump -p /usr/bin/mc | grep NEEDED

    NEEDED libslang.so.2

    NEEDED libgpm.so.2

    NEEDED libext2fs.so.2

    NEEDED libssh2.so.1

    NEEDED libgmodule-2.0.so.0

    NEEDED libglib-2.0.so.0

    NEEDED libpthread.so.0

    NEEDED libc.so.6

    ```


    ## 18. Log Files


    There are moments in Linux administration when you will have to figure out why
    your system behaves in a rather unexpected way. This is where log files come in.
    These kinds of files record the behavior of the system and help you to find out
    what happened at any point in time. The log files are stored in the directory
    `/var/log`. Which log files are important for you will depend on your system and
    your requirements.


    ### 18.1 Important Log Files


    The log files explained below are, among others, the most important in server
    systems.


    #### `/var/log/messages`

    This is the most important log file in Linux. It persistently records generic
    system events, such as system error messages, system startups and shutdowns, as
    well as changes in the network configuration. The example below contains the log
    messages that are recorded as soon as a phone (USB device) is connected:


    ```text

    Oct 4 15:10:37 debian106 kernel: [532994.056321] usb 2-2: USB disconnect, device
    number - 16

    Oct 4 15:10:37 debian106 kernel: [532994.391279] usb 2-2: new high-speed USB device
    number 17 using xhci_hcd

    Oct 4 15:10:37 debian106 kernel: [532994.520991] usb 2-2: New USB device found,
    idVendor=04e8, idProduct=6860

    Oct 4 15:10:37 debian106 kernel: [532994.520993] usb 2-2: New USB device strings:
    Mfr - =1, Product=2, SerialNumber=3

    Oct 4 15:10:37 debian106 kernel: [532994.520994] usb 2-2: Product: SAMSUNG_Android

    Oct 4 15:10:37 debian106 kernel: [532994.520995] usb 2-2: Manufacturer: SAMSUNG
    ...

    ```


    #### `/var/log/lastlog`

    This file records which user logged into the Linux system. Use the `lastlog` command
    to see the login statistics. We discussed this command in greater detail in Chapter
    16.


    #### `/var/log/auth.log`

    All authentication-related events in Debian and Ubuntu servers are logged here.
    If you are looking for anything involving the user authorization mechanism, you
    can find it in this log file.


    ```text

