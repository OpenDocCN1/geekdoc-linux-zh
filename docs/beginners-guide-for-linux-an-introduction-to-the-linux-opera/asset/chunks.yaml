    Redirection is a feature in Linux that, when executing a command, can change the
    standard input/output devices. The basic workflow of any Linux command is that
    it takes an input and gives an output. The standard input (`stdin`) device is
    the keyboard, and the standard output (`stdout`) device is the screen. With redirection,
    the standard input/output can be changed. You can read the processed data from
    a different input source, and output the result to a different place. Output redirection
    is indicated by the `>` and `>>` symbols, and input redirection by the `<` symbol:![](image_rsrc2DE.jpg)


    The `>` symbol sends the output to the given file by creating a new file. If the
    file already exists it will be entirely replaced. ![](image_rsrc2DF.jpg)The `>>`
    symbol sends the output to the given file and appends it at the end.


    ![](image_rsrc2DG.jpg)The `<` symbol reads from the given input source.


    The first example below uses the `>>` operator and adds a third line of text at
    the end of an existing file.


    ```bash

    $ echo "line 3" >> file2

    $ cat file2

    this is file two

    with a second line

    line 3

    ```


    The second example goes one step further by redirecting the standard output to
    a device. The `cat` command reads the file `music.mp3` and sends the output to
    the device `/dev/audio` which is the audio device. If the sound configuration
    in your computer is correct, this command will play the music file.


    ```bash

    $ cat music.mp3 > /dev/audio

    ```


    The next example combines input and output redirection. The `wc` command reads
    the contents from `file2` and counts the words using the option `-w`. The output
    is then sent to `stdout` and appended as a new line using the `>>` operator to
    the file `statistics`.


    ```bash

    $ cat file2

    this is file two

    with a second line

    line 3

    $ wc -w < file2

    10

    $ wc -w < file2 >> statistics

    $ cat statistics

    10

    ```


    # 8. The Linux Boot Process


    ## 8.1 Startup and Boot Order

    We start by looking at the first process in all Linux systems, the boot process.
    Starting up a UNIX/Linux system is a complex multi-part process, which consists
    of the following high-level steps:


    1. The Basic Input Output System (BIOS) executes the Master Boot Record (MBR).
    Newer systems use the Unified Extensible Firmware Interface (UEFI).

    2. The `MBR` executes a boot loader, such as the Grand Unified Bootloader (`GRUB`)
    or the Linux Loader (`LILO`).

    3. The boot loader then executes the Linux kernel.

    4. The Linux kernel runs the `init` process via `/sbin/init` to start the operating
    system.

    5. `Init` then executes `init.d` with runlevels or `systemd`.


    These steps are explained in more detail below.


    ### BIOS and UEFI

    Either the BIOS or the UEFI is run when starting the computer. This software is
    delivered from a vendor-specific firmware memory chip on the computer’s motherboard,
    specific to that motherboard. The BIOS or UEFI first performs some system integrity
    checks. Then it searches the hard drives, CD/DVD drives, USB drives, and the network
    in a pre-selected order and boots the first boot loader program it finds. This
    boot loader is then loaded into memory and takes control of the system. In simple
    terms, the BIOS or UEFI loads and executes the boot loader.


    At startup there is usually an option to press `F1`, `F2`, `F12`, `Escape` or
    `Delete` to enter the BIOS or UEFI menu. The boot loader search sequence can be
    changed from here. Once changes are made, usually the `F10` key saves the changes
    and restarts the system with the new settings. With most modern systems, BIOS
    is no longer used and has been replaced by UEFI. UEFI BIOS is maintained by the
    Unified EFI Forum. Support for UEFI by Debian is part of the default setup.


    Compared to BIOS, UEFI has the following advantages:


    ![](image_rsrc2DH.jpg)The ability to use large-capacity disks (over 2 Terabytes)
    with a GUID Partition Table (`GPT`).

    ![](image_rsrc2DJ.jpg)CPU-independent architecture.

    ![](image_rsrc2DK.jpg)CPU-independent drivers.

    ![](image_rsrc2DM.jpg)A flexible pre-OS environment that includes network capability.

    ![](image_rsrc2DN.jpg)A modular design.

    ![](image_rsrc2DP.jpg)Backward and forward compatibility.


    To determine if a Debian system is booted via UEFI, check for the directory `/sys/firmware/efi`.
    If that directory exists, the system is running in UEFI mode. A system without
    UEFI will return the following:


    ```bash

    $ ls /sys/firmware/efi

    ls: cannot access /sys/firmware/efi: No such file or directory

    ```


    ### MBR

    The Master Boot Record (`MBR`) is located in the first sector of the bootable
    disk. Typically, this is either `/dev/hda` or `/dev/sda`. It contains all information
    about the logical partitions on the disk. The `MBR` is less than 512 bytes in
    size and has the following three components:


    1. Primary boot loader info in the first 446 bytes.

    2. Partition table info in the next 64 bytes.

    3. `MBR` validation check (signature) in the last two bytes. The `MBR` contains
    information about `GRUB`. So in simple terms, it loads and executes the `GRUB`
    boot loader. The contents of the `MBR` may be viewed by combining the two commands
    `dd` (disk dump) and `hexdump` from the `coreutils` package and `bsdmainutils`
    package in the following manner:


    ```bash

    # dd if=/dev/sda bs=512 count=1 | hexdump -C

    ```


    In the above code `dd` reads the contents of the first SCSI disk `/dev/sda`, block
    by block as chunks of 512 bytes. The option `count=1` limits this step to reading
    the first block only. Then the output of `dd` is piped to `hexdump` using the
    option `-C`. The output of `hexdump` is shown as ASCII characters. The example
    below illustrates this in more detail.![](image_rsrc2DR.jpg)


    The `dd` command can also be used to create a backup of the `MBR` as shown below.
    The output file is `mbr.bin` and is specified using the option `of=mbr.bin`, where
    `of` abbreviates from output file.


    ```bash

    # dd if=/dev/sda bs=512 count=1 of=mbr.bin

    1+0 records in

    1+0 records out

    512 bytes copied, 0.000371249 s, 1.4MB/s

    # file mbr.bin

    mbr.bin: DOS/MBR boot sector

    ```


    ### GRUB

    The software that handles the Linux startup is called the Grand Unified Bootloader
    (`GRUB`), or `GNU GRUB` to be precise. Its function is to take over from the BIOS
    at boot time, load itself, load the Linux kernel into memory, and then turn over
    execution to the Linux kernel. Once the kernel takes over, `GRUB` has done its
    job and is no longer needed.


    Note that `GRUB` version 1 has been replaced by `GRUB2`, the former is now referred
    to as `GRUB Legacy`. For simplicity, `GRUB2` is simply called `GRUB`. At boot
    time, `GRUB` displays a splash screen and presents a menu from which to start
    the system. The more Linux kernel images present on the system, the longer the
    list of entries. The image below shows the default installation with two menu
    entries. Unless stated otherwise, the first entry points to the default entry.![](image_rsrc2AZ.jpg)


    `GRUB` waits for a few seconds, then loads the kernel image selected from the
    menu. The first entry targets the default image specified in the `GRUB` configuration
    file `/boot/grub2/grub.cfg`. This configuration file is first generated during
    Linux installation and automatically regenerated whenever a new Linux kernel is
    installed.


    ### Linux Kernel

    In this step, the root filesystem is mounted as specified in the entry `root=`
    found in the `GRUB` configuration file. Then the kernel executes the `/sbin/init`
    program. The kernel uses a file called `initrd`, short for Initial RAM Disk, as
    a temporary root filesystem until the kernel is booted and the real root filesystem
    is mounted. It contains all necessary drivers to access hard drive partitions,
    filesystems, and other hardware components.


    ## 8.2 Alternative Boot Loaders

    `GRUB` is not the only boot loader in the open-source world. Other boot loaders
    include:


    ![](image_rsrc2DS.jpg)`BURG` - The name abbreviates to Brand-new Unified Loader
    from GRUB (a bit of a stretch to get the reverse naming of `GRUB` if you ask us).
    It is an offshoot of `GRUB` with much more room for individual configuration.

    ![](image_rsrc2DT.jpg)`SYSLINUX` - A lightweight boot loader for networks and
    CD/DVD drives.

