    重定向是 Linux 中的一项功能，在执行命令时它可以更改标准输入/输出设备。任何 Linux 命令的基本工作流都是接收输入并产生一个输出。标准输入（`stdin`）设备是键盘，标准输出（`stdout`）设备是屏幕。通过重定向，可以更改标准的输入/输出。你可以从不同的输入源读取处理后的数据，并将结果输出到不同的地方。输出重定向由
    `>` 和 `>>` 符号表示，输入重定向由 `<` 符号表示：![](img/image_rsrc2DE.jpg)


    `>` 符号通过创建一个新文件将输出发送到指定文件。如果文件已存在，它将被完全替换。![](img/image_rsrc2DF.jpg)`>>` 符号将输出发送到指定文件并追加在末尾。


    ![](img/image_rsrc2DG.jpg)`<` 符号从指定的输入源读取内容。


    第一个示例使用了 `>>` 操作符，并在现有文件的末尾添加了第三行文本。


    ```bash

    $ echo "line 3" >> file2

    $ cat file2

    this is file two

    with a second line

    line 3

    ```


    第二个示例更进一步，将标准输出重定向到设备。`cat` 命令读取文件 `music.mp3`并将输出发送到设备 `/dev/audio`，这是一个音频设备。如果你的电脑音效配置正确，此命令将播放该文件。


    ```bash

    $ cat music.mp3 > /dev/audio

    ```


    下一个示例结合了输入和输出重定向。`wc` 命令读取 `file2` 的内容并使用 `-w` 选项统计单词。然后将输出发送到 `stdout`，并使用 `>>`
    操作符作为新行追加到文件 `statistics` 中。


    ```bash

    $ cat file2

    this is file two

    with a second line

    line 3

    $ wc -w < file2

    10

    $ wc -w < file2 >> statistics

    $ cat statistics

    10

    ```


    # 8. Linux 启动过程


    ## 8.1 启动与引导顺序

    我们首先查看所有 Linux 系统中的第一个进程：启动过程。启动一个 UNIX/Linux 系统是一个复杂的多部分过程，由以下高层步骤组成：


    1. 基本输入/输出系统（BIOS）执行主引导记录（MBR）。较新的系统使用统一扩展固件接口（UEFI）。

    2. `MBR` 执行引导加载程序，例如统一引导加载程序（`GRUB`）或 Linux 加载器（`LILO`）。

    3. 引导加载程序随后执行 Linux 内核。

    4. Linux 内核通过 `/sbin/init` 运行 `init` 进程启动操作系统。

    5. `Init` 然后带有运行级别的 `init.d` 或 `systemd`。


    下面将详细解释这些步骤。


    ### BIOS 和 UEFI

    启动电脑时会运行 BIOS 或 UEFI。该软件由电脑主板上特定厂商的固件内存芯片提供，该芯片针对特定主板。BIOS 或 UEFI 首先执行一些系统完整性检查。然后它按照预选顺序搜索硬盘、CD/DVD
    驱动器、USB 驱动器和网络，并启动找到的第一个引导加载程序。该引导加载程序被加载到内存中接管系统。简单来说，BIOS 或 UEFI 加载并执行引导加载程序。


    在启动时，通常有一个选项可以按 `F1`、`F2`、`F12`、`Escape` 或 `Delete` 进入 BIOS 或 UEFI 菜单。引导加载程序的搜索序列可以在此处更改。一旦做出更改，通常按
    `F10` 键保存更改并新设置重启系统。对于大多数现代系统，BIOS 已不再使用并被 UEFI 取代。UEFI BIOS 由统一 EFI 论坛维护。Debian
    对 UEFI 的支持是默认设置的一部分。


    与 BIOS 相比，UEFI 具有以下优势：


    ![](img/image_rsrc2DH.jpg)能够 GUID 分区表（`GPT`）使用大容量磁盘（超过 2 TB）。

    ![](img/image_rsrc2DJ.jpg)独立于 CPU 的架构。

    ![](img/image_rsrc2DK.jpg)独立于 CPU 的驱动程序。

    ![](img/image_rsrc2DM.jpg)包含网络功能的灵活预操作系统环境。

    ![](img/image_rsrc2DN.jpg)模块化设计。

    ![](img/image_rsrc2DP.jpg)向后和向前兼容性。


    要确定 Debian 系统是否通过 UEFI 引导，请检查目录 `/sys/firmware/efi`。如果该目录存在，则系统以 UEFI 模式运行。没有
    UEFI 的系统将返回以下内容：


    ```bash

    $ ls /sys/firmware/efi

    ls: cannot access /sys/firmware/efi: No such file or directory

    ```


    ### MBR

    主引导记录（`MBR`）位于可引导磁盘的第一扇区。通常，这是 `/dev/hda` 或 `/dev/sda`。它包含了关于磁盘上逻辑分区的所有信息。`MBR`
    大小小于 512 字节，具有以下三个部分：


    1. 前 446 字节中的主引导加载程序信息。

    2. 接下来 64 字节中的分区表信息。

    3. 最后两个字节中的 `MBR` 验证检查（签名）。`MBR` 包含关于 `GRUB` 的信息。因此简单来说，它加载并执行 `GRUB` 引导加载程序。可以通过以下方式结合
    `coreutils` 包和 `bsdmainutils` 包中的命令 `dd`（磁盘转储）和 `hexdump` 来查看 `MBR` 的内容：


    ```bash

    # dd if=/dev/sda bs=512 count=1 | hexdump -C

    ```


    在上述代码中，`dd` 以 512 字节为块分块读取第一个 SCSI 磁盘 `/dev/sda` 的内容。`count=1` 选项限制此步骤仅读取第一个块。然后使用
    `-C` 选项将 `dd` 的输出传递给 `hexdump`。`hexdump` 的输出以 ASCII 字符显示。下面的示例更详细说明了这一点。![](img/image_rsrc2DR.jpg)


    `dd` 命令也可以用于如下所示创建 `MBR` 的备份。输出文件为 `mbr.bin`，使用 `of=mbr.bin` 选项指定，`of` 是 output
    file 的缩写。


    ```bash

    # dd if=/dev/sda bs=512 count=1 of=mbr.bin

    1+0 records in

    1+0 records out

    512 bytes copied, 0.000371249 s, 1.4MB/s

    # file mbr.bin

    mbr.bin: DOS/MBR boot sector

    ```


    ### GRUB

    处理 Linux 启动的软件称为统一引导加载程序（`GRUB`），准确地说是 `GNU GRUB`。它的功能是在启动时从 BIOS 接管，加载自身，将 Linux
    内核加载到内存，然后将执行权交给 Linux 内核。一旦内核接管，`GRUB` 就完成了它的工作，不再需要。


    注意 `GRUB` 版本 1 已被 `GRUB2` 取代，以前称为 `GRUB Legacy`。为了简单起见，`GRUB2` 简称为 `GRUB`。在启动时，`GRUB`
    显示启动屏并提供一个从这里启动系统的菜单。系统中存在的 Linux 内核镜像越多，列表越长。下面的图像显示了带有两个菜单项目的默认安装。除非另有说明，第一项指向默认项。![](img/image_rsrc2AZ.jpg)


    `GRUB` 等待几秒，然后加载从菜单选择的内核镜像。第一项针对 `GRUB` 配置文件 `/boot/grub2/grub.cfg` 中镜像。该配置文件在
    Linux 安装期间生成，并在安装新的 Linux 内核时自动重新生成。


    ### Linux 内核

    在这一步，根文件系统根据 `GRUB` 配置文件中的 `root=` 条目挂载。然后内核执行 `/sbin/init` 程序。内核使用名为 `initrd`（初始内存磁盘的缩写）的文件作为临时根文件系统，直到内核引导并挂载真正的根文件系统。它包含了访问硬盘分区、文件系统和其他硬件组件所需的所有驱动程序。


    ## 8.2 备用引导加载程序

    `GRUB` 不是开源世界唯一的引导加载程序。其他引导加载程序包括：


    ![](img/image_rsrc2DS.jpg)`BURG` - 名称缩写为 Brand-new Unified Loader from GRUB（如果你问我们，为了得到
    `GRUB` 的反向命名这有点牵强）。它是 `GRUB` 的一个分支，为单独的配置提供了更大的空间。

    ![](img/image_rsrc2DT.jpg)`SYSLINUX` - 用于网络和 CD/DVD 驱动器的轻量级引导加载程序。

    '
- fmt: "\n![](image_rsrc2DU.jpg)\n**ISOLINUX** - A boot loader from the `SYSLINUX`\
    \ project, which is generally used for Linux Live CDs and bootable install CDs.\
    \ \n\n![](image_rsrc2DV.jpg)**gummiboot** - A boot loader for EFI-based computers\
    \ with a textmode interface. It is intended to be a minimal alternative to `GNU\
    \ GRUB` that automatically detects bootable images (including Linux kernel images,\
    \ operating systems, and other boot loaders), does not require a configuration\
    \ file, provides a basic menu-based interface, and can also integrate with `systemd`\
    \ to provide performance data.\n\n![](image_rsrc2DW.jpg)**Libreboot** - A lightweight\
    \ system designed to perform only the bit or 64-bit operating system. The image\
    \ below shows the menu for Libreboot. \n\n![](image_rsrc2DX.jpg)**rEFInd** - A\
    \ boot manager for EFI-based computers that features a GUI. `rEFInd` can be used\
    \ to boot multiple operating systems, and it also provides a way to enter and\
    \ explore the EFI pre-boot environment.\n\n![](image_rsrc2DY.jpg)\n\n## 8. Reviewing\
    \ the Boot Process\n\nLinux generates a log file to enable a review of the boot\
    \ process and to read its accompanying messages. Before Linux 8, the boot log\
    \ was stored as a text file in `/var/log/boot`. Linux 8 introduced `systemd` and\
    \ the format and location changed. To retrieve the boot log, use `journalctl`\
    \ as follows (must be root):\n\n```bash\njournalctl -b\n```\n\n`Systemd` stores\
    \ log messages in a special format. `journalctl` reads the log and displays messages\
    \ in chronological order. The earliest entry comes first and the entries can be\
    \ scrolled back and forth using the arrow keys. The output consists of four columns:\
    \ date (timestamp), hostname, message type `kernel`, and the message itself....\n\
    \n```\nAug 20 09:36:08 debian106 kernel: Linux version 4.9.0-7-amd64 (debian-kernel@lists.\
    \ Aug 20 09:36:08 debian106 kernel: Command line: BOOT_IMAGE=/boot/vmlinux-4.9.0-7-am\
    \ Aug 20 09:36:08 debian106 kernel: x86/fpu: Legacy x87 FPU detected\n\nAug 20\
    \ 09:36:08 debian106 kernel: e820: BIOS-provided physical RAM map:\n\nAug 20 09:36:08\
    \ debian106 kernel: BIOS-e820: [mem 0x0000000000000000-0x00 Aug 20 09:36:08 debian106\
    \ kernel: BIOS-e820: [mem 0x000000000009fc00-0x00 Aug 20 09:36:08 debian106 kernel:\
    \ BIOS-e820: [mem 0x0000000000000000-0x00 Aug 20 09:36:08 debian106 kernel: BIOS-e820:\
    \ [mem 0x00000000000f0000-0x00 Aug 20 09:36:08 debian106 kernel: BIOS-e820: [mem\
    \ 0x0000000000100000-0x00 Aug 20 09:36:08 debian106 kernel: BIOS-e820: [mem 0x00000000c4af0000-0x00\
    \ Aug 20 09:36:08 debian106 kernel: BIOS-e820: [mem 0x00000000fffc0000-0x00 Aug\
    \ 20 09:36:08 debian106 kernel: NX (Execute Disable protection: active Aug 20\
    \ 09:36:08 debian106 kernel: SMBIOS 2.5 present.\n\nAug 20 09:36:08 debian106\
    \ kernel: DMI: innotek GmbH VirtualBox/VirtualBox, BIOS Aug 20 09:36:08 debian106\
    \ kernel: e820: update [mem 0x00000000-oxooooofff] usable Aug 20 09:36:08 debian106\
    \ kernel: MTRR default type: uncachable\n\nAug 20 09:36:08 debian106 kernel: MTRR\
    \ variable ranges disabled:\n\nAug 20 09:36:08 debian106 kernel: MTRR: Disabled\n\
    ....\n\nTo see the list of recorded boots, the `list-boots` option can be used.\
    \ The output consists of three columns: the boot entry number (0 for the last\
    \ entry), a hash to identify the entry, and a timestamp. The example below shows\
    \ the output:\n\n```bash\njournalctl --list-boots\n\n```\n\n0 5f41f5e968b34d068320f0f13237b7e2\
    \ Tue 2020-09-04 19:16:12 EDT\n\nlines 1-1/1 (END)\n\nAn alternative to `journalctl`\
    \ is `dmesg`. This command allows you to see the entire boot process, including\
    \ BIOS messages. The image below displays the output you would get. Each line\
    \ consists of three parts: the date (timestamp) printed on the left in brackets,\
    \ the component printed second and before the colon (:), and the message printed\
    \ last. On a color monitor, these three parts are distinguished by color i.e.\
    \ green, yellow, and black.\n\n![](image_rsrc2DZ.jpg)\n\n## 8.4 Commands to Restart\
    \ and Stop the System\n\nThere are several common commands available when it comes\
    \ to restarting and stopping the system. To reboot Linux, you can use either `reboot`\
    \ or `shutdown`. To stop Linux, you can invoke `halt`, `poweroff`, or `shutdown`.\
    \ Below we will discuss some practical examples.\n\n### `shutdown -r now`\n\n\
    The above command will restart the system. The option `-r` designates a reboot\
    \ and restarts the system. The option `now` is a time parameter and invokes the\
    \ action immediately. You can also use the `reboot` command to perform the same\
    \ action as the `shutdown -r now` command.\n\n### `reboot`\n\nThe `shutdown` command\
    \ can also be used to stop the system by using the `-h` option instead. This instructs\
    \ Linux to halt.\n\n### `shutdown -h now`\n\nAgain, the `now` time parameter is\
    \ used to stop the system immediately. The time parameter can also be specified\
    \ as an exact time. The command shown in the example below will shut down the\
    \ system after five minutes. It will also inform all users about the shutdown\
    \ by sending them a relevant message.\n\n```bash\nshutdown -h +5 \"Server shutdown\
    \ due to maintenance in 5 min\"\n```\n\nShutdown scheduled for Thu 2020-09-06\
    \ 02:28:30 EDT, use 'shutdown -c' to cancel.\n\nSimilar to rebooting the system,\
    \ stopping Linux also has a shortcut in the form of the `halt` command. This performs\
    \ the same action as the `shutdown - h now` command.\n\n### `halt`\n\nThe `halt`,\
    \ `poweroff`, and `reboot` commands stop the system immediately. They are similar\
    \ to `shutdown -h now` except that the `shutdown` command terminates all processes\
    \ gracefully, instead of killing them abruptly. Keep in mind that all the commands\
    \ above require administrative privileges to be executed. They cannot be executed\
    \ by a regular user.\n\n## 9. Hardware Management\n\n### 9.1 Hardware Detection\n\
    \nAutomatic hardware detection used to be somewhat of a gamble, as hardware wasn’t\
    \ always detected automatically all of the time. It used to be necessary to probe\
    \ the hardware to figure out what was installed. In the last few years, this has\
    \ improved significantly as manufacturers document their products in more detail\
    \ and publish the specs online. This has led to an extended knowledge database\
    \ and support.\n\n### 9.2 Using the `/proc` Filesystem\n\n`/proc` is a virtual\
    \ filesystem, also referred to as an in-memory filesystem, created by the Linux\
    \ kernel at runtime. It displays information about the kernel, processes, and\
    \ other system information. This information is displayed in a file structure\
    \ and accessible to everyone. As an example, the command below shows the contents\
    \ of `/proc/cmdline`, which are the options the Linux kernel was invoked with.\
    \ Recall that `cat` outputs the contents of a file to the screen.\n\n```bash\n\
    $ cat /proc/cmdline\n\nBOOT_IMAGE=/boot/vmlinux-4.9.0-7-amd64 root=UUID=1d4acbbf-4420-4eab-984dceebc408a51e\
    \ ro quiet\n```\n\nSome other useful files are:\n\n![](image_rsrc2E0.jpg)\n`/proc/cpuinfo`\
    \ - Information about the computer's CPU.\n\n![](image_rsrc2E1.jpg)\n`/proc/meminfo`\
    \ - Information about system memory.\n\n![](image_rsrc2E2.jpg)\n`/proc/loadavg`\
    \ - Load average. The first three columns measure CPU utilization from the last\
    \ 1, 5, and 10 minutes. The fourth column shows the number of currently running\
    \ processes and the total number of processes. The last column displays the last\
    \ process ID used.\n\n![](image_rsrc2E3.jpg)\n`/proc/partitions` - Partition-related\
    \ information.\n\n![](image_rsrc2E4.jpg)\n`/proc/version` - Information about\
    \ the Linux version.\n\n```bash\n$ cat /proc/version\n\nLinux version 3.16.0-4-amd64\
    \ (debian-kernel@lists.debian.org) (gcc version 4.8.4 (Debian 4.8.4-1) ) #1 SMP\
    \ Debian 3.16.43-2+deb8u2 (2017-06-26)\n```\n\n![](image_rsrc2E5.jpg)\n`/proc/devices`\
    \ - List of device drivers configured into the currently running kernel.\n\n![](image_rsrc2E6.jpg)\n\
    `/proc/filesystems` - Lists the filesystems supported by the kernel.\n\n![](image_rsrc2E7.jpg)\n\
    `/proc/uptime` - Contains information about the running time of thesystem. The\
    \ first number is the total number of seconds the system has been up. The second\
    \ number is how much of that time the machine has spent idle, in seconds.\n\n\
    ```bash\n$ cat /proc/uptime\n\n15250.54 55603.02\n```\n"
