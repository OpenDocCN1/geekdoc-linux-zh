    ## more

    `more`、`cat` 和 `tac` 会一次性显示整个文件，而 `more` 让你每次查看一屏文件。假设我们有一个名为 `alice.txt` 的大文件。要查看它，请输入以下命令：


    ```bash

    more alice.txt

    ```

    这会显示从文件开始的一页文本。使用空格键翻页。或者，按 `Enter` 键可以一次向下滚动一行。`more` 命令的缺点是它只能向下滚动而不能回回。对于这一点，可以使用
    `less` 命令。


    ## 第一章 - 掉进兔子洞

    一个七岁的女孩爱丽丝正和姐姐坐在河岸边，感到无聊且昏昏欲睡。这时，她注意到一只穿着衣服、拿着怀表的白兔跑过。她追着兔子掉进了一个兔子洞，突然间掉落了很长距离，来到了一个奇特的大厅，里面有许多各种大小的锁门。她找到了一把小钥匙，对应的门太小了，她无法通过，但透过门门，她看到了一座迷人的花园。随后，她在桌子上发现了一个标有“DRINK
    ME”的瓶子，里面的内容让她变得非常小，小到够不到放在桌子上的钥匙。章节结束时，她吃了一块写有“EAT ME”字样的干果蛋糕。


