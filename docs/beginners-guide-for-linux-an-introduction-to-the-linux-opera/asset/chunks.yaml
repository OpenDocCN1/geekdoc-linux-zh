  trans: "\n\n移除未使用的软件非常有帮助。保持剩余软件包更新到最新版本也很重要，我们在第 14.16.5 节中讨论过。\n\n# 有用的网络和系统命令\n\
    \n`uname` 是 UNIX name 的缩写。该命令显示系统信息，例如 Linux 内核的准确名称和版本以及计算机的主机名。下面的示例显示了带有参数\
    \ `-a`（`all` 的缩写）的 `uname` 命令。输出包含操作系统名称（Linux）、主机名（debian106）、内核版本及其编译日期（4.9.8-7-amd64\
    \ #1 SMP Debian 4.9.110-1 (2018-07-05))以及系统架构（x86_64）。\n\n```bash\n$ uname -a\n\
    Linux debian106 4.9.0-7-amd64 #1 SMP Debian 4.9.110-1 (2018-07-05) x86_64 GNU/Linux\
    \ \n```\n\n`uptime` 此命令显示系统运行了多久。它显示当前时间（07:36:47），之后是运行的小时（21:56）、登录用户数（1 user）以及过去\
    \ 1、5 和 15 分钟的平均负负载（load average: 0.47, 0.43, 0.29）。\n\n```bash\n$ uptime\n07:36:47\
    \ up 21:56, 1 user, load average: 0.47, 0.43, 0.29\n```\n\n要以更好的方式查看运行时间，请使用选项\
    \ `-p`（`pretty` 的缩写）。下面的示例显示了更符合人类阅读习惯的信息。系统已运行了 22 小时 3 分钟。\n\n```bash\n$ uptime\
    \ -p\nup 22 hours, 3 minutes\n```\n\n`ip` `ip` 命令（配合关键词 `address` `show`）显示当前网络配置。下面的示例显示了回环接口（`lo`）和太网接口（`enp0s3`）。网网接口配置了\
    \ IP 地址 `10.0.2.15`。网络接口的缩写如下：\n\n![](img/image_rsrc2J9.jpg)\n- `Lo`：回环接口。用于访问本地服务，如代理或\
    \ Web 服务器。\n![](img/image_rsrc2JA.jpg)\n- `eth0`：连接到网络交换机或路由器的第一个太网接口。\n![](img/image_rsrc2JB.jpg)\n\
    - `wlan0`：第一个无线接口。\n![](img/image_rsrc2JC.jpg)\n- `ppp0`：第一个点点接口，用于通过 VPN 或拨号服务连接。\n\
    \n```bash\n$ ip address show\n1: lo: <LOOPBACK, UP, LOWER_UP> mtu 65536 qdisc\
    \ noqueue state UNKNOWN group default qlen 1link/loopback 00: 00: 00: 00 00: 00\
    \ brd 00: 00: 00: 00 00: 00\ninet 127.0.0.1/8 scope host lo\nvalid_lft forever\
    \ preferred_lft forever\ninet6 ::1/128 scope host\nvalid_lft forever preferred_lft\
    \ forever\n2: enp0s3: <BROADCAST,MULTICAST, UP, LOWER_UP> mtu 1500 qdisc pfifo_fast\
    \ state UP group default qlen 1000link/ether 08: 00: 27: e3: 5c: 79 brd ff: ff:\
    \ ff: ff: ff: ff:inet 10.0.2.15/24 brd 10.0.2.255 scope global enp0s3\nvalid_lft\
    \ forever preferred_lft forever\ninet6 fe80::a00:27ff:fee3:5c79/64 scope link\n\
    valid_lft forever preferred_lft forever\n```\n\n`ping` 向给定的 IP 地址或主机名发送 ICMP 网络包，并显示往返时间。下面的示例演示了主机\
    \ `http://www.google.com` 的情况。\n\n```bash\n$ ping google.com\nPING google.com\
    \ (127.217.23.142) 56(84) bytes of data.\n64 bytes from fra16s18-in-f14.1e100.net\
    \ (172.217.23.142): icp_seq=1 ttl=63 time=36.9 ms 64 bytes from fra16s18-in-f14.1e100.net\
    \ (172.217.23.142): icp_seq=2 ttl=63 time=37.9 ms 64 bytes from fra16s18-in-f14.1e100.net\
    \ (172.217.23.142): icp_seq=3 ttl=63 time=40.1 ms ^C\n--- google.com ping statistics\
    \ --\n3 packets transmitted, 3 received, 0% packet loss, time 2003ms\nrtt min/avg/max/mdev\
    \ = 36.953/38.353/40.193/1.377 ms\n```\n\n# 17. 共享库\n\nLinux 与任何操作系统一样，都包含了用于不同目的的文件集合，例如二进制文件（编译后的程序代码）、运行时解释代码（用\
    \ Perl 或 Python 等程序编写的代码）、配置文件、日志文件、库和用户数据。在编程世界中，库是一系列预编译的代码片段，这些片段可以在其他程序中使用。这些库包含了函数、类和数据结构。它们允许重用已经存在并经过测试的代码，因此用户不需要重复造轮子。结果，库极大地简化了程序员的生活。Linux\
    \ 中最突出的库示例是标准 C 库 `libc` 以及 `libc` 的 GNU 版本 `glibc`。\n\nLinux 区分了静态链接和动态链接的二进制程序。静态链接意味着库中的例程成为程序的一部分。相比之下，动态链接意味着库中的例程仅被引用，而不会成为程序的一部分。静态链接程序彼此完全独立，但需要更多的磁盘空间。动态链接程序较小，但依赖于引用的库，这意味着如果引用的库已经在内存中，它们的加载速度会更快。这些库被称为共享库或动态库。\n\
    \n## 17.1 命名规范\n\n通常将共享库的文件名扩展为 `.so`，这是 shared object（共享对象）的缩写。除了文件名外，共享库还有一个名为\
    \ `soname` 的库名。例如，`libc` 的 `soname` 是 `libc.so.6`。这里 `lib` 是前缀，`c` 是描述性名称，`so`\
    \ 是 shared object 的缩写，而 `6` 是库的版本（应用程序二进制接口 ABI 的版本）。包含路径的文件名是 `/lib64/libc.so.6`。注意\
    \ `soname` 是指向文件名的符号链接。\n\n通常这些文件位于以下目录中：\n\n![](img/image_rsrc2JD.jpg)\n- 默认路径\
    \ - `/usr/local/lib`, `/usr/local/lib64`, `/usr/lib`, `/usr/lib64/`。\n![](img/image_rsrc2JE.jpg)\n\
    - 系统启动库 - `/lib`, `/lib64`。\n\n然而，程序员可以在自定义位置安装库。库路径在配置文件 `/etc/ld.so.conf` 中定义。可以通过以下方式定义库的位置：\n\
    \n```bash\n$ cat /etc/ld.so.conf\ninclude /etc/ld.so.conf\n```\n\n以下命令说明了如何使用\
    \ `find` 命令在系统中查找共享库：\n\n```bash\n$ find / -name \"*.so*\"\n```\n\n## 17.2 识别引用的共享库\n\
    \n要确定一个二进制文件使用了哪些共享对象，我们可以使用 `ldd` 命令。例如，要查找文件的共享对象，输出中的每一行都由 `soname` 后接括号中的文件名组成。\n\
    \n```bash\n$ ldd /bin/bash\nlinux-vd-x86-64.so.2 (0x0000555cbfa60000)\nlibang.so.2\
    \ => /lib/x86_64-linux-gnu/libang.so.2 (0x00007f483d6bb00)\nlibgpm.so.2 => /lib/x86_64-linux-gnu/libgpm.so.2\
    \ (0x00007f483d4b50)\nlibext2fs.so.2 => /lib/x86_64-linux-gnu/libext2fs.so.2 (0x00007f483d26e0)\n\
    libssh2.so.1 => /lib/x86_64-linux-gnu/libssh2.so.1 (0x00007f483d0450)\nlibgmodule-2.0.so\
    \ => /lib/x86_64-linux-gnu/libgmodule-2.0.so (0x00007f483cb4100)\nlibglib-2.0.so\
    \ => /lib/x86_64-linux-gnu/libglib-2.0.so (0x00007f483cb3100)\nlibpthread.so.0\
    \ => /lib/x86_64-linux-gnu/libpthread.so.0 (0x00007f483c91400)\nlibc.so.6 => /lib/x86_64-linux-gnu/libc.so.6\
    \ (0x00007f483c56900)\nlibdl.so.2 => /lib/x86_64-linux-gnu/libdl.so.2 (0x00007f483c3640)\n\
    libm.so.6 => /lib/x86_64-linux-gnu/libm.so.6 (0x00007f483c0630)\nlibcom_err.so.2\
    \ => /lib/x86_64-linux-gnu/libcom_err.so.2 (0x00007f483be5f00)\nlibz.so.1 => /lib/x86_64-linux-gnu/libz.so.1\
    \ (0x00007f483bc4300)\nlibgcrypt.so.20 => /lib/x86_64-linux-gnu/libgcrypt.so.20\
    \ (0x00007f483b96200)\nlibpcre.so.3 => /lib/x86_64-linux-gnu/libpcre.so.3 (0x00007f483b6f400)\n\
    /lib64/ld-linux-x86-64.so.2 (0x0000555cbfa6000)\n```\n\n"
