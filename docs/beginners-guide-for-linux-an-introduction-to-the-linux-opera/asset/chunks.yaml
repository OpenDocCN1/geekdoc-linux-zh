    下图显示了对话框。英语已预先选择，因此只需点击对话框右下角的“继续”（Continue）按钮即可继续。

    ![](img/image_rsrc29P.jpg)


    ## 位置选择

    第三，对您的位置进行选择（见下图）。根据您之前设置的语言，列出的国家主要是使用该语言的国家。这也会影响如计算机时区等本地化设置。如果需要不同的设置，请选择列表末尾名为
    `other` 的选项并从那里开始。完成后，点击“继续”（Continue）按钮进入第四步。

    ![](img/image_rsrc29R.jpg)


    ## 键盘选择

    第四，从列表中选择您的键盘布局（见下图）。对于美国，预选方案是美式英语。如果您使用不同的键盘布局，请从列表中选择正确的选项。完成后，点击“继续”（Continue）按钮进入第五步。

    ![](img/image_rsrc29S.jpg)


    ## 网络设置

    第五步包括从 ISO 镜像加载安装组件，并检测网络硬件以加载正确的网络驱动程序。然后，安装程序将尝试连接互联网，通过本地网络服务器通过 `DHCP` 获取
    IP 地址。


    完成后，您可以设置计算机的主机名（见下文）。为机器选择一个唯一的名称，该名称由单个名称组成且在您的本地网段中不存在。使用水果、地点、乐器、作曲家和电影人物的名字是很常见的。在这种情况下，我们选择了名称
    `debian106`，它简单代表 Linux 发行版及其版本号。

    ![](img/image_rsrc29T.jpg)


    完成后，点击“继续”（Continue）按钮进入第六步以添加如 `yourcompany.com` 的域名。在这种情况下，不需要提供域名，因此我们留输入字段为空。点击右下角的“继续”（Continue）按钮继续安装。

    ![](img/image_rsrc29U.jpg)


    ## 用户与角色

    我们的 Linux 系统至少需要两个用户才能正常运行。一个是固定名为 `Root` 的管理员用户，另一个是普通用户，在此情况下我们将其命名为 `User`。


    在接下来的两个步骤中，您将为 root 用户设置密码，并设置普通用户的全名和用户名。为了简单起见，我们使用 `Debian User` 作为全名，使用 `User`
    作为用户名。对于这两个用户，请选择不同的且您能记住的密码。稍后您需要这些密码来登录计算机。

    ![](img/image_rsrc29V.jpg)


    ## 时区

    设置正确的时区对于与其他服务（尤其是网络）的通信至关重要。请从下所示列表中选择值。列表中的条目基于您之前选择的位置。完成后，点击“继续”（Continue）按钮定义存储媒体及相应的分区。

    ![](img/image_rsrc29W.jpg)


    ## 存储媒体与分区

    Linux 系统可以分布在多个不同的存储媒体上，如硬盘和闪存驱动器。此外，存储媒体可以划分为多个磁盘分区。为此，安装程序提供了以下方法：

    ![](img/image_rsrc29X.jpg)


    - **引导 - 使用整个磁盘 (Guided - use entire disk)**：按照提供的步骤操作，并使用整个磁盘空间进行 Linux 安装。这将创建固定大小的分区。

    ![](img/image_rsrc29Y.jpg)

    - **引导 - 使用整个磁盘并设置 LVM (Guided - use entire disk and set up LVM)**：按照提供的步骤操作，并使用整个磁盘空间进行
    Linux 安装。此选项利用逻辑卷管理 (LVM) 创建以后可以更改大小的分区。

    ![](img/image_rsrc29Z.jpg)

    - **引导 - 使用整个磁盘并设置加密 LVM (Guided - use entire disk and set up encrypted LVM)**：按照提供的步骤操作，并使用整个磁盘空间进行
    Linux 安装。此选项利用逻辑卷管理 (LVM) 创建以后可以更改大小的加密分区。

    ![](img/image_rsrc2A0.jpg)

    - **手动 (Manual)**：单独创建分区。这是专家模式，需要对分区和文件系统参数有更深的知识。

    ![](img/image_rsrc2A1.jpg)


    从列表中选择 `Guided - use entire disk`（引导 - 使用整个磁盘）。分区的大小根据经验选择并以算法实现。不需要手动计算。点击右下角的“继续”（Continue）按钮继续安装。


    接下来，选择要分区的磁盘。在我们的案例中只有一个可用磁盘（见下图）。在本指南的后后部分，第一块 SCSI 磁盘将被称为 `/dev/sda`。

    ![](img/image_rsrc2A2.jpg)


    磁盘分区是指存储媒体上单独组织的区域，旨在包含 Linux 文件系统树的一个分支。没有通用的方法来正确进行这种分离。本指南展示了一个适用于基础系统的简单且安全的解决方案。对话框中的菜单提供以下选项：

    ![](img/image_rsrc2A3.jpg)


    - **所有文件在一个分区 (All files in one partition)**：仅使用单个分区存放程序和用户数据。

    ![](img/image_rsrc2A4.jpg)

    - **独立 /home 分区 (Separate /home partition)**：将程序和用户数据存储在独立的分区中。


    '
- fmt: '

    ![](image_rsrc2A5.jpg)

    ### Separate `/home`, `/var`, and `/tmp` partitions


    Keep user data, variable data and temporary data in separate partitions (available
    on some distributions). As shown in the image below, choose the second entry `Separate
    /home` partitions. Click the `Continue` button to proceed with the installation.


    ![](image_rsrc2A6.jpg)


    The next step is to confirm the partition scheme. This is calculated automatically
    based on experience and contains these partitions:

    ![](image_rsrc2A7.jpg)


    - `sda1`: the first partition of the first SCSI disk is a primary partition with
    a size of 2.8 GB, formatted with the `ext4` filesystem, and referred to as the
    root part of the filesystem tree (indicated with `/`).

    ![](image_rsrc2A8.jpg)

    - `sda5`: the fifth partition of the first SCSI disk is a logical partition with
    a size of 2.1 GB, formatted as a swap filesystem.

    ![](image_rsrc2A9.jpg)

    - `sda6`: the sixth partition of the first SCSI disk is a logical partition with
    a size of 3.6 GB, formatted with the `ext4` filesystem and reserved to store user
    data, referred to as home directories (indicated with `/home`).


    Due to historical reasons, a hard disk can contain four primary partitions only.
    The fourth one is called an `Extended Partition` if divided into so-called logical
    partitions or logical drives. In our case the logical partitions `/dev/sda5` and
    `/dev/sda6` are stored on the primary partition `/dev/sda4`. The partitions `/dev/sda2`
    and `/dev/sda3` are not in use.

    ![](image_rsrc2AA.jpg)


    From the above list, choose the entry `Finish partitioning and write changes to
    disk`. Click the `Continue` button on the lower-right corner to proceed and to
    confirm the partition scheme (see image). Choose `yes` from the list and click
    the `Continue` button to partition the disk. Note that all the data on the selected
    storage device will be lost and the disk will be empty.

    ![](image_rsrc2AB.jpg)


    Having divided the storage media into single partitions, the partitions will be
    formatted with the filesystem as defined before. In our case, the partitions `/dev/sda1`
    and `/dev/sda6` will get an `ext4` filesystem, and the partition `/dev/sda5` will
    get a swap filesystem. As soon as this step is completed, the base system of Debian
    will be installed next.


    ### Package Management


    The ISO image contains the installer and several packages to set up the Linux
    base system. For example, this includes the Linux kernel being installed below.

    ![](image_rsrc2AC.jpg)


    Next, you need to decide whether to use additional installation media or not.
    In our case, we have only a single installation disk and can consequentially select
    `No` from the menu (see below). Then click the `Continue` button to proceed.

    ![](image_rsrc2AD.jpg)


    As pointed out earlier, the software for Debian is organized in packages. These
    packages are provided in multiple software repositories. The repositories are
    made available via package mirrors that are maintained by universities, private
    individuals, companies, and other organizations. These mirrors are located in
    different countries.


    In the next step, you will have to decide from which country you would like to
    retrieve your Debian packages. It is recommended to choose a mirror that is geographically
    located near you to minimize the time that is needed to transport the data from
    the mirror to your computer via network. As an initial step, choose your desired
    country.

    ![](image_rsrc2AE.jpg)


    As a second step, choose a preferred mirror from the list (see below). The list
    contains universities, internet providers, government services, and other organizations.

    ![](image_rsrc2AF.jpg)


    In case your computer network includes a proxy server to communicate with the
    outside world, enter the appropriate information here. In this case, we don’t
    have that and leave the entry field empty. Click the `Continue` button to proceed.

    ![](image_rsrc2AG.jpg)


    As soon as the single parameters are set, the Debian installer connects to the
    previously selected package mirror and retrieves the package lists from there.
    A package list contains the available packages, including the name, size, and
    description. Depending on the quality and bandwidth of your network connection
    this step can take a while.

    ![](image_rsrc2AH.jpg)


    Next, you are asked to take part in `Popcon`, the Debian package popularity contest.
    This information is optional and is used only by the team of developers that is
    responsible for the Debian packages. Based on `Popcon`, they figure out which
    Debian packages are the ones that are installed most often. The information has
    a direct influence on the preparation of installation images and which packages
    to keep or to dismiss for the different architectures. In our case, we do not
    participate in `Popcon` and leave the selection to `No`. Click `Continue` to proceed
    with the selection of software tasks (`tasksel`).


    ![](image_rsrc2AJ.jpg)


    ### Software Selection


    Debian offers carefully arranged selections of packages, so-called tasks. The
    idea behind them is to group packages for specific uses to simplify the installation.
    From the list in the dialog window (see below) you can choose between different
    desktop environments, as well as a web server, a print server, an SSH server,
    and the standard system utilities. To have a lean installation, enable only the
    last two entries from the list. We will install the `XFCE` desktop environment
    later.

    ![](image_rsrc2AK.jpg)


    Having confirmed the software selection, the Debian installer retrieves the needed
    packages from the package mirror, unpacks, and then installs them. The bar below
    shows the progress. In this case, 140 packages have to be downloaded.

    ![](image_rsrc2AM.jpg)


    ### Setting up GRUB


    To start our newly installed Debian system, we have to set the startup information
    as well. This process is called booting the system. The software component that
    handles this step is named Grand Unified Boot Loader (`GRUB` or `GNU GRUB` to
    be precise). The entry `Yes` is already pre-selected, and so we can click `Continue`
    to proceed.

    ![](image_rsrc2AN.jpg)


    The Debian installer needs to know where to install `GRUB`. The menu in the image
    below lists the storage media to be considered. In our case, we choose the second
    entry from the list (`/dev/sda`). Then, click `Continue` to proceed.

    ![](image_rsrc2AP.jpg)


    Now that we are nearly finished with the basic installation, the only thing left
    to do is a single dialog box to read.


    ### Finishing the Installation


    The following dialog box informs you that the installation is complete. Then click
    `Continue` to reboot the newly installed system.

    ![](image_rsrc2AR.jpg)


    After a few seconds, the text-based `GRUB` boot menu will appear on the screen
    (see extract below). The boot menu includes two options: `Debian GNU/Linux` and
    `Advanced options for Debian GNU/Linux`. The first menu item is highlighted and
    pre-selected. The second menu entry allows you to set specific boot options. For
    a comprehensive list of these options have a look at the `GNU GRUB` manual at
    `www.gnu.org/software/grub/manual/grub` Keep the first menu item selected and
    press `Enter` to proceed and boot the new system.


    ```

    * Debian GNU/Linux

    * Advanced options for Debian GNU/Linux

    ```


    Your Debian system will start and initialize the necessary system services. This
    step will take a few seconds to be completed. Finally, a black-and-white screen
    will be visible on the first text terminal named `tty1` and ask you to log into
    the system. The login prompt consists of two components: the hostname of your
    Linux system (`debian106`) followed by a space and the word login.


    ```

    Debian GNU/Linux 10 debian106 tty1

    ```

