    is feeling bored and drowsy while sitting on the riverbank with her elder sister.
    She then notices a talking, clothed White Rabbit with a pocket watch run past.
    She follows it down a rabbit hole when suddenly she falls a long way to a curious
    hall with many locked doors of all sizes. She finds a small key to a door too
    small for her to fit through, but through it, she sees an attractive garden. She
    then discovers a bottle on a tablelabeled "DRINK ME", the contents of which cause
    her to shrink too small to reach the key which she has left on the table. She
    eats a cake with "EAT ME" written on it in currants as the chapter closes.lessThe
    less command is a terminal pager that displays one screen of text at a time and
    allows scrolling forward and backward in a file, but it cannot edit a file. Inside
    less, there are commands to traverse the file and to find certain patterns. Some
    examples are:![](image_rsrc2C4.jpg)j - go down one line.![](image_rsrc2C5.jpg)k
    - go up one line.![](image_rsrc2C6.jpg)g or < - go to the first line.![](image_rsrc2C7.jpg)G
    or > - go to the last line.![](image_rsrc2C8.jpg)<n>G - go to line <n>.![](image_rsrc2C9.jpg)Space
    - go to the next![](image_rsrc2CA.jpg)page. d - go forward half a![](image_rsrc2CB.jpg)page.
    b - go to the previous![](image_rsrc2CC.jpg)page. u - go back half a


    page.![](image_rsrc2CD.jpg)v - open page in the editor set by the VISUAL environment
    variable.


    ![](image_rsrc2CE.jpg)/<regex> - search forward for <regex>.![](image_rsrc2CF.jpg)?<regex>
    - Search backward for <regex>.![](image_rsrc2CG.jpg)n - next instance of text
    matching


    <regex>.![](image_rsrc2CH.jpg)N - previous instance of text matching <regex>.![](image_rsrc2CJ.jpg):n
    - next file when multiple files are opened in the same command.


    ![](image_rsrc2CK.jpg):p - previous file when multiple files are opened in the
    same command.


    ![](image_rsrc2CM.jpg)q - quit.


    head


    This command outputs the first n-number of lines of a file. If n is not specified,
    it defaults to ten. The example below shows the default use of head for the file
    /etc/passwd.$ head /etc/passwd


    root:x:0:0:root:/root:/bin/bash


    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin bin:x:2:2:bin:/bin:/usr/sbin/nologin


    sys:x:3:3:sys:/dev: /usr/sbin/nologin


    sync:x:4:65534:sync:/bin:/bin/sync


    games:x:5:60:games:/usr/games:/usr/sbin/nologin man:x:6:12:man:/var/cache/man:/usr/sbin/nologin
    lp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologin mail:x:8:8:mail:/var/mail:/usr/sbin/nologin
    news:x:9:9:news:/var/spool/news:/usr/sbin/nologin $To output the first six lines
    of the file /etc/passwd, type this instead:$ head -n6 /etc/passwd


    root:x:0:0:root:/root:/bin/bash


    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin


    bin:x:2:2:bin:/bin:/usr/sbin/nologin


    sys:x:3:3:sys:/dev: /usr/sbin/nologin


    sync:x:4:65534:sync:/bin:/bin/sync


    games:x:5:60:games:/usr/games:/usr/sbin/nologin


    $The opposite of head is tail which we will explain next.


    tailThe tail command outputs the last n-number of lines of a file. If n is not
    specified, it defaults to ten lines. The example below displays the last 5 lines
    of the file /etc/passwd.$ tail -n5 /etc/passwd


    usbmux:x:109:46:usbmux daemon,,,:/var/lib/usbmux:/bin/false


    pulse:x:110:114:PulseAudio daemon,,,:/var/run/pulse:/bin/false


    lightdm:x:111:116:Light Display Manager:/var/lib/lightdm:/bin/false


    felix:x:1001:1001:Felix,,,:/home/felix:/bin/bash


    caro:x:1002:1002:Caro,,,:/home/caro:/bin/bash


    $In addition, tail can be used to follow the progress of a log file by using -f
    (or


    --follow). As more data gets appended to the end of the file, the output on the
    screen updates. To output the progress of the last 20 lines of /var/log/syslog
    as it updates, use the following command:$ tail -f -n 20 /var/log/syslog


    sort


    As the name implies, this command is used to sort files. Among others it has the
    following options: ![](image_rsrc2CN.jpg)-R: random sort.![](image_rsrc2CP.jpg)-r:
    reverse the sort order.![](image_rsrc2CR.jpg)-n: sort numerically.To sort the
    first five lines of the file /etc/passwd in alphabetical order, use this command:$
    head -n5 /etc/passwd | sort


