    # To show the account details, invoke the `chage` command followed by the option
    `-l` (short for `--list`) along with the username. The example below lists the
    details for the user named `user`.


    ```

    chage -l user

    password change : Aug 20, 2020

    Password expires : never

    Password inactive : never

    Account expires : never

    Minimum number of days between password change : 0 Maximum number of days between
    password change : 99999 Number of days of warning before password expires : 7

    ```


    # As you can see from the above example, the account does not have an expiration
    date. In order to set this value to 31 December 2019, invoke the `usermod` command
    with the option `-e` (short for `--expiredate`) along with the username.


    ```

    usermod -e 2019-12-31 user

    ```


    To lock and unlock the user account the `usermod` command has two options:


    - `-L` (short for `--lock`) and `-U` (short for `--unlock`). The next example
    locks the account for the user named `user`. The user can still work and finish
    his session but is not able to log into the system anymore.


    ```

    usermod -L user

    ```


    # /etc/group

    This file contains the user group attributes. Each line consists of four columns,
    and the columns are separated once again by a colon. The attributes are the group
    name, the password, the group ID, and the list of its members. The `groupname`
    attribute is similar to the `username` attribute and refers to the UNIX group
    name, which must be a unique name on the system. The password field contains an
    `x` because the value has been moved to the file `/etc/gshadow`, and the field
    is kept only for backward compatibility.


    The `members` attribute provides a comma-separated list of users with access to
    the group. `GID` is the unique Group ID, which has a numeric range between 0 and
    65535, with a similar allocation as we have with the `UID`. The user `root` has
    a `GID` of 0, `services` will range from 1 to 999, and regular users start at
    1000. The following code snippet shows this for the root and a regular user.


    ```

    $ grep root /etc/group

    root:x:0:


    $ egrep "^user" /etc/group

    user:x:1000:

    ```


    The example below shows the name of the groups which `user` is part of.


    ```

    $ grep user /etc/group

    cdrom:x:24:user

    floppy:x:25:user

    audio:x:29:user,pulse dip:x:30:user

    video:x:44:user

    plugdev:x:46:user users:x:100:

    netdev:x:108:user bluetooth:x:111:user user:x:1000:

    ```


    # /etc/gshadow

    This file contains the encrypted passwords and user data for groups. The format
    is similar to `/etc/shadow`. Each line consists of four columns separated by a
    colon. The attributes are the group name, the password, the administrators, and
    the list of members.


    The `groupname` attribute is again the UNIX group name, with the password being
    the encrypted password. Administrators are group members who can add or remove
    other members using the `gpasswd` command, and members are non-administrative
    members of the group.


    ## 10.2 User and Group Commands

    There are several commands available to manage users and groups in a Linux system.
    We will look at commands needed to view and change user information, change passwords,
    create and delete user accounts, as well as look into group commands. Unless stated
    otherwise, these commands can be run as a regular user.


    ### whoami

    This command returns your current user ID as follows:


    ```

    $ whoami

    user

    ```


    ### users, who and w

    The `who` command shows the users that are currently logged into your Linux system.
    The output’s first column starts with the login name of the user. This is followed
    by the name of the terminal, where `console` represents a login terminal and `pts`
    abbreviates a pseudo-terminal session. The last two columns contain the login
    time and the host the user comes from in brackets.


    ```

    $ who

    user console 2020-08-20 09:36 (:0)

    user pts/2 2020-08-20 09:47 (:0)

    user pts/3 2020-08-20 09:47 (:0)

    ```


    The `w` extends the output of `who` by adding additional information. The single
    columns for `w` contain the login name of the user (`LOGIN`), the name of the
    terminal (`TTY`), the name of the host the user comes from (`FROM`), the login
    time (`LOGIN@`), the idle time (`IDLE`), the CPU usage (`JCPU` and `PPU`) as well
    as the last command the user executed (`WHAT`).


    In contrast to the above, `users` simply outputs the name of the users as a space-separated
    list in a single line.


    ```

    $ users

    user user user

    ```


    ### id and groups

    The `id` command outputs the user and group information of the current user (see
    below). From left to right the columns show the user ID (`UID`), the group ID
    (`GID`), and the name of the groups the user is a member of.


    ```

    $ id

    uid=1000(user) gid=1000(user) groups=1000(user), 24(cdrom), 25(floppy), 29(audio),
    30(dip), 44(video), 46(plugdev), 108(netdev), 111(bluetooth)

    ```


    To list the names of all the groups the user belongs to, you can also invoke the
    `groups` command. The output is a space-separated list of the group names.


    ```

    $ groups

    user cdrom floppy audio dip video plugdev netdev bluetooth

    ```


    ### passwd

    As described in Chapter 4, the Linux system has at least two users: an administrative
    root user and a regular user that we simply called `user`. Every account is also
    secured with a password.


    In order to change your password, use the `passwd` command from the Debian `passwd`
    package. As shown below, type in the current password first, press Enter, type
    in the new password, press Enter to confirm, retype the new password and press
    Enter to confirm again.


    ```

    $ passwd

    Changing password for user.

    (current) UNIX password:

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    ```


    As a regular user, you are allowed to change your own password only. The administrative
    root user can set a new password for itself and other users as well. In such a
    scenario, we call `passwd` by adding the user name.


    ```

    # passwd felix

    Changing password for felix.

    (current) UNIX password:

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    ```


    # The password is stored as a hashed value in the configuration file named `/etc/shadow`.
    The content of this file is only visible to the administrative user. The example
    below shows how to extract the information for the user `user` with the help of
    the `grep` command.


    ```

    $ grep user /etc/shadow

    user:$6$R$17763:0:9999:7:::

    ```


    # chfn

    This command is also from the Debian `passwd` package and changes the user information
    that is stored on your system in `/etc/passwd`. The basic setup was already done
    during the installation of your Debian system. To modify this information, you
    can run `chfn` without further parameters in interactive mode, or with one or
    more of the following options to adapt only a specific value:


    - `-f` or `--full-name`: changes the full name of the user.

    - `-h` or `--home-phone`: changes the home phone of the user.

    - `-r` or `--room`: changes the room number of the user.

    - `-w` or `--work-phone`: changes the work phone of the user.


    The following example changes the entry for the home phone number to 135:


    ```

    $ chfn -h 135

    Password:

    ```


    # chsh

    This command (also from the Debian `passwd` package) changes the entry for the
    shell that you use to log into your Linux system. Again, this information is stored
    in `/etc/passwd`. Which shells are allowed to be used are limited by the entries
    in the configuration file named `/etc/shells`. `chsh` works similar to the `chfn`
    command. Invoked without further options, an interactive method is used:


    ```

    $ chsh

    Password:

    Changing the login shell for user

    Enter the new value, or press ENTER for the default

    Login Shell [/bin/sh]: /bin/bash

    ```


    In order to modify the shell for a different user other than yourself, invoke
    the `chsh` command with the user’s name as a parameter. Note that only the administrative
    user can do this for another user. The next example shows how to do that for the
    user `felix`.


    ```bash

    # chsh felix

    Changing the login shell for felix

    ```

