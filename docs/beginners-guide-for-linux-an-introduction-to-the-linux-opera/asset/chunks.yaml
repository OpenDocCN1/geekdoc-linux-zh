    # Package Management Tools


    To maintain the selection of software packages installed on your Linux system,
    several tools are available:


    ![](image_rsrc2H1.jpg)`dpkg` - used to manage single packages.


    ![](image_rsrc2H2.jpg)`apt`, `aptitude`, `synaptic` - used to manage packages
    with their dependencies.


    ![](image_rsrc2H3.jpg)`tasksel` - used to manage entire software collections (tasks).


    The image below depicts the different levels on which the tools operate and how
    they work together. The two boxes with dotted outlines refer to the shared libraries
    that handle the package management tasks.![](image_rsrc2H4.jpg)On the lower level,
    we have `dpkg`. Its task is to install a single Debian package or to remove the
    contents of a package that has already been installed. To query packages and files,
    it makes use of the two tools `dpkg-deb` and `dpkg-query`. `dpkg` allows you to
    maintain your package base but does not handle package dependencies.


    Typically, the upper level is represented by the tools `apt`, `aptitude`, and
    `synaptic`. These tools have the task of simplifying package management by combining
    all actions into one application. These tools use either the shared libraries
    `libapt-inst` or `libapt-pkg`, or communicate with `dpkg` directly to perform
    the package management tasks. This includes handling the package dependencies.


    ## Package Cache


    The package cache is located at `/var/cache/apt/archives`. Whenever you install
    a software package via `apt-get` or `aptitude` the appropriate package is retrieved
    and stored locally at this location. To illustrate, below lists the cached deb
    packages using `ls`.


    ```

    $ ls /var/cache/apt/archives/*.deb


    /var/cache/apt/archives/cpuid_20140123-2_amd64.deb


    /var/cache/apt/archives/libxml2-utils_2.9.1+dfsg1-5+deb8u7_amd64.deb


    /var/cache/apt/archives/python3-bitarray_0.8.1-1_amd64.deb


    /var/cache/apt/archives/python-bitarray_0.8.1-1_amd64.deb

    ```


    The more software you install, the more deb packages are cached. It is recommended
    to clear the package cache from time to time by using either `aptitude` or `apt-cache`.


    ```

    # aptitude clean


    # apt-cache clean

    ```


    # 14.2 Day-to-Day Administration Tasks


    This section deals with basic package management actions needed in day-today life
    as a Linux owner and administrator.


    ## Displaying Installed Packages


    The command `dpkg -l` lists the installed packages and their status. The image
    below shows the output.


    ![](image_rsrc2H5.jpg)The single columns contain the following information:


    ![](image_rsrc2H6.jpg)`status` - the status of the package, such as fully installed
    (ii) or removed and still configured (rc).


    ![](image_rsrc2H7.jpg)`name` - the name of the package.![](image_rsrc2H8.jpg)`version`
    - the package version.![](image_rsrc2H9.jpg)`architecture` - the architecture
    or platform the package is built for.![](image_rsrc2HA.jpg)`description` - a short
    description of the package.


    ## Installing a Package


    To install a package, use the `apt-get` command. The output below shows this for
    the `htop` package.


