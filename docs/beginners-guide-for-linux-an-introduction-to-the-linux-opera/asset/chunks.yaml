    this is file three


    $ cat file1 file2 file3

    this is file one

    this is file two

    this is file three

    ```


    使用重定向运算符，我们可以将所有三个文件写入一个文件。


    ```bash

    $ cat file1 file2 file3 > bigfile

    ```


    $ cat bigfile

    this is file one

    this is file two

    this is file three

    ```


