    ## 7.2 Introduction to grep

    The command-line tool `grep` is one of the most essential and powerful Linux commands,
    so much so that authors have written entire guides solely dedicated to it. `grep`
    acts as a filter and abbreviates the description of global regular expression
    print.


    The command works on text data as a filter and only prints the lines of text that
    match a given pattern. `grep` requires data to work on, in combination with a
    pattern to look for. In this context, data refers to a series of characters that
    can come from `stdin` or a file, and a pattern can be formulated as a series of
    characters or as a regular expression. Four different pattern styles are supported
    by `grep`:

    - `-G` (short for `--basic-regexp`): the pattern is formulated as a basic regular
    expression. This is the default case.

    - `-F` (short for `--fixed-strings`): the pattern is not a regular expression
    and is interpreted as a fixed string instead. Can also be abbreviated as `fgrep`.

    - `-E` (short for `--extended-regexp`): the pattern is formulated as an extended
    regular expression that allows an additional character set. Can also be abbreviated
    as `egrep`.

    - `-P` (short for `--perl-regexp`): the pattern is interpreted as a regular expression
    following Perl syntax.


    The number of options `grep` offers is quite extensive. The following is a list
    of the most notable options available:

    - `-c`: counts and prints the number of matches from the search, but does not
    print the matches themselves.

    - `--color`: highlights the matches from the search.

    - `-H` (short for `--with-filename`): each line of output starts with the name
    of the file the match was found in.

    - `-i`: ignores case-sensitivity and includes both lower and uppercase matches.

    - `-l` (short for `--files-with-matches`): prints only the filenames that match
    the search.

    - `-L` (short for `--files-without-matches`): prints only the filenames that did
    not match the search.

    - `-n` (short for `--line-number`): each line of output starts with the line number
    of the corresponding match in the file.

    - `-r` (short for `--recursive`): search recursively in a directory structure
    to include all subdirectories in the search.

    - `-v`: prints all lines that do not match the search pattern.


    These options will become clearer with the help of a few practical examples. First,
    we will search for the fixed string `Linux` in one or more AsciiDoc files (`.adoc`).
    The output consists of the lines that contain the pattern.$ `grep Linux *.adoc`


    ```

    The Linux Environment. First Steps

    ```


    $Next, we perform the same search but also output the filename and line number
    the pattern was found in. Each line of output starts with the name of the file
    followed by a colon (:), the line number, another colon, and then the line that
    matches the pattern. In our example, the pattern was found in line 1 of the file
    `introduction.adoc`.$ `grep -Hn Linux *.adoc`


    ```

    introduction.adoc:1:The Linux Environment. First Steps.

    ```


    $This time round, we will again search for the string `Linux` in one or more AsciiDoc
    files, but we will include both lowercase and uppercase characters in the search.$
    `grep -i Linux *.adoc`


    ```

    The Linux Environment. First Steps.

    include::what-about-linux/what-about-linux.adoc

    include::linux-in-day-to-day-life/linux-in-day-to-day-life.adoc

    include::navigating-linux/navigating-linux.adoc

    include::using-the-linux-terminal/using-the-linux-terminal.adoc

    ```


    $Next, we will reverse our search and only show the names of files that do not
    contain the pattern `Linux`.$ `grep -vrl Linux */*.adoc`


    ```

    acknowledgements/acknowledgements.adoc

    getting-help/getting-help.adoc

    linux-in-day-to-day-life/linux-in-day-to-day-life.adoc

    navigating-linux/navigating-linux.adoc

    preface/preface.adoc

    references/references.adoc

    setting-up-debian/setting-up-debian.adoc

    software-licenses/software-licenses.adoc

    using-the-linux-terminal/using-the-linux-terminal.adoc

    what-about-linux/what-about-linux.adoc

    x11/x11.adoc

    ```


    $Let ’s now look at a few examples that are slightly more complex. In this instance,
    we will make use of the `ls` command we’ve seen earlier in the guide and filter
    the output for a specific pattern range. More specifically, we will search for
    PDF documents that have the numbers 12 to 16 in the filename.$ `ls E*.pdf | egrep
    --color ''1[2-6].pdf$'' E_20160012.pdf`


    ```

    E_20160012.pdf

    E_20160013.pdf

    E_20160014.pdf

    E_20160015.pdf

    E_20160016.pdf

    ```


    $For the next example, we will search all the TeX files in the current directory
    that contain the pattern `nanostation` (a product name) with either an uppercase
    or lowercase `n` at the beginning, and either an uppercase or lowercase `s` in
    the middle of the name.$ `egrep --color ''[Nn]ano[Ss]tation'' *.tex`


    ```

    B0047.tex:Ubiquiti NanoStation M2

    B0057.tex:Ubiquiti Nanostation M2 Loco

    B0092.tex:Ubiquiti Nanostation M5

