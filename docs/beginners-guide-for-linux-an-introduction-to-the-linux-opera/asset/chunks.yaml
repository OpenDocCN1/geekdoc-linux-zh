    ### pstree

    The `pstree` command is similar to the `ps` command but displays the processes
    as a hierarchical tree. A useful switch is `-p` which adds the process ID to the
    process name.


    ### pidof

    The `pidof` command simply displays the ID of the specified process. The example
    below returns the PID of the processes that run `bash`.


    ```bash

    # pidof bash

    629 623

    ```


    ### pgrep

    `pgrep` is the `grep` command (seen earlier) for processes. This command looks
    through the currently running processes and outputs the process IDs that match
    the given pattern.


    The example below shows two calls. The first call asks `pgrep` to search for the
    processes that have the string pattern `xterm` in its name and to output the resulting
    process ID only. The second call uses the two options `-l` (short for `-list-name`)
    and `-a` (short for `--list-full`) to show the process ID and the resulting process
    name.


    ```bash

    $ pgrep xterm

    741

    $ pgrep -la xterm

    741 xterm

    749 xterm

    ```


    ### top and htop

    The `top` command displays the processes according to their activity. The most
    active process is on top, followed by the less active ones. The list is updated
    every second. The single columns contain the process ID (PID), the user name of
    the owner of the process (`USER`), the process priority (`PR`), the nice level
    (`NI`), the virtual memory usage (`VIRT`), the reserved memory (`RES`), the shared
    memory (`SHR`), both the percentile CPU and memory usage (`%CPU` and `%MEM`),
    the running time of the process (`TIME`) as well as the command that was used
    to invoke the process (`COMMAND`).


    `htop` is an additional software package (refer to Chapter 4 and Chapter 14 on
    installing additional packages) and contains a more interactive version of `top`.
    The arrangement of the columns is similar to `top`. Use the navigation and function
    keys to select the processes, sort them, or delete them.


    The function keys are:

    - `F1`: show help.

    - `F2`: configure htop.

    - `F3`: search within the process list.

    - `F4`: filter the terminal output.

    - `F5`: display the processes as a process tree.

    - `F6`: change the sort order of the processes.

    - `F7`: decrease the nice level of the selected process.

    - `F8`: increase the nice level of the selected process.

    - `F9`: terminate the selected process.

    - `F10`: quit the program.


    ## 15.2 Foreground and Background Processes

    There are two types of processes: foreground and background processes. Foreground
    processes are initialized and controlled through a terminal session. In other
    words, there has to be a user connected to the system to start these processes
    and the process occupies the terminal while it is executing. In contrast, background
    processes are not connected to the terminal and do not explicitly require any
    user input. They hence do not occupy the terminal while waiting to be completed
    and allow you to run multiple processes.


    Processes can be initialized in the background with the use of the `&` symbol.


    ```bash

    $ process1 &

    ...

    ```


    To send a running process to the background, use the command `bg` followed by
    the job ID. Alternatively `fg` will send the process to the foreground. You can
    use the `jobs` command to show the jobs that are currently running and their associated
    job IDs.


    ```bash

    $ process1 &

    $ process2 &

    $ jobs

    [1]+ Running process1

    [2]- Running process2

    ```


    ## 15.3 Stopping and Terminating Processes

    If a running program becomes unresponsive and causes load, what can we do to stop
    it and get rid of it? Luckily, we have a few options that allow us to send a specific
    signal to the program to stop it. The command used in this instance is the `kill`
    command with a corresponding switch. Among others, we have the following switches:


    - `SIGHUP` (1) - Hang up signal. Programs can listen for this signal and act upon
    it. This signal is sent to processes running in a terminal when you close the
    terminal.

    - `SIGINT` (2) - Interrupt signal. This signal is given to processes to interrupt
    them. Programs can process this signal and act upon it. You can also issue this
    signal directly by typing `CTRL+C` in the terminal window where the program is
    running.

    - `SIGTERM` (15) - Termination signal. This signal is given to processes to terminate
    them. Again, programs can process this signal and act upon it, for example writing
    data to a file before terminating. This is the default signal sent by the `kill`
    command if no signal is specified.

    - `SIGKILL` (9) - Kill signal. This signal causes the immediate termination of
    the process by the Linux kernel. Programs cannot listen for this signal.


    To terminate and kill a program named `hangingProgram` you will have to identify
    the program first. You do this by using `pgrep` to find the associated process
    as follows:


    ```bash

    $ pgrep hangingProgram

    3167

    ```


    Next, send the identified process the `SIGTERM` signal:


    ```bash

    $ kill -SIGTERM 3167

    ```


    As an alternative, you may invoke `kill` as follows:


    ```bash

    $ kill -15 3167

    ```


    Or you may stop the hanging process by pressing `CTRL+Z`, and then deleting the
    process using this command:


    ```bash

    $ kill -SIGKILL 3167

    ```


    As demonstrated above, this command does the same:


    ```bash

    $ kill -9 3167

    ```


    ## 15.4 Adjusting the Priority of a Process

    The processors of your machine can manage more than one task at the same time.
    We can set guidelines for the CPU to follow when it’s looking at the different
    tasks it has to execute. These guidelines are called niceness or nice values.
    The Linux niceness scale goes from -20 to 19, where a lower number represents
    a higher priority for a task. If the niceness value is high like 19, the task
    will be set to the lowest priority and the CPU will process it whenever it gets
    a chance. The default nice value is zero.


    You can display the nice level of a process using `ps` as follows:


    ```bash

    $ ps -o pid,comm,nice -p 1808

    PID COMMAND NI

    1808 bash 0

    ```


    The first column contains the Process ID (`PID`), the second column contains the
    command, and the third contains the nice level (`NI`). As demonstrated in the
    example above, the `bash` process with the PID `1808` has a nice level of 0. An
    existing process’s nice level can be adjusted using the `renice` command. To reduce
    the nice level of the process above to 10, issue the command below. Keep in mind
    that only a root user can apply negative nice values to a process.


    ```bash

    $ renice 10 -p 1808

    ```


    ## 16. System and Network Security

    The idea behind this chapter is to develop a basic understanding of how to set
    up and run a secure system. In the following section, we focus on a more practical
    approach and will have a look at the detection of open ports, existing and active
    users, limiting remote access, updating software, and making use of the computing
    power made available.


    ### 16.1 Open Ports

    If you have been following along since the beginning, you might recall that we
    set up our Linux distribution with a minimalistic installation. We installed only
    the software packages that we actually needed, and post-installed other software
    if it was necessary later on. We recommend this for all new installations, as
    the result is a very lean system with high performance that requires as little
    resources as possible. The second reason is the limited software restricts the
    number of potential security issues from inside the system.


    As the next step, we will check the number of services that are available from
    outside the Linux system. This is known as port scanning. The tools that will
    assist us are the command line tools `netcat` and `nmap` (short for Network Mapper)
    as well as its graphical version `zenmap`.


    #### netcat

    The following `nc` (`netcat`) command starts scanning the local desktop system
    (`localhost`) for available network services on ports between 1 and 1024. The
    switch `-zv` enables verbose scanning of ports:


    ```bash

    $ nc -zv localhost 1-1024

    localhost [127.0.0.1] 631 (ipp) open

    localhost [127.0.0.1] 111 (sunrpc) open

    localhost [127.0.0.1] 80 (http) open

    ```

