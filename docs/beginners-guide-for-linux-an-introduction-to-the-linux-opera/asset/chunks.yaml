    Slackware is the oldest active Linux distribution. The first release dates back
    to 1992. Regular releases are available without a fixed interval. It targets professional
    users and gives them as much freedom as possible. Slackware uses compressed `.tar.gz`
    archives as a package format and supports the four architectures `i486`, `alpha`,
    `sparc`, and `arm`. The distribution was also ported to architecture `s390.4`.


    # Setting up a Linux System

    As mentioned in the previous chapter, we will be using Debian for our demonstrations.
    To recap, Debian is a distribution that provides great stability and scales up
    exceptionally well once your skills and knowledge progress past the beginner stages.
    In this chapter we will install and configure Debian, showing you every single
    step along the way.


    ## 4.1 Types of Installations

    Debian offers a variety of methods for a proper setup. This includes a graphical
    and a text-based installation; we will use the former. For installation media
    the Debian developers offer three variants:![](image_rsrc29B.jpg)A CD or DVD for
    32-bit and 64-bit.![](image_rsrc29C.jpg)A network image for 32-bit and 64-bit
    (a so-called `Netinst-ISO`).![](image_rsrc29D.jpg)A mini-CD for 32-bit or 64-bit.


    We also have test media available. These include live images for 32-bit and 64-bit,
    and allow you to try Debian before installing it on your computer. During the
    time of writing this guide, version 10 is the current stable release of Debian.
    The setup described here is based on this release and the `amd64` architecture.


    After downloading the network image from `www.debian.org/distrib` no further static
    images are required. Instead, it depends on your internet connection to retrieve
    the packages to be installed and keep your operating system up-to-date. The entire
    process will take you about an hour and it allows you to have a lean software
    selection based on your specific needs. Software packages that you do not use
    will not be available on your system. They can however be added whenever you feel
    the need.


    The target system of our installation is an XFCE-based desktop system for a single
    user with a web browser and a music player. For the web browser we use `Mozilla
    Firefox` and for the music player, `VLC`. Both programs are a permanent component
    of the Linux distribution. The environment we use for demonstration purposes is
    a virtual machine based on `VirtualBox` with 4 GB of RAM and 8 GB of disc space.


    ## 4.2 Installing Linux Step-by-Step


    ### Boot Menu

    To begin with the installation of Debian, first boot the computer (in our case
    the `VirtualBox` image) from the `ISO` image you have downloaded. If you are also
    using a virtual machine, see your virtual machine vendor website for help on how
    to enable the `ISO` image. Next, wait for the boot menu to appear on the screen.
    The image below shows you the different options that are offered. Using the cursor
    keys, you can navigate the boot menu and the `Enter` key selects an entry.![](image_rsrc29E.jpg)The
    different options are:


    ![](image_rsrc29F.jpg)Graphical install: start the installation process using
    a graphical installer.![](image_rsrc29G.jpg)Install: starting the installation
    process using a text-based installer.![](image_rsrc29H.jpg)Advanced options: select
    further options like Expert mode, Automated install, or Rescue mode (see image
    below for more details).![](image_rsrc29J.jpg)Accessible dark contrast installer
    menu: switch to a black-and-white theme with higher contrast.![](image_rsrc29K.jpg)Help:
    get further help.![](image_rsrc29M.jpg)Install with speech synthesis: starting
    the installation process with speech support.![](image_rsrc29N.jpg)From the main
    boot menu choose the entry Graphical install, and press the `Enter` key to proceed.


    ### Language Selection

    Next, choose the language you prefer to be used during the entire installation
    process. The dialogs and messages are translated accordingly. This selection does
    not irrevocably determine the language your Linux system will have, you can always
    choose a different language later.

