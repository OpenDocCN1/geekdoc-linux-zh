    Linux system.From a terminal session, you can run the command reboot or shutdown
    -r now as an administrative user. Again, a regular user is not allowed to issue
    these commands.# reboot


    Subsequently, the system will reboot and you will return to the boot screen. ![](image_rsrc2BK.jpg)5\.
    Navigating LinuxFilesystems on UNIX/Linux systems contain different types of entries.
    This includes regular files, directories (or folders), symbolic links, block and
    character devices, named pipes, and sockets. This chapter deals with directories
    and the corresponding Linux tools.5.1 The Filesystem Hierarchy Standard (FHS)Modern
    Linux systems have a rather consistent directory structure, which is based on
    the Filesystem Hierarchy Standard (FHS). This definition specifies which main
    directories exist, and which content is stored in them. The FHS is maintained
    by the Linux Foundation. The latest version of the FHS is 3.0 and was released
    back in 2015\. The Linux distributions mentioned in Chapter 3 follow the FHS structure.
    Below are the common directories that are in use:Directory Description


    / Primary hierarchy root and root directory of the entire filesystem hierarchy/bin
    Essential command binaries for all the users /boot The boot loader/etc Abbreviates
    etcetera and contains host-specific system-wide configuration files/home The home
    directories of the users


    /lib Libraries essential for the binaries in /bin and /sbin /media Mount points
    for removable media/proc Abbreviates processes and is the virtual filesystem of
    the Linux kernel/root The home directory for the root user


    /sbin Essential system binaries


    /tmp Temporary data and files


    /usr Unix System Resources, contains user utilities and applications/var Variable
    data, such as log files and database filesSome Linux distributions have additional
    directories like /opt or use symbolic links. Linux also has some abbreviations
    in use, which can be quite helpful in your daily work:Abbreviation Description


    $HOME A local variable that contains the user''s home directory~ Points to the
    user''s home directory like /home/tom . Points to the current directory


    .. Points to the parent directoryYou can use these abbreviations on the command
    line in a terminal and in shell scripts to shorten commands. Next, we will look
    at some of these commands.5.2 Commands for DirectoriesAs with files, Linux offers
    a range of commands to list, create, remove, change and rename directories. You
    can use these commands in your terminal.Listing Directories


    To list the directories, use the command ls with the switch -d (short for -directory)
    as follows:$ ls -d */


    finances/


    projects/


    work/


    ...


    $This example lists The names of the directories in the current directory. The
    dotted line (...) in the output indicates that the list is longer and the output
    is shortened here.


    Two common ways of using the ls command are without any options and with the options
    -la (short for -l -a which means long all). The first output displays the entry
    names only for regular files, whereas the second output lists both regular and
    hidden entries. In order to list all the directories including the hidden ones
    starting with a period (.) use the find command as follows:$ find . -maxdepth
    1 -type d


    ./projects


    ./.mozilla


    ./.ipython


    ./.dbus


    ./video


    ...


    $The tree command searches the directory recursively and outputs an entire directory
    structure quite nicely. The switch -d limits the output to directories only and
    looks as follows:$ tree -d


    .


    |–––– archive


    | |–––– ballet-zebola


    | | |–––– documents


    | | |–––– invoices


    | |–––– charles-darwin-university


    |–––– projects


    |–––– .dbus


    |–––– .ipython


    |–––– .mozilla


    ...


    $Creating Directories


    To create a directory, use the mkdir command (make directory). The next example
    creates a new entry named training in the current directory:


    $ mkdir training


    $


    The switch -v (short for --verbose) prints an additional message that the command
    succeeded.$ mkdir -v training


    mkdir: directory "training" created


    $The switch -p (short for --parents) allows you to create entire subdirectory
    structures. Parent directories that do not exist yet are created as well. The
    following example creates the directory training as well as its subdirectories
    linux (level 1) and lpic1 (level 2).$ mkdir -p training/linux/lpic1


    $To create two subdirectories on the same level, make use of the underlying command
    line interpreter’s capabilities. The Bash uses values in curly brackets { } to
    achieve this. The next example shows you how to create the two directories training/linux
    /lpic1 and training/linux/lpic2 in one go:$ mkdir -p training/linux/{lpic1,lpic2}


    $


    Removing Directories


    Removing a directory is done using the rmdir command (remove directory). The next
    example removes the entry named training in the current directory:


    $ rmdir training


    $


    As with mkdir, the switch -v (short for --verbose) prints an additional message
    that the command succeeded.$ rmdir -v training


    mkdir: directory is removed, "training"


    $This works well, as long as the directory is empty. In case your directory contains
    any entries like files or subdirectories, the rmdir command will complain when
    using this message, and keep the directory unchanged:$ rmdir training


    rmdir: failed to remove `training'': Directory not empty $To solve this situation
    the rm command (remove) combined with the switch r (short for --recursive) becomes
    quite handy. Then, rm removes all the entries recursively. The following example
    combines the two switches -r and


    -v to delete one file and three directories.$ tree training/


    training/


    |–––– lpic1


    | |–––– introduction.txt |–––– lpic22 directories, 1 file


    $ rm -rv training/


    „training/lpic1/introduction.txt" was removed Directory was removed: „training/lpic1"
    Directory was removed: „training/lpic2" Directory was removed: „training/"'
