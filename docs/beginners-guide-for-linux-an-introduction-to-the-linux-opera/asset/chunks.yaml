    ### 13.2 软链接


    软链接，也称为符号链接（symbolic link），是文件系统中指向另一个文件名的链接。它非常类似于 Windows 系统中的快捷方式。与硬链接不同，符号链接不包含目标文件的数据，它只是指向文件系统某处的另一个节点。这种区别使得软链接具有硬链接不具备的特性，例如能够链接到目录、字符设备、块设备或通过
    NFS 网络的远程计算机上的文件。


    要在 Linux 中创建软链接，我们将使用相同的 `ln` 命令，但加上 `-s` 选项。`-s` 是 `--symbolic` 的缩写。


    ```bash

    $ touch test

    $ ln -s test softlink1

    $ ln -s test softlink2

    $ ln -s test soft link3

    ```


    再次，`ls -i` 的输出显示了两列：索引节点（inode）和文件名。你会发现这四个文件的 inode 号是不同的，且 `softlink1`、`softlink2`、`softlink3`
    和 `test` 指向不同的 inode。


    ```bash

    $ ls -i test softlink*

    260931 softlink1

    260932 softlink2

    260933 softlink3

    ```


    如果你使用 `-l` 选项（长格式）调用 `ls` 命令，输出所示。最左侧的列以 `l` 开头表示链接，最右侧列显示软链接指向的文件名。


    ```bash

    $ ls -l softlink*

    lrwxrwxrwx 1 user user 4 Sep 15 14:05 softlink1 -> test

    lrwxrwxrwx 1 user user 4 Sep 15 14:05 softlink2 -> test

    lrwxrwxrwx 1 user user 4 Sep 15 14:05 softlink3 -> test

    ```


    ### 13.3 实际示例


    在这个示例中，我们将观察如何使用硬链接连接两个文件，以及如何再次取消链接。首先，我们使用 `echo` 并重定向输出创建一个名为 `file1` 的文件。`echo`
    是一个内置 shell 命令，用于输出文本。该命令还会打印变量的值。


    ```bash

    $ echo "This is File One" > file1

    $ cat file1

    This is File One

    ```


    接下来，将 `file2` 链接到 `file1`，并将 `file2` 的内容输出到 `stdout`。


    ```bash

    $ link file1 file2

    $ cat file2

    This is File One

    ```


    现在它们都是同一个文件。让我们对 `file2` 进行修改并看看会发生什么。


    ```bash

    $ echo "This is line Two" >> file2

    $ cat file1

    This is File One

    This is line Two

    ```


    如示例所示，`file1` 和 `file2` 都被视为同一个文件。


    ```bash

    $ ls -l

    total 0

    $ echo "This is File One" > file1

    $ cat file1

    This is File One

    $ link file1 file2

    $ ls

    file1 file2

    $ cat file2

    This is File One

    $ echo "This is line Two" >> file2

    $ cat file2

    This is File One

    This is line Two

    $ cat file1

    This is File One

    This is line Two

    ```


    取消 `file1` 会删除指向 `file1` 的硬链接，但 `file2` 仍在那里。


    ```bash

    $ unlink file1

    $ ls

    file2

    ```


    取消 `file2` 会删除硬链接并删除文件，因为不再没有指向该文件的硬链接。


    ```bash

    $ unlink file2

    $ ls

    $ ls -al

    total 8

    drwxr-xr-x 5 jk 4096 Sep 18 22 .

    drwxr-xr-x 3 jk 4096 Sep 18 15 ..

    ```


    ## 14. 软件包管理


    在当今的世界，软件非常复杂。这种复杂性源于程序被拆分为多个组件，如二进制数据、共享库和文档。这种软件开发的概念被称为模块化，被广泛接受和使用。例如，Debian
    提供了超过 50000 个不同的软件包。软件包管理涵盖了处理这些软件包的所有操作，包括安装、配置、删除和更新。它还涵盖了软件包依赖关系。


    ### 14.1 理解软件包架构


    为了解释 Linux 软件包架构，我们将使用 Debian 进行。Debian 发行版以其稳定的软件包系统闻名。以下描述适用于所有源自 Debian 的 Linux
    发行版，如 Ubuntu、Linux Mint、Knoppix、Kali Linux 和 Xandros。注意，软件包的名称可能不同，发行版特定的镜像和软件包类别也是如此。


    Debian 软件包生态系统包含许多不同的组件，如软件包列表、软件包源、软件包镜像、不同的软件包、用于软件包设置软件以及软件包缓存。这些组件将在下文中详细说明。


    #### 软件包列表

    Debian 包含可用软件包列表。此列表在 `/etc/apt/sources` 文件中引用，以及 `/etc/apt/sources.list.d` 目录下的特定组件。例如，Messenger
    使用 `skype-stable.list` 文件。列表使用文本格式，每行一个软件包源：


    ```text

    deb http://ftp.debian.org/debian/ stretch main contrib non-free

    deb-src http://ftp.debian.org/debian/ stretch main contrib non-free

    ```


    每行指向二进制软件包类型 (`deb`) 或源软件包类型 (`deb-src`)。软件包类型后面是软件包源，它指向提供软件包的存储库。接下来，该行包含 Debian
    版本的名称，可以指定为版本的别号或分支。


    别号源自电影《玩具总动员》中的角色。分支指的是版本的开发阶段，可以是 oldoldstable（上上版本）、oldstable（上一个版本）、stable（当前版本）、testing（下一个版本）、unstable（未来版本）或
    experimental。在分支名称之后是软件包类别。


    Debian 9 Stretch 的安全更新条目如下：


    ```text

    deb http://security.debian.org/ stretch/updates main contrib non-free

    src http://security.debian.org/ stretch/updates main contrib non-free

    ```


    为了从引用的软件包源刷新软件包列表，调用以下命令：


    ```bash

    # apt-get update

    ```


