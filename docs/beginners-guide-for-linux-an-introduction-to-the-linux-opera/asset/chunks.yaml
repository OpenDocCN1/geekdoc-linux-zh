    UUID. This method creates a UUID consisting mostly of random bits. This is the
    default value if not explicitly specified.$ uuidgen -r


    4d545248-cf36-4d24-91ab-64a9ed276072


    $The second option is -t (short for --time) which generates a time-based UUID.
    This method creates a UUID based on the system clock plus the system’s ethernet
    hardware address if present.$ uuidgen -t


    4afa1166-bcf1-11e8-9a0a-68f728ff3d63


    $The uuidgen command writes the newly generated UUID to stdout. You can copy and
    paste the new UUID directly into /etc/fstab to have a unique identifier for a
    partition to be referenced.12.7 Setting up New PartitionsThe idea behind fdisk
    and its counterparts, cfdisk and gparted, is to view the partitions on a disk
    and to add, remove or edit partitions. In this section, we will have a look at
    fdisk, which is a standard package for Debian and is also available on all major
    Linux distributions. Both cfdisk and gparted are nonstandard packages and may
    require separate installation. We discuss the installation of additional packages
    in Chapter 4 and Chapter 14.In order to use fdisk, as a root user type fdisk followed
    by the name of the drive. The next example shows this for the first SCSI disk
    named /dev/sda.


    # fdisk /dev/sda'
