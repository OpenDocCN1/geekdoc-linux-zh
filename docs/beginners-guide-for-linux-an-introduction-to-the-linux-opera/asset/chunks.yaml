- fmt: "\nRemoving unused software helps a lot. It’s also important to keep the remaining\
    \ packages up-to-date, which we discussed in Chapter 14.16.5.\n\n# Useful Network\
    \ and System Commands\n\n`uname` abbreviates the term UNIX name. The command displays\
    \ system information such as the exact name and version of the Linux kernel and\
    \ the hostname of your computer. The example below shows the call of the `uname`\
    \ command with the parameter `-a` (short for `--all`). The output contains the\
    \ name of the operating system (Linux), the hostname (debian106), the kernel version\
    \ and its build date (4.9.8-7-amd64 #1 SMP Debian 4.9.110-1 (2018-07-05)) as well\
    \ as the architecture of the system (x86_64).\n\n```bash\n$ uname -a\nLinux debian106\
    \ 4.9.0-7-amd64 #1 SMP Debian 4.9.110-1 (2018-07-05) x86_64 GNU/Linux \n```\n\n\
    `uptime` This command shows how long the system is running. It displays the current\
    \ time (07:36:47) followed by the uptime in hours (21:56), the number of logged-in\
    \ users (1 user), and the average load (load average: 0.47, 0.43, 0.29) for the\
    \ last 1, 5, and 15 minutes.\n\n```bash\n$ uptime\n07:36:47 up 21:56, 1 user,\
    \ load average: 0.47, 0.43, 0.29\n```\n\nTo see the uptime in a better way, use\
    \ the option `-p` (short for `--pretty`). The example below displays a more human-readable\
    \ version of the information. The system is up 22 hours and 3 minutes.\n\n```bash\n\
    $ uptime -p\nup 22 hours, 3 minutes\n```\n\n`ip` The `ip` command (along with\
    \ the two keywords `address` `show`) displays the current network configuration.\
    \ The example below shows the loopback interface (`lo`) and the ethernet interface\
    \ (`enp0s3`). The ethernet interface is configured with the IP address `10.0.2.15`.\
    \ The network interfaces are abbreviated as follows:\n\n![](image_rsrc2J9.jpg)\n\
    - `Lo`: the loopback interface. It is used to access local services such as a\
    \ proxy or web server.\n![](image_rsrc2JA.jpg)\n- `eth0`: the first Ethernet interface\
    \ connected to a network switch or router.\n![](image_rsrc2JB.jpg)\n- `wlan0`:\
    \ the first wireless interface.\n![](image_rsrc2JC.jpg)\n- `ppp0`: the first point-to-point\
    \ interface, used to connect via VPN or dial-up service.\n\n```bash\n$ ip address\
    \ show\n1: lo: <LOOPBACK, UP, LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN\
    \ group default qlen 1link/loopback 00: 00: 00: 00 00: 00 brd 00: 00: 00: 00 00:\
    \ 00\ninet 127.0.0.1/8 scope host lo\nvalid_lft forever preferred_lft forever\n\
    inet6 ::1/128 scope host\nvalid_lft forever preferred_lft forever\n2: enp0s3:\
    \ <BROADCAST,MULTICAST, UP, LOWER_UP> mtu 1500 qdisc pfifo_fast state UP group\
    \ default qlen 1000link/ether 08: 00: 27: e3: 5c: 79 brd ff: ff: ff: ff: ff: ff:inet\
    \ 10.0.2.15/24 brd 10.0.2.255 scope global enp0s3\nvalid_lft forever preferred_lft\
    \ forever\ninet6 fe80::a00:27ff:fee3:5c79/64 scope link\nvalid_lft forever preferred_lft\
    \ forever\n```\n\n`ping` sends ICMP network packets to the given IP address or\
    \ hostname, and displays the turnaround time. The example below demonstrates this\
    \ for the host `http://www.google.com`.\n\n```bash\n$ ping google.com\nPING google.com\
    \ (127.217.23.142) 56(84) bytes of data.\n64 bytes from fra16s18-in-f14.1e100.net\
    \ (172.217.23.142): icp_seq=1 ttl=63 time=36.9 ms 64 bytes from fra16s18-in-f14.1e100.net\
    \ (172.217.23.142): icp_seq=2 ttl=63 time=37.9 ms 64 bytes from fra16s18-in-f14.1e100.net\
    \ (172.217.23.142): icp_seq=3 ttl=63 time=40.1 ms ^C\n--- google.com ping statistics\
    \ --\n3 packets transmitted, 3 received, 0% packet loss, time 2003ms\nrtt min/avg/max/mdev\
    \ = 36.953/38.353/40.193/1.377 ms\n```\n\n# 17. Shared Libraries\n\nLinux, like\
    \ any operating system, contains collections of files used for different purposes\
    \ such as binary files (compiled program code), runtime interpreted code (written\
    \ in programs like Perl or Python), configuration files, log files, libraries,\
    \ and user data. In the world of programming, a library is an assortment of pre-compiled\
    \ pieces of code that can be used in other programs. These libraries contain functions,\
    \ classes, and data structures. They allow the reuse of code that already exists\
    \ and has already been tested, so the user doesn’t need to reinvent the wheel.\
    \ As a result, libraries significantly simplify the life for programmers. Among\
    \ the most prominent examples of libraries in Linux are `libc`, the standard C\
    \ library, and `glibc`, the GNU version of `libc`.\n\nLinux distinguishes between\
    \ statically and dynamically linked binary programs. Statically linked, means\
    \ the routines from the library become part of the program. In contrast, dynamically\
    \ linked means the routines from the library are referenced only and do not become\
    \ part of the program. Statically linked programs are entirely independent of\
    \ one another but require more disk space. Dynamically linked programs are smaller\
    \ but depend on the reference libraries, meaning they load quicker if the referenced\
    \ library is already in memory. These libraries are called shared libraries or\
    \ dynamic libraries.\n\n## 17.1 Naming Conventions\n\nIt is common to extend the\
    \ filename of a shared library with `.so` which abbreviates the term shared object.\
    \ Apart from the filename, a shared library also has a library name known as a\
    \ `soname`. As an example, the `soname` for `libc` is `libc.so.6`. Here `lib`\
    \ is the prefix, `c` is a descriptive name, `so` is short for shared object, and\
    \ `6` is the version of the library (the version of the Application Binary Interface\
    \ or ABI). The filename including the path is `/lib64/libc.so.6`. Note that the\
    \ `soname` is a symbolic link to the filename.\n\nUsually these files reside in\
    \ the following directories:\n\n![](image_rsrc2JD.jpg)\n- default paths - `/usr/local/lib`,\
    \ `/usr/local/lib64`, `/usr/lib`, `/usr/lib64/`.\n![](image_rsrc2JE.jpg)\n- system\
    \ startup libraries - `/lib`, `/lib64`.\n\nProgrammers can however install libraries\
    \ in custom locations. The library path is defined in the configuration file `/etc/ld.so.conf`.\
    \ Defining the library location can be done in the following manner:\n\n```bash\n\
    $ cat /etc/ld.so.conf\ninclude /etc/ld.so.conf\n```\n\nThe following command illustrates\
    \ how to find the shared libraries on your system using the `find` command:\n\n\
    ```bash\n$ find / -name \"*.so*\"\n```\n\n## 17.2 Identifying Referenced Shared\
    \ Libraries\n\nTo find out which shared objects a binary uses, we can use the\
    \ `ldd` command. For example, to find the shared objects of a file, each line\
    \ within the output consists of the `soname` followed by the filename in brackets.\n\
    \n```bash\n$ ldd /bin/bash\nlinux-vd-x86-64.so.2 (0x0000555cbfa60000)\nlibang.so.2\
    \ => /lib/x86_64-linux-gnu/libang.so.2 (0x00007f483d6bb000)\nlibgpm.so.2 => /lib/x86_64-linux-gnu/libgpm.so.2\
    \ (0x00007f483d4b500)\nlibext2fs.so.2 => /lib/x86_64-linux-gnu/libext2fs.so.2\
    \ (0x00007f483d26e00)\nlibssh2.so.1 => /lib/x86_64-linux-gnu/libssh2.so.1 (0x00007f483d04500)\n\
    libgmodule-2.0.so => /lib/x86_64-linux-gnu/libgmodule-2.0.so (0x00007f483cb41000)\n\
    libglib-2.0.so => /lib/x86_64-linux-gnu/libglib-2.0.so (0x00007f483cb31000)\n\
    libpthread.so.0 => /lib/x86_64-linux-gnu/libpthread.so.0 (0x00007f483c91400)\n\
    libc.so.6 => /lib/x86_64-linux-gnu/libc.so.6 (0x00007f483c569000)\nlibdl.so.2\
    \ => /lib/x86_64-linux-gnu/libdl.so.2 (0x00007f483c36400)\nlibm.so.6 => /lib/x86_64-linux-gnu/libm.so.6\
    \ (0x00007f483c06300)\nlibcom_err.so.2 => /lib/x86_64-linux-gnu/libcom_err.so.2\
    \ (0x00007f483be5f000)\nlibz.so.1 => /lib/x86_64-linux-gnu/libz.so.1 (0x00007f483bc43000)\n\
    libgcrypt.so.20 => /lib/x86_64-linux-gnu/libgcrypt.so.20 (0x00007f483b962000)\n\
    libpcre.so.3 => /lib/x86_64-linux-gnu/libpcre.so.3 (0x00007f483b6f4000)\n/lib64/ld-linux-x86-64.so.2\
    \ (0x0000555cbfa60000)\n```\n"
