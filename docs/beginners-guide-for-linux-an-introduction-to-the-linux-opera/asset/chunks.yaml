    ## 使用 cpuid 检测 CPU

    为了获取有关你的 Linux 系统中 CPU 的更多信息，请使用 `cpuid` 命令。该工具可以通过名为 `cpuid` 的 Debian 包获取。下面是该命令返回的详细信息示例。


