    ## Updating an Installed Package


    Updating an installed package is quite easy and done in the following way. First,
    update the package list using `apt-get update` as described earlier in this chapter.
    Then run `apt-get install` to update the package. If an updated version of the
    package is available, the new package will be retrieved from the package mirror,
    the old package will be removed, and the new one will be installed.


    ## Removing an Installed Package


    Removing an installed package is done in a similar way as installing or updating.
    The `apt-get` command has the option to remove the package as shown below.


    ```bash

    # apt-get remove htop


    Reading package lists… Done


    Building dependency tree


    Reading state information… Done


    The following packages will be REMOVED:

    htop

    0 upgraded, 0 newly installed, 1 to remove and 35 not updated.


    After this operation, 224 kB of additional disk space will be freed.


    Do you want to continue? [Y/n]


    (Reading database … 82751 files and directories currently installed.)


    Removing htop (2.0.2-1)…


    Processing triggers for mimesupport (3.60) …

    support (3.60) …

    1) …

    1) …

    2) …

    ```


    This step removes all of the package content except for the configuration files.
    To entirely remove the package with its configuration files, add the switch `--purge`
    as follows:


    ```bash

    # apt-get remove --purge htop

    ```


    ## Finding Linux Alternatives


    You may find that certain programs are not compatible with Linux and were created
    to only run on Windows or macOS. The great thing about Linux though is that for
    every Windows or macOS application, there is almost always a Linux alternative.
    Below are two great resources for finding Linux-specific applications.


    ![](image_rsrc2HB.jpg)https://www.linuxalt.com/

    ![](image_rsrc2HC.jpg)https://linuxfinder.com/


    # 15. Process Management


    Understanding the execution of a program is essential for being a good administrator
    but also useful for general users. A running instance of a program is known as
    a process. Every process is assigned a Process ID (PID) which allows the system
    to keep track of all processes. The system process has PID 0, then the initial
    process has PID 1, and so on in sequential manner. The initial process PID 1 refers
    to `/sbin/init` on older systems or `/sbin/systemd` on contemporary systems.


    ### 15.1 Working with ps and pstree


    To list all the running processes, use either the `ps` command or the `pstree`
    command.


    ```bash

    # ps


    PID TTY TIME CMD

    628 pts/0 00:00:00 su

    629 pts/0 00:00:00 bash

    2507 pts/0 00:00:00 ps

    ```


    The output of `ps` as shown above consists of four columns that have the following
    meanings:


    ![](image_rsrc2HD.jpg)`PID` - the process ID.![](image_rsrc2HE.jpg)`TTY` - the
    terminal from which the command was invoked.![](image_rsrc2HF.jpg)`TIME` - the
    time the process has been active.![](image_rsrc2HG.jpg)`CMD` - the command that
    was invoked


    The following switches can be used to retrieve additional information regarding
    the processes:


    ![](image_rsrc2HH.jpg)`-e`: shows all processes.![](image_rsrc2HJ.jpg)`-p`: shows
    information for the given process id only.![](image_rsrc2HK.jpg)`-C`: shows processes
    that refer to the given command name.![](image_rsrc2HM.jpg)`-u`: shows processes
    that belong to the given username.


    ```bash

    $ ps -u fritz


    PID TTY TIME CMD

    1341 ? 00:00:00 systemd

    1406 ? 00:00:32 xfwm4

    1408 ? 00:01:10 xfce4-panel

    1410 ? 00:00:15 xfdesktop

    1411 ? 00:00:05 xfsettingsd

    1413 ? 00:00:05 x-www-browser

    1415 ? 00:00:06 xfce4-power-man

