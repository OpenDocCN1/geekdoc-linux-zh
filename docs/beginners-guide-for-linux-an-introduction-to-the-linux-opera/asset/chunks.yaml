    # 19. 获取帮助

    Linux 是一个相当复杂的操作系统，对初学者来说尤其是如此。当你开始时，程序列表可能会让你非常困惑。每个程序的参数或选项列表都比上一个长。而且它们并不容易记忆，有长名称和短名称，且没有统一标准。在遇到困难时寻求帮助并不是错误，也不是失败的标志。


    要在 Linux 系统上获取帮助，有几种方法可以。这包括手册页（称为 `man pages`）、信息页（称为 `info pages`）以及每个命令内置的帮助。在本章中，我们将更深入地查看这些帮助系统，并熟悉
    `man`、`info`、`whereis` 和 `whatis` 命令。


    ## 19.1 Man Pages

    手册页（Man pages）是分发程序文档的传统方式。`man page` 是 `manual page` 的缩写，因为它们对应于打印版手册的页面。手册页是
    Linux 系统基础安装的一部分。相应的 Debian 软件包名为 `manpages`。


    一个手册页对应于完整 UNIX 手册中的特定章节：1 代表命令，2 代表系统调用，此类等。要获取有关特定命令的信息，请在终端窗口中打开相应的手册页。例如，对于
    `cp` 命令，操作如下：


    ```bash

    $ man cp

    ```


    生成的手册页所示![](img/image_rsrc2JH.jpg) 快捷键绑定与文本编辑器 `vi(m)` 类似。使用方向键向上和向下滚动，按 `q` 退出手册页并返回终端。


    ## 19.2 Info Pages

    `Info` 是 GNU 项目内部文档的默认格式。在 20 世纪 90 年代初，GNU 项目认为手册页系统已经过时，并编写了 `info` 命令来取代它。`info`
    具有基础的超链接功能，并使用一种更简单的标记语言（与手册页使用的 `troff` 系统相比）。如今，这两个系统并存存在。


    Debian 的基础安装不包含 `info` 页。为了使用它，请后安装名为 `info` 的软件包（参考第 4 章和第 14 章关于如何安装额外软件包）。要获取有关特定命令的信息，请在终端窗口中打开相应的
    info 页。例如，对于 `cp` 命令，操作如下：


    ```bash

    $ info cp

    ```


    生成的 info 页所示![](img/image_rsrc2JJ.jpg)


    ## 19.3 Integrated 帮助

    除了 `man` 和 `info`，许多命令都有 `-h` 选项（`-help` 的缩写）。带有此选项调用命令会打开特定的帮助部分。下面的示例显示了 `uname`
    命令的内置帮助![](img/image_rsrc2JK.jpg)


    此外，`whatis` 命令对于获取 Linux 命令或函数的简要信息很有帮助。它会为作为命令行参数传递给 `whatis` 的字符串显示单行的手册页描述。`whatis`
    在其由 `mandb` 程序维护的索引数据库中搜索该字符串，并从该命令手册页的 `NAME` 部分中选取一个简短描述。下面的示例显示了 `mv` 和 `man`
    两个命令的情况：


    ```bash

    $ whatis mv

    mv (1) - move (rename) files


    $ whatis man

    man (1) - an interface to the on-line reference manuals

    man (7) - macros to format man pages

    ```


    另一个选项是 `whereis` 命令，有助于在 Linux 系统中定位命令的手册页。这是一个非常简单的实用。下面的示例显示了 `mv` 和 `man` 两个命令：


    ```bash

    $ whereis mv

    mv: /bin/mv /usr/share/man/man1/mv.1.gz


    $ whereis man

    man: /usr/bin/man /usr/local/man /usr/share/man /usr/share/man/man1/man.1.gz /usr/share/man/ma

    ```


    每个命令还提供额外的信息和配置示例。这些内容存储在目录 `/usr/share/doc`，每个程序都有自己的子目录。内容是标准且因程序而异。内容对每个用户可见。下方显示了目录的一个片段![](img/image_rsrc2JM.jpg)


    ## 19.4 External Help

    如果软件工具提供的帮助不够，且需要进一步的解释，那么外部资源就会派上用场。可以咨询一些在线社区，例如![](img/image_rsrc2JN.jpg)


    - LinuxHint: `https://support.linuxhint.com`![](img/image_rsrc2JP.jpg)

    - LinuxHelp: `https://www.linuxhelp.com`


    另一个选项是 Linux 用户组 (LUG)。LUG 是来自同一地理位置的人员小组，他们共享对 Linux 操作系统的共同兴趣。他们被组织成松散的人群或定期聚会的协会。全球
    LUG 的完整列表可以通过 `LugsList` 获取，地址为 `http://lugslist.com`![](img/image_rsrc2JR.jpg)。许多
    LUG 组织聚会和经验分享，并从每个国际活动中学习。这包括分享想法和交流的本地和其他活动![](img/image_rsrc2JS.jpg)


