    ## 6.4 Shell 脚本


    乍看之下，shell 脚本听起来可能令人望畏，但其实非常简单。在最简单的形式，它只是存储在文件中的一系列 UNIX/Linux 命令，并由命令行解释器逐行执行。shell
    脚本类似于在终端中输入单条命令，但它们是批处理的。这使得速度快得多，并有助于自动化任务。对于本指南，我们不会深入探讨 shell 脚本的编程复杂性。但 shell
    脚本的推荐结构值得注意的![](img/image_rsrc2BX.jpg)


    - **Shebang 行** - 定义将使用哪个程序来正确处理 shebang 行随后的指令。该行以 `#!` 开头，这是一个双字节数字，表示随后的行是可执行的
    shell 脚本。shebang 之后是用于处理指令的解释器或程序的路径。![](img/image_rsrc2BY.jpg)

    - **Docstring（文档字符串）** - 对脚本功能和代码软件许可协议的简短描述。这可以是单行，也可以是详细的描述。此类行以 `#` 开头，并被 shell
    视为注释![](img/image_rsrc2BZ.jpg)

    - **Commands（命令）** - 由 shell 执行的单条命令的组合。如所述，这可以少到只有单行指令（如我们下方的示例所示），也可以是一个完整的程序![](img/image_rsrc2C0.jpg)

    - **Exit state（退出状态）** - 定义脚本的返回值。除非明确说明，否则将返回脚本中执行的最后一个命令的退出状态。通常在成功时返回 0，在出错时返回
    1 到 255 之间的值。


    以下基础脚本包含了上述提到的所有元素。该脚本的目的是确定计算机的运行时间（uptime）。


    ```bash

    #!/bin/bash


    # 确定系统的运行时间


    # 根据 GNU 公共许可证 (GPL) 发布


    uptime


    # 定义退出状态：无错误


    exit 0

    ```


    执行 shell 脚本有两种方法。我们可以调用 Bash 等 shell 来运行它，或者为脚本设置可执行标记后运行它。第一种方法使用 Bash，如下：


    ```bash

    $ bash uptime.sh

    12:20:31 up 7 days, 2:09, 6 users, load average: 0,74, 0,40, 0,27

    ```


    $

    第二种方法基于两个步骤。首先，我们使用 `chmod` 命令为脚本设置可执行标记，如下：


    ```bash

    $ chmod u+x uptime.sh

    ```


    $

    然后我们可以运行脚本：


    ```bash

    $ ./uptime.sh

    12:26:07 up 7 days, 2:14, 6 users, load average: 0,23, 0,34, 0,28

    ```


    ## 7 文本处理


    Linux 大部分基于文本文件运行。例如，存储在 `/etc` 中的配置文件是以文本文件形式存储的。Linux 提供了丰富的文本处理命令，这些命令非常全面且节省时间。了解它们是什么以及如何工作，将在许多深入探讨
    Linux 的后续章节起到起到关重要的作用。在本章中，我们将查看这些命令并展示如何使用它们。


    ### 7.1 文本处理命令


    #### cat


    concatenate（连接）的缩写，`cat` 将文件内容输出到屏幕或标准输出。命令 `cat /etc/passwd` 将 `/etc/passwd`
    文件的所有行输出到屏幕。


    ```bash

    $ cat /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin

    bin:x:2:2:bin:/bin:/usr/sbin/nologin

    sys:x:3:3:sys:/dev: /usr/sbin/nologin

    sync:x:4:65534:sync:/bin:/bin/sync

    games:x:5:60:games:/usr/games:/usr/sbin/nologin

    man:x:6:12:man:/usr/sbin:/usr/sbin/nologin

    lp:x:7:7:lp:/var/spool:/usr/sbin/nologin

    mail:x:8:8:mail:/var/mail:/usr/sbin/nologin

    news:x:9:9:news:/var/spool/news:/usr/sbin/nologin

    ```


    `cat` 还可以将文件内容输出到屏幕。例如，`cat output.txt` 将 `output.txt` 的内容输出到屏幕上。


    ```bash

    $ cat output.txt

    hello world

    this is a test

    to see if works

    ```


    `cat` 通过重定向运算符写入文件。例如：


    ```bash

    $ cat > output.txt

    hello world

    this is a test

    to see if works

    ```


    `cat` 还可以输出到屏幕。按下 `Ctrl+D` 退出并输入 `cat output.txt` 查看结果。


    ```bash

    $ cat output.txt

    hello world

    this is a test

    to see if works

    ```


    `cat` 的其他有用选项有![](img/image_rsrc2C1.jpg)`E`（对应 `--show-ends`）：在每行末尾输出 `$`![](img/image_rsrc2C2.jpg)`n`（对应
    `--number`）：为所有输出行编号![](img/image_rsrc2C3.jpg)`s`（对应 `--squeeze-blank`）：压缩连续的空行。`cat`
    还可以同时输出多个文件。命令 `cat /etc/passwd /etc/group` 将输出 `/etc/passwd` 和 `/etc/group` 的内容。注意原始文件不受影响。下面的示例两次输出
    `output.txt` 的内容，并持续使用 `-n` 选项为所有输出编号。


    ```bash

    $ cat -n output.txt output.txt

    1 hello world

    2 this is a test

    3 to see if works

    4 hello world

    5 this is a test

    6 to see if works

    ```


    为了更丰富的示例，我们将创建三个名为 `file1`、`file2` 和 `file3` 的文本文件。使用命令 `cat > file1`、`cat > file2`
    和 `cat > file3` 创建这些文件。不要忘记按下 `Ctrl+D` 退出并使用命令 `cat file1 file2 file3` 查看它们。


