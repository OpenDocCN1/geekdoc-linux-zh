    ## 12.4 Mounting a Filesystem

    Before a filesystem can be used, it must be mounted as part of the directory tree.
    Most of the time, this is done automatically at startup but can also be done manually.
    We briefly looked at the commands used for manual mounting at the end of the previous
    chapter, but we will go into more detail on their usage here.


    To demonstrate, we will mount the first partition of the second SCSI disk (`/dev/sdb1`)
    as `/space`. Firstly, in order to mount a filesystem you must be in root. Next,
    if the directory `/space` does not exist yet, we must create it using `mkdir`
    as follows:


    ```bash

    mkdir /space

    ```


    Then run the `mount` command to include this directory:


    ```bash

    mount /dev/sdb1 /space

    ```

    Most of the time Linux detects the filesystem type automatically. If this is not
    the case and the type is not detected automatically, use the `-t` parameter (short
    for `--type`) followed by the name of the filesystem type to force it. This step
    assumes that the relevant filesystem type is installed and recognized by the Linux
    kernel. To list all the filesystems supported by the Linux kernel, the combination
    of the commands `cat`, `awk`, `sed`, `ls`, and `sort` can be used as shown below.


    Of the commands not discussed yet, `sort` is used to sort files in a specified
    order and will be discussed in more detail in Chapter 7. We will not be going
    into much detail on `awk` and `sed` other than this example, as this is outside
    the scope of this guide. In this example, they are essentially used to clean up
    the data to be more usable.


    ```bash

    cat /proc/filesystems | awk ''{print $NF}'' | sed ''/^$/d''; ls -1 /lib/modules/$(uname
    -r)/kernel/fs | sort -u

    ```


