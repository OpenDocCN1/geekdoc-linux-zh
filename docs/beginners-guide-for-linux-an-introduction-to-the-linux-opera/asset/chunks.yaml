    ![](img/image_rsrc27N.jpg)


    # 1. 什么是 Linux？


    Linux 是一个依赖于 UNIX 标准的工作框架的名称。这个名字源于其芬兰设计者林纳斯·托瓦尔斯（Linus Torvalds）的首要名，并遵循了其他基于
    UNIX 的框架所使用的哲学（最后一个字母是 x）。今天，Linux 由全球无数人士共同创建和维护。


    工作框架的内核是它的核心。它对于你的 PC 设备与你（客户端）之间的通信至关重要。一个工作框架是各种编程部分的集合：内核、不同的设备以及运行时的库。它是一个扩展了你
    PC 基础工作配置（即 BIOS）的产品。


    ## 1.1 从 UNIX 到 Linux


    Linux 的历史背景可以追溯到 20 世纪 90 年代。要理解 Linux 背后的故事，我们还需要短暂地回溯到第二次世界大战后的初期。那时，计算机占据了整个建筑，从机械部件到电子部件（类似于微芯片和集成电路的使用）的转变正在进行中。此外，在
    20 世纪 60 年代和 70 年代，硬件和编程部件非常昂贵且不规范。存在不同的供应商专有平台，每种平台都有自己的接口、传输和交换信息的协议，就像工作框架一样。这些单处理设备之间的通信需要特定的信息和对其协议的理解。UNIX
    的出现是为了绕过这些障碍，并在更大规模上利用处理设备。


    ### UNIX


    1965 年初，通用电气（GE）和贝尔实验室/AT&T 之间开发了多路信息和计算服务合作项目。在设计者肯·汤森（Ken Thompson）和迪尼斯·里奇（Dennis
    Ritchie）的推动下，他们创建的主要项目是 Unics。后来它被更名为 `UNIX`。UNIX 工作框架最初在加州大学伯尔克利分校使用。（`Multics`
    开始。Multics 是麻省理工学院（MIT）的产物。


    ### UNIX 变体


    UNIX 的理念授权给了少数机构，它们创建并维护了自己的 UNIX 变体。这包括 `Solaris/SUN OS`（现由 Oracle 拥有的 SUN Microsystems）、`AIX`（IBM）、Scenix（西门子）、`SCO
    UNIX`、`Xenix`（微软），以及 `HP-UX`（惠普）、`NeXTSTEP`、`Mac OS`（苹果）和 `Android`（谷歌）。


    开源实现包含了伯克利系统发行（`BSD`）及其变体：`NetBSD`、`OpenBSD` 和 `FreeBSD`。今天，Linux 是开源工程师中最著名的免费编程系统。上述框架也有稳固的商业支持。


    ### UNIX 哲学


    UNIX 的设计考虑了几个严格的标准。这些标准涵盖了可移动性、多任务处理以及结合时间共享策略的多客户端方向。此外，它还依赖于遵循 `TCP/IP` 方案的网络可用性。


    首次开发是用 `C` 语言完成的，这实现了与硬件阶段的解耦。通过一套开发工具和库，它允许你轻松地扩展以满足你的特定需求。然而它虽然简单，但具有自动化任务的惊人能力，支持复杂且可行的脚本。


    类似于工具箱，UNIX 由各种工具组成。每种工具都有特定的用途，并为该任务精确设计。核心思想是任务化。为了实现更多目标，将几个工具组合成一条链。下面的模型使用管道连接
    `ls` 和 `wc` 两个命令，以便统计当前目录中 Python 文件的数量。


    ```bash

    $ ls *.py | wc -l

    ```


    我们将在指南的后部分详细解释这些命令及其用途。


    ## 1.2 Linux 简史


    与 UNIX 类似，Linux 工作框架有多个根源，取决于许多重要力量。其中包括理查德·M·斯塔曼、安德鲁·S·塔纳鲍姆和林纳斯·托瓦尔斯。


    Richard M. Stallman 是 MIT 的程序员和工程师，自由软件基金会（FSF）的主要领袖，`GNU` 项目之父。GNU 的意思是“GNU 不是
    UNIX”。该项目的目标是开发一个自由的 UNIX 工作框架。直到 20 世纪 90 年代初，各种工具可用，但一直缺少内核。整个程序在 1983 年左右根据
    `GNU Public License`（`GPL`）发布。


    Linux 的下一个阶段来自 Andrew S. Tanenbaum。当时他是阿姆斯特大学的教授。为了他的学生，他创建了教学框架 `Minix`。正如他所说的，`Minix`
    并非设计用于实际生产。


    赫尔辛基大学的芬兰学生 Linus Torvalds 曾是 `Minix` 的用户，并对其限制非常不满。1990 年，他开始开发另一个依赖 `Minix`
    思想、UNIX 标准和 `POSIX` 标准的工作框架。他的灵感是拥有一个既合理又能扩展到硬件极限的自己的框架。他也只是想度过一些美好的时光，首要考虑并不是出于商业目的。Linux
    背后的整个故事在他的自传书籍《趣味编程》（*Just for Fun*）中有描述。今天，林纳斯·托瓦尔斯负责监督 Linux 内核的开发。


    为了让 Linux 对世界其他地方感兴趣，它需要一个好的标志。在一个吉祥物比赛中，提交了大量的提案。Larry Ewing 了一个企鹅的提案（如书封面所示），结果他的提案赢了。这只名为
    `Tux` 的企鹅有着俏皮的微笑和圆润的身体，呈现了一个快乐满意的形象。


    ## 1.3 Linux 应用范围


    Linux 最初是为 Intel 设备设计的，但现在运行在许多架构上。除此之外，这包含了 ARM 设计（命名为 `arm` 和 `arm64`）、摩托罗拉/Freescale
    的 68k 工程（`m68k`）、Intel x86（`i386` 和 `amd64`）、IBM s390（`s390`）、`powerpc`）以及 SPARC（`sparc`）。


    Linux 从一开始就专注于服务器框架。它被广泛用于 Web 服务器、文件服务器、邮件和新闻服务器、网关、远程交换和防火墙。作为计算单元，它帮助制作了《泰坦尼克号》、《史瑞克》和《玩具总动员》等电影。此外，Linux
    还应用于汽车、航空、军事、协调等。2006 年左右，Linux 服务器运行着世界上所有的交易所。它还运行在几乎所有的搜索引擎上。


    在过去的十年里，Linux 还攻占了桌面。由于其高灵活性安全性，它作为可靠的方案用于消息处理、计算机视觉、桌面计算、会计计算、通信（电子邮件、语音、视频）以及手机和电视的界面。


    ## 1.4 Linux 认证


    Linux 的广泛应用增加了对明确自己所做工作的设计师和客户的兴趣。现在，Linux 认证变得很有价值。这些认证可以分为通用型（不针对特定发行版）和专注于（针对特定
    Linux 发行版）。下面的列表列出了目前存在的认证。


    ### 非通用型认证'
