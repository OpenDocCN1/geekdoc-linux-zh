    `df -h`: 以人类可读的格式列出![](img/image_rsrc2GE.jpg)

    `df -k`: 以 KB 为单位列出![](img/image_rsrc2GF.jpg)

    `df -m`: 以 MB 为单位列出![](img/image_rsrc2GG.jpg)

    `df`: 以默认的块大小列出。有时这会使用 500KB，可能会引起混淆。


    ![](img/image_rsrc2GH.jpg)同样，`du`（磁盘 usage）计算目录占用的磁盘空间。常规输出会列出每个条目的值，可能会让人感到困惑。要获取目录的摘要，可以在命令行调用中增加三个参数：`-s`（摘要）、`-c`（总计）和
    `-h`（人类可读）。


    ## 12.4 挂载文件系统

    在使用文件系统之前，必须将其挂载为目录树的一部分。大多数情况下，这在启动时自动完成，但也可以手动完成。我们在上一章的末尾简要查看了用于手动挂载的命令，但在这里我们将更详细地介绍它们的用法。


    为了演示，我们将第二个 SCSI 磁盘的第一个分区（`/dev/sdb1`）挂载到 `/space`。首先，为了挂载文件系统，你必须是 root 用户。接下来，如果目录
    `/space` 尚不存在，我们必须使用 `mkdir` 创建它，如下：


    ```bash

    mkdir /space

    ```


    然后运行 `mount` 命令包含此目录：


    ```bash

    mount /dev/sdb1 /space

    ```

    大多数情况下，Linux 会自动检测文件系统类型。如果不是如此且没有自动检测类型，请使用 `-t` 参数（`type` 的缩写）后跟文件系统类型名称强制指定。此步骤假设相关的文件系统类型已安装并被
    Linux 内核识别。要列出 Linux 内核支持的所有文件系统，可以使用如下所示 `cat`、`awk`、`sed`、`ls` 和 `sort` 命令的组合。


    在尚未讨论的命令中，`sort` 用于按指定顺序排序文件，将在第 7 章中详细讨论。除了这个示例外，我们不会对 `awk` 和 `sed` 进行细节，因为这超出了本指南的范围。在这个示例中，它们基本上被用于清理数据以便更易使用。


    ```bash

    cat /proc/filesystems | awk ''{print $NF}'' | sed ''/^$/d''; ls -1 /lib/modules/$(uname
    -r)/kernel/fs | sort -u

    ```


    9p

    adfs

    affs

    afs

    aufsautofs

    autofs4

    bdev

    befs

    bfs

    binfmt_misc

    binfmt_misc.ko

    btrfs

    cachefiles

    ceph

    ...

    以下命令扩展了上述命令，以便使用 `ext3` 文件系统将第二个 SCSI 磁盘的第一个分区（`/dev/sdb1`）挂载到 `/space`：


    ```bash

    mount -t ext3 /dev/sdb1 /space

    ```


    ## 12.5 卸载文件系统

    如果文件系统正忙或在使用中，则无法卸载。要找出哪些程序正在使用该文件系统，来自 `lsof` 软件包的 `lsof` 命令派上了用场。`lsof` 是 list
    of open files（打开文件列表）的缩写。下面的示例演示了如何使用该命令，并展示了目录 `/home/user/Music`的情况![](img/image_rsrc2GJ.jpg)

    这将提供使用该目录的程序列表。此外，如果用户在该目录下工作，你必须使用 `cd` 命令切换目录。要卸载我们在上一节中挂载的目录 `/space`，你必须再次以
    root 用户登录。接下来，通过命令 `lsof /space` 测试是否有其他程序正在使用 `/space`。如果有程序正在运行，停止它们并重试。同时，确保没有终端连接到
    `/space`。


    ```bash

    su

    Password:

    # lsof /space

    ...

    ```


    然后输入 `umount /space`。如果你没有收到错误消息，说明 `/space` 已成功卸载。或者，运行带有 `-v` 参数（`verbose` 的缩写）的
    `umount` 命令来查看事务消息。最后，输入 `df -k` 查看新的分区状态。


    ```bash

    umount /space

    # exit

    ```


    ## 12.6 自动化挂载点

    要在系统启动时自动挂载挂载点，请在配置文件 `/etc/fstab` 中添加条目。`fstab` 是 file system table（文件系统表）的缩写。下面的示例显示了配置文件的内容：


    ```bash

    # cat /etc/fstab


    # /etc/fstab:静态文件系统信息。

    #

    # 使用 ''blkid'' 打印设备的唯一标识符；

    # 这可以配合 UUID= 使用更稳健的方法来命名设备

    # 即使在磁盘被添加或删除时也能工作。请参见

    # fstab(5)。

    #

    # <file system><mount point><type><options><dump><pass>

    # / 在安装期间位于 /dev/sda1

    UUID=dc78e6f6-8a4f-4be0-9192-e4ca37838765 / ext4 errors= 0 1defaults 0 2

    # /home 在安装期间位于 /dev/sda7

    UUID=ac2823cc-a7b4-4bf3-808e-e13401e11eaf /home ext4

    # /tmp 在安装期间位于 /dev/sda5

    UUID=faef6770-b865-43d2-b1f6-56352413d7c4 /tmp ext4 defaults 0 2

    # /var 在安装期间位于 /dev/sda6

    UUID=d2f4fd43-4f76-414c-9afa-6a53d4cd1d9c /var ext4 defaults 0 2

    # swap 在安装期间位于 /dev/sda2

    UUID=9ef7106a-c885-4cbe-aaa1-8e2b77ee73cf none swap sw 0 0

    /dev/sr0/media/cdrom0 udf,iso9660 user,noauto 0 0

    ```


    文件 `/etc/fstab` 中的列列（字段）为：


    ![](img/image_rsrc2GK.jpg)

    `filesystem` - 指定 UUID (`UUID=xxxxx`)、名称 (`/dev/sdb1`) 或文件系统的标签 (`LABEL=home`)。![](img/image_rsrc2GM.jpg)

    `mount point` - 定义文件系统挂载的目录。![](img/image_rsrc2GN.jpg)

    `type` - 允许的文件系统类型的逗号分隔列表。![](img/image_rsrc2GP.jpg)

    `options` - 选项的逗号分隔列表。![](img/image_rsrc2GR.jpg)

    `dump` - 文件中的备份信息，0 = 关闭，1 = 开启![](img/image_rsrc2GS.jpg)

    `pass` - 文件系统检查的顺序，从 1 开始。0 表示最后。请注意单列之间用制表符分隔，空格无法正常工作。提示：要查找挂载点的 UUID，请查看 `/dev/disk/by-uuid`。


    要添加一个自动挂载的设备，只需通过添加行来扩展 `/etc/fstab` 文件。为了在启动时使用 `ext3` 文件系统将分区 `/dev/sdb1` 挂载为
    `/space`，在旧版系统上添加此行：


    ```text

    /dev/sdb1 /space ext3 defaults 0 0

    ```


    在支持 UUID 的现代系统上，使用以下行。注意将 `7ca005b2-a7ff-4757-bfdf-81004d4072ef` 的值替换为你分区的 UUID：

    ```text

    UUID=7ca005b2-a7ff-4757-bfdf-81004d4072ef /space ext3 defaults 0 0

    ```

    现在 `/dev/sdb1` 将在启动时始终挂载为 `/space`。你可能奇怪使用 UUID 有什么好处。通过使用 UUID，分区被清晰地识别，即使磁盘顺序发生变化。要生成
    UUID（或重新生成一个新的），请使用 `uuidgen` 命令行工具。


    ## 12.7 设置新分区

    `fdisk` 及其对应工具 `cfdisk` 和 `gparted` 的理念是查看磁盘上的分区并添加、删除或编辑分区。在本节中，我们将查看 `fdisk`，它是
    Debian 的标准软件包，在所有主流 Linux 发行版中均可用。`cfdisk` 和 `gparted` 都是非标准软件包，可能需要单独安装。我们在第
    4 章和第 14 章中讨论了额外软件包的安装。


    要使用 `fdisk`，root 用户输入 `fdisk` 后跟驱动器名称。接下来的示例展示了名为 `/dev/sda` 的第一个 SCSI 磁盘。


    ```bash

    fdisk /dev/sda

    ```

