- fmt: "\nTo be on the safe side when deleting files and directories, use the option\
    \ `-i` (for `--interactive`) in combination with `-v` (for `--verbose`). Before\
    \ deleting a file `rm` will then request your explicit confirmation, and prints\
    \ a status message. \n\n### Changing Directories\n\nThe `cd` (change directory)\
    \ command allows you to move through the system. To move one level upwards towards\
    \ the root directory, use this command:\n\n```\ncd ..\n```\n\nTo move downwards\
    \ into a subdirectory, enter the `cd` command followed by the directory name.\
    \ The command `cd /home/user/test` will take you straight into the `/home/user/test`\
    \ directory. As already explained earlier, there are some shortcuts available.\
    \ The commands `cd ~` (tilde) and `cd $HOME` will always take you to your home\
    \ directory whereas `cd /` will take you to the `/` directory.\n\n**Tip:** Because\
    \ Linux is case-sensitive, `cd` is not the same as `CD`. Be careful when using\
    \ upper- and lower-case characters.\n\n### Renaming Directories\n\nThe `mv` command\
    \ abbreviates the word move, and moves and renames files and directories. It requires\
    \ two names: the name of the original file and its new name. To change the name\
    \ of a directory from `lpic1` to `lpic-1` type in the following:\n\n```\nmv lpic1\
    \ lpic-1\n```\n\nThe original file is removed and the new entry receives the current\
    \ timestamp. Use the option `-i` (or `--interactive`) to prevent overwriting existing\
    \ files.\n\n### 5.3 Terminal-based File Managers\n\nNavigating Linux on the command\
    \ line is not the most ideal situation. Terminal-based and graphical file managers\
    \ are a great alternative. Terminal-based file managers run inside a terminal\
    \ and do not open a separate window on your desktop. There are tons of programs\
    \ available, that’s why we only present you with a selection of our favorites.\n\
    \n#### GNU Midnight Commander (mc)\nwww.midnight-commander.org\nThis is a free\
    \ software, full-screen, text mode, visual file manager that lets you search,\
    \ copy, move and also delete both single and multiple files, and even a whole\
    \ directory tree. The `mc` integrates a viewer and editor.\n![](image_rsrc2BM.jpg)\n\
    \n#### The Vi File Manager (vifm)\nhttps://vifm.info\nSimilar to `mc`, the Vi\
    \ File Manager (`vifm`) comes with two navigation windows based on a curses interface.\
    \ It provides a Vi(m)-like environment for managing files and directories. If\
    \ you are familiar with the Vi key bindings, this is the file manager for you.\n\
    ![](image_rsrc2BN.jpg)\n\n### 5.4 Graphical File Managers\n\nSimilar to terminal-based\
    \ file managers, graphical file managers assist in navigating Linux. These file\
    \ managers do open in separate windows but provide a much nicer user experience.\
    \ Again, there are tons of programs available, so we only list our favorites below.\n\
    \n#### Konqueror\nhttps://packages.debian.org/stretch/konqueror\nKonqueror is\
    \ a powerful file manager for the KDE desktop environment. Konqueror offers simple\
    \ file management functionalities such as copying, moving, searching, and deleting\
    \ files and directories, plus some advanced features and functionalities such\
    \ as access to archives, browse and rip audio CDs, and support for access to FTP\
    \ and SFTP servers and SAMBA (Windows) shares.\n\n#### Nautilus\nhttps://wiki.gnome.org/Apps/Nautilus\n\
    Nautilus is the file manager on the GNOME desktop. It offers easy navigation and\
    \ management of files on a Linux system. This includes simple file management\
    \ functionalities such as copying, moving, searching, and deleting files and directories,\
    \ as well as easy access to local and remote files.\n\n#### Dolphin\nwww.kde.org/applications/system/dolphin/\n\
    Dolphin is a lightweight file manager developed as part of the KDE applications\
    \ package. Designed for simplicity, flexibility, and full customization, it allows\
    \ users to browse, locate, open, copy, and move files around a Linux system with\
    \ a lot of ease.\n\n#### Thunar\nhttps://docs.xfce.org/xfce/thunar/start\nThunar\
    \ is a modern, lightweight file manager for the XFCE desktop. It is designed to\
    \ be fast, responsive, and easy to use. We list it here because it has a clean\
    \ and intuitive interface with important user options available.\n\n# 6. Introduction\
    \ to Terminals and Shells\n\nWorking with the Linux operating system requires\
    \ you to know about the terminal and the command line. It is essential to know\
    \ what these are and to be slightly familiar with their usage and the standard\
    \ commands available. But don’t fear, we will describe each in detail. These terms\
    \ sound much more intimidating than they are in reality.\n\nThe ability to communicate\
    \ with the system in a text-based format is one reason why programmers have a\
    \ soft spot for Linux, as this is the normal way for programmers to give instructions\
    \ to computers. Another reason is the absolute control this allows over the system\
    \ that other operating systems just cannot provide, even with their own command\
    \ line interpreters.\n\nSome beginners have even reported that using and becoming\
    \ familiar with issuing commands in this text-based format has made the transition\
    \ to program development much easier and quicker.\n\n## 6.1 What is a Terminal?\n\
    \nA terminal is described as “a program that emulates a video terminal within\
    \ some other display architecture. Though typically synonymous with a shell or\
    \ text terminal, the term terminal covers all remote terminals, including graphical\
    \ interfaces. A terminal emulator inside a graphical user interface is often called\
    \ a terminal window”.\n\nTo be precise, a terminal is simply the outer software.\
    \ Inside a terminal runs a command line interpreter that is called a `shell`.\
    \ The terminal is your way of interacting with the `shell` via a GUI.\n\nDebian\
    \ supports a long list of terminal software. This includes the `Aterm`, as well\
    \ as the `GNOME terminal`, the `Kterm`, the `Mate Terminal`, the `Rxvt`, the `Xterm`,\
    \ and the `Xvt`. These different implementations of terminal software vary in\
    \ terms of stability, support for character sets, design, colors and fonts, as\
    \ well as the possibility to apply background images or work with transparency\n\
    \nIn this book, we will use the `GNOME terminal` because of its stability, simplicity,\
    \ and adjustability. To increase and decrease the size of the content that is\
    \ displayed inside the terminal window, use the two-key combinations `CTRL+` and\
    \ `CTRL-`.\n\n## 6.2 What is a Shell?\n\nSimply speaking, a `shell` is a sophisticated\
    \ command-line interpreter. The `shell` reads your commands, modifies them under\
    \ certain conditions, and then executes the result.\n\nBetween reading from the\
    \ command-line and the execution of the actual result, the `shell` has to interpret\
    \ special characters that are part of your input. The table below displays the\
    \ available special characters:\n\n| Character | Meaning |\n| :--- | :--- |\n\
    | `$name` | Substitution of a variable |\n| `name=` | Assignment of a variable\
    \ |\n| `'command'` | Quoting |\n| `$( command )` | Substitution of a command |\n\
    | `< > >>` | Redirection of input and output |\n| `2> 2>>` | Redirection of input\
    \ and output |\n| `\\|` | Pipelining of commands |\n| `* [ ] ?` | Creation of\
    \ file names (globbing) |\n| `;` | Separation of commands |\n| `&` | Run the command\
    \ in the background |\n| `\\|\\| &&` | Run the commands under certain conditions\
    \ |\n| `{ } ( )` | Group commands |\n\nPurely for interest, the shellid divides\
    \ the command-line into single words to determine the commands, through the following\
    \ process:\n\n| Step | Description | Special Characters |\n| :--- | :--- | :---\
    \ |\n| 1 | Read until the command separator | `\\n`, `&`, `\\|`, `\\|\\|`, `&&`,\
    \ `;`, `$(...)`, `\\\"...\"`, `'...'` and tagging (substitution of commands) |\n\
    | 2 | Tagging (input-/output redirection, assignment of values) | `$name`, see\
    \ step 1 and 2 tagging |\n| 3 | Division into single words | `$name`, see step\
    \ 1 and 2 tagging |\n| 4 | Substitution of variables | `$name`, see step 1 and\
    \ 2 tagging |\n| 5 | Substitution of commands | `$name`, see step 1 and 2 tagging\
    \ based on IFS |\n| 6 | Input-/output redirection | `<`, `>`, `>>`, `2>`, `2>>`\
    \ |\n| 7 | Assignment of variables | `name=` |\n| 8 | Division into words | |\n\
    | 9 | Creation of file names | |\n| 10 | Command execution | |\n"
