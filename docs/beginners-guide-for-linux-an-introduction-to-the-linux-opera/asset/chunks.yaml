    ## 11.1 Types of Commonly Used Filesystems


    A number of filesystems are quite popular and widely used. This includes `FAT`,
    `ext2`, `ext3`, `ext4`, `JFS`, `XFS`, `ZFS`, `ReiserFS`, and `SWAP`. Let’s look
    at each of these in more detail.


    ### File Allocation Table (FAT)

    FAT was introduced in 1977 for floppy disks and then used for hard disks through
    the DOS and Microsoft Windows 9X era. It is supported by nearly all operating
    systems to date and is useful as a data transfer medium between different systems.
    It is commonly used on external media such as USB drives. The original `FAT` system
    was only an 8-bit system with a maximum file size of 8MB, supporting 6:3 filenames
    and no subdirectories. There are 3 main variants of `FAT`:


    - `FAT12` - 12-bit File Allocation Table. Supports maximum volume sizes of 16MB
    with 4KB clusters or 32MB with 8KB clusters.

    - `FAT16` - 16-bit File Allocation Table. Supports maximum volume sizes of 2GB
    with 32KB clusters or 4GB with 64KB clusters. Filenames must be in the 8:3 format
    with OEM characters or 256 UCS characters.

    - `FAT32` - Supports a maximum file size of 2TB with 512B sectors, 8TB with 2KB
    sectors and 32K clusters, or 16TB with 4KB sectors and 64K clusters. Filenames
    must be in the 8:3 format with OEM characters or 256 UCS characters.


    ### Second Extended File System (ext2)

    This was the first consumer-grade filesystem for Linux and was the default filesystem
    for Linux distributions such as RedHat and Debian until `ext3` became mainstream
    in 2001. Today, it is still in use on storage devices like digital memory cards,
    where the journaling functionality of `ext3` or `ext4` is not needed. This increases
    performance and minimizes the number of writes.


    ### Third Extended File System (ext3)

    `ext3` is a journaled version of `ext2` and can be upgraded directly from `ext2`
    without the need for backup and restore operations. `ext3` is not as fast as `ext4`,
    `JFS`, `XFS`, or `ReiserFS` but it uses less CPU power than `ReiserFS` or `XFS`.
    `ext3` supports files up to 16GB and filesystems up to 32TiB in size.


    ### Fourth Extended File System (ext4)

    `ext4` is an extension of `ext3` with extra features such as large filesystem
    support. It supports files up to 16TiB and filesystems up to 1EiB in size. Furthermore,
    it features extents. An extent is a contiguous range of blocks which makes handling
    very large files more efficient.


    ### Journaled File System (JFS)

    `JFS` was originally developed for IBM ’s AIX Unix operating system and later
    ported to OS/2. `JFS` is a fully 64bit filesystem that uses extents, supports
    unlimited small files, and large files up to 4 PB. It is ideal for extremely large
    filesystems.


    ### XFS

    `XFS` is a journaling filesystem developed by Silicon Graphics (SGI) in 1993 for
    the IRIX operating system. It subdivides physical volumes into allocations allowing
    more efficient parallel I/O and filesystem bandwidth, and supports large files
    up to 8EiB.


    ### ZFS

    The Zettabyte File System (`ZFS`) combines a filesystem and a logical volume manager
    (`LVM`). Released by SUN Microsystems in 2005, it is scalable and includes extensive
    protection against data corruption, support for high storage capacities, efficient
    data compression, integration of filesystem and volume management, snapshots and
    copy-on-write clones, continuous integrity checking and automatic repair, RAID-Z,
    and native Access Control Lists (`ACLs`) for the Network File System (`NFS`) version
    4. The two projects `OpenZFS` and `ZFS on Linux` continue the development of this
    filesystem.


    ### ReiserFS

    `ReiserFS` is a general-purpose journaled filesystem that uses the Apple Partition
    Map based on B+Trees for managing directory contents. `ReiserFS` version 3 was
    the default filesystem used in SUSE, Elive, Xandros, Linspire, and YOPER distributions.
    Support for `ReiserFS` version 4 has declined to the point where development has
    halted, other than being made compatible with newer Linux kernels.


    ### Swap Space

    Swap space is used by Linux to swap out pages of memory when they are not in use.
    Swap space is not accessible to the user and cannot be used for normal file storage.
    The space used by swap space is as follows:


    - **Desktop systems** - Use 2x the total amount of memory on the system. That
    way if many large programs are running concurrently, the unused memory can be
    saved to disk and programs run more efficiently.

    - **Server systems** - Use 0.5x the total amount of memory. Servers should not
    be doing a lot of swapping, so half the total memory is enough.

    - **Old systems with memory less than 1GB** - Use as much swap space as possible,
    as the system will need to do a lot of swapping to run efficiently.


    Instead of a separate swap partition, it is also possible to use a swap file.
    This is created using `dd` to create a fixed size file on an existing partition.
    This has the advantages of not requiring a fixed swap partition and it can be
    resized later for efficiency.


    ## 11.2 Filesystem Commands


    The following commands are used to manage filesystems:


    - `fdisk` and `cfdisk` - show, create, and delete partitions with filesystems
    on a drive.

    - `mkfs` - abbreviation for make file system and creates a filesystem.

    - `mkswap` - abbreviation for make swap and creates a swap filesystem.

    - `badblocks` - shows bad blocks on a filesystem.

    - `fsck` - abbreviation for file system check and examines and repairs a Linux
    filesystem.

    - `dumpe2fs` - shows information about a filesystem.

    - `file` - determines the type of entry in the filesystem.

    - `link` and `unlink` - creates and deletes links to a file.

    - `ln` - abbreviation for link and creates hard links and soft links.

    - `ls` - displays information about an entry (file, directory, link, socket, or
    fifo).

    - `lsof` - shows the list of opened files.

    - `stat` - shows all the information that is kept for an entry.

    - `sync` - syncing the drive cache with the disk.

    - `mount` and `umount` - enabling or disabling a device with a filesystem.

    - `tune2fs` - adjusts filesystem parameters on `ext2`, `ext3`, and `ext4` filesystems.


    ## 11.3 Practical Example


    In the following example, we will look at how to use the commands we discussed
    above. We will emulate a memory disk, create a proper filesystem on it, mount
    it, and store data on it. To start, we will create a file with a size of 10MB
    using `dd` as follows:


    ```bash

    $ dd if=/dev/zero of=memory.image bs=512b count=40

    ```


    The file consists of zeroes only, as the data is read from a device named `/dev/zero`
    that returns zeroes only (`if=/dev/zero`). The output is written to the file `memory.image`
    with a block size of 512 bytes forty times. The example below shows the output
    of `dd` and the size of the output file using `ls`.


    ```bash

    $ dd if=/dev/zero of=memory.image bs=512b count=40

    40+0 records in

    40+0 records out

    10485760 bytes (10 MB, 10MiB) copied, 0.0156379 s, 671 MB/s


    $ ls -lah memory.image

    -rw-r--r-- 1 user user 10M Sep 9 05:28 memory.image

    ```


    For the next step, we create an `ext4` filesystem on the file using the command
    `mkfs.ext4`:


    ```bash

    $ /sbin/mkfs.ext4 memory.image 10M

    mke2fs 1.43.4 (31-Jan-2017)

    Discarding device blocks: done

    Creating filesystem with 10240 1k blocks and 2560 inodes

    Filesystem UUID: 52c89176-a665-48b3-9bf6-2abb9b2ad721

    Superblock backups stored on blocks:8193

    Allocating group tables: done

    Writing inode tables: done

    Creating journal (1024 blocks): done

    Writing superblocks and filesystem accounting information: done

    ```

