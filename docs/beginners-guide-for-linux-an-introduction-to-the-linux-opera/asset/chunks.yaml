    # 19. Getting Help

    Linux is a rather complex operating system, especially for beginners. When you
    get started, the list of programs can be quite confusing. Each program has a longer
    list of parameters or options than the last. And they are not easy to memorize,
    they have long and short names, and are not standardized. Asking for help when
    you get stuck is not a mistake or sign of defeat.


    To get help on your Linux system, there are several ways to go about it. This
    includes the manual pages (called `man pages`), information pages (called `info
    pages`), as well as the integrated help of each command. In this chapter we will
    have a closer look at these help systems and get familiar with the commands `man`,
    `info`, `whereis`, and `whatis`.


    ## 19.1 Man Pages

    Man pages are the traditional way of distributing documentation about programs.
    The term `man page` is short for `manual page`, as they correspond to the pages
    of the printed manual. Man pages are part of the basic installation of your Linux
    system. The corresponding Debian package is named `manpages`.


    A man page corresponds to a specific section in the full UNIX manual: 1 for commands,
    2 for system calls, etc. To get information regarding a specific command, open
    the corresponding man page in a terminal window. As an example, for the `cp` command
    it is done as follows:


    ```bash

    $ man cp

    ```


    The resulting man page looks like this:![](image_rsrc2JH.jpg) The key bindings
    are similar to the ones from the text editor `vi(m)`. Use the navigation keys
    to scroll up and down, and `q` to exit the man page and to return to the terminal.


    ## 19.2 Info Pages

    `Info` is the default format for documentation inside the GNU project. In the
    early 1990s, the GNU project decided that the man page system was outdated and
    wrote the `info` command to replace it. `info` has basic hyperlinking features
    and a simpler markup language to use (compared to the `troff` system used for
    man pages). Nowadays both systems exist in parallel.


    The basic installation of Debian does not contain the `info` pages. In order to
    use it, post-install the package named `info` (refer to Chapter 4 and Chapter
    14 on how to install additional packages). To get information regarding a specific
    command, open the corresponding info page in a terminal window. As an example,
    for the `cp` command it is done as follows:


    ```bash

    $ info cp

    ```


    The resulting info page looks like this:![](image_rsrc2JJ.jpg)


    ## 19.3 Integrated Help

    Aside from `man` and `info`, many commands have an option `-h` (short for `-help`).
    Calling the command with this option opens a specific help section. The example
    below shows the built-in help of the `uname` command.![](image_rsrc2JK.jpg)


    Alternatively, the `whatis` command is helpful to get brief information about
    Linux commands or functions. It displays a single-line man page description for
    the command that matches the string passed as a command line argument to the `whatis`
    command. `whatis` searches for the string in its index database, which is maintained
    by the `mandb` program, and picks a short description from the `NAME` section
    of the man page for that command. The example below shows this for the two commands
    `mv` and `man`:


    ```bash

    $ whatis mv

    mv (1) - move (rename) files


    $ whatis man

    man (1) - an interface to the on-line reference manuals

    man (7) - macros to format man pages

    ```


    Another option is the `whereis` command, which is helpful to locate the manual
    page of the command in the Linux system. It is a very simple utility. The example
    below shows this for the two commands `mv` and `man`:


    ```bash

    $ whereis mv

    mv: /bin/mv /usr/share/man/man1/mv.1.gz


    $ whereis man

    man: /usr/bin/man /usr/local/man /usr/share/man /usr/share/man/man1/man.1.gz /usr/share/man/ma

    ```


    Every command also provides additional information and configuration examples.
    This is kept in the directory `/usr/share/doc`, and every program has its own
    subdirectory. The content is standardized and differs from program to program.
    The content is also accessible for every user. A snippet of the directory is shown
    below.![](image_rsrc2JM.jpg)


    ## 19.4 External Help

    If the help already provided with the software tools is not enough, and further
    explanation is necessary, external resources come into play. There are a few online
    communities that can be consulted such as:![](image_rsrc2JN.jpg)


    - LinuxHint: `https://support.linuxhint.com`![](image_rsrc2JP.jpg)

    - LinuxHelp: `https://www.linuxhelp.com`


    Another option is Linux User Groups (LUG). A LUG is a group of people from the
    same geographical location sharing their common interest in the Linux operating
    system. They are organized as a loosely associated number of people or an association
    that meets regularly. A full list of LUGs worldwide is available from `LugsList`
    at `http://lugslist.com`![](image_rsrc2JR.jpg) Many LUGs organize meet-ups and
    experiences, and to learn from each international events. This includes local
    and other events to share ideas, exchange.![](image_rsrc2JS.jpg)

    '
