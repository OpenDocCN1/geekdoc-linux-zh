    # 要显示账户详情，请调用 `chage` 命令并后跟选项 `-l`（`--list` 的缩写）以及用户名。下面的示例列出了用户 `user` 的详细信息。


    ```

    chage -l user

    password change : Aug 20, 2020

    Password expires : never

    Password inactive : never

    Account expires : never

    Minimum number of days between password change : 0 Maximum number of days between
    password change : 99999 Number of days of warning before password expires : 7

