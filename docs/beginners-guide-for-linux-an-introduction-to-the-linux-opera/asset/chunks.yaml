    # 软件包管理工具


    为了维护安装在你的 Linux 系统上的软件包选择，有多种工具可用：


    ![](img/image_rsrc2H1.jpg)`dpkg` - 用于管理单个软件包。


    ![](img/image_rsrc2H2.jpg)`apt`, `aptitude`, `synaptic` - 用于管理带有依赖关系的软件包。


    ![](img/image_rsrc2H3.jpg)`tasksel` - 用于管理整个软件集合（任务）。


    下面的图片描述了这些工具运行的不同级别以及它们如何协同工作。两个虚线轮廓的框指的是处理软件包管理任务的共享库。![](img/image_rsrc2H4.jpg)在较低级别，我们有
    `dpkg`。它的任务是安装单个 Debian 软件包或删除已安装的软件包的内容。为了查询软件包和文件，它使用了两个工具 `dpkg-deb` 和 `dpkg-query`。`dpkg`
    允许你维护软件包基础，但不处理软件包依赖关系。


    通常，上层由 `apt`、`aptitude` 和 `synaptic` 工具表示。这些工具的任务是通过将所有操作合并到一个应用程序中来简化软件包管理。这些工具使用共享库
    `libapt-inst` 或 `libapt-pkg`，或者直接与 `dpkg` 通信以执行软件包管理任务。这包括处理软件包依赖。


    ## 软件包缓存


    软件包缓存位于 `/var/cache/apt/archives`。每当你通过 `apt-get` 或 `aptitude` 安装软件包时，相应的软件包就会被检索并本地存储在此位置。为了说明，下面列表使用
    `ls` 列出了缓存的 deb 软件包。


    ```

    $ ls /var/cache/apt/archives/*.deb


    /var/cache/apt/archives/cpuid_20140123-2_amd64.deb


    /var/cache/apt/archives/libxml2-utils_2.9.1+dfsg1-5+deb8u7_amd64.deb


    /var/cache/apt/archives/python3-bitarray_0.8.1-1_amd64.deb


    /var/cache/apt/archives/python-bitarray_0.8.1-1_amd64.deb

    ```


    你安装的软件越多，缓存的 deb 软件包就越多。建议定期使用 `aptitude` 或 `apt-cache` 清理软件包缓存。


    ```

    # aptitude clean


    # apt-cache clean

    ```


    # 14.2 日常管理任务


    本节涉及作为 Linux 所有者和管理员日常生活中需要的基本软件包管理操作。


