  \ 10 Sep 5 07:14 ata-VBOX_HARDDISK…part3…/sda3\nlrwxrwxrwx 1 root root 10 Sep 5\
  \ 07:14 ataVBOX_HARDDISK…part5…/sda5\nlrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part6…/sda6\n\
  lrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part7…/sda7\n```\n\n## 创建新文件系统\n\
  \n到目前为止我们只有空分区。这些分区需要填充适当的文件系统。我们将按照以下方式挂载新文件系统：\n- `/dev/sdb1` `/mnt/root` `ext2`\n\
  - `/dev/sdb5` `swap`\n- `/dev/sdb6` `/mnt/home` `ext4`\n\n为了实现这一操作，首先我们创建所需的挂载点：\n\
  \n```bash\n# mkdir /mnt/root\n# mkdir /mnt/home\n```\n\n然后为了添加文件系统，我们执行以下命令：\n\n\
  ```bash\n# mkfs /dev/sdb1\nmke2fs 1.43.4 (31-Jan-2017)\nCreating filesystem with\
  \ 1048576 4k blocks and 262144 inodes\nFilesystem UUID: 8e70eeac-83cb-43f1-a402-a10fdecab950\n\
  Superblock backups stored on blocks:32768,98304,163840,229376,294912,819200,884736\n\
  Allocating group tables: done\nWriting inode tables: done\nWriting superblocks and\
  \ filesystem accounting information: done\n```\n\n```bash\n# mkfs.ext4 /dev/sdb6\n\
  mke2fs 1.43.4 (31-Jan-2017)\nCreating filesystem with 3931392 4k blocks and 983040\
  \ inodes\nFilesystem UUID: e7ab67d6-53a6-4c1a-9ee2-5f36d183bef5\nSuperblock backups\
  \ stored on blocks:32768,98304,163840,229376,294912,819200,884736,1605632,2654208\n\
  Allocating group tables: done\nWriting inode tables: done\nCreating journal (16384\
  \ blocks): done\nWriting superblocks and filesystem accounting information: done\n\
  ```\n\n接下来，我们必须将 `/dev/sdb5` 设置为交换分区。`mkswap` 创建交换文件系统，而 `swapon` 激活分区作为交换空间。\n\n\
  ```bash\n# mkswap /dev/sdb5\nSetting up swapspace version 1, size = 1024 MiB (1073737728\
  \ bytes)\nno label, UUID=a6e9f014-500b-4659-a45f-86d09238d11c\n\n# swapon /dev/sdb5\n\
  ```\n\n为每个分区赋予自己的标签（label）是一个好主意。为此，我们结合使用 `tune2fs` 和 `-L`（卷标签）选项。分区 `/dev/sdb1`\
  \ 与目录 `/root` 相关，而分区 `/dev/sdb6` 与目录 `/home` 相关。\n\n```bash\n# tune2fs -L root /dev/sdb1\n\
  # tune2fs -L home /dev/sdb6\n```\n\n现在我们可以使用使用 `mount` 命令挂载新分区了。输入 `df` 查看结果。\n\n\
  ![](img/image_rsrc2GT.jpg)\n\n作为最后一步，让我们向配置文件 `/etc/fstab` 添加条目，以便在启动时自动挂载这些文件系统。首先将\
  \ `/etc/fstab` 复制为 `/etc/fstab.bak`。\n\n```bash\n# cp /etc/fstab /etc/fstab.bak\n\
  ```\n\n然后为了获取新分区的块 ID，输入 `lsblk -f`。`-f` 选项（`--fs` 的缩写）会扩展额外的文件系统信息。\n\n![](img/image_rsrc2GU.jpg)\n\
  \n现在编辑配置文件 `/etc/fstab` 并按所示添加最后两行。\n\n```bash\n# cat fstab\n\n# /etc/fstab: 静态文件系统信息\n\
  #\n# 使用 'blkid' 打印设备的通用唯一标识符；\n# 这可以配合 UUID= 使用更健壮的设备命名方法，\n# 即使磁盘被添加或移除也能工作。参见\
  \ fstab(5)。\n#\n# <文件系统><挂载点><类型><选项><dump><pass>\n# / 在安装时位于 /dev/sda1 UUID=dc78e6f6-8a4f-4be0-9192-e4ca3783876\n\
  ```\n\n\n\n\n\n```bash\n$ stat test\n```\n\nFile: test\nSize: 0 Blocks: 0 IO Block:\
  \ 4096 regular empty file\nDevice: 808h/2056d Inode: 260930 Links: 4\nAccess: (0644/-rw-r--r--)\
  \ Uid: (1000/user) Gid: (1000/user)\nAccess: 2020-09-19 16:51:10.033912519 +0200\n\
  Modify: 2020-09-19 16:51:10.033912519 +0200\nChange: 2020-09-19 16:51:19.245900960\
  \ +0200\nBirth:\n\n```bash\n$ touch test\n```\n\n### 13.2 软链接\n\n软链接，也称为符号链接（symbolic\
  \ link），是文件系统中指向另一个文件名的链接。它非常类似于 Windows 系统中的快捷方式。与硬链接不同，符号链接不包含目标文件的数据，它只是指向文件系统某处的另一个节点。这种区别使得软链接具有硬链接不具备的特性，例如能够链接到目录、字符设备、块设备或通过\
  \ NFS 网络的远程计算机上的文件。\n\n要在 Linux 中创建软链接，我们将使用相同的 `ln` 命令，但加上 `-s` 选项。`-s` 是 `--symbolic`\
  \ 的缩写。\n\n```bash\n$ touch test\n$ ln -s test softlink1\n$ ln -s test softlink2\n\
  $ ln -s test soft link3\n```\n\n再次，`ls -i` 的输出显示了两列：索引节点（inode）和文件名。你会发现这四个文件的 inode\
  \ 号是不同的，且 `softlink1`、`softlink2`、`softlink3` 和 `test` 指向不同的 inode。\n\n```bash\n\
  $ ls -i test softlink*\n260931 softlink1\n260932 softlink2\n260933 softlink3\n```\n\
  \n如果你使用 `-l` 选项（长格式）调用 `ls` 命令，输出所示。最左侧的列以 `l` 开头表示链接，最右侧列显示软链接指向的文件名。\n\n```bash\n\
  $ ls -l softlink*\nlrwxrwxrwx 1 user user 4 Sep 15 14:05 softlink1 -> test\nlrwxrwxrwx\
  \ 1 user user 4 Sep 15 14:05 softlink2 -> test\nlrwxrwxrwx 1 user user 4 Sep 15\
  \ 14:05 softlink3 -> test\n```\n\n### 13.3 实际示例\n\n在这个示例中，我们将观察如何使用硬链接连接两个文件，以及如何再次取消链接。首先，我们使用\
  \ `echo` 并重定向输出创建一个名为 `file1` 的文件。`echo` 是一个内置 shell 命令，用于输出文本。该命令还会打印变量的值。\n\n\
  ```bash\n$ echo \"This is File One\" > file1\n$ cat file1\nThis is File One\n```\n\
  \n接下来，将 `file2` 链接到 `file1`，并将 `file2` 的内容输出到 `stdout`。\n\n```bash\n$ link file1\
  \ file2\n$ cat file2\nThis is File One\n```\n\n现在它们都是同一个文件。让我们对 `file2` 进行修改并看看会发生什么。\n\
  \n```bash\n$ echo \"This is line Two\" >> file2\n$ cat file1\nThis is File One\n\
  This is line Two\n```\n\n如示例所示，`file1` 和 `file2` 都被视为同一个文件。\n\n```bash\n$ ls -l\n\
  total 0\n$ echo \"This is File One\" > file1\n$ cat file1\nThis is File One\n$ link\
  \ file1 file2\n$ ls\nfile1 file2\n$ cat file2\nThis is File One\n$ echo \"This is\
  \ line Two\" >> file2\n$ cat file2\nThis is File One\nThis is line Two\n$ cat file1\n\
  This is File One\nThis is line Two\n```\n\n取消 `file1` 会删除指向 `file1` 的硬链接，但 `file2`\
  \ 仍在那里。\n\n```bash\n$ unlink file1\n$ ls\nfile2\n```\n\n取消 `file2` 会删除硬链接并删除文件，因为不再没有指向该文件的硬链接。\n\
  \n```bash\n$ unlink file2\n$ ls\n$ ls -al\ntotal 8\ndrwxr-xr-x 5 jk 4096 Sep 18\
  \ 22 .\ndrwxr-xr-x 3 jk 4096 Sep 18 15 ..\n```\n\n## 14. 软件包管理\n\n在当今的世界，软件非常复杂。这种复杂性源于程序被拆分为多个组件，如二进制数据、共享库和文档。这种软件开发的概念被称为模块化，被广泛接受和使用。例如，Debian\
  \ 提供了超过 50000 个不同的软件包。软件包管理涵盖了处理这些软件包的所有操作，包括安装、配置、删除和更新。它还涵盖了软件包依赖关系。\n\n### 14.1\
  \ 理解软件包架构\n\n为了解释 Linux 软件包架构，我们将使用 Debian 进行。Debian 发行版以其稳定的软件包系统闻名。以下描述适用于所有源自\
  \ Debian 的 Linux 发行版，如 Ubuntu、Linux Mint、Knoppix、Kali Linux 和 Xandros。注意，软件包的名称可能不同，发行版特定的镜像和软件包类别也是如此。\n\
  \nDebian 软件包生态系统包含许多不同的组件，如软件包列表、软件包源、软件包镜像、不同的软件包、用于软件包设置软件以及软件包缓存。这些组件将在下文中详细说明。\n\
  \n#### 软件包列表\nDebian 包含可用软件包列表。此列表在 `/etc/apt/sources` 文件中引用，以及 `/etc/apt/sources.list.d`\
  \ 目录下的特定组件。例如，Messenger 使用 `skype-stable.list` 文件。列表使用文本格式，每行一个软件包源：\n\n```text\n\
  deb http://ftp.debian.org/debian/ stretch main contrib non-free\ndeb-src http://ftp.debian.org/debian/\
  \ stretch main contrib non-free\n```\n\n每行指向二进制软件包类型 (`deb`) 或源软件包类型 (`deb-src`)。软件包类型后面是软件包源，它指向提供软件包的存储库。接下来，该行包含\
  \ Debian 版本的名称，可以指定为版本的别号或分支。\n\n别号源自电影《玩具总动员》中的角色。分支指的是版本的开发阶段，可以是 oldoldstable（上上版本）、oldstable（上一个版本）、stable（当前版本）、testing（下一个版本）、unstable（未来版本）或\
  \ experimental。在分支名称之后是软件包类别。\n\nDebian 9 Stretch 的安全更新条目如下：\n\n```text\ndeb http://security.debian.org/\
  \ stretch/updates main contrib non-free\nsrc http://security.debian.org/ stretch/updates\
  \ main contrib non-free\n```\n\n为了从引用的软件包源刷新软件包列表，调用以下命令：\n\n```bash\n# apt-get\
  \ update\n```\n\n```text\nGet:1 http://security.debian.org/debian-security stretch/updates\
  \ InRelease [94.3 kB]\nIgn:2 http://ftp.us.debian.org/debian stretch InRelease\n\
  Get:3 http://ftp.us.debian.org/debian stretch-updates InRelease [91.0 kB]\nGet:4\
  \ http://security.debian.org/debian-security stretch/updates/main Sources [179 kB]\n\
  Get:5 http://security.debian.org/debian-security stretch/updates/main amd64 Packages\
  \ [447 kB]\nHit:6 http://ftp.us.debian.org/debian stretch Release\nGet:8 http://ftp.us.debian.org/debian\
  \ stretch-updates/main Sources.diff/Index [5,164 B]\nGet:9 http://ftp.us.debian.org/debian\
  \ stretch-updates/main amd64 Packages.diff/Index [5,164 B]\nGet:10 http://ftp.us.debian.org/debian\
  \ stretch-updates/main Translation-en.diff/Index [3,688 B]\nGet:11 http://ftp.us.debian.org/debian\
  \ stretch-updates/main Sources 2018-07-31-2010.17.pdiff [385 B]\n```\n\n#### 软件包源\n\
  Debian 项目维护着名为软件包镜像的官方软件包源列表。该列表分为主软件包镜像和二级软件包镜像。主软件包镜像提供所有支持的架构，而二级软件包镜像仅提供子集。对于美国，官方的主软件包镜像是：ftp.us.debian.org。\n\
  \n你可以在以下地址查看所需软件包镜像的当前状态：\n\nhttps://mirror-master.debian.org/status/mirror-status.html\n\
  \n![](img/image_rsrc2GX.jpg)\n\n#### 软件包类型\nDebian 将其软件包分为三类：\n\n\n\n\n\n![](img/image_rsrc2GY.jpg)主\
  \ - 自由软件包。![](img/image_rsrc2GZ.jpg)贡献 - 依赖非免费软件包的自由软件包。![](img/image_rsrc2H0.jpg)非免费\
  \ - 不提供源代码的非免费软件包。非免费类别的软件包包括固件驱动程序、Skype 软件和 Flash 插件。软件包列表中的每一项都指定了它们的软件类别。\n\n\
  #### 软件包管理工具\n\n为了维护安装在你的 Linux 系统上的软件包选择，有多种工具可用：\n\n![](img/image_rsrc2H1.jpg)`dpkg`\
  \ - 用于管理单个软件包。\n\n![](img/image_rsrc2H2.jpg)`apt`, `aptitude`, `synaptic` - 用于管理带有依赖关系的软件包。\n\
  \n![](img/image_rsrc2H3.jpg)`tasksel` - 用于管理整个软件集合（任务）。\n\n下面的图片描述了这些工具运行的不同级别以及它们如何协同工作。两个虚线轮廓的框指的是处理软件包管理任务的共享库。![](img/image_rsrc2H4.jpg)在较低级别，我们有\
  \ `dpkg`。它的任务是安装单个 Debian 软件包或删除已安装的软件包的内容。为了查询软件包和文件，它使用了两个工具 `dpkg-deb` 和 `dpkg-query`。`dpkg`\
  \ 允许你维护软件包基础，但不处理软件包依赖关系。\n\n通常，上层由 `apt`、`aptitude` 和 `synaptic` 工具表示。这些工具的任务是通过将所有操作合并到一个应用程序中来简化软件包管理。这些工具使用共享库\
  \ `libapt-inst` 或 `libapt-pkg`，或者直接与 `dpkg` 通信以执行软件包管理任务。这包括处理软件包依赖。\n\n#### 软件包缓存\n\
  \n软件包缓存位于 `/var/cache/apt/archives`。每当你通过 `apt-get` 或 `aptitude` 安装软件包时，相应的软件包就会被检索并本地存储在此位置。为了说明，下面列表使用\
  \ `ls` 列出了缓存的 deb 软件包。\n\n```\n$ ls /var/cache/apt/archives/*.deb\n\n/var/cache/apt/archives/cpuid_20140123-2_amd64.deb\n\
  \n/var/cache/apt/archives/libxml2-utils_2.9.1+dfsg1-5+deb8u7_amd64.deb\n\n/var/cache/apt/archives/python3-bitarray_0.8.1-1_amd64.deb\n\
  \n/var/cache/apt/archives/python-bitarray_0.8.1-1_amd64.deb\n```\n\n你安装的软件越多，缓存的\
  \ deb 软件包就越多。建议定期使用 `aptitude` 或 `apt-cache` 清理软件包缓存。\n\n```\n# aptitude clean\n\
  \n# apt-cache clean\n```\n\n# 14.2 日常管理任务\n\n本节涉及作为 Linux 所有者和管理员日常生活中需要的基本软件包管理操作。\n\
  \n## 显示已安装的软件包\n\n`dpkg -l` 命令列出已安装的软件包及其状态。下面的图片显示了输出。\n\n![](img/image_rsrc2H5.jpg)单列包含以下信息：\n\
  \n![](img/image_rsrc2H6.jpg)`status` - 软件包的状态，例如完全安装 (ii) 或已删除但仍保留配置 (rc)。\n\n![](img/image_rsrc2H7.jpg)`name`\
  \ - 软件包名称。![](img/image_rsrc2H8.jpg)`version` - 软件包版本。![](img/image_rsrc2H9.jpg)`architecture`\
  \ - 软件包构建的架构或平台。![](img/image_rsrc2HA.jpg)`description` - 软件包的简短描述。\n\n## 安装软件包\n\
  \n要安装软件包，请使用 `apt-get` 命令。下面的输出显示了 `htop` 软件包的情况。\n\n```\n# apt-get install htop\n\
