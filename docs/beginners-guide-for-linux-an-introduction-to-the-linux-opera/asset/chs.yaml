  \ Done\n\nSuggested packages:strace\n\nThe following NEW packages will be installed:\n\
  htop0 upgraded, 1 newly installed, 0 to remove and 35 not updated.\n\nNeed to get\
  \ 88.2 kB of archives.\n\nAfter this operation, 224 kB of additional disk space\
  \ will be used.\n\nGet:1 http:..ftp.us.debian.org/Debian stratch/main amd64 htop\
  \ amd64 2.0.2-1 [88.2 kB] Fetched 88.2 kB in 1s (76.6 kB/s)\n\nSelecting previously\
  \ unselected package htop.\n\n(Reading database … 82741 files and directories currently\
  \ installed.)\n\nPreparing to unpack …/htop_2.0.2-1_amd64.deb …\n1_amd64.deb …\n\
  1) …\n\nProcessing triggers for mimesupport (3.60) …\nsupport (3.60) …\n1) …\n\n\
  Processing triggers for man-db (2.7.6.1-2)…\n\nSetting up htop (2.0.2-1) …\n```\n\
  \n## 更新已安装的软件包\n\n更新已安装的软件包非常简单，按照如下方式即可。首先，使用本章之前提到的 `apt-get update` 更新软件包列表。然后运行\
  \ `apt-get install` 来更新软件包。如果有可用的软件包更新版本，将从软件包镜像中检索新软件包，删除旧软件包并安装新软件包。\n\n## 移除已安装的软件包\n\
  \n移除已安装的软件包的方法与安装或更新类似。`apt-get` 命令具有删除软件包的选项，如下所示。\n\n```bash\n# apt-get remove\
  \ htop\n\nReading package lists… Done\n\nBuilding dependency tree\n\nReading state\
  \ information… Done\n\nThe following packages will be REMOVED:\nhtop\n0 upgraded,\
  \ 0 newly installed, 1 to remove and 35 not updated.\n\nAfter this operation, 224\
  \ kB of additional disk space will be freed.\n\nDo you want to continue? [Y/n]\n\
  \n(Reading database … 82751 files and directories currently installed.)\n\nRemoving\
  \ htop (2.0.2-1)…\n\nProcessing triggers for mimesupport (3.60) …\nsupport (3.60)\
  \ …\n1) …\n1) …\n2) …\n```\n\n此步骤会移除所有配置文件之外软件包内容。要彻底移除软件包及其配置文件，请如下添加开关 `--purge`：\n\
  \n```bash\n# apt-get remove --purge htop\n```\n\n## 寻找 Linux 替代方案\n\n你可能会发现某些程序与\
  \ Linux 不兼容，且仅为 Windows 或 macOS 创建。但 Linux 的伟大之处在于，对于每一个 Windows 或 macOS 应用，几乎总有一个\
  \ Linux 替代方案。以下是寻找 Linux 特有应用的两个优秀资源。\n\n![](img/image_rsrc2HB.jpg)https://www.linuxalt.com/\n\
  ![](img/image_rsrc2HC.jpg)https://linuxfinder.com/\n\n# 15. 进程管理\n\n理解程序的执行对于成为一名优秀的管理员至关重要，对普通用户也有用。程序的运行实例被称为进程。每个进程都被分配一个进程\
  \ ID (PID)，允许系统跟踪所有进程。系统进程 PID 为 0，然后初始进程 PID 为 1，以此类推。初始进程 PID 1 指向旧系统上的 `/sbin/init`\
  \ 或现代系统上的 `/sbin/systemd`。\n\n### 15.1 使用 ps 和 pstree\n\n要列出所有运行中的进程，请使用 `ps` 命令或\
  \ `pstree` 命令。\n\n```bash\n# ps\n\nPID TTY TIME CMD\n628 pts/0 00:00:00 su\n629\
  \ pts/0 00:00:00 bash\n2507 pts/0 00:00:00 ps\n```\n\n上述 `ps` 输出由四列组成，含义如下：\n\n\
  ![](img/image_rsrc2HD.jpg)`PID` - 进程 ID。![](img/image_rsrc2HE.jpg)`TTY` 调用命令的终端。![](img/image_rsrc2HF.jpg)`TIME`\
  \ - 进程运行的时间。![](img/image_rsrc2HG.jpg)`CMD` - 调用的命令\n\n以下开关可检索有关进程的额外信息：\n\n![](image_rsrc2HH.jpg`-e`:\
  \ 显示所有进程。![](image_rsrc2HJ.jpg`-p`: 仅显示指定的 PID 信息。![](image_rsrc2HK.jpg`-C`: 显示指定命令名的进程。![](image_rsrc2HM.jpg`-u`:\
  \ 显示属于指定用户的进程。\n\n```bash\n$ ps -u fritz\n\nPID TTY TIME CMD\n1341 ? 00:00:00 systemd\n\
  1406 ? 00:00:32 xfwm4\n1408 ? 00:01:10 xfce4-panel\n1410 ? 00:00:15 xfdesktop\n\
  1411 ? 00:00:05 xfsettingsd\n1413 ? 00:00:05 x-www-browser\n1415 ? 00:00:06 xfce4-power-man\n\
  1418 ? 00:00:00 gvfsd\n1808 pts/0 00:00:00 bash\n1841 pts/0 1-06:21:26 iceweasel\n\
  4537 pts/4 00:00:00 bash\n4760 pts/5 00:00:00 bash\n```\n\n\n\n\n\n```\n5281 pts/1\
  \ 00:00:00 bash\n8213 pts/2 00:00:03 bash\n```\n\n### pstree\n`pstree` 命令与 `ps`\
  \ 命令类似，但它将进程显示为层级树结构。一个非常有用的选项是 `-p`，它可以在进程名称后添加进程 ID（PID）。\n\n### pidof\n`pidof`\
  \ 命令简单地显示指定进程的 ID。下面的示例返回了运行 `bash` 的进程的 PID。\n\n```bash\n# pidof bash\n629 623\n\
  ```\n\n### pgrep\n`pgrep` 是用于进程的 `grep` 命令（之前见过过）。该命令遍历当前运行的进程，并输出匹配给定模式的进程 ID。\n\
  \n下面的示例展示了两次调用。第一次调用请求 `pgrep` 搜索名称中包含 `xterm` 字符串模式的进程，并只输出结果进程 ID。第二次调用使用了两个选项\
  \ `-l`（`-list-name` 的缩写）和 `-a`（`--list-full` 的缩写）来显示进程 ID 和对应的进程名称。\n\n```bash\n\
  $ pgrep xterm\n741\n$ pgrep -la xterm\n741 xterm\n749 xterm\n```\n\n### top and\
  \ htop\n`top` 命令根据活动情况显示进程。最活跃的进程位于顶部，随后是活跃程度较低的进程。列表每秒更新一次。单列包含进程 ID (PID)、进程所有者的用户名\
  \ (`USER`)、进程优先级 (`PR`)、nice 值 (`NI`)、虚拟内存使用 (`VIRT`)、保留内存 (`RES`)、共享内存 (`SHR`)、CPU\
  \ 和内存使用百分比 (`%CPU` 和 `%MEM`)、进程运行时间 (`TIME`) 以及用于调用进程的命令 (`COMMAND`)。\n\n`htop`\
  \ 是一个额外的软件包（请参考第 4 章和第 14 章关于安装额外软件包的内容），包含一个更具交互性的 `top` 版本。列的布局与 `top` 。使用导航键和功能键来选择、排序或删除进程。\n\
  \n功能键如下：\n- `F1`: 显示帮助。\n- `F2`: 配置 htop。\n- `F3`: 在进程列表中搜索。\n- `F4`: 过滤终端输出。\n\
  - `F5`: 将进程显示为进程树。\n- `F6`: 更改进程的排序顺序。\n- `F7`: 降低选中进程的 nice 值。\n- `F8`: 增加选中进程的\
  \ nice 值。\n- `F9`: 终止选中进程。\n- `F10`: 退出程序。\n\n## 15.2 前台进程与后台进程\n进程有两种：前台进程和后台进程。前台进程通过终端会话初始化并控制。换句话说，必须有用户连接系统才能启动这些进程，且进程在执行期间会占用终端。相比之下，后台进程不连接终端，不需要显式的任何用户输入。因此，它们在等待完成时不占用终端，允许你运行多个进程。\n\
  \n可以使用 `&` 符号在后台初始化进程。\n\n```bash\n$ process1 &\n...\n```\n\n要将运行中的进程发送到后台，请使用 `bg`\
  \ 命令加上作业 ID。或者使用 `fg` 将进程发送到前台。你可以使用 `jobs` 命令显示当前正在运行的作业及其相关的作业 ID。\n\n```bash\n\
  $ process1 &\n$ process2 &\n$ jobs\n[1]+ Running process1\n[2]- Running process2\n\
  ```\n\n## 15.3 停止与终止进程\n如果一个运行中的程序无响应并导致系统负载过高，我们可以做什么来停止并移除它？幸运的是，我们有几个选项可以让我们向程序发送特定信号来停止它。在此情况下使用的命令是\
  \ `kill` 命令以及相应的选项。其中，我们有以下选项：\n\n- `SIGHUP` (1) - 挂断信号。程序可以监听此信号并对其采取行动。当你关闭终端时，此信号会被发送给运行在终端中的进程。\n\
  - `SIGINT` (2) - 中断信号。此信号被发送给进程以中断它们。程序可以处理此信号并对其采取行动。你也可以通过在运行程序的终端窗口中输入 `CTRL+C`\
  \ 直接签发出此信号。\n- `SIGTERM` (15) - 终止信号。此信号被发送给进程以将其终止。同样，程序可以处理此信号并对其采取行动，例如在终止之前将数据写入文件。这是\
  \ `kill` 命令在未指定信号时发送的默认信号。\n- `SIGKILL` (9) - 强制杀死信号。此信号会导致 Linux 内核立即终止进程。程序无法监听此信号。\n\
  \n要终止并杀死名为 `hangingProgram` 的程序，你必须首先识别该程序。你可以通过使用 `pgrep` 如下找到相关的进程：\n\n```bash\n\
  $ pgrep hangingProgram\n3167\n```\n\n接下来，向识别出的进程发送 `SIGTERM` 信号：\n\n```bash\n$ kill\
  \ -SIGTERM 3167\n```\n\n作为替代，你可以按照如下方式调用 `kill`：\n\n```bash\n$ kill -15 3167\n```\n\
  \n或者你可以通过按下 `CTRL+Z` 停止挂起的进程，然后使用此命令删除进程：\n\n```bash\n$ kill -SIGKILL 3167\n```\n\
  \n如上所示，该命令的效果相同：\n\n```bash\n$ kill -9 3167\n```\n\n## 15.4 调整进程优先级\n你机器的处理器可以同时管理多个任务。我们可以为\
  \ CPU 在查看不同待执行任务时设定遵循的指南。这些指南被称为 niceness 或 nice 值。Linux 的 niceness 范围从 -20 到 19，数字越小代表任务的优先级越高。如果\
  \ nice 值很高（如 19），该任务将被设置为最低优先级，CPU 将在任何有机会时处理它。默认 nice 值为零。\n\n你可以使用 `ps` 如下显示进程的\
  \ nice 值：\n\n```bash\n$ ps -o pid,comm,nice -p 1808\nPID COMMAND NI\n1808 bash 0\n\
  ```\n\n第一列包含进程 ID (`PID`)，第二列包含命令，第三列包含 nice 值 (`NI`)。如上面的示例所示，PID 为 `1808` 的 `bash`\
  \ 进程的 nice 值为 0。可以使用 `renice` 命令调整现有进程的 nice 值。要将上述进程的 nice 值降低到 10，执行以下命令。请记住，只有\
  \ root 用户可以对进程应用负的 nice 值。\n\n```bash\n$ renice 10 -p 1808\n```\n\n## 16 系统与网络安全\n\
  本章的核心思想是建立对如何设置和运行安全系统的基本理解。在接下来的部分中，我们将关注更具实操性的方法，查看开放端口的检测、现有及活跃用户、限制远程访问、更新软件以及利用可用的计算能力。\n\
  \n### 16.1 开放端口\n如果你从一开始就跟着操作，可能记得我们在安装 Linux 发行版时采用了极简安装。我们只安装了实际需要的软件包，并在以后需要时事后安装其他软件。我们建议所有新安装都这样做，因为其结果是一个非常精简、高性能且所需资源最少的系统。第二个原因是有限的软件限制了系统内部潜在安全问题的数量。\n\
  \n作为下一步，我们将检查从 Linux 系统外部可用的服务数量。这被称为端口扫描。协助我们的工具是命令行工具 `netcat` 和 `nmap`（Network\
  \ Mapper 的缩写），以及其图形版本 `zenmap`。\n\n#### netcat\n以下 `nc` (`netcat`) 命令开始扫描本地桌面系统\
  \ (`localhost`) 在端口 1 到 1024 之间的可用网络服务。`-zv` 选项启用端口的详细扫描：\n\n```bash\n$ nc -zv localhost\
  \ 1-1024\nlocalhost [127.0.0.1] 631 (ipp) open\nlocalhost [127.0.0.1] 111 (sunrpc)\
  \ open\nlocalhost [127.0.0.1] 80 (http) open\n```\n\n\n\n\n```\nlocalhost [127.0.0.1]\
  \ 25 (smtp) open\nlocalhost [127.0.0.1] 22 (ssh) open\n```\n\n`nc` 每行报告一个检测到的服务。上述示例的结果是端口\
  \ 631 上的网络打印协议 (IPP)、端口 111 上的 Sunrpc 服务、端口 80 上的超文本传输协议 (HTTP)、端口 25 上的简单邮件传输协议\
  \ (SMTP) 以及端口 22 上的安全外壳 (SSH)。检测我们 Linux 服务器上的开放端口会给我们略有不同的视图。下面的示例显示了我们的扫描结果。你可以看到，`nc`\
  \ 接受各种输入：单个端口、整个端口范围或服务名称。如果连接被拒绝。\n\n```bash\n$ nc -zv localhost 1-1024 localhost\
  \ [127.0.0.1] 22 (ssh) open\n```\n\n```bash\n$ nc -zv localhost ssh\n```\n```\n\
  localhost [127.0.0.1] 22 (ssh) open\n```\n```bash\n$ nc -zv localhost ftp\n```\n\
  如果可用则返回 open，否则返回：\n```\nlocalhost [127.0.0.1] 21 (ftp) : Connection refused\n```\n\
  ```bash\n$ nc -zv localhost http\n```\n```\nlocalhost [127.0.0.1] 80 (http) : Connection\
  \ refused\n```\n\n## nmap 和 zenmap\n\n我们将查看的下一个命令是 `nmap`。开关 `-T4` 设置定时，`-A` 启用操作系统的检测。这一步被称为\
  \ OS 探测。以下调用对本地系统执行此操作：\n\n```bash\n$ nmap -T4 -A localhost\n```\n\n报告非常详细，包含了有关检测到的操作系统以及服务的信息。\n\
  \n```bash\n$ nmap -T4 -A localhost\nStarting Nmap 7.40 ( https://nmap.org ) at 2018-10-05\
  \ 10:39\nNmap scan report for localhost (127.0.0.1)\nHost is up (0.00013s latency).\n\
  Other addresses for localhost (not scanned): ::1\nNot shown: 999 closed ports\n\
  PORT STATE SERVICE VERSION\n22/tcp open ssh OpenSSH 7.4p1 Debian 10+deb9u3 (protocol\
  \ 2.0)\n| ssh-hostkey:\n| 2048 0d:9e:f0:07:f4:86:33:c1:77:24:d6:4b:af:c7:c2:78 (RSA)\n\
  | 256 22:83:b2:bc:b2:7d:64:6b:86:b2:6b:e6:c2:d4:45:6c (ECDSA)\nService Info: OS:\
  \ Linux; CPE: cpe:/o:linux:linux_kernel\nService detection performed. Please report\
  \ any incorrect results at https://nmap.org/submit/. Nmap done: 1 IP address (1\
  \ host up) scanned in 0.55 seconds\n```\n\n下面我们使用 `zenmap` 扫描我们的 Linux 系统，它为我们提供了与上面相同的结果。两个结果都显示，唯一启用且从外部访问的服务是\
  \ OpenSSH（Open Secure Shell 的缩写）。![](img/image_rsrc2J4.jpg)\n\n## 16.2 本地和远程用户\n\
  \nLinux 系统的安全性包括用户及其账户。在第 10 章中，我们查看了如 `w`、`who` 和 `users` 等基本命令。现在我们将处理更复杂的检测用户信息的方法。\n\
  \n要存在哪些本地账户，你可以查看 `/etc/passwd` 文件并验证这些条目。普通用户账户的用户 ID 以 `1000\\.` 开始。为了查看哪些本地用户登录了系统，可以使用\
  \ `lslogins` 命令。`lslogins` 从不同的配置文件中提取用户信息并以非常漂亮的方式显示结果。作为普通用户调用且不带任何额外开关时，它会显示用户\
  \ ID、账户名称、登录次数以及 GECOS 字段的内容。![](img/image_rsrc2J5.jpg)\n\n作为管理员用户调用时，`lslogins`\
  \ 会增加 `PWD-LOCK` 和 `PWD-DENY` 两列的信息。这些列显示了关联账户是否被锁定或是否拒绝了通过密码登录。![](img/image_rsrc2J6.jpg)\n\
  \n为了查看特定用户的详细信息，`lslogins` 使用开关 `-u` 后接用户名，以及使用 `--time iso` 以可读的格式显示时间。\n\n###\
  \ lslogins -u user --time iso\n\n```\nUsername: user\nUID: 1000\nGecos field: Debian\
  \ User,123,456,135\nHome directory: /home/user\nShell: /bin/bash\nNo login: no\n\
  Password is locked: no\nPassword not required: no\nLogin by password disabled: no\n\
  Primary group: user\nGID: 1000\nSupplementary groups: Bluetooth, cdrom, floppy,\
  \ audio, dip, video, plugdev, netdev Supplementary group IDs: 111, 24, 25, 29, 30,\
  \ 44, 46, 108\nHushed: no\nPassword expiration warn interval: 7\nPassword changed:\
  \ 2018-08-20\nMaximum change time: 99999\nRunning processes: 32\nLast logs:\n2020-10-05T12:11:19+0200\
  \ systemd[438]: Time has been changed\n2020-10-05T12:11:52+0200 systemd[438]: Time\
  \ has been changed\n2020-10-05T12:12:24+0200 systemd[438]: Time has been changed\n\
  ```\n\n如上所述，`lslogins` 仅评估本地登录尝试。要检索来自远程系统的登录尝试，请使用 `getent` 命令。它还评估支持名称服务切换库（NSS）的数据库，该库在\
  \ `/etc/nsswitch.conf` 中配置，并涵盖了轻量级目录访问协议 (LDAP) 和网络信息系统 (NIS) 等服务。要获取用户 `caro` 的信息，如下所示调用\
  \ `getent`：\n\n```bash\n$ getent passwd caro\n```\ncaro:x:1005:1005:Caro,,,:/home/caro:/bin/bash\n\
  ```\n\n这两个命令 `last` 和 `lastlog` 也可以用于显示哪些用户最后登录过。`last` 报告如下所示的详细登录情况。列包含用户名、终端和会话信息。\n\
  \n```bash\n$ last\n```\nuser pts/13 :0 Fri Oct 5 14:11 - 14:24 (00:13 elapsed)\n\
  ```\n`lastlog` 打印最后登录用户的统计信息。第一个示例显示所有用户的情况，第二个针对特定用户。![](img/oldlibs`)）、包名，然后是包类\
  \ (`extra`）。\n\n```bash\n$ deorphan -szP\n235 main/oldlibs iceweasel extra\n32 main/oldlibs\
  \ netcat extra\n```\n可以使用下面的命令删除不再需要的包。这将清理系统中遗留的未使用的库和旧依赖项。\n\n```bash\n$ apt-get\
  \ autoremove\n```\n\n\n\n\n\n移除未使用的软件非常有帮助。保持剩余软件包更新到最新版本也很重要，我们在第 14.16.5 节中讨论过。\n\
  \n# 有用的网络和系统命令\n\n`uname` 是 UNIX name 的缩写。该命令显示系统信息，例如 Linux 内核的准确名称和版本以及计算机的主机名。下面的示例显示了带有参数\
  \ `-a`（`all` 的缩写）的 `uname` 命令。输出包含操作系统名称（Linux）、主机名（debian106）、内核版本及其编译日期（4.9.8-7-amd64\
  \ #1 SMP Debian 4.9.110-1 (2018-07-05))以及系统架构（x86_64）。\n\n```bash\n$ uname -a\n\
  Linux debian106 4.9.0-7-amd64 #1 SMP Debian 4.9.110-1 (2018-07-05) x86_64 GNU/Linux\
  \ \n```\n\n`uptime` 此命令显示系统运行了多久。它显示当前时间（07:36:47），之后是运行的小时（21:56）、登录用户数（1 user）以及过去\
  \ 1、5 和 15 分钟的平均负负载（load average: 0.47, 0.43, 0.29）。\n\n```bash\n$ uptime\n07:36:47\
  \ up 21:56, 1 user, load average: 0.47, 0.43, 0.29\n```\n\n要以更好的方式查看运行时间，请使用选项 `-p`（`pretty`\
  \ 的缩写）。下面的示例显示了更符合人类阅读习惯的信息。系统已运行了 22 小时 3 分钟。\n\n```bash\n$ uptime -p\nup 22 hours,\
  \ 3 minutes\n```\n\n`ip` `ip` 命令（配合关键词 `address` `show`）显示当前网络配置。下面的示例显示了回环接口（`lo`）和太网接口（`enp0s3`）。网网接口配置了\
  \ IP 地址 `10.0.2.15`。网络接口的缩写如下：\n\n![](img/image_rsrc2J9.jpg)\n- `Lo`：回环接口。用于访问本地服务，如代理或\
  \ Web 服务器。\n![](img/image_rsrc2JA.jpg)\n- `eth0`：连接到网络交换机或路由器的第一个太网接口。\n![](img/image_rsrc2JB.jpg)\n\
  - `wlan0`：第一个无线接口。\n![](img/image_rsrc2JC.jpg)\n- `ppp0`：第一个点点接口，用于通过 VPN 或拨号服务连接。\n\
  \n```bash\n$ ip address show\n1: lo: <LOOPBACK, UP, LOWER_UP> mtu 65536 qdisc noqueue\
  \ state UNKNOWN group default qlen 1link/loopback 00: 00: 00: 00 00: 00 brd 00:\
  \ 00: 00: 00 00: 00\ninet 127.0.0.1/8 scope host lo\nvalid_lft forever preferred_lft\
  \ forever\ninet6 ::1/128 scope host\nvalid_lft forever preferred_lft forever\n2:\
  \ enp0s3: <BROADCAST,MULTICAST, UP, LOWER_UP> mtu 1500 qdisc pfifo_fast state UP\
  \ group default qlen 1000link/ether 08: 00: 27: e3: 5c: 79 brd ff: ff: ff: ff: ff:\
  \ ff:inet 10.0.2.15/24 brd 10.0.2.255 scope global enp0s3\nvalid_lft forever preferred_lft\
  \ forever\ninet6 fe80::a00:27ff:fee3:5c79/64 scope link\nvalid_lft forever preferred_lft\
  \ forever\n```\n\n`ping` 向给定的 IP 地址或主机名发送 ICMP 网络包，并显示往返时间。下面的示例演示了主机 `http://www.google.com`\
  \ 的情况。\n\n```bash\n$ ping google.com\nPING google.com (127.217.23.142) 56(84) bytes\
  \ of data.\n64 bytes from fra16s18-in-f14.1e100.net (172.217.23.142): icp_seq=1\
  \ ttl=63 time=36.9 ms 64 bytes from fra16s18-in-f14.1e100.net (172.217.23.142):\
  \ icp_seq=2 ttl=63 time=37.9 ms 64 bytes from fra16s18-in-f14.1e100.net (172.217.23.142):\
  \ icp_seq=3 ttl=63 time=40.1 ms ^C\n--- google.com ping statistics --\n3 packets\
  \ transmitted, 3 received, 0% packet loss, time 2003ms\nrtt min/avg/max/mdev = 36.953/38.353/40.193/1.377\
  \ ms\n```\n\n# 17. 共享库\n\nLinux 与任何操作系统一样，都包含了用于不同目的的文件集合，例如二进制文件（编译后的程序代码）、运行时解释代码（用\
  \ Perl 或 Python 等程序编写的代码）、配置文件、日志文件、库和用户数据。在编程世界中，库是一系列预编译的代码片段，这些片段可以在其他程序中使用。这些库包含了函数、类和数据结构。它们允许重用已经存在并经过测试的代码，因此用户不需要重复造轮子。结果，库极大地简化了程序员的生活。Linux\
  \ 中最突出的库示例是标准 C 库 `libc` 以及 `libc` 的 GNU 版本 `glibc`。\n\nLinux 区分了静态链接和动态链接的二进制程序。静态链接意味着库中的例程成为程序的一部分。相比之下，动态链接意味着库中的例程仅被引用，而不会成为程序的一部分。静态链接程序彼此完全独立，但需要更多的磁盘空间。动态链接程序较小，但依赖于引用的库，这意味着如果引用的库已经在内存中，它们的加载速度会更快。这些库被称为共享库或动态库。\n\
  \n## 17.1 命名规范\n\n通常将共享库的文件名扩展为 `.so`，这是 shared object（共享对象）的缩写。除了文件名外，共享库还有一个名为\
  \ `soname` 的库名。例如，`libc` 的 `soname` 是 `libc.so.6`。这里 `lib` 是前缀，`c` 是描述性名称，`so` 是\
  \ shared object 的缩写，而 `6` 是库的版本（应用程序二进制接口 ABI 的版本）。包含路径的文件名是 `/lib64/libc.so.6`。注意\
  \ `soname` 是指向文件名的符号链接。\n\n通常这些文件位于以下目录中：\n\n![](img/image_rsrc2JD.jpg)\n- 默认路径\
  \ - `/usr/local/lib`, `/usr/local/lib64`, `/usr/lib`, `/usr/lib64/`。\n![](img/image_rsrc2JE.jpg)\n\
  - 系统启动库 - `/lib`, `/lib64`。\n\n然而，程序员可以在自定义位置安装库。库路径在配置文件 `/etc/ld.so.conf` 中定义。可以通过以下方式定义库的位置：\n\
  \n```bash\n$ cat /etc/ld.so.conf\ninclude /etc/ld.so.conf\n```\n\n以下命令说明了如何使用 `find`\
  \ 命令在系统中查找共享库：\n\n```bash\n$ find / -name \"*.so*\"\n```\n\n## 17.2 识别引用的共享库\n\n\
  要确定一个二进制文件使用了哪些共享对象，我们可以使用 `ldd` 命令。例如，要查找文件的共享对象，输出中的每一行都由 `soname` 后接括号中的文件名组成。\n\
  \n```bash\n$ ldd /bin/bash\nlinux-vd-x86-64.so.2 (0x0000555cbfa60000)\nlibang.so.2\
  \ => /lib/x86_64-linux-gnu/libang.so.2 (0x00007f483d6bb00)\nlibgpm.so.2 => /lib/x86_64-linux-gnu/libgpm.so.2\
  \ (0x00007f483d4b50)\nlibext2fs.so.2 => /lib/x86_64-linux-gnu/libext2fs.so.2 (0x00007f483d26e0)\n\
  libssh2.so.1 => /lib/x86_64-linux-gnu/libssh2.so.1 (0x00007f483d0450)\nlibgmodule-2.0.so\
  \ => /lib/x86_64-linux-gnu/libgmodule-2.0.so (0x00007f483cb4100)\nlibglib-2.0.so\
  \ => /lib/x86_64-linux-gnu/libglib-2.0.so (0x00007f483cb3100)\nlibpthread.so.0 =>\
  \ /lib/x86_64-linux-gnu/libpthread.so.0 (0x00007f483c91400)\nlibc.so.6 => /lib/x86_64-linux-gnu/libc.so.6\
  \ (0x00007f483c56900)\nlibdl.so.2 => /lib/x86_64-linux-gnu/libdl.so.2 (0x00007f483c3640)\n\
  libm.so.6 => /lib/x86_64-linux-gnu/libm.so.6 (0x00007f483c0630)\nlibcom_err.so.2\
  \ => /lib/x86_64-linux-gnu/libcom_err.so.2 (0x00007f483be5f00)\nlibz.so.1 => /lib/x86_64-linux-gnu/libz.so.1\
  \ (0x00007f483bc4300)\nlibgcrypt.so.20 => /lib/x86_64-linux-gnu/libgcrypt.so.20\
  \ (0x00007f483b96200)\nlibpcre.so.3 => /lib/x86_64-linux-gnu/libpcre.so.3 (0x00007f483b6f400)\n\
  /lib64/ld-linux-x86-64.so.2 (0x0000555cbfa6000)\n```\n\n\n\n\n\n`libgpg-error.so.0\
  \ => /lib/x86_64-linux-gnu/libgpg-error.so.0 (0x00007f483b4e1000)`\n\n如果二进制文件是静态链接程序，`ldd`\
  \ 的输出如下：\n\n```bash\n$ ldd /usr/bin/ldd\nnot a dynamic executable\n```\n\n## 17.\
  \ 使用 objdump 识别引用的库\n\n`ldd` 的替代方案是 `objdump`。下面的示例结合了 `objdump` 和 `grep`，以便过滤出包含所需共享对象的行。程序\
  \ `mc` 需要下面所示的八个共享库。`grep` 将在第 7 章详细讨论。目前，只需知道该命令作为过滤器处理文本数据，并仅打印匹配指定字符的文本行。\n\n\
  ```bash\n$ objdump -p /usr/bin/mc | grep NEEDED\nNEEDED libslang.so.2\nNEEDED libgpm.so.2\n\
  NEEDED libext2fs.so.2\nNEEDED libssh2.so.1\nNEEDED libgmodule-2.0.so.0\nNEEDED libglib-2.0.so.0\n\
  NEEDED libpthread.so.0\nNEEDED libc.so.6\n```\n\n## 18. 日志文件\n\n在 Linux 管理中，有时你需要弄清楚系统为何以出乎意料的方式运行。这就是日志文件的用用场。这类文件记录了系统的行为，并帮助你找出任何时间点发生了什么。日志文件存储在\
  \ `/var/log` 目录。哪些日志文件对你重要取决于你的系统和需求。\n\n### 18.1 重要的日志文件\n\n下面说明的日志文件是服务器系统中最重要的文件之一。\n\
  \n#### `/var/log/messages`\n这是 Linux 中最重要的日志文件。它持久地记录通用系统事件，例如系统错误消息、系统启动和关闭，以及网络配置的变化。下面的示例包含了电话（USB\
  \ 设备）连接时立即记录的日志消息：\n\n```text\nOct 4 15:10:37 debian106 kernel: [532994.056321]\
  \ usb 2-2: USB disconnect, device number - 16\nOct 4 15:10:37 debian106 kernel:\
  \ [532994.391279] usb 2-2: new high-speed USB device number 17 using xhci_hcd\n\
  Oct 4 15:10:37 debian106 kernel: [532994.520991] usb 2-2: New USB device found,\
  \ idVendor=04e8, idProduct=6860\nOct 4 15:10:37 debian106 kernel: [532994.520993]\
  \ usb 2-2: New USB device strings: Mfr - =1, Product=2, SerialNumber=3\nOct 4 15:10:37\
  \ debian106 kernel: [532994.520994] usb 2-2: Product: SAMSUNG_Android\nOct 4 15:10:37\
  \ debian106 kernel: [532994.520995] usb 2-2: Manufacturer: SAMSUNG ...\n```\n\n\
  #### `/var/log/lastlog`\n该文件记录了哪些用户登录了 Linux 系统。使用 `lastlog` 命令查看登录统计数据。我们在第 16\
  \ 章中详细讨论过这个命令。\n\n#### `/var/log/auth.log`\nDebian 和 Ubuntu 服务器中所有认证相关的事件都记录在这里。如果你正在查找任何涉及用户授权机制的记录，可以在此日志文件中找到。\n\
  \n```text\nOct 1 07:30:01 debian106 CRON[4251]: pam_unix(cron:session): session\
  \ opened for user root by (uid=0)\nOct 1 07:30:01 debian106 CRON[4251]: pam_unix(cron:session):\
  \ session closed for user root\nOct 1 09:04:14 debian106 systemd-logind[323]: Operation\
  \ 'sleep' finished.\nOct 1 15:09:03 debian106 systemd-logind[342]: Watching system\
  \ buttons on /dev/input/event3 (Power Button)\nOct 1 15:09:03 debian106 systemd-logind[342]:\
  \ Watching system buttons on /dev/input/event4 (Sleep Button)\nOct 1 15:09:03 debian106\
  \ systemd-logind[342]: Watching system buttons on /dev/input/event5 (Video Bus)\n\
  Oct 1 15:09:03 debian106 systemd-logind[342]: New seat seat0.\nOct 1 15:09:04 debian106\
  \ sshd[392]: Server listening on 0.0.0.0 port 22.\nOct 1 15:09:04 debian106 sshd[392]:\
  \ Server listening on :: port 22.\nOct 1 15:09:04 debian106 sshd[392]: Received\
  \ UP; restarting.\n```\n\n#### `/var/log/kern.log`\n在这里你可以找到与 Linux 内核相关的消息。\n\n\
  ```text\nOct 8 19:19:34 debian106 kernel: [893330.867019] usb 2-1: low-speed USB\
  \ device number 37 using xhci_hcd\nOct 8 19:19:34 debian106 kernel: [893331.000139]\
  \ usb 2-1: New USB device, idVendor=046d, idProduct=c03d\nOct 8 19:19:34 debian106\
  \ kernel: [893331.000142] usb 2-1: New USB strings: Mfr - =1, Product=2, SerialNumber=0\n\
  Oct 8 19:19:34 debian106 kernel: [893331.000144] usb 2-1: Product: USB-PS/2 Optical\
  \ Mouse\nOct 8 19:19:34 debian106 kernel: [893331.000145] usb 2-1: Manufacturer:\
  \ Logitech\nOct 8 19:19:34 debian106 kernel: [893331.000259] usb 2-1: ep 0x81 -\
  \ rounding to 64 microframes, ep80 microframes\nOct 8 19:19:34 debian106 kernel:\
  \ [893331.004037] input: USB-PS/2 Optical Mouse as /devices/pci0000:00:14.0/usb/2-1/2-1:1.0:0004:C03D.001B/input\n\
  Oct 8 19:19:34 debian106 kernel: [893331.004198] hid-generic 0004:C03D.001B/input/hidraw0:\
  \ HID v10\n```\n\n#### `/var/log/dpkg.log`\n该文件属于 `dpkg`（我们在第 14 章讨论过），并记录了安装、更新和移除包的情况。\n\
  \n```text\n2020-10-06 21:52:41 install\n2020-10-06 21:53:11 install\n2020-10-06\
  \ 21:53:11 upgrade\n2020-10-06 21:53:11 triggers\n2020-10-06 21:53:11 half-configured\n\
  2020-10-06 21:53:11 half-installed\n2020-10-06 21:53:11 unpacked\n2020-10-06 21:53:11\
  \ upgraded\n2020-10-06 21:53:11 upgrade\n```\n\n#### `/var/log/apt/history`\n与上文件类似，该文件记录了\
  \ `apt` 对安装、更新和移除包的更改。\n\n```text\nStart-Date: 2018-10-06 21:50:02\nUpgrade: imagemagick-6.q16:amd64\
  \ (6.8.9.9-5+deb8u3, 6.8.9.9-5+deb8u4), imagemagick:amd64 (6.8.9.9-5+deb8u3, 6.8.9.9-5+deb8u4)\n\
  End-Date: 2018-10-06 21:50:04\nStart-Date: 2018-10-06 21:51:05\nUpgrade: bind9-host:amd64\
  \ (9.9.5.dfsg-9+deb8u15, 9.9.5.dfsg-9+deb8u16), liblwres90:amd64 (9.9.5.dfsg-9+deb8u15,\
  \ 9.9.5.dfsg-9+deb8u16), libdns100:amd64 (9.9.5.dfsg-9+deb8u15, 9.9.5.dfsg-9+deb8u16),\
  \ libisccfg90:amd64 (9.9.5.dfsg-9+deb8u15, 9.9.5.dfsg-9+deb8u16), libbind9-90:amd64\
  \ (9.9.5.dfsg-9+deb8u15, 9.9.5.dfsg-9+deb8u16), dnsutils:amd64 (9.9.5.dfsg-9+deb8u15,\
  \ 9.9.5.dfsg-9+deb8u16), libisc95:amd64 (9.9.5.dfsg-9+deb8u15, 9.9.5.dfsg-9+deb8u16)\n\
  End-Date: 2018-10-06 21:51:07\n```\n\n### 18.2 核心命令与图形化工具\n\n除了上面介绍的日志文件外，还有系统命令可以显示机器的相关信息。\n\
  \n`dmesg`\n正如第 8 章所述，该命令允许你查看整个启动过程，包括 BIOS 消息。\n\n```bash\n# dmesg\n```\n\n`journalctl\
  \ -b`\n同样见第 8 章，该命令显示系统的启动日志。\n\n```bash\n# journalctl -b\n```\n\n`journalctl _UID=1000`\n\
  该命令显示特定用户的日志记录。在此实例中，它显示 ID 为 1000 的用户的记录。\n\n```bash\n# journalctl _UID=1000\n\
  ```\n\n`journalctl --disk-usage`\n要查看存储日志文件需要多少磁盘空间，可以使用如下切换 `-disk-usage`：\n\n\
  ```bash\n# journalctl --disk-usage\n```\n\n归档和活动日志在系统中占用了 11.5M。\n\n\n\n\n\n对于系统管理员来说，使用\
  \ `tail`、`cat` 或 `grep` 等命令行工具是非常常见的。但如果你更喜欢图形化工具，有两个非常棒的选择可以考虑：日志文件导航器 `lnav` 或\
  \ `glogg`，如下所示![](img/image_rsrc2JF.jpg)!(image_rsrc2JG.jpg)\n\n# 19. 获取帮助\nLinux\
  \ 是一个相当复杂的操作系统，对初学者来说尤其是如此。当你开始时，程序列表可能会让你非常困惑。每个程序的参数或选项列表都比上一个长。而且它们并不容易记忆，有长名称和短名称，且没有统一标准。在遇到困难时寻求帮助并不是错误，也不是失败的标志。\n\
  \n要在 Linux 系统上获取帮助，有几种方法可以。这包括手册页（称为 `man pages`）、信息页（称为 `info pages`）以及每个命令内置的帮助。在本章中，我们将更深入地查看这些帮助系统，并熟悉\
  \ `man`、`info`、`whereis` 和 `whatis` 命令。\n\n## 19.1 Man Pages\n手册页（Man pages）是分发程序文档的传统方式。`man\
  \ page` 是 `manual page` 的缩写，因为它们对应于打印版手册的页面。手册页是 Linux 系统基础安装的一部分。相应的 Debian 软件包名为\
  \ `manpages`。\n\n一个手册页对应于完整 UNIX 手册中的特定章节：1 代表命令，2 代表系统调用，此类等。要获取有关特定命令的信息，请在终端窗口中打开相应的手册页。例如，对于\
  \ `cp` 命令，操作如下：\n\n```bash\n$ man cp\n```\n\n生成的手册页所示![](img/image_rsrc2JH.jpg)\
  \ 快捷键绑定与文本编辑器 `vi(m)` 类似。使用方向键向上和向下滚动，按 `q` 退出手册页并返回终端。\n\n## 19.2 Info Pages\n\
  `Info` 是 GNU 项目内部文档的默认格式。在 20 世纪 90 年代初，GNU 项目认为手册页系统已经过时，并编写了 `info` 命令来取代它。`info`\
  \ 具有基础的超链接功能，并使用一种更简单的标记语言（与手册页使用的 `troff` 系统相比）。如今，这两个系统并存存在。\n\nDebian 的基础安装不包含\
  \ `info` 页。为了使用它，请后安装名为 `info` 的软件包（参考第 4 章和第 14 章关于如何安装额外软件包）。要获取有关特定命令的信息，请在终端窗口中打开相应的\
  \ info 页。例如，对于 `cp` 命令，操作如下：\n\n```bash\n$ info cp\n```\n\n生成的 info 页所示![](img/image_rsrc2JJ.jpg)\n\
  \n## 19.3 Integrated 帮助\n除了 `man` 和 `info`，许多命令都有 `-h` 选项（`-help` 的缩写）。带有此选项调用命令会打开特定的帮助部分。下面的示例显示了\
  \ `uname` 命令的内置帮助![](img/image_rsrc2JK.jpg)\n\n此外，`whatis` 命令对于获取 Linux 命令或函数的简要信息很有帮助。它会为作为命令行参数传递给\
  \ `whatis` 的字符串显示单行的手册页描述。`whatis` 在其由 `mandb` 程序维护的索引数据库中搜索该字符串，并从该命令手册页的 `NAME`\
  \ 部分中选取一个简短描述。下面的示例显示了 `mv` 和 `man` 两个命令的情况：\n\n```bash\n$ whatis mv\nmv (1) - move\
  \ (rename) files\n\n$ whatis man\nman (1) - an interface to the on-line reference\
  \ manuals\nman (7) - macros to format man pages\n```\n\n另一个选项是 `whereis` 命令，有助于在\
  \ Linux 系统中定位命令的手册页。这是一个非常简单的实用。下面的示例显示了 `mv` 和 `man` 两个命令：\n\n```bash\n$ whereis\
  \ mv\nmv: /bin/mv /usr/share/man/man1/mv.1.gz\n\n$ whereis man\nman: /usr/bin/man\
  \ /usr/local/man /usr/share/man /usr/share/man/man1/man.1.gz /usr/share/man/ma\n\
  ```\n\n每个命令还提供额外的信息和配置示例。这些内容存储在目录 `/usr/share/doc`，每个程序都有自己的子目录。内容是标准且因程序而异。内容对每个用户可见。下方显示了目录的一个片段![](img/image_rsrc2JM.jpg)\n\
  \n## 19.4 External Help\n如果软件工具提供的帮助不够，且需要进一步的解释，那么外部资源就会派上用场。可以咨询一些在线社区，例如![](img/image_rsrc2JN.jpg)\n\
  \n- LinuxHint: `https://support.linuxhint.com`![](img/image_rsrc2JP.jpg)\n- LinuxHelp:\
  \ `https://www.linuxhelp.com`\n\n另一个选项是 Linux 用户组 (LUG)。LUG 是来自同一地理位置的人员小组，他们共享对\
  \ Linux 操作系统的共同兴趣。他们被组织成松散的人群或定期聚会的协会。全球 LUG 的完整列表可以通过 `LugsList` 获取，地址为 `http://lugslist.com`![](img/image_rsrc2JR.jpg)。许多\
  \ LUG 组织聚会和经验分享，并从每个国际活动中学习。这包括分享想法和交流的本地和其他活动![](img/image_rsrc2JS.jpg)\n\n"
