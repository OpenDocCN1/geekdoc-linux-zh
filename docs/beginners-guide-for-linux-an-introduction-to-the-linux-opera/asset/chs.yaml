- "# Linux 初学者指南：Linux 操作系统入门指南\n\n\n\n![](img/image_rsrc27N.jpg)\n\n# 1. 什么是 Linux？\n\
  \nLinux 是一个依赖于 UNIX 标准的工作框架的名称。这个名字源于其芬兰设计者林纳斯·托瓦尔斯（Linus Torvalds）的首要名，并遵循了其他基于\
  \ UNIX 的框架所使用的哲学（最后一个字母是 x）。今天，Linux 由全球无数人士共同创建和维护。\n\n工作框架的内核是它的核心。它对于你的 PC 设备与你（客户端）之间的通信至关重要。一个工作框架是各种编程部分的集合：内核、不同的设备以及运行时的库。它是一个扩展了你\
  \ PC 基础工作配置（即 BIOS）的产品。\n\n## 1.1 从 UNIX 到 Linux\n\nLinux 的历史背景可以追溯到 20 世纪 90 年代。要理解\
  \ Linux 背后的故事，我们还需要短暂地回溯到第二次世界大战后的初期。那时，计算机占据了整个建筑，从机械部件到电子部件（类似于微芯片和集成电路的使用）的转变正在进行中。此外，在\
  \ 20 世纪 60 年代和 70 年代，硬件和编程部件非常昂贵且不规范。存在不同的供应商专有平台，每种平台都有自己的接口、传输和交换信息的协议，就像工作框架一样。这些单处理设备之间的通信需要特定的信息和对其协议的理解。UNIX\
  \ 的出现是为了绕过这些障碍，并在更大规模上利用处理设备。\n\n### UNIX\n\n1965 年初，通用电气（GE）和贝尔实验室/AT&T 之间开发了多路信息和计算服务合作项目。在设计者肯·汤森（Ken\
  \ Thompson）和迪尼斯·里奇（Dennis Ritchie）的推动下，他们创建的主要项目是 Unics。后来它被更名为 `UNIX`。UNIX 工作框架最初在加州大学伯尔克利分校使用。（`Multics`\
  \ 开始。Multics 是麻省理工学院（MIT）的产物。\n\n### UNIX 变体\n\nUNIX 的理念授权给了少数机构，它们创建并维护了自己的 UNIX\
  \ 变体。这包括 `Solaris/SUN OS`（现由 Oracle 拥有的 SUN Microsystems）、`AIX`（IBM）、Scenix（西门子）、`SCO\
  \ UNIX`、`Xenix`（微软），以及 `HP-UX`（惠普）、`NeXTSTEP`、`Mac OS`（苹果）和 `Android`（谷歌）。\n\n开源实现包含了伯克利系统发行（`BSD`）及其变体：`NetBSD`、`OpenBSD`\
  \ 和 `FreeBSD`。今天，Linux 是开源工程师中最著名的免费编程系统。上述框架也有稳固的商业支持。\n\n### UNIX 哲学\n\nUNIX 的设计考虑了几个严格的标准。这些标准涵盖了可移动性、多任务处理以及结合时间共享策略的多客户端方向。此外，它还依赖于遵循\
  \ `TCP/IP` 方案的网络可用性。\n\n首次开发是用 `C` 语言完成的，这实现了与硬件阶段的解耦。通过一套开发工具和库，它允许你轻松地扩展以满足你的特定需求。然而它虽然简单，但具有自动化任务的惊人能力，支持复杂且可行的脚本。\n\
  \n类似于工具箱，UNIX 由各种工具组成。每种工具都有特定的用途，并为该任务精确设计。核心思想是任务化。为了实现更多目标，将几个工具组合成一条链。下面的模型使用管道连接\
  \ `ls` 和 `wc` 两个命令，以便统计当前目录中 Python 文件的数量。\n\n```bash\n$ ls *.py | wc -l\n```\n\n\
  我们将在指南的后部分详细解释这些命令及其用途。\n\n## 1.2 Linux 简史\n\n与 UNIX 类似，Linux 工作框架有多个根源，取决于许多重要力量。其中包括理查德·M·斯塔曼、安德鲁·S·塔纳鲍姆和林纳斯·托瓦尔斯。\n\
  \nRichard M. Stallman 是 MIT 的程序员和工程师，自由软件基金会（FSF）的主要领袖，`GNU` 项目之父。GNU 的意思是“GNU 不是\
  \ UNIX”。该项目的目标是开发一个自由的 UNIX 工作框架。直到 20 世纪 90 年代初，各种工具可用，但一直缺少内核。整个程序在 1983 年左右根据\
  \ `GNU Public License`（`GPL`）发布。\n\nLinux 的下一个阶段来自 Andrew S. Tanenbaum。当时他是阿姆斯特大学的教授。为了他的学生，他创建了教学框架\
  \ `Minix`。正如他所说的，`Minix` 并非设计用于实际生产。\n\n赫尔辛基大学的芬兰学生 Linus Torvalds 曾是 `Minix` 的用户，并对其限制非常不满。1990\
  \ 年，他开始开发另一个依赖 `Minix` 思想、UNIX 标准和 `POSIX` 标准的工作框架。他的灵感是拥有一个既合理又能扩展到硬件极限的自己的框架。他也只是想度过一些美好的时光，首要考虑并不是出于商业目的。Linux\
  \ 背后的整个故事在他的自传书籍《趣味编程》（*Just for Fun*）中有描述。今天，林纳斯·托瓦尔斯负责监督 Linux 内核的开发。\n\n为了让 Linux\
  \ 对世界其他地方感兴趣，它需要一个好的标志。在一个吉祥物比赛中，提交了大量的提案。Larry Ewing 了一个企鹅的提案（如书封面所示），结果他的提案赢了。这只名为\
  \ `Tux` 的企鹅有着俏皮的微笑和圆润的身体，呈现了一个快乐满意的形象。\n\n## 1.3 Linux 应用范围\n\nLinux 最初是为 Intel\
  \ 设备设计的，但现在运行在许多架构上。除此之外，这包含了 ARM 设计（命名为 `arm` 和 `arm64`）、摩托罗拉/Freescale 的 68k 工程（`m68k`）、Intel\
  \ x86（`i386` 和 `amd64`）、IBM s390（`s390`）、`powerpc`）以及 SPARC（`sparc`）。\n\nLinux 从一开始就专注于服务器框架。它被广泛用于\
  \ Web 服务器、文件服务器、邮件和新闻服务器、网关、远程交换和防火墙。作为计算单元，它帮助制作了《泰坦尼克号》、《史瑞克》和《玩具总动员》等电影。此外，Linux\
  \ 还应用于汽车、航空、军事、协调等。2006 年左右，Linux 服务器运行着世界上所有的交易所。它还运行在几乎所有的搜索引擎上。\n\n在过去的十年里，Linux\
  \ 还攻占了桌面。由于其高灵活性安全性，它作为可靠的方案用于消息处理、计算机视觉、桌面计算、会计计算、通信（电子邮件、语音、视频）以及手机和电视的界面。\n\n\
  ## 1.4 Linux 认证\n\nLinux 的广泛应用增加了对明确自己所做工作的设计师和客户的兴趣。现在，Linux 认证变得很有价值。这些认证可以分为通用型（不针对特定发行版）和专注于（针对特定\
  \ Linux 发行版）。下面的列表列出了目前存在的认证。\n\n### 非通用型认证\n\n\n\n![](img/image_rsrc27P.jpg)Linux\
  \ 基础\n![](img/image_rsrc27R.jpg)LPIC-1: Linux 服务器专业人员认证\n![](img/image_rsrc27S.jpg)LPIC-2:\
  \ Linux 工程师\n![](img/image_rsrc27T.jpg)Linux Foundation 认证管理员 (LFCS)!\n![](img/image_rsrc27U.jpg)Linux\
  \ Foundation 认证工程师 (LFCE)!\n![](img/image_rsrc27V.jpg)CompTIA A+\n![](img/image_rsrc27W.jpg)CompTIA\
  \ Network+\n\n## 特定发行版的认证\n\n![](img/image_rsrc27X.jpg)红帽认证工程师 (RHCE)!\n![](img/image_rsrc27Y.jpg)红帽认证系统架构师\
  \ (RHCSA) RedHat \n![](img/image_rsrc27Z.jpg)认证架构师 (RCA)!\n![](img/image_rsrc280.jpg)SUSE\
  \ 认证管理员 (SCA)!\n![](img/image_rsrc281.jpg)SUSE 认证工程师 (SCE) SUSE\n![](img/image_rsrc282.jpg)企业级架构师\
  \ (SEA)\n\n## 2. 软件许可证\n\n与大多数可用的项目一样，编程程序还附带有相应的许可。产品许可描述了该产品的使用方式，并允许或限制其使用。对于商业软件，在严格的限制内允许修改和复制。例如，许可限制你只能供\
  \ 5 个用户使用，并要求你在添加第六个或第七个用户时获取另一个许可许可。常见的许可证有微软的共享源（Shared Source）和 Apple 许可。\n\n\
  对于开源编程，许可证的限制要少得多。它明确允许修改和复制，有时为了特定的客户和原因进行升级，这也是受欢迎的。其目标是确保产品现在和未来对所有人都是开放的。所谓的“拷贝左”（Copyleft）变体在必要时生效，并确保每个人对受保护程序的重新限制正如预期那样可以忽略不计。用于单个\
  \ Linux 部分及其工具的常用许可证是 `GNU 公共许可证` (`GPL`)、`BSD 许可证` 和 `Apache 许可证`。\n\n开源编程许可证遵循几项基本规则：![](img/image_rsrc283.jpg)为了任何目的使用程序（无限使用的自由\
  \ 0）。\n\n![](img/image_rsrc284.jpg)了解程序如何工作以及如何根据你的需求更改（读取程序源码的权利 自由 1）。![](img/image_rsrc285.jpg)制作软件副本以帮助他人（重新分发的权利\
  \ -自由 2）。\n\n![](img/image_rsrc286.jpg)改进软件并发布你的更改，以便所有其他用户也能从你的改进中获益（自由 3）。这确保了开放编程的性质不断提高，并且每个人都能获得这些升级。使用\
  \ `GPL` 时，必须使用类似的许可证分发。其他开源许可证（如 `BSD`）没有这一硬性要求。\n\n## 3. Linux 发行版\n\n有一些可能会让 Linux\
  \ 初学者困惑的术语。首先是它的名称，`Linux` 与 `GNU/Linux`。正如第 1 节之前描述的，`Linux` 指的是 Linux 内核本身。实际上，许多客户将\
  \ `Linux` 指代整个操作系统，包括内核、库和工具。`Linux` 术语偶尔也用来指代运行在 `Linux` 上或为该操作系统提供的每一个项目。\n\n\
  此外，`GNU/Linux` 的描述需要一些澄清。带有此前缀的 Linux 发行版是由 GNU 框架工具和程序配置而成的。其中一个模型是 `Debian GNU/Linux`。正如第\
  \ 1 节目前强调的，`GNU` 项目源于理查德·斯塔尔曼（Richard M. Stallman）和他创建一个自由 UNIX 框架的梦想。他在 MIT 的经历以及与不同伙伴的合作使他决定利用当时许多免费程序来重构他需要的工具。这包含了\
  \ `TeX` 排版框架以及 `X11` 窗口框架。他在可能的情况下通过 `GPL` 许可证发布了这些重构的工具，以便让任何感兴趣的人都能免费获取他的工作。\n\
  \n### 3.1 什么是 Linux 发行版？\n\nLinux 发行版是一系列组合在一起的软件包。发行版由一个软件设计师小组维护，小组中的每个人都专注于发行版的某个特定包。总之，他们确保了单个软件包是前瞻性的，并且不会与同一发布版本的其他包发生冲突。\n\
  \n截至 2020 年的 `Debian GNU/Linux 10`，官方仓库包含超过 59,000 个不同的软件包。仓库是具有特定用途的软件包目录。`Debian\
  \ GNU/Linux` 根据开发状态对其软件包进行分类。官方仓库名为 `stable`，镜像稳定包的当前发布。不同的仓库名为 `testing` 和 `unstable`，工作原理类似但不考虑官方包。\n\
  \n通常，一个 Linux 发行版包含 Linux 内核包、引导加载程序、GNU 工具和库、带有窗口环境的图形工作区域环境，以及额外的软件，如网络浏览器、电子邮件客户端、数据集和文档。产品以两种方式提供：源代码和编译好的二进制包。这允许你看到产品是如何规划的，对其进行深入研究，并根据你自己的需求进行修改。这一过程被描述为第\
  \ 2 节列表中的自由 1。\n\n根据 Linux 发行版的重点不同，它还包含特定用途的包，例如网络或测量设备、教育目的逻辑程序以及视视频应用程序。更多细节见下文。\n\
  \n### 3.2 选择 Linux 发行版\n\n根据 `Distrowatch`，存在超过 600 个不同的 Linux 应用。一个重要的问题是：应该使用哪种\
  \ Linux 应用？根据我们的经验，我们有以下建议![](img/image_rsrc287.jpg)对于初学者：`Ubuntu`、`Xubuntu`、`openSUSE`、`Linux\
  \ Mint`。(image_rsrc288.jpg)对于有经验的高级用户：`Debian GNU/Linux`、`Red Hat Enterprise Linux`\
  \ (`RHEL`)、`Fedora`、`CentOS`。\n\n![](img/image_rsrc289.jpg)对于开发者：`Arch Linux`、`Gentoo`、`Slackware`。对于书中的模型，我们使用\
  \ `Debian GNU/Linux`。尽管这个应用被认为是领先，但它仍然对新手非常友好，我们将在本指南中展示这一点。但选择它的最重要的原因是它的稳定性，以及我们在过去\
  \ 20 年在服务器和桌面系统持续使用中对该发行版的信任。其他的 Linux 应用对我们来说差异很大。我们看到初学者犯的最大错误是决定在开始时引入一个不稳定的发行版，这通常会摧毁你的整个\
  \ Linux 体验并让你完全放弃 Linux。你可以自由选择其他的 Linux 发行版。只需确保没有严重的兼容性问题即可。本书的大部分适用于大多数发行版。但如果你是一个完全的初学者，我们强烈建议在此期间至少坚持\
  \ Debian，因为我们将逐步介绍它的安排和配置。\n\n\n\n\n\n![](img/image_rsrc28F.jpg)\n提供的支持：支持可以是免费的（基于社区），也可以是付费的（基于支持合同）。在选择发行版时，我们建议选择一个稳定、定期更新且符合你使用\
  \ PC 真实初衷的版本。在下方，你将找到每种主要 Linux 发行版的简要描述。\n\n![](img/image_rsrc28G.jpg)\n### Debian\
  \ GNU/Linux\nDebian GNU/Linux（简称 Debian）建立于 1993 年，是一个遵循 GNU 标准的完全免费且基于局域的工作框架。超过\
  \ 1,000 名设计人员自愿地持续投入工作。Debian 的改进背后没有公司，这意味着其中不涉及任何商业利益。\n\n其一个主要目标是为有效传递服务的 PC\
  \ 提供一个稳定且稳固的工作框架。它面向那些明确自己需要的客户，Debian 工程师也维护并使用他们自己的产品。软件包以 `.deb` 格式提供，并根据相应的许可证进行分类：\n\
  \n![](img/image_rsrc28H.jpg)\n- `Main`：自由软件。\n![](img/image_rsrc28J.jpg)\n- `Contrib`：依赖非自由软件的自由软件。\n\
  ![](img/image_rsrc28K.jpg)\n- `Non-free`：具有非自由许可证的软件包。\n\nDebian 在服务器和工作站框架上运行良好。它支持广泛的设计，如\
  \ `ARM EABI (arm)`、`IA-64 (Itanium)`、`MIPS`、`MIPSel`、`powerpc`、`s390`（32 和 64 位），以及\
  \ `sparc`、`i386`（32 位）和 `amd64`（64 位）。每个版本的代号取决于电影《玩具总动员》中的人物名字，例如 Debian GNU/Linux\
  \ 9 的 `Stretch` 和 Debian GNU/Linux 10 的 `Buster`。\n\n![](img/image_rsrc28M.jpg)\n\
  ### Ubuntu\nUbuntu 是一个由 Canonical 公司资助的免费 Linux 发行版。它依赖于 Debian，但更关注新手。这就是为什么它为每个任务只包含一个工具。Ubuntu\
  \ 组以整合需要稳定性的扩展和组件而闻名。这是我们在与新手交流时听到的最大的抱怨之一。对于这类新手，我们不建议业学者使用 Ubuntu。名气并不等同便利。我们的主要建议是\
  \ Debian，Mint 是一个不错的次选方案。\n\n软件包以 `.deb` 格式提供，并根据 Canonical 的支持情况分类：\n\n![](img/image_rsrc28N.jpg)\n\
  - `Main`：由 Canonical 支持的自由软件。\n![](img/image_rsrc28P.jpg)\n- `Restricted`：由 Canonical\
  \ 支持的非自由软件。\n![](img/image_rsrc28R.jpg)\n- `Universe`：不受支持的自由软件。\n![](img/image_rsrc28S.jpg)\n\
  - `Multiverse`：不受支持的非自由软件。\n\nUbuntu 有三个授权版本：Ubuntu Desktop、Ubuntu Server 和 Ubuntu\
  \ Core（用于物联网）。支持多种架构，如 `i386`、`IA-32`、`amd64`、`ARMhf (ARMv7 VFPv3-D16)`、`ARM64`、`powerpc\
  \ (64 bit)` 和 `s390x`。最初于 2004 年发布，每年发布两次：一次在 4 月，一次在 10 月。发布版本通过版本号反映：`18.04` 指\
  \ 2018 年 4 月发布。版本的代号基于一个形容词和一种动物，例如 Ubuntu 14.10 的 `Utopic Unicorn`。\n\n![](img/image_rsrc28T.jpg)\n\
  ### Linux Mint\nLinux Mint 旨在提供一种 Windows 客户会欣赏的更自然的工作体验，同时提供开箱即用的硬件、视觉和音效支持。Mint\
  \ 的 Cinnamon 桌面版本因其与 Windows 环境相似而深受粉丝青睐，甚至支持类似的键盘快捷键。由于其良好的稳定性，我们可以放心地推荐这个发行版。\n\
  \nMint 是一个依赖于 Ubuntu 的非商业发行版，并遵循类似的发布策略。底层发行版可以追溯到 2006 年。从 2014 年开始，在 Ubuntu 发布一个月后，每年发布两次版本。版本的代号是以\
  \ \"a\" 结尾的女性名字，例如版本 6 的 `Felicia`。Linux Mint 支持 `IA-32` 和 `amd64` 两种设计。\n\n![](img/image_rsrc28U.jpg)\n\
  ### Red Hat Enterprise Linux (RHEL)\nRHEL 是一个商业 Linux 发行版。它依赖于 Red Hat Linux（发布于\
  \ 1995 年至 2004 年之间）或更多的 Fedora 19 和 20。其独特版本追溯到 2000 年。它对商业客户的关注包含了长期支持、准备和认证计划（见第\
  \ 1 章）。Red Hat 的社区项目被称为 Fedora（见下文）。\n\n软件包以 `.rpm` 格式（Red Hat 软件包管理器）提供。RHEL 支持\
  \ `arm (64 bit)`、`i386`、`amd64`、`powerpc` 以及 `s390` 和 `zSeries`。该版本针对服务器和工作站。版本的代号给人一种随机的感觉，因为它没有遵循\
  \ Debian 或 Ubuntu 使用的计划。\n\n![](img/image_rsrc28V.jpg)\n### Fedora\nFedora 是一个面向工作站客户的社区\
  \ Linux 发行版。它依赖于 Red Hat Enterprise Linux (RHEL) 并由 Red Hat 支持。它于 2003 年 Red Hat\
  \ Linux 支持结束时发布。从 2020 年开始，它提供以下版本：\n\n![](img/image_rsrc28W.jpg)\n- `Workstation`：用于\
  \ PC。\n![](img/image_rsrc28X.jpg)\n- `Server`：用于服务器。\n![](img/image_rsrc28Y.jpg)\n\
  - `IoT`：用于物联网生态系统。\n\nFedora 支持 `amd64`、`armhf`、`powerpc`、`MIPS`、`s390` 和 `RISCV`\
  \ 模型。该版本的周期较短，另一个版本通常像时钟一样准时跟随。版本的代号没有特定的命名计划，通常由城市名称组成。\n\n![](img/image_rsrc28Z.jpg)\n\
  ### CentOS\nCentOS 源自 Community Enterprise Operating System。与 Fedora 类似，它依赖于 RHEL\
  \ 并在软件包方面保持兼容。这允许在 CentOS 上使用最初基于 RHEL 开发和提供的软件。与 Fedora 不同，它专注于两个工作站和服务器的大企业级用途，并提供长期支持。CentOS\
  \ 的底层版本追溯到 2004 年 5 月。软件包来自三个不同的仓库：\n\n![](img/image_rsrc290.jpg)\n- `Base`：常规、稳定的软件包。\n\
  ![](img/image_rsrc291.jpg)\n- `Updates`：安全、错误修复或增强更新。\n![](img/image_rsrc292.jpg)\n\
  - `Addons`：构建构成主 CentOS 发行版的大软件包所需的包，但上游未提供。\n\nCentOS 适用于 `i386` 和 `amd64` 模型。不支持其他模型。\n\
  \n![](img/image_rsrc293.jpg)\n### openSUSE\nLinux 发行版 openSUSE 的基础是 SUSE Linux 循环和商业版的\
  \ SUSE Linux Professional，后者于 1994 年发布第一个版本。SUSE 的名称是第一家德国所有者 Gesellschaft für Software-und\
  \ Systementwicklung GmbH 的缩写。\n\nOpenSUSE 依赖于 Red Hat Linux 和 Slackware 的构建，并采用\
  \ `.rpm` 作为软件包格式。它适用于 `i586`、`x86-64` 和 `ARM` 设计。openSUSE 项目旨在像时钟一样准时交付另一个版本。与 Fedora\
  \ 类似，版本的代号没有遵循良好的命名方案。\n\n![](img/image_rsrc294.jpg)\n### Arch Linux\nArch Linux\
  \ 是一个免费 Linux 发行版，于 2002 年发布第一个版本。它遵循滚动更新的标准，这使得应用程序每月更新一次。目前，核心小组由约 25 名设计人员组成，并由许多工程师（受信用户）支持。Arch\
  \ Linux 使用 `Pacman` 作为软件包管理框架。软件包存储在四个仓库中：\n\n![](img/image_rsrc295.jpg)\n- `Core`：用于基础系统的软件包。\n\
  \n![](img/image_rsrc296.jpg)\n- `Extra`：额外的软件包，如桌面环境和数据库。\n\n\n\n\n\n![](img/image_rsrc297.jpg)社区：由受信任用户维护的包。![](img/image_rsrc298.jpg)多架构：可以在多种架构上使用的包。Arch\
  \ Linux 坚持 `amd64` 设计。2007 年之前的早期交付版本名称没有遵循特定计划，而随后的交付则遵循持续的编号格式指南。\n\n![](img/image_rsrc299.jpg)Gentoo\n\
  与 Arch Linux 一样，Gentoo 遵循滚动更新的规则。新的稳定版本每周发布一次，主版本于 2002 年发布。Gentoo 的特殊之处在于它是基于源码的分发。在引入产品之前，必须先进行编译。支持的设计包括\
  \ `alpha`、`amd64`、`arm`、`hpp`、`IA-64`、`m68k`、`MIPS`、`powerpc`、`s390`、`sh` 和 `sparc`。![](img/image_rsrc29A.jpg)Slackware\n\
  Slackware 是最古的 Linux 发行版。第一个版本可以追溯到 1992 年。定期发布没有固定的间隔。它针对专业用户并给予他们尽可能的自由。Slackware\
  \ 使用压缩的 `.tar.gz` 存档作为包格式，并支持 `i486`、`alpha`、`sparc` 和 `arm` 四种架构。该发行版也被移植架构 `s390.4`。\n\
  \n# 安装 Linux 系统\n如上一章所述，我们将使用 Debian 进行演示。回顾一下，Debian 是一个提供极佳稳定性的发行版，一旦你的技能和知识超越初级阶段，它的扩展性将非常好。在本章中，我们将安装并配置\
  \ Debian，向你展示过程中的每一个步骤。\n\n## 4.1 安装类型\nDebian 提供了多种进行正确设置的方法。这包括图形界面安装和文本安装；我们将使用前者。对于安装媒体，Debian\
  \ 开发者提供了三种变体：![](img/image_rsrc29B.jpg)适用于 32 位和 64 位的 CD 或 DVD。![](img/image_rsrc29C.jpg)适用于\
  \ 32 位和 64 位的网络镜像（所谓的 `Netinst-ISO`）。![](img/image_rsrc29D.jpg)适用于 32 位或 64 位的迷你\
  \ CD。\n\n我们还提供了测试媒体。这些包括 32 位和 64 位的现场镜像（live images），允许你在将其安装到之前之前尝试 Debian。在编写本指南期间，版本\
  \ 10 是 Debian 的当前稳定发布版本。这里描述的设置基于此版本和 `amd64` 架构。\n\n从 `www.debian.org/distrib`\
  \ 下载网络镜像后，不再需要额外的静态镜像。相反，它取决于你的互联网连接以检索要安装的包并保持操作系统更新。整个过程将花费大约一小时，并允许你根据特定需求拥有精简的软件选择。你不需要的软件包将不会出现在你的系统中。但是，当你觉得需要时，可以随时添加。\n\
  \n我们安装的目标系统是一个面向单用户的基于 XFCE 的桌面系统，带有网络浏览器和音乐播放器。网络浏览器使用 `Mozilla Firefox`，音乐播放器使用\
  \ `VLC`。这两个程序都是 Linux 发行版的永久组件。我们用于演示的环境是基于 `VirtualBox` 的虚拟机，拥有 4 GB 内存和 8 GB 磁盘空间。\n\
  \n## 4.2 逐步安装 Linux\n\n### 引导菜单\n要开始安装 Debian，首先从你下载的 `ISO` 镜像启动计算机（在我们案例中为 `VirtualBox`\
  \ 镜像）。如果你也使用虚拟机，请查看你的虚拟机供应商网站以获取如何启用 `ISO` 镜像。接下来，等待引导菜单出现在屏幕上。下面的图片显示了提供的不同选项。使用光标键导航引导菜单，按\
  \ `Enter` 键选择项目。![](img/image_rsrc29E.jpg)不同的选项有：\n\n![](img/image_rsrc29F.jpg)图形化安装：使用图形化安装程序启动安装过程。![](img/image_rsrc29G.jpg)安装：使用基于文本的安装程序启动安装过程。![](img/image_rsrc29H.jpg)高级选项：选择更多选项，如专家模式、自动安装或救援模式（详细信息请见下图）。![](img/image_rsrc29J.jpg)可访问的高对比度安装程序菜单：切换到高对比度的黑白主题。![](img/image_rsrc29K.jpg)帮助：获取更多帮助。![](img/image_rsrc29M.jpg)带语音合成的安装：带有语音支持启动安装过程。![](img/image_rsrc29N.jpg)从主引导菜单选择“图形化安装”项目，按\
  \ `Enter` 键继续。\n\n### 语言选择\n接下来，选择你希望在整个安装过程中使用的语言。对话框和消息将相应地翻译。此选择不会不可逆地决定你的 Linux\
  \ 系统将使用的语言，你以后可以可以选择不同的语言。\n\n\n\n\n\n下图显示了对话框。英语已预先选择，因此只需点击对话框右下角的“继续”（Continue）按钮即可继续。\n\
  ![](img/image_rsrc29P.jpg)\n\n## 位置选择\n第三，对您的位置进行选择（见下图）。根据您之前设置的语言，列出的国家主要是使用该语言的国家。这也会影响如计算机时区等本地化设置。如果需要不同的设置，请选择列表末尾名为\
  \ `other` 的选项并从那里开始。完成后，点击“继续”（Continue）按钮进入第四步。\n![](img/image_rsrc29R.jpg)\n\n\
  ## 键盘选择\n第四，从列表中选择您的键盘布局（见下图）。对于美国，预选方案是美式英语。如果您使用不同的键盘布局，请从列表中选择正确的选项。完成后，点击“继续”（Continue）按钮进入第五步。\n\
  ![](img/image_rsrc29S.jpg)\n\n## 网络设置\n第五步包括从 ISO 镜像加载安装组件，并检测网络硬件以加载正确的网络驱动程序。然后，安装程序将尝试连接互联网，通过本地网络服务器通过\
  \ `DHCP` 获取 IP 地址。\n\n完成后，您可以设置计算机的主机名（见下文）。为机器选择一个唯一的名称，该名称由单个名称组成且在您的本地网段中不存在。使用水果、地点、乐器、作曲家和电影人物的名字是很常见的。在这种情况下，我们选择了名称\
  \ `debian106`，它简单代表 Linux 发行版及其版本号。\n![](img/image_rsrc29T.jpg)\n\n完成后，点击“继续”（Continue）按钮进入第六步以添加如\
  \ `yourcompany.com` 的域名。在这种情况下，不需要提供域名，因此我们留输入字段为空。点击右下角的“继续”（Continue）按钮继续安装。\n\
  ![](img/image_rsrc29U.jpg)\n\n## 用户与角色\n我们的 Linux 系统至少需要两个用户才能正常运行。一个是固定名为 `Root`\
  \ 的管理员用户，另一个是普通用户，在此情况下我们将其命名为 `User`。\n\n在接下来的两个步骤中，您将为 root 用户设置密码，并设置普通用户的全名和用户名。为了简单起见，我们使用\
  \ `Debian User` 作为全名，使用 `User` 作为用户名。对于这两个用户，请选择不同的且您能记住的密码。稍后您需要这些密码来登录计算机。\n![](img/image_rsrc29V.jpg)\n\
  \n## 时区\n设置正确的时区对于与其他服务（尤其是网络）的通信至关重要。请从下所示列表中选择值。列表中的条目基于您之前选择的位置。完成后，点击“继续”（Continue）按钮定义存储媒体及相应的分区。\n\
  ![](img/image_rsrc29W.jpg)\n\n## 存储媒体与分区\nLinux 系统可以分布在多个不同的存储媒体上，如硬盘和闪存驱动器。此外，存储媒体可以划分为多个磁盘分区。为此，安装程序提供了以下方法：\n\
  ![](img/image_rsrc29X.jpg)\n\n- **引导 - 使用整个磁盘 (Guided - use entire disk)**：按照提供的步骤操作，并使用整个磁盘空间进行\
  \ Linux 安装。这将创建固定大小的分区。\n![](img/image_rsrc29Y.jpg)\n- **引导 - 使用整个磁盘并设置 LVM (Guided\
  \ - use entire disk and set up LVM)**：按照提供的步骤操作，并使用整个磁盘空间进行 Linux 安装。此选项利用逻辑卷管理\
  \ (LVM) 创建以后可以更改大小的分区。\n![](img/image_rsrc29Z.jpg)\n- **引导 - 使用整个磁盘并设置加密 LVM (Guided\
  \ - use entire disk and set up encrypted LVM)**：按照提供的步骤操作，并使用整个磁盘空间进行 Linux 安装。此选项利用逻辑卷管理\
  \ (LVM) 创建以后可以更改大小的加密分区。\n![](img/image_rsrc2A0.jpg)\n- **手动 (Manual)**：单独创建分区。这是专家模式，需要对分区和文件系统参数有更深的知识。\n\
  ![](img/image_rsrc2A1.jpg)\n\n从列表中选择 `Guided - use entire disk`（引导 - 使用整个磁盘）。分区的大小根据经验选择并以算法实现。不需要手动计算。点击右下角的“继续”（Continue）按钮继续安装。\n\
  \n接下来，选择要分区的磁盘。在我们的案例中只有一个可用磁盘（见下图）。在本指南的后后部分，第一块 SCSI 磁盘将被称为 `/dev/sda`。\n![](img/image_rsrc2A2.jpg)\n\
  \n磁盘分区是指存储媒体上单独组织的区域，旨在包含 Linux 文件系统树的一个分支。没有通用的方法来正确进行这种分离。本指南展示了一个适用于基础系统的简单且安全的解决方案。对话框中的菜单提供以下选项：\n\
  ![](img/image_rsrc2A3.jpg)\n\n- **所有文件在一个分区 (All files in one partition)**：仅使用单个分区存放程序和用户数据。\n\
  ![](img/image_rsrc2A4.jpg)\n- **独立 /home 分区 (Separate /home partition)**：将程序和用户数据存储在独立的分区中。\n\
  \n\n\n\n\n![](img/image_rsrc2A5.jpg)\n### 分离 `/home`,`/var` 和 `/tmp` 分区\n\n将用户数据、变量数据和临时数据放在单独的分区（某些发行版可用）。如下图所示，选择第二个选项\
  \ `Separate /home` 分区。点击 `Continue`（继续）按钮继续安装。\n\n![](img/image_rsrc2A6.jpg)\n\n\
  下一步是确认分区方案。这是根据经验自动计算的，包含以下分区：\n![](img/image_rsrc2A7.jpg)\n\n- `sda1`:第一个 SCSI\
  \ 磁盘的第一个分区是主分区，大小为 2.8 GB，使用 `ext4` 文件系统格式化，称为文件系统树的根部分（用 `/` 表示）。\n![](img/image_rsrc2A8.jpg)\n\
  - `sda5`:第一个 SCSI 磁盘的第五个分区是逻辑分区，大小为 2.1 GB，格式化为交换分区（swap）文件系统。\n![](img/image_rsrc2A9.jpg)\n\
  - `sda6`:第一个 SCSI 磁盘的第六个分区是逻辑分区，大小为 3.6 GB，使用 `ext4` 文件系统格式化，并用于存储用户数据，称为家目录（用 `/home`\
  \ 表示）。\n\n由于历史原因，硬盘只能包含四个主分区。如果将第四个分区划分为所谓的逻辑分区或逻辑驱动器，则称为 `Extended Partition`（扩展分区）。在我们情况下，逻辑分区\
  \ `/dev/sda5` 和 `/dev/sda6` 存储在主分区 `/dev/sda4` 上。分区 `/dev/sda2` 和 `/dev/sda3` 未未使用。\n\
  ![](img/image_rsrc2AA.jpg)\n\n从上述列表中，选择 `Finish partitioning and write changes to\
  \ disk`（完成分区并将更改写入磁盘）。点击点击右下角的 `Continue` 按钮继续并确认分区方案（见图）。从列表中选择 `yes` 并点击 `Continue`\
  \ 按钮进行分区。请注意，所选存储设备上的所有数据将丢失，磁盘将为空。\n![](img/image_rsrc2AB.jpg)\n\n将存储媒体划分为单个分区后，分区将按照之前定义的文件系统进行格式化。在我们情况下，分区\
  \ `/dev/sda1` 和 `/dev/sda6` 将获得 `ext4` 文件系统，分区 `/dev/sda5` 将获得交换分区文件系统。一旦完成此步骤，接下来将安装\
  \ Debian 的基础系统。\n\n### 软件包管理\n\nISO 镜像包含了安装程序和用于设置 Linux 基础系统的几个软件包。例如，这包含了下方正在安装的\
  \ Linux 内核。\n![](img/image_rsrc2AC.jpg)\n\n接下来，你需要决定是否使用额外的安装媒体。在我们情况下，我们只有一个安装磁盘，因此可以从从菜单中选择\
  \ `No`（见下文）。然后点击 `Continue` 按钮继续。\n![](img/image_rsrc2AD.jpg)\n\n如前所述，Debian 软件是以包的形式组织的。这些软件包由多个软件存储库提供。存储库通过由大学、个人、公司和其他组织维护的软件包镜像提供。这些镜像位于不同的国家。\n\
  \n在下一步中，你必须决定从哪个国家获取你的 Debian 软件包。建议选择地理位置靠近你所在的镜像，以尽量减少通过网络从镜像传输数据到你计算机的时间。作为第一步，选择你所在的国家。\n\
  ![](img/image_rsrc2AE.jpg)\n\n作为第二步，从列表中选择一个首选镜像（见下文）。列表包含了大学、互联网提供商、政府服务和其他组织。\n\
  ![](img/image_rsrc2AF.jpg)\n\n如果你的计算机网络包含用于与外部通信的代理服务器，请在此输入相应信息。在我们情况下，我们没有该服务器，因此留空字段。点击\
  \ `Continue` 按钮继续。\n![](img/image_rsrc2AG.jpg)\n\n一旦设置了这些参数，Debian 安装程序将连接到之前选择的软件包镜像并从中检索软件包列表。软件包列表包含可用软件包，包括名称、大小和描述。取决于你网络连接的质量和带宽，此步骤可能需要一段时间。\n\
  ![](img/image_rsrc2AH.jpg)\n\n接下来，你会被要求参加 `Popcon`（ Debian 软件包受欢迎投票）。此信息是可选的，仅供负责\
  \ Debian 软件包的开发团队使用。根据 `Popcon`，他们可以确定哪些 Debian 软件包安装频率最高。该信息对安装镜像的准备以及在不同架构下保留或舍弃哪些软件包有直接影响。在我们情况下，我们不参与\
  \ `Popcon`，并将选择设置为 `No`。点击 `Continue` 继续选择软件任务 (`tasksel`）。\n\n![](img/image_rsrc2AJ.jpg)\n\
  \n### 软件选择\n\nDebian 提供了精心安排的软件包选择，称为任务（tasks）。其背后的思想是将用于特定用途的软件包分组以简化安装。从对话框列表（见下文）中，你可以不同的不同的桌面环境以及\
  \ Web 服务器、打印服务器、SSH 服务器和标准系统实用程序。为了实现精简安装，请仅启用列表中的最后两项。稍后我们将安装 `XFCE` 桌面环境。\n![](img/image_rsrc2AK.jpg)\n\
  \n确认软件选择后，Debian 安装程序将从软件包镜像检索所需的软件包、解压并安装它们。下方的条显示了进度。在我们情况下，必须下载 140 个软件包。\n![](img/image_rsrc2AM.jpg)\n\
  \n### 设置 GRUB\n\n为了启动新安装的 Debian 系统，我们还必须设置启动信息。这个过程被称为启动系统。处理此步骤的软件组件称为全局统一引导加载程序（准确说是\
  \ `GRUB` 或 `GNU GRUB`）。`Yes` 选项已预先选中，因此我们可以点击 `Continue` 继续。\n![](img/image_rsrc2AN.jpg)\n\
  \nDebian 安装程序需要知道将 `GRUB` 安装在哪里。下方图像中的菜单列出了需要考虑的存储媒体。在我们情况下，我们选择列表中的第二个项目 (`/dev/sda`）。然后点击\
  \ `Continue` 继续。\n![](img/image_rsrc2AP.jpg)\n\n现在我们几乎完成了基础安装，剩下的唯一工作就是阅读一个对话框。\n\
  \n### 完成安装\n\n以下对话框告知你安装已完成。点击 `Continue` 重启新安装的系统。\n![](img/image_rsrc2AR.jpg)\n\
  \n几秒钟，屏幕上将出现文本的 `GRUB` 启动菜单（见下提取）。启动菜单包含两个选项：`Debian GNU/Linux` 和 `Advanced options\
  \ for Debian GNU/Linux`。第一个菜单项被高亮并预选。第二个菜单项允许你设置特定的启动选项。要查看这些选项的完整列表，请查看 `www.gnu.org/software/grub/manual/grub`get\
  \ `GNU GRUB` 手册。保持第一个菜单项选中并按 `Enter` 继续并启动新系统。\n\n```\n* Debian GNU/Linux\n* Advanced\
  \ options for Debian GNU/Linux\n```\n\n你的 Debian 系统将启动并初始化必要的系统服务。此步骤将需要几秒完成。最后，在名为\
  \ `tty1` 的第一个文本终端上将看到一个黑白屏幕，并要求你登录系统。登录提示由两个部分组成：你的 Linux 系统的主机名 (`debian106`) 跟着一个空格和单词\
  \ login。\n\n```\nDebian GNU/Linux 10 debian106 tty1\n```\n\n\n\n\n\n# debian106\
  \ 登录\n\n_ 登录系统后，你将能够添加更多软件，以使用基于 XFCE 桌面的图形用户界面。在安装过程的这一步，只有以管理员 root 用户身份登录才能添加更多软件。要这样做，请在登录提示处输入\
  \ `root`，按 `Enter` ，等待 `Password:` 文本出现，然后输入你之前定义的 root 用户密码。Linux 系统将用一条登录消息欢迎你（见下文）。登录消息将显示当前运行的\
  \ Linux 内核版本以及使用建议。\n\n```\nDebian GNU/Linux 10 debian106 tty1\ndebian106 login:\
  \ root\nPassword:\nLinux debian106 4.19.0-11-amd64 #1 SMP Debian 4.19.146-1 (2020-09-17)\
  \ x86_64\nDebian GNU/Linux 系统包含的程序是自由软件；每个程序的具体分发条款在 /usr/share/doc/*/copyright\
  \ 中的单独文件中说明。Debian GNU/Linux 在适用法律允许范围内不提供任何担保。\n```\n\n在欢迎消息之后，Debian 会打开一个命令行提示符：\n\
  \n```\nroot@debian106 ~#\n```\n\n此命令行提示符由四个部分组成：![](img/image_rsrc2AS.jpg) `root`：登录用户的名称。![](img/image_rsrc2AT.jpg)\
  \ `debian106`:Linux 系统的主机名。![](img/image_rsrc2AU.jpg) `~`：当前目录。在这种情况下，它是当前登录用户的家目录。如果没有其他设置，对于普通用户定义为\
  \ `/home/username`，对于管理员用户定义为 `/root`。`~` 只是此的缩写。![](img/image_rsrc2AV.jpg) `#`:登录符号。`#`\
  \ 符号代表 root 用户，而 `$` 用于没有管理员权限的普通用户。今后在使用各种命令时你会看到这个符号。\n\n**重要**：你现在是以管理员 root\
  \ 用户身份登录的。请小心输入你输入的命令，并在疑问时双重检查。任何错误都可能导致你必须修复 Linux 系统。\n\n## 4.3 添加图形用户界面\n\n\
  在当前阶段，Debian 系统已完全激活并可以按样使用。对于适合普通用户的桌面系统，它仍然缺少一个漂亮且易于使用的图形用户界面，使其看起来和感觉与你习惯的 Windows\
  \ 或 macOS 系统更加熟悉。在这一步中，我们将改变这一点并安装 XFCE 桌面管理器。为此，我们将安装以下软件包：\n\n![](img/image_rsrc2AW.jpg)\
  \ `aptitude` 软件包管理器。![](img/image_rsrc2AX.jpg) `xdm` 显示管理器。![](img/image_rsrc2AY.jpg)\
  \ `xfce4` 桌面环境。\n\nDebian 使用 `apt` 软件包管理器来处理软件包的安装、更新和删除以及相关的包列表。此外，`apt` 会解析所有的软件包依赖，并确保系统上有相关的软件。在我们案例中，必须从软件包镜像检索并安装约\
  \ 170 MB 的数据。如之前所示，这需要可用的互联网连接来下载所需的软件包。\n\n要安装这三个软件包，请在命令行提示符处输入以下命令。只需在 `#` 符号后输入命令即可：\n\
  \n```\nroot@debian106 ~# apt-get install aptitude xdm xfce4\n```\n\n`apt` 将显示有关要安装软件包的更多信息。这包括依赖包列表和推荐软件包。最后，你将看到命令行提示符。输入\
  \ `Y` 或按 `Enter` 来安装 `aptitude`、`xdm` 和 `xfce4` 以及依赖包。对于 `xdm` 显示管理器，必须确认两个对话框。在两个框上都按\
  \ `Enter` 以确认使用 `xdm`。\n\n检索要安装的软件包需要一段时间。完成后，命令行提示符将再次出现。要激活有关图形桌面环境的更改，请重启系统。在命令行提示符处如下输入\
  \ `reboot` 命令：\n\n```\nroot@debian106 ~# reboot\n```\n\n重启 Linux 系统后，Debian 用图形启动界面欢迎我们（见下文）。按\
  \ `Enter` 以默认设置启动 Linux 系统。![](img/image_rsrc2AZ.jpg) 几秒后将看到图形登录界面。使用之前创建的名为 `user`\
  \ 的普通用户登录系统。输入 `user`，按 `Enter` 并输入该用户的密码。然后再次按 `Enter` 确认并登录。\n\n接下来，将看到 XFCE 桌面（见下文）。桌面带有几个默认元素：顶部导航栏、底部导航栏和桌面图标。这些元素在下文有详细解释。![](img/image_rsrc2B0.jpg)![](img/image_rsrc2B1.jpg)\n\
  \n**顶部导航栏**：显示访问不同应用程序、四个虚拟桌面屏幕、时钟以及各种用户操作按钮，如锁定屏幕、切换用户、切换到待机模式和退出当前会话。![](img/image_rsrc2B2.jpg)\
  \ **底部导航栏**：此栏包含多个按钮，用于隐藏所有打开的窗口并显示空桌面、打开终端、文件管理器、浏览器、查找应用程序以及直接打开文件管理器。![](img/image_rsrc2B3.jpg)\
  \ **桌面图标**：从上到有垃圾桶、链接到计算机的文件管理器图标和家目录。在桌面上右键点击可以打开访问各种应用程序的上下文菜单。![](img/image_rsrc2B4.jpg)\n\
  \n## 4.4 添加额外的软件包\n\n到目前为止，你的 Linux 系统可用的软件相当有限。下一步要做的是使用这四个 Debian 软件包添加一些功能：![](img/image_rsrc2B5.jpg)\
  \ `firefox-esr`：Mozilla Firefox 浏览器（扩展支持版）。![](img/image_rsrc2B6.jpg) `gnome-terminal`：由\
  \ GNOME 项目维护的终端模拟器。![](img/image_rsrc2B7.jpg) `xscreensaver`：X11 系统的基础屏保。![](img/image_rsrc2B8.jpg)\
  \ `vlc`：Video Lan Client (VLC) 视频播放器。\n\n将在终端模拟器的命令行安装三个软件包（将在指南稍后部分详细介绍终端）。目前你的系统中安装了\
  \ X11 终端模拟器 `xterm`。要打开 `xterm`，点击底部导航栏中的终端按钮，或从上下文菜单选择 Application > System > Xterm。第一步打开\
  \ `xterm`。接下来，在命令行提示符旁输入命令 `su` 并按 `Enter`：\n\n```\nuser@debian106: ~$ su\n```\n\
  \n`Password:` 你可能记得之前的步骤，只有管理员用户才能 Debian 系统上安装、更新或删除软件。`su` 命令是 switch user 的缩写，用于更改你的当前角色。如果不带额外名称，角色将变为管理员\
  \ root 用户。在密码提示处输入管理员用户的密码并按 `Enter`。\n\n作为管理员用户，按照如下方式安装软件包：`firefox-esr`、`gnome-terminal`、`xscreensaver`\
  \ 和 `vlc`：\n\n```\nroot@debian106: ~# apt-get install firefox-esr gnome-terminal\
  \ xscreensaver vlc\n```\n\n输出所示：![](img/image_rsrc2B9.jpg) 安装这四个软件包后，你可以切换回普通用户角色。按\
  \ `Ctrl+D` 退出管理员部分，再次按 `Ctrl+D` 关闭 `xterm`。\n\n安装 Firefox 有以下效果：![](img/image_rsrc2BA.jpg)\
  \ 应用程序菜单中可以使用新软件 `Firefox`。![](img/image_rsrc2BB.jpg) 命令行可以使用新命令 `firefox`。![](img/image_rsrc2BC.jpg)\
  \ 底部导航栏的地球图标链接到 Firefox 浏览器。![](img/image_rsrc2BD.jpg) 安装 GNOME terminal 软件包有以下效果：![](img/image_rsrc2BE.jpg)\
  \ 命令行和应用程序菜单均可以使用新软件 `gnome-terminal`。![](img/image_rsrc2BF.jpg) 底部导航栏的终端图标链接到 GNOME\
  \ terminal。\n\n\n\n\n\n![](img/image_rsrc2BG.jpg)右键菜单中的 `Open Terminal Here` 项指向\
  \ GNOME 终端。要查看更改，请从右键菜单中选择 `Open Terminal Here`。下面的图片显示了终端窗口。它具有白色背景和更大的字体，更容易阅读。![](img/image_rsrc2BH.jpg)\n\
  \n## 4.5 退出 Linux\n\n为了正确使用 Linux，你还需要学习如何退出 Linux 以及重启系统。在下面，你将学习如何退出 XFCE 桌面环境、关闭\
  \ Linux 系统以及重启系统。我们将介绍两种方法：第一种基于图形界面，第二种用于服务器和无线路由器等非图形化系统。\n\n## 退出 XFCE 桌面环境\n\
  \n退出 XFCE 桌面并退出当前会话简单的方法是点击导航栏右上角的按钮。该按钮标记有你的用户名，在我们的例子中是 Debian。从弹出菜单中选择最后一个标记为\
  \ Log Out（注销）的选项。或者，你可以选择左上角按钮中的 Log Out 选项。![](img/image_rsrc2BJ.jpg)会打开第二个窗口，其中包含\
  \ Log Out（注销）、Restart（重启）、Shutdown（关机）和 Hibernate（休眠）按钮。点击 Log Out 退出会话。随后，你将返回登录界面。\n\
  \n## 关闭 Linux 系统\n\n关闭整个 Linux 系统的方法与退出 XFCE 类似。点击导航栏右上角的按钮并选择 Shut Down（关机）。在接下来的对话框中点击\
  \ Shut Down 按钮停止 Linux 系统。在终端会话中，你可以以管理员身份运行 `halt` 或 `shutdown -h` 命令。普通用户不允许执行这些命令：`halt`\n\
  \n## 重启 Linux 系统\n\n要重启 Linux 系统，点击导航栏右上角的按钮并选择 Restart（重启）项。在接下来的对话框中，点击 Restart\
  \ 按钮重启 Linux 系统。在终端会话中，你可以以管理员身份运行 `reboot` 或 `shutdown -r` 命令。同样，普通用户不允许执行这些命令：`reboot`。随后，系统将重启，你也会返回启动界面。![](img/image_rsrc2BK.jpg)\n\
  \n# 5 Linux 导航\n\nUNIX/Linux 系统上的文件系统包含不同类型的条目。包括普通文件、目录（或文件夹）、符号链接、块设备和字符设备、命名管道和套接字（sockets）。本章将涉及目录及相应的工具。\n\
  \n## 5.1 文件系统标准 (FHS)\n\n现代 Linux 系统具有相当一致的目录结构，该结构基于文件系统标准 (FHS)。此定义规定了哪些主目录以及其中存储了哪些内容。FHS\
  \ 由 Linux 基金会维护。FHS 的最新版本是 3.0，于 2015 年发布。第 3 章提到的 Linux 发行版遵循 FHS 结构。以下是常用的目录：\n\
  \n| 目录 |  |\n| :--- | :--- |\n| `/` | 整个文件系统的主层次结构和根目录 |\n| `/bin` | 所有用户的基本命令二进制文件\
  \ |\n| `/boot` | 引导加载 |\n| `/etc` | 特定主机的系统级配置文件 |\n| `/home` | 用户的家目录 |\n| `/lib`\
  \ | `/bin` 和 `/sbin` 中二进制文件必需的库 |\n| `/media` | 可移动介质的挂载点 |\n| `/proc` | 进程，是 Linux\
  \ 内核的虚拟文件系统 |\n| `/root` | root 用户的家目录 |\n| `/sbin` | 关键系统二进制文件 |\n| `/tmp` | 临时数据和文件\
  \ |\n| `/usr` | 系统资源，包含用户程序和应用程序 |\n| `/var` | 可变数据，如日志文件和数据库文件 |\n\n某些 Linux 发行版拥有额外的目录如\
  \ `/opt` 或使用符号链接。Linux 还有一些常用的缩写，这对你的日常工作非常有帮助：\n\n| 缩写 | 描述 |\n| :--- | :--- |\n\
  | `$HOME` | 包含用户家目录的本地变量 |\n| `~` | 指向用户家目录，例如 `/home/tom` |\n| `.` | 指向当前目录 |\n\
  | `..` | 指向父目录 |\n\n你可以在终端命令行和脚本中使用这些缩写来缩短命令。接下来，我们将查看其中一些命令。\n\n## 5.2 目录命令\n\n\
  与文件一样，Linux 提供了一系列命令来列出、创建、删除和重命名目录。你可以在终端中使用这些命令。\n\n### 列目录\n\n要列出目录，请使用 `ls`\
  \ 命令配合开关 `-d`（`--directory` 的缩写），如下所示：\n\n```bash\nls -d */\nfinances/\nprojects/\n\
  work/\n...\n```\n此示例列出了当前目录下的目录名称。输出中的点号（`...`）表示列表更长，此处进行了缩短。\n\n使用 `ls` 命令的两种常用方式：不带任何选项，以及带有选项\
  \ `-la`（`-l -a` 的缩写，意为详细显示所有）。第一个输出仅显示普通文件的条目名称，而第二个输出则列出普通文件和隐藏条目。\n\n```bash\n\
  ls -la\n```\n\n要列出包括以点（`.`）开头的隐藏目录在内的所有目录，请如下使用 `find` 命令：\n\n```bash\nfind . -maxdepth\
  \ 1 -type d\n./projects\n./.mozilla\n./.ipython\n./.dbus\n./video\n...\n```\n\n\
  `tree` 命令递归搜索目录并非常漂亮地输出整个目录结构。开关 `-d` 将输出限制为目录，显示如下：\n\n```bash\ntree -d\n.\n|––––\
  \ archive\n| |–––– ballet-zebola\n| | |–––– documents\n| | |–––– invoices\n| | |––––\
  \ charles-darwin-university\n| |–––– projects\n|–––– .dbus\n|–––– .ipython\n|––––\
  \ .mozilla\n...\n```\n\n### 创建目录\n\n要创建目录，请使用 `mkdir` 命令（make directory）。下一个示例在当前目录下创建一个名为\
  \ `training` 的新条目：\n\n```bash\nmkdir training\n```\n\n开关 `-v`（`--verbose` 的缩写）会打印一条确认命令执行成功的额外信息。\n\
  \n```bash\nmkdir -v training\nmkdir: directory \"training\" created\n```\n\n开关 `-p`（`--parents`\
  \ 的缩写）允许你创建整个子目录结构。尚的父目录也会被创建。以下示例创建了目录 `training` 及其子目录 `linux`（第 1 层）和 `lpic1`（第\
  \ 2 层）。\n\n```bash\nmkdir -p training/linux/lpic1\n```\n\n要在同一级创建两个子目录，请利用底层命令行解释器的功能。Bash\
  \ 使用大括号 `{ }` 中的值来实现这一点。下一个示例展示了你如何一次性创建 `training/linux/lpic1` 和 `training/linux/lpic2`\
  \ 两个目录：\n\n```bash\nmkdir -p training/linux/{lpic1,lpic2}\n```\n\n### 删除目录\n\n删除目录使用\
  \ `rmdir` 命令（remove directory）。下一个示例删除了当前目录中名为 `training` 的条目：\n\n```bash\nrmdir\
  \ training\n```\n\n与 `mkdir` 一样，开关 `-v`（`--verbose` 的缩写）会打印一条命令执行成功的额外信息。\n\n```bash\n\
  rmdir -v training\nmkdir: directory is removed, \"training\"\n```\n\n只要目录是空的，这种方法就有效。如果你的目录包含任何文件或子目录等条目，`rmdir`\
  \ 命令在使用此信息时会报错并保持目录不变：\n\n```bash\nrmdir training\nrmdir: failed to remove 'training':\
  \ Directory not empty\n```\n\n为了解决这种情况，`rm` 命令（remove）配合开关 `-r`（`--recursive` 的缩写）变得非常实用。此时，`rm`\
  \ 会递归删除所有条目。以下示例结合了开关 `-r` 和 `-v` 来删除一个文件和三个目录。\n\n```bash\nrm -rv training/\n\"\
  training/lpic1/introduction.txt\" was removed\nDirectory was removed: \"training/lpic1\"\
  \nDirectory was removed: \"training/lpic2\"\nDirectory was removed: \"training/\"\
  \n```\n\n\n\n\n在删除文件和目录时为了安全起见，请结合使用 `-i`（对应 `--interactive`交互）和 `-v`（对应 `--verbose`详细）。在删除文件之前，`rm`\
  \ 将请求你的显式确认并打印状态消息。\n\n### 切换目录\n\n`cd`（更改目录）命令允许你在系统中移动。若要向上移动一级到根目录，请使用此命令：\n\n\
  ```\ncd ..\n```\n\n若向下移动到子目录，请输入 `cd` 命令后跟目录名称。命令 `cd /home/user/test` 将直接带你进入 `/home/user/test`\
  \ 目录。正如之前解释的那样，有一些快捷方式可用。命令 `cd ~`（波浪号）和 `cd $HOME` 始终将你带回到主目录，而 `cd /` 则将带你进入 `/`\
  \ 目录。\n\n**提示：** 由于 Linux 是区分大小写的，因此 `cd` 与 `CD` 相同。在使用大写和小写字母时请小心。\n\n### 重命名目录\n\
  \n`mv` 命令是 move（移动）的缩写，用于移动和重命名文件及目录。它需要两个名称：原始文件的名称及其新名称。若要将目录名称从 `lpic1` 改为 `lpic-1`，请输入以下：\n\
  \n```\nmv lpic1 lpic-1\n```\n\n原始文件将被移除，新条目将接收时间戳。使用选项 `-i`（或 `--interactive`）可以防止覆盖现有文件。\n\
  \n## 5.3 基于终端的文件管理器\n\n在命令行中导航 Linux 并不是最理想的情况。基于终端和图形化的文件管理器是极好的替代方案。基于终端的文件管理器运行在终端内部，不会在桌面上打开单独窗口。有很多程序可用，因此我们只向你介绍我们最喜爱的几款。\n\
  \n#### GNU Midnight Commander (mc)\nwww.midnight-commander.org\n这是一个免费的、全屏的、文本模式可视化文件管理器，允许你搜索、复制、移动以及删除单个或多个文件，甚至是整个目录树。`mc`\
  \ 集成了查看器和编辑器。\n![](img/image_rsrc2BM.jpg)\n\n#### Vi 文件管理器 (vifm)\nhttps://vifm.info\n\
  与 `mc` 类似，Vi 文件管理器 (`vifm`) 带有基于 curses 界面的两个导航窗口。它为管理文件和目录提供了类似 Vi(m)的环境。如果你熟悉\
  \ Vi 的按键绑定，那么这就是适合你的文件管理器。\n![](img/image_rsrc2BN.jpg)\n\n### 5.4 图形化文件管理器\n\n与基于终端的文件管理器类似，图形化文件管理器协助在\
  \ Linux 中导航。这些文件管理器会在单独窗口中打开，但提供了更好的用户体验。同样，有很多程序可用，我们只在下方列出我们的喜好。\n\n#### Konqueror\n\
  https://packages.debian.org/stretch/konqueror\nKonqueror 是 KDE 桌面环境强大的文件管理器。Konqueror\
  \ 提供了简单的文件管理功能，如复制、移动、搜索和删除文件及目录，以及一些高级功能，如访问压缩包、浏览和刻录音频 CD，以及对 FTP、SFTP 服务器和 SAMBA（Windows）共享的支持。\n\
  \n#### Nautilus\nhttps://wiki.gnome.org/Apps/Nautilus\nNautilus 是 GNOME 桌面上的文件管理器。它提供了对\
  \ Linux 系统文件的便捷导航和管理。这包括简单的文件管理功能，如复制、移动、搜索和删除文件及目录，以及轻松访问本地和远程文件。\n\n#### Dolphin\n\
  www.kde.org/applications/system/dolphin/\nDolphin 是作为 KDE 应用程序包的一部分开发的轻量级文件管理器。为简单、灵活和完全自定义而设计，允许用户非常轻松地在\
  \ Linux 系统中浏览、定位、打开、复制和移动文件。\n\n#### Thunar\nhttps://docs.xfce.org/xfce/thunar/start\n\
  Thunar 是用于 XFCE 桌面的现代轻量级文件管理器。它的设计旨在快速、响应且易于使用。我们在这里列出它是因为它具有简洁直观的界面并提供了重要的用户选项。\n\
  \n# 6 终端与 Shell 简介\n\n使用 Linux 操作系统需要你了解终端（terminal）和命令行（command line）。了解它们是什么并稍微熟悉它们的用法以及可用命令至关重要。但不要担心，我们将详细描述每一个项。这些术语听起来比实际要吓人得多。\n\
  \n以文本格式与系统通信的能力是程序员对 Linux 产生青睐的原因之一，因为这是程序员向计算机发出指令的标准方式。另一个原因是这种方式允许对系统进行绝对控制，而其他操作系统即使有它们自己的命令行解释器也无法提供这种控制。\n\
  \n一些初学者甚至报告说，使用并熟悉以这种文本格式发布命令使得向程序开发的过渡变得更加容易和快捷。\n\n## 6.1 什么是终端？\n\n终端被描述为“一个在其他显示架构中模拟视频终端的程序。尽管它通常与\
  \ shell 或文本终端同义，但‘终端’一词涵盖了所有远程终端，包括图形界面。图形用户界面内部的终端模拟器通常被称为终端窗口”。\n\n准确来说，终端仅仅是外层软件。在终端内部运行着一个被称为\
  \ `shell` 的命令行解释器。终端是你通过 GUI 与 `shell` 交互的方式。\n\nDebian 支持很很长的终端软件列表。这包括 `Aterm`，以及\
  \ `GNOME terminal`、`Kterm`、`Mate Terminal`、`Rxvt`、`Xterm` 和 `Xvt`。这些不同的终端软件实现在稳定性、对字符集的支持、设计、颜色和字体，以及应用背景图像或处理透明度的方面有所不同。\n\
  \n在书中，我们将使用 `GNOME terminal`，因为它稳定、简单且易于调整。要增大或减少终端窗口内显示内容的大小，请使用组合键 `CTRL+` 和 `CTRL-`。\n\
  \n## 6.2 什么是 Shell？\n\n简单来说，`shell` 是一个复杂的命令行解释器。`shell` 读取你的命令，在某些条件下对其进行修改，然后执行结果。\n\
  \n在从命令行读取和执行实际结果之间，`shell` 必须解释你输入中的特殊字符。下表显示了可用的特殊字符：\n\n| 字符 | 含义 |\n| :--- |\
  \ :--- |\n| `$name` | 变量替换 |\n| `name=` | 变量赋值 |\n| `'command'` | 引用\n| `$( command\
  \ )` | 命令替换 |\n| `< > >>` | 输入和输出重定向 |\n| `2> 2>>` | 输入和输出重定向 |\n| `\\|` | 命令管道\
  \ |\n| `* [ ] ?` | 通名创建（通配符匹配） |\n| `;` | 命令分隔 |\n| `&` | 在后台运行命令 |\n| `\\|\\| &&`\
  \ | 在特定条件下运行命令 |\n| `{ } ( )` | 分组命令 |\n\n出于好奇，shellid 通过以下过程将命令行分为单个单词以确定命令：\n\n\
  | 步骤 |  | 特殊字符 |\n| :--- | :--- | :--- |\n| 1 | 读取直到命令分隔符 | `\\n`, `&`, `\\|`, `\\\
  |\\|`, `&&`, `;`, `$(...)`, `\\\"...\"`, `'...'` 和 标记（命令替换） |\n| 2 | 标记（输入/输出重定向，值赋值）\
  \ | `$name`，见步骤 1 和 2 的标记 |\n| 3 | 分为单个单词 | `$name`，见步骤 1 和 2 的标记 |\n| 4 | 变量替换\
  \ | `$name`，见步骤 1 和 2 的标记 |\n| 5 | 命令替换 | `$name`，根据 IFS 见步骤 1 和 2 的标记 |\n| 6 |\
  \ 输入/输出重定向 | `<`, `>`, `>>`, `2>`, `2>>` |\n| 7 | 变量赋值 | `name=` |\n| 8 | 分为单词 |\
  \ |\n| 9 | 创建文件名 | |\n| 10 | 命令执行 | |\n\n\n\n\n\n- 在步骤 1 和 2 中，仅对步骤 5 到 7 进行标记，且不进行任何后续操作。如果标记完成，将执行步骤\
  \ 5 到 7。接下来，shell 会移除所有特殊字符。在步骤 10 中，命令行仅包含执行该命令所需的参数。shell 将第一个单词解释为要执行的命令名称，其余的单词则为其参数：`command\
  \ arg1 arg2 arg3 ...`\n\n## 6.3 可用的 Shell\n\n你的 Linux 系统允许使用各种 shell。每种 shell 都可以通过我们之前安装的\
  \ Debian 包管理器 `Aptitude` 作为一个独立的软件包进行安装。shell 的列表非常长，因此我们只列出可选的几种受欢迎的 shell：![](img/image_rsrc2BP.jpg)\n\
  \n- Almquist Shell (ash)![](img/image_rsrc2BR.jpg)\n- Bourne Again Shell (bash)![](img/image_rsrc2BS.jpg)\n\
  - Debian Almquist Shell (dash)![](img/image_rsrc2BT.jpg)\n- Z Shell (zsh)![](img/image_rsrc2BU.jpg)\n\
  - C Shell (csh)![](img/image_rsrc2BV.jpg)\n- Korn Shell (ksh)![](img/image_rsrc2BW.jpg)\n\
  - Tenex C Shell (tcsh)\n\n除非另有说明，本指南中的示例均基于 Bourne Again Shell (bash)。在编写本文时，它是\
  \ Debian 上的默认 shell。你的 Linux 系统允许哪些其他 shell 是在配置文件 `/etc/shells` 中设置的。使用 `cat` 命令可以看到允许的\
  \ shell 列表。`cat` 将在第 7 章详细讨论。现在，只需知道该命令仅是将文件内容输出到屏幕上。\n\n```bash\n$ cat /etc/shells\n\
  ```\n\n```\n#/etc/shells: valid login shells\n/bin/sh\n/bin/dash\n/bin/bash\n/bin/rbash\n\
  /usr/bin/screen\n```\n\n$\n终端中当前使用的 shell 名称存储在名为 `$0` 的 shell 变量中。以下简单命令输出 shell\
  \ 的名称：\n\n```bash\n$ echo $0\nbash\n```\n\n$\n要更改当前使用的 shell，请查看配置文件 `/etc/passwd`\
  \ 以及第 10 章介绍的 `chsh` 命令。\n\n## 6.4 Shell 脚本\n\n乍看之下，shell 脚本听起来可能令人望畏，但其实非常简单。在最简单的形式，它只是存储在文件中的一系列\
  \ UNIX/Linux 命令，并由命令行解释器逐行执行。shell 脚本类似于在终端中输入单条命令，但它们是批处理的。这使得速度快得多，并有助于自动化任务。对于本指南，我们不会深入探讨\
  \ shell 脚本的编程复杂性。但 shell 脚本的推荐结构值得注意的![](img/image_rsrc2BX.jpg)\n\n- **Shebang 行**\
  \ - 定义将使用哪个程序来正确处理 shebang 行随后的指令。该行以 `#!` 开头，这是一个双字节数字，表示随后的行是可执行的 shell 脚本。shebang\
  \ 之后是用于处理指令的解释器或程序的路径。![](img/image_rsrc2BY.jpg)\n- **Docstring（文档字符串）** - 对脚本功能和代码软件许可协议的简短描述。这可以是单行，也可以是详细的描述。此类行以\
  \ `#` 开头，并被 shell 视为注释![](img/image_rsrc2BZ.jpg)\n- **Commands（命令）** - 由 shell 执行的单条命令的组合。如所述，这可以少到只有单行指令（如我们下方的示例所示），也可以是一个完整的程序![](img/image_rsrc2C0.jpg)\n\
  - **Exit state（退出状态）** - 定义脚本的返回值。除非明确说明，否则将返回脚本中执行的最后一个命令的退出状态。通常在成功时返回 0，在出错时返回\
  \ 1 到 255 之间的值。\n\n以下基础脚本包含了上述提到的所有元素。该脚本的目的是确定计算机的运行时间（uptime）。\n\n```bash\n#!/bin/bash\n\
  \n# 确定系统的运行时间\n\n# 根据 GNU 公共许可证 (GPL) 发布\n\nuptime\n\n# 定义退出状态：无错误\n\nexit 0\n```\n\
  \n执行 shell 脚本有两种方法。我们可以调用 Bash 等 shell 来运行它，或者为脚本设置可执行标记后运行它。第一种方法使用 Bash，如下：\n\n\
  ```bash\n$ bash uptime.sh\n12:20:31 up 7 days, 2:09, 6 users, load average: 0,74,\
  \ 0,40, 0,27\n```\n\n$\n第二种方法基于两个步骤。首先，我们使用 `chmod` 命令为脚本设置可执行标记，如下：\n\n```bash\n\
  $ chmod u+x uptime.sh\n```\n\n$\n然后我们可以运行脚本：\n\n```bash\n$ ./uptime.sh\n12:26:07\
  \ up 7 days, 2:14, 6 users, load average: 0,23, 0,34, 0,28\n```\n\n## 7 文本处理\n\n\
  Linux 大部分基于文本文件运行。例如，存储在 `/etc` 中的配置文件是以文本文件形式存储的。Linux 提供了丰富的文本处理命令，这些命令非常全面且节省时间。了解它们是什么以及如何工作，将在许多深入探讨\
  \ Linux 的后续章节起到起到关重要的作用。在本章中，我们将查看这些命令并展示如何使用它们。\n\n### 7.1 文本处理命令\n\n#### cat\n\
  \nconcatenate（连接）的缩写，`cat` 将文件内容输出到屏幕或标准输出。命令 `cat /etc/passwd` 将 `/etc/passwd`\
  \ 文件的所有行输出到屏幕。\n\n```bash\n$ cat /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\n\
  daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\n\
  sys:x:3:3:sys:/dev: /usr/sbin/nologin\nsync:x:4:65534:sync:/bin:/bin/sync\ngames:x:5:60:games:/usr/games:/usr/sbin/nologin\n\
  man:x:6:12:man:/usr/sbin:/usr/sbin/nologin\nlp:x:7:7:lp:/var/spool:/usr/sbin/nologin\n\
  mail:x:8:8:mail:/var/mail:/usr/sbin/nologin\nnews:x:9:9:news:/var/spool/news:/usr/sbin/nologin\n\
  ```\n\n`cat` 还可以将文件内容输出到屏幕。例如，`cat output.txt` 将 `output.txt` 的内容输出到屏幕上。\n\n```bash\n\
  $ cat output.txt\nhello world\nthis is a test\nto see if works\n```\n\n`cat` 通过重定向运算符写入文件。例如：\n\
  \n```bash\n$ cat > output.txt\nhello world\nthis is a test\nto see if works\n```\n\
  \n`cat` 还可以输出到屏幕。按下 `Ctrl+D` 退出并输入 `cat output.txt` 查看结果。\n\n```bash\n$ cat output.txt\n\
  hello world\nthis is a test\nto see if works\n```\n\n`cat` 的其他有用选项有![](img/image_rsrc2C1.jpg)`E`（对应\
  \ `--show-ends`）：在每行末尾输出 `$`![](img/image_rsrc2C2.jpg)`n`（对应 `--number`）：为所有输出行编号![](img/image_rsrc2C3.jpg)`s`（对应\
  \ `--squeeze-blank`）：压缩连续的空行。`cat` 还可以同时输出多个文件。命令 `cat /etc/passwd /etc/group` 将输出\
  \ `/etc/passwd` 和 `/etc/group` 的内容。注意原始文件不受影响。下面的示例两次输出 `output.txt` 的内容，并持续使用 `-n`\
  \ 选项为所有输出编号。\n\n```bash\n$ cat -n output.txt output.txt\n1 hello world\n2 this is\
  \ a test\n3 to see if works\n4 hello world\n5 this is a test\n6 to see if works\n\
  ```\n\n为了更丰富的示例，我们将创建三个名为 `file1`、`file2` 和 `file3` 的文本文件。使用命令 `cat > file1`、`cat\
  \ > file2` 和 `cat > file3` 创建这些文件。不要忘记按下 `Ctrl+D` 退出并使用命令 `cat file1 file2 file3`\
  \ 查看它们。\n\n```bash\n$ cat > file1\nthis is file one\n\n$ cat > file2\nthis is file\
  \ two\n\n$ cat > file3\nthis is file three\n\n$ cat file1 file2 file3\nthis is file\
  \ one\nthis is file two\nthis is file three\n```\n\n使用重定向运算符，我们可以将所有三个文件写入一个文件。\n\
  \n```bash\n$ cat file1 file2 file3 > bigfile\n```\n\n$ cat bigfile\nthis is file\
  \ one\nthis is file two\nthis is file three\n```\n\ntac\n\n`tac` 命令的工作方式与 `cat`\
  \ 相同，但按反顺序显示行。使用上一节的 `bigfile`，让我们使用 `tac` 显示文件：\n\n```bash\n$ tac bigfile\nthis\
  \ is file three\nthis is file two\nthis is file one\n```\n\n\n\n\n\n# 这是文件二\n\n\
  这是文件一\n\n## more\n`more`、`cat` 和 `tac` 会一次性显示整个文件，而 `more` 让你每次查看一屏文件。假设我们有一个名为\
  \ `alice.txt` 的大文件。要查看它，请输入以下命令：\n\n```bash\nmore alice.txt\n```\n这会显示从文件开始的一页文本。使用空格键翻页。或者，按\
  \ `Enter` 键可以一次向下滚动一行。`more` 命令的缺点是它只能向下滚动而不能回回。对于这一点，可以使用 `less` 命令。\n\n## 第一章\
  \ - 掉进兔子洞\n一个七岁的女孩爱丽丝正和姐姐坐在河岸边，感到无聊且昏昏欲睡。这时，她注意到一只穿着衣服、拿着怀表的白兔跑过。她追着兔子掉进了一个兔子洞，突然间掉落了很长距离，来到了一个奇特的大厅，里面有许多各种大小的锁门。她找到了一把小钥匙，对应的门太小了，她无法通过，但透过门门，她看到了一座迷人的花园。随后，她在桌子上发现了一个标有“DRINK\
  \ ME”的瓶子，里面的内容让她变得非常小，小到够不到放在桌子上的钥匙。章节结束时，她吃了一块写有“EAT ME”字样的干果蛋糕。\n\n## less\n`less`\
  \ 命令是一个终端分页器，每次显示一屏文本，并允许在文件中向前向后滚动，但它不能编辑文件。在 `less` 内部，有遍历文件和查找特定模式的命令。示例示例：\n\
  \n![](img/image_rsrc2C4.jpg) `j` - 向下一行。\n![](img/image_rsrc2C5.jpg) `k` - 向上一行。\n\
  ![](img/image_rsrc2C6.jpg) `g` 或 `<` - 跳到第一行。\n![](img/image_rsrc2C7.jpg) `G` 或\
  \ `>` - 跳到最后一行。\n![](img/image_rsrc2C8.jpg)<n>G` - 跳到第 `<n>` 行。\n![](img/image_rsrc2C9.jpg)\
  \ `Space` - 跳到下一![](img/image_rsrc2CA.jpg)页。`d` - 向前移动半![](img/image_rsrc2CB.jpg)页。`b`\
  \ - 跳到上一![](img/image_rsrc2CC.jpg)页。`u` - 向后移动半页。(image_rsrc2CD.jpg) `v` - 用 `VISUAL`\
  \ 环境变量设置的编辑器打开页面。\n\n![](img/image_rsrc2CE.jpg) `/<regex>` - 向前搜索 `<regex>`。\n![](img/image_rsrc2CF.jpg)\
  \ `?<regex>` - 向后搜索 `<regex>`。\n![](img/image_rsrc2CG.jpg) `n` - 下一个匹配 `<regex>`\
  \ 的文本实例。(image_rsrc2CH.jpg) `N` - 上一个匹配 `<regex>` 的文本实例。(image_rsrc2CJ.jpg) `:n`\
  \ - 在同一命令中打开了多个文件时，切换到下一个文件。\n\n![](img/image_rsrc2CK.jpg) `:p` - 在同一命令中打开了多个文件时，切换到上一个文件。\n\
  ![](img/image_rsrc2CM.jpg) `q` - 退出。\n\n## head\n此命令输出文件的前 n 行。如果没有指定 `n`，默认十行。下面的示例显示了\
  \ `head` 对 `/etc/passwd` 文件的默认用法。\n\n```bash\nhead /etc/passwd\n```\nroot:x:0:0:root:/root:/bin/bash\n\
  daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin bin:x:2:2:bin:/bin:/usr/sbin/nologin\n\
  sys:x:3:3:sys:/dev: /usr/sbin/nologin\nsync:x:4:65534:sync:/bin:/bin/sync\ngames:x:5:60:games:/usr/games:/usr/sbin/nologin\
  \ man:x:6:12:man:/var/cache/man:/usr/sbin/nologin lp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologin\
  \ mail:x:8:8:mail:/var/mail:/usr/sbin/nologin news:x:9:9:news:/var/spool/news:/usr/sbin/nologin\n\
  \n要输出 `/etc/passwd` 文件的前六行，请输入以下命令：\n\n```bash\nhead -n6 /etc/passwd\n```\nroot:x:0:0:root:/root:/bin/bash\n\
  daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\n\
  sys:x:3:3:sys:/dev: /usr/sbin/nologin\nsync:x:4:65534:sync:/bin:/bin/sync\ngames:x:5:60:games:/usr/games:/usr/sbin/nologin\n\
  \n`head` 的相反命令是 `tail`，我们接下来将解释。\n\n## tail\n`tail` 命令输出文件的最后 n 行。如果未指定 `n`，默认十行。下面的示例显示了\
  \ `/etc/passwd` 文件的最后 5 行。\n\n```bash\ntail -n5 /etc/passwd\n```\nusbmux:x:109:46:usbmux\
  \ daemon,,,:/var/lib/usbmux:/bin/false\npulse:x:110:114:PulseAudio daemon,,,:/var/run/pulse:/bin/false\n\
  lightdm:x:111:116:Light Display Manager:/var/lib/lightdm:/bin/false\nfelix:x:1001:1001:Felix,,,:/home/felix:/bin/bash\n\
  caro:x:1002:1002:Caro,,,:/home/caro:/bin/bash\n\n此外，`tail` 可以使用 `-f`（或 `--follow`）跟踪日志文件的进度。随着更多数据追加到文件末尾，屏幕上的输出会更新。要输出\
  \ `/var/log/syslog` 最后 20 行的更新进度，请使用以下命令：\n\n```bash\ntail -f -n 20 /var/log/syslog\n\
  ```\n\n## sort\n如名所示，此命令用于排序文件。除外，它还有以下选项：\n![](img/image_rsrc2CN.jpg) `-R`: 随机排序。\n\
  ![](img/image_rsrc2CP.jpg) `-r`: 反转排序顺序。\n![](img/image_rsrc2CR.jpg) `-n`: 数值排序。\n\
  \n要按字母顺序对 `/etc/passwd` 文件的前五行排序排序请使用此命令：\n\n```bash\nhead -n5 /etc/passwd | sort\n\
  ```\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\n\
  root:x:0:0:root:/root:/bin/bash\nsync:x:4:65534:sync:/bin:/bin/sync\nsys:x:3:3:sys:/dev:/usr/sbin/nologin\n\
  \n使用选项 `-r` 反转排序顺序：\n\n```bash\nhead -n5 /etc/passwd | sort -r\n```\nsys:x:3:3:sys:/dev:/usr/sbin/nologin\n\
  sync:x:4:65534:sync:/bin:/bin/sync\nroot:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\
  \ bin:x:2:2:bin:/bin:/usr/sbin/nologin\n\n## uniq\n此命令报告或删除排序文件中的重复行。除外，它还有以下选项：\n\
  ![](img/image_rsrc2CS.jpg) `-c`（`count` 的缩写）：输出每行的出现频率。\n![](img/image_rsrc2CT.jpg)\
  \ `-d`（`repeated` 的缩写）：报告出现一次以上的行。\n![](img/image_rsrc2CU.jpg) `-u`（`unique` 的缩写）：报告只出现一次的行。\n\
  \n下面的示例显示了 `uniq`的基本用法。输出包含只出现一次的行：\n\n```bash\ncat names.sorted\n```\nGreg 1967\n\
  John 1986\nJohn 1986\nKate 1948\nPete 1977\n\n```bash\nuniq names.sorted\n```\n\
  Greg 1967\nJohn 1986\nKate 1948\nPete 1977\n\n## cut\n`cut` 命令从文件中提取指定的字段。它需要一个分隔符来检测字段边界。以下示例显示从\
  \ `/etc/passwd` 提取名称和用户 ID。这些是行的第一和第三字段（选项 `-f`），字段由冒号分隔（选项 `-d`）。\n\n```bash\n\
  cut -d\":\" -f1,3 /etc/passwd\n```\n...\ncolord:108\nsaned:109\nusbmux:110\ngeoclue:111\n\
  sshd:112\nuuidd:113\npulse:114\nrtkit:115\navahi:116\n\n## tr\n此命令背后的思想是对字符串进行翻译、替换和删除。`tr`\
  \ 从标准输入读取并输出到标准输出。它有以下选项：\n![](img/image_rsrc2CV.jpg) `-d`（`delete` 的缩写）：从字符串删除删除字符。\n\
  ![](img/image_rsrc2CW.jpg) `-s`（`squeeze-repeats` 的缩写）：将重复字符替换为单次。\n![](img/image_rsrc2CX.jpg)\
  \ `-t`（`truncate-set1` 的缩写）：截断给定的字符集。\n\n下面的第一个示例演示了如何将小写字母转换为大写字母。`tr` 接受两个字符集：原始字符和替换字符。两个集合中的字符数量必须相同。\n\
  \n```bash\ncat bigfile | tr [a-z] [A-Z]\n```\nTHIS IS FILE ONE\nTHIS IS FILE TWO\n\
  THIS IS FILE THREE\n\n第二个示例演示了如何将重复的空格替换为单个。空格被定义为一组字符，即空格、制表符、回车或换行。\n\n```bash\n\
  echo \"tools for tools for developers $ echo \"tools for tools-for-developers\"\
  \ | tr -s [:space:]\n```\ntools for tools-for-developers\n\n\n\n\n\n# 这是文件一\n\n\
  --\n\n> 这是文件二 $nl$\n\n`nl` 命令类似于 `cat`（在本章开头已讨论过），但它会在输出的每行开头添加行号。`nl` 的输出如下：\n\n\
  ```\n1 Amsterdam\n2 Berlin\n3 Bern\n4 Cape Town\n```\n\n$wc\n`wc` 命令是 `word count`（单词计数）的缩写，分别统计输入数据的行数、单词数和字符数。除非另有指定，否则这三个值都会被打印：`wc`\
  \ 的输出如下：\n\n```\n4 5 32\n```\n\n$此外 `wc` 还提供了以下选项来限制输出：\n- `-l`: 仅输出行数，后跟文件名。\n\
  - `-w`: 仅输出单词数，后跟文件名。\n- `-c`: 仅输出字符数，后跟文件名。\n\n此示例展示了如何仅统计文件的行数：`wc -l` 输出：\n```4\n\
  ```\n\n## 7.2 grep 简介\n命令行工具 `grep` 是 Linux 中最基本且强大的命令之一，以至于作者们专门为它编写了整个指南。`grep`\
  \ 充当过滤的角色，是“global regular expression print”（全局正则表达式打印）的缩写。\n\n该命令作为文本数据的过滤器工作，仅打印匹配给定模式的文本行。`grep`\
  \ 需要处理的数据以及一个要查找的模式。在此语境下，数据指的是来自 `stdin` 或文件的系列字符，而模式可以被构建为系列字符或正则表达式。`grep` 支持四种不同的模式样式：\n\
  - `-G`（`--basic-regexp` 的缩写）：模式以基本正则表达式的形式构建。这是默认情况。\n- `-F`（`--fixed-strings` 的缩写）：不是不是，而是被视为固定字符串。也可以简写为\
  \ `fgrep`。\n- `-E`（`--extended-regexp` 的缩写）：模式以扩展正则表达式的形式构建，允许额外的字符集。也可以简写为 `egrep`。\n\
  - `-P`（`--perl-regexp` 的缩写）：模式按照 Perl 语法的正则表达式进行解释。\n\n`grep` 选项非常多。以下是最显著的可用选项列表：\n\
  - `-c`: 统计并打印匹配次数，但不打印匹配项本身。\n- `--color`: 高亮显示匹配项。\n- `-H`（`--with-filename` 的缩写）：输出的每行以匹配项所在的文件名开头。\n\
  - `-i`: 忽略大小写，包含大小写匹配。\n- `-l`（`--files-with-matches` 的缩写）：仅打印匹配搜索的文件名。\n- `-L`（`--files-without-matches`\
  \ 的缩写）：仅打印不匹配搜索的文件名。\n- `-n`（`--line-number` 的缩写）：输出的每行以文件中对应匹配的行号开头。\n- `-r`（`--recursive`\
  \ 的缩写）：在目录结构中递归搜索，包含所有子目录。\n- `-v`: 打印所有不匹配搜索模式的行。\n\n通过几个实用示例，这些选项将变得更加清晰。首先，我们一个或多个\
  \ AsciiDoc 文件（`.adoc`）中搜索固定字符串 `Linux`。输出包含该模式的行。`grep Linux *.adoc`\n\n```\nThe\
  \ Linux Environment. First Steps\n```\n\n$接下来，我们执行相同的搜索，但同时输出模式所在的文件名和行号。输出的每行以文件名开头，后跟一个冒号（:）、行号、另一个冒号，然后是匹配模式的行。在我们的示例中，模式出现在\
  \ `introduction.adoc` 文件的第 1 行。`grep -Hn Linux *.adoc`\n\n```\nintroduction.adoc:1:The\
  \ Linux Environment. First Steps.\n```\n\n$这次，我们将在一个或多个 AsciiDoc 文件中搜索字符串 `Linux`，但搜索将包含小写和大写字母。`grep\
  \ -i Linux *.adoc`\n\n```\nThe Linux Environment. First Steps.\ninclude::what-about-linux/what-about-linux.adoc\n\
  include::linux-in-day-to-day-life/linux-in-day-to-day-life.adoc\ninclude::navigating-linux/navigating-linux.adoc\n\
  include::using-the-linux-terminal/using-the-linux-terminal.adoc\n```\n\n$接下来，我们将反向搜索，只显示不包含模式\
  \ `Linux` 的文件名。`grep -vrl Linux */*.adoc`\n\n```\nacknowledgements/acknowledgements.adoc\n\
  getting-help/getting-help.adoc\nlinux-in-day-to-day-life/linux-in-day-to-day-life.adoc\n\
  navigating-linux/navigating-linux.adoc\npreface/preface.adoc\nreferences/references.adoc\n\
  setting-up-debian/setting-up-debian.adoc\nsoftware-licenses/software-licenses.adoc\n\
  using-the-linux-terminal/using-the-linux-terminal.adoc\nwhat-about-linux/what-about-linux.adoc\n\
  x11/x11.adoc\n```\n\n$现在让我们看几个稍微复杂的例子。在这种情况下，我们将利用之前在指南中见过的 `ls` 命令，并对特定模式范围的输出进行过滤。具体地说，我们将搜索文件名包含数字\
  \ 12 到 16 的 PDF 文档。`ls E*.pdf | egrep --color '1[2-6].pdf$' E_20160012.pdf`\n\n\
  ```\nE_20160012.pdf\nE_20160013.pdf\nE_20160014.pdf\nE_20160015.pdf\nE_20160016.pdf\n\
  ```\n\n$对于下一个示例，我们将搜索当前目录下所有包含模式 `nanostation`（一个产品名）的 TeX 文件，其中开头是大写或小写的 `n`，名称中间是大写或小写的\
  \ `s`。`egrep --color '[Nn]ano[Ss]tation' *.tex`\n\n```\nB0047.tex:Ubiquiti NanoStation\
  \ M2\nB0057.tex:Ubiquiti Nanostation M2 Loco\nB0092.tex:Ubiquiti Nanostation M5\n\
  ```\n\n$最后，我们列出系统中不再安装但仍配置的所有软件包。这里我们使用 `dpkg` 命令，你将在第 14 章学习更多信息。在我们的示例中，它只是列出已安装的包及其状态。`grep`\
  \ 命令过滤所有以两个字符 `rc` 开头的行，`rc` 代表已删除（removed）和已配置（configured）。`dpkg -l | egrep '^rc'`\n\
  \n```\nrc doxygen-gui 1.8.8-5 amd64 GUI configuration tool for doxygen\nrc kdiff3\
  \ 0.9.98-1 amd64 compares and merges 2 or 3 files or directories\nrc ktorrent 4.3.1-2+b1\
  \ amd64 BitTorrent client based on the KDE platform\nrc libacpi0 0.2-4 amd64 general\
  \ purpose library for ACPI\n...\n```\n\n## 7.3 组合命令\nLinux 命令本身已经非常强大，但你可以通过使用管道（pipe）组合它们或重定向输入/输出来进一步增强其功能。我们在下面演示如何实现这一点。\n\
  \n### 管道\n\n### 重定向\n\n\n\n\n重定向是 Linux 中的一项功能，在执行命令时它可以更改标准输入/输出设备。任何 Linux 命令的基本工作流都是接收输入并产生一个输出。标准输入（`stdin`）设备是键盘，标准输出（`stdout`）设备是屏幕。通过重定向，可以更改标准的输入/输出。你可以从不同的输入源读取处理后的数据，并将结果输出到不同的地方。输出重定向由\
  \ `>` 和 `>>` 符号表示，输入重定向由 `<` 符号表示：![](img/image_rsrc2DE.jpg)\n\n`>` 符号通过创建一个新文件将输出发送到指定文件。如果文件已存在，它将被完全替换。![](img/image_rsrc2DF.jpg)`>>`\
  \ 符号将输出发送到指定文件并追加在末尾。\n\n![](img/image_rsrc2DG.jpg)`<` 符号从指定的输入源读取内容。\n\n第一个示例使用了\
  \ `>>` 操作符，并在现有文件的末尾添加了第三行文本。\n\n```bash\n$ echo \"line 3\" >> file2\n$ cat file2\n\
  this is file two\nwith a second line\nline 3\n```\n\n第二个示例更进一步，将标准输出重定向到设备。`cat`\
  \ 命令读取文件 `music.mp3`并将输出发送到设备 `/dev/audio`，这是一个音频设备。如果你的电脑音效配置正确，此命令将播放该文件。\n\n\
  ```bash\n$ cat music.mp3 > /dev/audio\n```\n\n下一个示例结合了输入和输出重定向。`wc` 命令读取 `file2`\
  \ 的内容并使用 `-w` 选项统计单词。然后将输出发送到 `stdout`，并使用 `>>` 操作符作为新行追加到文件 `statistics` 中。\n\n\
  ```bash\n$ cat file2\nthis is file two\nwith a second line\nline 3\n$ wc -w < file2\n\
  10\n$ wc -w < file2 >> statistics\n$ cat statistics\n10\n```\n\n# 8. Linux 启动过程\n\
  \n## 8.1 启动与引导顺序\n我们首先查看所有 Linux 系统中的第一个进程：启动过程。启动一个 UNIX/Linux 系统是一个复杂的多部分过程，由以下高层步骤组成：\n\
  \n1. 基本输入/输出系统（BIOS）执行主引导记录（MBR）。较新的系统使用统一扩展固件接口（UEFI）。\n2. `MBR` 执行引导加载程序，例如统一引导加载程序（`GRUB`）或\
  \ Linux 加载器（`LILO`）。\n3. 引导加载程序随后执行 Linux 内核。\n4. Linux 内核通过 `/sbin/init` 运行 `init`\
  \ 进程启动操作系统。\n5. `Init` 然后带有运行级别的 `init.d` 或 `systemd`。\n\n下面将详细解释这些步骤。\n\n### BIOS\
  \ 和 UEFI\n启动电脑时会运行 BIOS 或 UEFI。该软件由电脑主板上特定厂商的固件内存芯片提供，该芯片针对特定主板。BIOS 或 UEFI 首先执行一些系统完整性检查。然后它按照预选顺序搜索硬盘、CD/DVD\
  \ 驱动器、USB 驱动器和网络，并启动找到的第一个引导加载程序。该引导加载程序被加载到内存中接管系统。简单来说，BIOS 或 UEFI 加载并执行引导加载程序。\n\
  \n在启动时，通常有一个选项可以按 `F1`、`F2`、`F12`、`Escape` 或 `Delete` 进入 BIOS 或 UEFI 菜单。引导加载程序的搜索序列可以在此处更改。一旦做出更改，通常按\
  \ `F10` 键保存更改并新设置重启系统。对于大多数现代系统，BIOS 已不再使用并被 UEFI 取代。UEFI BIOS 由统一 EFI 论坛维护。Debian\
  \ 对 UEFI 的支持是默认设置的一部分。\n\n与 BIOS 相比，UEFI 具有以下优势：\n\n![](img/image_rsrc2DH.jpg)能够\
  \ GUID 分区表（`GPT`）使用大容量磁盘（超过 2 TB）。\n![](img/image_rsrc2DJ.jpg)独立于 CPU 的架构。\n![](img/image_rsrc2DK.jpg)独立于\
  \ CPU 的驱动程序。\n![](img/image_rsrc2DM.jpg)包含网络功能的灵活预操作系统环境。\n![](img/image_rsrc2DN.jpg)模块化设计。\n\
  ![](img/image_rsrc2DP.jpg)向后和向前兼容性。\n\n要确定 Debian 系统是否通过 UEFI 引导，请检查目录 `/sys/firmware/efi`。如果该目录存在，则系统以\
  \ UEFI 模式运行。没有 UEFI 的系统将返回以下内容：\n\n```bash\n$ ls /sys/firmware/efi\nls: cannot access\
  \ /sys/firmware/efi: No such file or directory\n```\n\n### MBR\n主引导记录（`MBR`）位于可引导磁盘的第一扇区。通常，这是\
  \ `/dev/hda` 或 `/dev/sda`。它包含了关于磁盘上逻辑分区的所有信息。`MBR` 大小小于 512 字节，具有以下三个部分：\n\n1. 前\
  \ 446 字节中的主引导加载程序信息。\n2. 接下来 64 字节中的分区表信息。\n3. 最后两个字节中的 `MBR` 验证检查（签名）。`MBR` 包含关于\
  \ `GRUB` 的信息。因此简单来说，它加载并执行 `GRUB` 引导加载程序。可以通过以下方式结合 `coreutils` 包和 `bsdmainutils`\
  \ 包中的命令 `dd`（磁盘转储）和 `hexdump` 来查看 `MBR` 的内容：\n\n```bash\n# dd if=/dev/sda bs=512\
  \ count=1 | hexdump -C\n```\n\n在上述代码中，`dd` 以 512 字节为块分块读取第一个 SCSI 磁盘 `/dev/sda`\
  \ 的内容。`count=1` 选项限制此步骤仅读取第一个块。然后使用 `-C` 选项将 `dd` 的输出传递给 `hexdump`。`hexdump` 的输出以\
  \ ASCII 字符显示。下面的示例更详细说明了这一点。![](img/image_rsrc2DR.jpg)\n\n`dd` 命令也可以用于如下所示创建 `MBR`\
  \ 的备份。输出文件为 `mbr.bin`，使用 `of=mbr.bin` 选项指定，`of` 是 output file 的缩写。\n\n```bash\n\
  # dd if=/dev/sda bs=512 count=1 of=mbr.bin\n1+0 records in\n1+0 records out\n512\
  \ bytes copied, 0.000371249 s, 1.4MB/s\n# file mbr.bin\nmbr.bin: DOS/MBR boot sector\n\
  ```\n\n### GRUB\n处理 Linux 启动的软件称为统一引导加载程序（`GRUB`），准确地说是 `GNU GRUB`。它的功能是在启动时从 BIOS\
  \ 接管，加载自身，将 Linux 内核加载到内存，然后将执行权交给 Linux 内核。一旦内核接管，`GRUB` 就完成了它的工作，不再需要。\n\n注意 `GRUB`\
  \ 版本 1 已被 `GRUB2` 取代，以前称为 `GRUB Legacy`。为了简单起见，`GRUB2` 简称为 `GRUB`。在启动时，`GRUB` 显示启动屏并提供一个从这里启动系统的菜单。系统中存在的\
  \ Linux 内核镜像越多，列表越长。下面的图像显示了带有两个菜单项目的默认安装。除非另有说明，第一项指向默认项。![](img/image_rsrc2AZ.jpg)\n\
  \n`GRUB` 等待几秒，然后加载从菜单选择的内核镜像。第一项针对 `GRUB` 配置文件 `/boot/grub2/grub.cfg` 中镜像。该配置文件在\
  \ Linux 安装期间生成，并在安装新的 Linux 内核时自动重新生成。\n\n### Linux 内核\n在这一步，根文件系统根据 `GRUB` 配置文件中的\
  \ `root=` 条目挂载。然后内核执行 `/sbin/init` 程序。内核使用名为 `initrd`（初始内存磁盘的缩写）的文件作为临时根文件系统，直到内核引导并挂载真正的根文件系统。它包含了访问硬盘分区、文件系统和其他硬件组件所需的所有驱动程序。\n\
  \n## 8.2 备用引导加载程序\n`GRUB` 不是开源世界唯一的引导加载程序。其他引导加载程序包括：\n\n![](img/image_rsrc2DS.jpg)`BURG`\
  \ - 名称缩写为 Brand-new Unified Loader from GRUB（如果你问我们，为了得到 `GRUB` 的反向命名这有点牵强）。它是 `GRUB`\
  \ 的一个分支，为单独的配置提供了更大的空间。\n![](img/image_rsrc2DT.jpg)`SYSLINUX` - 用于网络和 CD/DVD 驱动器的轻量级引导加载程序。\n\
  \n\n\n\n![](img/image_rsrc2DU.jpg)\n**ISOLINUX** - 源自 `SYSLINUX` 项目的引导程序，通常用于 Linux\
  \ Live CD 和可启动安装 CD。\n\n![](img/image_rsrc2DV.jpg)**gummiboot** - 一种带有文本模式界面的基于\
  \ EFI 的计算机引导程序。它旨在作为 `GNU GRUB` 的极简替代方案，能够自动检测可启动镜像（包括 Linux 内内核镜像、操作系统和其他引导程序），不需要配置文件，提供基于菜单的基本界面，并可以与\
  \ `systemd` 集成以提供性能数据。\n\n![](img/image_rsrc2DW.jpg)**Libreboot** - 一个旨在仅执行位或 64\
  \ 位操作系统的轻量级系统。下面的图片显示了 Libreboot 的菜单。\n\n![](img/image_rsrc2DX.jpg)**rEFInd** -\
  \ 一个具有 GUI 界面的 EFI 计算机启动管理器。`rEFInd` 可用于启动多个操作系统，并提供了进入和浏览 EFI 预启动环境的方法。\n\n![](img/image_rsrc2DY.jpg)\n\
  \n## 8. 审查启动过程\n\nLinux 会生成日志文件，以便审查启动过程并读取其附的消息。在 Linux 8 之前，启动日志以文本文件存储在 `/var/log/boot`。Linux\
  \ 8 引入了 `systemd`，格式和位置发生了变化。要检索启动日志，请如下所示使用 `journalctl`（必须是 root 用户）：\n\n```bash\n\
  journalctl -b\n```\n\n`Systemd` 以特殊格式存储日志消息。`journalctl` 读取日志并按时间顺序显示消息。最早的条目在前，可以使用方向键来回滚动。输出包含四列：日期（时间戳）、主机名、消息类型\
  \ `kernel` 以及消息本身....\n\n```\nAug 20 09:36:08 debian106 kernel: Linux version 4.9.0-7-amd64\
  \ (debian-kernel@lists. Aug 20 09:36:08 debian106 kernel: Command line: BOOT_IMAGE=/boot/vmlinux-4.9.0-7-am\
  \ Aug 20 09:36:08 debian106 kernel: x86/fpu: Legacy x87 FPU detected\n\n```\n\n\
  Aug 20 09:36:08 debian106 kernel: e820: BIOS-provided physical RAM map:\n\nAug 20\
  \ 09:36:08 debian106 kernel: BIOS-e820: [mem 0x0000000000000000-0x00 Aug 20 09:36:08\
  \ debian106 kernel: BIOS-e820: [mem 0x000000000009fc00-0x00 Aug 20 09:36:08 debian106\
  \ kernel: BIOS-e820: [mem 0x0000000000000000-0x00 Aug 20 09:36:08 debian106 kernel:\
  \ BIOS-e820: [mem 0x00000000000f0000-0x00 Aug 20 09:36:08 debian106 kernel: BIOS-e820:\
  \ [mem 0x0000000000100000-0x00 Aug 20 09:36:08 debian106 kernel: BIOS-e820: [mem\
  \ 0x00000000c4af0000-0x00 Aug 20 09:36:08 debian106 kernel: BIOS-e820: [mem 0x00000000fffc0000-0x00\
  \ Aug 20 09:36:08 debian106 kernel: NX (Execute Disable protection: active Aug 20\
  \ 09:36:08 debian106 kernel: SMBIOS 2.5 present.\n\nAug 20 09:36:08 debian106 kernel:\
  \ DMI: innotek GmbH VirtualBox/VirtualBox, BIOS Aug 20 09:36:08 debian106 kernel:\
  \ e820: update [mem 0x00000000-oxooooofff] usable Aug 20 09:36:08 debian106 kernel:\
  \ MTRR default type: uncachable\n\nAug 20 09:36:08 debian106 kernel: MTRR variable\
  \ ranges disabled:\n\nAug 20 09:36:08 debian106 kernel: MTRR: Disabled\n....\n\n\
  ```\n\n要查看记录的启动列表，可以使用 `list-boots` 。输出包含三列：启动条目编号（最后一个条目为 0）、用于识别条目的哈希值以及时间戳。下面的示例显示了输出：\n\
  \n```bash\njournalctl --list-boots\n\n```\n\n0 5f41f5e968b34d068320f0f13237b7e2\
  \ Tue 2020-09-04 19:16:12 EDT\n\nlines 1-1/1 (END)\n\n```\n\n`journalctl` 的替代方案是\
  \ `dmesg`。此命令允许你查看整个启动过程，包括 BIOS 消息。下面的图片显示了你将获得的输出。每行由三部分组成：左侧括号内打印的日期（时间戳）、第二个打印在冒号（:）之前的组件，以及最后打印的消息。在彩色显示器上，这三部分通过颜色进行区分，即绿色、黄色和黑色。\n\
  \n![](img/image_rsrc2DZ.jpg)\n\n## 8.4 重启和停止系统的命令\n\n在重启和停止系统方面有几个常用的命令。要重启 Linux，你可以使用\
  \ `reboot` 或 `shutdown`。停止 Linux，你可以调用 `halt`、`poweroff` 或 `shutdown`。下面我们将讨论一些实际示例。\n\
  \n### `shutdown -r now`\n\n上述命令将重启系统。`-r` 选项指定重启并重启系统。`now` 选项是一个时间参数并立即触发操作。你也可以使用\
  \ `reboot` 命令执行与 `shutdown -r now` 命令相同的操作。\n\n### `reboot`\n\n`shutdown` 命令也可以通过使用\
  \ `-h` 选项来停止系统。这指示 Linux 停止（halt）。\n\n### `shutdown -h now`\n\n再次使用了 `now` 时间参数来立即停止系统。时间参数也可以指定为精确时间。下面示例中的命令将在五分钟后关闭系统。它还将通过向用户发送相关消息通知所有用户关机。\n\
  \n```bash\nshutdown -h +5 \"Server shutdown due to maintenance in 5 min\"\n```\n\
  \n计划于 Thu 2020-09-06 02:28:30 EDT 关机，使用 'shutdown -c' 取消。\n\n与重启系统类似，停止 Linux 也有\
  \ `halt` 命令形式的快捷方式。它执行与 `shutdown - h now` 命令相同的操作。\n\n### `halt`\n\n`halt`、`poweroff`\
  \ 和 `reboot` 命令立即停止系统。它们与 `shutdown -h now` 相似，但 `shutdown` 命令会优雅地终止所有进程，而不是直接杀死它们。记住，上述所有命令都需要管理员权限才能执行。普通用户无法执行这些命令。\n\
  \n## 9. 硬件管理\n\n### 9.1 硬件检测\n\n自动硬件检测过去某种程度上是一种博弈，因为硬件并不总是能自动检测到。过去需要探测硬件来确定安装了什么。在过去的几年里，这种情况有了显著改善，因为制造商更详细地记录了他们的产品并在网上发布了规格。这导致了知识库和支持的支持。\n\
  \n### 9.2 使用 `/proc` 文件系统\n\n`/proc` 是一个虚拟文件系统，也称为内存文件系统，由 Linux 内核在运行时创建。它显示有关内核、进程和其他系统的信息。这些信息以文件结构的形式显示，并且所有人都可以访问。例如，下面的命令显示了\
  \ `/proc/cmdline` 的内容，即调用 Linux 内核时使用的选项。记得 `cat` 会将文件内容输出到屏幕。\n\n```bash\n$ cat\
  \ /proc/cmdline\n\nBOOT_IMAGE=/boot/vmlinux-4.9.0-7-amd64 root=UUID=1d4acbbf-4420-4eab-984dceeb408a51e\
  \ quiet\n```\n\n其他有用文件：\n\n![](img/image_rsrc2E0.jpg)\n`/proc/cpuinfo` - 关于计算机 CPU\
  \ 信息。\n\n![](img/image_rsrc2E1.jpg)\n`/proc/meminfo` - 关于系统内存的信息。\n\n![](img/image_rsrc2E2.jpg)\n\
  `/proc/loadavg` - 平均负载。前三列测量过去 1、5、10 分钟的 CPU 利用率。第四列显示当前运行的进程数和总进程数。最后一列显示最后使用的进程\
  \ ID。\n\n![](img/image_rsrc2E3.jpg)\n`/proc/partitions` - 分区信息。\n\n![](img/image_rsrc2E4.jpg)\n\
  `/proc/version` - 关于 Linux 版本的信息。\n\n```bash\n$ cat /proc/version\n\nLinux version\
  \ 3.16.0-4-amd64 (debian-kernel@lists.debian.org) (gcc version 4.8.4 (Debian 4.8.4-1)\
  \ ) #1 SMP Debian 3.16.43-2+deb8u2 (2017-06-26)\n```\n\n![](img/image_rsrc2E5.jpg)\n\
  `/proc/devices` - 配置到当前运行内核中的设备驱动程序列表。\n\n![](img/image_rsrc2E6.jpg)\n`/proc/filesystems`\
  \ - 列出内核支持的文件系统。\n\n![](img/image_rsrc2E7.jpg)\n`/proc/uptime` - 包含系统运行时间。第一个数字是系统运行的总秒数。第二个数字是机器在这些段时间内空闲的时间（秒）。\n\
  \n```bash\n$ cat /proc/uptime\n\n15250.54 55603.02\n```\n\n\n\n\n\n$Linux 中的进程被分配了多个文件。下面的示例显示了进程\
  \ ID (PID) 为 433 的进程的文件结构。接下来，我们将查看通常可用文件的目的和内容。| – 433\n\n| |– attr |\n| |– cwd\
  \ -> /home/user | |– fd |\n| |– fdinfo |\n| |– map_files |\n| |– net |\n| | |– dev_snmp6\
  \ | | |– netfilter |\n| | |– stat |\n| |– ns |\n| |– root -> / |\n| |– task |\n\
  | |– 433 |\n\n`/proc/PID/cmdline` - 命令行参数。\n`/proc/PID/cpu` - 执行该进程的当前和上一次 CPU。\n\
  `/proc/PID/cwd` -指向当前工作目录的链接。\n`/proc/PID/environ` - 环境变量的值。\n`/proc/PID/exe` -\
  \ 指该进程执行文件的链接。\n`/proc/PID/fd` - 包含所有文件描述符的目录。\n`/proc/PID/maps` - 可执行文件和库文件的映射。\n\
  `/proc/PID/mem` - 此进程持有的内存。\n`/proc/PID/root` - 指向进程根目录的链接。\n`/proc/PID/stat` -\
  \ 进程状态。\n`/proc/PID/statm` - 进程内存状态信息。\n`/proc/PID/status` - 人类可读的进程状态。\n\n如果你想了解更多关于\
  \ `/proc` 文件系统的知识，请查看 `/proc` 的 Man Page（Manual Pages 的缩写）。它涵盖的内容远超本指南的范围。访问 Man\
  \ 页的内容将在第 19.9.3 节 命令行工具中讨论。\n\n## 使用 cpuid 检测 CPU\n为了获取有关你的 Linux 系统中 CPU 的更多信息，请使用\
  \ `cpuid` 命令。该工具可以通过名为 `cpuid` 的 Debian 包获取。下面是该命令返回的详细信息示例。\n\n```\n$ cpuid CPU\
  \ 0:\nvendor_id = \"GenuineIntel\"\nversion information (1/eax):\nprocessor type\
  \ = primary processor (0)\nfamily = Intel Pentium Pro/II/III/Celeron/Core/Core 2/Atom,\
  \ AMD Athlon/Duron - , Cyrix M2, VIA C3 (6)\nmodel = 0xd (13)\nstepping id = 0x4\
  \ (4)\nextended family = 0x0 (0)\nextended model = 0x3 (3)\n(simple synth) = Intel\
  \ Pentium II / Pentium III / Pentium M / Celeron / Celeron M / - Core / Core 2 /\
  \ Core i / Xeon / Atom (unknown model)\nmiscellaneous (1/ebx):\nprocess local APIC\
  \ physical ID = 0x0 (0)\ncpu count = 0x10 (16)\nCLFLUSH line size = 0x8 (8)\nbrand\
  \ index = 0x0 (0)\nbrand id = 0x00 (0): unknown\nfeature information (1/edx):\n\
  x87 FPU on chip = true\nvirtual-8086 mode enhancement = true\ndebugging extensions\
  \ = true\npage size extensions = true\ntime stamp counter = true\nRDMSR and WRMSR\
  \ support = true\nphysical address extensions = true\nmachine check exception =\
  \ true\nCMPXCHG8B inst. = true\nAPIC on chip = true\n```\n\n## 使用 dmidecode 检测硬件\n\
  `dmidecode` 命令报告关于已安装系统组件的详细数据，例如处理器、主板和内存。这些信息基于桌面管理接口 (DMI)，该框架通过从管理它们的软件中抽象出来，对桌面式电脑、笔记本电脑或服务器的各个单独组件进行分类。该工具可以通过同名的\
  \ Debian 包获取。下面的示例显示了在 Debian 中通过 VirtualBox 环境执行命令时的输出。\n\n```bash\n# dmidecode\n\
  # dmidecode 3.0\nGetting SMBIOS data from sysfs. SMBIOS 2.5 present.\n10 structures\
  \ occupying 450 bytes. Table at 0x000E1000.Handle 0x0000, DMI type 0, 20 bytes\n\
  BIOS Information\nVendor: innotek GmbH\nVersion: VirtualBox\nRelease Date: 12/01/2006\n\
  Address: 0xE0000\nRuntime Size: 128 kB\nCharacteristics:\nISA is supported\nPCI\
  \ is supported\nBoot from CD is supported\nSelectable boot is supported\n8042 keyboard\
  \ services are supported(int 9h)\nCGA/mono video services are supported (int 10h)\n\
  ACPI is supportedHandle 0x0001, DMI type 1, 27 bytes System Information\nManufacturer:\
  \ innotek GmbH Product Name: VirtualBox Version: 1.2\nSerial Number: 09.4\n```\n\
  \n## 图形化工具\n还有可以收集和显示硬件信息的图形化工具。这些工具提供了许多用户喜欢的图形用户界面。其中一些工具包括 Hardware Lister (`lshw-gtk`)\
  \ 和 Debian 包 `hardinfo`。下面的图片使用了使用 `hardinfo` 显示的内存信息。\n\n## 10 用户和组管理\n### 10.1\
  \ 用户和组数据的存储\nLinux 是多用户操作系统，这意味着多个用户可以同时访问系统。为了让系统管理这些不同的用户和组，它将这些数据存储在几个配置文件中：\n\
  \n- `/etc/passwd` - 用户数据。\n- `/etc/shadow` - 加密的用户密码。\n- `/etc/group` - 组数据。\n-\
  \ `/etc/gshadow` - 加密的组密码。\n\n这些文件是文本数据库，具有定义的结构。下面我们将详细查看每一个文件。这些文件的内容可以使用文本编辑器或\
  \ `passwd`、`chage`、`chfn`、`chsh` 和 `usermod` 命令进行更改。\n\n#### /etc/passwd\n此文件包含密码以外的所有用户属性。每行由七列组成，列之间用冒号（`:`）分隔。属性分别是用户名、密码、用户\
  \ ID (UID)、组 ID (GID)、`GECOS` 字段、用户主目录和用户登录 shell。\n\n第一个属性 `username` 指的是用户名，它在系统中必须是唯一的。`password`\
  \ 字段只包含 `x`。密码本身的值已移动到 `/etc/shadow`（见下一节），该属性仅为了向后兼容而保留。`UID` 指的是用户 ID，数值范围介于 0\
  \ 到 65535 之间。在 Debian 上，root 用户 UID 为 0，服务用户范围从 1 到 999，普通用户从 1000 开始。下面的示例显示了 root\
  \ 用户和普通用户的信息。\n\n```bash\n$ grep root /etc/passwd\nroot:x:0:0:root:/bin/bash\n\n\
  $ grep user /etc/passwd\nuser:x:1000:1000:Debian User,123,456:/home/user:/bin/bash\n\
  ```\n\n`GID` 属性指向用户主组的 ID。`GECOS` 是 General Comprehensive System 的缩写，包含用户的全名，有时包含逗号分隔的用户数据如房间和电话号码。`Home`\
  \ 是用户的主目录`shell` 是用户的默认 shell。准确来说，它是用户登录时执行的程序。\n\n#### /etc/shadow\n此文件包含用户的加密密码和过期数据。格式与上面讨论的\
  \ `/etc/passwd` 类似。每行由八列组成，列之间用冒号（`:`）分隔。属性分别是用户名、密码、最后更改日期、最小有效期、最大有效期、警告、置时间和过期日期。\n\
  \n第一个属性 `username` 再次指向 UNIX 用户名，但此处 `password` 字段确实包含用户的加密密码。`lastchange` 表示自 1/1/1970\
  \ 以来最后更改密码的天数。接下来两个属性 `minimum` 和 `maximum` 显示用户更改密码所需的最小天数以及密码仍然有效的最大天数。`Warn`\
  \ 显示密码过期前多少天警告用户更改密码。`inactive` 属性是密码过期后到用户被禁用的天数，`expiration date` 是自 1/1/1970\
  \ 以来账户被禁用的天数。下面的示例显示了普通用户的属性。密码以盐哈希值存储在第二列。\n\n```bash\n$ grep user /etc/shadow\n\
  user:$6$QB0brhON$R9saRX5Q1/OwYW4S5Viqeh6McumbqnxkJctxRAl…\n\nCshFyblLTZxlCoggH12p21:17763:0:99999:7:::\n\
  ```\n\n\n\n\n# 要显示账户详情，请调用 `chage` 命令并后跟选项 `-l`（`--list` 的缩写）以及用户名。下面的示例列出了用户 `user`\
  \ 的详细信息。\n\n```\nchage -l user\npassword change : Aug 20, 2020\nPassword expires\
  \ : never\nPassword inactive : never\nAccount expires : never\nMinimum number of\
  \ days between password change : 0 Maximum number of days between password change\
  \ : 99999 Number of days of warning before password expires : 7\n```\n\n# 如如上述示例所示，该账户没有过期日期。为了将此值设置为\
  \ 2019 年 12 月 31 日，请调用 `usermod` 命令并带有选项 `-e`（`--expiredate` 的缩写）以及用户名。\n\n```\n\
  usermod -e 2019-12-31 user\n```\n\n为了锁定和解锁用户账户，`usermod` 命令有两个选项：\n\n- `-L`（`--lock`\
  \ 的缩写）和 `-U`（`--unlock` 的缩写）。下一个示例锁定了名为 `user` 的用户的账户。用户仍然可以工作并完成会话，但无法再次登录系统。\n\
  \n```\nusermod -L user\n```\n\n# /etc/group\n此文件包含用户组属性。每行由四列组成，列之间再次通过冒号分隔。属性分别是组名、密码、组\
  \ ID 以及其成员列表。`groupname` 属性类似于 `username` 属性，指的是 UNIX 组名，该名称在系统中必须是唯一的。密码字段包含一个\
  \ `x`，因为该值已移动到 `/etc/gshadow` 文件，该字段仅为了向后兼容而保留。\n\n`members` 属性提供了一个访问该组的用户的逗号分隔列表。`GID`\
  \ 是唯一的组 ID，其数值范围在 0 到 65535 之间，分配方式与 `UID` 类似。用户 `root` 的 `GID` 为 0，`services` 范围从\
  \ 1 到 999，普通用户从 1000 开始。以下代码段显示了 root 和普通用户的情况。\n\n```\n$ grep root /etc/group\n\
  root:x:0:\n\n$ egrep \"^user\" /etc/group\nuser:x:1000:\n```\n\n下面的示例显示了 `user`\
  \ 所属组的名称。\n\n```\n$ grep user /etc/group\ncdrom:x:24:user\nfloppy:x:25:user\naudio:x:29:user,pulse\
  \ dip:x:30:user\nvideo:x:44:user\nplugdev:x:46:user users:x:100:\nnetdev:x:108:user\
  \ bluetooth:x:111:user user:x:1000:\n```\n\n# /etc/gshadow\n此文件包含组的加密密码和用户数据。格式与\
  \ `/etc/shadow` 类似。每行由四列组成，通过冒号分隔。属性分别是组名、密码、管理员和成员列表。\n\n`groupname` 属性仍然 UNIX\
  \ 组名，密码是加密后的密码。管理员可以使用 `gpasswd` 命令添加或删除其他成员，而成员是组中的非管理员成员。\n\n## 10.2 用户和组命令\n\
  有多个命令可以管理 Linux 系统中的用户和组。我们将查看查看和更改用户信息、更改密码、创建和删除用户账户所需的命令，以及组命令。除非另有说明，这些命令都可以作为普通用户运行。\n\
  \n### whoami\n此命令按如下格式返回你的当前用户 ID：\n\n```\n$ whoami\nuser\n```\n\n### users, who\
  \ and w\n`who` 命令显示当前登录到你的 Linux 系统的用户。输出的第一列以用户的登录名开始。紧接着是终端名称，其中 `console` 代表登录终端，`pts`\
  \ 是伪终端会话（pseudo-terminal session）的缩写。最后两列包含登录时间和用户所在的主机名。\n\n```\n$ who\nuser console\
  \ 2020-08-20 09:36 (:0)\nuser pts/2 2020-08-20 09:47 (:0)\nuser pts/3 2020-08-20\
  \ 09:47 (:0)\n```\n\n`w` 通过增加额外信息扩展了 `who` 的输出。`w` 的单列包含用户的登录名（`LOGIN`）、终端名称（`TTY`）、用户所在的主机名（`FROM`）、登录时间（`LOGIN@`）、空闲时间（`IDLE`）、CPU\
  \ 使用率（`JCPU` 和 `PPU`）以及用户执行的最后一个命令（`WHAT`）。\n\n相比之下，`users` 仅以空格分隔列表单行输出用户名。\n\n\
  ```\n$ users\nuser user user\n```\n\n### id and groups\n`id` 命令输出当前用户的用户组信息（见下文）。从左到右，列显示用户\
  \ ID（`UID`）、组 ID（`GID`）以及用户所属的组名。\n\n```\n$ id\nuid=1000(user) gid=1000(user) groups=1000(user),\
  \ 24(cdrom), 25(floppy), 29(audio), 30(dip), 44(video), 46(plugdev), 108(netdev),\
  \ 111(bluetooth)\n```\n\n要列出用户所属的所有组名，你也可以调用 `groups` 命令。输出是组名的空格分隔列表。\n\n```\n\
  $ groups\nuser cdrom floppy audio dip video plugdev netdev bluetooth\n```\n\n###\
  \ passwd\n如第 4 章所述，Linux 系统至少有两个用户：一个管理员 root 用户和一个我们简称为 `user` 的普通用户。每个账户也通过密码进行保护。\n\
  \n要更改密码，请使用 Debian `passwd` 软件包中的 `passwd` 命令。如下所示，首先输入当前密码，按回车，然后输入新密码，按回车确认，再次输入新密码并按回车再次确认。\n\
  \n```\n$ passwd\nChanging password for user.\n(current) UNIX password:\nEnter new\
  \ UNIX password:\nRetype new UNIX password:\npasswd: password updated successfully\n\
  ```\n\n作为普通用户，你只被允许更改自己的密码。管理员 root 用户也可以为自己和其他用户设置新密码。在这种情况下，我们通过添加用户名来调用 `passwd`。\n\
  \n```bash\n# passwd felix\nChanging password for felix.\n(current) UNIX password:\n\
  Enter new UNIX password:\nRetype new UNIX password:\npasswd: password updated successfully\n\
  ```\n\n# 密码以哈希值存储在名为 `/etc/shadow` 的文件中。该文件的内容对管理员用户可见。下面的示例显示了如何借助 `grep` 命令提取用户\
  \ `user` 的信息。\n\n```\n$ grep user /etc/shadow\nuser:$6$R$17763:0:9999:7:::\n```\n\
  \n# chfn\n此命令同样来自 Debian `passwd` 软件包，用于更改存储在系统 `/etc/passwd` 中的用户信息。基础设置在安装 Debian\
  \ 系统时已经完成。要修改这些信息，你可以在交互模式下不带进一步参数运行 `chfn`，或带有以下一个或多个选项来适配特定值：\n\n- `-f` 或 `--full-name`：更改用户的全名。\n\
  - `-h` 或 `--home-phone`：更改用户的家庭电话。\n- `-r` 或 `--room`：更改用户的房间号。\n- `-w` 或 `--work-phone`：更改用户的办公电话。\n\
  \n下面的示例将家庭电话更改为 135：\n\n```\n$ chfn -h 135\nPassword:\n```\n\n# chsh\n此命令（同样来自 Debian\
  \ `passwd` 软件包）更改你用于登录 Linux 系统的 shell。同样，这些信息存储在 `/etc/passwd` 中。允许使用的 shell 决限于名为\
  \ `/etc/shells` 的配置文件中的项。`chsh` 的工作与 `chfn` 命令类似。不带进一步选项调用时，将使用交互式方法：\n\n```\n$\
  \ chsh\nPassword:\nChanging the login shell for user\nEnter the new value, or press\
  \ ENTER for the default\nLogin Shell [/bin/sh]: /bin/bash\n```\n\n要修改你本人其他用户的 shell，请将用户名作为参数调用\
  \ `chsh` 命令。注意，只有管理员可以为其他用户执行此操作。下一个示例显示了如何为用户 `felix` 执行。\n\n```bash\n# chsh felix\n\
  Changing the login shell for felix\n```\n\n\n\n\n输入新值，或按回车键使用默认值登录 shell [/bin/bash]:\n\
  \n# su 和 sudo\n\n要将角色从一个用户切换到另一个用户，可以使用 `su` 命令。`su` 是 switch user 的缩写。在不带其他选项的情况下调用，你可以如下切换到\
  \ root 用户：\n```bash\n$ su\n```\n密码：\n\n# 作为管理员 root 用户工作意味着着巨大的责任，并假设你清楚自己在做什么。若要以\
  \ root 以外的用户身份工作，请如下通过指定的用户名调用 `su` 命令：\n```bash\n$ su felix\n```\n密码：\n\n`su` 命令会永久更改当前角色。若只想以管理员身份运行单条命令，请使用\
  \ `sudo` 命令。这需要安装 Debian 的 `sudo` 软件包，并使用 `visudo` 命令将额外用户添加到配置文件 `/etc/sudoers`\
  \ 中。\n\n# adduser\n\n`adduser` 命令用于创建新用户账户。下面的示例了所需的信息。这包括在 `/etc/passwd` 文件中添加新条目，以及创建一个新组和主目录。此外，来自\
  \ `/etc/skel` 目录的预备数据会被复制到之前创建的主目录中。之后，使用 `chsh` 命令修改账户信息。\n\n```bash\n# adduser\
  \ caro\n```\n正在添加用户 'caro' …\n正在添加新组 'caro' (1002) …\n正在添加新用户 'caro' (1002) 组 'caro'\
  \ … 正在创建主目录 '/home/caro' …\n正在从 '/etc/skel' 复制文件…\n输入新的 UNIX 密码：\n重新输入新的 UNIX 密码：\n\
  passwd: 密码更新成功\n正在更改 caro 的信息\n输入新值，或按回车键使用默认值全名 []: Caro\n房间号 []:\n工作电话 []:\n家庭电话\
  \ []:\n其他 []:信息正确吗？[Y/n] y\n\n# 设置好新用户后，`/etc/passwd` 中的条目如下：\n```bash\n# grep caro\
  \ /etc/passwd\n```\ncaro:x:1002:1002:Caro, , , :/home/caro:/bin/bash\n\n```\n\n\
  # deluser\n\n删除用户账户通过 `deluser` 命令完成，而删除组可以通过 `delgroup` 完成。若要在不删除用户任何文件的情况下删除用户，请以\
  \ root 用户运行以下命令：\n```bash\n# deluser felix\n```\n`deluser` 命令有以下选项用于精调其执行：\n- `--group`:\
  \ 删除一个组，等同于 `delgroup`。\n- `--system`: 仅当用户为系统用户时才删除。\n- `--backup`: 将用户主目录中的文件备份到名为\
  \ `/$user.tar.gz` 或 `/$user.tar.bz2` 的文件中。\n- `--backup-to`: 将主目录中的文件备份到指定的文件。\n\
  - `--remove-all-files`: 删除系统中所有属于该用户的文件。如果指定了备份，将在执行备份后删除文件。\n\n```bash\n# deluser\
  \ --remove-all-files felix1\n```\n\n# 文件系统\n\n文件系统是控制数据如何在驱动器存储存储。如果数据没有结构化，将无法知道特定条目何时结束以及下一个条目何时开始。文件系统将数据分成部分，每个部分都有唯一的名称。通过这种方式，信息可以被隔离和识别。文件系统上的每组数据被称为条目（entry）。文件系统中的条目可以是文件、目录（也称为文件夹）、引用（也称为链接）、套接字和\
  \ fifo（也称为命名管道）。\n\n文件系统中的每个条目包含以下相关信息：\n- `name`: 条目的名称。\n- `permissions`: 哪个用户是条目的所有者，并允许读取、写入和执行该条目。\n\
  - `creation time, last modified time, last access time`: 条目最后一次创建、修改或访问的时间。\n- `file\
  \ size, number of blocks, IO blocks`: 该条目在文件系统中需要多少磁盘空间。\n- `inode number`: index\
  \ node 的缩写，指的是数据条目开始的块号。\n- `number of symlinks`: 指向该条目的引用或符号链接的数量。\n\n你可以使用 `stat`\
  \ 命令获取上述信息。`stat` 是 Debian 软件包 `coreutils` 的一部分，仅需要检查条目的名称。下面的示例显示了文件 documentation.pdf\
  \ 的信息。\n\n```bash\n$ stat documentation.pdf\nFile: documentation.pdf Size: 512 Blocks:\
  \ 8 Device: 808h/2056d Access: (0644/-rw-r--r--) Access: 2020-09-04 18:44:30.071901792\
  \ -0400\nModify: 2020-09-04 18:44:22.358157773 -0400\nChange: 2020-09-06 18:08:14.528658813\
  \ -0400\nBirth:\n```\n\n$Midnight Commander (mc) 也会以略微精炼的方式显示这些信息：\nIO Block: 4096\
  \ regular file Inode: 260927 Links: 1\n\n\n\n\n\nUid: (0/root) Gid: (0/root)!\n\n\
  此外，在 XFCE 桌面上右键点击文件图标，会打开属性窗口，显示日常使用所需的大部分信息。\n\n## 11.1 常用文件系统类型\n\n有很多文件系统非常流行并广泛使用。包括\
  \ `FAT`、`ext2`、`ext3`、`ext4`、`JFS`、`XFS`、`ZFS`、`ReiserFS` 和 `SWAP`。让我们详细查看每一个。\n\
  \n### 文件分配表 (FAT)\nFAT 于 1977 年引入软盘，随后在 DOS 和 Microsoft Windows 9X 时代被用于硬盘。直到今天，它几乎被所有的操作系统支持，并且作为不同系统之间的数据传输媒介非常有用。它通常用于\
  \ USB 闪存器等外部介质。原始的 `FAT` 系统仅为 8 位系统，最大文件大小为 8MB，支持 6:3 的文件名且没有子目录。`FAT` 有 3 种主要变体：\n\
  \n- `FAT12` - 12 位文件分配表。支持 4KB 簇最大 16MB 的卷大小，或 8KB 簇最大 32MB 的卷大小。\n- `FAT16` - 16\
  \ 位文件分配表。支持 32KB 簇最大 2GB 的卷大小，或 64KB 簇最大 4GB 的卷大小。文件名必须是 8:3 格式的 OEM 字符或 256 UCS\
  \ 字符。\n- `FAT32` - 支持 512B 扇区最大 2TB、2KB 扇区和 32K 簇最大 8TB，或 4KB 扇区和 64K 簇最大 16TB。文件名必须是\
  \ 8:3 格式的 OEM 字符或 256 UCS 字符。\n\n### 第二扩展文件系统 (ext2)\n这是 Linux 的第一个消费级文件系统，在 `ext3`\
  \ 于 2001 年成为主流之前，它是 RedHat 和 Debian 等 Linux 发行版的默认文件系统。今天，它仍然用于数字内存卡等存储设备，因为在这些设备上不需要\
  \ `ext3` 或 `ext4` 的日志功能。这可以提高性能并尽量减少写入次数。\n\n### 第三扩展文件系统 (ext3)\n`ext3` 是 `ext2`\
  \ 的日志版本，可以直接从 `ext2` 升级，而无需备份和恢复操作。`ext3` 的速度没有 `ext4`、`JFS`、`XFS` 或 `ReiserFS`\
  \ 快，但它使用的 CPU 资源比 `ReiserFS` 或 `XFS` 少。`ext3` 支持最大 16GB 的文件和 32TiB 的文件系统。\n\n###\
  \ 第四扩展文件系统 (ext4)\n`ext4` 是 `ext3` 的扩展，具有额外的功能，如大文件系统支持。它支持最大 16TiB 的文件和 1EiB 的文件系统。此外，它还具有“区”（extents）特性。区是一个连续的块范围，这使得处理超大文件更加高效。\n\
  \n### 日志文件系统 (JFS)\n`JFS` 最初为 IBM 的 AIX Unix 操作系统开发，后来移植到 OS/2。`JFS` 是一个完全的 64 位文件系统，使用区，支持无限的小文件以及高达\
  \ 4 PB 的大文件。它是极大型文件系统的理想选择。\n\n### XFS\n`XFS` 是 Silicon Graphics (SGI) 于 1993 年为\
  \ IRIX 操作系统开发的日志文件系统。它将物理卷划分为分配，允许更高效的并行 I/O 和文件系统带宽，并支持高达 8EiB 的大文件。\n\n### ZFS\n\
  泽字节文件系统 (`ZFS`) 结合了文件系统和逻辑卷管理器 (`LVM`)。由 SUN Microsystems 于 2005 年发布，它具有扩展性，并包含了针对数据损坏的广泛保护、对高存储容量的支持、高效的数据压缩、文件系统与卷管理的集成、快照和写时复制复制、连续完整性检查和自动修复、RAID-Z\
  \ 以及针对网络文件系统 (`NFS`) 第 4 版本的原生访问控制列表 (`ACLs`)。`OpenZFS` 和 `ZFS on Linux` 两个项目继续该文件系统的开发。\n\
  \n### ReiserFS\n`ReiserFS` 是一种通用日志文件系统，使用基于 B+树的 Apple 分区映射来管理目录内容。`ReiserFS` 版本\
  \ 3 是 SUSE、Elive、Xandros、Linspire 和 YOPER 发行版的默认文件系统。对 `ReiserFS` 版本 4 的支持已下降到除了与较新的\
  \ Linux 内核兼容外，开发已停止。\n\n### 交换空间 (Swap Space)\nLinux 使用交换空间在内存页空闲时将其交换出。用户无法访问交换空间，且不能用于普通文件存储。交换空间的使用建议如下：\n\
  \n- **桌面系统** - 使用系统总内存的 2 倍。这样当同时运行许多大型程序时，未使用的内存可以保存到磁盘，使程序运行得更高效。\n- **服务器系统**\
  \ - 使用总内存的 0.5 倍。服务器不应进行大量的交换，一半内存就足够。\n- **内存小于 1GB 的旧系统** - 使用尽可能多的交换空间，因为系统需要大量的交换才能高效运行。\n\
  \n除了使用独立的交换分区外，也可以使用交换文件。这是通过 `dd` 在现有分区上创建一个固定大小的文件来实现的。这种方法的优点是不需要固定的交换分区，以后可以为了效率调整其大小。\n\
  \n## 11.2 文件系统命令\n\n以下命令用于管理文件系统：\n\n- `fdisk` 和 `cfdisk` - 显示、创建和删除驱动器带有文件系统的分区。\n\
  - `mkfs` - make file system 的缩写，创建一个文件系统。\n- `mkswap` - make swap 的缩写，创建一个交换文件系统。\n\
  - `badblocks` - 显示文件系统上的坏块。\n- `fsck` - file system check 的缩写，检查并修复 Linux 文件系统。\n\
  - `dumpe2fs` - 显示文件系统的信息。\n- `file` - 确定文件系统中条目的类型。\n- `link` 和 `unlink` - 创建和删除文件的链接。\n\
  - `ln` - link 的缩写，创建硬链接和软链接。\n- `ls` - 显示条目（文件、目录、链接、套接字或 fifo）的信息。\n- `lsof` -\
  \ 显示打开的文件列表。\n- `stat` - 显示条目保留的所有信息。\n- `sync` - 将驱动缓存与磁盘同步。\n- `mount` 和 `umount`\
  \ - 启用或禁用带有文件系统的设备。\n- `tune2fs` - 调整 `ext2`、`ext3` 和 `ext4` 文件系统上的参数。\n\n## 11.3\
  \ 实际示例\n\n在下面的示例中，我们将查看如何使用上面过的命令。我们将模拟一个内存磁盘，在其上面创建一个适当的文件系统，将其挂载并在其上存储数据。首先，我们将使用\
  \ `dd` 创建一个大小为 10MB 的文件，如下：\n\n```bash\n$ dd if=/dev/zero of=memory.image bs=512b\
  \ count=40\n```\n\n该文件只包含零，因为数据是从名为 `/dev/zero` 的设备读取的，该设备只返回零 (`if=/dev/zero`)。输出以\
  \ 512 字节的块大小写入 40 次到 `memory.image` 文件。下面的示例显示了 `dd` 的输出以及使用 `ls` 查看输出文件的大小。\n\n\
  ```bash\n$ dd if=/dev/zero of=memory.image bs=512b count=40\n40+0 records in\n40+0\
  \ records out\n10485760 bytes (10 MB, 10MiB) copied, 0.0156379 s, 671 MB/s\n\n$\
  \ ls -lah memory.image\n-rw-r--r-- 1 user user 10M Sep 9 05:28 memory.image\n```\n\
  \n接一步，我们使用 `mkfs.ext4` 命令在该文件上创建一个 `ext4` 文件系统：\n\n```bash\n$ /sbin/mkfs.ext4 memory.image\
  \ 10M\nmke2fs 1.43.4 (31-Jan-2017)\nDiscarding device blocks: done\nCreating filesystem\
  \ with 10240 1k blocks and 2560 inodes\nFilesystem UUID: 52c89176-a665-48b3-9bf6-2abb9b2ad721\n\
  Superblock backups stored on blocks:8193\nAllocating group tables: done\nWriting\
  \ inode tables: done\nCreating journal (1024 blocks): done\nWriting superblocks\
  \ and filesystem accounting information: done\n```\n\n\n\n\n\n`-rw-r--r-- 1 user\
  \ user 10M Sep 9 05:40 memory.image`\n\n这产生了一个具有 10240 个 1K 块的文件系统，可以容纳 2560 个项目。接下来，我们使用\
  \ `mkdir` 命令创建一个挂载点：\n\n```bash\nmkdir /tmp/image\n```\n\n`mount` 命令通过如下方式集成镜像：\n\
  \n```bash\nsu\nPassword:\n# mount memory.image /tmp/image\n```\n\n现在我们可以在挂载的设备上存储数据了。在这里，`cp`\
  \ 命令派上了用场。`cp` 命令用于复制文件。为了正常操作，它需要两个名称：原始文件名和副本名。原始文件不会被触动保持完。副本的内容与原始文件相同，但具有当前的时间戳。使用选项\
  \ `-i`（或 `--interactive`）可以防止覆盖现有文件。在示例中，我们使用 `cp -v` 来产生额外的输出。\n\n```bash\nsu\n\
  Password:\n# cp -v documentation.pdf /tmp/image/.\n\n'documentation.pdf' -> '/tmp/image/./documentation.pdf'\n\
  \n# ls /tmp/image/\n\ndocumentation.pdf lost+found\n\n# sync\n\n# umount /tmp/image\n\
  ```\n\n在卸载设备之前，执行 `sync` 以清除缓存并将数据写入磁盘。最后，我们可以按照如下方式卸载文件系统：\n\n```bash\numount /tmp/image\n\
  # exit\n```\n\n# 12. 磁盘存储管理\n\n在本章中，我们将介绍如何处理存储设备和文件系统，这包括设备命名、分区类型和方案，以及分区的挂载和卸载。\n\
  \n## 12.1 设备命名\n\n在 Linux 中，一切皆文件，目录是一个文件，设备也是一个文件。系统上的每个驱动器都表示为 `/dev` 文件夹内部的块设备。当系统启动时，会运行\
  \ `udev` 服务，它会检测 `/dev` 中的所有设备并据此进行相应的挂载。\n\n在 `/dev` 内部，IDE 驱动器的名称从 `hda`、`hdb`\
  \ 直到 `hdp`。其他设备类型如 SCSI、USB、SATA 和 PATA 表示为 `sda`、`sdb` 直到 `sdp`。CD 或 DVD 驱动器等设备接收如\
  \ `cdrom` 或 `dvd` 的标签，而 SD 卡通常被标记为 `mmcblk`。\n\n如果一个驱动器要在系统中运行，必须至少有一个分区。一个驱动器最多可以有\
  \ 16 个分区，每个分区都有自己的文件系统。在每个设备内部，设备 `/dev/sda` 的分区被标记为 `sda1`、`sda2` 直到 `sda16`。Linux\
  \ 的限制是十六个驱动器，每个驱动器十六个分区。\n\n## 12.2 主分区、扩展分区和逻辑分区\n\n每个驱动器可以有四个主分区，或者三个主分区和一个扩展分区。此外，扩展分区可以包含最多十六个逻辑分区。如果系统仅包含四个主分区，它们如下所示编号为\
  \ `sda1` 到 `sda4`：\n\n```\n/dev/sda1\n/dev/sda2\n/dev/sda3\n/dev/sda4\n```\n\n如果系统包含三个主分区和一个扩展分区（其中包含逻辑分区），主分区\
  \ `sda4` 将消失并被逻辑分区 `sda5`、`sda6`、`sda7` 等取代：\n\n```\n/dev/sda1\n/dev/sda2\n/dev/sda3\n\
  /dev/sda5\n/dev/sda6\n/dev/sda7\n```\n\n第一个逻辑分区始终编号为 `sda5`。因此，即使主分区少于三个，它们的编号也如下：\n\
  \n```\n/dev/sda1\n/dev/sda5\n/dev/sda6\n```\n\n要查看分区结构，来自 `util-linux` 包的 `lsblk`\
  \ 命令非常有帮助。`lsblk` 是 list block devices（列出块设备）的缩写。该命令可以输出所有使用的块设备（如下例所示）以及所有未使用的设备（如下例例所示）。\n\
  \n![](img/image_rsrc2G1.jpg)\n\n这七列代表以下信息：\n\n![](img/image_rsrc2G2.jpg)\n\n- `NAME`\
  \ - 设备的名称。\n- `MAJ:MIN` - 设备的主号和次号。\n- `RM` - 如果设备是固定的则为 0，如果设备可以移除则为 1。\n- `SIZE`\
  \ - 人类可读格式的设备大小。\n- `RO` - 如果设备是只读的为 1，否则为 0。\n- `TYPE` - 设备类型。Loop 代表回环设备，disk\
  \ 代表硬硬盘，part 指磁盘的分区，lvm 是由逻辑卷管理器 (LVM) 运行的分区，rom 指 CD/DVD 罗马。\n- `MOUNTPOINT` -\
  \ 列出设备挂载到的目录。\n\n要列出已挂载的文件系统，请使用 `mount` 命令或 `findmnt` 命令。这两个命令都是 `mount` 包的一部分。在不带进一步选项的情况下调用，`findmnt`\
  \ 会打印所有挂载的文件系统。这个列表可能很长。为了只选择 `ext4` 文件系统，可以使用选项 `-t ext4`（`--type ext4` 的缩写）。\n\
  \n四个输出列包含以下信息：\n\n![](img/image_rsrc2G9.jpg)\n\n- `TARGET` - 挂载点，即系统中设备挂载到的目录。\n\
  - `SOURCE` - 设备名称。\n- `FSTYPE` - 文件系统类型。\n- `OPTIONS` - 用于挂载设备时使用的选项。\n\n## 12.3\
  \ udev, df 和 du\n\n`udev` 是用户空间 `/dev` 的缩写，是 Linux 内核的设备管理器。一旦 `udev` 运行，它找到的驱动器将显示在\
  \ `/dev/disk` 目录。它包含几个下面列出的带有符号链接的子目录。注意，子目录的数量取决于 Linux 版本并取决于 Linux 内核的版本。每当 Linux\
  \ 系统识别磁盘时，信息就会显示在这里。我们可以使用这些信息找到哪些挂载点正在使用。\n\n`/dev/disk/by-id`\n\n显示显示 Linux 看到的分区名称以及指向它们的挂载点。\n\
  \n```bash\n# ls -al /dev/disk/by-id\ntotal 0\ndrwxr-xr-x 2 root root 220 Sep 5 07:14\
  \ .\ndrwxr-xr-x 7 root root 140 Sep 5 07:14 ..\nlrwxrwxrwx 1 root root 9 Sep 5 07:14\
  \ ata-VBOX_CD-ROM_VBO01f00…/sr0\nlrwxrwxrwx 1 root root 9 Sep 5 07:14 ataVBOX_HARDDISK_VBb9372…/sda\n\
  lrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part1…/sda1\nlrwxrwxrwx 1\
  \ root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part2…/sda2\nlrwxrwxrwx 1 root root\
  \ 10 Sep 5 07:14 ataVBOX_HARDDISK…part3…/sda3\nlrwxrwxrwx 1 root root 10 Sep 5 07:14\
  \ ata-VBOX_HARDDISK…part5…/sda5\nlrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part6…/sda6\n\
  lrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part7…/sda7\nlrwxrwxrwx 1\
  \ root root 9 Sep 5 07:14 ataVBOX_HARDDISK…\n```\n\n`/dev/disk/by-path`\n\n显示硬件定义以及哪些挂载点指向它们。\n\
  \n```bash\n# ls -al /dev/disk/by-path\ntotal 0\ndrwxr-xr-x        0 00:110\ndrwxr-xr-x\
  \ 7  root 140  5 07:14 ..\n1wxrwxrwx 1  root 9  5 07:14 ata-VBOX_CD-ROM_VBO01f00…/sr0\n\
  lrwxrwxrwx 1 root root 9 Sep 5 07:14 ataVBOX_HARDDISK_0b9372…/sda\nlrwxrwxrwx 1\
  \ root root 10 Sep 5 07:14 ataVBOX_HARD0…part1…/sda1\nlrwxrwxrwx 1 root root 10\
  \ Sep 5 07:14 ataVBOX_HARDDISK…part2…/sda2\nlrwxrwxrwx 1 root root 10 Sep 5 07:14\
  \ ataVBOX_HARDDISK…part3…/sda3\nlrwxrwxrwx 1 root root 10 Sep 5 07:14 ata-VBOX_HARDDISK…part5…/sda5\n\
  lrwxrwxrwx 1 root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part6…/sda6\nlrwxrwxrwx 1\
  \ root root 10 Sep 5 07:14 ataVBOX_HARDDISK…part7…/sda7\nlrwxrwxrwx 1 root root\
  \ 9 Sep 5 07:14 ataVBOX_HARDDISK…\n```\n\n`/dev/disk/by-label`\n\n显示标签应用到了哪些挂载点。\n\
  \n```bash\n# ls -al /dev/disk/by-label\ntotal 0\ndrwxr-xr-x 2 root root 220 Sep\
  \ 5 07:14 .\ndrwxr-xr-x 7 root root 140 Sep 5 07:14 ..\nlrwxrwxrwx 1 root root 9\
  \ Sep 5 07:14 home -> ../sda7\nlrwxrwxrwx 1 root root 9 Sep 5 07:14 root -> ../sda1\n\
  lrwxrwxrwx 1 root root 9 Sep 5 07:14 tmp -> ../sda5\nlrwxrwxrwx 1 root root 9 Sep\
  \ 5 07:14 var -> ../sda6\n```\n\n`/dev/disk/by-uuid`\n\n显示每个挂载点的 UUID 标签。\n\n```bash\n\
  # ls -al /dev/disk/by-uuid\ntotal 0\ndrwxr-xr-x 2 root root 220 Sep 5 07:14 .\n\
  drwxr-xr-x 7 root root 140 Sep 5 07:14 ..\nlrwxrwxrwx 1 root root 10 Sep 5 07:14\
  \ 9ef7106a-c885-4cbeaaaa…/sda2\nlrwxrwxrwx 1 root root 10 Sep 5 07:14 808e…/sda7\n\
  lrwxrwxrwx 1 root root 10 Sep 5 07:14 d2f4fd43-4f76-414c9afa…/sda6\nlrwxrwxrwx 1\
  \ root root 10 Sep 5 07:14 9192…/sda1\nlrwxrwxrwx 1 root root 10 Sep 5 07:14 b1f6…/sda5\n\
  ```\n\n`/dev/disk/by-partuuid`\n\n这是 GUID 分区表 (GPT) 的一个组件，它是主引导记录 (MBR) 相关的磁盘分区的替代方案。\n\
  \n\n\n\n调用 `df` 和 `du` 命令查看哪些文件系统已挂载，以及使用了多少块空间和剩余多少块空间。`df` 是 disk free（磁盘剩余）的缩写。该命令提供了多种选项：![](img/image_rsrc2GD.jpg)\n\
  `df -h`: 以人类可读的格式列出![](img/image_rsrc2GE.jpg)\n`df -k`: 以 KB 为单位列出![](img/image_rsrc2GF.jpg)\n\
  `df -m`: 以 MB 为单位列出![](img/image_rsrc2GG.jpg)\n`df`: 以默认的块大小列出。有时这会使用 500KB，可能会引起混淆。\n\
  \n![](img/image_rsrc2GH.jpg)同样，`du`（磁盘 usage）计算目录占用的磁盘空间。常规输出会列出每个条目的值，可能会让人感到困惑。要获取目录的摘要，可以在命令行调用中增加三个参数：`-s`（摘要）、`-c`（总计）和\
  \ `-h`（人类可读）。\n\n## 12.4 挂载文件系统\n在使用文件系统之前，必须将其挂载为目录树的一部分。大多数情况下，这在启动时自动完成，但也可以手动完成。我们在上一章的末尾简要查看了用于手动挂载的命令，但在这里我们将更详细地介绍它们的用法。\n\
  \n为了演示，我们将第二个 SCSI 磁盘的第一个分区（`/dev/sdb1`）挂载到 `/space`。首先，为了挂载文件系统，你必须是 root 用户。接下来，如果目录\
  \ `/space` 尚不存在，我们必须使用 `mkdir` 创建它，如下：\n\n```bash\nmkdir /space\n```\n\n然后运行 `mount`\
  \ 命令包含此目录：\n\n```bash\nmount /dev/sdb1 /space\n```\n大多数情况下，Linux 会自动检测文件系统类型。如果不是如此且没有自动检测类型，请使用\
  \ `-t` 参数（`type` 的缩写）后跟文件系统类型名称强制指定。此步骤假设相关的文件系统类型已安装并被 Linux 内核识别。要列出 Linux 内核支持的所有文件系统，可以使用如下所示\
  \ `cat`、`awk`、`sed`、`ls` 和 `sort` 命令的组合。\n\n在尚未讨论的命令中，`sort` 用于按指定顺序排序文件，将在第 7 章中详细讨论。除了这个示例外，我们不会对\
  \ `awk` 和 `sed` 进行细节，因为这超出了本指南的范围。在这个示例中，它们基本上被用于清理数据以便更易使用。\n\n```bash\ncat /proc/filesystems\
  \ | awk '{print $NF}' | sed '/^$/d'; ls -1 /lib/modules/$(uname -r)/kernel/fs |\
  \ sort -u\n```\n\n9p\nadfs\naffs\nafs\naufsautofs\nautofs4\nbdev\nbefs\nbfs\nbinfmt_misc\n\
  binfmt_misc.ko\nbtrfs\ncachefiles\nceph\n...\n以下命令扩展了上述命令，以便使用 `ext3` 文件系统将第二个 SCSI\
  \ 磁盘的第一个分区（`/dev/sdb1`）挂载到 `/space`：\n\n```bash\nmount -t ext3 /dev/sdb1 /space\n\
  ```\n\n## 12.5 卸载文件系统\n如果文件系统正忙或在使用中，则无法卸载。要找出哪些程序正在使用该文件系统，来自 `lsof` 软件包的 `lsof`\
  \ 命令派上了用场。`lsof` 是 list of open files（打开文件列表）的缩写。下面的示例演示了如何使用该命令，并展示了目录 `/home/user/Music`的情况![](img/image_rsrc2GJ.jpg)\n\
  这将提供使用该目录的程序列表。此外，如果用户在该目录下工作，你必须使用 `cd` 命令切换目录。要卸载我们在上一节中挂载的目录 `/space`，你必须再次以\
  \ root 用户登录。接下来，通过命令 `lsof /space` 测试是否有其他程序正在使用 `/space`。如果有程序正在运行，停止它们并重试。同时，确保没有终端连接到\
  \ `/space`。\n\n```bash\nsu\nPassword:\n# lsof /space\n...\n```\n\n然后输入 `umount /space`。如果你没有收到错误消息，说明\
  \ `/space` 已成功卸载。或者，运行带有 `-v` 参数（`verbose` 的缩写）的 `umount` 命令来查看事务消息。最后，输入 `df -k`\
  \ 查看新的分区状态。\n\n```bash\numount /space\n# exit\n```\n\n## 12.6 自动化挂载点\n要在系统启动时自动挂载挂载点，请在配置文件\
  \ `/etc/fstab` 中添加条目。`fstab` 是 file system table（文件系统表）的缩写。下面的示例显示了配置文件的内容：\n\n\
  ```bash\n# cat /etc/fstab\n\n# /etc/fstab:静态文件系统信息。\n#\n# 使用 'blkid' 打印设备的唯一标识符；\n\
  # 这可以配合 UUID= 使用更稳健的方法来命名设备\n# 即使在磁盘被添加或删除时也能工作。请参见\n# fstab(5)。\n#\n# <file system><mount\
  \ point><type><options><dump><pass>\n# / 在安装期间位于 /dev/sda1\nUUID=dc78e6f6-8a4f-4be0-9192-e4ca37838765\
  \ / ext4 errors= 0 1defaults 0 2\n# /home 在安装期间位于 /dev/sda7\nUUID=ac2823cc-a7b4-4bf3-808e-e13401e11eaf\
  \ /home ext4\n# /tmp 在安装期间位于 /dev/sda5\nUUID=faef6770-b865-43d2-b1f6-56352413d7c4\
  \ /tmp ext4 defaults 0 2\n# /var 在安装期间位于 /dev/sda6\nUUID=d2f4fd43-4f76-414c-9afa-6a53d4cd1d9c\
  \ /var ext4 defaults 0 2\n# swap 在安装期间位于 /dev/sda2\nUUID=9ef7106a-c885-4cbe-aaa1-8e2b77ee73cf\
  \ none swap sw 0 0\n/dev/sr0/media/cdrom0 udf,iso9660 user,noauto 0 0\n```\n\n文件\
  \ `/etc/fstab` 中的列列（字段）为：\n\n![](img/image_rsrc2GK.jpg)\n`filesystem` - 指定 UUID\
  \ (`UUID=xxxxx`)、名称 (`/dev/sdb1`) 或文件系统的标签 (`LABEL=home`)。![](img/image_rsrc2GM.jpg)\n\
  `mount point` - 定义文件系统挂载的目录。![](img/image_rsrc2GN.jpg)\n`type` - 允许的文件系统类型的逗号分隔列表。![](img/image_rsrc2GP.jpg)\n\
  `options` - 选项的逗号分隔列表。![](img/image_rsrc2GR.jpg)\n`dump` - 文件中的备份信息，0 = 关闭，1 = 开启![](img/image_rsrc2GS.jpg)\n\
  `pass` - 文件系统检查的顺序，从 1 开始。0 表示最后。请注意单列之间用制表符分隔，空格无法正常工作。提示：要查找挂载点的 UUID，请查看 `/dev/disk/by-uuid`。\n\
  \n要添加一个自动挂载的设备，只需通过添加行来扩展 `/etc/fstab` 文件。为了在启动时使用 `ext3` 文件系统将分区 `/dev/sdb1` 挂载为\
  \ `/space`，在旧版系统上添加此行：\n\n```text\n/dev/sdb1 /space ext3 defaults 0 0\n```\n\n在支持\
  \ UUID 的现代系统上，使用以下行。注意将 `7ca005b2-a7ff-4757-bfdf-81004d4072ef` 的值替换为你分区的 UUID：\n\
  ```text\nUUID=7ca005b2-a7ff-4757-bfdf-81004d4072ef /space ext3 defaults 0 0\n```\n\
  现在 `/dev/sdb1` 将在启动时始终挂载为 `/space`。你可能奇怪使用 UUID 有什么好处。通过使用 UUID，分区被清晰地识别，即使磁盘顺序发生变化。要生成\
  \ UUID（或重新生成一个新的），请使用 `uuidgen` 命令行工具。\n\n## 12.7 设置新分区\n`fdisk` 及其对应工具 `cfdisk`\
  \ 和 `gparted` 的理念是查看磁盘上的分区并添加、删除或编辑分区。在本节中，我们将查看 `fdisk`，它是 Debian 的标准软件包，在所有主流\
  \ Linux 发行版中均可用。`cfdisk` 和 `gparted` 都是非标准软件包，可能需要单独安装。我们在第 4 章和第 14 章中讨论了额外软件包的安装。\n\
  \n要使用 `fdisk`，root 用户输入 `fdisk` 后跟驱动器名称。接下来的示例展示了名为 `/dev/sda` 的第一个 SCSI 磁盘。\n\n\
  ```bash\nfdisk /dev/sda\n```\n\n\n\n\n这将打开一个如下所示的屏幕。在命令行提示符处按 `p` 以打印分区：\n\n```bash\n\
  # fdisk /dev/sda\nWelcome to fdisk (util-linux 2.29.2).\n\n更改将仅保留在内存中，直到你决定写入它们。\n\
  \n在使用 `write` 命令之前务要小心。Command (m for help): p\n\nDisk /dev/sda: 30 GiB, 32212254720\
  \ bytes, 62914560 sectors\nUnits: sectors of 1 * 512 = 512 bytes\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel\
  \ type: dos\nDisk identifier: 0x2e4f25d8\nDevice Boot Start End Sectors Size Id\
  \ Type\n/dev/sda1 * 2048 7813119 7811072 3.7G 83 Linux\n/dev/sda2 7813120 11718655\
  \ 3905536 1.9G 82 Linux swap\n/dev/sda3 11720702 62912511 51191810 24.4G 85 Extended\n\
  /dev/sda5 11720704 12695551 974848 476M 83 Linux\n/dev/sda6 12697600 32227327 19529728\
  \ 9.3G 83 Linux\n/dev/sda7 32229376 62912511 30683136 14.6G 83 Linux\n```\n\n要获取可用命令列表，输入\
  \ `m`，将出现屏幕。使用 `q` 退出 `fdisk`。Command (m for help): m\n\nHelp:\nDOS (MBR)\na 切换启动标记\n\
  b 编辑嵌套 BSD 磁盘标签\nc 切换 dos 兼容性标记\nGeneric\nd 删除分区\nF 列出空未分区空间\nl 列出已知分区类型\nn 添加新分区\n\
  p 打印分区表\nt 更改分区类型\nv 验证分区表\ni 打印分区信息\nMisc\nm 打印此菜单\nu 更改显示/输入单位\nv 额外功能（专家专用）\n\
  Script\nI 从 `sfdisk` 脚本文件加载磁盘布局\nO 将磁盘布局导出到 `sfdisk` 脚本文件\nSave & Exit\nw 将表写入磁盘并退出\n\
  q 不保存更改退出\nCreate a new label\ng 创建新的 GPT 分区表\nG 创建新的 SGI (IRIX) 分区表\no 创建新的 DOS\
  \ 分区表\ns 创建新的 Sun 分区表\n\n### 创建新分区\n\n对于第二个 SCSI 磁盘，按如下方式启动 `fdisk`：\n\n```bash\n\
  # fdisk /dev/sdb\n```\n\n输入 `n` 创建新分区类型。首先 `fdisk` 询问我们是否想创建一个主分区或扩展分区。我们选择 `p`\
  \ 作为主分区。然后我们被要求选择分区号。我们选择 `1` 作为第一个分区。接下来，它询问大小。默认情况下，`fdisk` 会填充整个磁盘并使用所有可用空间。我们选择\
  \ `+4GB` 创建一个 4GB 的分区。然后我们输入 `p` 打印结果以确认分区 `/dev/sdb1` 已创建。Command (m for help):\
  \ n\n\n```text\nPartition type\np primary (0 primary, 0 extended, 4 free)\ne extended\
  \ (逻辑分区的容器)\nSelect (default p): p\nPartition number (1-4, default 1): 1\nFirst\
  \ sector (2048-41943039, default 2048):\nLast sector, +sectors or +size{K,M,G,T,P}\
  \ (2048-41943039, default 41943039): +4G\nCreated a new partition 1 of type 'Linux'\
  \ and of size 4 GiB.Command (m for help): p\n```\n\n```text\nDisk /dev/sdb: 20 GiB,\
  \ 21474836480 bytes, 41943040 sectors\nUnits: sectors of 1 * 512 = 512 bytes\nSector\
  \ size (logical/physical): 512 bytes / 512 bytes I/O size (minimum/optimal): 512\
  \ bytes / 512 bytes\nDisklabel type: dos\nDisk identifier: 0x056efeb2\nDevice Boot\
  \ Start End Sectors Size Id Type\n/dev/sdb1 2048 8390655 8388608 4G 83 Linux\n```\n\
  \n现在让我们添加一个扩展分区。再次输入 `n` 创建新分区。这次我们从菜单中选择 `e` 作为扩展分区，并按回车使用默认设置（分区 2）并填充所有剩余空间。然后输入\
  \ `p` 打印结果。在这里我们可以看到扩展分区 `/dev/sdb2` 已创建。Command (m for help): n\n\n```text\nPartition\
  \ type\np primary (1 primary, 0 extended, 3 free)\ne extended (逻辑分区的容器)\nSelect\
  \ (default p): e\nPartition number (2-4, default 2):\nFirst sector (8390656-41943039,\
  \ default 8390656):\nLast sector, +sectors or +size{K,M,G,T,P} (8390656-41943039,\
  \ default 41943039): +16G\nCreated a new partition 2 of type 'Extended' and of size\
  \ 16 GiB.Command (m for help): p\n```\n\n```text\nDisk /dev/sdb: 20 GiB, 21474836480\
  \ bytes, 41943040 sectors\nUnits: sectors of 1 * 512 = 512 bytes\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes I/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel\
  \ type: dos\nDisk identifier: 0x056efeb2\nDevice Boot Start End Sectors Size Id\
  \ Type\n/dev/sdb1 2048 8390655 8388608 4G 83 Linux\n/dev/sdb2 8390656 41943039 33552384\
  \ 16G 5 Extended\n```\n\n现在让我们创建一个交换空间。再次输入 `n` 创建新分区。这次没有空间可以创建主分区了，所以我们只能创建一个逻辑分区。我们使用默认的\
  \ `First Sector` 并为 `Last Sector` 选择 `+1G`，按回车使用默认值。输入 `p` 查看结果，我们可以看到逻辑分区 `/dev/sdb5`\
  \ 已创建。输入 `f` 显示驱动器上剩余剩余空间。Command (m for help): n\n\n```text\nAll space for primary\
