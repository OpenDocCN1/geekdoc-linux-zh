    这是 Linux shell 命令中使用字符范围的更多示例：


    - `[0-9]`：包含从 0 到 9 的所有数字字符。

    - `[a-z]`：包含从 a 到 z 的所有小写字母字符。

    - `[A-Z]`：包含从 A 到 Z 的所有大写字母字符。

    - `[abc]`：包含单个字符 "a"、b" 和 "c"。

    - `[!a-z]`：包含所有不是 a 到 z 小写字母的字符。


