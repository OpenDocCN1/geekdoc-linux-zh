    `>` 符号用于将命令的标准输出（stdout）重定向到文件，如果该文件已存在，则会覆盖文件内容。例如，以下命令将 `ls` 命令的输出重定向到名为 `directory_contents.txt`
    的文件：


    ![image](img/image-ZJAZCIVW.png)


    相比之下，`|` 符号用于在管道中将一个命令的输出连接到另一个命令的输入。例如，以下命令找到当前目录下所有扩展名为 `.txt` 的文件，然后按字母顺序对结果进行排序：


