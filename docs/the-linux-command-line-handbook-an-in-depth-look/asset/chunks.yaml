    # Anatomy Of A Prompt


    ![image](Images/image-8OLLAO0U.png)


    A prompt is a symbol or message that indicates to the user that the system is
    ready to receive commands. In Unix-like operating systems, the prompt is typically
    a text string that is displayed in the terminal or console window. The most common
    prompt is the shell prompt, which is displayed by the command shell (such as `Bash`
    or `Zsh`) and shows the current working directory, the username, the hostname,
    and the shell symbol (such as `$` or `#`).


    The prompt can be customized to suit the user''s preferences or requirements.
    Users can change the prompt''s appearance, add or remove information, and modify
    its behavior. This customization is done by setting the value of the `PS1` environment
    variable, which defines the prompt string.


    The `PS1` string can include various escape sequences that represent different
    types of information. For example, `\u` represents the username, `\h` represents
    the hostname, `\w` represents the current working directory, and `\n` represents
    a new line. By combining these escape sequences with other text and symbols, users
    can create a prompt that suits their needs and preferences.


    ![image](Images/image-KOJIXABG.png)


