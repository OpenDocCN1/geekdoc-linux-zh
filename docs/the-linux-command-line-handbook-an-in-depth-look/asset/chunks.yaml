    ## Modification Time and Filename


    Modification Time - The date and time when the file was last modified.


    Filename - The name of the file or directory.


    Here''s an example of what the long format output for the `ls` command might look
    like:


    ![image](Images/image-399J9JNC.png)


    In this example, the file `example.txt` has the following characteristics:


    - File type: `-rw-r--` indicates that the file is a regular file, and that the
    owner can read and write to the file, while members of the group and other users
    can only read the file.

    - Number of links: `"1"` indicates that the file has only one hard link.

    - Owner: `"user"` indicates that the file is owned by the user `user`.

    - Group: `"users"` indicates that the file belongs to the `users` group.

    - File size: `"12345"` indicates that the file is 12,345 bytes in size.

    - Modification time: `"Jan 1 10:00"` indicates that the file was last modified
    on January 1 at 10:00 AM.

    - Filename: `"example.txt"` indicates the name of the file.


    By mastering the use of the long format option for the `ls` command, you can gain
    greater insight into the contents of a directory and become a more effective Linux
