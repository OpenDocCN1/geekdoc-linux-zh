    ## Pathname Expansion


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    In Linux, "pathname expansion" refers to the process of automatically expanding
    special characters and symbols in pathnames to match files or directories in the
    file system. This can be a powerful tool for working with groups of files or directories
    that share a common pattern or naming convention.


    Some of the most commonly used characters for pathname expansion include:


    - `*` (asterisk): Matches any string of characters, including an empty string.

    - `?` (question mark): Matches any single character.

    - `[]` (brackets): Matches any single character in the specified set. For example,
    `[aeiou]` would match any vowel.

    - `{}` (braces): Generates a list of strings by expanding a comma-separated list
    of words. For example, `{one,two,three}` would expand to "one", "two", and "three".


    For example, suppose you have a directory containing a set of files named "file1",
    "file2", "file3", and so on. To list all of these files, you could use the following
    command:


    ![image](Images/image-APYAUC5S.png)


    This would expand the `file*` pattern to match all files that start with the string
    "file".


    Similarly, suppose you have a directory containing a set of files with names like
    "image001.jpg", "image002.jpg", and so on. To list all of these files, you could
    use the following command:


    ![image](Images/image-WN7XGTW1.png)


    This would expand the `image*.jpg` pattern to match all files that start with
    the string "image" and end with the `.jpg` extension.


    ![image](Images/image-KOJIXABG.png)


