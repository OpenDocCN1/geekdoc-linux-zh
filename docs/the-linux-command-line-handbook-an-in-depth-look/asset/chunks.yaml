    ## Mounting And Unmounting Storage Devices


    ![image](Images/image-8OLLAO0U.png)


    Mounting and unmounting storage devices is an essential task when working with
    a Linux system. When you connect a storage device to your computer, such as a
    USB flash drive or an external hard drive, you need to mount it in order to access
    its contents. Conversely, you need to unmount the device before unplugging it
    to prevent data loss.


    The `mount` command is used to mount a device, and the `umount` command is used
    to unmount it. To mount a device, you need to specify the device''s file system
    type, its device file name, and the mount point, which is the location in the
    file system where you want to mount the device.


    For example, to mount a USB flash drive with the `ext4` file system on the mount
    point `/mnt/usb`, you can use the following command:


    ![image](Images/image-NBLHZP9H.png)


    Here, `/dev/sdb1` is the device file name of the USB flash drive, and `sudo` is
    used to run the command with administrative privileges.


    To unmount the device, you can use the following command:


    ![image](Images/image-VTJUAA9J.png)


    This will unmount the device from the file system, and you can safely unplug it
    from your computer.


    It''sIt''s important to note that you should always unmount a device before unplugging
    it, as it ensures that all data has been written to the device and prevents data
    loss or corruption.


    ![image](Images/image-KOJIXABG.png)


    ## Viewing A List Of Mounted File Systems


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    To view a list of mounted file systems in Linux, you can use the `mount` command
    without any arguments. Open a terminal and enter the following command:


    ![image](Images/image-90791SUW.png)


    This will display a list of currently mounted file systems along with their device
    names, mount points, file system types, and other information.


    If you want to see more detailed information about the mounted file systems, you
    can use the `-v` option to enable verbose output:


    ![image](Images/image-ULKHSYEK.png)


    This will display additional information about each mounted file system, such
    as mount options and file system labels.


    You can also use the `-t` option to filter the output to show only file systems
    of a specific type. For example, to show only mounted `ext4` file systems, you
    can use the following command:


    ![image](Images/image-DPDB5JZY.png)![image](Images/image-KOJIXABG.png)


    ## Determining Device Names


    ![image](Images/image-8OLLAO0U.png)


    To determine the device name of a storage device in Linux, you can use various
    commands depending on the type of device.


    For example, if you want to determine the device name of a USB drive that you
    just plugged into your system, you can use the `dmesg` command to view the kernel
    messages related to the device. Open a terminal and enter the following command
    immediately after plugging in the USB drive:


    ![image](Images/image-77D4BM2T.png)


    This will display the last few kernel messages, including information about the
    USB drive such as its device name. The device name usually begins with `/dev/sd`
    followed by a letter indicating the drive and a number indicating the partition,
    such as `/dev/sdb1`.


    Alternatively, you can use the `lsblk` command to list all the available storage
    devices and their associated device names. Open a terminal and enter the following
    command:


    ![image](Images/image-TR7CF8W4.png)


    This will display a hierarchical view of all storage devices and their partitions
    along with their device names, mount points, and other information.


    If you are looking for the device name of a specific partition that is already
    mounted, you can use the `df` command to display the file system information for
    the mounted partition, which includes the device name. Open a terminal and enter
    the following command:


    ![image](Images/image-MPTGP3BA.png)


    Replace `/path/to/mount/point` with the actual mount point of the partition that
    you are interested in. This will display the file system information for the partition,
    including the device name.


    ![image](Images/image-KOJIXABG.png)


    ## Creating New File Systems


    ![image](Images/image-8OLLAO0U.png)


    Creating a new file system involves several steps, including partitioning the
    disk, creating a file system on the partition, and mounting the file system. Here''s
    an overview of the steps:


    1. Identify the disk: Use the `fdisk` command to identify the disk that you want
    to partition. For example, `fdisk -l` will list all the disks that are connected
    to the system.

    2. Create a new partition: Use the `fdisk` command to create a new partition on
    the disk. For example, `fdisk /dev/sdb` will allow you to create a new partition
    on the `/dev/sdb` disk.

    3. Create a file system: Use the appropriate command to create a file system on
    the partition you just created. For example, if you want to create an `ext4` file
    system, you can use the `mkfs.ext4` command. The command syntax is `mkfs.<file
    system type> <device>`.

    4. Mount the file system: Create a directory to serve as the mount point for the
    file system, then mount the file system on that directory. For example, if you
    create a directory `/mnt/mydrive`, you can mount the file system using the `mount`
    command: `mount /dev/sdb1 /mnt/mydrive`.


    ![image](Images/image-KOJIXABG.png)


    ## Manipulating Partitions With fdisk


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    `fdisk` is a command-line utility used for creating and manipulating disk partitions
    on Linux systems. Here''s an example of how to use `fdisk` to create a new partition:


    Open a terminal and run the `fdisk` command with the name of the device you want
    to partition. For example, to partition `/dev/sdb`, run the command:


    ![image](Images/image-CJJTTG07.png)![image](Images/image-UB61XEIN.png)


    - Use the `m` command to display a list of available commands. This will help
    you navigate the `fdisk` interface.

    - Use the `p` command to display the partition table for the device. This will
    show you any existing partitions on the device.

    - Use the `n` command to create a new partition. `fdisk` will prompt you for information
    about the new partition, such as the starting and ending sectors.

    - Use the `t` command to set the partition type. `fdisk` will prompt you for the
    partition number and the new partition type code.

    - Use the `w` command to write the changes to the partition table and exit `fdisk`.


    ![image](Images/image-KOJIXABG.png)


    ## Creating A New File System With mkfs


    ![image](Images/image-8OLLAO0U.png)


    To create a new file system on a block device, you can use the `mkfs` command
    followed by the device name and the desired file system type. For example, to
    create an `ext4` file system on `/dev/sdb1`, you would use the following command:


    ```

    mkfs.ext4 /dev/sdb1

    ```

