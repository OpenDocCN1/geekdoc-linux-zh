    ## Signals


    ![image](Images/image-8OLLAO0U.png)


    In Linux, signals are a way for the operating system to communicate with running
    processes. Signals are software interrupts that are sent to a process to indicate
    events or actions that have occurred. A signal can be used to request that a process
    terminate, pause, or perform some other action.


    There are many different types of signals that can be sent to a process, but some
    of the most commonly used signals include:


    - `SIGTERM`: This signal is used to request that a process terminate gracefully.
    When a process receives the `SIGTERM` signal, it should clean up any resources
    it is using and then terminate.

    - `SIGKILL`: This signal is used to force a process to terminate immediately,
    without giving it a chance to clean up resources. When a process receives the
    `SIGKILL` signal, it is terminated immediately, and any resources it was using
    are released.

    - `SIGSTOP`: This signal is used to pause a process temporarily. When a process
    receives the `SIGSTOP` signal, it is suspended, and its execution is paused. The
    process can be resumed later using the `fg` or `bg` commands.

    - `SIGCONT`: This signal is used to resume a process that has been paused using
    `SIGSTOP`. When a process receives the `SIGCONT` signal, its execution is resumed
    from where it left off.

    - `SIGINT`: This signal is used to interrupt a process that is running in the
    foreground. When a process receives the `SIGINT` signal, it should terminate gracefully.


    To send a signal to a process, you can use the `kill` command, followed by the
    signal name or number and the process ID of the process you want to send the signal
