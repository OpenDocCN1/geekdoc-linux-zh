    # Adding Color


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    Sure, adding color to your prompt can help to make it more visually appealing
    and easier to read. Here''s an example of how you can add color to your prompt:


    ![image](Images/image-CJJTTG07.png)![image](Images/image-VKSDJTH4.png)


    In this example, the prompt starts with the username and hostname in bold green,
    followed by a colon in bold white, then the current working directory in bold
    blue, and finally a dollar sign in the default text color.


    Here''s a breakdown of the color codes used in this example:


    - `\033[` is the start of an escape sequence.

    - `1;32m` sets the color to bold green.

    - `\u` displays the username.

    - `@` displays the `@` symbol.

    - `\h` displays the hostname.

    - `:` displays a colon in bold white.

    - `1;34m` sets the color to bold blue.

    - `\w` displays the current working directory.

    - `\033[0m` resets the color to default.

    - `$` displays the dollar sign.


    ![image](Images/image-KOJIXABG.png)


    # Terminal Confusion


    ![image](Images/image-8OLLAO0U.png)


    Terminal confusion can occur when you are using multiple windows or tabs at the
    same time, and you lose track of which terminal is running which command. Here
    are a few tips to avoid this:


    - Use different colors for each terminal: This helps you distinguish them more
    easily.

    - Rename your terminal tabs: Many terminal emulators allow you to rename tabs,
    so you can quickly identify which terminal is running.

    - Use a terminal multiplexer: A terminal multiplexer, such as `Screen` or `tmux`,
    allows you to split your terminal into multiple panes, each running a process.

    - Use job control: In the terminal, you can use job control commands to manage
    processes. For example, you can use `jobs` to list all running processes, `fg`
    to bring a process to the foreground, or `bg` to run a process in the background.


    ![image](Images/image-KOJIXABG.png)


    # Moving The Cursor


    ![image](Images/image-8OLLAO0U.png)


    Moving the cursor refers to changing the position of the text input in the command
    line interface. This allows you to insert or delete text at a specific location,
    rather than just appending to the end.


    There are several ways to move the cursor in the command line interface, including:


    - Arrow keys: On most systems, you can use the up, down, left, and right arrow
    keys to move the cursor in the corresponding direction.

    - Home/End keys: The `Home` key moves the cursor to the beginning of the current
    line, while the `End` key moves the cursor to the end of the line.

    - Ctrl + A/Ctrl + E: On Unix-based systems, you can use the `Ctrl+A` and `Ctrl+E`
    shortcuts to move the cursor to the beginning and end of the line, respectively.

    - Ctrl + Left/Right arrow keys: This shortcut allows you to move the cursor one
    word to the left or right, rather than one character at a time.

    - Mouse click: On some systems, you can use the mouse to click on a specific location
    in the command line interface, which will move the cursor to that location.


    ![image](Images/image-KOJIXABG.png)


    # Saving The Prompt


    Saving the prompt refers to customizing and saving the command prompt in a way
    that is persistent across terminal sessions. This allows you to have a personalized
    prompt that appears every time you open a new terminal window or log in to your
    system.


    To customize and save the prompt, you will need to modify your shell configuration
    file. The location and name of this file can vary depending on your operating
    system and shell, but it is often called `.bashrc`, `.bash_profile`, or `.zshrc`.

