    In vi, you can move the cursor around the document using various commands. Some
    of the most commonly used cursor movement commands include:


    - `h`: move the cursor one character to the left.

    - `j`: move the cursor down one line.

    - `k`: move the cursor up one line.

    - `l`: move the cursor one character to the right.

    - `0`: move the cursor to the beginning of the current line.

    - `$`: move the cursor to the end of the current line.

    - `gg`: move the cursor to the beginning of the document.

    - `G`: move the cursor to the end of the document.

    - `<n>G`: move the cursor to the beginning of line number n.


    Note that these commands are used in command mode. In insert mode, typing `h`,
    `j`, `k`, or `l` will insert those letters into the document. To return to command
    mode, press the `Esc` key.


    ![image](Images/image-KOJIXABG.png)


    ## Appending Text


    ![image](Images/image-8OLLAO0U.png)


    In vi, there are several ways to append text to a document. One of the most common
    methods is to use the `a` command, which puts you into insert mode after the current
    cursor position. Here are the steps to append text using the `a` command:


    1. Move the cursor to the point in the document where you want to start appending
    text.

    2. Press the `a` key to enter insert mode after the current cursor position.

    3. Type the text you want to append to the document.

    4. Press the `Esc` key to return to command mode.


    Another way to append text is to use the `A` command, which puts you into insert
    mode at the end of the current line. Here are the steps to append text using the
    `A` command:


    1. Move the cursor to the end of the line where you want to start appending text.

    2. Press the `A` key to enter insert mode at the end of the line.

    3. Type the text you want to append to the document.

    4. Press the `Esc` key to return to command mode.


    Finally, you can also append text using the `i` command, which puts you into insert
    mode before the current cursor position. Here are the steps to append text using
    the `i` command:


    1. Move the cursor to the point in the document where you want to start appending
    text.

    2. Press the `i` key to enter insert mode before the current cursor position.

    3. Type the text you want to append to the document.

    4. Press the `Esc` key to return to command mode.


    ![image](Images/image-KOJIXABG.png)


    ## Opening A Line


    ![image](Images/image-8OLLAO0U.png)


    In vi, you can open a new line above or below the current cursor position using
    the `o` and `O` commands, respectively.


    To open a new line below the current cursor position, follow these steps:


    1. Move the cursor to the point in the document where you want to add the new
    line.

    2. Press the `o` key to open a new line below the cursor position.

    3. Type the text you want to add to the new line.

    4. Press the `Esc` key to return to command mode.


    To open a new line above the current cursor position, follow these steps:


    1. Move the cursor to the point in the document where you want to add the new
    line.

    2. Press the `O` key to open a new line above the cursor position.

    3. Type the text you want to add to the new line.

    4. Press the `Esc` key to return to command mode.


    ![image](Images/image-KOJIXABG.png)


    ## Deleting Text


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    In vi, you can delete text using various commands depending on the scope of deletion.


    Here are some common commands for deleting text in vi:


    - `x`: Deletes the character under the cursor.

    - `dd`: Deletes the current line.

    - `d0`: Deletes from the cursor to the beginning of the line.

    - `d$`: Deletes from the cursor to the end of the line.

    - `dw`: Deletes the current word.


    To use any of these commands, first ensure that you are in command mode by pressing
    the `Esc` key. Then, move the cursor to the beginning of the text you want to
    delete and press the appropriate deletion command. The text will be removed from
    the document and stored in the vi buffer, allowing you to paste it elsewhere if
    desired.


    ![image](Images/image-KOJIXABG.png)


    ## Cutting, Copying, And Pasting Text


    ![image](Images/image-8OLLAO0U.png)


    In vi, the process of cutting, copying, and pasting text is accomplished using
    the `yank`, `delete`, and `put` commands.


    Here are the basic steps to cut or copy text and paste it elsewhere in the document:


    1. Move the cursor to the beginning of the text you want to cut or copy.

    2. Press the `v` key to enter visual mode.

    3. Move the cursor to the end of the text you want to cut or copy. This will highlight
    the text.

    4. Press `y` to yank (copy) the text or `d` to delete (cut) the text.

    5. Move the cursor to the desired paste location.

    6. Press the `p` key to put (paste) the text after the cursor or `P` to put it
    before the cursor.


    Note that when you use the `y` command to yank text, it is stored in the vi buffer
    and can be pasted multiple times. However, when you use the `d` command to delete
    text, it is only stored in the buffer until the next time you cut or copy text.


    ![image](Images/image-KOJIXABG.png)


    ## Joining Lines


    ![image](Images/image-8OLLAO0U.png)


    In vi, joining lines can be accomplished using the `J` command. This command joins
    the current line with the next line.


    Move the cursor to the first line you want to join. Press the `J` key to join
    the next line.


    Alternatively, you can also use a range to join multiple lines. For example, to
    join 3 lines, you can use `3J`.


    ![image](Images/image-KOJIXABG.png)


    ## Search-And-Replace


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    In vi, you can perform search-and-replace operations using the `s` command. The
    syntax for this command is:


    `:[range]s/pattern/replacement/[flags]`


    where:

    - `[range]` is an optional range of lines.

    - `pattern` is the regular expression to search for.

    - `replacement` is the text to replace.

    - `[flags]` are optional flags that modify the behavior.


    Here are some examples:


    - To replace the first occurrence of "apple" with "orange" on the current line:
    `:s/apple/orange`

    - To replace all occurrences of "apple" with "orange" on the current line: `:s/apple/orange/g`

    - To replace all occurrences of "apple" with "orange" in the entire file: `%s/apple/orange/g`

    - To replace all occurrences of "apple" with "orange" in lines 10 to 20: `:10,20s/apple/orange/g`

    - To replace all occurrences of "apple" with "orange" in the entire file, but
    prompt for confirmation before each replacement: `%s/apple/orange/gc`


    Note that the `s` command only replaces the first occurrence of the pattern on
    each line by default. To replace all occurrences on a line, use the `g` flag at
    the end of the command. Also, if the pattern or replacement contain any slashes,
    you can use a different delimiter instead, such as `|` or `#`.


    ## Editing Multiple Files


    ![image](Images/image-8OLLAO0U.png)


    In vi, you can edit multiple files using the `:args` and `:next` commands. The
    `:args` command sets the argument list to the specified files, and the `:next`
    command goes to the next file in the argument list. Here''s an example workflow:


    1. Open vi with the files you want to edit: `vi file1 file2 file3`

    2. Check the current argument list: `:args`. This will show the list of files
    you opened.

    3. Go to the next file in the argument list: `:next`. This will open the next
    file in the list.

