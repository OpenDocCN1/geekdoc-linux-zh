- fmt: '

    You can use various shortcuts with the `cd` command to make navigating the file
    system tree faster and more efficient. For example, typing `cd` followed by a
    single dash (`-`) will change the current working directory to the previous directory
    you were in, and typing `cd` followed by two periods (`..`) will change the current
    working directory to the parent directory of the current directory.


    It''s important to keep track of the current working directory when using the
    `cd` command, as many other shell commands and utilities operate on the current
    directory by default. By mastering the use of the `cd` command and its various
    shortcuts, you can become a more efficient and effective Linux user, able to quickly
    and easily navigate the file system tree.


    ![image](Images/image-KOJIXABG.png)


    ## Absolute Pathnames


    ![image](Images/image-8OLLAO0U.png)


    In Linux, an absolute pathname is a full path that specifies the exact location
    of a file or directory within the file system tree. It starts from the root directory
    (`/`) and includes all directories and subdirectories leading to the file or directory
    in question.


    For example, the absolute pathname for a file named `example.txt` located in the
    `/home/user/Documents` directory would be `/home/user/Documents/example.txt`.


    You can use absolute pathnames to specify the exact location of files or directories
    when running shell commands or using utilities. Absolute pathnames are useful
    when you need to specify a file or directory that is not located in the current
    working directory.


    To use an absolute pathname in a shell command, simply type the full pathname
    instead of just the file or directory name. For example, to list the contents
    of the `/home/user/Documents` directory using an absolute pathname, you would
    type `ls /home/user/Documents` at the command prompt and press enter.


    ![image](Images/image-CJJTTG07.png)


    Let''s say you have a file named `example.txt` located in the `/home/user/Documents`
    directory. If you want to open this file using a text editor like `nano`, you
    could use the following command:


    ```

    nano /home/user/Documents/example.txt

    ```


    This command specifies the absolute pathname of the file, which includes the full
    directory path leading to the file. When you run this command, `nano` will open
    the file `example.txt` located in the `/home/user/Documents` directory.


    Note that you could also use a relative pathname to open the same file, but the
    relative pathname would depend on your current working directory. Using an absolute
    pathname ensures that you can always locate the file, regardless of your current
    working directory.


    ![image](Images/image-KOJIXABG.png)


    ## Relative Pathnames


    ![image](Images/image-8OLLAO0U.png)


    In Linux, a relative pathname is a path that specifies the location of a file
    or directory relative to the current working directory. It does not include the
    full path to the file or directory from the root directory (`/`).


    For example, if your current working directory is `/home/user/Documents` and you
    want to access a file named `example.txt` located in the `/home/user/Pictures`
    directory, you could use the relative pathname `../Pictures/example.txt`. The
    `..` indicates the parent directory of the current working directory, and the
    subsequent `/Pictures/example.txt` specifies the file location relative to the
    parent directory.


    You can use relative pathnames to specify files or directories that are located
    near the current working directory. They are particularly useful when you want
    to navigate between directories quickly and efficiently.


    To use a relative pathname in a shell command, simply type the path relative to
    the current working directory instead of the full pathname. For example, to list
    the contents of a directory named `images` located in the parent directory of
    the current working directory, you would type `ls ../images` at the command prompt
    and press enter.


    Let''s say your current working directory is `/home/user/Documents`, and you want
    to open a file named `example.txt` located in a subdirectory named `notes`. You
    could use the following command:


    ```

    nano notes/example.txt

    ```


    This command specifies the relative pathname of the file, which includes the path
    to the file relative to the current working directory. When you run this command,
    `nano` will open the file `example.txt` located in the `notes` subdirectory of
    the current working directory.


    ![image](Images/image-Q89KIKAL.png)


    ![image](Images/image-KOJIXABG.png)


    ## Some Helpful Shortcuts


    ![image](Images/image-8OLLAO0U.png)


    In Linux, there are several helpful shortcuts that you can use to navigate the
    file system tree and work more efficiently in the shell. Here are a few of the
    most commonly used shortcuts:


    - **Tab Completion**: If you start typing a file or directory name and press the
    Tab key, the shell will automatically complete the name for you if it is unique.
    If the name is not unique, pressing Tab twice will display a list of possible
    completions.

    - **Ctrl + A**: This shortcut moves the cursor to the beginning of the current
    command line.

    - **Ctrl + E**: This shortcut moves the cursor to the end of the current command
    line.

    - **Ctrl + U**: This shortcut deletes the entire current command line.

    - **Ctrl + R**: This shortcut opens the reverse search history function, which
    allows you to search for previous commands.

    - **Ctrl + C**: This shortcut interrupts the current process or command.


    ![image](Images/image-KOJIXABG.png)


    ### 3 – Exploring The System.


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-KOJIXABG.png)


    ## Options And Arguments


    ![image](Images/image-8OLLAO0U.png)


    In Linux, shell commands typically consist of a command name, followed by options
    and arguments. Options modify the behavior of the command, while arguments specify
    the files, directories, or other inputs that the command should operate on.


    Options are usually preceded by a hyphen (`-`) or double hyphen (`—`) and are
    case-sensitive. They can be combined together or used individually. For example,
    the `ls` command has several options, including `-l` to display the contents of
    a directory in a long format, and `-a` to display hidden files.


    Arguments are typically provided after the command and options, and can take various
    forms depending on the command. For example, when using the `cp` command to copy
    a file, the first argument is the source file, and the second argument is the
    destination file.


    Some commands also accept flags as arguments, which are preceded by a hyphen and
    modify the behavior of the command in a specific way.


    Suppose you want to list the contents of a directory in long format and display
    hidden files. To do this, you would use the following command:


    ```bash

    ls -la /home/user/Documents

    ```


    In this command, the `-l` option is used to display the contents of the directory
    in long format, and the `-a` option is used to display hidden files. The argument
    `/home/user/Documents` specifies the directory whose contents you want to list.


    When you run this command, the shell will display a detailed list of the contents
    of the `/home/user/Documents` directory, including hidden files, in long format.
    By using options and arguments with the `ls` command, you can customize the output
    to suit your needs and gain greater insight into the contents of the file system
    tree.


    ![image](Images/image-KOJIXABG.png)


    ### Long Format


    ![image](Images/image-8OLLAO0U.png)


    In Linux, the long format option (`-l`) for the `ls` command displays the contents
    of a directory in a detailed and informative format. When using this option, the
    `ls` command will display the following information for each file or directory
    in the directory:


    - **File Permissions**: A series of ten characters that indicate the file type
    and permissions for the owner, group, and other users.

    - **Number of links**: The number of hard links to the file.

    - **Owner**: The username of the owner of the file.

    - **Group**: The name of the group that owns the file.

    - **File Size**: The size of the file in bytes.

