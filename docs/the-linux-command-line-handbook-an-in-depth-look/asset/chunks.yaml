    To change the group of a file to "newgroup", you can use the following command:


    ![image](Images/image-7XZIL83F.png)


    In this example, "newgroup" is the new group that the file belongs to.


    ![image](Images/image-KOJIXABG.png)


    ## Reading, Writing, And Executing


    ![image](Images/image-8OLLAO0U.png)


    In Linux, file permissions control who can read, write, and execute files and
    directories on the system. Each file and directory has a set of permissions that
    are represented by three types of access: read, write, and execute.


    The read permission allows users to view the contents of a file or directory.
    The write permission allows users to modify the contents of a file or directory.
    The execute permission allows users to run programs or scripts.


    There are three levels of access: owner, group, and other. The owner is the user
    who owns the file or directory, the group is a set of users who share access to
    the file or directory, and other refers to all users who are not the owner or
    a member of the group.


    To modify file permissions in Linux, you can use the "chmod" command. The "chmod"
    command allows you to add or remove permissions for the owner, group, or other
    users. For example, to add write permission for the owner of a file, you can use
    the following command:


    ![image](Images/image-QWX5GGRT.png)


    In this example, "u" represents the owner of the file, and "+w" adds write permission.


    To remove execute permission for other users of a directory, you can use the following
    command:


    ![image](Images/image-LK6FOIJG.png)


    In this example, "o" represents other users, and "-x" removes execute permission.


    ![image](Images/image-KOJIXABG.png)


    ## chmod – Change File Mode


    ![image](Images/image-8OLLAO0U.png)


    In Linux, the "chmod" command is used to change the file mode or permissions of
    a file or directory. The file mode or permissions specify who can read, write,
    and execute the file or directory. There are two ways to specify the file mode:
    symbolic mode and absolute mode.


    Symbolic mode uses symbols to represent the file mode. The symbols used are "u"
    for user, "g" for group, "o" for others, "a" for all, "+" for add permission,
    "-" for remove permission, and "=" for set permission. For example, to add write
    permission for the owner of a file, you can use the following command:


    ![image](Images/image-GWI97ZLZ.png)


    In this example, "u" represents the owner of the file, and "+w" adds write permission.


    To remove execute permission for other users of a directory, you can use the following
    command:


    ![image](Images/image-LOY1SJ87.png)


    In this example, "o" represents other users, and "-x" removes execute permission.


    Absolute mode uses numbers to represent the file mode. Each permission is assigned
    a number: read is 4, write is 2, and execute is 1\. The numbers are added together
    to create the file mode. For example, to give the owner read, write, and execute
    permissions and the group and other users only read and execute permissions, you
    can use the following command:


    ![image](Images/image-G9A3FO7Z.png)


    In this example, the first digit "7" represents the owner''s permissions, which
    are read, write, and execute (4+2+1=7), the second digit "5" represents the group''s
    permissions, which are read and execute (4+1=5), and the third digit "5" represents
    other users'' permissions, which are also read and execute (4+1=5).


    ![image](Images/image-KOJIXABG.png)


    ## Setting File Mode With The GUI


    ![image](Images/image-8OLLAO0U.png)


    In Linux, file mode or permissions can also be set using the graphical user interface
    (GUI) of your file manager.


    To set file mode using the GUI:


    Open your file manager and navigate to the file or directory whose mode you want
    to modify.


    Right-click the file or directory and select "Properties" or "Permissions" from
    the menu.


    In the "Properties" or "Permissions" window, you can see the current file mode
    or permissions.


    To modify the file mode, select the checkboxes next to the permissions you want
    to allow or remove.


    Click "Apply" or "OK" to save the changes.


    You can also modify the file mode by changing the permissions for the owner, group,
    and other users. To do this, click the drop-down menu next to each user type and
    select the permissions you want to allow or remove.


    Keep in mind that the GUI file manager may not have all the options available
    with the "chmod" command, and some file managers may have different options or
    menus. If you need more advanced permissions, it is recommended to use the "chmod"
    command from the command line.


    ![image](Images/image-KOJIXABG.png)


    ## umask – Set Default Permissions


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    In Linux, the "umask" command is used to set the default file mode or permissions
    for new files and directories created by a user. The default file mode is the
    permissions that are automatically set when a new file or directory is created.


    The "umask" command works by subtracting the file mode from a default value of
    777 (for directories) or 666 (for files). For example, if the umask is set to
    022, the file mode for new files will be 644 (666 - 022 = 644) and the file mode
    for new directories will be 755 (777 - 022 = 755).


    To set the umask, you can use the following command:


    ![image](Images/image-ONNS0DNU.png)


    In this example, the umask is set to 022, which means that the write permission
    is removed for group and other users.


    The umask can be set in the shell startup file (such as .bashrc or .bash_profile)
    to make it persistent across sessions. It can also be set in the system-wide configuration
    file (/etc/profile or /etc/bashrc) to apply the default file mode for all users.


    ![image](Images/image-KOJIXABG.png)


    ## Changing Identities


    ![image](Images/image-8OLLAO0U.png)


    In Linux, you can change the identity of a process or command using the "su" and
    "sudo" commands. Changing identity can be useful when you need to run a command
    as a different user or with elevated privileges.


    The "su" command is used to switch to another user''s account. By default, the
    command will switch to the root user''s account. To switch to another user''s
    account, you can use the following command:


    ![image](Images/image-5W3TDSJN.png)


    In this example, "username" is the name of the user account you want to switch
    to. You will be prompted to enter the password for the user account. After entering
    the correct password, you will switch to the user''s account and the command prompt
    will change to reflect the new identity.


    The "sudo" command is used to run a command with elevated privileges. By default,
    the command will run with root privileges. To run a command with elevated privileges
    as another user, you can use the following command:


    ![image](Images/image-FC6NS0GD.png)


    In this example, "username" is the name of the user account you want to run the
    command as, and "command" is the command you want to run. You will be prompted
    to enter your password. After entering the correct password, the command will
    run with the specified user''s identity.'
