    你可以使用 `cd` 命令的各种快捷键来使在文件系统树中的导航更加快速和高效。例如，输入 `cd` 后跟一个单连字符（`-`）将把当前工作目录切换到你之前所在的目录，而输入
    `cd` 后跟两个点（`..`）将把当前工作目录切换到当前目录的父目录。


    在使用 `cd` 命令时，跟踪当前工作目录是非常重要的，因为许多其他 shell 命令和工具默认会在当前目录上操作。通过掌握 `cd` 命令及其各种快捷键的使用，你可以成为一个更高效、更有效的
    Linux 用户，能够快速轻松地导航文件系统树。


