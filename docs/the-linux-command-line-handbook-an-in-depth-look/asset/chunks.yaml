    Changing identity can be useful for performing administrative tasks or running
    commands that require elevated privileges. However, it is important to use caution
    when switching to another user''s account or running commands with elevated privileges,
    as it can potentially compromise the security of the system.


    ![image](Images/image-KOJIXABG.png)


    ## su – Run A Shell With Substitute User And Group IDs


    ![image](Images/image-8OLLAO0U.png)


    In Linux, the `su` command is used to switch to another user''s account or to
    run a shell with substitute user and group IDs. The command is commonly used to
    run commands as the root user or to switch to another user''s account for administrative
    tasks.


    To use the `su` command, open a terminal window and type:


    ```

    $ su

    ```


    This will switch you to the root user''s account, prompting you to enter the root
    user''s password. After entering the password, you will be logged in as the root
    user and the command prompt will change to reflect the new identity.


    To switch to another user''s account, you can use the following command:


    ![image](Images/image-5W3TDSJN.png)


    In this example, `username` is the name of the user account you want to switch
    to. You will be prompted to enter the password for the user account. After entering
    the correct password, you will switch to the user''s account and the command prompt
    will change to reflect the new identity.


    You can also use the `su` command to run a shell with substitute user and group
    IDs. This can be useful for running a shell with a different set of permissions
    or running a command with elevated privileges. To run a shell with substitute
    user and group IDs, use the following command:


    ![image](Images/image-XXSDFJTQ.png)


    In this example, `command` is the command you want to run with substitute user
    and group IDs. You will be prompted to enter the password for the current user''s
    account. After entering the correct password, the command will run with substitute
    user and group IDs.


    ![image](Images/image-KOJIXABG.png)


    ## sudo – Execute A Command As Another User


    ![image](Images/image-8OLLAO0U.png)


    In Linux, the `sudo` command is used to execute a command as another user, typically
    the root user. The command is commonly used to perform administrative tasks that
    require elevated privileges.


    To use the `sudo` command, open a terminal window and type:


    ![image](Images/image-2HVGUIJ5.png)


    In this example, `command` is the command you want to run with elevated privileges.
    You will be prompted to enter your password. After entering the correct password,
    the command will run with elevated privileges.


    By default, the `sudo` command will run the command as the root user. However,
    you can specify a different user by using the `-u` option, as shown below:


    ![image](Images/image-Z1V0CY59.png)


    In this example, `username` is the name of the user you want to run the command
    as.


    The `sudo` command can also be used to run a shell with elevated privileges, as
    shown below:


    ![image](Images/image-3371N3V8.png)


    This will open a shell with elevated privileges. You will be prompted to enter
    your password. After entering the correct password, you will be logged in as the
    root user.


    The `sudo` command is a powerful tool that can be used for performing administrative
    tasks or running commands with elevated privileges. However, it should be used
    with caution, as it can potentially compromise the security of the system. It
    is important to only use the `sudo` command when necessary and to ensure that
    you understand the implications of the commands you are running.


    ![image](Images/image-KOJIXABG.png)


    ## Ubuntu And sudo


    ![image](Images/image-8OLLAO0U.png)


    In Ubuntu, the `sudo` command is used extensively to perform administrative tasks
    that require elevated privileges. The use of `sudo` is recommended over using
    the root account directly, as it provides better security and auditing.


    When you install Ubuntu, the first user account that is created is given sudo
    privileges by default. This means that the user can execute commands with elevated
    privileges by prefixing the command with `sudo`.


    To use the `sudo` command in Ubuntu, open a terminal window and type:


    ![image](Images/image-EJJQYE5U.png)


    In this example, `command` is the command you want to run with elevated privileges.
    You will be prompted to enter your password. After entering the correct password,
    the command will run with elevated privileges.


    By default, the `sudo` command will prompt you for your password every 15 minutes.
    However, you can change this behavior by modifying the `/etc/sudoers` file using
    the `visudo` command.


    The `sudo` command can also be used to run a shell with elevated privileges, as
    shown below:


    ![image](Images/image-94UWN8WP.png)


    This will open a shell with elevated privileges. You will be prompted to enter
    your password. After entering the correct password, you will be logged in as the
    root user.


    ![image](Images/image-KOJIXABG.png)


    ## chown – Change File Owner And Group


    ![image](Images/image-8OLLAO0U.png)


    In Linux, the `chown` command is used to change the owner and group of a file
    or directory. This command is typically used when you need to transfer ownership
    of a file or directory to a different user or group.


    To use the `chown` command, open a terminal window and type:


    ![image](Images/image-8OLLAO0U.png)


    In this example, `owner` is the name of the user you want to set as the owner
    of the file, `group` is the name of the group you want to set as the group owner
    of the file, and `file` is the name of the file you want to change ownership of.
    You need to prefix the command with `sudo` to run the command with elevated privileges.


    To change the owner of a directory and all its contents recursively, you can use
    the `-R` option, as shown below:


    ![image](Images/image-chown.png)


    In this example, `directory` is the name of the directory you want to change the
    ownership of.


    The `chown` command is a powerful tool that can be used for transferring ownership
    of files and directories. However, it should be used with caution, as it can potentially
    compromise the security of the system. It is important to only use the `chown`
    command when necessary and to ensure that you understand the implications of the
    ownership changes you are making.


    ![image](Images/image-KOJIXABG.png)


    ## chgrp – Change Group Ownership


    ![image](Images/image-8OLLAO0U.png)


    In Linux, the `chgrp` command is used to change the group ownership of a file
    or directory. This command is typically used when you need to transfer group ownership
    of a file or directory to a different group.


    To use the `chgrp` command, open a terminal window and type:


    ![image](Images/image-chgrp.png)


    In this example, `group` is the name of the group you want to set as the group
    owner of the file, and `file` is the name of the file you want to change the group
    ownership of. You need to prefix the command with `sudo` to run the command with
    elevated privileges.


    To change the group ownership of a directory and all its contents recursively,
    you can use the `-R` option, as shown below:


    ![image](Images/image-chgrp.png)


    In this example, `directory` is the name of the directory you want to change the
    group ownership of.


    ![image](Images/image-KOJIXABG.png)


    ## Exercising Our Privileges


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    In Linux, certain operations require elevated privileges to execute, such as installing
    software, modifying system settings, and accessing certain directories. These
    privileges are typically reserved for the root user or users with administrative
    privileges.


    To exercise these privileges, you can use the `sudo` command. The `sudo` command
    allows you to temporarily escalate your privileges to perform specific actions
    that require elevated permissions.

