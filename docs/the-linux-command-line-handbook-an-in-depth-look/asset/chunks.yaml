    session. You can use various options to filter and display different types of
    information.

    - `top`: This command provides a real-time view of system processes and their
    resource usage. `top` is interactive, allowing you to sort and filter processes
    based on various criteria, and to send signals to individual processes.

    - `nice`: This command is used to adjust the scheduling priority of a process.
    By default, processes run with a priority of 0, but you can use `nice` to lower
    or raise the priority of a process, which can affect how much CPU time it receives.

    - `renice`: This command is used to change the priority of a process that is already
    running. You can use `renice` to adjust the priority of a process that is using
    too much CPU time, or to give higher priority to a process that requires more
    resources.

    - `bg` and `fg`: These commands are used to move processes between the foreground
    and background. When a process is in the foreground, it receives input from the
    user and displays output to the screen. When a process is in the background, it
    continues to run, but does not interact with the user. You can use `bg` to move
    a process to the background, and `fg` to move it back to the foreground.

    - `jobs`: This command is used to display a list of jobs running in the background.
