    # 10 – Processes.


    ![image](Images/image-8OLLAO0U.png)


    In Linux, a process is a running instance of a program. When you start a program,
    the operating system creates a new process to run that program. The process has
    a unique process ID (PID), which is used to identify and manage the process.


    A process is made up of one or more threads, which are individual paths of execution
    within the process. Each thread is associated with a stack, which is a region
    of memory used for storing local variables and function calls.


    When a process is started, it is loaded into memory and given access to system
    resources, such as memory, input/output devices, and the CPU. The process can
    then execute its instructions and interact with the system.


    Processes can communicate with each other using various interprocess communication
    (IPC) mechanisms, such as pipes, sockets, and shared memory. This allows different
    processes to exchange data and work together to perform complex tasks.


    Processes can also be managed and controlled using various commands and tools.
    For example, you can use the `ps` command to list all the processes running on
    the system, the `kill` command to terminate a process, and the `nice` command
    to change the priority of a process.


    ![image](Images/image-KOJIXABG.png)


    ## Viewing Processes


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    In Linux, you can use several commands to view the processes running on the system,
    such as:


    - `ps` - This command shows a snapshot of the processes running on the system
    at the time you run the command. It can be used to display a variety of information
    about each process, including the process ID (PID), the parent process ID (PPID),
    the user running the process, the CPU and memory usage, and the command that launched
    the process. The `ps` command can be customized using various options to display
    only specific information.


    ![image](Images/image-CJJTTG07.png)![image](Images/image-SQ5BQB08.png)


    - `top/htop` - These commands provide a real-time view of the system''s processes,
    sorted by CPU or memory usage. They can be used to monitor the system''s performance
    and identify processes that are consuming excessive resources.


    ![image](Images/image-G3MK1XC5.png)


    or


    ![image](Images/image-LBIDQKL8.png)


    - `pstree` - This command shows a tree of processes, with each process''s parent
    displayed above it. This can be useful for understanding how processes are related
    to each other.


    ![image](Images/image-ASKCAYNK.png)


    - `pgrep` - This command can be used to find the process IDs of processes that
    match a specific name or pattern. It is useful when you want to identify the process
    ID of a running process without using the `ps` command.


    ![image](Images/image-CJJTTG07.png)![image](Images/image-37XXQ8T5.png)


    In this example, `process-name` is the name of the process you want to find the
    PID for.


    ![image](Images/image-KOJIXABG.png)


    ## Viewing Processes Dynamically With top


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    `top` is a powerful command in Linux that allows you to view the system''s processes
    dynamically in real-time. It displays a list of processes sorted by their CPU
    usage, and it updates this list continuously. Here are some steps to use `top`
    command:


    1. Open a terminal window.

    2. Type `top` and press Enter.

    3. You will see a list of processes displayed, sorted by CPU usage. The top process
    is the one using the most CPU.

    4. You can press `q` at any time to quit `top`.

    5. You can use various options to customize the output of `top`. For example,
    you can use the `-d` option to specify the update interval in seconds, the `-u`
    option to show only processes owned by a specific user, and the `-p` option to
    show only specific process IDs.

    6. You can also use various keyboard shortcuts to interact with `top`. For example,
    you can press `k` to send a signal to a process, `r` to change the priority of
    a process, and `h` to display the help screen.

    7. You can press `h` at any time to display the list of available keyboard shortcuts.


    In summary, `top` is a powerful command for viewing processes in real-time on
    a Linux system. It can be used to monitor the system''s performance, identify
    resource-hungry processes, and troubleshoot issues on your system. Understanding
    how to use `top` effectively can help you become a more efficient system administrator.


    ![image](Images/image-KOJIXABG.png)


    ## Controlling Processes


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    In Linux, you can control processes in various ways using commands and tools.
    Here are some common ways to control processes:


    - `kill` - This command is used to terminate a process. You can specify the process
    ID (PID) of the process you want to kill or use a signal to terminate the process.
    For example, to terminate a process with a specific PID, you can use the following
    command:


    ```

    ![image](Images/image-Q26X7LEX.png)

    ```


    - `pkill` - This command is similar to `kill`, but it allows you to specify the
    process name or pattern instead of the PID. It can be useful when you want to
    terminate multiple processes at once. For example, to terminate all processes
    with a specific name, you can use the following command:


    ```

    ![image](Images/image-RSIS8XL.png)

    ```


    - `killall` - This command is similar to `pkill`, but it terminates all processes
    with a name, rather than just one. For example, to terminate all processes with
    the name `process-name`, you can use the following command:


    ```

    ![image](Images/image-JOSGACDQ.png)

    ```


    - `renice` - This command is used to change the priority of a process. You can
    use it to increase or decrease a process''s priority, which determines how much
    CPU time it is allocated. For example, to increase the priority of a process with
    a specific PID, you can use the following command:


    ```

    ![image](Images/image-DTD9PW9H.png)

    ```


    - `fg/bg` - These commands are used to move a process to the foreground or background.
    When a process is in the foreground, it receives input from the keyboard, and
    when it is in the background, it does not. For example, to move a process with
    a specific PID to the background, you can use the following command:


    ```

    ![image](Images/image-1C4DSV4L.png)

    ```


    - `jobs` - This command is used to display a list of the processes running in
    the background. You can use it to identify the process ID of a process that is
    running in the background. For example, to display a list of all background processes,
    you can use the following command:


    ```

    ![image](Images/image-8WRSECM0.png)

    ```


    In summary, controlling processes is an important aspect of system administration
    and troubleshooting in Linux. Understanding how to use commands like `kill`, `pkill`,
    `killall`, `renice`, `fg/bg`, and `jobs` can help you manage and control the processes
    running on your system.


    ![image](Images/image-KOJIXABG.png)


    ## Interrupting A Process


    ![image](Images/image-8OLLAO0U.png)


    In Linux, you can interrupt a process that is currently running using the keyboard
    interrupt signal `Ctrl + C`. This signal sends an interrupt signal to the process,
    which causes it to terminate gracefully.

