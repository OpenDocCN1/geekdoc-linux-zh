    ![image](Images/image-8OLLAO0U.png)


    In Linux, double quotes are a type of quoting that allow you to include variables
    and command substitution within a text string. When a text string is enclosed
    in double quotes, any variable names or command substitutions within the string
    are expanded by the shell before the string is executed.


