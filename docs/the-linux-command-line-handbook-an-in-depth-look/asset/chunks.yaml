    ## Editing Modes


    ![image](Images/image-8OLLAO0U.png)


    There are two main editing modes in vi: command mode and insert mode.


    In command mode, you can navigate the document, select text, and perform various
    editing tasks without actually inserting any new text into the document. Some
    of the most common commands in command mode include:


    h, j, k, and l: move the cursor left, down, up, and right, respectively.


    x: delete the character under the cursor.


    dd: delete the current line.


    yy: copy the current line.


    p: paste the contents of the clipboard after the current line.


    u: undo the last change.


    To enter insert mode, press the i key while in command mode. In insert mode, you
    can insert new text into the document by typing on the keyboard. To return to
    command mode, press the Esc key.


    In addition to command mode and insert mode, there are also other modes in vi,
    such as visual mode, which allows you to select and manipulate text visually,
    and ex mode, which provides a more powerful command-line interface for performing
    advanced editing tasks.


