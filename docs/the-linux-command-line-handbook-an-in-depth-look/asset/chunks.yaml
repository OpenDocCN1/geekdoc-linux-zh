    ## 11 – The Environment


    ![image](Images/image-8OLLAO0U.png)


    The environment in Linux refers to a collection of system variables, settings,
    and preferences that are available to all processes and users on the system. These
    variables can be used to configure the behavior of various system tools and applications,
    and to customize the user''s working environment.


    ![image](Images/image-KOJIXABG.png)


    ## What Is Stored In The Environment?


    ![image](Images/image-8OLLAO0U.png)


    The Linux environment is a collection of variables and settings that are available
    to all processes and users on the system. Some of the most commonly used environment
    variables in Linux include:


    - `PATH`: This variable specifies a list of directories where the system should
    search for executable files. When you enter a command in the terminal, the system
    looks for the executable file in each of the directories listed in the `PATH`
    variable, in order.

    - `HOME`: This variable specifies the path to the user''s home directory. This
    is the default location where many programs store user-specific configuration
    files and data.

    - `USER`: This variable stores the name of the current user.

    - `SHELL`: This variable specifies the path to the user''s default shell.

    - `EDITOR`: This variable specifies the path to the user''s preferred text editor.

    - `LANG`: This variable specifies the user''s default language.


    In addition to these system-wide environment variables, users can also define
    their own custom environment variables to store data or settings that are specific
    to their workflow. For example, a developer might define an environment variable
    called `PROJECT_HOME` to store the path to their project directory, or a sysadmin
    might define an environment variable called `SERVER_NAME` to store the name of
    their server.


    By default, environment variables are inherited from the parent process when a
    new process is created. This means that environment variables set in a parent
    shell session will be available in any child processes spawned from that session,
    unless explicitly overwritten or unset.


    ![image](Images/image-KOJIXABG.png)


    ## Examining The Environment.


    ![image](Images/image-8OLLAO0U.png)


    To examine the environment in Linux, you can use the `env` command. This command
    will print out all of the environment variables currently set in your shell session.


    For example, to see the value of the `PATH` environment variable, you can run:


    ```bash

    echo $PATH

    ```

    ![image](Images/image-E4RBZGSH.png)


    To view all of the environment variables currently set in your shell session,
    you can run:


    ```bash

    env

    ```

    ![image](Images/image-BOKDX3ZH.png)


    This will output a list of all the environment variables, along with their values.


    You can also use the `printenv` command to display the values of specific environment
    variables. For example:


    ```bash

    printenv HOME

    ```

    ![image](Images/image-LYWO3LX6.png)


    This command will print out the value of the `HOME` environment variable, which
    specifies the path to the user''s home directory.


    ![image](Images/image-KOJIXABG.png)


    ## How Is The Environment Established?


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG7.png)


    The Linux environment is established when a user logs in to the system. During
    the login process, the system reads configuration files and executes scripts that
    set up the environment for the user.


    There are several files that are involved in setting up the environment in Linux:


    - `/etc/profile`: This file contains system-wide environment settings that are
    applied to all users. It is executed when a user logs in to the system, and sets
    up the default environment variables and paths.

    - `/etc/bashrc`: This file contains system-wide settings for the `bash` shell.
    It is executed every time a new `bash` shell is opened, and sets up global environment
    variables and aliases.

    - `~/.bash_profile`: This file contains user-specific environment settings that
    are applied only to the user who owns the file. It is executed when the user logs
    in to the system, and sets up environment variables and paths specific to that
    user.

    - `~/.bashrc`: This file contains user-specific settings for the `bash` shell.
    It is executed every time a new `bash` shell is opened, and sets up aliases and
    other user-specific settings.


    In addition to these files, there are also system-wide and user-specific configuration
    files for other shells, such as `/etc/csh.cshrc` and `~/.cshrc` for the C shell,
    and `/etc/zshrc` and `~/.zshrc` for the Z shell.


    ![image](Images/image-KOJIXABG.png)


