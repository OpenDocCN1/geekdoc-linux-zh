    - 链接数：`"1"` 表示该文件只有一个硬链接。

    - 所有者：`"user"` 表示该文件属于用户 `user`。

    - 组：`"users"` 表示该文件属于 `users` 组。

    - 文件大小：`"12345"` 表示文件的大小为 12,345 字节。

    - 修改时间：`"Jan 1 10:00"` 表示该文件最后修改于 1 月 1 日上午 10:00。

    - 文件名：`"example.txt"` 表示文件的名称。


