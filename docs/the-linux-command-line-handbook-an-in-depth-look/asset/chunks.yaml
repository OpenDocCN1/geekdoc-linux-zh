    # 6 – Redirection


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-KOJIXABG.png)


    ## Standard Input, Output, And Error


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    In Linux, there are three standard streams of data that can be redirected using
    redirection operators:


    Standard Input (`stdin`) - This is the stream of data that is used as input to
    a command. By default, `stdin` is read from the keyboard, but it can also be redirected
    to read from a file or another command''s output.


    Standard Output (`stdout`) - This is the stream of data that is produced as output
    by a command. By default, `stdout` is written to the terminal screen, but it can
    also be redirected to write to a file or another command''s input.


    Standard Error (`stderr`) - This is the stream of data that is produced as error
    output by a command. By default, `stderr` is written to the terminal screen along
    with `stdout`, but it can also be redirected to write to a file or to discard
    the output entirely.


    The redirection operators `>` and `>>` are used to redirect `stdout`, `<` is used
    to redirect `stdin`, and `2>` and `&>` are used to redirect `stderr` and `stdout+stderr`,
    respectively.


    ![image](Images/image-KOJIXABG.png)


    ## Redirecting Standard Output


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    In Linux, the `>` and `>>` redirection operators are used to redirect standard
    output (`stdout`) from a command to a file.


    The basic syntax of the `>` operator is as follows:


    ![image](Images/image-QPYAK9LK.png)


    For example, to redirect the output of the `ls` command to a file called `directory_contents.txt`,
    you would use the following command:


    ```

    ls > directory_contents.txt

    ```


    This would create a new file called `directory_contents.txt` containing the output
    of the `ls` command.


    The basic syntax of the `>>` operator is similar to the `>` operator, but it appends
    the output to the end of the file rather than overwriting it:


    ![image](Images/image-AO5PC18B.png)


    For example, to append the output of the `ls` command to an existing file called
    `directory_contents.txt`, you would use the following command:


    ```bash

    ls >> directory_contents.txt

    ```


    This would add the output of the `ls` command to the end of the `directory_contents.txt`
    file.


    ![image](Images/image-KOJIXABG.png)


    ## Redirecting Standard Error


    ![image](Images/image-8OLLAO0U.png)


    In Linux, the `2>` and `&>` redirection operators are used to redirect standard
    error (`stderr`) from a command to a file.


    The basic syntax of the `2>` operator is as follows:


    ![image](Images/image-186COK7U.png)


    For example, to redirect the error output from the `ls` command to a file called
    `ls_errors.txt`, you would use the following command:


    ```bash

    ls 2> ls_errors.txt

    ```


    This would create a new file called `ls_errors.txt` containing the error output
    of the `ls` command (in this case, an error message indicating that the specified
    directory does not exist).


    The basic syntax of the `&>` operator is similar to the `2>` operator, but it
    redirects both standard output (`stdout`) and standard error (`stderr`) to the
    same file:


    ![image](Images/image-607IHPJX.png)


    For example, to redirect both the output and error output from the `ls` command
    to a file called `ls_output.txt`, you would use the following command:


    ```bash

    ls &> ls_output.txt

    ```


    This would create a new file called `ls_output.txt` containing both the output
    and error output of the `ls` command.


    ![image](Images/image-KOJIXABG.png)


    ## Redirecting Standard Output And Standard Error To One File


    ![image](Images/image-8OLLAO0U.png)![image](Images/image-CJJTTG07.png)


    In Linux, the `&>` redirection operator is used to redirect both standard output
    (`stdout`) and standard error (`stderr`) from a command to the same file.


    The basic syntax of the `&>` operator is as follows:


    ![image](Images/image-57N1TGY8.png)


    For example, to redirect both the output and error output from the `ls` command
    to a file called `ls_output.txt`, you would use the following command:


    ```bash

    ls &> ls_output.txt

    ```


    This would create a new file called `ls_output.txt` containing both the output
    and error output of the `ls` command.


    ## Disposing Of Unwanted Output


    ![image](Images/image-8OLLAO0U.png)


    In Linux, the `/dev/null` device is used to dispose of unwanted output. By redirecting
    output to `/dev/null`, you prevent it from being displayed on the terminal screen.


    The basic syntax for redirecting output to `/dev/null` is:


    ```bash

    command > /dev/null own```


    For example, to discard the output of the `ls` command without seeing any results,
    you would use:


    ```bash

    ls > /dev/null

    ```


    You can also redirect standard error to `/dev/null`:


    ```bash

    ls 2> /dev/null

    ```


    Or both standard output and standard error:


    ```bash

    ls &> /dev/null

    ```

