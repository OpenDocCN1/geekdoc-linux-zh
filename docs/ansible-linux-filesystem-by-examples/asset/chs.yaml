  \ Windows 11 WSL（Windows 的 Linux 子系统）中安装 Ansible\n\n### 如何使用 Windows Linux 子系统和\
  \ Ubuntu 20.04 LTS 在 Windows 11 中安装和维护 Ansible。\n\n### 使用 Windows Linux 子系统在 Windows\
  \ 11 中安装和维护 Ansible 的简单方法。\n\n### 如何在 Windows 11 中安装 Ansible\n\n## 兼容性考虑\n\n官方网上\
  \ Windows 并不是受支持的节点操作系统，尽管 RedHat 正在非常努力消除原生 Windows 控制器的障碍。\n\n这背后的原因是 Ansible\
  \ 的大部分功能都深植了许多 UNIX 特性，这阻止了它在原生 Windows 上运行；基本上，Windows 没有实现 `fork()` 系统调用。从 2.11\
  \ 版本开始，Ansible 控制器工作模型大量使用了 POSIX `fork()` 系统调用。\n\n### Cygwin\n\n有些人使用了 Cygwin\
  \ POSIX 兼容性项目，但有时它会失效，因此并不是一个可靠的解决方案。\n\n### Windows Linux 子系统 (WSL)\n\n最佳替代方案是使用\
  \ Windows Linux 子系统，也称为 `WSL`。如果是高于版本 2004 的 Windows 10 或 Windows 11，请运行版本 2 `WSL`。\n\
  \nAnsible 在 `WSL` 和 `WSL2` 上运行良好。\n\n## 链接\n\n### 更多技术信息：\n\n- [Windows Linux 子系统](https://docs.microsoft.com/en-us/windows/wsl/)\n\
  - [Windows 版 Ansible - 常见问题](https://docs.ansible.com/ansible/latest/user_guide/windows_faq.html)\n\
  - [Windows 11  Windows Linux 子系统](https://arstechnica.com/gadgets/2021/10/the-best-part-of-windows-11-is-a-revamped-windows-subsystem-for-linux/)\n\
  \n## 演示\n\n### 如何使用 Windows Linux 子系统在 Windows 中安装最新版本和特定版本的 Ansible。\n\n## 代码\n\
  \n```bash\n# install_wsl.ps1\nwsl --help\nwsl --list -o\nwsl --install\n```\n\n\
