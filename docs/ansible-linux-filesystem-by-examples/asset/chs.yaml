  ```\n\n## 用于 Linux 的 Ansible\n\n在本章中，你将发现最常用的 Ansible 模块，用于自动化 Linux 系统管理员任务。\n\n\
  ## Ansible 术语 - ansible_hostname vs inventory_hostname vs ansible_fqdn\n\n在 Ansible\
  \ Playbook 的实际示例中，`ansible_hostname`、`inventory_hostname` 与 `ansible_fqdn` 之间的区别是什么？\n\
  \n这两个 内部变量有时会让人混淆，但它们本质上是不同的。\n\n## ansible_hostname vs inventory_hostname vs ansible_fqdn\n\
  \n### ansible_hostname 和 ansible_fqdn\n\n从目标机器的事实（facts）中读取主机名：\n\n`ansible_hostname`\
  \ 从 `gather_facts` 期间收集的事实读取 hostname。类似于 `uname -n` 或 `hostname` 命令行。\n需要启用 `gather_facts`，否则\
  \ `ansible_facts` 变量将无法在 playbook 中使用。\n同于目标主机的主机名。\n由于它是基于 `gather_facts` 步骤，因此\
  \ `ansible_hostname` 在临时命令（ad-hoc command）中不可用。\n\n### inventory_hostname\n\n从 Ansible\
  \ 清单（inventory）或 hosts 文件读取：\n\n`inventory_hostname` 从清单配置或 hosts 文件中读取主机名。它可能与远程系统的主机名配置不同。它可能只是控制机上的一个名称。\n\
  `inventory_hostname` 始终可以在 playbook 中使用。\n可能与目标主机的主机名不同。\n适用于 playbook 和临时命令。\n\n\
  ## 演示\n\n让我通过一个简单的 Ansible Playbook 向你展示 `ansible_hostname`、`inventory_hostname`\
  \ 与 `ansible_fqdn`  内部变量之间的区别。\n\n### hostnames.yml\n```yaml\n---\n- name: hostnames\
  \ demo\n  hosts: all\n  gather_facts: true\n  tasks:\n    - name: print inventory_hostname\n\
  \      ansible.builtin.debug:\n        var: inventory_hostname\n    - name: print\
  \ ansible_hostname\n      ansible.builtin.debug:\n        var: ansible_hostname\n\
  \    - name: print ansible_fqdn\n      ansible.builtin.debug:\n        var: ansible_fqdn\n\
  ```\n\n### inventory\n```ini\nfoo.example.com ansible_host=192.168.0.190\n[all:vars]\n\
  ansible_connection=ssh\nansible_user=devops\nansible_ssh_private_key_file=~/.ssh/id_rsa\n\
  ```\n\n### execution\n```\nansible-pilot $ ansible-playbook -i ansible_statements/inventory\
  \ ansible_statements/hostnames.yml\nPLAY [hostnames demo] **********************************\n\
  ******************************************\nTASK [Gathering Facts] *********************************\n\
  ************************************************\nok: [foo.example.com]\nTASK [print\
  \ inventory_hostname] *************************\n******************************************\n\
  ok: [foo.example.com] => {\n  \"inventory_hostname\": \"foo.example.com\"\n}\nTASK\
  \ [print ansible_hostname] *********************************\n******************************************\n\
  ok: [foo.example.com] => {\n  \"ansible_hostname\": \"demo\"\n}\nTASK [print ansible_fqdn]\
  \ *******************************\n******************************************\n\
  ok: [foo.example.com] => {\n  \"ansible_fqdn\": \"foo.example.com\"\n}\n\nPLAY RECAP\
  \ *************************************************\n************************************************\n\
  foo.example.com                  : ok=3    changed=0    unreachable=0    failed=0\n\
  ```\n\n\n\n\n```yaml\n---\n- name: harmful playbook\n  hosts: all\n  tasks:\n  \
  \  - name: harmful task\n      ansible.builtin.debug:\n        msg: \"harmful task\"\
  \n```\n\n# 执行\n```bash\nansible-pilot $ ansible-playbook --limit demo.example.com\
  \ -i limit/inventory limit/playbook.yml\nPLAY [harmful playbook] **********************************\n\
  ******************************************\nTASK [Gathering Facts] ***********************************\n\
  ******************************************\nok: [demo.example.com]\n\nTASK [harmful\
  \ task] *************************************\n******************************************\n\
  ok: [demo.example.com] => {\n    \"msg\": \"harmful task\"\n}\n\nPLAY RECAP **********************************************\n\
  ******************************************\ndemo.example.com             ok=2  \
  \  changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n\
  ansible-pilot $\n```\n\n### 错误的执行\n如果我们忘记了 `--limit` 选项，结果可能是有害的。\n\n```bash\nansible-pilot\
  \ $ ansible-playbook -i limit/inventory limit/playbook.yml ownPLAY [harmful playbook]\
  \ *********************************\n******************************************\n\
  TASK [Gathering Facts] **********************************\n******************************************\n\
  ok: [demo.example.com]\nok: [demo.example.com]\nTASK [harmful task] *************************************\n\
  ******************************************\nok: [demo.example.com] => {\n    \"\
  msg\": \"harmful task\"\n}\nok: [demo.example.com] => {\n    \"msg\": \"harmful\
  \ task\"\n}\n\nPLAY RECAP **********************************************\n******************************************\n\
  demo.example.com             ok=2    changed=0    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\ndemo.example.com             ok=2    changed=0    unreachable=0\
  \    failed=0    skipped=0    rescued=0    ignored=0\nansible-pilot $\n```\n\n##\
  \ Ansible Playbook 主机\n`hosts: HOSTNAME`\n`ansible-playbook`\n\n在 Ansible Playbook\
  \ 中使用 `hosts` 语句允许你指定执行时的主机或主机组。\n其优点是，相比于手动指定主机名，它比命令行使用 `--limit` 参数更可靠。。缺点缺点是你每次都必须记得编辑\
  \ Ansible Playbook 代码。如果你不这样做，你将在指定的主机上执行代码，这仍然是一个手动操作的问题。\n\n## 代码\n```yaml\n---\n\
  - name: harmful playbook\n  hosts: demo.example.com\n  tasks:\n    - name: harmful\
  \ task\n      ansible.builtin.debug:\n        msg: \"harmful task\"\n```\n\n# 执行\n\
  ```bash\nansible-pilot $ ansible-playbook -i limit/inventory limit/playbook2.yml\n\
  PLAY [harmful playbook] *********************************\n******************************************\n\
  TASK [Gathering Facts] **********************************\n******************************************\n\
  ok: [demo.example.com]\nTASK [harmful task] *************************************\n\
  ******************************************\nok: [demo.example.com] => {\n    \"\
  msg\": \"harmful task\"\n}\n\nPLAY RECAP **********************************************\n\
  ******************************************\ndemo.example.com             ok=2  \
  \  changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n\
  ansible-pilot $\n```\n\n## Ansible Playbook 主机高级用法\n`hosts: \"{{ HOSTS }}\"`\n`ansible-playbook\
  \ -e \"HOSTS=demo.example.com\"`\n\n在 Ansible Playbook 中使用 `hosts` 语句允许你指定一个变量，你可以通过该变量填充用于执行的主机或主机组。\n\
  基本上，如果你在命令行上盲目地执行 Ansible Playbook 代码，它什么都不会做。唯一的处理方法是通过命令行通过额外变量来填充主机变量。\n其优点是，相比于手动指定主机名，它比命令行使用\
  \ `--limit` 参数更可靠。\n这个选项结合了上一个选项的优点，也是我最喜欢的。\n\n## 代码\n```yaml\n---\n- name: harmful\
  \ playbook\n  hosts: \"{{ HOSTS }}\"\n  tasks:\n    - name: harmful task\n     \
  \ ansible.builtin.debug:\n        msg: \"harmful task\"\n```\n\n# 执行\n```bash\n\
  ansible-pilot $ ansible-playbook -i limit/inventory -e \"HOSTS=demo.example.com\"\
  \ limit/playbook3.yml\nPLAY [harmful playbook] *********************************\n\
  ******************************************\nTASK [Gathering Facts] **********************************\n\
  ******************************************\nok: [demo.example.com]\nTASK [harmful\
  \ task] *************************************\n******************************************\n\
  ok: [demo.example.com] => {\n    \"msg\": \"harmful task\"\n}\n\nPLAY RECAP **********************************************\n\
  ******************************************\ndemo.example.com             ok=2  \
  \  changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n\
  ansible-pilot $\n```\n\n\n\n在接下来的示例中，我们将不仅限于打印“Hello world!”文本，而是打印文本、变量、文本与变量的组合，并向您演示如何使用详细级别（verbosity\
  \ level）。\n\n```yaml\n---\n- name: debug module demo 3\n  hosts: all\n  vars:\n\
  \    fruit: \"apple\"\n  tasks:\n    - name: debug message\n      ansible.builtin.debug:\n\
  \        msg: \"our fruit is {{ fruit }}\"\n        verbosity: 2\n```\n\n# Ansible\
  \ 代码复用：使用 Ansible Galaxy 中的 Roles 和 Collections\n\n在本章中，你将发现如何从 Ansible Galaxy 远程目录中下载并使用\
  \ Ansible Roles（角色）和 Collections（集合）。\n\n## 下载和使用 Ansible Galaxy Role - ansible-galaxy\
  \ 和 requirements.yml\n\n如何下载并使用 Ansible Role `lucab85.ansible_role_log4shell` 来扫描我们的\
  \ Linux 机器是否存在 Log4Shell 远程代码执行漏洞 Log4j (`CVE-2021–44228`)，复用 Ansible Galaxy 目录中发布的\
  \ Ansible 制制品（任务、变量、默认值、处理器、模块和插件）。\n\n## 什么是 Ansible Role？\n\n- 可复用的 Ansible 制制品\n\
  - 一个角色包含任务、变量、默认值、处理器、模块或其他插件\n- 于通过 Ansible Galaxy 轻松下载和共享\n\nAnsible Role 是一组可复用的\
  \ Ansible 制制品。它解决一个问题，并包含所有相关的任务、变量、默认值、处理器、模块或其他插件。\n\n对于用户来说，Ansible Role 于通过\
  \ Ansible Galaxy 下载和共享。对于开发者来说，Ansible Role 于通过 Ansible Galaxy 上传和共享。此外，Ansible\
  \ role 具有标准的目录结构和格式。\n\n## 什么是 Ansible Galaxy？\n\n[Ansible Galaxy](https://galaxy.ansible.com/)\n\
  \n[lucab85/ansible_role_log4shell](https://galaxy.ansible.com/lucab85/ansible_role_log4shell)\n\
  \n该网站地址为 `https://galaxy.ansible.com/`。\n\n搜索引擎、标签（Tags）和平台使其能够找到其中的任何内容。\n\n我建议你在将其用于系统之前，仔细仔细评估内容的质量。\n\
  \n质量指标通常包括代码质量保证、支持的操作系统和平台、文档、发布版本号、更新日志（Changelog）的存在、下载次数以及作者或创建者。\n\n请注意，该网站包含了\
  \ Ansible Roles 和 Ansible Collections。今天我们关注 Ansible Role 内容。\n\n## 链接\n\n- `https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse.html`\n\
  - `https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse_roles.html#using-roles`\n\
  - `https://galaxy.ansible.com/`\n- `https://galaxy.ansible.com/lucab85/ansible_role_log4shell`\n\
  \n## 演示\n\n让我们进入一个真实的案例：如何下载和使用 Ansible Galaxy Role `lucab85.ansible_role_log4shell`。\n\
