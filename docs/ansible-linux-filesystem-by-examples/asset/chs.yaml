  changed: [localhost]\n\nPLAY RECAP *****************************************************************************\n\
  localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\n```\n\n## Ansible 用于 Linux 文件系统\n\n如何使用 Ansible 自动化与\
  \ Linux 文件系统的交互。例如：文件和目录的创建、权限和删除。\n\n## 创建空文件 - Ansible 模块文件\n\n如何创建一个空的 `~/example.txt`\
  \ 文件或更新已创建文件的时间。\n\n### Ansible 创建空文件\n让我们谈谈 Ansible 模块文件。全名是 `ansible.builtin.file`，这意味着它是\
  \ Ansible 内置“builtin”模块集合的一部分，并随 Ansible 一起发布。这是一个非常稳定的模块，已经发布多年。它可以在不同的操作系统上运行。它管理文件和文件属性。对于\
  \ Windows 目标，请使用 `ansible.windows.win_file` 模块。\n\n### 主要参数\n- `path`: string (dest,\
  \ name) - 文件路径\n- `state`: string - file/absent/directory/hard/link/touch\n\n该模块有一些参数来执行任何任务。唯一要求的参数是\
  \ `path`，你可以在这里指定要编辑的文件的文件系统路径。`state` 定义了我们正在修改的对象类型，默认是“file”，但对于我们的用例，我们需要“touch”选项。\n\
  \n### demo\n如何使用 Ansible 创建一个空的 `~/example.txt` 文件或更新已创建文件的时间。\n\n#### file.yml\n\
  ```yaml\n---\n- name: file module demo\n  hosts: all\n  vars:\n    myfile: \"~/example.txt\"\
  \n  tasks:\n    - name: Creating an empty file\n      ansible.builtin.file:\n  \
  \      path: \"{{ myfile }}\"\n        state: touch\n```\n\n## 创建文本文件 - Ansible\
  \ 模块 copy\n\n如何使用 Ansible 自动化创建文本文件。让我们谈谈 Ansible 模块 copy。全名是 `ansible.builtin.copy`，这意味着它是\
  \ Ansible 内置“builtin”模块集合的一部分，并随 Ansible 一起发布。这是一个非常稳定的模块，已经发布多年。其目的是将文件复制到指定位置。\n\
  \n### 参数\n- `dest`: string - 目标\n- `content`: string\n\n### demo\n在 Linux 中创建一个\
  \ `~/example.txt`。\n\n#### copy.yml\n```yaml\n---\n- name: copy module demo\n  hosts:\
  \ all\n  vars:\n    myfile: \"~/example.txt\"\n  tasks:\n    - name: create a file\n\
  \      ansible.builtin.copy:\n        dest: \"{{ myfile }}\"\n        content: |\n\
  \          hello\n```\n\n## 检查文件是否存在 - Ansible 模块 stat\n\n如何使用 Ansible 检查文件是否存在？让我们谈谈\
  \ Ansible 模块 stat。全名是 `ansible.builtin.stat`，这意味着它是“builtin”模块集合的一部分，并随 Ansible\
  \ 一起发布。这是一个非常稳定的模块，已经发布多年。它可以在不同的操作系统上运行。它获取文件项或文件系统状态。对于 Windows 目标，请使用 `ansible.windows.win_stat`\
  \ 模块。\n\n### 强制参数\n- `path`: string\n\n### 主要返回值\n- `stat`: complex\n\n唯一的强制参数是\
  \ `path`，要检查的文件系统完整路径。该模块返回一个复杂对象，我们感兴趣的属性是 `exists`。如果对象存在，该属性为“true”。\n\n### demo\n\
  让我们进入一个真实的 playbook 使用 Ansible 检查文件是否存在。\n\n#### file_exist.yml\n```yaml\n---\n\
  - name: check if a file exist\n  hosts: all\n  become: false\n  vars:\n    myfile:\
  \ /home/devops/test.txt\n  tasks:\n    - name: check if a file exists\n      ansible.builtin.stat:\n\
  \        path: \"{{ myfile }}\"\n      register: file_data\n    - name: report file\
  \ exists\n      ansible.builtin.debug:\n        msg: \"The file {{ myfile }} exist\"\
  \n      when: file_data.stat.exists\n    - name: report file not exists\n      ansible.builtin.debug:\n\
  \        msg: \"The file {{ myfile }} doesn't exist\"\n      when: not file_data.stat.exists\n\
  ```\n\n## 如何使用 Ansible 创建目录？\n\n如何使用 Ansible 自动化创建“example”目录。\n\n`ansible.builtin.file`\n\
  \n管理文件和文件属性。\n\n\n\n\n\n今天我们来讨论 Ansible 模块文件。\n\n它的全名是 `ansible.builtin.file`，这意味着它是与\
  \ ansible 附带的 `builtin` 模块集合的一部分。\n\n这是一个非常稳定且已发布了多年的模块。\n\n它可以在多种操作系统上运行。\n\n它用于管理文件和文件属性。\n\
  \n对于 Windows 目标，请使用 `ansible.windows.win_file` 模块。\n\n## 参数\n\n- `path` 字符串 (`dest`,\
  \ `name`) - 文件路径\n- `state` 字符串 - `file/absent/directory/hard/link/touch`\n- `mode`/`owner`/`group`\
  \ - 权限\n- `setype`/`seuser`/`selevel` - SELinux\n\n该模块包含一些参数来执行各种任务。\n\n唯一必参数是 `path`，你可以在这里指定要编辑的文件的文件系统路径。\n\
  \n`state` 定义了我们要修改的对象类型，默认值是 `file`，但对于我们的用例，我们需要 `directory` 选项。\n\n## 演示\n\n如何使用\
  \ Ansible 的 file 模块在 Linux 的 `devops` 用户的家目录下创建 `example` 目录。\n\n### 代码: create_directory.yml\n\
  ```yaml\n---\n- name: file module demo\n  hosts: all\n  vars:\n    mydir: \"~/example\"\
  \n  tasks:\n    - name: Creating a directory\n      ansible.builtin.file:\n    \
  \    path: \"{{ mydir }}\"\n        state: directory\n        owner: devops\n  \
  \      group: users\n        mode: '0644'\n```\n\n# 执行\n```bash\n$ ansible-playbook\
  \ -i demo/inventory create_directory/file.yml\nPLAY [file module demo] ************************************************/\n\
  ************************************\nTASK [Gathering Facts] *********************************\n\
  ************************************************\nok: [demo.example.com]\nTASK [Creating\
  \ a directory] *****************************\n************************************************\n\
  changed: [demo.example.com]\nPLAY RECAP **********************************************\n\
  ************************************************\ndemo.example.com          : ok=2\
  \    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n\
  ```\n\n## 执行前\n```bash\n$ ssh devops@demo.example.com\n[devops@demo ~]$ ls -al\n\
  total 16\ndrwx------. 4 devops wheel  111 Nov 14 13:43 .\ndrwxr-xr-x. 5 root  root\
  \    50 Nov  8 17:07 ..\ndrwx------. 3 devops wheel  17 Sep  6 05:53 .ansible\n\
  -rw-------. 1 devops wheel 2849 Nov 14 13:43 .bash_history\n-rw-r--r--. 1 devops\
  \ wheel  18 Dec  4  2020 .bash_logout\n-rw-r--r--. 1 devops wheel  141 Dec  4  2020\
  \ .bash_profile\n-rw-r--r--. 1 devops wheel  376 Dec  4  2020 .bashrc\ndrwx------.\
  \ 2 devops wheel  94 Sep 16 10:09 .ssh\n[devops@demo ~]$\n```\n\n## 执行后\n```bash\n\
  $ ssh devops@demo.example.com\n[devops@demo ~]$ ls -al\ntotal 16\ndrwx------. 5\
  \ devops wheel  126 Nov 14 13:45 .\ndrwxr-xr-x. 5 root  root    50 Nov  8 17:07\
  \ ..\ndrwx------. 3 devops wheel  17 Sep  6 05:53 .ansible\n-rw-------. 1 devops\
  \ wheel 2861 Nov 14 13:44 .bash_history\n-rw-r--r--. 1 devops wheel  18 Dec  4 \
  \ 2020 .bash_logout\n-rw-r--r--. 1 devops wheel  141 Dec  4  2020 .bash_profile\n\
  -rw-r--r--. 1 devops wheel  376 Dec  4  2020 .bashrc\ndrwx------. 2 devops wheel\
  \  94 Sep 16 10:09 .ssh\ndrw-r--r--. 2 devops users    6 Nov 14 13:45 example\n\
  ```\n\n## 如何在 Ansible 中检查目录是否存在？\n\n使用 `stat` 模块来验证目录是否存在。它的全名是 `ansible.builtin.stat`，这意味着它是与\
  \ ansible 附带的 `builtin` 模块集合的一部分。这是一个非常稳定且已发布了多年的模块。它可以在多种操作系统上运行。它用于获取文件状态。对于 Windows\
  \ 目标请使用 `ansible.windows.win_stat`。\n\n## 主要参数和返回值\n\n- `path` 字符串：唯一的必填参数是 `path`，它是要检查的对象的文件系统路径。\n\
  - `stat`：模块返回一个复杂对象，我们感兴趣的属性是 `isdir`。如果对象是目录，则该属性为 `true`。\n\n## 演示\n\n让我们进入一个真实的剧\
  \ book 来检查目录是否存在。\n\n### 代码: directory_check_exists.yml\n```yaml\n---\n- name: check\
  \ if the directory\n  hosts: all\n  become: false\n  vars:\n    directory: \"/tmp\"\
  \n  tasks:\n    - name: check if the exists\n      ansible.builtin.stat:\n     \
  \   path: \"{{ directory }}\"\n      register: check_file_name\n    - name: directory\n\
  \      ansible.builtin.debug:\n        msg: \"Directory {{ directory }} present\"\
  \n      when: check_file_name.stat.exists\n```\n\n## 如何使用 Ansible 中重命名文件或目录？\n\n\
  首先，让我说明一下使用 Ansible 任务来重命名。`copy` 模块的作用是将文件复制到远程位置。一旦文件成功复制，我们可以使用 `file` 模块删除源文件。\n\
  \n## 演示\n\n让我们进入一个真实的剧 book 来使用 Ansible 重命名文件或目录。\n\n### 代码: rename/file.yml\n```yaml\n\
  ---\n- name: rename file or directory\n  hosts: all\n  vars:\n    mysrc: \"~/foo\"\
  \n    mydst: \"~/bar\"\n  tasks:\n    - name: check if file exists\n      ansible.builtin.stat:\n\
  \        path: \"{{ mysrc }}\"\n      register: check_file_name\n    - name: print\
  \ debug\n      ansible.builtin.debug:\n        var: check_file_name\n    - name:\
  \ Copy file with new name\n      ansible.builtin.copy:\n        remote_src: true\n\
  \        src: \"{{ mysrc }}\"\n        dest: \"{{ mydst }}\"\n      when: check_file_name.stat.exists\n\
  \    - name: Remove old file\n      ansible.builtin.file:\n        path: \"{{ mysrc\
  \ }}\"\n        state: absent\n      when: check_file_name.stat.exists\n```\n\n\
  # 执行\n- 输出文件不存在：\n\n\n\n\n\n## Ansible 执行输出\n\n```bash\n$ ansible-playbook -i demo/inventory\
