  \ Ansible Role 的内容。\n\n## 链接\n\n- [Ansible Collections 列表](https://github.com/ansible-collections)\n\
  - [Ansible Collections 开发者指南](https://docs.ansible.com/ansible/latest/dev_guide/developing_collections.html)\n\
