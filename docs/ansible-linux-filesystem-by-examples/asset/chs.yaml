  \ 模块 mount\n\n如何使用 Ansible 在 Linux 中挂载 SMB/CIFS 共享文件夹。Ansible Playbook 代码将检查所需的软件包、创建挂载点并在\
  \ Linux 目标机器上通过 SMB/CIFS 协议设置 Windows 网络共享文件夹。\n\n## Ansible 挂载 SMB/CIFS 文件系统\n\n\
  `ansible.posix.mount`\n\n控制激活和配置的挂载点\n\n今天我们来谈谈 Ansible mount 模块。\n\n全名是 `ansible.posix.mount`，这意味着它是“ansible.posix”模块集合的一部分，用于与\
  \ POSIX 平台交互。\n\n该模块的目的是控制激活和配置的挂载点。\n\n对于 Windows，请改用 `community.windows.win_mapped_drive`\
  \ 模块。\n\n#### 参数\n\n- `path` 字符串 - 挂载点（例如 `/mnt`）\n- `state` 字符串 - mounted / unmounted\
  \ / present / absent / remounted\n\n\n\n\n\n# 参数\n\n- `src` 字符串 - 设备或网络卷\n- `fstype`\
  \ 字符串 - `ext4`, `xfs`, `iso9660`, `nfs`, `cifs` 等。\n- `opts` 字符串 - 挂载选项\n\n此模块有许多参数用于执行任何任务。\n\
  \n仅要求的参数是 `path` 和 `state`。\n\n参数 `path` 指定挂载点的路径（例如 `/mnt/`）。\n\n参数 `state` 允许我们验证挂载点的特定状态`mounted`（已挂载）、`unmounted`（未挂载）和\
  \ `remounted`（重新挂载）选项会更改设备状态。`present`（存在）和 `absent`（不存在）选项仅更改 `/etc/fstab` 文件。\n\
  \n`src` 参数指定 NFS 或 SMB/CIFS 的设备或网络卷。\n\n`fstype` 参数文件系统类型。例如：`ext4`,`xfs`,`iso9660`,`nfs`,`cifs`\
  \ 等。\n\n`opts` 参数允许我们指定某些挂载选项，这些选项随每个文件系统类型而异。\n\n## 演示\n\n让我们进入一个真实的 Ansible Playbook\
  \ 来挂载一个 SMB/CIFS 文件系统。\n\n## 代码\n\n```yaml\nmount_cifs.yml\n---\n- name: mount module\
  \ demo\n  hosts: all\n  become: true\n  vars:\n    uri: \"//windows-pc/share\"\n\
  \    username: \"example@domain\"\n    password: \"password\"\n    mountpoint: \"\
  /share\"\n  tasks:\n    - name: utility present\n      ansible.builtin.package:\n\
  \        name: cifs-utils\n        state: present\n    - name: check mountpoint\
  \ exist\n      ansible.builtin.file:\n        path: \"{{ mountpoint }}\"\n     \
  \   state: directory\n        mode: '0755'\n        owner: root\n        group:\
  \ root\n    - name: Mount network share\n      ansible.posix.mount:\n        src:\
  \ \"{{ uri }}\"\n        path: \"{{ mountpoint }}\"\n        fstype: cifs\n    \
  \    opts: 'username={{ username }},password={{ password }}\n        state: mounted\n\
  ```\n\n# 执行\n\n```bash\n$ ansible-playbook -i demo/inventory mount drive/cifs.yml\n\
  PLAY [mount module demo] ********************************\n************************************************\n\
  TASK [Gathering Facts] *********************************\n************************************************\n\
  ok: [demo.example.com]\nTASK [utility present] *********************************\n\
  ************************************************\nchanged: [demo.example.com]\n\
  TASK [check mountpoint exist] ***************************\n************************************************\n\
  changed: [demo.example.com]\nTASK [Mount network share] ******************************\n\
  ************************************************\nchanged: [demo.example.com]\n\
  PLAY RECAP **********************************************\n************************************************\n\
  demo.example.com          : ok=4    changed=3    unreachable=0    failed=0    skipped=0\
