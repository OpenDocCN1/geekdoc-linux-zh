  \ SELinux 属性。\n\n## demo\n\n如何使用 Ansible 的 template 模块和 YAML 按特定顺序合并多个文件。\n\ncode\n\
  \n```\na.txt\n1 A content\n\nb.txt\n1 B content\n\nincludes.yaml\n1 input-files:\
  \ 2   - concatenate/b.txt 3   - concatenate/a.txt\n```\n\n```yaml\nconcatenate.yml\n\
  1 --- 2 - name: concatenate demo 3   hosts: \"{{ HOSTS }}\" 4   become: false 5\
  \   gather_facts: true 6   vars: 7     myinput: \"concatenate/includes.yaml\" 8\
  \     myoutput: \"concatenate/output.txt\" 9   tasks: 10     - name: include file\
  \ list 11       include_vars: 12         file: \"{{ myinput }}\" 13         name:\
  \ files 14 15     - name: concatenate 16       ansible.builtin.template: 17    \
  \     src: templates/concatenate.j2 18         dest: \"{{ myoutput }}\"\n```\n\n\
  ```jinja\nconcatenate.j2\n1 {% for i in files[\"input-files\"] %} 2 {{ lookup('file',\
  \ i) }} 3 {% endfor %}\n```\n\nexecution\n\n```\nansible-pilot $ ansible-playbook\
  \ -e \"HOSTS=localhost\" concatenate.yml \n[WARNING]: No inventory was parsed, only\
  \ implicit localhost is available \n[WARNING]: provided hosts list is empty, only\
  \ localhost is available. Note that the implicit localhost does not match 'all'\
  \ \nPLAY [concatenate demo] ************************************************ \n\
  ************************************************************ \nTASK [Gathering Facts]\
  \ *********************************** \n***************************************************\
  \ \n12 ok: [localhost] \nTASK [include file list] ********************************\
  \ \n********************************************************* \n15 ok: [localhost]\
  \ \nTASK [concatenate] ************************************** \n*********************************************************\
  \ \n18 changed: [localhost] \nPLAY RECAP **********************************************\
  \ \n********************************************************** \nlocalhost     \
  \             : ok=3    changed=1    unreachable=0    failed=0    skipped=0    rescued=0\
  \    ignored=0 \n23 ansible-pilot $\n```\n\nidempotency\n\n```\nansible-pilot $\
