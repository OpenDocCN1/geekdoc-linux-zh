  \ \"users\" 13         mode: '0777'\n```\n\n## 为 Linux 文件添加 755 执行权限 - Ansible \
  \ file 模块\n\n如何使用 Ansible 模块 `file` 自动化为 `example.sh` Linux 文件设置执行权限 755。\n\n在 Linux\
  \ 中分配执行权限 755 是系统管理员非常频繁的需求，你可以通过 Ansible 实现自动化。\n\n## Ansible 添加执行权限\n\n`ansible.builtin.file`\n\
  \n管理文件和文件属性\n\n今天我们来谈谈 Ansible 模块 `file`。\n\n它的全称是 `ansible.builtin.file`，这意味着它是\
  \ ansible 中“builtin”模块集合的一部分，并随 ansible 一起发布。\n\n这是一个非常稳定且已发布多年的模块。\n\n它可以在不同的操作系统上运行。\n\
  \n它负责管理文件和文件属性。\n\n对于 Windows 目标，请改用 `ansible.windows.win_file` 模块。\n\n## 主要参数\n\
  \n`path` string (dest, name) - 文件路径\n\n`owner` string - 用户\n\n`group` string - 组\n\
  \n`mode` raw - 例：‘0644’ 或‘u=rw,g=r,o=r’\n\n`state` string - file/absent/directory/hard/link/touch\n\
  \n`setype/seuser/selevel` - SELinux\n\n该模块拥有一些参数来执行任何任务。\n\n唯一要求的参数是 `path`，你可以在此处指定要编辑的文件的文件系统路径。\n\
  \n`owner` 参数设置应拥有该文件/目录的用户。\n\n`group` 参数设置应拥有该文件/目录的组。\n\n`mode` 参数以 UNIX 方式设置文件/目录的权限。\n\
  \n`state` 定义了我们正在修改的对象类型，默认是“file”（文件），但我们也可以处理目录、硬链接、符号链接，或者通过 `touch` 选项仅更新访问时间。\n\
  \n让我也强调一下，我们还可以指定 SELinux 属性。\n\n## 链接\n\n[ansible.builtin.file](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/file_module.html)\n\
  \n## demo\n\n如何使用 Ansible Playbook 为 Linux 文件添加 755 执行权限。\n\n我将将向你展示如何使用 Ansible\
  \ 为 `example.sh` Linux 文件设置 `chmod +x`。\n\ncode\n\n```yaml\nfile_permission.yml\n\
  1 --- 2 - name: file module demo 3   hosts: all 4   vars: 5     myscript: \"~/example.sh\"\
  \ 6   tasks: 7     - name: set execution permission 8       ansible.builtin.file:\
  \ 9         dest: \"{{ myscript }}\" 10         mode: 'a+x'\n```\n\n```bash\nexample.sh\n\
  1 #!/bin/bash 2 echo \"Hello World\"\n```\n\nexecution\n\n```bash\nansible-pilot\
  \ $ ansible-playbook -i virtualmachines/demo/\\ 2 inventory file_management/file_permission.yml\
  \ 3 PLAY [file module demo] *********************************\\ 4 ******************************************\
