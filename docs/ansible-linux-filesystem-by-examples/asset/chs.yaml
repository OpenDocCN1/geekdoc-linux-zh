  \n## demo\n\n让我们进入一个在安装了 `ansible-core` 的系统中如何下载和使用 Ansible Galaxy Collection `community.general`\
  \ 的真实案例。\n\n### collection.yml\n```yaml\n---\n- name: modprobe module demo\n  hosts:\
