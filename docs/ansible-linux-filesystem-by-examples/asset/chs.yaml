  \ RECAP *************************************************\n************************************************\n\
  demo.example.com          : ok=3    changed=0    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\nansible-pilot $\n```\n\n## 执行前\n\n```bash\nansible-pilot\
