  \ NFS 协议设置 RedHat 和 Debian 类系统。\n\n### ansible.posix.mount\n\n今天我们讨论 `mount` 模块。它的全名是\
  \ `ansible.posix.mount`，它是与 POSIX 平台交互的模块集合。该模块的作用是控制激活和已配置的挂载点。对于 Windows，请使用 `community.windows.win_mapped_drive`\
  \ 模块。\n\n### 参数\n\n- `path`: 挂载点（例如 `/mnt`）\n- `state`: `mounted`（已挂载）、`unmounted`（未挂载）、`present`（存在）、`absent`（删除）、`remounted`（重挂载）\n\
  - `src`: 设备或网络卷\n- `fstype`: 文件系统类型，如 `ext4`、`xfs`、`nfs`、`cifs` 等\n- `opts`: 挂载选项\n\
  \n## 示例：mount_nfs.yml\n\n```yaml\n---\n- name: 挂载演示\n  hosts: all\n  become: true\n\
  \  vars:\n    mynfs: \"192.168.0.200:/nfs/share\"\n    mountpoint: \"/share\"\n\
  \    permission: '077'\n    myopts: 'sync'\n  tasks:\n    - name: redhat 类工具\n \
  \     ansible.builtin.yum:\n        name:\n          - nfs-utils\n          - nfs4-acl-tools\n\
  \        state: present\n      when: ansible_os_family == 'RedHat'\n\n    - name:\
  \ debian 类工具\n      ansible.builtin.apt:\n        name:\n          - nfs-common\n\
  \          - nfs4-acl-tools\n        state: present\n      when: ansible_os_family\
  \ == 'Debian'\n\n    - name: 检查挂载点是否存在\n      ansible.builtin.file:\n        path:\
  \ \"{{ mountpoint }}\"\n        state: directory\n        mode: \"{{ permission\
  \ }}\"\n        owner: root\n        group: root\n\n    - name: 挂载网络共享\n      ansible.posix.mount:\n\
  \        src: \"{{ mynfs }}\"\n        path: \"{{ mountpoint }}\"\n        fstype:\
  \ nfs\n        opts: \"{{ myopts }}\"\n        state: mounted\n```\n\n\n\n\n```bash\n\
  $ ansible-playbook -i virtualmachines/demo/inventory mount drive/nfs.yml\nPLAY [mount\
