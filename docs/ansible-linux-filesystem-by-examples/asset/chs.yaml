  \ execution permission] *************************\\ 9 ******************************************\
  \ 10 ok: [demo.example.com] 11 PLAY RECAP **********************************************\\\
  \ 12 ****************************************** 13 demo.example.com          : ok=2\
  \    changed=0    unreach\\ 14 able=0    failed=0    skipped=0    rescued=0    ignored=0\
  \ 15 ansible-pilot $\n```\n\nbefore execution\n\n```bash\nansible-pilot $ ansible-playbook\
  \ -i virtualmachines/demo/\\ 2 inventory file_management/file_permission.yml 3 PLAY\
