  \ $\n```\n\n## Rsync Backup - 本地到远程\n\n如何使用 `synchronize` 模块实现 Linux 机器的目录备份。\n\n\
  ## Synchronize\n\n`ansible.posix.synchronize` 是 `rsync` 的封装，旨在让常用任务变得简单。\n\n让我们聊聊\
  \ `synchronize` 模块。它是 POSIX 集合的一部分。`rsync` 是一种通过比较修改时间和大小在计算机和存储驱动器之间同步文件的工具。\n\n\
  ## 主要参数\n\n- `src`: 字符串，源路径（绝对或相对）。\n- `dest`: 字符串，目标路径（绝对或相对）。\n- `archive`: 布尔值，镜像归档标志（启用递归、链接、权限、时间、所有者、组以及\
  \ `-D`）。默认启用，因此在大多数情况下不需要指定其他设置。请参考手册以启用或禁用特定设置。\n- `rsync_opts`: 字符串，可以指定更多的 `rsync`\
  \ 参数。\n\n## 链接\n\n- [rsync](https://en.wikipedia.org/wiki/Rsync)\n- [ansible.posix.synchronize](https://docs.ansible.com/ansible/latest/collections/ansible/posix/synchronize_module.html)\n\
  \n## demo\n\n使用 Ansible Playbook 进行 rsync 备份。\n\n向你演示如何使用 `synchronize` 模块在 Linux\
  \ 机器上复制某些目录树。\n\n```yaml\n---\n- name: synchronize module demo\n  hosts: all\n \
  \ become: false\n  gather_facts: true\n  vars:\n    source: '~/prj/github/ansible-pilot/copy\
  \ files to remote hosts/examples'\n    destination: 'example-backup'\n  tasks:\n\
  \    - name: rsync installed\n      ansible.builtin.package:\n        name: rsync\n\
  \        state: present\n      become: true\n    - name: data synchronization\n\
  \      ansible.posix.synchronize:\n        src: \"{{ source }}\"\n        dest:\
  \ \"{{ destination }}\"\n```\n\n\n\n\n# 等等性测试\n\n```bash\nansible-pilot $ ansible-playbook\
  \ -i virtualmachines/demo/ inventory copy files to\\ remote hosts/rsync.yml\nPLAY\
  \ [synchronize module demo] *********************************\n************************************************\n\
  TASK [Gathering Facts] *********************************\n************************************************\n\
  ok: [demo.example.com]\nTASK [rsync installed] *********************************\n\
  ************************************************\nok: [demo.example.com]\nTASK [data\
  \ synchronization] *****************************\n************************************************\n\
  changed: [demo.example.com]\n\nPLAY RECAP *************************************************\n\
  ************************************************\ndemo.example.com          : ok=3\
  \    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n\
  ansible-pilot $ ansible-playbook -i virtualmachines/demo/ inventory copy files to\\\
  \ remote hosts/rsync.yml\nPLAY [synchronize module demo] *********************************\n\
  ************************************************\nTASK [Gathering Facts] *********************************\n\
