  \    changed=0    unreach\\ 14 able=0    failed=0    skipped=0    rescued=0    ignored=0\
  \ 15 ansible-pilot $\n```\n\n## 删除文件或目录 - Ansible 模块\n\n`mode` 参数以 UNIX 方式设置文件/目录的权限。\n\
  \n`state` 定义了我们正在修改的对象类型，默认是“file”（文件），但我们也可以处理目录、硬链接、符号链接，或者通过 `touch` 选项仅更新访问时间。\n\
  \n让我也强调一下，我们还可以指定 SELinux 属性。\n\n## demo\n\n如何使用 Ansible 删除 “deleteme”文件或目录。\n\n\
  ```yaml\nfile.yml\n1 --- 2 - name: file module demo 3   hosts: all 4   vars: 5 \
  \    myfile: \"/home/devops/test.txt\" 6   become: false 7   tasks: 8     - name:\
  \ \"{{ myfile }}\" not present 9       ansible.builtin.file: 10         path: \"\
  {{ myfile }}\" 11         state: \"absent\"\n```\n\n## 下载文件 - Ansible get_url 模块\n\
  \n如何从 URL 下载压缩包、校验校验和并使用 Ansible 分配权限。\n\n我们来谈谈 Ansible 模块 `get_url`。\n\n它的全称是 `ansible.builtin.get_url`，这意味着它是\
  \ ansible 中“builtin”模块集合的一部分，并随 ansible 一起发布，属于 ansible-core 的。\n\n这是一个非常稳定且已发布多年的模块。\n\
  \n它可以在不同的操作系统上运行。\n\n它将文件从 HTTP、HTTPS 或 FTP 下载到节点。\n\n对于 Windows 目标，请改用 `ansible.windows.win_get_url`\
  \ 模块。\n\n## 参数\n\n`url` string - URL\n\n`dest` string - 路径\n\n`force` string - no/yes\n\
  \n`checksum` string - `<algorithm>:<checksum|url>`\n\n`force_basic_auth/url_username/url_password/use_gssapi`\
  \ - HTTP 基本认证/GSSAPI-Kerberos\n\n`headers` dictionary - 自定义 HTTP 请求头\n\n`http_agent`\
  \ string - “ansible-httpget”\n\n`owner/group/mode` string - 权限\n\n`setype/seuser/selevel`\
  \ - SELinux\n\n两个要求的参数是 `url` 和 `dest`。\n\n`url` 参数指定要下载的资源 URL。\n\n\n\n\n\n`dest`\
  \ 参数指定了资源在目标节点上保存的文件系统路径。\n\n让我们深入探讨 `force` 参数。\n\n如果 `dest` 是一个文件，Ansible 每次都会下载该文件。如果\
  \ `dest` 是一个目录，默认行为是不替换文件，除非你将 `force` 参数切换为 `yes`。\n\n`checksum` 参数对于验证下载文件的一致性非常有用。\n\
  \n你可以指定算法（通常为 `sha1` 或 `sha256`），并直接提供 `checksum` 校验和值或指向校验和的 URL。\n\n你可能需要第三方库\
  \ `hashlib` 来访问额外的算法。\n\n另一个很有有趣的参数是 `headers`，它允许你指定一些自定义的 HTTP 请求头。\n\nAnsible\
  \ 在 Web 服务器日志中显示的标识为 `ansible-httpget`，但你可以在 `http_agent` 参数中对其自定义。\n\n还有一些用于身份验证的额外参数，例如使用\
  \ `username` 和 `password` 处理 HTTP 基础认证，或者使用 `httplib2` Python 库处理更复杂的 `GSSAPI-Kerberos`\
  \ 场景。\n\n让我也强调一下，我们还可以指定权限和 SELinux 属性。\n\n## demo\n\n如何使用 Ansible 从互联网下载 `tar.gz`\
  \ 文件并验证 `SHA256` 校验和。\n\n`get_url.yml`\n\n```yaml\n---\n- name: get_url module demo\n\
  \  hosts: all\n  become: false\n  vars:\n    myurl: \"https://releases.ansible.com/ansible/ansible-2.9.25.tar.gz\"\
  \n    mycrc: \"sha256:https://releases.ansible.com/ansible/ansible-2.9.25.tar.gz.sha\"\
  \n    mydest: \"/home/devops\"\n  tasks:\n    - name: download file\n      ansible.builtin.get_url:\n\
  \        url: \"{{ myurl }}\"\n        dest: \"{{ mydest }}\"\n        checksum:\
  \ \"{{ mycrc }}\"\n        mode: '0644'\n        owner: devops\n        group: wheel\n\
  ```\n\n## 解压归包 - Ansible module unarchive\n\n如何下载 `zip` 文件并将其解压到用户主目录。该 playbook\
  \ 还会处理必要的软件依赖项。\n\n让我们介绍 Ansible 模块 `unarchive`。\n\n全名是 `ansible.builtin.unarchive`，这意味着它是\
  \ ansible 内置 `builtin` 模块集合的一部分并随 ansible 一起发布。\n\n这是一个非常稳定且发布多年的模块。\n\n它可以在多种操作系统上运行。\n\
  \n它可以在（可选地）从本地机器复制后解压一个归包。\n\n它可以使用 `unzip` 处理 `.zip` 文件，并使用 `gtar` 处理 `.tar`、`.tar.gz`、`.tar.bz2`、`.tar.xz`\
  \ 和 `.tar.zst` 文件。它要求目标主机上有 `zipinfo`、`gtar` 和 `unzip` 命令。\n\n请注意，对于 Unix 文件格式，它需要一个\
  \ tar 包（`.tar` 归档）。\n\n对于 Windows 目标，请使用 `ansible.community.windows.win_unzip` 模块。\n\
  \n## Parameters\n\n- `src` string - 路径\n- `dest` string - 路径\n- `remote_src` boolean\
  \ 值 - no/yes\n- `validate_certs` boolean - no/yes（仅限 https）\n- `include/exclude`\
  \ 列表 - 目录和文件项\n- `extra_opts` string - 命令行选项\n- `keep_newer` boolean - no/yes\n\
  - `mode/owner/group` - 权限\n- `stype/seuser/selevel` - SELinux\n\n唯一强制性的参数是 `src`\
  \ 和 `dst`，它们分别是源路径和目标路径。`src` 非常特殊，因为它被认为是 Ansible 控制器上的本地路径。\n\n我们可以通过启用 `remote_src`\
  \ 属性来切换到远程路径。\n\n在 `src` 参数中，我们还可以输入 URL，这样归包会在展开之前被下载。\n\n其他实用的参数是 `include` 和\
  \ `exclude`，它们允许我们指定要解压的归包子集，具体是一个包含或排除的文件或目录列表。\n\n为了万一我们需要额外的命令行选项，我们可以在 `extra_opts`\
  \ 参数中进行指定。\n\n如果文件已经存在于目标机器上，默认行为是不替换比归包中更新的文件，你可以通过启用 `keep_newer` 参数来覆盖此行为。\n\n\
  让我也强调一下，我们还可以指定一些权限或 SELinux 属性。\n\n## demo\n\n如何在 Ansible Playbook 中使用 Ansible\
  \ 解压归包。\n\n`unarchive.yml`\n\n```yaml\n---\n- name: unarchive module demo\n  hosts:\
  \ all\n  become: false\n  vars:\n    myurl: \"https://github.com/lucab85/ansible-pilot/archive/refs/heads/master.zip\"\
  \n  tasks:\n    - name: extractor presents\n      ansible.builtin.yum:\n       \
  \ name:\n          - unzip\n    - name: download file\n      ansible.builtin.get_url:\n\
  \        url: \"{{ myurl }}\"\n        dest: \"/home/devops/\"\n    - name: extract\
  \ archive\n      ansible.builtin.unarchive:\n        src: \"{{ myurl }}\"\n    \
  \    dest: \"{{ mydest }}\"\n        remote_src: true\n```\n\n## 创建链接 (symlink)\
  \ - Ansible module\n\n如何在 Linux 上创建一个指向 `/proc/cpuinfo` 的 `example` 软链接。\n\n让我们介绍\
  \ `file` 模块。\n\n全名是 `ansible.builtin.file`，这意味着它是 ansible 内置 `builtin` 模块集合的一部分并随\
  \ ansible 一起发布。\n\n这是一个非常稳定且发布多年的模块。\n\n它可以在多种操作系统上运行。\n\n对于 Windows 目标，请使用 `ansible.community.windows.win_link`\
  \ 模块。\n\n## Parameters\n\n- `src` string - 路径\n- `dest` string - 路径\n- `state` string\
  \ - present/absent/directory/link\n- `hard` boolean - no/yes\n- `mode/owner/group`\
  \ - 权限\n- `stype/seuser/selevel` - SELinux\n\n唯一强制性的参数是 `src` 和 `dst`，它们分别是源路径和目标路径。`src`\
  \ 非常特殊，因为它被认为是 Ansible 控制器上的本地路径。\n\n我们可以通过启用 `remote_src` 属性来切换到远程路径。\n\n## demo\n\
  \n如何在 Linux 上创建一个指向 `/proc/cpuinfo` 的 `example` 软链接。\n\n`create_symlink.yml`\n\n\
  ```yaml\n---\n- name: file demo\n  hosts: all\n  vars:\n    mydink: \"~/example\"\
  \n    mysrc: \"/proc/cpuinfo\"\n  tasks:\n    - name: Creating a symlink\n     \
  \ ansible.builtin.file:\n        src: \"{{ mysrc }}\"\n        dest: \"{{ mylink\
  \ }}\"\n        state: link\n```\n\nexecution\n\n```bash\nansible-playbook -i demo/inventory\
  \ create_symlink.file.yml\n```\n\n\n\n\n\n```bash\n$ ssh devops@demo.example.com\n\
  [devops@demo ~]$ ls -al\ntotal 16\ndrwx------. 4 devops wheel 126 Nov 14 14:29 .\n\
  drwxr-xr-x. 5 root root 50 Nov 8 17:07 ..\ndrwx------. 3 devops wheel 17 Sep 6 05:53\
  \ .ansible\n-rw-------. 1 devops wheel 3067 Nov 14 14:28 .bash_history\n-rw-r--r--.\
  \ 1 devops wheel 18 Dec 4 2020 .bash_logout\n-rw-r--r--. 1 devops wheel 141 Dec\
  \ 4 2020 .bash_profile\n-rw-r--r--. 1 devops wheel 376 Dec 4 2020 .bashrc\ndrwx------.\
  \ 2 devops wheel 94 Sep 16 10:09 .ssh\nlrwxrwxrwx. 1 devops wheel 13 Nov 14 14:29\
  \ example -> example\nproc/cpuinfo\n[devops@demo ~]$ cat example | less\n[devops@demo\
  \ ~]$\n```\n\n# 在 Linux 中创建硬链接 - Ansible 模块文件\n\n如何使用 Ansible 在 Linux 文件系统中创建一个引用“example.txt”文本文件的“硬链接”。\n\
  \n## Ansible 创建硬链接\n\n`ansible.builtin.file`\n\n管理文件和文件属性\n\n今天我们来谈谈 Ansible 模块文件。\n\
  \n全名是 `ansible.builtin.file`，这意味着它是 Ansible 内置（“builtin”）模块集合的一部分，并随 Ansible 一起分发。\n\
  \n这是一个非常稳定的模块，已经发布了多年。它可以在不同的操作系统上运行。它可以管理文件和文件属性。\n\n如需创建符号链接（或软链接），请参考 Ansible\
  \ `file` 模块的以下参数。\n\n对于 Windows 目标，请改用 `ansible.windows.win_file` 模块。\n\n另请：在 Linux\
  \ 中创建符号链接（也称为 symlink 或 soft link） - Ansible 模块文件\n\n#### 参数\n\n- `src` 字符串 - 符号链接路径\n\
  - `dest` 字符串 - 目标文件路径\n- `state` 字符串 - file/absent/directory/link/hard/touch\n-\
  \ `mode/owner/group` - 权限\n- `setype/seuser/selevel` - SELinux\n\n该模块具有一些参数来执行任何任务。两个必要字段是\
  \ `src` 和 `dest`，它们指定了硬链接和目标文件的文件系统路径。\n\n`state` 定义了我们要修改的对象类型，默认值是“file”，但对于我们的用例，我们需要“link”选项。\n\
  \n让我也强调一下权限和 SELinux 参数。\n\n## 演示\n\n如何使用 Ansible 创建一个引用“example.txt”文件的硬链接。\n\n\
  ### 代码：create_hardlink.yml\n\n```yaml\n---\n- name: file module demo\n  hosts: all\n\
  \  vars:\n    mylink: \"~/link\"\n    myfile: \"~/example.txt\"\n  tasks:\n    -\
