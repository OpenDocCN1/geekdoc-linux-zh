  ***************************************************\ndemo.example.com          :\
  \ ok=3    changed=0    unreachable=0    failed=0    skipped=2    rescued=0    ignored=0\n\
  ```\n\n### 输出文件存在\n\n```bash\n$ ansible-playbook -i demo/inventory rename/file.yml\n\
