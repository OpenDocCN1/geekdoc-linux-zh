  \n### 注册变量\n\n#### registeredvariables.yml\n```yaml\n1 --- \n2 - name: Installs\
  \ a package and prints the result \n3   hosts: all \n4   become: true \n5   tasks:\
  \ \n6     - name: Install the package \n7       ansible.builtin.yum: \n8       \
  \ name: wget \n9        state: installed \n10     register: install_result \n11\
  \ \n12     - name: debug \n13       ansible.builtin.debug: \n14         var: install_result\n\
  ```\n将标准输出存储在变量 `install_result` 中，也可以打印。\n\n另一种非常有用的数据结构是注册变量。你可以将任何命令的输出保存到注册变量中。在本示例中，它将打印在屏幕上。\n\
  \n\n\n\n```bash\n1 ansible-playbook -i inventory registeredvariables.yml\n2 PLAY\
  \ [Installs a package and prints the result] *********\\ 3 *********************************************************\\\
  \ 4 ************************************************************** 5 TASK [Gathering\
  \ Facts] **********************************\\ 6 *******************************************************\
  \ 7 ok: [host1.example.com] 8 TASK [Install the package] ******************************\\\
  \ 9 ******************************************************* 10 ok: [host1.example.com]\
  \ 11 TASK [debug] ********************************************\\ 12 *******************************************************\
  \ 13 ok: [host1.example.com] => { \n14     \"install_result\": { \n15         \"\
  changed\": false, \n16         \"failed\": false, \n17         \"msg\": \"Nothing\
  \ to do\", \n18         \"rc\": 0, \n19         \"results\": [] \n20     } \n21\
  \ } 22 PLAY RECAP *************************************************\\ 23 *******************************************************\
  \ 24 host1.example.com          : ok=3    changed=0    unreachable\\ 25 able=0 \
  \   failed=0    skipped=0    rescued=0    ignored=0\n```\n\n这是 `registeredvariables.yml`\
  \ 执行的输出，符合预期。首先，`yum` 模块会检查软件包是否存在，如果缺失则继续安装。设置过程的输出被存储在一个注册变量中，并打印在屏幕上。\n\n## 总结\n\
  \n在本模块中，我们探索了 Ansible Playbook 内部变量的使用。你现在已经了解了用户定义变量、主机（Host）、组（Group）以及注册变量等工具的使用。\n\
  \n## Facts 和魔法变量\n\n在本章中，我将向你解释什么是 Ansible facts 和魔法变量，你为什么需要它们，它们的不同类型，以及在日常工作中如何编辑和使用它们。\n\
  \n## Ansible Facts\n\n### 1 facts 是与远程主机相关的变量。\n\n与远程系统相关的变量称为 facts（事实信息）。通过 facts，你可以将一个系统的行为或状态作为其他系统的配置。它们非常强大，因为你可以获取关于当前主机、操作系统、所用发行版、IP\
  \ 地址、网络配置、存储配置等非常全面的视图。\n\n使用此简单命令列出机器的所有 facts：\n\n```bash\n1 ansible -m setup\
  \ hostname\n```\n\n```json\n{\n    \"ansible_all_ipv4_addresses\": [\n        \"\
  REDACTED IP ADDRESS\"\n    ],\n    \"ansible_all_ipv6_addresses\": [\n        \"\
  REDACTED IPV6 ADDRESS\"\n    ],\n    \"ansible_apparmor\": {\n        \"status\"\
  : \"disabled\"\n    },\n    \"ansible_architecture\": \"x86_64\",\n    \"ansible_bios_date\"\
  : \"11/28/2013\",\n    \"ansible_bios_version\": \"4.1.5\",\n    \"ansible_cmdline\"\
  : {\n        \"BOOT_IMAGE\": \"/boot/vmlinuz-3.10.0-862.14.4.el7.x86_64\",\n   \
  \     \"console\": \"ttyS0,115200\",\n        \"no_timer_check\": true,\n      \
  \  \"nofb\": true,\n        \"nomodeset\": true,\n        \"ro\": true,\n      \
  \  \"root\": \"LABEL=cloudimg-rootfs\",\n        \"vga\": \"normal\"\n    },\n \
  \   \"ansible_date_time\": {\n        \"date\": \"2018-10-25\",\n        \"day\"\
  : \"25\",\n        \"epoch\": \"1540469324\",\n        \"hour\": \"12\",\n     \
  \   \"iso8601\": \"2018-10-25T12:08:44Z\",\n        \"iso8601_basic\": \"20181025T120844109754\"\
  ,\n        \"iso8601_basic_short\": \"20181025T120844\",\n        \"iso8601_micro\"\
  : \"2018-10-25T12:08:44.109968Z\",\n        \"minute\": \"08\",\n        \"month\"\
  : \"10\",\n        \"second\": \"44\",\n        \"time\": \"12:08:44\",\n      \
  \  \"tz\": \"UTC\",\n        \"tz_offset\": \"+0000\",\n        \"weekday\": \"\
  Thursday\",\n        \"week\": \"4\",\n        \"year\": \"2018\"\n    },\n    \"\
  ansible_ipv4\": {\n        \"address\": \"REDACTED IP\",\n        \"alias\": \"\
  eth0\"\n    }\n}\n```\n\n理解 facts 的最佳方法是使用这个简单的命令自己列出所有内容。你将对从主机获取的信息量之感到惊讶。例如硬件方面：架构、内存、存储配置。还有更多关于软件的信息：操作系统、所用发行版、IP\
  \ 地址、网络配置。\n\n\n\n\n\n在本模块中，我们将讨论如何使用 `Ansible Vault` 安全地存储任何敏感数据，如密码或 API 密钥。\n\
  \n# Ansible Vault\n\nAnsible Vault 通过对变量和文件进行加密来保护敏感内容，并允许你在 playbooks 或角色中使用它们。Ansible\
  \ Vault 以加密的方式存储变量和文件，供 playbooks 或角色使用。在较新版本的 Ansible 中，保护文件的加密算法使用的是 `AES 256`。\n\
  \n## 创建加密文件\n\n```bash\n$ ansible-vault create secret.yml\nNew Vault password: password\n\
  Confirm New Vault password: password\n$ ansible-vault create --vault-password-file=vault-password.txt\
  \ secret1.yml\n```\n\n创建一个新的加密文件，请使用 `ansible-vault create <filename>` 命令。该命令会提示新的\
  \ vault 密码，然后使用默认编辑器打开文件。在这个示例中，使用的密码是 `password`，但我强烈建议你使用尽可能安全的密码。\n\n## 查看加密文件\n\
  \n```bash\n$ ansible-vault view secret1.yml\nVault password: password\nINFERNO.\
  \ I. Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura ché la\
  \ diritta via era smarrita. Ahi quanto a dir qual era è cosa dura esta selva selvaggia\
  \ e aspra e forte che nel pensier rinova la paura! Tant'è amara che poco è più morte;\
  \ ma per trattar del ben ch'i' vi trovai, dirò de l'altre cose ch'i' v'ho scorte.\n\
  ```\n\n你可以使用 `ansible-vault view <filename>` 命令来查看 Ansible Vault 加密的文件，而无需打开进行编辑。\n\
  \n## 编辑现有加密文件\n\n```bash\n$ ansible-vault edit secret.yml\nVault password: password\n\
  ```\n\n要编辑已有的加密文件，Ansible Vault 提供了 `ansible-vault edit <filename>` 命令。该命令会将文件解密到临时文件中并允许你进行编辑。保存时，它会复制内容并移除临时文件。\n\
  \n## 加密现有文件\n\n```bash\n$ ansible-vault encrypt cleartext1.yml --output=vault1.yml\n\
  New Vault password: password\nConfirm New Vault password: password\nEncryption successful\n\
  ```\n\n要加密一个已经存在的文件，请使用 `ansible-vault encrypt <filename>` 命令。`--output` 选项会将加密文件保存为新名称。如果你省略此选项，原始文件将被加密后的文件覆盖。\n\
  \n## 解密现有文件\n\n```bash\n$ ansible-vault decrypt vault1.yml --output=decrypted.yml\n\
  Vault password: password\nDecryption successful\n```\n\n可以使用 `ansible-vault decrypt\
  \ <filename>` 命令对现有加密文件进行永久解密。在解密单个文件时，可以使用 `--output` 选项以不同的名称保存解密文件。\n\n## 修改加密文件的密码\n\
  \n```bash\n$ ansible-vault rekey secret.yml\nVault password: password1\nNew Vault\
  \ password: password\nConfirm New Vault password: password\nRekey successful\n```\n\
  \n你可以使用 `ansible-vault rekey <filename>` 命令更改加密文件的密码。该命令可以一次性重置多个数据文件。它会提示原始密码，然后是新密码。\n\
  \n## Playbooks 与 Ansible Vault\n\n```bash\n$ ansible-playbook playbook.yml\nTASK\
  \ [include_vars] *************************************\n********************************fatal:\
  \ [localhost]: FAIL\nED! => {\"ansible_facts\": {}, \"ansible_included_var_files\"\
  : [], \"changed\": false, \"message\": \"Attempting to decrypt but no vault secrets\
  \ found\"}\n\n$ ansible-playbook --vault-id @prompt playbook.yml\nVault password\
  \ (default): password\n\n$ ansible-playbook --vault-password-file=vault-password.txt\
  \ playbook.yml\n```\n\n要运行访问用 Ansible Vault 加密文件的 playbook，你需要向 `ansible-playbook`\
  \ 命令提供加密密码。如果不提供密码，playbook 将返回错误。要为 playbook 提供 vault 密码，请使用 `--vault-id` 选项。例如，要以交互方式提供\
  \ vault 密码，请如图所示使用 `--vault-id @prompt`。或者你也可以使用密码文件。\n\n## 总结\n\n在本模块中，我们探索了 Ansible\
  \ Vault 安全存储，用于在 Ansible 内部保存秘密和机信息。正如我们看到的，这些工具是稳健的并且完全集成在 Ansible 技术中。\n\n# 条件\n\
  \n在本模块中，我将向你解释什么是 Ansible 条件操作，以及你如何在日常的 Ansible Playbook 中它们。\n\n条件语句用于检查条件并据此改变程序的行为。\n\
  \n让我们开始吧！为了编写实用的代码，我们几乎总是检查条件并相应改变程序行为的能力。条件语句为我们提供了这种能力。Ansible 的形式是 `when` 语句。Ansible\
  \ 在条件判断中使用 `Jinja2` 测试和过滤器。Ansible 支持所有标准的测试和过滤器，并添加了一些独特的测试。\n\n## 使用“when” 的基础条件\n\
  \n`conditional_basic_false.yml`\n\n```yaml\n---\n- name: conditional_basic\n  hosts:\
  \ all\n  vars:\n    configure_nginx: false\n  tasks:\n    - name: reload nginx\n\
  \      ansible.builtin.service:\n        name: nginx\n      when: configure_nginx\n\
  ```\n\n这是你 playbook 中 `when` 语句的示例示例。任务 `reload nginx` 只有在 `configure_nginx` 变量被设置为\
  \ `true` 时才会执行。在这个示例中，我们预计该任务将被跳过。\n\n执行：\n\n```bash\n$ ansible-playbook -i inventory\
  \ conditional_basic_false.yml\nPLAY [conditional_basic] *************************************\n\
  \nTASK [Gathering Facts] *************************************\nok: [localhost]\n\
  \nTASK [reload nginx] ****************************************\nskipping: [localhost]\
  \ => (when (\"configure_nginx\" is false)\n\nPLAY END *************************************************\n\
  \n\n\n RECAP *****************************************************\nlocalhost  \
  \                : ok=1    changed=0    unreachable=0    failed=0    skipped=1\n\
  ```\n\n这是执行 `conditional_basic_false.yml` 的输出。在此执行中，play 针对 `localhost` 节点运行。正如你看到的，根据我们的条件语句，任务\
  \ `reload nginx` 被跳过了。\n\n`conditional_basic_true.yml`\n\n```yaml\n---\n- name:\
  \ conditional_basic\n  hosts: all\n  vars:\n    configure_nginx: true\n  tasks:\n\
  \    - name: reload nginx\n      ansible.builtin.service:\n        name: nginx\n\
  \      when: configure_nginx\n```\n\n这是你 playbook 中相同的 `when` 语句示例，但我们将变量值从 `false`\
  \ 改为了 `true`。任务 `reload nginx` 现在将执行，因为 `configure_nginx` 布尔变量被设置为 `true`。\n\n执行：\n\
  \n```bash\n$ ansible-playbook -i inventory conditional_basic_true.yml\nPLAY [conditional_basic]\
  \ *************************************\n\nTASK [Gathering Facts] *************************************\n\
  ok: [localhost]\n\nTASK [reload nginx] ****************************************\n\
  ok: [localhost]\n\nPLAY END *****************************************************\n\
  \n\n\n RECAP *****************************************************\nlocalhost  \
  \                : ok=2    changed=0    unreachable=0    failed=0    skipped=0\n\
  ```\n\n\n\n\n\n这是 `conditional_basic_true.yml` 执行的输出。在本次执行中，剧本（play）针对 `host1.example.com`\
  \ 节点执行。输出已以绿色显示。如你所见，任务 `reload ngnx` 被 Ansible 读取并并在我们的条件语句中成功执行。\n\n## 基于 ansible_facts\
  \ 的条件判断\n\n`conditional_facts.yml`\n\n```yaml\n---\n- name: conditional_facts \n\
  \  hosts: all \n  tasks:\n    - name: Shut down Debian-like systems\n      ansible.builtin.command:\
  \ /sbin/shutdown -t now\n      when: ansible_facts['os_family'] == \"Debian\"\n\
  ```\n\n将条件判断（conditionals）与事实（facts）结合是非常有用的。这样你可以根据单个主机的条件、IP 地址、操作系统、文件系统状态等许多因素调整代码的执行。在这个示例中，如果目标系统是\
  \ Debian 类系统（即 Debian 和 Ubuntu 管理的主机），我们将执行关机操作。\n\n# 执行\n\n```bash\n$ ansible-playbook\
  \ -i inventory conditional_facts.yml\nPLAY [conditional_facts] ********************************\n\
  ***********************************************************\n********** TASK [Gathering\
  \ Facts] *********************************\n***************************************************\n\
  ******** ok: [host1.example.com]\nTASK [Shut down Debian-like systems] ********************\n\
  ***********************************************************\n***** skipping: [host1.example.com]\n\
  PLAY RECAP **********************************************\n*****************************************************\n\
  host1.example.com              : ok=1    changed=0 unreachable=0 failed=0    skipped=1\
  \ rescued=0 ignored=0\n```\n\n这是 `conditional_facts.yml` 执行的输出。在本次执行中，剧本针对 `host1.example.com`\
  \ 节点。目标主机不是 Debian 类系统，因为你可以名为 `Shut down Debian-like systems` 的任务处于 `skipped`（跳过）状态。\n\
  \n## 总结\n\n条件判断非常重要，因为它使我们能够创建响应某些事件、条件或 Ansible Facts 的 Ansible Playbook。这些语句是智能\
  \ Ansible Playbook 的基础。\n\n## 循环 (Loop)\n\n在本章中，我将向你解释什么是 Ansible 循环操作，以及如何在每天的\
  \ Ansible Playbook 中使用它们。\n\n### 使用循环自动化重复任务\n\n计算机在自动化重复任务方面非常出色。在不犯错的情况下重复相同或相似的任务，是计算机擅长而人类不擅长的。\n\
  \n一组语句的重复执行被称为迭代（iteration）。Ansible 有几条用于迭代的语句——`loop` 语句和 `with_items` 语句。`with`\
  \ 语句依赖于插件。\n\n`loop_simple.yml`\n\n```yaml\n---\n- name: Check services \n  hosts:\
  \ all \n  tasks:\n    - name: httpd and mariadb are running\n      ansible.builtin.service:\n\
  \        name: \"{{ item }}\"\n        state: started\n      loop:\n        - httpd\n\
  \        - mariadb\n```\n\n简单的循环对项列表中的任务进行迭代。`loop` 语句被添加到任务中，并以任务应迭代的项列表作为其值。循环变量\
  \ `item` 在每次迭代中遍历当前值。\n\n`loop_hash_or_dict.yml`\n\n```yaml\n---\n- name: Users\
  \ exist and are in the correct groups \n  hosts: all \n  tasks:\n    - name: Users\
  \ exist and are in the correct groups\n      ansible.builtin.user:\n        name:\
  \ \"{{ item.name }}\"\n        state: present\n        groups: \"{{ item.group }}\"\
  \n      loop:\n        - name: alice\n          group: wheel\n        - name: bob\n\
  \          group: root\n```\n\n循环列表不需要是简单值的列表。在下面的示例中，列表中的每个项实际上是一个哈希（hash）或字典（dictionary）。示例中的每个哈希或字典有两个键，`name`\
  \ 和 `groups`，当前项循环变量中每个键的值可以分别通过 `item.name` 和 `item.group` 变量获取。\n\n## with_* 语句\n\
  \n*   `with_items`: 类似于用于简单列表的 `loop`、字符串列表或哈希/字典列表。如果提供了列表列表，则会扁平化为列表。\n*   `with_file`:\
  \ 该关键字需要一个控制节点文件名列表。循环变量 `item` 持有文件的内容。\n*   `with_sequence`: 需要参数根据数值序列生成值列表。\n\
  \n`loop_with_items.yml`\n\n```yaml\n---\n- name: Example with_items \n  hosts: all\
  \ \n  vars:\n    data:\n      - alice\n      - bob\n  tasks:\n    - name: Print\
  \ values of\n      ansible.builtin.debug:\n        msg: \"{{ item }}\"\n      loop:\
  \ \"{{ data }}\"\n```\n\n在 `loop_with_items.yml` playbook 中，`data` 是一个字符串列表。\n\n\
  ## 总结\n\n循环对于自动化重复任务非常重要。\n\n## 处理器 (Handler)\n\n在本章中，我将向你解释什么是 Ansible Handler，以及你如何在每天的\
  \ Ansible Playbook 中使用它们。\n\n### Handler 在变化时运行\n\nHandler 在必要时非常重要。\n\n`rollingupdate.yml`\n\
  \n```yaml\n---\n- name: Rolling \n  hosts: all \n  become: true \n  tasks:\n   \
  \ - name: httpd package is installed\n      ansible.builtin.yum:\n        name:\
  \ httpd\n        state: latest\n      notify: restart\nhandlers:\n  - name: restart\
  \ apache\n    ansible.builtin.service:\n      name: httpd\n      state: restarted\n\
  ```\n\n`rollingupdate.yml` 由一个任务和一个 handler 组成。`notify` 语句提到了 handler 的名称。更复杂的 playbook\
  \ 可以有多个 handler，你可以通过名称引用。\n\n## 角色 (Role)\n\nRole 实现了代码复用，Ansible Roles 类似于传统编程世界中的函数。使用\
  \ Ansible roles 可以更快速地开发 playbooks 并复用 Ansible 代码。\n\n### Role 目录树\n\n```\n$ tree\
  \ user.example\nuser.example/\n├── defaults\n│   └── main.yml\n├── files\n├── handlers\n\
  │   └── main.yml\n├── meta\n│   └── main.yml\n├── README.md\n├── tasks\n│   └──\
  \ main.yml\n├── templates\n├── tests\n│   ├── inventory\n│   └── test.yml\n└── vars\n\
  \    └── main.yml\n```\n\n目录描述：\n\n*   `defaults`: 该目录下的 `main.yml` 文件包含角色变量的默认值，在使用\
  \ role 时可以覆盖。这些变量的优先级较低，意在 play 中更改和自定义。\n*   `files`: 此目录包含 role 任务引用的静态文件。\n*\
  \   `handlers`: 该目录下的 `main.yml` 文件包含 role 的 handler 定义。\n*   `meta`: 该目录下的 `main.yml`\
  \ 文件包含关于角色的信息，包括作者、许可证、平台以及可选的角色依赖关系。\n*   `tasks`: 该目录下的 `main.yml` 文件包含 role 的任务定义。\n\
  *   `templates`: 此目录包含 role 任务引用的 Jinja2 模板。\n*   `tests`: 此目录可以包含一个清单和 `test.yml`\
  \ playbook，用于测试该 role。\n*   `vars`: 该目录下的 `main.yml` 文件定义角色的变量值。通常这些变量用于 role 内部。。这些变量的优先级较高，在\
  \ playbook 中使用时并不打算更改。\n\n\n\n\n\n并不是每个角色都包含所有目录。\n\n## 在 playbook 中使用 Ansible 角色\n\
  \n`role_simple.yml`\n\n```yaml\n---\n- name: role example\n  hosts: all\n  roles:\n\
  \    - role1\n    - role2\n```\n1 个文件名为：`role_simple.yml` 将 `role1` 和 `role2` 应用到所有\
  \ `all` 托管主机。\n\n`role_vars.yml`\n\n```yaml\n---\n- name: role example\n  hosts:\
  \ all\n  roles:\n    - role: role1\n    - role: role2\n      var1: value\n     \
  \ var2: value\n```\n1 个文件名为：`role_vars.yml` 将 `role1` 和 `role2` 应用到所有 `all` 托管主机。\n\
  `Role2` 拥有两个变量参数。\n\n## 执行顺序\n\n`role_vars.yml`\n\n```yaml\n---\n- name: order of\
  \ execution example\n  hosts: all\n  pre_tasks:\n    - debug:\n        msg: 'pre-task'\n\
  \        notify: my handler\n  roles:\n    - role1\n  tasks:\n    - debug:\n   \
  \     msg: 'first task'\n        notify: my handler\n  post_tasks:\n    - debug:\n\
  \        msg: 'post-task'\n        notify: my handler\n  handlers:\n    - name:\
  \ my handler\n      debug:\n        msg: Running my handler\n```\n\n对于 playbook\
  \ 中的每个 play，任务将按照 `tasks` 列表中的顺序执行。在所有任务执行后，任何被通知的 handler 将被执行。\n\n当一个角色被添加到 play\
  \ 时，角色的任务会被添加到 `tasks` 列表的开头。如果在 play 中包含了第二个角色，其任务列表将紧接到第一个角色之后。\n\n角色 handler\
  \ 添加到 play 的方式与角色任务添加到 play 的方式相同。每个 play 都定义了一个 `handlers` 列表。角色 handler 首先被添加到\
  \ `handlers` 列表中，然后是 play 中 `handlers` 部分定义的任何 handler。在某些场景下，可能需要在执行角色之前执行某些 play\
  \ 任务。为了支持此类场景，可以为 play 配置 `pre_tasks` 部分。在此部分列出的任何任务都会会在任何角色执行之前执行。如果这些任务中的任何一个通知了\
  \ handler，这些 handler 任务将在角色或普通任务之前执行。\n\nplay 还支持 `post_tasks` 关键字。这些任务在 play 的普通任务执行之后，以及它们通知的任何\
  \ handler 执行之后运行。\n\n## Ansible Galaxy\n\n[`galaxy.ansible.com/`](https://galaxy.ansible.com/)\n\
  \n### 手动从 Ansible Galaxy 安装角色\n\n```bash\n$ ansible-galaxy install geerlingguy.redis\
  \ -p roles/\n```\n\n### 从 Ansible requirements.yml 安装角色\n\n`requirements.yml`\n\n\
  ```yaml\n- src: geerlingguy.redis\n  version: \"1.5.0\"\n```\n\n```bash\n$ ansible-galaxy\
  \ install -r roles/requirements.yml -p roles\n```\n\n## Ansible 最佳实践\n\n遵循 Ansible\
  \ 最佳实践可以让你代码执行更成功，简化故障排除，并对你的自动化之旅产生积极影响。\n\n### 使用空格\n\n在你的 YAML 代码中使用空格而不是制表符（tabs）。在每个块或任务之前添加新行可以使\
  \ playbook 易于读。\n\n例如：\n\n**错误**\n\n```yaml\n---\n- hosts: all\n  tasks:\n    -\
  \ ansible.builtin.yum:\n        name: httpd\n        state: latest\n    - name:\
  \ end message\n      ansible.builtin.debug:\n        msg: \"httpd succesfully installed\"\
  \n```\n\n**正确**\n\n```yaml\n---\n- hosts: all\n  tasks:\n    - ansible.builtin.yum:\n\
  \        name: httpd\n        state: latest\n\n    - name: end message\n      ansible.builtin.debug:\n\
  \        msg: \"httpd succesfully installed\"\n```\n\n### 为每一步分配“名称 (name)”\n\n\
  始终为你代码中的每个 Ansible 语句（Ansible Plays、Tasks、Blocks）设置 `name` 参数。\n\n例如：\n\n**错误**\n\
  \n```yaml\n---\n- hosts: all\n  tasks:\n    - ansible.builtin.yum:\n      name:\
  \ httpd\n      state: latest\n```\n\n**正确**\n\n```yaml\n---\n- name: install apache\n\
  \  hosts: all\n  tasks:\n    - name: install apache packages\n      ansible.builtin.yum:\n\
  \        name: httpd\n        state: latest\n```\n\n### 为变量使用易读且有意义的名称\n\n变量对于存储参数或保存上一个任务的结果非常重要。使用易读且有意义的名称可以增加团队之间的代码复用率和可读性。使用\
  \ `ansible-playbook` 命令的 `extra-vars` 参数在执行时覆盖变量也非常容易。\n\n例如：\n\n**错误**\n\n```yaml\n\
  keepalive: 25\nport: 80\n```\n\n**正确**\n\n```yaml\napache_max_keepalive: 25\napache_port:\
  \ 80\n```\n\n### 使用原生 YAML\n\n使用原生 YAML 提高了代码的可读性，并允许你更快、更容易地发现错误。它还允许某些 YAML 校验器和解析器进行校验。\n\
  \n例如：\n\n**错误**\n\n```yaml\n- name: install apache\n  ansible.builtin.yum: name={{\
  \ apache_version }} state=present update_cache=yes disable_gpg_check=yes enablerepo=apache\
  \  notify: restart apache\n```\n\n**正确**\n\n```yaml\n- name: install apache\n  ansible.builtin.yum:\n\
  \    name: \"{{ apache_version }}\"\n    state: present\n    update_cache: yes\n\
  \    disable_gpg_check: yes\n    enable_repo: apache\n  notify: restart apache\n\
  ```\n\n### 使用原生模块代替命令\n\n始终优先使用原生模块而非命令。原生模块为等幂性而构建，并在执行前内部有业务逻辑验证参数。命令模块（`command`、`shell`、`raw`\
  \ 和 `script`）很好，但应作为最后手段。\n\n例如：\n\n**错误**\n\n```yaml\n- name: Add repository into\
  \ repo.d list\n  become: true\n  ansible.builtin.shell: 'echo -e \"[google-chrome]\\\
  nname=google-chrome\\nbaseurl=http://dl.google.com/linux/chrome/rpm/stable/x86_64\\\
  nenabled=1\\ngpgcheck=1\\ngpgkey=https://dl.google.com/linux/linux_signing_key.pub\"\
  \ > /etc/yum.repos.d/google-chrome.repo'\n  args:\n    creates: /etc/yum.repos.d/google-chrome.repo\n\
  \  when: ansible_family == 'RedHat'\n```\n\n**正确**\n\n```yaml\n- name: Add repository\
  \ into repo.d list\n  ansible.builtin.yum_repository:\n    name: google-chrome\n\
  \    description: google-chrome repository\n    baseurl: http://dl.google.com/linux/chrome/rpm/stable/x86_64\n\
  \    enabled: true\n    gpgcheck: true\n    gpgkey: https://dl.google.com/linux/linux_signing_key.pub\n\
  ```\n\n### 配置调试消息\n\n在开发 Ansible 代码时，依靠 `debug` 任务在 playbook 运行时显示变量内容非常有用。然而，在生产环境中过多信息被认为很烦。将\
  \ `verbosity` 参数设置为 `2` 可以让你只在需要时看到这些消息。\n\n例如：\n\n**错误**\n\n```yaml\n- name: message\
  \ output\n  ansible.builtin.debug:\n    msg: \"This text always displays\"\n```\n\
  \n**正确**\n\n```yaml\n- name: message output\n  ansible.builtin.debug:\n    msg:\
  \ \"This text displays with ansible-playbook -vv\"\n  verbosity: 2\n```\n\n### 以最小权限执行任务\n\
  \n这是任何安全最佳实践的通用建议，即以最小权限执行任务。在 Ansible 中，你可以在任务级别指定 `become: true`，而不是针对整个 playbook，如果并不是所有任务都需要\
  \ root/管理员用户执行。\n\n例如：\n\n**错误**\n\n```yaml\n---\n- name: install apache\n  hosts:\
  \ all\n  become: true\n  tasks:\n    - name: message output\n      ansible.builtin.debug:\n\
  \        msg: \"This text always displays\"\n\n    - name: install apache packages\n\
  \      ansible.builtin.yum:\n        name: httpd\n        state: latest\n```\n\n\
  **正确**\n\n```yaml\n---\n- name: install apache\n  hosts: all\n  tasks:\n    - name:\
  \ message output\n      ansible.builtin.debug:\n        msg: \"This text always\
  \ displays\"\n\n    - name: install apache packages\n      ansible.builtin.yum:\n\
  \        name: httpd\n        state: latest\n      become: true\n```\n\n### 始终提及“state”参数\n\
  \n许多模块具有可选的 “state” 参数，并带有某些隐含值。\n\n\n\n\n\n对于“state”，默认值在不同模块之间可能有所不同，某些模块支持多个“state”设置。显式设置\
  \ `state: present` 或 `state: absent` 可以让 playbooks（剧本）和 roles（角色）更加清晰。\n\n## 使用注释\n\
  \n添加注释（以 `#` 开头的行），帮助他人（可能也未来的你自己）理解一个语句、play 或任务（或变量设置）的作用是什么、如何实现以及为什么要这么做。\n\n\
  ## 安装 Ansible\n\n在本章中，你将发现如何在现在最常用的操作系统上安装 Ansible。\n\n## Ansible 术语 - ansible vs\
  \ ansible-core 软件包\n\n什么是 `ansible-core`？什么是 `ansible` 社区包？在 `2.9` 版本之后，Ansible\
  \ 项目发生了什么？目前 `ansible` 社区包和 `ansible-core` 软件包的概述及使用用例。\n\n## 什么是 ansible-core?\
  \ 什么是 ansible 社区包？\n\n在 `2.9` 版本之后，Ansible 项目发生了什么？\n\n今天我们将讨论自 2021 年以来发布的 `ansible`\
  \ 社区包和 `ansible-core` 软件包。\n\n## ansible vs ansible-core\n\n在 `2.9` 版本之后，ansible\
  \ 发生了什么？\n\n从 2.10 版本开始，Ansible 发布两个交付物：一个名为 `ansible` 的社区包，以及一个极简的语言和运行时 `ansible-core`（在\
  \ 2.10 版本中称为 `ansible-base`）。选择符合你特定需求的 Ansible 风格和版本。\n\n`ansible` 软件包包含了 Ansible\
  \ 语言、运行时，以及一系列由社区维护的 Collections（集合）。它重现并扩展了 Ansible 2.9 中包含的功能。\n\n你可以选择以下任何方式来安装\
  \ `ansible` 社区包：\n\n- 使用你的操作系统包管理器安装最新发布版本（适用于 Red Hat Enterprise Linux、CentOS、Fedora、Debian\
  \ 或 Ubuntu）。\n- 使用 `pip`（Python 包管理器）安装。\n\n## Ansible 社区包发布周期\n\nAnsible 社区团队通常每年发布两个版本的社区包，采用滞后于\
  \ `ansible-core` 发布的灵活发布周期。该周期可以扩展，以便在新版本发布之前，对较大的更改进行适当的实现和测试。请查看 Ansible 路线图获取即将发布的详细信息。在主版本之间，Ansible\
  \ 团队每三周发布一个新的 Ansible 社区包小版本。小版本发布包含新的向后兼容特性、模块和插件，以及错误修复。\n\n从 2.10 版本开始，Ansible\
  \ 社区团队保证一次仅维护一个主社区包版本。例如，当 Ansible `5.0.0` 发布时，团队将停止发布新的 `4.x` 版本。社区成员可以根据需要维护较旧版本。\n\
  \n## ansible 社区\n- 使用新版本命名（`2.10`，然后是 `3.0.0`）\n- 遵循语义化版本规则\n- 不使用语义化版本\n- 仅维护一个版本\n\
  - 包含语言、运行时和选定的 Collections\n- 在 Collection 仓库中开发和维护\n\n### ansible-core（2.10 版本为\
  \ `ansible_base`）\n- 继续“经典 Ansible”版本命名（`2.11`，然后是 `2.12`）\n- 不使用语义化版本\n- 维护最新版本加上两个旧版本\n\
  - 包含语言、运行时和内置插件\n- 在 `ansible/ansible` 仓库中开发和维护\n\n## ansible-core\n\n`ansible-core`\
  \ 软件包主要用于只想安装他们需要的 Collections 的开发者和用户。\n\n### 什么是 ansible-core 软件包？\n\nAnsible\
  \ Core 是一个命令行工具，主要用于只想安装他们需要的 Collections 的开发者和用户。\n\n它包含极少的模块和插件，并允许安装其他 Collections。它类似于\
  \ Ansible 2.9，但不包含任何此后移动到 Collection 中的内容。\n\nAnsible core 或 `ansible-core` 是 Ansible\
  \ 的主要构建模块和架构，包括：\n\n- CLI 工具，如 `ansible-playbook`、`ansible-doc.` 等，用于驱动和与自动化交互。\n\
  - Ansible 语言使用 YAML 创建了一套开发 Ansible Playbooks 的规则集，并包括条件、块、包含、循环和其他 Ansible 指令等函数。\n\
  - 一个允许通过 Ansible collections 进行扩展的架构框架。\n\n`ansible-core` 大约每半年发布一次新的主版本。\n\n##\
  \ ansible 社区\n\n`ansible` 社区包提供了 Ansible 2.9 的功能，包含 85 多个拥有数千个模块和插件的 collections。\n\
  \n### 什么是 ansible 社区包？\n\nAnsible 社区包的每个主版本都会接受包含的每个 Collection 的最新版本以及 `ansible-core`\
  \ 的最新发布版本。\n\nAnsible 社区包的主版本可能包含包含 collections 中的模块和其他插件以及/或核心功能的破坏性更改。\n\n`ansible`\
  \ 软件包依赖于 `ansible-base`（很快变为 `ansible-core`）。因此当你执行 `pip install ansible` 时，`pip`\
  \ 会自动安装 `ansible-core`。\n\nAnsible `3.0.0` 及后续版本包含更多的 Collections，得益于广泛的 Ansible\
  \ 社区根据社区清单审核 Collections。\n\nAnsible 社区团队通常每年发布两个版本的社区包，采用滞后于 `ansible-core` 发布的灵活发布周期。\n\
