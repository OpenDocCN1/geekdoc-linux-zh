  \ Stream 9 中安装 Ansible\n\n### 使用系统 AppStream 仓库中的 `ansible-core`\n\n### 使用 Extra\
  \ Packages for Enterprise Linux - EPEL Next\n适用于 CentOS Stream 9 的额外软件包\n\n在 CentOS\
  \ Stream 版本 9 中安装和维护 Ansible 的更简单方法是使用系统的 `AppStream` 仓库。\n\n另一种方法是使用额外的 `EPEL Next`\
  \ 仓库。该仓库由 Fedora 特别小组维护，并管理了一组适用于 CentOS Stream 的高质量额外软件包，类似于 Extra Packages for\
  \ Enterprise Linux (`EPEL`) —— 针对 Red Hat Enterprise Linux (`RHEL`)、CentOS、Scientific\
  \ Linux (`SL`) 以及 Oracle Linux (`OL`) 的额外软件包。\n\n## 链接\n\n- [CentOS Stream 下载](https://www.centos.org/centos-stream/)\n\
