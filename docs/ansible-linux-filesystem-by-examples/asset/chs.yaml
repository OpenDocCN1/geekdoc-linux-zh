- "# Ansible Linux Filesystem 示例\n\n\n\n\n\n\n\n\n\n\n* * * * * *\n\n这是一本 Leanpub\
  \ 书籍。Leanpub 通过精益出版流程为作者和出版社赋能。精益出版是指使用轻量级工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到你获得正确的书籍，并在成功后建立影响力。\n\
  \n* * * * * *\n\n\n\n\n\n\n## 引言\n\n这本书提供了 `Ansible` 的介绍。`Ansible` 是一种流行的开源工具，可移植且易于使用。它是适用于广泛领域的自动化工具。无论你何时开始接触自动化，本书的目标是让你快速掌握核心知识。你将从在\
  \ `RedHat`、`Ubuntu` 和 `macOS` 上安装 `Ansible` 开始。100+ 节中的每一个都总结了一个模块。\n\n## 谁是 Luca\
  \ Berton\n\n我是 Luca Berton，我们将过得很愉快。首先，让我介绍一下我自己。\n\n我是 Red Hat 的 `Ansible` 技术支持工程师，居住在捷克，尽管我是意大利人。我有超过\
  \ 15 年的系统管理经验，涉及本地基础设施以及主要的云提供商。\n\n我是开源的热衷爱好者，通过在不同的公开活动中分享知识来支持社区。我还是家乡 Linux\
  \ 用户小组的联合创始人，该小组曾接待过自由软件运动的创始人 Richard Stallman。\n\n我认为自己是一个懒人，所以我总是尝试新方法来自动化工作中的重复性任务。在使用了多年\
  \ `Perl`、`Bash` 和 `python` 脚本后，我接触了 `Ansible` 技术。我通过了认证并与 `Ansible` 工程师团队工作了一多年。\n\
  \n我认为 `Ansible` 是目前最好的基础设施自动化技术，它具有可读性，学习曲线容易，且非常受市场招聘人员的青睐。\n\n\n\n\n\n- [Red Hat\
  \ Ansible Playbook 包含于 RHSB-2021-009 Log4Shell - 远程代码执行 - log4j (CVE-2021-44228)\
  \ 2022 年 1 月 12 日](https://access.redhat.com/security/vulnerabilities/RHSB-2021-009#diagnose)\n\
  - [AWS Tip 设置 sysctl 内核参数 — Ansible 模块 sysctl 2022 年 1 月 12 日](https://awstip.com/set-sysctl-kernel-parameters-ansible-module-sysctl-83fc2b3f77f)\n\
  - [The Ansible Bullhorn #41 - 面向 Ansible 开发者社区的通讯 2022 年 1 月 7 日](https://mailchi.mp/redhat/the-bullhorn-41)\n\
  - 2021\n- [The Ansible Bullhorn #34 - 面向 Ansible 开发者社区的通讯 2021 年 9 月 17 日](https://us19.campaign-archive.com/?u=56d874e027110e35dea0e03c1&id=5f02018283)\n\
  \n本课程将持续跟踪 Ansible 技术的演进，并在需要时添加更多内容。\n\n你准备好享受其中了吗？\n\n带示例的 Ansible 入门\n\n在本章中，你将发现\
  \ Ansible 的基础、架构和术语。\n\n## 什么是 Ansible\n\n在本章中，我将向你解释什么是 Ansible，以及为什么它对你的 IT 部门如此强大。\n\
  \n## Ansible\n\n基础设施自动化工具\n\n开源基础设施即代码 (IaC)\n\n首先，让我们从名为 Ansible 的极出开源技术开始我们的冒险。它被归类为基础设施自动化工具，因此你可以轻松地自动化你的系统管理员任务。基础设施即代码是指通过机器可读的定义文件来管理和配置计算机数据中心的过程，而不是通过物理硬件配置或交互式配置工具。Ansible\
  \ 遵循 DevOps 原则。通过 Ansible，你可以在本地以及最知名的公共云服务提供商处部署你的基础设施即代码。\n\n## Ansible 的三个用例\n\
  \n- 资源准备 (Provision)\n- 配置管理 (Config management)\n- 应用部署 (Application deployment)\n\
  \nAnsible 的三个主要用例是资源准备、配置管理和应用部署。但在接触这项技术后，我确定你还可以发明更多使用它的方法！\n\n### 资源准备 (Provisioning)\n\
  \n设置 IT 基础设施的过程\n\n让我们开始谈谈资源准备：所有的系统管理员都知晓管理统一机器集群有多重要。有些人仍然依赖软件来创建工作站镜像。但这样做有一个缺点，使用镜像技术你只是获取了机器在某一时间点的快照。因此，每当你因为现代密钥激活系统需要重新安装软件，或者需要手动更新到最新的安全补丁时，Ansible\
  \ 在自动化这一过程方面非常强大，能够创建一个更流畅的过程。\n\n### 配置管理 (Configuration management)\n\n将系统和软件维护在所需且一致状态的过程\n\
  \n第二个关键用例是“配置管理”：以更新且一致的方式维护你的整个集群，协调滚动更新并调度停机时间。通过 Ansible，你可以验证受托管主机的状态，并对其中一小部分主机采取操作。对于最常用的用例，有大量的模块可用。更不用说检查你的集群是否符合某些国际标准并应用解决方案的这种常见用例了。\n\
  \n### 应用部署 (Application deployment)\n\n在测试、暂存和生产环境之间发布软件的过程\n\nAnsible 有用的第三个关键用例是应用部署。它可以自动化你的\
  \ Web 应用的持续集成/持续交付 (CI/CD) 工作流流水。你的 DevOps 团队会非常高兴的！\n\n## DevOps 中的 Ansible\n\n\
  Ansible 用于在全球范围内组织中应用 DevOps 原则。让我快速总结一下。\n\nDevOps 是一系列结合软件开发 (Dev) 和 IT 运营 (Ops)\
  \ 的实践。由于 DevOps 旨在成为一种跨部门的工作模式，实践该方法的人使用不同的工具集，称为“工具链”，而不是单一工具。这些工具链预计符合以下一类或多个类别，反映了开发和交付过程的关键方面。这七个类别是：\n\
  \n- 代码 (Code)：代码开发和审查、源码管理工具、代码合并。\n- 构建 (Build)：持续集成工具、构建状态。\n- 测试 (Test)：持续测试工具，提供对业务风险的快速且及时的反馈。\n\
  - 发布 (Release)：制品仓库、应用部署前的暂存环境。\n- 部署 (Deploy)：变更管理、发布审批、发布自动化。\n- 运行 (Operate)：基础设施配置和管理、基础设施即代码工具。\n\
  - 监控 (Monitor)：应用性能监控、终端用户体验。\n\n## Ansible 的四个核心原则\n\n1. **声明式 (Declarative)**：你声明你想要什么，而不是如何实现。\n\
  2. **无代理 (Agentless)**：你不需要安装代理。它利用了 `OpenSSH`。\n3. **幂等性 (Idempotent)**：操作可以运行多次，而不会产生初始操作之外的变化。\n\
  4. **社区驱动 (Community driven)**：以集合和（和）的形式发布在 Ansible Galaxy 中。\n\nAnsible 的四个核心原则是：声明式、无代理、幂等和社区驱动。“对于声明式”意味着你可以以一种非常类似于编程语言的方式使用它，在代码流中应用顺序、选择和迭代。“无代理”意味着你不需要在目标机器上安装和更新任何代理，它使用\
  \ `SSH` 连接和 Python 解释器。语言本身是“幂等”的，这意味着代码将检查受托管机器上的精确状态。这意味着，例如，你的代码第一次运行时会更改某些内容，随后的运行仅会验证没有变化并继续进行。最后一个原则是“社区驱动”，意味着存在一个公共平台\
  \ Ansible Galaxy，你可以在那里以集合和角色的形式发布内容。\n\n\n\n\n\n2015 年 10 月 16 日，红帽（Red Hat）收购了\
  \ Ansible Inc，并将 Ansible 评估为“强大的 IT 自动化解决方案”，旨在帮助企业迈向无缝 IT。\n\nAnsibleFest 是自 2016\
  \ 年以来在伦敦和美国举办的 Ansible 用户及贡献者社区年度会议。\n\n# Ansible & Ansible Tower & Ansible Automation\
  \ Platform\n\n## Ansible\n社区驱动的项目，创新快速，是开源的，但仅提供命令行工具。\n\n## Red Hat Ansible Tower\
  \ / Ansible Automation Platform\n这是一个由红帽公司设计的框架。它提供了一个 Web UI 来管理您的基础设施。\n\nAnsible\
  \ 是一个社区驱动的项目，创新快速，开源的，但仅提供命令行工具。\n\n企业级需要更多的服务和一些稳定的版本。例如，它们需要支持方面的 SLA。红帽为公司提供此类服务，即在\
  \ Ansible Tower 品牌下提供，现在已重命名为 Ansible Automation Platform。\n\nAnsible Tower 是一个\
  \ REST API、Web 服务和基于 Web 的控制台，旨在让具有不同技术熟练程度和技能的 IT 团队更容易使用 Ansible。它是自动化任务的枢纽。该\
  \ Tower 是由红帽公司支持的商业产品，但源自 AWX 上游项目，该项目自 2017 年 9 月起已开源。\n\n红帽还维护 Ansible Engine。通过\
  \ Ansible Engine，组织可以以加固的企业级方式访问底层 Ansible 技术提供的工具和创新。Ansible Engine 由红帽开发，明确意图是作为企业\
  \ IT 平台使用。\n\n# 入门\n在本章节中，我将为您解释如何使用 Ansible 技术迈出第一步。如何连接到托管主机以及如何使用命令行执行一些任务。\n\
  \n## Ansible 架构\n让我们开始讨论 Ansible 架构。实际安装 Ansible 的节点被称为“控制节点”（control node），它管理您所有的节点组。另一方面，被节点被称为“托管节点”（managed\
  \ node）。目标节点可以是 Linux、Mac、Windows 以及多种网络设备。每个目标都有某些特殊性，例如不同的 Linux 发行版和模块用法。我们将在后续章节中讨论这些特殊性。\n\
  \n## 与托管节点的连接\n“控制节点”与“托管节点”之间的连接通过 SSH 协议管理，对目标机器不需要任何特定的客户端。其他竞争对手需要通常被称为“代理”（agent）的客户端软件。使用\
  \ SSH 连接，唯一的要求是用于访问目标机器用户名和证书。还有一些方法可以自动化这第一个脚本步骤。在完成 SSH 连接后，另一个要求是 `python` 解释器，现代操作系统自带该。默认情况下，Ansible\
  \ 使用 SFTP 传输文件，但您可以在配置中切换到 SCP。Windows 目标可以使用 WinRM 技术连接，并使用 PowerShell 作为解释器。\n\
  \n## 创建基础清单\n`/etc/ansible/hosts`\n\n```\nhost1.example.com\n```\n默认清单文件 `/etc/ansible/hosts`\n\
  \n“host1.example.com” 是一个托管主机\n\n托管主机列表存储在 `/etc/ansible/hosts` 中。在本示例中，它只包含一个名为\
  \ `host1.example.com` 的主机。\n\n## 运行您的第一个 Ansible 命令\n```bash\n$ ansible all -m ping\
  \ 2 host1.example.org | SUCCESS => { 3     \"ansible_facts\": { 4         \"discovered_interpreter_python\"\
  : \"/usr/bin/python\" 5     }, 6     \"changed\": false, 7     \"ping\": \"pong\"\
  \ 8 }\n```\n`ping` 模块在所有“all”主机上执行\n\n“host1.example.com”以成功代码回复\n\n现在我们准备好运行您的第一个\
  \ Ansible 命令了。在 Ansible 术语中，命令被称为模块（module）。第一行在所有主机上执行 Ansible `ping` 模块。响应是 pong。请注意，这意味着\
  \ Ansible 能够通过 SSH 用户名连接，使用公钥识别并执行本地 python 执行器。因此，它与网络中的任何 ping 完全不同。\n\n## 在 Ansible\
  \ 上运行即时命令\n```bash\n$ ansible all -a “/bin/echo hello” 2 host1.example.org | CHANGED\
  \ | rc=0 >> 3 hello\n```\n`/bin/echo hello` 命令在所有“all”主机上执行\n\n“host1.example.com”以更改代码回复并在标准输出上打印“hello”\n\
  \nAnsible 也可以在目标主机执行某些命令并在“控制节点”控制台上报告状态。在本示例中，`/bin/echo hello` 命令在所有“all”主机上执行。“host1.example.com”以更改代码回复并在标准输出上打印“hello”。请注意，每当您在远程机器上运行命令时，都会收到“changed”（已更改）状态。\n\
  \n## 在 Ansible 上运行带权限提升的即时命令\n```bash\n$ ansible all -m ping -u devops --become\
  \ 2 host1.example.org | SUCCESS => { 3     \"ansible_facts\": { 4         \"discovered_interpreter_python\"\
  : \"/usr/bin/python\" 5     }, 6     \"changed\": false, 7     \"ping\": \"pong\"\
  \ 8 }\n```\n以用户“devops”登录后，以用户“root”身份在所有“all”主机上执行 `ping` 模块\n\n“host1.example.com”以更改代码回复并在标准输出上打印“hello”\n\
  \n在本示例中，我在以用户“devops”登录后，以用户“root”身份对“all”主机运行 `ping` 模块。（注：此处原文可能误写为 hello）\n\n\
  ## 总结\n在本模块中，我们学习了 Ansible 架构的基本概念、如何编写托管主机列表以及如何对它执行某些命令。\n\n# 清单\n在本章节中，我将向您解释什么是\
  \ Ansible 清单、为什么需要以及如何编辑和使用。\n\n由 Ansible 管理的多主机列表被称为“清单”（inventory）。从根本上说，它是节点或主机的集合，使用列表或组。您可以通过“组”或“模式”组织您的清单以选择要运行的主机。\n\
  \n“all”关键字\n`all` 关键字包含清单中的所有主机。例外是需要指定的 localhost。\n\n## 简单的 INI 清单\n`/simple_inventory`\n\
  \n```\nhost1.example.com\n\n[webservers]\ntwo.example.com\nthree.example.com\n```\n\
  文件名：`simple_inventory`\n\n“host1.example.com”未分组\n\n“two.example.com”和“three.example.com”被分在“webservers”\n\
  \n简单的清单类型是 INI 清单，取决于文件类型。默认位置是 `/etc/ansible/hosts`，但您可以使用 `-i` 参数自定义。在本示例中，`host1.example.com`\
  \ 未分组，`two.example.com` 和 `three.example.com` 被分为“webservers”。\n\n## 简单的 YAML 清单\n\
  `/simple_yaml_inventory.yml`\n\n```yaml\n---\nall:\n  hosts:\n    host1.example.com:\n\
  \  children:\n    webservers:\n      hosts:\n        two.example.com:\n        three.example.com:\n\
  ```\n文件名：`inventory.yml`\n\n“host1.example.com”未分组\n\n“two.example.com”和“three.example.com”被分在“webservers”\n\
  \n您可以使用 YAML 语法表达相同的清单。在本示例中，`host1.example.com` 未分组，`two.example.com` 和 `three.example.com`\
  \ 被分为“webservers”。\n\n## 添加主机范围\n`/ini_range_inventory`\n\n```\n[webservers]\nwww[01:99].example.com\n\
  \n[databases]\ndb-[a-f].example.com\n```\n“webservers”组包含从 `www01.example.com` 到\
  \ `www99.example.com` 的所有主机\n\n“databases”组包含从 `db-a.example.com` 到 `db-f.example.com`\
  \ 的所有主机，\n\n\n\n\n\n也可以使用数字或字母范围来定义组成员。在数字范围中，你还可以指定步长，即一组数字之间的增量。在上面的 INI 示例中，“webservers”组包含了从\
  \ `www01.example.com` 到 `www99.example.com` 的所有主机。“databases”组包含了从 `db-a.example.com`\
  \ 到 `db-f.example.com` 的所有主机。\n\n## 多个组中的主机\n\n`./ini_groupsmultiple_inventory`\n\
  \n```ini\n1 one.example.com 2 3 [webservers] 4 two.example.com 5 three.example.com\
  \ 6 7 [prod] 8 two.example.com 9 10 [dev] 11 three.example.com\n```\n\n主机 `two.example.com`\
  \ 和 `three.example.com` 存在于多个组中\n\n主机可以存在于多个组。在这个 INI 示例中，主机 `two.example.com` 和\
  \ `three.example.com` 被归类为 `webserver`。`two.example.com` 同时存在于 `webserver` 和 `prod`\
  \ 组中。\n\n`three.example.com` 存在于 `webserver` 和 `dev` 组。\n\n## 主机变量\n\n`./ini_hostinventory`\n\
  \n```ini\n1 [webservers] 2 localhost  ansible_connection=local 3 one.example.com\
  \ ansible_connection=ssh ansible_user=devops 4 two.example.com ansible_connection=ssh\
  \ ansible_user=ansible\\ 5 le\n```\n\n`ansible_connection` 和 `ansible_user` 变量的自定义\n\
  \n在清单中，你可能想要与特定主机或组相关的变量值。这种场景很常见，因为它定义了与不同主机不同的连接。例如，对 localhost 使用 `local` 连接，对所有其他主机使用默认的\
  \ `ssh` 连接。对于每个主机，你还可以自定义登录用户，如 `one.example.com` 使用 `devops`，`two.example.com`\
  \ 使用 `ansible`。\n\n## 组变量\n\n`./ini_groupsvariables_inventory`\n\n```ini\n1 [webservers]\
  \ 2 one.example.com 3 two.example.com 4 5 [webservers:vars] 6 ntp_server=europe.pool.ntp.org\n\
  ```\n\n`./inventory.yml`\n\n```yaml\n1 --- 2 webservers: 3   hosts: 4     two.example.com:\
  \ 5     three.example.com: 6   vars: 7     ntp_server: europe.pool.ntp.org\n```\n\
  \n与单主机一样，组也可以定义组变量。在示例的这两个清单文件（INI 和 YAML 格式）中，变量 `ntp_server` 为该组的所有主机分配了值 `europe.pool.ntp.org`。\n\
  \n## 变量值的继承\n\n`./ini_variableinheriting_inventory`\n\n```ini\n1 [asia] 2 host1.example.com\
  \ 3 4 [europe] 5 host2.example.com 6 7 [webserver:children] 8 asia 9 europe 10 11\
  \ [webservers:vars] 12 ntp_server=europe.pool.ntp.org\n```\n\n`./variableinheriting_inventory.yml`\n\
  \n```yaml\n1 --- 2 children: 3   webservers:     4     children: 5       asia: 6\
  \         hosts: 7           host1.example.com: 8       europe: 9         hosts:\
  \ 10           host2.example.com: 11     vars: 12       ntp_server: europe.pool.ntp.org\n\
  ```\n\n主机和组可以组合在一起。在这个示例中，`webserver` 组有两个成员 `asia` 和 `europe`。这两个元素分别被定义为单个主机 `host1.example.com`\
  \ 和 `host2.example.com`，但也可以包含更多主机。`ntp_server` 变量定义在 `webservers` 级别。因此，最后 `ntp_server`\
  \ 变量对于 `webserver`、`asia` 和 `europe` 组可用。`ntp_server` 变量在 `host1.example.com` 和\
  \ `host2.example.com` 主上也可用。\n\n## 使用多个清单源\n\n```bash\n$ ansible-playbook playbook.yml\
  \ -i production -i development\n```\n\n针对 `production` 和 `development` 执行名为 `playbook.yml`\
  \ 的 ansible playbook。\n\n每次执行都可以使用多个清单文件。在这个示例中，将针对 `production` 和 `development`\
  \ 清单执行名为 `playbook.yml` 的 ansible playbook。\n\n## localhost 清单\n\n`./ini_local_inventory`\n\
  \n```ini\n1 localhost ansible_connection=\"local\"\n```\n\n文件名：`inventory`\n\n默认路径：`/etc/ansible/hosts`\n\
  \n清单中的一个特殊情况是 `localhost`。你需要指定连接类型为 `local`，否则 Ansible 将假设使用默认的 SSH 连接。\n\n## 总结\n\
  \n现在你对 Ansible INI 和 YAML 清单文件、主机和组变量有了更多的了解。\n\n## Playbook\n\n在本章中，我将向你解释什么是 Ansible\
  \ Playbook 以及你为什么需要它。我们将涵盖如何从一个简单的 playbook 开始，包括从基础语法到操作方法。\n\n## YAML 语法\n\n```yaml\n\
  1 ---\n2 - name: Hello World sample\n3   hosts: all\n4   tasks:\n5     - name: Hello\
  \ message\n6       ansible.debug:\n7         msg: \"Hello World!\"\n```\n\n这是 `helloworld.yml`\
  \ 执行的输出。我想说明的是使用的命令是 `ansible-playbook`。第一个参数是清单文件，第二个参数是 playbook。\n\n在此执行中，play\
  \ 针对 `host1.example.com` 节点运行。输出非常清晰。当命令成功时，输出将以绿色显示。警告将以橙色显示，错误将以红色显示。大多数人会注意到名为\
  \ `Gathering Facts` 的额外任务，这是 Ansible 执行的获取托管节点信息的操作。我们将在下一节中讨论更多关于收集事实（facts）的内容。尝试运行这段代码并对这种输出建立信心。\n\
  \n## ansible-playbook --check 选项\n\n```bash\n$ ansible-playbook -i inventory --check\
  \ helloworld.yml\n```\n\n```text\nPLAY [Hello World sample] *******************************\n\
  *********************************************************\n**********\nTASK [Gathering\
  \ Facts] *********************************\n*********************************************************\n\
  ********\nok: [host1.example.com]\nTASK [Hello message] *********************************\n\
  *********************************************************\n******\nok: [host1.example.com]\
  \ => {\n    \"msg\": \"Hello World!\"\n}\nPLAY RECAP **********************************************\n\
  *****************************************************\nhost1.example.com       \
  \       : ok=2    changed=0    unreachable=0    failed=0    skipped=1    rescued=0\
  \    ignored=0\n```\n\n`ansible-playbook` 命令中一个非常有用的 `--check` 选项。该选项用于对 playbook\
  \ 执行进行空运行（dry run）。会导致 Ansible 报告如果执行 playbook 会发生哪些更改，但不会对托管主机进行任何实际更改。\n\n\n\n\
  \n\n# `helloworld_debug.yml`\n\n```yaml\n---\n- name: Hello World sample \n  hosts:\
  \ all \n  tasks:\n    - name: Hello message\n      debug:\n        msg: \"Hello\
  \ World!\"\n        verbosity: 2\n...\n```\n\n- 文件名：`helloworld_debug.yml`\n- Playbook\
  \ 的名称\n- 执行的主机\n- 任务列表\n- 一个名为“Hello message”的任务\n- 模块 `debug`\n- 模块 `debug` 的参数\
  \ `msg`\n- 参数 `varbosity` 为“`2`”\n\n此提示允许你在 Playbook 中保留调试代码，并仅在需要时启用执行。例如，只有当在调用\
  \ `Ansible` 并指定输出级别为二时，才会打印消息。\n\n## `helloworld_debug.yml` - 执行 - 部分 1\n\n```bash\n\
  ansible-playbook -i inventory helloworld_debug.yml\nPLAY [Hello World sample] *******************************\\\
  \n***********************************************************************\\\n***********\
  \ \n \nTASK [Gathering Facts] *****************************************\n************************************************************************\\\
  \n******** \nok: [host1.example.com] \n \nTASK [Hello message] ************************************\n\
  ************************************************************************\\\n******\
  \ \nskipping: [host1.example.com] \n \nPLAY RECAP **********************************************\n\
  *****************************************************\nhost1.example.com      :\
  \ ok=1    changed=0    unreachable=0    failed=0    skipped=1    rescued=0    ignored=0\n\
  ```\n\n这是 `helloworld_debug.yml` 正常执行时的输出（意味着未处于调试模式）。如你所见，hello 被跳过了。\n\n```bash\n\
  $ ansible-playbook -i inventory -vv helloworld_debug.yml\nPLAY [Hello World sample]\
  \ *******************************\\\n***********************************************************************\\\
  \n*********** \nTASK [Gathering Facts] *****************************************\n\
  ************************************************************************\\\n********\
  \ \nok: [host1.example.com] \nTASK [Hello message] ************************************\n\
  ************************************************************************\\\n******\
  \ \nok: [host1.example.com] => { \n     \"msg\": \"Hello World!\" \n } \nPLAY RECAP\
  \ **********************************************\n*****************************************************\n\
  host1.example.com      : ok=2    changed=0    unreachable=0    failed=0    skipped=1\
  \    rescued=0    ignored=0\n```\n\n这是 `helloworld_debug.yml` 在调试级别二模式执行下的输出，请注意命令行中的两个“V”。如你所见，hello\
  \ 消息被打印了。\n\n## 等幂性 (Idempotency)\n\n`idempotency` 模块检查期望的最终状态是否已经实现，否则进行应用。\n\n\
  大多数 `Ansible` 模块的一个重要特性是“等幂的”。这意味着在对目标节点上执行任何操作之前，模块将检查实际状态。如果实际状态与期望状态匹配，则不执行任何操作。如果当前状态偏离预期，则将执行操作。请注意，如果你再次执行该\
  \ Playbook，将发现期望状态已存在，不会执行任何后续操作。这种属性被称为“等幂性”，你应当利用这一特性。\n\n## `multipleplays.yml`\n\
  \n```yaml\n---\n- name: first play \n  hosts: web.example.com \n  tasks:\n    -\
  \ name: first task\n      ansible.builtin.yum:\n        name: httpd\n        status:\
  \ present\n    - name: second task\n      ansible.builtin.service:\n        name:\
  \ httpd\n        enabled: true\n- name: second play \n  hosts: database.example.com\
  \ \n  tasks:\n    - name: first task\n      ansible.builtin.service:\n        name:\
  \ mariadb\n        enabled: true\n```\n\n文件名：`multipleplays.yml`\n\n内部包含两个针对 `web.example.com`\
  \ 和 `database.example.com` 执行的 play（剧本）。\n\n`multipleplays.yml` Playbook 包含两个 play。第一个\
  \ play 针对 `web.example.com` 主机执行，安装 apache Web 服务器并设置开机启动。第二个 play 将针对 `database.example.com`\
  \ 执行并设置开机启动。\n\n## `privilegeescalation.yml`\n\n```yaml\n---\n- name: install httpd\
  \ \n  hosts: web.example.com \n  become: true \n  tasks:\n    - name: first task\n\
  \      ansible.builtin.yum:\n        name: httpd\n        status: present\n```\n\
  \n`privilegeescalation.yml`\n\n`become` 指定了\n`become_method` 指定了\n`become_user`\
  \ 指定了 `root`\n\n`wheel` 组。在本例中需要 `root`。某些 `sudo` 操作需要该权限。\n\n## 总结 (Recap)\n\n\
  在本模块中，我们为后续的 `Ansible` 操作奠定了基础。继续努力，你很快就能自动化所有的系统管理员任务。\n\n## 变量 (Variables)\n\n\
  在本章中，我将为你解释什么是 `Ansible` 变量、你为什么需要它们、不同类型以及如何在日常工作中编辑和使用它们。\n\n变量为给定环境存储动态值。在你的\
  \ Playbook 中，使用变量存储你所有需要的动态值是一个良好实践。通过编辑变量，你可以根据业务需求进行相应的参数化，从而在未来复用代码。\n\n## 不允许的变量名\n\
  \n不允许包含空格 `my var`\n\n不允许包含点 `my.var`\n\n不能以数字开头 `1stvar`\n\n不能包含特殊字符 `myvar$1`\n\
  \n`Ansible` 允许在变量中使用字母和数字的组合。如果你计划使用数字，请注意不能放在开头，这是信息技术领域的通用规则。\n\n变量名的四个主要限制是：不允许空格、不允许包含点、不能以数字开头、不允许包含特殊字符。因此右侧是一些无效变量名的示例。\n\
  \n## 常用 Ansible 模块\n\n文件模块\n- `copy`: 将本地文件复制到托管主机\n- `fetch`: 从远程节点复制文件到本地\n- `file`:\
  \ 设置权限和其他属性\n- `lineinfile`: 确保文件中存在或不存在特定行\n- `synchronize`: 使用 `rsync` 同步内容\n\n\
  软件包模块\n- `package`: 使用自动检测的操作系统管理器管理包\n- `yum`: 使用 YUM 包管理器管理包\n- `apt`: 使用 APT\
  \ 包管理器管理包\n- `dnf`: 使用 DNF 包管理器管理包\n- `gem`: 管理 Ruby 宝石包\n- `pip`: 管理来自 PyPI 的 Python\
  \ 包\n\n系统模块\n- `firewalld`: 管理任意端口和服务 own\n- `reboot`: 重启机器\n- `service`: 管理服务\n\
  - `user`: 添加、删除和管理用户账户\n\n网络工具模块\n- `get_url`: 通过 HTTP、HTTPS 和 FTP 下载文件\n- `nmcli`:\
  \ 管理网络\n- `uri`: 与网络服务交互\n\n## `variableprint.yml`\n\n```yaml\n---\n- name: Variable\
  \ print sample \n  hosts: all\n  vars:\n    fruit: \"apple\"\n  tasks:\n    - name:\
  \ Print variable\n      ansible.builtin.debug:\n        msg: \"Print the value of\
  \ variable {{ fruit }}\"\n```\n\n- 文件名：`variableprint.yml`\n- Playbook 的名称\n- 执行的主机\n\
  - 一个名为“Print variable”的任务\n- 模块 `ansible.builtin.debug`\n- 模块 `ansible.builtin.debug`\
  \ 的参数 `msg`\n\n\n\n\n`variableprint.yml` playbook 与 `helloworlds.yml` playbook 类似。除了存在变量\
  \ `fruit` 之外，其语法和元素结构非常相似。变量用于存储字符串、数字以及更复杂的数据结构（如列表、字典等）。在此情况下，变量名为 `fruit`，值为\
  \ `apple`。在此情况下，`debug` 模块将文本“Print the value of variable”与变量 `fruit` 的值拼接在一起。请注意双括号，它表示变量的值。最佳实践是始终在代码中的双引号内包含双括号。\n\
  \n### variableprint.yml - 执行\n\n```bash\n1 $ ansible-playbook -i inventory variableprint.yml\
  \ 2 PLAY [Variable print sample] ****************************\\ \n3 ***********************\
  \ \n4 \n5 TASK [Gathering Facts] **********************************\\ \n6 ***********************\
  \ \n7 ok: [host1.example.com] \n8 \n9 TASK [Print variable] ***********************************\\\
  \ \n10 *********************** \n11 ok: [host1.example.com] => { \n12     \"msg\"\
  : \"Print the value of variable apple\" \n13 } \n14 \n15 PLAY RECAP **********************************************\\\
  \n16 *********************** \n17 host1.example.com  : ok=2    changed=0    unreachable=0\
  \  \\ \n18 failed=0    skipped=0    rescued=0    ignored=0\n```\n\n这是 `variableprint.yml`\
  \ 的执行输出，与 `helloworld.yml` 文件的输出非常相似。请注意组合字符串与变量值得到的消息“Print the value of variable\
  \ apple”。此外，如你在 play recap 区域和绿色字体所示，该执行是成功的。正在执行两个任务。\n\n### variableprint.yml\
  \ - 额外变量\n\n```bash\n1 $ ansible-playbook -i inventory  -e fruit=banana  variabl\\\
  \ \n2 eprint.yml \n3 PLAY [Variable print sample] ****************************\\\
  \ \n4 *********************** \n5 \n6 TASK [Gathering Facts] **********************************\\\
  \ \n7 *********************** \n8 ok: [host1.example.com] \n9 \n10 TASK [Print variable]\
  \ ***********************************\\ \n11 *********************** \n12 ok: [host1.example.com]\
  \ => { \n13     \"msg\": \"Print the value of variable banana\" \n14 } \n15 \n16\
  \ PLAY RECAP **********************************************\\\n17 ***********************\
  \ \n18 host1.example.com  : ok=2    changed=0    unreachable=0  \\ \n19 failed=0\
  \    skipped=0    rescued=0    ignored=0\n```\n\n你可以通过命令行指定值来覆盖 playbook 变量。在命令行设置的变量被称为额外变量（extra\
  \ variables）。\n\n执行输出与之前相似。请注意从命令行传递的值会覆盖任何 playbook 中的值。\n\n### 主机变量与组变量\n\n####\
  \ inventory_host_variables\n```ini\n1 [servers] \n2 host1.example.com ansible_user=devops\n\
  ```\n\n#### inventory_group_variables\n```ini\n1 [servers] \n2 host1.example.com\
  \ \n3 host2.example.com \n4 \n5 [servers:vars] \n6 user=alice\n```\n\n主机变量和组变量可以定义在你的清单文件中。在左侧列你可以看到主机变量的示例。变量\
  \ `ansible_user` 被赋值为 `devops`。该主机变量适用于 `host1.example.com`。在右侧列你看到一个组变量的示例。变量 `user`\
  \ 被赋值为 `alice`。该组变量将以相同的值适用于 `host1.example.com` 和 `host2.example.com`。\n\n####\
  \ inventory_host_dir\n```ini\n1 [servers] \n2 host1.example.com\n```\n#### host_vars/demo1.example.com\n\
  ```ini\n1 ansible_user=devops\n```\n\n#### inventory_group_dir\n```ini\n1 [servers]\
  \ \n2 host1.example.com \n3 host2.example.com\n```\n#### group_vars/servers\n```ini\n\
  1 user=alice\n```\n\n你也可以使用目录来填充主机和组变量以达到相同的结果。如你所见，结果与上一张幻灯片相同，但使用了更多的文件。在左侧列你可以看到主机变量的示例。变量\
  \ `ansible_user` 被赋值为 `devops`。该主机变量适用于 `host1.example.com`。在右侧列你看到一个组变量的示例。变量 `user`\
  \ 被赋值为 `alice`。该组变量将以相同的值适用于 `host1.example.com` 和 `host2.example.com`。\n\n### 数组变量\n\
