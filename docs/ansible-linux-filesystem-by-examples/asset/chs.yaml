  \ Library.sh\n\n```bash\n1#!/bin/bash\n2 $ sudo yum update -y\n3 $ sudo amazon-linux-extras\
  \ install ansible2 -y\n4 $ ansible --version\n```\n\n## Amazon Extras Library 执行结果\n\
