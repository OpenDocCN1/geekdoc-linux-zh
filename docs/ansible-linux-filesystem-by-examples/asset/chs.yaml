  \ Extras Library “amazon-linux-extras” 和 EPEL（Extra Packages for Enterprise Linux）仓库在\
  \ Amazon Linux 2 中安装 Ansible。\n\n在 Amazon Linux 2 内部安装和维护 Ansible 更简单的方法是使用 Amazon\
  \ Extras Library 和 EPEL 仓库。\n\n## 如何在 Amazon Linux 2 中安装 Ansible\n\n### Extras Library\
  \ 仓库中的 `ansible2` 主题\n\n### Extra Packages for Enterprise Linux (EPEL) 附加软件包，适用于：Red\
  \ Hat Enterprise Linux (RHEL)、Rocky Linux 和 Scientific Linux (SL)、Oracle Linux (OL)\
  \ 以及 Amazon Linux\n\n好消息是，Ansible 包含在通过 `amazon-linux-extras` 命令提供的 Amazon Linux\
  \ 2 仓库中的 Extras Library 中。\n\n另一种在 Amazon Linux 2 内部安装和维护 Ansible 的选项是使用 Extra Packages\
  \ for Enterprise Linux (EPEL) 附加仓库。\n\n该仓库由 Fedora 特别兴趣小组维护，为企业级 Linux：Red Hat Enterprise\
  \ Linux (RHEL)、Rocky Linux 和 Scientific Linux (SL)、Oracle Linux (OL) 以及 Amazon Linux\
  \ 管理了一组高质量的附加软件包。\n\n## 链接\n\n- [Amazon Linux 2](https://aws.amazon.com/it/amazon-linux-2/)\n\
  - [如何为运行 CentOS、RHEL 或 Amazon Linux 的 Amazon EC2 实例启用 EPEL 仓库？](https://aws.amazon.com/it/premiumsupport/knowledge-center/ec2-enable-epel/)\n\
  - [Extras library (Amazon Linux 2)](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/amazon-linux-ami-basics.html#extras-library)\n\
  - [Extra Packages for Enterprise Linux (EPEL)](https://docs.fedoraproject.org/en-US/epel/)\n\
  \n## 演示\n\n### 如何使用 Amazon Extras Library 和 EPEL 仓库在 Amazon Linux (EC2) 2 中安装 Ansible。\n\
