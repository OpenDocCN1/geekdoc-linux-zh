  md: '# Chapter 14. Compiling And Installing New Kernels


    xx (xx) represents the ISO country code. Following the official announce-ment
    of the availability of the kernel, you should allow at least two hours for all
    the mirrors to be updated.


    On all of these FTP servers, the kernel sources are in the /pub/linux/kernel directory.
    Next, go to the directory with the sources that interests you: it will undoubtedly
    be v2.4. Nothing prevents you from trying the 2.5 version, but remember that these
    are experimental kernels. The file containing the kernel sources is called linux-<kernel.version>.tar.bz2,
    e.g. linux-2.4.8.tar.bz2.


    You can also apply patches to kernel sources in order to upgrade them incrementally:
    thus, if you already have kernel sources 2.4.8 and want to upgrade to kernel 2.4.10,
    you do not need to download the whole- 2.4.10 source, you can simply download
    the patches patch-2.4.9.bz2 and patch-2.4.10.bz2. As a general rule, this is a
    good idea, since sources currently take up more than 20 MB.


    # 14.2. Unpacking Sources, Patching The Kernel (if Necessary)


    Kernel sources should be placed in /usr/src. So you should go into this directory
    then unpack the sources:


    ```

    $ cd /usr/src

    $ mv linux.old

    $ tar xjf /path/to/linux-2.4.8.tar.bz2

    ```


    The command mv linux.old is required: this is because you may al-ready sources
    of another version of the kernel. This command will ensu-re that you do not overwrite
    them. Once the archive is unpacked, you have a linux directory with the new kernel''s
    sources.


    Now, the patches we will assume that you want to patch from 2.4.8 to 2.4.10 and
    have downloaded the patches needed to do this: go to the newly created linux directory,
    then apply the patches:


    Generally speaking, moving from a version 2.4.x to a version 2.4.y requires you
    to apply all the patches numbered 2.4.x+1, 2.4.x+2, ..., 2.4.y in this order.


    144'
