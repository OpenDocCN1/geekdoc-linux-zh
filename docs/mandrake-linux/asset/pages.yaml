    this mapping, the offset from the beginning of the file where the mapping starts,
    the major and minor number (in hexadecimal) of the device on which the mapped
    file is located, the inode number of the file, and finally the name of the file
    itself. When the device is 0 and there''s no inode number and filename itself,
    these are anonymous mappings. See mmap(2).

