  md: '# Chapter 14. Compiling And Installing New Kernels


    # 14.5. Compiling Kernel And Modules, Installing The Beast


    Small point to begin with: if you are recompiling a kernel with exactly the same
    version as the one already present on your system, the old modules must be deleted
    first. For example, if you are recompiling 2.4.10, you must delete the /lib/modules/2.4.10
    directory.


    Compiling the kernel and modules, and then installing modules, is done with the
    following lines:


    ```

    make dep

    make cleanImage modules

    make modules_install

    ```


    A little vocabulary: dep, bImage, etc., as well as oldconfig and others which
    we used above, are called targets. If you specify several targets to make as shown
    above, they will be executed in their order of appearance. But if one target fails,
    make won''t go any further.


    Let us look at the different targets and what they do:


    +   * dep: this computes the dependencies between the different source files.
    It is necessary to do so each time you change your configuration, otherwise some
    files may not be built and the compilation will fail;

    * bImage: this builds the kernel. Note that this target is only valid for Intel
    processors, and so is bImage. The difference between bImage and Image is that
    the former will generate a kernel which can be much larger. This target also generates
    the System.map for this kernel. We will see later what this file is used for;

    * modules: this target will generate modules for the kernel you have just built.
    If you have chosen not to have modules, this target will do nothing;

    * modules_install: this will install modules. By default, modules will be installed
    in the /lib/modules/<kernel-version> directory. This target also computes module
    dependencies (unlike in 2.2.x);

    * install: this last target will finally copy the kernel and modules to the right
    places and modify the boot loader''s configurations in order for the new kernel
    to be available at boot time. Do not use it if you prefer to perform a manual
    installation as described in Installing The New Kernel Manually, 149.


    At this point, everything is now compiled and correctly installed, ready to be
    tested! Just reboot your machine and choose the new kernel in the boot menu. Note
    that the old kernel remains available so that you can use it if you


    +   1. In this case, if it fails, it means that there is a bug in the kernel...
    If this is the case, please report it!'
