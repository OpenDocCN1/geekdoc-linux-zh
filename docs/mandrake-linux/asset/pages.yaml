    # 4.7. Many, many more...


    There are so many commands that a comprehensive book about them would be the size
    of an encyclopedia. This chapter hasn''t even covered a tenth of the subject,
    yet you can do much with what you learned here. If you wish, you may read some
    manual pages: sort(1), sed(1) and zip(1) (yes, that''s what you think: you can
