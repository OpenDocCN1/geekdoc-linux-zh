  md: '# 1.4.4. less: a Pager


    Its name is a play on words related to the first pager ever used under UNIX, which
    was called more. A pager is a program that allows a user to view long files page
    by page (more accurately, screen by screen). We speak here less rather than more
    because its use is much more intuitive. You should use less to view large files,
    which do not fit on a screen. For example:


    ```

    less /etc/termcap

    ```


    To browse through this file, use the up and down arrow keys. Use q to quit. However,
    less can do far more than that. In fact, just type h for help, and take a look.
    But anyway, the goal of this section is just to enable you to read long files,
    so we already reached our goal :-)


    # 1.4.5. Is: Listing Files


    The ls (List) command is equivalent to DOS'' dir command, but it can do much more.
    In fact, this is largely due to the fact that files can do much more. The command
    syntax for ls is:


    ```

    ls [options] [file|directory] [file|directory...]

    ```


    If no file or directory is specified on the command line, ls will list list files
    in the current directory. Its options are very numerous and we will only explain
    a few of them:


    +   - -a: lists all files, including hidden files (remember that in UNIX, hidden
    files are those whose names begin with a -); the -a option lists "almost" all
    files, which means every file the -a option would print except \." and \.";

    - -R: lists recursively, i.e. all files and subdirectories of directories mentioned
    on the command line;

    - -s: prints the file size in kilobytes next to each file;

    - -l: prints additional information about the files;

    - -i: prints the inode number (the file''s unique number on a file system, see
    chapter The Linux Filesystem) next to each file;

    - -d: treats directories on the command line as if they were normal files, instead
    of listing their contents.


    Some examples:'
