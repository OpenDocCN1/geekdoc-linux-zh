  md: '# Chapter 7. Filesystems and Mount Points


    1. the directory which acts as a mount point must exist;

    2. and this directory should preferably be empty: if a directory chosen as a mount
    point already contains files and subdirectories, these will simply be “hidden”
    by the newly mounted filesystem, but they will not be accessible anymore until
    you free the mount point.


    # 7.2. Partitioning a Hard Disk, Formatting a Partition


    Regarding the principles referred to above and as far as we are concerned in this
    section, there are two things to note: a hard disk is divided into partitions
    and each of these partitions host a filesystem. Your brand new hard disk has neither,
    so that is where you have to start, beginning with the partitioning. In order
    to do that, you must be root.


    First, you have to know the “name” of your hard disk (i.e.: what file designation
    it). Suppose you set it up as a slave on your primary IDE interface, it will be
    /dev/hdb2. Please refer to the User Guide’s Managing Your Partitions section,
    which explains how to partition a disk. Note that DiskDrake will also create the
    filesystems for you.


    # 7.3. The mount and umount Commands


    Now that the filesystem has been created, you can mount the partition. Initially,
    it will be empty. The command to mount filesystems is the mount-command, and its
    syntax is as follows:


    ```

    mount [options] <-t type> [-o mount options] <device> <mounting point>

    ```


    In this case, we want to temporarily mount our partition on /mnt (or any other
    mount point you have chosen – remember that it must exist); the command for mounting
    our newly created partition is:


    ```

    $ mount -t ext2 /dev/hdb1 /mnt

    ```


    The -t option is used to specify what type of file system the partition is supposed
    to host. Among the filesystems you will encounter most frequently are ext2fs (the
    GNU/Linux filesystem), VFAT (for all DOS / Windows partitions: FAT12, 16 or 32)
    and iso9660 (CD-ROM filesystem). If you do not specify any type-


    +   2. How to find the name of a disk is explained in the Installation Guide.'
  merge: -1
