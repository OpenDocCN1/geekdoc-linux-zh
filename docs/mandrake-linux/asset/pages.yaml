    # 4.3. crontab: reporting or editing your crontab file


    crontab is a command that allows you to execute commands at regular time intervals,
    with the added bonus that you don''t have to be logged in and that the output
    report is mailed to you. You can specify the intervals in minutes, hours, days,
    and even months. Depending on the options, crontab will act differently:


    +   - -1: Print your crontab file.

    - -e: Edit your crontab file.

    - -r: Remove your current crontab file.

    - -u <user>: Apply one of the above options for user <user>. Only root can do
    that.


    Let''s start by editing a crontab. If you type crontab -e, you will be in front
    of your favorite text editor or VIS environment variable, otherwise vi will be
    used. A line in a crontab file is made of six fields. The first five fields are
    time intervals for minutes, hours, days in the month,


