    and tap Enter. Doing so will give you something like this:


    Insert a disk in /dev/fd0. Any information on the disk will be lost. Press <Enter>
    to continue or ^C to abort:


    Let''s explain the example given. Among other parameters, the two that mk-bootdisk
    needs are --device [device], which tells mkbootdisk the device we want to write
    the boot disk of. In our example, we use /dev/fd0 which is the first floppy drive
    in the system. In 99.9%; of the cases that should work, if it doesn''t work for
    you, choose the right device to use.


    The other parameter needed is [kernel-version], which tells mkbootdisk which we
    want to put on. In our example, we use `uname -r` which gives as a result of the
    name of the current running kernel. Thus, the example given will create a boot
    disk in the first floppy drive with the current running kernel on it.


