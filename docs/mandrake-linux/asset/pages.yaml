- img_proc: true
  md: '# 2.5.2. Other Completion Methods


    The TAB key is not the only way to activate completion, although it is the most
    common one. As a general rule, the word to be completed will be a command name
    for the first word of the command line (ns<TAB> will give nslookup), and a file
    name for all the others, unless the word is preceded by a “magic” character ~,
    or $, in which case the shell will try to complete a name, a machine name or an
    environment variable name respectively. There is also a character for completing
    a command name (!) or a file name (./).


    The other two ways to activate completion are sequences Esc-<x> and Ctrl-<x>,
    where <x> is one of the magic characters already mentioned. Esc-<x> will attempt
    to come up with a unique completion. If it fails, it will complete the word with
    the largest possible substring in the choice list. A beep means either that the
    choice is not unique, or simply that there is no corresponding choice. The sequence
    Ctrl-<x displays the list of possible choices without attempting any completion.
    Pressing the TAB key is the same as successively pressing Esc-<x> and Ctrl-<x>,
    where the magic character depends on the context.


    Thus, one way to see all the environment variables is to type the sequence Ctrl+x
    $ on a blank line. Another example: if you want to see the man page for the nslookup
    command, you simply type man nsl Esc-!, and the shell will automatically complete
    the command to man nslookup.


    # 2.6. Starting and Handling Background Processes: Job Control


    You probably noticed that when you enter a command from a Terminal, you normally
    have to wait for the command to finish before the shell returns control to you.
    This means that you have sent the command in the foreground. However, there are
    occasions when this is not desirable.


    Suppose, for example, that you decide to copy a large directory recursively to
    another. You also decided to ignore errors, so you redirect the error channel
    to /dev/null 2>/dev/null


    ```

    cp -R images/ /shared/ Such a command can take several minutes until it is fully
    executed. You then have two solutions: the first one is violent, means stopping
    (killing) the command and then doing it again when you have the time. To do this,

    ```


    +   6. Remember: UNIX differentiates between uppercase and lowercase. The HOME
    environment variable and the home variable are not the same.'
