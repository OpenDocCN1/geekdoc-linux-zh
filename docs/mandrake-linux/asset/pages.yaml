    This is made of two parts: the header with common options (the first lines), and
    the images, each corresponding to a different GNU/Linux kernel or another OS.
    timeout 5 defines the time (in seconds) for which grub will wait for input before
    it loads the default image (this is defined by the default 0 directive in common
    options, the first image in this case). The keytable directive, if present, defines
    where to find the keymap for your keyboard. In this example, this is a French
    layout. If none are present, the keyboard is assumed to be a plain QWERTY keyboard.
    All hd(x,y) which you can refer to partition y on disk x as seen by the BIOS.


    Then come the different images. In this example, four images are defined: linux,
    failsafe, windows, and floppy.


    +   - The linux section starts telling grub about the kernel which is to be loaded
    (kernel hd(0,4)/boot/mlinuz), followed by the options to pass to the kernel. In
