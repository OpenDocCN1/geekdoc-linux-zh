  md: '# 12.3.2.1. Global Security Check


    +   * suid root files check

    * suid root files MD5 check

    * writable files check

    * sgid files check

    * unowned files

    * listening port check

    * integrity check from the RPM database


    +   1. "NFS filesystems globally exported": this is regarded as insecure as there
    is no restriction as to who may mount these filesystems.

    2. "NFS mounts with missing nosuid": these filesystems are exported with- the
    nosuid option, which forbids suid programs to work on the machine.

    3. "Host trusting files contain + sign": that means that one of the following
    files: /etc/hosts.equiv, /etc/hosts.equiv, /etc/hosts.lpd contains hosts allowed
    to connect without proper authentication.

    4. "Executables found in the aliases files": it issues a warning, naming the executables
    run through the two /etc/aliases and /etc/postfix/aliases files.


    # 12.3.2.2. suid root Files Check


    Checks for new or removed suid root files on the system. If such files are found,
    a list of these files is issued as a warning.


    # 12.3.2.3. suid root File MD5 Check


    The MD5 signature of each suid root file on the system. If the signature has changed,
    it means that a modification has been made to this program, possibly a back-door.
    A warning is then issued.'
