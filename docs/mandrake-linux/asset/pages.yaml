  md: '# Chapter 13. Building and installing free software


    Among the options of tar:


    +   * v makes tar verbose. This means it will display all the files it finds in
    the archive on the screen. If this option is omitted, the processing will be silent.

    * f is a required option. Without it, tar tries to use a tape instead of an archive
    file (i.e., the /dev/rmt device).

    * z allows you to process a "gzipped" archive (with a .gz extension). If this
    option is forgotten, tar will produce an error. Conversely, this option must not
    be used with an uncompressed archive.


    tar allows you to perform several actions on an archive (extract, read, create,
    add...). An option defines what action is used:


    +   * x: allows you to extract files from the archive.

    * t: lists the contents of the archive.

    * c: allows you to create an archive. You may use it to backup your personal files,
    for instance.

    * r: allows you to add files to the end of the archive. It cannot be used with
    a compressed archive.


    # 13.2.3. bzip2


    A compression format named bzip2 has begun to replace gzip in general use. bzip2
    produces smaller archives than gzip does, but is not yet a standard. It is only
    on recently made archives that the .tar.bz2 extensions would be found.

    bzip2 is used like gzip by means of the tar command. The only change is to replace
    the letter z by the letter j. For instance:


    ```

    $ tar xvjf foo.tar.bz2

    ```


    Some distributions may still use the option I instead:


    ```

    $ tar xvf foo.tar.bz2

    ```


    Another way (which seems to be more portable, but is longer to type):


    ```

    $ tar --compress-program=bzip2 -xvf foo.tar.bz2

    ```


    bzip2 must be installed and included in your PATH environment variable before
    you run tar.'
  merge: -1
