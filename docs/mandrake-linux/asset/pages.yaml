- img_proc: true
  md: '# Chapter 2. Introduction to The Command Line


    # 2.4. Redctions and Pipes


    # 2.4.1. A Little More About Processes


    To understand the principle of redirections and pipes, we need to explain a notion
    about processes which has not yet been introduced. Each UNIX process (this also
    includes graphical applications) opens a minimum of three file descriptors: standard
    input, standard output and standard error. Their respective numbers are 0, 1 and
    2. In general, these three descriptors are associated with the terminal from which
    the process was started, with the input being the keyboard. The aim of redirections
    and pipes is to redirect these descriptors. The examples in this section will
    help you better understand this concept.


    # 2.4.2. Redirections


    Imagine, for example, that you wanted a list of files ending with .png ¹ in the
    images directory. This list is very long, so you may want to store it in a file
    in order to look through it at your leisure. You can enter the following command:


    ```

    $ ls images/*.png > file_list

    ```


    This means that the standard output of this command (1) is redirected (>) to the
    file named file_list. The > operator is the output redirection operator. If the
    redirection does not exist, it is created, but if it exists, its previous contents
    are overwritten. However, the default descriptor redirected by this operator is
    the standard output and does not need to be specified for the command line. So
    you can write more simply:


    ```

    $ ls images/*.png >file_list

    ```


    and the result will be exactly the same. Next, you can look at the file using
    a text file viewer such as less.


    Now, you want to know how many of these files exist. Instead of counting them
    by hand, you can use the utility wc (Word Count) with the -l option, which writes
    to the standard output the number of lines in the file. One solution is as follows:


    ```

    wc -l file_list

    ```


    +   4. You might think it is crazy to say "files ending with .png" rather than
    "PNG images". However, once again, files under UNIX only have an extension by
    convention: extensions in no way define a file type. A file ending with .png could
    perfectly be a JPEG image, an application file, a text file or any other type
    of file. The same is true under Windows as well!'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Chapter 2. Introduction to The Command Line


    and this gives the desired result. The < operator is the input redirection operator,
    and the default redirected descriptor is the standard input, i.e. 0, and you need
    to write the line:


    ```

    wc -l file_list

    ```


    Now suppose you want to remove all the file "extensions" and put the result in
    another file. One tool for doing this is sed (Stream EDitor). You simply redirect
    the standard input of sed to the file_list file and redirect its output to the
    file, i.e. the_list:


    ```

    sed -e ''s/\.png//$g'' file_list >the_list

    ```


    and your list is created, ready for you to view at your leisure with any viewer.
    It can also be useful to redirect standard errors. For example, you want to know
    which directories in /shared you cannot access: one solution is to list this directory
    recursively and to redirect the errors to a file, while not displaying the standard
    output:


    ```

    ls -R /shared >dev/null 2>errors

    ```


    means that the standard output will be redirected (>) to /dev/null, a special
    file in which everything you write is discarded (i.e. as a side effect, the standard
    output is not displayed) and the standard error channel (2) is redirected (>)
    to the errors.


    # 2.4.3. Pipes


    Pipes are in some way a combination of input and output redirections. The principle
    is that of a physical pipe, hence the name: one process sends data into one end
    of the pipe and another process reads the data at the other end. The pipe operator
    is |. Let us go back to the file list example above. Suppose you want to find
    out directly how many corresponding files there are without having to store the
    list in a temporary file, you would then use the following command:


    ```

    ls images/*.png | wc -1

    ```


    means that the standard output of the ls command (i.e. the list of files) is redirected
    to the standard input of the wc command. This then gives you the desired result.


    You can also put together a list of files "without extensions" using the following
    command:


    ```

    ls images/*.png | sed -e ''s/\.png//$g'' the_list

    ```'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Chapter 2. Introduction to The Command Line


    or, if you want to consult the list directly without storing it in a file:

    ls images/*.png | sed -e ''s/.png$/g'' | less


    Pipes and redirections are not restricted solely to text that can be read by human
    beings. For example, the following command sent from a Terminal:

    nwd -root | convert ~/my_desktop.png


    will send a screenshot of your desktop to the my_desktop.png file in your personal
    directory.


    # 2.5. Command-Line Completion


    Completion is a very handy functionality, and all modern shells (including bash)
    have it. Its role is to give the user less work to do as possible. The best way
    to illustrate completion is to give an example.


    # 2.5.1. Example


    Suppose your personal directory contains the file_with_very_long_name_impossible_to_type
    file, and you want to look at it. Suppose you also have, in the same directory,
    another file called file_text. You are in your personal directory, to type the
    following sequence:


    ```

    $ less fi<TAB>

    ```


    (i.e., type less fi and then press the TAB key. The shell will then expand the
    command line for you:


    ```

    $ less file_

    ```


    and also give the list of possible choices (in its default configuration, which
    can be customized). Then type the following key sequence:


    ```

    less file_w<TAB>

    ```


    and the shell will extend the command line to give you the result you want:

    less file_with_very_long_name_impossible_to_type


    All you need to do then is press the Enter key to confirm and read the file.


    +   5. Yes, it will indeed be a PNG image :-) (however, the "ImageMagick " package
    needs to be installed...).'
