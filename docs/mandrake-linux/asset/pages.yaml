  md: '# Chapter 6. File Tree Organization


    Nowadays, a UNIX system is big, very big. This is especially true when

    GNU/Linux: the amount of software available would make it an unmanage-

    sblem if there weren''t any guidelines for the location of files in the tree.


    The acknowledged standard in this respect is the FHS (Filesystem Hierarchy

    Standard), which is at version 2.2 at the time of writing this manual. The do-

    cment which describes the standard is available on the Internet in different

    formats on The Pathname web site (http://www.pathname.com/fhs/). This

    chapter gives only a brief summary, but it should be enough to teach you in

    what directory to look for (or place) a given file.


    # 6.1. Shareable/Unshareable, Static/Variable Data


    Data on a UNIX system can be classified according to these two criteria. Their\meaning
    is the following: shareable data can be common to several computers

    in a network, while unshareable data can not. Static data must not be modified
    in

    normal use, while variable data can. As we explore the tree structure, we will

    classify the different directories into each of these categories.


    Note that these classifications are only recommended. It is not mandatory fo-\llow,
    but adopting these guidelines will greatly help you manage your

    system. Also, keep in mind that the static/variable distinction only applies to

    system usage, its configuration. If you install a program, you will obviously

    have to modify "normally" static directories, i.e.:/


    # 6.2. The root directory: /


    The root directory contains the whole system hierarchy. It cannot be classified

    since its subdirectories may or not be static or shareable. Here is a list of

    t main directories and subdirectories, with their classifications:


    +   /bin: essential binary files. This directory contains the basic commands

    which will be used by all users and are necessary to the operation of the

    system: le, cp, login, etc. Static, unshareable;


    +   /boot: contains the files required by the GNU/Linux bootloader (grub or

    LILO for Intel). This may or not contain the kernel: if it is not here, it

    be located in the root directory. Static, unshareable;


    +   /dev: system device files (dev for DEVICES). Static, unshareable;


    +   /etc: this directory contains all configuration files specific to the computer.

    Static, unshareable;'
  merge: -1
