    # 9.2. Information On The Hardware


    Apart from the directories associated to the different processes, /proc also contains
    a myriad of information on the hardware present in your machine. A list of lists
    from /proc directory gives you the following:


    ```

    $ ls -d [a-z]* |

    | apm dma interrupts loadavg mounts rtc swaps |

    | bus/ fb iports scsi sys/ |

    | cmdline filesystems kcore meminfo net/ self/ tty/ |

    | cpuinfo ksmg misc partitions slabinfo uptime |

    | devices ide/ ksys modules pci stat version |

    ```


    For example, if we look at the contents of /proc/interrupts, we can see that it
    contains the list of interrupts used by the system, along with the peripheral
    which holds them. Similarly, iports contains the list of input/output address
    ranges currently busy, and lastly dma does the same for. Therefore, in order to
    chase down a conflict, look at the contents of these three files:


