  md: '# Chapter 6. File Tree Organization


    and is not a system administration program must be located in the directory, apart
    from programs you install yourself, which must be located in /usr/local;


    +   * /usr/lib: it contains all the necessary libraries to run programs located
    in /usr/bin and /usr/sbin. There is also a /usr/lib/X11 symbolic link pointing
    to the directory which holds the X Window System libraries, /usr/X11R6/lib (if
    X is installed, of course);

    * /usr/local: this is where you should install your personal applications. The
    installation program will create the necessary hierarchy: lib/, bin/, etc.;

    * /usr/share: this directory contains all architecture-independent data required
    by applications in /usr. Among other things, you will find zone and location information
    (zoneinfo and locale).


    Let’s also mention the /usr/share/doc and /usr/share/man directories, which respectively
    contain application documentation and the system’s manual pages.


    # 6.4. /var: Modifiable Data During Use


    The /var directory contains all operating data for programs running on the system.
    Unlike the working data in /tmp, this data must be kept intact in event of a reboot.
    There are many subdirectories, and some are very useful:


    +   * /var/log: contains the system log files;

    * /var/spool: holds the system daemons’ working files. For example, /var/spool/lpd
    contains the print server’s working files while /var/spool/mail holds the e-mail
    server’s working files (i.e.: all arriving on and leaving your system).

    * /var/run: used to keep track of all processes utilized by the system, enabling
    you to act on them in the event of a system change runlevel (see chapter "The
    Start-Up Files: init sysv", page 85).


    # 6.5. /etc: Configuration Files


    /etc is one of UNIX systems’ most essential directories. It holds all the basic
    system configuration files. Never delete it to save space! Likewise, if you want
    to extend your tree structure over several partitions, remember that /etc must
    not be put on a separate partition: it is needed for system initialization.


    Here are some important files:'
