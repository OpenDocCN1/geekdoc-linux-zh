    # 6. Conventions Used in This Book


    # 6.1. Typing Conventions


    In order to clearly differentiate special words from the text flow, the documentation
    team uses different renderings. The following table shows an example of each special
    word or group of words with its actual rendering and what this means.


    | Formatted Example | Meaning |

    |---|---|

    | *inode* | This formatting is used to stress a technical term, explained in the
    glossary. |

    | *ls -lta* | Indicates commands or arguments to a command. This formatting is
    applied to commands, options and file names. Also see the section "Commands Synopsis,
    page vi". |

    | *ls(1)* | Reference to a man page. To get the page in a shell (or command line),
    simply type man 1 ls. |

    | `$ ls *.pid imwheel.pid` | The documentation team uses this formatting for snapshots
    of what you may see on your screen. It includes computer interactions, program
    listings, etc. |

    | localhost | This is literal data that does not generally fit in with any of
    the previously defined categories. For example, a key word taken from a configuration
    file. |

    | *Apache* | This is used for application names. The example used is not a command
    name but, in particular contexts, the application and command name may be the
    same but formatted in different ways. |

    | *Files* | This is used for menu entries or graphical interface labels in general.
    The underlined letter indicates the keyboard shortcut, if applicable. |

    | *SCSI-Bus* | It denotes a computer part or a computer itself. |'
