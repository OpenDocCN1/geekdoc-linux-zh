  md: '# Chapter 15. Troubleshooting


    # 15.7. Runlevels


    # 15.7.1. Brief Description of What Runlevels Are


    A runlevel is a configuration of the system software that only allows certain
    selected processes to execute. Allowed processes are defined, for each runlevel,
    in the file /etc/inittab. There are eight defined runlevels: 0, 1, 2, 3, 4, 5,
    6, S. You can create your own runlevel too. For a more detailed description about
    please refer to "The Start-Up Files: init sysv", page 85.


    # 15.7.2. What Can Runlevels Do for me?


    Booting into a different runlevel can help solve certain problems, for example:
    suppose you have made a change into your X configuration that has rendered it
    unusable, and you boot into it by default. If so, you can temporarily boot into
    a console, fix the error and reboot into X. Let''s see how to do.


    By default GNU/Linux either boots to runlevel 3 (the console) or to runlevel 5
    (X). The default runlevel is defined in the file /etc/inittab. Look for an entry
    like init:3:initdefault (if your system starts in a console) or one line like
    init:5:initdefault (if your system starts in X).


    If you want to boot into a runlevel other than the one defined in /etc/inittab,
    you have to define that runlevel on the bootprompt. Under LILO, type init 3 to
    boot into the console or linux init 5 to boot into X. Under grub, press the E
    key twice, add init 3 to boot into the console, or init 5 to boot into X, press
    the ENTER key and then the B key to boot.


    # 15.8. Recovering Deleted Files


    In this section we discuss some ways of recovering deleted files and directories.
    Please bear in mind that the recovery tools are not magical, and they will work
    depending on how recently you deleted the file you are trying to recover.


    You might be wondering "Well, I accidentally deleted this file, how can I recover
    it?". Don''t fear, there are some utilities for GNU/Linux''s ext2 file system
    which allow you to recover deleted files and directories. However, these utilities
    won''t recover the files you deleted a few months ago because of disk usage, space
    marked as "free" will be overwritten; so the best way to


    172'
