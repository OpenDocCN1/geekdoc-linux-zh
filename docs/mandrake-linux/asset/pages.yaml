  md: '# Chapter 15. Troubleshooting


    mkCDrec allows you to do multiple-CD-ROM volumes, disk cloning (copying the full
    contents of a disk or partition to another one with similar characteristics -
    at least the same size), and many things.


    In order to restore a system with mkCDrec you just have to boot with the first
