  md: '# Chapter 13. Building and installing free software


    I often get asked how to install free software from sources. Compiling software
    yourself is really easy because most of the steps to follow are the same no matter
    what the software to install is. aim of this document is to guide the beginner
    step by step and explain to him the meaning of each move. I assume that the reader
    has a minimal knowledge of the UNIX system (ls or mkdir).


    This guide is only a guide, not a reference manual. That is why several links
    are given at the end to answer any remaining questions. This guide can probably
    be improved, so I appreciate receiving any remarks or corrections on its contents.


    # 13.1. Introduction


    What makes the difference between free software and proprietary software is the
    access to the sources of source files. That means free software is distributed
    as archives of source files. It may be unfamiliar to beginners because users of
    free software must compile sources by themselves before they can use the software.


    There are compiled versions of most of the existing free software. The user in
    a hurry just has to install these pre-compiled binaries. Some free software is
    not distributed in this form, or the earlier versions are not yet distributed
    under binary form. Furthermore, if you use an exotic operating system or an exotic
    architecture, a lot of software will not be compiled for you. More importantly,
    compiling software by yourself allows you to enable only the interesting options
    or to extend the functionality of the software by adding extensions in order to
    obtain a program that exactly fits your needs.


    # 13.1.1. Requirements


    To build software, you need:


    +   - a computer with a working operating system,

    - general knowledge of the operating system you use,

    - some space on your disk,

    - a compiler (usually for the C language)and an archiver (tar),


    +   1. This is not completely true since some proprietary software also provides
    source code. But unlike what happens with free software, the final user is not
    allowed to use or modify the code as he wants.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Chapter 13. Building and installing free software


    +   - some food (in difficult cases, it may last a long time). A real hacker eats

    pizzas - not quiches.

    - something to drink (for the same reason). A real hacker drinks soda - for

    caffeine.

    - the phone number of your techie friend who recompiles his kernel each

    week,

    - especially patience and a lot of it!


    Compiling from sources does not generally present a lot of problems, but if

    you are not used to it the smallest snag can throw you. The aim of this docu-

    mentment is to show you how to escape from such a situation.


    # 13.1.2. Compilation


    # 13.1.2.1. Principle


    In order to translate a source code into a binary file, a compilation must be
    do-

    e (usually from C or C++ sources, which are the most widespread languages

    among the (UNIX) free software community). Some free software is written in

    languages which do not require compilation (for instance perl or the shell,

    but they still require some configuration.


    C compilation is logically done by a C compiler, usually gcc, the free com-

    piler with the GNU project (http://www.gnu.org/). Compiling a com-

    plete software package is a complex task, which goes through the successive

    compilations of different source files (it is easier for various reasons for the

    programmer to put the different parts of his work in separate files). In order

    to make it easy on you, these repetitive operations are handled by a utility


    # 13.1.2.2. The four steps of compilation


    To understand how compilation works (in order to be able to solve possible

    problems), you have to know the four steps. The object is to little by little

    convert a textile written in a language that is comprehensible to a trained

    human being (i.e. C language), into a language that is comprehensible to a

    machine (or a very well trained human being in a few cases). gcc executes

    four programs one after the other, each which takes on one step:


    +   the first step consists of replacing directives (processors) by pure

    C instructions. Typically, this means inserting a header (#include) or

    defining a macro (#define). At the end of this stage, pure C code is gen-

    erated.'
