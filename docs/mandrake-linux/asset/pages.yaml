- img_proc: true
  md: '+   * the mount point;


    +   * the type of filesystem;


    +   * the mounting options;


    +   * the dump utility backup `flag`;


    +   * fsck (FileSystem CheCK) checking order.


    There is **always** an entry for the root filesystem. The swap partitions are
    special since they are not visible in the tree structure, and the mount point
    field for those partitions contain the swap keyword. As for the /proc filesystem,
    we will get back to it in greater detail in "The /proc Filesystem", page 79. Another
    special filesystem is /dev/pts.


    Let''s get back to the subject. You moved the whole /usr hierarchy to /dev/hd1
    and we want this partition to be mounted as /usr at boot time. In that case you
    need to add an entry to the file:


    ```

    /dev/hd1      /usr      ext2 defaults 1 2

    ```


    Now the partition will be mounted at each boot. It will also be checked if necessary.


    There are two special options: noauto and user. The noauto option specifies that
    the filesystem should not be mounted at start-up but is to be mounted only when
    you tell it to. The user option specifies that any user can mount and unmount
    the filesystem. These two options are typically used for the CD-ROM and floppy
    drives. There are other options, and /etc/fstab even has its own page (fstab5)).


    One of its great advantages is that it simplifies the mount command syntax. To
    mount a filesystem referenced in it, you can either reference the mount point
    or the device. To mount a floppy disk, you can type:


    ```

    $ mount /mnt/floppy

    ```


    or:


    ```

    $ mount /dev/fd0

    ```


    To finish with our partition moving example: we copied the /usr hierarchy and
    completed /etc/fstab, in order for the new partition to be mounted at start-up.
    For the moment, the old /usr files are still there! We therefore need to delete
    them to free up space (which was, after all, our initial goal). To do so, you
    need to go to single user mode (by issuing the telinit 1) command on the command
    line, and then:


    +   * delete all files in the /usr directory (i.e. the "old" one, since the "new"
    one is not yet mounted): rm -Rf /usr/*;'
