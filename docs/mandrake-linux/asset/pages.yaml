    # 13.5.2. Problems


    If you have just installed free software, GNU tar for instance, and if, when you
    execute it, another program is started or it does not work like it did when you
    tested it directly from the src directory, it is a PATH problem, which finds the
    programs in a directory before the one where you have installed the new software.
    Check by executing type -a <program>.


    The solution is to put the installation directory higher in the PATH and/or to
    delete/rename the files that were executed when they were not asked for, and/or
    rename your new programs (into gtar in this example) so that there is no more
    confusion.


    You can also make an alias if the shell allows it (for instance, say that tar
    means /usr/local/bin/gtar).


