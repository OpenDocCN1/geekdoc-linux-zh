- img_proc: true
  md: '# Chapter 15. Troubleshooting


    In the case of a system freeze, your top priority should be trying to shutdown
    your system properly. Let''s assume you are under X, if so, try these steps consecutively:


    +   - Try to kill the X server by pressing ALT+CTRL+BACKSPACE simultaneously.


    +   - Try to switch to another console with ALT+CTRL+F2. If you succeed, login
    as root and issue the command: kill -15 (pidof X) or the command kill -9 (pidof
    X), if the first command shows no effect. (Check with top to see if X is still
    running).


    +   - If you are part of a local network, try to ssh into your machine from another
    box. It is advisable to ssh to the remote machine as an unprivileged user and
    then use it to reboot.


    +   - If the system does not respond to any of these steps, you have to go through
    the "SysRq ("System Request") sequence. The "SysRq" sequence involves pressing
    three keys at once, the left ALT key, the SysRq key (labeled PrintScreen on older
    keyboards) and a letter key.


    +   - ALT+SysRq+r puts the keyboard in "raw" mode. Now try the pressing ALT+CTRL+BACKSPACE,
    to kill the X. If it does not work, carry on.


    +   - ALT+SysRq+s attempts to write all unsaved data to disk ("sync" disk).


    +   - ALT+SysRq+e sends a termination signal to all processes, except for init.


    +   - ALT+SysRq+i sends a kill signal to all processes, except for init.


    +   - ALT+SysRq+u attempts to remount all mounted filesystems read-only. This
    removes the "dirty flag" and will avoid a file system check upon reboot.


    +   - ALT+SysRq+b reboots the system. You might just as well press the "reset"
    button on your machine.


    > Remember that this is a sequence, iee you have to press one combination after
    the other in the right order: Raw, sync, term, kill, Mount, reboot. You will find
    more on this feature in /usr/src/linux/Documentation/sysrq.txt.


    If none of the above helps, cross fingers and press the "reset" switch on your
    machine. If you are lucky, GNU/Linux will just run a disk check upon reboot.


    ![](img/a40daaaf9b45f9af35d348684ba96cad_193_0.png)'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'By all means, try to find out what causes these lockups because they can do
    severe damage to the file system. You might also want to consider using ReFS,
    a journaling file system included in Mandrake Linux since 7.0, which handles such
    failures more gracefully. However, replacing ext2fs with ReFS requires reformatting
    your partitions.


    # 15.10. Killing Misbehaved Apps


    Well, this one is not so hard after all. Actually, it is not likely that you will
    need it but just in case you do... You have many ways to do it. You can do it
    by finding the PID of the program that has gone south, and use the kill tool to
    terminate it, or use the xkill tool or other graphical tools like the ones that
    show the process tree.


    # 15.10.1. From The Console


    The first thing to terminate a misbehaving program is to find its PID, or process
    ID. To do so, execute the following from a console: ps aux | grep netscape, supposing
    that netscape is the misbehaving program. You will get something like the following:


    ```

    dodo 3505 7.7 23.1 24816 15076 pts/2 Z 21:29 0:02 /usr/lib/netscape

    ```


    This tells us, among other things, that netscape was started by user dodo and
    3505 as its PID.


    Now that we have the PID of the misbehaving program, we can proceed to execute
    the kill command to terminate it. So, we execute the following: kill -9 3505,
    and that''s it! netscape will get killed. Note that this is only to be used when
    the program does not respond to your input anymore. Do not use it as a standard
    means to exit from applications.


    Actually, what we have done was to send the KILL signal to the process number
    3505. The kill command accepts others besides KILL, so you can have greater control
    over your processes. For more info, see the man page for kill and the chapter
    "Process control", page 51.


    # 15.10.2. Using XKILL


    Mandrake Linux includes a graphical kill tool: xkill. It is useful to terminate
    misbehaving graphical applications with a single click. All you have to do is
    click on xkill''s desktop icon and, when your pointer points to a'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Chapter 15. Troubleshooting


    skull and cross-bones, move it over the window of the application you want to
    kill and click on the window. That''s it!


    You can also access xkill with the following keyboard shortcut:

    CTRL+ALT+ESC (at least from KDE).


    # 15.10.3. Using Other Graphical Tools


    You can also use the graphical process'' status tools (like KPM, KSysGuard, and
    GTOP to name a few) which allow you to point to the process name and with one
    click send that process signal or kill that process.


    # 15.11. Mandrake''s Specific Troubleshooting Tools


    Well, actually each administration tool (Control Center, RpmDrake, drakgw, draknet,
    mandrakeupdate, drakbackup, etc.) is a potential trouble fixing tool. You can
    use all these tools to revert configuration changes, to add or remove software,
    to update your system with the latest fixes from MandrakeSoft, etc.


    # 15.12. Final Thoughts


    Well, as you have seen there are many ways to recover from an emergency by re-installing
    the whole system again?. Sure, you need a little expertise in applying some of
    the techniques described in this chapter, but with a little practice you will
    gain such expertise. However, we hope that you will never need to really master
    these techniques ... although it does not hurt to know them. We hope that the
    instructions and examples given will be useful when you are in need. Good luck
    recovering from an emergency!


    The usual way to fix things in certain other operating systems'
