    A section to boot a GNU/Linux kernel always starts with an image= directive, followed
    by the full path to a valid GNU/Linux kernel. Like any section, it contains a
    label= directive as a unique identifier, here linux. The root= directive tells
    LILO which partition hosts the root filesystem for this kernel. It may be different
    in your configuration... The read-only directive tells LILO that it'
