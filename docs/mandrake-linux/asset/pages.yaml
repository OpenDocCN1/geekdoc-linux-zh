  md: '# Chapter 15. Troubleshooting


    protect against accidental deletions or not so accidental deletions is backups
    as described above.


    Please bear in mind that there are not (as yet) tools to recover files deleted
    on ReiserFS file systems. Keep in touch with the ReiserFS homepage (http://www.namesys.com)
    for the latest news about ReiserFS.


    Anyway, on the tools for recovering your deleted files. It is an "interactive"
    tool. If you are the proud owner of a Mandrake Linux - PowerPack Deluxe Edition,
    you already have this tool in the "confrib" CD-ROM. You can find it in the RPMFind
    web site (http://www.rpmfind.net). Go there and download the RPM. Once you have
    the RPM, install it. Then, run it with [command_line_opts] and answer the questions
    it asks you. The questions are for setting a time span to look for deleted files
    and directories to minimize the time it takes to do the search.


    Once the tool finishes its search, it will ask you what you want to save the recovered
    files and directories. Pick a directory of your choice, and you will have all
    the files and directories recovered in it. Note that you will not be able to recover
    the filenames, just their contents, but you can inspect them or to rename them
    with different names until you get the right one. This is better than nothing.


    There are also mini-HOWTOs related to undeletion for ext2 look atExt2fs-Undeletion
    (http://www.linuxdoc.org/HOWTO/mini/Ext2fs-Undeletion.html) and undeletion of
    whole directory structures (http://www.linuxdoc.org/HOWTO/mini/Ext2fs-Undeletion-Dir-Struct/index.html).


    # 15.9. Recovering from a System Freeze


    When stuck in a "freeze", your computer will not respond to commands anymore and
    input devices like keyboard and mouse see to be blocked. This is a worst case
    scenario and could mean that you have a very severe error in either your scenario,
    your software or your hardware. Here we will show you to deal with this annoying
    situation.


    +   - You can search for all deleted files too, but it will take longer...'
