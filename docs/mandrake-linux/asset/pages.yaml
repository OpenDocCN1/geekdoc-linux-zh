  md: '# Chapter 4. Command Line Utilities


    # 4.6. bzip2 and gzip: Data Compression Programs


    You can see that we have already talked of these two programs when dealing with
    tar. Unlike zip under Windows, archiving and compressing are done using two separate
    utilities — tar for archiving, and the two programs which we will now introduce
    for compressing data: bzip2 and gzip. You might also use another compressing tool,
    programs like zip, arj or rar also exist for GNU/Linux (but they are rarely used).


    At first, bzip2 was written as a replacement for gzip. Its compression ratios
    are generally better, but on the other hand, it is more memory-greedy. The reason
    why gzip is still here is that it is still more widespread than bzip2.


    Both commands have a similar syntax:


    ```

    gzip [options] [file(s)]

    ```


    If no filename is given, both gzip and bzip2 will wait for data from the standard
    input and send the result to the standard output. Therefore, you can use both
    programs in pipes. Programs also have a set of common options:


    +   - -1, ..., -9: set the compression ratio. The higher the number, the better
    the compression, but better also means slower: "Theres no such thing as a free
    lunch"

    - -d: uncompress file(s). This is equivalent to using gzip or bunzip2;

    - -c: dump the result of compression/decompression of files given as parameters
    to the standard output.


    > By default, both gzip and bzip2 erase the file(s) that they have compressed
    (or uncompressed) if you don''t use the -k option. You can avoid it with bzip2
    using the -k option, but gzip has no such option!


    Now some examples. Let''s say you want to compress all files ending with .txt
    in the current directory using bzip2, you will then use:


    ```

    $ bzip2 -9 *.txt

    ```


    Let''s say you want to share your image archives with someone, but he doesn''t
    have bzip2, only gzip. You don''t need to uncompress the archive and compress
    it, you can just uncompress to the standard output, use a pipe, compress from
    standard input and redirect the output to the new archive:


    ```

    bzip2 -dc images.tar.bz | gzip -9 >images.tar.gz

    ```'
  merge: -1
  pgno: 67
