  md: '# 13.3. Configuration


    For purely technical interest, the fact that authors create the sources is for
    the porting of the software. Free software developed for a UNIX system may be
    used on all of the existing UNIX systems (whether they are free or proprietary),
    with some changes. That requires configuration of the software just before compiling.


    Several configuration systems exist. You have to use the one author of the software
    wants (sometimes, several are needed). Usually, you can:


    +   - Use AutoConf (see the section AutoConf, page 127) if a file named configure
    exists in the parent directory of the distribution.


    +   - Use imake (see the section imake, page 129) if a file named Imfile exists
    in the parent directory of the distribution.


    +   - Run a shell script (for instance install.sh) according to the contents of
    the INSTALL file (or the README file)


    # 13.3.1. AutoConf


    # 13.3.1.1. Principle


    AutoConf is used to correctly configure software. It creates the files required
    by compilation (Makefile for instance), and sometimes directly changes the sources
    (for instance by using a config.h in file).


    The principle of AutoConf is simple:


    +   - The programmer of the software knows which tests are required to configure
    his (eg: "which version of this library do you use?"). He writes them in a file
    named configure.in, following a precise syntax.


    +   - He executes AutoConf, which generates a configuration script named configure
    from the configure.in file. This script makes the tests required when the program
    is configured.


    +   - The end-user runs the script, and AutoConf configures everything that is
    needed by the compilation.


    # 13.3.1.2. Example


    An example of the use of AutoConf:


    ```

    $ ./configure

    loading cache ./config.cache

    checking for gcc... gcc

    ```'
