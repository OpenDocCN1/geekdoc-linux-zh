  md: '# Chapter 12. msec – Mandrake Security Tools


    # 12.3.2.4. Writable Files Check


    Check whether files are world-writable on the system. If so, issues a warning
    containing the list of these naughty files.


    # 12.3.2.5. Permissions Check


    This one checks permissions for some special files such as .netrc or users’ configuration
    files. It also checks permissions of users’ home directories. If their permissions
    are too loose or the owners unusual, it issues a warning.


    # 12.3.2.6 sgid Files Check


    Check for new or removed sgid files on the system. If such files are found, a
    list of these files are issued as a warning.


    # 12.3.2.7. Unowned Files Check


    This check searches for files owned by users or groups not known by the system.
    If such files are found, the owner is automatically changed to the nobody.user.nogroup/group.


    # 12.3.2.8. Promiscuous Check


    This test checks every Ethernet card to determine whether they are in “promiscuous”
    mode. This mode allows the card to intercept every packet received by the card,
    even those that are not directed to it. It may mean that a sniffer is running
    on your machine. Note that this check is set up to run every minute.


    # 12.3.2.9. Listening Port Check


    Issues a warning with all listening ports.


    # 12.3.2.10. passwd File Integrity Check


    Verifies that each user has a password (not a blank or an easy-to-guess password)
    checks that it is shadowed.'
