    # 8.7. File Attributes


    The same way that FAT has file attributes (archive, system file, invisible), ext2fs
    has its own, but they are different. We speak of them here for the sake of completeness,
    but they are very seldom used. However, if you really need a secure system, read
    on.


    There are two commands for manipulating file attributes: lsattr(1) and chattr(1)
    attributes, whereas chattr changes them. These attributes can only be set on directories
    and regular files. The following attributes are possible:


    +   1. a (no Access time): if a file or directory has this attribute set, whenever
    it is accessed, either for reading or writing, its last access time will not be
    updated. This can be useful, for example, on files or directories which are often
    opened for reading, especially since this parameter is the only one which changes
    on an inode when it''s open-only.


    +   2. a (append only): if a file has this attribute set and is open for writing,
    the only operation possible will be append data to its previous contents. For
    a directory, this means that you can only add files to it, but not rename or delete
    any existing file. Root can set or clear this attribute.


    +   3. d (no dump): dump(8) is the standard UNIX utility for backups. Dump any
    filesystem where the dump counter is 1 in /etc/stab (see "Filesystems and Mount
    Points", page 61). But if a file or directory has this attribute set, others it
    will not be taken into account when a dump is in progress. Note that for directories,
    this includes all subdirectories and under it.


    +   4. i (immutable): if a file or directory with this attribute set cannot be
    modified at all: it cannot be renamed, no further link can be created to it⁴ and
    it cannot be removed. Root can set or clear this attribute.


    +   Be be sure to understand what "adding a link" means, both for a file and a
    directory :-'
