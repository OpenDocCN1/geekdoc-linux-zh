    prompt

    # ... wait 5 seconds

    timeout=50

    #

    # Our new kernel: default image

    image=/boot/vmlinux-2.4.10-foo

    label=foo

    root=/dev/hda1

    read-only

    # If the VESA framebuffer is used:

    vga=0x315

    #

    # The original kernel

    #

    image=/boot/vmlinuz-2.4.8-17mdk

    label=linux

    root=/dev/hda1

    read-only

    ```


    ```

    # Windows Section

    #

    other=/dev/hda2

    label=dos

    table=/dev/hda

    ```


    This could be what your lilo.conf will look like... but remember, again, to adapt
    it to your configuration.


    Now that the file has been modified appropriately, unlike grub which does not
    need it, you must tell LILO to change the boot sector.


    ```

    $ lilo

    Added foo *

    Added linux

    Added dos

    $

    ```


    In this way, you can compile as many kernels as you want, by adding many sections
    as necessary. All you need to do now is restart your machine to test your new
    kernel.'
