  md: '# Chapter 13. Building and installing free software


    9. no space on /tmp


    Compilation needs temporary workspace during the different stages; if it does
    not have space, it fails. So, you may have to clean the partition, but be careful
    some programs being executed (X server, pipes, etc) can hang if some files are
    deleted. You must know what you are doing! If /tmp is part of a partition that
    does not only contain it (for example the root), search and delete some possible
    core files.


    9. make/configure in time in infinite recursion


    It is often a problem of time in your system. Indeed, make needs to know the date
    in the computer and the date of the files it checks. It compares the dates and
    uses the result to know whether the target is more recent than the dependence.


    Some date problems cause make to endlessly build itself (or to build and build
    again a sub-tree in infinite recursion). In such a case, the use of touch (whose
    use here is to put the files in argument at the current time) usually solves the
    problem.


    For instance:


    ```

    $ touch *

    ```


    Or also (cruder, but efficient):


    ```

    $ find | xargs touch

    ```


