  md: '# Chapter 8. The Linux Filesystem


    The touch a command can be separated into two distinct actions:


    +   - creation of an inode, to which the operating system has given the number
    32555, and whose type is the one of a regular file;

    - creation of a link to this inode, named a, in the current directory, /home/queen/example.
    Therefore, the /home/queen/example/a file is a link to the inode numbered 32555,
    and it is currently the only one: the link counter shows 1.


    But now, if we type:


    ```

    $ ln a b

    $ ls -il b

    32555 -rw-rw-r-- 2 queen queen 0 Dec 10 08:12 a

    32555 -rw-rw-r-- 2 queen queen 0 Dec 10 08:12 b

    $

    ```


    we create another link to the same inode. As you can see, we did not create any
    file name b, but instead, we just added another link to the inode 32555 in the
    same directory, and attributed the name b to this new link. You can see on the
    ls -1 output that the link counter for the inode is now 2, and no longer 1.


    Now, if we do:


    ```

    $ rm a

    $ ls -il b

    32555 -rw-rw-r-- 1 queen queen 0 Dec 10 08:12 b

    $

    ```


    we see that even though we deleted the "original file", the inode still exists.
    But now, the only link to it is the file named /home/queen/example/b.


    Therefore, a file under UNIX has no name; instead, it has one or more link(s)
    in one or more directory(ies).


    Directories themselves are also stored in inodes, but their link count, unlike
    all other files, is the number of subdirectories within them. There are at least
    two links per directory: the directory itself (.) and its parent directory (..).


    Typical examples of files which are not linked (i.e.: have no name) are network
    connections: you will never see the file corresponding to the Mandrake Linux web
    (www.mandrakelux.com) in your file tree, whichever directory you try. Similarly,
    when you use a pipe in the shell, the inode corresponding to the pipe does exist,
    but it is not linked.'
