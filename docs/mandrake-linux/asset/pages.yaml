  md: '# Chapter 3. Text Editing: Emacs and Vi


    +   - a and i: to insert text respectively after and before the cursor (A I insert
    text at the end and at the beginning of the current line);

    - o and O: to insert text respectively below and above the current line.


    In insert mode, you will see the string --INSERT-- appear at the bottom of the
    screen (so you know what mode you are in). It is this and only this mode that
    you can enter text. To return to command mode, press the Esc key.


    In insert mode, you can use the Backspace and DEL keys to delete text as you go.
    To move around, both in command mode and in insert mode, you use the arrow keys.
    In command mode, there are also other key combinations which we will look at later.


    ex mode is accessed by pressing the : key in command mode. The same : will appear
    at the bottom of the screen, and the cursor will be positioned on it. Everything
    you type subsequently, followed by pressing Enter, will be considered by Vi to
    be an ex command. If you delete the command and the : typed in, you will return
    to command mode and the cursor will go back to its original position.


    To save changes to a file you type :w in command mode. If you want to save the
    contents of the buffer to another file, type :w <file_name>.


    # 3.2.2. Handling buffers


    As with Emacs, you can have several buffers displayed on the screen. To do this,
    use the :split command.


    To move from one file to another, in a buffer, you type :next to move to the next
    name and :prev to move to the previous file. You can also use :<file_name>, which
    allows you to change to the desired file if this is already open, or to open another
    file. Here again completion is available.


    To change buffers, type Ctrl+j to go to the buffer below or Ctrl+w to go to the
    buffer above. You can also use the up and down arrow keys instead of j or k. The
    :close command hides a buffer, the :q command closes it.


    Watch out, Vi is finicky: if you try to hide or close a buffer without saving
    the changes, the command will not be carried out and you will get this message:


    No write since last change (use! to override)


    In this case, do as you are told and type :q! or :close.'
