    3:So long dad


    # We want all lines not beginning with "H" to match

    $ grep -v "H" my_father

    So long dad

    $

    ```


    In case you want to use grep in a pipe, you don''t have to specify the filename
    as, by default, it takes its input from the standard input. Similarly, by default,
    it prints the results on the standard output, so you can pipe the output of a
    grep to yet another program without fear. Example:


    ```

    $ cat /usr/share/doc/HOWTO/Parallel-Processing-HOWTO / \

    grep -n thread | less

    ```


    # 4.2. find: Find Files According to Certain Criteria


    find is a long-standing UNIX utility. Its role is to recursively scan one or more
    directories and files which match a certain set of criteria in these directories.
    Even though it is very useful, its syntax is truly obscure, and using it requires
    a little work. The general syntax is:


    ```

    find [options] [directories] [criterion] [action]

    ```


    If you do not specify any directory, find will search the current directory. If
    you do not specify a criterion, this is equivalent to “true", thus all files will
    be found. The options, criteria and actions are so numerous that we will only
    mention a few of each here. Let''s start with options:


    +   - -xdev: do not search on directories located on other filesystems;

    - -minddepth <n>: descend at least <n> levels below the specified directory searching
    for files;

    - -maxdepth <n>: search for files which are located at most n levels below the
    specified directory;

    - -follow: follow symbolic links if they link to directories. By default, find
    does not follow themn- -daystart: when using tests related to time (see below),
    take the beginning of current day as a timestamp instead of the default (24 hours
    before current time).


    A criterion can be one or more of several atomic tests; some useful tests are:'
  merge: -1
