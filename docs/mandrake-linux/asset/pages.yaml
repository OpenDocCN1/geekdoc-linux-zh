    # 3.2.4. Cut, copy, paste


    Vi has a command that we have already seen for copying text: the y command. To
    cut text, simply use the d command. You have 27 memories for storing text: an
    anonymous memory and 26 memories named after the 26 lowercase letters of the alphabet.


    To use the anonymous memory you enter the command as is. So the command d12w copies
    to the anonymous memory 12 words after the cursor. Use d12w if you want to cut
    this area.


    To use one of the 26 named memories, enter the sequence `<x>` before the command,
    where `<x>` gives the name of the memory. Thus, to copy the same 12 words into
    the memory k, you would write `ky12w`, and `kd12w` to cut them.


    To paste the contents of the anonymous memory, use the commands p or P (*Paste*),
    to insert text after or before the cursor respectively. To paste the contents
    of a named memory, use `<x>p` or `<x>P` in the same way (for example `dp` will
    paste contents of memory d after the cursor).


