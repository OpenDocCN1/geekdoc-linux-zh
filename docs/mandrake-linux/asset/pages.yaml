  md: '# Chapter 3. Text Editing: Emacs and Vi


    # 3.2.3. Editing text and move commands


    Apart from the Backspace and DEL keys in edit mode, Vi has many other commands
    for deleting, copying, pasting, and replacing text – in command mode. Here, we
    will look at a few. All the commands shown are in fact separated into two parts:
    the action to be performed and its effect. The action may be:


    +   - c: replace (Change); the editor deletes the text requested and goes back
    into insert mode after this command;

    - d: delete (Delete);

