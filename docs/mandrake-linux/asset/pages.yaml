  md: '# Chapter 13. Building and installing free software


    2. cc1: This step consists of converting C into assembly language. The generated
    code depends on the target architecture.


    3. as: This step consists of generating object code (or binary code) from the
    assembly language. At the end of this stage, a .o file is generated.


    4. ld: The last step (linkage) links all the object files (.o) and the associated
    libraries, and produces an executable file.


    # 13.1.3. Structure of a distribution


    A correctly structured free software distribution always has the same organization:


    +   - An INSTALL file, which describes the installation procedure.

    - A README file, which contains general information related to the program (short
    description, author, URL where to fetch it, related documentation, useful links,
    etc). If the INSTALL file is missing, the README file usually contains a brief
    installation procedure.

    - A COPYING file, which contains the license or describes the distribution conditions
    of the software. Sometimes a LICENSE file replaces it.

    - A góp or CREDITS file, which contains a list of people related to the software
    (active participation, pertinent comments, third-party programs, etc).

    - A CHANGES file (or less frequently, a NEWS file), which contains recent improvements
    and bugfixes.

    - A Makefile file (see the section make, page 131), which allows compilation of
    the software (it is a necessary file for make). This file often does not exist
    at the beginning and is generated during compilation process.

    - Quite often, a configure or Makefile, which allows one to generate a new Makefile,

    - A directory that contains the sources, and where the binary file is usually
    stored at the end of the compilation. Its name is often src.

    - A directory that contains the documentation related to the program (usually
    in man or Texinfo format), whose name is often doc.

    - Sometimes, a directory that contains data specific to the software (typically
    configuration files, example of produced data, or resources files).'
