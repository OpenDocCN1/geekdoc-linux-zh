  md: '# # Chapter 8. The Linux Filesystem


    Naturally, your GNU/Linux system is contained on your hard disk within a filesystem.
    Here we present different aspects related to filesystems, as well as the possibilities
    they offer.


    # ## 8.1. Comparison of a Few Filesystems


    During the installation, you can choose different file systems for your partitions.
    This means you can format your partitions according to different algorithms.


    Unless you are a specialist, choosing a filesystem is not obvious. We propose
    a rapid presentation of the three of the most current file systems, which are
    all available under Mandrake Linux.


    # ### 8.1.1. Different Usable Filesystems


    # #### 8.1.1.1. Ext2FS


    The Second Extended Filesystem (its abbreviated form is Ext2FS or simply ext2)
    has been GNU/Linux’s default filesystem for many years. It replaced the Extended
    File System (that’s where the “Second” comes from). The “new” filesystem corrected
    certain problems and limitations.


    Ext2FS respects the usual standards for Unix-type filesystems. Since its conception,
    it was destined to evolve, while still offering a great robustness and good performances.


    # ### 8.1.1.2. Ext3


    Like its name suggests, the Third Extended File System is Ext2FS’ successor. It
    is compatible with the latter but it is enhanced by a very interesting feature:
    journaling.


    One of the major flaws of “traditional” filesystems like Ext2FS are their low
    tolerance to abrupt system breakdowns (power failure or crashing software). Generally
    speaking, such events involve a very long exam of the filesystem’s structure,
    attempts to correct errors, sometimes resulting in an extended corruption. Hence,
    a partial or total loss of saved data.


    Journaling answers this problem. To simplify, let’s say that the object is to
    save actions (such as the saving of a file) before really doing it. We could compare
    its functioning to the one of a boat captain whom notes in his log book daily
    events. The result: an coherent filesystem. And if problems occur, the verification
    is very rapid and the eventual repairs, very limited.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Chapter 8. The Linux Filesystem


    time spent to verify a filesystem is thus proportional to its actual use and no
    more its size.


    Hence, Ext3FS offers the journal filesystem technology, while keeping Ext2FS’
    structure – ensuring an excellent compatibility.


    # 8.1.1.3. ReiserFS


    Unlike Ext3FS, ReiserFS is created from scratch. It is journalized like Ext3FS,
    but its internal structure is radically different. Specifically, it uses binary-tree
    concepts inspired by database software.


    # 8.1.1.4. JFS


    JFS is the journalized filesystem designed and used by IBM. Proprietary and closed
    at first, IBM recently decided to open the access to free software movement. Its
    internal structure is near to ReiserFS’ one.


    # 8.1.2. Differences Between those Filesystems


    | Ext2FS | Ext3FS | ReiserFS | JFS |

    | --- | --- | --- | --- |

    | Stability | Excellent | Good | Good | Medium |

    | Tools to recuperate erased files | Yes (complex) | Yes (complex) | No | No |

    | Reboot time after crash | Long, even very long | Fast | Very fast | Very fast
    |

    | Sum of the data in case of a crash | Generally speaking, good, but high risk
