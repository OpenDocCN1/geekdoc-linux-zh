    # 13.5.1. With make


    Now that all is compiled, you have to copy the built files to an appropriate place
    (usually in one of the sub-directories of /usr/local).


    make can usually perform this task. A special target is the target install. So,
    using make install carries out the installation of the required files.


    Usually, the procedure is described in the INSTALL or README file. But sometimes,
    the developer has forgotten to provide one. In that case, you must install everything
    by yourself.


    Copy then:'
