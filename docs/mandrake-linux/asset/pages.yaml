  md: '# 2.1. Contact Mandrake Community


    Following are various Internet links pointing to various Mandrake Linux related
    sources. If you wish to know more about the MandrakeSoft, connect to its web site
    (http://www.mandrakesoft.com/). There is also the Mandrake Linux distribution
    (http://www.mandrakelinux.com/) web site and all its diversions.


    First of all, MandrakeSoft is proud to present its new open help platform. MandrakeExpert
    (http://www.mandrakeexpert.com/) isn''t just another web site where people help
    others with their computer problems in exchange for up-front fees, regardless
    of the quality of the service received. It offers a new experience based on trust
    and the pleasure of rewarding others for their contributions.


    In addition, MandrakeCampus (http://mandrakecampus.com/) provides the GNU/Linux
    community with open education and training courses on all software-related technologies
    and issues. It also gives teachers, tutors and learners a place where they can
    share knowledge.


    There is a site for the "mandrakeholic" called Mandrake Forum (http://www.mandrakeforum.com/).
    a primary site for Mandrake Linux related tips, tricks, rumors, pre-announcements,
    semi-official news, and more. This is also the only interactive web site hosted
    by MandrakeSoft, so if you have something to tell us, or something you want to
    share with other users, no longer: this is a place to do it!


    In the philosophy of open source, MandrakeSoft is offering many means of support
    (http://www.mandrakelinux.com/en/freesup.php3) for the Mandrake Linux distributions.
    You are invited in particular to participate in the various Mailing lists (http://www.mandrakelinux.com/en/lists.php3),
    where the Mandrake community demonstrates its vivacity and keenness.


    Finally, do not forget to connect to MandrakeSecure (http://www.mandrakecure.net/).
    This site gathers all security material about Mandrake Linux distributions. You''ll
    notably find there security and bug advisories, as well as security and privacy-related
    articles. A must for any server administrator or user concerned about security.


    # 2.2. Support Mandrake


    By popular request, MandrakeSoft proposes that its happy customers make a donation
    (http://www.mandrakelinux.com/donations/) to support the forth-coming developments
    of the Mandrake Linux system. Your contribution will help MandrakeSoft provide
    its users with an ever better distribution, ever safer, easier, up-to-date, and
    with more supported languages.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Preface


    For the many talented, your skills will be very useful for one of the many tasks
    required in the making of a Mandrake Linux system:


    +   - Packaging: a GNU/Linux system is mainly made of programs picked up on the
    Internet. These programs have to be packaged so that they will fully work together.


    +   - Programming: there are many many projects directly supported by MandrakeSoft;
    find the one that most appeals to you, and offer your help to the main developer.


    +   - Internationalization: translation of the web pages, programs and their respective
    documentation.


    +   - Documentation: last but not least, the book you are currently reading requires
    a lot of effort to stay up-to-date with the rapid evolution of the system.


    Consult the contributors page (http://www.mandrakesoft.com/labs/) to learn more
    about the way you can contribute to the evolution of Mandrake Linux.


    On August 3rd 2001, after having established itself as one of the world leaders
    in Open Source and GNU/Linux software, MandrakeSoft became the first Linux company
    listed on a European stock market. Whether you''re already a MandrakeSoft shareholder
    or wish to become one, our Investor pages (http://www.mandrakesoft.com/company/investors)
    provide the best financial information related to the company.


    # 2.3. Purchasing Mandrake Products


    For Mandrake Linux fans wishing to benefit from the ease of on-line purchasing,
    MandrakeSoft now sells its products worldwide from its MandrakeStore (http://www.mandrakesoft.com/)
    e-commerce web site. You will find not only Mandrake Linux software — operating
    systems and network tools (Single Network Firewall), but also subscription offers,
    support, third party software and licenses, training documentation, GNU/Linux
    related books, as well as other goodies related to MandrakeSoft.


    # 3. Authors And Translators


    The following people contributed to the making of the Mandrake Linux manuals:


    +   - Yves Bailly'
