  md: '# Chapter 4. Command Line Utilities


    The purpose of this chapter is to introduce a small number of command line tools
    which may prove useful for everyday use. Of course, you may skip this chapter
    if you only intend to use a graphical environment, but a quick glance may change
    your opinion :)


    There is not really any organization in this chapter. Utilities are listed as
    they come, from the most commonly used to the most obscure. Each command will
    be illustrated by an example, but this chapter is meant as an exercise, in order
    for you to grasp their function and use.


    # 4.1. grep: Locate Strings in Files


    Okay, the name is not very intuitive, neither is its acronym (“General Regular
    Expression Parser”), but its use is simple: looking for a pattern given as an
    argument in one or more. Its syntax is:


    ```

    grep [options] <pattern> [one or more file(s)]

    ```


    If several files are mentioned, their name will precede each matching line displayed
    of these names; use the -n option to prevent the display of these names; use the
    -l option to get nothing but the matching filenames. The pattern is a regular
    expression, even though most of the time it consists of a simple word. The most
    frequently used options are the following:


    +   - i: make a case insensitive search. (i.e. ignore differences between lower
    and uppercase);

    - -v: invert search: display lines which do not match the pattern;

    - -n: display the line number for each line found;

    - -w: tells grep the pattern should match a whole word.


    Here’s an example of how to use it:


    ```

    $ cat my_father

    Hello dad

    Hi daddy

    So long dad


    # Search for the string "hi", no matter the case

    $ grep -i hi my_father

    Hi daddy


    # Search for "dad" as a whole word, and print the

    # line number in front of each match

    ```'
  merge: -1
  pgno: 58
