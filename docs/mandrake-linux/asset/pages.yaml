    # 14.3. Configuring The Kernel /usr/linux directory.


    To start, go into the /usr/src/linux directory.

    First, a little trick: you can, if you want, customize the version of your kernel.
    The kernel version is determined by the four first lines of the Makefile:


    ```

    $ head -4 Makefile

    VERSION = 2

    PATCHLEVEL = 4

    SUBLEVEL = 10

    EXTRAVERSION = =

    ```


    Further on in the Makefile, you can see that the kernel version is built as:


    KERNELRELEASE=$(VERSION).$(PATCHLEVEL).$(SUBLEVEL)$$(EXTRAVERSION)


    All you have to do is modify one of these fields in order to change your version.
    Preferably, you will only change EXTRAVERSION. Say you set it to -foo, for example.
    Your new kernel version will then become 2.4.10-foo. Do not hesitate to change
    this field each time you recompile a new kernel with different versions, so that
    you can test different options while keeping old tries.


    Now, on to configuration. You can choose between:'
