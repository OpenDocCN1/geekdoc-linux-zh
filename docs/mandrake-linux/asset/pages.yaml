  md: '# # Chapter 5. Process control


    # ## 5.1. More about processes


    In Processes, page 6, we mentioned that it was possible to monitor processes;
    that is what we will cover in this chapter. To understand the operations we are
    going to perform here, it is helpful to know a bit about them.


    # ### 5.1.1. The process tree


    As files, all processes that run on a GNU/Linux system are organized in the form
    of a tree. The root of this tree is init. Each process has a number (its PID,
    Process ID), together with the number of its parent process (PPID, Parent ID).
    The PID of init is 1, and so is its PPID: init is its own father.


    # ### 5.1.2. Signals


    Every process in UNIX can react to signals sent to it. There are 64 different
    signals which are identified either by their number (starting from 1) or by their
    symbolic names. The 32 “higher” signals (33 to 64) are real-time signals, and
    are out of the scope of this chapter. For each of these signals, the process can
    define its own behavior, except for two signals: signal number 9 (KILL), and signal
    number 19 (STOP).


    Signal 9 kills a process irrevocably, without giving it the time to terminate
    properly. This is the signal you send to a process which is stuck or exhibits
    other problems. A full list of signals is available using the command kill -1.


    # ## 5.2. Information on processes: ps and pstree


    These two commands display a list of processes currently running on the system,
    according to criteria set by you.


    # ### 5.2.1. ps


    Sending this command without an argument will show only processes initiated by
    you and attached to the terminal you are using:


    ```

    $ ps

    PID TTY TIME CMD

    5162 ttyal 00:00:00 zsh

    7452 ttyal 00:00:00 ps

    ```'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Chapter 5. Process control


    As with many UNIX utilities, ps has a handful of options, we will look at the
    most common here:


    +   - a: also displays processes started by other users

    * x: also displays processes with no control terminal or with a control terminal
    different to the one you are using;

    * u: displays for each process name of the user who started it and the time it
    was started.


    There are many other options. Refer to the ps(1) manual page for more information.


    The output of this command is divided into different fields: the one that will
    interest you most is the field PID, which contains the process identifier. The
    field CMD contains the name of the command executed. A very common way of invoking
    ps is as follows:


    ```

    $ ps ax less

    ```


    This gets you a list of all processes currently running, so that you can identify
    one or more processes which are causing problems and subsequently kill them.


    # 5.2.2. pstree


    The command pstree displays the processes in the form of a tree structure. One
    advantage is that you can immediately see which is the parent process of what:
    when you want to kill a whole series of processes and if they are all parents
    and children, you can simply kill the parent. You want to use the option -p, which
    displays the PID of each process, and the option -u which displays the name of
    the user who started off the process. As the tree structure is generally long,
    you want to invoke pstree in the following way:


    ```

    $ pstree -up | less

    ```


    This gives you an overview of the whole process tree structure.'
  merge: -1
  pgno: 71
