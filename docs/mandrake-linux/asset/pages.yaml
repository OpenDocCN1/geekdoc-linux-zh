  md: '# # Chapter 11. Printing


    This chapter is divided in two parts: Installing And Managing Printers, page 91,
    devoted to people administering their own machines; and Printing Documents, page
    99, which explains how to use an advanced printing tool: XPP.


    # ## 11.1. Installing And Managing Printers


    Starting from release 7.2, Mandrake Linux began using the new printing system
    based on cups (http://www.cups.org/)¹. This is a very powerful tool based on decentralized
    management and configuration, making all printers in a local network available
    to all users.


    # ### 11.1.1. Install CUPS And Browse Its Web Interface


    cups is now the default printer manager for Mandrake Linux, and all necessary
    packages should be installed by default. If it is not the case, make sure that
    at least the packages cups, cups-drivers and xpp are installed.


    > There are basically two ways to manage your printers with cups: a web interface
    and a manager part of the KDE Control Center (System→Printing Management). We
    chose to concentrate on the web interface as it is accessible from any platform
    and allows for remote printing management. You can get full documentation about
    KDE printing tools at their web site (http://printing.kde.org/).


    From your preferred web browser, simply type http://localhost:631/ in the location
    or URL field. It will display the main cups menu (figure 11-1).


    +   1. Common Unix Printing System'
