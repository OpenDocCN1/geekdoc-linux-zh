  md: '# Chapter 9. The /proc Filesystem


    xirc2ps_cs 5 0300-030f

    $


    An exhaustive listing of files would be too long, but here''s the description
    of some of them:


    +   - cpuinfo: this file contains, as its name says, information on the processor(s)
    in your machine.

    - modules: this file contains the list of modules currently used by the kernel,
    along with the usage count for each one. In fact, this is the same information
    as what is reported by the lsmod command.

    - meminfo: this file contains information on memory usage at the time you print
    its contents. A more clearly formatted output of the same information is available
    with the free command.

    - apm: if you have a laptop, displaying the contents of this file allows you to
    see the state of your battery. You can see whether the AC is plugged in, the current
    load of your battery, and if the APM BIOS of your laptop supports it (unfortunately
    this is not the case for all), the remaining battery life in minutes. The file
    isn''t very readable by itself, therefore you want to use the ap command instead,
    which gives the same information in a human readable format.

    - bus: this subdirectory contains information on all peripherals found on different
    buses in your machine. Information inside it are generally seldom readable, and
    for the most part they are dealt with and reformatted with external utilities:
    lspcidrake, lspnp, etc.


    # 9.3. The /proc/sys Sub-Directory


    The role of this subdirectory is to report different kernel parameters, and to
    allow for changing in real time some of these parameters. As opposed to all other
    files in /proc, some files in this directory can be written to, by root only.


    A list of directories and files would be too long, all the more that they will
    depend on a large part on your system, and that most files will only be useful
    for very specialized applications. However, here are three common uses of this
    subdirectory:


    +   1. Allow routing: Even if the default kernel from Mandrake Linux is able to
    route, you must explicitly allow it to do so. For this, you just have to type
    the following command as root:

    $ echo 1 >/proc/sys/net/ipv4/ip_forwarding'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Chapter 9. The /proc Filesystem


    Replace the 1 by a 0 if you want to forbid routing.


    +   2. Prevent IP spoofing: IP spoofing consists in making one believe that a
    packet from the outside world comes from the interface by which it arrives. This
    technique is very commonly used by crackers, but you can make the kernel prevent
    this kind of intrusion for. You just have to type:


    ```

    $ echo 1 >/proc/sys/net/ipv4/conf/all/rp_filter

    ```


    and this kind of attack becomes impossible.


    +   3. Increase the size of the table of open files and the inode table: The size
    of the table of open files and the inode table is dynamic under GNU/Linux. The
    default values are usually sufficient for normal use, but they may be too weak
    if your machine is a huge server (a database server for example). Indeed, the
    first obstacle is the fact that processes cannot open any more files because the
    table is full, therefore you must must increase its size. Meanwhile, you must
    also increase the size of the inode table. These two lines solve the problem:


    ```

    $ echo 8192 >/proc/sys/fs/file-max

    $ echo 16384 >/proc/sys/fs/inode-max

    ```


    In order for these to be executed each time you boot the system, you can add all
    these lines to /etc/rc.d/rc.local so that you avoid typing them each time, but
    another solution is to fill in /etc/sysctl.conf, see sysctl.conf(5).


    +   3. And not hackers!'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Chapter 10. The Start-Up Files: init sysv


    In the UNIX tradition, there are two system startup schemes: the BSD scheme and
    the "System V" scheme, both named after the UNIX system implemented them first
    (resp. Berkeley Software Distribution and AT&T UNIX System V). The BSD scheme
    is more simple, but the System V scheme, although less easy to understand (which
    will change once you finish this chapter), is deinitely more flexible to use.


    # 10.1. In The Beginning Was init


    When the system starts, and after the kernel has configured everything and mounted
    the root filesystem, it executes /sbin/init the father of all processes of the
    system, and it is responsible for taking the system to the desired runlevel. We
    will look at runlevels in the next section.


    The init configuration file is /etc/initab. This file has its own manual page
    (initab(5)), but here we will describe only a few of the configuration items.

    The first line which should be the focus of your attention is this one:


    ```

    si::sysinit:/etc/rc.d/rc.sysinit

    ```


    This instruction tells init that /etc/rc.sysinit is to be run on initialization
    of the system (si stands for System Init) before anything else. To determine the
    default runlevel, init then looks for the line containing the initdefault keyword:


    ```

    id:5:initdefault:

    ```


    In this case, it knows that the default runlevel is 5. It also knows that to enter
    level 5, it must run the following command:


    ```

    15:5:wait:/etc/rc.d/rc 5

    ```


    As you can see, the syntax for each runlevel is similar.

    init is also responsible for restarting (respawn) some programs, which is the
    only process capable of restarting. This is the case, for example, for all login
    programs which run in each of the 6 virtual consoles². For the second virtual
    console, this gives:


    ```

    2:2345:respawn:/sbin/mingetty tty2

    ```


    +   1. Now you see why putting /sbin on a filesystem other than the root filesystem
    is a very bad idea :-)

    2. So if you want, add or remove virtual consoles by modifying this file, up to
    a maximum of 64, by following the syntax. Don''t forget that X also runs on a
    virtual console! So leave it at least one free for it.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Chapter 10. The Start-Up Files: init sysv


    # 10.2. Runlevels


    All files related to system startup are located in the directory /etc/rc.d. Here
    is the list of the files:


    ```

    ```

    $ ls /etc/rc.d

    init.d/  rc.local*  rc0.d/ rc2.d/ rc4.d/ rc6.d/

    rc*      rc.sysinit* rc1.d/ rc3.d/ rc5.d/\n```

    ```


    To begin with, as we have seen, the rc.sysinit file is run. This is the file responsible
    for setting up the basic machine configuration: keyboard type, configuration of
    certain devices, filesystem checking, etc.


    Then the rc script runs, with the desired runlevel as we have seen, the runlevel
    is a simple integer, and for each runlevel <x> defined, there must be a corresponding
    rc<>. directory. In a typical Mandatory Linux installation, you might therefore
    see that 6 runlevels are defined:


    +   * 0: complete machine stop;

    * 1: single-user mode, to be used in the event of major problems or system recovery;

    * 2: multi-user mode, without networking;

    * 3: Multi-user mode, but this time with networking;

    * 4: unused;

    * 5: like 3, but also launches the graphical login interface;

    * 6: restart.


    Let us look, for example, at the contents of directory rc.d:


    ```

    ```

    $ ls rc.d

    K15postgresql@ K60atd@ S15netfs@ S60lpd@ S90xfs@

    K20nfs@ K96postfix@ S20random@ S60ifs@ S99linuxconf@

    K20rastd@ S05aspd@ S30yslog@ S66passwd@ S99local@

    K20users@ S10network@ S40cron@ S75keytable@

    K20who@ S11portmap@ S50init@ S85gpm@

    K30sendmail@ S12yserver@ S55named S85httpd@

    K35smb@ S13ybind S55routed@ S85sound

    ```

    ```


    As you can see, all the files in this directory are symbolic links, and they all
    have a very specific form. Their general form is:


    ```

    <S|K><order><service_name>

    ```'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Chapter 10. The Start-Up Files: init sysv


    The S means Start service, and K means Kill (stop) service. The scripts are run
    in ascending number, and if two scripts have the same number, alphabetical order
    apply. We can also see that each symbolic link points to a given script located
    in /etc/rc.d/init.d (apart from local), script which is responsible for controlling
    a specific service.


    When the system goes into a given runlevel, it starts by running the K links in
    order: rc looks where the link is pointing, then calls up the corresponding script
    with the single argument stop. Then it runs the S scripts, still using the same
    method, apart from the fact that the script is called with the argument start.


    Thus, without mentioning all the scripts, we can see that when the system goes
    into runlevel 5, it first runs K15postgresql, i.e. /etc/rc.d/init.d/postgresql.
    Then K20nfs, then K20rstat, until the last one; next, it runs all the S scripts:
    first S05apmd, which then calls /etc/rc.d/init.d/apmd start, and so on.


    Armed with all this, you can create your own entire runlevel in a few minutes,
    or prevent a service starting or stopping by deleting the corresponding symbolic
    link (there are also interface programs for doing this, notably drakx-services
    and chkconfig; the former is a graphical program).'
  merge: -1
  pgno: 106
