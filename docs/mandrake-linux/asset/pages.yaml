- img_proc: true
  md: '# Chapter 14. Compiling and Installing New Kernels


    +   * make config for a graphical interface;

    * make menuconfig for an interface based on ncurses;

    * make config for the most rudimentary interface, line by line, section by section;

    * make oldconfig for the same as above, but based on your former configuration.
    See Saving, Reusing Your Kernel Configuration Files, page 147.


    You will go through the configuration section by section, but you can skip sections
    and jump to the ones that interest you if you are using menuconfig or xconfig.
    The options are y for Yes (functionality hard-coded into the kernel), m for Module
    (functionality compiled as a module), or n for No (do not include it in the kernel).


    Both xconfig and makeconfig have the options bundled in hierarchical groups. For
    example, Processor family goes under Processor type and features.

    For xconfig, the button Main Menu is used to come back to the main menu when in
    a hierarchical group; Next to the next group of options; Prev returns to the previous
    group. For menuconfig, use the Enter key to select a section, and switch with
    y, m or n to change the status options, or else, press the Enter key and make
    your choice for the multiple choice. Exit will take you out of a section or out
    of configuration if you are in the main menu. And there is also Help.


    We are not going to enumerate all options here, as there are several hundreds
    of them. Furthermore, if you have reached this chapter, you probably know what
    you are doing anyway. So you are left to browse through the kernel configuration
    and unset/uncheck options you see fit. However, there are some advices to avoid
    ending up with an unusable kernel:


    +   1. Unless you use an initial ramdisk, never compile the drivers necessary
    to mount your root filesystem (hardware drivers and filesystem drivers) as modules!
    And if you use an initial ramdisk, say Y to ext2fs support, as this is the filesystem
    used for ramdisks. You will also need the initrd support;

    2. If you have network cards on your system, compile their drivers as modules.
    Here, you can define which card will be the first one, which will be the second,
    and so on, by putting appropriate aliases in /etc/modules.conf. If you compile
    the drivers into the kernel, the order in which they will be loaded will depend
    on the linking order, which may not be the order you want;


    +   3. And finally: if you don''t know what an option is about, read the help!
    If the help text still doesn''t inspire you, just leave the option as it was.
    (for config and oldconfig targets, press the ? key to access the help).'
