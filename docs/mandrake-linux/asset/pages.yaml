  md: '# Chapter 14. Compiling And Installing New Kernels


    experience problems with the new one. However, you can choose to manually install
    the kernel and change the boot menus by hand. We will explain that in the next
    section.


    # 14.6. Installing The New Kernel Manually


    The kernel is located in arch/i386/boot/bzImage (or zImage if you chose to make
    zImage instead). The standard directory in which kernels are installed is /boot.
    You also need to copy the System.map file to ensure that some programs (top is
    just one example) will work correctly. Good practice again: name these files after
    the kernel version. We will assume that your kernel version is 2.4.10-foo. The
    sequence of commands you will have to type is:


    ```

    $ cp arch/i386/boot/bzImage /boot/vmlinux-2.4.10-foo

    $ cp System.map /boot/System.map-2.4.10-foo

    ```


    Now you need to tell the bootloader about your new kernel. There are two possibilities:
    grub or LILO. Note that Mandrake Linux is configured with LILO by default.


    # 14.6.1. Updating Kernel


    Obviously, retain the possibility of starting your current kernel! The simplest
    way of updating grub is to use drakboot (see chapter Change Your Bootup Configuration
    in the User Guide). Alternatively, you can manually edit the configuration file
    as follows.


    You need to edit the /boot/grub/menu.1st file. This is what a typical menu. 1st
    looks like, after you have installed the Mandrake Linux distribution and before
    modification:


    ```

    timeout 5

    color black/cyan yellow/cyan

    i18 (hd0,4)/boot/grub/messages

    keytable (hd0,4)/boot/fr-latin1.klt

    default 0


    title linux

    kernel (hd0,4)/boot/vmlinuz root=/dev/hda5


    title failsafe

    kernel (hd0,4)/boot/vmlinuz root=/dev/hda5 failsafe


    title Windows

    root (hd0,0)

    makeactive

    ```'
