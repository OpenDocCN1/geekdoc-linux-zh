  md: '# Chapter 12. msec – Mandrake Security Tools


    # 12.3.1.18. allow Issues


    If set to none, no banners are displayed. If set to local, only a login banner
    is displayed on the console. If set to all, a login banner is displayed on all
    login prompts.


    # 12.3.1.19. . inPATH


    The . entry is added to the $PATH environment variable, allowing easy execution
    of programs within the current working directory (it is also, to some extent,
    a security hole).


