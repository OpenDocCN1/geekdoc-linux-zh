    The boot directive tells LILO where to install its boot sector; in this case,
    it is the MBR (Master Boot Record) of the first IDE hard disk. If you want to
    make a LILO floppy disk, simply replace /dev/hda with /dev/fd0. The prompt directive
    asks LILO to show the menu on start-up. As a timeout is set, LILO will start the
    default image after 5 seconds (timeout=50). If you remove the timeout directive
    , LILO will wait until you have typed something.

    Then comes a linux section:


    ```

