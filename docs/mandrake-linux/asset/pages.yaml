    # 1.4. Small Introduction to the Command Line


    The command line is the most direct way to send commands to your machine. If you
    use the GNU/Linux command line, you will soon find that it is much more powerful
    and capable than other command prompts you may have previously used. The reason
    for this is that you have direct access, not only to all X applications, but also
    to thousands of utilities in console mode (as opposed to graphical mode) which
    do not have graphical equivalents, or the many options and possible combinations
    of which would be hard to access in the form of buttons or menus.


    But, admittedly, it requires a little help to get started. The first thing to
    do is to launch a terminal emulator. While accessing your GNOME or KDE application
    menu, you will find these in Terminal. Then, choose the one you want, for example
    Terminal or xterm. You also have an icon which clearly identifies it on the panel
    (figure 1-3).


    ![](img/a40daaaf9b45f9af35d348684ba96cad_26_0.png)


    Figure 1-3. The Terminal Icon on the KDE Panel


    When you launch this terminal emulator, you actually use a shell. This is the
    name of the program with which you interact. You find yourself in front of the
    prompt: $


    ```

    [queen@localhost] ~ $

    ```


    This assumes that your user name is queen and that your machine''s name is localhost
    (this is the case if your machine is not part of an existing network). Typically,
    after the prompt is space for you whatever you need to type. Note that when you
    are root, the prompt''s $ character turns into a # (this is true only in the default
    configuration, since you can customize all such details in GNU/Linux). In order
    to become root, type su after launching a shell .'
