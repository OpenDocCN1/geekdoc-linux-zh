  md: '# Chapter 1. Basic UNIX System Concepts


    2. Write permission (w): it allows the modification of a file''s contents. For
    a directory, the write permission allows a user to add and/or remove files from
    this directory, if they are not the owner of these files.


    3. execute permission (x): it enables a file''s execution (as a consequence, only
    executable files should normally have a permission set). For a directory, this
    allows a user to *traverse* (which means going into or through that directory).
    Note that this is separated from the read access: it may very well be that you
    traverse a directory but cannot read its contents!


    Every combination of permissions is possible. For example, you can allow only
    to read the file and forbid it to all other users. You can do the opposite, even
    if it''s not very logical at a glance... As the file owner, you can also change
    the owner group (if and only if you are a member of the new group), and even deprive
    yourself of the file (that is, change owner). Of course, if you deprive yourself
    of the file, you will lose all your rights to it:


    Let''s take the example of a file and a command. The display below represents
    entering the `ls -l` command from the **command line:**


    ```

    ls -l

    total 1

    -rw-r-- 1 queen users 0 Jul 8 14:11 a_file

    drwxr-xr- 2 peter users 1024 Jul 8 14:11 a_directory/

    $

    ```


    The results of the `ls -l` command are (from left to right):


    +   * the first ten characters represent the file''s type and the permissions
    associated to it. The first character is the file''s type: if it is a regular
    file, it will contain a dash (-). If it''s a directory, you will see this character:
    d. There are other file types, which we will talk about in the Reference Manual.
    The nine following characters represent the permissions associated to that file.
    You can see the distinction which is made between different users for the same
    file: the first three characters represent the rights associated to the file owner,
    the next three to all users belonging to the group but who are not the owner,
    and the last three apply to others. A dash (-) means that the permission is not
    set;

    * following this are the number of links for the file. We will see in the *Reference
    Manual* that the unique identifier of a file is not its name, but a number (inode
    number), and that it is possible for one file on disk to have several names. For
    a directory, the number of links has a special meaning, which we will also discuss
    in the *Reference Manual*;'
