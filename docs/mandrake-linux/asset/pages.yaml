  md: '# Chapter 3. Text Editing: Emacs and Vi


    # 3.2. Vi: the ancestor


    Vi was the first full-screen editor in existence. Vi makes for one of the main
    objections of UNIX detractors, but also one of the main arguments of its defenders:
    while it is complicated to learn, it is also an extremely powerful tool once one
    gets into the habit of using it. With a few keystrokes, a Vi user can move mountains,
    and apart from Emacs, few text editors can boast the same. The version supplied
    with Mandrake Linux is in fact vim, for VI iMproved, but we will call it Vi throughout
    this chapter.


    # 3.2.1. Insert mode, command mode, ex mode...


    First, we need to start Vi, which is identical to Emacs. So let us go back to
    our two files and type:


    ```

    $ vi file file2

    ```


    At this point, you find yourself in front of a window resembling figure 3-4.


    ![](img/a40daaaf9b45f9af35d348684ba96cad_51_0.png)


    You are now in command mode in front of the first open file. In command mode,
    you cannot insert text into a file... To do this, you have to go into insert mode,
    and therefore enter one of the commands which allows you to do so:'
