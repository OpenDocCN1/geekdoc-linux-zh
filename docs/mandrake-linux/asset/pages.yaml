  md: '# Chapter 13. Building and installing free software


    +   - HOWTOs, short documents on precise points (usually far from what we need
    here, but sometimes useful). Look on your disk in /usr/share/doc/HOWTO (not always,
    they are sometimes elsewhere; check that out with the command locate HOWTO).


    +   - The manual pages. Type man <command> to get documentation on the command
    <command>


    +   - Specialized literature. Several large publishers have begun publishing books
    about free systems (especially GNU/Linux). It is often useful if you are a beginner
    and if you do not understand all the terms of the present documentation.


    # 13.6.2. Technical support


    If you bought an "official" Mandrake Linux distribution, you can ask the technical
    support staff for information on your system. I think that the technical support
    staff have better things to do than help all the users to install additional software,
    but some of them do offer x days-installation help. Perhaps they can spend some
    time on compilation problems?

    You also rely on help from the free software community:


    +   - newsgroups (on Usenet) comp.os.linux.* (news:comp.os.linux.*) answer all
    the questions about GNU/Linux. Newsgroups matching comp.os.bsd.* deal with BSD
    systems. There may be other newsgroups dealing with other UNIX systems. Remember
    to read them for some time prior to writing to them.


    +   - Several associations or groups of enthusiasts in the free software community
    offer voluntary support. The best way is to find the closest to you, is to check
    the lists on specialized web sites, or to read the relevant newsgroups for a while.


    +   - Several IRC channels offer a real time (blind) assistance by gurus. See
    for instance the #linux channel on most of the IRC network, or #linuxhelp on IRC.


    +   - As a last resort, ask the developer of the software (if he mentioned his
    name and his email address in a file of the distribution) if you are sure that
    you have found a bug (which may be due only to your architecture, but after all,
    free software is supposed to be portable).'
