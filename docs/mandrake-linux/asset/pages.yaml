  md: '# Chapter 3. Text Editing: Emacs and Vi


    As stated in the introduction, text editing is a fundamental feature in the use
    of a UNIX system. The two editors we are going to take a quick look at are are
    a little difficult to use initially, but once you understand the basics, both
    prove to be powerful tools.


    # 3.1. Emacs


    Emacs is probably the most powerful text editor in existence. It can do absolutely
    everything and is infinitely extensible thanks to its built-in isp-programming
    language. With Emacs, you can move around the web, read your mail, take part in
    usenet newsgroups, make coffee, and so on. However, what you will be able to do
    at the end of this section will be limited to opening Emacs, editing one or more
    files, saving them and quitting Emacs. Which is not too bad to start with.


    # 3.1.1. Short presentation


    Invoking Emacs is relatively simple:


    ```

    emacs [file] [file...]

    ```


    Emacs will open any file entered as an argument in a buffer, with up to a maximum
    of two buffers visible at the same time, and will present you with the buffer
    entitled *scratch* if you do not specify a file. If you are in X, you also have
    menus available, but in this chapter we will be working with the keyboard.


    # 3.1.2. Getting started


    It is time to get hands-on. By way of example, let us open two files, file1 and
    file2. If these two files do not exist, they will be created as soon as you write
    something in them:


    ```

    $ emacs file1 file2

    ```


    You will get the window shown in figure 3-1.


    +   - "To edit text" means to modify the contents of a file holding only letters,
    digits, and punctuation signs; such files can be electronic mails, source code,
    documents, or even configuration files.'
  merge: -1
  pgno: 46
