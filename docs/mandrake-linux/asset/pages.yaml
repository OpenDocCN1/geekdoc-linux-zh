  md: '# 15.2.4. You are Done


    Congratulations! You already have the most important tool in trying to recover
    a damaged system: a boot disk. Now, on some important considerations on the second
    most important tool: backups.


    # 15.3. Backup


    # 15.3.1. Why Backup?


    Backing up your system is the only means of being able to repair it if it suffers
    severe damage, if you accidentally delete some important system files, or if someone
    breaks into your system and intentionally deletes some files. You should also
    backup your daily use data (compressed audio, images, office documents, e-mails,
    address book, etc.) to be safe.


    You should make your backups using an appropriate medium and keep them in a safe
    place. Such a place should be outside the place you work in, if possible. You
    can even have two backups, one in place, and one outside. Generally speaking,
    you should make sure that you will be able to restore those backups if you want
    all this to be really useful.


    # 15.3.2. Preparing Your System


    You probably have everything you need already installed in your system. You should
    also keep a boot disk near at hand (you made one, didn''t you?). Actually, you
    can make backups using only tar and, optionally, a compression tool such as gzip
    or bzip2. See an example in Backup Example Using TAR, page 166.


    As an alternative, you can use specialized backup programs, such as Taper, Time
    Navigator, Arkeia, etc.


    # 15.3.3. What to Backup?


    Well, this might be the most difficult question every system administrator asks
    himself when the time to backup comes. The answer to it depends on things such
    as: are you just backing up your personal data, your configuration files, or your
    whole system? How much time and/or space is it going to take? Will you be restoring
    your backup on the same machine/OS version, or on a different one?'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Chapter 15. Troubleshooting


    Since this is a troubleshooting guide, we will try to focus on doing a backup
    that will allow us to quickly restore our system to the state it was before that
    terrible thing that rendered it unusable. Of course, we will need to make a backup
    of your personal data if you don''t want to lose it, but... that is another story.


    As a rule of thumb, you will need to backup the following directories: /etc/home,
    /root and /var. If you do a complete backup of these directories, you will have
    saved not only your configurations, but your data as well (in case you are wondering
    where your data is, it is in the /home/your_user_name/directory). Please bear
    in mind that this can take a long time to complete, but it is the safest bet.


    A more sophisticated scheme would be to backup only the configuration files that
    have changed, leaving alone the ones that have not changed. This will take more
    "planning" time, but will lead to quicker backups (and quicker restores, too)
    and to backups that are "easier" to port from one machine/OS version to another.


    Next, you will be presented with a list of the files you should pay the most attention
    to. Note that these lists are not exhaustive at all, especially if you have made
    lots of changes to your system!


    /etc/lilo.conf


    +   Holds LILO''s boot loader configuration. If you use grub instead of LILO,
    the files to backup are the ones in the directory /boot/grub.


    /etc/fstab


    +   Holds the disks partition table configuration and the associated mount points.


    /etc/modules.conf


    +   Holds the modules to load and their parameters according to your system''s
    hardware. This might not be useful if restoring backups on a very different machine,
    but it might have some hints anyway.


    /etc/isapnp.conf


    +   Holds ISAPnP''s settings if you use this to configure your ISA Plug & Play
    hardware.


    +   With kernel 2.4.x you might not need this file anymore, plug''n''play hardware
    is configured using the DevFS file system.


    +   If you have made lots of changes, you probably won''t need these lists anyway.'
