    capacities) has greatly leveled the differences between them. However JFS is currently
    the one showing best performances.


    Each system offers advantages and disadvantages. In fact, it all depends on how
    you use your machine. A simple desktop machine will be happy with Ext2FS. For
    a server, a journalized filesystem Ext3FS is preferred. ReiserFS, perhaps because
    of its genesis, is more suited to a database server. JFS is itself preferred in
    cases were filesystem throughput is the main issue.


