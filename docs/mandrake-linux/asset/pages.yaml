  md: '# Chapter 9. The /proc Filesystem


    /proc filesystem is specific to GNU/Linux. It is a virtual filesystem, and as
    it takes no room on your disk. It is a very convenient way to obtain information
    on the system, all the most files in this directory are human readable (well,
    with a little help). Many programs actually gather information from files /proc,
    format it in their own and display it. This is the case for all programs that
    display information about processes, and we have already seen a few of them (top,
    ps and friends). /proc is also a good source of information about your hardware,
    and similarly, quite a few programs are just interfaces to the information contained
    in /proc.


    There is a special subdirectory, /proc/sys. It allows for changing kernel parameters
    in real time or displaying them.


    # 9.1. Information About Processes


    If you list the contents of the /proc directory, you will see many directories
    the name of which is a number. These are the directories holding information on
    all processes running on the system:


    ```

    $ ls -d /proc/[0-9]*

    /proc/ /proc/302/ /proc/451/ /proc/496/ /proc/556/ /proc/633/

    /proc/127/ /proc/317/ /proc/452/ /proc/497/ /proc/557/ /proc/718/

    /proc/239/ /proc/453/ /proc/5/ / /proc/558/ /proc/755/

    /proc/250/ /proc/385/ /proc/454/ /proc/501/ /proc/559/ /proc/760/

    /proc/260/ /proc/404/ /proc/504/ /proc/565/ /proc/761/

    /proc/275/ /proc/402/ /proc/463/ /proc/505/ /proc/569/ /proc/769/

    /proc/290/ /proc/433/ /proc/509/ /proc/594/ /proc/774/

    /proc/3/ /proc/450/ /proc/491/ /proc/554/ /proc/595/

    ```


    Note that as a user, you (logically) only display information related to your
    own processes, but not the ones of others users. So, let''s be root and see what
    information is available from 127:


    ```

    $ su

    Password:

    $ cd /proc/127

    $ ls -l

    total 0

    -r-r--x root root 0 Dec 14 19:53 cmdline

    lrwxr-xr-x root root 0 Dec 14 19:53 cwd -> /

    -r-r--r root root 0 Dec 14 19:53 environ

    lrwxr-xr-x root root 0 Dec 14 19:53 exe -> /usr/sbin/apmd*

    d-xr-xr-x root root 0 Dec 14 19:53 fd/

    -r-r--r root root 0 Dec 14 19:53 maps

    -rw-r--r root root 0 Dec 14 19:53 mem

    lrwxr-xr-x root root 0 Dec 14 19:53 root -> /

    -r-r--r root root 0 Dec 14 19:53 stat

    -r-r--r root root 0 Dec 14 19:53 statm

    ```'
