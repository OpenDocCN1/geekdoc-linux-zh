  md: '# Chapter 6. File Tree Organization


    +   - /home: contains all the personal directories of the system''s users. This
    directory may or not be shareable (some large networks make it shareable by NFS),
    Variable, shareable;


    +   - /lib: this directory contains libraries which are essential to the system;
    also hosts kernel modules in /lib/modules. All libraries required by the binaries
    in /bin and /sbin directories must be located here, with the lld.so linker. Static,
    unshareable;


    +   - /mnt: directory containing the mount points for temporary file systems.
    Variable, unshareable;


    +   - /opt: holds packages not required for system operation. It is recommended
    to place static files (binaries, libraries, manual pages, etc.) for such packages
    in /opt/package_name and their specific configuration files in /etc/opt;


    +   - /root: home directory for root. Variable, unshareable;


    +   - /usr: see next section. Static, shareable;


    +   - /sbin: contains system binaries essential to the system start-up, operable
    only by root. A normal user can also run them but will not get very far. Static,
    unshareable;


    +   - /tmp: directory intended to contain temporary files which certain programs
    may create. Variable, unshareable;


    +   - /var: location for data which may be modified in real time by programs (i.e.:
    e-mail servers, audit programs, print servers, etc.). All of the /var directory
    is variable, but its different subdirectories may be shareable or unshareable.


    # 6.3. /usr: The Big One


    The usr directory is the main application-storage directory. All binary files
    in this directory must not be required for the system start-up or maintenance,
    since its hierarchy is often located on a separate filesystem. Given its often
    large size, /usr has its own hierarchy of subdirectories. We will mention just
    a few:


    +   - /usr/X11R6: the whole Window System hierarchy. All binaries required for
    the operation of X (including the X servers) and all necessary libraries must
    be located here. The /usr/X11R6/lib/X11 directory contains all aspects of X''s
    configuration which do not vary from one computer to another. Specific configurations
    for each computer go in /etc/X11;


    +   - /usr/bin: this holds the large majority of the system’s binaries. Any binary
    program which is not necessary to the maintenance of the system'
