    # 2.1.2. rm: Deleting Files or Directories


    The rm command (ReMove) replaces the DOS commands del and deletree, and adds more
    options. Its syntax is as follows:


    ```

    rm [options] <file|directory> [file|directory...]

    ```


    Options include:


    +   - -r, or -R: delete recursively. This option is mandatory for deleting a directory,
    empty or not. However, you can also use rmdir to delete empty directories.

    - -i: request confirmation before each deletion. Note that by default in Mandrake
    Linux, rm is an alias to rm -i, for safety reasons (similar aliases exist for
    cp and mv). If you want to remove them, you can edit your .bashrc and add this
    line: alias rm cp.

    - -f, the opposite of -i, forces deletion of the files or directories, even if
    the user has no write access to the files.


    Some examples:


    +   - rm -i images/*.jpg file1: deletes all files with names ending in .jpg in
    the images directory and deletes the file1 in the current directory, requesting
    confirmation for each file. Answer y to confirm deletion, n to cancel.

    - rm -Rf images/misc/ file*: deletes, without requesting confirmation, the whole
    directory misc/ in the images/ directory, together with all files in the current
    directory whose names begin with file.


    +   2. It is enough for the user to have write access to the directory to be able
    to delete files in it, even if he is not the owner of the files.'
