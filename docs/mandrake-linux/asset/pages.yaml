  md: '# Glossary


    Switching from one process to another requires that all the current process context
    be saved and restored when this process is elected again. This operation is called
    context switch, and on Intel, is 100 times per second; therefore it''s fast enough
    so that a user has the illusion that the operating system runs several applications
    at the same time. There are two types of multitasking: preemptive multitasking
    is where the operating system is responsible for taking away the CPU and pass
    it to another process; cooperative multitasking is where the process gives back
    the CPU. The first variant is, obviously, the better choice because no program
    can consume the entire CPU time and block other processes. GNU/Linux does preemptive
    multitasking. The policy to select which process should be run, depending on several
    parameters, is called scheduling.


