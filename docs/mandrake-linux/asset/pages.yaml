    directory, thus `..` for root points back to itself. The root directory is written
    as `/`.


    # root filesystem


    This is the top level filesystem. This is the filesystem where GNU/Linux mounts
    its root directory tree. It is necessary for the root filesystem to reside in
    a partition of its own, as it is the basis for the whole system. It holds the
    root directory.


    # route


    Is the path that your datagrams take through the network to reach their destination.
    Is the path between one machine and another in a network.


    # run level


    is a configuration of the system software that only allows certain processes to
    execute exist. Allowed processes are defined, for each runlevel, in the file `/etc/inittab`.
    There are eight defined runlevels: 0, 1, 2, 3, 4, 5, 6, S and switching among
    them can only be achieved by a privileged user by means of executing the commands
    init and telinit.


    # script


    shell scripts are sequences of commands to be executed as if they were entered
    in the console after the other. shell scripts are Unix (somewhat) equivalent of
    DOS batch files.


    # security levels


    Mandrake Linux''s unique feature that allows you to set different levels of restrictions
    according to how secure you want to make your system. There are 6 defined runlevels
    ranging from 0 to 5, where 5 is the tightest security. You can also define your
    own security level.


    # server


    program or computer that provides a feature or service and awaits the connections
    from clients to execute their orders or give them information they ask. In the
    case of peer to peer systems as slip or ppp the server is taken to be the end
    of the link that is called and the end calling is taken to be the client. It is
    one of the components of a client/server system.


    # shadow passwords


    a password management suite on Unix systems in which the file containing the encrypted
    passwords is not world-readable, whereas it is'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Glossary


    using the normal password system. It also offers other features such as password
    aging.


    # shell


    The shell is the basic interface to the operating system kernel and is what provides
    the command line where users enter commands to run programs and system commands.
    All shells provide a scripting language which can be used to automate tasks or
    simplify often-used complex tasks. These shell scripts are similar to batch files
    from the DOS operating system, but are much more powerful. Some example shells
    are bash, sh, and tsh.


    # single user


    is to describe a state of an operating system, or even an operating system itself,
    that only allows a single user to log into and use the system at any time.


    # site dependent


    means that the information used by programs like make and make to compile some
    source file depends on the site, the computer architecture, the computer’s installed
    libraries, and so on.


    # socket


    file type corresponding to any network connection.


    # soft links


    see “symbolic links”.


    # standard error


    the file descriptor number 2, opened by every process, used by convention to print
    error messages to the terminal screen by default. See Also: standard input, standard
    output.


    # standard input


    the file descriptor number 0, opened by every process, used by convention as the
    file descriptor from which the process receives data. See Also: standard error,
    standard output.


    # standard output


    the file descriptor number 1, opened by every process, used by convention as the
    file descriptor in which the process prints its output. See Also: standard error,
    standard input.


    # streamer


    is a device that takes “streams” (not interrupted or divided in shorter chunks)
    of characters as its input. A typical streamer is a tape drive.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Glossary


    Switches are used to change the behavior of programs, and are also called command-line
    options or arguments. To determine if a program has optional switches that can
    be used, read the man pages or try to pass the --help switch to the program (ie.
    program --help).


    # symbolic links


    special files, containing nothing but a string that makes reference to another
    file. Any access to them is the same as accessing the file whose name is the referenced
    string, which may or not exist, and the path to which can be given in a relative
    or an absolute way.


    # target


    is the object of compilation, i.e. the binary file to be generated by the compiler.


    # telnet


    creates a connection to a remote host and allows you to log into the machine,
    provided you have an account. Telnet is the most widely-used method of remote
    logins, however there are better and more secure alternatives, like ssh.


    # theme-able


    a graphical application is theme-able if it is able to change its appearance in
    real time. Many window managers are theme-able as well.


    # traverse


    for a directory on a Unix system, this means that the user is allowed to go through
    this directory, and possibly to directories under it. This requires that the user
    has the execute permission on this directory.


    # username


    is a name (or more generally a word) that identifies a user in a system. Each
    username is attached to a unique and single UID (user ID)

    See Also: login.


    # variables


    are strings that are used in Makefile files to be replaced by their value each
    time they appear. Usually they are set at the beginning of the Makefile. They
    are used to simplify Makefile and source files tree management.


    More generally, variables in programming, are words that refer to other entities
    (numbers, strings, tables, etc.) that are likely to vary while the program is
    executing.


    # verbose


    For commands, the verbose mode means that the command reports to standard (or
    possibly error) output all the actions it performs and the'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Glossary


    results of those actions. Sometimes, commands have a way to define the "verbosity
    level", which means that the amount of information that the command will report
    can be controlled.


    # virtual console


    is the name given to what was used to be called terminals. In GNU/Linux systems,
    you have what are called virtual consoles which enable you to use one screen or
    monitor for many independently running sessions. By default, you have six virtual
    consoles which can be reached by pressing ALT-F1 through ALT-F6. There is a seventh
    virtual console by default, ALT-F7, which will permit you to reach a running X
    Window System. In X, you can reach the text console by pressing CTRL-ALT-F1 through
    CTRL-ALT-F6.


    See Also: console.


    # virtual desktops


    In the X Window System, the window manager may provide you virtual desktops. This
    handy feature allows you to organize your windows, avoiding the problem of dozens
    of them stacked on top of each other. It works as if you had several screens.
    You can switch from one virtual desktop to another in a manner that depends on
    the window manager you''re using.


    See Also: window manager, desktop.


    # wildcard


    The ''*'' and ''?'' characters are used as wildcard characters and can represent
    anything. The ''*'' represents any number of characters, including no characters.
    The ''?'' represents exactly one character. Wildcards are often used in regular
    expressions.


    # window


    In networking, the window is the largest amount of data that the receiver end
    can accept at a given point in time.


    # window manager


    the program responsible for the "look and feel" of a graphical environment, dealing
    with window bars, frames, buttons, root menus, and some keyboard shortcuts. Without
    it, it would be hard or impossible to have virtual desktops, to resize windows
    on the fly, to move them around, ...'
  merge: -1
