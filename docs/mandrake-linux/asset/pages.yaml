    # 11.2.2. Advanced Configuration


    XPP allows you to finely tune your printouts. First, there are options on the
    main window that allow you to print multiple copies of the same file (Copies field)
    and to change the priority of your printing job. This latter is useful for very
    busy printers used by many users. If you urgently need a document to be printed,
