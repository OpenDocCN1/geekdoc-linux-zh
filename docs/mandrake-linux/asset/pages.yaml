    # 2.3. Shell Globbing Patterns


    You probably already use globbing characters without knowing it. When you specify
    a file in Windows or when you look for a file, you use * to match a random string.
    For example, *.txt matches all files names ending with .txt. We also used it heavily
    in the last section. But there is more to globbing than just *.


    When you type a command like ls *.txt and press Return, the task of finding which
    files match the *.txt pattern is not done by the ls command, but'
