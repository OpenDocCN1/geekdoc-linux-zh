  md: '# # Chapter 15. Troubleshooting


    # ## 15.1. Introduction


    This chapter will guide you through some troubleshooting basics, that is: what
    to do when everything goes wrong, better yet, what to do be prepared for when
    something goes wrong and how to fix it.


    How many times have you felt foolish for not having backed up that little configuration
    file you''ve just managed to break? How many times have you lost all of your program''s
    preferences after installing misbehaving software or even after accidentally deleting
    some configuration file? How many times has your computer sooner booting after
    bleeding edge kernel testing? I have, many times... actually more than I would
    like to admit :-)


    There are some people who recompile their kernel configuration every day of the
    week, every week of the month, every month of the year. You might not be one of
    them, but believe me, some day you will want or need to do that; let''s assume
    that these are not uncommon scenarios in every day GNU/Linux life. All of them
    can be managed without any hassle at all if you use a little common sense and
    follow some practices and guidelines we will introduce to you. These will help
    you when those times come.


    So, on, to the basic things you need to have ready...


    # ## 15.2. A Boot Disk


    The first thing you will need when your system cannot boot up, for any of the
    reasons mentioned before, will be a boot disk. You should have one already, created
    during the installation process. A boot disk will allow you to boot your system
    up and, in a matter of minutes, enable you to the undo the thing that has made
    your system unable to boot.


    > You can also use the Rescue Mode of Mandrake Linux''s installation CD-ROM to
    boot your machine and perform some maintenance tasks, but a boot disk might prove
    to be useful anyway (for example, if your machine does not support booting from
    the CD-ROM drive).


    You have two ways of creating a boot disk under Mandrake Linux, either by using
    the console, or a graphical one. To create a boot disk you will have to be'
