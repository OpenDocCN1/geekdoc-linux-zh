    look for executables when you type a command. Note that unlike DOS, by default,
    a shell will not look for commands in the current directory!

    3. USERNAME: this variable contains your login name.

    4. UID: this holds your user ID.


    +   5. PS1: this variable contains your prompt''s definition. It is often a combination
    of special sequences. You may read the bash(1) manual page for more information.


