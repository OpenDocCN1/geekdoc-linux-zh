  md: '# Chapter 2. Introduction To The Command Line


    Ctrl-c will terminate the process and take you back to the prompt. But we

    wait, do not do it! Read on.


    Suppose you want the command to run while doing something else. The so-

    lution is to put the process into background. To do this, type Ctrl+z

    sus the process:


    ```

    $ -R images/ /shared/ /dev/ 2>/dev/null

    # Type C-z here

    [1]+ Stopped cp -R images/ /shared/ /dev/ 2>/dev/null

    ```


    and there you are again at the prompt. The process is then on standby, waiting

    for to restart it (as shown by the Stopped keyword). That, of course, is

    what you want to do, but in the background. Type fg (for Background) to

    t desired result:


    ```

    $ bg

    [1]+ cp -R images/ /shared/ 2>/dev/null &

    ```


    The process will then start running again as a background task, as indicated

    by the & (ampersand) sign at the end of the command. You will then be back at
    the

    prom able to continue working. A process which runs as a background

    task, or in the background, is called a job.


    Of course, you can start processes directly as background tasks by adding

    an & character at the end of the command. For example, you can start the

    command to copy the directory in the background by writing:


    ```

    cp -R images/ /shared/ 2>/dev/null &

    ```


    If you want, you can also restore this process to the foreground and wait for
    it

    to finish by typing fg (Foreground). To put it into the background again, type

    t sequence Ctrl+z, bg.


    You can start several jobs this way: each command will be given a job

    number. The shell command lists all the jobs associated with the cu-

    rent shell. The job preced by a + sign indicates the last process begin a

    background task. To restore a particular job to the foreground, you can then

    type fg <n> where <n> is the job number, i.e. fg 5.


    Note that you can also suspend or start full-screen applications this way, such

    as less or a text editor like Vi, and restore them to the foreground when you

    want.'
  merge: -1
