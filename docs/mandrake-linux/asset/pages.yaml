  md: '# Chapter 13. Building and installing free software


    # 13.2. Decompression


    # 13.2.1. tar.gz archive


    The standard compression format under UNIX systems is the gzip format, developed
    by the GNU project, and considered as one of the best general compression tools.


    gzip is often associated with a utility named tar and a survivor of antediluvian
    times, when computerists stored their data on tapes. Nowadays, floppy disks and
    CD-ROM have replaced tapes, but tar is still being used to create archives. All
    the files in a directory can be appended in a single file for instance. This file
    can then be easily compressed with gzip.


    This is the reason why free software is available as tar archives, compressed
    with gzip. So, their extensions are .tar.gz (or also .tgz to shorten).


    # 13.2.2. The use of GNU Tar


    To compress this archive, gzip and then tar can be used. The GNU version of tar
    (gtar) allows us to use gzip "on-the-fly", and to decompress an archive without
    noticing each step (and without the need for the extra disk space).


    The use of tar follows this format:


    ```

    tar <file options> <tar.gz file> [files]

    ```


    The <files> option is not required. If it is omitted, processing will be made
    on the whole archive. This argument does not need to be specified to extract the
    contents of a .tar.gz archive.


    For instance:


    ```

    $ tar rvzf guile-1.3.tar.gz

    -rw-rw-r-- 442/1002 10555 1998-10-20 07:31 guile-1.3/Makefile.in

    -rw-rw-r-- 442/1002 6668 1998-10-20 06:59 guile-1.3/README

    -rw-rw-r-- 442/1002 2283 1998-02-01 02:55 guile-1.3/AUTHORS

    -rw-rw-r-- 442/1002 17989 1998-05-27 00:36 guile-1.3/COPYING

    -rw-rw-r-- 442/1002 28545 1998-10-20 07:05 guile-1.3/ChangeLog

    -rw-rw-r-- 442/1002 9364 1997-10-25 08:34 guile-1.3/INSTALL

    -rw-rw-r-- 442/1002 1223 1998-10-20 06:34 guile-1.3/Makefile.am

    -rw-rw-r-- 442/1002 98432 1998-10-20 07:30 guile-1.3/NEWS

    -rw-rw-r-- 442/1002 1388 1998-10-20 06:19 guile-1.3/THANKS

    -rw-rw-r-- 442/1002 1151 1998-10-26 21:45 guile-1.3/TODO

    ```


    +   2. More and more a new program, called bzip2, more efficient on text files
    (and requiring more computing power) is being used. See the later section bzip2,
    page 125 deals specifically with this program.'
  merge: -1
