- img_proc: true
  md: '# Chapter 4. Command Line Utilities


    +   - -type <type>: search for a type of file; <type> can be one of: f (regular
    file), d (directory), l (symbolic link), s (socket), b (block mode file), c (character
    mode file) or p (named pipe)


    +   - -name <pattern>: finds whose name match the given <pattern>. With this option,
    <pattern> is treated as a shell globbing pattern (see chapter Shell Globbing Patterns,
    page 18);


    +   - -iname <pattern>: like -name, but ignore case;

    - -atime <n> or -amin <n>: finds files which have last been accessed <n> days
    ago (-atime) or <n> minutes ago (-amin). You can also specify +-n or -<n>, in
    which case the search will be done for files accessed respectively most or at
    least <n> days/minutes ago;


    +   - -newer <file>: finds files which have been accessed more recently than <file>;


    +   - -ctime <n>, -cmin <n>, -cewer <file>: same as -atime, -amin and -answer,
    but applies to the last time when the contents of the file have been modified;


    +   - -regex <pattern>: same as -name, but pattern is treated as a regular expression;


    +   - -iregex <pattern>: same as -regex, but ignore.


    There are other tests, to find(1) for more details. To combine tests, you can
    use one of:


    +   - <c1>-a <c2>: true if both <c1> and <c2> are true; -a is implicit, therefore
    you can type <c1> <c2> <c3> ... if you want all tests <c1>, <c2>, ... to match;

    - <c1>-o <c2>: true if either <c1> or <c2> are true, or both. Note that -o has
    a lower precedence than -a, if you want to say, to match files which match criteria
    <c1> or <c2> and match criterion <c3>, you will have to use parentheses and write
    ( <c1>-o <c2> ) -a <c3>. You must escape (activate) parentheses, otherwise they
    will be interpreted by the shell!

    - -not <c1>: inverts test <c1>, therefore -not <c1> is true if <c1> is false.


    Finally, you can specify an action for each file found. The most frequently used
    are:


    +   - -print: just prints the name of each file on standard output. This is the
    default action;

    - -ls: prints on the standard output the equivalent of ls -ilds for each file
    found;

    - -exec <command>: execute command <command> on each file found. The command line
    <command> must end with a ;, which you must escape so'
