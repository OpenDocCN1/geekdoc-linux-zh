    # 15.5. My System Freezes at Boot Time


    It could happen that your system hangs during boot up. If so, don''t panic, just
    keeping reading.


    ![](img/a40daaaf9b45f9af35d348684ba96cad_188_0.png)


    The next sections are not introduced in any particular order.


    # 15.5.1. System Hanging During Boot


    If your system hangs during Rebuilding RPM dependencies, just press CTRL+C. This
    will allow the system to skip this step and continue to boot. Once booted, execute
    rpm --rebuilddb as if the hang was at the Rebuilding RPM database phase. If the
    hang was at the Finding module dependencies phase you have likely been through
    a kernel upgrade, but have not done it properly. Check if the files in /boot and
    the /lib/modules directory match the current kernel version (i.e., have the current
    version number attached). If they do not match, please read "Compiling And Installing
    New Kernels", page 143, to find out how to fix this.


    If the process hangs at RAMDISK: Compressed image found at block 0 you have messed
    up the initrd image. Either try to boot another lilo.conf entry or boot an emergency
    system and remove or change the initrd=/etc/lilo.conf


    # 15.5.2. File System Check on Boot Fails


    If, for any reason, you have not shut down your box properly, the system will
    run a routine file system check during the next boot. It may sometimes fail to
    do this on its own and will drop you to a console. Execute efsck -py [device]
    where [device] is the name of the partition on which the automatic check has failed.
    The -p switch tells efsck to do all the necessary repairs without asking, -y assumes
    the answer to all questions. When the check and repair phase is over, press CTRL+D
    to leave the emergency console. The system will reboot.


    169'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'If you get this error regularly, there might be bad blocks on your disk. Execute
    e2fsck -c [device] to find out. This command will automatically mark any bad blocks
    and thus prevent the file system from storing data in these blocks. e2fsck checks
    the file system automatically only if it has not mounted properly during the previous
    system shutdown; or if the maximal mount count has been reached. To force a check,
    use the -f option.


    The check for bad blocks on a disk should only be done on unmounted file systems,
    and can take a tremendous amount of time to complete. It may be necessary to do
    it, but be warned that you''ll have enough time to drink several coffees.


    ![](img/a40daaaf9b45f9af35d348684ba96cad_189_0.png)


    # 15.6. Bootloader Reinstall


    Sometimes you make a mistake and wipe your disk''s MBR (Master Boot Record), or
    some misbehaving program does it, or if you dual boot with Windows and catch a
    virus that does it. So, you say, I won''t be able to boot your system anymore,
    right? Wrong! There are many ways to recover the boot loader.


    # 15.6.1. Using a Boot Disk


    This one is not a surprise for anybody: To recover your boot loader you will need
    a boot disk. Without a boot disk of some kind you might be completely lost. You
    have made a boot disk, haven''t you?


    Well, just put the diskette in the floppy drive and reboot your computer. What
    you do next varies according to whether you use LILO or grub. No matter which
    boot loader you use, all the commands you have to execute will need to be run
    as root.


    # 15.6.1. With LILO


    If you use LILO, you just need to issue the following at the command prompt: /sbin/lilo.
    This will reinstall LILO in your disk''s boot sector and will fix the problem.


    +   - Unless you make a backup of your MBR, more on that later.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# 15.6.1.2. With GRUB


    If you use grub things are a little bit different than when using LILO... don''t
    be afraid, we are here to help.


    > The following example will assume that you are trying to install grub in the
    MBR of your first IDE drive, and that the file stage1 is in the directory /boot/grub/.


    You can also try to use grub-install /dev/hda to install grub on your first hard
    drive''s MBR, but the method described above is the preferred one.


    # 15.6.1.3. You Are Done!


    Well, that is all there is to know about reinstalling your boot loader.


    # 15.6.2. Repairing a Damaged Super-Block


    > The information below only applies to ext2 and ext3 file systems. If you have
    another file system, please check the documentation on it for information about
    this.


    The super-block is the first block of each ext2fs partition. It contains important
    data about the file system, like size, free space, etc (It is similar to the method
    used by FAT partitions). A partition with a damaged super-block cannot be mounted.
    Fortunately, ext2fs keeps several super-block backup copies scattered over the
    partition.


    Boot your system with the boot disk created earlier (You have created one, right?).
    The backup copies are usually located at the beginning of each 8 KB (8192 bytes)
    block. So, the next backup copy is in byte number 8193. To restore the super-block
    from this copy, execute e2fsck -b 8193 /dev/hda4; change hda4 accordingly to reflect
    the name of your damaged partition. If that block also happens to be damaged,
    try the next one by byte number 16385, and so on until you find a suitable one.
    Reboot your system to activate the changes.'
  merge: -1
