  md: '# Chapter 8. The Linux Filesystem


    # 8.6. Symbolic Links, Limitation of “Hard” Links


    Here we have to face a very common misconception, even among UNIX users, which
    is mainly due to the fact that we have seen them so far (wrongly called “hard”
    links) are only associated with regular files (and we have seen that it is not
    the case – all the that even symbolic links are “linked”). But this requires that
    we first explain what symbolic links (“soft” links, or even more often “symlinks”)
    are).


    Symbolic links are files of a particular type whose contents is an arbitrary string,
    which may or not point to an existing file. When you mention a symbolic link on
    the command line or in a program, in fact, you access the file it points to, if
    it exists.


    ```

    $ echo Hello myfile

    $ ln -s myfile myfilink

    $ ls -il

    total 4

    169 -rw-rw--  1 queen queen      Dec 10 21:30 myfile

    416 lrwxrwxrwx  1 queen queen      Dec 10 21:30 myfilink

    -> myfile

    $ cat myfile

    Hello

    $ cat myfilink

    Hello

    ```


    You can see that the file type for myfilink is ''l'', for symbolic Link. The access
    rights for a symbolic link are not significant: they will always be rw. You also
    see that it is a different file from myfile, as its inode number is different.
    But it refers to it symbolically, therefore when you type cat myfilink, the symbolic
    link contains an arbitrary string, we can do in the following:


    ```

    $ ls -il "I’m no existing file" anotherlink

    418 lrwxrwxrwx  1 queen queen      Dec 10 21:43 anotherlink

    -> I’m no existing file

    $ cat anotherlink

    cat: No such file or directory

    $

    ```


    But symbolic links exist because they overcome several limitations encountered
    by normal (“hard”) links):


    +   - You cannot create a link to an inode in a directory which is on a different
    filesystem than the said inode. The reason is simple: the link counter is stored
    in the inode itself, and inodes can not be shared among filesystems. Symlinks
    allow this:


    76'
