  md: '• following this is the name of the file owner and the name of the other group;


    • finally, the size of the file (in bytes) and its last modification time are
    displayed, followed lastly by the name of the file or directory itself.


    Let us now look closely at the permissions associated to each of these files:
    first of all, we must strip the first character representing the type, and for
    the file a_file, we get the following rights: rw-r----. The interpretation of
    these permissions is as follows:


    +   • the first three characters (rw-) are the file owner’s rights, in this case
    queen. Therefore, queen has the right to read the file (r), to modify its (w)
