  md: '# # Chapter 12. msec – Mandrake Security Tools


    # ## 12.1. Introducing msec


    While GNU/Linux is used for a very wide range of applications, from basic office
    work to high-availability servers, the need arose for different security levels.
    It is obvious that constraints inherent to highly secured servers do not match
    the needs of a secretary. On the other hand, a big public server is more sensitive
    to malicious people than my isolated GNU/Linux box.

    It is with that aim that the MSEC package was designed. It is made of two parts:


    +   - scripts that modify the whole system to lead to it one of the six security
    levels provided with MSEC. These levels range from very minimal security offering
    ease of use, to extreme configurations suitable for very sensitive applications
    and managed by experts;

    - cron jobs, which will periodically check the integrity of the system according
    to security-level configuration, and will possibly detect and warn you of a possible
    intrusion into the system, or of a security leak.


    Note that the user may also customize his security level, adjusting parameters
    to his owns needs.


    # ## 12.2. Setting Your Security Level


    MSEC is a base RPM. That means that it gets installed during the installation
    of your Mandrake Linux system.


    The installation created a msec directory into the /etc/security directory, containing
    all that is needed to secure your system.


    There is a graphical interface to MSEC, called draksec. It is available through
    Control Center and allows to change your system’s security level. See the chapter
    Setting Your Security Level in the User Guide.


    A command-line tool also exists. It allows better tuning. Log in as root and type
    msec <x>, <x> being the security level you want.


    Note that whatever level you choose, your configuration will be stored in /var/lib/msec/security.conf.'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Chapter 12. msec – Mandrake Security Tools


    # 12.2.1. Level 0


    This level is to be used with care. It makes your system easier to use, but extremely
    insecure. In particular, you should not use this security level if you answer
    "yes" to any of the following questions:


    +   - is my computer connected to the Internet?

    - is my computer connected to other computers through a network?

    - will this computer be used by someone other than me?

    - are there any private files on my computer that I don''t want others to access?

    - for lack of knowing GNU/Linux well enough, is it possible that I may harm the
    system?


    As you can see, this security level should not be set by default, because huge
    data problems may occur.


    # 12.2.2. Level 1


    The main security improvement compared with level 0 is that the access to any
    user''s data is granted via *username* and *password*. Therefore, it may be used
    by various people and it is less sensitive to mistakes. However, it should not
    be used on a computer which is connected to a modem or LAN (Local Area Network).


    # 12.2.3. Level 2


    Few improvements for this security level; it mainly provides additional security
    warnings and checks. It is more secure for multi-user use.


    # 12.2.4. Level 3


    This is the standard security level, recommended for a computer which will be
    used to connect to the Internet as a guest. Most of the security checks are periodically
    run, especially one (security check) which looks for open ports on the system.
    However, these open ports are kept open and access to them is granted to everyone.


    From the user''s point of view, the system is now a little more closed, so he
    will need basic knowledge of the *GNU/Linux* system to achieve special operations.
    The security offered here is comparable with the one of a standard *Red Hat* or
    any previous *Mandrake Linux* distribution.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# 12.2.5. Level 4


    With this security level, it is possible to use the system as a serve. The security
    is now high enough and accept connections from many clients. By default, only
    connections from the computer itself will be granted. However, advanced services
    have been disabled, and the system administrator will have to activate the desired
    ones by hand in configuration files. He will also have to define for whom the
    access will be granted.


    Security checks will warn the system administrator of possible security holes
    or intrusions.


    # 12.2.6. Level 5


    We build on Level 4 features and now the system is entirely closed. Security features
    are at their maximum. The system administrator must activate ports and grant connections
    to give other computers access to services offered by this machine.


    # 12.3. Security Levels Features


    What follows is the description of the different security features brought by
    each level. These features are of two types: system hardening which changes the
    system, and checks run periodically which do not.


    # 12.3.1. Hardening System


    The hardening system changes the permissions, owners, groups of the files and
    directories on the system according to the security level.


    It also changes the configuration files to respect the security level defined
    and re-launch the needed programs to take the changes into account. The hardening
    system type is run every hour. All the changes are logged to syslog.


    | Feature \ Level | 0 | 1 | 2 | 3 | 4 | 5 |

    | umask for users | 002 | 002 | 002 | 002 | 077 | 077 |

    | umask for root | 002 | 002 | 002 | 002 | | 077 |

    | access without password | yes | | | | | |

    | authorized to connect to server | all | local | local | none | none | none |'
