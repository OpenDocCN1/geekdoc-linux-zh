    The favorite tool of the free software community to compile sources is make. It
    has two advantages:


    +   - The developer saves time, because it allows him to efficiently manage the
    compilation of his project,

    - The end-user can compile and install the software in a few command lines, even
    if he has no preliminary knowledge of development.


    Actions that must be executed to obtain a compiled version of the sources are
    stored in a file named Makefile or GNUmakefile. Actually, when make is called,
    it reads this file – if it exists – in the current directory. If not, the file
    may be specified by using the option -f with make.


    # 13.4.2. Rules


