  md: '# 8.5. "Special" Files: Character Mode and Block Mode Files


    As already stated, such files are either files created by the system or peripherals
    on your machine. We also mentioned that the contents of block mode character files
    were buffered, whereas block mode files were not. In order to illustrate this,
    insert a floppy disk into the drive and type the following command twice:


    ```

    $ dd if=/dev/fd0 of=/dev/null

    ```


    You can observe the following: while, the first time the command was launched,
    the whole contents of the floppy were read, the second time, there was no access
    to the floppy drive at all. This is simply because the contents of the floppy
    were buffered when you first launched the command – and you did not change the
    floppy beforehand.


    But now, if you want to write a file (yes it will work):


    ```

    $ cat /a/big/printable/file/somewhere >/dev/lp0

    ```


    the command will take as much time, whether you launch it once, twice or fifty
    times. This is because /dev/lp0 is a character mode file, and its contents are
    not buffered.


    The fact that block mode files are buffered a nice side effect: not only are reads
    buffered, but writes are buffered too. This allows for writes on disks to be asynchronous:
    when you write a file on disk, the write operation itself is not immediate. It
    will only occur when GNU/Linux decides for it.


    Finally, each special file has a major and minor number. For a ls -1 output, they
    appear in place of the size, as the size for such files is irrelevant:


    ```

    ls -l /dev/hda /dev/lp0

    br-rw---- 1 root disk 3, 0 May 5 1998 /dev/hda

    cr-rw---- 1 root daemon 6, 0 May 5 1998 /dev/lp0

    ```


    Here, the major and minor of /dev/hda are respectively 3 and 0, whereas for /dev/lp0,
    they are respectively 6 and 0. Note that these numbers are unique for each file
    category, which means that there can be a character mode file with major 3 and
    minor 0 (this file actually exists: /dev/ttyp0), and similarly, there can be a
    block mode file with major 6 and minor 0. These numbers exist for a simple reason:
    it allows GNU/Linux to associate the correct operations to these files (that is,
    to the peripherals these files refer to): you do not handle a floppy drive the
    same way as, say, a SCSI drive.'
