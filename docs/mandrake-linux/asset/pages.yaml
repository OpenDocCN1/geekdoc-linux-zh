    +   • the next three characters (r--) apply to any user who is not queen but is
    a member of the users group : such a user will be able to read the file (r), but
    neither write execute it (-);


    +   • the last three characters (---) apply to any user who is not queen and is
    not a member of the users group: such a user will simply have no rights on the
    file at all.


    For the directory a_directory, the rights are rwxr-xr--, and as such:


