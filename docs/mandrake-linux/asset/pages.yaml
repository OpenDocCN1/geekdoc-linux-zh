  md: '# Chapter 2. Introduction to the Command Line


    In the chapter "Basic UNIX System Concepts", page 1, you were shown how to launch
    a shell. In this chapter, we will show you how to work with it.

    The shell’s main asset is the number of existing utilities: there are thousands
    of them, and each one is devoted to a particular task. We will only look at a
    (very) small number of them here. Of UNIX’s greatest assets is the ability to
    combine these utilities, as we will see later.


    # 2.1. File-Handling Utilities


    In this context, file handling means copying, moving and deleting files. Later,
    we will look at ways of changing their attributes (owner, permissions).


    # 2.1.1. mkdir, touch: Creating Empty Directories And Files


    mkdir (MaKeDIReory) is used to create directories. Its syntax is simple:

    mkdir [options] <directory> [directory ...]

    Only one option is worth noting: the -p option. It does two things:


    +   1. it will create parent directories if they did not exist. Without this option,
    mkdir would just fail, complaining that the said parent directories not exist;

    2. it will return silently if the directory you want to create already exists.
    Similarly, if you did not specify the -p option, mkdir will send back an error
    message, complaining that the directory already exists.

    Here are some examples:


    +   * mkdir foo creates a directory foo in current directory;

    * mkdir -p images/misc docs creates the misc directory in the images directory.
    First, it creates the latter if it does not exist (-p); it also creates a directory
    named docs in the current directory.


    Initially, the touch command is not intended for creating files but for updating
    access and modification times. However, touch will create the files mentioned
    as empty files if they did not exist before. The syntax is:


    +   1. In UNIX, there are three distinct timestamps for each file: the last file
    access date (atime), i.e. the last date when the file was opened for read or write;
    the last date when the inode attributes were modified (mtime); and finally, the
    last date when the contents of the file were modified (ctime).'
