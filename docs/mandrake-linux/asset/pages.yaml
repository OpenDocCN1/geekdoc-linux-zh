- img_proc: true
  md: '# Chapter 11. Printing


    # 11.1.3. A Note About Security


    By default whenever you configure a printer on your machine, it becomes available
    for other people on your local area network. If you prefer that people shouldn''t
    be able to print on your printer, you need to manually edit the cups configuration
    file: /etc/cups/cupsd.conf. You simply need to replace the line


    ```

    #BrowseInterval 30

    ```


    by


    ```

    BrowseInterval 0

    ```


    Also, this file contains a lot of options that allow you to finely tune your printer
    server. In particular, you can restrict access from specific machines or sub-networks.
    For more information consult the many comments within the configuration file or
    consult the online help from the web interface.


    > Whenever you make changes to the configuration file, do not forget to restart
    the cups daemon server by issuing:


    ```

    service cups restart

    ```


    as root.


    # 11.1.4. Managing Print Jobs


    This feature is mostly useful for very busy printers, but you may need occasionally
    to cancel a wrong printout of 10,000 pages for example. When you send a job to
    a printer you can consult your jobs, and possibly all jobs from all users if you
    are the administrator for the machine hosting that printer, by displaying the
    page specific to the printer (figure 11-8).'
  merge: -1
  pgno: 117
- img_proc: true
  md: '![](img/a40daaaf9b45f9af35d348684ba96cad_118_0.png)


    You can then perform two different actions on a specific job:


    +   - **Hold Job:** To put the job on a waiting list, it''ll be printed only when
    you come back to this job and press the green **Release Job** button.

    - **Cancel Job:** to definitely cancel this job (take it out of the queue).


    If you wish to make your printer temporarily unavailable (to change the toner
    for example) you can simply click on the **Reject Jobs** button. Then when the
    printer is ready to accept jobs again, click on the **Accept Jobs** button.


    > If you are interested in job handling capabilities, please refer to the Printing
    Manager of the KDE Control Center.


