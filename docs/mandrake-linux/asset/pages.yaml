- img_proc: true
  md: '# Chapter 2. Introduction to The Command Line


    by the shell itself. This requires a little explanation about how a command line
    is interpreted by the shell. When you type:


    ```

    $ ls *.txt

    readme.txt recipes.txt

    ```


    the command line is first split into words (ls and *.txt in this example). When
    the shell sees a * in a word, it will interpret the whole word as a globbing pattern
    and replace it with the names of all matching files. Therefore, the command, just
    before the shell executes it, becomes ls readme.txt recipe.txt, which gives the
    expected result. Other characters make the shell react this way:


    +   * ?: matches one and only one character, regardless of what that character
    is;

    * [...]: matches any character in the brackets. Characters can be referred to
    as a range of characters (i.e. 1-9) or discrete values, or other. Example: [a-zBE5-7]
    will match all characters between an and z, a B, an E, a 6 or a 7;

    * [!...]: matches any character not found in the brackets. [!a-z], for example,
    will match any character which is not a lowercase letter;

    * {c1,c2}: matches c1 or c2, where c1 and c2 are also globbing patterns, which
    means you can write {[0-9]*, [acr]} for example.


    Here are some patterns and their meaning:


    +   * /etc/*conf: all the files in the /etc directory with names ending in conf.
    It can match /etc/inetconf, /etc/linuxconf, and also /etc/conf if such a file
    exists. Remember that * can match an empty string.

    * image/(cars,space [0-9])*.jpg: all file names ending with .jpg in directories
    image/cars, image/space0, (...), image/space9 if those directories exist.

    * /usr/share/doc/*README: all files named README in all of /usr/share/doc/s immediate
    subdirectories. This will make /usr/share/doc/mandrake/README match, for example,
    but not /usr/share/doc/myprog/doc/README.

    * *[!a-z]: all files with names that do not end with a lowercase letter in the
    current directory.


    3. Beware! While this is true under GNU/Linux, this may not be true under UNIX-like
    operating systems. This depends on the collating order. On some systems, [a-z]
    will match a, A, B, (...), z. And we do not even mention the fact that some languages
    have accentuated characters...'
