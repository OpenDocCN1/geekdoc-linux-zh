  md: '# Chapter 7. Filesystems and Mount Points


    +   * mount the “new” /usr: mount /usr/.


    And that''s it. Now, go back to multiuser mode (telinit 3 or telinit 5), and if
    there is no further administrative work left, you should now log off the root
    account.


    # 7.5. A Note About The Supermount Feature


    Newer kernels as those shipped with Mandrake Linux bring an interesting feature
    for users frequently using floppy and CD disks. Installed (or not) depending on
    the chosen security level, it automatically mounts and unmounts media as they
    are inserted or removed. This is quite handy as there is no need to run mount
    or ummount each time.'
