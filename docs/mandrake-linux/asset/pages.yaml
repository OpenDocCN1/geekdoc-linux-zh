  md: '# Chapter 6. File Tree Organization


    +   * passwd and shadow: these two are text files which contain all system users
    and their encrypted passwords. shadow is only there if you use shadow passwords,
    which is the default installation option;


    +   * inittab: this is the configuration file for init, which plays a fundamental
    role when starting up the system, as we will see later on;


    +   * services: this file contains a list of existing network services;


    +   * profile: this is the shell configuration file, although certain shells use
    other files. For example, bash uses bashrc;


    +   * crontab: cron''s configuration file, the program responsible for periodic
    execution of commands.


    Also, certain subdirectories exist for programs which require a large number of
