  md: '# 15.4. Restore


    The restoration of a backup depends on which program, media, and schedule you
    used to make it. We will not cover all the restore cases here, but only mention
    that you have to make sure you restore the files and/or directories to the same
    places they were in when you made the backup in order to recover your settings,
    and data files.


    # 15.4.1. Restore Example Using TAR


    Now, we will see a little script to restore the backup we made with tar using
    the script introduced earlier in Backup Example Using TAR, page 166


    > You need write permissions on the files and directories you are going to restore,
    otherwise the restore operation will fail.


    ```

    #!/bin/bash


    # Extract a compressed backup of all the directories specified putting the

    # backed files into their original places


    BACKUP_SOURCE_DIR=$HOME

    RESTORE_FILENAME=$1


    # Uncomment the following line if you are restoring GZipped backups

    #tar xvzf $BACKUP_SOURCE_DIR/$RESTORE_FILENAME


    # Restore a GZipped backup here...

    tar xvzf $BACKUP_SOURCE_DIR/$RESTORE_FILENAME

    ```


    As you can see, this script is simple enough. All we have to do is to pass it
    the filename of the backup as a parameter (the file-name, not the full path),
    and it restores the backed up files into their original locations.


    # 15.4.2. Making a Recovery CD-ROM


    There is way to be prepared in case of "total disaster", and that is making a
    full backup of your system. Programs such as mkCDrec can be very useful to get
    you up and running in a matter of minutes.


    If you are the proud owner of a Mandrake Linux - PowerPack Deluxe Edition, you
    already have this tool in the "contribs" CD-ROM. Otherwise, you can find it, together
    with its documentation on the mkCDrec web site (http://mkcdrec.ota.be).'
