  md: '# Chapter 13. Building and installing free software


    # 13.2.4. Just do it!


    13.2.4.1. The easiest way


    Now that you are ready to decompress the archive, do not forget to do it as administrator
    (root). You will need to do things that a ordinary user is not allowed to do,
    and even if you can perform some of them as a regular user, it is simpler to be
    root the whole time.


    The first step is to be in the /usr/local/src directory and copy the archive there.
    You should then always be able to find the archive if you lose the installed software.
    If you do not have a lot of space on your disk, save the archive on a floppy disk
    after having installed the software. You can also delete it but be sure that you
    can find it on the Web whenever you need it.


    Normally, decompressing a tar archive should create a new directory (you can check
    beforehand thanks to the t option). Then in that directory, you are now ready
    to proceed.


    # 13.2.4.2. The safest way


    UNIX systems (of which GNU/Linux and FreeBSD are examples) can be secure systems.
    That means normal users cannot perform operations that may endanger the system
    (format a disk, for instance) or alter other users'' files. It also immunizes
    the system against viruses.


    On the other hand, root can do everything - even running a malicious program.
    Having the source code available allows you to examine it for malicious code (viruses
    or Trojans). It is better to be cautious in this regard.


    The idea is to create a user dedicated to administration (free or admin example)
    by using the adduser command. This user must be allowed to write in the following
    directories: /usr/local/src, /usr/local/bin and /usr/local/lib, as well as the
    sub-tree of /usr/share/man (he may also be able to copy files elsewhere). I recommend
    that you make this user owner of the necessary directories or create a group for
    him and make the directories writable for the group.


    Once these precautions are taken, you can follow the instructions in the section
    The easiest way, page 126.


    +   3. A proverb from the BSD world says: "Never trust a package you don''t have
    the sources for."'
