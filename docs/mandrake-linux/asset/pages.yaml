    ![](img/a40daaaf9b45f9af35d348684ba96cad_13_0.png)


    This icon highlights a note. Generally, it is a remark in the current context,
    giving additional information.


    This icon represents a tip. It can be a general advice on how to perform a specific
    action, or a nice feature that can make your life easier.


    ![](img/a40daaaf9b45f9af35d348684ba96cad_13_1.png)


    Be very careful when you see this icon. It always means that very important information
    about a specific subject will be dealt with.


    # 6.2. General Conventions


    # 6.2.1. Commands Synopsis


    The example below shows the symbols you will find when the writer describes the
    arguments of a command:


    ```

    command < literal argument>

    [--option=<arg1,arg2,arg3>] [optional arg. ...]

    ```


    These conventions are standard and you may find them at other places such as the
    man pages.


    The "<" (less than) and \>" (greater than) symbols denote a mandatory argument
    not to be copied verbatim, but to be replaced according to your needs. For example,
    `<filename>` refers to the actual name of a file. If this name is foo.txt, you
    should type foo.txt and not <filename.txt> or <filename>.


    The square brackets [ ] denote optional arguments, which you may may not include
    in the command.


    The ellipsis "..." mean an arbitrary number of items can be included.


    The curly brackets "{}" contain the arguments authorized at this specific place.
    One of them is to be placed here.'
