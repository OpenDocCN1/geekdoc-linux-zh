    is the equivalent of grub''s hd(0,4), but nothing prevents the kernel from being
    on a different partition than the one containing the root filesystem;

    - the failsafe section is very similar to the previous one, except that we will
    pass an argument to the kernel (failsafe) which tells it to enter "single" or
    "rescue" mode;

    - the windows section tells grub to simply load the first partition''s boot sector,
    which probably contains a Windows boot sector;

    - the floppy section boots your system from the floppy disk in the first drive,
    whatever the system installed on. It can be a Windows bootdisk, or even a GNU/Linux
    kernel on a floppy;


