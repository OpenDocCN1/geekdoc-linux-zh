    # 15.3.6. When to Backup Up?


    There are many policies for backup schedules. Here we will introduce you to a
    few. Please bear in mind that these are not mandatory, not the best, nor the only
    ones. These are just guidelines you may want to follow in rolling out your backup
    schedule.

    There are many backup strategies out there, they depend on the media you use,
    on how often your data changes, and how critical that data is to you or your organization.
    For example, one strategy states that you should make a full backup each weekend,
    and an incremental (changed stuff only) backup every day; then a full backup every
    month and store that in at least two places. This strategy might prove useful
    for an enterprise, but not for a personal computer. For your personal backups
    you can think of something like this: make a weekly backup of your files on your
    disk drive and each month transfer these backups to CD-R/DVD+RW or tape.


