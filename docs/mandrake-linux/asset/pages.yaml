    # 15.3.4. Where to Backup?


    The other big question to answer. This depends on how much do you want to backup,
    how fast do you want to make your backups, how easy is the access to the backup
    media, and a large list of etceras.


    Generally speaking, you need media that is at least large as the amount of information
    you want to backup, and fast enough so the whole process will not take forever
    to complete.


    # 15.3.5. Backup Media


    Next, we will provide you with a brief description of available backup media options.
    These vary in capacity, reliability, and speed. They are not given in any particular
