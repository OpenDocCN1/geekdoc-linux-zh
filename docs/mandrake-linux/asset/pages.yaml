    # 1.4.6. Useful Keyboard Shortcuts


    Many keystroke are available and their main advantage is that they save you a
    lot of typing time. This section assumes you are using the default shell provided
    with Mandrake Linux, bash, but these keystrokes should work with other shells.


    First: the arrow keys bash maintains a history of previous commands which you
    can view with the up and down arrow keys. You can scroll up to a maximum number
    of lines defined in the HISTORY environment variable. Moreover, the history is
    persistent from one session to another, so you will not lose the commands you
    typed in previous session.


    The left and right arrow keys move the cursor left and right on the current line,
    but you can edit your commands this way. But there is more editing: Ctrl+A and
    Ctrl+E, for example, will bring you respectively to the beginning and the end
    of the current line. The Backspace and Del keys work as expected. An equivalent
    to Backspace is Ctrl+H and an equivalent to Del is Ctrl+D. Ctrl+K will delete
    all the line from the position of the cursor to the end of line, and Ctrl+W will
    delete the word before the cursor.


    Typing Ctrl+D on a blank line will close the current session, which is much shorter
    than having to type exit. Ctrl+C will interrupt the currently running command,
    except if you were in the process of editing your command line, in which case
    it will cancel the editing and get you back to the prompt. Ctrl+L clears the screen.


    Finally, there is case of Ctrl+S and Ctrl+Q: these keystrokes respectively suspend
    and restore the flow of characters on a terminal. They are very seldom used, but
    it may happen that you type Ctrl+S by mistake (all, S and D are very close to
    each other on a keyboard...). So, if you strike keys but do not see any character
    appearing on the Terminal, try Ctrl+Q first and beware: all characters typed between
    the unwanted Ctrl+S and Ctrl+Q will be printed to the screen all at once.'
