- img_proc: true
  md: '# Glossary


    # APM


    Advanced Power Management. A feature used by some BIOS is in order to make the
    machine enter a standby state after a given period of inactivity. On laptops,
    APM is also responsible for reporting the battery status and, if it is supported,
    the estimated remaining battery life.


    # ASCII


    American Standard Code for Information Interchange. The standard code used for
    storing characters, including control characters, on a computer. Many 8-bit codes
    (such as ISO 8859-1, the Linux default character set) contain ASCII as its lower
    half. See Also: ISO 8859.


    # BSD


    Berkeley Software Distribution. A Unix variant developed at the Berkeley University
    computing department. This version has always been considered more advanced technically
    than the others, and has brought many innovations to the computing world in general
    and to Unix in particular.


    # CHAP


    Challenge-Handshake Authentication Protocol: protocol used by ISPs to authenticate
    their clients. In this scheme, a value is sent to the client (the machine which
    connects), the client calculates a hash from this value it sends to the server,
    and the server compares the hash with the one it has calculated. It is different
    from PAP in that it re-authenticates on a periodic basis after the initial authentication.
    See Also: PAP.


    # CIFS


    Common Internet FileSystem The predecessor of the SMB filesystem, used on DOS
    systems.


    # DHCP


    Dynamic Host Configuration Protocol. A protocol designed for machines on a local
    network to dynamically get an IP address from a DHCP server.


    # DMA


    Direct Memory Access. A facility used on the PC architecture which allows for
    a peripheral to read or write from main memory without the help of the CPU. PCI
    peripherals use bus mastering and do not need DMA.


    # DNS


    Domain Name System. The distributed name/address mechanism used in the Internet.
    This mechanism allows you to map a domain name to an IP address, which is what
    lets you look up a site by domain name without'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Glossary


    knowing the IP address of the site. DNS also allows reverse lookup, that

    is you can get a machine''s IP address from its name.


    # DPMS


    Display Power Management System. Protocol used by all modern monitors

    in to manage power saving features. Monitors supporting these

    features are commonly called "green monitors".


    # ELF


    Executable and Linking Format. This is the binary format used by most

    GNU/Linux distributions nowadays.


    # ext2


    short for the "Extended 2 filesystem". This is GNU/Linux '' native filesys-

    d and has all characteristics of any Unix filesystem: support for special

    files (character devices, symbolic links...), file permissions and owner-

    ship, and so on.


    # FAQ


    Frequently Asked Questions. A document containing a series of ques-

    tions/answers about a specific topic. Historically, FAQ appeared in

    newsgroups, but this sort of document now appears on various web

    sites, and even commercial products have their FAQ. Generally, they are

    very good sources of information.


    # FAT


    File Allocation Table. Filesystem used by DOS and Windows.


    # FDDI


    Fiber Distributed Digital Interface. A high-speed network physical layer,

    uses optical fiber for communication. Only on big networks,

    mainly because of its price.


    # FHS


    Filesystem Hierarchy Standard. A document containing guidelines for a co-

    herent file tree organization of Unix systems. Mandrake Linux complies

    with this standard in most aspects.


    # FIFO


    First In, First Out. A data structure or hardware buffer from which items

    are taken out in the de order they were put in. Unix pipes are the most

    common examples of FIFO s.


    # FTP


    File Transfer Protocol. This is the standard Internet protocol used to trans-

    files from one machine to another.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# GFDL


    The GNU Free Documentation License. It is the license that applies to all Mandrake
    Linux documentation.


    # GIF


    Graphics Interchange Format. An image file format, widely used on the web. GIF
    images may be compressed or animated. Due to copyright problems it is a bad idea
    to use them, replace them as possible by the far advanced PNG format instead.


    # GNU


    GNU''s Not Unix. The GNU project was initiated by Richard Stallman at the beginning
    of the 80s, and aimed at developing a free operating system (“free” as in “free
    speech”). Currently, all tools are there, except... kernel. The GNU project kernel,
    is not rock solid yet. Linux borrows, among others, two things from GNU: its C
    compiler, gcc, and its license, the GPL.


    See Also: GPL.


    # GPL


    General Public License. The license of the GNU/Linux kernel, it goes the opposite
    way of all proprietary licenses that it gives no restriction to copying, modifying
    and redistributing the software, as long as the source code is made available.
    The only restriction, if one can call it, is that the persons to which you redistribute
    it must also benefit from the same rights.


    # GUI


    Graphical User Interface. Interface to a computer consisting of windows with menus,
    buttons, icons and so on. The vast majority prefer a GUI over a CLI (Command Line
    Interface) for ease of use, even though the latter is more versatile.


    # HTML


    HyperText Markup Language. The language used to create web documents.


    # HTTP


    HyperText Transfer Protocol. The protocol used to connect to websites and retrieve
    HTML documents or files.


    # IDE


    Integrated Drive Electronics. The most widely used bus on today''s PCs for hard
    disks. An IDE bus can contain up to two devices, and the speed of the bus is limited
    by the device on the bus which has the slower command queue (and not the slower
    transfer rate!).


    See Also: ATAPI.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Glossary


    # IP masquerading


    is you use a firewall to hide your computer''s true IP address from the outside.
    Typically any outside network connections you make beyond the firewall will inherit
    the firewall''s IP address. This is useful in situations where you may have a
    fast PSTN connection with only one IP address but wish to use more than one computer
    that have internal network IP addresses assigned.


    # IRC


    Internet Relay Chat. One of the few Internet standards for live speech. It allows
    channel creation, private talks, and also file exchange. It is also designed to
    be able to make servers connect to each other, which is why several IRC networks
    exist today: Undernet, DALNet, EFnet to name a few.


    # IRC channels


    are the “places” inside IRC servers where you can chat with other people. Channels
    are created in IRC servers and users join those channels so they can communicate
    with each other. Messages written on an channel are only visible to people connected
    to that channel. Two or more users can also create a “private” channel so they
    don''t get disturbed by other users. Channel names begin with a #.


    # ISA


    Industry Standard Architecture. The very bus used on PCs, it is slowly being abandoned
    in favor of the PCI bus. Some hardware manufacturers still use it, though. It
    is still very common that SCSI cards supplied by scanners, CD writers, ... are
    ISA too.


    # ISDN


    Integrated Services Digital Network. A set of communication standards for allowing
    a single line or optical fiber to carry voice, digital network services and video.
    It has been designed in order to eventually replace the current phone system,
    known as PSTN (Public Switched Telephone Network) and POTS (Plain Ole Telephone
    Service). Technically ISDN is a circuit switched data network.


    # ISO


    International Standards Organization. A group of companies, consultants, universities
    and other sources which enumerates standards in various topics, including computing,
    the papers describing standards are numbered. The standard number iso9660, for
    example, describes the filesystem used on CD-ROM s.


    # ISP


    Internet Service Provider. A company which sells Internet access to its customers,
    whether the access is over telephone lines or dedicated lines.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Glossary


    # JPEG


    joint Photographic Experts Group. Another very common image file format. JPEG
    is mostly suited for compressing real-world scenes, and does not work well on
    non-realistic images.


    # LAN


    Local Area Network. Generic name given to a network of machines connected to the
    same physical wire.


    # LDP


    Linux Documentation Project. A nonprofit organization which maintains GNU/Linux
    documentation. Its mostly known documents are HOWTOs, but it also maintains FAQs,
    and even a few books.


    # MBR


    Master Boot Record. Name given to the first sector of a bootable hard drive. The
    MBR contains the code used to load the operating system into memory or a bootloader
    (such as LILO), and the partition table of that hard drive.


    # MIME


    Multipurpose Internet Mail Extensions. A string of the type/subtype describing
    the contents of a file attached in an e-mail. This allows MIME-aware mail clients
    to define actions depending on the type of the file.


    # MPEG


    Moving Pictures Experts Group. An ISO committee which generates standards for
    video and audio compression. MPEG is also the name of their algorithms. Unfortunately,
    the license for this format is very restrictive, and as a consequence there are
    still no Open Source MPEG players...


    # NCP


    NetWare Core Protocol. A protocol defined by Novell to access NetWare file and
    print services.


    # NFS


    FileSystem. A network filesystem created by Sun Microsystems in order to share
    files across a network in a transparent way.


    # NIC


    Network Interface Controller. An adapter installed in a computer which provides
    a physical connection to a network, such as an Ethernet card.


    # NIS


    Network Information System. NIS was also known as “Yellow Pages”, but British
    Telecom holds a copyright on this name. NIS is a protocol signed by Sun Microsystems
    in order to share common information'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Glossary


    across a NIS domain, which can gather a whole LAN, part of this LAN or several
    LANs. It can export password databases, service databases, groups information
    and more.


    # PAP


    Password Authentication Protocol. A protocol used by many ISP to authenticate
    their clients. In this scheme, the client (you) sends an identifier/password pair
    to the server, which is not encrypted.


    See Also: CHAP.


    # PCI


    Peripheral Components Interconnect. A bus created by Intel and which is today
    the standard bus for PC architectures, but other architectures use it too. It
    is the successor of ISA, and it offers numerous services: device identification,
    configuration information, IRQ sharing, bus mastering, and more.


    # PCMCIA


    Personal Computer Memory International Association. More and more commonly called
    "PC Card" for simplicity reasons, which is the standard for external cards attached
    to a laptop: modems, hard disks, memory cards, Ethernet cards, and more. The acronym
    is sometimes expanded to People Memorize Computer Industry Acronyms...


    # PNG


    Portable Network Graphics. Image format created mainly for web use, it has been
    designed as a patent-free replacement for GIF and also has some additional features.


    # PnP


    Plug''NPlay. First an add-on for ISA in order to add configuration information
    for devices, it has become a more widespread term which groups all devices to
    report their configuration parameters. As such, all PCI devices are Plug''NPlay.


    # POP


    Post Office Protocol. The common protocol used for retrieving mail from an ISP.


    # PPP


    Point to Point Protocol. This is the protocol used to send data over lines. It
    is commonly used to send IP packets to the Internet, but it can also be used with
    other protocols such as Novell''s IPX protocol.


    # RAID


    Redundant Array of Independent Disks. A project initiated at the computing science
    department of Berkeley University, in which the storage of data is'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Glossary


    spread along an array of disks using different schemes. At first, this was implemented
    using floppy drives, which is why the acronym originally stood for Redundant Array
    of Inexpensive Disks.


    # RAM


    Random Access Memory. Term used to identify a computer''s main memory. The "Random"
    here means that any part of the memory can be directly accessed...


    # RFC


    Request For Comments. RFCs are the official Internet standard documents, published
    by the IETF (Internet Engineering Task Force). They describe all protocols, their
    usage, their requirements and so on. When you want to learn how a protocol works,
    pick up the corresponding RFC.


    # RPM


    Redhat Package Manager. A packaging format developed by Red Hat in order to create
    software packages, it is used in many GNU/Linux distributions, including Mandrake
    Linux.


    # SCSI


    Small Computers System Interface. A bus with a high throughput designed to allow
    several types of peripherals. Unlike IDE, a SCSI bus is not limited by the speed
    at which the peripherals accept commands. Only high-end machines integrate a SCSI
    bus directly on the motherboard, PC add-on cards.


    # SMB


    Server Message Block. Protocol used by Windows machines (9x or NT) for file and
    printer sharing across a network. See Also: CIFS.


    # SMTP


    Simple Mail Transfer Protocol. This is the common protocol for transferring email.
    Mail Transfer Agents such as sendmail or postfix use SMTP. They are sometimes
    called SMTP servers.


    # SVGA


    Super Video Graphics Array. The video display standard for VESA for the PC architecture.
    The resolution is 800x600 x 16 colors.


    # TCP


    Transmission Control Protocol. This is the most common reliable protocol that
    uses IP to transfer network packets. TCP adds the necessary checks on top of IP
    to make sure that packets are delivered. Unlike UDP, TCP works in connected mode,
    which means that two machines must establish a connection before exchanging data.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Glossary


    # URL


    Uniform Resource Locator. A string with a special format used to identify a resource
    on the Internet in a unique way. The resource can be a file, a server or other
    item. The syntax for a URL is `protocol://server.name[:port]/path/to/resource`.


    When only a machine name is given and the protocol is http://, it defaults to
    retrieving the file index.html on the server.


    # VESA


    Video Electronics Standards Association. An industry standards association aimed
    at the PC architecture. It is the author of the SVGA standard, for example.


    # WAN


