  md: '# Chapter 14. Compiling And Installing New Kernels


    Along with filesystem mounting and building from sources, compiling the kernel
    is undoubtedly the subject which causes the most problems for beginners. Compiling
    a new kernel is not generally necessary, since the kernel installed by Mandrake
    Linux contains support for a significant number of devices (in fact, more devices
    than you will ever see or think of), as well as a set of trusted patches and on...


    It may be that you want to do it, for no other reason than to see “what it does”.
    Apart from making your PC and your coffee machine work a bit harder than usual,
    not a lot. The reasons for why you should want to compile your own kernel range
    from deactivating an option to rebuild a new experimental kernel. Anyway, the
    aim of this chapter is to ensure that your coffee machine still works after compilation.


    There are other valid reasons for recompiling the kernel. For example, you have
    read that the kernel you are using has a security bug, which is fixed in a more
    recent version, or a new kernel includes support for a device you need. Of course,
    in these cases, you have the choice of waiting for binary upgrades, or updating
    the kernel sources and recompiling the new kernel yourself makes for a faster
    solution.


    Whatever you do, stock up with coffee.


    # 14.1. Where to Find Kernel Sources


    You can basically get the sources from two places:


    +   1. Official Mandrake Linux Kernel. In the SRPMS directory of any of the Cooker
    mirrors (http://www.MandrakeLinux.com/en/cookerdevel-php3), you will find the
    following packages:


    kernel-2.4.??.mdk-?.mdk.rpm


    The kernel sources for compiling the kernel used in the distribution. It is highly
    modified for additional functionalities.


    kernel-linux-2.4-??.?.mdk.src.rpm


    The stock kernel as published by the maintainer of GNU/Linux kernel. If you choose
    this option (recommended), just download the source RPM, install it (as root)
    and jump to Configuring The Kernel, page 145.


    +   2. The Linux Kernel Repository. The main kernel source host site is ftp.kernel.org
    (http://ftp.kernel.org), but there are a large number of mirrors, all named ftp.xx.kernel.org
    (http://ftp.xx.kernel.org), where'
