  md: '# Chapter 15. Troubleshooting


    Please bear in mind that floppy disks are not too reliable.


    # LS120 Floppy Disk


    Its capacity is 120 MB. Identical times physical dimensions than floppy disks
    but with almost ten times the capacity. Not so cheap. Needs a special floppy disk
    drive but this drive can also read/write standard floppy disks. Might be a good
    floppy replacement but it speed lags behind that of ZIP drives. Read/Write. Expected
    media life is more or less the same than that of ZIP drives.


    # ZIP Disk


    Its capacity goes up to 250 MB. Although not as thin as floppy disks, they are
    easy to carry around, too, and are more fit for today''s needs. Good balance of
    features, although it may be a little expensive. Read/Write. Expected media life
    is 10 years for 100 MB units, maybe more for 250 MB units.


    # CD-R


    Its capacity goes up to 700 MB these days, although the standard is 650 MB. Very
    cheap and reliable media. Today many argue that its capacity is not enough, but,
    hey, 650 MB sounds fine to me. Its strongest feature is that almost every computer
    on earth has a CD-ROM drive, so they can read almost everywhere. Write only once.
    Read as many as you want (well, actually, as you can...). Expected media life
    is 20 years, maybe more if they are stored in a safe place and read not too often.


    # CD-RW


    Same considerations as for CD-R, but it can be formatted and re-written as many
    as 1000 times. In all in, cheap and reliable media. Expected media life is 15
    years, maybe more if they are stored in a safe place and read not so often.


    # DVD recordable/rewritable


    This is one of the newest additions to the available storage media. Its capacity
    is 4.7 GB for single sided recordable DVD discs. Drives are a little bit expensive
    but that is more or less compensated by the fact of being able to store 4.7 GB
    on a single disk. Expected media life is 15 years, maybe more if they are stored
    in a safe place and read not so often.'
