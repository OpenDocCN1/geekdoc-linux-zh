    # 2.2.2. chmod Changing Permissions on Files And Directories


    The chmod (Change MODe) command has a very distinct syntax. The general syntax
    is:


    ```

    chmod [options] <change mode> <file|directory> [file|directory...]

    ```


    what distinguishes it is the different forms that the mode change can take. It
    can be specified in two ways:


    +   1. in octal. The owner user permissions then correspond to figures with the
    form <xxx>, <x> corresponds to the permission: 4 for read permission, 2 for write
    permission and 1 for execute permission. Similarly, the owner group permissions
    take the form <<x> and permissions for “others” take <x>. Then all you need to
    do is add together the assigned permissions to get the right mode. Thus, the permissions
    rwxrxr-- correspond to 400+200+100 (owner permissions, rwx) +40+10 (group permissions,
    rx) +4 (others permissions, r--) = 754; in this, the way, the permissions are
    expressed in absolute terms. This means that previous permissions are unconditionally
    replaced;


