  md: '# Chapter 12. msec – Mandrake Security Tools


    # 12.3.1.9. sulogin in Runlevel


    The sulogin is used to protect access to a single user’s initlevel (you have to
    enter the root password to have access).


    # 12.3.1.10. Forbid User List in The Display Managers


    Forbid the display of the list of users on the system in KDM and GDM.


    # 12.3.1.11. Ignore ICMP Echo


    Don’t answer to ping requests.


    # 12.3.1.12. Ignore Bogus ICMP Error Message


    Don’t handle bogus ICMP error message.


    # 12.3.1.13. Direct Root Login


    Allow direct root login without using the su program.


    # 12.3.1.14. Enable libsafe


    Enable libsafe protection (only activated if the libsafe package is installed).


    # 12.3.1.15. Forbid at crontab For The Users


    Users cannot use the at and crontab programs. However, they can be used by the
    root account. If you want to authorize only some users, add them in /etc/at.allow
    and /etc/cron.allow respectively.


    # 12.3.1.16. Password Aging


    The passwords expire after a fixed amount of days; the users need to change them
    before the expiration date if they don’t want to see their accounts deactivated.


    # 12.3.1.17. Forbid autologin


    The autologin program is forbidden.'
