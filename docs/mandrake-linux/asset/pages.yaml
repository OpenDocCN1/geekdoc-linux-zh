  md: '# Chapter 7. Filesystems and Mount Points


    pe, mount will try and guess which filesystem is hosted by the partition reading
    the superblock. It rarely fails at doing so.


    The -o option is used to specify one or more mounting options. These options depend
    on the filesystem used. Refer to the mount(8) man for more details.


    Now that you mounted your new partition, you need to copy the entire /usr directory
    into it:


    ```

    $ (cd /usr && tar cf - .) | (cd /mnt && tar xpvf -)

    ```


    Now that the files are copied, we can unmount our partition. To do this, use the
    unmount command. The syntax is simple:


    ```

    umount <mount point|device>

    ```


    So, to unmount our new partition, we can type:


    ```

    $ umount /mnt

    ```


    or else:


    ```

    $ umount /dev/hdb1

    ```


    Since this partition is going to “become” our /usr directory, we need to tell
    this to the system. To do this, we edit:


    # 7.4. The /etc/fstab File


    The /etc/fstab file makes it possible to automate the mounting of certain filesystems,
    especially at system start-up. It contains a series of lines describing the filesystems,
    their mount points and other options. Here is an example of an /etc/fstab file:


    ```

    /dev/hda1      ext2        defaults      1 1

    /dev/hda5     home        ext2        defaults      1 2

    /dev/hda6     swap        swap        defaults      0 0

    /dev/fd0       /floppy auto  sync,noauto,nosuid,nodev,unhide 0 0

    /dev/cdrom    /mnt/cdrom auto  user,noauto,nosuid,exec,nodev,ro 0 0

    none           proc        defaults      0 0

    none           /dev/pts    devpts        mode=0622     0 0

    ```


    A line, in order:


    +   - the device hosting the filesystem;'
  merge: -1
