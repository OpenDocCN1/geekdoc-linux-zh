  md: 'zcat uncompresses the patch, and the l transfers the uncompressed content to
    the patch command, which applies it. The -p0 switch tells the command to use the
    entire file name found within the patch file.(A series of -- converts to /s. The
    /s denote how many directories down from the current directory to install a file.
    A -p0 indicates the file location should be read as it stands in the patch file).
    If the patch is not compressed, use the following command:


    ```

    patch -p0 < patchXX

    ```


    Information about the kernel patching will appear on the screen, and any data
    applied will be shown in the directory with a .rej extension.

    A commonly reported patch problem occurs from changes made to the config.in of
    the patch file. To correct this problem, open the file and check for any obvious
    irregularities. Another common rejection occurs when the patch is applied out
    of order. To remove a patch, use the patch command on the original file including
    the -R switch.


    ```

    patch -R patchXX

    ```


    # Other Means of Updating/Patching the Kernel


    Programs such as CVS and RPM aid in keeping track of software installed on a system,
    including patches. These packages provide a record of patches made to the kernel.
    For more information, consult the man pages for CVS and RPM.


    # Recompile the Kernel


    After the patch is applied to the kernel, the following steps must be taken. Enter
    the kernel configuration using make menuconfig (or, depending on the user''s preferences,
    make xconfig or make config). Once the configuration program starts, select the
    added features.


    Depending on the patch, the added features may be included with the kernel build
    or loaded as modules. If the function is included with the kernel build (part
    of the kernel), the overall size of the kernel will increase. If the kernel needs
    to be relatively small, the function should be added as a module. Modules allow
    for a function to be loaded as needed, while those built in the kernel are always
    present. Save the changes, and at the prompt execute the following command:


    ```

    make depbzimage modules_install

    ```


    When the kernel finishes, the new kernel is copied to or linked with the appropriate
    file in the /boot directory. If the kernel is not in the /boot directory, make
    sure the appropriate file is referenced.. To complete the process, run lilo to
    load the new kernel, reboot, and select the new kernel.


    Ensuring a bug-free kernel is only one step in protecting system security. Although
    no system is impenetrable, it is possible to make a highly secure system by combining
    a secure kernel with the use of encryption and other means of protecting data.'
