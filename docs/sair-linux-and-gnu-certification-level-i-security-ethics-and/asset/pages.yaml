    creates a new chain named test. For it to be useful, a rule in one of the three
    standard chains must point to it. For example


    ```

    $ ipchains -A input -i eth0 -j test

    ```


    would cause all packets coming in to the eth0 device to be checked against the
    rules on the test chain.


    Adding and deleting rules on user-defined chains is done in the same manner as
    the three standard chains. Instead of using input, output, or forward, the name
    of the user-defined chain is used.


    # Saving and Restoring Rules


    Unfortunately, ipchains is a kernel modification, changes made to it are not saved
    when a system is restarted. It would be tedious and almost useless if an administrator
    was required to remember every rule he or she had made to all of the chains and
    were required to re-enter them every time the system was started. Fortunately,
    there is a solution, the ipchains-save and ipchains-restore scripts.

    The command


    ```

    $ ipchains-save > [filename]

    ```


    will save the current ipchains rules to a file named [filename]. It can be restored
    later by using


    ```

    $ ipchains-restore < [filename]

    ```


    Both ipchains-save and ipchains-restore support the -v option, which causes the
    script to describe each rule as it is saved or restored. Using ipchains-restore
    also supports the -f option, which is used to automatically flush user-defined
    chains as they are restored. If the -f option is not specified, then the user
    will be prompted to flush or skip the user-defined chains as they are restored.'
