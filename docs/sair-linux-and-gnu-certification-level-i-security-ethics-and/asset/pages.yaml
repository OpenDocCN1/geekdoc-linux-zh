  pgno: 27
- img_proc: true
  md: '# Theory of Operation


    In 1982, a group of crackers calling themselves the 414s managed to obtain access
    to the Los Alamos National Laboratory computer system. LANL is known for its research
    in construction of atomic bombs. The 414s went on a nine-day hacking spree, breaking
    into military, government, and company computer systems, but they were eventually
    caught by the police.


    # Potential Security Problems


    As previously stated, the opportunity for Internet crime is growing along with
    the Internet. The need for security in the future will be even greater than it
    is now. Hope-fully by then, most security precautions will be second nature. For
    instance, in the future it is possible that e-mail and electronic transfers will
    be automatically done with encryption. It is also possible that access to computers
    and computer systems will require retina scans or voice recognition instead of
    passwords.


    However, even if such measures are taken, new ways will be developed around them.
    Retina patterns can be digitally reproduced, and encryption is quickly becoming
    easier to crack due to faster processors.


    There is no guaranteed way to know what the future security concerns will be,
    only the guarantee that security will always be an issue.


    # Security Vulnerabilities


    Internet security technology is constantly advancing. As individuals, businesses,
    and organizations start to conduct business online, the demand for security increases.
    However, each time a problem is fixed, it is possible that another vulnerability
    will be created. In the future, the Internet might be secure from such things
    as the Morris Worm and crackers like the 414s, but there is the potential for
    new problems and crackers to take their place.


    # The Ongoing Process of Security


    Security always be an ongoing process. Security is much like trying to patch holes
    in a dam. Although some of the water might occasionally leak through, it is important
    to continue patching holes; enough the holes fall apart.


    Always be on the watch for security holes. Monitoring sites like CERT/CC will
    help with this process. Join a list serve that deals with security problems, and
    keep up to date with technology, always continuing education.


    # Security Is Never 100 Percent


    There is no way to be completely secure. Skilled crackers can gain entrance to
    secure systems without leaving a trace. Government agencies like the CIA and the
    FBI have been breached, despite their almost unlimited resources and abilities.
    Lately, the CIA and the FBI have been considered off-limits for crackers, but
    this is mainly because of their ability to catch crackers, not because they can
    prevent them from breaking in.'
