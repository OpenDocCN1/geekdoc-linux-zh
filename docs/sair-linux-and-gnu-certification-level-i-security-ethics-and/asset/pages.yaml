  md: '# hosts.allow, hosts.deny,

    and hosts.lpd


    # Purpose


    This lab demonstrates how to edit the hosts.allow, hosts.deny, and hosts.lpd files
    in order to secure the system. These files can be edited to filter system connections
    to prevent unwanted users from entering the local network, or in the case of the
    hosts.lpd file, unauthorized use of the printer.


    # Theory


    The tcp_wrapper utility is used to improve system security by allowing certain
    hosts, either in a local or remote network, to access services running on the
    local host. At the same time, they can deny those same services to other hosts.
    This gives an administrator the ability to determine a system''s user capabilities.
    This ability is centered on tcpcpd, the tcp_wrapper daemon. tcpcpd uses three
    files, hosts.allow, hosts.deny, and hosts.print, to determine if an incoming request,
    such as a Telnet or FTP connection, should be allowed.


    The hosts.allow and hosts.deny files follow simple formatting guidelines. A comment
    is prefaced by the pound sign (#); all other lines are considered part of the
    file. The first part of any line is the service followed by a colon (:), then
    a list of hosts or'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# 334 Lab XXII


    domains. Additional security can be added by using the optional third field, which
    executes a command. Again, a colon is used to separate the domain or hostname
    from the new field, and the command is given in parentheses.


    The host.allow and host.deny files are checked by tcpd from the top to the bottom,
    and checking ends when a service/host match is found. For this reason, the order
    in which rules are placed in the file is very important. If ALL:ALL is the first
    line in the hosts.allow file, regardless of other items in that file or in the
    hosts.deny file, all hosts have access to all services. The first line is always
    checked, and everything following that matches it.


    The following examples show how the hosts.allow and hosts.deny files could be
    configured:


    ```

    /etc/hosts.allow:

    # hosts.allow This file describes the name of the hosts

    # which are allowed to use the local INET services, as decided

    # by the ''/usr/sbin/tcpd'' server.

    telnetd:.starwars.com EXCEPT web.starwars.com

    ftpd: 24.41.207.50

    ALL: LOCAL


    /etc/hosts.deny:

    # hosts.deny This file describes the name of the hosts

    # which are not allowed to use the local INET services, as

    # decided by the ''/usr/sbin/tcpd'' server.

    ftpd: ALL; /bin/mail -s WH root &

    ALL: ALL

    ```


    These files use the hosts_options control language extensions, which include keywords
    as ALL, EXCEPT, and LOCAL to make specifications easier. A dot (.) before a domain
    is read as all computers in that network, as the telnetd of the hosts.allow file.
    Single hosts can also be allowed or denied access by placing their exact address
    in either the hosts.allow or hosts.deny file with the appropriate service specification.
    The EXCEPT wildcard this example tells the system not to allow the web.starwars.com
    to access telnetd even though it is on the network that was granted blanket access.
    Using the ALL wildcard in the place of either the service name or the hostname
    includes all services or hosts, whichever is appropriate. LOCAL refers to all
    hosts on the local network.


    The most secure configuration for these files is to specify the hosts to be granted
    access to the services in the hosts.allow file, and deny access to all hosts on
    all services at the end of the hosts.deny file. This works well because tcpd will
    first read the hosts.allow file search for the host that is trying to connect.
    If the host is listed in this file, it is granted access; if not, the daemon proceeds
    to the hosts.deny file and checks for a match. It is never wise to allow access
    to all hosts on all servers. If this is done, the hosts.deny file will never be
    read, thereby opening the system to any wishing to connect.


    Remember that these files only control access through TCP, UDP or any other protocol.'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'hosts.allow, hosts.deny, hosts.lpd 335


    # /etc/hosts.lpd


    While the hosts.lpd file uses the same general format of the hosts.allow and hosts.deny
    files, there are certain syntax differences used to denote host permissions.


    +   + A plus sign (+) signifies that any host on the network can print using the
    local host.

    * HostName The HostName entry is the name of a remote host and signifies that
    HostName print using the local host.

    * -Hostname A -Hostname entry signifies the host is not allowed to print using
    the local host.

    * +NetGroup A +NetGroup entry allows all hosts in the given NIS netgroup, as specified
    in the /etc/netgroup file, to print using the local host.

    * -NetGroup A -NetGroup entry denies all hosts in the given netgroup the right
    to print using the local host.


