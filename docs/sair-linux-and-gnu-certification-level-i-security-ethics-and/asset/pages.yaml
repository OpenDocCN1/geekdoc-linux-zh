    ```

    root:0:

    ftp::200:

    ```


    Both of the preceding files should be owned by root, belong to the FTP group,
    and set to 444 for read-only access.


    # Incoming File Directory


    You may wish to have a writable directory in which users may leave files. While
    useful, any writable areas in your FTP file area represent the greatest security
    risk to your server. Intrud to your server could use this area to upload virus-infected
    files, illegally copied software, or other unwanted files. Another possibility
    is that an intruder could fill your incoming directory with junk files, thereby
    denying service to other users. Setting permissions properly can protect your
    users from unwanted files, but only careful monitoring of this directory will
    fully protect your server.


    To create a writable directory for your server, first make the directory either
    in ~/ftp or ~/ftp/pub directories. Then, set its owner to root and its group to
    your FTP group. Its mode should be set to 1733, which will allow users to create
    new files in the directory. They will not be able to overwrite files or see files
    that have already been deposited.


