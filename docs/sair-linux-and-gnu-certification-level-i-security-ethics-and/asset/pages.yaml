  md: 'kdestroy Command used by a Kerberos client to destroy active tickets.


    **Key** Character string used to encrypt or decrypt a piece of information.


    klist Used by a Kerberos client to list its active tickets.


    kpasswd Used to change a Kerberos password.


    ksu Kerberos version of the su program; used to change user IDs securely.


    **LIDS (Linux Intrusion Detection System)** A method of securing the Linux system;
    comprised of a kernel patch and an administration program.


    **Logcheck** A program that will scan system logs for certain phrases and/or keywords,
    and alert an administrator if a possible security violation has occurred.


    **Logic Bomb** A program that will execute malicious code when certain requirements,
    such as a date or time, are met.


    **MAC (Media Access Control Address)** Unique address attached to network interface
    cards, used to identify machines on that network.


    **MD5** One-way hash function created in 1991 by Ronald Rivest, to create 128-bit
    digital fingerprints of files. Apache uses MD5 as a secure way to password Web
    directories.


    **netstat** A program that provides information about the services running on
    a particular computer, which user is running the service, and which port it is
    on.


    **Network File System (NFS)** Protocol that allows computers to access files over
    a network as if they were on a local disk.


    **network policy** A program that defines the proper use of network resources,
    security measures taken to protect those resources, and infraction penalties.


    **nmap** A program that scans ports on computers to determine which ports are
    open and/or running services, as well as scanning networks to determine which
    hosts are running.


    **OPI** One-time-password system developed by the U.S. Navy Research Lab and freely
    distributed after S/Key ceased to be maintained; the system uses a passphrase
    chosen by the user to create one-passwords in the form of a six-word response,
    determined by a separate program.


    **PAM (Pluggable Authentication Modules)** A suite of libraries designed to provide
    a single interface with authentication methods for many programs can be configured.


    **PCPU** Process time used by the current process.


    **PGP (Pretty Good Privacy)** A public-key system used to secure the transmission
    of data and provide options to prove where the data originated.


    **Point-to-Point protocol (pppd)** A program that provides a method for transmitting
    datagrams over a serial point-to-point link.


    **POP (Post Office Protocol)** Designed to allow single-user computers to retrieve
    mail from a POP mail server.


    **principal** Kerberos account for users.


    **priority** The level of importance of the messages that are sent to syslog.


    **private key** A key that is known only to the site and is used by that site
    to decode messages directed to it.


    **proxy server** Used to conceal the location of internal data, and the identity
    of internal network hosts; takes Internet requests and decides if the requests
    are valid before passing them to the internal Internet server; also checks its
    cache before pass-'
