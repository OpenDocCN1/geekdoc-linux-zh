  md: 'If possible, the logging server should not serve any purpose other logging,
    and have as few accounts on it as possible. No one but the administrators should
    have accounts on the logging server, since gaining superuser access can be trivial
    if a local account on the server is compromised. Also, fewer daemons and open
    ports make it harder for attackers to gain unauthorized access remotely. It may
    be a good idea to have one logging server that is in a different physical location
    from the other machines on the network. This is especially true if the network
    being logged cannot be entirely trusted.


    When the -r option is used to enable remote logging, syslog will accept messages
    from anywhere. This opens the possibility of denial-of-service (DoS) attack being
    administered by sending large amounts of false log messages to the logging server.
    This can prevent valid messages from getting through, clutter log files with garbage,
    and can even stop messages from getting logged for long periods of time. The network
    administrator should limit the set of IP addresses that are able to connect to
    the logging server. In addition, access to the logging server from outside the
    local network should be blocked at the router level, if possible.


    # Sudo


    It is often difficult to know who can be trusted, which makes system security
    an important issue. Sudo offers a compromise between trust and security.


    # What Is Sudo?


    Sudo is an administrative tool that allows the system administrator to restrict
    the abilities of root access. A system administrator using Sudo can allow a user
    to temporarily run specific commands as root while logging the use of commands
    and options.


    Suppose a user is required to have root access to perform the chmod command on
    certain files. However this is the only instance in which the user will need root
    access. Instead of giving the root password to the user and allowing him or her
    complete freedom over the system, it is better to use Sudo and restrict his or
    her root access to the shown command only.


    Sudo can also be used for groups. An entire group of users is designated in the
    configuration file, allowing them all the option of running designated commands
    as root.


    Sudo is password protected, meaning that a user attempting to run Sudo must enter
    his password, but this option can be changed in the configuration file. After
    the user has verified himself with the correct password, he is allowed a five-minute
    break in which he can run the command without reentering the password. The five-minute
    time limit is reset every time the user runs sudo, but this can be changed in
    the configuration file.


    Sudo is not limited to root. A user can be granted permission to run certain commands
    as another user.


    The official Web site for Sudo can be found at www.courtesan.com/sudo.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Configuration File


    The configuration file for the Sudo program is called the sudoers file and must
    be written before Sudo function. It should be placed in the /etc/ directory. It
    is important to become familiar with the /etc/sudoers file, because Sudo offers
    a variety of options. Sudo comes with a text editor called visudo, which must
    be used to edit the sudoers file. Visudo checks for basic errors within the file
    and locks the file to prevent simultaneous, multiple configurations.


    The sudoers file is composed of two parts. The first part creates the structure
    and aliases for the Sudo program and the second part determines which users are
    allowed to access Sudo and to what extent. The first part of the file is set in
    the following format:


    ```

    alias NAME = item1, item2, item3,

    ```


    There are four types of aliases: User_Alias, Runas_Alias, Host_Alias, and Cmnd_Alias.

    The User_Alias specifications group different users together. This can be done
    with usernames, UID numbers prefixed with #, and GID numbers prefixed with %.
    For instance, if the user alias specification is entered then be considered part
    of the group SYSTEMADMIN. It is important that the group name is in all caps.


    ```

    User_Alias SYSTEMADMIN = justart, dlovery, sarlos

    ```


    The Runas_Alias specifications are used to group run as aliases.

    Runas_Alias OP = root, operator

    Runas_Alias DE = oracle


    The Host_Alias and Cmnd_Alias specifications are used to identify computers, networks,
    or networked hardware. IP addresses, hostnames, network groups, and network numbers
    can all be used.


    ```

    Host_Alias SPARC = starburst, dreamer, foxfire

    Host_Alias CUIETS = 192.168.1.30, 192.168.1.221

    Host_Alias SERVERS = mail, www, ns

    ```


    The Cmnd_Alias specifications identify specific commands to allow or ban. The
    command path names must be included in the specifications.


    ```

    Cmnd_Alias KILL = /usr/bin/kill

    Cmnd_Alias PRINTING = /usr/sbin/lpbnc

    ```


    The second part of the sudoers file is called the user specification section.
    It uses the preceding alias specifications to determine the specific commands
    and computers a user can access. The format for it is as follows:'
  merge: -1
