  md: '# LAB

    XV


    # super and sudo


    # Purpose


    This lab discusses the steps of configuring sudo and super to grant various levels
    of root access to the system.


    # Theory


    There are occasions when a regular user must have root access to perform his or
    her job; some users may need to run root commands repeatedly. This could easily
    become a problem, since giving root access to a great number of employees creates
    a potential for system damage. Several possible solutions, varying in degrees
    of security and the level of access granted, are available.


    super and sudo are commands that grant users access to specified root commands.
    super offers a few more options than sudo, such as regulating times the commands
    can be executed by various users and specifying the machine from which the user
    can issue commands.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# sudo


    sudo allows users to execute specific commands using their personal passwords.

    The /etc/sudoers file contains the parameters that specify which root commands

    individual users and groups have permission to use. This file must be edited with
    the

    isudo command, and can only be accessed by root. The following is a sample of
    the

    file, broken down into the following sections:


    ```

    # example /etc/sudoers

    # Host alias specification

    Host_Alias HUB=jersey:REMOTE=tommy,bilbo,galand

    Host_Alias SERVERS=jerry,tommy,bilbo,galand

    Host_Alias CUNETS=128.138.0/255.255.0

    Host_Alias CSNETS=128.138.243.0,128.138.204.0,\n128.138.205.192


    # User alias specification

    User_Alias FULLTIME=miller,dowdy,mike

    User_Alias PARTTIME=joola,mccreary,tor


    # Run alias specification

    Runas_Alias OP=root,operator


    # Command alias specification

    Cmnd_Alias LCPS=/usr/etc/lpc,/usr/ub/lprm

    Cmnd_Alias SHELLS=/bin/sh,/bin/bash,/bin/tcsh,/bin/ksh

    Cmnd_Alias SU=/bin/su

    Cmnd_Alias MISC=/bin/rm,/bin/cat/

    Cmnd_Alias SHUTDOWN=/etc/halt,/etc/shutdown


    # User specification

    FULLTIME=(ALL) NOPASSWD: ALL

    wheel ALL=ALL

    PARTTIME ALL=ALL,!SHELLS,!SU

    +interns +openlabs=ALL,SHUTDOWN:ALL,!LCPS

    britt REMOTE=/etc/shutdown -[hr] now,MISC

    jimbo CUNETS=/bin/su ?*/bin/su *root*

    ieusma SERVERS=SHUTDOWN,/etc/reboot:\

    HUB=ALL,!SHELLS

    jill jerry=/etc/shutdown -[hr] now,MISC

    markm HUB=ALL,!MISC,!etc/shutdown,!/etc/halt

    davehieb tommy=(OP) ALL:SERVERS=/etc/halt:\

    steve CSNETS=(operator) /usr/op_commands,/

    ```'
