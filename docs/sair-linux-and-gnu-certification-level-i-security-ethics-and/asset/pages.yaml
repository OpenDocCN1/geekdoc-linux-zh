  md: '# Using Crack to Check for Weak Passwords


    # Purpose


    The intent of this lab is to familiarize you with the Crack utility, which scans
    system password files for weak passwords.


    # Theory


    Weak passwords are one of the easiest ways for a cracker to gain access to your
    system. Crack can help you find these vulnerabilities and make your system harder
    to break into.


    # Unix Passwords


    The Unix passing scheme has been a consistent standard for many years. When a
    user is created, Unix puts the username, password, and other information into
    an /etc/passwd file. The following section examines this file in detail.


    # The /etc/passwd File


    The /etc/passwd file is composed of individual lines of user information. Each
    user''s information forms a single line, with the information fields delimited
    by colons. There are seven fields in the password file: login, password, UID,
    GID, group name,'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'home directory, and default shell. Typically, passwords are hashed DES by way
    of Unix''s (crypt) method. However, some have now switched to the MD5 encryption
    algorithm. The method is a typical /etc/password file


    ```

    root:x:0:0::root:/root:/bin/bash

    carlos:x:1000:1000:::/home/carlos:/bin/bash

    bonney:x:1002:1000:::/home/bonney:/bin/bash

    fade:x:1003:1000:::/home/xfade:/bin/bash

    kentavos:x:1008:1000:::/home/kentavos:/bin/bash

    bcbrown:x:1010:1000:::/home/bcbrown:/bin/bash

    benpharr:x:1011:1000:::/home/benpharr:/bin/bash

    ```


    The password file contains an x in each password field because this system has
    password shadowing installed.


    # Shadowing


    Initially, the Unix OS /etc/password file contained the actual hashed passwords.
    However, the file was world-readable, meaning anyone with form of access to the
    computer could run a password cracker on a copy of the file.


    Shadowing solved this problem. While the rest of the user information remains
    in the /etc/password file, the hashed passwords are stored in the /etc/shadow
    file. This file, unlike /etc/passwd, is only readable by root. This prevents unauthorized
    users from acquiring the hashed passwords and running them through a cracker program.
    More detailed information on password shadowing can be found earlier in this book
    and in the shadow''s documentation. The following is a typical /etc/shadow file:


    ```

    6:hKBTSSmEnt3g:11226:0:99999:7:::

    carlos:OKRyTfSds:11143:0:99999:7::

    test:ycLAkyIP.5gs:11181:0:99999:7::

    bonney:PQ2Wp2ZVS:11162:0:99999:7::

    fade:76:WH9J5DHnY:11978:0:99999:7::

    kentavos:vmkJWIf8Fzk:11223:0:99999:7::

    chucha:kkdrp1MI:11227:0:99999:7::

    bcbrown:DseUPIL0Zgg:11227:0:99999:7::

    benpharr:09uharV67TTY:11227:0:99999:7::

    ```


    # The Crack Utility


    The Crack utility allows system administrators to check their system for weak
    passwords. The administrator can take steps to fix the vulnerabilities.


    # How Does Crack Work?


    Crack, like most password crackers, takes a long wordlist and encrypts each word
    in 4096 ways. (This is assuming that DES is being used; MD5 or other algorithms
    in'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Using Crack to Check for Weak Passwords 265


    different.) It then compares these hashed words to each password on the system.
    This can take quite a while, but Crack usually find several of the easier passwords
    in less than an hour. It might take several hours for some passwords, and others
    may never be found, depending on the wordlist being used.


    # Implications of Running Crack


    Installing a cracking program without prior permission can have serious consequences.
    It is strongly advisable to obtain permission before installing and using the
    Crack utility on a networked system. Obtaining written permission can help to
    prevent future misunderstandings.


    # Wordlists for Crack


    Crack has a default wordlist however, many are available. Two of the most popular
    wordlist repositories are found at ftp.cerias.purdue.edu/pub/dict and ftp.ox.ac.uk/pub/wordlists.
    Adding a wordlist to Crack can help find the greatest number of weak passwords
    possible. However, there are more specific reasons for wordlist expansion. It
    is important to consider the nature of your company when choosing wordlists. For
    example, if you worked for a pet supply company, you would want to select animal
    and pet supply-related wordlists.


    # Lab Exercises


    These lab exercises are designed to introduce you to the Crack utility and give
    you the knowledge required to conduct outside research. To complete these exercises
    you will need the root account on a computer running Linux. The gcc compiler must
    have installed so Crack can be built from the source.


    # Install Crack on Your Machine


    Installing Crack on your machine can be more difficult than installing some other
    software packages. There is no RPM for it and the source tarfile does not take
    advantage of autoconf.


    The first step is to download the tarfile. You can find the main download sites
    by going to www.users.dircon.co.uk/~-crypto/download/c50-faq.html. Go to one of
    the sites listed and download the file.


    Next you must unpack the files. Login as root directly or with su, and move the
    tarfile into the directory where you want Crack to reside. Then unzip and unpack
    the file by typing:


    ```

    # gunzip crack5.0.tar.gz

    # tar -xvf crack5.0.tar

    ```


    This will create a directory named c50a. Move into the directory by typing cd
    c50a.'
