  md: '# Theory of Operation 27


    # # Security Announcements


    Security announcements provide information about vulnerabilities and security
    problems. Announcements can be obtained from many places such as Web sites, mailing
    lists, and newsgroups. Following is a descriptive list of some of the more popular
    venues for security announcements.


    # ## CERT/CC


    The CERT Coordination Center was founded at Carnegie Mellon University in December
    1998 by DARPA shortly after the Morris Worm incident, which brought nearly 10
    percent of the entire Internet. Incident response was the original function of
    the center, but recently it has grown to include training and overseeing of other
    response teams and security professionals. Research is important at the center
    and is done in all areas of security, including the case of vulnerabilities, prevention,
    and improvement. The CERT / CC is now a part of Carnegie Mellon Institute for
    Survivable Systems (CMISS), which was established in April 2000. CMISS is the
    collaborated effort of nearly a dozen organizations. Its purpose is to research
    security issues, address them, and develop information to improve security.


    # ## Mailing List


    The CERT/CC offers a mailing list that supplies information on current security
    problems and related issues. Names on the list are not released and they use a
    PGP key to sign their mail, which prevents fraudulent advisories. In order to
    subscribe to the list, send an e-mail to <cert-advisory-requests@cert.org> with
    “SUBSCRIBE <your-e-mail-address>” with the subject line. If the address does not
    work, try visiting Web Site at www.cert.org/contact_cert/certmaillist.html.


    > NOTE Before sorting through the e-mails a mailing list, be sure that the resources
    are available as they come in. It can be easy to become overwhelmed with a barrage
    of e-mails from several different mailing lists. One suggestion to avoid this
    is to divide the list among several people and have them forward any relevant
    information to the rest of the group.


    # ## The SANS Institute


    Established in 1989, the System Administration, Networking, and Security (SANS)
    Institute is an organization of more than 96,000 professionals who share information
    in a cooperative effort. The main focus of the Institute is to spread knowledge
    that will be of benefit to system administrators and networking and security professionals.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Services


    The following is a descriptive list of the services that the Institute offers:


    SANS NewsBites. Provides a weekly summary of published news stories that pertain
    to security.


    The SANS Security Alert Consensus. Provides a weekly summary of recent security
    alerts and solutions.


    The SANS Windows Digest. Provides a monthly summary of security alerts and guidance
    for managers of Windows systems.


    The Global Incident Analysis Center. Provides a response program where security
    vulnerabilities are analyzed and reported on. It is a voluntary program that provides
    a great opportunity for anyone to collaborate with veterans and learn tactics
    to handle security attacks.


    # How to Subscribe


    All of the services that are offered by the SANS Institute can be accessed at
    their Web site, located at www.sans.org/sansnews.


    # SecurityFocus.com


    A Web site that contains an abundance of security-related services is www.security
    focus.com.


    # Services


    Bugtraq, a popular security mailing list, is one of the site''s many attractions.
    Bugtraq is a moderated mailing list that was established in November 1993 to provide
    detailed discussion and announcement of security vulnerabilities. It is one of
    the best-known mailing lists with over 27,000 subscribers. Several discussion
    groups and forums for focus on security-related issues can also be found. Many
    specialized mailing lists are available for subscription.


    # How to Subscribe


    To use any of the services SecurityFocus.com offers, or to subscribe to any of
    its mailing lists, use the site''s hyperlinks, starting at www.securityfocus.com.
    To subscribe to the Bugtraq mailing list, send an e-mail to LISTSERV@SECURITYFOCUS.COM
    with "SUBSCRIBE BUGTRAQ Lastname, Firstname" in the message body. They will send
    a confirmation request that will need a reply. If this does not work, see the
    Bugtraq FAQ for further information at www.securityfocus.com/frames/?content=/forums/bugtraq/faq.html.'
