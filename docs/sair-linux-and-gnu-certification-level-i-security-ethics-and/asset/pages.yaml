  md: '# Theory of Operation


    # Objectives


    +   - Define network security, physical security, and personnel security.

    - Demonstrate the importance of MD5 checksum.

    - List at least four capabilities of Pretty Good Privacy (PGP) or Gnu.

    - Give at least three guidelines for creating strong passwords.

    - Describe how SUID programs can be insecure, and how to locate programs.

    - Define VPNs, packet filtering, and TCP wrappers.

    - Describe the importance of log files and log file monitoring.

    - Define intruder detection and intruder prevention.

    - List common system vulnerabilities (software/hardware).

    - Define various denial-of-service (DoS) attacks.

    - Define IP spoofing.

