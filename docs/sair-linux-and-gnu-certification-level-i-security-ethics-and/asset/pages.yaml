    # nmap


    nmap is another utility that can be used to study the connections on a network.
    Instead of approaching the network from the services that are running, nmap scans
    the ports of a computer (or network of computers) to gather information about
    which services are running.


    This can be a very useful tool for tasks, such as listing computers, detecting
    intruders, and identifying operating systems. It should be used with care. Some
    system administrators feel that a port scan is the first step in an attempted
    security breach, since it provides information about the open ports an attack
    could occur through. Therefore, be sure to have the proper authorization before
    scanning computers and/or networks.


    nmap can perform scans on UDP and TCP sockets. It can also provide a variety of
    options, such as a ping sweep, ACK sweep, and stealth scanning.


