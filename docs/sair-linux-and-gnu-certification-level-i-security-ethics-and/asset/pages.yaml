  md: 'Sendmail be used because the other available programs are not as powerful or
    do not offer the same flexibility, the administrator should simply be aware of
    the problems inherent to Sendmail and make it as secure as possible.


    # Making Sendmail Safe


    Crackers commonly attempt to find problems in the software that they are most
    likely to encounter. The vulnerabilities in Sendmail have been discovered largely
    due to the program''s popularity, and promptly patched for the same reason. The
    result of this searching, finding, and fixing Sendmail security problems is a
    set of procedures detailing how to keep the program safe.


    # Patching


    One of the best ways to secure Sendmail is to always run the latest version of
    the program; this can be obtained from www.sendmail.org, as well as a number of
    mirror sites and archives on the Internet. It is also important to verify the
    PGP signature attached to the source files to ensure authenticity.


    Sendmail is an high volume of patching required to keep a mail system up to date
    and as error-free as possible. Remaining abreast of Sendmail patches can be a
    great way to keep a system safe; however, it has been known to introduce new problems
    to Sendmail that did not exist before.


    # Running Sendmail on a Firewall


    There are several benefits to running Sendmail on a firewall. A firewall does
    not have normal user accounts, as the only people who know on the system are administrators.
    Sendmail does not need to read user directories to find .forward or :include:
    files, nor will it need to run other programs for the user. This leaves the administrator
    with the task of keeping file ownership in the mail queue consistent and the prevention
    of users from reading messages that are in transit; there should not be any non-privileged
    user accounts on the firewall, this second task should not be a problem.


    # Installing Sendmail on a Firewall


    Installation and configuration of Sendmail on a firewall is not a simple task.
    The following are a few general suggestions concerning installation.


    As stated previously, the administrator should ensure that the most recent version
    of Sendmail is being used, and that the PGP signature of the source files is checked
    before it is compiled for the system.


    Like applications that will be installed on a firewall, Sendmail should be compiled
    and tested on another system before the installation. This, in conjunction with
    testing of the system, will help identify security problems before it has been
    placed on the firewall.


    The last step when installing Sendmail is the editing of the configuration file.
    The user should educate himself or herself about the most common options and switches
    used by Sendmail when installed on a firewall. This can be found at www.idg.net/crd_sendmail_71014.html.'
