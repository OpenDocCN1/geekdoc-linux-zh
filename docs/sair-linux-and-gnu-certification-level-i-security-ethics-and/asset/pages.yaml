    # DES


    The DES was commissioned by the U.S. Government in 1977, based on IBM''s Lucifer
    encryption algorithm. The DES was created for the encryption of non-classified
    documents.


    The algorithm of DES, called DEA (Data Encryption Algorithm), is based on permuting,
    subdividing, and recombining blocks of data and keys. There are 64 bits of data
    per block, with 56 bits. This key is only known to the program encrypting the
    data and to the program decrypting the data. There are several permutations that
    are performed on the 64-bit block of data, based on the 56-bit key. The complete
    algorithm can be found on the Federal Information Processing Standards Publication
    Data Encryption Standard Page at www.nist.gov/fipspubs/fip46-2.htm.


    Table 3.1 Switches to Configure PGP


