  md: '# Table 3.8 Descriptions of State Options


    | STATE | DESCRIPTION |

    | --- | --- |

    | Established | There is an established connection for the socket. |

    | SYN_Sent | The socket is attempting to connect. |

    | SYN_Recv | There has been a request for the socket. |

    | FIN_Wait1 | The connection is shutting down from the local end. |

    | FIN_Wait2 | The connection is waiting to be closed from the remote end. |

    | TIME_Wait | There are still packets on the network to be handled before closing
    the socket. |

    | Closed | The socket is closed and not in use. |

    | CLOSE_Wait | The remote end is closed and the local end is closing. |

    | LAST_Ack | The socket is closed from both ends with acknowledgments sent. |

    | Listen | The socket is listening for a connection. |

    | Closing | Data is still being sent, but both sockets are closed. |


    # Active Unix Domain Sockets


    The second component of netstat output is the Active Unix domain sockets. In this
    section, you will find descriptions of the sockets that use Unix as their protocol.
    Table 3.9 defines the fields that are used in these entries.

    The following are six different types of socket access:


    +   - SOCK_DGRAM Used when the socket is using datagrams.

    - SOCK_STREAM Used when there is a stream connection.

    - SOCK_RAW Used when the connection is a raw socket.

    - SOCK_RDM Used when the socket is for sequential packets.

    - SOCK_PACKET Same as SOCK_RAW.


    There are also five different states in which the socket can reside:


    +   - FREE The socket is not allocated for any purpose.

    - LISTENING The socket is waiting for a request.

    - CONNECTING There is a connection being made.

    - CONNECTED The connection is active.

    - DISCONNECTING The socket is disconnecting.'
