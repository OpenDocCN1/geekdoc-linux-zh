    # Tripwire


    One of the best ways to see if an intruder has been on a system is to check for
    unscheduled changes to system files and check for new, illicit files in system
    directories. A system administrator can manually go through all directories and
    files, or the administrator utilize checksums. A checksum is a series of characters
    that represent the contents of a file and/or directory structure.


    One tool for checking file system integrity is the Tripwire program, which uses
    three types of checksums: the Cyclic Redundancy Check (CRC), Message Digest (MD),
    and Snefru. Tripwire can use more than one version of the CRC and MD checksums.
    All algorithms use one-way hashing function that can keep the text information
    in a file, directory structure, etc., and through mathematical formulas, create
    a number that is unique to the combination of characters in the text.


    # Configuring Tripwire


    To obtain Tripwire, go to the site www.tripwire.org. Although the open source
    version of Tripwire is not available, it is still free to download and use. After
    Tripwire is installed, the database must be initialized. This database will hold
    the checksums for all system files and directories that are specified in the Tripwire
    configuration file /etc/tripwire/tw.config. A sample tw.config file is displayed
    here:'
