- img_proc: true
  md: 'Wrappers can be used to block traffic to certain services based on the IP or
    host name of the connecting users. Wrappers can also protect against name server
    spoofing on the service level, since they can do reverse lookups on IPs and deny
    access based on the results.

    Wrappers are also an effective way to track unauthorized usage of a system. Since
    wrappers do not affect the way a service looks to someone connecting to it, they
    will not alert a cracker that he or she is being watched.


    # # System Monitoring


    Frequent testing and maintenance of network security is a vital part of safeguarding
    the information it contains. A system administrator must be able to quickly detect
    and fix holes in network security and also be able to monitor a live network for
    security breaches. This explains some important aspects and techniques used to
    actively monitor a network. Included are a few popular and useful programs utilized
    when testing a network for security holes.


    # # Log File Information


    When monitoring a network for possible security breaches, the log files are a
    rich source of data. They provide a vast amount of information concerning login
    attempts, system messages, and remote accesses. Using this information, the detection
    of a break-in and perhaps the subsequent identification of the intruder is possible.


    The first and most obvious way of verifying a suspected break-in is from the login
    files. When a user logs in to a network, whether as a user or as root, a log is
    kept of every attempt. Typically, all login attempts are kept within /var/log/secure
    file. Examination of this file can tell a system administrator if a person has
    tried to break into the network through repeated login attempts and from where
    the logins were attempted. Additionally, a secure log is kept for a certain time
    period. There are a number of secure files (secure, secure1, secure2, etc) that
    contain information for their respective time frames. The lowest number indicates
    the most recent log. Therefore, a system administrator can tell whether the breach
    was an isolated incident or a repeated occurrence.


    More significant than general user logins are superuser logins. The ability to
    keep track of users who log in as superusers is important. Located in /var/adm/sudo,
    the suelog file lets the system administrator view all successful and unsuccessful
    superuser login attempts. Because of the amount of privileges a superuser has,
    anyone with malicious intent who could successfully log in as a superuser would
    pose a major threat to the network.


    Another important log file that can alert a system administrator about a possible
    break-in is the messages log. Any system messages produced by the network are
    stored within /var/log/messages. The ability to scan the messages logs can provide
    the system administrator with valuable information about system problems and system
    messages a suspected intruder may have produced.'
