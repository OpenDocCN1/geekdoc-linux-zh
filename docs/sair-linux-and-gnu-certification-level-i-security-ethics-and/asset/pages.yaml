  md: '# Check File and Directory Permissions


    Protecting a system from Sendmail-based attacks begins with the file and directory
    permissions. The most critical files and directories susceptible to attacks through
    Sendmail are the /etc directory, mail queue directory, and the Sendmail configuration
    file. The /etc directory should be set to mode 755, and only root should should
    have permission to write files within /etc directory. The /var/spool/queue, the
    mail queue directory, should be set to mode 700 and owned by RunAsUser. The directories
    in the path to the mail queue directory (/ /var, and /var/spool) should also be
    protected by setting them to mode 755, which is owned by root.


    Since the Sendmail configuration file is trusted, sendmail.cf should be heavily
    protected. The directory where sendmail.cf is located, /etc/mail, should be protected
    as well. The directory should be set to mode 755 and owned by TrustedUser, while
    sendmail.cf should be set to mode 644 and owned by TrustedUser. As a matter of
    security, the Sendmail database files and maps should also be placed in /etc/mail.


    # Clean up Aliases File


    The aliases file is located in /etc and is used to redirect mail to users. Mail
    can also be redirected to programs that process the message; particular feature
    of the aliases file can be used to create security vulnerabilities. Remove any
    unused redirects in the aliases file. Redirects-to-programs are especially dangerous;
    remove them or ensure that the program will verify the source of information passed
    to it before executing.


    Only root or TrustedUser should write to the aliases file. Setting the file to
    mode 755 and changing its owner to TrustedUser will accomplish this.


    # Use the Sendmail Restricted Shell


    The Sendmail restricted shell, or smsh, controls which programs can be run through
    e-mail. Programs are restricted to those located in a specified directory. This
    shell takes place of /bin/sh in the sendmail.cf, and it is activated by designating
    FEATURE(smsh) within the macro defining of the OS. The CONFBINDIR variable defines
    the directory where trusted programs and links to trusted programs are placed;
    this variable can be set while defining the operating system environment for Sendmail.


    # Use the SafeEnvironment Option


    A value for the variable SAFE_FILE_ENV can be set in the configuration macros
    for Sendmail. This will set the path for the SafeEnvironment option, which will
    chroot to the specified directory before writing files. This only applies to files
    being written by users, they cannot overwrite important files. When a path includes
    the chrooted directory is presented, SafeEnvironment will remove that portion
    of the path. For example, if SafeEnvironment=/my and a file is written to /my/home/directory,
    SafeEnvironment will chroot to /my, remove/from the path, and write to /home/directory.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Lab Exercises


    These exercises guide you through enhancing the security of Sendmail using the
    techniques described earlier. It is assumed that you already know how to properly
    configure and build Sendmail.


    # Create the mailnull Account


    In order to take full advantage of the DefaultUser, create the mailnull account
    in the /etc/passwd file. The user account, mailnull, should be a null account
    with a unique UID and GID, no password, an invalid shell, and no home directory.
    To create the account, open /etc/passwd with an editor and add the following line:


    ```

    mailnull::200:200:DefaultUser::/bin/false

    ```


    Now, write out the file, exit the editor, and restart Sendmail. The next time
    Sendmail starts, it will detect that the user mailnull exists and use UID and
    GID whenever DefaultUser is needed.


    # EnableTrustedUser


    To use TrustedUser, you must have a user account created to trust. Then define
    the variable CONTRUSTED_USER to be that user account in the Sendmail configuration
    file. To create a user account to trust, open /etc/passwd with an editor. Add
    a new user complex with unique UID, GID, home directory, and a valid shell. The
    new line should be similar to the following:


    ```

    trusteduser::201:201:TrustedUser:/home/trusteduser:/bin/bash

    ```


    After writing out the file and closing the editor, run the passwd command for
    the new user and provide a password.

    Next, define the variable in the Sendmail configuration file. To do this, find
    the appropriate configuration file and add the following line:


    ```

    define(''CONTRUSTED_USER'', ''trusteduser'')

    ```


    Changing this configuration file will require rebuilding Sendmail for the changes
    to take effect.


    # Enable RunAsUser


    Setting up RunAsUser is similar to setting up TrustedUser. Create a new user that
    Sendmail will setuid after startup, and define the variable confRUN_AS_USER in
    the Sendmail configuration file.'
  merge: -1
