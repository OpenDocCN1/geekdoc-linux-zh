    ```

    ssh [-afkqnqtvxACNPTX246] [-c cipher_spec] [-e escape_char] [-i identity_file]

    [-l login_name] [-o option] [-p port] [-L port:host:hostport]

    [-R port:host:hostport] [hostname|username] [command]

    ```


    # SSH Options


    As a shell command, ssh has many uses. From of the frequently used parameters
    are here:


    +   -c [blowfish|3des]


    Use this to select the cipher to encrypt the current session. The default encryption
    scheme is 3des. Another common scheme, which has better performance and remains
    visibly secure, is blowfish.


    +   -1 [login name]


    Specify the login name on the remote machine. This option can be set in the configuration
    files, as discussed in Examples 1 and 2.'
