  md: '# Theory of Operation 31


    decision. This book aims to prepare a system administrator to approach situations
    with confidence and a little knowledge based upon relevant circumstantial information.
    A system administrator''s authority comes with the challenge of decisionmaking.
    The effects of a poorly made decision can be costly and involve unforeseen repercussions.
    The system administrator must make it his or her duty to employ reason when confronted
    with difficult decisions. Often, one may not have the knowledge to solve a specific
    hardware incompatibility, when presented with information that may result in the
    loss of an employee, the accuracy of the decision is crucial. A typical system
    administrator performs a variety of important tasks that often fall into the following
    categories:


    +   - Install and configure operating systems

    - Manage user accounts and records

    - Enforce and apply security policies

    - Implement system backup strategies

    - Upgrade and purchase systems resources

    - Optimize system resources

    - Troubleshooting


    Within each of these areas, an administrator will be confronted with several dilemmas.
    This material is examined in more detail in Chapter 6, "Troubleshooting," A proposed
    solution to different decision-making situations is to provide relative, undisputed
    facts. An enforced code will provide this knowledge base, but the code must be
    flexible to encompass all possible cases. Where it may impossible to construct
    a proper response to every instance, administrators who conform to codes approved
    by all users will minimize the complexity of finding an ethical answer. There
    should be a set of guidelines to which the system administrator can be held accountable.
    These duties require an ethical decision in order to be performed properly, with
    respect to users and the computer system.


    # Information Control


    There are many laws in place for the protection of intellectual property. However,
    with the proliferation of cultures, intellectual property is constantly at risk
    of being stolen or used improperly. Audio files, movies, and books that are owned
    and copyrighted by individuals and corporations have open to theft and public
    use. While certain laws prohibit data theft, there is technology present to circumvent
    laws. Often, some laws prove to be ambiguous or unclear and result in poor enforcement.
    In each case, the user makes a decision and justifies it or her actions for the
    use of information.


    A system administrator''s decisions should follow the laws enforced by governing
    bodies and should be made with respect to the rights and freedoms that have been
    given to computer users. Monitoring the public data that passes through a server
    may allow for potential actions, whereas data contained in a user''s mail file
    may be considered to private property. Information such as what is downloaded
    and its origin can be justifiably examined to legally protect copyrighted property.
    Policies can be implemented to prevent these measures, such as a ban on certain
    sites (through'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'firewalls) and by informing users that certain types of files will not be allowed
    on specific servers. This move to inform users as to what will be allowed on a
    system for storage age gives the system administrator a tangible agreement that
    should prevent misunderstandings and the abuse of system resources.


    # Respect of System Users


    It is a system administrator''s duty to keep all illegal material off the server.
    It is also the duty of the system administrator not to violate the individual
    rights of a user. Thus, a user''s files should be considered private unless there
    is evidence that he or she is acting disrespectfully towards another individual
    or the company''s property. When there is evidence of system abuse, it is also
    the duty of the administrators to inform a user that or her personal information
    needs to be examined. An example of a code that protects users'' rights would
    involve the statement: "Exploration of a user''s personal files should only take
    place after the user informed about the investigation and its purposes." An administrator
    must only take actions to invalidate a user''s rights if undisputed evidence exists,
    implying a conscious misconduct. This type of interaction and application of a
    fundamental code provides an ethical way for a system administrator to keep illegal
    activity from occurring or illegal material from being stored on servers under
    their care. The steps taken when such abuse occurs are dependent upon the individual
    system administrator and the company. However, one must examine all aspects of
    any situation relating to system abuse in order for a just decision to be made
    properly. These decisions then be supported by the rules agreed upon by the system
    administrator and the society in which the system resides.


    While a user''s files and actions should be managed, the system administrator
    must be accountable for his or her actions using an ethical system. A system administrator
    is hired to protect and manage a system and is given access to all aspects of
    the system; therefore, the utmost trust must be given to maintain that system.
    Often, an ethical violation by an administrator could manipulate the files of
    the users, changing not only the identities of the users but the dynamic and free
    environment in which they work. If an administrator so desired, he or she would
    have the ability to seriously damage the company''s system using its resources
    to crack passwords or gain unauthorized access. While these measures seem extreme,
    the computing industry expects to trust a system administrator with its most sensitive
    information.'
