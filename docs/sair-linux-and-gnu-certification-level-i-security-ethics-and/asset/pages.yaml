    # The ScriptAliased CGI directory if the location has changed.

    <Directory>/usr/local/etc/http/cgi-bin

    AllowOverride None

    #Options None

    Options ExecCGI

    </Directory>

    ```


    As, the access.conf configuration is divided into rules, starting with the default
    rule for the root directory, Each individual rule starts with <Directory [directory]>
    and ends with </Directory> and may include specific access control directives
    for that directory and its subdirectories. In addition, certain options, such
    as the ability to execute CGIs, may be allowed or denied.


    # Access Control Directives


    The administrator may wish to change the default access control directives for
    a Web server. Table 5.3 lists the access control directives that may be used with
    a directory structure.


    If the administrator wants to access from everywhere except one site, lucasdigital.com,
    the directives would appear as the following:


    ```

    order deny, allow

    allow from all

    deny from lucasdigital.com

    ```


    In the future, if the administrator has trouble with other sites, bad.lucas.com
    and worse.lucas.com, the deny directive could be appended like this:


    ```

    order deny, allow

    allow from all

    deny from lucasdigital.com bad.lucas.com worse.lucas.com

    ```


    | DIRECTIVE | DESCRIPTION |

    |---|---|

    | allow | The allow directive controls which hosts are allowed to connect. Three
    options can be used with allow: all, none, or [list], a list of the hosts that
    are allowed access. |

    | deny | The deny directive controls which hosts are not allowed to connect. Three
    options can be used with deny:all, none, or [list], a list of the hosts that are
    denied access. |

    | order | The order directive specifies the order in which the allow/deny rules
    are applied. Three options can be used with order:allow, deny or deny, allow,
    or mutual-failure. Using the mutual-failure, a connection must pass both allow
    and deny rules. |'
  merge: -1
