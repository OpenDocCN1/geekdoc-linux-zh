    \ information that could compromise a system is not accessed by unwanted persons.\n\
    \nSecond, and probably most important, read the log files. Using the utilities\
    \ discussed next will help to sort out the important information, but should not\
    \ be taken as an end in themselves. It is best to start by having too much information\
    \ to read since, by trial and error, it can be determined what information is\
    \ important. Investigation of any unusual entries in these files, keeping in mind\
    \ how these entries can be made, will help determine entries that need to be filtered.\n\
    \n# logrotate\n\nThe logrotate utility, often run through cron, is designed to\
    \ automatically cycle log files by removing the oldest files and starting with\
    \ new ones. Options of logrotate include cycling files by a daily, weekly, or\
