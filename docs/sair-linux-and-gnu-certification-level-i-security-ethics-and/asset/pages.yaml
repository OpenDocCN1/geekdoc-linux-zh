    be prompted to move into the /src directory and run make and then run make install.
    Once these steps are completed, the installation of Big Brother is complete.


    Configuration for Big Brother is mainly done with changes to the bb-hosts and
    the bbdef.sh files found in the /bb15d/etc directory. The bb-hosts file contains
    server and network information. This file would be modified to properly display
