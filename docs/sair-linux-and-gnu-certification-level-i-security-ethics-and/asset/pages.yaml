  md: '# Chapter 1


    # # Security in Today''s Internet


    The Internet resources currently available to individuals, businesses, and organizations
    allow for the innovative exchange of information. However, the widespread storage
    and transfer of information creates an opportunity for security breaches, even
    in the most secure systems. It is important to recognize the sources of threat,
    and to take educated preventative measures.


    # ## Why Is Security Important?


    The number of businesses and individuals using the Internet grows every day. As
    the number of users expands, so will the number of potential targets and crackers.
    Security must increase to protect Internet users from those who would steal confidential
    information.


    For the purposes of this book, it is important to define the terms *hacker* and
    *cracker*. This definition is constantly in dispute; most of the existing definitions
    deine the roles of hacker and cracker by establishing intent. However, intent
    is impossible to measure. A *hacker* is an exceptionally skilled programmer who
    maximizes computer resources. A *cracker* is an individual who breaks into systems
    that he or she is not authorized to access. It is crackers who pose a threat to
    Internet security.


    # ## General Security


    Security should be a concern in every situation, whether paying for dinner with
    a credit card or working for NASDAQ as a financial advisor. To fully comprehend
    the necessity of security, consider the different ways in which it plays a part
    in everyday life. Locks on doors, picture IDs, security cameras, speed limits,
    and insurance are all different steps taken to help secure the privacy of a person''s
    life.


    # ## Security on the Internet


    The magnitude of the Internet creates opportunities for misuse. Many online companies
    are reporting the loss of credit card numbers to Internet theft. In one famous
    case, a cracker attempted to blackmail an online store for $100,000. He claimed
    he had stolen 300,000 credit card numbers from the company, and until his demands
    were met, he would post them on the Internet. The company refused the cracker''s
    demands and turned to the FBI for help. The cracker posted 25,000 numbers before
    he was stopped, and he has threatened to post the rest of the credit card numbers
    in the future. Banks are increasingly moving their business to the Internet. Online
    services, such as account information, online checking, and direct payment, make
    banks and their customers appealing target to crackers.


    Government agencies increasingly rely on the Internet to synchronize efforts.
    Agencies such as the DMV, Health and Human Resources, Welfare, FBI, CIA, and NSA
    are using the Internet to send, store, and process information. The information
    they possess (i.e., medical, financial, and criminal records) is a potential target
    for crackers.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Theory of Operation 5


    The Internet is a vast system of information with varying degrees of confidentiality;
    it is inviting to criminal activity because of the anonymity it offers. Currently,
    legislators across the globe are developing laws to govern cyberspace. The U.S.
    government is increasing the amount of resources delegated to address Internet
    crime. In spite of these measures, Internet continues to grow; it is important
    that security is a serious consideration for every user.


    # Physical Security


    Physical security is an easily overlooked aspect of Internet security. Often,
    Internet security is associated with firewalls, IP masquerading, and other electronic
    means. Although these are important aspects of Internet security, it is just as
    important to ensure physical security as well.


    Physical security should begin with a review of the facilities in which a system
    is kept. Examine the strength of doors, locks, and windows. Estimate the difficulty
    of breaking into the building and the chances of being caught. Are there alarm
    systems in place, and if so, how are they effective? Is the building locked and
    secure when the last employee leaves? These questions must be asked first.


    However, physical security does not stop at prevention of theft. It is important
    to have security measures against natural acts as well. Surge protectors are an
    example of measures, but protection from random lightning strikes is not enough.
    What kinds of fire detection devices are being used? If the building catch fire,
    would the fire department be immediately notified? Are valuable resources kept
    in fireproof rooms or lockers? Can the building weather a strong storm or blizzard?
    Is there a risk of trees falling on the building? These questions seem trivial,
    but considering them can prevent future complications.


    It is also important to remember that a cracker can occasionally gain physical
    access to your information without ever entering the building in which it is stored.
    Make certain that the telephone lines are secure and there is no place that are
    obviously or easily accessed.


    # Security in the Workplace


    Security leaks can also occur from overlooked details in the workplace. An employee
    with root access may be tempted to create an account for an outside cracker. Passwords
    are written down for easy reference. Sensitive information is thrown away without
    being shredded. Although these breaches may seem minor, they present a real security
    threat, and are often exploited by crackers to gain entry into a system. Crackers
    are known for "dumpster diving," where they will literally search a company''s
    trash for access codes and passwords.


    Crackers are not the only security threat. Disgruntled employees can cause an
    equal amount of damage, destroying all or some of a company''s networks and databases.
    It is vital that precautions are taken to properly protect confidential information.


    # Personnel Security


    Security in the workplace begins at the most basic level, the workers. When hiring
    a new employee, references should be required and checked. It is also important
    to do a'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'background check on the potential employee. After the decision to hire an employee
    is made, or he should be well trained and informed of the security measures to
    be taken, including shredding all information, frequent changing and choosing
    of proper passwords, and encrypting e-mails.


    Another way to ensure personnel security is to monitor employees carefully. The
    degree to which a company may monitor an employee has recently been brought before
    courts of law as people sue for privacy violations. Therefore, it is important
    to respect an employee''s rights while monitoring them.


    Employee evaluations can also increase personnel security. Evaluations help the
    employer and the employee have a better understanding of each other. An effective
    evaluation will display the current quality of the employee''s work to the employer,
    and it should indicate what is expected of the employee.


    Finally, it is important to maintain personnel security if an employee is leaving.
    Whether the departure is forced or voluntary, steps should be taken immediately
    to prevent any possible threats. Any passwords the employee had access to be changed,
    and the employee''s account should be closed. These preventative measures will
    cut down the risk of security threats.


    # # Common Threat Statistics


    Common Emergency Response Team Coordination Center (CERT/CC) is a national computer
    response team that addresses and records security issues for Internet users. CERT/CC
    publishes a short list of statistics dealing with security. In 1990, 252 security
    breach incidents were reported; in 1999, 9859 incidents were reported. In 1995,
    171 discovered vulnerabilities (i.e., ways to compromise a computer, network,
    or the Internet) were reported; in 1999, the number had grown to 417. The total
    amount of known vulnerabilities reported to CERT/CC as of this writing is 1948.
    This does not include unreported discoveries or the countless vulnerabilities
    not yet found.


    # # Famous Security Cases


    The information known about crackers is scarce and rarely reliable. However, there
    have been cases in which famous crackers have been caught by the U.S. government.
    This has provided information about the extent of their capabilities.


    In 1988, Robert Morris, a graduate student at Cornell, released a computer worm
    that would become one of the most famous cases in history. The Morris Worm infected
    up to 6000 computers in a period of 24 hours. The Worm accessed computers and
    ran a small task in the background, and then accessed the mail program and downloaded
    to other computers. However, due to programming error, some computers were infected
    with hundreds of copies of the Program, and eventually crashed or froze. The Morris
    Worm highlighted the security vulnerabilities of the Internet at the time. Once
    alerted to the problem, computer science professors from various universities
    addressed the crisis, and a patch was issued within two days. Robert Morris became
    the first person convicted under the Federal Computer Fraud and Abuse Act; he
    was sentenced to several years'' probation and a $10,000 fine.'
