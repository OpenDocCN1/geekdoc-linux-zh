  md: 'Base Systems 63


    # # stunnel


    stunnel is a program that allows any TCP-based connection to be inside a secure
    Secure Socket Layer (SSL) tunnel. Most common protocols do not include a form
    of encryption. For example, an e-mail program downloads mail from a POP3 or IMAP
    server, the messages are sent in plain text as they travel in packets over the
    Internet. This leaves the contents of the messages vulnerable to anyone who has
    the means to intercept the packets. stunnel provides a way to preserve the privacy
    of e-mail and other transmissions over the Internet.


    By using stunnel, the administrator can encrypt and secure virtually any TCP-client/server
    connection (POP, IMAP, LDAP, etc.) that does not equipped with SSL functionality.
    stunnel requires no code changes to the daemon being secured and only minimal
    changes to the configuration of an existing protocol. The adaptability and versatility
    of stunnel has led it to be known as the universal SSL tunnel. Since stunnel is
    not 100% complete, it relies on other functioning SSL libraries. OpenSSL, SSLLeay,
    or other SSL library is required in order to compile stunnel (stunnel does not
    provide encryption).


    # # Configuring and Running stunnel


    stunnel can operate in either inetd mode or daemon mode, in inetd mode is the
    default. Running in daemon mode is achieved by using the -d option when stunnel
    is invoked. The valid options and their arguments for the stunnel command, along
    with a brief description of each are shown in Table 2.6.


    # # Running in inetd mode


    stunnel can be configured to start by using inetd. Known as the Internet super
    server, inetd is designed to provide Internet services when a connection is made
    to a specified port, thus reducing the load on the system. The format of the inetd
    conf file is:


    ```

    <service_name> <sock_type> <proto> <flags> <user> <server_path> <options>

    ```


    The system administrator must edit the inetd configuration file /etc/inetd.conf
    to run stunnel. Assume that stunnel must be configured to listen on port 9990
    to support a TCP protocol stream. If stunnel was installed in the default directory
    /usr/local/sbin/, the following line would be added to inetd.conf:


    ```

    scream stream tcp nowait /usr/local/sbin/stunnel options

    ```


    Based on the preceding code, the following line would be added to the /etc/services
    file:


    ```

    scream9990/tcp  #Run scream

    ```'
