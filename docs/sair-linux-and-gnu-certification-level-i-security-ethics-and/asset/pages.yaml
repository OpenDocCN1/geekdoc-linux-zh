  md: "# Introduction\n\nPassing either the 3X0-101 or the 3X0-102 exams earn the\
    \ test taker the Cair Linux and GNU Certified Professional (LCP) certificate.\
    \ Completion of all four exams (3X0-101, 3X0-102, 3X0-103, and 3X0-104) earns\
    \ the Cair Linux and GNU Certified Administrator (LCA) certificate.\nThe LCA attests\
    \ to a certificate holder's knowledge and capability to administer a Linux and\
    \ GNU system. Two more certificates, the LCE and MLCE, confirm knowledge and skills\
    \ in increasingly difficult Linux and GNU topic areas.\n\n# Minimum Candidate\
    \ Requirements\n\nThe Cair Linux and GNU tests were not designed for the novice\
    \ computer user. It is assumed that the candidate has approximately two years\
    \ of computer experience and experience in the configuration of one or more operating\
    \ systems. For example, the candidate should be familiar with basic hardware concepts,\
    \ such as CPU, cache, memory, interface adapters, hard disks, and network. The\
    \ candidate should also be familiar with basic operating system concepts, such\
    \ as booting, file access, and device drivers. Finally, the candidate should know\
    \ basic commands and the use of a Unix-type editor such as Joe, Pico, Vi, or Emacs.\n\
    \n# Knowledge Matrix\n\nThe test is based on the fourth row of the first array\
    \ in the knowledge Knowledge Matrix shown at www.linuxcertification.com. Examination\
    \ topics are listed here.\n\n# Security and Theory of Operation\n\n+   4.1.10\
    \ Security in Today's Internet\n  1. Why Is Security Important?\n  2. Statistics\
    \ about Common Threats\n  3. Futility of Security\n\n+   4.1.20 Trusting Trust\n\
    Encryption\n  1. PGP\n  2. CPS\n\n+   4.1.40 Password Weaknesses\n  1. Creation\
    \ of a Strong Password\n  2. Password Upkeep\n\n+   4.1.50 File Access Control\n\
    \  1. Access Control Lists\n  2. umask Settings\n  3. Security Risk of SUID Programs\n\
    \  4. Buffer Overflow\n\n+   4.1.60 Network Access Control\n  1. Virtual Private\
    \ Networks\n  2. Packet Filtering"
