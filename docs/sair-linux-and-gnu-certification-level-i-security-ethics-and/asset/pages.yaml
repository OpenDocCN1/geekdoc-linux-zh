  md: '# LAB IX


    # Using Tripwire


    # Purpose


    The purpose of this lab is to install and configure Tripwire, prepare a database,
    and monitor the system for modifications.


    # Theory


    Tripwire is a program that reports any modifications made to the files and directories
    of a system. Gene Kim and Eugene Spafford developed Tripwire at Purdue University.
    After creating an initial database of a system''s file and directory structure,
    the program compares the current structure to the initial database and reports
    differences in the two. Options, such as file properties and which directories
    to check or ignore, are set by making changes to the configuration file.


    # Installing and Configuring Tripwire


    First, download Tripwire by visiting its homepage at www.tripwiresecurity.com
    and go to the download section.


    After unzipping and decompressing the downloaded file, refer to the README and
    Ported files. Both files provide a better understanding of how to configure the
    system based on specific operating systems and platforms. The Makefile includes
    settings for flags and the C compiler.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'Next, edit the ./include/config.h file, designating the settings according
    to the README and Ported files. Also, decide what medium will be used to store
    Tripwire''s database.


    # CONFIG.H PARAMETERS


    +   - Location of the authoritative database

    - Files and directories to check

    - Properties to be monitored

    - Severity levels of the files and directories


    # PROPERTY FLAGS FOR THE CONFIG.H FILE


    +   - (minus) Ignore these properties.

    - +(plus) Check these properties.

    - p File permissions.

    - I Inode number.

    - n Number of links.

    - u UID.

    - g GID.

    - s File size.

    - a Access timestamp.

    - m Modification timestamp.

    - c Inode creation timestamp.

    - 1 MD5 cryptographic signature.

    - 2 SNFEUR cryptographic signature.


    # PROPERTY TEMPLATES


    +   - Read only (+pinugmc-12).

    - Log file (+pinugcsam12).

    - Nothing ignored (+pinugamsac12).

    - Everything ignored (-pinugamsac12).


    # A SAMPLE CONFIG.H FILE

    (From www.cert.org/security-improvement/implementation/:002.02.html).


    ```

    # Format: [!|=] entry ignore-flags

    # where: ''!'' signifies the entry is to be pruned

    # (inclusive) from the list of files

    # to be scanned.

    # ''='' signifies the entry is to be added,

    # but if it is a directory, then all

    # ;its contents are pruned (useful for /tmp)

    ```'
