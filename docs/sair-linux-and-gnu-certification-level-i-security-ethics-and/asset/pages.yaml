  md: '# iptables


    The iptables kernel modification is another tool used for the administration of
    Internet firewalls. Even though it is similar to ipchains, it contains significant
    advancements in packet filtering and has a more modular implementation method.


    # What Is iptables?


    iptables is an improved version of ipchains similar to the way ipchains was an
    improvement over ipfwdam. The commands and structures used in iptables are similar
    to those in ipchains, and iptables inserts and deletes rules from the filtering
    table in the Linux kernel. However, iptables is also a major advancement in the
    way in which packet filtering is done and in the way rules can be used. The ability
    to design and implement complex rules is essential in the security of the host.


    # How to Use iptables


    The most obvious difference between ipchains and iptables is that the names of
    the built-in chains have been switched from lowercase to uppercase. Most of the
    changes that a user will notice the way in which options are used. For example,
    the -i option (interface) now applies only to the INPUT and FORWARD chains, while
    -o should be used for OUTPUT and FORWARD chains. In effect, the meaning has changed
    from interface to incoming interface and outgoing interface. Also, the port for
    the TCP and UDP protocols must be spelled out the -sport or --source-port options
    immediately after the protocol filter option(-p tcp or p udp). A more complete
    list can be found at http://net-filter.filewatcher.org/unreliable-guides/packet-filtering-HOWTO.html
    that contains the iptables HOWTO.


    # What Is the Difference?


    Aside from the obvious changes in how things operate in ipchains and iptables,
    most people interested in packet filtering will wonder what the difference between
    the two, and why a change from ipchains was made. As previously mentioned, iptables
    is an advancement of ipchains, but a few option switches are definitely not more
    advanced. What makes iptables an improvement to ipchains, and not simply a new
    version, are the iptables extensions.


    iptables extensions are extra modules that be loaded by iptables or by the kernel
    to offer extra functionality. Extensions offer the ability to have rules apply
    to new types of targets and new types of matches. As example, using the extensions
    that come with iptables, it is possible to block packets that come from a specific
    Media Access Control (MAC) address. This would allow the filtering of all packets
    from a specific interface of another host without affecting the traffic coming
    from other interfaces of that same host.


    That is one example of the control possible with iptables. While many extensions
    are available, they will not cover the needs of everyone. Fortunately, it is possible
    to design'
