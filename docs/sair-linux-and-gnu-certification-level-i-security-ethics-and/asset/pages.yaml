  md: '# Editing Global Options


    # Purpose


    The purpose of this lab is to demonstrate different methods of making default
    user accounts more secure by editing the global options for user accounts located
    in the /etc directory.


    # Theory


    One of the most likely places for a security breach to occur is in the user environment.
    Once an attacker has access to a user environment, he or she is able to tamper
    with default account, as well as gather or damage sensitive information on the
    system or on other user accounts.


    # profile


    The /etc/profile file designates the default system-wide environment settings
    and startup programs. While any user can change the settings for his or her account,
    a standard must be initially set so that accounts can be established with default
    parameters. The following is an example of the profile parameters for a user account:


    ```

    ulimit      Sets the amount of resources available.

    umask       Sets the permissions using an octal number to 777.

    ```'
  merge: -1
  pgno: 260
