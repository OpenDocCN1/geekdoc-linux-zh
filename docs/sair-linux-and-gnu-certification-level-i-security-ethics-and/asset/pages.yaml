  md: '# Security Auditing Tools


    Security auditing tools can be extremely useful for any user who is trying to
    create or maintain a secure system. These utilities are a valuable resource for
    detecting configurations that could turn into a security problem.


    Auditing tools are useful because they are able to quickly scan a system and report
    any security vulnerabilities found. Using these utilities, an administrator can
    scan his or her system and get a good overall idea of how strong the system''s
    security is.


    These utilities are worth scanning either local or remote hosts for known security
    problems. Problems include mine of FTP that is susceptible to buffer overflow
    attacks or to poorly chosen passwords. This information can be very useful when
    attempting to secure a system.


    Unfortunately, administrators are not the only ones who can use these tools to
    analyze the security of a particular system. Some of these utilities have the
    ability to scan hosts, attackers can scan systems to find entry points or weak
    spots in a system. The possibility of attackers using these tools against you
    should be motivating to review a system''s security with auditing tools and to
    remove the reported security issues.


    Two of the most common auditing tools are Tiger and SAINT. Both of these tools
    are excellent for analyzing the systems on our network. Tiger and SAINT are described
    in more detail in the remainder of this section.


    A good list of other security auditing tools and links to download sites can be
    found at http://www.linuxvalley.com/docs/guidepl/lasgw-intrusion-scanning/index.html.
    Some tools are more specialized, which could be beneficial to those administrators
    attempting to secure a particular point in their system''s security.


    # SAINT


    SAINT stands for the Security Administrator''s Integrated Network Tool and is
    the sequel to the older utility SATAN. SAINT is almost completely configurable,
    and includes an HTML interface that makes it very easy to use. It can even be
    used remotely via a Web browser. Installation files and instructions are available
    at www.wwdsi.com/saint.


    SAINT can be used at the command line or in HTML format, depending on what options
    are selected. Most of the command-line options are used to override the configuration
    variables in the config/saint file. A complete list of switches is available in
    the SAINT man pages. Some of the most common command options are:


    +   -a This option allows users to set the attack level 0 through 4, where 0 is
    the least secure setting and 4 is the most secure setting.

    -r Remote mode allows remote hosts to connect and use SAINT with a browser. SAINT
    prompts for passwords when running in remotemote. Passwords are required to access
    the Data Analysis and Documentation sections.

    -h [IP] This option specifies which IP addresses are allowed to use SAINT remotely.

    -o [pattern] When using this option, SAINT will only scan hosts whose IP addresses
    match the specified pattern.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# System Utilities 137


    These options can also be configured using SAINT''s interactive mode, accessed
    through a Web browser.


    When in interactive mode, users can alter SAINT''s configurations by following
    the Config. Mgmt link. From this location, users can select from the given options
    to specify in great detail how SAINT''s scan run. Users should be cautious when
    using this mode of configuration, since changes are directly written to the configuration
    file.


    Once a user has configured SAINT properly, he or she should simply enter the Target
    Selection section and specify an IP or hostname to scan. SAINT will attempt to
    connect to the specified host and scan. Scan results can be found in the Data
    Analysis section. In non-interactive mode, results are displayed on stdout.


