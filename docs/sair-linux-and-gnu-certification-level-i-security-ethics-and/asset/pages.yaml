  pgno: 221
- img_proc: true
  md: '# Troubleshooting 201


    # Check Basic System Integrity


    When investigating a cracked system, everything should be examined. Any programs,
    commands, or utilities may have been altered, eliciting undesirable results. Some
    changes may be more active than others. For example, perhaps every time the ls
    command is, a random file is deleted, or an unnoticed version of netstat allows
    an intruder to surreptitiously reenter a system once it is back online.


    The first step should be to make sure an intruder has not added cron or jobs that
    will execute when least expected. Regularly check the crontab file, and carefully
    edit the at.allow, at.deny, cron.allow, and cron.deny files in the /usr/lib/cron
    directory to make jobs are not set by unauthorized users.


    In order to determine that basic system binaries have not been tampered with,
    they must be checked for inconsistencies. This can be done using predetermined
    checksums. Using MDS checksums is a reliable method of rooting out file inconsistencies.
    Using the sum utility is not recommended; however, altering a file''s checksum
    such that it remains consistent with sum calculations beyond the capabilities
    of crackers.


    Sometimes intruders will gain access to a system by giving a standard command
    from a user account. Because of this, it is important to review all commands to
    check for unusual file permissions. This can be done with the find command in
    the following arguments:


    ```

    find -type f -perm -4000 -ls

    ```


    This will list files with permissions. Also, check for any files changed within
    the time frame of the intrusion. The find command can also be used for this as
    follows:


    ```

    find -ctime -2 -ctime +1 -ls

    ```


    This will list all files changed between one or two days.


    Look for any unusual processes with the rpcinfo command. Also, check any processes
    invoked by inet, as these are often exploited, and check /etc/services for odd
    processes.


    Table 6.1 includes other files that are exploited to obtain access to a system.
    These files should be checked thoroughly for tampering.

    The list in Table 6.1 is not complete. Remember that other files should be checked,
    such as /usr/etc/in.* and /lib/libc.so.*. If time is not possible for a full investigation
    of files, re-install a clean copy of the operating system to be sure that no basic
    system files are overlooked. If this is done, however, patch any security holes
    the intruder may have used to gain access.


    # Verify Account Integrity


    Account integrity must be thoroughly checked to ensure that an intruder has not
    gained access to another user''s account, set an account of his or her, or taken
    advantage of system accounts. While accounts can be compromised in many ways,
    the steps outlined in the following sections should always be taken after a system
    intrusion.'
  merge: -1
