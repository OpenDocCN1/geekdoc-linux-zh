- img_proc: true
  md: '# Solutions for an Insecure World


    What should users do to protect themselves? There are several methods of security
    planning. Protect a system from inside and outside attacks by using encryption
    to send emails or from FTP. Change passwords regularly, and never write them down.
    Set firewalls to protect networks. Set up tripwires to send an alert if an unauthorized
    person does gain access. Monitor security pages like CERT/CC, found at www.cert.org,
    for information about the latest security vulnerabilities and the patches for
    those holes.

    Not give out your password unless it is necessary. Perform backups on a regular
    schedule and keep the backup tapes or CDs in a safe, fireproof place. Put good
    locks on the doors. There is no way to be completely secure; it is only possible
    to take precautions by learning and fortifying the vulnerabilities of your system
    or network and creating backup measures to minimize the effect of a security breach.


    # Trust Trust


    Knowing what software is trustworthy is one of the most important steps in securing
    your system. This section discusses how to minimize security risks involved in
    system administration.


    # Know What You Are Trusting


    Ken Thompson, co-creator of the Unix operating system, brings an important security
    issue to the frontend in his article, "Reflections on Trusting." Thompson describes
    the steps he used to insert a back door into the Unix login command. The C compiler
    inserted the back door into the login command. Changing the login source manually
    would be easy to detect and fix, but by building the back door into the compiler,
    Thompson was assured that his back door would be present as long as that C compiler
    was used to build the login command. This step required the modification of source
    code, which could be easily detected by simple inspection. Thompson modified the
    compiler again, recognized when the C compiler was compiling its own source code.
    While an administrator believes the compiler is safe to use, since it was compiled
    from clean source code, Thompson''s special code reinserts the original back door
    into the C compiler. When the supposedly clean compiler is used to recompile the
    login command, the back door is again placed into the login command. This relatively
    simple process provides Thompson with an almost undetectable, permanent back door
    into the system.


    Thompson''s article and the steps described in it should prompt administrators
    to be cautious when deciding what is safe and trustworthy. It proves that properly
    placed trust and assumptions can be a devastating effect. Administrators should
    consider the origins of the software they are using to avoid insecure situations.


    Another example of misguided trust is found in "The Process of Security," an article
    by Bruce Schneider. This article is concerned with administrators and users placing
    too much trust in security products, patches, and software fixes.'
