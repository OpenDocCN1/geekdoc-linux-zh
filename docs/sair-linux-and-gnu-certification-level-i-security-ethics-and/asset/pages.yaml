    or no password at all. It is not necessary to provide any regular user with the
    root password for a system; Sudo only requires that the user know his or her own
    password. In this way, Sudo provides a higher level of security by limiting the
    number of users who need the root password in order to perform necessary operations
    on a system.


    # Obtaining and Configuring Sudo


    To download Sudo, one should visit the main Sudo site at www.courtesan.com/sudo.
