  md: 'may be accomplished in many ways, from installing new distributions with completely
    new kernels to patching an existing kernel with new source code. This section
    focuses on upgrading a kernel through patching.


    # Description of Kernel Patches


    The core of the Linux operating system is the kernel. The collaboration of thousands
    of programmers worldwide has led to the continued development and improvement
    of the kernel, rapidly adding functionality to it. Thus, the kernel (and Linux
    itself) represents a work in progress. Although it is more secure than most operating
    systems, the Linux kernel is not immune to security breaches. Adding features
    and functionality to the kernel provides a cracker with more access points and
    potential security holes. Because the kernel is the core of the Linux operating
    system, security weaknesses can open the entire system to security problems. However,
    security breaches can be fixed with additional code, commonly referred to as patches.
    The ability to patch a kernel strengthens it and makes it more beneficial to the
    end user. The collaborative efforts of the Linux community allow patches to be
    quickly developed and available over the Internet.


    The kernel is an intermediary between the system hardware and the software, controlling
    system calls, process ids, command executions, and so forth. If a user can tamper
    with this, he or she can gain access to any file stored on the system. An unauthorized
    user may change his or her identification with root''s identification, resulting
    in the unauthorized user gaining root access to the system. Often, security measures
    rely on services provided by the kernel to implement preventive measures. When
    the kernel is compromised, the security offered by these features becomes useless
    because they are not to run, or they grant unauthorized access.


    The Linux community can quickly develop a patch to fix these security holes once
    they are discovered. To maintain a secure system, the administrator must be aware
    of security bugs affecting the kernel and be able to apply the appropriate patch.
    Administrators should also compare the benefits of applying a patch to the existing
    kernel to compiling a new stable kernel.


    # Prerequisites of Kernel Patching


    With all major system modifications, the first step in patching the kernel is
    to make a backup of all important data. A working copy can be done easily by copying
    it to another name. For example, cp /boot/mlinux /boot/mlinux.old copies the kernel
    image without changing lilo.conf. In the event that the patched kernel does not
    work properly, the old kernel can be restored by renaming vmlinux.old.


    A patch will correct a bug in the kernel or add a feature, but some patches may
    conflict with existing hardware or software. Before patching a kernel, the effect
    of each patch should be determined. Likewise, the appropriate patch version for
    the kernel should be applied.'
