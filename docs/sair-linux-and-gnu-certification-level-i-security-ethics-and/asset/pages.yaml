    # Webmin


    In the world of Unix and Linux, it is typical for each application to have a different
    configuration file format. The sophistication of these files can sometimes be
    overwhelming, especially when learning more than one at a time. Webmin can help
    by allowing the management of nearly all of the systems from a Web interface.


