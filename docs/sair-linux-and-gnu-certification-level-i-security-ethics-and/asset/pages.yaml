  md: 'configured to read only certain types of data, such as passwords, Web address,
    or e-mail. Sniffing is becoming more difficult as switches start to replace network
    hubs. Switches selectively retransmit data, making sniffing almost impossible.
    This differs from a hub, which will indiscriminately broadcast all packets. The
    data is no longer broadcast to all systems, a sniffer in promiscuous mode would
    only be able to retrieve packets for its IP address.


    While sniffers may be used for unauthorized monitoring, they are most commonly
    used by system administrators to maintain an efficient network. Administrators
    can use packet sniffers to log network traffic for intruder detection, discover
    network errors, and analyze network performance.


