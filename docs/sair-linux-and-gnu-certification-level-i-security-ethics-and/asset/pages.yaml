    # Update Software and Patch Security


    It is important to keep a system updated with the latest security software and
    patches. This is easily done by joining security mailing lists or newsgroups,
    and by checking vendor Web sites for patches and news. Do not assume that updated
    security software alone will safeguard your system. Any software on a system can
    create security holes that some security programs will not recognize as a threat.
    Because of this, be sure to keep all software on your system updated.


    Additionally, a firewall is the best way to keep outsiders from accessing a network.
    If a firewall is not already installed, consider implementing one as part of system
    security.


    # Put the System Back Online


    Once it is determined that all remnants of an intrusion have been erased and the
    system is reasonably secure against further attack, it should be safe to put the
    system back online. After doing so, you should monitor the system and all network
    connections closely for unusual activity; it is likely that the intruder will
    return and attempt to reenter the system. For this reason, obtain and install
    the identity daemon, which allows you to monitor account usage. Never assume that
    a break-in will not reoccur.


    > NOTE If there is any doubt that the system still may be compromised, a reinstall
    may be required before putting the system back online.


    # Follow-up Procedures


    In addition to close system monitoring, a few steps should be taken following
    an intrusion. Exactly when some of these actions are taken is determined by how
    fast a system must be restored. However, they should not be overlooked.


    # Deal with the Intruder


    If the intruder is identified, several courses of action can be taken. First,
    contact the intruder directly. This ranges from e-mailing or personally addressing
    the intruder and asking that he she cease activity, having law enforcement agencies
    handle the situation. If there is no protocol for security breaches in a security
    policy, this decision is made by the system administrator. Consider whether the
    intruder might take drastic action to retaliate against a request to stop his
    or her activities. If this is the case, make'
