  md: '# Shells and Commands 95


    # grpck


    Much like the pwck program, grpck checks the integrity of the group file, /etc/group,
    and its /etc/gshadow. It verifies that all the entries are formatted properly
    and contain valid data in each of the fields. Grpck makes sure that entry contains
    the correct number of fields, a unique group name, and a valid list of members
    and administrators.


    If the program discovers an entry is incorrect because of the number of fields,
    the user will be prompted to delete the entry. If it is declined, the program
    will not ask to delete another entry if more errors are encountered. The user
    will be prompted to delete the entry, if grpck discovers that an entry''s group
    name is not unique. In this case, if the user declines, further checks will continue.
    Additional problems that are found will display a warning. The user should enable
    the groupmod command to fix these problems.


    The syntax of grpck is identical to pwck:


    ```

    grpck [-r] group shadow

    ```


    The -r options forces grpck into read-only mode. In read-only mode, grpck will
    not ask the user to make any changes, but will still inform the user if there
    is a problem with the tested file.


    # User Environments


    The user environment is a very important aspect of overall system security, and
    one that should not be overlooked when configuring user accounts. The degree of
    system vulnerability of a user''s environment is controlled not only by the foresight
    and precautions taken by a system administrator, but also by the intentions and
    abilities of that system''s users. Failure on the part of the individual user
    to properly secure his or her account environment could prove detrimental to everyone
    on a system.


    Since the user environment is the user''s chief point of interaction with a system,
    it is the most likely place for a breach of security to occur. Just because a
    user may not have root or superuser access does not mean that he may not be capable
    of acquiring or damaging system information, or that another user would not be
    capable of using his account for those purposes. Due to these reasons, there are
    several steps that users may take to restrict others access or prevent accidental
    system damage. This examines a few utilities available to users that would provide
    a greater level of control over potential security problems associated with their
    accounts.


    # umask


    File permissions are a very important part of Linux security. With the system
    of file permissions by Linux systems, users may control access rights to files
    and directories on multiple levels. To properly secure a user account, one must
    have an understanding of how file permissions work; otherwise, a user may be unknowingly
    providing others with the access to read or change confidential or sensitive information.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Chapter 3


    One to safeguard files and directories created within a user account is to implement
    the umask utility. The file permissions mask is the set of permissions that are
    automatically attached to the files or directories created within a user''s shell.
    The umask utility is used to set or display the permissions mask associated with
    files or directories created by users. For example, if the file permissions mask
    is set to 022, then files created with permissions set to 777 will be created
    with permissions set to 755. Essentially, the value of the file permissions mask
    is subtracted from the standard value of the file being created. Using the umask
    utility will allow users to have all files and directories created within a user
    account automatically assigned a set of permissions. This will prevent a cracker
    from inadvertently creating a file or directory that would provide a cracker with
    access to an account or other areas of the system.


    In order to display the current setting of the file permissions mask, simply type
    umask with no arguments at the command prompt. To change the value of the desired,
    use the following syntax:


    ```

    $ umask [xxx]

    ```


    [xxx] is the three-digit value to which the file permission mask is to be changed.
    Once the value of the file permissions mask has been changed, the permissions
    value of any file or directory created thereafter will be set accordingly. The
    umask command may be inserted into the .bashrc file in order to have the file
    permissions mask set to the given value at each login.


    # autologout


    One of the most dangerous loopholes facing a system is an unattended terminal.
    Not only does this give crackers another username to hide behind, but it also
    provides a cracker with an opportunity to make changes that he or she could later
    use for malicious purposes from outside the account. For example, suppose a cracker
    notices that a coworker at a neighboring workstation has gone to lunch and left
    himself logged in. Unless the cracker has locked his screen, the cracker has several
    malevolent options available. He could insert a Trojan horse, or a .forward file
    that would send his coworkers e-mail anywhere in the world, or simply delete all
    files in the directory. One especially dangerous possibility is that the cracker
    may copy the coworker''s shell. This would provide the cracker with access to
    his coworker''s account whenever desired. Unless someone literally sees the cracker
    perpetrating his coworker''s account, there is no way to trace his tracks.


    To safeguard this, you may take advantage of the autologout shell variable to
    have his or her terminal automatically log the user out after a given period of
    inactivity. The autologout variable is available under most, but not all, versions
    of the C shell. In order for a user to set the period of inactivity that must
    take place before automatic autologout will occur, he or she should add the following
    line to the .cshrc in his or her home directory:


    ```

    set autologout=[minutes]

    ```'
  merge: -1
