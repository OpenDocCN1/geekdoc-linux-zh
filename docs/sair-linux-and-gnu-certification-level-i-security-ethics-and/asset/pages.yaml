  md: "# ftptd Server Process\n\nftptd is the standard daemon provided in Linux distributions\
    \ to handle file transfers to and from the system. Before an anonymous FTP server\
    \ can be used, ftptd must be properly initiated.\n\n# How to Initiate ftptd\n\n\
    ftptd is handled by inetd. In order to initiate ftptd during startup, the inetd\
    \ configuration file /etc/inetd.conf must contain the following line:\n\n```\n\
    ftp tcp nowait root [pathname] [filename] [options]\n```\n\nThis line tells inetd\
    \ that FTP will use TCP and ftptd should be spawned every a new FTP connection\
    \ is made. The path name should be the full path to the FTP daemon. For example,\
    \ if ftptd is located in /etc, with the logging option enabled, the line will\
    \ be:\n\n```\nftp stream nowait root /etc/ftptd ftptd -1\n```\n\nThis line is\
    \ present in most Linux distributions; however, it may be commented out. Simply\
    \ remove the comment symbol to activate ftptd the next time inetd is run at system\
    \ startup.\n\n# Command Line Options\n\nThe following are some options that can\
    \ be used at the command line when configuring ftptd:\n\n+   -a\tEnable use of\
    \ ftppass configuration file.\n-A\tDisables use of ftppass configuration file.\
    \ This option is set by default.\n-d\tDebugging information will be written to\
    \ the syslog.\n-i\tFiles received will be logged to the xferlog unless ftppass\
    \ or the -X switch is being used.\n-I\tDisables the use of RFC931 for determining\
    \ client user name.\n-l\tSessions (failed and successful logins) are logged to\
    \ syslog.\n-L\tAll commands sent to server are logged to syslog.\n-o\tFiles transmitted\
    \ will be logged to xferlog unless focus or the -X switch is being used.\n-p ctrlport\t\
    Specifies the control port used by the daemon. Normally specified in /etc/services.\n\
    -P dataport\tSpecifies the data port used by the daemon. Also normally designated\
    \ in /etc/services. This is usually the port prior to the connection port.\n-q\t\
    Enables the use of PID files to determine whether the user limit per user class\
