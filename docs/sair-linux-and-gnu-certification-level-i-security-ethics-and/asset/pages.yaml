- img_proc: true
  md: '# Using Kerberos


    Using Kerberos is more or less straightforward for the user, as the complexity
    of the authentication and ticket-granting processes are not seen. Since the options
    and functionality of the Kerberized clients are essentially the same as their
    nonKerberized counterparts, the users should have no problems using the Kerberized
    versions.

    The user must run the kinit program to get a TGT to connect to Kerberized application
    servers. For example:


    ```

    $ kinit

    Password for fred/users@LUCASDIGITAL.COM:

    "enter password"

    ```


    If the user wishes to connect to an application server with the login or telnet
    programs, all the user must do the program. The user is not required to enter
    another password as long as the TGT is valid. Instead, login the cached TGT to
    request a ticket to connect to the application server. The user will see the following:


    ```

    $ login henry.lucasdigital.com

    Last login: Mon Aug 15 11:23:54 from...

    ```


    The user can get a list of all active tickets by the klist command, and if the
    user is done with his or her active tickets, the kdestroy command can be used
    to delete these tickets.


    Kerberized versions of ftp and rcp are provided for securely copying files between
    computers. After the kinit program is run, the user does not have to enter a password
    to use ftp or rcp. Again, these programs are almost exactly the same as their
    non-Kerberos counterparts.


    # One-Time-Password Systems


    Technology is growing at such a rapid rate that methods and procedures once considered
    are now obsolete. Static passwords, once one of the most basic forms of security,
    are no longer considered a sound means of protecting a computer system. Consequently,
    new password systems have been developed to increase security for computer systems.


    # Advantages of One-Time-Password Systems


    One of the more widely used methods of increasing password security is the onetime-password
    system. A user may gain access to a one-time-password computer system by entering
    a password specifically generated for that session. Once logged out, the password
    is discarded, and a new password is necessary to gain access in the next session.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Static Password Systems


    The following procedure describes the use of a static password system. The user
    is prompted by the computer system to enter a username or another form of identification.
    The user then logs in a password that is correlated with the computer''s password
    files. Matching usernames and passwords are accepted, and non-matching usernames
    and passwords are rejected. In this static password system, no encryption utilities
    are used to transmit the password from remote logins.


    The disadvantages of this kind of system are not readily apparent, as a potential
    intruder would have to know a username and the matching password to gain access
    to the system. Unfortunately, this information is no longer difficult to obtain.
    An intruder may use a number of different methods to gain this information.


    # Cracking a Static Password System


    The crack program uses a dictionary as a database and enters every word and permutations
    of those words as possible passwords. The crack program is often successful, and
    of it are easy to obtain over the Internet.


    A network-sniffing program, such as sniffit, may also be used to steal passwords.
    Sniffit will monitor a hub or LAN, and display any information passed between
    those computers. Every time a user logs on, his or her username and password are
    shown in plain text; sniffing programs may easily obtain these passwords as they
    are routed through the network.


    There are less technical methods for stealing passwords. A user in a relatively
    public location may be observed while entering his or her login and password.
    Intruders can also use joins, passwords identical to the username, to gain system
    access. There are simple programs available for the detection of such passwords.


    # One-Time-Password Systems


    By using a one-time-password system, the theft of a password has little consequence.
    A stolen password is obsolete, because passwords are changed every session. To
    gain access to the system, the potential intruder must predict what the new password
    will be. A one-time-password system eliminates the use of joins and other predictable
    passwords, because passwords in this system are assigned. However, just as is
    the case with a static password system, the security of a one-time-password system
    is defined by how carefully the user guards the pass phrase.


    # S/Key


    S/Key is considered the forerunner of the one-time-password system. S/Key was
    developed by Bell Communications Research (Bellcore) during 1994. Since then,
    Bellcore has become Telcordia Technologies and has stopped developing and maintaining
    S/Key. Although S/Key is still in use today, it has been primarily replaced by
    its successor, OPI.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# OPIE


    After Bellcore stopped maintaining S/Key, a new one-time-password system was needed.
    Consequently, the U.S. Naval Research Laboratory developed and freely distributed
    One-time Password In Everything (OPIE). OPIE was based on S/Key and is somewhat
    compatible with the original program.


    # How OPIE Works


    A user must first establish an OPIE account from a secure terminal. Forming an
    account remotely is not recommended. The user is then asked to provide a pass
    phrase, at least 10 characters long, with their account. This pass phrase will
    later be used to generate one-time passwords.


    Once an account is established, the user can begin using one-time passwords. The
    user will log in with his or her login name, and the computer will respond with
    a challenge. The challenge consists of an algorithm declaration, a sequence number,
    and a seed. The computer will then ask for a response or password. The user must
    have specific calculating software to generate a response, and the MD4 response
    algorithm used must be compatible with S/Key systems. It is also important that
    the algorithm specified in the challenge is the same one used in the calculation.
    An example of a user logging in to an OPIE system follows:


    ```

    login: user

    otp-md5 469 kb63492

    Response: [WORD1] [WORD2] [WORD3] [WORD4] [WORD5] [WORD6]

    ```


    The output line otp-md5 469 kb63492 is the challenge, consisting of the algorithm
    declaration (otp-md5), the sequence number (469), and the seed (kb63492).

    The user must enter the initial pass phrase used to establish the account, the
    sequence number, and the seed into the calculating software. The sequence number
    is an arbitrary number that steadily decreases by each time it is used. The seed
    is a combination of letters and random numbers. By default, the seed is the first
    two letters of the host and five random numbers.


    All three elements are hashed, or computed, using the one-way algorithm specified
    in the challenge. After the three ingredients are hashed, the calculating software
    will display the sky phrase constituting the one-time password or response. The
    computer will compare the response with its own counts and allow or disallow entry
    depending on whether they match. If the user logs out and logs back in, the sequence
    number will be decreased by one and the procedure will have to be repeated to
    generate the new password.


    Other options in OPIE are the commands mickey and apieinfo. A user can print a
    list of future seed and sequence numbers with these commands. This list is used
    to develop future passwords in case the user will be logging in without the calculation
    software.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'OPI makes most passive system attacks ineffective. Passwords stolen by Sniffit
    are of no concern, because they have already expired. Passwords stolen by simple
    monitoring are unimportant for the same reason.


    The main advantage of using OPI is that it is still being maintained. The latest
    version of OPI, patches and collaborating software are available at www.inner.net/opie.


    # Disadvantages of OPIE


    Logging in is a more complicated process when using one-time-password systems.
    For remote access, it is necessary to have the right calculating software. This
    prevents users from being able to quickly log in wherever they choose. However,
    users are afforded the option of printing a list of passwords beforehand, which
    they can physically carry and use to log in. The risks here are the same as with
    any written password. The list could be stolen, lost, or copied, leading to a
    potential break-in.


    OPIE may foster a false sense of security. Users may assume that such a complicated
    process would be completely secure. However, it is important to remember that
    an intruder only needs a user''s pass phrase to gain access. The rest of the information
    (i.e., the calculation software, username, seed, and sequence number) is fairly
    easy to get. Again, security of the system is limited by how the user guards the
    pass phrase.


    Although it is unlikely that an intruder would be able to crack all six words
    in the pass phrase, it is not impossible, and consequently, OPIE is still vulnerable
    to attack. With faster processors and better technology, these odds continue to
    increase in favor of the intruder.


    # Using OPIE with PAM


    Pluggable Authentication Modules (PAM) is a utility used to simplify authentication.
    Instead of allowing network utilities to independently verify users, PAM combines
    the utilities, forcing a central location or bottleneck. This simplifies the process
    of adding new authentication software, such as OPIE.


    In order to add OPIE to a PAM server, the configuration file for PAM must be modified.
    Add the module for OPIE to the PAM login file; the typical location for the PAM
    login file is in the configuration directory, etc/pam.d or etc/pam.conf. An example
    for the OPIE authentication field added to the login file would be as follows:


    ```

    auth      sufficient /lib/security/pam-opie.so

    ```


    The PAM for OPIE may be obtained at www.tho.org/~andy/pam-opie.html.


    # Logfile Monitoring


    Unix and its subsequent variants (including Linux) have extensive logging capabilities
    included in their system installations. Unfortunately, these logs can be arcane
    in their'
  merge: -1
