  md: '# The Sair Linux GNU Code of Ethics


    The purpose of this code is to provide the reader with an analysis of accepted
    industry standards that have emerged through extensive peer review and development
    by professional societies. Sair''s reason for providing this information is that
    its familiarity and practice have proven beneficial in the workplace. The principles
    stated here form a framework for making ethical decisions, but do not guarantee
    a definitive solution in all situations. Often, the best solution can be obtained
    by incorporating the ideas presented here with reasonably founded personal judgment.


    As an IT professional, I will abide by the following:


    +   I. To respect confidentiality of information in matters which are consistent
    with public interest.

    II. To investigate and report violations of intellectual property laws, and to
    inform the offending party or parties of any infringements.

    III. Conform to appropriate professional standards to accomplish specific goals,
    except in ethically justifiable situations.

    IV. Strive to acquire knowledge in my field and educate those requesting assistance.

    V. To report any fraudulent or incorrect data and inform all involved parties.

    VI. Ensure that conflicts of interest, which cannot be avoided in a reasonable
    manner, are resolved by collaboration among all involved parties.

    VII. Ensure all parties that are held to standards have fair exposure to competence
    of those standards, and are provided the ability to express their opinions and
    concerns about such standards.

    VIII. Not to promote personal interests when making decisions for the company.

    IX. To give reasonable credit to all involved parties.

    X. To uphold the GNU copyleft agreement.

    XI. To preserve the integrity and security of information.

    XII. To truthfully represent one’s skills and abilities.'
