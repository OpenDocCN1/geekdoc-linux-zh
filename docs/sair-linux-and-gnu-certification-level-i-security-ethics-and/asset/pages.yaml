- img_proc: true
  md: '# Bastille


    Bastille''s creators billed it as a hardening system, meaning that it provides
    a way to intensify security on a network. Bastille can be downloaded from www.bastille-linux.org
    as a series of Perl scripts, which are used through ncurses display to configure
    the system''s security settings. The 16 major features included with Bastille
    are listed in Table 5.6.


    Modules for each of these features can be enabled or disabled as desired by the
    system administrator, and can be used for in-depth configurations of certain security
    aspects. For example, the FTP section can configure all aspects of the FTP server,
    by allowing anonymous logins to the size of files that can be transferred through
    FTP. Because of this versatility, Bastille is a quick and simple way to provide
    comprehensive measures on an otherwise not secure system.


    **Table 5.6** Bastille Features


    | FEATURE | FUNCTION |

    |---|---|n| User Account Security | Strengthens user account security by setting
    password aging, disabling r-protocols, etc. |

    | Apache Configuration | Can disable the Web server or restrict the interface
    on which it is accessed |

    | Boot Security | Places restrictions on LILO |

    | Pluggable Authentication Modules (PAMs) | Restricts use of exploitable system
    resources |

    | Domain Name Server (DNS) | Disables DNS and takes away its root privileges |

    | Disabling of User Tools | Restricts a system to root access only |

    | FTP | Restricts FTP access |

    | File Permissions | Allows stronger restriction of administrative files |

    | ipchains | Provides firewalling functionality |

    | Patch Downloads | Provides up-to-date security by downloading and installing
    patches |

    | Printing | Removes exploitable privileges from print services |

    | Remote Access | Provides secure shell functionality |

    | Inetd Service Security | Disables unnecessary services |

    | Sendmail | Disables reception of mail with Sendmail |

    | System Daemons | Deactivates unnecessary exploitable daemons |

    | System Logging | Provides extended logging of system events |'
  merge: -1
