- img_proc: true
  md: 'Web (HTTP) servers, preventing the Web site from being viewed. However, any
    TCP-based network services (FTP, SMTP, IMAP, etc.) can be affected.


    When a client initiates a TCP connection with a server, several messages are exchanged
    between the two. The client begins by sending a SYN message to the server indicating
    that it would like to open a connection. The server replies by sending a SYN-ACK
    message back to the client. To complete the connection, the client sends an ACK
    message back to the server. Figure 1.1 illustrates the connection process.


    The server will wait a specified amount of time for the ACK message, which is
    where the potential for abuse lies. When a SYN flood is carried out, the client
    sends the ACK message back to the server. Since the server allocates memory for
    each connection, a large number of connections purposely left open in the server''s
    memory being wasted, causing the service to no longer accept new connections.
    Although the connection will eventually time out, the attacker can reinforce the
    attack faster than the connections will expire. Therefore, the attacker can prolong
    the attack for as long as he or she wishes.


    # ICMP Flooding


    Similar to SYN floods, ICMP echo floods, or ping floods, work by overwhelming
    a host machine with too much information, severely slowing the system or the network
    connection or both. These attacks use the ping command that utilizes the Internet
    Control Message Protocol (ICMP). The command is usually used to send a test message
    to the IP address of a machine on the Internet to see if it is alive. If the machine
    is alive, it will send a response to the first machine. Ping can be a useful tool
    in tracking down network and bandwidth problems, but unfortunately, it can also
    be used to cause problems.


    The attack occurs when large numbers of pings are sent to a machine at one time.
    Usually, they are carried out when the attacker has more bandwidth than the victim
    has. This way, the attacker can send pings faster than the victim''s machine can
    respond. A factor connection is not needed if the attack is sent out with a spoofed
    IP, since the responses will never reach the attacker. (IP spoofing is discussed
    later in this section.) The victim''s machine will waste system resources and
    bandwidth attempting to respond to the pings. In addition, if the victim is using
    a modem to connect, this may cause the modem to disconnect.


    | Client | Server |

    | --- | --- |

    | 1. SYN | |

    | 2. | SYN-ACK |

    | 3. ACK | |


    **Figure 1.1** TCP connection process.'
