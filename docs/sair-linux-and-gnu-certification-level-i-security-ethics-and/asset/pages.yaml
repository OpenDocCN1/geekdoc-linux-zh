- img_proc: true
  md: '# Theory


    A successful GnuPG user should be able to create public and private keys and distribute
    the public key to a key server. The methods for accomplishing this are covered
    earlier in the manual. Follow these steps in the specified order to set up encrypted
    mail transport gpg:


    +   1. Create the recipient keys.

    2. Create the sender''s keys.

    3. Export the recipient''s public key.

    4. Import the recipient''s public key and add it to the sender''s key ring.

    5. The recipient''s key must be signed with the sender''s private key.

    6. Secure or remove the sender''s private key.


    After becoming familiar with the previous processes, encrypted files can be manipulated.
    For a concise reference on these processes, the GnuPG mini-how-to at URL http://www.dewinter.com/gnupg_howto.


    One of the most common problems of GPG involves compatible interaction between
    machines that use other data encryption tools, such as Pretty Privacy (PGP). The
    common versions of PGP are 2.6.x (PGP2) and 5.x (PGP5). PGP2 uses the RSA algorithm
    for key generation and the IDEA algorithm for file encryption. PGP5 uses the DSS/DH
    for key generation, Triple-DES, and IDEA algorithms for data encryption. PGP5
    can decrypt data that has been encrypted with the PGP2-dependent RSA algorithm,
    but PGP2 is not compatible with keys encrypted with the DSS/DH algorithms from
    PGP5. GnuPG does not use algorithms that adhere to any patent limitations for
    its encryption; instead, it uses the Digital Signature Algorithm (DSA/ElGamal).


    # Lab Exercises


    In order to take advantage of the encryption techniques provided by PGP2 and/or
    PGP5 while using GPG, and vice versa, the following may prove helpful.


    +   1. Convert from PGP to GPG. While using PGP, a user can obtain the recipient''s
    public key from a key server with the following command:

    pgpk -a http://`keyserver`*/key location

    This key acquisition process can be performed while using GPG:

    pgp --recv-keys `key ID` --keyserver name

    Available key server names can be found with the following command:

    host -l pgp.net | grep wwekkys

    2. After obtaining the key correct, convert the key to an ASCII file.

    pgpk -xa recipient > recipient.key

    3. gpg may now be used to import the key.

    gpg --import recipient.key'
