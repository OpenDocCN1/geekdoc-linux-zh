  md: '# Actions


    The action field tells syslog what to do with a message it receives. The message
    could be saved to a file locally, forwarded to a remote machine running syslogd,
    or be displayed on the screens of users who are logged in. Currently, two or more
    rules must be used because there are no provisions for multiple actions. A list
    of possible actions is found below Table 2.5.


    # Example syslog Configuration Files


    Here are some examples of what a syslog.conf configuration file might look like,
    for both local and remote logging.


    # Local Logging Examples


    Following are some basic examples of configuration files:


    ```

