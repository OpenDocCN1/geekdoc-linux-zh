  md: '# 204 Chapter 6


    ensure that an intruder does not have access to the system once informed that
    he or she has been caught. It is not advised to threaten an intruder, since he
    or she may do anything to cover her or tracks, including deleting entire directories
    or file systems.


    If highly sensitive information is involved, a law enforcement agency may be contacted
    to handle the situation. Whether to do this is at the administrator''s discretion;
    however, there are negative aspects of involving law enforcement agencies. In
    the course of the legal proceedings, they may choose to impound the cracked system
    indefinitely as evidence. Consider the necessity of taking legal action beforehand
    and always consult superiors.


    # Inform Necessary Parties


    In most cases, several parties should be informed of a cracked system, as the
    users whose accounts have been tampered with and law enforcement agencies. Also,
    consider what extent the public should be informed. In some cases, a cracked system
    could concern clients and outside parties who rely on services provided by a network.
    Determine whether the intrusion is severe enough to alarm the public. Check to
    see if the system compromise is covered by insurance. In the event that it is,
    assess the overall damage and contact the necessary insurance agencies.


    # Update Security Policy


    Take time to review the existing security policy and make any necessary updates.
    Any time there is a security incident, various aspects of security for a network
    or organization are examined. Following an incident, make note of what was learned
    and add to the existing security policy for any issues that were not previously
    covered. This will prepare the organization for a similar event arise in the future.


    Following the steps outlined in this section may not completely cleanse a system
    of an intruder''s tampering; however, it provides a solid base for recovery.


