  md: "# super\n\nsuper provides all the specifications allowed by sudo, in addition\
    \ to a few. The super.tab file contains all the commands that can be executed\
    \ by super, as well as the user/group combinations with permission to execute\
    \ each command. It is possible to restrict use to particular users or groups on\
    \ specific hosts; a single super.tab file can be utilized over an entire network.\
    \ The following is an example of the super.tab file:\n\n```\n# This file is the\
    \ configuration file of super.\n# which commands super can execute for a user\
    \ as root.\n# For more information, see the super.5 manual\n\n# Global options\n\
    :global patterns=shell\n\n# Log super messages to a file under uid=sysmgr.\n#\
    \ (Note: loguid has to be part of same :global_options\n# entry as logfile).\n\
    :global logfile=/usr/adm/super.log loguid=sysmgr\n```\n\n```\n# Mail super error\
    \ messages to fouser (the default is\n# no mail)\n:global mail=*/usr/bin/mailx\
    \ -s **** super ****' fouser\n```\n\n```\n# Control the access printer hours before\
    \ and after\n# work.\n:define WorkHours(9:00-17:00)(mon,t,wed,thu,fri)\n# printer_commands\
    \ defines the commands specific users\n# will be able to use before and after\
    \ work hours (The\n# asterisk after the path is replaced by the command\n:define\
    \ printer_commands(enable,disable,lspat):/usr/bin/*\n(lp.lpqrm):/usr/lib/*\n```\n\
    \n```\n# The users who can use the line printer commands, and the\n# hosts from\
    \ which they can use the commands:\n:define printer_users fredmars@venus\n# During\
    \ the hours before and after work, the following\n# users can use the printer_commands\n\
    # (Note: \"time\" means not during work hours)\nSprinter_commands Sprinter_users\
    \             |time=$WorkHours\n```\n\n```\n# Restrictions on mounting Cdroms,\
    \ which is controlled\n# by the cdmount script.\n# The user shane@venus is the\
    \ only one authorized\n# to mount CDs\ncdmount             /usr/local/bin/cdmount\
    \         \\\n                     uid=root                        \\\n      \
    \               info=-Mounts a CD at mountpoint \"cdrom\"  \\\n              \
    \                              shane@venus\n```"
  merge: -1
  pgno: 312
- img_proc: true
  md: "# Writing Scripts for super\n\nTake extreme caution when writing scripts for\
    \ super. A great number of commands can be exploited for malicious purposes, when\
    \ run as setuid-root. Make sure the scripts accomplish only what is absolutely\
    \ necessary, and carefully regulate user.\n\nAlways check for side effects and\
    \ alternative uses of a script. For example, make sure the script does not invoke\
    \ the user's .cshrc file, or a similar file. A script could be written to allow\
    \ users to mount CD-ROMs by executing mount, but if it is not written carefully,\
    \ a user could mount a floppy disk containing something detrimental, as a setuid-root\
    \ shell.\n\nThe following are tips on creating super scripts:\n\n+   - Scripts\
    \ must begin with the # interpreter-path.\n\n+   - Some variants of csh will not\
    \ run setuid scripts unless the -b flag (force a break from option processing)\
    \ is set:\n  !/bin/csh -fb\n\n+   - If the super.tab file starts a shell, such\
    \ as csh or tcsh, the -b option should be included in the super.tab file. This\
    \ will prevent having to type it on the command line every time a line like the\
    \ following appears in the super.tab file:\n  SHELL /usr/bin/csh -fb scme_priv_user\n\
    \n> NOTE This only an example. Always check passwords before granting access.\n\
    \n+   - Safe csh scripts are harder to write than safe Bourne-shell scripts.\n\
    \n+   - The super call should be transparent to users, enabling them to type:\n\
    \  % ccdmount args\n  instead of\n  % s super cdmount args\n\n+   - Some programs\
    \ need certain directories in the path. Therefore, super scripts may need additional\
    \ directories, such as /etc or /usr/etc, for commands to function.\n\n+   - By\
    \ default, super only changes the effective UID. Some programs require the real\
    \ UID to be root. In such a case, the user should include an option, such as uid=root\
    \ or u+root, into the super.tab file.\n\n+   - A simple script to allow users\
    \ to mount the CD-ROM drive would be similar to the following:\n  !/bin/sh\n \
    \ echo Mounting CDrom\n  mount -t iso9660 /dev/cdrom /cdrom"
  merge: -1
  pgno: 313
