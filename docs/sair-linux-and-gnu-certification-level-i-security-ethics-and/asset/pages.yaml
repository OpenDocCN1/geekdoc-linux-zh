    # VPN Requirements


    This section discusses the basic architecture of a virtual private network (VPN),
    its requirements, and how to set one up.


    A VPN is a mechanism through which private networks can be simulated over a public
    network. Private networks, or intranets, are quite secure, and a VPN strives to
    achieve similar effect over an insecure public network.


    # Firewalls


    Since a VPN is a way of connecting two or more private networks that spread across
    the Internet, a mechanism is needed to protect these individual networks. For
    this reason, a firewall can be a useful tool. A firewall is a protective layer
    around a network that helps to keep away intruders from the Internet. Firewalls
    are intended for two main purposes:


    +   - To limit users of an internal network to remain within the network or to
    restrict their access to select machines on the Internet

    - To prevent or restrict access to machines within the internal network for an
    Internet user


    Firewalls achieve the required security by dictating the route packets take to
    access protected machines. There are few basic techniques through which firewalls
    can be built. The simplest form of a firewall can be built using the packet filtering
    system. Firewalls built using the packet filtering mechanism inspect every packet
    that traverses the gateway. Routers can be configured to accept or deny packets
    to or from specific IP address ranges. Routers typically scan the packet headers
    for their source IP addresses and can easily filter out undesirable packets. Scanning
    each and every packet for its source address is a costly affair, and packet filtering
    is a very restrictive technique of implementing because it does not allow user
    authentication. Various techniques have been proposed and implemented to mitigate
    these problems.


    # IP Masquerading


    IP masquerading allows a group of machines not directly connected to the Internet
    to access the Internet through a Linux machine that is already connected. This
    group of machines typically forms an internal network of machines that have no
    public IP address and are assigned private addresses. The private addresses assigned
    could belong to any one of the following categories:'
