  md: '# LAB XIX


    # # Securing Sendmail


    # # Purpose


    This lab discusses several methods for making Sendmail more secure, including
    file and directory ownership, file and directory permissions, and options within
    Sendmail itself.


    # # Theory


    Sendmail is used to handle over 75 percent of the total e-mail traffic on the
    Internet. Because of this widespread use, security-related bugs are often discovered
    within days of the release of a new version. While bugs that compromise security
    have been promptly addressed by the open source community, users who do not upgrade
    are still susceptible to attacks that exploit those bugs.


    It is impossible to completely secure Sendmail. Exploits are often quickly discovered
    and widely used, since Sendmail exists on many computers on the Internet. There
    are several things that the administrator of a system running Sendmail can do
    to prevent most system exploits.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Update Sendmail


    It is crucial to obtain the latest version of Sendmail. Earlier versions contain
    various bugs that intruders could use to obtain root access to a system. The most
    recent versions of Sendmail have corrected these bugs; in fact, Sendmail has not
    received any advisories from the CERT/CC in the past years. However, this does
    not prevent vulnerabilities due to careless errors by system administrators. Recent
    security updates of Sendmail have focused on preventing such errors by forcing
    administrators to remove default security options. The source for the latest version
    of Sendmail can be found at http://sendmail.net.


    # Built-in Security Measures


    To avoid running as root, Sendmail relies on three special users: DefaultUser,
    TrustedUser, and RunAsUser. These are users that exist for Sendmail but do not
    actually exist in the /etc/passwd file. These special users will refer to actual
    users in the password file when Sendmail uses them.


    # DefaultUser


    DefaultUser is the user ID for running mailers. If Sendmail is not running as
    a specific user, it will run as DefaultUser. At startup, Sendmail will run the
    command getpnam() for a user called mailnull. If the mailnull user has an entry
    in /etc/passwd, Sendmail will use UID and GID as DefaultUser. If mailnull does
    not exist, Sendmail will employ the User daemon. If mailnull or daemon are not
    defined in /etc/passwd, Sendmail will use UID 1 and GID 1. If the user mailnull
    does not exist in your /etc/passwd file, it should be created as a null user with
    no password and an invalid shell; the mailnull user should not own any files.


    DefaultUser is also used if Sendmail detects that it is intended to run as root.
    For example, if root has a .forward file in its home directory that runs a program,
    Sendmail will run that command as DefaultUser instead.


    # TrustedUser


    By default, root is the only user trusted by Sendmail. In some cases, you may
    want Sendmail to trust another user to own files and run automated scripts instead
    of root. In this case, TrustedUser is available, which defaults to root. Be careful
    when using TrustedUser; since Sendmail normally runs as root, it would not be
    difficult for a determined intruder who gains access to TrustedUser to obtain
    root access.


    # RunAsUser


    Although Sendmail normally runs as root, it only requires root access to bind
    the SMTP socket at startup. It is possible to force Sendmail setuid to another
    user, RunAsUser. Unfortunately, Sendmail will be forced to run with the permissions
    of RunAsUser instead of root. The default user for RunAsUser is also root.'
