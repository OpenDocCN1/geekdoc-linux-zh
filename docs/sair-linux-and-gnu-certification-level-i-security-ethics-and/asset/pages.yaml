  md: 'Each of these chains has six functions that are executed when a packet is passed
    through one of the chains: ACCEPT, REJECT, DENY, MASQ, REDIRECT, and RETURN. In
    this lab, the ACCEPT, REJECT, and DENY rules are used with the input chain as
    examples of the ipchains'' uses.'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'For the purposes of this lab, the input chain will be used to configure a system

    show how packets from different sources are affected. A number of the following

    options will be used:


    +   -A Append a new rule to an existing chain.

    -j Action to be performed on packets.

    -p For the protocol in use.

    -s For the source address to match.

    -d The packet destination address.

    -i The network interface through which the packet arrives.


    These different options will be used with the ACCEPT, DENY, and REJECT rules.


    # ACCEPT


    The ACCEPT rule allows a packet to continue through an ipchains firewall to its
    desti-

    ation network service on the computer. The following syntax would be used to allow

    packet to arrive from 123.567.890.100 through the first Ethernet device on the
    computer

    ampleserver, port 80:


    ```

    ipchains -A input -j ACCEPT -i eth0 -p tcp -s 123.567.890.100 -d exampleserver

    ```


    All packets from the computer 123.567.890.100 to the HTTP port (traditionally
    port 80)

    on exampleserver will be accepted.


    These rules can be used to specify the actions for entire networks of computers,
    not

    just a single IP address. The following example will allow all computers from
    the

    123.567.890.0* network to connect to the FTP port on the local host.


    ```

    ipchains -A input -j ACCEPT -i eth0 -p tcp -s 123.567.890.1/255.255.255.0 -d

    ampleserver 21

    ```


    As shown, destinations and sources can be specified either by name or IP

    address. The 123.567.890.1/255.255.255.0 indicates that any computer with an

    IP address inclusively between 123.567.890.0 and 123.567.890.255 will be able
    to access

    port 21, which is the traditional FTP port.


    # REJECT


    REJECT drops the packet and leaves it undelivered. The source address for the
    packet

    is then notified with a Host Unreachable ICMP packet, signifying that the packet
    was

    delivered. The following command is used to REJECT all packets that are destined

    for any port on exampleserver the computer 123.456.789.123:


    ```

    ipchains -A input -j REJECT -i eth0 -s 123.456.789.123 -d exampleserver

    ```'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'The computer 123.456.789.123 will receive an ICMP packet stating that the host

    eampleserver is unreachable, telling the sender that the packet was dropped and

    not delivered.


    # DENY


    The DENY rule causes the incoming packet to be dropped, with no return packet
    to the

    sender to indicate what has happened.


    This can be useful when a system administrator wishes to hide a computer or entire

    network from another computer. Also, if a system administrator simply wishes to

    ignore all packets to a particular port or IP address, the DENY rule can be used.


    Another function of ipchains is accepting, denying, rejecting packets that use
    a

    certain protocol. By default, ipchains can understand all protocols, the TCP,
    UDP,

    or ICMP protocols can be specified with the name of the protocol (tcp, udp, icmp,
    or

    all) as a number. The number used is specified in the /etc/protocols file.

    When the option -p is not used to specify a protocol, all is the default configuration

    for the chain.


    In the following example, ipchains is used to deny all packets from the network

    123.456.789.24 that are being sent through the TCP protocol to computer exampleserver.


    ```

    ipchains -A DENY -i eth0 -s 123.456.789.1/24 -p tcp -d exampleserver

    ```


    Again, this is similar to the REJECT rule, but with DENY, the packet is dropped
    and

    there is no notification to the source that the packet was ignored. Note that
    the /24 can

    be used in the same way as the 255.255.255.0 netmask to specify how much of the

    IP address is significant, when checking the packet through ipchains.


    # Lab Exercises


    The following exercises are based on the information presented in the theory section

    of this lab. Using the three actions discussed earlier (ACCEPT, DENY, and REJECT),
    the

    exercises provide a configuration that will allow certain sites to connect to
    specific

    protocols and ports on a computer, and all others to be rejected.


    Access to two computers is required for this lab; root access must be available
    on

    least one of these systems in order to use the ipchains command. The computer
    on

    which the ipchains commands are executed is referred to as System A, and the other

    computer is referred to as System B. It is important to ensure that firewalling
    is compiled

    to the Linux kernel or the ipchains command will not work. If you receive the

    message protocol not found, it is likely that firewalling was not compiled with
    the

    Linux kernel being used. When the system is rebooted, the ipchains settings will
    be

    discarded because they are not permanent.


    To see what rules are in effect, issue the ipchains command with the -L option.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# ACCEPT


    This portion of the lab exercises uses the ACCEPT rule, so that System A will
    accept all packets from System B.


    +   1. On System A, input the ipchains command with the following syntax:

    ```ipchains -A -j ACCEPT -i eth0 -s [system_B] -d [system_A]```

    where [system_B] is the IP address or hostname for System B, and [system_A]

    is the IP address of hostname for System A.

    2. Execute the ping command on System B with the following syntax and check that
    packets from System B are received and accepted:

    ```ping [system_A]```

    Issuing the CTRL-C will stop the ping cycle and bring up a statistics report.
    This will provide information on how many packets were sent and received by System
    B. Given that System A has been set to accept packets from System B, the report
    should show 0 percent loss.

    3. Issue the following command on System A:

    ```ipchains -D input -j ACCEPT -i eth0 -s [system_B] -d [system_A]```nThe difference
    between this and the previous ipchains command is that the -A argument was replaced
    with the -D argument. The -D argument will delete any rules matching what it follows;
    in this case, it is the rule set up in the first part of this exercise. Therefore,
    the ACCEPT rule has now been removed from the chain.


    # REJECT


    This portion of the lab exercises uses the REJECT rule. System A will send a refused
    message and drop packets from System B, requesting to use port 21 (traditionally
    the port used for FTP services).


    +   1. On System A, issue the ipchains command with the following syntax:

    ```ipchains -A -j REJECT -i eth0 -p tcp [system_B] -d [system_A] 21```

    where [system_B] is the IP address or hostname for System B, and [system_A]

    is the IP address of hostname for System A. The -p argument is used to specify
    the TCP protocol, and 21 is placed after the destination machine to specify that
    the rule applies to port 21 on that machine.

    2. On System B, attempt to establish an FTP connection with System A using the
    following command:

    ```ftp [system_A]```

    System A should send a refused message. This indicates that the packet was dropped
    by System A and was not delivered.

    3. On System B, attempt to Telnet to System A using the following command:

    ```telnet [system_A]```'
