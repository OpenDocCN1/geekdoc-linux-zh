  md: '# Shells and Commands


    Applications of the DEA include the commonly used crypt function Unix/Linux systems.
    This function is used to encrypt the passwords that are stored on such systems.
    There is also the DES program available for Unix systems that allows encryption
    using the DEA, with no special configuration or changes to the algorithm.


    # Crypt


    As stated previously, the crypt function is used to encrypt passwords. It can
    also be implemented in any function for the Unix/Linux systems to encrypt data.
    The Crypt (3) man page contains more information on other implementations of the
    crypt function.


    # Vi and the :X Command


    Although it is not secure, the text editor Vi contains the option to protect files
    with encryption and a password. When Vi is in command mode, the :X command will
    open an encryption dialogue. The user can provide a password used to encrypt the
    file. Once the file is encrypted, it can be edited and saved as normal. However,
    when the Vi session is over, the program prompts for the password that was used
    to encrypt the file before it can be opened. Without that password, the file will
    never appear as plain text; instead, binary information will be displayed for
    the file''s contents.


    These programs provide levels of protection from strong to insecure. All users
    should decide which encryption schemes are needed for their purposes. It is also
    important to regularly check security alert pages, such as www.cert.org, for news
    about encryption programs and algorithms.


    # Packet Sniffing


    Packet sniffers are utilities that can monitor and log network traffic by retrieving
    and displaying packet information passing through their computer. These programs
    may be very helpful in diagnosing errors and monitoring traffic on a network.
    However-, these utilities may also be used to eavesdrop on network communications,
    and therefore may present a potential security risk.


    # What Is Packet Sniffing?


    Packet-sniffing programs read packets intended for other systems by putting the
    listening computer''s hardware into promiscuous mode. In promiscuous mode, the
    listening system is able to read the packets broadcast over their network segment.
    This may be a cause for concern if sensitive data is not properly encrypted. For
    example, someone listening in promiscuous mode could easily obtain plain-text
    passwords.


    Packet sniffing is not as easy as it sounds. Sniffers read the packets in binary
    data, which can prove very difficult to decipher; most packet sniffers include
    some sort of filter to display usable data. Some utilities have powerful filtering
    tools that may be'
