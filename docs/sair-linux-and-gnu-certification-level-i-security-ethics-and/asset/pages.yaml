- img_proc: true
  md: '# The Other File


    In the directory-based configuration, the other file is used as a default response
    to PAM requests. It provides a stopgap for unconfigured PAM-aware services, and
    is an integral part of system security when using PAM. A typical other file might
    resemble the following:


    ```

    auth required      /lib/security/pam-deny.so

    account required      /lib/security/pam-deny.so

    password required      /lib/security/pam-deny.so

    session required      /lib/security/pam-deny.so

    ```


    This would indicate that authentication attempts on any service without a configuration
    file would result in a failure.


    # Troubleshooting


    Dealing with PAM can be difficult, since PAM-aware applications can cause problems
    with system stability. For instance, if the directory /etc/pam.d is accidentally
    removed, the system will be inaccessible. This can be remedied for a brief period
    by logging into the system in single-user mode (by typing linux single or <image>
    single at the LILO boot prompt), and creating /etc/pam.d/other file with the following
    contents:


    ```

    auth required      /lib/security/pam-auth.so

    account required      /lib/security/pam-acct.so

    password required      /lib/security/pam-passwd.so

    session required      /lib/security/pam-session.so

    ```


    This will allow services to answer normally, although fine-tuning for many services
    will be required for a lasting solution. It should be noted that many of the security
    issues that arise from misconfiguring PAM lie in how the other file is composed.
    It is important to maintain the intended level of system security when working
    with this file.


    # PAM Modules


    One of the most useful features of the PAM suite is its ability to employ modules
    to provide new levels of authentication and allow for customization. Effective
    use of modules is essential to obtain results with PAM. Some of the common modules
    associated with PAM are:


    +   * pam_login Provides login access control.

    * pam_chroot Acts as a wrapper to an unprivileged filesystem (The / directory
    actually maps to /some/other/path) to cordon off a user to a special area and
    disable access to unintended files.

    * pam_cracklib Provides strength checking for proposed passwords.

    * pam_deny Always access to the specified service.

    * pam_ftp Provides anonymous access for the FTP service.'
