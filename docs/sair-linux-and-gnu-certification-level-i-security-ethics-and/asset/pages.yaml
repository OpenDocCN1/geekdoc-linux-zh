  md: '# Theory of Operation


    Many users rely on products for their security, but do not realize that problems
    can exist in any software. Security software is no exception to this rule, and
    it is possible to discover and exploit bugs or security holes.


    Often, software producers cannot be held responsible for bugs in their products.
    However, some companies may release software with known bugs in it, and plan to
    fix the more problematic bugs as they surface. Policies of this type create a
    special problem for those who rely on patches to fix security holes. Since most
    patches include newer features, a loop is created. New patches fix old bugs, add
    new features, and in most cases, create more bugs. With this cycle, it will be
    nearly impossible to secure a system with alone software.


    A misguided trust in software creates dangerous and unreliable approaches to system
    security. Users depending on flawed software will be forced to find alternatives
    while the software is being patched, or leave themselves vulnerable to attacks
    directed at the bugs in their software.


    Choosing where to obtain software requires planning and consideration. Users have
    the option of buying software on disks, or in some instances, downloading the
    software-directly. Both options have the potential for security risks.


    Typically, users buy on disks, and assume it is a safe and effective form of distribution,
    the use of disks is one of the safest ways to get software today, but it is not
    an infallible method. Eve CDs produced by larger software companies are not free
    from defects, viruses, and security holes. The danger in these situations is the
    assumption that software sold on disks has been cleansed. There have been numerous
    releases of commonly used software that are shipped with viruses, Trojan horses,
    and logic bombs.


    The other option in distribution is to download software. This case refers mainly
    to source code and shares files, while most commercial software is available only
    on disk. Downloading and installing software is one of the largest sources of
    viruses and security holes. Today is not strictly regulated, especially on servers
    that allow users to post to the download libraries directly; may allow users to
    download insecure products. However, this is not true for every software site
    on the Web. Some shareholder administrators may scan their libraries to provide
    safe software, but users should remain cautious when downloading software.


    Although users should explore software options, in a Linux environment, users
    should also inspect every piece of software obtained. This reminder is especially
    for users who are downloading from an unfamiliar site.


    # Protecting Yourself


    Users must be careful when choosing software to trust. If an administrator cannot
    trust his or her security tools and security policy, then system safety will be
    virtually impossible to achieve. This section provides a few recommendations for
    securing your system.


    To minimize security risks, attempt to verify the system''s software regularly.
    A helpful tool for software verification is MD5, a message digest algorithm. This
    tool accepts a file as input, and performs mathematical functions on the input
    to create a 128-bit number. The number generated by MD5 is unique and helps to
    determine whether a file or message has been altered. MD5 is reliable, since a'
