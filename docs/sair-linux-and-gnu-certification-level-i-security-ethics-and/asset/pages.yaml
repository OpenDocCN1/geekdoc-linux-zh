  md: '# NFS Security


    Network File System (NFS) was designed by Sun Microsystems, and allows computers
    to access files over a network as if the files were on a local disk. NFS is commonly
    used by clients on a LAN to connect to a central file server. While implementing
    NFS, the administrator must take several measures to assure the security of the
    NFS server and the privacy of the files being shared.


    # Securing Exports


    The list of users allowed to mount a file system on an NFS server is controlled
    by the server''s /etc/exports file. This file also controls the read/write privileges
    of users, once they have a network file system mounted.


    # Secure Exports Attributes


    The exports file is composed of rules governing each mount point followed by a
    list of clients (machine or group names) allowed to mount the file system at the
    specified point. With each name, the access permissions are set. The administrator
    must take caution when configuring the exports file. A poorly configured exports
    file could allow unauthorized users access to files or grant unauthorized users
    permissions.

    The exports file will be similar to the following:


    ```

    # example /etc/exports file

    / sysadmin(rw) billy(ro)

    /pub *.lucasdigital.com(ro)

    /pub/private (noaccess)

    ```


    In this example, there are three different points on the NFS server that can be
    mounted remotely.

    The first rule applies to the mount point (/). The export option (rw) is used
    with the sysadmin machine to grant read and write privileges. The (ro) option
    is used with the yoda machine to grant that read-only privileges.

    The second rule applies to the mount point /mount/pub. The export option (ro)
    is used to grant everyone in the local domain, lucasdigital.com, read-only access.

    The third rule applies to the mount point /pub/private. By using the (noaccess)
    option, no one is permitted to view the /pub/private directory, even though the
    rule granted permissions to the /pub directory.

    Table 5.1 lists the most commonly used export options.

    The valid client specifications to use in an export rule are listed in Table 5.2.

    Along with these client specifications, the wildcards, the asterisk (*) and the
    question mark (?), can be used to substitute parts of the names or addresses.
    The wildcards, however, will not substitute for a dot (.).'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Table 5.1 Common Export Options


    | OPTION | DESCRIPTION |

    | --- | --- |

    | ro | Exports file system in read-only mode |

    | rw | Exports the file system in read/write mode |

    | rw=list | list indicates the hosts that are allowed write privileges. All other
    hosts are allowed read only |

    | root_squash | Maps UID 0 or GID 0 to the values specified in the ananuid and
    anogid (default) |

    | no_root_squash | Allows normal access for user connected as root (risky) |

    | all_squash | Maps all UIDs and GIDs to their anonymous versions |

    | ananuid=XXX | Specifies the UID that remote hosts should be mapped to |

    | anogid=XXX | Specifies the GID that remote hosts should be mapped to |

    | secure | Requires remote access to originate from a secure port (default) |

    | insecure | Allows remote access from any port |

    | noaccess | Denies access to the specified directory and its subdirectories (with
    nested exports) | |


    # Root Squashing


    Root squashing refers to the way NFS maps incoming UID 0 and GID 0 client requests
    to that of another UID. With root squashing enabled, the NFS server intercepts
    incoming requests and changes them to appear as if they came from some other user,
    without UID 0, or some other group, without GID 0. This way, root-owned files
    on the NFS server cannot be harmed by a remote user with root access.

    If the administrator chooses to disable root squashing, he or she must be certain
    of the integrity of every NFS client machine. If the integrity of one of the NFS
    clients were compromised, the NFS server would also be compromised. Due to this
    potential security issue, it is not safe to disable root squashing.


    # Table 5.2 Valid Client Specifications


    | TYPE | SYNTAX | DESCRIPTION |

    | --- | --- | --- |

    | Hostname | hostname | Individual hostnames of machines |

    | Netgroup | @groupname | NIS netgroups |

    | IP networks | ipaddress/netmask | IP address and network mask |'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'By default, root squashing is enabled on the NFS server. If the default has
    been changed, root squashing can be enabled on a per-line basis in the exports
    file on the NFS server by using the root_squash export.


    There is an export option to specify the location of UID 0 squashed requests,
    as one to specify the location of squashed GID 0 requests. The squashed option
    for UID 0 is anonymous=xxx, and the squashed to be set to the UID of the administrator''s
    choosing; however UID must match that of a real user. root may be squashed to
    a UID placeholder, luke, that has the abilities of a normal user.


    Since root users on an NFS client can su to any UID they choose, the security
    advantages of root squashing are not all encompassing. To this disadvantage, user
    files and any files owned by bin and sys are vulnerable to attack. However, root
    squashing protocols on the NFS server that are owned by root.


    # Network Precautions with NFS Implementations


    Although NFS makes files on a network highly accessible, it allows the possibility
    for several types of network attacks. NFS only provides minimal security, it is
    not the best method for sharing file systems over a network. NFS should not be
    run over a public network, such as the Internet. However, the security problems
    are not as severe on a LAN. The administrator can take precautions to limit the
    chances of someone attacking NFS on a LAN.


    # Firewall NFS Ports


    One of the most important things the network administrator can do to ensure NFS
    is to block NFS access with a firewall. The administrator must block both TCP
    and UDP access to ports 2049 and 111 on the fileserver. This can be accomplished
    by using ipchains for firewalling. The firewall script would be similar to the
    following:


    ```

    # Block NFS ports 111 and 2049


    $IPCHAINS -1 -A input -j DENY -s 192.168.1.1/255.255.250

    --destination-port 111 -p TCP

    $IPCHAINS -1 -A input -j DENY -s 192.168.1.1/255.255.250

    --destination-port 2049 -p TCP

    $IPCHAINS -1 -A input -j DENY -s 192.168.1.1/255.255.250

    --destination-port 111 -p UDP

    $IPCHAINS -1 -A input -j DENY -s 192.168.1.1/255.255.250

    --destination-port 2049 -p UDP

    ```


    In this script, all traffic from outside the local network 192.168.1.1* is denied
    on the ports used by NFS: 111/TCP, 111/UDP, 2049/TCP, and 2049/UDP.


    # Network Authentication under NFS


    If the site is already running a network authentication system, such as Kerberos,
    the administrator should consider implementing that authentication system with
    NFS.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Applications 157


    However, if the site is not already running a network authentication system, installing
    one may require more time and effort than is worth the results. For most sites,
    preventing NFS file systems from being imported by unauthorized clients is the
    best security measure.


    # NIS and NIS+


    Network Information Service (NIS) helps to distribute the information in system
    files, such as /etc/passwd, /etc/hosts/, and /etc/group, over an intranet. Since
    NIS has a long history of security-related problems, several steps must be taken
    to ensure that a network using NIS is secure. NIS+ is an alternative package developed
    by Sun that takes care of many of these security problems.


    NIS and NIS+ are useful when trying to maintain an intranet. With a NIS account,
    any user can log in to any system running the NIS client software. A master copy
    of system files on the NIS server can also be distributed to the client machines,
    when an update is made.


    # How NIS and NIS+ Work


    NIS and NIS+ work on a fairly simple concept. When the master server starts up,
    it reads and parses the configuration files and data files. It stores the information
    from the data files into maps (or tables if it is NIS+) and waits for a request.
    Whenever a change is made to the master server, the changes are also made on the
    slave servers.


    When a user logs in (or performs another operation requiring NIS) to a computer
    in that particular NIS or NIS+ domain, the client sends a request to the master
    server and gets the information. If the master server is down or takes too long
    to respond, the client tries one of the slave servers instead. While the implementation
    of NIS+ differs from NIS, However, NIS+ does not have the traditional yp commands,
    and it is designed for security.


    # Master Server


    As its name might imply, this is the main server for a NIS or NIS+ installation.
    It provides all of the maps containing passwords, groups, host tables, and other
    information needed by NIS and NIS+.


    # Slave Server


    The slave server(s) acts as a backup in case the master server goes down. All
    slave servers are updated when a change is made on the master server.


    # Clients


    All computers on the network, including the master and slave servers, are clients.
    They access the information from the master server or the slave server in case
    the master server goes down.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# NIS versus NIS+


    There is not a a relationship between NIS and NIS+. The commands, structure, and
    security are different. NIS+ uses tables instead of maps; NIS+ uses secure password,
    as well as the standard login to get onto the system.


    NIS tends to be easier to configure and maintain. The inherent problem with NIS
    is that the program is insecure. Its authentication is not reliable passing unencrypted
    queries and replies across the network. NIS can allow the /etc/passwd file to
    be world readable. Give the NIS domain name and the server address, anyone can
    request the password.by name. Thus, the encrypted passwords are obtained, and
    password-cracking programs can be run on the password file. There are three different
    ways to improve NIS security:


    +   - Use /etc/hosts.allow and /etc/hosts.deny to limit access to trusted servers.


    +   - Use /etc/ypserv.securenet. All connections are denied except for the hosts
    listed in this file; even localhost must be explicitly allowed.


    +   - Use secure portmapper. Do not use both /etc/yserve.securenet and secure
    portmapper together. This can put a large overhead on the system.


    The problem with NIS+ lies in its implementation rather than security. NIS+ was
    developed by Sun and is now being implemented into Linux. NIS+ is still in development,
    so it is not widely supported.


    The web site www.suse.de/~kukuk/nisplus/index.html continues updates on NIS+ developments.


    While NIS is the more secure of the two applications, NIS has the best documentation
    and support. As a system administrator, you should research the latest developments
    of NIS+ and decide which is most appropriate for your network.


    # Secure Sendmail


    Sendmail is a useful application; however, because of its complexity and the type
    and volume of the program is required to execute, Sendmail may be the greatest
    security risk on a Unix or Unix-like system. The intricacy of Sendmail has thus
    far prevented a major redesign and reimplementation, though several, simpler applications
    have been designed as replacements. Still, due to its usefulness, availability,
    and flexibility, Sendmail is used on most Unix systems.


    # Sendmail and Security Issues


    There has been a considerable amount of information and press given to Sendmail
    security holes. As previously stated, the program is used extensively; attacks
    on email affect mail servers worldwide. It is important, therefore, that administrators
    and users educate themselves about Sendmail vulnerabilities, stay ahead of security
    updates and patches, and implement preventative measures expedientiously.'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'Applications 159


    # Sendmail''s Weakness


    Sendmail''s configuration file is complex. The program must have access to almost
    every aspect of a system in order to perform all of its functions; many of these
    functions, such as checking for incoming mail connections, require Sendmail to
    be run as root. The uneducated use of such an integral and complicated program
    can create considerable security vulnerabilities.


    # Why Sendmail Runs as Root


    If Sendmail is run without root permissions, the vulnerabilities commonly targeted
    by hackers are eliminated, and the program is no longer a threat to the system.
    However, if Sendmail does not function as root, it cannot perform its job. Sendmail
    is designed to listen for incoming mail, overrule permissions to view .forward
    and :include: files, execute system calls to the kernel, operate as a specified
    user, and run programs as that, all functions that require root permission.


    # Why Sendmail Accepts Remote Commands


    The danger posed by Sendmail functioning as root is compounded by the program’s
    ability to accept commands from remote users; this allows mail to be sent easily
    and efficiently between two systems. Preventing Sendmail from accepting user commands
    would cripple its ability to accept mail, rendering Sendmail useless.


    # Command Attacks


    Before any system or application can be made secure, it is important to understand
    not what kind of attacks are likely to be made, but also the attacks that have
    worked in the past. By gaining an idea of what crackers may try on a system, overall
    security can be improved.


    A command attack, also called a command channel attack, is an attempt to take
    control of a system by sending commands to Sendmail through a mail port known
    for its potential weaknesses. This method of attack is usually based on the hope
    that the system administrator is ignorant of the flaws inherent in Sendmail, an
    unpatched version, or a misconfigured program.


    One Internet security breach, the Morris Worm, revolved around a command attack
    on Sendmail. It exploited a Sendmail debugging command that allowed a user to
    execute commands with the same permission as Sendmail. Since Sendmail possesses
    root privileges, so the worm won.


    Another common attack is the HELO buffer overflow. The attacker gives a long character
    string with the HELO command when identifying him or herself, hiding the origin
    of the user. This is caused by the small buffer size of HELO; in this case, 1KB,
    or 855 characters.


    These are only two ways in which Sendmail has been attacked through the command
    channel. There have been and will be many more attacks on Sendmail. This is not
    a flaw in Sendmail, merely a consequence of its design. The complexity of Sendmail
    makes it unlikely that the program will ever be secure. This does not mean Sendmail
    should not be used. There are many benefits from the use of Sendmail; it is a
    powerful and flexible mail program. Therefore, if a system requires that'
