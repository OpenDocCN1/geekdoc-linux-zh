  md: '# passwd and group Files


    passwd and group files contain information about users, passwords, and group assignments
    to which no anonymous user should have access. Therefore, it presents a new security
    risk when those files are copied into the /home/ftp/etc directory for the FTP
    server. Left unmodified, an anonymous user who gains access to user accounts or
    even root access, especially if the passwd file contains encrypted passwords that
    an unauthorized user may decrypt. Any information related to actual usernames,
    passwords, groups, or directories should be removed from these files once they
    have been copied.


    Since the passwd and group files are only used by the server to provide names
