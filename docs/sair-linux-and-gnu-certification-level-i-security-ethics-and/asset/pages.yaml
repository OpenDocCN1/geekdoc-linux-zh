    # gpgp


    gpgp can be downloaded from www.geocities.com/SiliconValley/Chip/3708/gpgp/gpgprintintro.html.
    A screen shot from gpgp is shown in Figure 5.8.


    The four tabs represent the different screens that gpgp provides for actions.
    The pubring.gpg and secring.gpg tabs bring up the public and private keyrings
    by the user. Each can be added, deleted, exported, or modified (assuming the permissions
    for the keys are correct) through gpgp. The editor screen allows text to be entered
    (either though typing or cutting and pasting), and then signed and/or encrypted
    using the gpgp action buttons.


    # tkpgp


    tkpgp is another graphical interface, but it provides different functions when
    using gpgp (see Figure 5.9).


    Through tkpgp, a user can specify either PGP or GPG encryption, whether to use
    binary or ASCII text, and various other actions to perform on. tkpgp can read
    and write files to sign, encrypt, or decrypt those files. Under the Settings button,
    many options can be set, as shown in Figure 5.10.


    GnuPG is a strong replacement for proprietary PGP programs, allowing users to
    exchange data in a secure and reliable manner. Further options can be found in
    the GnuPG section 1 man page, usually found in /usr/man/man1/gpg.1.gz.


    # Web Server Security


    The number of features and services supported on Web servers is immense and has
    greatly to the growth and popularity of the Internet. However, these features
    also present possibilities for Web server security to be compromised. It is important
    for administrators to understand these possibilities for the compromised security
    of the Web server, and take appropriate action to prevent the occurrence of these
    attacks, as well as limit the consequences if such an attack is successful.'
