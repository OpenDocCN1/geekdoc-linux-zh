    # Screensavers


    Some popular X Windows managers have screensavers that may be configured to act
    as terminal locks. Gnome and KDE both offer a screen lock that may be configured
    in the Control Panel.


    > NOTE The password verification requested for all of the screen locks is the
    same as the user login.


