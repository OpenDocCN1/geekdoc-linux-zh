  md: '# # LAB XXIII

    Rootkits and Rootkit Detectors


    # ## Purpose


    The primary goal of this lab is to describe what rootkits are and the tools that
    can be used to detect them. For this reason, this lab does not contain any exercises.


    # ## Theory


    Rootkits have been in existence for several years and are undergoing rapid development
    by crackers. Rootkits set up Trojan-ed commands, making it easier for the cracker
    to avoid detection. Trojan-ed commands are commands that look and act like normal
    commands, but are modified to hide crackers'' activities and help them get back
    in the system whenever they need to. For instance, they may replace commands like
    ps so that when it is run, it will not show certain processes or will show them
    as being something different.


    # ## t0rnkit


    There are many different rootkits on the Internet. Some of them include the various
    Linux rootkit versions, such as t0rnkit. They are all a little different, but
    have many of the same essential features. Some features of the t0rn rootkit, as
    listed at www.cert.org, include:'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 338 Lab XXIII


    +   - Kills syslogd.

    - Alerts the intruder to remote logging facilities by searching the syslog configuration
    file for the at (@) character.

    - Stores an intruder-supplied password for Trojan horse programs in /etc/ttyhash.

    - Installs a Trojan horse version of sshd configured to listen on an intruder-supplied
    port number with intruder-supplied SSH keys stored in the /usr/info/.torn directory.
    The Trojan horse binary is installed as /usr/sbin/nscd and started using /usr/sbin/nscd
    -q. The same command is appended to /etc/rc.d/sysinit to start the daemon at boot
    time.

    - Locates Trojan horse configuration files to hide file and process names in the
    /usr/src/.puta directory.

    - Replaces the following system binaries with Trojan horse copies:

    /bin/login;/sbin/ifconfig;/bin/ps;/usr/bin/du;

    /bin/ls;/bin/netstat;/usr/sbin/in.fergered;

    /usr/bin/find;/usr/bin/top.

    - Installs a password sniffer, syslog logfile parser, and system log file cleaning
    tool in /usr/src/.puta.

    - Attempts to enable Telnet, and finger in /etc/inetd.conf by removing any leading
    number (#) comment characters.

    - Alerts the intruder concerning the WALL appearing in /etc/hosts.deny.

    - Some versions attempt to patch rpc.statd and WU-ftpd with versions that are
    not vulnerable.

    - Restarts /usr/sbin/inetd.

    - Starts syslogd.


    # Detect Rootkits


    There are programs, such as chrootkit, that are able to detect various rootkit
    versions. A rootkit detector should fit most needs, but it is important to install
    the latest version. Rootkit is able to detect Solar Rootkit, FreeBSD Rootkit,
    Linux Rootkit 3, Linux Rootkit 4, Linux Rootkit 5, and some Linux Rootkit variants
    such as tornkit. Chrootkit can be downloaded at www.chrootkit.org. Rootkit detectors
    generally do not fix problems generated by the rootkits; rather, they alert the
    system administrator that a rootkit has been installed.

    It is not recommended that you install a rootkit on your system unless you fully
    understand what rootkit is going to do. It is difficult to restore a system that
    has had a rootkit installed on it. For this lab, you are not asked to use a rootkit
    or a rootkit detector. However, the following is a sample output from chrootkit
    before the installed tornkit rootkit and a sample output after an installed rootkit.'
