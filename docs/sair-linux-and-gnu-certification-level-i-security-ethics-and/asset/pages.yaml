  md: '# The Policy


    Begin the network policy with an introduction.


    # 1. Introduction


    The following is the network and appropriate use policy for Imaginary Enterprises.
    This applies to all property and resources owned by Imaginary Enterprises. If
    there are any questions about the specific nature of the policy, please speak
    to the appropriate manager.

    The intention of this policy is to allow employees to freely perform their job
    while protecting Imaginary Enterprises from abuse, waste, or liability. Anything
    not expressly permitted is prohibited.


    After the introduction, write the body section of the policy. Keep the policy
    relevant to the company; each company is different, policies will differ.


    # 3. General Policy


    It is the intention of Imaginary Enterprises to allow their employees freedom
    to perform their job while protecting the company. All property and resources
    of Imaginary Enterprises should be used for specific business or for business-related
    reasons.


    At no time should the policy of Imaginary Enterprises be used for illegal or non-work-related
    activity. Any violation of the network and appropriate use policy could result
    in, but is not limited to, the termination of employment, restriction from use
    of the network services, or possible legal action.


    # 3. File Structure


    The storage directories for Imaginary Enterprises are divided by department (i.e.,
    there are directories specifically for Research and Product Development, Accounting,
    Business Operations, etc.). The directories are further subdivided according to
    departmental guidelines. At no time should an employee attempt to gain access
    to files not specifically permitted to him/her. If there is a need for access
    to files, contact your immediate supervisor and the owner of the files.


    # 4. Appropriate Use of the Internet and E-Mail Service


    Employees of Imaginary Enterprises are allowed to access the Internet under the
    following conditions:


    +   - The activity is relevant to work.

    - The activity is to benefit the company.

    - No material is downloaded that could potentially damage Imaginary Enterprise''s
    reputation, network, or resources.

    - The employee accepts all responsibility for his or her activity on the Internet.

    - All e-mail is relevant to work.

    - All e-mail is to benefit the company.

    - No e-mail is potentially damaging to Imaginary Enterprise''s reputation, network,
    or resources.

    - The e-mail is not politically motivated.'
