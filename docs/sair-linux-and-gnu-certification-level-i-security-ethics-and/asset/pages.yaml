  md: '# Network Access Control


    It is important for system administrators to have a good understanding of a network''s
    structure, who has access to a network, and how to limit this access when appropriate.
    If a system administrator fails to recognize the significance of this, the network
    may become vulnerable. Even seemingly harmless errors can prove disastrous for
    a local network and the networks to which it is connected.


    There are several measures the system administrator can take to ensure that his
    or her network and the data flowing over that network are secure and the network
    will not be used as an amplifier in attacks against other networks. When used
    correctly, VPNs, TCP Wrappers, and packet filters can greatly reduce the security
    risks inherent in connecting private and public networks.


    # Virtual Private Networks


    A virtual private network (VPN) allows secure transmission of private network
    traffic from one point to another over a public network, such as the Internet.
    The VPN architecture is virtual because it utilizes a PPP tunnel within a public
    network rather than real leased or owned lines; no physical, private network exists.
    This can greatly reduce costs of network. In addition to eliminating the cost
    of leased lines, dial-up lines and modern modems, management of these costly services
    is no longer needed. The remote employee or user can connect securely over an
    inexpensive consumer dial-up Internet connection.


    A drawback of using a public network to facilitate a private network is the inability
    to retain control of the data as it passes over the public network. System administrators
    must take precautions, since the information passing over a VPN may be accessed
    by anyone working for or compromising an Internet service provider (ISP) being
    used to facilitate that VPN. Also, administrators must take precautions to ensure
    that the VPN is protected from intruders. Most VPNs support protocols that ensure
    the privacy of information being transmitted and that only authorized users are
    accessing the network.


    There are three basic components of a VPN: authentication, encryption, and tunneling.
    Authentication is the process of validating a username and password. Encryption
    is the encoding of the network traffic to mask it from intruders. Tunneling is
    the act of setting up a closed path for data transmission between two points on
    a network. Data is encapsulated upon entrance and decapsulated upon exit. Modern
    VPNs support virtually all common cryptology technologies, most major authentication
    protocols such as Kerberos or tokens, and major tunneling protocols as PPTP, IPSec,
    and L2TP.


    # Packet Filtering


    Filtering packets on the network and server levels is an important part of securing
    the network. Filters allow IT managers to block unwanted or unauthorized traffic
    on the router or firewall levels. Filters can also be placed on servers to use
    of certain services or ports, which can help identify where a network intruder
    originated and when the intrusion took place.'
  merge: -1
