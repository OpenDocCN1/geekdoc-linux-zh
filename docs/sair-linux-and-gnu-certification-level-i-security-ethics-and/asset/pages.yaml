  md: '# Temporarily Stopping Crack


    The easiest way to stop crack is to create a file called GOTO-SLEEP in the main
    Crack directory, by entering touch GOTO-SLEEP. One of the programs invoked by
    the Crack script searches for this file almost every minute. To restart Crack,
    simply delete the file.


    If you need something more flexible, examine the pauser script. Information on
    this script can be found in the Crack documentation.


    # Terminating and Cleaning up after Crack


    To terminate all the programs launched by Crack, run the plaster script, /script/plaster.
    Then make file tidy to clean up.

