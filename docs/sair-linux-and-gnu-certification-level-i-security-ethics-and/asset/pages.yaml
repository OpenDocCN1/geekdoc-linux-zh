- img_proc: true
  md: '# Prevention of DoS Attacks


    There are several things a network administrator can do to limit the possibility
    that his or her network will be the target of an attack or used to assist in an
    attack on another network. However, a network that is connected to the Internet
    will never be completely immune to attacks, since some of exploit weaknesses that
    are fundamental to the operation of the Internet. Still, it is essential for the
    network administrator to take all possible measures to prevent attacks.


    # Prevention on the Router Level


    An important measure for all network administrators is to deny, on the router
    level, outgoing traffic that has an incorrect source address. There is no legitimate
    reason for packets to leave a network with IP addresses that are not part of that
    network. Forging IP addresses is essential for smurf attacks and makes it almost
    impossible to trace the origin of the attack. Filtering outgoing traffic with
    incorrect source addresses should be done on all outbound interfaces. Since SYN
    attacks cannot be stopped easily, it is important to block forged IP addresses
    from leaving the network. This will help track the origin of attacks.


    The filtering of directed broadcasts is also essential to the security of the
    network or the network acting as an intermediary in an attack. Unless the network
    administrator is positive that directed broadcast will always be dense. This traffic
    should be blocked on all inbound interfaces on all routers that bring incoming
    traffic from the Internet.


    If a network administrator sees a continuing attack of ICMP attacks, like ping
    floods, it may be necessary to block all ICMP traffic on the router level. A drawback
    of this is that ICMP-dependent commands like ping and traceroute no longer work.
    However, ICMP is not essential for most network operations, such as HTTP, FTP,
    and SMTP.


    # Prevention on the Machine Level


    If IP-directed broadcasts or ICMP traffic cannot be denied on the router level,
    taking measures on each computer is another option. Each machine should be configured
    not to respond to ICMP echoes that are sent to the broadcast address. If necessary,
    the network administrator should configure each computer to ignore all ICMP traffic.


    # IP Spoofing


    IP spoofing is the process of creating TCP packets that have falsified source
    IP addresses. IP spoofing is often used to conceal the source of Dos or other
    network attacks, and to gain unauthorized access to systems that use authentication
    based on IP addresses.


    Kevin Mitnik, a notorious hacker, used IP spoofing to break into the computers
    of recognized security experts. Mitnik broke into the computer of Tsutomu Shimimura,
    who helped authorities bring Mitnik to justice. However, IP spoofing made Mitnik
    very difficult to locate. The only easy way to tell where a packet comes from
    is the source address in the header of the packet. When this has been spoofed,
    the only way to track the origin of an attack is to track it while the attack
    is still being carried out.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Smurf Attacks


    A Smurf attack is a DoS attack that uses IP spoofing. Smurf attacks work by directing
    ping floods with spoofed IPs to IP broadcast addresses. IP broadcast addresses
    are addresses that contain all 1s or 0s in the host portion. For example, for
    the 232.0.0/8 class A network, the broadcast address would be 232.0.0.0 or 235.255.255.255.
    Broadcast addresses are used for sending the same information to a large number
    of machines. If the information is sent to the broadcast address it only needs
    to reach all the machines with that address. Thus, by spoofing the victim''s IP,
    an entire network will, at once, ping a victim''s computer.


    These attacks are named after the first program to combine these vulnerabilities,
    smurf f. There are three parties involved in this attack: the attacker, the intermediary,
    and the victim. This type of attack was used to bring down several large corporate
    Web sites. Generally, attackers will search the Internet for networks that do
    not have IP-directed broadcast blocked to take the role of the intermediary. Once
    a vulnerable network is found, the attacker forces the return IP address of large
    amount of pings so they appear as if they were sent from the victim. These pings
    are sent to the broadcast address of the intermediary''s network. Once a ping
    is sent to every machine on the network with that address. These machines then
    send a response to the victim for each ping; the more machines that are on the
    same subnet, the more severe the amplification. One bogus ping from the attacker
    can turn into hundreds or thousands of responses sent to the victim. This is why
    the intermediary is sometimes called “amplifier” in a smurf attack. Figure 1.2
    illustrates the attack.


    Filtering outgoing traffic with incorrect source addresses on all outbound router
    interfaces will prevent anyone from the local network spoofing an IP address that
    is not part of the local network. Also, packets that have source addresses that
    contain local IPs should be blocked on incoming router interfaces. This will prevent
    anyone on the Internet from spoofing IPs so that they appear to have come from
    the local network.


    ![](img/6942796f6e22033d0f94b498c190e5cc_47_0.png)


    Figure 1.2 Illustration of a smurf attack.'
