  md: '# Applications 179


    # httppd.conf


    There are several directives that can be configured in the httppd.conf file to
    limit the severity of a Denial-of-Service (DoS) attack. Although changing these
    directives will not automatically prevent such an attack, it can help limit the
    ways in which an attack can be committed.


    +   - **LimitCPU directive.** The administrator may want to limit server CPU time.

    - **LimitMEM directive.** The administrator may want to limit server memory usage.

    - **LimitNPROC directive.** The administrator may want to limit the number of
    processes the server can spawn.

    - **LimitRequestBody directive.** The administrator may want to limit the size
    of the request body.

    - **LimitRequestFields directive.** The administrator may want to limit the number
    of HTTP fields in a header.


    There may be drawbacks to changing these directives; therefore, the administrator
    should decide on a server-to-server basis if each is worth changing.


    # htpasswd


    Access to Web pages being served by Apache can be password protected at the directory
    level using htpasswd. Designed by Rob McCool, htpasswd includes the application
    htpasswd, and three configuration files: .htpasswd, .htaccess, and .group.


    # Configuration Files


    The .htpasswd file is used to store the usernames and the respective passwords
    of the users who have access to protected folders. Whenever a protected site is
    requested, the server prompts the user for a username and password.


    The .htaccess file controls which users have access to view, the location of configuration
    files, and which authentication method will be used.


    The .group file is used to store group membership information. The file is optional
    and only needed if group access control is being used.


    # Configuring User-Based Authentication


    To password-protect a Web directory, the administrator must first create a new
    .htpasswd database. This is done by issuing the htpasswd command with the -c option:


    ```

    # /usr/sbin/htpasswd -c .htpasswd joeuser

    ```


    This command tells htpasswd to create a new .htpasswd database with an entry for
    the user joeuser.


    After entering this command, htpasswd will prompt for the password for joeuser.
    After the password is entered and reentered, and the encrypted password will be
    added to the .htpasswd file.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# .htaccess


    Next, the administrator must create a .htaccess file to store the access rules
    of the users and other configuration information. The .htaccess file is a regular
    text file and can be created with whatever editor the administrator chooses. The
    file consists of five main directives, or options, and their corresponding values.
    Table 5.5 lists the primary directives along with a brief description of each.


    For joeuser''s Web directory, the following .htaccess configuration will be:


    ```

    AuthFile /home/joeuser/public_html/.htpasswd

    AuthGroupFile /dev/null

    AuthName Joe User

    AuthType Basic

    ```


    ```

    <Limit GET>

    require joeuser

    </Limit>

    ```


    The AuthUser directive specifies the location of joeuser''s .htpasswd file, /home/joeuser/public_html/.htpasswd.
    The AuthGroupFile directive is set to /dev/null since group access is not being
    used. The AuthName directive is set to Joe User; by doing this, when a client
    attempts to connect to joeuser''s protected Web directory, the message Enter username
    for Joe User at www.somehost.com will be displayed. The hostname, www.somehost.com
    is set by the server to the actual hostname of the server.


    The AuthType directive is set to Basic. Basic is the most commonly used authentication
    type. It provides effective password protection, but does not encrypt the transmission
    of the password over the internet.


    The Limit directive along with its internal require directive allows only joeuser''s
    login and password to be accepted for comparison with entry in the password database.


    Whenever someone attempts to access joeuser''s site, he or she will be prompted
    for a username and password.


    # Table 5.5 Primary Directives


    | DIRECTIVE | DESCRIPTION |

    |---|---|

    | AuthFile | Specifies the full path to the .htpasswd file |

    | AuthGroupFile | Specifies the location of the .htgroup file |

    | AuthName | Specifies the text string to display when someone tries to access
    the protected Web directory |

    | Limit | Specifies which users, groups, or hosts are allowed access, and what
    they are allowed to do once (GET, PUT, POST, and so on) |'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Weaknesses in Basic HTTP Authentication


    Although using htpasswd is an easy and somewhat effective way to password-protect
    Web sites, it has its weaknesses.


    htpasswd does not protect Web directories against local users who can access the
    directories via the file system or other methods. htpasswd only protects against
    connections by way of a Web client.


    htpasswd has no built-in mechanism to protect brute-force attacks. That is, someone
    can try usernames and passwords repeatedly until he or she guesses correctly.
    This is a bigger problem than it might seem first. While using scripts, hundreds
    of different combinations can be tried every time.


    By far, the greatest weakness of using htpasswd is the fact that passwords are
    not encrypted as they travel over the Internet between client and server. Anyone
    with the means can sniff the traffic and intercept passwords. If highly sensitive
    data is being stored in a protected Web directory, it is recommended that some
    other authentication method be used instead of basic HTTP authentication.


    # MD5 Digest Authentication


    If an administrator decides that basic HTTP authentication is not secure enough,
    he or may wish to use MD5 Digest Authentication instead. When a file is processed
    with the MD5 algorithm, a 32-character digital fingerprint is produced. The odds
    of producing two messages having the same fingerprint are computationally infeasible
    (the chances are about 1 in 3.40e38). Although MD5 is often used to verify file
    integrity, Apache has MD5 support built in a more secure alternative to basic
    HTTP authentication. While using MD5 Digest Authentication, the transmission of
    the user-name and password is encrypted.


    MD5 authentication can be added to a protected Web directory using the htdigest
    tool to provide a higher level of security than basic HTTP authentication. htdigest
    works like htpasswd. To add MD5 support for the account joeuser, the first administrator
    needs to create a new digest database using htdigest with the -c option.


    ```

    htdigest -c .htdigest "Joe User" joeuser

    ```


    Joe User entered for what is known as the realm. The realm is the same as what
    was entered in AuthName field in the .htaccess file. Next, the .htaccess configuration
    should be appended. The AuthDigestFile field needs to be added to the location
    of the :htdigest file:


    ```

    AuthDigestFile=/home/joeuser/public_html/.htdigest

    ```


    Last, the authentication option, AuthType, needs to be changed in the .htaccess
    file to use digest-based authentication. The following:'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# 182 Chapter 5


    AuthType Basic


    should be changed to:


    AuthType Digest


    Now, MD5 Digest Authentication will be used instead of basic HTTP authentication,
    and the traffic between the Web client and server will be encrypted.


    # chroot Web Environment


    The administrator might want to consider setting up a chroot environment for the
    Web directories. This is especially true if the administrator is planning to let
    users upload and run CGIs. A server running inside of a chroot directory cannot
    see anything outside of that directory tree. Under an environment with chroot,
    if a cracker managed to break into the chroot Web server or a CGI, damage could
    only be caused to the files within the chroot directory tree. For this reason,
    a chroot environment is often referred to as a jail.


    # Creating a chroot Web Environment


    To create a chroot environment, the administrator must first create a user to
    own the chroot directory structure and a group for this directory structure. Then,
    the administrator must create the Web server''s root directory and change the
    permissions and ownership of that directory. If the Web server httpd will reside
    in the directory /cage, the following commands should be issued:


    ```

    # mkdir /cage

    # chown -R cageowner:cagegroup /cage

    # chmod -R 775 /cage

    ```


    Next, the administrator must log in as cageowner and create the directory structure
    under /cage. Using chroot cuts off all communication with the rest of the file
    system; therefore, a /bin directory with basic system commands (ls, mv, cp, etc.)
    and at least one shell must be copied to the ch/cage directory. If CGIs are going
    to be run, Perl and its supporting libraries must also be copied to the chroot
    directory.


    Last, the administrator needs to use chroot to trick the Web server, httpd, into
    thinking that it resides in, /home/httpd, is the root directory. The following
    command would be executed as root:


    ```

    # /usr/sbin/chroot /cage httpd

    ```


    Now, there will be a functional chroot environment encapsulating the Web server,
    protecting the rest of the system from an attack if the Web server''s security
    is compromised.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Squid


    Squid is a free, high-power HTTP proxy server that caches Internet data. It allows
    administrators to provide a high level of Internet security on Unix-like machines.
    Squid can be used to pass Internet packets or to filter and control Internet access.
    Squid is a flexible proxy server, supporting many protocols, such as FTP, Gopher,
    WAIS, and SSL. However, all replies to Squid''s requests must be in HTTP format.


    The National Science Foundation (NSF) leads code development and provides all
    funding for the Squid project. Although Squid was developed on Digital Unix machines,
    it is designed to run on any Unix-like machine.


    # Proxy Servers


    Proxies are used as an internal defense between users and the Internet. Proxies
    limit the access to data and hide the location of information provided by Internet
    servers. A proxy server takes Internet requests from users and determines the
    request''s validity before passing on to the Internet server. Squid then caches
    the returned data, which sets Squid apart from firewall proxy servers. When a
    request for that same data is received a second time or if multiple requests are
    received, Squid will provide a cached copy of the data instead of retrieving an
    external copy. Proxy servers are often used as part of a greater network security
    scheme and are always accompanied by a firewall.


    # Squid-cache.org


    For Linux users interested in caching Internet data, www.squid-cache.org provides
    information on the Squid proxy server. This site also provides detailed information
    on Squid releases, user guides, download sites, and features.


    # Configuring Squid under Linux


    Squid possesses a number of configuration files, which are usually located in
    the /etc/squid/ directory. Almost all of Squid''s configuration will be executed
    in the squid.conf file. Although the squid.conf file has up to 200 options, approximately
    10 must be changed for Squid to be operational. At minimum, the default browser
    setting must be changed, since Squid denies access to all browsers. If the default
    browser configuration is not changed, Squid will not accept any requests. Tags
    are used to specify configuration options within the configuration file. A sample
    configuration option using the tag is:


    ```

    http_port 2400 Specifies port where squid sends http request

    ```


    Squid can also be configured as a transparent proxy server. When it is in this
    mode, client browsers can use the proxy''s cache without configuration. Squid
    will pick up HTTP requests and cache the replies without the users'' knowledge,
    operating transparently.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Setting the HTTP Port


    Squid accepts HTTP requests on port 3128 by default. However, port 80 is the most
    commonly used port for HTTP requests. Use the `http_port` tag to change the default
    HTTP port. Squid will listen to requests on multiple ports, but all ports must
    be included on the same line. An example of specifying multiple HTTP ports is
    as follows:


    ```

    http_port 1500 2400 3300 5400

    ```


    Most administrators will elect to use a low-number port, such as port 80, for
    security purposes. However, Squid must be started as root, if a low-number port
    like port 3000 is used, Squid does not have to be started as root. Ports below
    1024 are used to provide basic services and are trusted; therefore, an administrator
    must start services on these ports. Ports above 1024 are considered untrusted,
    allowing any user to start services on them. Running Squid on higher ports can
    limit security because more users can gain access. If Squid is not running as
    root, possible system damage is limited if there is a bug in the server code.


    # Browser Configuration


    Squid denies access to all browsers by default, the first configuration step is
    to allow browser connection. This is done in the access control section of the
    `squid.conf` file. Next, the Internet browser on each network host must be configured
    to use Squid for Internet requests. Internet browsers can be configured for administrative
    or user purposes. For example, the simplest configuration requires only a hostname
    and the port number on which the server is running. Squid must also told which
    information to cache. Administrators should configure caching properties and Internet
    restriction to limit users'' access to files and directories. This should be done
    along with user configuration.


    Different Internet browsers require different configuration steps. However, a
    hostname and a port number are essential if that browser is to use a proxy server.


    # Administrator E-Mail


    Squid allows an administrator''s e-mail address to be specified. If Squid crashes,
    the server administrator will be e-mailed. Use the `cache_mgr` tag to specify
    the administrative e-mail address, in the following example:


    ```

    cache_mgr Webmaster@admin.com

    ```


    # User and Group IDs


    Squid will start as root if it is running on a low number port. However security
    practice states that unless absolutely necessary, Squid will attempt to change
    its own UID and GID after it has started running. The options in the configuration
    file should only be manually set if the program starts as root. Running Squid
    as root can limit the chance for security breaches.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Access Control


    Through the access control section, an administrator can control the protocols
    to which Squid will reply. This section also allows administrators to set protocols
    that clients may use, user authentication, and peer access.(Cache peering allows
    other proxies to communicate with Squid.) Following is a sample of the access
    control section specifying cache peers and HTTP access:


    ```

    #setting a cache peer

    #the syntax for the cache peer access tag is

    #cache_peer_access cache-host [allow/deny] [access-list-name]

    cache_peer_access Megatron allow manager

    cache_peer_access Megatron allow SSL_ports

    #http access configuration:

    http_access allow administrator localhost

    http_access deny !Safe_ports

    http_access allow CONNECT SSL_ports

    http_access deny all

    ```


    # Security Implementations with Squid


    Squid''s internal security is manipulated through the access control section of
    the squid.conf configuration file. Here, the user can block access by domain,
    IP address, and user authentication methods. Through user authentication and Internet
    blocking, Squid can provide security for a server. However, a proxy-cache server
    is never used alone, but is always paired with other security software, such as
    firewalls. Because of this, most configurations of Squid require the smallest
    amount of internal implementation.


    # Access Control with Firewalls


    Squid can be used either inside or outside a firewall. When Squid is used inside
    a firewall, it is considered a trusted host, which is allowed to connect to server
    resources. User requests are passed from Squid to the firewall, and replies are
    passed from the firewall back to Squid; it treats the firewall as a proxy server.
    In Figure 5.11, the firewall is providing security for Squid. However, Squid has
    the ability to provide security for itself, through Squid’s access control features.


    ![](img/6942796f6e22033d0f94b498c190e5cc_206_0.png)


    **Figure 5.11** Squid with firewall security.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Chapter 5


    | Host | Internet Server | Two-Hand Shake Protocol | Proxy Server | Internet |


    Figure 5.12 Squid without firewall security.


    When a firewall passes requests to a proxy server, the feature is called a hand-off.
    If the firewall does not support hand-offs, it is difficult for internal clients
    to connect to the outside world. If Squid is placed outside a firewall, then user
    requests are passed from the fire-side to Squid; this process requires the firewall
    to send an HTTP request to Squid. If the firewall does not support hand-offs,
    requests will not be passed. In Figure 5.12, the firewall is not providing security
    for Squid.


    Even though Squid has blocking and authentication features, it is not easy to
    configure the program for maximum security when placed outside a firewall. Squid
    must be configured to accept requests only from the local firewall, and this firewall
    must be treated as an untrusted host. Also, browsers must be configured to use
    the firewall as a proxy, not as Squid.


    # Big Brother


    Networks and computers require a certain amount of upkeep. Without the proper
    care, both will eventually crash. Most crashes can be easily prevented if the
    problem is caught in the early stages. However, catching a problem requires constant
    monitoring.


    In most businesses today, time and downtime is lost. It is essential that a system
    be monitored as closely and as often as possible. Such vigilance does not come
    very cheap. Sean MacGuire recognized the demand for a utility that simplifies
    the monitoring of a network or single computer, and created Big Brother.


    # What Is Big Brother?


    Big Brother gathers information from specified areas of a network or a computer
    and reports its findings to a central location.


    Big Brother was named after the intrusive government in the famous political novel
    1984. In the author George Orwell creates a government personified by the leader,
    Big Brother, who constantly monitors the citizens'' every move.


    The Big Brother utility was written to perform similarly to its namesake. Instead
    of citizens, Big Brother monitors different aspects of a network, from its networking
    utilities to hard drive space for servers. Big Brother can be configured to monitor
    other aspects of a network as well. One of the many benefits of Big Brother is
    its simplicity. Because Big Brother is composed of a few scripts and programs,
    it can be configured to meet specific needs.'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'Another advantage of Big Brother is its display format. Big Brother gathers
    information, processes it, and displays the information in HTML. This information
    can be displayed on an active server and viewed anywhere with a Web browser and
    Internet access. This allows a system administrator to monitor a system from any
    account with Internet access, making it convenient for travel or remote administration.


    Big Brother can also be configured to page the system administrator if trouble
    arises needs attention. This is accomplished with Kermit. Kermit is a portable
    communications software that can perform a number of functions, such as using
    a modern to automatically send pages. Kermit is not included with Big Brother,
    but can be obtained at http://www.columbia.edu/kermit/index.html.


    While support and special services can be purchased for Big Brother, the basic
    utility itself is offered free. Big Brother can be downloaded at http://bb4.com.
    This site also offers links to servers that are currently running Big Brother
    on their systems. Example output screens can be viewed through these links.


    # Example Output and Interpretation


    The output for Big Brother is kept simple, while reporting as much information
    as possible. The display is set up a grid, with a row containing processes or
    areas of concern across the top, and a column of specific computer names or systems
    running down the side. A display might contain the following information:


    ```

    cpu    disk msgs procs

    computer1 *      *      *

    computer2 *      *      *

    network   *      *      *

    ```


    The point at each row and column intersect is where the status of particular process
    on that particular machine is displayed. This point is designated by a symbol,
    with a green square or an orange circle.


    Each symbol has a specific meaning that is defined in the legend. Symbols represent
    status information, such as ok, needs attention, and trouble. The symbols on the
    display screen are automatically updated every 60 seconds to keep the administrator
    as current as possible. The symbols are also color-coded; the left side of the
    display screen is the color of the most severe condition on the screen. This allows
    an administrator to tell at a glance if something needs attention.


    Each symbol is linked to more information. If there is a trouble symbol on computer1
    in the column msgs, a system administrator can click on the symbol and learn more
    specific information about the problem. The information is usually a short message
    stating that process is not responding and that the process quit responding.


    # Installation and Configuration


    It is not recommended to run and install Big Brother as root, as this may open
    large security holes; it is suggested that a new user be created for the explicit
    purpose of running Big Brother.'
