  md: '# System Utilities 125


    syntax, making them difficult for system administrators to read. This can create
    a security problem, since system logs are often the only evidence available to
    administrators after a security breach, and they may need to be read frequently.
    However, nearly every connection made by TCP/IP, NFS, or users logging in or out
    of a system can be tracked using Linux''s log files. There are many programs available
    to provide a system administrator with the results of system logs without having
    to examine the actual logs, a tedious and error-prone job.


    Logcheck and Xlogmaster are two programs that examine all system logs for keywords
    that normally show evidence that there has been a security breach, or at the least,
    an attempt at one. If any abnormal activity is found, logcheck e-mails the information
    to a specified user (normally root, but that can be changed by the program). Logcheck
    can be set to run through cron utilities.


    Xlogmaster can be configured to display all logs and other system information,
    including who is the system, where they are logged in, and how much memory is
    used.


    These programs provide a way for system administrators to view their logs easily
    and efficiently.


    # logcheck


    logcheck is a series of shell scripts, combined into a single script file (logcheck.sh).
    This file reads lists of words, which are used to grep the system log files. If
    one of the listed words appears in the system logs, then a system administrator
    is notified.


    logcheck can be obtained at www://psionic.com/abacus/logcheck. This site includes
    the logcheck source (logcheck-1.1.1.tar.gz), as well as other security programs
    produced by Psionic. After downloading the logcheck file, unzip and start the
    downloaded file. To install logcheck, once the files have been decompressed, the
    user should execute a <system> command. <system> refers to the operating system
    in use, which in this case is linux. Depending on the distribution, the user may
    be prompted for the name of the user who will receive the mails from logcheck.
    If not, this user will be configured.


    # logcheck Configuration


