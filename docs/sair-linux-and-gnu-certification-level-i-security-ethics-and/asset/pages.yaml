  md: '# LAB IV stunnel


    # Purpose


    stunnel is a commonly used utility that secures TCP connections by encapsulating
    the packets inside a Secure Socket Layer (SSL) tunnel. In this lab, students will
    use tunnel to set up a secure SSL connection between a client and a server. This
    is intended to help students understand how to use the stunnel utility to easily
    secure any TCP-based connection.


    # Theory


    When mail is sent between the mail server and the client via the POP3 protocol,
    the most common protocol used today, the transmission normally is not encrypted.
    This creates the opportunity for someone to intercept the messages in plain text
    and read private information. By encrypting the connection between the mail server
    and mail client, this problem is eliminated. If the transmission was intercepted,
    it would be practically impossible to read any of the information, since it is
    encrypted via SSL.


    To complete this lab, you must install and configure the free SSL library, OpenSSL,
    on both the client and server machines. Also, stunnel must be installed on both
    systems to allow them to communicate via SSL. In addition, the client machine
    must be running using an SSL-enabled mail client such as Netscape Messenger, and
    the host machine must be using a functioning POP3 mail server.'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'Before attempting the lab exercises, install and configure OpenSSL stunnel;
    these can be downloaded at www.openssl.org and www.stunnel.org, respectively.


    # OpenSSL Installation


    To install OpenSSL, untar and unzip the archive in the /usr/local/ directory:


    ```

    $ cd /usr/local/

    $ gzip -dv openssl-x.x.x.tar.gz

    $ tar -xvf openssl-x.x.x.tar.gz

    ```


    Replace the x.x.x with the version number of OpenSSL being installed.

    Next, install OpenSSL by running the Configure script, running make, and the running
    make install. The free GNU compiler, gcc, is recommended for the compilation:


    ```

    $ cd openssl-x.x.x

    $ ./Configure

    $ ./make

    $ ./install

    ```


    This process should be completed on both the client and server machines.


    # stunnel Installation


    To install stunnel, untar and unzip the archive:


    ```

    $ gzip -dv stunnel-x.x.x.tar.gz

    $ tar -xvf stunnel-x.x.x.tar

    ```


    Replace the x.x.x with the version number of stunnel being installed.

    Next, install stunnel by running the configure script, make, and make install.
    The free GNU compiler, gcc, is recommended for the compilation:


    ```

    $ cd stunnel-x.x.x

    $ ./configure

    $ ./make

    $ ./install

    ```


    This process should be completed on both the client and server machines.


    # Exercises


    Configure OpenSSL on both machines, configure POP3 to work with stunnel on the
    server machine, and configure the mail client, Netscape Messenger, and the client
    machine.'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'stunnel can be run in both inetd and daemon mode, but running in daemon mode
    is recommended. This configuration will cover running stunnel in daemon mode.


    # Server Configuration


    Start stunnel on the server machine with the following command:


    ```

    $ stunnel -d 995 -r localhost:pop3

    ```


    The -d option tells stunnel to listen for connections on a specific port. In this
    case, 995 was used since it is the default port for secure POP connections. The
    -r is used to tell stunnel to which machine and port to make a connection. In
    this case, the machine is the localhost and the port is pop3. The port specified
    was not actually a number, stunnel will check in the /etc/services file and see
    which port number is assigned to the POP3 protocol.


    # Client Configuration


    Start stunnel on the client machine with the following command:


    ```

    $ stunnel -c -d 110 -r hostname_of_server:995

    ```


    The -c option tells stunnel to run in client mode. The -d option 110 was used
    since it is the default POP3 port. The -r option is used to specify the remote
    server and port number to connect to. Port 995 is used to match the port on which
    the server is listening. `hostname_of_server` should be changed to the actual
    hostname of the server.


    Now, configure Netscape Messenger so that it connects to the localhost to receive
    its mail. To this do, go to the Edit menu in Messenger and choose Preferences.
    On the left side of the window, under Category, choose Mail Servers. On the right
    side of the window, under Incoming Mail Servers, click the Add button. Next, enter
    localhost in the box that says Server Name. Finally, save the settings.


    MMessenger should now be able to receive mail securely: When Messenger connects,
    it is actually connecting to stunnel on the local machine. After this, stunnel
    connects to the remote version of stunnel on the mail server. On the mail server,
    stunnel connects to the POP3 server.


    # Questions


    +   1. Why would someone want to use stunnel to encapsulate a POP3 connection?

    2. What is required to run stunnel?'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Answers


    +   1. The connection between client and server is encrypted. For this reason,
    it would be virtually impossible for someone to be able to decipher the messages
    if a connection is intercepted.


    +   2. stunnel requires a functioning SSL library such as OpenSSL to be installed.


    # Advanced Questions


    +   1. Why was Netscape Messenger configured to connect to the localhost?'
  merge: -1
