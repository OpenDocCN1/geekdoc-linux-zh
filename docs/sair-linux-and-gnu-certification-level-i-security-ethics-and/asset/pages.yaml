    With this configuration, all kernel and authentication messages with a priority
    of least info will be logged, with the exception of authentication messages at
    the notice.


    | ACTION | DESCRIPTION |

    | --- | --- |

    | filename | Saves messages to a local file |

    | @hostname | Forwards messages to syslog on a remote machine by specifying the
    machine hostname |

    | @ipaddress | Forwards messages to syslog on a remote machine by specifying the
    IP address of the machine |

    | username, username2 | Displays the message on the screens of the specified users
    if they are logged in |

    | * | Displays the message on the screen of all users who are currently logged
    in |'
