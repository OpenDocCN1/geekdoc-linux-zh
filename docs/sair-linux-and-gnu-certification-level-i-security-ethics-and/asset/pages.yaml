  md: '# Theory of Operation 11


    While this is not a complete list of PGP''s capabilities, an abbreviated list
    follows:


    +   - Encryption of files

    - Creation of secret keys

    - Creation of public keys

    - Encryption key management system

    - Encryption of e-mail

    - Creation of digital signatures


    # PGP''s Double Key System


    PGP can encrypt files using a password system. Give a password at the time of
    encryption and that password can be used to decrypt the file. While this may be
    for some instances, it does not meet everyone''s encryption needs. PGP also provides
    for a public key and a private key. The public key is available for anyone to
    use. Once a message is encrypted by the public key, only a person holding the
    private key can decrypt the message. Suppose that a user named Leah wanted to
    receive information from a friend, and did not want anyone else read it. Using
    PGP, her friend could use the public key to encrypt and send a file that Leah
    could decrypt and open using her private key.


    # Key Rings


    PGP creates files using secring.pgp and pubring.pgp. The secring.pgp file holds
    the private keys, and the pubring.pgp holds the public keys. In order to help
    manage public key rings, it is possible to have more than one pubring.pgp file
    on a system. However, it is recommended to have only one private key ring. A secondary
    security measure uses what is called a pass phrase. While similar to a typical
    password, it is different from a password. The pass phrase allows one to use the
    secret key. The pass phrase can be of any length and is used as part of the encryption
    process. The same pass phrase is used to encrypt and decrypt files.


    # Digital Signatures


    A second process is used to create a digital signature. By using digital signatures,
    e-mails can be verified as authentic and unaltered. The following details how
    the digital signature works:


    +   - PGP filters the message down to a 128-bit number based on mathematical functions.

    - The 128-bit number is encrypted using the private key.

    - The encrypted output is the signature block.

    - The signature must be verified to ensure authenticity.

    - Filter the original message to the 128-bit number based on the same mathematical
    function used in the first step.'
