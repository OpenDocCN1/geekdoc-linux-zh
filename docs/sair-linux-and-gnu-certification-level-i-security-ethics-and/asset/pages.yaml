  md: '# Preface


    At first glance, this might appear to be a regular book; instead, it is a different
    kind of computer text that has evolved over the last few years called a study
    guide. In the same way that Cliff Notes helps students study for a test, study
    guides prepare computer professionals to take a test. Once once they have passed
    a certain number of tests, these candidates earn a certificate, which assists
    them with job placement, promotions, and merit increases.


    Compared with many other study guides, this book is unique. Other study guides
    focus on one computer vendor, whereas this book covers many distributions of Linux.
    Other study guides usually focus on one product, but this study guide covers free-to-use,
    open-source software packages. Finally, other study guides usually cover point-by-point
    user interaction with a vendor, but this one presents the common elements that
    describe all Linux distributions and the key differences among the more popular
    distributions.


    Is this too much broad information for a candidate to absorb? Our experience says
    no. People do not want to be tied to a vendor that their particular Linux distribution
    is the best. They want to see the "big picture" and how each Linux distribution
    fits into the open-source software landscape. They see the benefits of free, open-source
    software, and want to maximize it in their companies.


    Therefore, this study guide contains a compendium of theories, principles, and
    facts that relate to the system administration of Linux and GNU software on the
    PC platform. The information is organized around a "knowledge array" that contains
    only the essential concepts and facts for security, ethics, and privacy. Information
    is presented in a no-frills fashion, by concept. In Part One, Chapters 1-6 review
    the third row of the Stair Linux and GNU knowledge array. Part Two provides laboratory
    exercises that review the concepts presented in Part One. Part Three provides
    sample questions as a review of the Part One material and a self-assessment guide.
    Finally, a glossary of key terms and phrases reviews concepts described in the
    text.'
