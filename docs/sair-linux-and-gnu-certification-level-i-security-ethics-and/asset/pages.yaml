    # Sudo


    Occasionally, system administrators need to allow users to perform actions with
    root permissions. However, it does not follow prudent security practice to allow
    users to have the root password. Sudo allows users (using their own password)
    specified by the system administrators to perform actions and execute commands
    as root.


    # What Is Sudo?


    Sudo is a program through which one user can perform operations, commands, and
    execute programs as another user. This utility is used most often to allow regular
    users to perform operations as root, but can also be used to allow a regular user
    to perform commands as another regular user.


    # How Does Sudo Operate?


    Sudo allows for this type of operation by having a system administrator, as root,
    configure the /etc/sudoers file. This file contains fields used to specify which
    users can perform certain tasks on specific machines. Access privileges can range
    from full access of an entire network to only performing one command on a specific
    machine.'
