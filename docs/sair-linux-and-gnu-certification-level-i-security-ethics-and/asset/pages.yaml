  md: '# LAB

    VIII

    swatch


    # Purpose


    This lab demonstrates the user’s ability to effectively obtain, install, and configure
    the log file monitoring the swatch utility. The user will be expected to configure
    swatch to monitor the message log located in the /var/log/ directory.


    # Theory


    The swatch utility performs log file monitoring on specific logs and then notifies
    the user if it finds any unusual entries in those files. It can be run in two
    modes; the first continuously monitors a log file, and the second allows the user
    to examine and then exit the log file. swatch must be set up and configured for
    each log file that the user wishes to monitor, and unless files are logged to
    a central computer, for every computer. Despite this possible inconvenience, swatch
    can give notification of suspicious events in real time, and is distributed under
    the GPL without charge.


    # Obtaining swatch


    For the purposes of this lab, swatch 3.0 will be used; this version can be found
    at its home FTP site, ftp://ftp.stanford.edu/general/security-tools/swatch/, or
    by keyword'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'search for swatch 3.0 on any browser. Once a suitable download location has
    been found, the following items should be downloaded:


    +   FILES

    `swatch-3.0.tar.gz


    The FILES file has information about retrieving the necessary PGP key. swatch
    also needs the Perl modules Time:HiRes,Date:Calc,File:Tail. If these are not already
    on the system, swatch will attempt to install them when the installation process
    is invoked. It is a good practice to read all the documentation files that come
    with the swatch download.


    # Installation


    Once the swatch distribution has been successfully downloaded, it will need to
    be unzipped as well as extracted from the tarball. To unzip the swatch package,
    simply type the following command:


    ```

    $ gzip -d swatch-3.0.tar.gz

    ```


    Next, to extract swatch from the tarball, type:


    ```

    $ tar -xf swatch-3.0.tar

    ```


    After unzipping and extracting, move to the swatch directory. The perl Make-File.PL
    command will be used to install swatch. Successive iterations of perl Makefile.PL
    may be needed to get all the required Perl modules, as well as to create the Makefile.
    Once completed, the make, make test, and the make install commands can be executed
    to complete the installation. Depending on permissions, a user may need root access
    to properly install swatch. For Linux systems, the /usr/bin/swatch file will need
    to be edited before swatch can run. If this is not done, swatch will give an error
    or core dump. Open the file in an editor and change the first line containing


    ```

    #! /bin/sh -

    ```


    to


    ```

    #! /usr/bin/perl

    ```


    # Configuration


    swatch must be configured in order to know what to look for in the log files,
    as well as what actions to take. There are command-line options that can be used
    that add to swatch''s versatility. The user will specify where the swatch configuration
    file for each log will be saved, whether that log will be continuously monitored,
    and when it'
