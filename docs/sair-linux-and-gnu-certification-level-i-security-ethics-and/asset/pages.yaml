  md: '# Setting up a Three-syslog Configuration


    ## Purpose

    syslog is a program for collecting and storing log messages from local or network
    clients and applications. In this lab, three different syslog files will be configured.
    One configuration will be on a central syslog server whose only purpose is logging.
    The other two configuration files will be on a mail server and a Web server. The
    three servers used for these examples will be the following:


    +   - central logging server log.lucasarts.com

    - mail server mail.lucasarts.com

    - web server web.lucasarts.com


    ## Theory

    syslog is the universal logging daemon. Almost all server daemons and software
    applications have built-in support for syslog. It is essential for a system administrator
    to know how to properly configure syslog and its configuration file, syslog.conf.

    On a large network, running syslog independently on each client is not practical,
    as it wastes many hours of the system administrator''s time. To overcome this
    problem, syslog can be configured to accept logging messages from remote machines
    running'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'syslog. This central logging server should be configured to accept the messages
    of all the network syslog clients and log each message based on the needs of the
    machine from which the message originated.


    By default, a central syslog server will accept all incoming log messages regardless
    from where the messages originated. This opens a potential security problem. A
    denial-of-service (DoS) attack could be administered against the central logging
    server by sending large amounts of bogus logging messages. This could cause the
    machine to stop logging legitimate messages altogether. For this reason, the clients
    that the logging server will accept messages from should be defined in the syslog.conf
    file on the central server.


    # Lab Exercises


    These exercises will cover configuration of the first and second logging clients
    and configuration of the central logging server.


    # (A) Configuration of the First Logging Client


    The mail server, mail.lucasdigital.com, is the first logging client to be configured.
    syslog should be configured to log all mail, authentication, and other messages
    with a priority of at least crit. syslog also should be configured to send all
    log messages to the logging server, log.lucasarts.com, and save copies locally
    in separate log files based on the facility that send the message. Because syslog
    does not accept remote logging messages by default, the syslog startup arguments
    do not require modification.


    # Modifying the syslog.conf


    The syslog configuration file, /etc/syslog.conf, should be modified to resemble
    the following:


    ```

    # Save a local copy of all mail and authentication messages.

    mail.* /var/log/mail.log

    auth.* /var/log/authentication.log

    # Log all critical messages locally.

    .crit*/var/log/critical.log

    # Send a copy of all logged messages to the logging server

    .crit,auth,mail.* @log.lucasdigital.com

    ```


    The lines that preceded with a pound sign (#) are comments and are not required;
    however, they are recommended since they make the file easier to read. All other
    lines are rules and must be formatted correctly. There are two parts to each rule,
    the selector and the action. The selector is made up of the facility and the priority,
    separated by a period. The action is the location in which to save the logged
    messages'
