    # Smail


    Smail is a fairly secure mail transport agent used mostly on UUCP systems. The
    small program is known for fast delivery of mail for local uses. It is less complex
    than Sendmail, but also less flexible. Smail can be used on systems with SMTP
    for mail collection and delivery, and it is a good choice for systems that do
    not need to process a high volume of mail.


    # Setting up IMAP in Netscape


    Internet Message Access Protocol (IMAP) permits the manipulation of mailboxes
    or remote folders containing e-mail or bulletin-board messages. IMAP supports
    operations for creating, deleting, and renaming mailboxes, as well as the permanent
    removal of messages, parsing, searching, and selective fetching of message attributes.
    Although this section covers the installation of IMAP with Netscape, IMAP can
    be used with most mail clients. In addition, it is not Linux specific; a user
    may access the IMAP server from a console running other operating systems, if
    IMAP is configured on that.


    # Security


    Post Office Protocol (POP) is a protocol that allows users to download mail messages
    from a mail server then deletes the messages from the server. POP mail uses no
    encryption in transmission, and APOP, a POP variant, encrypts only the password
    and login.


    In contrast, IMAP uses Secure Socket Layer (SSL), a protocol that provides encryption
    for Internet communications in order to create a completely secure transmission
    between the IMAP server and the mail client. Unless the user directs the mail
    client to remember login information, an intruder would be unable to access the
    IMAP server. SSL operates at a layer beneath application protocols, such as Telnet
    or FTP, and a layer above application protocol TCP/IP. Users only need the SSL
    option when configuring the mail client to be used; administrators should enable
    this option on the mail server.


    # Configuring IMAP in Netscape


    Setting up IMAP in Netscape is fairly straightforward. After opening Netscape,
    click on the Edit tab and scroll down to Preferences. In the Preferences window,
    click on the Mail & Newsgroups tab to expand it (see Figure 5.1).


    Next, select the Identity tab and fill in the needed information (see Figure 5.2).
    Now, click on the Mail Servers tab and fill in the needed information (see Figure
    5.3).'
