    # The Include Directive


    The include directive tells logrotate to read the file—or in this case, the files—in
    the directory, and incorporates the contents of that file in the logrotate .conf
    file. The Red Hat package manager usually installs rotation information in the
    /etc/logrotate.d file, which can contain the relevant information for multiple
    utilities such as cron, linuxconf, syslog, and samba.


    # Configuration Parameters


    The next line after the include directive gives the configuration parameters for
    the wtmp file in the /var/log/ directory. Any of the directives can be included
    within the curly brackets, which creates specific actions for log files. In the
    previous case, the wtmp file will be rotated once a month and will retain one
    backup log.


    # Other logrotate Directives


    Some other directives may be useful mail address, notifyempty, recreate, and size
    size | sizek | sizeM. The mail directive will mail files at the end of their rotation
    cycle to the address specified in the field. notifyempty will not rotate a log
    file if it contains no logs, and recreate will not allow new log files to be created.
    size specifies to rotate the log files once they have met a size set in bytes,
    kilobytes or megabytes. There are more directives available and can be found by
    consulting man logrotate.


    # swatch


    The swatch utility is designed to monitor log files and notify the user of any
    unusual log entries. There are two modes in which swatch can run, batch and monitor.
    Batch mode will allow the user to examine the log file and exit, whereas monitor
    mode will continuously watch and evaluate each new log entry. There are a few
    ways that swatch can notify the user if it detects any unusual activity. This
    include a terminal bell, email, sending messages to the terminal, and color-coding.
    The swatch utility requires Perl 5 or greater in order to run and is distributed
    under the GPL. A drawback of swatch is that if protection is needed on multiple
    computers, a swatch process must be running on each of them unless logs are logged
    to a central machine. In addition, a swatch process must also be running for each
    log file.


    # Configuring swatch


    There are various command-line options that can be used when running swatch. Home
    -r [+]:mm[am|pm], which will restart switch after hh hours and mm minutes, where
    use of the [+] will restart switch after hh hours and mm minutes have elapsed
    from the present time. The --input-record-separator =regular_expression will separate
    the record by the character entered in'
