  md: '# scp


    scp is the more secure version of the rcp utility, and encrypts the files transferred
    to and from the server much like sftp. Unlike sftp and rcp, scp only requests
    passwords if a file''s permissions do not match the user''s permissions.


    # Synopsis


    The switches and commands listed next have been complied from the scp man pages.
    To view the complete pages, enter man scp at the command line:


    ```

    scp [-pgrcvC46] [-p port] [-c cipher] [-i identity_file] [[user@]host1:]file1
    [...]

    {{user@host2}:file2

    ```


    # Some Options


    scp provides similar functions to rcp. However, its options are modeled around
    those for ssh. Following are some example options:


    +   - -p Use this to preserve the modification times, access times, and modes
    that were set on the original file.

    - -r Recursive option used to copy entire directories.

    - -B Batch mode to prevent repeated requests for passwords or other authentication
    when doing multiple copies.

    - -C Enables compression using the gzip algorithm.


    # Example 1


