  md: '# Linux/Open Source $39.99 USA/$62.50 CAN


    # Learn more, earn more with GNU certification!


    # Sair Linux and GNU Certification

    Level I: Security, Ethics, and Privacy


    The Sair Linux and GNU Certification program, designed and developed by the industry-leading
    members of Sair Linux and GNU, and its advisory board, provides you with a clear
    path for improving your Linux skills and knowledge. This new series of books will
    help you gain the necessary tools to become Linux and certified, which can lead
    to more job opportunities and a higher salary! Level I covers the areas of expertise
    that must be mastered to become a Sair Linux and GNU Certified Administrator (LCA).


    The last of four study guides for the LCA certificate, this book will help you:


    +   - Gain insight into software, hardware, and network vulnerabilities

    - Use a variety of tools to secure files, applications, servers, and networks

    - Develop a network policy and protect it with shadow programs and similar tools

    - Track intruders and manage and protect firewalls

    - Install Linux kernel patches to keep your system''s security up to date

    - Leverage cutting-edge solutions such as Kerberos and one-time passwords

    - Install and configure a wide range of security and system-monitoring utilities

    - Understand the role of ethics in system administration


    TOBIN MAGNINIS is Associate Professor of Computer and Information Science at the
    University of Mississippi. He has used free open source software to teach many
    systems courses, including three levels of operating systems and computer networking
    over the last 20 years. Since 1992, he has been President of Sair Linux and GNU,
    Inc.


    Other books to look for in the Level I:


    Sair Linux and GNU Certification*

    Level I: Installation & Configuration

    Sair Linux and GNU Certification*

    Level I: System Administration

    Sair Linux and GNU Certification*

    Level I: Networking


    In this guide, the Sair Linux and GNU certification draws upon your years of experience
    to provide expert advice as well as proven tools and techniques for keeping your
    Linux systems from intruders without limiting access and resources. With the help
    of detailed exercises, we will take you step-by-step through the areas you''ll
    need to know in order to pass the certification exam: including theory of operation,
    base system commands, system utilities, applications, and troubleshooting. Plus,
    they provide 100 sample test questions to help you prepare for your exam.


