  md: '# Installing xinetd


    # Purpose


    The purpose of this lab is to install xinetd to replace inetd with a more secure
    and highly configurable daemon. The daemon listens on predefined ports and carries
    out entire requested actions, provided specified conditions are met.


    # Theory


    On most systems, inetd controls network connections. Unfortunately, inetd cannot
    function with specific configuration requirements. For example, it takes a high
    level of expertise to configure inetd to allow a specific group of IP addresses.


    Xinetd can be run in conjunction with inetd or as a replacement for it. A user
    can configure services to run under his or her account without reconfiguring the
    entire system.


    Before beginning this lab, make a backup for the inetd daemon, the inetd configuration
    (/etc/inetd.conf) file, and any services and daemons it calls for.


    Using a text editor, open the inetd.conf file, normally located in the /etc directory.
    The following is an example of an inetd.conf file.'
  merge: -1
  pgno: 256
- img_proc: true
  md: "# 236 Lab V\n\n```\nftp stream tcp nowait root /usr/sbin/tcpd in.ftpd -l -a\n\
    telnet stream tcp nowait root /usr/sbin/tcpd in.inetd\nssh stream tcp nowait root\
    \ /usr/sbin/tcpd /usr/sbin/sshd -i\n```\n\nThe first column represents the type\
    \ of service. In this example, the system allows for ftp, telnet, and ssh services.\
    \ The next column represents the types of sockets used by the service, which are\
    \ raw, dgram, or sepacket. The third column represents the protocol used, such\
    \ as tcp and udp. The fourth column only pertains to datagrams. For datagram servers\
    \ connecting to a peer, the nowait option frees the connection as soon as the\
    \ communication is finished. This process is known as multithreading. For nondagram\
    \ services, the wait option is used. The fifth column specifies permissions to\
    \ run. Inserting root invokes root privileges; likewise, if the user option is\
    \ given, person has user permissions. The next column contains the program to\
    \ run when a service is invoked, followed by the seventh column by the program\
    \ arguments.\n\nNow that the inetd configuration file is understood, the xinetd\
    \ configuration file can be written. Xinetd uses similar commands and several\
    \ features for extended control. The following is the xinetd equivalent of an\
    \ inetd configuration file.\n\n```\nservice telnet\n(socket_type = stream\nwait\
    \ = no\nuser = root\nserver = /usr/sbin\nservice ftp\n(socket_type=stream\nwait\
    \ = no\nuser=root\nserver = /usr/sbin\nservice ssh\n(socket_type=stream\nwait\
    \ = no\nuser=root\nserver=/usr/sbin\n)\n```\n\nXinetd offers more control over\
    \ inetd. For example, xinetd allows default settings to apply to specific services.\
    \ The following can be added to the xinetd example just shown:\n\n```\ndefaults\n\
    (instances = 25\n  log_type = FILE /var/log/servicelog\n  log_on_success = HOST\
    \ PID\n  log_on_failure = HOST RECORD\n  only_from = 192.168.1.200 192.168.1.210\n\
    )\n```"
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Installing xinetd 237


    The default section applies to all services called upon xinetd.conf file. The
    instances option controls how many servers are logged on to the system at one
    time. Inserting the unlimited option removes the limit on the number of servers.
    A record is made of each connection handled by xinetd. The log_type option specifies
    how the log file is saved and the name of the file. Contained in the /var/log/servicicelog
    file are the successful logins and the failures. One of the most useful features
    of xinetd is the ability to limit the IP addresses able to connect. The only_from
    option allows a particular address or a chain of IP addresses to connect to the
    system. Without the only_from option, a connection can be made from any location.


    # Lab Exercises


    +   1. Make a backup of the inetd.conf file and the programs called by it.

    2. Go to the xinetd Web site, www.synack.net/xinetd/, and download the software.
    Running Red Hat or a compatible distribution, get the rpm file.

    3. Install the xinetd package.

    4. Open a text editor and create a xinetd.conf file.

    5. Create a xinetd.conf that allows a Telnet and FTP session only from a system
    located at 192.168.1.200.

    6. Run xinetd and monitor the log file along processes.


    # Questions


    +   1. What is the specific socket type required by Telnet, FTP and ssh? Should
    this socket type wait for xinetd to finish the request?

    2. What is maximum number of IP addresses that can be declared with the only_from
    option?

    3. Once installed, the only daemon listening on any port is xinetd. However, any
    user can run xinetd, and a user may set up a system that handles specific requests,
    such as ftp or ssh. (True or False)

    4. How does xinetd log messages?


    # Answers


    +   1. The specific socket type is stream, and no wait is necessary.

    2. There is no maximum number. An infinite number of IP addresses can be strung
    together to create a list of systems that can use the declared service.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '+   3. True. Any user can run xinetd. If a request meets the requirements specified
    in

    the xinetd.conf file, the user’s settings and programs will be executed.

    4. xinetd can use the syslog daemon, or it can write to a specific file.


    # Advanced Questions


    +   1. How can xinetd prevent Denial-of-Service attacks?'
