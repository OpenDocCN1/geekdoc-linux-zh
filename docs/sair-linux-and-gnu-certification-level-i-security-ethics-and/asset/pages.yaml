    # Secure Communications


    With the explosion of users on the Internet and the subsequent increase in the
    traffic of sensitive data, the use of secure communication methods has become
    increasingly important. Whether it travels freely across an intranet or across
    international boundaries, data sent over an insecure channel represents an invitation
    for potential abuse. ssh, sftp and scp are widely accepted secure commands that
    can be used in place of their non-secure counterparts.


    # SSH


    Secure Shell (SSH) can refer either to a group of network utilities that use a
    common method of encryption and authentication or to the specific utility ssh.


    It is important to understand that no communication method is truly 100-percent
    secure. Possible methods for cracking SSH have either not been thought of yet
    or not reported. SSH is far more secure than traditional network utilities.


    The SSH package contains more secure replacements for the utilities telnet, login,
    rsh, ftp, and rcp, each of which transmits data over the Internet in plain text.
    Potential crackers can exploit this weakness to gain entry and control over a
    computer or computer system, by monitoring the transmissions with programs like
    sniffit.


    Another weakness of telnet, login, rsh, ftp and rcp is their verification systems.
    These utilities allow the option of verifying users by matching their username
    with their IP address, allowing a user to gain entry without a password. A cracker
    could spoof or fake the IP address and gain access to the server.


    The SSH package eliminates these problems by using encryption and authentication
    protocols to perform the same functions as telnet, login, rsh, ftp and rcp. The
    data passed over the Internet using SSH utilities is encrypted, which makes it
    difficult to steal information such as passwords.


    SSH also allows higher levels of authentication methods to verify proper users.
    SSH uses an encrypted key to verify the identity of users. This is discussed in
    more detail later in this section.


    The network utility telnet is used to gain access to and perform commands on a
    remote computer or system, but it transmits data in plain text. The ssh can be
    used to replace telnet, since it encrypts data to prevent anyone from viewing
    it. ssh also uses authentication keys to prevent the data from being tampered
    with or sent under a false username.


    The SSH package is available in two versions, SSH1 and SSH2, representing completely
    different protocols. Since SSH1 is no longer maintained, we recommend making SSH2
    the standard version of SSH. SSH2 differs from SSH1 in a number of ways.'
