    ```

    sarlosstarburst   ALL = ALL

    ```


    This user specification allows the user, sarlos, to run any command on the computer
    starburst.

    An example configuration file can be found at www.courtesan.com/sudo//sample.sudo.


    # Log File


    Another feature of Sudo is its logging capability. Sudo can log everyone who uses
    or attempts to use Sudo and which commands they entered. By default, Sudo uses
    syslog, but can be changed to log to a specific file.

    Because Sudo allows specific monitoring of the use of root, it is ideal for new
    system administrators. Any mistakes made by a system administrator can be tracked.


    # TCP Wrappers


    Hosts connect to computer systems through different network services. However,
    all hosts should not be allowed to use those network services. To see if a host
    has access to a certain service, a daemon must check access control lists (ACLs)
    for a host''s permission on a system. This daemon is called the TCP Wrapper.


    # What Is a TCP Wrapper?


    A TCP wrapper is a daemon that prevents unauthorized hosts from accessing network
    services on a system. This is performed by wrapping each network service with
    a program that checks ACLs to see if the requesting service is allowed to access
    the service.

    For example, if the TCP wrapper daemon is used with the fingerd daemon, when host
    outsider wishes to use a finger on the system, the TCP wrapper will check if outsider
    has been denied access; and then fingerd performs the operation. If outsider has
    been denied access, the service does not start. There is also the option of running
    a shell script/command when such requests are made through the TCP wrapper.

    The TCP wrapper should be used because of the detailed security protection that
    is provided by the tcpd daemon. This daemon checks to see if a host is allowed
    or denied access, and initializes the step of denying or providing access.


    ![](img/6942796f6e22033d0f94b498c190e5cc_72_0.png)'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Obtaining the TCP Wrapper


    Wietse Venema wrote one of the most frequently used TCP wrappers, and the source
    code it can be obtained at http://cert.unisa.it/pub/Tools/Network/TCP-Wrapper/.
    An RPM version can be found at www.rpmfind.org/ RPM/rawhide/1.0/i386/RedHat/RPMS/tcp_wrappers-7.6-10.i386.html.
    The source code version at the CERT Web is the most recent and secure version.


    More Linux distributions come with TCP wrappers pre-installed, so obtaining the
    TCP wrapper may be unnecessary. The TCP wrapper''s daemon is tcpd, which is usually
    installed as /usr/sbin/tcpd.


    # Configuration of the TCP Wrapper


    Once the TCP wrapper daemon is installed, it is important to configure each network
    service the system administrator wants to wrap. This can be accomplished by editing
    the /etc/inetd.conf file. In addition to that file, the /etc/hosts.allow and /etc/hosts.deny
    files must be created and/or configured. These files will allow specification
    of host authorization.


    # Configuring the /etc/inetd.conf File


    In the /etc/inetd.conf file, a list of all available network services is showed.
    By editing this file, each service can be configured to be wrapped. Following
    is an example line of the inetd.conf file (before configuration):


    ```

    finger stream tcp now nobody /usr/sbin/in.fingerd in

    ```


    To add the TCP wrapper to this service, one would change the entry to appear as
    follows:


    ```

    finger stream tcp no wait /usr/sbin/tcpd in fingerd

    ```


    Now, when a host requests a service from the finger daemon (fingerd), the TCP
    wrapper daemon (tcpd) will be used to check authorization for that host. Changing
    the full path location of the network service to the full path location of the
    TCP wrapper daemon for each network service will be wrapped the /etc/inetd.conf
    file configuration.


    # Configuring the /etc/hosts.allow and /etc/hosts.deny Files


    Once the services to be wrapped have been specified, it is important to configure
    the hosts that will be used to use each service. The following excerpts from the
    /etc/hosts.allow and /etc/hosts.deny files provide examples for this configuration:


    ```

    /etc/hosts.allow:

    ```'
