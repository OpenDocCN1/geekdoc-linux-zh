  md: '# Theory of Operation


    # Security Audits


    The key elements to network security are the ability to analyze a network for
    tampering and the correction of vulnerabilities that could possibly invite a breach.
    Two types of software and techniques are available to aid administrators with
    either issue. One type deals with intruder detection by detecting if a security
    breach has occurred and whether anything has been altered, moved, or deleted.
    The other type of security measure is to implement a way of testing a network
    for security weakness. Ideally, security breaches in the network will not occur
    at all, and to prevent such breaches, preventive measures are extremely important.
    Several programs such as SAINT and Nessus aid in locating and correcting weaknesses
    in a network.


    # Intruder Detection


    Knowing if and when a security breach has occurred on a network is important and
    is made possible with the aid of popular programs such as Tripwire, AIDE, L5,
    and Gog&Magog. All of these programs perform the same general functions. In fact,
    AIDE and L5 are spin-offs of the Tripwire program.


    The vast popularity of Tripwire lies in its ability to configure and custom fit
    to a particular network. In addition, the information Tripwire provides to a system
    administrator quickly identifies network security breaches.


    The function of Tripwire is to monitor the configuration files of a variety of
    system-specified files and directories. Prior to the running of Tripwire, a complete
    backup of the existing network that is free from malicious modifications must
    be kept and secure. Therefore, when Tripwire checks a network, it also crosses
    the current status against what was saved in a backup. Any discrepancies will
    be displayed and the system administrator will be warned. A downside of Tripwire
    is that it is no longer an open source program, meaning that it comes with a price
    and its source code is not viewable.


    Another simple, but commonly overlooked, method of detecting intrusions is the
    location of stealth file names. A stealth file name is one where the file name
    is either a blank space or starts with a period. "Stealth" files will not be displayed
    when pulled up with the ls command. Files starting with a period are common in
    directories as configuration files or user-defined files.


    The main problem with stealth files is that because most users use only the ls
    command, an intruder could potentially create a stealth file that may not be detected
    until it is too late. When running a different file that has an intentional blank
    space in the file name, the unknown file would be started if a file name is accidentally
    left blank. Because of this, the use of the ls -a command is necessary to display
    all files to see if suspicious files exist.


    # Intruder Prevention


    Every precaution should be taken to prevent an unauthorized user from breaking
    into a network. Several programs aid system security by allowing a system administrator
    to test a network for weaknesses, and to be alerted of problems in need of correction.'
