  md: '# File Integrity


    Along with the rapid growth of the Internet and other networked systems comes
    a growing amount of shared information. Each day, a wealth of important information
    is passed back and forth on networked systems. Just as a car will not operate
    with tainted fuel, businesses and other institutions cannot function properly
    if the information vital to their operation is corrupt or tampered with. Even
    home users stand suffer complications as a result of downloading corrupt files.
    For this reason, it is important to ensure that integrity is maintained whenever
    possible. The integrity of a file is its continuing existence as a complete, unchanged
    piece of information unless specific and intentional changes are made. When integrity
    has been compromised, the results are unpredictable and potentially dangerous.


    The effects of having a file altered from its intended state can range from paltry
    to devastating. If and when a cracker invades a system, he she may be able to
    make any detrimental adjustments to the system. These changes range from adding
    and deleting files to attaching viruses and replacing files with Trojan. One of
    the traits of a good cracker is making evidence of intrusion, changes could go
    undetected indefinitely depending on the skill of the culprit. Not only is this
    bad for users who may unknowingly infect their systems, but changes to some files
    will also result in ongoing degradation of the overall system. For these reasons,
    it is important to have a way to check and maintain file integrity.


    Knowing if and what files have changed is invaluable information when tracking
    the movements of someone who has compromised a system. One method of verifying
    the integrity of a file is to use a checksum. A checksum system involves attaching
    a checksum to a file that represents the size of the file in bits. When a verification
    of integrity is needed, the checksum can be compared to the size of the file,
    and if there is a difference, the file has been changed. For example, TCP uses
    a checksum on each packet that it transmits to ensure packets arrive secure and
    unchanged as they are transmitted from one point to another on a network. A similar
    method of locating errors in transmitted files is cyclic redundancy. Cyclic redundancy
    involves the application of a polynomial to a given piece of data that will generate
    a cyclic redundancy code (CRC) based on the data''s contents. Like a checksum,
    this CRC is attached to the data and used for verification by comparison when
    the same polynomial is applied later.


    # Integrity Check Utilities


    There are several utilities for checking file integrity on a given system, depending
    on the security needs for that system. Choosing the right utilities and using
    them consistently will do much to increase system security. The following are
    a few of those utilities and descriptions of their use.


    # sum


    The sum utility will output a checksum for a specified file and a block count
    for the file. The syntax for this utility is:'
