  md: '# Network Policy


    # Purpose


    This lab demonstrates the creation of an appropriate use policy for a fictional
    company. The policy will cover the specific needs of the company, taking into
    account the company''s risk as compared to the cost of an employee restrictive
    policy.


    # Theory


    Network policies, also called appropriate use policies, are relative in nature.
    Each policy must be different to meet the needs of the specific company for which
    it is designed. However, effective policies have a similar structure.


    In order to create a network policy, many aspects must be explored and judged
    individually. An effective policy should suit a company''s specific needs and
    operations, give employees freedom to accomplish their tasks without interference,
    and restrict abuse of the network. A network policy should also establish procedures
    for various situations to create a structure of actions and consequences.


    The first step in creating a network policy should always be an assessment of
    the company''s assets, procedures, and structure. This will identify areas that
    a network policy should cover.


    After determining the status of a company, begin the network policy with a blanket
    restriction. By restricting all actions not expressly allowed, a legal safety
    net is established.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'This is less difficult than making a blanket allowance and trying to restrict
    every possible situation; there are always abuses not previously thought of that
    can occur.

    Finally, allow those actions that will best meet employee and company needs.


    # Lab Exercise


    For the purposes of this lab, a fictional company called Imaginary Enterprises
    will be used as a base for the creation of a network policy.


    # The Company


    Imaginary Enterprises is a $20-million company that sells Imaginary products in
    department stores across the United States. The company is relatively new and
    has only established a computer network for interoffice work. Previously, computers
    were individually connected to the Internet.


    Imaginary Enterprises has hired you as its new vice president of Networking and
    Information Technology. Your first task as vice president is to create an appropriate
    use policy for the LAN.


    The LAN consists of 30 individual computers linked by an Ethernet connection.
    The main network server, hoth, also serves as the router, and each network client
    must pass through it to get to the Internet. As result, hoth has a series of firewalls
    to protect itself and the LAN from external attacks.


    All connections made from outside the LAN must be considered secure. Networking
    utilities, such as FTP and Telnet, will be rejected; while utilities such as ssh
    and sftp will be permitted. However, hoth allows insecure connections from within
    the LAN to outside computers and networks.


    Hoth also blocks sites that are considered inappropriate by a private net monitoring
    service. The Web site, ALO, has been banned as well, due to its overusage during
    office hours.


    # The Employees


    Imaginary Enterprises is a diverse company made up of five major departments:
    Research and Product Development, Accounting, Marketing and Sales, Networking
    and Information Technology, and Business Operations.


    Each department has the following hierarchy: a vice president presides over each
    department and reports to the president of the company. Under each vice president
    are managers who are responsible for various employees.


    The Research and Product Development department will use the network to research
    on the Internet and to store information. The Accounting department will use the
    network for storage and accounting software. Marketing and Sales will use the
    network for storage and communication. The Networking and Information Technology
    department will require complete access to the network. The Business Operations
    department will store information on the network and will require access to all
    of the other departments’ records.'
