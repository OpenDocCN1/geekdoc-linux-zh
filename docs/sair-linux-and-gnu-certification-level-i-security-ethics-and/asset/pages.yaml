  md: '# Theory of Operation 13


    passwords created from a dictionary (or word list). If one of the encrypted passwords
    created from the dictionary matches the encrypted password taken from the system,
    the cracker knows that the password is that in the dictionary. Thus, the cracker
    has a password that can be used to illegally enter a system. A brute-force attack
    will try every possible combination of letters, numbers, and special characters
    to log in a system, trying the most likely combinations first, such as all English
    words, and then all, and will keep going until the password is cracked.


    Many passwords are easy to crack because they are relatively short and are usually
    created with words found in dictionaries. Simple number sequences also make for
    poor passwords. Passwords that are mirrors or permutations of a dictionary word
    are easy to crack with modern cracking software. Also, many users create passwords
    based on personal information, such as birth dates or a user''s name. Crackers
    could obtain such information by using the finger command.


    These attacks may be prevented by choosing a good password. A good password typically
    meets the following requirements:


    +   - Contains a mix of letters, numbers, and special characters (such as &, or
    #)

    - Made up of at least eight characters

    - Cannot be found in any language dictionaries


    A common way to create a password is to create an acronym from a personal phrase.
    For instance, T1Cjo2&TM4 could be an acronym for "The Cow Jumped over the Moon,"
    with random capitalized letters, numbers, and special characters inserted to further
    hinder the cracking of the password. A simpler effective password could also be
