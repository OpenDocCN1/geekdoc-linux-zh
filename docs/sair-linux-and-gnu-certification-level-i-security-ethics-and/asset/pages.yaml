  md: '# Glossary


    **Action** The command that is carried out when syslogd receives a log message;
    includes logging the message locally or forwarding the message to another machine.


    **back door** A means of obtaining unauthorized access to a system through a hole
    in security.


    **bastille** A utility used by administrators to strengthen the security settings
    for a network''s server.


    **brute-force attack** A method used by password crackers in all possible combinations
    of characters are used to obtain illegal entry to a system.


    **Cache** Computer memory used to store short-term information.


    CERT A service mark registered by Carnegie Mellon University; this is a unique
    number not an acronym, the organization was originally the Computer Emergency
    Response Team. CERT/CC was founded in December 1988 by DARPA to provide incident
    response for security-related issues.


    **CERT/CC (Computer Emergency Response Team Coordination Center)** CERT''s goal
    is to alert the Internet community by alerting them to new security issues.


    **certificate authority** An entity that represents the size of a file; can be
    recorded and checked if changes have been made to the file. A checksum is a unique
    number created by a mathematical formula based on the characters contained in
    a text file.


    **CMISS (Carnegie Mellon Institute for Survivable Systems)** Established in March
    2000 and dedicated to addressing and improving current and potential security
    issues.


    **Crack program** Gain passwords using a dictionary as a database and entering
    every word and all permutations of those words as a possible password.


    **Crack utility** A program that uses various methods to crack passwords on a
    system.


    **CRC (Cyclic Redundancy Code)** A generated code based on the results of the
    application of a polynomial to a given piece of data.'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# Glossary


    crypt An encryption function based on the Data Encryption Standard (DES) used
    in Unix/Linux systems for encrypting passwords.


    berspace Describes the conceptual or virtual world created by the advent of the
    computer, supported and maintained by data and its transportation; often referred
    to as the Internet.


    DARPA (Defense Allied Research Projects Agency) Established in 1958 by the Department
    of Defense; agency''s main goal is to ensure that the United States remains a
    leader in applying state-of-the-art technology.


    DEA (Data Encryption Algorithm) The algorithm used in the DES (Data Encryption
    Standard).


    DES (Data Encryption Standard) A standard for encryption based on IBM''s Lucifer
    encryption scheme, which works through permutations and manipulations of a 64-bit
    block of data and a 56-bit block of encryption keys.


    dictionary attack A method used by password crackers that compares a password
    list to a list of encrypted words in order to obtain illegal entry to a system.


    digital certificate Passport verifying the identity of a site.


    directive A command used as an option in Apache''s configuration files.


    DMZ Derived from the military term demilitarized zone, DMZ is the location of
    front ends and data servers, which are insecure areas.


    encryption The science of transforming readable data into data that cannot be
    read without knowledge of the formula used to encrypt and decrypt it.


    /etc/exports Serves as an access control list for file systems that may be exported
    to an NFS client.


    /etc/login.defs The file in which default configurations for password and account
    information are stored.


    /etc/sudoers The file that stores the sudo configuration information.


    facility The daemon or program that syslog accepts log messages.


    file integrity The continuing existence of a file as a complete and unchanged
    piece of information unless specific and intentional changes are made by an authorized
    user.


    file permissions The set of read, write, and execute values assigned to a user,
    group, and world.


    firewall A software package that prevents unauthorized access to a network by
    filtering incoming and outgoing Internet packets; also hides the IP address of
    hosts from an internal network using a proxy server to send and receive information
    from the internal network.


    GECOS A field in the /etc/passwd file for storing user information; e.g., user''s
    full name, user''s phone number.


    IMAP (Internet Messaging Access Protocol) Allows clients to access and manipulate
    e-mail messages on a remote server. It allows the manipulation of remote message
    folders as if they are local message folders.


    inetd Invokes Internet services when a connection is made to a specified port.


    IP masquerade A group of machines with a private IP address that achieve Internet
    connectivity to a machine with a public IP address.


    CPU Processor time used by all processes attached to the tty.


    KDC (key distribution center) The primary Kerberos server, comprised of the authentication
    server and the ticket-granting server.'
