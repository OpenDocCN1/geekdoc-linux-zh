  md: '# # LAB XIII

    nnmap


    # # Purpose


    This lab focuses on the port-scanning utility, nmap. It will be used to monitor
    network services and ports for security holes.


    # ## Theory


    A port-scanner scans a network or single host to determine which ports are listening
    for network connections. Port scanning is commonly used by crackers to locate
    possible network vulnerabilities. The administrator, however, can do the same
    on his or her network and fix any security holes to limit the possibility of attack.


    nmap is a port-scanning tool that can be used for either large networks or single
    hosts. nmap was designed to be a versatile port scanner, eliminating the need
    for multiple port-scanning utilities. It incorporates about a dozen port-scanning
    techniques, including TCP, UDP, and ICMP scanning, TCP Ping scanning, Direct (non
    portmapper) RPC scanning, and Reverse Ident scanning.


    # ## Lab Exercise


    The following lab is a demonstration of how nmap can be used as a security tool.
    nmap sends various types of scans to machines to determine if the service associated
    with a specific port is alive. Perform the following steps:'
