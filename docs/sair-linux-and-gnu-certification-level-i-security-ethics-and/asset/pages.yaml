    file has changed. If not changed, the text OK will be output outside the filename.
    If the checksum differs between the log file and the latest computed checksum,
    the text FAILED will be output beside the filename.


    # Encryption


    Encryption is the science of transforming data, which can be read by anyone, into
    data that cannot be read without a key, code, or knowledge of the mathematical
    formula used to encrypt it.


    Because many users, such as companies, students, and governments, rely on the
    security of their data, encryption has become an important aspect of information
    transfer. Keeping intelligence secure can be achieved to a relative degree using
    encryption.


    # History of Encryption


    Even Julius Caesar used encryption to secure messages to his government. The formula
    he used was quite simple, but a good example of how encryption worked. A message,
    for example, “I Am Caesar,” would be encrypted by moving the letters in the message
    three characters in the alphabet. Thus, the message would become “L D Fidhvu.”
    Without knowing the mathematical formula, it was difficult to determine what the
    unencrypted message was.


    Governments around the world have continued to use encryption to protect their
    secrets in war and peace. During World War II, the Allies used encryption/decryption
    devices to break Axis code. The computer used by the British to complete this
    decryption was named Colossus. After this breakthrough in encryption/decryption
    technology became a staple of the scientific field of encryption, called cryptography.


    In the 1970s, the United States recognized the need for a standard data encryption
    algorithm for nonclassified documents. The Data Encryption Standard (DES), based
    on the Data Encryption Algorithm (DEA), was the chosen cipher. Although it has
    undergone many changes, the DES has been used since as a standard'
