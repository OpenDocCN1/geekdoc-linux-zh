  md: '# CHAPTER 6


    # Troubleshooting


    # Objectives


    +   - List the basic steps to prevent system intrusions.

    - Describe the processes used to respond to an intruder.

    - List the suggested follow-up procedures to use once a system is back online.

    - Describe possible solutions to common ethics-related problems within the IT
    world.


    # Recovering from System Intrusions


    The concept of security, from simple password authentication to complex data encryption,
    focuses on one goal: keeping data and hardware safe from anyone who should not
    have access to these resources. Given such access, people can harm a system, whether
    intentionally or accidentally. In some cases, it can take weeks or months to determine
    the extent of the damage, and unless the situation is handled properly, there
    is a chance that the system will be open to further misuse and/or degradation.


    There are many courses of action from which to choose based on a number of aspects,
    including the nature of the intrusion, the priorities of the system administrator,
    and responsibilities to system'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'users. Some of these aspects may conflict with one another. For example, a
    system administrator for a large corporation may find it imperative to take legal
    action. However, performing an elaborate investigation and preparing proper records
    might be too costly in terms of server downtime. If getting a system up and running
    again as soon as possible is the top priority, the haste in restoring the system
    may allow for some damage to be overlooked. Such oversights could allow an intruder
    to easily reenter a system and further compromise security, which accomplishes
    nothing toward intrusion recovery.


    The following sections discuss actions to take if system security is compromised.
    Given the variety of motives, differing skill levels, and variations across individual
    systems, it would be nearly impossible for this section to discuss everything
    a cracker might do to a system. However, this section covers the major steps to
    be taken toward preparing for, dealing with, and cleaning up after a system intrusion.


    # Preparing for Intrusions


    It is important to emphasize the difference between preventing a security breach
    and preparing for a security breach. No matter what steps are taken to prevent
    a break-in, a system is never completely safe. Preparing for a break-in will prove
    invaluable when prevention measures fail.


    This part of the section deals with essential precautions that could be taken
    in order to prepare for a compromise of security. With all security measures,
    the following items should be tended to on a regular basis, ensuring that preparations
    are up to date as possible.


    # Institute a Security Policy


    A security policy is the most important factor in determining which course of
    action will be taken during a breach of security. It allows an organization to
    have documentation of actions, responsibilities, and penalties for all parties
    involved when a security issue arises. The creation of a security policy allows
    system administrators and other organization officials to discuss the implications
    of different security issues and to decide on a policy for each. Therefore, a
    security policy makes recovering from an intrusion more efficient by reducing
    administrative time. Additionally, a good security policy should outline the priorities
    of an organization so they will be given full consideration. For more information,
    see the section called Security in Chapter 2, “Base Systems,” of this book.


    # Intrusion Detection Software


    System administrators cannot monitor every aspect of system security. Consequently,
    several software packages are designed to monitor various aspects of system integrity.
    If an intrusion is detected, these programs will usually take a specified action
    and/or notify the system administrator. Implementing one or more applications
    will allow administrators to take action against an intruder quickly; the sooner
    the intruder is stopped, the less damage he or she can do. See Chapter 5, “Applications,”
    in this book for more information.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Updates


    Because systems are not infallible, it is imperative to keep all aspects of a
    system up to date. Having the latest security updates may not be enough to detect
    an intruder, but they will limit an intruder''s options. To find the latest software
    updates, check the Web site of the distributor. Another way to gather update information
    is to request it directly from vendors when obtaining software. Often, when downloading
    software packages, a user will be asked whether or she wishes to be notified of
    updates by e-mail. Also, check the CERT/CC Web site at www.cert.org for the latest
    security issues.


    # Backups


    Backups are the most efficient way to restore a system after it has been tampered
    with. Keeping a consistent backup cycle may be the difference between losing a
    week''s work and losing everything. If it is known that the intruder originally
    entered the system and began making changes, the administrator can restore the
    most recent backup prior to the intrusion. Any necessary files from the tainted
    system can be copied after their integrity has been verified. However, restoring
    a backup simply undoes damage done by an intruder, and whatever security hole
    was exploited will also be reinstated. Before putting a restored system back online,
    an administrator should be certain that he or she knows how the intruder entered
    the system, and update any aspects of the system the intruder may be able to exploit
    after being inside the system. (For example, you should change all passwords.)


    # Response Actions


    Although a security policy often gives direction following a system compromise,
    there are particular points of security that must be checked to ensure they have
    not been tampered with. The following is a comprehensive list of steps that should
    be taken before reinstating a compromised system. Depending on the individual
    situation, not all of the steps will be necessary. Likewise, the following list
    cannot cover every situation, but these measures should help cleanse a tainted
    system.


    You may wish to refer the incident to CERT/ CC at www.cert.org.


    # Identify/Investigate the Intruder


    It is important to learn as much as possible about an intruder once he or she
    has been discovered. This includes finding out (when possible) the identity of
    the cracker, from where or she logged in, and what might have been done. Using
    commands such as finger, w, and ps will provide information on which users are
    logged in, the machine from which they are logged in, and what they are doing.
    These commands can also redirect their output to a file, and the grep command
    can search the file for suspect users or illegal hosts. The netstat command can
    gather information regarding active connections on a network. If a user becomes
    suspect of unusual activity, basic information about him or her can be gathered
    with these commands.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# 200 Chapter 6


    Information regarding login and command history can be obtained with the last
    and last commands. The last command will refer to the /var/adm/wtmpx file for
    information regarding the login and logout times of users and terminals. The last
    refers to the /var/adm/pacct file and will output all commands issued within the
    period of the accounting file''s lifetime. Starting a username as an argument
    will give the last issued commands of a user in the order in which they were given.
    syslog will direct various kernel and program messages to files that can be stored
    either on the local or a remote host. These commands are useful for tracking a
    suspected intruder''s movements.


    Programs such xinetd or tcp_wrapper allow more in-depth monitoring and logging
    of those accessing a system. xinetd replaces the inet daemon and adds control
    over who has access to a system based on when and from where they log. xinetd
    also has the capability to log almost every aspect of a user session. The tcp_wrapper
    package monitors system ports including the exec, finger, ftp, login, rsh, sysat,
    telnet, and tftp ports. It can be configured to offer similar control over other
    programs.


    Information obtained from these commands may be misleading. In many cases, an
    intruder will take measures such as editing the files from which these commands
    retrieve their information or installing a back door in order to see that he or
    she is detected, making an intruder difficult to trace. Even if a source cannot
    be traced, do not ignore evidence that points to an intrusion. Proceed, to connect
    and repair the damage, and reinforce the system against future attacks.


    # Take the System Offline


    After gathering any necessary immediate information about the intruder, take the
    affected system as soon as possible. It is important to do this before alerting
    the intruder (either intentionally or accidentally) that administration is aware
    of his or her presence, because the intruder may take drastic and detrimental
    measures to ensure that there is no evidence of his or her actions. This could
    range from deleting a few log files to an entire file system. Even a few log files
    may not seem much like a loss, they might contain evidence of deeds the intruder
    has done to the system that might otherwise go unnoticed; these actions may be
    exploited when the system is put back online.


    # Record Everything


    Once the system has been isolated and is no longer in danger of being directly
    tampered by the intruder, make a record of everything before thoroughly investigating
    and restoring the system. Create an image of the system and store it on separate
    offline media. Also to print a hard copy of any evidence of intrusion as soon
    as it is discovered. Among files that should be backed up or printed immediately
    are logs such as authlog, lastlog, pacct, password, sulog, syslog, and wtmp. If
    some aspect of the system investigation triggers a Trojan horse that destroys
    evidence (such as deleting or corrupting files), these backups will provide for
    the continuation of the investigation.'
