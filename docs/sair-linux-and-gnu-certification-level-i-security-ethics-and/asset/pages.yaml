  md: '# Using PAM to Limit CPU Usage


    # Purpose


    Pluggable Authentication Modules (PAM) can be a powerful tool in securing a system.
    Customization of user authentication methods and security levels makes PAM a great
    choice for most systems. PAM uses modules that plug in similar to typical kernel
    modules, although different modules are available that will perform many user
    verifications. Modules can be written by the user to fix virtually any situation.
    By simply plugging in the appropriate module, security issues (ranging from limiting
    user connections to regulating root connections) can be customized.


    # Theory


    +   For PAM to implement modules, the system must have the following locations
    available:

    - /usr/lib/libpam.so.* The shared library that gives applications access to PAM
    and its modules.

    - /etc/pam.conf PAM configuration file containing module and application information.

    - /usr/lib/security/pam_*.so Location of PAM modules for use.

    - Other module-specific files Some modules need an external file to read information.'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'PAM-compatible programs can use the shared library to connect with PAM, allow-ing
    modules defined in the configuration file to be implemented. Directories other
    than /usr/lib/security may be used, but it is easier to locate modules if the
    directory remains constant.

    Another requirement is that all services in use (such as ssh or login) must be
    compiled with PAM support. Since many recent distributions are based on PAM, this
    should not be difficult. If PAM is not already installed on a system, all programs
    that utilize PAM must be recompiled with PAM support.


    # The PAM Configuration File


    The PAM configuration file,pam.conf, is the most important part of the PAM system.
    In the configuration file, the modules to be loaded are listed with their settings.
    The file is a series of single lines consisting of service name, module type,
    control flag, and the module path. The following is the basic structure of a PAM
    configuration line:


    ```

    Syntax: <service-name> <module-type> <control-flag> <module-path>

    ```


    Each field can have different values depending on the use of the module. The service-name
    is the program that will be affected by the module. Four module types are available:
    auth (checking user credentials), session (information gathering of system usage),
    account (limiting account access typically by account type or time of day), and
    password (controlling password usage). For the module to be implemented properly,
    the type must be correct. The control flag determines the priority of the module
    in one of four ways: required, sufficient, and optional. These values define a
    priority from highest to lowest, respectively. The module path defines where the
    module is located. The inclusion of the module path allows the user to choose
    modules from anywhere in a file system, not just the /usr/lib/security directory.


    # The PAM Module


    Many modules require additional files to define their function with the selected
    service. To continue the example of the resource limit module, an external file
    is needed to define which users are limited and how they are limited. In this
    case, the user must set a /etc/security/limits.conf configuration file. Module
    configuration files follow the same basic structure as the PAM configuration file,
    except that the actual fields vary between modules. For limits.conf, the basic
    structure is domain, type, item, and value. The following is the basic structure
    of a limits.conf entry:


    ```

    Syntax: <domain> <type> <item> <value>

    Example: someone@sairinc.com hard nproc 20

    ```


    This line indicates that a user, named someone, connecting from sairinc.com cannot
    (through the hard value flag) use more than 20 processes (specified by the nproc
    flag).'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'The domain field can consist of many variations of values. Wildcards such as
    an asterisk (*) can be used; to make the values in the example apply for all users,
    the domain field should contain an asterisk, which denotes all. Group names can
    also be used as a domain value. In a business setting, groups might be labeled
    rd, dev, and tech. To impose the limit on the rd group, the domain value would
    be @rd. The type field defines the strictness of the module: a soft type refers
    to a flexible maximum, while a hard type refers to a defined strict maximum. The
    type field can contain a single dash (-), which indicates that no limits should
    be placed. The item field defines what the module will limit and can be one of
    many things for the resource limit module. The value field imposes indexed limits
    with one of the following commands:


    +   core Limits the core file size (KB).

    data Max data size (KB).

    size Maximum filesize (KB).

    memlock Max locked-in-memory address space (KB).

    ofile Max number of open files.

    rss Max resident size/CPU usage (KB).

    stack Max stack size (KB).

    cpu Max CPU time (MIN).

    proc Max number of processes.

    as Address space limit.

    maxlogins Max number of logins for this user.


    For example, a user can set the maximum number of logins for the tech group to
    five with no flexibility using the /etc/security/limits.conf line:


    ```

    @tech hard maxlogins 5

    ```


    # Lab Exercises


    +   1. Set up the PAM configuration file for the resource limits module.

    login session required /usr/lib/security/pam_limits.conf

    2. Set up the resource limits module external file (/etc/security/limits.conf)
    so that CPU usage is limited to 10,000kb for everyone, with no flexibility.

    * hard rss 10000

    3. Add two lines to the resource limits module external file that limits CPU usage
    to 10,000kb strictly for the tech group and the root group, but does not enforce
    it on the root group.


    ```

    @tech hard rss 10000

    @root - rss 10000

    ```'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Questions


    +   1. How does PAM make security changes more convenient (i.e., new limits, more
    access, less access)?n2. How can a user determine if a program is PAM compatible?


    # Answers


    +   1. By keeping a list of all users and groups and their respective security
    settings, the system administrator can change the values of the users'' access
    at any time. All changes can be made with one file. PAM compacts many system security
    settings into a manageable file.

    2. Two ways are available for a user to determine that a program uses PAM. First
    check the dependencies of the program using ld, which shows the libraries that
    are linked and utilized for a particular program. If libpam and libpam_misc are
    used by the program, it most likely uses PAM. However, many programs have these
    libraries encoded into them. The second, more reliable method is to test PAM on
    the program. By adding a directory for the program and a configuration file for
    it (containing a simple PAM module to be used that writes a warning to syslog),
    the user can be assured whether the program is PAM compatible.


    # Advanced Questions


    +   1. How does PAM interact with its services? Give examples.

    2. What coding would be required to write a new PAM module that sorts mail and
    filters out spam?'
  merge: -1
