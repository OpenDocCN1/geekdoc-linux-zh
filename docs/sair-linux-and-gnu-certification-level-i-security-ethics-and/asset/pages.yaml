- img_proc: true
  md: '# Applications 191


    -U To update dev/inode numbers.


    -L To list all entries.


    -S To submit a password to switch protections.


    -I To switch some protections without submitting password (sealing time).


    -h To list this help.


    The following flags tell LIDS what kind of protection to use:


    +   -r Read only.


    +   -a Append only.


    +   -z Ignore protection.


    The LIDS HOWTO recommends the following default settings:


    ```

    lidsadm -Z

    lidsadm -A -r /boot

    lidsadm -A -r /vmlinuz

    lidsadm -A -r /lib

    lidsadm -A -r /root

    lidsadm -A -r /etc

    lidsadm -A -r /sbin

    lidsadm -A -r /usr/sbin

    lidsadm -A -r /bin

    lidsadm -A -r /usr/bin

    lidsadm -A -r /usr/lib

    lidsadm -A -a /var/log

    ```


    The lidsadm -Z entry clears out the lids.conf file. The lidsadm -A -r <filename>
    entries add a read-only entry to lids.conf. The lidsadm -A -a <filename> entry
    makes the specified file or directory append-only.


    # Add Kernel Sealing Command to Startup Files


    Next, add the kernel sealing command to the system startup files; exactly which
    one depends on your distribution. The following example is a lids script in the
    /etc/init.d directory. This file contained:


    ```

    lidsadm -I --- -CAP_MODULE -CAP_SYS_RAWIO -CAP_SYS_ADMIN -CAP_SYS_PTRACE

    -CAP_NET_ADMIN +LOCK_INIT_CHILDREN +RELOAD_CONF

    ```


    The options can be changed depending on how the kernel was compiled and with which
    options LIDS should run.


    # Reboot


    Reboot the system after configuring LIDS. Ensure that LILO has been run previously;
    otherwise, the system will not boot with a correct kernel.'
