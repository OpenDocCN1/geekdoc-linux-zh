  md: '# Shells and Commands 81


    # User Information


    Displaying system user information is an essential element of computer security
    and administration. Critical data for system security, system administration,
    and system optimization can be obtained by monitoring a user''s actions. Linux
    provides many tools for acquiring this information.


    # who and w


    The who command provides a list of the users presently logged in to the system.
    The who command accepts several options, but when used alone, it provides a list
    detailing who is logged in, where they logged in, the date, and time of the login.
    Similar to the who command, the w command shows who is presently logged in to
    a system, and it also gives detailed information about the amount of system resources,
    such as processor usage, employed by each user.


    # Synopsis of who


    Correct usage of who with its accepted switches can produce very detailed user
    information. The following is a synopsis of the who command with a list of common
    options.


    ```

    who [options] [file] [arg arg2]

    ```


    +   -i, -u --idle Shows the user''s idle time.

    -l --lookup Displays the hostname.

    -m Shows information only for the current user.

    -q --count Counts the number of logins.


    This is the standard format for the who command. If a file is listed, it is used
    to check the record of what users are logged on. If two non-option arguments are
    specified, then only the entry for the current user is displayed.


    The -i, and --idle options are used to display the idle times of the users, hours:minutes
    format.


    By using the -l or --lookup options, the hostnames used to access the system can
    be determined.


    The -m option has the same effect as using two non-standard options with who.
    It outputs the information of the user running the who command.


    If an administrator is interested in finding out the number of people currently
    logged to the system, the -q or --count options can be used to give a total at
    the end of the standard display.


    # Synopsis of w


    The w command is similar to the who command. However, w shows not only which users
    are currently logged on to the system, but also information on the system resources
    being used.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Chapter 3


    The standard format for w is:


    w [options] [user]


    +   -u Ignores names when calculating CPU time.

    -s Displays information in short format.

    -f Toggles the from field.


    Without options, w will output the username, the tty, where that user is logging
    in, the login time, idle time, JCPU time (the CPU time used by all processes attached
    to the tty), PCPU time (the CPU time used by the currently running process), and
    what the user is doing. The -u option ignores usernames when calculating the current
    CPU and process times. This can only be done if the current user has administrative
    privileges. If the information coming from the w command is more verbose than
    necessary, the -s option can be used. This will prevent the printing of login
    time, JCPU, and PCPU usage. The -f option is used to toggle the from field. While
    the default is not to show this field, a system administrator may compile w so
    that the from is shown.


    # Viewing System User History with last


    When problems occur, it is often necessary to know all of the previous users of
    the system. The last command can provide this information as well as the locations
