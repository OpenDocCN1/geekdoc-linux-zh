  md: '# 74 Chapter 3


    Additionally, md5sum information can be appended to a file. The major difference
    between md5sum and the previously mentioned utilities is that md5sum will perform
    comparative checks between log files and existing files. To do this, first create
    a logfile using the following syntax:


    ```

    md5sum [filename(s)] > logfile.txt

