  md: '# smap and smapd


    If configuring Sendmail for a firewall seems daunting a task for a system administrator,
    smap package works in conjunction with Sendmail, and addresses the two major security
    problems inherent in Sendmail: root privileges and command channel attacks. The
    program is smaller than Sendmail, and easier for a user to understand; however,
    functionality is limited.


    The smap package consists of two parts, smap and smapd. The sole function of smap
    is to accept incoming SMTP messages and place them in a queue. Because smap understands
    only the necessary SMTP commands, it is more difficult for an attacker to exploit.
    smap never runs as root, nor does it have access to outside of its mail queue.
    This keeps the program compartmentalized; an attacker taking advantage of a flaw
    in smap cannot affect the rest of the system. At intervals of time, smap will
    check smap''s mail queue, and pass messages to the queue to Sendmail, then handles
    them normally. Combined with smap''s smaller size, allowing a user to better understand
    the program and eliminate potential security hazards, smap effectively eliminates
    most Sendmail security vulnerabilities.


    The security provided by smap limits Sendmail''s functionality; smap handles only
    the smallest of SMTP commands, decreasing the usefulness of Sendmail. However,
    these limitations do not present a hindrance to most users, and it is possible
    that smap''s functionality may be broadened in the future.


    # Alternatives to Sendmail


    Several other mail agents are available to users. While features between Sendmail
    and other mail agents differ, usually trading flexibility and power for security
    or ease of use, all of them can be useful, depending on the needs of the system.


    # Qmail


    Qmail was designed as a replacement for Sendmail and was developed with security
    the highest priority. In addition to the program''s emphasis on security, qmail
    was designed to be faster and more reliable than Sendmail. Many users and developers
    believe qmail has succeeded. The original author of qmail, D. J. Bernstein, has
    gone as far as to offer a reward to anyone who can find a security hole in qmail
    that will allow a person to take over an account. So far, the challenge has gone
    unmet.


    While qmail is fast, reliable, and secure; there are flaws in the program. However,
    most of these are political rather than technical. The license that accompanies
    qmail does not allow the redistribution of changes that a user makes to his or
    her version of qmail. While this helps maintain a high level of quality, it discourages
    other developers. The development staff consists only of the original programmer,
    Bernstein; problems in the continued development and advancement of qmail appear.
    Fortunately, the program is a solid application that has continued to develop
    and evolve parallel to Sendmail.


    # Xmail


    The Xmail utility is an all-in-one SMTP, POP3, finger, and multiple domain server.
    It attempts to combine the best features of single-function mail programs into
    a single'
