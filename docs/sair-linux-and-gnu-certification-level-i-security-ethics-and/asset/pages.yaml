  md: 'TGS (ticket-granting server) The Kerberos server that issues tickets for Kerberos
    clients to connect to Kerberos hosts.


    TGT (ticket-granting ticket) Issued by the authentication server to talk to the
    ticket-granting server.


    Ticket Used by Kerberos for authentication and security purposes, and is requested
    from the KDC by a client to connect to a host.


    Trinux A Linux distribution that resides on a computer''s RAM. It allows an administrator
    to configure a network and/or test security with no changes to the computer.


    Tripwire A security-monitoring program used to detect changes in a network by
    comparing secure backups of specified files and directories against the current
    version. A program that creates checksums for a file system and the files residing
    in the file system, stores the checksums, and compares old and new checksums for
    changes in the file system.


    Trojan horse A program that damages a system while appearing to perform as a legitimate
    program.


    Trustix Trustux is a full Linux distribution that provides high security settings
    by default. It contains security features and utilities to provide a system administrator
    with a powerful security server.


    tty Virtual consoles are usually accessed by pressing Alt+F1-F6; tty provides
    terminals that display information on the standard output.


    tunneling Setting up a closed path for data transmission between two points on
    a network. Data is encapsulated upon entrance and decapsulated upon exit.


    Vi A text-editing program that can encrypt and password protect data through the
    :X command.


    virtual private network (VPN) This type of network setup allows information to
    be routed out over an existing open network as if over a closed, private network.


    Visudo An editor to edit the /etc/sudoers file.


    vlock Locks current or all virtual terminals until the user password is entered.


    Web A Web-based program that allows system administrators to perform administrative
    actions, view logs, configure networks, and more through their Web browser.


    Worm A program that rapidly replicates and propagates itself within a system,
    consuming many available system and network resources.


    Xlock Locks the X Window terminal with a changing X server graphic until the user
    password is entered.


    Xlogmaster A graphical program through which a system administrator can view current
    system logs, as well as other system information such as disk usage and current.'
