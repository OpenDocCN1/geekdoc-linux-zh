  md: '# 380 Glossary


    ing a request to an internal Internet server. When an Internet object is requested,
    the proxy server will provide a cached copy of the page rather than getting the
    page externally. Proxy servers are usually used as part of a greater network security
    scheme.


    **pty (pseudo-terminals)** Used to provide terminals for remote login sessions.


    **public key** An encryption key for a site that is made publicly available in
    order to facilitate other sites to send private messages to that particular site.


    **public-key system** A system in which the user has a private and a public key;
    the public key can send and receive the user''s data in a secure fashion.


    **rcp** Kerberos program used to securely copy files from one machine to another.


    **realm** Local Kerberos network with one primary KDC.


    **login** Kerberos program used to log in to a remote computer


    **SAINT (Security Administrators Integrated Network Tool)** Fully interactive
    security prevention program that tests a network for security weaknesses and informs
    the user, as well as providing information on possible corrective measures.


    **SANS (System Administration, Networking, and Security)** The SANS Institute
    is an organization of more than 96,000 professionals who share information in
    a cooperative effort. The main focus of the institute is to spread knowledge that
    will be of benefit to system administrators, networking and security professionals.


    **SCP (secure protocol)** Networking utility similar to SFTP that transfers files
    over the Internet using encryption and authentication protocols. SCP can also
    be used to authenticate permissions on individual files and copy entire directories.


    **SFTP (Secure File Transfer Protocol)** A networking utility that uses cryptography
    and authentication protocols to safely transfer files over the Internet. SFTP
    is a more secure version of FTP.


    **shadowing** Involves storage of password and password configuration information
    in the /etc/shadow file, instead of the original /etc/passwd file.


    **S/Key** One-time-password system developed by Bellcore in 1994.


    **SMTP (Simple Mail Transfer Protocol)** A protocol used for exchange of e-mail
    between servers on the Internet.


    **ssh (Secure Shell)** A program that encrypts all traffic and supplies assured
    levels of authentication depending on necessity. The ssh package includes the
    utilities ssh, sftp, scp, and login.


    **SSL (Secure Socket Layer)** This protocol provides encrypted TCP connections.
    SSL is layered beneath application protocols such as HTTP, SMTP, and FTP.


    **strong password** A password that is difficult to crack by a malicious user,
    changed often, and stored in a secure place.


    **stunnel** This program allows encryption of an arbitrary TCP connection inside
    SSL (Secure Socket Layer).


    **Sudo** A program that allows a user to execute commands as another user.


    **Sysmon** A system-monitoring tool that allows a system administrator to view
    basic system and network services.


    **TCP wrapper** This adds another layer (wrapper) to packets sent between client
    and server. It is used to monitor and filter incoming requests for various network
    services. This is a daemon that works with network daemons to prevent unauthorized
    hosts from accessing network services on a system.


