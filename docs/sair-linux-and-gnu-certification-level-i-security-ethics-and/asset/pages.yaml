  md: 'one-character difference in the message will change its MD5 number. MD5 is
    commonly used by CERT/CC when alerting users about a new patch or fix. Once users
    download a file and run the MD5 utility on it, they should compare the MD5 numbers.
    If the numbers match, the file has not been altered.


    Backups of trusted materials can be used when software has compromised. Trusted
    backup copies are often helpful in diagnosing and eliminating problems.


    Keep software on the system current. Even though patches and fixes can create
    new problems, they generally eliminate ones.


    Good security software is one of the best defenses available users. Remember to
    keep this software current and to use it often.


    Be attentive to logs and network output. This may help identify attempted attacks
    on a system, and give valuable information to help reinforce security.


    These ideas can provide users with a basis for starting and keeping a secure network.
    Above all, protecting a network requires secure software, secure user practices,
    and up-to-date knowledge.


    # Encryption


    Because information transferred over networks passes through multiple computers
    between its source and destination, many unauthorized users have the capacity
    to read or change the contents of information in transit.


    Encryption is the process of changing the information format so that only the
    intended recipient will be able to read it. Cryptography has evolved from simple
    letter substitutions to complex mathematical algorithms; this process has been
    used for many years to maintain secure communications. Cryptographers continue
    to search for weaknesses in encryption systems to make them more secure. The science
    of cryptography has grown significantly through the advances of computer technology.


    Once utilized only by the government, high-level encryption has evolved over the
    past decades; there are now many encryption programs available to the general
    public. With the growth of shared information on networks, encryption has become
    increasingly necessary to ensure your privacy.


    # PGP


    Pretty Good Privacy (PGP) was the first encryption program available to the general
    public. The program was designed by Philip Zimmermann and released as freeware
    in 1991. Despite U.S. export laws, the program quickly spread internationally.
    PGP caught the attention of the programming community, which promptly adopted
    and made enhancements to the program. Encryption and Internet cryptography exploded
    as programmers and mathematicians worldwide began working to improve PGP, and
    to develop encryption programs of their own. The effort to make encryption as
    widespread and secure is now a global cooperation. Encryption gives people power
    over their privacy. Philip Zimmermann wrote in the PGP User''s Guide Volume I:
    Essential Topics, “PGP empower people to protect their privacy in their own hands.
    Having a growing social need for [encryption]. That is why we'
