  md: '# Shells and Commands 75


    for encryption. Unix/Linux systems use crypt for encryption of passwords, which
    is based on the DES. Other programs that can be used for encryption are Pretty
    Good Privacy (PGP) and Vi (using the :x command).


    # Why Use Encryption?


    Encryption is a valuable resource available to the public. At little or no cost,
    information can be secured for a company, a government, or an individual. If the
    data does not require encryption, programs such as PGP can be used to prove that
    information originated the claimed source. There are many applications of encryption,
    and computer users should take advantage of the possibilities it presents.


    # Available Encryption Programs


    A program based on public-key encryption, named PGP, has become a standard for
    encrypting data. Unix and Linux systems use DES, or a modified version of it,
    for the crypt functions which include password encryption.


    # PGP


    One of the most popular encryption programs in use today is PGP. This program
    allows users to send and receive encrypted data and provides options to prove
    the actual origin of data. PGP is based on the idea of public-key encryption,
    meaning that a user will have two keys: one private and one public. The private
    key can be accessed through a password, which is known only by the owner of the
    key.


    Other users may be given the public key, to send messages to the key''s owner.


    This method offers secure advantages. The owner of the private key will be the
    only one allowed to read messages sent to that user, with no possibility of the
    data tampered with or stolen. Any recipient of messages from the owner of the
    private key will be sure that the message has not been altered or read by any
    unauthorized user.


    PGP software can be downloaded from www.pgp.com/products/freeware/default.asp.
    This site provides instructions for downloading PGP for Linux.

    Once installed, a user must create his or her set of public and private keys.
    To do this, create a .pgp directory in the $HOME directory of the user and enter
    the command:


    ```

    $ pgp -kg

    ```


    The user is prompted to select the RSA key size. This can be (with PGP version
    2.6 and greater) 512, 768, or 1024 bits. Higher numbers will increase the time
    of encryption/decryption process, but it will be harder to crack.


    The user is prompted for a user ID. This can be any combination of characters
    or white spaces, but it is best to choose an ID that easily describes the user.
