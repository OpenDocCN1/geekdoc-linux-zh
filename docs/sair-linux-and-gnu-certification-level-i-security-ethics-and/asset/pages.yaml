- img_proc: true
  md: 'The TEST chain can be used as a database to store the IP addresses (or name)
    of computers denied access. An unlimited number of new chains can be specified,
    each with its own set of rules.


    # Understanding the SYN Bit


    In the previous example, it was specified that 192.168.1.23 should not be allowed
    to establish a TCP connection with the computer. Unfortunately, this command line
    prevents you from establishing a TCP connection with 192.168.1.23, because the
    TCP protocol requires packets to go in both directions. TCP SYN packets are the
    first packets sent in a TCP connection and are responsible for establishing the
    connection. Use the -y option to specify that TCP SYN packets should be allowed.


    ```

    ipchains -D TEST 1

    ipchains -A TEST -s 192.168.1.23 -p TCP -j DENY -y

    ```


    You will be able to make a connection with 192.168.1.23, but that computer will
    not be able to establish a connection with you.


    # Using the Exclamation Point (!) Operator


    Ipchains provides the exclamation point (!) operator for additional control. Many
    of the options, such as -s, -d, -p, -i, and -y, can have the exclamation point
    (!) operator applied to them to reverse their action. For instance:


    ```

    ipchains -A TEST -s 192.168.1.23 -p TCP -j DENY

    ```


    effectively makes it impossible for any computer except 192.168.1.23 to establish
    a TCP connection.


    # Saving the ipchains Configuration


    Specified ipchains rules will not remain after rebooting; the ipchains-save and
    ipchains-restore commands can be used to avoid losing this information. An example
    of the ipchains-save command is as follows:


    ```

    ipchains-save > /home/my_firewall

    ```


    This saves the ipchains configuration in the /home/my_firewall file. Then, when
    rebooting use ipchains-restore to renew the configuration:


    ```

    ipchains-restore < /home/my_firewall

    ```


    Make a backup copy of the saved file in case of errors. For example, if restore
    is accidentally used in reverse:'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# ipchains-restore > /home/my/firewall


    This will effectively lose all the data in my_firewall. Another benefit of using
    ipchains-save and ipchains-restore is multiple ipchain configurations can be changed
    to suit your needs with a few commands.


    # Lab Exercises


    This exercise builds a configuration to ACCEPT certain computers and DENY others.
    Two computers, one with root access, are needed for this exercise. The computer
    issuing the ipchains command is referred to as System A, and another computer
    is referred to as System B.


    # Exercise One


    Use the ipchains tools to create two chains, one called TCP and the other called
    ICMP. As their names imply, one chain will be responsible for handling TCP packets
    and the other will be for handling ICMP packets. Use the following commands to
    create the chains:


    ```

    ipchains -N TCP

    ipchains -N ICMP

    ```


    Reject the computers that have the first three parts of System B''s IP address
    (192.168.1.23\*), but allow all others. Also, make sure that a TCP connection
    can be established with those computers, and log all computers that match rules
    in both the TCP and ICMP chains.


    First, set up the input chain to redirect incoming TCP and ICMP packets to the
    correct chain.


    ```

    ipchains -A input -p TCP -j TCP

    ipchains -A input -p ICMP -j ICMP

    ```


    Next, set up the rules in the TCP and ICMP chains, using the first three parts
    of System B''s IP address. The command for TCP is:


    ```

    ipchains -A TCP -s 192.168.1.0/24 -j DENY -p TCP -y -1

    ```


    Remember to replace the first three parts of the IP address with the first three
    parts of System B''s IP address. For the ICMP chain, enter the following:


    ```

    ipchains -A ICMP -s 192.168.1.0/24 -j DENY -p ICMP -1

    ```


    Again, substitute System B''s IP address in the input rule for ICMP. Confirm that
    a TCP connection can be established with the computers that you are denying, by
    using telnet to connect to System B.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# 278 Lab XII


    ```

    telnet <B''s IP address>

    ```


    Now that you are at the other computer (B), type:


    ```

    telnet <A''s IP address>

    ```


    This confirms that you cannot telnet back to System A. Also, while on System B,
    confirm that ICMP packets are off on System A by issuing the ping command.


    ```

    ping -c 1 <A''s IP address>

    ```


    It could take a few seconds before it exits and gives you a status report. To
    ensure system security, make the first rule of the input chain block all incoming
    packets until all of the rules are made. This keeps people out until you finish
    the rules.


    # Exercise Two


    There is one problem with the previous configuration. FTP is blocked from System
    B computers and it is possible to FTP those computers, but as soon as a command
    is typed, the system will lock up. In the next exercise, this problem is solved
    and the exclamation point (!) is used. It is important to realize that if you
    are FTPing from another computer to your computer, then a TCP connection has to
    be established both ways. This is why the original firewall did not work. If you
    tried to list the directory contents of the System B computer, it would lock up
    because it specified that any packets coming over a TCP protocol should be blocked
    in the TCP chain. By inserting a new rule at position 1 in the input chain, this
    problem can be solved:


    ```

    ipchains -I input 1 -s 0.0.0.0/0 ftp-data -j ACCEPT

    ```


    This specifies that FTP connections from all sources are acceptable. For the next
    part, reverse the rules and only allow TCP and ICMP connections from computers
    that match the first three parts of System B''s IP address (using the ! operator).


    ```

    ipchains -R TCP 1 -s 192.168.1.0/24 -j REJECT -p tcp -y -1

    ipchains -R ICMP 1 -s 192.168.1.0/24 -j REJECT -p tcp -1

    ```


    Finally, save the configuration.


    ```

    ipchains-save > <file_name>

    ```


    The rules can be restored with:


    ```

    ipchains-restore < <file_name>

    ```'
