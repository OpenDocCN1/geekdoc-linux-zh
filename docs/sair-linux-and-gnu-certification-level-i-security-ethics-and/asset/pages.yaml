  md: '# Using Crack to Check for Weak Passwords 267


    It is now time to compile the default wordlist for Crack. Simply type ./Crack

    -makedict.


    If there are any errors during compilation of Crack, you must erase the run directory

    before trying it again. This can be done by typing rm -r run. Make sure to do

    before attempting another compile to avoid future complications.


    # Getting the Password File


    Crack is designed to search for passwords in the /etc/passwd file. However, when
    a

    computer is shadowed passwords, the /etc/passwd file does not contain the

    hashed passwords. This can be accounted for by merging the two files; Crack includes

    a script for doing this, because shadowing is so common. To find out if your system\uses
    shadowing, search for /etc/shadow file by typing /ls /etc/shadow/. If the

    file is not found, then your system does not use shadowing. If the filename is
    returned,

    then your system uses shadowing.


    For systems that use shadowing, the /etc/passwd and the /etc/shadow files

    must be merged with scripts/shadmrg.sv password. This invokes the shadmrg.sv

    script in the scripts directory and redirects its output to the password file
    in the main

    directory.


    If your system does not use shadowing, simply copy the /etc/passwd file into the

    main Crack directory, by typing /cp /etc/passwd password/. Now you are ready to

    begin searching for passwords.


    # Run Crack on Your Password File


    To run Crack type /.Crack password/ at the command line, assuming the password

    file is named password. This will invoke the Crack script, launching all the necessary

    programs, which then run in the background.


    To check the progress of Crack, run ./Reporter-quiet, which shows all the

    words that have been cracked. The passwords will be shown in a format similar
    to

    the following:


    ```

    -- passwords cracked as of Fri Sep 29 12:16:18 CDT 2000 ---


    Gessed test [test] [password]

    Guessed kentavos [abc] [password /bin/bash]

    Guessed chucha [abc123] [password /bin/bash]

    Gessed xfade76 [abc] [password /bin/bash]

    Gessed bcbrown [abc123] [password /bin/bash]

    Gessed root [pepper] root [password /bin/bash]


    -- done --

    ```


    Since Crack can take a long time to go through the entire wordlist, there are
    various

    ways of using the utility. Each method is discussed in the documentation, but
    only

    two will be focused on here.'
  merge: -1
