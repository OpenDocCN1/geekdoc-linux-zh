    done by combining the mail facility with the asterisk (*) wildcard, which includes
    all priorities.


    The second rule is identical to the first and saves all authentication messages
    to the log file, /var/log/authentication.log. This is done by combining the auth
    facility with the asterisk (*) wildcard.


    The third rule saves all messages with a priority equal to or greater crit to
    the log file, /var/log/critical.log. Here, the asterisk (*) is used in place of
