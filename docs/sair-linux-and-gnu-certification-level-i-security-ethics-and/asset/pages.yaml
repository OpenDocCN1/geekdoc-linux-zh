    # chrooted FTP Server


    # Purpose


    This lab discusses the setup and configuration of an FTP server secured with chroot
    capable of handling both authenticated and anonymous users. The setup of an FTP
    server is divided into two sections: the setup of ftpd and the creation of the
    server''s file area.


    # Theory


    FTP is one of the many services available on the Internet. FTP servers are used
    by businesses, universities, government agencies, and individuals to distribute
    various files, including documents, software demos, and software patches. While
    Linux makes the setup and configuration of a FTP server relatively easy, proper
    care must be taken to ensure that the server is as secure as possible. By creating
    a chrooted FTP server, all anonymous and authenticated users will be confined
    to the directory structure of the FTP server.


    # Setting up the ftpd Server Daemon


    To run an FTP site, you must have a server daemon to handle FTP clients. The default
    server available with most Linux distributions is ftpd. The server will be initiated'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'through inetd, so you must make sure that inetd.conf contains a line that defines
    the properties of the FTP daemon. After inetd.conf has been edited, either inetd
    must be restarted or the computer must be rebooted.


    # Initiating ftppd


    The line that initiates FTP follows this format:


    ```

    ftp stream tcp nowowait root [pathname] [options]

    ```


    This configures FTP to use TCP and spawn ftppd when a new connection is made.
    The pathname should be the path to your FTP daemon. For example, if ftppd is located
    in /etc/file with logging enabled, the line in inetd.conf would be:


    ```

    ftp stream tcp nowowait root /etc/ftpd ftppd -l

    ```


    In most Linux distributions, this line is present in inetd.conf, and may or not
    be commented out. Make sure that the line is uncommented, and ftppd will be ready
    to run the next time inetd is restarted.


    No options are required in order to allow unauthenticated users access if an anonymous
    FTP server will be running: ftppd will automatically chroot anonymous users to
    the home directory where the anonymous login is created. If you plan to allow
    normal users to access your server, use the -r option and specify a root directory
    for your server file system, preferably the same directory which anonymous users
    will be allowed access. This option will chroot the users to your newly specified
    root directory in the same way anonymous users are handled. Otherwise, every user
    who logs in will have access to all files on your hard disk.


    # COMMAND-LINE OPTIONS


    +   -a Enables use of ftppass configuration file.

    -a Disables the use of ftppass configuration file. This option is set by default.

    -d Debugging information will be written to the syslog.

    -i Files will be logged to the xlog unless ftppass or the -X switch is being used.

    -I Disables the use of RFC931 for determining client usernames.

    -l Sessions (failed and successful logins) are logged to syslog. Using a second
    time will log all commands, and a third entry will cause logging of file transfers.

    -L All commands sent to the server are logged to syslog.

    -o Files transmitted will be logged to xlog unless ftppass or the -x switch is
    being used.

    -p ctriport Specifies the control connection port used by the daemon. Normally
    specified in /etc/services, it is only available if either the -s or -S switches
    have been set.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# chrooted FTP Server 311


    +   -P dataport Specifies the data port used by the daemon and is normally designated
    in /etc/services. Usually this port is directly prior to the control connection
    port.


    +   -Q Enables the use of PID files to determine whether the user limit class
    has been reached. This option is set by default.


    +   -Q Disables the use of PID files. Using -Q will disable user limits.


    +   -r rootdir ftpd will chroot to the indicated directory upon loading, which
    will limit user access to files.


    +   -S Places the daemon in stand-alone operation mode, which will run the daemon
    in the foreground.


    +   -S Places the daemon in stand-alone operation mode, which will run the daemon
    in the background.


    +   -t timeout Inactive connections will be timed out after timeout seconds. The
    default is 15 minutes.


    +   -T maxtimeout FTP clients may request a timeout period. -T sets the maximum
    amount of time in maxtimeout that a client can request as a timeout period.


    +   -u umask Sets default permissions on incoming files to umask.


    +   -V Debugging information will be written to syslog.


    +   -V ftpd will display version and copyright information and then terminate.
    Every login and logout is recorded in the wtmp file; -w is set by default.


    +   -W Logins and logouts will not be recorded in the wtmp file.


    +   -X Routes output from using -i and -o into the syslog file instead of xferlog.


    # Configuring the Server Area


    After the FTP daemon is up and running, an area will be created on your hard disk
    containing the files that other users may access. You will need to set up all
    users, normal and anonymous, who will be accessing your server.


    # Setting up Users


    The directory structure for your FTP server will require a new group. The name
    of the group is not important, but all directories and files that make up your
    server file area will be owned by this group. To create the group, edit the /etc/group
    file and add a new group, making sure that its GID is unique. The addition to
    the /etc/group file should look like the following:


    ```

    ftp:200:

    ```


    ftpd uses the /etc/passwd file to determine authentication for all users. It is
    important to note that any user existing in the /etc/passwd file will be allowed
    FTP access to your server. Anonymous users will log in with a special FTP account
    having'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'locked password accepts any given password. In some Linux distributions, the
    FTP account already exists. To configure this account for anonymous FTP, replace
    the password field with an asterisk (*) and place an invalid shell in the shell
    field. The home directory specified for FTP will be the directory to which ftppd
    chroot when an anonymous user logs in. The anonymous FTP account should belong
    to the new group created. When properly configured for anonymous access, the user
    FTP should look like this:


    ```

    ftp:*:200:200:Anonymous FTP:/home/ftp:/bin/false

    ```


    If the FTP user does not already exist, create one with a unique UID.


    # Directory Structure and Permissions


    The creation of an environment secured by chroot requires you to make a self-contained
    directory structure for your FTP server. Use mkdir to create the home directory
    specified for passwd user in /etc/passwd. For example:


    ```

    mkdir /home/ftp

    ```


    will be the root directory for your FTP server. It should be the directory given
    to ftppd when the -r option is used, unless you plan to make separate areas for
    anonymous users. If this is the case, two directory structures will be needed:
    one root is specified by the FTP user account, and one root is specified with
    the -r option when ftppd is initiated.


    Underneath the FTP root directory you will need three directories: ~/bin, ~/etc,
    and ~/pub. These directories will hold files required for navigation through the
    FTP file area, as well as the files that will be available for users to download.


    All of these directories, including your FTP root directory, will need to be owned
    by root and belong to the FTP group previously created. These qualifications will
    help to restrict access to users while allowing them freedom to navigate the FTP
    directory structure and ~/ftp/pub directories should be set to mode 555 using
    chmod command, giving users read and execute access. ~/bin and ~/etc should be
    set to mode 111 to allow only execute access. These directories will only contain
    system files and should not be readable by users. Any other directories created
    underneath ~/ftp/pub should also be owned by root, belonging to the FTP group,
    and be set to mode 555.


    # Copying and Editing Files


    Since users chroot within their FTP directory structure, they will only have access
    to system commands within that structure. The only command they need access is
    ls, which will allow them to list the contents of directories. Use cp to copy
    ls from /bin/ls to ~/ftp/bin. The copy of ls should be owned by root and belong
    to the FTP group. Its mode should be set to 111 for execute-only access.


    You may also wish to copy /etc/passwd and /etc/group to ~/ftp/etc; ftppd will
    use these names for file ownership. If it cannot'
