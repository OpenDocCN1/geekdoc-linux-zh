  md: 'If the administrator only wants to allow connections from one domain, lucasarts.com,
    the directives might look like the following:


    +   - deny deny, allow

    - allow from lucasarts.com

    - deny from all


    # access.conf Options and Security


    By default, Apache, by way of access.conf, limits access to options that may need
    to be enabled. While enabling these options may provide features that are needed,
    they open up the possibility for security problems, and therefore should be discussed.
    Table 5.4 lists the options that may be used with a directory structure in the
    access.conf.


    The ExecCGI option allows CGIs to be executed within a directory structure. CGIs
    are used to provide interactivity on the Web for users. However, caution should
    be taken when allowing CGIs. If a CGI is poorly written, it could inadvertently
    weaken system security. The administrator should be wary when allowing CGIs and
    should make sure that the CGIs installed on the Web server are trustworthy.


    The FollowSymLinks option allows remote users to follow symbolic links by clicking
    on hyperlinks. Enabling this option has serious security implications. Users could
    link to a critical system file and thus circumvent the purpose of the access.conf
    file. Enabling the FollowSymLinks option is highly discouraged.


    The Includes option enables Server Side Includes (SSI). SSI can be a useful feature,
    allowing instant information to be added to a Web page, such as the current date
    and time. SSI can also be used to include HTML code from separate files to produce
    one Web page. However, enabling this option is also discouraged. By using the
    exec directive, users can write HTML code that executes commands. The danger lies
    in the users'' ability to write code that opens up the possibility of a remote
    attack.


    When the Indexes option is enabled, Apache will list the files in an accessed
    directory if no index (index.html, default.html, etc.) is present. Again, enabling
    this option is not advised, since doing so allows someone to browse through the
    files in the directory tree.


    Table 5.4 access.conf Options


    | OPTION | DESCRIPTION |

    |---|---|

    | ExecCGI | Specifies that CGIs can be executed under this directory hierarchy
    |

    | FollowSymLinks | Allows remote users to follow symbolic links via a hyperlink
    (dangerous) |

    | Includes | Specifies that Apache will process Server Side Includes |

    | Indexes | if enabled, Apache will list the files in an accessed directory if
    no index is present |'
