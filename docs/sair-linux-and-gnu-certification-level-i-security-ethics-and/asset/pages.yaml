    # Command-Line Options


    The command-line argument format for swatch follows the format:


    ```

    swatch [options] [input-source]

    ```


    An example of a command that could be used to monitor the /var/log/ message file
    might be similar to the:


    ```

    swatch -f /var/log/messages -c /usr/local/etc/swatchrc.messages -r 05:00

    ```


    -f, -c, and -r are some of the command-line arguments that can be used when running
    swatch. The -f switch switches to run the contents of the /var/log/messages file
    through swatch to monitor this file continuously. the -t switch would replace
    this command. The -c switch switches to save the configuration file for the /var/log/messages
    file in the /usr/local/etc/swatchrc.messages file. The -r argument switches to
    accomplish all subsequent actions at 5:00 A.M. (A 24-hour clock is assumed if
    A.M. or P.M. is omitted after the hh:mm field.) Other command-line options include:


    ```

    --input-record-separator=regular_expression

    ```


    This will separate log records when it comes to regular_expression. The default
    is carriage return.


    +   -help


    This prints information on how to use swatch.


    ```

    --dump-script*=[filename]

    ```


    This is used for debugging purposes and will print filename the generated Perl
    code, instead of running it.


    # Editing the swatch Configuration File


    To edit any swatch configuration file, simply open that file within any text editor
    such as Vi, Emacs, or Pico. Each line of the configuration file, except for comment
    lines delimited by the #, is an expression similar to a Perl regular expression
    stating swatch will look for, or match, in the log file. This is followed by tabs
    and separations and will have the form:


    ```

    /pattern[/,pattern/...] action[action,action,... [[HH:MM]:SS]

    [start:length]

    ```'
