    received by the host and will be forwarded by the host; and user defined, which
    is a special type of chain created by the user that receives packets from the
    three main chains for processing. A packet travels down the chain and is checked
    against each rule. If the packet matches a rule, then the default action, or target,
    is taken.


    Rules chains allow for complex filtering of data entering or leaving a system
    making it easy to install and maintain the rules.


    # ipchains


    To use packet filtering, the rules in the chains must be configured with a tool.
