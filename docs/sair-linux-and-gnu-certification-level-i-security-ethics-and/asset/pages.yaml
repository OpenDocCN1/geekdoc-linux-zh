- img_proc: true
  md: '# Installation and Configuration


    LIDS can be difficult to install because it is both a kernel patch and a normal
    user-level program. Configuration is time consuming because LIDS offers a multitude
    of options.


    # Preparing for LIDS


    To prepare a system for LIDS, ensure first that the system is free of back doors;
    LIDS might be able to prevent intruders from doing major damage to a system, but
    it will not stop someone who has an alternate route to the system. Check all running
    processes and startup files for any irregular entries. Check the log files for
    any possible break-in attempts or security breaches.


    It is also important that the system administrator has complete physical control
    over the system. Another user with access to the console could boot with a non-LIDS
    kernel or from a boot disk. Either of these boots would disable LIDS.


    # Downloading


    LIDS can be downloaded from www.lids.org/download.html. This section uses LIDS
    version 0.9.9 for the 2.2.14 kernel. If employing other versions, read the LIDS
    documentation for these distributions and make sure to have the source for the
    corresponding kernel on the hard drive being used. Each version of LIDS is made
    for a specific kernel release.


    # Unpacking the Files


    Place the archive into the /usr/src/ directory and then unpack the LIDS archive
    and kernel source using tar -xzvf <filename>. If necessary, a user should be able
    to untar the files through a different method.


    # Patching the Kernel


    To patch the kernel, add the LIDS code to the standard Linux kernel. Change directories
    to where the kernel source is stored, commonly /usr/src/. Enter the following
    at the command line:


    ```

    #patch -p1 < ../lids-0.9pre4/lids-0.9pre4-2.2.14.patch

    ```


    # Compiling the Kernel with LIDS Support


    Next, compile a new kernel with the freshly patched kernel source. When configuring
    the new kernel, make sure Prompt for development and/or incomplete'
