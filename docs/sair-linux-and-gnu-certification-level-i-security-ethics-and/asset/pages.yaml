    # Secure Your Directory Structure


    Many intrusions through Sendmail are the fault of lax file and directory permissions.
    To improve the security of Sendmail, you should improve the overall security by
    tightening restrictions on system critical files and directories. For Sendmail,
    the most important files and directories are /etc, /var/spool/mqueue, and the
    Sendmail configuration file in /etc/mail.


    Set the /etc directory to mode 755 using the chmod command and ownership to root
    the chow command. This in this case, prevents any other owner of the directory,
    from writing files within the directory. Users and groups will still have read
    and execute privileges within the directory.


    The mail queue directory, /var/spool/mqueue, should have tighter restrictions
    on it. Change the mode of the directory to 700 and its owner to the user you made
    for RunAsUser if you decide to use that option. Or ownership should belong to
    root. For this directory, only RunAsUser will have access to the contents. The
    entire path to your mail queue directory, including /, /var, and /var/spool, should
    be protected as well. Set all of these directories to 755 and set their owner
    to root.


    The sendmail.cf, located in /etc, should be protected because Sendmail reads and
    trusts it. Also, tighten the permissions on /etc/mail. Set sendmail.cf to mode
    644 and its owner to the user you created for TrustedUser. This will prevent all
    writing to the configuration file. Set /etc/mail to mode 755 also owned by TrustedUser.


    The most critical files and directories relating to Sendmail now have secure permissions.
    It is recommended that you also improve security over any other files and directories
    that intruders may use to harm your system.


    # Clean up the Aliases File


    The aliases file, located in /etc, contains e-mail redirections to other user
    accounts and programs. Remove all redirections to programs or scripts that will
    process e-mails automatically. To secure the aliases file, open it in an editor
    and begin'
