    $ killall -HUP inetd


    # Kerberos Client Configuration


    All the Kerberized client programs should be installed in the /usr/local/bin directory,
    there should be the following utilities:

    login, telnet, ftp, rcp, rsh, kinit, klist, kdestroy, kpassword, ksu, and

    krb524init. In the /usr/local/sbin directory, there should be login.krb5.

    The administrator should put the /usr/local/bin directory ahead of the /bin

    and /usr/bin in the user''s path. This will launch the Kerberos version of login,

    telnet, ftp, rcp, and rsh by default.

    On the client machines, the /etc/services file must be edited to include Ker-

    beros'' services. Add the following lines to the services file:


    | kerberos | 88/udp | kdc | # Kerberos V5 KDC |

    | --- | --- | --- | --- |

    | kerberos | 88/tcp | kdc | # Kerberos V5 KDC |

    | klogin | 543/tcp | | # Kerberos authenticated login |

    | kshell | 544/tcp | cmd | # remote shell |

    | kerberos-adm | 749/tcp | | # Kerberos 5 admin/changepw |

    | kerberos-adm | 749/udp | | # Kerberos 5 admin/changepw |

    | krb5_prop | 754/tcp | | # Kerberos slave propagation |

    | eklogin | 2105/tcp | | # Kerberos auth. & encrypted #login |

