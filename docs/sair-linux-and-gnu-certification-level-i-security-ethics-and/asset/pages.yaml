  md: '# 172 Chapter 5


    bcbrown can download wduffee''s public key from a keyserver, or wduffee can export
    the public key into wduffee a file and distribute it accordingly. To export a
    public key owned by userID to the file key.asc, this command is


    ```

    gpg --output key.asc wduffee

    ```


    key.asc is the name of the file key which will be exported to, and wduffee is
    the userID for which the key is created. This will create the key.asc file that
    can be sent through FTP or e-mail to bcbrown. Once bcbrown has the file, he can
    extract the contents to his public keyring with the following command:


    ```

    gpg --import key.asc

    ```


    wduffee''s key to bcbrown''s public keyring, and now bcbrown can encrypt data
    and send it to wduffee. Of course, wduffee will also need to obtain bcbrown''s
    public key in order to decrypt messages sent by bcbrown or to encrypt messages
    to bcbrown.


    For bcbrown to encrypt a file specified for wduffee (in this example named fileToEncrypt),
    bcbrown should execute the following command:


    ```

    gpg -se -r wduffee fileToEncrypt

    ```


    Here, the file fileToEncrypt is being encrypted for wduffee. In this case, the
    -s option instructs gpg to sign the file with the originator''s userID; bcbrown.
    The -e option instructs the program to encrypt the file. The -r option takes the
    argument wduffee, in order to specify wduffee as the recipient. After typing this
    command, bcbrown will have to authenticate himself by entering his pass phrase.
    Only then will gpg execute the command. This will create a file named fileToEncrypt.gpg,
    which can only be decrypted by wduffee''s private key.


    Once wduffee has obtained fileToEncrypt.gpg, he must decrypt it with his private
    key in order to read it. It is performed with the following command:


    ```

    gpg fileToEncrypt.gpg

    ```


    wduffee will be prompted for his pass phrase, after which GPG will create a new
    file, named fileEncrypt, which will be a decrypted copy of the original file that
    bcbrown intended for wduffee.


    This is an example of one of the many uses of gpg. Another use is mailing for
