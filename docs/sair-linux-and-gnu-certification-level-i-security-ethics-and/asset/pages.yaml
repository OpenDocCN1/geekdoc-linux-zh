  md: '# Tiger


    Tiger is another very popular security auditing utility available for download.
    This particular utility is actually a set of shell scripts that test configuration
    and system files for security problems. Tiger installation files and instructions
    are available at http://net.tamu.edu/pub/security/TAMU/.


    Tiger uses a set of scripts that be run individually by accessing the /scripts
    directory and running the desired script. Although installation of Tiger will
    increase performance, it is not mandatory for its use.


    Tiger also includes a separate utility tigercron that automates the use of Tiger
    and allows users to specify which scripts will be running at varying frequencies.
    The scripts that can take hours to run should only be run a few times per month.
    Faster scripts can be set to run many times a day.


    Tiger is mainly a command-line utility, having basic support for HTML output has
    included. If HTML output is not used, Tiger will output its findings to a file
    in the Tiger directory called security.report.[hostname].[date]. hostname, date,
    and time are dependent upon when and where the tests are run.


    Another utility included with Tiger is tigexp, which displays an explanation of
    the warning message. It is used by:


    ```

    $ tigexp message

    ```


    Message id codes are listed in brackets at the beginning of the warning message.
    Altering the tigerrc file configures the Tiger utility. This file is located in
    the main Tiger directory. By default Tiger is configured to perform only the most
    important system tests; therefore users examine this file to make sure that all
    tests are being performed.


    The tigerrc configuration file is easy to read and to edit. Simply open tigerrc
    in a text editor to configure Tiger. Place a capital Y next to the scripts that
    users want to run and a capital N next to the scripts that should not be run.
    A line in the tigerrc file might look like this:


    ```

    Tiger_Check_PASSWORD=Y

    ```


    The Y indicates that this script will be run when the Tiger utility is initiated.
    tigerrc also includes other configurable items with a brief explanation of each.


    As stated previously, Tiger is a command-line utility that uses command-line switches
    to specify certain details about Tiger. Some common options include:


    +   -b This option specifies which directory Tiger will be installed.


    +   -c To specify a configuration file other than tigerrc, use this option.


    +   -e This option acts similar to the tigexp utility. When Tiger is run with
    this option, explanations will be displayed in the security report.


    +   -E This option is similar to the tigexp utility, except that it generates
    a separate explanation report.'
  merge: -1
  pgno: 160
