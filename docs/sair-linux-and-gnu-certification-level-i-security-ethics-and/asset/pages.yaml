    The fourth rule is significantly more complicated than the previous two. This
    rule sends a copy of all authentication messages, all mail messages, and all other
    messages with a priority of at least crit to the central logging server, log.lucasdigital.com.
    This is done by combining the two selectors, *. crit and auth,.* with a semicolon.
    Also, two facilities, mail and auth, were combined together into one selector
