  md: '# What Is Webmin?


    Webmin consists of a Web server and CGI scripts, all written in Perl. It uses
    these scripts to modify the system files using the Web interface. Webmin can be
    used in conjunction with SSL to make the connection secure from the Web browser
    to the server. Each service controlled by Webmin has a module that contains both
    the Web interface and the code to modify the configuration files. Almost every
    well-known service has a module that it is controlled by Webmin; if not, it is
    not too difficult to write one. Webmin comes with a standard set of 30 modules
    to control the most common services. This includes everything from system users
    and groups to Samba file sharing and the Webmin system itself. Webmin can significantly
    reduce the time it takes to manage a Linux machine.


    Figure 4.6 illustrates the default Webmin page.


    # Standard Modules


    The following is a list of some standard modules and a brief description of what
    each module can do (see the Webmin documentation for more specific instructions
    on using each module):


    +   - Webmin Actions Log: This module keeps detailed records of each action performed
    by Webmin users.

    - Postfix Configuration: Configures the Postfix mail server.

    - MySQL Database Server: Set up databases, tables, and permissions for the MySQL
