  md: '# Service Monitoring


    It is important for system administrators to be aware of which services are running,
    who is running the services, and what information is passing through them. Utilities
    such as netstat and nmap help users understand the presence and origin of services
    in use.


    # netstat


    netstat provides a very thorough, sometimes arcane, description of the state of
    a system''s network resources. The purpose of netstat is to provide a report of
    all network connections, which interfaces are being used, and the routing tables.


    # Options for netstat


    Although there are many options used with the netstat command, only a few of them
    are discussed in this section. To view the complete set of options and descriptions
    for netstat, please refer to the man page for netstat, section 8.

    Table 3.6 describes the more commonly used options for netstat.

    There are two main components of the netstat output: the Active Internet Connections
    (TCP, UCP, and raw) and the Active domain sockets. Each section has its own field,
    and is described in further detail following the excerpts from netstat outputs.


    | Table 3.6 netstat Options |

    | SWITCH | DESCRIPTION |

    | - | - |

    | -a | Print a report about all sockets, including those that are just listening
    |

    | -l | Print a report about only the listening sockets |

    | --tcp/ -t | Print a report concerning sockets that use TCP protocols |

    | --udp/ -u | Print a report concerning sockets that use UDP protocols |

    | --raw/ -w | Print a report concerning only sockets that use raw data protocols
    |

    | --programs/ -p | Print a report that contains the process ID and name of the
    program using the socket |

    | --interfaces/ -i | Print a report of the network interfaces |

    | --numeric/ -n | Print userIDs and IP addresses instead of the names of hosts/users
    |

    | --extend/ -e | Print a report that contains more than the usual information
    (such as userIDs) |'
