  md: '# syslogd Startup Options


    syslogd should be configured to allow logging from remote clients. This feature
    is turned off by default for security reasons. To turn on remote logging, the
    -r option is used when syslogd is started. The /etc/init.d/syslog script is used
    to invoke syslogd. This file should have the -r option added to the line that
    starts syslogd. Change the following from


    ```

    daemon syslogd -m 0

    ```


    to


    ```

    daemon syslogd -m 0 -r

    ```


    Save the file and exit.


    # Restricting Access to the Logging Server


    Since remote logging was enabled, the administrator must restrict access to the
    logging server only to authorized users. This is done to prevent Denial-of-Service
    (DoS) attacks against the logging server. The user must edit the /etc/hosts.allow
    file that lists the IP addresses or hostnames of the machines that are allowed
    to make connections. If the file has not been modified, there will likely be an
    ALL line allowing anyone to make a connection to the machine. This line should
    be removed and the hostnames, web.lucasdigital.com and mail.lucasdigital.com should
    be added on separate lines. For example:


    ```

    # hosts.allow This describes the names of the hosts

    # allowed to use the local

    # INET services.

    # Web.lucasdigital.com

    mail.lucasdigital.com

    #

    ```


    Save the file and exit.


    # Editing the syslogd Configuration File


    Finally, edit the /etc/syslog.conf file to log and save local and remote syslogd
    messages:


    ```

    # Save a copy of all the mail messages from the mail server.

    mail.* /var/log/mailserver/mailserver_log

    # Save a copy of all authentication messages. Both

    # local and from the mail server.

    auth.* /var/log/network/authentication.log

    ```'
