  md: '# 202 Chapter 6


    # Table 6.1 Files to Check for Basic System Integrity


    | BINARY | EXPLOIT(S) |

    |---|---|

    | /bin/login | Allows remote access when certain environment variables are passed
    by telnetd./bin/login buffer overflows in certain versions of Irix will grant
    root access. |

    | netstat | Can be used to mask network connections. |

    | ps | Can be used to mask processes. |

    | ifconfig | Can be used to mask enabling of promiscuous mode. |

    | ls | Can be modified to hide files or directories. |

    | /etc/hosts.equiv | Adding a + allows logins from any remote system; adding a
    # will allow logins from hostname #. |

    | .hosts | Adding ++ allows logins by anyone with no authentication; adding a
    # will allow logins from hostname #. |


    # Password Changes


    Passwords are the most important part of user authentication in Linux systems,
    and it is important to ensure that an intruder does not retain a password after
    cracking a system. Before putting a system back online, disable all user accounts
    and assign new passwords to users. This ensures that an intruder is not reenter
    using passwords obtained while cracking the system. Set password expirations so
    users must change their passwords often, and use a program like anpassword or
    nppasswd to check that passwords are not easily cracked. passwd+ is a program
    with a configuration file that will allow the administrator to secure the degree
    to which the program analyzes the security of a user''s password.


    To determine whether passwords are secure, try running a program like Crack, which
    is able to guess passwords through dictionaries and encryption. If Crack is able
    to guess passwords, there is a chance that a good cracker can do the same. Crack
    will provide the administrator with a list of users whose passwords are insecure;
    these users should then be advised to create a more secure password. See the section
    called Crack in Chapter 4, "System Utilities,\" of this book for more information."


    The easiest way to obtain passwords is by using an Ethernet sniffer to gather
    clear-text passwords. Using smart hubs to prevent sniffing can solve this. Also,
    use secure shell to connect with other machines. Since secure shell connects encryption
    over clear text to transmit data, they provide an extra level of security.


    # Unusual Account Contents


    After making sure there are no accounts on the system that does not exist, check
    all accounts for unusual contents, especially a suspected user. A cracker may
    use the files of accounts to further compromise a system. An intruder may plant
    .forward files into user accounts that will forward users'' e-mail elsewhere.
    This is not only an inconvenience when personal e-mail is sent, but also potentially
    devastating'
