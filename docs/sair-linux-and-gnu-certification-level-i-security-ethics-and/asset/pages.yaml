  md: '# Applications 175


    Due to the growth of e-commerce, the Web is constantly being used to transmit
    private information such as credit card numbers and social security numbers. When
    private information is being transmitted, it is essential that the Web server
    provide a secure connection by encrypting Internet traffic. mod_ssl, created in
    April 1998 by Ralf S. Engel, provides a convenient way to implement strong cryptography
    with Apache, mod_ssl is free to use for both commercial and noncommercial purposes,
    as long as the user retains the copyright notices and gives the author proper
    credit.


    # mod_ssl Installation


    To implement mod_ssl on an Apache server, Apache must be compiled with the mod_ssl
    module. mod_ssl requires a separate SSL library. OpenSSL will be used for this
    installation; it is free and distributed under a license similar to Apache and
    mod_ssl. OpenSSL can be obtained from http://ftp.openssl.org/source/ in either
    RPM or source format. The installation of OpenSSL via RPM is rather straightforward.
    To issue the following commands:


    ```

    # cd openssl-0.9.x

    # sh config no-idea -fPIC

    # make

    # make test

    ```


    The OpenSSL version number should be changed to match the version being installed.
    The RSA Reference implementation, RSAREF 2.0, must be compiled and installed to
    provide the encryption to be used by mod_ssl. The administrator should create
    a rsaref-2.0 directory. Although the location of this directory is arbitrary,
    the administrator must remember that RSAREF was installed in order to link it
    later. To compile, the following commands must be issued in the rsaref-2.0 directory:


    ```

    # cp -rp install/unix local

    # cd local

    # make

    # mv rsaref libsaref.a

    ```


    These commands build the RSAREF library.

    Next, the shared memory library, MM, must be installed. The current version of
    MM can be obtained from www.engelschall.com/sw/mm/. The administrator must extract
    mm-1.0.x to the depend directory of the mod_ssl subdirectory and issue the following
    commands:


    ```

    # cd mm-1.0.012

    # ./configure --disable-shared

    # make

    ```


    The administrator should also remember the path where the MM libraries were created.'
