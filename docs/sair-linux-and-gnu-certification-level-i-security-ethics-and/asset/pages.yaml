    # access.conf


    Host-based access control is available in Apache using the access.conf file. Access
    to certain directories, CGIs, and other services can be allowed or denied based
    on the configuration of this file.


    # Example access.conf


    The following is an example of what an access.conf file might look like:


    ```

    # access.conf: Global access configuration

    # The default rule is very strict:

    <Directory>

    Options None

    AllowOverride None

    </Directory>

    # Features must be explicitly allowed since the default

    # rule does not allow any options.

    # The following rule may need to be changed to reflect

    # whatever DocumentRoot is set to.

    <Directory /home/httpd/html>

    Options None

    AllowOverride None

    order allow, deny

    allow from all

    # #everyone is allowed to view the root html directory.

    </Directory>

    # The following rule may need to be changed to the location of

    ```'
