  md: '![](img/6942796f6e22033d0f94b498c190e5cc_294_0.png)


    # ipchains Part 2


    # Purpose


    This lab expands upon the use of the ipchains packet-filtering tool. At the end
    of this lab, you should be able to create and destroy a new chain, understand
    the relationships between the various chains, use the exclamation point (!) operator,
    save an ipchains configuration, and restore an older ipchains configuration. In
    addition, the concept of SYN bits is introduced in the context of ipchains.


    # Theory


    Simply put, ipchains is a series (chain) of commands used by the operating system
    to check incoming traffic. This is called packet filtering.


    All information that is sent through a network is broken down into packets. Packets
    consist of two parts: the body and the header. The body of the packet contains
    the data that is being sent. The header contains information about where the packet
    is coming from and where it is going. Packet-filtering tools such as ipchains
    determine whether the packet should be ACCEPTED, REJECTED, or DENIED based on
    the header’s information.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# # How Packets Are Filtered


    Kernels that support packet filtering have three types of built-in chains: input,
    forward, and output. All incoming packets are checked against the input chain.
    If accepted, the kernel decides where to send the packet. The packet is then checked
    against the output chain before it leaves. The forward chain is called if the
    packet is destined for another machine. Therefore, the chain order for a local
    process is -> output, and if the packet is for another machine, the chain order
    is input -> forward -> output. Each of the three chains shown in Figure XII.1
    (input, forward, and output) consists of a series of rules. Packet headers are
    systematically checked these rules until a match is found. The match indicates
    what the kernel should do with the packet.


    # # ipchains Commands


    The commands associated with the ipchains command can be divided into operations
    that manage whole chains and operations that manipulate rules inside a chain.


    OPERATIONS TO MANAGE WHOLE CHAINS


    +   -N Create a new chain.

    -X Delete an empty chain.

    -P Change a built-in chains policy.

    -L List all of the rules in a chain.

    -F Flush the rules out of a chain.

    -Z Zero the packet and byte counters on all the rules in a chain.


    OPERATIONS TO MANIPULATE RULES INSIDE A CHAIN


    +   -A Append a new rule.

    -I Insert a new rule at some position in a chain.

    -D Delete a rule at some position or delete first rule that matches.


    OTHER IPCHAINS OPTIONS


    +   -s Refers to the source address of the packet.

    -d Refers to the destination address of the packet.

    -i Name of an interface that ipchains should match.

    -y Used to block SYN packets.

    -j The jump command.

    -l Used to log counters that have matched a rule.


    # # Specifying New Chains


    A new chain can be specified to group a set of rules. In this example, the created
    chain is called TEST.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '![](img/6942796f6e22033d0f94b498c190e5cc_296_0.png)


    The command to make a new chain is:


    ```

    ipchains -N TEST

    ```


    Next, list the chains to confirm that the new chain was indeed created.


    ```

    ipchains -L

    ```


    The output will be similar to the following:


    ```

    Chain input (policy ACCEPT):

    Chain forward (policy ACCEPT):

    Chain output (policy ACCEPT):

    Chain TEST (0 references):

    ```


    There are now four chains: input, forward, output, and TEST. Chains can jump to
    this chain. Rules can be appended to this new chain, and rules in other chains
    can jump to this chain to check if the packet should be allowed. For instance,
    to add a rule TCP connections from a certain computer


    ```

    ipchains -A TEST -s 192.168.1.23 -p TCP -j DENY

    ```


    Then, place a rule in the input chain to check if the incoming packet is a TCP
    packet. If so, send the packet to the TEST chain to determine what should be done.


    ```

    ipchains -A input -p TCP -j TEST

    ```'
  merge: -1
