  md: '# Creating the Directory Structure and Copying Files


    When a client logs on to the anonymous FTP server, he or she will be limited to
    the directories and files inside the ftp user''s home directory. Use mkdir to
    create the directories /home/ftp, /home/ftp/bin, /home/ftp/etc, and /home/ftp/pub.
    Once these directories have been created, copy cp from /bin to /home/ftp/bin.
    Next, copy /etc/passwd and /etc/group from /home/ftp/etc pam authentication, then
    it does not need this procedure. The /bin directory will only hold ls password
    and group files. The /pub directory and all directories created underneath will
    hold files available for users to download.


    # Editing the ~ftp/etc/passwd and ~ftp/etc/group Files


    ~ftp/etc/passwd and ~ftp/etc/group files will be used only to provide names to
    displayed file ownership. For security reasons, these files must be modified to
    remove any useful information that an intruder could possibly obtain from the
    files. Remove all unnecessary user entries from /etc/passwd as well, leaving root,
    ftp, and any other users who own files on the FTP server. For each of the remaining
    users, it is important to replace the password entries with an asterisk (*) and
    replace the shell field with an invalid entry. Also clear the home directory file.
    An example of the modified password file is:


    ```

    root*:0:0:Super User:::/bin/false

    ftp*:200:200:FTP Admin::/bin/false

    ```


    Unnecessary groups should also be removed from /home/ftp/etc/group. The only remaining
    groups should be those to which the remaining users belong. The modified group
    file should look like:


    ```

    root::0:

    ftp::200:

    ```


    # Setting Directory and File Permissions


    One of the greatest security risks of an anonymous FTP server is the chance that
    the ftp user account has access to parts of the server that it should not. In
    order to prevent this, ownerships and permissions must be carefully set.


    All of the directories and files underneath /home/etc/ftp thus far, including
    /home/etc/ftp itself, must be owned by root and belong to the ftp group. This
    prevents anonymous users from gaining unauthorized access to modify files, allowing
    them to navigate freely through the FTP server directory structure.


    Permissions for /home/ftp and /home/ftp/pub should be set to 555 using the chmod
    command. This allows reading and executing of files, but no writing, /home/ftp/etc,
    /home/ftp/bin, and /home/ftp/bin/ls should have their permissions set to 111 to
    allow execute access, but no reading or writing. ~ftp/etc/passwd and ~ftp/etc/
    group files should be set to 444 to allow'
