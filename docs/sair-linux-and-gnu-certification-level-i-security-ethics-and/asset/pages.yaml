    are in all uppercase, while command options are in lowercase. This is different
    from commands in ipfwadm. A nearly complete reference table of the differences
    between the two can be found in the ipchains HOWTO file.


    # How to Use ipchains


    Although ipchains is not simple, it is well documented. This section attempts
