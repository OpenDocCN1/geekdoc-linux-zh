    site over the upstream connection are reduced, upstream bandwidth is saved.

    2. If access is not limited, anyone on the Internet can connect to the caching
    server and steal network bandwidth.

    3. The HTTP Proxy and HTTP Port options should be changed.


    # Advanced Questions


    +   1. What problems might arise if a Squid server’s security is compromised?'
