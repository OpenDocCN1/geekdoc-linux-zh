    # syslog


    syslog is used for collecting and storing the logging messages of local or network
    kernels and applications. The program syslog, written by Eric Allman of U. C.
    Berkeley, was designed to give system administrators control of all logging facilities
    on a machine with one centralized program.


    # Components of syslog


    There are two components of syslog: the daemon, syslogd, and the configuration
    file syslog.conf. syslogd is usually found in the /sbin directory, and syslog.conf
    is usually found in the /etc directory. syslogd is usually started at boot time
    by the rc scripts. Table 2.2 shows some of the options that can be used when starting
    syslogd.


    # Controlling syslog


    syslog is controlled by the configuration file /etc/syslog.conf. syslog.conf is
    a text file that consists of rules for logging with one rule per line. This configuration
    file is read only when syslog is activated. If changes have been made to syslog,
    then syslogd must be restarted to load the new configuration file. Comments are
    preceded with the pound character (#). Every rule consists of two fields, the
    selector field and the action field. The rules are in the following format:


    ```

    selector <tab action

    ```


    The selector contains two parts, the facility and the priority, separated by a
    period. Multiple selectors can be combined with a semicolon, and multiple facilities
    can be combined with a comma,'
  merge: -1
