    the passwords and the file would be useless unless he or she has Crack.


    Crack uses a backward way of cracking passwords. Instead of attempting to decrypt
    passwords, Crack encrypts a large list of passwords and compares them with the
    already encrypted passwords. If two encrypted passwords match, Crack has uncovered
    a user''s password. Although this process can be time consuming, often it takes
    only minutes before Crack uncovers a user''s password. Typically, this is because
    users choose default or weak passwords. It is important to remember as processor
    speeds increase, so the speed at which Crack will operate.


    Crack encrypts lists of words called dictionaries. Crack will also modify words
    by adding numbers or reversing the letter order of a word. The way Crack modifies
    a word depends on the rules set for the program.

    Many types of dictionaries are used, but are not limited to, any non-English-language
    list, specific field dictionaries (such as medical, engineering, and law), and
    random dictionaries (such as literary characters, common sayings, or quotes).
    Crack also comes packaged with a list of commonly used passwords. With the variety
    of options, it usually does not take long before Crack uncovers passwords.


