    # Server Setup and Configuration


    Setting up an anonymous FTP server requires editing the /etc/passwd and /etc/group
    files to include both a user and a group called ftp, and then creating a directory
    structure for the server based on ftp''s home directory. All clients will be logged
    in using the ftp account with access restricted to specified files and directories.


    # Editing the /etc/passwd and /etc/group Files


    In order for anonymous FTP to work, there must exist a user named ftp in the /etc/passwd
    file. Linux distributions already include the ftp user, but will not be set up
    for anonymous FTP. In order to activate anonymous FTP, the password entry for
    the ftp user should be locked by replacing the entry with an asterisk (*), and
    the login shell entry should be invalid. Ensure that the uid and gid numbers are
    unique, and that a home directory has been specified. The finished entry should
    look like the following line:


    ```

    ftp*:200:200:Anonymous FTP:/home/ftp:/bin/false

    ```


    A new group entry should also be inserted into /etc/group. The name of the group
    is unimportant as long as it matches the gid of the ftp user. See the following:


    ```

    ftp::200:

    ```'
