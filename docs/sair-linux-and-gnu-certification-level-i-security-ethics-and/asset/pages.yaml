  md: '# xlock


    xlock, or the newer Xlock, makes a lasting change on the Server and requires password
    verification to unlock the screen. While xlock is running, new connections are
    rejected and the screensaver is suspended. Requests via the mouse and keyboard
    initiate a password prompt.


    # Synopsis


    The switches and commands listed next have been compiled from the xlock man pages.
    To view the complete pages, enter xlock at the command line.


    ```

    xlock [--help] [-version] [-resources] [-display displayname] [--visual visual]

    [-name resourcename] [-mode modername] [-delay uses] [-batchcount] [-count num]

    [-cycles num] [-colors num] [-size num] [-saturation value] [-erasedlay modern]

    [-eraselays uds] [-allowance] [-xlock modername] [-nolock] [/ininvind]

    [-incoot] [-remote] [-mono] [-allroot] [-debug] [/description]

    [-echokays] [-enablesaver] [-resetaver] [-grabhmouse] [-grabaserver]

    [-install] [-mouselotion] [-sound] [-timelapsed] [-usefirst]

    [-verbose] [-nice level] [-lockdays seconds] [-timeout seconds] [-font fontname]

    [-plantfont font] [-bg color] [-fg color] [-background color]

    [-foreground color] [-username string] [-password string] [-info string]

    [-validate string] [-invalid string] [-geometry geom] [-iconogeometry geom]

    [-glcgetgeometry] [-wireframe] [-used3] [-delta3 value] [none3dcolor]

    [-right3 color] [-left3 color] [-both3 color] [-program programme]

    [-messagesfile formatted-filename] [-messagefile file-name] [-message string]

    [-messagefont fontname] [bitmap filename] [-cpawssd created-password]

    [-forcelock minutes] [-loginButton text]

    [-logoutButton path] [-lock-sound string] [-infosound string] [-validsound string]

    [-modulepath path]

    [-insound string] [-startcmd string] [-endcmd string] [-logoutCmd string]

    ```


    # Useful Switches and Commands


    Table 3.1 outlines the usage of several common switches and commands. All of the
    arguments listed in the synopsis may be entered at a command line during a Windows
    session, and will remain applicable until session is closed. To save preferences,
    the user must create an alias or write a script to set command and switch options;
    it is only necessary to include the preferences that the user wishes to change
    from the default settings.


    # Example


    To create an alias for xlock, use a text editor and configure the .bashrc file.
    If the editor Pico is used, it is important to limit the alias to one line, unlike
    the next example. The following is an example of possible configuration created
    with Vi:


    ```

    alias xlock=''xlock -mouselotion -timelapsed -info "the magic world?" -validate

    ''...'' -invalid um, the other magic word...''

    ```'
