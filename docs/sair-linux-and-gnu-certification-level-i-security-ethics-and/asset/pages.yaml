    # Logcheck


    Logcheck is a useful utility for detecting potential security breaches by scanning
    log files to determine whether activities have occurred that would warrant investigation.
    Logcheck then emails a report of such actions to the system administrator. Making
    use of the logtail utility, Log searches log files for strings that deserve the
    attention of a system administrator. For example, in the case that a user attempts
    to gain superuser access by repeatedly entering invalid passwords, a log entry
    would reflect failed attempts at superuser login. Such an entry would cause Logcheck
    to send an e-mail with a report of the failed attempt to the system administrator.
    If run in the background as a cron job, Logcheck will save a system administrator
    from the potentially tedious task of manually reviewing a large number of log
    files for problems.


    Logcheck requires some configuration. This includes many changes to the logcheck.sh
    file indicating the system administrator''s e-mail address and specifying which
    log files should be checked. The most difficult part of configuration is specifying
    what information to look for in log files. Since log files for different events
    vary from one distribution of Linux to another, Logcheck may not detect an error
    unless the system administrator specifies it. For example, if Logcheck searches
    for the string LOGIN FAILURE, it would not alert a system administrator of a problem
    if the distribution of Linux is being used with failed login attempts as AUTHICATION
    FAILURE. For this reason, it may be necessary for a system administrator to examine
    his or her log files before configuring Logcheck to determine which specific entries
    or which particular reports deserve. Four files are used by Logcheck to determine
    what entries deserve attention: logcheck.hacking, logcheck.violations, logcheck.violations.ignore,
    and logcheck.ignore. These files are configured in this order, and contain specific
    search criteria. logcheck.hacking contains strings that would suggest attacks
    gaining access to a system. Active System Attack Alerts are listed in the Logcheck
    report. The logcheck contains strings resulting from potentially malicious activity
    on a system. These breaches would be listed under Security Violations in the report.
    logcheck.violations.ignore file filters operations that would innately return
    strings that were already detailed in the logcheck.file. The fourth file, logcheck.ignore,
    contains all log entries that should be ignored. Any log entries not matching
    entries in logcheck.hacking, logcheck.violations, and logcheck.ignore will be
    listed under Unusual System Events in the Logcheck report. One can obtain Logcheck
    at www.psionic.com/abacus/logcheck.'
