  md: '# Shells and Commands 97


    where minutes is the length of idle time in minutes. In order to prevent a user
    from losing unsaved work in applications, the C shell will only log a user out
    if inactivity occurs at the command prompt. Although a user would ideally log
    out whenever he she left a terminal, one should at least remember to save work
    and exit any running applications.


    # mesg


    From an idealistic security standpoint, it is never safe for an exchange to take
    place between users, either on the same system or at remote sites. Great steps
    have been taken to develop filters and programs that will authenticate and verify
    the security of e-mails. There are few steps that can be taken, however, against
    programs as talk and write. There are small programs that allow users to chat
    with one another at the command prompt. Though seemingly safe, both allow for
    crackers to feed damaging information to another user''s terminal. For example,
    the write program contains a security hole that allows crackers to execute programs
    on another user''s terminal under the proper circumstances. There are also programs
    that allow commands to be executed on another user''s terminal via the talk command.
    Since both of these programs will send output to another user''s terminal without
    the consent of the other, it is possible for a cracker to send information to
    that user without his or knowledge or in such a way that he she cannot stop the
    attack.


    In order to control access to a terminal via message programs, users may use the
    mesg command to allow or disallow messages. Available arguments are y and n, to
    allow or disallow messages, respectively. For example, if a user were to type
    the


    ```

    $ mesg n

    ```


    then messages would be turned off and other users would not be able to send messages
    to the first user''s terminal. Likewise, the following:


    ```

    $ mesg y

    ```


    would turn messages on.


    Either of these commands may be inserted into a line of the .cshrc file to automatically
    have messages turned on or off at login.


    # Monitoring Log Files


    A log file records and lists the different types of actions that have occurred
    within some context. In the context of computer security, monitoring the recorded
    information in a system''s log files can be important when that system is experiencing
    such things as hardware failures, misconfiguration, or intrusions. To aid in the
    process of monitoring log files, it is also useful that the system log files are
    rotated, reset, and backed up to keep those files from unnecessarily using disk
    space. There are some helpful utilities offered with Linux to manage these tasks.'
