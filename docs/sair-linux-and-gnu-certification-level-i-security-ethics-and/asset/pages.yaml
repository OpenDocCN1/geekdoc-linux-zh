    files do not exist, the server will simply report ID numbers for ownership and
    group membership instead of names.


    # GnuPG


    PGP has long been a dominant program for encryption/authentication software. However,
    the OpenPGP standard has begun to allow other applications to provide secure public-key
    software.


    # What Is GnuPG?


    Gnu Privacy Guard (GnuPG or GPG) is an application that uses a public-key encryption
    scheme for encrypting and/decrypting, as well as authenticating files that are
    transferred across a network. The public-key scheme functions in the following
    way: A user has two keys, one private and one public. The public key can be used
    by anyone who has access to encrypt data that is intended for the owner of the
    keys. The private key is held and known only by the owner, who his or her private
    key to decrypt data that was encrypted with the public key.


    This allows users to send information across the Internet signed with a public
    key, and only the owner of the key will be able to read the data. The public key
    cannot decrypt data signed with a public or private key, ensuring that only the
    holder of the private key will be able to read any encrypted data.


    # Installation of GnuPG


    GPG can be obtained from the official GPG Web site, www.gnupg.org. This site gives
    details on how to install GPG, files to download, and provides brief-how-to FAQs
    concerning the installation process.


    After GPG is downloaded and installed on a system, users may then begin to create
    their private/public key pairs. After making a ~/.gnupg directory, run gpg --gen-key.
    An example key generation sequence is shown in Figure 5.7.'
