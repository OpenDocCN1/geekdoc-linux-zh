- img_proc: true
  md: '# Chapter 2


    Some examples of valid ways to combine and format selectors:


    ```

    facility.priority action

    facility1.priority1;facility2.priority2 action

    facility1,facility2.priority action

    *.priority action

    ```


    A rule in the syslog.conf file might look like this:


    ```

    auth,kern.err /var/log/errorlog

    ```


    In this example, the facilities are auth and kern. The facility actually generates
    the log. err is the priority or the importance of the message. /var/log/errorlog
    is the action. In this case, the action tells syslogd to save the log messages
    to the local file /var/log/errorlog.


    # Facilities


    Facilities are different programs that send messages to syslogd to be logged.
    There are facilities for specific uses, such as kern for the kernel, and facilities
    that may include several programs, such as auth. If a program is not covered under
    a specific facility, it falls under the generic facility user. Table 2.3 lists
    the most relevant facilities along with a brief description of each.


    # Priority Levels


    Priority defines the severity of the message to be logged. They range from debugging
    messages (debug) to emergency messages (emerg). Table 2.4 shows the different
    priority levels along with a description of each.'
