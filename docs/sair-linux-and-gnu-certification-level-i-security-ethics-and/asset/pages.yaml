  md: '# Securing NFS Exports


    # Purpose


    After completing this lab, the user should be able to configure an NFS server
    to securely export file file systems. In addition, the user should have a good
    understanding of the export options and valid client specifications that can be
    used in the NFS exports file, /etc/exports.


    # Theory


    The user will configure an NFS server to export three different file systems.
    The file systems will be exported with different options and client specifications.


    The first file system to be exported, /notes, will be exported to all the clients
    in the lucasdigital.com domain read-only mode.


    The second file system, /workinprogress, will be exported to the machine designer.lucasdigital.com
    in read/write mode.


    The third file system, /projects, will allow exporting to three clients: foo,
    fee, and tele.lucasdigital.com in read-only mode. However, the directory /projects/secret
    will not be exported.


    By using root squashing, all three exports will map UID 0 to the UID of the nobody
    account, which has the privileges of a regular user. Root squashing is performed
    if a user has root privileges on an NFS client, but the user does not have root
    privileges on'
  merge: -1
  pgno: 350
- img_proc: true
  md: 'mounted NFS file system. If root squashashing were disabled, the administrator
    would have to be certain that no user has root access on any of the NFS clients.
    Otherwise, a remote root could read or delete files to which he or she is not
    supposed to have access. It is virtually impossible to be certain about the integrity
    of every machine on a network; therefore, it is not recommended to disable root
    squashashing.


    Root squashashing treats root accounts as if they were coming from the placeholder
    account, nobody. Since root squashashing is preformed by default and the nobody
    account is created when Linux is installed, root squashashing will be performed
    automatically on all the exported file systems.


    # Exercises


    To configure the NFSserver to allow exporting, the user must edit the /etc/exports
    Three rules will be added to the file, with one rule per line. Each rule will
    govern one of the exported file systems. In addition, a fourth rule is needed
    to explicitly state that /projects/secret/ will not be exported. Since root squashashing
    is performed by default, the /root_squash option does not have to be used with
    the rules.


    The first rule will govern the file system /notes:


    ```

    /notes*.lucasdigital.com(ro)

    ```


    Here, the export option (ro) is used to export the directory in read-only mode.
    Also, the asterisk wildcard (*) is used to specify all addresses in the lucasdigital.com
    domain. The next rule will govern the file system /workinprogress:


    ```

    /workinprogress designer.lucasdigital.com(rw)

    ```


    Here, the export option (rw) is used to export the directory in read/write mode
    to the machine designer.lucasdigital.com. The third rule will govern the file
    system /projects:


    ```

    /projects foo(ro) fie(ro).lucasdigital.com(ro)

    ```


    Here the file system /projects is exported to three different clients in read-only
    mode. The clients'' names are separated by spaces. Since the /projects/secret/
    directory should not be exported, an additional rule is needed:


    ```

    /projects/secret (noaccess)

    ```


    To deny access to a certain directory, the (noaccess) option is used. Therefore,
    the /etc/exports file will be similar to the following:


    ```

    # /etc/exports for NFS Server

    #

    # Everyone in the lucasdigital.com domain is allowed to mount

    # /notes in read only mode.

    /notes*.lucasdigital.com(ro)

    ```'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# The designer''s machine can mount the /workinprogress

