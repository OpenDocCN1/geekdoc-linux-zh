    # Anonymous Anonymous FTP


    The anonymous FTP server is still one of the most widely used services on the
    Internet. Anonymous FTP allows unauthenticated users to access specified portions
    of the server''s file system. Many companies, universities, and government agencies
    use anonymous FTP to distribute documents, demo versions of software, and updates
    to existing software. On a Linux system, anonymous FTP servers are relatively
    simple to set up and configure; this has contributed to the proliferation of anonymous
    FTP servers on the Internet.


    Setup of an anonymous FTP server consists of two parts: configuring the server
    daemon to run, and setting up the file system that anonymous users will access.
    Although security risks arise when any access is granted to outside users, an
    anonymous FTP server can be relatively secure so long as caution is exercised
    during setup.


    ![](img/6942796f6e22033d0f94b498c190e5cc_186_1.png)


