  md: '# Chapter 1


    The most striking example of the extent to which a worm can damage an entire network
    occurred when the Internet was still in its infancy. In November 1988, Robert
    Morris, a Cornell University student, released a program that used the Sendmail
    program to self-replicate. The program quickly propagated throughout all available
    networks multiple times, clogging many computer systems. This program eventually
    spread throughout all computers that were networked at the time, including government,
    military, and academic systems. The damage costs of the worm ranged from hundreds
    of dollars to thousands of dollars for each site that was hit by the worm.


    Worms are difficult to create, once written, they can easily damage any computer
    system. The best way to control a worm that has entered a system is to cut off
    network connections, which will keep any data from escaping the local network
    and prevent the worm from reentering the network. Once the worm has been located
    and disabled, system restoration may begin.


    # Back Doors


    Many programmers will code back doors into programs, for debugging purposes or
    to access the program without having to go through tedious authentication scripts.
    While this is a legitimate use for back doors, these security holes in a program
    can be used for harmful purposes if they are found and take advantage of someones
    with malicious intent.


    Back door allows access to root permissions, allowing the user of the program
    to perform tasks as root. If a back door modifies the permissions on the /etc/passwd
    and /etc/shadow files, then an intruder can access those files to crack the passwords
    for the system and obtain access as root.


    The best way to protect against program vulnerabilities is to keep a check on
    all important system and security files, and check all new software installed
    on the system. A good policy is to install all new software on a test system before
    installing on a real system. This will allow administrators to test for security
    holes within the new program.


    # Logic Bombs


    A logic bomb is a program that will execute a specified task when a certain requirement
    is met. This requirement can be a date, time, or when a certain user is logged
    in or out of a system.


    In one instance, the program would damage a system if an employee''s user ID was
    absent from the payroll for a specified length of time. Thus, if the employee
    was fired from the company, the program would damage the company system.


    As with any other type of malicious software, protection against logic bombs is
    achieved by installing software on a practice system to allow for the testing
    of the program and an examination of the source code.


    # Hardware Vulnerabilities


    In addition to software vulnerabilities, there is also the threat of physical
    damage to a system.'
