  md: '# Network Policies


    Network policy outlines the proper use of system assets and resources for all
    users in an organization. It details the specific security concerns that the organization
    faces, and the steps that must be taken to provide that security. Most importantly,
    it allocates security responsibilities and authority, and sets guidelines for
    infraction penalties.


    # Why Is a Policy Needed?


    User education is one of the greatest measures that may be taken in the interest
    of security. A network policy informs users on the appropriate use of the system,
    outlining the organization''s guidelines for common processes such as file access
    rights and password selection.


    If a problem arises, the policy provides a standard for the appropriate course
    of action. It may provide an organization with liability protection if illegal
    activities are performed on a site without that''s knowledge. It also provides
    system administrators with the responsibility and authority to address infractions.
    With such a policy, problems may be dealt with quickly and efficiently.


    # Policy Development


    In the development of a network standard, it is important to create a general
    policy that may be enforced strictly. Every organization will have different security
    concerns and user guidelines. It is important to develop the network policy with
    these specific needs in mind.


    # Security


    Networks provide numerous assets, some tangible and some intangible. Examining
    the physical components that comprise the network, such as hardware, key personnel,
    or backup data and archives, may help to assess the value of an organization''s
    tangible network assets. The intangible components may be assessed by examining
    the use of the system in that organization''s work processes, such as interoffice
    communication, work assignment, or customer service. The value of that network
    may be loosely measured by assessing the value of the system''s contribution to
    the final product of the organization.


    The next step in planning a policy is to determine the specific threats to those
    assets, and the measures to prevent those threats. It is important that protecting
    a system does not exceed the potential loss. An organization frightened by stories
    of fraud or theft could potentially spend more time, energy, and money on security
    than the protected assets are worth.


    A security policy will help prevent the loss or compromise of assets, but will
    also provide a standard for the event that complications arise. Security measures
    should include guidelines for system administrators, such as program installation,
    backups, and physical security.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Base Systems 35


    The network policy has the potential to affect every user on the system. When
    creating the policy, it is necessary to consider the dual importance of productivity
    and security. Productivity should not be sacrificed in the name of safety, unless
    the potential loss would be too great a risk. If users are given too many rules,
    or rules that are too limiting, may simply ignore them. The appropriate policy
    should ensure that resources are properly allocated, and user privacy rights are
    protected.


    The policy should determine the penalties for not complying with network guidelines.
    When determining penalties, be sure to have a lawyer review the completed policy
    to ensure it does not break any laws or violate any user rights.


    # Appropriate Use


    The policy should state the authorization required for specific system resources.
    It should include the guidelines followed in the account creation/termination
    process, as well as the permissions allocated to each user class. The policy should
    name the user who has the ability to assign access rights, and what kind of rights
    he or she is allowed to assign.


    Users should be informed as to how much privacy they have and how much protection
    their data have. The policy should discuss which types of files can be downloaded
    and stored on the server. Users should be informed as to the level of security
    on the system on which they store their files, and be advised against storing
    confidential data in an easily accessible place. The policy should give more detail
    on general computing matters such as e-mail and password privacy.


    # The Shadow Suite


    In the early days of Unix and Linux, shadows were stored and encrypted in the
    /etc/passwd file. This presented a security problem because the /etc/passwd file
    was readable by anyone with access to the system. Thus, passwords could be downloaded
    and cracked with relative ease. Shadowing presents an alternative to this security
    problem.


    Shadowing stores the encrypted passwords in a second file, the /etc/shadow file,
    which is separate from the /etc/passwd file. This file is only readable by certain
    programs and the root user, so fewer chances exist for the passwords to be obtained
    illicitly.


    # Installing and Setting up Shadowing Programs


    A number of programs are available that allow an administrator to set up and configure
    the shadowing of passwords, such as the Cyberlot Password Manager, kmuser, and
    gUserMan. This discussion will use the Linux Password Shadow Suite to explain
    password shadowing. The Linux Password Shadow Suite (or just “shadow”) is the
    standard for Linux shadowing. An understanding of this program will help the user
    to better understand the concept of shadowing, and how to use shadowing to the
    advantage of a system’s security.


    ![](img/6942796f6e22033d0f94b498c190e5cc_56_0.png)'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Obtaining and Installing the Shadow Suite


    Many distributions now come with shadow installed and configured, but if the installation
    of a system does not involve setting shadow (or the distribution did not come
    with the Shadow Suite), then it must be obtained from the Internet. A good place
    to look for the Shadow Suite is ftp://il7linuxb.ist.pwr.wroc.pl/pub/linux/shadow/,
    and download the file named shadow-current.tar.gz. The shadow suite is maintained
    at that site, with the most current and stable version placed in that place.


    An RPM of the Shadow Suite can be found at http://rpmfind.net/linux/RPM/shadowutils.html.
    This page lists many different utility packages and programs, in RPM format, for
    different Linux distributions and processors.


    Installing the Shadow Suite is performed in the same way as any programs, either
    with the make utility (if the source code was obtained) or by using rpm if the
    RPM file is being used.


    # Testing to See if Shadowing Is Enabled


    To see if the passwords are now shadowed, look in the /etc/passwd file. If there
    is an x*, or some other type of wildcard character instead of an encrypted password,
    shadowing is probably enabled. Open the /etc/shadow file (as root) and see if
    there are encrypted passwords in the second field for each line. If so, then shadowing
    has been installed correctly and is working.


    # Configuration of the Shadow Suite


    Now that the Shadow Suite is installed and shadowing is enabled, a system administrator
    can begin to configure shadowing on a system.


    # Understanding the /etc/shadow File


    Because the main file used in shadowing is the /etc/shadow file, a thorough explanation
    of that file is necessary. Each line (or entry) in the file uses a format of certain
    fields separated by columns. An example line from a /etc/shadow file follows:


    ```

    user:*:H7e9aJL:10063:0:30:7::1:

    ```


    Different fields are explained in Table 2.1. The last field is reserved for future
    use, in the event that more features are added.


    Certain information is available in the /etc/shadow file that is not in the /etc/passwd
    file. The /etc/passwd file contains the following information: username, password
    (or a wildcard if the system is shadowed), userID, groupID, GECOS information,
    home directory, and the default shell. GECOS information is such as the full name
    of the user and telephone numbers. This field can be left blank to prevent security
    risks.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Table 2.1 Field Names with Examples and Descriptions


    | FIELD NAME | EXAMPLE | DESCRIPTION |

    | --- | --- | --- |

    | User Name | User | The user''s login name |

    | Password | H7c9JL | The encrypted password (a * indicates a disabled account)
    |

    | Days since 1/1/1970 that the password was changed | 10063 | The number of days
    since 1/1/1970 that the password was changed |

    | May Be Changed | 0 | The number of days before a password can be changed (a
    0 indicates that the password can be changed at any time) |

    | Must Be Changed | 30 | The number of days until the password must be changed
    |

    | Warning Days | 7 | The number of days that a user can be warned before the password
    expires |

    | Disable Days | 1 | The number of days after an expired password until the account
    is disabled |

    | Disabled Since 1/1/1970 | | The number of days since 1970 that an account has
    been disabled (a blank indicates an active password) |


    # Using the Shadow Suite Utilities


    The files that can be downloaded following the instructions at the beginning of
    this section provide certain utilities that can be used to configure the shadowing
    of a system''s passwords. Discussed here are the useradd, passwd, usermod, and
    userdel commands.


    # useradd


    The useradd command can be used to add users to a system. This command can also
    be used to configure the defaults for the system when new users are added. For
    instance, typing useradd -D will show the defaults for a user''s group, home directory,
    expiration time (in days), and shell. To change the configuration file (/etc/default/useradd)
    to other defaults, use these options:


    +   -g The default groupID.

    -d Home directory.

    -e Number of days after account creation that the password will expire.

    -f Whether to disable an account if a password is expired (1 or 0).

    -s Specifying the default shell.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'In this example, the defaults will be changed to a groupID of 200, a 15-day
    expiration period, no disabling of the account after a password expires, and a
    default shell of /bin/csh:


    ```

    $$ useradd -D -g200 -s/bin/csh -f0 -e15

    ```


    # # passwd


    The passwd command is used primarily to change a user''s password, but can also
    be used to configure password-specific options, such as the following:


    +   -l Lock a user''s account.

    -u Unlock a user''s account.

    -x Set the number of days before a password expires.

    -n Set the minimum number of days before a password can be changed.

    -w Set the number of days before password expiration that warnings are sent to
    user.

    -i Set the days after a password expires that the account is locked.

    -s Display password information in a concise format.


    Thus, to configure the password for user myuser to expire in 10 days, use this
    syntax:


    ```

    $$ passwd -x10 myuser

    ```


    # # usermod


    The usermod command follows the same syntax and options as the useradd command.


    # # userdel


    This command can be used to remove a user and his her account(s). Using the -r
    switch will delete the user''s home directory and all the information in the /etc/passwd
    and /etc/shadow files.


    # # The /etc/login.defs File


    The /etc/login.defs file contains configurations for the /etc/login program, as
    well as configurations for the Shadow suite program. Defaults for regard to password
    length, maximum days before a password must be changed, and the minimum number
    of days between changes of a password are located there. UserID and GroupID minimum
    and maximum values are also specified in the /etc/login.defs file. This file can
    be edited with any text editor to configure a system''s password and account defaults.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Security Problems with the Shadow Suite


    There have been security problems with the Shadow Suite. An example of problematic
    security involved version 3.3.1. This version provided a /etc/login program that
    would not check the length of login names. If the provided login name was too
    large, a buffer overflow could occur, possibly crashing the system. Another problem
    surfaced through the possibility of gaining root access through this bug, and
    through the libraries used to code the Shadow Suite.


    A second bug that has been discovered allows for a core to be dumped by killing
    the /bin/login program while it is in process. Other bugs have been found for
    certain versions of the Shadow Suite; therefore, it is important to download,
    install, and update to the newest versions of the Shadow Suite often.


    # Pluggable Authentication Modules


    In the past, authentication in a Linux system was handled in a manner specific
    to each program package. For example, verifying the identity of a user at the
    time of login was done by checking the password given against the encrypted password
    in the /etc/passwd file, or the /etc/shadow file if the use of shadow passwords
    has been enabled. Other services that need authentication, as xscreensaver, su,
    pppd, and xdm, require a mechanism for user authentication. One might imagine,
    it was difficult to modify the level of security and fine-tune the level of authentication
    used by these services without recompiling the individual programs; often a risky
    measure Because of this, a system of libraries was developed to allow the authentication
    settings of programs to be modified as the service is running, without the need
    to compile each individual program. This system, which comes bundled with most
    current Linux distributions, is referred to as Pluggable Authentication Modules
    (PAM).


    # What Is PAM?


    Strictly, PAM provides a degree of separation between the software programs and
    the authentication method. With the passage of time, previously secure authentication
    techniques became more open to attack. To counteract this, PAM allows the administrator
    to set the level of security that each service requires for authentication. Levels
    range from a simple pass-through without authentication (using pam_permit) to
    something as sophisticated as a retinal scan or voice print. Most services that
    require authentication have been made PAM aware.


    # Configuration


    The PAM suite can be configured in two ways. It can be set to refer to one main
