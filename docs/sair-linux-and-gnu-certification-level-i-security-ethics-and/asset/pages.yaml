  md: '# System Vulnerabilities


    A Linux system that is connected to the Internet, or even a simple local network,
    will inevitably be subject to an attack of some sort.


    There are two major areas of vulnerability that a computer system must contend
    with: Attacks from a piece of software that was placed on the computer, or physical
    harm that comes from computer parts being stolen and/or damaged. Whether it is
    a software hardware vulnerability, there is always the possibility of damage to
    the system.


    # Software Vulnerabilities


    There are quite a few types of software that can harm a computer system. Unix/Linux
    systems are more susceptible to network damage from programs such as Trojan Horses
    and worms than from other kinds of software. Malicious software usually falls
    into one of the following categories:


    +   - Trojan Horses

    - Worms

    - Back doors

    - Logic bombs


    # Trojan Horses


    A Trojan program has two functions: one legitimate, and one hidden and illegitimate.
    These programs will appear to be performing a normal task, such as running a game
    or word processor, while at the same time performing its hidden function, which
    is usually damaging to the system. Trojans have code written into the source code
    of the program used to perform the malicious functions.


    These programs are quite common. One example of a Trojan Horse was a supposed
    upgrade to the util-linux software suite. This software contains many utilities
    that are useful to systems running Linux. In January of 1999, a release of the
    program, util-linux-29.tar.gz, contained code that modified the /bin/login command
    to send an e-mail to the address of a specified user. This e-mail would include
    the host name of the system as well as a list of users logged in. The code would
    execute whenever a user was logged in and would cause anyone with access to a
    prompt on the system to execute harmful commands to the system.


    The best way to secure a system from a Trojan Horse is to study the source code
    of all programs that will be installed on a system. It is then possible to prevent
    surprises when the program is executed.


    # Worms


    A worm is a program that distributes itself along a network. While it usually
    does not directly damage a system, it will largely consume network and processor
    resources, potentially rendering a system useless.'
  merge: -1
