  md: '# Theory of Operation 23


    When a user has physical access to a server, a simple reboot can sometimes compromise
    security. Keeping server rooms locked and secure, preventing unprotected access
    to network ports, and securing all computer components and/or physically bolted
    down lowers the chances of hardware damage or theft.


    Legitimate system users can be sources of exploitation of system weaknesses. Unauthorized
    users can gain knowledge of keys to secure rooms are kept, which systems are less
    secure than others, and to subtly damage computers in a place of operation. Ironically,
    a person hired to protect the system is also a user who could create the most
    damage to a computer network. One way to avoid such problems is the regular and
    thorough review of system logs, and more importantly, the review of employees''
    previous employment history for security breaches.


    With proper security precautions, such as review of programs, system logs, employee
    backgrounds, and the physical security of the place of operation, system vulnerabilities
    can be easily minimized.


    # Network Vulnerabilities


    Security vulnerabilities of the protocols running the Internet have become an
    important issue in the last few years. The TCP/IP protocols were designed when
    the Internet was a small network comprised mostly of researchers. Since these
    users generally trusted each other, security was not an important issue. Lack
    of built-in security in the TCP/IP protocols has become more and more problematic
    as the use of the Internet increases.


    The next version of the IP protocol, IPv6, will attempt to address many of the
    current security problems. Since widespread use of IPv6 is not expected for several
    years, it is essential for network administrators to understand the types of attacks
    that can occur on the Internet and to prevent them.


    # Denial-of-Service Attacks


    Recently, some of the most popular Web sites on the Internet have been brought
    down for hours at a time by denial-of-service (DoS) attacks. Unfortunately, it
    has taken massive attacks to emphasize the importance of appropriate network security
    measures.


    Just as too many cars can cause gridlock on a highway, DoS attacks flood a network
    or a single host with too much Internet traffic. There are several different types
    of DoS attacks, which result in the same ending when successful. However, network
    administrators should know the differences of each attack so the appropriate safety
    measures can be.


    # SYN Packet Flooding


    SYN packet floods, or SYN floods, are a common DoS attack used to render a certain
    TCP service or host inoper. Taking advantage of the new way TCP connections are
    made, these attacks flood a host with new service requests to the point where
    legitimate client requests cannot go through. Commonly, these attacks are carried
    out on'
