  md: '# Router Packet Filters


    Router packet filters function by parsing the headers of a packet and applying
    rules to determine whether to allow (route) or drop the packet. System administrators
    can also specify rules based on the outbound interface requested by the packet.
    Being able to specify rules on both inbound and outbound interfaces allows the
    administrator control where the router appears in the overall filtering scheme.


    Consider the following scenario: A system administrator wants to allow traffic
    to company A''s network (212.220.0/16) from the network of company B (190.15.65./24),
    which was just acquired by company A. However, he does not want to allow the rest
    of the Internet access to company A''s network. Table 1.1 shows filtering rules
    for this situation.


    When a packet reaches the router, it will be tested against the rules in sequence
    (in this case, ABC). Suppose a user at company B has an IP of 190.15.65.23 and
    is trying to access data on an employee of company A with the IP 212.234.178.6.
    The router would allow the transmission, since the only rule applied would be
    rule A. Since the packet met the criteria of rule A, it passed through the router
    without rules B or C being applied. In the reverse order, from an IP in the 212.220.0/16
    range to an IP in the 190.15.65./25 range, rule A would not apply, so rule B would
    be tested. Since the packet meets the criteria of rule B, it would be permitted
    to pass through. If a packet does not meet the criteria of rule A or B, then rule
    C is applied. In this case, the default is to tell the router to deny anything,
    since the 0.0.0.0/0 range includes every IP.


    Filtering tables can become long and complicated. It is important for the administrator
    to have a detailed understanding of the filters applied to traffic and Internet
    services, since it is hard to test filters before they are enacted. In addition,
    unnecessary filters can slow a router, which, in turn, can slow the entire network.


    # TCP Wrappers


    TCP wrappers function by adding another layer (wrapper) to packets sent between
    client and server. They can be used to monitor and filter incoming requests for
    various network services (FTP, Telnet, etc.). To implement a wrapper on a specific
    service, the original daemon for that service is placed in another location. Then,
    the wrapper for that replaces the daemon at its origin. This wrapper logs or denies
    requests and runs the original network server daemon daemon. Implementation is
    not difficult, since there is no need to modify the original server daemon daemon
    and there is no impact on authorized users of the services.


    Table 1.1 Packet Filtering Rules


    | RULE | SOURCE ADDRESS | DESTINATION ADDRESS | ACTION |

    | --- | --- | --- | --- |

    | A | 190.15.65.0/24 | 212.220.0/16 | Permit |

    | B | 212.220.0/16 | 190.15.65.0/16 | Permit |

    | C | 0.0.0.0/16 | 0.0.0.0/16 | Deny |'
  merge: -1
