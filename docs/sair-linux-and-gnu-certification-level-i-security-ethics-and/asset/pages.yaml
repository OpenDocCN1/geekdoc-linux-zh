    Table 3.5 describes each part of the /etc/sudoers file.


    Table 3.5 Descriptions for the /etc/sudoers File

    | /ETC/SUDO SECTION | DESCRIPTION |

    | User Alias | Assigns aliases for each group that will use Sudo |

    | Runas Alias | Provides a common alias for certain users who will beulated by
    Sudo |

    | Host Alias | A list of hosts that may be aliased under one group |

    | Command Alias | A list of commands that users can use through Sudo |

    | User Configuration | The different configurations for each such alias and/or
