  md: '# File Handling Safeguards


    Caution must be taken when handling critical authentication files such as the
    /etc/passwd. If care is not taken, it is possible for the files to become corrupted.
    This may lead to legitimate users being locked out of the system or unauthorized
    users gaining access to the system. For this reason, using traditional editors
    as Vi or Pico to edit files as /etc/passwd, /etc/group, or /etc/sudoers is a bad
    idea.


    # Secure Editing of Authentication Information Files


    Special programs safely edit each of the authentication information files. These
    programs set the appropriate locks on the files and perform any necessary processing
    on them after they are unlocked.


    # Vipw


    The program Vipw allows the administrator to edit the /etc/passwd file in a more
    secure manner than standard editors allow as well as handling any necessary processing
    of the file once editing is complete. If the password file is being edited, a
    message will be returned to the administrator, who informs the user and asks him
    to try again later. While using Vipw, the default editor, Vi, is used unless the
    environment variable EDITOR has been changed to an alternate editor. While editing
    the password file, the usage of Vipw is identical to Vi, if the default editor
    has not been changed. In addition to allowing the user to safely edit the password
    file, Vipw performs several consistency checks on the root entry in the password
    file. Vipw will not allow installation of a password file that contains an improperly
    formatted root entry.


    To start Vipw, the user only needs to type the command vipw, assuming vipw is
    in the path. The format for vipw is as follows:


    ```

    vipw [-V] --version

    ```


    While using Vipw, the user is actually editing a temporary file, /etc/ptmp. If
    the host crashes or something else causes Vipw to suddenly terminate, the /etc/ptmp
    file will not be removed, which will prevent further editing of the /etc/passwd
    file using Vipw. This problem can usually solved by removing the /etc/ptmp file.


    # Vigr


    Vigr is identical to Vipw except that it is used to edit the group file. Just
    like Vipw, it sets the appropriate locks and does any necessary processing when
    the group file is no longer locked. If the group file is already being edited,
    a message will be returned to the administrator similar to the message from Vipw
    saying that the file is in use and the user should try again at a later time.
    The format for vigr is as follows:


    ```

    vigr [-V] --version

    ```'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Chapter 3


    In a similar manner to Vipw, while running Vigr, the user is actually editing
    a temporary file, /etc/gtmp. If the machine crashes, the /etc/gtmp file will not
    be removed and any further editing will not be allowed until the problem is solved.


    # Visudo


    As with the previous programs, Visudo is identical to Vipw and Vigr except that
    it is used to edit the sudoers files. Like the other programs, it sets the appropriate
    locks and does any necessary processing when the sudoers file is no longer locked.
    If the sudoers file is already being edited, a message will be returned to the
    administrator that says "try again later.\ The format for visudo is as follows:


    ```

    visudo [-s] [-V]

    ```


    The -s option forces Visudo to perform stricter checking on the sudoers files.
    The -v option prints the version number of Visudo and exits the program.

    As with the other programs, running Visudo, the user is editing a temporary file,
    /etc/sudoers.tmp. If the machine crashes, the /etc/sudoers.tmp file will not be
    removed and further editing will not be allowed until the problem is solved.


    # Verifying the Integrity of Authentication Information Files


    A badly formed information file can lead to undesirable security risks. For this
    reason, it is important that the administrator test each of these files on a regular
    basis.


    # pwck


    The program pwck checks the integrity of the password file, /etc/passwd, and the
    shadow file, /etc/shadow. It verifies that all the entries are formatted properly
    and contain valid data in each of the fields. Pck ensures that every entry contains
    the correct number of fields, a valid user and group identifier, a valid primary
    group, a valid home directory, and a valid login shell. It also checks to make
    sure that every username in the file is unique.


    If pwck discovers that an entry has the wrong number of fields, the user will
    be prompted to delete the entry. If the user declines, all deletion prompts are
    skipped. If pwck discovers that an entry''s username is not unique, the user will
    again be prompted to delete the entry. However, if the user declines, the will
    continue. All additional problems that are found will display a warning. The user
    should take advantage of the usermod command to fix these problems.

    The syntax is as follows:


    ```

    pwck [-r] [passwordfile shadowfile]

    ```


    The -r option forces pwck into read-only mode. In this mode, pwck will not ask
    the user to make changes but still inform the user if there is a problem with
    the tested file.'
