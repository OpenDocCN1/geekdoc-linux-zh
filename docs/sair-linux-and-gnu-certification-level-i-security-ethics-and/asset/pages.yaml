    # Kerberos Application Server Configuration Services


    The application server or host will be used to offer Kerberized services such
    as FTP or telnet. Assume that the administrator wants to configure the machine
    luke.lucdigital.com as an application server. This can be done locally from luke.lucdigital.com.
