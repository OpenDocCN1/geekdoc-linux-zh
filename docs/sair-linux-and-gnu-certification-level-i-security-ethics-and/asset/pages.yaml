  md: '# LAB XVI


    # Securing the LILO Boot Manager


    # Purpose


    The purpose of this lab is to prevent an attacker from gaining access to the system
    through rebooting. First, the CTRL-ALT-DEL reboot command will be altered and
    removed. Then, the Linux Loader (LILO) boot manager and the Basic Input/Output
    System (BIOS) will be made more secure from this type of attack.


    # Theory


    One of the easiest ways for an attacker to gain system entry is by booting the
    computer in single-user mode. Most systems on a network reboot automatically if
    they are shut down for any reason; single-user mode usually gives root access
    by default. This lab presents several methods to prevent such an attack.


    # Removing the CTRL-ALT-DEL Reboot


    One system weaknesses associated with this kind of attack is the CTRL-ALT-DEL
    function. Typically, this command is set to reboot the system, giving attackers
    an opportunity to boot the computer in single-user mode.'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'CTRL-ALT-DEL is defined in the /etc/inittab file. It is generally set to run
    shutdown if all three of the keys are pressed, but this file can be set to run
    any program or command. This command will be similar to the following:


    ```

    ca:crtaltdel:/sbin/shutdown -t5 -r now

    ```


    This line instructs the computer to run shutdown, wait five seconds between sending
    the processes, the warning, and the kill signal, reboot after shutdown, and when
    to do all of this.


    To prevent this, remove the previous line from the /etc/inittab file. CTRL-ALT-DEL
    will then have no function on the system.


    # A SAMPLE INITTAB FILE


    ```

    # Level to run

    id:2:initdefault

    ```


    ```

    # System initialization before anything else.

    si:sysinit:/etc/rc.d/bcheckrc

    ```


    ```

    # Runlevel 0,6 is halt and reboot, 1 is maintenance mode.

    10:0:wait:/etc/rc.d/rc.halt

    11:1:wait:/etc/rc.d/rc.single

    12:2345:wait:/etc/rc.d/rc.multi

    16:6:wait:/etc/rc.d/rc.reboot

    ```


    ```

    # What to do at the "3 finger salute"

    ca:crtaltdel:/sbin/shutdown -t -rf now

    ```


    ```

    # Runlevel 2&3: getty on console, level 3 also getty on modem

    # port.

    ```


    ```

    1:23:respawn:/sbin/getty tty1 VC linux

    2:23:respawn:/sbin/getty tty2 VC linux

    3:23:respawn:/sbin/getty tty3 VC linux

    4:23:respawn:/sbin/getty tty4 VC linux

    S2:3:respawn:/sbin/ugetty tty2 M19200

    ```


    # Securing the lilo.conf File


    lilo.conf is the configuration file for the LILO boot loader. It manages the booting
    and the parameters of different operating systems.


    # A SAMPLE LILO.CONF FILE


    ```

    boot = /dev/hda

    delay = 40

    compact

    vga = normal

    ```'
  merge: -1
  pgno: 319
- img_proc: true
  md: '```

    root = /dev/hda1

    read-only

    image = /zImage-2.5.99

    label = try

    image = /zImage-1.0.9

    label = 1.0.9

    image = /tamu/vmlinuz

    label = tamu

    root = /dev/hda2

    vga = ask

    other = /dev/hda3

    label = dos

    table = /dev/hda

    ```


    # DESCRIPTIONS OF OPTIONS FOR LILO.CONF


    +   **Boot**: Establishes the name of the device with the boot sector.

    * **Map**: Sets the location of the map file.

    * **Install**: Installs the file as the new boot sector.

    * **Timeout**: Sets how LILO will wait for keyboard input.

    * **Prompt**: Requires user entry at the boot prompt.

    * **Default**: Specifies the default image.

    * **Delay**: Specifies the period (in tenths of seconds) that LILO waits before
    booting the first image.

    * **Compact**: Attempts to merge read requests for adjacent sectors into a single
    request.

    * **Vga**: Specifies the VGA text mode selected when booting.

    * **Normal**: 80x25 text mode.

    * **Extended**: 80x50 text mode.

    * **Ask**: Requests user input at boot time.

    * **Root**: Specifies the device that should be mounted as root.

    * **read-only**: Monitors the root file as read-only.

    * **image**: Indicates the file or device with the boot image of a Linux kernel.

    * **label**: Contains a reference name for an image.

    * **other**: Indicates an arbitrary system to boot.

    * **table**: Specifies the sector with the partition table.

    * **password**: Protects an image with a password.

    * **restricted**: Requires a password to be entered if any parameters are specified
    on the command line.


    Although the last two options were not in the sample lilo.conf file, they are
    necessary to make LILO more secure. Without the restricted option, an attacker
    could use the lilo command to boot in single-user mode, which usually gives root
    access. If not, the command linux init+/bin/ sh will allow them root access. The
    password option is used in conjunction with restricted;'
