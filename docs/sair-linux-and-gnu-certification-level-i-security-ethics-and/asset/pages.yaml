  md: '# PortSentry


    Costly system repairs can be avoided if an initial security scan is performed
    to alert the system administrator to possible attackers. Unfortunately, monitoring
    every connection on every port is not a feasible option. Tools like PortSentry
    offer solutions to this problem.


    # What Is PortSentry?


    PortSentry monitors all activity on specified ports and can be configured to set
    several courses of action when an attacker is detected. The attacker can be sent
    a message informing him or her that she has been detected, placed in the /etc/hosts.deny
    file, routed to a non-existent machine, or the system administrator can be notified
    by the program. PortSentry will even allow for the attacker''s system to be flood-pinged;
    however, this is not recommended. For additional security, all unauthorized connection
    attempts are logged in the portsentry.history file.


    # Installing and Configuring PortSentry


    The installation process for PortSentry is quite simple. It can be downloaded
    from the Psionic Software page at www.psionic.com/abacus/ portsentry. With root
    access, first unzip and utter the file, and then personalize PortSentry. In the
    portsentry.conf file, the following options should be checked and changed if necessary:


    +   * TCP_PORTS This is a list of TCP ports for PortSentry to monitor. There should
    be no spaces in this list.


    +   * UDP_PORTS This is a list of UDP ports for PortSentry to monitor. Again,
    no spaces.


    +   * ADVANCED_PORTS_TCP A number indicating the highest TCP port number to monitor
    from.


    +   * ADVANCED_PORTS_UDP A number indicating the highest UDP port number to monitor
    from.


    +   * ADVANCED_EXCLUDE_TCP A list of TCP ports that should be excluded from monitoring
    in Advanced mode. Again, no spaces.


    +   * ADVANCED_EXCLUDE_UDP A list of UDP ports that should be excluded from #monitoring
    in Advanced mode. Again, no spaces.


    +   * IGNORE_FILE The path to the file containing the IP addresses of hosts always
    to be ignored.


    +   * BLOCKED_FILE The path to the file containing the IP addresses of blocked
    hosts.


    +   * BLOCK_UDP Disables all automatic responses to UDP probes when set to 0.
    Generally useful for Internet exposed hosts.


    +   * BLOCK_TCP Disables all automatic responses to TCP connections, generally
    not necessary.


    +   * KILL_ROUTE This is the command to drop the route if an attack is detected.
    Check the README.install for more information.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# System Utilities 141


    KILL_HOSTS_DENY The format of the string to drop into the host.deny file in the
    event of an attack.


    KILL_RUN_CMD Any command you wish to run the route is dropped to the attacker,
    retaliation is not recommended.


    SCAN_TRIGGER The number of grace port hits to allow before Reacting. The default
    value is 0.


    PORT_BANNER A text banner to be displayed to the attacker upon detection. It can
    be commented out, and it is not recommended to taunt the attacker.


    After setting the configurations, portsentry.ignore file must be edited. Make
    sure it contains the local host and local interfaces. Once this is done, compile
    the program using the make linux command. This process automatically creates the
    directory /usr/local/psionic/portsentry, although this can be altered if necessary.
    Make sure the alternate path is specified in the Makefile, portsentry.conf, and
    portsentry_config.h files if this is changed. Issue the make install command once
    the compile is completed. The next, final and step is to start Portentry. Only
    one protocol can be started at a time. The commands to run the various protocol
    modes includes:


    +   portsentry-tcp (basic port-bound TCP mode)

    portsentry-udp (basic port-bound UDP mode)

    portsentry-stcp (Stealth TCP scan detection)

    portsentry-sudp (Stealth UDP scan detection)

    portsentry-atcp (Advanced TCP stealth scan detection)

    portsentry-audp (Advanced UDP stealth scan detection)


    The syslog file contains messages indicating program status, all security relevant
    events, and attack attempts. Each of these has been tagged for easy identification.
    Each program status messages are delineated with the defaultalert: tag, security
    relevant events with securityalert: tag, and messages detailing instances of a
    tripped sensor and response action are marked with the attackalert: tag.


    # Weaknesses


    With any security system, PortSentry has its weaknesses. The chief weakness of
    Portentry is that while it can detect slow scans—those that spread the testing
    over a period of time—it is unable to detect a structured scan, in which the attacker
    probes the system from multiple source addresses.


    # Sysmon


    Sysmon is primarily a system-monitoring tool that manages the basic system and
    network services. In most cases, Sysmon works as a daemon, sysmond, that is initiated
    at system startup. This daemon executes while continuously gathering information
    about the system services. Most versions of Sysmon allow users to select the list
    of system services to be monitored. The official site for Sysmon is www.sysmon.org,
    where a downloadable version of Sysmon can be obtained.'
  merge: -1
  pgno: 162
- img_proc: true
