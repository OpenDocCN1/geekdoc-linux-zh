    # # ipchains and iptables


    Without some form of security, a connection between a local network and the Internet
    is an unrestricted pathway. Users inside the local network can use resources outside
    of the network and vice versa. At times, accessibility can be beneficial. However,
    for security, access to the network must be restricted and monitored, and there
    are instances when access to information outside of the local network must be
    controlled. The most common method of controlling the flow of information on a
    network is through the use of packet filtering programs such as ipchains and iptables.


    # # Packet Filtering


    The concept of packet filtering is almost self-explanatory. Data is sent across
    networks in the form of packets, which contain information on the packet''s origin,
    destination, and the protocol it is using. A packet also contains fields important
    in its transmission, such as the packet''s number, which is used to sequentially
    reassemble the data on the receiving end. A packet filter is a program that examines
    the packets as they enter or leave a system, selectively restricting passage.


    Kernels numbered 2.1.102 and higher have packet filtering built into them, and
    do not need to be patched. However, kernels with a lower number will need to be
    patched in order to make use of packet filtering.


    # # Why Filter?


    Packets that are filtered increase security. Even if all of the accounts on a
    system have passwords, an administrator may not prevent outsiders from using telnet
    or ftp to access a system. There are also malicious attacks, such as denial-of-service
    or flood attacks, that can be prevented by correct application of packet filters.


    Another reason to use packet filtering is the control of information. Packet filtering
    can be used to block unwanted e-mail before it reaches a user''s inbox. System
    users can also be kept from certain sites or types of protocols through the use
    of packet filters.


    # # The Rules Chain Concept


    The most common method used by packet filtering for the organization of the filters
    is the rules chain. A rule contains a listing of each filter, or rule, that has
