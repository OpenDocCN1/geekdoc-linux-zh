  md: '# # LAB

    # XVII

    # Squid


    # ## Purpose


    This lab familiarizes you with Squid, a proxy-caching program, and its configuration.
    This includes configuring, starting, running, and testing Squid. The configuration
    of the Web browser, Netscape Navigator, and how to use Squid as a proxy server
    is also discussed.


    # ## Theory


    Squid is a proxy-caching server for Web clients. After a user visits a Web site,
    a server positioned between the user and the rest of the Internet saves the page.
    If the same user, or another user connection to the same proxy server, tries to
    access the Web site again, the proxy server will read the page out of its local
    cache and send it to the user. This process saves bandwidth, speeds connection
    times, and is completely transparent to the user.


    It is well known that large sporting, television, and political events can cause
    an increase in Internet traffic over a particular connection or to a certain Web
    site. Since it is difficult to predict the impact that such events will have,
    an Internet service provider''s connection can become saturated. This severely
    cripples the throughput to all other Internet sites, but caching can dramatically
    reduce the impact of such problems. With Squid, popular Web sites will be cached
    on a local server. If the Web site becomes'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'sluggish, users of the caching server will not be affected since they will
    download the Web page from the caching server and not the original location. In
    addition, since multiple connections to the same site over the upstream connection
    will be reduced, upstream bandwidth will be saved.


    # Requirements of Squid


    Squid is not a CPU-intensive application, so an older processor will be sufficient
    for a site with a medium number of users. However, Squid requires a significant
    amount of disk space to store the cached objects. A minimum of several gigabytes
    of storage and at least 63 megabytes of RAM is recommended. Squid and the operating
    system will require more of the available RAM, so if the server is going to support
    many users, increased RAM will improve the server''s performance.


    # Installing Squid


    To install Squid, download the source code from www.squid-cache.org. It can be
    compiled by running the configure script and then the make program.


    # Components of Squid


    Squid is comprised of the daemon and its configuration files; all of the configuration
    files are located in the /etc directory. The main Squid configuration file, squid.conf,
    is the only file that must be changed from the default.


    # Lab Exercises


    In the following exercises, you will install and configure a basic Squid proxy-caching
    server and configure both Internet Explorer and Netscape to use the configured
    proxy server.


    # Installation of Squid


    download the source code for the latest version of Squid. This can be obtained
    from the official Squid Web site, www.squid-cache.org/Versions.


    At the time of this writing, the current version of Squid was 2.3. If a newer
    version is being installed, substitute for version number 2.3.


    After downloading the source code, unzip and tar the archive, as shown here:


    ```

    $ gzip -dv squid-2.3.STABLE4-src.tar.gz

    $ tar xvf squid-2.3.STABLE4.src.tar

    ```


    To compile Squid, enter the Squid directory, run the configure script, and then
    run the make command:'
  merge: -1
  pgno: 325
- img_proc: true
  md: '```

    $ cd squid-2.3.STABLE

    ./configure

    ./make

    ```


    # Configuration of Squid


    Although Squid has several configuration files, this lab only discusses the /etc/squid.conf
    file. For advanced configuration of Squid, read the Squid user’s guide located
    at squid-docs.sourceforge.org/latest/html/book1.htm.


    The http_port operator is the first option that must be changed in the squid.conf
    file. This controls the port that Squid will listen for in incoming connections
    from Web clients. Although the default value is 3128, the user may want to change
    to something more standard, such as 8080, as shown here:


    ```

    http_port 3128

    ```


    should be changed to:


    ```

    http_port 8080

    ```


    Next, determine where Squid should save all the accumulated cache files. This
    is controlled by the cache_dir operator in the squid.conf file. The default option
    is similar to the following:


    ```

    cache_dir /usr/local/squid/cache/ 100 16 256

    ```


    The /cache_dir directory has been created when Squid was compiled. The first number
    after the directory specifies the number of megabytes Squid uses for the cache;
    in this case, 100. The second number indicates the number of first-level directories,
    or subdirectories, of the /cache_dir; the third number indicates the number of
    second-level directories, or subdirectories, of the first-level directories. Squid
    creates these extra directories to increase the speed of disk access to the cached
    files. The user may wish to change these two values later, but for now, simply
    increase the number of megabytes that Squid can use for:


    ```

    cache_dir /usr/local/squid/cache/ 2048 16 256

    ```


    In the preceding code, the amount of disk space that Squid can use was changed
    from 100 megabytes to 2 gigabytes (2048 megabytes).


    the cache_mgr operator controls the e-address that will be notified if Squid dies
    or has serious complications. Change this option to send e-mail to the user admin
    as shown here:


    ```

    cache_mgr admin

    ```


    Although Squid initially runs as root, it no longer requires root privileges once
    the system has been started. Allowing Squid to continue running as root creates'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'potential security risks. To solve this, the squid.conf file has two operators,
    cache_effective_user and cache_effective_group. These operators control the user
    and group that Squid will switch to after it has started. In the following, the
    dummy account nobody (which has the privileges of a regular user) and the corresponding
    group nogroup were used:


    ```

    cache_effective_user nobody

    cache_effective_group nogroup

    ```


    If some type of access control is not implemented when running Squid, anyone on
    the Internet could use the caching server and steal network resources. Following
    is a basic access control list for Squid using the http_access operator:


    ```

    acl ipadresses src 206.31.151.0/24

    http_access allow ipadresses

    http_access deny all

    ```


    This list only allows connections from the local network; in this case, 206.31.151.0/24.


    # Starting Squid


    To start Squid, use the following command:


    ```

    /usr/local/squid/bin/squid

    ```


    Add this command to a startup script, so that Squid starts automatically.


    # Configuration of Netscape Navigator to Use Proxy Server


    Now that Squid is configured and running, set up a browser to test it.


    To configure Netscape, use the following sequence in the Edit menu: select Preferences,
    Advanced, Proxies, and then proxy configuration, and click the View button. Next,
    enter the hostname of the Squid server under HTTP Proxy and enter the port number
    8080 under HTTP Port.


    Assuming that Netscape does not generate any errors, the Squid caching system
    should be working.


    # Questions


    +   1. What are the advantages of running Squid?

    2. Why should network access to Squid be limited?

    3. What options must be changed to configure Netscape Navigator to use Squid its
    caching server?'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Answers


    +   1. If a Web site is becoming sluggish, users of the caching server will not
    be affected since they will download the Web page from the caching server and
