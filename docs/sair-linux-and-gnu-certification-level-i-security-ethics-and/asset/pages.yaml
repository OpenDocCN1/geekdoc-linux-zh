    # Group-Based System Access


    Access to files and directories can be restricted to a certain group. This is
    useful when many people need access to a file, but not every user should have
    access to it. By adding the desired users to the same group, the system administrator
    only needs to set the permissions of a certain file or directory once to allow
    the desired amount of access for the group.


    # Security Risk of SUID Programs


    SUID programs are a potential security risk and should be monitored closely. Because
    these programs grant privileges to the user who is executing them, insecure programs
    should not be installed. Crackers can exploit SUID programs, and then leave a
    SUID program as a back door, even if the original problem has been fixed. The
    system administrator should be aware of all SUID programs on the system and monitor
    any unusual activity with these programs. The following command can be used to
    search a file system to find files with the SUID and SGID bit:


    ```

    root# find / -type f \ -perm -0400 -o -perm -0200 \) >> suid.txt

    ```


    The chmod command can be used to remove the SUID permissions on a suspicious program.
    However, it is important to note that some programs must have SUID permissions
    to function properly.


    # Buffer Overflow


    Some programmed system calls, as strcpy and sprintf, can be dangerous due to buffer
    overflow problems. Programs or system calls do not check for the input into the
    buffer. When the input into the buffer is larger than the buffer itself, problems
    may occur. Since a computer does not distinguish between data and a program, the
    input data from the overflow becomes the next instruction for the program. it
    is actually given by the data in the buffer overflow. Buffer overflow can easily
    take control of the running program; this may present a risk. Once the point of
    the buffer overflow has been determined, a script can be run to perform the task
    over and over. If a program that is running as root has a buffer overflow problem,
    then arbitrary code can be run as root.'
