    \ the logrotate configuration-directions.\n\n```\n#see 'man logrotate' for details\n\
    #rotate log files weekly\nweekly\n#keep 4 weeks worth of backlogs\nrotate 4\n\
    #send errors to root\nerrors root\n#create new (empty) log files after rotating\
    \ old #ones\n#uncomment if you want your log files #compressed\n#compress\n#RPM\
    \ packages drop log rotation information into #this directory\ninclude /etc/logrotate.d\n\
    #no packages lastlog or wtmp -- we'll rotate them here\n/var/log/wtmp {\n  monthly\n\
    \  rotate 1\n}\n#system specified logs may be configured here\n```"
