  md: 'Theory of Operation 29


    # Newsgroups


    Newsgroups are a good way to gain valuable information pertaining to security.
    Many security-related newsgroups are available. The following is a brief list
    of newsgroups (for a more detailed list, see www.cert.org/other_sources/usenet.html):


    comp.security.unix. Security-related issues for Unix systems.


    comp.security.misc. Security issues for computers and networking.


    comp.security.announce. Announcements related to security, including CERT/CC.


    # Additional Information


    Most security Web sites contain links to other sources of information. The CERT/CC
    has a links page at www.cert.org/other_sources/.


    # Ethics in the Information Age


    The increasing role of computers in modern society has improved the efficiency
    of business and trade, and has also greatly changed the individual power of the
    consumer. Computers provide a new and vast realm where the rules of conduct may
    not be as intuitive as the ones provided by the machine. This realm is commonly
    referred to as cyberspace, a virtual world built by data and its transportation.
    Within this world, anonymity reigns. To derive a code to which all conduct must
    adhere to is a daunting task; however, judgments in cyberspace can be based upon
    value applied to data and its transportation. Similar to the legality of certain
    actions, ethical behavior is required in cyberspace and can be implemented in
    a variety of ways. Many issues have arisen from the popularity of computing and
    the Internet, including topics as privacy, security, safety, and legality. This
    section does not cover all of these topics in depth, it does attempt to build
    a foundation of principles so a system administrator can make wise decisions.


    # Definition of Ethics


    The issue of how ethics applies to the use of computers is raised because what
    is virtuous, right, and wrong can change with the implementation of any new technology.
    Cyberspace and the technological age bring a multitude of new ethical dilemmas.
    One example of this might involve a system administrator who checks a user''s
    e-mail file for anything that might compromise or discredit the company. If both
    the user and administrator are aware of the same set of rules, any misunderstanding
    of these rules would allow for an error in judgment. Foundations of intercompany
    codes simply to establish a system of conduct by which employees should base their
    decisions; therefore, a user and system administrator may know exactly how to
    act in specific situations. These codes of conduct often vary between companies
    and organizations even though they might share fundamental ideals. Intercompany
    ethics often'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'are based primarily on party''s interests, where any damage to the structure
    of that company is avoided.


    Restrictions such as legality and cultural relativity often determine how one
    society functions in the eyes of another. Although differences may be present,
    a variety of ethical systems continue to evolve. This does not mean that one society
    is better than another, since goals are still being achieved, but they are achieved
    in a different manner.


    Aristotle explained his view of ethics as a set of rules by which a virtuous life
    can be led. In his opinion, an ethical life must be led consciouslly, being informed
    on all relevant matters and paying attention to all subsequent decisions. This
    rudimentary definition of ethics also encompass the development of technology
    and its effects. If society wishes to use computers, it must make a conscious
    decision to do so. For example, if a system administrator does nothing to protect
    a system and unfortunate happens to the system, this does not mean that the system
    administrator has acted ethically. However, if a system administrator is aware
    of the system''s security holes, keeps the solutions for it current, and a problem
    still occurs, the administrator acted ethically despite the outcome. To act ethically
    conscious motivation and requires an individual to act upon accessible information.
    A system administrator acts ethically when he or she follows a code that has been
    determined to lead him or her in the most beneficial direction. If the administrator
    had knowledge of some action and it varied from the predetermined code, it is
    then that he or she could be considered acting unethically.


    Administrators should be able to incorporate ethical guidelines into their administrative
    duties and adhere to documented and experiential guidelines. If this is done,
    when they find themselves in positions to make specific judgments the best decisions
    can be made. To reiterate, it is the motivations and their intents that a system
    administrator or computer user implements that define ethically a job is performed.


    # Do Ethics Apply?


    The Internet also has concerns about the importance and respect of intellectual
    property. The Internet provides a medium in which the use of intellectual property
    is a common practice. A simple click on the mouse can result in a violation of
    an established law or statute. Other ethically questionable issues lie in the
    area between work and leisure. In many professional environments, employees view
    personal e-mail. Would it be ethical for a company to prohibit this? The reasons
    for the company''s actions may be examined, but it is as though the decision will
    be based upon the best possible outcome for the company or institution. It may
    also be the case that allowing employees to view personal e-mail at work helps
    to develop productive individuals over time. Decisions such as this should be
    supported with an accepted code, whatever the decision may be, but with the notion
    that the administrator must enforce ethical codes and abide by them.


    # Ethics for System Administrators


    Just as system administrators should be prepared for making decisions such as
    minim-izing system downtime, they must also have the tools necessary to make an
