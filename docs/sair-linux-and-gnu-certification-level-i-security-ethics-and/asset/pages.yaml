  md: '# LAB

    VII

    netstat


    # Purpose


    The purpose of this lab is to use the netstat utility in conjunction with inetd.conf
    to start and to shut down services that are considered unnecessary.


    # Theory


    The netstat application is used to display network information, such as network
    connections, routing tables, and interface statistics, about the current host.
    The system administrator can then use this information to determine what services
    are being used on the system. Administrators then configure the inetd daemon by
    editing the inetd.conf file and turning off unnecessary services.


    The netstat utility follows the standard format for a Linux command. However,
    because of the number of things that can be done with netstat, there are several
    options and formats available. More details on the netstat utility can be found
    in the Linux man pages.'
  merge: -1
