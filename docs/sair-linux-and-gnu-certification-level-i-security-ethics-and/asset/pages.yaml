    # /etc/pam.conf Configuration


    This method of configuring PAM allows all the PAM-aware services to be specified
    in one file, /etc/pam.conf. The fields in this file are as follows:


    ```

    service_name module_type control_flag_path arguments

    ```


    The following is an excerpt from the /etc/pam.conf file:


    login auth required /usr/lib/security/pam_unix.so.1

    login auth sufficient /usr/lib/security/pam_rhosts.auth.so.1

    rsh auth required /usr/lib/security/pam_rhosts.auth.so.1


    This file allows modules to make use of multiple PAM modules.


    # /etc/pam.d Hierarchy


    This has become the preferred manner of configuring PAM, since it allows a more
    modular approach to working with PAM, provides a safety against misconfiguration,
    and is easier to maintain. The /etc/pam.d directory contains one configuration
    file per service. For example, the ftp file found in this directory controls all
    the authentication methods used with the FTP service. The notable exception to
    this is the other file, which acts as a default response for any service without
    an explicit configuration file.


    # File Fields and Configuration


    Each line in the configuration files can be separated into the following fields:


    ```

    module-type  control-flag module-path  arguments

    ```


    The only difference between this configuration format and that of the pam.conf
    file is that the service name is not needed, since it is controlled by the name
    of the file. For instance, the line


    ```

    auth  required  /lib/security/pam_pwdb.so shadow nullock

    ```


    found in the


    ```

    /etc/pam.d/screensaver

    ```


    file indicates that, when the screensaver is interrupted and authentication is
    necessary, the password keyed in is is checked against the password database using
    shadowed passwords before the program can proceed.'
