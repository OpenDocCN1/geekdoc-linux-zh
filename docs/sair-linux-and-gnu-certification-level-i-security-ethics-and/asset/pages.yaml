    chains must point to the new chain for it to be used. If a packet traversing one
    of the three main chains encounters a rule that causes the packet to jump to the
    user-defined chain, the packet will traverse the chain until it encounters a rule
    that applies to it or it reaches the end of the chain. In this instance, the packet
