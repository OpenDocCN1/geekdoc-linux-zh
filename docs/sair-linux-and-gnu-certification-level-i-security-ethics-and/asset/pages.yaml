    | ppg -kg | Create a pair of keys for a user |

    | ppg -kv | View the keys that a user has stored |

    | ppg -kx userID filename.pgp | Copy a userID''s public key into filename.pgp
    for distribution |

    | ppg -e file userID | Encrypt file so that only user userID can open the file
    |

    | ppg file -o plaintext | Decrypt the encoded file file into a decrypted file,
