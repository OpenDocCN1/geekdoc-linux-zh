    To prevent users from reading the lilo.conf and obtaining the password when both
    of these options are enabled, the lilo.conf file should only be readable by root.


    # A SAMPLE LILO.CONF FILE WITH PASSWORD AND RESTRICTED IMPLEMENTED


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=100

    default=linux

    image=/boot/vmlinux-2.2.5

    label=linux

