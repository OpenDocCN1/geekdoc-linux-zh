- img_proc: true
  md: '# Trustix


    Trustix is a full Linux distribution based on the Red Hat distribution. It is
    available from www.trustix.net. The Trustix Secure Linux (TSL) distribution provides
    multiple security tools for an administrator, and is designed with secure defaults.
    For example, ping, telnet, and similar services are not available by default.
    Instead, a TSL installation will restrict access to these services so that a system
    administrator will be able to control their use.


    Trustix also provides alternatives to utilities commonly thought insecure, such
    as Wu-FTP. For example, TSL provides FTP services either through the PROftp daemon
    or the BSD FTP daemon, depending on the administrator’s preference. Following
    is an example list of services provided with TSL:


    +   - GNU Privacy Guard

    - IMAP and POP SSL support

    - ipchains

    - SSL Lynx support

    - OpenSSH and Open SSL

    - Pluggable Authentication Module (PAM) Configuration

    - Mail filtering through Procmail

    - SSL tunneling of services

    - TCP wrappers

    - NIS/YP support


    A system administrator can employ these utilities and services to create an acceptably
    secure and updated server for a network.


    # Trinux


    Many system administrators want a full, permanent installation of Linux. However,
    some may only need a temporary security-monitoring server, or may have an unused
    older computer that does not have the hard disk space required for large installations.
    In these situations, Trinux can be a powerful solution. Trinux is based on Slackware
    7.1 and can be downloaded from http://trinux.sourceforge.net. The entire distribution
    is distributed over 1.44-megabyte floppy disks, from which it is booted into the
    system’s RAM.


    The first Trinux floppy contains the kernel and boot images, while the other two
    provide the security and system management utility packages. Trinux provides a
    script to create these floppies using dcd.


    Once the floppies have been created, any computer can be used as a server. Inserting
    the boot floppy and rebooting the computer will load Trinux, and the user will
    be prompted to load the disks containing the utility packages. Trinux resides
    in RAM, so it will run until the computer is rebooted. After a reboot, the system
    will boot to the original operating system unless the Trinux boot disk is left
    in the floppy drive. No permanent changes will be made to the MBR or hard disk.'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'Trinux includes the following security programs and utilities as part of its
    security package:


    +   * Nmap

    * Nbtstat

    * TCP_Scan

    * Cghikh

    * Ddos-scan

    * Dsniff

    * Despoof

    * Hunt

    * Netcat

    * Openrouter

    * Fragrouter

    * TCPPreplay

    * Sentinet

    * Ngrep

    * Nstreams

    * TCPdump

    * Netwatch


    There are other packages provided by Trinux, and a complete list can be found
    at the Trinux Web site. The packages provided allow a system administrator for
    any type of network (Unix, Linux, Microsoft) to load a Linux server and test the
    network for sniffers, spoofed IPs, and security holes in computers that have not
    been patched with security updates. When the security tests have been completed,
    the computer can be rebooted and the original operating system will be restored.


    # Which to Use?


    These three programs/distributions offer different advantages. Bastille is useful
    if an administrator is already running a Red Hat system and wishes to strengthen
    a network. Trustix is a powerful distribution, easily configured for any network
    running Linux. Trinux offers the versatility of a full Linux distribution with
    integrated security features, but without a dedicated system. Although Trinux
    is powerful and portable, it is not a permanent solution for networks that are
    constantly rebooting and/or changing the configuration of computers. However,
    for both Unix/non-Unix/Linux-based networks, Trinux provides a quick and easy
    way to configure and test network security.'
