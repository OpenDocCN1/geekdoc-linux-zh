    sum [filename(s)]


    For example, for a file named hamlet, the command sum hamlet would be used to
    gather checksum information and the following output would result:


    ```

    13144 196

    ```


    For more than one file, say hamlet and tybalt, the command would be sum hamlet
    tybalt, and the output would include corresponding filenames such as:


    ```

    13144 196 hamlet

    54895 7393 tybalt

    ```


    When with a large number of files, as would be the case performing security checks
    on a major system, a good practice is to periodically log the checksum information
    of sensitive files and directories. In the event that a system is compromised,
    these logs can be compared to see which files were affected and when. When the
    command sum * may be used to perform a sum operation on all files in a given directory.
    To direct the output to a file for later reference, use the following syntax:


    ```

    sum [filename(s)] > [logfile]

    ```


    For example, the command sum * checklog.txt will append the sum ''information
    for the current working directory to a file named checklog.txt. The sum command
    will not perform operations on directories.


    # cksum


    The cksum utility functions identically as the sum utility. The major difference
    is that cksum outputs a CRC checksum and the size of the file in bytes, respectively.
    cksum also prints the filename, even if only one file is specified. The syntaxes
    for using cksum are identical to those for the sum utility. Like sum, cksum can
    be used to perform log comparisons on files to determine the likelihood of a loss
    of file integrity. cksum can also be used to check a file against cksum information
    that is sometimes included with files that may be received or transferred across
    insecure networks.


    # md5sum


    md5sum is an extremely useful utility that will generate a 128-bit checksum for
    a given file and output the checksum and filename. The syntax for md5sum is as
    follows:


    ```

    md5sum [filename(s)]

    ```


    The output for performing an md5sum operation on the files hamlet and tybalt would
    appear similar to:


    ```

    061706e4c166ec288aad0a8ffff2651 hamlet

    5c03bdd78e57c682d8f9b8424c09f tybalt

    ```'
