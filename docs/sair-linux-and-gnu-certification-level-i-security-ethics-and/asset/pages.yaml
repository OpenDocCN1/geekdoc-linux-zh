    # Security Issues and Suggestions


    Unfortunately, no FTP server can be completely secure. There is always the risk
    of a determined intruder uncovering vulnerabilities in the server. Therefore,
    it is important to be aware of possible security holes and to close them before
    they are exploited.


    # Writeable Incoming File Directory


    One of the most attractive features of hosting an FTP server is the option of
    having a directory where clients can drop off new files. However, it is important
    to be aware of the potential risks of having such a directory.


    # Inherent Vulnerabilities


    While an incoming file directory can be very useful, it also represents the large
    security hole in an anonymous FTP server. Once uploading is allowed, any user
    who logs in to the server now has the ability to write files to the hard disk.
    Server operators should be aware of the risks of malicious users uploading virus-infected
    files, illegally copied software, pornography, modifying already existing files,
    or denying service by filling the hard disk with large junk files.


    # Suggestions for Security


    As with the rest of the server directory structure, security risks in the incoming
    directory are best prevented through careful setting of ownerships and permissions.
    The incoming directory, wherever it is placed, either in /home/ftp or somewhere
    under /home/ftp/pub, should be owned by root and assigned to the ftp group. It
    is very important to chmod the directory to 1773, thus allowing users to create
    new files in the directory, but not to modify or delete existing files. Also,
    anonymous users are not allowed to view files that have been uploaded, making
    it necessary for the server operator to examine files before they are made available
    for download. Careful monitoring of the incoming file directory is essential to
    the prevention of server misuse.


    # Dedicated FTP Server


    The best way to prevent intruders in a system from accessing unauthorized information
    is to keep off the system altogether. By designing a system from the ground up
    that is used only as an FTP server, the possibility of damage caused by an intruder
    is automatically limited to that. To make a dedicated FTP server as secure as
    possible, no unnecessary processes should be run, no unnecessary packages should
    be installed, and no files should be placed on the hard disk that users do not
    need access to. All of this will ensure that intruders cannot take advantage of
    bugs or security holes in other programs should they somehow gain access to the
    system.'
