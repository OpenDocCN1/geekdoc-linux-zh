    note that the longer and more complicated a password is, the harder it is to remember.
    Therefore, the challenge for the user is to create a password that he or can remember
    easily but is also difficult to crack.


    # Password Storage


    Some users keep their passwords written down, which is one of the worst actions
    a user can take. Passwords that are written and left on a note or on a user’s
    desk can be found and used for malicious purposes. It is recommended that the
    user memorize the password.


    However, if users employ more than one password in their day-to-day activities,
    it can be more difficult to keep track of the different passwords. Some studies
    have shown that if a user stores the password in a secure place (such as a wallet
    or purse), then that is better for security than if a user consistently forgets
    a password and has to keep asking system administrators for it.


    # Password Upkeep


    The longer a password resides on a system, the higher the likelihood that the
    password can be cracked or obtained by someone else than the owner of the password.
    To combat this, the shadow password suite by Linux systems provides the ability
    to expire passwords automatically after a certain amount of time.'
