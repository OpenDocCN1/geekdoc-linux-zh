  md: 'Some of the swatch options for notification when a pattern is matched the badloginfinger.pl,
    which will identify the origins of a bad login attempt; call_pager.pl, which will
    notify the user via a pager call to a specified number; echo, which prints the
    log message to the screen in a variety of colors; and bell, which will ring the
    system bell a number of times. Another useful action is the mail option (mail[address:address:...]),
    which will, if no address is given, mail the matched file to the running swatch
    or, if an address is given, whatever address is specified in the address field.

    The first two, badloginfinger.pl and call_pager.pl, are not included in swatch
    3.0 version, but in the older 2.2 version. If these two notification utilities
    are desired, the user will have to download and access these from the 2.2 version.

    The report-all pattern, .*/, should generally be kept at the end of the configuration
    file. Selecting patterns to ignore prior to the report-all pattern will eliminate
    any unnecessary reporting of benign log messages.


    # Lab Exercises


    The following exercises discuss downloading and configuring swatch.


    # Obtaining swatch


    Download swatch from one of the following sites:


    +   - ftp://ftp.stanford.edu/general/security-tools/swatch/

    - ftp://coast.cs.purdue.edu/pub/tools/unix/swatch/


    If these pages are down, a keyword search should find other sites with the swatch
    utility available. Continue to download the zipped and tarred swatch package.
    Once done, proceed to unzip it using gzip, and also unt. Read all the files that
    come with the swatch package, especially the INSTALL, README, COPYING, and KNOWN_BUGS.
    Now run perl Makefile.PL at a command line to begin installation of the necessary
    Perl modules, followed by the make, test, and the make install commands.


    > NOTE Makefile.pl may need to be run more than once to get all the required modules.


    # Configuring swatch


    It is important to become familiar with the different types of log messages that
    are produced when undesirable events happen in, or to, a system. This will enable
    the user to configure programs like swatch by knowing exactly what to look for.
    This exercise, along examination and production of different messages in log files,
    will help to accomplish this goal.'
