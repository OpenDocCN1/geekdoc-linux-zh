  md: '# Understanding and Using Secure Shell


    # Purpose


    This lab focuses on using Secure Shell (ssh), the theory behind how it works,
    and what makes it more secure than standard Telnet or rlogin.


    # Theory


    Secure Shell (ssh) is a program that enables users to log in and execute commands
    on a remote machine. It is similar to Telnet or rlogin, but ssh uses encryption
    algorithms to encrypt all data before sending it across the network. This means
    that attackers using port-sniffing programs cannot obtain usernames and passwords.
    There are currently two versions of ssh, ssh protocol version 1 and ssh protocol
    version 2. The Secure Shell Daemon (ssd) is the server component of ssh and listens
    for connections from clients.


    # ssh Protocol Version 1


    Each host has a 1024-bit, host-specific RSA key. ssh also generates a 768-bit
    RSA key when it is started. In addition to these, the server generates a new key
    every hour for additional security. When a client tries to connect, ssh sends
    the client its public key and server host key. The client verifies that the RSA
    key has not changed by checking its own database. The client then produces a random
    number and'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'encrypts it using both the host key and the server key. The encrypted number
    is sent to the server as a session key to encrypt all further communication; the
    rest of the session is encrypted using Blowfish or 3DES encryption algorithms.
    Next, the client enters an authentication dialog with the server to try and prove
    its identity through one of four methods: .rosthosts authentication, .rosthosts
    combined with RSA host authentication, RSA challenge-response authentication,
    or password-based authentication. However, .rosthosts authentication is normally
    disabled because of security risks.


    # ssh Protocol Version 2


    In ssh2, each host has a DSA host specific key. The server in version 2 does not
    produce a server key. Instead, it provides forward security through a Diffie-Hellman
    key agreement, which results in a shared session key. The resulting session is
    encrypted using Blowfish, 3DES, CAST128, or the Arcfour algorithms.


    # ssh Commands and Syntax


    The command syntax for ssh given in the man pages is:


    ```

    ssh [-l login_name] [hostname | user@hostname] [command]

    ```


    For instance:


    ```

    ssh -l bob 123.456.789.123

    ```


    would start a connection for user bob on 123.456.789.123. At this point, bob would
    be prompted for a password. Assume that bob also needs to start a program called
    getit; this could be accomplished through the following command and options:


    ```

    ssh -l bob 123.456.789.123 getit

    ```


    When bob supplies his password, the program will begin executing. To end a ssh
    connection, type exit as follows:


    ```

    [bob@computer bob]$ exit

    ```


    Another interesting features of ssh is X11 forwarding, which allows users to run
    X11 applications on one computer and see them on another. In a Telnet session,
    the user would have to set the DISPLAY environment variable each time he she wanted
    to do X11 forwarding. With ssh, this is accomplished by specifying the -X option
    on the command line and can be disabled with the -x option.

    All of these examples used protocol 1. For protocol 2, use the -2 option as follows:


    ```

    ssh -l bob 123.456.789.123 -2

    ```'
