    # Securing the BIOS


    The BIOS is the lowest-level software of a system and has final control over the
    system''s hardware. Usually, BIOS contains all of the code needed to use the keyboard,
    monitor, disk drives, and other low-level functions.

    BIOS security is easy to establish. On most computers, the BIOS allows the setting
    of both a boot password and a password for the BIOS itself. If the computer''s
    case is physically locked or cannot be easily opened, passwords can be useful
    deterrents. However, these passwords can be bypassed if the attacker has physical
    access to the computer; or she could remove the case and reset the BIOS by removing
    and rejoining a password on the computer''s motherboard. As long as the computer
    is physically secured, BIOS passwords are an effective means of low-level security.

    The BIOS should also have an option to set the boot order. Most computers follow
    a boot order by default: first from the floppy, then from the hard drive, then
    from the CD-ROM. A level of security is added by simply changing this order so
    that the hard drive boots first.


