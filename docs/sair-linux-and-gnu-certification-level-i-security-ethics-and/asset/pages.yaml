    # # Crack


    In order to better understand the security needs of a computer or computer system,
    it is generally a good idea to approach the problem from the cracker''s point
    of view. Pretending that you are attempting to break into a system quickly show
    the weaknesses and faults of a computer system. Crack is a program that can assist
    in displaying the present weaknesses in a computer password system.


    # # What Is Crack?


    Crack is a hacking program that can uncover user passwords. Many different versions
    of Crack exist. In this section, Crack 5.0 written by Alex Muffet is to fully
    understand the way Crack works, one must first understand password systems.


    Unix and Unix-like machines usually store passwords in either the /etc/passwd
    file or the /etc/shadow file. Generally, the /etc/shadow file is where the passwords
    are located. This prevents a security leak that could occur involving permissions
    to the /etc/passwd file.


    The actual passwords are stored in encrypted form to prevent them from being recognizable
    and misused. In practice, every time a user logs in and enters his her password,
    the computer encrypts the password and matches it with the already encrypted password
    stored in the /etc/shadow file. If the encrypted passwords match, the computer
    allows access; if they do not, the computer declines.


    Passwords are encrypted with a one-way algorithm, meaning that the password can
    be encrypted, but is nearly impossible to decrypt. The original idea behind using
    a one-way algorithm was to ensure security, even if the /etc/shadow file was.
    In theory, if a'
