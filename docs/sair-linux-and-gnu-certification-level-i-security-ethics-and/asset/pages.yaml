  md: '# Chapter 1


    One type of security breach is a packet sniffer. Packet sniffers are used by crackers
    to gather and view information transferred within a network, whether that information
    is intended for them or not. Such information can range from files enroute from
    one computer to another to other people''s activity on the network or e-mail.
    The nature of packet sniffers makes them very difficult to detect, and few ways
    to combat such a security hole exist; it is possible to use hardware that is resistant
    to such methods of cracking, as fiber optic backbones. The AntiSniff application,
    for example, is an excellent tool for detection of packet sniffers. AntiSniff
    works by monitoring a network for packet sniffers and computers in promiscuous
    mode. (Computers are normally set up to receive information intended for themselves,
    but when they are set up to receive information intended for others, they are
    said to be in promiscuous mode.) What makes AntiSniff excel over other intruder
    detection software is its ability to locate passive activity.


    Another effective remote scanner is Nessus, which is a free security scanner.
    It is kept by a database of updates and allows users to plug in their own security
    tests, making it a very useful feature for user-specific needs. Nessus works by
    probing all ports and testing the security of any service found to be running
    on. Additionally, Nessus can provide simultaneous security checks for an unlimited
    number of hosts.


    System Administrator''s Integrated Network Tool (SAINT) is used to gather information
    about services using NFS, JIS, finger, and FTP that are running on hosts and networks.
    While this information contains which network services are running on hosts, it
    also tracks the configurations of those services. Information can, in turn, be
    checked for potential security flaws. These flaws may consist of incorrectly configured
    services, well-known bugs in certain software versions, or poor policy decisions.
    SAINT can report this or investigate security problems based on the data. It can
    also explore outwardly hosts and networks connected to the local system by which
    it runs. This ability is extremely useful in examining the implications of trusting
    services running on foreign hosts. When using SAINT, a system administrator should
    be careful to monitor and control how it travels and how its actions affect other
    systems.


    One extremely useful package that is included with many distributions is TCP-WRAPPERS
    by Wesema. The TCP-WRAP package allows an administrator to restrict connections
    to services based on IP addresses. The main benefit of this package is that when
    an attempt to use a service monitored by TCP-WRAPPERS is detected, a number of
    actions can be taken. The requesting host can be fingered to find out information
    about it, among other things, it can e-mail the administrator. This ability should
    be used with caution because having an e-mail sent every time a commonly used
    service is accessed can cause overload and possibly harm the system.


    One of the most useful ways to prevent a network intrusion is through the use
    of a firewall. An effectively administered firewall can block malicious attacks
    on a system and log incoming data that can be filtered to detect if an attack
    is evident. Firewalls are inexpensive and, once they have been built, easy to
    maintain. The perfect option for the novice administrator, they can grow as the
    system grows and fine-tuned to the needs of the network.'
