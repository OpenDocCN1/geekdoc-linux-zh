    Do not accept a digital signature on face value. It is possible to place a fake
    digital signature on an electronic document and hope that the readers will accept
    the signature on face value. In order for the digital signature to work, the signature
    must be verified using PGP''s digital signature system.


    # CFS


    Cryptographic File System (CFS) provides a way to encrypt and decrypt files on
    a client system without modifying the system kernel. CFS uses a secure directory
    where files are encrypted. A user must attach the directory to the /crypt mount
    point and give the decryption key for that directory. The Transparent Cryptographic
    File System (TCFS) is essentially an extended version of NFS. It allows the network
    file system to work at the kernel level and operates transparently to users and
    programs. TCF requires some modifications, making it more complicated to set up
    CFS. The transparency to users and programs, however, can make TCF a better choice
    depending on your local policies. Using CFS or TCF along with PGP is a method
    of protecting sensitive data while on a system and in transit.


    # Password Weaknesses


    Passwords are an integral part of system security, without which a system would
    be extremely open and vulnerable to any user. Creation and upkeep of strong passwords
    is the responsibility of both system administrator(s) and the users of a system.

    Passwords are important because they keep malicious users from accessing a system.
    Data can be stolen or corrupted easily by a user who obtains passwords to a system;
    this can lead to the loss of monetary valuable information. Even if a system does
    not have valuable information, it is still important to keep a system secure.
    With passwords to a system, a malicious user could use one system as a host for
    illegal activity.


    # Creating a Strong Password


    A strong password is one that is difficult to crack, changed often, and stored
    in a secure place.


    # The Characters and Formatting of Passwords


    If a password is chosen poorly, it can be easy to crack. Passwords can be cracked
    in several ways, including a dictionary attack or a brute-force attack.

    A dictionary attack occurs when a list of the encrypted passwords for a system
    (usually stored in /etc/shadow) is obtained, and then checked against a list of
    encrypted'
