  md: '# Chapter 4


    # # Kerberos


    The majority of the protocols used on the Internet today do not provide a secure
    transmission of data packets as they travel between client and server. This presents
    a considerable vulnerability. Anyone with the means to do so may intercept transmissions,
    reading private messages or intercepting passwords as they travel in plain text.
    The growing concern over this security issue has led to the development of increasingly
    secure networks and protocols. The Kerberos Network Authentication Service is
    one of the solutions Developed to address these security vulnerabilities.


    # # What Is Kerberos?


    Kerberos, designed at MIT for the Athena project, allows users and services to
    authenticate themselves to each other using a third-party authentication server.
    This allows for authentication processes to be constantly encrypted when they
    pass over the network. Kerberos also allows encryption of the entire network connection
    if the network administrator feels it necessary. For all traffic to be encrypted,
    the Kerberos distribution from MIT comes with Kerberos versions of popular client
    and daemon software. This includes POP and the Berkeley R-commands, login and
    rsh.


    A key provides the foundation for authentication in Kerberos. The key is used
    to encrypt and decrypt the packet''s contents at either end of a network connection.
    The encryption routine in Kerberos encrypts the data to be sent based on the code
    in this. Conversely, the decryption routine on the opposite side of the connection
    uses the key to decrypt the contents of the packets it receives. Therefore, for
    this process to be successful, the key must be held by both sides of the connection.


    The authentication server is a third-party machine that processes all authentications
    in the local network, or realm, between a user and a server. The user and server
    must have a key that is known by the authentication server. The user key is derived
    from his or her password; the server key is selected randomly. The realm is just
    one primary authentication server; however, the realm can have backup servers
    to share the load with the primary server if there are many machines in the same
    realm. These backup machines are called slaves.


    # # A Connection under Kerberos


    If Luke wants to connect to a particular server, called Deathstar, a message is
    first sent to the authentication server. The message states that Luke is and that
    he would like to connect to Deathstar. The authentication server then makes two
    copies of a new key, the session key. One of these session keys is encrypted with
    Luke''s key, along with a message that says Deathstar. This will be Message 1.
    The other session key, along with a message that says Luke, is encrypted with
    Deathstar''s key. This will be Message 2. Both encrypted messages are sent to
    Luke.


    Luke''s computer then uses his key to decrypt Message 1 and gets the session key
    and the message that says Deathstar. The authentication server sends back Deathstar
    message so that Luke''s computer knows that the message it received was from the
    authentication server and that the decryption was a success.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# System Utilities 113


    Luke''s computer then uses the session key to encrypt Message 3, containing a
    time-stamp with the current time in it. Luke cannot decrypt Message 2, as it was
    encrypted with Deathstar''s key. Luke''s computer then sends Message 2 and Message
    3 to Deathstar.


    Deathstar decrypts Message 2 with its own key and extracts the session key and
    the message that says Luke. The server uses the session key to decrypt Message
    3 and extracts the valid time. These two items provide to the identity of the
    user.


    The timestamp is included in Message 3 to prevent someone from intercepting Message
    2 and attempting to impersonate Luke at a later time. Since system clocks probably
    do not have the same exact time, Kerberos allows for a specified amount of leeway
    (the default is about five minutes) between all the system clocks and what is
    on the timestamp.


    Message 2 is known as the ticket, which gives the user permission to talk to the
    server. Message 3 is known as the authenticator. The authenticator usually contains
    more information than the timestamp (a checksum among other things). If further
    communication between the client and server is to be encrypted, the authenticator
    will also contain the connection encryption key.


    This authentication process is almost instantaneous and invisible to the user.
    The user only has to enter his or her password to be connected to the key server.


    # Parts of Kerberos


    Kerberos configurations have several unique elements and terms. It is essential
    to understand these before attempting to implement Kerberos on a network.


    # The KDC


    As we have begun to illustrate, the authentication server verifies the legitimacy
    of the user''s request for connection based on his or her password. To prevent
    the user from having to enter his or her password every time a new connection
    is to be made, Kerberos introduces a new server, the Ticket Granting Server (TGS).
    The TGS operating in conjunction with the authentication server is known collectively
    as the Key Distribution Center (KDC). The KDC is responsible for granting access
    to its specified realm via the TGS. Before the user connects to any regular service,
    the user must request a ticket from the authentication server to contact the TGS.
    This ticket is known as the Ticket Granting Ticket (TGT).


    Every realm has one KDC that handles all authentication and key distribution.'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'requests for a large network, and will soon become a bottleneck for the realm.
    In this situation, several realms should be set up, each with its own KDC. Cross-realm
    authentication allows Kerberos clients and servers to communicate with another
    realm.


    # Principals


    For an individual to use Kerberos, he or she must have a principal, similar to
    a user account on a machine. The format for a Kerberos principal is:


    ```

    name/instance@REALM

    ```


    The name field can be anything, though commonly the same as the user''s username.
    Note the following principal:


    ```

    fred@LUCASDIGITAL.COM

    ```


    The instance can be used when services need to be distinguished from each other.
    An example might look like the following:


    ```

    fred/admin@LUCASDIGITAL.COM

    ```


    The REAL field after the @ is the name of the realm. While the realm can be named
    whatever the system administrator wishes, the Kerberos realm is most commonly
    named by uppercasing the DNS domain name associated with the hosts in the realm.
    If the hosts are in the lucasdigital.com domain, the realm should be LUCASDIGITAL.COM.


    # Kerized Application Servers


    Programs must be designed with Kerberos functionality built in, in order to work
    under the Kerberos system. The term Kerized clients refers to any entity that
    must get a service ticket to work with a Kerberos application server. An example
    of a Kerized client would be the version of Telnet. An application server is a
    Kerized daemon with which Kerized clients communicate using tickets for authentication.
    An example of an application server would be the Kerized version of the Telnet
    daemon telnetd, also included in the standard Kerberos distribution.


    # Kerberos Requirements and Installation


    The KDC should be set up on a machine that is as secure as possible. If the security
    of the KDC is compromised, the security of the network has also been compromised.
    For this reason, the server should not run any additional services other than
    the KDC, and should have few accounts as necessary. It is also a good practice
    to restrict logins to the console.

    The KDC does not require much processing power. Unless the KDC is going to facilitate
    hundreds of machines, an older machine with several hundred megabytes of disk'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# System Utilities 115


    space should be sufficient. The majority of the disk space will be used for storing
    log files. The actual amount of disk space needed depends on how often the administrator
    plans to cycle these log files.


    # Compiling Kerberos from Source


    The Kerberos source may be obtained from MIT''s Kerberos Web site at // web.mit
    .edu/network/kerberos-form.html. Kerberos is distributed as three tar files containing
    the src, doc, and crypto directories, these being the source, documentation and
    cryptography source, respectively; all should be downloaded.


    U.S. laws restrict the export of Kerberos due to the strong encryption that he
    is required to answer questions to that he is a U.S. or Canadian citizen and agrees
    to abide by relevant export controls. After the files have been downloaded and
    the files been untared with the tar -x command, the source must be compiled. gcc
    the free GNU C compiler is recommended for compiling the Kerberos source. Any
    ANSI-compliant C compiler should work, compilers may have trouble building the
    source. To build the source using the gcc compiler enter the /kerb5-1.2.1/src
    directory (where 1.2.1 is the Kerberos version number) and run configure. To install
    Kerberos, run the install command as root.


    # Installing RPMs with Red Hat Linux


    The Red Hat 6.2 distribution of Linux, Kerberos is installed by default with the
    Red Hat installation program. If the user chooses not to install Kerberos during
    the initial install, but wishes to use the system later, the user does not have
    to compile the source of Kerberos. Instead, Red Package Management (RPM) files
    are provided to simplify installation. The Kerberos RPMs are available on the
    Red Hat 6.2 CD-ROM, or from the Red Hat Web site at www.redhat.com/apps/download/


    # Kerberos KDC Installation with RPMs


    To install the KDC using RPMs, the kerb5-server-1.1.1-9.i386.rpm package is needed.
    The following additional RPMs are also required:


    +   - kerb5-devel-1.1.1-9.i386.rpm

    - kerb5-libs-1.1.1-21.i386.rpm

    - kerb5-configs-1.1.1-21.i386.rpm

    - kerb5-workstation-1.1.1-9.i386.rpm


    Once all the RPMs have been located, they are installed with the rpm -i command,
    such as the following:


    ```

    $ rpm -i kerb5-server-1.1.1-9.i386.rpm

    ```'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# Kerberos Client and Application ServernInstallation with RPMs


    To install the Kerberos client and server software using RPMs, the krb5-workstation
    package -1.1.1-9.i386 is needed, in addition to the workstation package krb5-libs-1.1.1-21.i386.rpm
    . After these two RPMs have been located, the installation is the same as for
    KDC:


    ```

    $ rpm -i krb5-workstation-1.1.1-9.i386.rpm

    ```


    # Kerberos KDC Configuration


    After the appropriate software has been installed on the KDC and the client machines,
    the system administrator must modify the Kerberos configuration files, after administrative
    principles for the KDC, and launch the KDC services.


    # Configuration Files


    The KDC has two configuration files, kerb5.conf and kdc.conf. The kerb5.conf is
    in the /etc directory, and the kdc.conf file should be in the var directory under
    the root Kerberos folder. Kerberos was installed in the /kerb5 directory, the
    kdc.conf file should be in the /kerb5/var/ kerb5dc directory.

    kerb5.conf and kdc.conf contain configuration options for the clients, where as
    all the KDCs are, which is the local KDC, and which machines are included in which
    realms. The administrator should edit the default realm field to reflect the name
    of the local realm. The administrator should also add any other realms and their
    KDCs that the users of the local realm might need in order to communicate. These
    are the only major changes, which are required; however, the administrator should
    adjust the other options to fit the needs of the local network.


    # Database Creation


    After the configuration files have been properly edited, the administrator must
    create the Kerberos database. The database stores all of the principal names and
    passwords, and is created using the kdb5_util command. For example:


    ```

    $ /kerb5/sbin/kdb5_util create -r LUCASDIGITAL.COM -s

    ```


    The -r option is used to specify the name of the local realm. The create option
    is used to create a new database. The -s option creates a stash file that is used
    by the KDC to authenticate itself.


    The administrator will be prompted for the database master password. It is important
    to remember this password, as there is no way to recover it.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Access Control List Creation


    The administrator needs to create an access control list (ACL) file for the KDC.
    This file specifies which principals are allowed to access the Kerberos database.
    The format of the file follows:


    [Kerberos principal] [permissions] [optional target principal]


    A tab separates each field. The first field is the name of the principal to which
    the permissions apply; the second field is the permissions that the principal
    is allowed or disallowed. The third field is used to allow the permissions specified
    to be used on the specified target only. The [Kerberos principal] and [optional
    target principal] fields can include the "*" wildcard. For example, if the administrator
    wants any instance admin to have full permissions on the Kerberos database, the
    principal */admin@LUCASDIGITAL.COM could be used. The rule in the ACL would look
    like this:


    ```

    /admin@LUCASDIGITAL.COM *

    ```


    The valid permissions that the Kerberos ACL recognizes for accessing the database
    are listed in Table 4.1.


    # Table 4.1 Kerberos Permissions


    | PERMISSIONS | DESCRIPTION |

    | --- | --- |

    | a | Allows the addition of principals |

    | A | Prohibits the addition of principals |

    | d | Allows the deletion of principals |

    | D | Prohibits the deletion of principals |

    | m | Allows the modification of principals |

    | M | Prohibits the modification of principals |

    | c | Allows the changing of passwords for principals |

    | C | Prohibits the changing of passwords for principals |

    | i | Allows inquiries |

    | I | Prohibits inquiries |

    | l | Allows the listing of principals |

    | L | Prohibits the listing of principals |

    | * | Short for all privileges (admcil) |

    | X | Short for all privileges (admcil) |'
  merge: -1
  pgno: 138
