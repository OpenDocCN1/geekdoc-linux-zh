  md: '# Shells and Commands


    While both use encryption and strong authentication methods, only SSH2 includes
    sftp. SSH2 also limits the available methods of authentication. SSH1 allows Kerberos,
    .hosts login, passwords, and RSA encrypted key systems, but SSH2 only allows Digital
    Signature Algorithm (DSA) encrypted key systems and passwords.


    SSH2 does not allow .hosts login because of its many vulnerabilities. With the
    traditional utilities (ftp, rlogin, or rsh), a user can log into a system with
    a password, if the system recognizes either the IP address or the machine. The
    user''s information is simply matched with the .hosts file to check if a user
    is valid, making the system vulnerable to spoofing.


    SSH1 prevents spoofing by including the option of combining .hosts logins with
    an encrypted key system (RSA). With the option invoked, the user was required
    to decrypt the key that the server presented and match the information inside
    .hosts file or the /etc/hosts.equiv file. SSH2 eliminates spoofing vulnerabilities
    by removing the option of .hosts login.


    Since they are different protocols, SSH1 and SSH2 are incompatible. However, most
    server daemons are configured to handle client requests via either protocol. This
    is done by having the SSH2 daemon launch an SSH1 daemon when it receives an SSH1
    request.


    SSH1 and SSH2 are subdivided by different developments of the utilities package.
    There exist both public and private versions of SSH1 and SSH2, meaning that some
    versions are sold by companies, while other versions, as OpenSSH, are freely distributed.
    The versions are essentially the same because the Internet Engineering Task Force
    (IETF) maintains the basic requirements for SSH.


    OpenSSH supports SSH2, and the next section covers commands from a protocol 2
    perspective. Further details on SSH1 and command differences between the two versions
    can be found in the ssh man page.


