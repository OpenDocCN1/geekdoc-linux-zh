  md: '# Basic Commands


    The following is derived from the man page synopsis of ipchains:


    ```

    ipchains [-AC] chain rule-specification [options]

    ipchains [-RI] chain rulenum rule-specification [options]

    ipchains -D chain rulenum [options]

    ipchains [-LFN] [chain] [options]

    ipchains -F chain target [options]

    ```


    +   -A Append a rule to the end of a chain.

    -C Insert a rule at the beginning of a chain.

    -R Replace a rule in a selected chain.

    -I Insert rules in the selected chain at the given rule number.

    -D Delete one or more rules from the chain.

    -L List all of the rules in the selected chain.

    -F Flush the existing chain.

    -N Create a user-defined chain.

    -X Delete a user-defined chain.

    -P Change the default policy on the chain.

    -p Filter based on the packet''s protocol.

    -d Filter based on the packet''s destination.

    -s Filter based on the packet''s source.

    -i Filter based on the packet''s target interface.

    -y Block incoming TCP SYN packets.

    -j The action to take when the packet matches the rule.


    # Setting up Basic Rules


    Once an administrator has installed and configured ipchains, he or she might want
    to check the current state of the rules chains. This can be accomplished by entering:


    ```

    $ ipchains -L [chain]

    ```


    When ipchains is started, the default policy on the rules chains is ACCEPT. However,
    many administrators will want to change these, so that they do not need to add
    a rule to the chain for every possibility. The command to change the default policy
    on a chain is


    ```

    $ ipchains -P [chain] [value]

    ```


    where [chain] is either INPUT, OUTPUT, or FORWARD, and [value] is one of the six
    special values or a user-defined chain


    ```

    $ ipchains -P input REJECT

    ```


    would set the default policy on the input change to REJECT.'
