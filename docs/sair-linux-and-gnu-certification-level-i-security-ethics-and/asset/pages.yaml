  md: '# Kernel Source


    Linux kernels follow a specific numbering sequence that describes the development
    of the operating system. The kernel number is comprised of a group of three numbers
    separated by decimal points. The first number (major) represents significant changes
    made to the kernel. Only a major redesign or improvement causes a major number
    to change. The second number (minor) denotes whether the kernel is stable or a
    beta version; even numbers mean the kernel is stable, while odd numbers mean the
    kernel is still in the beta, testing, or stage. In most cases, an even, minor
    number is preferable. The third number (release number) shows the number of changes
    or additions made to the kernel.


    A patch mirrors the kernel it fixes or improves. To apply a patch to kernel 2.2.12,
    the patch 2.2.12 should be used. The patch and the kernel number should match
    exactly, since applying the incorrect patch to a kernel may produce detrimental
    results. When updating a kernel by several versions, each patch for the intermediate
    kernels must be applied. For example, updating a kernel from 2.2.8 to 2.2.12 requires
    the patches for versions 2.2.9, 2.2.10, and 2.2.11 to be installed. Skipping a
    patch may result in a kernel that does not boot or perform a desired service.


    # Patch File


    Official kernel patches may be found at www.kernel.org. These patches have been
    approved by the Linux community, have undergone a thorough testing process (especially
    with an even, minor number), and carry a high degree of reliability. Because the
    Linux source code is freely available, many vendors and individuals have developed
    additional features or altered the code to perform a specific task. These patches
    are available from the vendor or individual. Check the source''s credibility before
    using one of these patches, since a bad patch could eliminate a desired function
    or fail to boot the kernel.


    # How to Patch the Kernel


    There is a series of established steps needed to patch the kernel: using the patch
    command, recompiling the kernel, and confirming that all modules can be loaded
    as needed.


    # The patch Command


    To apply a patch, the user must have root access. By convention, the kernel and
    patches should be placed in the /usr/src directory. Save the patch in the /usr/src
    directory and make it the active directory. Enter the following command to install
    the compressed patch:


    ```

    $ zcat patchXX.gz |patch -p0

    ```'
