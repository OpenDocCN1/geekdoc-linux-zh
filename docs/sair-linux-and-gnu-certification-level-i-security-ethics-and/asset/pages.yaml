    warning is 90-percent disk usage. This percentage can be lowered or raised by
    changing the bbdef.sh file.


    # # Linux Intrusion Detection System


    The Linux Intrusion Detection System (LIDS) is one of the best methods of securing
    a Linux system, making unauthorized entry or change almost impossible.


    # # What Is LIDS?


    The LIDS distribution consists of a kernel patch and an administration program.
    The patch is added to the kernel and restricts system access. When LIDS is activated,
    not even root can override it. If an attacker gains root access on a machine protected
    by LIDS, he or she must still deactivate LIDS before accessing protected files,
    which is not an easy task.


    # # Features


    LIDS offers numerous ways to restrict access to a system. A user can keep files
    from being overwritten or deleted, and can delete certain files, such as log files,
    to only be appended to. Protecting and hiding processes, such as slushed and other
    monitoring daemons, is possible with LIDS. It provides a standard security monitor
    built into the kernel and can issue alerts of possible port scans, other types
    of attacks, and anomalies.'
