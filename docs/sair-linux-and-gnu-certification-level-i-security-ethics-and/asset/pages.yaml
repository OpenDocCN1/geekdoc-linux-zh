    # XI

    # Using GnuPG


    # ## Purpose


    The purpose of this lab is to familiarize the reader with the function of GNU
    Privacy Guard (GPG or GnuPG). The GPL-licensed PGP type security tool has many
    benefits, including GnuPG complete Open PGP implementation and numerous improvements
    over previous versions of PGP. Table XI.1 outlines four key technologies implemented
    by GnuPG that provide a strong security system.


    Table XI.1 Key Technologies Implemented by GnuPG

    | TECHNOLOGY | PURPOSE IN GNUPG |

    | :--- | :--- |

    | Digital Signatures | Using a sender''s private key, a hash code is created and
    verified for each message |

    | Radix-64 Conversion | Converts an 8-bit octet stream into printable ASCII characters
    |

    | Encryption | GnuPG uses a bi-level symmetric and public key encryption |

    | Compression | Compression of files takes place after the application of signatures
    but before message encryption |'
