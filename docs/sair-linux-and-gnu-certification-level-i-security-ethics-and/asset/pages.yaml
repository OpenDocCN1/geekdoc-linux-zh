  md: '# What Are Digital Certificates?


    A digital certificate is an authentication mechanism used to achieve secure transactions
    between two parties; it may be viewed as the digital equivalent of an ID Card.


    When two parties wish to conduct a transaction, it is essential that a mutual
    trust exists between them. This trust may be achieved by the two parties knowing
    one another, or by each party trusting a third party. A digital certificate is
    nothing but an authorization from a trusted third party concerning the integrity
    of each party. To illustrate this concept more precisely, assume that A, B, and
    C are three entities. Further, assume that A and B trust each other, and C trust
    each other. A transitive relationship between A and C may now be derived. Thus,
    if A and C independently trust a common entity B, and have an authorization of
    their trust in the form of a digital certificate, they can both trust each other
    in any future transaction. Figure 4.12 illustrates this further.


    A digital certificate is typically comprised of the following information:


    +   - The details that identify the particular site (name, for example)

    - The public key for that particular site

    - The period for which the certificate is valid

    - A digital signature validating the certificate

    - A list of operations that can be performed using the certificate


    # What Is a Certificate Authority?


    The trusted third party is more often referred to as the certificate authority
    (CA). The soliciting parties present their credentials to the CA that, upon verifying
    both parties'' credentials, will digitally sign a certificate comprising the integrity
    of the entities'' credentials. The CA


    ![](img/6942796f6e22033d0f94b498c190e5cc_171_0.png)


    Figure 4.12 Methodology of a digital certificate.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# System Utilities 151


    will also generate a public and private key combination for the entity. The uses
    of public and private keys are discussed in more detail later.

    In a real-world scenario, the process of trust is not quite simple as explained
    here. Often, multiple CAs exist. The soliciting parties contact the authority
    with which they have a prior trust relationship. These soliciting parties may
    not have a relationship with a mutual CA. To illustrate this, consider entities
    A and C and B and D. Also assume that A and B trust each other and A has a digital
    certificate signed by B; C and D trust each other and C has a digital certificate
    signed by D. Now, an interesting problem arises when A and C wish to have a transaction
    between them. Say C contacts A and presents its digital certificate, but A has
    no way of checking the integrity of C''s digital certificate since it is not signed
    by A''s trusted party. In such a scenario, a mechanism is needed whereby certification
    authorities trust one another. If B and D have a relationship among themselves,
    the previously mentioned problem may easily be solved.

    The CA typically defines policies and guideline for the following:


    +   * Verifying identity

    * Certificate issuance

    * Certificate renewal

    * Revoking certificates


    Following are a few CAs:

    * VeriSign

    * www.web-designs.net

    * Netrust Digital Certificates

    * Open Financial Exchange


    # How Do Digital Certificates Work?


    When a digital certificate is installed to the site, a public/private-key combination
    is generated. This key pair is unique in that the keys are specific to the site
    and a message that is encrypted using the public-key can only be decrypted using
    specific private key. This concept is broadly referred to as public-key cryptography.
    Previously, most communication was done using single-key cryptography, but this
    is insecure as the private key would have to be shared with the other party. In
    public-key cryptography, the private key never leaves the site; it is the public
    key that is shared. The public-key may never be published on the Web.

    Following are the steps involved:


    +   1. When a client site contacts the server on which the digital certificate
    is installed, perhaps using a Web browser that is SSL (Secure Socket Layer) enabled,
    the client authorizes using its digital certificate.

    2. Upon validating the client''s certificate, the server passes its certificate.

    3. The client receives the public key of the server.

    4. The client then generates a session key based on the server''s public key that
    uniquely identifies the session between the client and the server.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# PUBLIC KEY CRYPTOGRAPHY


    ![](img/6942796f6e22033d0f94b498c190e5cc_173_0.png)


    **Figure 4.13** Representation of how digital certificates work.


    +   5. The session key typically has a time duration for which it is valid.

    6. Any further communication between the server and the client is encrypted based
    on the session key.

    7. The server can decrypt the message using its private key.

    8. This establishes a secure communication between sites that have digital certificates
    installed.


    Figure 4.13 depicts this scenario.


    # Usage of Digital Certificates


    Digital certificates are widely employed in electronic commerce and in incorporating
    site security. Electronic commerce applications involve trading and payment through
    the Internet. This would mean that sensitive information like user credit card
    details and bank account information would have to be passed through the Internet.
    Fraudulent sites mimic insecure and compromised sites by acquiring users'' sensitive
    information. In such cases, a user would be fully justified in expecting to verify
    the identity of the entity conducting the transaction. Digital certificates prove
    to be a powerful tool in enforcing tight security measures by acting as a digital
    identity for a particular site, verifying their integrity. Digital certificates
    help verify the authenticity of entities.'
  merge: -1
