- img_proc: true
  md: '# Usage


    Once LIDS has been configured, there are several options and functions available.


    # Switching LIDS


    If it is enabled in the kernel, LIDS protection can be turned off to make changes
    to the system without rebooting. This is done by typing lidsadm -S --LIDS. To
    turn LIDS back on, update the inodes in the lids.conf file by typing lidsadm -U.
    Then, reload the lids.conf file by typing lidsadm -S --RELOAD_CONF. Finally, turn
    LIDS protection back by typing lidsadm -S +LIDS.


    # Using lidsadm for Administration


    The lidsadm utility has many useful options for administrating LIDS. To learn
    more about the commands, read the LIDS HOWTO, which is discussed in the next section.


    # The LIDS HOWTO


    The Linux Intrusion Detection System is still a very young software package that
    will continue to develop. Because of this, it frequently changes. Features are
    continuously added, removed, and altered. The best way to find out about these
    changes is through the documentation, which links to the LIDS HOWTO, on the LIDS
    Web site at www.lids.org/documentation.html.


    # Secure Linux Distributions


    A system administrator can spend time configuring security settings and installing
    security utilities on almost any Linux distribution. However, distributions of
    Linux exist that are natively packaged and configured for optimal system security.
    In addition, there are single programs that can control multiple security functions,
    allowing system administrators to manage system security efficiently and effectively.


    Two distributions, Trustix and Trinux, are preconfigured with security tools to
    simplify system distributions. Unlike other distributions, which are usually lax
    in security, these distributions contain stringent default security settings.
    Trustix is a full Linux distribution, and can be obtained from www.trustix.net.
    Trinux is a ramdisk distribution, meaning that it can be loaded from floppy disks
    into a computer’s RAM without changing any of the information on a system. With
    Trinux, a computer that normally serves a different purpose can function as a
    networking server. Bastille, although not an operating system, is a powerful utility
    that allows a system administrator to configure all aspects of security on a system
    with one program.'
  merge: -1
