  md: '# Introduction


    Welcome to the fourth of four Level I Stair Linux and GNU study guides. This is
    the Security study guide for Stair Linux and GNU Certification Test 3X0-103. This
    study guide is the fourth step of the four-step road map to the Stair Linux and
    GNU Certified Administrator (LCA) certificate. The other three study guides are
    Installation and Configuration (Test 3X0-101), System Administration (Test 3X0-102),
    and Networking (Test 3X0-103). The four tests may be taken in any order, but the
    study guide material is organized under the assumption that the Installation and
    Configuration test is taken first, followed by the System Administration test,
    then the Networking test, and finally, the Security test.


    Testing done with Prometric at any one of its 2400 testing sites. To take a test,
    simply call the Prometric registration line at 1-888-895-6717. Ask the customer
    service representatives about the 3X0 series of exams, and they will answer any
    questions related to the test, describe available local testing centers, and,
    if requested, schedule an exam. It is also possible to register online at www.prometric.com.


    Preparing for test content is criteria-based testing, and Stair take pride in
    the coordination of test topics from the Knowledge Matrix, objectives, competency
    guides, and exams. These topics specify exactly criteria that the candidate must
    meet. The tests directly measure these topics, and results are reported with a
    detailed summary for each of these six areas: operation of base, system shells
    and commands, system utilities, applications, and troubleshooting. Test results
    are absolute.


    Each exam consists of 50 questions that can be answered, reviewed, and changed
    for up to 60 minutes. Typical testers use about 45 minutes to complete the exam.
    Successful completion of each test requires 74-percent correct, or 37 correct
    answers. Unlike tests that assign a rank to the taker relative to all other tests,
    Stair emphasizes mastery of material. Results of the directly relate the examinee
    of the mastery level in each area, allowing each examiner to focus studies in
    areas of relative weakness. Prospective employees can also use the detailed summary
    to evaluate applicants'' employees'' strength. Stair is unique in this regard.
    Some other certification examinations only supply the taker with a relative score
    of some type, without a raw score, percentage correct, or other criterion measure
    for evaluating his or performance. The effect of this practice is to leave the
    taker who fails with no guidance as to how prepare for re-examination.'
  merge: -1
