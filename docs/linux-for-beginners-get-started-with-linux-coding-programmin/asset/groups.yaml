  mdcn: "\n\n# 使用终端\n\n> “Linux：一个带有 CLUE 的操作系统…… 命令行用户环境。” - 匿名（发布于 comp.software.testing）\n\
    \n# 使用终端\n\nLinux 命令行，即终端（Terminal），是一个极其强大的环境。通过它，你可以让操作系统瘫痪，也可以将其更新到令人惊叹的状态。你可以入侵远程计算机、查看动画化的\
    \ ASCII 篝火、安装新的应用程序和程序、观看在荷兰服务器上运行的《星球大战》，并编写复杂的自动化脚本。\n\n在本节中，你将探索终端的复杂之处以及它如何与\
    \ Linux 协同工作。你将学习如何从终端操作 Linux 文件系统，并发现一些在终端中可以做的奇特但有趣的事情。\n\n终端在 Linux 世界中处于至高无上的地位。学习它是工作的，你就能掌握那所有的力量。\n\
    \n# 终端基础\n\n大多数操作系统使用两种类型的界面：GUI（图形用户界面），即 Windows、macOS 和 Linux Mint 启动进入的桌面，以及命令行。虽然现代操作系统尽量避开命令行，但\
    \ Mint 使用终端赋予用户对系统更大的控制权。\n\n# 执行命令\n\n命令行或终端终端是一个极其强大的界面。你在桌面上可以做的一切都可以在终端内完成。让我们先看看它是如何工作的。\n\
    \n- 步骤 1：可以通过点击面板上的终端图标（位于 Firefox 和文件图标之间），或打开菜单并从左侧的快速启动栏中选择来访问终端。\n- 步骤 3：你目前在终端中看到的是你的登录名，后面跟着计算机名称；这是你在第一次安装\
    \ Mint 时在设置期间命名的。该行以当前文件夹名称结束；起初这只是波浪号 ~，你的主目录（Home folder）。\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_45_0.png)\n\
    \n- 步骤 2：终端让你能够访问 Linux Mint Shell（称为 Bash），它让你能够访问底层操作系统。Mint 中的所有内容（包括桌面和 GUI）都是从命令行运行的模块。\n\
    - 步骤 4：行最末端闪烁的光标是你输入基于文本的命令的地方。你可以开始尝试一个简单的命令：打印工作目录 (`pwd`），它会将你当前所在的文件夹输出到屏幕上。输入\
    \ `pwd` 并按回车。\n\n```\n$ david@david-mint ~ $ \npwd\n```\n\n# 终端基础\n\n步骤 5：你输入的所有命令工作方式相同：你输入命令，包含任何扩展命令用法的参数，然后按回车执行你输入的命令。在终端中输入：`uname`\
    \ 并按回车。这将显示关于 Mint 的系统信息。\n\n步骤 8：查看和搜索选项允许你更改终端窗口的大小，当然还可以在终端内搜索任何特定的单词。\n\n\
    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_0.png)\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_1.png)\n\
    \n步骤 6：在我们输入命令之前，让我们先花点时间看看终端提供了哪些功能。菜单选项允许你打开一个新的终端，你还可以更改终端的大小、颜色和行为，添加新标签页并关闭所有活动会话。\n\
    \n步骤 9：终端条目（Terminal entry）进入配置编辑，尺寸调整允许你更改字符编码。有趣的是，你还可以将其设置为“只读”模式，这将阻止你向终端输入任何命令：这在你需要永久显示内容时很有用。\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_2.png)\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_3.png)\n\
    \n步骤 7：编辑（Edit）选项允许你在终端与其他源之间复制和粘贴命令；这在你想要从网页上复制非常长且复杂的命令时非常有帮助。它允许你编辑终端偏好。\n\n\
    步骤 10：最后，帮助（Help）选项显示终端的帮助内容和版本号，更准确地说，以后我们将将其称为 Terminal。目录值得快速阅读一下，以帮助熟悉它的工作方式。\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_4.png)\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_5.png)\n\
    \n# 通过终端更新 Mint\n\n**到目前为止，你一直使用盾牌图标启动 Mint 更新管理器，以更新系统并升级当前安装的应用程序、工具和其他元素。然而，你也可以从终端完成完整的系统更新和升级。**\n\
    \n## 使用 APT-GET\n\n用于更新和升级终端的 APT（高级软件包工具）是一项强大的命令，并根据其用法组合不同的元素。\n\n- 步骤 1：从打开一个新的终端开始，或者如果你已经有一个终端，则使用当前命令打开其内容。这从一个干净的状态开始工作。\n\
    - 步骤 3：`apt-get` 用于更新 Mint 以及 Ubuntu 和其他发行版的软件。使用 `Update` 会检索新软件包并更新源文件列表。要开始升级过程，输入：`sudo\
    \ apt-get` 然后输入你的密码。\n- 步骤 2：在终端中输入：`apt-get`。这会列出最常用命令的列表，即使有时看起来不合逻辑，也值得一看。\n\
    - 步骤 4：注意添加了 `sudo` 命令。`sudo` 命令的形式如下：它意味着管理员用户（超级用户）使用 APT（高级软件包工具）获取更新。现在尝试：`sudo\
    \ apt-get update`。\n\n```\ndavid@david-mint ~ $ \n```\n\n```\nFile-...-sudo apt-get\
