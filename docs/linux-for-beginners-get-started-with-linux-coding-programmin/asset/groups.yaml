    \ do this with every script you create.\n\n```\nFile Edit View Search Tools Documents\
    \ Help\ndaviddavid-mint ~/scripts$ xed helloworld.sh\ndaviddavid-mint ~/scripts$\
    \ ls\ndaviddavid-mint ~/scripts$ chmod +x helloworld.sh\ndaviddavid-mint ~/scripts$\
    \ []\n```\n\n# STEP 10\n\nThink of echo as the BASIC print command. It displays\
    \ text, or variables that are stored in the system, such as the current date.\
    \ Try this: echo Hello World! Today is $(date). Note: $(date +A) is calling the\
    \ variable that stores the current date of your day.\n\n```\nFile Edit View Search\
    \ Tools Documents Help\n[] / x _ \nHello World! Today is $(date)\n#1/bin/bash\n\
    echo Hello World! Today is $(date +A)\n```"
- md: "\n## Creating Bash Scripts – Part 2\n\nPreviously we looked at creating your\
    \ first Bash script, Hello World, and adding a system variable. Now you can expand\
    \ these and see what you can do when you start to play around with creating your\
    \ own unique variables.\n\n## VARIABLES\n\nJust like every other programming language,\
    \ a Bash script can store and call certain variables from the system, either generic\
    \ or created.\n\n- STEP 1: Let's start by creating a new script called hello.sh;\
    \ `xed hello.sh`. In editor: `#!/bin/bash`, then, `echo Hello $1`. Save the file\
    \ and exit xed. Make the script executable with: `chmod +x hello.sh`.\n- STEP\
    \ 2: As the script is executable, run it with `./hello.sh`. Now, as you probably\
    \ expected 'Hello' is displayed in the Terminal. If you then use the command with\
    \ a variable, it begins to get interesting. For example, try `./hello.sh David`.\n\
    - STEP 3: The output will now be Hello David. This is because Bash automatically\
    \ assigns variables for the user, which are then held and passed to the script.\
    \ $1 now holds David. You can change the variable by entering something different:\
    \ `./hello.sh Mint`.\n\n```\nFile Edit View Search Terminal\ndavid@david-mint\
    \ ~/scripts$ edit hello.sh\ndavid@david-mint ~/scripts$ chmod +x hello.sh\ndavid@david-mint\
    \ ~/scripts$ $\nEdit View Search Documents Help\nhello.sh x\n#!/bin/bash\necho\
    \ Hello $1\n```\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint\
    \ ~/scripts$ ./hello.sh\nHello David\ndavid@david-mint ~/scripts$ ./hello David\n\
    david@david-mint ~/scripts$ ./hello.sh Mint\nHello Mint\ndavid@david-mint ~/scripts$\
    \ $\n```\n\n- STEP 4: You can rename variables. Modify the hello.sh script with\
    \ the following: `firstname=$1`, `surname=$2`, `echo $firstname $surname`. Putting\
    \ each statement on a new line. Save the script and exit back into the Terminal.\n\
    \n```\nFile Edit View Search Documents Help\ndavid@david-mint ~/scripts$ ./hello.sh\n\
    Hello David\ndavid@david-mint ~/scripts$ ./hello David\ndavid@david-mint ~/scripts$\
    \ ./hello.sh Mint\nHello Mint\ndavid@david-mint ~/scripts$ \n.hello.sh x\n#!/bin/bash\n\
    firstname=$1\nsurname=$2\necho Hello $firstname $surname\n```\n\nNext\n\n- STEP\
    \ 5: When you run the script you can now use custom variables: `./hello.sh David\
    \ Hayward`. Naturally change the two variables by your name; unless you're also\
    \ David Hayward. At the moment we're just printing the contents, so let the two-variable\
    \ use it.\n- STEP 6: Create a new script called addition.sh, using the same format\
    \ as hello.sh. Here we define variables firstname and surname, and use the echo\
    \ command to perform simple arithmetic by letting an expression, `echo The sum\
    \ is $((firstname+surname))`. Save the script, and make it executable (chmod addition.sh).\n\
    - STEP 7: When you run the addition script we can enter two numbers: `./addition.sh\
    \ 1 2`. The result will be 3. Try with different numbers and see what happens.\
    \ Also change the script and rename it to multiplication.\n- STEP 8: Let's expand\
    \ things further. Create a new script called greetings.sh. Enter the script below\
    \ and make it executable with the chmod command. You can see that there are a\
    \ few additions to the script now.\n- STEP 9: We've added -n to the echo command\
    \ which will leave the cursor on the same line as the new line. The read command\
    \ stores users' input into variables firstname and surname to read later. And\
    \ clear command clears the screen.\n- STEP 10: As a final touch, let's include\
    \ the variable used in the last section. Amend the end of the script to echo Hello\
    \ $firstname $surname. The output should display the current day, calling from\
    \ a system variable.\n\n```\nFile Edit View Search Terminal\ndavid@david-mint\
    \ ~/scripts$ ./hello.sh David Hayward\ndavid@david-mint ~/scripts$ ./hello.sh\
    \ Mint Hello Mint\ndavid@david-mint ~/scripts$ $\n```\n\n```\nFile Edit View Search\
    \ Documents Help\n$ greetings.sh\n#!/bin/bash\necho -n \"Hello, what is your name?\"\
    \nread firstname\necho -n \"Thank you, what is your surname?\"\nread surname\n\
    echo Hello $firstname, how are you?\n```\n\n## Creating Bash Scripts – Part 3\n\
    \nIn the previous pages we looked at If, Else statements now a very basic Bash\
    \ script involving outputting text to the screen, getting a user's input, storing\
    \ and outputting that to the screen as well as including variables. Now let's\
    \ combine what've achieved so far and introduce Loops.\n\n## IF, THEN, ELSE\n\n\
    With most programming structures there will come time where you need to loop through\
    \ the commands you've entered to create better functionality.\n\n- STEP 1: Let's\
    \ look at the If, Then and Else statements now when executed correctly come a\
    \ set of instructions and simply work out something is present THEN do something\
    \ different. Create a new script greeting.sh and enter the text below.\n- STEP\
    \ 2: greeting.sh is a copy of greeting.sh but with a slight difference. Here we've\
    \ added a loop at the if statement. This means IF the variable is equal to David\
    \ the next line, THEN, is the reaction to what happens, and it will output to\
    \ the screen 'Awesome name', followed by the variable (which is David).\n- STEP\
    \ 3: The next line, ELSE, is what happens if the variable doesn't equal 'David'.\
    \ In this case it simply outputs to the screen the firstly 'Hello...'. The last\
    \ line, the command is the statement that will end the loop. If you have an if\
    \ without a command then you get an error.\n\n```\ngreeting.sh\n#!/bin/bash\n\
    echo \"Hello, what is your name?\"\nread firstname\necho \"Thank you, what is\
    \ your surname?\"\nread surname\nclear\nif [ \"$firstname\" == \"David\" ]; then\n\
    \  echo \"David\"\n```\n\n```\ngreeting.sh\n#!/bin/bash\necho \"Hello, what is\
    \ your name?\"\nread firstname\necho -n \"Thank you, what is your surname?\"\n\
    read surname\nclear\nif [ \"$firstname\" == \"David\" ] && [ \"$surname\" == \"\
    Hayward\" ];\nthen\n  echo \"Awesome $firstname $surname\"\nelse\n  echo \"Hello\
    \ $firstname $surname, how are you on this\"\n```\n\n## Creating Bash Scripts\
    \ - Part 3\n\n## MORE LOOPING\n\nYou can loop over data using the FOR, WHILE AND\
    \ UNTIL statements. These can be handy if you're batch naming, copying or running\
    \ a script where a counter is needed.\n\n- STEP 1: Create a new script called\
    \ count.sh. Enter the text in the screenshot below, save and make it executable.\
    \ This creates the variable 'count' which at the beginning of the script equals\
    \ zero. Then the WHILE loop, WHILE count is less than (the LT part) 100 will print\
    \ the current value of counter in the echo.\n- STEP 2: Executing the count.sh\
    \ script will result in the numbers 0 to 99 displaying the Terminal screen; when\
    \ it reaches 100 the script will end. Modifying the script with the FOR statement\
    \ makes it work the same way. In this case you enter the text from the screenshot\
    \ into count.sh.\n- STEP 4: THE UNTIL loop works the same way as the WHILE loop\
    \ only, more often than not, in reverse. So counting to a hundred, using UNTIL,\
    \ we be until: [ count -gt 100 ]; The difference is, until counter is greater\
    \ than (the gt part) one hundred, keep on looping.\n\n```\ncount.sh\n#!/bin/bash\n\
    count=0\nwhile [ $count -lt 100 ]; do\n  echo $count\n  ((count+=1))\ndone\n```\n\
    \n- STEP 5: You're not limited to numbers to one hundred. You can loop, however,\
    \ whatever set of commands you like execute as many times as you want the loop\
    \ to run. Renaming files, creating fifty folders etc. This script will create\
    \ folders named folder1 through folder10 using the FOR loop.\n\n```\ncount.sh\n\
    #!/bin/bash\nuntil [ $count -gt 100 ]; do\n  echo $count\n  ((count+=1))\ndone\n\
    ```- STEP 6: Using the FOR statement once more, we can execute the following sequence\
    \ by manipulating the (0-100) part. This section actually means START, INCREMENT;\
    \ if there's no increment then it's just a single digit to jump to the END, for\
    \ example we could set the loop up to 1000 with two's: for count in {0..1000..2};\
    \ do:\n\n```\ncount.sh\n#!/bin/bash\nfor count in {0..100}; do\n  echo $count\n\
    \  ((count+=1))\ndone\n```\n"
  mdcn: "\n\n## 创建 Bash 脚本 – 部分 2\n\n之前我们查看了如何创建你的第一个 Bash 脚本 Hello World，并添加了一个系统变量。现在你可以扩展这些内容，看看当你开始尝试创建自己的独特变量时可以做什么。\n\
    \n## 变量\n\n与其他所有编程语言一样，Bash 脚本可以存储和调用系统的某些变量，无论是通用的还是自定义。\n\n- 步骤1：让我们创建一个名为 hello.sh\
    \ 的脚本；`xed hello.sh`。在编辑器中：`#!/bin/bash`，然后输入 `echo Hello $1`。保存文件并退出 xed。使用 `chmod\
    \ +x hello.sh` 使脚本具有执行权限。\n- 步骤2：由于脚本是可执行的，使用 `./hello.sh` 运行它。现在，正如你预期的那样，终端显示了“Hello”。如果你对变量使用该命令，它就会变得有趣起来。例如，尝试\
    \ `./hello.sh David`。\n- 步骤3：现在的输出将是 Hello David。这是因为 Bash 会自动为用户分配变量，这些变量会被持有并传递给脚本。$1\
    \ 现在持有 David。你可以通过输入不同的内容来更改变量：`./hello.sh Mint`。\n\n```\nFile Edit View Search\
    \ Terminal\ndavid@david-mint ~/scripts$ edit hello.sh\ndavid@david-mint ~/scripts$\
    \ chmod +x hello.sh\ndavid@david-mint ~/scripts$ $\nEdit View Search Documents\
    \ Help\nhello.sh x\n#!/bin/bash\necho Hello $1\n```\n\n```\nFile Edit View Search\
    \ Terminal Help\ndavid@david-mint ~/scripts$ ./hello.sh\nHello David\ndavid@david-mint\
    \ ~/scripts$ ./hello David\ndavid@david-mint ~/scripts$ ./hello.sh Mint\nHello\
    \ Mint\ndavid@david-mint ~/scripts$ $\n```\n\n- 步骤4：你可以重命名变量。使用以下内容修改 hello.sh\
    \ 脚本：`firstname=$1`, `surname=$2`, `echo $firstname $surname`。将每个语句放在新的一行。保存脚本并返回终端。\n\
    \n```\nFile Edit View Search Documents Help\ndavid@david-mint ~/scripts$ ./hello.sh\n\
    Hello David\ndavid@david-mint ~/scripts$ ./hello David\ndavid@david-mint ~/scripts$\
    \ ./hello.sh Mint\nHello Mint\ndavid@david-mint ~/scripts$ \n.hello.sh x\n#!/bin/bash\n\
    firstname=$1\nsurname=$2\necho Hello $firstname $surname\n```\n\n接下来\n\n- 步骤5：当你运行脚本时，现在可以使用自定义变量了：`./hello.sh\
    \ David Hayward`。自然地根据你的名字更改这两个变量；除非你也是 David Hayward。目前我们只是在打印内容，所以让这两个变量派上用场。\n\
    - 步骤6：创建一个名为 addition.sh 的新脚本，使用与 hello.sh 相同的格式。在这里我们定义了变量 `firstname` 和 `surname`，并使用\
    \ `echo` 命令通过让一个表达式执行简单的算术运算：`echo The sum is $((firstname+surname))`。保存脚本并使其具有执行权限（chmod\
    \ +x addition.sh`）。\n- 步骤7：当你运行 addition 脚本时，我们可以输入两个数字：`./addition.sh 1 2`。结果将是\
    \ 3。尝试不同的数字看看会发生什么。同时也修改脚本并重命名为 multiplication。\n- 步骤8：让我们进一步扩展。创建一个名为 greetings.sh\
    \ 的新脚本。输入下面的脚本并使用 chmod 命令使其具有执行权限。你可以看到脚本现在增加了一些内容。\n- 步骤9：我们在 echo 命令中添加了 `-n`，这会让光标留在与新行的同一行。`read`\
    \ 命令将用户的输入存储到变量 `firstname` 和 `surname` 中以供稍后读取。`clear` 命令清除屏幕。\n- 步骤10：作为最后的完善，让我们包含上一节中使用的变量。修改脚本末尾以\
    \ `echo Hello $firstname $surname`。输出应该显示当前日期，调用了一个系统变量。\n\n```\nFile Edit View\
    \ Search Terminal\ndavid@david-mint ~/scripts$ ./hello.sh David Hayward\ndavid@david-mint\
    \ ~/scripts$ ./hello.sh Mint Hello Mint\ndavid@david-mint ~/scripts$ $\n```\n\n\
    ```\nFile Edit View Search Documents Help\n$ greetings.sh\n#!/bin/bash\necho -n\
    \ \"Hello, what is your name?\"\nread firstname\necho -n \"Thank you, what is\
    \ your surname?\"\nread surname\necho Hello $firstname, how are you?\n```\n\n\
    ## 创建 Bash 脚本 – 部分 3\n\n在之前的页面中，我们查看了 If、Else 语句，现在是一个非常基础的 Bash 脚本，涉及向屏幕输出文本、获取用户输入、存储并输出到屏幕，以及包含变量。现在让我们结合目前已取得的并引入循环。\n\
    \n## IF, THEN, ELSE\n\n在大多数编程结构中，总会有需要循环遍历你输入的命令以创建更好功能的时候。\n\n- 步骤1：让我们现在查看 If,\
    \ Then 和 Else 语句，当正确执行时，它们会带来一组指令，并简单地判断某些内容是否存在，如果存在则执行不同的操作。创建一个新脚本 greeting.sh\
    \ 并输入下面的文本。\n- 步骤2：greeting.sh 是 greeting.sh 的副本，但略有不同。在这里我们在 if 语句处添加了一个循环。这意味着如果\
    \ IF 变量等于 David，那么下一行 THEN 就是对所发生情况的反应，它将在屏幕上输出“Awesome name”，然后是变量（即 David）。\n\
    - 步骤3：下一行 ELSE 是当变量不等于“David”时发生的情况。在这种情况下，它只是在屏幕上输出第一行的“Hello...”。最后一行，命令是用于结束循环的语句。如果你有一个没有命令的\
    \ if，你就会得到错误。\n\n```\ngreeting.sh\n#!/bin/bash\necho \"Hello, what is your name?\"\
    \nread firstname\necho \"Thank you, what is your surname?\"\nread surname\nclear\n\
    if [ \"$firstname\" == \"David\" ]; then\n  echo \"David\"\n```\n\n```\ngreeting.sh\n\
    #!/bin/bash\necho \"Hello, what is your name?\"\nread firstname\necho -n \"Thank\
    \ you, what is your surname?\"\nread surname\nclear\nif [ \"$firstname\" == \"\
    David\" ] && [ \"$surname\" == \"Hayward\" ];\nthen\n  echo \"Awesome $firstname\
    \ $surname\"\nelse\n  echo \"Hello $firstname $surname, how are you on this\"\n\
    ```\n\n## 创建 Bash 脚本 - 部分 3\n\n## 更多循环\n\n你可以使用 FOR、WHILE 和 UNTIL 语句来循环数据。如果你正在进行批量命名、复制或运行需要计数器的脚本，这些会非常有用。\n\
    \n- 步骤1：创建一个名为 count.sh 的新脚本。输入截图中的文本并使其具有执行权限。这创建了变量 `count`，它在脚本开始时等于零。然后是 WHILE\
    \ 循环，当 count 小于（LT 部分）100 时，将在 echo 中打印计数器的当前值。\n- 步骤2：执行 count.sh 脚本将产生 0 到 99\
    \ 的数字显示；当它达到 100 时脚本结束。使用 FOR 语句修改脚本使其工作相同。在这种情况下，你将截图中的文本输入 count.sh。\n- 步骤4：UNTIL\
    \ 循环与 WHILE 循环的工作相同，只是更多时候是反向的。所以数到一百，使用 UNTIL，我们将是：[ count -gt 100 ]。区别在于，直到计数器大于（gt\
    \ 部分）100，继续循环。\n\n```\ncount.sh\n#!/bin/bash\ncount=0\nwhile [ $count -lt 100\
    \ ]; do\n  echo $count\n  ((count+=1))\ndone\n```\n\n- 步骤5：你不限于数字到一百。你可以循环执行你喜欢的任何命令集，运行你想循环运行的次数。重命名文件、创建五个文件夹等。此脚本将使用\
    \ FOR 循环创建从 folder1 到 folder10 的文件夹。\n\n```\ncount.sh\n#!/bin/bash\nuntil [ $count\
    \ -gt 100 ]; do\n  echo $count\n  ((count+=1))\ndone\n```- 步骤6：再次使用 FOR 语句，我们可以通过操作\
    \ (0-100) 部分来执行以下序列。此部分实际上意味着起始、增量；如果没有增量，它只是一个跳转到结束的单数字，例如我们可以将循环设置到 1000 且步长为\
    \ 2：for count in {0..1000..2}; do:\n\n```\ncount.sh\n#!/bin/bash\nfor count in\
    \ {0..100}; do\n  echo $count\n  ((count+=1))\ndone\n```\n"
