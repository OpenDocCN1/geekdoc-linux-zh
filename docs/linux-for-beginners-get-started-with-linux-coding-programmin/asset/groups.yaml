    # Desktop Environments


    Linux Mint comes in several different versions, or flavours: Cinnamon, MATE and
    Xfce; there are 32-bit and 64-bit versions of these too. What does it all mean
    though and which version should you choose for your installation?


    ## WHICH MINT?


    A Desktop Environment is the graphical interface which you use to interact with
    the Linux system. Just as the graphical desktop for Windows 10 is also called
    Fluent Design.


    Linux Mint offers a choice of versions of the distro: Cinnamon, MATE and Xfce.
    While that may sound a little confusing for the newcomer, each of the versions
    available contains the same Linux structure and kernel, the kernel is the core
    of the operating system, that handles all the instructions between the software
    and hardware.


    Each version is a slightly different desktop environment, the Graphical User Interface
    (GUI) that you use to interact with the operating system. Each of the desktop
    environments uses different apps to access or use the system, such as the file
    manager to browse the operating system''s file structure or the way it launches
    other apps. Again, though the core availability of productivity, video and graphic
    suites are the same, and function in the same way.


    Why bother then with a different desktop environment? Simply put it, it''s down
    to personal taste. Some users prefer MATE, as MATE is a Fork of the classic GNOME
    2 environment and is a little more modern environment that works between recent
    hardware and has some cutting edge features. Xfce is a more modern environment
    that works on older hardware due to its extremely low use of the available system
    resources.


    In short, Cinnamon is the flagship desktop environment for Linux Mint. MATE is
    more compatible with a wider variety of hardware. Where Windows, for example,
    only offers one desktop environment to work in, Linux offers many. Linux Mint
    has therefore opted to bring the user a wealth of choice.


    ## A DASH OF CINNAMON


    Cinnamon has many benefits beyond its look and feel, although they are important
    factors. Here, we outline a couple of features to help you decide if it''s the
    DE for you.


    ### FAB FEATURE 1


    It performs excellently on more modern systems but is a lot more stable than it
    used to be, and not quite the resource hog it once was. Therefore, don''t be put-off
    Cinnamon if you''re using an older computer to install and Linux Mint.


    ### FAB FEATURE 2


    Cinnamon features configurable Hot Corners, where each corner of the desktop can
    be clicked to perform a particular task, such as display the Workspaces, Show
    Windows or Run a Command. The Hot Corners are well easy to switch between different
    views and help make the desktop a more efficient environment.


    ## MATE


    MATE is a simple to use and intuitive DE that''s fast and stable. In comparison
    to Cinnamon it looks a little antiquated but that''s only on the surface. There''s
    plenty to like MATE:


    ### FAB FEATURE 1


    MATE is an excellent desktop environment for older computers. It works better
    with a larger number of hardware components than Cinnamon generally does but is
    just as capable of delivering a great looking desktop as well as advanced customisations.


    ### FAB FEATURE 2


    Due to its highly configurable nature, MATE can be customized to a fine degree.
    There are plenty of options available to the user who demands a little more from
    their desktop environment, including Compiz Settings, where you''re able to configure
    all manner of desktop effects, even a 3D desktop cube.


    ## CHOLESTEROL FREE DESKTOP


    Xfce started as the Common Desktop Environment (CDE) in 1996. Since then it''s
    changed a few times and is now simply Xfce, with the nickname ''Cholesterol Free
    Desktop Environment''.


    ### FAB FEATURE 1


    Xfce is really a quick desktop and brings out the best in Linux as a fast operating
    system. In fact, it takes us to this point from the top of the page to install
    it onto a new computer; a few hundred words written and we''re using a brand new
    OS. Not bad.


    ### FAB FEATURE 2


    Because it''s just quick and lightweight doesn''t mean Linux Mint Xfce isn''t
    a complete desktop operating system. Just like the other environments offered
    to you, you can use the latest Firefox, Libreoffice, VLC, Gimp, apps and even
    a bit torrent client.


    ## Which Distro?


    Up to now we''ve looked mainly at Linux Mint as there are other Linux distributions
    out there to try. In truth there are thousands of distros to download and install,
    so which one should you decide on?


    ### DISTRO HOPPING


    Distro hopping is a term used by the community for people who never stick to a
    single distribution. They hop from one to the other and back again, using them
    for moving to another or a newly released distro.


