    \ and simply work out if something is present, THEN do something. Else something\
    \ different. Create a new script greeting.2sh and enter the text in the screenshot\
    \ below it.\n\n+   - **STEP 3** The next line, ELSE, is what happens if the variable\
    \ doesn't equal 'David'. In this case it simply outputs to the screen the new\
    \ firstly 'Hello...' The last line, the FI command is the statement that will\
    \ end the loop. If you have an if without a FI command, then you get an error.\n\
    \n```\ngreeting.sh\n#!/bin/bash\necho \"Hello, what is your name ?\"\nread firstname\n\
    echo \"Thank you, and what is your surname ?\"\nread surname\nclear\nif [ \"$firstname\"\
