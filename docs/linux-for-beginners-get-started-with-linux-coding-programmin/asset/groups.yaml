    # # A-Z of Linux Commands


    There are literally thousands of Linux commands, so while this not a complete
    A-Z, it does contain many of the commands you will most likely need. You will
    probably find that you end up using a smaller set of commands over and again but
    having an overall knowledge is still very useful.


    | | | | |

    |---|---|---||

    | adduser | Add a new user | dd | Data Dump, convert and copy a file |

    | arch | Print machine architecture | diff | Display the differences between two
    lines |

    | awk | Find and replace text within(s) | dirname | Convert a full path name to
    just a path |

    | B | | | du | Estimate file space usage |

    | bc | An arbitrary precision calculator language | gawk | Find and replace text
    within(s) |

    | | | | grep | Search file(s) for lines that match a pattern |

    | C | | | groups | Print group names a user is in |

    | cat | Concatenate files and print on the standard output | | Compress or decompress
    named file(s) |

    | chdir | Change working directory | head | Output the first part of file(s) |

    | E echo | ed | A line oriented text editor (edin) | Print or set system name
    |

    | chgrp | Change the ownership of files | | egrep | Search file(s) for lines that
    match an extended criteria |

    | chroot | env | Display, set or remove environment variables | id | Print user
    and group ids |

    | cksum | Print CRC checksum and by counts | expand | Convert tabs to spaces |
    info | Help info |

    | cmp | Compare two files | expr | Evaluate expressions | Copy files and set attributes
    |

    | comm | Compare two sorted files by line | F | Print prime factors |

    | cp | Copy one or more files to another location | fdisk | Partition table for
    Linux | J join Join lines on a common field |

    | crontab | Schedule a command to run at a later time | fgrep | Search for file(s)
    for lines that match a fixed string |

    | csplit | Split a file into context-determined pieces | find | Search for file(s)
    that meets a desired criteria | K kill Stop a process from running |

    | cut | Divide a line into several parts | fmt | Reformat paragraph text with
    specified | L less Display output one screen at a time |

    | D date | Display or change the date & time | format | Format disks or tapes
    | ln Make links between files |

    | dc | Desk calculator | fschck | Filesystem consistency check and repair | locate
    Find files |'
