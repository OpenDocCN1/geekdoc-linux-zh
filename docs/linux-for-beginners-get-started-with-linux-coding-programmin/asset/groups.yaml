    \ of 1985 amid much praise. It's a cracking Atari game, and it is available in\
    \ the Linux Terminal by entering:\n\n```bash\nsudo apt-get install moon-buggy\n\
    ```\n\n### LET IT SNOW\nSnowing in the Terminal console can come over you any\
    \ day. If you're interested, enter:\n\n```bash\nwget https://github.com/semtek/15058483/raw/7/d024716ea57e69fb52632fee09f4427353164a2/snowjob.job\n\
    chmod +x snowjob.job\n```\n\n# MEMORY HOGS\n\nIf you delete a file, there's a\
    \ chance of consuming the most memory on the system. To see the memory hogs, simply\
    \ enter:\n\n```bash\nps aux --sort -rnk 4\n```\nThis sorts the output by memory\
    \ usage.\n\n# BBS\nBack in the days of dial-up connections, the online world was\
    \ made up of Bulletin Boards. These systems remained hang-outs for users to chat,\
    \ swap code, play games and using Telnet, we can still connect to some active\
    \ BBSs. \n\n```bash\ntelnet startbestarrars.dyndns.org\n```\nThere are countless\
    \ BBS available, you can check out https://www.telnetbse.com/bbs/list/ for more.\n\
    \n# SHREDDER\nWhen you want to erase an entire directory (or folder) with tree\
    \ structure, someone with the right software can retrieve it. However, to securely\
    \ and permanently delete a file:\n\n```bash\nmkdir -p New-Dir/\n# subfolder1,\
    \ subfolder2, subfolder3, subfolder4\nshred -zu FILENAME.txt\n```\nThis creates\
    \ a New-Dir with four sub folders. Replace FILENAME with the name of the file.\n\
    \n# ASCII ART\nASCII can be quite striking when applied to some images. However,\
    \ it's difficult to get right. You can create some great ASCII from the images\
    \ using img2txt:\n\n```bash\nimg2txt FILENAME.png\n```\nReplace FILENAME with\
    \ the actual name of the file on your system.\n\n# FORGOTTEN COMMANDS\nIt's not\
    \ easy trying to remember all the Linux commands. Frankly, we can use apropos\
    \ to help. Simply use it, with a description of:\n\n```bash\napropos \"copy files\"\
    \n```\n(1) copy files and directories\n(2) copy files and directories\n(3) copy\
    \ files and set attributes\n(1) rename files\n(2) write the comments in stdout,\
    \ edit and rename\n(3) rename\n\n# Using the Terminal\n# Linux and the Big Bang\n\
    Linux is colliding particles, so we can understand how the universe works.\n\n\
    # DID YOU KNOW...\nthat Linux is at the heart of the science behind the Large\
    \ Hadron Collider? Using a combination of Red Hat and CentOS (an ultra-stable\
    \ distro built from Red Hat core) as the base, clever people at CERN have developed\
    \ several different versions of their own distro to help with all aspects. Most\
    \ notable is SLC, also known as CERN. According to reports, there are over 6000\
    \ systems running and over 15000 running.\n\n# Creating Bash Scripts – Part 1\n\
    \n## SCRIPTING\nA script is simply a series of commands that Bash will run to\
    \ complete a certain task. They can be remarkably complex, and it depends on the\
    \ situation. Eventually, you will be working within the Terminal and with a text\
    \ editor, however, we'll look in a moment for the sake of ease, we will be doing\
    \ examples through:\n\n- **STEP 1**: There are several text editors that we can\
    \ use to create a Bash script; Nano, Vim, GNU Emacs and so on. In the end it all\
    \ comes down to personal preference. The use of Nano is purely for making it easier\
    \ to read the script in screenshots.\n- **STEP 2**: To begin with, and before\
    \ you start to write any scripts, you need to create a folder where you can put\
    \ all your scripts in. This will be our working folder and here you can create\
    \ sub-folders if you want.\n- **STEP 3**: Let's start with a simple script to\
    \ output something to the Terminal. Enter `nano helloworld.sh`. This will launch\
    \ Nano and create a file called helloworld.sh. In Nano, enter the following:\n\
    \  ```bash\n  #!/bin/bash\n  echo Hello World!\n  ```\n- **STEP 4**: Save the\
    \ file and exit back to the Terminal.\n- **STEP 5**: The `#!/bin/bash` line tells\
    \ the shell what you're going to be using, in this case. The hash (#) denotes\
    \ a comment line, which is ignored by the system, the exclamation mark (! ) means\
    \ that the command is bypassed and will force the script to execute the line as\
    \ a command. This is also known as a Hash-Bang.\n- **STEP 6**: When you enter\
    \ `ls` again you can see that the helloworld.sh has now turned from black to green,\
    \ making that it's now an executable file. To run the script, in other words make\
    \ it do the things you've typed into it: `./helloworld.sh`.\n- **STEP 7**: You\
    \ can save the file, clicking Save, and exit back to the Terminal. To make any\
    \ script executable, and able to modify its permissions, do this with `chmod +x\
    \ helloworld.sh`. You should do this with every script you create.\n- **STEP 8**:\
    \ Although it's not terribly exciting, the words 'Hello World!' would be displayed\
    \ in the Terminal. The echo command is responsible for outputting words after\
    \ it in the Terminal, so whatever you can make the command output to stores.\n\
    - **STEP 9**: Think of echo as the BASIC print command. It displays text, or variables\
    \ that are stored in the system, such as the current date. Try this: `echo Hello\
    \ World! Today is $(date)`.\n- **STEP 10**: Note: `$(date +A)` is calling the\
    \ variable that stores the current date of your day.\n"
  mdcn: "\n\n# Linux 技巧与妙招\n\n正如你所看到的，Linux 终端是一个非常独特的环境。通过安装一些额外的应用程序，并结合一点命令知识，就可以完成许多不可思议且往往奇特的任务。\n\
    \n## 执行命令\n\n世界上有无数的 Linux 技巧、秘密、黑客技巧和妙招。有些非常古老，源自 Linux 的传统，而另一些则是 Linux 传说中近期添加的内容。这里有我们最喜欢的十个技巧。\n\
    \n### 彩蛋\n文本编辑器 Emacs 是一款非常出色的软件，但它还包含一个隐藏的彩蛋！你知道吗？在安装了 Emacs 的情况下（`sudo apt-get\
    \ install emacs25`），切换到终端会话并输入：\n```bash\nemacs -batch -l dunnet\n```\n\n### 终端浏览\n\
    是否曾经想过从终端浏览互联网？虽然不是特别实用，但这是一个非常引人注目的现象。要这样做，请输入：\n```bash\nsudo apt-get install\
    \ elinks\n```\n\nDunnet 是 Ron Schnell 在 1982 年编写的一款文字冒险游戏，自 1994 年起一直隐藏在 Emacs\
    \ 中。\n\n输入你想要访问的网站。\n\n### 月球车\n基于 1982 年的经典街机游戏《月球巡逻》（Moon Patrol），月球车在 1985\
    \ 年出现在家用电脑上，并备受赞誉。它是一款非常棒的雅达游戏，通过输入以下命令可以在 Linux 终端中运行：\n\n```bash\nsudo apt-get\
    \ install moon-buggy\n```\n\n### 让雪落下\n终端控制台可能会任何一天下雪。如果你感兴趣，请输入：\n\n```bash\n\
    wget https://github.com/semtek/15058483/raw/7/d024716ea57e69fb52632fee09f4427353164a2/snowjob.job\n\
    chmod +x snowjob.job\n```\n\n# 内存大户\n\n删除一个文件，可能会消耗系统的大部分内存。查看内存大户，只需输入：\n\n```bash\n\
    ps aux --sort -rnk 4\n```\n这将根据内存使用情况对输出进行排序。\n\n# BBS\n在拨号连接时代，在线世界是由公告板（BBS）组成的。这些系统一直是用户聊天、交换代码、玩游戏的聚集地，通过\
    \ Telnet，我们仍然可以连接到一些活跃的 BBS。\n\n```bash\ntelnet startbestarrars.dyndns.org\n```\n\
    有无数 BBS 可用，你可以查看 https://www.telnetbse.com/bbs/list/ 获取更多信息。\n\n# 彻底粉碎\n当你想要删除整个具有树形结构的目录（或文件夹）时，拥有正确软件的人可以恢复它。然而，要安全且永久地删除文件：\n\
    \n```bash\nmkdir -p New-Dir/\n# subfolder1, subfolder2, subfolder3, subfolder4\n\
    shred -zu FILENAME.txt\n```\n这将创建一个包含四个子文件夹的 New-Dir。将 FILENAME 替换为文件名。\n\n# ASCII\
    \ 艺术\nASCII 应用于某些图像时会非常醒目。但这很难实现。你可以使用 img2txt 从图像创建一些很棒的 ASCII 艺术：\n\n```bash\n\
    img2txt FILENAME.png\n```\n将 FILENAME 替换为系统中实际的文件。\n\n# 忘记的命令\n想要记住所有的 Linux 命令并不容易。坦率说，我们可以使用\
    \ apropos 来帮助。只需使用它，并带有描述：\n\n```bash\napropos \"copy files\"\n```\n(1) 复制文件和目录\n\
    (2) 复制文件和目录\n(3) 复制文件并设置属性\n(1) 重命名文件\n(2) 在标准输出中写入注释，编辑并重命名\n(3) 重命名\n\n# 使用终端\n\
    # Linux 与大爆炸\nLinux 是碰撞的粒子，因此我们可以理解宇宙是如何运作的。\n\n# 你知道吗...\nLinux 是大型对子对撞机背后科学的核心吗？通过将\
    \ Red Hat 和 CentOS（一个基于 Red Hat 核心构建的超稳定发行版）作为基础，欧洲核研究中心（CERN）的聪明人们开发了多个不同版本的自己的发行版来协助各个方面。最著名的是\
    \ SLC，也称为 CERN。据报告，有超过 6000 个系统正在运行，超过 15000 个正在运行。\n\n# 创建 Bash 脚本 – 第一部分\n\n\
    ## 脚本编写\n脚本仅仅是 Bash 将运行以完成特定任务的一系列命令。它们可能非常复杂，取决于具体情况。最终，你将在终端内并配合文本编辑器工作，但为了方便起见，我们将通过以下方式进行示例：\n\
    \n- **第 1 步**：有几种文本编辑器我们可以创建 Bash 脚本；Nano、Vim、GNU Emacs 等。根结底取决于个人偏好。使用 Nano 纯粹是为了方便在截图中读取脚本。\n\
    - **第 2 步**：首先，在你开始编写任何脚本之前，你需要创建一个文件夹，将所有的脚本都放在里面。这将我们的工作文件夹，如果你需要，你可以在这里创建子文件夹。\n\
    - **第 3 步**：让我们从简单的脚本开始，向终端输出一些内容。输入 `nano helloworld.sh`。这将启动 Nano 并创建一个名为 helloworld.sh\
    \ 的文件。在 Nano 中输入以下内容：\n  ```bash\n  #!/bin/bash\n  echo Hello World!\n  ```\n\
    - **第 4 步**：保存文件并返回终端。\n- **第 5 步**：`#!/bin/bash` 行告诉 shell 你将使用什么。井号（#）表示注释行，系统会忽略它；感叹号（!）表示跳过命令，并将强制脚本将该行作为命令执行。这被称为\
    \ Shebang（井号）。\n- **第 6 步**：当你再次输入 `ls` 时，你可以看到 helloworld.sh 现在已经从黑色变成了绿色，这意味着它现在是一个可执行文件。运行脚本，换句话说让它执行你输入的内容：`./helloworld.sh`。\n\
    - **第 7 步**：你可以点击 Save 保存文件，并返回终端。要让任何脚本变得可执行并能够修改权限，请执行 `chmod +x helloworld.sh`。你应该对创建的每个脚本都这样做。\n\
    - **第 8 步**：虽然这并不非常有趣，但“Hello World!”单词将显示在终端中。echo 命令负责输出其后面的单词，因此无论你让命令输出什么，它都会存储。\n\
    - **第 9 步**：将 echo 想象成 BASIC 的打印命令。它显示文本或存储在系统的变量，例如当前日期。尝试：`echo Hello World!\
    \ Today is $(date)`。\n- **第 10 步**：注意：`$(date +A)` 正在调用存储今天日期的变量。\n\n"
