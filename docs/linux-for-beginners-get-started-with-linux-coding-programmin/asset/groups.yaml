    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_78_2.png)


    ## 超越树莓派


    ### PI、Linux 与编码


    树莓派 ARM 处理器的灵活性意味着它能够运行除默认树莓派操作系统之外的其他操作系统。如果坚持使用 Linux，你可以安装 MATE、PiDA（一个基于 Fedora
