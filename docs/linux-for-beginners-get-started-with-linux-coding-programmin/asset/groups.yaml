    Linux 用户密码。

    - **第 4 步** VirtualBox 增强功能光驱图标在桌面上，右键点击它，向下滚动到“菜单”（Menu），点击“客户”（Guest）。现在您可以通过点击“菜单”、左侧栏底部的图标，然后点击“重启”（Restart）按钮来重启
    Linux Mint。这将重启 Mint 并解决问题。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_29_1.png)


    30 www.pcipubications.com


    # 菜单上的 CINNAMON


    现在 Virtualbox 的软件渲染问题已经解决了，让我们看看 Mint 菜单及其工作原理。请记住，这仅适用于 Mint Cinnamon，其他发行版的视图和行为会有所不同。


    - **第 1 步** 首先，您可能已经注意到了登录 Linux Mint 时弹出的“欢迎屏幕”（Welcome Screen）。花点时间浏览这些选项，阅读“第一步”（First
    Steps）等。当需要时，点击窗口右上角的“X”关闭它。

    - **第 4 步** 再次打开“菜单”，但这次将鼠标指针悬停在“图形”（Graphics）上，然后点击“GNU 图像处理程序”（GNU Image Manipulation
    Program）。GIMP 是一个强大的图像应用，效果与 Photoshop 一样，但需要花一点精力获取。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_30_0.png)


    - **第 2 步** 增强功能光驱包含 Virtualbox 的驱动程序，包括虚拟硬件。当它加载时，您将收到一个“软件需要运行”的通知框，带有两个选项：“取消”（Cancel）和“运行”（Run）。点击“运行”按钮并输入您的
    Linux 用户密码。

    - **第 5 步** 如果您在寻找特定的应用，请搜索“菜单”（Menu）。这适用于大多数情况，无论您输入的是什么内容。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_30_1.png)


    - **第 3 步** 就像任何优秀的文件管理器一样，如果您右键点击任何文件或文件夹，您将获得丰富的选项。在 Cinnamon 的情况下，默认允许您根据文件类型播放或查看文件。

    - **第 6 步** 悬停在任何列表上，右键点击将显示选项：“添加到面板”（Add to Panel）、“添加到桌面”（Add to Desktop）。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_30_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_30_3.png)


    # 导航 Cinnamon 桌面


    每个桌面环境的行为都与众不同。有些发行版提供可以自定义的桌面组件，而另一些为了保持整洁的外。让我们看看 Cinnamon 桌面提供了什么。


    # 点缀色彩


    Cinnamon 桌面环境是风格与性能的完美结合。它有很多优点，这也是为什么它如此受欢迎的原因。


    - **第 1 步** 通过双击“计算机”（Computer）开始探索 Cinnamon 桌面。这将打开 Nemo， Cinnamon 使用的文件管理器。“计算机”将打开根文件系统，并访问光驱（如果有）、硬盘和核心
    Linux 文件系统。

    - **第 3 步** Nemo 具有许多功能、视图等，方便您导航和管理文件。例如，如果您在“图片”文件夹中有任何图像，可以使用 Nemo 右下角的滑块来调整图标的缩放级别。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_31_0.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_31_1.png)


    - **第 2 步** Linux 文件系统对于原来的 Windows 用户来说可能看起来很奇怪，直到您对它的工作原理更加了解，我们建议您关注桌面上的“主目录”（Home）图标。这里是与用户账户相关的所有内容：您存储图片、视频、音乐、文档、下载项目的地方。

    - **第 4 步** 就像任何优秀的文件管理器一样，如果您右键点击任何文件或文件夹，您将获得丰富的选项。在 Cinnamon 的情况下，默认允许您根据文件类型播放或查看文件。


    '
