    # Say Hello to Linux


    # # Why Linux?


    For many of its users, Linux means freedom. Freedom from the walled garden approach
    of other operating systems, freedom to change and use the OS as you please and
    freedom from any form of licensing or payment. There''s a lot more to Linux than
    you might think.


    # FREE AND OPEN


    Linux is a fantastic fix for those who want something different. The efficiency
    of the system, the availability of applications and stability are just a few good
    reasons.


    The first thing you need to know is that there is no such system called Linux.
    Linux is in fact the operating system kernel, the core component of an OS. When
    talking about Linux what we, and others, are referring to are one of many distributions,
    distros, like Ubuntu, Fedora, Debian, Debian, the list goes on. Each of these
    distros offers something little different for the user. While each has a Linux
    kernel at its core, they provide the user with a different looking desktop, different
    ways in which to use the system and more apps installed and a slightly different
    look and feel throughout the entire system. However, the centre lies Linux, which
    is why we call it Linux.


    Linux works differently to Windows or macOS. It''s free for a start: free to install
    on as many computers as you like, free for an unlimited amount of time and to
    free programs and applications. This free to use element one of the biggest draws
    for the developers. Linux can be customized more than a Mac considerably, as a
    user, to gamer or someone who wants to put an older computer to use, can quickly
    download a distro and get it in a matter of minutes.


    Linux is a great operating system to which start coding.


    Alongside the free to use aspect some level of freedom to customise and mould
    the system to your own. Each of the available distros available on the Internet
    have certain ''spin'',


