    # # TERMINAL VS UPDATE MANAGER?


    Use the Terminal to update and upgrade the Update Manager, regardless of the distro
    you''re using! Some users prefer using the Terminal to update their Linux systems
    and accompanying apps, but in that it''s better. However, that''s not the case.


    Using the Terminal, apt-get doesn''t handle dependencies between versions of packages,
    so if a package has its dependencies from one version to another, then the upgrade
    is held back.


    The Update Manager, or Software Manager (depending on the distro), often phases
    its updates and those packages


    with changed dependencies for updating. However, and this is true, sometimes it
    doesn''t.


    It bolts down the development of the package being updated and the repositories
    where the update is classified as on point of view of the user, if you update
    and upgrade using both the Terminal and the Update Manager regularly, then you
    will be up to date as possible, and get the essential and stable versions of the
    software. If you''re looking for cutting edge package updates, then it''s best
    for a rolling release distro.


