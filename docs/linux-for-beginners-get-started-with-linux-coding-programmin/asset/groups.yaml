    - The command cd allows you to change your directory.


    - L shows the files in your current directory.


    - Mv moves files to a different location or renames.


    - Cp is used to copy files.


    - Chmod changes the permissions of a file.


    - Rm removes- or deletes files or directories.


    - Pwd prints the full pathname of the current directory.


    - Clear clears the screen. This is equivalent to typing Ctrl+L.


    - Short for "make directory", mkdir is used to create directories, if the specified
