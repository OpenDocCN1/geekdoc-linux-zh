    Python 模块可以连接到树莓派的 40 路 GPIO，允许你为任何 HAT（硬件顶层扩展）设备创建内容。


    这种组合使得树莓派成为极佳的操作基础，不仅可以了解 Linux，还能在 Linux 中使用它。Raspian 基于 Debian，能够运行此书中列出的任何终端命令，因为
    Linux 甚至 Ubuntu 也是基于 Debian 的。由于这一切的成本非常低，你既可以拥有常用的 Windows 或 Mac 电脑，又拥有一台树莓派作为无头电脑（一个供电但不需要连接键盘、鼠标或显示器的设备，你可以连接到它），通过它进行连接并学习如何使用
