    \ applet configuration）\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_32_1.png)\n\
    \n## 第 7 步\n如果在 Cinnamon 桌面任何地方右键点击，你会看到一组选项，允许你以不同的方式进一步添加或编辑桌面内容。它与 Windows\
    \ 非常相似，这就是为什么 Mint 是一个很好的选择。\n\n## 第 10 步\n简而言之，Linux Mint Cinnamon 可以配置得非常不凡。关于它可以有多好以及能变成什么样，有很多例子。你可以根据需要变得复杂或简单，添加不同的组件和动画，或者仅仅保持简洁易读。\n\
    \n- 创建文件夹（Create Folder）\n- 创建新文档（Create New Document）\n- 添加桌面组件（Add Desklets）\n\
    - 修改桌面背景...（Change Desktop Background...）\n- 创建新启动器...（Create a new launcher...）\n\
    - 在终端打开（Open in Terminal）\n- 以 Root 身份（Open as Root）\n- 自定义（Customise）\n- 粘贴（Paste）\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_32_2.png)\n\n## 了解 Linux\n\n## 安装 Linux\
    \ Mint 后的10件事\n\nLinux Mint 是一个开箱即用的精致发行版，但与大多数 Linux 发行版一样，可以通过一些调整来改进它的工作方式。虽然这些是\
    \ Mint 特有的调整，但也适用于其他发行版。\n\n## Linux 调整（LINUX TWEAKS）\n\n这些安装后的操作某些是非常建议的，而另一些只是实用的补充，用于调优系统或添加自定义。\n\
    \n- **第 1 步** 第一个也是最重要的安装后操作是更新系统。点击桌面右下角时间和日期旁面板上的图标。\n\n- **第 3 步** 点击 OK 按钮，你可以看到几个待安装的更新。但在更新之前，点击蓝色\
    \ OK 按钮切换到本地镜像。这会打开“软件源”选项。在镜像部分的“主”（Main）和“基础”（Base）下拉菜单中，选择一个距离你当前位置最近的服务器。\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_33_0.png)\n\n- **第 2 步** Linux Mint\
    \ 提供了三个层级的更新方法：“不要弄坏我的电脑”、“优化稳定性与安全”以及“始终更新一切”。建议选项是“优化稳定性与安全”，它只更新安全的、必要的补丁，不会影响核心操作系统的关键元素。阅读描述但选择中间的那个，这是推荐的。\n\
    \n- **第 4 步** 点击“更新缓存”按钮并清除“软件源”窗口。在“更新管理器”中，按回车并输入密码。更新将自动安装并重新启动更新管理器，显示大致更新时间。点击“安装”、OK\
    \ 以及任何消息并等待完成。\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_33_1.png)\n\n## 安装\
    \ Linux Mint 后的10件事\n\n第 5 步 更新按级别分级，低级更新，第 5 级是危险的。我们的建议保持在 3 个左右的更新；关于覆盖配置文件的消息，点击“回复”。对于软件问题和非\
    \ VirtualBox 缺少驱动的问题，使用菜单并在搜索框中输入“driver”。\n\n第 8 步 当被要求接受更改时，输入 Y；当要求配置 libdvd\
    \ 时也是如此。确保按下 OK 并按回车，然后对任何后续问题回答 Yes。接下来，仍在终端中：`cat /proc/sys/vm/swappiness`，结果应为\
    \ 6；如果你的电脑内存小于 4GB，则输入：`sudo edit /etc/sysctl.conf`。\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_34_0.png)\n\
    \n第 6 步 点击搜索结果中出现的“驱动管理器”应用并输入密码。Mint 需要一些时间来分析可用内容，并为你提供检测到的硬件的驱动程序选择。对于带有界面的驱动（如软件渲染），选择使用最新的“推荐”显卡驱动程序。\n\
    \n第 9 步 此项调整有助于加速内存小于 4GB 的系统。滚动到刚打开的文件末尾并添加以下行：\n`# Decrease swap usage to a\
    \ more reasonable vm.swappiness=10`\n\n点击文件 > 保存，然后退出。重启 Linux Mint，你应该注意到性能有轻微延迟。\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_34_1.png)\n\n第 7 步 如果在 Cinnamon 桌面任何地方右键点击，你会看到一组选项，允许你以不同的方式进一步添加或编辑桌面内容。它与\
    \ Windows 非常相似，这就是为什么 Mint 是一个很好的选择。\n\n第 10 步 当被要求接受更改时，输入 Y；当要求配置 libdvd 时也是如此。确保按下\
    \ OK 并按回车，然后对任何后续问题回答 Yes。接下来，仍在终端中：`cat /proc/sys/vm/swappiness`，结果应为 6；如果你的电脑内存小于\
    \ 4GB，则输入：`sudo edit /etc/sysctl.conf`。\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_34_2.png)\n\
    \n"
