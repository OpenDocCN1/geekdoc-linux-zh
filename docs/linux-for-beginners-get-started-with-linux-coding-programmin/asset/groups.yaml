    # Install Apps via the Terminal – Part 2


    Most of the time you''ll get to install apps from the Terminal using the standard
    apt-get command. However, sometimes an app demands a little more work. This means
    installing an app from its source code, which isn''t as scary as it first sounds.


    # FROM THE SOURCE


    The commands you''ll need to become familiar with are Configure, Make and Install.
    You''ll find a lot of apps use from source, so it''s certainly a skill worth investing
    time in.


    STEP 1  Source code files for Linux usually come in the form of .TAR.GZ or .TAR.B2.
    Both are compressed files holding all the code needed to ''make''. Start off this
    tutorial by creating a new folder in Home: mkdir vim.


    STEP 3  The widget command retrieves content from the internet, in this case the
    BZ2 file for Vim. According to Mint''s system colour theme, the file should be
    displayed in red.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_51_0.png)


    STEP 2  Vim, by the way, is an advanced text editor which will help us edit code,
    cd Vim, then from within the new Vim folder, enter the following command in the
    Terminal: wget ftp://vim.org/pub/unix/vim-7.4.tar.bz2


    STEP 4  We need to configure the contents of the file, now so: type tar -xf vim-7.4.tar.bz2
    into the Terminal. You can press the Tab key to auto-fill the main file name.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_51_1.png)'
