    ## Pi x Linux = The Perfect Combination


    The Raspberry Pi is a remarkable piece of hardware, and to drive its potential
    it needs a remarkable operating system. Frankly, Linux is the default and recommended
    OS of choice for the Pi, and they make a mighty team.


    When the Raspberry Pi was in its developmental stages, its designers needed to
    ensure that they were creating a piece of hardware that could offer more than
    simply a cheap, small computer.


    The Pi needed to be flexible with what it could do, it needed room to grow into
    more ambitious project concepts and ideas, and it needed to do so as easy to use
    as possible. The goal was to create a universal learning platform, that students
    of any age could tinker with while learning new concepts such as programming,
    electronics, and computing. Naturally, once the hardware was developed, the only
    choice of operating system was of course, Linux.


    The versatility of Linux is legendary. This incredible core is so malleable that
    it can be steered toward any aspect of computing, from robotics to space industry
    to terrestrial engineering; education and science, manufacturing and the Internet.
    Think of an industry, and you will likely find a Linux installation somewhere
    in the background keeping it all together.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_77_0.png)


    Raspian is the recommended operating system for the Raspberry Pi, a customised
    Debian-based distribution that comes packed with a collection of useful tools
    for coding, electronics, and general desktop computing duties. Alongside the apps
    are preloaded modules to help get the most out of programming languages you decide
    to learn and use, as well as hardware modules that will enable you to power and
    use the hardware specific items unique to Pi. For example, there are Python modules
    that connect to the Raspberry Pi''s 40-GPIO, allowing you to create content for
    any of the Hardware Attached on Top devices.


    This combination is what makes the Raspberry Pi an excellent base for operations
    to not only know, but also use in Linux. Raspian, being Debian-based, will be
    able to run any of the Terminal commands listed in this book, as Linux and even
    Ubuntu are also Debian-based. And since it all costs very little setup, you will
    be able to have both your regular, Windows or mac computers, and have a Raspberry
    Pi as a headless (a powered device that doesn''t need a keyboard, mouse or monitor
    attached, as you can connect to it) computer from which you can connect and learn
    how to use Linux and how to code.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_77_1.png)


    ## Pi x Linux = The Perfect Combination


    ### WHICH PI?


    There are several Raspberry Pi models available, each offering something different
    from the others. The most recent Pi released is the Raspberry Pi 4 B, and this
    model is slightly more expensive than the other examples, it is the most powerful
    and feature-rich Pi.


    Overall, its is probably best to start experimenting with the Pi using the Pi
    4 B, then moving on to the other models as you develop your skills and focus on
    a particular project, with the need to use the Pi Zero models, with a smaller
    footprint and WiFi connectivity.


    Pi 3 A+ was released in November 2018 and improves over the previous Model A.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_78_0.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_78_1.png)


    The Raspberry Pi 3 Model B+ is one of the best Pi models.


    The Raspberry Pi Zero W with built-in Wi-Fi and Bluetooth, is a great project
    Pi.


    Of the Pi models available, we recommend the Pi 4 Model B, Pi 3 B+, and Pi Zero
    W.


