    # 桌面环境


    Linux Mint 提供了几个不同的版本，或口味：Cinnamon、MATE 和 Xfce；这些版本也有 32 位和 64 位之分。这一切到底意味着什么呢？你在安装时应该选择哪个版本呢？


    ## 选择哪个 MINT？


    桌面环境（Desktop Environment）是你用于与 Linux 系统交互的图形化界面。就像 Windows 10 的图形桌面也被称为 Fluent
    设计（Fluent Design）。


    Linux Mint 提供了多种发行版版本：Cinnamon、MATE 和 Xfce。虽然对于初学者来说这听起来可能有些困惑，但每个可用版本都包含相同的 Linux
    结构和内核。内核是操作系统的核心，处理软件和硬件之间所有的指令。


    每个版本都是一个略有不同的桌面环境，即你用于与操作系统交互的图形化用户界面（GUI）。每个桌面环境都使用不同的应用程序来访问或使用系统，例如使用文件管理器来浏览操作系统的文件结构，或者启动其他程序的方式。再次强调，尽管核心的生产力工具、视频和图形套件是相同的，并且以相同的方式运行。


    那么为什么要费力尝试不同的桌面环境呢？简单来说，这取决于个人喜好。有些用户偏好 MATE，因为 MATE 是经典 GNOME 2 环境的分支，是一个稍微现代一点的环境，可以在近期硬件上运行，并具有一些尖端功能。Xfce
    是一个更现代的环境，由于其对可用系统资源的占用极低，它可以在旧硬件上运行。


    简而言之，Cinnamon 是 Linux Mint 的旗舰桌面环境。MATE 与更多种硬件兼容兼容。例如，Windows 只提供一种桌面环境供使用，而 Linux
    提供了许多。因此，Linux Mint 选择为用户提供丰富的选择。


    ## 一抹 Cinnamon 色彩


    Cinnamon 除了外观和感受之外，还有许多优点，尽管这些也是重要的因素。在这里，我们列出了几个功能，帮助你判断它是否适合你。


    ### 特色功能 1


    它在更现代的系统上表现出色，但比以前稳定得多，而且不再是以前那样的资源大户了。因此，如果你在使用旧电脑安装 Linux Mint，切不要被 Cinnamon
    劝退了。


    ### 特色功能 2


    Cinnamon 具有可配置的“热角”（Hot Corners），桌面的每个角落都可以被点击以执行特定任务，例如显示工作区或运行命令。热角有助于在不同视图之间高效切换。


    ## MATE


    MATE 是一个简单易用、快速且稳定的 DE。与 Cinnamon 相比，它看起来有点过时，但仅是表面如此。有很多理由喜欢 MATE：


    ### 特色功能 1


    MATE 是旧电脑的优秀桌面环境。它对硬件的支持通常比 Cinnamon 更好，但同样能够提供优秀的桌面体验。


    ### 特色功能 2


    由于其高度可配置的特性，MATE 可以自定义到很高的程度。有许多可用选项，包括 Compiz 设置。


    ## 无胆桌面 (Cholesterol Free Desktop)


    Xfce 起于 1996 年的通用桌面环境（CDE）。从那时起它发生了变化，现在简单称为 Xfce，绰号为“无胆桌面”。


    ### 特色功能 1


    Xfce 确实是一个快速桌面，并带来了 Linux 的最佳体验。事实上，我们为了将其安装到新电脑上已经花了几百个字。


    ### 特色功能 2


    因为它是轻量级的，这意味着 Xfce 并不是一个完整的操作系统。就像其他环境一样，你可以使用最新的 Firefox、Libreoffice、VLC、Gimp
    以及下载客户端。


    ## 哪个发行版？


    到为止我们主要看了 Linux Mint。事实上，有数千个发行版可以下载和安装，所以你应该选择哪一个？


    ### 发版切换 (Distro Hopping)


    发行版切换是社区中的一个术语，指的是那些从不坚持单一发行版的人，从一个跳到另一个。发行版切换并没有错，它是一种寻找符合你口味元素的好方法。例如，Linux
    Mint 是一个理想的起点。它易于安装和使用，包含了日常所需的所有软件。继续进行，随着你更有信心，你可能会发现 Ubuntu 或 Debian 比较受青。考虑到
    Linux Mint 的巨大价值，我们建议你慢慢增加你的技能。你可能会发现切换到另一个完全不同的发行版。例如，Tails 是一个为匿名而设计的发行版。Kali
    是为了安全设计的，包含了许多种工具。


    '
