    # Getting to Know Linux


    We''ve used Linux Mint as a guideline here, as it''s an easy to use distro and
    perfect for former Windows users. It''s also one of the most developed and well
    documented Linux distros as well as having some fantastic configuration options.


    In this section, we introduce the Linux Mint Cinnamon Menu and Desktop Environment,
    how it works and what you can do to customise it. Want to create another user
    or even discover how to become anonymous online? Then read on.


    # Getting to Know Linux


    ## Introduction to the Cinnamon Menu


    Now that you have Linux installed it''s time to have a good look around. First
    though, if you''re using Virtualbox you''ll have a notification regarding Software
    Rendering, here''s how to fix it.


    ## CINNAMON VIRTUALBOX FIX


    You''ve already looked at some functions, .insert, .remove, and .pop but there
    are also functions that can be applied to strings.


    - **STEP 1** Before we begin, we''re assuming you''re having this issue within
    Virtualbox. The Software Rendering message appears in the top right of the desktop.
    To fix this, click on Devices in the Virtualbox window, followed by Insert Guest
    Additions CD.

    - **STEP 3** After a moment or two you''re automatically dropped into a command
    line view, called the Terminal in Linux. This details the installation of the
    new VirtualBox drivers, removing any old drivers it has detected, and installing
    the latest versions. It won''t take long and when it''s done you will be asked
    to use the terminal.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_29_0.png)


    - **STEP 2** The Guest Additions CD contains drivers for Virtualbox, including
    the virtual hardware. When it''s loaded, you''ll get a ''software needs running''
    notification box with two options, Cancel and Run. Click the Run button and enter
    your Linux user password.

    - **STEP 4** The VirtualBox Guest CD icon is on the desktop, so right-click it
    and then scroll down to the Menu, click Guest. You can now restart Linux Mint
    by clicking the Menu, the bottom icon in the strip to the left, then the Restart
    button. This reboots Mint and the problem is fixed.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_29_1.png)


    30 www.pcipubications.com


    # CINNAMON ON THE MENU


    Now the Software Rending Issue for Virtualbox is out of the way, let''s take a
    look at the Mint Menu and how it works. Remember, this is just for Mint Cinnamon,
    other distros look and behave differently.


    - **STEP 1** First off, you may have already noticed the Welcome Screen that pops
    up when you login to Linux Mint. Take a moment to browse through the options,
    read the First Steps and so on. When you need to, click the X in the top corner
    of the window to close it.

    - **STEP 4** Open up the Menu again but this time hover the mouse pointer over
    Graphics, then click on GNU Image Manipulation Program. GIMP is a powerful image
    app as effective as Photoshop but requires a little work to get.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_30_0.png)


    - **STEP 2** The Guest Additions CD contains drivers for Virtualbox, including
    the virtual hardware. When it''s loaded, you''ll get a ''software needs running''
    notification box with two options, Cancel and Run. Click the Run button and enter
    your Linux user password.

    - **STEP 5** If you''re looking for a particular app, search the Menu. This works
    with most things, regardless of what you type.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_30_1.png)


    - **STEP 3** Just like any good file manager, if you right-click any of the files
    or folders within you get a wealth of options. In the case of Cinnamon, the defaults
    allow you to play or view a file depending on what type of file it is and copy,
    cut, delete, compress, rename, send via email and view its properties.

    - **STEP 6** Hover over any of the lists right-click to be presented with options:
    Add to Panel, Add to Desktop, Add to.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_30_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_30_3.png)


    # Navigating the Cinnamon Desktop


    Each desktop environment behaves differently to that the next. Some DEs offer
    widgets that can be customised on the desktop, others instead for a clean, sharp
    look to keep everything running. Let''s see what the Cinnamon desktop has to.


    # A TOUCH OF SPICE


    The Cinnamon desktop environment is a great blend of style and performance. There''s
    lots to like about, which is why it''s a popular DE.


    - **STEP 1** Begin exploring the Cinnamon desktop by doubleclicking the Computer.
    This brings Nemo, the file manager used in Cinnamon. The Computer opens up the
    root file system, with access and views to the optical drive (if you have one),
    hard drive and core Linux file system.

    - **STEP 3** Nemo has many different features, views and so that you can navigate
    and manage files. For example, if you have any images in the Pictures folder,
    you can select the icon zoom level for the images by using the slider located
    in the bottom right of Nemo, Adjust Zoom Level.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_31_0.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_31_1.png)


    - **STEP 2** The Linux file system can appear confusing to a former Windows user,
    until you''re a little more knowledgeable about how it works, we''d recommend
    you concentrate on the Home icon on the desktop instead. Here is everything relating
    to your user account: where you store Pictures, Videos, Music, Documents, Download
    items etc.

    - **STEP 4** Just like any good file manager, if you right-click any of the files
    or folders within you get a wealth of options. In the case of Cinnamon, the defaults
    allow you to play or view a file depending on what type of file it is and copy,
    cut, delete, compress, rename, send via email and view its properties.

