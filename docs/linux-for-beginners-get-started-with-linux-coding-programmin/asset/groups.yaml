    # Fun Things to do in the Terminal


    Despite the seriousness of an operating system, the Linux community are certainly
    no strangers to a bit of fun. The developers over the years have created and inserted
    all manner of fun and odd elements into the Terminal.


    # TERMINAL FUN


    You''re be exclusively in the Terminal for these next two sections, so start warming
    up your fingers. After all, work and no play... as the saying goes.


    +   STEP 1 The first command we''re going to use is sl, it''s not installed by
    default so enter: sudo apt-get install sl. The command can be run with sl and
    when executed will display a Steam Locomotive across the screen (hence ''sl'').
    Entering LS, note the upper case, also works.


    +   If you''ve ever fancied having the computer read random fortune out to you,
    then you''re in luck. Most distros require you to install the app, however Linux
    Mint differs by having it already pre-loaded. All you need to do is enter the
    command fortune into the Terminal, and enjoy.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_59_0.png)


    +   STEP 2 Fans of Star Wars even get a fix when it comes to the Terminal. By
    linking to a remote server via the telnet command, you come Episode IV. A New
    Hope being played out, in ASCII. To view this spectacle, enter: telnet towel.blinklights.nl.


    +   STEP 4 The rev command is quite interesting, and at first seems what a kinda
    useless to the OS. However, it can be used to create some seemingly unbreakable
    passwords. Enter: rev, now type some text, when you press Enter, everything is
    in reversed. Press Ctrl+C to exit.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_59_1.png)'
