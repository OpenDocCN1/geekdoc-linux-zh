    # Command Line Quick Reference


    When you start using Linux full time, you will quickly realise that the graphical
    interfaces of Ubuntu, Mint, etc. are great for many tasks but not great for all.
    Understanding how to use the command line not only builds your understanding of
    Linux but also improves your knowledge of coding and programming in general. Our
    command line quick reference guide is designed to help you master Linux quicker.


    # TOP 10 COMMANDS


    These may not the most common commands used by everyone but they will certainly
    feature frequently for many users of Linux and the command line.


    +   - cd is one of the commands that you will use the most at the command line
    in Linux. It allows you to change your working directory. Use it to move around
    within hierarchies of the file system. You can also use cdir.


    +   - mv moves a file to a different location or renames a file. example mv file
    subnames the original file to sub, mv sub ~/Desktop does not rename it. You must
    specify a new filename to rename.


    +   - ls shows the files in your current directory. Used with certain options,
    it lets you see file sizes, file where created and permissions. For example, -l
    shows you the files that are in your home directory.


    +   - chmod changes the user or group ownership of each file. if owner (a name
    or numeric ID) is given, that changes the owner of each file, and file''groups
    are not changed.


    +   - cp is used to copy files and directories. For example, cp file sub makes
    an exact copy of the file you named and gives it the name sub. The first file
    will start with its original name.


    +   - chmod changes the permissions on the files listed. Permissions are based
    on a simple model. You can set permissions for user, group and world and you can
    set each other read, write, and execute to file.


    +   - pwd prints the full pathname of the current working directory (pwd stands
    for "printing working directory"). Note that the gnome terminal also displays
    this information in the title bar of its window.


    +   - rm removes deleted files or directories. The remove process unlocks a file
    in a filesystem from data on the storage device and marks as available by future
    uses. In other words, removing increases the amount of available space on your
    disk.


    +   - clear clears your screen if this is the terminal type and then in the environment
    of the terminal to figure out, how to clear the screen. This is equivalent to
    typing Control-L when using the bash shell.


    +   - short for "make directory", mkdir is used to create directories in a file
    system, if the specified file does not exist. exactly, mkdir creates a work directory.
    More than one directory may be specified when calling mkdir.'
