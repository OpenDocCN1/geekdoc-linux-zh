    Ubuntu 和 Mint 都提供了安装路径，并附带软件包帮助你起步。而 Arch 则是一个更加“精裸”的选择。Arch 致力于提供免费软件，其存储库包含超过
    50,000 个可安装的应用程序，包括多种不同的桌面环境，你可以将其与任何发行版配合使用。


    然而，所有这些努力的回报是你拥有了一个亲手创建的发行版。你的 Arch 发行版没有包含他人预装的所有不必要的文件和程序。它是由你为你量身定制的。


