    这些工具已经预先安装，用户可以对自己的网络进行渗透测试。曾经甚至出现过一个名为 Hannah Montana 的 Linux 发行版，但我们谈得越少越好。重点是，总有一个适合你的发行版。


    不用俗说，一旦你对 Linux 达到了相当高级的程度并成为一名合格的用户，你将需要扩展自己的技能，并基于 Arch、Debian 或其他发行版构建你自己的
    Linux 发行版。这涉及到大量的命令行知识，以及关于 Linux 系统如何工作以及与计算机硬件交互的知识。你需要对硬盘进行分区、安装驱动程序，并最终安装你想要的应用程序和软件。这需要时间，而且你将不断学到很多技能。


    奇怪的是，许多更高端的技术用户发现自己又回到了起点，使用像 Linux Mint 这样的发行版。主要原因通常是因为是一个简单的选择，而且环境稳定。如果你喜欢从内而外地构建系统，那么你并不总是想修复潜在的问题。我们大多数人更倾向于轻松的生活，特别是在技术方面，因此逻辑上的选择是选择一个既简单又强大到足以你想要的所有任务的发行版。


    然而，根结底，这完全取决于你自己的选择。你可能会在浏览教程后发现自己不喜欢 Linux Mint 或 Cinnamon 桌面，你可能更喜欢 Ubuntu、Debian
    或开源；这就是 Linux 的魅力所在。你可以自由更改你想要的，从一个切换到另一个，而不会受到成本或访问限制的惩罚。最终，你可以认为自己是一个技术用户，但永远不要认为自己是专家，毕竟一直在学习新东西。你可以从零开始构建自己的发行版，帮助其他用户解决问题，甚至可以在测试阶段为发行版的改进做出贡献。


    关于你喜欢哪种发行版问题的答案可以根据你的需要变得复杂或简单，只要它能完成你想让的任务，它就是完美的。


    | 应用 | Linux |

    |---|---|

    | 文档 | LibreOffice |

    | 图像 | LibreOffice Draw |

    | 图形 | LibreOffice Calc |

    | 互联网 | LibreOffice Impress |

    | 办公 | LibreOffice Writer |

    | 其他 | |


    ## 开始使用 Linux


    > “在开源世界中，你有权控制自己的命运。” – Linus Torvalds（Linux 内核开发者）


    ## 开始使用 Linux


    谈论 Linux 有多好固然言而易之，但如何把它安装到你的电脑上呢？安装 Linux 非常简单，但有几个选项供你选择。本节将介绍你如何下载 Linux ISO、将其安装在
    PC 上作为你的主操作系统，甚至包括如何安装虚拟环境。通过虚拟环境，你可以在继续使用主操作系统 macOS 的同时运行 Linux。感兴趣吗？继续阅读以了解更多。


    ## 在 Windows 上创建 Linux 安装程序


    在将 Linux 安装到电脑之前，你需要将下载的 Linux ISO 传输到 DVD 或 USB 闪盘。这将是一个运行环境，允许你在安装之前测试该操作系统，但首先你需要创建可启动的介质。


    ### DVD 可启动介质


    我们正在使用一台 Windows 10 电脑将 ISO 传输到 DVD。如果你使用的是 Windows 7 及更高版本的 Windows，该过程非常简单。


    - **步骤 1** 首先，找到你已经下载的 Linux ISO 镜像。你通常会在 Windows 7、8.1 和 10 的“下载”文件夹中找到它，除非你在保存时指定了不同的位置。

    - **步骤 2** 接下来，将一张可刻录的 DVD 光盘插入电脑的光驱器中。几秒钟后，在读取磁盘时，Windows 会弹出一个消息框询问对新插入的光盘进行什么，因为我们将使用内置的镜像刻录功能。

    - **步骤 3** 右键点击 Linux ISO，并在菜单中选择“刻录光盘映像”。根据 PC 的速度，可能需要几秒钟才会发生变化。不用太担心，除非超过了一分钟，那种情况下可能值得重启电脑并重试。运气好的，Windows
    光盘镜像刻录机将启动。

    - **步骤 4** 打开 Windows 光盘镜像刻录机后，点击“验证光盘”，然后点击“刻录”按钮。该过程可能需要几分钟，取决于你 PC 光驱的速度。一旦完成验证阶段，光驱器应该会自动为你识别磁盘。


