  - '[PAGE 41]


    # Becoming Anonymous Online


    The digital age has led to many great advances in communications; however, it
    has brought on a new age of spying and snooping. Most of us are not strangers
    to the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    # ANONYMITY WITH MINT


    While it''s virtually impossible to become totally anonymous online, you can take
    measures to ensure our privacy is at its best.


    +   STEP 1 Starting with the basics, use HTTPS instead of the standard HTTP when
    browsing. This means that anything that transmitted over HTTPS is secure (hence
    the S part at the end) and encrypted.


    +   STEP 3 Although using Google may seem like the obvious choice for a modern
    internet search, the company tracks all searches made by an individual. Instead,
    consider an alternative search engine, such as DuckDuckGo, a search engine that
    doesn''t store personal data or track you.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_0.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_1.png)


    +   STEP 2 When you''re browsing, consider using the Incognito or Private browsing
    modes in a browser. This disables your web history and cache, allowing you to
    browse without the details stored for later scrutiny by someone else. However,
    it doesn''t stop any data or search tracking.


    +   STEP 4 If you''re browsing on the Internet then consider installing some of
    the browser-plugins to enhance your privacy. For example, for Firefox use Ghostery,
    NoScript and Adblock Plus to block trackers, adverts and other data mining techniques.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_3.png)'
  - '[PAGE 42]


    # VPNS AND TOR


    The previous steps can aid your online privacy but to become anonymous a Virtual
    Private Network and Tor.


    +   - A VPN is a remote server, or client of servers, that establishes a connection
    with your computer. The result is that your computer''s identity on the Internet
    is hidden behind the VPN remote server; you could live in the UK Out to have an
    IP address (the computer online identity) belonging to Iceland.


    # How VPN works?


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_0.png)


    +   - When the download has finished, drop into the Terminal and enter the Downloads
    folder, cd Downloads/. Enter ls -lh to check if the tar.xz file is present, then
    tar -xf tor-browser-linux64-8.8.4_en-US.tar.xz (XF is updated, if your version
    is different Press Tab to autocomplete the tor-browser-filename). When the files
    are unpacked, use cd tor-browser-en-us~ to enter the new folder.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_1.png)


    +   - Most people pay a monthly or annual fee but it''s worth the expense. We
    use CyberGhost, www.cyberghost.com, which provides VPN connections for Windows,
    Mac, Mint (with any other Linux distro), Android and iOS devices. Details for
    each OS can be found at **www.cyberghost.com/hz/en-us/articles/21390329-Read-me-first**.


    +   - A quick install involves a couple of actions: a folder Browser and a file
    to start. Type, ./start-tor-browser.desktop. This command launches the Tor server,
    where you are offered two options: Connect or Configure. If not unsure, the Connect
    option will suffice. Connect when you''re ready.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_3.png)


    # Tor Browser


    Click "Connect" to adjust network settings. If you are in a censored country (such
    as East China, Turkey) or if you are behind a restrictive firewall, use a proxy.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_4.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_5.png)


    Another option is to use Tor. It is an open network that you can use to hide your
    IP address behind nodes around the world. It is available for Windows, Mac and
    Linux computers and is very easy to install and use. Start by navigating to **www.torproject.org/download/easy-package/**
    and clicking on the Download Linux 64-bit version.


    After connection, the Tor Browser is established. This is a customized version
    of Firefox and here you can securely browse the Internet without being viewed
    or tracked. Mixing both VPN and Tor makes for an extremely secure and private
    connection to online.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_6.png)


