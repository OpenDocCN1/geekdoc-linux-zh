    # 在 PC 上安装 Linux


    大多数发行版都以现场环境（Live Environment）的形式提供。在该环境中，你可以从创建的 DVD 或 USB 启动进入一个真实的、功能完整的发行版。让我们来看看它是如何工作的，以及你如何进行
    Linux 安装。


    ## UEFI BIOS


    统一扩展固件接口（UEFI）用于在 PC 启动过程中识别并保护。它取代了传统的 BIOS，但在安装 Linux 时可能会导致问题。


    - **第 1 步** 将你的 DVD 或 USB 闪存插入 PC，如果尚未关闭 Windows，请将其关闭。在本例中，我们将使用 USB 介质，但过程几乎相同。当提示进入
    SETUP 时，启动 PC 并按下相应的键，例如：F2、Del 或 F11。

    - **第 2 步** UEFI BIOS 有不同的版本，因此涵盖所有版本是不可能的。你需要寻找的是详细说明启动顺序（Boot Sequence）或启动模式（Boot
    Mode）的部分。在这里你可以选择关闭 UEFI 或选择 Legacy Secure Boot（传统安全启动）。大多数发行版都支持 UEFI，但退出它可能会很麻烦。

    - **第 3 步** 当 UEFI 切换到传统模式后，有两种进入现场环境的方法。第一种是通过你已经进入的 BIOS。找到 Boot Sequence，将第一个启动设备从原始设置（内部硬盘
    Internal HDD 或类似项）更改为 USB Storage Device（USB 设备，用于 USB 介质）或 DVD Drive（DVD 器）。

    - **第 4 步** 另一种是使用 Boot Menu（启动菜单）。通过它，你可以按下 F2（或类似的按键）显示启动选项列表，从那里选择合适的启动介质。现在你可以导航到
    Save & Exit（保存并退出）并选择“Saving Changes and Exit”（保存更改并退出）来保存 BIOS。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_21_0.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_21_1.png)


    # 安装 Linux


    现场环境启动后，使用选项将发行版安装到你的电脑上。观察周围，当你准备好后，寻找桌面上的 Install（安装）选项。


    - **第 1 步** 只要你已连接网络（如果没有，请先连接）并处于现场环境，双击桌面上的 Install Linux Mint 图标即可开始安装过程。其他发行版会显示它们的名称或其他名称，但过程是相同的。准备好后点击
    Continue（继续）。

    - **第 2 步** 虽然安装过程与大多数 Linux 发行版非常相似，但某些发行版在安装期间会提供不同的问题。通常，这些问题并不困难，不涉及复杂的技术，但诸如“安装第三方软件”之类的可能会让人困惑。在这种情况下，你可以继续，但如果不确定，请准备好一台连接了网络的设备以查询任何问题。

    - **第 3 步** 安装新操作系统时，建议擦除旧操作系统并用新系统替换它。当你到达安装过程的这一阶段时，请确保选了“Erase disk and install
    Linux...”（擦除磁盘并安装 Linux...）。注意：这会完全清除你电脑上的 Windows 10，请确保你已备份了所有个人文件和数据。

    - **第 4 步** 在安装过程开始之前，系统会询问你是否选择确保硬盘擦除是正确的。这是你最后退出的机会。如果你确定不介意擦除所有内容并重新开始 Linux
    Mint，点击 Continue。如果你需要将文件备份到磁盘/USB，请重启并重新开始。

    - **第 5 步** 最后，你会被要求设置用户名和密码。输入你的名称开始，以及 Computer Name（计算机名称），它是在网络上的标识名称。接下来选择
    Username（用户名），然后设置良好的密码。你可以自动点击 Login（登录）按钮，也可以暂时保留 Enter Home Folder（进入主文件夹）选项。

    - **第 6 步** 安装过程可能很快，可能会有更多问题要回答，也可能会根据你之前的答案简化 Linux 安装。最后你会被要求 Continue Testing
    the Live Environment（继续测试现场环境）或 Restarting（重启到新安装的操作系统）。如果你准备好使用 Linux，请点击 Restart
    Now（立即重启）。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_0.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_1.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_2.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_3.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_4.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_5.png)


    # 安装虚拟环境


    虚拟环境是一个模拟的计算机系统。使用虚拟机（Virtual Machine），你可以模拟标准 PC 并向其安装整个操作系统，而不会影响电脑上已安装的项目。这是使用
    Linux 的极佳方法，同时保留 Windows 10 作为主操作系统。


    ## 虚拟


    使用虚拟机（VM）会消耗电脑的资源：内存、硬盘空间、处理器占用率等。在开始之前确保你有足够的资源。


    - **第 1 步** 我们在本例中使用 VirtualBox，因为它是最容易上手的环境之一。访问 virtualbox.org 并点击“Download
    VirtualBox”。这将带你进入主下载页面。找到适用于你系统的正确主机（Windows 或 Mac，主机需已安装了正确的操作系统）并点击链接开始。

    - **第 2 步** 接下来，在 VirtualBox 下载页面找到 VirtualBox Extension Pack（VirtualBox 扩展包）链接。扩展包支持
    USB 设备以及其他可以使虚拟机环境更准确地模拟“真实”电脑的额外功能。

    - **第 3 步** 在下载好正确的包后，在安装它们之前，你需要确保你正在使用的电脑可以托管虚拟机。要这样做，请重启电脑并启用 BIOS。当电脑启动时，按下
    Del、F2 或进入 Setup 的任意键。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_23_0.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_23_1.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_23_2.png)


    - **第 5 步** 备份准备就绪并运行后，找到下载好的 VirtualBox 主程序并双击开始安装过程。准备好后点击 Next（下一步）。

    - **第 8 步** 在安装 VirtualBox 时，你的网络连接会中断一段时间。这是由于 VirtualBox 正在创建一个关联的虚拟网络连接，以便任何安装的虚拟机都能访问互联网，并利用网络资源访问电脑已建立的网络连接。接下来，点击
    Next 开始安装。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_24_0.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_24_1.png)


    - **第 6 步** 安装过程可能很快，可能会有更多问题要回答，也可能会根据你之前的答案简化 Linux 安装。最后你会被要求 Continue Testing
    the Live Environment（继续测试现场环境）或 Restarting（重启到新安装的操作系统）。如果你准备好使用 Linux，请点击 Restart
    Now（立即重启）。

    - **第 7 步** 这一部分可以保持默认设置，这样更简单。

    - **第 9 步** 备份准备就绪并运行后，找到下载好的 VirtualBox 主程序并双击开始安装过程。准备好后点击 Next（下一步）。

    - **第 10 步** VirtualBox 运行后，你可以安装 VirtualBox Pack。在 VirtualBox 加载扩展包时可能会有停顿，但只需点击同意条款即可。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_24_2.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_24_3.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_24_4.png)


    # 在虚拟环境中安装 Linux


    当 Oracle 的 VirtualBox 运行后，下一个任务是创建将要安装的虚拟机（VM）环境。此过程不会影响你当前安装的操作系统。


    ## 创建虚拟机


