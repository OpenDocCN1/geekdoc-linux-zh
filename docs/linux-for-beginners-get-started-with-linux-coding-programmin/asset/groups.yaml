- md: "\n# Linux Tips and Tricks\n\nAs you've seen, the Linux Terminal is quite an\
    \ exceptional environment. With a few extra apps installed, and a smidgen of command\
    \ knowledge, incredible and often strange ranges, things can be accomplished.\n\
    \n## TAKING COMMAND\n\nThere are countless Linux tips, secrets, hacks and tricks\
    \ out there. Some are very old, originating from Linux's heritage, while others\
    \ are recent additions to Linux lore. Here our favourite ten tips and tricks.\n\
    \n### EASTER EGGS\nEmacs, the text editor, is a great piece of software, however,\
    \ it also contains a hidden Easter Egg! Did you know? With Emacs installed (`sudo\
    \ apt-get install emacs25`), drop to Terminal session and enter:\n```bash\nemacs\
    \ -batch -l dunnet\n```\n\n### TERMINAL BROWSING\nEver fancied being able to browse\
    \ the Internet from the terminal? While not particularly useful, it is a fascinating\
    \ thing to behold. To do so, enter:\n```bash\nsudo apt-get install elinks\n```\n\
    \nDunnet is a text adventure by Ron Schnell in 1982, and hidden in Emacs since\
