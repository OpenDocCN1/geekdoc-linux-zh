    \ script would look something along the lines of: `~/bin/bash, then tar cvzf ~/backups/my-backup.tgz\
    \ will create a compressed file backup of the ~/Documents folder, with everything\
    \ in it, and put it in a folder called ~/backups with my name-backup.tgz.`\n\n\
    STEP 4 Once the ~/backups folder is created, we can now create a new subfolder\
    \ within it based on the Time Stamp variables you set. Adding `mkdir -p $dest/$d/$M/$Y`,\
    \ it's in here that you put the backup file relevant to that day/month/year.\n\
    \n```bash\n#!/bin/bash\nclear\n# Time stamp\nday=$(date +%d)\nmonth=$(date +%m)\n\
    year=$(date +%Y)\n\n# Folders\ndest=~/backups\nsource=\n\nif [ ! -d $dest ]; then\n\
    \  echo \"Backup folder does not exist! I am creating it...\"\n  mkdir -p $dest\n\
    fi\nmkdir -p $dest/$year/$month/$day\n```\n\nSTEP 2 While finally, we can make\
