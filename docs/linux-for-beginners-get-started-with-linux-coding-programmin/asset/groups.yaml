    # # Creating Users


    When you install Linux Mint it is configured for your console. While sharing a
    user account with the entire family is fine, there may come a time when you need
    to create separate users with their own unique Home folders.


    # NEW USERS


    Having different users means each user has access to or his/her own areas on the
    system. Documents, pictures, videos and so on are separate, with multiple users
    on other operating systems.


    +   * STEP 1 Click on the Linux Mint Menu and type ''users'' to begin searching
    for the relevant console. Choose Users and Groups enter for your password. The
    Users and Groups console is quite basic looking, and thankfully easy to use. At
    first, you can just see your username from when you installed Linux Mint.


    +   * STEP 3 Enter the new user''s Name, followed by the Username they need when
    logging into Linux Mint. lowercase a-z 0-9 characters. You can have stops, underscores
    or hyphens if you wish. Click the Add button when you''re ready to continue.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_37_0.png)


    +   * STEP 2 To add a new user, click the Add button at the bottom of the console.
    There are two types of user you can create, Standard and Administrator. Unless
    the new user has to install new apps or parts of the file system beyond their
    Home folder, then use the Administrator account type.


    +   * STEP 4 The new user appears in the list of current Linux Mint users, alphabetical
    order. At present, there is no password set so click the user in the list of current
    users, click the No Password Set option under the user''s username.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_37_1.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_37_2.png)


