    # Installing Linux on a PC


    Most distros come as a Live Environment. In this you can boot into an actual,
    fully-working distro from the DVD or USB that you created. Let''s see how that
    works and how you go about installing Linux from.


    ## UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify and protect
    a PC during its boot-up process. It replaces the traditional BIOS but can cause
    issues when installing Linux.


    - **STEP 1** Insert your DVD or USB flash drive into your PC, and if you haven''t
    already, shutdown Windows. In this instance we''ll use the USB media but the process
    is virtually identical. Start the PC when prompted to enter SETUP, press the appropriate
    key for example: F2, Del or F11.

    - **STEP 2** There are different versions of UEFI BIOS, so covering them all is
    impossible. What you''re looking for is a section that details the Boot Sequence
    or Boot Mode. Here you have the option to turn off UEFI or choose Legacy Secure
    Boot. Most distros work with UEFI but it can be tricky to get out of.

    - **STEP 3** With UEFI turned to legacy mode, there are two ways of booting into
    the Live Environment. The first is via the BIOS you''re already in. Locate the
    Boot Sequence and change the first boot device from its original setting, internally
    Internal HDD or similar, to USB Storage Device for the USB media option, or DVD
    Drive for the media option.

    - **STEP 4** Alternatively use the Boot Menu. With this you have the option to
    press F2 (or something similar) to display a list of boot options, from there
    you can choose the appropriate boot media. Here you can now Save and Exit the
    BIOS by navigating to the Save & Exit and choosing "Saving Changes and Exit"


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_21_0.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_21_1.png)


    # INSTALLING LINUX


    Once the Live Environment has booted, use the option to install the distro to
    your computer. Have a look around and when you''re ready, look for the Install
    option on the desktop.


    - **STEP 1** Providing you''re connected to the internet (if not, then do so)
    and you''re in the Live Environment, start the installation process by double-clicking
    on the Install Linux Mint icon on desktop. Other distros display their name of,
    course, but the process is the same. Click Continue when you''re ready.

    - **STEP 2** While the installation process is very similar most Linux distros,
    some offer different questions during the installation. Generally, the questions
    aren''t too difficult, nothing very technical, but such as ''Installing third-party
    software'' can be confusing. In this case you can continue but if you''re unsure,
    have an internet-connected device available to ask any questions.

    - **STEP 3** When installing a new operating system it''s recommended that you
    wipe the old OS, replacing it with the new. When you reach this stage of the installation
    process, ensure the ''Erase disk and install Linux...'' is selected. NOTE: This
    completely wipes Windows 10 from your computer, make sure you have backups of
    all your personal files and data.

    - **STEP 4** Before the installation process begins, you''re asked if you chose
    to make sure the erasure of the hard drive is correct. This is your last chance
    to back out. If you''re certain you don''t mind wiping everything and starting
    again with Linux Mint, click Continue. If you need to back up your files to disc/USB,
    reboot, and start again.

    - **STEP 5** Eventually you are asked to set up your username and password. Enter
    your name to begin, with the Computer Name, which is the name it identifies on
    the network. Next choose a Username, followed by a good password. You can click
    the Login button automatically or leave the Enter Home Folder option for now.

    - **STEP 6** The installation process can be quick, and there may be more questions
    to answer, or it may simplify Linux installing based on your previous answers.
    After you end up asked to Continue Testing the Live Environment or Restarting
    to the newly installed OS. If you''re ready to use Linux, then Restart Now.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_0.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_1.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_2.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_3.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_4.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_5.png)


    # Installing a Virtual Environment


    A Virtual Environment is a simulated computer system. Using a Virtual Machine,
    you can mimic a standard PC and install an entire operating system to it without
    affecting the one installed on your computer. It''s a great way to use Linux,
    while still having Windows 10 as your main OS.


    ## VIRTUAL


    Using a Virtual Machine (VM) takes resources from your computer: memory, hard
    drive space, processor usage and so on. Make sure you have enough of before commencing.


    - **STEP 1** We''re using VirtualBox in this instance, as it''s one of the easiest
    environments to get grips with. Enter virtualbox.org and click on ''Download VirtualBox''.
    This takes you to the main download page. Locate the correct host for your system
    (Windows or Mac, the Host having the correct installed operating system) and click
    the link to begin.

    - **STEP 2** Next, while at the VirtualBox download page, locate the VirtualBox
    Extension Pack link. Extension Pack supports USB devices as well as other extras
    that can make the VM environment more accurate emulation of a ''real'' computer.

    - **STEP 3** With the correct packages downloaded, and before you install them,
    you need to make sure that the computer you''re using is able to host a VM. To
    do this, reboot the computer and enable the BIOS. When the computer starts up,
    press the Del, F2 or whichever is key to enter Setup.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_23_0.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_23_1.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_23_2.png)


    - **STEP 5** With the backup back up and running, locate the downloaded main VirtualBox
    application and double-click to begin the installation process. Next to continue,
    when you''re ready.

    - **STEP 8** When installing VirtualBox your network connection is disabled for
    a period. This is due to VirtualBox creating a linked, virtual network connection
    so that any VM installed is able to access the internet, and with network resources,
    the computer''s already established network connection. Next, then to begin the
    installation.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_24_0.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_24_1.png)


    - **STEP 6** The installation process can be quick, and there may be more questions
    to answer, or it may simplify Linux installing based on your previous answers.
    After you end up asked to Continue Testing the Live Environment or Restarting
    to the newly installed OS. If you''re ready to use Linux, then Restart Now.

    - **STEP 7** This section can be left alone the defaults, which makes it easier.

    - **STEP 9** With the backup back up and running, locate the downloaded main VirtualBox
    application and double-click to begin the installation process. Next to continue,
    when you''re ready.

    - **STEP 10** With VirtualBox up and running, you can install the VirtualBox Pack.
    There may be a pause while VirtualBox loads the pack but obviously click to agree
    the terms.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_24_2.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_24_3.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_24_4.png)


    # Installing Linux in a Virtual Environment


    With Oracle''s VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment which you will install. This process won''t affect your
    currently installed operating system, which is why a VM is a great choice.


    ## CREATING THE VM


    There are plenty of options to choose from creating a VM. For now, we''ll setup
    a VM adequate to run the Linux Mint, and perform well.


    - **STEP 1** With VirtualBox open, click on the New Icon in the top-middle of
    the right-hand panel of the app. This will open the new VM Wizard.

    - **STEP 2** In the next box to Name your Linux Mint, and VirtualBox should automatically
    choose Linux as the Type and Ubuntu (64-bit) as Version, if not use the drop-down
    boxes to select the correct settings (remember Mint mainline is based on Ubuntu).
    Click Next when you''re ready to proceed.

    - **STEP 3** The next section will define the amount of system memory, or RAM,
    the VM has. This amount will be taken from the available memory in your computer,
    don''t give the VM too much. For example, we have 8GB of memory and we''re giving
    2GB (2048MB) to the VM. When you''re ready, click Next to continue.

    - **STEP 4** This section is where you''ll start to create the virtual disk that
    the VM will install Mint on. The default option, ''Create a virtual hard disk
    now'', is the one we''re using. Click Create to move on.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_25_0.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_25_1.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_25_2.png)

    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_25_3.png)

