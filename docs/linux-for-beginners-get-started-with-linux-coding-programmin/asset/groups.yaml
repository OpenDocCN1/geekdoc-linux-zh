    # Getting Know Linux


    # # 10 Things to do After Installing Linux Mint


    Linux Mint is a polished distro out of the box, but with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, they can be applied to other distros.


    # LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customisation.


    +   **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the icon in the Panel, found at the bottom right of the desktop
    next to the time and date.


    +   **STEP 3** Click the OK button and you can see a couple of updates for installation.
    Before you update though, click on the Blue OK button to switch to a Local Mirror.
    This opens the Software Sources option. On the Main and Base drop-down menus in
    the Mirrors section, click select a server closest to your current location.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_33_0.png)


    +   **STEP 2** Linux Mint offers a three level approach to updates. Don''t Break
    My Computer, Optimise Stability and Security and Always Update Everything. The
    recommended option is Optimise Stability and Security, which only updates safe,
    essential patches that won''t impact critical elements of the core OS. Read through
    the descriptions but choose the middle, and recommend.


    +   **STEP 4** Click the Update Cache button and clear the Software Sources window.
    Click in the Update Manager, click enter and your password. The updates automatically
    install themselves and relaunch Update Manager, with time more or less updates.
    click Install OK any messages and wait for finish.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_33_1.png)'
  - '[PAGE 34]


    # 10 Things to After Installing Linux Mint


    STEP 5 The updates are graded by level, being a low level update, level 5 being
    a dangerous one. Stick to 3 updates, or is our advice; Click Reply for messages
    regarding overwriting a configuration file. With regards to the Software issue
    and lack of drivers for non-VirtualBox, use the Menu and type "driver" into the
    search box.


    STEP 8 When asked to accept the changes, enter Y and also when asked to configure
    libdvd. make sure OK is pressed and hit Enter, then Yes to any further questions.
    Next up, still in the Terminal: cat /proc/sys/vm/swappiness, the result should
    be 6; if your computer has less than 4GB of RAM/memory, then enter: gksudo edit
    /etc/sysctl.conf.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_34_0.png)


    STEP 6 Click the Driver Manager app that appears as a result of the search and
    enter your password. Mint takes a moment to analyse what is available and presents
    you with a selection of drivers for detected hardware. With those graphical, such
    as Software Rendering, opt to use the latest, Recommended graphics drivers.


    STEP 9 This tweak helps speed up systems with less than 4GB RAM/memory. Scroll
    down to the bottom of the file you just opened and added the following lines:

    # Decrease swap usage to a more reasonable vm.swappiness=10


    Click File > Save, then Quit. Reboot Linux Mint and you should notice a slight
    lag in performance.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_34_1.png)


    STEP 7 At this point you will probably need to restart Linux Mint, so do that
    now. After reboot click the Menu and Terminal. The Terminal icon is found in the
    left-hand column above the Icon. To open the Terminal, enter: sudo apt-get install
    libdvd-pkg press Enter and type in your password. This enables encrypted DVD playback.


    STEP 10 Security is always a concern in this digital age. While Linux Mint is
    a secure system, it is advisable to try and improve it. Click the Menu and search
    for Firewall; click the Firewall Configuration icon and enter your password. In
    the Firewall window, click the Status slider to On.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_34_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_34_3.png)'
