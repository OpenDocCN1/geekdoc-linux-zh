    \n### STEP 6 You can use the Users and Groups console now, as the new user has\
    \ been created. If you click the Mint Menu, followed by Logout, you are presented\
    \ with the Mint Login Manager. The new user is now present in the list of currently\
    \ available users. Click on him/her to log them in.\n\n### STEP 8 You can create\
    \ new accounts as you need and will be able to switch between them when required.\
    \ It's best to have just one account that's capable of installing new software,\
    \ so you can keep track of what's on\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_38_1.png)\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_38_2.png)\n\n# COMMAND LINE ACCOUNTS\n\
    \nJust as you expect, you can also create a new user within the Command Line.\
    \ Open a Terminal session under the (y) Administrator account.\n\n### STEP 1 The\
    \ process for adding a new user from the command line is relatively simple. To\
    \ begin, where `username` is type, use `sudo adduser username`. You're then asked\
    \ to create a password for the user, with their name and other details. Click\
    \ to confirm the details and create the user account.\n\n### STEP 2 You can check\
    \ the details and account type for the new user from within the Users and Groups.\
    \ If you want to delete a user from Mint, you can enter `sudo deluser username`\
    \ in the Terminal or delete in Groups.\n\n```text\n$ adduser username\nAdding\
    \ user username...\nAdding group 'username' (GID 1001)...\nCreating home directory:\
    \ /home/username...\nSetting password for username:\nEnter password:\npassword\
    \ updated successfully\nRetype new password:\nnEnter full information for username:\n\
    Full Name: \nRoom Number: \nWork Phone:\nPhone:\nOther: \n```\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_38_3.png)\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_39_0.png)\n\nSTEP 5 If none of the\
    \ available wallpapers take your fancy, open a browser and search for the type\
    \ of background image you prefer. When you've found the image you want as the\
    \ desktop wallpaper, right-click it and choose Set As Desktop wallpaper from the\
    \ list of options. When the Set Desktop Background console open, click the Set\
    \ Desktop Background button.\n\nSTEP 8 Allows you to change the way certain aspects\
    \ of the Mint desktop look: Window Borders, Icons, Mouse Pointer and Desktop.\
    \ In the Settings tab you can extend your options with a Few on/off slider buttons.\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_40_0.png)\n\nSTEP 6 Click the Menu\
    \ button and search for 'desktop' and click the Desktop Settings result allows\
    \ you to pick the layout, desktop icons and options for multi-monitor support\
    \ you. You can experiment with the options for the best setup, according to your\
    \ personal tastes.\n\nSTEP 9 If you click the Add/remove button in the center\
    \ of the three available views, you can choose the default view from the theme\
    \ you want, then click the install (downward-pointing arrow) button to enable\
    \ it.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_40_1.png)\n\nSTEP 7 In addition\
    \ to changing the desktop wallpaper, and how the icons are displayed, you can\
    \ also alter the overall theme for Linux Mint. From the Mint Menu, search for\
    \ 'themes' and click the Themes as it appears in the search results.\n\nSTEP 10\
    \ Click Back on Themes, then Desktop and you can install the newly installed theme\
    \ and apply it to your desktop. Installed themes can also be uninstalled with\
    \ the Add/ Remove button. It's worth spending time personalising the desktop you\
    \ want and there are some incredible themes available.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_40_2.png)\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_40_3.png)\n\n# Becoming Anonymous Online\n\
    \nThe digital age has led to many great advances in communications; however, it\
    \ has brought on a new age of spying and snooping. Most of us are not strangers\
    \ to the frequent news stories of governments, secret organisations and underground\
    \ hackers breaking privacy but how can you combat this?\n\n# ANONYMITY WITH MINT\n\
    \nWhile it's virtually impossible to become totally anonymous online, you can\
    \ take measures to ensure privacy is at its best.\n\nSTEP 1 Starting with the\
    \ basics, use HTTPS instead of the standard HTTP when browsing. This means that\
    \ anything transmitted over HTTPS is secure (hence the S part at the end) and\
    \ encrypted.\n\nSTEP 2 When you're browsing, consider using the Incognito or Private\
    \ browsing modes in a browser. This disables your web history and cache, allowing\
    \ you to browse without details stored for later by someone else.\n\nSTEP 3 Although\
    \ using Google may seem like the obvious choice for modern internet, consider\
    \ an alternative search engine, such as DuckDuckGo, a search engine that doesn't\
    \ store personal data or track you.\n\nSTEP 4 Consider some browser plugins to\
    \ enhance your privacy. For example, for Firefox use Ghostery, NoScript and Adblock\
    \ Plus to block trackers and other mining techniques.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_0.png)\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_1.png)\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_2.png)\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_3.png)\n\n# VPNS AND TOR\n\nThe\
    \ previous steps can aid your online privacy but to become anonymous Virtual Private\
    \ Network and Tor.\n\n- A VPN is a remote server or client of servers, that establishes\
    \ a connection with your computer. The result is that your computer's identity\
    \ on the Internet is hidden behind the VPN server; you could live in the UK Out\
    \ have an IP address (the computer identity) belonging to Iceland.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_0.png)\n\
    \n- When the download has finished, drop into the Terminal and enter Downloads\
    \ folder, `cd Downloads/`. Enter `ls -lh` to check if the `.xz` file is present,\
    \ then `tar -xf tor-browser-linux64-8.8.4_en-US.tar.xz` (XF is updated, if your\
    \ version is different Press Tab to autocomplete the tor-browser-filename). When\
    \ the files are unpacked, use `cd tor-browser-en-us` to enter the new folder.\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_1.png)\n\n- Most people pay a monthly\
    \ or annual fee but it's worth the expense. We use CyberGhost, www.cyberghost.com,\
    \ which provides VPN connections for Windows, Mac, Mint (with any other Linux\
    \ distro), Android and iOS devices. Details for each OS can be found at **www.cyberghost.com/hz/en-/articles/21390329-Read-me-first**.\n\
    \n- A quick install involves a couple of actions: a folder Browser and a file\
    \ to start. Type, `./start-tor-browser.desktop`. This command launches the Tor\
    \ server, where you are offered two options: Connect or Configure. If not unsure,\
    \ the Connect option will suffice. Connect when you're ready.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_2.png)\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_3.png)\n\n# Tor Browser\n\nClick\
    \ \"Connect\" to adjust network settings. If you are in a censored country (such\
    \ as East China, Turkey) or if you are behind a restrictive firewall, use a proxy.\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_4.png)\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_5.png)\n\
    \nAnother option is to use Tor. It is an open network that you can use to hide\
    \ your IP address behind nodes around the world. It is available for Windows,\
    \ Mac and Linux computers and is very easy to install and use. Start by navigating\
    \ to **www.torproject.org/download/easy-package/** and clicking on the Download\
    \ Linux 64-bit version.\n\nAfter connection, the Tor Browser is established. This\
    \ is a customized version of Firefox and here you can securely browse the Internet\
    \ without being viewed or tracked. Mixing both VPN and Tor makes for an extremely\
    \ secure and private connection to online.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_6.png)\n\
    \n![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_7.png)\n"
  mdcn: '


    # 创建用户


    ### 步骤 5 你可以为新用户输入密码，或者点击“新密码”文本框末尾的弯曲箭头来为你生成并显示密码。当然，设置一个尽可能强的密码是个好主意。完成后，点击“更改”按钮。


    ### 步骤 7 登录后，新用户需要设置他们的桌面壁纸、图标、面板、菜单等。根据你设置的账户类型（标准用户或管理员），他们将无法安装任何程序。此截图来自标准用户类型。


    | 用户 | 组 |

    |---|---|

    | BDM | |

    | David (david) | |


    ```text

    更改密码

    新密码 4vvc_f8*

    确认密码 4vvc_f8*

    ```


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_38_0.png)


    ### 步骤 6 新用户已创建，现在可以使用用户和组控制台。如果你点击 Mint 菜单并选择“注销”，你将看到登录管理器。新用户现在出现在可用用户列表中。点击他们登录。


    ### 步骤 8 你可以根据需要创建新账户，并在它们之间切换。最好只保留一个能够安装软件的账户，这样你可以跟踪桌面。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_38_1.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_38_2.png)


    # 命令行账户


    正如你所期的，你也可以在命令行创建新用户。要开始，在终端中输入 `sudo adduser username`。然后会被要求为该用户创建密码和其他详细信息。点击以创建账户。


    ### 步骤 2 你可以在用户和组中检查新用户的详情和账户类型。如果你想从 Mint 中删除用户，可以在终端或组中输入 `sudo deluser username`。


    ```text

    $ adduser username

    添加用户 username...

    添加组 ''username'' (GID 1001)...

    创建主目录 /home/username...

    为 username 设置密码:

    输入密码:

    密码更新成功

    重新输入新密码:

    为 username 输入完整信息:

    全名:

    房间号:

    电话:

    其他:

    ```


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_38_3.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_39_0.png)


    ### 步骤 5 如果没有可用壁纸符合你的口味，打开浏览器并搜索你喜欢的背景类型。当你找到了想要的桌面壁纸时，右键点击它并从列表中选择“设置为桌面背景”。打开桌面背景控制台，点击“设置桌面背景”按钮。


    ### 步骤 8 允许你更改桌面的某些外观：窗口框、图标和桌面。在“设置”选项页中，你可以通过开启/关闭按钮扩展选项。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_40_0.png)


    ### 步骤 6 点击菜单按钮搜索“桌面”，然后点击“桌面设置”，允许你选择布局、桌面图标和多显示器支持。你可以根据个人喜味对最佳设置进行尝试。


    ### 步骤 9 如果你点击可用视图中间的“添加/删除”按钮，可以选择你想要的默认视图，然后点击向下箭头启用它。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_40_1.png)


    ### 步骤 7 除了更改桌面壁纸和图标显示方式外，你还可以更改 Linux Mint 的整体主题。从 Mint 菜单搜索“主题”，并点击搜索结果中的主题。


    ### 步骤 10 点击“主题”，然后“桌面”，你就可以安装新主题并将其应用于桌面。已安装的主题也可以通过“添加/删除”按钮卸载。花时间个性化你想要的桌面是值得的，有很多非常棒的主题可用。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_40_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_40_3.png)


    # 在线匿名


    数字时代带来了通信的巨大进步；然而，它带来了监视和窥探的新时代。我们大多数人对政府、秘密组织和地下黑客破坏隐私的新闻并不陌生，但你该如何应对呢？


    # 使用 MINT 实现匿名


    虽然在网上完全匿名是不可能的，但你可以采取措施确保隐私处于最佳状态。


    ### 步骤 1 从基础开始，浏览时使用 HTTPS 而不是标准的 HTTP。这意味着通过 HTTPS 传输任何内容都是安全的（最后的 S 部分）并经过加密的。


    ### 步骤 2 浏览时，考虑使用浏览器的无痕或隐私浏览模式。这将禁用网页历史和缓存，允许你在浏览时不会让他人存储详细信息。


    ### 步骤 3 尽管使用 Google 似乎是现代互联网的显然选择，但请考虑替代搜索引擎，例如 DuckDuckGo，一个不存储个人数据或跟踪你的搜索引擎。


    ### 步骤 4 考虑一些浏览器插件来增强你的隐私。例如，对于 Firefox，可以使用 Ghostery、NoScript 和 Adblock Plus
    来拦截追踪器和其他挖掘技术。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_0.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_1.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_41_3.png)


    # VPN 和 TOR


    之前的步骤可以帮助你的在线隐私，但为了实现匿名，可以使用 VPN 和 Tor。VPN 是一种隐藏你 IP 地址的远程服务器。img/2f5daccbaef9a995b10c4942ee31a6fa_40_0.png)


    - Tor 是一个可以通过全球节点隐藏你 IP 地址的开放网络。VPN 客户端与远程服务器建立连接。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_0.png)


    - 大多数人支付月费或年费，但它是值得的。我们使用 CyberGhost（www.cyberghost.com/hz/articles/2139029-Read-me-first），它提供了
    VPN 连接。


    - Tor 的快速安装涉及两个操作：一个文件夹和一个文件。类型 `./start-tor-browser.desktop`。此命令启动 Tor 浏览器，你将看到两个选项：“连接”或“配置”。如果不确定，“连接”选项就足够了。准备好后点击。


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_3.png)


    # Tor 浏览器


    点击“连接”调整网络设置。如果你处于审查国家（如中国）或你处于限制性防火墙之后，请使用代理。


    - Tor 浏览器是 Firefox 的定制版本，在这里你可以安全地浏览互联网而不被查看或跟踪。混合 VPN 和 Tor 可以提供极其安全且隐私的在线连接。


    '
