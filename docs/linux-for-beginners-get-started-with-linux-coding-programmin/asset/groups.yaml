- md: "\n# Using the Terminal\n\n> \"Linux: the operating system with a CLUE... Command\
    \ Line User Environment.\" - Anonymous (Pasted on comp.software.testing)\n\n#\
    \ Using the Terminal\n\nThe Linux command line, the Terminal, is an incredibly\
    \ powerful environment. From it, you can bring the OS to its knees, or update\
    \ it to something spectacular. You can hack into remote computers, look at an\
    \ animated ASCII campfire, install new apps and programs, watch Star Wars played\
    \ out from a server in the Netherlands, and code intricate automated scripts.\n\
    \nIn this section you will explore the intricacies of the Terminal, and how it\
    \ works with Linux. You will learn how to manipulate the Linux file system from\
    \ the Terminal, and you will discover some odd, but fun things you can do in the\
    \ Terminal.\n\nThe Terminal rules supreme in the world of Linux. Learn how it\
    \ works, and you can access all that power.\n\n# Basics of the Terminal\n\nMost\
    \ operating systems use two kinds of interface: the GUI, is the desktop that Windows,\
    \ macOS and Linux Mint boot into, and the command line. While modern operating\
    \ systems shy away from the command line, Mint uses the Terminal to give the user\
    \ greater control of the system.\n\n# TAKING COMMAND\n\nThe command line, or Terminal,\
    \ is an extremely powerful interface. Everything you can do on the desktop can\
    \ be done within the Terminal. Let's start by seeing how it works.\n\n- STEP 1:\
    \ The Terminal can be accessed by either clicking on the Terminal icon on Panel,\
    \ located between the Firefox and Files icons or by opening the Menu and selecting\
    \ from the left-hand quick launch strip.\n- STEP 3: What you currently see in\
    \ the Terminal is your login followed by the name of the computer; as you named\
    \ during setup when you first installed Mint. The line ends with the current folder\
    \ name; at first this is just a tilde ~, your Home folder.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_45_0.png)\n\
    \n- STEP 2: The Terminal gives you access to the Linux Mint Shell, called Bash,\
    \ which gives you access to the underlying operating system. Everything in Mint,\
    \ including the desktop and GUI, is a module running from the command line.\n\
    - STEP 4: The flashing cursor at the very end of the line is where your text-based\
    \ commands are entered. You can begin to experiment with a simple command, Print\
    \ Working Directory (pwd), which outputs the current folder you're in to the screen.\
    \ Type pwd and press Enter.\n\n```\n$ david@david-mint ~ $ \npwd\n```\n\n# Basics\
    \ of the Terminal\n\nSTEP 5: All the commands you enter work in the same manner:\
    \ you enter the command, include any parameters to extend the use of the command\
    \ and press Enter to execute the command you've entered. Type into the Terminal:\
    \ `uname` and press Enter. This displays system information regarding Mint.\n\n\
    STEP 8: View and Search options let you alter the sizing of the Terminal window\
    \ and of course search within the Terminal for any particular words.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_0.png)\n\
    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_1.png)\n\nSTEP 6: Before we enter\
    \ commands, let's take a moment to see what the Terminal has to offer. The menu\
    \ option allows you to open a new Terminal, you can also alter the size, colors\
    \ and behaviour of the Terminal, add a new tab, and close all active sessions.\n\
    \nSTEP 9: The Terminal entry enters the profile editing and sizing allows you\
    \ to alter the character encoding. Interestingly, you can also set it to Read\
    \ Only mode, which stops you from entering any commands into the Terminal: this\
    \ is good for when you need to permanently display the contents.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_2.png)\n\
    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_3.png)\n\nSTEP 7: The Edit option\
    \ lets you copy and paste commands to and from the Terminal and other sources;\
    \ help when you want to copy a very long and complex command from a web page.\
    \ It allows you to edit the terminal preferences.\n\nSTEP 10: Finally, the Help\
    \ option displays the help contents and version number of the Terminal, or to\
    \ be more precise, we'll refer to it as Terminal in Future. The Contents are worth\
    \ having a quick read, to help familiarise yourself with how it works.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_4.png)\n\
    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_5.png)\n\n# Update Mint via the Terminal\n\
    \n**Up to now you've been using the shield icon to launch Mint Update Manager\
    \ in order to update the system and upgrade the currently installed apps, tools\
    \ and other elements. However, you can also accomplish a complete system update\
    \ and upgrade from the Terminal.**\n\n## USING APT-GET\n\nTo update and upgrade\
    \ the Terminal you use the APT (Advanced Packaging Tool) is a powerful command\
    \ and combines different elements depending on its use.\n\n- STEP 1: Start by\
    \ opening a new Terminal or if you already have one its contents with the current\
    \ command. This starts off with a clean slate to work.\n- STEP 3: Apt-get is used\
    \ to update the software in Mint, as well as Ubuntu and distros. Using Update\
    \ retrieves new packages and updates the list of source files. To start the upgrade\
    \ and process, enter: `sudo apt-get` followed by your password.\n- STEP 2: Enter:\
    \ `apt-get`, into the Terminal. This brings up a list of the most used commands,\
    \ and it is worth having a look, even if it doesn't make sense at time.\n- STEP\
    \ 4: Notice the addition of the sudo command. The sudo command comes once as:\
    \ It means the administrative user (Super User) uses APT (Advanced Packaging Tool)\
    \ to get Updates. Now try: `sudo apt-get update`.\n\n```\ndavid@david-mint ~ $\
    \ \n```\n\n```\nFile-...-sudo apt-get update\nHit:1 http://archive.ubuntu.com/ubuntu-security\
    \ InRelease\nGet:2 http://archive.ubuntu.com/ubuntu-security [118 KB]\nHit:3 http://archive.ubuntu.com/ubuntu-backports\
    \ InRelease\nGet:4 http://archive.ubuntu.com/ubuntu-backports [116 KB]\nHit:5\
    \ http://archive.ubuntu.com/ubuntu-updates InRelease\nGet:6 http://archive.ubuntu.com/ubuntu-updates\
    \ [1.1 MB]\nHit:7 http://archive.ubuntu.com/ubuntu-main InRelease\nReading package\
