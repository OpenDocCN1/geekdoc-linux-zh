    You''re be exclusively in the Terminal for these next two sections, so start warming
    up your fingers. After all, work and no play... as the saying goes.


    +   STEP 1 The first command we''re going to use is sl, it''s not installed by
    default so enter: sudo apt-get install sl. The command can be run with sl and
    when executed will display a Steam Locomotive across the screen (hence ''sl'').
    Entering LS, note the upper case, also works.


    +   If you''ve ever fancied having the computer read random fortune out to you,
    then you''re in luck. Most distros require you to install the app, however Linux
    Mint differs by having it already pre-loaded. All you need to do is enter the
    command fortune into the Terminal, and enjoy.


