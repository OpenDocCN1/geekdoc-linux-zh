    with everything you need to get the most from your Python experience. There are
    countless pre-loaded modules, as well the most recent release of the language.


    C++ is one of the most powerful programming languages to learn. The Raspberry
    Pi comes with a great C++ editor, that can help you develop and make amazing things.
    Whatever way you decide to take your coding and Linux adventure, the Raspberry
    Pi is an excellent platform from which to begin on.


