  md: '# Using the Terminal


    # # Install Apps via the Terminal – Part 1


    There are different ways to install apps and programs on Linux. You can opt for
    the graphical route, using a Software Manager, or you can use the Terminal. Often,
    the Terminal provides better control over the software being installed and sometimes,
    you have no choice in the matter.


    # ## COMMAND LINE INSTALLS


    Installing an app with the Terminal may require some nifty keyboard work but you
    get a better sense of what''s being installed and where.


    +   * **STEP 1** Installing apps from the Terminal is relatively simple. First,
    you need to make sure that the system is up to date. To do this up the Terminal
    and enter: `sudo apt-get update && sudo apt-get upgrade`.


    +   * **STEP 3** You need to enter y to confirm the installation, which takes
    up around 5MB of storage in the system. Once Stella is installed, you can see
    that Mint has automatically created the Games category in the Menu as well as


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_49_0.png)


    ```

    ```bash

    davidsmith-mint$ sudo apt-get update && sudo apt-get upgrade

    Reading package lists... Done

    Building dependency tree... Done

    Reading state information... Done

    0 up./ubuntu-security 0 upgraded, 0 newly installed, 0 to remove and 0 failed
    to upgrade.

    0 upgraded, 0 not to upgrade.

    ```

    ```


    +   * **STEP 2** Just as you''ve used sudo apt-get update/upgrade and so are designed
    to upgrade the software that''s already installed on the system. You do install
    more apps than you thought? It is so happens that it''s extraordinarily simple.
    First you need an app to install, let''s use Stella. Enter: `sudo apt-get install
    stella`.


    +   * **STEP 4** Sometimes, when installing software, you need to add the app''s
    Repository. to repository, or repo, is the simplest remote server location where
    the software is held, along with all its dependencies (the libraries and books
    it needs to function). To do this in use: `sudo apt-add-repository ppa:peterlevi/ppa`.
    Press Enter to add and add the PPA (Personal Package Archive).


    ```

    ```bash

    davidsmith-mint$ sudo apt-add-repository ppa:peterlevi/ppa

    Contains packages for the Variety wallpaper changer

    More info: https://launchpad.net/~peterlevi/archive/ubuntu/ppa

    Press Enter to continue or cancel.

    ```

    ```


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_49_1.png)'
