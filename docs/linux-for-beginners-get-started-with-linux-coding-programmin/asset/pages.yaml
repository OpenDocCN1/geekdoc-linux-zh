  md: "# Creating Bash Scripts - Part 3\n\n# # MORE LOOPING\n\nYou can loop over data\
    \ using the FOR, WHILE AND UNTIL statements. These can be handy if you're batch\
    \ naming, copying or running a script where a counter is needed.\n\n+   STEP 1\
    \ Create a new script called count.sh. Enter the text in the screenshot below,\
    \ save and make it executable. This creates the variable 'count' which at the\
    \ beginning of the script equals zero. Then the WHILE loop, WHILE count is less\
    \ than (the LT part) 100 will print the current value of counter in the echo\n\
    \n+   STEP 4 THE UNTIL loop works the same way as the WHILE loop only, more often\
    \ than not, in reverse. So counting to a hundred, using UNTIL, we be until: [\
    \ count -gt 100 ]; The difference is, until counter is greater than (the gt part)\
    \ one hundred, keep on looping.\n\n```\ncount.sh\n!/bin/bash\ncount=0\nwhile [\
    \ $count -lt 100 ]; do\n  echo $count\n  ((count+=1))\ndone\n```\n\n+   STEP 2\
    \ Executing the count.sh script will result in the numbers 0 to 99 displaying\
    \ the Terminal screen; when it reaches 100 the script will end. Modifying the\
    \ script with the FOR statement makes it work the same way. In this case you enter\
    \ the text from the screenshot into the count.sh.\n\n+   STEP 5 You're not limited\
    \ to numbers to one hundred. You can loop, however, whatever set of commands you\
    \ like execute them as many times as you want the loop to run. Renaming files,\
    \ creating fifty folders etc. This script will create folders named folder1 through\
    \ folder10 using the FOR loop.\n\n```\ncount.sh\n!/bin/bash\nuntil [ $count -gt\
    \ 100 ]; do\n  echo $count\n  ((count+=1))\ndone\n```\n\nThe addition we have\
    \ here is: for count in {0..100}; do: Means for variable 'count' IN the numbers\
    \ from zero to one hundred, then start the loop. The rest of the script is the\
    \ same. This script, and the output should appear in the Terminal.\n\n+   STEP\
    \ 6 Using the FOR statement once more, we can execute the following sequence by\
    \ manipulating the (0-100) part. This section actually means START, INCREMENT;\
    \ if there's no increment then it's just a single digit to jump to the END, for\
    \ example we could set the loop up to 1000 with two's: for count in {0..1000..2};\
    \ do:\n\n```\ncount.sh\n!/bin/bash\nfor count in {0..100}; do\n  echo $count\n\
    \  ((count+=1))\ndone\n```\n\nwww.pcltpublications.com 73\n\n```\ncount.sh\n!/bin/bash\n\
    for count in {0..100..2}; do\n  echo $count\n  ((count+=1))\ndone\n```"
