  md: '# Using the Terminal


    The Linux command line, the Terminal, is an incredibly powerful environment. From
    it, you can bring the OS to its knees, or update it to something spectacular.
    You can hack into remote computers, look at an animated ASCII camp fire, install
    new apps and programs, watch Star Wars played out from a server in the Netherlands,
    and code intricate automated scripts.


    In this section you will explore the intricacies of the Terminal, and how it works
    with Linux. You will learn how to manipulate the Linux file system from the Terminal,
    and you will discover some odd, but fun things you can do in the Terminal.


    The Terminal rules supreme in the world of Linux. Learn how it works, and you
    can access all that power.'
  merge: -1
  pgno: 44
- img_proc: true
  md: "# Basics of the Terminal\n\nMost operating systems use two kinds of interface,\
    \ the GUI, is the desktop that Windows, macOS and Linux Mint boot into and the\
    \ command line. While modern operating systems shy away from the command line,\
    \ Mint uses the Terminal to give the user greater control of the system.\n\n#\
    \ TAKING COMMAND\n\nThe command line, or Terminal, is an extremely powerful interface.\
    \ Everything you can do on the desktop can be done within the Terminal. Let's\
    \ start by seeing how it works.\n\n+   STEP 1 The Terminal can be accessed by\
    \ either clicking on the Terminal icon on Panel, located between the Firefox and\
    \ Files icons or by opening the Menu and selecting from the left-hand quick launch\
    \ strip.\n\n+   STEP 3 What you currently see in the Terminal is your login followed\
    \ by the name of the computer; as you named during setup when you first installed\
    \ Mint. The line ends with the current folder name; at first this is just a tilde\
    \ ~, your Home folder.\n\n![](img/2f5daccbaef9a995b10c4942ee31a6fa_45_0.png)\n\
    \n+   STEP 2 The Terminal gives you access to the Linux Mint Shell, called Bash,\
    \ which gives you access to the underlying operating system. Everything in Mint,\
    \ including the desktop and GUI, is a module running from the command line.\n\n\
    +   STEP 4 The flashing cursor at the very end of the line is where your text-based\
    \ commands are entered. You can begin to experiment with a simple command, Print\
    \ Working Directory (pwd), which outputs the current folder you're in to the screen.\
    \ Type pwd and press Enter.\n\n```\n$ david@david-mint ~ $ \npwd\n```"
  merge: -1
