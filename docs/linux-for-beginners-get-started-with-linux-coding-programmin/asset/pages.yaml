  md: '# # Creating a Linux Installer on Windows


    You need to transfer the downloaded Linux ISO to either a DVD or a USB key before
    being able to install it onto a computer. This will be a live environment, which
    allows you to test the OS prior to installation, but first you need to create
    the bootable media.


    # ## DVD BOOTABLE MEDIA


    We''re using a Windows 10 PC to transfer the ISO to a DVD. If you''re using a
    version of Windows from 7 onward the process is extremely easy.


    +   **STEP 1** First locate the ISO Image of Linux you''ve already downloaded.
    You will usually find it in the Downloads Folder in Windows 7, 8.1 and 10 computers,
    unless you specify a different location when saving it.


    +   **STEP 3** Right-click the Linux ISO and from the menu select Burn Disc Image.
    Depending on the speed of the PC, it may take a few seconds before anything happens.
    Don''t worry too much, unless it takes more than a minute, in which case it might
    be worth restarting your PC and trying again. With luck, the Windows Disc image
    burner should launch.


    | Name | |

    | --- | --- |

    | Quick access | | linuxmint-19.1-cinnamon-64bit |

    | Dropbox (Team BDM) | |

    | OneDrive | | |

    | This PC | |

    | CD Drive (E:) HiSuite | |

    | Network | | |


    Mount

    Burn disc image

    Scan with Windows Defender...

    Share

    Open with WinRAR

    Open with Add to...


    +   **STEP 2** Next insert a recordable DVD disc into your computer''s optical
    drive. After a few seconds, while the disc is read, Windows displays a pop-up
    message asking you what to do with the newly inserted disc, as we''re going to
    use the built-in image burning function.


    +   **STEP 4** With the Windows Disc image burner open, click on the "verify disc"
    burner then the burn button. The process should take a few minutes, depending
    on the speed of your PC''s optical drive. Once it runs through the verification
    stage and when the optical drive should auto-detect the disc for you.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_19_0.png)


