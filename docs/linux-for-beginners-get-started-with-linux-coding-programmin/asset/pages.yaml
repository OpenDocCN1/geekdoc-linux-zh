  md: '# # Update Mint via the Terminal


    ### STEP 5 Depending on the state of your updates, if you have any waiting to
    install, you might want to apply the results of the **sudo apt-get upgrade**.
    You can try to accept and continue. What is happening here is apt-get has some
    updated software to apply to Mint, and you''re looking okay.


    ### STEP 7 Essentially, it''s that, your system is now up to date according to
    the available list of packages from the apt-get update command. You can run through
    the process one more time, just if everything went wrong. To recap: **sudo apt-get
    update**, press Enter, then type: **sudo apt-get upgrade** and press Enter.


    ### STEP 6 There''s likely to be a long list of things which don''t worry. The
    files for the upgrade have been downloaded, unpacked, processed, installed and
    what''s correct. There''s likely on when you perform an upgrade, even with the
    smallest package.


    ```

