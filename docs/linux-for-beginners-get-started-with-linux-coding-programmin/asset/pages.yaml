  md: '# # Creating a File Using the Terminal


    Using the Terminal, you''re able to create folders, files and even execute Linux
    Mint apps. In truth, if you didn''t have the GUI at hand, you could still accomplish
    the same from the Terminal.


    # ## MORE TERMINAL WORK


    Creating content using the Terminal isn''t quite strenuous as it may first appear.
    Yes, the Terminal can look a daunting place for the newcomer, but once mastered
    it''s really quite intuitive.


    +   **STEP 1** Open up the Home folder. If not use the `cd` -command to return
    to the Home folder where you''re currently located.


    ```

    File Edit View Search Terminal Help

    david@david-mint ~ cd ~

    david@david-mint ~

    ```


    +   **STEP 3** Your command line should change to the Test folder and if you enter
    `ls` (List folder contents) it''ll be nothing within the folder; you''ve just
    created it. `mkdir` command is fairly explanatory: Make Directory by your name
    of choosing.


    ```

    File Edit View Search Terminal Help ~/

    david@david-mint ~ mkdir Test

    david@david-mint ~ cd Test

    david@david-mint ~ Test ls

    david@david-mint ~ Test $

    ```


    +   **STEP 2** Let''s start by creating a new folder within Home, and call it
    `Test`. The command you''ll need is `mkdir Test`. Press **Enter** to create the
    folder where you''ve typed in the command, then `cd Test` and press **Enter**.
    This will change your **Directory** (here) to the newly created Test folder.


    +   **STEP 4** To create an empty file, called `Test.txt`, enter in the Terminal:
    `touch Test.txt`. You can use `ls` to view the new file in the folder. Touch is
    a standard Linux command that allows the creation of files without the need to
    open save the file, then close the editor.


    ```

    File Edit View Search Terminal Help ~/

    david@david-mint ~ mkdir Test

    david@david-mint ~ cd Test

    david@david-mint ~ touch Test.txt

    david@david-mint ~ ls

    david@david-mint ~ $

    ```'
