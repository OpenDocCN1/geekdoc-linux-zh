  md: '# Command Line Quick Reference


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_80_0.png)


    # USE HELP/INFO COMMANDS


    The following commands are useful for you are trying to learn more about the system
    or program you are working with Linux. You might not need them every day, but
    when you do, they will be invaluable.


    +   - free command displays the total amount of free and used physical and swap
    memory in the system. For example, free -m gives information using megabytes.


    +   - sed command opens a stream editor. A stream editor is used to perform text
    transformations on an input stream: a file or input from a pipeline.


    +   - df displays filesystem disk space usage for all partitions. The command
    df -h is probably the most useful (-h means human-readable).


    +   - adduser command adds a new user to the system. Similarly, the addgroup command
    adds a new group to the system.


    +   - top program provides a dynamic-time view of a running system. It can display
    system information, as well as a list of processes.


    +   - deluser command removes a user from the system. To remove the user''s files
    and home directory, you need to add the -remove- option.


    +   - uname command with the -a option provides all system information, including
    machine name, kernel version, and a few other details.


    +   - delgroup command removes a group from the system. You cannot remove a group
    that is the primary group of any users.


    +   - ps command allows to view all the processes running on the machine. Every
    operating system''s version of ps is slightly different but all do the same thing.


    +   - man command brings in the manual entry for a man command, which is a great
    place to start when you need.


    +   - grep command allows to search inside a number of files for a particular
    search pattern and then print matching lines. An example would be: grep blh file.


    +   - man intro is especially useful. It displays the Introduction to User Commands,
    which is a well written, fairly brief introduction to the Linux command.'
