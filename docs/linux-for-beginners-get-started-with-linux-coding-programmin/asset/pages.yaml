    ```


    ### STEP 8 Interestingly, Mint, among other things, it offers you the chance to
    select features you want. In this example, we use **sudo apt-get update & sudo
    apt-get upgrade**. The double ampersand waits for the preceding command to finish
    before starting. It''s recommended to start with the update and upgrade.


