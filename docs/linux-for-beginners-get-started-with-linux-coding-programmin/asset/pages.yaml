  md: '# Say Hello to Linux


    # Equipment You Will Need


    The system requirements for successfully installing Linux Mint on to a PC are
    surprisingly low, even a computer that’s several years old will happily run this
    distro. However, it''s worth checking what you have everything in place before
    proceeding.


    # MINTY INGREDIENTS


    Before we start working our way through this book, here’s what you need to install
    and run Linux Mint. You have several choices available, so take your time and
    see which works best for you.


    | SYSTEM REQUIREMENTS |

    | The minimum system requirements for Linux Mint are as follows:

    | CPU – 700MHz

    | RAM/Memory – 512MB

    | Hard drive space – 9GB (20GB recommended)

    | Display – 1024 x 768 resolution |


    Obviously the better the system you have, the better the experience will be and
    quicker too.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_11_0.png)


    | USB INSTALLATION |

    | You install Linux Mint onto your computer via USB or DVD. We look into each
    a little later on if you''re already familiar with the process, thinking of USB
    and gathering the hardware you need, then you''re going to need a minimum 4GB
    USB flash drive to store the Linux Mint ISO. |


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_11_1.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_11_2.png)


    | DVD INSTALLATION |

    | DVD installation of Linux Mint simply requires a blank DVD-R disc. Of course,
    you also need an optical drive (a DVD Writer drive) before you''re able to transfer
    or burn the ISO image to the disc. |'
