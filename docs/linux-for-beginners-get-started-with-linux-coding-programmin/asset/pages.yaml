    tools are preinstalled, that a user can run for penetration testing against their
    network. There was once even a Hannah Montana Linux distribution but the less
    we talk about the better. The point being, there''s a distro out for you.


    Needless to say, once you''ve mastered Linux to a relatively high degree, a proper
    user ally, then you will need to expand your skills and build your own Linux distro
    based on Arch, Debian or one of the others. Doing so involves a lot of command
    line knowledge, as well as knowledge on how the Linux system works and interacts
    with the hardware in the computer. You will need to partitioning your drive, installing
    drivers, and eventually install the apps and programs you want. Doing so takes
    time and again again there is a lot of skills you''re going to learn.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_16_1.png)


    Oddly enough, much higher-end technical users find themselves back at square one,
    using a distro like Linux Mint. The main reason is usually because it''s an easy
    option, and it''s a stable environment. If you prefer building system from inside
    out, then doesn''t you always want to be fixing potential issues. Most of us would
    prefer the easy life, especially where technology is concerned, so the logical
    choice would be to choose a distro that is simple, yet still powerful enough to
    do everything you want it to do, hence Linux.


    However, in the end, it''s purely down to you, your own personal choice. You may
    find after going through the tutorials in this title you don''t like Linux Mint
    or the Cinnamon desktop. Fine, you may prefer Ubuntu, Debian or openUSE; that
    is the beauty of Linux. The freedom to change what you want, to hop from one to
    another without being penalised by cost or lack of access.


    Eventually you can consider yourself a technical Linux user but never consider
    yourself an expert, after all you''re always learning something new. You can build
    your own distro from scratch, help other Linux users with problems, maybe even
    contribute to the improvement of a distro during its testing phase or build. Where
    next then?


