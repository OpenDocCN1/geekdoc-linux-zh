  md: '# Install Apps via the Terminal – Part 2


    Most of the time you''ll get to install apps from the Terminal using the standard
    apt-get command. However, sometimes an app demands a little more work. This means
    installing an app from its source code, which isn''t as scary as it first sounds.


    # FROM THE SOURCE


    The commands you''ll need to become familiar with are Configure, Make and Install.
    You''ll find a lot of apps use from source, so it''s certainly a skill worth investing
    time in.


    STEP 1  Source code files for Linux usually come in the form of .TAR.GZ or .TAR.B2.
    Both are compressed files holding all the code needed to ''make''. Start off this
    tutorial by creating a new folder in Home: mkdir vim.


    STEP 3  The widget command retrieves content from the internet, in this case the
    BZ2 file for Vim. According to Mint''s system colour theme, the file should be
    displayed in red.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_51_0.png)


    STEP 2  Vim, by the way, is an advanced text editor which will help us edit code,
    cd Vim, then from within the new Vim folder, enter the following command in the
    Terminal: wget ftp://vim.org/pub/unix/vim-7.4.tar.bz2


    STEP 4  We need to configure the contents of the file, now so: type tar -xf vim-7.4.tar.bz2
    into the Terminal. You can press the Tab key to auto-fill the main file name.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_51_1.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Install Apps via the Terminal - Part 2


    # STEP 5


    If you enter `ls` again, you''ll notice a new folder has been created: **vim**:
    in light text representing a folder in Mint. It''s always better to create root
    folders for the main app, as you upgrade apt this method the individual versions
    will each have their own.


    # STEP 8


    You may need to keep installing dependencies, depending on the app. After each
    dependency is installed, run `sudo --configure` and if it doesn''t report back
    with an error you can continue to the next stage of the installation. You may
    need to search online for some error messages.


    ```

    bash

    @david-david-mint ~ $ ls

    vim7 vim7.tar.xz

    @david-david-mint ~ $ sudo

    ```


    ```

    bash

    @david-david-mint ~ $ sudo apt update

    Checking for updates... Done

    Reading package lists... Done

    Building package list... Done

    Reading package lists... Done

    Checking for dependencies... Done

    Checking for in-use packages... Done

    Checking for broken packages... Done

    Checking for held packages... Done

    nThe following NEW packages will be installed:

    0 new packages, 0 to remove.\ Done.

    Checking for broken packages... Done

    Checking for held packages... Done

    0 packages upgraded, 0 newly installed, 0 to remove.

    ```


    # STEP 6


    Type in `cd vim7` to enter the folder, and `ls` again to view its contents. There
    will be a fair number of files; most are the apt core files, which others should
    be **README** or **INSTALL**. It''s always wise to read these files as they provide
    valuable information regarding the installation.


    # STEP 9


    With a successful `/configure`, the system will create a **Makefile**. This needs
    to be ''made'' by entering into the Terminal. This may take a while, depending
    on the size of the app.


    ```

    bash

    @david-david-mint ~ $ cd vim7

    @david-david-mint:vim7 ~ $ ls

    ```


    ```

    bash

    @david-david-mint:vim7 ~ $ make

    starting make in the directory ''/home/david/vim7''

    make: Entering directory ''/home/david/vim7''

    make: Using 4 jobs in parallel

    gcc -c -o src/buffer.o src/buffer.c -O2 -D_DEBUG -D_VIM_CONFIG_SOURCE -Iinclude
    -I/usr/include -I/usr/include/x86_64-linux-gnu -D_GNUSRC include/config.h

    gcc -c -o src/char.o src/char.c -O2 -D_DEBUG -D_V_CONFIG_SOURCE -Iinclude -I/usr/include
    -I/usr/include/x86_64-linux-gnu -D_GNUSRC include/config.h

    gcc -c -o src/dictionary.o src/dictionary.c -O2 -D_DEBUG -D_V_CONFIG_SOURCE -Iinclude
    -I/usr/include -I/usr/include/x86_64-linux-gnu -D_GNUSRC include/config.h

    gcc -c -o src/file.o src/file.c -O2 -D_DEBUG -D_V_CONFIG_SOURCE -Iinclude -I/usr/include
    -I/usr/include/x86_64-linux-gnu -D_GNUSRC include/config.h

    gcc -c -o src/job.o src/job.c -O2 -D_DEBUG -D_V_CONFIG_SOURCE -Iinclude -I/usr/include
    -I/usr/include/x86_64-linux-gnu -D_GNUSRC include/config.h

