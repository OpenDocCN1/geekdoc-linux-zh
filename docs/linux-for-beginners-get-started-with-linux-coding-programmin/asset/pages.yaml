  md: '# # Creating and Removing Directories


    ### STEP 5 The command to create directories is logical, directories within. However,
    you''ll create the directory, and if you want to create a directory and a sub-directory
    in a single command. Make sure you''re at home: mkdir -p Temp/Finances. Now, cd
    Temp/ and ls to list the directory.


    ### STEP 8 Now that we''ve created some directories, let''s see about removing
    them. Start by entering the directory and listing its contents: cd testdir; then
    ls. The previously created sub directory is present. One way to remove it is:
    rmdir reports, then ls to confirm it''s not there.


    ```

    david@david-mint: ~Temp

    File Edit View Search Terminal Help

    david@david-mint: ~ mkdir -p Temp/finances

    david@david-mint: cd Temp/finances

    david@david-mint: ~Temp $

    ```


    ```

    david@david-mint: ~testdir

    File Edit View Search Terminal Help

    david@david-mint: ~mkdir testdir

    david@david-mint: ~reports

    david@david-mint: ~testdir rm reports

    david@david-mint: ~testdir ls

    david@david-mint: ~testdir $

    ```


    ### STEP 6 The -p option is what enables the mkdir to create the sub-directory
    as well as the parent directory. In Linux, commands always follow the same structure:
    Command, Option, and Argument. In the previous step example, command (mkdir),
    option (-p), and argument (Temp/finances).


    ### STEP 9 A quick warning: removing a directory in the Terminal doesn''t place
    it in the Mint Rubbish Bin, via the same goes for any files, if you remove a directory
    from the Terminal then it''s gone for good.


    ```

    david@david-mint: ~Temp/finances

    File Edit View Search Terminal Help

    david@david-mint: ~mkdir -p Temp/finances

    ```


    ```

    david@david-mint: ~testdir

    File Edit View Search Terminal Help

    david@david-mint: ~mkdir testdir

    david@david-mint: ~testdir rm reports

    david@david-mint: ~testdir ls

    david@david-mint: ~testdir $

    ```


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_58_0.png)


    ### STEP 7 If you want to dive into the options available for the mkdir command,
    you can mkdir --help in the Terminal. This will provide a quick help guide detailing
    how the command structure works.


    ```

    david@david-mint: ~~

    File Edit View Search Terminal Help

    david@david-mint: ~mkdir --help - they do not already exist

    create THE DIRECTORY

    -a, --parents    create parent directories as needed

    -m, --mode        set mode (in octal) for files

    -v, --verbose    print message for each created directory

    --setcontext=CTX  set SELinux context of each created directory

    --context=CTX    -i, or if CTX is specified not the SELinux context

    --help           display help-text, information and exit

    ```


    ### STEP 10 Rmdir will remove empty directories, or sub-directories, or even files,
    you''ll need to use the rm command with the -r option. On example, to remove the
    directory, use rm -r Temp. A quick reveals is if the parent folder or all of its
    contents is removed. Careful when using this.


    ```

    david@david-mint: ~~

    File Edit View Search Terminal Help

    david@david-mint: ~rm -r Temp

    david@david-mint: ~rm -rf test mapfile Music Pictures Public Templates Test test

    david@david-mint: ~test $

    ```'
