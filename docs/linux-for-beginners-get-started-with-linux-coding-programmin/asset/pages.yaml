  md: '# Navigating the Cinnamon Desktop


    Each desktop environment behaves differently to that of the next. Some DEs offer
    widgets that can be customised and placed on the desktop, others instead opt for
    a clean, sharp look to keep everything running as fast as possible. Let''s see
    what the Cinnamon desktop has to offer.


    # A TOUCH OF SPICE


    The Cinnamon desktop environment is a great blend of style and performance. There''s
    lots to like about it, which is why it''s a popular DE.


    +   **STEP 1** Begin exploring the Cinnamon desktop by doubleclicking the Computer.
    This brings Nemo, the file manager used in Cinnamon. The Computer opens up the
    root file system, with access and views to the optical drive (if you have one
    installed), hard drive and core Linux file system.


    +   **STEP 3** Nemo has many different features, views and so that you can navigate
    and manage files and Fold. For example, if you have any images in the Pictures
    folder, you can select the icon zoom level for the images by using the slider
