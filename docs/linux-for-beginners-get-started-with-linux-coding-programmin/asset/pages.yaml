  md: '# VPNS AND TOR


    The previous steps can aid your online privacy but to become anonymous a Virtual
    Private Network and Tor.


    +   - A VPN is a remote server, or client of servers, that establishes a connection
    with your computer. The result is that your computer''s identity on the Internet
    is hidden behind the VPN remote server; you could live in the UK Out to have an
    IP address (the computer online identity) belonging to Iceland.


    # How VPN works?


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_42_0.png)


