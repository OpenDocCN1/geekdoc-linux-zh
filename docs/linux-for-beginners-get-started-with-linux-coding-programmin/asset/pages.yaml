  md: '# CINNAMON ON THE MENU


    Now the Software Rending Issue for Virtualbox is out of the way, let''s take a
    look at the Mint Menu and how it works. Remember, this is just for Mint Cinnamon,
    other distros look and behave differently.


    +   - STEP 1 First off, you may have already noticed the Welcome Screen that pops
    up when you login to Linux Mint. Take a moment to browse through the options,
    read the First Steps and so on. When you need to, click the X in the top corner
    of the window to close it.


    +   - STEP 4 Open up the Menu again but this time hover the mouse pointer over
    Graphics, then click on GNU Image Manipulation Program. GIMP is a powerful image
    app that''s probably as effective as Adobe Photoshop but requires a little more
    work to get the results you want. It''s worth taking the time to master, though.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_30_0.png)


    +   - STEP 2 You''ve already using the Mint Menu to reboot the system and when
    you first used the Office Environment. Then, click the Menu button and hover over
    the Office entry in the middle column. This changes the icons represented in the
    right-hand column, detailing what apps are installed under that section.


    +   - STEP 5 If you''re looking for a particular function or app, such as setting
    a printer, click on the Search box at the top of the Menu box. Start typing the
    app or function you want, search printers, and the Mint Menu displays the relevant
    options below. This works with most modern Linux menus, regardless of the device.


