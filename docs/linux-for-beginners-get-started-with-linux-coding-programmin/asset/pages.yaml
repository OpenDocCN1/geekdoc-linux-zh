  md: '# # Creating and Remaming Directories


    As with creating files in the Terminal, you can also create and delete directories,
    or folders if you prefer. Directories form the structure of your file system,
    without logical directories the filing system would be in utter chaos.


    # ## MANAGING FOLDERS


    Learning how to create and delete folders in the Terminal is an important Mint,
    and indeed Linux overall, skill to master. Here''s the basics for you to try out.


    +   **STEP 1** With the Terminal open enter cd ~ to make sure you''re in your
    own Home directory. Now enter ls to view the current folders you have housed in
    the Home directory. You''ll notice that folders are labelled in cyan (light blue).
    Let''s start by creating a new directory: `mkdir testdir`.


    If you enter the command again, `mkdir testdir`, you''ll receive a message stating:
    `mkdir: directory exists`. Without saying then, you''re only able to have one
    unique named directory within the current directory. However, as Linux is case-sensitive,
    you cannot have two `testdir`s.


    +   **STEP 2** If you now enter ls again, you''ll see that the new directory,
    testdir, has been created alongside the other directories in the Home area. Obviously
    the command `mkdir` is what it creates, and now you''ve already guessed it stands
    for Directory.


    You can create directories within directories you''ve already created. For example,
    enter the testdir with `cd testdir`/ and ls to list the folder structure. Naturally
    nothing is present, as you go back to Home with `cd -`, and enter `mkdir testdir/reports`.
    To delete the testdir, `rm -rf testdir` and `testdir` is.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_57_0.png)'
