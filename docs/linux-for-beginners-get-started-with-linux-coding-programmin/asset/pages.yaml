    \ 8\n\nWhen you enter ls again you can see that the helloworld.sh has now turned\
    \ from black to green, making that it's now an executable file. To run the script,\
    \ in other words make it do the things you've typed into it, ./helloworld.sh\n\
    \n```\nFile Edit View Search Terminal Help\ndaviddavid-mint ~/scripts$ xed helloworld.sh\n\
    daviddavid-mint ~/scripts$ chmod +x helloworld.sh\ndaviddavid-mint ~/scripts$\
    \ ls\n\n```\n\n```\ndaviddavid-mint ~/scripts$ ./helloworld.sh\n```\n\n# STEP\
    \ 6\n\nThe #!/bin/bash line tells the shell what you're going to be using, in\
    \ this case. The hash (#) denotes a comment line, which is ignored by the system,\
    \ the exclamation mark (! ) means that the command is bypassed and will force\
    \ the script to execute the line as a command. This is also known as a Hash-Bang.\n\
    \n```\nFile Edit View Search Tools Documents Help\n[] / x _ \n*helloworld.sh\n\
