  md: '# INSTALLING LINUX


    Once the Live Environment has booted, use the option to install the distro to
    your computer. Have a look around and when you''re ready, look for the Install
    option on the desktop.


    STEP 1 Providing you''re connected to the internet (if not, then do so) and you''re
    in the Live Environment, start the installation process by double-clicking on
    the Install Linux Mint icon on desktop. Other distros display their name of, course,
    but the process is the same. Click Continue when you''re ready.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_0.png)


    STEP 4 Before the installation process begins, you''re asked if the chose to make
    sure the erasure of the hard drive is correct. This is your last chance to back
    out. If you''re certain you don''t mind wiping everything and starting again with
    Linux Mint, click Continue. If you need to back up your files to disc/USB, reboot,
    and start again.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_1.png)


    STEP 2 While the installation process is very similar most Linux distros, some
    offer different questions during the installation. Generally, the questions aren''t
    too difficult, nothing very technical, but such as ''Installing third-party software''
    can be confusing. In this case you can continue but if you''re unsure, have an
    internet-connected device available to ask any questions.


    STEP 5 Eventually you are asked to set up your username and password. Enter your
    name to begin, with the Computer Name, which is the name it identifies on the
    network. Next choose a Username, followed by a good password. You can click the
    Login button automatically or leave the Enter Home Folder option for now.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_3.png)


    STEP 3 When installing a new operating system it''s recommended that you wipe
    the old OS, replacing it with the new. When you reach this stage of the installation
    process, ensure the ''Erase disk and install Linux...'' is selected. NOTE: This
    completely wipes Windows 10 from your computer, make sure you have backups of
    all your personal files and data.


    STEP 6 The installation process can be quick, and there may be more questions
    to answer, or it may simplify Linux installing based on your previous answers.
    After you end up asked to Continue Testing the Live Environment or Restarting
    to the newly installed OS. If you''re ready to use Linux, then Restart Now.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_4.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_22_5.png)'
