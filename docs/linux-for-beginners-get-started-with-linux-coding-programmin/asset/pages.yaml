  md: "# # Creating Bash Scripts\n– Part 3\n\nIn the previous pages we looked at the\
    \ If, Else statements now come time a very basic Bash script, involving outputting\
    \ text to the screen, getting a user's input, storing and outputting that to the\
    \ screen; as well as including a system variable using the Date command. Now let's\
    \ combine what you've achieved so far and introduce Loops.\n\n# ## IF, THEN, ELSE\n\
    \nWith most programming structures there will come a time where you need to loop\
    \ through the commands you've entered to create better functionality, and ultimately\
    \ a better program.\n\n+   - **STEP 1** Let's look at the If, Then and Else statements\
    \ now, when executed correctly, come a set of instructions and simply work out\
    \ if something is present, THEN do something. Else something different. Create\
    \ a new script greeting.2sh and enter the text in the screenshot below it.\n\n\
    +   - **STEP 3** The next line, ELSE, is what happens if the variable doesn't\
    \ equal 'David'. In this case it simply outputs to the screen the new firstly\
    \ 'Hello...' The last line, the FI command is the statement that will end the\
    \ loop. If you have an if without a FI command, then you get an error.\n\n```\n\
    greeting.sh\n#!/bin/bash\necho \"Hello, what is your name ?\"\nread firstname\n\
    echo \"Thank you, and what is your surname ?\"\nread surname\nclear\nif [ \"$firstname\"\
    \ == \"David\" ]; then\n  echo \"David\"\n```\n\n+   - **STEP 2** Greeting.2sh\
    \ is a copy of greeting.2sh but with a slight difference. Here we've added a loop\
    \ at the if statement. This means, IF the variable is equal to David the next\
    \ line, THEN, is the reaction to what happens, and if it will output to the screen\
    \ 'Awesome name', followed by the variable (which is David).\n\nHello Pink, how\
    \ are you on this Wednesday?\ndavid@david-mint ~scripts $0\n\n```\ngreeting.2sh\n\
    #!/bin/bash\necho \"Hello, what is your name ?\"\nread firstname\necho \"Thank\
    \ you, and what is your surname ?\"\nread surname\nclear\nif [ \"$firstname\"\
    \ == \"David\" ] && [ \"$surname\" == \"Hayward\" ];\nthen\n  echo \"Awesome $firstname\
    \ $surname\"\nelelse\n  echo \"Hello $firstname $surname, how are you on this\
    \ fine\n```"
