  md: '# Basics of the Terminal


    STEP 5 All the commands you enter work in the same manner: you enter the command,
    include any parameters to extend the use of the command and press Enter to execute
    the command you''ve entered. Type into the Terminal: `uname`a press Enter. This
    displays system information regarding Mint.


    STEP 8 View and Search options let you alter the sizing of the Terminal window
    and of course search within the Terminal for any particular words.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_0.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_1.png)


    STEP 6 Before we enter commands, let''s take a moment to see what the Terminal
    has to offer. The menu option allows you to open a new Terminal, you can also
    alter the size, colors and behaviour of the Terminal, add a new tab, and close
    all active sessions.


    STEP 9 The Terminal entry enters the profile editing and sizing allows you to
    alter the character encoding. Interestingly, you can also set it to Read Only
    mode, which stops you from entering any commands into the Terminal: this is good
    for when you need to permanently display the contents.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_3.png)


    STEP 7 The Edit option lets you copy and paste commands to and from the Terminal
    and other sources; help when you want to copy a very long and complex command
    from a web page. It allows you to edit the terminal preferences.


    STEP 10 Finally, the Help option displays the help contents and version number
    of the Terminal, or to be more precise, we''ll refer to it as Terminal in Future.
    The Contents are worth having a quick read, to help familiarise yourself with
    how it works.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_46_4.png)


