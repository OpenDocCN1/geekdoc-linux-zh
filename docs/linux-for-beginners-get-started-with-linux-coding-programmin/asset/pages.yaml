    # BEYOND THE RASPBERRY PI


    # PI, LINUX AND CODING


    The flexibility of the Raspberry Pi''s ARM processor means that it''s capable
    of running other operating systems besides default Raspberry Pi OS. Still keeping
    with Linux, you can install MATE, PiDA (a Fedora-based distribution), LakkaPi
    (a retro emulation distribution) and Arch Linux ARM. There are also systems based
    locally on the Linux kernel, such as Ubuntu, Debian, Minbian, and Chroot.


    As previously, the Raspberry Pi is an excellent choice for beginners, and with
    the backbone of Linux you''re able to learn how to code in multitude of different
    programming languages.


    Windows 10 is also available for the Pi 4, and means that once you''ve finished
    experimenting with one version of Linux, you can use it as a desktop of Linux,
    which then go to another on the Raspberry Pi and see how that works, and it will
    work for for you.


