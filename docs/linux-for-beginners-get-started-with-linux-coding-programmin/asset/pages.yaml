  md: '# # Linux Tips and Tricks


    As you''ve seen, the Linux Terminal is quite an exceptional environment. With
    a few extra apps installed, and a smidgen of command knowledge, incredible, and
    often strange ranges, things can be accomplished.


    # ## TAKING COMMAND


    There are countless Linux tips, secrets, hacks and tricks out there. Some are
    very old, originating from Linux''s heritage, while others are recent additions
    to Linux lore. Here our favourite ten tips and tricks.


    ### EASTER EGGS

    Emacs, the text editor, is a great piece of software, however, it also contains
    a hidden Easter Egg! Did you know? With Emacs installed (`sudo apt-get install
    emacs25`), drop to Terminal session and enter:

    ```bash

    emacs -batch -l dunnet

    ```


    ### TERMINAL BROWSING

    Ever fancied being able to browse the Internet from the terminal? While not particularly
    useful, it is a fascinating thing to behold. To do so, enter:

    ```bash

    sudo apt-get install elinks

    ```


    Dunnet is a text adventure by Ron Schnell in 1982, and hidden in Emacs since 1994.


    Enter the website you want to visit.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_63_0.png)


    ### MOON BUGGY

    Based on the classic 1982 arcade game, Moon Patrol, Moon buggy appears on home
    computers of 1985 amid much praise. It''s a cracking Atari game, and it is available
    in the Linux Terminal by entering:


    ```

    ```sudo apt-get install moon-buggy```

    ```


    ### LET IT SNOW

    Snowing in the Terminal console is come over you any day. If you''re interested,
    enter:


    ```

    ```wget https://github.com/semtek/15058483/raw/7/d024716ea57e69fb52632fee09f4427353164a2/snowjob.job

    chmod +x snowjob.job```

    ```


