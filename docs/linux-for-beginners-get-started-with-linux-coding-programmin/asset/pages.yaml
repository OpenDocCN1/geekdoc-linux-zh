  md: '# # The Best Linux Distributions


    There are lots of versions of Linux available, known as Distributions. Each has
    a different ethos and approach. Here are five great distributions to try and where
    you can get them.


    # ## GOING LINUX


    The installation process for most distributions is similar. You download a disk
    image from the website and burn it to an optical disk or create a USB Flash Drive
    installer. Just be careful to get the right distribution for your hardware and
    read the instructions carefully.


    # ## LINUX MINT


    By far the most Linux distro (distribution) is Linux Mint. Mint began life back
    in 2006, as an alternative to the them most popular, Ubuntu. Although based on
    Ubuntu''s Long Term Support, Linux Mint took a different direction and offered
    the user a better overall experience.


    Linux Mint has three main desktop versions available with each version of the
    core OS. This may sound confusing at first but it''s quite simple. Currently,
    Linux Mint uses the Cinnamon Environment as its flagship model; MATE and Xfce
    are also available.


    Cinnamon is a graphically rich desktop environment, MATE uses fewer graphics,
    and is more stable on a wider variety of desktop systems, and Xfce is an extremely
    streamlined environment that''s built for speed and ultimate stability.


    Throughout this title we''ll be using the Cinnamon version; however, you can try
    any of the other desktop distributions as you wish. In fact, it''s recommended
    that you spend some time trying different environments, and even different ones,
    to see which suits you and your computer best.


    ```

    www.linuxmint.com

    ```


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_9_0.png)


    # ## UBUNTU


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_9_1.png)


    The second most popular distro is Ubuntu, which is an African word meaning ''humanity
    to others''. Ubuntu has fluctuated over its fourteen year line. At one time, it
    was the easiest used Linux-based system in the world with some choices along the
    way with regards to its presentation, and some unfavorable circumstances, particularly
    involving privacy, saw it topple


    That is, Ubuntu has since amended and is slowly crawling its way up the Linux
    leader. The latest versions of the OS use the GNOME 3 desktop environment, an
    impressive improvement; although it can be a bit confusing for Windows users and
    is a light heavy on resources, especially if you''re planning on installing it
    on an older computer.


    Ubuntu, for all its faults, is a good Linux distro to start experimenting with.
    It''s a clean interface, easy to use and install and offers the user a complete
    Linux experience.


    ```

    www.ubuntu.com

    ```'
