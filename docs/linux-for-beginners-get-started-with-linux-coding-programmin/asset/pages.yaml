  md: '# Getting Know Linux


    # # 10 Things to do After Installing Linux Mint


    Linux Mint is a polished distro out of the box, but with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, they can be applied to other distros.


    # LINUX TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customisation.


    +   **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the icon in the Panel, found at the bottom right of the desktop
    next to the time and date.


    +   **STEP 3** Click the OK button and you can see a couple of updates for installation.
    Before you update though, click on the Blue OK button to switch to a Local Mirror.
    This opens the Software Sources option. On the Main and Base drop-down menus in
    the Mirrors section, click select a server closest to your current location.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_33_0.png)


    +   **STEP 2** Linux Mint offers a three level approach to updates. Don''t Break
    My Computer, Optimise Stability and Security and Always Update Everything. The
    recommended option is Optimise Stability and Security, which only updates safe,
    essential patches that won''t impact critical elements of the core OS. Read through
    the descriptions but choose the middle, and recommend.


    +   **STEP 4** Click the Update Cache button and clear the Software Sources window.
    Click in the Update Manager, click enter and your password. The updates automatically
    install themselves and relaunch Update Manager, with time more or less updates.
    click Install OK any messages and wait for finish.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_33_1.png)'
