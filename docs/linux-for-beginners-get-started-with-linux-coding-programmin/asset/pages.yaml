  md: '# The Linux Distributions


    # ARCH


    Arch is one of longest running Linux distributions and forms the basis of many
    versions of Linux. Why install Mint or Ubuntu when you can install Arch? Many
    users do exactly that but it is not ideal for beginners.


    Arch is a distro for when you''re more experienced with Linux. You start with
    nothing but the command line and from there have to manually partition your hard
    drive, set the user, set the OS and finally install a desktop environment along
    the apps you want.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_10_0.png)


    Ubuntu and Mint both offer an installation path and come with software packages
    to help you get


    Arch on the other hand, is a more ''bare bones'' affair. Arch is committed to
    provide free software and its repositories contain over 50,000 apps to install,
    including multiple different Desktop environments, and as you use it with any
    distro.


    The advantage though, for all this hard work, is a distro that you have created.


    your Arch distro doesn''t come with all the unnecessary files and apps that others
    have preinstalled. it''s custom made for you, by you.


    ```

    www.archlinux.org

    ```


    # RASPBERRY PI DESKTOP


    # OPENSEUSE


    No doubt,you''ve heard of the Raspberry Pi. It''s hard not to have, as this remarkable,
    tiny computer has taken the world by storm for the last six years since it was
    introduced.


    There are several aspects to the Raspberry Pi that make it such an after piece
    of the computing world. For one it''s cheap, costing around $25 for what is a
    fully working computer; it''s small, measuring not much bigger than a credit card;
    built electronics with a fully programmable interface; and it comes with Raspberry,
    its own custom-made, Debian-based operating system that includes an office suite
    alongside many programming languages and educational resources.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_10_1.png)


    Raspian is extensible to the PI, since the Raspberry Pi uses an ARM processor
    to power it. However, the Raspberry Pi Foundation has since released a PC version
    of Raspberry Desktop.


    Just like the Raspberry Pi Desktop comes with all the coding, educational and
    other apps you will need ever. It''s quick, stable and works superbly. if you''re
    interested in stretching your Linux experience, then this is exactly one of the
    top distros to consider.


    Most distributions fall into two categories. Some are with the latest features
    and technology like Ubuntu and Mint with those new features but robust solid reliability,
    like Debian.


    Meanwhile, openSUSE attempts to cover both bases. OpenSUSE is the rock solid system,
