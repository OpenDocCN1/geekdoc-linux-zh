  md: '# # Installing Linux in a Virtual Environment


    With Oracle''s VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment which you will install Linux. This process won''t affect
    your currently installed operating system, which is why a VM is a great choice.


    # ## CREATING THE VM


    There are plenty of options to choose from creating a VM. For now, we''ll setup
    a VM adequate to run the excellent Linux Mint, and perform well.


    **STEP 1** With VirtualBox open, click on the New Icon in the top-middle of the
    right-hand panel of the app. This will open the new VM Wizard.


    **STEP 3** The next section will define the amount of system memory, or RAM, the
    VM has allocate. This amount will be taken from the available memory in your computer,
    don''t give the VM too much. For example, we have 8GB of memory installed and
    we''re giving 2GB (2048MB) to the VM. When you''re ready, click Next to continue.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_25_0.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_25_1.png)


    **STEP 2** In the next box to Name your Linux Mint, and VirtualBox should automatically
    choose Linux as the Type and Ubuntu (64-bit) as Version, if not use the drop-down
    boxes to select the correct settings (remember Mint mainline is based on Ubuntu).
    Click Next when you''re ready to proceed.


    **STEP 4** This section is where you''ll start to create the virtual disk that
    the VM will install Mint on. The default option, ''Create a virtual hard disk
    now'', is the one we''re using. Click Create to move on.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_25_2.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_25_3.png)'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# STEP 5


    The pop-up window that appears after clicking Create is asking you what type of
    virtual disk you want to create. We recommend using the default (VirtualBox Disk
    Image) in this case, as the others are often used to move VMs from one VM application
    to the next. Make sure VDI is selected, and click Next.


    # STEP 8


    After clicking the initial setup of the VM is complete; you should be looking
    at the newly created VM within the VirtualBox application. Before you begin though,
    click the Settings button from the top of right-hand panel, and within the General
    section click the pull-down menu, choose: "Bidirectional" for shared Clipboard
    and Drag''n''Drop.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_26_0.png)


    # STEP 6


    The question of whether to opt for Dynamically or fixed sized virtual hard disk
    may come as somewhat confusing to the beginner. Basically, a Dynamically Allocated
    virtual hard disk is a flexible option; it will not take up much space within
    your physical disk to begin with. Ensure Dynamically Allocated is selected, and
    click Next.


    # STEP 9


    Follow that by clicking on the System section, then the Processor tab. Depending
    on your CPU allocate as many cores as you can without detriment to your host system;
    we'' opted for two CPUs. Now click on the Display section, slide the Video Memory
    to the maximum, and tick "3D Acceleration". Click OK to commit to the next settings.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_26_1.png)


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_26_2.png)


    # STEP 7


    Ensure the location of the virtual hard disk, on your computer, has free space
    available. For example, we''ve used a bigger storage option on your D drive, named
    Linux Mint, and allocated 25.30GB of space to the virtual hard disk.


    # STEP 10


    Click on the Start button and use the explorer in the "Select-Start Up" window;
    the explorer is highlighted with a green arrow. Click OK to add the new pop-up
    window, download the ISO and click Open to select the ISO. Now click the Start
    button to boot the VM with the Linux Mint Live Environment. You can now install
    Linux as the standard PC installation requirements.


    ![](img/2f5daccbaef9a995b10c4942ee31a6fa_26_3.png)


