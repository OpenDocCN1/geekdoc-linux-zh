- pgno: 39
  md: 'Note that if you mute the speakers (using the Mute option in the Mixer gadget),
    there will be no sound for Audio Recorder to record. To record something without
    having to listen to it, e.g. a radio programme that you want to play back later
    in the car, cut the speakers by inserting a headphone jack into the computer''s
    headphone socket.


    Note also the commands that you can use in the Timer section of Audio Recorder.
    The # symbol''s comment out commands, so delete the # preceding any command you
    want to activate. If you make a change in this section, you must click the Save
    button for it to take effect.


    Note also the Add button alongside the File field. You should only click this
    if you want to append your recording the previously-recorded file recorded.


    # 4.8 eDeB and Chrome


    If you live in the UK and you wish to watch or listen to programs on BBC iPlayer,
    it''s best to use the Google Chrome web browser. Unfortunately you can''t download
    this from AppCenter or Synaptic, instead you have to download it as a .deb file.


    The easiest way to handle .deb files is to use the eDeB package installer. This
    is included in Version 2.4 of Bodhi (you will find it in Main menu > Applications
    > System Tools), but if you happen to be running an earlier version of Bodhi you
    will first have to download it from Synaptic (search for eDeB in the Filter field.)


    Assuming you have eDeB on your system, you can download and install Chrome:


    +   1) Open Firefox and search for Google Chrome. The first hit should be the
    official Google Chrome web page, with a blue ''Download Chrome'' button towards
    the top.


    +   2) Click this button, and at the next screen accept the ''32 bit .deb (for
    Debian/Ubuntu)'' option. Click Accept and Install.


    +   3) At the next dialog box click Ok to save the file. A message will appear
    showing that it is in your downloads (i.e. in your Downloads folder).


    +   4) Go to Main menu > Applications > System Tools and run eDeB. Click the ''Select
    .deb file'' button.


    +   5) At the next screen click the Downloads folder, then highlight the google-chrome_deb
    file and click Ok.


    +   6) At the next screen you will have to wait 30 seconds or so while eDeB downloads
    the package information. Then click Ok.


    +   7) You are invited to run Checks before installing, so click the Checks button.
    Hopefully this will confirm that you are cleared to go.'
  merge: -1
  img_proc: true
