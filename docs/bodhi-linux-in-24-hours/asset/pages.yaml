    # 2.3 Installing some applications: Firefox and Flash


    Part of Bodhi’s design philosophy is to package on the installation CD a minimal
    system that will run on any hardware, however old and underpowered, and to leave
    it to the user to beef it up with whatever additional software he requires. Thus
    Midori is a very lightweight web browser that will run well on any hardware, and
    the Enlightement file manager (EFM) is also very lightweight and fast. It is likely,
    however, that you will want more substantial and capable products, as well as
    your choice of office software, media players, photo and graphics software, and
    some additional utilities. You will be adding all these in due course, but for
    now let’s restrict things to an alternative web browser, an alternative file manager,
    and an alternative terminal.


    To compensate for the paucity of software on the installation CD, the Bodhi website
    provides an excellent ‘AppCenter’ with a comprehensive range of good software
    that can be readily downloaded. To view this, open Midori again (or if you have
    minimized it you should click on its minimized icon which you will see a little
    way down from the top of the shelf). Return to the Bodhi home page (www.bodhilinux.com),
    mouse over Resources again, and this time choose AppCenter from the list.


    It’s worth spending some time perusing what’s on offer at the AppCenter, but for
    now we’ll concentrate on web browsers and the Flash plugin. Flash enables you
    to play videos in your browser, including those from YouTube and so on, for people
    living in the UK, BBC iPlayer. Probably the most popular of the browsers on offer
    is Firefox, and it’s the one I generally use.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Unfortunately Firefox doesn’t always play iPlayer programmes, in particular
    radio programmes, so when visiting iPlayer I prefer to use Google Chrome (not
    Chromium), which is better behaved in this respect. (Flash is built into Chrome,
    whereas it is only a plugin for Firefox.)


    If you are going to download and use Firefox, and I suggest you do (as it has
    SEVERAL ADVANTAGES OVER CHROME, INCLUDING BETTER VIDEO DOWNLOAD FACILITIES), then
    download FLASH PLAYER FIRST. To get to Flash, go down to the INTERNET SECTION
    OF THE APP CENTER AND CHOOSE BROADER PLUGINS. YOU WILL SEE FLASH LISTED ON THE
    NEXT SCREEN, AND YOU SHOULD CLICK ON IT. AT THE NEXT SCREEN, CLICK ‘INSTALL NOW’,
    AND, AFTER QUITE A LONG DELAY WHILE NOTHING SEEMS TO BE HAPPENING, THE DOWNLOAD
    WILL TAKE PLACE FOLLOWED BY THE AUTOMATIC INSTALLATION OF THE PACKAGE.


    INSTALL FIREFOX SIMILARLY, BY RETURNING TO THE MAIN APP CENTER SCREEN AND CHOOSING
    WEB BROWSERS IN THE INTERNET SECTION. EVENTUALLY THE DOWNLOAD AND INSTALLATION
    WILL BE COMPLETE, AND YOU CAN CHOOSE MIDORI. FROM NOW ON WE WILL BE USING FIREFOX.
    (I’LL COVER THE INSTALLATION OF CHROME IN CHAPTER 4.) START FIREFOX NOW:


    +   1) Go to MAIN MENU > APPLICATIONS > INTERNET. You should see FIREFOX WEB BROWSER
    LISTED. IF IT ISN’T, IT MEANS THAT FOR SOME REASON ENLIGHTENMENT HAS NOT UPDATED
    ITS MENUS WITH ITS LATEST ADDITION. IF THIS HAPPENS, OPEN THE MAIN MENU AGAIN
    AND CHOOSE ENLIGHTENMENT > RESTART. THIS WILL UPDATE ALL ENLIGHTENMENT MENUS AND
    GADGETS. (VERY OCCASIONALLY GADGET ICONS MAY GO MISSING FROM SHELVES, AND RESTARTING
    ENLIGHTENMENT WILL PUT THIS RIGHT.)


    +   2) RUN FIREFOX. You may notice that it takes slightly longer than Midori to
    load; this is because it is a more heavyweight product, with more features. Open
    the TOOLS menu; choose ADD-ONS, then PLUGINS. You should see Flash listed there.


    +   3) Now click ‘GET ADD-ONS’. A page will load, showing some of the add-ons
    that are available for Firefox. Towards the bottom right of this page there is
    a link ‘BROWSE ALL ADD-ONS’. Click this. The first page of many pages appears,
    listing some add-ons. The add-on we want to install is called Flash Video Downloader.
    Start typing this into the search box at the top right of the page, then click
    on the link that appears. At the download page that opens for this add-on, click
    the ‘ADD TO FIREFOX’ button, then at the next dialogue box click ‘Install Now’.


    +   4) After this add-on installs, you will be invited to restart Firefox, but
    don’t do so yet. Instead type ‘LUXION’ into the search box. Then click the Luxion
    link that appears. Again add this to Firefox. After this rather add-on has installed,
    you will be invited to restart Firefox—do so now; and then click on the ADD-ONS
    tab and choose EXTENSIONS. You will see that Flash Video Downloader and Luxion
    have been added to your system. This means that you can now download YouTube videos
    (for example).'
  merge: -1
  img_proc: true
- pgno: 15
  md: '5) With **FLASH VIDEO DOWNLOADER** INSTALLED, the LARGE ARROW THAT HAS APPEARED
    AT THE RIGHT OF THE ADDRESS BAR WILL TURN BLUE WHEN YOU PLAY A DOWNLOADABLE VIDEO.
    THIS MEANS YOU CAN CLICK ON IT TO DOWNLOAD THE VIDEO.


    **WARNING:** FIREFOX IS SET TO SAVE ANY DOWNLOADS TO THE DOWNLOADS FOLDER IN YOUR
    HOME DIRECTORY. THAT FOLDER DOES NOT YET EXIST, BUT YOU WILL BE CREATING IT SHORTLY,
    IN SECTION 2.6.


    **NOTE:** ‘DIRECTORY’ AND ‘FOLDER’ MEAN THE SAME THING.


    6) With **LUCIFOX** INSTALLED, A “LUCIFOX” ITEM IS ADDED TO THE TOOLS MENU, AND
    FROM HERE YOU CAN ACCESS THE **LUCIFOX** MANUAL AS WELL AS THE **CATALOGUE BROWSER**.
    NOTE THAT WHEN YOU DOWNLOAD AN EPUB BOOK, IT WILL APPEAR IN THE LUCIFOX WINDOW
    BUT IT WON’T BE SAVED TO YOUR HARD DISK. TO SAVE IT, YOU SHOULD RIGHT-CLICK ANYWHERE
    ON THE TEXT OF THE BOOK AND CHOOSE SAVE AS.


    **NOTE:** IT’S EASY TO REMOVE OR DISABLE ANY OF THESE ADD-ONS, SHOULD YOU SO WISH.
    OPEN FIREFOX’S TOOLS MENU, CHOOSE ADD-ONS TO OPEN THE ADD-ONS MANAGER, THEN CHOOSE
    EXTENSIONS AND SELECT THOSE YOU WANT TO DISABLE.


    7) Try out some of this now. Go to **YouTube**, and pick a video to play. If you
    don’t hear any sound, it means that you will have to adjust the speaker volume:
    click on the loudspeaker gadget in the lower part of the shelf and drag up the
    two sliders. Observe that the download arrow to the right of the address bar has
    turned blue.


    8) Now go to the **Bodhi Linux** website (www.bodhilinux.com) and bookmark it
    (by opening the Bookmarks menu and choosing Bookmark). Now mouse over **Resources**
    and choose **AppCenter**. We are going to install an email client, so go to the
    Internet section of **AppCenter** and click on Email. Three email clients are
    listed, and the choice is yours. I suggest Thunderbird, which is a companion to
    **Firefox**. Make your choice, and at the next screen click on Install Now. The
    Launch Application dialog box opens, asking you to tell Firefox how to handle
    this AppCenter task. You need to tell it once only, and do so proceed as follows:


    +   - a) Click Choose, and at the next screen click on File System.

    +   - b) Scroll down to the ‘usr’ directory and double-click it.

    +   - c) Double-click the bin directory.

    +   - d) Scroll down to ‘apturl’ and click on it.

    +   - e) Click OK.

    +   - f) The Launch Application dialog box reappears, with apturl as the chosen
    application.

    +   - g) Tick the box to the left of Remember my choice for all links, then click
    OK.


    Thunderbird (or whichever email client you chose) will now be installed. It will
    of course need to be configured for your particular email account, and for help
    with this you can use Thunderbird’s own help system: run **Thunderbird**, open
    the Help menu, choose Help Contents, then choose Automatic Account Configuration.


    **Note:** in future I will write instructions like those given in steps (a) to
    (d) simply as ‘Navigate to /usr/bin/apturl’ (The first ‘/’ indicates the root
    (File System) directory. Linux, like the Internet, uses forward slashes to denote
    directories. Windows, per se, uses backslashes.)'
  merge: -1
  img_proc: true
- pgno: 16
  md: "# ## 2.4 Installing Nautilus and Gnome Terminal\n\nThere is only one widely-used\
    \ file manager for Windows, namely, Windows Explorer. With Linux, however, you\
    \ are spoilt for choice. As always when choosing software, you have to strike\
    \ a balance between power and ease of use, and that balance will vary from person\
    \ to person, depending on your needs. The Enlightenment File Manager (EFM) that\
    \ comes with Bodhi Linux is lightweight, good-looking, and easy enough to use,\
    \ but it is lacking in features. Many Bodhi Linux users prefer to use something\
    \ more capable, such as PeManFM or SpaceFM. The latter is very powerful but rather\
    \ daunting, and is too complex for beginners, but PeManFM would be a good choice.\n\
    \nMy personal favourite is Nautilus, which combines good features with ease of\
    \ use, and you need Nautilus on your system if you install Dropbox from the Bodhi\
    \ software repository (more on this later). Nautilus has the slight disadvantage\
    \ that it is designed to run on the Gnome desktop, which means that it has to\
    \ be configured to run properly on Enlightenment.\n\nTo make full use of Nautilus's\
    \ features, you also need to install Gnome Terminal - which is a good choice anyway,\
    \ as it has more features than Terminology. (Terminology is the terminal that\
    \ comes with Bodhi Linux - you used it in Section 2.1, when you carried out the\
    \ preliminary housekeeping tasks.)\n\nIf, after using Nautilus and Gnome Terminal,\
    \ you decide that they are not for you, then you can easily uninstall them and\
    \ switch to alternatives. And if you are installing Bodhi Linux on an old, slow\
    \ computer, you may decide to stick with the lightweight Enlightenment File Manager\
    \ and Terminology, but in this case you should be aware that some of the features\
    \ which Nautilus provides and which are described below will not be available\
    \ to you.\n\n**Note:** The rest of this chapter is devoted to Nautilus and Terminal.\
    \ You don't need to work through all the features described here, and I've marked\
    \ those that are optional which you can return to later. This is especially true\
    \ of the final section of the chapter (2.7), which is for advanced users only\
    \ and can be omitted entirely by everyone else.\n\nYou can't download Nautilus\
    \ and Gnome Terminal from the AppCenter, instead you must use the Synaptic package\
    \ manager, which gives you access to the entire software repository of some 35,000\
    \ packages.\n\n+   1) Go to **Main menu > Applications > Preferences** and run\
    \ **Synaptic Package Manager**.\n+   \n+   2) When Synaptic opens, you will see\
    \ that there is a toolbar at the top with a 'Quick Filter' box and the right of\
    \ it a 'Search' icon. You can use either of these to search for packages: 'Quick\
    \ Filter' is easiest and fast; 'Search' will find all packages which include your\
    \ search term in their accompanying description. You can normally use Quick Filter.\n\
    \n+   3) Type *nautilus* in the **Quick Filter** box, a list of things is displayed\
    \ with 'nautilus' at the top. Click the box to the left of it then click **'Mark\
    \ for Installation'**. \n+   4) The next dialog box tells you that a number of\
    \ dependencies will be installed with it (These include Brasero, which is a useful\
    \ CD/DVD burning program - you will find it at"
  merge: -1
  img_proc: true
