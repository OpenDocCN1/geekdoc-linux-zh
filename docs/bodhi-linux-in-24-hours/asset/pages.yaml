    # 6.5 UNETBOOTIN


    To install your ISO image on a USB stick you need to an application called . This
    is not on your system, so run Synaptic to install it. Like Remastersys, Unetbootin
    will appear in the System Tools section of the menu system.


    +   1) Before running it, you should insert the USB stick in a USB port, and you
    should mount it. (To mount it, simply click on its icon in the Places gadget so
    that Nautilus opens it, then close Nautilus. Alternatively, open your Nautilus
    in the normal way and click on the USB stick in its left pane.)

    +   2) Run Unetbootin, and at its dialog box select the DiskImage option (at the
    bottom left). Then browse to the ISO you saved in the last section - the browse
    button is to the right. When the Browse dialog box opens, click the up-arrow at
    the top, double-click ‘home’ in the list, then ‘remastersys’, then ‘remastersys’
    again.

    +   3) If you think you’ll want to add files later to the USB system that you
    are about to create, then you must allocate space for this. The amount is limited
    by the capacity of your USB stick. For a 4 GB USB stick, you will have to limit
    yourself to around 1500 MB.

    +   4) Click OK, and an image of your system will be installed on your USB stick.
    This process will take several minutes.


    # 6.6 Running Bodhi Linux from a USB drive


    The copy of your system that you’ve installed on the USB stick can be run on any
    computer that will boot from a USB drive. To try this on your computer:


    +   1) Switch off.

    +   2) Make sure the USB stick is inserted in a USB port.

    +   3) Switch on, and while the computer starts up hold down the F12 key. A boot
    up menu'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'should appear. (This assumes your computer uses F12 to do this - a list of
    keys you can use at startup should appear on the screen when the computer fires
    up.)


    4) One of the options should be to boot up from the USB drive. If that option
    is not there, then you can''t boot up from the drive. In that case you have to
    write your ISO image to a **DVD** (using Brasero) and boot from that.


    *Hint:* You can check whether your computer has this option prior to creating
    an installable USB stick by carrying out the above steps with *any* USB stick
    inserted in the USB port.


    5) If the USB option is present, select ‘Boot from the Live System’. Your computer
    will run your Bodhi system and after a few moments your desktop will appear.


    6) Some of the icons are probably missing from the shelf. This always seems to
    happen the first time you use a USB installation. The solution is to *Restart
    Enlightenment* (Main menu > Enlightenment > Restart), which will fix the problem.


    7) When running Bodhi from a USB drive or optical disc, it does not automatically
    connect to the Internet. To connect, Run Everything and type the first letters
    of *network*. Press Enter, and the *network* applet will run. Click on its icon
    (bottom shelf), choose your network from the list, and enter the password.


    8) You are now able to use the system in exactly the same way as if you were *running*
    it from the hard disk, including being able to save files to it (assuming you
    allocated space for this in the previous exercise).


    9) You can also easily access the files on the computer''s hard disk, using the
    Places gadget on the desktop (assuming you put that there in an earlier exercise).
    You will notice that several drives appear on this gadget, including the hard
    disk. Click on the hard disk icon to reveal its contents in Nautilus.


    10) You can if you wish use this USB stick to install your Bodhi system on the
    computer''s hard drive. You might want to do this if the hard drive on your computer
    has become corrupted, or if you want to install your Bodhi system on another computer.
    To do this, Run Everything and type in the first few letters of *Install RELEASE*.
    If the Install RELEASE applet is present on your USB stick, its icon will appear
    in the dialog box and you can press Enter to run it. You can try this now if you
    like - abort the install process by selecting *Quit* at the first dialog box.


    *Note:* If *Install RELEASE* is not present on your USB stick, you can download
    it from `http://packages.bodhinux.com/bodhi/tools/testing/ubuntuquirky`. Choose
    the download called `ubuntuquirky-frontend-gtk_3.12.17-1386.deb`. As this is a
    `.deb` file, you must install it using the *eDeb* utility, as described in Section
    4.8.


    11) To power down, press *Win - End* in the usual way - all the shortcuts you
    set up earlier are available.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 6.7 Future versions of Bodhi Linux


    Like Windows, distros such as Ubuntu and Bodhi Linux bring out new versions every
    couple of years or so. The next major Ubuntu release is scheduled for April 2014,
    and the new Bodhi release (version 3.0) will come out a month or two after that.


    You will not be able to update your existing Bodhi installation to version 3,
    instead you will have to do a fresh install - i.e. you will have to download the
    new disc image, install it on your computer, and repeat everything you have done
    in this guide. The good news is that there is no urgency about this: version 2
    of Bodhi will be supported for a further couple of years.


    When you do make the switch, you must obviously back up all your important data
    files first, as the hard disk on your computer will be reformatted. It might also
    be a good idea to back up your entire system onto an external hard disk or a (large)
    USB stick, as described above, just in case you need to run it again for any reason.


    After that, minor revisions to the Bodhi distro will be released about three times
    a year, but these will be automatically incorporated into your installation when
    you do a sudo apt-get dist-upgrade.


    # 6.8 Conclusion


    We’ve reached the end this guide. You will have realized that there is much more
    to Bodhi and the Enlightenment desktop than is covered here, and as for Linux
    itself I’ve barely scratched the surface. Probably the best way to find out more
    about Linux is to search the web, including ‘ubuntu’ in your search phrase and
    sometimes ‘linux’. There are many guides available there. And as for Bodhi and
    Enlightenment, your main source of help will be the Bodhi website, especially
    the Forum and the Documentation Wiki.


    I’ve replicated the customized Bodhi that’s described in this book, with all its
    tweaks and applications, on the computers of several acquaintances, and if you
    become a Bodhi convert you might do the same (using the USB stick or DVD you created
    in the last section). If so, you might find it useful to provide them with the
    Quick Start Guide below.'
  merge: -1
  img_proc: true
- pgno: 58
  md: "# Quick Start Guide to this Bodhi Linux installation\n\nAll the applications\
    \ on this computer can be accessed via the menu system, which you can open by\
    \ pointing the mouse at any exposed area of the desktop and clicking left.\n\n\
    This installation includes a number of shortcuts to make life easier:\n\n+   -\
    \ Frequently-used applications such as the web browser are located on the shelf\
    \ at the left. Simply click on the appropriate icon to run these.\n+   - Other\
    \ favourite applications can be found on the Favorites menu, which is reached\
    \ by pointing the mouse at a blank area of the desktop and clicking right.\n+\
    \   - Keyboard shortcuts, such as Win + End to shut down the computer (i.e. hold\
    \ down the Windows key and tap End).\n\n+   - Mouse actions to manipulate windows:\n\
    +   \t- Click the top-right corner of the screen to close the current (focused)\
    \ window.\n+   \t- Click the top edge of the screen to maximize the window (click\
    \ again to undo this).\n+   \t- Click the bottom edge of the screen to minimize\
    \ the window.\n+   \t- Click the top left corner to set the window fullscreen\
    \ (click again to undo).\n+   \t- Click the left edge of the screen to left-maximize\
    \ the window (click again to undo).\n+   \t- Click the right edge of the screen\
    \ to right-maximize the window (click again to undo).\n+   \t- Click the bottom-right\
    \ corner of the screen to show the desktop.\n\nThe Nautilus file manager is included\
    \ in this installation. Its icon is located at the top of the shelf. When Nautilus\
    \ opens, you can press the F3 key to display a second pane; this simplifies the\
    \ task of copying or moving files from one location to another (right-click the\
    \ file and choose e.g. Copy to other pane). Nautilus also makes it easy to access\
    \ other computers connected to your network - Choose Browse network in its left\
    \ pane.\n\nThe applications installed on this system include Firefox web browser,\
    \ Thunderbird email client, LibreOffice office suite (the Linux alternative to\
    \ Microsoft Office), Osmo personal information manager (calendar, diary, notes,\
    \ contacts, todo list), VLC video player, Audacious music player, an audio recorder,\
    \ Mirage for photos, as well as Skype and Dropbox. You can add others by visiting\
    \ the AppCenter at the Bodhi Linux website (http://appcenter.bodhilinux.com/).\
    \ If a package that you want isn’t listed here, search for it using the Synaptic\
    \ Package Manager (on the Favorites menu).\n\nThe terminal is the second icon\
    \ down on the shelf. Use this to enter any commands; in particular the commands\
    \ to keep your system and its software up to date. To keep things easy, these\
    \ commands have been simplified on this system, so all you have to do is:\n\n\
    +   1) Enter update to synchronize your system file index with the on-line database\
    \ (you must be connected to the Internet for this and the next command to work)."
  merge: -1
  img_proc: true
