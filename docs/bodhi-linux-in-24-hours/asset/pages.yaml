- pgno: 22
  md: '# SEARCHING FOR FOLDERS AND FILES [OPTIONAL]


    Nautilus has a handy Search facility, accessed via the Search icon at the right
    of the toolbar. The main thing to remember is to start your search at the directory
    in which the sought folder or file lies. Thus if you are seeking a document or
    data file that''s somewhere in your Home directory, you should start at that directory;
    if, however, it is somewhere within the root file system, you should start your
    search at the root directory. If, you should click ''File System'' in the sidebar
    before you click ''Search''.


    TRY THIS NOW, BY SEARCHING FOR ALL .DESKTOP FILES IN YOUR FILE SYSTEM.


    +   1) Run Nautilus, and click ''File System'' in the sidebar.

    +   2) Click ''Search'', and enter DESKTOP in the Search field. After a while
    all the desktop files will appear, listed with their locations.


    Notice that when the search begins, a toolbar opens below the Search field. If
    you click the green ~ symbol at the right, a box opens that allows you to specify
    the file type. It is set to ''Any''; but if you click on its arrow, you are taken
    to a range of common types, and if you click on ''Other Type'' a huge range of
    possibilities appears. You''ll use this feature in your next search.


    Search for all pictures in your Home directory:


    +   1) Click ''Home'' in the sidebar.

    +   2) Click ''Search'', then enter a dummy term in the Search field, such as
    123.

    +   3) When the search begins, click the green ~ symbol, then choose ''Picture''
    in the File Type box.

    +   4) In the Search field, delete the dummy term and type instead a single space.
    This acts as a wildcard, causing Nautilus to search for all filenames.

    +   5) Click the Reload button, and Nautilus will perform the search, locating
    the wallpaper picture you downloaded earlier.


    # CONNECTING TO OTHER COMPUTERS ON YOUR NETWORK [OPTIONAL]


    Nautilus makes accessing other (Windows) computers connected to your network particularly
    easy. Simply click on ''Browse Network'' in the sidebar, and after a few seconds
    the name of any computer which is connected and switched on should show up, and
    you should have immediate access to the public folders on its file system. (If
    this access is denied, you will need to go to that computer and check its sharing
    options at the Network and Sharing Center of the Control Panel. You should also
    right-click on the Public ''Documents'' folder and select Properties, then the
    Sharing tab, and check the entries here.)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# SAFELY REMOVING USB MEMORY STICKS


    LINUX WILL READ YOUR USB MEMORY STICKS (PEN DRIVES) JUST AS HAPPILY AS WINDOWS
    WILL. IF YOU INSERT A USB STICK (OR ANY OTHER STORAGE DEVICE) IN A USB PORT OF
    YOUR COMPUTER, ITS ICON WILL APPEAR AT THE TOP OF THE NAUTILUS SIDEBAR, AND YOU
    CAN ACCESS ITS CONTENTS BY CLICKING THIS.


    TO SAFELY REMOVE THE USB STICK FROM YOUR COMPUTER, YOU SHOULD RIGHT-CLICK ITS
    ICON IN THE NAUTILUS SIDEBAR AND CHOOSE THE EJECT OPTION FROM THE CONTEXT MENU.


    # SETTING NAUTILUS AND TERMINAL AS DEFAULT APPLICATIONS


    OUR FINAL TASK IN THIS SECTION IS TO SET NAUTILUS AS THE DEFAULT FILE MANAGER,
    AND GNOME TERMINAL AS THE DEFAULT TERMINAL.


    +   1) GO TO MAIN MENU > SETTINGS > ALL > APPS > DEFAULT APPLICATIONS.


    +   2) AT THE DIALOG BOX THAT OPENS, THE DEFAULT BROWSER SHOULD ALREADY BE SET
    TO FIREFOX, BUT YOU WILL NEED TO HIGHLIGHT FILE IN THE LEFT PANE THEN SCROLL DOWN
    TO AND HIGHLIGHT NAUTILUS IN THE RIGHT PANE, THEN CLICK APPLY.


    +   3) THEN HIGHLIGHT TERMINAL IN THE LEFT PANE AND TERMINAL IN THE RIGHT PANE,
    AND APPLY.


    +   4) CLICK CLOSE.


    THE REST OF THIS CHAPTER COVERS MORE ADVANCED TOPICS AND CAN BE OMITTED OR RETURNED
    TO LATER. SO YOU CAN NOW IF YOU WISH JUMP TO CHAPTER 3, *TURBOCHARGE YOUR DESKTOP*.


    # 2.7 RUNNING NAUTILUS AS SUPERUSER


    SOMETIMES, AS IN THE NEXT SECTION, IT''S HANDY TO RUN NAUTILUS AS A ‘SUPERUSER’
    WITH ADMINISTRATIVE PRIVILEGES, AS THIS ALLOWS YOU TO MAKE CHANGES TO PROTECTED
    SYSTEM DIRECTORIES. TO DO SO, YOU MUST RUN NAUTILUS AS ‘ROOT’. NEEDLESS TO SAY,
    YOU MUST TAKE GREAT CARE WHEN RUNNING NAUTILUS THIS WAY, AS YOU COULD WRECK YOUR
    SYSTEM.


    THE MOST CONVENIENT WAY TO RUN NAUTILUS AS SUPERUSER WILL BE VIA THE MENU SYSTEM,
    AND TO SET THIS UP YOU MUST CREATE A PERSONAL APPLICATION LAUNCHER FOR IT.


    +   1) GO TO MAIN MENU > SETTINGS > ALL > APPS > PERSONAL APPLICATION LAUNCHERS.


    +   2) AT THE PERSONAL APPLICATION LAUNCHER DIALOG BOX CLICK ADD.


    +   3) AT THE NEXT DIALOG BOX TYPE Nautilus as Root IN THE NAME FIELD


    +   4) TYPE gksudo "nautilus %U --no-desktop" IN THE APPLICATION FIELD (NOTE THE
    QUOTE MARKS - THEY ARE ESSENTIAL.)


    +   4) CLICK THE GENERAL TAB AND IN THE CATEGORIES FIELD TYPE Utility... THIS
    TELLS ENLIGHTENMENT'
