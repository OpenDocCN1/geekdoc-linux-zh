    +   1) CLICK THE SETTINGS GADGET ON THE PANEL. THE SETTINGS WINDOW OPENS, WHICH
    YOU MAY WANT TO MAXIMIZE. NOW, ALL THE DIFFERENT SETTINGS POSSIBILITIES THAT YOU'
