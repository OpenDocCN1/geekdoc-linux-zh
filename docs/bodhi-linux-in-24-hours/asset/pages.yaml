- pgno: 52
  md: '# 6 *Maintain and replicate your system*


    This final chapter covers tasks that you should carry out periodically to freshen
    up your system. These tasks are not onerous, and will involve only a few minutes
    of your time.


    We also discuss how to replicate your system on an optical disk or USB stick,
    so that it can be run on other computers and even installed on them.


    # 6.1 Aliases


    One or two of these maintenance tasks involve entering some long-winded commands
    into Terminal, like `sudo apt-get dist-upgrade` to upgrade any out-of-date software.
    This is a pain to type and an even bigger pain to remember. Wouldn''t it be nice
    to be able to type simply `upgrade` instead? By setting up aliases we can do just
    that.


    Aliases are stored in the .bashrc file in your home directory. To create some,
    you must open this file in Leafpad.


    **Hint:** Before setting up an alias, you should first check that your proposed
    word isn''t an existing command. Do this by entering it in Terminal; if the response
    is `command not found`, you''re good to go.


    +   1) Open Terminal, then enter `gksudo leafpad .bashrc`. (Note the `.` at the
    start of the filename: this is a hidden file.)


    +   2) With this file displayed in Leafpad, scroll down almost to the bottom of
    it, and after the section headed `# some more ls aliases` insert the following:


    ```

    `# My aliases`

    `alias leaf=''gksudo leafpad''`

    `alias upgrade=''sudo apt-get dist-upgrade''`

    `alias upgrade=''sudo apt-get dist-upgrade -y''`

    `alias remove=''sudo apt-get autoremove''`

    ```


    (Note the `-''y''` at the end of the third command. This bypasses the need to
    type `''y''` when, after running the `dist-upgrade` command, you are asked to
    confirm that you want to replace any out-of-date files.)


    If you installed Get-i-Player in the Chapter 4, you may want to add to this list
    the following alias:


    ```

    `alias get=''get-i-player''`

    ```


    +   3) Save the file, close Leafpad, and close Terminal.


    To activate these aliases, you need to reboot the computer. Do so now, as you
    will be trying some of them in the next section.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 6.2 Updating your system


    You should update your system every month or so, to keep everything on it up to
    date. With the aliases you set up above in place, this is very easy:


    +   1) Open Terminal, and enter update. The database on your system will synchronized
    with the repository.


    +   2) Enter upgrade. Any out-of-date files on your system will be upgraded to
    the latest versions.


    +   3) When this finished, it might be worth getting rid of any accumulated junk
    on your system. Then remove, then press ''y'' at the prompt.


    # 6.3 Cleaning your system


    Once every few months you should carry out a thorough clean of your system. This
    can be done using an application called Bleachbit. Bleachbit is not on your system,
    but you can install it from Synaptic. Do so now.


    When the installation is finished, two entries will have been added to the System
    Tools section of your menu system:


    +   - ''Bleachbit'', which cleans user files.

    +   - ''Bleachbit as root'', which cleans system files.


    +   1) Run Bleachbit now (Main menu > Applications > System Tools, or use Run
    Everything). Its window opens, with various categories of file to clean listed
    at the left. Select them all except the following:


    +   - The Deep scan options (these are slow);

    +   - Passwords (in the Firefox section);

    +   - Free disk space, Localizations, and Memory in the System section (the first
    two are slow, and Memory is experimental).


    +   2) Click Preview, and a (long) list of files to be deleted appears.


    +   3) Click Clean, and in moments the job is done.


    ''Bleachbit as root'' is used in the same way.


    # 6.4 Backing up with Remastersys


    You should of course keep backups of important documents and photos on an external
    storage device or on Dropbox. Nautilus, with its twin panes and ''Copy to other
    pane'' facility, makes this easy.


    Backing up your entire system is another matter. however, and one way to do this
    is to use a'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'program called . This allows you to create an image (ISO file) of your system,
    including all your customizations and, if you wish, your documents, photos, and
    other data files, which you can then install on an optical disc (a recordable
    DVD) or on a USB memory stick (pen drive). With this DVD or USB stick you can
    run, and if necessary install, your system on any computer.


    Remastersys is on your system, and it can be run from Terminal, but it will make
    life easier in the future if you set up a personal application launcher for it.


    +   1) Run Eversthang and enter the first four letters of *personal*. The Personal
