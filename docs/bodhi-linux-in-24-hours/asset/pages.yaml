    # 4.7 OSMOMA AUDIO RECORDER


    THIS ALLOWS YOU TO RECORD ANYTHING THAT’S PLAYED THROUGH THE SPEAKERS OF YOUR
    COMPUTER, INCLUDING RADIO PROGRAMMES. YOU WON’T FIND THIS APPLICATION IN APPCENTER
    OR SYNAPTIC, INSTEAD YOU WILL HAVE TO INSTALL IT FROM A PPA.


    PPAs ARE UNOFFICIAL REPOSITORIES FOR SPECIFIC PACKAGES, AND THEY CANNOT NECESSARILY
    BE TRUSTED. SO IF INSTALLING FROM A PPA, YOU DO SO AT YOUR OWN RISK; HAVING SAID
    THAT, I HAVE NOT EXPERIENCED ANY PROBLEMS WITH THE PPA’S REFERRED TO IN THIS GUIDE.


    OSMOMA AUDIO RECORDER IS DESCRIBED AT HTTP://IT’SF OSS.COM/RECORD-STREAMING-AUDIO...
    . TO INSTALL IT, YOU MUST OPEN TERMINAL AND ENTER THE FOLLOWING COMMANDS:


    ```

    ```bash

    SUDO ADD-APT-REPOSITORY PPA:OSMOMA/AUDIO-RECORDER

    SUDO APT-GET UPDATE

    SUDO APT-GET INSTALL AUDIO-RECORDER

    ```

    ```


    (THESE COMMANDS ARE GIVEN ON THE ABOVE WEB PAGE, AND YOU MAY FIND IT EASIEST TO
    COPY AND PASTE THEM FROM THERE INTO TERMINAL.)


    AUDIO RECORDER CAN RECORD IN A NUMBER OF FILE FORMATS, BUT NOT MP3. IF YOU WANT
    TO ADD MP3 CAPABILITY TO IT, YOU MUST ALSO INSTALL A PLUGIN CALLED ‘10-PLUGINS-UGLY’
    (USE SYNAPTIC FOR THIS).


    TO TEST AUDIO RECORDER, RUN IT (YOU WILL FIND IT AT APPLICATIONS > SOUND & VIDEO),
    AND WHEN IT OPENS:


    +   1) IN THE FORMAT FIELD SELECT A SUITABLE FORMAT (E.G. MP3 IF YOU HAVE DOWNLOADED
    THE ABOVE GSTREAMER PLUGIN).


    +   2) PLAY SOME AUDIO CONTENT THROUGH YOUR COMPUTER AND PRESS THE START RECORDING
    BUTTON. A BLUE AUDIO VISUALISATION BAR SHOULD APPEAR ALONGSIDE THE RECORDING BUTTON,
    SHOWING THAT THE AUDIO IS BEING RECORDED.


    +   3) PRESS STOP RECORDING, AND THE RECORDED FILE WILL BE SAVED IN THE AUDIO
    FOLDER. (THIS FOLDER WILL HAVE BEEN CREATED DURING THE INSTALLATION; IF IT WASN’T
    ALREADY PRESENT IN YOUR HOME DIRECTORY.)


    +   4) TEST THE RECORDING BY OPENING AUDACIOUS (IF YOU INSTALLED IT IN SECTION
    4.2), ADDING THE NEW FILE TO ITS PLAYLIST, THEN PLAYING IT. ALTERNATIVELY YOU
    CAN PLAY IT IN VLC.'
