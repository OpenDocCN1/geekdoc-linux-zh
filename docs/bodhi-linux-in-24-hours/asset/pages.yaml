    # 3.7 Edge Bindings


    Edge bindings specify the actions that occur when you click the mouse on different
    parts of the screen edge. To set these up:


    +   1) Run Everything, and type the first three letters of *edge bindings*. The
    Edge Bindings icon is highlighted. Press Enter, and the Edge Bindings Settings
    dialog box opens.


    +   2) Click **Add**, and you are taken to the Edge Binding Sequence dialog box.
    You''ll begin by creating a binding for the top right corner of the screen, so
    click the brown box at this corner.


    +   3) Click *clickable edge*, then click **Apply**.


    +   4) You now have to assign an action to this binding. In the right-hand action
    pane, scroll down to the ''Window : Actions'' section (about two thirds of the
    way through the huge list of possibilities) and highlight ''Close''.


    +   5) Click **Apply**. Now, whenever you click on the top-right corner of the
    screen, the currently-focused window will close. This is equivalent to clicking
    the ''x'' button at the top right corner of the title bar. (Those tiny title bar
    buttons are fiddly, zipping the mouse up to the top right of the screen is much
    easier).


    +   6) Click **Add** again, and now, in the Edge Binding Sequence dialog box,
    click on the top edge of the picture of the screen. The Clickable Edge option
    should have been automatically selected, so click **Apply**.


    +   7) In the right pane scroll down to the ''Window : State'' section, highlight
    ''Maximize'', then click **Apply**. Now, whenever you click on the top edge of
    the screen, the currently-focused window will be maximized. This is equivalent
    to, but easier than, clicking the ''+'' button at the right of the title bar.
    Note that to unmaximize the window, simply click the top edge of the screen again.


    +   8) Click **Add** again, click the bottom edge in the ''Edge Binding Sequence''
    box, then'
