    NOTE THE `-HELP` ARGUMENT: THIS WILL LIST ALL THE ARGUMENTS THAT ARE AVAILABLE
    FOR A COMMAND TOGETHER WITH A BRIEF EXPLANATION OF EACH. SO TO LIST ALL THE ARGUMENTS
    THAT YOU CAN USE WITH `GET-PLAYER`, ENTER `GET-PLAYER -HELP` IN TERMINAL.


    # ### 4.10 Other applications


    There will of course be other applications that you will want on your computer.
    The best place to see popular choices is AppCenter, where you will find games,
    educational software, communication software, and much else besides. Here are
    a few suggestions.


    +   1) If you want to read documents in PDF format, you will need a suitable reader.
    There is Adobe PDF reader, or you might prefer Evince, which will read documents
    in various formats. Look for PDF readers in the Office section of AppCenter.


    +   2) If you want to edit audio files, you will want Audacity, available at the
    AppCenter.


    +   3) If you want to connect your computer to a projector to give a presentation,
    or perhaps to a TV, you will need to use xrandr. This comes with the Bpodii system,
    but it is a command line utility, meaning that you have to configure it using
    Appropriate Terminal commands. However, a friendly graphical front-end is available,
    which allows you instead to make configuration choices from a menu. This front-end
    is called aRandR, and you can download it from Synaptic. After downloading, it
    will show up in your Preferences menu.


    > *Note: To use aRandR*


    +   a) Connect your computer to the projector and switch everything on.


    +   b) Run aRandR, open the Outputs menu, and match the resolution of your computer
    (LVDS) with that of the projector (probably VGA1).


    +   c) Click Apply.


    +   4) If you are into eBooks, you will probably want Calibre, available at the
    AppCenter.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '5) It is even possible to run a number of Windows applications using a Windows
    emulator such as Wine (available at the AppCenter). You can see a list of what
    will run flawlessly under Wine (mostly games) by visiting Wine HQ at http://appdb.winehq.org/.
    If you are into e-books, it’s worth noting that Adobe Digital Editions will also
    run under Wine. However, you should be aware that Wine is a hefty package which
    will add a lot of baggage to your system.


    # 4.11 Uninstalling applications


    Anything that you have installed from AppCenter or Synaptic can be uninstalled
    by running Synaptic, searching for the application’s name, and ticking its box.
    (The box will be coloured rather than blank if the application is installed on
    your system.) Choose ‘Mark for Complete Removal’ from the menu then click Apply.
    The application and its dependencies will be removed.


    In spite of this, there will be unwanted files left on your system, and you can
    clear these out by opening Terminal and entering the following command:


    ```

    sudo apt-get autoremove

    ```


    You will already have accumulated some clutter on your system, so it’s worth running
    this command now.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 5 More power to your desktop


    In this chapter you''ll organize your desktop and its menus so that the applications
    you installed in the last chapter are at your fingertips, you''ll learn about
    virtual desktops, you''ll apply a GTK theme to your application windows, and you''ll
    try different E17 themes. Then you''ll practise what you''ve learned by creating
    a new profile.


    # 5.1 Update your iBar


    Let''s begin by updating your iBar to reflect the applications you added in the
    last chapter.


    +   Right-click on the iBar area of the shelf, mouse over iBar, and choose Contents.


    +   In the iBar Applications dialog box, you might want add LibreOffice (choose
    the first LibreOffice entry) and Osmo, and I suggest you remove Synaptic (you''ll
    be adding this to the Favorites menu shortly). If you don''t want these, choose
    a few other applications you are likely to frequently use.


    +   Click the Order tab, change the order to what you want, and click OK.


    Your iBar will be updated with these changes.


    # 5.2 An iBar on the desktop


    If you followed the suggestions made in the last chapter, you will have added
    a number of media applications to your system. You might find it helpful to group
    these on another iBar.


    +   Go to Main menu > Settings > Gadgets. The Desktop Gadgets dialog box opens,
    where you should highlight ''Background'' then click ''Configure Layer''.


    +   The list of gadgets appears. Highlight iBar and click Close, then Close again.
    The iBar appears on your desktop, with a white border. It also contains the application
    icons from your original iBar; we''ll change these shortly.


    +   Use the mouse to move your new iBar to a suitable location on the desktop,
    and drag on one of its vertical borders to widen it. (You will refine these adjustments
    shortly.)


    +   Right-click on the iBar, then mouse over ''iBar'' and choose ''Settings''.


    +   In the iBar Settings dialog box click Add, then enter a suitable name for
    the source. You might call it media. Click OK.


    +   Highlight the name of your new source in the Source list, and click Setup.
    The iBar Applications dialog box will appear. (If this dialog box is rather small
    and cramped, remember the key binding you set up in Chapter 3 to rectify this:
    press Win + m to maximize it vertically.)'
  merge: -1
  img_proc: true
- pgno: 44
  md: '7) Remove the application icons that are currently populating this iBar (by
    clicking in turn the orange buttons and ‘Remove’), and add the media applications
    you have installed: Audacious, Audio Recorder, and VLC. You might wish to add
    the Braser o disc burning program here too.


    8) Click the Order tab, and put these in the order you want, then click OK, and
    OK again. The icons for the packages you selected will appear in your new iBar.


    9) Right-click on one of these icons, mouse over ‘iBar’, then choose ‘Begin move/resize’.
    You can now drag on a vertical border to make it fit snugly around the icons,
    and you can move it to the exact position you want on the desktop. When you’ve
    finished right-click again.


    10) Your new iBar has a border round it. To remove this, right-click on it again,
