    dialog box.


    If, having reached the end of this chapter, you wish to turn off your computer,
    remember your shortcut: press Win + End.'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# 4. Beef up your System\n\nBy the time you reach the end of this chapter you\
    \ will have installed most of the applications you are likely to need. If you\
    \ are new to Linux, the problem will be which out of the many possibilities should\
    \ you choose? Sometimes the choice will be clear-cut, and in many cases there\
    \ will be a Linux version of favourite software that you previously ran under\
    \ Windows.\n\nVLC, for example, is the standard public domain (i.e. free) media\
    \ player, both in Windows and Linux, and LibreOffice is the standard public domain\
    \ office suite for both Windows and Linux. Other choices are not so clear-cut,\
    \ and some that I suggest may not be the best for you. And if your computer is\
    \ old and underpowered, this will limit your choices to lightweight applications.\n\
    \nYour best policy is to try out one or two alternatives; it's easy enough to\
    \ uninstall those you don't want and install others. (As in Windows, there may\
    \ be some baggage left behind when you uninstall applications; you will learn\
    \ how to remove this and tidy up your system in Chapter 6.)\n\nWhenever possible,\
    \ you should install applications from the Bodhi AppCenter rather than Synaptic.\
    \ To uninstall applications, use Synaptic.\n\n# 4.1 Office applications\n\nMicrosoft\
    \ products, including Microsoft Office, do not work in Linux, however, makes a\
    \ good replacement, and it is used in a number of schools, government offices,\
    \ and businesses (though usually on Windows computers). Its Writer instead of\
    \ Word, Calc instead of Excel, Impress instead of PowerPoint, and Base instead\
    \ of Access. It also includes Draw, a drawing program. I can read any documents\
    \ saved in Microsoft Office format, and it can export documents to that format.\
    \ I'm using LibreOffice Writer (running under Bodhi Linux) to write this book.\n\
    \nOf course, if your only requirements office-wise is to produce the occasional\
    \ letter, there is not much point installing something as heavyweight as LibreOffice.\
    \ The Abiword word processing package would be much more appropriate.\n\nCups\
    \ is the printing package used by applications that offer a Print option, and\
    \ if you are going to want to print from your computer you will need to install\
    \ this.\n\nLibreOffice and Cups must be installed from AppCenter; otherwise you\
    \ will not download all the components needed to run them. Abiword can be installed\
    \ either from AppCenter or Synaptic.\n\n+   1) Go to the Bodhi Linux website (www.bodhilinux.com)\
    \ and navigate to the AppCenter.  \n+   2) In the Office section choose 'Office\
    \ Suite' and then LibreOffice. Click 'Install Now'. The installation will take\
    \ a minute or two. If you choose to install Abiword instead of LibreOffice,"
  merge: -1
  img_proc: true
- pgno: 35
  md: 'you will find it in the Office section under ''Word Processor''.


    +   3) To install Cups, return to the AppCenter and from the Office section choose
    ''Printing and Scanning'', then Printing, and click ''Install Now''.


    +   4) LibreOffice and Cups will have been added to your menu system, the former
    at Main menu > Applications > Office and the latter at Main menu > Applications
    > Preferences. Note that you will not see Cups listed by name, instead it will
    be called ''Printing''.


    You can now install your printer:


    +   1) Make sure your printer is switched on and connected either directly to
    your computer or to the network. For example, it could be connected to a Windows
    computer which is itself connected to the network.


    +   2) Run ''Printing'' either from the menu system or via Run Everything (type
    the first few letters of printing and press Enter). The Printing window opens,
    where you can click Add to add your printer.


    +   3) The Select Devices dialog box opens, where you can choose the appropriate
    option. For example, if the printer is connected to another Windows computer on
    the network, select ''Network Printer'' and then ''Windows Printer via SAMBA''.
    Then click Browse and double-click the entries that appear (e.g. WORKGROUP, then
    the name of the Windows computer). Your printer should appear in the dialog box:
    highlight it and click OK.


    +   4) Click Forward, then select your printer''s make from the list that appears,
    then Forward again and choose the model. Choose the recommended driver, click
    Forward, then Apply.


    +   5) You are invited to print a test page. Assuming this is satisfactory, click
    OK, then close the Printing window.


    +   6) Now run LibreOffice Writer (or Abiword), open the File menu, and choose
    Print. You should see your printer highlighted in the Printer dialog box. If so,
    all''s well and you can click Cancel, then close Writer.


    # 4.2 Media players


    VLC is the standard application for playing media files, especially video files,
    as it handles many different file types and is able to convert between one type
    and another, should you wish to do this. If you wish to play DVDs, you will need
    to download also a plugin called ''VLC'' and this plugin are both available at
    the AppCenter (the latter under the listing ''DVD Playback).


    Besides movies, VLC can be used for playing music and other audio files, though
    you may find it more convenient to use a dedicated audio player such as Audacious
    for this.


    You should download these applications now from the AppCenter, where you will
    find them in the Multimedia section under the headings ''Video Player'', ''Codes'',
    and ''Audio Player''.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '(You may of course wish to download one or more of the alternatives on offer.
    Or you can stick with my recommendations are try others later.)


    **Note:** You can speed up the installation of multiple packages if, after downloading
    the first package, you choose \u201cQuick install\u201d instead of \u201cInstall
    Now\u201d at the installation page. This bypasses the \u201csudo apt-get update\u201d
    which synchronizes the database of file news on your computer with the repository
    database. Having synchronized this for the first package, there is no need to
    synchronize again for the rest.


    # ### 4.3 Photo applications


    If all you want to do is to view your photos, perhaps as a slide show, together
    with some very basic editing facilities, then Mirage is a very user-friendly choice.
    For more editing options as well as photo management capabilities, you might like
    to try Shotwell, either as an alternative to Mirage or in addition to it. Or perhaps
    you wish to install alongside Mirage a drawing package that can handle photos,
    in which case try Pinta. If, however, you want a really powerful photo editor
    along the lines Photoshop, try Gimp.


    Install one or more of these now from the Graphics section of AppCenter.


    # ### 4.4 Dropbox


    Dropbox allows you to store important files in a secure location on the Internet.
    If you have Nautilus on your system, I suggest you install it using Synaptic,
    otherwise install it from the AppCenter (you will find it under Cloud, in the
    Internet section), though note that this will only install part of Dropbox. To
    install the remainder:


    +   1) Go to Main menu > Applications > Internet > Dropbox.


    [2] If, at the dialog box that opens, a message appears warning you that python-gpgme
    is not installed, close the dialog box and install this utility now. (You will
    not see this warning if you installed it as part of the initial exercises in Chapter
    2.) When the installation of python-gpgme is complete, run Dropbox again, and
    at this time there should be no warning.]


    +   3) Click OK at the dialog box. The full Dropbox package will now be installed,
    and you will be taken to the Dropbox Setup dialog box where you can open a Dropbox
    account. Note that you are allowed 2 Gb of free Dropbox storage, and once you
    have opened an account you can add to that free storage by recommending Dropbox
    to others.


    If you don\u2019t want to open an account right now, close the dialog box.


    # ### 4.5 Osmo personal organizer


    If you want a calendar/diary, contacts list, notepad, and to-do list in one handy
    package, then I think Osmo is good choice. You won\u2019t find it in the AppCenter,
    instead you will have to download it from Synaptic (type *osmo* into Quick Filter
    and click its box when the list of its appears, then Apply). After Osmo installs,
    there are a number of settings I recommend you'
  merge: -1
  img_proc: true
