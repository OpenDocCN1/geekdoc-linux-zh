    **bobhj32** by your username).

    +   2) Click the Actions tab, close all open windows (apart from the Remastersys
    window) and click Backup. Remastersys will then set to work creating the ISO image
    of your system, a process that will take about an hour.


    The ISO file will be located in the /home/remastersysy directory. To see it, run
    Nautilus, click the box at the left of the toolbar (to the left of ''Home'' -
    the box is marked with a small left-'
