    OPTIONS SUCH AS `-GET` AND `-TYPE` THAT YOU CAN ADD TO A COMMAND ARE CALLED ARGUMENTS
    OR SWITCHES. THERE ARE MANY ARGUMENTS THAT YOU CAN USE WITH `GET-PLAYER`, AND
    FOR FULLER INSTRUCTIONS THAN ARE POSSIBLE HERE YOU SHOULD SEARCH THE WEB FOR `GET-PLAYER
