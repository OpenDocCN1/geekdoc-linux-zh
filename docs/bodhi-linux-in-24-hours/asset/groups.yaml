  - '[PAGE 25]


    THE DESKTOP ENTRY EDITOR OPENS.


    +   2) OPEN THE ICON TAB, THEN CLICK ON THE ICON ITSELF. A NEW DIALOG BOX OPENS
    WHICH

    +   ALLOWS YOU TO NAVIGATE TO YOUR CHOSEN ICON.


    +   3) CLICK ON ROOT IN THE LEFT PANE, THEN IN THE RIGHT PANE NAVIGATE TO

    +   `/USR/SHARE/ICONS/MAXO-REMIX/APPS`


    +   4) SCROLL DOWN TO `NAUTILUS.PNG` AND CLICK OK.


    +   5) BACK AT THE DESK ENTRY EDITOR CLICK APPLY.


    +   6) CLOSE NAUTILUS.


    THE ICON ON THE DESKTOP SHOULD HAVE CHANGED TO A MORE PLEASING IMAGE.


    # ## 2.9 HIDDEN FILES


    JUST AS MOST OF THE STUFF IN THE UNIVERSE IS INVISIBLE DARK MATTER, SO THE MAJORITY
    OF

    DIRECTORIES AND FILES IN YOUR Home DIRECTORY ARE HIDDEN. TO SEE THESE, DOUBLE-CLICK

    YOUR NEW DESKTOP ICON TO RUN NAUTILUS, THEN PRESS Ctrl + H OR OPEN THE VIEW MENU

    AND CLICK ''SHOW HIDDEN FILES''. YOU WILL SEE THAT THERE ARE QUITE A FEW HIDDEN

    FOLDERS IN YOUR Home DIRECTORY, AND THERE WILL BE MANY MORE WHEN YOU''VE FINISHED

    INSTALLING THE VARIOUS APPLICATIONS IN THE NEXT CHAPTER. NOTICE THAT THESE HIDDEN

    FILES AND DIRECTORIES ARE ALL PREFIXED WITH A `.`


    PERSONAL APPLICATION LAUNCHERS ARE STORED IN THIS HIDDEN PART OF YOUR Home

    DIRECTORY, IN THE `LOCAL/SHARE/APPLICATIONS` FOLDER. HAVE A LOOK AT IT:


    +   1) NAVIGATE TO THAT FOLDER NOW, AND OPEN TERMINAL.


    +   2) ENTER `LS` TO LIST THE FILES IN THE FOLDER. ONE OF THEM IS

    +   `NAUTILUS_AS_ROOT.DESKTOP`.


    +   3) ENTER `leafpad Nautilus_as Root.desktop` (REMEMBER YOU CAN COPY-AND-PASTE
    THE FILENAME

    +   INTO THIS COMMAND).


    +   4) THE TEXT OF THE LAUNCHER SHOULD BE DISPLAYED.


    +   5) CLOSE LEAFPAD, AND CLOSE TERMINAL.


    +   6) IN NAUTILUS, RETURN TO YOUR Home DIRECTORY (BY CLICKING HOME IN THE TOOLBAR),

    +   AND PRESS Ctrl + H AGAIN TO TURN OFF THE HIDDEN FILES VIEW.


    +   7) FINALLY CLOSE NAUTILUS.'
  - '[PAGE 26]


    # 3 TURBOCHARGE YOUR DESKTOP


    If you have got heartily sick of navigating through endless choices in the menu
    system, then this chapter is for you. By the end of it you should have an appreciation
    of the full flexibility and speed of the Enhanced Windows desktop system. For
    you will have set it up to run applications and change settings by just one or
    two clicks of the mouse. You will even have speeded up and simplified the way
    you use the mouse to maximize, minimize, close and otherwise manipulate windows.
    The pain of accurately settling on those tiny buttons at the right of the title
    bar will be a thing of the past!


    You will achieve all this by setting up and populating shelves and iBars, and
    by setting up deco bindings. Other topics covered here include using Run Everything,
    loading modules (including the Places Module), and using gadgets. This will prepare
    your desktop environment for the next chapter, where you will be downloading the
    applications you need to handle office work, manipulate photos, play media files,
    and so on.


    > Hint: You will be opening a number of windows and dialog boxes as you work through
    this guide. If one of these extends off the edge of the screen and you want to
    bring it into view, hold down the Alt key while dragging it with the mouse. (Of
    course, if the window has a visible title bar you can instead drag on that.)


    # 3.1 A FIRST LOOK AT SHELVES AND I BARS


    We''ll begin by customizing the existing shelf at the left of your desktop.


    +   1) Right-click on an empty area of the shelf and choose the first option in
    the context menu, ''Contents''.

    +   2) The Shelf Contents dialog box opens, listing the available gadgets. (There
    are more gadgets than these and you will discover how to load them shortly.)

    +   3) Make sure that the following three gadgets are selected: ''Settings'',
    ''Everything Starter'', and ''iBar''. (To select a gadget, highlight it and click
    ''Add Gadget''.)

    +   4) Deselect any other selected gadgets, by highlighting them and clicking
    ''Remove Gadget''. (Some of these, like the Mixer and SysTray, you will shortly
    be adding to another shelf.)

    +   5) You will be left with just three icons on your shelf, namely ''iBar'' (which
    is currently housing Mitori), ''Settings'', and ''Run Everything''. Close the
    dialog box.

    +   6) Now right-click the Mitori icon on the shelf, mouse over ''iBar'' then
    choose ''Contents''. The iBar Applications dialog box opens. You may want to make
    it bigger by dragging on its top or bottom borders.'
  - '[PAGE 27]


    +   7) FOLLOWING THE PROCEDURE DESCRIBED IN (3) ABOVE, ADD THE FOLLOWING APPLICATIONS
    TO THE iBAR: FIREFOX, NAUTILUS, SYNAPTIC, TERMINAL, AND THUNDERBIRD. REMOVE MIDORI.


    +   8) CLICK ON THE ORDER TAB (AT THE TOP OF THE BOX), AND MOVE FIREFOX AND SYNAPTIC
    DOWN IN THE LIST SO THAT THE ORDER READS: NAUTILUS, TERMINAL, FIREFOX, THUNDERBIRD,
    SYNAPTIC.


    +   9) CLICK APPLY, AND THEN CLOSE. YOUR iBAR SHOULD NOW CONTAIN ICONS FOR THESE
    FIVE APPLICATIONS.


    +   10) RIGHT-CLICK ON AN EMPTY AREA OF THE SHELF AGAIN, AND CHOOSE ‘SETTINGS’
    FROM THE MENU. THE SHELF SETTINGS DIALOG BOX OPENS.


    +   11) AT THE ‘STACKING’ TAB, CHOOSE ‘BELOW WINDOWS’ (THIS ENSURES THAT THE SHELF
    WILL NOT BE VISIBLE IF YOU WANT TO RUN AN APPLICATION FULL-SCREEN.)


    +   12) CLICK ON ‘POSITION’, AND AT THIS TAB CHOOSE THE SECOND OPTION AT THE LEFT
    (I.E. THE ONE WITH THE SHELF ALONG THE LEFT EDGE OF THE SCREEN, AT THE TOP).


    +   13) AT THE ‘SIZE’ TAB, LEAVE THE SIZE AT 40 PIXELS, BUT SELECT ‘SHRINK TO
    CONTENT WIDTH’.


    +   14) CLICK THE RIGHT ARROW TO REACH THE ‘STYLE’ TAB, AND HERE YOU SHOULD SELECT
    ‘INVISIBLE’.


    +   15) CLICK APPLY, AND THEN CLOSE.


    THE ICONS ON YOUR SHELF SHOULD NOW BE CLUSTERED AT THE LEFT EDGE OF THE SCREEN,
    AT THE TOP, AND THE SHELF ITSELF SHOULD BE INVISIBLE. AND NOW YOU CAN ACCESS ALL
    THE GADGETS AND APPLICATIONS PLACED ON IT WITH A SINGLE CLICK. ONE OF THESE –
    THE SETTINGS GADGET – YOU’LL BE USING IN THE NEXT SECTION.


    **NOTE:** THE SYSTEM (POWER SWITCH) GADGET IS NO LONGER ON THE SHELF. SO TO SWITCH
    OFF YOUR COMPUTER, YOU’LL EITHER HAVE TO PRESS THE COMPUTER’S POWER BUTTON OR
    USE THE MENU SYSTEM (MAIN MENU > SYSTEM > POWER OFF). LATER IN THIS CHAPTER YOU
    WILL BE CREATING A KEY BINDING TO SWITCH OFF.


    # ### 3.2 HIDING DESKTOP LAUNCHERS


    SINCE YOU CAN NOW LAUNCH NAUTILUS WITH A SINGLE CLICK ON ITS iBAR ICON, THERE’S
    NO POINT HAVING ITS LAUNCHER ON THE DESKTOP AS WELL. INDEED, AS WE’LL SEE LATER,
    THERE’S NO POINT HAVING ANY SUCH LAUNCHERS ON THE DESKTOP, AS WE CAN PUT iBARS
    THERE INSTEAD.


    To hide desktop launchers:


    +   1) CLICK THE SETTINGS GADGET ON THE PANEL. THE SETTINGS WINDOW OPENS, WHICH
    YOU MAY WANT TO MAXIMIZE. NOW, ALL THE DIFFERENT SETTINGS POSSIBILITIES THAT YOU'
  - '[PAGE 28]


    previously had to access by wading through the menu system are at hand.


    +   2) Desktop icons are controlled by the EnLightenment file manager, and to
    get to its Settings you will have to click on the arrow at the top-right of the
    Settings window to scroll sideways to files. Choose ''File Manager'', then, at
    the Fileman Settings dialog box, click on the Display tab and turn off ''Icons
    on Desktop''.

    +   Apply, and then Close, and close the Settings window.


    # 3.3 A second shelf


    We''ll put the Systray and Mixer gadgets on a second shelf, which again we''ll
    locate at the left of the screen, but at the bottom. Systray requires that this
    shelf is visible.


    +   1) Go to Main menu > Settings > Shelves, and at the Shelf Settings dialog
    box click Add.

    +   2) Give your new shelf a meaningful name so that you can identify it later
    (e.g. ''Bottom'').

    +   3) The Shelf Contents dialog opens, where you should add the Mixer and Systray
    gadgets. Click Close, and you are returned to the Shelf Settings dialog box.

    +   4) Highlight your shelf (''Bottom''), and click ''Settings''. The Shelf Settings
    dialog box opens, and at the various tabs make sure the following settings: Stacking
    - ''Below Windows''; Position - ''Fourth down'' (i.e. left edge, to the bottom);
    Size - make sure ''Shrink to Content Width'' is selected; Style - leave it as
    ''Default''.

    +   5) Click Apply, then Close, and then close the Shelf Settings dialog box.


    To change the order of the gadgets on this shelf (so that the Mixer is at the
    bottom, below Systray), right-click on the Mixer and choose ''Begin Moving Gadgets''.
    You can now drag the gadgets to the desired position. Right-click Mixer again
    and choose ''Stop Moving Gadgets''.


    Hint: If an application is open and maximized, so that it fills the desktop apart
    from the narrow strip at the left reserved for your shelves, you can click the
    exposed part of the desktop between the two shelves to open the EnLightenment
    menu system.


    # 3.4 A popup shelf


    Now you''ll create a shelf which will be tucked away at the bottom of the screen,
    hidden from view until you mouse over it.


    +   1) If you have a laptop it will be helpful to unclutch the battery gadget''
    on this shelf, but its module is not part of the base (Composer profile. To rectify
    this, go to Main menu > Settings > Modules. The Module Settings dialog box appears.

    +   Where you should click on the System tab, highlight ''Battery'', and click
    Load.'
