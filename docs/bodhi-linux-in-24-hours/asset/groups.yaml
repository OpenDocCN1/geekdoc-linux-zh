    \ apt-get autoremove'\n```\n\n（注意第三个命令末尾的 `-y`。这免除了你需要输入 'y' 的需求，因为在运行 `dist-upgrade`\
    \ 命令后，当你被询问是否要替换任何过时文件时确认。）\n\n如果你在第四章中安装了 Get-i-Player，你可能希望向此列表添加以下别名：\n\n```\n\
    alias get='get-i-player'\n```\n\n- 3) 保存文件，关闭 Leafpad，并关闭终端。\n\n要激活这些别名，你需要重启计算机。现在就重启，因为你将在下一节中试用其中一些。\n\
    \n"
