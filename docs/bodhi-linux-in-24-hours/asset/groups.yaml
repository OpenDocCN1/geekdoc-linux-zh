    ## 4. 增强您的系统


    当您读完本章时，您应该已经安装了大多数可能需要的应用程序。如果您是 Linux 新手，问题将是：在众多可能性中，您应该选择哪一个？有时选择很明确，而在许多情况下，您可能之前在
    Windows 下使用过的首选软件也有 Linux 版本。


    例如，VLC 是标准的公共领域（即免费）媒体播放器，在 Windows 和 Linux 中都是如此；LibreOffice 则是 Windows 和 Linux
    的标准公共领域办公套件。其他选择并不那么明确，而且我推荐的某些软件可能并不最适合您。另外，如果您的计算机较旧且性能不足，这将把您的选择限制在轻量级应用程序上。


    您最好的策略是试用一到两个替代方案；卸载您不想要的并安装其他软件是很简单的。（与 Windows 类似，卸载应用程序后可能会留下一些残留；您将在第 6 章中学习如何删除这些残留并整理您的系统。）


    只要可能，您应从 Bodhi 应用中心（AppCenter）而非 Synaptic 安装应用程序。要卸载应用程序，请使用 Synaptic。


    ### 4.1 办公应用程序


    LibreOffice 是一个不错的替代品，尽管包括 Microsoft Office 在内的微软产品无法在 Linux 中运行，但它在许多学校、政府机构和企业中都被使用（尽管通常是在
    Windows 计算机上）。它包含替代 Word 的 Writer、替代 Excel 的 Calc、替代 PowerPoint 的 Impress 以及替代
    Access 的 Base。它还包含 Draw，这是一个绘图程序。我可以读取任何以 Microsoft Office 格式保存的文档，并且可以将文档导出为该格式。我正使用
    LibreOffice Writer（运行在 Bodhi Linux 上）来撰写这本书。


    当然，如果您在办公方面的唯一需求只是偶尔写一封信，那么安装像 LibreOffice 这样重量级的软件并没有太大意义。Abiword 文字处理软件包要合适得多。


    Cups 是提供打印选项的应用程序所使用的打印包，如果您想从计算机打印，就需要安装它。


    LibreOffice 和 Cups 必须从 AppCenter 安装；否则您将无法下载运行它们所需的所有组件。Abiword 可以从 AppCenter
    或 Synaptic 安装。


    -   1) 前往 Bodhi Linux 网站 (www.bodhilinux.com) 并导航至 AppCenter。

    -   2) 在“办公”部分选择“办公套件”，然后选择 LibreOffice。点击“立即安装”。安装将花费一两分钟。如果您选择安装 Abiword 而不是
    LibreOffice，您将在“办公”部分的“文字处理器”下找到它。

    -   3) 要安装 Cups，返回 AppCenter，从“办公”部分选择“打印和扫描”，然后选择“打印”，点击“立即安装”。

    -   4) LibreOffice 和 Cups 将被添加到您的菜单系统中，前者位于“主菜单 > 应用程序 > 办公”，后者位于“主菜单 > 应用程序 >
    偏好设置”。请注意，您不会看到以名称列出的 Cups，而是被称为“打印”。


    现在您可以安装您的打印机：


    -   1) 确保您的打印机已打开并连接，无论是直接连接到您的计算机还是连接到网络。例如，它可能连接到一个本身连接到网络的 Windows 计算机。

    -   2) 从菜单系统或通过“运行一切”运行“打印”（输入 printing 的前几个字母并按 Enter）。打开打印窗口，您可以在其中点击“添加”来添加您的打印机。

    -   3) 打开“选择设备”对话框，您可以选择相应的选项。例如，如果打印机连接到网络上的另一台 Windows 计算机，请选择“网络打印机”，然后选择“通过
    SAMBA 的 Windows 打印机”。然后点击“浏览”并双击出现的条目（例如 WORKGROUP，然后是 Windows 计算机的名称）。您的打印机应显示在对话框中：高亮显示它并点击“确定”。

    -   4) 点击“下一步”，然后从列表中选择合适的打印机制造商，再次点击“下一步”并选择型号。选择推荐的驱动程序，点击“下一步”，然后“应用”。

    -   5) 您将受邀打印测试页。假设效果令人满意，点击“确定”，然后关闭打印窗口。

    -   6) 现在运行 LibreOffice Writer（或 Abiword），打开“文件”菜单，选择“打印”。您应该看到打印机在“打印机”对话框中被高亮显示。如果是这样，一切正常，您可以点击“取消”，然后关闭
    Writer。


    ### 4.2 媒体播放器


    VLC 是播放媒体文件，尤其是视频文件的标准应用程序，因为它能处理许多不同的文件类型，并且能够在不同类型之间进行转换（如果您希望这样做）。如果您希望播放 DVD，还需要下载一个名为“VLC”的插件，该插件在
    AppCenter 中均可获得（后者在“DVD 播放”列表下）。


    除了电影，VLC 还可用于播放音乐和其他音频文件，尽管您可能会发现使用专用的音频播放器（如 Audacious）更为方便。


    您现在应该从 AppCenter 下载这些应用程序，您将在“多媒体”部分下的“视频播放器”、“编解码器”和“音频播放器”标题下找到它们。


    （您当然可以下载提供一个或多个替代方案。或者您可以坚持我的建议，稍后再尝试其他软件。）


    **注意：** 如果在下载第一个软件包后，您在安装页面选择“快速安装”而不是“立即安装”，可以加快多个软件包的安装速度。这将跳过同步计算机上的文件信息数据库与存储库数据库的“sudo
    apt-get update”。在同步第一个软件包后，对于其余软件包无需再次同步。


    ### 4.3 照片应用程序


    如果您只想查看照片，也许是作为幻灯片放映，并附带一些非常基本的编辑功能，那么 Mirage 是一个非常用户友好的选择。如果需要更多的编辑选项以及照片管理功能，您可能想要尝试
    Shotwell，作为 Mirage 的替代方案或额外补充。或者，也许您希望与 Mirage 一起安装一个能处理照片的绘图软件包，在这种情况下请尝试 Pinta。但是，如果您想要一个真正强大的、类似
    Photoshop 的照片编辑器，请尝试 Gimp。


    现在请从 AppCenter 的“图形”部分安装其中一个或多个软件。


    ### 4.4 Dropbox


    Dropbox 允许您将重要文件存储在 Internet 上的安全位置。如果您的系统上有 Nautilus，我建议您使用 Synaptic 安装它，否则从
    AppCenter 安装（您将在“互联网”部分的“云”下找到它），但请注意，这将只安装 Dropbox 的一部分。要安装剩余部分：


