    \ on the Places box when you've finished moving and resizing, and the movable\
    \ box disappears. Right-click again on the gadget, and mouse over 'Places' then\
    \ 'Appearance' and click 'Plain'. The border around the gadget disappears.\n\n\
    6) If you didn't install Nautilus in Chapter 3 but opted instead to use the Enlightenment\
    \ file manager (EFM), you can ignore this step and the next. Right-click on filesystem,\
    \ mouse over 'Places' and click 'Settings'. The Places Settings dialog box opens.\n\
    \n7) Here you should click 'Use a custom file manager' and enter Nautilus--no\
    \ desktop in the box (that's two dashes before the 'no'). Click Apply then close.\n\
    \n8) Test your new desktop gadget: click the Home icon (top right of the gadget),\
    \ and Nautilus will run in your home directory; close it then click on the hard\
    \ disk icon, and Nautilus will run in the Root directory; close Nautilus.\n\n\
    9) If you insert a USB memory stick into your computer, its icon will show up\
    \ on this gadget, with details of its capacity; if you click on its icon, Nautilus\
    \ will open in the drive's root directory.\n\n## 3.6 Run Everything\n\nYou can\
    \ see that iBars offer a great way to launch applications with a single click,\
    \ but what about the various Settings utilities with their dialog boxes that you've\
    \ been making use of, which must be launched from deep within the menu system?\
    \ Even using the Settings gadget to reach these dialog boxes takes quite a bit\
    \ of navigating. The solution is to use the 'Run Everything' module.\n\nYou can\
    \ launch Run Everything by clicking its icon in the first iStrip (if you've set\
    \ up its leaf on a white background). You can also run it directly by pressing\
    \ Alt + Esc (i.e. hold down the Alt key and press Escape), or Win + Space (i.e.\
    \ hold down the Windows key and press the spacebar), or by selecting it from the\
    \ Main menu.\n\n1) Click the Run Everything icon now. Its dialog box opens, with\
    \ tabs listed along the bottom labelled 'All', 'Applications', 'Windows', 'Execute',\
    \ and two other ones ('Settings' and 'Plugins') which you can't see until you\
    \ click along to them. Click each tab in turn, and you will see how Run Everything\
    \ organizes the programs on your computer.\n\n2) If you know the name of a program,\
    \ the easiest way to run it is not via these tabs but simply by typing the first\
    \ few letters of the program's name into this dialog box. For instance to run\
    \ Terminal, you could type the first two or three letters of TERMINAL and press\
    \ Enter.\n\nYou'll be using Run Everything in the exercises in the remainder of\
    \ this chapter. Note that in these exercises I will simply instruct you to 'Run\
    \ Everything', meaning that you should either click on the Run Everything icon\
    \ on the shelf, or press Alt - Esc, or press Win - Space, or select it from the\
    \ Main menu.\n\nFurther reading: Go to the **Booh Guide to Enlightenment** (Main\
    \ menu -> Booh Linux -> Quick Start, mouse over 'Enlightenment' and choose 'Booh\
    \ Guide'), and read the 'Everything Module' section. To prepare for the next exercises\
    \ you should also read the 'Bindings' section.\n\n## 3.7 Edge Bindings\n\nEdge\
    \ bindings specify the actions that occur when you click the mouse on different\
    \ parts of the screen edge. To set these up:\n\n1) Run Everything, and type the\
    \ first three letters of *edge bindings*. The Edge Bindings icon is highlighted.\
    \ Press Enter, and the Edge Bindings Settings dialog box opens.\n\n2) Click **Add**,\
    \ and you are taken to the Edge Binding Sequence dialog box. You'll begin by creating\
    \ a binding for the top right corner of the screen, so click the brown box at\
    \ this corner.\n\n3) Click *clickable edge*, then click **Apply**.\n\n4) You now\
    \ have to assign an action to this binding. In the right-hand action pane, scroll\
    \ down to the 'Window : Actions' section (about two thirds of the way through\
    \ the huge list of possibilities) and highlight 'Close'.\n\n5) Click **Apply**.\
    \ Now, whenever you click on the top-right corner of the screen, the currently-focused\
    \ window will close. This is equivalent to clicking the 'x' button at the top\
    \ right corner of the title bar. (Those tiny title bar buttons are fiddly, zipping\
    \ the mouse up to the top right of the screen is much easier).\n\n6) Click **Add**\
    \ again, and now, in the Edge Binding Sequence dialog box, click on the top edge\
    \ of the picture of the screen. The Clickable Edge option should have been automatically\
    \ selected, so click **Apply**.\n\n7) In the right pane scroll down to the 'Window\
    \ : State' section, highlight 'Maximize', then click **Apply**. Now, whenever\
    \ you click on the top edge of the screen, the currently-focused window will be\
    \ maximized. This is equivalent to, but easier than, clicking the '+' button at\
    \ the right of the title bar. Note that to unmaximize the window, simply click\
    \ the top edge of the screen again.\n\n8) Click **Add** again, click the bottom\
    \ edge in the 'Edge Binding Sequence' box, then APPLY.\n\n9) **Highlight** *‘Iconic\
    \ Mode Toggle’* (IN THE ‘Window : State’ SECTION) AND CLICK APPLY. NOW, WHATEVER\
    \ YOU CLICK THE BOTTOM EDGE OF THE SCREEN, THE CURRENTLY-FOCUSED WINDOW WILL BE\
    \ MINIMIZED. THIS EQUIVALENT TO CLICKING THE ‘↓’ BUTTON ON THE TITLE BAR.\n\n\
    10) NOW YOU SHOULD CREATE BINDINGS TO CARRY OUT OTHER ACTIONS THAT CAN’T CURRENTLY\
    \ BE DONE BY MOUSE CLICKS. I SUGGEST THE FOLLOWING:\n\n- A) TOP-LEFT EDGE - ‘**Fullscreen**\
    \ Mode Toggle’ (IN THE ‘Window : State’ SECTION). CLICKING HERE WILL SWITCH TO\
    \ FULLSCREEN. CLICKING AGAIN WILL RESTORE.\n\n- B) LEFT EDGE - ‘**Maximize** Left’\
    \ (IN THE ‘Window : State’ SECTION).\n\n- C) RIGHT EDGE - ‘**Maximize** Right’\
    \ (IN ‘Window : State’). THIS BINDING AND THE LAST ARE INVALUABLE WHEN YOU WANT\
    \ TO OPEN TWO WINDOWS SIDE-BY-SIDE.\n\n- D) BOTTOM-RIGHT EDGE - ‘**Show The Desktop**’\
    \ (IN THE ‘Desktop’ SECTION, AT THE TOP OF THE RIGHT PANE). THIS WILL MINIMIZE\
    \ ALL OPEN WINDOWS AND SHOW THE DESKTOP.\n\n- E) THAT LEAVES THE BOTTOM-LEFT CORNER\
    \ WITHOUT A BINDING. I WILL BE SUGGESTING ONE FOR THIS LATER.\n\n11) NOW OPEN\
    \ AN APPLICATION AND TEST THESE BINDINGS WITH ITS WINDOW. NOTE THAT FOR MOST OF\
    \ THESE BINDINGS A SECOND CLICK WILL RESTORE THE WINDOW TO ITS PREVIOUS STATE.\n\
    \n**Note:** YOU DON’T NEED TO MINIMIZE AN APPLICATION TO HIDE IT FROM VIEW. INSTEAD\
    \ YOU CAN DOUBLE- CLICK ITS TITLE BAR TO ROLL UP ITS WINDOW BENEATH THE BAR. DOUBLE-CLICKING\
    \ THE BAR AGAIN WILL UNROLL IT. TRY IT.\n\n## 3.8 Key bindings\n\nLet’s now create\
    \ some key bindings. The procedure is similar to that described in the last section.\n\
    \n1) Run *Everything* and in the **Run Everything** dialog box type the first\
    \ few letters of *key bindings*. The ‘Key Bindings’ icon will be highlighted;\
    \ press **Enter** and the **Key Bindings** Settings dialog box will open.\n\n\
    2) If you click on any item in the (long) list in the left pane, the action to\
    \ which it is bound will be highlighted in the right ‘Action’ pane. For example,\
    \ if you click on ‘Menu’ (which denotes the Menu key), ‘Show Main Menu’ will be\
    \ highlighted at the right. It’s worth spending a few minutes exploring the many\
    \ key combinations for which bindings already exist. For example, Win + Left (i.e.\
    \ the Windows key with the left-arrow key) will **Maximize Left**, and Win + Right\
    \ will maximize right.\n\n**Note:** When setting up key bindings of your own,\
    \ you should avoid key combinations that are used by applications. For example,\
    \ Ctrl + s is often used to save, and Ctrl + c and Ctrl + a are used for copy\
    \ and paste. Win (Windows key) combinations are not used elsewhere and so are\
    \ good choices.\n\n3) Let’s set up a key binding now. Click **Add**, and you are\
    \ invited to press a key combination.\n"
