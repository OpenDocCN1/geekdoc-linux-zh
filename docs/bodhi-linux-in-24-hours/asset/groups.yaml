    \nTo change its icon, proceed as follows:\n\n1) Right-click on the orange Nautilus\
    \ title bar and choose **Nautilus > Edit Icon**.\n"
  mdcn: "\n7) 如果您愿意，可以自定义各个文件夹的图标。如果打算这样做，最好首先将图标文件夹的位置加入书签：\n    - a) 点击侧边栏中的“文件系统”，导航至\
    \ /Icons/Share/Icons/Mac-OS9X/Apps。\n    - b) 将此文件夹加入书签。通过打开“书签”菜单并选择“添加书签”，它将显示在侧面板中，标签为“Apps”。\n\
    \    - c) 若要更改此名称为更有意义的名称，再次打开“书签”菜单并选择“编辑书签”，然后将其名称更改为例如 ReMix Icons。\n\n8) 要更改“文档”文件夹的图标，请在侧边栏中点击“主目录”以返回您的主文件夹，然后右键点击“文档”文件夹图标并从上下文菜单中选择“属性”。然后点击属性对话框中的其图标，您将进入“选择自定义图标”对话框。点击侧边栏中的“ReMix\
    \ Icons”（或您为新书签指定的任何名称），您将进入 ReMix 图标列表。\n\n9) 按向下箭头键向下浏览此列表；每个图标将依次在右侧显示。当您找到一个喜欢的图标（例如尝试\
    \ GEDIT.png）时，点击“打开”，然后关闭属性对话框。\n\n10) 您可以以类似方式为其他文件夹分配图标。\n\n## 设置 Nautilus 的视图和首选项\
    \ [可选]\n\n您有时希望更改 Nautilus 显示文件列表的方式。为了展示各种可能性，请点击侧边栏中的“文件系统”以显示根目录。各种视图选项列在“视图”菜单的底部，但您也可以通过按\
    \ Ctrl + 1（即按住 Ctrl 键并轻按 1）、Ctrl + 2 和 Ctrl + 3 来循环浏览这些选项。如果您为此目录选定 Ctrl + 2（列表视图），Nautilus\
    \ 将记住此设置，并自动在您返回此处时切换到此视图。其他目录也是如此。\n\n您可以在“文件管理首选项”对话框中更改 Nautilus 的全局外观和行为：\n\
    \n1) 要访问此对话框，请打开“编辑”菜单，并选择“首选项”。\n2) 进入后，请确保位于“视图”选项卡，在“图标视图默认值”部分 - 将默认缩放级别设置为\
    \ 66%。\n3) 然后在“行为”选项卡中，勾选“包含绕过回收站的删除命令”复选框。（注意：通过此命令删除的文件，如果您稍后改变主意，可能无法恢复。）\n\
    4) 完成后点击“关闭”，并查看您的更改。\n\n## 搜索文件夹和文件 [可选]\n\nNautilus 有一个方便的搜索功能，可通过工具栏右侧的搜索图标访问。需要记住的主要事项是从要查找的文件夹或文件所在的目录开始搜索。因此，如果您正在寻找位于主目录某处的文档或数据文件，您应该从该目录开始搜索；但是，如果它位于根文件系统中的某处，您应该在根目录开始搜索。如果是这种情况，请在点击“搜索”之前点击侧边栏中的“文件系统”。\n\
    \n现在尝试在文件系统中搜索所有 .DESKTOP 文件。\n\n1) 运行 Nautilus，并点击侧边栏中的“文件系统”。\n2) 点击“搜索”，并在搜索框中输入\
    \ DESKTOP。一段时间后，所有桌面文件将出现，并列出其位置。\n\n请注意，当搜索开始时，搜索框下方会打开一个工具栏。如果点击右侧的绿色 ~ 符号，会打开一个允许您指定文件类型的框。它默认为“任意”；但如果点击其箭头，您将进入一系列常见类型，如果点击“其他类型”，会出现大量可能的选项。您将在下一次搜索中使用此功能。\n\
    \n搜索主目录中的所有图片：\n\n1) 点击侧边栏中的“主目录”。\n2) 点击“搜索”，然后在搜索框中输入一个占位符，例如 123。\n3) 当搜索开始时，点击绿色\
    \ ~ 符号，然后在“文件类型”框中选择“图片”。\n4) 在搜索框中，删除占位符，改为输入单个空格。这充当通配符，导致 Nautilus 搜索所有文件名。\n\
    5) 点击“重新加载”按钮，Nautilus 将执行搜索，定位您之前下载的壁纸图片。\n\n## 连接到网络中的其他计算机 [可选]\n\nNautilus\
    \ 使访问连接到您的网络的其他（Windows）计算机变得特别容易。只需点击侧边栏中的“浏览网络”，几秒钟后，任何已连接并开机的计算机名称都应显示出来，并且您应该可以立即访问其文件系统中的公共文件夹。（如果拒绝访问，您需要前往该计算机并在“控制面板”的“网络和共享中心”中检查其共享选项。您还应该右键点击公共“文档”文件夹并选择“属性”，然后是“共享”选项卡，并检查这里的条目。）\n\
    \n## 安全移除 USB 记忆棒\n\nLINUX 读取您的 USB 记忆棒（U盘）就像 WINDOWS 一样轻松。如果您将 USB 记忆棒（或任何其他存储设备）插入计算机的\
    \ USB 端口，其图标将出现在 Nautilus 侧边栏的顶部，您可以通过点击它来访问其内容。\n\n要从计算机中安全移除 USB 记忆棒，您应该在 Nautilus\
    \ 侧边栏中右键点击其图标，并从上下文菜单中选择“弹出”选项。\n\n## 设置 NAUTILUS 和 TERMINAL 为默认应用程序\n\n本节最后的任务是将\
    \ NAUTILUS 设置为默认文件管理器，将 GNOME TERMINAL 设置为默认终端。\n\n1) 前往主菜单 > 设置 > 所有 > 应用程序 >\
    \ 默认应用程序。\n2) 在打开的对话框中，默认浏览器应已设置为 FIREFOX，但您需要高亮左侧窗格中的“文件”，然后向下滚动并高亮右侧窗格中的 NAUTILUS，然后点击“应用”。\n\
    3) 然后高亮左侧窗格中的“终端”和右侧窗格中的“终端”，并点击“应用”。\n4) 点击“关闭”。\n\n本章其余部分涵盖更高级的主题，可以省略或稍后返回。因此，如果您愿意，现在可以跳到第\
    \ 3 章，*加速您的桌面*。\n\n## 2.7 以超级用户身份运行 NAUTILUS\n\n有时，如下节所示，以“超级用户”身份运行 NAUTILUS\
    \ 并拥有管理权限非常方便，因为这允许您对受保护的系统目录进行更改。为此，您必须以“root”身份运行 NAUTILUS。不用说，以这种方式运行 NAUTILUS\
    \ 时必须非常小心，因为您可能会破坏您的系统。\n\n以超级用户身份运行 NAUTILUS 最方便的方式将通过菜单系统，为此您必须为其创建个人应用程序启动器。\n\
    \n1) 前往主菜单 > 设置 > 所有 > 应用程序 > 个人应用程序启动器。\n2) 在“个人应用程序启动器”对话框中点击“添加”。\n3) 在下一个对话框的名称栏中输入\
    \ Nautilus as Root\n4) 在应用程序栏中输入 gksudo \"nautilus %U --no-desktop\"（注意引号 - 它们是必不可少的。）\n\
    5) 点击“常规”选项卡，并在“类别”字段中输入 Utility... 这告诉 Enlightenment\n\n在哪里定位此启动器的菜单条目。\n\n5)\
    \ 点击**应用**，然后**关闭**。\n\n现在前往**主菜单 > 应用程序 > 附件**，您会看到“**Nautilus as Root**”已添加到菜单中。点击此条目，Nautilus\
    \ 将运行，但它与之前的 Nautilus 并不完全相同。例如，您之前创建的书签已消失，如果您设置了任何首选项（在*编辑 > 首选项*中），这些也会消失。事实上，它是\
    \ Nautilus 的一个不同实例。\n\n您可以从这里运行的 (**ROOT**) 终端也将是终端的不同实例，具有不同的首选项。现在测试一下：\n\n\
    1) 在 Nautilus 窗口中的空白处右键点击，并选择“**在终端中打开**”。终端以**Root**身份打开，但颜色设置不便。\n2) 要修复这些颜色，打开终端的*编辑菜单*并选择“**配置个人资料**”。打开*颜色*选项卡，然后取消勾选“**使用系统主题颜色**”框。在“**内置方案**”处，选择**自定义**。现在将背景颜色设置为类似深红色；这将作为警告，表明您处于此终端实例的超级用户模式。\n\
    3) 点击**关闭**，然后关闭终端，但保持 Nautilus 以 **Root** 身份打开，为下一节做准备。\n\n## 2.8 自定义 Nautilus\
    \ 图标\n\n替换分配给 Nautilus 的相当沉闷的图标应该是一项简单任务，但似乎在 **Enlightenment** 文件系统中缺少两个图标文件夹，这阻止了我们这样做。此外，这些文件夹位于系统的受保护部分，这意味着我们无法通过以正常方式运行\
    \ Nautilus 来创建它们，相反，我们必须以 **Root** 身份运行它。\n\n1) 如果 Nautilus 以 **Root** 身份尚未打开，请立即打开它（*主菜单\
    \ > 附件 > Nautilus as Root*）。\n2) 导航至 `/usr/local/share`，在文件夹窗口的空白处右键点击并选择“**新建文件夹**”。输入\
    \ `icons` 作为名称。\n3) 导航至 `/usr/share/enlightenment` 并在此处也创建一个 `icons` 文件夹。\n4)\
    \ 创建这两个缺失的文件夹后，您可以关闭以 **Root** 身份运行的 Nautilus。相反，您现在应该以正常方式运行它（通过双击桌面上的图标）。\n\n\
    要更改其图标，请照做：\n\n1) 在橙色的 Nautilus 标题栏上右键点击并选择 **Nautilus > 编辑图标**。\n\n"
