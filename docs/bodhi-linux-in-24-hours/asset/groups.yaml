    \n3) 在这里，你应该添加电池小部件（如果你在步骤 1 中加载了它）和任务小部件，然后点击关闭。\n\n4) 回到“搁架设置”对话框，确保“POPUP”仍处于高亮状态，然后点击“设置”。将此搁架的设置调整为如下内容：\n\
    \   - 堆叠 = 'Above Everything'（在一切之上）\n   - 位置 = 'Fifth Down on the Left, i.e.\
