    BE TRUSTED. SO IF INSTALLING FROM A PPA, YOU DO SO AT YOUR OWN RISK; HAVING SAID
    THAT, I HAVE NOT EXPERIENCED ANY PROBLEMS WITH THE PPA’S REFERRED TO IN THIS GUIDE.


