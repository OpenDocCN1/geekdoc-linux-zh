    \ to this view whenever you return here. The same is true for other directories.\n\
    \nYou can change the global appearance and behaviour of Nautilus at the File Management\
    \ Preferences dialog box:\n\n1) To get to this, open the Edit menu, and choose\
    \ Preferences.\n2) Once you’ve right try is at the Views tab, in the ‘Icon Views\
    \ Default’ section - set the Default Zoom Level to 66%.\n3) Then in the Behaviour\
