    \ use.\n"
  mdcn: "\n## 2.2 一些初步调整\n\n现在，你将对该系统的外观和感觉进行几处修改。后续还会进行更多的更改。\n\n- 1) 首先，如果你是英国人，请将系统设置为英式英语。在桌面任意位置点击以打开主菜单，然后选择“设置\
    \ > 全部 > 语言 > 语言设置”。（请记住：如果这个长序列中的最后一个菜单消失在了屏幕右侧，只需将鼠标指针移至屏幕边缘即可使其显示出来。）在打开的语言设置对话框中，高亮显示“英式英语”并点击“应用”，然后点击“关闭”。\n\
    \n- 2) 接下来，你很可能希望窗口像 Microsoft Windows 的窗口那样行为。前往主菜单 > 设置 > 全部 > 窗口 > 窗口焦点。在焦点设置对话框中，选择第一个选项（“点击窗口以聚焦”），然后点击“确定”。\n\
    \n- 3) 如果在上一章末尾选择主题时 Bodhi-Theme 不可用，请立即安装它。前往 Bodhi Linux 网站（www.bodhilinux.com），高亮显示“资源”并选择“艺术维基”，然后，在“主题”下，点击左侧第二个（绿色和白色）主题（称为\
    \ `bodhi_e17_bodhi`）。在下一个安装屏幕上，选择“立即安装”。安装大约需要几分钟，请保持耐心！完成后，你应该应用此主题（主菜单 > 设置\
    \ > 主题）。\n\n- 4) 另一个你可能想要做的修改是设置菜单系统中使用的字体，以便让年长的眼睛更容易阅读。（这些笔记是为 U3A 的退休人员撰写的！）\n\
    点击桌面打开主菜单，然后选择“设置 > 全部 > 外观 > 字体”。然后，在字体设置对话框中：\n- a) 点击“高级”。\n- b) 在字体类别列中点击“菜单项”，然后在该列底部点击“启用字体类别”。\n\
    - c) 在字体列中选择“Nimbus Sans”，在样式列中选择“粗体”，然后在大小列中向下滚动至 12 像素并点击它。\n- d) 点击“应用”，然后在桌面任意位置点击以查看你的菜单外观。\n\
    如果你对其外观满意，那就很好；否则，请尝试其他设置。为下一个练习保留对话框打开状态。\n\n- 5) 现在更改窗口标题栏中使用的字体。要查看当前标题栏中使用的字体外观，请打开\
    \ Leafpad（主菜单 > 应用程序 > 附件 > Leafpad），并观察顶部橙色区域显示的内容（未命名）。要更改此字体，回到字体设置对话框，在字体类别列中点击“标题栏”，然后点击“启用字体类别”，然后在字体列中选择“Ubuntu”，样式列中选择“粗体”，大小列中选择“12\
    \ 像素”。点击“应用”，并观察 Leafpad 标题栏中使用的字体如何变化。如果你对这些更改满意，请关闭 Leafpad 和字体设置对话框；否则，请尝试不同的字体。\n\
    \n- 6) 此时你可能想要做的另一个调整是关闭复合配置文件的一部分弹性效果（你可能在上述打开或关闭对话框时观察到了此效果）。打开主菜单并选择“设置 > 全部\
    \ > 外观 > 复合”，然后在复合设置对话框中的默认样式部分，向下滚动并高亮显示标记为“无”的最后一个选项。点击“确定”。（当然，你可能喜欢弹性效果，或者想尝试其他效果，在这种情况下你可以忽略此步骤。不要让个人喜好限制你的风格！）\n\
    \n到此为止，你应该已经意识到，你可以应用到你的 Enlightenment 桌面及其各个组件的设置数量多到令人眼花缭乱，我们稍后将探索这些设置中的更多内容。目前，我们将通过更改桌面壁纸来完成这次对可能性的初步探索。与\
    \ Microsoft Windows 一样，你可以几乎选择任何图片作为壁纸，包括你自己的照片，但让我们坚持使用 Bodhi 网站提供的内容。\n\n- 7)\n\
    \  - a) 打开 Midori 网络浏览器（点击搁板上从顶部数第二个图标），并在地址栏中输入 Bodhi 网站地址（www.bodhilinux.com）。将鼠标悬停在资源上（页面顶部中央）并选择艺术维基。\n\
    \  - b) 在下一个屏幕上选择壁纸，然后浏览所提供的壁纸，选择一个与你的主题（Bodhi-Theme）匹配的壁纸。这是一个带有橙色高亮的绿色主题，我建议选择在动画壁纸部分中的第一个（绿色）提供项。否则，前往官方部分并从那里选择一个绿色主题。\n\
    \  - c) 点击你的选择，你将进入壁纸的较大图像页面。右键单击它并选择“将图像另存为”选项，然后在下一个对话框中选择“保存”，输入你选择的文件名，并点击保存。\n\
    \  - d) 现在你必须将此图像设置为壁纸。最小化 Midori，然后点击桌面打开主菜单并选择“设置 > 壁纸”。在壁纸设置对话框中，点击“图片...”（靠近顶部）。你应该能在列表中看到刚刚保存的图像，因此高亮显示它，点击“使用”，然后在导入设置对话框中，确保高亮显示“填充”并点击“确定”。你将返回壁纸设置对话框，在那里你可以点击“确定”。你选择的壁纸现在应该装饰在桌面上了。\n\
    \n- 8) 此时你可能想要更改时钟的外观。右键单击它，将鼠标悬停在“时钟”上并选择“设置”。然后在时钟设置对话框中选择“模拟”，取消勾选“秒”，然后点击“确定”。桌面上会出现一个模拟时钟。你可以调整其大小（再次右键单击它）并选择“开始移动/调整大小”。或者，你可能更喜欢保留数字时钟，正如我所做的那样，但调整其大小并将其位于桌面的不同位置。\n\
    \n## 2.3 安装一些应用程序：Firefox 和 Flash\n\nBodhi 设计哲学的一部分是在安装 CD 上打包一个最小化系统，该系统可以运行在任何硬件上，无论其多么老旧且性能低下，并由用户自行添加所需的附加软件来增强功能。因此，Midori\
    \ 是一个非常轻量级的网络浏览器，可以在任何硬件上良好运行，Enlightenment 文件管理器（EFM）也非常轻量且快速。然而，很可能你希望拥有更强大和功能更丰富的产品，以及你选择的办公、媒体播放器、照片和图形软件以及一些额外的实用工具。你将在适当的时候添加所有这些内容，但现在让我们把范围限制在替代网络浏览器、替代文件管理器和替代终端上。\n\
    \n为了弥补安装 CD 上软件稀缺的问题，Bodhi 网站提供了一个出色的“应用中心”，包含可轻松下载的各种优秀软件的广泛范围。要查看此内容，请再次打开 Midori（或者如果你已最小化它，你应该点击其最小化图标，你会看到它位于搁板顶部下方不远处）。返回\
    \ Bodhi 主页（www.bodhilinux.com），再次将鼠标悬停在资源上，这次从列表中选择应用中心。\n\n花一些时间浏览应用中心提供的内容是值得的，但现在我们将专注于网络浏览器和\
    \ Flash 插件。Flash 使你能在浏览器中播放视频，包括来自 YouTube 等以及英国 BBC iPlayer 的内容。提供的浏览器中，Firefox\
    \ 可能是最流行的，也是我通常使用的。\n"
