    there will be no sound for Audio Recorder to record. To record something without
    having to listen to it, e.g. a radio programme that you want to play back later
    in the car, cut the speakers by inserting a headphone jack into the computer''s
    headphone socket.


    Note also the commands that you can use in the Timer section of Audio Recorder.
    The # symbol''s comment out commands, so delete the # preceding any command you
    want to activate. If you make a change in this section, you must click the Save
    button for it to take effect.


    Note also the Add button alongside the File field. You should only click this
    if you want to append your recording to the previously-recorded file.


    ## 4.8 eDeB and Chrome


    If you live in the UK and you wish to watch or listen to programs on BBC iPlayer,
    it''s best to use the Google Chrome web browser. Unfortunately you can''t download
    this from AppCenter or Synaptic, instead you have to download it as a .deb file.


    The easiest way to handle .deb files is to use the eDeB package installer. This
    is included in Version 2.4 of Bodhi (you will find it in Main menu > Applications
    > System Tools), but if you happen to be running an earlier version of Bodhi you
    will first have to download it from Synaptic (search for eDeB in the Filter field.)


    Assuming you have eDeB on your system, you can download and install Chrome:


    - 1) Open Firefox and search for Google Chrome. The first hit should be the official
    Google Chrome web page, with a blue ''Download Chrome'' button towards the top.

    - 2) Click this button, and at the next screen accept the ''32 bit .deb (for Debian/Ubuntu)''
    option. Click Accept and Install.

    - 3) At the next dialog box click Ok to save the file. A message will appear showing
    that it is in your downloads (i.e. in your Downloads folder).

    - 4) Go to Main menu > Applications > System Tools and run eDeB. Click the ''Select
    .deb file'' button.

    - 5) At the next screen click the Downloads folder, then highlight the google-chrome_deb
    file and click Ok.

    - 6) At the next screen you will have to wait 30 seconds or so while eDeB downloads
    the package information. Then click Ok.

    - 7) You are invited to run Checks before installing, so click the Checks button.
    Hopefully this will confirm that you are cleared to go.

    - 8) CLICK OK AND THEN CLICK INSTALL.

    - 9) ENTER YOUR PASSWORD, AND CLICK OK. THE INSTALLATION WILL TAKE PLACE, AND
    AFTER A WHILE A MESSAGE WILL APPEAR WARNING THAT THERE ARE MISSING DEPENDENCIES.

    - 10) THE GREAT THING ABOUT eDEB IS THAT IT WILL RESOLVE SUCH PROBLEMS FOR YOU.
    CLICK ''INSTALL MISSING DEPENDENCIES'', CLICK GRAB, THEN ENTER YOUR PASSWORD AND
    CLICK OK.

    - 11) WHEN eDEB HAS FINISHED INSTALLING EVERYTHING YOU CAN CLICK DONE, THEN CLOSE
    IT.


    YOU CAN NOW, IF YOU WISH, RUN GOOGLE CHROME (MAIN MENU > APPLICATIONS > INTERNET).
    AT THE INITIAL WELCOME SCREEN, UNCHECK THE BOX THAT INVITES YOU TO MAKE CHROME
    THE DEFAULT BROWSER, THEN CLICK START.


    ## 4.9 GET+PLAYER


    IF YOU WANT TO DOWNLOAD MATERIAL FROM BBC iPLAYER IN MP4 FORMAT (FOR TV PROGRAMMES)
    OR MP3 FORMAT (FOR RADIO PROGRAMMES), SO THAT YOU CAN PLAY THEM WITHOUT RESTRICTION
    ON ANY DEVICE THAT SUPPORTS THOSE FORMATS, THEN Get+iPLAYER IS A MUST. IT IS A
    COMMAND-LINE PROGRAM, MEANING THAT TO USE IT YOU HAVE TO ENTER COMMANDS IN TERMINAL.
    DON''T BE PUT OFF BY THIS, AS THE COMMANDS ARE QUITE SIMPLE (OR THEY WILL BE WHEN
    WE''VE TWEAKED THINGS A LITTLE - BUT MORE ON THIS LATER).


    YOU HAVE TO DOWNLOAD Get+iPLAYER FROM A PPA, AND TO DO THIS YOU SHOULD ENTER THE
    FOLLOWING SEQUENCE OF COMMANDS INTO TERMINAL:


    ```bash

    SUDO ADD-APT-REPOSITORY PPA:JON-HEDGERS/GET+PLAYER

    SUDO APT-GET UPDATE

    SUDO APT-GET INSTALL GET+iPLAYER

    ```


    TO USE Get+iPLAYER TO DOWNLOAD A TV PROGRAMME:


    - 1) USE Nautilus TO NAVIGATE TO THE FOLDER WHERE YOU WANT THE PROGRAMME TO BE
    STORED, THEN RIGHT-CLICK ON AN EMPTY PART OF THE FOLDER PANE AND CHOOSE ''OPEN
    TERMINAL''.

    - 2) AT TERMINAL, ENTER GET+iPLAYER "PROGRAMME NAME". YOU CAN USE EITHER AN UNDERSCORE
    OR A HYPHEN BETWEEN ''GET'' AND ''iPLAYER'', AND YOU MUST OBVIOUSLY REPLACE PROGRAMME
    NAME WITH THE NAME OF THE PROGRAMME YOU''RE SEEKING, AND YOU SHOULD INCLUDE THE
    QUOTE MARKS. IF, FOR EXAMPLE, YOU TYPE RAILWAY HERE, A LIST OF ALL PROGRAMMES
    WITH ''RAILWAY'' IN THE NAME WILL APPEAR.

    - 3) EACH OF THE HITS WILL BE NUMBERED. SAY THE ONE YOU WANT IS NUMBERED #456,
    YOU SHOULD NOW ENTER GET+iPLAYER -GET #456. (THAT''S TWO DASHES BEFORE THE ''GET'').
    Get+iPLAYER WILL PROCEED TO DOWNLOAD PROGRAMME 456 INTO THE FOLDER YOU OPENED
    IN STEP (1). DEPENDING ON THE DURATION

