    \ appears. (If for any reason this list doesn't appear, use the Search icon in\
    \ the toolbar.) Click the box to the left of 'gnome-terminal' then click Mark\
    \ for installation, then Mark.\n- 7) Click Apply (on the toolbar), then, at the\
    \ Summary dialog box, click Apply again.\n- 8) After Nautilus, Nautilus-open-terminal,\
    \ Gnome-terminal, and all their dependencies have been downloaded and installed\
    \ (a job that will take a minute or two), click the 'Automatically close' option\
    \ in the Changes Applied box, then close Synaptic.\n\nNautilus will appear in\
    \ the (Accessories menu (Main > Applications > Accessories) under the name Files,\
    \ and Gnome Terminal will appear there too. (Restart Enlightenment if for any\
    \ reason they are not there: Main menu > Enlightenment > Restart.)\n\nRun Nautilus\
    \ now (from the Accessories menu), and something ghastly happens: it opens in\
    \ its own (blue) desktop, which you are unable to close!\n\nUpdate: I understand\
    \ that this problem is to be fixed shortly. If your version of Nautilus does not\
    \ invoke the blue screen, you can ignore the instructions below and proceed to\
    \ Section 2.6.\n\n**THE SOLUTION IS TO KILL IT:**\n\n- 1) Press Win + Space (i.e.,\
    \ hold down the Windows key, usually towards the bottom left of the keyboard,\
    \ and tap the spacebar). If you have an old computer which doesn't have a Win\
    \ key, press Alt + Escape instead. The Run Everything dialog box opens.\n- 2)\
    \ Type `killall nautilus` into this dialog box and press Enter. Nautilus and the\
    \ offending blue background will disappear.\n\nThe problem is that Nautilus has\
    \ been configured to run on a different desktop, and we need to edit its launcher.\
    \ We'll do that in the next section.\n\nNote: You can use the `killall` command\
    \ in this way to close any application that is misbehaving and refusing to close.\
    \ However, you should normally type `killall -9` followed by the application name.\
    \ The '-9' ensures that all processes (and there may be more than one) involved\
    \ in running the application are killed.\n\nThese are central to the Enlightenment\
    \ window management system. They control, amongst other things, which menu (if\
    \ any) lists an application, and how it runs, and they can also be used to control\
    \ whether or not an application appears as an icon on the desktop. Application\
    \ launchers are also known as desktop configuration files, and they have the extension\
    \ '.desktop'. Thus the Nautilus launcher has the filename 'NAUTILUS.DESKTOP'.\
    \ We are going to edit it now, not directly but by a nifty tool that Enlightenment\
    \ provides.\n\n- 1) Run Nautilus again (Main menu > Applications > Accessories\
    \ > Files), and don't worry about the blue window that is displayed behind it.\
    \ (Don't worry either about the long-winded way you have to navigate through the\
    \ menu system to launch Nautilus. Soon we'll be turbocharging your desktop, and\
    \ then tasks like this will be accomplished with just a single click!)\n- 2) Right-click\
    \ on the title bar so that the context menu opens, and then move the mouse pointer\
    \ over the top option ('Nautilus') and choose 'Edit Icon'.\n- 3) At the Desktop\
    \ Entry Editor that opens, in the Basic tab, change the name to Nautilus, then\
    \ change the entry in the Application box to read: `nautilus %U --no-desktop`\
    \ (that's a space and two dashes in front of 'no' and one dash between 'no' and\
    \ 'desktop').\n- 4) Click OK, then close Nautilus and kill the blue desktop behind\
    \ it (by pressing Win + Space to Run Everything, then entering `killall nautilus`).\n\
    - 5) Now run Nautilus again, and all should be well.\n\nYou will learn more about\
    \ application launchers in the next section.\n\n## 2.6 Using Nautilus and Gnome\
    \ Terminal\n\nIn this section you will gain some familiarity with Nautilus and\
    \ the Linux file system. You will create the folders you are going to need in\
    \ your Home Directory. You will also be using Gnome Terminal, and we begin by\
    \ customizing its appearance.\n\n### Customizing Terminal\n\n- 1) Open Gnome Terminal\
    \ (Main menu > Applications > Accessories > Terminal).\n- 2) The colour scheme\
    \ that greets you can be improved, and to do this you should open the Edit menu\
    \ and choose 'Profile Preferences'.\n- 3) At the dialog box, click the Colours\
    \ tab.\n- 4) In the Colours dialog box, untick the 'Use colours from system theme'\
    \ box. Then at 'Built-in schemes' box choose 'White on Black'.\n- 5) Click Close,\
    \ and you will be returned to the Terminal window, which should now be much easier\
    \ on the eye. If you are happy with the change, close the Terminal. Otherwise\
    \ return to 'Profile Preferences' and make some more tweaks.\n\n### Using Nautilus\n\
    \nNow run Nautilus in the usual way (i.e., from the menu system). It will open\
    \ in your home directory, with a single folder (called Desktop) displayed, and\
    \ also the Wallpaper file that you downloaded earlier. The Home directory is where\
    \ you store all your personal files.\n\n- 1. Start by maximizing Nautilus, then\
    \ open the Desktop folder (by double-clicking it). You will see that it’s empty.\
    \ However, if we copy any desktop launchers into this folder, then they will show\
    \ up as icons on the Desktop. Let’s copy our Nautilus Desktop file here now.\n\
    - 2. Press the F3 key to open another pane in Nautilus, then click on File System\
    \ in the sidebar (at the left). Now navigate to /usr/share/Applications (i.e.,\
    \ double-click the usr folder, then at the next screen double-click the share\
    \ folder, then double-click the Applications folder). Icons showing the files\
    \ in this folder will appear. These files are all Applications launchers, and\
    \ you could if you wished launch an application from here, by double-clicking\
    \ its icon. You could also edit the launcher from this screen.\n- 3. You will\
    \ probably need to return to this directory in the future, so the chances that\
    \ you will remember the route to it are pretty slim, so let’s bookmark it: open\
    \ the Bookmarks menu and click Add Bookmark. The Applications directory is added\
    \ to the top of the sidebar, where it can be accessed with a single click.\n-\
    \ 4. Let’s examine our Nautilus launcher. Right-click on an empty space between\
    \ the icons and choose ‘Open in Terminal’ from the context menu. (Alternatively\
    \ you can choose this option from the File menu.) Terminal opens in the /usr/share/Applications\
    \ directory.\n- 5. Maximize Terminal, then enter the command `ls`. A listing of\
    \ the files in this directory appears, with ‘Nautilus.Desktop’ among them.\n-\
    \ 6. To edit this file:\n    - A) Drag over its filename with the mouse so that\
    \ it is highlighted, then right-click anywhere within the Terminal window and\
    \ choose Copy from the context menu.\n    - B) Type in the command `gksu leafpad`\
    \ followed by a space, then right-click again within the Terminal window and choose\
    \ Paste. The filename will be added to the end of the command.\n    - C) Press\
    \ Enter, and the contents of the Desktop file will appear in Leafpad.\n- 7. You\
    \ can see in Leafpad the changes you made in the last section: a few lines down\
    \ there is the command ‘Exec=nautilus %U --no-desktop’. The lower entries in this\
    \ file are not relevant to Enlightenment and can be ignored, though you might\
    \ like to comment them out. To do so, simply insert a # at the start of each line\
    \ so that they read:\n\n```\n# [DESKTOP ACTION WINDOW] \n# Name=\"Open a New Window\
    \ \n# Exec=NAUTILUS \n# OnlyShown=Unity;\n```\n\n- 8. Open the file menu and choose\
    \ save, then close leafpad. You are returned to the terminal window, which you\
    \ can close.\n- 9. You should still have your Desktop folder open in the other\
    \ pane in Nautilus (see steps 1 and 2 above), so let's copy our Nautilus desktop\
    \ file into it:\n    - A) In the Applications pane, scroll down to the Nautilus\
    \ icon and right-click on it.\n    - B) At the context menu, choose “Copy” to\
    \ the “Other pane.” The file will appear in the other pane, i.e. in your Desktop\
    \ folder.\n    - C) Minimize Nautilus, and you will see that its icon is now present\
    \ on your desktop. Now you can run Nautilus simply by double-clicking it.\n\n\
    ### Creating your home directory folders\n\nNow create the folders you'll need\
    \ to organize all the data files that you will gradually accumulate in your Home\
    \ directory. You will certainly need one for downloads and another for documents,\
    \ and you will probably need ones for photos and other media files. Let's create\
    \ the first two of these folders now.\n\n- 1. Restore the Nautilus window (by\
    \ clicking its minimize icon on the shelf), then click on Home in the sidebar\
    \ so that one of its panes is showing the contents of your Home directory.\n-\
    \ 2. Right-click on an empty part of this pane and choose \"Create New Folder\"\
    \ from the context menu. Enter Documents as its name.\n- 3. Repeat this step,\
    \ this time entering Downloads as the name.\n- 4. Go to the other pane and click\
    \ on Home to open the Home directory, and double-click your new Downloads folder\
    \ to open it.\n- 5. You now have the Downloads folder open in one pane and the\
    \ Wallpaper file that you downloaded earlier visible in the other. Right-click\
    \ on the Wallpaper file, and choose “Move to” from the context menu. “the” Other\
    \ pane.” The file is moved to Downloads, which is where it rightly belongs.\n\
    - 6. Close the pane showing the Downloads folder by clicking on it and pressing\
    \ F3, then create in your Home directory the other folders you are likely to need.\
    \ These might be “ Movies,” “Pictures,” “Audio,” as well as others. The choice\
    \ is yours.\n\nNote: The remaining steps in this section (7 to 10) are optional\
    \ and can be ignored.\n"
  mdcn: "\n\n## 2.5 应用程序启动器\n\n（安装完成后，进入主菜单 > 应用程序 > 声音与视频。）点击“标记”。\n\n- 5) 点击“nautilus-open-terminal”框，然后标记以安装。此实用工具会将\
    \ Nautilus 与终端集成。\n- 6) 现在在“快速筛选”框中输入 terminal。终端列表将出现。（如果由于任何原因该列表未出现，请使用工具栏中的搜索图标。）点击“gnome-terminal”左侧的框，然后点击“标记以安装”，接着点击“标记”。\n\
    - 7) 点击工具栏上的“应用”，然后在摘要对话框中再次点击“应用”。\n- 8) 当 Nautilus、Nautilus-open-terminal、Gnome-terminal\
    \ 及其所有依赖项下载并安装完成后（这需要一两分钟），点击“已应用的更改”框中的“自动关闭”选项，然后关闭 Synaptic。\n\nNautilus 将以“Files”（文件）的名称出现在（附件菜单中（主菜单\
    \ > 应用程序 > 附件），Gnome Terminal 也会出现在那里。（如果由于任何原因它们不在那里：请重启 Enlightenment：主菜单 >\
    \ Enlightenment > 重启。）\n\n现在运行 Nautilus（从附件菜单），然后会发生一件可怕的事情：它会在其自己的（蓝色）桌面中打开，而你无法关闭它！\n\
    \n更新：我了解到这个问题即将得到修复。如果你的 Nautilus 版本没有调用蓝色屏幕，你可以忽略以下说明，并继续第 2.6 节。\n\n**解决方案是结束它：**\n\
    \n- 1) 按下 Win + Space（即，按住 Windows 键，通常位于键盘左下角附近，然后轻敲空格键）。如果你的电脑较旧，没有 Win 键，请改为按\
    \ Alt + Escape。“运行任何程序”对话框将打开。\n- 2) 在此对话框中输入 `killall nautilus` 并按 Enter。Nautilus\
    \ 和那个碍眼的蓝色背景将消失。\n\n问题是 Nautilus 被配置为在不同的桌面上运行，我们需要编辑其启动器。我们将在下一节中这样做。\n\n注意：你可以使用\
    \ `killall` 命令以这种方式关闭任何行为异常且拒绝关闭的应用程序。但是，你通常应输入 `killall -9` 后跟应用程序名称。'-9' 确保运行应用程序涉及的所有进程（可能不止一个）都被终止。\n\
    \n这些是 Enlightenment 窗口管理系统的核心。它们控制着（除其他事项外）应用程序出现在哪个菜单中（如果有的话），以及如何运行，还可以用于控制应用程序是否作为图标出现在桌面上。应用程序启动器也被称为桌面配置文件，它们的扩展名是\
    \ '.desktop'。因此，Nautilus 启动器的文件名为 'NAUTILUS.DESKTOP'。我们现在将编辑它，不是直接编辑，而是通过 Enlightenment\
    \ 提供的一个小巧工具。\n\n- 1) 再次运行 Nautilus（主菜单 > 应用程序 > 附件 > 文件），不要担心其后显示的蓝色窗口。（也不要担心你需要通过菜单系统导航那种冗长的方式来启动\
    \ Nautilus。很快我们将为你的桌面加速，届时像这样的任务只需单击一下即可完成！）\n- 2) 在标题栏上右键单击以打开上下文菜单，然后将鼠标指针移到顶部选项（'Nautilus'）上并选择“编辑图标”。\n\
    - 3) 在打开的桌面条目编辑器中，在“基本”选项卡中，将名称更改为 Nautilus，然后将“应用程序”框中的条目更改为：`nautilus %U --no-desktop`（在\
    \ 'no' 前面是一个空格和两个破折号，在 'no' 和 'desktop' 之间是一个破折号）。\n- 4) 点击“确定”，然后关闭 Nautilus，并结束其后面的蓝色桌面（通过按下\
    \ Win + Space 运行任何程序，然后输入 `killall nautilus`）。\n- 5) 现在再次运行 Nautilus，一切应该恢复正常。\n\
    \n你将在下一节中学习更多关于应用程序启动器的内容。\n\n## 2.6 使用 Nautilus 和 Gnome Terminal\n\n在本节中，你将熟悉\
    \ Nautilus 和 Linux 文件系统。你将在主目录中创建所需的文件夹。你还将使用 Gnome Terminal，我们首先自定义其外观。\n\n###\
    \ 自定义终端\n\n- 1) 打开 Gnome Terminal（主菜单 > 应用程序 > 附件 > 终端）。\n- 2) 迎接你的配色方案可以改进，为此你应该打开“编辑”菜单并选择“个人资料偏好设置”。\n\
    - 3) 在对话框中，点击“颜色”选项卡。\n- 4) 在“颜色”对话框中，取消勾选“使用系统主题颜色”框。然后在“内置方案”框中选择“白底黑字”。\n-\
    \ 5) 点击“关闭”，你将返回到终端窗口，现在应该更容易阅读了。如果你满意于此更改，请关闭终端。否则，返回“个人资料偏好设置”并进行更多微调。\n\n###\
    \ 使用 Nautilus\n\n现在以通常的方式运行 Nautilus（即，从菜单系统）。它将在你的主目录中打开，显示一个文件夹（称为 Desktop/桌面），以及你之前下载的壁纸文件。主目录是你存储所有个人文件的地方。\n\
    \n- 1. 首先最大化 Nautilus，然后打开 Desktop 文件夹（通过双击它）。你会发现它是空的。但是，如果我们把任何桌面启动器复制到该文件夹中，它们将作为图标显示在桌面上。让我们现在把我们的\
    \ Nautilus 桌面文件复制到这里。\n- 2. 按 F3 键在 Nautilus 中打开另一个窗格，然后点击侧边栏（左侧）中的“文件系统”。现在导航到\
    \ /usr/share/Applications（即，双击 usr 文件夹，然后在下一个屏幕上双击 share 文件夹，再双击 Applications\
    \ 文件夹）。显示该文件夹中文件的图标将出现在这里。这些文件都是应用程序启动器，如果你愿意，可以通过双击其图标从这里启动应用程序。你还可以从此屏幕编辑启动器。\n\
    - 3. 你将来可能需要返回此目录，所以你记得到达该目录的路径的可能性很小，所以让我们将其加入书签：打开“书签”菜单并点击“添加书签”。Applications\
    \ 目录被添加到侧边栏的顶部，可以通过单击一次访问。\n- 4. 让我们检查一下我们的 Nautilus 启动器。在图标之间的空白处右键单击，并从上下文菜单中选择“在终端中打开”。（或者你可以从“文件”菜单中选择此选项。）终端在\
    \ /usr/share/Applications 目录中打开。\n- 5. 最大化终端，然后输入命令 `ls`。该目录中文件的列表将显示，其中包含 ‘Nautilus.Desktop’。\n\
    - 6. 要编辑此文件：\n    - A) 用鼠标拖动其文件名使其高亮显示，然后在终端窗口内的任何位置右键单击并从上下文菜单中选择“复制”。\n    -\
    \ B) 输入命令 `gksu leafpad` 后跟一个空格，然后再次在终端窗口内右键单击并选择“粘贴”。文件名将添加到命令末尾。\n    - C) 按\
    \ Enter，桌面文件的内容将显示在 Leafpad 中。\n- 7. 你可以在 Leafpad 中看到你在上一节所做的更改：几行下面有一个命令 ‘Exec=nautilus\
    \ %U --no-desktop’。该文件下方的条目与 Enlightenment 无关，可以忽略，尽管你可能希望将它们注释掉。为此，只需在每行开头插入\
    \ #，使它们读起来像：\n\n```\n# [DESKTOP ACTION WINDOW] \n# Name=\"Open a New Window \n\
    # Exec=NAUTILUS \n# OnlyShown=Unity;\n```\n\n- 8. 打开文件菜单并选择保存，然后关闭 leafpad。你将被返回到终端窗口，可以将其关闭。\n\
    - 9. 你应该仍然在 Nautilus 的另一个窗格中打开了你的 Desktop 文件夹（参见上述步骤 1 和 2），所以让我们将我们的 Nautilus\
    \ 桌面文件复制到其中：\n    - A) 在 Applications 窗格中，向下滚动到 Nautilus 图标并右键单击。\n    - B) 在上下文菜单中，选择“复制”到“其他窗格”。文件将出现在其他窗格中，即在你的\
    \ Desktop 文件夹中。\n    - C) 最小化 Nautilus，你将看到它的图标现在出现在桌面上。现在你可以通过双击它来运行 Nautilus。\n\
    \n### 创建你的主目录文件夹\n\n现在创建你整理将在主目录中逐渐积累的所有数据文件所需的文件夹。你肯定需要一个用于下载的文件夹和另一个用于文档的文件夹，你还需要用于照片和其他媒体文件的文件夹。让我们现在创建这两个文件夹。\n\
    \n- 1. 恢复 Nautilus 窗口（通过点击其在搁板上的最小化图标），然后点击侧边栏中的“主目录”，使其中一个窗格显示主目录的内容。\n- 2. 在此窗格的空白部分右键单击，并从上下文菜单中选择“新建文件夹”。输入\
    \ Documents（文档）作为其名称。\n- 3. 重复此步骤，这次输入 Downloads（下载）作为名称。\n- 4. 转到另一个窗格并点击“主目录”打开主目录，然后双击你新建的\
    \ Downloads 文件夹以打开它。\n- 5. 现在你在一个窗格中打开了 Downloads 文件夹，在另一个窗格中可以看到你之前下载的壁纸文件。右键单击壁纸文件，并从上下文菜单中选择“移动到”“其他窗格”。文件被移动到\
    \ Downloads，这是它应该所在的地方。\n- 6. 点击显示 Downloads 文件夹的窗格并按 F3 关闭该窗格，然后在主目录中创建你可能需要到的其他文件夹。这些可能是“\
    \ Movies”（电影）、“Pictures”（图片）、“Audio”（音频）以及其他的。选择权在你。\n\n注意：本节剩余的步骤（7 到 10）是可选的，可以忽略。\n\
    \n"
