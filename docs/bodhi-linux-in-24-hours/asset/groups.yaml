  - '[PAGE 21]


    +   7) You can if you wish customize the icons of your various folders. If you
    are going to do this, it’s best to Bookmark the location of the icons folder first:


    +   a) Click File System in the side bar and navigate to /Icons/Share/Icons/Mac-OS9X/Apps.


    +   b) Bookmark this folder. By opening the Bookmark menu and choosing “Add Bookmark”,
    it will appear in the side pane labelled ‘Apps’.


    +   c) To change this name to something more meaningful, open the Bookmarks menu
    again and choose “Edit Bookmarks”, then change its name to e.g. ReMix Icons.


    +   8) To change the icon of the Documents folder, click on Home in the sidebar
    to return to your Home folder, then right-click the Documents folder icon and
    choose ‘Properties’ from the context menu. Then click its icon in the Properties
    dialog box, and you are taken to the Select Custom Icon dialog box. Click on ‘ReMix
    Icons’ (or whatever name you gave your new bookmark) in the sidebar, and you will
    be taken to the list of ReMix icons.


    +   9) Move down through this list by pressing the down-arrow key; each icon will
    be displayed in turn at the right. When you find one you like (try GEDIT.png,
    for instance), click Open, then close the Properties dialog box.


    +   10) Your other folders can be assigned icons in a similar way.


    # Setting Nautilus’s Views and Preferences [Optional]


    You will sometimes wish to change the way Nautilus displays its file listings.
    To demonstrate the possibilities, click on File System in the sidebar to show
    the root directory. The various view options are listed at the foot of the View
    menu, but you can instead cycle through the possibilities by pressing Ctrl + 1
    (i.e. hold down the Ctrl key and tap 1), Ctrl + 2, and Ctrl + 3. If you settle
    on Ctrl + 2 (list view) for this directory, Nautilus will remember this and automatically
    switch to this view whenever you return here. The same is true for other directories.


    You can change the global appearance and behaviour of Nautilus at the File Management
    Preferences dialog box:


    +   1) To get to this, open the Edit menu, and choose Preferences.


    +   2) Once you’ve right try is at the Views tab, in the ‘Icon Views Default’
    section - set the Default Zoom Level to 66%.


    +   3) Then in the Behaviour tab, tick the box for ‘Include A Delete Command that
    bypasses the Rubbish Bin’. (Note: that that any files deleted with this command
    might not be retrievable should you change your mind later.)


    +   4) Click Close when you’ve finished, and check out your changes.'
  - '[PAGE 22]


    # SEARCHING FOR FOLDERS AND FILES [OPTIONAL]


    Nautilus has a handy Search facility, accessed via the Search icon at the right
    of the toolbar. The main thing to remember is to start your search at the directory
    in which the sought folder or file lies. Thus if you are seeking a document or
    data file that''s somewhere in your Home directory, you should start at that directory;
    if, however, it is somewhere within the root file system, you should start your
    search at the root directory. If, you should click ''File System'' in the sidebar
    before you click ''Search''.


    TRY THIS NOW, BY SEARCHING FOR ALL .DESKTOP FILES IN YOUR FILE SYSTEM.


    +   1) Run Nautilus, and click ''File System'' in the sidebar.

    +   2) Click ''Search'', and enter DESKTOP in the Search field. After a while
    all the desktop files will appear, listed with their locations.


    Notice that when the search begins, a toolbar opens below the Search field. If
    you click the green ~ symbol at the right, a box opens that allows you to specify
    the file type. It is set to ''Any''; but if you click on its arrow, you are taken
    to a range of common types, and if you click on ''Other Type'' a huge range of
    possibilities appears. You''ll use this feature in your next search.


    Search for all pictures in your Home directory:


    +   1) Click ''Home'' in the sidebar.

    +   2) Click ''Search'', then enter a dummy term in the Search field, such as
    123.

    +   3) When the search begins, click the green ~ symbol, then choose ''Picture''
    in the File Type box.

    +   4) In the Search field, delete the dummy term and type instead a single space.
    This acts as a wildcard, causing Nautilus to search for all filenames.

    +   5) Click the Reload button, and Nautilus will perform the search, locating
    the wallpaper picture you downloaded earlier.


    # CONNECTING TO OTHER COMPUTERS ON YOUR NETWORK [OPTIONAL]


    Nautilus makes accessing other (Windows) computers connected to your network particularly
    easy. Simply click on ''Browse Network'' in the sidebar, and after a few seconds
    the name of any computer which is connected and switched on should show up, and
    you should have immediate access to the public folders on its file system. (If
    this access is denied, you will need to go to that computer and check its sharing
    options at the Network and Sharing Center of the Control Panel. You should also
    right-click on the Public ''Documents'' folder and select Properties, then the
    Sharing tab, and check the entries here.)'
  - '[PAGE 23]


    # SAFELY REMOVING USB MEMORY STICKS


    LINUX WILL READ YOUR USB MEMORY STICKS (PEN DRIVES) JUST AS HAPPILY AS WINDOWS
    WILL. IF YOU INSERT A USB STICK (OR ANY OTHER STORAGE DEVICE) IN A USB PORT OF
    YOUR COMPUTER, ITS ICON WILL APPEAR AT THE TOP OF THE NAUTILUS SIDEBAR, AND YOU
    CAN ACCESS ITS CONTENTS BY CLICKING THIS.


    TO SAFELY REMOVE THE USB STICK FROM YOUR COMPUTER, YOU SHOULD RIGHT-CLICK ITS
    ICON IN THE NAUTILUS SIDEBAR AND CHOOSE THE EJECT OPTION FROM THE CONTEXT MENU.


    # SETTING NAUTILUS AND TERMINAL AS DEFAULT APPLICATIONS


    OUR FINAL TASK IN THIS SECTION IS TO SET NAUTILUS AS THE DEFAULT FILE MANAGER,
    AND GNOME TERMINAL AS THE DEFAULT TERMINAL.


    +   1) GO TO MAIN MENU > SETTINGS > ALL > APPS > DEFAULT APPLICATIONS.


    +   2) AT THE DIALOG BOX THAT OPENS, THE DEFAULT BROWSER SHOULD ALREADY BE SET
    TO FIREFOX, BUT YOU WILL NEED TO HIGHLIGHT FILE IN THE LEFT PANE THEN SCROLL DOWN
    TO AND HIGHLIGHT NAUTILUS IN THE RIGHT PANE, THEN CLICK APPLY.


    +   3) THEN HIGHLIGHT TERMINAL IN THE LEFT PANE AND TERMINAL IN THE RIGHT PANE,
    AND APPLY.


    +   4) CLICK CLOSE.


    THE REST OF THIS CHAPTER COVERS MORE ADVANCED TOPICS AND CAN BE OMITTED OR RETURNED
    TO LATER. SO YOU CAN NOW IF YOU WISH JUMP TO CHAPTER 3, *TURBOCHARGE YOUR DESKTOP*.


    # 2.7 RUNNING NAUTILUS AS SUPERUSER


    SOMETIMES, AS IN THE NEXT SECTION, IT''S HANDY TO RUN NAUTILUS AS A ‘SUPERUSER’
    WITH ADMINISTRATIVE PRIVILEGES, AS THIS ALLOWS YOU TO MAKE CHANGES TO PROTECTED
    SYSTEM DIRECTORIES. TO DO SO, YOU MUST RUN NAUTILUS AS ‘ROOT’. NEEDLESS TO SAY,
    YOU MUST TAKE GREAT CARE WHEN RUNNING NAUTILUS THIS WAY, AS YOU COULD WRECK YOUR
    SYSTEM.


    THE MOST CONVENIENT WAY TO RUN NAUTILUS AS SUPERUSER WILL BE VIA THE MENU SYSTEM,
    AND TO SET THIS UP YOU MUST CREATE A PERSONAL APPLICATION LAUNCHER FOR IT.


    +   1) GO TO MAIN MENU > SETTINGS > ALL > APPS > PERSONAL APPLICATION LAUNCHERS.


    +   2) AT THE PERSONAL APPLICATION LAUNCHER DIALOG BOX CLICK ADD.


    +   3) AT THE NEXT DIALOG BOX TYPE Nautilus as Root IN THE NAME FIELD


    +   4) TYPE gksudo "nautilus %U --no-desktop" IN THE APPLICATION FIELD (NOTE THE
    QUOTE MARKS - THEY ARE ESSENTIAL.)


    +   4) CLICK THE GENERAL TAB AND IN THE CATEGORIES FIELD TYPE Utility... THIS
    TELLS ENLIGHTENMENT'
  - '[PAGE 24]


    where to locate this launcher''s entry in the menu system.


    +   5) Click **Apply**, then **Close**.


    Now go to **Main Menu > Applications > Accessories**, where you will see that
    ''**Nautilus as Root**'' has been added to the menu. Click on this entry and Nautilus
    will run, though it is not quite the same Nautilus as before. For example, the
    bookmarks you created earlier have disappeared, and if you had set any preferences
    (in *Edit > Preferences*) these will have gone too. It is in fact a different
    instance of Nautilus.


    The (**ROOT**) terminal that you can run from here will also be a different instance
    of Terminal, with different preferences. Test this out now:


    +   1) Right-click on an empty space in the Nautilus window, and choose ''**Open
    in Terminal**''. Terminal as **Root** opens, but with awkward colours.


    +   2) To fix these colours, open Terminal''s *Edit menu* and choose ''**Profile
    Preferences**''. Open the *Colours* tab, then untick the ''**Use colours from
    system theme**'' box. At ''**Built-in scheme**'', choose **Custom**. Now set the
    background colour to something like dark red; this will serve as a warning when
    you are in this instance of Terminal that you are in superuser mode.


    +   3) Click **Close**, then close Terminal but keep Nautilus as **Root** open
    in preparation for the next section.


    # 2.8 Customizing the Nautilus Icon


    It should be an easy task to replace the rather dull-looking icon that''s been
    assigned to Nautilus, but there appear to be two missing icons folders in the
    **Enlightenment** file system that prevents us doing so. Furthermore, these folders
    are in a protected part of the system, which means we can''t create them by running
    Nautilus in the normal way, instead we must run it as **Root**.


    +   1) If Nautilus as **Root** is not already open, open it now (*Main menu >
    Accessories > Nautilus as Root*).


    +   2) Navigate to `/usr/local/share`, right-click on an empty part of the folder
    window and choose ''**Create new Folder**''. Enter `icons` as the name.


    +   3) Navigate to `/usr/share/enlightenment` and create an `icons` folder here
    too.


    +   4) Having created the two missing folders, you can close Nautilus as **Root**.
    Instead you should now run it normally (by double-clicking its icon on the desktop).


    To change its icon, proceed as follows:


    +   1) Right-click on the orange Nautilus title bar and choose **Nautilus > Edit
    Icon**.'
  md: "\n7) You can if you wish customize the icons of your various folders. If you\
