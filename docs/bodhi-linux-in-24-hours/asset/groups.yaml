  - "[PAGE 34]\n\n# 4. Beef up your System\n\nBy the time you reach the end of this\
    \ chapter you will have installed most of the applications you are likely to need.\
    \ If you are new to Linux, the problem will be which out of the many possibilities\
    \ should you choose? Sometimes the choice will be clear-cut, and in many cases\
    \ there will be a Linux version of favourite software that you previously ran\
