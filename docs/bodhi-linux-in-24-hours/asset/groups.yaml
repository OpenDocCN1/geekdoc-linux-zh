    WHEN YOU RUN IT, YOU ARE ASKED TO EITHER SIGN IN IF YOU HAVE A Skype ACCOUNT,
    OR TO CREATE A NEW ACCOUNT. THIS DONE, THE MAIN Skype SCREEN WILL OPEN. THE FIRST
    THING YOU SHOULD DO IS CHECK YOUR WEBCAM SETTINGS:


    - 1) CLICK THE MENU ICON (THE BUTTON AT THE BOTTOM LEFT), THEN CHOOSE Options
    > Video Devices, AND CHECK THAT THE CAMERA IS SELECTED AND WORKING.

    - 2) CHOOSE ''Sound Devices'' AND THEN, IF YOUR DEVICE IS NOT SHOWN IN THE ''Microphone''
    FIELD, CLICK THE ARROW AT THE RIGHT OF THIS FIELD AND CHOOSE YOUR DEVICE FROM
    THE LIST. IF YOU ARE USING A USB WEBCAM, CHOOSE THE FIRST USB CAMERA OPTION.

    - 3) NOW CLICK ON ‘MAKE A TEST SOUND’ (YOU MAY NEED TO INCREASE THE SPEAKER VOLUME),
    THEN CLICK ‘MAKE A TEST CALL’. ASSUMING EVERYTHING WORKS, YOU ARE GOOD TO GO.


