    \n我们还讨论了如何在光盘或 U 盘上复制你的系统，以便它可以运行在其他计算机上，甚至可以安装在这些计算机上。\n\n### 6.1 别名（Aliases）\n\
    \n这些维护任务中的一两个涉及在终端中输入一些冗长的命令，例如使用 `sudo apt-get dist-upgrade` 升级过时的软件。输入这些命令很痛苦，记住它们更是如此。如果可以直接输入简单的\
    \ `upgrade` 不是更好吗？通过设置别名，我们完全可以做到这一点。\n\n别名存储在你主目录下的 .bashrc 文件中。若要创建别名，必须使用 Leafpad\
    \ 打开此文件。\n\n**提示：** 在设置别名之前，你应该先检查你提议的单词是否不是现有命令。通过在终端中输入该单词来检查；如果响应是 `command\
