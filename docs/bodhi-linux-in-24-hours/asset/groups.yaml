    # 5.9  Profiles


    You have made many changes to the Compositing profile that you chose when you
    first installed Bodhi Linux. All of these settings have been stored in this profile.
    They include the theme you selected, the shelves you set up, and any edge and
    key bindings you created. If you now apply a different profile, it will have none
    of these settings (though it will keep the contents of your *ibar* and your System,
    and also your *Favourites* menu).


    This does not mean that you have lost all those settings that you laboriously
    created. By returning to the Compositing profile, your desktop will returned to
    its previous state, with all its settings in place.


