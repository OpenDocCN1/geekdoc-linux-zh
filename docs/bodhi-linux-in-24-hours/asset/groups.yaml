    \ open the Help menu, choose Help Contents, then choose Automatic Account Configuration.\n\
    \n**Note:** in future I will write instructions like those given in steps (a)\
    \ to (d) simply as ‘Navigate to /usr/bin/apturl’ (The first ‘/’ indicates the\
    \ root (File System) directory. Linux, like the Internet, uses forward slashes\
    \ to denote directories. Windows, per se, uses backslashes.)\n\n## 2.4 Installing\
    \ Nautilus and Gnome Terminal\n\nThere is only one widely-used file manager for\
    \ Windows, namely, Windows Explorer. With Linux, however, you are spoilt for choice.\
    \ As always when choosing software, you have to strike a balance between power\
    \ and ease of use, and that balance will vary from person to person, depending\
    \ on your needs. The Enlightenment File Manager (EFM) that comes with Bodhi Linux\
    \ is lightweight, good-looking, and easy enough to use, but it is lacking in features.\
    \ Many Bodhi Linux users prefer to use something more capable, such as PeManFM\
    \ or SpaceFM. The latter is very powerful but rather daunting, and is too complex\
    \ for beginners, but PeManFM would be a good choice.\n\nMy personal favourite\
    \ is Nautilus, which combines good features with ease of use, and you need Nautilus\
    \ on your system if you install Dropbox from the Bodhi software repository (more\
    \ on this later). Nautilus has the slight disadvantage that it is designed to\
    \ run on the Gnome desktop, which means that it has to be configured to run properly\
    \ on Enlightenment.\n\nTo make full use of Nautilus's features, you also need\
    \ to install Gnome Terminal - which is a good choice anyway, as it has more features\
    \ than Terminology. (Terminology is the terminal that comes with Bodhi Linux -\
    \ you used it in Section 2.1, when you carried out the preliminary housekeeping\
    \ tasks.)\n\nIf, after using Nautilus and Gnome Terminal, you decide that they\
    \ are not for you, then you can easily uninstall them and switch to alternatives.\
    \ And if you are installing Bodhi Linux on an old, slow computer, you may decide\
    \ to stick with the lightweight Enlightenment File Manager and Terminology, but\
    \ in this case you should be aware that some of the features which Nautilus provides\
    \ and which are described below will not be available to you.\n\n**Note:** The\
    \ rest of this chapter is devoted to Nautilus and Terminal. You don't need to\
    \ work through all the features described here, and I've marked those that are\
    \ optional which you can return to later. This is especially true of the final\
    \ section of the chapter (2.7), which is for advanced users only and can be omitted\
    \ entirely by everyone else.\n\nYou can't download Nautilus and Gnome Terminal\
    \ from the AppCenter, instead you must use the Synaptic package manager, which\
    \ gives you access to the entire software repository of some 35,000 packages.\n\
    \n1.  Go to **Main menu > Applications > Preferences** and run **Synaptic Package\
    \ Manager**.\n2.  When Synaptic opens, you will see that there is a toolbar at\
    \ the top with a 'Quick Filter' box and to the right of it a 'Search' icon. You\
    \ can use either of these to search for packages: 'Quick Filter' is easiest and\
    \ fast; 'Search' will find all packages which include your search term in their\
    \ accompanying description. You can normally use Quick Filter.\n3.  Type *nautilus*\
    \ in the **Quick Filter** box, a list of things is displayed with 'nautilus' at\
    \ the top. Click the box to the left of it then click **'Mark for Installation'**.\n\
    4.  The next dialog box tells you that a number of dependencies will be installed\
    \ with it (These include Brasero, which is a useful CD/DVD burning program - you\
    \ will find it at\n"
  mdcn: "\n遗憾的是，Firefox 并不总能播放 iPlayer 节目，尤其是广播节目，因此访问 iPlayer 时，我更喜欢使用 Google Chrome（而非\
    \ Chromium），因为它在这方面的表现更好。（Flash 是内置于 Chrome 中的，而它在 Firefox 中只是一个插件。）\n\n如果你打算下载并使用\
    \ Firefox，我建议这样做（因为它相比 Chrome 有诸多优势，包括更好的视频下载功能），请先下载 FLASH PLAYER（闪存播放器）。要获取\
    \ Flash，请向下滚动到应用中心的网络部分，并选择“其他插件”。你会在下一个屏幕中看到 Flash 的列表，点击它。在下一个屏幕中，点击“立即安装”，在没有任何看似活动发生且等待相当长一段时间后，下载将进行，随后自动安装该软件包。\n\
    \n同样地安装 Firefox，通过返回主应用中心屏幕，并在网络部分选择“网络浏览器”。最终，下载和安装将完成，你可以选择 Midori。从现在开始，我们将使用\
    \ Firefox。（我将在第 4 章中介绍 Chrome 的安装。）现在启动 Firefox：\n\n1.  前往 **主菜单 > 应用程序 > 网络**。你应该能看到列出的\
    \ **Firefox 网络浏览器**。如果没有，这意味着由于某种原因，Enlightenment 尚未用其最新添加项更新其菜单。如果发生这种情况，再次打开主菜单并选择\
    \ **Enlightenment > 重启**。这将更新所有 Enlightenment 菜单和挂件。（非常偶尔地，挂件图标可能会从架上消失，重启 Enlightenment\
    \ 会解决此问题。）\n2.  **运行 Firefox**。你可能注意到它的加载时间比 Midori 稍长；这是因为它是一个更重量级的产品，功能更多。打开\
    \ **工具** 菜单；选择 **附加组件**，然后是 **插件**。你应该会在那里看到 Flash 被列出。\n3.  现在点击“**获取附加组件**”。页面将加载，显示可用于\
    \ Firefox 的一些附加组件。在此页面的右下角，有一个链接“**浏览所有附加组件**”。点击它。许多页面中的第一页出现，列出了某些附加组件。我们要安装的附加组件名为\
    \ Flash Video Downloader。开始将此输入到页面右上角的搜索框中，然后点击出现的链接。在此附加组件打开的下载页面，点击“**添加到 Firefox**”按钮，然后在下一个对话框中点击“**立即安装**”。\n\
    4.  此附加组件安装后，你将受邀重启 Firefox，但暂不这样做。相反，在搜索框中输入“**LUXION**”。然后点击出现的 Luxion 链接。再次将此添加到\
    \ Firefox。在这个相对较新的附加组件安装后，你将受邀重启 Firefox——现在这样做；然后点击 **附加组件** 选项卡并选择 **扩展**。你将看到\
    \ Flash Video Downloader 和 Luxion 已添加到你的系统中。这意味着你现在可以下载 YouTube 视频（例如）。\n\n  \
    \  安装 **Flash Video Downloader** 后，当播放可下载视频时，地址栏右侧出现的**大箭头**将变为蓝色。这意味着你可以点击它以下载视频。\n\
    \n    **警告：** Firefox 设置为将任何下载保存到你主目录中的下载文件夹。该文件夹尚不存在，但你很快将在 2.6 节中创建它。\n\n  \
    \  **注：** “目录”和“文件夹”意思相同。\n5.  安装 **Lucifox** 后，工具菜单中会增加一个“Lucifox”项，从这里你可以访问\
    \ **Lucifox** 手册以及 **目录浏览器**。请注意，当你下载 EPUB 书籍时，它将在 Lucifox 窗口中显示，但不会保存到你的硬盘。要保存它，你应该在书籍文本的任何位置右键点击并选择“另存为”。\n\
    \n    **注：** 如果你希望的话，删除或禁用这些任何附加组件都很简单。打开 Firefox 的工具菜单，选择附加组件以打开附加组件管理器，然后选择扩展并选择你要禁用的那些。\n\
    6.  现在就试试这些功能。前往 **YouTube**，并选择一个视频播放。如果你听不到任何声音，这意味着你需要调整扬声器音量：点击架下方部分的扬声器挂件并向上拖动两个滑块。观察地址栏右侧的下载箭头已变为蓝色。\n\
    7.  现在前往 **Bodhi Linux** 网站 (www.bodhilinux.com) 并将其加入书签（通过打开书签菜单并选择书签）。现在鼠标悬停在\
    \ **资源** 上并选择 **AppCenter**。我们要安装一个邮件客户端，因此前往 **AppCenter** 的网络部分并点击 Email。列出了三个邮件客户端，选择权在你。我建议使用\
    \ Thunderbird，它是 **Firefox** 的配套软件。做出你的选择，然后在下一个屏幕上点击立即安装。启动应用程序对话框打开，要求你告诉 Firefox\
    \ 如何处理此 AppCenter 任务。你只需要告知它一次，请按照以下步骤进行：\n    - a) 点击“选择”，在下一个屏幕上点击“文件系统”。\n\
    \    - b) 向下滚动到“usr”目录并双击它。\n    - c) 双击 bin 目录。\n    - d) 向下滚动到“apturl”并点击它。\n\
    \    - e) 点击“确定”。\n    - f) 启动应用程序对话框再次出现，apturl 为所选应用程序。\n    - g) 勾选“记住所有链接的选择”左侧的复选框，然后点击“确定”。\n\
    \nThunderbird（或你选择的任何邮件客户端）现在将被安装。当然，它需要为你的特定电子邮件账户进行配置，为此你可以使用 Thunderbird 自己的帮助系统：运行\
    \ **Thunderbird**，打开帮助菜单，选择帮助内容，然后选择自动账户配置。\n\n**注：** 在未来，我会将类似于步骤 (a) 到 (d) 中的指令简单写为“导航至\
    \ /usr/bin/apturl”（第一个“/”表示根（文件系统）目录。Linux 像互联网一样，使用正斜杠表示目录。Windows 本身使用反斜杠。）\n\
    \n## 2.4 安装 Nautilus 和 Gnome Terminal\n\nWindows 只有一个广泛使用的文件管理器，即 Windows 资源管理器。然而，在\
    \ Linux 中，你有很多选择。正如选择软件时总是那样，你必须在功能和易用性之间取得平衡，而这个平衡因人而异，取决于你的需求。Bodhi Linux 附带的\
    \ Enlightenment 文件管理器 (EFM) 轻量、美观且足够易用，但缺乏功能。许多 Bodhi Linux 用户更喜欢使用功能更强大的东西，如\
    \ PeManFM 或 SpaceFM。后者功能非常强大但相当令人望而生畏，且对初学者来说太复杂，但 PeManFM 是个不错的选择。\n\n我个人的最爱是\
    \ Nautilus，它结合了良好的功能和易用性，如果你在 Bodhi 软件仓库中安装 Dropbox，你需要系统中安装 Nautilus（稍后会有更多相关内容）。Nautilus\
    \ 的轻微缺点在于它是为 Gnome 桌面设计的，这意味着它需要配置才能在 Enlightenment 上正常运行。\n\n为了充分利用 Nautilus\
    \ 的功能，你还需要安装 Gnome Terminal - 无论如何，这都是个不错的选择，因为它比 Terminology 功能更多。（Terminology\
    \ 是 Bodhi Linux 附带的终端 - 你在 2.1 节执行初步的清理任务时使用过它。）\n\n如果在使用了 Nautilus 和 Gnome Terminal\
    \ 后，你决定它们不适合你，那么你可以轻松卸载它们并切换到替代方案。如果你正在旧且缓慢的计算机上安装 Bodhi Linux，你可能会决定坚持使用轻量级的\
    \ Enlightenment 文件管理器和 Terminology，但在这种情况下，你应该意识到，Nautilus 提供并在下文描述的一些功能对你将不可用。\n\
    \n**注：** 本章其余部分致力于 Nautilus 和 Terminal。你不需要通读这里描述的所有功能，我已标记了那些可选的部分，你可以稍后再回来查看。这对于本章的最后一部分（2.7）尤其如此，它仅面向高级用户，其他所有人可以完全省略。\n\
    \n你不能从 AppCenter 下载 Nautilus 和 Gnome Terminal，相反，你必须使用 Synaptic 软件包管理器，它使你能够访问整个包含约\
    \ 35,000 个软件包的软件仓库。\n\n1.  前往 **主菜单 > 应用程序 > 首选项** 并运行 **Synaptic 软件包管理器**。\n\
    2.  当 Synaptic 打开时，你会看到顶部有一个工具栏，带有一个“快速筛选”框，其右侧有一个“搜索”图标。你可以使用其中任何一个来搜索软件包：“快速筛选”最容易且快；“搜索”将找到其附带说明中包含你的搜索词的所有软件包。你通常可以使用快速筛选。\n\
    3.  在 **快速筛选** 框中输入 *nautilus*，会显示一个列表，顶部有“nautilus”。点击它左侧的框，然后点击“**标记为安装**”。\n\
    4.  下一个对话框会告诉你，将有一些依赖项随其安装（这些包括 Brasero，这是一个有用的 CD/DVD 刻录程序 - 你会在\n\n"
