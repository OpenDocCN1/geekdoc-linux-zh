  - '[PAGE 7]


    # 1.4 Installing Bodhi Linux


    The first step is to create a CD with the Bodhi Linux system on it. For this you
    will need a blank recordable CD and a computer able to write to it. Assuming you
    have these, work through the following steps:


    +   1) Go to the Bodhi Linux website (http://www.bodhilinux.com) where you will
    see two download links at the right, one for 32 bit and the other for 64 bit computers.
    I suggest you choose 32 bit, which will work on all computers. (Even if your computer
    is a modern 64-bit machine, there is little to gain from choosing the 64-bit option.)


    +   2) The next screen presents you with two further download options, one for
    PAE computers and the second for non-PAE. Again, non-PAE will work on all machines.
    However, in this case it’s worth installing the PAE version if your computer will
    take it, and the chances are it will. All post-2004 computers support PAE, as
    will the majority of post-1995 machines. So click on the top (pae) download button,
    and after a few seconds your download will start. It will be a .iso file, meaning
    that it is an optical disk image. The Bodhi ISO image is small enough to fit on
    a CD rather than a DVD.


    +   3) You will have noticed that below the Bodhi download button is one labelled
    ‘sum’. This leads to a further download that will enable you to check that there
    are no errors in your downloaded ISO image. I’ve never had any errors in such
    images, but if you want to check, there are some free Windows utilities you can
    use with md5sum downloads – search the Web for ‘md5sum on Windows’.


    +   4) Now burn your ISO file to a CD. In Windows 7, if you double-click on your
    ISO, the Windows Disk Image Burner program should open, and you can burn your
    image with this. Otherwise you can use one of the free CD burning programs that
    are available for Windows (and indeed for Linux). I use CDBurnerXP, which runs
    on Windows XP as well as Vista and 7, and is available at https://cdburnerxp.se/.
    When you run CDBurnerXP, one of its options is to burn an ISO image. Simply insert
    a blank recordable CD in the drive, choose this option, browse to the Bodhi ISO
    file that you’ve saved, and click the Burn disc button. After a few minutes your
    CD will be ready.


    +   5) Now comes the moment of truth. Boot up the computer on which you wish to
    install Bodhi, and immediately hold down the F12 key until the boot menu opens.
    Insert your CD into the optical drive, and select the option on the menu to boot
    from this. (If F12 doesn’t take you to the boot menu, check your computer’s manual
    for the method to use. Note that a list of the keys you can use at startup should
    appear on the screen as soon as the computer fires up.)


    +   6) After a second or two the disc start-up menu will appear. Choose the top
    option to run the live system. The Bodhi splash screen will appear for several
    seconds, and then the screen will grow dark, and nothing will seem to be happening
    for perhaps a minute, other than the sound of the CD drive working. And then,
    it all’s well, a menu of profile choices will appear. Breathe a sigh of relief!


    +   7) If after a couple of minutes nothing happens, and the disc has stopped
    working, it means'
  - '[PAGE 8]


    that all is not well. If your computer is old, the chances are that it is a non-PAE
    machine, in which case you will have to download the non-PAE version of Bodhi.
    If, after you''ve done this, Bodhi still won''t run, it means that Linux has encountered
    some hardware incompatibility. A common problem encountered on old laptops is
    to do with ACPI, and to overcome this you will have to turn ACPI off; when the
    disc start-up menu appears (step 6), press the Tab key to show the start-up options,
    and at the end of this list add the command acpi-off. You should also of course
    check the md5sum (step 3 above).


    8) Choose the Composite profile, click Next, and then at the next screen choose
    any theme that takes your fancy, then click Next again. The Enlightenment desktop
    will appear, with a panel at the left (called a ) with various gadgets on it,
    and on the desktop itself will be more gadgets, including a clock. Don''t worry
    about any of these for the moment.


    9) On the live system the network gadget does not run automatically (it does on
    the installed system), and to connect to the Internet you will have to start it
    manually. To do so, open the main menu (by clicking anywhere on the desktop or
    by clicking the topmost icon on the shelf) and choose ''Run Everything'' 1. At
    its dialog box type the first few letters of network. The blue network applet
    will appear in the dialog box and will be highlighted, and you can now Enter to
    run it. A network icon will appear on the shelf. If you have a wired network (i.e.
    if your computer is linked by cable to your router), a connection will be established
    immediately; if you are connecting wirelessly, you should click on the icon, select
    your router, and enter its password.


    Further reading. For more information on connecting to the Internet, go to the
    relevant part of Bodhi''s Help system. Click anywhere on the desktop to open the
    Main menu, choose Bodhi Linux then Quick Start, then click on the first item,
    ''Connecting to the Internet''.


    10) IF YOU WISH, YOU CAN TRY OUT BODHI AT THIS POINT TO MAKE SURE YOU ARE HAPPY
    WITH IT BEFORE YOU INSTALL IT ON YOUR HARD DISK. TO RUN, THE WEB BROWSER THAT
    HAS BEEN INCLUDED ON THE CD (MIDORI), CLICK THE SECOND ICON DOWN FROM THE TOP
    OF THE SHELF.


    11) WHEN YOU ARE READY TO INSTALL BODHI LINUX ON YOUR COMPUTER, DOUBLE-CLICK THE
    INSTALL BODHI ICON. AFTER SOME SECONDS THE LANGUAGE SELECTION DIALOG BOX OPENS
    - CHOOSE THE APPROPRIATE OPTION AND CLICK CONTINUE. PRESS CONTINUE AT THE NEXT
    SCREEN (WHICH IS A HARDWARE CHECK - DON''T WORRY IF THE INTERNET CONNECTION IS
    CROSSED OUT), THEN AT THE NEXT DIALOG BOX CLICK YES TO UNMOUNT PARTITIONS. NEXT,
    YOU HAVE TO DECIDE WHETHER YOU WANT TO KEEP YOUR EXISTING OPERATING SYSTEM ALONGSIDE
    BODHI ON YOUR SYSTEM. IF YOU DON''T, CLICK THE BOX TO REPLACE MICROSOFT WINDOWS
    THEN CLICK CONTINUE. AT THE NEXT SCREEN CLICK YOUR LOCATION ON THE MAP, AND AFTER
    THAT ACCEPT THE APPROPRIATE KEYBOARD LAYOUT (YOU CAN PROBABLY GO WITH THE DEFAULT
    OFFERING). NEXT, YOU MUST ENTER YOUR NAME, THEN THE USERNAME YOU WANT TO GIVE
    YOUR COMPUTER (LEAVE IT AT Bodhi132 IF YOU WISH) AND A PASSWORD. CHOOSE ''LOG
    IN AUTOMATICALLY'' (UNLESS YOUR COMPUTER IS TO BE USED IN A WORKPLACE SETTING),
    THEN CLICK CONTINUE. FINALLY, WHEN THE COMPUTER HAS FINISHED INSTALLING THE SYSTEM
    (IT TAKES QUITE A WHILE), YOU CAN CLICK RESTART.


    12) After it reboots, at the Profile dialog box, choose the Composite profile
    again, then at the'
  - '[PAGE 9]


    Theme dialog box choose ''Bodhi-Theme'', if that theme is listed, otherwise choose
    another. (The selection of themes available on the installation disc varies from
    one release of Bodhi Linux to another. I will be basing the description in the
    first part of this guide on Bodhi-Theme, and if it is not available on your installation
    disc, don''t worry : you will be installing it shortly). That completes the first
    part of your work - you have installed Bodhi Linux successfully.


    Notice that the network icon has automatically appeared on the shelf. If you have
    a wired connection to your router, this will have been activated. If you are connecting
    wirelessly you should click the network icon to select your router and enter its
    password.'
  - '[PAGE 10]


    # 2.1 Preliminary housekeeping tasks


    There are a few rather tedious tasks to perform before you get to the fun bit
    of making everything look and behave the way you want it and installing the software
    applications you will want to use. First off, you need to update your system.
    You must be connected to the Internet for this to work.


    +   1) Left-click anywhere on the desktop to open the Main menu, then choose Applications,
    then System Tools, then Terminology. A terminal window opens, into which you can
    type Linux commands.


    > Note: In future I will write such a sequence like this as `menu > Applications
    > System Tools > Terminology`. If the desktop is not visible because you have
    a maximized window open, you can instead open the Main menu by clicking the top
    icon on the panel, or alternatively by pressing the Menu key on the keyboard (this
    key is usually on the bottom row, near the spacebar). Each menu in a sequence
    like this opens to the right of the previous one, sometimes disappearing off the
    right of the screen. If this happens, simply move the mouse pointer to the right
    edge of the screen and the menus will shift to the left


    +   2) The first thing you should do is synchronize the package index stored on
    your system with the online software repository. Type `sudo apt-get update` into
    the terminal, press Enter, then when asked enter your password. The updating will
    now take place.


    +   3) Next you must upgrade your system with the latest versions of the software
    that''s stored on it. Enter `sudo apt-get dist-upgrade`, and when asked say `y`
    to continue, press `y`.


    +   4) Type in your password whenever you want to make an administrative change
    to your system or to install software as a bit of a pain, so your next job is
    to disable this requirement. (But DON''T do this in a workplace setting or if
    people you don''t entirely trust are going to use your computer. Without this
    requirement they can wreck your system!)


    A) IN THE TERMINAL, ENTER `GEDIT /LEAFPAD / ETC /SUDOERS`. AFTER ENTERING YOUR
    PASSWORD, THE SUDOERS FILE (WHICH IS IN THE ETC DIRECTORY) WILL APPEAR IN LEAFPAD
    (A TEXT EDITOR).


    B) SCROLL DOWN TO THE BOTTOM OF THIS FILE AND TYPE IN THE FOLLOWING TWO LINES:


    ```

    # Turn off requirement for password


    bodhi32 ALL=(ALL) NOPASSWD: ALL

    ```


    THE FIRST LINE IS A COMMENT (COMMENTS START WITH A #), AND IS NOT ESSENTIAL. THE
    SECOND LINE MUST BE COPIED IN EXACTLY, WITH WHATEVER YOU ENTERED AS YOUR USERNAME
    REPLACING ''BODHI32''. (YOUR USERNAME APPEARS AT THE TOP OF THE TERMINAL WINDOW,
    BEFORE THE (_) SYMBOL.) NOTE THE SPACES IN THIS COMMAND - THERE''S A SPACE AFTER
    THE USERNAME; A SPACE BETWEEN (ALL) AND NOPASSWD; AND A SPACE BEFORE THE FINAL
    ALL.'
