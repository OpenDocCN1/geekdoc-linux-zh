    \ should you change your mind later.)\n4) Click Close when you’ve finished, and\
    \ check out your changes.\n\n## SEARCHING FOR FOLDERS AND FILES [OPTIONAL]\n\n\
    Nautilus has a handy Search facility, accessed via the Search icon at the right\
