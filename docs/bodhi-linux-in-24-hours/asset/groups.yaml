    the second (green and white) theme down on the left (called `bodhi_e17_bodhi`).
    At the next installation screen, choose Install Now. The installation will take
    about a couple of minutes, so be patient! When it''s finished, you should apply
    this theme (Main menu > Settings > Theme).


    +   4) Another change you will probably want to make is to set the font used in
    the menu system to make it easier for older eyes to read. (These notes were written
    for retired people in the U3A!)

    +   Click on the desktop to open the Main menu, then choose Settings > All > Look
    > Fonts. Then, at the Font Settings dialog box:

    +       a) Click Advanced.

    +       b) Click Menu item in the Font Class column, then Enable Font Class at
    the foot of this column.

    +       c) Choose Nimbus Sans in the Font column, then Bold in the Style column,
    then scroll down to 12 pixels in the Size column and click that.

    +       d) Click Apply, then click anywhere on the desktop to see how your menu
    looks.

    +       If you are happy with its appearance, fine, otherwise try something different.
    Leave the dialog box open for the next exercise.


    +   5) Now to change the font used in the title bar of windows. To see how the
    font used in title bars looks at the moment, open Leafpad (Main menu > Applications
    > Accessories > Leafpad, and observe what''s displayed (Untitled) in the top orange
    area. To change this font, back at the Font Settings dialog box click Title bar
    in the Font Classes column, then click Enable Font Class, then Ubuntu in the Font
    column, Bold in the Style column, and 12 pixels in the Size column. Click Apply,
    and observe how the font used in the Leafpad title bar changes. Close Leafpad
    and the Font Settings dialog box if you''re happy with these changes, otherwise
    try a different font.


    +   6) A further tweak you might like to make at this point is to turn off the
    bouncy effect that is part of the Composite profile (you may have observed this
    effect when opening or closing dialog boxes above). Open the Main menu and choose
    Settings > All > Look > Composite, then at the Composite Settings dialog box,
    in the Default style section, scroll down and highlight the final option labelled
    "". Click on OK. (Of course, you may like the bouncy effect, or you might want
    to try other effects, in which case you can ignore this step. Don''t let your
    personal preferences cramp your style!)


    You''ll have realised by now that there is a mind-bogglingly huge number of settings
    that you can apply to your Enlightenment desktop and its various components, and
    we''ll explore more of these later. For now, we''ll complete this initial foray
    into the possibilities by altering by changing the desktop wallpaper. As with
    Microsoft Windows, you can choose for your wallpaper almost any picture, including
    one of your own photos, but let''s stick with what the Bodhi website has to offer.


