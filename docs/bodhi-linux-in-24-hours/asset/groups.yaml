    python-gpgme 安装完成后，再次运行 Dropbox，此时应该没有警告。

    -   3) 点击对话框中的“确定”。完整的 Dropbox 软件包将被安装，您将进入 Dropbox 设置对话框，在那里您可以打开一个 Dropbox 账户。请注意，您被允许使用
