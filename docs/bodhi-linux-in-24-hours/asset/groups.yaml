    \ AS SUPERUSER WILL BE VIA THE MENU SYSTEM, AND TO SET THIS UP YOU MUST CREATE\
    \ A PERSONAL APPLICATION LAUNCHER FOR IT.\n\n1) GO TO MAIN MENU > SETTINGS > ALL\
    \ > APPS > PERSONAL APPLICATION LAUNCHERS.\n2) AT THE PERSONAL APPLICATION LAUNCHER\
    \ DIALOG BOX CLICK ADD.\n3) AT THE NEXT DIALOG BOX TYPE Nautilus as Root IN THE\
    \ NAME FIELD\n4) TYPE gksudo \"nautilus %U --no-desktop\" IN THE APPLICATION FIELD\
    \ (NOTE THE QUOTE MARKS - THEY ARE ESSENTIAL.)\n5) CLICK THE GENERAL TAB AND IN\
    \ THE CATEGORIES FIELD TYPE Utility... THIS TELLS ENLIGHTENMENT\n\nwhere to locate\
    \ this launcher's entry in the menu system.\n\n5) Click **Apply**, then **Close**.\n\
    \nNow go to **Main Menu > Applications > Accessories**, where you will see that\
    \ '**Nautilus as Root**' has been added to the menu. Click on this entry and Nautilus\
