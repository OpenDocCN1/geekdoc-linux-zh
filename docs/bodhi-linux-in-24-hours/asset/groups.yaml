    \ this name to something more meaningful, open the Bookmarks menu again and choose\
    \ “Edit Bookmarks”, then change its name to e.g. ReMix Icons.\n\n8) To change\
    \ the icon of the Documents folder, click on Home in the sidebar to return to\
    \ your Home folder, then right-click the Documents folder icon and choose ‘Properties’\
    \ from the context menu. Then click its icon in the Properties dialog box, and\
    \ you are taken to the Select Custom Icon dialog box. Click on ‘ReMix Icons’ (or\
    \ whatever name you gave your new bookmark) in the sidebar, and you will be taken\
    \ to the list of ReMix icons.\n\n9) Move down through this list by pressing the\
    \ down-arrow key; each icon will be displayed in turn at the right. When you find\
    \ one you like (try GEDIT.png, for instance), click Open, then close the Properties\
    \ dialog box.\n\n10) Your other folders can be assigned icons in a similar way.\n\
    \n## Setting Nautilus’s Views and Preferences [Optional]\n\nYou will sometimes\
