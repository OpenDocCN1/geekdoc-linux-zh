  - '[PAGE 17]


    Main menu > Applications > Sound & Video after the installation is finished.)
    Click Mark.


    +   5) Click on the ''nautilus-open-terminal'' box, and then Mark for installation.
    This utility will integrate Nautilus with Terminal.


    +   6) Now type terminal in the Quick Filter box. A list of terminals appears.
    (If for any reason this list doesn''t appear, use the Search icon in the toolbar.)
    Click the box to the left of ''gnome-terminal'' then click Mark for installation,
    then Mark.


    +   7) Click Apply (on the toolbar), then, at the Summary dialog box, click Apply
    again.


    +   8) After Nautilus, Nautilus-open-terminal, Gnome-terminal, and all their dependencies
    have been downloaded and installed (a job that will take a minute or two), click
    the ''Automatically close'' option in the Changes Applied box, then close Synaptic.


    Nautilus will appear in the (Accessories menu (Main > Applications > Accessories)
    under the name Files, and Gnome Terminal will appear there too. (Restart Enlightenment
    if for any reason they are not there: Main menu > Enlightenment > Restart.)


    Run Nautilus now (from the Accessories menu), and something ghastly happens: it
    opens in its own (blue) desktop, which you are unable to close!


    Update: I understand that ins problem is to be fixed shortly. If your version
    of Nautilus does not invoke the blue screen, you can ignore the instructions below
    and proceed to Section 2.6.


    THE SOLUTION IS TO KILL IT:


    +   1) PRESS WIN + SPACE (I.E. HOLD DOWN THE WINDOWS KEY, USUALLY TOWARDS THE
    BOTTOM LEFT OF THE KEYBOARD, AND TAP THE SPACEBAR). IF YOU HAVE AN OLD COMPUTER
    WHICH DOESN''T HAVE A WIN KEY, PRESS ALT + ESCAPE INSTEAD. THE RUN EVERYTHING
    DIALOG BOX OPENS.


    +   2) TYPE KILLALL NAUTILUS INTO THIS DIALOG BOX AND PRESS ENTER. NAUTILUS AND
    THE OFFENDING BLUE BACKGROUND WILL DISAPPEAR.


    The problem is that Nautilus has been configured to run on a different desktop,
    and we need to edit its launcher. We''ll do that in the next section.


    Note: You can use the killall command in this way to close any application that
    is misbehaving and refusing to close. However, you should normally type killall
    -9 followed by the application name. The ''-9'' ensures that all processes (and
    there may be more than one) involved in running the application are killed.


    # 2.5 APPLICATION LAUNCHERS


    These are central to the Enlightenment window management system. They control,
    amongst other things, which menu (if any) lists an application, and how it runs,
    and they can also be used to control whether or not an application appears as
    an icon on the desktop. Application launchers are also known as desktop configuration
    files, and they have the extension ''.desktop''. Thus the Nautilus'
  - '[PAGE 18]


    LAUNCHER HAS THE FILENAME ''NAUTILUS.DESKTOP''. We are going to edit it now, not
    directly but by a nifty tool that Enlightenment provides.


    +   1) RUN NAUTILUS AGAIN (MAIN MENU > APPLICATIONS > ACCESSORIES > FILES), AND
    DON''T WORRY ABOUT THE BLUE WINDOW THAT IS DISPLAYED BEHIND IT. (Don''t worry
    either about the long-winded way you have to navigate through the menu system
    to launch Nautilus. Soon we''ll be turbocharging your desktop, and then tasks
    like this will be accomplished with just a single click!)


    +   2) RIGHT-CLICK ON THE TITLE BAR SO THAT THE CONTEXT MENU OPENS, AND THEN MOVE
    THE MOUSE POINTER OVER THE TOP OPTION (''Nautilus'') AND CHOOSE ''Edit Icon''.


    +   3) AT THE DESKTOP ENTRY EDITOR THAT OPENS, IN THE BASIC TAB, CHANGE THE NAME
    TO NAUTILUS, THEN CHANGE THE ENTRY IN THE APPLICATION BOX TO READ: nautilus %U
    -no-desktop (that''s a space and two dashes in front of ''no'' and one dash between
    ''no'' and ''desktop'').


    +   4) Click OK, then close Nautilus and kill the blue desktop behind it (by pressing
    Win + space to Run Everything, then entering killall nautilus).


    +   5) Now run Nautilus again, and all should be well.


    YOU WILL LEARN MORE ABOUT APPLICATION LAUNCHERS IN THE NEXT SECTION.


    # ## 2.6 Using Nautilus and Gnome Terminal


    In this section you will gain some familiarity with Nautilus and the Linux file
    system. You will create the folders you are going to need in your Home Directory.
    You will also be using Gnome Terminal, and we begin by customizing its appearance.


    # ### Customizing Terminal


    +   1) Open Gnome Terminal (MAIN MENU > APPLICATIONS > ACCESSORIES > TERMINAL).


    +   2) The colour scheme that greets you can be improved, and to do this you should
    open the Edit menu and choose ''Profile Preferences''.


    +   3) AT THE DIALOG BOX, CLICK THE COLOURS TAB.


    +   4) IN THE COLOURS DIALOG BOX, UNTICK THE ''USE COLOURS FROM SYSTEM THEME''
    BOX. THEN AT ''BUILT-IN SCHEMES'' BOX CHOOSE ''WHITE ON BLACK''.


    +   5) Click Close, and you will be returned to the Terminal window, which should
    now be much easier on the eye. If you are happy with the change, close the Terminal.
    Otherwise return to ''Profile Preferences'' and make some more tweaks.'
  - "[PAGE 19]\n\n# ## Using Nautilus\n\nNow run Nautilus in the usual way (i.e.,\
    \ from the menu system). It will open in your home directory, with a single folder\
    \ (called Desktop) displayed, and also the Wallpaper file that you downloaded\
    \ earlier. The Home directory is where you store all your personal files.\n\n\
    +   1.  Start by maximizing Nautilus, then open the Desktop folder (by double-clicking\
    \ it). You will see that it’s empty. However, if we copy any desktop launchers\
    \ into this folder, then they will show up as icons on the Desktop. Let’s copy\
    \ our Nautilus Desktop file here now.\n\n+   2.  Press the F3 key to open another\
    \ pane in Nautilus, then click on File System in the sidebar (at the left). Now\
    \ navigate to /usr/share/Applications (i.e., double-click the usr folder, then\
    \ at the next screen double-click the share folder, then double-click the Applications\
    \ folder. Icons showing the files in this folder will appear. These files are\
    \ all Applications launchers, and you could if you wished launch an application\
    \ from here, by double-clicking its icon. You could also edit the launcher from\
    \ this screen.\n\n+   3.  You will probably need to return to this directory in\
    \ the future, so the changes that you will remember the route to it are pretty\
    \ slim, so let’s bookmark it: open the Bookmarks menu and click Add Bookmark.\
    \ The Applications directory is added to the top of the sidebar, where it can\
    \ be accessed with a single click.\n\n+   4.  Let’s examine our Nautilus launcher.\
    \ Right-click on an empty space between the icons and choose ‘Open in Terminal’\
    \ from the context menu. (Alternatively you can choose this option from the File\
    \ menu.) Terminal opens in the /usr/share/Applications directory.\n\n+   5.  Maximize\
    \ Terminal, then enter the command `ls`. A listing of the files in this directory\
    \ appears, with ‘Nautilus.Desktop’ among them.\n\n+   6) To edit this file:\n\
    +   \n+       A) Drag over its filename with the mouse so that it is highlighted,\
    \ then right-click anywhere within the Terminal window and choose Copy from the\
    \ context menu.\n+       B) Type in the command `gksuudo leafpad` followed by\
    \ a space, then right-click again within the Terminal window and choose Paste.\
    \ The filename will be added to the end of the command.\n+       C) Press Enter,\
    \ and the contents of the Desktop file will appear in Leafpad.\n\n+   7) You can\
    \ see in Leafad the changes you made in the last section: a few lines down there\
    \ is the command ‘Exec=nautilus %U --no-desktop’. The lower entries in this file\
    \ are not relevant to Enlightenment and can be ignored, though you might like\
    \ to comment them out. To do so, simply insert a # at the start of each line so\
    \ that they read:"
  - "[PAGE 20]\n\n```\n# [DESKTOP ACTION WINDOW] \n# Name=\"Open a New Window \n#\
    \ Exec=NAUTILUS \n# OnlyShown=Unity;\n```\n\n8) Open the file menu and choose\
    \ save, then close leafpad. You are returned to the terminal window, which you\
    \ can close.\n\n9) You should still have your Desktop folder open in the other\
    \ pane in Nautilus (see steps 1 and 2 above), so let's copy our Nautilus desktop\
    \ file into it:\n\nA) In the Applications pane, scroll down to the Nautilus icon\
    \ and right-click on it.\n\nB) At the context menu, choose “Copy” to “then” Other\
    \ pane.” The file will appear in the other pane, i.e. in your Desktop folder.\n\
    \nC) Minimize Nautilus, and you will see that its icon is now present on your\
    \ desktop. Now you can run Nautilus simply by double-clicking it.\n\n# Creating\
    \ your home directory folders\n\nNow create the folders you'll need to organize\
    \ all the data files that you will gradually accumulate in your Home directory.\
    \ You will certainly need one for downloads and another for documents, and you\
    \ will probably need ones for photos and other media files. Let's create the first\
    \ two of these folders now.\n\n1) Restore the Nautilus window (by clicking its\
    \ minimize icon on the shelf), then click on Home in the sidebar so that one of\
    \ its panes is showing the contents of your Home directory.\n\n2) Right-click\
    \ on an empty part of this pane and choose \"Create New Folder\" from the context\
    \ menu. Enter Documents as its name.\n\n3) Repeat this step, this time entering\
    \ Downloads as the name.\n\n4) Go to the other pane and click on Home to open\
    \ the Home directory, and double-click your new Downloads folder to open it.\n\
    \n5) You now have the Downloads folder open in one pane and the Wallpaper file\
    \ that you downloaded earlier visible in the other. Right-click on the Wallpaper\
    \ file, and choose “Move to” from the context menu. “Then” Other pane.” The file\
    \ is moved to Downloads, which is where it rightly belongs.\n\n6) Close the pane\
    \ showing the Downloads folder by clicking on it and pressing F3, then create\
    \ in your Home directory the other folders you are likely to need. These might\
    \ be “Movies,” “Pictures,” “Audio,” as well as others. The choice is yours.\n\n\
    Note: The remaining steps in this section (7 to 10) are optional and can be ignored."
