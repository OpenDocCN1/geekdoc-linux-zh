    \   - 自动隐藏 = 'Auto-hide the Shelf'（自动隐藏搁架）\n\n5) 点击“应用”，然后关闭，接着关闭“搁架设置”对话框。你的新搁架的上边缘应该在屏幕的左下角可见，你可以通过将鼠标指针向下移动至该处来显示它。\n\
    \n注意：如果你在上述第 5 步中添加了电池小部件，它可能也被添加到了你的第一个（顶部）搁架上。如果是这样，只需右键点击它，在上下文菜单中悬停在“Battery”（电池）上，然后点击“Remove”（移除）即可。\n\
    \n6) 现在打开一两个应用程序（例如，终端 Terminal 和 Nautilus）。它们的图标会出现在你的新“POPUP”搁架上（将鼠标移动到搁架上以确认这一点）。将它们最小化，它们就会停靠在原地。就像在\
    \ Windows 系统中一样，你可以点击此搁架上的停靠图标来恢复应用程序的窗口。\n\n这就完成了本章关于搁架和 iBar 需要涵盖的内容。在第 5 章中，你将一两个\
    \ iBar 放置在桌面上，并且你将探索使用不同的搁架和 iBar 以及其中装载的不同应用程序和小部件来创建虚拟桌面的可能性。\n\n如果你想在你的搁架上添加更多小部件，请随意这样做，先浏览一下模块列表（主菜单\
    \ > 设置 > 模块），看看是否有任何你想要使用但尚未加载的模块。加载它们后，它们将在“搁架内容”对话框中可用。\n\n## 3.5 “Places”小部件\n\
    \n我发现这个小部件很有用，但我将其放置在桌面上，而不是搁架上。\n\n1) 转到“主菜单” > “设置” > “模块”。此时会打开“模块设置”对话框。点击“文件”选项卡，高亮显示“PLACES”（位置），然后点击“加载”并接着点击“关闭”。\n\
    \n2) 现在转到“主菜单” > “设置” > “小部件”，在“桌面小部件”对话框中高亮显示“背景”（BACKGROUND），然后点击“配置图层”（CONFIGURE\
    \ LAYER）。\n\n3) 向下滚动至“Places”（位置）并将其高亮显示。点击“添加小部件”，然后关闭，再关闭一次。\n\n4) “Places”小部件应该已经出现在桌面上的一个可移动框中。将此框拖动到合适的位置。然后将下边框拉下一英寸或两英寸，以留出足够的空间来容纳你可能插入的存储设备（如\
    \ USB 闪存盘）的详细信息。\n\n5) 在你完成移动和大小调整后，右键点击“Places”框，可移动框将消失。再次右键点击小部件，将鼠标悬停在“Places”下的“外观”（Appearance）上，然后点击“Plain”（朴素）。小部件周围的边框将消失。\n\
    \n6) 如果你在第 3 章中没有安装 Nautilus，而是选择使用 Enlightenment 文件管理器（EFM），则可以忽略此步骤和下一步。右键点击文件系统，将鼠标悬停在“Places”上，然后点击“设置”。此时会打开“Places\
    \ 设置”对话框。\n\n7) 在这里，你应该点击“使用自定义文件管理器”，并在框中输入 Nautilus--no desktop（即“no”前面有两个短横线）。点击“应用”然后关闭。\n\
    \n8) 测试你的新桌面小部件：点击主页图标（小部件的右上角），Nautilus 将在你的主目录下运行；关闭它，然后点击硬盘图标，Nautilus 将在根目录（Root\
    \ directory）下运行；关闭 Nautilus。\n\n9) 如果你将 USB 存储棒插入计算机，其图标将显示在此小部件上，并附有其容量详情；如果你点击其图标，Nautilus\
    \ 将在该驱动器的根目录中打开。\n\n## 3.6 运行一切 (Run Everything)\n\n你可以看到，iBars 提供了一种通过单击即可启动应用程序的绝佳方式，但那些带有对话框的设置工具（你一直在使用的那些）该怎么办？它们必须从菜单系统内部深处启动。即使使用“设置”小部件来访问这些对话框也需要大量的导航。解决方案是使用“运行一切”（Run\
    \ Everything）模块。\n\n你可以通过点击第一个 iStrip 中的“运行一切”图标来启动它（如果你已将其叶子设置为白色背景）。你也可以通过按下\
    \ Alt + Esc（即按住 Alt 键并按下 Esc 键）、Win + Space（即按住 Windows 键并按下空格键），或从主菜单中选择它来直接运行。\n\
    \n1) 现在点击“运行一切”图标。其对话框打开，底部列出了标签页，分别标记为“所有”（All）、“应用程序”（Applications）、“窗口”（Windows）、“执行”（Execute），以及另外两个（“设置”和“插件”），你只有滑动过去才能看到它们。依次点击每个标签页，你会看到“运行一切”如何组织计算机上的程序。\n\
    \n2) 如果你知道某个程序的名称，运行它的最简单方法不是通过这些标签页，而是直接在此对话框中输入该程序名称的前几个字母。例如，要运行终端（Terminal），你可以输入\
    \ TERMINAL 的前两个或三个字母，然后按下回车键。\n\n你将在本章剩余部分的练习中使用“运行一切”。请注意，在这些练习中，我将仅指示你“运行一切”，这意味着你应该点击搁架上的“运行一切”图标，或者按下\
    \ Alt - Esc，或者按下 Win - Space，或者从主菜单中选择它。\n\n延伸阅读：前往**Booh Guide to Enlightenment**（主菜单\
    \ -> Booh Linux -> 快速入门，将鼠标悬停在“Enlightenment”上并选择“Booh Guide”），阅读“Everything Module”（所有模块）部分。为准备接下来的练习，你还应阅读“Bindings”（绑定）部分。\n\
    \n## 3.7 边缘绑定\n\n边缘绑定指定了当你在屏幕边缘的不同部分点击鼠标时触发的操作。设置方法如下：\n\n1) 运行“一切”（Run Everything），输入*edge\
    \ bindings*（边缘绑定）的前三个字母。“边缘绑定”图标会被高亮显示。按下回车键，“边缘绑定设置”对话框将打开。\n\n2) 点击**添加**（Add），你将进入“边缘绑定序列”对话框。你将从为屏幕右上角创建绑定开始，因此点击此角落处的棕色框。\n\
    \n3) 点击*clickable edge*（可点击边缘），然后点击**应用**（Apply）。\n\n4) 现在你需要将此绑定分配给一个操作。在右侧的操作窗格中，向下滚动至“Window\
    \ : Actions”（窗口 : 操作）部分（位于巨大列表的约三分之二处），并高亮显示“Close”（关闭）。\n\n5) 点击**应用**（Apply）。现在，每当你在屏幕的右上角点击时，当前聚焦的窗口将关闭。这等同于点击标题栏右上角的“x”按钮。（那些微小的标题栏按钮很难点击，将鼠标快速移动到屏幕右上角要容易得多）。\n\
    \n6) 再次点击**添加**（Add），现在，在“边缘绑定序列”对话框中，点击屏幕图片的顶部边缘。“可点击边缘”选项应该已被自动选中，因此点击**应用**（Apply）。\n\
    \n7) 在右侧窗格中向下滚动至“Window : State”（窗口 : 状态）部分，高亮显示“Maximize”（最大化），然后点击**应用**（Apply）。现在，每当你在屏幕的顶部边缘点击时，当前聚焦的窗口将最大化。这等同于点击标题栏右侧的“+”按钮，但操作更简单。请注意，若要取消最大化窗口，只需再次点击屏幕的顶部边缘即可。\n\
    \n8) 再次点击**添加**（Add），在“边缘绑定序列”框中点击底部边缘，然后应用（APPLY）。\n\n9) **高亮** *‘Iconic Mode\
    \ Toggle’*（图标模式切换）（位于 ‘Window : State’ 部分），然后点击应用。现在，无论你在屏幕底部边缘点击什么，当前聚焦的窗口将被最小化。这等同于点击标题栏上的‘↓’按钮。\n\
    \n10) 现在你应该创建绑定来执行当前无法通过鼠标点击完成的其他操作。我建议如下：\n\n- A) 左上边缘 - ‘**Fullscreen** Mode\
    \ Toggle’（全屏模式切换）（位于 ‘Window : State’ 部分）。点击此处将切换到全屏。再次点击将恢复。\n\n- B) 左边缘 - ‘**Maximize**\
    \ Left’（最大化左侧）（位于 ‘Window : State’ 部分）。\n\n- C) 右边缘 - ‘**Maximize** Right’（最大化右侧）（位于\
    \ ‘Window : State’）。当你想要并排打开两个窗口时，此绑定和上一条都极其实用。\n\n- D) 右下边缘 - ‘**Show The Desktop**’（显示桌面）（位于\
    \ ‘Desktop’ 部分，在右侧窗格的顶部）。这将最小化所有打开的窗口并显示桌面。\n\n- E) 这样就只剩下左下角没有绑定了。我稍后会对这里提出建议。\n\
    \n11) 现在打开一个应用程序，并使用其窗口测试这些绑定。请注意，对于大多数这些绑定，第二次点击会将窗口恢复其先前状态。\n\n**注意：** 你不需要最小化应用程序来将其从视野中隐藏。相反，你可以双击其标题栏将其窗口卷起至标题栏下方。再次双击标题栏将展开它。试一试。\n\
    \n## 3.8 按键绑定\n\n让我们现在创建一些按键绑定。步骤与上一节描述的类似。\n\n1) 运行*一切*（Everything），并在**运行一切**（Run\
    \ Everything）对话框中输入*key bindings*（按键绑定）的前几个字母。“按键绑定”图标将会被高亮显示；按下**Enter**（回车键），**按键绑定**设置对话框将打开。\n\
    \n2) 如果你在左侧（很长的）列表中的任何项上点击，其绑定的操作将在右侧的“操作”窗格中高亮显示。例如，如果你点击“Menu”（代表菜单键），“Show\
    \ Main Menu”（显示主菜单）将在右侧高亮显示。花几分钟时间探索已有的许多按键组合的绑定是值得的。例如，Win + Left（即 Windows 键加上左箭头键）将**最大化左侧**（Maximize\
    \ Left），而 Win + Right 将最大化右侧。\n\n**注意：** 在设置你自己的按键绑定时，你应该避免被应用程序使用的按键组合。例如，Ctrl\
    \ + s 通常用于保存，而 Ctrl + c 和 Ctrl + a 用于复制和粘贴。Win（Windows 键）组合在其他地方未被使用，因此是很好的选择。\n\
    \n3) 让我们现在设置一个按键绑定。点击**添加**（Add），系统将提示你按下按键组合。\n\n"
