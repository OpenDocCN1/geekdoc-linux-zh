    \ 6.5 Unetbootin\n  - 6.6 从 USB 驱动器运行 Bodhi Linux\n  - 6.7 Bodhi Linux 的未来版本\n\
    \  - 6.8 结语\n- 本次 Bodhi Linux 安装快速入门指南\n\n# 1 引言\n\n## 1.1 关于本指南\n\n本指南介绍了如何在您的计算机上安装\
    \ Bodhi Linux 操作系统，如何自定义它，以及如何安装您希望使用的软件应用程序（网络浏览器、邮件客户端、办公应用程序、照片软件、媒体播放器等）。这是一份实用的逐步指南，而非对\
    \ Bodhi 系统的学术性描述，但在相关节点会提供指向网络上解释性材料的链接。\n\n它源于为英国“第三龄大学”（U3A）计算机小组准备的笔记，该小组中的一些成员在微软决定停止支持\
    \ Windows XP 后，希望从 Windows 迁移到 Linux。不过，我希望它也能对更广泛的受众有用，包括那些初次接触 Bodhi 的现有 Linux\
    \ 用户。\n\nBodhi Linux 高度可自定义，并可以通过多种方式进行微调。然而，像这样一份逐步指南必然是规定性的，因此遵循它最终会让您得到一个非常特定的桌面配置文件。请不要担心这一点。重点在于，一旦学会了如何创建和保存该配置文件，您就有能力设置您自己的配置文件，无论是通过摆弄已经生成的内容，还是从头开始。如果您搞砸了，您可以轻松地恢复已保存的配置文件。至于您在阅读本指南过程中将要安装的各种应用程序，它们也可以轻松地被移除并替换为其他替代品。\n\
    \n我应该强调，这不是官方的 Bodhi Linux 出版物，我与 Bodhi Linux 开发人员没有任何联系。就像 Bodhi 本身（实际上大多数 Linux\
    \ 产品也是如此），它是免费提供的。但是，如果您发现它有帮助，更重要的是，如果您喜欢 Bodhi 并继续使用它，我鼓励您向 Bodhi Linux 捐款以支持其进一步开发。捐款链接位于\
    \ Bodhi Linux 主页 www.bodhilinux.com 上。\n\n## 1.2 什么是 Bodhi Linux？\n\nBodhi（读音同\
    \ Jodie）是一种被称为 Linux 发行版或“distro”的东西，意味着它是 Linux 的一个变体，打包了窗口管理器或桌面。所有 Linux 变体都构建在相同的\
    \ Linux“内核”基础上，因此它们共享一个共同的核心。可能最流行的变体是 Ubuntu，Bodhi Linux 就是由此衍生的。Linux 有多种不同的桌面（即带有额外功能的窗口管理器），标准\
    \ Ubuntu 发行版打包的那个叫做 Unity。然而，Bodhi Linux 使用的是 Enlightenment 窗口管理器，简称 E17（17 是其当前版本号）。\n\
    \nEnlightenment 可以与其他发行版一起使用，它已成为许多 Linux 用户（显然包括我）的坚实首选，因为它敏捷、优雅且非常可自定义。\n\n\
    然而，只有 Bodhi Linux 将 Enlightenment 置于其设计哲学的核心。Enlightenment 的缺点是它非常可自定义，以至于用户面临相当陡峭的学习曲线，但\
    \ Bodhi 的帮助系统——“Tibodhi Enlightenment 指南”——提供了出色的指导。希望这份逐步指南能帮助您掌握它。\n\n虽然 Bodhi\
    \ 基于 Ubuntu 且非常接近 Ubuntu，但它不是 Ubuntu。特别是，它没有相同的软件存储库。同样，它的存储库基于 Ubuntu 存储库，但它保持更新状态，这意味着\
    \ Bodhi 开发人员试图提供您想要安装的各种软件应用程序的最新版本。\n\nBodhi Linux 目前处于版本 2，最新发布的版本是 2.4。\n\n\
    **延伸阅读：** 如果您想更多地了解 Bodhi 及其 Enlightenment 窗口管理器，请前往 Bodhi 指南的简介部分。您可以在 Bodhi\
    \ 网站（www.bodhilinux.com）上找到它——在主页上，将鼠标指针移到“文档”上，选择“Enlightenment 指南”，然后选择“简介”。\n\
    \n## 1.3 开始之前需要了解有关 Bodhi Linux 的哪些知识\n\n幸运的是，您不需要了解太多关于 Linux 本身的知识就可以使用 Bodhi\
    \ 及其 Enlightenment 桌面，而您需要知道的知识可以在过程中逐步掌握。然而，有 Enlightenment 使用的两个概念我需要现在就向您介绍。这些是“E17\
    \ 主题”和“配置文件”。我在此提及它们，是因为您在计算机上安装 Bodhi 时会遇到它们。\n\n- **E17 主题：** 这些控制桌面的外观，包括背景、字体以及各种小部件，如时钟。要查看一些可用主题的示例，请前往\
    \ Bodhi 网站（http://www.bodhilinux.com/），将鼠标悬停在“资源”上，选择“艺术维基”（Art Wiki），然后选择“Enlightenment”。\n\
    \n- **配置文件：** 这些控制桌面的所有内容，包括您选择的主题、其元素的定位、加载的模块以及您可能设置的按键绑定和鼠标绑定。配置文件非常强大，因为它们存储了您的所有自定义设置，这意味着您可以尝试不同的配置文件，使用不同的主题和自定义设置，并确信您随时都可以返回到原始保存的配置文件。Bodhi\
    \ 附带多个标准配置文件供选择，以适应您的特定硬件和偏好。\n\n- **GTK 主题：** 也称为“主题”，这些不是 Enlightenment 的一部分，但我在此提及以免您稍后将它们与\
    \ E17 主题混淆。GTK 主题控制正在运行的应用程序内窗口的外观，即它们的颜色方案以及滚动条等常见元素的外观。要查看示例，请前往 Bodhi 网站上的艺术维基并选择\
    \ GTK 主题。\n\n**注：** 我不会用 GTK 等术语的解释来 clutter 这份指南。如果您想知道它们的含义，请搜索网络，如有必要，在搜索短语中包含“linux”或“ubuntu”。\n\
    \n"
