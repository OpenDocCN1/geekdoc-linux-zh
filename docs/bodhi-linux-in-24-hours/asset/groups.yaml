    \ Sharing Center of the Control Panel. You should also right-click on the Public\
    \ 'Documents' folder and select Properties, then the Sharing tab, and check the\
    \ entries here.)\n\n## SAFELY REMOVING USB MEMORY STICKS\n\nLINUX WILL READ YOUR\
