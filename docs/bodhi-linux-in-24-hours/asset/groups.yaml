    \ be meeting later. Enter:\n+   `sudo apt-get install python-gpgme`\n+   \n+ \
    \  The installer will check whether you have Gpgme on your system, and if not\
    \ it will install it. (When it asks for confirmation, press Y.) When the installation\
    \ is finished, close the terminal.\n\n+   6) You may like to check that the NOPASSWD\
    \ change you made at step 4 above has worked by rebooting your computer. To do\
    \ this, click the power switch symbol at the bottom of the shelf and choose Reboot.\
    \ Hopefully your computer will restart without any nasty messages appearing. However,\
    \ if you didn't correctly enter the command to turn off the password requirement,\
    \ it will give some kind of warning, and you should edit the sudoers file in the\
    \ manner described in (4) above and correct your mistake.\n+   \n+   Note: In\
    \ Linux it is possible to work almost entirely from the 'command line', i.e. by\
    \ entering commands in a terminal as you did above, including installing software\
    \ using the 'apt-get install' command. Whenever possible we will avoid the command\
    \ line by using graphical alternatives, i.e. we use interfaces invoking windows\
    \ and dialog boxes. But if you want to know more about the commands used above,\
    \ search for the Web for them. (E.g. search for 'linux sudo' and 'linux apt-get.')\
    \ If you want to know more about linux commands generally and the use of the command\
    \ line, go to http://linuxcommand.org/man_pages/php.\n\n# 2.2 Some initial tweaks\n\
    \nNow you are going to make a few changes to the look and feel of your system.\
    \ There will be many more changes to make later on.\n\n+   1) First, if you are\
    \ a Brit, set your system to British English. Click anywhere on the desktop to\
    \ open the Main menu, then choose Settings > All > Language > Language Settings.\
    \ (Remember: if the final menu in this long sequence has disappeared off the right\
    \ of the screen, simply move the mouse pointer to the edge of the screen to bring\
    \ it into view.) At the Language Settings dialog box that opens, highlight 'British\
    \ English' and click Apply, and then Close.\n\n+   2) Next, you will probably\
    \ want to make its windows behave like those of Microsoft Windows. Go to Main\
    \ menu > Settings > All > Windows > Windows Focus. In the Focus Settings dialog\
    \ box choose the top option ('Click Window to Focus'), then click OK.\n\n+   3)\
    \ If Bodhi-Theme was not available when you selected the theme at the end of the\
    \ last chapter, install it now. Go to the Bodhi Linux website (www.bodhinux.com),\
    \ highlight 'Resources' and choose 'Art Wiki', then, under 'Themes', click on\
    \ 'Enlightenment', and choose"
