    \ start your search at the root directory. If, you should click 'File System'\
    \ in the sidebar before you click 'Search'.\n\nTRY THIS NOW, BY SEARCHING FOR\
    \ ALL .DESKTOP FILES IN YOUR FILE SYSTEM.\n\n1) Run Nautilus, and click 'File\
    \ System' in the sidebar.\n2) Click 'Search', and enter DESKTOP in the Search\
    \ field. After a while all the desktop files will appear, listed with their locations.\n\
    \nNotice that when the search begins, a toolbar opens below the Search field.\
