    drag on one of its vertical borders to widen it. (You will refine these adjustments
    shortly.)

    - Right-click on the iBar, then mouse over ''iBar'' and choose ''Settings''.

    - In the iBar Settings dialog box click Add, then enter a suitable name for the
    source. You might call it media. Click OK.

    - Highlight the name of your new source in the Source list, and click Setup. The
    iBar Applications dialog box will appear. (If this dialog box is rather small
    and cramped, remember the key binding you set up in Chapter 3 to rectify this:
    press Win + m to maximize it vertically.)

    - Remove the application icons that are currently populating this iBar (by clicking
    in turn the orange buttons and ‘Remove’), and add the media applications you have
    installed: Audacious, Audio Recorder, and VLC. You might wish to add the Brasero
    disc burning program here too.

    - Click the Order tab, and put these in the order you want, then click OK, and
    OK again. The icons for the packages you selected will appear in your new iBar.

    - Right-click on one of these icons, mouse over ‘iBar’, then choose ‘Begin move/resize’.
    You can now drag on a vertical border to make it fit snugly around the icons,
    and you can move it to the exact position you want on the desktop. When you’ve
    finished right-click again.

    - Your new iBar has a border round it. To remove this, right-click on it again,
    mouse over ‘iBar’, mouse over ‘Appearance’, then choose ‘Plain’.


    You can if you wish set up further iBars on your desktop by repeating this process.


    It’s possible that the gadgets on your shelf have become rearranged as a result
    of making changes like this. Remember that you can re-order them by right-clicking
    on them and choosing ‘Begin moving gadgets’. Right-click again when you’re finished
    and choose ‘Stop moving gadgets’.


    Note: if later on you want to modify the contents of this second iBar, right-click
    one of its icons then mouse over ‘Settings (cst Contents)’ and highlight this
    iBar’s name (media) in the list. Then choose ‘Setup.’ (Choosing ‘Settings’ instead
    of ‘Settings’ will modify the default iBar on the shelf instead.)


    ### 5.3 The Favorites menu


    Now let’s set up the Favorites menu. This will allow you to access favourite applications
    by right-clicking anywhere on the desktop.


    1. Click the Settings icon (top shelf), then maximize the Settings window that
    appears (by clicking the top of the screen – remember your mouse bindings!).

    2. Click Apps, then click ‘Favourite Applications’. The Favourite Applications
    dialog box opens. You may want to use your Win + m key-binding to maximize this
    box vertically.

    3. You should add Synaptic, together any other applications that you want immediately
    to hand, apart from those that can be run from the shelf iBar.

    4. Click the Order tab and set this, then click OK.

    5. Leave the Settings window open in readiness for the next section, but test
    your new menu by right-clicking on the exposed desktop area below the shelf.


    ### 5.4 Applications name display


    The application names that appear in the menu system are rather long, as they
    not only give the name but also, beside it in brackets, the application type.
    For example: Synaptic Package

