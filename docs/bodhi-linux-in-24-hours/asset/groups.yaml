  mdcn: "\n\n## 6.2 更新你的系统\n\n你应该每个月左右更新一次系统，以保持其中的所有内容都是最新的。借助你在上面设置的别名，这非常容易：\n\n\
    - 1) 打开终端，并输入 `update`。你系统上的数据库将与存储库同步。\n- 2) 输入 `upgrade`。你系统上任何过时的文件都将升级到最新版本。\n\
    - 3) 完成后，清除系统中积累的一些垃圾文件可能也是很有价值的。输入 `purge`，然后在提示符处按 'y'。\n\n## 6.3 清理你的系统\n\n\
    每隔几个月，你应该彻底清理一次你的系统。可以使用一个名为 Bleachbit 的应用程序来完成。Bleachbit 不在你的系统中，但你可以通过 Synaptic\
    \ 安装它。请现在这样做。\n\n安装完成后，你的菜单系统的“系统工具”部分将添加两个条目：\n\n- “Bleachbit”，用于清理用户文件。\n- “Bleachbit\
    \ as root”（以 root 身份运行 Bleachbit），用于清理系统文件。\n\n- 1) 现在运行 Bleachbit（主菜单 > 应用程序\
    \ > 系统工具，或使用 Run Everything）。它的窗口打开，左侧列出了各种需要清理的文件类别。选择它们，但排除以下各项：\n    - 深度扫描选项（这些速度较慢）；\n\
    \    - 密码（在 Firefox 部分中）；\n    - 系统部分中的释放磁盘空间、本地化和内存（前两者速度较慢，且内存是实验性功能）。\n- 2)\
    \ 点击预览，会出现一个（很长的）将被删除的文件列表。\n- 3) 点击清理，片刻后任务即完成。\n\n“Bleachbit as root” 的使用方式相同。\n\
    \n## 6.4 使用 Remastersys 进行备份\n\n当然，你应该将重要的文档和照片备份到外部存储设备或 Dropbox 上。Nautilus 具有双窗格和“复制到另一窗格”功能，这使得操作变得容易。\n\
    \n然而，备份你的整个系统是另一回事，而做到这一点的一种方法是使用一个名为 Remastersys 的程序。这允许你创建你系统的映像（ISO 文件），包括你所有的自定义设置以及（如果你愿意）你的文档、照片和其他数据文件，然后你可以将其安装到光盘（可刻录\
    \ DVD）或 USB 内存棒（U 盘）上。使用此 DVD 或 USB 棒，你可以在任何计算机上运行，并在必要时安装你的系统。\n\nRemastersys\
    \ 已经存在于你的系统中，可以从终端运行，但如果你为它设置一个个人应用程序启动器，未来的操作会更简单。\n\n- 1) 运行 Run Everything\
    \ 并输入 *personal* 的前四个字母。个人应用程序启动器对话框将打开。\n- 2) 点击添加以添加个人启动器；然后在桌面条目编辑器中，在名称字段中输入\
    \ **Remastersys**，在 *应用程序* 字段中输入 *remastersys-gtk*。\n- 3) 如果你想为启动器设置图标，点击图标选项卡，然后点击图标框并导航到：/usr/share/icons/MaXo-ReMix/apps，然后在列表中滚动寻找合适的图标。点击确定。\n\
    - 4) 在常规选项卡中，在通用名称字段中输入 REMASTERSYS，在类别中在 SYSTEM。\n- 5) 在选项选项卡中，确保选中了“在菜单中显示”。其他两个选项不应选中。\n\
    - 6) 点击应用；然后关闭。Remastersys 将出现在系统菜单中，位于系统工具下方（如果没有，请重启 Enlightenment）。\n\n在使用\
    \ REMASTERSYS 备份你的系统之前，你应该首先运行 BLEACHBIT 和 BLEACHBIT AS ROOT 以删除不必要的文件。你应该包括“释放磁盘空间”选项，以使映像尽可能紧凑。（这将花费很长时间来执行，因为它涉及在硬盘上移动文件。）\n\
    \n使用 REMASTERSYS 创建系统映像的说明如下：\n\n- 1) 关闭所有打开的应用程序，运行 Remastersys，并在其对话框中选择设置选项卡。在这里，你可以输入你希望从映像中排除的任何文件或目录。例如，如果你想排除你的电影和图片文件夹，你会输入\
    \ `/home/bobhj32/Movies:/home/bobhj32/Pictures`（将 **bobhj32** 替换为你的用户名）。\n- 2)\
    \ 点击操作选项卡，关闭所有打开的窗口（除了 Remastersys 窗口），然后点击备份。Remastersys 将开始工作，创建你系统的 ISO 映像，这个过程大约需要一个小时。\n\
    \nISO 文件将位于 `/home/remastersys/remastersys` 目录中。要查看它，运行 Nautilus，点击工具栏左侧的框（在“主目录”左侧的框，框上标有一个小的左指向箭头），点击\
    \ ‘home’（不是 ‘Home’），然后导航到 remastersys > remastersys。（换句话说，ISO 位于 /home/remastersys/remastersys\
    \ 文件夹中。）\n\n如果你排除了可能已添加到系统上的个人数据文件，如照片、音乐或其他文档，此文件的大小可能约为 1 GB（吉字节）。（这包括你添加到系统上的所有应用程序。）这将导致安装大小明显超过\
    \ 2 GB。\n\n你现在可以使用 Brasero（你可以在菜单系统的“声音与视频”部分找到它）将此映像安装到可刻录 DVD 上。或者，你可以将其安装到\
    \ USB 内存棒上——这可能是你的最佳选择，因为 USB 棒可以容纳比 DVD 大得多的映像，并且你可以更改或添加其中存储的文件。（不过请注意，较旧的计算机可能无法从\
    \ USB 棒启动——请参阅下面第 6.6 节。）\n\n## 6.5 UNETBOOTIN\n\n要将 ISO 映像安装到 USB 棒上，你需要一个名为\
    \ Unetbootin 的应用程序。它不在你的系统中，因此请运行 Synaptic 来安装它。与 Remastersys 一样，Unetbootin 将出现在菜单系统的“系统工具”部分中。\n\
    \n- 1) 在运行之前，你应该将 USB 棒插入 USB 端口，并挂载它。（要挂载它，只需点击 Places 小部件中的图标，使 Nautilus 打开它，然后关闭\
    \ Nautilus。或者，以正常方式打开 Nautilus，并点击其左窗格中的 USB 棒。）\n- 2) 运行 Unetbootin，并在其对话框中选择\
    \ DiskImage 选项（在左下角）。然后浏览到你上一节保存的 ISO——浏览按钮在右侧。当浏览对话框打开时，点击顶部的向上箭头，双击列表中的 ‘home’，然后是\
    \ ‘remastersys’，再次是 ‘remastersys’。\n- 3) 如果你认为你之后想向即将创建的 USB 系统添加文件，那么你必须为此分配空间。该数量受你\
    \ USB 棒容量的限制。对于 4 GB 的 USB 棒，你最好限制在约 1500 MB 左右。\n- 4) 点击确定，你系统的映像将被安装到你的 USB\
    \ 棒上。这个过程将花费几分钟。\n\n## 6.6 从 USB 驱动器运行 Bodhi Linux\n\n你可以将在 USB 棒上安装的系统副本在任何能够从\
    \ USB 驱动器启动的计算机上运行。要在你的计算机上尝试这样做：\n\n- 1) 关机。\n- 2) 确保 USB 棒已插入 USB 端口。\n- 3)\
    \ 开机，并在计算机启动时按住 F12 键。应该会出现一个启动菜单。（假设你的计算机使用 F12 来执行此操作——在计算机启动时，屏幕上应出现可用于启动的按键列表。）\n\
    - 4) 其中一个选项应该是从 USB 驱动器启动。如果没有该选项，则无法从该驱动器启动。在这种情况下，你必须使用 Brasero 将 ISO 映像写入 **DVD**\
    \ 并从该 DVD 启动。\n    - *提示：* 你可以通过在 USB 端口插入 *任何* USB 棒并执行上述步骤，在创建可安装 USB 棒之前检查你的计算机是否有此选项。\n\
    - 5) 如果存在 USB 选项，请选择‘从 Live System 启动’。你的计算机将运行你的 Bodhi 系统，几分钟后你的桌面将出现。\n- 6)\
    \ 架子上的一些图标可能缺失。这似乎总是在你第一次使用 USB 安装时发生。解决方法是*重启 Enlightenment*（主菜单 > Enlightenment\
    \ > 重启），这将修复问题。\n- 7) 当从 USB 驱动器或光盘运行 Bodhi 时，它不会自动连接到 Internet。要连接，运行 Run Everything\
    \ 并输入 *network* 的前几个字母。按 Enter，*network* 小部件将运行。点击其图标（底部架子），从列表中选择你的网络，并输入密码。\n\
    - 8) 现在你可以像从硬盘*运行*系统一样完全相同地使用该系统，包括能够向其保存文件（假设你在之前的练习中为此分配了空间）。\n- 9) 你还可以轻松访问计算机硬盘上的文件，使用桌面上的\
    \ Places 小部件（假设你在之前的练习中将该小部件放在了那里）。你会注意到此小部件上出现多个驱动器，包括硬盘。点击硬盘图标以在 Nautilus 中显示其内容。\n\
    - 10) 如果你愿意，你可以使用此 USB 棒将你的 Bodhi 系统安装到计算机的硬盘上。如果你的计算机硬盘已损坏，或者你想将你的 Bodhi 系统安装到另一台计算机上，你可能希望这样做。为此，运行\
    \ Run Everything 并输入 *Install RELEASE* 的前几个字母。如果你的 USB 棒上存在 Install RELEASE 小部件，其图标将出现在对话框中，你可以按\
    \ Enter 运行它。如果你喜欢，可以现在尝试——通过选择第一个对话框中的 *Quit* 来中止安装过程。\n    - *注意：* 如果 *Install\
    \ RELEASE* 不在你的 USB 棒上，你可以从 `http://packages.bodhinux.com/bodhi/tools/testing/ubuntuquirky`\
    \ 下载它。选择名为 `ubuntuquirky-frontend-gtk_3.12.17-1386.deb` 的下载。由于这是一个 `.deb` 文件，你必须使用第\
    \ 4.8 节中描述的 *eDeb* 实用工具来安装它。\n- 11) 要关机，请按 *Win - End*，就像平常一样——你之前设置的所有快捷方式都可以使用。\n\
    \n"
