    bar. Mouse over'
  - '[PAGE 13]


    Resources (centre top of the page) and choose Art Wiki.


    b) At the next screen choose Wallpapers, and then browse through what''s on offer
    and pick one that matches your theme (Bodhi-Theme). This is a green theme with
    orange highlights, and I suggest the first (green) offering in the Animated Wallpapers
    section. Otherwise go to the Official section and choose a green theme from there.


    c) Click on your choice, and you will be taken to a larger image of the wallpaper.
    Right-click on it and choose the ‘Save Image As’ option, then, choose ‘Save’ at
    the next dialog box, enter a filename of your choice, and click Save.


    d) Now you must set this image as your wallpaper. Minimize Midori, then click
    on the desktop for the Main menu and choose Settings > Wallpaper. At the Wallpaper
    Settings dialog box, click ‘Picture...’ (towards the top). You should see the
    image that you’ve just saved in the list, so highlight it, click Use, then, at
    the Import Settings dialog box, make sure that ‘Fill’ is highlighted and click
    OK. You are returned to the Wallpaper Settings dialog box, where you can click
    OK. Your chosen wallpaper should now be decorating the desktop.


    8) At this point you may want to alter the appearance of the clock. Right-click
    on it, mouse over ‘Clock’ and choose ‘Settings’. then at the Clock Settings dialog
    box choose Analog, deselect Seconds, and then OK. An analogue clock appears on
    the desktop. You can resize this (by right-clicking on it again) and choosing
    ‘Begin move/resize’. Or you may prefer to keep the clock digital, as I do, but
    resized and located at a different spot on the desktop.


    # 2.3 Installing some applications: Firefox and Flash


    Part of Bodhi’s design philosophy is to package on the installation CD a minimal
    system that will run on any hardware, however old and underpowered, and to leave
    it to the user to beef it up with whatever additional software he requires. Thus
    Midori is a very lightweight web browser that will run well on any hardware, and
    the Enlightement file manager (EFM) is also very lightweight and fast. It is likely,
    however, that you will want more substantial and capable products, as well as
    your choice of office software, media players, photo and graphics software, and
    some additional utilities. You will be adding all these in due course, but for
    now let’s restrict things to an alternative web browser, an alternative file manager,
    and an alternative terminal.


    To compensate for the paucity of software on the installation CD, the Bodhi website
    provides an excellent ‘AppCenter’ with a comprehensive range of good software
    that can be readily downloaded. To view this, open Midori again (or if you have
    minimized it you should click on its minimized icon which you will see a little
    way down from the top of the shelf). Return to the Bodhi home page (www.bodhilinux.com),
    mouse over Resources again, and this time choose AppCenter from the list.


    It’s worth spending some time perusing what’s on offer at the AppCenter, but for
    now we’ll concentrate on web browsers and the Flash plugin. Flash enables you
    to play videos in your browser, including those from YouTube and so on, for people
    living in the UK, BBC iPlayer. Probably the most popular of the browsers on offer
    is Firefox, and it’s the one I generally use.'
