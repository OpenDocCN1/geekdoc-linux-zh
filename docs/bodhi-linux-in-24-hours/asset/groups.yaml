    # 6.2 Updating your system


    You should update your system every month or so, to keep everything on it up to
    date. With the aliases you set up above in place, this is very easy:


    +   1) Open Terminal, and enter update. The database on your system will synchronized
    with the repository.


    +   2) Enter upgrade. Any out-of-date files on your system will be upgraded to
    the latest versions.


    +   3) When this finished, it might be worth getting rid of any accumulated junk
    on your system. Then remove, then press ''y'' at the prompt.


    # 6.3 Cleaning your system


    Once every few months you should carry out a thorough clean of your system. This
    can be done using an application called Bleachbit. Bleachbit is not on your system,
    but you can install it from Synaptic. Do so now.


    When the installation is finished, two entries will have been added to the System
    Tools section of your menu system:


    +   - ''Bleachbit'', which cleans user files.

    +   - ''Bleachbit as root'', which cleans system files.


    +   1) Run Bleachbit now (Main menu > Applications > System Tools, or use Run
    Everything). Its window opens, with various categories of file to clean listed
    at the left. Select them all except the following:


    +   - The Deep scan options (these are slow);

    +   - Passwords (in the Firefox section);

    +   - Free disk space, Localizations, and Memory in the System section (the first
    two are slow, and Memory is experimental).


    +   2) Click Preview, and a (long) list of files to be deleted appears.


    +   3) Click Clean, and in moments the job is done.


    ''Bleachbit as root'' is used in the same way.


    # 6.4 Backing up with Remastersys


    You should of course keep backups of important documents and photos on an external
    storage device or on Dropbox. Nautilus, with its twin panes and ''Copy to other
    pane'' facility, makes this easy.


    Backing up your entire system is another matter. however, and one way to do this
    is to use a'
  - '[PAGE 54]


    program called . This allows you to create an image (ISO file) of your system,
    including all your customizations and, if you wish, your documents, photos, and
    other data files, which you can then install on an optical disc (a recordable
    DVD) or on a USB memory stick (pen drive). With this DVD or USB stick you can
    run, and if necessary install, your system on any computer.


    Remastersys is on your system, and it can be run from Terminal, but it will make
    life easier in the future if you set up a personal application launcher for it.


    +   1) Run Eversthang and enter the first four letters of *personal*. The Personal
    Application Launcher dialog box opens.

    +   2) Click Add to add a personal launcher; then at the Desktop Entry Editor
    type **Remastersys** in the Name field, and in the *Application* field *remastersys-gtk*.

    +   3) If you want to set up an icon for your launcher, click on the Icon tab,
    then click on the icon box and navigate to: /usr/share/icons/MaXo-ReMix/apps,
    then scroll through the list for a suitable icon. Click OK.


    +   4) At the General tab, type REMASTERSYS IN THE GENERIC NAME'' field, and SYSTEM
    IN CATEGORIES.

    +   5) At the Options tab, make sure that ''Show in Menus'' is selected. The other
    two options should not be selected.

    +   6) Click Apply; Then Close. Remastersys will appear in the menu System, under
    System Tools (if it doesn''t, restart Enlightenment).


    BEFORE BACKING UP YOUR SYSTEM WITH REMASTERSYS, YOU SHOULD FIRST RUN BLEACHBIT
    AND BLEACHBIT AS ROOT TO REMOVE UNNECESSARY FILES. YOU SHOULD INCLUDE THE ''FREE
    DISK SPACE'' OPTION TO MAKE THE IMAGE AS COMPACT AS POSSIBLE. (THIS WILL TAKE
    A LONG TIME TO EXECUTE, AS IT INVOLVES SHUFFLING FILES AROUND ON THE HARD DISK.)


    THE INSTRUCTIONS FOR USING REMASTERSYS TO CREATE AN IMAGE OF YOUR SYSTEM ARE AS
    FOLLOWS:


    +   1) Close all open applications, run Remastersys, and at its dialog box choose
    the Settings tab. Here you can enter any files or directories you wish to exclude
    from your image. For example, if you wish to exclude your Movies and your Pictures
    folders, you would enter /home/bobhj32/Movies:/home/bobhj32/Pictures (replacing
    **bobhj32** by your username).

    +   2) Click the Actions tab, close all open windows (apart from the Remastersys
    window) and click Backup. Remastersys will then set to work creating the ISO image
    of your system, a process that will take about an hour.


    The ISO file will be located in the /home/remastersysy directory. To see it, run
    Nautilus, click the box at the left of the toolbar (to the left of ''Home'' -
    the box is marked with a small left-'
  - '[PAGE 55]


    pointing arrow), click ‘home’ (not ‘Home’), then navigate to remastersys > remastersys.
    (In other words, the ISO is in the /home/remastersys/remastersys folder.)


    This size of this file, if you have excluded any personal data files that you
    might have added to your system such as photos, music, or other documents, is
    probably around 1 GB (gigabyte). (That includes all the applications you’ve added
    to your system.) This will result in an installed size of rather more than 2 GB.


    You can now install this image on a recordable DVD using (which you will find
    in the Sound & Video section of the menu system). Alternatively you can install
    it on a USB memory stick – which may be your best option, as a USB stick can hold
    a much bigger images than a DVD, and you can change or add to the files stored
    on it. (Note, though, that an older computer may not be able to boot from a USB
    stick – see Section 6.6 below.)


    # 6.5 UNETBOOTIN


    To install your ISO image on a USB stick you need to an application called . This
    is not on your system, so run Synaptic to install it. Like Remastersys, Unetbootin
    will appear in the System Tools section of the menu system.


    +   1) Before running it, you should insert the USB stick in a USB port, and you
    should mount it. (To mount it, simply click on its icon in the Places gadget so
    that Nautilus opens it, then close Nautilus. Alternatively, open your Nautilus
    in the normal way and click on the USB stick in its left pane.)

    +   2) Run Unetbootin, and at its dialog box select the DiskImage option (at the
    bottom left). Then browse to the ISO you saved in the last section - the browse
    button is to the right. When the Browse dialog box opens, click the up-arrow at
    the top, double-click ‘home’ in the list, then ‘remastersys’, then ‘remastersys’
    again.

    +   3) If you think you’ll want to add files later to the USB system that you
    are about to create, then you must allocate space for this. The amount is limited
    by the capacity of your USB stick. For a 4 GB USB stick, you will have to limit
    yourself to around 1500 MB.

    +   4) Click OK, and an image of your system will be installed on your USB stick.
    This process will take several minutes.


    # 6.6 Running Bodhi Linux from a USB drive


    The copy of your system that you’ve installed on the USB stick can be run on any
    computer that will boot from a USB drive. To try this on your computer:


    +   1) Switch off.

    +   2) Make sure the USB stick is inserted in a USB port.

    +   3) Switch on, and while the computer starts up hold down the F12 key. A boot
    up menu'
  - '[PAGE 56]


    should appear. (This assumes your computer uses F12 to do this - a list of keys
    you can use at startup should appear on the screen when the computer fires up.)


    4) One of the options should be to boot up from the USB drive. If that option
    is not there, then you can''t boot up from the drive. In that case you have to
    write your ISO image to a **DVD** (using Brasero) and boot from that.


    *Hint:* You can check whether your computer has this option prior to creating
    an installable USB stick by carrying out the above steps with *any* USB stick
    inserted in the USB port.


    5) If the USB option is present, select ‘Boot from the Live System’. Your computer
    will run your Bodhi system and after a few moments your desktop will appear.


    6) Some of the icons are probably missing from the shelf. This always seems to
    happen the first time you use a USB installation. The solution is to *Restart
    Enlightenment* (Main menu > Enlightenment > Restart), which will fix the problem.


    7) When running Bodhi from a USB drive or optical disc, it does not automatically
    connect to the Internet. To connect, Run Everything and type the first letters
    of *network*. Press Enter, and the *network* applet will run. Click on its icon
    (bottom shelf), choose your network from the list, and enter the password.


    8) You are now able to use the system in exactly the same way as if you were *running*
    it from the hard disk, including being able to save files to it (assuming you
    allocated space for this in the previous exercise).


    9) You can also easily access the files on the computer''s hard disk, using the
    Places gadget on the desktop (assuming you put that there in an earlier exercise).
    You will notice that several drives appear on this gadget, including the hard
    disk. Click on the hard disk icon to reveal its contents in Nautilus.


    10) You can if you wish use this USB stick to install your Bodhi system on the
    computer''s hard drive. You might want to do this if the hard drive on your computer
    has become corrupted, or if you want to install your Bodhi system on another computer.
    To do this, Run Everything and type in the first few letters of *Install RELEASE*.
    If the Install RELEASE applet is present on your USB stick, its icon will appear
    in the dialog box and you can press Enter to run it. You can try this now if you
    like - abort the install process by selecting *Quit* at the first dialog box.


    *Note:* If *Install RELEASE* is not present on your USB stick, you can download
    it from `http://packages.bodhinux.com/bodhi/tools/testing/ubuntuquirky`. Choose
    the download called `ubuntuquirky-frontend-gtk_3.12.17-1386.deb`. As this is a
    `.deb` file, you must install it using the *eDeb* utility, as described in Section
    4.8.


    11) To power down, press *Win - End* in the usual way - all the shortcuts you
    set up earlier are available.'
  md: "\n## 6.2 Updating your system\n\nYou should update your system every month\
