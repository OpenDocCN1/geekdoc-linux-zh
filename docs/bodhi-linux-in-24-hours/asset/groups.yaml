  mdcn: "\n## 6.7 Bodhi Linux 的未来版本\n\n与 Windows 类似，诸如 Ubuntu 和 Bodhi Linux 等发行版每隔几年就会发布一个新版本。下一个主要的\
    \ Ubuntu 版本计划在 2014 年 4 月发布，而新的 Bodhi 版本（3.0 版）将在其发布后的一到两个月内推出。\n\n您将无法将现有的 Bodhi\
    \ 安装升级到版本 3，而是需要进行全新安装——也就是说，您需要下载新的光盘映像，将其安装到计算机上，并重复本指南中执行的所有步骤。好消息是，这件事并不紧迫：Bodhi\
    \ 版本 2 将在之后继续获得支持几年。\n\n当您确实决定切换时，显然必须先备份所有重要的数据文件，因为计算机上的硬盘将被重新格式化。此外，正如上文所述，将您的整个系统备份到外部硬盘或（大容量）U\
    \ 盘上也是个好主意，以防您需要出于任何原因再次运行它。\n\n在那之后，Bodhi 发行版的小型修订版大约每年发布三次，但当您执行 `sudo apt-get\
    \ dist-upgrade` 时，这些修订版将自动整合到您的安装中。\n\n## 6.8 结语\n\n我们已经到达本指南的结尾。您应该已经意识到，Bodhi\
    \ 和 Enlightenment 桌面环境还有比这里涵盖的更多内容，而至于 Linux 本身，我才刚刚触及皮毛。了解有关 Linux 更多信息的最佳方式可能是搜索网络，在您的搜索短语中包含“ubuntu”，有时也包括“linux”。那里有很多可用的指南。至于\
    \ Bodhi 和 Enlightenment，您的主要帮助来源将是 Bodhi 网站，尤其是论坛和文档 Wiki。\n\n我已经在几位熟人的计算机上复制了本书中描述的经过定制的\
    \ Bodhi，包括其所有调整和应用。如果您成为 Bodhi 的用户，您也可以这样做（使用上一节中创建的 U 盘或 DVD）。如果是这样，您可能会发现提供以下快速入门指南对他们很有用。\n\
    \n## 本 Bodhi Linux 安装版本的快速入门指南\n\n这台计算机上的所有应用程序都可以通过菜单系统访问，您可以通过将鼠标指向桌面的任何暴露区域并单击左键来打开它。\n\
    \n此安装程序包含若干快捷方式，以简化生活：\n\n- 常用的应用程序（如网络浏览器）位于左侧的架子（shelf）上。只需单击相应的图标即可运行这些应用程序。\n\
    - 其他收藏夹应用程序可以在“收藏夹”菜单中找到，该菜单通过将鼠标指向桌面的空白区域并单击右键来访问。\n- 键盘快捷键，例如 Win + End 用于关闭计算机（即按住\
    \ Windows 键并轻按 End 键）。\n- 用于操作窗口的鼠标动作：\n  - 单击屏幕右上角以关闭当前（聚焦）窗口。\n  - 单击屏幕顶边缘以最大化窗口（再次单击以撤销此操作）。\n\
    \  - 单击屏幕底边缘以最小化窗口。\n  - 单击左上角以将窗口设置为全屏（再次单击以撤销）。\n  - 单击屏幕左边缘以向左最大化窗口（再次单击以撤销）。\n\
    \  - 单击屏幕右边缘以向右最大化窗口（再次单击以撤销）。\n  - 单击屏幕右下角以显示桌面。\n\n此安装程序包含 Nautilus 文件管理器。其图标位于架子顶部。当\
    \ Nautilus 打开时，您可以按 F3 键显示第二面板；这简化了从一个位置复制或移动文件到另一个位置的任务（右键单击文件并选择例如“复制到另一面板”）。Nautilus\
    \ 还使访问连接到您的网络的其他计算机变得轻松——在其左侧面板中选择“浏览网络”。\n\n安装在此系统上的应用程序包括 Firefox 网络浏览器、Thunderbird\
    \ 邮件客户端、LibreOffice 办公套件（Microsoft Office 的 Linux 替代方案）、Osmo 个人信息管理器（日历、日记、笔记、联系人、待办事项列表）、VLC\
    \ 视频播放器、Audacious 音乐播放器、音频录音机、用于照片的 Mirage，以及 Skype 和 Dropbox。您可以通过访问 Bodhi Linux\
    \ 网站上的 AppCenter（[http://appcenter.bodhilinux.com/](http://appcenter.bodhilinux.com/)）添加其他应用程序。如果您想要的软件包没有在这里列出，请使用\
    \ Synaptic 包管理器（在收藏夹菜单中）进行搜索。\n\n终端是架子上第二个图标。使用它输入任何命令；特别是用于保持您的系统及其软件更新的命令。为了简化操作，这些命令在此系统上已简化，因此您只需：\n\
    \n1. 输入 `update` 以将您的系统文件索引与在线数据库同步（对于此命令和下一个命令有效，您必须已连接到互联网）。\n2. 然后输入 `upgrade`\
    \ 以替换任何过时的系统文件。\n\n要了解有关 Bodhi Linux 系统的更多信息，包括如何访问互联网，请单击桌面任何位置以打开菜单系统，然后突出显示“Bodhi\
    \ Linux”并选择“快速入门”。\n\n"
