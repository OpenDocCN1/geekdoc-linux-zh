    3. **由于标题栏按钮是多余的，最好将标题栏移除，这样可以让界面更简洁，并增加 Osmo 的工作区域。要做到这一点，请右键单击标题栏，将鼠标悬停在“窗口（Window）”上，再将鼠标悬停在“边框（Border）”上，然后点击“选择边框样式（Select
    Border Style）”，高亮显示“无边框（Borderless）”，点击“记住此边框（Remember This Border）”复选框，然后点击“确定（OK）”。**


    4. **现在点击屏幕左边缘以使 Osmo 左侧最大化。如果你现在退出 Osmo（通过右键单击其系统托盘图标）并重新打开它，你将看到系统已记住所有这些设置。**


    **提示：如果你希望稍后恢复标题栏和边框，可以打开 Osmo 并按下 Ctrl+ALT+W 来显示标题栏菜单。然后你可以重复上述第 (3) 步的操作，这次选择默认样式。**


    **Osmo 功能相当丰富，你应该花些时间探索其每个模块的偏好设置，以便按你的喜好进行配置。我使用 Osmo 来记录关于 Linux、Enlightenment
    以及我使用的各种应用程序的笔记。我已按主题对这些笔记进行了分类，这使得检索变得非常轻松。**


    **Osmo 的设计主要配合鼠标使用，但如果你更喜欢使用键盘，则所有功能都有相应的键盘快捷键。要查看这些快捷键，请点击工具栏右侧的“关于（About）”图标，然后选择“键盘快捷键（Key
    Shortcuts）”。**


    ## 4.6 Skype


    **如果你有一个网络摄像头并希望在使用 Skype，你必须从 AppCenter 安装它（位于“Internet”部分的“Communication”子项中）。否则你可能无法让声音正常工作。**


    **安装 Skype 后，你可以在主菜单 > 应用程序 > Internet 中找到它。运行它时，系统会询问你是否要登录（如果你有 Skype 账户）或创建新账户。完成后，Skype
    主屏幕将打开。你应该做的第一件事是检查你的网络摄像头设置：**


    - 1) 点击菜单图标（左下角的按钮），然后选择“选项 > 视频设备（Options > Video Devices）”，并检查摄像头是否已选中且正常工作。

    - 2) 选择“声音设备（Sound Devices）”，然后如果“麦克风（Microphone）”字段中未显示你的设备，请点击该字段右侧的箭头并从列表中选择你的设备。如果你使用的是
    USB 网络摄像头，请选择第一个 USB 摄像头选项。

    - 3) 现在点击“进行声音测试（MAKE A TEST SOUND）”（你可能需要增加扬声器音量），然后点击“进行通话测试（MAKE A TEST CALL）”。假设一切正常，你就可以开始使用了。


    ## 4.7 OSMOMA 音频录音机


    **这允许你录制通过电脑扬声器播放的任何内容，包括广播节目。你不会在 AppCenter 或 Synaptic 中找到此应用程序，而是必须从 PPA 安装它。**


    **PPA 是针对特定软件包的 unofficial 仓库，它们不一定可靠。因此，如果你从 PPA 安装，后果自负；话虽如此，我在本指南中提到的 PPA 上没有遇到过任何问题。**


    **OSMOMA 音频录音机在 HTTP://IT’SF OSS.COM/RECORD-STREAMING-AUDIO... 有描述。要安装它，你必须打开终端并输入以下命令：**


    ```bash

    SUDO ADD-APT-REPOSITORY PPA:OSMOMA/AUDIO-RECORDER

    SUDO APT-GET UPDATE

    SUDO APT-GET INSTALL AUDIO-RECORDER

    ```


    **（这些命令在上述网页上提供，你可能会发现直接从那里复制并粘贴到终端中最方便。）**


    **音频录音机可以录制多种文件格式，但不支持 MP3。如果你想添加 MP3 功能，你还必须安装一个名为“10-PLUGINS-UGLY”的插件（请使用 Synaptic
    完成此操作）。**


    **要测试音频录音机，运行它（你可以在“应用程序 > 声音与视频”中找到它），打开后：**


    - 1) 在格式字段中选择一个合适的格式（例如，如果你已经下载了上述 GStreamer 插件，则选择 MP3）。

    - 2) 通过电脑播放一些音频内容并按下“开始录音”按钮。录音按钮旁边应出现一条蓝色音频可视化条，表明音频正在被录制。

    - 3) 按下“停止录音”，录制的文件将保存在音频文件夹中。（该文件夹将在安装过程中创建；如果它尚未出现在你的主目录中。）

    - 4) 通过打开 Audacious（如果你在 4.2 节中安装了它）来测试录音，将新文件添加到播放列表中，然后播放它。或者，你也可以在 VLC 中播放它。


    请注意，如果你静音扬声器（使用混合器小工具中的静音选项），音频录音机将无法录制到声音。要录制而不实时收听内容，例如你稍后想在车上回放的广播节目，请将耳机插头插入电脑的耳机插座以切断扬声器声音。


    另外请注意你可以在音频录音机的计时器部分使用的命令。# 符号用于注释命令，因此请删除你希望激活的命令前的 #。如果你在此部分进行更改，必须点击“保存”按钮才能使其生效。


    另外请注意文件字段旁边的“添加”按钮。只有当你希望将新录音追加到之前录制的文件中时，才应点击此按钮。


    ## 4.8 eDeB 和 Chrome


    如果你住在英国并希望观看或收听 BBC iPlayer 上的节目，最好使用 Google Chrome 网络浏览器。不幸的是，你不能从 AppCenter
    或 Synaptic 下载此软件，而是必须将其作为 .deb 文件下载。


    处理 .deb 文件的最简单方法是使用 eDeB 包安装程序。Bodhi 2.4 版中已包含此程序（你可以在主菜单 > 应用程序 > 系统工具中找到它），但如果你运行的是早期版本的
    Bodhi，你必须先通过 Synaptic 下载它（在过滤字段中搜索 eDeB）。


    假设你的系统上已有 eDeB，你可以下载并安装 Chrome：


    - 1) 打开 Firefox 并搜索 Google Chrome。第一个结果应该是 Google Chrome 的官方网页，顶部附近有一个蓝色的“下载 Chrome”按钮。

    - 2) 点击此按钮，在下一个屏幕接受“32 位 .deb（适用于 Debian/Ubuntu）”选项。点击“接受并安装（Accept and Install）”。

    - 3) 在下一个对话框框中点击“确定（Ok）”以保存文件。将出现一条消息，显示文件已保存到你的下载目录（即你的 Downloads 文件夹）。

    - 4) 前往主菜单 > 应用程序 > 系统工具并运行 eDeB。点击“选择 .deb 文件（Select .deb file）”按钮。

    - 5) 在下一个屏幕中点击“下载（Downloads）”文件夹，然后高亮显示 google-chrome_deb 文件并点击“确定（Ok）”。

    - 6) 在下一个屏幕上，你需要等待大约 30 秒，直到 eDeB 下载软件包信息。然后点击“确定（Ok）”。

    - 7) 系统提示你在安装前运行检查，因此点击“检查（Checks）”按钮。希望这能确认你可以继续安装。

    - 8) 点击“确定”然后点击“安装（INSTALL）”。

    - 9) 输入你的密码，然后点击“确定（OK）”。安装将进行，稍后会显示一条警告消息，提示缺少依赖项。

    - 10) eDeB 的一大优点是它可以为你解决此类问题。点击“安装缺失的依赖项（INSTALL MISSING DEPENDENCIES）”，点击“抓取（GRAB）”，然后输入你的密码并点击“确定（OK）”。

    - 11) 当 eDeB 完成所有安装后，你可以点击“完成（DONE）”，然后关闭它。


    现在，如果你愿意，可以运行 Google Chrome（主菜单 > 应用程序 > Internet）。在初始欢迎屏幕上，取消勾选邀请你将 Chrome 设为默认浏览器的复选框，然后点击“开始（START）”。


    ## 4.9 Get+PLAYER


    **如果你想以 MP4 格式（电视节目）或 MP3 格式（广播节目）从 BBC iPLAYER 下载内容，以便在支持这些格式的任何设备上无限制地播放，那么
    Get+iPLAYER 是必需品。它是一个命令行程序，意味着你必须在终端中输入命令才能使用它。不要因此却步，因为命令相当简单（或者当我们稍作调整后就会很简单——但这后话）。**


    **你必须从 PPA 下载 Get+iPLAYER，为此你应该在终端中输入以下命令序列：**


    ```bash

    SUDO ADD-APT-REPOSITORY PPA:JON-HEDGERS/GET+PLAYER

    SUDO APT-GET UPDATE

    SUDO APT-GET INSTALL GET+iPLAYER

    ```


    **要使用 Get+iPLAYER 下载电视节目：**


    - 1) 使用 Nautilus 导航到你希望保存节目的文件夹，然后在文件夹窗格的空白处右键单击并选择“打开终端（OPEN TERMINAL）”。

    - 2) 在终端中，输入 GET+iPLAYER "节目名称"。你可以使用下划线或连字符连接“GET”和“iPLAYER”，并且显然你必须将“节目名称”替换为你要查找的节目名称，并且应该包含引号。例如，如果你输入
    RAILWAY，将显示所有名称中包含“RAILWAY”的节目列表。

    - 3) 每个结果都会编号。假设你想要的那个编号为 #456，你应输入 GET+iPLAYER -GET #456。（注意“GET”前面有两个短横线）。Get+iPLAYER
    将继续把第 456 号节目下载到你步骤 (1) 中打开的文件夹。根据节目的时长


