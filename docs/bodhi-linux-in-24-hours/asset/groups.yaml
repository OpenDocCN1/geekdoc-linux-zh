    the first few letters of *profile* and press *Enter*.


    2) At this dialog box click *Add*. Then enter a name for your profile - something
    like *Mycompositing* will do.


    3) Click *OK*, then *Close*. Your profile, with its theme, wallpaper, shelves,
    bindings, and other settings, is stored.


