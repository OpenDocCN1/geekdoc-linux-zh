    \ specify the file type. It is set to 'Any'; but if you click on its arrow, you\
    \ are taken to a range of common types, and if you click on 'Other Type' a huge\
    \ range of possibilities appears. You'll use this feature in your next search.\n\
    \nSearch for all pictures in your Home directory:\n\n1) Click 'Home' in the sidebar.\n\
