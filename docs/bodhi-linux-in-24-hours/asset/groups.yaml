    1) Go to the Edge Bindings dialog box (via Run Everything).


    2) Click Add. choose the bottom left corner, then Clickable Edge, then Apply.


    3) With ‘Bottom Left Edge’ highlighted in the left pane, choose ‘Flip Desktop
    Linearly...’ in the right pane.


    4) The three dots at the end of this command indicate that a further bit of information,
    an ‘action parameter’, is required - in this case a parameter stating how many
    desktops to flip. Type ‘1’ in the Action Parameters box, then click Apply.


    5) Test this binding by clicking the bottom-left corner of the screen. Each repeated
    click will switch between desktops.


    ## 5.7 Different shelves for different desktops


    To create a different shelf on the second desktop we need first to modify the
    settings of the existing shelf so that it only shows on the first desktop:


    1) Right-click on one of the icons of the top shelf, mouse over ‘Shelf’, and choose
    Settings.


    2) At the Shelf Settings dialog box, keep clicking on the right arrow until you
    reach ‘Desktop’. Click ‘Show on specified Desktops’, highlight the name of the
    first desktop, and click OK.


    3) Press Alt + F2 to check that it has disappeared from the second desktop.


    Now let’s add a shelf to this second desktop:


    - 1) Go to Main menu > Settings > Shelves, and click Add.

    - 2) Give your new shelf a meaningful name, e.g. the name you gave your second
    desktop. Click OK.

    - 3) Now, at the Shelf Contents dialog box, add some gadgets. These might include
    the Everything Starcher as well as the iBar. Click Close.

    - 4) The iBar on this shelf is filled with the icons from the default iBar. To
    change this, right-click on it, mouse over ''iBar'', and choose Settings. Now
    click Add to add another source, and give it suitable name. Click OK.

    - 5) Highlight this name in the list of sources, then click Setup. Press Win+m
    if you wish to vertically maximize the dialog box, then remove the applications
    that are on it already and add some others. Then click the Order tab to adjust
    the order, then click OK, and OK a second time to close these dialog boxes.

    - 6) Now right-click on your new shelf, mouse over its name, and choose Settings.
    Make these settings: Stacking - ''Below Windows''; Position - Right, at the top;
    Style - ''Invisible''; Desktop - ''Show on specified desk'' and the name of your
    second desktop. Click OK.


    You now have two desktops with different shelves. Note that the desktop gadgets
    (the clock, desktop iBar, and Places gadget) are the same on both.


    ## 5.8 GTK Themes


    These are application themes, and they allow you to customize the appearance of
    the windows within which applications run. This is a very straightforward task,
    as it is simply a matter of downloading and trying out some themes.


    - 1) Open Firefox and go to the Bodhi home page (http://www.bodhilinux.com/) and
    navigate to Resources > Art Wiki > GTK Themes.

    - 2) Go down to bodhi_gtk_countryy_oak (fifth down on the right) and click on
    it. You are taken to the installation page for this theme.

    - 3) It’s best to do a sudo apt-get update before beginning the installation,
    and an easy way to do this is to click the link on the line below the heading
    ''Before Starting''. After a few seconds you will be asked if you want to install
    a small update program. Accept this.

    - 4) Now click on ''Install Now'', and a dialog box opens asking you to confirm
    the installation. Do so. (If Firefox misbehaves at this point and doesn’t display
    the box, restart it and try again.)

    - 5) Now go back to the theme gallery and click on the eighth theme down on the
    right, bodhi_gtk_gold. At its install page, click on ''Install Now'', then at
    the dialog box click ''Install'' again.

    - 6) Return once more to the theme gallery, and click on the next theme down,
    `bodhi_gtk_kiwi`. Install this.

    - 7) Leave Firefox open and maximized. Click the Settings gadget on your toolbar,
    and, at the Settings window, click Look and then Application Theme. The Application
    Theme Settings dialog box opens. Now minimize the settings window so that you
    can see as much as possible of the Firefox window.

    - 8) Highlight *Kiwi* in the Theme Settings dialog box and click *Apply*. The
    Firefox window will adopt a different colour scheme, and it will have different
    scrollbars.

    - 9) Now try the E17-GTK theme (this is the ‘Gold’ theme we downloaded at (5)
    above).

    - 10) Try others as well and pick the one you like and which matches the E17 theme
    which you applied in Chapter 2 (Bodhi-Theme). One of my favourites is Country
    Oak.


    You can if you wish change the icons used with your application theme. I will
    not be covering this here. But you can find alternative icon sets at the Bodhi
    Art Wiki, and you can apply them by clicking on the `loons` tab at the Application
    Themes Settings dialog box (7 above).


    ## 5.9 Profiles


    You have made many changes to the Compositing profile that you chose when you
    first installed Bodhi Linux. All of these settings have been stored in this profile.
    They include the theme you selected, the shelves you set up, and any edge and
    key bindings you created. If you now apply a different profile, it will have none
    of these settings (though it will keep the contents of your *ibar* and your System,
    and also your *Favourites* menu).


    This does not mean that you have lost all those settings that you laboriously
    created. By returning to the Compositing profile, your desktop will returned to
    its previous state, with all its settings in place.


    In the next section you are going to make some radical changes to your Compositing
    profile that you may not want to keep. How then can you return to your profile
    as it is now? The answer is to save it as a new profile under a different name,
    and then return to that new profile. So let''s save your profile now.


    1) Go to the Profile Selector dialog box. To do this, Run Everything, then type
    the first few letters of *profile* and press *Enter*.


    2) At this dialog box click *Add*. Then enter a name for your profile - something
    like *Mycompositing* will do.


    3) Click *OK*, then *Close*. Your profile, with its theme, wallpaper, shelves,
    bindings, and other settings, is stored.


    Note that you are *not* using your new profile. The Compositing profile is still
    selected at the

