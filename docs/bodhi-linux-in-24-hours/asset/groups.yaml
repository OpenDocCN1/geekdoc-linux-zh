    \ YOU SHOULD RIGHT-CLICK ITS ICON IN THE NAUTILUS SIDEBAR AND CHOOSE THE EJECT\
    \ OPTION FROM THE CONTEXT MENU.\n\n## SETTING NAUTILUS AND TERMINAL AS DEFAULT\
    \ APPLICATIONS\n\nOUR FINAL TASK IN THIS SECTION IS TO SET NAUTILUS AS THE DEFAULT\
    \ FILE MANAGER, AND GNOME TERMINAL AS THE DEFAULT TERMINAL.\n\n1) GO TO MAIN MENU\
    \ > SETTINGS > ALL > APPS > DEFAULT APPLICATIONS.\n2) AT THE DIALOG BOX THAT OPENS,\
    \ THE DEFAULT BROWSER SHOULD ALREADY BE SET TO FIREFOX, BUT YOU WILL NEED TO HIGHLIGHT\
    \ FILE IN THE LEFT PANE THEN SCROLL DOWN TO AND HIGHLIGHT NAUTILUS IN THE RIGHT\
    \ PANE, THEN CLICK APPLY.\n3) THEN HIGHLIGHT TERMINAL IN THE LEFT PANE AND TERMINAL\
    \ IN THE RIGHT PANE, AND APPLY.\n4) CLICK CLOSE.\n\nTHE REST OF THIS CHAPTER COVERS\
    \ MORE ADVANCED TOPICS AND CAN BE OMITTED OR RETURNED TO LATER. SO YOU CAN NOW\
    \ IF YOU WISH JUMP TO CHAPTER 3, *TURBOCHARGE YOUR DESKTOP*.\n\n## 2.7 RUNNING\
    \ NAUTILUS AS SUPERUSER\n\nSOMETIMES, AS IN THE NEXT SECTION, IT'S HANDY TO RUN\
    \ NAUTILUS AS A ‘SUPERUSER’ WITH ADMINISTRATIVE PRIVILEGES, AS THIS ALLOWS YOU\
    \ TO MAKE CHANGES TO PROTECTED SYSTEM DIRECTORIES. TO DO SO, YOU MUST RUN NAUTILUS\
