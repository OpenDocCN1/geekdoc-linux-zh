    ## 4. Beef up your System


    By the time you reach the end of this chapter you will have installed most of
    the applications you are likely to need. If you are new to Linux, the problem
    will be which out of the many possibilities should you choose? Sometimes the choice
    will be clear-cut, and in many cases there will be a Linux version of favourite
    software that you previously ran under Windows.


    VLC, for example, is the standard public domain (i.e. free) media player, both
    in Windows and Linux, and LibreOffice is the standard public domain office suite
    for both Windows and Linux. Other choices are not so clear-cut, and some that
    I suggest may not be the best for you. And if your computer is old and underpowered,
    this will limit your choices to lightweight applications.


    Your best policy is to try out one or two alternatives; it''s easy enough to uninstall
    those you don''t want and install others. (As in Windows, there may be some baggage
    left behind when you uninstall applications; you will learn how to remove this
    and tidy up your system in Chapter 6.)


    Whenever possible, you should install applications from the Bodhi AppCenter rather
    than Synaptic. To uninstall applications, use Synaptic.


