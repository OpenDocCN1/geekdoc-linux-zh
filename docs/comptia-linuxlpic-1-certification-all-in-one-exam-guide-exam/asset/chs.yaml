  \ `/etc/passwd` 和 `/etc/shadow` 中。\n\n![images](img/bull.jpg) `/etc/passwd` 文件存储用户账户信息。\n\
  \n![images](img/bull.jpg) `/etc/shadow` 文件存储加密的用户密码。\n\n![images](img/bull.jpg)\
