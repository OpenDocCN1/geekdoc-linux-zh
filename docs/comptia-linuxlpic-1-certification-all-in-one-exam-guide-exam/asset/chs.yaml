  A. `P`\nB. `/prev`\nC. `N`\nD. `/up`\n\n### 30. 查看 info 节点时，你可以使用哪一个按键导航到节点开头？\n\
  \nA. `B`\nB. `/top`\nC. `HOME`\nD. `T`\n\n### 31. 你想将 `~/temp` 目录添加到系统的 `PATH` 环境变量中。你想要确保不会覆盖现有的路径。你在提示符处输入\
