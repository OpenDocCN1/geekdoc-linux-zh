  \n**A.** 一天\n**B.** 七天\n**C.** 五天\n**D.** 空值（永不）\n\n## [21]. 分配给新用户账户的 UID 数字范围定义何处？\n\
  \n**A.** `/etc/login.defs`\n**B.** `/etc/default/useradd`\n**C.** `/etc/skel`\n\
