  \ `$`。\nD. 不，你必须在路径后面加上冒号。\n\n### 32. 哪些命令可以用于查看当前赋值的环境变量？（多选）\n\nA. `set`\nB. `display`\n\
  C. `show`\nD. `env`\n\n### 33. 你想查看系统当前定义的别名列表。你在提示符处输入哪条命令？\n\nA. `alias`\nB. `alias\
  \ –l`\nC. `alias –a`\nD. `env`\n\n### 34. 哪个文件描述符指的是命令完成后在屏幕上显示的文本？（多选）\n\nA. `stdin`\n\
  B. `stdout`\nC. `stdoutput`\nD. `stderr`\n\n### 35. 你想将 `tail /log/firewall` 命令的标准输出和标准错误重定向到当前目录下名为\
  \ `lestents` 的文件中。哪条命令可以做到此？\n\nA. `tail /log/firewall 1>lestents 2>lestents`\n\
  B. `tail /log/firewall >lestents`\nC. `tail /log/firewall 1&lestents`\nD. `tail\
  \ /log/firewall 1&2>lestents`\n\n### 36. 你想将当前目录下 `logfile.txt` 文件的内容传递给 `sort`\
  \ 命令进行字母顺序排序并显示在屏幕上。哪条命令可以做到此？\n\nA. `sort < ./logfile.txt`\nB. `sort –i ./logfile.txt`\n\
  C. `sort < ./logfile.txt –d “screen”`\nD. `sort < ./logfile.txt > screen`\n\n####\
  \ **Answers**\n\n1. C. bash 是大多数 Linux 发行版的默认 shell。\n2. C. 按 ALT-F2 会打开另一个控制台。你可以使用该控制台执行其他任务而无需停止在第一个屏幕运行的程序。你可以按\
  \ ALT-F1 返回。\n3. B. 在文件名名前加上 `./` 告诉 shell 文件位于当前目录。\n4. A, D. `env` 和 `echo` 都可以用于在屏幕上打印\
  \ PATH 环境变量。\n\n\n\n\n\n- D. `su` 命令用于用于 shell 提示符下切换到不同的用户账户。语法为 `su username`。如果你省略了用户名，`su`\
  \ 命令假设你想切换到 root 超级用户账户。\n- A. 非登录 shell 会读取 `~/.bashrc` 文件来定义用户的 shell 环境。\n- E.\
  \ 当首次打开 bash 登录 shell 时，会读取 `/etc/profile` 文件。\n- B. `~/.bash_history` 文件包含你最近执行的一系列\
  \ shell 命令列表。\n- C. `TAB` 键用于命令补全。\n- A. `man` 工具用于查看 man 页（帮助手册页）。如果特定命令或工具没有相应的\
  \ info 节点，那么 `info` 实际上也可以显示 man 页。\n- D. 在大多数 Linux 发行版中，`MANPATH` 环境变量存储了 man\
  \ 页的路径。\n- A. 在某些 Linux 发行版中，你可以使用 `/etc/man_db.conf` 文件指定 man 文件的路径。\n- C. 手册的第\
  \ 8 节包含 root 使用工具和命令的 man 页。\n- B. 手册的第 1 节包含任何用户都可以使用的命令 man 页。\n- C. `man mkdir`\
  \ 命令将显示 `mkdir` 的 man 页。\n- C. `man chmod` 命令将显示 `chmod` 的 man 页。\n- B. man 页的 `SYNOPSIS`\
  \ 节提供了命令或工具所用语法的概述。\n- C. man 页的 `SEE ALSO` 节提供了相关资源列表。\n- D. 按 `Q` 将退出 man。\n-\
  \ C. 要在 man 页中搜索表达式“password”，你只需输入 `/password`。\n- C. 在输入搜索词后，按 `N` 将带你转到 man 页中该术语的下一个实例。\n\
  - B. 输入 `man –k samba` 将在所有 man 页中搜索术语“samba”。\n- D. 输入 `apropos pam` 将在所有 man 页中搜索术语“pam”。\n\
  - D. 输入 `info smbpasswd` 将导致 `info` 显示关于 `smbpasswd` 工具的信息。\n- C. 按 `N` 将跳转到下一个节点。\n\
  - A. 按 `P` 将跳转到上一个节点。\n- C. 按 `HOME` 键将带你回到 info 节点的第一行。\n- D. 你必须在 `=` 后面使用 `$PATH`\
  \ 来引用 `PATH` 变量。否则，`PATH`将被解释为普通字符串。\n- A 和 E. 你可以使用 `set` 命令或 `env` 命令查看你的变量。\n\
  - A. `alias` 命令用于查看系统的别名。\n- B 和 E. `stdout` 和 `stderr` 文件描述符代表大多数命令（默认）显示在屏幕上的输出。\n\
  - C. `tail /var/log/firewall 1> lastevents 2> &1` 命令将 `stdout` 和 `stderr` 发送到同一个文件。\n\
  - A. `sort < ./logfile.txt` 命令将文件发送到 `sort` 命令的 `stdin`。\n\n# 第 3 章：使用 vi 文本编辑器\n\
  \n在本章，你将学习：\n- `vi` 文本编辑器的作用和功能\n- 在 `vi` 中编辑文本文件\n\n在使用任何 Linux 系统时（以及为了你的 Linux+\
  \ 和 LPIC-1 考试），你需要的关键技能之一就是有效使用文本编辑器器的。Linux 中的大多数系统配置任务都是通过文本编辑器编辑文本文件完成的，无论你是在配置操作系统本身还是在配置运行在系统上的服务。\n\
  \n这代表了 Linux 与 Windows 等操作系统之间的显著区别。在 Windows 中，你的大多数配置设置存储在一个名为 `Registry`（注册表）的数据库中。这些信息存储在称为\
  \ `keys`（键）的逻辑部分。这些键按层次结构存储；给定的键可以包含多个子键。这些键包含了存储系统配置信息的值。\n\n`Registry` 是一个很好的概念，但它的“键”问题之一是它设计时并未考虑终端用户。虽然\
  \ Windows 提供了一个名为 `Regedit.exe` 的注册表编辑器，但不建议你手动编辑 `Registry` 中的值。相反，你应该让操作系统以及安装在系统上的应用程序对\
  \ `Registry` 进行任何所有的更改。\n\n相反，Linux 不使用像 Windows `Registry` 那样存储所有系统配置信息的中央数据库。相反，你所有的配置信息都存储在文本文件中。这些文件大部分存储在\
  \ Linux 文件系统的 `/etc` 目录下。\n\nLinux 并没有像 Windows 那样阻止你手动编辑这些配置文件，而是*期望*你知道如何编辑这些文件以自定义你的系统运行方式。因此，你必须学会如何使用\
  \ Linux 文本编辑器来管理你的系统。\n\n## vi 文本编辑器的作用和功能\n\n此时，你可能在想：“我知道如何在其他操作系统上使用文本编辑器。我可以在\
  \ Windows 上使用 `Notepad`。为什么你们要在书中花整整章讲文本编辑器呢？”有两个原因：\n\n![images](img/bull.jpg)\
  \ 学会使用文本编辑器对于管理 Linux 系统至关重要。如果你不会使用文本编辑器，你将在学习书中其余部分的主题时遇到困难。\n\n![images](img/bull.jpg)\
  \ 坦率地说，Linux 编辑器对大多数新用户来说很难学会，特别是如果你是从 Windows 背景转过来的话。\n\n![Images](img/examtip.jpg)\n\
  \n**考试提示** 针对你的 Linux+ 和 LPIC-1 考试，你只需要熟悉 `vi` 文本编辑器。因此，你应该特别关注 `vi`。你需要非常熟悉如何在\
  \ `vi` 中打开文件、编辑它并保存你的更改。\n\n因此，在本章中，我们将花费大量时间学习如何使用各种 Linux 文本编辑工具。然而，请注意，经常有可用的图形化界面，允许你修改配置文件，而无需直接使用文本编辑器编辑配置文件。在我看来，目前最好的图形界面之一是\
  \ `Yet another Setup Tool (YaST)`，它随 openSUSE Linux 一起安装。`YaST` 图形界面见图 3-1。\n\n\
  ![Images](img/f0070-01.jpg)\n\n**图 3-1** 使用 YaST 进行配置更改\n\n使用 `YaST`，你可以安装软件、管理硬件设置、划分硬盘、配置引导加载程序、配置网卡、配置用户和组，以及配置系统中服务的设置。\n\
  \n许多其他发行版也使用配置界面。例如，`Fedora` 提供了几种不同的工具，用于配置系统设置、网络设置、和服务用户。\n\n承认，我喜欢使用这些图形界面。但在\
  \ Linux 早期，这些工具并不存在。每一个配置更改都必须通过文本编辑器完成。随着这些工具趋于成熟并成为手动编辑配置文件的替代方案，越来越多的 Linux 管理员开始使用它们。\n\
  \n\n\n\n\n![images](img/bull.jpg) Linux+ 和 LPIC-1 考试并不涵盖这些图形化配置工具。如果你想通过这些考试，必须熟悉基于文本的配置文件以及用于管理这些文件的文本编辑器。\n\
  \n![images](img/bull.jpg) 大多数 Linux 管理员仅为了方便起见才使用图形化前端。他们并不依赖它们。换句话说，一个优秀的 Linux\
  \ 管理员应该非常熟悉图形界面背后的配置文本文件，而不仅仅是界面本身。\n\n考虑到这一点，让我们深入研究并开始学习文本编辑器。对于你的 Linux+ 和 LPIC-1\
  \ 考试，你需要熟悉 `vi` 文本编辑器。`vi` 编辑器是一个非常基础的程序，用于编辑 Linux 系统上的文本文件。`vi` 编辑器已经存在很长时间了，我敢说它是\
  \ Linux 管理员使用最广泛的文本编辑器之一。\n\n实际上有两个版本的 `vi`。旧版本简单地称为 `vi`。较新版本被称为 `vim` (Vi 的增强版)。在较旧系统上，当你在\
  \ shell 提示符处输入 `vi` 时，你实际上可能在使用 `vi`。然而，在大多数现代 Linux 发行版中，你可能在使用较新版本的 `vim`。\n\n\
  `vi` 程序的可执行文件是你系统硬盘上的一个名为 `vim` 的文件。在大多数发行版中，`vim` 可执行文件位于 `/bin` 目录。在你的 `/usr/bin`\
  \ 目录下放置了一个名为 `vi` 的符号链接文件，它指向 `/bin/vim` 可执行文件，如下所示：\n\n![Images](img/p0071-01.jpg)\n\
  \n注意，`/usr/bin` 中也有一个名为 `vim` 的文件，它只是一个指向 `/bin/vim` 可执行文件的符号链接。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** `symbolic link`（符号链接）是一个指向文件系统中其他地方文件的快捷方式。我们将在第 4 章中深入讨论符号链接。\n\n结果是，无论你在\
  \ shell 提示符处输入什么命令（`vi` 或 `vim`），加载的都是 `vim` 编辑器。例如，图 3-2 所示，在 Fedora 系统的 shell\
  \ 提示符处输入了 `vi` 命令。但请注意，如欢迎界面所示，加载的是 `vim` 编辑器。\n\n![Images](img/f0072-01.jpg)\n\n\
  **图 3-2** 使用 vim\n\n考虑到这一点，让我们讨论如何在 `vi` 中编辑文本文件。\n\n## 在 vi 中编辑文本文件\n\n当你第一次运行\
  \ `vi` 时，你会立即注意到它的用户界面与你可能习惯的其他文本编辑器非常不同。为了让你熟悉 `vi`，我们在这里讨论以下主题：\n\n![images](img/bull.jpg)\
  \ 在 vi 中打开文件\n\n![images](img/bull.jpg) vi 模式\n\n![images](img/bull.jpg) 在插入模式下工作\n\
  \n![images](img/bull.jpg) 在命令行模式下工作\n\n![images](img/bull.jpg) 在命令模式下工作\n\n### 在\
  \ vi 中打开文件\n\n从 shell 提示符打开文件并在 `vi` 中操作，只需输入 `vi filename`。例如，假设你的用户目录下有一个名为 `myfile.txt`\
  \ 的文件。如果文件位于当前目录，你只需在 shell 提示符处输入 `vi myfile.txt` 即可该文件加载到 `vi` 编辑器中。如果文件位于当前目录以外的目录，你需要包含文件的完整路径。例如，如果你的当前目录是\
  \ `/tmp`，而你需要在 `vi` 中打开 `/home/rtracy/myfile.txt` 文件，你将在 shell 提示符处输入 `vi /home/rtracy/myfile.txt`。\n\
  \n使用 `vi` 创建新的文本文件也是可能的。为此只需在 shell 提示符处输入 `vi` 后加上你想创建的文件名。如果你没有在文件名中包含路径，文件将在当前目录创建。如果你指定了路径，文件将在该目录下创建。\n\
  \n例如，图 3-3 所示，当前目录是 `/home/rtracy`，在 shell 提示符处输入了命令 `vi yourfile.txt`。注意 `vi` 编辑器界面中打开了一个空白文件，如屏幕底部的“[New\
  \ File]”文本所示。需要注意的是，当你使用 `vi` 创建新文件时，在保存文件之前，文件实际上并没有在磁盘上被创建。在此之前，你在 `vi` 界面中输入的所有行文本都只保存在内存缓冲区中。如果你不保存文件，你将会丢失它！\n\
  \n![Images](img/f0073-01.jpg)\n\n**图 3-3** 使用 vi 创建新文件\n\n### vi 模式\n\n到目前为止一切顺利，对吧？我教\
  \ `vi` 的大部分学生都能处理在 `vi` 中打开文件或创建新文件。然而一旦文件打开，事情就开始变得有点混乱。这是因为 `vi` 使用了四种不同的模式：\n\
  \n![images](img/bull.jpg) 命令模式\n\n![images](img/bull.jpg) 命令行模式\n\n![images](img/bull.jpg)\
  \ 插入模式\n\n![images](img/bull.jpg) 替换模式\n\n默认情况下，`vi` 在命令模式（有时称为普通模式）下打开或创建文件。大多数学生发现\
  \ `vi` 不包含任何下拉菜单很困惑。相反，你必须使用命令行模式下的命令来完成任务。在命令模式下，你实际上无法编辑文件。要做到这一点，你必须先进入插入模式。要进入插入模式，你可以按下任何键：\n\
  \n![images](img/bull.jpg) I\n\n![images](img/bull.jpg) INSERT\n\n![images](img/bull.jpg)\
  \ S\n\n![images](img/bull.jpg) O\n\n![images](img/bull.jpg) A\n\n按下这些键之一后，你可以通过屏幕底部的“--INSERT--”文本判断你处于插入模式。这在图\
  \ 3-4 所示。\n\n![Images](img/f0074-01.jpg)\n\n**图 3-4** 插入模式下的 vi 编辑器\n\n再次按下 INSERT\
  \ 将导致 `vi` 切换到替换模式。插入模式类似于使用插入模式使用文字处理器。你输入的任何文本都会插入到文件中光标所在的位置。另一方面，替换模式类似于覆盖模式。当你输入新字符时，这些新字符将覆盖现有字符。你可以通过再次按下\
  \ INSERT 回到插入模式。\n\n在插入模式下，你可以向文件中添加文本、更改或删除文本。然而，你无法执行任何文件操作。例如，如果你对文件进行了更改并想保存，你无法在插入模式下这样做。要这样做，你必须先切换回命令模式。这通过按下\
  \ `ESC` 完成。在图 3-5 中，我们通过按下 `ESC` 从插入模式切换回命令模式。\n\n```\n(No code in text)\n```\n\n\
  ![Images](img/f0075-01.jpg)\n\n**图 3-5** 在 vi 中切换回命令模式\n\n在命令模式下，你可以输入各种不同的命令来删除文本行或在文件中搜索特定单词。你也可以进入命令行模式来保存当前文件或退出编辑器。我们将在本节稍后回顾这些命令。要回到插入模式，只需按下\
  \ `I`、`INSERT` 或 `S`。\n\n### 在插入模式下工作\n\n一旦你在 `vi` 中打开了文件并进入插入模式，你就可以像任何其他文本编辑器一样编辑文本。注意，在屏幕左侧，你会看到几行波浪号\
  \ (~)。这些字符实际上不在文件中。这些字符仅表示这些行在文件中不存在。在文件中添加行后，你会发现波浪号一个接一个地消失。\n\n\n\n\n\n你可以通过方向键以及\
  \ PAGE UP、PAGE DOWN、HOME 和 END 键在文件的不同插入点之间移动。你可以通过直接在键盘上输入字符来添加文本。你可以通过按下 `DELETE`\
  \ 或 `BACKSPACE` 键来删除文本。\n\n完成文本编辑后，你可以按下 `ESC` 切换回命令模式。从命令模式，你还可以进入命令行模式。接下来让我们来讨论在命令行模式下可以进行哪些操作。\n\
  \n## 在命令行模式下工作\n\n正如我们之前讨论过的，vi 编辑器没有提供用于完成常见文件任务的菜单。相反，你必须在命令行模式下输入命令。在本主题中，我们将回顾一些你可以使用的命令及其功能。\n\
  \n要进入 vi 的的命令行模式，你必须首先进入命令模式（如果你之前在插入模式），然后输入一个冒号（`:`）。当你这样做时，屏幕底部会显示一个命令提示符，如图\
  \ 3-6 所示。\n\n![Images](img/f0076-01.jpg)\n\n**图 3-6** vi 命令行模式命令提示符\n\n随后你可以在此提示符处输入命令来完成与文件相关的任务。显然，你在命令模式下需要完成的最重要任务之一是将文件写入磁盘。这是通过在提示符处输入\
  \ `w` 完成的。确保在输入命令后按下 `ENTER`。在命令提示符处输入 `w` 后，你会在屏幕底部看到一条消息，指示文件已写入磁盘，例如所示：\n\n![Images](img/p0076-01.jpg)\n\
  \n在命令提示符处输入 `w *filename` 将文件写入不同的文件名。你还可以在命令行提示符输入以下其他命令：\n\n![images](img/bull.jpg)\
  \ `exit` 写入当前文件并关闭 vi。\n\n![images](img/bull.jpg) `wq` 也将当前文件写入磁盘并关闭 vi。\n\n![images](img/bull.jpg)\
  \ `q` 在不保存当前文件的情况下关闭 vi。这仅在文件未发生更改时可用。如果文件已发生更改，你必须输入 `q!`。\n\n![images](img/bull.jpg)\
  \ `w!` 覆盖当前文件。\n\n![images](img/bull.jpg) `e!` 放弃自上次写入以来的更改。\n\nvi 编辑器的另一个有用功能是它提供了一个非常实用的语法检查器。当你编写脚本或编辑配置文件时，这个功能可以成为真正的救星。没有什么比脚本或守护进程因为你忘记某处的分号或右括号而无法运行更令人沮丧的。可以使用\
  \ `syntax` 命令行命令启用或禁用语法检查。按下 `ESC` 进入命令模式，然后输入 `:syntax on | off`。例如，要启用语法检查，你需要输入以下内容：\n\
  \n```\n:syntax on\n```\n\n这样做之后，脚本或配置文件中的不同元素将用不同的颜色标记。如果你犯语法错误，错误将用交替颜色突出显示，方便你发现。在编辑守护进程配置文件时使用\
  \ vi 语法检查器的示例如图 3-7 所示。\n\n![Images](img/f0077-01.jpg)\n\n**图 3-7** 使用 vi 语法检查器\n\
  \n除了在命令行提示符处输入的命令外，你还可以在命令模式下输入命令。让我们讨论这些命令。\n\n## 在命令模式下工作\n\n命令模式命令不是在命令提示符处输入的。相反，这些命令是在*不*先输入冒号（`:`）的情况下输入的。如果你处于插入模式，按下\
  \ `ESC` 返回命令模式。然后你可以输入以下命令：\n\n![images](img/bull.jpg) `dw` 删除光标后紧跟的单词，包括单词后的空格。文本保存存在内存缓冲区。\n\
  \n![images](img/bull.jpg) `de` 删除光标后紧跟的单词，但不包括空格。文本保存在内存缓冲区中。\n\n![images](img/bull.jpg)\
  \ `d$` 删除从插入点到行尾的内容。文本保存在内存缓冲区中。\n\n![images](img/bull.jpg) `dd` 删除整个当前行。文本保存在内存缓冲区中。\n\
  \n![images](img/bull.jpg) `p` 在当前光标位置后插入上次删除操作的文本。\n\n![images](img/bull.jpg) `u`\
  \ 撤销上一次操作。\n\n![images](img/bull.jpg) `D` 从光标位置开始删除当前行的剩余部分。\n\n![images](img/bull.jpg)\
  \ `yy` 将光标所在的行复制到缓冲区。\n\n![images](img/bull.jpg) `a` 在光标后追加。\n\n![images](img/bull.jpg)\
  \ `A` 在行尾追加。\n\n![images](img/bull.jpg) `C` 更改到行尾。\n\n![images](img/bull.jpg) `cw`\
  \ 从光标下的字符开始，用新文本更改当前单词，直到*按下 ESC*为止。\n\n![images](img/bull.jpg) `cc` 更改整行。\n\n![images](img/bull.jpg)\
  \ `ZZ` 保存当前文件并结束 vi。\n\n![images](img/bull.jpg) `h` 光标向左移动一个字符。\n\n![images](img/bull.jpg)\
  \ `j` 光标向下移动一行。\n\n![images](img/bull.jpg) `k` 光标向上移动一行。\n\n![images](img/bull.jpg)\
  \ `l` 光标向右移动一个字符。\n\n![images](img/bull.jpg) `0` 光标移动到当前行开头。\n\n![images](img/bull.jpg)\
  \ `CTRL-G` 在界面底部显示状态行。这显示了文件名、文件状态、文件总行数以及当前光标位置。结果例所示：\n\n![Images](img/p0078-01.jpg)\n\
  \n![images](img/bull.jpg) `/*search_term` 搜索指定术的下一个实例。例如，输入 `/init` 会搜索光标后文本“init”的下一个实例。执行搜索后按下\
  \ `n` 将搜索搜索术语的下一个实例。在图 3-8 中，在命令模式下输入了 `/5901` 命令。结果 5901 的第一个实例被突出显示。\n\n![images](img/bull.jpg)\
  \ `?/*search_term` 搜索指定术语的上一个实例。\n\n![Images](img/f0078-01.jpg)\n\n**图 3-8** 在 vi\
  \ 中搜索文本\n\n如所示，vi 是一个简单而强大的文本编辑器。我对 vi 的唯一抱怨是它的界面很难学习。然而，一旦你使用了一段时间，它就会变成你的习惯。因此，让我们在下面的练习中练习\
  \ vi。\n\n### 练习 3-1：使用 vi 编辑器\n\n在此练习中，你将练习使用 vi 编辑器创建和操作文件。你可以可以使用本书提供的虚拟机进行此练习。运行截图\
