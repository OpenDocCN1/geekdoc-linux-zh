  \ 符号链接到 `/boot/grub/grub.conf` 文件，因此无论你编辑哪个文件，都会在正确的地方更改。Fedora 还将 `/etc/grub.conf`\
  \ 文件符号链接到 `/boot/grub/grub.conf`，因此你也可以在编辑器中加载此文件来更改你的 GRUB 配置。找到应该使用哪个文件配置 GRUB\
  \ 的简单方法是只需切换到你的 `/boot/grub` 目录并寻找 `grub.conf` 或 `menu.lst` 文件，如下所示：\n\n![Images](img/p0179-01.jpg)\n\
  \n无论你的 GRUB 配置使用哪个文件，它都将使用标准的结构。GRUB 配置文件的第一部分包含适用于所有菜单项的全局选项。然后，它有一个或多个标题部分，用于启动特定的操作系统。这里显示了一个典型的\
