  **C.** `for`\n**D.** `case`\n\n## [12]. 你正在设计公司网络中一台新 Linux 服务器的实现。该服务器将作为你组织的内部文件和打印服务器。员工将他们的工作相关文件保存在服务器上的共享存储位置。共享打印机的打印作业也将由该服务器管理。你的规格说明中应该包含哪些服务？（选择两项）\n\
