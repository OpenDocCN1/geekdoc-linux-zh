  \n## **CompTIA**[®]\n\n![Images](img/f0vii-01.jpg)\n\n### 成为 CompTIA 认证 IT 专业人士很容易\n\
  \n这也是获得更大职业机会和回报的最佳方式。\n\n### 为什么要获得 CompTIA 认证？\n\n### 需求增长\n\n劳动力估计预测，到 2020 年，某些技术领域的增长将超过\
  \ 20%。（来源：CompTIA 第 9 年度信息安全趋势研究：500 名负责安全的美国 IT 和业务高管。）CompTIA 认证提供了加入该劳动力市场所需的技能。\n\
  \n### 更高的薪水\n\n简历上拥有认证的 IT 专业人士可以获得更好的工作，赚更高的薪水，并为更多新的跨行业机会打开大门。\n\n### 经验证实力\n\n\
  \n\n\n\n91% 的招聘经理表示，CompTIA 认证在验证 IT 专业知识方面具有价值，这使认证成为向雇主展示你能力和知识的最佳方式。（来源：CompTIA\
  \ 雇对 IT 培训与认证的认知。）\n\n### 通用技能\n\nCompTIA 认证是厂商中立的——这意味着经过认证的专业人员可以熟练处理大多数组织中使用的各种硬件和软件。\n\
  \n![Images](img/f00vii-02.jpg)\n\n**如需了解更多信息，请访问 [Certification.CompTIA.org/linuxplus](http://www.Certification.CompTIA.org/linuxplus)。**\n\
  \n### 内容质量印章\n\n本课程软件带有 CompTIA 批准优质内容（CompTIA Approved Quality Content）印章。该印章意味着此内容涵盖了\
  \ 100% 的考试目标并实施了重要的教学设计原则。CompTIA 推荐多种学习工具以帮助增加对学习目标的覆盖范围。\n\n![Images](img/f00viii-01.jpg)\n\
  \nCompTIA 批准优质内容 (CAQC) 计划标志以及本材料或其他培训材料在 CompTIA 批准优质内容计划下的“已批准”状态表明，在 CompTIA\
  \ 看来，此类培训材料涵盖了 CompTIA 相关认证考试的内容。\n\n本培训材料的内容是为 CompTIA Linux+ 考试创建的，涵盖了截至发布日期有效的\
  \ CompTIA 认证目标。\n\nCompTIA 未经审查或批准本培训材料内容的准确性，并特别否认任何关于销销性或特定用途适用性的保证。CompTIA 对于使用任何此类“已批准”或其他培训材料准备任何\
  \ CompTIA 认证考试的人的成功不作任何保证。\n\n\n\n***\n\n\n\n***\n\n\n\n\n\n\n\n\n\n\n## 收集网络信息\n\
