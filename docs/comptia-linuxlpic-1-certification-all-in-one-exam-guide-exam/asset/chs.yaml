  \ `/etc/logrotate.conf` 文件以及位于 `/etc/logrotate.d/` 的各个服务的配置文件进行配置的。\n\n![images](img/bull.jpg)\
  \ 你可以配置 `syslogd` 将所有日志事件发送到运行另一个 Linux 系统上的 `syslogd` 守护进程。\n\n![images](img/bull.jpg)\
  \ 许多管理员会在网络中设置一个系统作为日志主机，所有 Linux 管理员都会向那里发送日志文件。\n\n![images](img/bull.jpg) 较新的发行版使用\
  \ `journald` 守护进程管理日志。\n\n![images](img/bull.jpg) 你可以使用 `journalctl` 命令查看日志。\n\n\
  ![images](img/bull.jpg) 虽然你可以使用 `less`、`cat` 和 `more`，但可以使用 `tail` 和 `head` 实用程序更有效地查看日志文件。\n\
  \n![images](img/bull.jpg) `tail` 实用程序显示文件的最后几行。\n\n![images](img/bull.jpg) `head`\
  \ 实用程序将显示文件的前几行。\n\n![images](img/bull.jpg) 你还可以使用 `grep` 搜索日志文件中的内容。\n\n![images](img/bull.jpg)\
  \ 你可以在 `tail` 或 `journalctl` 中配合 `-f` 选项来监控日志文件的新条目。\n\n![images](img/bull.jpg)\
  \ Linux 日志文件可用于检测入侵尝试。\n\n![images](img/bull.jpg) 你应该定期检查以下日志文件，寻找指示入侵尝试的异常：\n\n\
  - `/var/log/wtmp`\n- `/var/log/faillog`\n- `/var/log/lastlog`\n- `/var/log/messages`\n\
  \n![images](img/bull.jpg) 你可以使用 `who` 和 `finger` 实用程序查看谁正在使用系统。\n\n![images](img/bull.jpg)\
  \ `xinetd` 和 `inetd` 守护进程都是管理网络服务的超级守护进程。\n\n![images](img/bull.jpg) 当请求网络服务时，`xinetd`\
  \ 或 `inetd` 会启动该服务并将请求转发它。\n\n![images](img/bull.jpg) 当请求完成且不再需要服务时，`xinetd` 或 `inetd`\
  \ 将其从内存中卸载。\n\n![images](img/bull.jpg) `xinetd` 守护进程使用 `/etc/xinetd.conf` 文件进行配置。\n\
  \n![images](img/bull.jpg) 由 `xinetd` 管理的各个服务可以使用位于 `/etc/xinetd.d` 的相应配置文件来启用或禁用。\n\
  \n![images](img/bull.jpg) 你可以使用 TCP Wrappers 控制你的网络服务。\n\n![images](img/bull.jpg)\
  \ 使用 TCP Wrappers，`xinetd` 守护进程运行 `tcpd` 守护进程而不是网络服务。\n\n![images](img/bull.jpg)\
  \ `tcpd` 守护进程检查 `/etc/hosts.deny` 和 `/etc/hosts.allow` 文件以判断是否允许该主机。如果是，`tcpd` 将加载请求的程序。\n\
  \n![images](img/bull.jpg) `inetd` 守护进程使用 `/etc/inetd.conf` 文件进行配置。\n\n![images](img/bull.jpg)\
  \ 该文件的每一行配置一个由 `inetd` 管理的单一服务。\n\n![images](img/bull.jpg) 你可以像对 `xinetd` 一样对 `inetd`\
  \ 使用 TCP Wrappers。这允许你使用 `/etc/hosts.allow` 和 `/etc/hosts.deny` 文件来控制运行在主机上的网络服务的访问。\n\
