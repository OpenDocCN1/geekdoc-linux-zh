  14. 输入 `:q!` 退出文件且不保存更改。\n\n你现在已经拥有足够的技能来使用 `vi` 管理典型的 Linux 系统！\n\n### 章节复\n\n\
  在本章中，你学习了如何使用 `vi` 文本编辑器。我首先强调了文本编辑器在 Linux 系统管理中起的重要作用。与其他使用数据库存储系统和应用程序设置的操作系统不同，Linux\
  \ 将这些信息存储在文本文件中。因此，为了配置 Linux 系统，你需要知道如何编辑这些文件。\n\n通常情况下，我们不会花费大量时间学习如何使用文本编辑器。然而，由于\
  \ `vi` 文本编辑器比其他操作系统上的文本编辑器稍微难用一点，我们花了一些额外的时间学习如何操作它。我指出，现在有多种图形化前端可以使系统配置任务变得更简单。然而，我也指出，一个优秀的系统管理员需要理解这些工具所操作的底层配置文件。要做到这一点，你需要知道如何使用文本编辑器。\n\
  \n最常用的 Linux 文本编辑器（也是你将在 Linux+ 和 LPIC-1 考试中将要测试的测试器）是 `vi` 编辑器。虽然 `vi` 是一个相对简单的编辑器，但它体积很小，不需要图形化环境，并且可以放入软盘中。这使得它在需要从软盘启动故障系统的紧急维修情况下成为理想选择。\n\
  \n如需运行 `vi`，只需在 shell 提示符下输入 `vi`。要运行 `vi` 并加载文件，请在 shell 提示符下输入 `vi *filename`。如果你指定的文件不存在，`vi`\
  \ 将为你创建一个新文件。\n\n然后我讨论了 `vi` 可以运行的四种模式。在命令模式下，你不能直接编辑文件的文本。要此此，你需要按下 `INSERT`、`S`、`O`\
  \ 或 `I` 键切换到插入模式或替换模式。返回命令模式，只需按下 `ESC` 键。一旦进入插入模式或替换模式，你就可以像使用典型的文字处理器一样编辑文本文件。\n\
  \n接着我讨论了你可以在命令行模式下输入的执行文件相关操作的命令。要进入命令行模式，你首先切换到命令模式（如有必要），然后输入冒号 `:`。这会显示一个命令行提示符，你可以用它输入\
  \ `vi` 命令，包括以下：\n\n![images](img/bull.jpg) `w` 将当前文件写入磁盘。\n\n![images](img/bull.jpg)\
  \ `exit` 将当前文件写入磁盘然后关闭 `vi`。\n\n![images](img/bull.jpg) `wq` 同样将当前文件写入磁盘并关闭 `vi`。\n\
  \n![images](img/bull.jpg) `q` 关闭 `vi` 而不保存当前文件。\n\n![images](img/bull.jpg) `q!`\
  \ 关闭 `vi` 而不保存当前文件，即使文件已被修改。\n\n![images](img/bull.jpg) `w!` 覆盖当前文件。\n\n![images](img/bull.jpg)\
  \ `e!` 忘记自上次写入以来的更改。\n\n我们接着讨论了你可以在命令模式下输入的文本处理命令。这些命令是在不输入冒号 `:` 的情况下。你可以输入以下：\n\
  \n![images](img/bull.jpg) `dw` 删除光标紧随后的单词，包括单词后的空格。\n\n![images](img/bull.jpg) `de`\
  \ 删除光标紧随后的单词，但不包括随后的空格。\n\n![images](img/bull.jpg) `d$` 从插入点到行尾删除。\n\n![images](img/bull.jpg)\
  \ `dd` 删除整个当前行。\n\n![images](img/bull.jpg) `p` 在当前光标位置后插入删除的文本。\n\n![images](img/bull.jpg)\
  \ `u` 撤销上一次操作。\n\n![images](img/bull.jpg) `/term` 在文件中搜索指定的术语。\n\n![images](img/bull.jpg)\
  \ `D` 从光标位置删除当前行的剩余部分。\n\n![images](img/bull.jpg) `yy` 将光标所在的行复制到缓冲区。\n\n![images](img/bull.jpg)\
  \ `a` 在光标后追加。\n\n![images](img/bull.jpg) `A` 在行后追加。\n\n![images](img/bull.jpg) `C`\
  \ 修改到行尾。\n\n![images](img/bull.jpg) `cc` 修改整整行。\n\n![images](img/bull.jpg) `ZZ`\
  \ 保存当前文件并结束 `vi`。\n\n![images](img/bull.jpg) `h` 光标向左移动一个字符。\n\n![images](img/bull.jpg)\
  \ `j` 光标向下移动一行。\n\n![images](img/bull.jpg) `k` 光标向上移动一行。\n\n![images](img/bull.jpg)\
  \ `l` 光标向右移动一个字符。\n\n![images](img/bull.jpg) `0` 光标移动到当前行开头。\n\n#### 加速复习\n\n![images](img/bull.jpg)\
  \ 你必须能够使用文本编辑器来管理 Linux 系统。\n\n![images](img/bull.jpg) Linux 使用文本文件存储操作系统和应用程序设置。\n\
  \n![images](img/bull.jpg) 大多数 Linux 发行版现在都有许多配置工具可用；然而，你仍然需要熟悉使用文本编辑器手动编辑文件。\n\n\
