  \n**16.** 你需要在你的 Linux 系统上挂载一个 USB 闪存盘。假设你的 Linux 系统目前有一个 SATA 硬盘，那么哪个设备文件代表该闪存盘？\n\
  \n**A.** `/dev/hdb`\n\n**B.** `/dev/usb0`\n\n**C.** `/dev/sdb`\n\n**D.** `/dev/sda`\n\
  \n**E.** `/dev/sdc`\n\n**17.** 哪种类型的备份会备份自上次全备以来修改的所有文件，并且不会将这些文件标记为已备份？\n\n**A.**\
  \ 全备\n\n**B.** 增量备份\n\n**C.** 差异备份\n\n**D.** 部分备份\n\n**18.** 你需要将 `/etc` 备份到挂载在\
  \ `/mnt/USB` 的可移动硬盘上。哪条 `tar` 命令可以实现此操作？\n\n**A.** `tar –cfv /mnt/USB/backup.tar\
  \ /etc`\n\n**B.** `tar –xfv ~/backup.tar /etc`\n\n**C.** `tar –xzf /mnt/USB/backup.tar\
  \ /etc`\n\n**D.** `tar –cfv /mnt/USB/backup.tar ~/etc`\n\n**19.** 你想在你家目录下的 `Projects`\
  \ 目录中创建一个所有文件的压缩 cpio 归档，到 `/mnt/usbdrive/Projectsbackup.cpio.gz`。哪条命令可以实现此操作？\n\
  \n**A.** `cpio –ov ~/Projects | gzip > /mnt/usbdrive/Projectsbackup.cpio.gz`\n\n\
  **B.** `ls ~/ Projects | cpio –ovz | > /mnt/usbdrive/Projectsbackup.cpio.gz`\n\n\
  **C.** `ls ~/ Projects | cpio –ov | gzip > /mnt/usbdrive/Projectsbackup.cpio.gz`\n\
  \n**D.** `cpio –ovz ~/Projects > /mnt/usbdrive/Projectsbackup.cpio.gz`\n\n**20.**\
  \ 哪条命令可以用于创建 `/dev/sda2` 分区的镜像到 `/mnt/usb/volback` 文件中？\n\n**A.** `dd if=/dev/sda2\
  \ of=/mnt/usb/volback`\n\n**B.** `cp /dev/sda2 /mnt/usb/volback`\n\n**C.** `dd if=/mnt/usb/volback\
  \ of=/dev/sda2`\n\n**D.** `dd if=/dev/sda of=/mnt/usb/volback`\n\n**21.** 你需要在 `/dev/sdc`\
  \ 硬盘驱动器创建一个新的 GPT 分区。你已经在 shell 提示符下输入了 `gdisk /dev/sdc`。你应该输入哪个命令来创建一个大小为 100GB\
  \ 的新分区？\n\n**A.** `n`\n\n**B.** `p`\n\n**C.** `new –size=100G`\n\n**D.** `t`\n\n\
  **22.** 你刚刚向 Linux 服务器添加了第三块 1TB SSD 硬盘，并将它的存储空间添加到系统中名为 `DATA` 的 LVM 卷组中。你首先应该输入哪条命令来实现此操作？\n\
  \n**A.** `vgexpand DATA /dev/sdc`\n\n**B.** `pvscan /dev/sdc DATA`\n\n**C.** `pvcreate\
  \ /dev/sdc`\n\n**D.** `lvextend –L 1T –n DATA`\n\n### Answers\n\n**1. B.** `fdisk\
  \ /dev/sdd` 命令使用了正确的语法为系统中的第四个 SATA 硬盘创建 MBR 分区。\n\n**2. B.** 输入 `82` 定义一个 Linux\
  \ 交换分区（swap）。\n\n**3. B.** `mkfs –t ext3 /dev/sdd1` 命令使用了正确的语法，使用 `ext3` 文件系统格式化第四个\
  \ SATA 硬盘上的第一个分区。\n\n**4. B.** 在 `ext4` 文件系统上，分区超级块的第一个冗余副本默认存储在块 `32768` 上。\n\n\
  **5. A, C.** `mkswap /dev/sdb1` 命令用于创建交换文件系统，而 `swapon /dev/sdb1` 命令将其作为交换分区启用。\n\
  \n**6. B, C.** 使用 `mount –t ext4 /dev/sdb1 /mnt/extraspace/` 命令或 `mount –a /dev/sdb1\
  \ /mnt/extraspace/` 命令都会将 `/dev/sdb1` 分区挂载到 `/mnt/extraspace/`。\n\n**7. D.** `mount\
  \ –o loop ~/discimage.iso /mnt` 命令将镜像文件挂载到 `/mnt` 目录。\n\n**8. A, C.** 使用 `umount\
  \ /mnt` 命令或 `umount /dev/sdb1` 命令都会从文件系统中卸载该分区。\n\n**9. D.** `/etc/fstab` 文件用于在启动时自动挂载文件系统。\n\
  \n**10. B.** `sync` 选项导致待处理的磁盘写入被立即写入。\n\n**11. A.** `df –i` 命令显示所有挂载文件系统的 inode\
  \ 消耗摘要。\n\n**12. B.** `tune2fs –L DATA /dev/sda1` 命令将卷标签设置为 `DATA`。\n\n**13. E.**\
  \ 带有 `-c` 选项的 `tune2fs` 命令可自定义自动 `fsck` 检查的频率。\n\n**14. A.** `mount –t iso9660 /dev/cdrom\
  \ /media/dvd` 命令在大多数发行版上使用了正确的语法，假设已经创建了名为 `/dev/cdrom` 指向 `/dev/sr0` 的符号链接。\n\n\
  **15. B, D.** `fuser` 命令的 `-k` 选项杀死进程，而 `-u` 选项显示哪个用户拥有该进程。\n\n**16. C.** 设备将通过\
  \ `/dev/sdb` ，因为系统中还有另一个硬盘。\n\n**17. C.** 差异备份会备份自上次全备以来修改的所有文件，并且不会将这些文件标记为已备份。\n\
  \n**18. A.** `tar –cfv /mnt/USB/backup.tar /etc` 命令使用了正确的语法。\n\n**19. C.** `ls ~/\
  \ Projects | cpio –ov | gzip > /mnt/usbdrive/Projectsbackup.cpio.gz` 命令将生成 `Projects`\
  \ 目录下的文件列表，将列表发送给 `cpio` 命令创建归档，并将归档发送给 `gzip`。\n\n**20. A.** `dd if=/dev/sda2 of=/mnt/usb/volback`\
  \ 在 `/mnt/usb/volback` 文件中创建你的 `/dev/sda2` 分区的镜像。\n\n**21. A.** 在 `gdisk` 中，你输入\
  \ `n` 来创建一个新分区。在此之后，系统会提示你指定其大小。\n\n**22. C.** 在从卷组分配空间之前，你必须首先将其定义为物理卷。在这种情况下，你使用\
  \ `pvcreate /dev/sdc` 来实现这一点。\n\n# 第 11 章\n## 管理所有权、权限和配额\n\n在本章中，你将学习：\n*   管理所有权\n\
  *   挂载文件和目录权限\n*   管理磁盘配额\n\n在管理 Linux 系统的访问时，你有两个任务需要完成：\n*   控制谁可以访问系统\n*   定义用户登录系统后可以做什么\n\
  \n我们通过实现用户和组来控制谁访问系统。在本章的范围内，我们将处理第二个点。我们需要定义用户登录系统后可以做什么。让我们从讨论文件目录所有权开始。\n\n###\
  \ 管理所有权\n\n为了有效地控制谁可以在文件系统中做什么，你首先需要考虑谁“拥有”文件和目录。我们将就此方面讨论：\n*   所有权如何工作\n*   从命令行管理所有权\n\
  \n### 所有权如何工作\n\n任何用户创建新文件或目录时，其用户账户会被分配为该文件或目录的所有者。默认情况下，Linux 系统中目录的所有者拥有该目录的读、写和执行权限。本质上他们可以对该目录做任何事情。同样，Linux\
  \ 系统中文件的所有者默认拥有读和写权限。例如，假设 ksanders 用户登录她的 Linux 系统，并在家目录中使用 OpenOffice.org 创建了一个名为\
  \ contacts.odt 的文件。因为她创建了这个文件，ksanders 被自动分配了 contacts.odt 的所有权。通过在系统的图形用户界面中右键点击此文件并选择“属性\
  \ | 权限”，你可以查看谁拥有该文件。如图 11-1 所示。\n\n**图 11-1** 在 GNOME 桌面查看文件所有权\n\n\n\n\n\n注意图 11-1，`contacts.odt`\
  \ 实际上有两个所有者。第一个是拥有该文件的用户名。在本例中，它是 `ksanders`。此外，`users` 组也拥有该文件。这是因为 `users` 是 `ksanders`\
  \ 所属的主组。\n\n你也可以通过 `ls –l` 命令从命令行查看文件所有权。在本示例中，已在 `ksanders''` 的主目录下执行了此操作：\n\n\
  ![Images](img/p0394-01.jpg)\n\n注意输出中的第三列显示文件或目录所有者的名称（`ksanders`），而第四列显示所有该文件的组名称（`users`）。虽然文件和目录的所有权是在创建时自动分配的，但是可以被修改的。接下来让我们讨论如何进行操作。\n\
  \n### 从命令行管理所有权\n\n文件和目录的所有权不是固定的实体。尽管所有权是在创建时自动分配的，但它是可以被修改的。你可以指定不同的用户和/或组作为给定文件或目录的所有者。要更改拥有文件的用户，你必须以\
  \ `root` 身份登录。要更改拥有文件的组，你必须以 `root` 身份登录，或者以当前拥有文件的用户身份登录。\n\n这可以通过图形界面工具或命令行工具完成。为了遵循本书的形式，我们将重点关注命令行实用，包括以下工具：\n\
  \n![images](img/bull.jpg) 使用 `chown`\n\n![images](img/bull.jpg) 使用 `chgrp`\n\n让我们从学习如何使用\
  \ `chown` 开始。\n\n### 使用 chown\n\n`chown` 工具可用于更改文件或目录的用户或组。使用 `chown` 的语法为 `chown\
  \ user.group file` 或 `directory`。例如，假设我在 `/tmp` 中有一个名为 `myfile.txt` 的文件，它由 `root`\
  \ 拥有。如果我想将文件的所有者更改为 `ksanders` 用户，我将输入 `chown ksanders /tmp/myfile.txt`，如下：\n\n\
  ![Images](img/p0395-01.jpg)\n\n注意，此命令将拥有文件的用户更改为了 `ksanders`。然而，请注意，拥有文件的组仍然是 `root`。这是在文件创建时分配的，因为\
  \ `root` 的主组名为 `root`。如果我想将其更改为 `ksanders` 成员所在的 `users` 组，我将输入 `chown .users /tmp/myfile.txt`。注意我在组名之前使用了点（`.`），以告诉\
  \ `chown` 指定的实体是一个组而不是用户账户。执行此命令后，所有组被更改为 `users`，如下：\n\n![Images](img/p0395-02.jpg)\n\
  \n我实际上可以通过一个 `chown` 命令同时更改拥有文件的用户和组。在本例中，我可以输入 `chown ksanders.users /tmp/myfile.txt`。这告诉\
  \ `chown` 要更改所有权的用户是 `ksanders`，要更改所有权的组是 `users`。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 你可以在使用 `chown` 时配合 `-R` 选项，用以一次性递归地更改多个文件的所有权。\n\n让我们也来看看 `chgrp` 工具。\n\
  \n### 使用 chgrp\n\n除了 `chown` 之外，你还可以使用 `chgrp` 来更改文件或目录的所有组。只需输入 `chgrp group file`\
  \ 或 `directory` 即可。例如，要将之前示例中的 `/tmp/myfile.txt` 文件的组所有从 `root` 更改为 `users`，你可以输入\
  \ `chgrp users /tmp/myfile.txt`。\n\n让我们在下面的练习中管理所有权。\n\n### 练习 11-1：管理所有权\n\n在此练习中，你将在\
  \ Linux 系统的 shell 提示符练习修改文件和目录的所有权。你可以使用书中附带虚拟机进行此练习。运行快照 11-1 以获得配置正确的环境。\n\n***\n\
  \n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 11-1 视频，演示如何执行此任务。\n\n完成以下操作：\n\n1. **验证你已登录系统。**\n\
  2. **打开一个终端会话。**\n3. **如有必要，使用 `su –` 命令切换到 root 用户账户，密码为 `student`。**\n4. **通过以下操作验证你的学生用户账户是研究组的成员：**\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 研究组在第 9 章的练习 9-2 中已配置。\n\n**a.** 在 shell\
  \ 提示符下输入 `cat /etc/group`。\n**b.** 验证你的学生用户是研究组的成员。\n**c.** 如果你的学生用户不是研究组的成员，使用\
  \ `groupmod` 命令将其添加。\n\n5. **在 shell 提示符下输入 `cd /` 进入 `/` 目录。**\n6. **在 shell 提示符下输入\
  \ `mkdir RandD` 创建名为 `RandD` 的新目录。**\n7. **在 shell 提示符下输入 `ls –l`。注意 root 用户账户和\
  \ root 组是新目录的所有者。**\n8. **在 shell 提示符下输入 `chown student.research RandD` 将目录的所有权更改为你的学生账户和研究组。**\n\
  9. **再次在 shell 提示符下输入 `ls –l`。验证 `RandD` 目录的所有权已更改为你的学生账户和研究组。所示：\n\n![Images](img/p0397-01.jpg)\n\
  \n现在你已经了解了用户、组和所有者，你终于准备好处理 Linux 文件系统权限了。接下来让我们讨论如何操作。\n\n## 管理文件和目录权限\n\n管理所有权仅是控制\
  \ Linux 文件系统中文件和目录访问所需的一部分。所有权仅指定了谁*拥有*什么。它并没有说明你对文件和目录*可以*或*不能*做什么。要做到这一点，你需要设置并管理*权限*。你需要理解以下内容：\n\
  \n![images](img/bull.jpg) 权限的工作原理\n![images](img/bull.jpg) 从命令行管理权限\n![images](img/bull.jpg)\
  \ 使用默认权限\n![images](img/bull.jpg) 使用特殊权限\n\n让我们先解释权限的工作原理。\n\n### 权限的工作原理\n\n与所有权不同，权限用于精确指定特定用户对文件系统中的文件和目录可以做什么。这些权限可能允许用户查看文件但不修改它。它们可能允许用户打开并修改文件。它们可能允许用户运行可执行文件。权限可以配置为防止用户甚至看到目录内的文件。\n\
  \nLinux 文件系统中的每个文件或目录都存储了分配给它的特定权限。这些权限共同成了文件的*模式*（mode）。任何文件或目录的模式中都可能包含表 11-1\
  \ 所示的权限。\n\n![Images](img/t0397-01.jpg)\n\n**表 11-1 Linux 权限**\n\n对于文件系统中的每个文件和目录，这些权限分配给三个不同的实体：\n\
  \n![images](img/bull.jpg) **所有者**（Owner）这是被分配为文件或目录所有者的用户账户。分配给所有者的权限仅适用于该用户账户。\n\
  \n![images](img/bull.jpg) **组**（Group）这是被分配文件或目录权的组。分配给组的权限适用于该组的所有用户账户。\n\n![images](img/bull.jpg)\
  \ **其他**（Others）此实体指的是所有成功通过系统身份验证的其他用户。分配给此实体的权限适用于这些用户账户。\n\n\n\n\n请注意，权限是累加的。这意味着一个用户账户可能会接收分配给多个实体的权限。例如，假设我将文件的读写权限分配给\
  \ `Owner`（所有者），将执行权限分配给 `Group`（组）。如果 `ksanders` 是该文件的 `Owner`，`users` 是该 `Group`，且\
  \ `ksanders` 是 `users` 的成员，那么 `ksanders` 就会同时获得分配给 `Owner` 和 `Group` 的权限。她的有效权限将是\
  \ `rwx`！\n\n此外，分配给 `Others`（其他）的权限时要非常小心。基本上，系统上的每个用户都属于 `Others`；因此，你授予 `Others`\
  \ 的任何权限都会被分配给任何通过系统验证的用户。在某些情况下，这非常有用；但在其他情况下，这可能会给你带来很多麻烦！在分配权限之前，请问自己：“我真的想让每个人对这个文件或目录都有这种访问权限吗？”\n\
  \n你可以使用 `ls –l` 命令来查看文件系统中任何文件或目录分配给这些实体的每个权限。考虑此处显示的示例：\n\n![Images](img/p0398-01.jpg)\n\
  \n显示的第一列是每个文件和目录的模式（mode）。第一个字符表示文件类型，它可以是普通文件 (-)、目录 (d)、套接字 (s)、链接 (l)、命名 (p)、块设备\
  \ (b) 或字符设备 (c)。如你所示，`Project_design.odt` 和 `Project_schedule.odt` 是普通文件，而 `Desktop`\
  \ 是目录。\n\n接下来三个字符是分配给条目所有者的权限。例如，`Project_schedule.odt` 为其所有者分配了 `rw–`（即用户 `ksanders`）。这意味着\
  \ `ksanders` 对该文件具有读和写权限，但没有执行权限。由于该文件不是可执行文件，因此不需要该权限。如果该文件是可执行的并且分配了执行权限，那么一个\
  \ `x` 将替换模式该部分的 `–`。由于所有者对文件有读写权限，`ksanders` 可以打开文件、编辑它并保存更改。\n\n接下来三个字符是分配给所属组的权限。在这种情况下，它是\
  \ `users` 组。系统上任何作为 `users` 组成员的用户都获得对 `Project_schedule.odt` 文件的 `r– –` 权限。这意味着他们拥有读取权限，允许他们打开文件并查看内容，但不允许对文件保存任何更改。\n\
  \n模式中的最后三个字符是分配给“其他”人员的权限，意味着系统上任何既不是所有者又不是所属组成员的合法验证用户。在这个示例中，这些用户也被分配了对 `Project_schedule.odt`\
  \ 文件的 `r– –` 权限，再次授予了他们读取访问的权限。\n\n在我们继续之前，你应该知道每个实体的权限也可以用数字表示。这是通过给每个权限分配一个值来实现的，如表\
  \ 11-2 所示。\n\n![Images](img/t0399-01.jpg)\n\n**表 11-2** 分配权限的数值\n\n使用这些值，你可以用一个数字表示分配给\
  \ `Owner`、`Group` 或 `Others` 的权限。只需将每个权限的值相加即可。例如，假设给 `Owner` 分配了文件的读写权限。要确定此分配的数值值，只需将读和写的值相加（4\
  \ + 2 = 6）。很多时候，你会看到文件或目录的模式用三个数字表示。考虑图 11-2 所示的示例。\n\n![Images](img/f0399-01.jpg)\n\
  \n**图 11-2** 用数值表示权限\n\n在这个示例中，相关的文件所有者具有读写权限 (6)，所属组具有读取权限 (4)，而其他人员也具有读取权限 (4)。使用\
  \ `ls –l` 命令，这种模式将表示为 `–rw–r– –r– –.`。\n\n那么，如果这些权限不正确，你该怎么办？你使用 `chmod` 工具来修改它们！让我们接下来讨论如何操作。\n\
  \n### 从命令行管理权限\n\n我意识到我听起来像在复读坏掉的唱胶机，但和本章中的大多数其他任务一样，你既可以通过图形界面修改，也可以从命令行修改权限。例如，使用\
  \ GNOME 桌面环境中的文件浏览器，你可以右键点击任何文件或目录，然后选择 `Properties | Permissions`。显示如图 11-3 所示的屏幕。\n\
  \n![Images](img/f0400-01.jpg)\n\n**图 11-3** 在文件浏览器中设置权限\n\n然后你使用 `Owner`、`Group`\
  \ 和 `Others` 的下拉列表来指定每个实体对文件或目录可以做什么。当你应用更改时，文件或目录的模式将更改以匹配你指定的设置。\n\n然而，对于你的 LPIC-1/Linux+\
  \ 考试，你必须能够使用命令行工具完成相同的任务。你使用 `chmod` 来修改权限。要做到这一点，你必须是文件的所有者或者以 `root` 身份登录。任何其他用户将不允许执行此操作。\n\
  \n`chmod` 可以可以使用不同的语法。第一种是在 shell 提示符输入 `chmod *entity*=*permissions filename`。在命令的\
  \ `entity` 部分，用 `u` 替换 `Owner`，用 `g` 替换 `Group`，用 `o` 替换 `Others`。在命令的 `permissions`\
  \ 部分，用 `r`、`w` 和/或 `x` 替换。例如，假设我想将 `contacts.odt` 的模式更改为 `–rw–rw–r– –`（赋予 `Owner`\
  \ 和 `Group` 读写权限，而赋予 `Others` 只有读取）。\n\n```\nchmod u=rw,g=rw,o=r contacts.odt\n\
  ```\n\n```\nchmod *entity*=*permissions filename*\n```\n\n```\nu\ng\no\n```\n\n\
  ```\nr\nw\nx\n```\n\n```\ncontacts.odt\n```\n\n你还可以使用 `chmod` 通过 `+` 或 `–` 符号来切换特定权限的开启或关闭。例如，假设我想关闭刚刚授予组的对\
  \ `contacts.odt` 文件的写权限。我可以在 shell 提示符输入 `chmod g–w contacts.odt`。当我这样做时，指定的权限会被关闭，如下所示：\n\
  \n![Images](img/p0400-02.jpg)\n\n如果我想重新开启该权限，我将输入 `chmod g+w contacts.odt`。你也可以分别替换\
  \ `u` 或 `o`，来修改所有者或其他人员对文件或目录的权限。\n\n最后，你也可以用 `chmod` 使用数值权限。这是我最常用的选项。你只需三个字符即可同时修改三个实体。要做到这一点，输入\
  \ `chmod *numeric_permission filename*`。\n\n```\nchmod 660 contacts.odt\n```\n\n\
  回到我们之前的示例，假设我想给 `Owner` 和 `Group` 授予读写权限，但移除 `Others` 的所有权限。这意味着 `Owner` 和 `Group`\
  \ 的权限将用数字表示为 6。因为 `Others` 没有获得任何权限，它的权限将表示为 0。我可以通过在 shell 提示符输入 `chmod 660 contacts.odt`\
  \ 来。当我这样做时，将进行相应的更改，如下所示：\n\n![Images](img/p0401-01.jpg)\n\n* * *\n\n![Images](img/tip.jpg)\n\
  \n**提示** 你可以使用 `chmod` 的 `R` 选项一次递归更改多个文件的权限。\n\n让我们在下面的练习中练习权限。\n\n### 练习 11-2：管理权限\n\
  \n在练习中，你将从 Linux 系统的 shell 提示符修改权限。你为你假设的研究团队创建一个设计文档，并修改其权限以控制访问。你可以使用随书提供的虚拟机进行此练习。运行快照\
  \ 11-2 以获得正确配置的环境。\n\n* * *\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 11-2 视频以了解如何执行此任务。\n\
  \n完成以下操作：\n\n1. 验证你已登录系统。\n\n\n\n\n2. 如果必要，使用 `su –` 命令并输入密码 `student` 切换到你的 root\
  \ 用户账户。\n\n3. 在 shell 提示符处输入 `cd /RandD` 切换 `/RandD` 目录。\n\n4. 为你的团队创建一个设计文档，并通过以下步骤限制对其访问：\n\
  \n   a. 在 shell 提示符输入 `touch design_doc.odt` 创建一个名为 `design_doc.odt` 的新文件。\n   b.\
  \ 在 shell 提示符输入 `ls –l`。注意 root 用户账户和 root 组（group）是新文件的所有者。\n   c. 使用 `chown` 命令将文件的所有权更改为你学生账户和研究组（research\
  \ group）。\n   d. 再次在 shell 提示符输入 `ls –l`。验证目录的所有权已更改为你的学生账户和研究组。注意所有者（Owner）对文件具有\
  \ `rw–` 权限，而组（Group）仅具有 `r--` 权限。\n   e. 在 shell 提示符输入 `chmod g+w design_doc.odt`\
  \ 为组授予 `rw–` 权限。\n   f. 再次在 shell 提示符输入 `ls –l`。注意所有者和组现在都对文件具有读写权限。\n   g. 注意其他人（Others）对文件具有读取权限。你需要保持此文档机密，因此在\
  \ shell 提示符输入 `chmod 660 design_doc.odt` 移除此访问权限。\n   h. 再次输入 `ls –l`。验证其他人对此文件没有权限。\n\
  \n5. 接下来，你需要使用权限控制对研究目录本身的访问。执行以下操作：\n\n   a. 在 shell 提示符输入 `cd ..`。\n   b. 在 shell\
  \ 提示符输入 `ls –l`。注意所有者对 `RandD` 目录具有完全访问权限，但组缺少对目录的写权限。同样注意其他人可以读取目录内容 (`r`) 并可以进入目录\
  \ (`x`)。\n   c. 在 shell 提示符输入 `chmod 770 RandD` 为组授予目录的完全访问权限，并完全移除其他人对目录的访问。\n\
  \   d. 在 shell 提示符输入 `ls –l`。验证所有者和组具有完全访问权限，而其他人没有访问权限。\n\n接下来，让我们讨论如何与默认权限工作。\n\
  \n### 使用默认权限\n\n你可能已经注意到，在我们完成此书中的练习和示例时，每当你在文件系统中创建新文件或目录时，系统都会自动分配一组默认权限，而无需你对其进行任何干预。\n\
  \n默认情况下，Linux 在文件系统中创建的每个文件时，都会为其分配 `rw–rw–rw–` (`666`) 权限。它还会为在文件系统中创建的每个目录分配 `rwxrwxrwx`\
  \ (`777`) 权限。然而，这些并不是文件或目录最终实际拥有的权限。让我们来看一个例子。\n\n假设 ksanders 在她的家目录下创建一个名为 `revenue`\
  \ 的新目录，并在 `revenue` 目录中创建一个名为 `projections.odt` 的文件。根据我们刚刚讨论的内容，`revenue` 目录的模式应为\
  \ `rwxrwxrwx`，而 `projections.odt` 文件的模式应为 `rw–rw–rw–`。然而，事实并非如此，如下所示：\n\n![Images](img/p0402-01.jpg)\n\
  \n注意 `revenue` 目录的模式为 `rwxr–xr–x` (`755`)。这意味着目录所有者对目录具有读、写和执行权限。组和其他人对目录具有读取和执行权限。同样，注意\
  \ `projections.odt` 文件的模式为 `rw–r––r–` (`644`)。所有者具有读写权限，而组和其他仅具有读取权限。\n\n这些并不是 Linux\
  \ 应该分配的默认权限！为什么会这样？这是因为默认权限太宽松了。想一下，默认目录模式将允许系统上的任何人进入任何目录并删除他们想要的任何文件！同样，默认文件模式将允许系统上的任何用户修改你创建的文件。这真是一场噩梦！\n\
  \n为了增加系统的整体安全性，Linux 使用一个名为 `umask` 的变量，每当文件系统中创建文件或目录时，自动从默认模式中移除权限。`umask` 的值是一个三位数数字，所示（忽略第一个\
  \ 0）：\n\n![Images](img/p0403-01.jpg)\n\n对于大多数 Linux 发行版，`umask` 的默认值为 `022`。每个数字都代表一个要被*移除*的数值权限值。第一个数字指的是——你猜对了——所有者，第二个指的是组，最后一个指的是其他人。因为所有者处列出的是\
  \ 0，所以不会从文件或目录所有者的默认模式中移除任何权限。但是，由于组和其他处列出的是 2，因此每当文件系统中创建文件或目录时，都会从默认模式中移除写权限。`umask`\
  \ 的功能见图 11-4。\n\n![Images](img/f0403-01.jpg)\n\n**图 11-4** umask 的工作原理\n\n`umask`\
  \ 的默认值适用于大多数 Linux 管理员。然而，可能在某些情况下，你需要在文件系统创建文件或目录时收紧或放宽分配的权限。为此，你可以更改分配给 `umask`\
  \ 的值。\n\n这可以通过两种实现。首先，如果你只需要对 `umask` 进行临时更改，可以在 shell 提示符处输入 `umask value`。例如，如果你想在创建新目录时移除自动分配给其他人的执行权限可以输入\
  \ `umask 023`。这将从组移除写权限 (2)，并从其他人移除写权限 (2) 和执行权限 (1)。如下所示：\n\n![Images](img/p0404-01.jpg)\n\
  \n注意，由于更改了 `umask` 值，创建目录时从其他人移除了执行权限 (`x`)。\n\n这种修改 `umask` 的方法非常有效；但它不是持久的。如果你重启系统，`umask`\
  \ 将恢复到原始值。这是因为 `umask` 的值每次系统启动时都会使用 `/etc/profile` 文件或 `/etc/login.defs` 文件中的 `umask`\
  \ 参数设置，取决于你的发行版。\n\n如果你想让你对 `umask` 的更改永久，只需在文本编辑器中编辑相应的配置文件并将 `umask` 值设置为你需要的值即可。\n\
  \n接下来，让我们看看特殊权限。\n\n### 使用特殊权限\n\n你通过权限完成的大多数任务将是读、写和执行权限。然而，你为文件系统中的文件和目录分配几种其他特殊权限。这些见表\
  \ 11-3。\n\n![Images](img/t0405-01.jpg)\n\n**表 11-3** 特殊权限\n\n这些特殊权限作为额外的数字添加到文件或目录模式的*开头*来引用。与普通权限一样，每个特殊权限都有一个分配的数值，如下所示：\n\
  \n![images](img/bull.jpg) SUID: 4\n\n![images](img/bull.jpg) SGID: 2\n\n![images](img/bull.jpg)\
  \ 滞位位 (Sticky Bit): 1\n\n你可以 `chmod` 为文件或目录分配这些特殊权限。只需在模式开头添加一个额外的数字，引用你想与文件或目录关联的特殊权限即可。\n\
  \n\n\n\n例如，假设你想对一个名为 `runme` 的文件应用 SUID 和 SGID 权限，该文件应对所有者（Owner）和组（Group）读取并执行。你可以在\
  \ shell 提示符输入 `chmod 6554 runme`。这指定了文件分配了 SUID (4) 和 SGID (2) 权限（第一位数字总和 6）。它还指定所有者和组拥有读（4）和执行（1）权限（第二和第三位数字总和\
  \ 5）。它还允许其他用户（Others）读取（4）该文件，但不能修改或运行它（最后一位数字总和 4）。\n\n让我们在下面的练习中练习管理默认和特殊权限。\n\
  \n### 练习 11-3：管理默认和特殊权限\n\n在此练习中，你将练习使用 `umask` 修改默认权限并创建文件。你还将练习为目录添加特殊权限。你可以使用书中附带的虚拟机进行此练习。运行快照\
  \ 11-3 以获得配置正确的环境。\n\n* *\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 11-3 视频，演示如何执行此任务。\n\
  \n完成以下操作：\n\n1. 验证你已登录系统。\n2. 如有必要，使用 `su –` 命令和密码 `student` 切换到 root 用户账户。\n3.\
  \ 在 shell 提示符输入 `cd /RandD` 进入 `/RandD` 目录。\n4. 你需要在 `RandD` 目录中创建几份研发文档。然而，你需要确保这些文档不被他人窥探。回想上一个练习中，当你在创建文件时，系统会自动授予“其他用户”读取权限。你不希望发生这种情况。你需要让“其他用户”对创建的任何文档没有任何访问权限。执行以下操作：\n\
  \n   a. 在 shell 提示符输入 `umask 027` 修改默认权限。\n   b. 在 shell 提示符输入 `umask` 验证 `umask`\
  \ 的值。它应该显示为 0027。\n   c. 在 shell 提示符输入 `touch schedule.odt` 创建名为 `schedule.odt`\
  \ 的新文件。\n   d. 在 shell 提示符输入 `ls –l`。验证所有者拥有 rw–，组拥有 r--，其他用户拥有 – – – 权限。\n\n5.\
  \ 在之前的一个练习中，我们授予了 `RandD` 目录所有者和组 rwx 权限。然而，拥有目录的写权限允许研究组中的任何人删除目录中的任何文件。我们希望配置目录，使研究组中的用户只能删除他们实际拥有的文件。执行以下操作：\n\
  \n   a. 在 shell 提示符输入 `cd /`。\n   b. 在 shell 提示符输入 `chmod 1770 RandD` 为 `RandD`\
  \ 目录添加粘滞位（Sticky Bit）权限。\n   c. 在 shell 提示符输入 `ls –l`。注意 `RandD` 目录模式的其他部分最后一位添加了一个\
  \ `T`。这表示粘滞位已设置：\n\n![Images](img/p0406-01.jpg)\n\n6. 通过以系统中的不同用户登录并测试权限允许和不允许你做什么，来对你刚刚添加的新权限进行实验。\n\
  7. 在练习 9-1 中，我们创建了一个名为 `dtracy` 的用户。然而，因为我们在创建他时没有使用 `-m` 选项，他没有主目录。利用你所学的知识，执行以下操作：\n\
  \n   a. 在 `/home` 为 `dtracy` 创建适当的主目录。\n   b. 查看其他主目录并确定应该分配的所有权和权限。\n   c. 使用命令行工具为\
  \ `dtracy` 的主目录设置所有权和权限。\n   d. 完成后运行 `pwck` 以验证账户配置正确。\n\n让我们通过讨论磁盘配额来结束本章。\n\n\
  ## 管理磁盘配额\n\n在管理 Linux 系统时，磁盘配额是一项非常有用的管理工具。这里的问题在于，由于 Linux 是多用户系统，一个或两个用户可能会完全垄断文件系统中所有的可用磁盘空间。这在当今的网络化世界中尤为严重，用户正从互联网下载大型音乐文件甚至更大的电影。你如何防止这些用户消耗超过其公平份额的磁盘空间？你使用磁盘配额。\n\
  \n简单来说，磁盘配额为系统上的用户建立了空间限制。你可以指定每个用户仅允许使用特定数量磁盘空间或 inode（即配额）。用户不允许超过此配额。\n\n要在你的\
  \ Linux 文件系统上实现配额，你首先需要在系统上安装 `quota` 软件包。某些发行版（特别是服务器发行版）会将此包作为基础安装的一部分。然而，大多数发行版要求你在系统设置后单独安装它。要检查系统是否已安装\
  \ quota，请在 shell 提示符输入 `rpm –qi quota`。如果没有安装，请使用 `rpm` 或另一个适当的包管理工具进行安装。\n\n一旦安装包，完成以下操作以建立配额：\n\
  \n1. 打开终端会并使用 `su` 切换到 root 用户账户。\n2. 通过以下操作配置你的挂载文件系统以使用配额：\n\n   a. 在文本编辑器中打开你的\
  \ `/etc/fstab` 文件。\n   b. 为想要建立配额的文件系统的挂载选项中添加 `usrquota` 和 `grpquota` 参数。在接下来的示例中，已为\
  \ `/` 文件系统建立了配额：\n\n![Images](img/p0407-01.jpg)\n\n   c. 保存文件更改并退出编辑器。\n   d. 重启系统以使更改生效。\n\
  \n3. 系统重启后，通过以下操作创建配额文件：\n\n   a. 打开终端会话并使用 `su` 切换到 root 用户账户。\n   b. 在 shell 提示符输入\
  \ `quotacheck –amvug`。\n\n`quotacheck` 工具用于扫描文件系统的磁盘使用情况并创建配额文件。`quotacheck` 使用的选项执行以下操作：\n\
  \n![images](img/bull.jpg) `-a` 检查所有挂载的文件系统\n![images](img/bull.jpg) `-m` 强制对挂载的文件系统进行检查\n\
  ![images](img/bull.jpg) `-u` 检查用户\n![images](img/bull.jpg) `-g` 检查组\n![images](img/bull.jpg)\
  \ `-v` 以详细模式运行\n\n当 `quotacheck` 完成时，挂载文件系统的挂载点应该创建两个名为 `aquota.user` 和 `aquota.group`\
  \ 的文件，如下：\n\n![Images](img/p0408-01.jpg)\n\n4. 在 shell 提示符输入 `quotaon –av` 在你的文件系统上启用配额。\n\
  5. 在 shell 提示符输入 `repquota –av` 查看用户当前使用的磁盘空间。屏幕上显示一份报告，显示每个用户消耗了多少空间，如下：\n\n![Images](img/p0408-02.jpg)\n\
  \n注意在该报告中，没有为任何用户配置限制。\n\n6. 通过以下操作为你的用户创建磁盘配额：\n\n   a. 在 shell 提示符输入 `edquota\
  \ –u username`。将显示一个与下方所示 `rtracy` 用户类似的屏幕：\n\n![Images](img/p0409-01.jpg)\n\n在例例中，正在为\
  \ `rtracy` 设置配额。注意配额文件已在 vi 编辑器中打开。还注意你可以为块（blocks）和 inode 设置硬配额和软配额。软配额是可以临时超过的配额。硬配额是不允许超过的。块配额指定用户可以消耗磁盘块数量。inode\
  \ 配额指定用户可以拥有的文件数量。\n\n   b. 使用 vi 编辑器设置块和/或 inode 的软、硬配额。\n   c. 保存更改并退出编辑器。\n \
  \  d. 为你的每个用户重复此过程。\n\n* * *\n\n![Images](img/tip.jpg)\n\n\n\n\n**提示** 你可以输入 `edquota\
  \ –p source_user destination_user` 将配额从一个用户复制到另一个。\n\n### 7. 通过以下步骤为组创建磁盘配额：\n\n\
  a. 在 shell 提示符下，输入 `edquota –g groupname`。\n\nb. 使用 `vi` 编辑器设置块和/或 inode 的软配额和硬配额。\n\
  \nc. 保存更改并退出编辑器。\n\n### 8. 在前面的步骤中，你为块和/或 inode 创建了软配额。默认值是允许用户超出其软配额的时间上限为七天。这就是*宽限期*。你可以通过以下步骤对其进行更改：\n\
  \na. 在 shell 提示符下，输入 `edquota –t`。将显示如下内容：\n\n![Images](img/p0409-02.jpg)\n\nb.\
  \ 编辑你的宽限期设置。\n\nc. 保存更改并退出 `vi`。\n\n### 9. 在 shell 提示符下输入 `repquota –av` 来检查你的新配额。你现在应该可以看到为用户建立的配额。在接下来的示例中，已为\
  \ `rtracy` 用户建立了配额：\n\n![Images](img/p0409-03.jpg)\n\n你的系统现在受到受磁盘空间占用者的保护了！让我们在下面的练习中练习建立磁盘配额。\n\
  \n### 练习 11-4：建立磁盘配额\n\n在本次练习中，你将在你的 Linux 系统上练习实现磁盘配额。你可以使用书中附的虚拟机进行此练习。运行快照 11-4\
  \ 以获得配置正确的环境。\n\n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 11-4 视频，以演示如何执行此任务。\n\
  \n完成以下操作：\n\n1. 验证你已登录系统。\n\n2. 如有必要，使用 `su –` 命令和密码 `student` 切换到 root 用户账户。\n\n\
  3. 通过以下步骤配置你的挂载文件系统以使用配额：\n\n   a. 用文本编辑器打开你的 `/etc/fstab` 文件。\n\n   b. 为 `/` 文件系统的挂载选项添加\
  \ `usrquota` 和 `grpquota` 参数。\n\n   c. 保存文件更改并退出编辑器。\n\n   d. 重启系统以使更改生效。\n\n4.\
  \ 系统重启后，通过以下步骤创建你的配额文件：\n\n   a. 打开终端会话并使用 `su –` 命令切换到 root 用户账户。\n\n   b. 在 shell\
  \ 提示符下，输入 `quotacheck –amvug`。\n\n5. 当 `quotacheck` 完成时，`/` 下应该已创建名为 `aquota.user`\
  \ 和 `aquota.groups` 的两个文件。\n\n6. 在 shell 提示符下输入 `quotaon –av` 启用文件系统上的配额。\n\n7.\
  \ 在 shell 提示符下输入 `repquota –av` 查看用户当前使用的磁盘空间。屏幕上将显示一份报告，显示每个用户消耗多少空间。注意，没有为任何用户配置限制。\n\
  \n8. 通过以下步骤为你的用户创建磁盘配额：\n\n   a. 在 shell 提示符下，输入 `edquota –u student`。\n\n   b.\
  \ 使用 `vi` 编辑器设置以下内容：\n\n      ![images](img/bull.jpg) 块硬配额：15000\n\n      ![images](img/bull.jpg)\
  \ 块软配额：10000\n\n      ![images](img/bull.jpg) Inode 硬配额：1000\n\n      ![images](img/bull.jpg)\
  \ Inode 软配额：800\n\n   c. 保存更改并退出编辑器。\n\n   d. 对其他用户重复此过程。\n\n9. 在 shell 提示符下输入 `repquota\
  \ –av` 检查你的新配额。你现在应该可以看到为用户建立的配额。\n\n10. 输入 `exit` 退出 root 用户账户。\n\n11. 验证你是否是以已设置配额的用户账户登录的。\n\
  \n12. 在 shell 提示符下输入 `time dd if=/dev/zero of=bigfile.bin bs=1024 count=10000` 创建一个大文件。你应该会看到一个指示配额已超出的错误。\n\
  \n你现在是处理 Linux 用户、组和权限的专家了！\n\n### 总结\n\n在本章中，我们讨论了所有权、权限和配额。我指出，用户和组只控制谁可以访问系统。它们并不控制用户可以对文件系统中的文件或目录做什么。为了实现这一点，我们需要实现所有权和权限。\n\
  \n我指出，每当用户创建文件或目录时，该用户会被自动分配为其所有者。此外，用户所属的组成为该文件或目录的组所有者。这些默认值是可以更改的；但你必须以 root\
  \ 登录才能更改文件或目录的所有者，或者以其所有者的身份登录以更改组。\n\n要修改所有权，你使用 `chown` 命令。该命令可以更改文件或目录的所有的用户和或组。如果你只想更改组，也可以使用\
  \ `chgrp` 命令。\n\n我接着指出，仅凭所有权无法控制用户对文件和目录的访问。要完全控制访问，你需要 Linux 文件系统权限。权限定义了用户对给定文件或目录可以做什么和不能做什么。Linux\
  \ 使用以下权限：\n\n![images](img/bull.jpg) 读取\n\n![images](img/bull.jpg) 写\n\n![images](img/bull.jpg)\
  \ 执行\n\nLinux 将权限分配给以下实体：\n\n![images](img/bull.jpg) 所有者 (Owner)\n\n![images](img/bull.jpg)\
  \ 组 (Group)\n\n![images](img/bull.jpg) 其他 (Others)\n\n分配给所有者、组和其他人的权限共同组成了文件或目录的模式。我还强调了，Linux\
  \ 权限是累加的。如果一个用户既是所有者又是所有者组的成员，则该用户将获得分配给该文件或目录的所有者和组的权限。\n\n我接着指出，可以使用以下值对所有者、组和其他人的权限进行数值表示：\n\
  \n![images](img/bull.jpg) 读取：4\n\n![images](img/bull.jpg) 写：2\n\n![images](img/bull.jpg)\
  \ 执行：1\n\n通过相加分配给给定实体的每项权限，你可以用单个数字表示所有分配的权限。例如，值 7 表示已分配了所有权限。值 5 表示已分配了读取和执行权限。\n\
  \n我们随后讨论了 `chmod` 工具，它用于从 shell 提示符下管理权限。`chmod` 程序可以使用任何以下语法为所有者、组和/或其他人分配权限：\n\
  \n![images](img/bull.jpg) `chmod u=rw,g=rw,o=r *file_or_directory*`\n\n![images](img/bull.jpg)\
  \ `chmod u+rw,g+rw,o+r *file_or_directory*`\n\n![images](img/bull.jpg) `chmod 664\
  \ file_or_directory`\n\n在此处，我们开始讨论默认 Linux 权限。我指出，默认情况下，Linux 在创建时自动为新文件分配 rw–rw–rw–\
  \ 权限，为新目录分配 rwxrwxrwx 权限。然而，为了增加安全性，使用 `umask` 变量自动移除某些权限。默认 `umask` 值为 022，它在创建文件或目录时会移除组和其他人的写权限。我指出，可以通过在\
  \ shell 提示符下输入 `umask value` 来更改 umask 的值。\n\n我们简要讨论了你可以分配的特殊权限，包括：\n\n![images](img/bull.jpg)\
  \ SUID: 4\n\n![images](img/bull.jpg) SGID: 2\n\n![images](img/bull.jpg) 粘滞位 (Sticky\
  \ Bit): 1\n\n我指出，你通过在命令中使用上述值的所有者数字之前添加一个额外数字来使用 `chmod` 分配这些权限。\n\n\n\n\n在本章的最后，我们讨论了如何实现磁盘配额。我指出，磁盘配额用于防止用户占用过多的磁盘空间。要实现配额，你必须首先在你的\
  \ Linux 系统上安装 `quota` 软件包。然后，我们回顾了为挂载的文件系统设置配额的步骤。我指出，你可以为用户允许消耗的块数（磁盘空间）和/或用户可能消耗的\
  \ inode 数量（文件数量）设置配额。对于这两个参数，你都可以设置 `hard`（硬限制）和 `soft`（软限制）限制。用户可以在你定义的 `grace\
  \ period`（宽限期）时间内临时超过软限制。但用户不能超过硬限制。你可以在 shell 提示符处输入 `repquota –av` 命令来查看显示硬限制、软限制以及当前用户空间使用情况的报告。\n\
  \n### 加速复\n\n![images](img/bull.jpg) 所有权定义了文件系统中哪个用户和组拥有特定的文件或目录。\n\n![images](img/bull.jpg)\
