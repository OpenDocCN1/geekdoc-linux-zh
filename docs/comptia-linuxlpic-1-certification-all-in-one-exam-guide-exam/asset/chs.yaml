  \n## Questions\n\n**1.** 下哪项在显示器上绘制图形窗口？\n\n**A.** KDE\n**B.** fvwm\n**C.** sawfish\n\
  **D.** X.org\n\n**2.** 你的 Linux 系统使用 X.org 作为其 X 服务器。使用哪个配置文件来配置此服务？\n\n**A.** `/etc/X11/XF86Config`\n\
  **B.** `/etc/X11/x11.conf`\n**C.** `/etc/X11/XFree86.conf`\n**D.** `/etc/X11/xorg.conf`\n\
  \n**3.** 在 Fedora Linux 系统上你可以使用哪个工具来配置 X 服务器？\n\n**A.** `xf86config`\n**B.** YaST\n\
