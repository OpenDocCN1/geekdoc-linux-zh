  \ 是原始 GRUB 引导加载程序的更新版本。GRUB2 的工作方式与原始的 GRUB Legacy 引导程序完全不同。请注意，GRUB `1.98` 或更高版本实际上被认为是“GRUB2”。任何\
  \ `1.98` 以前的 GRUB 版本都被视为“GRUB Legacy”。你可以在 shell 提示符（以 root 身份）运行两个命令之一，查看你的特定 Linux\
  \ 系统使用的是哪个版本的 GRUB：\n\n![images](img/bull.jpg) \n`grub-install –v`\n\n![images](img/bull.jpg)\
  \ \n`grub2-install -v`\n\n这里显示了一个示例：![Images](img/p0187-01.jpg)\n\n熟悉 GRUB2 非常重要，原因有二：\n\
  \n![images](img/bull.jpg) 它是大多数当前 Linux 发行版使用的默认引导加载程序。\n\n![images](img/bull.jpg)\
  \ 它的工作方式与原始的 GRUB Legacy 引导程序完全不同。\n\n### GRUB2 \n\n与 GRUB Legacy 引导程序相比，GRUB2 使用了一套完全不同的配置文件。以下是\
  \ GRUB2 使用的配置文件：\n\n![images](img/bull.jpg) `/boot/grub/grub.cfg` 文件\n\n![images](img/bull.jpg)\
  \ `/etc/grub.d` 目录下的文件\n\n![images](img/bull.jpg) `/etc/default/grub` 文件\n\n当你使用\
  \ GRUB Legacy 引导程序时，所有的配置更改都在 `menu.lst` 文件中进行。在 GRUB2 中，没有 `menu.lst` 文件。它被 `/boot/grub2/grub.cfg`\
  \ 文件取代了。\n\n![Images](img/tip.jpg)\n**提示**：在某些发行版中，`grub.cfg` 文件位于 `/boot/grub`\
  \ 而不是 `/boot/grub2`。\n\n然而，与 `menu.lst` 文件不同，每当你进行配置更改并运行以下命令之一，`grub.cfg` 就会自动更新：\n\
  \n![images](img/bull.jpg) 某些发行版（如 Ubuntu）使用 `update-grub` 命令。\n\n![images](img/bull.jpg)\
  \ 其他发行版（如 openSUSE）使用 `grub2-mkconfig -o /boot/grub2/grub.cfg` 命令。\n\n你不应该直接编辑 `grub.cfg`。相反，当你需要更改\
  \ GRUB2 引导加载程序时，应该编辑相应的配置文件，然后运行 `update-grub` 或 `grub2-mkconfig` 命令。\n\n![Images](img/tip.jpg)\n\
  **提示**：对 GRUB2 引导加载程序进行任何配置更改后，必须运行 `update-grub` 或 `grub2-mkconfig`。在执行此操作之前，更改不会生效。\n\
  \n尽管 `grub.cfg` 与 `menu.lst` 相似，但它实际上并不包含 GRUB2 菜单信息。相反，它存储在 `/etc/grub.d` 目录下的几个文件中。`/etc/grub.d`\
  \ 中的所有文件都是可执行的脚本文件。如果你修改了其中一个文件并运行 `update-grub` 或 `grub2-mkconfig` 命令，`grub.cfg`\
  \ 文件将根据新的 GRUB 设置自动更新。因此，总之，`/etc/default/grub` 文件包含 GRUB 菜单配置设置，但 `/etc/grub.d`\
  \ 中的脚本文件才是你实际进行更改的文件。使用 `grub2-mkconfig` 命令创建 GRUB2 使用的配置文件的示例所示：![Images](img/p0188-01.jpg)\n\
  \n![Imags](img/note.jpg)\n**注意**：需要注意的 GRUB2 另一个方面是分区编号语法略有不同。在 GRUB Legacy 中，系统的第一块硬盘是\
  \ `hd0`，该硬盘上的第一个分区是 `hd0,0`。在 GRUB2 中情况不再如此。在 GRUB2 中，第一块硬盘仍然是 `hd0`。但是，硬盘上的第一个分区被分配的数字一而不是零。因此，在使用\
  \ GRUB2 时，第一块硬盘上的第一个分区将被引用为 `hd0,1` 而不是 `hd0,0`。\n\n### 分区编号和脚本结构\n\n如果你查看 `grub.cfg`\
  \ 文件的内容，你会发现它被分为许多部分。每个部分都文本 `###BEGIN` 开始，所示：![Images](img/p0189-01.jpg)\n\n每个部分都引用\
  \ `/etc/grub.d` 目录中的一个特定脚本，该脚本是由 `update_grub` 或 `grub2-mkconfig` 命令生成的。当你查看 `/etc/grub.d`\
  \ 内的文件时，你会发现它们通常以数字开头，所示：![Images](img/p0189-02.jpg)\n\n这种命名规范非常重要，因为菜单项在 `grub.cfg`\
  \ 文件中的位置是由 `/etc/grub.d` 中脚本文件名的数字顺序决定的。数字最小的文件首先由 `update-grub` 或 `grub2-mkconfig`\
  \ 命令执行。因此，在例例中，`00_header` 将首先运行，`10_linux` 将第二个运行，依此类推。任何使用非数字文件名的脚本文件在所有数字命名的文件运行之前之前不会运行。这会影响来自这些脚本文件的信息在\
  \ `/boot/grub2/grub.cfg` 中出现的顺序。\n\n让我们来看看 `grub.d` 中一些常用的脚本文件。请注意，你看到的脚本文件会因发行版而异。同样，你也可以向此目录添加你自己的脚本文件，但我们现在不会深入探讨脚本编写。那将在书的后面部分介绍。\n\
  \n*   **00_header**: 此文件为 GRUB2 引导菜单配置各种参数，例如初始外观、图形模式、默认选择、超时值等。\n*   **10_linux**:\
  \ 此文件识别安装在系统上的每个 Linux 内核。如果你安装了多个内核，`10_linux` 脚本将在你的启动文件夹中搜索并定位任何已安装的 Linux 内核。对于它找到的每一个，它都会创建一个单独的\
  \ GRUB 菜单项。\n*   **30_os-prober**: 该脚本搜索可能安装在你的系统上的任何其他操作系统。如果你只安装了 Linux，此脚本将定位你的\
  \ Linux 内核并创建菜单项。然而，如果你在同一系统上安装了 Linux 和 Windows，`30_os-prober` 将识别 Linux 以及安装的\
  \ Windows 操作系统并自动为每个创建一个 GRUB 菜单项。\n*   **40_custom**: 此文件设计用于自定义 GRUB 菜单的行为。基本上，它是用于插入到\
  \ `grub.cfg` 文件中的自定义菜单项模板。\n\n### grub.cfg 文件\n\n最后，我们需要查看 `/etc/default/grub` 。该文件包含了以前在原始\
  \ GRUB Legacy `menu.lst` 文件顶部部分包含的信息，所示：![Images](img/p0190-01.jpg)\n\n你可以编辑此文件并进行任何需要的更改，并在运行\
  \ `update-grub` 或 `grub2-mkconfig` 命令时将这些更改整合到 `grub.cfg` 中。此文件中包含多个参数可用于更改 GRUB\
  \ 的行为和外观：\n\n*   **GRUB_DEFAULT**: 此参数设置默认菜单项。例如，如果你配置了 `grub_default=0`，第一个菜单项变为默认菜单项。如果你设置了计时器且用户未选择，将自动选择第一个菜单项。你可以指定条目编号或条目标题。\n\
  *   **GRUB_SAVED DEFAULT**: 如果你将此参数设置为 `true`，GRUB 将从菜单中上次选择的操作系统作为下次启动时使用的默认操作系统。正如你所见，此参数可能会与\
  \ `grub_default` 参数产生冲突。因此，你可以使用其中一个，但不能两者都使用。\n\n\n\n\n\n![images](img/bull.jpg)\
  \ **GRUB_HIDDEN_TIMEOUT** `grub_hidden_timeout` 参数可用于使启动过程暂停并显示指定秒数的空白屏幕（如果配置了启动图像，则显示该图像）。在超时期结束后，系统将启动。`grub_hidden_timeout`\
  \ 参数决定了空白屏幕显示的时间（以秒为单位）。在屏幕空白期间，用户可以按 `SHIFT` 键显示菜单。如果你不希望他们拥有该选项，请将此参数设置为 0。如果你将其设置为空值，菜单将显示时间为由\
  \ `grub_timeout` 参数指定的秒数显示。\n\n![Images](img/note.jpg)\n\n**注意** GRUB2 的默认行为是，如果系统上只安装了一个操作系统，它实际上会隐藏菜单。如果你安装了两个操作系统，默认行为是显示包含两个操作系统条目的菜单。\n\
  \n![images](img/bull.jpg) **GRUB_HIDDEN_TIMEOUT_QUIET** 此参数与 `grub_hidden_timeout`\
  \ 参数配合使用。如果将其设置为 `true`，则不显示倒计时。如果将其设置为 `false`，则会在空白屏幕上显示一个计数器，持续时间为 `grub_hidden_timeout`\
  \ 指定的值。\n\n![images](img/bull.jpg) **GRUB_TIMEOUT** 此参数指定了用户在默认操作系统启动之前，从 GRUB 菜单中进行选择的时间（秒为单位）。如果你将此值设置为\
  \ -1，则禁用计时器，GRUB 将等待直到用户做出选择。\n\n![images](img/bull.jpg) **GRUB_CMDLINE_LINUX**\
  \ 此参数用于向内核传递选项。在 GRUB Legacy 引导加载程序中，这是通过在内核行尾添加选项来实现的。在 GRUB2 中，你可以使用 `grub_command\
  \ line_Linux` 参数来实现相同的操作。\n\n![images](img/bull.jpg) **GRUB_GFX MODE** 此参数设置 GRUB2\
  \ 显示的图形菜单的分率。如果需要，你还可以附加颜色深度。例如，如果你想让 grub 菜单使用 1440×900 的屏幕分辨率并使用 24 位色深，则可以将此参数设置为\
  \ 1440×900×24。你实际上可以使用此参数指定多个分辨率。先列出你偏好的屏幕分辨率，然后是一个逗号，然后是第二个，然后是逗号，以此此类推。GRUB2 将首先尝试使用第一个分辨率。如果视频显示支持该分辨率，将使用它并忽略其他。如果不支持，GRUB\
  \ 将移动到第二个分辨率，并继续在列表中查找，直到找到一个可以使用的为止。如果此参数被注释掉，或者指定的分辨率不支持，GRUB2 将使用 `/etc/grub.d/00_header`\
  \ 文件中指定的默认图形模式设置。\n\n![images](img/bull.jpg) **GRUB_INIT_TUNE** 你可以使用此参数在 GRUB2\
  \ 菜单显示之前播放单声蜂鸣。语法是输入等号，然后是一个引号，然后三个数字。第一个数字是使用的节奏。第二个数字是曲调的音高。第三个数字是曲调的持续时间。以结束引号结束参数。\n\
  \n![images](img/bull.jpg) **GRUB_BACKGROUND** 此参数设置 GRUB2 菜单使用的背景图像。\n\n![images](img/bull.jpg)\
  \ **GRUB_DISABLE_OSPROBER** 将此参数设置为 `true` 将禁用 `osprober` 检查。此功能查找硬盘上带有其他操作系统（如\
  \ Windows 或其他 Linux 发行版）的分区。\n\n### 练习 6-2：使用 GRUB2\n\n在本次练习中，你将练习自定义你的 GRUB2 菜单。你可以使用书中附带的虚拟机进行此练习。运行快照\
  \ 6-2 以正确配置的环境。\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 6-2 视频演示如何执行此任务。\n\n\
  完成以下操作：\n\n1. 启动你的 Linux 系统并以学生用户密码 `student` 登录。\n2. 打开终端会话。\n3. 输入 `su –` 后输入\
  \ root 用户密码（`student`）切换到 root 用户账户。\n4. 在 shell 提示符处输入 `vi /etc/default/grub`。\n\
  5. 将 `GRUB_TIMEOUT` 值更改为 15 秒。\n6. 将 `GRUB_DEFAULT` 参数更改为在用户在超时范围内未选择时自动加载第一个菜单条目。\n\
  7. 保存更改并退出 vi 编辑器。\n8. 在提示符处输入 `grub2-mkconfig -o /boot/grub2/grub.cfg` 以应用更改。\n\
  9. 重启系统并验证更改已应用。\n\n### 使用 init 管理运行级别 (Runlevels)\n\n如果你以前用过 Linux，你可能听过 *runlevel*（运行级别）这个术语。在本章中，我们将回顾什么是运行级别以及如何管理它。使用\
  \ systemd 的发行版使用目标（targets）而不是运行级别。我们稍后会讨论 systemd。\n\n#### 运行级别的工作原理\n\n要管理 Linux\
  \ 系统，你需要对运行级别的工作有良好的理解。在本章中，我们将讨论：\n\n#### 什么是运行级别？\n\n运行级别究竟是什么？它听起来很复杂，但深入研究后其实并不复杂。*runlevel*\
  \ 代表你的 Linux 系统可以运行的几种模式之一。Linux 系统上的运行级别在许多方面与 Windows 系统的启动模式（startup mode）相似。如果你用过\
  \ Windows，你就知道在系统启动期间可以按 F8 键并选择一种启动模式。例如，如果你的 Windows 系统在某个设备或驱动上出现问题，你可以以安全模式启动它，这将以最少驱动程序集加载操作系统，以便你排除故障。\n\
  \nLinux 运行级别也一样。就像 Windows 启动模式一样，Linux 运行级别允许你指定你想让系统运行的模式。Linux 使用七种默认运行级别可选，如表\
  \ 6-3 所示。\n\n如表 6-3 所示，Linux 运行级别与 Windows 启动模式有许多不同。首先，切换到运行级别 0 实际上会停止系统，而切换到运行级别\
  \ 6 将重启系统。此外，你可以指定系统每次启动时进入的默认运行级别。你甚至可以在系统运行时动态地切换运行级别。\n\n#### 使用 /etc/inittab\
  \ 定义运行级别\n\n对于使用 init 的发行版，*init* 进程是你 Linux 系统上所有其他进程的祖父。它是内核在启动时运行的第一个进程，负责加载所有使\
  \ Linux 工作的其他系统进程。init 进程在 `/etc/inittab` 文件中配置。\n\n\n\n\n`inittab` 中定义的第一个参数指定了系统的默认运行级别（runlevel）。该参数的格式为\
  \ `id:5:initdefault`。此命令告诉 `init` 进程默认进入运行级别 5。请记住，运行级别 5 以多用户模式运行 Linux，并了网络并启用了\
  \ GUI 桌面。\n\n接下来，`inittab` 文件告诉 `init` 进程运行 `/etc/init.d/boot` 脚本：\n\n```\nsi::bootwait:/etc/init.d/boot\n\
  ```\n\n`bootwait` 参数告诉 `init` 执行此脚本，并在继续启动过程之前等待其完成。\n\n此外，`inittab` 文件还定义了每个运行级别下运行哪些\
  \ `init scripts`（init 脚本）。这是通过以下行来实现的：\n\n![Images](img/p0194-02.jpg)\n\n`inittab`\
  \ 文件中命令的语法为 `identifier:runlevel:action:command`。这些命令中指定的 `wait` 动作告诉 `init` 进程等待指定运行级别的脚本运行完毕后再继续。此外，请注意运行级别\
  \ 4 的定义被注释掉了。在我用过的每一个 Linux 发行版中，运行级别 4 都是未定义的。\n\n`/etc/inittab` 文件还定义了按下 CTRL-ALT-DEL\
  \ 组合键时应该发生什么。默认情况下，`inittab` 文件在按下这些键位时会导致系统重启，如下所示：\n\n```\nca::ctrlaltdel:/sbin/shutdown\
  \ -r -t 4 now\n```\n\n如果你想更改按下这些键位时的系统行为，只需使用文本编辑器编辑 `/etc/inittab` 并修改此行，以指定应该运行的命令。\n\
  \n***\n\n![Imags](img/caution.jpg)\n\n**注意** 在编辑 `inittab` 文件时务必非常小心。如果你犯了错误，你的系统可能无法启动。\n\
  \n在 `inittab` 示例中，还定义了单用户模式（S）：\n\n![Images](img/p0195-01.jpg)\n\n单用户模式在排排除系统问题时非常有用。当你进入单用户模式时，会运行\
  \ `/sbin/sulogin` 命令，允许你以 root 身份登录并修复任何阻止系统正常运行的问题。要在系统运行时进入单用户模式，在 shell 提示符处输入\
  \ `init S`。输入后，系统会提示你提供 root 用户密码。一旦输入该密码，你将获得单用户模式下系统的 root 权限。这在图 6-13 所示。\n\n\
  ![Images](img/f0195-01.jpg)\n\n**图 6-13** 进入单用户模式\n\n你也可以在系统启动时通过在 GRUB 菜单的 Boot\
  \ Options 字段输入 `S` 进入单用户模式。\n\n`inittab` 文件的下一个区块告诉 `init` 进程如果发生断电故障该做什么。根据故障性质，会运行\
  \ `/etc/init.d` 中不同的脚本文件：\n\n![Images](img/p0195-02.jpg)\n\n`inittab` 文件中还有一个区块，告诉\
  \ `init` 在登录时启动哪些运行级别的别的登录进程（称为 `Get TTY` 或 `getty` 进程），以提示用户输入用户名和密码。显示如下：\n\n\
  ![Images](img/p0195-03.jpg)\n\n如此示例所示，登录进程在运行级别 2、3、4（如果已定义）和 5 中创建。\n\n如果你对 `inittab`\
  \ 文件进行了任何更改，你需要告诉 `init` 更改已经发生，并且它需要重新读取配置。要做到这一点，在 shell 提示符处输入 `init q` 命令。\n\
  \n有了这些背景知识，你已经准备好学习如何管理系统的运行级别了。让我们接下来进行操作。\n\n# 管理运行级别和 init 脚本\n\n管理运行级别是 Linux\
  \ 系统管理的一个重要方面。你需要知道如何配置默认运行级别，以及指定在特定运行级别下自动启动哪些系统进程和服务（守护进程）。\n\n回想上一章，我提到过在安装新的\
  \ Linux 系统后我执行的第一件事之一就是检查并关闭所有自动运行的不需要的服务。这可以节省内存和 CPU 占用，还能堵住系统中的安全漏洞。在本章的这部分，我们将讨论如何实现。我们将涵盖以下主题：\n\
  \n![images](img/bull.jpg) 关于 init 脚本\n![images](img/bull.jpg) 配置默认系统运行级别\n![images](img/bull.jpg)\
  \ 从 shell 提示符更改运行级别\n![images](img/bull.jpg) 配置在指定运行级别下默认运行的服务\n\n让我们从学习 init 脚本开始。\n\
  \n## 关于 init 脚本\n\n你 Linux 系统上的系统进程通过 `init script` 启动和停止。init 脚本用于 `init` 进程在系统启动以及每当当前运行级别更改时启动进程。这些脚本存储在\
  \ Linux 系统的特定目录中。存储在哪个目录取决于你的 Linux 发行版。大多数 Linux 发行版使用两种类型的 init 脚本之一：\n\n![images](img/bull.jpg)\
  \ 使用 **System V** init 脚本的 Linux 发行版将它们存储在 `/etc/rc.d` 目录下。在 `/etc/rc.d` 内部有从 `rc0.d`\
  \ 到 `rc6.d` 的目录。这些目录与特定的运行级别相关。在 `/etc/rc.d` 内部有指向守护进程脚本的符号链接。\n\n![images](img/bull.jpg)\
  \ 使用 BSD  init 脚本的 Linux 发行版将它们存储在 `/etc/init.d` 目录下。在 `/etc/init.d` 内部有从 `rc0.d`\
  \ 到 `rc6.d` 的目录。与 System V 类似，这些目录与特定的运行级别相关。\n\n除了使用 `init` 进程运行这些脚本外，你还可以从命令行运行这些脚本。对于\
  \ BSD 风格，只需运行 `/etc/init.d/*script_name`；对于 System V 系统，则只需运行 `rc*script_name`。如果你不确定应该使用哪个脚本，可以使用\
  \ `ls` 命令列出脚本目录中的内容，如下：\n\n![Images](img/p0197-01.jpg)\n\n实际的脚本取决于你在系统上安装了哪些服务。每当你使用\
  \ `rpm` 工具在系统上安装服务时，相应的 init 脚本会自动安装在脚本目录中。此时，你可以直接从命令行执行任何脚本。BSD 系统的语法如下：\n\n```\n\
  /etc/init.d/script_name start | stop | restart\n```\n\n运行 脚本时可以使用以下参数：\n\n![images](img/bull.jpg)\
  \ **start** 使用此参数启动相关服务。\n![images](img/bull.jpg) **stop** 使用此参数停止相关服务。\n![images](img/bull.jpg)\
  \ **status** 使用此参数查看服务的状态，例如它是否正在运行。\n![images](img/bull.jpg) **restart** 使用此参数停止并启动相关服务。如果你对服务进行了大量的配置更改且需要重启以应用更改，这是一个非常实用的选项。\n\
  ![images](img/bull.jpg) **reload** 使用此参数重新读取服务的配置文件而不重启服务本身。并非所有守护进程都支持此选项。\n\n\
  例如，要运行 `smb` 服务，你在 shell 提示符处输入 `/etc/init.d/smb start`。要停止它，输入 `/etc/init.d/smb\
  \ stop`。要重启它，输入 `/etc/init.d/smb restart`。\n\n在某些发行版中（如 SUSE Linux），你还可以使用 `rc`\
  \ 脚本来启动、停止或重启服务进程，而无需指定文件的完整路径。语法为 `rc*script_name start | stop | restart`。例如，要启动\
  \ `smb` 服务，你可以在 shell 提示符处输入 `rcsmb start`。要停止它，可以输入 `rcsmb stop`。你也可以使用重启 选项来重启它。\n\
  \n\n\n\n当系统启动时，`init` 会运行在 `/etc/inittab` 中定义的、用于进入其正在启动的特定运行级别（runlevel）。例如，如果你的系统配置为启动到运行级别\
  \ 5，那么 `init` 将运行位于 `/etc/rc.d/rc5.d` 或 `/etc/init.d/rc5.d` 中的脚本，具体取决于你使用的发行版。典型的\
  \ openSUSE 系统的运行级别 5 脚本如图 6-14 所示。\n\n![Images](img/f0198-01.jpg)\n\n**图 6-14**\
  \  /etc/init.d/rc5.d` 中的 init 脚本\n\n如图 6-14 所示，实际启动和停止服务的真实脚本并不位于 `rc5.d` 子目录中。相反，`rc5.d`\
  \ 中的文件是符号链接，指向 `init` 目录（在本例中为 `/etc/init.d`）中的实际脚本文件。\n\n除了 `init` 脚本外，`/etc/init.d`\
  \ 或 `/etc/rc.d/init.d` 中还包含了其他几个你需要了解的重要脚本文件。这些文件列在表 6-4 中。\n\n![Images](img/t0199-01.jpg)\n\
  \n**表 6-4**  /etc/init.d 中的重要文件\n\n总结来说，`init` 进程在初始化 BSD 类型系统时完成以下任务：\n\n![images](img/bull.jpg)\
  \ 运行 `/etc/init.d/boot` 脚本以准备系统\n\n![images](img/bull.jpg) 处理 `/etc/inittab` 以确定适当运行级别和脚本\n\
  \n![images](img/bull.jpg) 运行 `/etc/init.d` 中相应运行级别目录下的脚本\n\n![images](img/bull.jpg)\
  \ 运行 `/etc/init.d/boot.local` 脚本\n\n在 System V 类型系统上，`init` 进程在启动系统运行时执行以下操作：\n\n\
  ![images](img/bull.jpg) 运行 `/etc/rc.d/sysinit` 脚本以准备系统\n\n![images](img/bull.jpg)\
  \ 处理 `/etc/inittab` 以确定适当运行级别和脚本\n\n![images](img/bull.jpg) 运行 `/etc/rc.d/` 中相应运行级别目录下的脚本\n\
  \n![images](img/bull.jpg) 运行 `/etc/rc.d/rc.local` 脚本\n\n### 配置默认系统运行级别\n\n正如你在本章前面的部分看到的，系统的默认运行级别指定在\
  \ `/etc/inittab` 文件中。你可以通过简单更改命令中的第二个值为你想要使用的运行级别来更改默认运行级别。例如，假设我想将系统从默认的运行级别 5\
  \ 更改为 3。我只需要在文本编辑器中打开 `/etc/inittab` 并值 `5` 改为 `3`。在保存文件并重启后，系统将启动到运行级别 3。\n\n除了在启动时更改运行级别外，你也可以在使用系统时动态更改它们。让我们接下来讨论一下如何操作。\n\
  \n### 从 Shell 提示符更改运行级别\n\n如果你认为更改默认运行级别很容易，那么动态更改运行级别就会更简单。这是通过 `init` 命令实现的。使用\
  \ `init` 的语法为 `init *runlevel*`。例如，如果我的系统运行在运行级别 5 且我想切换到运行级别 3，我只需要在 Shell 提示符处输入\
  \ `init 3`。在我输入命令后，系统将切换到运行级别 3，如图 6-15 所示。\n\n![Images](img/f0200-01.jpg)\n\n**图\
  \ 6-15** 动态切换到运行级别 3\n\n* *\n\n![Images](img/tip.jpg)\n\n**提示** 你必须在运行 `init` 命令之前切换到\
  \ root 用户账户。\n\n当你使用 `init` 命令更改运行级别时，`init` 进程会运行 `rc` 脚本并告诉它切换到相应的级别。`rc` 脚本读取\
  \ `/etc/inittab` 获取当前运行级别，并使用 `init` 目录中相应运行级别目录下的脚本停止与该运行级别相关的所有服务。然后，`rc` 脚本读取\
  \ `/etc/inittab` 并运行 `init` 目录新运行级别目录中的相应启动脚本。\n\n如果你查看你发行版 `init` 目录下的 `rc*x*.d`\
  \ 目录，你会看到每个系统进程对应两个脚本。一个以 *S* 开头，另一个以 *K* 开头。以 *S* 开头的脚本用于启动进程，而以 *K* 开头的脚本用于停止（杀死）进程。当\
  \ `init` 进程调用 `rc` 并发送一个要切换的运行级别时，`rc` 进程会运行相应 `rc*x*.d` 目录中的所有脚本，以根据进入的运行级别适当启动和停止服务。这些就是我们在上述在运行级别之间动态切换时所使用的脚本。\n\
  \n尽管我们把这些文件称为“脚本”，但它们并不是。它们实际上是指向你 init 脚本目录中真实脚本文件的符号链接。这使得更新你的 Linux 系统变得简单得多。如果每个\
  \ `init` 脚本都维护在每个 `rc*x*.d` 目录中，并且需要对某个服务应用更新，那么每个 `rc*x*.d` 目录中的每个 `init` 脚本都必须单独更新。那工作太大了！错误和不一致的可能性将是巨大的！\n\
  \n相反，由于各种 `rc*x*.d` 目录中的所有文件都指向 `init` 目录中该服务 `init` 脚本的唯一副本，因此任何需要应用的更新都可以对这一个文件进行。\n\
  \n`rc5.d` 目录中的脚本示例如图 6-14 所示。*S* 文件带有 `start` 参数调用其关联的 `init` 脚本，而 *K* 文件带有 `stop`\
  \ 参数调用其关联的 `init` 脚本。\n\n注意图 6-14，字母 *K* 或 *S* 后面跟着一个数字，然后是 `init` 脚本的名称。文件名中的数字非常重要。当\
  \ `init` 调用 `rc` 脚本切换运行级别时，`rc` 脚本首先查看当前运行级别的 `rc*x*.d` 目录，并将其与要切换到的系统运行级别的 `rc*x*.d`\
  \ 目录进行比较。如果当前运行级别的 `rc*x*.d` 目录中有该服务的杀死脚本，而新运行级别的 `rc*x*.d` 目录中也有该服务的启动脚本，则 `rc`\
  \ 脚本将保持该服务运行状态，因为它在两个运行级别中都应该是运行的。\n\n反，如果当前运行级别的 `rc*x*.d` 目录中有该服务的杀死脚本，但新运行级别的\
  \ `rc*x*.d` 目录中没有该服务的启动脚本，则 `rc` 脚本将运行杀死脚本以停止服务。相反，如果新运行级别的 `rc*x*.d` 目录中有该服务的启动脚本，而当前运行级别的\
  \ `rc*x*.d` 目录中没有该服务的启动脚本，则 `rc` 脚本将运行启动脚本以启动服务。\n\n杀死或启动脚本文件名中的数字在此生效。这个数字决定了脚本运行的顺序。这确保了其他服务依赖的服务先启动。例如，分配数字为\
  \ 01 的脚本将在分配数字为 02 的脚本之前运行。这意味着 `rc5.d` 中名为 S02network 的文件将在 S01dbus 之后但在 S03syslog\
  \ 之前运行。\n\n为了让这一点更清楚，让我们来看一个例子。假设你需要将系统从运行级别 3 切换到运行级别 5。以下是发生的情况：\n\n1. 你在 Shell\
  \ 提示符处输入 `init 3`（以 root 用户身份）。\n2. `init` 进程检查 `/etc/inittab` 配置文件，该文件通常指定运行 `/etc/init.d/rc`\
  \ 脚本，并告诉它切换切换到运行级别 5。\n3. `rc` 进程运行当前运行级别目录中的杀死脚本，适用于在新运行级别中应该禁用的任何服务。\n4. `rc`\
  \ 进程运行新运行级别目录中的启动脚本，适用于当前未运行但在新运行级别中应该运行的服务。\n\n* *\n\n![Images](img/note.jpg)\n\
  \n**注意** 如果你在 Shell 提示符处输入 `init 0` 或 `init 6`，系统将停止（init 0）或重启（init 6）。你也可以使用 `telinit`\
  \ 命令代替 `init` 来更改运行级别。其功能和语法相同。\n\n\n\n\n\n你还可以通过让引导加载程序将所需的运行级别（runlevel）作为内核选项发送给\
  \ Linux 内核来更改启动级别。例如，在某些发行版中，你只需在 GRUB 启动菜单的“启动选项”字段中将想要启动的运行级别作为最后一个参数添加。例如，在图\
  \ 6-16 中，数字 3 已作为最后一个启动选项添加。此数字被传递给 `init` 进程，并告诉 `init` 到哪个运行级别。\n\n![Images](img/f0201-01.jpg)\n\
  \n**图 6-16** 在启动时配置系统运行级别\n\n接下来，让我们回顾配置服务在特定运行级别运行的过程。\n\n### 配置服务在指定的运行级别下默认运行\n\
  \n如果你想配置系统服务在启动时自动运行，你必须将其与系统运行级别关联，并指定该服务的开启或关闭。\n\n每当你安装一个守护进程（无论是在系统安装期间还是使用\
  \ `rpm` 工具），init 脚本都会复制到你的 init 目录（`/etc/init.d` 或 `/etc/rc.d/init.d`）。你可以使用 `insserv`\
  \ 或 `chkconfig` 命令来配置每个 init 脚本关联到哪些运行级别。\n\n`insserv` 命令读取 init 脚本中 `INIT INFO`\
  \ 块的信息，以确定关联的服务默认在哪些运行级别运行。示例显示了 openSUSE 系统上 `ntp` init 脚本的 `INIT INFO` 块：\n\n\
  ![Images](img/p0202-01.jpg)\n\n如示例所示，`INIT INFO` 块为给定的 Linux 守护进程提供了几项关键信息：\n\n\
  ![images](img/bull.jpg) init 脚本管理的服务 (`Provides`)\n\n![images](img/bull.jpg) 在此服务启动之前必须启动的服务\
  \ (`Required-Start`)\n\n![images](img/bull.jpg) 守护进程应该运行的运行级别 (`Default-Start`)\n\
  \n![images](img/bull.jpg) 守护进程不应运行的默认运行级别 (`Default-Stop`)\n\n`Default-Start` 和\
  \ `Default-Stop` 参数用于 `insserv` 命令，以确定在哪些运行级别目录下创建相应的启动和停止脚本。使用前一个示例所示的 `INIT INFO`\
  \ 块，`insserv` 命令将在 `rc3.d` 和 `rc5.d` 目录下创建启动脚本链接，同时在 `rc1.d` 和 `rc2.d` 目录下创建停止脚本链接。\n\
  \n使用 `insserv` 的语法为 `insserv service_name.`。该命令根据服务 init 脚本 `INIT INFO` 块中 `Default-Start`\
  \ 指列出的运行级别启用指定的守护进程。它还根据 `INIT INFO` 块中 `Default-Stop` 指出的运行级别禁用该守护进程。\n\n`insserv`\
  \ 工具还可以用于禁用服务（从而移除各种 `rc*x*.d` 目录中该服务的所有链接）并停止当前运行的服务。此操作的语法为 `insserv –r service_name.`。\n\
  \n如果服务已经启用且你想更改它的默认运行级别，可以使用 `insserv` 来更改。执行以下操作：\n\n1. 在你的 init 脚本目录中打开相应的 init\
  \ 脚本，并编辑 `INIT INFO` 块中的 `Default-Start` 和 `Default-Stop` 参数。\n2. 将更改保存到文件。\n3.\
  \ 在 shell 提示符处输入 `insserv –d service_name`。\n\n执行后，`insserv` 命令会在各种 `rc*x*.d` 目录中重新创建相应的启动和停止脚本链接。\n\
  \n你也可以使用 `insserv` 启用守护进程，但完全忽略其 init 脚本中的 `Default-Start` 和 `Default-Stop` 参数。按照以下步骤操作：\n\
  \n1. 如果守护进程已在其默认运行级别下启用，请在 shell 提示符处输入 `insserv –r service_name` 移除所有启动和停止脚本链接。\n\
  2. 通过输入 `insserv service_name,start=*comma-separated_list_of_runlevels.` 创建新的自定义启动和停止脚本链接。例如，输入\
  \ `insserv ntp,start=3,5`。\n\n除了 `insserv` 之外，你还可使用 `chkconfig` 命令来管理守护进程的运行级别。如果你想查看服务的当前运行级别配置，在\
  \ shell 提示符处输入 `chkconfig –l daemon_name`。你也可以输入 `chkconfig –l` 来查看系统中安装的所有守护进程的状态。在接下来的示例中，使用\
  \ `chkconfig` 命令查看 `ntp` 守护进程的运行级别配置：\n\n![Images](img/p0203-01.jpg)\n\n在此所示，`ntp`\
  \ 服务未被配置在任何运行级别启动。如果你想配置守护进程在默认运行级别下启动，可以输入 `chkconfig daemon_name on`。你也可以使用 `chkconfig`\
  \ 命令精确指定你想让守护进程在哪些级别启动。例如，假设我们想让 `ntp` 守护进程在运行级别 3 和 5 下运行。通过输入 `chkconfig –s ntp\
  \ 35` 可以实现。这指定了 `ntp` 服务（由 `-s` 选项指定）在运行级别 3 和 5 启用。所示：\n\n![Images](img/p0203-02.jpg)\n\
  \n要禁用服务，输入 `chkconfig service_name off`。例如，要禁用之前启用的 `ntp` 服务，你需要输入 `chkconfig ntp\
  \ off`：\n\n![Images](img/p0203-03.jpg)\n\n你也可以通过简单输入 `chkconfig –l` 来查看系统中安装的所有服务的运行级别配置，如下所示：\n\
  \n![Images](img/p0203-04.jpg)\n\n让我们在下面的练习中练习 Linux 运行级别。\n\n### 练习 6-3：使用 Linux\
  \ 运行级别\n\n在此练习中，你将练习在 Linux 系统上操作运行级别。\n\n* * *\n\n![Images](img/note.jpg)\n\n**注意**\
  \ 此练习无法使用随书附的虚拟机完成。你必须使用使用 `init` 而非 `systemd` 的旧发行版来完成此练习。\n\n* * *\n\n![Images](img/viedo.jpg)\n\
  \n**视频** 请观看练习 6-3 视频查看如何执行此任务的演示。\n\n完成以下操作：\n\n1. 启动你的 Linux 系统并以标准用户登录。\n2. 打开终端会话。\n\
  3. 输入 `su –` 后跟你的 root 用户密码，切换到 root 用户账户。\n4. 通过以下操作在 shell 提示符处练习更改当前的运行级别：\n\n\
  \   a. 在 shell 提示符处输入 `runlevel` 查看你当前的运行级别。显示的第一个数字表示系统之前的运行级别；第二个数字表示系统当前的运行级别。\n\
  \n   如果你安装了图形化系统，你的当前运行级别应该是 5。如果你安装了基于文本的系统，当前运行级别应该是 3。如果你在第一个运行级别参数处看到 *N*，意味着系统从未处于过当前级别以外的任何运行级别。\n\
  \n   b. 在 shell 提示符处输入 `init 3` 切换到运行级别 3。\n   c. 提示时，以 root 用户身份登录。\n   d. 在 shell\
  \ 提示符处输入 `init 5` 切换回运行级别 5。\n   e. 重新登录系统。\n\n5. 通过以下操作将你的默认运行级别更改 3：\n\n   a.\
  \ 打开终端会话。\n   b. 在 shell 提示符处使用 `su` 命令切换到 root 。\n   c. 在 shell 提示符处输入 `vi /etc/inittab`。\n\
  \   d. 滚动到 `id:5:initdefault:.` 这一行。\n   e. 按 INSERT 键。\n   f. 将该行的数字 5 改为 3。\n\
  \   g. 按 ESC 键然后输入 `:exit`。\n   h. 在 shell 提示符处输入 `init 6` 重启系统。\n\n   你的系统应进入文本登录\
  \ shell。\n\n   i. 以 root 用户身份登录。\n   j. 在 shell 提示符处，使用 vi 编辑 /etc/inittab 将默认运行级别改回\
  \ 5。\n   k. 在 shell 提示符处输入 `init 0` 关机。\n   l. 重新开启电源并以普通用户身份重新登录系统。\n\n\n\n\n\n\
  ## 6. 在你的系统运行级别（runlevels）3 和 5 上启用 ntp 守护进程。ntp 守护进程用于将本地 Linux 系统的时与其他计算机系统的时同步。完成以下步骤：\n\
  \n**a.** 打开终端会并切换到 root 用户账户。\n\n**b.** 在 shell 提示符处，使用 `rpm` 工具通过输入 `rpm –q ntp`\
  \ 来验证系统是否已安装 `ntp` 软件包。如果 `rpm` 命令返回了包名和版本号，则已安装 `ntp`。如果如果没有返回任何内容，则说明未安装 `ntp`\
  \ 包。\n\n![Images](img/note.jpg)\n\n**注意** 如果未安装 `ntp` 软件包，请参考第 8 章中介绍的步骤从你的发行版 DVD\
  \ 安装该包。\n\n**c.** 在 shell 提示符处，输入 `vi /etc/ntp.conf`。\n\n**d.** 滚动到包含以下行：\n\n![Images](img/p0205-01.jpg)\n\
  \n**e.** 按 `INSERT`。\n\n**f.** 在 fudge 行下方添加新行。\n\n**g.** 在新行上添加以下指令：\n\n```\nserver\
  \ bigben.cac.washington.edu\n```\n\n该指令配置 `ntp` 服务将你的本地计算机时间与互联网上的 `bigben.cac.washington.edu`\
  \ 公共 ntp 服务器的时间同步。\n\n**h.** 按 `ESC`；然后输入 `:exit`。\n\n**i.** 在 shell 提示符处输入 `/etc/init.d/ntp\
  \ restart` 或 `/etc/rc.d/init.d/ntp restart` 来启动 `ntp` 服务。你应该能看到守护进程正在启动以及它正在从 `bigben.cac.washington.edu`\
  \ 获取时间的提示，如下：\n\n![Images](img/p0205-02.jpg)\n\n**j.** 在 shell 提示符处输入 `chkconfig\
  \ –s ntp 35` 配置 `ntp` 守护进程在运行级别 3 和 5 下自动启动。\n\n**k.** 在 shell 提示符处输入 `chkconfig\
  \ –l ntp` 检查 `ntp` 守护进程的状态。你应该看到运行级别 3 和 5 被设置为 `on`，如下：\n\n![Images](img/p0206-01.jpg)\n\
  \n考虑到这些，我们现在需要查看使用 `systemd` 代替 `init` 的 Linux 发行版。\n\n## 管理 Linux 启动目标（Boot Targets）\n\
  \n除了管理 Linux 系统几乎所有内容的传统 init 守护进程外，你还可以使用两种替代守护进程代替 `init` 来管理 Linux 上任务的启动和运行级别的管理：\n\
  \n![images](img/bull.jpg) Upstart\n\n![images](img/bull.jpg) systemd\n\nUpstart\
  \ 引入于 2000 年代中期，反响平平。其关键问题在于它与 `init` 非常不同，并且需要陡峭的学习曲线才能掌握。因此，只有极少数的 Linux 发行版在使用它。\n\
  \n然而，`systemd` 仅在几年前引入，它已几乎接管了一切。如今大多数 Linux 发行版已开始从 `init` 迁移到 `systemd`。与 Upstart\
  \ 一样，`systemd` 也是传统 `init` 守护进程的替代品。但与 Upstart 不同的是，`systemd` 可以作为 `init` 的无缝替换。如果你熟悉\
  \ `init`，迁移到 `systemd` 会少痛苦得多。\n\n`systemd` 的用处之一是它可以在系统启动时并行加载服务。传统的 `init` 进程按顺序方式逐个启动服务。并行启动服务可以大幅缩短系统启动并运行所需。`systemd`\
  \ 守护进程还支持快照，在必要时提供恢复系统状态的选项。\n\n由于其流行性，我们将在本章重点介绍 `systemd`。我们需要讨论以下主题：\n\n![images](img/bull.jpg)\
  \ 管理启动目标\n\n![images](img/bull.jpg) 管理服务\n\n考虑到这些，让我们先看看在运行 `systemd` 的 Linux 系统上如何管理运行级别。\n\
  \n### 管理启动目标\n\n如果你熟悉 `init` 下的运行级别，那么在 `systemd` 下操作运行级别将很容易理解。在 `systemd` 下，用于管理运行级别的命令是不同的，但概念是类似的。需要记住的关键点之一是\
  \ `systemd` 使用了“启动目标”（boot targets）的概念，其功能方式与运行级别类似。每个启动目标都由 `/usr/lib/systemd/system`\
  \ 中扩展名为 `.target` 的文件表示。在下面的列表中，显示了传统的 init 运行级别及其对应的 `systemd` 启动目标文件：\n\n![images](img/bull.jpg)\
  \ runlevel 3 = multi-user.target or runlevel3.target\n\n![images](img/bull.jpg)\
  \ runlevel 5 = graphical.target or runlevel5.target\n\n注意，每个运行级别有两个目标文件。请注意 `runlevel3.target`\
  \ 实际上只是指向 `multi-user.target` 文件的符号链接。同样，`runlevel5.target` 文件也是指向 `graphical.target`\
  \ 文件的符号链接。\n\n在使用 `systemd` 的系统上，你使用 `systemctl` 命令来管理服务和运行级别。与其使用 `init`、`chkconfig`\
  \ 或 `service`，不如使用 `systemctl` 来管理 `systemd` 系统的大多数方面。例如，要更改运行级别，运行 `systemctl`\
  \ 并指向特定的启动目标。语法为 `systemctl isolate *boot_target*.`。\n\n例如，如果我想切换到 systemd 等效于运行级别\
  \ 5，我可以输入以下命令之一：\n\n![images](img/bull.jpg) `systemctl isolate 5.target`\n\n![images](img/bull.jpg)\
  \ `systemctl isolate graphical.target`\n\n与传统的 init 进程一样，动态更改启动目标会改变当前的运行级别。如果你重启系统，它将进入默认运行级别。在\
  \ systemd 中，`etc/systemd/system/target` 文件控制启动目标。如你在下面的示例所示，此文件实际上是指指向以下内容的符号链接：\n\
  \n![Images](img/p0207-01.jpg)\n\n**注意** 某些使用 systemd 的发行版为了兼容性仍然保留了 `inittab` 文件。\n\
  \n要修改默认启动目标，你需要修改该符号链接指向的文件。这是通过 `systemctl set-default *boot_target*` 命令完成的。例如，要将默认启动目标设置为图形模式，你需要输入\
  \ `systemctl set-default graphical.target`。\n\n如果你想查看当前的运行级别，输入 `systemctl get-default`。此处显示示例：\n\
  \n![Images](img/p0207-02.jpg)\n\n现在让我们看看在运行 systemd 的 Linux 系统上如何管理服务。\n\n### 管理服务\n\
  \n在运行 systemd 的系统上，管理系统守护进程的方式与在 init 上非常相似。然而，使用的命令是不同的。如果你需要停止、启动、重启或查看系统上特定服务的状态，输入\
  \ `systemctl`，后接要执行的操作，然后是服务名称。使用以下语法：\n\n![images](img/bull.jpg) 启动服务，输入 `systemctl\
  \ start *service*.service`。例如，启动 ntp 守护进程，你需要输入 `systemctl start ntp.service`。\n\
  \n![images](img/bull.jpg) 停止服务，输入 `systemctl stop *service*.service`。例如，停止 ntp 守护进程，你需要输入\
  \ `systemctl stop ntp.service`。\n\n![images](img/bull.jpg) 重启服务，输入 `systemctl restart\
  \ *service*.service`。例如，重启 ntp 守护进程，你需要输入 `systemctl restart ntp.service`。\n\n![images](img/bull.jpg)\
  \ 检查服务状态，输入 `systemctl status *service*.service`。例如，检查 ntp 守护进程的状态，你需要输入 `systemctl\
  \ status ntp.service`。\n\n你还可以使用 `systemctl` 命令在系统启动时启用或禁用特定服务。你还可以检查它是否已启用。要执行这一点，你使用以下命令：\n\
  \n\n\n\n\n![images](img/bull.jpg) 要在系统启动时启用服务，请输入 `systemctl enable *service*.service`。例如，要在系统启动时启用\
  \ ntp 守护进程，你需要输入 `systemctl enable ntp.service`。\n\n![images](img/bull.jpg) 要在系统启动时禁用服务，请输入\
  \ `systemctl disable *service*.service`。例如，要在系统启动时禁用 ntp 守护进程，你需要输入 `systemctl disable\
  \ ntp.service`。\n\n![images](img/bull.jpg) 要检查服务是否在系统启动时已启用，请输入 `systemctl is-enabled\
  \ *service*.service`。例如，要检查 ntp 守护进程的状态，你需要输入 `systemctl is-enabled ntp.service`。\n\
  \n### 练习 6-4：操作 Linux 级别\n\n在此练习中，你将练习操作 Linux 系统的启动目标。你可以使用书中附带的虚拟机进行此练习。运行快照 6-2\
  \ 以获得正确配置的环境。\n\n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请收看 练习 6-4 视频，观看如何执行此任务的演示。\n\
  \n完成以下操作：\n\n1. 启动你的 Linux 系统，并使用密码 `student` 以学生用户身份登录。\n2. 打开终端会话。\n3. 通过输入 `su\
  \ –` 后输入你的 root 用户密码（`student`）切换到 root 用户账户。\n4. 通过以下步骤将你的默认启动目标更改为等同于运行级别 3：\n\
  \   a. 打开终端会话。\n   b. 在 shell 提示符下，使用 `su –` 命令切换到 root 用户账户。\n   c. 在 shell 提示符下，输入\
  \ `systemctl set-default multi-user.target`。\n   d. 在 shell 提示符下输入 `init 6` 重启系统。\n\
  \   注意，即使系统没有使用 init 守护进程，该命令仍然有效。你的系统应该启动到文本登录 shell。\n   e. 以 root 用户身份登录。\n \
  \  f. 在 shell 提示符下，使用 `systemctl` 命令将默认启动目标改回图形界面。\n   g. 在 shell 提示符下输入 `init 0`\
  \ 关闭系统。再次注意，即使系统没有使用 init 守护进程，该命令仍然有效。\n   h. 开启系统电源并以普通用户身份重新登录系统。\n5. 练习在系统启动时启用\
  \ ntp 守护进程。完成以下操作：\n   a. 打开终端会话并切换到 root 用户账户。\n   b. 在 shell 提示符下，输入 `vi /etc/ntp.conf`。\n\
  \   c. 滚动到包含以下内容的行：\n   ![Images](img/p0209-01.jpg)\n   d. 按 INSERT 键。\n   e. 在\
  \ fudge 行下方添加新行。\n   f. 在新行上添加以下指令：\n   `server bigben.cac.washington.edu`\n   该指令配置\
  \ ntp 服务，将你的本地计算机时间与互联网上的 bigben.cac.washington.edu 公共 ntp 服务器的时间同步。\n   g. 按 ESC\
  \ 键；然后输入 `:exit`。\n   h. 在 shell 提示符下输入 `systemctl start ntp.service` 启动 ntp 服务。\n\
  \   i. 在 shell 提示符下输入 `systemctl status ntp.service` 检查 ntp 守护进程的状态。\n\n让我们通过讨论如何关闭\
  \ Linux 系统来结束本章。\n\n### 关闭系统\n\n与任何其他操作系统一样，你需要正确地关闭 Linux 系统。这确保了在系统关电之前，任何挂起的磁盘写入操作都已提交到磁盘。\n\
  \n***\n\n![Imags](img/caution.jpg)\n\n**注意** 如果你意外关闭 Linux 系统，可能会导致你的文件系统出现损坏和不一致。请务必使用正确的关机程序。\n\
  \n即使系统没有使用 init 守护进程，该命令仍然有效。你需要正确地关闭 Linux 系统。你可以使用以下命令来正确关闭系统：\n\n![images](img/bull.jpg)\
  \ `init 0` 切换到运行级别 0\n![images](img/bull.jpg) `init 6` 切换到运行级别 6\n![images](img/bull.jpg)\
  \ `halt` 停止\n![images](img/bull.jpg) `reboot` 重启系统\n\n除了这些命令，你还可以使用 `shutdown` 命令来通知用户。`shutdown`\
  \ 的语法为 `shutdown +m –h|–r message`。`+m` 用于指定关机时间。`–h` 选项指定系统关机，而 `–r` 选项指定系统重启。使用\
  \ `shutdown` 的示例所示：\n\n```\nshutdown +10 –h 请保存工作并退出\n```\n\n当你输入此命令时，所有已登录的用户都会看到以下消息：\n\
  \n![images](img/p0210-01.jpg)\n\n如果你使用 `shutdown` 命令调度了关机，随后需要取消关机，请在 shell 提示符下输入\
  \ `shutdown –c`。\n\n你还可以使用 `wall` 命令向用户发送消息，通知他们系统重启。要使用 `wall`，你必须将消息发送到 `stdin`。示例所示：\n\
  \n![Images](img/p211-01.jpg)\n\n非常棒！你正在迈向 LPIC-1/Linux+ 认证之路！让我们回顾在本章中学的内容。\n\n\
  ### 章节回顾\n\n在本章中，你学习了如何管理 Linux 启动过程。我从本章开始回顾了 Linux 启动过程是如何工作的。我将启动分为三个阶段：\n\n\
  ![images](img/bull.jpg) BIOS 阶段\n![images](img/bull.jpg) 引导加载程序阶段\n![images](img/bull.jpg)\
  \ 内核阶段\n\n在 BIOS 阶段，计算机的 BIOS 芯片控制系统。它的主要工作是设置基础硬件、使用上电自检 (POST) 方案测试硬件，然后找到带有启动文件的设备。\n\
  \n在引导加载程序阶段，BIOS 将系统控制权交给引导加载程序。引导加载程序的关键工作是指向并加载你操作系统的内核。引导加载程序可以位于启动设备的主引导记录 (MBR)\
  \ 中，也可以位于磁盘上的启动分区中。\n\n\n\n\n\n在内核阶段，引导加载程序从硬盘或其他启动设备将操作系统加载到系统的内存 RAM 中。你的 Linux\
  \ 内核位于文件系统的 `/boot` 目录，命名为 `vmlinuz-*version*.gz`。内核加载完成后，在内核阶段会发生以下情况：\n\n![images](img/bull.jpg)\
  \ 内核使用你 BIOS 中的各种设置和 CMOS 芯片来初始化系统中的基础硬件。\n\n![images](img/bull.jpg) 内核搜索并使用 `initrd`\
  \ 或 `initramfs` 文件系统来运行 `linuxrc` 程序以设置系统。\n\n![images](img/bull.jpg) 当 `linuxrc`\
  \ 执行完毕后，`initrd` 或 `initramfs` 文件系统会被卸载，ramdisk 被销。\n\n![images](img/bull.jpg) 内核探测新硬件并加载相应的驱动模块。\n\
  \n![images](img/bull.jpg) 挂载真正的根（`/`）文件系统。\n\n![images](img/bull.jpg) 内核加载 `init`\
  \ 或 `systemd`进程。\n\n## Linux 引导加载程序\n\n然后，我们将注意力转向配置 Linux 引导加载程序。我们查看的第一个 Linux\
  \ 引导加载程序是 GRUB Legacy 引导加载程序。我指出，GRUB Legacy 引导加载程序曾被许多当前的 Linux 发行版使用多年。我指出 GRUB\
  \ 分为几个阶段：\n\n![images](img/bull.jpg) **第 1 **通常存储在 MBR 中。它指向第 1.5 阶段或第 2 阶段的位置。\n\
  \n![images](img/bull.jpg) **第 1.5 阶段**存储在 MBR 之后的 30KB 内。它指向第 2 阶段的位置。\n\n![images](img/bull.jpg)\
  \ **第 2 **存储在磁盘分区内。为终端用户提供一个菜单来选择启动的操作系统。\n\n我接着指出，用于配置 GRUB 的文件取决于你的发行版。某些发行版使用\
  \ `/boot/grub/grub.conf`；另一些则使用 `/boot/grub/menu.lst`。GRUB 将系统中的硬盘称为 `hd*x*`，其中\
  \ `x` 是系统中驱动器的编号。SCSI、SATA 和 IDE (PATA) 驱动器都以这种方式称呼。硬盘上的分区称为 `hd*x*,*y*`，其中 `y`\
  \ 是硬盘上的分区编号。\n\n如果你为文件系统中的 `/boot` 目录创建了单独的分区，GRUB 将使用此作为 GRUB 根，并在引用 `/boot/grub`\
  \ 内的文件时，不在路径中包含 `/boot`。如果你的 `/boot` 目录没有自己的分区，GRUB 将使用完整路径来引用 `/boot/grub/` 文件。\n\
  \nGRUB 的酷功能之一是它提供了交互式地管理启动过程的能力。你可以在系统启动时修改启动菜单项，以自定义系统启动方式。你还可以通过访问 `grub>` 提示符交互地创建新的启动菜单项。我们还讨论了如何为\
  \ GRUB 启动菜单中的项添加加密密码。\n\n## GRUB2\n\n我们查看了 GRUB 引导加载程序的最新版本，称为 `GRUB2`。GRUB2 的工作方式与原始的\
  \ GRUB Legacy 引导加载程序完全不同。1.98 或更高版本的 GRUB 被“GRUB2”。与 GRUB Legacy 引导加载程序相比，GRUB2\
  \ 使用完全不同的配置文件集。GRUB2 使用的配置文件是\n\n![images](img/bull.jpg) `/boot/grub/grub.cfg` 文件\n\
  \n![images](img/bull.jpg) `/etc/grub.d` 目录下的文件\n\n![images](img/bull.jpg) `/etc/default/grub`\
  \ 文件\n\n使用 GRUB2 时没有 `menu.lst` 文件。它被 `/boot/grub2/grub.cfg` 文件所取代。每当你更改配置并运行以下命令之一时，`grub.cfg`\
  \ 文件就会自动更新：\n\n![images](img/bull.jpg) 某些发行版使用 `update-grub` 命令。\n\n![images](img/bull.jpg)\
  \ 其它发行版使用 `grub2-mkconfig -o /boot/grub2/grub.cfg` 命令。\n\nGRUB2 配置存储在 `/etc/grub.d`\
  \ 目录下的几个脚本文件中。如果你对其中一个文件进行了更改，然后运行 `update-grub` 或 `grub2-mkconfig` 命令，`grub.cfg`\
  \ 文件将根据新的 GRUB 设置自动更新。\n\n## 管理运行级别 (Runlevels)\n\n在讨论完 GRUB 后，我们将注意力转向管理 Linux\
  \ 运行级别。我首先讨论了运行级别是如何工作的。Linux 定义了七个运行级别（0–6），执行以下操作：\n\n![images](img/bull.jpg)\
  \ **0** 停止系统。\n\n![images](img/bull.jpg) **1** 以单用户模式运行 Linux。\n\n![images](img/bull.jpg)\
  \ **2** 在禁用网络的多用户模式下运行 Linux。\n\n![images](img/bull.jpg) **3** 在启用网络的多用户模式下运行 Linux。\n\
  \n![images](img/bull.jpg) **4** 未使用。\n\n![images](img/bull.jpg) **5** 在启用网络的多用户模式下运行\
  \ Linux。使用图形用户界面。\n\n![images](img/bull.jpg) **6** 重启系统。\n\n`/etc/inittab` 文件用于配置每个运行级别发生的情况。该文件还定义了系统启动时进入的默认运行级别。系统的\
  \ `init` 目录包含一系列名为 `rc.0` 到 `rc.6` 的子目录，每个子目录都包含指向应在相应运行级别运行的 init 脚本的符号链接。\n\n\
  在 BSD 类系统上，`init` 进程在初始化系统时完成以下任务：\n\n![images](img/bull.jpg) 运行 `/etc/init.d/boot`\
  \ 脚本以准备系统\n\n![images](img/bull.jpg) 处理 `/etc/inittab` 以确定合适的运行级别和脚本\n\n![images](img/bull.jpg)\
  \ 运行 `/etc/init.d` 中对应运行级别目录下的脚本\n\n![images](img/bull.jpg) 运行 `/etc/init.d/boot.local`\
  \ 脚本\n\n在 System V 类系统上，`init` 进程在启动并运行运行时执行以下操作：\n\n![images](img/bull.jpg) 运行\
  \ `/etc/rc.d/sysinit` 脚本以准备系统\n\n![images](img/bull.jpg) 处理 `/etc/inittab` 以确定合适的运行级别和脚本\n\
  \n![images](img/bull.jpg) 运行 `/etc/rc.d` 中对应运行级别目录下的脚本\n\n![images](img/bull.jpg)\
  \ 运行 `/etc/rc.d/rc.local` 脚本\n\n我们随后花了一些时间处理 `init` 目录中的 init 脚本。使用 init 脚本管理服务的语法是\
  \ `/etc/init.d/*script_name start | stop | restart`。\n\n然后我转换了话题，讨论如何管理运行级别。我首先讨论了如何在\
  \ `/etc/inittab` 中配置默认运行级别。接着我讨论了如何动态更改运行级别。这是通过 `init` 命令完成的。只需从 shell 提示符输入 `init\
  \ *runlevel*`。这样做时，`init` 进程运行 `rc` 脚本，关闭与当前级别相关的服务并启动与目标运行级别相关的脚本。\n\n## systemd\n\
  \n我们将注意力转向 `systemd`。今天大多数 Linux 发行版已从 `init` 迁移到 `systemd`。`systemd` 进程是传统 `init`\
  \ 进程的替代者。`systemd` 的优点之一是在系统启动时并行加载服务。`systemd` 使用启动目标（targets）的概念，其功能与运行级别类似。下面是传统的\
  \ `init` 运行级别及其对应的 `systemd` 启动目标文件：\n\n![images](img/bull.jpg) 级别 3 = multi-user.target\
  \ 或 runlevel3.target\n\n![images](img/bull.jpg) 级别 5 = graphical.target 或 runlevel5.target\n\
  \n在使用 `systemd` 的系统上，你使用 `systemctl` 命令来管理服务和启动目标。要更改运行级别，运行 `systemctl` 并指向特定的启动目标。语法为\
  \ `systemctl isolate *boot_target*`。`etc/systemd/system/default.target` 文件控制默认启动目标。要修改默认启动目标，你需要修改符号链接指向的文件。这是通过使用\
  \ `systemctl set-default *boot_target` 命令完成的。如果你想查看当前的运行级别，输入 `systemctl get-default`。\n\
  \n\n\n\n你使用 `systemd` 管理系统守护进程的方式与在运行 `init` 的系统中非常相似。然而，所使用的命令有所不同。如果你需要停止、启动、重启或查看系统上特定服务的状态，可以输入\
  \ `systemctl`，后跟你想要执行的操作，最后是服务名称。你还可以使用 `systemctl` 命令在系统启动时启用或禁用特定服务。\n\n在章节结束时，我讨论了如何指定每个运行级别（runlevel）下运行的服务。这是通过\
  \ `insserv` 和 `chkconfig` 命令实现的。`insserv` 命令读取 init 脚本中 `INIT INFO` 块的信息，以确定关联的服务默认在哪些运行级别运行。`insserv`\
  \ 的语法为 `insserv service_name`。\n\n除了 `insserv` 之外，你还可以使用 `chkconfig` 命令管理守护进程的运行级别。输入\
  \ `chkconfig –l` 将列出所有服务及其配置为运行的运行级别。要配置服务在特定运行级别启动，输入 `chkconfig –s service_name\
  \ runlevels`。要关闭某个服务，输入 `chkconfig service_name off`。\n\n## 加速复习\n\n![images](img/bull.jpg)\
  \ 在 BIOS 阶段，计算机的 BIOS 芯片控制着系统。\n\n![images](img/bull.jpg) BIOS 使用开机自检（POST）程序测试系统硬件，然后找到带有启动文件的存储设备。\n\
  \n![images](img/bull.jpg) 在引导加载程序阶段，BIOS 将系统控制权交给引导加载程序。\n\n![images](img/bull.jpg)\
  \ 引导加载程序指向并加载你的操作系统的内核。\n\n![images](img/bull.jpg) 引导加载程序可以存在于启动设备的主引导记录（MBR）中，也可以存在驱动器上的启动分区中。\n\
  \n![images](img/bull.jpg) Linux 引导加载程序还可以在你系统的 RAM 中创建一个名为 `ramdisk` 的虚拟硬盘，并将基础根文件系统复制到其中。\n\
  \n![images](img/bull.jpg) 这个虚拟文件系统（取决于你的发行版，称为 `initrd` 或 `initramfs image`）被 Linux\
  \ 内核用于加载访问真实存储设备、检查并挂载这些设备所需的软件。\n\n![images](img/bull.jpg) 在内核阶段，引导加载程序从硬盘或其他启动设备将操作系统加载到你的系统\
  \ RAM 中。\n\n![images](img/bull.jpg) Linux 内核位于 `/boot` 中，名为 `vmlinuz-*version.gz`。\n\
  \n![images](img/bull.jpg) GRUB Legacy 引导加载程序被许多 Linux 发行版广泛使用。\n\n![images](img/bull.jpg)\
  \ GRUB Legacy 分为几个阶段：阶段 1、阶段 1.5 和阶段 2。\n\n![images](img/bull.jpg) 一些发行版使用 `/boot/grub/grub.conf`；另一些则使用\
  \ `/boot/grub/menu.lst` 来配置 GRUB Legacy。\n\n![images](img/bull.jpg) GRUB Legacy\
  \ 将系统中的硬盘称为 `hdx`，其中 `x` 是系统中的驱动器编号。\n\n![images](img/bull.jpg) 驱动器上的分区称为 `hdx,y`，其中\
  \ `y` 是驱动器上的分区编号。\n\n![images](img/bull.jpg) 如果你为 `/boot` 目录创建了单独分区，GRUB Legacy\
  \ 将其作为 GRUB 根目录，并在引用 `/boot/grub` 内的文件时不会将 `/boot` 包含在路径。\n\n![images](img/bull.jpg)\
  \ 如果你的 `/boot` 目录没有自己的分区，GRUB Legacy 将使用完整路径来引用 `/boot/grub/` 文件。\n\n![images](img/bull.jpg)\
  \ GRUB Legacy 允许你在系统启动时修改启动菜单项，以定制系统的启动方式。\n\n![images](img/bull.jpg) GRUB Legacy\
  \ 允许你通过访问 `grub>` 提示符交互地创建新的启动菜单项。\n\n![images](img/bull.jpg) 你可以从 GRUB 菜单将 init\
  \ 进程替换为不同的程序（如 `bash` shell），以便对无法启动的系统进行故障排除。\n\n![images](img/bull.jpg) 你可以为 GRUB\
  \ 菜单添加加密密码以限制访问。\n\n![images](img/bull.jpg) 1.98 或更高版本的 GRUB 被认为是 GRUB2。\n\nGRUB2\
  \ 使用的配置文件有：\n\n![images](img/bull.jpg) `/boot/grub/grub.cfg` 文件\n\n![images](img/bull.jpg)\
  \ `/etc/grub.d` 目录下的文件\n\n![images](img/bull.jpg) `/etc/default/grub` 文件\n\n![images](img/bull.jpg)\
  \ 在 GRUB2 中，`menu.lst` 文件已被 `/boot/grub2/grub.cfg` 文件取代。\n\n![images](img/bull.jpg)\
  \ GRUB2 配置存储在 `/etc/grub.d` 目录下的几个脚本文件中。\n\n![images](img/bull.jpg) 在修改 GRUB2 配置后，你必须运行\
  \ `update-grub` 命令或 `grub2-mkconfig -o /boot/grub2/grub.cfg` 命令。\n\nLinux 定义了七个运行级别（0–6）：\n\
  \n- **0** 停止系统。\n- **1** 在单用户模式下运行 Linux。\n- **2** 在禁用网络的多用户模式下运行 Linux。\n- **3**\
  \ 在启用网络的多用户模式下运行 Linux。\n- **4** 未使用。\n- **5** 在启用网络的多用户模式下运行 Linux。\n- **6** 重启系统。\n\
  \n`/etc/inittab` 文件用于配置每个运行级别发生的情况。`/etc/inittab` 还定义了系统启动时的默认运行级别。`/etc/init` 目录包含一系列名为\
  \ `rc0` 到 `rc6` 的子目录，每个目录包含指向对应运行级别应运行的 init 脚本的符号链接。你可以使用 `init *runlevel` 更改运行级别。当你更改运行级别时，init\
  \ 进程会关闭与当前运行相关的服务并启动与切换到的运行级别相关的脚本。\n\n大多数 Linux 发行版现在已从 init 迁移到 systemd。systemd\
  \ 守护进程使用目标（targets）的概念，其功能与运行级别类似。这里是传统的 init 运行级别对应的 systemd 启动文件：\n\n字体 运行级别 3\
  \ = `multi-user.target` 或 `runlevel3.target`\n- 运行级别 5 = `graphical.target` 或 `runlevel5.target`\n\
  \n在运行 systemd 的系统中，你使用 `systemctl` 命令来管理服务和目标。\n\n## 问题\n\nBIOS 在系统启动期间的作用是什么？（选择两个）\n\
  \nA. 它测试系统硬件。\nB. 它在 ramdisk 中创建 initrd 镜像。\nC. 它找到可启动存储设备。\nD. 它提供一个让你选择启动操作系统的菜单。\n\
  E. 它指向你的操作系统内核。\n\n**[2]** 你的 Linux 引导加载程序可以存在于？（选择两个）\n\nA. 在 BIOS 中\nB. 在 initrd\
  \ 镜像中\n\n\n\n\nC. 在存储设备的 MBR 中\nD. 在启动分区中\nE. 在系统芯片组中\n\n### 3. Linux 内核位于哪里？\n\
  A. 在 `/boot` 中\nB. 在 MBR 中\nC. 在 `/proc` 中\nD. 在 `/kernel` 中\n\n### 4. 你想将 GRUB\
  \ 安装到系统第一块 SATA 硬盘上的第一个分区。使用哪个 shell 命令可以实现这一目标？\nA. `grub /dev/sda1`\nB. `grub-install\
  \ /dev/sda1`\nC. `grub-install /dev/sda`\nD. `grub /dev/hda1`\n\n### 5. 哪个文件用于配置\
  \ GRUB 启动加载程序？\nA. `/etc/menu.lst`\nB. `/etc/grub.conf`\nC. `/boot/grub/grub.conf`\n\
  D. `/boot/grub/menu.lst`\n\n### 6. 下列 GRUB 配置文件指令中的哪个指向硬硬盘上 `/boot` 所在的分区？\nA. `root`\n\
  B. `boot`\nC. `kernel`\nD. `partition`\n\n### 7. 当你配置 GRUB 配置文件时，下列哪项指向 SATA 硬盘上的\
  \ `/dev/sda2`？\nA. `hd1,2`\nB. `hd0,2`\nC. `sd0,2`\nD. `hd0,1`\n\n### 8. 下列配置文件中哪个*没有*被\
  \ GRUB2 启动加载程序使用？\nA. `/boot/grub/grub.cfg`\nB. `/etc/grub.d`\nC. `/etc/default/grub`\n\
  D. `/boot/grub/menu.lst`\n\n### 9. 哪个 GRUB2 配置脚本文件可以检测同一块硬盘上 Linux 上的 Windows 安装？\n\
  A. `00_header`\nB. `10_linux`\nC. `30_os-prober`\nD. `40_custom`\n\n### 10. `/etc/default/grub`\
  \ 中的哪个配置参数指定了在启动默认操作系统之前，用户有多少时间从 GRUB 菜单中进行选择？\nA. `GRUB_TIMEOUT`\nB. `GRUB_DEFAULT`\n\
  C. `GRUB_SAVED DEFAULT`\nD. `GRUB_HIDDEN_TIMEOUT`\n\n### 11. 哪个运行级别（runlevel）默认使用图形用户界面？\n\
  A. 2\nB. 3\nC. 4\nD. 5\n\n### 12. 哪些运行级别默认使用命令行用户界面？（选择两个）\nA. 0\nB. 2\nC. 3\nD.\
  \ 5\nE. 4\n\n### 13. 你可以向哪个文件添加希望每次系统启动时都执行的命令？（选择两个）\nA. `rc`\nB. `boot.local`\n\
  C. `rc.local`\nD. `rc.systinit`\nE. `boot`\n\n### 14. 在较旧的 Fedora Linux 系统上，init\
  \ 脚本存储在哪里？\nA. `/etc/rc.d/init.d`\nB. `/etc/init.d`\nC. `/etc/init`\nD. `/etc/rc.d/init.d/rc*x*.d`\n\
  \n### 15. 在较旧 openSUSE Linux 系统上，可以使用哪个命令启动 Secure Shell 服务器 (sshd) 进程？（选择两个）\n\
  A. `/etc/rc.d/init.d/sshd start`\nB. `/etc/init.d/sshd restart`\nC. `/etc/rc.d/init.d/sshd\
  \ reload`\nD. `/etc/init.d/sshd start`\nE. `/etc/init.d/sshd reload`\nF. `/etc/rc.d/init.d/sshd\
  \ restart`\n\n### 16. 哪个文件用于设置使用 init 进程的 Linux 系统默认运行级别？\nA. `/etc/inittab`\nB.\
  \ `/etc/runlevel.conf`\nC. `/etc/init.conf`\nD. `/etc/sysconfig/init`\n\n### 17.\
  \ 哪个命令可以在系统运行时切换运行级别？\nA. `runlevel`\nB. `chrun`\nC. `mode`\nD. `init`\n\n### 18.\
  \ 下列链接文件位于 `/etc/init.d/rc3.d` 目录。如果系统配置为默认启动到运行级别 3，init 会运行哪个文件？\nA. `S09cups`\n\
  B. `S05cifs`\nC. `S06kbd`\nD. `S10cron`\n\n### 19. 你的旧版 openSUSE Linux 系统当前处于运行级别\
  \ 5。你在 shell 提示符输入 `init 3` 命令切换到运行级别 3。`/etc/init.d/rc3.d` 目录中有一个 cups 服务的 kill\
  \ 脚本，`rc5.d` 目录有一个相同服务的启动脚本。当运行级别改变时，cups 服务会发生什么？\nA. `rc` 脚本会让服务继续运行，因为它被配置在两个运行级别中运行。\n\
  B. `rc` 脚本运行 kill 脚本停止服务，但不会运行启动脚本来运行它。\nC. `rc` 脚本运行启动脚本启动服务，但不运行 kill 脚本停止它。\n\
  D. `rc` 脚本运行 kill 脚本停止服务，然后运行启动脚本重启它。\n\n### 20. 你的 Linux 系统上的 ntp 进程当前配置为在运行级别\
  \ 3 和 5 中运行。你想在各种 `rc*x*.d` 目录中删除 ntp 进程的所有 kill 和启动脚本。哪个命令可以实现此操作？\nA. `insserv\
  \ ntp`\nB. `insserv –r ntp`\nC. `/etc/init.d/ntp stop`\nD. `chkconfig –l ntp`\n\
  E. `chkconfig –s ntp 3`\n\n### 21. 你的 Linux 系统使用 systemd 而不是 init。你需要将系统切换到运行级别\
  \ 3。你应该使用哪个命令？\nA. `systemctl isolate graphical.target`\nB. `systemctl isolate multi-user.target`\n\
  C. `systemctl isolate runlevel5.target`\nD. `systemctl isolate nongraphical.target`\n\
  \n### 答案\n\n1. A, C. BIOS 在 POST 过程中测试你的系统硬件，然后定位可启动的存储设备。\n2. C, D. Linux 引导加载程序位于存储设备的\
  \ MBR 中。\n3. A. Linux 内核位于 `/boot` 中。\n4. B. `grub-install /dev/sda1` 将 GRUB 安装到第一块\
  \ SATA 硬盘上的第一个分区。\n5. C. `/boot/grub/grub.conf` 用于配置 GRUB 启动加载程序。\n6. A. `root`\
  \ 指向硬硬盘上 `/boot` 所在的分区。\n7. B. `hd0,2` 指向 SATA 硬盘上的 `/dev/sda2`。\n8. D. `/boot/grub/menu.lst`\
  \ 没有被 GRUB2 启动加载程序使用。\n9. C. `30_os-prober` GRUB2 配置脚本可以检测同一块硬盘上 Linux 上的 Windows\
  \ 安装。\n10. A. `GRUB_TIMEOUT` 指定了在启动默认操作系统之前，用户有多少时间从 GRUB 菜单中进行选择。\n11. D. 运行级别\
  \ 5 默认使用图形用户界面。\n12. B, C. 运行级别 2 和 3 默认使用命令行用户界面。\n13. B, C. 你可以在 BSD 类型系统中向 `boot.local`\
  \ 或在 System V 类型系统中向 `rc.local` 添加希望每次启动时都执行的命令。\n14. A. 在较旧的 Fedora 系统上，init 脚本存储在\
  \ `/etc/rc.d/init.d`。\n15. B, D. 可以使用 `/etc/init.d/sshd restart` 或 `/etc/init.d/sshd\
  \ start` 在旧版 openSUSE Linux 系统上启动 Secure Shell 服务器 (sshd) 进程。\n16. A. `/etc/inittab`\
  \ 用于设置使用 init 进程的 Linux 系统默认运行级别。\n17. D. `init` 命令可以在系统运行时切换运行级别。\n18. B. 由于分配的数字，`S05cifs`\
  \ 链接文件（启动 cifs 进程）会在其他文件之前运行。\n19. A. 因为 cups 被配置在两个运行级别中运行（因此假设它当前正在运行），`rc` 脚本什么都不做。它会让进程继续运行。\n\
  20. B. `insserv –r ntp` 命令通过删除 init 脚本目录下所有 `rc*x*.d` 子目录中 ntp 进程的所有链接来禁用 ntp 服务。\n\
  21. B. `systemctl isolate multi-user.target` 将系统切换到运行级别 3。\n\n\n\n\n\n## B. `systemctl\
  \ isolate multi-user.target` 命令将系统切换到 systemd 对应的 init 运行级别 3。\n\n# 第 7 章\n## 管理图形环境\n\
  \n在本章中，你将学习到：\n\n* X 环境是如何运行的\n* 配置 X 环境\n* 配置显示管理器\n* 配置辅助功能\n\n在之前的章节中，你主要学习了如何通过\
  \ `bash` shell 提示符使用 Linux。然而，你也可以在你的 Linux 系统上实现强大的图形用户界面（`GUI`）。大多数系统和网络管理员对 Linux\
  \ `CLI` 都很自如。我们不会对使用各种选项的长长 shell 命令感到畏惧。但我向你保证，你的终端用户对命令行界面一点也不兴奋。坦率地说，大多数人讨厌它，并且可能拒绝使用它。相反，大多数终端用户对\
  \ `GUI` 感到要舒服得多。\n\n由于微软 Windows 在家用电脑市场占据主导地位，大多数终端用户甚至从未用过命令行界面。为了让生活更轻松，你可以在\
  \ Linux 系统上安装 `X` 以及窗口管理器和桌面环境（如 `GNOME` 或 `KDE`）。有了 `GUI` 之后，你的用户可以使用鼠标而非仅仅键盘与\
  \ Linux 内核交互。`GNOME` 桌面环境如图[图 7-1]所示。\n\n![Images](img/f0224-01.jpg)\n**图 7-1**\
  \ GNOME 桌面环境\n\n![Images](img/examtip.jpg)\n**考试提示** 对于你的 `LPIC-1/Linux+` 考试，请非常熟悉\
  \ `X Window System`。确保你能够识别特定系统正在使用哪个版本的 `X server`。你应该知道如何使用 Linux 工具配置 `X` 以与你的视频硬件配合。你应该熟悉视频相关的术语，如同步率（synchronization\
  \ rate）、分辨率（resolution）和色彩深度（color depth）。你还需知道如何指定系统应该使用哪个窗口管理器。\n\n在本章中，我们将暂时离开\
  \ shell 提示符，学习如何操作 Linux `GUI`。让我们从讨论 `X` 环境的运行机制开始本章。\n\n### X 环境是如何运行的\n\n如前提到的，Linux\
  \ 系统上的 `GUI` 是使用 `X Window System` 创建的。\n\n![Images](img/note.jpg)\n**注意** 很多时候你会听到将\
  \ `X Window System` 称为 `X`、`X11` 或简单的 `X`。\n\n`X Window System` 为 Linux 基础。它允许程序员运行应用程序。本质上，`X\
  \ server` 创建了图形界面。它的工作方式与 Microsoft Windows 非常相似。事实上，`GNOME` 桌面环境是默认的，如图[图 7-2]所示。\n\
  \n![Images](img/f0224-01.jpg)\n**图 7-2** GNOME 桌面环境\n\n在 `GUI` 环境中，`X server` 管理鼠标。你可以在[图\
  \ 7-3]中找到 `X server` 组件。事实上，`GNOME` 桌面环境是默认的，如图[图 7-3]所示。\n\n![Images](img/f0224-01.jpg)\n\
  **图 7-3** GNOME 桌面环境\n\n每当使用 `GUI` 环境时，`X server` 都是默认。你可以通过以下方式自定义 `X server` 环境：\n\
  \n1. 选择 `X server` 环境。\n2. 选择 `X server` 环境。\n3. 选择 `X server` 环境。\n\n![Images](img/f0224-01.jpg)\n\
  **图 7-4** GNOME 桌面环境\n\n`GUI` 环境是模块化的。你可以混合组合不同的组件。`GUI` 环境由以下部分组成：\n\n* `X server`\n\
  * `window manager`\n* `desktop environment`\n\n`X server` 由 `DISPLAY` 变量控制。多年来，实现了两个不同的\
  \ `X server` 软件包：\n\n* `X.org`\n* `XFree86`\n\n直到大约 2004 年，`XFree86` 一一直是大多数 Linux\
  \ 发行版的默认选择。它的工作方式与 `X.org` 非常相似。遗憾的是，`XFree86` 存在相关的许可问题，促使社区转向了 `X.org`。\n\n\n\n\
  \n\n![images](img/bull.jpg) `KDE` KDE 是一个优秀的桌面环境。它提供的功能与 Microsoft Windows 非常相似。它是许多发行版的默认环境。一个在\
  \ Fedora 系统上运行的 KDE 桌面的示例见图 7-5。\n\n![images](img/bull.jpg) `GNOME` GNOME 桌面环境也同样优秀。GNOME\
  \ 是 Red Hat Fedora 和 openSUSE 等发行版使用的默认环境。在章节的早些部分展示了一个在 openSUSE 系统上运行的 GNOME 桌面示例，见图\
  \ 7-1。\n\n![Images](img/f0228-01.jpg)\n\n**图 7-5** KDE 桌面环境\n\n这三个组件——X 服务器软件、窗口管理器和桌面环境——共同工作，在\
  \ Windows 系统上创建创建 GUI 环境。你可以在这三个不同的组件之间进行混合组合，以定制系统以匹配你的特定口味和偏好。\n\n现在让我们讨论一下如何配置你的图形环境。\n\
  \n## 配置 X 环境\n\n由于你的图形环境由多个模块化组件组成，你需要完成各种任务来配置 Linux 系统上的 GUI。在本章的这部分，我们将涵盖以下内容：\n\
  \n![images](img/bull.jpg) 配置 X 服务器\n\n![images](img/bull.jpg) 配置 X 字体服务器\n\n让我们从讨论如何配置\
  \ X 服务器开始。\n\n### 配置 X 服务器\n\n由于 X 服务器直接与显卡和显示器协作，因此配置它是你所有 GUI 管理任务中最关键的。在你的配置中使用正确的设置是至关重要的。如果你操作不当，可能会损坏你的显示器。\n\
  \n我知道这一点是因为我曾经经历过这种情况。我曾将系统配置为使用一个对我正在使用的旧 CRT 显示器来说太太的同步率。它运行了几周都没问题。然而，在一个晚上，我的显示器开始发出嘶嘶声、冒火花并冒烟。我让它运行得太快太久，结果把它烧坏了。务必检查显卡和显示器的文档以获取正确的规格！\n\
  \n在开始之前，你应该拿出显卡和显示器的文档，并识别以下信息：\n\n![images](img/bull.jpg) 显卡的制造商是谁？\n\n![images](img/bull.jpg)\
  \ 显卡的型号数字是什么？\n\n![images](img/bull.jpg) 显卡上安装了多少内存？\n\n![images](img/bull.jpg)\
  \ 显板的最大分辨率是多少？\n\n![images](img/bull.jpg) 显板的最大色彩深度是多少？\n\n![images](img/bull.jpg)\
  \ 板载上安装了什么芯片组？\n\n![images](img/bull.jpg) 你的显示器支持的最大水平和垂直同步率是多少？\n\n有了这些信息后，你需要检查你发行版的\
  \ HCL（硬件兼容列表），确保你的显卡和显示器是被支持的。相信我，在开始之前拥有这些信息将为你节省很多麻烦。但要警告你，你很多时候会发现新的显卡并没有列在 HCL\
  \ 中。这意味着该显卡不支持且无法工作吗？也许吧，也许不是。你可以这样做：\n\n![images](img/bull.jpg) 查看是否有旧驱动程序可以支持你的新显卡，直到新驱动程序发布为止。大多数\
  \ X 服务器实现都会包含一组通用驱动程序，它们可以在某种程度上支持大多数显卡。效果可能并不理想，但你至少可以让你的系统运行起来。\n\n![images](img/bull.jpg)\
  \ 检查显卡制造商网站，查看他们是否发布了你的 X 服务器实现未包含的显卡驱动程序。\n\n一旦你收集了这些信息，就可以开始配置你的 X 服务器了。这可以通过两种方式完成：\n\
  \n![images](img/bull.jpg) 编辑 X 配置文件\n\n![images](img/bull.jpg) 使用 X 配置工具\n\n让我们先看看\
  \ X 配置文件。\n\n### 编辑 X 配置文件\n\n就像 Linux 中的其他一切一样，你的 X 配置存储在 `/etc` 目录下的文件中。\n\n*\
  \ * *\n\n![Images](img/note.jpg)\n\n**注意** 我好朋友创造了一个恰当的格言：“Linux 中的一切都是文件”。所有的系统和服务配置都存储在文件中。你甚至通过文件访问设备。\n\
  \n如果你在运行 `init` 守护的 Linux 发行版上使用 `X.org`，你的配置设置保存在 `/etc/X11/xorg.conf`。如果你使用 `XFree86`，你的配置设置保存在\
  \ `/etc/X11/XF86Config`。这是一个示例 `xorg.conf` 文件的部分：\n\n![Images](img/p0230-01.jpg)\n\
  \n* * *\n\n![Images](img/note.jpg)\n\n**注意** 基于 `systemd` 的 Linux 发行版不使用 `xorg.conf`\
  \ 配置文件。相反，X11 配置存储在 `/etc/X11/xorg.conf.d` 中的一系列配置文件中。然而，配置原理基本相同。这些系统不是将一个文件分为多个部分，而是将单个文件拆分为单独的文件，例如\
  \ `10-evdev.conf`、`50-device.conf`、`50-monitor.conf` 和 `50-screen.conf`。这些文件内部的语法是相同的。\n\
  \n\n\n\n\n![images](img/bull.jpg) **水平计时**\n第二个组件是一个包含四个数字的列表，用于指定水平计时：`hdisp`、`hsyncstart`、`hsyncend`\
  \ 和 `htotal`。在示例的第一个 Modeline 中，这些值分别为 1024、1048、1184 和 1344。\n\n![images](img/bull.jpg)\
  \ **垂直计时**\n第三个组件是一个包含四个数字的列表，用于指定垂直计时：`vdisp`、`vsyncstart`、`vsyncend` 和 `vtotal`。在示例的第一个\
  \ Modeline 中，这些值分别为 768、771、777 和 806。\n\n![images](img/bull.jpg) **标志 (Flags)**\n\
  第四个组件是一个标志列表，用于配置视频模式。在示例的第一个 Modeline 中，列出了 `–sync` 和 `–vsync` 标志。这些用于设置 `hsync`\
  \ 和 `vsync` 信号的极性。\n\n## Screen 部分 (Section)\n\n下一部分是 Screen 部分，它将你的显卡绑定到显示器上。这是一个示例：\n\
  \n![Images](img/p0233-01.jpg)\n\n显卡由 `Device` 指令指定，而你的显示器由 `Monitor` 指令指定。Screen\
  \ 部分中 `Device` 指令所使用的 `device-id` 必须与文件中 `Device` 部分内的 `Identifier` 指令匹配（将在下一步进行讨论）。其语法如下：\n\
  \n![Images](img/p0233-02.jpg)\n\n如你在前面的示例所示，每个 Screen 部分可以有多个 Display 子部分。你可以在每个\
  \ Display 子部分中使用以下指令：\n\n![images](img/bull.jpg) **深度 *depth*** (Depth)\n指定颜色深度，单位为每个像素的位（bits）。大多数视频驱动程序支持\
  \ 8、15、16 和 24 位颜色深。\n\n![images](img/bull.jpg) **模式 *mode_name*** (Modes)\n指定要使用的视频模式列表（包含在引号内）。每种都必须匹配\
  \ Monitor 部分中相应的条目。\n\n![images](img/bull.jpg) **视口 *x y*** (ViewPort)\n设置显示器的左上角。\n\
  \n## Device 部分 (Section)\n\n你需要熟悉的下一个部分是 Device 部分。系统中安装的每个视频适配器都必须有一个 Device 部分。这是一个\
  \ Device 部分示例：\n\n![Images](img/p0234-01.jpg)\n\n`Identifier` 指令定义了视频适配器的唯一名称。`Driver`\
  \ 指令指定了应该为该视频适配器使用哪个驱动程序。\n\n## Monitor 部分 (Section)\n\n你需要熟悉的下一个部分是 Monitor 部分，它定义了连接到你显示适配器的显示参数。接下来显示了一个\
  \ Monitor 部分：\n\n![Images](img/p0234-02.jpg)\n\n你可以在 Monitor 部分中使用以下指令：\n\n![images](img/bull.jpg)\
  \ **Identifier \"*name*\"**\n为显示器定义唯一名称\n\n![images](img/bull.jpg) **VendorName\
  \ \"*vendor*\"**\n指定显示器制造商\n\n![images](img/bull.jpg) **ModelName \"*model*\"**\n\
  指定显示器型号\n\n![images](img/bull.jpg) **HorizSync sync_range**\n定义显示器支持的水平同步频率范围，单位为\
  \ KHz\n\n![images](img/bull.jpg) **VertRefresh *refresh_rate***\n定义显示器支持的垂直同步频率范围，单位为\
  \ KHz\n\n## ServerLayout 部分 (Section)\n\n我们在这里最后一个查看的部分是 ServerLayout 部分。这是一个关键部分。它将所有前面的部分“胶合”在一起形成完整的配置。ServerLayout\
  \ 部分使用以下语法：\n\n![Images](img/p0234-03.jpg)\n\nServerLayout 部分将一个或多个 Screen 部分和一个或多个\
  \ InputDevice 部分绑定在一起，如下例：\n\n![Images](img/p0235-01.jpg)\n\n你可以在 ServerLayout 部分中使用以下指令：\n\
  \n![images](img/bull.jpg) **Identifier \"*name*\"**\n为服务器布局定义唯一名称。\n\n![images](img/bull.jpg)\
  \ **Screen \"*screen_id*\"**\n指定为服务器布局使用哪些屏幕参数。\n\n![images](img/bull.jpg) **InputDevice\
  \ \"*input_device_id*\"**\n指定为服务器布局使用哪些输入设备。你为每个输入设备需要一个指令（通常鼠标一个，键盘一个）。\n\n![images](img/bull.jpg)\
  \ **Option \"*option_name*\"**\n任何可以在 ServerFlags 部分中使用的选项也可以在这里指定。如果两个地方都指定了相同的选项，则\
  \ ServerLayout 部分中指定的选项将覆盖 ServerFlags 部分中列出的选项。\n\n现在你已经了解了 X 服务器配置文件的结构，接下来你需要学习如何使用\
  \ X 配置工具来配置它。\n\n### 使用 X 配置工具 (Using an X Configuration Utility)\n\n与大多数 Linux\
  \ 服务一样，X 服务器配置文件是一个文本文件，可以使用 `vi` 等简单的文本编辑器进行修改。然而，我强烈建议除非绝对必要，否则不要这样做。此配置文件非常复杂，一个小错误可能会损坏你的硬件。你应该使用发行版带的配置工具来配置你的\
  \ X 服务器设置。例如，在 openSUSE 系统上，你可以使用图 7-6\n\n**图 7-6 Displays 小程序**\n该程序允许你配置屏幕分辨率。在旧的发行版中，你也可以从命令行提示符运行\
  \ `sax` 命令。它为你提供了一个非常实用的界面，可以用来配置视频系统的几乎所有方面。如果你在图形环境中运行 `sax2`，图 7-7\n\n**图 7-7\
  \ 用于配置视频系统的 SaX2**\n你可以使用 `sax2` 工具来配置系统的视频适配器、显示器、分辨率和颜色深度。我喜欢 `sax2` 的特点之一是它可以在文本环境下运行（例如当你的视频设置混乱到必须进入\
  \ runlevel 3 启动系统时）。\n\n*\n\n![Images](img/note.jpg)\n\n**注意 (NOTE)** SaX2 曾在许多发行版中使用过很长时间。然而，大多数现代发行版不再使用\
  \ SaX2 来配置视频系统。\n\n许多其他工具和命令在各种发行版中用于配置 X 系统。请注意，这些工具往往取决于发行版。它们可能在某个发行版可用，但在另一个中不可用。为了提供跨发行版的功能，X.org（以及\
  \ XFree86）提供了几个通用的配置工具。在 X.org 中，你可以在文本环境中使用 `xorgconfig` 工具配置显卡、显示器、分辨率、颜色深度等。该工具如图\
  \ 7-8\n\n**图 7-8 使用 xorgconfig 工具**\n`xorgconfig` 的伟大之处在于它尝试自动为你检测硬件（就像 SaX2 工具一样）。如果你对系统中到底安装了什么不太确定，这可能是一个救命稻草。事实上，如果你在命令行提示符输入\
  \ `Xorg –configure`，该工具将自动检测所有硬件并创建一个名为 `/root/xorg.new` 的配置文件。然后你可以通过在命令行输入 `X\
  \ –config /root/xorg.new` 来测试配置。如果一切看起来正常，将其重命名为 `/etc/X11/xorg.conf` 以开始使用新配置。\n\
  \nX.org 还提供了 xorgconfig 的图形化版本，通过在命令行提示符输入 `xorgcfg` 启动。该工具绘制了你的显示器、显卡、键盘和鼠标，如图\
  \ 7-9**。\n\n![Images](img/f0238-01.jpg)\n\n**图 7-9 使用 xorgcfg**\n\n\n\n\n\n如果你的发行版仍然在使用\
  \ XFree86 X 服务器，你可以使用以下工具来完成相同的任务：\n\n![images](img/bull.jpg) `XFree-86 –configure`\
  \ 用于检测你的硬件并创建一个名为 `/etc/X11/XF86Config.new` 的文件，你可以将其重命名为 `XF86Config`\n\n![images](img/bull.jpg)\
  \ `xf86config` 一个基于文本的 X 服务器配置工具\n\n![images](img/bull.jpg) `xf86cfg` 一个图形化的 X 服务器配置工具\n\
  \n在对你的 X 服务器配置进行任何更改后，请记住以下几点：\n\n![images](img/bull.jpg) 配置工具将提示你测试新设置以确保它们运行正常。你应该始终这样做。如果你在配置某处犯了错误，这将为你节省大量时间。\n\
  \n![images](img/bull.jpg) 测试配置后，你必须重启 X 服务器以应用更改。最简单的方法是直接注销然后重新登录。重启系统也可以完成相同任务。你还可以通过切换到\
  \ init 目录并重启桌面环境，以及使用其 init 脚本（例如 `xdm`）重启桌面管理器。\n\n![images](img/bull.jpg) 如果配置不当导致\
  \ X 服务器软件挂起，你可以按下 `CTRL-ALT-BACKSPACE` 来杀死它。\n\n![images](img/bull.jpg) 如果你想精调 X\
  \ 服务器配置，请从 shell 提示符运行 `xvidtune` 工具。该工具允许你自定义显示器的水平和垂直同步。然而，请务必极其小心。记住，使用超出显示器能力的同步参数最终会损坏它。\n\
  \n![images](img/bull.jpg) 如果你处于运行级别 3 且想启动 Linux GUI，只需在 shell 提示符输入 `startx`（它是\
  \ `xinit` 的简单 shell 脚本封装器）或直接输入 `X` 即可。\n\n***\n\n![Images](img/examtip.jpg)\n\n\
  **考试提示** `xwininfo` 命令可显示图形桌面上打开窗口的信息。你可以运行该命令，然后点击你想获取信息的窗口。你也可以直接使用命令的 `--id`\
  \ 选项指定你想获取信息的窗口 ID。`xdpyinfo` 命令可用于显示服务器的功能、客户端与服务器之间通信时使用的各种参数以及各种不同的屏幕模式。\n\n\
  接下来，让我们来看如何配置 X 字体服务器。\n\n### 配置 X 字体服务器\n\nX 字体服务器允许你在网络中的某一个 Linux 系统上配置 X 服务器字体，然后让其他\
  \ Linux 系统上的 X 服务器连接到它。通过这种方式设置字体，允许你从单一的中心位置为整个组织配置字体。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 老实地说，我怀疑你可能永远不会真的设置 X 字体服务器。我已经十多年没有发现过设置它的需求了。然而，为了通过 LPIC-1/Linux+ 考试，你需要能够完成这项，因此我们在这里讨论如何操作。\n\
  \n要完成此操作，你需要完成以下任务：\n\n![images](img/bull.jpg) 在 X 字体服务器上配置字体。\n\n![images](img/bull.jpg)\
  \ 配置远程 X 服务器访问字体服务器。\n\n让我们从讨论如何在 X 字体服务器上配置字体开始。\n\n#### 在 X 字体服务器上配置字体\n\n如果你想在\
  \ X 字体服务器上安装除随 X 服务器安装的默认字体以外的字体，在配置 X 字体服务器时需要做的第一件事就是实际上安装你想在上面分发的字体。如果你的 Linux\
  \ 发行版运行的是 X.org，则你的字体需要安装到 `/usr/share/X11/fonts` 或 `/usr/share/fonts` 目录。这里是一个示例：\n\
  \n![Images](img/p0239-01.jpg)\n\nLinux 字体有两种类型：\n\n![images](img/bull.jpg) **位图字体（Bitmap\
  \ fonts）** 位图字体是 Linux 最老的字体类型。顾如名，位图字体使用一系列像素来表示屏幕上的字符。它们易于使用，不需要大量的计算能力就能显示在屏幕上。然而，它们确实有一个致命缺点：缩放性差。基本上，对于每种屏幕分辨率和每个字体大小，你都需要相同字体的不同版本。换句话说，在你的\
  \ Linux 系统上安装一个位图字体可能需要你安装多个字体文件。在前面的示例中，你可以看到字体目录下有一个名为 `100dpi` 的目录和另一个名为 `75dpi`\
  \ 的目录。大多数 X 服务器默认只安装有限的位图字体。\n\n![images](img/bull.jpg) **可缩放字体（Scalable fonts）**\
  \ 可缩放字体正如其名，是可以缩放的。它们不是使用像素表示字符，而是使用根据需要动态调整大小的矢量线。因此，每种字体只需要一个字体文件。可缩放字体有两种常用格式：\n\
  \n![images](img/bull.jpg) **PostScript Type 1** 在前面的示例中，这些字体存储在 `Type1` 子目录下。\n\n\
  ![images](img/bull.jpg) **TrueType** 在前面的示例中，这些字体存储在 `truetype` 子目录下。\n\n要安装字体，请将字体文件复制到适当的子目录中。对于\
  \ Type1 字体，你需要复制 `.pfa` 或 `.pfb` 文件。对于 TrueType 字体，你需要复制 `.ttf` 文件。位图字体需要放入 `100dpi`\
  \ 和 `75dpi` 目录。\n\n完成后，你需要创建字体索引。这是通过切换到字体目录并输入 `mkscale` 然后输入 `mkfontdir` 完成的。这些命令为\
  \ X 服务器制作可缩放（以及位图）字体文件的索引。接下来，你必须在防火墙中打开 7100 端口。\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** 如果你将字体安装在字体目录下默认目录（`Type1` 或 `truetype`）之外的目录中，你必须手动编辑 X 配置文件（例如 `xorg.conf`），并在\
  \ `Files` 部分中添加 `FontPath` 指令。\n\n#### 配置远程 X 服务器访问字体服务器\n\n一旦你配置了 X 字体服务器，就可以配置各个客户端系统上的\
  \ X 服务器来使用它。打开每个 X 服务器配置文件（通常为 `xorg.conf`）并找到 `Files` 部分。在此部分，为 X 字体服务器添加新的 `FontPath`\
  \ 指令。使用以下语法：\n\n![Images](img/p0241-01.jpg)\n\n与 X 字体服务器一样，你必须在主机防火墙中打开 `7100` 端口，然后重启\
  \ X 服务器。\n\n#### 配置显示管理器\n\n为了通过 LPIC-1/Linux+ 考试，你还需要熟悉如何配置你的显示管理器和桌面环境。在本章的这一部分，你将学习如何操作。涉及以下的主题：\n\
  \n![images](img/bull.jpg) 尝试桌面环境\n\n![images](img/bull.jpg) 管理显示管理器\n\n\n\n\n\n\
  让我们先开始讨论如何在 Linux 上尝试不同的桌面环境。\n\n### 尝试桌面环境\n\n如前所述，你的 Linux 系统使用的窗口管理器和桌面环境组件是模块化的。你可以尝试各种窗口管理器和桌面环境，看看哪一个最适合你。要实现这一点，请执行以下操作：\n\
  \n1. 使用 `rpm` 实用程序（或其他包安装工具）安装尝试的窗口管理器或桌面环境。\n2. 完成后，注销。在登录界面上，你应该能看到名为“Session\
  \ Type”（话类型）的选项。当你选择此选项时，系统会显示已安装的窗口管理器和桌面环境列表，如图 7-10\n\n**图 7-10** 选择桌面管理器\n\n\
  此时，你的系统将加载你指定的窗口管理器或桌面环境。如果你喜欢你看到的内容，可以将其永久化。如果你的系统默认启动到运行级别 3 且你使用 `startx` 命令加载\
  \ Linux GUI，那么你需要在用户的家目录中找到名为 `.xinitrc` 的隐藏脚本文件（使用 `ls -a`）。用文本编辑器打开此文件并找到读取 `exec\
  \ $WINDOWMANAGER` 的行，如下：\n\n![Images](img/p0242-01.jpg)\n\n将 `$WINDOWMANAGER` 替换为你想要使用的窗口管理器或桌面环境的名称。使用以下：\n\
  \n![images](img/bull.jpg) **KDE** `/usr/bin/startkde`\n\n![images](img/bull.jpg)\
  \ **GNOME** `/usr/bin/gnome`\n\n***\n\n![Images](img/tip.jpg)\n\n**提示** 注意到 `$WINDOWMANAGER`\
  \ 引用了 `WINDOWMANAGER` 环境变量。与其编辑 `.xinitrc` 文件，你只需将 `WINDOWMANAGER` 变量的值设置为你想要使用的窗口器的路径和可执行文件。\n\
  \n保存文件并运行 `startx`。\n\n如果你的系统默认启动到运行级别 5，则对家目录下的 `.Xsession`、`.Xdefaults` 或 `.Xclients`\
  \ 文件进行相同的更改，取决于你特定的发行版使用哪一个。\n\n接下来让我们看看如何配置显示管理器。\n\n### 管理显示管理器\n\n正如我们在本章前面讨论的，Linux\
  \ 显示管理器是一个专门的客户端应用程序，与 X 服务器配合工作，提供窗口控制元素、管理虚拟桌面并提供窗口框功能（例如，更改窗口大小或在屏幕上移动窗口）。X 服务器不与任何特定的窗口管理器绑定，因此也不与任何特定的外观和感受绑定。\n\
  \n对于你的 LPIC-1/Linux+ 考试，你需要知道如何使用显示管理器执行以下操作：\n\n![images](img/bull.jpg) 启用或禁用显示管理器\n\
  \n![images](img/bull.jpg) 配置显示管理器\n\n![images](img/bull.jpg) 配置对显示器的远程访问\n\n####\
  \ 启用或禁用显示管理器\n\n你可以使用 init 脚本启用或禁用显示管理器。这取决于你正在使用的 Linux 发行版。在许多 Linux 发行版（如 openSUSE）中，显示管理器由位于\
  \ `/etc/init.d` 目录下的 `xdm` init 脚本管理。其他发行版可能使用 GNOME 显示管理器 (`gdm`) 或 KDE 显示管理器 (`kdm`)。要手动管理显示管理器，在\
  \ shell 提示符下输入 `/etc/init.d/*init_script stop` 或 `start`。\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** 你也可以使用 `rcxdm stop` 或 `start` 来实现相同的操作。\n\n由于显示管理器是使用 init 脚本管理的，你可以使用\
  \ `chkconfig` 命令控制在系统启动时是否加载显示管理器。例如，要配置 `xdm` 显示管理器在启动时不加载，输入 `chkconfig xdm off`。你可以通过在\
  \ shell 提示符下输入 `chkconfig xdm -l` 来验证它已禁用。这里是一个示例：\n\n![Images](img/p0243-01.jpg)\n\
  \n或者，为了配置显示在系统启动时自动加载，你需要输入 `chkconfig xdm on`。再次，输入 `chkconfig xdm -l` 以验证显示管理器已配置为运行级别\
  \ 5 自动启动，如下：\n\n![Images](img/p0243-02.jpg)\n\n#### 配置显示管理器\n\n你可以通过编辑相应的配置文件来配置你的显示管理器：\n\
  \n![images](img/bull.jpg) **xdm** `/etc/X11/xdm/xdm-config`\n\n![images](img/bull.jpg)\
  \ **LightDM** LightDM 显示管理器使用几个不同的文件进行配置：\n\n![images](img/bull.jpg) `/usr/share/lightdm/lightdm.conf.d`\n\
  \n![images](img/bull.jpg) `/etc/lightdm/lightdm.conf.d`\n\n![images](img/bull.jpg)\
  \ `/etc/lightdm/lightdm.conf`\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 我们在本章将重点关注配置\
  \ LightDM 显示管理器。\n\n![images](img/bull.jpg) **kdm** KDE 显示管理器实际上基于 `xdm`，通常使用 `xdm`\
  \ 配置文件。然而，某些发行版将你的 `kdm` 设置存储在 `/etc/kdm` 或 `/etc/X11/` 中。\n\n![images](img/bull.jpg)\
  \ **gdm** `/etc/X11/gdm` 在使用 LightDM 显示管理器时，重要的是它的所有配置文件都是合并的。默认 LightDM 配置存储在 `/usr/share/lightdm/lightdm.conf`。这些文件是由系统生成的，不应直接编辑。相反，你应该在\
  \ `/etc/lightdm/lightdm.conf.d/` 创建包含你想做的更改的文件。如果多个多个文件中存在相同的设置，则最后一个处理的文件将生效并覆盖之前的设置。例如，假设你想覆盖\
  \ `/usr/share/lightdm/lightdm.conf.d/50-ubuntu.conf` 中的默认会；你可以创建一个 `/etc/lightdm/lightdm.conf.d/50-myconfig.conf`\
  \ 文件并输入相应的设置。\n\nLightDM 使用“欢迎界面”（greeter）的概念，它基本上是与 LightDM 交互的用户界面。例如，Ubuntu 发行版默认使用\
  \ Unity 欢迎界面。你可以使用 LightDM 配置文件自定义 LightDM 的工作方式以及它使用的欢迎界面，包括：\n\n![images](img/bull.jpg)\
  \ 你可以更改 LightDM 使用的欢迎界面。要实现这一点，在 `/etc/lightdm/lightdm.conf.d/` 创建适当的文件，并在 `/usr/share/greeters`\
  \ 中指定你使用的欢迎界面文件（具有 `.desktop` 扩展）。使用以下语法：\n\n![Images](img/p0244-01.jpg) 你可以禁用访客登录。默认情况下，LightDM\
  \ 允许你以游客身份登录系统。出于安全考虑，你可能想禁用此功能。要实现这一点，在 `/etc/lightdm/lightdm.conf.d/` 创建适当的文件并输入以下行：\n\
  \n![Images](img/p0244-02.jpg) ![images](img/bull.jpg) 你可以隐藏用户列表。许多 LightDM 欢迎界面默认显示可能的用户账户列表。同样，出于安全考虑，你可能想禁用此功能。在\
  \ `/etc/lightdm/lightdm.conf.d/` 创建适当的文件并输入以下行：\n\n![Images](img/p0244-03.jpg) ![images](img/bull.jpg)\
  \ 你可以配置 LightDM 允许手动登录。默认情况下，Unity 欢迎界面不允许你在登录系统时手动输入用户名。你可以通过重新配置 Unity 来允许此操作，在\
  \ `/etc/lightdm/lightdm.conf.d/` 创建适当的文件并输入以下行：\n\n![Images](img/p0244-04.jpg)\n\
  \n\n\n\n![images](img/bull.jpg) 你可以通过手动指定会话文件来更改 LightDM 使用的默认会话类型。这些文件具有 `.desktop`\
  \ 扩展名，位于 `/usr/share/xsessions`。同样，在 `/etc/lightdm/lightdm.conf.d/` 中创建适当的文件并输入以下行：\n\
  \n![Images](img/p0244-05.jpg)\n\n接下来，让我们讨论如何配置显示管理器以支持远程 X 终端。\n\n## 配置显示器的远程访问\n\
  \n许多组织为其终端用户使用瘦客户端系统。瘦客户端是一种极简的计算机系统，它使用 X 服务器软件通过网络连接到远程 X 服务器，并在其上运行显示管理器。这使得显示管理器呈现的远程\
  \ X 服务器输出能够显示在瘦客户端的本地显示器上。这种实现允许这些组织仅使用少的高端 xdm 系统和大量的廉价瘦客户端，就为所有用户提供完整的图形化桌面。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 某些瘦客户端系统非常精简。它们可能甚至没有硬盘。连接到 xdm 主机所需的极简\
  \ Linux 操作系统和 X 服务器软件嵌入在瘦客户端系统的固件中。\n\n要配置 xdm 主机上的显示器远程访问，你需要配置它监听网络上来自瘦客户端 X 服务器软件的入站连接请求。这些请求使用端口\
  \ `177` 上的 `dm` 控制协议 (`XDMCP`)。执行以下操作：\n\n1. 如果你的主机正在运行 `xdm` 或 `kdm`，编辑 `/etc/X11/xdm/Xservers`\
  \ 文件并找到以 `:0` 开头的行，所示：\n\n```\n:0 local /usr/X11R6/bin/X -nolisten tcp -br vt7\n\
  ```\n\n删除 `-nolisten tcp` 选项；然后保存更改并重启系统。\n\n2. 如果你的系统正在运行 `gdm`，编辑 `/etc/X11/gdm/gdm.conf`\
  \ 文件并将 `DisallowTCP=` 设置为 `false`。\n\n3. 如果你正在运行 `openSUSE`，你需要编辑 `/etc/sysconfig/displaymanager`\
  \ 文件并进行以下更改：\n\n![Images](img/p0245-01.jpg)\n\n4. 在 xdm 主机的防火墙中打开端口 `177`。\n\n5.\
  \ 使用文本编辑器打开 xdm 主机上的 `/etc/X11/xdm/Xaccess` 文件。此文件用于配置 `XDMCP` 连接的访问控制。\n\n要启用远程访问，请为每个将访问主机上\
  \ `xdm` 服务的远程瘦客户端系统添加条目。你可以单独添加每个系统的主机名，也可以允许整个域的访问。\n\n例如，若要允许来自 `mydomain.com`\
  \ 域的所有系统访问 `xdm` 服务，你需要在文件中添加 `*.mydomain.com`。\n\n要限制特定的瘦客户端访问主机上的 `xdm` 服务，请在感叹号后将它们的主机名添加到文件中。例如，要防止\
  \ `ws1.mydomain.com` 主机访问 `xdm` 服务，你会在文件中输入 `!ws1.mydomain.com`。\n\n本章我们需要讨论的最后一个主题是配置辅助功能设置。让我们接下来看看如何操作。\n\
  \n## 配置辅助功能\n\n为了支持多样化的劳动力队伍，你需要熟悉如何在你所管理的 Linux 系统上配置辅助功能设置。在本章的这部分，你将学习如何使用以下工具为身体残障和视觉受损的用户配置辅助功能设置：\n\
  \n![images](img/bull.jpg) 键盘辅助功能\n![images](img/bull.jpg) 鼠标辅助功能\n![images](img/bull.jpg)\
  \ 屏幕阅读器\n![images](img/bull.jpg) 屏幕放大镜\n![images](img/bull.jpg) 盲文设备\n![images](img/bull.jpg)\
  \ 桌面主题\n\n然而，在使用这些许多工具之前，你需要先启用“辅助技术”（Assistive Technologies）。要做到这一点，你需要访问你的“辅助技术偏好”（Assistive\
  \ Technologies Preferences）应用程序。在 Fedora 系统上，这通过搜索并选择“通用访问”（Universal Access）来实现。屏幕如图图\
  \ 7-11 所示。\n\n![Images](img/f0246-01.jpg)\n\n**图 7-11** 启用辅助技术\n\n此时，你可以在 Linux\
  \ 系统上配置各种辅助功能工具。让我们先看看如何使用 `AccessX` 提供键盘辅助功能。\n\n### 键盘辅助功能\n\n大多数 Linux 发行版都包含各种辅助工具，以帮助因身体残障而难以使用传统鼠标或键盘的用户。你可以使用的工具之一称为\
  \ `AccessX`，它是大多数 Linux 桌面管理器自带的一个应用程序，允许你配置各种键盘辅助功能设置。这些设置旨在让身体残障的用户使用传统键盘。你可以配置以下内容：\n\
  \n![images](img/bull.jpg) **粘滞键 (StickyKeys)** 允许用户锁定如 `CTRL` 和 `SHIFT` 等修饰键。这使他们只需一个手指即可完成通常需要两个或更多手指的键盘任务。\n\
  \n![images](img/bull.jpg) **鼠标键 (MouseKeys)** 允许使用键序列来移动屏幕上的鼠标光标并发送鼠标点击。\n\n![images](img/bull.jpg)\
  \ **慢键 (SlowKeys)** 配置键盘，使用户必须按住按键指定时间，按键才会实际发送。\n\n![images](img/bull.jpg) **切换键\
  \ (ToggleKeys)** 当开启 `CAPS LOCK` 或 `NUM LOCK` 键时，会发出听觉警报。\n\n![images](img/bull.jpg)\
  \ **重复键 (RepeatKeys)** 配置键盘，允许用户在发送多次按键之前有额外的时间释放已按下的键。\n\n![images](img/bull.jpg)\
  \ **跳跳键和延迟键 (BounceKeys and DelayKeys)** 在按键之间插入轻微延迟，以防止键盘发送无意的按键。\n\n要配置 `AccessX`\
  \ 设置，访问“通用访问”并选择键盘偏好。例如，在 Fedora 系统上，你会选择“输入辅助 (Typing Assist (AccessX))”。当你这样做时，屏幕如图图\
  \ 7-12 所示。\n\n![Images](img/f0248-01.jpg)\n\n**图 7-12** 配置键盘辅助功能\n\n对于无法使用传统键盘的身体残障用户，Linux\
  \ 提供了使用屏幕键盘的选项，允许用户使用任何指向设备（如鼠标）选择虚拟键盘上的按键。常用的屏幕应用程序包括 `GOK`（GNOME 屏幕键盘）和 `GTkeyboard`。\n\
  \n你使用“通用访问”面板来配置屏幕键盘。在 Fedora 系统上，你可以在“输入”下将“屏幕键盘”设置设置为“开启”。\n\n### 鼠标辅助功能\n\n除了键盘辅助功能，辅助技术还为身体残障用户提供辅助功能选项。例如，在\
  \ Fedora 系统上，你可以在“通用访问”面板的“指向和点击”下配置鼠标选项。\n\n根据发行版的不同，你可以配置以下内容：\n\n![images](img/bull.jpg)\
  \ **模拟右键点击 (Simulated secondary click)** 此选项允许你通过按住主鼠标键指定时间来发送双击。\n\n![images](img/bull.jpg)\
  \ **停留点击 (Dwell click)** 此选项每当鼠标光标停止移动指定时间时，就会发送鼠标点击。\n\n![images](img/bull.jpg)\
  \ **鼠标手势 (Mouse gestures)** 鼠标手势等于键盘快捷键。鼠标手势允许你在以特定方式移动鼠标时完成某些任务。你可以为以下每个鼠标手势配置所需的操作：\n\
  \n![images](img/bull.jpg) 单击\n![images](img/bull.jpg) 双击\n![images](img/bull.jpg)\
  \ 拖拽点击\n![images](img/bull.jpg) 右键点击\n\n对于每个手势，你可以配置以下操作之一：\n\n![images](img/bull.jpg)\
  \ 向左\n![images](img/bull.jpg) 向右\n![images](img/bull.jpg) 向上\n![images](img/bull.jpg)\
  \ 向下\n\n考虑到这一点，现在让我们看看为视觉受损用户提供的几种辅助功能选项。\n\n\n\n\n\n## 屏幕阅读器\n\n视障用户的一种选择是使用`screen\
  \ reader`屏幕阅读器），它可以通过语音为用户“读出”屏幕上显示的文本。某些屏幕阅读器可以使用计算机的音频接口，而另一些则需要特殊的语音合成器硬件。`Orca`应用程序可能是最常用的屏幕阅读器。与许多其他屏幕阅读器不同，`Orca`可以读取来自`GNOME`桌面的文本。许多其他屏幕阅读器（如`emacspeak`）仅适用于基于文本的终端屏幕。\n\
  \n要配置屏幕阅读器，请打开“辅助功能”（Universal Access），然后点击`Screen Reader`。你可以使用图 7-13 所示选项来开启屏幕阅读器。\n\
  \n![Images](img/f0249-01.jpg)\n\n**图 7-13** 启用屏幕阅读器\n\n你还可以启用屏幕放大选项。接下来让我们讨论这项技术的工作原理。\n\
  \n## 屏幕放大镜\n\n`screen magnifier`屏幕放大镜）允许视障用户像使用真实的放大镜一样放大屏幕区域。你可以从多种屏幕放大镜中选择，包括`Orca`、`GNOME\
  \ Magnifier`和`KDE Magnifier`。其中，`Orca`可能是最受欢迎的，因为它它可以兼当屏幕阅读器和屏幕放大镜使用。\n\n***\n\n\
  ![Images](img/note.jpg)\n\n**注意** 你可以通过在 shell 提示符中输入`orca -e magnifier`来启动 Orca。\n\
  \n要配置屏幕放大镜，请执行以下操作：\n\n1. 进入“辅助功能”面板并选择`Zoom`。显示如图 7-14 所示的屏幕。\n\n![Images](img/f0250-01.jpg)\n\
  \n**图 7-14** 配置屏幕放大镜\n\n2. 配置以下放大选项：\n\n![images](img/bull.jpg) **Magnification**\
  \ 使用的放大级别\n![images](img/bull.jpg) **Magnifier position** 放大镜光标的大小和颜色\n![images](img/bull.jpg)\
  \ **Crosshairs Settings** 放大镜的区域目标光标\n![images](img/bull.jpg) **Color Effects Settings**\
  \ 放大区域的颜色\n\n3. 完成后，选择`Close`。\n\n## 盲文设备\n\nLinux 用户也可以使用盲文硬件设备。系统支持多种类型的盲文显示器和凸点打印机。为了与这些类型的设备交互，Linux\
  \ 系统必须运行`brltty`守护进程。\n\n之前提到的`Orca`工具可支持盲文设备。通过搜索`Orca`并选择其图标启动 Orca。然后在`Orca`偏好设置中选择`Braille`选项卡。显示如图\
  \ 7-15 所示的屏幕。\n\n![Images](img/f0251-01.jpg)\n\n**图 7-15** 在 Orca 中配置盲文支持\n\n根据你的偏好和盲文设备，配置以下盲文选项：\n\
  \n![images](img/bull.jpg) **Enable Braille Support** 配置 Orca 使用盲文显示器。\n![images](img/bull.jpg)\
  \ **Enable Braille Monitor** 在常规显示器上配置盲文显示器，允许你通过视觉观察盲文显示设备上发生的情况。\n![images](img/bull.jpg)\
  \ **Enable Contracted Braille** 使用缩写盲文。\n![images](img/bull.jpg) **Abbreviated Role\
  \ Names** 在盲文显示上缩写角色名称。\n![images](img/bull.jpg) **Disable End of Line Symbol**\
  \ 不向盲文显示器发送`$l`结束符。\n![images](img/bull.jpg) **Verbosity** 控制发送到盲文显示器的详细程度。\n![images](img/bull.jpg)\
  \ **Selection Indicator** 屏幕上的被选文本在盲文显示上如何显示下划线。\n![images](img/bull.jpg) **Hyperlink\
  \ Indicator** 屏幕上的超链接在盲文显示上如何显示下划线。\n\n选择`OK`保存`Orca`盲文配置的更改。\n\n## 高对比度大字体桌面主题\n\
  \n我们将查看的最后一个可见性辅助选项涉及高对比度、大字体桌面主题。在“辅助功能”面板中，启用“视觉”项下的`High Contrast`和`Large Text`选项。这些选项之前在图\
  \ 7-11 中显示过。\n\n让我们在下面的练习中练习使用辅助设置。\n\n### 练习 7-1：使用辅助设置\n\n在本次练习中，你将在 Linux 系统上练习启用辅助设置。你可以使用书中附带的虚拟机进行此练习。运行快照\
  \ 7-1 以获得配置正确的环境。\n\n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 7-1 视频，演示如何执行此任务。\n\
  \n执行以下操作：\n\n1. 启动你的 Linux 系统并使用用户 `student` 和密码 `student` 登录。\n2. 从 KDE 桌面，点击 gecko\
  \ 图标。然后搜索并选择`Accessibility`。\n3. 点击`Modifier Keys`选项卡；然后启用`Sticky Keys`并选择`OK`。\n\
  4. 退出桌面。\n5. 使用使用用户 `student` 和密码 `student` 重新登录。\n6. 打开终端窗口并选择`View`菜单。注意增加窗口内文本大小的按键组合是`CTRL+-`。\n\
  7. 点击终端窗口以关闭`View`菜单。\n8. 按下并释放`CTRL`键；然后按`SHIFT+-`。注意尽管你没有按住`CTRL` 键，文本大小也增加了。\n\
  \n### 本章总结\n\n在本章中，我讨论了如何在你 Linux 系统上配置图形化 X 环境。我指出 Linux 图形环境由以下组件组成：\n\n- X 服务器\n\
  - 窗口管理器\n- 桌面环境\n\n这些组件每一个都是模块化的。你可以从各种软件包中选择，以根据你的喜好定制图形化环境。\n\n接下来我们查看了配置 X 环境的过程。我注意到，在配置中使用正确的设置至关重要。如果操作不当，可能会损坏你的显示器。在开始之前，你应该取出视频显卡和显示器的文档，并识别以下信息：\n\
  \n- 视频显卡的制造商是谁？\n- 视频显卡的型号是什么？\n- 视频显卡上安装了多少内存？\n- 显卡的最大分辨率是多少？\n- 显卡的最大色彩深度是多少？\n\
  - 板上安装了什么芯片？\n- 你的显示器支持的最大水平和垂直同步率是多少？\n\n就像 Linux 的其他一切一样，你的 X 配置存储在 `/etc` 目录下的一个文本文件中。如果你使用\
  \ X.org，配置设置保存在 `/etc/X11/xorg.conf`。如果你使用 XFree86，配置设置保存在 `/etc/X11/XF86Config`。`xorg.conf`文件分为多个部分，以\
  \ `Section \"*name\"` 指令开始并以 `EndSection` 结束。该文件包含以下部分：\n\n- **Files**: 该部分告诉 X\
  \ 服务器在何查找工作所需的文件，例如字体文件和输入设备文件。\n- **ServerFlags**: 该部分指定全局 X 服务器选项。\n- **Module**:\
  \ 该部分告诉 X 服务器在启动时加载某些服务器扩展和字体光栅化模块。\n- **InputDevice**: 该部分为 X 服务器配置应使用的输入设备。\n\
  - **Modes**: 该部分定义了 X 服务器可能使用的视频模式。\n- **Screen**: 该部分将你的视频显卡绑定到显示器。\n- **Monitor**:\
  \ 该部分定义了连接到显示适配器的显示器参数。\n\n\n\n\n\n# 服务器布局\n\n本节将之前的所有章节整合成一个完整的配置。\n\n基于 systemd\
  \ 的 Linux 发行版不使用 `xorg.conf` 配置文件。相反，X11 配置存储在 `/etc/X11/xorg.conf.d` 下的一系列配置文件中。然而，其配置原理基本相同。这些系统并不是将单个文件划分为多个部分，而是将单个文件拆分为独立的文件，例如\
  \ `10-evdev.conf`、`50-device.conf`、`50-monitor.conf` 和 `50-screen.conf`。这些文件中的语法与\
  \ `xorg.conf` 文件中使用的语法相同。\n\n我指出过，你应该避免直接编辑 X 服务器配置文件。相反，你应该使用配置工具来避免可能损坏你硬件的错误。根据你的发行版，你可以使用以下工具之一：\n\
  \n- YaST\n- SaX2\n- `xorgconfig` 或 `xorgcfg`\n- Xorg–configure\n- XFree-86 –configure\n\
  - `xf86config` 或 `xf86cfg`\n- `xvidtune`\n\n要指定默认窗口管理器，你需要编辑用户主目录下的一个隐藏配置文件。文件名取决于你的发行版和你的默认运行级别：\n\
  \n- `.xinitrc` (运行级别 3)\n- `.Xsession` (运行级别 5)\n- `.Xdefaults` (运行级别 5)\n- `.Xclients`\
  \ (运行级别 5)\n\n你也可以将 `WINDOWMANAGER` 环境变量设置为你想要使用的桌面环境。\n\n`xwininfo` 命令可用于显示图形桌面上打开窗口的信息。你可以运行该命令，然后点击你想要获取信息的窗口。你也可以直接使用命令的\
  \ `--id` 选项指定你想要获取信息的窗口 ID。`xdpyinfo` 命令可显示服务器的功能、客户端与服务器之间通信时使用的各种参数以及可用的不同屏幕模式。\n\
  \n接下来，我讨论了如何配置 X 字体服务器。X 字体服务器允许你从单一的中心位置为整个组织配置字体。你需要做的的第一件事是在 X 字体服务器上安装想要共享的字体。我讨论了位图字体（bitmap\
  \ fonts）和可缩字体（scalable fonts）之间的区别。然后我讨论了安装字体的位置：\n\n- Type 1: `/usr/share/fonts/Type1`\n\
  - TrueType: `/usr/share/fonts/truetype`\n\n将字体文件复制到相应的目录后，接下来你需要运行 `mkfontscale`\
  \ 和 `mkfontdir` 命令来创建字体描述文件并索引字体。然后，你需要在 X 服务器主机的防火墙中开放 7100 端口。接下来的工作是编辑 `/etc/X11/fs/config`\
  \ 文件，告诉 X 字体服务 (`xfs`) 字体已在那里并应该供远程 X 服务器客户端使用。在该文件中，你需要注释掉 `no-listen = tcp` 行，然后验证\
  \ `catalogue =` 下是否列出了正确的字体路径。\n\n完成后，你需要启动 `xfs` 守护进程并配置它在每次系统启动时启动。然后重启你的 X 服务器。\n\
  \n此时，我讨论了如何配置远程 X 服务器以使用 X 字体服务器提供的字体。这是通过在 `xorg.conf` 文件的 `Files` 部分添加新的 `FontPath`\
  \ 指令来实现，使用以下语法指向 X 字体服务器：\n\n`FontPath \"tcp/server_address:7100\"`\n\n然后我讨论了如何配置你的显示管理器。你可以使用\
  \ init 脚本目录中的 `xdm` init 脚本启用或禁用显示管理器。你可以使用 `chkconfig` 命令在系统启动时启用或禁用 init 脚本。\n\
  \n你可以通过编辑相应的配置文件来配置显示管理器：\n\n- `xdm`: `/etc/X11/xdm/xdm-config`\n- `kdm`: KDE 显示管理器实际上基于\
  \ `xdm`，通常使用 `xdm` 配置文件。然而，某些发行版将 `kdm` 设置存储在 `/etc/kde/kdm` 或 `/etc/X11/kdm` 中。\n\
  - `gdm`: `/etc/X11/gdm`\n- `LightDM`: LightDM 显示管理器使用几个不同的文件配置：\n    - `/usr/share/lightdm/lightdm.conf.d`\n\
  \    - `/etc/lightdm/lightdm.conf.d`\n    - `/etc/lightdm/lightdm.conf`\n\n本章以讨论如何配置\
  \ Linux 系统上的辅助设置结束。要做到，你需要启用辅助技术（Assistive Technologies）。你可以使用的工具之一是 `AccessX`，它允许你配置各种键盘辅助设置，让身体残障的用户可以使用传统的键盘：\n\
  \n- 粘性键 (StickyKeys)\n- 鼠标键 (MouseKeys)\n- 慢键 (SlowKeys)\n- 切换键 (ToggleKeys)\n-\
  \ 重复键 (RepeatKeys)\n- 反弹键 (BounceKeys)\n- 延迟键 (DelayKeys)\n\n对于无法使用传统键盘的身体残障用户，Linux\
  \ 提供了使用屏幕键盘的选项，允许用户使用任何指向设备（如鼠标）选择虚拟键盘上的键。\n\n除了键盘辅助，辅助技术还为身体残障用户提供了鼠标辅助选项。你可以配置以下内容：\n\
  \n- 模拟右键\n- 停留点击 (Dwell click)\n- 鼠标手势\n\n我们接下来查看了使用屏幕读器来帮助视障用户。屏幕读器会为用户“读出”屏幕上显示的文本。屏幕放大镜允许视障用户像使用真实的放大镜一样放大屏幕区域。\n\
  \n然后我们查看了在 Linux 上使用盲文设备来支持视障用户。系统支持多种类型的盲文显示器和凸字机。为了与此类设备建立接口，Linux 系统必须运行 `brltty`\
  \ 守护进程。`Orca` 也可以用于与盲文设备建立接口。\n\n为了帮助视障用户，你还可以实现高对比度、大字体的桌面主题。\n\n### 快速复\n\nLinux\
  \ 图形环境由以下组件组成：\n\n- X 服务器\n- 窗口管理器\n- 桌面环境\n\nLinux 系统上实现了两种不同的 X 服务器软件包：\n\n- X.org-X11\n\
  - XFree86\n\n一些较流行的窗口管理器包括：\n\n- enlightenment\n- fvwm\n- kwin\n- sawfish\n- twm\n\
  - wmaker\n\n今天 Linux 系统主要使用两种桌面环境：\n\n- KDE\n- GNOME\n\n在在 Linux 上实现显卡/显示器组合之前，你需要检查你发行版的\
  \ HCL（硬件兼容列表），并确保你的显卡和显示器受到支持。\n\n你的 X 配置存储在 `/etc` 目录下的文本文件中：\n\n- XFree86: `/etc/X11/XF86Config`\n\
  - X.org: `/etc/X11/xorg.conf`\n\n`xorg.conf` 文件被分为以 `Section` 指令开始并以 `EndSection`\
  \ 结束的章节。\n\n典型的 `xorg.conf` 中最常用的部分包括：\n\n- `Files`: 告诉 X 服务器在何处寻找工作所需的文件\n- `ServerFlags`:\
  \ 指定全局 X 服务器选项\n\n\n\n\n\n![images](img/bull.jpg) `Module` 模块告诉 X 服务器在启动时加载特定的服务器扩展和字体光栅化模块。\n\
