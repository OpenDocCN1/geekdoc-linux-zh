  \ 上的当前时区？\n\nA. `TIMEZONE`\nB. `UTC`\nC. `TZ`\nD. `TIME`\n\n### 答案\n\n**1. A, D.**\
  \ 你应该确定为什么需要新系统以及谁将使用它们。\n\n**2. D.** 这一回答清楚地陈述了项目的目标并且是可衡量的。\n\n**3. A, B.** Karen\
  \ 的老板和她的同事是该项目的关键利益相关者。\n\n**4. C, D.** 项目范围由规模和资源组成。\n\n**5. B.** 交换分区的大小取决于系统的用途。\n\
  \n**6. C, E.** 要么缩小规模，要么必须增加资源。\n\n**7. B, E.** Red Hat Enterprise Desktop 和 SLED\
  \ 针对这些任务进行了优化。\n\n**8. A, D.** Red Hat Enterprise Linux 和 SUSE Linux Server 是为服务器设计的。\n\
  \n**9. C.** 最佳方法是使用支持的硬件。\n\n**10. D.** 32 位 CPU 使用 `x86` 架构。\n\n**11. C.** 64 位\
  \ AMD CPU 使用 `x86-64` 架构。\n\n**12. C.** `ext4` 文件系统最快，它使用增强日志提高恢复速度的同时维护了系统的完整性。\n\
  \n**13. B.** Linux 系统使用专门的 `swap` 分区作为虚拟内存。\n\n**14. D.** 交换分区的大小取决于系统的用途。同时运行应用程序的工作站需要较大的交换分区。提供网络服务的可能不需要那么大。\n\
  \n**15. B, D, E.** 你应该考虑为 `/boot`、`/usr` 和 `/home` 创建单独的分区。\n\n**16. A, C, D.**\
  \ 端口 110 用于 POP3 电子邮件协议。端口 25 用于 SMTP 电子邮件协议。端口 143 用于 IMAP 电子邮件协议。\n\n**17. D.**\
  \ 这个问题最可能的原因是系统被设置为首先从硬盘启动。当在硬盘上找不到操作系统时，就会显示错误信息。\n\n**18. C.** `/dev/sdb` 指向系统中安装的第二个硬盘。\n\
  \n**19. A.** `/dev/sda1` 指向系统中第一个硬盘上的第一个分区。\n\n**20. C.** `/dev/sda2` 指向第一个硬盘上的第二个分区。\n\
  \n\n\n\n\n- [21]. C. `/dev/sdb1` 指向系统中第二个硬盘上的第一个分区。\n- [22]. B. `LC_CTYPE` 环境变量配置默认的字符编码。\n\
  - [23]. B. `fr_CA.UTF-8` 区域值指定使用 Unicode 编码的加拿大法语法语。\n- [24]. A. `LC_ALL` 区域变量会覆盖所有其他区域变量。\n\
  - [25]. C. 当 UTC/GMT 下午 5:00 时，CST 是 上午 11:00，因为 CST 比 UTC 早六个时区。\n- [26]. A. `/etc/sysconfig/clock`\
  \ 文件中的 `TIMEZONE` 指令指定 Linux 系统使用的哪个时区。\n- [27]. C. `TZ` 环境变量可以设置 Linux 上的当前时区。\n\
  \n# 第 6 章：管理 Linux 启动过程\n\n在本章中，你将学习到：\n\n- Linux 启动过程\n- 配置引导加载程序\n- 使用 `init`\
  \ 管理 Linux 运行级别（runlevels）\n- 管理 Linux 启动目标（boot targets）\n- 关系统\n\n在上一章中，你学习了如何安装\
  \ Linux。现在你的 Linux 系统已经运行起来，你需要学习如何管理它的启动方式，以及如何在系统上启动和停止服务。在本章中，我们将深入探讨 Linux 启动过程以及如何管理运行级别。\n\
  \n**考试提示**：对于你的 LPIC-1/Linux+ 考试，你需要深入理解 `init` 和 `systemd` 的 Linux 启动过程工作原理。如果你能画出每个过程的图，说明你的考试准备得很充分。此外，你还需要非常熟悉\
  \ `LILO`、`GRUB` 和 `GRUB2` 引导加载程序。针对特定的 Linux 系统，你需要能够识别它在使用哪种引导加载程序并知道如何配置它。你还需要知道如何管理\
  \ Linux 运行级别，以及如何从 shell 提示符更改运行级别。你应该知道如何使用 `inittab` 文件来指定系统的默认运行级别，并且必须知道如何指定每个运行级别下默认运行哪些服务。\n\
  \n让我们从讨论 Linux 启动过程的工作开始本章。\n\n## Linux 启动过程\n\n作为 Linux 管理员，你需要理解的一个关键概念操作系统本身是如何启动的。Linux\
  \ 启动过程比你可能熟悉的其他操作系统启动过程要复杂一点。因此，我们将在本章开头花些时间概述该过程的工作原理。理解启动过程将对我们稍后讨论如何配置引导加载程序、运行级别和\
  \ `init` 脚本非常有帮助。\n\n**注意**：我们在本章中讨论的启动过程本质上是通用的。大多数 Linux 发行版将遵循相同的基本过程，尽管具体实现可能在发行版之间有所不同。该过程在旧版本和新版本的\
  \ Linux 内核之间也存在差异。\n\n20 世纪 90 年代中期当我第一次启动 Linux 系统时，系统启动时屏幕上显示了一系列晦懂的信息（至少对我来说是这样）。我当时是在\
  \ DOS 和 NetWare 上起练手的；我完全不知道这些信息在说什么。这个所谓的 `vmlinuz` 到底是什么？\n\n今天，大多数 Linux 操作系统的启动信息都被大多数流行发行版的启动画面（splash\
  \ screens）隐藏了，如图 6-1 所示。\n\n![Images](img/f0170-01.jpg)\n**图 6-1** Linux 启动画面\n\n\
  这些启动画面让界面变得美观且让初学者不再那么无畏，但它们也隐藏了许多有用信息。幸运的是，对于大多数发行版，如果你在启动画面显示时按下 `ESC` 键，仍然可以看到这些信息。示例如图\
  \ 6-2 所示。\n\n![Images](img/f0171-01.jpg)\n**图 6-2** Linux 启动信息\n\n**提示**：启动信息滚动得通常太快，无法阅读。你可以在\
  \ shell 提示符输入 `dmesg | more` 来查看启动过程中显示的消息。\n\n我强烈建议你在读完本章这部分后执行此操作。这将有助于巩固我们即将回顾的启动过程概念。为了让\
  \ Linux 启动过程更易理解，我们将其分解为以下阶段：\n\n- BIOS 阶段\n- 引导加载程序阶段\n- 内核阶段\n\n让我们从讨论 BIOS 阶段开始。\n\
  \n### BIOS 阶段\n\n无论你使用什么操作系统，当你第一次开启 x86 或 x86-64 个人电脑时，系统 BIOS 是第一个接管启动过程的组件。系统\
  \ BIOS 是集成在主板上的 ROM 芯片，包含系列非常微小的程序和驱动程序，允许 CPU 与基本系统设备通信，例如键盘、I/O 端口、系统扬声器、系统 RAM、软盘驱动器和硬盘。关于系统的变量信息（如安装的\
  \ RAM 数量和硬盘的几何结构）存储在 CMOS 芯片中。BIOS 使用 CMOS 芯片中的数据来寻这些设备。\n\nBIOS 在启动过程中扮演两个关键角色。首先，它测试各种系统组件并确保它们工作正常。这被称为*上电自检*（power-on\
  \ self-test），也被亲切地称为 *POST*。如果 BIOS 在 `POST` 期间遇到系统设备的任何问题，它将在屏幕上显示一条晦涩的错误信息，或者播放一系列代码鸣声。你可以使用你的\
  \ BIOS 文档（通过在网上搜索主板型号或 BIOS 制造商可以轻松获得，有时也包含在主板书中）来解释这些信息，以确定系统到底出了什么问题。\n\nBIOS\
  \ 扮演的第二个角色是选择一个存储设备从从中启动操作系统。大多数 CMOS 系统设置程序允许你配置 BIOS 寻找可启动介质的顺序。在图 6-3 中，系统被配置为首先查找任何可移动设备，然后是本地硬盘，最后是光驱。\n\
  \n![Images](img/f0172-01.jpg)\n**图 6-3** BIOS 启动媒体选项\n\nBIOS 将从列表中找到的第一个可启动设备启动。回想在上一章中，我告诉过你确保\
  \ BIOS 设置为先从光驱启动；否则，你可能无法加载 Linux 安装程序。如果 BIOS 在列表较靠的位置发现了可启动设备，它就无法到达你想要启动的光盘了。\n\
  \n那么 BIOS 是如何知道一个设备是否可启动的呢？它查看设备的第一个扇区，该扇区被称为*启动区*（boot sector）。在硬盘驱动器上，启动区包含主引导记录（MBR）。我们将在将在引导加载程序阶段讨论\
  \ MBR 的作用。\n\n### 引导加载程序阶段\n\n在运行 `POST` 之后，BIOS 真的没多少事可做了。它已经完成了工作，并准备将系统控制权交给别人。为了做到这一点，它需要知道可以接管系统的程序位于何处。为了学习这一点，它会在系统硬盘上寻找\
  \ MBR。\n\n\n\n\n\nMBR 位于你系统硬盘驱动器的引导扇区。它在 Linux 系统的启动过程中起着关键作用。MBR 告诉系统引导程序（bootloader）所在的位置。引导程序有一项非常重要的任务。这里的问题在于，你的计算机需要某种类型的操作系统来访问硬盘并将数据从中加载到\
  \ RAM 中。在启动过程的这一阶段，我们需要将操作系统本身从硬盘加载到内存中。如果你需要一个操作系统才能从硬盘加载数据，那么你该如何从硬盘将操作系统加载到内存中呢？\n\
  \n这就是引导程序的工作。`bootloader` 是一种 BIOS 可以从硬盘的 MBR 加载的软件，它允许 CPU 访问磁盘并将操作系统加载到 RAM。为了实现这一点，引导程序配置了操作系统文件在硬盘驱动上的位置。\n\
  \n引导程序软件本身可能在、也可能不在 MBR 中。正如你在本章稍后部分看到的，你可以将某些引导程序安装在 MBR 中，也可以将其安装在硬盘上其他地方的分区，并在\
  \ MBR 中放置一个指针。其他的引导程序实际上同时存在于这两个地方。\n\n将引导程序软件加载到内存后，BIOS 将系统的控制权移交给引导程序。引导程序可以被配置为自动从硬盘加载操作系统，也可以被配置为为终端用户提供一个菜单，允许他们选择加载哪个操作系统。\n\
  \n对于较晚的 Linux 内核，引导程序还可以在你的系统 RAM 中创建一个名为 `ramdisk` 的临时虚拟文件系统。根据你使用的发行版，该文件系统被称为\
  \ `initrd image` 或 `initramfs image`。\n\n***\n\n![Images](img/note.jpg)\n\n**注意**\
  \ `initrd` 一词代表“初始内存磁盘”（initial ramdisk），而 `initramfs` 代表“初始内存文件系统”（initial ram\
  \ file system）。两种类型的镜像执行相同的功能，即提供设置系统的 `linuxrc`。\n\n该镜像包含一个基础文件系统，可以用于完成各种启动任务。使用\
  \ RAM 镜像的原因是 Linux 系统可以使用各种设备作为根（`/`）文件系统。某些设备可能从外部 USB 存储设备或软件 RAID 阵列创建；某些设备甚至位于另一台计算机上，并通过\
  \ NFS、Samba 或 iSCSI 服务访问。这些类型的文件系统在加载特殊软件（当然，这些软件位于这些文件系统上）之前，内核无法挂载它们。这是无法实现的！\n\
  \n为了在这些情况下让系统正确启动，引导程序会在内存中创建一个名为 `ramdisk` 的小型虚拟硬盘，并将来自 `initrd` 或 `initramfs`\
  \ 镜像的临时根文件系统传输到那里。Linux 内核可以使用这个临时文件系统来加载软件，并完成其挂载这些其他类型设备上的真实文件系统所需的任务。\n\n###\
  \ 内核阶段\n\n选择好运行的操作系统后，引导程序将操作系统内核从硬盘加载到 RAM。对于我们而言，引导程序将 Linux 内核加载到 RAM。Linux 内核位于文件系统的\
  \ `/boot` 目录，所示：\n\n![Images](img/p0174-01.jpg)\n\n你的内核是此目录下的 `vmlinuz-*version.gz`\
  \ 文件。你可能已经内核是一个 `.gz` 文件。这是因为内核以压缩文件的形式存储在硬盘上。你可能在第一次启动 Linux 系统时注意到，屏幕上会显示类似“正在解压\
  \ Linux”之类字的消息。现在你知道为什么了！\n\n内核加载后，会发生几件关键事件，包括以下内容：\n\n![images](img/bull.jpg)\
  \ 内核使用 BIOS 和 CMOS 芯片中的各种设置初始化系统中的基础硬件。\n\n![images](img/bull.jpg) 内核搜索并使用 `initrd`\
  \ 或 `initramfs` 文件系统来运行 `linuxrc` 程序以设置系统。\n\n![images](img/bull.jpg) 当 `linuxrc`\
  \ 执行完成后，`initrd` 或 `initramfs` 文件系统被卸载，`ramdisk` 被销毁。\n\n![images](img/bull.jpg)\
  \ 内核探测新硬件并加载相应的驱动模块。\n\n![images](img/bull.jpg) 挂载真实的根（`/`）文件系统。\n\n![images](img/bull.jpg)\
  \ 内核加载 `init` 或 `systemd` 进程。\n\n使用哪种进程取决于你的发行版。旧的 Linux 发行版几乎只使用 `init` 进程。然而，大多数当前的发行版已切换到\
  \ `systemd` 进程。因此，`systemd` 进程替换了 `init` 进程及其启动脚本（我们将在本章稍后部分回顾）。`systemd` 进程还控制许多其他未由传统\
  \ `init` 进程管理的 Linux 服务，例如用户登录和主机名配置。另一个关键区别是 `systemd` 可以并行运行其启动进程，而不是像旧的 `init`\
  \ 进程那样顺序执行。\n\n无论你的发行版使用哪种守护进程，`init` 或 `systemd` 进程都是运行系统其余部分所需的关键进程。在启动过程的这一阶段，位于\
  \ `/etc/inittab` 文件中的配置参数被用于加载系统进程并使系统运行。一旦完成这些，你就可以登录并使用系统了。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 从 `init` 到 `systemd` 的转换在 Linux 社区引起了争议。许多 Linux 开发者和管理员倾向于使用 `init` 而非\
  \ `systemd`，而另一些人则相反。由于这种原因，某些发行版拒绝迁移到 `systemd` 并坚持使用 `init`。你还应该意识到，在 2000 年代中期使用过一种短暂的第三选择，叫做\
  \ `Upstart`。目前，只有 Google Chrome OS 发行版仍在使用 `Upstart`。所有其他使用过 `Upstart` 的发行版此已切换到\
  \ `systemd`。\n\n图 6-4 显示了启动过程的概述。\n\n![Images](img/f175-01.jpg)\n\n**图 6-4** 启动过程概述\n\
  \n### 配置引导程序\n\n如你所见，引导程序在 Linux 启动过程中起着极其重要的作用。没有引导程序，BIOS 将无法从系统的硬盘上加载操作系统。因此，你对如何配置引导程序有一个良好的理解是非常重要的。\n\
  \n与 Linux 的许多方面一样，你可以选择许多不同的引导程序供你的 Linux 系统使用。但对于你的 LPIC-1/Linux+ 考试，你只需要熟悉两个引导程序：`GRUB\
  \ Legacy` 和 `GRUB2`。因此，在本章的部分我们将花时间研究以下主题：\n\n![images](img/bull.jpg) 配置 GRUB Legacy\n\
  \n![images](img/bull.jpg) 配置 GRUB2\n\n让我们先查看 GRUB Legacy。\n\n### 配置 GRUB Legacy\n\
  \nGRUB。多么引导程序的名字！`GRUB` 这个缩写听起来并不吸引人，对吧？然而，作为引导程序，GRUB 是非常棒的。GRUB 代表 `Grand Unified\
  \ Bootloader`（全局统一引导程序）。GRUB 是一种可以从你的系统硬盘启动 Linux 内核（或者任何其他操作系统内核）的引导程序。\n\n`GRUB\
  \ Legacy` 引导程序非常流行，并使用了多年。然而，在过去的几年里，大多数发行版已逐渐从 `GRUB Legacy` 转向 `GRUB2`。但是，你仍然需要牢固地理解\
  \ `GRUB Legacy` 的原理以及如何配置它。\n\n\n\n\n\n在本章的这一部分，我们将讨论以下 GRUB 主题：\n\n![images](img/bull.jpg)\
  \ GRUB Legacy 的工作原理\n\n![images](img/bull.jpg) 安装 GRUB Legacy\n\n![images](img/bull.jpg)\
  \ 配置 GRUB Legacy\n\n让我们先开始讨论 GRUB Legacy 是如何工作的。\n\n## GRUB Legacy 的工作原理\n\nGRUB\
  \ Legacy 引导加载器被分为不同的阶段，称为 `stages`。这些阶段包括：\n\n![images](img/bull.jpg) **第 1 阶段**\
  \ GRUB 的此阶段通常存储在 MBR 中。它唯一的工作是指向第 1.5 阶段或第 2 阶段的位置。\n\n![images](img/bull.jpg) **第\
  \ 1.5 阶段** GRUB 的此阶段位于硬盘 MBR 之后的前 30KB 区域，但在第一个分区之前。第 1.5 阶段包含了加载第 2 阶段所需的所有驱动程序。\n\
  \n![Imags](img/tip.jpg)\n\n**提示** 第 1 阶段可以跳过第 1.5 阶段直接加载第 2 阶段，但它通常被配置为先加载第 1.5\
  \ 阶段。\n\n![images](img/bull.jpg) **第 2 阶段** GRUB 的此阶段存储在磁盘分区中。当被第 1 阶段或第 1.5 阶段加载时，第\
  \ 2 阶段会在屏幕上显示图形菜单，允许用户选择应该加载的内核镜像。你可以为 GRUB 配置默认镜像和超时值。如果用户在超时时间内未选择选项，系统将自动启动默认内核镜像。典型的\
  \ GRUB 菜单如图图 6-5 所示。\n\n![Images](img/f0177-01.jpg)\n\n**图 6-5** GRUB 引导菜单\n\n![Images](img/note.jpg)\n\
  \n**注意** GRUB 还允许将第 1 阶段安装在引导分区中。\n\n有了这个概述，让我们来讨论如何安装 GRUB。\n\n## 安装 GRUB Legacy\n\
  \n我非常喜欢 GRUB 的点之一是每当你进行微小的配置更改时，不需要重新安装引导加载器。在最初安装引导加载器后，你可以修改配置文件，将在下次 GRUB 加载时生效，因为第\
  \ 2 阶段直接从磁盘上的配置文件读取内容。\n\n要首次安装 GRUB，首先需要验证系统中已安装了 grub 软件包。在基于 rpm 的发行版中，可以在 shell\
  \ 提示符处输入 `rpm –q grub` 来完成，如下：\n\n![Images](img/p0178-01.jpg)\n\n此输出告诉我们 GRUB 软件包已安装。如果你看到命令没有输出，则说明\
  \ GRUB 尚未安装，在继续之前必须进行安装。\n\n要安装 GRUB 引导加载器本身，在 shell 提示符处输入 `grub-install *device*`。`device`\
  \ 是指你想将第 1 阶段安装到其 MBR 中的设备名称。例如，如果你想在系统中第一块硬盘的 MBR 中安装 GRUB 第 1 阶段，你应该输入 `grub-install\
  \ /dev/sda`，如示例所示：\n\n![Images](img/p0178-02.jpg)\n\n安装 GRUB 后，你就可以准备配置它了。接下来让我们讨论如何实现。\n\
  \n## 配置 GRUB\n\n要配置 GRUB，你需要编辑一个文本格式的配置文件。然而，你需要编辑的文件名可能因发行版而异。表 6-1 列出了按发行版的一些常见实现。\n\
