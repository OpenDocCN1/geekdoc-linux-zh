  \ sort 命令，按字母顺序排序并显示在屏幕上。哪些命令可以实现这一点？（选择两个。）\n\nA. `sort < logfile.txt`\nB. `sort\
  \ logfile.txt`\nC. `sort < logfile.txt –o “screen”`\nD. `sort < logfile.txt > screen`\n\
  E. `sort –n logfile.txt`\n\n### 18. 你想在屏幕上显示 /var/log/messages 中任何包含“syslog”术语的行的第六、第七和第八个单词。以下哪个命令可以实现这一点？\n\
  \nA. `cat /var/log/messages | awk ‘/syslog/ {print $6,$7,$8}’`\nB. `cat /var/log/messages\
  \ | awk ‘/syslog/ {print 6,7,8}’`\nC. `cat /var/log/messages | awk /syslog/ {print\
  \ $6,$7,$8}`\nD. `cat /var/log/messages | awk ‘syslog {print 6,7,8}’`\n\n### 19.\
  \ 你的文字处理程序在硬盘的各个位置留下了数百个备份文件。这些文件已不再需要，并且占用了大量的磁盘空间。由于文件非常多，你不想一个一个地删除它们。你尝试使用 find\
  \ 命令将备份文件列表（全部以 ~ 字符结尾）发送给 rm 命令，但文件列表太长了。你应该怎么办？\n\nA. 将 `find` 的输出通过到 `xargs`\
  \ 命令。\nB. 使用 `rm` 逐个删除文件。\nC. 将 `find` 的输出通过到 `del` 命令而不是 `rm`。\nD. 将 `find` 的输出通过到\
  \ `rmdir` 命令而不是 `rm`。\n\n### 20. 你需要在家目录下名为 proj_sched.txt 的文件中搜索并将单词“June”替换为“July”，并将输出发送到名为\
  \ new_proj_sched.txt 的新文件中。哪个命令可以实现这一点？\n\nA. `cat ~/ proj_sched.txt | sed s/June/July/`\n\
  B. `cat ~/ proj_sched.txt | awk s/June/July/`\nC. `cat ~/ proj_sched.txt | awk s/June/July/\
  \ 1> new_proj_sched.txt`\nD. `cat ~/ proj_sched.txt | sed s/June/July/ 1> new_proj_sched.txt`\n\
  \n### 答案\n\n1. **B.** 每一个 bash 脚本的开头必须包含 `#!/bin/bash` 元素。\n\n2. **A, E.** 你可以输入\
  \ `/bin/bash ~/myscript` 或 `chmod u+x ~/myscript` 来使脚本执行。\n\n3. **B.** `declare\
  \ –i TOTAL` 命令将创建 `TOTAL` 变量并将其类型设置为整数。\n\n4. **A.** `echo “Hello world”` 命令会在 shell\
  \ 脚本内部在屏幕上显示“Hello world”文本。\n\n5. **C.** shell 脚本中的 `read PHONE` 命令将用户输入的值赋值给名为\
  \ `$PHONE` 的变量。\n\n6. **C.** `test` 命令可以在 if/then/else 结构内部使用，用于评估指定条件是否真。\n\n7.\
  \ **C.** 如果变量 `num1` 小于变量 `num2`，`test num1 –lt num2` 命令在 if/then/else 结构中的结果为真。\n\
  \n8. **E.** `case` 结构根据用户的选择来执行相应的命令集。\n\n9. **A.** `while` 循环只要指定条件为真就会一直运行。\n\n\
  10. **D, E.** if/then/else 和 case 结构被认为是分支结构，因为它们根据条件分支。\n\n11. **C.** `until` 循环结构在指定条件为假时一直运行。\n\
  \n12. **B.** `for` 循环结构执行指定的次数。\n\n13. **A.** `seq 3 9` 命令将生成以下序列：3, 4, 5, 6, 7,\
  \ 8, 9。第一个数字指定了起始数字。\n\n14. **A.** `cut` 命令可以使用制表符作为分隔符，将文件中指定的列或字段打印到标准输出。\n\n\
  15. **C.** `expand` 命令可以处理文本流，删除所有制表符实例并将其替换为八个空格。\n\n16. **D.** `nl` 命令可以处理文件或文本流，并在每新行的开头添加数字。\n\
  \n17. **A, B.** `sort < logfile.txt` 命令和 `sort logfile.txt` 命令可以将 logfile.txt 文件的内容发送给\
  \ sort 命令，按字母顺序排序并显示在屏幕上。\n\n18. **A.** `cat /var/log/messages | awk ‘/syslog/ {print\
  \ $6,$7,$8}’` 命令会在 cat 的输出中查找“syslog”，并打印第六、第七和第八个单词。\n\n19. **A.** `xargs` 命令在这种情况下用于将数据拆分成\
  \ 128KB 的块，然后发送给 rm 命令，使其足够让 shell 处理。\n\n20. **D.** `cat ~/ proj_sched.txt | sed\
  \ s/June/July/ 1> new_proj_sched.txt` 命令会在 proj_sched.txt 文件中搜索“June”并将其替换为“July”。sed\
  \ 的输出将写入名为 new_proj_sched.txt 的文件。\n\n# 第 15 章\n## 管理 Linux 网络设置\n\n在本章中，你将学习：\n\
  - 理解 IP 网络\n- 配置地址参数\n- 排除网络故障\n\n到本书为止，我们一直关注于配置和使用 Linux 作为独立系统。然而，Linux 也可以被配置在网络环境中运行。与许多操作系统不同，Linux\
  \ 从设计之初就考虑了网络。\n\n我喜欢 Linux 的原因之一是，你可以采取任何发行版并将其配置为承担网络中的各种角色，而且几乎不需要成本。例如，你可以将\
  \ Linux 系统配置为以下任何设备：\n- 网络工作站\n- 文件和打印服务器\n- 数据库服务器\n- DHCP 服务器\n- DNS 服务器\n- Web\
  \ 服务器\n- 电子邮件服务器\n- 域控制器\n- LDAP 目录服务器\n- 网关路由器\n- 软件包过滤、状态检测或应用层防火墙\n\nLinux 不是太棒了吗？在其他操作系统中，你必须花费大量资金才能获得这些功能。而使用\
  \ Linux，你拥有了建立非常复杂网络所需的一切。在本章中，我们将重点在你的 Linux 系统上启用基础网络。在下一章中，我们将讨论如何设置各种 Linux\
  \ 服务。\n\n\n\n\n\n![Imags](img/examtip.jpg)\n\n# 考试提示 在参加 Linux+/LPIC-1 考试之前，请确保你非常熟悉\
  \ Linux 网络基础知识。考试假设你对网协议（IP）有深入理解。请确保你理解 IPv4 和 IPv6 的 IP 地址工作原理。你应该能够查看任何给定的 IP\
  \ 地址并识别它是 A 类、B 类或 C 类地址。你应该能够使用子网掩码识别地址中的网络部分和节点部分。你应该知道在 Linux 系统上配置网络设置时，DNS\
  \ 服务器和默认网关路由器的用途。你还应该知道如何在系统中安装网络接口，包括以太网卡和调制解调器。你应该知道如何使用 `ifconfig` 命令来管理系统中安装的网络接口。\n\
  \n你还应该知道如何使用 `dig`、`ping`、`netstat` 和 `traceroute` 等命令来排查网络配置。\n\n让我们通过回顾如何使用 IP\
  \ 协议实现网络系统之间的通信来开始本章。\n\n## 理解 IP 网络\n\n在配置 Linux 系统参与计算机网络之前，你必须首先安装某种网络接口，然后对其进行配置以便在特定网络上工作。在网络技术的早期，你可以从各种网络接口和网络协议中进行选择。然而，你今天处理的大多数网络将是使用\
  \ IP 协议的以太网网络。考虑到这种情况，Linux+/LPIC-1 考试侧重于在 Linux 系统中使用配置了 IP 协议以太网卡。我们将在本章的第一部分学习如何做到这一点。\n\
  \n对于你的 Linux+/LPIC-1 考试，你需要精通 IP 协议（包括版本 4 和版本 6）。你需要知道如何配置该协议使系统能够参与网络。为了确保你拥有所需的信息，我们将在本章的这一部分简要回顾\
  \ IP 地址分配。我们将涵盖以下主题：\n\n![images](img/bull.jpg) 什么是协议？\n\n![images](img/bull.jpg)\
  \ IPv4 地址如何工作\n\n![images](img/bull.jpg) IPv4 子网掩码如何工作\n\n![images](img/bull.jpg)\
  \ 指定 DNS 服务器和默认网关路由器地址\n\n![images](img/bull.jpg) 使用 IPv6\n\n让我们从讨论什么是协议开始。\n\n\
  ### 什么是协议？\n\n所以到底什么是协议？严格来说，`protocol`（协议）是一组规则，在网络上下文中，协议是管理两个系统之间通信的规则集。协议的一个很好的类比是人类语言。在两个人交流之前，他们必须说同一种语言；否则，他们之间无法传输任何信息。例如，假设你给一个不会说你母语言的人打电话。尽管他们接听了听筒并正在听你发送的信息，但他们并不懂你说什么。为什么？因为你们没有共同的语言。\n\
  \n计算机系统也是如此。在它们共享信息之前，必须被配置为使用相同的协议。协议规定了信息在网络上如何编码和发送，以便接收系统能够解释它并重构原始发送的数据。\n\n\
  正如之前讨论的，在计算机网络上，有许多不同的协议可以可以使用。然而，对于你的 Linux+/LPIC-1 考试，你需要熟悉 IP 协议，这是互联网上使用的网络协议。IP\
  \ 与其他协议（如传输控制协议 (TCP) 或用户数据报协议 (UDP)）结合工作，将正在网络上传输的信息划分为块。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** IP 协议的两个版本被称为 IPv4 和 IPv6。我们将在本章中首先讨论 IPv4，然后探索 IPv6。\n\n为了理解这个过程是如何运作的，你需要对\
  \ OSI 参考模型有深入的理解。OSI 参考模型是由主要计算机和电信公司的代表在 1983 年设计的。其目标是设计一种模块化的网络通信模型，以便来自不同供应商的产品可以相互操作。在此之前，网络解决方案倾向于是专有的，迫使实施者从同一家供应商处购买所有组件。通过定义\
  \ OSI 参考模型，行业创建了一个标准，允许你从不同的供应商处选择组件。\n\nOSI 参考模型将两个主机之间的通信过程分为若干层。这在图 15-1 所示。\n\
  \n![Images](img/f0541-01.jpg)\n\n**图 15-1** OSI 参考模型\n\n这些层将整个通信过程分解为特定的任务。信息在发送系统的层向下流动，然后在网络介质上传输。然后信息在接收端的层向上流动。\n\
  \nOSI 参考模型共有七层：\n\n![images](img/bull.jpg) **物理层** 在主机之间传输电信号。\n\n![images](img/bull.jpg)\
  \ **数据链路层** 定义访问物理层的规则和程序。它定义了如何在网络上识别主机以及如何访问网络介质。它还规定了如何验证从物理层接收到的数据是否有错误。从上层接收的信息被组织成\
  \ `datagrams`（数据报）。\n\n![images](img/bull.jpg) **网络层** 实现数据路由。它规定了如何识别相邻节点和路由器的地址。它还规定了如何确定数据包向目标转发的下一个网络点。互联网协议\
  \ (IP) 和互联网控制消息协议 (ICMP) 运行在此层。\n\n![images](img/bull.jpg) **传输层** 在发送主机上，传输层接收来自\
  \ OSI 模型上层的信息并将其划分为小的、可传输块，称为 `packets`（数据包）。在接收主机上，传输层从来自 OSI 模型下层接收的数据报中重组数据包。传输层提供错误检查机制，确保数据完整地到达目标主机。传输控制协议\
  \ (TCP) 和用户数据报协议 (UDP) 运行在此层。\n\n![images](img/bull.jpg) **会话层** 负责建立和维护源目的网络主机之间的连接。这些连接被称为\
  \ `sessions`（会话）。\n\n![images](img/bull.jpg) **表示层** 负责确保通过 OSI 层的信息对于目标系统上的应用程序是格式正确的。\n\
  \n![images](img/bull.jpg) **应用层** 负责为应用程序提供访问网络的方法。\n\nIP 协议本身仅用于确保每个数据包到达目标系统。TCP\
  \ 或 UDP 协议配合 IP 一起分段发送主机的数据，并在到达目标系统时进行重组和重新排序。这在图 15-2 所示。\n\n![Images](img/f0543-01.jpg)\n\
  \n**图 15-2** 使用 IP 协议传输数据\n\n互联网协议 (IP) 是互联网上使用的协议。它是一种无连接协议，旨在确保数据到达目标主机。IP 协议依赖于\
  \ TCP 或 UDP 协议将信息分解为可传输的块（数据包）。IP 将每个数据包视为独立的数据单元，独立于其他数据单元。关于 IP 的关键点是，它不关心分片或重新排序。它只确保每个数据包到达目的地。\n\
  \n\n\n\n\n跟踪单个数据包的工作属于传输控制协议（`TCP`）。`TCP` 是 `IP` 协议套件的两个原始组件之一。整个套件通常被称为 `TCP/IP`，但在技术上这并不准确，因为\
  \ `UDP` 也可以与 `IP` 一起使用。\n\n`TCP` 协议确保数据在两个网络主机之间可靠地交换。它是通过要求发送者发送到接收者的每个数据包都必须获得确认来实现的。由于\
  \ `IP` 协议的工作方式，数据包可能会丢失、重复或乱序交付。`TCP` 会检测到这些问题，请求重传丢失的数据包，并对乱序接收的数据包重新排序。从本质上，`TCP`\
  \ 确保接收系统上的最终重组数据是原始传输数据的完美复制。\n\n将 `TCP` 与 `IP` 结合就像在使用快递公司使用签名确认。当你发送一个包裹时，发货公司要求接收者对包裹签字，从而允许发送者验证包裹已正确收到。`TCP/IP`\
  \ 的工作方式非常相似。\n\n`TCP` 协议被需要高度数据完整性的上层应用使用，包括：\n\n![images](img/bull.jpg) Web 服务器\n\
  ![images](img/bull.jpg) 电子邮件服务器\n![images](img/bull.jpg) FTP 服务器\n\n然而，`TCP` 提供的数据保真度是需要代价的，主要表现为延迟。`TCP`\
  \ 需要大量的网络和处理开销。并不是所有的网络应用实际上都需要 `TCP` 提供的高数据保真度。某些上层应用需要的延迟较低，并且可以容忍较低的可靠性。这些应用使用用户数据报协议（`UDP`）而不是\
  \ `TCP`。\n\n`UDP` 的功能与 `TCP` 类似；然而，它是一个`无连接`协议。在 `UDP` 中，`IP` 数据包在不经确认的情况下发送。`UDP`\
  \ 通常用于一次发送极少量数据的应用程序。它假设错误检查和纠正不是必要的，或者将由应用程序执行，从而避免了处理开销。\n\n在这方面，`UDP` 类似于通过邮寄给某人明片。明片不包含太多数据，接收者也不必签字。从本质上，发送者假设邮差是相当可靠的，明片上的信息并不重要到需要接收者签字。`UDP`\
  \ 的工作方式如此。使用 `UDP` 的某些上层应用包括：\n\n![images](img/bull.jpg) 流媒体音频和视频\n![images](img/bull.jpg)\
  \ VoIP\n\n除了 `IP`、`TCP` 和 `UDP`，为了你的 `Linux+/LPIC-1` 考试，还需要熟悉互联网控制消息协议（`ICMP`）。`ICMP`\
  \ 是 `IP` 协议套件中的另一个核心协议。它与传输协议的 `TCP` 和 `UDP` 的目的不同。`ICMP` 的主要作用是测试和验证主机之间的网络通信。\n\
  \n例如，为了测试网络连接性，`ping` 工具将向远程主机发送 `ICMP Echo Request` 数据包。如果主机接收到它们，它将向发送者响应一个 `ICMP\
  \ Echo Response` 数据包。如果收到了 `ICMP Echo Response` 数据包，发送者就知道发送者和接收者之间存在有效的网络连接，并且接收者正在响应网络请求。如果没有收到\
  \ `ICMP Echo Response` 数据包，发送者就知道出了问题，并开始对通信进行故障排除。\n\n对于你的 `Linux+/LPIC-1` 考试，你还需要理解\
  \ `IP 端口`的概念，它们由传输层的 `TCP` 和 `UDP` 协议提供。从本质上说，“端口”是 `TCP` 和 `UDP` 为上层协议提供的逻辑连接。端口允许具有单个\
  \ `IP` 地址的单个主机提供多个网络服务。每个服务使用相同的 `IP` 地址，但使用不同的 `TCP` 或 `UDP` 端口号运行。\n\n例如，假设你有一个分配了\
  \ `192.168.1.1` `IP` 地址的网络服务器。你可以配置在这台服务器上同时运行 Web 服务器和 FTP 服务器。每个服务都将在分配了 `192.168.1.1`\
  \ `IP` 地址的接口上监听请求。然而，Web 服务器运行在端口 `80` 上，而 FTP 服务器运行在端口 `20` 和 `21` 上。发送到端口 `80`\
  \ 的请求由 Web 服务处理，而发往到端口 `20` 和 `21` 的信息由 FTP 服务处理。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** FTP 服务在某些方面是与特别的，因为它使用了两个端口。一个用于控制连接（端口 `21`），另一个（端口 `20`）用于实际传输数据。大多数服务只使用一个端口。\n\
  \n你应该熟悉用于组织 `IP 端口` 的各种类别。端口号的范围从 `0` 到 `65536`。这些端口的使用由互联网名称与数字分配机构（`ICANN`）监管。`IP\
  \ 端口`分为三个不同的类别：\n\n![images](img/bull.jpg) **已知端口** 为特定服务预留，已知端口是编号从 `0` 到 `1023`\
  \ 的端口。这里是一些例子：\n\n![images](img/bull.jpg) 端口 `20` 和 `21`: FTP\n![images](img/bull.jpg)\
  \ 端口 `22`: 安全外壳 (SSH)\n![images](img/bull.jpg) 端口 `23`: Telnet\n![images](img/bull.jpg)\
  \ 端口 `25`: SMTP\n![images](img/bull.jpg) 端口 `53`: DNS\n![images](img/bull.jpg) 端口\
  \ `80`: HTTP\n![images](img/bull.jpg) 端口 `110`: POP3\n![images](img/bull.jpg) 端口\
  \ `119`: NNTP (新闻)\n![images](img/bull.jpg) 端口 `123`: NTP (时间同步)\n![images](img/bull.jpg)\
  \ 端口 `137`, `138`, `139`: NetBIOS\n![images](img/bull.jpg) 端口 `143`: IMAP\n![images](img/bull.jpg)\
  \ 端口 `161`: SNMP\n![images](img/bull.jpg) 端口 `162`: SNMP Traps\n![images](img/bull.jpg)\
  \ 端口 `389`: LDAP\n![images](img/bull.jpg) 端口 `443`: HTTPS\n![images](img/bull.jpg)\
  \ 端口 `465`: 使用 TLS/SSL 的 SMTP (SMTPS)\n![images](img/bull.jpg) 端口 `514`: Syslog\
  \ 远程日志\n![images](img/bull.jpg) 端口 `636`: 安全 LDAP\n![images](img/bull.jpg) 端口 `993`:\
  \ 使用 TLS/SSL 的 IMAP (IMAPS)\n![images](img/bull.jpg) 端口 `995`: 使用 TLS/SSL 的 POP3\
  \ (POP3S)\n\n![images](img/bull.jpg) **注册端口** `ICANN` 为特殊实现预留了 `1024` 到 `49151`\
  \ 端口。组织可以创建自己的网络服务并申请分配注册端口。\n\n![images](img/bull.jpg) **动态端口** 动态端口也被称为`私有端口`。`49152`\
  \ 到 `65535` 被指定为动态端口。它们供需要建立临时连接的服务使用。例如，服务可能会与客户端协商动态端口。会完成后端口关闭。\n\n为了让这一切运行，你需要为网络上的每个主机分配\
  \ IP 地址。让我们让我们讨论如何实现这一点。\n\n#### IPv4 地址的工作原理\n\n基于 IP 的网络上的每个主机都必须有一个唯一的 `IP 地址`。`IP\
  \ 地址` 是逻辑分配给网络主机的网络层（`3`）地址。由于 `IP 地址` 是逻辑地址，因此不是永久的。它可以随时被更改。\n\n`IP 地址` 与 `MAC\
  \ 地址` 不同。`MAC 地址` 是数据链路层（`2`）硬件地址，烧录在全球销售的网络网卡的 ROM 芯片上。`MAC 地址` 是硬编码的，无法更改。\n\n\
  ***\n\n![Images](img/note.jpg)\n\n**注意** 地址解析协议（`ARP`）用于将分配给系统的逻辑 IP 地址映射到它们的硬编码\
  \ MAC 地址。\n\nIP 地址由四个数字组成，用点隔开。有效 IP 地址示例包括：\n\n![images](img/bull.jpg) 12.34.181.78\n\
  ![images](img/bull.jpg) 192.168.1.1\n![images](img/bull.jpg) 246.270.3.8\n\n***\n\
  \n![Images](img/note.jpg)\n\n**注意** IPv4 地址有时被称为“点四点”地址。\n\n在十进制表示中，每个数字必须在 `0`\
  \ 到 `255` 之间。例如，`192.168.1.1` 是一个有效的 IP 地址。这里是一些*无效* IP 地址的示例：\n\n\n\n\n\n![images](img/bull.jpg)\
  \ `256.78.1.3` 不能使用大于 255 的值\n\n![images](img/bull.jpg) `10.3.4` 必须使用四个数值\n\n地址中的每个数字实际上是一个称为\
  \ `octet` 的八位二进制数。由于每个 `octet` 都是二进制数，因此它可以用 0 和 1 表示。例如，地址 `192.168.1.1` 可以以二进制形式表示为：\n\
  \n```\n11000000.10101000.00000001.00000001\n```\n\n有几种简单的方法可以在八位二进制地址和 IP 地址的三三位十进制版本之间转换。一种方法是使用大多数\
  \ Linux 发行版（甚至 Windows）自带的计算器软件的“科学模式”。要将十进制 IP 地址数字转换为二进制，输入十进制版本然后点击 `Bin` 选项。\n\
  \n你也可以反向操作，在 `Bin` 模式下输入二进制数，然后切换到 `Dec` 模式，这会将二进制数转换为等效的十进制数。\n\n如果你是数学型的人，也可以手动进行转换。使用以下方法来确定二进制数中每个位的值：\n\
  \n![images](img/bull.jpg) 位 1 = 128\n![images](img/bull.jpg) 位 2 = 64\n![images](img/bull.jpg)\
  \ 位 3 = 32\n![images](img/bull.jpg) 位 4 = 16\n![images](img/bull.jpg) 位 5 = 8\n\
  ![images](img/bull.jpg) 位 6 = 4\n![images](img/bull.jpg) 位 7 = 2\n![images](img/bull.jpg)\
  \ 位 8 = 1\n\n例如，`11000000 = 128 + 64 = 192`。\n\n某些 IP 地址是被保留的，不能分配给主机。例如，主机 IP 地址中的最后一个\
  \ `octet` 不能为 `0`。该值被预留给主机所在的网络段本身的地址。例如，分配 IP 地址为 `192.168.1.1` 的主机的网络地址为 `192.168.1.0`。\n\
  \n此外，分配给主机的 IP 地址的最后一个 `octet` 不能为 `255`。该值被预留用于向网段上的所有主机发送广播。在前面的示例中，IP 地址为 `192.168.1.1`\
  \ 的主机的广播地址为 `192.168.1.255`。\n\n至关重要的一是你必须理解，基于 IP 的网络上的每个主机都必须分配一个 `unique` IP\
  \ 地址。同一 IP 网络上的两个主机不能分配相同的 IP 地址。如果主机位于公共网络（如互联网），它必须使用 `globally` 唯一的 IP 地址。你可以向互联网地址分配机构\
  \ (`IANA`) 申请一组已注册的 IP 地址块。一旦分配了某个 IP 地址，世界上的其他地方就不能在公共网络上使用它。\n\n这实际上引入了 IP 版本\
  \ 4 的一个关键问题。`IPv4` 使用的 32 位地址方案最多允许四十亿个可能的唯一地址。在 `IPv4` 最初定义时，这似乎是非常大量的地址。然而在今天，这些有限的可用地址几乎已完全分配完毕。\n\
  \n解决这种 IPv4 地址短缺的一种方法是使用带有网络地址转换 (`NAT`) 的私有网络。通过网络地址转换，你可以使用 `NAT` 路由器向 `public`\
  \ 网络展示单个已注册的 IP 地址，同时在路由器背后的网络中使用 `private` IP 地址。如图 15-3 所示。\n\n![Images](img/f0547-01.jpg)\n\
  \n**图 15-3** 使用 NAT 路由器分离公共网络和私有网络\n\n使用 `NAT` 具有许多优点。其中关键之一是你可以将一个巨大的私有网络隐藏在公共接口（或几个公共接口）之后。这允许大型组织实现其网络，且只需要相对少量的全球唯一公共\
  \ IP 地址。\n\n在每个类 IP 地址中，有一组被称为 `private` 或 `reserved` IP 地址的地址块。这些地址是未分配的，可以由任何想要它们的人使用。这允许你在本地网络上使用私有地址，并且能够连接到互联网等公共网络。来自你私有网络的所有流量看起来都源自\
  \ `NAT` 路由器公共侧配置的注册 IP 地址。\n\n私有 IP 地址范围为：\n\n![images](img/bull.jpg) `10.0.0.0–10.255.255.255`\
  \ (A 类)\n![images](img/bull.jpg) `172.16.0.0–172.31.255.255` (B 类)\n![images](img/bull.jpg)\
  \ `192.168.0.0–192.168.255.255` (C 类)\n\n这些是不可路由地址，这意味着如果你尝试在互联网等公共网络上使用它们，IP 路由器将不会向它们或从它们转发数据。这是通过\
  \ `NAT` 路由器将网络地址转换为公共 IP 地址来处理的。这允许世界上任何人使用这些私有 IP 地址范围而不必担心冲突，即使使用了多个实例。`NAT` 让这一切成为可能！\n\
  \n除了分配 IP 地址外，在 Linux 系统上配置 IP 协议时，你还需要分配子网掩码。接下来我们讨论如何操作。\n\n### IPv4 子网掩码如何工作\n\
  \n如果你曾经配置过带有 IP 地址的系统，你可能注意到你还需要分配一个 `subnet mask`。你是否想过这个参数是什么？那么，现在是学习的时候了。\n\n\
  要理解子网掩码如何工作，你首先需要理解 IP 地址被分为两个部分：\n\n![images](img/bull.jpg) 网络地址\n![images](img/bull.jpg)\
  \ 节点地址\n\n`IPv4` 地址的一部分用于标识主机所在的网络。其余部分则唯一地标识网络上的特定主机（节点）。要记住的关键点是，同一网段上的每个系统在地址的网络部分必须具有完全相同的数字。然而，它们必须必须具有唯一的节点部分。如图\
  \ 15-4 所示。\n\n![Images](img/f0548-01.jpg)\n\n**图 15-4** IP 地址中的网络与节点\n\n地址中多少部分用于网络，多少用于节点由子网掩码定义。默认子网掩码包括：\n\
  \n![Images](img/p0548-01.jpg)\n\n任何包含 `255` 的子网掩码字节都标识了 IP 地址中二进制表示法下的网络部分。如果你有一个\
  \ IP 地址 `192.168.1.1` 且子网掩码为 `255.255.255.0`，子网掩码规定该地址的前三个字节是网络，最后一个字节是节点。如图 15-5\
  \ 所示。\n\n![Images](img/f0549-01.jpg)\n\n**图 15-5** 使用子网掩码定义地址的网络和节点部分\n\nIP 地址被分为五不同的类。每个地址类都有其自己的默认子网掩码。对于我们的目的，我们只需要关注前三个地址类：\n\
  \n![images](img/bull.jpg) **A 类** 首字节的十进制值必须在 1 到 126 之间。在 A 类地址中，第一个字节是网络地址，后三个字节是节点地址。因此，默认子网掩码为\
  \ `255.0.0.0`。A 类允许共 126 个可能的网络（并不多），但每个网络提供 1670 万个可能的节点地址。\n\n![images](img/bull.jpg)\
  \ **B 类** 首字节的十进制值必须在 128 到 191 之间。在 B 类地址中，前两个字节是网络地址，后两个字节是节点地址。因此，默认子网掩码为 `255.255.0.0`。使用\
  \ B 类允许 16384 个可能的网络，每个网络有 65534 万节点。\n\n![images](img/bull.jpg) **C 类** 首字节的十进制值必须在\
  \ 192 到 223 之间。在 C 类地址中，前三个字节是网络地址，最后一个字节是节点地址。因此，默认子网掩码为 `255.255.255.0`。因为地址的大部分被用于网络地址，所以有大量的\
  \ C 类网络可用（2097152 个可能的网络）。然而，在任何给 C 类网络上只能存在有限数量的主机（最多 254 个）。\n\n\n\n\n子网掩码有时使用一种称为`CIDR\
  \ 表示法`的简记方式。这是在 IP 地址后面添加一个斜杠（`/`）和掩码中使用的位数来实现的（例如，`192.168.1.1/24`）。`/24` 参数表示使用了\
  \ 24 位子网掩码，其完整写形式为 `255.255.255.0`。当使用 CIDR 表示法时，掩码中使用的位数被称为`prefix`（前缀）。\n\n你不必使用这些默认子网掩码。例如，你可以为\
  \ A 类地址定义一个 `255.255.0.0` 的子网掩码。你也可以只使用字节中的一部分作为网络地址。这被称为`部分子网划分`或`可变长度子网掩码`（VLSM）。通过\
  \ VLSM，我们忽略默认的子网掩码边界，并指定自定义的子网掩码位数。例如，假设我们为网络上的主机定义 `255.255.252.0` 的子网掩码。除了第一个和第二个字节外，该掩码还包含第三字节的八位中的前六位，用于地址的网络部分。本质上，位是从可用的节点地址中“借用”用于网络地址的，从而增加额外的子网。这允许你创建额外的网络，但会减少每个网络上可用的主机地址数量。\n\
  \n例如，假设你的网络由通过路由器连接的四个独立的物理网络网段组成。该网络使用 `10.0.0.0` 私有 IP 方案，因此你想将 `10.0.0.0` 网络划分为四个独立的网络。默认情况下，该网络使用\
  \ A 类地址（`10.0.0.0`）。这意味着第一个字节用于网络地址，而后三个字节用于节点地址。\n\n然而，你可以通过配置子网掩码，将第二个字节的前两个位包含在网络地址中，从而创建四个额外的网络（子网）。与其使用默认的\
  \ A 类子网掩码 `11111111.00000000.00000000.00000000`（`255.0.0.0`），不如使用 `11111111.11000000.00000000.00000000`（`255.192.0.0`）子网掩码。使用\
  \ CIDR 表示法，你将指定前缀为 `/10`，表示你使用 10 位作为子网掩码。这两个位有四种可能的值：\n\n![images](img/bull.jpg)\
  \ 00 = 0\n\n![images](img/bull.jpg) 01 = 64\n\n![images](img/bull.jpg) 10 = 128\n\
  \n![images](img/bull.jpg) 11 = 192\n\n这将创建如表 15-1 所示的四个子网。\n\n![Images](img/t0550-01.jpg)\n\
  \n**表 15-1** 使用 10 位子网掩码创建子网\n\n要记住的重要点是，同一网络网段上的两个主机要通信，它们必须具有*完全相同*的网络地址，这意味着它们必须具有*完全相同*的子网掩码。例如，假设你有三个系统，如图\
  \ 15-6 所示。\n\n![Images](img/f0550-01.jpg)\n\n**图 15-6** 使用错误子网掩码的主机\n\n主机 1 和主机\
  \ 2 具有完全相同的网络地址和子网掩码。这两个主机可以在 IP 网络网段上通信。然而，主机 3 使用的是 `255.255.252.0` 子网掩码，而不是 `255.255.255.0`。因此，主机\
  \ 3 的网络地址与主机 1 和主机 2 不同，没有网络路由器无法与它们通信。\n\n接下来，让我们讨论 DNS 服务器地址和默认网关路由器地址。\n\n###\
  \ 指定 DNS 服务器和默认网关路由器地址\n\n到为止，我们讨论了在 Linux 系统上配置 IP 栈时所需的 IP 地址和子网掩码参数。然而，你还需要指定\
  \ DNS 服务器地址和默认网关路由器地址。\n\n如果你用过互联网，你就可以使用域名（如 `www.google.com`）导航到 Web 上的特定主机。然而，你的系统实际上无法处理字母数字域名。它不知道\
  \ `www.google.com` 在哪里，也不知道它能提供什么。\n\n为了使此功能工作，你的本地系统需要将域名解析为 IP 地址。实现此目标的方法是将域名提交给\
  \ DNS 服务器。当 DNS 服务器接收到解析请求时，它会将提交的域名与 IP 地址匹配，并将其返回给请求系统。然后，你的系统就可以使用其 IP 地址联系指定的主机。例如，在图\
  \ 15-7 中，域名 `www.google.com` 已经被 DNS 服务器解析为 IP 地址 `74.125.239.144`。\n\n![Images](img/f0551-01.jpg)\n\
  \n**图 15-7** 将域名解析为 IP 地址\n\n为了让该系统工作，你需要为系统提供它希望使用的 DNS 服务器 IP 地址。我们将在本章稍后的部分花更多时间处理\
  \ DNS。\n\n此外，你还需要指定网络默认网关路由器的 IP 地址。IP 协议从设计之初就考虑了互联。在互联网络中，多个网络网段通过路由器连接在一起。如果一个网段上的系统尝试将数据发送到不在同一网络的主机，IP\
  \ 协议会将数据包重定向到该网段的默认网关路由器。路由器将使用各种路由协议来确定数据包应该发送到哪里以到达目的地。这如图 15-8 所示。\n\n![Images](img/f0552-01.jpg)\n\
  \n**图 15-8** 在路由网络中使用 IP\n\n在图 15-8 中，发送系统（`192.168.1.1`）正在向 `10.0.0.1` 发送数据。然而，`10.0.0.1`\
  \ 位于 `10.0.0.0` 网络网段，而不是 `192.168.1.0` 网段。因此，发送系统上的 IP 栈将数据重定向到连接这两个网段的路由器。路由器上的路由软件知道\
  \ `10.0.0.0` 网段的位置，并将数据包转发到该网络，从而交付给接收系统。\n\n该系统非常强大。它允许你连接互联网并从世界其他地方服务器下载网页。然而，为了让其工作，你的本地系统需要知道路由器的\
  \ IP 地址，以便将数据发送到不在本地网段的系统。每当你在 Linux 系统上配置网络设置时，都需要配置此参数。如果不配置，系统将只能与本地网络网段上的系统通信。\n\
  \n### 使用 IPv6\n\n在本章前面的部分，我提到过注册 IP 地址的全球供应几乎耗尽。为了解决这个问题，大多数组织通过实施 NAT 路由器来减少所需的注册\
  \ IP 地址数量。然而，使用 NAT 路由器是一个临时方案。为了彻底解决这个问题，需要一个新的 IP 协议版本来处理现代计算世界所需的 IP 地址。\n\n\
  为了实现这一目标，IP 版本 6 (`IPv6`) 正在全球推行。预计 IPv6 将在十年内完全取代 IPv4。IPv6 定义了 128 位 IP 地址，而不是\
  \ 32 位。这允许产生最多 `3.4 × 10³⁸` 个唯一的 IP 地址。（希望这足够了！）大多数 Linux 发行版都支持 IPv4 和 IPv6。\n\n\
  IPv6 地址由八个四位十六进制数（称为`quartets`）组成，用冒号而不是点分隔。每个四位表示为 0 到 `FFFF` 之间的十六进制数。例如，一个有效的\
  \ IPv6 地址可以是 `35BC:FA77:4898:DAFC:200C:FBBC:A007:8973`。这个 128 位地址包含两个部分：\n\n\n\n\
  \n\n![images](img/bull.jpg) `Prefix` 前缀是前 64 位。前缀包括网络地址和子网地址。这等同于 `IPv4` 网络地址。事实上，我们在\
  \ `IPv6` 中使用 `CIDR` 记法来引用前缀，就像我们处理 `IPv4` 地址一样。由于 `IPv6` 前缀长度为 64 位，因此我们指定为 `/64`。\n\
  \n![images](img/bull.jpg) `Interface ID` 接口 ID 是最后的 64 位。这是分配给网络主机的唯一地址。这等同于 `IPv4`\
  \ 主机地址。\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 由于 `IPv6` 地址非常长，你会经常看到它们的缩写形式。如果地址包含一串连续的多个零，我们可以通过指定\
  \ `::` 来省略它们。例如，如果你有一个 `IPv6` 地址 `2001:1db8:3a4c:1115:0000:0000:1a2f:1a2b`，你可以使用简写符号\
  \ `2001:1db8:3a4c:1115::1a2f:1a2b` 省略所有多余的零。\n\n你需要熟悉的三类 `IPv6` 地址：\n\n![images](img/bull.jpg)\
  \ 全局单播\n![images](img/bull.jpg) 唯一本地\n![images](img/bull.jpg) 链路本地\n\n让我们先来看下全局单播地址。\n\
  \n### 全局单播地址\n\n全局单播 `IPv6` 地址的工作方式与公网 `IPv4` 地址类似。通常，希望部署 `IPv6` 的组织将被分配一个注册的、唯一的*全局路由前缀*（等同于\
  \ `IPv4` 网络地址）。每个全局路由前缀在整个范围内必须是唯一的。这确保了分配给单个网络主机的每个 `IPv6` 地址在全球范围内也是唯一的。\n\n全局路由前缀由你的\
  \ `ISP` 分配，通常为 48 位（`/48`）。这允许你使用全局路由前缀中剩余的 16 位创建自己的内部子网。由于前缀的大小（`/64`），你可以定义多达\
  \ 2¹⁶ 个子网。这是一个巨大的数字！同一组织内的所有子网将使用由 `ISP` 分配的相同全局路由前缀，但在前缀的子网部分使用不同的值。\n\n在部署 `IPv6`\
  \ 时，你不一定使用全局单播地址。如果合适，你可以实现唯一本地地址。\n\n### 唯一本地地址\n\n唯一本地地址类似于私有 `IPv4` 地址，通常用于未连接到公网（如互联网）的网络。唯一本地地址是不注册的，因此在没有网络地址转换（NAT）的情况下无法在公网上使用。\n\
  \n唯一本地地址的前 8 位使用始终以 `FC` 或 `FD` 开头的前缀。接下来的 40 位用于*全局 ID*，这是一个随机生成的数字，旨在产生高概率的唯一性。因此，尽管唯一本地地址无法在互联网上使用，它们的设计实际上是全球唯一的。前缀中全局\
  \ ID 之后剩余的 16 位用于创建子网，正如我们在全局唯一地址中看到的那样。地址的剩余用于分配给单个网络主机的接口 ID。\n\n### 链路本地地址\n\n\
  IPv6 还使用一种特殊的单播地址，称为链路本地地址，它仅用于本地网段内的通信。路由器永远不会转发指向其他子网的链路本地地址的数据包。因此，链路本地地址不能用于不同网段间主机之间的通信。链路本地地址用于特定目的，包括：\n\
  \n![images](img/bull.jpg) 自动地址配置\n![images](img/bull.jpg) 邻居发现\n![images](img/bull.jpg)\
  \ 无路由器子网\n\n链路本地地址使用的前缀以 `FE8`、`FE9`、`FEA` 或 `FEB` 开头。在使用 `IPv6` 时，你会发现每个 `IPv6`\
  \ 主机在系统启动时至少会自动分配一个链路本地地址。\n\n考虑到这些背景，现在让我们讨论如何在 Linux 系统中配置以太网接口。\n\n### 配置网络地址参数\n\
  \n在 Linux 系统中，你最常用的网络接口可能是以太网接口。请注意，在 Linux 下，当我们提到“网络接口”时，我们指的是：\n\n![images](img/bull.jpg)\
  \ 安装在系统中的物理网络网卡 (NIC) 硬件\n![images](img/bull.jpg) 支持物理网卡的加载内核模块（驱动程序）\n![images](img/bull.jpg)\
  \ 分配给接口的 IP 网络配置参数\n\n要在你的系统中安装以太网网络接口，你需要完成以下任务：\n\n![images](img/bull.jpg) 安装以太网板\n\
  ![images](img/bull.jpg) 配置 IPv4 参数\n![images](img/bull.jpg) 配置路由参数\n![images](img/bull.jpg)\
  \ 配置域名解析设置\n![images](img/bull.jpg) 配置 IPv6\n\n让我们从讨论如何在系统中安装以太网板开始。\n\n#### 安装以太网板\n\
  \n显然，配置以太网接口时需要完成的第一工作是在系统中安装网卡硬件。要做到这一点，请完成以下操作：\n\n1. 关闭系统电源。\n2. 将以太网板安装到可用的扩展槽中。\n\
  3. 使用适当的跳线将以太网板连接到网络交换机或集线器。\n4. 重新开启系统。如果你安装了现代以太网板，你的 Linux 操作系统可能会在启动时检测到它并加载所需的内核模块。如果没有，你可能需要从厂家网站下载并手动加载。\n\
  \n系统启动后，你应该检查模块配置文件，验证相应的内核模块已加载，并确认为新网卡创建了别名。要检查的文件取决于你的发行版。某些发行版使用 `/etc/modprobe.conf`\
  \ 或 `/etc/modules.conf` 文件，而另一些则使用 `/etc/modprobe.d` 中的配置文件。例如，我的 openSUSE 系统（安装在\
  \ VMware 虚拟机）中使用 `/etc/modprobe.d/50-vmnics.conf` 文件，如图 15-9\n\n**图 15-9** 以太网板的内核模块配置文件\n\
  \n网络接口使用的别名取决于你的发行版。使用 `init` 的旧发行版会为 Linux 系统中的以太网适配器分配以下别名：\n\n![images](img/bull.jpg)\
  \ `eth0` 系统中的第一个以太网适配器\n![images](img/bull.jpg) `eth1` 系统中的第二个以太网适配器\n![images](img/bull.jpg)\
  \ `eth2` 系统中的第三个以太网适配器，以此此类推……\n\n使用 `systemd` 的新发行版不再使用这些别名。它们运行良好，除非你的系统中恰好有多个网络适配器。有时我们会看到接口别名在网络适配器之间交换的情况。例如，某个接口在某次启动时可能是\
  \ `eth0`，但在下次启动时被分配为 `eth1`。正如你可以想象的，这种情况可能会搞乱你的网络服务、路由表和防火墙规则。\n\n为了解决这个问题，`systemd`\
  \ 使用*可预测的网络接口名称*。这样做的一个主要优势是，特定的别名可以永久地分配给特定的网络接口。可预测的网络接口设备名称根据以下参数之一进行分配。优选顺序如下：\n\
  \n![images](img/bull.jpg) 对于内置网络适配器，使用系统固件（或 BIOS）提供的索引号来构建别名。使用此参数创建的常用别名是 `eno1`。该名称的元素如下：\n\
  \n![images](img/bull.jpg) `en` 以太网接口\n\n\n\n\n\n![images](img/bull.jpg) `o1` 板载设备索引（在此情况下，设备号为\
  \ `1`）\n\n![images](img/bull.jpg) 如果网络适配器插在 PCI-E 热插槽上而不是集成在主板上，那么 `systemd` 将使用固件（或\
  \ BIOS）提供的插本身的索引来构造别名。使用此参数创建的常用别名是 `ens1`。该名称的元素如下：\n\n![images](img/bull.jpg)\
  \ `en` 以太网接口\n\n![images](img/bull.jpg) `s1` 热插槽索引（在此情况下，槽号为 `1`）\n\n如果上述选项不适用，`systemd`\
  \ 将尝试使用接口连接的物理连接器名称（例如 USB 连接器）来构造别名。使用此参数创建的常用别名是 `enp2s0`。该名称的元素如下：\n\n![images](img/bull.jpg)\
  \ `en` 以太网接口\n\n![images](img/bull.jpg) `p2` 总线号（在此情况下，USB 总线号为 `2`）\n\n![images](img/bull.jpg)\
  \ `s0` 总线上的插槽号（在此情况下，槽号为 `0`）\n\n![images](img/bull.jpg) 如果其他方法都失败，`systemd` 将尝试使用接口的\
  \ MAC 地址来构造别名。格式为 `enx` 后跟 MAC 地址。\n\n注意前面的列表，每个示例接口名称都以 `en` 开头。这是因为我们假设你正在使用标准的以太网接口。其他类型的接口使用不同的命名约定：\n\
  \n![images](img/bull.jpg) `en` 用于以太网适配器\n\n![images](img/bull.jpg) `sl` 用于串口线路 IP\
  \ 接口\n\n![images](img/bull.jpg) `wl` 用于 WLAN 接口\n\n此时，你的网络接口已加载并激活。然而，在使用它之前，你必须用\
  \ IP 协议对其进行配置。接下来让我们讨论如何操作。\n\n## 配置 IPv4 参数\n\n请记住，你需要为网络接口配置四个参数，以便系统能够参与基于 IP\
  \ 的计算机网络。这些参数包括：\n\n- IP 地址\n- 子子网掩码\n- 默认网关路由器地址\n- DNS 服务器地址\n\n有两种不同的方法可以实现这一点，如表\
  \ 15-2 所示。\n\n![Images](img/t0557-01.jpg)\n\n**表 15-2** IP 地址分配选项\n\n如果你想为 Linux\
  \ 系统静态分配 IP 地址参数，可以使用 `ifconfig` 命令。如果输入 `ifconfig` 而不带任何选项，它将显示系统系统中所有网络接口的当前状态，如图\
  \ 15-10 所示。\n\n![Images](img/f0557-01.jpg)\n\n**图 15-10** 使用 `ifconfig` 查看网络接口信息\n\
  \n***\n\n![Imags](img/note.jpg)\n\n**注意** 当你运行 `ifconfig` 时，你会发现系统列出了两个或多个接口，而不仅仅是一个。标记为\
  \ `lo` 的额外接口是环回接口，通常被分配特殊的 IP 地址 `127.0.0.1`。这是一个虚拟接口，而不是实际的硬件接口。它用于内部通信、诊断等。\n\n\
  注意图 15-10 中显示了两个网络接口：`ens32` 和 `lo`。`ens32` 接口是安装在系统中的以太网接口。`lo` 接口是本地环回虚拟网络接口。许多\
  \ Linux 服务正常运行需要 `lo` 接口，因此请不要动它。注意图 15-10，`ifconfig` 还显示了关于每个网络接口的详细信息。一些较重要的参数包括表\
  \ 15-3 所示。\n\n![Images](img/t0558-01.jpg)\n\n**表 15-3** `ifconfig` 输出\n\n除了显示特定网络接口的信息外，`ifconfig`\
  \ 还可以使用前面讨论的 IP 地址参数配置网络接口。使用 `ifconfig` 的语法为 `ifconfig *interface ip_address* netmask\
  \ *subnet_mask* broadcast *broadcast_ address*`。例如，假设我想为 `ens32` 接口分配 IP 地址 `192.168.1.1`、子网掩码\
  \ `255.255.255.0` 和广播地址 `192.168.1.255`。我在 shell 提示符下输入 `ifconfig ens32 192.168.1.1\
  \ netmask 255.255.255.0 broadcast 192.168.1.255`。\n\n必须记住，这种 IP 地址分配不是持久的。如果你重启系统，它将会丢失。要使其持久化，你需要在\
  \ `/etc/sysconfig/network` 目录中配置一个特殊文件。例如，我的系统中用于配置以太网接口的文件名为 `ifcfg-ens32`。\n\n\
  ***\n\n![Images](img/note.jpg)\n\n**注意** 在某些发行版中，该文件将使用网卡的 MAC 地址进行进行命名。例如，如果 `ifcfg-eth-id-00:0c:29:d1:52:d4`\
  \ 将是 MAC 地址为 `00:0C:29:D1:52:D4` 的系统中的以太网接口的配置文件，如果只安装了一个网卡，它将是第一个接口。其他发行版将使用分配给接口的别名来命名此文件，例如\
  \ `eth0`、`ens1` 等。\n\n该文件用于在系统启动时配置接口。此接口的示例参数在此所示：\n\n![Images](img/p0559-01.jpg)\n\
  \n你可以在此配置文件中某些配置选项列在表 15-4 中。\n\n![Images](img/t0559-01.jpg)\n\n**表 15-4** 为网络接口配置持久化参数\n\
  \n如果 `BOOTPROTO` 设置为“dhcp”，则不需要 `IPADDR`、`NETMASK`、`NETWORK` 和 `BROADCAST` 节点。`/etc/hostname`\
  \ 文件配置你的 Linux 系统的主机名。\n\n在对这些文件进行任何更改后，你需要重新启动网络接口以应用更改。要这样做，只需输入 `ifdown *interface*`\
  \ 然后跟上 `ifup *interface*`，其中 *interface* 是接口的别名，例如 `ens32`。\n\n如果你想使用静态地址分配，这些都很好，但如果你想从\
  \ DHCP 服务器动态获取地址怎么办？你可以使用 shell 提示符下的 `dhclient` 命令配置你的网络接口来实现。使用此命令的语法为 `dhclient\
  \ *interface*`。例如，你可以输入 `dhclient ens32` 来指定你的接口从 DHCP 服务器动态获取 IP 地址信息。这如图 15-11\
  \ 所示。\n\n![Images](img/f0560-01.jpg)\n\n**图 15-11** 使用 `dhclient` 获取 IP 地址租约\n\n\
  注意图 15-11 中`dhclient` 工具在 `ens32` 接口上广播了一个 `DHCPREQUEST` 数据包。作为响应，IP 地址为 `10.0.0.1`\
  \ 的 DHCP 服务器发回了一个 `DHCPACK` 数据包，其 IP 地址 `10.10.0.83` 被分配给 `ens32` 接口。\n\n另一个你可以用于管理\
  \ Linux 系统 IP 地址分配的工具是 `ip` 命令。例如，要查看当前配置，你可以在 shell 提示符下输入 `ip addr show`，如下所示：\n\
  \n![Images](img/p0560-01.jpg)\n\n要使用 `ip` 命令配置 IP 地址参数，在 shell 提示符下输入 `ip addr add\
  \ *ip_address* dev *interface*`。例如，为了将分配我的 `ens32` 网络接口的 IP 地址设为 `10.0.0.84`，我会输入\
  \ `ip addr add 10.0.0.84 dev ens32`。要从接口中删除 IP 地址，只需在 shell 提示符下输入 `ip addr del\
  \ *ip_address* dev *interface*`。\n\n你还可以使用 `ip` 命令来禁用和启用系统中的网络接口。要禁用接口，在 shell 提示符下输入\
  \ `ip link set *interface* down`。要让禁用的接口重新上线，在 shell 提示符下输入 `ip link set *interface*\
  \ up`。\n\n\n\n\n\n除了这里讨论的命令行工具外，大多数 Linux 发行版都提供了某种图形界面，供你用于配置网络接口。例如，在 SUSE Linux\
  \ 上，你可以使用 Network Settings YaST 模块来配置网络板以及分配给它的 IP 地址信息。该模块如图图 15-12 所示。\n\n![Images](img/f0561-01.jpg)\n\
  \n**图 15-12** 使用 YaST 网络设置模块\n\n让我们在下面的练习中练习使用 `ifconfig` 命令。\n\n### 练习 15-1：操作网络接口\n\
  \n在此练习中，你将练习使用 `ifconfig` 命令来管理你的网络接口。你可以使用随书提供的虚拟机进行此练习。运行快照 15-1 以获得配置正确的环境。\n\
  \n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 15-1 视频，查看如何执行此任务的演示。\n\n完成以下操作：\n\
  \n1. 启动你的 Linux 系统并以学生用户 `student` 登录，密码为 `student`。\n2. 打开一个终端会话。\n\n3. 输入 `su\
  \ –` 并输入密码 `student` 切换到 root 用户账户。\n\n4. 在 shell 提示符下输入 `ifconfig`。记录关于你的以太网接口的以下信息：\n\
  \n![images](img/bull.jpg) MAC 地址\n![images](img/bull.jpg) IP 地址\n![images](img/bull.jpg)\
  \ 广播地址\n![images](img/bull.jpg) 子网掩码\n\n5. 在 shell 提示符下，使用 `cd` 命令进入 `/etc/sysconfig/network`\
  \ 目录。\n\n6. 使用 `ls` 命令识别你网络板的配置文件。\n\n7. 使用 `cat` 命令查看以太网网络接口板配置文件的内容。\n\n8. 在 shell\
  \ 提示符下输入 `ifdown *interface_name*` 来关闭你的接口。\n\n9. 在 shell 提示符下输入 `ifup *interface_name*`\
  \ 来启用你的接口。\n\n10. 在 shell 提示符下输入 `ifconfig *interface_name* 192.168.1.100 netmask\
  \ 255.255.255.0 broadcast 192.168.1.255` 将分配给以太网网络接口的 IP 地址更改为 192.168.1.100。\n\n\
  11. 再次输入 `ifconfig` 并验证更改生效。\n\n12. 再次使用 `ifconfig` 命令将你的 IP 配置参数回原始值。\n\n13. 如果你的网络段上有\
  \ DHCP 服务器，请修改你的网络接口配置以使用 DHCP，然后在 shell 提示符下输入 `dhclient *interface_name*` 动态为你的以太网板分配\
  \ IP 地址。\n\n### 配置路由参数\n\n你可能注意到，在本章前面的主题中，我们没有配置两个重要的 IP 参数：默认网关路由器地址和 DNS 服务器地址。\n\
  \n使用 IP 协议，路由器的作用正如其名称所示：它们跨越多个网络路由数据，以将信息传递到目标主机。路由器工作在网络层，用于连接各种不同的网络。\n\n路由器通常与网关配合使用。路由器硬件本身可能只是一个安装了两个网卡（NIC）的计算机系统，也可能是专门用于路由的专用硬件设备。\n\
  \n路由器执行的关键工作之一是确定将信息送到正确目标主机的最佳方式。为了实现这一点，路由器维护一个可用路由的表。路由器使用算法评估距离、成本和网络状态，以确定到目标主机的最佳路径。即使没有被配置为路由器，每个\
  \ Linux 系统在 RAM 中也维护着路由表，用于确定向网络何处发送数据。\n\n当你在 Linux 系统上配置网络参数时，你需要执行的关键任务之一是配置默认路由器地址。如果数据包的目标主机不在本地网络段上，默认路由器就是数据发送的默认位置。你的默认网关路由器地址存储在\
  \ `/etc/sysconfig/network/routes`文件中，所示：\n\n![Images](img/p0563-01.jpg)\n\n在该文件中指定默认路由的语法为\
  \ `default *router_IP_address*`。注意前面的示例，默认网关路由器地址设置为 10.0.0.1。\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** 如果你安装了多个网卡，且每个接口都需要自己的路由配置（例如，如果每个网卡连接到不同的网络），你可以在 `/etc/sysconfig/network/`\
  \ 下定义一个名为 `ifroute-*interface_name*` 的额外路由配置文件。\n\n在 routes 文件中添加路由的语法所示：\n\n![Images](img/p0563-02.jpg)\n\
  \n第一列包含路由的目的地。它可能包含网络或主机的 IP 地址或 DNS 主机名。在此列中输入 `default` 表示该路由是默认路由。\n\n***\n\n\
  ![Images](img/note.jpg)\n\n**注意** 我建议在该文件中使用 IP 地址而不是 DNS 名称。如果你的 DNS 服务器宕机或无法访问，路由将会丢失！\n\
  \n第二列包含用于访问指定主机或网络的路由器 IP 地址。在此列中，指定一个可以将信息路由到远程的路由器的 IP 地址。\n\n第三列是路由器后网络或主机的网络掩码。第四列将路由应用于特定接口。如果未指定，则路由适用于所有接口。\n\
  \n***\n\n![Imags](img/note.jpg)\n\n**注意** 如果你想在该文件中留空列，请确保输入一个连字符 (-)。\n\n第五列是可选的。用于指定路由类型。你可以输入以下内容：\n\
  \n![images](img/bull.jpg) `unicast` 指定到目标路由的真实路径。\n![images](img/bull.jpg) `local`\
  \ 目标是本地主机。发送到此路由的数据回环并交付给本地机器。\n![images](img/bull.jpg) `broadcast` 目标是广播地址。发送到此路由的数据作为广播发送。\n\
  ![images](img/bull.jpg) `multicast` 用于多播路由。这种路由类型通常用于路由表。\n![images](img/bull.jpg)\
  \ `unreachable` 配置路由目标为不可达。发送到此路由的数据被静默丢弃。\n\n这是一个示例条目：\n```\n207.68.156.51 207.68.145.45\
  \ 255.255.255.0 ens32\n```\n\n在修改 routes 文件后，你需要通过输入 `ifdown *interface*` 然后 `ifup\
  \ *interface*` 来重启网络接口。\n\n对于你的 LPIC-1/CompTIA Linux+ 考试，你还需要熟悉如何在 shell 提示符下使用\
  \ `route` 命令管理路由。你使用 `route` 命令在 Linux 主机上显示或修改路由表。如果不带选项输入 `route`，它将简单显示当前路由表，如下所示：\n\
  \n![Images](img/p0564-02.jpg)\n\n你可以通过输入 `route add –net *network_address* netmask\
  \ *netmask* gw *router_address*** 向主机的路由表中添加路由。例如，假设你需要通过 IP 地址为 10.0.0.254 的路由器为\
  \ 192.168.2.0/24 网络添加路由。你可以在 shell 提示符下输入 `route add –net 192.168.2.0 netmask 255.255.255.0\
  \ gw 10.0.0.254` 来完成。\n\n你还可以使用 `route` 命令从 Linux 主机的路由表中删除现有路由。这是通过在 shell 提示符下输入\
  \ `route del –net *network_address* netmask *netmask* gw *router_address*** 完成的。例如，假设你想删除刚刚添加的路由。你可以在\
  \ shell 提示符下输入 `route del –net 192.168.2.0 netmask 255.255.255.0 gw 10.0.0.254`\
  \ 来完成。\n\n\n\n\n你也可以使用 `route` 命令来设置默认路由。这通过在 shell 提示符下输入 `route add default gw\
  \ *router_address*` 来。例如，如果你想将 10.0.0.254 添加为你的默认网关路由器，你会在 shell 提示符下输入 `route add\
  \ default gw 10.0.0.254`。\n\n* * *\n\n![Imags](img/tip.jpg)\n\n**提示**  使用 `route`\
  \ 命令所做的更改不是持久的！如果你希望路由更改在重启后仍然有效，你需要将它们添加到你的 `/etc/sysconfig/network/routes` 文件中。\n\
  \n你也可以在 shell 提示符下使用 `ip` 命令来管理路由。例如，要查看路由表，你可以在 shell 提示符下输入 `ip route show`，所示：\n\
  \n![Images](img/p0565-01.jpg)\n\n你还可以使用 `ip` 命令向路由表添加静态路由。这通过在 shell 提示符下输入 `ip\
  \ route add *network*/*prefix* via *router_ip_address* dev *interface*** 来实现。在接下来的示例中，我添加了一个通过\
  \ IP 地址为 10.0.0.254 的路由器指向 192.168.5.0/24 网络的路由：\n\n![Images](img/p0565-02.jpg)\n\
  \n你还可以通过在 shell 提示符下输入 `ip route del *network*/*prefix*** 来从路由表中删除路由。例如，要删除我刚刚添加的\
  \ 192.168.5.0/24 路由，我会输入 `ip route del 192.168.5.0/24`。\n\n### 配置域名解析设置\n\n在为网络接口配置\
  \ IP 设置时，你还需要指定系统的主机名和 DNS 服务器的 IP 地址。由于你很可能是一个精明的互联网用户，你已经知道可以使用域名导航到 Web 上的特定主机。然而，你的\
  \ Linux 系统（或者任何其他操作系统）实际上无法处理我们所熟悉的字母+数字的域名。\n\n例如，当你打开浏览器窗口并在 URL 字段中输入 `http://www.google.com`\
  \ 时，你的浏览器、IP 栈和操作系统并不知道该去哪里获取请求的信息。为了使此工作正常，你的本地系统需要首先将这些域名解析为 IP 地址。\n\n在过去，基础的主机名到\
  \ IP 地址的解析是由 `/etc/hosts` 文件完成的，该文件包含了 IP 地址到主机名的映射。\n\n* * *\n\n![Images](img/note.jpg)\n\
  \n**注意**  Linux 系统上仍然存在 `/etc/hosts` 文件。事实上，它是默认使用的第一个名称解析器。只有当请求的域名的记录在 hosts 文件中不存在时，操作系统才会尝试使用\
  \ DNS 解析主机名。正因如此，你必须非常小心地管理你的 hosts 文件。许多网络攻击利用了操作系统的这一功能。恶意网站或恶意软件可能会尝试重写你的 hosts\
  \ 文件，将名称映射指向互联网上的虚假网站，这些网站看起来像你喜爱的拍卖或银行网站，但实际上是旨在窃取你个人信息的精心设计的精细钓鱼网站。\n\nhosts 文件每条主机记录占一行。语法为：\n\
  \n`IP_address host_name alias`\n\n例如，考虑以下 hosts 文件条目：\n\n`192.168.1.1 mylinux.mydom.com\
  \ mylinux`\n\n该记录将 `mylin.mydom.com` 的完全限定 DNS 名称或 `mylin` 的别名（CNAME）解析为 IP 地址 `192.168.1.1`。通常此文件只包含本地系统的\
  \ IP 地址和主机名，你也可以添加其他条目。\n\n使用 hosts 文件解析主机名运行良好；然而，这作为名称解析的唯一手段实际上不可行。为了解析互联网上主机所使用的所有域名，该文件将变得巨大。此外，每当互联网上的域名发生变化时，你都要手动在文件中添加、删除和修改主机名映射。这简直是场噩梦！你能想象为整个用户网络管理这种类型的\
  \ hosts 文件吗？\n\n更好的选项是将域名提交给 DNS 服务器。当 DNS 服务器接收到名称解析请求时时，它会将提交的域名与 IP 地址进行匹配，并将其返回给请求系统。然后你的系统就可以使用其\
  \ IP 地址连接指定的主机。以下是其工作原理：\n\n**1.** 需要解析主机名的系统向其配置的、位于 IP 端口 53 的 DNS 服务器发送请求。如果该\
  \ DNS 服务器对于请求的主机名所在的区域具有权威性，它将响应相应的 IP 地址。如果不是，过程将继续到第 2 步。\n\n* * *\n\n![Images](img/note.jpg)\n\
  \n**注意**  如果 DNS 服务器在其名称映射数据库中拥有所请求域名的记录，则认为它是具有权威性的。\n\n**2.** DNS 服务器向根级 DNS 服务器发送请求。互联网上有\
  \ 13 个根级 DNS 服务器。每个 DNS 服务器都自动配置了这些服务器的 IP 地址。这些根级 DNS 服务器配置了记录，可以解析到每个顶级域名（.com,\
  \ .gov, .edu, .au, .de, .uk, .ca 等）的权威 DNS 服务器。\n\n**3.** 根级 DNS 服务器向你的 DNS 服务器响应，提供顶级域名服务器的\
  \ IP 地址。\n\n**4.** 你的 DNS 服务器向顶级域名（如 .com）的权威 DNS 服务器发送解析查询。\n\n**5.** 顶级域名 DNS\
  \ 服务器向你的 DNS 服务器响应，提供该区域的 IP 地址。\n\n**6.** 你的 DNS 服务器向主机所在区域的 DNS 服务器发送解析请求。\n\n\
  **7.** 权威 DNS 服务器向你的 DNS 服务器响应，提供主名的 IP 地址。\n\n**8.** 你的 DNS 服务器向系统响应映射到主机的 IP 地址，并使用该地址连接相应的系统。\n\
  \n* * *\n\n![Images](img/note.jpg)\n\n**注意**  一旦针对特定名称发生了过程，大多数 DNS 服务器都会缓存该映射一段时间。这样，如果再次收到同一主名的解析请求，它们可以直接响应客户端。\n\
  \n因此，为了让此系统工作，你必须为系统提供想要使用的 DNS 服务器的 IP 地址。这在 `/etc/resolv.conf` 文件中配置。该文件定义了搜索前缀和使用的名称服务器。以下是我的\
  \ openSUSE 系统 `resolv.conf` 的示例内容：\n\n![Images](img/p0567-01.jpg)\n\n如所示，文件包含两种类型的条目：\n\
  \n![images](img/bull.jpg) **search**  指定用于补全不完整主机名的域名。例如，如果你尝试解析主机名 WS1，该名称将自动转换为完全限定域名\
  \ `WS1.mydom.com`。语法为 `search *domain***。\n\n![images](img/bull.jpg) **nameserver**  指定用于名称解析的\
  \ DNS 服务器的 IP 地址。你可以配置三个 DNS 服务器。如果第一个服务器失败或在无法之外，则使用下一个 DNS 服务器。语法为 `nameserver\
  \ *DNS_server_IP_address***。\n\n你可以使用 `/etc/nsswitch.conf`（名称服务切换）文件来定义用于名称解析的服务顺序。以下是文件中你需要关注的两个行：\n\
  \n![Images](img/p0567-02.jpg)\n\n这两个条目指定了名称解析首先查询 `/etc/hosts` 文件 (files)。如果没有相应的条目，查询将随后发送到\
  \ `resolv.conf` 文件中指定的 DNS 服务器 (dns)。\n\n\n\n\n在我们继续本章内容之前，我们需要花些时间讨论 IPv6 地址配置。在\
  \ IPv6 命名方面，实际上有几种配置选项。第一种是使用静态分配。与 IPv4 类似，静态 IPv6 地址分配要求你手动将整个 128 位的 IPv6 地址和前缀分配给主机。这可以在\
  \ shell 提示符下使用如 `ifconfig` 或 `ip` 等命令行工具完成。或者，你也可以在 `/etc/sysconfig/network` 中相应的接口配置文件手动输入地址和前缀。\n\
  \n另一个配置选项是使用`静态部分分配`(static partial assignment)。使用这种方法，前缀是静态分配的，但地址的接口 ID 部分使用主机的\
  \ MAC 地址自动生成。\n\n另一种配置选项是使用`无状态地址自动配置`(stateless address auto-configuration)，也被地称为\
  \ `SLAAC`。通过 `SLAAC`，我们允许 IPv6 主机自动生成自己的接口 ID，但要求它们通过邻居发现协议 (`NDP`) 从网络路由器（通常是默认网关）获取正确的前缀和默认网关地址。`NDP`\
  \ 使用以下消息进行自动配置：\n\n![images](img/bull.jpg) 路由器请求 (RS) 消息由网络主机发送，请求任何正在监听的路由器响应。\n\
  \n![images](img/bull.jpg) 路由器通告 (RA) 消息由路由器在响应来自网络主机的 `RS` 消息时发送。这些消息告知网络主机它们应该使用的正确\
  \ IPv6 前缀以及默认网关地址。\n\n`NDP` 也被网络主机用于发现网络上其他接口的 MAC 地址，因此在运行 IPv6 时完全取代了 `ARP`。然而，`NDP`\
  \ 无法为网络主机提供 DNS 服务器的地址。它只能提供网络前缀和默认网关地址。\n\n最后一个 IPv6 地址配置选项是使用 `DHCP`。与 IPv4 类似，IPv6\
  \ 地址分配可以使用更新版本的 DHCP（即 `DHCPv6`）自动完成。由于 IPv6 的配置选项比 IPv4 多得多，`DHCPv6` 的运行方式不同。它有两种不同的模式：\n\
  \n![images](img/bull.jpg) `有状态 DHCPv6` (Stateful DHCPv6) 配置 DHCP 服务器为每个 IPv6 DHCP\
  \ 客户端提供 IP 地址、默认网关地址和 DNS 服务器 IP 地址。DHCP 服务器跟踪每个 IPv6 DHCP 客户端的状态，因此被称为“有状态的”。\n\
  \n![images](img/bull.jpg) `无状态 DHCPv6` (Stateless DHCPv6) 不为 IPv6 客户端分配 IPv6 地址，也不跟踪它们的状态。在这种配置中，`DHCPv6`\
  \ 服务器仅向网络主机分配 DNS 服务器 IP 地址。显然，`stateless DHCPv6` 并不提供完整的地址解决方案。相反，它必须与其它 IPv6 地址分配方案（如\
  \ `SLAAC`）结合使用。\n\n当 IPv6 主机启动时，它会按照下文描述的过程在 fact 网络接口上配置地址：\n\n1. 主机使用链路本地前缀（通常以\
  \ `FE80` 开头）结合从其 MAC 地址派生的接口 ID，自动生成 IPv6 链路本地地址。\n2. 主机发送一个指向其自身的链路本地地址的邻居请求 (`NS`)\
  \ 消息，以确保网络上没有其他主机正在使用该地址。\n3. 主机发送一个组播 `RS` 消息，该消息应该被同一网络网段上的所有路由器接收。如果没有路由器响应，主机将尝试使用\
  \ `stateful DHCPv6` 来接收 IPv6 地址。\n4. 如果路由器接收到 `RS` 消息，它将向网络网段上的所有主机发送组播 `RA` 消息。`RA`\
  \ 消息标识了 IPv6 地址的配置方式。可能的选项包括：\n   - 从 `DHCPv6` 服务器获取所有 IPv6 配置信息。如果是这种情况，主机将向任何正在监听的\
  \ `DHCPv6` 服务器发送 `REQUEST` 消息。\n   - 使用无状态自动配置从 `RA` 消息中获取前缀和默认网关，并自动生成其地址的接口 ID\
  \ 部分。DNS 的地址必须从 `DHCPv6` 服务器获取。\n5. 如果已配置了静态 IPv6 地址或使用了有状态自动配置，主机将发送 `NS` 消息以确保没有其他人在使用其地址。\n\
  \n考虑到这些，接下来让我们来看一些你可以用于在 Linux 上故障排除网络问题的工具。\n\n### 故障排除网络问题\n\n安装好你的网络接口只是成功了一半。为了实现通信，你需要使用各种测试和监控工具来确保网络本身运行正常。我们将在章的这部分讨论如何实现。我们将涵盖以下主题：\n\
  \n- 使用标准故障排除模型\n- 使用 `ping`\n- 使用 `netstat`\n- 使用 `traceroute`\n- 使用 `nc`\n- 使用名称解析工具\n\
  \n让我们从讨论如何使用标准故障排除模型开始。\n\n#### 使用标准故障排除模型\n\n成为一名优秀的故障排除者是成为高效 Linux 系统管理员的关键部分。我教新系统管理员已经快二十年了，这是某些人来说最难掌握的技能之一。一些新管理员似乎对如何故障排除问题有一种直觉；而另一些人则没有。在我看来，这是因为故障排除是一门艺术形式。正如对于我们某些人（包括我在内）学习绘画、雕塑或绘画很难一样，对于我们某些人学习如何故障排除也很困难。\n\
  \n然而，我注意到，通过一些培训和大量的练习，大多数新管理员最终都能学会如何有效地进行故障排除。做到这一点有三个关键：\n\n- 使用可靠的故障排除程序\n-\
  \ 获取故障排除工具的实用知识\n- 积累大量的故障排除经验\n\n最后一点超出了本书的范围。获得故障排除经验的唯一方法是在该领域工作几年。然而，我们可以从前两点入手。在本章的最后部分，我们将专门关注网络问题的故障排除。但是，我们在这里讨论的程序可以广泛应用于任何系统问题。\n\
  \n网络问题可能由各种问题引起，我在这里甚至无法列举所有。相反，我想关注如何使用标准化的流程对网络问题进行故障排除。通过使用标准化的流程，你可以适应、应对并解决广泛的网络问题。我在这里提出的模型并非涵盖所有内容。你可能需要根据你的具体情况添加、删除或重新组织步骤。然而，我希望它能给你一个良好的起点。\n\
  \n许多新系统管理员在故障排除系统或网络问题时犯了一个关键错误。他们没有使用有条的故障排除方法，而是在真正知道问题是什么之前就鲁莽地尝试实施修复。我将其称为“散枪式故障排除”。管理员尝试一个接一个修复方案，希望其中一个能修复问题。\n\
  \n\n\n\n这是一个非常危险的做法。我见过系统管理员这样做，结果产生的问题比他们解决的还要多。有时他们甚至会造成灾难性的后果。举例来说：几年前，我正在一个网络中设置几台服务器。其中一台服务器配置错误，在与其他系统同步信息时遇到困难。当我试图弄清楚问题根源时，我的同事（我们称他为\
  \ Syd）开始以“散枪小米”式的方式一个接一个地实施修复方案，试图让该服务器与其他服务器同步。在这个过程中，他竟然以灾难性的方式把所有服务器都搞砸了！实际问题相对较小，只需要大约\
  \ 20 分钟就能修复。结果，我们不得不花了一整天和晚上部分时间，从头重新安装每台服务器并恢复它们的数据。\n\n你不应该使用散枪小米式的故障排除，而应该使用一种标准的故障排除模型。故障排除模型的目标是在开始修复问题*之前*，具体地确定问题的来源。我知道这听起来很简单，但许多系统管理员在这个概念上都很挣。有一个建议的故障排除模型，你可以用它来开发自己的个人故障排除方法论：\n\
  \n### 步骤 1 收集信息\n这是一个关键步骤。你需要确定到底发生了什么。症状是什么？是否显示了任何错误信息？信息里说了什么？问题的范围有多大？是局限于单个系统，还是许多系统都遇到了相同的问题？\n\
  \n### 步骤 2 识别发生的变化\n在这一步中，你应该识别系统中发生了哪些变化。是否安装了新软件？是否安装了新硬件？用户更改了什么吗？你更改了什么？\n\n\
  ### 步骤 3 建立假设\n根据在前步骤中收集的信息，提出几个可以解释问题的假设。为了做到这一点，你可能需要进行研究。你应该检查互联网上提供的常见问题解答（FAQ）和知识库。你还应该咨询同事来验证你的假设。利用你获得的信息，将结果缩小到一个或两个最可能的原因。\n\
  \n### 步骤 4 确定合适的修复方案\n下一步是利用同事、FAQ、知识库以及你自己的经验来确定修复问题所需的步骤。在执行此操作时，务必识别实施修复可能产生的影响并考虑这些因素。很多时候，修复可能会产生副作用，其后果与原始问题相当甚至更糟。\n\
  \n### 步骤 5 实施修复\n到此时，你已经准备好实施修复了。注意，在这个故障排除模型中，我们在实施修复之前做了大量的研究！这样做大大增加了成功的概率。在实施修复后，务必验证修复是否确实修复了问题，以及问题是否没有再次出现。\n\
  \n### 步骤 6 确保用户满意\n这是许多系统管理员犯的一个关键错误。我喜欢教学生那句格言：“如果用户不满意，你也不会满意。”我们系统管理员的沟通能力糟糕而出了名。如果问题影响了用户，你需要与他们沟通问题的性质，并确保他们意识到问题已经解决。如果适用，你还应该教他们如何防止问题在未来再次发生。你还应该与用户的主管进行沟通，确保他们知道问题已经解决。\n\
  \n### 步骤 7 记录解决方案\n最后，你需要对问题的解决方案进行记录。这样，当问题在一年或年后再次发生时，你或其他系统管理员就能快速识别问题以及如何修复它。\n\
  \n如果你使用这种方法论，随着你在现实世界中获得经验，你将学会成为一名非常高效的故障排除者。\n\n除了使用故障排除方法外，你还需要了解如何为 Linux+/LPIC-1\
  \ 考试使用各种网络故障排除工具。让我们先讨论如何使用 `ping` 实用。\n\n### 使用 ping\n\n`ping` 实用是我的好朋友。它是我网络虚拟工具箱中最实用的工具之一。我经常使用\
  \ `ping` 来测试网络中主机之间的连接性。Ping 的工作原理是从源系统向目标系统发送 ICMP 回显请求包。目标系统随后回复一个 ICMP 回显响应包。这一过程在图\
  \ 15-13 中所示。\n\n![Images](img/f0572-01.jpg)\n\n**图 15-13** 使用 ping\n\n如果发送系统接收到了\
  \ ICMP 回显响应包，你就知道三件事：\n\n![images](img/bull.jpg) 你的网络接口工作正常。\n\n![images](img/bull.jpg)\
  \ 目标系统已启动且运行正常。\n\n![images](img/bull.jpg) 你的系统与目标系统之间的网络硬件工作正常。\n\n***\n\n![Imags](img/note.jpg)\n\
  \n**注意** 请注意，许多操作系统使用的许多主机防火墙默认配置为不响应 ICMP 回显请求包。这样做是为了防止各种利用大量 ping 请求的拒绝服务（DoS）攻击。这种配置可能会给出目标系统已宕机的假象。实际上，它运行良好；只是主机上的防火墙阻止了\
  \ ping 包到达操作系统。\n\n了解这些信息是有价值的！使用 `ping` 的基本语法是 `ping destination_IP_address`。这会导致\
  \ ICMP 回显请求包发送到指定的主机。例如，你可以输入 `ping 192.168.2.1` 来 ping 具有该地址的主机。这在图 15-14 中所示。\n\
  \n![Images](img/f0572-02.jpg)\n\n**图 15-14** 通过 IP 地址 ping\n\n注意在图 15-14 中，每次 ping\
  \ 的结果显示在单行中。每行显示了回显响应的大小（64 字节）、来源（192.168.2.1）、其生存时间值（63）以及往返时间（4.25 ms 到 1.01\
  \ ms）。\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 生存时间（TTL）值指定了数据包在被丢弃之前允许穿越路由器数量。\n\
  \n默认情况下，`ping` 实用会继续向主机发送 ping 请求，直到你按下 CTRL-C 停止。你可以使用 `ping` 命令的 `-c` 来指定 ping\
  \ 的次数。例如，你可以输入 `ping -c 10 192.168.2.1` ping 十次并退出。\n\n你也可以通过主机名而不是 IP 地址进行 ping。只要你的系统配置了有效的\
  \ DNS 服务器地址，`ping` 就会将主机名解析为 IP 地址并向发送 ping 请求。这在图 15-15 中所示。\n\n![Images](img/f0573-01.jpg)\n\
  \n**图 15-15** 通过主机名 ping\n\n使用主机名 ping 可以是一个非常有用的故障排除工具。它可以让你知道 DNS 服务器是否存在问题。例如，如果通过\
  \ IP 地址 ping 可以但通过主机名 ping 不行，你就知道基础网络配置和连接性工作正常，但 DNS 服务器存在问题。\n\n你还可以使用 ping 测试\
  \ IPv6 通信。但是，你必须使用 `ping6` 命令而不是 ping。\n\n### 使用 netstat\n\n`netstat` 实用是你虚拟工具箱中的另一个强大工具。该实用可以执行以下操作：\n\
  \n![images](img/bull.jpg) 列出网络连接\n\n![images](img/bull.jpg) 显示你的路由表\n\n![images](img/bull.jpg)\
  \ 显示关于你的网络接口的信息\n\n使用 `netstat` 的语法是在 shell 提示符处输入 `netstat`。你可以使用表 15-5 中列出的选项。\n\
  \n![Images](img/t0573-01.jpg)\n\n\n\n\n表 15-5 netstat 选项\n\n除了 `netstat`，你还应该熟悉\
  \ `traceroute`。让我们接下来来看这个工具。\n\n### 使用 traceroute\n\n`traceroute` 工具非常酷。。请记住，如果你尝试向一个不在你本地网络网段的\
  \ IP 主机发送信息，数据包将发送到你的默认网关路由器。该路由器随后将使用多种路由协议来确定如何将数据包送到目标系统。在此过程中，数据包可能需要在路由器、路由器和路由器之间传输才能到达那里。这在图\
  \ 15-16 中所示。\n\n![Images](img/f0574-01.jpg)\n\n图 15-16 IP 网络中的路由\n\n这是 IP 网络的魅力之处之一。你可以使用路由器将多个网络连接在一起并在它们之间传输数据。正是这种功能使得互联网得以存在。你可以使用网络浏览器向位于世界上某处的\
  \ Web 服务器发送 http 请求数据包，并使其返回你想要查看的网页。路由器使用的路由协议会根据系统负载动态确定数据包采取的最佳路线。所选路线可能会随着网络状况的变化而改变。\n\
  \n`traceroute` 工具可以追踪数据包必须穿越这些路由器才能到达目的地的路由。它使用与 `ping` 工具相同的 ICMP 请求数据包和 ICMP 响应数据包，但它操作了这些数据包的\
  \ TTL 参数。结果是，数据包在通过网络到达目标主机的过程中，经过的每个路由器都会向源系统发送一个 ICMP 响应数据包，为你提供一个显示源和目的系统之间路由的列表。\n\
  \n如果你在网络之间遇到通信问题，这个工具可以是一个非常有用的工具。`traceroute` 工具可以帮助你追踪路由中哪个路由器没有正常工作。使用此工具的语法为\
  \ `traceroute destination_hostname_or_IP_address`。当你运行它时，`traceroute`会为数据包通往目标系统过程中经过的每个路由器创建一行。这在图\
  \ 15-17 中所示。\n\n![Images](img/f0575-01.jpg)\n\n图 15-17 使用 traceroute\n\n如你在图 15-17\
  \ 中所示，路由器的 IP 地址将同往返时间统计一起显示。与 `ping` 命令一样，你也可以配合 IPv6 协议使用 `traceroute` 命令。要这样做，你需要运行\
  \ `traceroute6` 而不是 `traceroute`。\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 你也可以使用\
  \ `tracepath` 命令来追踪到远程网络主机的路由。其语法、功能和输出与 `traceroute` 几乎相同。与 `traceroute` 一样，你可以运行\
  \ `tracepath6` 在此命令中使用 IPv6 协议。\n\n## 使用 nc\n\n`netcat` 命令 (`nc`) 是测试主机间网络通信的一个非常有用的工具。它比\
  \ `ping` 命令更进了一步，实际上在两个网络主机之间建立了 TCP 或 UDP 连接。使用此命令的方法是在一个主机上打开一个监听 TCP 或 UDP 套接，然后从另一个主机连接到该套接。在下面的示例中，我首先在测试的主机之一上打开一个\
  \ TCP 监听套接：\n\n```\nopenSUSE:/ # nc -l 2388\n```\n\n`-l` 选项告诉 `netcat` 监听传入连接连接而不是尝试与另一台计算机建立连接。因为我没有指定协议，所以默认使用\
  \ TCP。如果我想使用 UDP，则需要在命令中包含 `-u` 选项。我还指定了要监听的 IP 端口 (2388)。\n\n在一个系统上建立了监听套接后，我可以从另一个系统连接到它，并再次使用\
  \ `nc` 命令建立 TCP（或 UDP）连接。这次我输入以下内容：\n\n```\n[root@fs5 ~]# nc 10.0.0.83 2388\n```\n\
  \n此命令告诉 `nc` 要连接的主机的 IP 地址以及使用哪个 IP 端口。一旦建立连接，我可以在第二个系统的提示符处输入文本，并查看它是否出现在第二个系统的屏幕上，如下所示：\n\
  \n![Images](img/p0575-03.jpg)\n\n如果此测试成功，你就知道这两个主机之间可以建立 TCP 或 UDP 连接。\n\n***\n\n\
  ![Images](img/note.jpg)\n\n**注意** 你必须在两个系统的防火墙中打开相应的端口；否则，此测试将不起作用！\n\n让我们来看几个你可以用于网络上名称解析的工具。\n\
  \n## 使用名称解析工具\n\n使用 DNS 进行名称解析效果非常好——除非它工作不正常。如果是那样，它会给你带来极大不便，因为你的终端用户将无法检查股票价格或管理他们的幻想棒球团队。幸运的是，有几个工具可以用于排除网络名称解析故障：\n\
  \n![images](img/bull.jpg) dig\n\n![images](img/bull.jpg) host\n\n![images](img/bull.jpg)\
  \ getent\n\n### dig\n\n你可以使用域名信息分组器 (`dig`) 工具在你的 DNS 服务器上执行 DNS 查找，并显示有关正在解析的主机名以及\
  \ DNS 服务器本身的详细信息。如果你在执行 `dig` 时没有指定 DNS 服务器，则将使用 `resolv.conf` 文件中指定的 DNS 服务器。一个示例在图\
  \ 15-18 中所示。\n\n![Images](img/f0577-01.jpg)\n\n图 15-18 使用 dig 解析主机\n\n`dig` 的输出比\
  \ `nslookup` 和 `host` 等 DNS 工具要详细得多。`dig` 命令在 `ANSWER` 部分返回与主机相关的 IP 地址。它还会列出 `AUTHORITY`\
  \ 部分的主机和区域的权威名称服务器。你可以在 `dig` 中使用以下选项：\n\n![images](img/bull.jpg) a Resolve A 记录\n\
  \n![images](img/bull.jpg) ptr Resolve PTR 记录\n\n![images](img/bull.jpg) cname Resolve\
  \ CNAME 记录\n\n![images](img/bull.jpg) in Resolve IN 记录\n\n![images](img/bull.jpg)\
  \ mx Resolve MX 记录\n\n![images](img/bull.jpg) soa Resolve SOA 信息\n\n### host\n\n\
  你也可以使用 `host` 命令来解析主机名。虽然 `dig` 命令提供详尽的信息，但 `host` 提供简单快速的信息。其语法与 `dig` 。你在提示符处输入\
  \ `host hostname DNS_server`。再次，如果你没有指定 DNS 服务器，将使用 `/etc/resolv.conf` 中指定的 DNS\
  \ 服务器。使用 `host` 的示例在此：\n\n![Images](img/p0577-01.jpg)\n\n### getent\n\n除了 `host`\
  \ 和 `dig`，你还可以使用 `getent` 测试你的名称解析系统。`host` 和 `dig` 命令的缺点之一是，它们并没有遵循与系统中运行的应用程序和服务相同的名称解析过程。如果像网络浏览器之类的应用程序需要将主机名解析为\
  \ IP 地址，它首先查询 `/etc/hosts` 文件。如果没有找到问题主目的项，它将使用你配置的 DNS 服务器来解析主机名。\n\n然而，`dig` 和\
  \ `host` 命令并不这样做。它们完全跳过了 hosts 文件，直接连接到你的 DNS 服务器来测试名称解析。这是一个令人担忧的问题！许多钓鱼和网络欺骗攻击利用\
  \ hosts 文件将 URL 重定向到恶意网站，在这些网站可以获取用户的个人信息。如你所见，使用 `host` 或 `dig` 将无法发现此类攻击，因为它们不查看\
  \ hosts 文件。\n\n好消息是 `getent` 会这样做。使用 `getent` 测试名称解析的语法是在 shell 提示符处输入 `getent hosts\
  \ hostname`。接下来的示例如下：\n\n![Images](img/p0578-01.jpg)\n\n\n\n\n在本示例中，`hosts` 文件中存在\
  \ `router1` 主机名的条目，因此 `getent` 能够获取并将其显示在屏幕上。如果 `hosts` 文件中没有指定主机名的条目，它将尝试通过 DNS\
  \ 进行解析，就像普通应用程序一样。接下来的示例：\n\n![Images](img/p0578-02.jpg)\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** `getent` 命令可以查询你的 `/etc/nsswitch.conf` 文件中配置的任何数据。例如，你可以在 shell 提示符处输入\
  \ `getent passwd` 来从 `passwd` 文件中提取条目。\n\n让我们在下面的练习中练习使用网络命令。\n\n### 练习 15-2：使用网络命令\n\
  \n在此练习中，你将练习使用网络命令来管理和排查网络接口故障。此练习假设你已连接到互联网。你可以使用书中附的虚拟机执行此练习。运行快照 `15-1` 以获得正确配置的环境。\n\
  \n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 15-2 视频，演示如何执行此任务。\n\n完成完成以下操作：\n\
  \n1. 启动你的 Linux 系统并以学生用户登录。\n2. 打开终端会话。\n3. 通过输入 `su –` 后接密码 `student` 切换到 root\
  \ 用户账户。\n4. 在 shell 提示符处输入 `ping www.google.com` 测试连通性。你的系统应该将主机名解析为 IP 地址并向发送 ICMP\
  \ 回显请求包。（如果你的系统未连接互联网，此步骤将无法运行。）\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 如果无法\
  \ ping 远程网站，请使用 `ifconfig` 命令验证是否分配了 IP 地址。如果没有分配地址，请输入 `systemctl restart network`\
  \ 重新加载网络配置。\n\n5. 在 shell 提示符处输入 `netstat –s | more` 显示网络接口的摘要信息。查看显示的信息。\n6. 在\
  \ shell 提示符处输入 `traceroute www.google.com` 追踪到 `www.google.com` 的路由。注意数据包在穿越互联网到达\
  \ `www.google.com` 经过的各种路由器。\n7. 在 shell 提示符处输入 `dig www.google.com` 生成关于 `www.google.com`\
  \ 的扩展名称解析。\n\n### 章节回顾\n\n在本章中，你学习了如何在你的 Linux 系统上设置网络。我首先指出，在大多数现代组织中，你可能会使用以太网网卡和\
  \ `IP` 协议。我指出协议是一种常见的网络“语言”，必须配置它才能让两个主机进行通信。\n\n我指出`网际协议”（`IP`）与`传输控制协议”（`TCP`）或`用户数据报文协议”（`UDP`）结合，对网络数据进行分段、传输、去分段和排序，以实现主机之间的通信。我们还查看了`网络控制消息协议”（`ICMP`），它是\
  \ `IP` 协议族中的另一个核心协议。它与作为传输协议的 `TCP` 和 `UDP` 不同之处。`ICMP` 的主要作用是测试和验证主机之间的网络通信。\n\n\
  我回顾了`OSI 参考模型`的作用和功能。我提到`OSI 参考模型`层将整个通信过程分解为特定的任务。信息在发送系统中通过层层向下流动，然后在网络介质上传输。随后信息在接收侧层层向上。`OSI\
  \ 参考模型`共有七层：\n\n![images](img/bull.jpg) 物理层\n![images](img/bull.jpg) 数据链路\n![images](img/bull.jpg)\
  \ 网络层\n![images](img/bull.jpg) 传输层\n![images](img/bull.jpg) 会话层\n![images](img/bull.jpg)\
  \ 表示层\n![images](img/bull.jpg) 应用层\n\n我然后讨论了`IP 端口`的概念。端口由传输层上的 `TCP` 和 `UDP` 协议提供。本质上，端口是\
  \ `TCP` 和 `UDP` 为上层协议提供的逻辑连接。端口允许具有单个 `IP` 地址的单个主机提供多个网络服务。每个服务使用相同的 `IP` 地址，但使用各自不同的\
  \ `TCP` 或 `UDP` 端口号。端口号范围从 `0` 到 `65536`。这些端口的使用方式由“互联网分配数字机构”（`ICANN`）监管。端口被分为三类：\n\
  \n![images](img/bull.jpg) 良好端口\n![images](img/bull.jpg) 注册端口\n![images](img/bull.jpg)\
  \ 动态端口\n\n我们接着查看了 `IPv4` 地址的工作原理。网络上的每个主机必须具有相同的子网掩码。子网掩码定义了给定主机有多少部分是网络地址。当用二进制查看时，任何为\
  \ `1` 的位都代表网络地址。任何为 `0` 的位都代表主机。IP 地址分为几类。每类都有默认的子网掩码：\n\n![images](img/bull.jpg)\
  \ `10.0.0.0–10.255.255.255`（A 类）\n![images](img/bull.jpg) `172.16.0.0–172.31.255.255`（B\
  \ 类）\n![images](img/bull.jpg) `192.168.0.0–192.168.255.255`（C 类）\n\n你不必使用这些默认子网掩码。你也可以只使用字节中的部分作为网络。这被称为`部分子网划分`或`可变子网掩码`（`VLSM`）。使用\
  \ `VLSM`，我们忽略了默认的子网边界并指定了自定义的子网位。同一网络上的主机必须具有相同的子网掩码。为了将域名解析为 IP 地址，你的 Linux 系统还必须配置组织\
  \ DNS 服务器的 IP 地址。此外，你还必须配置网络网段的默认网关路由器的 IP 地址，以便与其他网段的主机通信。\n\n我们还查看了公有和私有 IP 地址的概念。公网使用全球唯一的、注册的\
  \ IP 地址。私有网络使用不可路由、未注册、非唯一的 IP 地址。你可以使用 `NAT` 路由器将私有网络隐藏在一个或多个公共接口之后。这允许你仅使用较少的全球唯一的\
  \ IP 地址即可实现它们的网络。在每类 IP 地址中，都有一些称为`私有`或`保留` IP 地址的地址块。这些地址是未分配的，任何想要使用它们的人都可以使用。私有\
  \ 地址 地址范围：\n\n![images](img/bull.jpg) `10.0.0.0–10.255.255.255`（A 类）\n![images](img/bull.jpg)\
  \ `172.16.0.0–172.31.255.255`（B 类）\n![images](img/bull.jpg) `192.168.0.0–192.168.255.255`（C\
  \ 类）\n\n我们还查看了 `IPv6`。`IPv6` 地址由八个四字符十六进制数字组成，用冒号代替点分隔。例如，一个有效的 `IPv6` 地址可以是 `35BC:FA77:4898:DAFC:200C:FBBC:A007:8973`。这个\
  \ 128 位地址包含两个部分：\n\n![images](img/bull.jpg) 前缀（prefix`）是前 64 位。它包括网络和子网地址。\n![images](img/bull.jpg)\
  \ 接口 ID（interface ID`）是最后 64 位。这是分配给网络主机的唯一地址。\n\n你需要熟悉的三种 `IPv6` 地址：\n\n![images](img/bull.jpg)\
  \ 全局单播\n![images](img/bull.jpg) 唯一本地\n![images](img/bull.jpg) 链路本地\n\n\n\n随后我切换了话题，讨论了如何在\
  \ Linux 系统中配置以太网网络接口。你需要完成的第一项任务是在系统中安装网络网卡并将其连接到网络。然后，你需要为网卡加载适当的内核模块。对于较新的网卡，这一过程会自动完成。对于旧或不常见的网络网卡，你可能需要手动进行。完成后，网络网卡应该会为其创建一个别名（alias）。如果你的发行版使用\
  \ `init`，那么系统中的第一个接口将命名为 `eth0`。随后的网卡应为其创建以下别名：`eth1`、`eth2`、`eth3` 等。\n\n使用 `systemd`\
  \ 的发行版不再使用这种网络接口命名约定。相反，它们使用可预测的网络接口名称。这允许将特定的别名永久地分配给特定的网络接口。可预测的网络接口设备名称根据以下参数之一分配。首选顺序如下：\n\
  \n![images](img/bull.jpg) 对于板载网络适配器，使用系统固件（或 `BIOS`）提供的索引号来构建别名。\n\n![images](img/bull.jpg)\
  \ 如果网络适配器插在 `PCI-E` 热插槽上而不是集成在主板上，那么 `systemd` 将使用固件（或 `BIOS`）提供的插槽本身的索引号来构建别名。\n\
  \n![images](img/bull.jpg) 如果上述选项不适用，`systemd` 将尝试使用接口所连接的物理连接器名称（例如 USB 连接器）来构建别名。\n\
  \n![images](img/bull.jpg) 如果所有其他方法都失败，`systemd` 将尝试使用接口的 MAC 地址来构建别名。\n\n网卡安装后，你需要使用\
  \ `ifconfig` 命令或 `dhclient` 命令为网络接口配置相应的 IP 配置参数。当你在 shell 提示符处输入 `ifconfig` 而不带任何参数时，将显示已安装的网络接口详细信息。要分配\
  \ IP 信息，请在 shell 提示符处输入 `ifconfig *interface ip_address* netmask *subnet_mask* broad-cast\
  \ *broadcast_address*`。要使其持久，你需要在 `/etc/sysconfig/network` 目录下的相应文件中输入你的 IP 配置参数。\n\
  \n你也可以使用 `ip` 命令来管理你的网络接口。该命令可以用于：\n\n![images](img/bull.jpg) 查看当前的 IP 配置。\n\n![images](img/bull.jpg)\
  \ 配置 IP 地址参数。\n\n![images](img/bull.jpg) 禁用或启用网络接口。\n\n要分配 DNS 服务器地址或默认网关路由器地址，你需要编辑几个配置文件：\n\
  \n![images](img/bull.jpg) **DNS 服务器地址** `/etc/resolv.conf`\n\n![images](img/bull.jpg)\
  \ **默认网关路由器地址** `/etc/sysconfig/network/routes`\n\n要关闭网络接口，你可以在 shell 提示符处输入 `ifdown`。要启用它，输入\
  \ `ifup`。要使用 DHCP 服务器为 Linux 主机动态分配 IP 信息，在 shell 提示符处输入 `dhclient *interface*`。\n\
  \n然后我们花了一些时间研究了配置 IPv6 协议。IPv6 地址的分配过程与 IPv4 地址完全不同。你可以使用：\n\n![images](img/bull.jpg)\
  \ 静态地址分配\n\n![images](img/bull.jpg) 静态部分分配\n\n![images](img/bull.jpg) 无状态自动配置\n\n\
  ![images](img/bull.jpg) DHCPv6 配置\n\n我在本章结束处讨论了若干种你可以用于测试和监控网络的命令行工具。你可以使用 `ping`\
  \ 命令测试系统之间的连通性。语法为 `ping *destination_host*`。你可以使用 `netstat` 命令并配合 `-a`、`-i`、`-l`、`-s`\
  \ 和 `-r` 选项查看各种网络接口信息。配合 IPv6 使用 ping，运行 `ping6` 命令。你还可以使用 `traceroute` 工具跟踪数据包到达远程系统必须遵循的路径。使用\
  \ traceroute 的语法为 `traceroute *destination_host*`。配合 IPv6 使用 traceroute，运行 `traceroute6`\
  \ 命令。\n\n要测试 TCP 或 UDP 通信，你使用 `nc` 命令，它代表 `netcat`。该工具可用于两个网络主机之间建立 TCP 或 UDP 连接。首先，你在一个主机上开启一个监听的\
  \ TCP 或 UDP socket，然后从另一个主机连接到该 socket。如果此测试有效，你就知道这两个主机之间可以建立 TCP 或 UDP 连接。\n\n\
  我们还查看了用于测试名称解析的工具，包括 `dig`、`host` 和 `getent`。`dig` 和 `host` 命令用于验证你的 DNS 服务器是否正确解析\
  \ IP 地址。`getent` 命令首先使用你的 hosts 文件测试名称解析。如果在该其中找不到条目，它将查询你的 DNS 服务器来解析名称。\n\n##\
  \ 加速复习\n\n![images](img/bull.jpg) 你极可能会处理以太网网卡和 IP 协议。\n\n![images](img/bull.jpg)\
  \ 在管理 Linux 系统时，是一种常用的网络语言。\n\n![images](img/bull.jpg) 互联网协议 (IP) 与 TCP 或 UDP 工作，负责分片数据。\n\
  \n![images](img/bull.jpg) 互联网控制消息协议 (ICMP) 用于测试和验证网络。\n\n![images](img/bull.jpg)\
  \ OSI 模型由以下层次组成：\n\n![images](img/bull.jpg) 物理层\n\n![images](img/bull.jpg) 数据链路层\n\
  \n![images](img/bull.jpg) 网络层\n\n![images](img/bull.jpg) 传输层\n\n![images](img/bull.jpg)\
  \ 会话层\n\n![images](img/bull.jpg) 表示层\n\n![images](img/bull.jpg) 应用层\n\n![images](img/bull.jpg)\
  \ 端口由传输层的 TCP 和 UDP 协议提供。\n\n![images](img/bull.jpg) 端口是为上层协议提供的逻辑连接。\n\n![images](img/bull.jpg)\
  \ 端口允许具有单一 IP 地址的主机提供多个服务。\n\n![images](img/bull.jpg) 端口被分为三类：\n\n![images](img/bull.jpg)\
  \ 良好端口\n\n![images](img/bull.jpg) 注册端口\n\n![images](img/bull.jpg) 动态端口\n\n![images](img/bull.jpg)\
  \ IPv4 网络上的每个主机必须分配唯一的 IP 地址以及正确的子网掩码。\n\n![images](img/bull.jpg) 子网掩码定义了给定主机 IP\
  \ 地址中部分是网络地址，部分是主机地址。\n\n![images](img/bull.jpg) IP 地址分为若干类，每类都有默认子网掩码：\n\n![images](img/bull.jpg)\
  \ **A 类** 255.0.0.0\n\n![images](img/bull.jpg) **B 类** 255.255.0.0\n\n![images](img/bull.jpg)\
  \ **C 类** 255.255.255.0\n\n![images](img/bull.jpg) 使用 VLSM，你可以忽略默认子网掩码边界并指定自定义的子网掩码位数。\n\
  \n![images](img/bull.jpg) 同一网段的主机必须具有相同的子网掩码，并分配给每个主机。\n\n![images](img/bull.jpg)\
  \ 网络主机必须配置 DNS 服务器地址以将域名解析为 IP 地址。\n\n![images](img/bull.jpg) 网络主机必须配置网段的默认网关路由器地址，以便与其他网段的主机进行通信。\n\
  \n![images](img/bull.jpg) IPv6 地址由八个四字符十六进制数组成，用冒号而不是点分隔。\n\n![images](img/bull.jpg)\
  \ 128 位的 IPv6 地址分为两个部分：\n\n![images](img/bull.jpg) *前缀* 是前 64 位。\n\n![images](img/bull.jpg)\
  \ *接口 ID* 是后 64 位。\n\n\n\n\n![images](img/bull.jpg) 公共网络使用全球唯一的、注册过的 IP 地址。\n\n\
  ![images](img/bull.jpg) 私有网络使用不可路由、未注册且非唯一的 IP 地址。\n\n![images](img/bull.jpg) 在每个类别的\
  \ IP 地址中，都有被称为私有或保留 IP 地址的地址块：\n\n![images](img/bull.jpg) 10.0.0.0–10.255.255.255\
  \ (A 类)\n\n![images](img/bull.jpg) 172.16.0.0–172.31.255.255 (B 类)\n\n![images](img/bull.jpg)\
  \ 192.168.0.0–192.168.255.255 (C 类)\n\n![images](img/bull.jpg) 你可以使用 NAT 路由器将私有网络隐藏在一个或多个公共接口之后。\n\
  \n![images](img/bull.jpg) 在 Linux 系统中安装以太网接口，你首先需要在系统中安装网络网卡并将其连接到网络介质。\n\n![images](img/bull.jpg)\
  \ 接下来，你需要为该网卡加载适当的内核模块。\n\n![images](img/bull.jpg) 如果你的发行版使用 `init`，则第一个网卡应该为其创建一个名为\
  \ `eth0` 的别名。\n\n![images](img/bull.jpg) 额外的网卡将分配 `eth1`、`eth2` 等别名。\n\n![images](img/bull.jpg)\
  \ 使用 `systemd` 的发行版使用可预测的网络接口名称。\n\n![images](img/bull.jpg) 你可以在 shell 提示符下输入 `ifconfig`\
  \ 来查看安装的网络接口的详细信息。\n\n![images](img/bull.jpg) 为网络接口分配 IP 地址，请在 shell 提示符下输入 `ifconfig\
  \ interface ip_address netmask subnet_mask broadcast broadcast_address`。\n\n![images](img/bull.jpg)\
  \ 使 IP 地址分配持久，请它们输入 `/etc/sysconfig/network` 目录下的相应文件中。\n\n![images](img/bull.jpg)\
  \ 你也可以使用 `ip` 命令来管理你的网络接口。\n\n![images](img/bull.jpg) 在 `/etc/resolv.conf` 文件中输入组织的\
  \ DNS 服务器地址。\n\n![images](img/bull.jpg) 在 `/etc/systconfig/network/routes` 文件中输入网段的默认网关路由器地址。\n\
  \n![images](img/bull.jpg) 在 shell 提示符下输入 `ifdown` 来关闭网络接口。\n\n![images](img/bull.jpg)\
  \ 输入 `ifup` 来启用网络接口。\n\n![images](img/bull.jpg) 要为 Linux 主机动态分配 IP 地址，请在 shell 提示符下输入\
  \ `dhclient interface`。\n\n![images](img/bull.jpg) IPv6 地址使用以下过程之一分配：\n\n- 静态地址分配\n\
  - 静态部分分配\n- 无状态自动配置\n- DHCPv6 配置\n\n![images](img/bull.jpg) Linux 包含了多种你可以用于测试和监控网络的命令行实用程序。\n\
  \n- 使用 `ping` 测试系统之间的连通性。其语法为 `ping destination_host`。\n\n- 使用 `ping6` 测试主机之间的 IPv6\
  \ 通信。\n\n- 使用 `netstat` 命令通过 `-a`、`-i`、`-l`、`-s` 和 `-r` 查看各种网络接口信息。\n\n- 使用 `traceroute`\
  \ 工具跟踪数据包到达远程系统所遵循的路径。语法为 `traceroute destination_host`。\n\n- 使用 `traceroute6` 测试主机之间的\
  \ IPv6 路由。\n\n- 使用 `route` 命令或 `netstat -r` 命令查看系统的路由表。\n\n- 测试 TCP 或 UDP 通信，使用\
  \ `nc` 命令。\n\n- 使用 `route` 命令从路由表中添加或删除路由。\n\n- 你可以使用 `dig`、`host` 和 `getent` 命令测试\
  \ DNS 域名解析。\n\n## Questions\n\n**1.** 关于 MAC 地址，以下哪些项是正确的？（选择两个。）\n\nA. 它是硬编码在网卡中的。\n\
