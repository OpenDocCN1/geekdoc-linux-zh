  \n**A.** 0\n**B.** 32768\n**C.** 98304\n**D.** 163840\n\n**[5].** 你使用 `fdisk` 工具创建了一个新的交换分区（`/dev/sdb1`）。你需要格式化并启用此分区。你应该使用哪些命令来完成操作？（选择两个。）\n\
