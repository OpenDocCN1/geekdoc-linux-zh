  \ 调度未来运行的命令，请在 shell 提示符输入 `at time`。\n\n![images](img/bull.jpg) `at` 时间值可以是固定时间，例如：\n\
  \n![images](img/bull.jpg) HH:MM\n\n![images](img/bull.jpg) Noon\n\n![images](img/bull.jpg)\
