  \n### 使用 shell 命令管理内核模块\n\n与大多数其他操作系统一样，你可以手动列出、加载或卸载 Linux 内核模块。虽然有很多图形工具可以实现，但我们将专注于从命令行完成。\n\
  \n要查看所有已加载的内核模块，你可以使用 `lsmod` 命令。该命令从 `/proc/modules` 文件提取数据并对其进行格式化以便显示。要使用此命令，只需在命令行输入\
  \ `lsmod`，如示例所示：\n\n![Images](img/p0443-01.jpg)\n\n要查看有关特定加载模块的信息，你可以使用 `modinfo`\
  \ 命令。你可以先用 `lsmod` 找到模块名称，然后在命令行输入 `modinfo module_name`。在前面的示例中，`lsmod` 显示的模块之一是\
  \ `joydev`。这是你系统的操杆内核模块。要查看有关此特定模块的信息，你可以在命令行输入 `modinfo joydev`，如所示：\n\n![Images](img/p0443-02.jpg)\n\
  \n在加载内核模块之前，你首先需要在命令行运行 `depmod` 命令。该命令用于创建一个名为 `modules.dep` 的文件，该文件存储在 `/lib/modules/*kernel_version*/`，如下：\n\
  \n![Images](img/p0443-03.jpg)\n\n在该文件中，`depmod` 列出了模块之间的依赖关系。这有助于其他内核模块管理工具在你加载模块时确保依赖项模块也被加载。\n\
  \n\n\n\n除了 `insmod` 之外，你还可以使用 `modprobe` 命令。大多数 Linux 管理员更喜欢使用 `modprobe` 而不是 `insmod`。关键问题在于\
  \ `insmod` 命令没有考虑到 `depmod` 识别出的模块依赖关系。\n\n使用 `modprobe` 的语法为 `modprobe module_name`。与\
  \ `insmod` 类似，你通过 `modprobe` 加载的模块位于 `/lib/modules/*kernel_version*/kernel/` 的子目录下。例如，`/lib/modules/*kernel_version*/kernel/drivers/net/ethernet`\
  \ 包含了各种网卡的内核模块，如下所示：\n\n![Images](img/p0444-01.jpg)\n\n如果我想加载 3c590 网卡的内核模块，我会在\
  \ shell 提示符下输入 `modprobe 3c590`。你可能在想，在用 `modprobe` 加载模块后，它是否会在系统重启后仍然存在。答案是肯定的，它不会（除非该设备在启动过程中被自动检测）。然而，`modprobe`\
  \ 每次内核加载时都会自动运行。它会读取你的 `/etc/modprobe.conf` 文件中的信息，以确定在启动期间应该加载哪些内核模块。\n\n***\n\n\
  ![Images](img/tip.jpg)\n\n**提示** 如果 `/etc/modprobe.conf` 文件不存在，`modprobe` 将使用位于\
  \ `/etc/modprobe.d` 目录下的文件来确定启动时加载的内核模块。\n\n`modprobe.conf` 文件使用以下指令：\n\n![images](img/bull.jpg)\
  \ `install module_name` 告诉 `modprobe` 加载指定的模块。它也可以用于运行任何有效的 shell 命令，在你加载模块时提供极高度的灵活性。\n\
  \n![images](img/bull.jpg) `alias alias_name module_name` 为内核模块提供一个别名，可以在 shell 提示符下引用它。\n\
  \n![images](img/bull.jpg) `options module_name options` 为 `modprobe` 提供一组选项，例如 `irq=`\
  \ 和 `io=`，这些选项在加载特定内核模块时应当被使用。\n\n你可能会注意到文件开头有一个大备注，警告不要直接修改 `/etc/modprobe.conf`。相反，如果你需要手动指定在系统启动时加载某个特定的内核模块，你应该使用上述提到的\
  \ `modprobe.conf` 指令将其输入 `/etc/modprobe.conf.local` 文件中。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 此外，你也可以将 `modprobe module_name` 命令插入到 `rc.local` 或 `boot.local` 文件中，以确保模块在系统启动时加载。然而，根据我的经验，你很少需要这样做。大多数发行版在系统启动时运行硬件检测程序，扫描新硬件并自动加载相应的内核模块。\n\
  \n如果你需要卸载当前加载的内核模块，可以在 shell 提示符下使用 `rmmod module_name` 命令。请注意，如果该模块服务的设备正在使用中，该命令将不起。如果是这样，命令将不会移除模块。与\
  \ `insmod` 一样，`rmmod` 不考虑模块依赖关系，也不会对它们进行任何操作。如果你想移除模块并考虑到依赖关系，应该使用 `modprobe`。使用\
  \ `modprobe` 移除模块的语法为 `modprobe –r module_name`。\n\n让我们在下面的练习中练习内核模块。\n\n### 练习\
  \ 12-1：内核内核模块\n\n在本次练习中，你将练习查看内核模块信息。你可以使用随本书附的虚拟机进行此练习。运行快照 12-1 以获得配置正确的环境。\n\n\
  ***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 12-1 视频，演示如何执行此任务。\n\n完成以下操作：\n\n\
  1. 启动你的 Linux 系统并以 **student** 用户身份登录，密码为 **student**。\n2. 打开终端会话。\n3. 输入 `su –`\
  \ 并输入密码 **student** 切换到 root 用户账户。\n4. 在 shell 提示符下输入 `lsmod | less` 查看系统内核模块的状态。\n\
  5. 翻页查看内核模块列表。完成后，按 Q。\n6. 在 shell 提示符下输入 `modinfo parport` 查看关于 parport 内核模块的信息。\n\
  7. 在 shell 提示符下输入 `depmod` 创建模块依赖关系列表。\n8. 使用 `less` 或 `more` 工具查看你刚刚在 `/lib/modules/*kernel_version*/`\
  \ 中构建的依赖文件 (`modules.dep`)。\n9. 在 shell 提示符下输入 `lsmod | grep joydev`。你应该会在输出行看到一个\
  \ 0，表示模块已加载但硬件未被使用。\n10. 在 shell 提示符下输入 `rmmod joydev` 移除 joydev 模块。\n11. 再次在 shell\
  \ 提示符下输入 `lsmod | grep joydev` 验证 joydev 内核模块是否已卸载。你应该看不到任何输出，表示模块未加载。\n12. 在 shell\
  \ 提示符下输入 `modprobe joydev` 重新加载摇杆模块。\n13. 再次在 shell 提示符下输入 `lsmod | grep joydev`。你应该再次在输出行看到一个\
  \ 0，表示模块已加载但硬件未被使用，如下：\n\n![Images](img/p0446-01.jpg)\n\n#### 热插拔和冷插拔设备\n\n在 Linux\
  \ 下处理 PC 硬件和内核模块时，你需要记住你的 PC 硬件可以分为两个不同的类别：\n\n![images](img/bull.jpg) **冷插拔设备**\
  \ 冷插拔设备只有在关机状态下才能物理地连接或断开 PC 系统。CPU、RAM、扩展卡和存储设备等 PC 组件是内部冷插拔设备的示例。并行打印机和外部 SCSI\
  \ 设备等外设是外部冷插拔设备的示例。\n\n关于冷插拔设备需要记住的关键点是：如果你在系统运行时插入它们，它们可能不会被系统检测和识别。如果你在系统关机时正确连接它们，然后在系统运行时尝试拔掉它们，可能会在电学上损坏该组件（或系统本身）。默认情况下，只有运行在内核空间的进程被允许直接与系统硬件通信。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 内核空间进程是内核本身。用户空间进程是由终端用户运行的程序。\n\n为了允许用户空间进程访问硬件，提供了\
  \ `/dev` 目录。正如本书前面提到的，你 Linux 系统中的硬件通过 `/dev` 下的设备文件访问。冷插拔设备（如你的硬盘）是通过这种方式访问的。\n\
  \n![images](img/bull.jpg) **热插拔设备** 另一方面，热插拔设备的设计是为了在系统运行时动态地连接和断开。Linux 系统上的软件会在这些类型的设备附加和卸载时检测系统变化。系统会在设备连接时识别它并加载相应的模块。USB\
  \ 和 FireWire 设备是热插拔设备的示例。\n\n访问热插拔设备的问题在于它们访问的方式。记住，冷插拔设备是通过 `/dev` 中的设备文件访问的。热插拔设备也可以通过这种方式访问吗？可以，但过程需要一些帮助。一种方案是为可能连接到系统的每一个设备在\
  \ `/dev` 中创建一个设备文件。这将允许系统上的应用程序在这些硬件通过相应的设备文件连接到系统时，访问热插拔硬件。\n\n\n\n\n虽然这种方法有效，但它也非常混乱。更好的方法是：每当连接热拔设备时，都在\
  \ `/dev` 中动态地创建一个设备文件，并在设备断开连接时将其删除。为了实现这一点，新硬件必须被操作操作系统识别，在 `/dev` 中创建适当的设备文件，并通知系统上运行的所有进程新硬件已可用。\n\
  \n实现此功能需要几个 Linux 组件。第一个组件是 `sysfs`。该组件提供了我们在本章稍早讨论过的 `/sys` 虚拟文件系统。它的工作是导出系统硬件设备（包括热拔和冷拔）的信息，以便运行在系统上的应用程序和实用程序可以访问它们。\n\
  \n第二个组件是硬件抽象层（HAL）守护进程 (`hald`)。该守护进程在启动时自动运行。它的工作是为运行在系统上的应用程序提供系统中可用硬件（包括热拔和冷拔）的信息。\n\
  \n下一个组件是桌面总线 (`dbus`)。它也作为守护进程在你的 Linux 系统上运行，提供几个关键功能。然而，对于这里的用途，你需要记住，当热拔设备连接或断开系统连接时，是\
  \ `dbus` 守护进程通知运行中的进程的。\n\n最后，Linux 还使用了 `udev`。`udev` 守护进程 (`udevd`) 创建了一个挂载在 `/dev`\
  \ 的虚拟文件系统。它通过 `uevent` 接口与 Linux 内核通信。当热拔设备被添加或删除时，内核会发送一个 `uevent` 消息，`udevd` 接收后根据\
  \ `/etc/udev/rules.d` 目录下定义的规则执行以下操作：\n\n![images](img/bull.jpg) 它初始化设备。\n\n![images](img/bull.jpg)\
  \ 它在 `/dev` 目录中创建适当的设备文件。\n\n![images](img/bull.jpg) 如果新设备是网络接口，它使用 `ifup` 工具对其进行配置。\n\
  \n![images](img/bull.jpg) 如果新设备是存储设备，它使用 `/etc/fstab` 中的信息进行挂载。\n\n![images](img/bull.jpg)\
  \ 它通知运行中的进程新设备。\n\n### 章节总结\n\n在本章中，我讨论了如何管理系统中的硬件并配置 Linux 内核模块以支持各种已安装的设备。\n\n\
  我首先讨论了 PC 系统中使用的各种存储设备。我回顾了 SATA、SCSI 和固态硬盘驱动器的工作原理以及如何配置它们。我还指出了如何操作分配给存储设备的硬件\
  \ ID 来配置启动设备。我还讨论了光存储设备和闪存存储设备的工作原理。\n\n然后我回顾了用于将外部设备连接到 PC 的可插拔硬件接口。我们首先看了 USB。我注意到\
  \ USB 使用集线器创建一个级联星型拓扑，可以连接多达 127 个外部设备。然后我回顾了 IEEE 1394 如何使用链链总线拓扑完成类似的任务。\n\n接着我们关注了系统资源管理。我回顾了中断、I/O\
  \ 地址和 DMA 通道的作用和功能。我还回顾了 PnP（即插即用）系统的工作原理，强调了 PCI 扩展卡使用 PnP 并可以配置为共享中断通道。\n\n随后我们将注意力转向了集成设备的管理。我指出，可以使用系统设置（setup）启用或禁用集成设备。我指出，访问系统设置时使用的按键以及启用或禁用集成设备的精确菜单选项会随制造商而异。\n\
  \n然后我们查看了管理没有安装任何外部外设备（包括键盘或视频显示器）的系统。这类系统可以使用 VNC 或 SSH 进行管理，其中 SSH 是两者中更安全的选项。\n\
  \n接下来，你学习了如何管理和配置驱动程序以启用 Linux 系统中的硬件。我提到驱动程序是加载到 RAM 中的小型程序，使 CPU 能够与特定的硬件组件进行通信。对于基础组件，这些软件存储在主板的芯片上。对于其他组件，驱动存储在硬盘上，必须由操作系统内核加载到\
  \ RAM 中。\n\n许多较新的计算机使用统一扩展固件接口 (UEFI) 而不是传统的 BIOS。UEFI 的设计是为了解决传统 BIOS 的许多缺点，例如内存大小限制、硬盘大小限制以及\
  \ rootkit 恶意软件感染。在基于 UEFI 的系统上安装 Linux 可能会有问题，因为 UEFI 固件可能没有你的 Linux 发行版的数字证书。在某些硬件上，你可以通过禁用\
  \ UEFI 固件中的 `SecureBoot` 来解决这个问题。\n\n在 Linux 上，驱动可以通过两种方式加载。首先，它们可以在操作系统启动后作为内核模块加载。其次，它们可以直接编译到内核中。我提到，作为一个通用原则，只有启动系统所需的驱动程序应该直接编译到内核中。其他硬件的驱动应该作为内核模块加载。这将保持你的内核精简高效。\n\
  \n然后我回顾了一些你可以用于查看 Linux 系统中硬件信息的工具。在 `/proc` 目录下，你可以在以下文件和目录查看硬件信息：\n\n![images](img/bull.jpg)\
  \ cpuinfo\n\n![images](img/bull.jpg) devices\n\n![images](img/bull.jpg) dma\n\n\
  ![images](img/bull.jpg) interrupt\n\n![images](img/bull.jpg) iomem\n\n![images](img/bull.jpg)\
  \ modules\n\n![images](img/bull.jpg) version\n\n![images](img/bull.jpg) `/scsi/`\n\
  \n![images](img/bull.jpg) `/bus/devices`\n\n![images](img/bull.jpg) `/ide/`\n\n\
  除了 `/proc`，`/sys/` 目录也提供了系统中安装硬件的信息。`/sys` 目录的顶层包含许多子目录，包括\n\n![images](img/bull.jpg)\
  \ `/sys/block`\n\n![images](img/bull.jpg) `/sys/bus`\n\n![images](img/bull.jpg)\
  \ `/sys/class`\n\n![images](img/bull.jpg) `/sys/devices`\n\n![images](img/bull.jpg)\
  \ `/sys/module`\n\n你还可以使用以下命令行工具来查看系统中的硬件信息：\n\n![images](img/bull.jpg) `hdparm\
  \ /dev/*device*`\n\n![images](img/bull.jpg) `sg_scan`\n\n![images](img/bull.jpg)\
  \ `sginfo –l`\n\n![images](img/bull.jpg) `hwinfo`\n\n![images](img/bull.jpg) `lsusb`\n\
  \n![images](img/bull.jpg) `lspci`\n\n然后我们关注了你可以用于管理内核模块的 Shell 命令。这些包括：\n\n![images](img/bull.jpg)\
  \ `lsmod` 查看已加载的内核模块\n\n![images](img/bull.jpg) `modinfo` 查看模块信息\n\n![images](img/bull.jpg)\
  \ `depmod` 构建模块依赖列表\n\n![images](img/bull.jpg) `insmod` 安装内核模块但不考虑模块依赖关系\n\n![images](img/bull.jpg)\
  \ `modprobe` 在考虑模块依赖关系的情况下安装或移除内核模块\n\n![images](img/bull.jpg) `rmmod` 移除内核模块\n\n\
  我指出 `modprobe` 在每次系统启动时都会运行。它使用 `/etc/modprobe.conf` 来确定启动时应该加载哪些内核模块。\n\n我通过查看热拔设备和冷拔设备结束了这一章。冷拔设备只有在\
  \ PC 系统关电时才能物理地连接到或断开连接。如果你在系统运行时插入它们，它们可能不会被系统检测和识别。如果你在系统关机时正确连接了它们，然后在系统运行时尝试拔掉它们，你可能会损坏组件。冷拔设备通过\
  \ `/dev` 中的设备文件进行访问。\n\n\n\n另一方面，热插拔设备的设计允许系统运行期间动态连接和断开。当此类类型的设备插入或移除时，Linux 系统上的软件会检测系统变化。系统会在设备连接时识别该设备并加载相应的模块。实现此功能需要几个\
  \ Linux 组件：\n\n- `sysfs`\n- `dbus`\n- `hald`\n- `udev`\n\n## 加速复习\n\n- PC 系统需要持久性的长期存储介质来存储信息。\n\
  - 硬盘使用涂层铝盘片存储数据。\n- 驱动器几何结构由以下参数组成：\n- `Cylinders`（柱面）\n- `Heads`（磁）\n- `Sectors\
  \ Per Track`（每道扇区）\n- `SATA` 硬盘是目前最常用的硬盘类型。\n- 系统中的每个 `SATA` 硬盘都有专用硬盘通道，这极大地提高了速度和吞吐量。\n\
  - `SATA` 布线使用七针连接器。\n- `SATA` 设备的数据传输速率从 150 MBps 到最高 1969 MBps 不等。\n- 连接到系统主板 `SATA0`\
  \ 接口的 `SATA` 硬盘默认将作为启动驱动器，因为它会被分配 ID 为 `0`。\n- `SCSI` 硬盘主要用于服务器系统。\n- `SCSI` 设备以链式方式连接。\n\
  - 链中的每个 `SCSI` 设备都被分配一个 `SCSI ID`。\n- `SCSI ID` 越小，设备的优先级越低。\n- ID 数字越小，设备在启动顺序中的排名越高。\n\
  - `SCSI` 链的两端必须终止，中间不能有任何设备。\n- 串行连接 SCSI (`SAS`) 将 `SCSI` 和 `SATA` 的最佳特性结合到一个新标准中。\n\
  - 固态硬盘是一种功能类似于标准硬盘的存储设备，使用相同的基于块的 I/O 操作。\n- `SSDs` 使用闪存存储数据。\n- `SSDs` 使用与传统硬盘相同的\
  \ `SATA` 接口。\n- 光驱器使用凹坑和陆地来表示二进制 0 和 1。\n- 可写光盘使用特殊的光敏涂层，用于编码二进制数据。\n- 闪存盘使用闪存持久地存储数据。\n\
  - `USB` 允许向 PC 连接多达 127 个外部设备。\n- `USB` 设备是自配置和热插拔的。\n- `USB` 集线器可以级联。\n- `IEEE\
  \ 1394` 允许连接多达 63 个设备。\n- `IEEE 1394` 设备是自配置和热插拔的。\n- `IEEE 1394` 设备以链链方式连接。\n-\
  \ 中断用于通知 CPU 有设备需要处理。\n- PC 中的每个设备都必须分配中断。\n- 两个 `PCI` 设备可以共享中断。\n- `I/O` 地址类似于\
  \ PC 设备的信箱。\n- `I/O` 地址以十六进制表示。\n- 所有设备都必须分配一个 `I/O` 地址。\n- 大多数设备将使用范围内的 `I/O` 地址。\n\
  - 设备必须使用唯一的 `I/O` 端口。\n- `DMA` 通道允许设备直接与系统 RAM 通信，无需使用 CPU。\n- 设备必须使用唯一的 `DMA` 通道。\n\
  - `PnP` 允许在 PC 启动时自动配置设备的系统资源。\n- 大多数主板集集了许多集成设备。\n- 使用系统设置可以很容易地启用或禁用集成外设。\n- 一些较新的计算机使用\
  \ `UEFI` 代替传统的 `BIOS`。\n- 在基于 `UEFI` 的系统上安装 Linux 可能会有问题，因为 `UEFI` 固件可能没有你发行版的数字证书。\n\
  - 你可能需要管理没有任何外设（包括键盘）的系统。\n- 管理此类系统有两种选择：\n- `SSH`\n- `VNC`\n- 驱动程序是加载到 RAM 中的小型程序，允许\
  \ CPU 与特定的硬件组件通信。\n- 对于基本系统组件，驱动程序存储在主板的芯片上。\n- 更复杂的组件需要将硬盘上的驱动程序加载到 RAM。\n- 在 Linux\
  \ 上，驱动有两种加载方式：\n    1. 操作系统启动后作为内核模块加载\n    2. 直接编译到内核中\n- 你可以在 `/proc` 目录查看查看系统硬件信息。\n\
  - 你可以使用以下命令行工具查看系统中硬件的信息：\n```\nhdparm -a /dev/device\nsg_scan\nscsiinfo -l\npnpdump\n\
  lsusb\n```\n- 你可以使用以下命令行工具管理内核模块：\n- `lsmod`: 查看已加载的内核模块\n- `modinfo`: 查看模块信息\n\
  - `depmod`: 构建模块依赖列表\n- `insmod`: 安装内核模块但不考虑模块依赖关系\n- `modprobe`: 在考虑模块依赖的情况下安装或删除内核模块\n\
  - `rmmod`: 移除内核模块\n- `modprobe` 使用 `/etc/modprobe.conf` 文件确定启动时应加载哪些内核模块。\n- 冷插拔设备只有在关机时才能物理连接或断开\
  \ PC 系统。\n- 另一方面，热插拔设备的设计允许系统运行期间动态连接和断开。\n- 当此类类型的设备插入或移除时，Linux 系统上的软件会检测系统变化。\n\
  - 系统会在设备连接时识别该设备并加载相应的模块。\n- 管理热插拔设备需要几个 Linux 组件：\n- `sysfs`\n- `dbus`\n- `hald`\n\
  - `udev`\n\n## 问题\n\n**[1]** 下列硬盘参数指的是硬盘驱动器所有盘片外侧的一组同心平行轨道吗？\nA. `Cylinders`（柱面）\n\
