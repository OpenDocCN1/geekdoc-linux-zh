  \ 模块强制执行的用户限制在 `/etc/security/limits.conf` 文件中配置。\n\n# 第 18 章\n## 使用加密\n\n在本章中，你将学习到：\n\
  \n* 加密的工作原理\n* 使用 `OpenSSH` 对远程访问进行加密\n* 加密 Linux 文件\n\n正如在前一章开头提到的，信息安全是几乎每个组织中的关键问题。如果不是，它也应该是。二十五年前，我们\
  \ IT 行业的人并不十分担心信息安全。那是因为整个社会对信息安全的关注也不多。让我给你举两个例子。首先，当我 20 世纪 80 年代后期和 90 年代初读本科时，教授们经常会在办公室外的走廊用学生的社会安全号码公布考试成绩。回想起那个原因我不禁苦笑；那是为了保护学生的隐私。老天保佑不要把名字和考试分数联系在一起，所以我们就用他们的\
  \ `SSNs` 吧。\n\n州政府和联邦政府也免不了这种做法。同样，当我上大学时，我的家乡州使用社会安全号码作为驾照号码。他们直接把它打印在驾执照上。因此，每当你用驾照证明身份时，你都在暴露你的\
  \ `SSN`。更糟糕的是，那时我们使用的支票比现在多得多。猜猜每个店员在每张支票上写了什么？没错，他们记录了客户的驾照号码。这意味着我在大学期间写的每张支票都记录了我的\
  \ `SSN` 和银行账号。天哪！\n\n今天，我们认为做这种事是疯了。但在那时，我们并没觉得有什么异常。在今天这个具有安全意识的世界里，这一切都改变了。戴黑帽的人已经发现，极少的信息就能产生巨大的利润，他们会不择手段地获取它。结果，我们这些戴白帽的人必须对信息安全近乎痴迷。\n\
  \n信息安全侧重于保护组织和用户的价值电子信息。因此，对知道如何保护网络和计算机的 IT 专业人员的需求处于前所未有的高度。![Imags](img/tip.jpg)\n\
  \n**提示** 信息安全是一个巨大的课题，我们无法在书中进行充分探讨。我强烈建议你通过获得 CompTIA 的 Security+ 认证来增强知识。IT 世界已成为美国历史上“西部荒”的现代等物。你需要知道如何彻底保护你的数据免受恶意黑帽的侵害！\n\
  \n让我们从讨论加密的工作原理开始。\n\n### 加密的工作原理\n\n请跟我回想一下你的小学时代。你是否曾经给朋友传过纸条？我知道在移动设备和短信的现代社会，这看起来可能很过时；然而，当我小时候，传纸条是学校里至关重要的通信手段。毕竟，你有重要的事情要处理，对吧？\n\
  \n如果你的学校和我的一样，这些课外交流形式在课堂上是被严格禁止的。如果老师拦截了一张处理不当的纸条，你可以肯定它会在全班面前被读出来，这可能是比死还糟糕的命运（尤其是如果纸条上包含了关于谁喜欢谁的信息）。\n\
  \n为了防止这种情况，我和朋友们开发了代码来加密我们的纸条。如果其中一张被拦截，我们就可以放心老师无法把它读给其他同学听。作为四年级学生，我们的编码机制是很原始的。在大多数情况下，我们使用两种代码。第一种涉及字母表向下偏移一个或两个字母，所示：\n\
  \n![Images](img/p0704-01.jpg)\n\n![Images](img/note.jpg)\n\n**注意** 这种简单的加密技术被称为\
  \ `letter shift`（字母位移）。\n\n我们使用底行作为明文，顶行作为密文。例如，明文“JAKE LIKES PAM”在编码后会变成“IZJD KHJFR\
  \ OZL”。最后，我们的老师开始识破了这种代码并想出了破解方法。因此，我们切换到一种使用数字和字母的不同代码，所示：\n\n![Images](img/p0704-02.jpg)\n\
  \n使用这种代码，我的朋友 Jake 的名字会被编码为 9 26 10 4。这种使用密钥来扰乱和解密消息的基本概念也可以用于加密网络通信。在今天这个具有安全意识的世界里，加密网络通信内容的需求是首要。使用网络监控工具（例如在前一章讨论过的\
  \ `nmap`），调皮的人相对很容易嗅探网络传输并读取它们。如果这些传输包含敏感信息，如用户名、密码、财务数据或个人信息，我们就有麻烦了。\n\n为了保护这些信息，我们需要加密关键网络通信。与我小学使用的简单代码不同，今天的网络加密使用更复杂的编码机制。有两种通用方法：\n\
  \n![images](img/bull.jpg) 对称加密\n![images](img/bull.jpg) 非对称加密\n\n让我们先看看对称加密。\n\n\
  #### 对称加密\n\n为了让我小学的加密系统工作，我和朋友必须拥有完全相同的密钥来加密和解密。发送端使用错误的密钥会导致乱码。这种系统被称为 `对称加密`。在对称加密中，加密消息使用的密钥与解密消息的密钥相同。这意味着发送者和接收者都拥有相同的密钥。这在图\
  \ 18-1 中所示。\n\n![Images](img/f705-01.jpg)\n\n**图 18-1** 对称加密\n\n![Images](img/note.jpg)\n\
  \n**注意** 对称加密有时被称为 `密钥加密`。\n\n对称加密效果非常好。它的主要优势之一是速度。它比非对称加密（后文讨论）快得多。然而，对称加密相关的困难之一是如何向所有需要通信方的安全分发密钥。例如，如果你配置过无线网络的密钥，你知道必须在无线访问点创建密钥，将其拷贝到\
  \ U 盘，通过物理传输到每个无线客户端，并在无线网卡的配置中粘贴密钥。使用对称加密的加密标准包括：\n\n![images](img/bull.jpg) **三重数据加密标准\
  \ (3DES)** 3DES 常用于许多 Linux 服务。3DES 分三个阶段加密数据。它使用 112 位或 168 位的密钥。\n\n![images](img/bull.jpg)\
  \ **高级加密标准 (AES)** AES 是 3DES 的改进版本。它支持 128 位、192 位和 256 位密钥。\n\n![images](img/bull.jpg)\
  \ **Blowfish** Blowfish 使用可变长度的密钥，最长可达 448 位。\n\n\n\n\n\n在选择任何加密方案时，需要考虑的一个重要因素是用于编码数据的位数。旧的加密方案仅使用\
  \ 40 或 56 位来编码数据。在当今的计算世界中，这显然不够强大。从你当地折扣零售店购买的一台快速 PC 可以在很短的时间内破解 40 位加密。选择加密方案时，你应该选择一个至少支持\
  \ 128 位的方案。基本上，密钥越长，数据越安全。\n\n由于密钥分发带来的困难性，今天通常会使用另一种加密机制，称为`非对称加密`。让我们来看看它是如何运作的。\n\
  \n## 非对称加密\n\n与对称加密不同，非对称加密使用两个密钥而不是一个：公钥和私钥。用公钥编码的数据只能用私钥解码。用私钥编码的数据只能用公钥解码。出于这个原因，非对称加密经常被称为`公钥密码学`。Rivest\
  \ Shamir Adleman (`RSA`) 和数字签名算法 (`DSA`) 是使用非对称加密的密码学标准示例。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 公钥/私钥对应该比用于对称加密的密钥长得多。它们应该是 1024 位或更长。\n\n这种类型的加密用于加密网络通信内容，以及生成数字签名。在数字签名中，消息的内容并不加密。相反，发送者使用私钥创建消息的加密哈希。该哈希随消息一起发送给接收者。接收者生成其自己的消息哈希。然后它使用公钥解密随消息发送的哈希。如果哈希相同，接收者就可以确保消息在传输过程中没有被更改。\n\
  \n由于其灵活性，公钥密码学是一种广泛使用的数据加密方法。它允许你轻松地在公共网络（如互联网）打乱并发送敏感信息。如果你曾经在电子商务网站上买过任何东西，你就使用过公钥密码学。当你发送信用卡号时，零售商网站应该对你的数据进行加密并使用\
  \ `HTTPS` 发送，这样窥探的眼睛无法读取它。\n\n非对称加密的一个主要缺点是速度。对称加密比非对称加密快得多。因此，你会经常看到结合使用两种机制的实现。非对称加密用于初始密钥交换，将秘密密钥安全地复制给会话的双方。一旦完成，双方都拥有相同的密钥，并在会话的剩余部分切换到对称加密。\n\
  \n与公钥密码学相关的另一个问题是如何验证公钥的合法性。为了做到这一点，我们使用`证书颁发机构 (CA)`。`CA` 是负责发行和管理加密密钥的网络服务。向 `CA`\
  \ 请求密钥对时，它会使用指定的加密方案（如 `RSA` 或 `DSA`）同时生成公钥和私钥。\n\n密钥对中的私钥仅提供给请求实体。它不会与任何其他人共享。相反，密钥对中的公钥可以提供给任何需要的人。`CA`\
  \ 的主要作用是验证参与加密交换的双方确实是他们所称的身份。`CA` 通过颁发`公钥证书`来实现。公钥证书是用私钥签名的数字消息，提供了公钥与拥有私钥的组织之间的密码学绑定。证书包含以下信息：\n\
  \n![images](img/bull.jpg) 组织名称\n\n![images](img/bull.jpg) 组织的公钥\n\n![images](img/bull.jpg)\
  \ 证书的过期日期\n\n![images](img/bull.jpg) 证书的序列号\n\n![images](img/bull.jpg) 签署证书的 `CA`\
  \ 名称\n\n![images](img/bull.jpg) 来自 `CA` 的数字签名\n\n你需要熟悉的两种类型的 `CAs`：\n\n![images](img/bull.jpg)\
  \ **内部 CA** 内部 `CA` 是组织为了内部使用而维护的 CA。在大多数 Linux 发行版中，会自动安装 `OpenSSL` 包并用于在你的系统上创建\
  \ `CA`。此 `CA` 用于为运行在服务器上的服务创建密钥并颁证书。然而，此 `CA` 不是一个`信任的` `CA`。如果其他系统通过安全连接到你系统上的服务，远程系统上的用户将在其客户端软件中收到警告。此消息将指示其收到的证书是有效的，但它不是来自信任的\
  \ `CA`。这是因为证书来自你自己系统的 `CA`。对于内部通信，这并不是一个严重问题。我们信任自己。但是，如果你要与外部实体交易，内部 `CA` 是不够的。\n\
  \n![images](img/bull.jpg) **外部 CA** 外部实体需要来自信任的客观第三方的保证，确保他们收到的证书是合法的，并且你确实是你所称的身份。这是通过使用外部\
  \ `CA`（例如 `VeriSign` 或 `GTECyberTrust`）实现的。这些组织执行与内部 `CA` 相同的功能。但它们是全球信任的。例如，假设你正在使用\
  \ `Firefox` 浏览器访问互联网上的一个安全网站。如果该网站使用外部 `CA`，你将不会看到在使用内部 `CA` 时看到的种警告。这是因为你的浏览器已经预配置了信任的\
  \ `CAs` 列表，如图 18-2](#ch18.html_ch18fig2）所示。\n\n![Images](img/f0708-01.jpg)\n\n**图\
  \ 18-2** 受信任的 CAs\n\n让我们来看一个例子看看公钥密码学是如何工作的。假设你正在使用网络浏览器访问 [www.mydomain.com](http://www.mydomain.com)，并发现了一个你必不可的产品。你已将其放入购物车并正在从在线商店结账。当你将信用卡信息提交给电子商务\
  \ Web 服务器时，就会发生图 18-3](#ch18.html_ch18fig3）所示的过程。\n\n![Images](img/f0708-02.jpg)\n\
  \n**图 18-3** 公钥加密的工作原理\n\n1. 你的浏览器向外部 `CA` 请求 [www.mydomain.com](http://www.mydomain.com)\
  \ 的公钥。\n\n2. `CA` 将公钥返回给浏览器，浏览器随后使用该密钥加密消息。\n\n3. 浏览器将加密消息发送到 [www.mydomain.com](http://www.mydomain.com)。\n\
  \n4. 另一端的 Web 服务器随后使用其私钥解密传输内容。\n\n整个过程之所以奏效，是因为只有私钥可以解密由公钥编码的消息。例如，黑客可以很容易地拦截图\
  \ 18-3](#ch18.html_ch18fig3) 交易中使用的公钥。但这不是问题，因为它无法用于解密用相同公钥加密的信息（在本例中，是信用卡提交）。这只能通过私钥完成，而私钥被安全地保存在\
  \ Web 服务器上，并且绝不会公开传输。\n\n由于你的 Linux 系统在最初安装系统时安装了自身的 `CA`，你可以使用它来制作自己的证书，并使用它们来加密网络传输和文件系统中的文件。让我们接下来回顾一下是如何操作的。\n\
  \n## 使用 OpenSSH 加密远程访问\n\n\n\n\n\n在 UNIX/Linux 早期，我们使用多种工具来建立系统之间的网络连接。你可以使用 `Telnet`、`rlogin`\
  \ 或 `rshell` 访问远程系统的 shell 提示符。你可以使用 `rcp` 或 `FTP` 在系统之间传输文件。然而，这些程序有一个明显的缺点：`Telnet`、`rlogin`、`rcp`、`rshell`\
  \ 和 `FTP` 等网络服务以明文形式传输数据。任何运行嗅探器的人都可以轻松获取用户名、密码以及传输的内容。\n\n例如，假设我通过 `Telnet` 远程访问了我的\
  \ Linux 系统。在通过远程系统的身份验证后，我决定需要使用 `su` 命令切换到 root 用户以完成若干任务。如果我在执行此操作时有人在嗅探网线，他们就能轻松获取到以下信息：\n\
  \n![images](img/bull.jpg) 我的用户名和密码\n\n![images](img/bull.jpg) root 用户密码\n\n这可不是好事！攻击者将获得对我的\
  \ Linux 系统进行无限制访问所需的所有信息。\n\n为了防止这种情况发生，你可以使用 `OpenSSH` 软件包通过加密来完成这些相同的管理任务。在本章的这一部分，你将学习如何使用\
  \ `OpenSSH`。后续的主题包括：\n\n![images](img/bull.jpg) OpenSSH 的工作原理\n\n![images](img/bull.jpg)\
  \ 配置 OpenSSH\n\n![images](img/bull.jpg) 通过 SSH 隧道传输流量\n\n![images](img/bull.jpg)\
  \ 配置 SSH 使用公钥认证\n\n让我们从讨论 OpenSSH 的工作原理开始。\n\n### How SSH Works\n\nOpenSSH 提供了 `Telnet`、`rlogin`、`rsh`、`rcp`\
  \ 和 `FTP` 的功能，但它是通过加密实现的。为了做到这一点，OpenSSH 提供了以下启用加密的组件：\n\n![images](img/bull.jpg)\
  \ `sshd` 这是 ssh 守护进程，允许远程访问 shell 提示符。\n\n![images](img/bull.jpg) `ssh` 这是 ssh 客户端，用于连接到另一个系统上的\
  \ `sshd` 守护进程。\n\n![images](img/bull.jpg) `scp` 该工具可以用于在系统之间安全地复制文件。\n\n![images](img/bull.jpg)\
  \ `sftp` 该工具可以用于在系统之间安全地 FTP 传输。\n\n![images](img/bull.jpg) `slogin` 该工具也可以用于远程访问\
  \ shell 提示符。\n\n为了建立安全连接，OpenSSH 实际上同时使用了私钥/公钥加密和密钥加密。首先，SSH 客户端与运行在 IP 端口 `22`\
  \ 的 SSH 服务器的系统建立连接。然后，SSH 服务器将其公钥发送给 SSH 客户端。SSH 服务器使用主机密钥对来存储其私钥和公钥，这些密钥用于标识运行\
  \ SSH 服务器的主机。这些密钥存储在以下文件中：\n\n![images](img/bull.jpg) 私钥 `/etc/ssh/ssh_host_key`\n\
  \n![images](img/bull.jpg) 公钥 `/etc/ssh/ssh_host_key.pub`\n\n客户端系统接收来自 SSH 服务器的公钥，并检查它是否已拥有该密钥的副本。SSH\
  \ 客户端将其他系统的密钥存储在以下文件中：\n\n![images](img/bull.jpg) `/etc/ssh/ssh_known_hosts`\n\n\
  ![images](img/bull.jpg) `~/.ssh/known_hosts`\n\n默认情况下，如果这两个文件中没有服务器的公钥，它将要求用户添加它。完成此操作后，客户端现在信任该服务器系统并生成一个\
  \ 256 位的密钥。然后它使用服务器的公钥加密新密钥并将其发送到服务器。因为密钥是用公钥加密的，所以服务器可以使用其私钥对其进行解密。一旦完成，两个系统都拥有相同的密钥，现在可以在整个\
  \ SSH 会话期间使用对称加密。用户将看到登录提示符并现在可以安全地进行身份验证，因为她输入的所有内容都是以加密格式发送的。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 在 SSH 版本 2 中，某些情况略有不同。首先，服务器上使用的主机密钥文件是不同的。使用的是 `/etc/ssh/ssh_host_rsa_key`\
  \ 和 `/etc/ssh/ssh_host_dsa_key` 文件（以及它们关联的公钥），而不是 `/etc/ssh/ssh_host_key`。密钥对取决于客户端和服务器配置为使用的加密机制（RSA\
  \ 或 DSA）。此外，密钥并没有实际上从客户端传输到服务器系统。相反，它使用 `Diffie-Hellman 密钥交换协议` 来协商用于会话的密钥，而无需在通过网络介质上实际发送它。\n\
  \n在协商好此安全通道且用户通过 SSH 服务器通过身份验证后，数据就可以在两个系统之间安全传输了。\n\n现在你已经了解了 SSH 连接是如何建立的，你需要学习如何配置\
  \ OpenSSH。\n\n### 配置 OpenSSH\n\n要使用 `ssh`，你必须先从发行版介质在系统中安装 `openssh` 软件包。该包包含了 `sshd`\
  \ 守护进程和 `ssh` 客户端。大多数 Linux 发行版通常默认安装了 OpenSSH。你可以使用你喜欢的包管理工具来验证它是否已安装在你的系统中。\n\n\
  配置 OpenSSH 的过程涉及配置 SSH 服务器和 SSH 客户端。你使用 `/etc/ssh/sshd_config` 文件配置 `sshd` 守护进程。另一方面，SSH\
  \ 客户端使用 `/etc/ssh/ssh_config` 文件或 `~/.ssh/ssh_config` 文件配置。\n\n让我们先配置 SSH 服务器 (`sshd`)。`/etc/ssh/sshd_config`\
  \ 文件中有许多指令。好消息是，在安装 `openssh` 软件包后，默认参数在大多数情况下都能工作得很好。为了让 `sshd` 运行起来，你不必对 `sshd_config`\
  \ 文件做许多更改。该文件中一些更有用的参数包括 表 18-1 所示。\n\n![Images](img/t0711-01.jpg)\n\n**表 18-1**\
  \ `sshd_config` 文件中的选项\n\nLinux 系统上的 ssh 客户端使用 `/etc/ssh/ssh_config` 文件配置。`/etc/ssh/ssh_config`\
  \ 文件用于为系统中运行 `ssh` 的所有用户指定默认参数。用户可以使用其家目录下的 `~/.ssh/ssh_config` 文件覆盖这些默认值。ssh 客户端配置设置的优先级如下：\n\
  \n1. 在 shell 提示符处随 `ssh` 命令一起包含的任何命令行选项\n2. `~/.ssh/ssh_config` 文件中的设置\n3. `/etc/ssh/ssh_config`\
  \ 文件中的设置\n\n与 `sshd` 守护进程一样，`ssh_config` 文件中使用的默认参数通常不需要大量的自定义即可工作。然而，你可以用来自定义 ssh\
  \ 客户端工作方式的某些更有用的用的参数列在 表 18-2 中。\n\n![Images](img/t0712-01.jpg)\n\n**表 18-2** `ssh_config`\
  \ 文件中的选项\n\n当然，在连接到 SSH 服务器之前，你必须在运行 `sshd` 的系统的基于主机的防火墙中开启端口 `22`。例如，在 图 18-4 中，SUSE\
  \ Linux Enterprise Server 10 系统加载了 YaST 防火墙模块并配置允许 SSH 流量通过。\n\n![Images](img/f0712-01.jpg)\n\
  \n**图 18-4** 配置防火墙允许 ssh 流量\n\n配置好防火墙后，你可以在本地计算机上加载 ssh 客户端，并通过输入 `ssh -l user_name\
  \ ip_address` 连接到远程 Linux 系统上的 `sshd` 守护进程。\n\n\n\n\n\n例如，如果我想在本地计算机系统上使用 `ssh`\
  \ 客户端以用户 `student` 的身份连接到主机名为 `fedora`（IP 地址为 `10.0.0.85`）的远程 Linux 系统，我会在 shell\
  \ 提示符输入 `ssh –l student fedora`。这在图 18-5 中所示。\n\n![Images](img/f0713-01.jpg)\n\n\
  **图 18-5** 通过 SSH 远程连接\n\n注意图 18-5 所示，我被提示接受来自 `fedora` 主机的公钥，因为这是我第一次连接到这个特定的 SSH\
  \ 服务器。完成后，我已作为 `student` 用户通过了远程系统的身份验证（注意 shell 提示符的变化）。此时，我拥有 `fedora` 上 shell\
  \ 提示符的完全访问权限，可以完成任何我坐在远程系统控制台前就能完成的任务。要关闭连接，我只需在 shell 提示符输入 `exit`。\n\n***\n\n\
  ![Images](img/tip.jpg)\n\n**提示** Windows 工作站不提供 `ssh` 客户端。你可以从互联网下载 `PuTTY.exe`\
  \ SSH 客户端，并用它从 Windows 工作站连接到 Linux SSH 服务器。\n\n让我们在下面的练习中练习使用 SSH。\n\n### 练习 18-1：使用\
  \ SSH\n\n在本次练习中，你将在你的 Linux 系统上设置 `sshd` 守护进程，然后使用另一个 Linux 系统上的 `ssh` 客户端连接到它。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 完成此练习以及本章的其余练习，你至少需要两个 Linux 系统。你可以使用两个\
  \ Linux 活动系统、两个 Linux 虚拟机，或者两者的结合。\n\n***\n\n![Images](img/viedo.jpg)\n\n**视频**\
  \ 请观看练习 18-1 视频，查看如何执行此任务的演示。\n\n完成以下操作：\n\n**1. 通过以下步骤配置 SSH 服务器系统：**\n\n**a.**\
  \ 启动想要作为 SSH 服务器的 Linux 系统，并以标准用户身份登录。\n\n**b.** 打开终端会话。\n\n**c.** 输入 `su –` 后跟你的\
  \ root 用户密码，切换到 root 用户账户。\n\n**d.** 在 shell 提示符下，使用你选择的包管理工具确保已安装 `openssh` 包。\n\
  \n**e.** 在 shell 提示符下，输入 `vi /etc/ssh/sshd_config`。\n\n**f.** 找到 `PermitRootLogin`\
  \ 设置。如果它被注释掉了，删除行首的 `#` 字符。\n\n**g.** 按 `INS`；将 `PermitRootLogin` 设置为值 `no`。\n\n\
  **h.** 按 `ESC`；然后输入 `:exit` 保存更改并退出编辑器。\n\n**i.** 在 shell 提示符下，输入 `service sshd\
  \ restart` 重启 SSH 服务并应用更改。\n\n**j.** 如果必要，在运行 SSH 服务器的系统主机防火墙中开启端口 `22`。执行此操作的步骤将取决于你具体的发行版。\n\
  \n**2. 通过以下步骤从客户端系统创建 SSH 连接：**\n\n**a.** 启动你的第二个系统（它将作为 SSH 客户端），并以标准用户身份登录。\n\n\
  **b.** 打开终端会话。\n\n**c.** 在 shell 提示符下输入 `ssh –l *user_name IP_address_of_SSH_server*`\
  \ 与第一个 Linux 系统建立 SSH 会话。例如，为了连接到 IP 地址为 `192.168.1.125` 的系统并使用 `student` 用户，我会在\
  \ shell 提示符输入 `ssh –l student 192.168.1.125`。\n\n**d.** 如果收到提示，输入 `yes` 接受来自 SSH\
  \ 服务器的公钥。\n\n**e.** 输入你在 SSH 服务器系统上指定的用户的密码。\n\n**f.** 在 shell 提示符下输入 `exit` 退出远程系统。\n\
  \n**3. 通过以下步骤从你的客户端系统练习使用 SSH 工具：**\n\n**a.** 在 shell 提示符下输入 `ssh –l *user_name\
  \ IP_address_of_SSH_server* /sbin/ifconfig`，通过 SSH 在远程系统上运行 `ifconfig` 命令。\n\n**b.**\
  \ 在收到提示时输入远程用户的密码。你应该能看到分配给远程系统各种接口的网络配置。注意，一旦命令运行完毕，连接会自动关闭。\n\n**c.** 通过以下步骤使用安全的\
  \ SSH 连接复制文件：**\n\n**i.** 在 shell 提示符下输入 `echo “This is my new file.” > ~/mytestfile.txt`\
  \ 在你的用户主目录下创建一个新文件。\n\n**ii.** 在 shell 提示符下输入 `scp ~/mytestfile.txt *user_name*@\
  \ *IP_address_of_SSH_server*:` 将此新文件复制到 SSH 服务器系统中远程用户账户的家目录下。\n\n**iii.** 在收到提示时输入远程用户的密码。你应该看到文件已被复制。\n\
  \n**iv.** 使用 `ssh` 命令通过你之前复制文件时使用的用户名，再次与你的 SSH 服务器系统建立 SSH 连接。\n\n**v.** 验证远程用户主目录下是否存在该文件。\n\
  \n**vi.** 输入 `exit` 关闭连接。\n\n**d.** 通过以下步骤使用 `sftp` 命令将 `mytestfile.txt` 文件从 SSH\
  \ 服务器系统下载到本地 `/tmp` 目录：**\n\n**i.** 在工作站系统的 shell 提示符下，输入 `sftp user_name@ IP_address_of_SSH_server`。\n\
  \n**ii.** 在收到提示时输入远程用户的密码。\n\n**iii.** 在 `sftp>` 提示符下，输入 `get mytestfile.txt /tmp/`。\n\
  \n**iv.** 在 `sftp>` 提示符下，输入 `exit`。\n\n**v.** 在 shell 提示符下，输入 `ls /tmp`。你应该看到从 SSH\
  \ 服务器系统复制下来的 `mytestfile.txt` 文件。\n\n现在你已经学会了如何使用 SSH 服务器和 SSH 客户端，准备好通过学习如何通过 SSH\
  \ 连接隧道未加密的流量来进阶你的知识了。\n\n#### 通过 SSH 隧道流量\n\n作为系统管理员，你必须处理的关键安全问题之一是许多常用协议以明文形式传输信息。这很好的例子是我们在上一章中讨论的\
  \ `POP3` 和 `IMAP` 守护进程。我们提到，为了让 MTA 向客户端系统下载电子邮件，必须通过 `xinetd` 启用 `POP3` 或 `IMAP`。完成后，用户可以使用电子邮件客户端连接到\
  \ MTA。但问题是，这两个守护进程都以明文传输数据。这意味着用户向 MTA 进行身份验证的用户名和密码是以明文发送的。这允许任何拥有嗅探器的人捕获数据包并查看传输内容。\n\
  \n好消息是，可以使用 SSH 通过隧道加密明文流量。当隧道协议的软件（例如使用 `POP3` 的电子邮件客户端）与本地 SSH 客户端建立连接时，流量将通过\
  \ SSH 加密并通过 SSH 服务器隧道。在 SSH 服务器端，流量将被解密并转发到目标服务（在本例中为 `POP3` 守护进程）。这太棒了，因为在传输之前进行了加密，即使原始协议（在本例中为\
  \ `POP3`）不支持加密。\n\n让我们演示如何使用 SSH 隧道 `POP3` 流量：\n\n1. 确保运行电子邮件客户端的本地系统安装了 `ssh` 客户端。\n\
  \n2. 确保 `POP3` 服务器上安装并运行了 `sshd` 守护进程。\n\n3. 确保运行 `sshd` 的服务器开启了 IP 端口 `22`。\n\n\
  4. 在运行 `sshd` 的系统上切换到 root 并编辑 `/etc/ssh/sshd_config` 文件。\n\n5. 找到 `AllowTcpForwarding`\
  \ 参数，必要时取消注释，将其设置为值 `yes`。示例所示：\n\n```\nAllowTcpForwarding yes\n```\n\n6. 保存文件更改并退出编辑器。\n\
  \n7. 在 shell 提示符下输入 `systemctl restart sshd` 重启 `sshd` 守护进程（以 root）。\n\n8. 切换到客户端系统。\n\
  \n\n\n\n\n# 9. 使用以下命令从本地高 IP 端口（在本例中为端口 2345）到 POP3 服务器的 110 端口创建一个本地 ssh 隧道（在提示时输入远程用户的密码）：\n\
  \n```bash\nssh -f -N -L 2345:pop3_host_address:110 user_name@pop3_host_address\n\
  ```\n\n此命令中指定的选项具有以下功能：\n\n![images](img/bull.jpg) **–N 和 –f** 告诉 `ssh` 不要在服务器上执行远程命令，并在提示远程用户密码后在运行运行\n\
  \n![images](img/bull.jpg) **–L** 指定了三点内容：\n\n![images](img/bull.jpg) 用于隧道客户端的本地端口（在本例中为\
  \ `2345`）\n\n![images](img/bull.jpg) 远程 POP3 服务器的主名或 IP 地址\n\n![images](img/bull.jpg)\
  \ 远程服务器上用于隧道服务器端的端口（在本例中为 `110`）\n\n你不一定需要使用 `2345` 端口。如果需要，可以在两端使用相同的端口。但是请注意，如果你想在隧道的客户端侧使用小于\
  \ 1024 的端口号，你需要切换到 root 用户。这些被称为*特权*端口。\n\n# 10. 建立隧道后，配置本地电子邮件客户端程序，通过你为 SSH 隧道客户端端配置的端口从本地系统检索邮件。在本例中，你将配置为从本地系统\
  \ IP 地址的端口 `2345` 获取邮件。如何使用 Evolution 电子邮件客户端执行此操作的示例见图 18-6。注意，我在“服务器”字段中使用本地主机的主名，而不是\
  \ POP3 服务器。我还在主机名末尾添加了隧道工作站端的端口号。\n\n![Images](img/f0716-01.jpg)\n\n**图 18-6** 配置\
  \ Evolution 使用 SSH 隧道\n\n此时，当客户端使用 POP3 协议下载新消息时，本地系统上的 SSH 客户端将加密请求并通过你建立的 SSH\
  \ 隧道将其转发到 SSH 服务器。SSH 服务器将接收请求、解密，然后将数据传递给本地端口 `110`，POP3 守护进程正在该端口上。此过程的酷之处在于它对电子邮件软件完全是透明的。对于客户端而言，它正从一个本地\
  \ POP3 服务器检索电子邮件。\n\n你可以从隧道客户端端使用 `telnet` 命令测试你创建的隧道。语法为 `telnet localhost *client_tunnel_port*`。以下是一个示例：\n\
  \n```bash\ntelnet localhost 2345\n```\n\n当你执行此操作时，你应该能看到与运行 POP3 守护进程的远程系统建立了连接。示例见图\
  \ 18-7。\n\n![Images](img/f0717-01.jpg)\n\n**图 18-7** 使用 telnet 测试 SSH 隧道\n\n你还可以使用\
  \ SSH 连接将你的 X Server 流量隧道化传输到远程 X 客户端。这非常重要，因为未加密的 X 流量为攻击者提供了丰富的信息库，他或她可以使用这些信息破坏你的系统。\n\
  \n要配置*不带*加密的远程 X 客户端，你可以使用以下步骤：\n\n1. 在远程 X 客户端上，输入 `xhost +*X_server_hostname*`。这告诉客户端接受来自\
  \ X 服务器的连接。\n\n2. 在 X 服务器上，输入 `DISPLAY=*X_client_hostname*:0.0` 然后输入 `export DISPLAY`。这告诉\
  \ X 服务器将其输出显示在远程 X 客户端上。\n\n3. 从 X 客户端开始，使用 `ssh` 客户端访问 X 服务器上的 shell 提示符，然后运行你想在\
  \ X 客户端上显示的图形应用程序。例如，你可以在 shell 提示符处输入 `gedit` 来远程显示 gedit 文本编辑器。你也可以在 shell 提示符处输入\
  \ `office` 来远程显示 OpenOffice.org 套件。\n\n这种方法可行，但所有的 X 流量都是未加密传输的。这并不好。相反，你应该使用 SSH\
  \ 在 X 服务器和 X 客户端之间对 X 服务器流量进行隧道传输。你可以使用以下选项之一来实现：\n\n- ![images](img/bull.jpg) 使用\
  \ `ssh` 客户端程序配合 `-X` 选项。\n- ![images](img/bull.jpg) 在 X 客户端系统的 `/etc/ssh/ssh_config`\
  \ 文件中将 `ForwardX11` 选项设置为 `yes`。\n\n完成后，你还需要在 X 服务器系统的 `/etc/ssh/sshd_config` 文件中将\
  \ `X11Forwarding` 选项设置为 `yes`。\n\n让我们在下面的练习中练习 SSH 隧道。\n\n### 练习 18-2：使用 SSH 隧道\
  \ X 流量\n\n在此练习中，你将设置 `sshd` 守护进程和 `ssh` 客户端，以从服务器到客户端隧道化 X 流量。\n\n![Images](img/note.jpg)\n\
  \n**注意** 此练习你至少需要两个 Linux 系统。你可以使用两个 Linux Live 系统、两个 Linux 虚拟机或两者的结合。\n\n![Images](img/viedo.jpg)\n\
  \n**视频** 请观看练习 18-2 视频，演示如何执行此任务。\n\n完成以下操作：\n\n1. 通过以下步骤配置客户端系统：\n    a. 以标准用户身份登录你的客户端系统。\n\
  \    b. 打开终端会话。\n    c. 在 shell 提示符处，输入 `xhost +*X_server_IP_address*`。这告诉客户端接受来自\
  \ X 服务器（运行 `sshd` 的地方）的连接。\n\n2. 通过以下步骤配置服务器系统：\n    a. 以标准用户身份登录你的服务器系统。\n    b.\
  \ 打开终端会话并使用 `su –` 命令切换到 root。\n    c. 在 shell 提示符处，输入 `DISPLAY=*X_client_IP_address*:0.0`\
  \ 然后输入 `export DISPLAY`。这告诉 X 服务器将其输出显示在远程 X 客户端上。\n    d. 编辑 `/etc/ssh/sshd_config`\
  \ 文件并将 `X11Forwarding` 选项设置为 `yes`。保存更改并退出编辑器。\n\n3. 回到你的客户端系统。\n\n4. 在客户端系统的 shell\
  \ 提示符处，输入 `ssh -X -l user_name IP_address_of_SSH_server`。\n\n5. 提示时，输入远程用户的密码。注意你现在已登录到服务器系统。\n\
  \n6. 在 shell 提示符处，输入 `gedit` 启动 gedit 文本编辑器。注意，尽管你已登录到远程服务器系统，X 应用程序仍显示在本地桌面上。由于你使用了\
  \ `-X` 选项，所有的 X 流量在系统之间传输时都是加密的。\n\n![Images](img/f0719-01.jpg)\n\n**图 18-8** 使用\
  \ SSH 加密 X 流量\n\n在我们结束讨论 SSH 之前，我们需要查看配置 SSH 使用公钥认证而不是用户名和密码。让我们回顾一下如何实现。\n\n####\
  \ 配置 SSH 使用公钥认证\n\n除了使用用户名和密码组合对 SSH 服务器进行验证外，你还可以配置你的 `sshd` 守护进程允许使用 RSA 或 DSA\
  \ 公钥进行验证。要实现此功能，客户端系统用户的公钥必须存储在服务器系统目标用户家目录下的 `~/.ssh/authorized_keys` 文件中。要完成这一点，你需要将公钥从客户端系统安全地复制到服务器系统。私钥私保留在客户端系统。\n\
  \n如果你配置 SSH 服务器使用公钥认证，SSH 客户端会在 SSH 会话初始建立时告诉 SSH 服务器应使用哪个公钥进行认证。随后 SSH 服务器检查是否拥有该客户端的公钥；如果有，它将生成一个随机数并用该公钥对其加密。然后将加密后的数字发送给客户端，客户端使用与公钥关联的私钥进行解密。客户端随后计算从服务器收到的数字的\
  \ MD5 校验和。将校验和通过 SSH 服务器系统传回，服务器再计算其原始发送数字的 MD5 校验和。如果两个校验和匹配，用户将自动登录。\n\n\n\n\n\
  要配置公钥认证，首先要任务是在客户端系统上创建公钥/私钥对，以便将公钥发送到 SSH 服务器。可以使用 `ssh-keygen` 命令完成此操作。请完成以下步骤：\n\
  \n1. 在客户端系统的 shell 提示符下，输入 `ssh-keygen –t rsa` 或 `ssh-keygen –t dsa`，取决于你的 SSH 服务器支持哪种加密方法。为了安全起见，你可以运行这两个命令生成两个密钥对——一个用于\
  \ RSA 加密，另一个用于 DSA 加密。\n\n2. 当系统提示保存私钥的文件路径时，按回车键使用默认文件名 `~/.ssh/id_rsa` 或 `~/.ssh/id_dsa`。相应的公钥将分别保存为\
  \ `~/.ssh/id_rsa.pub` 或 `~/.ssh/id_dsa.pub`。\n\n3. 在收到提示时，为密钥输入密码短语（passphrase）。使用密码短语是非常重要的。如果不，任何获取到你密钥文件副本的人都无需输入密码即可验证\
  \ SSH 服务器。为密钥分配密码短语后，如果有人不知道该密码，密钥将无法使用。\n\n此时，你的密钥对已创建完成。这里显示创建一个 RSA 密钥对的示例：\n\
  \n![Images](img/p0720-01.jpg)\n\n接下来，你需要将刚刚创建的公钥复制到 SSH 服务器。实现此点的简单（且安全）的方法是使用你在本章之前学过的\
  \ `scp` 命令。其语法如下：\n\n![Images](img/p0720-02.jpg)\n\n在所示的示例中，WS1 上本地 `rtracy` 用户的\
  \ RSA 公钥被复制到 WS3 上 `rtracy` 用户的家目录，并保存到名为 `keyfile` 的文件中：\n\n![Images](img/p0720-03.jpg)\n\
  \n![Images](img/p0721-01.jpg)\n\n此时，需要将刚刚复制的密钥文件内容追加到你将登录 SSH 服务器的用户家目录下的 `~/.ssh/authorized_keys`\
  \ 文件末尾。实现此操作的简单方法是使用标准的（密码认证）SSH 会话连接到 SSH 服务器系统，然后使用 `cat` 命令将密钥文件的内容追加到用户家目录中\
  \ `~/.ssh/authorized_keys` 文件的末尾。这里显示了如何操作示例：\n\n![Images](img/p0721-02.jpg)\n\n\
  在此示例中，我通过 SSH 连接以远程用户 `rtracy` 的身份登录到 WS3 系统，然后在用户的家目录下创建了隐藏的 `.ssh` 目录。我必须创建该目录是因为它还不存在。如果\
  \ `.ssh` 目录已存在，你可以跳过此步，直接将密钥文件的内容追加到 `authorized_keys` 文件的末尾。注意示例中我使用了 `cat` 命令配合\
  \ `>>` 重定向字符，将名为 `keyfile` 的文件内容添加到 `authorized_keys`文件的末尾。\n\n在此示例中，`authorized_keys`\
  \ 文件尚不存在，因此重定向过程自动为我创建了它。正如此，由于文件不存在，我实际上可以使用单个 `>` 重定向字符。\n\n相反，如果 `authorized_keys`\
  \ 文件已经存在，请务必记住使用 `>>` 重定向字符而不是 `>`。请记住，使用 `>>` 将命令的输出追加到指定文件的末尾。使用单个重定向字符 `>` 将用命令的输出覆盖整个文件。如果\
  \ `authorized_keys` 文件中已经有了你想要保留的几个密钥，那将不是一件好事。\n\n你现在可以测试配置以查看公钥认证是否有效。如果你仍登录在\
  \ SSH 服务器的会话，请退出。然后与服务器建立新的 SSH 会话。系统应该提示输入密钥文件的密码短语，而不是用户名和密码，如图 18-9 所示。\n\n![Images](img/f0721-01.jpg)\n\
  \n**图 18-9** 提供密钥文件的密码短语\n\n一旦输入密码短语，你就通过了 SSH 服务器验证。注意下一个示例，建立 SSH 会话时没有请求密码：\n\
  \n![Images](img/p0722-01.jpg)\n\n如果需要，可以使用 `ssh-agent` 命令来消除每次建立 SSH 连接时输入密码短语的。完成以下操作：\n\
  \n1. 在客户端系统的 shell 提示符下，输入 `ssh-agent bash`。\n\n2. 在 shell 提示符下，输入 `ssh-add ~/.ssh/id_rsa`\
  \ 或 `ssh-add ~/.ssh/id_dsa`，取决于你创建了哪个密钥文件。\n\n3. 在收到提示时，输入密钥文件的密码短语。输入后，你应该收到提示身份已添加。示例所示：\n\
  \n![Images](img/p0722-02.jpg)\n\n完成完成后，`ssh-agent` 进程会将密码短语存储在内存中。它会监听 SSH 请求，并在需要时自动为你提供密钥短语。\n\
  \n让我们在下面的练习中练习配置 SSH 使用公钥认证。\n\n### 练习 18-3：配置公钥认证\n\n在本次练习中，你将在客户端系统上生成 RSA 密钥对，将公钥复制到\
  \ SSH 服务器，并配置服务器使用它。\n\n#### 1. 在客户端系统上生成 RSA 密钥对\na. 以标准用户身份登录客户端系统。\nb. 打开终端。\n\
  c. 在 shell 提示符下，输入 `ssh-keygen –t rsa`。\nd. 当提示保存私钥的文件路径时，按回车键使用默认文件名 `~/.ssh/id_rsa`。\n\
  e. 在收到提示时，为密钥输入密码短语。\n\n#### 2. 配置服务器系统使用公钥\na. 通过输入 `scp ~/.ssh/id_rsa.pub user_name@address_of_SSH_server:keyfile`\
  \ 将刚刚创建的公钥复制到 SSH 服务器。\nb. 在提示时输入远程用户的密码。\nc. 以你打算用于密钥认证的用户身份与远程系统建立 SSH 会话。使用以下命令：`ssh\
  \ -l user_name address_of_SSH_server`。\nd. 在提示时输入远程用户的密码。\ne. 在远程系统的 shell 提示符下，输入\
  \ `ls -la` 检查隐藏目录 `.ssh` 是否。如果 `.ssh` 目录不存在，使用 `mkdir ~/.ssh` 命令创建它。否则，进入下一步。\n\
  f. 在远程系统的 shell 提示符下，输入 `cat keyfile >> ~/.ssh/authorized_keys`。\ng. 在 shell 提示符下输入\
  \ `exit` 关闭 SSH 会话。\n\n#### 3. 测试新配置\na. 在客户端系统的 shell 提示符下，输入 `ssh -l user_name\
  \ address_of_SSH_server`。\nb. 在提示时，输入你分配给 RSA 私钥的密码短语。此时，你应该自动通过 SSH 服务器验证。\nc.\
  \ 在 shell 提示符下输入 `exit` 关闭会话。\n\n#### 4. 配置 ssh-agent 记住你的密码短语\na. 在客户端系统的 shell\
  \ 提示符下，输入 `ssh-agent bash`。\nb. 在 shell 提示符下，输入 `ssh-add ~/.ssh/id_rsa`。\nc. 在提示时，输入密钥文件的密码短语。\n\
  d. 在客户端系统的 shell 提示符下，输入 `ssh -l user_name address_of_SSH_server`。你应该自动通过 SSH 服务器验证，而无需提示输入私钥密码短语。\n\
  \n\n\n\n干得好！你现在是一个 SSH 专家了！在结束本章之前，我们最后一个与加密相关的主题需要处理：加密文件。让我们接下来完成这一部分。\n\n## 加密\
  \ Linux 文件\n\n就像你可以使用 OpenSSH 对 Linux 系统之间的网络传输进行加密一样，你也可以使用加密来保护 Linux 文件系统中的文件。你可以使用多种工具来实现此点。其中一些是开源的，另一些是专有的。对于你的\
  \ Linux+/LPIC-1 考试，你需要了解如何使用开源的 GNU Privacy Guard (GPG) 工具来加密文件。因此，这就是我们在这里将使用的工具。我们将讨论以下内容：\n\
  \n![images](img/bull.jpg) GPG 的工作原理\n\n![images](img/bull.jpg) 使用 GPG 加密文件\n\n让我们先讨论\
  \ GPG 的工作原理。\n\n### GPG 的工作原理\n\nGNU Privacy Guard (GPG) 是 OpenPGP 标准（`RFC 4880`）的开源实现。它允许你对数据和通信进行加密和数字签名。例如，你可以加密\
  \ Linux 文件系统中的文件。你也可以加密并对电子邮件数字签名。\n\nGPG 提供了一个加密引擎，可以直接从命令行提示符中使用 `gpg` 命令行工具调用。它也可以从系统运行的\
  \ shell 脚本或其他程序内部调用。例如，GPG 支持已集成到 Evolution 和 KMail 等几个流行的 Linux 电子邮件客户端中。它还集成到了\
  \ Psi 等即时消息应用程序中。\n\nGPG 也有许多图形界面。一些流行的界面包括 KGPG 和 Seahorse。然而，对于你的 Linux+/LPIC-1\
  \ 考试，你需要了解如何从命令行提示符使用 GPG，因此这就是我们本章的重点。\n\nGPG 的工作方式与 OpenSSH 类似，因为它同时使用了非对称和对称加密。GPG\
  \ 首先生成一个随机对称密钥，并使用它加密要传输的消息。对称密钥本身然后使用接收者的公钥进行加密，并与使用对称密钥加密的消息一起发送。当接收者收到消息时，GPG\
  \ 首先使用用户的私钥解密对称密钥。然后 GPG 使用解密对称密钥解密消息剩余。\n\nGPG 支持许多加密算法，包括以下：\n\n![images](img/bull.jpg)\
  \ 对称加密：\n\n![images](img/bull.jpg) AES\n\n![images](img/bull.jpg) 3DES\n\n![images](img/bull.jpg)\
  \ Blowfish\n\n![images](img/bull.jpg) 非对称加密：\n\n![images](img/bull.jpg) Elgamal\n\
  \n![images](img/bull.jpg) RSA\n\n![images](img/bull.jpg) 哈希算法：\n\n![images](img/bull.jpg)\
  \ MD5\n\n![images](img/bull.jpg) SHA-1 和 -2\n\n![images](img/bull.jpg) RIPEMD-160\n\
  \n![images](img/bull.jpg) 数字签名：\n\n![images](img/bull.jpg) DSA\n\n![images](img/bull.jpg)\
  \ RSA\n\n现在你已经了解 GPG 的工作原理，让我们回顾一下如何使用 GPG 加密文件。\n\n### 使用 GPG 加密文件\n\n要使用 GPG 加密文件，请执行以下操作：\n\
  \n1. 使用 GPG 生成你的密钥。为此，在 shell 提示符处输入 `gpg --gen-key`。示例所示：\n\n![Images](img/p0725-01.jpg)\n\
  \n2. 选择要创建的密钥类型。通常你会使用默认选项 (1)，它使用 RSA。系统会提示你指定密钥的大小，所示：\n\n![Images](img/p0725-02.jpg)\n\
  \n3. 指定要创建的密钥大小。通常使用 2048 位的默认大小就足够了。系统会提示你配置密钥有效期，所示：\n\n![Images](img/p0725-03.jpg)\n\
  \n4. 指定密钥何时过期。如第 3 步所示，你可以指定密钥在若干天、周、月或年后过期。\n\n5. 为密钥构建你的用户 ID。你需要指定的第一个参数是你的真实姓名。你指定的名称非常重要，因为它在稍后的加密过程中会被用到。在下一个示例中，我将真实姓名输入为\
  \ `rtracy`：\n\n![Images](img/p0725-04.jpg)\n\n6. 收到提示时，输入你的电子邮件地址。\n\n7. 收到提示时，输入你选择的注释。系统会提示你确认为密钥创建的用户\
  \ ID。示例所示：\n\n![Images](img/p0726-01.jpg)\n\n8. 如果信息正确，输入 `O` 确认 ID。系统会提示你为密钥输入密码短，所示\
  \ 图 18-10]。\n\n9. 为密钥输入一个唯一的密码短。完成后，系统会提示你在生成密钥时对系统执行各种操作。示例所示：\n\n![Images](img/p0726-02.jpg)\n\
  \n10. 移动鼠标、在键盘上输入字符或打开并关闭光驱门。GPG 使用这些动作生成随机数来创建你的密钥。请注意，如果你操作不足，系统会提示你增加活动以产生足够的熵来创建密钥。示例所示：\n\
  \n![Images](img/p0726-02a.jpg)\n\n![Images](img/f0726-01.jpg)\n\n**图 18-10** 提供\
  \ GPG 密码短\n\n此时，你的密钥对已经生成了！密钥文件存储在用户主目录下的 `~/.gnupg` 中。该目录下创建了以下文件：\n\n![images](img/bull.jpg)\
  \ `secring.gpg` 该文件是 GPG 私密钥环。\n\n![images](img/bull.jpg) `pubring.gpg` 该文件是 GPG\
  \ 公钥环。\n\n![images](img/bull.jpg) `trustdb.gpg` 该文件是 GPG 数据库。\n\n在继续之前，你应该认真考虑为你的私钥创建备份，以防它损坏。这非常重要，因为如果你用密钥对加密了文件然后丢失了密钥，你将永远无法解密它们。它们彻底完蛋了！即使你重新创建密钥对，也无法解密这些文件，因为它们是用不同的密钥对加密的。\n\
  \n要创建私钥的备份，在 shell 提示符处输入 `gpg --export-secret-keys --armor *key_owner_address*\
  \ > *filename*.asc`。示例所示：\n\n![Images](img/p0727-01.jpg)\n\n出于安全考虑，你可能不应该将此文件留在硬盘上。相反，考虑将其刻录到光盘或拷贝到\
  \ USB 闪存并妥善保存。这将允许你在硬盘上的原始副本丢失时恢复私钥。\n\n你现在可以使用你的密钥对对文件和消息进行加密了。例如，如果你想加密 Linux\
  \ 文件系统中的一个文件，可以执行以下操作：\n\n1. 在 shell 提示符处，输入 `gpg -e -r *key_name filename`。在所示示例中，我正在使用我生成的密钥加密\
  \ `mytestfile.txt` 文件。`-e` 告诉 `gpg` 加密指定的文件。记得我在创建密钥用户 ID 时指定了密钥用户名 `rtracy`，所以我在这里输入了：\n\
  \n```\nrtracy@openSUSE:~> gpg -e -r rtracy mytestfile.txt\n```\n\n2. 在 shell 提示符处，使用\
  \ `ls` 命令查看 gpg 创建的新加密版本文件。原始文件保持完好。新文件具有与原始文件相同的文件名，但增加了 `.gpg` 扩展。在此示例中，新文件名为\
  \ `mytestfile.txt.gpg`。图 18-11 显示了原始文件与加密文件之间的差异。\n\n![Images](img/f0727-01.jpg)\n\
  \n**图 18-11** 查看用 gpg 加密的文件\n\n一旦文件被加密，就可以使用 `gpg` 命令进行解密。语法为 `gpg --output *output_filename*\
  \ --decrypt *encrypted_filename*`。例如，为了解密我之前创建的 `mytestfile.txt.gpg` 文件，我会输入 `gpg\
  \ --output mytestfile.txt.decrypted --decrypt mytestfile.txt.gpg`。示例所示：\n\n![Images](img/p0728-01.jpg)\n\
  \n\n\n\n到此时，你已经能够对本地系统上的文件进行加密和解密。但如果你想与其他人交换加密文件，并且双方都能解密，该怎么办呢？要做到这一点，你必须在你的系统中交换并安装\
  \ gpg 公钥。有两种方法。\n\n第一种方案是将你的公钥复制到互联网上的公钥服务器。通过在 shell 提示符输入 `gpg --keyserver hkp://subkeys.pgp.net\
  \ --send-key key_ID` 来完成。注意，此命令要求你知道与你的 gpg 公钥相关的 ID 数字。这个数字在你最初创建 gpg 密钥对时会显示出来，但如果你像我一样，可能没有记下它。这没关系，因为你可以从命令行重新生成它。要这样做，请输入\
  \ `gpg --fingerprint key_owner_email`。示例如所示：\n\n![Images](img/p0728-02.jpg)\n\n\
  在这个示例中，我实际上将命令的输出保存到了名为 `key_ID.txt` 的文件中以便备，但这是可选的。密钥的 ID 数字包含在命令输出的第一行中。请注意，我加粗了所需的数字。\n\
  \n一旦你获得了 ID 数字，就可以将你的 gpg 公钥复制到互联网上的公钥服务器了。使用我系统中之前的这些信息，我会在命令行提示符输入 `gpg --keyserver\
  \ hkp://subkeys.pgp.net --send-key 9DF54AB2`。\n\n如果你想与许多用户交换密钥，这种方案非常好用。然而，如果你只关注与少数人进行这样做，你也可以直接在系统之间交换密钥。\n\
  \n要做到这一点，你（以及其他用户）可以导出公钥并发送给对方。要这样做，你在 shell 提示符输入 `gpg --export --armor key_owner_email\
  \ > public_key_filename`。例如，为了将我之前创建的密钥对的公钥导出到名为 `gpg.pub` 的文件中，我将输入以下：\n\n```\n\
  rtracy@openSUSE:~> gpg --export rtracy@openSUSE > gpg.pub\n```\n\n然后，每个用户可以将他们的密钥文件复制给其他用户。例如，如果我想将我的密钥发送到名为\
  \ fedora 的另一个 Linux 主机上的学生账户，我将输入以下内容：\n\n```\nrtracy@openSUSE:~> scp gpg.pub student@fedora:\n\
  ```\n\n一旦完成，每个用户应该使用 shell 提示符上的 `gpg --import public_key_filename` 命令将其他用户的公钥导入他们的\
  \ GPG 密钥环。在接下来的示例中，我首先使用 `scp` 将公钥文件从 openSUSE 系统复制到 fedora 系统。然后我使用 `gpg` 导入了公钥。\n\
  \n![Images](img/p0729-02.jpg)\n\n记住，每个用户都需要重复这个过程。然后他们可以使用对方的 gpg 密钥来加密和解密文件。你可以使用\
  \ `gpg --list-keys` 命令查看 GPG 密钥环中的密钥，如下例所示：\n\n![Images](img/p0729-03.jpg)\n\n在这个示例中，你可以看到我之前在\
  \ openSUSE 上创建的公钥现在已导入 fedora 上学生用户的 GPG 密钥环。密钥环文件本身位于家目录下的 `~/.gnupg/` 目录，名为 `pubring.gpg`。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** `gpg.conf` 文件也位于 `~/.gnupg` 目录。你可以使用此文件来自定义\
  \ gpg 在你系统上的工作方式。\n\n然后我需要反向执行相同的操作。我应该将 fedora 系统上学生用户处的公钥导入到我的系统（openSUSE）。导入公钥后，我们就可以交换加密文件并能够解密它们。执行此操作的语法是\
  \ `gpg --output output_filename --symmetric encrypted_filename`。例如，如果我从 openSUSE\
  \ 系统将 `mytestfile.txt.gpg` 加密文档发送到 fedora 系统，我将输入以下命令来解密它：\n\n![Images](img/p0729-04.jpg)\n\
  \n当我执行时，系统会提示我输入最初生成私钥时为其分配的密码。一旦完成，就会创建一个该文件的解密版本，并且本地用户可以访问。\n\n在我们结束本章之前，我们需要讨论*密钥撤销*（key\
  \ revocation）这一主题。你可能偶尔需要撤销密钥，这将将其从公共用途中撤回。如果密钥被泄露、丢失或你忘记了与密钥相关的密码，就应该这样做。\n\n***\n\
  \n![Images](img/note.jpg)\n\n**注意** 忘记与密钥对相关的密码是一个非常常见的问题，会导致密钥撤销。\n\n要撤销密钥，你需要创建一个*密钥撤销证书*。作为最佳实践，你应该在最初创建密钥对后立即创建一个密钥撤销证书。这样做是为了防止某些发生损坏，导致在以后由于某种原因需要时无法创建撤销证书。这里有一个需要记住的关键点：创建密钥撤销证书并不会真正撤销密钥对。只有当你实际上发布密钥撤销证书时，密钥才会被撤销。基本上，你创建密钥撤销证书并将其保存在安全的地方，以备以后需要。\n\
  \n要创建（而不是发布）密钥撤销证书，在 shell 提示符输入 `gpg --output revoke.asc --gen-revoke key_ID`。记住，你可以使用\
  \ `gpg` 命令的 `--fingerprint` 选项查看密钥 ID 数字。在接下来的示例中，我为 fedora 系统上学生用户生成的 gpg 密钥对创建了一个密钥撤销证书：\n\
  \n![Images](img/p0730-01.jpg)\n\n![Images](img/p0731-01.jpg)\n\n注意在这个示例中，我必须指定撤销密钥的原因以及更详细的描述。我还必须提供最初创建密钥对时使用的密码。还要注意命令输出末尾的警告信息。你可能应该避免将密钥撤销证书保留在系统的硬盘上。相反，应将其刻在同一张光盘上，或将其复制到与密钥对备份相同的闪盘中并锁好！如果有人得到了这个文件，他们可以在你不知情或不同意的情况下撤销你的证书，这将是一件坏事。\n\
  \n***\n\n![Images](img/tip.jpg)\n\n**提示** 命令的输出说是打印密钥撤销证书。我认为这是一种麻烦的存档方法。如果你以后需要发布它，你必须手动输入撤销证书。真讨厌！我更倾向于将其复制到我锁在柜子里的闪盘中。无论你选择使用哪种存档机制，不要忘记删除硬盘上的文件。\n\
  \n那么，如果你的证书真的泄露了，你最终需要撤销它，该怎么办？这个过程其实非常简单。你只需要按照讨论过的标准证书的方法导入撤销证书。你在 shell 提示符输入\
  \ `gpg --import revocation_certificate_filename`。示例如所示：\n\n![Images](img/p0731-02.jpg)\n\
  \n一旦完成，你可以通过在 shell 提示符输入 `gpg --list-keys key_ID` 来验证密钥已被撤销。你应该看到被撤销的密钥现在从你的密钥环中消失了。如果你在本章之前讨论的手动方法分发公钥，你必须在导入了你公钥的任何系统中导入密钥撤销证书。\n\
  \n如果你正在使用互联网上的公钥服务器向其他用户分发密钥，你将需要在那里发布密钥撤销证书。在 shell 提示符输入 `gpg --keyserver public_key_server_URL\
  \ --send key_ID`。这会让所有使用你公钥的人知道该密钥已泄露，不应使用。\n\n### **练习 18-4：使用 GPG 加密文件**\n让我们在下面的练习中练习使用\
  \ GPG。\n\n\n\n\n在此练习中，你将使用 `GPG` 加密一个文件并发送到第二个 Linux 系统。然后，你将导出你的公钥，将其复制到第二个 Linux\
  \ 系统，并使用该密钥解密所发送的文件。\n\n![Images](img/note.jpg)\n\n**注意** 完成此练习你至少需要两个 Linux 系统。你可以使用两个\
  \ Linux 运行系统、两个 Linux 虚拟机，或者两者的结合。\n\n![Imags](img/viedo.jpg)\n\n**视频** 请观看练习 18-4\
  \ 视频，演示如何执行此任务。\n\n完成以下操作：\n\n### 1. 按照以下步骤生成 GPG 密钥对：\n\n**a.** 启动你的第一个 Linux 系统并以标准用户身份登录。\n\
  **b.** 打开终端会话。\n**c.** 在 shell 提示符输入 `gpg --gen-key`。\n**d.** 当提示选择要创建的密钥类型时，按回车使用默认选项\
  \ (1)，该选项使用 RSA 和 RSA。\n**e.** 当提示指定密钥大小时，按回车使用默认的 2048 位大小。\n**f.** 当提示指定密钥何时过期时，按回车选择默认选项\
  \ (0)，该选项指定密钥永不过期。\n**g.** 当提示确认此选择时，输入 `y`。\n\n![Images](img/note.jpg)\n\n**注意**\
  \ 我们这样做仅出于演示之目的。在现实世界中，你应该配置密钥在一段时间后过期。这样，如果你的密钥万一泄露，它将在一段时间后变得失效。\n\n**h.** 构建密钥的用户\
  \ ID，首先指定一个长度至少五个字符的用户名。记下你输入的用户名，因为你以后会需要它。\n**i.** 当提示时，输入你的电子邮件地址。记下你输入的电子邮件地址，因为你以后会需要它。\n\
  **j.** 当提示时，输入你的全名作为注释。\n**k.** 当提示确认你为密钥创建的用户 ID 时，输入 `O`（字母 O）进行确认。\n**l.** 当提示为密钥输入密码时，输入一个唯一的密码。\n\
  **m.** 当收到提示时，移动鼠标、在键盘上输入字符，或者打开并关闭光驱驱动器门。完成这些操作后，你的密钥对就生成了！\n\n### 2. 通过以下操作使用\
  \ GPG 加密文件：\n\n**a.** 在 shell 提示符下输入 `gpg –e –r key_user_name mytestfile.txt`。将\
  \ `key_user_name` 替换为你创建密钥时输入的真实名称。你已经在练习 18-1 中创建了 `mytestfile.txt` 文件。如果你没有该文件，请创建一个同名的新文件。\n\
  **b.** 在 shell 提示符下，使用 `ls` 命令验证是否创建了 `mytestfile.txt.gpg` 文件。\n\n### 3. 通过以下操作解密你创建的文件：\n\
  \n**a.** 在 shell 提示符下输入 `gpg --output mytestfile.txt.decrypted --decrypt mytestfile.txt.gpg`\
  \ 解密文件。\n**b.** 使用 `cat` 命令显示 `mytestfile.txt.decrypted` 文件的内容，并验证其是否与原始文件一致。\n\n\
  ### 4. 通过以下操作将加密文件发送到另一个系统并在那里进行解密：\n\n**a.** 启动你的第二个 Linux 系统并以标准用户身份登录。\n**b.**\
  \ 使用 `ping` 命令验证它是否能与创建 GPG 密钥对的第一个 Linux 系统进行网络通信。\n**c.** 回到你的第一个 Linux 系统。\n\
  **d.** 在第一个 Linux 系统的 shell 提示符下输入 `gpg –export --armor key_owner_email > gpg.pub`\
  \ 导出你的密钥。\n**e.** 使用 `scp` 命令将 `gpg.pub` 和 `mytestfile.txt.gpg` 文件从第一个 Linux 系统复制到第二个\
  \ Linux 系统。\n**f.** 切换到第二个 Linux 系统。\n**g.** 验证 `gpg.pub` 文件是否已复制到用户的家目录。\n**h.**\
  \ 在 shell 提示符下输入 `gpg --import ~/gpg.pub` 将第一个 Linux 系统的公钥导入 GPG 密钥环。\n**i.** 在\
  \ shell 提示符下输入 `gpg --list-keys` 验证公钥已导入。\n**j.** 在 shell 提示符下输入 `gpg --output mytestfile.txt.decrypted\
  \ --symmetric mytestfile.txt.gpg` 解密你从第一个系统复制的加密文件。\n**k.** 当提示时，输入你在第一个系统创建 GPG\
  \ 密钥时分配的密码。\n**l.** 使用 `cat` 命令显示 `mytestfile.txt.decrypted` 文件的内容，并验证其是否与第一个 Linux\
  \ 系统上的原始文件一致。\n\n### 5. 通过以下操作对你的 GPG 密钥对执行维护任务：\n\n**a.** 输入 `gpg --export-secret-keys\
  \ --armor key_owner_email_address > gpgkey.asc` 创建 GPG 密钥对的备份。\n**b.** 输入 `gpg --output\
  \ revoke.asc --gen-revoke key_ID` 创建吊销证书。记住，你可以使用 `gpg` 的 `--fingerprint` 选项查看密钥\
  \ ID。\n\n你做到了！你现在是 SSH 和 GPG 专家了！让我们回顾一下学到的知识。\n\n### 本章总结\n\n在本章中，你学习了如何使用加密来保护\
  \ Linux 系统上的数据。我们首先通过 SSH 加网络通信，然后查看了使用 GPG 加密文件。\n\n在本章开始，回顾了加密的工作原理。我们查看的第一种加密是对称加密。在对称加密中，用于加密消息的密钥与解密消息的密钥是同一个。这意味着发送方和接收方都必须拥有相同的密钥。对称加密的主要优势之一是速度快。对称加密的一个困难之一是如何向需要通信的所有方安全地分发密钥。对称加密标准的示例包括\n\
  \n- 3DES\n- AES\n- Blowfish\n\n在选择加密方案时，应选择至少支持 128 位的。密钥越长，数据越安全。\n\n然后我们将注意力转向非对称加密。非对称加密使用两个密钥而不是一个：公钥和私钥。用公钥加密的数据只能用私钥解密。用私钥加密的数据只能用公钥解码。非对称加密通常被称为*公钥加密*。常用的非对称加密机制包括\n\
  \n- RSA\n- DSA\n\n公私钥对应该比用于对称加密的密钥长得多。它们应该是 1024 位或更高。\n\n你经常会看到结合使用对称和非对称加密的实现。非对称加密用于初始密钥交换，以便安全地将秘密密钥复制给双方。一旦完成，双方都拥有相同的密钥，并在会话剩余部分切换到对称加密。\n\
  \n证书机构（CA）负责发布和管理加密密钥。当向 CA 请求密钥对时，它会使用指定的加密方案（如 RSA 或 DSA）同时生成公钥和私钥。密钥对中的私钥仅给密钥所有者。相反，公钥可以提供给任何需要的人。CA\
  \ 的作用是验证参与加密交换的双方确实是他们所称的身份。你需要熟悉两种 CA：\n\n- 内部 CA\n- 外部 CA\n\n\n\n\n因为你在安装操作系统时\
  \ Linux 系统安装了它自身的内部 CA，我们可以使用它来签发自己的证书，并使用它们来加密网络传输和文件系统中的文件。\n\n随后，我讨论了如何使用 OpenSSH\
  \ 加密 Linux 系统之间的远程会话。早期的 Linux 网络服务如 `Telnet`、`rlogin`、`rcp`、`rshell` 和 `FTP` 以明文传输数据，这会导致用户名、密码和其他敏感数据暴露给嗅探器。相比之下，OpenSSH\
  \ 提供了一系列工具，你可以使用它们来加密这些数据传输：\n\n![images](img/bull.jpg) sshd\n\n![images](img/bull.jpg)\
  \ ssh\n\n![images](img/bull.jpg) scp\n\n![images](img/bull.jpg) sft\n\n![images](img/bull.jpg)\
  \ slogin\n\nOpenSSH 使用私钥/公钥加密结合密钥密钥加密。首先，SSH 客户端与在 IP 端口 `22` 上运行 SSH 服务器的系统建立连接。然后，SSH\
  \ 服务器将其公钥发送给 SSH 客户端。客户端系统接收到 SSH 服务器的公钥，并检查是否已经拥有该密钥的副本。默认情况下，如果这两个文件中都没有服务器的公钥，它会要求用户添加它。完成后，客户端现在信任该服务器系统并生成一个\
  \ 256 位的密钥。然后，它使用服务器的公钥加密新密钥并将其发送到服务器。服务器使用其私钥对其进行解密。完成后，两个系统现在都可以在会话中使用对称加密。在 SSH\
  \ 版本 2 中，密钥实际上并没有从客户端传输到服务器系统。相反，使用了 Diffie-Hellman 密钥交换协议来协商用于会话的密钥，而无需在在网络上实际发送该密钥。\n\
  \n配置 OpenSSH 的过程涉及同时配置 SSH 服务器和 SSH 客户端。你使用 `/etc/ssh/sshd_config` 文件配置 `sshd` 守护进程。SSH\
  \ 客户端使用 `/etc/ssh/ssh_config` 文件或 `~/.ssh/ssh_config` 文件进行配置。在连接到 SSH 服务器之前，你必须在运行\
  \ `sshd` 的系统的基于主机的防火墙中开启 `22` 端口。\n\n你可以在本地计算机上加载 ssh 客户端，并通过输入 `ssh –l user_name\
  \ ip_address` 连接到远程 Linux 系统上的 `sshd` 守护进程。\n\n接下来，我们查看了如何通过 SSH 隧道安全地对默认未加密的网络流量进行隧道处理。当被隧道协议的客户端软件（例如使用\
  \ `POP3` 的电子邮件客户端）与本地 SSH 客户端建立连接时，流量将使用 SSH 加密并通过隧道传输到 SSH 服务器。在 SSH 服务器端，流量将被解密，然后转发到适当的目标服务（例如\
  \ `POP3` 电子邮件守护进程）。即使原始协议（如 `POP3`）不支持加密，信息在传输之前也经过了加密。\n\n要配置 SSH 隧道，你必须首先在运行 `sshd`\
  \ 的系统上编辑 `/etc/ssh/sshd_config` 文件，并将 `AllowTcpForwarding` 参数设置为 `yes`。然后，你从本地高\
  \ IP 端口到远程服务器上所需服务监听的端口（例如用于 `POP3` 服务器的 `110` 端口）创建一个本地 ssh 隧道。这是通过使用以下命令完成的：\n\
  \n```\nssh -f -N -L high_port:remote_host_address:port user_name@remote_host_address\n\
  ```\n\n你可以在隧道的客户端端使用 `telnet` 命令测试隧道。在 shell 提示符下输入 `telnet localhost client_tunnel_port`。\n\
  \n你还可以使用 SSH 连接将你的 X 服务器流量隧道到远程 X 客户端。要做到这一点，你必须使用 `xhost +X_server_hostname` 命令配置客户端系统接受来自\
  \ X 服务器的连接。然后，通过设置设置 `DISPLAY` 环境变量配置 X 服务器将其图形显示重定向到客户端系统。语法为 `DISPLAY=*X_client_hostname*:0.0`。然后导出该变量的新值。\n\
  \n接下来，你需要在 X 服务器系统的 `/etc/ssh/sshd_config` 文件中将 `X11Forwarding` 选项设置为 `yes`。在客户端系统的\
  \ shell 提示符下，输入 `ssh –X –l user_name IP_address_of_X_server` 并登录到远程系统。然后输入相应的命令启动图形应用程序。当你这样做时，应用程序将在\
  \ X 服务器系统上运行，但安全地显示在客户端系统的桌面上。\n\n我通过讨论如何配置 SSH 使用公钥身份验证而不是用户名和密码来结束了对 SSH 的讨论。要做到这一点，必须将客户端系统用户的公钥存储在将要身份验证的服务器系统用户家目录下的\
  \ `~/.ssh/authorized_keys` 文件中。\n\n在此配置中，SSH 客户端在 SSH 会话最初建立时告诉 SSH 服务器应使用哪个公钥进行身份验证。SSH\
  \ 服务器检查是否拥有该客户端的公钥；如果有，它将生成一个随机数并用该公钥对其加密。然后它将加密后的数字发送给客户端，客户端使用与公钥关联的私钥对其解密。然后客户端计算从服务器收到的数字的\
  \ `MD5` 校验和。它将校验和通过 SSH 服务器传回，服务器随后对其原始发送的数字计算自己的 `MD5` 校验和。如果两个校验和匹配，用户将自动登录。\n\
  \n要配置公钥 身份验证，你必须执行以下操作：\n\n**1.** 在客户端系统上使用 `ssh-keygen` 命令创建公钥/私钥对。\n\n**2.** 使用\
  \ `scp` 命令将你刚刚创建的公钥复制到 SSH 服务器。\n\n**3.** 将刚刚复制的密钥文件内容追加到要连接的 SSH 服务器的用户家目录下的 `~/.ssh/authorized_keys`\
  \ 文件的末尾。可以通过将 `cat` 命令的输出重定向（`>>`）到 `authorized_keys` 文件来实现。\n\n完成后，你可以从客户端系统连接到远程\
  \ SSH 服务器。你不需要输入用户名和密码进行身份验证，而是会被提示提供私钥的密码短语。如果需要，你可以使用 `ssh-agent` 命令来消除每次建立 SSH\
  \ 连接时输入密码短语的需求。\n\n此时，我将话题转移到了加密 Linux 文件系统中的文件。对于你的 Linux+/LPIC-1 考试，你需要知道如何使用开源\
  \ GNU Privacy Guard (GPG) 工具来加密文件。GPG 是 OpenPGP 标准 (RFC 4880) 的开源实现，允许你对数据和通信进行加密和数字签名。\n\
  \nGPG 同时使用非对称和对称加密。GPG 首先生成一个对称密钥并用它加密消息。密钥本身本身使用接收者的公钥加密，并与对称密钥加密的消息一起发送。当接收者收到消息时，GPG\
  \ 首先使用用户的私钥解密对称密钥。然后 GPG 使用解密的对称密钥解密消息。GPG 支持许多加密算法，包括：\n\n![images](img/bull.jpg)\
  \ 对称加密：\n\n![images](img/bull.jpg) AES\n\n![images](img/bull.jpg) 3DES\n\n![images](img/bull.jpg)\
  \ Blowfish\n\n![images](img/bull.jpg) 非对称加密：\n\n![images](img/bull.jpg) Elgamal\n\
  \n![images](img/bull.jpg) RSA\n\n![images](img/bull.jpg) 哈希算法：\n\n![images](img/bull.jpg)\
  \ MD5\n\n![images](img/bull.jpg) SHA-1 and -2\n\n![images](img/bull.jpg) RIPEMD-160\n\
  \n![images](img/bull.jpg) 数字签名：\n\n![images](img/bull.jpg) DSA\n\n![images](img/bull.jpg)\
  \ RSA\n\n使用 GPG 加密文件，请执行以下操作：\n\n**1.** 在 shell 提示符下使用 `gpg --gen-key` 命令生成你的密钥。\n\
  \n**2.** 在 shell 提示符下使用 `gpg –e –r key_user_name filename` 命令加密文件。\n\n\n\n\n一旦文件被加密，就可以可以在\
  \ shell 提示符中使用 `gpg --output output_filename --decrypt encrypted_filename` 命令进行解密。\n\
  \n如果你想与其他人交换加密文件，并且双方都能解密这些文件，你必须在你的系统中交换并安装 gpg 公钥。有两种方法可以实现这一点：\n\n![images](img/bull.jpg)\
  \ 第一种方案是将你的公钥拷贝到互联网上的公钥服务器。这通过在 shell 提示符输入 `gpg --keyserver hkp://subkeys.pgp.net\
  \ --send-key key_ID` 来。\n\n![images](img/bull.jpg) 第二种方案是与其他用户手动交换密钥。要执行此操作，你需要在\
  \ shell 提示符输入 `gpg --export --armor key_owner_email > public_key_filename`。完成后，每个用户都应该使用\
  \ shell 提示符上的 `gpg --import public_key_filename` 命令将另一个用户的公钥导入到自己的 GPG 密钥环中。\n\n\
  你可以使用 `gpg --list-keys` 命令查看 GPG 密钥环中的密钥。导入公钥后，你就可以使用 `gpg --output output_filename\
  \ --symmetric encrypted_filename` 命令解密由加密的用户发送给你的文件。\n\n如果密钥泄露、丢失或你忘记与密钥关联的密码短，你可能需要撤销密钥。要撤销密钥，你需要创建一个密钥撤销证书。作为最佳实践，你应该在最初创建密钥对后立即创建一个密钥撤销证书。要创建密钥撤销证书，在\
  \ shell 提示符输入 `gpg --output revoke.asc --gen-revoke key_ID`。要撤销密钥，必须通过在 shell 提示符输入\
  \ `gpg --import revocation_certificate_filename` 来导入撤销证书。如果你使用手动方法分发公钥，则必须在导入了你公钥的其他任何系统中导入密钥撤销证书。如果你使用互联网上的公钥服务器向其他用户分发密钥，则需要通过在\
  \ shell 提示符输入 `gpg --keyserver public_key_server_URL --send key_ID` 发布密钥撤销。\n\n\
  ## 加速复习\n\n![images](img/bull.jpg) 使用对称加密，用于加密消息的密钥与用于解密消息的密钥是同一个。\n\n![images](img/bull.jpg)\
