  **B.** `modinfo`\n**C.** `modprobe`\n**D.** `rmmod`\n**E.** `depmod`\n\n### 19.**\
  \ 你在哪个目录下可以找到关于系统中 I/O 端口分配情况的信息？\n\n**A.** `/proc/devices`\n**B.** `/proc/dma`\n\
  **C.** `/proc/interrupt`\n**D.** `/proc/iomem`\n\n### 答案\n\n**1.** A.** 柱（Cylinders）是由硬盘驱动器所有盘片侧面的同心、平行的轨道组成的。\n\
  \n**2.** A.** 每个 SATA 设备都有其专门连接到 SATA 控制器的专用数据通道。然而，控制器本身可能提供多个 SATA 数据通道以支持多个设备。\n\
  \n**3.** E.** SCSI ID 越高，设备优先级越高。\n\n**4.** A, D.** 因为第一块硬盘和 SCSI 控制器位于 SCSI 链的末端，所以它们必须启用终止（termination）。中间的任何设备都不应启用终止。\n\
  \n**5.** E, F.** 因为 SSD 是通常使用 SATA 接口的块设备，它们使用与机械硬盘相同的驱动器几何结构设置（CHS）进行寻址。\n\n**6.**\
  \ B.** USB 功能包括终端设备，如打印机、扫描仪和硬盘，这些设备不包含 USB Hub 功能。请注意，某些此类设备的制造商确实包含了 Hub 功能，使它们既是\
  \ Hub 也是功能设备。\n\n**7.** D.** 通过级联多个 USB Hub，你可以创建一个可以容纳多达 127 个设备的 USB 总线。请注意，用于创建总线的\
  \ Hub（包括根 Hub）每个都将算作一个设备。\n\n**8.** D.** 火线（FireWire）总线的数据传输速度高达 3.2 Gbps。\n\n**9.**\
  \ C.** 火线设备是自识别、自配置和热插拔的。\n\n**10.** A.** 系统定时器在 PC 系统上被硬连到中断 0。\n\n**11.** A, B.**\
  \ 中断 0, 1 在 PC 系统上是硬连的。它们不能被重新接管。\n\n**12.** A.** 端口 `0040h` 分配给 PC 系统上的系统定时器。\n\
  \n**13.** B, C.** 你可以插入适当的内核模块，也可以重新编译内核以支持该板卡。\n\n**14.** A.** 你的内核模块位于 `/lib/modules/*version*/kernel/drivers`。\n\
  \n**15.** C.** IRQ 分配信息可以在 `/proc/interrupt` 中找到。\n\n**16.** D.** 可以 `hdparm` 工具获取硬盘信息。\n\
  \n**17.** A, C.** 你可以使用 `insmod` 或 `modprobe` 插入内核模块。\n\n**18.** E.** 你可以使用 `depmod`\
  \ 构建模块依赖列表。\n\n**19.** D.** 你可以在 `/proc/iomem` 中找到关于系统中 I/O 端口分配的信息。\n\n# 第 13 章\n\
  ## 管理 进程\n\n在本章中，你将学习：\n\n- 理解进程\n- 管理进程\n- 调度进程\n\n到目前为止，你已经在书中学习了大量的知识。我们从简单的内容开始，学习了\
  \ Linux 的历史起源以及它在组织中可以扮演的不同角色。随着每个章节的推进，你被引入了越来越具有挑战性的概念和技能。在上一章中，当我们讨论管理内核模块时大大提高了难度。在本章中，我们将查看\
  \ Linux 操作系统如何处理运行的可执行程序和脚本。然后我们将花些时间学习如何管理运行中的可执行文件。\n\n\n\n\n\n能够有效管理 Linux 进程的关键在于首先理解进程在操作系统内部是如何运行的。那么，进程到底是什么？对于我们而言，`process`（进程）是指从长期存储设备（通常是硬盘驱动器）加载到系统内存（RAM），并且正由主板上的\
  \ CPU 处理的程序。\n\n可以执行许多不同类型的程序来创建进程。在你的 Linux 系统上，表 13-1 中列出的程序类型可以被加载到内存并由 CPU 执行。\n\
  \n![Images](img/t0460-01.jpg)\n\n**表 13-1** 可以创建进程的 Linux 程序\n\n请记住，Linux 操作系统可以在单个\
  \ CPU 上“并发”运行许多进程。根据你 Linux 系统的使用情况，在给定时间点，它可能只有几个进程在运行，也可能有数百个进程在并发运行。\n\n在上一段中，我给\
  \ `concurrently`（并发）一词加了引号，因为大多数 CPU 无法真正地同时运行多个进程。相反，Linux 操作系统会在运行在 CPU 各种进程之间快速切换，使得\
  \ CPU 看起来正在同时处理多个进程。然而，CPU 实际上一次只执行一个进程。所有其他当前“运行”的进程都在后台等待自己的机会。操作系统维护着一个调度表，决定每个进程何时允许访问\
  \ CPU。这被称为 `multitasking`（多任务）。因为进程之间的切换发生得非常快，对于你和我来说，CPU 似乎在同时执行多个进程。\n\n但是，请注意，该规则有两个例外。首先，多核\
  \ CPU 实际上可以一次执行多个一个进程，因为处理器封装包中的每个核心都是一个独立的 CPU。例如，如果 CPU 内部有两个核心，其中一个核心可以执行一个进程，而另一个核心则处理另一个进程。该规则的第二个例外是超线程（hyperthreading）CPU，其设计使得单个处理器可以一次运行多个一个进程。\n\
  \nLinux 操作系统使用多种类型的进程。你的 Linux 系统上并非所有进程都是相同的。某些进程是终端用户通过 shell 提示符或图形界面执行命令时创建的。这些进程被称为\
  \ `user processes`（用户进程）。用户进程通常与系统上运行的某种终端用户程序相关。\n\n例如，如果你从 shell 提示符（使用 `libreoffice`\
  \ 命令）运行 LibreOffice 套件，就会为 LibreOffice 程序创建两个用户进程（`oosplash` 和 `soffice.bin`）。此处所示：\n\
  \n![Images](img/p0461-01.jpg)\n\n关于用户进程要记住的关键点是，它们是从 shell 内部调用的与该 shell 会话相关。\n\
  \n然而，运行在你系统上的并非所有进程都是用户进程。事实上，在指定的 Linux 系统上执行的进程可能属于不同类型，被称为 `system processes`（系统进程）或\
  \ `daemons`（守护进程）。与用户进程不同，系统进程（通常）不为终端用户提供应用程序或界面。相反，它用于提供系统服务，例如 Web 服务器、FTP 服务器、如\
  \ `Samba` 的文件服务、如 `CUPS` 的打印服务或日志服务。此类进程在后台运行，通常不提供任何用户界面。\n\n例如，考虑图 13-1 所示的进程。\n\
  \n![Images](img/f0461-01.jpg)\n\n**图 13-1** 系统进程\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 大多数系统进程（但不是全部）在名称末尾标有 `d`，代表 `daemon`（守护进程）。\n\n注意系统有许多系统进程在运行。系统进程通常（但并非总是）在系统启动时由系统本身加载。因此，它们与特定的\
  \ shell 实例无关。这是用户进程和系统进程之间的另一个关键区别。用户进程绑定到调用它们的特定 shell 实例，而系统进程则不是。\n\n默认情况下，大多数\
  \ Linux 发行版在启动时都配置了许多随启动自动启动的守护进程。这些守护进程中的某些对系统的整体运行至关重要，另一些则不然。\n\n我在部署一个新的 Linux\
  \ 系统（无论是服务器还是工作站）后执行的第一件事就是关闭所有不需要的守护进程。运行不必要的守护进程会消耗内存和 CPU 时间。更严重，它还会在系统中留下巨大的安全漏洞。你需要非常清楚你负责的任何\
  \ Linux 系统上运行着哪些系统服务。如果需要该服务，保留它；如果不需要，删掉它！\n\n要理解哪些守护进程对系统整体功能关键，哪些不是，你需要理解 Linux\
  \ 进程的继承关系。让我们接着讨论。\n\n### Linux 进程是如何加载的\n\n所有的 Linux 进程都直接或间接地由一个名为 `init` 或 `systemd`（取决于发行版）的单一进程加载，该进程由\
  \ Linux 内核在系统启动时启动。请理解运行在 Linux 系统上的任何进程都可以启动额外的进程。启动新进程的进程被称为 `parent process`（父进程）。新进程本身被称为\
  \ `child process`（子进程）。\n\n这种父子关系构成了 Linux 进程的 `heredity`（继承）。由于任何进程（包括子进程）都可以启动额外的进程，系统上可能会运行许多代进程。这在图\
  \ 13-2 所示。\n\n![Images](img/f0462-01.jpg)\n\n**图 13-2** 进程的代\n\n在图 13-2 中，第一个父进程产生了三个子进程。这三个子进程中的每一个又产生了自己的子进程，使得第一个父进程变成了祖父！你现在看到为什么我们称其为进程的“继承”了吗？\n\
  \n对于 Linux 系统上的任何进程，我们能够唯一地识别它及其继承关系。每当 Linux 系统上创建一个进程时，它会被分配两个资源：\n\n![images](img/bull.jpg)\
  \ **进程 ID (PID) 数字** 这是分配给每个进程的数字，用于在系统中唯一地标识它。\n\n![images](img/bull.jpg) **父进程\
  \ ID (PPID) 数字** 这是该进程父进程的 PID（即产生它的进程）。\n\n通过为每个进程分配这两个数字，我们可以跟踪系统上任何进程的继承关系。Linux\
  \ 内核使用进程表来跟踪系统上运行的进程。进程表由操作系统在内存中维护，以便于进程之间的切换、进程调度和进程优先级排序。表中的每个条目都包含关于一个特定运行进程的信息，例如进程名称、进程状态、进程优先级以及进程使用的内存地址。\n\
  \n注意在图 13-2 中，我描绘了一个产生所有其他进程的“祖父”进程。这张图是从概念角度绘制的，旨在说明进程之间父子关系的本质。然而，它也可以用于描述 Linux\
  \ 系统中的代级层次结构。确实存在一个产生所有其他进程的“祖父”进程。这就是 `init` 或 `systemd` 进程（取决于发行版）。\n\n***\n\n\
  ![Images](img/note.jpg)\n\n\n\n\n\n**注意** 某些发行版仍使用 `init`，而其他发行版（如 Fedora 和 openSUSE）已迁移到\
  \ `systemd`。在过去的几年里，Linux 社区关于哪种更好实际上发生过一场“圣战大战”。在本文编写时，`systemd` 在采用率方面已开始逐渐超越\
  \ `init`。对于你的 LPIC-1/Linux+ 考试，你需要熟悉这两者。\n\n内核在启动过程中会自动加载 `systemd` 或 `init` 进程。然后，`systemd`\
  \ 或 `init` 进程会启动子进程（例如登录 shell），再由这些子进程启动其他进程（例如 `vi` 工具使用的进程），如图 13-3 所示。\n\n![Images](img/f0463-01.jpg)\n\
  \n**图 13-3** 作为所有其他进程祖父进程的 `systemd` 进程\n\n与其他进程是从系统的可用 `PID` 列表中随机分配 `PID`，而 `systemd`（或\
  \ `init`）进程总是被分配 `PID` 为 1。这引出了一个有趣点：如果 `systemd` 或 `init` 进程是所有其他进程派生的第一个进程，那么它的\
  \ `PPID` 是什么？它会有 `PPID` 吗？实际上，有的。因为 `systemd` 或 `init` 进程是由 Linux 内核（其 `PID` 始终为\
  \ 0）直接启动的，所以 `systemd` 进程的 `PPID` 始终为 0。这如图 13-4](#ch13.html_ch13fig4) 所示。\n\n![Images](img/f0464-01.jpg)\n\
  \n**图 13-4** `systemd` 进程的 `PPID`\n\n`systemd`（或 `init`）进程负责启动所有配置为启动自动启动的系统进程。它还会创建一个用于登录的\
  \ shell。\n\n这引出一个重要的点。注意图 13-3，我在登录 shell 之下放置了第二个 `bash` shell。你可能会问：“不能直接在登录 shell\
  \ 中运行 `vi` 吗？你必须启动第二个 `bash` shell 吗？”\n\n实际上，在图中，`vi` 确实是从登录 shell 启动的。那么，为什么在\
  \ `vi` 进程和登录 shell 之间显示了第二个 shell 呢？因为当你从任何 shell 内部运行命令时（无论是登录 shell 还是标准 shell\
  \ 会话），都会创建一个第二个 shell 会话，称为*subshell*（子 shell），并且你输入的命令进程将在其中运行。*subshell* 本身是一个独立的进程，并分配了自己的\
  \ `PID`。*subshell* 的 `PPID` 是输入命令的 shell 的 `PID`。\n\n只要在 shell 提示符输入的命令在使用中，*subshell*\
  \ 进程就会保持活动状态。命令进程在 *subshell* 中运行并被分配了自己的 `PID`。命令进程的 `PPID` 自然是它所运行的 *subshell*\
  \ 的 `PID`。当命令进程完成并退出时，*subshell* 将被终止，控制权返回到原始 shell 会话。这种创建新 *subshell* 并在其中运行命令进程的过程被称为*forking*（Fork）。\n\
  \n例如，在图 13-5 中，用户在 `bash` shell 的 shell 提示符下发了 `vi` 命令。创建一个一个新的 *subshell* 并在运行\
  \ `vi` 进程。当用户退出 `vi` 时，*subshell* 被销，控制权返回到原始 shell 实例。\n\n![Images](img/f0464-02.jpg)\n\
  \n**图 13-5** 从 shell 提示符运行进程\n\n现在你已经理解了 Linux 进程是如何工作的，你就可以开始管理它们了。让我们接下来来看这一点。\n\
  \n## 管理进程\n\n管理运行中的进程是你支持的 Linux 系统上需要完成的关键任务之一。在本章的这部分，我们将回顾如何做到这一点。我们将讨论以下主题：\n\
  \n- ![images](img/bull.jpg) 启动系统进程\n- ![images](img/bull.jpg) 查看运行中的进程\n- ![images](img/bull.jpg)\
  \ 设置进程优先级\n- ![images](img/bull.jpg) 管理前台和后台进程\n- ![images](img/bull.jpg) 结束运行中的进程\n\
  - ![images](img/bull.jpg) 注销后保持进程运行\n\n让我们从学习如何启动进程开始。\n\n### 启动系统进程\n\n在 Linux\
  \ 系统上启动进程有两种基本方法。对于用户进程，你只需要在 shell 提示符处输入命令或脚本名称。例如，要运行 `vi` 程序，只需在 shell 提示符处输入\
  \ `vi`。当你这样做时，就会创建 `vi` 进程，如下所示：\n\n![Images](img/p0465-01.jpg)\n\n但对于系统进程，你使用 `init\
  \ script` 或服务文件，这取决于你的发行版使用的是 `init` 还是 `systemd`。如果你的发行版使用 `init` 进程，则由 `init`\
  \ 进程使用 init 脚本在系统启动时启动进程。这些脚本存储在 Linux 系统的特定目录下。存储在哪个目录取决于你的 Linux 发行版。大多数 Linux\
  \ 发行版使用两种类型的 init 脚本：\n\n- ![images](img/bull.jpg) **System V**: 使用 System V init\
  \ 脚本的 Linux 发行版将其存储在 `/etc/rc.d` 目录。`/etc/rc.d` 内有一系列命名为 `rc0.d` 到 `rc6.d` 的子目录。这些目录中的每一个都与特定的运行级别（runlevel）相关。在这些子目录中，指向系统守护进程\
  \ init 脚本的符号链接，这些脚本位于 `/etc/rc.d/init.d`。\n- ![images](img/bull.jpg) **BSD**: 其他\
  \ Linux 发行版使用 BSD 风格的 init 脚本。这些脚本位于 `/etc/init.d` 目录。`/etc/init.d` 内有一系列命名为 `rc0.d`\
  \ 到 `rc6.d` 的目录。与 System V init 脚本一样，这些目录与特定的运行级别相关。这些目录包含指向 `/etc/init.d` 中 init\
  \ 脚本的链接。\n\n除了使用 `init` 进程运行这些脚本外，你还可以从命令提示符运行这些脚本。只需在 shell 提示符处输入 `/etc/init.d/*script_name*`（在\
  \ BSD 风格系统上）或 `/etc/rc.d/init.d/*script_name*`（在 System V 风格系统上）。如果你不确定应该使用哪个脚本名称，可以使用\
  \ `ls` 命令生成脚本目录中的脚本列表。这如图 13-6](#ch13.html_ch13fig6) 所示。\n\n![Images](img/f0466-01.jpg)\n\
  \n**图 13-6** `/etc/init.d` 中的 init 脚本\n\ninit 目录中的实际脚本取决于在你特定系统上安装了哪些服务。每当你使用 `rpm`\
  \ 工具在系统上安装服务时，相应的 init 脚本会自动安装到你的 init 脚本目录。一旦到位，你就可以通过从命令提示符运行来执行任何脚本。语法（在 BSD\
  \ 风格系统）如下：\n\n```\n/etc/init.d/script_name start | stop | restart\n```\n\n例如，要运行\
  \ `smb` 服务，你将在 shell 提示符处输入 `/etc/init.d/smb start`。要停止它，输入 `/etc/init.d/smb stop`。要重启它，输入\
  \ `/etc/init.d/smb restart`。\n\n在某些发行版上，你还可以使用 rc 脚本来启动、停止或重启服务进程，而无需指定脚本文件的完整路径。语法为\
  \ `rc*script_name* start | stop | restart`。例如，要启动 `smb` 服务，你可以在 shell 提示符处输入 `rcsmb\
  \ start`。要停止它，可以输入 `rcsmb stop`。你还可以使用 restart 选项来重启它。\n\n如果你的 Linux 发行版使用 `systemd`\
  \ 进程而不是 `init`，则你的系统服务使用带有 `.service` 扩展名的服务文件管理。你在 shell 提示符处使用 `systemctl` 命令来启动、停止、重启或检查系统服务的状态：\n\
  \n- ![images](img/bull.jpg) 启动服务，输入 `systemctl start *service_name*`。\n- ![images](img/bull.jpg)\
  \ 停止服务，输入 `systemctl stop *service_name*`。\n- ![images](img/bull.jpg) 重启服务，输入 `systemctl\
  \ restart *service_name*`。\n- ![images](img/bull.jpg) 查看服务状态，输入 `systemctl status\
  \ *service_name*`。\n\n\n\n\n\n例如，在运行 systemd 的发行版上启用 sshd 守护进程，你需要在 shell 提示符处输入\
  \ `systemctl start sshd`。\n\n现在你已经知道如何启动和停止系统进程，让我们来讨论如何查看正在运行的进程。\n\n## 查看运行中的进程\n\
  \n在本章的这一部分，我们将讨论如何查看系统上运行的进程。我们将涵盖以下工具：\n\n![images](img/bull.jpg) 使用 top\n![images](img/bull.jpg)\
  \ 使用 ps\n![images](img/bull.jpg) 使用 free\n![images](img/bull.jpg) 使用 pgrep\n\n让我们从\
  \ top 实用程序开始。\n\n### 使用 top\n\nLinux 提供了多种用于查看系统上运行进程的工具。我最喜欢的工具之一就是著名的 top 实用程序。你只需通过在\
  \ shell 提示符处输入 `top` 即可运行它。当你这样做时，会显示如图 13-7 所示的界面。\n\n![Images](img/f0468-01.jpg)\n\
  \n**图 13-7** 使用 top 查看运行中的进程\n\n在图 13-7 中，你可以看到 `top` 显示了你运行的一些进程，每行一个。以下列用于显示每个进程的信息：\n\
  \n![images](img/bull.jpg) **PID** 进程的 ID。\n![images](img/bull.jpg) **USER** 所有该进程的用户名称。\n\
  ![images](img/bull.jpg) **PR** 分配给进程的优先级。（我们将在本章稍后讨论进程优先级。）\n![images](img/bull.jpg)\
  \ **NI** 这是进程的 nice 值。（我们将在本章稍后讨论它的含义。）\n![images](img/bull.jpg) **VIRT** 进程使用的虚拟内存量。\n\
  ![images](img/bull.jpg) **RES** 进程使用的物理内存量（其驻留大小），单位为 KB。\n![images](img/bull.jpg)\
  \ **SHR** 进程使用的共享内存量。\n![images](img/bull.jpg) **S** 进程的状态。可能的值包括以下：\n\n![images](img/bull.jpg)\
  \ **D** 不可中断的睡眠\n![images](img/bull.jpg) **R** 运行\n![images](img/bull.jpg) **S**\
  \ 睡眠\n![images](img/bull.jpg) **T** 追踪或停止\n![images](img/bull.jpg) **Z** 僵尸状态\n\n\
  ***\n\n![Images](img/note.jpg)\n\n**注意** 僵尸进程是指已经执行完毕并退出，但其父进程没有收到其已完成的通知且没有释放子进程\
  \ PID 的进程。僵尸进程可能会自行清除。如果没有清除，你可能需要手动杀死父进程。我们将在本章稍后讨论如何这样做。\n\n![images](img/bull.jpg)\
  \ **%CPU** 进程使用的 CPU 时间百分比。\n![images](img/bull.jpg) **%MEM** 进程占用的可用物理内存百分比。\n\
  ![images](img/bull.jpg) **TIME+** 进程启动以来消耗的 CPU 时间总量。\n![images](img/bull.jpg) **COMMAND**\
  \ 用于启动进程输入的命令名称。\n\n我非常喜欢 `top` 的一点在于它是动态的。屏幕不断更新，以反映每个进程的最新信息。你还可以对信息进行排序。在 `top`\
  \ 运行时按下 `H`，可以显示帮助屏幕，该屏幕提供了按特定类别排序所需的按键。此帮助屏幕显示在图 13-8。\n\n![Images](img/f0469-01.jpg)\n\
  \n**图 13-8** 查看 top 帮助屏幕\n\n此屏幕还显示了如何使用 `top` 的其他选项。例如，你可以按下 `F` 显示可以添加到显示中的列列表，如图\
  \ 13-9 所示。\n\n![Images](img/f0470-01.jpg)\n\n**图 13-9** 在 top 显示中添加列\n\n将显示的字段将用星号\
  \ (*) 标出。要添加或删除字段，只需箭头指向它并按下 `SPACEBAR`。这将切换星号的开启或关闭，以决定是否显示该字段。你也可以按下 `U` 指定仅显示特定用户的进程。\n\
  \n我很喜欢 `top`。我不喜欢它的唯一一点是它显示有限数量的进程。有时你需要看到系统上运行的所有内容。在这种情况下，`top` 就不够用了。你需要使用 `ps`\
  \ 实用程序。\n\n### 使用 ps\n\n`ps` 实用程序可显示系统上运行的进程。与动态显示进程的 `top` 不同，`ps` 显示当前运行进程的快照。\n\
  \n只需输入 `ps`，你就可以查看与当前* shell 关联的进程，如下所示：\n\n![Images](img/p0470-01.jpg)\n\n在此示例中，`ps`\
  \ 显示了以下进程：\n\n![images](img/bull.jpg) **su** 此 shell 正在使用 `su` 实用程序切换到 root 用户账户。\n\
  ![images](img/bull.jpg) **bash** 当前的 `bash` shell 会话。\n![images](img/bull.jpg) **ps**\
  \ 因为在使用 `ps` 来列出当前进程，所以它的进程也被列出。\n\n注意默认显示了以下信息：\n\n![images](img/bull.jpg) **PID**\
  \ 进程的 ID。\n![images](img/bull.jpg) **TTY** 进程运行所在的终端会话（shell）名称。\n![images](img/bull.jpg)\
  \ **TIME** 进程使用的 CPU 时间。\n![images](img/bull.jpg) **CMD** 用于启动进程输入的命令名称。\n\n\n\n\
  \n\n![images](img/bull.jpg) `NI` 进程的 nice 值（nice value）。我们将在下一节讨论它的含义。\n\n![images](img/bull.jpg)\
  \ `ADDR` 进程的内存地址。\n\n![images](img/bull.jpg) `SZ` 进程的大小。\n\n![images](img/bull.jpg)\
  \ `WCHAN` 进程睡眠时的内核函数名称。如果进程正在运行，在该列中将显示破折号（–）。\n\n### 使用 free\n\n管理 Linux 系统上的进程工作之一是了解使用了多少内存以及还有多少可用内存。正如我们之前讨论的，你可以使用\
  \ `top` 的输出来查看这些信息。\n\n你也可以使用 `free` 命令来实现此目的。`free` 命令显示系统中空闲和分配的 RAM 以及交换内存（swap）量。你可以使用\
  \ `-m` 选项以兆字节（MB）为单位显示内存统计。你还可以使用 `-t` 选项显示各类信息的总计。在接下来的示例中，执行了 `free -mt` 命令来查看内存统计：\n\
  \n![Images](img/p0473-01.jpg)\n\n### 使用 pgrep\n\n`ps` 命令对于查看进程信息非常有用。然而，有时 `ps`\
  \ 的输出可能会让人无从从，尤其是当你只想寻找一两个特定的进程时。管理 `ps` 输出量的一种方法是将输出管道给 `grep` 命令，并只显示符合你指定标准的结果。\n\
  \n此此另一种方法是使用 `pgrep` 命令。正如其名称所示，`pgrep` 将 `ps` 和 `grep`的功能合并到一个单一工具中。当你运行 `pgrep`\
  \ 时，你会指定想要查找的特定筛选标准。然后该命令会搜索所有当前运行的进程，并输出符合你指定标准的进程列表。你可以使用以下 `pgrep` 选项来创建筛选标准：\n\
  \n![images](img/bull.jpg) `-P ppid` 匹配指定的父进程 ID（PID）。\n\n![images](img/bull.jpg)\
  \ `-f name` 匹配指定的进程名。\n\n![images](img/bull.jpg) `-u user_name` 匹配指定的进程所有。\n\n请注意，默认情况下\
  \ `pgrep` 的输出仅列出匹配进程的 PID。如果你想同时查看进程名称及其 PID，请配合 `pgrep` 命令使用 `-l` 选项。例如，如果你想查看所有由\
  \ root 用户拥有的进程列表，你应该使用以下命令：\n\n![Images](img/p0473-02.jpg)\n\n现在你已经知道如何查看运行中的进程，我们需要讨论如何对系统上运行的进程进行优先级排序。让我们接下来这个问题。\n\
  \n#### 进程优先级排序\n\n回想本章的第一部分，Linux 是一个多任务操作系统。它在系统中运行的每个进程之间轮换 CPU 时间，营造出所有进程都在并发运行的错觉。\n\
  \n由于 Linux 是多任务操作系统，你可以为每个进程指定优先级级别。这样做决定了给定进程相对于系统上其他进程可以获得多少 CPU 时间。\n\n默认情况下，Linux\
  \ 尝试为系统上的所有进程提供等量的 CPU 时间。但是，有时你可能需要调整分配给进程的优先级。根据系统的部署情况，你可能希望某个进程比其他进程具有更高的优先级。可以使用几种\
  \ Linux 工具来实现。在本章的这部分，我们将回顾以下内容：\n\n![images](img/bull.jpg) 使用 nice 设置优先级\n\n![images](img/bull.jpg)\
  \ 使用 renice 设置运行进程的优先级\n\n让我们从学习如何使用 `nice` 工具开始。\n\n### 使用 nice 设置优先级\n\n在 Linux\
  \ 上，可以使用 `nice` 工具以不同的优先级级别启动程序。回想我们之前对 `top` 和 `ps` 的讨论，系统上运行的每个进程都有与其相关的 `PR`\
  \ 和 `NI` 值。这在图 13-10 中显示。\n\n![Images](img/f0474-01.jpg)\n\n**图 13-10** 查看 PR 和\
  \ NI 值\n\n`PR` 值是进程的内核优先级。数字越大，进程的优先级越低；数字越小，优先级越高。`NI` 值是进程的 nice 值。nice 值被纳入确定进程优先级的内核计算中。任何\
  \ Linux 进程的 nice 值都在 –20 到 +19 之间。nice 值越低，进程的优先级越高。\n\n你不能直接操作进程的优先级，但你可以操作进程的\
  \ nice 值。做到此最简单的方法是在最初运行启动进程的命令时设置 nice 值。这是通过使用 `nice` 命令实现的。使用 nice 的语法是 `nice\
  \ -n nice_level command`。\n\n例如，假设我想启动 `vi` 程序，并通过将其 nice 水平降低到 –5 来提高它在系统上的优先级。在此之前，`vi`\
  \ 在我的系统上运行的优先级为 80，例所示：\n\n![Images](img/p0475-01.jpg)\n\n注意 `vi` 进程的默认 nice 水平为\
  \ 0。内核使用此值来计算进程的整体优先级，结果为 80。我可以在 shell 提示符处输入 `nice -n -15 vi` 将此进程的优先级级别调整到更高水平。这样做之后，`vi`\
  \ 进程的优先级和 nice 值都会降低，从而提高它在系统上的优先级级别。如接下来的示例所示：\n\n![Images](img/p0475-02.jpg)\n\
  \n注意 nice 值被降低到了 –15。这导致进程的整体优先级降低到 65。\n\n请注意，Linux 不倾向于允许你降低系统上运行进程的 nice 值。由于\
  \ Linux 是一个真正的多用户操作系统，同一系统上的多个用户可能调整他们自己的进程的 nice 值。自然地，系统上的每个用户都认为自己的进程比任何人的都重要得多，并可能被将他们运行的几乎每项任务的\
  \ nice 值调到 –20。\n\n为了防止这种情况发生，除非你以 root 身份登录，否则 Linux 不允许你将进程的 nice 值调整到 0 以下。基本上，如果你不是\
  \ root，你将不允许在 `nice` 命令中使用负数。\n\n`nice` 命令在运行启动进程的命令时修改 nice 值非常好。但如果你想修改的进程已经在运行，该怎么办？在这种情况下，你不能使用\
  \ `nice`。你必须使用 `renice` 命令。让我们接着讨论 `renice` 是如何工作的。\n\n### 使用 renice 设置运行进程的优先级\n\
  \n与其杀死进程并使用 `nice` 重启它来设置 nice 值，你可以使用 `renice` 命令调整当前正在运行进程的 nice 值。使用此命令的语法是 `renice\
  \ nice_value PID`。\n\n例如，在上一个示例中，`vi` 进程的 PID 是 8488。如果我想在不卸载程序的情况下将 `vi` 进程的优先级调整到较低级别，我可以在\
  \ shell 提示符处输入 `renice 4 8488`，如下：\n\n![Images](img/p0476-01.jpg)\n\n如示例所示，`vi`\
  \ 进程的 nice 值从 –15 增加到了 4。这导致进程的整体优先级从 65 变为 84，从而降低了进程的整体优先级级别。与 nice 一样，你必须以 root\
  \ 身份登录才能将运行中进程的 nice 值调整为负数。\n\n#### 管理前台和后台进程\n\n在本章的这部分中，我们需要讨论在前台和后台运行进程。我们将介绍以下主题：\n\
  \n![images](img/bull.jpg) 在后台运行进程\n\n\n\n\n\n![images](img/bull.jpg) 在后台和前台之间切换进程\n\
  \n## 在后台运行进程\n\n回想我们之前对进程的讨论，当你在 shell 提示符处输入任何命令时，会创建一个子 shell（subshell）并在其中运行进程。一旦进程退出，子\
  \ shell 就会被毁。在进程运行期间，父 shell 的 shell 提示符会消失。除非打开新的终端会话，否则你无法在 shell 提示符处进行任何操作。\n\
  \n这是因为进程在`foreground`运行。当从 shell 提示符运行图形化应用程序时，这种行为变得更加明显。在图 13-11 中，通过 `libreoffice`\
  \ 命令从 shell 提示符启动了 LibreOffice 应用。\n\n![Images](img/f0477-01.jpg)\n\n**图 13-11**\
  \  在前台启动图形化应用程序\n\n注意图 13-11，shell 中的光标是不可用的。在 Libre-Office 关闭之前，它将一直保持这种状态。只有在此之后，才能在该\
  \ shell 提示符处输入额外的命令。\n\n这是在 shell 提示符处输入的所有命令的默认行为，无论该程序是基于文本的 shell 程序还是图形程序。然而，可以在`background`运行程序。如果你这样做，你启动的程序将正常运行，但控制权将立即返回给\
  \ shell。然后可以使用 shell 启动其他程序或执行其他 shell 任务。\n\n在后台运行程序非常简单。你只需要在命令末尾添加一个安符（`&`）字符。这告诉\
  \ shell 在后台运行该程序。在图 13-12 中，再次启动了 LibreOffice 应用。然而，这次在命令末尾添加了安符，导致它在后台运行。\n\n![Images](img/f0477-02.jpg)\n\
  \n**图 13-12**  在后台运行应用程序\n\n注意图 13-12，在进程于后台运行后，屏幕上显示两个值。第一个值 [1] 是分配给该后台作业的后台作业\
  \ ID（job ID）。第二个值是进程的 `PID`。你可以通过在 shell 提示符处输入 `jobs` 查看查看系统中运行的所有后台作业，如下：\n\n\
  ![Images](img/p0478-01.jpg)\n\n在这个示例中，`jobs` 命令的输出显示了作业的状态以及创建后台作业的命令名称。接下来我们讨论如何将作业从后台移动到前台，反之亦然。\n\
  \n## 在后台和前台之间切换进程\n\n仅仅因为进程是在后台或前台启动的，并不意味着它必须停留在那里。你可以在进程运行时在前台和后台之间切换进程。可以使用以下命令实现此操作：\n\
  \n![images](img/bull.jpg) `fg`  此命令将后台进程移动到前台。语法为 `fg job_ID`。\n\n![images](img/bull.jpg)\
  \ `bg`  此命令将前台进程移动到后台。要使用此工具，你必须先为前台作业分配一个后台作业 ID。这是通过按下 `CTRL-Z` 完成的。这样做时，你会看到进程停止并为该进程分配了一个后台作业\
  \ ID。然后你可以输入 `bg job_ID` 将进程移动到后台。\n\n在下一个示例中，按照正常流程将 `vi` 程序加载到前台。然后使用 `CTRL-Z`\
  \ 将其停止，并被分配了作业 ID 1。然后使用 `bg 1` 命令将其发送到后台。\n\n![Images](img/p0478-02.jpg)\n\n接下来我们讨论如何杀死运行中的进程。\n\
  \n### 结束运行中的进程\n\n到本章目前为止，我们几乎做了你能想到的对 Linux 系统进程进行的一切。我们加载了它们、查看了它们、设置了优先级，并将它们移动到后台和前台。我们尚未涵盖的任务是如何结束在系统中运行的进程。\n\
  \n通常，你使用编码在几乎所有程序中的 `exit` 函数来结束运行中的进程。例如，在 `vi` 中输入 `:exit` 来退出编辑器并结束其进程。然而，有时进程会挂起，无论你做什么都无法让它们正常关闭。在这种情况下，你可能需要手动杀死挂起的进程。这可以通过两种方式完成：\n\
  \n![images](img/bull.jpg) 使用 `kill` 和 `killall`\n\n![images](img/bull.jpg) 使用 `pkill`\n\
  \n让我们先看看使用 `kill` 命令。\n\n### 使用 kill 和 killall\n\n`kill` 命令用于终止进程。使用 `kill` 的语法为\
  \ `kill –signal PID`。`PID` 参数是你想要杀死的进程的 PID。你也可以向进程发送特定的 kill 信号。这是我喜欢 `kill` 的特点之一。你实际上有大约\
  \ 64 种不同的 kill 信号可以发送给进程。以下是最实用的：\n\n![images](img/bull.jpg) `SIGHUP`  这是 kill 信号\
  \ 1。这是 kill 信号 1。\n\n![images](img/bull.jpg) `SIGTERM`  这是 kill 信号 15。这是 kill 信号\
  \ 15。\n\n![images](img/bull.jpg) `SIGINT`  这是 kill 信号 2。这是 kill 信号 2。\n\n![images](img/bull.jpg)\
  \ `SIGKILL`  这是 kill 信号 9。这是 kill 信号 9。\n\n在使用 `kill` 时，你可以使用信号的文本（例如 `SIGTERM`），也可以使用信号的数字（例如\
  \ 15）。你首先需要使用 `ps` 或 `top` 来识别进程的 PID。在这里，例如，vi 进程运行的 PID 为：\n\n![Images](img/p0479-01.jpg)\n\
  \n在这个示例中，我输入了 `kill –SIGTERM 8312` 来杀死 vi 进程。我也可以输入 `kill –15 8312` 完成相同的任务。因为 SIGTERM\
  \ 信号允许进程在退出前释放资源，因此 vi 进程干净地结束了。\n\n这提到了我看到许多新 Linux 管理员在用 `kill` 时会犯的错误。他们经常在尝试较轻的信号之前就“直击要害”。是的，使用\
  \ `SIGKILL` 会起作用，但最好先尝试其他更干净的信号。如果你遇到需要被杀死的挂起进程，我建议你使用以下序列：\n\n1. 首先发送 `SIGINT`。如果它没有响应，则继续第\
  \ 2 步。\n2. 发送 `SIGTERM`。通常，这将解决问题并允许进程干净地退出。如果没有，则继续第 3 步。\n3. 发送 `SIGKILL`。\n\n\
  除了 `kill` 之外，你还可以使用 `killall` 来杀死进程。`killall` 命令与 `kill` 命令非常相似。语法几乎相同。关键区别在于 `killall`\
  \ 使用要杀死的进程的命令名称 own 其 PID。例如，如果我想用 `killall` 而不是 `kill` 来杀死上例中的 vi 进程，我会输入 `killall\
  \ –15 vi`。此命令向名为 vi 的进程发送 SIGTERM 信号。\n\n我强烈建议你花时间查看 `killall` 的 man 页。它非常详尽，包含了极佳的信息。例如，它将向你展示如何在\
  \ `killall` 中使用 `–u` 选项来结束特定用户拥有的进程。\n\n\n\n\n\n### 使用 pkill\n\n除了 `kill` 和 `killall`\
  \ 之外，你还可以使用 `pkill` 命令来停止运行中的进程。`pkill` 命令是我们之前看过的 `pgrep` 命令的兄弟命令。事实上，它们使用完全相同的选项，甚至共享同一个帮助页（man\
  \ page）。\n\n通过 `pkill`，你可以搜索符合你指定的搜索标准的进程，然后向它们发送特定的杀死信号。例如，假设我想在所有运行的进程中搜索名为“vi”的进程，然后向它们发送\
  \ `SIGTERM` 信号。为了实现这一点，我会在 shell 提示符下输入 `pkill -SIGTERM -f vi`。\n\n## 退出后保持进程运行\n\
  \n在这个目标中，我们将最后一个最后一个是如何在退出系统后保持你启动的进程继续运行。正如我们之前讨论过的，可以向运行中的进程发送信号，以指示发生了系统事件且进程需要响应。\n\
  \n一个非常常用的信号是挂断信号（`SIGHUP`）。正如我们在本章之前讨论过的，Linux 会跟踪哪些进程是由哪个终端会话运行的。当用户退出终端会话时，Linux\
  \ 会向与该会话相关的所有程序发送 `SIGHUP` 信号。\n\n通常，每个进程在接收到 `SIGHUP` 时会按预期做出响应。然而，也可以告诉进程忽略 `SIGHUP`\
  \ 信号，这将允许它即使在你退出 shell 会话后仍保持运行。这是通过使用 `nohup` 工具来运行程序来实现的。这会导致命令创建的进程忽略所有 `SIGHUP`\
  \ 信号。\n\n例如，假设你创建了一个名为 `updatemydb` 的 shell 脚本，它可以自动根据外部数据源的信息更新数据库。该脚本运行需要很长时间（通常是一夜），而你不希望在它运行时保持系统登录状态。你可以在\
  \ shell 提示符下输入 `nohup updatemydb &` 然后退出。如果命令产生了通常发送到 `stdout` 的输出，`nohup` 将将输出重定向到\
  \ `~/nohup.out` 文件。\n\n需要注意的是，在 `nohup` 下运行的命令仅对 `SIGHUP` 信号免疫。所有其他 kill 信号仍然有效。例如，你可以使用\
  \ `kill` 命令配合 `SIGTERM` 信号在程序运行时将其终止。\n\n你可以使用的另一个类似命令是 `screen` 命令。`screen` 命令是一个非常有用的工具，特别是当你通过\
  \ `SSH` 连接远程访问 Linux 系统时。`screen` 的主要优势在于它允许你在单个 `SSH` 会话中使用多个 shell 窗口。例如，假设你在\
  \ `SSH` 会话中远程运行 `top`。由于 `SSH` 客户端的工作方式，在 `top` 停止并让你回到 shell 提示符之前，你无法输入任何其他命令，除非打开了多个\
  \ `SSH` 会话。\n\n然而，使用 `screen`，你可以在通过 `SSH` 连接访问 shell 提示符并输入额外命令的同时，保持 `top` 运行。这特别有用，因为即使网络中断，它可以保持\
  \ `SSH` shell 活跃。你甚至可以使用 `screen` 从多个位置断开并重新连接到 shell 会话，而无需停止并重启你正在工作的任何进程。\n\n\
  在使用 `screen` 之前，你首先需要确保系统上已经安装了它。大多数发行版默认都包含了它，但有些没有。\n\n一旦安装了 `screen`，你只需在 shell\
  \ 提示符下输入 `screen` 即可运行它。当你这样做时，会显示带有许可和使用信息的启动屏幕，你必须浏览这些信息。完成后，你将看到显示的 shell 提示符。它看起来没有区别。但它是不同的，因为你现在处于\
  \ `screen` 内部的一个窗口中。这个窗口的功能就像普通的 shell 会话一样。你可以像从任何其他 shell 提示符一样运行命令并与程序进行交互。\n\
  \n然而，如果你按下 `CTRL-A`，那么你之后输入的任何内容都将发送给 `screen` 命令而不是 shell。以下是一些示例：\n\n![images](img/bull.jpg)\
  \ 按 `CTRL-A` 然后按 `?` 会显示屏幕帮助。\n\n![images](img/bull.jpg) 按 `CTRL-A` 然后按 `C` 会创建一个新的\
  \ screen 窗口。你正在工作的旧窗口仍然保持活动，以及其中运行的任何进程也保持运行。例如，假设你在 `SSH` 会话的 screen 窗口中运行了 `top`。你需要检查邮件，但不想停止运行\
  \ `top`。为了实现这一点，你可以打开一个新窗口并访问邮件。在你操作时，`top` 保持在第一个窗口中运行。\n\n![images](img/bull.jpg)\
  \ 按 `CTRL-A` 然后按 `N` 在 `screen` 中打开的窗口之间切换。\n\n![images](img/bull.jpg) 按 `CTRL-A`\
  \ 然后按 `D` 会分离你的 screen 窗口并让你回到原始 shell 提示符。然而，你在窗口中运行的所有内容仍保持运行。事实上，你可以完全注销服务器，一切将在分离的窗口内继续运行。\n\
  \n![images](img/bull.jpg) 输入 `screen -r` 会让你重新连接到已分离的 screen 窗口。如果你有多个分离的 screen\
  \ 窗口，系统将提示你指定想要重新连接到哪一个。\n\n让我们在下面的练习中练习处理 Linux 进程。\n\n# 练习 13-1：Linux 进程的操作\n\n\
  在此练习中，你将练习使用 shell 命令管理系统上运行的进程。你可以使用书中附带的虚拟机进行此练习。运行快照 13-1 以获得配置正确的环境。\n\n***\n\
  \n![Images](img/viedo.jpg)\n\n**视频** 请观看 [练习 13-1] 获取如何执行此任务的演示。\n\n完成以下操作：\n\n\
  1. 启动你的 Linux 系统并以标准用户身份登录。\n2. 打开终端会话。\n3. 通过输入 `su -` 后接密码 `student` 切换到你的 root\
  \ 账户。\n4. 通过以下步骤练习启动系统进程：\n    a. 在 shell 提示符下，输入 `systemctl status atd`。你的守护进程状态是什么？（对于大多数发行版，atd\
  \ 守护进程默认未配置运行。）\n    b. 在 shell 提示符输入 `systemctl start atd` 启动 atd 守护进程。\n    c.\
  \ 再次在 shell 提示符下输入 `systemctl status atd`。现在 atd 服务应该显示为运行。\n5. 通过以下步骤练习使用 `top`：\n\
  \    a. 在 shell 提示符下输入 `top`。\n    b. 查看运行中的进程。\n    c. 按 `H` 进入顶部屏幕。哪个按键可以按 CPU\
  \ 统计数据排序显示？\n    d. 按 `T` 按 CPU 统计数据排序显示。你的系统中哪些进程占用最多的 CPU？\n    e. 按 `M` 按内存使用排序显示。哪些进程占用最多的内存？\n\
  \    f. 按 `F` 添加列。\n    g. 按 `B` 然后按空格键将 PPID 列添加到显示中。你现在应该看到每个进程的 PPID 已添加到显示中。\n\
  \    h. 按 `Q` 退出 top。\n6. 通过以下步骤练习使用 `ps` 工具查看进程：\n    a. 在 shell 提示符下输入 `ps`。哪些进程与当前\
  \ shell 会话相关？\n    b. 在 shell 提示符下输入 `ps -ef | more` 查看系统上所有运行的进程。\n    c. 不断按空格键找到\
  \ atd 服务。atd 在哪个用户名下运行？（在大多数发行版中，它应该在 `at` 用户下运行。）\n    d. 在 shell 提示符下输入 `ps -el\
  \ | less`。\n    e. 定位到状态 (S) 列。\n    f. 不断按空格键找到 atd 服务。该状态是什么？（由于目前没有使用，它可能处于睡眠状态。）\n\
  7. 通过完成以下操作管理进程优先级：\n    a. 在 shell 提示符下，输入 `top`。\n\n\n\n\n**b.** 与 top 进程关联的优先级\
  \ (PR) 和 nice 值 (NI) 分别是多少？（对于大多数发行版，这些值应该是 16 和 0。）\n\n**c.** 按 `Q` 停止 top 进程。\n\
  \n**d.** 在 shell 提示符处输入 `nice –n –20 top`。现在 top 进程的 PR 和 NI 值分别是多少？\n\n**e.** 记录\
  \ top 进程的 `PID`。\n\n**f.** 打开一个新的终端窗口并 `su` 切换到 root。\n\n**g.** 在 shell 提示符处，通过输入\
  \ `renice 1 *top_PID*` 在 top 进程运行时调整其 nice 值。\n\n**h.** 切换回运行 top 的第一个终端会话。现在它的\
  \ PR 和 NI 值是多少？\n\n**i.** 按 `Q` 退出 top。\n\n**8.** 通过以下步骤练习在前台和后台之间切换进程：\n\n**a.**\
  \ 在 shell 提示符处输入 `top` 重新加载 top。\n\n**b.** 在运行 top 的终端中，按 `CTRL-Z`。\n\n**c.** 记录分配给该进程的后台作业\
  \ ID。\n\n**d.** 在 shell 提示符处输入 `bg *background_job_ID*`。当进程在后台运行时，top 的输出会消失。\n\n\
  **e.** 按 `CTRL-C`。\n\n**f.** 在 shell 提示符处输入 `fg *background_job_ID*`。由于进程在前台运行，top\
  \ 的输出将重新出现。\n\n**9.** 完成以下操作练习杀死进程：\n\n**a.** 确保 top 仍在运行。\n\n**b.** 切换到你以 root\
  \ 登录的另一个终端会话。\n\n**c.** 在 shell 提示符处输入 `ps –e | grep top`。\n\n**d.** 记录 top 进程的\
  \ `PID`。\n\n**e.** 在 shell 提示符处输入 `kill –SIGTERM *top_PID*`。\n\n**f.** 切换回运行 top\
  \ 的终端会话。验证 top 已经退出。\n\n**g.** 在 shell 提示符处重新加载 `top`。\n\n**h.** 切换回你以 root 登录的另一个终端会话。\n\
  \n**i.** 输入 `killall –15 top` 杀死 top 进程。\n\n**j.** 切换回你的第一个终端窗口并验证 top 已经退出。\n\n\
  **10.** 通过以下步骤练习使用 screen：\n\n**a.** 如必要，输入 `exit` 回到你的标准用户账户。\n\n**b.** 按 `ENTER`\
  \ 退出启动界面。\n\n**c.** 在 screen 窗口的 shell 提示符处输入 `top`。\n\n**d.** 按 `CTRL-A` 然后按 `C`\
  \ 创建新窗口。\n\n**e.** 在新窗口的 shell 提示符处输入 `pgrep –l –f top`。top 应该仍在运行并显示其 `PID`。\n\n\
  **f.** 按 `CTRL-A` 然后按 `N`。你应该切换回运行 top 的窗口。\n\n**g.** 按 `CTRL-A` 然后按 `D` 分离当前窗口。\n\
  \n**h.** 在 shell 提示符处输入 `screen –r` 重新连接到运行 top 的窗口。你应该能再次看到 top 窗口。\n\n**i.** 按\
  \ `ESC` 退出 top，然后输入 `exit` 退出 screen。\n\n是时候进行质的飞跃并变换话题了！接下来我们需要讨论如何在你的 Linux 系统上调度进程。\n\
  \n## 调度进程\n\n到本章为止，你已经学习了如何从 shell 提示符在 Linux 系统上执行和管理进程。然而，在很多情况下，你可能需要进程在没有你干预的情况下自动运行。备份就是一个很好的例子。备份的关键问题之一不是系统管理员执行得不正确，而是他们完全忘记执行了！在备份策略中，你能做的糟糕的事情之一就是依赖人类来记住运行它们。\n\
  \n相反，你可以配置 Linux 系统为你自动运行程序。这消除了公式中的人为因素，并确保指定的程序定期且按时执行。可以使用两个关键工具来调度未来运行的进程。我们将在本章的这部分讨论：\n\
  \n![images](img/bull.jpg) 使用 at 守护\n\n![images](img/bull.jpg) 使用 cron 守护\n\n![images](img/bull.jpg)\
  \ 使用 anacron\n\n让我们从学习如何使用 at 守护开始。\n\n#### 使用 at 守护\n\n使用 `at` 是调度进程在未来某个时间运行一次极极方法。`at`\
  \ 服务是一个系统守护（称为 `atd`），它在你的系统后台运行。大多数 Linux 发行版在初始安装系统时为你安装了此服务。如果没有，你可能需要使用 `rpm`\
  \ 工具从安装存储库手动安装它。\n\n如果你的发行版使用 `init`，那么用于启动 `atd` 守护的启动脚本位于你的 init 脚本目录，根据你的具体发行版，它应该是\
  \ `/etc/init.d` 或 `/etc/rc.d/init.d`。脚本名称为 `atd`。\n\n在尝试使用 `at` 之前，你需要确保 `atd` 守护正在运行。你可以通过在\
  \ shell 提示符处输入 `rcatd start` 来实现。你也可以在 shell 提示符处输入文件的完整路径后跟 `start` 来完成相同任务。使用\
  \ `insserv` 或 `chkconfig` 命令确保 `atd` 守护会在启动时自动启动。\n\n如果你的发行版使用 `systemd` 而不是 `init`，你可以在\
  \ root 用户身份在 shell 提示符处通过输入 `systemctl start atd` 来启动 `atd` 守护。\n\n此时，你需要指定哪些用户可以创建\
  \ at 作业，哪些用户不能。这可以通过编辑以下文件来实现：\n\n![images](img/bull.jpg) `/etc/at.allow` 此文件中列出的用户允许创建\
  \ at 作业。\n\n![images](img/bull.jpg) `/etc/at.deny` 此文件中列出的用户不允许创建 at 作业。\n\n要使用\
  \ `at` 调度命令在未来时间运行，请完成以下操作：\n\n**1.** 在 shell 提示符处输入 `at *time*`。`at` 守护对于如何指定此命令中的\
  \ `time` 值非常灵活。请观察表 13-2 所示的语法。\n\n在你输入 `at` 命令和来自表 13-2 的时间值后，将显示 `at>` 提示符，如下：\n\
  \n![Images](img/p0486-01.jpg)\n\n**2.** 在 `at>` 提示符处，输入你想让 `at` 为你运行的命令。重要的是，如果你的命令在\
  \ shell 提示符处显示输出，当 `at` 运行时，你将看不到输出。你有两种查看输出的不同选项。首先，如果你没有指定替代方案，`at` 将输出发送到你的本地用户账户。\n\
  \n或者，你也可以将输出重定向到文件。你之前已经学习过这一点。例如，如果你想在未来使用 `at` 运行 `tail /log`，你可以在 `at>` 提示符处输入\
  \ `~/atoutput.txt` 将命令输出发送到主目录下名为 `atoutput.txt` 的文件。\n\n**3.** 如果你想添加额外的命令，按 `ENTER`。你可以在同一个作业中运行多个命令。每个命令应单独占一行。\n\
  \n**4.** 当你完成命令输入后，按 `CTRL-D`。这样做，`at>` 提示符将消失，作业将被调度，并分配一个作业号，如下：\n\n![Images](img/p0486-02.jpg)\n\
  \n![Images](img/t01.jpg)\n\n**表 13-2** at 命令选项\n\n一旦你配置了作业，可以使用 `atq` 命令查看等待作业列表。如下：\n\
  \n![Images](img/p0486-03.jpg)\n\n如果你以普通用户登录，`atq` 命令将显示与当前用户相关的作业。如果你以 root 登录，`atq`\
  \ 将显示所有用户的作业。如果你需要从列表中删除等待作业，可以使用 `atrm *job_number*` 命令。\n\n\n\n`at` 守护进程非常棒；但它有一个致命缺点。它只能调度任务在未来的某个时刻运行一次。如果你只想让任务运行一次，这就不是问题。然而，在很多情况下，你可能希望任务按照定期计划在未来运行。例如，你可能需要每天在某个特定时间运行一个进程（如备份工具）。在这种情况下，`at`\
  \ 守护进程就显得不用了。你需要一个可以处理重复调的工具。\n\n`cron` 守护进程正可以做到这一点。与 `at` 不同，`cron` 可以按照你指定的计划运行命令。这是一个非常强大且实用的服务。我偶尔会使用\
  \ `at`，但 `cron` 是我一直都在使用的服务。事实上，如果没有它，我很难完成我的工作。我大多数客户的办公室离我的办公室有几英里路。如果每天跑遍为所有客户运行备份将耗费我所有的时间。当然，我不敢信任客户的管理人员来确保每天都进行备份。相反，我设置了\
  \ `cron` 守护进程来我执行备份。这样，我就知道备份是按照定期计划进行的，并且执行了创建备份的正确命令。\n\n在本章的这部分，我们将讨论以下内容：\n\n\
  ![images](img/bull.jpg) `cron` 如何工作\n\n![images](img/bull.jpg) 使用 `cron` 管理调度的系统任务\n\
  \n![images](img/bull.jpg) 使用 `cron` 管理调度的用户任务\n\n让我们从学习 `cron` 服务是如何工作的开始吧。\n\n\
  ### cron 如何工作\n\n`cron` 守护进程是一个在系统后台持续运行的服务，它每分钟检查一次一个名为 `crontab` 的特殊文件，以查看是否有它应该运行的调度任务。如果你的发行版使用\
  \ `init`，那么 `cron` 守护进程是通过你 `init` 目录下的 `cron` init 脚本管理的。如果你的发行版使用 `systemd`，你则使用\
  \ `systemctl` 命令来管理 `cron` 守护进程。\n\n在大多数 Linux 发行版中，`cron` 守护进程被配置为每次系统启动时自动运行。如果不是，你需要使用系统\
  \ `init` 目录中的 `cron` init 脚本手动启动它。\n\n你可以配置 `cron` 运行系统任务或用户特定的任务。让我们先谈谈运行系统任务。\n\
  \n### 使用 cron 管理调度的系统任务\n\n对于 Linux 系统管理员来说，使用 `cron` 运行调度的系统任务是一个极其实用的工具。你可以配置你的系统按照定期计划自动执行各种任务，从而为你节省大量的时间和精力。\n\
  \n还记得我提到过运行定期备份的问题吗？在 `cron` 中创建一个按定期计划运行备份的系统任务为我节省了大量时间。如果某天我没有时间访问客户现场，我就不必担心了。我知道\
  \ `cron` 会在预设时间运行备份。我需要做的只是抽空过去检查一下一切是否仍在正常工作，并可能轮换备份介质。我爱死 `cron` 了！\n\n要运行系统任务，`cron`\
  \ 服务使用下文所示的 `/etc/crontab` 文件来配置运行哪些任务：\n\n![Images](img/p0487-01.jpg)\n\n如此示例所示，`/etc/crontab`\
  \ 文件包含了运行四个不同目录中脚本的命令：\n\n![images](img/bull.jpg) `/etc/cron.hourly` 包含每小时运行一次的\
  \ cron 脚本\n\n![images](img/bull.jpg) `/etc/cron.daily` 包含每天运行一次的 cron 脚本\n\n![images](img/bull.jpg)\
  \ `/etc/cron.weekly` 包含每周运行一次的 cron 脚本\n\n![images](img/bull.jpg) `/etc/cron.monthly`\
  \ 包含每月运行一次的 cron 脚本\n\n在任何这些目录中找到的所有脚本都会由 `cron` 根据指定的计划自动运行。例如，`/etc/cron.daily`\
  \ 目录包含了各种脚本，用于每天清理一次系统并轮换日志。这些脚本显示在这里：\n\n![Images](img/p0488-01.jpg)\n\n如果你有一个需要在这四个计划之一运行的系统任务，你只需创建一个脚本文件，并将其复制到\
  \ `/etc` 中相应的 cron 目录中。\n\n然而，如果你的系统任务需要按照 cron 目录使用的四个计划之外的其他计划运行，该怎么办？没问题，`cron`\
  \ 守护进程会为你搞定。除了刚才介绍的四个目录外，`/etc/` 中还有一个名为 `cron.d` 的第五个目录。\n\n如果你需要系统任务按照自定义计划运行，可以在该目录下创建一个\
  \ `crontab` 文件，该文件将被 `cron` 守护进程读取并运行。\n\n如何创建 `crontab` 文件？它看起来很难，但其实并非如此。`crontab`\
  \ 文件本质上是一个文本文件，每个任务占用一行。每行有六个字段，用制表符分隔，详见表 13-3。\n\n![Images](img/t0488-01.jpg)\n\
  \n表 13-3 crontab 文件字段\n\n很多时候，你会在给定 crontab 文件的一个或多个字段中看到星号 (\\*)。这个通配符意味着“匹配所有”。\n\
  \n例如，假设我想在每月的每一天（周日除外），晚上 11:05 使用 `tar –cvf /media/usb/backup.tar /home` 命令运行 `tar`\
  \ 命令来备份 `/home` 目录。我可以在 `/etc/crontab.d` 中创建一个 `crontab` 文件并添加以下行：\n\n![Images](img/p0488-02.jpg)\n\
  \ncrontab 文件中的这一行指定了命令将在周一 (1) 到周六 (6) 的每月 (\\*) 的每天 (\\*) 晚上 11:00 (23) 之后 5 分钟运行。\n\
  \n* * *\n\n![Images](img/note.jpg) 注意 系统 cron 任务以 root 用户身份运行！\n\n除了系统 cron 任务，个人用户也可以创建自己的\
  \ cron 任务。让我们接下来回顾一下如何操作。\n\n### 使用 cron 管理调度的用户任务\n\n系统上的用户可以使用与其用户账户关联的 `crontab`\
  \ 文件创建他们自己的计划。与保存在 `/etc` 中的系统 crontab 文件不同，用户 crontab 文件存储在 `/var/spool/cron/tabs`\
  \ 中。如果用户创建了 `crontab` 文件，它将以该用户或用户的用户名保存在在该目录下。\n\n在继续之前，我应该指出，并不是所有的 Linux 系统管理员都希望允许用户这样做。如果允许用户创建自己的\
  \ crontab 文件并按计划运行程序会让你感到不安，你可以锁定系统以防止他们这样做。要做到这一点，你使用一种与处理 `at` 守护进程时类似的方法。\n\n\
  `cron` 守护进程在启动时会读取 `/etc/cron.allow` 和 `/etc/cron.deny` 文件，以确定谁可以、谁不能创建 crontab\
  \ 计划。默认情况下，会自动创建 `/etc/cron.deny` 文件，并且默认只对 guest 用户账户包含一个限制。所有其他用户都被允许创建 crontab\
  \ 文件来调度任务。如果你创建一个 `/etc/cron.allow` 文件，那么只有该文件中的用户才被允许创建 crontab 文件；其他人都被拒绝。\n\n\
  处理完这些，让我们讨论一下用户如何创建他们自己的 crontab 文件。要实现这一点，他们可以使用 `crontab –e` 命令。输入此命令后，将打开 vi\
  \ 编辑器并加载一个新的、空白的 crontab 文件。\n\n在该文件中，用户只需使用我们之前回顾过的语法，为他们想要运行的每个任务添加行。例如，在图 13-13\
  \ 中，`tar` 命令每天晚上 5:10 运行，将用户的家目录备份到名为 ~/homebak.tar 的文件中。\n\n![Images](img/f0489-01.jpg)\
  \ 图 13-13 创建用户 crontab 文件\n\n该文件使用标准的 vi 命令和按键进行编辑，这些你已经在本书早些学过了。（我告诉过你知道如何使用 vi\
  \ 会很有帮助的！）完成后，退出 vi 并保存文件。这样做之后，就会在 `/var/spool/cron/tabs` 中为用户创建一个 crontab 文件，如下一个示例所示。此外，cron\
  \ 服务会被重新加载，以便应用新配置。\n\n![Images](img/p0490-01.jpg)\n\n\n\n\n在本示例中，我使用了 `cat` 命令来查看\
  \ tux 用户的 crontab 文件。不过，你也可以使用 `crontab –l` 命令来显示当前用户的 crontab 文件。此外，你还可以使用 `crontab\
  \ –r` 命令来删除当前用户的 crontab 文件。\n\n让我们在下面的练习中练习 Linux 进程的操作。\n\n## 练习 13-2：调度 Linux\
  \ 进程\n\n在此练习中，你将练习使用 `cron` 和 `at` 命令来调度进程在未来运行于你的系统。你可以使用本书随附的虚拟机进行此练习。运行快照 13-2\
  \ 以获得配置正确的环境。\n\n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请收看 练习 13-2 视频，查看如何执行此任务的演示。\n\
  \n完成以下操作：\n\n**1.** 启动你的 Linux 系统并以标准用户身份登录。\n\n**2.** 打开终端会话。\n\n**3.** 输入 `su\
  \ –` 并输入密码 `student` 切换到 root 用户账户。\n\n**4.** 通过以下步骤练习使用 `at` 守护进程：\n\n**a.** 在\
  \ shell 提示符下输入 `systemctl status atd`。\n\n**b.** 验证 `at` 守护进程正在运行。如果没有运行，在 shell\
  \ 提示符下输入 `systemctl start atd`。\n\n**c.** 在 shell 提示符下输入 `at now +5 minutes`。\n\n\
  **d.** 在 `at` 提示符下，输入 `ps –ef > ~/psoutput.txt`。\n\n**e.** 按 CTRL-D。\n\n**f.** 输入\
  \ `atq` 生成等待中的 at 任务列表。你应该看到你刚刚创建的任务。\n\n**g.** 等待等待中的 at 任务完成。\n\n**h.** 使用 `cat`\
  \ 命令检查 `~/psoutput.txt` 文件，并验证 `ps` 命令的输出是否正确生成。\n\n**i.** 在 shell 提示符下输入 `at 2\
  \ pm tomorrow`。\n\n**j.** 在 `at` 提示符下，输入 `ps –ef > ~/psoutput.txt`。\n\n**k.** 按回车（ENTER）。\n\
  \n**l.** 按 CTRL-D。\n\n**m.** 输入 `atq` 生成等待中的 at 任务列表。你应该看到你刚刚创建的任务。记住它的任务号。\n\n\
  **n.** 输入 `atrm *job_number*` 删除等待中的任务。\n\n**o.** 再次输入 `atq`。等待中的任务应该消失了。\n\n**5.**\
  \ 完成以下操作练习使用 `cron`：\n\n**a.** 输入 `exit` 退出 root 用户账户。\n\n**b.** 在 shell 提示符下，输入\
  \ `crontab –e`。\n\n**c.** 按插入（INSERT）键。\n\n**d.** 输入以下内容配置系统，每天下午 5:05 为你的用户主目录创建备份：\n\
  \n```\n05   17   *   *   *   /bin/tar –cvf ~/mybackup.tar ~/\n```\n如果你不想等到下午 5:05，你也可以指定指定一个未来只有两三分钟的时间值。\n\
  \n**e.** 按 ESC 键。\n\n**f.** 输入 `:exit`。你应该会在屏幕上看到一条消息，指示已安装了新的 crontab。\n\n**g.**\
  \ 输入 `crontab –l` 并验证任务已正确创建。\n\n**h.** 等到你在 crontab 文件中指定的时间；然后检查你的用户主目录，并验证 `mybackup.tar`\
  \ 文件已创建。\n\n**i.** 在 shell 提示符下输入 `crontab –r` 删除你的用户 crontab 文件。\n\n### 使用 anacron\n\
  \n某些发行版使用 `anacron` 配合 `cron` 来自动化任务的运行。这两个服务的工作方式几乎相同。关键区别在于，`cron` 假设你的计算机系统每天\
  \ 24 小时、每周 7 天运行。对于某些系统（如服务器和桌面电脑）这很好，但对于其他系统则不然。例如，笔记本系统在每天某些时段可能是关闭或处于睡眠状态。如果在计划的\
  \ `cron` 任务运行时系统未开机，该任务将被跳过。\n\n`anacron` 服务尝试解决这个问题。如果向 `anacron` 中调度了一个任务，但系统处于关闭状态，那么错过的任务将在系统恢复后自动运行。\n\
  \n就像 `cron` 使用 `/etc/crontab` 文件一样，`anacron` 使用 `/etc/anacrontab` 文件。该文件使用以下字段：\n\
  \n```\nperiod   delay   job-identifier   command\n```\n\n第一个字段指定循环周期（以天为单位）。例如，你可以在此字段中使用以下任何值：\n\
  \n![images](img/bull.jpg) **1** 任务每天运行。\n\n![images](img/bull.jpg) **7** 任务每周运行。\n\
  \n![images](img/bull.jpg) **30** 任务每月运行。\n\n第二个字段指定了 `anacron` 在系统启动后执行被跳过的任务之前应等待的延迟（以分钟为单位）。\n\
  \n第三个字段包含任务标识符。这是将用于任务时间戳文件的名称，并且对于每个 `anacron` 任务必须是唯一的。该文件创建在 `/var/spool/anacron`\
  \ 目录下，包含单行时间戳，指示该特定任务上次运行的时间。第四个字段指定了应该运行的命令或脚本。\n\n考虑以下示例，其中 `anacron` 被配置为每天运行一次\
  \ `/usr/bin/updatedb.sh` 脚本。如果在 `anacron` 任务应该运行时系统处于关闭状态，则脚本将在系统恢复 30 分钟后执行。\n\n\
  ![Images](img/p0492-01.jpg)\n\n注意此文件没有指定任务运行的精确时间。这是通过 `/etc/anacrontab` 文件中的 `START_HOURS_RANGE`\
  \ 变量配置的。在下面的示例中，启动范围被设置为 3-22，指定了从凌晨 3 点到晚上 10 点的时间范围。\n\n![Images](img/p0492-02.jpg)\n\
  \n需要注意的是，`anacron` 还会你在 `anacrontab` 文件的第二个字段中指定的任何值基础上增加随机的分钟数。可以增加的分钟数受 `/etc/anacrontab`\
  \ 文件中 `RANDOM_DELAY` 变量的限制。\n\n\n\n\n随后，我们将注意力转向管理 Linux 进程。我们首先讨论了如何创建进程。用户进程通过在\
  \ shell 提示符处输入命令来创建。在使用 `init` 的发行版中，系统进程是通过运行系统 `init` 目录下的守护进程启动脚本创建的。某些发行版使用\
  \ System V init 脚本，存储在 `/etc/rc.d/init.d`。其他发行版使用 BSD init 脚本，存储在 `/etc/init.d`。使用\
  \ `systemd` 的发行版使用 `systemctl` 命令来启动和停止服务。\n\n## 查看运行进程\n我们接着讨论了如何查看运行中的进程。我们查看的第一个工具是\
  \ `top`。通过在 shell 提示符处输入 `top` 来加载它。在 `top` 运行时，你可以按 `H` 键查看帮助屏幕，该屏幕将显示如何按特定列进行排序，甚至向显示中添加数据列。\n\
  \n你还可以使用 `ps` 命令查看运行中的进程。默认情况下，`ps` 命令只显示与当前 shell 会话相关的运行进程。要查看所有运行进程，请对 `ps` 命令使用\
  \ `-e` 选项。你还可以配合 `ps` 使用 `-f` 和 `-l` 选项来查看扩展进程信息。我们还查看了 `pgrep` 命令，它可以根据你配置的一组标准来搜索特定进程。\n\
  \n## 进程优先级\n接下来，我们讨论了如何设置系统进程的优先级。进程的整体优先级受其 `nice` 值的很大影响。Nice 值范围从 –20 到 +19。`nice`\
  \ 值越低，进程的优先级越高。在进程加载时调整其 `nice` 值，你可以使用 `nice` 命令。语法为 `nice -n nice_value command`。除非你以\
  \ root 身份登录，否则无法使用低于 0 的 nice 值。你还可以在不卸载的情况下调整运行进程的 nice 值。这是通过使用 `renice` 命令完成的。语法为\
  \ `renice nice_value PID`。\n\n### 前台和后台进程\n然后我们讨论了如何在前台和后台运行进程。默认情况下，你从 shell 提示符启动的进程在前台运行。在这种情况下，shell\
  \ 提示符会被锁定，直到进程完成。你也可以在后台运行进程。在这种情况下，程序在运行，但在后台运行，且控制权返回到 shell 提示符，允许你运行额外的命令。这通过简单地在命令末尾附加\
  \ `&` 字符来实现。这样做，后台进程会被分配一个作业 ID。\n\n你可以通过在 shell 提示符处输入 `fg job_ID` 将后台运行的进程移动到前台。你也可以将前台进程移到后台。要这样做，先按\
  \ `CTRL-Z` 停止进程。该进程将被分配一个作业 ID。然后你可以输入 `bg job_ID` 将进程移动到后台。\n\n### 杀死进程\n最后，我们讨论了如何从\
  \ shell 提示符杀死运行中的进程。你可以使用 `kill` 命令或 `killall` 命令来实现。这两个命令都使用了多种 kill 信号。其中一些最有用的信号包括：\n\
  \n- `SIGHUP` (1)\n- `SIGINT` (2)\n- `SIGKILL` (9)\n- `SIGTERM` (15)\n\n`kill` 的语法为\
  \ `kill -signal PID`。`killall` 的语法为 `killall -signal process_name`。在处理挂起的进程时，在使用更强力的\
  \ kill 信号（如 `SIGKILL`）之前，你应该尝试攻击性较小的信号（如 `SIGINT` 和 `SIGTERM`）。`pkill` 命令也可以根据你配置的搜索标准来搜索并杀死特定进程。我还指出，你可以使用\
  \ `nohup` 命令运行进程，使其忽略用户注销时发送的 `SIGHUP` 信号。这允许进程在用户不再登录系统时仍继续运行。你还可以使用 `screen` 命令创建可以分离的窗口，这允许你注销但保持进程运行。\n\
  \n## 调度进程\n在章节的这一部分，我们转换了思路，讨论了如何调度进程在未来自动运行。如果你只需要进程在未来运行一次，可以使用 `at` 守护进程。在使用\
  \ `at` 之前，你需要确保系统上的 `atd` 守护进程正在运行。然后，你可以在 shell 提示符处输入 `at time`。时间值可以是固定时间（例如\
  \ `10:00`），也可以相对时间（例如 `tomorrow`）。随后你将看到一个 `at>` 提示符，可以在其中输入要运行的命令列表。完成后按 `CTRL-D`。你可以使用\
  \ `atq` 命令查看待处理的 `at` 作业列表。你还可以使用 `atrm` 命令删除待处理的 `at` 作业。\n\n如果你需要调度进程定期运行，则需要使用\
  \ `cron` 守护进程而不是 `at`。`cron` 守护进程可以运行系统作业或用户作业。系统 cron 作业通过将脚本文件添加到以下目录之一创建：\n\n\
  - `/etc/cron.hourly`\n- `/etc/cron.daily`\n- `/etc/cron.weekly`\n- `/etc/cron.monthly`\n\
  \n你还可以创建一个 `crontab` 文件并将其保存在 `/etc/cron.d` 目录。`crontab` 文件每个要运行的命令包含一行。每行包含六个字段：\n\
  \n1. 分钟\n2. 小时\n3. 日\n4. 月\n5. 星期\n6. 要运行的命令\n\n除了系统作业，你还可以使用 `cron` 创建用户作业。用户 cron\
  \ 作业存储在 `/var/spool/cron/tabs`。你可以通过在 shell 提示符处输入 `crontab -e` 创建 `crontab` 文件。然后你使用上述描述的语法为每个调度命令创建一行。创建\
  \ `crontab` 文件后，你可以使用 `crontab -l` 命令查看你的 `crontab` 文件。你还可以使用 `crontab -r` 命令删除你的\
  \ `crontab` 文件。\n\n除了 `cron`，你还可以使用 `anacron` 按计划自动运行作业。`anacron` 守护进程会跟踪那些应该运行但因为系统关机而未能运行的作业。它会在系统指定的延迟时间启动后运行它们。\n\
  \n## 加速复习\n\n- 每当你从 shell 提示符运行命令时，系统都会创建一个进程。\n- 当进程加载时，程序代码被加载到内存中并由 CPU 执行。\n\
  - Linux 是一个多任务操作系统。\n- 大 CPU 每次只能运行一个进程。\n- Linux 在加载到内存的多个进程之间切换 CPU 时间，使得 CPU\
  \ 正在并发处理多个进程。\n- 当 `init` 进程或 `systemd` 进程加载守护进程时，创建一个系统进程。\n- 当终端用户在 shell 提示符处输入命令时，创建一个用户进程。\n\
  - 用户进程与 shell 会话相关；系统进程则不然。\n- Linux 进程可以产生其他 Linux 进程。\n- 产生另一个进程的进程被称为“父进程”。\n\
  - 被第一个进程创建的新进程被称为“子进程”。\n- 每个 Linux 进程都有一个父进程。\n- 所有 Linux 进程都可以追溯到 `init` 进程或 `systemd`\
  \ 进程（取决于发行版），这是内核在系统启动时加载的第一个进程。\n- 每个 Linux 进程都会分配一个进程 ID (PID)，在系统上唯一标识该进程。\n\
  - 进程会被分配一个 `PPID` 值，其值为父进程的 `PID`。\n- 每当你从 shell 提示符运行命令时，都会创建一个子 shell 并在其中运行命令。\n\
  \n\n\n\n![images](img/bull.jpg) 当进程完成后，子壳将被销毁，控制权返回给原始 shell。\n\n![images](img/bull.jpg)\
  \ 当你在 shell 提示符输入命令时，会创建用户进程。\n\n![images](img/bull.jpg) 某些发行版使用 System V init 脚本，它们存储在\
  \ `/etc/rc.d/init.d`。\n\n![images](img/bull.jpg) 某些发行版使用 BSD init 脚本，它们存储在 `/etc/init.d`。\n\
  \n![images](img/bull.jpg) 对于使用 systemd 的发行版，你使用 `systemctl` 命令来启动和停止系统服务。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `top` 工具查看系统进程。通过在 shell 提示符输入 `top` 即可加载 `top`。\n\n![images](img/bull.jpg)\
  \ 在 `top` 运行时，你可以按 `H` 键查看帮助屏幕，屏幕将显示如何配置 `top` 显示的数据。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `ps` 命令查看正在运行的进程。\n\n![images](img/bull.jpg) 默认情况下，`ps` 命令只显示与当前 shell 会话相关的运行进程。\n\
  \n![images](img/bull.jpg) 你可以在 `ps` 命令中使用 `-e` 选项来查看所有正在运行的进程。\n\n![images](img/bull.jpg)\
  \ 你可以在 `ps` 中使用 `-f` 和 `-l` 选项来查看扩展进程信息。\n\n![images](img/bull.jpg) 你可以使用 `pgrep`\
  \ 命令搜索系统上运行的特定进程。\n\n![images](img/bull.jpg) Linux 允许你对系统上运行的进程进行优先级排序。\n\n![images](img/bull.jpg)\
  \ 进程的整体优先级受其 nice 值的极大影响。\n\n![images](img/bull.jpg) Nice 值的范围从 –20 到 +19。\n\n![images](img/bull.jpg)\
  \ nice 值越低，进程的优先级越高。\n\n![images](img/bull.jpg) 你可以使用 `nice` 命令在进程加载时调整其的 nice 值。\n\
  \n![images](img/bull.jpg) 要使用 `nice`，你需要输入 `nice -n nice_value command`。\n\n![images](img/bull.jpg)\
  \ 除非你以 root 身份登录，否则你无法分配低于 0 的 nice 值。\n\n![images](img/bull.jpg) 你也可以使用 `renice`\
  \ 命令在不卸载进程的情况下调整运行进程的 nice 值。\n\n![images](img/bull.jpg) 使用 `renice` 的语法为 `renice\
  \ nice_value PID`。\n\n![images](img/bull.jpg) 默认情况下，你从 shell 提示符启动的进程在前台运行。\n\n\
  ![images](img/bull.jpg) 前台进程会锁定 shell 提示符，直到进程完成。\n\n![images](img/bull.jpg) 你可以在后台运行\
  \ Linux 进程。\n\n![images](img/bull.jpg) 后台进程会将控制权返回给 shell 提示符。\n\n![images](img/bull.jpg)\
  \ 你可以在命令末尾添加 `&` 字符来在后台运行进程。\n\n![images](img/bull.jpg) 当你将进程加载到后台时，该进程会被分配一个作业\
  \ ID 。\n\n![images](img/bull.jpg) 你可以在 shell 提示符处输入 `fg job_ID` 将正在后台运行的进程移动到前台。\n\
  \n![images](img/bull.jpg) 你可以通过按 CTRL-Z 停止进程，然后输入 `bg job_ID` 将进程移动到后台，从而将前台进程移到后台。\n\
  \n![images](img/bull.jpg) 你可以使用 `kill` 或 `killall` 命令杀死正在运行的进程。\n\n![images](img/bull.jpg)\
  \ 有许多可以使用 `kill` 或 `killall` 发送的 kill 信号；最有用的包括：\n\n![images](img/bull.jpg) SIGHUP\
  \ (1)\n\n![images](img/bull.jpg) SIGINT (2)\n\n![images](img/bull.jpg) SIGKILL (9)\n\
  \n![images](img/bull.jpg) SIGTERM (15)\n\n![images](img/bull.jpg) 要用 `kill` 杀死进程，请在\
  \ shell 提示符输入 `kill -signal PID`。\n\n![images](img/bull.jpg) 要用 `killall` 杀死进程，输入\
  \ `killall -signal process_name`。\n\n![images](img/bull.jpg) 在尝试使用更强力的 kill 信号（如\
  \ SIGKILL）之前，你应该使用侵略性较小的 kill 信号，例如 `SIGINT` 和 `SIGTERM`。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `pkill` 命令根据配置的的标准搜索并杀死特定进程。\n\n![images](img/bull.jpg) 你可以使用 `nohup` 命令加载程序，使进程忽略用户注销时发送的\
  \ `SIGHUP` 命令，从而允许进程继续运行。\n\n![images](img/bull.jpg) 你可以使用 `screen` 命令创建可以分离的窗口，从而即使你注销了系统，进程也能继续运行。\n\
  \n![images](img/bull.jpg) 如果你只需要在在未来运行一次进程，你应该使用 `at` 守护进程。\n\n![images](img/bull.jpg)\
  \ 在使用 `at` 之前，你需要加载 `atd` 守护进程。\n\n![images](img/bull.jpg) 你可以通过 shell 提示符输入 `rcatd\
