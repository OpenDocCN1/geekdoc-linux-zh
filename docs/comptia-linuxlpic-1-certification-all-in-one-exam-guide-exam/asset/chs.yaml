  # 第 8 章\n## 管理 Linux 软件\n\n在本章中，你将学习：\n\n* 使用 RPM 管理软件\n* 从源代码安装软件\n* 管理 Debian\
  \ 软件包\n* 管理共享库\n\n作为一名 Linux 系统管理员，你需要了解如何在 Linux 系统上安装和管理软件。“哈！”你可能在想，“安装软件能有多难？我闭着眼都能在\
  \ Windows 上安装软件！”实际上，对于初接触该操作系统的用户来说，在 Linux 上安装软件可能具有一定的挑战性。并不是安装软件本身困难，而是对于不熟悉该系统的人来说如此。\n\
  \n### 使用 RPM 管理软件\n\n在 Linux 上安装软件时，我们实际上有两种选择：\n\nimages 安装预编译的软件包或服务\nimages 从源代码安装\n\
  \nimages 软件包包含了针对硬件架构和发行版的可执行文件。images 软件包包含了针对硬件架构和发行版的可执行文件。\n\n要从源代码安装软件，你必须系统中已经安装了编译器（如\
  \ `gcc`）。许多发行版（包括 openSUSE 和 Fedora）使用 Red 包管理器（RPM）来安装软件包。其他发行版（如 Ubuntu）使用 Debian\
  \ 软件包系统。\n\n无论你的发行版使用哪种包管理器，它们都执行相似的任务：\n\nimages 安装软件\nimages 更新已安装的软件\nimages\
  \ 卸载软件\nimages 查询已安装的软件\nimages 验证已安装软件的完整性\n\n为了跟踪所有这些信息，RPM 将有关软件包的信息存储在 RPM 数据库\
  \ `/var/lib/rpm` 中。每当你安装、更新或卸载软件包时，数据库都会创建一个相应的条目。\n\nImages\n\n**TIP** 我见过这个数据库文件损坏。真麻烦！如果你遇到这种情况，请在命令行提示符中使用\
  \ `rpm --rebuilddb` 命令重新构建 RPM 数据库。\n\n在本章的后续部分，我们将讨论：\n\nimages 使用 RPM 安装软件\nimages\
  \ 使用 RPM 管理已安装软件\nimages 使用 `yum` 安装 RPM 软件包\n\n\n\n\n在本章中，我们不会花大量时间来操作这些工具。这出于多种原因。首先，正如我们在书中讨论的大多数其他任务中一样，一个出色的\
  \ Linux 管理员需要知道如何从命令行管理软件。你真的需要理解图形化工具在“内部”到底发生了什么（这些工具通常只是命令行工具的图形化前端）。\n\n此外，大多数图形化管理工具只能管理软件*软件包**packages*）。你将在\
  \ Linux 系统上安装的许多程序需要从源代码包进行安装。这类程序必须经过解压缩和编译。执行此操作的唯一方法是从 shell 提示符进行。最后，LPIC-1/Linux+\
  \ 考试要求你掌握如何从 shell 提示符管理软件。\n\n与此，在本章的这一部分，我们将介绍使用 `RPM` 工具来安装软件。让我们来看以下主题：\n\n\
  ![images](img/bull.jpg) 获取 Linux 软件\n\n![images](img/bull.jpg) 安装软件包\n\n我们将首先从回顾可以从哪里为你的系统获取\
  \ Linux 软件开始。\n\n### 获取 Linux 软件\n\n我最喜欢 Linux 的点之一是，你可以从各种来源为系统获取丰富的软件，而且大多数费用很低或完全免费。在\
  \ Linux 早期，情况并非如此。事实上，早期阻止 Linux 广泛采用的一个巨大阻碍之一就是缺乏应用程序，特别是办公生产力应用。\n\n然而，今天这一切都改变了。你只需说你需要用\
  \ Linux 系统完成某个特定任务，可能就能某处找到可以处理该工作的应用程序或服务。\n\n那么，你可以从哪里获取 Linux 软件呢？正如我们在书中之前讨论过的，Linux\
  \ 开发模型违反了大多数公规范。在其他操作系统中，你通过访问本地电脑商店并购买所需程序的盒装来获取软件。许多供应商还允许你在线购买应用程序许可并下载副本。\n\n\
  但对于 Linux，这通常不是这样。你的大多数 Linux 软件是从其他来源获取的。让我们在这里来看几个。\n\n#### Linux 软件来源\n\n你可以从本地大型超市的电脑专区以外的各种来源获取适用于你\
  \ Linux 系统的软件。你应该注意的第一个来源（也是许多 Linux 用户忽略的来源）是你的发行版光盘。许多发行版都包含了你可以安装的海量应用程序和服务。例如，`openSUSE`\
  \ 安装光 DVD 其 `suse` 目录的子目录下包含了数百个应用程序和服务 `RPM` 包，如图 8-2 所示。\n\n![Images](img/f0266-01.jpg)\n\
  \n**图 8-2** 发行版 DVD 上的应用程序和服务\n\n除了发行版光盘，你还可以从互联网上的许多网站下载 Linux 系统的软件。大多数开源应用程序都有自己的网站，你可以在那里了解软件并下载最新版本。例如，你可以访问\
  \ [www.pureftpd.org](http://www.pureftpd.org) 来了解并下载 `pure-ftpd` 服务，它用于在你的 Linux\
  \ 系统上配置 FTP 服务。该网站如图 8-3 所示。\n\n![Images](img/f0267-01.jpg)\n\n**图 8-3** 从开源项目网站获取软件\n\
  \n除了个人项目网站，你还可以使用其他几个网站，它们在一个位置为你提供许多不同程序的链接。我最喜欢的之一是 [www.rpmfind.net](http://www.rpmfind.net)。该网站提供了一个\
  \ `RPM` 仓库，你可以搜索它来定位并下载适用于你 Linux 系统的 `RPM` 包。\n\nLinux 软件的另一个大来源是 `SourceForge`\
  \ ([`sourceforge.net`](http://sourceforge.net))。`Source-Forge` 网站是开源软件的中央仓库。截至本文编写日期，该网站上有数千种不同的程序可用。与\
  \ `rpmfind` 网站一样，你可以搜索 `SourceForge` 来定位并下载特定包。结果以链接的形式显示，允许你下载相应的程序。\n\n如你所见，你可以从这些网站下载你需要的任何东西。\n\
  \n对于某些发行版，你也可以直接访问发行版的官方网站并在那里下载包。例如，你可以访问 [`software.opensuse.org`](http://software.opensuse.org)\
  \ 并下载适用于你特定 `openSUSE` 版本的包。这如图 8-4 所示。\n\n![Images](img/f0268-01.jpg)\n\n**图 8-4**\
  \ 在 openSUSE 网站上搜索软件\n\n总结一下，有很多资源可供你获取软件，包括：\n\n![images](img/bull.jpg) 你的安装 CD\
  \ 或 DVD\n![images](img/bull.jpg) 开源网站\n![images](img/bull.jpg) [www.rpmfind.net](http://www.rpmfind.net)\n\
  ![images](img/bull.jpg) [sourceforge.net](http://sourceforge.net)\n![images](img/bull.jpg)\
  \ [www.freshmeat.net](http://www.freshmeat.net)\n![images](img/bull.jpg) [www.linux.org](http://www.linux.org)\n\
  \n要点是，你的系统上可以很容易获得软件。花点时间查看这些网站上的可用内容。你会庆幸自己这么做的！\n\n当你从这些网站下载软件时，应该检查下载内容并确保其没有损坏。让我们谈谈如何操作。\n\
  \n#### 验证你的下载内容\n\n大多数情况下，从互联网下载的文件是完好无损到达系统的。然而，损坏可能会发生。没有什么比下载了一个文件（特别是发行版镜像）结果发现文件损坏更令人沮丧的。你还需要确保文件是真实的，没有被试图向系统中注入恶意软件的人篡改。\n\
  \n好消息是，你可以在文件下载后进行检查，以验证系统上的副本与服务器上的副本一致。这可以通过创建并比较文件的校验和来实现。*校验和*（checksum）是使用消息摘要\
  \ 5（MD5）算法计算文件内容生成的值。例如，如果你从 [www.opensuse.org](http://www.opensuse.org) 下载 DVD\
  \ 镜像，可以使用下载页面提供的链接查看文件的校验和。这将显示源文件的校验值，如图 8-5 所示。\n\n![Images](img/f0269-01.jpg)\n\
  \n**图 8-5** 查看源文件校验值\n\n下载文件后，你可以从 shell 提示符使用 `sum` 命令为本地副本计算校验和。要执行此操作，只需输入 `sum\
  \ 路径/文件名`。例如，如果你将 `pure-ftpd-1.0.29-1.1.x86_64.rpm` 文件下载到 `~/Downloads` 目录，你应该输入：\n\
  \n```\nsum ~/Downloads/pure-ftpd-1.0.29-1.1.x86_64.rpm\n```\n\n`sum` 工具读取文件，生成文件的校验和并将其显示在屏幕上。这是一个示例：\n\
  \n![Images](img/p0269-01.jpg)\n\n然后你可以将网站上原始文件的校验和与本地文件的校验和进行对比。如果校验和相同，则说明你状态良好。这意味着文件是完全相同的。传输过程中没有发生损坏。\n\
  \n\n\n\n然而，如果校验和不同，这表明该文件的两个副本在某些方面是不同的。更有可能是下载过程中发生了某些情况，导致副本损坏。在一种情况下，请不要尝试挽救本地副本。删除它，下载一个新副本，并再次验证校验和。\n\
  \n让我们在下面的练习中练习使用网络资源来获取 Linux 软件。\n\n### 练习 8-1：使用网络资源获取 Linux 软件\n\n在本次练习中，你将练习使用网络资源下载\
  \ Linux 软件。以下步骤在本书编写时是准确的。由于网络瞬息万变，随着新版本的发布和网站的更新，你可能需要修改这些步骤。你可以使用书中附带虚拟机进行此练习。运行\
  \ `snapshot 8-1` 以获得配置正确的环境。\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 8-1 视频，演示如何执行此任务。\n\
  \n在此基础上，请完成以下操作：\n\n1. 启动你的 Linux 系统并以 `student` 用户身份登录，密码为 `student`。\n2. 打开网页浏览器并导航到\
  \ `[`www.sourceforge.net`](http://www.sourceforge.net)`。\n\n![Images](img/note.jpg)\n\
  \n**注意** 这些步骤是使用 Firefox 编写的如果你在恢复 `snapshot 8-1` 后发现无法连接互联网，请打开终端窗口，使用 `su -` 切换到\
  \ root，然后在 shell 提示符下输入 `systemctl restart network`。\n\n3. 在 SourceForge 首页的搜索框中输入\
  \ `filezilla` 然后选择 `Search`。\n4. 在搜索结果列表中找到 Filezilla 的 `Download Now` 链接并选择它。\n\
  5. 下载适用于你的发行版和架构的 `tar.bz2` 格式的最新 Filezilla 版本到家目录 (`~`) 下的 `Downloads` 目录。（你的浏览器可能会提示你用图形化归档工具打开文件。不要选择此选项。）\n\
  6. 在浏览器中，导航到 `[`www.rpmfind.net/`](http://www.rpmfind.net/)`。\n7. 在搜索框中输入 `gftp`\
  \ 然后选择 `Search`。\n8. 在搜索结果列表中，识别适用于你的发行版和架构的相应 RPM 包。\n\n![Images](img/tip.jpg)\n\
  \n**提示** 你可以按 `CTRL-F` 在页面中搜索你的发行版和架构。\n\n9. 选择相应的链接下载适用于你系统的正确 RPM，并将文件保存到 `~/Downloads`。\n\
  10. 关闭你的浏览器窗口。\n\n现在你准备好开始安装文件了。让我们接下来回顾如何进行操作。\n\n### 安装软件包\n\n你也可以使用*软件包的软件*在你的\
  \ Linux 系统上安装预编译、预配置的应用程序和服务。通过软件包软件，源代码已经针对特定的系统架构（以及在某些情况下是针对特定的 Linux 发行版）进行了预构建和配置。\n\
  \nRPM 的伟大之处在于它使得软件的安装和管理变得简单（比我们在在本节后面讨论的源代码选项要容易得多），特别是对于新或新手 Linux 用户来说。坦率地说，你必须熟悉\
  \ Linux 知识才能安装和编译源代码。你可能会发现，所需的技能和知识远超大多数终端用户的水平。\n\nRPM 包的安装非常简单。大多数 RPM 包以单个文件的形式下载，你可以直接进行处理。你只需要在\
  \ shell 提示符下使用 `rpm` 工具来安装包文件即可。\n\n在向你展示如何操作之前，我首先需要讨论 RPM 包使用的命名规范。这非常重要，因为 RPM\
  \ 包是针对特定的 CPU 架构构建的，有时甚至针对特定的 Linux 发行版。与源代码安装不同（源代码会在安装过程中为特定架构定制程序），RPM 包是针对特定架构预编译的。这意味着特定\
  \ RPM 可能有多个版本以适应不同的平台。\n\n重要的一点是确保你正在下载并安装适用于你特定系统的正确 RPM 版本。你可以通过查看 RPM 包名来检查。考虑以下示例：\n\
  \n`gftp-2.0.19-7.1.x86_64.rpm`\n\n此 RPM 用于安装 gFTP 软件。它提供了一个图形化 FTP 客户端应用程序，用户可以运行它来访问\
  \ FTP 服务器上的文件。文件名的不同部分用于指示有关包的不同信息，包括以下内容：\n\n![images](img/bull.jpg) **包名** 文件名的这部分仅标识包的名称。在本例中，包名是\
  \ `gftp`。\n\n![images](img/bull.jpg) **版本号** 文件名的这部分指定了包中软件的版本。在这种情况下，软件版本为 `2.0.19`。\n\
  \n![images](img/bull.jpg) **发布号** 文件名的这部分指示了该软件版本的当前发布。偶尔在创建 RPM 包的过程中会遇到错误。当针对修复了错误的相同软件版本发布新包时，发布号就会递增。在刚才的示例中，发布号为\
  \ `7.1`。该字段还可能包含一个可选的发行版标识符，指示该包是针对特定的 Linux 发行版编译的。标识符包括：\n\n![images](img/bull.jpg)\
  \ **fc*x*** 指明该包适用于 Fedora Core 版本 *x*。例如，`fc4` 表示该包适用于 Fedora Core 4。\n\n![images](img/bull.jpg)\
  \ **rhl*x*** 指明该包适用于 Red Hat Linux 版本 *x*。\n\n![images](img/bull.jpg) **suse*xxx***\
  \ 指明该包适用于 SUSE Linux 版本 *xxx*。例如，`suse101` 表示该包适用于 SUSE Linux 10.1。\n\n![images](img/bull.jpg)\
  \ **架构类型** 文件名的这部分指定了包内软件将运行的 CPU 架构。在在上述的示例中，架构被指定为 `x86_64`。这意味着该软件将在 64 位 x86\
  \ CPU 上运行。你可能在包的文件名中看到以下架构：\n\n![images](img/bull.jpg) **i386** 指明软件将在 Intel 80386\
  \ 或更新的 CPU 上运行\n\n![images](img/bull.jpg) **i586** 指明软件将在 Intel Pentium 或更新的 CPU\
  \ 上运行\n\n![images](img/bull.jpg) **i686** 指明软件将在 Intel Pentium 4 或更新的 CPU 上运行\n\n\
  ![images](img/bull.jpg) **x86_64** 指明软件将在 64 位 x86 CPU 上运行\n\n![images](img/bull.jpg)\
  \ **athlon** 指明该软件旨在运行在 AMD Athlon CPU 上\n\n![images](img/bull.jpg) **ppc** 指明该软件旨在运行在\
  \ PowerPC CPU 上\n\n![images](img/bull.jpg) **noarch** 指明该包不依赖于架构\n\nRPM 包可以在你的发行版安装\
  \ CD 或 DVD 上找到，也可以在互联网上的各种位置找到。下载 RPM 包后，你应该使用 `sum` 命令生成校验和，并将其与原始文件的校验和进行比对，正如我们之前讨论的那样。\n\
  \n此外，你还可以使用 `rpm` 命令来检查包的真实性。这样做可以让你知道下载的包是直接来自维护该软件的机构，还是被第三方以某种方式修改过。这是通过输入 `rpm\
  \ --checksig *package_filename.` 完成的。该命令将查询包的数字签名密钥。如果有人在某处修改了该包，密钥将失效。\n\n\n\n\
  在下一个示例中，我们从互联网下载了 `pure-ftpd` 包。为了验证该包的完整性，你首先需要切换到存储包文件的目录。然后，输入 `rpm --checksig\
  \ pure-ftpd-1.0.29-1.4.x86_64.rpm` 来检查应用的数字签名：\n\n![Images](img/p0272-01.jpg)\n\n\
  请注意，命令的输出显示签名正常（OK），这表明该包自创建以来未被任何人修改过。\n\n一旦你确认包已完整无损地到达你的本地系统，就可以再次使用 `rpm` 命令进行安装。这通过输入\
  \ `rpm –i *package_filename*.` 来完成。`i` 选项告诉 `rpm` 工具安装指定的软件包。例如，你可以安装之前下载的 `gFTP`\
  \ 包，方法是先切换到包文件所在的目录，然后（以 root 身份）输入 `rpm –i gftp-2.0.19-7.1.x86_64.rpm`。如下所示：\n\n\
  ![Images](img/p0272-02.jpg)\n\n软件现在已安装在系统上并可以供你使用了。这真简单！\n\n* *\n\n![Images](img/tip.jpg)\n\
  \n**提示** 如果你知道想要安装的包的完整 URL，可以直接从互联网安装它。只需输入 `rpm –i *url/filename*.rpm` 即可。\n\n\
  你会发现在上例中，`rpm` 工具在安装软件包时并没有提供太多反馈。一些 Linux 管理员更喜欢这种方式；另一些人则更喜欢看到一些指示安装进度的视觉提示。这可以通过使用\
  \ `rpm` 的 `–ihv` 选项来实现，如下例所示：\n\n![Images](img/p0272-03.jpg)\n\n`–h` 选项告诉 `rpm`\
  \ 在屏幕上打印哈标记（hash marks）作为进度指示。`–v` 选项告诉 `rpm` 以详细模式运行，并将输出打印到屏幕上。\n\n个人而言，在使用 `rpm`\
  \ 时，我倾向于使用 `–ihv` 选项。安装小软件包时这不是什么问题。然而，安装一个大型 RPM 包可能需要几分钟时间。如果不使用 `–ihv` 选项，在安装过程运行时，终端会一直停留在那里。这让我感到不安，因为我不知道一切是否都在正常处理。如果耗时过长，我会开始怀疑某些问题导致了\
  \ `rpm` 挂起。我更喜欢看到视觉进度指示器，即使只是一堆哈标记，也能让我知道一切都在正常进行。如果你是那种痴迷细节的人，你可以使用 `rpm` 工具的 `–vv`\
  \ 选项来获取更多关于安装的信息。\n\n`rpm` 工具的卓越功能之一是它可以自动为你计算依赖关系。你需要理解的是，一个给定的 Linux 软件包可能依赖先在系统上安装另一个包才能正常工作。如果是此类情况，那么被依赖的包就被称为*依赖项*（*dependency*）。当你运行\
  \ `rpm` 工具时，由于它会查询你想要安装的包，并自动检查你是否已经安装了依赖包。如果没有，它将生成一个错误并提示你安装运行该软件所需的必要包。\n\n如果你想在不实际安装软件的情况下检查依赖关系，可以使用\
  \ `rpm` 工具的 `--test` 选项。如果有任何失败的依赖测试，它们将打印在屏幕上，允许你安装必要的软件。你也可以通过使用 `rpm` 的 `--nodeps`\
  \ 选项完全跳过依赖测试并在没有依赖软件的情况下安装包（顺便说一下，这不是个好主意）。\n\n* *\n\n![Images](img/note.jpg)\n\n\
  **注意** 我喜欢图形化软件管理工具（如 `YaST`）的优点之一是它们不仅能为你计算依赖关系，还会为你安装它们。而使用命令行 `rpm` 工具时，你必须手动去安装所有依赖包。\n\
  \n运行 `rpm` 后，你就可以使用已安装的软件。某些包会在你的 `KDE` 或 `GNOME` 桌面环境中创建一个菜单项或图标，你可以通过它启动应用程序。\n\
  \n其他软件包——特别是那些安装系统服务的包——必须从 shell 提示符通过启动脚本或运行可执行文件名来启动。例如，你也可以在 shell 提示符处输入 `gftp`\
  \ 来启动我们安装的 `gFTP` 客户端。\n\n让我们在下面的练习练习从 RPM 包安装软件。\n\n### 练习 8-2：安装 RPM 包\n\n在此练习中，将练习安装\
  \ `gFTP` 客户端。你可以使用书中附的虚拟机进行此练习。运行快照 8-2 以获得配置正确的环境。\n\n* *\n\n![Images](img/viedo.jpg)\n\
  \n**视频** 请观看练习 8-2 视频，演示如何执行此任务。\n\n完成以下操作：\n\n1. 在系统运行的同时，打开一个终端会话。\n2. 如果必要，输入\
  \ `su –` 后输入密码 `student` 切换到 root 用户账户。\n3. 输入 `cd ~` 切换到主目录。使用 `ls` 命令查看 `gftp`\
  \ 包的文件名。\n4. 在 shell 提示符处，输入 `rpm –ihv gftp-*version*.*architecture*.rpm`。分别将 *version*\
  \ 和 *architecture* 替换为该 RPM 包的当前版本号和架构。\n5. 在 shell 提示符处输入 `gftp &` 运行 `gFTP` 客户端。\n\
  6. 如果你的网络已连接互联网，在 Host 字段输入 `ftp.openssl.org`，在 User 字段输入 `Anonymous`；然后连接。你应该看到你已连接到\
  \ `OpenSSL` FTP 服务器，如图 8-6 所示。\n7. 关闭你的 `gftp` 窗口。\n\n![Images](img/f0274-01.jpg)\n\
  \n**图 8-6** 使用 `gFTP` 客户端访问 FTP 服务器\n\n现在你已经知道如何从 RPM 包安装软件了，让我们转换一下，讨论如何使用 `rpm`\
  \ 管理系统中已安装的软件。\n\n#### 使用 RPM 管理已安装的软件\n\n如果你接触计算机已经有很长时间了，你会知道偶尔需要修复甚至卸载系统中的软件。Linux\
  \ 也是如此。在本章的这部分，我们将花费几页内容介绍如何管理系统当前已安装的软件。我们将讨论以下主题：\n\n![images](img/bull.jpg) 卸载软件\n\
  ![images](img/bull.jpg) 更新软件\n![images](img/bull.jpg) 查询软件包\n![images](img/bull.jpg)\
  \ 验证软件包\n![images](img/bull.jpg) 从包提取文件\n\n让我们从讨论如何在 Linux 上卸载软件开始\n\n#### 卸载软件\n\
  \n可能难以置信，作为 Linux 系统管理员，你可能需要卸载很多软件。这并不是因为软件本身有什么问题；而是因为大多数 Linux 发行版会在基础安装方案中在给定系统上安装大量的包。除非你在安装过程中花时间手动指定要安装哪些软件，否则很可能你的系统中会安装许多你需要的软件包。最好的情况下，这些不必要的软件包占用了磁盘空间；最坏的情况下，它们可能会为系统留下安全漏洞。\n\
  \n在安装任何 Linux 系统后，我强烈建议你花几分钟检查安装中包含的软件。如果你系统中有不必要的软件，请卸载它们！\n\n与安装 RPM 包一样，卸载它们的过程也相对简单直接。要执行此操作，在\
  \ shell 提示符处输入 `rpm –e *package_name*`。–e 选项告诉 `rpm` 工具删除指定的包。例如，之前我们安装了 `gFTP`\
  \ 包。你可以通过在 shell 提示符处输入 `rpm –e gftp` 来卸载同一个包，如下例所示：\n\n\n\n\n\n```\nopenSUSE:/home/rtracy/Downloads\
  \ # rpm -e gftp\n```\n\n请注意，`rpm` 工具在卸载和安装操作期间都会检查依赖关系。如果系统中安装了其他依赖你正尝试卸载的包的软件，将显示错误消息并列出这些依赖的包。你必须先卸载这些包才能继续。\n\
  \n让我们在下面的练习中练习卸载 RPM 软件包。\n\n### 练习 8-3：卸载 RPM 软件包\n\n在此练习中，你将练习卸载在上一个练习中安装的 `gftp`\
  \ 客户端。你可以使用书中附的虚拟机进行此练习。运行快照 8-3 以获得配置正确的环境。\n\n![Imags](img/viedo.jpg)\n\n**视频**\
  \ 请观看练习 8-3 视频，演示如何执行此任务。\n\n完成以下操作：\n\n1. 在系统运行的情况下，打开终端会话。\n2. 如果必要，输入 `su –`\
  \ 后输入 `student` 的密码切换到 root 用户账户。\n3. 在 shell 提示符处，输入 `rpm –e gftp`。你应该会看到一条指示 `gftp`\
  \ 已被删除的消息。\n\n让我们接着讨论如何更新 RPM 软件包。\n\n### 更新软件\n\n`rpm` 工具管理依赖关系的能力确实非常节省时间。然而，这引发了更新问题。如果你安装了一个需要更新的包，但有许多其他包依赖于它该怎么办？你必须在更新该包之前卸载所有它们吗？那将非常头疼！\n\
  \n幸运的是，情况并非如此。你可以使用 `rpm` 工具更新现有软件包，而无需卸载其所有的依赖包。这是通过使用 `rpm` 的 `-U` 选项实现的。使用此选项，`rpm`\
  \ 工具将删除任何现有旧版本包，然后安装该包的新版本。例如，假设你的系统中安装了旧版本的 `gftp`，并想升级到版本 2.0.19。要执行此操作，你需要在 shell\
  \ 提示符处输入 `rpm –U gftp-2.0.19-7.1.x86_64.rpm`。以下是一个示例：\n\n![Images](img/p0276-01.jpg)\n\
  \n![Images](img/tip.jpg)\n\n**提示** 如果你尝试使用 `-U` 选项更新一个尚未安装的包，`rpm` 将直接安装它。事实上，我实际上一直使用\
  \ `-U`，无论我是在安装还是更新包。你还可以配合 `-U` 使用 `-h` 和 `-v` 选项来显示进度指示。\n\n让我们接着讨论如何查询系统中安装的软件包。\n\
  \n### 查询软件包\n\n除了在系统中安装和升级包之外，你还可以使用 `rpm` 命令查询软件包信息。这可以通过 `rpm` 的 `-q`（代表 query）选项来实现。使用\
  \ `-q` 选项，你可以列出系统中安装的所有包，查看系统中安装的特定包的版本和发布版本，或查看有关包的详细信息。\n\n`-q` 选项要求你精确指定想要查询的内容。例如，如果你想生成一个系统中安装的所有包的列表，你需要输入\
  \ `rpm –qa`。屏幕上将显示一个已安装包的列表，如下例所示：\n\n![Images](img/p0277-01.jpg)\n\n请注意，列表将非常长！如果你需要某个特定包的信息，可以使用\
  \ `-q` 配合以下选项：\n\n![images](img/bull.jpg) `-i` 此选项显示特定软件包的摘要信息。例如，你可以输入 `rpm –qi\
  \ postfix` 来显示系统中安装的 `postfix` 包的信息，如下所示：\n\n![Images](img/p0277-02.jpg)\n\n![images](img/bull.jpg)\
  \ `--whatrequires` 此选项显示需要指定包的包列表。例如，输入 `rpm –q --whatrequires postfix` 将显示需要 `postfix`\
  \ 包的包列表，如下例所示：\n\n![Images](img/p0277-03.jpg)\n\n![images](img/bull.jpg) `-l` 此选项显示包含在\
  \ RPM 软件包中的文件列表。\n\n![images](img/bull.jpg) `--provides` 此选项显示指定包提供的功能。\n\n![images](img/bull.jpg)\
  \ `--requires` 这是一个实用的选项，显示指定包所需。在下一个示例中，在 shell 提示符处输入了 `rpm –q --requires postfix`\
  \ 命令：\n\n![Images](img/p0278-01.jpg)\n\n注意屏幕上显示了系统需求列表。如果你想找到由哪个包提供了特定需求，可以在 shell\
  \ 提示符处输入 `rpm –q --whatprovides utility_name`。`rpm` 工具将确定提供该程序的包名称。在以下示例中，你可以看到\
  \ `sed-4.1.5-134.1.x86_64` 包提供了 `sed` 工具：\n\n![Images](img/p0278-02.jpg)\n\n让我们接着讨论如何使用\
  \ `rpm` 工具验证软件包。\n\n### 验证软件包\n\n除了查询软件包外，`rpm` 工具还可以验证你系统上的软件包。正如你可能（痛苦地）意识到的，无论操作系统是什么，软件都可能在任何计算机系统上被损坏、删除或其他弄乱。你可以使用\
  \ `rpm` 工具验证已安装的软件包，并确保一切都按预期工作。这是通过使用 `-V` 选项实现的。\n\n你可以通过指定包名来验证单个包，例如 `rpm –V\
  \ gftp`。你也可以通过输入 `rpm –Va` 来验证系统中所有的包。无论你选择哪种选项，如果没有发现错误，`rpm` 将不返回输出。在下一个示例中，在命令提示符处执行了\
  \ `rpm –V gftp` 命令。因为该包没有错误，所以屏幕上没有任何写入，`rpm` 工具退出。\n\n```\nopenSUSE:~ # rpm -V\
  \ gftp\n```\n\n如果确实发生了错误，`rpm` 会打印错误消息和相关的文件名，如下所示：\n\n![Images](img/p0278-03.jpg)\n\
  \n验证过程中生成的错误消息遵循以下语法：\n\n```\nSM5DLUGT c filename\n```\n\n错误消息中的参数代表含义：\n\n![images](img/bull.jpg)\
  \ `S` 表示文件大小存在问题\n![images](img/bull.jpg) `M` 表示文件模式有问题\n![images](img/bull.jpg)\
  \ `5` 表示文件的 MD5 校验存在问题\n![images](img/bull.jpg) `D` 表示文件的修订号存在问题\n![images](img/bull.jpg)\
  \ `L` 表示文件的符号链接有问题\n![images](img/bull.jpg) `U` 表示文件所有权有问题\n![images](img/bull.jpg)\
  \ `G` 表示文件组有问题\n![images](img/bull.jpg) `T` 表示文件的修改时间有问题\n![images](img/bull.jpg)\
  \ `c` 表示指定的文件是配置文件\n![images](img/bull.jpg) `filename` 指定验证失败的文件名\n\n在我们之前看过的示例中，当输出中上述字母的任何一个用点\
  \ (.) 表示时，它表示指定文件的该参数没有发现问题。显示的字母表示指定文件的该特定参数上发现了问题。例如，`/etc/xinetd.d/vnc` 文件有 S、5\
  \ 和 T 错误，表示文件的大小、校验和和修改时间存在问题。我们也知道它是一个配置文件，因为该行上也有一个 `c`。\n\n在示例中，注意 `rpm` 遇到的大多数错误都与配置文件有关。这实际上并不是问题。配置文件自然会经常被修改，因此可能无法验证。\n\
  \n\n\n\n\n然而，如果其他文件（例如可执行文件）验证失败，那么你就应该更加关注。根据 `rpm –V` 的输出，你可能确定确定需要修复已安装的软件包。你也可以使用\
  \ `rpm` 来执行此操作，使用 `-U --replacepkgs` 选项。例如，如果我确定需要重新安装 gFTP 软件包，可以在 shell 提示符下输入\
  \ `rpm –U --replacepkgs gftp-2.0.19-7.1.x86_64.rpm`，强制 `rpm` 从原始 `rpm` 安装 gFTP 软件包，即使它已经安装了。\n\
  \n### 从包中提取文件\n\n有时，你可能需要从一个包文件中提取一个或多个单独的文件。实现此操作的方法之一是使用 `rpm2cpio` 工具。该命令获取 RPM\
  \ 软件包文件并将其转换为 cpio 归档。\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 我们将在第 10 章中讨论如何处理\
  \ cpio 归档。现在，只需将 cpio 归档等同于 tar 归档或 zip 文件即可。\n\n使用 `rpm2cpio` 的语法如下：\n\n`rpm2cpio\
  \ package_name > archive_filename`\n\n例如，如果你需要从 gFTP rpm 软件包中提取一个文件，可以使用以下命令将其转换为\
  \ cpio 归档：\n\n`rpm2cpio gftp-2.0.19-7.1.x86_64.rpm > gftp.cpio`\n\n然后你可以使用 `cpio`\
  \ 工具从创建的 cpio 归档中提取你需要的文件。\n\n让我们在下面的练习中练习管理 RPM 软件包。\n\n### 练习 8-4：管理 RPM 软件包\n\
  \n在此练习中，你将练习管理系统中安装的 RPM 软件包。你可以使用随本书附的虚拟机进行此练习。运行快照 8-3 以获得配置正确的环境。\n\n***\n\n\
  ![Images](img/viedo.jpg)\n\n**视频** 请观看练习 8-4 视频，查看如何执行此任务的演示。\n\n完成以下操作：\n\n1. 在系统运行的情况下，打开一个终端会话。\n\
  \n2. 如果必要，通过输入 `su –` 后跟密码 `student` 切换到 root 用户账户。\n\n3. 在 shell 提示符下输入 `rpm –qa`\
  \ 列出系统中安装的所有 RPM 软件包。\n\n4. 通过输入 `rpm –qi rpm` 查看 `rpm` 工具本身的信息。\n\n5. 通过输入 `rpm\
  \ –q--whatrequires rpm` 识别需要 `rpm` 包的软件包。哪些软件包需要 `rpm`？\n\n6. 通过输入 `rpm –q --requires\
  \ rpm` 识别 `rpm` 工具所需的组件。`rpm` 需要什么？\n\n7. `rpm` 需要的组件之一是 `libz.so.1`。通过输入 `rpm –q\
  \ --whatprovides libz.so.1` 确定哪个软件包提供了该组件。哪个软件包提供了该组件？\n\n#### 使用 yum 安装 RPM 软件包\n\
  \n除了 `rpm` 之外，你可以在 shell 提示符下使用 `yum` 命令来安装 RPM 软件包。`yum`（Yellowdog Updater Modified）命令只是\
  \ `rpm` 的前端，但与单独使用 `rpm` 相比，它有几个关键优势：\n\n![images](img/bull.jpg) 它允许你通过单个命令安装一个软件包*以及*其所有的依赖项。这太棒了！在用\
  \ `rpm` 安装软件包时，管理依赖关系可能是真正的问题。这被称为“依赖地狱”。以下是发生的情况：你决定在 shell 提示符下用 `rpm` 安装软件包 X。然而，当你运行命令时，你会被告知\
  \ X 包依赖于软件包 Y 和 Z；你必须安装这些软件包。于是，你下载并尝试用 `rpm` 安装软件包 Y 和 Z。再次这样做时，你发现 Y 依赖于软件包 A、B\
  \ 和 C，而软件包 Z 依赖于软件包 E、F 和 G。当然，你又发现 A、B、C、E、F 和 G 都有自己的依赖项。在你还没反应过来时，你为了在系统上安装软件包\
  \ X 已经安装了 20 个或更多单独软件包。真是一场噩梦！这正是 `yum` 大放异彩的地方！`yum` 命令通过自动为你计算并安装所有的依赖包，帮助你摆离依赖地狱。\n\
  \n![images](img/bull.jpg) 它通过搜索互联网上的一个或多个存储库为你定位软件包。再次，这是 `yum` 的一个核心优势。我无法告诉你（在学习\
  \ `yum` 之前）为了找到某个特定软件包的 3.5 版本以满足依赖要求而浪费了多少小时，结果却只能找到 3.3 版本。有了 `yum`，就不需要在网络上翻遍寻找正确的软件包来解决依赖问题了。它会为你处理一切。\n\
  \n一旦你开始使用 `yum`，你可能再也不会使用 `rpm` 了！从命令行运行时，`yum` 会找到请求的软件包的最新版本，下载它，安装其依赖项，然后安装请求的软件包本身。\n\
  \n***\n\n![Images](img/caution.jpg)\n\n**注意** `yum` 工具默认未安装。它默认支持，但可以手动安装。\n\n使用\
  \ `yum` 的基本语法如下：\n\n`yum option command`\n\n常用的 `yum` 命令见表 8-1。\n\n![Images](img/t0282-01.jpg)\n\
  \n**表 8-1** yum 命令\n\n例如，在图 8-7 中，在 shell 提示符下输入了 `yum install gcc` 命令以便在 Fedora\
  \ 系统上安装 gcc 软件包。`yum` 工具搜索已配置使用的存储库，定位 gcc 包，计算依赖关系，安装依赖项，然后安装该软件包。\n\n![Images](img/f0282-01.jpg)\n\
  \n**图 8-7** 使用 yum 安装 gcc 软件包\n\n如果你只想下载文件而不安装它，可以使用 `yumdownloader` 命令代替 `yum`。语法为\
  \ `yumdownloader package_name`。`yumdownloader` 工具从其配置列表中找到软件包的最新版本，并根据你的意愿下载到你的系统中。\n\
  \n当然，`yum` 和 `yumdownloader` 并不会魔术般知道去哪里寻找你需要的 RPM 软件包。你必须使用两个配置文件告诉它去哪里查找：\n\n\
  ![images](img/bull.jpg) /etc/yum.conf `/etc/yum.conf` 文件是 `yum` 的配置文件。该文件定义了诸如软件存储库\
  \ URL 及其 `yum` 搜索的名称、下载软件包保存的目录 (`cachedir`) 以及 yum 日志文件 (`logfile`) 的保存位置。这是一个来自\
  \ Fedora 系统的示例 `yum.conf` 文件：\n\n![Images](img/p0283-01.jpg)\n\n![images](img/bull.jpg)\
  \ /etc/yum.repos.d/ 注意前述示例，存储库信息可以存储在此文件中，也可以存储在 `/etc/yum.repos.d` 目录下名为 `filename.repo`\
  \ 的单独文件中。尽管你被允许这样做，但通常你不会将存储库配置信息放在 `yum.conf` 文件中。相反，你会为每个存储库创建一个单独的文件，进行适当命名，并将其保存到此目录。这是我们示例\
  \ Fedora 系统的存储库列表：\n\n![Images](img/p0283-02.jpg)\n\n正如此示例所示，该 Fedora 系统配置了四个 yum\
  \ 存储库用于搜索软件包。接下来显示了一个用于存储 Fedora 更新的存储库配置文件示例：\n\n![Images](img/p0283-03.jpg)\n\n\
  ![Images](img/p0284-01.jpg)\n\n该存储库配置文件包含了几个关键元素，如表 8-2 描述所示。\n\n![Images](img/t0284-01.jpg)\n\
  \n**表 8-2** yum 存储库配置文件信息\n\n\n\n\n\n除了使用包管理器安装软件外，你还可以从源代码在 Linux 上安装软件。事实上，你在\
  \ Linux 系统上安装的许多应用程序和服务是以源代码的形式提供的，而不是二进制可执行文件。当你在本地系统上安装这些软件时，你实际上是将是将安装文件中的源代码编译成可以运行的二进制可执行文件。\n\
  \n例如，假设你想在本地 Linux 系统上安装并配置 FTP 服务。你已经做了一些研究，并确定 `Pure-FTPd` 服务是你想要用来搭建 FTP 服务器的服务。当你下载并解压安装文件时，你会注意到创建了一个名为\
  \ `src` 的目录。该目录下有许多文本文件，其中包含了 `Pure-FTPd` 服务的源代码。这里是该服务的源代码文件示例：\n\n![Images](img/p0284-02.jpg)\n\
  \n以这种方式分发软件有很多优点。其中关键之一是，你不需要为每种交付架构和平台创建一个单独的可执行文件和安装包。你可以让安装过程检测软件正在安装的系统类型，并对软件进行适当编译。这种方法的主要缺点是它让安装过程变得复杂得多。用户必须在系统中安装编译器；否则，他们将无法将源代码编译成二进制可执行文件。此外，用户必须知道编译源代码和安装生成的可执行文件的正确程序。\n\
  \n幸运的是，大多数开发者已经采用了一个完成此任务的标准流程。该流程由以下元素组成：\n\n![images](img/bull.jpg) 准备安装文件\n![images](img/bull.jpg)\
  \ 编译可执行文件\n![images](img/bull.jpg) 安装可执行文件\n![images](img/bull.jpg) 卸载从源代码编译的软件\n\
  \n让我们先开始讨论如何准备安装文件。\n\n## 准备安装文件\n\n从源代码安装应用程序的第一步是从互联网下载相应的安装文件。例如，如果你想安装我们在前面的示例中使用的\
  \ `pure-ftpd` 服务，你将导航到相应的网站并下载安装文件。\n\n你会注意到，用于从源代码安装的安装文件通常以 tarball 文件（经过 tar\
  \ 归档和 gzip 压缩）的形式分发。tarball 文件通常具有 `.tar.gz` 扩展名。由于这些应用程序是以 tarball 格式分发的，因此在从互联网下载后，你必须先对其进行解压缩和提取，才能进行任何其他操作。这是使用\
  \ `tar` 命令完成的。`tar` 命令用于创建归档文件。它也可以用于从 tarball 等归档中提取文件。\n\n要在你的系统中执行此操作，请使用 shell\
  \ 提示符中使用 `cd` 命令切换到下载 tarball 的目录。然后输入 `tar –zxvf *filename*.`。`-z` 选项告诉 `tar` 先使用\
  \ `gzip` 解压 tarball。`-x` 选项告诉 `tar` 从解压后的归档文件中提取文件。`-v` 选项告诉 `tar` 以冗详细模式运行，在处理每个文件时在屏幕上显示它。`-f`\
  \ 选项告诉 `tar` 要提取的文件名。\n\n例如，假设你下载了 `pure-ftpd-1.0.29.tar.gz` 文件。要提取此文件，你在 shell\
  \ 提示符处输入 `tar –zxvf pure-ftpd-1.0.29.tar.gz`。文件被提取到当前目录下名为 `pure-ftpd-1.0.29` 的目录。该目录包含了用于创建可执行程序的源代码文件。它还包含了帮助创建可执行文件所需的各种工具。这些显示在这里：\n\
  \n![Images](img/p0286-01.jpg)\n\n文件提取完成后，你接下来需要准备用于编译的安装文件。这是使用前面示例中所示 `configure`\
  \ 命令完成的。要运行此命令，首先确认你处于解压 tarball 时创建的目录中；然后在 shell 提示符处输入 `./configure`，如下所示：\n\n\
  ![Images](img/p0286-02.jpg)\n\n`configure` 文件是一个脚本，它在运行时会做两件事。首先，它会检查你的系统，确保编译程序所需的所有必要组件都已就绪。它检查最重要的内容之一是是否存在与\
  \ C 语言编程兼容的编译器。如果你没有 C 编译器（例如 GNU C 编译器 (`gcc`）或 GNU C++ 编译器 (`gcc-c++`）），`configure`\
  \ 命令将会在屏幕上显示错误，指示你安装编译器然后再次运行 `configure`。它还会验证你的整个系统环境是否与你将安装的程序兼容。\n\n其次，它还会创建一个名为\
  \ `Makefile` 的非常重要的文件。由于大多数源代码应用程序都设计为部署在各种不同的发行版和架构上，因此安装程序需要知道如何自定义源代码文件，以便生成的可执行文件可以在你的特定系统上运行。`configure`\
  \ 脚本执行的最后操作之一是创建一系列 `Makefile` 文件。`Makefile` 文件包含了关于如何编译可执行文件以便在你的平台上运行的特定指令。\n\n\
  虽然不是强制，但在运行 `configure` 之后检查 `Makefile` 文件通常是一个好主意，以验证程序将按照你想要的方式进行安装。如果你看到想要更改的内容，可以使用文本编辑器进行相应修改并保存文件。\n\
  \n一旦运行了 `configure` 且 `Makefile` 文件准备就绪，流程的下一步是实际编译可执行文件。让我们接着讨论如何实现。\n\n## 编译可执行文件\n\
  \n在流程的这一阶段，你想要安装的程序仍然仅以源代码的形式存在于文件系统中。在运行它之前，你必须将基于文本的源代码转换为可执行文件。这是使用 `make` 命令完成的。`make`\
  \ 命令调用你系统的 C 编译器（如 `gcc`），并引导它读取源代码文件，使用 `Makefile` 文件中列出的规范和选项，生成编译后的可执行文件。这是通过在仍然解压\
  \ tarball 文件时创建的目录中，在 shell 提示符处不带任何选项地输入 `make` 完成的。这是一个例子：\n\n![Images](img/p0287-01.jpg)\n\
  \n但请注意，`make` 仅创建可执行文件。在使用它之前，它需要实际安装到系统中；这样做会将可执行文件、启动脚本和文档文件复制到文件系统中的相应目录。让我们接着讨论如何操作。\n\
  \n## 安装可执行文件\n\n要将程序实际安装到你的系统中，你需要再次使用 `make` 命令。但是，这次你指定了一个目标 `make install`。这告诉\
  \ `make` 使用 `Makefile` 中 `INSTALL` 部分指定的信息安装程序。\n\n要执行此操作，请确保你仍然处于解压 tarball 文件时创建的目录中。然后在\
  \ shell 提示符处输入 `make install`。`make` 工具随后将按照 `Makefile` 中的指令安装应用程序，如下：\n\n![Images](img/p0287-02.jpg)\n\
  \n此时，应用程序或服务已准备好运行。只需在 shell 提示符处输入相应的命令即可。\n\n### 练习 8-5：从源代码构建\n\n在练习中，你将练习从 tarball\
  \ 安装 `Pure-FTPd` 软件。你可以使用书中提供的虚拟机进行此练习。运行快照 8-3 以获得配置正确的环境。\n\n\n\n\n\n![Images](img/viedo.jpg)\n\
  \n**视频** 请观看练习 8-5 视频，查看如何执行此任务的演示。\n\n完成以下操作：\n\n1. 在系统运行的情况下，打开一个终端会话。\n2. 输入\
  \ `su –` 并输入密码 `student` 切换到 root 用户账户。\n3. 使用 `cd` 命令切换到你的主目录。这是保存 Pure-FTPd 压缩（tarball）的地方。使用\
  \ `ls` 命令查看文件名。\n4. 在 shell 提示符处，输入 `tar –zxvf ./pure-ftpd-*version*.tar.gz`。将 *version*\
  \ 替换为你下载的 tar 包的当前版本号。\n\n![Images](img/tip.jpg)\n\n**提示** 你可以使用 Linux 的制表键补全（tab\
  \ complete）功能让输入这些命令变得更容易。要使用制表键补全，输入 `tar –zxvf ./pure-` 然后按 TAB 键。文件名剩余部分会自动为你填充！\n\
  5. 使用 `cd` 命令切换到 tar 创建的目录。该目录名称应该是 `pure-ftpd-*version*`。\n6. 输入 `ls` 查看从 tar 包中提取的文件。\n\
  7. 在 shell 提示符处，输入 `./configure`。该配置脚本将检查你的系统并验证软件是否可以安装。你必须在系统中安装 C 语言编译器。如果 `configure`\
  \ 报告你缺少编译器，请在你的发行版 CD 上找到 gcc RPM 包，并在 shell 提示符处输入 `rpm –i` 进行安装。但请注意，gcc 有许多依赖项，因此你可能想使用\
  \ yum 或图形化软件安装程序来加速安装！\n8. 当配置脚本执行完成后，在 shell 提示符处输入 `make` 编译可执行文件。\n9. 当编译完成后，在\
  \ shell 提示符处输入 `make install` 安装可执行文件。\n10. 在 shell 提示符处输入 `/usr/local/sbin/pure-ftpd\
  \ &` 启动服务。\n11. 在 shell 提示符处输入 `ftp localhost` 测试系统。\n12. 在出现提示时，输入用户名 `anonymous`。此时你应该已经登录到\
  \ FTP 服务器。\n13. 输入 `quit` 关闭连接。\n\n此时，你已经在 Linux 系统上运行了一个功能良好的 FTP 服务器了！\n\n![Images](img/note.jpg)\n\
  \n**注意** 其他工作站尚无法访问它，因为你的系统主机防火墙可能阻止了 FTP 协议使用的 IP 端口流量。\n\n除了从源代码安装软件外，你还可以卸载它。让我们接着讨论如何操作。\n\
  \n## 卸载从源码编译的软件\n\n此类软件的卸载过程与安装过程非常相似。\n\n对于大多数使用我们之前讨论的标准构建过程安装的应用程序或服务，你（大多数情况下）必须能够访问安装文件才能卸载相关软件。问题在于，许多\
  \ Linux 管理员在安装过程完成后会删除安装源文件以节省磁盘空间。如果你这样做，那么一旦你决定卸载软件，你就删除了可能需要的文件。我建议在文件系统的某个创建一个仅\
  \ root 可以访问的受保护目录，并将你的源码安装文件保存在其中。是的，这会占用一点磁盘空间，但如果以后需要卸载，你将拥有所需的文件。\n\n卸载过程可能根据产品而略有不同。某些应用程序或服务可能在你从\
  \ tar 包中提取的文件中包含一个卸载脚本。如果是这种情况，你可以执行该脚本从系统中卸载该应用程序。\n\n其他产品可能在它们的 Makefile 中包含一个\
  \ `UNINSTALL` 目标。如果是这种情况，你必须首先从最初提取下载的 tar 包时创建的目录运行 `configure`，就像你第一次安装软件时做的那样。然后，不要运行\
  \ `make install`，而是运行 `make uninstall`。这将导致 make 工具遵循 Makefile 文件卸载部分的指令从你的系统中删除软件。例如，你可以使用\
  \ `make uninstall` 命令从系统中删除 Pure-FTPd 服务。\n\n你如何知道应该使用哪种方法？你下载的 tar 包应该包含某种 `README`\
  \ 文件，该文件记录了你正在处理的特定软件的安装和卸载过程。先检查此文件。如果没有相关信息，请检查制作软件的组织网站上的常见问题解答（FAQ）或知识库。这些资源中的某一个应该为你提供卸载软件所需的步骤。\n\
  \n现在是切换思路，看看如何管理 Debian 软件包了。\n\n## 管理 Debian 软件包\n\n并不是所有发行版都使用 RPM 来管理软件包。基于 Debian\
  \ 的发行版使用 Debian 软件包管理器 (`dpkg`)。Ubuntu 可能是最流行的基于 Debian 的发行版之一，它使用 `dpkg` 管理软件，而不是\
  \ RPM。Debian 包在功能上与 RPM 相似，但在实现方式上完全不同。\n\n![Images](img/note.jpg)\n\n**注意** 偶尔，我会遇到一些误认为\
  \ RPM 和 Debian 包跨平台兼容的人。它们并不兼容。你只能基于 RPM 的系统上安装 RPM 包，在基于 Debian 的系统上安装 Debian 包。不过，你可以使用名为\
  \ `alien` 的工具在不同格式之间转换包。\n\n在本章的这部分，我们将讨论如何管理 Debian 软件包。将涉及以下主题：\n\n![images](img/bull.jpg)\
  \ Debian 包命名\n\n![images](img/bull.jpg) 使用 `dpkg` 安装软件包\n\n![images](img/bull.jpg)\
  \ 使用 `apt-cache` 查看包信息\n\n![images](img/bull.jpg) 使用 `apt-get` 安装软件包\n\n![images](img/bull.jpg)\
  \ 使用 aptitude\n\n让我们先看看 Debian 软件包使用的命名规范。\n\n### Debian 包命名\n\nDebian 包使用的命名规范与\
  \ RPM 包使用的相似。语法为 `packagename_**version*_*architecture*.deb`（例如，`3dchess_0.8.1-16_i386.deb`）。\n\
  \n以下是如何解释 Debian 包文件名的详细说明：\n\n![images](img/bull.jpg) ***packagename*** 类似于 RPM\
  \ 包名，它仅提供了包的名称。在示例中，应用程序的名称是 `3dchess`。\n\n![images](img/bull.jpg) ***version***\
  \ 指定软件包的版本号。在示例中，它是 `0.8.1-16`。\n\n![images](img/bull.jpg) ***architecture*** 指定软件包运行的硬件架构。在示例中，`i386`\
  \ 表示该将在 Intel 80386 或更新 CPU 上运行。\n\n与 RPM 包一样，Debian 包包含依赖信息。在安装给包之前，必须先安装它所依赖的所有包。\n\
  \n![Images](img/tip.jpg)\n\n**提示** 你可以从 [`packages.debian.org`](http://packages.debian.org)\
  \ 下载大量的 Debian 包。\n\n有了，让我们讨论如何安装 Debian 软件包。\n\n### 使用 dpkg 安装软件包\n\n与 RPM 包一样，大多数发行版有两种方法来安装\
  \ Debian 软件包。第一种是使用良好的图形化工具。例如，在 Ubuntu 上你可以使用 Ubuntu 软件中心。该工具允许你使用 GUI 菜单系统管理你的\
  \ Debian 软件包，如图 8-8 所示。\n\n![Images](img/f0291-01.jpg)\n\n**图 8-8** 使用 Ubuntu 软件中心安装软件包\n\
  \n\n\n\n\n就像我们之前看到的 RPM 图形化工具一样，Ubuntu 软件中心（Ubuntu Software Center）允许你安装新软件包、删除已安装软件包以及更新已安装的软件包。它从配置的仓库下载软件包。它还能自动计算包依赖关系并为你安装。\n\
  \n然而，尽管这些图形化包管理工具非常好，但它们不在 LPCI-1/Linux+ 考试范围内。要通过这项考试，你必须学会如何使用命令行工具管理软件包。\n\n\
  管理 Debian 软件包的关键命令行工具是 `dpkg`。使用 `dpkg` 的语法为：\n\n`dpkg options action package_name`\
  \ 或 `package_filename`\n\n你可以在 `dpkg` 命令中使用表 8-3 和表 8-4 中列出的操作和选项。\n\n![Images](img/t0292-01.jpg)\n\
  \n**表 8-3**   dpkg 命令操作\n\n![Images](img/t0292-02.jpg)\n\n**表 8-4**   dpkg 命令选项\n\
  \n例如，如果你下载了一个名为 `3dchess_0.8.1-16_i386.deb` 的软件包并想安装它，首先要在 shell 提示符下使用 `cd` 命令进入文件所在的目录。然后，以\
  \ root 身份在 shell 提示符下输入 `dpkg –i 3dchess_0.8.1-16_i386.deb`，如下所示：\n\n![Images](img/p0292-01.jpg)\n\
  \n注意在该命令中，我必须输入软件包的完整文件名，因为它尚未安装。软件包安装后，你只需要通过包名即可引用它。例如，要查看我们刚刚安装的 `3dchess` 软件包的信息，你会在\
  \ shell 提示符下输入 `dpkg –p 3dchess`，如下所示：\n\n![Images](img/p0293-01.jpg)\n\n同样，你可以使用\
  \ `dpkg –r 3dchess` 命令卸载 `3dchess` 软件包，如下所示：\n\n![Images](img/p0293-02.jpg)\n\n\
  现在你已经知道如何使用 `dpkg` 管理软件包，让我们接下来来看 `apt-cache` 命令。\n\n### 使用 apt-cache 查看软件包信息\n\n\
  除了 `dpkg` 之外，你还可以使用几个 `apt`（高级包工具）工具在基于 Debian 的系统上管理软件包。你需要熟悉的第一个 `apt` 工具是 `apt-cache`。该命令与\
  \ `rpm –q` 命令相当，因为它用于从 Debian 软件包数据库（称为 `package cache`）中查询软件包信息。常用的 `apt-cache`\
  \ 命令如表 8-5 所示。\n\n![Images](img/t0294-01.jpg)\n\n**表 8-5**   常用 apt-cache 命令\n\n\
  例如，要检查之前处理的 `3dchess` 软件包是否已安装在系统中，你可以在 shell 提示符下输入 `apt-cache pkgnames 3dchess`，如下所示：\n\
  \n![Images](img/p0293-03.jpg)\n\n要查看 `3dchess` 软件包的信息，你可以在 shell 提示符下输入 `apt-cache\
  \ showpkg 3dchess`，如下所示：\n\n![Images](img/p0294-01.jpg)\n\n要查看 `3dchess` 软件包的依赖信息，你会在\
  \ shell 提示符下输入 `apt-cache depends 3dchess`，如下所示：\n\n![Images](img/p0294-02.jpg)\n\
  \n现在你已经理解了如何使用 `apt-cache`，接下来你需要学习 `apt-get`。\n\n### 使用 apt-get 安装软件包\n\n除了 `apt-cache`\
  \ 之外，`apt` 工具套还包括 `apt-get` 工具，它等同于 RPM 系统上的 `yum` 工具。它会自动为你下载并安装软件包（以及所有依赖包）。\n\
  \n`/etc/apt/sources.list` 文件定义了 `apt-get` 可以安装软件包的仓库。与 `yum` 一样，这些仓库可以存在于本地光盘（如你的安装光盘）、本地硬盘或互联网上的服务器上（通过\
  \ `HTTP` 或 `FTP` 协议）。这里显示了一个示例 `sources.list` 文件：\n\n![Images](img/p0295-02.jpg)\n\
  \n软件包仓库在该文件中通过前缀 `deb` 标识，而源文件仓库则通过 `deb-src` 标识。在前缀之后指定了仓库的 URL。\n\n使用 `apt-get`\
  \ 的语法非常简单：\n\n`apt-get options command package_name`\n\n常用的 `apt-get` 命令和选项分别列表\
  \ 8-6 和表 8-7 中。\n\n![Images](img/t0296-01.jpg)\n\n**表 8-6**   常用 apt-get 命令\n\n\
  ![Images](img/t0296-02.jpg)\n\n**表 8-7**   常用 apt-get 选项\n\n例如，如果你想用 `apt-get` 安装新软件包，你（以\
  \ root 身份）输入 `apt-get install package_name`。如果你想安装 Blender 3D 建模软件，你会在系统的 shell\
  \ 提示符下输入 `apt-get install blender`。这是一个示例：\n\n![Images](img/p0295-03.jpg)\n\n![Images](img/p0296-01.jpg)\n\
  \n如此示例所示，`apt-get` 在其配置的仓库之一找到了 Blender 软件包，计算了依赖关系，然后在安装之前提示用户开始下载所需的软件包。这有多简单呢？这里是一些额外的示例\
  \ `apt-get` 命令：\n\n![images](img/bull.jpg) `apt-get upgrade package_name` 将软件包升级到最新版本\n\
  \n![images](img/bull.jpg) `apt-get remove package_name` 卸载指定的软件包\n\n![images](img/bull.jpg)\
  \ `apt-get dist-upgrade` 升级系统上安装的所有软件包\n\n接下来，让我们来看看使用 `aptitude` 工具。\n\n### 使用\
  \ aptitude\n\n在本章中目前为止介绍过的所有 `apt` 工具都是命令行工具。然而，该工具套还提供了一个基于文本、菜单驱动的包管理工具，非常方便用，名为\
  \ `aptitude`。你只需在 shell 提示符下输入 `aptitude` 即可运行它。这样做时，将显示图 8-9 所示的界面。\n\n![Images](img/f0297-01.jpg)\n\
  \n**图 8-9**   使用 aptitude 管理软件包\n\n你可以使用 `aptitude` 执行几乎 `dpkg` 或 `apt-get` 能做的任何操作。你可以安装软件包、卸载软件包和更新软件包。例如，要安装新软件包，你可以向下方向键并选择\
  \ `Not Installed Packages`（未安装软件包）；然后浏览到你想要安装的软件包并按 `G`。你也可以按 `CTRL-T` 访问 `aptitude`\
  \ 菜单，如图 8-10 所示。`aptitude` 工具也可以在命令行模式下使用，语法如表 8-8 所示。\n\n![Images](img/f0298-01.jpg)\n\
  \n**图 8-10**   访问 aptitude 菜单\n\n![Images](img/t0298-01.jpg)\n\n**表 8-8**   命令行\
  \ aptitude 命令\n\n现在你已经了解如何在 Linux 系统上管理 RPM 和 Debian 软件包，你需要学习管理共享库。让我们接下来来看这一点。\n\
  \n### 管理共享库\n\n除了检查软件包依赖关系之外，你可能还需要验证系统是否正确配置以访问运行所需的库。在本章的这部分，你将学习如何做到。将涉及以下主题：\n\
  \n![images](img/bull.jpg) 共享库的工作原理\n\n![images](img/bull.jpg) 管理共享库依赖\n\n让我们从讨论共享库的工作原理开始。\n\
  \n#### 共享库的工作原理\n\n在 Linux 上，运行在系统的应用程序可以共享称为共享库的代码元素。这非常有用。共享库使得软件开发人员每次编写新程序时都不需要重复发明轮子。\n\
  \n想想，很多功能在许多程序中都是常用的。例如，打开文件、保存文件和关闭打开文件的过程无论使用什么种应用程序都是相同的。如果没有共享库，程序员必须将完成这些基本任务的代码包含在他们编写的每个应用程序中。这是多么浪费时间和资源啊！\n\
  \n\n\n\n\n**提示** Linux 中的共享库工作方式与 Windows 系统上的动态链接库（`DLLs`）非常相似。\n\n使用共享库有许多好处。显然，它极大地缩短了开发时间。它还能让编写的程序更小、更精简。\n\
  \nLinux 上有两种类型的共享库：\n\n![images](img/bull.jpg) **动态** 动态共享库以文件形式存在于 Linux 文件系统中。程序员只需在程序代码中插入指向这些共享库中函数的链接即可。当程序运行时，这些函数是从动态共享库中被调用的，而不是集成到程序本身中。系统上的一个配置文件包含了已安装的动态共享库列表以及它们在文件系统中的所在位置。使用动态共享库可以减小编译后可执行文件的总体大小。然而，它们会产生依赖问题。如果程序调用的系统未安装（由于某种原因无法使用）的动态共享库函数，应用程序将无法运行。\n\
  \n![images](img/bull.jpg) **静态** 与动态共享库不同，静态共享库在编译时被静态链接到程序中。从本质上说，对于静态库，调用函数的实际代码元素被直接集成到应用程序中。显然，这会导致应用程序体积较大。然而，它的优势是使应用程序独立于运行它的系统是否安装了共享库，而动态库的情况并非如此。\n\
  \n哪种类型最好？这取决于应用程序。你日常使用的大多数应用程序使用动态共享库。这允许它们在硬盘上占用较小空间的情况下提供很多功能。然而，也有许多应用程序使用静态库，特别是那些设计用于帮助你救援故障系统的应用程序。这些应用程序不是链接到动态共享库（在系统救援场景中可能无法使用），而是完全自包含的，并且可以在最小的\
  \ Linux 环境下运行。\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 使用静态共享库应用程序的一个良好示例是独立式\
  \ Shell（`sash`）。它设计用于帮助你救援崩溃的 Linux 系统，并在 Shell 本身中内置了许多功能。这样，即使存放共享库的分区损坏了，程序仍然可以运行，并允许你执行有用的任务来救援系统。\n\
  \n共享库文件使用特殊的命名格式来帮助你识别它是哪种类型的共享库。该语法如下：\n\n`libname.type.version`\n\n注意，所有共享库的文件都以\
  \ `lib` 开头。后面是共享库的。文件名中的 `type` 部分标识共享库的类型。这里的字符“so”表示该文件是动态共享库，而“a”表示文件是静态库。文件名中的\
  \ `version` 部分指定了库的版本号。例如，`libfreetype.so.6.4.0` 是一个动态共享库。\n\n考虑到这些，让我们讨论如何管理共享库依赖。\n\
  \n### 管理共享库依赖\n\n如前所述，Linux 使用一个配置文件告诉运行在系统上的应用程序它们可以在系统的何处找到动态共享库文件。使用这种配置为应用程序开发者提供了一定程度的独立性。他们不需要担心程序运行时共享库将位于何处。他们让配置文件告诉程序它们所在的位置，无论它们在特定的\
  \ Linux 系统上处于什么位置。\n\n动态共享库配置文件是 `/etc/ld.so.conf`。这是一个示例文件：\n\n![Images](img/p0300-01.jpg)\n\
  \n正如此示例所示，该文件仅包含文件系统中存储共享库文件的路径列表。链接到这些文件中函数的应用程序可以搜索这些路径来定位合适的库。\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** `/lib/` 和 `/usr/lib/` 目录始终认为包含共享库，因此它们没有列在 `/etc/ld.so.conf` 文件中。\n\n要查看\
  \ Linux 系统上所有可用共享库的列表，在 shell 提示符处输入 `ldconfig –p`。例如：\n\n![Images](img/p0301-01.jpg)\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 如果你没有以 root 登录，必须在命令中指定 `ldconfig` 的完整路径（`/sbin/ldconfig`）。\n\
  \n你也可以使用 `ldd` 命令查看特定应用程序所需的共享库。语法为 `ldd –v executable_filename`。例如，如果你想查看 `ip`\
  \ 命令（用于管理网络连接）需要哪些共享库，可以在 shell 提示符处输入 `ldd –v /sbin/ip`。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 使用 `ldd` 命令时，需要指定可执行文件的完整路径以及文件名。\n\n接下来显示一个示例：\n\n![Images](img/p0301-02.jpg)\n\
  \n`ldd` 命令的一个关键用途是检查共享库依赖。它确定了目标应用程序所需的所有库是否已经安装。如果已安装，你将不会看到任何错误消息，正如前面的示例所示。如果缺少库文件，则会显示错误消息。然后你可以定位并安装缺失的库，一切都会好起来。\n\
  \n那么，应用程序在尝试定位共享库时知道在哪些目录查找呢？应用程序实际上并没有检查 `/etc/ld.so.conf` 文件。相反，它们检查库缓存和 `LD_LIBRARY_PATH`\
  \ 环境变量。库缓存是 `/etc/ld.so.cache`。该文件包含所有系统库的列表，并在系统首次启动时刷新。\n\n这是关键。如果你向 `/etc/ld.so.conf`\
  \ 文件添加了新的动态库目录，当你尝试运行链接到该目录中库的应用程序时，你会感到非常沮丧。因为库缓存尚未更新新信息。要解决这个问题，你有两个选择：\n\n![images](img/bull.jpg)\
  \ *使用 ldconfig*。使用 `ldconfig` 命令手动重建库缓存。\n\n![images](img/bull.jpg) *设置 LD_LIBRARY_PATH*。你也可以将路径添加到\
  \ `LD_LIBRARY_PATH` 环境变量。你可能想将新路径添加到变量中可能存在的目录列表的末尾，因此你应该使用以下命令：\n\n![Images](img/p0302-02.jpg)\n\
  \n通常情况下，第一种方案是首选的。这确保了即使系统重启，共享库对需要它的应用程序也始终可用。我通常只在不同目录安装了同一个共享库的两个版本，并且我想使用其中一个而不是另一个时，才设置\
  \ `LD_LIBRARY_PATH` 的值。\n\n### 练习 8-6：使用共享库\n\n在此练习中，你将练习管理共享库。你可以使用书中随附的虚拟机进行此练习。运行快照\
  \ 8-3 以获得正确的环境。\n\n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 8-6 视频演示如何执行此任务。\n\
  \n完成以下操作：\n\n1. 在系统运行时，打开终端会话。\n\n2. 如必要，输入 `su –` 后跟你的 root 用户密码切换到 root 用户账户。\n\
  \n3. 在 shell 提示符处输入 `ldd –v /bin/ping` 查看你系统中 `ping` 可执行文件所使用的共享库。你应该看到 ping 需要\
  \ `libc.so.6` 共享库。\n\n\n\n\n\n### 总结\n\n4. 通过 shell 提示符输入 `find / –name libc.so.6`\
  \ 来查找系统中 `lib64/libc.so.6` 文件的位置。在 32 位系统上，你应该看到该文件位于 `/lib`。在 64 位系统上，它可能位于 `/lib64`。\n\
  \n5. 在 shell 提示符输入 `ldconfig –p` 查看系统的库缓存。\n\n6. 在 shell 提示符输入 `ldconfig –v` 重新构建库缓存。\n\
  \n本章就到此结束！`apt`、`tarball` 和 `rpm` 等术语不再让你感到恐惧了，因为你已经知道如何在 Linux 系统上有效地管理软件了！\n\n\
  ### 章节复\n\n在本章中，我们讨论了如何在 Linux 系统上管理软件。我首先指出，可以使用图形化工具或命令行工具来管理 Linux 上的软件。我强调，一个良好的\
  \ Linux 管理员不应该依赖图形化工具来管理软件，他或她应该学会如何使用命令行软件管理工具。我还指出，并不是所有软件都可以使用图形化程序进行管理。事实上，LPIC-1/Linux+\
  \ 考试严格关注命令行工具。\n\n我们首先查看了管理 RPM 软件包。我指出 RPM 将已安装软件包的信息存储在 RPM 数据库文件（`/var/lib/rpm`）中。我花时间回顾了获取\
  \ Linux 软件的各种资源，这些包括：\n\n* ![images](img/bull.jpg) 你的安装 CD 或 DVD\n* ![images](img/bull.jpg)\
  \ 开源项目网站\n* ![images](img/bull.jpg) [www.rpmfind.net](http://www.rpmfind.net)\n\
  * ![images](img/bull.jpg) [www.sourceforge.net](http://www.sourceforge.net)\n* ![images](img/bull.jpg)\
  \ [linux.tucows.com](http://linux.tucows.com)\n* ![images](img/bull.jpg) [www.freshmeat.net](http://www.freshmeat.net)\n\
  * ![images](img/bull.jpg) [www.linux.org](http://www.linux.org)\n\n我指出，应尽可能使用校验和来验证你下载的内容。你可以对下载的文件使用\
  \ `sum` 命令生成校验和，并将其与获取文件的网站上提供的校验和进行对比。\n\n你应该熟悉使用 RPM 软件包安装软件的过程。我指出，你必须使用包管理器来管理软件包，例如\
  \ Red Hat 软件包管理器 (RPM)。RPM 软件包是预编译的软件包，包管理器可以将它们安装到你的系统上。因为它们是预编译的，所以在安装之前需要验证给定软件包是否与你的系统兼容。为了做到，你需要查看软件包文件名。文件名包含以下信息：\n\
  \n* ![images](img/bull.jpg) 软件包名\n* ![images](img/bull.jpg) 版本号\n* ![images](img/bull.jpg)\
  \ 发布号\n* ![images](img/bull.jpg) 兼容的发行版（可选）\n* ![images](img/bull.jpg) 架构类型\n\n\
  你可以输入 `rpm --checksig` 在安装前验证 RPM 软件包的数字签名。然后你可以输入 `rpm –i` 实际上将软件包文件安装到系统中。我指出，许多\
  \ RPM 软件包依赖于系统中安装了其他软件包才能正常工作。如果缺少这些软件包，软件将无法运行。`rpm` 工具在安装新软件包之前会自动检查是否安装了依赖软件。你也可以运行\
  \ `rpm --test` 在安装前检查依赖关系。\n\n你还应该熟悉从 Linux 系统中卸载软件的流程。要卸载 RPM 软件包，输入 `rpm –e`。\n\
  \n我还指出，你可以使用 `rpm` 命令将现有软件包更新到新版本。这是通过使用 `rpm –U` 命令实现的。`rpm` 命令还可以用于查询和验证 RPM 软件包。要查询软件包，使用\
  \ `rpm` 的 `-q` 选项。要验证软件包，使用 `-V` 选项。如果你确定某个软件包已损坏，可以通过输入 `rpm –U --replacepkgs`\
  \ 重新安装现有软件包。\n\n接下来，我们查看了使用 `yum` 命令作为 `rpm` 的替代方案。我指出，`yum` 允许你通过一个命令下载并安装软件包及其所有的依赖项。我们查看了常用的\
  \ `yum` 命令，例如 `yum install packagename` 和 `yum remove packagename`。如果你只想下载文件而不安装，可以使用\
  \ `yumdownloader` 命令代替 `yum`。我们查看了 `yum.conf` 文件，这是 `yum` 的配置文件。它定义了软件仓库 URL 及其名称（`yum`\
  \ 在其中搜索软件包），以及下载的软件包保存目录（`cachedir`）以及 `yum` 日志文件（`logfile`）的保存位置。我还指出，仓库信息可以存储在此文件中，也可以存储在\
  \ `/etc/yum.repos.d` 目录下名为 `filename.repo` 的独立文件中。\n\n然后我们讨论了从源代码安装软件的流程。我指出，大多数以此方式安装的软件都是以\
  \ tarball 格式分发的。下载文件后，你需要使用 `tar –zxvf` 命令从 tarball 文件中提取文件。提取完成后，切换到 tarball 解压时创建的新目录并运行\
  \ `./configure`。该脚本会检查你的系统并创建 `Makefile` 文件。然后你运行 `make` 命令从源码创建二进制可执行文件。完成后，你使用\
  \ `make install` 命令将可执行文件安装到系统中。从源码安装的软件将使用原始安装文件中的卸载脚本，或 `Makefile` 中通过 `make uninstall`\
  \ 命令调用的卸载目标。\n\n你应该应该熟悉管理 Debian 软件包。基于 Debian 发行版的系统使用 Debian 软件包管理器 (dpkg)。Debian\
  \ 软件包使用的命名法类似于 RPM 软件包：`packagename_version_architecture.deb`。与 RPM 软件包一样，Debian\
  \ 软件包也包含依赖信息。\n\n我们接着查看了使用 `dpkg` 命令安装、卸载、查询和验证 Debian 软件包。我们还查看了 `apt-cache` 命令，它用于从\
  \ Debian 软件包数据库（称为包缓存）查询软件包信息。我还回顾了如何使用 `apt-get`，它是基于 RPM 的系统中 `yum` 的 Debian 端工具。它会自动为你下载并安装软件包（以及所有依赖包）。`/etc/apt/sources.list`\
  \ 文件定义了 `apt-get` 可以从中安装软件包的仓库。我在这章的 Debian 部分结束前，查看了 `aptitude` 工具，它使用基于文本的菜单驱动界面来管理\
  \ Debian 软件包。\n\n我们通过讨论如何管理共享库结束了本章。我指出，运行在系统上的应用程序可以共享被称为*共享库*的代码元素。共享库使得软件开发者不需要每次编写新程序时都重复轮子。Linux\
  \ 应用程序可以使用动态共享库或静态共享库。动态共享库配置文件为 `/etc/ld.so.conf`。它包含了文件系统中存储共享库文件的路径列表。要查看 Linux\
  \ 系统上所有可用的共享库列表，在 shell 提示符输入 `ldconfig –p`。\n\n\n\n\n\n你还可以使用 `ldd` 命令查看特定应用程序所需的共享库。语法为\
  \ `ldd –v 可执行文件文件名.` `。库缓存的路径为 `/etc/ld.so.cache`。该文件包含所有系统库的列表，并在系统首次启动时刷新。如果你将库文件添加到\
  \ `ld.so.conf` 文件未列出的目录中，你必须先添加它们，然后使用 `ldconfig` 命令手动重新构建库缓存。你也可以将路径添加到 `LD_LIBRARY_PATH`\
  \ 环境变量中。\n\n## 加速复\n\n![images](img/bull.jpg) 你可以使用图形界面工具或命令行工具来管理 Linux 软件。\n\n\
