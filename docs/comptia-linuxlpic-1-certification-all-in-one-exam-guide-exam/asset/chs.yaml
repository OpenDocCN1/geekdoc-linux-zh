  \n![images](img/bull.jpg) 对于你的 Linux+/LPIC-1 考试，你需要了解如何使用开源的 GNU 隐私卫 (GPG) 工具来加密文件。\n\
  \n![images](img/bull.jpg) GPG 同时使用非对称加密和对称加密：\n\n![images](img/bull.jpg) GPG 首先生成一个随机对称密钥并使用它来加密要传输的消息。\n\
  \n![images](img/bull.jpg) 对称密钥本身随后使用接收者的公钥进行加密，并与使用对称密钥加密的消息一起发送。\n\n![images](img/bull.jpg)\
  \ 当接收者收到消息时，GPG 首先使用用户的私钥解密对称密钥。\n\n![images](img/bull.jpg) GPG 随后使用解密后的对称密钥解密剩余的消息。\n\
  \n要使用 GPG 加密文件，请执行以下操作：\n\n![images](img/bull.jpg) 使用 `gpg --gen-key` 命令生成你的密钥。\n\
  \n![images](img/bull.jpg) 使用 `gpg –e –r key_user_name filename` 命令加密文件。\n\n![images](img/bull.jpg)\
  \ 文件一旦完成加密，可以使用 `gpg --output output_filename --decrypt encrypted_filename` 命令进行解密。\n\
  \n![images](img/bull.jpg) 如果你想将加密文件发送给他人，可以导出你的公钥并发送给他们：\n\n![images](img/bull.jpg)\
  \ 输入 `gpg --export --armor key_user_email > public_key_filename`。\n\n将此密钥文件发送给想要打开你加密文件的用户。\n\
  \n![images](img/bull.jpg) 用户可以使用 `gpg –import public_key_filename` 命令将你的公钥导入到他们的\
  \ GPG 密钥环中。\n\n![images](img/bull.jpg) 你可以使用 `gpg --list-keys` 命令查看 GPG 密钥环中的文件。\n\
  \n![images](img/bull.jpg) 导入公钥后，你可以使用 `gpg --output output_filename --symmetric\
  \ encrypted_filename` 命令解密发送给你的文件。\n\n![images](img/bull.jpg) 你可以在 shell 提示符输入 `gpg\
  \ --keyserver hkp://subkeys.pgp.net --send-key key_ID` 将你的公钥复制到互联网上的公钥服务器。\n\n![images](img/bull.jpg)\
  \ 在最初创建密钥对后，你应该立即通过 shell 提示符输入 `gpg --output revoke.asc --gen-revoke key_ID` 创建密钥撤销证书。\n\
  \n![images](img/bull.jpg) 要撤销密钥，你必须通过 shell 提示符输入 `gpg --import revocation_certificate_filename`\
  \ 来导入撤销证书。\n\n![images](img/bull.jpg) 如果你使用互联网上的公钥服务器向其他用户分发你的密钥，你需要在 shell 提示符输入来发布密钥撤销：\n\
  \n## Questions\n\n**[1].** 关于对称加密，以下哪些项是正确的？（选择两项。）\n\n**A.** 它使用私钥/公钥对。\n**B.**\
  \ 发送者和接收者都必须拥有相同密钥的副本。\n**C.** RSA 是对称加密的一种。\n**D.** Blowfish 是对称加密的一种。\n**E.**\
  \ 私钥被发送给接收者，以解密用公钥加密的信息。\n\n**[2].** 关于非对称加密，以下哪些项是正确的？（选择两项。）\n\n**A.** 私钥被发送给接收者。\n\
  **B.** 公钥被发送给接收者。\n**C.** 用公钥加密的信息只能用私钥解密。\n**D.** 用公钥加密的信息可以用公钥解密。\n**E.** 用私钥加密的信息可以用私钥解密。\n\
  \n**[3].** 哪些主机文件存储了 SSH 版本 2 服务器使用的私钥？（选择两项。）\n\n**A.** `/etc/ssh/ssh_host_key`\n\
  **B.** `/etc/ssh/ssh_host_key.pub`\n**C.** `/etc/ssh/ssh_known_hosts`\n**D.** `/etc/ssh/ssh_host_rsa_key`\n\
  **E.** `/etc/ssh/ssh_host_dsa_key`\n\n**[4].** `/etc/ssh/sshd_config` 文件中的哪个参数指定了\
  \ `sshd` 进程应该使用哪个版本的 SSH？\n\n**A.** `HostKey`\n**B.** `Protocol`\n**C.** `SSHVersion`\n\
  **D.** `ListenAddress`\n\n**[5].** `/etc/ssh/sshd_config` 文件中的哪个参数配置客户端仅连接到公钥已添加到\
  \ `~/.ssh/known_hosts` 文件的服务器？\n\n**A.** `StrictHostChecking`\n**B.** `HostKey`\n\
  **C.** `Protocol`\n\n**[6].** `sshd` 默认监听哪个端口？\n\n**A.** 20\n**B.** 22\n**C.** 389\n\
  **D.** 5\n**E.** 80\n**F.** 443\n\n**[7].** 哪个命令会将你的 RSA 密钥加载到客户端以连接 SSH 服务器？\n\n\
  **A.** `ssh-keygen -l 1024024`\n**B.** `ssh-keygen -u 1024024`\n**C.** `ssh-keygen\
  \ -lrsa`\n**D.** `sshkeygen 10240024`\n\n**[8].** 你想配置 `sshd` 进程使用公钥认证。在客户端系统的 shell\
  \ 提示符下，可以使用哪个命令为此创建一个 RSA 私钥/公钥？\n\n**A.** `ssh-keygen -t rsa`\n**B.** `ssh-keygen\
  \ -t dsa`\n**C.** `sshkeygen`\n**D.** `rskeygen`\n\n**[9].** `ssh_config` 文件中的哪个参数必须设置为\
  \ `yes` 以启用此功能？\n\n**A.** `AllowForwarding`\n**B.** `AllowX11Tunnel`\n**C.** `Forwarding`\n\
  **D.** `AllowSSunnel`\n\n**[10].** DSA 公钥文件的名称是什么？\n\n**A.** `~/.ssh/id_rsa`\n**B.**\
  \ `~/.ssh/id_dsa`\n**C.** `~/.ssh/id_rsa.pub`\n**D.** `~/.ssh/id_dsa.pub`\n**E.**\
  \ `~/ssh_key.pub`\n\n**[11].** 你已将 RSA 公钥复制到 SSH 服务器上的某个用户目录下。为了启用公钥认证，你需要将公钥添加到哪个文件中的？\n\
  \n**A.** `~/.ssh/authorized_keys`\n**B.** `/etc/ssh/authorized_keys`\n**C.** `~/.ssh/id_rsa`\n\
  **D.** `~/ssh_key.pub`\n**E.** `/etc/ssh/ssh_host_rsa_key.pub`\n\n**[12].** 你想使用\
  \ GPG 加密文件。你应该使用哪个命令创建你的 GPG 私钥/公钥对？\n\n**A.** `gpg –e –r key_user_name filename`\n\
  **B.** `gpg --gen-key`\n**C.** `gpg --export key_user_name > public_key_filename`\n\
  **D.** `gpg --import public_key_filename`\n\n**[13].** 你需要将另一个用户的 GPG 公钥导入你的密钥环中，以便解密她发送给你的文件。哪个命令可以实现此操作？\n\
  \n**A.** `gpg --gen-key`\n**B.** `gpg --import public_key_filename`\n**C.** `gpg\
  \ --list-keys`\n**D.** `gpg --export key_user_name > public_key_filename`\n\n\n\n\
  \n\n### **15.** 一位同事刚刚向你发送了一个 GPG 加密的文件，你需要对其进行解密。假设你已经将该同事的 GPG 密钥导入了你的密钥环，你可以使用哪条命令来解密该文件？\n\
  \n**A.** `gpg --output output_filename --symmetric encrypted_filename`\n\n**B.**\
  \ `gpg --export encrypted_filename > output_filename`\n\n**C.** `gpg --output output_filename\
  \ --decrypt encrypted_filename`\n\n**D.** `gpg --import encrypted_filename output_filename`\n\
  \n### **16.** 你刚刚创建了一个新的 GPG 密钥对。你现在想创建一个撤销证书，以防该密钥在未来的某个时刻被泄露。你应该使用哪条命令？\n\n**A.**\
  \ `gpg --output filename --gen-revoke key_ID`\n\n**B.** `gpg --export encrypted_filename\
  \ > output_filename`\n\n**C.** `gpg --output output_filename --decrypt encrypted_filename`\n\
  \n**D.** `gpg --import filename`\n\n#### **Answers**\n\n**1. B, D.** 在对称加密中，发送者和接收者都必须有一份相同的密钥。Blowfish\
  \ 是一种对称加密的形式。\n\n**2. B, C.** 在非对称加密中，公钥会被发送给接收者。用公钥加密的信息只能用私钥进行解密。\n\n**3. D, E.**\
  \ SSH 版本 2 服务器使用的私钥存储在 `/etc/ssh/ssh_host_rsa_key` 和 `/etc/ssh/ssh_host_dsa_key`\
  \ 中。\n\n**4. B.** `/etc/ssh/sshd_config` 文件中的 `Protocol` 参数指定了 `sshd` 守护进程应该使用哪个版本的\
  \ SSH。\n\n**5. A.** `/etc/ssh/ssh_config` 文件中的 `StrictHostKeyChecking` 参数配置 ssh\
  \ 客户端，使其仅与公钥已添加到 `~/.ssh/known_hosts` 或 `/etc/ssh/ssh_known_hosts` 文件中的 SSH 服务器建立连接。\n\
  \n**6. B.** `sshd` 守护进程默认在端口 `22` 上监听入站的 SSH 连接。\n\n**7. C.** 命令 `ssh -l ksanders\
  \ 10.0.0.254` 将加载 ssh 客户端，并以 ksanders 用户的身份连接到 IP 地址为 `10.0.0.254` 的 SSH 服务器。\n\n\
  **8. A.** `/etc/ssh/sshd_config` 文件中的 `AllowTcpForwarding` 参数必须设置为 `yes` 才能在 SSH\
  \ 客户端和 SSH 服务器之间启用 SSH 隧道。\n\n**9. C.** 用于 X 客户端系统上 `/etc/ssh/ssh_config` 文件中的 `ForwardX11`\
  \ 参数以及 X 服务器系统上 `/etc/ssh/sshd_config` 文件中的该参数，可以为 X 服务器流量启用安全的 SSH 隧道。\n\n**10.\
  \ A.** 可以在 SSH 客户端上使用 `ssh-keygen -t rsa` 命令创建用于 SSH 公钥认证的 RSA 私钥/公钥对。\n\n**11.\
  \ D.** `~/.ssh/id_dsa.pub` 文件是可用于 SSH 公钥认证的 DSA 公钥。\n\n**12. A.** 你需要将公钥添加到你想要通过公钥认证进行身份的用户家目录下的\
  \ `~/.ssh/authorized_keys` 文件中。\n\n**13. B.** `gpg --gen-key` 命令用于创建 GPG 私钥/公钥对。\n\
  \n**14. B.** 使用 `gpg --import public_key_filename` 命令可以将另一个用户的 GPG 公钥导入你的密钥环，以便你可以解密她发送给你的文件。\n\
  \n**15. A.** `gpg --output output_filename --symmetric encrypted_filename` 命令可以解密他人发送给你的文件（假设你已经将该人的\
  \ GPG 密钥导入了你的密钥环）。\n\n**16. A.** `gpg --output filename --gen-revoke key_ID` 命令可以创建一个撤销证书，以防该密钥在未来的某个时刻被泄露。\n\
  \n## **附录 A**\n\n## 预测试\n\n### **说明**\n\n在完成本书各章节的练习题之前，你应该先完成这项预评估测试，以确定你在准备 Linux+/LPIC-1\
  \ 考试时需要重点关注的关键领域。\n\n在本次活动中，你将看到 50 道评估题，这些题目反映了你在真实考试中可能会看到的题目类型。真实考试中使用的客观领域权重在本次活动中进行了估算。\n\
