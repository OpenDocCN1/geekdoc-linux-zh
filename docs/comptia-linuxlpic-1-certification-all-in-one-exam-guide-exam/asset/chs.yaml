  ### 24. B. 应用程序在启动时会检查 `/etc/ld.so.cache` 文件以查找 Linux 系统上共享库的位置。\n\n# 第 9 章 管理 Linux\
  \ 用户和组\n\n在本章中，你将学习到：\n* 理解 Linux 用户和组\n* 管理用户帐户\n* 管理 Linux 组帐户\n\nLinux 的伟大之处之一在于它是一个真正的多用户系统。一个\
  \ Linux 系统可以配置一个、两个、五个或多个用户账户。系统中的每个用户都提供了一个与其身份唯一的计算环境。例如，在图 9-1 所示，当前用户名为 `ksanders`。\n\
  \n注意 `ksanders` 在 `/home/ksanders` 中有她自己的目录。在她的主目录下，她有各种子目录，包括：\n\n* `Desktop`：包含显示在\
  \ `ksanders 桌面面上` 的文件和图标。\n* `Documents`：包含 `ksanders 的文档`。\n* `public_html`：包含\
  \ `ksanders 的个人网页`。\n* `bin`：包含 `ksanders` 可能需要运行的可执行文件和脚本。此目录会自动添加到 `ksanders`\
  \ 用户的 `PATH` 环境中，因此她不需要为存储在此处的任何可执行文件指定完整路径。\n* `Downloads`：包含 `ksanders 浏览器` 从互联网下载的文件。\n\
  * `Music`：包含 `ksanders 的音乐文件`。\n* `Pictures`：包含 `ksanders 的图像文件`。\n* `Videos`：包含\
  \ `ksanders 的视频文件`。\n\n当 `ksanders` 登录系统时，她自己的桌面偏好会被加载，并且可以访问存储在 `/home/ksanders`\
  \ 的文件。如果另一个用户登录，其桌面偏好会被加载，并提供对该用户主目录的访问权限。如果系统已配置在计算机网络上运行，那么用户就可以远程登录系统并访问他们的桌面和主目录，就像他们坐在电脑面前一样。在这种情况下，多个用户可以同时登录并使用同一台计算机。\n\
  \n由于 Linux 是多用户系统，我们需要某种方法来控制谁可以访问系统的什么内容。例如，假设你有一个五个用户帐户的 Linux 系统：`ksanders`、`jelison`、`hsaez`、`ebuchannan`\
  \ 和 `aebbert`。你需要某种方法来确保这些用户中的每个人都能访问他们在文件系统中需要的内容，且仅此。例如，你需要确保 `hsaez` 可以访问她的文件，但不能访问\
  \ `jelison` 的文件和目录。想象一下如果系统上的一个用户可以访问并摆弄属于另一个用户的文件，那将是怎样的一种噩梦。\n\n我在职业生涯早期经历过一次这种事情。我大学毕业后的第一工作是在一家微芯片制造商。这家特定的雇主每天运行几班。为了省钱，白班工人使用的工位和电脑与夜班工人共享。在海军中，他们把这称为“热铺位（hot-bunk）”。由于如此，我与一名夜班员工共享椅子和计算机系统。我在早上\
  \ 8:00 开始上班，而他在早上 7:00 结束工作。我们共享的计算机系统是一台运行 `Windows 3.1` 的、速度极快的 486 DX2 66 系统。\n\
  \n现在，早期版本的 `Windows` 并不是真正的多用户操作系统。事实上，在 `Windows 3.1` 中，你甚至不需要登录。这意味着在任何时间点使用计算机的人对*整个*文件系统拥有完全不受限制的访问权限。在我这种“热铺位”的工作情况下，我的夜班同事对我的文件拥有完全且不受限制的访问权限，我同样在白天访问他的文件。\n\
  \n起初，我们设法相当好地做到互不干扰。然而，随着时间的推移，这变成了一个真正的问题。问题在于，在那个时代，500MB 的硬盘被认为是“尖端技术”，第一批 1GB\
  \ 硬盘刚开始上市（尽管对于我们大多数人来说它们太贵了，无法购买）。\n\n\n\n\n\n由于我们受限于 500MB 的硬盘容量，磁盘空间经常用光。你可能已经猜到发生了什么。在白天，我会在共享系统上需要更多的磁盘空间，于是我会在文件系统中翻找寻找可以删除的文件。我的同事在晚上也做同样的事情。没多久，我们就开始删除对方的重要文件了。正如智者哲学家乔治·卡林（George\
  \ Carlin）所指出的：“你有没有注意到，你的垃圾是‘东西’，而别人的东西是‘垃圾’？”好吧，所以我得稍微修改一下那句引言。毕竟这这是一本家庭账簿。无论如何，我的夜班同事会删除我的“垃圾”以便留出空间保存他的“东西”。而我在白天也会做同样的事情。\n\
  \n这个故事的教训是，你必须实现某种文件系统访问控制，防止用户访问他们不应该访问的“东西”。Linux 正好通过用户、组、所有权和权限来实现这一点。\n\n让我们通过介绍\
  \ Linux 用户和组开始本章。\n\n***\n\n![Images](img/examtip.jpg)\n\n**考试提示** 要想通过 Linux+ 考试，你必须彻底熟悉\
  \ Linux 用户、组、所有权和权限！这些概念是 Linux 系统管理的核心。如果你不理解它们，很可能会通过考试。为了充分准备，你应该理解 Linux 是如何实现用户用户的、系统用户与普通用户的区别，以及如何从命令行管理账户。你还应该知道组在\
  \ Linux 中如何使用，以及如何从命令行管理它们。你还需要理解三种 Linux 权限以及它们如何影响用户对文件系统中文件的访问。你应该知道如何使用命令行工具修改分配给文件或目录的权限。你还需要知道如何使用命令行工具管理文件所有权。\n\
  \n### 理解 Linux 用户和组\n\n为了控制对 Linux 系统及其包含的数据的访问，我们需要做两件事：\n\n![images](img/bull.jpg)\
  \ 我们需要要求用户在获得系统访问之前提供一组凭据。\n\n![images](img/bull.jpg) 我们需要访问控制，以指定单个用户在登录后对文件系统中的文件和目录可以执行的操作。\n\
  \n我们本章中解决第一个条件。为了控制对系统本身的整体访问，我们需要实现用户和组在本章的这一部分，我们将讨论如何实现。具体来说，我们将涵盖：\n\n![images](img/bull.jpg)\
  \ Linux 用户账户\n\n![images](img/bull.jpg) Linux 组\n\n让我们从讨论 Linux 用户账户的工作原理开始。\n\n\
  ### Linux 用户账户\n\n在本章开头我描述的就业状况中，关键问题之一是我的 Windows 3.1 系统没有实现个人用户账户。任何坐在电脑前并打开它的人都无需密码即可完全访问硬盘上的所有数据。无论是我、我的同事、老板、夜间清洁工，还是（更令人担心的）竞争对手的企业间谍。这是这个特定操作系统的巨大缺陷。\n\
  \n为了解决这个问题，我需要一个使用真实用户账户的工作站操作系统。幸运的是，“无用户”操作系统的时代已基本消失。大多数现代操作系统都包含了某种基于用户账户的用户认证系统。Linux\
  \ 特别在这一方面表现非常好。在本章的这一部分，我们将讨论：\n\n![images](img/bull.jpg) Linux 用户账户的工作原理\n\n![images](img/bull.jpg)\
  \ Linux 用户账户的存储位置\n\n![images](img/bull.jpg) 从命令行创建和管理用户账户\n\n让我们从讨论 Linux 用户账户的工作原理开始。\n\
  \n### Linux 用户账户的工作原理\n\n在我们完成书中的各种练习时，你可能已经注意到在使用 Linux 系统之前必须先登录。这被称为*身份验证*。要进行身份验证，你必须提供以下凭据：\n\
  \n![images](img/bull.jpg) 用户名\n\n![images](img/bull.jpg) 密码\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** Linux 系统提供了多种其他身份验证方法。与其手动输入用户名和密码，你可以配置 Linux 使用智能卡、感应卡、生物识别读取器等。这是可能的因为\
  \ Linux 使用 `Pluggable Authentication Modules (PAM)` 来管理系统的身份验证。`PAM` 让 Linux 身份验证变得极其灵活。\n\
  \n登录后，会创建用户唯一的系统环境。在图 9-2 中，`ksanders` 用户已登录本地系统。她的自定义桌面偏好已加载，并获得了对其 `/home/ksanders`\
  \ 主目录的访问权限。\n\n![Images](img/f0319-01.jpg)\n\n**图 9-2** ksanders 桌面环境\n\n如果另一个用户登录同一个系统，将加载他的偏好而不是\
  \ `ksanders` 的偏好。该用户也将获得对其主目录的访问。需要记住的一点是：在特定用户主目录中保存的文件受系统中所有其他用户的保护。例如，如果 `ksanders`\
  \ 在 `/home/ksanders` 中保存文件，该系统上的 `hsaez` 用户将无法访问它们。\n\n默认情况下，所有用户主目录都在 `/home` 目录中创建和维护。例如，在图\
  \ 9-3 中，Linux 系统创建了两个用户账户：`hsaez` 和 `ksanders`。\n\n![Images](img/f0319-02.jpg)\n\
  \n**图 9-3** /home 中的用户账户\n\n这两个用户在 `/home` 中都有创建的主目录。然而，这条规则有一个例外。记住所有的 Linux 系统都使用一个名为\
  \ `root` 的超级用户账户。注意在图 9-3 中，`/home` 下没有为 `root` 用户账户的主目录。`root` 是无家可处的吗？实际上不是。`root`\
  \ 用户也被赋予了一个主目录。但是，它不是维护在 `/home` 中。相反，`root` 用户的主目录是 `/root`。这是 `root` 的主目录，当然，只有\
  \ `root` 可以访问它。\n\n你可以通过 shell 提示符使用 `finger username` 命令查看系统上任何用户账户的信息。例如，如果我想查看我的\
  \ Linux 系统上 `ksanders` 账户的信息，我将输入 `finger ksanders`。当我执行时，会显示关于 `ksanders` 账户的有用信息，如下：\n\
  \n![Images](img/p320-01.jpg)\n\n注意 `finger` 显示了关于 `ksanders` 账户的以下信息：\n\n![images](img/bull.jpg)\
  \ **Login** 这是用于系统身份验证的用户名。\n\n![images](img/bull.jpg) **Name** 这是用户的全名。\n\n![images](img/bull.jpg)\
  \ **Directory** 这是用户的主目录。\n\n![images](img/bull.jpg) **Shell** 这是将由用户启动的默认 shell。\n\
  \n![images](img/bull.jpg) **Last Login** 这显示了用户上次登录的时间和来源。\n\n除了被分配了主目录和默认 shell\
  \ 之外，每个用户账户在创建时还被分配了一个唯一的用户 ID (UID)。系统中没有两个用户账户具有相同的 UID。要查看特定用户账户的 UID，你可以从 shell\
  \ 提示符使用 `id username` 命令。例如，为了查看我们的 `hsaez` 用户账户的信息，我们可以在 shell 提示符处输入 `id hsaez`。这是该命令的输出：\n\
  \n![Images](img/p320-02.jpg)\n\n注意在该系统上，`hsaez` 用户账户被分配了 UID 1003\\。在 SUSE Linux\
  \ 系统上，系统上创建的第一个普通用户账户始终被分配 UID 1000\\。下一个用户账户将被分配 UID 1001\\，依此类推。\n\n\n\n\n然而，其他发行版可能对\
  \ `UID` 使用不同的编号方案。例如，Fedora 系统上的 `UID` 从 500 开始，而不是 1000。接下来，你可以看到这个 Fedora 系统上的\
  \ `rtracy` 用户的 `UID` 为 500，因为它是创建的标准用户账户：\n\n![Images](img/p0320-03.jpg)\n\n注意，前面的段落指的是分配给标准用户账户的\
  \ `UID`。那么 root 用户呢？在大多数 Linux 发行版中，root 用户账户始终被分配 `UID` 0。如下所示：\n\n![Images](img/p0320-04.jpg)\n\
  \n操作系统实际上使用 `UID` 来控制对文件系统中文件和目录的访问。不过，我们现在需要讨论 Linux 用户账户存储在系统的什么位置。让我们接下来来看这一点。\n\
  \n### Linux 用户账户存储何处\n\nLinux 是一个非常灵活的操作系统。其灵活特性之一就是用户账户在系统中的位置。当你最初安装系统时，你的发行版可能会提供几个选项，供你选择存储用户账户的位置。例如，大多数发行版都允许你从以下身份验证方法中进行选择：\n\
  \n![images](img/bull.jpg) **本地** 此选项将用户账户存储在 `/etc/passwd` 文件中。多年来这一直是 Linux 系统使用的默认配置。\n\
  \n![images](img/bull.jpg) **LDAP** 这是许多 Linux 管理员开始越来越多采用的选项。它不再将用户账户存储在文件系统的文件中，而是存储在目录服务中，并通过轻量级目录访问协议（LDAP）访问。与将账户存储在简单扁平文件本地认证不同，目录服务在本质上是层次化的，允许你根据位置、功能或部门对用户账户进行排序和组织。目录数据库可以在多个不同的\
  \ Linux 系统之间进行复制，提供容错能力。该选项的主要优势是它允许你维护一套单一的用户账户，这些账户可以用于许多不同 Linux 系统的认证。\n\n![Images](img/note.jpg)\n\
  \n**注意** 本质上，LDAP 选项让 Linux 向其他使用目录服务的服务器操作系统发展，例如微软的 Active Directory。\n\n![images](img/bull.jpg)\
  \ **NIS** 此选项代表 `Network Information Service`（网络信息服务）。当你有多个都需要相同用户账户的系统时，NIS 也旨在提供集中化的用户账户管理。为了实现这一点，NIS\
  \ 配置所有系统都使用共同的 `passwd` 和 `shadow` 文件。\n\n![images](img/bull.jpg) **Windows 域**\
  \ 如果你的网络中有 Windows 域控制器（或另一个运行 Samba 服务的 Linux 服务器），你可以配置你的 Linux 系统使用域中的用户账户来验证本地系统。\n\
  \n![Images](img/examtip.jpg)\n\n**考试考点** 对于你的 LPIC-1/Linux+ 考试，你需要关注“本地”选项。所有 Linux\
  \ 发行版都可以使用 `/etc/passwd` 和 `/etc/shadow` 文件进行身份验证。\n\n这些选项中哪一个最好？这取决于你需要系统做什么。如果系统是台式工作站，本地选项通常足够了。你也可以可选地使用\
  \ LDAP 选项。\n\n如果你的系统将参与到一个有很多不同用户需要访问你系统的网络，你可能希望考虑使用 LDAP、NIS 或 Windows 域认证。\n\n\
  就我们的目的而言，我们将关注“本地”选项。该选项在文件系统的以下文件中存储用户和组信息：\n\n![images](img/bull.jpg) **/etc/passwd**\
  \ 此文件包含你系统的用户账户信息。\n\n![images](img/bull.jpg) **/etc/shadow** 此文件包含你用户账户的密码。\n\n\
  ![images](img/bull.jpg) **/etc/group** 此文件包含你系统的组。（我们将在本章稍后讨论组。）\n\n让我们先看看 `/etc/passwd`\
  \ 文件。\n\n### /etc/passwd 文件\n\n如果配置为使用本地认证，你的 `/etc/passwd` 文件包含系统的用户账户。你系统上的每个用户账户由文件中的单行表示，例所示：\n\
  \n![Images](img/p0322-01.jpg)\n\n每个账户记录由行中的几个不同字段组成，每个字段由冒号（`:`）分隔。它们的组织方式如下：\n\n\
  `Username:Password:UID:GID:Full_Name:Home_Directory:Default_Shell`\n\n这是一个示例：\n\n\
  `ksanders:x:1002:100:Kimberly Sanders:/home/ksanders:/bin/bash`\n\n以下是这些字段的内容：\n\
  \n![images](img/bull.jpg) **Username** 用户名字段仅用于标识用户在登录系统时提供的用户名。在示例中，它是 `ksanders`。\n\
  \n![images](img/bull.jpg) **Password** 这是一个遗留字段。曾经，用户的密码以加密形式存储在 `passwd` 文件的此字段中。然而，出于安全考虑，密码已从\
  \ `/etc/passwd` 移动到 `/etc/shadow`。（稍后我们会详细查看此文件。）因此，此字段中只显示字符 `x`。\n\n![images](img/bull.jpg)\
  \ **UID** 这是用户账户的用户 ID。我们在本章前面讨论过 `UID`。在示例中，`ksanders` 账户的 `UID` 是 `1002`。\n\n\
  ![images](img/bull.jpg) **GID** 此字段引用用户默认组的组 ID。在示例中，`ksanders` 账户的 `GID` 是 `100`。正如你在本章稍后看到的，这引用了用户组。\n\
  \n![images](img/bull.jpg) **Full_Name** 此字段包含用户的全名。在示例中，它是 `Kimberly Sanders`。\n\
  \n![images](img/bull.jpg) **Home_Directory** 此字段包含用户家目录的路径。在这种情况下，家目录是 `/home/ksanders`。\n\
  \n![images](img/bull.jpg) **Default_Shell** 此字段指定了默认使用的 shell。对于 `ksanders`，这是 `/bin/bash`（Bourne-Again\
  \ SHell）。\n\n任何 Linux 系统上的 `/etc/passwd` 文件中实际上列出了很多用户账户，即使你只创建了一两个账户。所有其他用户账户都是*系统*用户账户。这里显示了三个系统用户账户：\n\
  \n![Images](img/p0323-01.jpg)\n\n系统用户账户用于登录。相反，它们供运行在系统上的服务使用。当这些服务之一需要在 Linux 文件系统中执行操作时，它们是以\
  \ `/etc/passwd` 中关联的用户账户身份执行的。注意，与标准用户账户相比，系统用户的 UID 数字要小得多。取决于发行版，0 到 499 之间的 UID\
  \ 通常留给系统账户。\n\n例如，假设我登录了 Linux 系统上的 ftp 服务并上传了一个文件。该文件需要写入文件系统中 ftp 服务的默认目录。当写入时，它是以\
  \ `ftp` 用户身份执行的。通过这样做，可以使用权限（在本章稍后讨论）来控制特定服务可以或不能做什么。\n\n让我们来看 `/etc/shadow` 文件。\n\
  \n### /etc/shadow 文件\n\n对于大多数使用本地认证的 Linux 发行版，你用户的密码将以加密格式存储在 `/etc/shadow` 文件中。该文件与我们之前讨论的\
  \ `/etc/passwd` 文件链接。`/etc/passwd` 中列出的每个用户账户在 `/etc/shadow` 中都有对应的项，例所示：\n\n![Images](img/p0323-02.jpg)\n\
  \n与 `/etc/passwd` 一样，每个用户账户由 `/etc/shadow` 文件中的单行表示。每个记录由以下字段组成，每个字段由冒号分隔：\n\n![Images](img/p0323-03.jpg)\n\
  \n例如，`ksanders` 的记录如下：\n\n![Images](img/p0323-04.jpg)\n\n以下是这些字段字段的内容：\n\n![images](img/bull.jpg)\
  \ **Username** 这是来自 `/etc/passwd` 的用户登录名。\n\n\n\n\n![images](img/bull.jpg) **Password（密码）**\
  \ 这是加密格式的用户密码。在前面的示例中，`ksanders` 的密码是 `M3linux273\\`。然而，为了防止他人访问 `/etc/shadow` 文件并从中获取用户密码，它是以加密格式存储的。你可能会注意到，所有系统用户账户的此字段都有一个简单的星号（`*`）。这表示这些账户不允许登录系统。例如，如果我尝试以\
  \ `ftp` 身份登录系统，即使 `ftp` 用户账户存在，也会被拒绝访问。\n\n![images](img/bull.jpg) **Last_Modified（最后修改时间）**\
  \ 该字段显示自 1970 年 1 月 1 日以来密码最后一次更改的天数。在这个示例中，已经是 `15,043` 天。\n\n![images](img/bull.jpg)\
  \ **Min_Days（最小天数）** 该字段显示更改密码前所需的最少数。在这个示例中，它被设置为 0 天。\n\n![images](img/bull.jpg)\
  \ **Max_Days（最大天数）** 该字段显示必须更改密码的最大天数。在这个示例中，它被设置为 `99,999` 天。有效来说，这意味着不需要更改密码。\n\
  \n![images](img/bull.jpg) **Days_Warn（警告天数）** 该字段显示在密码过期前多少天用户会收到密码即将过期的警告。在这种情况下，它被设置为\
  \ 7 天。\n\n![images](img/bull.jpg) **Disabled_Days（禁用天数）** 该字段显示在密码过期后等待多少天将禁用该账户。在这个示例中，它被设置为空值。\n\
  \n![images](img/bull.jpg) **Expire（过期时间）** 该字段显示自 1970 年 1 月 1 日以来，账户将被禁用的天数。在这个示例中，它被设置为空值，表示该账户永不过期。\n\
  \n如你所见，这两个文件保持同步非常重要。如果它们出现错乱，那么用户可能无法登录，或者服务可能无法正确访问文件系统。\n\n好消息是，这些文件通常会按照预期保持同步，无需管理员干预。我看到这两个文件变得不同步的唯一情况是管理员决定使用文本编辑器手动编辑这些文件时。我强烈不建议这样做。你的\
  \ Linux 系统包含了多种用于管理系统用户账户和密码的工具。（我们将在本章稍后讨论如何使用这些工具。）你应该始终使用这些工具而不是文本编辑器来管理用户账户。这样做可以确保两个文件都得到适当的编辑并保持同步。\n\
  \n要验证你的 `/etc/passwd` 和 `/etc/shadow` 文件，你可以使用 `pwck`。此工具将检查文件并在屏幕上报告任何错误，如示例所示：\n\
  \n![Images](img/p024.jpg)\n\n### 从命令行创建和管理用户账户\n\n正如我们遇到的，你可以通过图形化工具或从命令行管理用户账户。例如，`useradd`\
  \ 用于创建。\n\n![images](img/bull.jpg) **图 9-4**\n\n该字段显示自 1970 年 1 月 1 日以来密码最后一次更改的天数。在这个示例中，已经是\
  \ `15,043` 天。\n\n![images](img/bull.jpg) **Min_Days**\n\n该字段显示更改密码前所需的最少数。在这个示例中，它被设置为\
  \ 0 天。\n\n![images](img/bull.jpg) **Max_Days**\n\n该字段显示必须更改密码的最大天数。在这个示例中，它被设置为\
  \ `99,999` 天。有效来说，这意味着不需要更改密码。\n\n![images](img/bull.jpg) **Days_Warn**\n\n该字段显示在密码过期前多少天用户会收到密码即将过期的警告。在这种情况下，它被设置为\
  \ 7 天。\n\n![images](img/bull.jpg) **Disabled_Days**\n\n该字段显示在密码过期后等待多少天将禁用该账户。在这个示例中，它被设置为空值。\n\
  \n![images](img/bull.jpg) **Expire**\n\n该字段显示自 1970 年 1 月 1 日以来，账户将被禁用的天数。在这个示例中，它被设置为空值，表示该账户永不过期。\n\
  \n如你所见，这两个文件保持同步非常重要。如果它们出现错乱，那么用户可能无法登录，或者服务可能无法正确访问文件系统。\n\n好消息是，这些文件通常会按照预期保持同步，无需管理员干预。我看到这两个文件变得不同步的唯一情况是管理员决定使用文本编辑器手动编辑这些文件时。我强烈不建议这样做。你的\
  \ Linux 系统包含了多种用于管理系统用户账户和密码的工具。（我们将在本章稍后讨论如何使用这些工具。）你应该始终使用这些工具而不是文本编辑器来管理用户账户。这样做可以确保两个文件都得到适当的编辑并保持同步。\n\
  \n要验证你的 `/etc/passwd` 和 `/etc/shadow` 文件，你可以使用 `pwck`。此工具将检查文件并在屏幕上报告任何错误，如示例所示：\n\
  \n![Images](img/p024.jpg)\n\n### 从命令行创建和管理用户账户\n\n正如我们遇到的，你可以通过图形化工具或从命令行管理用户账户。例如，`useradd`\
  \ 用于创建。\n\n`useradd` 用于创建账户。要查看默认值，可以在提示符处使用 `useradd -D`。\n\n![images](img/bull.jpg)\
  \ **/login.defs**\n\n该文件包含可用于 `useradd` 的值。它还指定了新账户的 GID 和 UID。在本章较早之前，我们注意到 SUSE\
  \ 的 UID 从 1000 开始，而 Fedora 从 500 开始。这种行为源于此文件。它还定义了系统账户的 UID 范围，以及当你运行 `useradd`\
  \ 或 `userdel` 时要运行的可执行文件。如果你不喜欢默认值，可以随时编辑此文件以匹配你的喜好。\n\n![images](img/bull.jpg)\
  \ **/etc/skel**\n\n`useradd` 命令在创建新用户时，会从骨架目录（默认为 `/etc/skel`）复制文件到新创建的主目录。通常，`/etc/skel`\
  \ 还包含若干用户配置，如 `.bashrc` 和 `.profile`。这是一个示例：\n\n![Images](img/p027.jpg)\n\n你可以向此目录添加任何文件和目录，以便每个用户在系统上创建账户时默认拥有这些内容。\n\
  \n在运行 `useradd` 时，你可以通过在命令行指定选项列表来覆盖这些默认值。你可以使用以下选项：\n\n- `-c`: 用户的全名。\n- `-e`:\
  \ 指定用户账户被禁用的日期。日期格式为 *yyyy*-*mm*-*dd*。\n- `-f`: 指定密码过期后禁用账户前的天数。使用值 `–1` 来禁用此功能（例如，`useradd\
  \ -f -1 jmcarthur`）。\n- `-g`: 指定用户的默认组。\n- `-G`: 指定用户要加入的附加组。\n\n\n\n\n\n![images](img/bull.jpg)\
  \ `–M` 指定创建用户账户时不创建家目录。\n\n![images](img/bull.jpg) `–m` 指定用户的家目录。\n\n![images](img/bull.jpg)\
  \ `–n` 仅用于 Red Hat 和 Fedora 系统。在默认情况下，这些发行版在每次创建账户时都会创建一个与用户名同名的新组。使用此选项将关闭此功能。\n\
  \n![images](img/bull.jpg) `–p` 指定用户的加密密码。你可以使用 `openssl passwd -crypt` 命令对你想要使用的密码进行加密。运行此命令，并在提示时输入你想分配给用户账户的密码。该命令将在屏幕上输出密码的加密版本。然后可以使用\
  \ `useradd` 和 `usermod` 命令的 `-p` 选项使用该加密密码。\n\n![images](img/bull.jpg) `–r` 指定所创建的用户为系统用户。\n\
  \n![images](img/bull.jpg) `–s` 指定用户的默认 shell。\n\n![images](img/bull.jpg) `–u` 手动为用户指定\
  \ UID。\n\n例如，假设我想在 Linux 系统上为名为 Jackie McArthur 的用户创建一个新用户账户。进一步假设我想指定用户名为 `jmcarthur`，全名为\
  \ `Jackie McArthur`，密码为 `tux123`，并创建一个家目录。为了做到这一点，我将首先使用 `openssl passwd -crypt`\
  \ 命令加密 `tux123` 密码，它返回 `1k4LGDSCsTuQE` 作为密码的加密版本。然后，我在 shell 提示符下输入 `useradd –c\
  \ “Jackie McArthur” –m –p “1k4LGDSCsTuQE” –s “/bin/bash” jmcarthur`。执行后，账户将创建在 `/etc/passwd`\
  \ 中，如下：\n\n![Images](img/p0328-01.jpg)\n\n注意 `useradd` 使用了我们在命令行中指定的参数。对于我们没有指定的参数（例如\
  \ GID 和 UID），则使用了来自 `/etc/default/useradd` 的默认值。\n\n接下来让我们来看 `passwd` 工具。\n\n###\
  \ `passwd`\n\n`passwd` 工具用于更改现有用户的密码。例如，早些我们用 `useradd` 创建了一个名为 `lmorgan` 的新用户。然而，由于我们没有在命令行中使用\
  \ `-p` 选项，`lmorgan` 账户没有密码且被锁定。你可以使用 `passwd` 的 `-S` 选项来查看此。例如，我们可以在 shell 提示符下输入\
  \ `passwd –S lmorgan`，如下：\n\n![Images](img/p0328-02.jpg)\n\n注意输出中显示了 `LK`。这表示账户已锁定。其余参数是各种其他密码参数，例如最后一次修改密码日期、更改密码前所需的最小天数、必须更改密码的最大天数、密码过期前提醒用户即将过期的天数，以及密码过期后禁用账户的等待天数。\n\
  \n简而言之，该账户是不可用的。要启用此账户，我们需要添加密码。我们可以使用 `passwd` 来做到。语法为 `passwd *username*.`。在这种情况下，你将（以\
  \ root 身份）输入 `passwd lmorgan`。当你这样做时，系统会提示你为指定用户输入密码，如下：\n\n![Images](img/p0328-03.jpg)\n\
  \n在提示处输入你想要使用的密码。之后，你可以再次输入 `passwd –S lmorgan` 来查看账户状态，如下所示：\n\n![Images](img/p0328-04.jpg)\n\
  \n注意账户状态被设置为 P，表示密码已设置且有效。在使用 `passwd` 时，你还可以使用以下选项：\n\n![images](img/bull.jpg)\
  \ `–l` 锁定用户账户。此选项使用户的密码失效。\n\n![images](img/bull.jpg) `–u` 解锁用户账户。\n\n![images](img/bull.jpg)\
  \ `–d` 移除密码。\n\n![images](img/bull.jpg) `–n` 设置更改密码前所需的最小天数。\n\n![images](img/bull.jpg)\
  \ `–x` 设置必须更改密码的最大天数。\n\n![images](img/bull.jpg) `–w` 设置密码过期前提醒用户即将过期的天数。\n\n![images](img/bull.jpg)\
  \ `–i` 设置密码过期后禁用账户的等待天数。\n\n现在你已经知道如何创建新用户以及如何设置用户密码，让我们接下来回顾一下如何修改现有的用户账户。\n\n\
  ### `usermod`\n\n你可能偶尔需要修改现有的用户账户。这可以通过命令行使用 `usermod` 工具来完成。`usermod` 的语法与 `useradd`\
  \ 使用的非常相似。你在 shell 提示符下输入 `usermod *options username*`。`usermod` 的选项同样与 `useradd`\
  \ 使用的相似。它们包括：\n\n![images](img/bull.jpg) `–c` 编辑用户的全名。\n\n![images](img/bull.jpg)\
  \ `–e` 设置用户账户禁用的日期。日期格式为 *yyyy-mm-dd*。\n\n![images](img/bull.jpg) `–f` 设置密码过期后账户禁用的天数。使用值\
  \ `-1` 可禁用此功能。\n\n![images](img/bull.jpg) `–g` 设置用户的默认组。\n\n![images](img/bull.jpg)\
  \ `–G` 指定用户要加入的组。\n\n![images](img/bull.jpg) `–l` 修改用户名。\n\n![images](img/bull.jpg)\
  \ `–L` 锁定用户账户。此选项使用户的密码失效。\n\n![images](img/bull.jpg) `–m` 设置用户的家目录。\n\n![images](img/bull.jpg)\
  \ `–p` 设置用户的密码。与 `useradd` 命令一样，在使用 `usermod` 的 `-p` 选项时，你必须指定加密密码。你可以使用 `openssl\
  \ passwd –crypt` 命令生成一个可用于此选项的加密密码。\n\n![images](img/bull.jpg) `–s` 指定用户的默认 shell。\n\
  \n![images](img/bull.jpg) `–u` 设置用户的 UID。\n\n![images](img/bull.jpg) `–U` 解锁已锁定的用户账户。\n\
  \n例如，假设我的用户 `jmcarthur` 最近结婚了并将姓氏改为 Sanders。我可以在 shell 提示符下输入 `usermod –l jsanders\
  \ –c “Jackie Sanders” jmcarthur` 来更新她的用户账户以反映这一变化。当我这样做时，用户的账户信息将更新在 `/etc/passwd`\
  \ 中，如下：\n\n![Images](img/p033-01.jpg)\n\n* *\n\n![Images](img/tip.jpg)\n\n**提示**\
  \ 如果名称中有空格，在使用 `usermod` 命令时将其括起来。例如，我们使用了 `jsanders –c “Jackie Sanders” jmcarthur`\
  \ 命令来设置用户的全名。\n\n我们需要涵盖的最后一个用户相关主题是删除用户账户。让我们接下来讨论如何操作。\n\n### `userdel`\n\n你可能也需要经常从\
  \ Linux 系统中移除用户账户。这可以通过 shell 提示符使用 `userdel` 工具来完成。要删除用户，只需输入 `userdel *username*.`。例如，如果我们想删除之前创建的\
  \ `lmorgan` 账户，我们在 shell 提示符下输入 `userdel lmorgan`。\n\n需要注意的是，默认情况下，`userdel` 不从文件系统中移除用户的家目录。如果你想在删除用户时移除家目录，需要在命令行中使用\
  \ `-r` 选项。例如，输入 `userdel –r lmorgan` 将移除账户并删除其家目录。\n\n### **练习 9-1：从命令行管理用户**\n\n\
  在此练习中，你将练习在 Linux 系统的 shell 提示符下创建和修改用户账户。你可以使用书中提供的虚拟机进行此练习。运行快照 9-1 以获得配置正确的环境。\n\
  \n* *\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看 练习 9-1 视频以演示如何执行此任务。\n\n完成以下操作：\n\
  \n\n\n\n\n1. 启动你的 Linux 系统并以 `student` 用户身份登录，密码为 `student`。\n\n2. 打开终端会话，在 shell\
  \ 提示符处输入 `su –` 并输入密码 `student` 以切换到 root 用户账户。\n\n3. 通过以下步骤为自己创建一个用户账户：\n    a.\
  \ 为自己确定一个 `username` 和 `password`。通常的习惯是使用名字首字母加上姓氏。使用 `openssl passwd –crypt` 命令对你的密码进行加密。\n\
  \    b. 在 shell 提示符处，输入 `useradd –c “your_full_name” –m –p “your_encrypted_password”\
  \ –s “/bin/bash” your_username`。\n    c. 在 shell 提示符处，输入 `tail /etc/passwd`。验证你的新用户账户已创建。\n\
  \n4. 在 shell 提示符处输入 `useradd dtracy`，使用系统的默认设置创建一个用户账户。\n\n5. 在 shell 提示符处，输入 `tail\
  \ /etc/passwd`。验证新用户账户已创建。注意，新用户缺少许多参数。通过以下步骤添加这些参数：\n    a. 在 shell 提示符处输入 `usermod\
  \ –c “Richard Tracy” dtracy` 为 dtracy 用户账户输入全名。\n    b. 在 shell 提示符处，输入 `tail /etc/passwd`。验证全名已添加到\
  \ dtracy 账户。\n    c. 在 shell 提示符处输入 `passwd dtracy` 为 dtracy 分配密码。\n    d. 在收到提示时，为\
  \ dtracy 输入一个新的 `password`。\n\n现在你已经学会了如何管理用户，我们需要讨论如何管理组。让我们接下来讨论这一点。\n\n## Linux\
  \ 组 (Groups)\n\n与其他操作系统一样，Linux 使用组（groups）来使系统管理变得更简单。在本章的这一部分，我们将讨论以下内容：\n\n![images](img/bull.jpg)\
  \ Linux 组的工作原理\n\n![images](img/bull.jpg) 从命令行管理组\n\n让我们从讨论 Linux 组的工作原理开始。\n\n\
  ## Linux 组的工作原理\n\n组让我们作为系统管理员的工作变得更轻松！为了理解为什么，让我们来看一个场景。假设你的 Linux 系统上有七个用户。这些用户中，有五个人需要对文件系统中的文件拥有几乎完全相同的访问权限。如果没有组，你必须为这五个用户账户单独分配必要的权限。这意味着你要重复执行五次完全相同的任务。这听起来可能没那么糟，但假设你有\
  \ 100 个需要相同级别访问权限的用户。那将是多么浪费时间！\n\n相反，你可以在你的 Linux 系统上实现组。有了组，你只需要为组分配权限，然后将所有需要相同访问权限的用户变为该组的成员即可。这要简单得多！你只需要进行一次分配。如果所需的访问级别发生变化，你只需要对组进行一次更改。所有组员随之就会自动收到该更改。再次强调，这比替代方案要容易得多！\n\
  \n如果你的 Linux 系统被配置为使用本地认证，你的组将定义在 `/etc/group` 文件中。以下是该文件的示例：\n\n![Images](img/p0331-01.jpg)\n\
  \n与 `/etc/passwd` 和 `/etc/shadow` 文件一样，`/etc/group` 中的每一行都是代表一个组的单一记录。每个记录由以下四个字段组成：\n\
  \n`Group:Password:GID:Users`\n\n例如，在前面的示例中，video 组的记录如下：\n\n`video:x:33:gdm,hsaez,jsanders`\n\
  \n![images](img/bull.jpg) **Group** 指定组名。在示例中，组名为“video”。\n\n![images](img/bull.jpg)\
  \ **Password** 指定组密码，如果分配了密码的话。\n\n![images](img/bull.jpg) **GID** 指定组的组 ID（GID）数字。在本示例中，video\
  \ 组的 GID 是 33。\n\n![images](img/bull.jpg) **Users** 列出组的成员。在这种情况下，gdm、hsaez 和 jsanders\
  \ 用户是 video 组的成员。\n\n某些发行版使用额外的组文件来存储组密码。就像 `/etc/shadow` 用于存储 `/etc/passwd` 中定义的用户的加密密码一样，`/etc/gshadow`\
  \ 文件用于定义 `/etc/group` 中定义的组的密码。以下是 `/etc/gshadow` 示例：\n\n![Images](img/p0332-02.jpg)\n\
  \n与 `/etc/shadow` 一样，`/etc/gshadow` 中的每一行代表一个组的记录。每个记录由以下字段组成：\n\n`Group_Name:Password:Group_Admins:Group_Members`\n\
  \n考虑到这些，让我们回顾一下你如何使用命令行工具管理你的组。\n\n## 从命令行管理组\n\n与用户一样，你也可以用命令行或图形化工具管理组。例如，YaST\
  \ 和 User Manager 都用于在 Linux 系统上创建、修改和删除组以及用户账户。\n\n然而，由于上述的原因，在本章中我们将关注从 shell 提示符管理组。我们将回顾以下工具：\n\
  \n![images](img/bull.jpg) groupadd\n\n![images](img/bull.jpg) groupmod\n\n![images](img/bull.jpg)\
  \ groupdel\n\n让我们先看 groupadd。\n\n**groupadd** 正如你可能从名称中猜到的，`groupadd` 实用程序用于向你的\
  \ Linux 系统添加组。在 shell 提示符处使用 `groupadd` 的语法相对简单。只需输入 `groupadd *options groupname*`。例如，如果我想一个名为\
  \ dbusers 的组，我会在 shell 提示符处输入 `groupadd dbusers`。当我这样做时，组将使用 `/etc/login.defs` 中指定的默认参数添加到\
  \ `/etc/group` 中。\n\n使用 `groupadd` 时，你可以通过以下选项覆盖 `/etc/login.defs` 中的默认设置并自定义创建的方式：\n\
  \n![images](img/bull.jpg) **–g** 为新组指定 GID。\n\n![images](img/bull.jpg) **–p** 为组指定密码。与\
  \ `useradd` 命令一样，你必须先使用 `openssl passwd –crypt` 命令加密你想在 `groupadd` 的 –p 选项中使用的密码。\n\
  \n![images](img/bull.jpg) **–r** 指定所创建的组是系统组。\n\n接下来来看 groupmod。\n\n**groupmod**\
  \ 你可能注意到 `groupadd` 命令没有为新组添加一个关键组件：用户！如果没有用户占用组，这个组有什么用呢？\n\n要修改组（包括将用户添加到组成中），你使用\
  \ `groupmod` 实用程序。使用 `groupmod` 的语法与 `usermod` 类似。在 shell 提示符处输入 `groupmod *options\
  \ group*`。你可以在命令中使用以下选项：\n\n![images](img/bull.jpg) **–g** 修改组的 GID 数字。\n\n![images](img/bull.jpg)\
  \ **–p** 修改组的密码。与 `usermod` 命令一样，你必须先使用 `openssl passwd –crypt` 命令加密你想在 `groupmod`\
  \ 的 –p 选项中使用的密码。\n\n\n\n\n在 `groupmod` 命令的早期版本中，你可以使用 `-A` 和 `-R` 选项向组添加或删除用户。然而，这些选项在\
  \ `groupmod` 中已不再可用。相反，你必须使用 `usermod` 命令从组中添加或删除用户。要添加用户，可以在 shell 提示符输入 `usermod\
  \ –aG group_name user_name`。该命令保留用户现有的所有附加组组成关系，并添加指定的新组成员。移除用户的过程稍微复杂一些。你仍然使用带有\
  \ `-G` 选项的 `usermod` 命令，但不包含 `-a`（添加）选项，而是使用 `-G` 选项显式指定用户所属的所有附加组，并确保省略你想要从中移除用户的组。例如，假设\
  \ `ksanders` 的主组是 `users`，她也是 `research` 和 `managers` 附加组的成员。如果我想让她从 `research`\
  \ 组中移除，我会在 shell 提示符输入 `usermod –G ”managers“ ksanders`。由于我只在 `-G` 选项中列出了“managers”，因此她会被从\
  \ `research` 组成员身份中移除，同时保留其在 `managers` 组的成员身份。\n\n最后，让我们查看删除组。\n\n`groupdel`\n\
  如果由于某种原因，你需要从系统中删除现有的组，可以在 shell 提示符处使用 `groupdel` 命令。例如，要删除 `dbusers` 组，你需要输入 `groupdel\
  \ dbusers`。\n\n让我们在下面的练习中管理组。\n\n### 练习 9-2：从命令行管理组\n\n在本次练习中，你将练习在 Linux 系统的 shell\
  \ 提示符下创建和修改组。你可以使用随书提供的虚拟机进行此练习。运行快照 9-2 以获得正确配置的环境。\n\n***\n\n![Images](img/viedo.jpg)\n\
  \n**视频** 请观看 练习 9-2 视频，以演示如何执行此任务。\n\n假设你的公司正在组建一个新的研发团队，该团队将使用你的 Linux 系统。你需要为成为该团队的成员创建一个新组。完成以下操作：\n\
  \n1. **验证你已登录系统。**\n2. **如有必要，使用 `su –` 命令切换到 root 用户账户。**\n3. **通过以下步骤创建一个名为 `research`\
  \ 的新组：**\n\n   a. 在 shell 提示符下，输入 `groupadd research`。\n   b. 在 shell 提示符下输入 `usermod\
  \ –aG research dtracy` 将 `dtracy` 用户账户（在上一个练习中创建）添加到 `research` 组。重复此过程将你的用户账户添加到研究组。\n\
  \   c. 在 shell 提示符下输入 `tail /etc/group` 验证用户已添加到组。你应该看到以下内容：\n\n`research:!:1000:dtracy,rtracy`\n\
  \n### 章节总结\n\n在本章开始，我们讨论了 Linux 系统需要基础级文件系统安全性。我们回顾了一个场景，即同一系统上的多个用户能够访问彼此的文件，以及由此产生的问题。防止这些问题的方法是首先控制谁可以访问系统，然后在他们进入后控制他们可以访问什么。\n\
  \n第一部分通过使用 Linux 用户账户来实现。通过用户账户，用户在允许访问系统之前必须提供有效的用户名和密码（称为“凭据”）。这被称为“登录”或“身份验证”。我指出\
  \ Linux 操作系统将根据登录用户的用户名来定制系统环境。用户将拥有他们自己的家目录和自定义的桌面环境。我指出，默认情况下，用户家目录位于 `/home`，root\
  \ 用户除外，其家目录位于 `/root`。你可以在 shell 提示符下使用 `finger *username*` 命令查看特定用户的特定信息。\n\n我还指出，每个\
  \ Linux 用户账户都有一个唯一的 ID 数字，称为 `UID`。系统中没有两个用户的 `UID` 是相同的。某些发行行版（如 openSUSE）默认从 1000\
  \ 开始设置标准用户的 `UID`。其他发行版（如 Fedora）从 500 开始设置 `UID`。无论你使用哪种发行版，root 用户的 `UID` 始终被设置为\
  \ 0。你可以在 shell 提示符下使用 `id *username*` 命令查看用户的 `UID`（以及组成员关系）。\n\n我们接着讨论了 Linux 系统上可以保存用户账户的各种位置。使用本地身份验证，用户账户保存在\
  \ `/etc/passwd` 和 `/etc/shadow` 中。使用 LDAP 身份验证，用户账户保存在符合 LDAP 标准的目录服务中。使用 NIS 身份验证，用户账户文件通过\
  \ NIS 服务分布在多个系统之间。使用 Windows 域身份验证，用户账户存储在 Windows（或 Linux Samba）域控制器的中央数据库中。\n\n\
  我指出，对于 LPIC-1/Linux+ 考试，你只需要熟悉本地身份验证方法。在这种配置下，`/etc/passwd` 文件包含你的用户账户信息，而 `/shadow`\
  \ 文件包含用户加密后的密码。`/etc/passwd` 文件以以下格式存储用户账户：\n\n`Username:Password:UID:GID:Full_Name:Home_Directory:Default_Shell`\n\
  \n我还指出 `/etc/passwd` 文件同时包含标准用户账户和系统用户账户。标准用户账户用于登录。系统用户账户无法登录。相反，它们供系统服务在需要访问文件系统时使用。\n\
  \n![Images](img/p0335-01.jpg)\n\n`/etc/passwd` 和 `/etc/shadow` 文件保持保持。为了做到这一点，你应该避免使用文本编辑器直接编辑这些文件。相反，你应该使用系统上的各种用户和密码管理工具。要检查你的文件，可以使用\
  \ `pwck` 命令。如果你怀疑文件不同步，可以使用 `pwconv` 命令将账户从 `/etc/passwd` 添加到 `/etc/shadow`。\n\n\
  我们接着讨论了可以从 shell 提示符用于管理 Linux 系统用户账户的各种实用。要添加用户，你使用 `useradd` 工具。如果你在使用 `useradd`\
  \ 创建用户时不指定任何选项，将使用位于 `/etc/default/useradd` 和 `/etc/login.defs` 文件中的默认值。\n\n要设置用户密码，可以在\
  \ shell 提示符下使用 `passwd` 工具。要查看用户账户状态，可以使用 `passwd` 的 `-S` 选项。要修改现有用户账户，你使用 `usermod`\
  \ 工具。要删除用户账户，你使用 `userdel` 工具。默认情况下，删除账户时 `userdel` 不删除用户的家目录。如果你想删除用户的家目录，可以使用\
  \ `userdel` 的 `-r` 选项。\n\n我们随后转换了思路，讨论了 Linux 组的作用。组通过允许将对文件系统文件和目录具有共同访问权限的用户组合，简化了系统管理。Linux\
  \ 组存储在 `/etc/group` 中。`/etc/group` 中的组记录使用以下语法表示：\n\n`Group:Password:GID:Users`\n\
  \n某些发行版将组密码存储在 `/etc/group` 中。其他发行版将它们存储在 `/etc/gshadow` 中的独立文件中（采用加密格式），这与用户账户存储在\
  \ `/etc/passwd` 和 `/etc/shadow` 中的方式非常相似。\n\n\n\n\n\n要将用户添加到组中，你必须在 shell 提示符下使用\
  \ `usermod` 命令配合 `-aG` 选项。要从组中移除用户，你使用 `usermod` 命令的 `-G` 选项。你也可以使用 `groupdel` 命令删除组。\n\
  \n## 加速复习\n\n![images](img/bull.jpg) 你需要控制谁可以访问 Linux 系统，以及他们在进入系统后对文件系统中的文件和目录可以做什么。\n\
