  \ today\n\n![images](img/bull.jpg) tomorrow\n\n![images](img/bull.jpg) 在 `at>` 提示符处，输入要运行的命令列表；完成后按\
  \ CTRL-D。\n\n![images](img/bull.jpg) 如果你没有将命令的输出重定向到文件，输出将通过电子邮件发送到本地用户账户。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `atq` 命令查看等待的 at 作业列表。\n\n![images](img/bull.jpg) 你可以使用 `atrm` 命令删除等待的 at\
  \ 作业。\n\n![images](img/bull.jpg) 如果你需要周期性地调度进程，应该使用 `cron` 守护进程而不是 `at`。\n\n![images](img/bull.jpg)\
  \ `cron` 守护进程可以运行系统作业或用户作业\n\n![images](img/bull.jpg) 系统作业 位于以下目录：\n\n![images](img/bull.jpg)\
