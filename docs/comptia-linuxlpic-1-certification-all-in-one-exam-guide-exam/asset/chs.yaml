  \ 使用 `seq` 创建数字序列有三种选项：\n\n![images](img/bull.jpg) 如果你指定单个值，序列将从 1 开始，每次递增 1，并在指定的值结束。\n\
  \n![images](img/bull.jpg) 如果你指定两个值，序列从第一个值开始，每次递增 1，并在第二个值结束。\n\n![images](img/bull.jpg)\
