  \n你还可以通过在 shell 提示符处设置 `TZ` 环境变量的值并将其导出来更改时区。\n\n你还可以使用 `/etc/localtime` 文件和 `/usr/share/zoneinfo`\
  \ 中的各种区域文件来更改时区。\n\n## Questions\n\n**1.** 在进行需求评估时，你应该询问哪些问题？（选择两个）\n\n**A.** 此次安装将解决什么问题？\n\
