  \n## [15]. 你通过 GNOME 图形桌面环境登录了 Linux 系统。你在 GNOME 内部打开了一个终端会话来完成几个命令行任务。哪些 bash 配置文件用于配置该\
  \ shell 会话中的 bash 环境？（选择两项）\n\n**A.** `/etc/profile`\n**B.** `~/.profile`\n**C.**\
  \ `~/.bashrc`\n**D.** `~/.bashrc`\n**E.** `~/.bash_profile`\n\n## [16]. 在你的用户主目录下四个隐藏的\
