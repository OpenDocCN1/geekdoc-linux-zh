  \ flags user executable arguments`\n\n该行中的每个参数在表 17-6 中进行了描述。\n\n\n\n\n\n随后，我讨论了你可以使用的用户访问控制，以限制用户在系统中可以做和不能做什么。用户、组和权限是控制访问系统的主要手段。然而，你还可以采取其他方法来提高系统的安全性。\n\
  \n### 用户访问与管理\n\n首先，你需要审慎地使用你的 root 用户账户。root 用户应仅用于完成 root 任务。所有其他任务都应该使用标准用户账户完成。在\
  \ root 用户登录期间，不应让系统处于无人监管的状态。当你需要完成需要 root 级权限的任务时，可以使用使用 `su` 命令切换到 root 用户账户。完成后，你可以使用\
  \ `exit` 命令切换回普通用户账户。\n\n如果你有用户偶尔需要以 root 身份运行命令，但你不想给他们你的 root 密码，可以使用 `sudo` 命令。你使用\
  \ `/etc/sudoers` 文件来指定哪些用户可以以 root 身份运行哪些命令。你使用 `visudo` 工具来编辑此文件。该工具会在 `vi` 编辑器中加载\
  \ `/etc/sudoers` 文件。当你退出 `vi` 时，它会检查你的语法，以确保你没有在文件中编写语法错误。\n\n### 密码策略\n\n接下来，我谈到了实施强密码策略。用户需要接受培训，以避免使用容易被猜到的密码，例如配偶的名字、孩子的名字或宠物的名字。用户需要接受培训使用强密码，强密码应包含：\n\
  \n- 六或更多字符\n- 字母外还包含数字\n- 大小字母\n- 字典中不存在的单词\n\n你还应该使用 `chage` 命令配置密码有效期。你可以指定密码更改之间的最小天数、密码更改之间的最大天数，以及在更改密码之前的警告天数。\n\
  \n你还应该验证你的 Linux 系统是否使用了影子密码（shadow passwords）。将密码存储在 `/etc/passwd` 中极不利。你可以使用 `pwconv`\
  \ 命令将密码从 `/etc/passwd` 迁移到 `/etc/shadow`。\n\n### 安全操作程序\n\n此外，你还需要培训用户遵循适当的安全程序。你不应该允许他们将密码写下来。你还应该培训他们如何处理社会工程攻击。具体来说，他们应该接受培训如何识别钓鱼攻击。用户还应该粉碎重要文档，而不是仅仅将它们丢进普通垃圾桶。\n\
  \n### 用户限制\n\n然后我们查看了如何配置用户限制。你可以对 Linux 系统上的用户登录次数、消耗的 CPU 时间以及使用的内存进行限制。实现此点的方法是使用可插拔认证模块（PAM）系统的\
  \ `pam_limits` 模块。限制在 `/etc/security/limits.conf` 文件中通过以下语法进行配置：\n\n```\ndomain\
  \ type item value\n```\n\n例如，你可以通过在文件中输入以下内容，将 `rtracy` 用户限制为最多两次并发登录：\n\n```\n\
  rtracy hard maxlogins 2\n```\n\n你还可以使用 `ulimit` 命令对适用于从 shell 提示符启动的程序的系统资源进行限制。使用\
  \ `ulimit` 的语法为：\n\n```\nulimit options limit\n```\n\n你可以使用 `ulimit` 使用以下选项：\n\n\
  - `-c`: 设置核心文件最大大小限制（以块为单位）\n- `-f`: 设置 shell 创建的文件最大大小限制（以块为单位）\n- `-n`: 设置打开文件描述符的最大限制\n\
  - `-t`: 设置进程可以使用的最大 CPU 时间限制（以秒为单位）\n- `-u`: 设置单个用户可用进程数的限制\n- `-d`: 设置进程内存数据段最大\
  \ own 限制（以 KB 为单位）\n- `-m`: 设置进程内存驻留大小最大限制（以 KB 为单位）\n- `-s`: 设置最大栈大小限制（以 KB 为单位）\n\
  - `-H`: 设置硬资源限制\n- `-S`: 设置软资源限制\n\n### 禁用登录与审计\n\n然后我回顾了如何完全禁用用户对 Linux 系统的登录。你可以使用\
  \ `w` 命令查看所有当前登录用户的列表。然后你可以使用 `pkill -KILL -u user_name` 命令强制注销每个用户。此时，你可以通过在 `/etc`\
  \ 中创建一个名为 `nologin` 的文件禁用禁用未来的登录。只要该文件存在，除 root 之外无人允许登录。\n\n除了禁用用户登录外，你需要熟悉的另一个用户安全相关问题是审计设置了\
  \ SUID 或 SGID root 权限的文件。你可以以 root 用户身份在 shell 提示符使用以下命令搜索 Linux 系统上设置了 SUID 权限的文件：\n\
  \n```\nfind / -type f -perm -u=s -ls\n```\n\n你也可以以下命令识别任何设置了 SGID 权限的文件：\n\n```\n\
  find / -type f -perm -g=s -ls\n```\n\n### 网络攻击缓解\n\n随后我将焦点转移到网络攻击的威胁上。我指出，将你的网络连接到互联网会让你的\
  \ Linux 系统面临许多网络攻击。为了缓解这些威胁，你需要紧跟当前的威胁。做到此事的两个优秀资源包括 `www.cert.org` 和 `www.us-cert.gov`\
  \ 网站。\n\n你还应该检查系统查看是否有不必要的守护进程运行。你可以使用 `chkconfig` 和 `nmap` 工具来实现。可以使用适当的初始化脚本轻松地卸载不必要的服务。你还应该使用\
  \ `chkconfig` 或 `systemctl` 防止不必要的服务在系统启动时加载。\n\n为了进一步保护你的系统免受网络攻击，你应该定期安装修补安全漏洞的操作系统更新。大多数发行版都提供某种在线更新功能，你可以利用它自动完成任务。\n\
  \n### 使用 iptables 的防火墙\n\n然后我跨了一步，讨论了如何使用 `iptables` 实现简单的的数据包过滤防火墙。我指出，防火墙是你网络中关键的安全组件。防火墙位于你的网络和另一个网络之间。它捕所有的网络流量并与你定义的规则集进行比较。如果流量符合规则中的条件，则允许通过。如果不符合，则被拒绝。规则可以基于源地址、目的地址、源端口、目的端口、使用的协议或数据包类型。\n\
  \n随后我讨论了如何使用 Linux 系统实现防火墙。第一步是设计它的工作原理。一旦你确定了将允许什么类型的流量以及拒绝哪些流量，你就可以使用 `netfilter`\
  \ 基础设施来实现防火墙，该基础设施通常默认编译到你的 Linux 内核中。`netfilter` 基础设施使用了表（tables）、链和规则的概念。`filter`\
  \ 表用于创建数据包过滤规则。`filter` 表包含了 `FORWARD`、`INPUT` 和 `OUTPUT` 链。`filter` 表中的每个链都可以配置\
  \ `ACCEPT`、`DROP`、`QUEUE` 和 `REJECT` 策略。这是通过 `iptables` 命令完成的。使用 `iptables` 创建防火墙的通用做法是使用\
  \ `-P` 选项设置默认规则，这些规则通常是非常严格的。然后你使用 `iptables` 为默认规则配置例外。\n\n### 系统日志\n\n除了基准配置外，你还可以使用系统日志文件来排查系统问题。你的系统日志文件存储在\
  \ `/var/log` 中。该目录下一些较重要的日志文件包括：\n\n- `boot.log`\n- `boot.msg`\n- `faillog`\n- `firewall`\n\
  - `lastlog`\n- `mail`\n- `messages`\n- `warn`\n- `wtmp`\n\n\n\n\n\n![images](img/bull.jpg)\
  \ xinetd.log\n![images](img/bull.jpg) cron\n![images](img/bull.jpg) dmesg\n![images](img/bull.jpg)\
  \ maillog\n![images](img/bull.jpg) secure\n![images](img/bull.jpg) rpmpkgs\n\n并不是所有的发行版都会使用相同的日志文件。如果你的发行版使用\
  \ `init` 守护进程，那么日志通常由 `syslogd` 守护进程处理。`syslogd` 管理日志的方式可以通过 `/etc/syslog.conf`\
  \ 文件进行自定义。大多数 Linux 发行版都配置为定期轮转你的日志文件，以防止其增长过大。`cron` 守护进程会定期运行 `logrotate` 工具来实现此操作。`logrotate`\
  \ 如何轮转特定的日志文件是通过 `/etc/logrotate.conf` 文件以及位于 `/etc/logrotate.d/` 目录下的各个服务的配置文件配置的。你可以配置\
  \ `syslogd` 将所有日志事件发送到运行在另一个 Linux 系统上的 `syslogd` 守护进程。许多管理员会在网络中设置一个系统作为日志主机，所有\
  \ Linux 管理员都将他们的日志文件发送到这里。这样做可以将你的日志文件集中化，并让入侵者难以修改日志文件来掩盖踪迹。你通过将以下命令添加到你的 `/etc/syslog.conf`\
  \ 文件的开头来配置远程日志：\n\n![Images](img/p0693-01.jpg)\n\n你还需要将日志主机上 `/etc/sysconfig/syslog`\
  \ 文件中的 `SYSLOGD_PARAMS` 指令值设置为 `-r`。\n\n如果你的发行版使用 `systemd`，它可能使用 `journald` 守护进程来管理日志。`journald`\
  \ 守护进程维护一个名为 `journal` 的系统日志（位于 `/var/log/journal/`）。你使用 `journalctl` 命令查看日志。守护进程的行为通过\
  \ `/etc/systemd/journald.conf` 文件配置。如果你的发行版使用 `systemd` 但你更喜欢 `syslogd` 的功能，可以使用\
  \ `syslog-ng` 代替 `journald`。`syslog-ng` 守护进程与 `systemd` 配合工作，但配置方式与 `syslog` 非常相似。\n\
  \n随后我讨论了用于查看文本日志文件的工具。虽然你可以使用 `less`、`cat` 和 `more`，但 `tail` 和 `head` 工具可以更有效地查看日志文件。`tail`\
  \ 工具显示文件的最后几行。`head` 工具将显示文件的前几行。你还可以使用 `grep` 在日志文件内搜索内容。你可以配合 `tail` 或 `journalctl`\
  \ 使用 `-f` 选项来监控日志文件中的新条目。\n\n接着我还讨论了如何使用你的 Linux 日志文件检测入侵尝试。你应该定期检查日志文件，寻找指示入侵尝试的异常情况。最适合此任务的日志文件包括：\n\
  \n![images](img/bull.jpg) /var/log/wtmp\n![images](img/bull.jpg) /var/log/faillog\n\
  ![images](img/bull.jpg) /var/log/lastlog\n![images](img/bull.jpg) /var/log/messages\n\
  \n你还可以使用 `who` 和 `finger` 工具查看当前谁正在使用 Linux 系统。\n\n我在本章结束时讨论了如何配置 `xinetd` 和 `inetd`。`xinetd`\
  \ 和 `inetd` 都是超级守护进程（super-daemons）。它们管理系统上的其他网络服务守护进程。当请求网络服务时，`xinetd`（或 `inetd`）守护进程会启动服务并将请求转发给它。当请求完成且不再需要服务时，`xinetd`（或\
  \ `inetd`）将其从内存中卸载。\n\n`xinetd` 守护进程通过 `/etc/xinetd.conf` 文件配置。由 `xinetd` 管理的各个可以使用位于\
  \ `/etc/xinetd.d` 目录下的相应配置文件来启用或禁用。\n\n为了增加安全性，你可以使用 TCP Wrappers 来控制对网络服务的访问。使用\
  \ TCP Wrappers，`xinetd` 守护进程将运行 `tcpd` 守护进程而非网络服务本身。`tcpd` 守护进程检查 `/etc/hosts.deny`\
  \ 和 `/etc/hosts.allow` 文件以确定请求主机是否允许使用该服务。如果是，`tcpd` 将加载请求的守护进程。\n\n`inetd` 守护进程通过\
  \ `/etc/inetd.conf` 文件配置。所有由 `inetd` 管理的服务都配置在这个单一配置文件中。文件中的每行都配置一个由 `inetd` 管理的单一服务。`inted.conf`\
  \ 中使用的语法所示：\n\n```\nservice_name socket_type protocol flags user executable arguments\n\
  ```\n\n你可以像对 `xinetd` 那样对 `inetd` 使用 TCP Wrappers。这允许你通过 `/etc/hosts.allow` 和 `/etc/hosts.deny`\
  \ 文件控制对主机上运行的网络服务的访问。\n\n## 加速复习\n\n- ![images](img/bull.jpg) 许多组织忽略了物理安全，将系统留在不安全的区域。\n\
