  A. `route 10.200.200.254`\nB. `route add default 10.200.200.254`\nC. `netstat –a\
  \ 10.200.200.254`\nD. `gateway 10.200.200.254`\n\n22.** 考虑使用 CIDR 表示法的 IPv4 地址 `10.0.0/12`。以下哪个子网掩码对应该地址？\n\
  \nA. `255.0.0`\nB. `255.240.0`\nC. `255.255.0`\nD. `255.252.0`\n\n23.** 一台工作站向不在当前网络的主机发送了数据包。接下来会发生什么？\n\
  \nA. 数据包被丢弃。\nB. 数据包被发送到默认 IP 地址。\nC. 默认网关检查其路由表以确定去向。\nD. 默认网关进行 DNS 查询。\n\n###\
  \ 答案\n\n1.** A, C.** MAC 地址是编码在固件中的。理论上，没有两个网络板具有相同的 MAC 地址。然而，某些类型的网络允许手动配置 MAC\
  \ 地址。\n\n2.** A.** 用户数据报协议是一种无确认的无连接协议，发送数据时不请求确认。这使其适用于对延迟敏感但可以忍受一定程度不可可靠性的应用程序，例如视频流。\n\
  \n3.** B.** OSI 模型的网络层实现了网络之间的路由。在 IP 网络中，此功能是由 IP 协议提供的。\n\n4.** C, D.** SMTP 进程默认使用端口\
  \ 25，而 POP3 进程默认使用端口 110。\n\n5.** A, E.** 192.168.254.1 和 10.200.0.200 都是可以分配给机的有效\
  \ IP 地址。\n\n6.** A.** 255.255.0.0 是 B 类网络的子网掩码。\n\n7.** C.** 网络配置不正确，因为主机使用了错误的子网掩码。\n\
  \n8.** D.** 第一个字节（10）的二进制为 00001010。第二个和第三字节（0）的二进制均为 00000000。第四个字节（1）的二进制为 00000001。\n\
  \n9.** B, C.** 你可以检查 `/etc/modprobe.conf` 文件或某些发行版的 `/etc/modules.conf` 文件来验证是否已加载正确的模块并创建了别名。\n\
  \n10.** B.** 使用 init 的旧版 Linux 系统，第二个以太网默认分配的别名为 `eth1`。\n\n11.** A.** 命令 `ifconfig\
  \ eth0 176.23.0.12 netmask 255.255.0.0` 将将 IP 地址和子网掩码分配给 `eth0` 接口。\n\n12.** C,\
  \ D.** 根据你所使用的发行版本，你可以使用 `/etc/sysconfig/network/ifcfg-eth0` 文件或 `/etc/sysconfig/network/ifcfg-eth0`\
  \ 文件来持久化 IP 地址分配。\n\n\n\n\n在本章中，你将学习到：\n\n- 使用 CUPS 配置打印功能\n- 维护系统时间\n- 管理 MTA（邮件传输代理）\n\
  - 管理 SQL 数据\n\n在本章中，我将教你如何在 Linux 系统上配置各种网络服务。在我看来，这正是 Linux 大放异彩的地方。你可以选取几乎任何 Linux\
  \ 发行版，并在上面启用网络服务，使其配置为你的网络中扮演各种强大的角色。你需要 Web 服务器吗？没问题！Linux 可以做到。你需要 Windows 域控制器吗？Linux\
  \ 也可以。网络防火墙呢？同样，Linux 也可以承担这一角色。需要数据库服务器吗？没包！需要运行虚拟机的虚拟机程序吗？Linux 在这方面表现出色。\n\n\
  这些角色是通过 Linux 守护进程（daemons）实现的。要在你的系统上启用服务，你首先需要使用选择的安装工具（如 `yum` 或 `rpm`）从发行版的安装介质中安装相应的守护进程。安装完成后，你就可以使用文本编辑器修改守护进程的配置文件（通常保存在\
  \ `/etc/` 下），以配置它的运行行为。如果你的发行版使用 `init` 守护进程，你可以使用系统 `/etc/init.d` 或 `/etc/rc.d/init.d`\
  \ 目录中相应的 init 脚本启动、停止或重载服务。如果你的发行版使用 `systemd`，你可以使用 `systemctl` 命令来启动、停止或重载服务。\n\
  \n请注意，我们在章中需要涵盖很多主题。因此，我不会深入探讨其中任何一个。我在本章中涵盖的大多数网络服务都非常复杂。关于其中大多数服务，已经写了整本书了。我们这里没有时间或空间这样做。为了让你准备好参加\
  \ Linux+/LPIC-1 考试，我将向你介绍每个主题，然后教你如何进行基础配置。\n\n***\n\n![Images](img/examtip.jpg)\n\
  \n**考试贴士** 尽量不要被这一章搞晕！我们将涵盖很多网络服务，但你不需要成为这些服务的专家。只需要熟悉这里涵盖的每项服务的基础知识（打印、时间、电子邮件和\
  \ SQL 数据库）即可。\n\n让我们开始本章，首先讨论如何在你的 Linux 系统上配置打印功能。\n\n### 使用 CUPS 配置打印功能\n\n无论你使用哪种操作系统，它提供的最重要的服务之一就是将打印作业发送到打印机的能力。如果你不信，只需拔掉办公室打印机的插头一小时，然后观察由此产生的混乱。好了，别真的拔掉你办公室打印机的插头。你的同事可能会对你造成人体伤害。\n\
  \n重点是，打印对大多数用户来说至关重要。正因如此，你需要非常熟悉 Linux 打印。在本章的这部分，我们将涵盖以下主题：\n\n![images](img/bull.jpg)\
  \ Linux 打印的工作原理\n![images](img/bull.jpg) 安装 CUPS\n![images](img/bull.jpg) 配置 CUPS\n\
  ![images](img/bull.jpg) 使用行打印守护进程 (lpd)\n![images](img/bull.jpg) 排除打印问题\n\n让我们先讨论\
  \ Linux 打印的工作原理。\n\n#### Linux 打印的工作原理\n\n目前最常用的 Linux 打印系统是通用 Unix 打印系统（CUPS）。CUPS\
  \ 从设计之初就是为了让 Linux 打印尽可能简单，无论是打印到本地连接的打印机，还是打印到远程网络打印机。CUPS 服务由 `cupsd` 守护进程提供，它会自动在局域网上发布其打印队列的可用性。CUPS\
  \ 客户端系统监听这些公告，使用户只需少量的网络知识即可选择他们想要的打印机。此外，CUPS 支持通过端口 `631` 上的 `Internet Printing\
  \ Protocol (IPP)` 进行网络打印。CUPS 系统由几个组件部分组成。\n\n第一个是 `CUPS scheduler`，它是一个仅用于处理来自\
  \ CUPS 客户端的 IPP 打印请求的 Web 服务器。由于 CUPS 调度器运行在 IP 端口 `631`，它可以与运行在同一系统上的 Apache Web\
  \ 服务器共存。事实上，CUPS 配置文件看起来就像 Apache Web 服务器的配置文件。除了处理打印作业外，CUPS 调度器还充当典型的 Web 服务器，在浏览器界面中提供文档说明以及\
  \ CUPS 管理工具。\n\n你接下来需要熟悉的熟悉的组件是 CUPS 过滤器（filters）。现代打印机使用多种不同的`页面描述语言 (PDLs)`。在\
  \ Linux 系统中，大多数应用程序使用 Adobe 的 PostScript PDL 生成打印作业。如果你有一台兼容 PostScript 的打印机，这种方法效果就很好。然而，并不是所有打印机都包含\
  \ PostScript 支持，因为打印机制造商必须向 Adobe 支付许可费用，这会大幅增加单机的价格。相反，许多打印机制造商（如惠尔-惠普）使用`打印机控制语言\
  \ (PCL)` PDL。其他制造商（如爱普生）使用 `ESC/P` PDL。\n\n如果你的打印机不兼容 PostScript，你就使用 CUPS 过滤器通过发送到目标打印机的\
  \ PDL 将打印作业从 PostScript 转换为相应的格式。这些过滤器位于 `/usr/lib/cups/filter`。\n\n你接下来需要了解的组件是\
  \ CUPS 后端（backends）。后端负责在调度器和实际打印机硬件之间提供接口。CUPS 后端位于 `/usr/lib/cups/backend`。CUPS\
  \ 为各种不同的打印机接口提供了后端，包括并行、串口、USB 等。每当 `cupsd` 启动时，它都会查询系统中安装的每个后端。后端响应守护进程，报告打印机是否已连接。如果打印机已连接，它们会报告打印机的信息，例如品牌和型号。\n\
  \n下一个你需要熟悉的 CUPS 组件是 PPD（PostScript 打印机描述）文件。`cupsd` 使用 PPD 来确定打印机的功能。这些 PPD 文件存储在\
  \ `/etc/cups/ppd`。\n\n最后一个你需要熟悉的 CUPS 组件是 Web 管理工具。CUPS 调度器提供了基于 Web 的管理界面。CUPS\
  \ 管理工具可用于设置打印机和管理打印作业。要访问 CUPS Web 管理工具，只需打开浏览器并导航到 `http://你的服务器地址:631`。当你这样做时，将显示图\
  \ 16-1 所示的屏幕。\n\n![Images](img/f0595-01.jpg)\n\n**图 16-1** 使用 CUPS 管理工具\n\n当打印作业被提交到\
  \ CUPS 服务器时，会发生图 16-2 所示的过程。\n\n![Images](img/f0596-01.jpg)\n\n**图 16-2** 发送打印作业\n\
  \n首先，客户端上的应用程序生成打印作业并将其发送到服务器上的 `cupsd` 守护进程。守护进程将作业保存在缓存中。打印队列和过滤器信息保存在 `/var/spool/cups`。文件名以\
  \ `c` 开头，加上 `cupsd` 分配的打印作业编号。要打印的文档也保存在 `/var/spool/cups`。这次这次文件名以 `d` 开头，加上 `cupsd`\
  \ 分配的打印作业编号。\n\n接下来，打印作业被发送到过滤器，转换为目标打印机的相应 PDL。转换完成后，转换后的打印作业从过滤器发送到后端，后端将其转发到连接的打印机。在将作业发送到打印机后，后端通知\
  \ `cupsd` 守护进程，打印作业从打印队列中删除。\n\n现在你已经知道了 CUPS 打印的工作原理，我需要讨论如何在你的 Linux 系统上安装该服务。让我们接下来讨论这一点。\n\
  \n### 安装 CUPS\n\n\n\n\n\n与我们在本章早些时候回顾的服务不同，很有可能你的 Linux 发行版默认已经安装了提供 CUPS 打印功能所需的软件包。如前所述，CUPS\
  \ 是大多数现代 Linux 发行版所使用的默认打印系统。\n\n如果你的发行版由于某种原因没有安装 CUPS，请使用你选择的软件包安装工具来安装以下软件包（以及任何依赖包）：\n\
  \n![images](img/bull.jpg) cups\n\n![images](img/bull.jpg) cups-client（可选）\n\n![images](img/bull.jpg)\
  \ gutenprint（包含 cups 的打印机驱动程序）\n\n![images](img/bull.jpg) cups-libs\n\n![images](img/bull.jpg)\
  \ libgnomecups（可选）\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 你最终安装的软件包实际列表可能会根据你的发行版而异。\n\
  \n安装软件包后，提供 CUPS 服务的二进制文件是位于 `/usr/sbin` 的 `cupsd` 可执行文件。如果你的发行版使用 `init` 守护进程管理进程，则使用\
  \ `/etc/init.d` 或 `/etc/rc.d/init.d` 中的 `cups` init 脚本来启动和停止 CUPS 服务，如图 16-3 所示。如果你的发行版基于\
  \ `systemd`，则使用 `/usr/lib/systemd/system/cups.service` 文件来启动和停止 CUPS 服务。\n\n![Images](img/f0597-01.jpg)\n\
  \n**图 16-3** cups init 脚本\n\n一旦系统上安装了 CUPS 软件包，你就可以在服务器上配置并启动 CUPS 服务了。接下来我们来讨论如何操作。\n\
  \n## 配置 CUPS\n\nCUPS 服务看起来很复杂，在底层也确实如此。幸运的是，编写 CUPS 的开发者让我们能够配置和管理它变得非常简单。在本章的这部分，你将通过学习以下主题来学习如何配置\
  \ CUPS：\n\n![images](img/bull.jpg) 配置运行服务\n\n![images](img/bull.jpg) 配置 CUPS 打印机\n\
  \n![images](img/bull.jpg) 使用命令行工具管理 CUPS\n\n让我们从讨论如何配置 `cupsd` 守护进程开始。\n\n### 配置\
  \ CUPS 服务\n\nCUPS 服务使用 `/etc/cups` 目录内的几个文本文件进行配置。`/etc/cups/cupsd.conf` 文件是你用于配置\
  \ `cupsd` 守护进程（称为调度器）的主配置文件。记住 `cupsd` 也是一个 HTTP 服务器，类似于 Apache。因此，`cupsd.conf`\
  \ 文件与 Apache Web 服务器配置文件非常相似。示例的 `cupsd.conf` 文件如图 16-4 所示。\n\n![Images](img/f0598-01.jpg)\n\
  \n**图 16-4** 使用 cupsd.conf 文件配置 CUPS\n\n图 16-4 仅显示了 `cupsd.conf` 的一一小部分，该文件非常长。`cupsd.conf`\
  \ 文件由许多服务器指令组成，这些指令规定了 `cupsd` 的运行方式。书中没有时间或空间涵盖 `cupsd.conf` 中的所有配置选项。我在这里仅介绍最重要的几个。有关更多信息，请参阅\
  \ `cupsd.conf` 的 man 页面。你也可以在 Linux 系统的浏览器中打开 `http://localhost:631/help/` 来查看详细的\
  \ `cupsd.conf` 指令列表，或者访问 http://www.cups.org/documentation.php/ref-cupsd-conf.html。一些较实用的\
  \ `cupsd.conf` 指令包括表 16-1 所示所示。\n\n![Images](img/t0599-01.jpg)\n\n**表 16-1** cupsd.conf\
  \ 配置指令\n\n你配置 `cupsd.conf` 的方式很大程度上取决于你实现系统的特定网络。好消息是，你不需要对 `cupsd.conf` 做什么就能配置提供本地打印的基本实现。\n\
  \n然而，如果你希望其他 Linux 系统能够通过你的 CUPS 打印机打印，你必须启用 `BrowseAddress`，否则 CUPS 将不在网络上发布它的打印机。该指令在许多发行版中默认*未启用*的。该指令的示例配置如下：\n\
  \n![Images](img/p0598-01.jpg)\n\n`BrowseAddress` 指令通常被设置为值 `@LOCAL`。这会导致 CUPS 向系统中的所有本地网络接口发送打印机广播。你可以将此指令设置为\
  \ `@IF(*interface_name*)` 以将广播限制到特定的网络接口。\n\n对 `cupsd.conf` 进行任何更改后，务必重启 `cupsd`\
  \ 守护进程。配置好 `cupsd.conf` 文件后，你还需要设置一个作为 CUPS 管理员的 Linux 用户账户。CUPS 不使用 Linux 系统使用的用户账户。相反，CUPS\
  \ 被配置为使用 `/etc/cups/passwd.md5` 文件来存储用户账户。要在 `passwd.md5` 文件中创建一个名为 `root` 且属于名为\
  \ `sys` 的 CUPS 管理组的管理员用户，你需要输入 `lppasswd –g sys –a root`。\n\n现在你已经配置了管理员用户，接下来的任务是配置\
  \ CUPS 打印机和队列。接下来让我们讨论如何操作。\n\n### 配置 CUPS 打印机\n\n所有 CUPS 打印机都定义在 `/etc/cups/printers.conf`\
  \ 文件中。你可以手动编辑此文件，但你真的应该使用 CUPS Web 界面管理工具。使用它配置 CUPS 打印机非常轻而易举。你可以配置 CUPS 为本地连接的打印机提供服务（并可选地让其他网络用户可用），或者通过网络连接\
  \ CUPS 打印机。例如，要配置 CUPS 使用本地连接的打印机，请执行以下操作：\n\n1. 在你的 Linux 系统上，启动浏览器并导航到 `http://localhost:631`。\n\
  2. 选择 **Administration**（管理）。显示图 16-5 所示。\n3. 在 Printers（打印机）下，选择 **Add Printer**（添加打印机）。\n\
  4. 提示时，使用之前创建的管理员用户登录。显示图 16-6 所示。\n5. 在 Local Printers（本地打印机）下选择本地连接的打印机类型，然后选择\
  \ **Continue**（继续）。显示与图 16-7 类似的屏幕。\n\n***\n\n![Images](img/tip.jpg)\n\n**提示** 你也可以在此屏幕中选择网络打印机。其他网络主机上广播的所有\
  \ CUPS 打印机都列在 Discovered Network Printers（已发现的网络打印机）下。要向这些打印机之一发送打印作业，只需选择它。\n\n\
  6. 在 Name（名称）字段中，为打印机输入名称。\n7. 在 Description（描述）字段中，输入打印机的描述。\n8. 在 Location（位置）字段中，输入打印机的位置。\n\
  9. 如果你想与其他网络用户共享打印机，勾选 **Share This Printer**（共享此打印机）。\n10. 选择 **Continue**（继续）。显示图\
  \ 16-8 所示。\n11. 选择打印机制造商；然后选择 **Continue**（继续）。\n12. 在 Model（型号）字段中，选择你的打印机型号；然后选择\
  \ **Add Printer**（添加打印机）。\n13. 配置打印机的默认选项，例如纸张大小、色彩模式、介质源、打印质量、双面打印等。完成后，选择 **Set\
  \ Default Options**（设置默认选项）。\n\n![Images](img/f0600-01.jpg)\n\n**图 16-5** CUPS 管理界面\n\
  \n![Images](img/f0601-01.jpg)\n\n**图 16-6** 选择打印机类型\n\n![Images](img/f0601-02.jpg)\n\
  \n**图 16-7** 添加新的 CUPS 打印机\n\n![Images](img/f0601-03.jpg)\n\n**图 16-8** 配置打印机品牌和型号\n\
  \n此时，将显示一个页面指示你的打印机已添加。显示打印机的当前状态，类似于图 16-9 所示。\n\n![Images](img/f0602-01.jpg)\n\
  \n**图 16-9** 查看打印机状态\n\n从打印机状态页面，你可以管理你的 CUPS 打印机。你可以发送测试页、停止打印机、终止打印作业、修改打印机配置或彻底删除打印机。\n\
  \n\n\n\n此时，你可以将打印作业发送到打印机。如果你正在使用图形化 X 应用程序，只需选择 `File` | `Print`；然后选择打印机并点击 `OK`即可。你也可以从命令行向打印机发送打印作业。这是通过使用\
  \ `lp` 命令实现的，该命令会将指定的文件发送到打印机。使用 `lp` 的语法为 `lp –d printer_name filename`。例如，如果我想将当前目录下的\
  \ `myfiles` 文件打印到我刚刚创建的 HPLJ2 打印机，我会在 shell 提示符下输入 `lp –d HPLJ5 ./myfiles`，如下：\n\
  \n![Images](img/p0602-01.jpg)\n\n如你在示例中所示，作业被创建并分配了一个 ID（在这种情况下为 `HPLJ2-2`）。该作业被添加到打印队列并发送到打印机。`lp`\
  \ 实用程序除了 `-d` 之外还包含许多用于创建打印作业的选项，包括以下选项：\n\n![images](img/bull.jpg) `-n x` 打印 `x`\
  \ 份副本\n\n![images](img/bull.jpg) `-m` 打印完成后向我的本地用户账户发送确认邮件\n\n![images](img/bull.jpg)\
  \ `-q x` 将打印作业的优先级设为 `x`\n\n![images](img/bull.jpg) `-o landscape` 以横向而非纵向打印文件\n\
  \n![images](img/bull.jpg) `-o sides=2` 在支持双面打印的打印机上双面打印文件\n\n你还可以配置其他 Linux 系统以打印到\
  \ CUPS 打印机。只需配置一个新的打印机，但要指定它监听 CUPS 告告即可。你配置的 CUPS 打印机应该在 30 秒内显示出来。一旦你选择了它，所有发送到该打印机的打印作业都将通过网络连接重定向到你的\
  \ CUPS 打印机。\n\n此外，如果你在系统中安装了 Samba，你的 CUPS 打印机将自动共享。你可以从 Windows 工作站连接到它们并提交打印作业。这太酷了！\n\
  \n接下来让我们讨论一下如何使用命令行工具管理你的 CUPS 打印机。\n\n## 使用命令行工具管理 CUPS\n\n除了 CUPS 基于 Web 的管理实用程序外，你还可以使用多种命令行工具来配置\
  \ CUPS。要查看 CUPS 打印机信息，你可以使用 `lpstat` 实用程序。在使用 `lpstat` 时，最有用的选项之一是 `-t`。\n\n这将导致\
  \ `lpstat` 显示系统上所有 CUPS 打印机的所有信息，如下例所示：\n\n![Images](img/p0603-01.jpg)\n\n这显示了默认\
  \ CUPS 打印机 (HPLJ2)、它的连接方式 (`/dev/lp0`)、正在处理的打印作业（如果有）以及等待中的打印作业列表。\n\n要取消等待中的打印作业，你可以使用\
  \ `cancel` 命令。语法为 `cancel job_ID`。例如，假设我发送了一个巨大的打印作业（一份来自 `/usr/share/doc/manual/`\
  \ 的 Linux 用户手册），它被分配的打印 ID 为 `HPLJ2-4`。在打印期间，我决定这太浪费纸了。我可以在 shell 提示符下输入 `cancel\
  \ HPLJ2-4` 来杀死该作业并将其从打印队列中移除。这也可以在 CUPS 基于 Web 的管理实用程序内部完成。只需进入 `Jobs` 标签页并选择 `Show\
  \ Active Jobs`。找到需要取消的作业并选择 `Cancel Job`，如图 16-10 所示。\n\n![Images](img/f0604-01.jpg)\n\
  \n**图 16-10** 在 CUPS 管理工具内部取消打印作业\n\n如果你连接了多个 CUPS 打印机，你可以使用 `lpoptions –d printer`\
  \ 命令来指定默认打印机。例如，要将 HPLJ5 打印机设置为默认打印机，我会输入 `lpoptions –d HPLJ5`。这将设置系统上所有用户的默认打印机。然而，单个用户可以通过在他们的家目录下创建一个名为\
  \ `.lpoptions` 的文件并添加以下指令来覆盖此设置：\n\n```\ndefault printer_name\n```\n\n如果你想查看打印机的配置设置，可以在\
  \ shell 提示符下输入 `lpoptions –l`。\n\n除了 `lpoptions` 命令外，你还可以使用 `accept printer_name`\
  \ 或 `cupsreject printer_name` 命令来启用或禁用打印机的打印队列。例如，我可以在 shell 提示符下输入 `cupsreject\
  \ HPLJ2` 来禁用打印机的打印队列，如示例所示：\n\n![Images](img/p0604-01.jpg)\n\n打印机本身将继续处理队列中的打印作业，但\
  \ `cupsd` 不允许任何新作业进入队列。`cupsdisable` 命令还包含 `--hold` 选项，它会在当前作业完成后停止打印。要再次启用队列，我会在\
  \ shell 提示符下输入 `cupsaccept HPLJ2`。\n\n要禁用打印机本身而不是队列，我可以在 shell 提示符下输入 `cupsdisable\
  \ HPLJ2`，如示例所示：\n\n![Images](img/p0604-02.jpg)\n\n打印队列将继续接受作业，但在我在 shell 提示符下输入\
  \ `cupsenable HPLJ2` 之前，没有任何作业会被打印。`cupsenable` 命令还包含 `--release` 选项，用于释放等待打印的作业。\n\
  \n### 使用行打印机守护进程 (lpd)\n\n在 CUPS 是现代 Linux 发行版的首选打印系统之前，传统的打印系统是行打印机守护进程 (lpd)。你可能不会经常使用\
  \ `lpd`，但 LPIC-1 仍要求你了解管理该守护进程的命令，如表 16-2 所示。\n\n![Images](img/t0605-01.jpg)\n\n\
  **表 16-2** lpd 命令\n\n作为一个有趣的备注，这些命令也适用于 `cupsd`。例如，你可以在 shell 提示符下输入 `lpstat`，它将返回你的\
  \ CUPS 状态（如果安装的是 CUPS）。\n\n### 故障排除打印故障\n\n询问任何系统管理员收到的投诉类型，我打赌 90% 的人会列两个主要问题：\n\
  \n![images](img/bull.jpg) 我无法登录\n\n![images](img/bull.jpg) 我无法打印\n\n为了管理 Linux 系统，你需要能够排查各种打印问题。显然，我们没有时间或空间涵盖所有的打印问题。相反，我将为你提供我在支持用户及其打印作业多年积累的关键见解。根据我的经验，这些见解将涵盖你遇到的\
  \ 80% 到 90% 的问题。让我们来看看：\n\n![images](img/bull.jpg) 始终使用上一节介绍的标准排排除模型。是的，它适用于打印，也适用于网络。在充分了解问题所在以及问题范围之前，不要盲目地尝试多种解决方案。记住，我建议你使用的模型包含以下步骤：\n\
  \n1. **收集信息**。这是一个关键步骤。你需要确定到底发生了什么。症状是什么？是否显示了错误信息？信息内容是什么？问题有多大？是仅限于单个系统，还是多个系统都遇到了相同的问题？\n\
  2. **识别变化**。在这一步中，你应该识别系统中发生了什么。是否安装了新软件？是否安装了新硬件？用户更改了什么？你更改了什么？\n3. **创建假设**。根据前面的步骤收集的信息，建立几个可以解释问题的假设。为此，你可能需要进行研究。你应该检查互联网上提供的\
  \ FAQ 和知识库。你还应该咨询同事以验证你的假设。利用你获得的信息，将结果缩小到一个或两个最可能的原因。\n\n\n\n\n## 4. 确定合适的修复方案。下一步是利用同事、常见问题解答（FAQs）、知识库以及自己的经验来确定修复问题所需的步骤。在执行此操作时，务必识别实施修复后可能产生的影响并考虑到这些影响。很多时候，修复带来的副作用可能与原始问题一样糟糕甚至\
  \ worse。\n\n## 5. 实施修复。到此时，你已经准备好实施修复了。注意，在这个故障排除模型中，我们在实施修复之前做了大量的研究！这样做大大增加了成功的可能性。实施修复后，务必验证修复是否已实际解决问题，并且问题没有再次出现。\n\
  \n## 6. 确保用户满意。你需要与用户沟通问题的性质，并确保他们知道问题已经解决。你还应该教他们如何防止问题再次发生。此外，还要与用户的主管进行沟通，确保他们知道问题已修复。\n\
  \n## 7. 记录解决方案。最后，你需要对问题的解决方案进行记录。这样，当问题在一或年后再次发生时，你或其他系统管理员就可以快速识别问题以及如何修复。\n\n\
  ![images](img/bull.jpg) 记录打印作业的流程。它们源自哪里？是通过网络连接发送的，还是在本地发送的？它们最终是如何到达打印机的？\n\n\
  ![images](img/bull.jpg) 首先检查显而易见的：\n\n![images](img/bull.jpg) 打印机没纸了吗？（是的，这种情况一直发生！）\n\
  \n![images](img/bull.jpg) 打印机开启了吗？\n\n![images](img/bull.jpg) 如果是网络打印机，它是否连接到了网络？网络是否正常？你是否能从用户工作站\
  \ pingping`打印机？\n\n![images](img/bull.jpg) 用户在发送打印作业时是否选择了正确的打印机？根据我的经验，这实际上是用户打印问题的首要原因。如果用户配置了多台打印机，他们可能不理解它们之间的区别，或者根本没有注意将作业发送到了哪台打印机。当作业没有在他们的打印机上显示时，他们就会给你打电话。你可能会发现他们只是向他人的打印机发送了\
  \ 80 份 100 页文档的重复副本。\n\n![images](img/bull.jpg) 打印机是否已配置了正确的打印机驱动程序？使用错误的驱动程序会导致向打印机发送数百页的乱码。\n\
  \n考虑到这一点，让我们在接下来的练习中练习配置 CUPS。\n\n### 练习 16-1：配置 Cups\n\n在本次练习中，你将在你的 Linux 系统上安装并配置\
  \ CUPS。此练习假设你有一个独立的 Linux 系统（而非虚拟机），并且已安装并配置了以太网卡。它还假设你有一台打印机，可以连接到系统中的 USB 或并行端口。\n\
  \n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 16-1 视频，查看如何执行此任务的演示。\n\n完成以下操作：\n\
  \n1. 关闭你的 Linux 系统并物理连接打印机。\n2. 启动你的 Linux 系统并以标准用户身份登录。\n3. 打开终端会话。\n4. 通过输入 `su\
  \ –` 后跟你的 root 用户密码切换到 root 用户账户。\n5. 使用 `rpm –q` 命令验证适用于你发行版的 cups 软件包是否已安装在系统上。\n\
  6. 通过完成以下步骤创建一个 CUPS 管理用户：\n    a. 在 shell 提示符处，输入 `lppasswd –g sys –a root`。\n\
  \    b. 当提示输入密码时，输入 `M3linux273`。\n7. 通过完成以下步骤创建一个 CUPS 打印机：\n    a. 打开浏览器并导航到 `[`localhost:631`](http://localhost:631)`。\n\
  \    b. 选择 `Administration`（管理）。\n    c. 在 `Printers`（打印机）下，选择 `Add Printer`（添加打印机）。\n\
  \    d. 当提示身份验证时，使用密码 `M3linux273` 登录 `root`。\n    e. 在 `Local Printers`（本地打印机）下，选择你的打印机类型；然后选择\
  \ `Continue`（继续）。\n    f. 在 `Name`（名称）字段，为你的打印机输入一个名称。\n    g. 在 `Location`（位置）字段，为你的打印机输入一个位置。\n\
  \    h. 在 `Description`（描述）字段，输入打印机的描述。\n    i. 通过勾选 `Share This Printer`（共享此打印机）在网络上共享打印机；然后选择\
  \ `Continue`。\n    j. 在 `Make`（品牌）字段，选择你的打印机制造商；然后选择 `Continue`。\n    k. 在 `Model`（型号）字段，选择你的打印机型号；然后选择\
  \ `Continue`。此时你的打印机应该已经创建完成。\n8. 通过以下操作向打印机发送打印作业：\n    a. 打开终端会话并生成用户主目录下的文件列表。\n\
  \    b. 选择一个文本文件进行打印。\n    c. 在 shell 提示符处，输入 `lp –d *printer_name filename*`。\n\
  \    d. 验证文档已在你的打印机上打印。\n\n现在你已经知道如何在你的 Linux 系统上设置打印，我们需要切换话题，讨论如何保持系统时间同步。让我们接下来处理这一点。\n\
  \n### 维护系统时间\n\n回想一下，当你最初设置 Linux 系统时，系统会提示你配置系统时间和时区。你可能没有认为这些设置对系统的整体运行至关重要。我与许多系统管理员一起工作，他们也有想法。他们系统上的时间总是不准确的，这快让我疯了！\n\
  \n然而，当你使用 Linux 时，保持正确的系统时间实际上是非常重要的，特别是当系统提供网络服务时。你需要确保文件时间戳是准确的。如果你的系统参与了某种目录服务或是数据库服务器，那么维护正确的系统时间是绝对关键的。例如，从客户端系统提交到数据库服务器的每个更改必须有一个准确的时间戳。想象一下如果因为时间戳不准确导致数据库修改错错应用会发生什么问题。你的数据完整性就完蛋了！\n\
  \n在第 5 章中，我们在查看本地区域设置时讨论了如何设置时区。在本章中，我们将介绍以下主题：\n\n![images](img/bull.jpg) 使用 `hwclock`\
  \ 设置硬件时钟\n\n![images](img/bull.jpg) 使用 `netdate` 同步时间\n\n![images](img/bull.jpg)\
  \ 使用 NTP 同步时间\n\n让我们首先讨论如何使用 `hwclock` 管理时间。\n\n#### 使用 hwclock 设置硬件时钟\n\n回想第 5\
  \ 章](#ch5.html_ch5)，Linux 系统使用了两个时间源：\n\n![images](img/bull.jpg) **硬件时钟 (Hardware\
  \ clock)**：此时钟集成在你 Linux 系统主板的 CMOS 芯片中。它一直运行，即使在系统关机时也是如此。\n\n![images](img/bull.jpg)\
  \ **系统时间 (System time)**：此时钟通过 Linux 内核内部的软件运行。它由 ISA 定器中断驱动。系统时间测量为自 UTC 1970 年\
  \ 1 月 1 日 00:00:00 以来的秒数。\n\n需要记住的关键点是，硬件时钟和系统时间可能不一致。在管理 Linux 系统时，我们更关心系统时间而不是硬件时钟报告的时间。硬件时钟的作用非常基础。它的工作是在系统关机时计时。当\
  \ Linux 操作系统启动时，系统时间会同步到硬件时钟时间。启动后，Linux 只使用系统时间。硬件时钟会被忽略。\n\n要管理系统上的硬件时钟，你可以在 shell\
  \ 提示符处使用 `hwclock` 命令。它可以执行以下操作：\n\n![images](img/bull.jpg) 显示当前时间。\n\n![images](img/bull.jpg)\
  \ 设置硬件时钟时间。\n\n![images](img/bull.jpg) 将硬件时钟同步到系统时间。\n\n\n\n\n\n![images](img/bull.jpg)\
  \ 将系统时间同步到硬件时钟。\n\n![Images](img/note.jpg)\n\n**注意** 在某些 Linux 发行版中，你也可以通过查看 `/proc/driver/rtc`文件的内容查看硬件时钟的当前时间。\n\
  \n在大多数 Linux 发行版中，你可以在使用 `hwclock` 时使用表 16-3 所示的选项。\n\n![Images](img/t0609-01.jpg)\n\
  \n**表 16-3** `hwclock` 命令选项\n\n如你所见，`hwclock` 的功能范围限于本地计算机系统。在网络上，你可能需要确保 Linux\
  \ 系统上的系统时间是同步的。你可以用来实现此目的工具之一是 `netdate`。让我们来看看它是如何操作的。\n\n### 使用 netdate 同步时间\n\
  \n你可以使用 `netdate` 命令将本地系统的时间与网络上时间服务器的时间同步。语法为 `netdate time_server`，其中 `time_server`\
  \ 是网络上运行时间服务的另一个 Linux 系统的 IP 地址或 DNS 名称，该系统默认配置为监听时间请求的 UDP 端口 37。时间服务器可以是本地局域网内的内部提供者，也可以是基于互联网的时间提供者。\n\
  \n![Imags](img/note.jpg)\n\n**注意** 你实际上可以使用 `netdate` 命令指定多个时间服务器。如果你这样做，将对从不同时间服务器返回的时间进行比较。最常返回的时间值将被认为是最准确的，并应用到系统时间上。\n\
  \n在用 `netdate` 同步系统时间后，你可能希望使用之前讨论过的 `hwclock --systohc` 命令将系统时间同步到硬件时钟。\n\n需要注意的是，`netdate`\
  \ 只同步一次时间。如果你的系统时间发生了漂移（这是在所避免的），你可能需要按照定期计划运行 `netdate`（可能还需要运行 `hwclock --systohc`）以保持时间同步。这可以使用\
  \ cron 任务自动完成。然而，这真的不是最佳选择。定期保持时间同步的更优方法是使用网络时间协议（NTP）。让我们接下来回顾一下 NTP 是如何工作的。\n\n\
  #### 使用 NTP 同步时间\n\n在 cron 任务中使用 `netdate` 来保持时间同步的关键问题在于，`netdate` 会剧烈地调整时间。它不会逐渐调整时间以达到同步点。时间服务器上的时间是多少，本地系统的系统时间就会被设置为多少。此外，取决于你本地系统时钟的漂移情况，`netdate`\
  \ 可能会向前或向后调整时间。这会严重干扰你本地文件的时间戳，并可能导致某些 Linux 服务完全崩溃。\n\n网络时间同步的更优选择是使用网络时间协议（NTP）与网络时间提供者同步时间。NTP\
  \ 管理时间的方式比 `netdate` 清洁得多。NTP 调整时间的方式要温和得多。如果时间提供者和时间消费者（你的本地系统）之间存在时间差，它会以小增量逐渐调整时间，直到最终实现同步。\n\
  \nNTP 也被大多数操作系统的支持。`netdate` 选项仅适用于 Linux/UNIX 时间提供者的时间服务。相反，NTP 允许在异构网络环境中的系统之间同步时间。它支持以下操作系统：\n\
  \n![images](img/bull.jpg) Linux\n\n![images](img/bull.jpg) Windows\n\n![images](img/bull.jpg)\
  \ OSX\n\n![images](img/bull.jpg) UNIX\n\nNTP 比 `netdate` 稍微复杂一些。因此，要实现 NTP，你需要熟悉以下内容：\n\
  \n![images](img/bull.jpg) NTP 如何工作\n\n![images](img/bull.jpg) 配置 NTP\n\n让我们从讨论 NTP\
  \ 是如何工作的开始。\n\n### NTP 如何工作\n\n你可以在 Linux 上使用 `ntpd` 守护进程来与另一个 NTP 时间提供者同步时间。事实上，运行\
  \ `ntpd` 的系统可以同时作为时间消费者和时间提供者。NTP 协议运行在 IP 端口 123 上。时间消费者向端口 123 上的时间提供者发送时间同步请求。时间提供者将其时间发送给消费者，消费者的系统时间根据\
  \ NTP 算法进行调整。\n\n![Images](img/tip.jpg)\n\n**提示** 由于 NTP 设计用于跨全球网络同步时间，它假设所有涉及的系统都配置为使用\
  \ UTC 时间。\n\n以下是你需要熟悉的几个关键 NTP 概念：\n\n![images](img/bull.jpg) **层级 (Stratum)** NTP\
  \ 使用层级概念来定义 NTP 服务器的层次结构：\n\n![images](img/bull.jpg) **1 级 (Stratum 1)** 第 1 级时间服务器从参考时间源获取时间，例如海军原子钟。（更多信息请参见\
  \ tycho.usno.navy.mil。）\n\n![images](img/bull.jpg) **2 级 (Stratum 2)** 从 1 级服务器获取时间的时间服务器。\n\
  \n![images](img/bull.jpg) **3 级 (Stratum 3)** 从 2 级服务器获取时间的时间服务器。\n\n![images](img/bull.jpg)\
  \ **n 级 (Stratum n)** NTP 服务器的深度可以持续达到 256 层。\n\n尽管这些服务器在互联网上可用，但你可能不会被允许访问 1 级服务器。然而，许多\
  \ 2 级服务器是公开可用的。为了减少这些公共时间源的负载，你应该在内部网络上配置极少数的系统来与公共时间提供者同步时间。事实上，许多组织仅在网络上配置单个的\
  \ 3 级服务器，该服务器从互联网上的公共 2 级服务器获取时间。然后，他们配置所有内部主机从该服务器获取时间。在规模较大的网络中，你可能需要配置几个 4 级服务器，并配置它们从你的\
  \ 3 级服务器获取时间，然后配置网络中的其他主机从 4 级服务器获取时间。这在 图 16-11 中所示。\n\n![images](img/bull.jpg)\
  \ **步进与调频 (Stepping and slewing)** NTP 协议最初在时间消费者和时间提供者之间大约每分钟同步一次时间。然而，一旦提供者和消费者的时间密切同步，间隔逐渐增加到每\
  \ 17 分钟一次。基本上，大幅调整发生得较快，然后在较长的时间间隔内仅进行微调。\n\n如果提供者和消费者之间的时间差小（小于 128 毫秒），NTP 会逐渐调整消费者的时间。这被称为调频\
  \ (slewing)。相反，如果提供者和消费者之间的时间差较大，则会在消费者上更快速地调整时间。这被称为步进 (stepping)。\n\n![images](img/bull.jpg)\
  \ **异常时间 (Insane time)** 如果提供者和消费者之间的时间差超过 17 分钟，NTP 守护进程 (ntpd) 会认为时间为“异常”且不会进行调整。\n\
  \n![images](img/bull.jpg) **漂移 (Drift)** NTP 测量并修正偶然的时钟频率误差（称为漂移）。它将当前频率值写入 `/var/lib/ntp/drift/`\
  \ 目录下的 `ntp.drift` 文件。如果你停止并重启 NTP 守护进程，它将使用该文件中的值初始化频率。这防止了 ntpd 重新学习与系统时钟相关的频率误差。这是一个示例\
  \ `ntp.drift` 文件：\n\n![Images](img/p0612-01.jpg)\n\n![images](img/bull.jpg) **抖动\
  \ (Jitter)** 抖动是指自上次轮以来消费者和提供者之间的估计时间差。\n\n![Images](img/f0612-01.jpg)\n\n**图 16-11**\
  \ NTP 层级\n\n在这些背景的基础上，让我们讨论如何配置系统使用 NTP 从时间提供者获取时间。\n\n### **配置 NTP**\n\n为了使用 NTP\
  \ 与时间提供者配置系统时间，你必须先在 Linux 系统上安装 `ntpd` 守护进程。你可以在 shell 提示符处使用 `rpm –q ntp` 命令来实现，如下所示：\n\
  \n```\n![Images](img/p0612-02.jpg)\n```\n\n\n\n\n\n`NTP` 通常在大多数 Linux 系统上默认安装。如果尚未安装，你可以使用你选择的软件包管理工具来安装它。完成后，你接下来需要使用文本编辑器编辑\
  \ `/etc/ntp.conf` 文件。你需要做的第一件事是确保本地时钟存在以下条目，当时间服务器不可用时，将使用本地时钟：\n\n![Images](img/p0613-01.jpg)\n\
  \n这些指令告诉 `ntpd` 守护进程在无法连接任何配置的 NTP 时间提供者时，从本地时钟获取时间。\n\n接下来，你需要在文件中为你想要让系统与其同步时间的网络时间提供者添加条目。其语法如下：\n\
  \n`server time_server_IP_address_or_DNS_name`\n\n你可以指定任何你想要使用的 NTP 时间提供者的 IP 地址或\
  \ DNS  way。它可以是以下任一者：\n\n![images](img/bull.jpg) **你网络上的 NTP 时间提供者**\n\n![images](img/bull.jpg)\
  \ **互联网上的公共 NTP 时间提供者** 你可以访问 [`support.ntp.org/bin/view/Servers/WebHome`](http://support.ntp.org/bin/view/Servers/WebHome)\
  \ 查看互联网上公开可用的 NTP 时间提供者列表。如果你愿意，可以使用 `NTP pool time server*`。`pool.ntp.org` 域名使用\
  \ DNS 轮询从自愿加入池的时间提供者池中进行随机选择。这样，就不会有某个公共 NTP 服务器会被时间同步请求过载。要使用此项，只需在前面讨论的本地时钟服务器指令之外，添加以下\
  \ server 指令：\n\n`server pool.ntp.org`\n\n完成后，保存更改并关闭文件。然而，在实际启动 `ntpd` 守护进程之前，你需要与你的\
  \ NTP 时间提供者进行快速的单次同步。这里的问题是“离谱时间”（insane time）。如果你的系统时间与 NTP 时间提供者的时间偏差超过 17 分钟，你必须让两个系统进入这个时间窗口，NTP\
  \ 才能工作。\n\n* * *\n\n![Images](img/tip.jpg)\n\n**提示** 根据我的经验，离谱时间是 Linux 管理员配置 NTP\
  \ 时遇到的首要问题。他们安装了 NTP 软件并正确配置，但在启动守护进程时发现不知道为什么时间始终无法同步。\n\n你可以通过在 shell 提示符输入 `ntpdate\
  \ *address_of_time_provider` 来消除离谱时间问题。这将在启动守护进程之前执行初始同步以获取接近的时间。如果你的系统与 NTP 时间提供者之间的时间相差确实很大，你可能需要多次运行该命令。\n\
  \n* * *\n\n![Images](img/tip.jpg)\n\n**提示** 在运行 `ntpdate` 命令之前必须停止 `ntpd` 守护进程！\n\
  \n较新 Linux 发行版上的较新 NTP 版本允许配合 `ntpd` 守护进程本身使用 `ntptimeset` 选项来实现相同的功能。你不需要通过初始化脚本指定启动、停止或重启，而是在使用\
  \ init 的系统上的 shell 提示符输入 `/etc/init.d/ntp ntptimeset` 或 `rcntp ntptimeset`。当你这样做时，会与时间提供者进行快速时间同步，如例所示：\n\
  \n![Images](img/p0614-01.jpg)\n\n完成后，你可以使用你发行版所使用的相应初始化脚本目录中的初始化脚本启动 `ntpd` 守护进程。如果你的系统使用\
  \ rc 脚本，你只需在 shell 提示符输入 `rcntp start`，如下：\n\n![Images](img/p0614-02.jpg)\n\n你应该使用\
  \ `insserv ntp` 命令配置 `ntpd` 守护进程在系统启动时自动启动。启动守护进程后，可以使用 `tail` 命令检查 ntp 日志文件以验证没有发生错误。\n\
  \n如果你的发行版使用 systemd，你使用 `systemctl` 命令启动和停止 `ntpd`。例如，要启动 `ntpd` 守护进程，你会在 shell\
  \ 提示符输入 `systemctl start ntp`。你可以通过在 shell 提示符输入 `systemctl status ntp` 来验证它是否正确启动。守护进程的状态如图\
  \ 16-12 所示。\n\n一旦 NTP 守护进程启动，你可以使用 `ntpq -p` 查看时间同步状态。这是一个示例：\n\n![Images](img/p0614-01.jpg)\n\
  \n`ntpq -p` 输出中的列包括：\n- `remote`: 提供者的主机名或 IP 地址。\n- `st`: 提供者的层级（stratum）。\n- `refid`:\
  \ 参考类型。\n- `when`: 距离上次轮询的时间。\n- `reach`: 是否到达服务器。\n- `delay`: 提供者响应所花费的毫秒数。\n-\
  \ `offset`: 本地时钟与提供者之间的时间差。\n- `jitter`: 时间差异的大小。\n\n你还可以使用 `ntpq -c c` 来跟踪时间消费者是如何接收时间的。它列出了每个源的偏移、延迟和抖动。\n\
  \n![images](img/bull.jpg)\n\n等等，你还可以使用 `ntpq -c rv` 查看守护进程的状态。它指定了两次轮询之间的秒数。\n\n\
  让我们在下面的练习中练习使用 NTP。\n\n### 练习 16-2：配置 NTP\n\n在本次练习中，你将练习配置 NTP 以从 `us.ntp.org` 获取时间。为了此练习有效，你的\
  \ Linux 系统必须能够访问互联网。你可以使用随书提供的虚拟机进行此练习。\n\n* * *\n\n![Images](img/viedo.jpg)\n\n\
  **视频** 请观看练习 16-2 视频以演示如何执行此任务。\n\n完成以下操作：\n\n1. 打开终端会话并使用 `su –` 切换到 root 用户账户。\n\
  2. 在 shell 提示符处输入 `rpm -q ntp` 验证系统上已安装 ntp 包。\n3. 在 shell 提示符处输入 `vi /etc/ntp.conf`。\n\
  4. 滚动到显示以下内容的行：\n![Images](img/p0616-01.jpg)\n5. 按 INSERT 键，然后删除这两行开头的注释字符（#）。\n\
  6. 在 fudge 行下方添加新新的一行。\n7. 在新行上添加以下指令：\n`server us.ntp.org`\n该指令用于配置 ntp 服务，将你的本地计算机时间与互联网上公共\
  \ NTP 服务器的时间同步。\n8. 按 ESC 键，然后输入 `:exit`。\n9. 在 shell 提示符处输入 `ntpdate us.ntp.org`\
  \ 执行单次同步。\n10. 在 shell 提示符处输入 `systemctl start ntp` 启动 ntp 服务。\n11. 在 shell 提示符处输入\
  \ `systemctl enable ntp` 配置 ntp 守护进程在系统启动时自动启动。\n12. 在 shell 提示符处输入 `systemctl status\
  \ ntp` 检查 ntp 守护进程的状态。\n\n\n\n\n\n由于电子邮件已成为大多数网络不可或缺的组成部分，你需要了解如何管理邮件服务器。此外，许多 Linux\
  \ 服务（如 `cron`）依赖于本地邮件服务器向本地用户发送消息。因此，为了通过 Linux+/LPIC-1 考试，你需要熟悉在 Linux 系统上管理邮件传输代理（MTA）。在本章的这部分中，我们将介绍以下主题：\n\
  \n![images](img/bull.jpg) 电子邮件的工作原理\n\n![images](img/bull.jpg) 在 Linux 上使用 MTA 管理命令\n\
  \n让我们从讨论电子邮件的工作原理开始。\n\n## 电子邮件的工作原理\n\n要理解 MTA 如何工作以及如何部署它，你必须首先理解电子邮件本身是如何工作的。\n\
  \n你必须理解的第一点是，电子邮件系统是由几个模块化组件组成的。每个组件在将消息从发送者递送到接收者的过程中扮演着不同的角色。当邮件从发送者发送到接收者时，会发生以下步骤。这些步骤如图图\
  \ 16-13 所示。\n\n![Images](img/f0617-01.jpg)\n\n**图 16-13** 电子邮件流程\n\n**1.** 用户使用电子邮件客户端编写消息。电子邮件客户端软件被称为`mail\
  \ user agent (MUA)`。常见的 MUA 包括 Evolution、Mozilla Thunderbird 和 Mutt。需要记住的关键点是，MUA\
  \ 并不知道如何将消息传递给最终接收者。相反，它被配置为将发出的消息发送到邮件服务器。\n\n**2.** 当用户选择“发送”时，MUA 使用简单邮件传输协议（SMTP）将发出的消息发送到配置好的邮件服务器。`SMTP`\
  \ 是一种基于 IP 的上层协议，运行在端口 `25` 上。`SMTP` 的唯一目的是在邮件代理之间传输电邮消息。\n\n**3.** 消息从 MUA 传输到邮件服务器上的`mail\
  \ transfer agent (MTA)`。然后，MTA 决定如何处理该消息。如果消息目标是同一组织内的另一个用户，消息将由本地 MTA 留存，以便递送给接收者的\
  \ MUA。然而，如果目标是不同域的接收者，MTA 将通过互联网通过 SMTP 将消息转发到消息接收者所使用的 MTA。\n\n**4.** 目标 MTA 将电子邮件消息传输到接收者所在系统的`消息投递代理`（`MDA`，也称为`Message\
  \ Store`）。MDA 的工作是存储消息，直到接收者的 MUA 请求该消息。\n\n**5.** 接收者使用电子邮件客户端软件（另一个 MUA）连接到消息存储器（Message\
  \ Store）并拉取消息。为了做到这一点，可以使用邮局协议第 3 版（POP3）或互联网消息访问协议（IMAP）。大多数 MDA 和 MUA 都支持这两个协议。`POP3`\
  \ 使用端口 `110` 下载消息，并且消息会从消息存储器中删除。`IMAP` 在端口 `143` 上执行相同的操作。然而，与 `POP3` 相比，`IMAP`\
  \ 具有多个优势。首先，`IMAP` 允许你下载整条消息或仅下载消息头。`IMAP` 还允许你在消息存储器中保留消息副本。此外，它允许你在消息存储器中创建自定义文件夹来组织消息。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 大多数 Linux MTA 不包含任何 POP3 或 IMAP 功能。要将大多数\
  \ Linux MTA 配合终端 MUA 使用，你必须安装并配置一个 POP3/IMAP 守护进程，由该进程从 MTA 获取消息并通过适当的协议递送到 MUA。\n\
  \n所有 Linux 发行版都包含一个在系统中默认运行的 MTA。Linux 上通常实现了几种 MTA：\n\n![images](img/bull.jpg)\
  \ **sendmail** `sendmail` 守护进程是 Linux 上使用的最古老的 MTA，但它仍然是许多发行版默认的 MTA。它已经并广泛使用了多年。关于\
  \ `sendmail` 需要记住的关键点是它是非组件化的；相反，它是单一的可执行文件。然而，与其他 Linux MTA 相比，`sendmail` 的配置可能有些困难。\n\
  \n![images](img/bull.jpg) **postfix** `postfix` 守护进程是一个流行的 MTA，已经在许多 Linux 发行版中取代了\
  \ `sendmail`。`postfix` 相比 `sendmail` 的一个关键优势之一是它是模块化的，这意味着它由多个程序组成，而不是单一的可执行文件。每个程序都有其负责的任务。它使用主守护进程（master\
  \ daemon）配合多个工作守护进程，工作守护进程仅在需要时才启动。当任务完成后，主守护进程会自动关闭它们。实质上，主守护进程和工作守护进程作为一个单元共同工作，通过\
  \ MTA 处理电子邮件消息。该过程如图图 16-14 所示。\n\n![Images](img/f0619-01.jpg)\n\n**图 16-14** 通过\
  \ postfix 处理消息\n\n**1.** 如果电子邮件消息由远程 MTA 或远程 MUA 发送到 Postfix MTA，它将由 `smtpd` 工作守护进程接收到系统中。`smtpd`\
  \ 守护进程将消息转发给 cleanup 守护进程。\n\n**2.** 如果用户使用本地系统上的 shell 提示符将电子邮件消息送到 Postfix MTA，会发生以下情况：\n\
  \n**a.** 它由 `postdrop` 守护进程接收到系统中，这也是一个 postfix 工作守护进程。\n\n**b.** `postdrop` 守护进程将电子邮件消息放在\
  \ `/var/spool/postfix` 中的 maildrop 目录中。\n\n**c.** `pickup` 守护进程从 maildrop 目录传输消息并将其转发给\
  \ cleanup 守护进程。\n\n**3.** 无论电子邮件消息源自远程还是本地系统，随后都会由 cleanup 守护进程处理。\n\n**4.** cleanup\
  \ 守护进程将电子邮件消息放入输入队列（incoming queue），该队列同样位于 `/var/spool/postfix`。\n\n**5.** cleanup\
  \ 守护进程通知队列管理器守护进程（`qmgr`）消息已添加到输入队列。\n\n**6.** `qmgr` 守护进程将电子邮件消息移动到五个消息队列之一，所有队列都位于\
  \ `/var/spool/postfix`：\n\n![images](img/bull.jpg) **incoming** 该队列包含已由 cleanup\
  \ 守护进程处理的输入消息。\n\n![images](img/bull.jpg) **active** 该队列包含完整到达、处理正确并已准备好转发到下一个 MTA\
  \ 或 MDA 的消息。\n\n![images](img/bull.jpg) **hold** 该队列包含由于某些原因被推迟递送的消息。\n\n![images](img/bull.jpg)\
  \ **deferred** 该队列包含第一次尝试未能递送的消息。`qmgr` 守护进程将等待一段时间；然后将进行几次额外的递送尝试。\n\n![images](img/bull.jpg)\
  \ **corrupt** 该队列包含在传输过程中某些地方损坏且不再读的消息。\n\n**7.** `qmgr` 守护进程随后调用 trivial-rewrite\
  \ 守护进程，由它来识别消息应该发送的下一个 MTA 或 MDA。\n\n**8.** `qmgr` 守护进程随后将消息传递给适当的投递代理。如果消息目标是本地账户，则使用本地代理。如果消息目标是另一个\
  \ MTA 或 MDA，则使用 smtp 代理。\n\n**9.** 选定的代理将电子邮件消息传输到相应的系统：\n\n\n\n\n\n![images](img/bull.jpg)\
  \ `qmail` qmail MTA 也是一种模块化的 MTA 进程，经常被用作 `sendmail` 的替代品。qmail MTA 的独特之处在于，它从设计之初就考虑了安全性。本质上，它的模块化架构由互不信赖的组件组成。这意味着\
  \ MTA 中的每个模块（例如 `SMTP` 监听器）将使用一组其特有的凭据。没有两个模块使用相同的凭据。许多管理员认为 `qmail` 和 `postfix`\
  \ 一样，比 `sendmail` 更容易管理。然而，它并不是任何 Linux 发行版的默认 MTA，因为它包含了一些受专有许可协议保护的组件。尽管如此，`qmail`\
  \ 深受使用者的喜爱。我的侄女嫁给了一个系统管理员，他对 `qmail` 赞不绝口。你需要意识到 `qmail` 还实现了两个额外的邮件协议：\n\n![images](img/bull.jpg)\
  \ `快速邮件队列协议 (QMQP)` 允许在不同的 MTA 之间共享邮件队列。\n\n![images](img/bull.jpg) `快速邮件传输协议 (QMTP)`\
  \ 一种类似于 `SMTP` 的传输协议，但被认为速度更快。\n\n![images](img/bull.jpg) `Exim` 对于你的 LPIC-1/Linux+\
  \ 考试，你还需要熟悉 `Exim` MTA。`Exim` 是一个非模块化的 MTA，由单个程序组成（类似于 `sendmail`）。然而，它被认为比 `sendmail`\
  \ 更容易配置和管理。少数 Linux 发行版使用 `Exim` 作为默认 MTA。\n\n如前所述，这些 MTA 可以通过 `SMTP` 接收来自 MUA 发送的电子邮件。然而，它们无法通过\
  \ `POP3` 或 `IMAP` 将消息下载到邮件客户端。要做到这一点，你必须使用你选择的软件管理工具在系统上安装 `imap` 软件包。该包会安装 `IMAP`\
  \ 和 `POP3` 守护进程，你可以通过它们将消息从你的 MTA 传输到你的邮件客户端软件。\n\n这两个进程都使用 `xinetd` 进程进行管理。你可以通过\
  \ `/etc/xinetd.d/imap` 文件启用这些进程。完成后，重启 `xinetd` 进程。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 我们将在下一章中详细讨论 `xinetd`。\n\n如果你的发行版使用 `init`，你通过 `init` 目录中相应的 init 脚本管理你的\
  \ MTA 进程。例如，`postfix` init 脚本命名为 `postfix`，而 `sendmail` init 脚本为 `sendmail`。如果你的发行版使用\
  \ `systemd`，你使用 `systemctl` 命令来启动、停止或重载系统上安装的 MTA 的相应服务文件。\n\n现在你已经了解了电子邮件的工作原理以及\
  \ MTA 的角色，让我们接下来查看在 Linux 上用于管理 MTA 的命令。\n\n### **在 Linux 上使用 MTA 管理命令**\n\n让我们先查看存储在本地\
  \ MTA 中的消息。当你登录到 shell 会话时，如果有等待处理的邮件消息，你将收到通知。你可以直接在 shell 提示符下使用 `mail` 命令从本地\
  \ MTA 读取本地用户的消息。当你执行操作时，会显示消息列表。示例见图 16-15。\n\n![Images](img/f0621-01.jpg)\n\n**图\
  \ 16-15** 从 shell 提示符读取邮件\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 运行在 Linux\
  \ 上的某些服务配置为向 root 用户发送通知消息。\n\n这些消息存储在用户的邮件队列中，位置位于 `/var/spool/mail/` 目录。`mail`\
  \ 工具直接从你的用户队列文件中读取消息。由于你是在邮件队列所在的同一台系统上运行 `mail` 工具，因此你不需要配置 `POP3` 或 `IMAP` 支持。你可以在\
  \ `?` 提示符处输入表 16-4 所示的 `mail` 命令。\n\n![Images](img/t0622-01.jpg)\n\n**表 16-4** 邮件命令\n\
  \n使用 `t` 命令查看收到的消息的示例见图 16-16。\n\n![Images](img/f0622-01.jpg)\n\n**图 16-16** 在邮件队列中查看消息\n\
  \n要发送消息，你也可以在 shell 提示符下输入 `mail *recipient_address`。然后你可以输入主题和消息正文。完成后按 `CTRL-D`\
  \ 实际发送消息。当你这样做时，消息将由你的本地 MTA 递送到另一个用户的邮件队列。\n\n要查看邮件队列中的未读消息列表，你可以在 shell 提示符下输入\
  \ `mailq`。\n\n除了 `mail`，还有许多其他软件包可以安装以从 shell 提示符读取邮件。需要记住的关键点是，用户必须从*本地* shell\
  \ 提示符运行 `mail` 命令。如果用户没有使用本地计算机系统，他们必须 `ssh` 进入系统读取邮件。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 我们将在第 18 章中讨论 `ssh`（安全 shell）。\n\n你还可以为在 Linux 系统上的 MTA 配置别名。邮件别可以将发送给用户的邮件重定向到另一个账户。你使用\
  \ `/etc/aliases` 文件来配置别名。该文件每行定义一个别名。你定义的别名必须指向一个有效的电子邮件地址。该文件的格式如下：\n\n`别名: 电子邮件列表`（用逗号分隔）\n\
  \n例如，大多数 Linux 发行版在该文件中必须包含以下两个别名：\n\n![Images](img/p0622-02.jpg)\n\n这些别名导致发送给 `postmaster`\
  \ 的任何邮件自动重定向到 root 用户。同样，发送给 `mailer-daemon` 的任何邮件将重定向到 `postmaster`（然后重定向到 root）。取决于你的发行版，你可能会发现默认定义了许多别名。这是一个示例：\n\
  \n![Images](img/p0622-03.jpg)\n\n当然，如果有需要，你可以输入自定义别名。只需使用文本编辑器打开别名文件并每行添加相应的别名。完成后，必须以\
  \ root 身份在 shell 提示符下运行 `newaliases` 命令来启用它们。\n\n你还可以使用用户目录下的 `~/.forward` 文件来配置转发。大多数\
  \ Linux MTA 检查用户目录下是否存在此文件以配置消息转发。你可以使用文本编辑器打开/创建该文件并输入你想转发的邮件地址。如果你转发到本地用户，只需输入用户名。如果你转发到远程用户账户，输入\
  \ `*username@domain.com`。如果你需要将消息转发给多个接收者，请用逗号分隔。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** MTA 将你在该文件中输入的地址视为别名。这会导致所有邮件都被转发到转发电子邮件地址。消息*不会*递送到原始用户的邮箱箱中。\n\n\n\n\n\
  \n`database`（数据库）是组织信息的集合，通过这种方式可以根据你创建的搜索查询快速地选择和检索数据。在过去的 20 年里，数据库已成为全球商业、通信和政府的骨干。不再需要装满纸质文档的大型房间，数据库允许我们在极小的物理空间内存储海量信息。\n\
  \n数据库服务运行在客户端/服务器模型上。你通常会在数据库服务器上安装客户端和服务器部分。然后，你可以将客户端软件安装在用于访问数据库中信息的客户端系统上。Linux\
  \ 上通常实现两种数据库服务：\n\n![images](img/bull.jpg) MySQL\n\n![images](img/bull.jpg) PostgreSQL\n\
  \n通过安装这些数据库服务之一，你就安装了使用 `SQL`（Structured Query Language，结构化查询语言）运行、操作和管理数据库所需的软件，而\
  \ `SQL` 是一种用于访问和操作数据库的标准语言。`SQL` 定义了用于检索和更新数据库数据的语句，例如 `SELECT`、`UPDATE`、`DELETE`、`INSERT`\
  \ 和 `WHERE`。\n\n这两种数据库服务都是关系型数据库，其本质上是层次化的。关系型数据库专门用于组织和存储海量数据。它们的设计具有高度可扩展性，允许随时间的推移而增长。\n\
  \n关系型数据库使用字段、记录和表来组织。`field`（字段）是单元信息。`record`（记录）是一组完整的字段，而 `table`（表）是记录的集合。每个表由一个名称标识，例如\
  \ `Customers`。每个表包含记录（每条记录一行），记录包含一个或多个字段，字段又包含实际的数据库数据。例如，假设你定义了一个名为 `Customers`\
  \ 的表并创建了以下三个记录：\n\n![Images](img/p0625-01.jpg)\n\n使用 `SQL` 语言，你可以创建查询从数据库中选择并检索特定数据。例如，假设你编写了以下查询：\n\
  \n```sql\nSELECT Last FROM Customers\n```\n\n数据库将返回以下数据：\n\n`Last`\n`Tracy`\n`Morgan`\n\
  \n你可以使用以下命令来管理 `SQL` 数据库中的数据：\n\n![images](img/bull.jpg) `SELECT` 从表中检索信息\n\n![images](img/bull.jpg)\
  \ `UPDATE` 修改表中的信息\n\n![images](img/bull.jpg) `DELETE` 从表中删除信息\n\n![images](img/bull.jpg)\
  \ `INSERT INTO` 向表中添加新数据\n\n![images](img/bull.jpg) `CREATE TABLE` 创建新表\n\n![images](img/bull.jpg)\
  \ `ALTER TABLE` 修改现有表\n\n![images](img/bull.jpg) `DROP TABLE` 删除现有的表\n\n关系型数据库的一个关键特性是你可以在表之间创建\
  \ `relationships`（关系），这允许你创建相互相关的数据集。\n\n考虑到这一点，让我们看看如何在你的 Linux 系统上安装 `SQL` 数据库。\n\
  \n## 安装 MySQL\n\n虽然在 Linux 上可以安装多种不同的 `SQL` 数据库服务，但本章将重点介绍使用 `MySQL Community Server`。`MySQL`\
  \ 是一个开源的 `SQL` 数据库服务器，包含在大多数发行版的安装介质中。它相对容易安装，并且容易开始创建数据库。\n\n你的 Linux 发行版可能默认安装了\
  \ `MySQL`，也可能没有安装。如果系统上没有安装，请使用你选择的包管理工具安装以下包：\n\n![images](img/bull.jpg) `mysql-community-server`\n\
  \n![images](img/bull.jpg) `mysql-community-server-client`\n\n![images](img/bull.jpg)\
  \ `mysql-community-server-tools`\n\n***\n\n![Imags](img/note.jpg)\n\n**注意** 你实际安装的包取决于你使用的\
  \ Linux 发行版以及你正在安装的 `MySQL` 版本。\n\n安装完 `MySQL` 包后，你接下来需要设置 `MySQL 服务器的授权表（grant\
  \ tables）。所有的 `MySQL` 访问控制都是在 `MySQL` 服务内部管理的。重要的是要理解 `MySQL` 在其授权表中定义了自己的一组用户账户；它并不使用定义在你的\
  \ Linux 系统上的账户。`MySQL` 数据库内部实现了五张表来实现这一点：\n\n![images](img/bull.jpg) `user` 指定用户是否允许连接到\
  \ `MySQL` 服务器\n\n![images](img/bull.jpg) `db` 定义用户允许访问哪些数据库\n\n![images](img/bull.jpg)\
  \ `host` 指定哪些主机允许访问特定数据库\n\n![images](img/bull.jpg) `tables_priv` 定义给定表的访问权限\n\n\
  ![images](img/bull.jpg) `columns_priv` 指定给定表中特定数据列的访问权限\n\n在使用 `MySQL` 之前，必须初始化这些表。这是通过切切换到\
  \ `/usr/bin` 目录并在 shell 提示符下运行 `mysql_install_db` 命令完成的。执行后，授权表即可就绪。你只需要在最初安装 `MySQL`\
  \ 后运行一次 `mysql_install_db`。该命令创建了两个名为 `root` 和 `anonymous-user` 的 `MySQL` 用户账户。\n\
  \n创建授权表后，你接下来需要启动数据库服务。如果你的发行版使用 `init`，可以使用位于 init 脚本目录下的 `mysql` init 脚本。然后你可以使用\
  \ `insserv` 或 `chkconfig` 命令确保数据库服务每次系统启动时都启动。如果你的发行版使用 `systemd`，你可以使用 `systemctl`\
  \ 命令启用并启动 `mysql` 服务。\n\n要验证服务器是否正在运行，你可以在命令行中输入 `mysqladmin`。\n\n\n\n\n\n**视频**\
  \ 请观看练习 16-3 视频，查看如何执行此任务的演示。\n\n完成以下操作（命令中的分号必须保留）：\n\n1. 使用 `su–` 命令切换到 root 用户。\n\
  \n2. 通过切换到 `/usr/bin` 目录并在 shell 提示符下运行 `mysql_install_db` 命令来设置 MySQL 服务器的权限表。\n\
  \n3. 在 shell 提示符下输入 `servicectl start mysql` 启动 MySQL 服务。\n\n4. 在 shell 提示符下输入 `mysqladmin\
  \ version` 命令验证服务器正在运行。\n\n5. 在 shell 提示符下输入 `mysqladmin –u root password ‘*your_new_password*’`\
  \ 为你的 MySQL root 用户分配密码。\n\n6. 在 shell 提示符下输入 `mysql –h localhost –u root –p` 从命令行连接到\
  \ MySQL 服务器。提示时，输入你刚刚指定的 root 密码。\n\n7. 在 mysql 提示符下输入 `CREATE DATABASE customers;`。你应该会收到数据库已创建的提示。\n\
  \n8. 要使用新数据库，在 mysql 提示符下输入 `USE customers;`。\n\n9. 要查看新数据库中默认定义的表，在 mysql 提示符下输入\
  \ `SHOW TABLES;`。你应该看到没有定义任何表。此时，情况变得稍微复杂了。你需要使用 `CREATE TABLE` 命令来创建表，但你还需要在命令中定义列。因此，你首先需要定义你想包含在表中每个记录中的字段。你还需要决定每个字段将存储什么类型的数据，以及表将有多长。在我们在这里构建的表中，我们需要四个列：\n\
  \n   - first（名）\n   - last（姓）\n   - phone（电话）\n   - lastcontact（最后联系日期）\n\n我们知道‘first’和‘last’字段将包含不同长度的字母。‘phone’字段将包含十位数字和两个连字符（*区码-前缀-号码号码*）。`lastcontact`\
  \ 列将包含每个客户最后一次购买的日期。\n\n10. 在 mysql 提示符下输入 `CREATE TABLE active (first VARCHAR(15),\
  \ last VARCHAR(15), phone CHAR(12), lastcontact DATE);` 在数据库中创建一个新表。\n\n11. 在 mysql\
  \ 提示符下输入 `DESCRIBE active;` 验证表和列是否正确创建。你应该看到 active 表及其字段已创建，如下所示：\n\n![Images](img/p0629-01.jpg)\n\
  \n定义表后，你现在可以向其插入数据。\n\n12. 要为名为 Robb Tracy 的客户添加记录，在 mysql 提示符下输入 `INSERT INTO active\
  \ VALUES (‘Robb’,‘Tracy’,‘801-756-5555’,‘2015-07-01’);`。\n\n13. 要查看刚添加到表中的数据，你使用以下语法：\n\
  \n![Images](img/p0629-02.jpg)\n\n例如，要查看 active 表中的所有内容，可以在 mysql 提示符下输入 `SELECT\
  \ * FROM active;`。你应该看到以下数据：\n\n![Images](img/p0629-03.jpg)\n\n你也可以输入 `SELECT first,phone\
  \ FROM active;` 仅查看每个记录中的某些字段。另一个例子是 `SELECT * FROM active WHERE last=‘Tracy’;`，用于查看\
  \ last 字段中包含字符串“Tracy”的记录。\n\n你也可以从表中删除数据。语法如下：\n\n```\nDELETE FROM table WHERE\
  \ conditions\n```\n\n例如，要从表中删除 Robb Tracy 的记录，你可以在 mysql 提示符下输入 `DELETE FROM active\
  \ WHERE last=‘Tracy’;`。在删除之前，你应该先使用等效 `SELECT` 命令查看你具体将删除什么！例如，先运行 `SELECT FROM\
  \ active WHERE last=‘Tracy’;`，然后运行 `DELETE FROM active WHERE last=‘Tracy’;`。\n\n\
  你还可以使用 `UPDATE` 命令修改现有数据。语法如下：\n\n```\nUPDATE table_name SET column = new_value\
  \ WHERE condition\n```\n\n你可以使用 `GROUP BY` 语句通过一个或多个列合并 `SELECT` 语句的结果。它通常与 `SUM()`语句一起使用。例如，假设\
  \ active 表包含名为 `quantity` 和 `custid` 的两个额外列，你使用这些信息记录个人订单。在这种情况下，每个客户在表中可能有多个记录——每个放置的订单有一个记录。命令\
  \ `SELECT custid,SUM(quantity) AS “Total” FROM active GROUP BY custid;` 会为每个唯一的客户\
  \ ID 聚合一个结果，在名为“Total”的新列中显示每个客户购买的总数量。\n\n***\n\n![Images](img/tip.jpg)\n\n**提示**\
  \ 你还可以使用 `JOIN` 命令合并来自两个不同表的字段。\n\n### 本章总结\n\n在本章中，我们查看了可以在 Linux 上实现的几种网络服务。首先，我们查看了如何使用\
  \ CUPS 配置打印。CUPS 服务通过 `cupsd` 守护提供。CUPS 可以在本地网络上发布其打印机可用。其他 Linux 系统可以监听这些公告，连接到\
  \ CUPS 服务并将打印作业发送到其打印机。CUPS 系统由以下部分组成：\n\n- CUPS 调度器\n- CUPS 过滤器\n- CUPS 后端\n- PPD\
  \ 文件\n- 基于 Web 的配置\n- /var/spool/cups\n\nCUPS 服务使用 `/etc/cups/cupsd.conf` 配置。设置\
  \ CUPS 需要完成的任务之一是配置 CUPS 管理员。执行此操作，在 shell 提示符下输入 `lppasswd –g sys –a user_name*`。完成后，你可以打开\
  \ 浏览器并导航到 [localhost:631](http://localhost:631)，使用基于 Web 的配置实用程序创建打印机。创建打印机后，你可以在图形应用程序中选择\
  \ **File** | **Print** 来发送打印作业。你也可以从 shell 提示符下使用 `lp` 命令发送打印作业。你可以使用以下命令行工具管理你的\
  \ CUPS 系统：\n\n- `lpstat –t`: 显示有关 CUPS 打印机的信息\n- `cancel`: 取消打印作业\n- `lpoptions\
  \ –d`: 设置系统的默认打印机\n- `cupsaccept/cupsreject`: 启用或禁用 CUPS 打印队列\n- `cupsenable/cupsdisable`:\
  \ 启用或禁用 CUPS 打印机\n\n你还可以使用行打印守护 (lpd) 管理 Linux 打印。你可以使用 lpd 命令执行以下操作：\n\n- `lpr\
  \ –P printer_name filename*`: 打印文档。\n- `lpc status`: 查看打印机状态。\n- `lpq`: 查看等待的打印作业。\n\
  - `lprm *job_number*`: 从队列中删除等待的打印作业。\n\n这些命令也适用于 CUPS 打印机和打印队列。\n\n\n\n\n\n`netdate`\
  \ 命令在同步网络时间方面工作良好。然而，按定期计划保持时间同步的更好方法是使用网络时间协议（NTP）。与 `netdate` 相比，NTP 管理时间的方式更加简洁。NTP\
  \ 调整时间的方式更加温和。如果时间提供者和时间消费者（你的本地系统）之间存在时间差，NTP 会通过小增量逐渐调整时间，直到最终实现同步。NTP 也被大多数操作系统广泛支持。\n\
  \n你可以使用 Linux 上的 `ntpd` 守护进程与另一个 NTP 时间提供者同步。运行 `ntpd` 的系统可以同时作为时间消费者和时间提供者。NTP\
  \ 协议运行在 IP 端口 `123` 上。时间消费者向端口 `123` 上的时间提供者发送时间同步请求。时间提供者将其时间发送给消费者，系统根据 NTP 算法调整消费者的时间。\n\
  \n下面列出了你需要熟悉的几个关键 NTP 概念：\n\n![images](img/bull.jpg) 层级 (Stratum)\n![images](img/bull.jpg)\
  \ 步进与调频 (Stepping and slewing)\n![images](img/bull.jpg) 异常时间 (Insane time)\n![images](img/bull.jpg)\
  \ 漂移 (Drift)\n![images](img/bull.jpg) 抖动 (Jitter)\n\n一旦在系统中安装了 NTP，你可以使用文本编辑器编辑\
  \ `/etc/ntp.conf` 文件以指定应该从哪个系统获取时间。语法如下：\n\n`server time_server_IP_address_or_DNS_name`\n\
  \n如果需要，你可以使用 NTP 池时间服务器。`pool.ntp.org` 域名使用 DNS 轮询，从自愿加入池的时间提供者中进行随机选择。\n\n在实际启动\
  \ `ntpd` 守护进程之前，你需要与你的 NTP 时间提供者进行快速的单次同步，以避免异常时间问题。这是通过在 shell 提示符处输入 `ntpdate\
  \ address_of_time_provider` 完成的。这将在启动守护进程之前执行初始同步以获取接近的时间。如果你的系统与 NTP 时间提供者之间的时间相差很大，你可能实际上需要多次运行该命令。完成后，你可以使用你发行版所适当初始化脚本目录中的初始化脚本启动\
  \ `ntpd` 守护进程。\n\n一旦启动了 NTP 守护进程，你可以使用两个命令来跟踪 `ntpd` 守护进程的工作情况：\n\n![images](img/bull.jpg)\
  \ ntpq –p\n![images](img/bull.jpg) ntptrace\n\n掌握了 NTP 后，我们接着查看了管理 Linux MTA。我首先回顾了电子邮件的工作原理。我们查看了\
  \ MUA、MTA 和 MDA 的角色，以及 IMAP 和 POP3 守护进程。然后我们查看了几个常用的 Linux MTA：\n\n![images](img/bull.jpg)\
  \ sendmail\n![images](img/bull.jpg) postfix\n![images](img/bull.jpg) qmail\n![images](img/bull.jpg)\
  \ Exim\n\n这些 MTA 可以通过 SMTP 接收来自 MUA 发出的电子邮件消息。然而，它们不能通过 POP3 或 IMAP 将消息下载到电子邮件客户端。要做到这一点，你必须在系统中安装\
  \ `imap` 软件包。\n\n然后我们查看了 `mail` 命令行工具，你可以使用 shell 提示符使用它读取存储在本地 MTA 中的电子邮件。要发送消息，你可以在\
  \ shell 提示符处输入 `mail recipient_address`。要查看邮件队列中的未读消息列表，可以在 shell 提示符处输入 `mailq`。\n\
  \n你还可以为运行在 Linux 系统上的 MTA 配置别名（aliases）。邮件别名将发送给一个用户的邮件重定向到另一个用户的账户。你使用 `/etc/aliases`\
  \ 文件来配置别名。该文件每行定义一个别名。定义的别名必须指向现有电子邮件地址。该文件的语法如下：\n\n`alias: list of real e-mail\
  \ addresses`\n\n完成别名配置后，必须以 root 身份在 shell 提示符运行 `newaliases` 命令来启用它们。\n\n你还可以使用用户家目录下的\
  \ `~/.forward` 文件配置转发。大多数 Linux MTA 都会检查用户家目录下是否存在此文件以配置消息的转发。你可以在文本编辑器中打开/创建该文件，并输入你想要转发邮件的电子邮件地址。\n\
  \n此时，我们将注意力转移到管理 SQL 数据上。我开始讨论数据库如何工作以存储信息。Linux 上通常实现两种数据库服务：\n\n![images](img/bull.jpg)\
  \ MySQL\n![images](img/bull.jpg) PostgreSQL\n\nSQL 定义了用于检索和更新数据库中数据的语句，例如 `SELECT`、`UPDATE`、`DELETE`、`INSERT`\
  \ 和 `WHERE`。关系型数据库使用字段（fields）、记录（records）和表（tables）进行组织。一个 `field` 是单条信息。一个 `record`\
  \ 是一组完整的字段，而一个 `table` 是记录的集合。每个表由一个名称标识，例如 `Customers`。每个表包含记录（每条记录一行），记录包含一个或多个字段，字段又包含实际的数据库数据。你可以使用以下命令管理\
  \ SQL 数据库中的数据：\n\n![images](img/bull.jpg) SELECT\n![images](img/bull.jpg) UPDATE\n\
  ![images](img/bull.jpg) DELETE\n![images](img/bull.jpg) INSERT INTO\n![images](img/bull.jpg)\
  \ CREATE TABLE\n![images](img/bull.jpg) ALTER TABLE\n![images](img/bull.jpg) DROP\
  \ TABLE\n\n然后我回顾了如何在 Linux 上实现 MySQL 数据库服务。一旦安装，你就可以使用 SQL 客户端管理 SQL 服务器中的数据。我回顾了如何使用\
  \ shell 提示符处的 `mysql` 命令来实现。语法为 `mysql –h host_name –u user_name –p`。然后我讨论了如何在 `mysql`\
  \ 客户端中使用以下命令：\n\n![images](img/bull.jpg) CREATE DATABASE\n![images](img/bull.jpg)\
  \ USE\n![images](img/bull.jpg) SHOW TABLES\n![images](img/bull.jpg) CREATE TABLE\n\
  ![images](img/bull.jpg) DESCRIBE\n![images](img/bull.jpg) SELECT\n![images](img/bull.jpg)\
  \ FROM\n![images](img/bull.jpg) WHERE\n![images](img/bull.jpg) DELETE\n![images](img/bull.jpg)\
  \ UPDATE\n![images](img/bull.jpg) JOIN\n\n### 快速回顾\n\n![images](img/bull.jpg) 大多数\
  \ Linux 发行版使用 CUPS 提供本地和网络打印。\n![images](img/bull.jpg) CUPS 服务由 `cupsd` 守护进程提供。\n\
  ![images](img/bull.jpg) CUPS 可以在本地网络上发布其打印机的可用性。\n![images](img/bull.jpg) 其他 Linux\
  \ 系统可以监听这些公告，连接到 CUPS 服务并向其打印机发送打印作业。\n![images](img/bull.jpg) CUPS 系统由 CUPS 调度器、CUPS\
  \ 过滤器、CUPS 后、PPD 文件、基于 Web 的配置工具和打印队列（`/var/spool/cups`）组成。\n![images](img/bull.jpg)\
  \ CUPS 服务通过 `/etc/cups/cupsd.conf` 文件配置。\n![images](img/bull.jpg) 要让其他 Linux 系统通过你的\
  \ CUPS 打印机打印，你必须取消 `/etc/cups/cupsd.conf` 文件中 `BrowseAddress` 指令的注释。\n![images](img/bull.jpg)\
  \ 在 shell 提示符处使用 `lppasswd –g sys –a user_name` 命令创建 CUPS 管理员。\n![images](img/bull.jpg)\
  \ 你使用基于 Web 的配置工具配置打印机。访问地址为 [`localhost:631`](http://localhost:631)。\n![images](img/bull.jpg)\
  \ 创建 CUPS 打印机后，你可以在图形 Linux 应用中选择 `File | Print`发送打印作业。\n![images](img/bull.jpg)\
  \ 你可以使用 `lp` 命令从 shell 提示符发送打印作业。\n![images](img/bull.jpg) 你可以使用以下命令行工具管理你的 CUPS\
  \ 系统：\n\n![images](img/bull.jpg) lpstat –t\n![images](img/bull.jpg) cancel\n![images](img/bull.jpg)\
  \ lpoptions –d\n![images](img/bull.jpg) cupsaccept/cupsreject\n![images](img/bull.jpg)\
  \ cupsenable/cupsdisable\n你还可以使用行打印机守护进程 (`lpd`) 管理 Linux 打印。你可以使用 `lpd` 命令执行以下操作：\n\
  \n![images](img/bull.jpg) 使用 `lpr –P printer_name filename` 打印文档。\n![images](img/bull.jpg)\
  \ 使用 `lpc status` 查看打印机状态。\n![images](img/bull.jpg) 使用 `lpq` 查看等待中的打印作业。\n![images](img/bull.jpg)\
  \ 使用 `lprm job_number` 从打印队列中删除等待中的作业。\n\n\n\n\n![images](img/bull.jpg) 你应该使用标准流程来排排除打印问题。\n\
  \n![images](img/bull.jpg) 你应该记录打印作业的流程，以帮助你排除打印问题。\n\n![images](img/bull.jpg) 常见的打印问题包括：\n\
  \n- 打印机没纸了吗？\n- 打印机开启了吗？\n- 如果是网络打印机，它是否连接到了网络？\n- 网络是否正常？\n- 你能从用户工作站 ping 通打印机\
  \ 吗？\n- 用户在发送打印作业时是否选择了正确的打印机？\n- 是否为该打印机配置了正确的打印机驱动？\n\n你可以使用 `hwclock` 命令来管理硬件时钟。\n\
  \n要同步网络 Linux 系统之间的时间，你可以在 shell 提示符运行 `netdate` 命令。\n\n语法为 `netdate time_server`，其中\
  \ `time_server` 是网络上另一台运行 UDP 端口 37 时间服务的 Linux 系统的 IP 地址或 DNS 名称。\n\n在用 `netdate`\
  \ 同步系统时间后，你可能希望使用 `hwclock --systohc` 命令将系统时间与硬件时钟同步。\n\n定期保持时间同步的更好方法是使用网络时间协议\
  \ (NTP)。\n\nNTP 管理时间的方式比 `netdate` 清洁得多。\n\n如果时间提供者和时间消费者（你的本地系统）之间存在时间差，NTP 会以微小的增量逐渐调整时间，直到最终实现同步。\n\
  \nNTP 被大多数操作系统广泛支持。\n\n运行 `ntpd` 的系统可以同时作为时间消费者和时间提供者。\n\nNTP 协议运行在 IP 端口 123 上。时间消费者向端口\
  \ 123 上的时间提供者发送时间同步请求。\n\n时间提供者将其时间发送给消费者，消费者的系统时间将根据 NTP 算法进行调整。\n\n你需要熟悉的关键 NTP\
  \ 核心概念包括：\n\n- 级 (Stratum)\n- 步进与调速 (Stepping and slewing)\n- 异常时间 (Insane time)\n\
  - 漂移 (Drift)\n- 抖动 (Jitter)\n\n你可以用文本编辑器编辑 `/etc/ntp.conf` 文件，以指定从哪个系统获取时间。\n\n\
  `pool.ntp.org` 域名使用 DNS 轮询，从自愿加入池的时间提供者中进行随机选择。\n\n在实际启动 `ntpd` 守护进程之前，你需要在 shell\
  \ 提示符输入 `ntpdate address_of_time_provider` 与你的 NTP 时间提供者进行一次快速同步，以避免异常时间问题。\n\n\
  你可以使用你发行版相应的 init 目录下的 init 脚本启动 `ntpd` 守护进程。\n\n电子邮件消息使用 MUA、MTA、MDA 以及 IMAP 或\
  \ POP3 守护进程进行创建和传输。\n\n常用的 Linux MTA 包括：\n\n- `sendmail`\n- `postfix`\n- `qmail`\n\
  - `Exim`\n\nMTA 无法通过 POP3 或 IMAP 向邮件客户端下载消息。要实现此功能，你必须在系统中安装 `imap` 软件包。\n\n你可以在\
  \ shell 提示符使用 `mail` 命令行工具来读取存储在本地 MTA 中的电子邮件。\n\n要发送消息，你可以在 shell 提示符输入 `mail recipient_address`。\n\
  \n要查看邮件队列中的未读消息列表，你可以在 shell 提示符输入 `mailq`。\n\n你可以为运行在你的 Linux 系统上的 MTA 配置别名 (aliases)。\n\
  \n邮件别名将发送给一个用户的邮件重定向到另一个用户的账户。\n\n你使用 `/etc/aliases` 文件来配置别名。该文件每行定义一个别名。你定义的别名必须指向一个存在的电子邮件地址。\n\
  \n完成别名配置后，你必须以 root 用户身份在 shell 提示符运行 `newaliases` 命令来启用它们。\n\n还可以使用用户家目录下的 `~/.forward`\
  \ 文件配置转发。大多数 Linux MTA 都会检查用户家目录下是否存在该文件，以配置消息转发。你可以用文本编辑器打开/创建该文件，并输入你想要转发邮件的电子邮件地址。\n\
  \nLinux 上通常实现的两种数据库服务是：\n\n- `MySQL`\n- `PostgreSQL`\n\nSQL 定义了可用于检索和更新数据库数据的语句，例如\
  \ `SELECT`、`UPDATE`、`DELETE`、`INSERT` 和 `WHERE`。\n\n关系型数据库使用字段 (fields)、记录 (records)\
  \ 和表 (tables) 来组织。字段是单一信息。记录是完整的字段集，表是记录的集合。每个表由一个名称标识，例如 `Customers`。每个表包含记录（每条记录是一行），记录包含一个或多个字段，这些字段又包含实际的数据库数据。\n\
  \n你可以使用以下命令管理 SQL 数据库中的数据：\n\n- `SELECT`\n- `UPDATE`\n- `DELETE`\n- `INSERT INTO`\n\
  - `CREATE TABLE`\n- `ALTER TABLE`\n- `DROP TABLE`\n\n你可以在 shell 提示符使用 `mysql` 命令连接到\
  \ MySQL 数据库。语法为 `mysql -h host_name -u user_name -p`。\n\n你可以在 `mysql` 客户端可以使用命令：\n\
  \n- `CREATE DATABASE`\n- `USE`\n- `SHOW TABLES`\n- `CREATE TABLE`\n- `DESCRIBE`\n\
  - `SELECT`\n- `FROM`\n- `WHERE`\n- `DELETE`\n- `UPDATE`\n- `JOIN`\n\n## Questions\n\
