  \ **D.** 123 端口用于 NTP 守护。\n\n9.** **C.** 回调 (Slewing) 指时间差小于 128 毫秒。\n\n10.** **A.**\
  \ 异常时间 (Insane time) 指时间差超过 17 分钟。\n\n11.** **C.** MUA 用于创建或读取电子邮件消息。\n\n12.** **A.**\
  \ `postdrop` 接收消息。\n\n13.** **D.** `QMQP` 允许共享。\n\n14.** **D.** `/var/spool/mail`。\n\
  \n15.** **A.** `mail ksanders`。\n\n16.** **C.** `/etc/aliases`。\n\n17.** **B.**\
  \ `SELECT` 检索信息。\n\n18.** **A.** `mysqlshow` 查看数据库。\n\n19.** **A.** `SELECT * FROM\
  \ clients WHERE last=‘Jones’;`。\n\n20.** **D.** `DELETE FROM clients WHERE status=‘Inactive’;`。\n\
  \n# 第 17 章\n\n## Linux 安全性\n\n在本章中，你将学习到：\n\n• 系统加固\n• 控制用户访问\n• 防御网络攻击\n• 管理系统日志\n\
  • 配置 xinetd 和 inetd\n\n在当今世界，安全是几乎每个组织中的一个关键问题。作为 Linux 系统管理员，你必须非常关注影响你实施方案的安全问题。在本章中，我将花时间讨论如何增加你的\
  \ Linux 系统和网络的安全性。\n\n### **系统加固**\n\nLinux 安全最重要但也是最经常被忽视的方面之一是确保系统本身的安全。我将在这里讨论以下主题：\n\
  \n• 物理环境的安全\n• 操作系统访问安全\n\n\n\n\n\n让我们从讨论如何保护物理环境开始。\n\n## 保护物理环境\n\n作为一名顾问，我与各种不同的客户合作。在任何给定的一周内，我可能会访问三四个不同的机构，帮助他们解决网络问题，或帮助他们开发计算产品的培训材料（例如本书）。在这种身份下，我有机会观察到广泛的系统实现。我反复看到的最常见的错误之一，就是未能对该机构计算机系统的物理访问进行妥当的安全保护。\n\
  \n我合作的大多数大型机构都非常有安全意识，并对其系统访问采取了妥当的保护。然而，我合作的许多小型机构并没有这样做。你会惊讶地发现，有多少机构将包含敏感或任务关键数据的计算机系统放置在易于访问的区域。\n\
  \n例如，我几年前服务过的一位客户将服务器放在办公室后方一个空闲的隔间里，认为那里“互不干扰”。但那个隔间没有门。任何可以进入办公室的人都可以直接拿起服务器并带着它走出门。因为服务器被存放在偏僻的地方，机构内没有人会看到作案者带着服务器离开。世界上任何一个防火墙都无法保护你免受这种威胁。\n\
  \n作为 Linux 管理员，你可以做的重要事情之一就是限制谁可以访问你的系统。访问级别取决于涉及系统的类型。请记住以下几点：\n\n![images](img/bull.jpg)\
  \ **服务器** 服务器应该具有最高程度的物理安全性。普通公众（我的意思是没有任何人）不应该拥有你机构服务器的物理访问权限。事实上，只有机构内极少数的员工应该访问你的服务器。服务器不应存放在空闲的隔间里或网络管理员的桌子上。相反，它们应该被存放在锁锁的服务器房内，只有系统管理员和极少数其他人有权进入。\n\
  \n你应该评估自己的状况，看看某人想要访问你的服务器有多困难。我听过一些案例，入侵者伪装成复印机技术人员、水工、电工，甚至自动贩卖机维修人员来进入机构。一旦进入内部，他们就可以在地方里自由穿行，并能够带走关键的计算设备。由于他们看起来很正式，没有人质疑他们在做什么。\n\
  \n核心思想是，入侵者必须击败好几层安全防护才能获取服务器系统。至少，某人必须通过受保护的前门，经过接待员或安保人员，并通过一扇锁着的门才能到达你的服务器。我合作的大多数大型机构使用感应锁，需要\
  \ ID 卡才能进入服务器房，将访问限制在机构内的特定人员身上。\n\n最近我走进一家小商店，后方（空闲的）服务器房的门大开着。更糟糕，服务器房的门就在后门应急出口旁边。如果我想这么做，我可以抓起服务器从应急出口跑出去，而商店里的任何人甚至还不知道发生了什么。\n\
  \n![images](img/bull.jpg) **工作站** 保护工作站的访问要困难得多。关键问题是现代工作环境中隔间的广泛使用。如果你曾在一片隔间的“海洋”中工作过，你可能已经猜出问题所在了。是的，你说得对。隔间里没有门。任何进入办公室的人都可以访问每个人的计算机系统。和服务器一样，这允许入侵者通过伪装身份进入办公室，并带走工作站系统。如果操作得当，他们走出口大门时甚至不会受到挑战。你能做的最好的办法就是保护办公室本身的访问。再次，感应锁和\
  \ ID 卡在这种情况下效果良好。只有持有授权卡的人才能获得进入工作区域的物理权限。\n\n***\n\n![Images](img/note.jpg)\n\n\
  **注意** 有一些酷的生物识别系统，可以通过扫描视网膜、指纹甚至你的声音来控制房间的访问。\n\n除了控制办公室访问外，你还可以通过保护操作系统的访问来进一步保护机构的工作站和服务器。\n\
  \n## 保护操作系统的访问\n\n在你物理上保护了计算机系统的访问后，你的下一道防线是 Linux 操作系统内置的访问控制。当然，Linux 使用用户账户和密码来控制谁可以对系统做什么。这是一件非常好事。事实上，我们将在本章稍后部分讨论密码的管理。\n\
  \n然而，大多数机构中每天都会发生一个关键问题。在一天中，用户不断地离开他们的隔间或办公室。在这一天的任何时候，发现一个或多个工作站处于登录状态且无人看是非常常见的。用户会参加会议、休息、吃午饭和上厕所。在这些时间内，系统中的数据是非常脆弱的。设进入办公室的入侵者（记得前面提到的复印机技术人员和贩卖机维修人员）现在可以访问该用户账户在系统和网络上拥有的一切。这个机会窗口可能只持续几分钟或几小时。将大量关键敏感数据拷贝到闪存盘并不需要长时间！更糟糕的是，入侵者可以在系统上加载任何一个会损害安全的程序，例如键盘记录软件或病毒。\n\
  \n那么你可以做什么来保护你的系统呢？首先，你可以实施屏幕保护程序密码。这将要求入侵者提供密码才能访问系统控制台。这有帮助，但它仍然让系统在一段时间内处于脆弱状态，取决于屏幕保护程序的空闲超时时间设置得多久。\n\
  \n更好的办法是你应该训练你的用户在离开即使是很短的时间之前，先注销或锁定他们的工作站。大多数 Linux 图形桌面环境都提供了锁定操作系统的选项。例如，在 `KDE`\
  \ 中，你可以选择 `K Menu | Lock Session` 来锁定系统。你必须重新验证身份才能再次使用系统。这在图 17-1 所示。\n\n![Images](img/f0646-01.jpg)\n\
  \n**图 17-1** 锁定桌面\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 你永远不要让服务器保持登录状态。我看到系统管理员经常这样做！如果你没有使用服务器控制台，请注销！\n\
  \n如果你使用的是文本环境，用户在离开桌子时应该注销，并在返回时重新登录。许多用户（特别是软件开发人员）喜欢在 Linux 系统处理大任务（如编译程序、下载数据库更新等）时休息一下。如果用户在这些进程运行时从\
  \ shell 提示符注销，这些进程将自动停止。为了允许用户注销并离开而不杀死重要的进程，你可以使用 `nohup` 命令初始地加载它。任何通过 `nohup`\
  \ 加载的进程都会忽略它收到的任何挂断信号（SUP），例如从 shell 提示符注销时发送的信号。使用 `nohup` 的语法是 `nohup command\
  \ &`。例如，在图 17-2 中，`find –name named &` 命令已使用 `nohup` 加载，允许它即使 shell 已注销也能运行。\n\n\
  ![Images](img/f0646-02.jpg)\n\n**图 17-2** 使用 nohup\n\n\n\n\n我的经验是，这个问题源于终端用户的培训。作为系统管理员，你对单个工作站所能做的保护是有限的。如果终端用户不配合，效果将不明显。要教育你的用户危险性，并教他们如何缓解这些危险。\n\
  \n沿着这条思路，你还需要配置用户访问控制来保护你的 Linux 系统。让我们接下来讨论如何实现。\n\n## 控制用户访问\n\nLinux 工作站和 Linux\
  \ 服务器安全的一个关键方面是实施并使用用户访问控制，以限制用户对系统的操作。在本书的前面，我们讨论了如何通过创建和管理用户、组和权限来实现这一点。然而，你可以采取额外的措施来增加系统的安全性。在本章的这部分，我们将回顾以下：\n\
  \n![images](img/bull.jpg) 使用 root 还是不使用？\n![images](img/bull.jpg) 实施强密码策略\n![images](img/bull.jpg)\
  \ 配置用户限制\n![images](img/bull.jpg) 禁用用户登录\n![images](img/bull.jpg) 审计文件\n\n让我们从讨论如何妥善\
  \ care 护 root 用户账户开始。\n\n### 使用 root 还是不使用？\n\n正如我们在书中之前讨论过的，每个 Linux 系统（无论是工作站还是服务器）都包含一个名为\
  \ `root` 的默认超级用户账户。该账户对系统的每个方面都拥有完全访问。因此，应该非常谨慎地使用。在本章的这部分，我们将讨论以下：\n\n![images](img/bull.jpg)\
  \ 妥善使用 root 用户账户\n![images](img/bull.jpg) 使用 su\n![images](img/bull.jpg) 使用 sudo\n\
  \n让我们从讨论如何正确使用 root 用户账户开始。\n\n### 妥善使用 root 用户账户\n\n新 Linux 用户所犯的一个关键错误之一是过度使用\
  \ root 用户账户。root 用户账户有其特定的时和场合。然而，你在 Linux 系统上的大部分工作都应该由非 root 用户账户完成。你应该遵循的经验法是：只有在绝对必要时才使用\
  \ `root`。如果一个任务可以通过非 root 用户完成，那么就应该那样做。\n\n为什么妥善使用 root 用户账户值得关注？几页前之前，我们讨论了让登录的系统处于无人看管状态的风险。想象一下，如果入侵者恰好遇到一个以\
  \ `root!` 身份登录且无人看管的系统，会造成怎样的破坏。系统上的所有数据都可以被访问和复制。系统上运行的守护进程（daemons）可能会被重大的配置更改。天知道会安装什么样的恶意软件。\n\
  \n简而言之，以 `root` 登录的系统代表着严重的安全风险。让这样一个系统无人看管代表着关键的安全风险。包括系统管理员（也就是你！）在内的每个人，都应该有一个自己始终用于登录系统的标准用户账户。\n\
  \n如果你发现在自己在操作系统时需要 root 级权限，可以使用 `su` 命令临时获得系统的 root 级权限。让我们接下来讨论如何实现。\n\n### 使用\
  \ su\n\n到目前，你应该已经知道 `su` 是如何工作的。我们在本书的练习中用过无数次它。该命令允许你在 shell 提示符切换到不同的用户账户。使用 `su`\
  \ 的语法为 `su options user_account`。如果命令中没有指定用户账户，`su` 会假设你想切换到 root 用户账户。你可以配合 `su`\
  \ 使用的一些更有用的选项包括：\n\n![images](img/bull.jpg) – – 加载用户的环境变量。注意，我们一直使用 `su –` 命令来切换到\
  \ root 用户账户。这会切换到 root 并加载 root 的环境变量。\n![images](img/bull.jpg) – -c 命令切换到用户账户并运行指定的命令。\n\
  ![images](img/bull.jpg) – -m 切换到用户账户但保留现有的环境变量。\n\n`su` 命令将是你作为 Linux 管理员的最好朋友。然而，有时其他用户可能需要\
  \ root 级权限。你可以使用 `sudo` 给他们有限的 root 权限。让我们讨论一下 `sudo` 是如何工作的。\n\n### 使用 sudo\n\n\
  假设你的 Linux 系统上有一个高级用户。该用户可能是一个程序员、项目经理或数据库管理员。这类类的用户可能经常需要运行某些 root 级命令。但你真的想给他们你的\
  \ root 密码吗？可能不想。你希望他们能够运行有限数量需要 root 权限的命令，但你不希望他们拥有完全 root 权限。这可以通过 `sudo` 实现。\n\
  \n`sudo` 命令允许指定用户以不同的用户账户运行命令。与 `su` 一样，可以是系统上的任何用户账户；但它最经常被用于以 `root` 身份运行命令。`sudo`\
  \ 命令使用 `/etc/sudoers` 文件来确定哪个用户授权运行哪些命令。该文件使用以下别名来定义谁可以做什么：\n\n![images](img/bull.jpg)\
  \ User_Alias 指定允许运行命令的用户\n![images](img/bull.jpg) Cmnd_Alias 指定用户允许运行的命令\n![images](img/bull.jpg)\
  \ Host_Alias 指定用户允许运行命令的主机\n![images](img/bull.jpg) Runas_Alias 指定命令可能以什么身份运行的用户名\n\
  \n要编辑你的 `/etc/sudoers` 文件，你需要以 root 用户身份运行 `visudo` 命令。`/etc/sudoers` 文件会在你的默认编辑器中加载。在提交之前，你的更改会写入\
  \ `/etc/sudoers.tmp`。这在图 17-3 中所示。\n\n![images](img/bull.jpg)\n\n**图 17-3** 使用 visudo\
  \ 编辑 /etc/sudoers\n\n在大多数发行版中，sudoers 文件的默认配置是使用 `sudo` 时必须提供 root 密码。显然，这种配置没有任何作用。如果用户已经知道了\
  \ root 密码，配置 `sudo` 的意义何在？这种配置由 sudoers 文件中的以下行指定：\n\n![images](img/bull.jpg)\n\n\
  要修复这个问题，请注释掉 sudoers 文件中此处指定的这几行。然后你就可以开始配置 sudoers。首先，你需要使用 `User_Alias` 定义一个包含你想允许运行命令的用户账户（用逗号分隔）的别名。语法是\n\
  \n`User_Alias alias = users`\n\n例如，为了创建一个名为 `PWRUSRS` 的别名，包含 `tux`、`rtracy` 和 `ksanders`\
  \ 用户账户，你需要在 `/etc/sudoers` 文件输入：\n\n`User_Alias PWRUSRS = tux, rtracy, ksanders`\n\
  \n***\n\n![images](img/jpg)\n\n**提示** 所有别名必须以大写字母开头！\n\n接下来你需要使用 `Cmnd_Alias` 定义一个包含你定义的用户能够运行的命令（使用完整路径）的别名。用逗号分隔多个命令。例如，如果你的用户是需要杀死进程的程序员，你可以定义一个名为\
  \ `KILLPROCS` 的别名，包含你的 `kill` 命令，如下：\n\n`Cmnd_Alias KILLPROCS = /bin/kill, /usr/bin/killall`\n\
  \n然后你需要使用 `Host_Alias` 指定用户可以在哪些系统上运行命令。例如，为了在名为 `WS1` 的系统上运行命令，你会使用：\n\n`Host_Alias\
  \ MYHSTS = openSUSE`\n\n最后，你需要将这些别名连接起来，以定义具体会发生什么。语法是\n\n`User_Alias Host_Alias\
  \ = (user) Cmnd_Alias`\n\n使用刚刚定义的别名，你可以通过输入以下内容允许指定的用户在指定的主机上以 root 身份运行指定的命令：\n\
  \n`PWRUSRS MYHSTS = (root) KILLPROCS`\n\n\n\n要退出编辑器，请按 ESC 键然后输入 `:exit`。`visudo`\
  \ 实用将检查您的语法，并在您输入任何错误时通知您。此时，您定义的用户可以通过 shell 提示符处输入 `sudo *command` 来以 root 身份执行您指定的命令。例如，`rtracy`\
  \ 用户可以通过 shell 提示符处输入 `sudo killall vmware-toolbox` 来杀死名为 `vmware-toolbox`（由 root\
  \ 所有）的进程。在 `rtracy` 用户提供密码后，该进程将会被杀死。\n\n除了妥善使用 root 用户账户外，你还应该实施强密码策略。接下来让我们讨论如何实现这一点。\n\
  \n## 实施强密码策略\n\n多年来我观察到的另一个严重的安全漏洞是使用弱密码。弱密码是指那些容易被猜到或破解的密码。以下是一些例子：\n\n![images](img/bull.jpg)\
  \ 你的姓氏\n![images](img/bull.jpg) 你配偶的名字\n![images](img/bull.jpg) 你母亲的娘氏\n![images](img/bull.jpg)\
  \ 你的孩子的名字\n![images](img/bull.jpg) 你的生日\n![images](img/bull.jpg) 你的宠物的名字\n![images](img/bull.jpg)\
  \ 字典中可以找到任何单词\n![images](img/bull.jpg) 使用“password”作为你的密码\n![images](img/bull.jpg)\
  \ 单字符密码\n![images](img/bull.jpg) 空密码\n\n你可能会对用户使用这类密码的频率之高感到惊讶。真不妙！你需要训练你的用户使用更强的密码。强密码应包含：\n\
  \n![images](img/bull.jpg) 六个或更多字符（越长越好！）\n![images](img/bull.jpg) 数字和字母的组合\n![images](img/bull.jpg)\
  \ 大写和小写字母\n![images](img/bull.jpg) 字典中不存在的单词\n![images](img/bull.jpg) （可选）非字母数字字符，如标点符号\n\
  \n例如，像 `M3n0v3l273` 这样的密码就是相对强密码，因为它符合了前面的标准。大多数 Linux 发行版带有的密码管理工具默认配置为检查你的用户密码，以确保它们符合强密码的标准。例如，如果你尝试使用\
  \ `passwd` 命令使用弱密码，系统会提示你使用更强的密码，如下所示：\n\n![Images](img/p0651-01.jpg)\n\n除了使用强密码外，你还应该配置用户账户，使密码在一段时间后过期。这被称为\
  \ `password aging*`。为什么要限制密码有效期？用户使用同一个密码的时间越长，被破解的可能性就越大。通过强制用户定期更换密码，你可以让入侵者无从猜起。即使他们成功获取了用户的密码，它在某个时间点也会变得无效。给定密码允许持续的时间因组织而异。更有安全意识的组织可能会强制密码有效期为\
  \ 30 天或更短。没那么敏感的组织可能会使用 60 天甚至 90 天的。\n\n你可以使用 `chage` 命令来配置密码有效期。使用 `chage` 的语法为\
  \ `chage *option user*`。你在 `chage` 中使用以下选项：\n\n![images](img/bull.jpg) `–m *days*`\
  \ 指定两次密码更改之间的最小天数\n![images](img/bull.jpg) `–M *days*` 指定两次密码更改之间的最大天数\n![images](img/bull.jpg)\
  \ `–W *days*` 指定需要更改密码前的警告天数\n\n例如，在图 17-4 中，`chage` 命令被用于为 `ksanders` 用户指定最小密码有效期五天、最大密码有效期\
  \ 90 天以及七天的警告期。\n\n![Images](img/f0652-01.jpg)\n\n**图 17-4** 使用 `chage` 设置密码有效期\n\
  \n此外，你的 Linux 系统不应配置为在 `/etc/passwd` 文件中存储密码。Linux 系统中运行的许多进程都需要访问 `/etc/passwd`\
  \ 来完成各种任务。将密码存储在该文件中会让它们暴露给这些进程，并留下严重的安全漏洞。大多数系统实现者都意识到将密码存储在 `/etc/passwd` 中是一个非常糟糕的主意，因此你可能不会再遇到很多这样配置的系统了。然而，如果你遇到了这样的系统，可以使用\
  \ `pwconv` 命令将用户密码从 `/etc/passwd` 移动到 `/etc/shadow`。\n\n你还应该训练你的用户在处理密码时要有常识。我经常看到的一种安全违规事件是用户将密码写在便利贴上并贴在办公桌的任何地方。我甚至见过系统密码被直接写在显示器或键盘上的便利贴上。我知道把密码写下来并公然张出的想法让你感到不适，但我一遍又一遍地看到这种情况。有些用户试图将便利贴藏在键盘下或抽屉里，但这仍然是一个严重的安全问题。入侵者只需要在用户登录时观察她，并记住她把密码藏在哪里了，这让他的工作变得轻而易举。最近我孩子就读的中学发生过恰恰的事情。考勤秘书一直把密码写在键盘旁边的便利贴上。一个学生注意到了这一点，并在某天放学后，登录了她的电脑，并使用学校的考勤跟踪软件向全校所有学生的家长发送了自动恶作剧电话。这种“利用手段”并无伤大雅，但它让你意识到，如果用户把密码写下来并公然陈出，击败最复杂的安全系统是多么容易。\n\
  \n“便利贴现象”是强制执行物理安全的另一个原因。一个坏之徒可以利用公然展示的密码轻松获取公司信息。一旦得手，将很难将漏洞追溯到入侵者身上。\n\n最后，你应该训练你的用户如何应对社交工程尝试。这实际上是入侵者工具箱中最简单、最有效的工具之一。社交工程利用的是人的弱点而非系统的技术漏洞。以下是典型的社交工程利用是如何工作的：\n\
  \n入侵者冒充另一个员工给组织的员工打电话。入侵者告诉员工他是销售部的“Fred”，正在客户现场。他需要从服务器获取一个非常重要的文件，但他忘记了密码。于是他询问员工是否可以“用一次”他们的密码来获取所需的文件。\n\
  \n大多数员工都想成为团队合作者并在紧急情况下提供帮助。他们太乐意提供密码了，从而让入侵者轻松访问系统。有些社交工程尝试并不那么直接。入侵者不是打电话要密码，而是翻找公司的垃圾，寻找写有用户密码的小黄色便利贴。有些社交工程尝试更加“直截了当”。入侵者翻垃圾找到公司某位高层人员的名字，然后冒装成该人员给员工打电话，要求泄露密码，威胁如果不从就开雇他们。非常狡猾，对吧？\n\
  \n\n\n\n钓鱼邮件是一种低技术含量但非常流行的攻击手段，因为它们极其成功。近年来，这类攻击已导致几家大型公司发生了灾难性的安全泄露。他们想要成功，只需要几个愚蠢到会打开信息并按照其中的指令操作的员工即可。\n\
  \n要检测钓鱼邮件，你需要学会识别几个关键特征。它们看起来可能是真实的，但有几个关键属性可以识别出它们是骗局。例如，消息的源地址与其声称所属的公司域名不匹配是常见现象。此外，消息通常会试图营造一种紧急感。例如，它可能会警告你的银行账户将被冻结、信用卡被盗，甚至警告如果不按照消息中的指令操作将面临逮捕。关键的破绽在于，消息中的超链接指向的网站与信息声称所属的组织没有关联。如果你将鼠标悬停在链接上（`without`\
  \ 点击），就可以看到链接实际去向。如果它没有指向该组织的 URL，那么这条消息很有可能是一个攻击手段。\n\n对抗社会工程学的最好方法仍然是：培训你的用户。教他们不要写下密码。教他们不要将敏感数据扔在垃圾桶里——要将其粉碎！教他们关于社会工程学电话以及如何处理这些电话。大多数组织只需告诉员工将任何询问密码的电话转发给帮助热台（也就是你）。很可能，他们听到的只有对方传来的鼠标点击声。教他们如何识别钓鱼邮件以及如何恰当地响应。\n\
  \n除了配置密码有效期外，你还可以通过限制登录和资源来增加 Linux 系统的安全性。让我们接下来回顾一下如何操作。\n\n## 配置用户限制\n\n你可以对\
  \ Linux 系统上的用户登录次数、可以消耗的 CPU 时间以及可以使用的内存量进行限制。这可以通过两种方式实现：\n\n![images](img/bull.jpg)\
  \ 使用 `pam_limits` 限制资源访问\n\n![images](img/bull.jpg) 使用 `ulimit` 限制资源访问\n\n## 使用\
  \ pam_limits 限制资源访问\n\n你可以使用一个名为 `pam_limits` 的可插认证模块（PAM）模块来限制用户对 Linux 系统资源的访问，该模块通过\
  \ `/etc/security/limits.conf` 文件进行配置。该文件包含了你可以使用以下语法配置的资源限制：\n\n`domain   type \
  \  item   value`\n\n该语法的描述在此处：\n\n![images](img/bull.jpg) `domain`  描述应用限制的实体。你可以使用以下值之一：\n\
  \n![images](img/bull.jpg) `user`   识别特定的 Linux 用户\n\n![images](img/bull.jpg) `@group_name`\
  \  识别特定的 Linux 组\n\n![images](img/bull.jpg) `*`    指定所有用户\n\n![images](img/bull.jpg)\
  \ `type`   定义 `hard`（硬限制）或 `soft`（软限制）。硬限制不能被超过。软限制可以被临时超过。\n\n![images](img/bull.jpg)\
  \ `item`   指定被限制的资源。你可以使用表 17-1 中所示的值。\n\n![images](img/bull.jpg) `value`   指定限制的值。\n\
  \n![Images](img/t0654-01.jpg)\n\n**表 17-1**   配置资源限制\n\n例如，要为 `rtracy` 用户配置 15 分钟的软\
  \ CPU 限制，你需要用文本编辑器打开 `/etc/security/limits.conf` 文件，然后输入内容：\n\n`rtracy   soft  \
  \ cpu   15`\n\n如果用户正在运行一个 CPU 密集型程序并抢占其他用户的周期，那么这个限制可能很有用。同样，你也可以通过在文件中输入以下内容将 `rtracy`\
  \ 用户限制为最多两次并发登录：\n\n`rtracy   hard   maxlogins   2`\n\n这将防止在两次初始登录成功后任何以 `rtracy`\
  \ 用户身份登录系统。\n\n除了使用 `pam_limits` 之外，你还可以使用 `ulimit` 命令限制用户对系统资源的访问。让我们接下来看看如何操作。\n\
  \n### 使用 ulimit 限制资源访问\n\n你也可以使用 `ulimit` 命令来配置系统资源的限制。但请注意，你用 `ulimit` 配置的限制仅适用于从\
  \ shell 提示符启动的程序。使用 `ulimit` 的语法为 `ulimit options limit`。你可以配合 `ulimit` 使用以下选项：\n\
  \n![images](img/bull.jpg) `-c`   设置核心文件最大大小限制（以块计）。如果你将此限制设置为 `0`，则禁用系统的核心转储（core\
  \ dumps）。\n\n![images](img/bull.jpg) `-f`   设置 shell 创建的文件最大限制（以块计）。\n\n![images](img/bull.jpg)\
  \ `-n`   设置打开文件描述符的最大数量限制。\n\n![images](img/bull.jpg) `-t`   设置进程可以使用的 CPU 时间最大量限制（以秒计）。\n\
  \n![images](img/bull.jpg) `-u`   设置单个用户可用进程的最大数量限制。\n\n![images](img/bull.jpg) `-d`\
  \   设置进程在 RAM 中数据段的最大 own 限制（以 KB）。\n\n![images](img/bull.jpg) `-m`   设置进程在 RAM\
  \ 中驻留内存的最大限制（KB）。\n\n![images](img/bull.jpg) `-s`   设置栈大小的限制。\n\n![images](img/bull.jpg)\
  \ `-H`   设置硬限制。\n\n![images](img/bull.jpg) `-S`   设置软限制。\n\n你可以使用 `ulimit` 命令的 `-a`\
  \ 选项查看所有资源限制值。这在图 17-5 所示。\n\n![Images](img/f0655-01.jpg)\n\n**图 17-5**   通过 ulimit\
  \ 查看资源限制\n\n你还可以使用 `ulimit` 设置限制。例如，为了设置 50 个进程的软限制，你将在 shell 提示符输入 `ulimit -S 50`。这样当前用户最多可以拥有\
  \ 50 个并发 shell。\n\n## 禁用用户登录\n\n有时，你可能需要完全禁用所有登录。例如，你有一个需要解决的问题，需要将所有人排除在外。为此，你首先需要登出所有用户。你可以使用\
  \ `w` 命令查看当前登录的用户列表。例如，在图 17-6 中，当前有两个用户登录：`ksanders` 和 `rtracy`。\n\n![Images](img/f0656-01.jpg)\n\
  \n**图 17-6**   生成登录用户列表\n\n现在知道谁登录了，你可以使用 `pkill -KILL -u user_name` 命令强制登出用户。例如，在图\
  \ 17-7 中，已使用 `pkill` 命令登出了 `ksanders` 用户。\n\n![Images](img/f0656-02.jpg)\n\n**图\
  \ 17-7**   强制用户登出\n\n此时你可以禁用所有未来的登录。这实际上非常简单。你所做的就是在 `/etc` 中创建一个名为 `nologin` 的文件。只要该文件存在，除了\
  \ root 之外无人登录。此外，如果用户确实尝试登录，你在 nologin 文件中输入的任何文本都将显示出来。在图 17-8 所示的示例中，`/etc/nologin`\
  \ 文件中输入了系统当前无法登录。”因此，当用户尝试登录时，将显示这条错误消息。\n\n![Images](img/f0657-01.jpg)\n\n**图 17-8**\
  \   来自 /etc/nologin 的登录拒绝消息\n\n这种行为实际上配置在 `/etc/pam.d/login` 文件中，如下所示：\n\n![Images](img/p0657-01.jpg)\n\
  \n\n\n\n\n读取 `auth requisite pam_nologin.so` 的行会使 PAM 检查 `/etc` 中是否存在名为 `nologin`\
  \ 的文件。如果存在，PAM 将不允许普通用户登录。操作完成后，你可以通过删除或重命名 `nologin` 文件来重新启用登录。例如，你可以在 shell 提示符处输入\
  \ `mv /etc/nologin /etc/nologin.bak` 来对其重命名。\n\n接下来让我们讨论如何审计文件，以定位设置了 SUID 或 SGID\
  \ 权限的文件。\n\n### 审计文件\n\n除了禁用用户登录，你需要熟悉的另一个用户安全相关问题是审计设置了 SUID root 权限的文件。正如你在第 11\
  \ 章中所学习到的，SUID 代表 *Set User ID*（设置用户 ID）。当运行一个设置了 SUID 权限的可执行文件时，该进程将获得以可执行文件所有者身份访问系统的权限，而不是取决于实际运行命令的用户。如果该文件由\
  \ root 拥有，这是一个严重的问题。当 root 用户拥有设置了 SUID 权限的文件时，它允许由该文件创建的进程以 root 身份执行操作，而启动它的用户可能不允许执行这些操作。同样的问题也适用于\
  \ root 组拥有且设置了 SGID 权限的文件。\n\n请注意，Linux 系统上少数由 root 拥的文件确实需要设置这些权限。然而，由 root/root\
  \ 拥有且设置了 SUID/SGID 权限的文件代表了系统上的安全漏洞。许多攻击都是利用具有此类权限的文件实现的。设置了 SUID 权限的文件在 shell 提示符处使用\
  \ `ls` 命令列出时显示如下：\n\n`-rwSr-xr-x`\n\n设置了 SGID 权限的文件在 shell 提示符处使用 `ls` 命令列出时显示如下：\n\
  \n`-rw-r-Sr-x`\n\n因此，你应该考虑定期运行审计，识别任何由 root 拥有且设置了其中一种权限的文件。除了最小必要的文件之外，任何文件都应该经过仔细审查，以确保它们不是某些类型攻击的一部分。你可以在\
  \ root 用户身份下以下命令在 Linux 系统中搜索设置了 SUID 权限的文件：\n\n```\nfind / -type f -perm -u=s -ls\n\
  ```\n\n这里是一个示例：\n\n![Images](img/p0658-02.jpg)\n\n`-perm` 告诉 `find` 匹配分配了指定权限的文件；在这种情况下，S\
  \ 权限被分配给了用户。你也可以使用以下命令识别任何设置了 SGID 权限的文件：\n\n```bash\nfind / -type f -perm -g=s\
  \ -ls\n```\n\n当你执行该命令时，将显示所有具有 SGID 权限的文件列表。这里是一个示例：\n\n![Images](img/p0658-04.jpg)\n\
  \n让我们在下面的练习练习控制用户对 Linux 系统的访问。\n\n### 练习 17-1：管理用户访问\n\n在本次练习中，你将练习为用户密码设置年龄限制。你还将配置\
  \ `sudo` 以允许标准用户以 root 用户的身份杀死系统上的进程。你可以使用书中附带的虚拟机进行此练习。运行快照 17-1 以获得配置正确的环境。\n\n\
  ***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 17-1 视频，查看如何执行此任务的演示。\n\n完成以下操作：\n\
  \n1. 启动你的 Linux 系统，并使用密码 `student` 以 `student` 用户身份登录。\n2. 打开终端会话。\n3. 输入 `su –`\
  \ 并跟上密码 `student` 切换到你的 root 用户账户。\n4. 通过完成以下操作练习配置年龄限制：\n   a. 使用 `cat` 或 `less`\
  \ 工具查看 `/etc/passwd` 文件。识别系统上一个你想为其配置密码年龄限制的用户。\n   b. 在 shell 提示符处输入 `chage –m\
  \ 3 –M 60 –W 7 *username`，将最小密码年龄设置为三天，最大密码年龄设置为 60 天，过期前的警告天数设置为七 天。\n5. 通过以下操作配置\
  \ `sudo`，以允许系统上的用户以 root 用户的身份杀死进程：\n   a. 使用 `visudo`。\n   b. 使用 `/etc/passwd`\
  \ 文件。\n   c. 使用 `sudo`。\n   d. 使用 `#`。\n   e. ![Images](img/p659-1)\n   f. 使用 `exit`。\n\
  \   g. 使用 `top`。\n   h. 使用 `sudo`。\n   i. 使用 `killall`。\n   j. 使用 `password`。\n\
  \   k. 使用 `ps -elf grep top`。\n   l. 使用 `top`。\n\n### 防御网络攻击\n\n现在你已经加固了用户，让我们让我们讨论如何防御网络攻击。\n\
  \n### 防御网络攻击\n\n如果我们能生活在一个可以相互连接并信任他人的世界，那就太好了。遗憾的是，这样的世界并不存在。如果你的 Linux 系统连接到网络，你就需要担心网络攻击。与书中讨论的大多数主题一样，网络安全是一个巨大的课题，可以写满好几书。我们真的没有时间或空间来充分探讨这个主题。相反，我将讨论一些你可以用来防御网络攻击的基本方法。我将讨论以下：\n\
  \n* 缓解网络漏洞\n* 使用 iptables 实现防火墙\n\n让我们从讨论一些你可以用来缓解网络漏洞的事情开始。\n\n### 缓解网络漏洞\n\n好消息是，你可以做一些简单的事情来缓解网络攻击对你系统的威胁。这些包括：\n\
  \n* 关注当前威胁\n* 卸载不需要的服务\n* 安装更新\n\n让我们先讨论关注当前威胁。\n\n### 关注当前威胁\n\n网络安全威胁最大的问题之一是，我们总是比那些黑帽客落后一步。我们刚刚实施了保护系统免受最新漏洞攻击的修复，他们就会用新的漏洞攻击我们。因此，跟上最新的网络威胁至关重要。保持系统安全的唯一方法就是了解当前的威胁是什么。\n\
  \n做到此点的最佳方法是定期访问与安全相关的网站。这些网站会告知最新的漏洞以及如何防御它们。最值得的网站之一是 [www.cert.org](https://www.cert.org)，它由卡内基梅隆大学软件工程学院的计算机应急响应小组（CERT）维护。CERT\
  \ 网站包含了指向最新安全公告的链接。\n\n另一个优秀的资源是 [www.us-cert.gov](https://www.us-cert.gov)。该网站由美国政府的计算机应急就绪小组（US-CERT）维护，US-CERT\
  \ 网站提供了关于当前网络攻击的大量信息。\n\n\n\n\n当然，还有成百上千与其他安全相关的网站。然而，我在这里列出的是全球最权威的网站之一。大多数其他安全相关网站的内容都源自这些网站。如果你坚持定期访问这些网站，就能跟上安全世界的动态，并希望借此防止你的系统受到攻击。\n\
  \n除了关注这些网站的最新动态外，你还应该检查你的系统，查看它们提供的所有服务是否真的必要。接下来让我们讨论如何做到这一点。\n\n## 卸载不需要的服务\n\n\
  缓解网络攻击威胁，你可以做最简单的一件事之一就是直接卸载系统上运行但不需要的网络服务。根据你使用的发行版和安装方式，你的系统上可能运行着许多你并不知道的存在且你并不的服务。你可以通过在\
  \ shell 提示符中输入 `chkconfig` 来查看已安装服务的列表以及它们是否正在运行。该命令将列出每个服务及其状态，如图 17-9 所示。\n\n\
  ![Images](img/f0661-01.jpg)\n\n**图 17-9**  查看已安装的服务\n\n![Images](img/note.jpg)\n\
  \n**注意** `chkconfig` 工具并不是在所有发行版上都可用。它最初是一个 Red Hat 工具，已移植到许多其他发行版，例如 SUSE Linux。然而，如果你使用的是\
  \ Debian，你可能会发现它并不可用。\n\n不过，作为一个警告，除非你知道某个服务的实际作用，否则不要禁用它。某些守护进程是系统正常运行所必需。如果你不知道某个特定服务，请使用\
  \ `man` 工具、`info` 工具或互联网进行研究，并确定其是否有必要。\n\n除了 `chkconfig` 之外，你还可以使用 `nmap` 命令查看\
  \ Linux 系统上开放的 IP 端口。这些信息非常有用。Linux 系统上开放的每个端口都代表一个潜在的漏洞。某些开放端口是必要的，但其他可能并不必要。你可以通过卸载使用该端口的服务来关闭该端口。\n\
  \n![Images](img/note.jpg)\n\n**注意** 在使用 `nmap` 命令之前，你需要安装 `nmap` 软件包。\n\n使用 `nmap`\
  \ 的语法中，TCP 端口扫描为 `nmap –sT host_IP_address`，UDP 端口扫描为 `nmap –sU host_IP_address`。在图\
  \ 17-10 中，使用 `nmap` 工具扫描开放的 TCP 端口。\n\n![Images](img/f0662-01.jpg)\n\n**图 17-10**\
  \  使用 `nmap` 扫描开放端口\n\n如图所示，被扫描的主机上运行着许多服务。你可以利用此输出来确定哪些服务应该和不应该留在系统中运行。要禁用某个服务，你可以使用\
  \ init 目录中的 init 脚本将其关闭。你还应该使用 `chkconfig` 或 `systemctl` 命令配置服务不自动启动。\n\n![Images](img/tip.jpg)\n\
  \n**提示** 你应该在本地运行 `nmap`，并从不同的系统针对同一主机运行 `nmap`。这将告诉你你的系统开放了哪些端口，以及哪些服务允许通过主机的防火墙。\n\
  \n除了 `nmap` 工具外，你还可以使用 `netstat` 工具扫描开放端口。`netstat` 工具是你的虚拟工具箱中的另一个强大工具。使用 `netstat`\
  \ 的语法是在要扫描的系统的 shell 提示符中输入 `netstat option`。你可以使用表 17-2 中列出的选项。\n\n![Images](img/t0663-01.jpg)\n\
  \n**表 17-2**  netstat 选项\n\n使用 `netstat` 配合 `-l` 选项查看 Linux 主上监听套接列表的示例如图 17-11\
  \ 所示。\n\n![Images](img/f0663-01.jpg)\n\n**图 17-11**  使用 `netstat` 查看监听套接列表\n\n除了卸载不需要的服务外，你还应该安装操作系统更新。接下来让我们讨论如何操作。\n\
  \n## 安装更新\n\n防御网络攻击你可以做的最重要的事情之一就是定期安装操作系统更新。IT 世界中我们必须面对的一个简单事实是：软件编写得并不完美。大多数程序和服务都有缺陷。即使是你的\
  \ Linux 内核也有缺陷。这些缺陷中，有些无关痛痒的，有些只是令人讨厌，而有些则代表了严重的安全风险。\n\n随着软件的发布和使用，这些缺陷会被系统管理员、用户以及（不幸的是）黑客发现。一旦被发现，就会编写并发布修复这些缺陷的更新。对于大多数发行版，你可以配置操作系统自动连接到互联网并定期检查更新的可用性。例如，在\
  \ SUSE Linux 中，你可以使用图 17-12 所示的 `YaST Online Update` 模块来实现。你可以配置系统自动为你安装或提示你安装。你用于更新系统的工具取决于你所使用的\
  \ Linux 发行版。\n\n![Images](img/f0664-01.jpg)\n\n**图 17-12**  更新系统\n\n![Images](img/tip.jpg)\n\
  \n**提示** 保护网络通信你应该做的另一件事是使用 `OpenSSH` 对密在系统间传输的敏感数据。使用 `OpenSSH` 是一个大话题，我们将在下一章详细介绍。\n\
  \n你还应该实施基于主机的防火墙来保护你的 Linux 系统。接下来让我们讨论如何操作。\n\n### 使用 iptables 实现防火墙\n\n今天，大多数组织都将其公司网络连接到互联网。这样做增强了通信并提供了丰富的访问。不幸的是，这也让他们的网络暴露在严重的安全威胁之下。如果用户可以访问互联网，那么来自互联网的未经邀请的人也可以进入网络，除非采取措施防止这种情况的发生。为了做到这一点，组织需要实施网络防火墙以及基于主机的防火墙。\n\
  \n网络防火墙与基于主机的防火墙非常不同*基于主机的防火墙*控制单个系统的进出流量。而*网络防火墙*用于控制一个网段或整个网络的进出流量。\n\n在本章的这部分，我们将花时间学习如何在这两种情况下使用\
  \ Linux。我们将讨论以下主题：\n\n![images](img/bull.jpg) 防火墙的工作原理\n\n![images](img/bull.jpg)\
  \ 实现包过滤防火墙\n\n### 防火墙的工作原理\n\n防火墙到底是什么？*防火墙*是硬件和软件的结合，充当你的网络和其他网络之间的守门员。通常，防火墙安装了两个或多个网络接口。一个连接到内部网络；另一个连接到公共网络，作用类似于路由器。然而，防火墙不是路由器（尽管它可以与路由器结合使用）。\n\
  \n防火墙的工作是监控在网络之间流动的入站和出站流量。你通过规则配置防火墙定义允许的流量类型。任何违反规则的流量都是不允许的，如图 17-13 所示。\n\n\
  ![Images](img/f0665-01.jpg)\n\n**图 17-13**  防火墙的工作原理\n\n防火墙可以通过多种方式实现。最常见的类型之一是*包过滤防火墙*，所有在私有网络和公共网络之间移动的流量必须通过防火墙。在此过程中，防火墙捕所有入站和出站的数据包，并将其与你配置的规则进行比较。\n\
  \n\n\n\n防火墙可以根据源地址、目的地址、源端口、目的端口、使用的协议或数据包类型来过滤流量。如果数据包符合规则，它将被转发到下一个网络。如果不符合，它将被丢弃，如图\
  \ 17-14 所示所示。\n\n![Images](img/f0666-01.jpg)\n\n**图 17-14** 使用包过滤防火墙\n\n包过滤防火墙并不非要实现在你的网络和互联网之间。它们也可以实现在网络分段和骨干网段之间，以增强你内部网络的安全性。\n\
  \n要使用包过滤防火墙，你必须熟悉特定服务默认使用的端口号。IP 端口 0 到 1023 范围由 IANA 组织分配给网络服务，被称为常用端口。你需要熟悉的一些较常见的端口分配如表\
  \ 17-3 所示。\n\n![Images](img/t0667-01.jpg)\n\n**表 17-3** 常见端口分配\n\n包过滤防火墙被广泛使用。它们的成本比其他类型的防火墙低。它们所需的处理资源也较少。数据传输非常快，使得它们比其他防火墙快得多。\n\
  \n* *\n\n![Images](img/tip.jpg)\n\n**提示** 你也可以实现状态检测防火墙以及应用层网关，这两者都运行在 OSI 模型中更高的层级。遗憾的是，我们没有时间或空间在这里介绍它们的工作原理。\n\
  \n在考虑这些背景的情况下，让我们回顾如何在 Linux 上实现包过滤防火墙。\n\n## 实现包过滤防火墙\n\n正如 Linux 可以充当路由器一样，它也可以被配置作为防火墙。事实上，它可以被用于配置一个非常健壮、非常强大的防火墙。目前市场上有许多基于\
  \ Linux 操作系统的防火墙设备。还有许多可下载的 Linux ISO（例如来自 Untangle），你可以将其安装在标准 PC 硬件上并转换为路由器。就本文而言而言，我们将重点关注使用\
  \ `iptables` 创建基础的包过滤防火墙。\n\n在 Linux 系统上设置包过滤防火墙的第一步是设计你的实现方案。在设计防火墙时，你应该回答以下问题：\n\
  \n![images](img/bull.jpg) 你是否会默认允许所有入站流量，并对你不允许的特定类型流量建立规则？\n\n![images](img/bull.jpg)\
  \ 你的防火墙是否会拒绝所有入站流量，除非是你允许的特定类型流量？\n\n![images](img/bull.jpg) 你是否会默认允许所有出站流量，仅阻止特定的类型或目的地？\n\
  \n![images](img/bull.jpg) 你是否会阻止所有出站流量，除非是特定的类型或目的地？\n\n![images](img/bull.jpg)\
  \ 防火墙必须开放哪些端口以允许外部流量通过？例如，你是否要实现一个需要在防火墙后面可公开访问的 Web 服务器？如果是这样，你需要在边界防火墙上开放端口 80，可能还有端口\
  \ 443。\n\n你如何决定配置防火墙取决于你组织的安全策略。然而，我建议你采取谨慎的态度。如果有选择的话，我宁愿处理一个因为防火墙不让他在互联网上分享盗版音乐文件而感到恼的用户，也不愿处理一个已经深陷我网络的重大攻击。\n\
  \n一旦设计好了防火墙，你就可以实现它了。在安装并配置了所需的网卡后，你可以使用 `iptables` 工具在你的 Linux 系统上配置防火墙。许多 Linux\
  \ 发行版包含了 `iptables` 的图形前端，你可以用它们来构建防火墙。这些前端通常没有命令行工具那么灵活，但它们让设置过程变得更快、更简单！\n\nLinux\
  \ 防火墙的核心是 `iptables` 包。大多数发行版都包含了它。如果你的版本没有，可以从 [www.netfilter.org](http://www.netfilter.org)\
  \ 下载。2.4 之前的 Linux 内核版本使用 `ipfwadm` 或 `ipchains` 而不是 `iptables`。如果你访问 [www.tldp.org](http://www.tldp.org)\
  \ 的 Linux 文档项目，你会发现许多防火墙 HOWTO 仍然是为了帮助这些旧软件包而编写的。\n\n* *\n\n![Images](img/note.jpg)\n\
  \n**注意** `iptables` 包将来将被一个名为 `nftables` 的新包取代。\n\nLinux 内核本身在 Linux 上完成包过滤任务。为了使用\
  \ `iptables`，你的内核必须符合 `netfilter` 架构。大多数发行版在安装时默认包含了 netfilter 架构。\n\nnetfilter\
  \ 架构使用“表和链”的概念来创建防火墙规则。`chain`（链）简单来说是你实现的一条规则，用于决定防火墙如何处理入站数据包。netfilter 架构使用 `filter\
  \ table`（过滤表）来创建包过滤规则。filter 表中有三个默认链：\n\n![images](img/bull.jpg) **FORWARD** `FORWARD`\
  \ 链包含了通过 Linux 系统在网络之间传输的数据包规则。\n\n![images](img/bull.jpg) **INPUT** `INPUT` 链包含了发送到本地\
  \ Linux 系统的的数据包规则。\n\n![images](img/bull.jpg) **OUTPUT** `OUTPUT` 链包含了从本地 Linux\
  \ 系统发送的数据包规则。\n\n如果你在使用 `iptables` 工具时没有显式指定表名，它将默认使用 `filter table`。filter 表中的每条链都有四个你可以配置的策略：\n\
  \n![images](img/bull.jpg) `ACCEPT`\n\n![images](img/bull.jpg) `DROP`\n\n![images](img/bull.jpg)\
  \ `QUEUE`\n\n![images](img/bull.jpg) `REJECT`\n\n你可以使用 `iptables` 在链中创建规则。一条链可以包含多个规则。链中的每条规则都被分配一个数字。你添加的第一条规则被分配数字\
  \ 1。`iptables` 工具可以添加规则、删除规则、插入规则和追加规则。使用 `iptables` 的语法是 `iptables -t *table command\
  \ chain options*`。你可以配合 `iptables` 使用以下命令：\n\n![images](img/bull.jpg) **–L** 列出链中的所有规则\n\
  \n![images](img/bull.jpg) **–N** 创建新链\n\n你可以使用之前列出的默认链，也可以创建自己的链。你通过输入 `iptables\
  \ -N *chain_name*` 创建自己的链。你可以简单地使用 `-A` 选项向链中添加规则。你也可以使用这里列出的其他选项：\n\n![images](img/bull.jpg)\
  \ **–I** 向链中插入规则\n\n![images](img/bull.jpg) **–R** 替换链中的规则\n\n![images](img/bull.jpg)\
  \ **–D** 从链中删除规则\n\n![images](img/bull.jpg) **–F** 删除链中的所有规则（称为 *flush*）\n\n![images](img/bull.jpg)\
  \ **–P** 设置链的默认策略\n\n你还可以配合 `iptables` 使用以下选项：\n\n![images](img/bull.jpg) **–p**\
  \ 指定由规则检查的协议。你可以指定 all、tcp、udp 或 icmp。如果你指定了 tcp 或 udp，还可以使用以下扩展进行匹配：\n\n![images](img/bull.jpg)\
  \ --sport 指定单个源端口\n\n![images](img/bull.jpg) --dport 指定单个目的端口\n\n![images](img/bull.jpg)\
  \ --sports 指定多个源端口\n\n![images](img/bull.jpg) --dports 指定多个目的端口\n\n![images](img/bull.jpg)\
  \ –s *ip_address*/*mask** 指定要检查的源地址。对。如果你想检查所有 IP 地址，请使用 0/0。\n\n![images](img/bull.jpg)\
  \ –d *ip_address*/*mask*** 指定要检查的目的地址。如果你想检查所有 IP 地址，请使用 0/0。\n\n![images](img/bull.jpg)\
  \ –j *target*** 指定当数据包匹配规则时执行的操作。你可以指定 ACCEPT、REJECT、DROP 或 LOG 动作。\n\n\n\n\n\n\
  ![images](img/bull.jpg) `-i interface` 指定接收数据包的接口。这仅适用于 `INPUT` 和 `FORWARD` 链。\n\
  \n![images](img/bull.jpg) `-o interface` 指定发送数据包的接口。这仅适用于 `OUTPUT` 和 `FORWARD` 链。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 这里出的选项仅代表使用 `iptables` 时可以执行的操作采样。要查看所有可用选项，请参阅\
  \ `iptables` 的 man 页面。\n\n学习如何使用 `iptables` 的最佳方法是查看一些示例。表 17-4 包含了一些你可以入门使用的示例\
  \ `iptables` 命令。\n\n![Images](img/t0670-01.jpg)\n\n**表 17-4** 一些 iptables 命令\n\n\
  你可以使用 `iptables` 创建复杂的规则数组，以控制数据流过防火墙。大多数管理员使用 `iptables` 的 `-P` 选项来设置防火墙的默认过滤规则。一旦设置了默认规则，你就可以使用\
  \ `iptables` 为特定网络配置所需的默认行为异常。\n\n记住，使用 `iptables` 创建的任何规则都不是持久的。如果重启系统，它们默认将会丢失。要保存规则，你使用\
  \ `iptables-save` 命令将表写入文件。然后，你可以使用 `iptables-restore` 命令从你创建的文件中恢复表。\n\n让我们在接下来的练习中在\
  \ Linux 系统上练习实施网络安全措施。\n\n### 练习 17-2：在 Linux 上实施网络安全措施\n\n在本次练习中，你将练习扫描开放的 IP 端口并实现一个简单的基于主机的防火墙。你需要第二个系统来测试你的防火墙配置。\n\
  \n你可以使用书中自带的虚拟机进行此练习。运行快照 17-1 以获得配置正确的环境。\n\n***\n\n![Images](img/vedo.jpg)\n\n\
  **视频** 请观看 练习 17-2 视频，获取如何执行此任务演示。\n\n完成以下操作：\n\n**1.** 启动你的 Linux 系统并以学生用户身份登录。\n\
  \n**2.** 打开终端会话。\n\n**3.** 输入 `su –` 并输入密码 `student` 切换到 root 用户账户。\n\n**4.** 通过完成以下步骤扫描系统的开放端口：\n\
  \n**a.** 在 shell 提示符下，输入 `nmap –sT your_IP_address*`。系统上使用了哪些 TCP/IP 端口？\n\n**b.**\
  \ 在 shell 提示符下，输入 `nmap –sU your_IP_address*`。系统上使用了哪些 UDP/IP 端口？\n\n**5.** 通过以下操作使用\
  \ `iptables` 配置简单的防火墙：\n\n**a.** 从远程系统 ping 你的 Linux 系统并验证其是否有响应。\n**b.** 打开终端会话。\n\
  **c.** 在 shell 提示符下，`su –` 切换到 root。\n**d.** 在 shell 提示符下输入 `modprobe iptable_filter`\
  \ 配置内核使用 `iptables` 过滤器。\n**e.** 在 shell 提示符下输入 `iptables –t filter –L` 列出过滤表的当前规则。\n\
  **f.** 在 shell 提示符下，输入 `iptables –t filter –A INPUT –s 0/0 -p icmp –j DROP`。\n\n\
  此命令创建了一条规则，将丢弃从任何源发往本地系统的所有使用 ICMP 协议的入数据包。\n\n**g.** 在 shell 提示符下输入 `iptables –t\
  \ filter –L` 查看你的新规则。你应该能看到 `INPUT` 链中添加了以下规则：\n\n```\nDROP      icmp --   anywhere\
  \      anywhere\n```\n\n**h.** 使用你的远程系统 ping  Linux 系统的 IP 地址。数据包应该被丢弃，如示例输出所示：\n\
  \n![Images](img/p0671-02.jpg)\n\n现在你已经了解如何防御你的网络，让我们花些时间学习如何管理系统日志。\n\n### 管理系统日志\n\
  \n日志文件是系统管理员的内金矿。你可以利用日志文件检测入侵你系统的入侵者。日志文件还可以用于排查系统问题。在本章的这部分，我将教你如何管理和使用系统日志文件。我将涵盖以下主题：\n\
  \n- ![images](img/bull.jpg) 配置日志文件\n- ![images](img/bull.jpg) 使用日志文件排查问题\n- ![images](img/bull.jpg)\
  \ 使用日志文件检测入侵者\n\n让我们从讨论如何配置日志文件开始。\n\n### 配置日志文件\n\n你的系统日志文件存储在 `/var/log` 目录中，如图\
  \ 17-15](#ch17.html_ch17fig15)所示。\n\n![Images](img/f0672-01.jpg)\n\n**图 17-15**\
  \ `/var/log` 的内容\n\n注意图中，`/var/log` 中有很多子目录，系统守护进程（如 `mysql`、`apparmor`、`audit`\
  \ 和 `cups`）在其中存储日志文件。某些日志文件是简单的文本文件，可以使用文本处理工具读取。另一些是二进制文件，需要使用如 `lastlog` 等特殊工具。如图\
  \ 17-15 所示，`/var/log` 及其子目录中有许多文件。和任何事情一样，某些日志文件比其他文件有用得多。表 17-5 包含了一些较重要的日志文件列表。\n\
  \n![Images](img/t0672-01.jpg)\n\n**表 17-5** 有用的日志文件\n\n***\n\n![Imags](img/note.jpg)\n\
  \n**注意** 表 17-5 中显示的是 SUSE Linux 系统使用的日志文件。其他发行版可能默认使用不同的文件。你可以接下来讨论的 `syslog.conf`\
  \ 文件自定义日志记录。\n\nLinux 上日志的实现取决于你使用的哪个发行版。对于你的 Linux+/LPIC1 考试，你需要熟悉以下日志实现方式：\n\n\
  - ![images](img/bull.jpg) syslogd\n- ![images](img/bull.jpg) journald\n\n### syslogd\n\
  \n使用 `init` 的 Linux 系统上的日志通常由 `syslogd` 守护进程处理。与其让每个守护进程维护自己的独立日志文件，大多数 Linux 服务默认配置为将日志条目写入\
  \ `/dev/log`。该设备文件由 `syslogd` 守护进程维护。当服务向此套接字写入时，输入会被 `syslogd` 捕获。`syslogd` 守护进程随后使用\
  \ `/etc/syslog.conf` 文件（如图 17-16#ch17.html_ch17fig16 所示）中的条目来决定信息去向何处。\n\n![Images](img/f0673-01.jpg)\n\
  \n**图 17-16** `/etc/syslog.conf`\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 某些\
  \ Linux 发行版使用 `syslog-ng` 或 `rsyslogd` 代替 `syslogd` 来管理日志。系统使用的日志守护进程通过 `/etc/sysconfig/syslog`\
  \ 中的 `SYSLOG_DAEMON=` 指令进行配置。\n\n`syslog.conf` 文件的语法为\n\n`facility.priority    \
  \ file`\n\n`facility` 指提供消息的子系统。Linux 系统上使用 `syslog` 日志的每个进程分配以下设施之一：\n\n- ![images](img/bull.jpg)\
  \ `authpriv` 用于所有与系统安全或授权相关的服务\n- ![images](img/bull.jpg) `cron` 接收来自 cron 和 at\
  \ 的日志消息\n- ![images](img/bull.jpg) `daemon` 可供没有自己设施的守护进程使用的设施\n- ![images](img/bull.jpg)\
  \ `kern` 用于所有内核日志消息\n- ![images](img/bull.jpg) `lpr` 处理来自打印系统的消息\n- ![images](img/bull.jpg)\
  \ `mail` 用于邮件 MTA（如 `postfix` 或 `sendmail`）的日志消息\n- ![images](img/bull.jpg) `news`\
  \ 用于来自新闻守护进程的日志消息\n- ![images](img/bull.jpg) `syslog` 用于 syslog 守护进程自身的内部消息\n- ![images](img/bull.jpg)\
  \ `user` 用于用户相关的日志消息（例如登录失败）\n- ![images](img/bull.jpg) `uucp` 用于来自 uucp 守护进程的日志消息\n\
  - ![images](img/bull.jpg) `local0–local7` 你可以用于捕获你自己开发的应用程序的日志消息的设施\n\n\n\n\n除了设施之外，`syslogd`\
  \ 守护进程还提供了优先级级别（priorities），你可以使用它们来自定义系统日志记录的方式。在大多数发行版中，优先级由 `klogd` 守护进程处理，它作为\
  \ `syslogd` 的客户端运行。你可以在 `syslogd` 中以下优先级：\n\n![images](img/bull.jpg) `debug` 所有信息\n\
  \n![images](img/bull.jpg) `info` 信息性消息\n\n![images](img/bull.jpg) `notice` 关注的问题，但尚未成为问题\n\
  \n![images](img/bull.jpg) `warn` 非关键性错误\n\n![images](img/bull.jpg) `err` 严重错误\n\n\
  ![images](img/bull.jpg) `crit, alert, or emerg` 关键错误\n\n例如，在图 17-16 中，`syslog.conf`\
  \ 文件将来自 `cron` 设施的所有优先级（`*`）的消息重定向到 `/var/log/cron` 文件。如果需要，你可以自定义 `syslog.conf`\
  \ 文件，将不同优先级的消息分到不同的文件中。\n\n你的 Linux 发行版还应该包含一个名为 `logrotate` 的实用。`logrotate` 工具默认由系统上的\
  \ `cron` 守护进程每天运行。你可以使用 `/etc/logrotate.conf` 文件自定义日志文件的轮转方式，该文件如图 17-17 所示。\n\n\
  ![Images](img/f0675-01.jpg)\n\n**图 17-17** 在 `/etc/logrotate.conf` 中配置日志文件轮\n\n\
  * *\n\n![Images](img/note.jpg)\n\n**注意** 某些发行版使用 `logrotated` 守护进程来管理日志文件轮。\n\n\
  此文件包含 `logrotate` 用于决定如何以及何时轮转日志文件的默认全局参数。然而，可以使用位于 `/etc/logrotate.d/` 目录下的配置文件为特定的守护进程覆盖这些默认值。例如，在图\
  \ 17-18 中，`/etc/logrotate.d/apache2` 文件用于自定义 `apache2` 守护进程的日志记录。\n\n![Images](img/f0676-01.jpg)\n\
  \n**图 17-18** 配置 Apache Web 服务器日志记录\n\n在此图中，`/var/log/apache2/access_log` 文件将被压缩。它的最大存储时间为\
  \ 365 天，之后将被删除（`maxage 365`）。文件的旧版本将使用日期扩展进行存档（`dateext`）。日志文件在删除之前将经过 99 次轮转（`rotate\
  \ 99`）。如果文件大于 4096KB，它将进行轮转（`size=+4096k`）。如果文件为空，则不会轮转（`notifempty`）。如果文件不存在，则不会生成错误消息（`missingok`）。文件将以\
  \ 644 权限创建，所有者为 root 用户，并属于 root 组（`create 644 root root`）。在日志文件轮转后，将运行 `/etc/init.d/apache2\
  \ reload` 命令（`postrotate /etc/init.d/apache2 reload`）。\n\n* *\n\n![Images](img/note.jpg)\n\
  \n**注意** 在 logrotate 配置文件中可以使用许多其他指令。更多信息请参阅 `logrotate` 手页。\n\n`syslogd` 守护进程的酷功能之一是它支持记录到远程主机。将日志文件从本地系统移动到网络上的另一台计算机是一项非常有价值的管理和安全措施。例如，你可以将网络上所有\
  \ Linux 系统的日志记录重定向到单个日志主机。这样，如果用户来电反映问题，你可以立即在日志主机上访问他们的日志文件。\n\n此外，远程日志记录增加了你系统的安全性。缺乏经验的入侵者往往会在你的日志文件中到处留下足迹。然而，狡猾的入侵者会试图在访问系统后通过修改日志文件来抹除踪迹，这使得入侵变得非常困难。但如果你重定向了日志记录，入侵者就无法那么容易地掩盖踪迹。要重定向日志，请完成以下操作：\n\
  \n1. 打开终端会话并 `su –` 到 root。\n2. 用文本编辑器打开 `/etc/syslog.conf`。\n3. 在文件开头添加以下行：\n```\n\
  *.*      @IP_address_of_loghost\n```\n例如，要将所有消息重定向到 IP 地址为 192.168.1.10 的日志服务器，你需要输入\n\
  ```\n*.*      @192.168.1.10\n```\n4. 保存文件并退出编辑器。\n5. 重启 `syslogd` 守护进程。\n6. 配置日志服务器主机以接收来自其他系统的日志消息，请完成以下操作：\n\
  \   a. 在文本编辑器中打开 `/etc/sysconfig/syslog`。\n   b. 定位到 `SYSLOGD_PARAMS` 指令。\n   c.\
  \ 将 `SYSLOGD_PARAMS` 指令的值设置为 `–r`。\n   d. 保存更改并退出文件。\n   e. 重启 `syslogd`。\n\n* *\n\
  \n![Images](img/tip.jpg)\n\n**提示** 你可以使用 `logger` 工具测试你的日志配置。此命令行工具允许你手动在日志系统中创建条目。其语法为\
  \ `logger –p *facility.priority \"log_message\"`。\n\n### journald\n\n使用 `systemd`\
  \ 守护进程的较新的 Linux 发行版使用 `journald` 守护进程代替 `syslogd` 进行日志记录。`journald` 守护进程维护一个名为\
  \ `journal` 的系统日志（位于 `/var/log/journal/`）。你使用 `journalctl` 命令查看 journal。如果你在 shell\
  \ 提示符下无参数输入此命令，将显示整个 journal，如图 17-19 所示。\n\n![Images](img/f0677-01.jpg)\n\n**图\
  \ 17-19** 使用 journalctl 查看 journal\n\n`journald` 守护进程的一个特性是你可以可以使用它来查看系统启动消息。要这样做，你在\
  \ shell 提示符下输入 `journalctl –b`。\n\n`journalctl` 命令还可以用于显示与系统中运行特定服务相关的日志条目。语法为 `journalctl\
  \ –u service_name`。例如，要查看系统中运行的 SSH 守护进程的所有 journal 条目，你需要在 shell 提示符下输入 `journalctl\
  \ –u sshd`。示例见图 17-20。\n\n![Images](img/f0678-01.jpg)\n\n**图 17-20** 查看 sshd journal\
  \ 事件\n\njournal 守护进程的行为通过 `/etc/systemd/journald.conf` 文件配置。该文件有许多你可以配置的参数。这里列出了一些更有用的参数：\n\
  \n- `MaxFileSec`: 指定在开始创建新文件之前在 journal 文件中条目的的最大时间。\n- `MaxRetentionSec`: 指定存储\
  \ journal 条目的的最大时间。任何早于指定时间的条目都将自动从 journal 文件删除。\n- `ForwardToSyslog`: 配置 `journald`\
  \ 将其日志消息转发到传统的 syslog 守护进程。\n- `MaxLevelStore`: 控制存储在 journal 文件中的消息的最大日志级别。所有等于或小于指定日志级别的消息都会被存储，而任何高于指定级别的消息都会被丢弃。此参数可以设置为以下值之一：\n\
  \  - `emerg` (0)\n  - `alert` (1)\n  - `crit` (2)\n  - `err` (3)\n  - `warning`\
  \ (4)\n  - `notice` (5)\n  - `info` (6)\n  - `debug` (7)\n\n\n\n\n注意：如果你的发行版使用了\
  \ systemd，但你又渴望 syslogd 的功能，可以安装 `syslog-ng`。`syslog-ng` 守护进程与 `systemd` 工作，但其配置方式与\
  \ syslog 非常相似。\n\n在这些这些的基础上，接下来让我们讨论如何实际查看和使用日志文件。\n\n## 使用日志文件排排除故障\n\n正如本章前面提到的，当你在排除\
  \ Linux 问题时，日志文件可以是你非常宝贵的资源。如果内核或服务遇到问题，它将记录在日志文件中。查看这些日志文件可以为你提供大量信息，这些信息并不一定显示在屏幕上。\n\
  \n某些日志文件是二进制文件，必须使用特殊工具读取。然而，你的大多数日志文件都是简单的文本文件，可以使用标准的文本处理工具进行查看。在本书前面，你已经学习了如何使用\
  \ `cat`、`less` 和 `more` 工具在 Linux 系统上查看文本文件。当然，这些工具也可以用于查看基于文本的日志文件。但是，这些工具存在一个问题：日志文件通常太长，无法用它们进行有效地查看。\n\
  \n例如，`/var/log/messages` 文件可能有 10,000 行或更多。那是大量的文本！`less` 工具一次只显示 24 行。你必须按下很多次空格键才能到达文件末尾。\n\
  \n你可以使用两种策略来解决这个问题。第一种是将 `cat` 命令的输出重定向到 `grep` 命令，以过滤日志文件中的特定术语。例如，假设你想定位 `/var/log/messages`\
  \ 中与登录（login）相关的信息。你可以在 shell 提示符输入 `cat /var/log/messages | grep login | more`。这样，只会显示包含“login”术语的条目。如果你的系统使用\
  \ `systemd` 和 journal，你可以对 `journalctl` 命令执行相同的操作。只需将 `journalctl` 的输出通过给 `grep`\
  \ 并指定你要查找的术语即可。\n\n除了 `grep` 之外，你还可以使用 `head` 和 `tail` 工具查看日志条目。请注意，大多数日志文件按时间顺序记录条目，通常是从旧到新的。如果你想查看日志文件的开头，可以在\
  \ shell 提示符输入 `head *filename*` 来显示文件的几行。例如，在图 17-21 中，使用 `head` 显示了 `/var/log/messages`\
  \ 文件的开头。\n\n![Images](img/f0680-01.jpg)\n\n**图 17-21** 使用 head 查看日志文件\n\n`tail`\
  \ 工具的工作方式与 `head` 相反。它不是显示文件的几行，而是显示最后几行。这非常有用。通常在排除故障时，你只需要查看日志文件的最后几行。要此操作，在 shell\
  \ 提示符输入 `tail *filename*`。在图 17-22 中，正在使用 `tail` 查看 `/var/log/messages` 文件。\n\n\
  ![Images](img/f0680-02.jpg)\n\n**图 17-22** 使用 tail 查看日志文件\n\n`tail` 工具提供了 `-f` 选项，我在排除故障时一直使用它。当你使用\
  \ `-f` 选项时，`tail` 会像正常一样显示日志文件的最后几行。然而，它在屏幕上显示文本后并没有退出。相反，它会监控正在显示的文件，并在新行被添加到日志文件时将其显示。例如，你可以使用\
  \ `tail -f /var/log/messages` 命令在排除系统故障时监控系统日志文件以获取错误消息。\n\n`tail` 命令监控 `/var/log/messages`\
  \ 文件并等待新行的添加。如果系统发生了产生消息的情况（例如停止并重启网络接口），结果将立即显示在屏幕上，无需你再次运行 `tail`。你可以通过按下 CTRL-C\
  \ 退出文件监控。\n\n如果你的系统使用 `journald` 守护进程管理日志，你可以对 `journalctl` 命令执行相同的操作。如果你在 shell\
  \ 提示符运行 `journalctl -f`，将显示 journal 中的最后几条条目。`journalctl` 命令随后会监控 journal 并在新条目添加时打印它们。\n\
  \n你可以检查表 17-5 中列出的系统日志文件之一来排除故障排除。然而，表 [17-5] 中的文件是 SUSE Linux 使用的默认日志文件。在其他发行版（如\
  \ Fedora）中，你可能需要查看其他日志文件，包括：\n\n![images](img/bull.jpg) `cron` 包含来自 cron 守护进程的条目\n\
  \n![images](img/bull.jpg) `dmesg` 包含硬件检测信息\n\n![images](img/bull.jpg) `maillog`\
  \ 包含由 sendmail 守护进程生成的条目\n\n![images](img/bull.jpg) `secure` 包含访问网络守护进程的信息\n\n![images](img/bull.jpg)\
  \ `rpmpkgs` 包含已安装 rpm 包的列表\n\n要排除与应用程序或服务相关的故障，你可能需要检查专门为该服务维护的日志文件。例如，在 SUSE Linux\
  \ 系统上，你会检查 `mail`、`mail.err`、`mail.info` 和 `mail.warn` 文件，或者在 Fedora 系统上检查 `maillog`\
  \ 文件来排除 `postfix` 或 `sendmail` 守护进程的问题。如果 `mysqld` 守护进程有问题，将查看 `/var/log/mysql`\
  \ 目录下的 `mysqld.log` 文件。要排除 Apache Web 服务器的问题，你需要调查 `/var/log/apache2` 目录下的各种日志文件。\n\
  \n除了使用日志文件排除 Linux 系统上的故障外，你还可以使用它们来检测未经授权的入侵尝试。让我们接下来查看如何这样做。\n\n## 使用日志文件检测入侵者\n\
  \n检测入侵者涉及寻找他们在系统中留下的线索。在这方面，你最好的资源之一就是你的 Linux 系统为你维护的日志文件。就像 CSI 侦探一样，你需要实践和经验来培养一种直觉，让你知道什么时候什么事情看起来很可疑。培养这种直觉的最佳方法是花费大量时间审查你的日志文件。这将帮助你对系统的“正常”情况建立感觉。一旦你知道了什么是正常的，你就能识别出什么是不正常的。\n\
  \n基于此，让我们查看几个可以分析以识别可疑活动的日志文件。第一个是 `/var/log/wtmp` 文件。该日志文件包含所有通过验证系统的用户列表。该文件以二进制格式保存。你无法使用\
  \ `cat`、`less` 或 `vi` 等文本编辑器来查看它。相反，你必须在 shell 提示符使用 `last` 命令。`last` 工具的输出如图 17-23\
  \ 所示。\n\n![Images](img/f0682-01.jpg)\n\n**图 17-23** 使用 last 查看登录历史\n\n`last` 工具显示用户账户、登录时间、注销时间和用户验证来源。当你查看此文件时，寻找任何看起来异常的内容——例如，在没有人上班的半夜发生的登录就是可疑的。\n\
  \n你还可以查看 `/var/log/faillog` 文件。该日志文件包含身份验证失败的列表。该文件对于检测字典攻击非常有效，字典攻击会运行词典列表，尝试将其作为用户账户的密码。像\
  \ wtmp 一样，`faillog` 是一个二进制文件。要查看它，你需要使用 `faillog` 工具。该工具显示尝试验证的用户、该用户登录失败的次数以及最后一次未尝试的时间。你可以使用\
  \ `-u` 选项查看特定用户账户的登录尝试——例如：`faillog -u rtracy`。\n\n\n\n\n在检查此日志文件时，请留意异常的登录尝试，例如失败登录次数异常高，特别是当这些尝试发生在深夜时。你还可以使用\
  \ `faillog` 工具来指定系统如何处理失败的登录尝试。通过在 `faillog` 命令中使用以下选项来实现：\n\n![images](img/bull.jpg)\
  \ `-l seconds`   在登录尝试失败后锁定账户指定的秒数。\n\n![images](img/bull.jpg) `-m number`   设置用户账户被禁用之前的最大失败登录尝试次数。\n\
  \n下一个日志文件是 `/var/log/lastlog`。该文件包含了系统内所有用户的列表以及他们最后登录的时间。与我们之前看过的其他日志文件一样，你无法使用\
  \ `less`、`cat` 或文本编辑器查看 `lastlog`。要查看 `lastlog`，你必须在 shell 提示符中使用 `lastlog` 工具，如图\
  \ 17-24 所示。\n\n![Images](img/f0683-01.jpg)\n\n**图 17-24**   使用 lastlog 查看最后登录时间\n\
  \n你可以用于检测入侵尝试的最后类型日志文件是 `/var/log/messages` 和你的 journal（如果你的发行版使用了它的话）。如前所述，这些日志文件包含了运行在系统上的所有服务的消息。因此，它们包含了大量可能与入侵尝试相关无关的数据。你可以使用\
  \ `grep` 来隔离相关的条目。例如，你可以使用 `cat /var/log/messages | grep login | more` 命令来查看文件中与登录相关的条目。你可以对\
  \ `journalctl` 命令执行相同的操作。\n\n除了查看日志文件外，你还可以使用各种命令行工具查看当前正在使用系统的人。第一个是 `who` 命令。你可以使用\
  \ `who` 来查看谁正在登录到你的系统。在图 17-25 中，你可以看到 `rtracy` 和 `ksanders` 用户已登录系统。`rtracy` 用户登录到了第一个\
  \ X server 会话（`:0`）并打开了一个终端会话控制台。`ksanders` 用户是通过一个来自 IP 地址为 `10.0.0.60` 的主机的 SSH\
  \ 连接登录的。你还可以使用 `finger` 工具查看当前谁正在登录到系统，如图 17-25 所示。\n\n![Images](img/f0683-02.jpg)\n\
  \n**图 17-25**   使用 who 和 finger\n\n接下来，我们需要查看配置 xinetd 和 inetd。\n\n## 配置 xinetd\
  \ 和 inetd\n\n在本章的这一部分，你将学习如何配置 Linux “超级守护进程”。大多数 Linux 发行版在系统安装过程中会安装各种网络服务。这些服务中的大多数（例如\
  \ Telnet）非常实用并提供了价值的服务。然而，在大多数时候并不需要它们。我们需要一种方法在请求时提供这些服务，而在不需要时卸载它们，从而节省内存、降低 CPU\
  \ 利用率并提高系统的整体安全性。\n\n根据你的发行版，有两种方法可以。这里讨论了以下选项：\n\n![images](img/bull.jpg) 配置 xinetd\n\
  \n![images](img/bull.jpg) 配置 inetd\n\n### 配置 xinetd\n\n许多 Linux 发行版包含一个名为 `xinetd`\
  \ 的特殊守护进程，它可以管理多个不同的网络服务。在本章的这一部分，你将学习如何配置和使用 `xinetd`。我们将讨论以下主题：\n\n![images](img/bull.jpg)\
  \ xinetd 的工作原理\n\n![images](img/bull.jpg) 配置 xinetd 网络服务\n\n![images](img/bull.jpg)\
  \ 使用 TCP Wrappers\n\n让我们从讨论 `xinetd` 守护进程如何工作开始。\n\n### xinetd 如何工作\n\n`xinetd`\
  \ 守护进程是一个超级守护进程。它被称为超级守护进程是因为它在请求网络服务的用户与提供实际服务的系统守护进程之间充中介。这在图 17-26 所示。\n\n![Images](img/f0685-01.jpg)\n\
  \n**图 17-26**   xinetd 如何工作\n\n当一个由 `xinetd` 管理的网络服务请求到达系统时，它由 `xinetd` 接收并处理，而不是由被请求的网络守护进程。`xinetd`\
  \ 守护进程随后启动请求服务的守护进程并将请求转发给它。当请求完成且网络服务不再需要时，`xinetd` 将该守护进程从内存中卸载。\n\n由 `xinetd`\
  \ 管理的一些网络服务包括以下项：\n\n![images](img/bull.jpg) chargen\n\n![images](img/bull.jpg)\
  \ daytime\n\n![images](img/bull.jpg) echo\n\n![images](img/bull.jpg) ftp\n\n![images](img/bull.jpg)\
  \ pop3\n\n![images](img/bull.jpg) rsync\n\n![images](img/bull.jpg) smtp\n\n![images](img/bull.jpg)\
  \ telnet\n\n![images](img/bull.jpg) tftp\n\n![images](img/bull.jpg) time\n\n![images](img/bull.jpg)\
  \ vnc\n\n接下来让我们讨论如何配置由 `xinetd` 管理的服务。\n\n### 配置 xinetd 网络服务\n\n许多 Linux 发行版包含一个名为\
  \ `xinetd` 的特殊守护进程，可以用于管理许多不同的网络服务。在本章的这一部分，你将学习如何配置和使用 `xinetd`。我们将讨论以下主题：\n\n\
  ![images](img/bull.jpg) xinetd 的工作原理\n\n![images](img/bull.jpg) 配置 xinetd 网络服务\n\
  \n![images](img/bull.jpg) 使用 TCP Wrappers\n\n让我们从讨论 `xinetd` 守护进程如何工作开始。\n\n###\
  \ xinetd 如何工作原理\n\n`xinetd` 守护进程是一个超级守护进程。它被称为超级守护进程是因为它在请求网络服务的用户与提供实际服务的系统守护进程之间当中介。这在图\
  \ 17-26 所示。\n\n![Images](img/f0685-01.jpg)\n\n**图 17-26**   xinetd 如何工作\n\n当一个由\
  \ `xinetd` 管理的网络服务请求到达系统时，它由 `xinetd` 接收并处理，而不是由被请求的网络守护进程。`xinetd` 守护进程随后启动请求服务的守护进程并将请求转发给它。当请求完成且网络服务不再需要时，`xinetd`\
  \ 将该守护进程从内存中卸载。\n\n由 `xinetd` 管理的一些网络服务包括以下项：\n\n![images](img/bull.jpg) chargen\n\
  \n![images](img/bull.jpg) daytime\n\n![images](img/bull.jpg) echo\n\n![images](img/bull.jpg)\
  \ ftp\n\n![images](img/bull.jpg) pop3\n\n![images](img/bull.jpg) rsync\n\n![images](img/bull.jpg)\
  \ smtp\n\n![images](img/bull.jpg) telnet\n\n![images](img/bull.jpg) tftp\n\n![images](img/bull.jpg)\
  \ time\n\n![images](img/bull.jpg) vnc\n\n接下来让我们讨论如何配置由 `xinetd` 管理的服务。\n\n### 配置\
  \ xinetd 网络服务\n\n正如我讨论的所有网络服务一样，`xinetd` 的配置文件存储在 `/etc`。`xinetd` 守护进程本身的配置使用 `xinetd.conf`\
  \ 文件。通常情况下你不需要对此文件进行许多更改。默认配置工作良好。在该文件的末尾你会注意到一个指令：\n\n```\nincluded /etc/xinetd.d\n\
  ```\n\n该行告诉 `xinetd` 使用 `/etc/xinetd.d`。这些文件告诉 `xinetd` 如何在请求时启动服务。例如，由 `xinetd`\
  \ 管理的 `vsftpd` 文件在 `/etc/xinetd.d` 中用于配置。`vsftpd` 的配置设置如下：\n\n![Images](img/f0683-02.jpg)\n\
  \n该文件并不配置守护进程本身，它只是告诉 `xinetd` 如何启动守护进程。`vsftpd` 守护进程的配置文件位于 `/etc/vsftpd.conf`。`/etc/xinetd.d/vsftpd`\
  \ 文件中最重要的参数之一是 `disable` 指令。该指令指定 `xinetd` 是否允许在请求时启动守护进程。在前面的示例中，该指令设置为 `yes`，这意味着在请求时不会启动守护进程。要启动的守护进程由\
  \ `server =` 指令指定。在示例中，`xinetd` 将启动 `/usr/sbin/vsftpd`。要启用此守护进程，你需要编辑此文件并将 `disable`\
  \ 参数更改。在更改 `/etc/xinetd.d` 中的任何文件后，你需要使用位于 `/etc/rc.d/init` 或 `/etc/init.d` 的脚本重启\
  \ `xinetd` 守护进程。\n\n![Images](img/tip.jpg)\n\n提示   如果你启用了 `xinetd` 提供的服务，你需要在 Linux\
  \ 系统的防火墙中创建一个异常以允许该守护进程使用的 IP 端口。\n\n### 使用 TCP Wrappers\n\n如果你通过 `/etc/xinetd.d/`\
  \ 目录下的配置文件启用了特定服务，任何主机都可以通过 `xinetd` 连接它。然而，根据你系统的部署方式，你可能需要控制对这些服务的访问。你可能希望限制访问到一组特定的主机，并拒绝其他人的访问。如果是这样，你需要配置这些服务使用\
  \ TCP Wrappers，TCP Wrappers 用于 `xinetd` 使用一组指定谁可以访问以及谁不能访问服务的配置文件。\n\n要使用 TCP Wrappers，你首先需要在\
  \ `/etc/xinetd.d` 中的每个服务配置文件中启用该功能。执行以下操作：\n\n1. 验证你的 Linux 系统上已安装了 `tcpd` 包。\n\
  2. 使用文本编辑器打开相应的配置文件。\n3. 注释掉现有的 `server =` 行。\n4. 添加以下行：\n\n```\nserver = /usr/sbin/tcpd\n\
  ```\n\n这将导致 `xinetd` 启动 `tcpd` 守护进程而不是服务守护进程本身。\n\n5. 添加以下行：\n\n```\nserver_args\
  \ = path_to_daemon\n```\n\n\n\n\n\n这告诉 `tcpd` 守护进程运行请求的网络守护进程。在处显示的示例中，`/etc/xinetd.d/telnet`\
  \ 文件已配置为在 TCP Wrapper 内部运行 `vsftpd` 守护进程：\n\n![Images](img/p0686-03.jpg)\n\n![Images](img/p0687-01.jpg)\n\
  \n6. 保存文件并重启 `xinetd` 守护进程。\n\n接下来，你需要创建访问控制规则。`tcpd` 守护进程使用 `/etc/hosts.allow`\
  \ 和 `/etc/hosts.deny` 文件来指定谁可以访问它管理的的服务。`/etc/hosts.allow` 中的条目被允许访问；`/etc/hosts.deny`\
  \ 中的主机不允许访问。这两个文件的语法均为：\n\n`service: host_addresses`\n\n在处理这些文件时，一旦在文件中找到匹配的条件，搜索就会停止。发生这种情况后，将不再处理后续文件。以下步骤按照所示顺序执行：\n\
  \n![images](img/bull.jpg) 如果在 `/etc/hosts.allow` 文件中找到匹配的条目，将授予访问权限。\n\n![images](img/bull.jpg)\
  \ 如果没有，如果在 `/etc/hosts.deny` 文件中找到匹配的条目，将拒绝访问。\n\n![images](img/bull.jpg) 如果这些均未发生，将授予访问权限。\n\
  \n例如，假设你需要配置 `/etc/hosts.allow` 文件，以允许少数几个特定主机访问 `vsftpd` 守护进程。接下来的条目允许 IP 地址为 `192.168.1.10`\
  \ 和 `192.168.1.102` 的主机访问 `vsftpd` 服务的权限。\n\n`vsftpd:     192.168.1.10, 192.168.1.102`\n\
  \n某些发行版使用 `inetd` 守护进程代替 `xinetd`。该守护进程的工作方式与 `xinetd` 非常相似。让我们来学习它是如何工作的。\n\n##\
  \ 配置 inetd\n\n`inetd` 守护进程是一个类似于 `xinetd` 的超级守护进程，但它通常用于较旧的 Linux 发行版。与 `xinetd`\
  \ 一样，`inetd` 守护进程充当连接到 Linux 主机上运行的网络服务的连接请求的中介。它接受来自客户端系统的连接请求，启动请求的服务，然后将来自客户端的请求转发给新启动的守护进程。当事务完成且客户端连接终止时，Linux\
  \ 主机上的守护进程将停止。\n\n正如我们在讨论 `xinetd` 时所说的，以这种方式管理 Linux 主机上的网络服务既有优点也有缺点。其中关键优点是它可以节省系统内存和\
  \ CPU 资源。网络守护进程仅在需要时才启动。当不需要时，它会被从内存中移除，直到再次被请求。然而，这种好处是以延迟为代价的。当客户端请求某服务时，客户端必须等待短时间，以便加载必要的守护进程并建立连接。因此，`inetd`（以及\
  \ `xinetd`）应该只用于管理系统上偶尔才需要的网络服务。\n\n`inetd` 守护进程使用 `/etc/inetd.conf` 文件进行配置。与 `xinetd`\
  \ 守护进程不同，由 `inetd` 管理的所有服务都配置在这一个文件中。该文件的每一行都配置一个由 `inetd` 管理的单一服务。`inetd.conf`\
  \ 中使用的语法所示：\n\n`service_name socket_type protocol flags user executable arguments`\n\
  \n该行中的每个参数在表 17-6 中进行了描述。\n\n![Images](img/t0688-01.jpg)\n\n**表 17-6** inetd 配置文件参数\n\
  \n`inetd` 配置文件中允许特定主机访问 `vsftpd` 守护进程的示例。以下是 `inetd.conf` 中用于 `vsftpd` 的示例条目：\n\n\
  `ftp stream tcp nowait /usr/sbin/vsftpd`\n\n注意，在 `inetd` 示例中，当客户端尝试连接时，`inetd` 会使用\
  \ TCP Wrapper 启动 `vsftpd`。这通过 `/etc/inetd` 实现。`inetd` 守护进程使用 `/etc/inetd.conf` 文件进行配置。与\
  \ `xinetd` 守护进程不同，由 `inetd` 管理的所有服务都配置在这一个配置文件中。该文件的每一行都配置一个由 `inetd` 管理的单一服务。`inetd.conf`\
  \ 中的`inetd` 语法所示：\n\n`service_name socket_type protocol flags user executable arguments`\n\
  \n该行中的每个参数在表 17-6 中进行了描述。\n\n![Images](img/t0688-01.jpg)\n\n**表 17-6** inetd 配置文件参数\n\
