  ![images](img/bull.jpg) 输入 `search_term` 或 `?search_term` 将搜索指定的术语。\n\n## Questions\n\
  \n**1.** Linux 系统上是如何存储操作系统和应用程序配置参数的？\n\nA. 在文本文件中\n\nB. 在注册表中\n\nC. 在 `.ini` 文件中\n\
  \nD. 在系统数据库中\n\n**2.** 大多数配置文件存储在 Linux 文件系统的哪个位置？\n\nA. `/boot`\n\nB. `/var`\n\n\
  C. `/usr`\n\nD. `/etc`\n\n**3.** 在大多数 Linux 发行版中，可以在哪里找到 `vi` 符号链接文件？\n\nA. `/usr/bin`\n\
  B. `/usr`\n\nC. `/sys`\n\nD. `/sbin`\n\n**4.** 哪个命令行命令可以在 `vi` 编辑器中编辑脚本时启用语法检查？\n\
  \nA. `:syntax_checking on`\n\nB. `:syntax=enabled`\n\nC. `:syntax=script`\n\nD.\
  \ `:syntax on`\n\n**5.** 你在 Linux 系统上打开了一个终端窗口，当前目录是 `/tmp`。你需要使用 `vi` 编辑系统 `/etc/xinetd.d`\
  \ 目录下的名为 `vnc` 的文本文件。以下哪个命令可以实现此操作？\n\nA. `vi vnc`\n\nB. `vi /tmp/vnc`\n\nC. `vi\
  \ /etc/xinetd.d/vnc`\n\nD. `vi /etc/xinetd.d`\n\n**6.** 你在 Linux 系统上打开了一个终端窗口，当前目录是用户的家目录。你需要使用\
  \ `vi` 在家目录下创建一个名为 `resources.txt` 的新文件。以下哪个命令可以实现此操作？\n\nA. `vi resources.txt –new`\n\
  \nB. `vi resources`\n\nC. `vi ~/resources`\n\nD. `vi resources.txt`\n\n**7.** `vi`\
  \ 默认以什么模式打开？\n\nA. 命令行模式\n\nB. 插入模式\n\nC. 命令模式\n\nD. 替换模式\n\n**8.** 你在 `vi` 中打开了一个名为\
  \ `list.txt` 的文本文件。你使用方向键移动光标到需要进行几处更改的地方。你尝试输入，但什么都没有发生。为什么会出现这种情况？\n\nA. `vi`\
  \ 编辑器处于插入模式。你需要切换到命令模式。\n\nB. `vi` 编辑器处于命令模式。你需要切换到插入模式。\n\nC. `vi` 编辑器处于插入模式。你需要切换到替换模式。\n\
  \nD. 文本文件损坏了。\n\n**9.** 哪个按键可以将 `vi` 从命令模式切换到插入模式？（选择两项）\n\nA. DELETE\n\nB. ESC\n\
  \nC. INSERT\n\nD. S\n\nE. F1\n\n**10.** 你正在使用 `vi` 在插入模式下编辑文本文件。因为你对文件所做的更改性质，你需要切换到替换模式。哪个按键可以实现此操作？\n\
  \nA. ESC\n\nB. `CTRL-X CTRL-R`\n\nC. `:`\n\nD. INSERT\n\n**11.** 你正在使用 `vi` 在插入模式下编辑文件。你需要切换回命令模式。哪个按键可以实现此操作？\n\
  \nA. INSERT\n\nB. `:`\n\nC. ESC\n\nD. BACKSPACE\n\n**12.** 你正在使用 `vi` 在命令模式下编辑文件。你尝试使用\
  \ `BACKSPACE` 键删除一个单词，但没有反应。系统出了什么问题？\n\nA. 你需要切换到普通模式。\n\nB. 你需要按下 `CTRL-BACKSPACE`。\n\
  \nC. 没有问题。`BACKSPACE` 在命令模式下无效。\n\nD. 你需要切换到命令行模式。\n\n**13.** 你使用 `vi` 创建了一个新文件，现在需要在不退出编辑器的情况下保存文件。哪个命令可以实现此操作？\n\
  \nA. `:s`\n\nB. `:w`\n\nC. `:save`\n\nD. `:exit`\n\n**14.** 你使用 `vi` 创建了一个新文件，需要将文件保存到磁盘并退出程序。哪个命令可以实现此操作？（选择两项）\n\
  \nA. `:w`\n\nB. `:e!`\n\nC. `:wq`\n\nD. `:exit`\n\nE. `:q`\n\n**15.** 你使用 `vi` 对配置文件进行了几处更改。你意识到自己犯了许多错误，想在不保存更改的情况下退出以便重新开始。哪个命令可以实现此操作？\n\
  \nA. `:q!`\n\nB. `:exit`\n\nC. `:q`\n\nD. `:exit!`\n\n**16.** 你在 `vi` 的命令模式下处理文件。你在文件中找到一个需要删除的单词，并将光标置于该单词的开头。哪个命令可以删除这个单词而不删除单词后的空格？\n\
  \nA. `dw`\n\nB. `de`\n\nC. `d$`\n\nD. `dd`\n\n**17.** 你在 `vi` 的命令模式下查看一个配置文件。你需要在文件中找到名为\
  \ `server` 的指令。然而，文件很长，你不想逐行扫描。在命令模式下可以使用哪个命令搜索此术语？\n\nA. `/server`\n\nB. `search=server`\n\
  \nC. `/\"server\"`\n\nD. `find \"server\"`\n\n### Answers\n\n**1. A.** Linux 使用文本文件存储配置参数。\n\
  \n**2. D.** 大多数配置文件存储在 `/etc` 中。\n\n**3. A.** 根据你使用的发行版，`vi` 程序本身或其符号链接将存储在 `/usr/bin`\
  \ 中。\n\n**4. D.** `:syntax on` 命令用于开启语法检查。\n\n**5. C.** 因为文件不在当前目录，所以你在启动 `vi` 时必须提供文件的完整路径。\n\
  \n**6. D.** 因为你没有指定路径，`vi` 将在当前目录下创建文件，这正是你需要的。\n\n**7. C.** `vi` 默认以命令模式打开。\n\n\
  **8. B.** `vi` 编辑器默认以命令模式打开。你必须按下 `INSERT` 切换到插入模式开始编辑文件。\n\n**9. C, D.** 按下 `INSERT`\
  \ 或 `S`可以将 `vi` 从命令模式切换到插入模式。\n\n**10. D.** 在插入模式下按下 `INSERT` 将 `vi` 切换到替换模式。\n\n\
  **11. C.** 在插入模式下按下 `ESC` 将 `vi` 切换到命令模式。\n\n**12. C.** `BACKSPACE` 键在命令模式下无效。你必须先切换到插入或替换模式。\n\
  \n**13. B.** 输入 `:w` 将当前内存缓冲区保存到磁盘而不退出编辑器。\n\n**14. C, D.** 输入 `:exit` 将导致 `vi`\
  \ 保存当前文件并退出程序，输入 `:wq` 也是如此。\n\n**15. A.** 输入 `:q!` 将退出 `vi` 而不保存当前文件。\n\n**16.\
  \ B.** 在命令模式下输入 `de` 将导致 `vi` 删除单词而不删除单词后的空格。\n\n**17. A.** 在命令模式下输入 `/server` 将在文件中搜索表达式“server”。\n\
  \n# 第 4 章\n\n## 管理 Linux 文件和目录\n\n在本章中，你将学习到：\n\n• 理解 Linux 文件系统和文件系统层次结构标准 (FHS)\n\
  • 在 Linux 文件系统中查找文件\n• 从命令行管理目录\n• 从命令行管理文件\n• 处理链接文件\n• 在文件内查找内容\n\n是时候深入学习并处理\
  \ Linux 文件和目录了！如果你是从 Windows 背景转向 Linux，这一章对你来说可能有挑战性。Linux 文件系统在许多方面与其他操作系统使用的文件系统相似，但在许多方面又截然不同。我的经验是，在开始处理文件系统时，它足够的相似性会给你一种错误的安全感。然后，当你深入并开始处理更高级的任务时，挫败感就会随之而来。\n\
  \n\n\n\n希望在我们学习这一章的过程中，我尽可能让内容变得易于理解。如果我一定要强调一点能让你的生活更轻松的事情，那就是记住：Linux 的文件名和目录名是**区分大小**的！新\
  \ Linux 用户往往会在 Linux 文件系统的这方面感到非常困扰。当你在本书的示例或练习中看到命令或文件名时，请记住你必须使用正确的大小；否则，你无法得到相同的结果！\n\
  \n***\n\n![Images](img/examtip.jpg)\n\n**考试提示** 请准备好在你的 LPIC-1/Linux+ 考试中针对本章进行大量测试的准备。在参加考试时，可能会给出一个假设性场景，并要求你提供正确的命令来完成所需的任务。你必须足够熟悉本章的内容，以便做出反应。做到这一点的唯一方法就是练习、练习、再练习！\n\
  \n# 理解 Linux 文件系统和文件系统层次结构标准 (FHS)\n\n在本章的这部分，我们将讨论讨论 Linux 文件系统。具体来说，我们将回顾以下内容：\n\
  \n![images](img/bull.jpg) Linux 文件系统的作用\n![images](img/bull.jpg) Linux 文件系统的分级结构\n\
  ![images](img/bull.jpg) Linux 文件类型\n\n让我们从讨论文件系统的作用开始。\n\n## Linux 文件系统的作用\n\n那么文件系统的作用究竟是什么呢？在\
  \ Linux 系统上（或者说任何其他操作系统上），文件系统以如下方式在存储设备上存储信息：\n\n![images](img/bull.jpg) 数据可以以持久化的方式保存，\n\
  ![images](img/bull.jpg) 数据经过组织并可以被轻松定位，\n![images](img/bull.jpg) 数据可以被快速检索供以后使用，并且\n\
  ![images](img/bull.jpg) 保持了数据的完整性。\n\n换句话说，如果你将一个文件保存到存储设备中，你应该能够稍后找到它并检索它，同时确保其内容与保存时完全相同。无论你是将数据保存到软磁盘、硬盘还是\
  \ USB 驱动器，目标都是一样的。为了实现这一目标，你必须使用某种类型的文件系统来管理存储的数据。\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** *文件系统*一词在 Linux 世界中实际上有多种含义。你可能会听到将 `ext2`、`ext3`、`ext4` 和 `Reiser`称为*文件系统*。这种用法是正确的；它们确实是文件系统。然而，它们更准确的标识是*磁盘文件系统*。它们用于定义数据如何存储在你的\
  \ Linux 系统的硬盘上。磁盘文件系统是通用文件系统的特定实现。关于每种类型文件系统的细节将在第 5 章中讨论。\n\n让我们回顾 Linux 文件系统如何通过文件系统层次结构标准\
  \ (FHS) 来组织数据，以便于定位和检索。\n\n## Linux 文件系统的分级结构\n\nLinux 文件系统使用分级结构来组织和存储数据。这在图 4-1\
  \ 所示。\n\n![Images](img/f0089-01.jpg)\n\n**图 4-1** Linux 文件系统的分级结构\n\n结构中最顶部的目录是\
  \ `/` 目录，也称为*根*目录，顺便提一下，它与你的 root 用户账户没有任何关系。它仅表示这是你分级文件系统树的顶部目录（“根”）。\n\n根目录下有很多子目录。关于这些目录命名的规范包含在文件系统层次结构标准\
  \ (FHS) 中。FHS 为 Linux 软件开发人员和系统管理员提供了一个文件系统的标准目录结构，确保了系统和发行版之间的一致性。你能想象如果每个发行版都使用自己的专有文件系统结构会是多么混乱吗？简直是一场灾难！你将找不到任何东西。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 你可以在 [www.pathname.com/fhs/](http://www.pathname.com/fhs/)\
  \ 查看更多关于 FHS 的信息。\n\n幸运的是，我们有 FHS 来规范大家。FHS 定义了应该出现在根目录 (`/`) 下的目录，以及应该出现在 `/usr`\
  \ 和 `/var` 目录下的目录。这些包括：\n\n![images](img/bull.jpg) `/bin` 该目录包含管理和运行 Linux 系统所需的可执行文件，包括\
  \ shell（如 `bash`）以及 `cp` 和 `rm` 等文件系统管理工具。\n\n![images](img/bull.jpg) `/boot` 该目录包含你的引导加载程序文件，启动系统需要它们。\n\
  \n![images](img/bull.jpg) `/dev` 该目录包含用于表示系统中安装的各种硬件设备的特殊文件。例如，系统中的第一块硬盘被称为 `sda`，第二块被称为\
  \ `sdb`，以此此类推。每个驱动器上的分区通过在磁盘文件名后添加额外的数字来标识。例如，系统中第一块硬盘上的第一个分区是 `sda1`，第二个分区是 `sda2`，以此此类推。表示这些设备的文件存储在\
  \ `/dev` 中，如图 4-2 所示。注意图中 `/dev` 中存储了两类设备文件：\n\n![images](img/bull.jpg) **字符设备文件**\
  \ 这些文件用于通过一次一个字符顺序发送或接收数据的设备，例如打印机、鼠标或磁带驱动器。这些设备通常不支持随机访问。\n\n![images](img/bull.jpg)\
  \ **块设备文件** 这些文件用于按块管理数据的设备，例如软磁盘和硬盘。块设备通常支持数据的随机访问。\n\n![Images](img/f0090-01.jpg)\n\
  \n**图 4-2** 在 /dev 中通过文件访问硬件\n\n许多类型的硬件设备通过 `/dev` 中的设备文件表示。表 4-1 显示了部分示例。要理解的关键点是：系统中的物理硬件是由运行在系统上的应用程序和服务通过\
  \ `/dev` 中的文件进行寻址的。需要将文件保存到磁盘吗？它通过 `/dev` 中的相应文件进行。需要向打印机发送打印作业吗？它通过 `/dev` 中的文件进行。需要从\
  \ DVD 打开文件吗？它通过 `/dev` 中的文件读入。\n\n![Images](img/t0091-01.jpg)\n\n**表 4-1** 由 /dev\
  \ 文件表示的硬件\n\n***\n\n![Images](img/tip.jpg)\n\n**提示** `/dev` 中的设备文件也可以访问与任何硬件设备无关的系统资源，例如\
  \ `/dev/random`。\n\n![images](img/bull.jpg) `/etc` 该目录包含系统以及运行在系统上的使用的文本配置文件。你可以使用文本编辑器编辑这些文件来自定义\
  \ Linux 的行为。该目录中一些重要的文件包括表 4-2 所示所示。\n\n![images](img/bull.jpg) `/home` 该目录包含子目录，作为你\
  \ Linux 系统上每个用户账户的主目录。\n\n![images](img/bull.jpg) `/lib` 该目录包含 `/bin` 和 `/sbin`\
  \ 中程序使用的代码库。你的内核模块也存储在 `/lib` 的 modules 子目录中。\n\n![images](img/bull.jpg) `/media`\
  \ 该目录用于某些 Linux 发行版（如 openSUSE 和 Fedora）挂载外部设备，包括光驱器和 USB 驱动器。\n\n![images](img/bull.jpg)\
  \ `/mnt` 该目录用于某些 Linux 发行版挂载外部设备，包括光驱器和 USB 驱动器。与其他发行版的 `/media` 目录一样，使用一系列子目录来实现。\n\
  \n![images](img/bull.jpg) `/opt` 该目录包含你安装在系统上的某些程序的文件。\n\n\n\n\n![images](img/bull.jpg)\
  \ `/proc` 此目录与列表中的其他目录略有不同。`/proc` 在文件系统中并不存在。相反，它是一个伪文件系统（pseudo–file system），每次被访问时都会动态创建。它用于从\
  \ Linux 内内核访问进程和其他系统信息。\n\n`/proc` 包含许多不同的子目录，如图 4-3 所示。注意，这些子目录每一个都是用数字标识的，而不是名称。这些数字对应于系统上运行的相关软件进程的进程\
  \ ID (PID)。在图 4-4 中，正在运行的 `top` 程序用于显示系统上正在运行的进程。\n\n显示器左侧的 `PID` 列列出了每个软件进程的 `PID`\
  \ 数字。用于创建进程的命令实际名称显示在显示的最右列。例如，`top` 程序本身关联的进程 PID 为 2632。因此，如果你查看 `/proc/2632`\
  \ 目录，就可以查看系统上运行的 `top` 进程的信息，如图 4-5 所示。\n\n![images](img/bull.jpg) `/root` 此目录是根用户的家目录。注意，它与\
  \ `/home` 中其他用户的家目录分开存放。\n\n![images](img/bull.jpg) `/sbin` 此目录包含重要的系统管理和管理文件，例如\
  \ `fdisk`、`fsck`、`ifconfig`、`init`、`mkfs`、`shutdown` 和 `halt`。\n\n![images](img/bull.jpg)\
  \ `/srv` 此目录包含系统上运行的服务（如 `httpd` 和 `ftpd`）保存文件的子目录。\n\n![images](img/bull.jpg) `/sys`\
  \ 此目录包含关于你系统中硬件的信息。\n\n![images](img/bull.jpg) `/tmp` 此目录包含你或系统创建的临时文件。\n\n* * *\n\
  \n![Images](img/tip.jpg)\n\n**提示** 系统会定期删除 `/tmp` 目录中的旧文件。不要在 `/tmp` 中保存你想保留的内容！\n\
  \n![images](img/bull.jpg) `/usr` 此目录包含应用程序。事实上，你系统上使用的大多数应用程序文件都存储在 `/usr` 的子目录中。这些子目录包括表\
  \ 4-3 所示的。\n\n![images](img/bull.jpg) `/var` 此目录包含可变数据，包括你的系统日志文件。`/var` 中包含的一些典型子目录如表\
  \ 4-4 所示。\n\n![Images](img/t0092-01.jpg)\n\n**表 4-2** `/etc` 中的某些配置文件\n\n![Images](img/f0093-01.jpg)\n\
  \n**图 4-3** `/proc` 的子目录\n\n![Images](img/f0093-02.jpg)\n\n**图 4-4** 使用 `top` 显示运行中的进程\n\
  \n![Images](img/f0094-01.jpg)\n\n**图 4-5** 在 `/proc` 中查看 top 进程的信息\n\n![Images](img/t0094-01.jpg)\n\
  \n**表 4-3** `/usr` 的子目录\n\n![Images](img/t0095-01.jpg)\n\n**表 4-4** `/var` 的子目录\n\
  \n记住这种结构，我们接下来讨论 Linux 文件系统所使用的文件类型。\n\n### **Linux 使用的文件类型**\n\n在操作 Linux 时，你需要意识到文件系统使用了许多不同的文件类型。这是\
  \ Linux 文件系统与 Windows 文件系统产生显著差异的另一个领域。在 Windows 文件系统中，你基本上在文件系统中只有两种条目类型：\n\n![images](img/bull.jpg)\
  \ 目录\n\n![images](img/bull.jpg) 文件\n\n诚然，你可以拥有普通文件、隐藏文件、快捷方式文件、文字处理文件、可执行文件等。然而，这些都是基本文件类型的简单变体。\n\
  \n在 Linux 上，文件系统使用了多种不同的文件类型。这些包括表 4-5 列出的文件类型。\n\n![Images](img/t0095-02.jpg)\n\
  \n**表 4-5** Linux 文件类型\n\n有了这些对 Linux 文件系统的介绍，你已经准备好开始学习如何完成常见的文件系统任务了。与任何其他操作系统一样，你需要在能够在\
  \ Linux 文件系统中创建、复制和移动文件以及目录。在本章的下一部分，我们将花费一些时间回顾如何实现这些。\n\n如果你在其他操作系统中使用命令行有任何经验，你可能会认为这些任务在本质上是微不足道的。信不由，对于我的许多学生在初次学习如何使用\
  \ Linux 时，这些任务可能是困难的。我看到的关键错误是，学生在 Linux shell 提示符下操作文件系统时尝试使用 Windows 命令。\n\n我甚至发现自己偶尔也会这样做。最近我向学生们进行演示，需要在\
  \ Linux 系统上复制一些文件。我没经思考，在 shell 提示符处输入了 `copy` 而不是 `cp`，当然，它行不通。我当时脸都红了！我的学生在剩下的课时间里一直提醒我的错误！\n\
  \n就像 Windows 一样，你可以从 shell 提示符或从 Linux GUI 内部来执行文件系统操作任务。许多从 Windows 背景转向 Linux\
  \ 的人倾向于仅使用大多数发行版提供的 GUI 工具来执行这些任务。\n\n尽管这些图形化工具方便易用，但你仍然需要学习如何从 shell 提示符执行这些任务。我意识到这违背了\
  \ Windows 系统的标准做法。我遇到过很多 Windows 用户，他们甚至不知道系统中存在命令提示符。然而，对于 Linux，你需要首先精通 shell\
  \ 命令，然后为了方便再使用 GUI 工具。我之所以这么说是因为以下原因：\n\n![images](img/bull.jpg) 如果你不能从 shell 提示符管理系统，大多数雇主和同事不会把你当成真正的\
  \ Linux 管理员。这是常的。\n\n![images](img/bull.jpg) 许多 Linux 系统（尤其是作为服务器部署的系统）不运行 GUI。运行\
  \ GUI 环境需要大量的 CPU 开销。许多服务器管理员倾向于将这些 CPU 周期分配给系统服务，而不是移动鼠标指针或运行屏保。在这种情况下，你需要学会从提示符操作。\n\
  \n![Images](img/tip.jpg)\n\n**考试提示** 对于考试，你必须精通大量的文件系统操作命令。你需要在 shell 提示符下导航文件系统、管理文件和目录、运行可执行文件以及搜索文件系统。\n\
  \n### **在 Linux 文件系统中查找文件**\n\n我生活中之一之一记忆糟糕。你可以打电话给我转述一些重要信息，我几乎可以保证在挂电话时就忘记你说过什么。当我遇到认识并合作多年的朋友，却发现自己想不起对方的名字时，这个问题会让我非常尴尬。\n\
  \n遗憾的是，这种不靠性延续到了我的工作中。我无法数有多少次创建了一个文件并保存它，然后立刻忘记了把它保存在哪里。为了帮助像我这样的人，Linux 包含了一些可以在文件系统中搜索文件的工具。在本章的这一部分，你将学习：\n\
  \n![images](img/bull.jpg) 使用 `find`\n\n![images](img/bull.jpg) 使用 `locate`\n\n![images](img/bull.jpg)\
  \ 使用 `which`\n\n![images](img/bull.jpg) 使用 `whereis`\n\n![images](img/bull.jpg)\
  \ 使用 `type`\n\n让我们从学习如何使用 `find` 工具开始。\n\n\n\n\n`find` 实用工具是一个强大的工具，你可以用它来搜索 Linux\
  \ 文件系统。要使用 `find`，只需在 shell 提示符输入 `find *path* –name “*filename*”`。将 *path* 替换为文件系统中你想要开始查找的位置。将\
  \ *filename* 替换为你想要搜索的文件名。\n\n* *\n\n![Images](img/tip.jpg)\n\n**提示** 别忘记使用引号！\n\
  \n你可以使用如 `.*` 等正则表达式来扩大你的搜索结果。例如，假设你想找到文件系统中存储的所有具有 `.log` 扩展名的日志文件。你可以输入 `find\
  \ / –name “*.log”`。此时 `find` 实用工具将从文件系统的根目录开始搜索所有子目录下扩展名为 `.log` 的文件。这在图 4-6 所示。\n\
  \n![Images](img/f0097-01.jpg)\n\n**图 4-6** 使用 `find` 实用工具搜索文件\n\n`find` 实用工具非常灵活。你还可以使用\
  \ `–user “*username*”` 选项来搜索特定用户拥的文件，或使用 `–size “*size*”` 选项搜索指定大小的文件。你可以在大小值前使用\
  \ `+` 号来搜索大于指定大小的文件，或者在大小值前使用 `–` 号来搜索小于指定大小的文件。`find` 实用工具还有许多其他选项。你可以使用 `find`\
  \ 的 man 页（帮助文档）查看它提供的所有功能。\n\n除了 `find` 之外，你还可以使用 `locate` 实用工具在文件系统中搜索。\n\n###\
  \ 使用 locate\n\n`locate` 实用工具的功能与 `find` 非常相似。然而，它比 `find` 有一个明显的优势。问题在于：每当你运行 `find`\
  \ 搜索时，它都会手动遍历命令中指定的路径下的每个目录以寻找匹配的文件。这个过程可能花费很长时间，特别是当你从文件系统的根目录进行自顶搜索时。\n\n相反，`locate`\
  \ 实用工具的工作方式高效得多。它不是在每次运行搜索时遍历文件系统，而是建立文件系统的索引。然后，当你运行搜索时，`locate` 只需查询索引。它并不会直接搜索文件系统。结果是在在大多数情况下，`locate`\
  \ 的运行速度比 `find` 快得多。\n\n要使用 `locate`，你必须先在系统上安装 `findutils-locate` 包。安装该包后，`/var/log`\
  \ 中创建一个文件系统中所有文件的索引（命名为 `locatedb`）。该索引每天根据文件系统的最新更改进行更新。不过，你也可以通过 shell 提示符使用 `updatedb`\
  \ 命令手动更新索引。请注意，`updatedb` 为 `locate` 实用工具完成了所有的工作；它需要一些时间才能完成，并在过程中消耗大量的系统资源。\n\n\
  索引更新后，只需在 shell 提示符输入 `locate *filename*` 即可搜索文件。例如，如果你想搜索名为 `snmp.conf` 的文件，可以输入\
  \ `locate snmp.conf`，如下所示：\n\n![Images](img/p0098-01.jpg)\n\n注意 `locate` 找到了两个文件名中包含文本字符串“snmp-.conf”的文件。\n\
  \n* *\n\n![Images](img/tip.jpg)\n\n**提示** `/etc/udatedb.conf` 文件用于配置 `updatedb`\
  \ 实用工具的行为。你可以在此文件中设置 `PRUNEFS` 变量，指定你不希望让 `updatedb` 扫描的文件系统类型。你还可以在此文件中设置 `PRUNEPATHS`\
  \ 变量，列出文件系统中你希望 `updatedb` 在扫描时跳过的目录列表。\n\n考虑到这一点，让我们让我们讨论一下如何使用它们。\n\n#### 使用 which\n\
  \n`which` 命令用于显示 shell 命令或实用工具的完整路径。例如，如果你想知道 `ls` 命令的完整路径，可以在 shell 提示符输入 `which\
  \ ls`。当你这样做时，屏幕上会显示 `ls` 的完整路径，如下：\n\n![Images](img/p0098-02.jpg)\n\n除了 `which`，你还可以使用\
  \ `whereis`。接下来我们讨论如何使用这个实用工具。\n\n#### 使用 whereis\n\n`whereis` 命令定位指定文件的源代码、二进制文件和手册页。`–b`\
  \ 选项返回指定命令的二进制文件位置。`–m` 选项返回命令手册页的位置。要查看命令源代码的位置，请在 `whereis` 命令中使用 `–s` 选项。如果不使用任何选项，则将返回所有信息。\n\
  \n例如，如果你在 shell 提示符输入 `whereis –b ls`，将返回 `ls` 命令二进制执行文件的位置。示例所示：\n\n![Images](img/p0098-03.jpg)\n\
  \n同样，输入 `whereis –m ls` 命令会返回 `ls` 命令 man 页文件的位置，如下：\n\n![Images](img/p0099-01.jpg)\n\
  \n#### 使用 type\n\n`type` 命令返回在你输入它时执行的是什么种类型的命令。返回的值将是以下之一：\n\n![images](img/bull.jpg)\
  \ **硬编码在 shell 自身的命令**。例如，`cd` 命令是一个内置 shell 命令：\n\n```\nopenSUSE:/ # type cdcd\
  \ is a shell builtin\n```\n\n![images](img/bull.jpg) **由 shell 调用的外部命令**。如果命令最近在\
  \ shell 中运行过，`type` 的输出会显示该命令已哈希（hashed），这表明外部命令在文件系统中的位置已存储在 shell 的哈希表中。如果你再次运行相同的命令，shell\
  \ 将直接执行它，而不会在 `PATH` 环境变量的目录中搜索。示例所示：\n\n![Images](img/p0099-02.jpg)\n\n![images](img/bull.jpg)\
  \ **别名 (alias)**。别名本质上是 Linux 文件系统中另一个文件的快捷方式。别名经常用于常用命令，例如 `ls` 命令。下例所示：\n\n![Images](img/p0099-03.jpg)\n\
  \n![images](img/bull.jpg) **函数**。bash shell 允许通过定义自己的函数来创建新命令。\n\n你还可以配合 `type`\
  \ 命令使用 `–a` 选项。该选项会导致 `type` 返回系统中所有的命令实例。例如，输入 `type –a ip` 显示有两个名为 `ip` 的执行文件：\n\
  \n![Images](img/p0099-04.jpg)\n\n### 练习 4-1 搜索工具\n\n在此练习中，你将练习使用搜索工具。你可以可以使用书中附的虚拟机。运行快照\
  \ 4-1 获取正确配置的环境。\n\n* *\n\n![Imags](img/viedo.jpg)\n\n**视频** 请观看练习 4-1 视频，观看如何完成此任务的演示。\n\
  \n完成以下操作：\n\n**1.** 验证你已以 `student` 用户登录 Linux 系统，密码为 `student`。\n\n**2.** 如果必要，打开一个终端会话。\n\
  \n**3.** 在 shell 提示符输入 `su –` 切换到 root 用户账户并输入密码 `student`。\n\n**4.** 在 shell 提示符输入\
  \ `find / –name “resolv.conf”` 搜索名为 `resolv.conf` 的文件。该文件位于哪里？\n\n**5.** 使用 `locate\
  \ resolve.conf` 执行相同的搜索。\n\n**6.** 在 shell 提示 提示符输入 `which init` 查找 `init` 可执行文件的位置。它在哪里？\n\
  \n**7.** 在 shell 提示符输入 `whereis init`。包含 `init` 命令手册章节的文件在哪里？\n\n**8.** 在 shell\
  \ 提示符输入 `tail /var/log/messages` 显示消息日志文件的最后几行。\n\n**9.** 在 shell 提示符输入 `type tail`，查看\
  \ `tail` 命令在当前 shell 会话中是否已哈希。它是吗？这意味着什么？\n\n\n\n现在你已经了解了 Linux 文件系统的结构以及如何搜索文件，你已经准备好开始管理文件系统了。在本章的这部分中，我们将关注如何从\
  \ shell 提示符管理目录。将介绍以下主题：\n\n![images](img/bull.jpg) 在文件系统中进行导航\n\n![images](img/bull.jpg)\
  \ 查看目录内容\n\n![images](img/bull.jpg) 创建新目录\n\n![images](img/bull.jpg) 复制、移动和删除目录\n\
  \n让我们先讨论如何从 shell 提示符在文件系统中进行导航。\n\n## 在文件系统中进行导航\n\n当你从 shell 提示符操作 Linux 文件系统时，你将完成的最常见任务之一是在存储设备上的不同目录之间移动。你的\
  \ Linux 系统提供了以下 shell 命令，你可以使用它们来实现此操作：\n\n![images](img/bull.jpg) `pwd`\n\n![images](img/bull.jpg)\
  \ `cd`\n\n让我们从学习如何使用 `pwd` 命令开始。\n\n### 使用 `pwd` 命令\n\n`pwd` 命令是一个相对简单的工具。该命令名称\
  \ `pwd` 代表 `Print Working Directory`（打印工作目录）。该命令只是地在屏幕上显示当前目录。\n\n如果你的 shell 配置文件没有配置为将当前目录作为\
  \ shell 提示符的一部分显示，这个工具就会很有用。要使用 `pwd`，只需在 shell 提示符处输入 `pwd`，如下：\n\n![Images](img/p0101-01.jpg)\n\
  \n在这个示例中，你可以看到当前目录设置为 `/home/rtracy`。\n\n***\n\n![Images](img/tip.jpg)\n\n**提示**\
  \ shell 提示符中的 `~` 字符指向当前用户的家目录。因为在前面的示例中我是以 `rtracy` 用户登录的，所以 `~` 指向 `/home/rtracy`\
  \ 目录。\n\n如果你在使用 `pwd` 命令在使用 `-P` ，`pwd` 将显示不包含符号链接的物理目录。我们将在本章稍后讨论链接文件。\n\n到此时，你已经知道如何识别自己处于哪个目录了。通常，你需要切换到文件系统中的另一个目录。让我们接着讨论如何这样做。\n\
  \n### 使用 `cd` 命令\n\n`cd` 命令用于从 Linux shell 提示符切换文件系统中的目录。使用此命令，只需输入 `cd` 后跟你想要切换到的目录名称。你有两种方法可以实现这一点。如果你输入\
  \ `cd` 然后输入目录名称而没有指定该目录的完整路径，`cd` 将假设该目录是当前目录的子目录。在下面的示例中，执行了 `cd Documents` 命令：\n\
  \n![Images](img/p0101-02.jpg)\n\n因为命令是从 `/home/rtracy` 发出的，`cd` 将目录更改到了 `/home/rtracy/Documents`。这被称为使用*相对路径*。命令中指定的路径相对于文件系统中的其他点——在这种情况下，是\
  \ `/home/rtracy` 目录。\n\n你也可以在 `cd` 命令上使用*绝对路径*。当你使用绝对路径时，你指定了从 `/` 开始到你想要切换到的目录的完整路径，如下例所示：\n\
  \n![Images](img/p0101-03.jpg)\n\n因为我们指定了绝对路径（`/var/log`），`cd` 命令知道 `/var/log` 目录在当前目录中不存在。相反，路径是从根目录（`/`）确定的，并且当前目录切换到了该目录。\n\
  \n***\n\n![Images](img/tip.jpg)\n\n**提示** 如果你在 shell 提示符处输入 `cd` 而不指定路径，它将自动切换到当前登录用户的家目录。\n\
  \n你还可以使用 `cd` 命令向上移动文件系统层级。你可以通过输入 `cd ..` 来实现，这会将当前目录更改为层级中更高的下一个目录。考虑以下示例：\n\n\
  ![Images](img/p0102-01.jpg)\n\n在这个示例中，执行了 `cd ..` 命令，从 `/var/log` 切换到 `/var` 目录。要向上两个目录，你可以在\
  \ shell 提示符处输入 `cd ../../` 命令：\n\n![Images](img/p0102-02.jpg)\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** 你也可以使用 `..` 别名在层级中向上移动一级，使用 `…` 别名向上移动两层。大多数发行版会在你的一个 bash 配置文件中自动为你定义这些别名。\n\
  \n让我们接下来来看 `ls` 命令。\n\n## 查看目录内容\n\n到为止，你已经学习了如何查看当前目录并切换到文件系统的其他目录。现在你需要学习如何列出目录内可能存在的文件和子目录。这是使用\
  \ `ls` 命令完成的。如果你在 shell 提示符处输入 `ls`，当前目录的内容将列在屏幕上，如下：\n\n![Images](img/p0102-03.jpg)\n\
  \n与 `cd` 命令一样，在使用 `ls` 时你也可以提供绝对路径。这将导致 `ls` 显示你指定的目录的内容。考虑这个示例：\n\n![Images](img/p0102-04.jpg)\n\
  \n在这个示例中，执行了 `ls /var/log` 命令，导致 `/var/log` 的内容被显示。在操作 `ls` 时，你可以使用各种选项来定制它的工作。这里是一些选项：\n\
  \n![images](img/bull.jpg) `-a` 显示所有文件，包括隐藏文件。在下一个示例中，在 `/home/rtracy` 目录执行了 `ls\
  \ -a` 命令：\n\n![Images](img/p0103-01.jpg)\n\n![images](img/bull.jpg) `-l` 显示详细列表。这是一个非常有用的选项。可以使用它查看文件名、所有者、修改日期和大小。示例所示：\n\
  \n![Images](img/p0103-02.jpg)\n\n![images](img/bull.jpg) `-R` 递归显示目录内容；也就是说，它显示当前目录的内容以及所有子目录的内容。根据目录条目的数量，你可能在使用此选项后附加\
  \ `| more`。这将导致 `more` 工具分页显示。\n\n大多数发行版为 `ls` 命令定义了几个别名。例如，在 openSUSE 上 `dir` 别名运行\
  \ `ls -l`，`ll` 别名运行 `ls -l`，`la` 别名运行 `ls -la`。\n\n此列表只是可用选项的。你可以查看 `ls` 的 man 页或\
  \ info 节点以获取更多信息。\n\n### 练习 4-2：文件系统导航\n\n在此练习中，你将练习使用 shell 命令导航文件系统。可以使用书中提供的虚拟机进行此练习。运行快照\
  \ 4-1 获取配置的环境。\n\n***\n\n![Imags](img/viedo.jpg)\n\n**视频** 请观看练习 4-2 视频演示如何执行任务。\n\
  \n完成以下操作：\n\n1. 启动你的 Linux 系统并以 **student** 用户登录，密码为 **student**。\n2. 如必要，打开终端会话。\n\
  3. 在 shell 提示符处输入 `pwd` 确定当前工作目录。当前目录是什么？\n4. 在 shell 提示符处输入 `cd /etc` 切换目录到 /etc。\n\
  5. 输入 `ls` 生成当前目录列表。\n6. 输入 `ls -l` 生成当前目录的详细列表。\n7. 输入 `ls -l | more` 生成详细列表并分页显示输出。\n\
  8. 输入 `cd ~` 回到你的家目录。\n9. 输入 `ls`。\n10. 输入 `ls -a` 查看用户家目录中的隐藏文件。哪些文件由 `ls -a` 显示而\
  \ `ls` 不显示？\n\n\n\n你可以使用 shell 命令来创建新目录。这是通过 `mkdir` 命令完成的。在 shell 提示符中输入 `mkdir`，后跟你想要创建的目录名称。在下一个示例中，在\
  \ `rtracy` 用户的家目录下执行了 `mkdir MyFiles` 命令：\n\n![Images](img/p0104-01.jpg)\n\n注意 `ls`\
  \ 命令的输出，在 `/home/rtracy` 中创建了一个名为 `MyFiles` 的新目录。当然，如果你想在当前目录以外的地方创建目录，可以在目录名中使用绝对路径。例如，如果你想在\
  \ `/tmp` 目录下创建一个名为 `backup` 的新目录，你会在 shell 提示符中输入 `mkdir /tmp/backup`。\n\n在许多发行版中，在一个\
  \ shell 配置文件中定义了一个名为 `md` 的别名，该别名运行 `mkdir -p` 命令。`-p` 选项指定了如果命令指定的整个目录路径不存在，则创建该路径。例如，`md\
  \ ~/temp/backups/daily` 会在创建 `daily` 目录之前，如果 `temp` 和 `backups` 目录还不存在，则先创建它们。\n\
  \n## 复制、移动和删除目录\n\n除了在 Linux 文件系统中创建和查看目录外，你还可以使用 shell 命令来复制、移动或删除它们。你使用以下工具来完成这些任务：\n\
  \n![images](img/bull.jpg) `cp` 此工具用于将整个目录结构从文件系统中的一个位置复制到另一个位置。\n\n要复制整个目录结构，你需要包含\
  \ `-R` 选项，该选项指定递归复制目录内容。在接下来的示例中，在 `rtracy` 用户的家目录下执行了 `cp -R ~/MyFiles ~/backup`\
  \ 命令。这导致 `MyFiles` 目录及其所有的文件和子目录复制到了用户家目录下的 `backup` 目录。由于 `cp` 复制了目录，原始目录保持完好。\n\
  \n![Images](img/p0105-01.jpg)\n\n![images](img/bull.jpg) `mv` `mv` 命令的用法与 `cp` 类似。然而，它是将指定的目录复制到文件系统中的新位置，然后删除原始目录。例如，要将家目录下的名为\
  \ `backup` 的目录移动到 `/tmp`，我会输入 `mv ~/backup /tmp`。`mv` 命令也可以用于重命名目录。只需输入 `mv`，后跟要重名的目录，然后是新的目录名称。例如，将家目录下的\
  \ `backup` 目录重命名为 `temp`，你会输入 `mv ~/backup ~/temp`。\n\n![images](img/bull.jpg) `rmdir`\
  \ 此工具可删除现有目录。要使用它，只需输入 `rmdir directory_name`——例如，`rmdir MyFiles`。但注意，`rmdir` 要求目录在删除之前必须为空。在许多发行版中，其中一个\
  \ shell 配置文件定义了一个名为 `rd` 的别名，用于运行 `rmdir` 命令。\n\n![images](img/bull.jpg) `rm` `rm`\
  \ 工具是一个更强大的删除工具，可用于删除包含内容的目录。要删除目录，输入 `rm -r directory_name`。\n\n以上就是如何从 shell 提示符管理目录的方法。考虑到这一点，我们需要讨论如何从\
  \ shell 提示符管理这些目录中的文件。让我们接下来来看这一点。\n\n## 从命令行管理文件\n\n除了管理文件系统中的目录外，在很多时候你还需要管理它们包含的文件。在本章的这部分，你将学习如何完成以下任务：\n\
  \n![images](img/bull.jpg) 创建文件\n\n![images](img/bull.jpg) 查看文件内容\n\n![images](img/bull.jpg)\
  \ 删除文件\n\n![images](img/bull.jpg) 复制和移动文件\n\n![images](img/bull.jpg) 确定文件类型\n\n\
  让我们先看看如何在文件系统中创建新文件。\n\n### 创建新文件\n\n你可能经常需要在你的 Linux 文件系统中创建新文件。可以通过 shell 提示符使用\
  \ `touch` 命令来完成创建新文件。要使用 `touch`，输入 `touch` 后跟你想要创建的文件名。在下一个示例中，在 `rtracy` 用户的家目录下执行了\
  \ `touch myfile.txt` 命令：\n\n![Images](img/p0106-01.jpg)\n\n输入 `touch` 后，输入了 `ls`\
  \ 命令。你可以看到在 `/home/rtracy` 创建了一个名为 `myfile.txt` 的 0 字节文件。如果你想在文件系统的其他地方创建该文件，将对文件名使用绝对路径。\n\
  \n### 查看文件内容\n\n正如我们之前讨论过的，你的 Linux 系统以及运行在其上面的服务是通过存储在（通常是）文件系统 `/etc` 目录下的简单文本文件进行配置的。此外，许多系统日志文件也被保存为文本文件。由于\
  \ Linux 使用文本文件来配置和管理几乎一切，你将经常需要查看文件内容。\n\n在上一章中，你学习了如何使用文本编辑器打开文件进行查看和编辑。这效果非常好。然而，在很多情况下，你只是想在屏幕上快速查看文本文件，而不需要或不想加载文本编辑器。Linux\
  \ 提供了多种你可以使用的命令行工具来实现此目的。这些包括：\n\n![images](img/bull.jpg) `cat` `cat` 命令用于在屏幕上显示文件。例如，如果你需要查看\
  \ `/etc/xinetd.conf` 文件，你会在 shell 提示符中输入 `cat /etc/xinetd.conf`。\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** `cat` 命令不会暂停，因此如果你查看长文件，可能需要将其通过到 `more` 程序（`| more`）来按页暂停。\n\n![images](img/bull.jpg)\
  \ `less` `less` 命令也可以用于在屏幕上显示文件，类似于 `cat`。然而，`less` 命令会按页暂停长文本文件。你可以使用空格键、上键、下键和箭头键在输出周围导航。\n\
  \n![images](img/bull.jpg) `head` `head` 命令用于显示文件的前几行。\n\n![images](img/bull.jpg)\
  \ `tail` `tail` 命令用于显示文件的最后几行。`tail` 命令在查看日志文件时特别有用。当查看日志文件时，你通常只需要文件末尾的内容。你可以使用\
  \ `tail` 查看添加到文件最后的几个日志条目。\n\n`tail` 命令还包含 `-f` 选项，这非常有用。你可以用它监控命令指定的文件。如果文件末尾增加了新内容（例如日志文件），新行将显示在屏幕上。在图\
  \ 4-7 中，执行了 `tail -f /var/log/messages` 命令来监控文件的新条目。\n\n![Images](img/f107-01.jpg)\n\
  \n**图 4-7** 使用 `tail -f` 选项监控日志文件\n\n使用 `-f` 使用 `tail` 命令对于排除系统中故障的服务或配置问题非常有帮助。当你完成后，可以通过按\
  \ CTRL-C 退出 `tail`。\n\n### 删除文件\n\n与目录一样，你可能经常需要从 Linux 文件系统中删除现有文件。删除文件可以通过 `rm`\
  \ 命令完成。这与我们之前删除目录的命令是同一个。`rm` 工具是一个强大的删除工具，可用于删除文件或包含内容的目录。要删除文件，只需输入 `rm filename`。在下一个示例中，使用\
  \ `rm` 命令删除了 `myfile.txt` 文件：\n\n![Images](img/p0107-01.jpg)\n\n\n\n\n在使用 `rm` 工具时需要非常小心！正如你在前面的示例所示，它不会提示你确认要删除操作。它假设你确实想要删除该文件或目录并直接执行操作。顺便说一下，被删除的文件不会移动到回收站。如果你用\
  \ `rm` 除了文件或目录，它就消失了！如果你想让 `rm` 在删除文件或目录之前提示你，请包含 `-i` 选项。\n\n接下来让我们回顾如何从 shell\
  \ 提示符复制和移动文件。\n\n## 复制和移动文件\n\n在 Linux 文件系统中创建和删除文件之外，你还可以复制或移动它们。你使用与管理目录时相同的工具来复制或移动文件：\n\
  \n![images](img/bull.jpg) `cp` 该工具用于将文件从文件系统的一个位置复制到另一个位置。例如，要将名为 `/tmp/schedule.txt`\
  \ 的文件复制到家目录，你需要输入 `cp /tmp/schedule.txt ~`。记住，`cp` 会创建文件的副本，因此原始文件保持完好。你可以使用 `cp`\
  \ 配合 `-R` 选项来递归复制文件。\n\n![images](img/bull.jpg) `mv` `mv` 命令将文件复制到文件系统的新位置然后删除原始文件。例如，要将名为\
  \ `mylog.txt` 的文件从 `/tmp` 移动到 `/var/log`，你需要输入 `mv /tmp/mylog.txt /var/log`。\n\n\
  目录一样，`mv` 命令也可以用于重命名文件。只需输入 `mv` 后跟要重命名的文件以及新文件名即可。例如，将 `schedule.txt` 重命名为 `schedule.old`，你需要输入\
  \ `mv schedule.txt schedule.old`。\n\n## 确定文件类型\n\n你可以在 shell 提示符使用 `file` 命令来确定文件的类型。需要理解的是，在\
  \ Linux 上不需要文件扩展名（如 `.txt`）。因此，从文件名可能无法看出你查看的是什么类型的文件。\n\n可以在 shell 提示符使用 `file`\
  \ 命令来获取文件信息。命令的输出不仅会告诉你通的文件类型（如目录、命名管道、链接等），还可以为你提供有关文件的详细信息。为了实现这一点，它会将命令中指定的文件与\
  \ `/usr/share/misc/magic`、`/usr/share/misc/magic.mgc` 和 `/etc/magic` 中包含的文件签名进行比较。\n\
  \n在下一个示例中，你可以看到 `file` 命令已将我家目录下的 `words` 文件识别为 ASCII 文本文件，而 `resources` 文件是一个 [OpenOffice.org](http://www.openoffice.org)\
  \ 文档：\n\n![Images](img/p0108-01.jpg)\n\n到目前，我们主要在 Linux 文件系统中处理文件、目录和别名。然而，还有第四种被频繁使用的\
  \ Linux 文件，你对它需要熟悉。这些文件被称为*链接*（links）。让我们接着讨论一下它们是如何工作的。\n\n## 链接文件操作\n\n正如我们在在本章前面讨论的那样，Linux\
  \ 文件系统支持一种名为*链接文件*（link file）的文件类型。链接文件不像普通文件那样包含内容。相反，它们是重定向器，指向文件系统中的另一个不同的文件或目录。在\
  \ Linux 上，你可以创建两种类型的链接文件：\n\n![images](img/bull.jpg) `Hard` 硬链接是一个直接指向另一个文件 `inode`\
  \ 的文件。`inode` 存储 Linux 文件系统中文件的基本信息，包括其大小、设备、所有者和权限。因为两个文件使用同一个 `inode`，所以硬创建硬链接后，你实际上无法判断哪个文件是指针，哪个是被指向的对象。这就像两个文件是同一个文件，尽管它们可能存在文件系统的不同位置。\n\
  \n![images](img/bull.jpg) `Symbolic` 符号链接（软链接）也指向文件系统中的另一个文件。然而，符号链接有自己的 `inode`。因为指针文件有自己的\
  \ `inode`，文件系统中的指针和被指向的对象可以很容易识别。例如，在前一章中，你看到 `/usr/bin/vi` 文件实际上是一个指向 `/bin/vim`\
  \ 文件的符号链接。如下例所示：\n\n![Images](img/p0109-01.jpg)\n\n要创建链接文件，你使用 `ln` 命令。语法为 `ln pointe_file\
  \ pointer_file`。在不使用任何选项的情况下使用 `ln` 会创建一个硬链接。如果你想创建一个符号链接，请使用 `-s` 选项。在接下来的示例中，使用\
  \ `ln` 命令在我用户家目录的 `bin` 子目录下名为 `myapp` 的文件与位于 `/var/opt` 的名为 `myapp` 的可执行文件之间创建一个符号链接：\n\
  \n![Images](img/p0109-02.jpg)\n\n使用 `ls -l` 命令，你可以看到 `myapp` 实际上指向 `/var/opt/myapp`\
  \ 可执行文件。如果 `/var/opt/myapp` 程序是你需要经常使用的，这可能是一个非常有用的技巧。因为 `/var/opt` 目录不在我用户的 `PATH`\
  \ 环境变量中，每次我想运行它时都需要提供 `myapp` 可执行文件的完整路径（或者先切换到 `/var/opt` 目录）。然而，我家目录的 `bin` 子目录由我的\
  \ bash 配置文件自动添加到 `PATH` 环境变量。通过将符号链接放在此目录，我只需在 shell 提示符输入 `myapp` 即可运行 `/var/opt/myapp`\
  \ 可执行文件。符号链接文件将 shell 重定向到 `/var/opt` 中适当的文件并从那里运行。如前面的示例所示。\n\n***\n\n![Images](img/note.jpg)\n\
  \n**注意** 在第 6 章 中，我们将讨论符号链接在 init 进程初始化你的 Linux 系统时至关重要的作用。\n\n让我们在下面的练习中练习管理文件。\n\
  \n   4-3：管理文件和目录\n\n在此练习中，你将使用 shell 命令管理文件和目录。你可以使用随书附的虚拟机进行此练习。运行快照 4-1 以获得配置正确的环境。\n\
  \n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 4-3 视频，演示如何执行此任务。\n\n完成以下操作：\n\
  \n**1.** 在你的 Linux 系统运行并以 `student` 用户身份通过后，打开终端会话，并在 shell 提示符输入 `cd` 切换到你的家目录。\n\
  \n**2.** 通过输入 `mkdir MyFiles` 在你的家目录中创建一个新目录。\n\n**3.** 输入 `ls` 并验证新目录是否存在。\n\n\
  **4.** 输入 `touch ~/MyFiles/myfile.txt` 在 MyFiles 目录中创建一个名为 `myfile.txt` 的新文件。\n\n\
  **5.** 输入 `ls ~/MyFiles` 并验证文件是否存在。\n\n**6.** 输入 `su -` 切换到你的 root 账户并输入密码 `student`。\n\
  \n**7.** 输入 `cat /var/log/messages | more` 查看你的系统日志文件。\n\n**8.** 翻页文件的几页，然后按 CTRL-C\
  \ 跳回到 shell 提示符。\n\n**9.** 输入 `tail /var/log/messages` 查看日志文件的最后几条记录。\n\n**10.**\
  \ 在停止和启动服务时通过以下操作监控你的 /var/log/messages 日志文件：\n\n**a.** 在 shell 提示符处输入 `tail -f\
  \ /var/log/messages`。你应该看到日志文件现在正被 tail 监控。\n\n**b.** 打开一个新的终端窗口，使用 `su -` 命令和你的\
  \ root 用户密码切换到 root 用户账户。\n\n**c.** 在 shell 提示符处输入 `ifdown enp0s3` 禁用你的系统网卡。\n\n\
  **d.** 切换到运行 tail 的终端会话。当网卡被禁用时，你应该看到文件中添加了新行。\n\n**e.** 回到第二个 shell 提示符并输入 `systemctl\
  \ restart network`。再次，当网卡在第一个终端窗口中重新启用时，你应该看到文件中添加了新行。\n\n**f.** 输入两次 `exit` 关闭第二个终端窗口。\n\
  \n\n\n\n\ng. 切换到运行着 `tail` 的终端会话，并按下 CTRL-C 退出 tail。\n\n11. 输入 `exit` 回到你的普通用户账户。\n\
  \n12. 输入 `rm –r ~/MyFiles` 删除你主目录下的 `MyFiles` 目录。\n\n13. 输入 `ls` 验证该目录及其内容已删除。\n\
  \n14. 输入 `cp –R ~ /tmp` 将你的主目录下的文件和子目录复制到 `/tmp`。\n\n15. 输入 `ls /tmp` 查看 `/tmp`\
  \ 的内容。验证你的主目录已成功复制。\n\n16. 通过以下步骤操作符号链接：\n\na. 输入 `ln –s /usr/share/doc/ ~/docs`\
  \ 创建从你主目录下名为 `docs` 的目录指向 `/usr/share/doc` 目录的符号链接。\n\nb. 输入 `ls –l`。验证 `docs` 文件指向\
  \ `/usr/share/doc/`。\n\nc. 输入 `cd docs`。\n\nd. 输入 `pwd`。你现在哪个目录？\n\ne. 输入 `ls`。尽管你仍在\
  \ `~/docs` 中，但你应该能看到 `/usr/share/doc/` 的内容。\n\n### 在文件中查找内容\n\n在本章稍早之前，我们讨论了用于在文件系统中搜索文件的\
  \ shell 命令。然而，Linux 还提供了一个名为 `grep` 的工具，你可以用它搜索文件*内部*的特定内容。`grep` 工具极其有用；事实上，我敢说绝大多数\
  \ Linux 运维员每天都会使用它。使用 `grep`，你可以在一个文件中搜索特定的文本字符串。当你想要在一个巨大的日志文件中搜索特定消息，或者当需要在配置文件中找到特定指令时，这会非常派用用。你甚至可以使用\
  \ `grep` 同时搜索多个文件以定位某个特定表达式。\n\n要使用 `grep`，你需要在 shell 提示符下输入 `grep *search_expression\
  \ file_name`。例如，假设你想在 `/var/log/messages` 文件中搜索与 Linux 系统上运行的 VNC 服务相关的任何日志条目。你将输入\
  \ `grep vnc /var/log/messages`。`grep` 工具将显示文件中包含你搜索词的每一行，如下所示：\n\n![Images](img/p0111-01.jpg)\n\
  \n同样，如果你需要在 `/etc/ntp.conf` 文件中找到包含“server”指令的行，你可以在 shell 提示符下输入 `grep server /etc/ntp.conf`。下例所示所示：\n\
  \n![Images](img/p0111-02.jpg)\n\n![Images](img/p0112-01.jpg)\n\n在命令行中使用 `grep` 时，你可以使用以下选项：\n\
  \n![images](img/bull.jpg) `–i` 搜索文本时忽略大小写。\n\n![images](img/bull.jpg) `–l` 仅显示包含匹配文本的文件名。它不显示实际的匹配行。\n\
  \n![images](img/bull.jpg) `–n` 显示匹配的行号。\n\n![images](img/bull.jpg) `–r` 递归搜索指定路径的子目录。\n\
  \n![images](img/bull.jpg) `–v` 显示所有*不包含*搜索字符串的行。\n\n当你需要在文件中搜索特定的文本字符串时，`grep` 工具效果非常好。然而，有时你可能需要搜索更复杂的模式。在这种情况下，你可以使用\
  \ `egrep` 命令代替。\n\n***\n\n![Images](img/note.jpg)\n\n**注意** `egrep` 命令等同于使用 `grep\
  \ –E` 命令。\n\n`egrep` 的主要优势是它可以搜索文件中的扩展*正则表达式*，这些正则表达式是由元字符和字面量组成的字符串。*字面量*是普通字母（A–Z,\
  \ a–z）和数字。*元字符*是指不代表自身而代表其他字符的字符。它们也可以用于指定字符在文本字符串中的位置。一些常用的正则表达式列在表 4-6 中。欲更多信息请参阅\
  \ `regex(7)` 手页。\n\n![Images](img/t0113-01.jpg)\n\n**表 4-6** 正则表达式\n\n除了 `egrep`\
  \ 之外，你还可以使用 `fgrep`（固定字符串 grep）工具搜索文件中的内容。`fgrep` 工具搜索文件中匹配固定字符串的行。与 `egrep` 不同，它不执行正则表达式搜索。相反，`fgrep`\
  \ 使用直接字符串比较来找到输入中的匹配文本行。语法为 `fgrep *pattern filename*`。例如，运行 `fgrep server *.c`\
  \ 命令会在当前目录下所有扩展名为“.c”的文件中搜索字符串“server”。\n\n***\n\n![Images](img/note.jpg)\n\n**注意**\
  \ 运行 `fgrep` 等同于运行 `grep –F`。在使用正则表达式时，包含 `*` 或 `?` 通配符的文本（例如 `*.c`）被称为*文件通配模式*。\n\
  \n让我们在下面的练习中练习 Linux 搜索工具。\n\n### 练习 4-4：使用 grep\n\n在此练习中，你将练习使用 Linux 搜索工具。你可以使用书中附虚拟机进行此练习。运行快照\
  \ 4-1 以获得配置正确的环境。\n\n***\n\n![Imags](img/viedo.jpg)\n\n**视频** 请观看练习 4-4 视频以演示如何执行此任务。\n\
  \n完成以下操作：\n\n1. 在 Linux 系统运行并以 `student` 用户身份通过验证的情况下，在 shell 提示符下输入 `su –` 然后输入密码\
  \ `student` 切换到 root。\n\n2. 输入 `grep ifup /var/log messages` 在你的系统日志文件中查找 `inittab`\
  \ 文件的引用。从 `grep` 的输出中你可以学到关于 `ifup` 的什么？\n\n3. 在 shell 提示符下输入 `egrep systemd /var/log/messages`，使用\
  \ `egrep` 在你的系统日志文件中查找关于 `systemd` 守护进程的信息。\n\n4. 在 shell 提示符下输入 `egrep enp0s[0-3]\
  \ /var/log/messages`，再次使用 `egrep` 查找系统中安装的所有以太网接口的信息。\n\n5. 在 shell 提示符下输入 `egrep\
  \ Enabled$ /var/log/messages`，查找你的系统日志文件中所有以“Enabled”结尾的行。\n\n你现在是一个文件系统专家了！当你知道这么多时，必须保持谦虚！\n\
  \n### 本章总结\n\n在本章中，我们回顾了与管理 Linux 文件系统相关的各种主题。我在本章开始时向你介绍了 Linux 文件系统。首先，我区分了通用文件系统和特定的磁盘文件系统（如\
  \ Reiser 或 `ext4`）。然后我指出 Linux 文件系统的作用是组织数据，使其能够被易地定位和检索，并可靠地保存。\n\n随后我提到 Linux\
  \ 使用分级文件系统。该层次结构的顶层目录是根目录（/）。我们讨论了文件系统层次结构（FHS）中指定的典型 Linux 系统使用的各种标准目录。这些包括：\n\n\
  - `/bin`\n- `/boot`\n- `/dev`\n- `/etc`\n- `/home`\n- `/lib`\n- `/media`\n- `/mnt`\n\
  - `/opt`\n- `/proc`\n- `/root`\n- `/sbin`\n- `/srv`\n- `/sys`\n- `/tmp`\n- `/usr`\n\
  - `/var`\n\n我们还讨论了 Linux 系统使用的四种类型的文件：普通文件、链接、FIFO 和套接字。\n\n有了这些背景信息，我们将注意力转向常见的\
  \ Linux 文件系统任务。我强调，尽管这些任务大部分可以使用图形化工具完成，但 LPIC-1/Linux+ 考试期望你了解如何从 shell 提示符完成它们。\n\
  \n\n\n\n\n我们首先讨论了可以用于在 Linux 文件系统中搜索文件或目录的工具。我们回顾了如何使用 `find` 和 `locate` 命令来查找特定的文件或目录。我指出，`find`\
  \ 是通过手动遍历文件系统层级来执行搜索的，这可能有些慢。作为替代方案，`locate` 工具在文件系统中创建了一个文件数据库。当你使用 `locate` 进行搜索时，它查询的是数据库，而不是遍历文件系统层级，这速度要快得多。\n\
  \n我还指出，你可以使用 `which` 命令来查找系统实用工具（如 `ls`、`cp` 和 `man`）的可执行文件在系统中的位置。我们还查看了 `whereis`\
  \ 命令，它可以显示特定 shell 命令的可执行文件、源文件和帮助页文件（man page file）的位置。我们还回顾了如何使用 `file` 命令来确定文件的类型。我们还讨论了如何使用\
  \ `type` 命令来确定在命令行输入命令时，执行的是哪种类型的命令。\n\n接下来，我们回顾了如何使用 `pwd` 和 `cd` 命令在 Linux 文件系统中进行导航。然后我们讨论了如何管理文件和目录。我指出，你可以使用\
  \ `touch` 命令创建新文件。你也可以使用 `mkdir` 命令创建新目录。\n\n我们还回顾了可以用于删除文件和目录的工具，包括 `rmdir` 和 `rm`。要复制和移动文件及目录，你可以使用\
  \ `cp` 和 `mv` 工具。我指出，`mv` 也可以用于重命名文件或目录。我们还讨论了链接文件。我提到链接文件指向文件系统中的其他文件或目录，并联系此说明你可以使用\
  \ `ln` 命令创建硬链接或符号链接。\n\n然后我们讨论了可以在屏幕上查看文本文件内容的工具。我指出你可以使用 `cat`、`less`、`head` 或\
  \ `tail` 来执行此操作。我还指出，你可以配合 `tail` 命令的 `–f` 选项来监控文本文件（如日志文件）产生的变化。我们通过讨论如何使用 `grep`\
  \ 查找文本文件中的内容来结束本章的介绍。\n\n## 加速复习\n\n![images](img/bull.jpg) 文件系统的作用是存储和组织数据，以便能够方便地定位和检索。\n\
  \n![images](img/bull.jpg) `file` 命令显示文件的类型。\n\n![images](img/bull.jpg) `type` 命令识别在命令行输入的命令类型。\n\
  \n![images](img/bull.jpg) 文件系统还必须保持数据的完整性。\n\n![images](img/bull.jpg) Linux 使用分层结构的文件系统。\n\
  \n![images](img/bull.jpg) Linux 文件系统层级基于文件系统层级标准（FHS）。\n\n![images](img/bull.jpg)\
  \ 最顶目录是 `/`。\n\n![images](img/bull.jpg) 其他标准目录创建在 `/` 下，并服务于 FHS 定义的功能。\n\n![images](img/bull.jpg)\
  \ Linux 文件系统使用普通文件、链接、FIFO（命名队列）和套接字（sockets）。\n\n![images](img/bull.jpg) 大多数文件系统管理任务可以使用图形界面或命令行工具完成。\n\
  \n![images](img/bull.jpg) 你可以使用 `find` 工具定位文件系统中的文件或目录。\n\n![images](img/bull.jpg)\
  \ `find` 工具手动遍历文件系统层级以搜索文件。\n\n![images](img/bull.jpg) 你可以使用 `locate` 搜索文件或目录。\n\
  \n![images](img/bull.jpg) `locate` 工具维护着文件系统中所有文件的数据库。\n\n![images](img/bull.jpg)\
  \ 当 `locate` 执行搜索时，它搜索的是数据库而不是文件系统。\n\n![images](img/bull.jpg) `which` 命令用于显示文件系统中文件的位置。\n\
  \n![images](img/bull.jpg) `whereis` 命令显示关于命令的可执行文件、源代码文件和帮助页文件的信息。\n\n![images](img/bull.jpg)\
  \ `type` 命令显示文件的类型。\n\n![images](img/bull.jpg) `pwd` 命令用于显示当前目录。\n\n![images](img/bull.jpg)\
  \ `cd` 命令用于切换目录。\n\n![images](img/bull.jpg) `ls` 命令用于显示目录内容。\n\n![images](img/bull.jpg)\
  \ 使用带有 `–l` 选项的 `ls` 会显示文件和目录的详细信息。\n\n![images](img/bull.jpg) 使用带有 `–R` 选项的 `ls`\
  \ 会递归显示目录内容。\n\n![images](img/bull.jpg) `touch` 命令用于创建新文件。\n\n![images](img/bull.jpg)\
  \ `mkdir` 命令用于创建新目录。\n\n![images](img/bull.jpg) 你可以使用 `cat` 在屏幕上查看文本文件。\n\n![images](img/bull.jpg)\
  \ 你也可以使用 `less` 在屏幕上查看文本文件。\n\n![images](img/bull.jpg) `less` 命令一次暂停显示一行内容。\n\n\
  ![images](img/bull.jpg) `head` 命令可以显示文本文件的前几行。\n\n![images](img/bull.jpg) `tail`\
  \ 命令可以显示文本文件的最后几行。\n\n![images](img/bull.jpg) 配合 `–f` 选项使用的 `tail` 命令可以监控文本文件的变化。\n\
  \n![images](img/bull.jpg) 你可以使用 `rmdir` 删除空目录。\n\n![images](img/bull.jpg) 你可以使用\
  \ `rm` 删除非空目录或文件。\n\n![images](img/bull.jpg) `cp` 命令用于复制文件。\n\n![images](img/bull.jpg)\
  \ `mv` 命令用于移动文件。\n\n![images](img/bull.jpg) Linux 文件系统允许你创建指向文件系统中其他文件或目录的链接文件。\n\
  \n![images](img/bull.jpg) 硬链接直接指向另一个文件的 inode（索引节点）。\n\n![images](img/bull.jpg)\
  \ 符号链接有自己的 inode。\n\n![images](img/bull.jpg) 链接使用 `ln` 命令创建。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `grep` 搜索文件中的文本。\n\n## 答题\n\n**1.** 以下哪些是 Linux 文件系统的作用？（选择两个）\n\n**A.**\
  \ 创建系统数据的自动备份。\n\n**B.** 使数据易于定位。\n\n**C.** 保护数据完整性。\n\n**D.** 为用户提供命令行界面。\n\n**E.**\
  \ 为用户提供图形化用户界面。\n\n**2.** 哪个目录包含 `cp` 和 `rm` 等文件系统管理实用工具？\n\n**A.** `/bin`\n\n**B.**\
  \ `/dev`\n\n**C.** `/var`\n\n**D.** `/usr`\n\n**3.** 哪个目录是可以在访问时动态创建的伪文件系统？\n\n\
  **A.** `/var`\n\n**B.** `/opt`\n\n**C.** `/proc`\n\n**D.** `/srv`\n\n**4.** 当用于文件系统命令时，`~`\
  \ 字符代表哪个目录？\n\n**A.** `/var`\n\n**B.** 当前目录\n\n**C.** 当前用户的家目录\n\n**D.** root 家目录\n\
  \n**5.** 你需要生成 `/var` 目录下的文件和目录列表，包括子目录中的文件。哪个命令可以实现此目标？\n\n**A.** `ls /var`\n\n\
  **B.** `ls –l /var`\n\n**C.** `ls –f /var`\n\n**D.** `ls –R /var`\n\n**6.** 你需要查看\
  \ `/var/xinetd.log` 文件的最后几行。执行此操作的最佳命令是？\n\n**A.** `tail /var/xinetd.log`\n\n**B.**\
  \ `cat /var/xinetd.log |more`\n\n**C.** `head /var/xinetd.log`\n\n**D.** `less /var/xinetd.log`\n\
  \n**7.** 你需要删除用户家目录下的 `Temp` 目录。考虑到 `Temp` 中有文件，执行此操作的最佳命令是？\n\n**A.** `rmdir Temp`\n\
  \n**B.** `rmdir ~/Temp`\n\n**C.** `rm Temp`\n\n**D.** `rm –r ~/Temp`\n\n**8.** 你需要将用户家目录下的\
  \ `Documents` 目录复制到 `/tmp` 目录。考虑到 `Documents` 包含文件和子目录，执行此操作的正确命令是？\n\n**A.** `cp\
  \ ~/Documents /tmp`\n\n**B.** `cp –R ~/Documents /tmp`\n\n**C.** `cp ~/Documents\
  \ ~/tmp`\n\n**D.** `cp –R ~/Documents ~/tmp`\n\n**9.** 你想在家目录下创建一个符号链接，将手动文件到 `/usr/share/doc/manual`\
  \ 目录。执行此操作的正确命令是？\n\n**A.** `ln –s /usr/share/doc/manual ~/manual`\n\n**B.** `ln\
  \ /usr/share/doc/manual ~/manual`\n\n**C.** `ln –s ~/manual /usr/share/doc/manual`\n\
  \n**D.** `ln ~/manual /usr/share/doc/manual`\n\n\n\n\n\n# 10.** 你需要在 Linux 文件系统的某处找到一个名为\
  \ `myfile.txt` 的文件。哪一个命令是正确的？\n\n**A.** `find / –name “myfile.txt\"`\n\n**B.** `find\
  \ “myfile.txt\"`\n\n**C.** `find / –n myfile.txt`\n\n**D.** `find –name “myfile.txt\"\
  `\n\n# 11.** 你需要在 `/var/log/messages` 文件中找到所有包含“scsi”术的条目。哪一个命令是正确的？\n\n**A.** `grep\
  \ /var/log/messages “scsi”`\n\n**B.** `grep -find “scsi” /var/log/messages`\n\n\
  **C.** `grep /var/log/messages scsi`\n\n**D.** `grep scsi /var/log/messages`\n\n\
  ### 答案\n\n**1. B** 和 **C.** 文件系统的作用是让数据易于定位并保持其完整性。\n\n**2. A.** 文件系统实用程序位于 `/bin`。\n\
  \n**3. C.** `/proc` 文件系统是一个伪文件系统。\n\n**4. C.** `~` 字符指向当前用户的家目录。\n\n**5. D.** `ls\
  \ –R /var` 命令将生成 `/var` 及其子目录的列表。\n\n**6. A.** `tail` 工具是显示文件最后几行的最佳选择。\n\n**7.\
  \ D.** `rm –r` 命令将删除 `Temp` 目录及其内容。\n\n**8. B.** `cp –R~/Documents/tmp` 命令将数据从你用户家目录下的\
  \ `Documents` 目录递归复制到 `/tmp` 目录。\n\n**9. A.** `ln –s/usr/share/doc/manual~/manual`\
  \ 命令创建一个从家目录中的手册文件到 `/usr/share/doc/manual` 目录的符号链接。\n\n**10. A.** `find / –name\
  \ “myfile.txt”` 命令使用了正确的语法。\n\n**11. D.** `grep scsi /var/log/messages` 命令使用了正确的语法。\n\
  \n# 第 5 章\n\n## 安装 Linux\n\n在本章中，你将学习到：\n\n• 设计 Linux 安装\n• 安装 Linux\n• 配置语言区域设置\n\
  • 配置时区设置\n\n为了获得 LPIC-1/Linux+ 认证，你需要了解如何对 Linux 发行版进行纯净安装。Linux 极其灵活，可以在你的组织中承担各种角色。因此，在安装操作系统时，你需要做出许多重要的决定。大多数\
  \ Linux 发行版都希望你在开始安装之前已经对 Linux 系统有坚实的的理解。\n\n在过去的几年里，Linux 的安装已经变得极其简单得多。20 世纪\
  \ 90 年代中期提供的发行版安装可能非常有挑战性。硬件支持有限；安装向导（如果有的话）非常原始。我第一次在 90 年代中期安装 Linux 发行版时，在完成之前我甚至想过一脚踢穿显示器。解决所有的问题需要需要整整两天。\n\
  \n幸运的是，大多数现代 Linux 发行版都采用了易用的图形化安装向导来协助安装过程。\n\n为了正确安装 Linux，你需要在实际开始安装过程*之前*花些时间规划安装。因此，本章将开始讨论如何规划一个新的\
  \ Linux 系统。\n\n### 设计 Linux 安装\n\n如果你正在阅读这本书，你可能是一个*技术宅（techie）*。你热爱计算机，对新技术并不感到畏惧。你喜欢研究硬件和软件的新创新并对其进行实验。你一周中最亮眼的时刻就是当那辆大棕色送货车到达你的工作地点，送下一批新硬件时。你会快乐地连续几天加班，脸上带着大大的笑容，让一切都就绪并运行。我也经历过这些，朋友；我理解你的这种喜悦。\n\
  \n***\n\n### Linux 安装程序与 LPIC-1/Linux+ 考试\n\n由于实施新 Linux 系统有正确和错误的方法之分，在 LPIC-1/Linux+\
  \ 考试中，你将被要求非常熟悉 Linux 安装主题。考试的大约 20% 将由 Linux 安装和包管理问题组成。考试将期望你熟悉部署规划主题，而不仅仅是安装过程本身。\n\
  \nCompTIA 和 LPIC 遇到的问题之一是各种 Linux 发行版所使用的安装程序种类多样。LPIC-1/Linux+ 考试无法涵盖所有它们。考试要求你熟悉所有它们也是不合理的。发行版太多了。因此，你需要熟悉所有发行版都通用的通用安装概念和任务。\n\
  \n我们在书中也既没有时间也没有空间来涵盖所有发行版的安装。写那将将是场噩梦！所以，我将只选择一个发行版，并专注于安装 openSUSE。然而，你在这里通过安装\
  \ openSUSE 学到的原理可以毫不困难地转移到其他发行版。\n\n***\n\n当一个技术宅可以很有趣。然而，技术宅以具有的一系列共同特征而闻名，包括以下这些：\n\
  \n![images](img/bull.jpg) *技术宅从不读任何东西的文档*。自己去实验并弄出来要有趣得多。况况，我们已经知道自己在做什么了，对吧？\n\n\
  ![images](img/bull.jpg) *技术宅讨厌在纸上计划任何事情，特别是硬件或软件部署*。这剥夺了玩所有那些酷新东西的乐趣。况且，一切都在我们脑子里，对吧？\n\
  \n![images](img/bull.jpg) *技术宅讨厌记录任何东西*。多年后东西坏了时，我们会记得我们做的吗？\n\n在部署 Linux（或任何其他系统）时，你必须克服这些倾向并用正确的方法。如果你不改变习惯，你将会花费大量时间修复错误。如果你坚持下去，你还将花费大量时间写简历。\n\
  \n如果你是在家里或实验室的测试系统上工作，通常可以以技术宅的方式处理。出错可能没有真正的风险。事实上，这是一个很棒的学习体验。在时间允许的情况下，我强烈建议这样做，因为你可以学到很多。\n\
  \n然而，当你要在组织的生产环境中部署系统时，技术宅的方法是完全不可接受的。你的错误会导致系统停机。停机会让你的组织损失时间和金钱，并可能让你丢掉工作。与其以杂乱、无结构的方式部署系统，你应该在开始购买硬件和软件*之前*制定部署计划。这将帮助你避免昂贵的错误（并可能保住你的工作）。\n\
  \n作为我自己自认的技术宅，我知道这个过程可能是多么痛苦。当被要求部署 Linux 系统时，你的第一冲动是去硬件供应商的网站开始购买。抵制这种冲动！如果你能遵循本章列出的流程，并在购买硬件和软件之前真正*规划*实施，那么对你和后续跟随你的人来说都会很顺利。\n\
  \n\n\n\n你觉得这没什么大碍吗？考虑一下：那个小组以及我所在小组的所有关键数据都保存在这台服务器上。这些数据代表了数千小时的工作成果，价值数百万美元。我的团队中没有人对此想过哪怕一秒钟，直到几年后，我们发现公司的信息系统团队根本不知道网络上竟然存在过这台服务器。没有人对这台服务器上的数据进行过任何一次备份。没有人为它连接过不间断电源（UPS）。没有人负责操作系统的补丁更新。没有人管理系统的安全。（他们就让它静地放在一个空置的隔间里。）数百万美元的信息完全没有受到保护。从电源线路进入的一次微小电压浪值，就可能完全摧毁我们多年来工作的所有成果，且无法恢复。此外，只有一个人拥有管理员账户的密码。如果他辞职或被裁员，我们也将失去对系统的管理访问权限。\n\
  \n这个故事中的故障点在哪里？这台新服务器没有制定任何实施计划。如果有人规划了部署，他们会在服务器安装之前注意到这些问题并据此制定相应的计划。\n\n在本章的这部分，我们将讨论如何规划\
  \ Linux 安装。将涉及以下主题：\n\n- ![images](img/bull.jpg) 进行需求评估\n- ![images](img/bull.jpg)\
  \ 选择发行版\n- ![images](img/bull.jpg) 验证系统要求和硬件兼容性\n- ![images](img/bull.jpg) 规划文件系统\n\
  - ![images](img/bull.jpg) 选择软件包\n- ![images](img/bull.jpg) 识别用户账户\n- ![images](img/bull.jpg)\
  \ 收集网络信息\n- ![images](img/bull.jpg) 选择安装源\n\n任何部署计划的第一步都是进行需求评估。让我们接下来讨论这个主题。\n\n\
  ## 进行需求评估\n\n进行需求评估是创建 Linux 部署计划最重要的方面之一。它也是最经常被跳过的步骤。遗憾的是，即使执行了它，通常也做得不好。\n\n\
  那么，需求评估到底是什么呢？它是确定*为什么要*进行 Linux 部署、期望得到*什么*结果以及预计*什么时候*完成的过程。完成需求评估将要求你摘下技术人员的帽子，戴上项目经理的帽子。\n\
  \n在这个角色上，你将需要与各种个人会面，并收集有关部署的数据。是的，这意味着你必须与“碳基生命体”打交道。你可以的！我信任你！你的发现应该记录在一个文字处理文档中，以便他人分发和审查。当你完成后，部署计划中的需求评估部分至少应包含以下信息：\n\
  \n- ![images](img/bull.jpg) *项目目标是什么？* 你应该查明为什么要要求进行实施。这次安装将解决什么问题？实施的最终结果将是什么？通过这次实施将实现哪些组织目标？当你列出项目目标时，务必使用清晰且可衡量的语言。\n\
  \n### 案例研究\n\n在确定目标时，务必与所有相关人员交谈。如果不这样做，你就无法获得对预期的清晰认识，并且可能无法实现某个特定目标。让我给你举个例子。几年前，我受一家金融机构的委托，在其新的总部部署一台\
  \ Linux 服务器，并实施所有必要的布线以为每位员工的办公室提供网络连接。在进行需求评估时，我花了大量时间采访了其中一位老板。完成后，我觉得自己对他们想要什么有了相当充实的了解。\n\
  \n简而言之，我为办公室布了线，然后实施了 Linux 服务器。我对部署过程的顺畅感到非常满意。正当我收拾东西准备离开时，老板走进服务器房，递给我一张光盘，里面有一个流行的网络财务会计软件应用程序。他告诉我，他的员工需要使用这个软件来完成日常工作。当我查看系统要求并发现它需要\
  \ Windows 服务器时，我不禁倒吸了一口气。\n\n我哪里错了？我没有花时间与办公室里将使用新服务器的员工交谈。只和一个人说话是不够的。在最初进行需求评估采访他时，老板并不知道需要这个特定的软件包。如果他早点知道，我就可以在计划中考虑到这个软件，我那天晚上就能准时回家了。\n\
  \n- ![images](img/bull.jpg) *该项目的利益相关者是谁？* 作为需求评估的一部分，你应该识别出所有将以某种方式受项目影响的个人。你应该问以下问题：\n\
  \n- ![images](img/bull.jpg) 谁请求了新系统？\n- ![images](img/bull.jpg) 安装后谁将使用该系统？\n- ![images](img/bull.jpg)\
  \ 谁有权批准该项目的资金？\n- ![images](img/bull.jpg) 谁有权将你的时间分配到该项目中？\n- ![images](img/bull.jpg)\
  \ 在项目开始之前谁必须对该项目给予最终批准？\n- ![images](img/bull.jpg) 系统实施后谁将维护和支持系统？\n- ![images](img/bull.jpg)\
  \ 新系统是否与公司的当前技术环境和战略方向相匹配？\n\n这些是在你开始任何项目之前必须回答的关键问题。你会惊讶于你的公司里有多少员工会试图绕过既定政策，试图让你在没有适当批准的情况下工作。\n\
  \n不要犯这样的错误：仅仅因为有人要求你做某事，就假设项目已经获得批准和资金支持。（相信我，这种情况经常发生。）如果你识别了项目的所有利益相关者，你就可以在下单之前确保项目已获得批准并分配了必要的资金。\n\
  \n- ![images](img/bull.jpg) *什么时候需要系统？* 你应该问的关键问题是项目何时完成。在为项目制定进度之前，你需要知道利益相关者预计何时完成。\n\
  \n通过在需求评估中收集这些数据，你可以定义安装计划中最关键的组件之一：*项目范围*定义了具体*做什么*、*什么时候*以及由*谁*来做。如果你以前管理过项目，你就知道每个项目都是以下元素之间的三方拉锯：\n\
  \n- ![images](img/bull.jpg) 进度\n- ![images](img/bull.jpg) 资源\n- ![images](img/bull.jpg)\
  \ 规模\n\n这种微妙的平衡显示在图 5-1。\n\n![Images](img/f0126-01.jpg)\n\n**图 5-1** 项目范围中的进度、资源和规模\n\
  \n要成功管理任何项目，你必须保持这三个元素的平衡。如果进度过短，你需要增加分配给项目的资源数量或缩小项目的规模。例如，假设你的安装项目涉及部署 300 台 Linux\
  \ 桌面，而你是分配给项目的唯一资源。只要进度允许足够的时间，你就可以完成任务。但如果进度规定项目必须在一周内完成，你可能需要为项目增加资源、减少项目中包含的桌面数量，或者消除你吃饭和睡觉的生理需求。\n\
  \n\n\n\n我将这种关系称为“项目管理的三脚凳”。如果一把三脚凳的三条腿长度不一，凳子就会不平衡。项目管理也是如此。如果你的进度、规模和资源得不到平衡，项目很可能会以某种方式失败。\n\
  \n在我职业生涯的大部分时间里，我都负责管理项目，这个类比在很多时候都非常有用。这里存在的问题是，你的项目赞助人可能希望你在不切实际的时间和资源过少的情况下，完成完成远超可行范围的工作。\n\
  \n在职业生涯早期，我想要给经理们留个深刻印象，因此经常同意接受那些涉及不可能参数的项目。这并不是明智之举。持续的压力和长时间加班会对你的健康造成巨大的损害。因此，我学到了你必须据此回击，以使这三个参数达到平衡。我发现，使用像图\
  \ 5-1 所示的简单图表或使用三脚凳的类比，是向项目赞助人传达平衡需求的非常有效的工具。\n\n使用项目管理软件对于帮助你精确计算项目需要多长时间非常有帮助。通过项目管理软件，你可以将特定任务分配给特定资源并指定持续时间。此外，你可以定义\
  \ `dependencies`（依赖关系），用于指定哪些任务必须在其他任务开始之前完成。带有依赖关系的示例项目如图 5-2 所示。\n\n![Images](img/f0126-02.jpg)\n\
  \n**图 5-2** 使用项目管理软件规划项目并定义依赖关系\n\n项目管理软件的伟大之处在于它可以为你计算计算进度。通过输入任务和持续时间，然后将其与特定资源相关联，你可以轻松地看到项目需要多长时间。你还可以调整各种参数（记住那三脚凳）来查看效果如何。例如，你可以为项目添加额外的资源，并查看它对整体进度的影响。你还可以看到指定每天工作\
  \ 9 小时而非 8 小时产生的影响。\n\n然而，在操作你的项目时，请务必运用常识。我遇到过许多项目经理，当他们看到通过调整各种参数可以大幅缩短项目进度时，他们会非常兴奋。然而，他们所做的调整并不现实。例如，你确实可以通过为所有相关资源指定每天工作\
  \ 18 小时来缩短项目进度。但大多数人无法长时间工作那么多小时。家庭生活会受到影响，个人健康会损害，职业倦怠会出现，生产力随之暴跌。简而言之，要对你的进度进行现实检查。记住，在纸面上看起来很好的东西在现实生活中可能行不通。\n\
  \n一旦定义了项目范围，你就可以准备进入项目计划中的下一个组件了。让我们接下来来讨论选择发行版。\n\n## 选择发行版\n\n正如我们在书中前面讨论的那样，Linux\
  \ 有许多被称为 `distributions`（发行版）的变体。你部署计划的关键部分之一是指定你将在系统上使用这些发行版中的哪一个。哪一个最好？取决于你的偏好以及你希望系统做什么。以下是你可以使用的一些指南，帮助你选择合适的发行版。\n\
  \n### 系统是作为工作站还是服务器运行？\n\nLinux 的酷之处之一是，你可以将几乎任何发行版实现为工作站或服务器。这在操作系统中是独一无二。大多数操作系统被设计为仅作为服务器或工作站，而不可兼顾。相反，大多数\
  \ Linux 发行版都可以胜任这两个角色。\n\n然而，请注意，某些 Linux 发行版是专门设计并优化以作为服务器运行的，而另一些则是为工作站设计的。例如，Red\
  \ Hat 提供了 `Red Hat Enterprise Linux` 发行版，它专为为服务器利用率极中大型组织提供网络服务而设计。\n\nRed Hat 还提供了两个针对桌面系统的发行版：\n\
  \n![images.jpg] **Red Hat Enterprise Linux** 专为为服务器利用率极中大型组织提供网络服务而设计\n\n![images.jpg]\
  \ **Red Hat Enterprise Linux Desktop** 专为普通桌面用户设计\n\n![images.jpg] **Red Hat Enterprise\
  \ Linux Workstation** 专为工程师和设计师等高级用户设计\n\n此外，Red Hat 还提供一个发行版，经过优化以使软件开发尽可能快速进行：\n\
  \n![images.jpg] **Red Hat Enterprise Linux Developer** 专为编写应用程序的软件开发者设计\n\n同样，Novell\
  \ 销售两个版本的 SUSE：\n\n![images.jpg] **SUSE Enterprise Server** 专为极大型的服务器系统设计\n\n![images.jpg]\
  \ **SUSE Enterprise Desktop** 专为桌面用户设计\n\n还有一些基于标准 PC 硬件的特定用途发行版。例如，你可以使用 `Untangle`\
  \ 等发行版创建 Linux 防火墙。\n\n### 发行版提供支持吗？\n\n有些供应商为其 Linux 发行版提供支持，另一些则提供有限支持或完全没有支持。如果系统将在环境中使用，你应该实施有良好支持的发行版。如果系统在安装后出现问题，你需要能够解决问题并尽快恢复生产。你没有时间在互联网上寻找解决方案。\n\
  \n请注意，虽然发行版本身可能是免费的或几乎免费的，但你可能为技术支持付费。费用因供应商而异，因此货比价格。\n\n目前行业内对于同一厂商发行版之间的差异存在很多困惑。通常一个版本是免费的，另一个则收费。例如，你可以购买\
  \ `Red Hat Enterprise Linux Desktop`，也可以免费下载 `Fedora`。一个关键区别是支持。如果你购买了 `Red Hat\
  \ Enterprise Linux Desktop`，你有权获得 Red Hat 的技术支持。支付得越多，获得的支持越好。如果你下载免费版本，你必须通过网站、论坛和新闻组自行支持。\n\
  \n为了节省你辛苦赚的钱，我们在书中使用 `Fedora`、`openSUSE` 和 `Ubuntu`。但是，如果你要在生产环境中部署它，我强烈建议考虑受支持的\
  \ Linux 版本。\n\n\n\n\n不惜一切也要克制这种冲动！在下载或购买 Linux 发行版之前，你需要确保它真的可以在你的硬件上运行。我合作过的许多系统管理员都忽略了这一过程。事实上，我承认自己也做过这样做。这是一种糟糕的做法，你几乎肯定会在某个时刻遇到“我早该如此”的尴尬局面。这是因为你最终可能会获得与你的操作系统不兼容的硬件。当这种情况发生时，你的项目进度将面临风险，许多人会对你感到不满。退货和重新订单硬件可能花费大量时间。如果发生这种情况，你就得花大把在主管的办公室里解释为什么项目进度落后了。\n\
  \n在本主题中，我们将讨论两种可以防止这种情况发生的处理方法：\n\n![images](img/bull.jpg) 检查硬件兼容性\n\n![images](img/bull.jpg)\
  \ 验证系统要求\n\n让我们先讨论硬件兼容性。\n\n## 检查硬件兼容性\n\n在 Linux 早期，硬件兼容性是一个问题，特别是当你尝试在笔记本电脑或其他带有许多专有硬件的系统中安装\
  \ Linux 时。当时没有足够的开发者来编写 Linux 驱动程序。如果你在带有常用硬件组件的通用系统上安装 Linux，通常可以成功安装并使其正常运行。然而，如果你的系统使用了非典型的或专有的硬件（例如高端显卡），那么你可能无法让\
  \ Linux 正常运行。\n\n在那个时代，大多数硬件供应商并不为他们的设备提供 Linux 设备驱动程序。他们没有将 Linux 视为一种广泛使用的操作系统，也不愿意投入时间和精力为它开发设备驱动程序。相反，你必须依靠世界上某处开发者的善意来为你的特定硬件编写驱动程序。如果你的设备没有驱动程序，你就只能倒霉了。\n\
  \n今天，这个问题不再那么严重了。大多数供应商现在为他们的硬件提供了 Linux 版本的驱动程序。此外，大多数常用 PC 硬件的驱动程序现在包含在各种 Linux\
  \ 发行版中了。\n\n然而，为了安全起见，检查发行版的网站并验证你的系统硬件是否列在发行版的硬件兼容性列表（`HCL`）上仍然是一个好主意。尽管在过去的十年里，Linux\
  \ 的硬件支持有了很大提高，但仍然有一些设备不受支持。一个很好的例子是许多笔记本系统中使用的集成无线网络接口。Linux 对这类硬件的支持参差不齐。你可以使用你发行版的\
  \ `HCL` 来验证你的系统设备是否受支持。\n\n`HCLs` 通常可以在两个地方找到。首先，大多数发行版在安装 DVD 的一个文本文件中包含了支持的硬件列表。然而，我很少使用这个版本的\
  \ `HCL`。因为它是一个静态文档，自磁盘镜像创建以来就没有更新过。如果你计算机中的某个设备在磁盘镜像创建之后发布，你完全不知道它是否受支持。\n\n相反，我更倾向于使用在大多数发行版网站上维护的\
  \ `HCL`。这个版本的 `HCL` 通常包含受支持硬件的最新数据。例如，如果你选择在系统上安装 openSUSE 发行版，可以使用网络浏览器访问其 [`en.opensuse.org/Hardware`](http://en.opensuse.org/Hardware)\
  \  `HCL`。在那里，你可以搜索特定的系统硬件并查看它是否受支持。在图 5-3 中，显示了显卡的 openSUSE `HCL`。\n\n![Images](img/f0130-01.jpg)\n\
  \n**图 5-3** 使用 openSUSE HCL\n\n如果你选择使用 Red Hat 发行版，同样可以在 Red Hat 网站（[`access.redhat.com/search/browse/certified-hardware#?`](https://access.redhat.com/search/browse/certified-hardware#?)）上检查\
  \ `HCL` 以验证你的系统硬件是否受支持。\n\n大多数发行版在其网站上都包含某种 `HCL`，但并不是所有的。某些发行版供应商没有时间或资源进行广泛的硬件测试，以验证市场上提供的各种\
  \ PC 设备。\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 程序的可用性是我在生产环境中倾向于使用知名、支持良好的\
  \ Linux 发行版的原因之一。当然，我会在家里或工作中的实验室环境中尝试支持不佳的发行版。如果出现问题，在这种情况下不会损失任何东西。然而，作为生产环境中的\
  \ Linux 系统管理员，我的核心角色之一是保护数据并确保系统以最高效率运行。在这种情况下，我需要知道我的硬件是受支持的。我负担不起在互联网上到处寻找驱动程序，也不想浪费时间去排除一个运行不稳定的系统故障。\n\
  \n除了检查 `HCL` 之外，你还需要检查你发行版的系统要求。让我们下一个讨论这个问题。\n\n## 验证系统要求\n\n在 Linux 早期，我们并不太担心各种发行版的系统要求。那是因为早期版本的\
  \ Linux 可以在极低配置的硬件上运行。它们不需要大量的内存、磁盘空间或处理能力。\n\n然而，随着 Linux 多年来的成熟，大多数发行版现在开始需要更强劲的系统硬件来提供可接受的性能。你如何知道系统要求是什么？再次检查你的发行版供应商的网站。\n\
  \n在制定部署计划时，务必指定你选择的发行版所需的硬件。\n\n系统要求的一个关键方面是你 PC 的 CPU 架构。在下载 Linux 发行版时，确保你为系统的\
  \ CPU 选择了正确的架构。多年来，我们并不太担心这个问题，因为我们实际上只处理一种架构：英特尔 32 位 `x86` 架构。虽然大多数早期发行版都有 `x86`\
  \ 和 `Alpha` CPU 架构，但普通的系统管理员并没有多少 `Alpha`get。我们处理的几乎每个系统运行在 `x86` 架构的某种变体上。\n\n\
  然而，今天我们作为系统管理员有了更多的硬件选择。我们仍然拥有经典的 `x86` 和 `Alpha` 架构，但还有更新的 64 位 `x86` 架构。此外，英特尔生产了其\
  \ Itanium CPU 使用的 `IA-64` 架构。每种架构都需要不同版本的 Linux。事实上，许多 Linux 发行版甚至被移植到适用于苹果计算机的\
  \ Power PC (`PPC`) 架构。其他发行版还适用于 IBM 的 `iSeries`、`pSeries` 和 `RS/6000` 服务器。现在甚至有\
  \ Linux 版本被移植到适用于平板设备的 `ARM` 架构。\n\n重要的点是确保你为你的发行版选择了合适的架构。例如，如果你选择 Ubuntu 作为你的发行版并在互联网上访问该发行版的下载页面，你会在图\
  \ 5-4 中看到选项。\n\n![Images](img/f0131-01.jpg)\n\n**图 5-4** Ubuntu 架构\n\n无论你选择哪种发行版，请确保下载适用于你系统架构的正确版本。例如，如果你要在一个带有\
  \ 32 位 CPU 的系统上安装 Linux，你需要该发行版的 `x86` (32 位) 版本。如果你的硬件使用 64 位 CPU，你需要该发行版的 `x86-64`\
  \ (64 位) 版本。如果你选错了，大多数 Linux 安装程序将生成一个错误，你将无法完成安装。\n\n\n\n\n\n在解决了硬件问题之后，你现在可以进入计划的下一个部分，在其中你将指定如何配置\
  \ Linux 文件系统。让我们接着讨论这个主题。\n\n## 文件系统规划\n\n在规划 Linux 实现方案时，你需要包含关于文件系统如何在系统硬盘驱动器上创建和维护的规范。这是\
  \ Linux 操作系统的另一个独特之处。在实现其他操作系统（如微软 Windows）时，你通常只创建一个磁盘分区，并使用 `NTFS` 文件系统对其进行格式化。\n\
  \n然而，通过 Linux，你有更多的选择。你可以自定义磁盘的分区方式以及使用哪种文件系统。在本章的这部分，我们将讨论以下内容：\n\n![images](img/bull.jpg)\
  \ 选择文件系统\n![images](img/bull.jpg) 规划你的分区\n\n让我们从讨论文件系统开始。\n\n### 选择文件系统\n\n由于你是一个技术人员，你已经知道硬盘驱动器的工作原理了。硬盘由多个铝制盘片组成，每个盘片有两个读写头，用于读取和写入数据。在执行磁盘\
  \ I/O 操作时，操作系统需要知道数据存储在哪里、如何访问它，以及在哪里写入新信息是安全的。\n\n这就是`file 系统`的工作，它能可靠地将数据存储在硬盘上，并将其组织成易于访问的形式。当你使用文件浏览器浏览硬盘驱动器上的目录并打开一个文件时，是文件系统让整个过程成为可能。\n\
  \n大多数 Linux 发行版都提供了多种文件系统供你选择。在这个主题中，我们将回顾一些最广泛使用的类型：\n\n![images](img/bull.jpg)\
  \ ext2\n![images](img/bull.jpg) ext3\n![images](img/bull.jpg) Reiser\n![images](img/bull.jpg)\
  \ ext4\n![images](img/bull.jpg) btrfs\n\n![Images](img/note.jpg)\n\n**注意** 你也可以在\
  \ Linux 中使用许多其他文件系统。例如，你可以使用 Silicon Graphics 的 `XFS` 文件系统。你甚至可以使用 `VFAT` 或 `NTFS`\
  \ 文件系统，尽管 `NTFS` 的支持尚未完全完善。我们将在第 10 章中讨论创建 `VFAT` 和 `XFS` 文件系统。\n\n让我们从讨论 `ext2`\
  \ 文件系统开始。\n\n**ext2** `ext2` 文件系统是可用的最老的 Linux 文件系统之一。`ext2` 缩写代表“第二个扩展文件系统”（Second\
  \ Extended File System）。它最初于 1993 年引入，`ext2` 使用大多数其他文件系统标准的层级方式存储数据。数据存储在文件中；文件存储在目录中。一个目录可以包含文件或其他目录（子目录）。\n\
  \n`ext2` 文件系统支持的最大文件大小为 2TB（太字节）。`ext2` 卷最大可达 4TB。文件名长度可达 255 个字符。`ext2` 文件系统支持\
  \ Linux 文件系统用户、组和权限（称为 `POSIX` 权限）。它还支持文件压缩。\n\n`ext2` 文件系统是一个极佳的文件系统。它存在的时间足够长，其大多数\
  \ Bug 都已经解决了。事实上，它可能是以来实现的应用最广泛的 Linux 文件系统。它还被誉为可用最快的 Linux 文件系统。\n\n然而，`ext2`\
  \ 有一个关键的缺点，这导致了其他文件系统的开发。事实是，如果系统突然关闭，`ext2` 需要很长时间才能进行恢复。在关闭 Linux 系统时，操作系统会先干净地卸载文件系统，确保在系统关闭之前所有待处理的文件系统事务都已写入磁盘。\n\
  \n当系统在没有完成此干净卸载程序的情况下停止时，问题就出现了。\n\n（注：原文后续部分似乎存在逻辑重复或断句，译文已根据原文内容进行对应翻译）\n\n\n\n\
  \n\n# ext4\n`ext4` 文件系统于 2008 年底发布。正如你可能猜到的，`ext4`（第四代扩展文件系统）是 `ext3` 的更新版本。正如 `ext3`\
  \ 与 `ext2` 兼容一样，`ext4` 也兼容 `ext3`（当然也兼容 `ext2`）。`ext4` 文件系统支持大小高达 1 EB（艾字节）的卷和大小高达\
  \ 16 TB（太字节）的文件。在 `ext4` 文件系统中最多可以拥有四十亿文件。与 `ext2` 和 `ext3` 一样，文件或目录名称的最大长度为 255\
  \ 个字符。`ext4` 还使用校验和来验证日志文件本身。这有助于提高系统的可靠性，因为日志文件是磁盘上最频繁的文件之一。如你所见，`ext4` 相比 `ext3`\
  \ 和 Reiser 实现了重大的飞跃。\n\n# btrfs\n`btrfs`（读作“butter-fs”）是一种较新的 Linux 文件系统，代表了文件系统在组织和保护数据方式上的演进飞跃。`Btrfs`\
  \ 是一种“写时复制”（copy-on-write）文件系统，与 Novell 产品中的 NSS 文件系统以及最新版本 Windows 中的 Storage Space\
  \ 技术非常相似。\n\n通过使用写时复制技术，`btrfs` 提供了早期文件系统中不具备的几个新功能：\n\n![images](img/bull.jpg)\
  \ 存储池\n\n![images](img/bull.jpg) 快照\n\n`btrfs` 文件系统为传统的创建磁盘分区过程提供了替代方案。相反，你从系统中的存储设备创建存储池。从存储池中，你可以为特定的存储卷分配空间。你不是挂载分区，而是将存储卷挂载到文件系统的挂载点。这为你在系统上分配空间时提供了极大的灵活性。例如，假设\
  \ `/home` 卷的空间不足了。要增加容量，你只需要在系统中安装一块新硬盘，然后将其空间分配给存放 `/home` 卷的池即可。当你这样做时，卷的大小会自动增加。你不需要像传统分区那样备份数据并恢复数据。\n\
  \n`btrfs` 提供的快照功能可以保护你的数据。本质上，它可以配置为按指定间隔对数据进行快照，并将其保存在独立的介质上。如果文件发生丢失或损坏，你可以从保存的快照中获取文件的之前的版本，并在几秒钟内恢复。\n\
  \n大多数发行版都允许你在安装过程中为系统硬盘分区时，选择你想要实现的文件系统。在到达那一步之前，你应该已经知道想使用哪种文件系统。因此，在规划你的 Linux\
  \ 实现时，你应该在部署计划中指定你想使用这些文件系统中的哪一个。\n\n那么你应该使用哪种文件系统呢？这取决于你的个人喜好和部署的需求。多年来我的选择是 Reiser\
  \ 文件系统。然而，最近 `ext4` 是我首选的文件系统。\n\n除了指定将使用哪种文件系统外，你还需要在部署计划中指定如何划分系统的硬盘。接下来让我们讨论如何实现。\n\
  \n## 规划你的分区\n`partition`（分区）是硬盘的逻辑划分。通过使用硬盘内部的读写头，分区工具可以在磁盘盘片上创建磁性划分，将其划分为不同的区域。硬盘可以有一个包含整个硬盘的单一分区，也可以有多个分区。\n\
  \n对于 Linux 系统，你将至少使用两个分区，但你可以创建更多。这些分区需要在系统初始安装期间定义。在系统安装后更改磁盘分区是可行的，但具有一定的挑战性且耗时。因此，最佳实践是在开始安装过程之前规划好如何划分你的系统硬盘。\n\
  \n默认情况下，大多数 Linux 发行版在安装过程中建议两个分区，如图 5-5\n\n**图 5-5** 默认 Linux 分区\n\n![images](img/bull.jpg)\
  \ **swap** 此分区供 Linux 操作系统作虚拟内存。本质上，Linux 使用 `swap` 分区包含的硬盘空间，就像它是系统 RAM 一样。当系统\
  \ RAM 负载过重时，操作系统可以将加载到 RAM 但当前未使用的信息移动到 `swap` 分区中。这被称为 `swapping`（交换），即将一个内存页移动到硬盘上预配置的\
  \ `swap` 分区的过程。\n\n当再次需要这些数据时，它们将从 `swap` 分区移回 RAM。本质上，这允许系统同时运行比物理 RAM 所支持的更多的程序。\n\
  \n`swap` 分区的合适大小取决于系统的使用情况。对于桌面系统，通用的经验法是使用大小约为系统 RAM 两倍的 `swap` 分区。这是因为桌面系统通常运行大量可以轻松交换到磁盘的应用程序。例如，如果你的桌面安装了\
  \ 2GB 的 RAM，你应该有一个大小约为 4GB 的 `swap` 分区。对于服务器系统，你通常不需要这么多交换空间。通常，一个大小与安装的 RAM 相似的\
  \ `swap` 分区就足够了。\n\n***\n\n![Images](img/tip.jpg)\n\n**提示** 你也可以在 Linux 中使用 `swap`\
  \ 文件而不是 `swap` 分区。我们将在第 10 章中讨论如何实现。\n\n![images](img/bull.jpg) / 此分区挂载在根目录。所有用户数据、程序、日志文件和配置文件都包含在这个单一分区中。\n\
  \n尽管这是 Linux 发行版在安装期间提出的默认分区建议，但你应该考虑创建比生成的两个或三个更多的分区。要理解我们为什么要这样做，首先需要理解 Linux\
  \ 使用单一文件系统结构来表示所有可用存储空间。这如图 5-6](#ch5.html_ch5fig6）所示。\n\n![Images](img/f0137-01.jpg)\n\
  \n**图 5-6** Linux 文件层次结构\n\n不同的分区可以挂载在此层次结构的不同点上。例如，在图 5-7 中，在系统的第一个 SATA 硬盘（`/dev/sda`）上创建了一个额外分区（`/dev/sda3`），它挂载在\
  \ `/home` 目录。\n\n![Images](img/f0137-02.jpg)\n\n**图 5-7** 在 /home 中挂载 /dev/sda3\n\
  \n当你浏览 Linux 文件层次结构并双击 `/home` 目录时，你实际上被重定向到了硬盘上的另一个分区。如果你系统中存在多个硬盘，你甚至可以将挂载在 `/home`\
  \ 的分区放在完全不同的硬盘上。分区对用户来说是完全透明的。\n\n我鼓励你在规划 Linux 分区时，在硬盘上创建许多分区。这样做可以为你的 Linux 系统增加某种容错能力。一个分区中遇到的问题将与系统的其他分区隔离。例如，假设你在安装\
  \ Linux 时使用了默认的分区建议，并将整个文件系统挂载在根目录（`/`）下。如果用户通过向其 `/home` 中的家目录拷贝大文件耗尽了分区上的所有可用空间，可能会导致整个系统崩溃，因为操作系统将无法向磁盘写入关键的系统文件。\n\
  \n\n\n\n另一方面，如果你为 `/home` 创建一个独立的分区，并且用户再次通过向其家目录拷贝非常大的文件而耗尽了 `/home` 分区的所有可用磁盘空间，系统仍将保持运行。包含系统文件、日志文件和应用程序文件的分区不会受到影响，因为问题被隔离在单个分区上。\n\
  \n在规划 Linux 分区时，你应该考虑为表 5-1 中列出的目录创建独立的分区。\n\n![Images](img/t0139-01.jpg)\n\n**表\
  \ 5-1** 推荐的 Linux 分区\n\n* * *\n\n![Images](img/caution.jpg)\n\n**注意** `/boot` 分区必须创建在硬盘的前\
  \ 1,024 个磁道内。为了安全起见，我总是会在创建此分区时使其从 0 号磁道开始。\n\n使用这些推荐的分区会为你的系统增加稳定性。遗憾的是，这种分区方案并没有有效地利用磁盘空间。例如，你的\
  \ `/home` 分区可能会耗尽空间，导致用户无法保存额外数据，尽管磁盘上的其他分区可能有大量的空闲空间。然而，增加的稳定性这种这种低效的。我经常听人们说硬盘是廉价的，而数据是无价的，我认为这是正确的。\n\
  \n一旦你规划好了分区，需要完成的下一个任务就是指定你想在 Linux 系统上安装的软件。让我们接下来讨论如何实现这一点。\n\n### 选择软件包\n\n我绝对非常喜欢\
  \ Linux 的点之一是它提供了丰富的开源软件。你的 Linux 发行版可能包含了非常广泛的软件包样本，你可以指定这些软件包与操作系统一起安装。事实上，正是由于包含了这些额外软件，才让你的安装包变得如此大。大多数发行版需要一张完整的\
  \ DVD 来存储所有你可以安装的软件包。\n\n* * *\n\n### 案例研究\n\n几年前，我收到一个客户的电话，称他们的 Linux 服务器运行不正常，办公室里的人都无法访问文件。不言多说，他当时陷入了恐慌。经过调查，我发现控制系统日志轮转的配置文件中有几处错误。结果是，多年没有任何系统日志文件进行过轮转！系统日志文件变得非常大，耗尽了硬盘上所有的剩余空间。\n\
  \n这种情况下的问题是双重性的。首先，任何自定义日志轮转配置的人在离开并让其运行之前，应该验证它是否真的在工作。其次，服务器使用了默认的磁盘分区方案，即一个交换\
  \ 分区和一个挂载在 `/` 的第二个分区。如果原始实施者曾为 `/var` 目录（大多数系统日志文件存储的地方）创建一个独立的分区，那么故障就会被隔离在该分区中，用户仍然可以进行工作。\n\
  \n* * *\n\n当你第一次看到可用软件列表时，你会被迷住的。例如，openSUSE 仅游戏就提供了许多不同的游戏供你安装，如图 5-8 所示。\n\n![Images](img/f0140-01.jpg)\n\
  \n**图 5-8** 在 openSUSE Linux 中安装软件包\n\n作为一名技术人员，你可能忍不住安装几乎所有的东西。免费软件！然而，你不应该这样做。你将安装非常强大的软件，而你可能并不希望你的终端用户访问这些软件。例如，你可能不希望终端用户从他们的桌面托管自己的网站，只因为你在他们的系统上安装了\
  \ Apache 服务器。更重要的是，在这些系统上安装多余的软件可能会开启隐藏的访问途径，从而产生安全问题。\n\n一个更好的方法是使用你的部署计划来确定系统将扮演的角色。（我们在本章节前面的部分讨论过如何这样做。）有了这些信息后，检查你发行版中提供的软件包，并精确指定你需要在安装中包含哪些软件包。通用的准则是：只安装完成工作任务所需的软件，多余的不要安装。\n\
  \n例如，如果系统将作为一个提供域名身份验证、文件和打印服务的网络服务器，你将安装 `Samba` 和 `CUPS`（通用 UNIX 打印系统）软件包。如果它是一个作为\
  \ Web 和电子邮件服务器的网络服务器，你可能需要安装 `Apache`、`Tomcat`、`Postfix` 和 `IMAP` 软件包。如果系统将用作桌面系统，你可能想要安装\
  \ `OpenOffice.org` 来为终端用户提供文字处理、电子表格和演示文稿软件。\n\n这一点在于：确保你安装了所需的软件包，并避免安装不需要的软件。如果在安装系统后，你确定需要额外的软件包，可以之后轻松安装它们。我将在第\
  \ 8 章向你展示如何这样做。\n\n大多数图形化 Linux 安装程序的优点之一是，它们会自动为你计算依赖项。依赖项是另一个软件包运行所需的特定软件包。你在安装过程中安装的大多数\
  \ Linux 软件包都会关联许多依赖项。\n\n在 Linux 早期，你必须手动弄清楚哪些软件包具有什么依赖项，并确保将它们包含在安装中。由于层层堆叠的依赖关系，这可能会变得非常混乱，如图\
  \ 5-9 所示。\n\n![Images](img/f0141-01.jpg)\n\n**图 5-9** 无止尽的软件包依赖链\n\n好消息是，大多数发行版使用的安装程序现在会自动为你计算依赖项，并将依赖包包含在安装中。\n\
  \n一旦完成了这部分的规划，你接下来需要指定要在系统中创建的用户。\n\n### 识别用户账户\n\nLinux 是一个真正的多用户操作系统。这意味着一个系统可以包含多个用户账户。事实上，多个用户可以通过网络连接同时使用同一个系统。\n\
  \n\n\n\n当你安装 Linux 时，系统会提示你为 `root` 用户账户提供密码。你还将获得在系统上创建额外用户账户的机会。在你的部署计划中，请指定你计划创建哪些用户账户。与软件包一样，如果在安装完成后以后需要添加或删除用户账户，这并不是问题。Linux\
  \ 提供了一系列强大的工具来管理用户账户和密码。我将在第 9 章中向你展示如何操作。\n\n一旦这些信息进入你的计划中，你就可以进行下一步：收集网络信息。接下来让我们回顾一下如何操作。\n\
  \n## 收集网络信息\n\n在当今的网络世界中，你将处理的大多数 Linux 系统可能连接到某种类型的计算机网络。因此，在开始安装之前，你需要收集系统连接到网络所需的网络信息，并将其包含在你的部署计划中。以下是你需要回答的问题列表：\n\
  \n![images](img/bull.jpg) 系统的网络配置将是动态分配的，还是需要手动配置？如今大多数 IP 网络都使用动态主机配置协议（DHCP）服务器在工作站接入网络启动时，动态为其分配\
  \ IP 地址和各种其他网络参数。大多数作为桌面工作站运行的 Linux 系统可能都会使用此选项。如果是这样，你不需要做太多工作来配置网络参数。系统每次启动时，信息都会动态分配给系统。\n\
  \n然而，如果 Linux 系统将在网络中作为服务器运行，则你不应该使用 DHCP 动态分配网络配置信息。使用 DHCP，系统每次启动时可能会接收到不同的 IP\
  \ 地址。虽然这对工作站没有害，但会给服务器带来大量问题。因此，网络服务器通常被分配一个不变化的静态 IP 地址。\n\n如果你的系统需要分配静态 IP 地址，你需要收集以下参数：\n\
  \n![images](img/bull.jpg) IP 地址\n\n![images](img/bull.jpg) 子网掩码\n\n![images](img/bull.jpg)\
  \ 路由器地址\n\n![images](img/bull.jpg) DNS 服务器地址（地址）\n\n![images](img/bull.jpg) 系统将分配什么主机名？每个\
  \ Linux 系统都需要分配一个主机名。该主机名在你的网络上应该是唯一的，这意味着网络上的其他其他系统不应具有相同的主机名。在安装过程中，系统会提示你提供主机名。\n\
  \n![images](img/bull.jpg) 系统将所在的 DNS 域名名称是什么？很有可能，你的组织有自己的 DNS 域名，例如 `mycorp.com`。在安装过程中，你会被要求提供组织的域名。\n\
  \n![images](img/bull.jpg) 系统是否需要配置主机防火墙？大多数 Linux 发行版都包含一个主机防火墙，它在安装过程中默认启用。主机防火墙对于你组织的安全来说是无价的资产。基本上，主机防火墙防止网络上的其他系统与该系统建立连接。\n\
  \n对于工作站系统，你应该启用此防火墙并阻塞所有的 IP 端口和服务。你也应该在服务器系统上启用主机防火墙。然而，大多数服务器系统运行着为网络上其他主机提供网络服务的应用程序。因此，你需要在防火墙中打开必要的\
  \ IP 端口，允许网络主机连接到关联的服务。\n\n如果你正在安装服务器系统，你应该在部署计划中列出它将提供的网络服务以及它们相关的端口号。此列表将为你提供在防火墙配置中进行必要排除的信息。例如，如果你正在安装一个将作为\
  \ Web 服务器运行的 Linux 系统，你需要在主机防火墙中打开 `80` 和 `443` 端口，以允许客户端连接到系统上运行的 `httpd` 服务。\n\
  \n指定了网络配置信息后，你就可以进入部署计划的最后部分：选择安装源。接下来让我们讨论如何操作。\n\n## 选择安装源\n\n大多数 Linux 发行版都为你提供了许多不同的系统安装选项。这些选项包括：\n\
  \n![images](img/bull.jpg) 从光光盘本地安装\n\n![images](img/bull.jpg) 从网络服务器远程安装\n\n![images](img/bull.jpg)\
  \ 使用 VNC 完成远程安装\n\n让我们先讨论如何从本地光盘完成安装。\n\n### 从光盘本地安装\n\n安装 Linux 的较常用方法之一是从一组安装光盘进行本地安装。使用这种方法，你只需将相应的光盘插入系统的光驱器中，并从光盘启动系统。\n\
  \n对于大多数发行版，你可以直接从供应商的网站下载安装光盘镜像副本。例如，如果你想安装 Fedora，可以打开浏览器并导航到 [`fedora.project.org`](http://fedora.project.org)\
  \ 并选择 Download 链接。选择你的系统架构后，你将连接到互联网上的一个包含该发行版的镜像站点。\n\n你会发现下载的文件具有 `.iso` 扩展名。这些被称为\
  \ ISO 镜像。一旦你下载了相应的 `.iso` 文件，就可以使用光盘刻录软件将 ISO 镜像刻录到物理光盘上。请检查你的文档以查看如何针对你的特定软件包进行操作。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 从互联网下载非常大的 ISO 文件后，检查 `md5sum` 校验值以确保其传输完整且没有损坏是个好习惯。我们将在第\
  \ 8 章讨论如何这样做。\n\n如果你向虚拟机安装 Linux，不需要将 ISO 镜像刻录到光盘。相反，你可以配置虚拟机直接连接到 ISO 镜像本身。虚拟机会认为该镜像是一个真实的\
  \ CD 或 DVD 并从其安装。使用这种方法安装 Linux 要快得多，因为数据存储在硬盘上而不是光盘上，且访问速度更快。\n\n除了从光盘安装外，你还可以通过网络连接远程安装\
  \ Linux。接下来让我们讨论如何操作。\n\n### 从网络服务器远程安装\n\n安装 Linux 另一种酷方法是从网络服务器安装。你可以从使用 `SMB`、`NFS`、`HTTP`\
  \ 或 `FTP` 协议配置为安装源的网络 Linux 服务器进行安装。你甚至可以直接从互联网上的 `FTP` 或 `HTTP` 服务器安装。\n\n***\n\
  \n![Images](img/note.jpg)\n\n**注意** 并不是所有的 Linux 发行版都支持网络安装。\n\n执行 Linux 网络安装的关键优势在于，你可以同时安装大量系统，而无需为每个系统刻录一张\
  \ DVD。这种方法的缺点是安装运行速度通常比 DVD 安装慢。\n\n\n\n\n\n要完成网络安装，你必须首先完成若干个准备步骤。首先，如果你打算从本地服务器通过网络进行安装，则需要将\
  \ Linux 安装文件从 DVD 复制到服务器上的目录中。或者，你也可以将 DVD 或 ISO 文件挂载到文件系统中，使网络客户端能够访问它。然后，你需要选择将用于访问该内容的协议。例如，如果你想使用\
  \ SMB 协议来访问安装文件，则必须在服务器上安装并配置 `Samba` 服务。完成后，你必须为存放安装文件的目录创建一个共享。你也可以在服务器上配置 `HTTP`、`NFS`\
  \ 或 `FTP` 服务来完成相同的任务。\n\n一旦设置了安装源服务器，你接下来需要下载一个基础的安装 CD 镜像。例如，如果你想完成 SUSE Linux\
  \ 的网络安装，你将使用浏览器访问 [`en.opensuse.org`](http://en.opensuse.org) 并选择 `Downloads` 链接。在显示的页面中，你可以下载一个网络启动镜像，如图\
  \ 5-10 所示。\n\n![Images](img/f0144-01.jpg)\n\n**图 5-10** 下载网络启动镜像\n\n你需要将此镜像刻录到光盘，然后从光盘启动系统。在本文中，我们将介绍如何使用\
  \ openSUSE 完成此操作。大多数支持网络安装的发行版也会使用类似的过程。\n\n***\n\n![Images](img/tip.jpg)\n\n**提示**\
  \ 如果你正在安装 Fedora 系统，可以从安装 DVD 上 `/images` 目录下的相应镜像文件刻录网络光盘并从其启动系统。然后你可以选择备用安装源。\n\
  \n在第一个安装屏幕上，按 `F4` 指定安装源，如图 5-11 所示。\n\n![Images](img/f0145-01.jpg)\n\n**图 5-11**\
  \ 选择安装源\n\n如果你选择 `SMB/CIFS`，必须指定安装服务器地址、安装文件所在的共享名称和目录、域名称以及访问该共享的用户名和密码。如图 5-12\
  \ 所示。\n\n![Images](img/f0145-02.jpg)\n\n**图 5-12** 使用 SMB 协议网络安装\n\n如果你选择 `FTP`，必须指定安装服务器的\
  \ IP 地址或 DNS 名称、安装文件所在的目录以及访问远程服务器 `FTP` 服务的用户名和密码。远程服务器可以是本地网络上的服务器，也可以是互联网上的 `FTP`\
  \ 服务器。查看你的发行版网站获取基于 `FTP` 的网络安装库列表。`FTP` 安装服务器配置屏幕如图 5-13\n\n**图 5-13** 使用 FTP 协议网络安装\n\
  \n如果你选择 `HTTP`，必须指定安装服务器的 URL 以及安装文件所在的远程服务器目录。与 `FTP` 安装一样，`HTTP` 安装服务器可以位于本地网络或互联网的某处。查看你的发行版网站获取基于\
  \ `HTTP` 的网络安装库。在图 5-14 中，安装程序已配置为从互联网上的 SUSE `HTTP` 服务器进行安装。\n\n![Images](img/f0146-02.jpg)\n\
  \n**图 5-14** 使用 HTTP 协议网络安装\n\n如果你选择 `NFS`，必须指定安装服务器的 IP 地址或 DNS 名称以及安装文件所在的远程服务器目录。如图\
  \ 5-15 所示。\n\n![Images](img/f0147-01.jpg)\n\n**图 5-15** 使用 NFS 协议网络安装\n\n一旦选择了安装源，从主菜单中选择\
  \ `Installation`，安装将使用远程服务器上的安装文件进行。\n\n你也可以通过 `VNC` 连接完成安装。接下来让我们看看如何操作。\n\n###\
  \ 使用 VNC 完成远程安装\n\nVNC 代表 *Virtual Network Computing*（虚拟网络计算）。本质上，VNC 允许你将视频输出重定向到另一个系统。使用\
  \ `VNC` 协议，你可以在目标系统上启动安装，然后在另一个系统上使用浏览器或 `VNC` 客户端查看安装屏幕。\n\n在许多发行版中（如 openSUSE），你可以在第一个安装屏幕的\
  \ Boot Options 字段中输入 `vnc=1`，如图 5-16 所示。\n\n![Images](img/f0147-02.jpg)\n\n**图 5-16**\
  \ 配置 VNC 安装\n\n启动安装后，系统将提示提供创建 `VNC` 连接所需的各种网络参数。安装系统加载，用于访问系统的 IP 地址将显示在屏幕上。你可以使用浏览器或\
  \ `VNC` 客户端软件远程访问安装屏幕。例如，你可以在另一个系统上打开浏览器并访问 [`*IP_address_of_system*:5801`](http://IP_address_of_system:5801)。如果在初始\
  \ `VNC` 配置屏幕中为我的系统分配了 `192.168.1.126` 的 IP 地址，我可以通过浏览器中打开 `http://192.168.1.126:5801`\
  \ 来访问它，如图 5-17 所示。\n\n![Images](img/f0148-01.jpg)\n\n**图 5-17** 在浏览器中远程完成安装\n\n\
  你也可以使用 `VNC` 客户端软件访问安装。大多数 Linux 发行版包含了 `vncviewer` 工具，你可以用它连接到 `VNC` 服务器。同样，在 Windows\
  \ 系统上，你可以使用 RealVNC 的 `VNC Viewer`。在使用 VNC viewer 工具时，你需要指定正在安装系统的 IP 地址以及你想访问的显示数字——例如，`192.168.1.126:1`。\n\
  \n通过此 `VNC` 连接，你可以在舒适的办公室完成安装过程。\n\n对于你的部署计划，你需要确定你将使用哪种安装源，并在必要时准备前提系统。\n\n一旦完成此步，你的\
  \ Linux 部署计划就完成了。你现在应该拥有所需的数据，以便以组织、高效且可衡量的方式完成安装。安装完成后，将你的部署计划存放在安全的地方。这些信息对于以后可能需要处理你系统的其他系统管理员来说将是无价的帮助。\n\
  \n\n\n\n\n在安装新系统时，我强烈建议你建立一个隔离的实验环境并在那里安装系统。这将让你有机会在正式让用户使用之前，对系统进行观察并确保一切都运行正常。\n\
  \n一旦你确定一切运行正常，就可以将它们从实验环境移动到用户的生产环境中了。\n\n正如我在本章开头提到的，可用的 Linux 发行版太多，无法将它们全部包含在\
  \ LPIC-1/Linux+ 考试或本书中。在本章中，我们将回顾如何安装 Ubuntu Desktop。\n\n### 练习 5-1：安装 Linux 系统\n\
  \n在本次练习中，我们将安装一个 Ubuntu 工作站。在本书编写时，Ubuntu 14.04 是最新版本。当你读到这里时，可能已经发布了更新版本，因此可能需要调整此处的步骤以适应更新后的软件。\n\
  \n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 5-1 视频，演示如何执行此任务。\n\n完成以下操作：\n\
  \n1. 在带有 DVD 刻录机的工作台上，打开网络浏览器并导航到 [www.ubuntu.com](http://www.ubuntu.com) 并选择 Ubuntu\
  \ Desktop。\n2. 按照网页上的指令下载适用于你 CPU 架构的最新 Ubuntu 版本。\n3. 在你的工作台上启动 `Oracle VM VirtualBox`。\n\
  4. 点击**新建** (New)。\n5. 输入以下内容，然后点击**下一步** (Next)：\n   ![images](img/bull.jpg) 名称：`Ubuntu`\n\
  \   ![images](img/bull.jpg) 类型：`Linux`\n   ![images](img/bull.jpg) 版本：（选择与下载的 ISO\
  \ 文件对应的版本。）\n6. 将内存大小设置为 `1024 MB`，然后点击**下一步** (Next)。\n7. 点击**创建** (Create)。\n\
  8. 在硬盘类型下，勾选 `VDI` 并点击**下一步** (Next)。\n9. 选择`动态分配` (Dynamically allocated)，然后点击**下一步**\
  \ (Next)。\n10. 点击**创建** (Create)。\n11. 在虚拟机列表中，点击**存储** (Storage)。\n12. 点击光驱图标，然后点击属性下的磁盘图标并**选择虚拟\
  \ CD/DVD 磁盘文件** (Choose a virtual CD/DVD disk file)。\n13. 浏览并选择你下载的 ISO 文件，然后点击**打开**\
  \ (Open) | **确定** (OK)。\n14. 点击**启动** (Start) 并等待虚拟机启动。\n15. 在安装界面上，选择你的语言然后点击**安装\
  \ Ubuntu** (Install Ubuntu)。\n16. 在“准备安装 Ubuntu”界面上，点击**继续** (Continue)。\n17. 在“安装类型”界面，选择**删除磁盘并安装\
  \ Ubuntu** (Erase disk and install Ubuntu)，然后点击**现在安装** (Install Now)。\n18. 在“您位于哪里”（Where\
  \ Are You）界面上，选择你的位置并点击**继续** (Continue)。\n19. 选择你的键盘布局和语言，然后点击**继续** (Continue)。\n\
  20. 在“您是谁”（Who Are You）界面上，输入以下内容并点击**继续** (Continue)：\n   ![images](img/bull.jpg)\
  \ 你的姓名\n   ![images](img/bull.jpg) 计算机名称\n   ![images](img/bull.jpg) 用户名\n   ![images](img/bull.jpg)\
  \ 你的密码\n21. 等待系统安装。\n22. 当提示系统需要重启以完成安装时，点击**现在重启** (Restart Now)。\n23. 当提示移除安装盘时，按下\
  \ `ENTER` 键。\n\n恭喜！你现在拥有了一个运行中的 Linux 系统。在接下来的书籍内容中，你将学习如何配置和管理该系统。\n\n### 配置区域语言设置\
  \ (Locale Settings)\n\n在安装 Linux 系统时，你通常会在安装过程中配置系统的*区域设置*（locale）。系统的区域设置决定了以下内容：\n\
  \n![images](img/bull.jpg) 屏幕上显示的文本的语言和编码\n![images](img/bull.jpg) 你的字符类\n![images](img/bull.jpg)\
  \ 默认排序顺序\n![images](img/bull.jpg) 默认数字格式\n![images](img/bull.jpg) 默认货币格式\n![images](img/bull.jpg)\
  \ 日期和时间的显示方式\n\n你的区域设置由分配给以下环境变量的值：\n\n- `LC_CTYPE` 配置默认字符类型和编码\n- `LC_MESSAGES`\
  \ 配置自然语言消息\n- `LC_COLLATE` 配置你的排序规则\n- `LC_NUMERIC` 配置数字格式\n- `LC_MONETARY` 配置货币格式\n\
  - `LC_TIME` 配置日期和时间显示\n- `LC_PAPER` 配置纸张大小\n- `LC_NAME` 配置默认名称\n- `LC_ADDRESS` 配置默认地址\n\
  - `LC_TELEPHONE` 配置默认电话\n- `LC_MEASUREMENT` 配置默认单位\n- `LC_ALL` 覆盖所有其他变量\n- `LANG`\
  \ 指定所有变量的默认区域设置\n\n`LC_CTYPE` 变量可以使用 `language_territory.codeset@modifier` 语法赋值。\n\
  \n该语法使用这些值：\n- `language`：指定使用的 ISO 639 语言代码（小写）\n- `territory`：指定使用的 ISO 3166 国家代码（大写）\n\
  - `codeset`：指定要使用的字符集\n- `modifier`：指定其他区域设置属性，例如方言\n\n考虑以下示例：\n- `en_US`：美国英语的语言和地区\n\
  - `en_CA`：加拿大英语的语言和地区\n- `fr_CA`：法语法语的语言和地区\n\n你也可以在区域设置中指定编码。例如，你可以使用 `en_US.UTF-8`\
  \ 来配置具有 Unicode 编码的美国英语区域设置。\n\n当你安装 Linux 系统时，系统会根据你在安装过程中的选择自动为你定义区域设置。要在 Shell\
  \ 提示符下查看它们，你可以使用 `echo` 命令。这是一个示例：\n\n```\necho\n```\n![Images](img/p152-01.jpg)\n\
  \n正如示例所示，`LC_CTYPE` 变量在系统安装期间被填充了。该变量定义了系统上使用的默认字符类型和编码。如你所见，该系统使用 Unicode 编码的美国英语区域设置。\n\
  \n顺便提一下，你也可以使用名为 C 的区域设置。如果你在 Shell 提示符下创建很多脚本，这个区域设置非常有用。它配置了以下默认区域设置：\n- ASCII\
  \ 编码\n- POSIX 字符类\n- 美国英语的时间、日期、数字和货币格式\n\n如果由于某些原因，你需要将 Linux 系统本地化为安装时配置的默认区域设置设置，你只需更改相应环境变量的值。通常，所有这些变量将设置为相同的值（或使用\
  \ `LC_ALL` 或 `LANG` 变量来指定所有变量的默认区域设置）。但是，如果有必要，你也可以独立地将它们设置为不同的值。\n\n但如果你这样做，请注意并非所有的\
  \ LC_ 变量优先级都相同。Linux 使用以下规则来确定使用哪个区域设置：\n\n1. 如果定义了 `LC_ALL` 变量，则使用其值，且不检查分配给所有其他\
  \ LC_ 变量的值。\n2. 如果 `LC_ALL` 未定义，检查特定的 LC_ 变量。如果特定的 LC_ 变量有值，则使用该值。\n\n\n\n\n\n**3.\
  \ 如果涉及的 `LC_` 变量为空值，则将使用 `LANG` 环境变量。**\n\n如果你希望所有的 `LC_` 变量都使用相同的值，可以设置 `LC_ALL`\
  \ 变量，从而消除设置每个单独变量的必要。然而，如果你想为不同的 `LC_` 变量使用不同的值，必须先将 `LC_ALL` 设置为空值。事实上，许多发行版正因为这个原因而未定义\
  \ `LC_ALL`。相反，它们通过设置 `LC_CTYPE` 的值来定义默认编码，并设置 `LANG` 的值来为你所有其他 `LC_` 变量提供默认值。但是，由于\
  \ `LANG` 的优先级是第三，你可以手动设置 `LC_` 变量的值而不影响任何其他 `LC_` 变量。\n\n要查看你所有的当前区域（locale）设置，请在\
  \ shell 提示符处输入 `/usr/bin/locale` 命令。这是一个示例：\n\n![Images](img/p0152-02.jpg)\n\n在这个示例中，只有\
  \ `LANG` 和 `LC_CTYPE` 变量实际上被定义了。其他的 `LC_` 变量会自动填充分配给 `LANG` 的值。\n\n你也可以在 shell 提示符处输入\
  \ `locale charmap` 来查看使用的编码类型。这是一个示例：\n\n![Images](img/p0153-02.jpg)\n\n如果你需要通过更改区域或编码来本地化系统，你首先必须确定系统上安装了哪些区域。要做到这一点，请使用\
  \ `locale` 命令配合 `-a` 选项来生成所有可用区域的列表。你也可以使用 `locale` 命令配合 `-m` 选项来查看可用编码的列表。例如所示：\n\
  \n![Images](img/p0153-03.jpg)\n\n请注意，如果你更改了系统使用的编码，如果某些文件是使用不同的编码创建的，可能会在正确查看它们时遇到困难。你可以在\
  \ shell 提示符处使用 `iconv` 命令将编码从一种编码转换为新编码。语法如下：\n\n![Images](img/p0153-04.jpg)\n\n\
  除了配置 Linux 系统的区域外，你可能还需要配置系统的时区设置。让我们接下来看看是如何操作的。\n\n## 配置时区设置\n\n如果 Linux 系统被移动到不同的物理位置，你可能需要配置时区设置以及本地设置。这在表面上似乎很简单。然而，Linux\
  \ 系统上的时间管理方式与你熟悉的其他操作系统不同。在本章的这部分，我们将回顾以下主题：\n\n![images](img/bull.jpg) Linux 时间工作原理\n\
  \n![images](img/bull.jpg) 配置时区\n\n### Linux 时间工作原理\n\n在 Linux 上管理时区之前，你需要了解 Linux\
  \ 时间是如何工作的。你首先需要理解的是 Linux 系统有两个主钟：\n\n![images](img/bull.jpg) **硬件计时** 这个时钟始终独立运行，即使在系统关机时也是。硬件计时有许多名称，包括实时时钟\
  \ (RTC) 或 BIOS/CMOS Clock。\n\n* * *\n\n![Images](img/tip.jpg)\n\n**提示** 你可以在 shell\
  \ 提示符处使用 `hwclock` 命令设置硬件时钟的时间。\n\n![images](img/bull.jpg) **系统时间** 这个时钟通过 Linux\
  \ 内核内部的软件运行。它由 ISA 定器中断驱动。系统时间测量为自 UTC 1970 年 1 月 1 日 00:00:00 以来的秒数。\n\n需要记住的关键点是，硬件时钟和系统时间可能不一致。在管理\
  \ Linux 系统时，我们更关心系统时间而不是硬件时钟报告的时间。硬件时钟的作用非常基础。它的工作是在系统关机时计时。当 Linux 操作系统启动时，系统时间会同步到硬件时钟时间。启动后，Linux\
  \ 只使用系统时间。硬件时钟被忽略。在设置硬件时钟时间时，你应该将其设置为以下值之一：\n\n![images](img/bull.jpg) **协调世界时 (UTC)**\
  \ UTC 是世界调节时间的标准。UTC 是英国伦敦格林尼治皇家天文台的当前平均太阳时。因此，UTC 也称为 *格林尼治标准时间 (GMT)*。你的本地时间是根据你距离\
  \ UTC 的每个时区差值，在 UTC 的基础上加或减一小时来决定的。例如，我距离格林尼治有七个时区，所以我的时间是 UTC –7。因此，当我的本地时间是上午\
  \ 10:58 时，UTC 是下午 5:58。如果你的硬件时钟被设置为 UTC 而不是本地时间，你需要将 `/etc/sysconfig/clock` 文件中的\
  \ `HWCLOCK` 指令设置为 `-u`。你的 Linux 系统将根据你的本地时区自动计算夏令时间偏移。\n\n* * *\n\n![Imags](img/note.jpg)\n\
  \n**注意** 对于 Linux 系统，实际上优选将硬件时钟设置为 UTC 而不是本地时间。\n\n![images](img/bull.jpg) **本地时间**\
  \ 在你遇到的大多数系统中，硬件时钟默认会被设置为本地时间。如果是这样，`/etc/sysconfig/clock` 文件中的 `HWCLOCK` 指令将设置为\
  \ `--localtime`。\n\n在处理 Linux 系统时，将硬件时钟设置为 UTC 是优选方案。使用 UTC 计算时区差变得容易得多。事实上，如果你在\
  \ Linux 系统上安装某些组协作应用程序，可能被要求将硬件时钟设置为 UTC，因为这更容易协调位于不同时区的大量计算机的时间戳。\n\n### 配置时区\n\
  \n在安装 Linux 系统期间，系统会提示指定系统所在的时区。在某些发行版（如 Ubuntu），你指定的时区保存在 `/etc/timezone` 文件中。你可以通过在\
  \ shell 提示符处使用 `cat` 命令显示文件的内容来查看系统的当前时区。例如：\n\n![Images](img/p0155-01.jpg)\n\n\
  其他发行版（如 openSUSE）则将此信息保存在 `/etc/sysconfig/clock` 文件中。文件中的 `TIMEZONE=` 指令配置了要使用的区域文件，如下：\n\
  \n```\nTIMEZONE=\"America/Boise\"\n```\n\n你也可以在 shell 提示符处输入 `date` 来查看当前时区，如下所示：\n\
  \n![Images](img/p0155-02.jpg)\n\n如果你在安装后需要更改时区，可以在 shell 提示符处使用 `tzselect` 或 `tzconfig`\
  \ 命令。基于 Debian 的发行版使用 `tzconfig` 命令，而 openSUSE 和 Fedora 等其他发行版使用 `tzselect` 命令。此命令必须以\
  \ root 身份运行。例如：\n\n![Images](img/p0155-03.jpg)\n\n`tzselect` 命令首先显示大洲和海洋的列表。输入你要切换到的时区所在区域的相应数字。输入后，将显示该区域的国家列表。输入系统所在国家的数字；然后输入相应时区的数字。系统会提示你确认时区更改，如示例所示：\n\
  \n![Images](img/p0156-02.jpg)\n\n如果更改正确，输入 `1` 确认。注意在前面的示例中，`tzselect` 通过设置 `TZ`\
  \ 环境变量的值来切换时区。实际上，你可以在 shell 提示符处通过设置并导出 `TZ` 环境变量的值，无需 `tzselect` 来更改时区。这在你没有系统\
  \ root 密码或你想在不更改其他用户使用的时区的情况下为你的账户使用不同时区时非常有用。语法为 `export TZ=*time_zone*.`。可用时区的列表可以在\
  \ `/usr/share/zoneinfo/` 目录下找到，如下：\n\n![Images](img/p0156-03.jpg)\n\n\n\n\n\n请注意，此更改不是持久性的。如果你重启系统，时区的更改将会丢失。你可以通过在用户主目录下的\
  \ `.profile` 文件中添加以下内容，使时区更改对你的用户账户持久：\n\n```bash\nexport TZ=′America/Denver′\n\
  ```\n\n你也可以使用 `/etc/localtime` 文件以及我们之前查看过的 `/usr/share/zoneinfo` 中的各种区域文件来更改时区。要做到这一点，请从\
  \ `/etc/localtime` 创建指向 `/usr/share/zoneinfo` 中相应时区文件的符号链接。例如，如果你想切换到美国山地标准时间（Mountain\
  \ Standard Time），你需要在 shell 提示符处输入 `ln –sf /usr/share/zoneinfo/MST /etc/localtime`。\n\
  \n*** *\n\n![Imags](img/note.jpg)\n\n**注意** 常用的文本编码包括 `iso8859`（也称为 Latin-9 编码），它是为西欧语言设计的；`ASCII`，它使用基于英语的字符编码方案；以及\
  \ `Unicode`，它旨在处理来自世界语言的字符集。\n\n### 章节总结\n\n在本章中，我们强调了在实施新的 Linux 系统时创建部署计划的重要性。该计划的第一个部分是进行需求评估。在进行需求评估时，你应该首先确定项目目标并识别谁是利益相关者。在实际开始项目之前，你应该获得所有相关方的批准。你应该使用在需求评估中收集的信息来制定项目范围，项目范围将准确说明项目将要完成哪些工作。项目范围包含了项目进度、分配给项目的资源以及要完成的任务范围。我指出，任何项目都涉及进度、资源和规模之间的三方平衡。其中任何一个因素的改变都会导致另外两个因素的随之改变。\n\
  \n你部署计划的下一个部分是选择一个要安装的 Linux 发行版。我强调，你必须评估系统的角色以确定最佳发行版。如果系统将为客户端系统提供网络服务，那么针对服务器功能优化的\
  \ Linux 发行版是最佳选择。如果系统将用作桌面系统，那么针对工作站功能优化的发行版是最佳选择。我还强调了技术支持的重要性。不受支持的发行版对于实验实验室系统可能是一个不错的选择，但对于将在生产环境中使用的系统，受支持的发行版是更好的选择。\n\
  \n你部署计划的下一个部分是验证你的硬件与所选的 Linux 发行版兼容。我指出，大多数发行版都包含某种类型的硬件兼容列表。你应该根据此列表检查你的硬件。你还应该验证你的硬件是否符合发行版的最低系统要求。我强调，你必须为你的\
  \ CPU 架构下载正确的发行版版本。\n\n在验证硬件之后，你接下来应该规划你的文件系统。我强调，Linux 文件系统比其他操作系统的文件系统需要更多的考虑和规划。我指出，在实施\
  \ Linux 系统时，你可以从 `ext2`、`ext3`、`Reiser` 和 `ext4` 文件系统中选择。我们讨论了每个文件系统的优缺点。我还指出，Linux\
  \ 系统中的硬盘应该有多个分区。我们讨论了交换分区（swap partition）大小的指南。我还强调，你应该考虑为 `/`、`/boot`、`/home`、`/opt`、`/tmp`、`/usr`\
  \ 和 `/var` 目录创建独立的分区。\n\n接下来，你需要指定安装在 Linux 系统上的软件。我强调，在实施 Linux 系统时，有很多软件包供你选择。然而，你应该只安装系统所需的软件。我还指出，在安装\
  \ Linux 系统时，必须考虑大多数软件包的依赖关系。\n\n在指定软件后，你的部署计划下一步应该指定在系统上需要创建哪些用户账户。我指出，所有的 Linux\
  \ 系统都有一个名为 `root` 的超级用户账户。我强调 `root` 应该仅用于管理任务。你应该创建一个额外的标准用户账户来完成日常任务。任何其他使用系统的用户也需要用户账户。\n\
  \n接下来，你需要为系统收集网络信息。你首先需要指定系统将使用静态还是动态 IP 地址分配。如果系统将使用静态地址，你需要为你的网络收集相应的 IP 地址、子网掩码、路由器地址和\
  \ DNS 服务器地址。你还需要定义系统将使用的主机名以及系统所处的 DNS 域。我还指出，大多数发行版都包含一个主机防火墙，用于防止网络上的其他系统连接到你的系统。如果系统将作为服务器运行，你需要识别需要在主机防火墙中开放哪些\
  \ IP 端口，以便网络客户端连接到系统提供的服务。\n\n接下来，你需要在部署计划中识别你的安装源。我指出，大多数系统管理员使用 DVD 安装 Linux。我们讨论了如何从\
  \ Linux 供应商的网站下载 ISO 镜像并刻录到光盘上。我还指出，安装文件可以拷贝到网络服务器，允许你通过 `SMB`、`NFS`、`HTTP` 或 `FTP`\
  \ 协议通过网络完成安装。这种策略还允许你直接从互联网上的安装仓库安装 Linux 系统。你可以使用 `VNC` 从运行在不同计算机上的网页浏览器远程安装 Linux。\n\
  \n收集这些信息后，你的部署计划就完成了。我强调，当系统以后需要维护时，手头留有文档非常有价值。有了部署计划，你就准备好安装 Linux 系统了。\n\n最后，我们练习了安装\
  \ openSUSE 系统。然后讨论了如何通过更改本地设置和时区对已安装的系统进行本地化。\n\n### 加速回顾\n\n![images](img/bull.jpg)\
