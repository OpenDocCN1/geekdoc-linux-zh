  \n表 6-1 GRUB 配置文件\n\n表 6-2 GRUB 配置文件选项\n\n一个 GRUB 的酷炫点是，你可以通过交互方式管理引导过程。而不是被困在 `menu.lst`\
  \ 或 `grub.conf` 文件中，你可以自定义你的引导过程。\n\n\n\n\n你可以使用此字段向 Linux 内核发送 GRUB 菜单项中未包含的启动选项，以自定义内核的运行方式。要执行此操作，你首先选择所需的\
  \ GRUB 菜单项，然后在“启动选项（Boot Options）”字段中输入你想要使用的适宜内核选项。例如，如果你有一个 Linux 系统由于某些未知原因不再启动，你可以使用“启动选项（Boot\
  \ Options）”字段告诉内核在启动时不要加载 `init` 进程，而是加载另一个程序。\n\n![Images](img/note.jpg)\n\n**注意**\
  \ 我们将在本章的后半部分详细讨论 `init` 进程。\n\n要做到这一点，你需要在“启动选项（Boot Options）”字段中输入 `init=*program_name`。例如，跳过加载\
  \ `init` 进程并改为加载 `bash` 终端，你需要在“启动选项”字段中输入 `init=/bin/bash`。当你启动系统时，将加载 `bash` 终端，你将拥有系统的完全\
  \ root 级访问权限，允许你诊断并修复阻止系统正常启动的任何问题。这在图 6-10 中所示。\n\n![Images](img/f0183-02.jpg)\n\
  \n**图 6-10** 用 `bash` 终端替换 `init`\n\n**提示** 系统将不会提示你提供 root 密码。正因如此，如果你忘记了 root\
  \ 用户的密码，可以使用这种技术来救援系统。\n\n然而，请注意，在某些发行版中，root（`/`）文件系统将以只读模式挂载。如果是这种情况，你需要在修改配置文件之前，先将其重新挂载为读写模式，在\
  \ shell 提示符处输入 `mount –o remount,rw,sync –t *filesystem device_name mount_point`\
  \ 即可。在完成必要的更改后，你可以通过在 shell 提示符处输入 `exec /sbin/init` 来告诉内核通过 `init` 恢复正常的启动过程。\n\
  \n[-content]\n尽管自定义 GRUB 及其菜单项的能力非常有用，但也可能带来一定的安全风险。正如提到的，它可能会为任何知道方法的人提供 root 级的系统访问权限，而无需密码。这可能是一个非常糟糕的问题，特别是对于可能包含敏感或专有信息的\
  \ Linux 系统而言。\n\n为了增加 GRUB 菜单的安全性，你可以添加一个 GRUB 密码。一旦以此方式配置菜单，你只有在提供正确密码后才能修改你的 GRUB\
  \ 启动选项。最简单的方法是编辑你的 GRUB 配置文件（`menu.lst` 或 `grub.conf`）并输入以下内容：\n\n```\npassword\
  \ password\n```\n\n这是一个示例：\n\n```\npassword natasha01\n```\n\n请注意，在配置文件中添加此参数将导致\
  \ GRUB 以纯文本模式显示其菜单。示例在图 6-11 中所示。\n\n![Images](img/f0184-01.jpg)\n\n**图 6-11** 在\
  \ GRUB 配置文件中使用密码\n\n当 GRUB 这样配置配置时，用户仍然可以在没有密码的情况下选择任何他们想要的菜单项，但编辑任何 GRUB 菜单项都将要求他们输入你指定的密码。如果你想要求用户在选择菜单项之前也输入密码，你需要在\
  \ GRUB 配置文件相应的标题元素（title elements）中添加 `lock` 参数，如下例所示：\n\n![Images](img/p0184-01.jpg)\n\
  \n![Images](img/p0185-01.jpg)\n\n在此配置中，用户必须输入你指定的密码才能选择 GRUB 菜单项。这是通过按 P 然后输入相应的密码来实现的。如果他们没有这样做，将显示图\
  \ 6-12 所示的屏幕。\n\n![Images](img/f0183-02.jpg)\n\n**图 6-10** 用 `bash` 终端替换 `init`\n\
