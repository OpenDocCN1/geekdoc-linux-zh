  \ `.zip` 文件并选择“提取所有”。在 Linux 工作站上，你可以从命令行提示符使用 `gunzip` 命令或使用图形环境内的“文件”实用来解压文件。\n\
  4. 通过以下步骤在你的工作站上安装 VirtualBox：\n\n\n\n\n\na. 在你的工作站上，打开网页浏览器并导航到 [`www.virtualbox.org/wiki/Downloads/`](http://www.virtualbox.org/wiki/Downloads/)。\n\
  \nb. 下载适用于你工作站操作系统的 VirtualBox 版本。\n\nc. 使用 VirtualBox 文档中的说明（可在 [`www.virtualbox.org/manual/UserManual.html`](http://www.virtualbox.org/manual/UserManual.html)\
  \ 获取）在你的工作站上安装 VirtualBox。\n\n5. 按照以下步骤将你从 `.zip` 文件中解出的 openSUSE 虚拟机导入 VirtualBox：\n\
  \na. 在你的工作站上启动 VirtualBox。\n\nb. 点击 `Machine`（常规） | `Add`（添加）。\n\nc. 浏览到解压 `.zip`\
  \ 文件的文件夹并选择 `openSUSE.vbox` 文件。\n\n6. 要恢复特定的快照，请执行以下操作：\n\na. 点击 `Snapshots`（快照）。\n\
  \nb. 右键点击你想使用的快照，然后点击 `Restore Snapshot`（恢复快照）。\n\nc. 当提示恢复快照时，点击 `Restore`（恢复）。\n\
  \nd. 点击 `Start`（启动）启动虚拟机。\n\ne. 等待虚拟机启动。\n\n### 视频\n\n视频展示了书中包含的部分精选练习。你可以按照“纸笔测试”（Paper\
