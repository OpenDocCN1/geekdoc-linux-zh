  \ clients;`\nD. `DELETE FROM clients WHERE status=‘Inactive’;`\n\n#### **答案**\n\n\
  1.** **A.** `lp –d MIN2300W –n 2 /home/tux/employees.txt` 命令将打印两份 `/home/tux/employees.txt`。\n\
  \n2.** **A.** `postdrop` 守护进程接收由本地系统使用 shell 提示符的用户发送到 Postfix MTA 的电子邮件消息。\n\n\
