  ### 使用 Linux 工具\n### 从命令行管理权限\n# 第 12 章 管理硬件\n### 快速复\n### 管理前、后台进程\n\n\n## 使用命令替换和\
  \ Shell 函数 (#ch14.html_ch14lev66)\n### 答案\n\n\n\n![images](img/bull.jpg) 什么是发行版？\n\
  \n![images](img/bull.jpg) 常用的发行版\n\n![images](img/bull.jpg) Linux 发行版的生命周期\n\n###\
  \ 什么是发行版？\n\n也许思考发行版的最好方法是将 Linux 与冰淇淋进行比较。冰淇淋有很多口味；然而，冰淇淋本身的配方是相同的。大多数冰淇淋是由以下成分制成的：\n\
  \n![images](img/bull.jpg) 奶油\n\n![images](img/bull.jpg) 牛奶\n\n![images](img/bull.jpg)\
  \ 糖\n\n![images](img/bull.jpg) 鸡蛋\n\n销售冰淇淋的公司采用这种基础冰淇淋配方，并通过添加成分（如巧克力、香草、水果、饼干、坚果和糖果）进行定制。通过这种方式，他们创建了自己口味的冰淇淋。\n\
  \nLinux 发行版的工作原理非常相似：内核源代码类似于冰淇淋的基础配方。因为 Linux 内核源代码——运行其他所有内容的核心——是免费分发的，软件供应商可以自由下载它。就像冰淇淋公司向基础冰淇淋配方添加额外成分一样，软件供应商可以修改并增强\
  \ Linux 源代码，创建自定义的内核。他们还可以向操作系统添加专门的工具、实用程序和应用程序以增强其实用性。结果就是一个 Linux 发行版。\n\n你可能已经知道有很多不同的\
  \ Linux 发行版可用。这是 Linux 的另一个独特特征，使其与其他操作系统区分开来。几乎每一个其他操作系统都由单一供应商开发和营销。例如，开发和销售 OS\
  \ X 的唯一供应商是 Apple 公司。你不能去微软那里购买他们的 Mac OS 版本。\n\n然而，对于 Linux，许多不同的软件开发者获取了基础 Linux\
  \ 内核并将其修改以适应某些特定用途。他们可能还内置了许多强大的应用程序。某些发行版可能经过定制，为远程终端用户提供高端网络服务。另一些可能经过定制，为终端用户的桌面提供卓越的生产力应用程序。无论哪，结果都是一个自定义的\
  \ Linux 发行版。\n\n### 常用的发行版\n\n今天，可用可用数百种不同的发行版。有些是免费提供的，有些则需要你付费。一些流行的 Linux 发行版包括：\n\
  \n![images](img/bull.jpg) openSUSE Linux\n\n![images](img/bull.jpg) Ubuntu Linux\n\
  \n![images](img/bull.jpg) Fedora Linux\n\n![images](img/bull.jpg) Mint Linux\n\n\
  ![images](img/bull.jpg) Debian Linux\n\n![images](img/bull.jpg) Mageia Linux\n\n\
  ![images](img/bull.jpg) Arch Linux\n\n![images](img/bull.jpg) elementary Linux\n\
  \n![images](img/bull.jpg) CentOS\n\n***\n\n![Imags](img/note.jpg)\n\n**注意**：在 [`en.wikipedia.org/wiki/Comparison_of_Linux_distributions`](http://en.wikipedia.org/wiki/Comparison_of_Linux_distributions)\
  \ 提供了一个关于大多数 Linux 发行版的概述和比较的优秀表格。[`distrowatch.com/`](http://distrowatch.com/)\
  \ 也是获取所有可用 Linux 发行版信息的绝资源。\n\n那么哪种发行版最好？这是一个危险的问题。和平主义者在争论这个问题时可能都会动手。这是因为最适合你的发行版可能无法满足他人的需求。关键是尝试几个发行版，并选择你喜欢的那个。\n\
  \n就个人而言，我越来越喜欢 openSUSE，它已成为我首选的 Linux 发行版。你可以从 opensuse.org 下载此发行版的副本。我很喜欢 Red\
  \ Hat 的 Fedora 以及 Ubuntu。你可以从 fedora.redhat.com 下载 Fedora 副本，从 ubuntu.com 下载 Ubuntu\
  \ 副本。对于安全测试，我也喜欢 Knoppix 和 Kali（以前是 BackTrack）Linux 发行版。\n\n在下载 Linux 发行版时，请确保为你系统的\
  \ CPU 选择正确的架构。多年来，这并不是一个问题，因为我们实际上只处理一种架构：英特尔的 32 位 x86 架构。虽然大多数早期发行版适用于 x86 和 Alpha\
  \ CPU 架构，但普通的系统管理员并没有多少 Alpha 机器。相反，我们处理的大多数系统运行在 x86 架构的某种变体上。\n\n\n\n\n然而，我们现在有更多的硬件选项可供选择。我们仍然拥有\
  \ `x86` 架构，但也有更新的 64 位 `x86` 架构。此外，英特尔生产了其 Itanium CPU 使用的 `IA-64` 架构。每种架构都需要不同版本的\
  \ Linux。事实上，许多 Linux 发行版甚至已经移植到苹果计算机的 `Power PC` (`PPC`) 架构上。IBM 的 `iSeries`、`pSeries`\
  \ 和 `RS/6000` 服务器也有其他发行版可用。\n\n重要的点是，确保你为你的发行版选择了合适的架构。例如，如果你准备在一个带有 32 位 CPU 的旧系统上安装\
  \ Linux，那么你需要该发行版的 `x86` (32 位) 版本。如果你的硬件使用的是 64 位 CPU，则你需要该发行版的 `x86-64` (64 位)\
  \ 版本。如果你选错了版本，大多数 Linux 安装程序将生成错误，你将无法完成安装。\n\n## Linux 发行版的生命周期\n\n让我们来看看一个典型 Linux\
  \ 发行版的生命周期。请理解，没有任何东西是永远的，包括 Linux 发行版。最终，更新、更好的 Linux 发行版将会发布，使得旧版本过时。本质上，Linux\
  \ 发行版与其他任何软件具有相同的生命周期：\n\n![images](img/bull.jpg) **设计** 在此阶段，目标是确定发行版的目标或目的，定义特性或功能，并分配角色。通常，此阶段涉及确定发行版之前的版本中哪些运行得不好，以及如何修复这些问题。它通常还涉及需要向发行版中添加哪些新功能。\n\
  \n![images](img/bull.jpg) **开发** 根据设计阶段的计划创建发行版。执行方式取决于所采用的开发模型。它可能使用严格控制的“教堂式”开发过程，也可能是在互联网上使用“集市式”开发过程进行自由的开发。通常会采用某种形式的测试和验证，以确保发行版尽可能“无虫”。\n\
  \n![images](img/bull.jpg) **部署** 完成的发行版被发布，终端用户开始在各种环境中部署它。\n\n![images](img/bull.jpg)\
  \ **管理** 部署后的发行版将进行日常管理。由于它被用于如此多样的环境，不可避免会发现许多在开发阶段被开发人员遗漏的漏洞。因此，需要发布中期更新来修复这些漏洞。Linux\
  \ 的更新发布频率通常比商业操作系统和应用程序快得多，通常每几个月一次。\n\n![images](img/bull.jpg) **退役** 发行版通常会获得支持一段时间，被称为\
  \ `支持生命周期`。然而，支持生命周期的长度不同发行版之间差异很大。例如，Red Hat Linux 目前提供 10 年的生命周期（尽管可以延长到 13 年）。相比之下，Debian\
  \ 仅提供三年的生命周期。一旦支持周期结束，该发行版就会过时并必须退役。当发行版达到这种状态时，应将其从你的生产环境中移除。\n\n在此过程中，给定 Linux\
  \ 发行版的新版本可能会在旧版本支持周期结束之前发布。开发人员通常不会等到一个发行版退役才发布新版本。因此，同一个 Linux 发行版的多个版本可能同时被支持；但它们都处于支持周期的不同阶段。\n\
  \n## 常见的 Linux 实现\n\n由于 Linux 是在 `GPL` 下发布的，软件供应商能够调整和自定义操作系统以在各种角色运行。虽然这些角色的数量几乎是无限的，但你应该熟悉以下角色：\n\
  \n![images](img/bull.jpg) 在桌面上使用 Linux\n![images](img/bull.jpg) 在服务器上使用 Linux\n\
  ![images](img/bull.jpg) 在移动设备上使用 Linux\n![images](img/bull.jpg) 将 Linux 用于虚拟化\n\
  ![images](img/bull.jpg) 在云计算中使用 Linux\n![images](img/bull.jpg) 使用嵌入式 Linux\n\n##\
  \ 桌面版 Linux\n\nLinux 可以优化为作为桌面系统运行得非常好。然而，Linux 在进入这一市场方面进展缓慢。截至 2014 年，Linux 仅占了约\
  \ 2% 的桌面市场份额，而 Windows 占据了 90% 以上。这有两个原因。\n\n首先，历史上缺乏适用于 Linux 的桌面生产力应用程序。用户在桌面上需要文字处理、电子表格和演示文软件来完成日常工作。坦率地说，现在有很多生产力应用程序使\
  \ Linux 成为桌面的可行选择，包括：\n\n![images](img/bull.jpg) [OpenOffice.org](http://www.openoffice.org)\n\
  ![images](img/bull.jpg) LibreOffice\n\n第二个（也是最令人头疼的）是，普通用户倾向于认为 Linux 令人敬畏。对于像你和我这样的“技术人员”来说，这不是问题。我们对新应用程序和操作系统感到很自在。我们可以快速学习并有效地使用它们。遗憾的是，大多数机构的普通用户可能最初是通过使用某个版本的\
  \ `Windows` 学会使用电脑的。那是他们最熟悉的，他们倾向于抵制学习新的操作系统。让 Linux 在桌面上变得可行的关键如下：\n\n![images](img/bull.jpg)\
  \ 为用户提供完成工作所需的应用程序。\n![images](img/bull.jpg) 让用户界面简单且直观，以便从 Windows 到 Linux 的迁移尽可能无痛。\n\
  \n***\n\n![Images](img/tip.jpg)\n\n**提示** 因为 Linux 可能会让普通用户感到敬畏，如果你计划在你的组织中推广 Linux\
  \ 桌面，你应该考虑实施广泛的培训计划，作为你整体部署计划不可或缺的一部分。\n\n许多供应商一直致力于开发面向桌面的 Linux 发行版，力求做到这一点。他们优化了\
  \ Linux，使其作为桌面系统高效、快速地运行。他们还在发行版中整合了 `OpenOffice` 或 `LibreOffice` 等应用程序套件。此外，他们还优化了\
  \ Linux 窗口管理器，为终端用户提供易于使用的图形界面。一些较流行的桌面 Linux 发行版包括：\n\n![images](img/bull.jpg)\
  \ Ubuntu Desktop Edition\n![images](img/bull.jpg) openSUSE\n![images](img/bull.jpg)\
  \ Fedora Desktop Edition\n\n## 服务器版 Linux\n\nLinux 作为服务器运行非常出色。事实上，Linux 在服务器房中获得了广泛接受，远比在桌面上多。取决于提供的服务，Linux\
  \ 占据了 40% 到 97% 的服务器市场份额。这是因为 Linux 可以承担各种服务器角色并执行得极其出色，包括：\n\n![images](img/bull.jpg)\
  \ **文件服务器** 使用网络文件系统 (`NFS`) 或 `Samba` 服务，你可以配置 Linux 提供用户文件的网络存储。`NFS` 对于 Linux\
  \ 或 `UNIX` 客户端系统效果很好，但对 Windows 客户端的效果并不理想。`Samba` 是 Windows 客户端系统的更好选择。使用 `Samba`，你的\
  \ Linux 服务器甚至可以配置为 Windows 域控制器。\n\n![images](img/bull.jpg) **打印服务器** 通过结合通用 UNIX\
  \ 打印系统 (`CUPS`) 和 `Samba` 服务，你可以配置 Linux 为网络用户提供共享打印。\n\n\n\n\n\n![images](img/bull.jpg)\
  \ **数据库服务器** Linux 可以被配置为强大的数据库服务器。Linux 提供了多种数据库服务，包括 `MySQL`、`MariaDB`、`NoSQL`\
  \ 和 `PostgreSQL`。\n\n![images](img/bull.jpg) **Web 服务器** Linux 已广泛部署作为 Web 服务器。事实上，目前\
  \ Linux 上最流行的 Web 服务是 `Apache` Web 服务器。\n\n![images](img/bull.jpg) **电子邮件服务器** Linux\
  \ 提供了多种电子邮件服务，可以将您的系统转换为企业级邮件服务器。\n\n![images](img/bull.jpg) **超级计算机** Linux 是部署高功率超级计算机的首选操作系统。\n\
  \nLinux 作为服务器之所以广普及，归于多个原因。首先，Linux 极其稳定。简单来说，Linux 服务器很少崩溃。它会一直运行、运行。而其他服务器操作系统则因经常崩溃而臭名昭著。\n\
  \n其次，Linux 服务器非常快。已经运行了许多基准测试，将 Linux 服务器与其他服务器操作系统进行对比。每一次，Linux 服务器的性能都与在相似负载下运行相似服务的此类操作系统相当，甚至更好。\n\
  \n第三，Linux 服务器的拥有成本通常较低。大多数服务器操作系统收取昂贵的按席许可费用，使得它们在大组织中部署非常昂贵。大多数 Linux 发行版则不然。事实上，取决于你选择的发行版，你可能只需要为服务器硬件、支持合同和管理系统的人员付费。\n\
  \n尽管你可以配置几乎任何 Linux 发行版来提供网络服务，但如果你要在大型组织中部署 Linux 服务器，应该使用专门为服务器功能优化的发行版。`Red Hat`\
  \ 提供了 `Red Hat Enterprise Linux Server`发行版，它作为企业级服务器有着良好的记录。同样，你也可以使用 `SUSE Linux\
  \ Enterprise Server` (`SLES`) 和 `Ubuntu Server` 发行版，它们也针对服务器角色进行了优化。\n\n## 移动 Linux\n\
  \nLinux 几乎以 `Google` 提供的 `Android` 操作系统的形式接管了移动设备市场。`Android` 实际上是一个经过特殊化的 Linux\
  \ 发行版。直到 2009 年，`Android` 只安装在全球约 3% 的移动设备（智能手机和平板）。然而，目前该市场份额已增加到接近 50%。你甚至可以下载并安装名为\
  \ `Android-x86` 的特殊 `Android` 版本，它可以在标准 PC 硬件上运行。`Android` 如此受欢迎的原因有三点：\n\n![images](img/bull.jpg)\
  \ **价格** 因为 `Android` 基于 Linux 内核，它的价格比其他移动设备操作系统（如 `iOS` 和 `Windows RT`）要便宜得多。\n\
  \n![images](img/bull.jpg) **性能** `Android` 在移动设备上的表现非常出色。\n\n![images](img/bull.jpg)\
  \ **应用支持** `Android` 设备可用大量的应用程序，这些设备能够提供与 `Apple` 和 `Microsoft` 更昂贵设备相同的功能。\n\n\
  ## Linux 与虚拟化\n\n虚拟化是信息技术的一个方面，在行业中正获得巨大的动力。要理解虚拟化如何工作，你首先需要理解操作系统是如何部署在计算机硬件上的。\n\
  \n在传统模型中，一个操作系统安装在一个硬件设备上。例如，如果你要安装一个新系统，你会购买系统硬件，然后在该硬件上安装 Linux 操作系统。在这种情况下，安装的操作系统对系统中所有资源拥有完全控制权，包括以下内容：\n\
  \n![images](img/bull.jpg) 内存 (RAM)\n\n![images](img/bull.jpg) CPU 时间\n\n![images](img/bull.jpg)\
  \ 存储设备\n\n![images](img/bull.jpg) 网络接口\n\n现在，这是我们过去通常部署系统的方式。然而，这种模型是非常低效的，因为操作系统并没有随时利用所有的系统资源，尤其是在服务器系统上。事实上，很多时候你的计算资源都处于严重的未利用状态。这意味着计算能力可用但仍未被使用，从而被浪费了。\n\
  \n例如，假设你有三台服务器，每台都安装在各自的物理硬件上。每个系统的 CPU 利用率通常在 8% 到 9% 之间波动，偶尔会升至 50%。系统内存、存储和网络设备也以相同的方式利用。在这种情况下，你实际上不需要这么多处理能力。每台服务器约\
  \ 90% 的容量大部分时间都是闲的。\n\n虚拟化提供了一种替代部署模型。虚拟化将多个操作系统实例汇聚到同一物理硬件上并允许它们并发运行。为了实现这一点，虚拟化使用一种称为\
  \ `hypervisor` 的中间器来管理对系统资源的访问。\n\n每个操作系统实例都安装在`虚拟机`（virtual machine）中而不是物理硬件上。每个`虚拟机`\
  \ 都分配了 CPU 时间、一个工作内存区域、一个存储设备和它自己的虚拟网络接口。每个`虚拟机` 的外观和功能都就像物理主机一样。\n\n虚拟化的主要优点之一是它更有效地利用了系统资源。系统硬件的可用计算能力被分配给系统上运行的所有虚拟机。\n\
  \n虚拟化的另一个优点是它允许多个平台在同一硬件上同时运行，包括 `Windows` 和 `Linux`。这对于软件开发人员测试人员来说是一个巨大的优势，使得测试开发中的应用程序在不同平台上的性能变得容易得多。\n\
  \n虚拟化还允许你在组织中实现瘦客户端。在这种配置下，你在同一台虚拟化服务器上运行多个桌面。你所有的终端用户桌面都作为服务器上的虚拟机形式提供。这可以节省大量资金，因为允许你为用户部署极简的低端工作站。这些简易的工作站仅用于显示（通过网络连接）在服务器上作为虚拟机的桌面环境。\n\
  \nLinux 提供了几个高性能虚拟化平台，包括以下这些：\n\n![images](img/bull.jpg) `Xen`（开源）\n\n![images](img/bull.jpg)\
  \ `VMware Workstation`、`Player`、`ESX` 和 `ESXi`（专有）\n\n![images](img/bull.jpg) `VirtualBox`（开源）\n\
  \n![images](img/bull.jpg) `KVM`（开源）\n\n当你安装这些 hypervisor 之一时，你就将你的 Linux 系统变成了一个可以运行虚拟机的\
  \ hypervisor。注意，`ESX` 和 `ESXi` 使用 `VMware` 的特殊 Linux 发行版作为基础，不能与其他任何版本的 Linux 使用。\n\
  \n## Linux 与云计算\n\n虚拟化是`云计算`的关键组件，在云计算中，我们过去在本地实现的硬件、软件和/或网络资源被移动到远程并通过网络连接交付。许多云计算提供商甚至通过互联网提供服务。例如，假设你需要在组织中部署一台额外的\
  \ Linux 服务器。传统上，你会购买新硬件，选择一个发行版，安装并配置它以在你的网络中工作。\n\n而通过云计算，互联网上的提供商可以在其现场的 `hypervisor`\
  \ 上部署一个新的 Linux 虚拟机。然后你支付费用通过组织的网络连接访问此虚拟服务器。提供商承担实施、维护和保护服务器的所有成本。这种模型被称为*基础设施即服务\
  \ (IaaS)*。\n\n\n\n\n\n除了 IaaS 之外，还有其他几种云计算模型：\n\n![images](img/bull.jpg) **软件即服务\
  \ (SaaS)** 通过云访问软件和数据\n\n![images](img/bull.jpg) **网络即服务 (NaaS)** 通过云端提供网络连接\n\n\
  ![images](img/bull.jpg) **存储即服务 (STaaS)** 通过云端访问存储设备\n\n![images](img/bull.jpg)\
  \ **桌面即服务 (DaaS)** 通过云端访问桌面操作系统\n\n![images](img/bull.jpg) **平台即服务 (PaaS)** 提供完整的解决方案套件以完成计算任务，包括网络、基础设施、存储和软件\n\
  \n事实上，你可以使用 `Linux` 和虚拟化技术来创建自己的私有云，通过网络连接为组织内的其他用户提供按需计算资源。\n\n## 嵌入式 Linux\n\n\
  `Linux` 的巨大优势之一是它可以被优化到非常小的占用空间，这使得它能够运行在极简的硬件上以执行非常特定的任务集。因此，它非常适合嵌入到智能设备中，包括以下设备：\n\
  \n![images](img/bull.jpg) 工业级自动化和控制设备\n\n![images](img/bull.jpg) 网络设备\n\n![images](img/bull.jpg)\
  \ 视频游戏系统\n\n![images](img/bull.jpg) 智能电视\n\n![images](img/bull.jpg) 智能手机和平板电脑\n\n\
  为了实现这一点，会对操作系统进行定制，仅提供设备所需的各种功能。`Linux` 中所有其他不必要的元素都会被移除，然后将操作系统嵌入到给定设备内的闪存芯片中。这允许设备运行操作系统并利用其编程智能来控制设备的操作。\n\
  \n### 本章总结\n\n在本章中，你接触了 `Linux` 操作系统。我们首先讨论了什么是操作系统，以及构成 `Linux` 操作系统的组件。我强调了现代计算机系统和操作系统是模块化的。你可以在任何兼容的计算机上安装\
  \ `Linux`。\n\n然后，我们花了一些时间回顾了 `Linux` 的历史发展。我们回顾了典型的企业软件开发模型，并联系了 `Linux` 如何在这种规范之外开发。我们讨论了\
  \ `GNU` 和 `GPL`，以及 `Linux` 是在 `GPL` 下开发的这一事实，因此允许任何人免费访问源代码。接着我们讨论了开源软件运动，并确定了它与\
  \ `GNU` 的关系。我提到开源提供了免费软件，其源代码必须保持公开可用。\n\n我们通过回顾 `Linux` 发行版的创建方式结束了本章，并列出了几种较为流行的发行版。我们还讨论了\
  \ `Linux` 在典型组织中可以扮演的不同角色，包括服务器、桌面、移动平台、虚拟机管理器和云计算。\n\n## 加速复\n\n![images](img/bull.jpg)\
  \ `Linux` 是一个操作系统。\n\n![images](img/bull.jpg) 操作系统提供四个关键功能：\n\n![images](img/bull.jpg)\
  \ 应用平台\n\n![images](img/bull.jpg) 硬件协调器\n\n![images](img/bull.jpg) 数据存储\n\n![images](img/bull.jpg)\
  \ 安全性\n\n![images](img/bull.jpg) `Linux` 由以下组件组成：\n\n![images](img/bull.jpg) 内核\n\
  \n![images](img/bull.jpg) 库\n\n![images](img/bull.jpg) 工具\n\n![images](img/bull.jpg)\
  \ 用户界面\n\n![images](img/bull.jpg) `Linus Torvalds` 在 20 世纪 90 年代初开发了 `Linux`。\n\n\
  ![images](img/bull.jpg) `Linux` 根据 `GPL` 许可。\n\n![images](img/bull.jpg) 任何人都可以下载并修改\
  \ `Linux` 内核源代码。\n\n![images](img/bull.jpg) 不同的软件公司开发了独特的 `Linux` 版本，称为“发行版”。\n\n\
  ![images](img/bull.jpg) 在选择发行版之前，你应该确定系统的角色及其处理器架构。\n\n![images](img/bull.jpg) 用于生产环境的系统应该提供技术支持。\n\
  \n![images](img/bull.jpg) 在部署发行版之前，你应该验证你的软件应用程序将在所选的发行版上运行。\n\n![images](img/bull.jpg)\
  \ `Linux` 在计算机网络中可以作为服务器、桌面或虚拟机管理器运行。\n\n## 问题\n\n**1.** 下列哪个代表 `Linux` 系统中实际的操作系统组件？\n\
  \n**A.** 库\n**B.** 内核\n**C.** 桌面环境\n**D.** `bash` 壳函数\n\n**2.** 下列哪项提供了预写代码元素，程序员在编写\
  \ `Linux` 程序时可以调用它们？\n\n**A.** 内核\n**B.** 内核模块\n**C.** 库\n**D.** `bash` 壳配置文件\n\n\
  **3.** Andrew Tanenbaum 编写的 UNIX 克隆版本叫什么名字？\n\n**A.** CPM\n**B.** DR-DOS\n**C.**\
  \ `Linux`\n**D.** Minix\n**E.** Solaris\n\n**4.** `Linus Torvalds` 对 `Linux` 的源代码做了什么？\n\
  \n**A.** 他把它卖给了 IBM。\n**B.** 他把它免费送给了微软。\n**C.** 他开发了 `Minix`。\n**D.** 他对其申请了专利并拥有版权。\n\
  **E.** 他把它发布在网上，供任何想要副本的人使用。\n\n**5.** 谁发起了 `GNU` 项目？\n\n**A.** Richard Stallman\n\
  **B.** Andrew Tanenbaum\n**C.** `Linus Torvalds`\n**D.** Richard Berkley\n\n**6.**\
  \ 你是一名计算机程序员。你的主管希望你下载最新的 `Linux` 内核源代码并对其进行修改，以支持你们公司正在开发的用于内部使用的自定义应用程序。你可以做到吗？\n\
  \n**A.** 不，`Linux` 的源代码已在互联网上无法获取了。\n**B.** 不，源代码的版权不允许这样做。\n**C.** 可以，但你必须向 `GNU`\
  \ 项目支付版税。\n**D.** 可以，你可以创建一个新的 `Linux` 版本，甚至可以重新分发，只要源代码保持免费可用即可。\n\n**7.** 你被指派为你拥有\
  \ 150 人的组织设置一个电子邮件服务器。你正在考虑使用 `Linux` 来完成。这可能吗？\n\n**A.** 可以，`Linux` 可以配置为提供电子邮件服务。\n\
  **B.** 不，虽然 `Linux` 可以配置为提供电子邮件服务，但不建议用于超过 25 个用户。\n**C.** 可以，但你必须购买与 `Linux` 兼容的特殊电子邮件软件。\n\
  **D.** 目前没有可用的商业协作软件套件移植到 `Linux` 上运行。\n\n**8.** 哪些 `Linux` 服务可以用于在 `Linux` 服务器上为\
  \ `Linux` 和 Windows 客户端工作站配置共享网络打印？（选择两个。）\n\n**A.** MySQL\n**B.** NFS\n**C.** `CUPS`\n\
  **D.** Samba\n**E.** NIS\n**F.** OpenPrint\n\n**9.** 哪种服务可以用于使用 Windows 工作站的网络用户在\
  \ `Linux` 服务器上配置共享文件存储？\n\n**A.** MySQL\n**B.** NFS\n**C.** PostgreSQL\n**D.** Samba\n\
  **E.** NIS\n**F.** FileManager\n\n**10.** 你正在安装一个新的 `Linux` 服务器，它将用于托管任务关键型数据库应用程序。该服务器每天会被大量用户频繁使用。哪些发行版是此类部署的最佳选择？（选择两个。）\n\
  \n**A.** Red Hat Enterprise Server\n**B.** Red Hat Enterprise Desktop\n**C.** Ubuntu\
  \ Server\n**D.** SUSE Linux Enterprise Desktop\n\n**11.** 你计划在一个带有 Pentium 4 超线程处理器的旧系统上安装\
  \ `Fedora`。你应该下载哪个架构的版本？\n\n**A.** IA-64\n**B.** x86-Celeron\n**C.** x86-64\n**D.**\
  \ x86\n**E.** PPC\n\n**12.** 你计划在一个带有 64 位四核处理器的系统上安装 `Fedora`。你应该下载哪个架构的版本？\n\n\
  **A.** IA-64\n**B.** x86-64\n**C.** x86\n**D.** PPC\n\n### 答案\n\n**1. B.** `Linux`\
  \ 内核是处理操作系统功能的组件。\n\n\n\n\n\n- 2. C.** 库包含程序员可以在其应用程序中重用的预写代码。\n- 3. D.** **Andrew\
  \ Tanenbaum** 在大学不再被允许访问 UNIX 源代码时编写了 Minix 操作系统。\n- 4. E.** **Linus Torvalds**\
  \ 在互联网上发布了他的 Linux 内核源源代码，并邀请其他程序员对其进行修改和增强。\n- 5. A.** **Richard Stallman** 倡导了\
  \ GNU 背后的自由分发源代码概念。\n- 6. D.** 在 GPL 协议下，你可以自由地下载 Linux 源代码并进行修改。\n- 7. A.** Linux\
  \ 提供了多种强大的电子邮件软件包，使其非常适合大型组织。\n- 8. C, D.** CUPS 服务为其他 Linux 系统提供网络打印。当与 Samba 结合时，网络打印可以扩展到\
  \ Windows 系统（以及任何支持 Samba 的其他操作系统，包括 Linux 和 Mac OS X）。\n- 9. D.** Samba 服务可用于兼容\
  \ Samba 的客户端，包括 Windows、Mac OS X 和 Linux 系统。\n- 10. A, C.** 这些发行版针对高需求网络服务器进行了优化。\n\
  - 11. D.** 奔腾 4 超线程 CPU 使用 Intel x86 架构。\n- 12. B.** 64 位 AMD CPU 使用 64 位 x86 架构。\n\
  \n# 第 2 章\n\n## 使用 Linux Shell\n\n在本章中，你将学习到：\n\n- Linux shell 的工作原理\n- 使用 shell\
  \ 提示符（shell prompt）\n- 如何为 Linux shell 命令获取帮助\n- 环境变量的操作\n- 别名（aliases）的操作\n- 重定向和管道\n\
  \n为了使操作系统变得有用，它必须为用户提供某些与其通信的手段。用户需要一种方法来告诉操作系统它需要完成哪些任务，例如运行程序、复制文件和关闭系统。这些命令通过*用户界面*提供。Linux\
  \ 提供了两种类型的用户界面：\n\n![images](img/bull.jpg) **命令行界面 (CLI)** 通过命令行界面，用户通过在命令提示符处输入命令与\
  \ Linux 操作系统进行通信。\n\n![images](img/bull.jpg) **图形化用户界面 (GUI)** 除了命令行界面，Linux 还为用户提供了一个易于使用的图形化用户界面，允许他们使用鼠标与\
  \ Linux 内核进行交互。\n\n在本章中，我们将重点关注 Linux CLI。Linux GUI 的使用和配置将在第 7 章 中介绍。\n\n### Linux\
  \ Shell 的工作原理\n\n尽管图形化用户界面通常更容易使用，但管理和支持 Linux 系统时必须执行的许多任务必须通过命令行完成。基本上，终端用户使用\
  \ GUI；而管理员使用命令行。\n\n***\n\n![Imags](img/examtip.jpg)\n\n**考试贴士** 在 Linux+ 和 LPIC-1\
  \ 考试中，将非常深入地测试你使用 Linux CLI 管理系统的能力。\n\n因此，我们将在书中花费大量时间研究 Linux 命令行界面。我们将讨论以下主题：\n\
  \n![images](img/bull.jpg) Linux shells\n\n![images](img/bull.jpg) 管理 shell 配置文件\n\
  \n让我们从讨论常用的 Linux shell 开始。\n\n#### Linux Shells\n\n要完全理解命令行界面在 Linux 下如何工作，你需要理解\
  \ shell 的概念。*shell* 是一个命令解释器，允许你在键盘上输入命令，这些命令会被发送到操作系统内核。\n\nLinux 允许你从多种 shell\
  \ 中选择。与 Linux 的许多方面一样，你可以尝试几种不同的命令行 shell，并选择你最喜欢的一个。这里是一些流行的 shell 列表：\n\n![images](img/bull.jpg)\
  \ **sh (Bourne Shell)** `sh` shell 是最早的 shell，是 20 世纪 70 年代后期为 UNIX 开发的。尽管在 Linux\
  \ 系统上没有被广泛使用，但在 UNIX 系统上仍经常使用。\n\n![images](img/bull.jpg) **bash (Bourne-Again Shell)**\
  \ `bash` shell 是 `sh` shell 的改进版本，是目前最流行的 shell 之一。事实上，它是大多数 Linux 发行版的默认 shell。如果你在\
  \ Linux 系统上使用命令行界面，那么你很有可能正在使用 `bash` shell。\n\n![images](img/bull.jpg) **csh (C\
  \ Shell)** `csh` shell 最初是为 BSD UNIX 开发的。它使用的语法与 C 语言编程非常相似。\n\n![images](img/bull.jpg)\
  \ **tsch** `tsch` shell 是 C Shell 的改进版本。它是 FreeBSD 系统上的默认 shell。\n\n![images](img/bull.jpg)\
  \ **zsh (Z Shell)** `zsh` shell 是 `bash` shell 的改进版本。\n\n当你首次启动 Linux 系统并登录时，会加载默认\
  \ shell。你可以通过在命令提示符处输入 `echo $SHELL` 来识别你正在使用哪个 shell。`echo` 命令用于在屏幕上显示文本。在 `echo`\
  \ 命令中添加 `$SHELL` 会告诉 `echo` 显示当前登录用户的 `SHELL` 环境变量的内容。这里显示了一个示例，其中 `bash` shell\
  \ 被 rtracy 用户账户的默认 shell：\n\n![Images](img/p0018-01.jpg)\n\n然而，你并不局限于默认 shell。如果你想切换到不同的\
  \ shell，只需在提示符处输入该 shell 的命令名称。例如，如果你当前正在使用 `bash` shell 并想改用 `zsh`，只需在提示符处输入 `zsh`。要停止使用新\
  \ shell 并恢复到原始 shell，输入 `exit`。\n\n***\n\n![Images](img/examtip.jpg)\n\n**考试贴士**\
  \ 你也可以通过修改用户账户详情来指定使用的默认 shell。我们将在第 9 章 中讨论如何操作。Linux+ 和 LPIC-1 考试仅要求熟悉 `bash`\
  \ shell。因此，本章将只涉及 `bash`。\n\nLinux 能够同时运行多个 shell 会话。每个会话都可以运行自己的程序，且同时进行。如果你有一个程序正在运行，然后需要访问命令提示符，这将非常有用。对于许多发行版（如\
  \ openSUSE），你只需按下 `ALT-Fx`（其中 x 是 2 到 6 之间的数字）即可打开新会话。例如，切换到第三个备控制台屏幕按下 `ALT-F3`。然后你可以通过\
  \ `ALT-F1` 返回原始会话。\n\n***\n\n![Images](img/note.jpg)\n\n**注意** 某些发行版（如 Ubuntu）要求你按下\
  \ `CTRL-ALT-FX` 来打开新会话。\n\n与 Windows 一样，你也可以在 Linux GUI 中运行终端会话。这是通过运行如 `Konsole`\
  \ 或 `GNOME Terminal` 等终端程序实现的。要运行多个命令行会话，只需打开两个或多个终端窗口。每个 shell 会话独立于其他会话运行其程序。\n\
  \n也可以通过另一种方式实现。当你处于 Linux GUI 中时，按下 `CTRL-ALT-Fx`（其中 x 是 1 到 6 之间的数字）。这将切换切换到基于文本的\
  \ shell 提示符。要切换回 GUI 环境，在大多数发行版中按下 `ALT-F7`。\n\n### 练习 2-1：使用 Linux Shell\n\n在练习中，你将学习如何访问\
  \ shell 提示符、更改 shell 以及访问备用控制台屏幕。你可以使用随书提供的虚拟机进行此练习。运行快照 2-1 以获得配置正确的环境。\n\n***\n\
  \n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 2-1 视频，演示如何执行此任务。\n\n完成以下操作：\n\n1. 启动你的\
  \ Linux 系统。\n\n2. 以用户 **student** 登录，密码为 **student**；然后按下 `CTRL-ALT-F1`。\n\n3. 在登录提示符处，使用用户\
  \ **student** 和密码 **student** 验证系统身份。\n\n\n\n\n4. 在提示符处输入 `echo $SHELL` 来查看你的默认\
  \ shell。将显示你的默认 shell。在大多数系统上，这将是 `/bin/bash`。\n\n5. 按 `ALT-F2` 打开备控制台窗口。将显示一个新的登录提示符。\n\
  \n6. 再次对系统进行身份验证。\n\n7. 选择 `ALT-F` 返回第一个控制台屏幕。\n\n8. 在提示符处输入 `sh` 来加载 `sh` shell。\n\
  \n9. 在提示符处输入 `exit` 返回你的默认 shell。\n\n10. 输入 `logout`。\n\n11. 按 `ALT-F7` 返回图形化环境。\n\
  \n现在你已经知道如何访问 bash shell 了，让我们谈谈如何配置它吧。\n\n## 管理 Shell 配置文件\n\n你可以使用几个配置文件来自定义你的\
  \ bash shell 环境。实际用于配置 shell 的文件取决于你正在使用登录 shell（login shell）还是非登录 shell（non-login\
  \ shell）。如果你的 Linux 系统启动到基于文本的登录界面，并且你使用 CLI 登录系统，则正在使用登录 shell。图 2-1 显示了此类 shell\
  \ 的示例。\n\n![Images](img/f0020-01.jpg)\n\n**图 2-1** 使用登录 shell\n\n**注意** 如果你的系统启动到运行级别\
  \ 3，那么你正在使用登录 shell。我们将在 第 6 章 中详细讨论运行级别。\n\n即使你的系统配置为启动到图形化环境（运行级别 5），登录 shell\
  \ 在在启动时仍会被创建；你只是看不到它。但是，如果你在桌面环境中打开终端窗口，你并没有使用登录 shell。相反，你正在运行非登录 shell。这在图 2-2\
  \ 中所示。\n\n![Images](img/f0021-01.jpg)\n\n**图 2-2** 使用非登录 shell\n\n这种区别非常重要，因为你使用的\
  \ shell 类型决定了使用哪些配置文件来自定义你的 shell 环境。这些文件是基于文本的 shell 脚本，包含要运行的特定命令。当配置文件运行时，文件中的所有命令将按照它们在文件中出现的顺序执行。\n\
  \n**注意** shell 脚本类似于其他操作系统上的批处理文件（batch file）。\n\n常用的 shell 配置文件列在表 2-1 中。\n\n![Images](img/t0021-01.jpg)\n\
  \n**表 2-1** bash Shell 配置文件\n\n如果你使用非登录 shell，情况非常简单。bash shell 仅运行 `/etc/bashrc`\
  \ 来处理系统级函数和别名，然后运行用户家目录下的 `~/.bashrc` 进行用户特定的自定义。\n\n如果你使用登录 shell，bash 运行运行 `/etc/profile`\
  \ 并应用该文件中指定的配置。然而，之后情况会变得复杂一些。正如你在表 2-1 中可能注意到的，列出的几个文件听起来的作用完全相同。你是对的，它们确实如此。这里的问题在于，没有任何发行版会使用所有这些文件。例如，Fedora\
  \ 系统使用 `~/.bashrc`、`~/.bash_profile` 和 `~/.bash_logout`。或者，openSUSE 和 Ubuntu 系统使用\
  \ `~/.bashrc` 和 `~/.profile`。\n\n当运行登录 shell 时，bash shell 程序按以下顺序搜索配置文件：\n\n1. `~/.bash_profile`\n\
  2. `~/.bash_login`\n3. `~/.profile`\n\n它使用找到的第一个文件并忽略其余所有文件。这在 SUSE 和 Fedora 上并不是大问题。记住，bash\
  \ 在加载登录 shell 时读取 `.bashrc`（尽管它可能被 `.bash_profile` 或 `.profile` 调用）。因此，在读取 `/etc/profile`\
  \ 之后，bash shell 在 Fedora 系统上读取 `.bash_profile`。同样，在 openSUSE 系统上，bash 在读取 `/etc/profile`\
  \ 后读取 `.profile`。\n\n**警告** 如果你想对 bash shell 环境进行更改，并使其在每次打开登录 shell 时应用到 Linux\
  \ 系统上的所有用户，你可以对 `/etc/profile` 文件进行修改。但是，如果操作系统进行了更新，你所做的任何更改都可能丢失。大多数发行版建议你修改 `/etc/profile.local`\
  \ 文件以防止这种情况的发生。\n\n`.bash_logout` 文件仅在你注销登录 shell 时使用。大多数发行版默认不会在用户的家目录中包含此文件。但是，大多数发行版允许个人用户创建自己的\
  \ `.bash_logout` 文件，并用自定义的注销执行命令进行配置。\n\n现在你已经理解了 shell 的角色和功能，准备好学习如何使用它运行程序了。\n\
  \n## 使用 shell 提示符\n\n在本章的部分，你将学习如何执行：\n\n- 在 shell 提示符处输入命令\n- 使用命令历史\n- 使用 tab\
  \ 补全\n\n让我们从讨论如何在 shell 提示符处输入命令开始。\n\n### 在 shell 提示符处输入命令\n\n从 shell 提示符运行程序或命令相对简单。它的方法与在\
  \ Windows 命令窗口中相同。你只需要在提示符处输入命令、脚本文件名或程序文件名并按回车。在这个示例中，已经在提示符处输入了 `ls` 命令：\n\n![Images](img/p0023-01.jpg)\n\
  \n`ls` 命令相当于 Windows 命令提示符中的 `DIR` 命令。它在屏幕上显示当前目录下的文件和目录列表。\n\n在使用 shell 提示符时，你需要注意这里的问题。事实上，这是我看到新\
  \ Linux 管理员感到最困难的核心问题之一。Linux 处理你想要运行的可执行文件路径的方式与其他操作系统不同。\n\n例如，在 Windows 命令窗口中，命令解释器首先在当前目录查找你在提示符处输入的可执行文件名。如果文件不在当前目录中，命令解释器会读取\
  \ `PATH` 环境变量。它搜索 `PATH` 变量列出的每个目录，寻找在命令提示符处输入的可执行文件名。如果找到文件，它将运行该可执行文件。如果没有，会在屏幕上向用户显示错误消息。\n\
  \nLinux 同样采用了 `PATH` 环境变量。然而，Linux 不检查当前目录。这对于新的 Linux 管理员和用户来说可能非常困惑。他们期望能够切换到可执行文件所在的目录并从命令行运行它。\n\
  \n在 Linux 下，这行不通。相反，Linux 只在当前用户的 `PATH` 变量中的目录内搜索正在运行的文件。此示例显示了一个典型的 Linux `PATH`\
  \ 环境变量：\n\n![Images](img/p0023-02.jpg)\n\n**考试贴士** 你也可以通过在命令提示符处输入 `env` 来查看当前用户的\
  \ `PATH` 变量。\n\n注意 `PATH` 环境变量包含一个由冒号（:）分隔的目录列表。\n\n即使所涉及的可执行文件位于当前目录，如果当前目录不在 `PATH`\
  \ 变量中，Linux 也无法找到它。相反，shell 将返回错误。在下面的示例中，一个名为 `runme.sh` 的可执行脚本文件位于 `rtracy` 用户的家目录下。这已通过\
  \ `ls` 命令经过验证。\n\n![Images](img/p0023-03.jpg)\n\n![Images](img/p0024-01.jpg)\n\n\
  你可以看到，当在 shell 提示符处输入 `runme.sh` 时，shell 找不到该文件。这是因为 rtracy 的家目录（/home/rtracy）未列在\
  \ `PATH` 中。\n\n处理这个问题有三种。首先，你可以输入可执行文件的完整路径。对于刚才的示例，你可以在 shell 提示符处输入 `/home/rtracy/runme.sh`\
  \ 来执行该文件。\n\n\n\n\n其次，你可以切换到可执行文件所在的目录。然后在命令的开头添加 `.///`。在上一个示例中，你首先需要验证当前目录是否为\
  \ `/home/rtracy`；然后你可以在 shell 提示符处输入 `./runme.sh`。`.//`字符指定当前目录。通过将它们添加到命令的开头，你告诉\
  \ shell 在当前目录中查找命令中指定的文件。\n\n最后，你可以将可执行文件所在的目录添加到 `PATH` 环境变量的目录列表中。我们将在本章的后续部分讨论如何操作。\n\
  \n除了路径问题，你还需要注意 Linux 文件名和目录名是**区分大小写**的！这意味着 Linux 命令也是区分大小写的。如果你要运行的可执行文件名为 `runme.sh`，那么你必须在\
  \ shell 提示符处输入 `runme.sh`。输入 `Runme.sh`、`RUNME.SH` 或 `Runme.SH` 将无法运行。shell 将这些名称中的每一个解释为不同的文件。\n\
  \n这条规则也适用于目录名。如果你正在调用 `/home/rtracy/runme.sh`，那么你必须使用完全的大小写输入命令。`/Home/Rtracy/Runme.sh`\
  \ 将引导 shell 指向系统中完全不同的地方。\n\n随着你 Linux 经验的增加，你会发现它包含了一些非常强大的命令和实用，你将反复使用它们。其中一些包括：\n\
  \n![images](img/bull.jpg) `halt` 此命令关闭操作系统，但只能由 root 用户运行。\n\n![images](img/bull.jpg)\
  \ `reboot` 此命令关闭并重启操作系统。它也只能由 root 。\n\n![images](img/bull.jpg) `init 0` 此命令也关闭操作系统，只能由你的\
  \ root 用户运行。\n\n![images](img/bull.jpg) `init 6` 此命令也关闭并重启操作系统。它也只能由 root 。\n\n\
  ![images](img/bull.jpg) `shutdown` root 用户可以使用此命令关闭或重启系统。\n\n![images](img/bull.jpg)\
  \ `exit` 此命令终止当前运行的进程，包括当前的 shell 会话。例如，如果你在 Linux GUI 中打开终端会话并在 shell 提示符处输入 `exit`，终端会话将被关闭。同样，如果你在\
  \ CLI 中工作并输入 `exit`，当前的 shell 会话将结束，你会被注销。\n\n![images](img/bull.jpg) `su` 此命令从当前用户切换到新用户账户。例如，如果你登录为\
  \ `rtracy` 并需要切换到用户账户 `dcoughanour`，你可以在 shell 提示符处输入 `su dcoughanour`。此命令最常用于切换到超级用户\
  \ root 账户。事实上，如果不提供用户名，此实用程序将假设你想切换到 root 账户。如果你输入 `su –`，你将切换到 root 用户账户并应用所有 root\
  \ 的环境变量。完成后，输入 `exit` 返回原始用户账户。\n\n* *\n\n![Images](img/tip.jpg)\n\n**提示** 许多人认为“su”代表“superuser”（超级用户）。其实不是。它代表“substitute\
  \ user”（替换用户）。\n\n![images](img/bull.jpg) `env` 此命令显示当前登录用户的环境变量。\n\n![images](img/bull.jpg)\
  \ `echo` 此命令用于在屏幕上回显一行文本。它经常被用于显示环境变量。例如，如果你想查看 `PATH` 变量的当前值，可以输入 `echo $PATH`。\n\
  \n![images](img/bull.jpg) `top` 此命令是一个非常有用的命令，显示当前系统上运行的所有应用程序和进程列表。你可以根据 CPU 使用率、内存使用率、进程\
  \ ID 号以及所有者对其进行排序。\n\n![images](img/bull.jpg) `which` 此命令用于显示 shell 命令或实用工具的完整路径。例如，如果你想知道\
  \ `ls` 命令的完整路径，可以输入 `which ls`。\n\n![images](img/bull.jpg) `whoami` 此命令显示当前登录用户的用户名。\n\
  \n![images](img/bull.jpg) `netstat` 此命令显示网络状态，包括当前连接、路由表等。\n\n![images](img/bull.jpg)\
  \ `route` 此命令用于查看或操作系统的路由表。\n\n![images](img/bull.jpg) `ifconfig` 此命令用于管理系统中安装的网卡。它可以用于显示或修改你的网卡配置参数。此命令只能由\
  \ root 用户运行。\n\n![images](img/bull.jpg) `uname` 此命令使用几个不同的选项返回关于你的 Linux 系统的信息，包括：\n\
  \n![images](img/bull.jpg) `-s` 显示 Linux 内核名称\n\n![images](img/bull.jpg) `-n` 显示系统主机名\n\
  \n![images](img/bull.jpg) `-r` 显示 Linux 内核的发布版本\n\n![images](img/bull.jpg) `-v`\
  \ 显示 Linux 内核的版本号\n\n![images](img/bull.jpg) `-m` 显示系统的硬件架构（如 `x86_64`）\n\n![images](img/bull.jpg)\
  \ `-p` 显示处理器类型\n\n![images](img/bull.jpg) `-i` 显示硬件平台\n\n![images](img/bull.jpg)\
  \ `-o` 显示操作系统\n\n![images](img/bull.jpg) `-a` 显示所有此类信息\n\n* *\n\n![Imags](img/note.jpg)\n\
  \n**注意** 这里列出的命令列表仅用于让你熟悉常见的 Linux 命令和实用工具。你需要非常熟悉这些以及许多其他命令，才能通过你的 Linux+ 和 LPIC-1\
  \ 考试。更多的命令和实用工具将在本书的后续章节中介绍。\n\n除了路径问题，你还需要注意 Linux 文件名和目录名是区分大小写的！这意味着 Linux 命令也是区分大小写的。如果你要运行的可执行文件名为\
  \ `runme.sh`，那么你必须在 shell 提示符处输入 `runme.sh`。输入 `Runme.sh`、`RUNME.SH` 或 `Runme.SH`\
  \ 将无法运行。shell 将这些名称中的每一个解释为不同的文件。\n\n这条规则也适用于目录名。如果你正在调用 `/home/rtracy/runme.sh`，那么你必须使用完全的大小写输入命令。`/Home/Rtracy/Runme.sh`\
  \ 将引导 shell 指向系统中完全不同的地方。\n\n随着你 Linux 经验的增加，你会发现它包含了一些非常强大的命令和实用，你将反复使用它们。其中一些包括：\n\
  \n### **练习 2-2：使用 Linux 命令**\n\n在此练习中，你将学习如何从 shell 提示符使用常用的 Linux 命令。你可以使用随书提供的虚拟机进行此练习。运行快照\
  \ 2-1 获取正确配置的环境。\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看 练习 2-2 视频演示如何执行此任务。\n\
  \n完成以下操作：\n\n1. 启动你的 Linux 系统到 shell 环境。\n2. 如果你的系统启动到图形界面，请以用户 **student** 登录，密码为\
  \ **student**，按下 CTRL-ALT-F1。\n3. 在登录提示符处，以用户 **student** 和密码 **student** 登录系统进行身份验证。\n\
  4. 在 shell 提示符处，输入 `pwd` 确定当前目录。当前工作目录是什么？\n5. 输入 `whoami` 确定当前用户。当前用户是谁？\n\n\n\n\
  6 通过输入 `ls` 创建当前目录下文件的列表。\n\n7. 在 shell 提示符下输入 `man ls` 获取有关 `ls`  way 程序的更多信息。\n\
  \n8 使用 PGDN 键翻阅帮助页（man page）。你可以使用哪个选项配合 `ls` 来使用长列表格式？\n\n9. 按 `Q`。\n\n10. 在 shell\
  \ 提示符下输入 `ls –l` 使用 `ls` 命令创建长列表。\n\n11. 输入 `logout` 然后按 ALT-F7。\n\n## 使用命令历史\n\n\
  bash shell 支持命令历史。每当你在 shell 提示符下输入一个命令时，该命令都会保存在家目录下的 `~/.bash_history` 文件中。该文件只是一个简单的（隐藏）文本文件，包含了你之前输入的所有\
  \ shell 命令，每行一个。每当你输入一个 shell 命令时，该文件都会不断更新。你可以通过在 shell 提示符下输入 `history` 来显示 `.bash_history`\
  \ 文件的内容。例如所示：\n\n![Images](img/p0027-01.jpg)\n\n如果你在 shell 提示符下按上方向键（UP ARROW），bash\
  \ 将读取此文件并显示你上次输入的命令。如果你反复按上方向键，就可以滚动查看最近使用的命令列表。当你到达想要的命令时，只需按 ENTER 即可执行该命令。我非常喜欢这个功能，特别是当我需要重新输入一个非常长且复杂的命令时。只需一直按上方向键直到显示所需的命令，然后按\
  \ ENTER 即可！\n\n如果你不想翻阅所有历史命令来寻找所需的命令，也可以输入所需命令的一部分然后按 CTRL-R。bash shell 将搜索你的命令历史并显示最近的匹配命令。\n\
  \n你可以使用以下环境变量来管理历史文件中的条目：\n\n![images](img/bull.jpg) `HISTSIZE` 或 `HISTFILESIZE`\
  \ 配置你的历史文件大小。在大多数发行版中，这被设置为 1,000 个条目。你可以通过更改此变量的值来自定义历史文件的大小。\n\n![images](img/bull.jpg)\
  \ `HISTCONTROL` 控制命令历史的存储方式。你可以将此变量设置为 `ignoredups`、`ignorespace`、`ignoreboth` 或\
  \ `erasedups` 值。`ignorespace` 值告诉 shell 忽略历史中以空格开头的命令。`ignoredups` 值告诉 shell 忽略历史中的重复命令。`ignoreboth`\
  \ 值同时指定了 `ignorespace` 和 `ignoredups`。你还可以将此变量设置为 `erasedups` 值以移除历史文件中所有的重复条目。\n\
  \n***\n\n![Imags](img/note.jpg)\n\n**注意** 我们将在本章的稍后部分更讨论讨论环境变量。\n\n让我们在下面的练习中练习使用命令历史。\n\
  \n### 练习 2-3：使用命令历史\n\n在此练习中，你将练习在 bash shell 中使用命令历史。你可以使用书中附带的虚拟机进行此练习。运行快照 2-1\
  \ 以获得正确配置的环境。\n\n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看 练习 2-3 视频，演示如何执行此任务。\n\
  \n完成以下操作：\n\n1. 启动你的 Linux 系统到 shell 提示符。如果你的系统启动了图形界面，请以 `student` 用户登录，密码为 `student`，然后按\
  \ CTRL-ALT-F1。\n2. 使用密码 `student` 以 `student` 用户身份对系统进行身份验证。\n3. 在 shell 提示符下，输入\
  \ `ls –l /var/log`。\n4. 在 shell 提示符下，输入 `pwd`。\n5. 在 shell 提示符下，输入 `whoami`。\n6.\
  \ 通过按三次上方向键然后按 ENTER，再次运行步骤 3 中的 `ls` 命令。\n7. 使用上方向键再次运行 `pwd` 命令。\n8. 使用上方向键再次运行\
  \ `whoami` 命令。\n9. 输入 `logout` 然后按 ALT-F7。\n\n除了命令历史外，bash shell 还提供了命令补全功能。让我们接下来来讨论这个功能。\n\
  \n## 使用命令补全\n\n除了命令历史，我也喜欢 bash shell 提供的命令补全功能。当你需要在命令行中输入非常长的文件名时，这个功能非常有帮助。命令补全功能允许你在\
  \ shell 提示符下输入命令时只需按 TAB 键即可。当你这样做时，bash shell 会“猜”你想输入什么，然后自动为你完成命令。\n\n例如，假设 `/tmp`\
  \ 目录下存在一个名为 `vmware-linux-tools.tar.gz` 的文件。我需要解压这个 tar 归包以便安装它包含的应用程序。如果我愿意，可以在\
  \ shell 提示符下输入完整命令 `tar –zxvf /tmp/vmware-linux-tools.tar.gz`，tar 就会为我解压文件。（我们将在第\
  \ 10 章中详细讨论 `tar` 命令的工作原理。）\n\n然而，如果你像我一样，手指并不总是听话。我在输入命令时经常会拼错，特别是像这个示例中处理长文件名时。为了防止这种情况，可以使用命令补全来帮我完成输入。在这个示例中，我在\
  \ shell 提示符下输入 `tar –zxvf /tmp/vmw` 然后按 TAB 键。当我这样做时，bash shell 查看 `/tmp` 目录中以 `vmw`\
  \ 开头的文件，并判断我可能指的是 `vmware-linux-tools.tar.gz` 文件。然后它会将此文件名添加到命令末尾。我所做的就是按 ENTER。命令补全太棒了！\n\
  \n让我们在下面的练习中练习使用命令补全。\n\n### 练习 2-4：使用命令补全\n\n在此练习中，你将练习在 bash shell 中使用命令补全。你可以使用书中附带的虚拟机进行此练习。运行快照\
  \ 2-1 以获得正确配置的环境。\n\n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看 练习 2-3 视频，演示如何执行此任务。\n\
  \n完成以下操作：\n\n1. 启动你的 Linux 系统到 shell 提示符。如果你的系统启动了图形界面，请以 `student` 用户登录，密码为 `student`，然后按\
  \ CTRL-ALT-F1。\n2. 使用密码 `student` 以 `student` 用户身份对系统进行身份验证。\n3. 输入 `su –` 后输入密码\
  \ `student` 切换到 root 用户。\n4. 在 shell 提示符下，输入 `tail /var/log/m`，但不要按 ENTER。\n5. 按两次\
  \ TAB 键。应该显示 /var/log/ 中所有以 *m* 开头的文件列表。\n6. 给命令添加一个 `e`，但不要按 ENTER。你的命令提示符应该显示\
  \ `tail /var/log/me`。\n7. 按 TAB 键。命令应该自动显示 `tail /var/log/messages`。\n8. 按 ENTER\
  \ 执行命令。\n9. 输入 `logout` 然后按 ALT-F7。\n\n## 获取 Linux Shell 命令的帮助\n\nLinux 的伟大之处之一是文档和帮助信息供你使用。任选一个\
  \ Linux 操作系统任务或工具，你可能都能找到能教你如何完成所需操作的文档。在本章中，我们将学习如何使用两个优秀的资源来获取帮助。\n\n然而，在这样做之前，你需要了解关于\
  \ Linux 文档材料的一些关键点。首先，提供你 Linux 发行版的供应商可能会提供某种通用系统文档供你使用。然而，这些系统文档可能非常少。（对于某些发行版，可能根本不存在）。\n\
  \n\n\n\n\n这是因为你在 Linux 发行版上安装的每个服务或应用程序通常包含该特定程序的文档。如果你考虑随 Linux 分发的所有不同软件包，你会发现，对于\
  \ Linux 供应商来说，尝试开发他们自己的描述如何使用所有这些软件包的文档，将是一项极其艰巨的任务。相反，他们依赖开源社区的其他人来为所有可以在 Linux\
  \ 上使用的各种应用程序和服务编写文档。\n\n这引出了你在处理 Linux 文档时需要需要记住的第二点：编写特定服务或实用程序的程序员很可能就是编写相关文档的人。只有少数\
  \ Linux 软件文档实际上是由专业技术撰稿员编写的。这意味着不同软件之间的文档质量存在巨大差异。有些程序员非常擅长编写文档，他们写得很好，并且理解如何以易于理解的方式来组织信息。\n\
  \n遗憾的是，其他程序员并不擅长编写文档。事实上，他们编写软件文档的能力可能非常糟糕。他们犯的首要错误是，假设读者的知识水平与他们一样。（这在某种程度上构成了某种矛盾。如果读者的知识水平和作者一样，那么他或她就不需要文档了，对吧？）这种文档往往是不完整的，而且通常没有帮助。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 如果你遇到这种情况并且有额外的时间，大多数程序员都乐意有人志愿者帮助为他们的产品编写文档。正如你在本章后面将看到的，大多数\
  \ Linux 帮助源包含一个联系电子邮件地址，你可以用它来联系作者。\n\n你需要记住的第三点是，大多数 Linux 文档源不是基于打印的。在 Linux 的早期阶段，许多发行版确实包含一本厚厚的印刷版用户手册。我于\
  \ 1995 年安装的第一个 Linux 发行版（Caldera OpenLinux 1.0 版本）就包含了这样一本手册。然而，今天，印刷手册已非常罕见。正如你可以想象的，打印这种规模的手册非常昂贵，而且消耗大量的纸。因此，目前几乎所有的\
  \ Linux 发行版文档源都是以电子格式提供的。\n\n***\n\n![Images](img/examtip.jpg)\n\n**考试技巧** 知道在处理\
  \ Linux 时如何获取帮助是 Linux 管理员工作角色的关键部分。当问题发生时，你必须能够快速找到答案。因此，在 Linux+ 和 LPIC-1 考试中，你能够证明自己知道如何使用各种获取帮助的工具。你需要非常熟悉使用\
  \ `man` 和 `info` 来查找信息。你需要知道如何启动实用程序、在显示的信息中导航以及退出。\n\n在本章的这一部分，你将介绍在处理 Linux 时获取帮助的各种源。将涵盖以下主题：\n\
  \n![images](img/bull.jpg) 使用 man 页\n\n![images](img/bull.jpg) 使用 info\n\n让我们从讨论如何使用\
  \ `man` 为你的 Linux 系统获取帮助开始。\n\n#### 使用 man 页\n\n维护 Linux 系统文档的主要方法之一是通过使用手册页（man\
  \ pages）。这些手册页包含了有关操作系统本身以及安装在系统上的任何应用程序的文档。这些 man 页是使用一个名为 `man` 的工具查看的。\n\n`man`\
  \ 工具最初是由 UNIX 操作系统开发和使用的。它被移植到 Linux，并提供了与 UNIX 系统上相同的功能。它可以用于显示特定 Linux 命令、实用程序或文件的手册页。\n\
  \n在管理 Linux 系统时，`man` 工具是一个极其有用的工具。想想，即使在最基本的 Linux 系统上，也有许多命令和实用程序。某些命令和实用程序被频繁使用；而另一些极少使用。对于普通\
  \ Linux 管理员来说，记住每一个可能的命令和实用程序所使用的语法和选项是非常困难的，尤其是那些你不经常使用的工具。\n\n`man` 工具是一个真正的救救星。如果你在处理某个特定命令或实用程序时感到无措，你可以使用\
  \ `man` 显示相应的手册页并提醒自己如何使用它。我喜欢 `man`\n\n除了系统命令和实用程序外，系统中的大多数软件包也维护了 man 页。每当你在 Linux\
  \ 上安装一个软件包时，包含该软件文档的 man 页也会被安装。这允许你使用 `man` 来查看这些软件包的文档。\n\n在本章的这一部分，我们将回顾与 man\
  \ 相关的以下主题：\n\n![images](img/bull.jpg) man 目录结构\n\n![images](img/bull.jpg) 手册章节\n\
  \n![images](img/bull.jpg) 使用 man 查看文档\n\n### man 目录结构\n\n`man` 显示的实际页面维护在 `MANPATH`\
  \ 环境变量指定的目录下的几个目录中。在 64 位的 openSUSE Linux 系统上，`MANPATH` 变量设置为 `/usr/lib64/mpi/gcc/openmpi/share/man`、`/usr/local/man`\
  \ 和 `/usr/share/man` 目录。\n\n你可以在 shell 提示符处输入 `echo $MANPATH` 来检查系统上 `MANPATH` 变量的值。当你这样做时，会显示环境变量列表。`MANPATH`\
  \ 变量列出了包含 man 页的目录，每个目录用冒号分隔，所示：\n\n![Images](img/p0031-01.jpg)\n\n需要注意的是，`man`\
  \ 工具在不同的 Linux 发行版上有不同的实现方式。例如，Fedora 发行版默认不使用 `MANPATH` 环境变量。相反，它使用 `/etc/man_db.conf`\
  \ 文件中的 `MANPATH_MAP` 指令来指定存储 man 页的目录。此配置的示例如图 2-3 所示。\n\n![Images](img/f0032-01.jpg)\n\
  \n**图 2-3 在 Fedora 的 /etc/man_db.conf 中配置 man 目录\n\n在 `MANPATH` 变量或 `/etc/man_db.conf`\
  \ 中 `MANPATH_MAP` 指令指定的目录下，有一系列由 `man1`、`man2`、`man3` 等命名的目录，所示：\n\n![Images](img/p0032-01.jpg)\n\
  \n某些目录并未用于手册章节。像 `hu`、`it` 和 `jp` 这样的目录用于翻译成英语以外语言的 man 页。\n\n`MANPATH` 变量在 Ubuntu\
  \ 发行版上也没有默认设置。在 Ubuntu 上可以使用 `man -w` 命令显示路径。\n\n### 手册章节\n\n包含在各种 man 目录中的所有 man\
  \ 页共同成了*手册*（manual）。上面所示的每个目录都代表手册的一个*章节*（section）。man 页作者所使用的标准将手册分为表 2-2 所示的章节。\n\
  \n![Images](img/t0033-01.jpg)\n\n**表 2-2 man 页中使用的章节**\n\n手册页根据它们关联的软件类型被分类并存储在相应的目录中。你在书中将使用的许多\
  \ man 页将存储在第 1 节：Shell 命令和第 8 节：管理工具。\n\n### 使用 man 查看文档\n\n使用 `man` 查找信息非常简单。你只需要输入\
  \ `man` 后紧跟你需要获取信息的实用程序名称即可。\n\n\n\n\n\n例如，`ls` 命令是一个非常有用的 shell 命令，你可以用它显示目录下的文件列表。它可以使用多种选项，以自定义它的工作方式以及返回数据的显示方式。你如何知道这些选项是什么以及如何使用它们呢？你可以使用\
  \ `man` 工具来显示 `ls` 命令的手页。只需在 shell 提示符下输入 `man ls` 即可。执行后，屏幕将显示图 2-4 所示的内容。\n\n\
  ![Images](img/f0033-01.jpg)\n\n**图 2-4** 查看 ls 工具的手页\n\n一个特定的帮助页由几个元素组成，如图 2-4 所示。某些帮助页包含许多章节，而另一些只包含少数几个。大多数帮助页包含以下内容：\n\
  \n![images](img/bull.jpg) **标题** 标题部分是帮助页的第一行。它列出了帮助页中讨论的工具、命令或文件的名称，随后是章节号。在图 2-4\
  \ 中，注意第一行显示为 `LS(1)`。这表示该帮助页描述的是 `ls` 工具，并位于手册第 1 节。记得表 2-2，手册第 1 节包含了 Linux 系统上所有用户都可以使用的命令和工具的帮助页。\n\
  \n![images](img/bull.jpg) **NAME** NAME 部分仅显示命令、文件或工具的名称以及关于其用途的简短摘要。在图 2-4 中，NAME\
  \ 部分表明 `ls` 工具用于列出目录内容。\n\n![images](img/bull.jpg) **SYNOPSIS** SYNOPSIS 部分简要描述了使用特定命令或工具的语法。如果帮助页文档的是一个配置文件（如\
  \ `smb.conf`），SYNOPSIS 部分将提供该文件用途的简要概述。在图 2-4 中，`ls` 工具帮助页的 SYNOPSIS 部分显示了从 shell\
  \ 提示符使用该命令的语法。它告诉你可以输入 `ls` 后紧跟一系列可能的选项和文件名。\n\n![images](img/bull.jpg) **DESCRIPTION**\
  \ DESCRIPTION 部分提供了帮助页的核心内容。该部分详细描述了命令、文件或工具的工作原理。它还提供了可以使用的选项列表。例如，在图 2-4 中，帮助页指定你可以配合\
  \ `ls` 工具使用 `-a` 或 `--all` 选项来显示文件系统中的隐藏目录和文件，以及普通文件和目录。如果没有帮助页，你可能永远不知道可以在 `ls`\
  \ 中使用 `-a` 选项！\n\n***\n\n![Images](img/examtip.jpg)\n\n**考试提示** Linux 隐藏文件和目录的名称以点开头。\n\
  \n![images](img/bull.jpg) **AUTHOR** AUTHOR 部分显示编写帮助页中所引用的命令、工具或服务的程序员的名称。在图 2-5\
  \ 中，`ls` 工具显示了这一内容。\n\n![images](img/bull.jpg) **REPORTING BUGS** REPORTING BUGS\
  \ 部分提供了一个电子邮件地址，你可以用它报告在工具或文档中发现任何 bug，如图 2-5 所示。\n\n![images](img/bull.jpg) **COPYRIGHT**\
  \ COPYRIGHT 部分提供了关于谁拥有帮助页引用的命令、工具或服务版权的详细信息。它还提供了再分发信息，如图 2-5 所示。\n\n![images](img/bull.jpg)\
  \ **SEE ALSO** SEE ALSO 部分提供了一个与当前帮助页相关的帮助页或其他资源的列表。例如，在图 2-5 中，SEE ALSO 部分引导用户使用\
  \ `info` 来查看 `ls` 命令的完整文档。\n\n![images](img/bull.jpg) **版本号和修订日期** 帮助页的最后一行显示了程序的版本号和修订日期。\n\
  \n![Images](img/f0035-01.jpg)\n\n**图 2-5** 查看 ls 工具的其他帮助页章节\n\n除 NAME 之外，所有章节都是可选的。如果某个特定程序需要，作者可以自由添加上述列表中未显示的新章节。你可能会看到其他工具或服务的帮助页，其中包含\
  \ OPTIONS（选项）、FILES（文件）、ENVIRONMENT（环境变量）和 DIAGNOSTICS（诊断）等章节。\n\n当你使用 `man` 显示帮助页时，屏幕底部会显示一个状态指示器。该状态指示器告诉你正在显示哪个帮助页、当前显示的行以及你处于文档的什么位置。该状态指示器如图\
  \ 2-5 所示。在此示例中，状态指示器显示正在显示 `ls(1)` 页。它还指示第 224 行是当前的顶部，且当前显示的文本位于整个文档约 99% 处。\n\n\
  显示帮助页后，可以使用表 2-3 所示的按键在页面内导航。\n\n![Images](img/t0035-01.jpg)\n\n**表 2-3** 帮助页使用的按键\n\
  \n某些帮助页短小简洁；另一些则非常长且详细。在查看帮助页时，你可能需要在页面内搜索特定术语。\n\n例如，如果你正在使用 `ls` 命令，你可能需要查看有关文件系统中文件和目录的扩展信息。注意图\
  \ 2-4，默认情况下 `ls` 只显示当前目录下的文件或目录名称。如果你需要查看扩展信息，如权限、所有者、文件大小或修改日期怎么办？这被称为*长列表格式*。哪一个\
  \ `ls` 选项可以以此格式化输出？\n\n你可以通过输入正斜杠 `/` 后跟要搜索的术语在帮助页中搜索特定信息。例如，要查找如何从 `ls` 获取长列表格式，可以通过输入\
  \ `man ls` 加载 `ls` 的帮助页。然后输入 `/long` 在帮助页中搜索字符串“long”。这如图 2-6 所示。\n\n![Images](img/f0036-01.jpg)\n\
  \n**图 2-6** 在帮助页中搜索字符串“long”\n\n当你按下回车键时，帮助页会定位到第一个“long”出现的位置。要找到下一个，只需按下 N。在按下几次\
  \ N 后，就定位到了你想要查找的项，如图 2-6 所示。如你所见，在 `ls` 工具中使用 `-l` 选项将以长格式显示输出，显示文件和目录的权限、所有者、大小和修改日期。\n\
  \n很多时候，你需要在工具的帮助页中搜索信息，但你不确定记得命令的拼写方式。记得 `man` 要求你知道命令、工具或文件的名称才能查看相关的帮助页。如果出于某种原因你不记得，可以使用两个不同的工具来跨帮助页进行搜索：\n\
  \n![images](img/bull.jpg) **man –k** 使用 `man` 的 `-k` 选项允许你搜索所有帮助页名称和描述以找到特定关键词。例如，假设你想从文件系统中删除一个目录，但不记得用哪个工具来操作。你可以在\
  \ shell 提示符下输入 `man -k “remove empty”` 查看包含“remove empty”短语的帮助页列表，如下：\n\n![Images](img/p0036-01.jpg)\n\
  \n此外注意 `rmdir` 命令可以删除目录。现在你知道了命令的名称，可以输入 `man rmdir` 来学习如何使用它。\n\n\n\n\n\n![images](img/bull.jpg)\
  \ `apropos` 实用工具的功能与 `man -k` 命令基本相同。你可以使用此工具跨帮助页（man page）名称和描述进行搜索，以定位文本字符串。例如，要搜索文本中包含“remove”字符串的帮助页，你需要输入\
  \ `apropos remove`。\n\n基于此，让我们在下面的练习中练习使用 `man`。\n\n### 练习 2-5：使用帮助页\n\n在本次练习中，你将练习使用\
  \ `man` 工具查看 Linux 实用工具的手手册。你可以使用书中附带的虚拟机进行此练习。运行快照 2-1 以获得配置正确的环境。\n\n* *\n\n![Images](img/viedo.jpg)\n\
  \n**视频** 请观看练习 2-5 视频，演示如何执行此任务。\n\n完成以下操作：\n\n1. 启动你的 Linux 系统到 shell 提示符。如果系统进入了图形界面，请以用户\
  \ `student` 登录，密码为 `student`，然后按 `CTRL-ALT-F.1`。\n2. 使用密码 `student` 身份验证为 `student`。\n\
  3. 在 shell 提示符处，输入 `man cp`。\n4. 回答以下问题：\n   - ![images](img/bull.jpg) `cp` 实用工具的作用是什么？\n\
  \   - ![images](img/bull.jpg) 与 `cp` 使用时 `-r` 选项的作用是什么？\n   - ![images](img/bull.jpg)\
  \ 谁编写了 `cp` 实用工具？\n   - ![images](img/bull.jpg) 你可以将发现的任何漏洞发送到哪个电子邮件地址？\n   - ![images](img/bull.jpg)\
  \ `cp` 位于哪一个帮助页章节？\n   - ![images](img/bull.jpg) 如果你想让 `cp` 实用工具在覆盖现有文件之前提示你，你会使用哪个选项？\n\
  5. 按 `Q` 关闭 `man`。\n6. 输入 `logout` 然后按 `ALT-F7`。\n\n### 使用 info 工具\n\n除了 `man` 之外，你还可以使用\
  \ `info` 工具查看 Linux 系统上命令、实用工具、服务和文件的文档。你可能会问：“如果我已经有了 `man`，为什么还需要 `info` 呢？”这两个工具的作用相似；但它们实现方式不同。\n\
  \n`man` 工具是一个“简单粗暴”的参考工具。帮助页堆满了信息，但它们本质上并不是说明性的。本质上，`man` 是在说：“这是该实用工具及其语法。你自己去研究如何使用它。”\n\
  \n另一方面，`info` 工具更像是一个学习工具。大多数 `info` 节点（nodes）包含与帮助页相同的信息。然而，`info` 节点通常更详细，并且实际上可以教你如何使用特定的\
  \ Linux 工具。\n\n* *\n\n![Images](img/note.jpg)\n\n**注意** 我们不称它们为*页*（pages），而是将 `info`\
  \ 工具显示的信息单元称为*节点*（nodes）。你将在本章稍后的部分就会明白为什么它们被称为节点。\n\n启动 `info` 的方式与 `man` 非常相似。你只需输入\
  \ `info` 后后跟你想要学习的命令、实用工具、服务或文件的名称即可。例如，在本章前面，你使用 `man` 查看了关于 `ls` 实用工具的信息。要使用 `info`\
  \ 学习 `ls` 实用工具，只需输入 `info ls`。当你这样做时，会显示图 2-7 中的信息。\n\n![Images](img/f0038-01.jpg)\n\
  \n**图 2-7** 使用 info 查看关于 `ls` 实用工具的信息\n\n你会立即注意到 `man` 和 `info` 之间的几处区别。`ls` 帮助页中的可用信息很少。相反，`info`\
  \ 中的可用信息要详细得多。`info` 节点解释了 `ls` 实用工具的作用以及当你使用它时可以预期的什么。\n\n注意图 2-7，info 显示的最的第一行显示了关于当前页的信息。包含该信息的文件名为\
  \ `coreutils.info`。在 `coreutils.info` 文件中，当前显示的是 `ls` 调用节点。文件中的下一个节点名为 `dir invocation`。\n\
  \n`info` 和 `man` 关键区别之一是，`info` 将信息分为节点，而 `man` 则将与特定实用工具或命令的所有信息显示在单页上。你可以使用表 2-4\
  \ 中列出的按键在 `info` 界面内部以及节点之间导航。\n\n![Images](img/t0039-01.jpg)\n\n**表 2-4** info\
  \ 导航按键\n\n就像你可以使用 `man` 工具搜索信息一样，你也可以使用 `info` 搜索信息。如果你想在显示的节点内搜索信息，请按 `CTRL-S`。当你这样做时，会显示如图\
  \ 2-8 所示的 `I–search` 提示符。在 `I-search` 提示符处，输入你想搜索的文本并按 `ENTER`。系统将显示你当前光标位置之后你所的文本的第一个实例。\n\
  \n![Images](img/f0039-01.jpg)\n\n**图 2-8** 在 info 节点中搜索信息\n\n让我们在下面的练习中练习使用 `info`。\n\
  \n### 练习 2-6：使用 info\n\n在本次练习中，你将练习使用 `info` 工具查看你的 Linux 系统的文档。你可以使用书中附带的虚拟机进行此练习。运行快照\
  \ 2-1 以获得配置正确的环境。\n\n* *\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 2-6 视频，演示如何执行此任务。\n\
  \n完成以下操作：\n\n1. 如果你还没有，请启动你的 Linux 系统并登录。\n2. 如果必要，启动终端会话。\n3. 在 shell 提示符处，输入 `info\
  \ rm`。\n4. 回答以下问题：\n   - ![images](img/bull.jpg) `rm` 实用工具的作用是什么？\n   - ![images](img/bull.jpg)\
  \ 与 `rm` 使用时 `-v` 选项的作用是什么？\n   - ![images](img/bull.jpg) `rm` 文档位于哪个节点？\n   - ![images](img/bull.jpg)\
  \ 当前节点之前是哪个节点？\n   - ![images](img/bull.jpg) 当前节点之后是哪个节点？\n   - ![images](img/bull.jpg)\
  \ 如果你想让 `rm` 实用工具在删除每个文件之前提示你，你会使用哪个选项？\n   - ![images](img/bull.jpg) 如果你想确保删除的文件无法被恢复，`rm`\
  \ 是正确的实用工具吗？\n5. 按 `Q` 关闭 `info`。\n\n现在你已经知道如何使用 `bash` shell 了，让我们来谈谈你需要知道如何用它完成的一些任务。下一个主题将涉及环境变量的操作。\n\
  \n### 环境变量的操作\n\n每当你启动 `bash` shell 时，都会使用几个不同的变量来定义 shell 正常运行所需的关键参数。因为这些变量定义了\
  \ shell 环境，所以它们被称为*环境变量*（environment variables）。在本章的这部分中，我们将花一些时间讨论环境变量。具体来说，我们将涵盖以下主题：\n\
  \n- ![images](img/bull.jpg) 什么是环境变量？\n- ![images](img/bull.jpg) 管理环境变量\n- ![images](img/bull.jpg)\
  \ 创建用户定义变量\n\n让我们从复习什么是环境变量开始。\n\n#### 什么是环境变量？\n\n在理解什么是环境变量之前，你必须先理解什么是变量本身。描述变量最好的方法是想象一个桶，里面可以存储各种物质。这个桶有一个名字，例如“MyStuff（我的东西）”，你可以向往里面装满沙子、石头、水、土壤等。如果桶里已经满了某种物质（如沙子），在向里面装入另一种物质（如石头）之前，你必须先将其清空。\n\
  \n这本质上就是 Linux 系统中变量的工作方式。它是你系统内存中的一个预留区域，用于存储你想要放入其中的任何值。本质上，它就像内存中的一个“桶”。就像在倒入新物质之前必须清空真实的桶一样，你也必须在给变量分配新值之前先清空它。在你的\
  \ Linux 系统上，你可以定义并使用两种类型的变量：\n\n\n\n\n\n![images](img/bull.jpg) 用户定义变量\n\n![images](img/bull.jpg)\
  \ 环境变量\n\n用户定义变量顾名如此。它们是你自己在内存中创建的“桶”。你可以为用户定义变量分配你喜欢的名称，也可以为它们分配任何想要的内容。在处理 shell\
  \ 脚本时，用户定义变量非常有用，这将在后的第 14 章中讨论。\n\n另一方面，环境变量是由操作系统本身初始创建、命名并填充的。正如名称所示，环境变量用于配置系统的计算环境。你从\
  \ shell 提示符运行的程序经常会访问和使用环境变量。使用存储在这些变量中的信息可以让程序变得更加灵活和健壮。\n\n例如，假设你在 shell 提示符处输入了\
  \ `cd ~` 命令。该命令会将 shell 的当前目录切换到用户的主目录，无论当前登录的是哪个用户。\n\n例如，假设我使用 `rtracy` 用户账户登录我的\
  \ Linux 系统。默认情况下，我的主目录是 `/home/rtracy`。如果我在以 `rtracy` 身份登录时输入 `cd ~` 命令，当前目录将更改为\
  \ `/home/rtracy`。注意，命令中任何地方都没有指定路径 `/home/rtracy`。`cd` 命令只是“知道” `~` 指向 `/home/rtracy`。然而，如果我以\
  \ `ksanders` 用户身份登录，相同的 `cd ~` 命令就不会带我进入 `/home/rtracy`。相反，当前目录将更改为 `/home/ksanders`。\n\
  \n问题是，`cd` 命令是如何知道切换到文件系统中的哪个目录的？`cd` 命令检查了名为 `HOME` 的环境变量的值。如你看到的，`HOME` 环境变量的值设置为当前用户的主目录路径：\n\
  \n![Images](img/p0041-01.jpg)\n\n由于 `rtracy` 当前已登录，`HOME` 的值被设置为 `/home/rtracy`。但是，如果我以名为\
  \ `ksanders` 的用户登录，`HOME` 环境变量的值会被系统更改为 `/home/ksanders`。如下所示：\n\n![Images](img/p0041-02.jpg)\n\
  \n你的 Linux 系统定义了许多环境变量，比如我们刚刚查看的 `HOME` 变量。在大多数 Linux 发行版中常用的一些更相关的环境变量列表 2-5 中。\n\
  \n![Images](img/t0042-01.jpg)\n\n**表 2-5 常用环境变量**\n\n现在你已经了解什么是环境变量以及 Linux 系统上常用的变量名称，接下来让我们讨论一下如何管理你的环境变量。\n\
  \n## 管理环境变量\n\n在大多数情况下，系统分配给环境变量的值对于大多数任务来说足够了。然而在某些情况下，你可能需要操作分配给环境变量的值。要做到这一点，你需要知道如何管理它们。在本节中，我们将讨论如何进行操作。将涉及以下主题：\n\
  \n-   ![images](img/bull.jpg) 查看变量及其值\n-   ![images](img/bull.jpg) 设置变量的值\n-   ![images](img/bull.jpg)\
  \ 使变量持久化\n\n让我们从讨论如何查看变量的值开始。\n\n### 查看变量及其值\n\n如果你需要查看系统中分配给某个变量的值，可以在 shell 提示符处使用多种不同的命令。如果你需要查看单个变量的值，可以使用\
  \ `echo` 命令。语法是 `echo $variable`。例如，如果我想查看 `PATH` 变量的值，我会在 shell 提示符处输入 `echo $PATH`。如下所示：\n\
  \n![Images](img/p0042-01.jpg)\n\n如你所示，`PATH` 变量的内容显示在屏幕上。注意，当你使用 `echo` 命令时*必须*在变量名之前放置\
  \ `$`。这非常重要。`$` 字符告诉 `echo` 命令后面的文本不是字面字符串，而是变量的名称，`echo` 应该检索该变量的值并显示在屏幕上。如果你省略了\
  \ `$` 字符，`echo` 命令将在屏幕上显示你的变量名。例如，如果你在 shell 提示符处输入 `echo PATH`，`echo` 命令将简单地在屏幕上显示“PATH”。这是因为它不知道“PATH”是一个变量的名称。`echo`\
  \ 命令认为你想要显示文本字符串“PATH”。因此，在使用 `echo` 配合变量时，不要忘记 `$` 字符！\n\n正如你刚刚看到的，`echo` 在屏幕上显示变量内容方面效果非常好。然而，它只能显示你指定的变量。这意味着你必须知道想要查看的变量的名称。如果你不知道变量的精确名称怎么办？如果你想一次查看所有变量怎么办？\n\
  \n在这些情况下，你可以使用其他 shell 命令来查看变量及其关联的值。其中之一是 `set` 命令。如果你在 shell 提示符处输入 `set`，所有的变量（包括环境变量和用户定义变量）都会显示在屏幕上。由于\
  \ `set` 的输出可能很长，你应该配合 `set` 使用 `| more`，以便逐页暂停显示输出（我们将在本章后面讨论重定向）。例如，在图 2-9 中，在\
  \ shell 提示符处执行了 `set | more` 命令。\n\n![Images](img/f0043-01.jpg)\n\n**图 2-9 使用 set\
  \ 查看环境变量及其值**\n\n如你所示，每个变量都同其关联的值一起显示。除了 `set` 命令，你还可以使用 `env` 命令查看系统的环境变量。与 `set`\
  \ 一样，`env` 的输出可能很长，因此你应该在命令后附加 `| more` 以逐页暂停显示。在图 2-10 中，执行了 `env` 命令。\n\n![Images](img/f0044-01.jpg)\n\
  \n**图 2-10 使用 env 查看环境变量及其值**\n\n与 `set` 一样，`env` 命令显示每个变量及其当前值。但注意，`env` 没有对变量进行排序。`set`\
  \ 命令实际上按字母顺序对变量进行排序，我很喜欢这一点！\n\n这些命令——`echo`、`set` 和 `env`——都可以用于向你显示变量及其值。然而，如果你需要更改分配给变量的值怎么办？让我们讨论如何实现。\n\
  \n### 设置变量的值\n\n正如我们之前讨论的，Linux 系统上使用的大多数环境变量使用系统分配给它们的值运行良好。事实上，有很多环境变量是不应该更改的！例如，更改\
  \ `HOSTNAME` 变量的值可能会导致系统上运行的许多服务出现问题。\n\n然而，有时你需要更改分配给环境变量的值。例如，你可能需要在 `PATH` 变量的末尾添加额外的目录。这是一种让用户（以及你本人）生活更方便的方法。此外，你可能需要编辑\
  \ `DISPLAY` 变量以配置你的 X Window 系统将其显示发送到远程计算机。同样，你可能想更改 shell 提示符以显示不同的信息。\n\n要完成这些任务，你需要更改环境变量的值。这相对容易。只需在\
  \ shell 提示符处输入 `variable=value` 即可。例如，假设你在 `/var/opt/mydb` 安装了一个名为 `myapp` 的应用程序。该路径目前不在你的\
  \ `PATH` 变量中，你想添加它，这样当你想要运行程序时就不需要使用完整路径。要做到这一点，你可以在 shell 提示符处输入 `PATH=$PATH:/var/opt/mydb`。\n\
  \n\n\n\n请注意，我在变量赋值中指定了 `$PATH`。这在新值赋值中包含了 `PATH` 变量的当前值。然后，我在现有路径列表的末尾添加了 `:/var/opt/mydb`。如果你在重新赋值时不包含\
  \ `$PATH`，那么你 `PATH` 变量中的当前目录将被`擦除`，并被你在命令中指定的新路径所取代！当这种情况发生时，你的系统将开始遇到一系列问题！\n\n\
  ***\n\n![Imags](img/note.jpg)\n\n**注意** 请记住，设置环境变量的值将擦除其当前内容。如果你想保留当前内容，请使用刚刚显示的技术。如果你确实想删除变量的内容并将其替换为新值，只需在\
  \ shell 提示符处输入 `variable=*value` 即可。\n\n然而，我们还有一个任务需要完成。我们已经分配了 `PATH` 的值以包含一个额外的目录。但是，`PATH`\
  \ 变量的新值仅适用于当前的 shell 会话。如果我打开另一个终端会话，我对 `PATH` 所做的更改将不会生效。\n\n为了让赋值适用于所有 shell，我需要导出该变量的新值。为此，我在\
  \ shell 提示符处输入 `export variable`。在这个示例中，我需要在 shell 提示符处输入 `export PATH`。之后，分配给 `PATH`\
  \ 的新值将适用于所有其他 shell，包括由当前 shell 创建的所有子 shell。\n\n### 使变量持久化\n\n然而，在这个过程中你将遇到的一个问题是：添加到环境变量的任何新值在系统重启后都会丢失。如果你所做的更改需要在跨系统重启时保持持久，那么你需要编辑在本章开头讨论过的\
  \ bash 配置文件之一，并将变量赋值命令添加到该文件中。\n\n在前面的示例中，我可能希望我的新 `PATH` 变量值赋值在每次系统重启时都自动执行。我不希望每次系统重启时都要手动设置\
  \ `PATH` 的值并将其导出。\n\n为了实现这一点，可以使用命令将 `PATH` 的值设置为包含 `/var/opt/mydb`，以及将导出 `PATH`\
  \ 变量命令添加到以下 bash 配置文件之一：\n\n![images](img/bull.jpg) ~/.bashrc\n![images](img/bull.jpg)\
  \ /etc/profile\n![images](img/bull.jpg) ~/.bash_profile\n![images](img/bull.jpg)\
  \ ~/.bash_login\n![images](img/bull.jpg) ~/.profile\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** 将命令添加到如 `/etc/profile` 之类的全局 bash 配置文件中将导致更改适用于所有用户。如果你只想对单个用户应用更改，应该使用在该用户家目录下找到的相应\
  \ bash 配置文件。\n\n你需要确定你的特定发行版使用哪些文件。例如，你可以修改 `ksanders` 用户家目录下 `~/.bash_profile`\
  \ 文件中的以下命令：\n\n![Images](img/p0045-01.jpg)\n\n现在，每当系统启动且 `ksanders` 登录时，`/var/opt/mydb`\
  \ 路径都会自动添加到他的 `PATH` 环境变量中。由于我们将命令添加到了 `ksanders` 用户家目录下的 `~/.bash_profile` 文件，因此它不会被添加到任何其他用户的\
  \ `PATH` 变量中。\n\n让我们在下面的练习中练习操作环境变量。\n\n### 练习 2-7：使用环境变量\n\n在此练习中，你将练习 bash shell\
  \ 中操作环境变量。你可以使用随本书附的虚拟机进行此练习。运行快照 2-1 以获得配置正确的环境。\n\n***\n\n![Images](img/viedo.jpg)\n\
  \n**视频** 请观看 练习 2-7 视频，演示如何执行此任务。\n\n完成以下操作：\n\n1. 如果还没有这样做，请启动你的 Linux 系统并登录。\n\
  2. 如果必要，启动终端会话。\n3. 通过输入 `su –` 以及你的 root 密码切换到 root 用户账户。\n4. 在 shell 提示符处，通过输入以下命令查看环境变量的值：\n\
  ```bash\necho $PWD\necho $HOME\necho $EUID\necho $PATH\necho $PS1\n```\n5. 通过执行以下操作更改你的\
  \ shell 提示符，以显示当前登录的用户、Linux 主机名称、当前时间、当前工作目录的完整路径以及冒号：\n   a. 在 shell 提示符处输入 `PS1=\"\
  [\\u@\\h \\t \\w]:\"`。提示符应该立即发生变化。\n   b. 在 shell 提示符处输入 `export PS1`。\n   c. 在你的\
  \ shell 提示符处输入 `ls ~a`。如果你想让对 `PS1` 环境变量的更改持久化，在你特定的发行版中你会编辑哪个文件？\n\n考虑到这一点，现在让我们讨论创建用户定义变量。\n\
  \n#### 创建用户定义变量\n\n在上一个主题中，我们关注的是操作环境变量。这些变量在每次系统启动时都会自动为你定义。然而，你实际上也可以创建你自己的自定义变量。其实现方法与管理环境变量的方法完全相同。只需在\
  \ shell 提示符处输入 `variable=*value` 即可。\n\n例如，假设我想创建一个名为 `ME` 的变量，并将其设置为值“Robb Tracy”。我可以在\
  \ shell 提示符处输入 `ME=\"Robb Tracy\"` 来实现这一点。一旦我这样做，我的系统中就会添加一个名为 `ME` 的变量，并将其设置为值\
  \ Robb Tracy。你可以使用 `echo` 命令查看 `ME` 变量的值，如下所示：\n\n![Images](img/p0047-01.jpg)\n\n\
  与环境变量一样，用户定义变量仅适用于当前的 shell 实例。要让它适用于其他 shell（包括由当前 shell 创建的子 shell），你需要使用 `export`\
  \ 命令将其导出。在这个示例中，我将在 shell 提示符处输入 `export ME` 来执行此操作。除了 `echo` 之外，你还可以像处理环境变量一样，使用\
  \ `set` 或 `env` 来查看用户定义变量。\n\n与环境变量一样，你可以通过将相应的命令添加到之前讨论过的 bash 配置文件之一使用户定义变量持久化。在创建用户定义变量时，请记住以下规则：\n\
  \n- 变量名可以包含字母或数字，但不能以数字开头。\n- 变量名可以包含连字符 (-) 或下划线字符 (_)。\n- 虽然不是强制，但你应该尽量在命名变量时使用所有大写字母。注意当你输入\
  \ `set` 或 `env` 时，你系统中所有的环境变量都使用大写字母命名。你也应该这样做。\n\n我们需要处理的下一个主题是别名（aliases）。让我们接着讨论别名如何工作。\n\
  \n#### 使用别名\n\n别名非常酷。一个 `alias` 基本上是通向你 Linux 系统上不同文件或命令的快捷方式。当你的系统启动时，系统会自动为你创建一系列别名。你可以通过在\
  \ shell 提示符处输入 `alias` 来查看这些别名。示例所示：\n\n![Images](img/p0047-02.jpg)\n\n注意列出的系列命令并不是真正的命令。相反，它们是指向真实\
  \ shell 命令的别名。例如，如果你在 shell 提示符处输入 `dir`，`alias` 的输出会告诉你实际上运行的是 `ls –l` shell 命令。同样，输入\
  \ `..` 实际上会执行 `cd ..` 命令。\n\n你也可以创建自己的别名。要这样做，只需在 shell 提示符处输入 `alias name=\"command\"\
  `。例如，假设你希望能够在 shell 提示符处通过输入 `ldir` 来查看目录的详细列表。你可以在 shell 提示符处输入 `alias ldir=\"\
  ls –l\"`，如下所示：\n\n![Images](img/p0048-02.jpg)\n\n\n\n现在，如果你在 shell 提示符输入 `ldir`，就会执行\
  \ `ls –l` 命令并将其输出显示在屏幕上，如下所示：\n\n![Images](img/p0048-03.jpg)\n\n你可以在单个别名（alias）中包含多个命令。要做到这一点，请在别名命令行中使用分号（;）将命令隔开。例如，如果你想创建一个别名，功能是挂载插入光驱驱动器的\
  \ DVD，然后生成其包含的文件的详细列表，你可以在 shell 提示符输入以下内容：\n\n```bash\nalias mntdvd=\"mount –t\
  \ iso9660 /dev/sr0 /media/dvd;ls –l /media/dvd\"\n```\n\n完成此操作后，你可以在 shell 提示符输入\
  \ `mntdvd` 来挂载 DVD 并生成其文件列表。\n\n与变量一样，你通过 `alias` 命令定义的任何别名都不是持久的。如果你重启系统，当系统启动后这些别名将会消失。与变量一样，你可以通过将别名添加到\
  \ `bash` 配置文件之一（系统范围范围或特定用户）来使别名持久化。\n\n让我们在下面的练习中练习使用别名。\n\n### 练习 2-8：使用别名\n\n\
  在此练习中，你将练习在 `bash` shell 中创建别名。你可以使用本书附带的虚拟机进行此练习。运行快照 2-1 以获得配置正确的环境。\n\n***\n\n\
  ![Images](img/viedo.jpg)\n\n**视频** 请观看练习 2-8 视频，查看如何执行此任务的演示。\n\n执行以下操作：\n\n1. 如必要，启动你的\
  \ Linux 系统并以标准用户身份登录。\n2. 打开终端会，通过输入 `su –` 切换到 root 用户账户。然后在提示时输入你的 root 密码。\n\
  3. 在 shell 提示符输入 `alias log=“tail /var/log/messages”` 创建名为 `log` 的别名，该别名将显示 `/var/log/messages`\
  \ 文件的最后几行。\n4. 在 shell 提示符输入 `alias` 并验证别名是否已创建。\n5. 在 shell 提示符输入 `log` 来测试你的别名。\n\
  6. 验证是否显示了 `/var/log/messages` 文件的最后几行。\n7. 在 shell 提示符输入 `ls ~ –a`。如果你想让别名持久化，在你特定的发行版中你会编辑哪个文件？\n\
  \n现在你已经知道了如何管理变量，是时候讨论如何重定向 shell 命令的输出了。让我们接着进行。\n\n### 使用重定向和管道\n\n`bash` shell（以及大多数其他\
  \ Linux shell）极其强大且灵活。使其具有这种特性的之一是它操作命令输入输出的能力。在本章的这部分，我们将探索如何做到这一点。具体来说，我们将涵盖：\n\
  \n![images](img/bull.jpg) 标准 bash 文件描述符\n\n![images](img/bull.jpg) 重定向 shell 命令的输出和输入\n\
  \n![images](img/bull.jpg) 管道信息\n\n让我们从复习 bash shell 文件描述符开始。\n\n#### 标准 bash 文件描述符\n\
  \n在学习如何重定向或管道 bash 命令的输出之前，你必须先 bash shell 文件描述符。对于你在 shell 提示符输入的每个命令，都有三个文件描述符可用（如图\
  \ 2-11 `stdin` 此文件描述符代表标准输入，它是提供给特定命令处理的输入。命令的 `stdin` 由数字 `0` 表示。\n\n![images](img/bull.jpg)\
  \ `stdout` 此文件描述符代表标准输出，它只是特定命令的输出。例如，由 `ls` 命令生成的目录列表就是它的 `stdout`。命令的 `stdout`\
  \ 由数字 `1` 表示。\n\n![images](img/bull.jpg) `stderr` 此文件描述符代表标准错误，即命令生成的（如果有）错误代码。命令的\
  \ `stderr` 由数字 `2` 表示。\n\n![Images](img/f0050-01.jpg)\n\n**图 2-11** bash shell 文件描述符\n\
  \n并不是所有命令都会使用这三个描述符中的全部，但很多命令都是。让我们来看一些例子。假设我通过输入 `cat ~/test2.txt` 显示我主目录下某个文件的内容，如下所示：\n\
  \n![Images](img/p0050-01.jpg)\n\n`cat` 命令在屏幕上显示文件内容。这是 `cat` 命令的 `stdout`。现在假设我输入相同的命令但指定了一个不存在的文件，如下所示：\n\
  \n![Images](img/p0050-02.jpg)\n\n因为文件不存在，`cat` 命令生成了一个错误。这是 `cat` 命令的 `stderr`。通过这些描述符，你就可以在命令执行时重定向每个描述符的去向。让我们接着讨论如何实现。\n\
  \n#### 重定向 shell 命令的输出和输入\n\n使用这三个描述符，你可以操作命令从哪里获取输入以及将其输出发送到哪里。在本章的这部分，我们将复习如何从命令行执行。我们将讨论：\n\
  \n![images](img/bull.jpg) 重定向输出\n\n![images](img/bull.jpg) 重定向输入\n\n让我们从讨论如何重定向输出开始。\n\
  \n### 重定向输出\n\n`bash` shell 允许你操作命令生成后的输出去向。默认情况下，它显示在屏幕上。但是，你可以指定将其发送到其他地方。例如，将命令的输出从屏幕重定向到文件系统的文本文件中是非常常见的，特别是当命令的输出非常长时。\n\
  \n重定向是通过命令行上的 `>` 字符实现的。重定向输出的语法为 `command output> filename_or_device`。例如，假设我们想使用\
  \ `tail` 命令查看系统日志文件 `/var/log/messages` 的最后几行，并将其输出保存到当前目录下名为 `lastmessages` 的文件中。我们可以通过输入\
  \ `tail /var/log/messages 1> lastmessages` 来实现。这告诉 shell 将 `stdout` (1) 重定向到名为 `lastmessages`\
  \ 的文件。命令的输出被真正重定向了。它完全没有显示在屏幕上。所有的 `stdout` 文本都被发送到了指定的文件，如下：\n\n![Images](img/p0051-01.jpg)\n\
  \n如果你不在命令中输入描述符数字，shell 将假设只想重定向命令的 `stdout`。在这个例子中，你可以输入 `tail /var/log/messages\
  \ > lastmessages` 并获得相同的结果。\n\n你可以使用相同的技术将 `stderr` 从屏幕重定向到文件。例如，如果我使用 `cat` 命令尝试显示一个不存在的文件，我可以通过输入\
  \ `cat myfiles.odt 2> errorfile` 将生成的任何错误消息重定向到文件。因为文件不存在，`cat` 命令生成了错误消息 (stderr)\
  \ 而不是普通输出 (stdout)。显示如下：\n\n![Images](img/p0051-02.jpg)\n\n该命令指定将 `cat` 命令的 `stderr`\
  \ (2) 重定向到当前目录下名为 `errorfile` 的文件。因为被重定向了，`stderr` 输出不会显示在屏幕上，而是写入指定的文件中。\n\n\n\n\
  \n你甚至同时将标准错误（stderr）和标准输出（stdout）重定向到文本文件。为了做到，你需要向命令添加两个重定向指令——一个针对 stdout，另一个针对\
  \ stderr。这种操作的语法是 `command 1> stdout_filename 2> stderr_filename`。这会将 stdout 发送到一个文件，将\
  \ stderr 发送到另一个文件。例如，如果你想将 `mount` 命令的 stdout 写入名为 `mntok` 的文件，将 stderr 写入名为 `mnterr`\
  \ 的文件，你只需输入 `mount 1> mntok 2> mnterr`。\n\n你也可以将两个输出都发送到同一个文件中。为此为此，请使用语法 `command\
  \ 1> filename 2> &1`。这种语法会导致 stdout 先发送到指定的文件，然后将 stderr（`2`）输出重定向到 stdout 输出（`&1`）。如果你打算使用此选项，在\
  \ `1` 之前使用 `&` 符号非常重要。这告诉 shell 随后的字符是文件描述符，而不是文件名。如果你漏掉了这个字符，shell 将把 stderr 输出写入一个名为\
  \ `1` 的独立文件。\n\n现在你已经知道如何重定向命令的输出了，接下来我们需要讨论如何重定向命令的输入。\n\n## 重定向输入\n\n就像你可以指定命令的输出发送到哪里一样，你也可以指定命令的输入（stdin）来自哪里。为此，你只需反转我们之前用于重定向输出的字符即可。你使用的语法是\
  \ `command < input_text_or_file`。\n\n例如，我可以在 shell 提示符输入 `tail < /var/log/messages`。这会将字符串“/var/log/messages”作为输入发送给\
  \ `tail` 命令。然而，对于大多数命令来说，这并不是一个非常有用的选项。在前面的示例中，直接输入 `tail /var/log/messages` 可能会更简单。当你需要向一个期望输入的命令发送大量文本时，这个选项就会真正大放异彩。\n\
  \n例如，你可以从一个文本文件将单词列表发送到 `sort` 命令并让它为你排序。我使用文本编辑器创建了一个名为 `words` 的文件，其中包含几行文本：\n\
  \n![Images](img/p0052-01.jpg)\n\n创建此文件后，我可以指定将其作为 `sort` 命令的输入。这是通过在 shell 提示符输入\
  \ `sort < words` 完成的。排序后的输出将显示在屏幕上，如下：\n\n![Images](img/p0052-02.jpg)\n\n让我们在下面的练习中练习重定向操作。\n\
  \n## 练习 2-9：重定向输入和输出\n\n你可以使用书中附带的虚拟机进行此练习。运行快照 2-1 获取配置正确的环境。\n\n* * *\n\n![Images](img/viedo.jpg)\n\
  \n**视频** 请观看练习 2-9 视频，以演示如何执行此任务。\n\n在此练习中，你将练习重定向输入和输出。完成以下操作：\n\n1. 如果必要，启动你的\
  \ Linux 系统并以标准用户登录。\n2. 输入 `su –` 并输入你的 root 密码切换到 root 用户账户。\n3. 使用 `tail` 查看 `/var/log/messages`\
  \ 文件的最后几行，然后通过输入 `tail /var/log/messages 1> lastlines` 将标准输出重定向到家目录下的文本文件中。\n4.\
  \ 输入 `ls l*` 并验证 `lastlines` 文件已创建。\n5. 在 shell 提示符输入 `cat lastlines` 使用 `cat` 命令查看\
  \ `lastlines` 文件。\n6. 在 shell 提示符输入 `tail /var/log/firewall 1> lastlines` 将 `/var/log/firewall`\
  \ 日志文件的最后内容追加到 `lastlines` 中。\n7. 在 shell 提示符输入 `cat lastlines` 再次查看 `lastlines`\
  \ 文件。你应该看到防火墙日志文件的行已添加到文件末尾。\n8. 在 shell 提示符输入 `tail /var/log/mylog 2> errorout`\
  \ 将标准错误重定向到日志文件。\n9. 在 shell 提示符输入 `cat errorout` 查看 `errorout` 文件。为什么前面的命令会产生错误？\n\
  10. 在 shell 提示符输入 `sort < lastlines` 将 `lastlines` 文件发送到 `sort` 命令的 stdin。`sort`\
  \ 命令应该按字母顺序将文件中的单词发送到 stdout（屏幕）。\n\n除了重定向命令的输入或输出外，你还可以管道输出。接下来让我们讨论如何实现这一点。\n\n\
  ## 管道信息\n\n重定向非常棒，但它有一个缺点。它只允许我们将输出重定向到文件系统中的文件或系统设备。如果你需要将一个命令的输出重定向到另一个命令的输入怎么办？这可以实现吗？绝对可以！这是通过*管道*实现的。本书的这部分解释了如何操作。\n\
  \n在 shell 提示符工作时，管道非常有用。例如，我在本书前面提到过，你可以配合命令使用 `| more`。管道字符（`|`）告诉 shell 获取第一个命令的输出并发送到下一个命令的输入。\n\
  \n如果我输入 `cat /var/log/messages | more`，`cat` 命令读取 `/var/log/messages` 的内容并发送到 stdout。通常，这将显示在屏幕上。然而，由于我们使用了管道，shell\
  \ 知道它不应该在屏幕上显示 `cat` 的 stdout。相反，它获取 `cat` 的 stdout 并将其作为下一个命令（在本例中为 `more` 命令）的\
  \ stdin。`more` 命令随后获取输出并对其进行处理。\n\n管道可以用于任何产生某种输出并接受某种输入的命令。一个很好的例子是 `grep` 命令。当然，你可以在命令行单独使用\
  \ `grep`。但是，当它在管道中与其他命令配合使用时，非常方便。命令的语法是 `command | grep expression`。这样做将第一个命令的输出管道到\
  \ `grep` 的输入中。\n\n例如，假设你正在使用 `cat` 命令在屏幕上显示 `/var/log/messages` 文件的内容。你只对显示系统网络接口启动时创建的日志文件感兴趣。你可以通过将\
  \ `cat` 的输出管道到 `grep` 并在 `cat` 的输出中搜索表达式“ifup”来过滤输出。为此，你如下所示输入 `cat /var/log/messages\
  \ | grep ifup`：\n\n![Images](img/p0054-01.jpg)\n\n注意，只有 cat 输出中匹配表达式“ifup”的条目才会被\
  \ grep 显示在屏幕上。\n\n* * *\n\n![Images](img/note.jpg)\n\n**注意** 记住，当你管道信息时，只有管道中的最后一个命令会在屏幕上显示输出。所有其他命令的输出都重定向到管道中下一个命令的输入，而不会显示在屏幕上。在这个例子中，匹配的条目实际上太多，无法在一个屏幕显示。你能做什么？你实际上可以在管道中包含多个命令。在这种情况下，我们需要使用\
  \ `cat` 生成初始输出，然后通过 `grep` 进行过滤以只找到包含“ifup”的条目，然后将 `grep` 的输出发送到 `more` 命令，以便一次显示一屏。为此，你输入：\n\
  \n```\ncat /var/log/messages | grep ifup | more\n```\n\n\n\n\n有时，你可能需要将命令的输出同时显示在屏幕上*并且*写入文件。这可以通过\
  \ `tee` 命令来实现。`tee` 的用法语法为 `command | tee file_name.`。例如，如果我想将 `ls –l` 命令的标准输出（stdout）显示在屏幕上并写入到名为\
  \ `output.txt` 的文件中，可以使用以下命令：\n\n```bash\nls -l | tee output.txt\n```\n\n让我们在下面的练习中练习管道（pipes）的使用。\n\
  \n### 练习 2-10：使用管道\n\n在本次练习中，你将练习使用管道将一个命令的标准输出（stdout）发送到另一个命令的标准输入（stdin）。你可以使用书中附带虚拟机进行此练习。运行快照\
  \ 2-1 以获得配置正确的环境。\n\n***\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看练习 2-10 视频，演示如何执行此项的任务。\n\
  \n完成以下操作：\n\n1. 如果必要，启动你的 Linux 系统并以标准用户登录。\n2. 如果必要，打开终端会话。\n3. 输入 `su –` 后输入你的\
  \ root 密码切换到 root 用户账户。\n4. 通过将 `cat` 的输出管道至 `grep`，查看系统日志中包含“kernel”字的所有条目。在 shell\
  \ 提示符下输入 `cat /var/log/messages | grep kernel` 执行此操作。\n5. 上一个命令的输出可能很长。在 shell 提示符下输入\
  \ `cat /var/log/messages | grep kernel | more`，将 `cat` 的输出通过 `grep` 管道到 `more`。\n\
  6. 在 shell 提示符下输入 `cat /var/log/messages | grep kernel | tee ~/kernel.txt`，将上一个命令的输出发送到屏幕以及家目录下的\
  \ `kernel.txt` 文件。\n7. 在 shell 提示符下输入 `cat ~/kernel.txt` 验证信息是否已写入文件。\n\n***\n\n\
  ![Images](img/examtip.jpg)\n\n**考试提示** 你可以使用 `unset` 命令删除赋值给变量的值。只需在 shell 提示符下输入\
  \ `unset variable_name` 即可。\n\n### 本章总结\n\n本章首先回顾了大多数 Linux 发行版提供的两种用户界面：命令行界面（CLI）和图形用户界面（GUI）。我讨论了\
  \ `bash` 配置文件。我指出 Linux 系统上有两种类型的 shell：\n\n![images](img/bull.jpg) 登录 shell (Login\
  \ shells)\n\n![images](img/bull.jpg) 非登录 shell (Non-login shells)\n\n当运行登录 shell\
  \ 时，会首先读取 `/etc/profile` 来初始化 shell 环境。然后 shell 会按照以下顺序在用户的家目录中搜索以下文件：\n\n![images](img/bull.jpg)\
  \ .bash_profile\n\n![images](img/bull.jpg) .bash_login\n\n![images](img/bull.jpg)\
  \ .profile\n\nshell 将读取找到的第一个文件并使用它为当前用户配置 shell 环境。不同的发行版会使用不同的 `bash` 配置文件。\n\n\
  接着讨论了 `bash` shell 的命令历史功能。使用命令历史，你可以按 `UP ARROW`（向上箭头）键滚动查看之前的命令列表。这些命令保存在每个用户家目录下的\
  \ `.bash_history` 文件中。\n\n`bash` shell 还提供命令补全功能。使用命令补全，你可以输入命令的一部分，然后按 `TAB` 键自动为你完成命令。\n\
  \n接下来，我讨论了在操作 Linux shell 时如何获取帮助。我首先回顾了如何使用 `man` 工具查看手册页（manual pages）。我提到 Linux\
  \ 系统上的大多数命令和工具都有关联的 `man` 页面，其中包含了关于它们的功能以及如何使用的信息。我讨论了所有 `man` 页面共同构成了手册。手册根据工具或命令的功能分为不同的章节。组成手册的文件存储在由\
  \ `MANPATH` 变量或 `/etc/man_db.conf` 文件中的 `MANPATH` 指令指定的目录中。\n\n要使用 `man`，只需输入 `man`\
  \ 后跟你想要学习的命令、工具、文件或服务的名称。我回顾了大多数 `man` 页面使用的不同章节。我还回顾了用于在 `man` 页面内进行导航的按键。\n\n\
  我还讨论了如何搜索 `man` 页面。我指出你可以输入 `/` 后接字符串在单个 `man` 页面内搜索单词。你也可以输入 `man –k` 或使用 `apropos`\
  \ 工具跨多个 `man` 页面搜索文本。\n\n在讨论完 `man` 工具后，我们将注意力转向 `info` 工具。我指出 `info` 包含了比 `man`\
  \ 工具更详尽的文档。要查看命令或工具的信息，输入 `info` 后跟你想学习的工具名称。我还讨论了用于在 `info` 节点内部及之间导航的按键。我指出你可以按\
  \ `CTRL-S` 并输入搜索模式在 `info` 节点中搜索字符串。\n\n在本章的此时，我转到了对环境变量的讨论。环境变量用于配置 shell 环境。这些变量在\
  \ `bash` shell 启动时自动填充，但如有需要，你可以修改许多变量。你可以使用以下工具查看环境变量的值：\n\n![images](img/bull.jpg)\
  \ echo\n\n![images](img/bull.jpg) set\n\n![images](img/bull.jpg) env\n\n要设置变量的值，可以输入\
  \ `variable_name=value.`。在给环境变量分配新值后，你可以在 shell 提示符下输入 `export variable_name`，使新值对其他\
  \ shell（包括由当前 shell 启动的子 shell）可用。\n\n记住，你对环境变量所做的任何更改都不是持久的。要使其持久化，你需要编辑本章讨论的 `bash`\
  \ 配置文件之一，以便在每次 shell 启动时都对变量进行赋值。\n\n我 fact 指出，你也可以从 shell 提示符创建自己的变量。这使用的技术与描述环境变量时使用的相同。与环境变量一样，用户定义的变量必须导出（export）才能供其他\
  \ shell 使用。\n\n随后我将讨论转向别名（aliases）。别名是 Linux 系统中命令的快捷方式。大多数发行版在 shell 启动时会自动定义许多别名。你可以使用\
  \ `alias` 命令查看这些。你也可以在 shell 提示符下输入 `alias alias_name=\"commands\"` 来定义自己的别名。与变量一样，别名的定义不是持久的。要使其持久化，你需要将相应的命令添加到你的\
  \ bash 配置文件之一。\n\n然后我转换思路，处理了管理 shell 命令输入输出的问题。大多数 shell 命令三个三个描述符：\n\n![images](img/bull.jpg)\
  \ stdin (0)\n\n![images](img/bull.jpg) stdout (1)\n\n![images](img/bull.jpg) stderr\
  \ (2)\n\n你可以通过向任何命令添加 `1> filename` 或 `2> filename`，将命令的 stdout 和 stderr 输出重定向到文件。如果指定的文件不存在，shell\
  \ 将创建它。如果已存在，其内容将被覆盖。如果你想保留文件的现有内容，请使用 `>>` 代替 `>`。你还可以使用 `<` 字符将文件的输入发送到命令的 stdin。\n\
  \n除了重定向到文件，你还可以使用管道将一个命令的 stdout 重定向到另一个命令的 stdin。这是通过在 shell 提示符下输入 `command |\
  \ command` 实现的。事实上，你同一个管道中包含许多不同的命令。\n\n#### **快速回顾**\n\n![images](img/bull.jpg)\
  \ Linux 提供了命令行界面和图形用户界面。\n\n![images](img/bull.jpg) Linux 命令行界面是由 shell 创建的。\n\n\
  ![images](img/bull.jpg) bash 是大多数发行版的默认 shell。\n\n\n\n\n\nLinux shell 在从命令行运行文件时不会搜索当前目录。\n\
  \n用于登录系统的 shell 称为登录 shell（login shells）。\n\n在用户登录后打开的 shell 称为非登录 shell（non-login\
  \ shells）。\n\n`.bashrc` 文件用于配置非登录 shell。\n\n`/etc/profile` 文件是创建登录 shell 时第一个被读取的文件。\n\
  \n在读取了 `/etc/profile` 文件后，`bash` shell 会在用户的家目录中查找以下配置文件之一：\n* `.bash_profile`\n\
  * `.bash_login`\n* `.profile`\n\n找到的这些文件中的第一个将用于配置用户的 shell 环境。\n\n`bash` shell\
  \ 将你的命令历史保存在 `.bash_history` 中。\n\n按下 `UP ARROW`（向上方向键）会显示在 shell 提示符处输入的最后命令。\n\
  \n`bash` shell 提供使用 `TAB` 键进行命令补全的功能。\n\n使用手册（man`）页是维护 Linux 系统文档的主要手段之一。\n\n使用\
  \ `man` 工具查看手册页。\n\n系统中的大多数命令、实用程序、服务和配置文件都有相应的手册页。\n\n手册页在文件系统中的位置存储在环境变量 `MANPATH`\
  \ 中或 `/etc/man.config` 文件中的 `MANPATH` 指令中。\n\n所有的手册页共同构成了手册。手册分为以下章节：\n* 第 1 部分：用户程序和\
  \ shell 命令\n* 第 2 部分：内核函数\n* 第 3 部分：库函数\n* 第 4 部分：`/dev` 中的特殊文件\n* 第 5 部分：文件格式描述和约定\n\
  * 第 6 部分：游戏\n* 第 7 部分：杂约定\n* 第 8 部分：root 使用的实用程序\n* 第 9 部分：内核例\n\n一些常用的手册页章节包括：\n\
  * NAME（名称）\n* SYNOPSIS（摘要）\n* DESCRIPTION（描述）\n* AUTHOR（作者）\n* REPORTING BUGS（报告错误）\n\
  * COPYRIGHT（版权）\n* SEE ALSO（参见）\n\n若要在手册页内搜索文本，你需输入 `/` 后跟你想要搜索的文本。\n\n要跨手册页搜索文本，可以使用以下任之一：\n\
  * `man -k`\n* `apropos`\n\n除了 `man` 之外，你还可以使用 `info` 工具查看系统文档。`info` 工具显示比 `man`\
  \ 工具更深入的信息。`info` 工具显示的信息被称为节点（node）。\n\n要使用 `info`，在 shell 提示符处输入 `info`，后跟你需要学习的命令、实用程序或配置文件的名称。要在\
  \ `info` 中搜索信息，按下 `CTRL-S` 并输入你想要搜索的术语。\n\n环境变量用于定义 shell 环境。你可以使用 `echo`、`set`\
  \ 和 `env` shell 命令查看环境变量的值。在引用环境变量时必须使用 `$` 符号以指定该文本是变量名而不是字符串。\n\n你可以通过在 shell\
  \ 提示符处输入 `variable_name=value` 来设置环境变量的值。在设置变量值后，你必须使用 `export` 命令将其导出。你分配给环境变量的值不是持久的。要使变量赋值持久化，你需要将适当的命令添加到其中一个\
  \ bash 配置文件中。\n\n你也可以以相同的方式创建用户定义变量。用户定义变量需要导出后才能被其他 shell 使用。\n\n你可以在系统上创建别名（aliases）来创建命令的快捷方式。你可以使用\
  \ `alias` 命令查看现有的别名。你可以通过输入 `alias alias_name=command` 来定义新别名。别名不是持久的。你必须将适当的命令添加到其中一个\
  \ bash 配置文件中使其持久化。\n\n大多数 Linux shell 命令有三个标准文件描述符：\n* `stdin` (0)\n* `stdout` (1)\n\
  * `stderr` (2)\n\n你可以使用命令后的 `>` 字符将输出（`stdout` 和 `stderr`）从屏幕重定向到文件。使用 `1>filename`\
  \ 将 `stdout` 重定向到指定的文件。使用 `2>*filename` 将 `stderr` 重定向到指定的文件。使用 `>` 如果文件不存在则创建指定文件。如果已存在，文件内容将被覆盖。使用\
  \ `>>` 将保留指定文件的现有内容并将新输出追加到末尾。\n\n你可以使用 `<` 指定一个文件作为命令的 `stdin`。使用管道（pipes）允许你将一个命令的\
  \ `stdout` 移动到另一个命令的 `stdin`。管道的语法为 `command1 | command2`。你可以在单个管道中使用多个命令。\n\n##\
  \ Questions\n\n**[1].** 哪个 shell 是大多数 Linux 发行版的默认 shell？\n**A.** sh\n**B.** csh\n\
