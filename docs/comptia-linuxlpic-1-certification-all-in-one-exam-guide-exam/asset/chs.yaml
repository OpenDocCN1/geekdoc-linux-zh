  \ 来读取用户输入。\n\n![images](img/bull.jpg) 为了让你的脚本更强大，可以在脚本中添加分支结构。\n\n![images](img/bull.jpg)\
  \ 控制结构允许你配置脚本，使其根据你提供的提供的条件进行分支或循环。\n\n![images](img/bull.jpg) 若要创建一个向两个方向分支的脚本，你可以在脚本中使用\
  \ `if/then/else` 结构。\n\n![images](img/bull.jpg) 如果你在结构中指定的条件为真，则执行一组命令（`then` 下的命令）。\n\
  \n![images](img/bull.jpg) 如果条件为假，则执行结构中 `else` 部分的命令。\n\n![images](img/bull.jpg)\
  \ 你可以在 `if/then/else` 结构中使用 `test` 命令来测试条件。\n\n![images](img/bull.jpg) 如果你希望脚本中有多于两个的分支，可以使用\
  \ `case` 结构。\n\n![images](img/bull.jpg) 通过 `case` 结构，你可以评估多个条件，并根据哪个条件为真来执行一系列命令。\n\
  \n![images](img/bull.jpg) 你还可以在 shell 脚本中使用循环控制结构。\n\n![images](img/bull.jpg) 循环结构有三种：`while`\
  \ 循环、`until` 循环和 `for` 循环。\n\n![images](img/bull.jpg) `while` 循环会反复执行，直到指定的条件不再为真。\n\
  \n![images](img/bull.jpg) 你还可以在脚本中使用 `until` 循环。\n\n![images](img/bull.jpg) `until`\
