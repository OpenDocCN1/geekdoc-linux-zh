  \ 你可以使用 `pwconv` 工具从 `/etc/passwd` 将缺失的用户复制到 `/etc/shadow`。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `useradd` 工具将用户添加到 Linux 系统。\n\n![images](img/bull.jpg) 当在没有任何选项的情况下使用时，`useradd`\
  \ 使用包含 `/etc/default/useradd` 和 `/etc/login.defs` 中的系统默认值来创建用户账户。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `passwd` 工具设置用户的密码。\n\n![images](img/bull.jpg) `passwd` 工具也可以用于检查用户账户的状态。\n\
  \n![images](img/bull.jpg) 你可以使用 `usermod` 工具修改现有的用户账户。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `userdel` 工具删除现有的用户账户。\n\n![images](img/bull.jpg) 默认情况下，`userdel` 不删除用户的家目录，除非你在命令中指定了\
  \ `-r` 选项。\n\n![images](img/bull.jpg) Linux 组可以通过将相似的用户账户分组来简化管理。\n\n![images](img/bull.jpg)\
  \ 用户账户存储在 `/etc/group` 中。\n\n![images](img/bull.jpg) 某些发行版在 `/etc/gshadow` 中存储组密码。\n\
  \n![images](img/bull.jpg) 你使用 `groupadd` 工具为系统添加新组。\n\n![images](img/bull.jpg) 你使用\
  \ `usermod` 工具将用户添加到或从现有组中移除。\n\n![images](img/bull.jpg) 你使用 `groupdel` 工具删除现有的组。\n\
  \n## 问题\n\n**1.** 在 shell 提示符下输入以下哪个命令时，将显示名为 `dcoughanour` 的用户的 UID？\n\n**A.**\
  \ `id dcoughanour`\n\n**B.** `finger dcoughanour`\n\n**C.** `UID dcoughanour`\n\n\
  **D.** `info dcoughanour`\n\n**2.** 在配置为使用本地认证的 Linux 系统上，哪个文件用于存储用户账户？\n\n**A.**\
  \ `/etc/shadow`\n\n**B.** `/etc/users`\n\n**C.** `/etc/passwd`\n\n**D.** `/etc/local/accounts`\n\
  \n**3.** 在配置为使用本地认证的 Linux 系统上，哪个文件用于存储用户密码？\n\n**A.** `/etc/shadow`\n\n**B.** `/etc/users`\n\
  \n**C.** `/etc/passwd`\n\n**D.** `/etc/local/accounts`\n\n**4.** 考虑 `/etc/passwd`\
  \ 中的以下条目：\n\n```\nksanders:x:1001:100:Kimberly Sanders:/home/ksanders:/bin/bash\n\
  ```\n\n该用户的主组是什么？（选择两个。）\n\n**A.** `ksanders`\n\n**B.** `home`\n\n**C.** `1001`\n\
  \n**D.** `100`\n\n**E.** `users`\n\n**F.** `video`\n\n**5.** 考虑 `/etc/shadow` 中的以下条目：\n\
  \n![Images](img/p0338-01.jpg)\n\n该用户必须多久更改一次密码？\n\n**A.** 每 30 天。\n\n**B.** 每 60\
  \ 天。\n\n**C.** 每 7 天。\n\n**D.** 此功能已禁用。用户不需要更改密码。\n\n**6.** 你需要在 Linux 系统上为 Mike\
  \ Huffman 创建一个名为 `mhuffman` 的新用户账户。Mike 的密码应设置为（加密形式）“3X.N3pL9U8HNM”，并且他需要在 `/home/mhuffman`\
  \ 中创建一个家目录。以下哪个命令可以实现此操作？\n\n**A.** `useradd –c “Mike Huffman” –m –p “3X.N3pL9U8HNM”\
  \ mhuffman`\n\n**B.** `usermod “Mike Huffman” –p “3X.N3pL9U8HNM” mhuffman`\n\n**C.**\
  \ `useradd mhuffman`\n\n**D.** `useradd mhuffman –c “Mike Huffman” –m –p 3X.N3pL9U8HNM`\n\
  \n**7.** 一名为 Diana Grow 的用户最近结婚了，并将姓氏改为 Nelson。你需要更改她在 Linux Linux 上的上的用户名。哪个命令可以实现此操作？\n\
  \n**A.** `usermod –l “dgrow” –c “Diana Nelson” dnelson`\n\n**B.** `usermod –l “dnelson”\
  \ –c “Diana Nelson” dgrow`\n\n**C.** `useradd dnelson`\n\n**D.** `usermod –c “dgrow”\
  \ –l “dnelson” Diana Grow`\n\n**8.** 你需要从你的 Linux 系统中删除名为 `jcarr` 的用户账户并移除他的家目录内容。以下哪个命令可以实现此操作？\n\
  \n**A.** `userdel jcarr`\n\n**B.** `usermod --delete --rmhome jcarr`\n\n**C.** `userdel\
  \ –r jcarr`\n\n**D.** `userdel --rmhome jcarr`\n\n**9.** 在配置为使用本地认证的 Linux 系统上，哪个文件用于存储组信息？\n\
  \n**A.** `/etc/groups`\n\n**B.** `/etc/local/group`\n\n**C.** `/etc/groupinfo`\n\
  \n**D.** `/etc/group`\n\n**10.** 以下哪个命令可以将 `mhuffman`、`dnelson` 和 `jcarr` 添加到 Linux\
  \ 系统上的 `editors` 组中？\n\n**A.** `groupadd –A “mhuffman,dnelson,jcarr” editors`\n\n\
  **B.** `groupmod –A “mhuffman,dnelson,jcarr” editors`\n\n**C.** `groupmod editors\
  \ –A “mhuffman,dnelson,jcarr”`\n\n**D.** `groupmod –R “mhuffman,dnelson,jcarr” editors`\n\
  \n### 答案\n\n**1. A.** 输入 `id dcoughanour` 将显示该用户的 UID。\n\n**2. C.** `/etc/passwd`\
  \ 文件存储用户账户信息。\n\n**3. A.** `/etc/shadow` 文件存储用户密码。\n\n**4. D, E.** `ksanders` 主组\
  \ GID 是 `100`。在大多数发行版中，这是 `users` 组。\n\n**5. B.** 该用户必须每 60 天更改一次密码。记录中的值 `60` 指定了密码有效期为\
  \ 60 天。\n\n**6. A.** 输入 `useradd –c “Mike Huffman” –m –p “3X.N3pL9U8HNM” mhuffman`\
  \ 将创建用户 `mhuffman`，设置其全名为 Mike Huffman，创建家目录（–m），并设置用户的加密密码为 `3X.N3pL9U8HNM`。\n\n\
  **7. B.** 在 shell 提示符下输入 `usermod –l “dnelson” –c “Diana Nelson” dgrow` 将 `dgrow`\
  \ 用户账户重命名为 `dnelson`。\n\n**8. C.** 输入 `userdel –r jcarr` 将删除 `jcarr` 的账户并移除其家目录。\n\
  \n**9. D.** `/etc/group` 文件存储组信息。\n\n**10. B.** 输入 `groupmod –A “mhuffman,dnelson,jcarr”\
  \ editors` 将 `mhuffman`、`dnelson` 和 `jcarr` 用户账户添加到 `editors` 组中。\n\n\n\n\n\n# 1.\
  \ 执行 `groupmod -R “dnelson” editors` 将将 `dnelson` 用户账户从 editors 组中移除。\n\n# 第 10\
  \ 章：管理 Linux 文件系统\n\n在本章中，你将学习到：\n\n- 管理磁盘分区\n- 挂载可移动介质\n- 备份数据\n\n是时候深入研究并真正开始上手\
  \ Linux 工作了！在本章之前的所有章节都旨在建立知识和技能的基础，这些基础将在本书的剩余部分中一直使用。在本章中，我们将把你目前为止所学的知识应用于实践，学习如何管理\
  \ Linux 系统上的分区和文件系统。\n\n![Images](img/examtip.jpg)\n\n**考试提示** 请准备好在你的 LPIC-1/ Linux+\
  \ 考试中针对本章节接受非常严格的测试。取决于你考试时收到的卷，可能有 15–20% 的考试题来自本章节。\n\n让我们从讨论如何管理 Linux 磁盘分区开始本章的学习。\n\
  \n## 管理磁盘分区\n\n在最初安装 Linux 系统时，你会在硬盘器上定义系列分区来托管你的文件系统。根据你安装的发行版不同，你可能使用了某种图形化或菜单驱动的分区工具来完成此操作。\n\
  \n在系统运行一段时间后，你可能在某个时刻需要更多的存储空间。如果你在系统中安装了新的硬盘，你需要对它进行分区并在其上创建文件系统。为了实现这一点，大多数发行版都为你提供了某种类型的图形化分区工具。\n\
  \n这些工具非常好；但是，对于你的 LPIC-1/Linux+ 认证考试，你必须学会如何从命令行管理分区。在本章的这部分，你将学习以下内容：\n\n![images](img/bull.jpg)\
  \ 管理主引导记录 (MBR) 磁盘分区\n![images](img/bull.jpg) 管理全局唯一标识符 (GUID) 分区\n![images](img/bull.jpg)\
  \ 构建文件系统\n![images](img/bull.jpg) 挂载分区\n![images](img/bull.jpg) 理解 LVM\n![images](img/bull.jpg)\
  \ 维护 Linux 文件系统\n\n让我们学习如何使用 `fdisk` 开始。\n\n### 管理主引导记录 (MBR) 磁盘分区\n\n主引导记录 (MBR)\
  \ 分区格式自 20 世纪 80 年代初一直存在，并在许多 Linux 系统中使用。因此，你需要熟悉管理这些类型的分区。\n\n`fdisk` 工具用于从命令行在\
  \ shell 提示符下查看、创建或删除 MBR 分区。要使用 `fdisk` 创建新分区，首先打开终端会话。然后，在 shell 提示符处输入 `su –`\
  \ 并输入 root 用户密码切换到 root 账户。\n\n在 shell 提示符处，输入 `fdisk device*`。例如，如果你想管理系统中第一块硬盘上的分区，输入\
  \ `fdisk /dev/sda`。此时，你需要输入一个命令告诉 `fdisk` 你想对硬盘做什么。\n\n![Images](img/tip.jpg)\n\n\
  **提示** 你可以在命令提示符处输入 `m` 来显示所有可用命令的列表。\n\n例如，要查看硬盘上的分区列表，你可以输入 `p`。如下例所示：\n\n![Images](img/p0342-02.jpg)\n\
  \n![Images](img/note.jpg)\n\n**注意** 你也可以通过在 shell 提示符处输入 `fdisk device –l` 来显示指定硬盘的分区表。输出与此处所示类似。\n\
  \n在下一个示例中，系统中安装了一个新硬盘 (`/dev/sdb`)，并正在使用 `fdisk` 创建分区：\n\n![Images](img/p0343-02.jpg)\n\
  \n注意，由于这是系统中的新磁盘，它必须先用磁盘标签进行初始化。`fdisk` 工具在你加载程序时会为你处理好这一点。然而，在将更改写入磁盘之前，更改将不会生效。\n\
  \n在 `fdisk` 运行时，你有一个 `Command:` 提示符，可以使用它输入 `fdisk` 命令。此时，你可以做的最好的事情之一是输入 `m` 来查看\
  \ `fdisk` 帮助。当你这样做时，会显示一个可用于执行 `fdisk` 操作的命令列表，如下例所示：\n\n![Images](img/p0343-03.jpg)\n\
  \n![Images](img/caution.jpg)\n\n**警告** 你可以输入 `d` 来删除现有分区。使用此操作时务必非常小心。该分区上的任何数据将丢失！一旦更改提交到磁盘，将无法撤销。你可以通过输入\
  \ `q` 来撤回通过 `fdisk` 所做的更改而不将其提交到磁盘。对于 `fdisk` 来说，`q` 是你的朋友！\n\n在创建分区之前，你应该输入 `p`\
  \ 查看磁盘上的任何现存分区。这有助于你判断空间是否足够，以及如果足够，则在磁盘上创建的新分区必须分配什么编号。\n\n要创建新分区，你输入 `n`。然后你可以指定想要创建一个主磁盘分区还是扩展磁盘分区。你系统中的任何硬盘在它的分区表中最多可以定义四个分区。这些分区可以是主分区也可以是扩展分区。如果你打算创建四个或更少的分区，可以直接使用主分区。\n\
  \n然而，如果你想在磁盘上创建四个以上的分区，你必须至少创建一个扩展分区。扩展分区非常好用。在一个扩展分区内部，你可以创建许多个逻辑分区。这允许你绕过四个分区的限制。通用的规则是先创建主分区；然后使用驱动器上的剩余空间创建扩展分区，并在其中创建逻辑分区。\n\
  \n要创建主分区，在提示提示时输入 `p`。要创建扩展分区，输入 `e`。然后你会被提示指定分区编号，如下例所示：\n\n![Images](img/p0344-01.jpg)\n\
  \n你需要为正在创建的分区指定下一个可用的分区编号。换句话说，如果磁盘上已经有两个分区，你将输入 `3`。在之前的示例中，驱动器上目前没有任何分区，所以我输入了\
  \ `1` 来创建第一个主分区。如果你尝试输入一个已被现有分区占用的分区编号，`fdisk` 工具将会报错！\n\n此时，你必须指定分区的大小。这是通过指定起始和结束磁道（cylinders）完成的。你首先指定起始分区的磁道。默认情况下，`fdisk`\
  \ 显示下一个可用的磁道。如果你磁盘上没有任何分区，这将是磁道 1。如果磁盘上已有分区，将列出下一个未使用的磁道。在指定起始磁道后，你有几种选项来指定分区的总大小，如下所示：\n\
  \n![Images](img/p0344-02.jpg)\n\n你可以：\n\n![images](img/bull.jpg) 输入分区使用的最后一个磁道。\n\
  ![images](img/bull.jpg) 通过输入 `size*G` 以 GB 指定分区大小。例如，通过输入 `800G` 可以创建一个 800GB 的分区。\n\
  \n在指定大小后，你应该输入 `p` 来验证你的新分区。这将显示磁盘的所有分区，如下一个示例所示：\n\n![Images](img/p0345-01.jpg)\n\
  \n需要注意的是，此时分区尚未写入磁盘。所有更改都保存在内存中，直到提交到磁盘。这允许你在实际提交更改之前对分区进行调整。\n\n\n\n\n然而，在将分区提交到磁盘之前，你可能需要更改分区类型。注意上一个示例，创建的分区默认是标准的\
  \ Linux 分区。通常情况下，这已经足够了。但是，假设你正在创建一个交换分区（swap partition）。你将使用不同类型的分区。这可以通过输入 `t`\
  \ 然后输入你想要更改的分区类型 ID 来完成。如果你不知道要使用的分区类型 ID 数字，可以输入 `l`（小写 *L*）来列出所有有效的分区类型及其关联的 ID\
  \ 数字，如此处所示：\n\n![Images](img/p0345-02.jpg)\n\n例如，Linux 交换分区的 ID 为 `82`。要更改分区类型，如果你想将分区更改为交换分区，可以输入\
  \ `t` 并指定分区 ID 为 `82`。\n\n你还可以使用 `fdisk` 删除分区。要执行此操作，在命令提示符处输入 `d`，然后指定你想要删除的分区编号。记住，一旦你将更改提交到磁盘，该分区上的任何数据都将丢失！\n\
  \n此时，你已经准备好将分区提交到磁盘了。如果你对分区方案不满意，可以随时输入 `q` 退出而不应用更改。然而，如果你满意，可以通过输入 `w` 来应用更改。这将分区提交到磁盘并退出\
  \ `fdisk`，如下例所示：\n\n![Images](img/p0346-02.jpg)\n\n这里需要注意的是，在 Linux 内核识别你通过 `fdisk`\
  \ 制作的分区更改之前，你必须重启系统。不过，你也可以在 shell 提示符处使用 `partprobe` 命令来强制内核识别新的分区表，而无需重启。语法为 `partprobe\
  \ –s`。`s` 选项会导致 `partprobe` 命令显示设备及其分区的摘要，如下例所示：\n\n![Images](img/p0346-03.jpg)\n\
  \n现在你已经知道如何使用 `fdisk` 管理分区，让我们来看看如何创建 GUID 分区。\n\n## 管理全局唯一标识符 (GUID) 分区\n\n正如我之前提到的，MBR\
  \ 分区方案已经使用了多年——自从 20 世纪 80 年代初开始！因此，它有许多局限性和缺点。以下是一些例子：\n\n![images](img/bull.jpg)\
  \ MBR 必须安装在硬盘的前 512 字节中。\n\n![images](img/bull.jpg) 存储设备上最多只能创建四个主分区。\n\n![images](img/bull.jpg)\
  \ 512 字节的默认块大小限制了分区最大大小为 2TB。\n\n多年来，已经实现了许多补丁来规避这些缺点：\n\n![images](img/bull.jpg)\
  \ 使用逻辑块寻址 (LBA) 以允许使用更大的硬盘\n\n![images](img/bull.jpg) 使用 4,096 字节扇区以增加磁盘上的最大分区大小\n\
  \n![images](img/bull.jpg) 将你的四个可用分区之一定义为扩展分区，它可以容纳许多逻辑分区\n\n这些补丁很好地服务了我们很一段时间，但是时候用一种新的方式管理磁盘分区了。最近，全局唯一标识符\
  \ (GUID) 分区表方案引入 Linux，作为 MBR 的替代品。\n\n***\n\n![Images](img/note.jpg)\n\n**注意**\
  \ 我们通常将这种方案简称为 GPT（代表 *GUID partition table*，即 GUID 分区表）。我们技术人员以以在缩写中嵌套缩写而闻名。\n\n\
  GPT 是整个统一扩展固件接口 (UEFI) 规范的一部分，该规范旨在取代计算机系统上的 BIOS，并提供更稳健的软件到硬件接口。将 UEFI 想象为“加强版的\
  \ BIOS”。UEFI 仅在后期型号电脑上实现。然而，你可以在仍使用 BIOS 的旧版 Linux 系统上使用 GPT。与为硬盘分区使用 MBR 相比，GPT\
  \ 有几个关键优势：\n\n![images](img/bull.jpg) GPT 中没有主分区、扩展分区或逻辑分区之分。所有分区都是普通的分区。\n\n![images](img/bull.jpg)\
  \ GPT 支持巨大的磁盘和分区。我们谈论的是是以 *zebibytes*（西字节）而不是 TB 为单位的大小。\n\n![images](img/bull.jpg)\
  \ 大多数 Linux 发行版每个磁盘支持高达 128 个 GPT 分区。这比我们使用 MBR 时受限于四个多得多。\n\n![images](img/bull.jpg)\
  \ GPT 通过在磁盘的首和最后一个扇区中存储分区表副本来提供分区容错能力。这样，如果其中一个副本损坏（我曾遇到过这种情况），冗余副本会接管，磁盘上的文件仍然可以访问。\n\
  \n![images](img/bull.jpg) GPT 执行循环冗余校验 (CRC) 来验证分区表的完整性。\n\n![images](img/bull.jpg)\
  \ GPT 为每个磁盘和分区分配唯一的 ID。\n\n为了管理 GPT 分区，我们不能再使用 `fdisk` 了。相反，我们使用一个名为 `gdisk` 的实用程序，它可以用于许多操作。例如，它可以用于执行以下操作：\n\
  \n![images](img/bull.jpg) 将 MBR 分区表转换为 GPT 分区表\n\n![images](img/bull.jpg) 验证磁盘\n\
  \n![images](img/bull.jpg) 创建和删除 GPT 分区\n\n![images](img/bull.jpg) 显示分区信息\n\n![images](img/bull.jpg)\
  \ 修改分区的名称和类型\n\n![images](img/bull.jpg) 备份并恢复磁盘分区表\n\n例如，假设我添加了一个磁盘并想在上面创建一个 GPT\
  \ 分区以便存储信息。为了执行此操作，我首先切换到 root 用户，然后在提示符处输入 `gdisk /dev/sdb`。如果你熟悉 `fdisk`，那么使用\
  \ `gdisk` 的过程对你来说会很快。在 `gdisk` 提示符处，你可以输入 `?` 查看可用命令。如下所示：\n\n![Images](img/p0348-01.jpg)\n\
  \n在这种情况下，我想向磁盘添加新分区，因此我在 `gdisk` 提示符处输入 `n`。这样做后，会被提示指定以下：\n\n![images](img/bull.jpg)\
  \ 分区编号\n\n![images](img/bull.jpg) 分区大小。这可以通过指定分区的起始和结束扇区来完成。你也可以指定分区在磁盘何处开始和结束（例如在\
  \ 10GB 和 20GB 处）。\n\n![images](img/bull.jpg) 分区类型。`gdisk` 的分区类型数字与 MBR 不同。例如，创建\
  \ Linux 分区使用分区类型 `8300`。你可以在 `gdisk` 提示符处按 `L` 查看所有可能的分区类型及其代码。\n\n该过程如下：\n\n![Images](img/p0348-02.jpg)\n\
  \n完成后，你可以在 `gdisk` 提示符处输入 `p` 查看磁盘上的分区列表。与 `fdisk` 一样，通过 `gdisk` 进行的更改在写入之前不会实际提交到磁盘。如果你对磁盘分区更改满意，在\
  \ `gdisk` 提示符处按 `w`。如果你想删除分区，按 `d`。如果你想更改分区的类型，按 `t` 然后输入你想要使用的分区类型代码。如果你想退出并重新开始而不保存任何更改，请按\
  \ `q`。\n\n除了 `gdisk`，你还可以在 shell 提示符处使用 `parted` 命令来管理 GPT 分区。你可以用它添加、删除和编辑磁盘上的分区。\n\
  \n***\n\n![Images](img/caution.jpg)\n\n**警告** 与 `gdisk` 和 `fdisk` 不同，`parted` 命令会将你指定的分区更改立即写入磁盘。在使用\
  \ `parted` 之前，请务必确定你想做的更改！\n\n\n\n\n要使用 `parted`，请在 shell 提示符输入 `parted`，然后使用 `select`\
  \ 命令指定你想要管理的磁盘。请务必小心，因为如果你没有手动指定要管理的磁盘，`parted` 将自动为你选择第一块硬盘——你知道的，就是包含你的系统分区和主分区的那个吗？不小心删除了此磁盘上的分区可能会导致严重！如果你打算在\
  \ `/dev/sda` 以外的磁盘上进行操作，请确保使用 `select` 命令。\n\n在选择了合适的硬盘后，你可以在 `parted` 提示符下使用 `mkpart`\
  \ 命令创建一个新分区。你需要指定以下内容：\n\n![images](img/bull.jpg) **要创建的分区类型**。例如，要创建一个标准的 Linux\
  \ 分区，你需要指定值为 `linux`。\n\n![images](img/bull.jpg) **分区在磁盘上的起始点（单位：兆字节 MB）**。例如，要创建一个从磁盘\
  \ 1GB 处处始的分区，你需要指定值为 `1024`。\n\n![images](img/bull.jpg) **分区在磁盘上的结束点（单位：兆字节 MB）**。例如，要创建一个在磁盘\
  \ 11GB 处结束的分区，你需要指定值为 `11264`。\n\n要查看磁盘上已创建的分区，可以在 `parted` 提示符下使用 `print` 命令。在下面的示例中，在系统的第二块硬盘（`dev/sdb`）上创建了一个\
  \ 10GB 的分区：\n\n![Images](img/p0350-01.jpg)\n\n你还可以在 `parted` 提示符下使用以下命令来管理磁盘分区：\n\
  \n![images](img/bull.jpg) 要重命名分区，输入 `name partition name`。\n\n![images](img/bull.jpg)\
  \ 要将分区移动到磁盘上的不同位置（这是一个非常实用的功能），输入 `move partition start_point end_point`。\n\n![images](img/bull.jpg)\
  \ 要调整磁盘上分区的大小（另一个非常实用的功能），输入 `resize partition start_point end_point`。\n\n![images](img/bull.jpg)\
  \ 要从磁盘上删除分区，输入 `rm partition`。\n\n现在你已经了如何管理分区，你需要学习如何使用 `mkfs` 在这些分区上创建文件系统。\n\n\
  ## 构建文件系统\n\n尽管我们已经创建了分区，但还不能直接使用它。那是因为它还没有格式化为文件系统。这是通过几个命令之一来实现的。在本章的这一部分，我们将介绍以下主题：\n\
  \n![images](img/bull.jpg) 使用 `mkfs`\n\n![images](img/bull.jpg) 使用 `mkreiserfs`\n\
  \n![images](img/bull.jpg) 创建 `xfs` 和 `vfat` 文件系统\n\n![images](img/bull.jpg) 使用 `mkswap`\n\
  \n### 使用 mkfs\n\n`mkfs` 工具用于在分区上创建 ext2、ext3 或 ext4 文件系统。你甚至可以使用它在分区上创建 NTFS 文件系统（Windows\
  \ 使用的）。该工具实际上是创建每种特定类型文件系统的实际命令的前端：\n\n![images](img/bull.jpg) `/sbin/mkfs.minix`\n\
  \n![images](img/bull.jpg) `/sbin/mkfs.ntfs`\n\n![images](img/bull.jpg) `/sbin/mkfs.bfs`\n\
  \n![images](img/bull.jpg) `/sbin/mkfs.ext4`\n\n![images](img/bull.jpg) `/sbin/mkfs.msdos`\n\
  \n![images](img/bull.jpg) `/sbin/mkfs.cramfs`\n\n![images](img/bull.jpg) `/sbin/mkfs.ext3`\n\
  \n![images](img/bull.jpg) `/sbin/mkfs.ext2`\n\n![images](img/bull.jpg) `/sbin/mkfs.vfat`\n\
  \n![images](img/bull.jpg) `/sbin/mkfs.xfs`\n\n* * *\n\n![Images](img/note.jpg)\n\
  \n**注意** 如果需要，你可以运行 `/sbin` 中的 `mkfs.x` 工具来创建特定的文件系统。然而，大多数 Linux 管理员只使用 `mkfs`\
  \ 前端。你也可以在 shell 提示符下使用 `mke2fs` 命令来创建 ext*x* 文件系统。如果你需要获取创建特定文件系统的帮助，请在 shell 提示符下输入\
  \ `man mkfs.*x`。\n\n在创建 xfs 文件系统之前，必须向 Linux 内核中添加 xfs 支持。某些发行版（如 Fedora）在安装期间默认会添加\
  \ xfs 支持。然而，其他发行版（如 OpenSUSE 和 Ubuntu）并不包含该支持。\n\n你通过输入 `-t` 选项和文件系统类型来指定你想要使用的文件系统。例如，如果你想在系统第二块硬盘的第一个分区上创建\
  \ ext4 文件系统，你需要输入 `mkfs -t ext4 /dev/sdb1`。这里有一个示例：\n\n![Images](img/p0351-01.jpg)\n\
  \n在使用 `mkfs` 时，可以使用几个选项（除 `-t` 之外）来自定义在指定分区上创建的文件系统：\n\n![images](img/bull.jpg)\
  \ `-b blocksize` 指定文件系统中数据块的大小。允许使用 `1024`、`2048` 和 `4096` 等值。\n\n![images](img/bull.jpg)\
  \ `-N inodes` 指定在文件系统上创建多少 inode。\n\n* * *\n\n![Images](img/note.jpg)\n\n**注意**\
  \ 记住，*inode* 存储了 Linux 文件系统中关于文件的基本信息，包括其大小、设备、所有者和权限。每个文件都有一个 inode（硬链接除外）。因此，指定精确的\
  \ inode 数量实际上有效地限制了文件系统上可以创建的文件总数。\n\n![images](img/bull.jpg) `-i bytes_per_inode`\
  \ 设置 inode 的大小。对于 `bytes_per_inode`，你可以使用与块大小相同的值。\n\n![images](img/bull.jpg) `-j`\
  \ 在文件系统上创建日志。这可以用于为现有的 ext2 文件系统添加日志，有效地将其转换为 ext3 文件系统。\n\n如果你在运行 `mkfs` 命令时不包含任何选项，系统将根据分区的大小为你计算出最佳的数据块大小和可选的\
  \ inode 数量。在前面的示例中，为我们计算了以下内容：\n\n![images](img/bull.jpg) **块大小=4096**。这指定块大小为 4KB。在本示例中，该值对于创建文件系统的小型\
  \ 8GB 分区来说是最佳的。较小的分区将具有较小的块大小。\n\n![images](img/bull.jpg) **524288 inodes, 2096474\
  \ blocks** 文件系统最多有 524,288 个 inode 和 2,096,474 个块。这意味着分区上最多可以容纳 524,288 个文件，即使它们的大小总和小于可用总空间。如果你将块的总数（2,086,474）乘以块大小（4,096），就可以计算出分区的总大小（在本例中约为\
  \ 8GB）。\n\n![images](img/bull.jpg) **存储在块上的超级块备份**: **32768, 98304, 163840, 229376,\
  \ 294912, 819200, 884736, 1605632** 超块位于分区开头（0）的块，包含文件系统结构的信息。在该系统中，超级块的冗余副本存储在指定的块中。\n\
  \n### 使用 mkreiserfs\n\n`mkreiserfs` 工具用于在分区上创建 Reiser 文件系统。例如，如果你想在系统第二块硬盘的第一个分区上创建\
  \ Reiser 文件系统，你需要输入 `mkreiserfs /dev/sdb1`。执行时，会显示屏幕并给出一个建议。\n\n* * *\n\n![Images](img/tip.jpg)\n\
  \n**提示** 你也可以在 shell 提示符下运行 `mkfs -t reiserfs *device*` 来创建 Reiser 文件系统。许多这些参数可以使用\
  \ mkreiserfs 选项进行自定义。有关更多信息，请查看该工具的帮助页。通常情况下，默认参数效果非常好。当提示继续时，输入 **y** 格式化分区。\n\n\
  \n\n\n\n除了创建 ext2/3/4 分区外，你还可以使用 `mkfs` 创建 xfs 和 vfat 分区。扩展文件系统（xfs）文件系统是由 Silicon\
  \ Graphics (SGI) 为其 IRIX 操作系统创建的。它是一个非常快速、非常灵活的文件系统。它已经被移植到 Linux 上运行，尽管在我看来，它在\
  \ Linux 下的运行效果没有在 IRIX 下好。判断你的 Linux 内核是否已启用 xfs 支持的一种简单方法是：打开 shell 提示符并（以 root\
  \ 身份）输入 `find / –name mkfs.*`。如果内核添加了 xfs 支持，你应该能看到系统上安装了 `mkfs.xfs` 工具，如图 10-1\
  \ 所示。\n\n![Images](img/f0353-01.jpg)\n\n**图 10-1** 检查 xfs 支持\n\n创建一个 xfs 文件系统非常简单。它的操作方法与使用\
  \ `mkfs` 命令创建 extx 文件系统完全相同。首先，使用 `fdisk` 创建一个标准的 Linux 分区（类型 83）。然后，在 shell 提示符下输入\
  \ `mkfs –t xfs *device*`。在图 10-2 中，`/dev/sdb1` 分区被格式化为 xfs 文件系统。\n\n![Images](img/f0353-02.jpg)\n\
  \n**图 10-2** 创建 xfs 文件系统\n\n此外，还可以使用 `mkfs` 命令在 Linux 分区上创建非 Linux 文件系统（例如 FAT）。首先，使用\
  \ `fdisk` 创建一个标准的 Linux 分区（类型 83）。然后只需在 shell 提示符下输入 `mkfs –t vfat *device*` 即可。这是一个示例：\n\
  \n![Images](img/p0353-01.jpg)\n\n### 使用 mkswap\n\n到目前为止一切顺利，但如果你需要将创建的分区格式化为交换分区而不是数据分区怎么办？别担心，你也可以在\
  \ shell 提示符下使用 `mkswap` 命令来实现。和数据分区一样，用于交换的分区也必须使用 `mkswap` 命令进行准备。\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** Linux 系统可以有多个交换分区。事实上，在负载密集的系统上，分布在几块硬盘上的多个交换分区可以显著提高性能。\n\n该命令的语法为 `mkswap\
  \ *device*`——例如，`mkswap /dev/sdb2`。\n\n***\n\n![Images](img/caution.jpg)\n\n**警告**\
  \ 必须先使用 `fdisk` 工具将分区类型设置为 `82`！\n\n以下是一个示例：\n\n![Images](img/p0354-01.jpg)\n\n\
  将分区配置为交换分区后，你需要在 shell 提示符下使用 `swapon` 命令来启用它。语法为 `swapon *device*`——例如，`swapon\
  \ /dev/sdb2`。\n\n你可以通过在 shell 提示符下输入 `swapoff *device*` 来禁用现有交换分区——例如，`swapoff /dev/sdb2`。\n\
  \n***\n\n![Images](img/tip.jpg)\n\n**提示** 如果你想一次激活所有的交换分区，可以输入 `swapon –a`。`swapon`\
  \ 工具将搜索你的 `/etc/fstab` 文件以识别所有定义的交换分区并将其挂载。要禁用所有当前启用的交换分区，请在 shell 提示符下输入 `swapoff\
  \ –a`。\n\n一旦你的分区格式化为文件系统，就必须挂载它才能使用。让我们接着回顾一下如何操作。\n\n### 挂载分区\n\nLinux 与其他操作系统（如\
  \ Windows）的主要区别之一是，在使用文件系统之前需要对其进行挂载。这是另一个让新 Linux 管理员困惑的“坑”。你甚至必须先挂载硬盘、DVD 和 USB\
  \ 驱动器！我们将在本章后面讨论挂载移动介质。\n\n好消息是，挂载分区的过程相对简单。这是使用 `mount` 命令完成的。`mount` 工具将分区挂载到文件系统中现有目录中。当你切换到该目录时，实际上切换到了该分区。\n\
  \n新的 Linux 管理员有时难以理解这个概念。其他操作系统（如 Windows）默认使用驱动器号（如 C: 或 D:）来引用磁盘上的分区。\n\n例如，如果你的\
  \ Windows 系统中有一个硬盘有两个分区，第一个分区将使用驱动器号 C: 访问，第二个分区将使用驱动器号 D: 访问。每个驱动器都有自己独立的目录和文件层级结构。\n\
  \nLinux 并非如此！相反，Linux 使用虚拟文件系统 (VFS)，它创建了一个涵盖系统中所有存储设备上所有分区的单一层级结构。切换到挂载分区的目录就是切换到该分区。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 较版本的 Windows 也允许你将分区挂载到目录中。然而，在我看来，这远没有\
  \ Linux 下的操作方式优雅。\n\n要使用 `mount` 命令挂载分区，首先使用 `su` 切换到 root 账户。然后在 shell 提示符下输入 `mount\
  \ –t *file_system_type device mount_point*`。我知道这看起来很复杂，但实际上并非如此。例如，假设你在系统中的第二块硬盘的第一个分区上创建了\
  \ ext4 文件系统，现在你想将其挂载到名为 `/mnt/extraspace` 的目录中。要此操作，你需要在 shell 提示符下输入 `mount –t\
  \ ext4 /dev/sdb1 /mnt/extraspace`，如下所示：\n\n```\nopenSUSE:~ # mount -t ext4 /dev/sdb1\
  \ /mnt/extraspace/\n```\n\n现在，每当你切换到文件系统中的 `/mnt/extraspace` 目录时，你就切换到了新分区（`/dev/sdb1`）。如果你不知道分区使用的是哪种类型的文件系统，可以使用\
  \ `mount` 命令的 `-a` 选项代替 `-t`。这将导致 `mount` 尝试使用所有支持的文件系统类型挂载分区，直到成功为止。\n\n在大多数发行版中，`/mnt`\
  \ 目录是挂载本地和远程文件系统的默认目录。当然，你不必使用它。你可以将分区挂载到任何任何目录中。但按照惯例，`/mnt` 用于此类。在某些发行版中，它也是挂载移动设备的默认位置。然而，某些发行版（如\
  \ OpenSUSE 和较版本的 Fedora）使用 `/media` 作为挂载移动介质的默认位置。\n\n你还可以使用 `mount` 命令的 `-o` 选项包含多种挂载选项。例如，可以使用\
  \ `-o ro` 将分区挂载为只读。查看 `mount` 的帮助页获取所有可用选项的列表。\n\n***\n\n![Images](img/tip.jpg)\n\
  \n**提示** 我喜欢 `mount` 命令的原因之一是它可以用于在文件系统中挂载 ISO 镜像，允许你无需将其刻录到光盘即可访问其中的文件。语法为 `mount\
  \ –o loop *filename*.iso mount_point`。\n\n挂载分区后，你可以使用不带选项的 `mount` 命令查看所有已挂载的文件系统。你可以查看输出以验证设备是否已挂载。\n\
  \n例如，`mount` 命令输出的以下行表示 `/dev/sdb1` 挂载在 `/mnt/extraspace` 并使用 ext4 文件系统：\n\n```\n\
  /dev/sdb1 on /mnt/extraspace type ext4 (rw,relatime,data=ordered)\n```\n\n此外，每当你挂载或卸载分区时，`/etc/mtab`\
  \ 文件都会更新挂载的文件系统列表。你可以使用 `cat` 命令查看此文件以挂载的文件系统列表。例如，mtab 文件中的以下行也表示 `/dev/sdb1` 分区挂载在\
  \ `/mnt/extraspace`：\n\n```\n/dev/sdb1 /mnt/extraspace ext4 rw,relatime,data=ordered\
  \ 0 0\n```\n\n你还可以使用 `cat` 命令查看 `/proc/mounts` 文件以查看挂载的文件系统列表。另一个查看挂载分区的实用工具是 `df`。该工具显示你的分区、挂载位置、已用空间以及仍剩余的可用空间。\n\
  \n\n\n\n\n如果由于某种原因你需要卸载一个分区，可以使用 `umount` 命令。要卸载分区，只需输入 `umount`，后跟该分区的设备路径或挂载目录。例如，要卸载上一个示例所示的\
  \ `/dev/sdb1` 分区，你将输入 `umount /dev/sdb1` 或 `umount /mnt/extraspace`，如下所示：\n\n```\n\
  openSUSE:~ # umount /dev/sdb1\n```\n\n***\n\n![Images](img/tip.jpg)\n\n**提示** 注意，命令是“umount”，*而不是*“unmount”。这又是一个\
  \ Linux 陷阱！\n\n这在操作 Linux 时引入了另一个问题。仅仅因为你使用 `mount` 挂载了文件系统，并不意味着在重启系统后它仍会保持挂载状态。只要系统持续运行，分区就会保持挂载。然而，如果你重启系统，分区在系统重新启动时将不会重新挂载。\n\
  \n你可以使用 `/etc/fstab` 文件来解决这个问题。该文件包含了操作系统每次启动时都会挂载的文件系统列表。一个典型的 `/etc/fstab` 文件如下：\n\
  \n![Images](img/p0356-01.jpg)\n\n我知道这个文件初看起来可能有点困惑，但实际上并不难。`/etc/fstab` 文件中的每一行都指定了一个要在启动时挂载的独立文件系统。每行由六字段组成，如表\
  \ 10-1 所示。\n\n![Images](img/t0357-01.jpg)\n\n**表 10-1** `/etc/fstab` 文件中的字段\n\n\
  注意，我们之前创建的 `/dev/sdb1` 分区没有在示例 fstab 文件中。这意味着系统重启后，它不会被挂载到 `/mnt/extraspace`。我们可以通过将分区添加到\
  \ `fstab` 文件来修复这个问题。使用 `vi` 等编辑器打开 `/etc/fstab`，然后添加以下行：\n\n![Images](img/p0356-02.jpg)\n\
  \n该行指定将 `/dev/sdb1` 分区使用 `ext4` 文件系统挂载到 `/mnt/extraspace`。它还指定为该文件系统启用访问控制列表（非常好的做法！）并为该文件系统启用扩展用户属性。现在，每当你重启系统时，该分区将自动挂载。\n\
  \n接下来，我们需要花几分钟讨论 LVM。\n\n## 理解 LVM\n\n逻辑卷管理（LVM）是在对 Linux 硬盘驱动器进行分区时的一种选项。它提供了创建磁盘分区传统过程的替代方案。相反，你从系统中的存储设备创建卷组。从卷组中，你将空间分配给特定的逻辑卷，这些卷由逻辑卷管理器管理。你不是挂载分区，而是将逻辑卷挂载到文件系统的挂载点。这在你在系统上分配空间时提供了极大的活性。例如，如果你在\
  \ `/usr` 挂载一个卷并在 `/home` 挂载一个卷，然后 `/home` 目录开始空间不足，你可以将挂载在 `/usr` 的卷的空间重新分配给挂载在\
  \ `/home` 的卷。这使用传统的磁盘分区是很难实现的！\n\n此外，LVM 允许你动态向系统添加空间。例如，假设 `/home` 卷空间不足。要增加容量，你只需要在系统中安装一个新硬盘，然后将它的空间分配给\
  \ `/home` 卷即可。搞定！卷的大小增加了。你不需要像使用传统分区那样备份数据并恢复它。\n\n在本章的这部分，我们将查看以下 LVM 主题：\n\n![images](img/bull.jpg)\
  \ LVM 组件\n\n![images](img/bull.jpg) LVM 配置\n\n让我们先看看 LVM 运行必须具备的组件。\n\n### LVM 组件\n\
  \nLVM 创建一个内存空间池（称为 `volume group`，卷组），从中可以创建 `logical volumes`（逻辑卷）。Linux 使用 LVM\
  \ 逻辑卷就像使用你用 `fdisk` 创建的标准分区一样。然而，逻辑卷的定义方式要复杂得多。LVM 的基本结构由以下组件组成：\n\n![images](img/bull.jpg)\
  \ **物理卷 (Physical volumes)** 物理卷可以是分区，也可以是整个硬盘。\n\n![images](img/bull.jpg) **卷组\
  \ (Volume groups)** 卷组由一个或多个分组的物理卷组成。需要记住的关键点是，物理卷可以来自不同的硬盘。这意味着当你需要更多存储空间时，可以随时向卷组添加硬盘或分区。\n\
  \n![images](img/bull.jpg) **逻辑卷 (Logical volumes)** 这些是从卷组中定义的。逻辑卷可以格式化为 Linux 文件系统，并像物理分区一样挂载。\n\
  \n这些组件协同工作为 Linux 系统提供存储的方式如图 10-3 所示。\n\n![Images](img/f0358-01.jpg)\n\n**图 10-3**\
  \ LVM 组件\n\n### LVM 配置\n\n要创建并挂载逻辑卷，你需要创建物理卷、卷组，然后是逻辑卷（按此顺序）。\n\n**创建 LVM 物理卷**\
  \ 你可以使用磁盘分区甚至整个硬盘作为物理 LVM 物理卷。如果你决定使用现有的分区，应该将分区类型设置为 Linux LVM (8e)。然而，根据我的经验，标准的\
  \ Linux 分区（类型 83）效果同样很好。这里显示了使用 `fdisk` 设置分区类型的示例：\n\n![Images](img/p0359-01.jpg)\n\
  \n注意，如果你想将整个硬盘作为 LVM 物理卷，它不能包含分区表。如果你想使用的磁盘已经有了现有的分区表，可以使用 `dd` 命令将其抹除。在接下来的示例中，我们用来自\
  \ `/dev/zero` 设备文件的无空空字符覆盖 `/dev/sdc` 硬盘上的第一个 512KB 块（MBR 分区所在）：\n\n![Images](img/p0359-02.jpg)\n\
  \n一旦确定了要使用哪些磁盘/分区，在 shell 提示符处运行 `pvcreate` 命令将它们定义为 LVM 物理卷。语法为 `pvcreate device`。在接后的示例中，`/dev/sdb`\
  \ 上的两个分区被定义为物理卷，同时也包括整个 `/dev/sdc` 硬盘：\n\n![Images](img/p0359-03.jpg)\n\n完成后，你可以使用\
  \ `pvscan -v` 命令查看系统上所有的物理卷及其大小。如下例所示：\n\n![Images](img/p0359-04.jpg)\n\n***\n\n\
  ![Images](img/tip.jpg)\n\n**提示** 如果以后由于某种原因（例如硬盘驱动器故障）需要删除一个物理卷，可以使用 `pvmove` 工具将数据从要删除的物理卷移动到你在系统中定义的另一个物理卷上。\n\
  \n一旦你定义了物理卷，就可以准备创建卷组了。让我们让我们回顾如何操作。\n\n**创建 LVM 卷组** 使用 `vgcreate` 工具在你的系统中创建卷组。语法为\
  \ `vgcreate volume_group_name physical_volume1 physical_volume2 ...`。在接下来的示例中，使用\
  \ `sdb1`、`sdb2` 和 `sdc` 物理卷创建一个名为 DATA 的卷组：\n\n![Images](img/p0360-01.jpg)\n\n注意\
  \ `pvscan` 命令的输出，这三个物理卷现在是 DATA 卷组的成员。在你最初创建卷组后，可以使用以下命令对其进行管理：\n\n![images](img/bull.jpg)\
  \ 使用 `vgexpand` 向现有卷组添加额外的物理卷。\n\n![images](img/bull.jpg) 使用 `vgreduce` 从现有卷组中移除物理卷。在运行\
  \ `vgreduce` 之前，你必须使用 `pvmove` 将要移除物理卷中的数据移动到系统的另一个物理卷上。\n\n![images](img/bull.jpg)\
  \ 使用 `vgremove` 删除卷组。在使用 `vgremove` 之前，你必须先删除在该卷组中定义的所有逻辑卷。\n\n\n\n\n\n# 创建 LVM\
  \ 逻辑卷\n\n你使用 `lvcreate` 命令在卷组内创建逻辑卷。语法为 `lvcreate –L volume_size –n volume_name\
  \ volume_group_name`。在以下示例中，`DATA` 卷组中定义了两个 7GB 的卷（命名为 `research` 和 `development`）：\n\
  \n![Images](img/p0360-02.jpg)\n\n注意，我们使用了 `lvscan` 命令来查看系统上定义的逻辑卷。还要注意，我们在卷组中定义了两个卷，而该卷组本身是由两个磁盘分区和一个整个硬盘的所有存储空间汇总而成的。非常酷！\n\
  \n在创建逻辑卷后，你可以使用以下命令来管理它们：\n\n![images](img/bull.jpg) 使用 `lvextend` 增加逻辑卷的大小。你必须先向卷组添加额外的物理卷（磁盘或分区）才能此操作。\n\
  \n![images](img/bull.jpg) 使用 `lvreduce` 缩小逻辑卷的大小。\n\n![images](img/bull.jpg) 使用\
  \ `lvremove` 从系统中删除逻辑卷。\n\n***\n\n![Images](img/caution.jpg)\n\n**警告** 在使用 `lvreduce`\
  \ 和 `lvremove` 时要极度小心！如果文件系统大于你用 `lvreduce` 指定的大小，你将面临切断数据块的风险。如果你决定使用 `lvremove`\
  \ 删除逻辑卷，应该将任何你不想丢失的数据迁移到另一个逻辑卷。\n\n一旦创建了逻辑卷，你需要在它们上创建文件系统然后将其挂载。你使用 `mkfs` 创建文件系统，就像对传统分区进行操作一样。使用以下语法：\n\
  \n`mkfs –t file_system /dev/volume_group/logical_volume`\n\n你使用 `mount` 命令挂载逻辑卷，就像挂载到传统分区上的文件系统一样。使用以下语法：\n\
  \n`mount –t file_system /dev/volume_group/logical_volume /mount_point`\n\n接下来我们来谈谈维护\
  \ Linux 文件系统。\n\n## 维护 Linux 文件系统\n\n与其他任何其他操作系统一样，你仍然需要监控和维护你的 Linux 文件系统。在本章的这部分，你将学习如何做到这一点，我们将涵盖了以下主题：\n\
  \n![images](img/bull.jpg) 检查分区和文件使用情况\n\n![images](img/bull.jpg) 检查文件系统完整性\n\n![images](img/bull.jpg)\
  \ 检查打开的文件\n\n![images](img/bull.jpg) 识别使用文件的进程\n\n### 检查分区和文件使用情况\n\n维护 Linux 文件系统时需要避免的关键问题之一是磁盘空间耗尽。Linux\
  \ 提供了 `df` 和 `du` 工具来帮助你跟踪分区使用了多少空间以及哪些文件在使用这些空间。\n\n`df` 工具显示你的硬盘分区、光驱器和其他存储设备（如\
  \ USB 驱动器）挂载在文件系统中的位置。它还显示设备的总大小以及已用多少空间。不带任何选项运行 `df` 将显示所有挂载文件系统的信息，如下所示：\n\n\
  ![Images](img/p0361-01.jpg)\n\n你可以在 shell 提示符处输入 `df filename`。这会导致 `df` 显示指定文件所在分区的信息，如示例所示：\n\
  \n![Images](img/p0362-02.jpg)\n\n注意前面的示例，默认情况下，`df` 以块（blocks）为单位显示空间统计。如果你是一个位狂并喜欢通过块数来计算可用磁盘空间，那么这没问题。我不喜欢。因此，我始终在\
  \ `df` 命令中使用 `-h` 选项。这会导致 `df` 以人类可读的格式显示空间统计，例如 KB、MB 和 GB。前面示例中相同信息的 `-h` 选项版本如后续所示：\n\
  \n![Images](img/p0362-03.jpg)\n\n好多了！如果你想查看每个分区使用的文件系统类型，你也可以添加 `-T` 选项，如下所示：\n\n\
  ![Images](img/p0362-04.jpg)\n\n另一个你可以配合 `df` 使用的有用选项是 `-i`，它列出 inode 使用信息而不是磁盘空间使用情况。回想本章前面的内容，当在分区上创建文件系统时，会分配一个固的最大\
  \ inode 数量。如果文件系统存储了大量的微小文件，即使仍有大量磁盘空间可用，它也可能耗尽 inode。你可以使用 `df –i` 命令监控 inode 使用情况，如下所示：\n\
  \n![Images](img/p0363-01.jpg)\n\n另一个你可以用来监控磁盘空间使用情况的工具是 `du` 工具。它的功能是为指定的目录递归地提供每个文件磁盘空间使用情况的摘要。语法为\
  \ `du directory`。你可以配合 `du` 使用的一些有用选项包括：\n\n![images](img/bull.jpg) `-c` 用于计算总计\n\
  \n![images](img/bull.jpg) `-h` 用于以人类可读的格式显示输出\n\n![images](img/bull.jpg) `--exclude\
  \ filename_or_pattern` 用于排除所有匹配指定文件名或模式的文件\n\n根据我的经验，`-h` 选项是最有用的。这里有一个人类可读格式查看\
  \ `/tmp` 目录下文件占用空间的示例：\n\n![Images](img/p0363-02.jpg)\n\n### 检查文件系统完整性\n\n与其他任何其他操作系统一样，Linux\
  \ 分区有时会遇到问题。这些问题可能由各种情况引起；但根据我的经验，分区损坏问题的首要原因是导致系统非正常关机的停电。如果你的系统在没有正确卸载挂载分区的情况下崩溃，极有可能发生数据损坏。\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 这是在你的系统中实施不间断电源（UPS）的有力理由。Linux 不喜欢意外关机！\n\
  \n如果发生这种情况，你需要检查文件系统的错误并在必要时进行修复。这是通过文件系统检查工具 (`fsck`) 来完成的。要使用此工具，你必须先卸载想要检查的文件系统。然后在\
  \ shell 提示符处输入 `fsck device`。例如，如果你想检查系统中第二个硬盘第一个分区上的文件系统，你将输入 `fsck /dev/sdb1`。该工具将检查文件系统并报告遇到的任何错误（或没有错误）。以下是\
  \ `fsck` 的示例输出：\n\n![Images](img/p0364-01.jpg)\n\n如果遇到错误，将显示一个代表所遇错误总和的代码：\n\n![images](img/bull.jpg)\
  \ `0` 无错误。\n\n![images](img/bull.jpg) `1` 文件系统错误已修正。\n\n![images](img/bull.jpg)\
  \ `2` 系统应重启。\n\n![images](img/bull.jpg) `4` 文件系统错误仍未修正。\n\n![images](img/bull.jpg)\
  \ `8` 运行错误。\n\n![images](img/bull.jpg) `16` 使用或语法错误。\n\n![images](img/bull.jpg)\
  \ `32` 用户请求取消 Fsck。\n\n![images](img/bull.jpg) `128` 共享库错误。\n\n注意在这个示例中运行了 `e2fsck`。那是因为\
  \ `fsck` 实际上只是以下工具的前端：\n\n![images](img/bull.jpg) /sbin/fsck.msdos\n\n![images](img/bull.jpg)\
  \ /sbin/fsck.cramfs\n\n![images](img/bull.jpg) /sbin/fsck.ext3\n\n![images](img/bull.jpg)\
  \ /sbin/dosfsck\n\n![images](img/bull.jpg) /sbin/fsck.ext2\n\n![images](img/bull.jpg)\
  \ /sbin/fsck\n\n![images](img/bull.jpg) /sbin/e2fsck\n\n![images](img/bull.jpg)\
  \ /sbin/fsck.ext4\n\n![images](img/bull.jpg) /sbin/fsck.vfat\n\n![images](img/bull.jpg)\
  \ /sbin/fsck.minix\n\n![images](img/bull.jpg) /sbin/fsck.reiserfs\n\n如果你不带任何选项运行\
  \ `fsck`，它将查询你的 `/etc/fstab` 文件以确定要检查的分区的文件系统类型，然后加载适用于该文件系统的模块。如前面的列表所示，Reiser、ext2、ext3\
  \ 和 ext4 文件系统都存在 `fsck` 版本。\n\n\n\n\n\n检查完成后，你可以使用 `mount` 命令重新挂载分区。\n\n`e2fsck`\
  \ 的一个非常实用的功能是能够恢复 ext2/3/4 文件系统上损坏的超级块（superblock）。回本章前面的内容，超级块是位于分区开处的块，包含了有关文件系统结构的信息。此外，大多数\
  \ Linux 文件系统在分区的不同位置保留超级块的备份副本。如果超级块损坏，你可以使用这些备份副本之一进行恢复。语法为 `e2fsck –f –b backup_superblock\
  \ device`。`–f` 选项告诉 `e2fsck` 强制检查，即使文件系统看起来是干净的。`–b` 选项告诉 `e2fsck` 应该使用哪一个超级块副本。\n\
  \n这里是一些其他实用的文件系统管理工具：\n\n![images](img/bull.jpg) tune2fs  此工具用于调整 ext2/3/4 文件系统上的各种文件系统参数。以下是你可以使用的一些选项：\n\
  \n![images](img/bull.jpg) `–c n` 设置挂载次数（`n`），达到该次数后 `fsck` 将自动检查文件系统。\n\n![images](img/bull.jpg)\
  \ `–i d|m|w` 设置文件系统检查之间的最大时间，单位为 `d`（天）、`m`（月）或 `w`（周）。\n\n![images](img/bull.jpg)\
  \ `–j` 为 ext2 文件系统添加日志（journal）。\n\n![images](img/bull.jpg) `–L volume_label` 设置文件系统的卷标。\n\
  \n以下是一个示例：\n\n![Images](img/p0365-01.jpg)\n\n![images](img/bull.jpg) reiserfst \
  \ 这是 Reiser 文件系统中等于 `tune2fs` 的工具。\n\n![images](img/bull.jpg) dumpe2fs 显示关于 ext2/3/4\
  \ 文件系统的有用信息。使用 `–h` 选项可以让输出更具可读性。示例所示：\n\n![Images](img/p0365-02.jpg)\n\n![Images](img/p0366-01.jpg)\n\
  \n![images](img/bull.jpg) debugfs  `debugfs` 程序是一个交互式文件系统调试器。它可以用于检查甚至更改 ext2/3/4\
  \ 文件系统的状态。语法为 `debugfs device`。当你运行此命令时，会显示 `debugfs:` 提示符，如下：\n\n![Images](img/p0366-02.jpg)\n\
  \n默认情况下，文件系统以只读模式打开。如果你需要对文件系统进行更改，需要包含 `–w` 选项以读写模式打开它。以下是你可以在 `debugfs:` 提示符下输入的一些命令：\n\
  \n![images](img/bull.jpg) show_super_stats 显示等同于 `dumpe2fs` 显示的信息。\n\n![images](img/bull.jpg)\
  \ `write in_file out_file` 允许将文件从一个文件系统复制到另一个文件系统。当你尝试从损坏的文件系统中恢复重要文件时，这非常有用。\n\n\
  ![images](img/bull.jpg) `stat file_or_directory_name` 显示关于指定文件或目录的扩展信息。以下是一个名为 `myfile2.txt`\
  \ 的文件的示例：\n\n![Images](img/p0367-01.jpg)\n\n![images](img/bull.jpg) list_deleted_inodes\
  \ 显示文件系统中已删除的 inode 列表。\n\n你可以使用 `debugfs` 做很多事情。我们没有时间或空间在这里涵盖所有内容。请查看 `debugfs`\
  \ 的帮助页面以获取更多信息。\n\n![images](img/bull.jpg) xfs_admin xfs 文件系统中等于 `tune2fs` 的工具。此工具实际上使用\
  \ `xfs_db` 可执行文件来修改 xfs 文件系统的各种参数。在进行任何更改之前必须卸载文件系统。你可以配合此工具使用的选项包括：\n\n![images](img/bull.jpg)\
  \ `–j` 启用版本 2 日志格式，这是一种支持更大日志缓冲日志格式。\n\n![images](img/bull.jpg) `–l` 显示文件系统的标签。\n\
  \n![images](img/bull.jpg) `–u` 显示文件系统的通用标识符（UUID）。\n\n![images](img/bull.jpg) `–L\
  \ label` 设置文件系统的标签。\n\n![images](img/bull.jpg) `–U uuid` 设置文件系统的 UUID。\n\n![images](img/bull.jpg)\
  \ xfs_info 显示关于 xfs 文件系统的有用信息。\n\n![images](img/bull.jpg) xfs_metadump 将 xfs 文件系统的元数据（如文件名和文件大小）转储到文件中。\n\
  \n让我们来看如何在 Linux 文件系统上识别打开的文件。\n\n### 检查打开的文件\n\n你可以在 shell 提示符处使用 `lsof` 命令显示打开文件列表。在\
  \ shell 提示符下不带任何选项输入 `lsof` 将列出所有属于你的打开文件。\n\n你可以配合 `lsof` 的有用选项：\n- `–s`: 指定文件。\n\
  - `–t`: 简洁输出。\n- `–u user`: 仅显示指定的用户。\n\n### 使用文件的进程\n\n除了列出打开的文件，你可能还需要识别哪些进程正在使用某个文件。`fuser`\
  \ 命令显示运行进程的 PID。\n\n你可以配合 `fuser` 的选项：\n- `–a`: 显示所有文件。\n- `–e`: 正在执行的可执行文件。\n-\
  \ `–f`: 文件系统。\n- `–m`: 根目录。\n- `–v`: 共享库。\n- `–k`: 进程名。\n- `–i`: 请求确认。\n- `–u`:\
  \ 进程 ID。\n\n### 练习 10-1：管理分区\n\n在此练习中，你将练习操作分区。你可以使用书中附的虚拟机进行此练习。\n\n* *\n\n![Images](img/viedo.jpg)\n\
  \n**视频** 请观看练习 10-1 视频，演示如何执行此任务。\n\n\n\n\n\n16. 输入 `mount` 验证磁盘已挂载。\n\n17. 在 shell\
  \ 提示符下输入 `vi /etc/fstab` 配置文件系统在每次系统启动时自动挂载。\n\n18. 在文件中添加以下行：\n`/dev/sdb1 /mnt/newdisk\
  \ ext4 acl,user_xattr 1 2`\n\n19. 保存更改并退出 vi。\n\n20. 首先通过卸载设备来检查你的新文件系统。在 shell\
  \ 提示符下输入 `umount /mnt/newdisk`。\n\n21. 在 shell 提示符下输入 `fsck /dev/sdb1`。`fsck` 工具应该报告文件系统是干净的。\n\
  \n22. 重新挂载设备。\n\n23. 输入 `exit` 返回你的普通用户账户。\n\n让我们转换一下话题，讨论如何在 Linux 系统上使用移动介质。\n\
  \n## 挂载移动介质\n\n对于从 Windows 转到 Linux 的人来说，操作 Linux 系统较困难方面之一可能是如何使用移动介质，包括光盘和 USB\
  \ 驱动器。在 Windows 系统上使用这些类型的存储设备轻而易举，你只需插入光盘一切就能正常工作。\n\n另一方面，在 Linux 系统上使用移动介质需要多花一点精力。然而，通过练习，你会变成你的本能。在本章的这部分，你将学习如何让这一切正常工作。具体来说，我们将讨论以下任务：\n\
  \n![images](img/bull.jpg) 使用光驱设备\n\n![images](img/bull.jpg) 使用 USB 和 FireWire 设备\n\
  \n让我们从讨论如何使用老光盘开始。\n\n### 使用光驱设备\n\n就像挂载分区一样，在使用之前你必须先挂载光驱器，例如 CD、DVD 或蓝光光。唯一的真实区别是所使用的挂载点和文件系统类型。对于大多数光盘，你可以使用\
  \ `mount` 命令配合 `iso9660` 文件系统类型。对于蓝光光，你指定文件系统类型 `udf`。如果你不确定使用哪种文件系统类型，只需指定 `auto`\
  \ 并让 `mount` 命令为你判断即可。\n\n你可以在文件系统的任何地方挂载光盘。但是，根据惯例，它们通常被挂载在 `/media` 或 `/mnt` 中，取决于你的发行版。\n\
  \n![Images](img/note.jpg)\n\n**注意** 大多数现代 Linux 发行版实现了一个名为 `autofs` 的服务来帮助挂载移动介质。在配置并运行时，它会自动检测何时插入了移动介质并为你挂载。\n\
  \n要在 Linux 系统上挂载光盘，请将其插入光驱。切换到 root 账户，然后输入 `mount –t iso9660 *device mount_point`。例如，如果你想将光盘挂载到\
  \ `/media/dvd`，你将输入 `mount –t iso9660 /dev/sr0 /media/dvd`，如下：\n\n![Images](img/p0370-01.jpg)\n\
  \n![Images](img/note.jpg)\n\n**注意** 大多数发行版还实现了一个指向 `/dev/sr0` 的符号链接文件 `/dev/cdrom`。\n\
  \n与硬盘分区一样，你可以通过向 `/etc/fstab` 文件添加条目使光驱设备的挂载过程变得简单。考虑以下：\n\n![Images](img/p0371-01.jpg)\n\
  \n添加此行后，你只需要输入 `mount /dev/sr0` 即可挂载光驱设备。与任何挂载的文件系统一样，在弹出光盘之前，你应该使用 `umount` 卸载它。\n\
  \n接下来让我们讨论挂载外部存储设备。\n\n### 使用 USB 和 FireWire 设备\n\n所有 Linux 发行版都支持使用 USB 或 FireWire\
  \ 接口的外部存储设备。由于 Linux 支持即插即用，当你连接外部存储（如闪存盘或外部硬盘）时，它会自动检测到新设备。\n\n大多数 Linux 发行版会将这些设备视为\
  \ SCSI 设备。你的外部设备通过 `/dev/sd*x` 进行寻址。`x` 的值取决于系统中已经安装了多少块硬盘。它始终会被识别为系统中的最后一个 SCSI\
  \ 设备。例如，如果你有一个 SATA 硬盘和一个 SATA DVD 驱动器，那么你的外部 USB 或 FireWire 设备将是 `/dev/sdc`。\n\n\
  要验证这一点，你可以在连接设备后检查 `/var/log/messages` 文件。你应该能看到一条内核消息，指示已连接了一个新的 SCSI 磁盘。如有必要，可以使用之前讨论的相同程序在设备上创建分区，然后创建文件系统。如果设备上已经创建了文件系统，你只需要挂载它。\n\
  \n你挂载 USB 和 FireWire 设备的方式与挂载典型的硬盘分区相同。这里出现的一个问题是，你可能无法完全确定外部设备使用的是什么文件系统，特别是当该驱动器在多个具有不同操作系统的计算机之间使用时。因此，我建议在使用\
  \ `mount` 命令时使用 `–t auto` 选项。这将导致 `mount` 尝试检测设备上使用了哪种文件系统。\n\n除外，挂载 USB 或 FireWire\
  \ 设备相对简单。只需输入 `mount –t auto *device mount_point`。例如，如果我想将系统中的第四个设备外部闪存盘挂载到 `/media/THUMBDRIVE`\
  \ 目录，我将输入 `mount –t auto /dev/sdd /media/THUMBDRIVE`。\n\n![Images](img/note.jpg)\n\
  \n**注意** 如果你的系统上运行着 `autofs`，它会自动检测何时插入了 USB 或 FireWire 设备并为你挂载。\n\n与任何其他设备一样，你可以向\
  \ `/etc/fstab` 文件添加条目以使过程更简单。此外，在使用 `umount` 命令将设备从系统中移除之前，你必须先卸载设备。\n\n现在你已经了解了\
  \ Linux 文件系统的工作原理以及如何完成常见的文件系统任务，让我们来讨论如何备份文件系统。\n\n## 数据备份\n\n作为 Linux 系统管理员，你必须执行的关键角色之一是确保你负责的系统上的数据得到保护。实现此点的方法之一就是备份数据。备份创建了数据的冗副本，这样如果发生灾难，就可以恢复数据。\n\
  \n重要的是，你要记住数据大部分存储在 Linux 系统的机械设备上。硬盘有电机和其他运动部件，随着时间的推移会缓慢磨损。事实上，硬盘通常由制造商分配一个平均故障间隔时间（MTBF）值。这个\
  \ MTBF 基本上给了你一个硬盘故障之前可以使用多多久的估计。基本上，硬盘*是否*会故障不是问题，而是*何时*故障的问题。\n\n我提到这一点是因为我希望你能够认真对待备份。坦率地说，许多系统管理员在运行备份方面变得非常懒惰。这是一个很容易被忽略的任务，想着“我明天再运行备份……””。等你发现时，距离上次运行备份已经过去几周了。\n\
  \n如果你受雇于某个机构维护他们的系统而你没有运行备份，我可以几乎保证，如果发生灾难，你会失去工作。几年前，我参加了一个与服务器完全崩溃的系统管理员的支持电话。他打电给我们是出于最后的尝试，希望我们有某种魔法解决方案能找回他的数据。当我们告诉他我们做不到，他必须重新安装并从备份中恢复时，电话那头沉默了良久。他显得有些哽咽，低声说：“我没有任何备份。我会因为这事丢工作的。”听我的建议，制定一个备份计划并虔诚地遵守它。\n\
  \n备份计划包含几个组件。在本章的这部分，我们将讨论以下：\n\n![images](img/bull.jpg) 选择备份介质\n\n![images](img/bull.jpg)\
  \ 选择备份策略\n\n![images](img/bull.jpg) 使用 Linux 备份工具\n\n\n\n\n\n让我们从讨论如何选择备份介质开始。\n\
  \n## 选择备份介质\n\n在“过去”，备份数据实际上只有两种选择：软磁盘和带机。软磁盘的容量很小，而且以极不可靠而闻名，因此大多数系统管理员选择选择带机。\n\
  \n今天，仍有一些管理员使用带机来备份数据。带机使用磁带来存储数据，就像 8 毫米视频摄像机中使用的磁带一样。带机可以存储大量数据且价格廉廉。对于为你的 Linux\
  \ 系统备份数据，它们是一个可以接受的选择。\n\n然而，带机具有几个局限性。首先，它们会磨损。带机有很多机械部件，这些部件随着时间的推移会磨损。磁带本身在带机的读写头上运行，由于摩擦，它也会随着时间而磨损。其次，磁带的速度相对较慢。备份大量数据可能需要几个小时。\n\
  \n因此，许多管理员正在探索其他备份系统数据的介质。曾几何一段时间，可读写 CD 和 DVD 备份非常流行。然而，现代硬盘的容量非常大，使得光盘在运行系统级备份时已经过时了。现在用\
  \ DVD 备份一个 3TB 的硬盘，就像 20 年前用软磁盘备份一个 100MB 的硬盘一样。是的，这可以做到，但这是一个痛苦且耗时的过程。除非你要备份的数据量非常小，否则我不建议这种方案。\n\
  \n许多系统管理员正在探索的另一个选项（也是我个人非常喜欢的）是使用移动式 USB 硬盘。在过去，我们使用带机备份硬盘，因为硬盘极其昂贵。20 世纪 90 年初的一个通用规则是购买硬盘“每兆\
  \ 1 美元”。使用硬盘进行备份太贵了。此外，我们当时没有用于硬盘的热插拔外部接口。因此，磁带是少数几个可行方案之一。\n\n然而，今天硬盘的价格已经大幅下降。你可以以每\
  \ GB 低于 0.10 美元的价格购买移动式 USB 或 FireWire 硬盘。使用外部硬盘进行备份有两个明显的优势。首先，它们比磁带快得多。在带机上需要几小时的备份，在硬盘上只需要几分钟。其次，硬盘通常比带机更可靠。\n\
  \n当然，使用硬盘进行备份并不是完美的解决方案。其中一个主要的缺点是，磁盘分区必须挂载到移动驱动器上才能运行备份。如果系统发生某些糟糕的情况导致主硬盘上的数据损坏，而此时移动驱动器又是连接状态，这也可能破坏移动驱动器上的数据。\n\
  \n与任何备份介质一样，在决定使用外部硬盘进行备份时，你必须权衡其优缺点。\n\n***\n\n![Images](img/tip.jpg)\n\n**提示**\
  \ 就我个人而言，我更倾向于使用热备份方案而非标准备份。在我的关键任务 Linux 系统上，我使用 `rsync` 工具将数据通过网络同步到第二个 Linux\
  \ 系统，本质上是创建了一个镜像系统。在我的办公室里，我每小时同步一次；但你可以根据需要增加或减少频率。如果我的主系统宕机了，我可以简单地切换到备份系统。我只需要几秒钟就能恢复并运行！\n\
  \n***\n\n![Images](img/note.jpg)\n\n**注意** 如今许多用户正选择使用云备份。在订阅了云备份服务后，你的系统将通过互联网自动备份到世界上其他地方的数据中心。云备份既可靠又非常方便。然而，这个选项周围存在许多安全安全问题。我如何知道我的数据传输是安全的？我如何知道服务提供商的网络和服务器是安全的？\n\
  \n无论如何，你首先需要选择将要使用的备份介质，购买合适的设备并将其连接到你的系统。一旦就绪，你接下来需要选择备份策略。\n\n## 选择备份策略\n\n在创建备份计划时，对于如何进行备份，你有几种不同的选项。你需要考虑以下因素：\n\
  \n![images](img/bull.jpg) 选择备份类型\n\n![images](img/bull.jpg) 选择备份计划\n\n![images](img/bull.jpg)\
  \ 确定备份什么内容\n\n让我们从选择备份类型开始。\n\n### 选择备份类型\n\n取决于你选择的备份工具，你通常会有至少三种不同类型的备份可以使用（有时更多）。这些包括：\n\
  \n![images](img/bull.jpg) **全备**：在全量备份中，所有指定的文件都会被备份，无论它们自上次备份以来是否被修改过。完成后，每个文件都会被标记为已备份。\n\
  \n![images](img/bull.jpg) **增量备份**：在增量备份期间，仅备份自上次备份（全备或增量备份）以来修改过的文件。完成后，每个文件都会被标记为已备份。\n\
  \n![images](img/bull.jpg) **差异备份**：在差异备份期间，仅备份自上次全备以来修改过的文件。尽管它们在差异备份期间已被备份，但涉及的文件*不会*被标记为已备份。\n\
  \n要确定你的备份策略，你需要从上述备份类型中进行选择。例如，你可以每次都运行全备。这种策略是彻底且详尽的。当你恢复数据时，这也是最快的策略。\n\n然而，全备可能需要很长时间才能完成。这是因为无论文件自上次备份以来是否更改，每个文件都会备份。因此，许多管理员会将全备与增量或差异备份混合使用。\n\
  \n如果你使用“全备/增量”策略，你每周运行一次全备（通常在系统负载最轻的时候，例如周五晚上），然后在每周的其他六天每天都运行增量备份。使用这种策略，你每周应该会有一个全备和六个增量备份。这种策略的优点主要是速度。因为增量备份只备份自上次全备*或*增量备份以来更改的文件，所以它们运行得非常快。这种策略的缺点是，必须按照正确的顺序恢复七份备份。先恢复全备，然后是第一个增量，然后是第二个增量，依此类推。这是一个可能缓慢的过程。\n\
  \n或者，你也可以将全备与差异备份结合。在这种策略下，你通常在周五晚上运行一次全备。然后在每周的其他每个晚上运行一次差异备份。请记住，差异备份仅备份自上次全备以来更改的文件，*而不是*自上次差异备份以来。因此，每天的备份文件都会变得越来越大。这种策略的主要优点是恢复速度非常快。你不需要恢复七份备份，只需要恢复两份——先恢复最后一次全备，然后是最后一次差异备份（没有其他的了）。这种方法的缺点是，差异备份开始时非常快，但到了循环的最后一天，其耗时可能变得和全备一样长。\n\
  \n***\n\n![Images](img/caution.jpg)\n\n**警告**无论你做什么，千万不要将增量备份和差异备份混合使用！你的备份将会丢失数据，因为待备份的文件标记将不一致。\n\
  \n\n\n\n\n无论你选择哪种策略，都应该确保保持备份的循环。许多管理员会轮换备份介质，以便手中留有三到四周的过去备份。你永远不知道两周前被删除的文件会在什么时候突然被再次需要！\n\
  \n此外，你应该确保验证你的备份。大多数备份实用程序提供了一个选项，在备份完成后将备份与原始文件进行比对。如果你不这样做，你的备份中可能会存在错误。\n\n现在你已经选择了备份类型，接下来你需要设置备份计划。\n\
  \n## 选择备份计划\n\n你可以使用任何最适合你的备份计划。然而，如之前讨论过的，大多数管理员按周轮换工作。选择一天进行全量备份，然后本周的剩余天数用于增量备份或差异备份。\n\
  \n你还应该将备份安排在系统负载最轻时进行。根据你组织的时间安排，通常深夜或清晨是最佳选择。\n\n最后，你需要指定要备份的内容。让我们接下来来讨论这一点。\n\
  \n## 确定备份内容\n\n取决于你安装的软件包，你将处理的大多数 Linux 系统可能会消耗大量的磁盘空间。你需要决定这些被占磁盘空间中有多少需要被备份。\n\
  \n一种选项是备份整个系统。这是一个安全、彻底的选项。然而，由于涉及的数据量巨大，它的速度也较慢。许多管理员选择这样做。相反，他们只备份系统上的关键数据，例如用户数据和配置信息。这种策略背后的理论是，一旦发生故障，你只需重新安装新系统，然后将关键数据恢复其中。如果你选择这种策略，应该考虑备份\
  \ Linux 文件系统中的以下目录：\n\n![images](img/bull.jpg) `/etc`\n\n![images](img/bull.jpg)\
  \ `/home`\n\n![images](img/bull.jpg) `/opt`\n\n![images](img/bull.jpg) `/root`\n\
  \n![images](img/bull.jpg) `/var`\n\n![images](img/bull.jpg) `/srv`\n\n注意，这种策略并没有备份你的\
  \ Linux 系统或其实用程序。它只备份你的配置文件、用户数据、日志文件以及 Web/FTP 文件。\n\n一旦你确定了要备份的内容，计划的下部分就是确定你用什么来进行备份。\n\
  \n### 使用 Linux 备份实用程序\n\n在操作 Linux 时，你有许多不同的实用程序可以进行备份。许多工具随操作系统自带；另一些可以从第三方获取。对于你的\
  \ LPIC-1/Linux+ 考试，你需要熟悉大多数发行版通用且从 shell 提示符运行的工具。在本章的这部分，我们将查看：\n\n![images](img/bull.jpg)\
  \ 使用 `tar`\n\n![images](img/bull.jpg) 使用 `cpio`\n\n![images](img/bull.jpg) 使用 `dd`\
  \ 复制数据\n\n让我们先来看古老的 `tar` 实用程序。\n\n### 使用 tar\n\n`tar` 实用程序已经存在很长时间，是一个非常常用的 Linux\
  \ 备份工具。“tar”的缩写代表 tape archive（磁带归档）。`tar` 实用程序接受指定的文件列表并将其复制到单个归档文件（`.tar`）中。`.tar`\
  \ 文件可以使用 Linux 系统上的 `gzip` 实用程序进行压缩，生成具有 `.tar.gz` 扩展名的文件。这被称为 `tarball`（压缩包）。\n\
  \n`tar` 实用程序可以将备份作业发送到各种备份介质，包括磁带驱动器和移动式硬盘。使用 `tar` 创建备份的语法是 `tar –cvf filename\
  \ directory`。`-c` 选项告诉 `tar` 创建一个新的归档。`-v` 选项告诉 `tar` 以详细模式，在屏幕上显示正在备份的每个文件。`-f`\
  \ 选项指定要创建的 `tar` 归档名称。\n\n例如，如果你要在挂载在 `/media/usb` 的外部 USB 硬盘上为 `/home` 目录创建一个名为\
  \ `backup.tar` 的备份，你会输入 `tar –cvf /media/usb/backup.tar /home`，如示例所示：\n\n![Images](img/p0376-01.jpg)\n\
  \n注意示例中显示了 `tar: Removing leading ‘/’ from member names` 的消息。在创建 `tar` 归档时，绝对路径默认会被转换为相对路径。因此，开头的\
  \ `/` 被删除了。\n\n你可以在 `tar` 中使用表 10-2 所示的选项。\n\n![Images](img/t0377-01.jpg)\n\n**表\
  \ 10-2** tar 命令选项\n\n* * *\n\n![Images](img/note.jpg)\n\n**注意** 你也可以直接从 shell 提示符直接压缩/解压\
  \ `tar` 归档（或任何其他文件），使用 `gzip` 和 `gunzip` 实用程序、`bzip2` 和 `bunzip2` 实用程序或 `xz` 实用程序。使用\
  \ `bzip2` 而不是 `gzip` 压缩的归档文件通常具有 `.bz2` 扩展而不是 `.gz`。使用 `xz` 压缩的归档文件通常具有 `.xz` 或\
  \ `.lzma` 扩展。\n\n如果你想备份到磁带驱动器而不是 USB 驱动，可以将 `tar` 命令中的文件名参数替换为磁带驱动器的设备名称。在大多数发行版中，系统的第一个\
  \ SCSI 磁带驱动器通过 `/dev/st0` 引用。因此，如果你想运行与上例相同的备份但发送到 SCSI 磁带驱动器，可以输入 `tar –cvf /dev/st0\
  \ /home`。\n\n要恢复 `tar` 归档，只需输入 `tar –xvf filename`。例如，要提取我们刚刚创建的归档，你会输入 `tar –xvf\
  \ /media/usb/backup.tar`。这将归档提取到当前工作目录。如果归档已压缩，你也可以使用 `-z` 选项在提取之前解压缩归档。\n\n除了 `tar`\
  \ 之外，你还可以使用 `cpio` 创建备份。让我们接下来讨论如何使用它。\n\n### 使用 cpio\n\n`cpio` 实用程序也可以像 `tar` 一样创建归档文件。`tar`\
  \ 和 `cpio` 之间的关键区别在于，你必须通过标准输入为 `cpio` 提供要备份的文件和目录列表。可以使用 `cat` 显示文件内容，或者通过 `find`\
  \ 或 `ls` 生成列表。\n\n例如，假设你想备份 Linux 系统上 `/home/tux/myproject` 目录的内容。要使用 `cpio` 完成此操作，你以某种方式生成该目录的文件和目录列表并将其发送给\
  \ `cpio`。然后必须将 `cpio` 的输出重定向到文件。可以使用讨论过的 `find` 实用程序。你可以切换到 `/home/tux/myproject`\
  \ 然后输入 `find . –print –depth | cpio –ov > /media/usb/backup.cpio`。`find` 实用程序将生成当前目录下所有文件的列表。由于使用了\
  \ `-print` 选项，`find` 将每个文件的完整名称打印到屏幕上（标准输出）。由于还使用了 `-depth` 选项，`find` 在处理目录本身之前会检查每个目录的内容。\n\
  \n* * *\n\n![Images](img/tip.jpg)\n\n**提示** 如果 MyProjects 目录下没有子目录，此此更简单的方法是输入 `ls\
  \ | cpio –ov > /media/usb/backup.cpio`。\n\n这里的关键在于我们将 `find` 的标准输出管道到 `cpio` 的标准输入。`cpio`\
  \ 实用程序使用此作为归档的文件和目录列表。`-o` 选项告诉 `cpio` 创建一个新的归档。`-v` 选项只是告诉 `cpio` 以详细模式运行，显示处理时每个文件和目录的名称。最后，我们必须将\
  \ `cpio`（归档）的标准输出重定向到文件系统中的文件。这是通过输入 `>` 后跟归档文件名实现的。\n\n你还可以通过向管道中添加 `gzip` 实用程序来压缩\
  \ `cpio` 归档，例如，`ls | cpio –ov | gzip > /media/usb/backup.cpio.gz`。\n\n\n\n\n\n要从\
  \ `cpio` 归包恢复文件，你需要在 shell 提示符下运行 `cpio` 并使用 `-i` 选项指定要处理的归包名称。执行此操作时，归包文件将被提取到当前工作目录。例如，我们可以通过输入\
  \ `cpio –iv < /media/usb/backup.cpio` 来提取我们刚刚创建的归包：\n\n![Images](img/p0378-01.jpg)\n\
  \n如果 `cpio` 归包是用 `gzip` 压缩的，你必须先通过 `gunzip` 命令解压归包，然后才能 `cpio` 从从中提取文件。如下所示：\n\n\
  ![Images](img/p0379-01.jpg)\n\n如你所示，`backup.cpio.gz` 文件通过 `gunzip` 命令解压为 `backup.cpio`\
  \ 文件，现在可以使用 `cpio` 命令对其进行操作了。另一种方法是在 `gunzip` 命令中添加 `-c` 选项，然后将结果通过给 `cpio -i`。`-c`\
  \ 选项告诉 `gunzip` 将命令的输出写入标准输出，从而保持原始文件完好。本质上，这只是将解压缩后的文件名写入标准输出，然后将其发送到 `cpio` 处理。这里是一个示例：\n\
  \n![Images](img/p0379-02.jpg)\n\n如你所示，`gunzip` 命令提取了 `gzip` 归包中压缩的文件名并将其发送到 `cpio\
  \ -i` 命令，该命令将归包中的三个文件提取到本地目录。\n\n在我们结束本章之前，我们需要查看 `dd` 工具。让我们紧接着来看。\n\n### 使用 dd\
  \ 拷贝数据\n\n你可以使用 `dd` 命令来转换和拷贝文件。你可以用此命令拷贝各种 Linux 数据，包括整个分区。你可能在想：“没什么大不了，我已经知道如何使用\
  \ `cp` 和 `mv` 了。”实际上，`dd` 工具非常有用。`dd` 与其他文件拷贝工具的主要区别在于它使用记录（records*）来拷贝数据。记录的默认大小为\
  \ 512 字节。\n\n让我们先看看如何用 `dd` 拷贝文件。语法为 `dd if=*input_file of=*output_file*`。使用 `if=`（输入文件）选项指定要拷贝的文件。使用\
  \ `of=`（输出文件）选项指定新文件的名称。这里是一个示例：\n\n![Images](img/p0379-03.jpg)\n\n* * *\n\n![Images](img/note.jpg)\n\
  \n**注意** 你可以使用 `bs=*block_size*` 选项修改默认的记录大小。\n\n`dd` 的酷点之一在于，由于它使用记录，它可以将整个分区拷贝到单个文件中。这是非常强大的。本质上，`dd`\
  \ 是一个简单的命令行工具，你可以用它来实现某种形式的磁盘镜像。有一个朋友（一位 Uber Linux 管理员），他在脚本中使用 `dd` 来创建他自己的镜像应用。很酷的东西！\n\
  \n要拷贝整个分区，你在 shell 提示符下输入 `dd if=*device_file of=*output_file*`。分区的设备文件被用作输入文件。分区的所有内容都被写入指定的输出文件中。在接下来的示例中，使用\
  \ `dd` 命令将 `/dev/sdb1` 分区拷贝到根用户家目录下名为 `partitionbackup` 的文件中：\n\n![Images](img/p0380-01.jpg)\n\
  \n`dd` 命令甚至可以创建整个硬盘的镜像文件。语法仍然是 `dd if=*device_file of=*output_file*`。区别在于你只需指定硬盘本身的设备文件，而不是分区。在下一个示例中，整个\
  \ `/dev/sdb` 硬盘被归档到 `drivebackup` 文件中：\n\n![Images](img/p0380-02.jpg)\n\n`dd` 的另一个有用功能是，它可以创建你的硬硬盘主引导记录（MBR）和分区表的备份副本。同样，这是可能的，因为它将数据视为记录。语法为\
  \ `dd if=*device_file of=*output_file* bs=512 count=1`。这告诉 `dd` 仅抓取硬盘的前 512 字节块，这正是你的\
  \ MBR 和分区表所在的位置。如下例所示：\n\n![Images](img/p0380-03.jpg)\n\n让我们在接下来的练习中练习备份。\n\n###\
  \ 练习 10-2：数据备份\n\n在本次练习中，你将练习备份数据。你可以使用随书附的虚拟机进行此练习。运行快照 10-2 以获得配置正确的环境。\n\n* *\
  \ *\n\n![Images](img/viedo.jpg)\n\n**视频** 请观看 练习 10-2 视频演示如何执行此任务。\n\n完成以下操作：\n\n\
  1. 在系统运行的情况下，打开终端会话。\n2. 切换到你的 root 用户账户。\n3. 在 shell 提示符下，输入 `tar –cvf /mnt/newdisk/backup.tar\
  \ /home`。\n4. 输入 `ls /mnt/newdisk`。验证备份文件是否存在。\n5. 在 shell 提示符下输入 `cd /tmp` 切换到\
  \ `/tmp` 目录。\n6. 输入 `tar –xvf /mnt/newdisk/backup.tar` 将 tar 文件提取到当前目录。\n7. 使用 `ls`\
  \ 命令验证 tar 包文件已提取到当前目录。\n8. 输入 `exit` 回到普通用户账户。\n\n你正成为一名 Linux 专家！\n\n### 本章总结\n\
  \n在本章中，我回顾了与管理 Linux 文件系统相关的各种主题。我讨论的第一个主题是如何管理磁盘分区。我指出，在 Linux 系统中使用磁盘之前，必须对磁盘进行分区。实现此操作的一种方法是使用\
  \ `fdisk` 工具创建 MBR 分区。我回顾了使用该命令创建新分区的步骤。我强调，在 `fdisk` 实际写入你创建的新分区之前，你必须将更改提交到磁盘。\n\
  \n较新的 Linux 发行版还支持 GPT 分区。GPT 是统一可扩展固件接口（UEFI）规范的一部分，旨在解决老旧 MBR 分区方案的许多缺点：\n\n![images](img/bull.jpg)\
  \ GPT 中没有主分区、扩展分区或逻辑分区。\n\n![images](img/bull.jpg) GPT 支持巨大的磁盘和分区。\n\n![images](img/bull.jpg)\
  \ 大多数 Linux 发行版每个磁盘支持多 128 个 GPT 分区。\n\n![images](img/bull.jpg) GPT 通过在磁盘的第一和最后一个扇区存储分区表副本提供了分区容错。\n\
  \n![images](img/bull.jpg) GPT 执行循环冗余校验 (CRC) 以验证分区表的完整性。\n\n要管理 GPT 分区，你使用 `gdisk`\
  \ 工具，它可以执行以下任务：\n\n![images](img/bull.jpg) 将 MBR 分区表转换为 GPT 分区表。\n\n![images](img/bull.jpg)\
  \ 验证硬盘。\n\n![images](img/bull.jpg) 创建和删除 GPT 分区。\n\n![images](img/bull.jpg) 显示分区信息。\n\
  \n![images](img/bull.jpg) 修改分区的名称和类型。\n\n![images](img/bull.jpg) 备份和恢复磁盘的分区表。\n\n\
  除了 `gdisk`，你可以在 shell 提示符下使用 `parted` 命令来管理 GPT 分区。你可以用它添加、删除和编辑磁盘上的分区。\n\n然后我讨论了如何用文件系统格式化分区。这是通过\
  \ `mkfs` 工具完成的。我提到使用 `mkfs` 来创建文件系统。该工具实际上是创建各种特定类型文件系统（ext2, ext3, ext4, msdos,\
  \ vfat 等）的实际命令的前端。`mkreiserfs` 工具用于创建 Reiser 文件系统。你也可以在 shell 提示符下使用 `mke2fs` 命令创建\
  \ `ext*` 文件系统。\n\n通过输入 `-t` 选项和文件系统类型来指定你想使用的文件系统。我指出，在创建 `xfs` 文件系统之前，必须向 Linux\
  \ 内核添加 `xfs` 支持。\n\n如果你需要格式化交换分区，可以在 shell 提示符下使用 `mkswap` 命令。必须先使用 `fdisk` 将分区类型切换为\
  \ 82。接下来，你在 shell 提示符下输入 `mkswap *device*`，然后使用 `swapon` 命令启用新的交换分区。你可以使用 `swapoff`\
  \ 命令禁用现有的交换分区。\n\n\n\n\n分区格式化后，你就可以使用 `mount` 命令将其挂载。我指出，Linux 将所有分区都挂载在同一个文件系统内的目录中。它不像\
  \ Windows 那样使用驱动器器。切换到文件系统中挂载分区的目录就会将你切换到该设备。我讨论了使用 `mount` 挂载分区的语法。我指出 `mount`\
  \ 也可以用于显示已挂载的分区。要卸载分区，你需要使用 `umount` 命令。\n\n我讨论了 `/etc/fstab` 文件的作用。我指出，如果挂载的文件系统在\
  \ `/etc/fstab` 文件中没有条目，在系统重启后它将不会保持挂载状态。我回顾了每个 `fstab` 条目中使用的六个字段。我还讨论了如何添加新条目以确保文件系统在系统启动时自动挂载。\n\
  \n随后我们转向了 `LVM` 的讨论，它为创建磁盘分区的传统过程提供了一种替代方案。使用 `LVM`，你可以从系统中的存储设备创建卷组（volume groups）。从卷组中，你为特定的逻辑卷（logical\
  \ volumes）分配空间，这些逻辑卷由逻辑卷管理器管理。你不再是挂载分区，而是文件系统中的挂载点上挂载逻辑卷。\n\n`LVM` 允许你动态地为系统添加空间。要增加容量，你只需要在系统中安装一个新的硬盘，然后分配它的空间即可。你不需要像处理传统分区那样备份数据并将其恢复。若要在你的系统上创建\
  \ LVM 存储，你需要使用以下流程：\n\n1. 使用 `pvcreate` 命令创建物理卷（physical volumes）。\n2. 使用 `vgcreate`\
  \ 命令创建卷组。\n3. 使用 `lvcreate` 命令创建逻辑卷。\n\n然后我转换了话题，讨论了如何维护 Linux 文件系统。首先，我查看了使用 `df`\
  \ 和 `du` 工具检查分区、目录和文件占用的空间。\n\n接着我提到，分区偶尔可能会损坏。如果发生这种情况，你可以使用 `fsck` 工具来检查并修复分区。我指出\
  \ `fsck` 实际上是各种针对特定文件系统的修复工具的前端。我讨论了如何使用 `e2fsck` 工具恢复受损的超级块（superblock）。\n\n然后我查看了以下文件系统维护工具：\n\
  \n- `tune2fs`\n- `reiserfst`\n- `dumpe2fs`\n- `debugfs`\n- `xfs_admin`\n- `xfs_info`\n\
  - `xfs_metadump`\n\n我还查看了如何使用 `lsof` 命令检查文件系统中的打开文件。此外，我提到你可以使用 `fuser` 命令显示使用指定文件或文件系统的进程\
  \ PID。\n\n随后我回顾了 `mount` 如何也用于在文件系统中挂载可移动介质。正如同分区挂载在目录中一样，可移动设备也挂载在文件系统中的目录中。你通过挂载这些设备的目录（称为\
  \ `挂载点`）访问这些设备。我回顾了挂载软磁盘、光盘、USB 设备和火线（FireWire）设备的步骤。我指出，如果你不知道可移动设备使用的是哪种文件系统，可以使用\
  \ `-t auto` 选项让 `mount` 工具自动确定要使用的正确参数。\n\n我通过讨论如何备份 Linux 文件系统结束了本章。我强调了按定期进行备份的重要性。然后我讨论了为系统创建备份计划所需的要素。第一步是选择备份介质。我讨论了磁带驱动器、可刻光盘驱动器和移动硬盘的优缺点。\n\
  \n下一步是选择备份策略。我讨论了全量备份、增量备份和差异备份的工作原理，以及如何结合它们来设计你自己的备份策略。我还强调了轮换备份介质以及验证备份的重要性。\n\
  \n下一步是确定备份计划，然后决定备份哪些内容。我回顾了文件系统中常用的备份目录，包括 `/etc`、`/home`、`/opt`、`/root`、`/var`\
  \ 和 `/srv`。\n\n我通过回顾一些可以用于备份系统的 Linux 备份工具结束了本章。我首先回顾了使用 `tar` 的语法，涵盖了硬盘和磁带驱动器。然后我回顾了使用\
  \ `cpio` 创建文件存档的语法。我讨论了如何使用 `gzip` 和 `bzip2` 压缩/解压 `tar` 和 `cpio` 存档。我还讨论了如何使用 `dd`\
  \ 复制文件，甚至为整个磁盘分区创建镜像文件。\n\n### 加速复习\n\n- 在 Linux 文件系统中挂载磁盘之前，你必须先对其进行分区和格式化。\n-\
  \ `fdisk` 工具用于在硬盘上创建 MBR 分区。\n- 在分区磁盘时，你必须设置分区类型。\n- 分区的更改仅保存在内存中，直到你将其提交到磁盘。\n\
  - 较新的 Linux 发行版支持 GPT 分区，其设计旨在解决许多旧 MBR 类型分区的缺点。\n- 要管理 GPT 分区，你使用 `gdisk` 工具或 `parted`\
  \ 工具。\n- 分区完成后后，你需要用 `mkfs` 或 `mkreiserfs 对其进行格式化。\n- 格式化磁盘后，你可以使用 `mount` 命令将其挂载。\n\
  - `/etc/mtab` 文件可以查看已挂的文件系统。\n- 你也可以使用 `/proc/mounts` 查看已挂的文件系统。\n- 你可以使用 `umount`\
  \ 命令卸载已挂的文件系统。\n- 在 Linux 关机之前，所有文件系统都必须卸载。\n- 如果挂载的文件系统在 `/etc/fstab` 中没有条目，重启后不会重新挂载。\n\
  - `/etc/fstab` 文件指定了特定设备的挂载点和其他选项。\n- `LVM` 为创建磁盘分区的传统过程提供了一种替代方案。\n- 使用 `LVM`，你可以从系统中的存储设备创建卷组。\n\
  - 从卷组中，你为特定的逻辑卷分配空间。\n- 你不再是挂载分区，而是文件系统中的挂载点上挂载逻辑卷。\n- `LVM` 允许你动态地为系统添加空间。\n- 若要在你的系统上创建\
  \ LVM 存储，你需要使用以下流程：\n  - 使用 `pvcreate` 命令创建物理卷。\n  - 使用 `vgcreate` 命令创建卷组。\n  -\
  \ 使用 `lvcreate` 命令创建逻辑卷。\n- 你可以使用 `df` 和 `du` 工具监控磁盘空间和 inode 使用情况。\n- `fsck` 工具用于检查和修复文件系统。\n\
  - `e2fsck` 工具可恢复 ext2/3/4 文件系统中损坏的超级块。\n- `tune2fs` 工具用于调整 ext2/3/4 文件系统上的各种文件系统参数。\n\
  - `reiserfst` 工具是 Reiser 文件系统中对应 `tune2fs` 的工具。\n- `dumpe2fs` 工具可以显示大量 ext2/3/4\
  \ 系统的有用信息。\n- `debugfs` 工具是一个交互式文件系统调试器。\n- `xfs_admin` 工具是 xfs 中对应 `tune2fs` 的工具。\n\
  - `xfs_info` 工具显示关于 xfs 文件系统的有用信息。\n- `xfs_metadump` 工具将 xfs 文件系统的元数据（如文件名和大小）转储到文件中。\n\
  - 你可以在 shell 提示符下使用 `lsof` 命令显示打开文件列表。\n\n\n\n\n\n![images](img/bull.jpg) `fuser`\
  \ 命令显示使用指定文件或文件系统的进程 PID。\n\n![images](img/bull.jpg) 可移动设备在访问之前，必须挂载到 Linux 文件系统中。\n\
  \n![images](img/bull.jpg) 可以使用 `mount` 命令挂载软盘（floppy diskettes）。\n\n![images](img/bull.jpg)\
  \ 软盘通常使用 `vfat` 文件系统类型。\n\n![images](img/bull.jpg) 你的中的第一块软盘是 `/dev/fd0`。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `/etc/fstab` 来自动化挂载软盘的过程。\n\n![images](img/bull.jpg) 在从系统中移除软盘之前，必须使用 `umount`\
  \ 卸载它。\n\n![images](img/bull.jpg) 光盘在访问之前，必须挂载到文件系统中。\n\n![images](img/bull.jpg)\
  \ 光盘使用 `iso9660` 文件系统类型进行挂载。\n\n![images](img/bull.jpg) 光盘通常挂载在 `/media/cdrom`、`/media/cdrecorder`、`/media/dvd`\
  \ 或 `/mnt/cdrom`。\n\n![images](img/bull.jpg) Linux 将 USB 和 FireWire 设备视为 SCSI 设备。\n\
  \n![images](img/bull.jpg) USB 和 FireWire 设备使用 `mount` 进行挂载。\n\n![images](img/bull.jpg)\
  \ 如果你不知道 USB 或 FireWire 设备上使用的是什么类型的文件系统，可以使用 `-t auto` 让 `mount` 尝试确定正确的文件系统类型。\n\
  \n![images](img/bull.jpg) 定期备份你的系统是非常关重要的。\n\n![images](img/bull.jpg) 磁带驱动通常用于备份数据。\n\
  \n![images](img/bull.jpg) 磁带驱动存储大量数据且价格相对便宜。\n\n![images](img/bull.jpg) 磁带驱动也很慢，并且容易损坏。\n\
  \n![images](img/bull.jpg) 可重写 CD 和 DVD 可用于备份，但它们存储的信息并不足够。\n\n![images](img/bull.jpg)\
  \ 可移动硬盘正成为运行备份任务的流行解决方案。\n\n![images](img/bull.jpg) 可移动硬盘速度非常快且存储大量数据；然而，它们也受到与被备份硬盘相同的损坏问题影响。\n\
  \n![images](img/bull.jpg) 全量备份（Full backups）备份所有内容，并将文件标记为已备份。\n\n![images](img/bull.jpg)\
  \ 增量备份（Incremental backups）备份自上一次全量或增量备份以来所有修改过的内容，并将文件标记为已备份。\n\n![images](img/bull.jpg)\
  \ 差异备份（Differential backups）备份自上一次全量备份以来的所有备份内容。但是，它们不会将文件标记为已备份。\n\n![images](img/bull.jpg)\
  \ 你可以将全量备份与增量或差异备份混合使用，但你不能将增量和差异备份混合使用。\n\n![images](img/bull.jpg) 你应该保持三到四周的备份轮换。\n\
  \n![images](img/bull.jpg) 你应该验证你的备份。\n\n![images](img/bull.jpg) 你应该为你的备份设置计划。\n\n\
  ![images](img/bull.jpg) 你应该仔细确定要备份哪些目录。\n\n![images](img/bull.jpg) 你应该考虑备份 `/etc`、`/home`、`/opt`、`/root`、`/var`\
  \ 和 `/srv`。\n\n![images](img/bull.jpg) 你可以使用 `tar` 创建备份文件。\n\n![images](img/bull.jpg)\
  \ `tar` 工具适用于大多数备份介质。\n\n![images](img/bull.jpg) 你也可以使用 `cpio` 归档数据。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `dd` 命令转换并复制文件。\n\n![images](img/bull.jpg) `dd` 工具可以将整个分区甚至整个硬盘复制到单个文件中。\n\
  \n## Questions\n\n**[1].** 你需要使用 `fdisk` 为你系统中的第四块 SATA 硬盘创建一个 MBR 分区。执行此操作的正确命令是？\n\
