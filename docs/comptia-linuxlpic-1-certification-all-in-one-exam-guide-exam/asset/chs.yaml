  \ GRUB 术语。首先，GRUB 引用系统中的磁盘和分区的方式可能让你感到陌生。GRUB 不再使用 `/dev` 条目，而是使用以下语法：\n\n`hddrive_number,partition_number`\n\
  \n例如，第一块硬盘上的第一个分区（`/dev/sda1`）被 GRUB 引用 `hd0,0`。无论第一块磁盘是 IDE、SATA 还是 SCSI 驱动器——GRUB\
