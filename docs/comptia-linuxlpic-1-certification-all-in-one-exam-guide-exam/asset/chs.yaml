  **1.** 如果必要，启动你的 Linux 系统并以标准用户登录。\n\n**2.** 在 shell 提示符处使用 `ls` 命令验证主目录中是否存在 `test.txt`\
  \ 文件。\n\n该文件包含以下文本：\n\n![Images](img/p0525-02.jpg)\n\n\n\n\n3. 使用 `sed` 将单词“oportere”替换为单词“democritum”，并通过完成以下操作将输出发送到名为\
  \ `testsed.txt` 的新文件中：\n\na. 在 shell 提示符处输入 `cat ~/test.txt | sed s/oportere/democritum/\
  \ 1>testsed.txt`。\n\nb. 使用 `cat` 命令验证 `testsed.txt` 文件中的单词是否已替换。\n\n4. 使用 `awk`\
  \ 打印 `test.txt` 文件中包含字符“us”的每行的第二个单词。在 shell 提示符处输入 `cat ~/test.txt | awk `/us/\
  \ {print $2}’`。\n\n5. 哪一行匹配了条件？随后在屏幕上打印了哪一个单词？\n\n## 使用命令替换和 Shell 函数\n\n让我们通过讨论\
  \ bash shell 环境的以下特性来结束本章：\n\n![images](img/bull.jpg) 使用命令替换\n\n![images](img/bull.jpg)\
  \ 使用 shell 函数\n\n### 使用命令替换\n\nbash shell 允许你使用`command substitution`（命令替换），这意味着你可以运行一个命令并将其输出粘贴回命令行，作为另一个命令的参数。本质上，命令替换允许你同时执行多个任务。\n\
  \n命令替换的工作原理是首先创建一个运行第一个命令的子进程。该命令的标准输出（stdout）随后被传回 bash shell。shell 将第一个命令的输出解析为由空格分隔的单词。在第一个命令的管道关闭后（表示第一个命令已执行完毕），shell\
  \ 会启动另一个子进程来运行第二个命令，并使用第一个命令的标准输出作为其参数。\n\n例如，假设你想使用 `tail` 命令查看 `/etc` 中所有包含文本“192.168”的文件的最后几行。你可以使用以下命令替换：\n\
  \n```\ntail $(fgrep –l 192.168 /etc/*)\n```\n\n首先，运行 `fgrep –l` 命令在 `/etc` 目录下的所有文件中搜索文本字符串“192.168”。在\
  \ `fgrep` 中使用 `--l` 选项会导致命令只返回文件名列表，而不是实际的匹配文本。然后，将此文件列表传给 `tail` 命令，该命令随后会显示其接收到的每个文件的最后几行。\n\
  \n你可以在 bash shell 中使用 `xargs` 命令来完成类似的任务。例如，如果第一个命令向第二个命令传回了太多结果，命令替换可能会失败。在这种情况下，你会得到一个“参数过多”（too\
  \ many arguments）的错误，如下：\n\n```\nArgument list too long\n```\n\n由于 Linux 内核的限制，bash\
  \ 命令行行的最大长度为 128KB。如果是这种情况，你可以使用 `xargs` 代替命令替换。`xargs` 命令将长命令行拆分为 128KB 的数据块，并将每个块作为参数传递给\
  \ `xargs` 命令行中列出的命令。例如，假设你想删除主目录下的所有备份文件（通常通常以 `~` 字符结尾）。你可以使用以下命令：\n\n```\nfind\
  \ ~ -name \"*~\" | xargs rm\n```\n\n`find` 命令首先生成匹配的文件列表，然后将其传给 `xargs` 命令的输入，`xargs`\
  \ 每次处理 128KB 的文本流进行处理，并将其发送到 `rm` 命令的标准输入（stdin）。\n\n让我们通过查看使用 shell 函数来结束本章。\n\n\
  ### 使用 Shell 函数\n\nbash shell 允许你定义函数，可以在 shell 提示符或脚本内部调用这些函数。当你定义一个函数时，你本质上定义了一个新的“命令”，你可以像使用标准内部或外部命令一样调用并使用它。函数包含你想要运行的命令列表，就像我们之前讨论的脚本一样。然而，函数并不保存在文件中；它只存在于内存中。这意味着如果你关闭当前的\
  \ shell 会话，它就会消失。当然，你可以将函数定义添加到你的一个 bash 配置文件中以使其持久化。函数的语法在此所示：\n\n![Images](img/p0527-01.jpg)\n\
  \n让我们在 shell 提示符处看一个简单的函数示例。这个函数没做什么；它只是显示你作为函数参数所指定的目录内容：\n\n![Images](img/p0527-02.jpg)\n\
  \n注意，当我调用 `show` 函数时，我在命令行上指定的第一个参数被作为变量 `$1` 传递给 `ls –l` 命令。如果我在调用函数时指定了多个参数，它们将分别传递给相应编号的变量（`$1`、`$2`、`$3$\
  \ 等）。\n\n函数也可以在 shell 脚本中定义。在脚本内部处理重复出现的任务时，函数是极节省时间的利器。与其多次重写相同的代码，你只需要在脚本开头定义一次函数，然后在脚本其余任何需要的地方通过名称调用它。\n\
  \n例如，你可以在脚本开头声明一个函数来检查文件是否存在。示例所示：\n\n![Images](img/p0527-03.jpg)\n\n然后，你可以在脚本其余部分的任何需要的地方调用\
  \ `isitthere` 函数。例如，你可以使用 `read` 语句提示用户输入文件名，并将输入写入到名为 `MYFILE` 的变量中。然后你可以使用此语句将该变量传递给函数：\n\
  \n```\nisitthere $MYFILE\n```\n\n该函数将会读取 `MYFILE` 的值，并将其传递给 `$1`，然后使用其 `if/then/else`\
  \ 语句来检查文件是否存在。\n\n如果你真的深入到脚本编写，你可能会发现自己在许多不同的脚本中反复重用许多相同的函数。与其在每个脚本文件中反复重定义它们，你可以在一个单独的独立文件中定义一次常用函数。然后，该函数可以从该文件中加载到你当前正在编写的任何脚本中。当你这样做时，脚本将读取该文件、加载函数并执行它。本质上，你正在创建可以重复使用的脚本库，从而节省了大量时间。\n\
  \n例如，我们可以取之前为 `isitthere` 函数定义的命令，并把它们放在一个名为 `isitthere.sh` 的单独脚本文件中：\n\n![Images](img/p0528-02.jpg)\n\
  \n现在我们可以使用 `source` 命令从不同的脚本从 `isitthere.sh` 文件中调用并使用 `isitthere()` 函数。语法为 `source\
  \ *filename arguments`。与之前一样，我们可以在脚本中使用 `read` 语句提示用户输入文件名，并将输入写入名为 `MYFILE` 的变量中。然后我们可以从\
  \ `isitthere.sh` 文件加载 `isitthere()` 函数并将变量的值传递给函数。可以通过脚本中的语句实现：\n\n```\nsource isitthere.sh\
  \ $MYFILE\n```\n\n当然，这个示例假设 isitthere.sh 文件位于 PATH 环境变量包含的目录下。如果不是，则必须在 `source`\
  \ 语句中指定文件的完整路径。\n\n你现在是一个丰富的 bash shell 用户了！让我们回顾一下在本章中学习的内容。\n\n* * *\n\n![Images](img/examtip.jpg)\n\
  \n**考试提示**：你还可以在脚本中包含环境变量。例如，你可以在脚本中包含 `MAILTO=root` 行，以便将通知事件或其他条件事件发送给 root 超级用户。你甚至可以通过添加\
  \ `PATH=` 后加上路径列表来定义自定义的 `PATH` 环境变量。\n\n### 章节回顾\n\n在本章中，你学习了如何在 Linux 系统上创建基本的\
  \ shell 脚本。脚本是由 bash shell 解释并运行的文本文件。一个脚本包含一系列命令，可以为你自动化任务并处理信息。一个脚本由以下部分组成：\n\n\
  ![images](img/bull.jpg) #!/bin/bash\n\n![images](img/bull.jpg) #注释\n\n![images](img/bull.jpg)\
  \ shell 命令\n\n![images](img/bull.jpg) exit 0\n\n\n\n\nShell 脚本可以使用任何文本编辑器创建和编辑。它们可以通过以下两种方式之一执行：\n\
  \n![images](img/bull.jpg) 输入 `/bin/bash script_filename`\n\n![images](img/bull.jpg)\
  \ 使用 `chmod` 实用为脚本文件添加执行权限，然后在 shell 提示符处输入脚本文件名。\n\n此外，你还可以将脚本文件的路径添加到用户的 `PATH`\
  \ 环境变量中，这样他们在使用该文件时就不需要记住文件的完整路径。或者，你也可以将脚本文件移动到已经存在于 `PATH` 环境变量中的目录，例如 `~/bin`。\n\
  \n除了在脚本中运行命令外，你还可以在脚本中使用 `read variable_name` 命令从用户处读取输入并将其赋值给变量。如果你打算将文本读取到变量中，则不需要声明脚本变量。然而，如果你想将数字读取到一个实际上会被视为数字的变量中（以便执行算术运算，例如），则你需要先在脚本中使用\
  \ `declare -i variable_name` 命令对它们进行声明。\n\n你还可以在脚本中使用控制结构。控制结构允许你配置脚本，使其根据你提供的条件进行分支或循环。要创建一个向两个方向分支的脚本，你可以在脚本中使用\
  \ `if/then/else` 结构。如果在结构中指定的条件为真，则执行一组命令（在 `then` 之下）。如果条件为假，则执行结构中 `else` 部分的命令。在脚本中使用\
  \ `if/then/else` 结构的语法如下：\n\n![Images](img/p0529-01.jpg)\n\n你可以在 `if/then/else`\
  \ 结构中使用 `test` 命令来测试条件。你可以在 `test` 中使用以下选项：\n\n![images](img/bull.jpg) `-d` 检查指定的文件是否存在以及是否为目录。\n\
  \n![images](img/bull.jpg) `-e` 检查指定的文件是否存在。它不在乎该是文件还是目录。\n\n![images](img/bull.jpg)\
  \ `-f` 检查指定的文件是否存在以及是否为普通文件。\n\n![images](img/bull.jpg) `-G` 检查指定的文件是否存在并属于指定的组。\n\
  \n![images](img/bull.jpg) `-h or –L` 检查指定的文件是否存在以及是否为符号链接。\n\n![images](img/bull.jpg)\
  \ `-O` 检查指定的文件是否存在以及是否由指定的用户 ID 所有。\n\n![images](img/bull.jpg) `-r` 检查指定的文件是否存在以及是否授予了读取权限。\n\
  \n![images](img/bull.jpg) `-w` 检查指定的文件是否存在以及是否授予了写入权限。\n\n![images](img/bull.jpg)\
  \ `-x` 检查指定的文件是否存在以及是否授予了执行权限。\n\n如果你在脚本中需要两个两个分支，可以使用 `case` 结构。`case` 结构是一种高级的\
  \ `if/then/else` 语句。通过 `case` 结构，你可以评估多个条件并根据哪个条件为真来执行命令。`case` 结构是替换脚本中多个 `if/then/else`\
  \ 语句的一种方便方法。使用 `case` 结构的语法如下：\n\n![Images](img/p0530-01.jpg)\n\n你还可以在 shell 脚本中使用循环控制结构。循环结构有三种：`while`\
  \ 循环、`until` 循环和 `for` 循环。\n\n`while` 循环结构如下：\n\n![Images](img/p0530-02.jpg)\n\n\
  `while` 循环将不断地处理，直到条件求值为为假。\n\n你还可以在脚本中使用 `until` 循环。`until` 循环只要条件为假就会一直运行。一旦条件为真，它就会停止。`until`\
  \ 循环的结构如下：\n\n![Images](img/p0530-03.jpg)\n\n你还可以使用 `for` 循环，它可以循环指定的次数。在 `for`\
  \ 循环内部，使用 `seq` 命令来创建数字序列以确定循环的次数是非常常见的。使用 `seq` 创建数字序列有三种选项：\n\n![images](img/bull.jpg)\
  \ 如果你指定单个值，序列从 1 开始，每次递增 1，并在指定值结束。\n\n![images](img/bull.jpg) 如果你指定两个值，序列从第一个值开始，每次递增\
  \ 1，并在第二个值结束。\n\n![images](img/bull.jpg) 如果你指定三个值，序列从第一个值开始，按第二个值递增，并在第三个值结束。\n\n\
  随后我们讨论了如何处理文本流以便在脚本或管道内处理和修改文本。我们查看了以下实用程序：\n\n![images](img/bull.jpg) `cut` `cut`\
  \ 命令用于从文件中打印指定的列或字段到标准输出。默认情况下，使用制表符作为分隔符。\n\n![images](img/bull.jpg) `expand and\
  \ unexpand` `expand` 命令用于处理文本流并删除所有制表符实例，将其替换为指定数量的空格（默认为八个）。`unexpand` 命令的工作方式与\
  \ `expand` 命令相反。它将文本流中的空格转换为制表符。\n\n![images](img/bull.jpg) `fmt` 你可以使用 `fmt` 命令重新格式化文本文件。\n\
  \n![images](img/bull.jpg) `join and paste` `join` 命令从两个指定的输入文件中打印具有相同连接字段的行。第一个字段是默认连接字段，由空格分隔。`paste`\
  \ 命令的工作方式与 `join` 命令非常相似。它将一个或多个文件的对应行粘贴在一起成列。默认情况下，使用制表符分隔列。\n\n![images](img/bull.jpg)\
  \ `nl` `nl` 命令确定文件中的行数。当你运行该命令时，输出会在文件每行的开头处添加一个行号。\n\n![images](img/bull.jpg) `od`\
  \ `od`（八进制转储）命令用于转储文件，包括二进制文件。该实用程序可以用几种不同的格式转储文件，包括八进制、十进制、浮点数、十六进制和字符格式。\n\n![images](img/bull.jpg)\
  \ `pr` `pr` 命令用于为打印格式化文本文件。它通过分页、页眉和列对文件进行格式化。页眉包含日期、时间和文件名和页码。\n\n![images](img/bull.jpg)\
  \ `sed and awk` `sed` 工具是一个流编辑器。它可以用于编辑来自另一个命令标准输出的文本。你可以使用命令行选项进行搜索和替换，或删除文本并显示在屏幕上或写入文件。`awk`\
  \ 命令也可以用于处理文本流。`awk` 实用程序将到达其标准输入的每行视为一条记录。行中的每个单词被视为一个字段。你可以使用 `awk` 来引用特定记录（行）中的特定字段（单词）。\n\
  \n![images](img/bull.jpg) `sort` `sort` 命令按字母顺序对文本文件的行排序。\n\n![images](img/bull.jpg)\
  \ `split` `split` 命令将输入文件分割为一系列文件（不更改原始输入文件）。\n\n![images](img/bull.jpg) `tr` `tr`\
  \ 命令用于翻译或删除字符。\n\n![images](img/bull.jpg) `uniq` `uniq` 命令报告或省略重复的行。\n\n![images](img/bull.jpg)\
  \ `wc` `wc` 命令打印文件中的行数、单词数和字节数。\n\n我们通过讨论命令替换和函数结束了本章。我提到 bash shell 允许你运行一个命令并将将其输出粘贴回命令行，作为另一个命令的参数。这被称为命令替换。\n\
  \n\n\n\n\n我们还查看了函数。`bash` shell 允许你定义可以在 shell 提示符中或脚本内部使用的函数。当你定义一个函数时，你实际上定义了一个新命令，你可以像使用标准内部或外部命令一样调用并使用它。该函数包含一组你想要运行的命令列表。你可以在函数中使用脚本结构（例如\
  \ `if/then/else`）。\n\n## 加速复习\n\n![images](img/bull.jpg) Shell 脚本是包含各种命令的文本文件，这些命令用于自动化任务和处理信息。\n\
  \n![images](img/bull.jpg) 所有 shell 脚本都以 `#!/bin/bash` 开头，指定使用 `bash` shell 来运行脚本。\n\
