  ![](img/0071841717.jpg)\n\n* * *\n\n## 关于作者\n\n**Robb H. Tracy** (CNA, CNE, CNI,\
  \ CompTIA A+, CompTIA Network+, CompTIA Security+, CompTIA Linux+) 自 1996 年以来一直是专业的技术讲师和课程开发人员。他曾为主要的硬件和软件供应商设计并实施了技术培训产品和课程，包括\
  \ Novell、美光科技（Micron Technology）、TestOut、Messaging Architects 和摩托罗拉。Robb 曾担任 CompTIA\
  \ Network+ 顾问委员会，协助定义构成 CompTIA Network+ 认证的目标。他是 Nebo Technical Institute, Inc.\
  \ 的创始人，这是一家领先的信息技术培训和咨询提供商。Robb 是《*Novell Certified Linux Engineer (Novell CLE)\
  \ Study Guide》(Novell Press, 2005)、《*Novell Certified Linux Engineer 9 (CLE 9) Study\
  \ Guide》(Novell Press, 2006)、《*Linux+ Certification Study Guide》(McGraw-Hill Education,\
  \ 2008)、《*LPIC-1/CompTIA Linux+ Certification Exam Guide》(McGraw-Hill Education,\
  \ 2011)、《*CompTIA Network+ Certification Practice Exams》(McGraw-Hill Education,\
  \ 2012) 以及《*LPI Linux Essentials Certification All-in-One Exam Guide》(McGraw-Hill\
  \ Education, 2013) 的作者。\n\n### 关于技术编辑\n\n**Brian Barber** (CompTIA Linux+, MCSE,\
  \ MCSA, MCP+I, MCNE, CNE, CNA-GW) 是加拿大存款保险公司（CDIC）的监控与报告系统经理。他最初在家庭中使用 Red Hat 5.1\
