  ![images](img/bull.jpg) 用户可以通过在 shell 提示符输入 `crontab -e` 创建 crontab 文件。\n\n![images](img/bull.jpg)\
  \ 创建 crontab 文件后，你可以使用 `crontab -l` 命令查看 crontab 内容。\n\n![images](img/bull.jpg)\
  \ 你可以使用 `crontab -r` 命令删除你的 crontab 文件。\n\n![images](img/bull.jpg) 你可以使用 `anac`\
  \ 确保因系统关机而错过的作业在系统恢复后运行。\n\n## 问题\n\n**1** 下列哪项最能描述多任务操作系统？\n\nA. 在多个 CPU 上并发运行多个任务的操作系统\n\
  B. 在多个 CPU 上并发运行单个任务的操作系统\nC. 在单个 CPU 上并发运行多个任务的操作系统\nD. 在加载的进程之间不断切换 CPU 时间的操作系统\n\
  \n**2** 你刚刚输入了 `vi`。创建了什么类型的进程？\n\nA. User\nB. System\nC. Daemon\nD. System V\n\n\
  **3** 当前 shell 会话 PID 为 3456。你运行 `su` 命令切换到 root 用户。`su` 进程的 PID 为 3457。然后你以 root\
  \ 身份从 shell 提示符运行 `vi`。`vi` 进程的 PID 为 3458。`vi` 进程的 PPID 是什么？\n\nA. 3456\nB. 3457\n\
  \n\n\n\n**C.** 3458\n\n**D.** 3459\n\n#### **4.** 哪个进程可能是 Linux 系统上运行的所有进程的祖父？（选择两项。）\n\
  \nA. `bash`\nB. `init`\nC. `sh`\nD. `ps`\nE. `systemd`\n\n#### **5.** 你正在运行使用 System\
  \ V init 脚本的 Fedora Linux 系统。这些脚本存储在文件系统的哪个位置？\n\nA. `/etc/init.d`\nB. `/etc/rc.d/init.d`\n\
  C. `/etc/sysv/init.d`\nD. `/etc/init.d/rc.d`\n\n#### **6.** 你想使用 `ps` 显示与当前终端会话相关的进程的扩展信息。哪个命令可以实现这一点？\n\
  \nA. `ps`\nB. `ps –e`\nC. `ps –f`\nD. `ps –ef`\n\n#### **7.** 什么是僵尸进程（zombied process）？\n\
  \nA. 已经完成执行但其父进程尚未释放子进程 PID 的进程\nB. 在等待用户输入时停止执行的进程\nC. 正在被另一个进程跟踪的进程\nD. 进入睡眠状态且无法被中断的进程\n\
  \n#### **8.** 哪个 `ps` 选项可以显示所有正在运行的进程？\n\nA. `–c`\nB. `–e`\nC. `–f`\nD. `–l`\n\n\
  #### **9.** `myapp` 进程的 nice 值为 1。以下哪些 nice 值会提高 `myapp` 进程的优先级？（选择两项。）\n\nA. `–15`\n\
  B. 5\nC. 19\nD. 0\nE. 2\n\n#### **10.** 下列哪个 shell 命令将以 nice 值 –5 加载 `myapp` 程序？\n\
  \nA. `myapp –n –5`\nB. `nice –5 myapp`\nC. `renice –5 myapp`\nD. `nice –n –5 myapp`\n\
  \n#### **11.** `myapp` 进程（PID 2345）当前运行在你的系统上。下列哪个命令可以在不卸载进程的情况下将它的 nice 值重置为 –5？\n\
  \nA. `myapp –n –5 –p 2345`\nB. `renice –n –5 2345`\nC. `renice –5 2345`\nD. `nice\
  \ –n –5 2345`\n\n#### **12.** 你想从 shell 提示符加载 `myapp` 程序并使其后台运行它。哪个命令可以实现这一点？\n\n\
  A. `myapp –b`\nB. `myapp &`\nC. `myapp –bg`\nD. `load myapp into background`\n\n\
  #### **13.** 哪个 kill 信号向运行中的进程发送 CTRL-C 序列？\n\nA. `SIGHUP`\nB. `SIGINT`\nC. `SIGKILL`\n\
  D. `SIGTERM`\n\n#### **14.** 你需要杀死一个挂起的进程。你知道它的进程名称，但不知道它的 PID。你可以使用哪些工具？（选择两项。）\n\
  \nA. `killall`\nB. `kill`\nC. `hangup`\nD. `SIGKILL`\nE. `pkill`\n\n#### **15.**\
  \ 你想运行 `rsync` 命令将你的主目录与网络上的另一服务器同步。你知道此命令将需要几个小时才能完成，并且你不想在此期间保持登录状态。你可以使用哪些命令在注销后让\
  \ `rsync` 继续运行？（选择两项。）\n\nA. `SIGHUP`\nB. `nohup`\nC. `stayalive`\nD. `kill –NOHUP`\n\
  E. `screen`\n\n#### **16.** 现在是下午 1:00。你想安排 `myapp` 程序在明天中午（12:00）自动运行。你可以使用以下哪些\
  \ `at` 命令？（选择两项。）\n\nA. `at 12 pm tomorrow`\nB. `at tomorrow –1 hour`\nC. `at now\
  \ +1 day`\nD. `at today +23 hours`\nE. `at now +23 hours`\n\n#### **17.** 下列哪个 crontab\
  \ 行会导致 `/usr/bin/myappcleanup` 进程在每月 1 号凌晨 4:15 运行？\n\nA. `15 4 1 * * /usr/bin/myappcleanup`\n\
  B. `15 4 * 1 * /usr/bin/myappcleanup`\nC. `1 4 15 * * /usr/bin/myappcleanup`\nD.\
  \ `4 1 * * 15 /usr/bin/myappcleanup`\n\n### **答案**\n\n**1. D.** 多任务操作系统在已加载的进程之间不断切换\
  \ CPU 时间，营造出 CPU 实际上正在并发执行进程的印象。\n\n**2. A.** 因为命令是从 shell 提示符输入的，所以创建了一个用户进程。\n\
  \n**3. A.** 因为命令是从 shell 提示符输入的，所以其父进程是 `bash` 进程，其 PID 为 3456。\n\n**4. B, E.**\
  \ 在某些发行版中，`init` 进程是系统中所有其他 Linux 进程的祖父。其他发行版则使用 `systemd` 进程。所有其他进程都可以根据发行版将其谱追溯到\
  \ `init` 或 `systemd`。\n\n**5. B.** 使用 System V init 脚本的发行版的 init 脚本存储在 `/etc/rc.d/init.d`。\n\
  \n**6. C.** `ps –f` 命令将显示与当前 shell 会话相关的进程的扩展信息。\n\n**7. A.** 僵尸进程是指进程已经完成执行，但父进程未收到通知，因此没有释放子进程的\
  \ PID。\n\n**8. B.** `ps –e` 命令可以显示系统上所有运行进程的列表。\n\n**9. A, D.** nice 值越低，进程的优先级越高。因此，0\
  \ 和 –15 的 nice 值会提高 `myapp` 进程的优先级。\n\n**10. D.** `nice –n –5 myapp` 命令将以 nice 值\
  \ –5 加载 `myapp`。\n\n**11. C.** `renice –5 2345` 命令将在 `myapp` 运行时重置其 nice 值。\n\n\
  **12. B.** `myapp &` 命令将导致 `myapp` 在后台运行。\n\n**13. B.** `SIGINT` kill 信号向指定的进程发送\
  \ CTRL-C 键序列。\n\n**14. A, E.** `killall` 工具使用进程名称，`pkill` 可用于搜索并杀死进程。\n\n**15. B,\
  \ E.** `nohup` 命令可加载程序，使其忽略用户注销时的 `SIGHUP` 信号。或者，你可以使用 `screen` 创建窗口并将其分离。这同样允许进程保持运行。\n\
  \n**16. A, E.** 你可以输入 `at 12 pm tomorrow` 或 `at now +23 hours` 让 `atd` 守护进程在第二天\
  \ 12:00 运行指定的命令。\n\n**17. A.** `15 4 1 * * /usr/bin/myappcleanup` crontab 行会导致 `myappcleanup`\
  \ 进程在每月 1 号凌晨 4:15 运行，无论是星期几。\n\n# 第 14 章\n## 编写 shell 脚本\n\n在本章中，你将学习：\n\n*   处理\
  \ shell 脚本工作\n*   创建简单的 shell 脚本\n*   在脚本中使用控制结构\n*   处理文本流\n*   使用命令替换和 shell 函数\n\
  \nLinux 的酷之处之一是，它允许你创建自己的强大的 *shell 脚本*，并直接从 shell 提示符运行它们。shell 脚本是一个文本文件，包含了一系列由\
  \ shell 执行的命令。\n\n### **处理 shell 脚本工作**\n\n要理解 shell 脚本如何工作，你需要了解以下内容：\n\n\n\n\n\
  \n![images](img/bull.jpg) Shell 脚本的组件\n\n![images](img/bull.jpg) Shell 脚本是如何执行的\n\
  \n让我们开始讨论 shell 脚本的组件。\n\n## Shell 脚本的组件\n\n如所述，shell 脚本是一个简单的文本文件，包含了一系列从上到下执行的命令。这里有一个名为\
  \ `runme` 的示例 shell 脚本：\n\n![Images](img/p0504-01.jpg)\n\n注意此脚本包含几个部分：\n\n- `#!/bin/bash`:\
  \ 任何 shell 脚本的第一行都应该指定脚本在哪个 shell 环境下运行。在这种情况下，指定了 `/bin/bash` shell。当运行脚本时，将使用此处指定的\
  \ shell 创建一个子 shell，并在子 shell 中处理脚本内容。\n- `#A simple script that`: ` .… 脚本的这部分是注释，用于描述脚本的功能。请注意，脚本的这部分以\
  \ `#` 字符开头，表示其其后的文本是注释。由于是注释，因此脚本的这部分在运行时不会显示在屏幕上。注释是可选的。即使没有注释，脚本也可以正常运行。但是，在 shell\
  \ 声明之后，在脚本开头包含一条注释被认为是一个习惯，用于描述脚本的功能，以及可选的说明编写者。\n- `echo, date`: 脚本中的这些元素是通常在 shell\
  \ 提示符使用的简单命令。`echo` 命令用于在屏幕上显示文本。`date` 命令用于在屏幕上显示当前的日期和时间。\n- `exit 0`: 脚本的这部分是结束。它告诉\
  \ shell 在执行完脚本中的命令后做什么。在这种情况下，它告诉 shell 退出脚本。\n\n当我们运行此脚本时，图 14-1 所示的输出将显示在屏幕上。\n\
  \n![Images](img/f0504-01.jpg)\n\n**图 14-1** 运行简单的 shell 脚本\n\n注意此脚本首先显示了 `echo`\
  \ 命令指定的文本。然后处理下一个命令，该命令引导 shell 运行 `date` 命令。当脚本完成后，shell 退出脚本并将我们返回命令提示符。\n\n##\
  \ Shell 脚本是如何执行的\n\n注意图 14-1，为了运行脚本，我必须调用 shell (`/bin/bash`) 然后告诉它要执行哪个脚本 (`./runme`)。这是运行脚本的一种方法。然而，运行\
  \ shell 脚本还有第二种方法（在我看来是更好的方法）。还记得在之前的章节中我们讨论过权限吗？回想一下你可以分配给文件的权限之一名为 `execute`（执行）。分配了执行权限后，任何文件（包括文本文件）都可以允许从\
  \ shell 提示符执行。这是让终端用户轻松运行脚本的极佳选择。\n\n要实现这一点，只需为所有者（Owner）、组（Group）和/或其他人（Others）启用执行属性。正如你之前学到的，这是使用\
  \ `chmod` 命令完成的。在我们这里处理的示例中，我可以在 shell 提示符处输入 `chmod u+x runme` 配置 `runme` 文件允许文件所有者执行。然后我只需在\
  \ shell 提示符处输入它的名称即可运行 `runme` 脚本，就像运行任何其他系统命令一样。如下例所示：\n\n![Images](img/p0505-01.jpg)\n\
  \n如有必要，我也可以给组和/或其他人赋予执行权限。\n\n在处理脚本时，你还需要注意另一个问题，那就是路径问题。注意上一个示例，我必须在 shell 提示符处输入\
  \ `./runme`。尽管该文件位于当前目录（在此情况下为 `/home/rtracy`），但该目录不在我的 `PATH` 环境变量中。\n\n如果你是为自己创建脚本，这可能不是问题。到目前，你应该已经足够熟悉\
  \ Linux，能够理解为什么必须在 shell 提示符处指定文件的路径，并知道如何操作。然而，如果你是为终端用户创建一个运行的脚本，这可能会带来问题。为了避免产生烦恼，你应该考虑将脚本放在\
  \ `PATH` 部分的目录中，或者将该目录添加到现有的 `PATH` 中。\n\n你可以使用的一种方案是每个用户家目录下的 `~/bin` 目录。大多数 Linux\
  \ 发行版会自动为每个用户创建一个名为 `/bin` 的目录。然后，使用在之前章节中讨论过的 bash 配置文件之一，在启动 shell 时自动将 `~/bin`\
  \ 添加到 `PATH` 环境变量中。如下所示：\n\n![Images](img/p0505-02.jpg)\n\n因为在 `PATH` 中，所以你放在 `~/bin`\
  \ 中的任何文件都可以从 shell 提示符运行，而无需指定文件的完整路径。当然，你也可以创建自己的目录并手动编辑 bash 配置文件，将其添加到用户的 `PATH`\
  \ 环境变量中。\n\n考虑到这些背景，让我们花些时间讨论如何创建一个基础 shell 脚本。\n\n## 创建基础脚本\n\n如前所述，shell 脚本的范围从极其基础到极其复杂不等。我们之前回顾的示例是一个非常简单的脚本。它在屏幕上回文本并运行了一个命令。对于你的\
  \ Linux+/LPIC-1 考试，你需要能够创建比这复杂多的脚本。因此，在本章的这部分，我们将涵盖以下主题：\n\n- 在屏幕上显示文本\n- 向脚本添加命令\n\
  - 从用户处读取输入\n\n让我们开始讨论如何在 shell 脚本在屏幕上显示文本。\n\n### 在屏幕上显示文本\n\n这项任务非常简单。正如你在之前回顾的示例中看到的，你可以使用\
  \ `echo` 命令在 shell 脚本在屏幕上显示文本。使用 `echo` 的语法只需在脚本文件中输入 `echo “text_to_be_displayed”`\
  \ 即可。\n\n在我们之前看到的简单脚本示例中，我输入了 `echo “The current date and time is:”` 来在屏幕上显示相关文本。因为\
  \ shell 脚本只是调用并运行 `echo` 命令，你可以可以使用你在 shell 提示符处运行 `echo` 时使用的所有选项。查看 `echo` 的手册页（man\
  \ page）以查看可用内容。\n\n除了在屏幕上显示文本，你还可以从脚本运行命令。让我们接着回顾这是如何实现的。\n\n### 向脚本添加命令\n\n要从脚本内部运行\
  \ shell 命令，只需在脚本中输入相应的命令以及你想要包含其中的的所有选项。在我们之前看到的简单脚本示例中，我使用了 `date` 命令来显示当前日期和时间。你可以在\
  \ shell 脚本中包含几乎任何命令。只需记住，除非使用管道在命令之间移动数据，否则请将每个命令单独放在一行。\n\n让我们通过讨论如何在脚本从用户处获取输入让事情变得有趣一点。\n\
  \n### 读取用户输入\n\n到为止，我们的脚本是非交互式的，这意味着用户只需在 shell 提示符处输入命令，脚本就会执行它被编写要执行。\n\n然而，你可以通过让脚本变为交互式使其更加灵活，这意味着你可以让脚本向用户提问，然后捕获他们的输入进行处理。这是通过之前讨论过的\
  \ `echo` 命令结合 `read` 命令完成的。`echo` 命令用于向用户提出问题。`read` 命令用于暂停脚本，在屏幕上显示提示符，并将用户提供的信息读取到你定义的变量中。考虑此示例：\n\
  \n![Images](img/p0506-01.jpg)\n\n\n\n\n\n在该脚本中，系统会提示用户输入其想要添加到 `PATH` 环境变量的目录名称。`read`\
  \ 命令为用户提供了一个输入目录名称的提示。当用户按下回车键（ENTER）时，其输入的值将被赋值给名为 `MYNEWPATH` 的变量。\n\n一旦变量存储在内存中，就会再次使用\
  \ `echo` 命令在屏幕上显示 `MYNEWPATH` 的值。现在，我们还没有实际上修改过 `PATH` 变量。要实现这一点，我们需要向 shell 脚本中添加更多命令。处理此问题最好的方法是问自己：“如果在\
  \ shell 提示符下执行这些操作，我需要哪些命令？”然后在脚本中输入这些命令并尝试。\n\n在这个示例中，我们需要将用户指定的目录添加到 `PATH`，然后导出\
  \ `PATH`。这可以使用示例所示的命令来完成：\n\n![Images](img/p0507-01.jpg)\n\n如果你做过任何编程，可能已经注意到我们不需要在脚本的任何地方声明\
  \ `MYNEWPATH` 变量。在许多脚本语言和编程语言中，你必须首先声明变量、设置其大小，并指定它将包含什么类型的信息（文本字符串、实数、整数、布尔值等）。bash\
  \ shell 则稍微宽容一些。bash shell 会根据 `read` 命令动态地在内存中为你创建变量，并将用户的输入赋值其值。\n\n当然，如果你愿意，bash\
  \ 也允许你声明并指定变量类型。这是通过使用脚本中的 `declare` 命令实现的。如果你希望用户在 `read` 命令中输入数字，这就会非常有用。这里的问题是，bash\
  \ shell 会将 `read` 命令输入的任何内容都解释为 `text`（文本），即使用户输入的是数字。考虑这个脚本：\n\n![Images](img/p0507-02.jpg)\n\
  \n运行时，此脚本会要求用户输入两个数字，将它们相加，并将结果赋值给名为 `TOT` 的变量，并在屏幕上显示 `TOT` 的值。注意运行脚本时发生了什么：\n\n\
  ![Images](img/p0507-03.jpg)\n\n![Images](img/p0508-01.jpg)\n\n由于我们没有声明 `NUM1`、`NUM2`\
  \ 和 `TOT` 变量，bash 将它们都视为简单的文本。没有发生任何算术运算；每个变量的文本值被拼接成一个单一的文本字符串。然而，如果我们声明这些变量并将其类型指定为整数，将会发生非常不同的情况。考虑这里显示的该脚本的修订版本：\n\
  \n![Images](img/p0508-02.jpg)\n\n注意 `NUM1`、`NUM2` 和 `TOT` 在脚本开头使用 `-i`（整数）选项进行了声明。现在，bash\
  \ shell 将用户的输入解释为整数整数，而不是文本。当我们在脚本的变量上使用 `+` 运算符时，它们实际上是相加了，而不仅仅是拼接，如下所示：\n\n![Images](img/p0508-03.jpg)\n\
  \n你做得很棒！我们已经从简单的脚本演到了稍微复杂一点的。让我们再提高一个档，在我们的脚本中添加一些控制结构。\n\n### 在脚本中使用控制结构\n\n除了交互性外，在你的\
  \ shell 脚本中添加控制结构非常有益。到目前为止，我们的脚本都是从头到尾直接执行的。这种工作运行良好，但如果我们需要脚本做出某些决定呢？根据用户输入或命令的输出，你可能希望脚本确定行动方案。这是通过在脚本中实现控制结构完成的。我们将讨论这种类型脚本元素的以下内容：\n\
  \n![images](img/bull.jpg) 使用 if/then/else 结构\n\n![images](img/bull.jpg) 使用 case\
  \ 结构\n\n![images](img/bull.jpg) 使用循环结构\n\n让我们从复习 if/then 语句开始。\n\n### 使用 if/then\
  \ 结构\n\n在 shell 脚本中使用 if/then/else 结构可以让脚本具有根据特定条件的真假执行不同命令的能力。该结构如下：\n\n![Images](img/p0509-01.jpg)\n\
  \n结构的 `if` 部分告诉 shell 确定指定条件的求值结果是 `true` 还是 `false`。如果是真，则运行结构中 `then` 部分下的命令。如果条件求值结果为假，则运行结构中\
  \ `else` 部分下的命令。\n\n例如，在本书的这一部分我们一直处理的脚本中，我们要求用户输入其想要添加到 `PATH` 环境变量的目录名称。当我们添加目录\
  \ `PATH` 时，shell 并不会检查用户输入的目录是否真的存在。运行一个快速测试并验证指定的目录是否存在是有益的。如果存在，我们应该将其添加到 `PATH`\
  \ 变量中。如果不存在，我们应该在屏幕上发布错误消息，告诉用户发生了什么。下一个示例中的脚本正是执行此操作：\n\n![Images](img/p0509-02.jpg)\n\
  \n在这个示例中，`[ -d \"$MYNEWPATH\" ]` 条件调用了一个名为 `test` 的工具，并引导它检查 `MYNEWPATH` 变量中的目录是否存在（通过\
  \ `-d` 选项指定）。\n\n如果 `test` 返回 `TRUE` 值，则执行 `if` 语句下方的步骤。然而，如果 `test` 程序返回 `FALSE`\
  \ 值，则执行结构 `else` 部分下的语句。在这种情况下，将显示错误消息，指示目录不存在。当我们运行此脚本并提供有效目录时，将显示以下输出：\n\n![Images](img/p0509-03.jpg)\n\
  \n![Images](img/p0510-01.jpg)\n\n除了在 if/then/else 结构中使用 `-d` 选项测试条件外，你还可以使用 `test`\
  \ 命令本身。你可以在 `test` 使用以下选项：\n\n![images](img/bull.jpg) `-d` 检查指定的文件是否存在以及是否为目录。\n\
  \n![images](img/bull.jpg) `-e` 检查指定的文件是否存在。但它不区分文件和目录。\n\n![images](img/bull.jpg)\
  \ `-f` 检查指定的文件是否存在以及是否为普通文件。\n\n![images](img/bull.jpg) `-G` 检查指定的文件是否存在并由指定组所有。\n\
  \n![images](img/bull.jpg) `-h or –L` 检查指定的文件是否存在以及是否为符号链接。\n\n![images](img/bull.jpg)\
  \ `-O` 检查指定的文件是否存在并由指定用户所有。\n\n![images](img/bull.jpg) `-r` 检查指定的文件是否存在以及是否授予了读取权限。\n\
  \n![images](img/bull.jpg) `-w` 检查指定的文件是否存在以及是否授予了写入权限。\n\n![images](img/bull.jpg)\
  \ `-x` 检查指定的文件是否存在以及是否授予了执行权限。\n\n例如，以下结构测试 `/home/tracy` 目录下是否存在名为 `myfile` 文件：\n\
  \n![Images](img/p0510-02.jpg)\n\n你可以使用 `test` 命令做比测试文件是否存在更多。`test` 可以评估的一些示例条件如下：\n\
  \n如果文本相同：\n\n![Images](img/p0510-03.jpg)\n\n如果字符串不相等：\n\n![Images](img/p0510-04.jpg)\n\
  \n如果两个数字相同：\n\n![Images](img/p0510-05.jpg)\n\n如果 num1 小于 num2：\n\n![Images](img/p0510-06.jpg)\n\
  \n如果 num1 大于 num2：\n\n![Images](img/p0510-07.jpg)\n\n你还可以在脚本中使用一种相关的 `case` 的结构。让我们接下来讨论如何使用它。\n\
  \n\n\n\n\n**TIP** 你也可以使用一系列的 `if/then` 语句来代替 `case` 语句。然而，这可能会导致代码非常混乱，并且被认为是不良的。如果你有一个评估后可以返回两个以上响应的结果，你应该使用\
  \ `case` 语句。\n\n使用 `case` 结构的语法如下：\n\n![Images](img/p0511-01.jpg)\n\n本质上，`case`\
  \ 语句将列出的变量值与 `case` 语句内部的响应列表进行比较。如果找到匹配项，将执行与该响应相关的命令。所有其他列表项的命令将被忽略。\n\n例如，我们可以编写一个脚本，询问用户出生的月份。根据他们提供的回答，你可以使用\
  \ `case` 语句让脚本提供定制化的响应。以下是实现此功能的示例脚本：\n\n![Images](img/p0511-02.jpg)\n\n该脚本询问用户出生的月份，然后使用\
  \ `case` 结构确定其出生季节。提供了五个选项：\n\n![images](img/bull.jpg) 12 月、1 月或 2 月\n\n![images](img/bull.jpg)\
  \ 3 月、4 月或 5 月\n\n![images](img/bull.jpg) 6 月、7 月或 8 月\n\n![images](img/bull.jpg)\
  \ 9 月、10 月或 11 月\n\n![images](img/bull.jpg) *\n\n注意，同一行上的不同术语是用管道字符（`|`）分隔的。这意味着“或”。如果用户的响应匹配其中一个术语，则执行与其所在行相关的命令。在下面的示例中，脚本已经运行，用户输入的出生月份是六月：\n\
  \n![Images](img/p0512-01.jpg)\n\n由于变量 `MYMONTH` 的值匹配 `case` 语句中对应 `June` 的一行，因此执行了针对\
  \ 6 月、7 月或 8 月响应的 `echo` 命令。注意我们在 `case` 语句的末尾使用星号（`*`）添加了一个额外的响应。此选项允许在用户响应不匹配\
  \ `case` 语句中列出的任何其他项时，为用户提供反馈。\n\n### 使用循环结构\n\n`if/then/else` 和 `case` 结构被称为*分支结构*。根据条件评估的结果，脚本会向一个方向或另一个方向分支。你也可以在\
  \ shell 脚本中使用*循环*控制结构。循环结构有三种类型：`while loop`、`until loop` 和 `for loop`。`while 循环`会不断重复执行，直到指定的条件不再为真。`while\
  \ 循环`的结构如下：\n\n![Images](img/p0512-02.jpg)\n\n`while 循环`将不断地不断处理，直到条件评估为假。\n\n除了\
  \ `while 循环` 之外，你还可以在脚本中使用 `until 循环`。它的工作方式相反。`until 循环`在条件为假时会不断运行。一旦条件为真，它就会停止。`until\
  \ 循环`的结构如下：\n\n![Images](img/p0512-03.jpg)\n\n你还可以使用 `for 循环`，它的运行方式与 `until` 或\
  \ `while` 循环不同。`until` 和 `while` 循环会无限循环，直到满足指定的条件。而 `for 循环` 则会循环特定的次数。\n\n在 `for\
  \ 循环` 中使用 `seq` 命令来创建数字序列以确定循环次数是非常常见的。使用 `seq` 创建数字序列有三种选项：\n\n![images](img/bull.jpg)\
  \ 如果你指定单个值，序列从 1 开始，每次递增 1，在指定的值结束。\n\n![images](img/bull.jpg) 如果你指定两个值，序列从第一个值开始，每次递增\
  \ 1，在第二个值结束。\n\n![images](img/bull.jpg) 如果你指定三个值，序列从第一个值开始，每次按第二个值递增，在第三个值结束。\n\n\
  考虑以下示例：\n\n`seq 5 15`\n\n此命令创建了一个从 5 开始、每次增加 1、并在 15 结束的数字序列。以下是在 `for 循环` 中使用 `seq`\
  \ 的示例：\n\n![Images](img/p0513-02.jpg)\n\n循环结构最大的危险可能是陷入无限循环。当条件永远不会变为可以打破循环的值时就会就会这种情况。在这种情况下，脚本会“挂起”，因为它会不断、不断、不断地运行同一个循环结构，并将一直持续下去，直到你手动使用\
  \ `CTRL-C` 强制跳出。\n\n让我们在下面的练习中练习基础 shell 脚本的操作。\n\n### 练习 14-1：创建一个基础 shell 脚本\n\
  \n在练习中，你将练习创建一个基础 shell 脚本。该脚本将要求用户输入三个数字。然后它将询问用户想对这三个数字求和还是求平均值。你还将为该文件添加执行权限，允许文件所有者运行它。\n\
  \n你可以使用随本书提供的虚拟机进行此练习。运行快照 14-1 以获得配置正确的环境。\n\n* *\n\n![Images](img/viedo.jpg)\n\
  \n**VIDEO** 请观看练习 14-1 视频，查看如何执行此任务的演示。\n\n完成以下操作：\n\n**1.** 如必要，启动你的 Linux 系统并以标准用户身份登录。\n\
  \n**2.** 到 `~/bin` 目录。\n\n**3.** 在 shell 提示符处，输入 `vi domath`。\n\n**4.** 输入以下脚本：\n\
  \n![Images](img/p0514-01.jpg)\n\n**5.** 保存脚本的更改并退出 `vi`。\n\n**6.** 在 shell 提示符处输入\
  \ `chmod u+x domath` 使文件所有者拥有脚本的可执行权限。\n\n**7.** 在 shell 提示符处输入 `domath` 测试脚本。\n\
  \n**8.** 测试脚本并验证其运行正常。\n\n## 处理文本流\n\n当你在脚本中处理文本流或在 shell 提示符处管道输出时，有时可能需要过滤一个命令的输出，以便将文本流的某些部分实际传递给下一个命令的\
  \ `stdin`。你可以使用多种工具来实现此。在本章的最后一部分，我们将查看以下命令：\n\n![images](img/bull.jpg) cut\n\n\
  ![images](img/bull.jpg) expand and unexpand\n\n![images](img/bull.jpg) fmt\n\n![images](img/bull.jpg)\
  \ join and paste\n\n![images](img/bull.jpg) nl\n\n![images](img/bull.jpg) od\n\n\
  ![images](img/bull.jpg) pr\n\n![images](img/bull.jpg) sed and awk\n\n![images](img/bull.jpg)\
  \ sort\n\n![images](img/bull.jpg) split\n\n![images](img/bull.jpg) tr\n\n![images](img/bull.jpg)\
  \ uniq\n\n![images](img/bull.jpg) wc\n\n让我们从查看 `cut` 命令开始。\n\n### cut\n\n`cut` 命令用于从文件中提取指定的列或字段到标准输出。默认情况下，使用制表符作为分隔符。以下选项可\
  \ `cut`：\n\n![images](img/bull.jpg) `-b list` 只选择这些字节。\n\n![images](img/bull.jpg)\
  \ `-c list` 只选择这些字符。\n\n![images](img/bull.jpg) `-d delim` 使用指定的字符代替制表符作为字段分隔符。\n\
  \n![images](img/bull.jpg) `-f list` 只选择指定的字段。如果没有指定 `-s`，则打印任何包含分隔符的行。\n\n![images](img/bull.jpg)\
  \ `-s` 不打印包含分隔符的行。\n\n例如，你可以使用 `cut` 命令从 `/etc/group` 文件显示所有组名。记住，每个组名位于文件中行的第一个字段。然而，组文件使用冒号作为字段分隔符，因此你必须指定冒号而不是制表符作为分隔符。执行此操作的命令是\
  \ `cut -d: -f1 /etc/group`。示例见图 14-2。\n\n![Images](img/f0515-01.jpg)\n\n**图 14-2**\
  \ 使用 `cut` 命令从 /etc/group 提取字段\n\n让我们来看 `expand` 和 `unexpand` 命令。\n\n### expand\
  \ and unexpand\n\n\n\n\n\n`expand` 命令用于处理文本流，并移除所有的制表符（tab），将其替换为指定数量的空格（默认为八个）。你可以使用\
  \ `-t *number` 选项来指定不同的空格数量。语法为 `expand –t *number filename`。在图 14-3 中，`tabfile`\
  \ 文件中的制表符被替换为五个空格。\n\n![Images](img/f0516-01.jpg)\n\n**图 14-3** 使用 `expand` 将制表符替换为空格\n\
  \n你也可以使用 `unexpand` 命令。`unexpand` 命令的工作与 `expand` 命令相反。它将文本流中的空格转换为制表符。默认情况下，八个连续的空格会被转换为制表符。然而，你可以使用\
  \ `-t` 选项来指定不同的空格数量。\n\n需要注意的是，默认情况下，`unexpand` 只转换每行开头的空格。要强制它将所有指定数量的空格转换为制表符，你必须在\
  \ `unexpand` 命令中包含 `-a` 选项。在图 14-4 中，我们使用 `expand` 命令创建的 `tabfile` 文件第二行和第三行开头的五个空格被\
  \ `unexpand` 命令转换回制表符。\n\n![Images](img/f0516-02.jpg)\n\n**图 14-4** 使用 `unexpand`\
  \ 命令将空格转换为制表符\n\n接下来，让我们来看看如何使用 `fmt` 命令重新格式化文本。\n\n### fmt fmt\n\n你可以使用 `fmt` 命令重新格式化文本文件。它通常用于更改文件中长行的换行变为更易管理的宽度。使用\
  \ `fmt` 的语法是 `fmt *option filename`。\n\n例如，你可以使用 `fmt` 命令的 `-w` 选项，通过输入 `fmt –w\
  \ 80 *filename` 将文件的文本宽度限制为 80 列。示例见图 14-5。\n\n![Images](img/f0517-01.jpg)\n\n**图\
  \ 14-5** 使用 `fmt` 更改文件的列数\n\n接下来，让我们来看 `join` 和 `paste` 命令。\n\n### join and paste\n\
  \n`join` 命令从两个指定的输入文件中打印具有相同连接字段（join fields）的行。第一个字段是默认的连接字段，由空格分隔。你可以使用 `-j *field`\
  \ 选项指定不同的连接字段。\n\n例如，假设你有两个文件。第一个文件（名为 `firstnames`）包含以下内容：\n\n![Images](img/p0517-01.jpg)\n\
  \n第二个文件（名为 `lastnames`）包含以下内容：\n\n![Images](img/p0517-02.jpg)\n\n你可以通过输入 `join –j\
  \ 1 firstnames lastnames` 来使用 `join` 命令合并每个文件中对应的行。显示所示：\n\n![Images](img/p0517-03.jpg)\n\
  \n`paste` 命令的工作原理与 `join` 命令非常相似。它将一个或多个文件中对应的行并成列。默认情况下，使用制表符作为分隔符。你可以使用 `-d*n`\
  \ 选项指定不同的分隔符。你还可以使用 `-s` 选项将每个文件的内容放入单行。\n\n例如，你可以通过输入 `paste firstnames lastnames`\
  \ 来使用 `paste` 命令合并 `firstnames` 和 `lastnames` 文件中的对应行。示例所示：\n\n![Images](img/p0518-01.jpg)\n\
  \n接下来，让我们来看 `nl` 命令。\n\n### nl\n\n`nl` 命令确定文件中的行数。当你运行该命令时，输出将会在文件的每行开头添加一个行号。语法为\
  \ `nl *filename`。\n\n例如，在所示示例中，使用 `nl` 命令在 `tabfile.txt` 文件的每行开头添加数字：\n\n![Images](img/p0518-02.jpg)\n\
  \n### od\n\n`od`（八进制导出）命令用于转储文件，包括二进制文件。该实用可以使用多种不同的格式转储文件，包括八进制、十进制、浮点数、十六进制和字符格式。`od`\
  \ 的输出是纯文本，因此你可以使用我们一直在观察的其他流处理工具对其进一步过滤。\n\n`od` 命令非常有用。例如，你可以对文件进行转储，以定位文件中的离散字符。假设你使用另一个操作系统（如\
  \ Windows）上的编辑器创建了一个脚本文件，然后并尝试在 Linux 上运行它。取决于你使用的编辑器，脚本文本中可能包含你的文本编辑器无法显示的隐藏格式字符。然而，当你尝试运行脚本时，`bash`\
  \ shell 会读取它们，从而导致错误。当你从编辑器中查看脚本时，一切看起来正常。\n\n你可以使用 `od` 命令查看脚本的转储，以隔离出文件中导致问题的字符的位置。使用\
  \ `od` 的语法是 `od *options filename`。一些常用选项包括：\n\n![images](img/bull.jpg) –b 八进制转储\n\
  \n![images](img/bull.jpg) –d 十进制转储\n\n![images](img/bull.jpg) –x 十六进制转储\n\n![images](img/bull.jpg)\
  \ –c 字符转储\n\n例如，在图 14-6 中，在 LibreOffice 文字处理器中创建了一个简单的“Hello World”脚本并将其保存为 `.odt`\
  \ 文件。因此，文本中嵌入了无数隐藏字符。\n\n![Images](img/f0519-01.jpg)\n\n**图 14-6** 在 OpenOffice.org\
  \ 中创建脚本\n\n这些字符显然无法在 LibreOffice 内部查看。然而，可以使用 `od –c helloworld.odt` 命令进行查看。这在图\
  \ 14-7 中所示。\n\n![Images](img/f0519-02.jpg)\n\n**图 14-7** 使用 `od` 创建字符转储\n\n接下来，我们回顾一下\
  \ `pr` 命令。\n\n### pr\n\n`pr` 命令用于格式化打印文本文件。它通过分页、页眉和列对文件进行格式化。页眉包含日期、时间、文件名和页码。配合\
  \ `pr` 使用以下选项：\n\n![images](img/bull.jpg) –d 输出双倍行距。\n\n![images](img/bull.jpg)\
  \ –l *page_length 将页设置为指定的行数。默认值为 66。\n\n![images](img/bull.jpg) –o *margin 用指定数量的空格偏移每行。默认边距为\
  \ 0。\n\n接下来，我们需要查看 `sed` 和 `awk`。\n\n### sed and awk\n\n`sed` 命令是一个*流*文本编辑器。与你在书中学习的如何使用的交互式文本编辑器（如\
  \ `vi`）不同，流编辑器接受文本流作为标准输入（stdin），然后执行你指定的操作。然后，`sed` 将结果发送到标准输出（stdout）。你可以配合 `sed`\
  \ 使用以下命令：\n\n![images](img/bull.jpg) s 将指定的文本字符串实例替换为另一个文本字符串。使用 `s` 命令的语法是 `sed\
  \ s/*term1/*term2/**`。例如，在图 14-8 中，我使用了 `cat` 命令显示 `tux` 用户家目录下名为 `lipsum.txt` 的文件。然后我使用\
  \ `cat` 读取 `lipsum.txt`，将其标准输出通过给 `sed` 命令的标准输入，并指定将“ipsum”替换为“IPSUM”。\n\n![images](img/bull.jpg)\
  \ d 删除指定的文本。例如，要删除标准输入中包含术语“eos”的所有行，你需要输入 `sed /eos/d`。\n\n记住，`sed` 实际上并没有修改信息源——在本例中即\
  \ `lipsum.txt` 文件。它获取标准输入，进行更改并将其发送到标准输出。如果你想保存 `sed` 所的更改，需要使用 `>` 将其标准输出重定向到文件。例如，我可以将图\
  \ 14-8 中命令的输出重定向到名为 `lipsum_out.txt` 的文件，只需在 shell 提示符输入 `cat lipsum.txt | sed s/ipsum/IPSUM/\
  \ > lipsum_out.txt` 即可。\n\n\n\n\n\n**注意** 本章讨论的 `sed` 和 `awk` 命令非常强大。我们这里的空间仅足以涵盖\
  \ Linux+/LPIC-1 考试所需的基础知识。你应该复习这两个命令的 man 页（帮助文档），并利用这些信息来探索更多的可能性。\n\n除了 `sed`\
  \ 之外，你还可以使用 `awk` 来处理输出。像 `sed` 一样，`awk` 可以接收另一个命令的输出作为其标准输入（stdin），并按你指定的方式对其进行处理。然而，`awk`\
  \ 处理此问题略有不同。`awk` 命令将它接收到的每行文本视为一条记录（record）。行中的每个由空格或制表符分隔的单词被视为记录中的某一个独立的字段（field）。\n\
  \n例如，考虑以下文本文件：\n\n![Images](img/p0521-01.jpg)\n\n根据 `awk` 的定义，此文件有七条记录，因为它有七行独立的文本。每行文本末尾都有一个回车/换行符，这会创建一个新行。这就是\
  \ `awk` 用来定义记录结束的字符。第一条记录有八个字段，第二条记录有 11 个字段，依此类推。这些在表 14-1 中所示。\n\n![Images](img/t0521-01.jpg)\n\
  \n**表 14-1** 将文本文件视为数据库\n\n注意，是空白而不是标点符号分隔了字段。每个字段通过 `$*field_number` 进行引用。例如，任何记录的第一个字段引用为\
  \ `$1`，第二个引用为 `$2`，依此类推。\n\n使用 `awk`，我们可以指定特定记录中的某个字段并对其进行某种方式的处理。使用 `awk` 的语法为\
  \ `awk ‘*pattern {manipulation}’`。例如，我们可以输入 `cat lipsum2.txt | awk ‘{print $1,$2,$3}’`\
  \ 来打印每行（“记录”）的前三个单词（“字段”）。因为我们没有指定匹配模式，`awk` 将直接打印每行的前三个单词。这在图 14-9 中所示。\n\n![Images](img/f0521-01.jpg)\n\
  \n**图 14-9** 使用 awk 打印每条记录的前三个字段\n\n你还可以包含一个模式来指定精确搜索哪些记录。例如，假设我们只想显示行中某个包含文本“do”的任何记录的前三个字段。要实现这一点，你需要在命令中添加一个为\
  \ `/do/` 的模式。这在图 14-10 中所示。\n\n![Images](img/f0522-01.jpg)\n\n**图 14-10** 在 awk\
  \ 命令中使用搜索模式\n\n你还可以向输出中添加你自己的文本。只需将其添加到引号内的命令的处理部分即可。事实上，你也可以向输出中添加控制字符。使用以下字符：\n\
  \n![images](img/bull.jpg) `\\t` 插入一个制表符\n\n![images](img/bull.jpg) `\\n` 添加一个换行符\n\
  \n![images](img/bull.jpg) `\\f` 添加一个分页符\n\n![images](img/bull.jpg) `\\r` 添加一个回车符\n\
  \n例如，在图 14-11 中，我输入了\n\n![Images](img/f0522-02.jpg)\n\n**图 14-11** 为 awk 的输出添加文本\n\
  \n这导致每个字段被标记为 Field 1、Field 2 和 Field 3。它还在每个字段之间插入了制表符。\n\n![Images](img/p0522-01.jpg)\n\
  \n与 `sed` 一样，`awk` 不修改原始文件。它将输出发送到标准输出（stdout，屏幕）。如果你想将其发送到文件，可以使用 `>` 进行重定向。\n\n\
  考虑到这一点，让我们接下来来看 `sort` 命令。\n\n### sort\n\n`sort` 命令按字母顺序对文本文件的行进行排序。输出被写入标准输出。`sort`\
  \ 命令的一些常用选项包括：\n\n![images](img/bull.jpg) `--f` 将小写字符折叠（转换为）大写字符。\n\n![images](img/bull.jpg)\
  \ `--M` 按月份排序。\n\n![images](img/bull.jpg) `--n` 按数字排序。\n\n![images](img/bull.jpg)\
  \ `--r` 反转排序顺序。\n\n例如，命令 `sort –n –r firstnames` 以数字倒序的方式对 firstnames 文件中的行进行排序。这在此处：\n\
  \n![Images](img/p0523-01.jpg)\n\n`sort` 命令可以通过管道将第一个命令的标准输出传递给 `sort` 命令的标准输入，从而对其他命令（如\
  \ `ps`）的输出进行排序。\n\n接下来，来看 `split` 命令。\n\n### split\n\n`split` 命令将输入文件分成一系列文件（不修改原始输入文件）。默认是将输入文件分成每\
  \ 1000 行一个段。你可以使用 `-n` 选项来指定不同的行数。\n\n例如，命令 `split –1 firstnames outputfile_` 可以将\
  \ firstnames 文件拆分成三个独立的文件，每个文件包含一行。这在图 14-12 中所示。\n\n![Images](img/f0523-01.jpg)\n\
  \n**图 14-12** 分割文件\n\n接下来，来看 `tr` 命令。\n\n### tr\n\n`tr` 命令用于翻译或删除字符。然而，请注意，该命令不支持文件。要对文件使用它，你必须先使用\
  \ `cat` 等命令将文本流发送到 `tr` 的标准输入。语法为 `tr options X Y`。`tr` 命令的一些常用选项包括：\n\n![images](img/bull.jpg)\
  \ `--c` 使用所有不在 `X` 中的字符。\n\n![images](img/bull.jpg) `--d` 删除 `X` 中的字符；不进行翻译。\n\n\
  ![images](img/bull.jpg) `--s` 将 `X` 中列出的重复字符的每个输入序列替换为该字符的一个实例。\n\n![images](img/bull.jpg)\
  \ `--t` 首先将 `X` 截断为 `Y` 的长度。\n\n例如，要将 lastnames 文件中的所有小写字符翻译为大字符，你可以输入 `cat lastnames\
  \ | tr a-z A-Z`，如下所示：\n\n![Images](img/p024-01)\n\n接下来，来看 `uniq` 命令。\n\n### uniq\n\
  \n`uniq` 命令报告或忽略重复行。语法为 `uniq options input`。你可以使用 `uniq` 使用以下选项：\n\n![images](img/bull.jpg)\
  \ `--d` 仅打印重复行。\n\n![images](img/bull.jpg) `--u` 仅打印唯一行。\n\n例如，假设我们的 lastnames 文件包含重复项：\n\
  \n![Images](img/p0524-02.jpg)\n\n你可以使用 `uniq lastnames` 命令移除重复行。如下所示：\n\n![Images](img/p0524-03)\n\
  \n注意，`uniq` 仅在重复行相邻时有效。如果你需要处理的流包含不相邻的重复行，可以先使用 `sort` 命令使它们相邻，然后将其传递给 `uniq` 标准输入。\n\
  \n最后，来看 `wc` 命令。\n\n### wc\n\n`wc` 命令打印文件的换行符、单词和字节数。语法为 `wc options files`。你可以对\
  \ `wc` 使用以下选项：\n\n![images](img/bull.jpg) `--c` 打印字节数。\n\n![images](img/bull.jpg)\
  \ `--m` 打印字符数。\n\n![images](img/bull.jpg) `--l` 打印换行数。\n\n![images](img/bull.jpg)\
  \ `--L` 打印最长的长度。\n\n![images](img/bull.jpg) `--w` 打印单词数。\n\n例如，要打印 firstnames 文件的所有计数，你会使用\
  \ `wc firstnames` 命令，如下所示：\n\n![Images](img/p0525-01.jpg)\n\n让我们在下面的练习中处理文本流。\n\n\
  ### 练习 14-2：处理文本流\n\n在此练习中，你将处理文本流。你可以使用随书提供的虚拟机进行此练习。运行快照 14-2 以获得正确的环境。\n\n* *\
