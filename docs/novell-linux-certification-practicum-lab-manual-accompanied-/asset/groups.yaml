    there is no difference between the formats with the exception of not needing to
    switch media with DVD. This discussion walks, insert the first CD into the drive
    and boot the workstation. A Welcome will quickly appear followed by a screen offering
    a boot options menu. If the boot options menu does not appear, reconfigure the
    BIOS on the workstation to make the drive bootable.


    The welcome menu offers the following choices:


    +   * Boot Hard disk—This choice is the default, and the one to use if you accidentally
    arrive at this menu and truly do not want to make any changes.

    * Installation—The choice to use to begin the installation routine.

    * Installation - ACPI Disabled—This option sets acpi=off and is used only if you
    are having trouble with power savings interfering with the installation routine.

    * Installation - Safe Settings—Among other things, this sets acm=off, acpi=off,
    and barrier=off and is used when you are having a great deal of trouble getting
    an'
