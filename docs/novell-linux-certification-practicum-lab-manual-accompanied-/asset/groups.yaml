    \n![](img/eaba1d2fab748d377682b64e8e54182b_106_0.png)\n\nAfter clicking Next,\
    \ Choose Details and change the login shell to the one specified in the exercise.\
    \ Verify that the default group is users and the correct additional group memberships\
    \ have been selected. Click Next and then Create.\nClick Finish to edit the module\
    \ and return to YaST.\n\nTo complete the second part of the exercise, choose Security\
    \ Settings and make sure that the Local Security Configuration is set to Custom\
