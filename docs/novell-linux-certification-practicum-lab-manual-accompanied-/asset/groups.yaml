- md: "\n# Exercise 31: P.A.R. Inc.\n\nThe trickiest part about this shell script\
    \ is that the variable needs to be treated as a number. This can be accomplished\
    \ with the following:\n\n```bash\n#incrmt\n#!/bin/bash\ntypeset -i x\nx=$1\nuntil\
    \ [ \"$x\" -lt 1 ]\ndo\necho $x\nlet x=\"$x-1\"\ndone\n```\n\nMake sure that the\
    \ the owner has permission to execute the script by entering chmod +x /usr/INCRMT.\n\
    \n# Exercise 32: Quality Seals\n\nSecurity information is readily found at a number\
    \ of Linux-related sites. The first to check, and stay abreast of, is always the\
    \ vendor's. Looking at http://www.novell.com/linux/security provides an overview\
    \ of Linux-related security issues with links to a number of relevant pages. You\
    \ should also keep abreast of issues and problems posted at http://www.cert.org\
    \ and http://www.linuxsecurity.com.\n\nInformation on any Linux command can be\
    \ found through a number of utilities inherent in Linux:\n\n- The man tool offers\
    \ pages on each utility. For example, to find information about the setfacl, the\
    \ command would be man setfacl.\n- Most utilities use the built-in option of --help\
    \ to offer information. From the command line, you can type setfacl --help to\
    \ see a quick list of available options.\n- The info utility can be used to view\
    \ the man pages, as well—for example, info setfacl.\n- The whatis utility can\
    \ show if there is more than one set of documentation on the system for the utility:\
    \ whatis setfacl.\n- The which utility will list all the information it can find\
    \ about locations associated with a file—for example, where setfacl.\n- The apropos\
    \ utility uses the whatis database to find values and returns the short summary\
    \ information: apropos setfacl.\n\nThe customer should also be reminded that the\
    \ Web is a great place to find help information on commands as well.\n\n# Exercise\
