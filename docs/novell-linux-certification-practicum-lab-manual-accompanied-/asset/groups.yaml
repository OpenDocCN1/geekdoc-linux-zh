    \ BIOS on the workstation to make the drive bootable.\n\nThe welcome menu offers\
    \ the following choices:\n\n- Boot Hard disk—This choice is the default, and the\
    \ one to use if you accidentally arrive at this menu and truly do not want to\
    \ make any changes.\n- Installation—The choice to use to begin the installation\
    \ routine.\n- Installation - ACPI Disabled—This option sets acpi=off and is used\
    \ only if you are having trouble with power savings interfering with the installation\
    \ routine.\n- Installation - Safe Settings—Among other things, this sets acm=off,\
    \ acpi=off, and barrier=off and is used when you are having a great deal of trouble\
    \ getting it to take.\n\n# CHAPTER 4: Solutions to Exercises\n\nThese settings\
    \ disable certain advanced features such as power management and advanced hard\
    \ drive settings during the installation process. Use this choice as a last ditch\
    \ effort for a successful installation, and use it only after you have exhausted\
    \ the previous two options.\n\n- Manual Installation—This lets you walk through\
    \ only the aspects of the installation you want to tweak.\n- Rescue System—This\
    \ recovers a system with corrupted boot files.\n- Memory Test—This does not do\
    \ any installation, but simply checks the memory.\n\nTo begin a standard installation,\
    \ choose Installation. The License Agreement appears next. Scroll through the\
    \ choices, and you can either click on the command button labeled I Agree or the\
    \ command button labeled I Do Not Agree. If you choose the latter, the installation\
    \ will not continue. After agreeing to the License Agreement, YaST2 identifies\
    \ itself as “The Installation and System Administration Program,” and you must\
    \ select your language. Your hardware is analyzed, and you are given radio buttons\
