    # 练习 75：内华达设计 (Nevada Design)


    你是一个被临时委派到内华达设计的程序员/管理员。内华达设计有许多小任务需要你完成，还有一个简单的请求。


    他们希望有一个简短的 Shell 脚本，用于告诉他们服务器 `/etc/passwd` 文件中列出了多少用户。他们打算定期运行此脚本，以查看是否添加了账户，并在添加账户时引起他们的注意。


    请编写尽可能短的脚本来为客户完成这项任务。


    # 注意事项


    # 练习解答


    以下解答将以逐步的方式介绍每个练习。需要注意的是，通常有多种方法可以达到相同的结果，这里提供的解决方案可能只是其中之一。


    # 练习 1：阿姆斯特朗车身厂 (Armstrong’s Auto Body)


    Novell Linux Desktop 目前以 DVD 和 CD 两种格式提供，两种格式之间的区别在于 DVD 无需切换介质。本讨论将引导你将第一张 CD
    插入驱动器并启动工作站。将迅速出现欢迎界面，随后是提供启动选项菜单的屏幕。如果没有出现启动选项菜单，请重新配置工作站的 BIOS 以使驱动器可启动。


    欢迎菜单提供以下选择：


    - 启动硬盘——这是默认选项，如果你不小心进入了此菜单且真的不想进行任何更改，请使用此项。

    - 安装——用于开始安装程序的程序的选项。

    - 安装 - 禁用 ACPI——此选项设置 `acpi=off`，仅当在你由于电源节能功能干扰安装程序而遇到问题时使用。

    - 安装 - 安全设置——除了其他设置外，此选项还会设置 `acm=off`、`acpi=off` 和 `barrier=off`，用于你在执行安装时遇到很大困难的情况。


    # 第 4 章：练习解答


    这些设置在安装过程中会禁用某些高级功能，如电源管理和高级硬盘设置。请将此选择作为成功安装的最后尝试，并且仅在用尽前两个选项后才使用。


    - 手动安装——这允许你仅调整想要修改的安装方面。

    - 救援系统——用于恢复引导文件损坏的系统。

    - 内存测试——这不会进行任何安装，仅检查内存。


    要开始标准安装，请选择“安装”。接下来会显示许可协议。滚动选项，你可以点击标记为“我同意”的命令按钮，或点击标记为“我不同意”的命令按钮。如果你选择后者，安装将不会继续。同意许可协议后，YaST2
    显示其为“安装与系统管理程序”，你必须选择你的语言。系统将分析你的硬件，并提供单选按钮让你选择 GNOME 或 KDE 作为默认桌面。两者均未预选，因此请选择
    KDE。


    接下来将显示你所选安装设置的摘要。一旦你点击“接受”，就会出现一个警告，告诉 YaST2 已拥有所有所需信息，现在可以开始安装。之后，你点击开始实际安装，硬盘开始准备。你可以通过进度条查看每张
    CD 的安装状态。在该阶段结束时，基础安装将通过以下自动操作完成：


    # 注意事项


    在选择“接受”之前，你应该更改分区建议以留出未分区的空间。如果不这样做，你将在练习 14 中为交换分区（swap partition）添加空间时遇到困难。这些操作的基本步骤如下：


    1. 从“安装设置”页面，选择“分区”。

    2. 在下一页，选择“创建自定义分区设置”。

    3. 选择“自定义分区——专家用”。

    4. 高亮分区表中 Linux 原生分区（Linux native partition）的项目；然后选择“删除 > 是”。

    5. 高亮分区表中存储设备（`/dev/hda` 或 `/dev/sda/`）的项目；选择“创建”。

    6. 选择“主分区”；然后选择“确定”。

    7. 将“结束”字段中的值更改为 `+8GB`（任何保留至少 2GB 空闲磁盘空间的值）；然后选择“确定”。

    8. 选择“下一步”，你将返回“安装设置”页面。

    9. 选择“接受”。


    1. 更新配置。

    2. 将文件复制到已安装的系统。

    3. 安装引导管理器。

    4. 为初始启动做好系统准备。


    系统将重启并继续安装（通常在此处会要求你插入下一张安装 CD）。现在将安装软件包，包括 RealPlayer、Acrobat Reader、Red Carpet
    和 OpenOffice 等。


    系统会提示你输入并验证 root 用户的密码。输入密码 `N7Press`。


    将输入一个命令。屏幕上还会出现“专家选项”。选择它并选择 MD5 加密。将对网络接口、DSL 连接、ISDN 适配器、调制解调器、代理和 VNC 远程管理进行扫描。接受摘要屏幕上找到的结果，并选择测试
    Internet 连接。这对于下载最新的发行说明和更新并确保系统是最新的是必要的。


    当提供三种身份验证模式选择时，选择“本地 (//etc/passwd)”——此选项将启动 `/etc/passwd` 和 `/etc/shadow` 文件中的条目。点击“下一步”后，你可以根据练习中提供的信息为
    Ken Armstrong 添加新用户账户。选择“详细信息”选项可以选择用户所属的其他组。


    选择“下一步”后，SuConfig 现在将启动并运行此时的系统文件；之后将显示“发行说明”。如果你需要，可以滚动滚动并阅读“说明”，也可以在任何时间通过 `/usr/share/docs/release-notes/RELEASE-NOTES.rt`
    访问它们。


    接下来将进行硬件配置，显卡、打印机和声卡等项目将被搜索并识别。你可以在摘要屏幕上接受任何更改，然后点击“下一步”。此时安装已完成，剩下的只需点击“完成”。


    系统将重启并进入 Novell Linux Desktop 登录界面，提示输入用户名和密码。这样做后，KDE 桌面加载，你就可以进入业务了。


    # 第 4 章：练习解答


    # 提示


    如果你以 `keernam` 登录，将正确进入练习 2 中的 YaST。


    # 练习 2：阿姆斯特朗荣誉堂 (Armstrong’s House of Trophy)


    添加本地用户的最简单方法之一是使用 YaST（另一个设置工具）。从“所有应用程序”菜单中选择“系统”、“YaST”，提供 root 密码，并在左面板中选择“安全和用户”。在右面板中选择“编辑”并创建用户。


    出现“用户和组管理”模块。点击“添加”按钮并输入信息，如图 4.1 所示。


