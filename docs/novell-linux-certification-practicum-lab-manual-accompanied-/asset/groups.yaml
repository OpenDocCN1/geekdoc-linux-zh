    \ the DNS server.\n\n![](img/eaba1d2fab748d377682b64e8e54182b_182_0.png)\n\n7.\
    \ Select allow-query in the Option drop-down list.\n8. Type {allowedhosts; } in\
    \ the Value field and click Add.\n9. Click Finish.\n\nCHAPTER 4: Solutions to\
    \ Exercises\n\nTIP\n\nYou can test this configuration easily enough by trying\
    \ to resolve the lab1dsttechnical hostname. If all is working properly, you shouldn't\
    \ be able to do it.\n\n## Exercise 68: Minnesota River Authority\n\nTo configure\
    \ the DHCP daemon to send dynamic updates to the DNS server, follow these steps:\n\
    \n1. Log in as root and start YaST.\n2. Choose Network Services and then DHCP\
    \ Server.\n3. Go to Global Settings and make certain that LDAP Support is not\
    \ checked. Create the TSIG keys.\n4. Fill in the values for the Dynamic DHCP,\
    \ as shown in Figure 4.66.\n\nFIGURE 4.66\nConfigure Dynamic DHCP.\n\n![](img/eaba1d2fab748d377682b64e8e54182b_183_0.png)\n\
    \n## Exercise 69: Mississippi Diabetes Group\n\nThere are any number of writing\
    \ a shell script that will accomplish this task. Because the user should be prompted\
    \ for a filename, the read command should be used. To verify that the file exists,\
    \ the test command should be used (which can be summoned by its alias). The -r\
    \ option can be used to verify that it is readable. Last, if the file does not\
    \ exist, the touch utility can be used to create it with a size of zero.\n\nGiven\
    \ these parameters, the following shell script will fulfill this role:\n\n```\n\
    #MDG.sh\necho \"Enter filename:\"\nread filename\nif [ -r $filename ]; then\n\
    echo \"File exists\"\nelse\ntouch $filename\necho \"File created\"\nfi\n```\n\n\
    TIP\n\nThere needs to be a space between filename and the ]; otherwise you will\
    \ get an error message that line 3 is missing the ].\n\n## Exercise 70: Missouri\
    \ Knife and Scissor\n\nThe cron file entries that Missouri Knife and Scissor needs\
