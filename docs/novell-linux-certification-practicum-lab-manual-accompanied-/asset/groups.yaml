    # CHAPTER 4: Solutions to Exercises


    to take. These settings disable certain advanced features such as power management
    and advanced hard drive settings during the installation process. Use this choice
    as a last ditch effort for a successful installation, and use it only after you
    have exhausted the previous two options.


    +   - Manual Installation—This lets you walk through only the aspects of the installation
    you want to tweak.


    +   - Rescue System—This recovers a system with corrupted boot files.


    +   - Memory Test—This does not do any installation, but simply checks the memory.


    To begin a standard installation, choose Installation. The License Agreement appears
    next. Scroll through the choices, and you can either click on the command button
    labeled I Agree or the command button labeled I Do Not Agree. If you choose the
    latter, the installation will not continue. After agreeing to the License Agreement,
    YaST2 identifies itself as “The Installation and System Administration Program,”
    and you must select your language. Your hardware is analyzed, and you are given
    radio buttons allowing you to choose either GNOME or KDE for the default desktop.
    Neither is preselected, so choose KDE.


    A summary of the installation settings you have chosen appears next. As soon as
    you click Accept, a warning appears telling you that YaST2 has all the information
    needed and can now start the installation. Following that, you click to start
    the actual installation, the hard disk starts being prepared. You can watch the
    status of the installation for each of the CDs through progress bars. At the end
    of this phase, basic installation finishes with the following automatic:


    # NOTE


    Before selecting Accept, you should change the partition proposal to leave unpartitioned
    space. Without this, you will run into difficulties adding space to the swap partition
    in exercise 14. The basic steps for this are


    +   1. From the Installation Settings page, select Partitioning.

    2. On the next page, select Create custom partition setup.

    3. Select Custom partitioning—for experts.

    4. Highlight the entry in the partition table for the Linux native partition;
    then select Delete > Yes.

    5. Highlight the entry in the partition table for the storage device (/dev/hda
    or /dev/sda/); select Create.

    6. Select Primary Partition; then select OK.'
