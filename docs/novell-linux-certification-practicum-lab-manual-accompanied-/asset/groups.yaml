    # Novell Linux 认证实践实验室手册


    第二章“SUSE LINUX Enterprise Server 9”提供了 30 个使用 SUSE LINUX Enterprise Server (SLES)
    的中等难度练习题。这些案例的难度大致等同于你在 CLP 考试中会遇到的实验操作。


    第三章“高级 SUSE LINUX Enterprise Server 9”提供了 30 个使用 SLES 的更高难度练习题。这些案例的难度大致等同于你在
    CLE 考试中会遇到的实验操作。


    第四章“练习解答”将详细介绍前三章中的每个练习题，并展示如何解决它们。需要说明的是，在 Linux 中，有多种方法可以得出相同的解决方案，而每个实验室只展示了一种。如果你不知道如何解决练习题，请阅读解决方案；如果你已经知道了，也请阅读，因为这可能会引发你从不同的角度思考困境的答案，这种思维方式在未来的某时刻将大有用场。


    # 本书不是什么


    本书并非设计用于程序员的指南或管理员的桌面伴侣——Novell Press 在这些领域提供了许多优秀的书籍。本书也不是不是关于网络理论、协议或架构的参考书。本书完全关注于测试你在没有分步指导的情况下处理所提供案例的能力。如果你在任何特定领域较薄弱，请参考第四章的解答，并考虑购买参考书、管理员桌面伴侣、Novell
    学习指南或类似的书籍来帮助你填补短板。


    # 关于实验考试的几句话


    你购买这本书的很大可能因为是为了帮助为 CLP 和 CLE 测试的实验考试做准备。很容易看出实验考试是要求你执行某些操作，而不仅仅是选择正确的多选题答案，但有时很难准确理解这种考试到底是什么样的。实验的开始是向你提供一份“业务需求文档（BRD）”。你始终假装自己是某虚拟公司的顾问或管理员（BRD
    会说明是哪家公司），并且你面前有一项任务。


    # 引言


    这份 BRD 的根本目的是提供你所需的所有信息，以满足任务要求并公司的预期。请注意对“满足（meet）”一词的强调。这是一个必须记住的非常重要的概念：你在考试期间的角色是恰恰完成满足
    BRD 所需的操作，而不做其他。在现实世界中，如果你被请来解决 DNS 问题，而恰意发现打印配置完全错误，在没有要求任何人为客户修复打印问题的情况下，你绝不会花费计费时间去修复打印问题。在这里必须采取这种态度——你的工作是配置你应该配置的系统，而不是在其他领域进行任意更改。


    在实际考试中，你永远不需要演示书中存在的每个目标中的每个任务来满足要求，但在参加实际测试之前，你不知道哪些目标将用于满足你所获得的 BRD。根据一个非常粗略的法则，你可能不需要执行此处涵盖的
    75% 的任务就能成功完成实验。你必须学习所有领域，以做好充分准备。


    关于“实际培训”的常见问题可以在 http://practicum.novell.com/modules.php?op=modload&name=FAQ&file=index
    查看，该技术的首页可以在 http://practicum.novell.com/index.php 。


    # 你需要什么？


    为了完成书中的练习，你需要一个测试环境，可以在其中进行实验而不会对任何生产机器造成损坏。对于 NLD 客户端，标准安装的要求如下：


    - Pentium II+ 266MHz 或任何 AMD64 或 Intel EM64T 处理器

    - 128MB RAM

    - 800MB 空闲驱动空间

    - 800x600 或更高分辨率


    对于某些练习，你还需要打印机以及访问另一台 NLD 9 工作站的权限。


    虽然前面的数字是最低要求，以下要求对于一个可以舒适工作的环境来说更为现实：


    - Pentium 3 1GHz 处理器

    - 512MB RAM

    - 20GB 空闲硬盘空间

    - 1024x768 或更高分辨率

    - 100Mb/sec 以太网卡


    对于 SLES 机器，你需要一台符合 SUSE LINUX Enterprise Server 9 标准要求的机器、一台客户端工作站（NLD 的效果最好）以及互联网连接。为舒适的
    NLD 环境提供的要求将适用：


    - Pentium 3 1GHz 处理器

    - 512MB RAM

    - 20GB 空闲硬盘空间

    - 1024x768 或更高分辨率

    - 100Mb/sec 以太网卡


    # Novell Linux Desktop 9


    接下来的 15 个练习允许你使用 Novell Linux Desktop 9 测试你的知识。完成这些实验室不需要其他操作系统或软件。分步解答将出现在第四章“练习解答”中。


    > 注意：为了完成练习 7，你还需要访问打印机的权限。同样，为了完成练习 12，你需要访问另一台 NLD 9 工作站的权限。


    表 1.1 列出了本节涵盖的任务以及每个任务可以在哪个练习中找到。


    | 任务 | 练习 |

    |---|---|

    | 添加用户 | 2 |

    | 安装期间添加用户 | 1 |

    | 归档文件 | 10 |

    | 修改全局设置 | 2 |

    | 更改 Shell | 2 |

    | 密码加密 | 1, 2 |

    | 修改用户账户设置 | 2 |

    | 修改你的密码 | 5 |

    | 检查日志 | 15 |

    | 压缩文件 | 10 |

    | 使用 Roller | 10 |


    | 任务 | 练习 |

    |---|---|

    | 配置桌面 | 2 |

    | 创建 GNOME 快捷方式 | 3 |

    | 配置本地打印机 | 8 |

    | 创建备份 | 13 |

    | 创建救援软盘 | 13 |

    | 创建 KDE 快捷方式 | 8 |

    | 创建启动器 | 4 |

    | 禁用远程管理 | 15 |

    | 辅助功能选项 | 3 |

    | 安装软件包 | 3 |

    | 安装另一个桌面 | 3 |

    | 安装 SMB 打印机 | 7 |

    | 安装 Novell Linux Desktop 9 | 1 |

    | 杀死进程 | 11 |

    | 将 KDE 设置为默认界面 | 1 |

    | 桌面共享 | 12 |

    | 调整分区大小 | 14 |

    | 搜索文件 | 6 |

    | 更新操作系统 | 9 |

    | 使用终端窗口 | 5 |


    # 练习 1：Armstrong 的 Body


    你是公司小企业部门的顾问。你被派往 Middletown 的 Armstrong’s Body，那里有一台刚到达的办公室新工作站。他们要求将该机器上的操作系统替换为最新版本的
    Novell Linux Desktop 9。


    现场的一位管理员用过 KDE 界面并喜欢它，因此它应该是默认前端。管理员密码需要设置为 N7Press，加密应设置为 MD5。除了 root 用户外，添加一个具有以下信息的用户：


    | 全名 | Ken Armstrong |

    |---|---|

    | 用户登录名 | kenarm |

    | 密码 | ntSc9 |

    | 接收系统邮件 | 是 |

    | 自动登录 | 否 |

    | 附加组 | 音频 (audio),cdrom 和 拨号 (dialout) |


    使用的身份验证文件应该是 /etc/passwd 和 /etc/shadow。你需要确保他们拥有互联网连接，并且 kenarm 用户可以无问题地登录，然后你的任务就完成了。


    # 注意事项


