    \ is preselected, so choose KDE.\n\nA summary of the installation settings you\
    \ have chosen appears next. As soon as you click Accept, a warning appears telling\
    \ you that YaST2 has all the information needed and can now start the installation.\
    \ Following that, you click to start the actual installation, the hard disk starts\
    \ being prepared. You can watch the status of the installation for each of the\
    \ CDs through progress bars. At the end of this phase, basic installation finishes\
    \ with the following automatic:\n\n# NOTE\n\nBefore selecting Accept, you should\
    \ change the partition proposal to leave unpartitioned space. Without this, you\
    \ will run into difficulties adding space to the swap partition in exercise 14.\
    \ The basic steps for this are:\n\n1. From the Installation Settings page, select\
    \ Partitioning.\n2. On the next page, select Create custom partition setup.\n\
    3. Select Custom partitioning—for experts.\n4. Highlight the entry in the partition\
    \ table for the Linux native partition; then select Delete > Yes.\n5. Highlight\
    \ the entry in the partition table for the storage device (/dev/hda or /dev/sda/);\
    \ select Create.\n6. Select Primary Partition; then select OK.\n7. Change the\
