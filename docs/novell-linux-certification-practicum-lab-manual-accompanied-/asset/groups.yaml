    ## 练习 25：J & C 财务


    要使用 YaST 应用补丁和更新，请遵循以下步骤：


    - 1. 以 root 身份登录并启动 YaST。

    - 2. 选择“软件”（Software），然后选择“在线更新”（Online Update）。屏幕将如图 4.29 所示所示。注意：如果点击“配置全自动更新...”（Configure
    Fully Automatic Update...），你可以配置一个 cron 条目来自动保持系统为最新。


    图 4.29

    在线更新的选项。


    ![](img/eaba1d2fab748d377682b64e8e54182b_134_0.png)


    - 3. 点击“下一步”（Next）。将检索有关新更新的信息。

    - 4. 如果提示用户名和密码，请输入这些值，然后选择安装任何发现的更新。


    你也可以通过选择“软件”和“补丁 CD 更新”（Software and Patch CD Update）从 CD 安装补丁。若要在服务器上设置设置，选择“软件”和“系统更新”（System
    Update）。选择“更改和更新选项”（Change and Update Options）。值与图 4.30 所示类似。


    最后，通过选择“软件”然后选择“YOU 服务器配置”（YOU Server Configuration）可以配置 YOU 服务器。这将打开一个与图 4.31
    所示类似的对话框。


    ## 第 4 章：练习题解答


    图 4.30

    更新选项。


    ![](img/eaba1d2fab748d377682b64e8e54182b_135_0.png)


    图 4.31

    YOU 配置选项。


    ![](img/eaba1d2fab748d377682b64e8e54182b_135_1.png)


    ## 练习 26：Karen 的计算机


    你可以按照以下步骤列出曾经登录过服务器的用户的列表：


    - 1. 以 root 身份登录。

    - 2. 从 KDE 启动器（kicker）点击显示器图标打开终端 shell。可选地，从菜单中选择“系统”（System）、“终端”（Terminal），然后选择“Konsole”。

    - 3. 输入 `lastlog | grep -vi "never"` 将显示内容缩小为仅包含有效登录行。


    这将显示每个账户的最近登录情况，而不是每次登录记录。列出用户名，并使用每个用户名配合 `last` 命令来查找自 wtmp 文件启动以来的每次登录。例如，要查看用户
    edulaney 的条目，命令为 `last edulaney`。


    ## 练习 27：Lifetime 解决方案


    要检查服务器的主机名，请遵循以下步骤：


    - 1. 以 root 身份登录。

    - 2. 从 KDE 启动器（kicker）点击显示器图标打开终端 shell。可选地，从菜单中选择“系统”（System）、“终端”（Terminal），然后选择“Konsole”。

    - 3. 输入 `hostname`。


    “频繁的命令行网络命令”应该包括：ping、traceroute、ifconfig、ifstatus 和 netstat。使用 route 和 arp 分别检查路由表和地址解析结果。


    ## 练习 28：Muncie 管理


    ip 工具用于查看和更改当前网络配置。使用命令 `ip address show`可以查看当前配置。生成的显示类似于图 4.32 所示。


    该命令的输出与 ifconfig 相同。将 `show` 替换为 `add`，可以添加设置，而使用 `del` 则允许你删除现有设置。


    ## 第 4 章：练习题解答


    图 4.32

    ip address show 命令的输出。


    ![](img/eaba1d2fab748d377682b64e8e54182b_137_0.png)


    命令 `ip link show` 将显示每个太网设备的硬件地址。要处理路由表，请使用以下命令：


    - `ip route show`——查看当前路由表

    - `ip route add`——添加路由

    - `ip route add default`——添加默认路由

    - `ip route delete`——删除路由


    ## 练习 29：New Start, Inc.


    要运行 YOU，请遵循以下步骤：


    - 1. 以 root 身份登录并启动 YaST。

    - 2. 选择“软件”然后选择“在线更新”。

    - 3. 点击“下一步”。将检索有关新更新的信息。

    - 4. 如果提示用户名和密码，请输入这些值；然后选择安装任何发现的更新。


    ## 练习 30：Oak Pictures


    Oak Pictures 需要在适当时间运行脚本的 cron 文件条目如下：


    ```

    0,5,15,20,25,30,35,40,55,55 * * * *

    0,15,30,45 * * *

    0,15,25,35,55 * * *

    0,25,35,55 * * *

    ```

    （注：cron 块的 OCR 是根据标准 cron 模式和上下文进行的碎片化/重建）


    要设置权限使新创建的文件为 664，请遵循以下步骤：


    - 1. 以 root 身份登录并启动 YaST。

    - 2. 选择“软件”然后选择“在线更新”。

    ...


    要将默认 umask 更改为 022，请遵循以下步骤：


    - 1. 以 root 身份登录。

    - 2. 从 KDE 启动器（kicker）点击显示器图标打开终端 shell。可选地，从菜单中选择“系统”（System）、“终端”（Terminal），然后选择“Konsole”。

    - 3. 输入 `umask 022`。


    要将默认运行级别（runlevel）更改为 4，请遵循以下步骤：


    - 1. 以 root 身份登录。

    - 2. 从 KDE 启动器（kicker）点击显示器图标打开终端 shell。可选地，从菜单中选择“系统”（System）、“终端”（Terminal），然后选择“Konsole”。

    - 3. 输入 `cd /etc`。

    - 4. 编辑 `init` 文件并将 `id:5:initdefault:` 改为 `4`。

    - 5. 保存文件并退出。


    要配置给定的静态 IP 地址，请遵循以下步骤：


    - 1. 以 root 身份登录并启动 YaST。

    - 2. 选择“网络设备”（Network Devices）和“网卡”（Network Card）。

    - 3. 点击“更改”（Change）和“编辑”（Edit）。网络地址设置如图 4.33 所示。


    图 4.33

    网卡的设置。


    ![](img/eaba1d2fab748d377682b64e8e54182b_140_0.png)


    - 4. 点击“静态地址设置”（Static Address Setup）按钮并输入 IP 地址 192.168.10.7 和子网掩码 255.255.255.0。

    - 5. 点击“路由”（Routing）按钮并添加默认网关地址 192.168.10.101。点击 OK。

    - 6. 点击“下一步”（Next）和“完成”（Finish）。

    - 7. 点击“关闭”（Close）并退出 YaST。


    要在 /var/log/messages 末尾添加（追加）一条目目说明系统在此日期进行了配置，请在终端会话中运行以下命令：`logger -p local3.info
    "system configuration drastically changed"`。


    '
