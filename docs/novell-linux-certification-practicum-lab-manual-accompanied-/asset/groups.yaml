    7. 现在你可以根据发生的情况使用/配置该工具。\n\n图 4.62\n配置 Samba。\n\n![](img/eaba1d2fab748d377682b64e8e54182b_177_0.png)\n\
    \n## 练习 63：路易斯安钓鱼\n\n要在服务器上启用 ntop，请按照以下步骤操作：\n\n1. 以 root 登录并启动 YaST。\n2. 选择“软件”（Software），然后选择“安装和删除软件”。搜索\
    \ ntop 并选择安装软件包。\n3. 根据提示更换 CD，完成后退出 YaST。\n4. 弹出一条如图 4.63 所示的消息，指示需要安装软件包。点击“继续”（Continue）。\n\
    5. 保存文件，然后输入 `rccups restart` 来重启守护进程。\n6. 点击 KDE Kicker 底部的 N 菜单并选择“互联网”（Internet）、“管理”（Administration）。这将弹出图\
    \ 4.59 所示的 Nmap 前端。现在你可以根据需要使用/配置该工具。\n7. 在第一行，选择“全选”。\n8. 在第二行，选择“全选”。\n9. 在第三行，选择“完成”（Finish）。\n\
    10. 现在你可以根据发生的情况使用/配置该工具。\n\n图 4.63\n配置 ntop。\n\n![](img/eaba1d2fab748d377682b64e8e54182b_178_0.png)\n\
    \n## 练习 64：缅州精神院有限公司\n\n你为客户生成的列表应包含以下内容：\n\n优点：\n- 可以防止不受欢迎的流量进入网络。\n- 也可以监控出站流量。\n\
    \n缺点：\n- 可能会阻止合法数据的接收。\n- 只能保护其所针对的层。例如，包过滤防火墙仍然容易受到层级攻击。这可能导致虚假的安全感。\n\n## 练习\
