    \ using symmetric encryption include\n\n- Data Encryption Standard (DES)\n- Advanced\
    \ Encryption Standard (AES)\n- Blowfish\n\nWith asymmetric encryption, two keys—not\
    \ one—are used. The keys are mathematical opposites of each and are known as the\
    \ public key and the private key. Because they are opposites, data encoded with\
    \ the public key can only be decoded with the private key and data encoded with\
    \ the private key can only be decoded with the public key. Cryptographic standards\
    \ using asymmetric encryption include\n\n- Rivest Shamir Adleman (RSA)\n- Digital\
    \ Signature Algorithm (DSA)\n\nDigital signatures use asymmetric encryption to\
    \ create an encrypted hash of the message being sent. The hash is sent to the\
    \ recipient with the message, and the recipient generates a hash of their own.\
    \ The public key is used to decrypt the hash with the message to see if the two\
    \ hashes are the same—if they are, it can be reasoned that the message is original\
    \ and was not altered. The only weakness in the system lies in verifying that\
    \ the public key is legitimate, which is the role that certificate authorities\
    \ (CAs) fulfill.\n\nEncryption schemes express security in terms of the number\
    \ of bits used to encode the data. While older encryption schemes rely on 40 to\
