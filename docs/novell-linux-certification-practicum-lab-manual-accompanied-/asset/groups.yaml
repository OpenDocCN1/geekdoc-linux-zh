    practice to use only root when necessary, so you should have at least one other
    user account to log in as by default. I suggest that an "admin" user be created
    at this point.


    +   13. SuSEconfig now starts and writes the system configuration. The amount
    of time this takes will vary greatly from system to system based on the parameters
    you''ve entered.

