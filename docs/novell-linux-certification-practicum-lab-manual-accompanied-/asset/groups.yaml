    + 6. Packages are installed next, and you will need to insert various CDs as prompted.
    Your goal is usually to complete the installation as quickly as possible, so you
    can go back and add any packages at a later point in time.


    + 7. You are prompted to give a password for the root user (and enter twice for
    verification). The password can consist of digits, spaces, letters, and the standard
    punctuation characters. It is recommended that it contain at least five characters—and
    at a minimum—the case is mixed between upper and lower. If you enter more than
    eight characters, you will be prompted to truncate or change it.


    + 8. Network configuration occurs next, and a scan is automatically done to detect
    network cards, DSL connections, ISDN adapters, and modems. A summary screen shows
    the values found, as well as the current settings for Proxy (default is disabled)
    and VNC Remote Administration (default is disabled). You can change any of these
    values, go, back, or put the network settings into you effect by clicking Next.


    + 9. After the network configuration is written/saved, the Internet connection
    is tested. This operation is purely optional, and you can choose to skip the test
    if you like. A successful test, however, gives you the option to run the YaST
    Online Update (YOU) and check for the latest release notes and updates. If updates
    are available, you can choose to download and install them, or skip the update
    (which can be done at any later time from YaST2).


    + 10. Service configuration comes next, allowing you to configure such items as
    Certificate Management and OpenLDAP Server.


    + 11. The user authentication method must be chosen. Three choices are available:

    * NIS—To use if you are using a NIS server

    * LDAP—To use if you are using an LDAP server for user data

    * Local (/etc/passwd)—The choice to select if you are storing passwords in /etc/passwd
    and /etc/shadow


    Accept the default user authentication method (LDAP).


    + 12. You can add new local users at this point. The same password rules for creating
    the root user apply creating passwords for the local users as well.


    # NOTE


    Not only can you add a new user at this point, but also you should. It is good
    practice to use only root when necessary, so you should have at least one other
    user account to log in as by default. I suggest that an "admin" user be created
    at this point.


    + 13. SuSEconfig now starts and writes the system configuration. The amount of
    time this takes will vary greatly from system to system based on the parameters
    you''ve entered.

    14. Release notes are displayed covering the following areas:

    - General—Information that everybody should read

    - Update—Covers changes not appearing in the Admin Guide

    - Installation—More information about the installation

    - Updates and Features—Covers technical changes and enhancements

    - Providing Feedback—Tells how to contact SUSE, and so on.


    + 15. Hardware configuration of the graphics card, printers, and sound cards follows,
    and then the installation is complete. You must click the command button labeled
    Finish, and then you can log in to the system. (It is a good idea to do so as
    the admin user added after step 12.)


    Upon successful completion of these steps, a login screen will appear prompting
    for a username and password. After you give those entries, a Welcome menu thanks
    for installing SUSE LINUX Enterprise Server 9 and provides a list of URLs relating
    to this and other Novell products.


    If there are problems with the installation, you should trace down the first occurrence
    which appeared and look for a solution to it before continuing on. The best tool
    to use for any problem within this category is common sense.


    For example, if the system will not read the media, verify that the CD set you
    have is good by checking if another system can read it. If the installation hangs,
    verify that your system meets the minimum system requirements and that power saving
    features are not affecting your ability to do the installation.


    Remember that the first menu to appear offers a plethora of choices besides Installation.
    Choosing one of the other choices can help you continue on with the installation
    and repair any system files.


