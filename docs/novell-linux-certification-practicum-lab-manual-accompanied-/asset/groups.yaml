    \n7. 要使用 Snort 工具，打开终端会话并输入 snort。这将生成一条错误信息，列出该工具可以使用的所有选项。\n\n## 练习 59：印第安纳爬虫\n\
    \n要启用服务器上 cupsd 进程的广播，请按照以下步骤操作：\n\n1. 以 root 登录并启动终端会话。\n2. 编辑 `/etc/cups/cupsd.conf`，删除行\
    \ `BrowseAddress @LOCAL` 前的注释字符 (#)。\n3. 保存文件，然后输入 `rccups restart` 来重启守护进程。\n\
    \n要添加一个名为“cupsadmin”的 CUPS 管理用户，请按照以下步骤操作：\n\n1. 以 root 登录并启动终端会话。\n2. 输入 `lp1ppasswd\
    \ -g sys -a cupsadmin`。\n3. 在提示时为账户输入密码。在提示时再次输入该账户密码。\n\n## 练习 60：爱荷华养老院\n\n\
    你为客户生成的列表应包含以下内容：\n\n- 服务器上的所有更新和补丁都是最新的吗？**你**是否配置了自动更新？\n- 是否使用了无线网络？采用了哪种加密类型？\n\
    - 工作站上的所有更新和补丁都是最新的吗？\n- 布线间是否安全？\n- 服务器上是否有足够的文档（管理员日志簿等）？\n- 多少人知道 root 密码？多久更改一次？\n\
    - 服务器在物理上是否被放置在机房或其他区域内并确保安全？\n- 哪些文件设置了 SUID 和 SGID 权限？\n- 服务器上运行的所有服务都是确实需要的吗？\n\
    - 多久审计一次日志文件？由谁来执行审计？\n- 是否分配了专人通过 cert.org 或其他网站关注安全威胁/进展？\n- 由谁来添加新用户和用户组？多久操作一次？\n\
    - 启动菜单是否受密码保护？\n- 用户是否了解有关密码最佳实践的安全策略？\n- 当前安装的软件包是新的且已证明是安全的吗？软件包更新时会通知哪些管理员？\n\
    - 是否允许远程管理？如何进行监控？\n- 密码使用了什么种级别的加密？\n- 是否使用了证书？如果是，对证书应用了什么种级别的加密？\n\n## 练习 61：堪萨斯兽医有限公司\n\
    \nSLES 9 默认安装了 OpenSLP。如果没有安装，你可以通过 YaST 安装，选择“软件”，然后选择“安装和删除软件”。搜索 opensplp 并选择安装软件包。\n\
    \n要验证 openslp 是否定位了我们预期的服务，请按照以下步骤操作：\n\n1. 以 root 登录并启动 YaST。\n2. 选择“网络服务”（Network\
    \ Services），然后选择“SLP 浏览器”（SLP Browser）。\n3. 如图 4.60 所示，选择左列中的服务类型。\n4. 点击“完成”（Finish）并退出\
    \ YaST。\n5. 打开 浏览器并将地址设置为 `slp/`，如图 4.61 所示。\n\n现在你可以浏览由 slpd 进程注册的服务。\n\n图 4.60\n\
