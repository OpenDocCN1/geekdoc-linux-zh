    \ * * 1 ABC\n10 15 2 * * BCD\n30 18 14 3 * CDE\n30 18 15 9 * CDE\n0,10,20,30,40,50\
    \ 6-18 * * DEF\n5 12-16 * * 1-5 EFG\n```\n\nThe only tricky entry is here the\
    \ one for CDE. Because the two dates to be run have nothing in common, the easiest\
    \ method is to create two separate entries for it.\n\n## Exercise 71: Montana\
    \ Expeditions\n\nThree actions need to take place to meet the needs of this customer.\
    \ The first is to change the default permissions on all newly created files to\
    \ 664. Subtracting from 666 leaves a value of 002. To meet this requirement, edit\
    \ the /etc/profile file and change the default umask 022 to umask 002.\n\nTo change\
    \ the permissions on all files currently in /tmp to 751, the easiest solution\
    \ is to open a terminal session, change to /tmp directory, and use the command\
    \ chmod 751. Last, to move the passwords from /etc/shadow file to /etc/passwd\
    \ file, within the terminal session, use the command cp (the opposite of which\
    \ is mv).\n\n## Exercise 72: North Carolina Swimmers\n\nTo install YaST and make\
    \ it available for the administrator when logs in, follow these steps:\n\n1. Start\
    \ YaST as the root user.\n2. Choose Software and then Install Software.\n3. Type\
    \ gnome in the Search field and click Search. The results will resemble Figure\
    \ 4.67.\n4. Check gnome-session, gnome-applets, gnome-common, gnome-desktop, gnome-libs,\
    \ gnome-panel, gnome-print, gnome-terminal, and gnome-utils packages and click\
    \ Accept. Continue to accept any changes prompted.\n5. Log out, and end the session.\
    \ At the login prompt, the user can now click Menu followed by Session. This will\
    \ bring that desktop (and make it default for subsequent logins), as shown in\
    \ Figure 4.68.\n\nFIGURE 4.67 Search for gnome-related packages.\n\n![](img/eaba1d2fab748d377682b64e8e54182b_186_0.png)\n\
    \nFIGURE 4.68 The GNOME desktop is now installed and available.\n\n![](img/eaba1d2fab748d377682b64e8e54182b_186_1.png)\n\
    \n## Exercise 73: North Dakota Plastics\n\nThe easiest method for accomplishing\
    \ this task is to right-click on KDE desktop and choose Desktop. This brings up\
    \ the dialog shown in Figure 4.69.\n\nFigure 4.69 Configure the desktop.\n\n![](img/eaba1d2fab748d377682b64e8e54182b_187_0.png)\n\
    \nClick on Screen Saver in the left column and set the configuration as shown\
    \ in Figure 4.70.\n\nFIGURE 4.70 Configure the screensaver to meet the customer's\
    \ needs.\n\n![](img/eaba1d2fab748d377682b64e8e54182b_188_0.png)\n\n## Exercise\
    \ 74: Nebraska Genealogy\n\nThe following script will meet the requirements that\
    \ were given:\n\n```\n#Choices.sh\nclear\nPS3=\"Please make your selection from\
    \ the following: \" \nselect item in ABC BCD CDE Quit\ndo\ncase $item in\nABC)\
    \ echo \"Program ABC will now executed\" ;;\nBCD) echo \"Program BCD will now\
    \ executed\" ;;\nCDE) echo \"Program CDE will now executed\" ;;\nDEF) echo \"\
    Program DEF will now executed\" ;;\nQuit) break ;;\n*) echo \"You must enter a\
    \ number between 1 and 5.\" ;;\nesac\ndone\n```\n\n## Exercise 75: Nevada Design\n\
    \nAny number of scripts can be written to perform this simple function. Because\
    \ you only want a number, it is important to parse out any information other than\
    \ that. The first example follows:\n\n```\n#Example1.sh\ngrep -c \".*\" /etc/passwd\n\
    ```\n\nAnother example would be:\n\n```\n#Example2.sh\nwc -l /etc/passwd | cut\
    \ -d\" \" -f1\n```\n"
  mdcn: "\n\n## 练习 66：马萨诸塞州垃圾邮件发送者\n\nSLES 9 提供的加密选项可以分为两类：对称加密和非对称加密。在对称加密中，用于加密数据的相同密钥也用于解密：发送者和接收者都需要相同的密钥。使用对称加密的加密标准包括：\n\
    \n- 数据加密标准 (DES)\n- 高级加密标准 (AES)\n- Blowfish\n\n在非对称加密中，使用的是两个密钥而不是一个。这两个密钥在数学上是相反的，被称为公钥和私钥。由于它们是相反的，用公钥编码的数据只能用私钥解码，而用私钥编码的数据只能用公钥解码。使用非对称加密的加密标准包括：\n\
    \n- 利斯特-沙米-阿德曼 (RSA)\n- 数字签名算法 (DSA)\n\n数字签名使用非对称加密来对发送的消息创建加密哈希。哈希值随消息一起发送给接收者，接收者也会生成自己的哈希值。使用公钥解密消息中的哈希，以检查两个哈希值是否相同——如果相同，则推断消息是原始且未被修改过的。该系统唯一的弱点在于验证公钥的合法性，这正是证书机构\
    \ (CA) 的职责。\n\n加密方案根据编码数据所需的位数来表示安全性。虽然旧的加密方案依赖 40 到 56 位来编码数据，但今天 128 位或更多位更为常见。\n\
    \n## 练习 67：密歇根州种植户\n\n要将所有 DNS 查询限制在您的网络网段上的主机，请按照以下步骤操作：\n\n1. 登录服务器并启动 YaST，如果提示，请以\
    \ root 身份验证。\n2. 选择网络服务 (Network Services)，然后选择 DNS 服务器 (DNS Server)。\n\n注意\n\n\
    如果 DNS 已配置，您可以直接跳到第 6 步。\n\n3. 在转发器设置 (Forwarder Settings) 中，将“手动设置转发器”(Set Forwarders\
    \ Manually) 保持默认，配置其他字段并点击“下一步”。\n4. 在 DNS 区域 (DNS Zones) 对话框中，点击“添加”(Add) 添加区域，然后点击“下一步”。\n\
    5. 在完成向导 (Finish Wizard) 对话框中，点击“启动 DNS 服务器专家配置...”(Start DNS Server Expert Configuration...)。\n\
    6. 在左侧框架中，选择“基本选项”(Basic Options)。这将显示图 4.65 所示的内容。\n\n图 4.65\n\nDNS 服务器的基本选项。\n\
    \n![](img/eaba1d2fab748d377682b64e8e54182b_182_0.png)\n\n7. 在选项 (Option) 下拉列表中选择\
    \ `allow-query`。\n8. 在值 (Value) 字段中输入 `{allowedhosts; } 并点击“添加”。\n9. 点击“完成”。\n\
    \n第 4 章：练习解答\n\n提示\n\n您可以通过尝试解析 `lab1dsttechnical` 主机来轻松地测试此配置。如果一切运行正常，你不应该能解析它。\n\
    \n## 练习 68：明尼苏达州河管理局\n\n要配置 DHCP 守护进程向 DNS 服务器发送动态更新，请按照以下步骤操作：\n\n1. 以 root 身份登录并启动\
    \ YaST。\n2. 选择网络服务 (Network Services)，然后选择 DHCP 服务器 (DHCP Server)。\n3. 进入全局设置\
    \ (Global Settings)，确保没有勾选 LDAP 支持 (LDAP Support)。创建 TSIG 密钥。\n4. 如图 4.66 所示，填写动态\
    \ DHCP (Dynamic DHCP) 的值。\n\n图 4.66\n配置动态 DHCP。\n\n![](img/eaba1d2fab748d377682b64e8e54182b_183_0.png)\n\
    \n## 练习 69：密西西比州糖尿病小组\n\n有很多编写 Shell 脚本可以完成此任务。由于需要提示用户输入文件名，因此应该使用 `read` 命令。为了验证文件是否存在，应该使用\
    \ `test` 命令（可以通过其别名调用）。可以使用 `-r` 选项来验证该文件是否可读。最后，如果文件不存在，可以使用 `touch` 工具创建一个大小为零的文件。\n\
    \n根据这些参数，以下 Shell 脚本将胜任此角色：\n\n```\n#MDG.sh\necho \"Enter filename:\"\nread filename\n\
    if [ -r $filename ]; then\necho \"File exists\"\nelse\ntouch $filename\necho \"\
    File created\"\nfi\n```\n\n提示\n\n在 `filename` 和 `]; 之间需要有一个空格，否则你会收到第 3 行缺少 `]\
    \ ` 的错误消息。\n\n## 练习 70：密苏里州刀剪刀有限公司\n\n密苏里州刀剪刀公司需要在适当时间运行这些脚本的 cron 文件条目如下：\n\n\
    ```\n0 6 * * 1 ABC\n10 15 2 * * BCD\n30 18 14 3 * CDE\n30 18 15 9 * CDE\n0,10,20,30,40,50\
    \ 6-18 * * DEF\n5 12-16 * * 1-5 EFG\n```\n\n唯一棘手的条目是这里 CDE 的那一个。由于两个运行的日期没有共同点，最简单的方法是为其创建两个独立的条目。\n\
    \n## 练习 71：蒙大拿州探险队\n\n为了满足客户的需求，需要执行三个操作。第一个是将所有新创建文件的默认权限更改 664。从 666 减去得到值 002。为了满足这一要求，编辑\
    \ `/etc/profile` 文件并将默认的 `umask 022` 更改为 `umask 002`。\n\n要将 /tmp 中当前所有文件的权限更改\
    \ 751，简单的解决方案是打开终端，使用 `chmod 751`。最后，使用 `mv` 命令将 /etc/shadow 移动到 /tmp。\n\n## 练习\
    \ 72：北卡罗来纳州游泳者\n\n要安装 YaST 并可用，请遵循以下步骤：\n\n1. 以 root 身份启动 YaST。\n2. 选择软件，然后选择“安装软件”。\n\
    3. 在搜索框中输入 `gnome` 并点击搜索。结果如图 4.67。\n4. 勾选 `gnome-session`、`gnome-applets`、`gnome-common`、`gnome-desktop`、`gnome-libs`、`gnome-panel`、`gnome-print`\
    \ 和 `gnome-utils` 软件包并点击接受。接受任何提示。\n5. 注销并结束会话。在登录提示处，用户现在可以点击菜单并选择会话。这将显示图 4.68\
    \ 所示的内容，并使其成为后续登录的默认设置。\n\n图 4.67 搜索 gnome 相关的软件包。\n\n![](img/eaba1d2fab748d377682b64e8e54182b_186_0.png)\n\
    \n图 4.68 GNOME 桌面已安装并可用。\n\n![](img/eaba1d2fab748d377682b64e8e54182b_186_1.png)\n\
    \n## 练习 73：北达科他州塑料\n\n完成此任务简单的方法是右键点击 KDE 桌面并选择“桌面”。这将弹出图 4.69 所示的对话框。\n\n图 4.69\
    \ 配置桌面。\n\n![](img/eaba1d2fab748d377682b64e8e54182b_187_0.png)\n\n点击左列的“屏幕保护”，并如图\
    \ 4.70 所示进行配置。\n\n图 4.70 配置屏幕保护以满足客户需求。\n\n![](img/eaba1d2fab748d377682b64e8e54182b_188_0.png)\n\
    \n## 练习 74：内布拉斯加州谱系\n\n以下脚本将满足给定的要求：\n\n```\n#Choices.sh\nclear\nPS3=\"Please\
    \ make your selection from the following: \" \nselect item in ABC BCD CDE Quit\n\
    do\ncase $item in\nABC) echo \"Program ABC will now executed\" ;;\nBCD) echo \"\
    Program BCD will now executed\" ;;\nCDE) echo \"Program CDE will now executed\"\
    \ ;;\nDEF) echo \"Program DEF will now executed\" ;;\nQuit) break ;;\n*) echo\
    \ \"You must enter a number between 1 and 5.\" ;;\nesac\ndone\n```\n\n## 练习 75：内华达州设计\n\
    \n可以编写任意脚本来执行这个简单的功能。由于你只需要数字，因此过滤掉数字以外的其他信息非常重要。第一个示例如下：\n\n```\n#Example1.sh\n\
    grep -c \".*\" /etc/passwd\n```\n\n另一个示例是：\n\n```\n#Example2.sh\nwc -l /etc/passwd\
    \ | cut -d\" \" -f1\n```\n\n"
