    # Exercise 56: Hawaii PineTrees, Inc.


    The application-level gateway will most likely implement Squid, so the procedure
    for doing so will be the same as given in exercise 53. The most relevant part
    of this exercise is creating the list of the questions and concerns that should
    be asked when you reach the site. When generating that list, you should verify
    that you understand the following:


    +   - What are internal users allowed access to outside of the network? What services
    must be made available to them?

    - What services should be made available to anonymous users?

    - What services should be made available to trusted users?

    - What protocols should be allowed to pass from the internal network to the external
    network?

    - What protocols should be allowed to enter the internal network from the outside?


    # Exercise 57: Idaho Rock Quarries


    The list you create for this customer should include the following:


    +   - Are all updates and patches current on the server? Is YOU automatically
    configured?

    - Are all updates and patches current on the workstations?

    - Is there sufficient documentation on the server (administrator’s logbook and
    so on)?

    - Is the server physically secured within a server room or other area?

    - Are all services running on the server required?

    - Is someone assigned to keep abreast of security threats/developments through
    cert.org or another site?

    - Is the boot menu protected?

    - Are users aware of security policies regarding best practices for passwords?

    - Are currently installed packages up-to-date and known to be secure?

    - Is remote administration allowed?

    - What level of encryption is used for passwords?

    - Are certificates used, and, if so, what level of encryption is applied to them?'
