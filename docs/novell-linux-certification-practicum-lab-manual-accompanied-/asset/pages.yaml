    relevant pages. You should also keep abreast of issues and problems posted at
    http://www.cert.org and http://www.linuxsecurity.com.


    Information on any Linux command can be found through a number of utilities inherent
    in Linux:


    +   - The man tool offers pages on each utility. For example, to find information
    about the setfacl, the command would be man setfacl.

    - Most utilities use the built-in option of --help to offer information. From
    the command line, you can type setfacl --help to see a quick list of available
    options.

    - The info utility can be used to view the man pages, as well—for example, info
    setfacl.

    - The whatis utility can show if there is more than one set of documentation on
    the system for the utility: whatis setfacl.

    - The which utility will list all the information it can find about locations
    associated with a file—for example, where setfacl.

    - The apropos utility uses the whatis database to find values and returns the
    short summary information: apropos setfacl.'
