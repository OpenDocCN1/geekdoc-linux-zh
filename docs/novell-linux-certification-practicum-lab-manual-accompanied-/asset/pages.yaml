    To perform a normal installation, you choose Installation from the menu, and press
    Enter. You must then walk through the interfaces presented in YaST2, the installation
    and system administration program. Although there can be deviations, based on
    your exact configuration, the following are the major screens—that you must walk
    through:


    +   1. Choose a language—You can click Accept to move on or Abort to cancel the
    installation.


    +   2. Choose the installation mode—You can choose to perform a new installation(the
    default), update an existing system, repair an installed system, boot an installed
    system, or abort. For a normal installation, choose New Installation.


    +   3. At this point, the system will provide for devices and show you a list
    of what it has identified. It will identify the system, keyboard, mouse, and so
    on, as well as show you the recommended installation settings based on the chosen
    mode. Recommendations and settings fall within these categories:


    +   - System

    - Software

    - Mode

    - Booting

    - Keyboard layout

    - Time zone

    - Mouse

    - Language

    - Partitioning

    - Default runlevel


    +   4. Three command buttons are available: Change—to alter any of the settings,
    Abort—to cancel, and Accept—to continue on. Choose Accept; then click Continue,
    and a warning message appears stating that YaST2 has obtained all the information
    required to install SU LINUX. The installation will be carried out according to
    the settings made in the previous dialogs. To commit the installation and choices
    made, click the Yes, Install button.


    +   5. The hard disk is then prepared/partitioned. This will take a few minutes,
    and you might need to make other changes manually later if you are implementing
    RAID or LVM devices. At a minimum, two partitions are created: root and swap.


    145'
