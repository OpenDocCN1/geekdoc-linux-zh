    \ 环境中的网络设置至关重要的命令行工具和配置文件。\n\n## 管理网络接口\n\nLinux 支持多种网络接口，包括以太网、Wi-Fi、环回（loopback）和虚拟接口。每个接口都有特定的用途，并可以使用不同的工具和命令进行管理。\n\
    \n### 以太网接口\n\n以太网接口是有线网络中最常用的网络接口类型。在 Linux 中，这些接口通常命名为 `eth0`、`eth1` 等，尽管较新的系统可能会使用可预测的网络接口名称如\
    \ `enp0s3`。\n\n要查看系统上所有的网络接口，可以使用以下命令：\n\n```\nip link show\n```\n\n此命令将显示所有网络接口列表、它们的状态（`UP`\
    \ 或 `DOWN`）以及其他相关信息。\n\n要启用或禁用以太网接口，可以使用以下命令：\n\n```bash\n# 启用接口\nsudo ip link\
    \ set eth0 up\n# 禁用接口\nsudo ip link set eth0 down\n```\n\n### Wi-Fi 接口\n\nWi-Fi\
    \ 用于无线网络连接。这些接口通常命名为 `wlan0`、`wlan1` 等。管理 Wi-Fi 接口通常涉及使用 `iwconfig` 或 `nmcli`（NetworkManager\
    \ 命令行界面）等额外工具。\n\n查看 Wi-Fi 接口信息：\n\n```\niwconfig\n```\n\n使用 NetworkManager 连接到\
    \ Wi-Fi 网络：\n\n```\nnmcli device wifi connect <SSID> password <password>\n```\n\
    \n### 环回接口\n\n环回接口通常命名为 `lo`，是一种特殊的网络接口，允许系统与自身通信。它始终存在，并且通常配置有 IP 地址 `127.0.0.1`。\n\
    \n查看环回接口：\n\n```\nip addr show lo\n```\n\n### 虚拟接口\n\n虚拟接口是基于软件的网络接口，可以为各种目的创建，例如网络虚拟化或\
    \ VPN 连接。虚拟接口的常见类型包括：\n\n1. 桥接接口（Bridge）\n2. VLAN 接口\n3. 隧道接口（Tunnel）（例如用于 VPN）\n\
    \n创建桥接接口：\n\n```bash\nsudo ip link add name br0 type bridge\nsudo ip link set\
    \ dev br0 up\n```\n\n创建 VLAN 接口：\n\n```bash\nsudo ip link add link eth0 name eth0.100\
    \ type vlan id 100\nsudo ip link set dev eth0.100 up\n```\n\n## 设置静态和动态 IP 地址\n\
    \nLinux 系统可以配置为静态 IP 地址或由 DHCP（动态主机配置协议）分配的动态 IP 地址。我们将使用命令行工具探索这两种方法。\n\n###\
    \ 静态 IP 地址配置\n\n要设置静态 IP 地址，可以使用 `ip` 命令或直接编辑网络配置文件。\n\n使用 `ip` 命令：\n\n```bash\n\
    sudo ip addr add 192.168.1.100/24 dev eth0\n```\n\n此命令为 `eth0` 接口分配 IP 地址 `192.168.1.100`\
    \ 以及子网掩码 `255.255.255.0`。\n\n要使配置在重启后仍然有效，您需要编辑网络配置文件。这些文件的具体位置和格式取决于您的 Linux\
    \ 发行版。例如，在基于 Ubuntu 和 Debian 的系统上，您可能会编辑 `/etc/network/interfaces`：\n\n```text\n\
    auto eth0\niface eth0 inet static\n    address 192.168.1.100\n    netmask 255.255.255.0\n\
    \    gateway 192.168.1.1\n```\n\n在基于 Red Hat 的系统上，您可能会编辑 `/etc/sysconfig/network-scripts/ifcfg-eth0`：\n\
    \n```text\nDEVICE=eth0\nBOOTPROTO=static\nIPADDR=192.168.1.100\nNETMASK=255.255.255.0\n\
    GATEWAY=192.168.1.1\nONBOOT=yes\n```\n\n### 动态 IP 地址配置 (DHCP)\n\n要配置接口使用 DHCP，可以使用\
    \ `dhclient` 命令：\n\n```bash\nsudo dhclient eth0\n```\n\n此命令将为 `eth0` 接口向 DHCP\
    \ 服务器请求 IP 地址。\n\n要使 DHCP 配置持久化，可以编辑网络配置文件：\n\n对于基于 Ubuntu 和 Debian 的系统（/etc/network/interfaces）：\n\
    \n```text\nauto eth0\niface eth0 inet dhcp\n```\n\n对于基于 Red Hat 的系统（/etc/sysconfig/network-scripts/ifcfg-eth0）：\n\
    ```text\nDEVICE=eth0\nBOOTPROTO=dhcp\nONBOOT=yes\n```\n\n## 管理路由和网关\n\n路由是在不同网络之间引导网络流量的过程。在\
    \ Linux 中，您可以使用 `ip` 和 `route` 命令管理路由和网关。\n\n### 查看路由\n\n要查看当前路由表：\n\n```bash\n\
    ip route show\n```\n\n或者\n\n```\nroute -n\n```\n\n### 添加路由\n\n要添加新路由：\n\n```bash\n\
    sudo ip route add 192.168.2.0/24 via 192.168.1.1\n```\n\n此命令添加了通过 `192.168.1.1`\
    \ 网关到达 `192.168.2.0/24` 网络的路由。\n\n### 删除路由\n\n要删除路由：\n\n```bash\nsudo ip route\
    \ del 192.168.2.0/24\n```\n\n### 设置默认网关\n\n要设置默认网关：\n\n```bash\nsudo ip route\
    \ add default via 192.168.1.1\n```\n\n### 持久路由配置\n\n要使路由配置在重启后仍然有效，可以将它们添加到网络配置文件中或创建一个单独的路由配置文件。\n\
    \n对于基于 Ubuntu 和 Debian 的系统，您可以将路由添加到 `/etc/network/interfaces`：\n\n```text\nauto\
    \ eth0\niface eth0 inet static\n    address 192.168.1.100\n    netmask 255.255.255.0\n\
    \    gateway 192.168.1.1\n    up route add -net 192.168.2.0 netmask 255.255.255.0\
    \ gw 192.168.1.1\n```\n\n对于基于 Red Hat 的系统，您可以创建一个类似 `/etc/sysconfig/network-scripts/route-eth0`\
    \ 的文件：\n\n```text\n192.168.2.0/24 via 192.168.1.1\n```\n\n"
