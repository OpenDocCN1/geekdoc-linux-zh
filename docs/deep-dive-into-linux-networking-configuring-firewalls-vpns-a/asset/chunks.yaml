- fmt: "\n```bash\nsudo ./easyrsa gen-dh\n```\n\n### 3. Create the server configuration\
    \ file (`/etc/openvpn/server.conf`):\n\n```text\nport 1194\nproto udp\ndev tun\n\
    ca ca.crt\ncert server.crt\nkey server.key\ndh dh.pem\nserver 10.8.0.0 255.255.255.0\n\
    ifconfig-pool-persist ipp.txt\npush \"route 192.168.1.0 255.255.255.0\"\nkeepalive\
    \ 10 120\ncipher AES-256-CBC\npersist-key\npersist-tun\nstatus openvpn-status.log\n\
    verb 3\n```\n\n### 4. Create the client configuration file (`/etc/openvpn/client.conf`):\n\
    \n```text\nclient\ndev tun\nproto udp\nremote server_ip 1194\nresolv-retry infinite\n\
    nobind\npersist-key\npersist-tun\nca ca.crt\ncert client.crt\nkey client.key\n\
    cipher AES-256-CBC\nverb 3\n```\n\n### 5. Start the OpenVPN service on both the\
    \ server and client:\n\n```bash\nsudo systemctl start openvpn@server\nsudo systemctl\
    \ start openvpn@client\n```\n\n### Configuring Routing for Site-to-Site VPNs\n\
    \nTo ensure proper routing between the connected networks, you'll need to configure\
    \ routing on both the server and client sides:\n\n1. Enable IP forwarding on both\
    \ machines:\n   ```bash\n   echo 1 | sudo tee /proc/sys/net/ipv4/ip_forward\n\
    \   ```\n\n2. Add `iptables` rules to allow traffic forwarding:\n   ```bash\n\
    \   sudo iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE\n\
    \   ```\n\n3. Configure static routes on both sides to direct traffic through\
    \ the VPN:\n   - On the server: `sudo ip route add 192.168.2.0/24 via 10.8.0.2`\n\
    \   - On the client: `sudo ip route add 192.168.1.0/24 via 10.8.0.1`\n\n### Monitoring\
    \ and Troubleshooting Site-to-Site VPNs\n\nTo ensure your site-to-site VPN is\
    \ functioning correctly:\n\n1. Check the OpenVPN status:\n   ```bash\n   sudo\
    \ systemctl status openvpn@server\n   ```\n\n2. Monitor the OpenVPN log file:\n\
    \   ```bash\n   tail -f /var/log/openvpn.log\n   ```\n\n3. Test connectivity between\
    \ the networks:\n   - From the server network to the client network: `ping 192.168.2.1`\n\
    \   - From the client network to the server network: `ping 192.168.1.1`\n\n4.\
    \ Use `tcpdump` to analyze VPN traffic:\n   ```bash\n   sudo tcpdump -i tun0 -n\n\
    \   ```\n\n## VPN Split Tunneling: Managing Network Traffic Through the VPN\n\n\
    Split tunneling is a VPN configuration that allows a user to access different\
    \ networks simultaneously, some through the VPN and others directly through the\
    \ local internet connection. This can improve performance for certain applications\
    \ and reduce bandwidth usage on the VPN.\n\n### Benefits of Split Tunneling\n\n\
    1. Reduced bandwidth usage on the VPN connection\n2. Improved performance for\
    \ local network resources\n3. Better control over which traffic goes through the\
    \ VPN\n4. Reduced latency for non-VPN traffic\n\n### Implementing Split Tunneling\
    \ with OpenVPN\n\nTo implement split tunneling with `OpenVPN`, you'll need to\
    \ modify the server and client configurations:\n\n1. Modify the server configuration\
    \ (`/etc/openvpn/server.conf`):\n   ```text\n   # Add these lines to enable split\
    \ tunneling\n   push \"route 10.0.0.0 255.0.0.0\"\n   push \"route 172.16.0.0\
    \ 255.240.0.0\"\n   push \"route 192.168.0.0 255.255.0.0\"\n   push \"redirect-gateway\
    \ def1 bypass-dhcp\"\n   ```\n\n2. Modify the client configuration (`/etc/openvpn/client.conf`):\n\
    \   ```text\n   # Add these lines to enable split tunneling\n   route 10.0.0.0\
    \ 255.0.0.0\n   route 172.16.0.0 255.240.0.0\n   route 192.168.0.0 255.255.0.0\n\
    \   route-nopull\n   ```\n\n3. Restart the OpenVPN service on both the server\
    \ and client:\n   ```bash\n   sudo systemctl restart openvpn@server\n   sudo systemctl\
    \ restart openvpn@client\n   ```\n\n### Configuring Routing Tables for Split Tunneling\n\
    \nTo ensure proper routing with split tunneling, you may need to configure policy-based\
    \ routing:\n\n1. Create a new routing table:\n   ```bash\n   echo \"200 vpn\"\
    \ | sudo tee -a /etc/iproute2/rt_tables\n   ```\n\n2. Add routes to the new table:\n\
    \   ```bash\n   sudo ip route add default via 10.8.0.1 table vpn\n   sudo ip route\
    \ add 10.0.0.0/8 via 10.8.0.1 table vpn\n   sudo ip route add 172.16.0.0/12 via\
    \ 10.8.0.1 table vpn\n   sudo ip route add 192.168.0.0/16 via 10.8.0.1 table vpn\n\
    \   ```\n\n3. Set up policy routing rules:\n   ```bash\n   sudo ip rule add from\
    \ 10.8.0.0/24 table vpn\n   ```\n   *(Wait, the input text for step 3 was cut\
    \ off, I have formatted the provided portion based on the pattern).*\n"
