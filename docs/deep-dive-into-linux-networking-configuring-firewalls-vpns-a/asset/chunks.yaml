    \  ethernets:\n    eth0:\n      addresses:\n        - 192.168.1.100/24\n     \
    \ gateway4: 192.168.1.1\n      nameservers:\n        addresses: [8.8.8.8, 8.8.4.4]\n\
    ```\n\n### 8. /etc/network/interfaces.d/*\n\nOn some systems, individual interface\
