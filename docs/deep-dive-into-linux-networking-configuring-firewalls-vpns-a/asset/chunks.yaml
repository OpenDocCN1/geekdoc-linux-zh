    \ \"$LOG_FILE\" > \"$CHECKSUM_FILE\"\n# Verify checksum\nmd5sum -c \"$CHECKSUM_FILE\"\
    \n```\n\n7.  **Log Normalization**: Normalize log data from different devices\
    \ to a common format for easier analysis and correlation.\nExample of a simple\
    \ `Python` script to normalize `iptables` and `UFW` logs:\n\n```python\nimport\
    \ re\nimport csv\ndef normalize_iptables(log_line):\n    pattern = r'(\\w{3}\\\
    s\\d{1,2}\\s\\d{2}:\\d{2}:\\d{2}).SRC=(\\d+\\.\\d+\\.\\d+\\.\\d+).DST=(\\d+\\\
    .\\d+\\.\\d+\\.\\d+).PROTO=(\\w+).SPT=(\\d+).DPT=(\\d+)'\n    match = re.search(pattern,\
    \ log_line)\n    if match:\n        return {'timestamp': match.group(1), 'src_ip':\
    \ match.group(2), 'dst_ip': match.group(3), 'protocol': match.group(4), 'src_port':\
    \ match.group(5), 'dst_port': match.group(6)}\n    return None\n\ndef normalize_ufw(log_line):\n\
    \    pattern = r'(\\w{3}\\s\\d{1,2}\\s\\d{2}:\\d{2}:\\d{2}).SRC=(\\d+\\.\\d+\\\
    .\\d+\\.\\d+).DST=(\\d+\\.\\d+\\.\\d+\\.\\d+).PROTO=(\\w+).SPT=(\\d+).DPT=(\\\
    d+)'\n    match = re.search(pattern, log_line)\n    if match:\n        return\
    \ {'timestamp': match.group(1), 'src_ip': match.group(2), 'dst_ip': match.group(3),\
    \ 'protocol': match.group(4), 'src_port': match.group(5), 'dst_port': match.group(6)}\n\
    \    return None\n\ndef normalize_logs(input_file, output_file):\n    with open(input_file,\
    \ 'r') as infile, open(output_file, 'w', newline='') as outfile:\n        writer\
    \ = csv.DictWriter(outfile, fieldnames=['timestamp', 'src_ip', 'dst_ip', 'protocol',\
    \ 'src_port', 'dst_port'])\n        writer.writeheader()\n        for line in\
    \ infile:\n            normalized = normalize_iptables(line) or normalize_ufw(line)\n\
    \            if normalized:\n                writer.writerow(normalized)\n\nnormalize_logs('firewall.log',\
    \ 'normalized_firewall.csv')\n```\n\n8.  **Contextual Enrichment**: Enrich `firewall\
    \ log data` with additional context, such as geolocation information or threat\
    \ intelligence feeds.\nExample of enriching log data with geolocation information\
    \ using the `geoip2` `Python` library:\n\n```python\nimport csv\nimport geoip2.database\n\
    def enrich_with_geolocation(input_file, output_file, geoip_db):\n    reader =\
    \ geoip2.database.Reader(geoip_db)\n    with open(input_file, 'r') as infile,\
    \ open(output_file, 'w', newline='') as outfile:\n        reader = csv.DictReader(infile)\n\
    \        fieldnames = reader.fieldnames + ['src_country', 'dst_country']\n   \
    \     writer = csv.DictWriter(outfile, fieldnames=fieldnames)\n        writer.writeheader()\n\
    \        for row in reader:\n            try:\n                src_geo = reader.country(row['src_ip'])\n\
    \                dst_geo = reader.country(row['dst_ip'])\n                row['src_country']\
