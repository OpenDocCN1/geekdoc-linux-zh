    # 第 4 章：使用 iptables 和 nftables 配置防火墙


    ## Linux 防火墙概念简介


    ### 什么是防火墙？


    防火墙是网络安全的关键组件，作为受信内部网络与不可信外部网络（如互联网）之间的屏障。它的主要目的是根据预定义的安全规则监控、过滤和控制入站及出的网络流量。防火墙可以通过硬件设备、软件应用程序或两者的结合来实现。


    在 Linux 系统中，防火墙通常实现为利用内核的 `netfilter` 框架的软件解决方案。该框架提供了数据包过滤、网络地址转换 (`NAT`) 以及其他数据包修改（packet
    mangling）功能。


    ### 防火墙如何工作


    防火墙通过检查网络数据包并与一组预定义的规则进行比较来工作。这些规则决定数据包应该是允许通过、拦截还是以特定方式处理。决策过程通常涉及分析数据包的各种属性，例如：


    1. 源和目的 IP 地址

    2. 源和目的端口

    3. 协议类型（例如 `TCP`、`UDP`、`ICMP`）

    4. 数据包状态（针对状态检测防火墙）

    5. 应用层数据（针对应用层防火墙）


    根据功能和其运行的网络层，防火墙可以分为几类：


    1. **数据包过滤防火墙**：它们运行在 OSI 模型的网络层（第 3 层）和传输层（第 4 层）。它们检查数据包头并根据预定义的规则做出决策。

    2. **状态检测防火墙**：这些防火墙跟踪网络连接的状态，并根据流量的上下文做出决策。

    3. **应用层防火墙**：它们运行在 OSI 模型的应用层（第 7 层），可以检查数据包的内容，根据特定应用程序的数据做出决策。

    4. **下一代防火墙 (NGFW)**：它们将传统的防火墙功能与额外的功能相结合，如入侵防御、深度数据包检测和应用感知。


    在 Linux 系统中，最常用的防火墙实现是 `iptables` 及其继任者 `nftables`。这两个工具都利用了 `netfilter` 框架来提供强大且灵活的防火墙功能。


    ## iptables 和 nftables 概述


    ### iptables


    `iptables` 是一个用户空间实用程序，允许系统管理员配置 Linux 内核防火墙的 IP 数据包过滤规则。多年来它一直是 Linux 系统的标准防火墙工具，并且仍被广泛使用。


    #### iptables 的优点：


    1. **成熟且稳定**：`iptables` 已经存在多年，拥有庞大的用户群，因此大量的文档和社区支持。

    2. **强大且灵活**：它为数据包过滤、`NAT` 和数据包修改提供了广泛的选项。

    3. **兼容性**：许多现有的脚本、工具和应用程序设计用于配合 `iptables` 使用。

    4. **性能**：通常认为 `iptables` 在大多数用场景下具有良好的性能。


    #### iptables 的缺点：


    1. **语法复杂**：命令行语法可能难以学习且容易出错，特别是对于复杂的规则集。

    2. **可扩展性有限**：随着规则集的增大，性能可能会下降，管理也会变得更具挑战性。

    3. **缺乏原子规则集更新**：更改多条规则需要单独的命令，这可能在更新期间导致临时的不一致。

    4. **对新协议的支持有限**：添加对新协议的支持通常需要内核补丁。


    ### nftables


    `nftables` 是 `iptables` 的继任者，旨在克服其某些局限性。它提供了一个全新的数据包分类框架，旨在取代现有的 `{ip,ip6,arp,eb}tables`
    体系。


    #### nftables 的优点：


    1. **语法更简单且一致**：`nftables` 使用单一命令 (`nft`) 进行所有操作，更容易学习和使用。

    2. **性能提升**：`nftables` 设计得更高效，特别是在处理大型规则集时。

    3. **更好的可扩展性**：它比 `iptables` 更有效地处理更大、更复杂的规则集。

    4. **原子规则集更新**：多条规则可以在单个原子操作中更新，确保更新期间的一致性。

    5. **功能增强**：`nftables` 提供了集合（sets）、映射（maps）和连接（concatenations）等新功能，可以简化复杂的配置。

    6. **更易扩展**：添加对新协议的支持更加简单，且不需要内核补丁。


    #### nftables 的缺点：


    1. **相对较新**：作为一项新技术，与 `iptables` 相比，它的资源可能较少，社区支持较少。

    2. **学习曲线**：熟悉 `iptables` 的用户可能需要花时间学习新的语法和概念。

    3. **兼容性**：某些为 `iptables` 设计的现有工具和脚本可能无法直接与 `nftables` 工作，尽管提供了翻译工具。


    ## 使用 iptables 构建基础防火墙规则


    `iptables` 将防火墙规则组织在表（tables）中的链（chains）。中最常用的表是 `filter` 表，它包含了三个内置链：


    1. `INPUT`：用于指向本地套接字的数据包

    2. `OUTPUT`：用于本地生成的数据包

    3. `FORWARD`：用于正在路由的数据包


    ### Input, Output 和 Forward 链


    要开始使用 `iptables` 构建基础防火墙规则，理解这些链以及它们如何与网络流量的关系至关重要：


    1. **INPUT 链**：该链处理进入系统的数据包。该链中的规则决定允许还是拦截入站连接。

    2. **OUTPUT 链**：该链处理离开系统的数据包。这里的规则控制由本地系统发起的出站连接。

    3. **FORWARD 链**：该链用于通过系统路由的数据包（即从一个网络接口进入从另一个接口离开）。这对于作为路由器或 NAT 设备的系统特别重要。


    ### 基础 iptables 语法


    向 `iptables` 添加规则的通用语法为：


    ```

    iptables -A CHAIN -i INTERFACE -p PROTOCOL -s SOURCE -d DESTINATION --dport DEST_PORT
    -j ACTION

    ```


    其中：


    * `-A CHAIN`：将规则添加到指定的链（`INPUT`、`OUTPUT` 或 `FORWARD`）

    * `-i INTERFACE`：指定网络接口（例如 `eth0`）


    '
- fmt: '

    - Options

    - `-p PROTOCOL`: Specifies the protocol (e.g., tcp, udp, icmp)

    - `-s SOURCE`: Specifies the source IP address or network

    - `-d DESTINATION`: Specifies the destination IP address or network

    - `--dport DEST_PORT`: Specifies the destination port

    - `-j ACTION`: Specifies the action to take (e.g., ACCEPT, DROP, REJECT)


    ### Allowing/Blocking Traffic by Ports, Protocols, and IP Addresses


    Let''s look at some examples of basic `iptables` rules:


    1. Allow incoming SSH connections:

    ```

    iptables -A INPUT -p tcp --dport 22 -j ACCEPT

    ```

    This rule allows incoming TCP traffic on port 22 (the default SSH port).


    2. Block incoming traffic from a specific IP address:

    ```

    iptables -A INPUT -s 192.168.1.100 -j DROP

    ```

    This rule drops all incoming traffic from the IP address 192.168.1.100.


    3. Allow outgoing HTTP and HTTPS traffic:

    ```

    iptables -A OUTPUT -p tcp --dport 80 -j ACCEPT

    iptables -A OUTPUT -p tcp --dport 443 -j ACCEPT

    ```

    These rules allow outgoing TCP traffic on ports 80 (HTTP) and 443 (HTTPS).


    4. Allow incoming traffic on a specific interface:

    ```

    iptables -A INPUT -i eth0 -j ACCEPT

    ```

    This rule allows all incoming traffic on the `eth0` interface.


    5. Block all incoming traffic except for established connections:

    ```

    iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT

    iptables -A INPUT -j DROP

    ```

    These rules allow incoming traffic for established connections and drop all other
    incoming traffic.


    ### Default Policies


    It''s important to set default policies for each chain. These policies determine
    what happens to packets that don''t match any specific rules. A common secure
    configuration is to set the default policy to `DROP` for the `INPUT` and `FORWARD`
    chains, and `ACCEPT` for the `OUTPUT` chain:

    ```

    iptables -P INPUT DROP

    iptables -P FORWARD DROP

    iptables -P OUTPUT ACCEPT

    ```

    This configuration ensures that all incoming and forwarded traffic is dropped
    by default, while allowing all outgoing traffic.


    ### Advanced iptables Rules: NAT, DNAT, SNAT, Port Forwarding


    `iptables` provides powerful capabilities for Network Address Translation (NAT)
    and port forwarding. These features are particularly useful for systems acting
    as routers or gateways.


    ### NAT (Network Address Translation)


    NAT is a method of remapping one IP address space into another by modifying network
    address information in the IP header of packets while they are in transit across
    a traffic routing device. There are two main types of NAT:


    1. Source NAT (SNAT): Changes the source address of packets

    2. Destination NAT (DNAT): Changes the destination address of packets


    ### SNAT (Source NAT)


    SNAT is commonly used to allow multiple devices on a private network to share
    a single public IP address for outgoing internet connections. Here''s an example
    of how to set up SNAT:

    ```

    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```

    This rule performs SNAT on all outgoing packets through the `eth0` interface,
    using the IP address of `eth0` as the source address.


    ### DNAT (Destination NAT)


    DNAT is often used for port forwarding, allowing incoming connections to a public
    IP address to be redirected to a specific internal IP address. Here''s an example
    of DNAT:

    ```

    iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 80 -j DNAT --to-destination
    192.168.1.100:8080

    ```

    This rule redirects incoming HTTP traffic (port 80) to an internal server at `192.168.1.100`
    on port 8080.


    ### Port Forwarding


    Port forwarding is a specific application of DNAT that redirects a communication
    request from one address and port number combination to another. Here''s an example
    of port forwarding:

    ```

    iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 2222 -j DNAT --to-destination
    192.168.1.100:22

    ```

    This rule forwards incoming connections on port 2222 to port 22 (SSH) on the internal
    server at `192.168.1.100`.


    ### Combining SNAT and DNAT


    In many cases, you''ll need to combine SNAT and DNAT to create a complete NAT
    solution. For example, to set up a gateway that forwards incoming connections
    and allows internal devices to access the internet:

    ```bash

    # Allow forwarding

    echo 1 > /proc/sys/net/ipv4/ip_forward


    # SNAT for outgoing connections

    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE


    # DNAT for incoming connections (example: forward SSH)

    iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 22 -j DNAT --to-destination
    192.168.1.100:22


    # Allow forwarded traffic

    iptables -A FORWARD -i eth0 -o eth1 -m state --state RELATED,ESTABLISHED -j ACCEPT

    iptables -A FORWARD -i eth1 -o eth0 -j ACCEPT

    ```

    These rules set up a basic NAT gateway that allows internal devices to access
    the internet and forwards incoming SSH connections to an internal server.


    ### Transitioning to nftables: Understanding Syntax and Creating Firewall Rules


    `nftables` is designed to replace `iptables` with a more modern and flexible framework.
    While the underlying concepts are similar, the syntax and organization of rules
    are different.


    ### nftables Concepts


    1. Tables: Containers for chains

    2. Chains: Containers for rules

    3. Rules: Statements that match packets and perform actions


    Unlike `iptables`, which has predefined tables and chains, `nftables` allows you
    to create custom tables and chains with arbitrary names.


    ### Basic nftables Syntax


    The general syntax for adding a rule in `nftables` is:

    `nft add rule FAMILY TABLE CHAIN MATCHES ACTION`


    Where:

    - `FAMILY`: Specifies the address family (e.g., `ip`, `ip6`, `inet`)

    - `TABLE`: Specifies the table name

    - `CHAIN`: Specifies the chain name

    - `MATCHES`: Specifies the matching criteria

    - `ACTION`: Specifies the action to take


    ### Creating a Basic Firewall with nftables


    Let''s create a basic firewall configuration using `nftables`:


    1. Create a new table and chain:

    ```bash

    nft add table inet filter

    nft add chain inet filter input { type filter hook input priority 0 \; policy
    drop \; }

    nft add chain inet filter output { type filter hook output priority 0 \; policy
    accept \; }

    nft add chain inet filter forward { type filter hook forward priority 0 \; policy
    drop \; }

    ```

    This creates a table named "filter" and three chains (input, output, and forward)
    with default policies similar to our `iptables` example.


    2. Allow incoming SSH connections:

    ```bash

    nft add rule inet filter input tcp dport 22 accept

    ```


    3. Allow established and related connections:

    ```bash

    nft add rule inet filter input ct state established,related accept

    ```


    4. Allow loopback traffic:

    ```bash

    nft add rule inet filter input iif lo accept

    ```


    5. Allow outgoing DNS queries:

    ```bash

    nft add rule inet filter output udp dport 53 accept

    nft add rule inet filter output tcp dport 53 accept

    ```


    ### Advanced nftables Features


    `nftables` offers several advanced features that can simplify complex configurations:


    1. Sets: Allow you to group multiple elements together:

    ```bash

    nft add set inet filter allowed_ports { type inet_service \; elements = { 22,
    80, 443 } \; }

    nft add rule inet filter input tcp dport @allowed_ports accept

    ```


    2. Maps: Allow you to create key-value pairs:

    ```bash

    nft add map inet filter port_map { type inet_service : inet_service \; elements
    = { 80 : 8080, 443 : 8443 } \; }

    nft add rule inet filter input tcp dport map @port_map dnat

    ```


    3. Concatenations: Allow you to match multiple header fields simultaneously:

    ```bash

    nft add rule inet filter input ip saddr . tcp dport { 192.168.1.0/24 . 22, 10.0.0.0/8
    . 80 } accept

    ```


    ### Translating iptables Rules to nftables


    To help with the transition from `iptables` to `nftables`, you can use the `iptables-translate`
    command to convert `iptables` rules to their `nftables` equivalents. For example:

    ```bash

    iptables-translate -A INPUT -p tcp --dport 22 -j ACCEPT

    ```

    This will output the equivalent `nftables` command:

    ```bash

    nft add rule ip filter INPUT tcp dport 22 counter accept

    ```


    ### Persistent Firewall Configurations Using System Services


    To ensure that your firewall rules persist across system reboots, you need to
    configure them as a system service. The method for doing this varies depending
    on your Linux distribution and whether you''re using `iptables` or `nftables`.


    ### Persistent iptables Configuration

