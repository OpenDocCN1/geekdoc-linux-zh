    sudo ip link set veth0 up


    sudo ip netns exec myns ip link set veth1 up


    8.  Test connectivity between namespaces:


    sudo ip netns exec myns ping 10.0.0.1


    ### Use Cases for Network Namespaces


    1.  Container Networking: Network namespaces are the foundation for container
    networking solutions like Docker and Kubernetes.


    2.  Network Function Virtualization (NFV): Create isolated network environments
    for testing and developing network functions.


    3.  Multi-tenant Systems: Isolate network resources for different tenants on a
    shared system.


    4.  Network Troubleshooting: Create isolated environments to reproduce and debug
    network issues.


    5.  Security Testing: Set up isolated network environments for security testing
