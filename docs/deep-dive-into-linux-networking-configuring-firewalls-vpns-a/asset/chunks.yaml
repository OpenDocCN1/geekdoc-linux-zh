    ### Network namespaces


    Network namespaces allow you to create isolated network environments within a
    single Linux system. Note that on many modern Linux distributions, `/etc/resolv.conf`
    is managed dynamically by system services like `NetworkManager` or `systemd-resolved`.
    In these cases, you should configure DNS settings through the appropriate network
    configuration tools or service configuration files.


    ### Traffic Control (tc)


    Traffic Control (`tc`) allows you to classify, filter, and schedule traffic. It
    is often used for bandwidth limiting and traffic shaping.


    To set a bandwidth limit on `eth0`:


    ```

    tc qdisc add dev eth0 root tbf rate 1mbit burst 32k latency 400ms

    ```


    This command sets a rate of 1mbit.


    ```

    tc qdisc add dev eth0 root tbf rate 1mbit burst 32k latency 400ms

    ```


    ### Network Monitoring Tools


    In addition to the tools already discussed, there are several network monitoring
    tools:


    1. `netstat`: Displays network connections.

    2. `ss`: A more modern replacement for `netstat`.

    3. `iptraf`: A console-based monitor.

    4. `nmap`: A powerful scanning and discovery tool.

    5. `tcpdump`: A command-line packet analyzer.


    ### Security Considerations in Network Configuration


    When configuring networks in Linux, it''s crucial to consider security implications:


    1. Use strong authentication methods (e.g., SSH keys instead of passwords).

    2. Implement a firewall using `iptables` or `nftables`.

    3. Keep your system and network services up date with the latest security patches.

    4. Use encrypted protocols (e.g., HTTPS, SFTP instead of unencrypted counterparts).

    5. Implement network segmentation to isolate critical systems.


    Example of basic `iptables` configuration:


    ```

    # Flush existing rules

    sudo iptables -F


    # Set default policies

    sudo iptables -P INPUT DROP

    sudo iptables -P FORWARD DROP

    sudo iptables -P OUTPUT ACCEPT


    # Allow established connections

    sudo iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT


    # Allow SSH

    sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT


    # Allow HTTP and HTTPS

    sudo iptables -A INPUT -p tcp --dport 80 -j ACCEPT

    sudo iptables -A INPUT -p tcp --dport 443 -j ACCEPT


    # Allow loopback traffic

    sudo iptables -A INPUT -i lo -j ACCEPT

    ```


    This configuration sets up a basic firewall that allows SSH, HTTP, and HTTPS traffic
    while blocking all other incoming connections.


    ## Troubleshooting Common Issues


    Even with proper configuration, network issues can still arise. Here are some
    common problems and troubleshooting steps:


    1. **No network connectivity**:

    - Check physical connections

    - Verify interface status (`ip link show`)

    - Check IP address configuration (`ip addr show`)

    - Test connectivity to the default gateway (`ping`)

    - Verify DNS resolution (`dig` or `nslookup`)


    2. **Slow network performance**:

    - Check for network congestion (`iftop` or `nethogs`)

    - Verify there are no bandwidth limits set (`tc -s qdisc show`)

    - Test network speed (`iperf3`)

    - Check for packet loss (`ping` with large packet sizes)


    3. **Intermittent connectivity**:

    - Check for network interface errors (`ethtool -S eth0`)

    - Monitor network stability over time (`mtr`)

    - Check system logs for network-related errors


    4. **Unable to reach specific services**:

    - Verify the service is running (`ss` or `netstat`)

    - Check firewall rules (`iptables -L`)

    - Test connectivity to the service''s port (`telnet` or `nc`)


    5. **DNS resolution issues**:

    - Check `/etc/resolv.conf` for correct DNS server configuration

    - Verify DNS server connectivity (`ping`)

    - Test DNS resolution with different servers (`dig @8.8.8.8 example.com`)


