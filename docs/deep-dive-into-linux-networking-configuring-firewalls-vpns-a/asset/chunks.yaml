    1.  Isolation: Each network namespace has its own set of network interfaces, routing
    tables, firewall rules, and network stack.


    2.  Virtual Networking: Network namespaces can be connected using virtual Ethernet
    (veth) pairs, creating virtual network topologies.


    3.  Process Association: Processes can be associated with specific network namespaces,
    allowing fine-grained control over network access.


    4.  Resource Management: Network namespaces provide a way to manage and isolate
    network resources effectively.


