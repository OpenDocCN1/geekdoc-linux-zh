    *   Check Network Interface Errors


    ethtool -S eth0


    #### 8\. System Logs


    *   Check System Logs for Network Issues


    journalctl -u NetworkManager


    tail -f /var/log/syslog


    #### 9\. SSL/TLS Issues


    *   Test SSL/TLS Connection


    openssl s_client -connect example.com:443


    *   Check SSL Certificate


    openssl x509 -in certificate.crt -text -noout


    #### 10\. General Troubleshooting Commands


    *   Network Configuration Overview


    nmcli dev status


    nmcli con show


    *   System Resource Usage


    top


    htop


    *   File Descriptors and Sockets


    lsof -i


    *   ARP Cache


    arp -e


    ip neigh show


    #### 11\. Advanced Troubleshooting


    *   Capture Network Traffic


    tcpdump -i eth0 -w capture.pcap


    *   Analyze Network Protocols


    nmap -sV [ip]


    *   Check for Network Bottlenecks


    iperf3 -c [server_ip]


    *   Monitor System Calls


    strace -e trace=network [command]


    #### 12\. Security Checks


    *   Check for Listening Services


    netstat -tulpn


    ss -tulpn


    *   View Active Connections


    netstat -anp


    ss -anp


    *   Check for Unauthorized DHCP Servers


    dhcping -s [suspected_dhcp_server_ip]


    #### 13\. Performance Tuning


    *   Adjust Network Kernel Parameters


    sysctl -a | grep net


    echo "net.ipv4.tcp_fin_timeout = 30" >> /etc/sysctl.conf


    sysctl -p


    *   Optimize Network Interface


    ethtool -G eth0 rx 4096 tx 4096


    #### 14\. Wireless Networking


    *   List Wireless Interfaces


    iwconfig


    *   Scan for Wireless Networks


    iwlist wlan0 scan


    *   Check Wireless Connection Quality


    iwspy wlan0


    #### 15\. IPv6 Troubleshooting


    *   Check IPv6 Address


    ip -6 addr show


    *   Test IPv6 Connectivity


    ping6 ipv6.google.com


    *   Trace IPv6 Route


    traceroute6 ipv6.google.com


    Remember, these commands and their output may vary slightly depending on the Linux
    distribution and installed packages. Always consult the man pages or documentation
    specific to your system for the most accurate information.


    This troubleshooting cheat sheet covers a wide range of network-related issues
    and provides quick reference commands for diagnosing and resolving common problems.
    It''s an invaluable resource for system administrators and network professionals
    working with Linux systems.'
