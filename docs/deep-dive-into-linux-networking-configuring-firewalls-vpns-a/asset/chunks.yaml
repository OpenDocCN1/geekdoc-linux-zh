    ./easyrsa sign-req client client1

    ```


    ### Setting up a VPN Server


    1. Create the server configuration file:


    ```bash

    sudo cp /usr/share/doc/openvpn/examples/sample-config-files/server.conf /etc/openvpn/server.conf

    ```


    2. Edit the server configuration file (`/etc/openvpn/server.conf`) to match your
    setup:


    ```

    port 1194

    proto udp

    dev tun

    ca /path/to/ca.crt

    cert /path/to/server.crt

    key /path/to/server.key

    dh /path/to/dh.pem

    server 10.8.0.0 255.255.255.0

    ifconfig-pool-persist ipp.txt

    push "redirect-gateway def1 bypass-dhcp" push "dhcp-option DNS 8.8.8.8" keepalive
    10 120

    cipher AES-256-CBC

    auth SHA256

    user nobody

    group nogroup

    persist-key

    persist-tun

    status openvpn-status.log

    verb 3

    ```


    3. Enable IP forwarding:


    ```bash

    echo ''net.ipv4.ip_forward=1'' | sudo tee -a /etc/sysctl.conf

    sudo sysctl -p

    ```


    4. Configure firewall rules (using `iptables`):


    ```bash

    sudo iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE

    sudo iptables -A INPUT -i tun+ -j ACCEPT

    sudo iptables -A FORWARD -i tun+ -j ACCEPT

    sudo iptables -A FORWARD -i tun+ -o eth0 -m state --state RELATED,ESTABLISHED
    -j ACCEPT

    sudo iptables -A FORWARD -i eth0 -o tun+ -m state --state RELATED,ESTABLISHED
    -j ACCEPT

    ```


    5. Start the OpenVPN server:


    ```bash

    sudo systemctl start openvpn@server

    sudo systemctl enable openvpn@server

    ```


    ### Setting up a VPN Client


    1. Create a client configuration file (e.g., `client.ovpn`):


    ```

    client

    dev tun

    proto udp

    remote your_server_ip 1194

    resolv-retry infinite

    nobind

    persist-key

    persist-tun

    ca ca.crt

    cert client.crt

    key client.key

    cipher AES-256-CBC

    auth SHA256

    comp-lzo

    verb 3

    ```


    2. Copy the necessary certificate and key files to the client machine.


    3. Connect to the VPN:


    ```bash

    sudo openvpn --config client.ovpn

    ```


    ## Configuring Routing for Remote Network Access


    To allow VPN clients to access resources on the server''s local network, you''ll
    need to configure routing on both the server and client sides.


    ### Server-side Configuration


    1. Add a push directive to the server configuration file:


    ```

    push "route 192.168.1.0 255.255.255.0"

    ```


    Replace `192.168.1.0` with your local network''s subnet.


    2. Enable IP forwarding (if not already done):


    ```bash

    echo ''net.ipv4.ip_forward=1'' | sudo tee -a /etc/sysctl.conf

    sudo sysctl -p

    ```


    3. Configure `iptables` to allow forwarding:


    ```bash

    sudo iptables -A FORWARD -i tun+ -o eth0 -s 10.8.0.0/24 -d 192.168.1.0/24 -m state
    --state NEW -j ACCEPT

    sudo iptables -A FORWARD -m state --state RELATED,ESTABLISHED -j ACCEPT

    ```


    ### Client-side Configuration


    No additional configuration is needed on the client side if the server is properly
    configured to push the route.


    ## WireGuard: A Lightweight and Modern VPN


    WireGuard is a newer VPN protocol that aims to be simpler and more performant
    than traditional VPN solutions like OpenVPN and IPsec.


    ### Installing WireGuard


    On most modern Linux distributions, WireGuard can be installed using the package
    manager:


    ```bash

    sudo apt install wireguard  # For Ubuntu/Debian

    sudo yum install wireguard-tools  # For CentOS/RHEL

    ```


    ### Generating Keys


    WireGuard uses public-key cryptography for authentication and key exchange. Generate
    a key pair for each peer (server and clients):


    ```bash

    wg genkey | tee privatekey | wg pubkey > publickey

    ```


    This command generates both a private key and its corresponding public key.


    ### Creating and Managing WireGuard Configurations


    1. Create a WireGuard configuration file for the server (e.g., `/etc/wireguard/wg0.conf`):


    ```

    [Interface]

    Address = 10.0.0.1/24

    ListenPort = 51820

    PrivateKey = <server_private_key>

    [Peer]

    PublicKey = <client1_public_key>

    AllowedIPs = 10.0.0.2/32

    [Peer]

    PublicKey = <client2_public_key>

    AllowedIPs = 10.0.0.3/32

    ```


    2. Create a WireGuard configuration file for each client (e.g., `client1.conf`):


    ```

    [Interface]

    Address = 10.0.0.2/32

    PrivateKey = <client1_private_key>

    [Peer]

    PublicKey = <server_public_key>

    Endpoint = <server_public_ip>:51820

    ```


    3. Start the WireGuard interface:


    ```bash

    sudo wg-quick up wg0

    ```


    4. Stop the WireGuard interface:


    ```bash

    sudo wg-quick down wg0

    ```


    ## Managing VPN Services Using systemd


    systemd is the init system and service manager.


    ### OpenVPN


    To manage OpenVPN services using systemd:


    ```bash

    sudo systemctl start openvpn@server

    sudo systemctl stop openvpn@server

    sudo systemctl enable openvpn@server

    sudo systemctl status openvpn@server

    ```


    ### WireGuard


    To manage WireGuard services using systemd:


    ```bash

    sudo systemctl start wg-quick@wg0

    sudo systemctl stop wg-quick@wg0

    sudo systemctl enable wg-quick@wg0

    sudo systemctl status wg-quick@wg0

    ```


    Example of a systemd service file for WireGuard (`/etc/systemd/system/wg-quick@service`):


    ```ini

    [Unit]

    Description=WireGuard interface %I

    After=network-online.target

    Wants=network-online.target


    [Service]

    Type=oneshot

    RemainAfterExit=yes

    ExecStart=/usr/bin/wg-quick up %i

    ExecStop=/usr/bin/wg-quick down %i


    [Install]

    WantedBy=multi-user.target

    ```

