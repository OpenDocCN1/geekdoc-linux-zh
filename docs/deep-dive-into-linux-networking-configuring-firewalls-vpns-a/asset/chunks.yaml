    `MapPublicIpOnLaunch`: `false`\n`Tags`:\n- `Key`: `Name` `Value`: `Private Subnet\
    \ 1`\n\n## 2. Web Application Firewall\n\n- Deploy AWS WAF with custom rules\n\
    - Implement rate limiting and IP reputation lists\n\n# AWS WAF rule set example\
    \ \n\n```yaml\nResources:\n  MyWAFRuleSet:\n    Type: AWS::WAFv2::RuleGroup\n\
    \    Properties:\n      Capacity: 50\n      Scope: REGIONAL\n      VisibilityConfig:\n\
    \        CloudWatchMetricsEnabled: true\n        MetricName: MyWAFRuleSet\n  \
    \      SampledRequestsEnabled: true\n      Rules:\n        - Name: BlockSQLInjection\n\
    \          Priority: 1\n          Statement:\n            SqliMatchStatement:\n\
    \              FieldToMatch:\n                AllQueryArguments: {}\n        \
    \      TextTransformations:\n                - Priority: 1\n                 \
    \ Type: URL_DECODE\n                  Action:\n                    Block: {}\n\
    \        VisibilityConfig:\n          CloudWatchMetricsEnabled: true\n       \
    \   MetricName: BlockSQLInjection\n          SampledRequestsEnabled: true\n```\n\
    \n## 3. Hybrid Cloud Connection\n\n- Set up AWS Direct Connect or VPN for secure\
    \ on-premises connectivity\n- Implement transit gateway for simplified network\
    \ architecture\n\n## 4. Container Security\n\n- Use AWS ECS or EKS with security\
    \ groups\n- Implement IAM roles for tasks/pods\n- Use ECR image scanning\n\n##\
    \ 5. Serverless Security\n\n- Configure least privilege IAM roles for Lambda functions\n\
    - Use AWS Secrets Manager for sensitive data\n- Implement API Gateway with authentication\
    \ and authorization\n\n# AWS SAM template snippet for secure Lambda function \n\
    \n```yaml\nResources:\n  MySecureFunction:\n    Type: AWS::Serverless::Function\n\
    \    Properties:\n      Handler: index.handler\n      Runtime: nodejs14.x\n  \
    \    CodeUri: ./code\n      Policies:\n        - AWSLambdaBasicExecutionRole\n\
    \        - Statement:\n          - Effect: Allow\n            Action:\n      \
    \        - s3:GetObject\n            Resource: arn:aws:s3:::my-bucket/*\n    \
    \  Environment:\n        Variables:\n          SECRET_NAME: !Ref MySecret \n \
    \     VpcConfig:\n        SecurityGroupIds:\n          - !Ref MySecurityGroup\n\
    \        SubnetIds:\n          - !Ref PrivateSubnet1\n          - !Ref PrivateSubnet2\n\
    \  MySecret:\n    Type: AWS::SecretsManager::Secret\n    Properties:\n      Name:\
    \ /myapp/database-password\n      Description: Database password for my application\n\
    \      GenerateSecretString:\n        SecretStringTemplate: '{\"username\": \"\
    admin\"}'\n        GenerateStringKey: password\n        PasswordLength: 30\n \
    \       ExcludeCharacters: '\"@/\\'\n```\n\n## Step-by-Step Guides\n\n### Setting\
    \ Up Secure Remote Access\n\n#### 1. Choose a VPN Protocol\n- OpenVPN is a popular\
    \ and secure choice\n- WireGuard is a newer, high-performance alternative\n\n\
    #### 2. Set Up the VPN Server\n- Install the VPN server software\n- Generate server\
    \ and client certificates\n- Configure the server\n\n# Install OpenVPN on Ubuntu\
    \ \n```bash\nsudo apt update\nsudo apt install openvpn easy-rsa # Initialize the\
    \ PKI cd /usr/share/easy-rsa\n\n./easyrsa init-pki\n./easyrsa build-ca\n./easyrsa\
    \ gen-req server nopass\n./easyrsa sign-req server server\n./easyrsa gen-dh #\
    \ Configure OpenVPN server sudo cp /usr/share/doc/openvpn/examples/sample-config-files/server.conf\
    \ /etc/openvpn/server.conf\n\nsudo nano /etc/openvpn/server.conf # Edit relevant\
    \ parts of the configuration: port 1194\n\nproto udp\ndev tun\nca /usr/share/easy-rsa/pki/ca.crt\n\
    cert /usr/share/easy-rsa/pki/issued/server.crt\nkey /usr/share/easy-rsa/pki/private/server.key\n\
    dh /usr/share/easy-rsa/pki/dh.pem\nserver 10.8.0.0 255.255.255.0\npush \"redirect-gateway\
    \ def1 bypass-dhcp\" push \"dhcp-option DNS 8.8.8.8\" keepalive 10 120\ncipher\
    \ AES-256-CBC\nuser nobody\ngroup nogroup\npersist-key\npersist-tun\nstatus openvpn-status.log\n\
    verb 3\n```\n\n#### 3. Configure Firewall\n- Allow VPN traffic through the firewall\n\
    - Set up NAT for VPN clients\n\n# UFW firewall rules for OpenVPN \n```bash\nsudo\
    \ ufw allow 1194/udp\nsudo ufw enable # Enable IP forwarding\necho \"net.ipv4.ip_forward=1\"\
    \ | sudo tee -a /etc/sysctl.conf\nsudo sysctl -p\niptables -t nat -A POSTROUTING\
    \ -s 10.8.0.0/24 -o eth0 -j MASQUADE\n```\n\n#### 4. Generate Client Certificates\n\
    ```bash\n./easyrsa gen-req client nopass\n./easyrsa sign-req client client\n```\n\
    \n#### 5. Configure Client\n- Transfer configuration to client\n- Distribute certificates\
    \ securely\n\n#### 6. Test the Connection\n- Verify connectivity\n\n### Securing\
    \ a Web Server\n\n#### 1. Choose a Web Server\n- Popular options include Apache,\
    \ Nginx, or LiteSpeed\n\n#### 2. Install the Web Server\n- Install Nginx\n```bash\n\
    sudo apt update\nsudo apt install nginx\n```\n\n#### 3. Implement HTTPS\n- Obtain\
    \ an SSL certificate (e.g., Let's Encrypt)\n```bash\nsudo certbot --nginx -d example.com\
    \ -d www.example.com\n```\n\n#### 4. Configure Web Application Firewall (WAF)\n\
    - Install and configure ModSecurity\n```bash\nsudo apt install libmodsecurity3\
    \ nginx-module-modsecurity\n# Configure ModSecurity in nginx.conf\n```\n\n####\
    \ 5. Implement Security Headers\n- Add HTTP security headers to your web server\n\
    ```nginx\nadd_header X-Frame-Options \"SAMEORIGIN\";\nadd_header X-XSS-Protection\
    \ \"1; mode=block\";\nadd_header X-Content-Type-Options \"nosniff\";\nadd_header\
    \ Referrer-Policy \"strict-origin-when-cross-origin\";\nadd_header Content-Security-Policy\
    \ \"default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src\
    \ 'self' 'unsafe-inline';\";\n```\n\n#### 6. Configure Firewall Rules\n- Allow\
    \ only necessary ports (80 and 443)\n- Implement rate limiting\n```bash\nsudo\
    \ ufw allow 80/tcp\nsudo ufw allow 443/tcp\nsudo ufw enable\n```\n\n#### 7. Secure\
    \ File Permissions\n- Set appropriate ownership and permissions for web files\n\
    ```bash\nsudo chown -R www-data:www-data /var/www/html\nsudo find /var/www/html\
    \ -type d -exec chmod 755 {} \\;\nsudo find /var/www/html -type f -exec chmod\
    \ 644 {} \\;\n```\n\n#### 8. Regular Updates and Patching\n- Keep the web server\
    \ software and all dependencies up to date\n```bash\nsudo apt update\nsudo apt\
    \ upgrade\nsudo systemctl restart nginx\n```\n\n#### 9. Implement Logging and\
    \ Monitoring\n- Configure detailed logging\n- Set up log rotation\n- Implement\
    \ a log analysis tool (e.g., fail2ban)\n"
