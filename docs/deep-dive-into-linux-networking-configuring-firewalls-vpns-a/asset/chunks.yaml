    group nogroup\npersist-key\npersist-tun\nstatus openvpn-status.log\nverb 3\n```\n\
    \n#### 3. 配置防火墙\n- 允许 VPN 流量通过防火墙\n- 为 VPN 客户端设置 NAT\n\n# OpenVPN 的 UFW 防火墙规则\n\
