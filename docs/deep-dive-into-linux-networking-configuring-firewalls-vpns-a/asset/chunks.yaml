    services securely over an unsecured network.


    *   SSL/TLS (Secure Sockets Layer/Transport Layer Security): Cryptographic protocols
    designed to provide communications security over a computer network.


    *   Subnet: A logical subdivision of an IP network.


    *   Switch: A networking hardware that connects devices on a computer network
    by using packet switching to receive, process, and forward data to the destination
    device.


    #### T


    *   TCP (Transmission Control Protocol): A core protocol of the Internet protocol
    suite that provides reliable, ordered, and error-checked delivery of a stream
    of octets between applications running on hosts communicating over an IP network.


    *   Telnet: A protocol used on the Internet or local area networks to provide
    a bidirectional interactive text-oriented communication facility using a virtual
    terminal connection.


    #### U


    *   UDP (User Datagram Protocol): One of the core members of the Internet protocol
    suite that allows computer applications to send messages to other hosts on an
    IP network.


    *   URL (Uniform Resource Locator): A reference to a web resource that specifies
    its location on a computer network and a mechanism for retrieving it.


    #### V


    *   VLAN (Virtual LAN): Any broadcast domain that is partitioned and isolated
    in a computer network at the data link layer (OSI layer 2).


    *   VPN (Virtual Private Network): A technology that creates a safe and encrypted
    connection over a less secure network, such as the public internet.


    #### W


    *   WAN (Wide Area Network): A telecommunications network that extends over a
    large geographic area for the primary purpose of computer networking.


    *   Wi-Fi: A family of wireless network protocols, based on the IEEE 802.11 family
    of standards, which are commonly used for local area networking of devices and
    Internet access.


    #### X


    *   X.509: A standard defining the format of public key certificates.


    #### Y


    *   YAML (YAML Ain''t Markup Language): A human-readable data serialization format
    that is commonly used for configuration files.


    #### Z


    *   Zero Trust: A security concept centered on the belief that organizations should
    not automatically trust anything inside or outside its perimeters and instead
    must verify anything and everything trying to connect to its systems before granting
    access.


    ### Appendix B: Linux Network Configuration Files Reference


    Linux systems use various configuration files to manage network settings. Understanding
    these files is crucial for effective network administration. Here''s a comprehensive
    reference:


    #### 1. /etc/network/interfaces


    This file is the primary network configuration file on Debian-based systems.


    # The loopback network interface


    auto lo


    iface lo inet loopback


    # The primary network interface


    auto eth0


    iface eth0 inet static


        address 192.168.1.100


        netmask 255.255.255.0


        gateway 192.168.1.1


        dns-nameservers 8.8.8.8 8.8.4.4


    #### 2. /etc/sysconfig/network-scripts/ifcfg-*


    On Red Hat-based systems, each network interface has its own configuration file
    in this directory.


    # /etc/sysconfig/network-scripts/ifcfg-eth0


    DEVICE=eth0


    BOOTPROTO=static


    IPADDR=192.168.1.100


    NETMASK=255.255.255.0


    GATEWAY=192.168.1.1


    DNS1=8.8.8.8


    DNS2=8.8.4.4


    ONBOOT=yes


    #### 3. /etc/resolv.conf


    This file specifies the DNS servers to be used for domain name resolution.


    nameserver 8.8.8.8'
