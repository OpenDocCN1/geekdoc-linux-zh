    #### 6. 配置防火墙规则\n- 仅允许必要的端口（80 和 443）\n- 实现速率限制\n```bash\nsudo ufw allow 80/tcp\n\
    sudo ufw allow 443/tcp\nsudo ufw enable\n```\n\n#### 7. 安全文件权限\n- 为 Web 文件设置适当的所有权权限\n\
