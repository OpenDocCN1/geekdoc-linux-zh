    /etc/sysctl.d/60-vpn.conf


    sysctl -p # Restart services systemctl restart strongswan


    systemctl restart xl2tpd


    #### 8\. Simple Port Knocking Script


    This script implements a basic port knocking mechanism:


    #!/bin/bash   # Define the knock sequence SEQUENCE="7000,8000,9000"  # Create
    a new chain for port knocking iptables -N KNOCK # Set up logging for debugging
    iptables -A KNOCK -m recent --name AUTH --remove


    iptables -A KNOCK -m recent --name AUTH --set # Set up the knock sequence IFS='',''  read
    -ra PORTS <<<  "$SEQUENCE"  for  i  in  "${!PORTS[@]}";  do if [ "$i" -eq 0 ];  then
    iptables -A KNOCK -m recent --name AUTH$i --set -p tcp --dport ${PORTS[$i]} -j
    LOG --log-prefix "knock: " elif [ "$i" -eq $((${#PORTS[@]}-1)) ];  then iptables
    -A KNOCK -m recent --name AUTH$((i-1)) --remove -m recent --name AUTH$i --set
    -p tcp --dport ${PORTS[$i]} -j ACCEPTelse iptables -A KNOCK -m recent --name AUTH$((i-1))
    --remove -m recent --name AUTH$i --set -p tcp --dport ${PORTS[$i]} -j LOG --log-prefix
    "knock: " fi  done  # Add the KNOCK chain to INPUT iptables -A INPUT -j KNOCK
    # Allow SSH after successful knock iptables -A INPUT -m recent --name AUTH$((${#PORTS[@]}-1))
    --remove -p tcp --dport 22 -j ACCEPT


