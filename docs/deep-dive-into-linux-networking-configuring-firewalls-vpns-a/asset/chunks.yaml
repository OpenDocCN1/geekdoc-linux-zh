    # Chapter 2: Basic Network Configuration in Linux


    ## Introduction


    In this chapter, we will delve into the fundamental aspects of network configuration
    in Linux systems. Understanding how to manage and configure network interfaces,
    set up IP addresses, manage routes and gateways, configure DNS, and test network
    connectivity is crucial for any Linux system administrator or network professional.
    We''ll explore various command-line tools and configuration files that are essential
    for managing network settings in Linux environments.


    ## Managing Network Interfaces


    Linux supports various types of network interfaces, including Ethernet, Wi-Fi,
    loopback, and virtual interfaces. Each interface serves a specific purpose and
    can be managed using different tools and commands.


    ### Ethernet Interfaces


    Ethernet interfaces are the most common type of network interface used in wired
    networks. In Linux, these interfaces are typically named eth0, eth1, etc., although
    newer systems may use predictable network interface names like enp0s3.


    To view all network interfaces on your system, you can use the following command:


    ip link show


    This command will display a list of all network interfaces, their status (UP or
    DOWN), and other relevant information.


    To bring an Ethernet interface up or down, you can use the following commands:


    # Bring interface up sudo ip link set eth0 up # Bring interface down sudo ip link
    set eth0 down


    ### Wi-Fi Interfaces


    Wi-Fi interfaces are used for wireless network connections. These interfaces are
    typically named wlan0, wlan1, etc. Managing Wi-Fi interfaces often involves using
    additional tools like iwconfig or nmcli (NetworkManager command-line interface).


    To view Wi-Fi interface information:


    iwconfig


    To connect to a Wi-Fi network using NetworkManager:


    nmcli device wifi connect <SSID> password <password>


    ### Loopback Interface


    The loopback interface, typically named lo, is a special network interface that
    allows a system to communicate with itself. It''s always present and usually configured
    with the IP address 127.0.0.1.


    To view the loopback interface:


    ip addr show lo


    ### Virtual Interfaces


    Virtual interfaces are software-based network interfaces that can be created for
    various purposes, such as network virtualization or VPN connections. Common types
    of virtual interfaces include:


    1.  Bridge interfaces


    2.  VLAN interfaces


    3.  Tunnel interfaces (e.g., for VPNs)


    To create a bridge interface:


    sudo ip link add name br0 type bridge


    sudo ip link set dev br0 up


    To create a VLAN interface:


    sudo ip link add link eth0 name eth0.100 type vlan id 100


    sudo ip link set dev eth0.100 up


    ## Setting up Static and Dynamic IP Addresses


    Linux systems can be configured with either static IP addresses or dynamic IP
    addresses assigned by DHCP (Dynamic Host Configuration Protocol). We''ll explore
    both methods using command-line tools.


    ### Static IP Address Configuration


    To set a static IP address, you can use the ip command or edit the network configuration
    files directly.


    Using the ip command:


    sudo ip addr add 192.168.1.100/24 dev eth0


    This command assigns the IP address 192.168.1.100 with a subnet mask of 255.255.255.0
    to the eth0 interface.


    To make the configuration persistent across reboots, you''ll need to edit the
    network configuration files. The exact location and format of these files may
    vary depending on your Linux distribution. For example, on Ubuntu and Debian-based
    systems, you might edit /etc/network/interfaces:


    auto eth0


    iface eth0 inet static


        address 192.168.1.100


        netmask 255.255.255.0


        gateway 192.168.1.1


    On Red Hat-based systems, you might edit /etc/sysconfig/network-scripts/ifcfg-eth0:


    DEVICE=eth0


    BOOTPROTO=static


    IPADDR=192.168.1.100


    NETMASK=255.255.255.0


    GATEWAY=192.168.1.1


    ONBOOT=yes


    ### Dynamic IP Address Configuration (DHCP)


    To configure an interface to use DHCP, you can use the dhclient command:


    sudo dhclient eth0


    This command will request an IP address from the DHCP server for the eth0 interface.


    To make the DHCP configuration persistent, you can edit the network configuration
    files:


    For Ubuntu and Debian-based systems (/etc/network/interfaces):


    auto eth0


    iface eth0 inet dhcp


    For Red Hat-based systems (/etc/sysconfig/network-scripts/ifcfg-eth0):


    DEVICE=eth0


    BOOTPROTO=dhcp


    ONBOOT=yes


    ## Managing Routes and Gateways


    Routing is the process of directing network traffic between different networks.
    In Linux, you can manage routes and gateways using the ip and route commands.


    ### Viewing Routes


    To view the current routing table:


    ip route show


    or


    route -n


    ### Adding a Route


    To add a new route:


    sudo ip route add 192.168.2.0/24 via 192.168.1.1


    This command adds a route to the 192.168.2.0/24 network through the gateway at
    192.168.1.1.


    ### Deleting a Route


    To delete a route:


    sudo ip route del 192.168.2.0/24


    ### Setting the Default Gateway


    To set the default gateway:


    sudo ip route add default via 192.168.1.1


    ### Persistent Route Configuration


    To make route configurations persistent across reboots, you can add them to the
    network configuration files or create a separate routing configuration file.


    For Ubuntu and Debian-based systems, you can add routes to /etc/network/interfaces:


    auto eth0


    iface eth0 inet static


        address 192.168.1.100


        netmask 255.255.255.0


        gateway 192.168.1.1


        up route add -net 192.168.2.0 netmask 255.255.255.0 gw 192.168.1.1


    For Red Hat-based systems, you can create a file like /etc/sysconfig/network-scripts/route-eth0:


    192.168.2.0/24 via 192.168.1.1


    ## DNS Configuration and Troubleshooting


    DNS (Domain Name System) is crucial for resolving domain names to IP addresses.
    In Linux, DNS configuration primarily involves editing the /etc/resolv.conf file
    and using tools like dig and nslookup for troubleshooting.


