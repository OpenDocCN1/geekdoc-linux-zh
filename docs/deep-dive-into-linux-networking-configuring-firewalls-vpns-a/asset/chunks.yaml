    \        addresses: [8.8.8.8, 8.8.4.4]\n```\n\n### 8. /etc/network/interfaces.d/*\n\
    \n在某些系统上，单个接口配置可以放在此目录下的单独文件中。\n\n### 9. /proc/sys/net/\n\n此目录包含运行时的网络配置参数。\n\n\
    ### 10. /etc/iproute2/rt_tables\n\n此文件定义路由表名称和数字，用于 `ip route` 命令。\n\n```\n255\
    \ local\n254 main\n253 default\n0 unspec\n```\n\n### 11. /etc/nsswitch.conf\n\n\
    此文件配置了各种名称解析机制使用的顺序。\n\n```\nhosts: files dns\n```\n\n### 12. /etc/NetworkManager/system-connections/\n\
    \nNetworkManager 在此目录下存储连接配置文件。\n\n### 13. /var/lib/dhcp/dhclient.leases\n\n此文件存储\
    \ DHCP 租约信息。\n\n### 14. /etc/dhcp/dhcpd.conf\n\nDHCP 服务器的配置文件。\n\n```\nsubnet\
    \ 192.168.1.0 netmask 255.255.255.0 {\n  range 192.168.1.100 192.168.1.200;\n\
    \  option routers 192.168.1.1;\n  option domain-name-servers 8.8.8.8, 8.8.4.4;\n\
    }\n```\n\n### 15. /etc/iptables/rules.v4 和 /etc/iptables/rules.v6\n\n这些文件可以分别存储\
    \ IPv4 和 IPv6 的持久化 iptables 规则。\n\n理解并正确配置这些文件对于有效管理 Linux 网络设置至关重要。在更改之前请务必备份配置文件，并注意这些文件的具体位置和命名在不同的\
    \ Linux 发行版之间可能会有所不同。\n\n### 附录 C：示例防火墙和 VPN 配置脚本\n\n#### 1.  iptables 防火墙脚本\n\
    \n该脚本使用 `iptables` 建立基础防火墙：\n\n```bash\n#!/bin/bash   # 清空现有规则\niptables -F\n\
    iptables -X # 设置默认链策略\niptables -P INPUT DROP\niptables -P FORWARD DROP\niptables\
    \ -P OUTPUT ACCEPT # 允许环回\niptables -A INPUT -i lo -j ACCEPT\niptables -A OUTPUT\
    \ -o lo -j ACCEPT # 允许已建立连接\niptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED\
    \ -j ACCEPT # 允许 SSH\niptables -A INPUT -p tcp --dport 22 -j ACCEPT # 允许 HTTP\
    \ 和 HTTPS\niptables -A INPUT -p tcp --dport 80 -j ACCEPT\niptables -A INPUT -p\
    \ tcp --dport 443 -j ACCEPT # 允许 ping\niptables -A INPUT -p icmp --icmp-type echo-request\
    \ -j ACCEPT # 记录丢弃的包\niptables -A INPUT -j LOG --log-prefix \"IPTables-Dropped:\
    \ \"  # 保存规则\niptables-save > /etc/iptables/rules.v4\n```\n\n#### 2. OpenVPN 服务器配置\n\
    \n这是一个基础的 OpenVPN 服务器配置文件：\n\n```\nport 1194\nproto udp\ndev tun\nca ca.crt\n\
    cert server.crt\nkey server.key\ndh dh2048.pem\nserver 10.8.0.0 255.255.255.0\n\
    ifconfig-pool-persist ipp.txt\npush \"redirect-gateway def1 bypass-dhcp\"\npush\
    \ \"dhcp-option DNS 208.67.222.222\"\npush \"dhcp-option DNS 208.67.220.220\"\n\
    keepalive 10 120\ncipher AES-256-CBC\nuser nobody\ngroup nogroup\npersist-key\n\
    persist-tun\nstatus openvpn-status.log\nverb 3\n```\n\n#### 3. OpenVPN 客户端配置\n\
    \n对应的客户端配置：\n\n```\nclient\ndev tun\nproto udp\nremote your_server_ip 1194\nresolv-retry\
    \ infinite\nnobind\npersist-key\npersist-tun\nca ca.crt\ncert client.crt\nkey\
    \ client.key\nremote-cert-tls server\ncipher AES-256-CBC\nverb 3\n```\n\n####\
    \ 4. WireGuard 服务器配置\n\n一个 WireGuard 服务器配置示例（`/etc/wireguard/wg0.conf`）：\n\n```ini\n\
    [Interface]\nAddress = 10.0.0.1/24\nListenPort = 51820\nPrivateKey = SERVER_PRIVATE_KEY\n\
    [Peer]\nPublicKey = CLIENT_PUBLIC_KEY\nAllowedIPs = 10.0.0.2/32\n```\n\n#### 5.\
    \ WireGuard 客户端配置\n\n对应的 WireGuard 客户端配置：\n\n```ini\n[Interface]\nAddress = 10.0.0.2/32\n\
    PrivateKey = CLIENT_PRIVATE_KEY\nDNS = 1.1.1.1\n[Peer]\nPublicKey = SERVER_PUBLIC_KEY\n\
    Endpoint = server_public_ip:51820\nAllowedIPs = 0.0.0.0/0\nPersistentKeepalive\
    \ = 25\n```\n\n#### 6. UFW (简单防火墙) 配置脚本\n\n该脚本使用基础规则配置 UFW：\n\n```bash\n#!/bin/bash\
    \   # 重置 UFW 为默认\nufw --force reset # 设置默认策略\nufw default deny incoming\nufw default\
    \ allow outgoing # 允许 SSH\nufw allow 22/tcp # 允许 HTTP 和 HTTPS\nufw allow 80/tcp\n\
    ufw allow 443/tcp # 允许特定 IP\nufw allow from 192.168.1.100 # 启用 UFW\nufw --force\
    \ enable\n```\n\n#### 7. IPsec/L2TP VPN 服务器设置脚本\n\n该脚本设置一个 IPsec/L2TP VPN 服务器：\n\
    \n```bash\n#!/bin/bash   # 安装必要的包\napt-get update\napt-get install -y strongswan\
    \ xl2tpd # 配置 IPsec\ncat > /etc/ipsec.conf <<EOF\nconfig setup\n    charondebug=\"\
    ike 1, knl 1, cfg 0\"\n    uniqueids=no\nconn %default\n    encaps=%tunnel\n \
    \   auto=start\n    keyexchange=ikev1\n    encryption=aes256-sha256\n    phase2=aes256-sha256\n\
    \    ikelife=24h\n    keyrlifetime=1h\nEOF\n```\n\n#### 8. 简单端口敲门（Port Knocking）脚本\n\
    \n该脚本实现了一个基础端口敲门机制：\n\n```bash\n#!/bin/bash # 定义敲门序列\nSEQUENCE=\"7000,8000,9000\"\
    \n# 为端口敲门创建一个新链\niptables -N KNOCK # 设置用于调试的日志\niptables -A KNOCK -m recent --name\
    \ AUTH --remove\niptables -A KNOCK -m recent --name AUTH --set # 设置敲门序列\nIFS=','\
    \  read -ra PORTS <<< \"$SEQUENCE\"\nfor  i  in  \"${!PORTS[@]}\";  do\n  if [\
    \ \"$i\" -eq 0 ];  then\n    iptables -A KNOCK -m recent --name AUTH$i --set -p\
    \ tcp --dport ${PORTS[$i]} -j LOG --log-prefix \"knock: \"\n  elif [ \"$i\" -eq\
    \ $(#PORTS[@]}-1)) ];  then\n    iptables -A KNOCK -m recent --name AUTH$((i-1))\
    \ --remove -m recent --name AUTH$i --set -p tcp --dport ${PORTS[$i]} -j ACCEPT\n\
    \  else\n    iptables -A KNOCK -m recent --name AUTH$((i-1)) --remove -m recent\
    \ --name AUTH$i --set -p tcp --dport ${PORTS[$i]} -j LOG --log-prefix \"knock:\
    \ \"\n  fi\ndone\n# 将 KNOCK 链加入 INPUT\niptables -A INPUT -j KNOCK # 敲门成功后允许 SSH\n\
    iptables -A INPUT -m recent --name AUTH$(PORTS[@]}-1)) --remove -p tcp --dport\
    \ 22 -j ACCEPT\n```\n\n#### 9. SSH 的 Fail2Ban 配置\n\n这是一个保护 SSH 的示例 Fail2Ban 配置：\n\
    \n```ini\n[sshd]\nenabled = true\nport = ssh\nfilter = sshd\nlogpath = /var/log/auth.log\n\
    maxretry = 3\nbantime = 3600\n```\n\n#### 10. NAT (网络地址转换) 配置\n\n该脚本设置基础 NAT：\n\
    \n```bash\n#!/bin/bash # 启用 IP 转发\necho 1 > /proc/sys/net/ipv4/ip_forward # 清空现有规则\n\
    iptables -F\n```\n\n"
