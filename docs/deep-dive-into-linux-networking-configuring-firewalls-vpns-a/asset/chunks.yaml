    - 安装 VPN 服务器软件\n- 生成服务器和客户端证书\n- 配置服务器\n\n# 在 Ubuntu 上安装 OpenVPN \n```bash\nsudo\
    \ apt update\nsudo apt install openvpn easy-rsa # 初始化 PKI cd /usr/share/easy-rsa\n\
    \n./easyrsa init-pki\n./easyrsa build-ca\n./easyrsa gen-req server nopass\n./easyrsa\
