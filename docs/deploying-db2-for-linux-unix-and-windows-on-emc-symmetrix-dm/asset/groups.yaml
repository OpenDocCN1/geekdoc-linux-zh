    ### 1.8.3 配置数据库


    每当创建一个新实例时，都会创建并初始化 DB2 数据库管理器配置文件；同样，每当创建一个新数据库时，都会创建并初始化数据库配置文件。每个数据库配置文件由约
    105 个不同的参数组成。正如 DB2 数据库管理器实例配置参数控制分配给单个 DB2 数据库管理器实例的系统资源量一样，许多配置文件参数控制着在正常运行期间分配给数据库的系统资源量。


    可以通过执行 `GET DATABASE CONFIGURATION` 命令来显示特定数据库配置文件的内容。该命令的语法为：


    ```

    GET [DATABASE | DB] [CONFIGURATION | CONFIG | CFG]

    FOR [DatabaseAlias]

    <SHOW DETAIL>

    ```


    其中：


    - * DatabaseAlias — 指定要显示配置信息的数据库的别名。


    在 EMC Symmetrix DMX 上部署 Linux、UNIX 和 Windows 版 DB2


    因此，如果您想查看名为 SAMPLE 的数据库的内容，可以执行如下所示 GET DATABASE CONFIGURATION 命令：


    通过执行 `UPDATE DATABASE CONFIGURATION` 命令可以更改分配给特定数据库配置文件参数的值。其语法为：


    ```

    UPDATE [DATABASE | DB]

    [CONFIGURATION | CONFIG | CFG]

    FOR [DatabaseAlias]

    USING [[Parameter] [Value] |

    [Parameter] [Value] AUTOMATIC |

    [Parameter] AUTOMATIC |

    [Parameter] MANUAL, ...]]

    <IMMEDIATE | DEFERRED>

    ```


    其中：


    - * DatabaseAlias — 指定要修改配置信息的数据库的别名。

    - Parameter — 指定要修改其值的一个或多个数据库配置参数（通过关键字）。（在许多情况下，参数的关键字与参数名称本身相同。）

    - Value — 指定要给所指定的数据库配置参数分配的新值。


    再次强调，如果将参数的值指定为 `AUTOMATIC` 关键字，DB2 将自动调整参数值以反映当前的资源需求。如果在指定 `AUTOMATIC` 关键字的同时指定了值，则提供的值可能会影响执行的自动计算。


    如果在执行 `UPDATE DATABASE CONFIGURATION` 命令时指定了 `DEFERRED` 子句，则在所有到相应数据库的连接终止并建立新连接之前，对数据库配置文件的更改不会生效。如果指定了
    `IMMEDIATE` 子句，或者未指定任何一个，则对数据库配置文件的所有更改将立即生效——前提是可用所需的资源。（在数据库配置更改期间针对数据库运行的应用程序将在下次执行
    SQL 语句时看到更改。）


    所以，如果您想配置一个名为 SAMPLE 的数据库，让任何连接到数据库的应用程序在回滚当前事务之前最多等待 10,000 秒以获取锁，可以执行如下所示 UPDATE
    DATABASE CONFIGURATION 命令：


    ```

    UPDATE DB CFG FOR sample USING LOCKTIMEOUT 10000

    ```


    您可以使用数据库配置对话框来查看或更改数据库配置文件的内容，可以通过从控制中心（Control Center）的数据库菜单中选择“配置参数”（Configure
    Parameters）操作来激活。第 58 页的图 21 显示了激活数据库配置对话框必须选择的控制中心菜单项；第 59 页的图 22 显示了该对话框在激活后的外观。


