    System i 企业级捆包中。


    - **DB2 for z/OS**。DB2 for z/OS 是一种多功能、全功能的数据库管理系统，专为 z/OS（IBM 的旗舰操作系统）设计而生。十多年来，IBM
    主机一直是数据和事务服务的领导者；DB2 9 for z/OS 构建在 IBM 主机所提供的价值之上，以简化满足合规性 IT 基础设施成本的努力，并简化 System
