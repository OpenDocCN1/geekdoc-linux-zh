    ## 分区数据库的考虑因素


    ![](img/9d79d979aef40e6535a55c940991009e_133_0.png)


    图 40 跨越两个分区的 DB2 数据库的典型目录层次树


    ## 4.3 在分区间平衡数据


    在分区数据库环境中，可以定义一个或多个数据库分区的具名子集。你定义的每个子集被称为数据库分区组（database partition group）。一个数据库分区组最少包含一个数据库分区，也可以跨越数据库中的所有数据库分区。每当创建分区数据库时，系统会自动创建三个数据库分区组。其中一个是
    `IBMCATGROUP`，这是包含系统目录（`SYSCSPACE`）的表空间使用的数据库分区组。另一个是 `IBMDEFAULTGROUP`，这是用于用户定义表的默认数据库分区组。第三个名为
    `IBMGROUP`，是用于系统临时表空间的默认分区组。（可以在声明的临时表空间创建用户临时表空间：`IBMDEFAULTGROUP` 或任何用户创建的数据库分区组，但不能在
    `IBMTEMPGROUP` 中创建。）


    当你想在分区数据库中创建表时，应首先创建一个或多个数据库分区组，用以控制表空间存储的位置（你也可以选择使用默认数据库分区组：`IBMDEFAULTGROUP`）。一旦定义了适当的分区组，你就可以为每个组创建所需的表空间。创建的每个表空间都分布在所用数据库组中标识的所有数据库分区上；每个被使用的分区都将拥有自己的一组表空间容器，并“拥有”存储在那的数据。最后，你在适当的表空间中创建所需的表。


    在分区数据库中创建表空间时，表空间所属的分区组决定了该表空间物理创建在哪个数据库分区上。表空间只能属于一个分区组，但一个分区组可以包含多个表空间。图 41
    显示了数据库分区、分区组和表空间之间的一多多关系。


    ![](img/9d79d979aef40e6535a55c940991009e_134_0.png)


    图 41 数据库分区、分区组和表空间


    ## 分区数据库的考虑因素


    表空间创建后，没有办法动态更改它所所属的分区组。如果你想更改已创建的表空间的分区组，必须删除该表空间并使用新的分区组重新创建。


    当数据存储在跨越多个数据库分区的表中时，它是使用哈希算法进行分布的，该算法利用所谓的“分区键”（partitioning key）。分区键是数据分区中每个表行所所属的一个或多个列的有序集合。选择良好的分区键将导致数据在各个分区之间实现均匀分布。反之，选择不当的分区键会导致数据分布倾斜，并导致每个被用分区的负载不平衡。分区键通常能提供良好平衡的数据分布。影响分区键选择的因素有很多——主要因素是分区键中的列也必须位于表的主键中。对于这一点，表的分区键通常被用作分区依据，因为它具有高基数（cardinality）。


    如果你担心数据没有分到所有可用的数据库分区上，可以使用简单的查询来衡量数据分布。该查询的语法如下：


    ```sql

    SELECT DBARTITIONNUM(PartitionKey) AS partnum,

    COUNT(*) AS rowcount

    FROM [PartitionedTable]

    GROUP BY DBARTITIONNUM(PARTITIONKEYS)

    ORDER BY 1

    ```


    其中：


    - PartitionKey — 标识构成用于分区表的分区键的列集合。

    - PartitionTable — 通过名称标识分区表。


    > 注意：表分区（也称为范围分区）是 DB2.9 中引入的一种数据组织方案，其中根据一个或多个列的值，将表数据划分到多个称为“分区”或“范围”的存储对象中。每个数据分区单独存储，存储对象可以位于不同的表空间中、位于同一个空间中，或者两者的结合。表分区可以提高性能，并消除使用
    DB2 创建分区数据库的需要。表分区也可以与 DPE 结合使用。


    ### 4.3.1 关于广播的说明


    当单表的数据分布在多个分区（并可能跨越多个服务器）时，由于数据从各个分区连接并作为结果返回给用户，可能会面临一些运行时性能挑战。由于一个分区的数据与另一个分区的数据连接而产生的网络活动被称为“广播”（broadcasting）。不幸的是，广播会对数据库性能产生负面影响。


    在设计分区数据库时，建议尝试在同一分区内连接大表的列。这在某种程度上取决于用于两个连接表所选的分区键。


    ## 4.4 共享磁盘考虑因素


    如果存储阵列向三个不同的服务器呈现同一个物理磁盘的三个不同部分，则每个服务器都将其各自的部分视为一个独立的磁盘。如果数据库分区存储在这些服务器的每一个上，DB2
    也会假设每个服务器都有自己独立的物理磁盘。如果随后创建一个跨越所有三个数据库分区的表空间，其结果将类似于图 42 所示的配置。


    ![](img/9d79d979aef40e6535a55c940991009e_136_0.png)


    图 42 跨越三个数据库分区的表空间


    分区数据库的考虑因素


    Symmetrix DMX 使用缓存来缓解磁盘的影响。最后，存储中复杂的队列机制确保磁盘处于忙状态而不会产生长时间等待。


    ### 4.5 共享磁盘的挑战


    当存储阵列中的磁盘专用给单个分区时，满足每个分区的 IOPS 要求可能是一个挑战。为了理解这一点，可以看一个例子。在 IBM 仓库环境中，目标是每个 GB
    具有两个 IOPS。这意味着对于 73 GB 的磁盘，需要 146 IOPS。这个数字在 15000 转磁盘的规格范围内（取决于缓存大小）。但如果磁盘尺寸翻倍到下一个增量
    146 GB 呢？为了保持每 GB 两个 IOPS，磁盘必须进行短缩，只使用前 73 GB。这将减少寻道并使磁盘性能类似于 73 GB 磁盘。当然，通过这种方法，磁盘容量的一半将无法利用。然而，磁盘未使用的部分可以用于备份或其他低容量活动。当然，当对该区域进行写入或读取时，整个磁盘的吞吐量将受到负面影响。


    ### 4.5.1 分配的粒度


    许多阵列能够由来自多个磁盘的碎片组成一个 LUN。这增加了分区“拥有”的磁盘数量，从而降低了分配的粒度。在无共享的分区环境中，这意味着磁盘无法与数据库中的任何其他分区共享。这增加了数据库的有效存储单元。例如，如果在
    RAID 5+3+1 数组中使用 146 GB磁盘，每个分区的最小分配单元为 4 * 146，即 584 GB 的存储空间。现在，假设一个数据库由 16 个分区组成。在这种情况下，最小增长单元是
    16 * 584，即 9.3 TB。在大多数情况下，这可能是一个不可接受的量。因此，分区数据库的设计应尽可能提供较低水平的粒度。显然，较小的磁盘在这方面有帮助，但如果没有较小的磁盘，可以使用较小的
    RAID 组。


    在 DB2 for Linux, UNIX 和 Windows 上部署于 EMC Symmetrix DMX


