    All other options with this command are described in Table 2.


    ## db2set command options (page 1 of 2)


    | Option | Meaning |

    | :--- | :--- |

    | -g | Indicates that a global profile variable is to be displayed, set, or removed.
    |

    | -gl | Indicates that a global profile variable stored in LDAP is to be displayed,
    set, or removed. This option is only effective if the registry variable DB2_ENABLE_LDAP
    has been set to YES. |

    | -i | Indicates that an instance profile variable is to be displayed, set, or
    removed. |

    | -all | Indicates that all occurrences of the registry variable, as defined in
    the following, are to be displayed: The environment (denoted by [-e]) The node-level
    registry (denoted by [-n]) The instance-level registry (denoted by [-i]) The global-level
    registry (denoted by [-g]) |

    | -null | Indicates that the value of the variable at the specified registry level
    is to be set to NULL. |

    | -r | Indicates that the profile registry for the given instance is to be reset.
    |

    | -n | Indicates that a remote DB2 Administration Server instance name is specified.
    |

    | -u | Indicates that an authentication ID that will be used to attach to the
    DB2 Administration Server instance is specified. |

    | -p | Indicates that a password for the authentication ID is provided. |

    | -l | Indicates that all instance profiles will be listed. |

    | -lr | Indicates that all registry variables supported will be listed. |


    ## Table 2 db2set command options (page 2 of 2)


    | Option | Meaning |

    | :--- | :--- |

    | -v | Indicates that the db2set command is to be executed in verbose mode. |

    | -ul | Accesses the user profile variables. (This parameter is supported only
    on Windows operating systems.) |

    | -ur | Refreshes the user profile variables. (This parameter is supported only
    on Windows operating systems.) |

    | -h | ? | Displays help information. When this option is specified, all other
    options are ignored, and only the help information is displayed. |


    It is important to note that if the db2set command is executed without options,
    a list containing every registry variable that has been set for the current (default)
    instance, along with its value, will be returned.


    Thus, if you wanted to find out which registry variables have been set for each
    profile, you could do so by executing a db2set command that looks like this:


    ```

    db2set -all

    ```


    On the other hand, if you wanted to see the current value of the DB2_PARALLEL_IO
    registry variable for all DB2 instances, you could do so by executing a db2set
    command that looks something like this:


    ```

    db2set -l DB2_PARALLEL_IO

    ```


    And finally, if you wanted to assign the value 8 to the DB2_PARALLEL_IO registry
    variable for all DB2 instances on a server, you could do so by executing a db2set
    command that looks something like this:


    ```

    db2set -g DB2_PARALLEL_IO=8

    ```


    Another way to view and/or change registry settings is by using a tool known as
    the DB2 Registry management tool. The DB2 Registry management tool is activated
