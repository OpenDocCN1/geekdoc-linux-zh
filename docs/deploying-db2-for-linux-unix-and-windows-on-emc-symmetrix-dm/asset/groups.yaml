    # EMC Foundation 产品


    ## 2.8 EMC PowerPath


    EMC PowerPath 是一种基于主机的软件，与网络系统协同智能管理 I/O 路径。PowerPath 管理到存储阵列的多条路径。支持多路径能够在路径故障中恢复，因为
    PowerPath 会自动检测路径故障并将 I/O 重定向到其他可用路径。PowerPath 还可以使用复杂的算法为用户可以设置的多种管理策略提供动态负载均衡。在
    PowerPath 的帮助下，管理员能够确保路径对存储具有高可用访问性，并获得最佳性能。


    PowerPath 路径管理的一个关键特性是动态多路径负载均衡。没有 PowerPath，管理员必须静态地对路径进行负载均衡以提高性能。根据当前使用情况，管理员可能会在一条路径上配置三个高频使用的逻辑设备，在第二条路径上配置中度使用的逻辑设备，在第三条路径上配置
    20 个低频使用的逻辑设备。随着 I/O 路径的变化，这些静态配置的路径可能会变得平衡，导致性能受损。此时管理员必须重新配置路径，并响应主机与存储系统之间
    I/O 流量的变化继续重新配置。


    PowerPath 设计用于并发使用所有路径，它将逻辑设备的 I/O 请求分发到所有可用路径上，而不是要求单条路径承担整个 I/O 负担。PowerPath
    可以将所有逻辑设备的 I/O 分配到这些逻辑设备共享的路径上，使所有路径达到均匀平衡。PowerPath 基于主机的基础平衡 I/O，并维护所有 I/O 路径的统计数据。对于每个请求，它根据负载均衡和故障转移策略选择负载最小的可用路径。除了提高
    I/O 性能外，动态负载均衡减少了管理时间和机时间，因为管理员不再需要管理逻辑设备的路径。使用 PowerPath，可以动态更改单个设备的路径配置和策略，立即生效且不对应用程序产生任何中断。


    PowerPath 提供以下功能和优势：


    - 多路径，提高可用性和性能 —— PowerPath 支持逻辑设备与主机总线适配器（HBA，主机发布 I/O 请求的设备）之间的多路径。拥有多路径使得即使特定路径不可用，主机也能访问逻辑设备。此外，多路径可以共享逻辑设备的
    I/O 负载。

    - 动态多路径负载均衡 —— PowerPath 持续 I/O 均衡提升了主机管理重负载 I/O 负载的能力。PowerPath 根据负载的变化动态调整路径性能，消除了重复静态配置的需要。

    - 主动 I/O 路径测试和自动路径恢复 —— PowerPath 定期测试故障路径以确定其可用。当路径恢复时，PowerPath 会自动恢复到 I/O。它还会定期测试可用路径以确保其运行正常。

    - 自动路径故障转移 —— PowerPath 自动将故障 I/O 路径的数据重定向到备用路径。这消除了应用程序停机；故障转移是透明的且对应用程序无干扰。

    - 增强的高可用集群支持 —— PowerPath 在集群环境中特别有利，因为它可以防止操作中断和昂贵的停机。PowerPath 的路径故障转移能力在路径断开时（只要有其他路径）可以避免节点故障转移，保持活动节点的无中断支持。

    - 一致拆分 —— PowerPath 允许用户通过在前景拆分期间在主机级挂起设备写入秒来执行一致拆分。PowerPath 软件提供了挂起和恢复能力，避免了在未先静默数据库的情况下拆分相关
    BCV 时可能出现的不性和重启问题。

    - 一致性组 —— 一致性组是 Symmetrix 设备的复合组，经过特殊配置以同步动作，维护由开放系统主机计算机控制的跨多个 SRDF 阵列的数据库完整性。


