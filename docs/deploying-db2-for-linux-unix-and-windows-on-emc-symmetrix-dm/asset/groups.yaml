    # 在 EMC Symmetrix DMX 上部署适用于 Linux、UNIX 和 Windows 的 DB2 9.5 数据库


    “在 EMC Symmetrix DMX 存储上部署适用于 Linux、UNIX 和 Windows (LUW) 的 DB2数据库的最佳方法是什么？”这是考虑迁移到
    IBM 最新版本 DB2 的 EMC 经常提出的问题。IBM 对于 SAN 环境下部署 DB2 LUW 有一些基本指南；然而，在 Symmetrix DMX
    上设计数据库布局时，需要深入理解数据库的需求，并结合所用主机和存储环境的知识。


    本章旨在为在 EMC Symmetrix DMX 阵列上布局 DB2 LUW 数据库提供建议，并传递 IBM 在 SAN 环境中部署 DB2 LUW 数据库的基本指南。本章还将为您提供许多
    DB2 LUW 存储相关环境注册变量和配置参数的建议设置。主题包括：


    - 3.1 性能设计...... 96

    - 3.2 RAID 100

    - 3.3 条带 (Striping) 104

    - 3.4 影响 DB2 数据库性能的布局考虑因素 ...... 108

    - 3.5 其他布局考虑因素...... 111

    - 3.6 在 Symmetrix DMX 上部署 DB2 9.5 数据库的建议 ... 113

    - 3.7 当存储容器位于 RAID 设备上时优化表空间性能 118

    - 3.8 远程复制考虑因素 ...... 126


    ## 3.1 性能设计


    在 Symmetrix DMX 上设计任何布局的主要目标是最大化 I/O 在阵列组件之间的分布，从而减少或消除系统中任何潜在的瓶颈。在 Symmetrix
    DMX 阵列内部，有许多需要考虑的领域：


    - 前端连接：包括来自 Symmetrix DMX 的连接数以及使用的光纤通信基础设施（即点对点、光纤通道环路或通过光纤交换机进行 Fabric 连接）。

    - 缓存：所有 I/O 请求都通过 Symmetrix DMX 上的缓存。因此，如果缓存量不足，I/O 可能会受到不利影响。

    - 后端：包括后端控制器的数量以及所用物理磁盘磁柱的数量和特性（即速度和大小）。需要合理布局数据以确保满意的性能。


    ### 3.1.1 前端连接


    前端连接的优化需要理解在主机与 Symmetrix DMX 之间传输的 I/O 请求（包括读和写）的数量和大小。每个前端控制器端口、前端控制器处理器和前端控制器板能够处理的
    I/O 数量是有限制的。此外，SAN 扇出数（即通过光纤交换机连接到单个前端端口的主机数量）也需要仔细管理。


    在优化前端性能时，必须决定以下特性中哪些最重要：


    - 每秒读输出操作数 (IOPS)

    - 吞吐量 (MB/s)

    - IOPS 和吞吐量的结合


    在在线事务处理 (OLTP) 数据库应用程序中，I/O 通常是较小且随机的，IOPS 是最重要的因素。在决策支持系统 (DSS) 中，事务通常执行大型顺序扫描或索引扫描，吞吐量是更关键的因素。在某些数据库环境中，需要对类
    OLTP 和类 DSS 的 I/O 进行比较。为每种环境优化性能通常需要更改所使用的 DB 表大小。


    在 Symmetrix DMX 上，通过使用 4 KB (4096 字节)的小页大小可以获得最大的 IOPS。因此，对于 OLTP 应用，通常使用的页大小为
    4 KB 或 8 KB，Symmetrix DMX 提供更高的 IOPS，但吞吐量较低。DSS 应用的情况则相反，其通常使用较大的页大小（16 KB 或 32
    KB）。当使用 32 KB 的页大时，Symmetrix DMX 提供更高的吞吐量，但 IOPS 较低。


    到 Symmetrix DMX 的每个光纤通道连接都能提供一定量的吞吐量（单位 MB/s）。在实践中，每个通道的可用吞吐量远低于标值（由于开销），并取决于
    I/O 大小。因此，将总吞吐量规划为最大值的 70% 是一种良好的做法，并将确保 Symmetrix DMX 与主机之间的连接有可用带宽。增加来自主机的 I/O
    大会减少可以执行的 IOPS 数量，但会增加通道上的整体吞吐量 (MB/s)。


    ### 3.1.2 缓存


    缓存由于 Symmetrix 性能中起着重要作用，因为它在全局主机与物理存储之间的数据传输中起着介质作用。Symmetrix DMX 系统基于这样一个原理：与总子系统存储容量相比，任何给定时刻的数据工作集都是相对较小的。因此，如果可用缓存足够，工作集位于缓存中，性能将显著提高，因为内存的读写远快于磁盘的读写。实际实现的性能取决于以下原则：


    - 引用局部性：如果某条信息被使用，则其附近的信息稍后可能会被使用。

    - 数据重用：如果某条信息被使用，很快可能会被重用。


    在 Symmetrix DMX 系统中，通道控制器和磁盘控制器共享全局内存（缓存）通道控制器连接到 CPU 和全局内存，而磁盘控制器连接到全局内存和物理磁盘。称为基于缓存
    (TBC) 的特殊算法将全局内存分为数百个槽位，使用 4 字节表示每个槽位，属性包含系统上次访问槽位的时间、是否等待写入等。


    当通道控制器接收到主机的请求时，它检查全局内存目录表以查看请求的数据是否已在缓存中。如果找到了请求的数据，通道控制器将其传输到主机（通过通道接口）并更新全局目录表。然而，如果内存中未找到请求的数据，Symmetrix
    DMX 使用最近最未使用 (LRU) 算法确定哪些数据将被丢弃以腾出空间。然后，磁盘控制器从磁盘检索数据存储在全局内存中并向通道控制器发送信号数据数据就绪。最后，通道控制器从缓存中检索数据并传输到主机。由于，由于请求的数据不在全局内存中，Symmetrix
    必须在磁盘上搜索数据并传输到缓存，这为读取操作增加了寻道延迟。


    当通道控制器接收写入写入时，它尝试将块存储在一个或多个缓存槽位中。如果槽位可用，输入的数据移动到标记为“等待写入”的槽位，并向主机发送确认。在随后的某一点，磁盘异步地从缓存中导出数据。（这取决于整体系统磁盘活动和缓存的可用性）。如果缓存槽位不可用，磁盘控制器立即将所有等待写入的数据分离到磁盘。（Symmetrix
    系统在此过程中使用处理器管理扇区）。一旦可用足够的全局内存空间，通道控制器继续将块直接存储在缓存槽位中。

    '
