    ## 1.2.4 命令行处理器 (Command Line Processor)


    命令行处理器 (CLP) 是一个面向文本的应用程序，允许用户发布 DB2 命令、系统命令和 SQL 语句，并查看执行语句/命令的结果。命令行处理器可以用三种模式运行。


    - **命令模式。** 当命令行处理器以命令模式运行时，用户只需在系统提示符处通过 "db2" 字符输入 DB2 命令或 SQL 语句。例如，命令 "CONNECT
    TO sample"。如果命令包含对所用系统具有特殊含义的字符，必须用引号括起来以确保其正确执行（例如，`db2 SELECT COUNT(*) FROM
    employee`）。如果要执行的单行命令过长无法容，可以在行尾放置一个空格后跟行延续连接符 (^)，这样命令的其余部分就可以新行继续。


    - **交互模式。** 当命令行处理器以交互式输入模式运行时，系统会自动提供 "db2" 前缀（特征为每个执行的命令/SQL 语句显示 `db2 =>` 输入提示符）。要在交互输入模式下运行命令行处理器，只需在系统提示符处输入命令
    "db2"。要退出交互模式，在命令行处理器提示符处输入命令 "quit"。除此之外，适用于命令行处理器命令模式的规则也适用于交互输入模式。


    - **批模式。** 当命令行处理器处于批模式时，假设所有要执行的命令和 SQL 语句都存储在一个 ASCII 格式的文本文件中。运行批处理时，命令 "db2"
    不应放在存储在该文件中的命令/语句之前。要在批模式下运行命令行处理器，只需在系统提示符处输入命令 "db2 -f xxxxxxx”（其中 xxxxx 是包含要执行命令集的文件名）。


    图 6 显示了命令行处理器在 Windows 服务器上处于交互输入模式下的外观。


