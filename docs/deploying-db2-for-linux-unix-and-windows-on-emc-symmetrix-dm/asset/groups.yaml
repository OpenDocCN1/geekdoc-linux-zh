    ## 3.4.3 Maximizing data distribution across the back end


    Earlier, we saw that instead of storing data on one physical drive, data should
    be evenly distributed across many Symmetrix DMX physical disk spindles as possible.
    By spreading data across the back end of the Symmetrix, I/O bottlenecks in any
    one component can be minimized or eliminated.


    With recent improvements in the Symmetrix DMX components like faster CPUs and
    Direct MX architecture, the most common bottleneck encountered in new implementations
    is contention, either on the back-end directors or on the disk spindles. To reduce
    such contention issues, a detailed examination of the I/O requirements for each
    application that will utilize the Symmetrix storage should be made. And using
    information gained during this analysis, a detailed layout that balances the anticipated
    I/O requirements across both back-end directors and physical spindles should be
    developed.


    Many methods for optimizing layout on the back-end directors and spindles are
    available, for example:


    - One method involves creating a map (using a software package like Microsoft
    Excel) of the hypervolumes by physical storage and physical spindle, from information
    gathered through the EMC ControlCenter². Using this map of the back end and information,
    preferably categorized by I/O requirement (high/medium/low, or by anticipated
    rates), the physical data can be evenly spread across the directors and physical
    spindles. Unfortunately, the map produced can be extremely complex and the whole
    process can be time-consuming. Additional complexity is added when RAID 5 or RAID
    6 hypervolumes are utilized in the configuration. Since each hypervolume spans
    multiple physical spindles in these environments, the information gained by uniquely
    mapping out the I/O is not worth the time and effort involved.


    - Another approach is to rank each of the volumes available to anticipate I/O.
    Once ranked, each element may be assigned a hypervolume, or on the back end. Since
    BIN file creation tools may always spread contiguous hypervolume numbers across
    different elements of the back end, this approach usually provides a reasonable
    spread of I/O across the spindles and back-end directors available in the Symmetrix
    DMX Optimizer, this method of spreading the I/O is normally effective in maximizing
    the I/O across all DMX components.


    ## 3.4.4 Minimizing disk head movement (seek time)


    Earlier, we saw that head movement (referred to as seek time) continues to be
    the largest source of latency in disk assemblies using the entire disk. Disk latency
    is caused by interface or rotational speeds cannot be controlled by layout considerations;
    however latency caused by long seek times can be. (The only disk drive performance-related
    characteristic onto specific, higher performing areas of the drive.) Therefore,
    when designing the storage layout for a DB2 LUW database on a Symmetrix DMX, it
    is important to keep head movement to a minimum by positioning high I/O data in
    adjacent hypervolumes on the physical disk used.


    Utilizing a documented map of the back-end spindles, high I/O data can be placed
    on the physical spindles that they are grouped together. Recommendations differ
    as to placing the I/O data on other parts of the spindle (that is, the highest
    performing parts of a physical spindle) or in the center of a spindle is best.
    Therefore, since there is no consensus, the historical recommendation of putting
    I/O data on the outer part of the spindle is still a reasonable suggestion: placing
    high I/O data together on the outer parts of the spindle should help to reduce
    head movement when reading and writes to each hypervolume on the spindle, thereby
    improving overall performance.


    ## 3.5 Other layout considerations


    Aside from the layout considerations described in the previous sections, a few
    additional factors may be important to DBAs or storage administrators who want
    to optimize performance for DB2 LUW databases on Symmetrix DMX arrays. Some additional
    factors to take into account include:


    - Planning for disaster recovery using SRDF/S.

    - Planning for creating database copies using TimeFinder/Mirror, TimeFinder/Clone,
    or TimeFinder/Snap.


    ### 3.5.1 Using synchronous SRDF


    There are two primary concerns that must be considered when synchronous SRDF (SRDF/S)
    will be used for database disaster recovery. The first is the inherent latency
    that is added for each write operation. This latency occurs because each write
    must be written to the cache on both the local and the remote Symmetrix DMX before
    an acknowledgement can be sent to the host.


    The second is centered around stripping. Each hypervolume configured in a Symmetrix
    is only allowed to send one I/O across the SRDF link at a time. Performance degradation
    results when multiple I/Os are written to a single hypervolume, whereas subsequent
    writes must wait for predecessors to complete. This performance degradation is
    seen primarily with transaction strip writes to the logs which are synchronous
    with the application thread. Striping at the host level for active logs can be
    particularly helpful in these situations; using host level striping for transactions,
    a stripe size of 32 KB is recommended (Host level stripping is not recommended
    for table containers because buffer pooling is performed asynchronously to the
    application thread.) It is also recommended that page contents align whenever
    possible - page results result in increased latency.


    It is prudent to organize database storage in such a way to facilitate recovery.
    Array replication techniques copy volumes at the disk level (as well as the host),
    all storage containers used by a DB2 LUW database should be created on a set of
    disks dedicated to the database; sharing disks with other applications can cause
    unnecessary work for the array and may result in wasted space on the target volumes.
    (For UNIX, ensure that the containers are in a volume group that is dedicated
    to the database.)


    In addition to isolating database to its own dedicated logs, the active logs and
    any archived logs associated with the database should be stored in separate volumes.
    This division allows the database and its logs to be manipulated independently
    if a recovery operation becomes necessary.


    ### 3.5.2 Using TimeFinder/Mirror


    Database replication is useful when DBAs wish to create backup images or copies
    of a database. A common question when laying out a database on Symmetrix is whether
    BCVs should share the same physical spindles as production data or whether they
    should be isolated on separate set of disks.


    The primary benefit of spreading BCVs across all available spindles is the reduction
    of contention. Workloads that utilize BCVs, such as backups, may generate high
    I/O; spreading this workload across more spindles can significantly improve performance.
    Another drawback is that BCVs on the same spindles can have a negative impact
    on performance, because of increased seek times.


    The appropriate location for BCVs is dependent on user preference and anticipated
    workload. In general, it is recommended that BCVs share the same physical spindles
    as production data. However, in cases where the BCV synchronization and utilization
    will negatively impact applications (for example, databases that must be available
    24/7 and have high I/O requirements), it may be beneficial for BCVs to be stored
    on their own physical spindles.


    ### 3.5.3 Using TimeFinder/Clone


    TimeFinder/Clone provides many of the benefits of full volume replication techniques
    as TimeFinder/Mirror without taking a hardware mirror position. However, two performance
    considerations must be taken into account when using TimeFinder/Clone. The first
    is Copy On First Write (COFW), arises from the need for data to be copied from
    the source hypervolumes to the target hypervolumes as data is changed on the source
    hypervolumes. This penalty affects only writes to the source hypervolumes. The
    second potential penalty happens when TimeFinder/Clone target volumes are read
    and tracks that have not yet been copied to the target hypervolume have to be
    read from the source hypervolumes. This additional load on the source hypervolumes
    can negatively impact performance on heavily loaded systems. Both of these penalties
    can be largely eliminated through the use of precopy capacity of TimeFinder/Clone.


    ### 3.5.4 Using TimeFinder/Snap


    TimeFinder/Snap provides many of the benefits of full volume replication techniques
    such as TimeFinder/Mirror or TimeFinder/Clone, but at greatly reduced source cost.
    However, two performance considerations must be taken into account when using
    TimeFinder/Snap. The first, Copy On First Write (COFW), arises from the need for
    data to be copied from the production hypervolumes to the "Save" area as data
    is changed. Fortunately, this penalty affects only writes to the source volumes.
    The second potential penalty happens when TimeFinder snapshots are accessed. Tracks
    that have not been copied to the "Save" area have to be read from the source volumes.
    This additional load on the source volumes can negatively impact performance on
    heavily loaded systems.

