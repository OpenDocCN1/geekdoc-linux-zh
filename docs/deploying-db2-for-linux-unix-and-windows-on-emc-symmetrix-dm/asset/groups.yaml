    ## 3.7.5 空间预取大小 (Space prefetch size)


    当从 DB2 LU 数据库检索一个或少数几个连续页时，数据会一次一次从存储传输到内存。当需要大量数据时，DB2 会从磁盘检索一个或多个额外的页面，预期这些页面也将会被需要。这种行为被称为预取（prefetching），将索引和数据页预取到内存中可以通过减少
    I/O 等待时间提高性能。


    与区（extent）一样，表的预取大小是在表空间创建过程中定义的；与区不同的是，表的预取大小在表空间填充后可以更改。在决定使用什么最佳预取大小时，最好且最方便的方法是让
    DB2 数据库管理器做出决定。这通过将表空间预取大小配置参数分配 `AUTOMATIC`，或者在创建新表空间时为 `db_prefetch_size` 参数分配
    `AUTOMATIC` 值来实现。例如，创建一个名为 `_TBSP_` 的 DBMS 空间，让 DB2 数据库管理器决定使用的最佳预取大小，你需要执行如下所示的
    `CREATE TABLESPACE` 语句：


    ```sql

    CREATE TABLESPACE my_tsp

    MANAGED BY DATABASE

    USING FILE ''/home/my_tsp.dat'' EXTENT 2M

    PREFETCHSIZE AUTOMATIC

    ```


    如果以此方式创建表，DB2 将通过求解以下方程确定使用的最佳预取大小（并定期更新该值）：


    - 预取大小 = 表空间容器数 * 每个容器的物理磁盘数 * 区的大小


    每个容器的物理磁盘数默认为 1，除非通过 `DB2_PARALLEL_TO_registry` 变量指定了不同的值。


    ## 3.7.6 开销 (Overhead)


    开销指的是 I/O 开销以及磁盘延迟时间，其中包括磁盘寻道时间（以毫秒计），用于在查询优化期间确定 I/O 成本。对于使用 DB2 9 或更高版本创建的数据库，默认的
    I/O 控制器和磁盘寻道及延迟时间为 7.5 毫秒。对于从之前的 DB2 版本迁移到 9 或更高版本的数据库，默认值为 12.67 毫秒。


    可以使用以下公式帮助估计开销成本：


    > 开销 = 平均寻道时间（毫秒） * (0.5 * 旋转延迟)


    其中 0.5 代表半次旋转开销，旋转延迟按每次完整旋转的毫秒数计算，如下：


    ```

    (1 / RPM) * 60 * 1000

    ```


    （此处你除以每分钟旋转数得到每旋转旋转，乘以每分钟 60 秒，最后乘以每秒 1,000 毫秒。）


    例如，如果驱动器的额定为 7,200 rpm，其旋转延迟计算如下：


    ```

    (1 / 7200) * 60 * 1000 = 8.328 毫秒

    ```


    当存储容器位于 RAID 设备上时优化表空间性能


    假设此磁盘的平均寻道时间为 11 毫秒，则开销的计算如下：


    ```

    Overhead = 11 + (0.5 * 8.328)

    = 15.164 毫秒

    ```


    表 12 显示了 Symmetrix DMX 存储阵列的建议开销值。


    | 磁盘容量 | 开销 |

    |---|---|

    | 73 GB - 10,000 rpm | 8.6 ms |

    | 73 GB - 15,000 rpm | 5.6 ms |

    | 146 GB - 10,000 rpm | 8.6 ms |

    | 146 GB - 15,000 rpm | 5.6 ms |

    | 73 GB / 146 GB - 闪存驱动 | 0.0 ms |


    ## 3.7.7 传输率 (Transfer rate)


    传输率是指将一个页读入内存所需（毫秒）。此值也用于确定 I/O 查询优化的成本。对于使用 DB2 LU 9 或更高版本创建的数据库，将一个页读入内存的默认时间为
    0.06 毫秒。对于从之前的 DB2 版本迁移到 9 或更高版本的数据库，默认值为 0.18 毫秒。


    如果每个表容器都是物理磁盘，你可以使用以下公式估计每页的毫秒传输成本：


    ```

    Transfer rate = (1 / Spec_rate) * 1000 / 1024000 * Page size

    ```


    （其中 `Spec_rate` 代表传输率的磁盘规格，单位为 MB/秒，乘以每秒 1000 毫秒，除以每 MB 1,024,000 字节，乘以字节单位的页大小。）


    例如，如果磁盘驱动器的规格率为 3 MB/秒且使用 4K 的页大小，传输率可以计算为：


    ```

    Transfer rate = (1 / 3) * 1000 / 1024000 * 4096

    = 每页 13.3332 毫秒

    ```


    如果表容器不是物理磁盘，而是磁盘阵列（例如 RAID），则在尝试确定合适的传输率时必须考虑额外的因素。如果阵列较小，你可以将磁盘规格传输率 (`Spec_rate`)
    乘以使用的磁盘数量，假设瓶颈在磁盘层面。然而，如果阵列中的磁盘数量很大，瓶颈可能不在磁盘层面，而是在其他 I/O 子系统组件之一上，例如磁盘控制器、I/O
    总线或系统总线。在这种情况下，你不能假设 I/O 吞吐能力是磁盘规格传输率与磁盘数量的乘积。相反，你必须在顺序扫描期间测量实际 I/O 速率（MB/s），并将结果除以组成表空间的容器数量。


    例如，对于具有四个容器的表空间的表，测得顺序 I/O 速率为 100 MB/秒，意味着每个容器 25 MB/秒，或者传输率为 (1/25) * 1000 /
    1024000 * 4096 = 每页 163.84 毫秒。


    表 13 显示了对称存储阵列的建议传输率。


    | 磁盘容量 | 4 KB 页 | 8 KB 页 | 16 KB 页 | 32 KB 页 |

    |---|---|---|---|---|

    | 73 GB - 10,000 rpm | 8.6 ms | 4.3 ms | 2.2 ms | 1.1 ms |

    | 73 GB - 15,000 rpm | 5.6 ms | 2.8 ms | 1.4 ms | 0.7 ms |

    | 146 GB - 10,000 rpm | 8.6 ms | 4.3 ms | 2.2 ms | 1.1 ms |

    | 146 GB - 15,000 rpm | 5.6 ms | 2.8 ms | 1.4 ms | 0.7 ms |

    | 73 GB / 146 GB - 闪存驱动 | 0.0 ms | 0.0 ms | 0.0 ms | 0.0 ms |


