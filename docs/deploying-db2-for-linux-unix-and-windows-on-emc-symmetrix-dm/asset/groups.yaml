    - 基础（Basic）。基础视图显示数据库、表、视图和存储过程等基本对象，并限制了你对这些对象可以执行的操作。如果你只想执行核心的 DB2 数据库操作，则应使用此视图。

    - 高级（Advanced）。高级视图显示控制中心中的所有可用对象，并允许你执行所有可用操作。如果你在企业环境中工作和/或如果你想连接到 DB2 for i/OS
