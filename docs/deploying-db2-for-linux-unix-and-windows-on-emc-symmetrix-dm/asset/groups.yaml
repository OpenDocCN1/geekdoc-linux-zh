- md: '

    Note: The default configuration for SRDF/A is for the values to be at most two
    cycles behind the data state of the source volumes. In the default configuration
    for SRDF/A, this would equate to 60 seconds.


    SRDF/A provides a long-distance replication solution with minimal impact on performance
    that preserves data consistency within application data in the specified business
    process. This level of protection is intended for DR environments that always
    need a restartable copy of data at the R2 site. Dependent-write consistency is
    guaranteed on a delta set. In the event of a disaster at the R1 site or if SRDF
    links are lost during data transfer, a partial delta of data will be discarded.
    This preserves consistency on the R2 with a maximum data loss of two SRDF/A cycles.


    ## 2.5.8.1 Enabling SRDF/A


    To set remotely mirrored pairs the prod group to the asynchronous mode (SRDF/A),
    enter:


    ```

    symrdf -g <device_group> set mode async -noprompt

    ```


    ## 2.5.8.2 SRDF/A benefits


    SRDF/A mode provides the following features and benefits:


    - Lower operational costs for long-distance data replication with application
    consistency.

    - Promotes efficient link utilization, resulting in lower link bandwidth.

    - Maintains a dependent-write consistent, point-in-time image on the R2 devices
    at all times.

    - Supports all current SRDF topologies, including point-to-point and switched
    fabric.

    - Operates at any distance without adding response time to the R1 host.

    - Includes all hosts and data emulation types supported by the Symmetrix array
    (such as FBA, CKD, and AS/400).

    - Minimizes the impact imposed on the back-end devices.

    - Provides an application response time equivalent to writing to local non-SRDF
    devices.

    - Allows restore, failover, and failback capability between the R1 and R2 sites.


    ## 2.5.8.3 SRDF/A capable devices


    A listing of SRDF/A capable devices is displayed with the following command:


    ```

    symrdf list -rdffa

    ```


    ## 2.5.8.4 SRDF/A session status


    When asynchronous mode is set for a group of devices, the SRDF/A capable devices
    in the group are considered part of the SRDF/A session. To check SRDF/A session
    status, use either of the following commands:


    ```

    symdg show <device_group>

    symcg show <composite_group>

    ```


    The session status is displayed as active or inactive:


    - Inactive - The SRDF/A devices are either ready or not ready on the link

    - Active - The SRDF/A mode is activated and the SRDF/A session data is currently
    being transmitted in operational cycles to the R2.


    ## 2.5.9 EMC SRDF/Cluster Enabler solutions


    EMC SRDF/Cluster Enabler (SRDF/CE) for MSCS is an integrated solution that combines
    SRDF and clustering protection over distance. EMC SRDF/CE provides disaster-tolerant
    capabilities that enable a cluster to span geographically separated Symmetrix
    systems. It operates as a software extension (MMC snap-in) to the Microsoft Cluster
    Service (MSCS). SRDF/CE achieves this capability by exploiting SRDF disaster restart
    capabilities. SRDF allows the MSCS to have two identical sets of application data
    in two different locations. When cluster systems are failed over or failed back,
    SRDF/CE is invoked automatically to perform the SRDF functions necessary to enable
    the requested operation.


