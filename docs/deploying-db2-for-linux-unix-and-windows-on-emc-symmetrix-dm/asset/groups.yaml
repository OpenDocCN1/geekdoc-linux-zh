    ```


    用第二次查询的结果减去第一次查询的结果，并除以监控窗口内的秒数。如果提交率低于每秒一次，建议将 `mincommit` 设置为 1；如果提交率大于每秒三次，则为
    `mincommit` 配置参数分配一个大于 1 的值可能会提高性能。需要此的是，`mincommit` 数据库配置参数对 AIX 5.2 及更高版本无效，且从
    DB2 8.1 FixPack4 开始，将 `mincommit` 参数值大于 1 对 DB2 的执行没有影响。


    ### 3.8.3 临时表复制


    临时表主要用于存储临时数据和 SQL 排序的中间结果，并为系统执行排序和数据分组等操作提供存储区域。存储在临时表中的数据更改通常不需要复制到远程复制。如果能够在不损害数据库一致性的情况下减少需要传输的数据量，就可以减少远程复制所需的带宽并实现性能提升。


    为了防止复制存储在临时表空间中的数据，应将系统临时表空间和用户临时表空间隔离到未进行复制的 LUN 上。这些 LUN 仅应为临时表数据设计，而不应包含远程站点所需的任何信息。不将临时表数据复制到远程站点的一个影响是，本地和远程站点都将拥有未复制的临时表空间，而这些空间必须重新创建。这是通过在复制站点启动数据库，使临时表空间处于“等待删除”（Drop
    Pending）状态，然后创建每个预期的临时表空间来实现。可以通过执行如下 `RESTART DATABASE` 命令来使数据库启动或处于“等待删除”状态：


    ```sql

    RESTART DATABASE (Alias) DROP PENDING TABLESPACES ( <TableName>, )

    ```


    其中：


    - DBAlias — 通过别名识别要以“数据库等待”（Database Pending）状态启动的数据库。

    - TableName — 识别要置于“等待删除”状态的一个或多个表空间。


    如果您想启动名为 TEMPSPACE 的数据库并将一个临时表名置于“等待删除”状态，可以执行如下 `RESTART DATABASE` 命令：


    ```sql

    RESTART DATABASE sample DROP PENDING TABLESPACES (tablespace)

    ```


    一旦数据库成功启动，您可以使用 `DROP` SQL 语句删除每个置于“等待删除”状态的表空间，并使用 `CREATE TABLESPACE` 语句重新创建它们。


    远程复制的考虑因素


    适用于 Linux、UNIX 和 Windows 的 DB2 企业服务器版 (ESE) 的一个非常实用的特性是其可扩展性；通过 DB2 ESE，数据库管理员有能力创建所谓的“多分区（或分区）数据库”。多分区数据库是一种配置已配置为使用通用组件（即数据库分区功能
    (DPF)）将其数据分发在两个或多个多分区数据库上的数据库。（要利用 ESE 的 DPF 优势，用户必须同时拥有 DB2 ESE 许可证和 DPF 许可证。）数据库分区本质上是大型数据库的一个小部分，像独立数据库一样运行。


    正如您所想象的，多分区数据库比单分区数据库更复杂。本章旨在为您提供多分区数据库的概述，并提供关于在 EMC Symmetrix DMX阵列上布局 DB2 LUW
    分区数据库的建议。主题包括：


    - 4.1 分区 DB2 数据库环境...........................................................
    130

    - 4.2 创建分区数据库...............................................................131

    - 4.3 跨分区数据平衡................................................................133

    - 4.4 共享磁盘考虑因素........................................................... 135

    - 4.5 不共享磁盘的挑战...............................................................136

    - 4.6 共享全阵列上的“无共享”设计.......................... 137

    - 4.7 分区数据库特定建议.............................................. 139

    - 4.8 多个数据库分区组共享磁盘 ................. 140

    - 4.9 多个分区数据库共享磁盘...................................... 141


    ## 4.1 分区 DB2 数据库环境


    顾其实义，分区数据库是跨越两个或多个数据库分区的数据库，允许数据分布在所使用的每个分区上。有时，一个数据库节点或 DB2 数据库分区包含其自己的数据、索引、配置文件和事务日志文件，并且仅是更大型数据库的一部分。数据检索和更新请求会自动分解为子请求，并在所有相关的数据库分区之间并行执行。数据库跨越多个数据库分区的特性对于使用
    SQL 语句的用户来说是透明的。


    在大多数分区数据库环境中，每个数据库分区都位于自己的物理工作站（服务器）上，并拥有自己的处理器、内存和磁盘。正因如此，该环境被称为“无共享”环境，因为分区之间不共享内存和存储器。相反，数据库分区通过名为通信管理器的通信设施相互连接。图
    39 阐了一个典型的 LUW 环境。（注：根据提供的源文件，文本在此处结束）。


