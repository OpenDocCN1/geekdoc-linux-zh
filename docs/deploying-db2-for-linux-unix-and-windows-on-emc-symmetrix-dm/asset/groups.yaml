    ## 1.2.3 The Configuration Assistant


    The Configuration Assistant is an interactive GUI application that allows users
    to configure clients so they can access databases stored on remote DB2 servers.
    In order to access an instance or database on another server/system, that system
    must first be cataloged in the node directory of the client workstation, and information
    about the remote database must be cataloged in the database directory (also on
    the client workstation). The Configuration Assistant provides a way to quickly
    catalog nodes and databases without having to know the inherent complexities involved
    with performing these tasks. And because the Configuration Assistant maintains
    a list of databases to which applications can connect, it can act as a lightweight
    alternative to the Control Center in situations where the complete set of GUI
    tools has not been installed.


    From the Configuration Assistant, users can:


    - Catalog new databases.

    - Work with or uncatalog existing databases.

    - Bind applications.

    - Set DB2 environment/registry variables.

    - Configure the DB2 Database Manager instance.

    - Configure ODBC/CLI parameters.

    - Import and export configuration information.

    - Change passwords.

    - Test connections.


    Figure 5 on page 27 shows how the Configuration Assistant might look on a Windows
    XP server.


    # Introduction to DB2 9.5 for Linux, UNIX, and Windows


    ![](img/9d79d979aef40e6535a55c940991009e_28_0.png)


    Figure 5 The Configuration Assistant


    ## 1.2.4 The Command Line Processor


    The Command Line Processor (CLP) is a text-oriented application that allows users
    to issue DB2 commands, system commands, and SQL statements, as well as view the
    results of the statements/commands executed. The Command Line Processor can be
    run in three modes.


    - **Command mode.** When the Command Line Processor is run in command mode, the
    user simply enters a DB2 command or SQL statement, by the characters "db2", at
    the system prompt. For example, the command "CONNECT TO sample"; If the command
    contains characters that have a special meaning to the system being used, it must
    be enclosed in quotation marks to ensure that it is properly executed (for example,
    `db2 SELECT COUNT(*) FROM employee`). If the command is to be executed on a single
    line that is too long to fit, a space followed by the line continuation character
    (^) can be placed at the end of the line that is, and the rest of the command
    can follow on a new line.


    - **Interactive mode.** When the Command Line Processor is run in interactive
    input mode, the "db2" prefix is automatically provided (as characterized by the
    `db2 =>` input prompt for each command/SQL statement executed. To run the Command
    Line Processor in interactive input mode, you simply enter the command "db2" at
    the system prompt. To exit of interactive mode, you enter the command "quit" at
    the Command Line Processor prompt. Aside from that, the rules that apply to the
    command mode of the Command Line Processor also apply to using the interactive
    input mode.


    - **Batch mode.** When the Command Line Processor is in batch mode, it is assumed
    that all commands and SQL statements to be executed have been stored in an ASCII-format
    text file. To run the Command "db2" should not precede the commands/statements
    stored in that file. To run the Command Line Processor in batch mode, you simply
    enter the command "db2 -f xxxxxxx" (where xxxxxxx is the name of the file that
    contains the set of commands to be executed) at the system prompt.


    Figure 6 shows how the Command Line Processor looks on a Windows server when it
    is in interactive input mode.


    ![](img/9d79d979aef40e6535a55c940991009e_29_0.png)


    Figure 6 The Command Line Processor (in interactive input mode)


    There are various command-line options that can be specified when the Command
    Line Processor is invoked; a list of all options available can be obtained by
    executing the command **LIST COMMAND OPTIONS**, either from the system prompt
    or the Command Line Processor prompt (when the Command Line Processor is ran in
    interactive input mode).


    Deploying DB2 for i.linux, UNIX and Windows on EMC Symmetrix DMX


    ## 1.3 Server, instances, and databases


    DB2 9.5 for Linux, UNIX, and Windows sees the world as a hierarchy of objects.
    Workstations (or servers) on which DB2 has been installed occupy the highest level
    of this hierarchy. During the installation process, program files for a background
    process known as the DB2 Manager are physically copied to a specific location
    on the server and an instance of the DB2 Database Manager is created. (The default
    instance for a particular system is defined by the DB2INSTANCE environment variable
    and this is the instance used for most operations.)


    Instances occupy the second level in the hierarchy and are responsible for managing
    system resources and databases that fall under their control. Although only one
    instance is created initially, several instances can exist. Each instance behaves
    like a separate installation of DB2, even though all instances within a system
    share the same DB2 Manager program files (unless each instance is running a different
    version of DB2). And although multiple instances share the same binary code, each
    runs independently of the others and has its own environment, which can be modified
    by altering the contents of its associated configuration file.


    Every instance controls access to one or more databases; databases manage storage,
    modification, and retrieval of data. Like instances, databases work independently
    of each other. Each database has its own set of grantable authorities and privileges
    to govern how users interact with the data and database objects it controls. From
    a user''s perspective, a database is a collection of tables (preferably related
    in some way) that are used to store data. However, from a database administrator''s
    viewpoint, a DB2 9.5 database is much more; a database is an entity that is comprised
    of many physical and logical components. Some of these components help determine
    how data is organized, while others determine how and where data is stored. Figure
    7 on page 30 shows the hierarchical relationship between systems, instances, and
    databases.


    # Introduction to DB2 9.5 for Linux, UNIX, and Windows


    ![](img/9d79d979aef40e6535a55c940991009e_31_0.png)


    Figure 7 Hierarchical relationship between systems, instances, and databases


    ### 1.3.1 The DB2 Administration Server (DAS) instance


    The tools that come with DB2, such as the Control Center and the Configuration
    Assistant, require a separate instance that operates independently of, yet concurrently
    with, other instances that have been defined for a workstation. For this reason,
    a special instance, known as the DB2 Administration Server (DAS) instance, is
    also created as part of the DB2 installation process. In contrast to other instances,
    only one DAS instance can exist on a single workstation (The DB2 global-level
    profile registry DB2ADMIN contains the name of the DAS instance that has been
    defined for a particular workstation.)


    Once created, the DAS instance runs continuously as a background process whenever
