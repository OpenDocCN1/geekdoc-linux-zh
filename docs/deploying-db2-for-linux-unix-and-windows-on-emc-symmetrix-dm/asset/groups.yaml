    Symmetrix systems in an SRDF configuration, monitoring data propagation from the
    source (R1) devices in a consistency group to their corresponding target (R2)
    devices as depicted in Figure 24. Consistency groups provide integrity protection
    during a rolling disaster.


    ![](img/9d79d979aef40e6535a55c940991009e_71_0.png)


    Figure 24 SRDF consistency group


    A consistency group protection is defined containing volumes X, Y, and Z on the
    source Symmetrix. This consistency group definition must contain all of the devices
    that need to maintain dependent-write consistency and reside on all participating
    hosts involved in I/O to these devices. A mix of CKD (mainframe) and FBA (UNIX/Windows)
    devices can be logically grouped together. In some cases, the entire processing
    environment may be defined in a consistency group to ensure dependent-write consistency.


    The rolling disaster described previously, prevents the replication of changes
    from volume Z to the remote site.


    Since the predecessor log write volume Z cannot be propagated to the remote Symmetrix
    system, a consistency group trip occurs.


    A Group trip holds the writes that could not be replicated on the logically grouped
    devices. The writes are held by PowerPath on UNIX/Windows hosts and IOS on mainframe
    hosts (or by SRDF-ECA for UNIX/Windows and mainframe hosts) long enough to ensure
    I/Os to all of the Symmetrix systems involved in the consistency group. The first
    I/O changes the state of the devices to a suspend-pending state.


    The second I/O performs the suspend actions on the R1 / R2 relationships for the
    logically grouped devices which immediately disables all replication to the remote
    site. All other devices outside of the group to continue replicating, providing
    the communication links are available. After the relationship is suspended, the
    completion of the predecessor write is acknowledged back to the issuing host.
    Furthermore, all writes that were held during the consistency group trip operation
    are released.


    Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX


    # EMC Foundation Products


    After the second I/O per Symmetrix completes, the I/O is released, allowing the
    predecessor log write to complete to the host. The dependent data write is issued
    by the DBMS and arrives at X but is not replicated to the R(X).


    When a complete failure occurs from this rolling disaster, the dependent-write
    consistency at the remote site is preserved. If a disaster does not occur and
    the failed links are activated again, the consistency group replication can be
    resumed. EMC recommends creating a copy of the dependent-write consistent image
    while the remote resume takes place. Once the SRDF process reaches synchronization
    the dependent-write consistent copy is achieved at the remote site.


    ## 2.5.5 SRDF terminology


    This section describes various terms related to SRDF operations.


    ### 2.5.5.1 Suspend and resume operations


    Practical uses of suspend and resume operations usually involve unplanned situations
    in which an immediate suspension of I/O between the R1 and R2 devices over the
    SRDF links is desired. In this way, data propagation problems can be stopped.
    When suspend is used with consistency groups, immediate backups are performed
    over the R2 without affecting I/O from the local host. I/O can then be resumed
    by the R1 and R2 and return to normal operation.


    ### 2.5.5.2 Establish and split operations


    The establish and split operations are normally used in planned situations in
    which use of the R2 copy of the data is desired without interfering with normal
    write to the R1 device. Splitting a point-in-time copy of data allows access to
    the data on the R2 device for various business continuity tasks. The ease of splitting
    SRDF pairs to provide exact database copies makes it convenient to perform scheduled
    backup operations, reporting operations, or new application testing from the target
    Symmetrix data while processing continues on the source Symmetrix system.


    The R2 copy can also be used to test disaster recovery plans with manually intensive
    recovery drills, complex procedures, and application service interruptions. Upgrades
    to new versions can be tested or changes to actual code can be made without affecting
    the online production server. For example, modified server code can be run on
    the R2 copy of the database until the upgraded copy runs with no errors before
    upgrading the production server.


    In cases where absolute real-time copy of the production data is not essential,
    users may choose to split the SRDF pair periodically and use the R2 copy for queries
    and report generation. The SRDF pair can be re-established to provide incremental
    updating of the R2 device. The ability to refresh the R2 device provides the latest
    information for data processing and reporting.


    ### 2.5.5.3 Failover and failback operations


    Practical uses of failover and failback operations usually involve the switch
    business operations from the production site to a remote site (failover) or the
    opposite (failback). Once failover occurs, normal operations continue using the
    remote (R2) copy of synchronized application data. Scheduled maintenance at the
    production site is one example of where failover to the R2 site might be needed.


    Testing of disaster recovery plans is the primary reason to temporarily fail over
    to a remote site. Traditional disaster recovery routines involve customized software
    and complex procedures. Offsite media must be electrically transmitted or physically
    shipped to the recovery site. Time-consuming restores and the application


    EMC Symmetrix Remote Data Facility


    # EMC Foundation Products


    logs usually follow. SRDF failover/fallback operations significantly reduce the
    recovery time by incrementally updating the specific tracks that have changed;
    this accomplishes in minutes what might take hours for a complete load from dumped
    database volumes.


    ### 2.5.5.4 Update operation


    The update operation allows users to resynchronize the R1 after failover while
    continuing to run application services on the R2. This helps reduce the amount
    of time the R1 side takes. The update operation is a subset of failover/fallback
    functionality. Practical uses usually involve situations where R1 becomes almost
    synchronized with R2. The -until option, when used with update, specifies the
    target number of invalid tracks that are allowed to be out of sync before resynchronization
    completes.


    ### 2.5.5.5 Concurrent SRDF


    Concurrent SRDF means having two target R2 devices configured as concurrent mirrors
    of one R1 device. Using a Concurrent SRDF pair allows the creation of two copies
    of the same data at two remote locations. When the two R2 devices are split from
    their source R1, each target site copy can be accessed independently.


    ### 2.5.5.6 R1/R2 swap


    Swapping R1/R2 devices of an SRDF pair causes the source R1 device to become a
    target R2 device and vice versa. Swapping allows the R2 site to take over operations
    while retaining a remote mirror on the original site. Swapping is especially useful
    after failing over an application from the R1 site to the R2 site. SRDF swapping
    is available with Director version 5567 or higher.


    ### 2.5.5.7 Data Mobility


    Data mobility is an SRDF configuration that restricts SRDF devices to operating
    only in adaptive copy mode. This is a lower-cost licensing option that is typically
    used for data migrations. It allows data to be transferred in adaptive copy mode
    from source to target, and is not designed as a solution for DR requirements unless
    used in combination with TimeFinder.


    ### 2.5.5.8 Dynamic SRDF


    Dynamic SRDF allows the creation of SRDF pairs from non-SRDF devices while the
    Symmetrix system is in operation. Historically, source and target SRDF device
    pairing has been static and required assistance from EMC personnel. This feature
    provides greater flexibility in deciding where to copy protected data.


    RA groups can be created in a SRDF switched fabric environment. An RA group represents
    a logical connection between two Symmetrix systems. RA groups were limited to
    those static RA groups defined at configuration time. However, RA groups can now
    be created, modified, and deleted while the Symmetrix system is in operation.
    This provides greater flexibility in forming SRDF-pair-associated links.

