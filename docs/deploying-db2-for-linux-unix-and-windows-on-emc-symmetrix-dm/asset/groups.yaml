    ## 2.5 EMC Symmetrix 远程数据设施


    EMC Solutions En 中的 Symmetrix 远程数据设施 (SRDF) 组件扩展了基本的 SYMCLI 命令集，使用户能够管理 SRDF。SRDF
    是一种业务连续性解决方案，提供与主机无关的镜像存储解决方案，用于将站点数据复制到一个或多个物理隔离的目标 Symmetrix 系统中。简单来说，SRDF 是多个
    Symmetrix 系统的配置，其目的是在多个位置维护逻辑数据的多个副本。


    SRDF 对用户、应用程序、数据库和主机处理器透明，能够将生产环境或主（源）站点的数据同步复制到备用（目标）站点。本地 SRDF 设备（称为源 (R1) 设备）与远程目标
    (R2) 设备配置为伙伴关系。虽然 R2 设备被镜像到远程主机，但在 R2 设备与其 R1 设备同步后，R2 设备可以随时从 R1 设备中拆分，使 R2 设备再次对其主机完全可访问。拆分后，目标
    (R2) 设备包含有效数据，并可以通过其原始数据地址执行连续性任务。


    SRDF 需要配置特定的源 Symmetrix 卷 (R1) 镜像到目标 Symmetrix 卷 (R2)。当 SRDF 在同步模式下运行时，如果主站点无法继续处理，备用站点的数据将实时对应
    I/O 比例。当主系统宕机时，SRDF 能够快速切换到数据的备用副本，使关键信息在几分钟内可用。业务运营和相关应用程序将以最小的中断恢复完整功能。


    图 23 展示了一个基本的 SRDF 配置，其中两个 Symmetrix 之间的连接通过 ESCON、光纤或千兆以太网提供。R1 和 R2 卷之间的连接通过称为
    RA 组的设备逻辑分组实现。RA 组独立于第 68 页第 2.5.3 节“SRDF 设备组和复合组”中定义和讨论的设备和复合组。


    ![](img/9d79d979aef40e6535a55c940991009e_68_0.png)


    图 23 基本同步 SRDF 配置


    ### 2.5.1 SRDF 优势


    SRDF 提供以下功能和优势：


    - 高数据可用性

    - 高性能

    - 灵活的配置

    - 主机和应用程序软件透明性

    - 组件或链路故障的自动恢复

    - 灾难后恢复时间显著减少

    - 提高恢复过程的完整性

    - 降低备份和恢复成本

    - 降低灾难恢复的复杂性、规划、测试等

    - 支持跨越多个服务器和 Symmetrix 系统上的多个数据库的业务连续性


    ### 2.5.2 SRDF 运行模式


    SRDF 目前支持以下运行模式：


    - 同步模式 (SRDF/S)：提供源 Symmetrix 系统与目标 Symmetrix 系统之间数据的实时镜像。在提交应用程序 I/O 之前，数据会同时实时写入两个系统的缓存中，以确保最高程度的数据可用性。在向本地主机发送确认信号之前，数据必须成功存储在本地和远程的
    Symmetrix 系统中。这主要用于距离小于 200 公里的大城市地区。

    - 异步模式 (SRDF/A)：在任何距离下均始终维护一个依赖写入的一致性数据副本，且对应用程序产生任何影响。需要跨距离复制数据的应用程序选择有限，SRDF/A
    提供了高性能、远距离复制并降低了电信成本，在平衡现有管理能力的同时，对主机性能没有影响。

    - 自适应复制模式：无论顺序或一致性如何，都将数据从源设备传输到目标设备，且不对主机性能产生影响。这在数据中心迁移、整合和数据移动环境期间传输大量数据时特别有用。自适应复制模式是
    Symmetrix 自动复制解决方案的数据移动机制。


    ### 2.5.3 SRDF 设备组和复合组


    运行在 Symmetrix 系统上的应用程序通常涉及多个设备。因此，设备组或复合组必须确保所有相关的 Symmetrix 设备都执行操作。设备组或复合组是用户定义的、跨多个
    Symmetrix 系统或 RA 组的设备。设备组是 CLI 命令可以执行的单个 Symmetrix 系统。另一方面，复合组可以跨多个 Symmetrix
    系统和 RA 组。设备组或复合组类型可能包含 R1 或 R2 设备。相应的，symdg/symld 命令用于创建和管理设备组和复合组。


    ### 2.5.4 SRDF 一致性组


    SRDF 一致性组是为一致性保护用的设备集合。其目的是保护跨多个 RA 组和/或 Symmetrix 系统的应用程序完整性。SRDF 一致性组使用 PowerPath
    或一致性组辅助 (ECA) 提供零数据丢失的灾难恢复。零数据丢失意味着灾难发生时完成的所有事务在目标端均可用。


    当应用程序数据量变得非常时，基于主机的备份或决策支持查询所需的时间成为关键因素。为了备份而停止或关闭应用程序的时间已不可接受。SRDF 一致性组允许用户在不中断服务的情况下，秒级远程镜像最大的数据环境的可启动副本。


    一致性组是 SRDF 设备 (R1 或 R2) 的组合，用于维护跨 Symmetrix 系统的应用程序完整性。如果是源 (R1) 设备，EMC 软件会拦截来自一致性组中所有
    R1 设备的写入，停止向目标 R2 设备的数据流。这种挂起（触发一致性组）确保了在一致性组触发的时间点具有依赖写入一致性的 R2 数据库副本。


    触发一致性组可以自动或手动发生。自动触发的情景包括：


    - 一个或多个 R1 设备无法向其相应的 R2 设备传播更改

    - R2 设备故障

    - SRDF R1 侧或 R2 侧故障


    在自动触发期间，Symmetrix 系统完成 R1 设备的写入，这表明写入未传播到 R2 设备。EMC 软件拦截 I/O 并指示 Symmetrix 挂起一致性组中所有
    R1 源设备的向 R2 侧进一步写入。一旦挂起完成，一致性组中所有 R1 设备的写入继续进行，但在 SRDF 镜像恢复之前，这些写入不会传播到目标。


    显式触发发生在调用 `symcli -cg split` 命令时。排序或拆分一致性组会在 R2 目标站点创建一个按需的可启动数据库副本。BCV 设备与 R2
    设备同步后，在触发一致性组后进行拆分，从而创建第二个依赖写入一致的数据副本。


    '
