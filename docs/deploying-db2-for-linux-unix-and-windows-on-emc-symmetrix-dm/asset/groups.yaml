    # EMC Foundation 产品


    EMC 一致性组在 SRDF 配置中维护跨多个 Symmetrix 系统的应用程序的一致性，如图 24 所示，监控从一致性组内的源（R1）设备到其对应目标（R2）设备的数据传播。一致性组在滚动灾难（rolling
    disaster）期间提供完整性保护。


    ![](img/9d79d979aef40e6535a55c940991009e_71_0.png)


    图 24 SRDF 一致性组


    一致性组保护定义包含源 Symmetrix 上的卷 X、Y 和 Z。该一致性组定义必须包含所有需要维护依赖写入一致性的设备，并驻存在于所有参与这些设备 I/O
    操作的参与主机上。CKD（大型机）和 FBA（UNIX/Windows）设备可以在逻辑上分在一起。在某些情况下，可以将整个处理环境定义在一个一致性组中，以确保依赖写入一致性。


    前述描述的滚动灾难阻止了更改从卷 Z 到远程站的复制。


    由于前驱日志写入卷 Z 无法传播到远程 Symmetrix 系统，将发生一致性组跳变（trip）。


    组跳变（Group trip）会保持在逻辑分组设备上无法复制的写入操作。这些写入由 UNIX/Windows 主机上的 PowerPath 和大型机主机上的
    IOS（或 UNIX/Windows 和大型机主机上的 SRDF-ECA）保留，持续时间足够长，以确保参与一致性组的所有 Symmetrix 系统的 I/O
    完成。第一次 I/O 将设备状态更改为挂起-等待（suspend-pending）状态。


    第二次 I/O 对逻辑分组设备的 R1 / R2 关系执行挂起操作，这将立即禁用所有到远程站的复制。组之外的所有其他设备将继续复制，前提是通信链路可用。关系挂起后，前驱写入的完成状态将确认返回给发布主机。此外，所有在一致性组跳变操作期间保留的写入都将被释放。


    在 EMC Symmetrix DMX 上为 Linux、UNIX 和 Windows 部署 DB2


    # EMC Foundation 产品


    在每个 Symmetrix 的第二次 I/O 完成后，I/O 将释放，允许前驱日志写入完成并返回主机。依赖数据写入由 DBMS 发出并到达 X，但不会复制到
    R(X)。


    当此类滚动灾难发生完全故障时，远程站的依赖写入一致性将得到保护。如果没有发生灾难且故障链路重新激活，则可以恢复一致性组的复制。EMC 建议在远程恢复期间创建依赖写入一致性镜像的副本。一旦
    SRDF 进程达到同步状态，即可在远程站实现依赖写入一致性的的副本。


    ## 2.5.5 SRDF 术语


    本节描述了与 SRDF 操作相关的各种术语。


    ### 2.5.5.1 挂起（Suspend）和恢复（resume）操作


    挂起和恢复操作的实际用途通常涉及意外情况，即希望立即挂起通过 SRDF 链路在 R1 和 R2 设备之间的 I/O。通过这种方式，可以停止数据传播问题。当配合一致性组使用挂起操作时，将在
    R2 上执行立即备份，而不影响来自本地主机的 I/O。然后可以通过 R1 和 R2 恢复 I/O 并恢复到正常运行。


    ### 2.5.5.2 建立（Establish）和分裂（split）操作


    建立和分裂操作通常用于计划的情况，即希望在不干扰对 R1 设备正常写入的情况下，使用数据的 R2 副本。对数据点快进行拆分允许各种业务连续性任务访问 R2
    设备上的数据。拆分 SRDF 对以提供精确的数据库副本具有易用性，这使得在源 Symmetrix 系统继续处理的同时，从目标 Symmetrix 数据执行计划的备份操作、报告生成操作或新应用程序测试变得非常方便。


    R2 副本还可用于通过需要大量人工干预的恢复演练、复杂的程序和应用程序服务中断来测试灾难恢复计划。可以测试向新版本的升级，或对实际代码进行更改，而不会影响在线生产服务器。例如，可以在数据库的
    R2 副本上运行修改后的服务器代码，直到升级后的副本无错误运行后，再升级生产服务器。


    在对生产数据的绝对实时复制并非必需的情况下，用户可以选择定期拆分 SRDF 对，并使用 R2 副本进行查询和报告生成。可以重新建立 SRDF 对以为 R2
    设备提供增量更新。刷新 R2 设备的能力为数据处理和报告提供了最新信息。


    ### 2.5.5.3 故障转移（Failover）和故障回（failback）操作


    故障转移和故障回操作的实际用途通常涉及将业务从生产地切换到远程地（故障转移）或相反（故障回）。一旦发生故障转移，将使用同步应用程序数据的远程（R2）副本继续正常操作。生产地的计划维护是可能需要转移到
    R2 站的一个示例。


    测试灾难恢复计划是临时转移到远程站的主要原因。传统的灾难恢复程序涉及自定义软件和复杂的程序。离线介质必须电传输或物理运输到恢复现场。随后通常会进行耗时的恢复和应用程序日志。


    EMC Symmetrix 远程数据设施


    # EMC Foundation 产品


    SRDF 故障转移/回操作通过增量更新已更改的特定跟踪显著缩短了恢复时间；这可以在几分钟内完成从转储数据库卷完全加载可能需要几小时的工作。


    ### 2.5.5.4 更新（Update）操作


    更新操作允许用户在故障转移后重新同步 R1，同时在 R2 上继续运行应用程序服务。这有助于减少 R1 端所需的时间。更新操作是故障转移/回功能的子集。实际用途通常涉及
    R1 几乎与 R2 同步的情况。在使用更新时，-until 指定了同步完成之前允许的无效跟踪数。


    ### 2.5.5.5 并发 SRDF (Concurrent SRDF)


    并发 SRDF 意味着有两个 R2 设备配置为一个 R1 的并发镜像。使用并发 SRDF 对可以在两个远程位置创建相同数据的副本。当两个 R2 设备从源 R1
    分离时，可以独立访问每个目标站点。


    ### 2.5.5.6 R1/R2 交换（Swap）


    交换 SRDF 对的 R1/R2 设备会导致源 R1 设备变成目标 R2 设备，反之亦然。交换允许 R2 站接管操作，同时在原始站点保留远程镜像。交换对于应用程序从
    R1 站转移到 R2 站特别有用。SRDF 交换适用于5567 或更高版本的 Director。


    ### 2.5.5.7 数据移动（Data Mobility）


    数据移动是一种限制 SRDF 设备仅以自适应模式运行的 SRDF 配置。这是一种较低的许可选项，通常用于数据迁移。它允许数据以自适应模式从源到目标传输，除非与
    TimeFinder 结合使用，否则它不是针对 DR 需求的解决方案。


    ### 2.5.5.8 动态 SRDF (Dynamic SRDF)


    动态 SRDF 允许在 Symmetrix 系统运行时从非 SRDF 设备创建 SRDF 对。历史上，源和目标 SRDF 设备配对是静态的，需要 EMC 人员的协助。此功能为决定复制保护的数据提供了更大的灵活性。


    可以在 SRDF 交换环境中创建 RA 组。RA 组代表两个 Symmetrix 系统之间的逻辑连接。RA 组曾局限于配置时定义的静态 RA 组。但现在可以在
    Symmetrix 系统运行时创建、修改和删除 RA 组。这为形成与 SRDF 对相关的链路提供了更大的灵活性。


