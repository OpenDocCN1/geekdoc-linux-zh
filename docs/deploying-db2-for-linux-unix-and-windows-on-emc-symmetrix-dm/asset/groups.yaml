    ## 3.4.3 后端数据分布的最大化


    早些时候我们看到，不应将数据存储在一个物理驱动器上，而应该尽可能均匀地分布在尽可能多的 Symmetrix DMX 物理磁盘磁道上。通过将数据扩展到 Symmetrix
    的后端，可以最大限度地减少或消除任何组件的 I/O 瓶颈。


    随着最近 Symmetrix DMX 组件的改进（例如更快的 CPU 和 Direct MX 架构），新实现中最常见的瓶颈是竞争，无论是发生在后端交换器上还是磁盘磁道上。为了减少此类竞争问题，应尽对每个将要使用
    Symmetrix 存储的应用程序进行详细的 I/O 要求检查。并利用在此过程中获得的信息，制定一个详细的布局，以在后端交换器和物理磁道之间平衡预期的 I/O
    要求。


    目前有许多优化后端交换器和磁道布局的方法，例如：


    - 一种方法涉及根据 EMC ControlCenter² 收集的信息，使用（如 Microsoft Excel 等软件软件包）创建按物理存储和物理磁道划分的超卷（hypervolumes）映射。通过使用此后端映射和信息（最好按
    I/O 要求分类：高/中/低或按预期速率），可以将物理数据均匀地分布在交换器和物理磁道上。遗憾的是，生成的映射可能极其复杂，整个过程可能非常耗时。在配置中使用
    RAID 5 或 RAID 6 超卷时会增加额外的复杂性。由于在这些环境中每个超卷跨越多个物理磁道，因此通过唯一映射 I/O 获得的信息并不值得投入的时间和精力。


    - 另一种方法是对每个可用卷进行排名以预测 I/O。排名后，可以为每个元素分配一个超卷或后端。由于 BIN 文件创建工具始终可能会将连续的超卷编号分散在后端的不同元素上，这种方法通常可以在
    Symmetrix DMX Optimizer 可用的磁道和后端交换器之间提供合理的 I/O 分散；这种分散 I/O 的方法通常对于最大化所有 DMX 组件的
    I/O 是有效的的。


    ## 3.4.4 最小化磁头移动（寻道时间）


    早些时候我们看到，对于使用整个磁盘的磁盘组件，磁头移动（称为寻道时间）仍然是延迟的最大来源。磁盘延迟是由接口或旋转速度引起的，这些无法通过布局考虑来控制；然而，长寻道时间引起的延迟是可以控制的。（这是与磁盘性能相关的特定高性能区域的唯一特征。）因此，在为
    Symmetrix DMX 上的 DB2 LUW 数据库设计存储布局时，将高 I/O 数据放置在所用物理磁盘的相邻超卷上，以度地减少磁头移动是非常重要的。


    利用记录的后端磁道映射，可以将高 I/O 数据放置在它们分组在一起的物理磁道上。对于将 I/O 数据放置在磁道的其他部分（即物理磁道的最高部分）还是放置在磁道中心最好，建议存在差异。因此，由于没有共识，将
    I/O 数据放置在磁道外部的历史建议仍然是一个合理的建议：将高 I/O 数据一起放置在磁道的外部，有助于在读取和写入磁道上的每个超卷时减少磁头移动，从而提高整体性能。


    ## 3.5 其他布局考虑因素


    除了前几节中描述的布局考虑因素外，对于想要优化 Symmetrix DMX阵列上 DB2 LUW 数据库性能的 DBA 或存储管理员来说，几个附加因素可能非常重要。需要考虑的一些额外因素包括：


    - 使用 SRDF/S 进行灾难恢复的计划。

    - 使用 TimeFinder/Mirror、TimeFinder/Clone 或 TimeFinder/Snap 创建数据库副本的计划。


    ### 3.5.1 使用同步 SRDF


    当使用同步 SRDF (SRDF/S) 进行数据库灾难恢复时，必须考虑两个主要问题。第一个是每个写入操作增加的固有延迟。这种延迟发生是因为每个写入必须先写入本地和远程
    Symmetrix DMX 的缓存中，才能向主机发送确认。


    第二个问题围绕条带（stripping）。Symmetrix 中配置的每个超卷一次仅允许通过 SRDF 链路发送一个 I/O。当多个 I/O 写入单个超卷时，会导致性能下降，因为随后的写入必须等待前面的操作完成。这种性能下降主要发生在与应用程序线程同步的日志的事务条带写入中。在这些情况下，对活动日志进行主机级条带可能特别有用；对于事务使用主机级条带，建议条带大小为
    32 KB（不建议对表容器使用主机级条带，因为缓冲池是异步于应用程序线程执行的）。还建议尽可能使页面内容对齐——页面结果会导致延迟增加。


    明智地组织数据库存储以利于恢复是安全的。阵列复制技术在磁盘级（以及主机级）复制卷，DB2 LUW 数据库使用的所有存储容器都应创建在一组专用于数据库的磁盘上；与其他应用程序共享磁盘会导致阵列产生不必要的工作，并可能导致目标卷上的空间浪费。（对于
    UNIX，确保容器位于专用于数据库的卷组中。）


    除了将数据库隔离到自己的专用日志外，活动日志和任何与数据库相关的归档日志都应存储在单独卷中。这种划分允许在需要恢复操作时独立地对数据库及其日志进行操作。


    ### 3.5.2 使用 TimeFinder/Mirror


    当 DBA 想要创建数据库的备份映像或副本时，数据库复制是非常用的。在 Symmetrix 上布局数据库时，一个常见问题是 BCV（备份卷）应该与生产数据共享相同的物理磁道，还是应该隔离在单独磁盘上。


    将 BCV 分散在所有可用磁道上的主要好处是减少竞争。利用 BCV 的负载（如备份）可能会产生高 I/O；另一个缺点是同一磁道上的 BCV 会因为寻道时间增加对性能产生不利影响。


    BCV 的合适位置取决于用户偏好预期负载。通常，建议 BCV 与生产数据共享相同的物理磁道。然而，在 BCV 同步和利用影响应用程序的情况下（例如必须 24/7
    可且具有高 I/O 数据库），将 BCV 存储在自己的物理磁道上是有益的。


    ### 3.5.3 使用 TimeFinder/Clone


    TimeFinder/Clone 提供了类似于 TimeFinder/Mirror 的卷复制技术的许多优点，但不需要硬件镜像位置。然而，使用 TimeFinder/Clone
    时必须考虑两个性能因素。第一个是写时复制（COFW），由于源卷上的数据发生变化，需要将其从源卷复制到目标卷。这种惩罚只影响源卷的写入。另一个潜在惩罚发生在读取
    TimeFinder/Clone 目标卷时，尚未复制到目标卷的轨迹必须从源卷读取。源卷上的这种额外负载会不利影响高负载系统的性能。这两种惩罚都可以通过使用
    TimeFinder/Clone 的预复制（precopy）能力很大程度上消除。


    ### 3.5.4 使用 TimeFinder/Snap


    TimeFinder/Snap 提供了类似于 TimeFinder/Mirror 或 TimeFinder/Clone 等卷复制技术的许多优点，但源成本大大降低。然而，使用
    TimeFinder/Snap 时必须考虑两个性能因素。第一个写时复制（COFO），由于数据发生变化，需要将数据从生产超卷复制到“Save”区域。幸运的是，这种惩罚只影响对源卷的写入。另一个潜在惩罚发生在访问
    TimeFinder 快照时。尚未复制到“Save”区域的轨迹必须从源卷读取。源卷上的这种额外负载会不利影响高负载系统的性能。


