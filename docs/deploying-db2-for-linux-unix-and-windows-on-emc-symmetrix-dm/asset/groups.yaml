    does not address OLTP environments. The following recommendations, which are valid
    for both OLTP and DSS environments, were decided after reviewing the warehouse
    documentation and consulting with DB2 experts at IBM.


    Because of the gap between drive speed and CPU performance, IBM conservatively
    estimates that 20 spindles are needed to keep one CPU (or core) busy. This means
    that if your storage system consists of 14 GB, 15,000 rpm disk drives, approximately
    3 TB of storage is needed to dedicate to each CPU and unless you are deploying
    a large data warehouse, 50 percent or more of this will be “wasted” just to ensure
    that the database server does not become an I/O bottleneck. Most companies are
    not willing to do that.


    DB2’s buffer pool technology does an excellent job of keeping data and indexes
    that are accessed frequently in memory and one-time access data out; one-time
    data backup images and input files are not stored in buffer pools. As a result,
    DB2 buffer hits tend to be around 90 percent and higher data. Requests that do
    not result in a buffer hit require I/O from the storage subsystem. With the Symmetrix
    DMX, because of its extremely large caching capability (up to 25 GB), such I/O
    requests are frequently satisfied out of cache and do not require additional I/O.
    With the sophisticated LRU and advanced prefetch algorithms all available with
    the Enginity operating environment, cache hit rates of 90 percent have been measured
    for OLTP workloads and hit rates of 60 percent are common for data warehouse and
    DSS workloads. Thus, in a Symmetrix DMX cache behaves as an extension to DB2’s
    buffer pools.


    # 3.6.1 A typical storage layout


    Assuming 20 spindles are needed for each CPU to protect a database server from
    becoming I/O bound, what is the best way to utilize all these spindles? In order
    to answer this question, we must first consider the RAID protection scheme(s)
    that will be used to protect the data. According to DB2 experts at IBM, a good
    rule of thumb is to protect table space data (user data, indexes, etc.) with RAID
    5 technology and transaction logs, along with DB2 metadata using RAID 1 or RAID
    1+0 technology. Because two different RAID technologies are recommended, ideally,
    the 20 spindles should be divided into two groups, each of which will be protected
    by a different RAID technology'
  - '[PAGE 115]


    Once the disks are configured for RAID protection, one highly redundant LUN should
    be created on the RAID 1/RAID 10-protected set of disks while one or more additional
    LUNs can be created on the RAID 5-protected set of disks. Additionally, one (and
    only one) file system should be created on each LUN. Figure 38 shows how such
    a configuration would look on a Symmetricmetric DMX. It is important to note that
    the cylinders depicted in this illustration can represent either physical spindles
    or hypervolumes. If physical spindles are used, for example in a dedicated disk
    data warehouse environment, concatenated metavolumes are recommended for each
    LUN/file system created.


    ![](img/9d79d979aef40e6535a55c940991009e_115_0.png)


    Figure 38 Example storage layout recommendation for a nonpartitioned DB2 database
    or a single database partition of a partitioned DB2 database on a Symmetric DMX


    When it comes to striping data, two levels of striping are recommended—the striping
    provided by the storage hardware used, and the striping the DB2 performs when
    data is spread across multiple table space containers or database partitions.
    Logical volume manager striping at the host should be avoided except as noted
    in step 3.3.1 on page 104.


    Thus, if you wanted to create a DMS table space that will stripe its data across
    the file systems created on the RAID 5 protected disks shown in Figure 38, you
    could do so by executing a CREATE TABLESPACE SQL statement that looks like this:


    ```

    CREATE TABLESPACE my_t MANAGED BY DATABASE USING

    FILE ''/data1fs/myctr1'' 20000,

    FILE ''/data2fs/myctr2'' 20000,

    FILE ''/data3fs/myctr3'' 20000,

    FILE ''/data4fs/myctr4'' 20000

    ```


    In the early days of DB2 for Linux, UNIX, and Windows, DMS table spaces using
    raw devices as storage containers could deliver better performance than DMS table
    spaces using file containers. As technology has improved the performance gap between
    DMS table spaces using raw devices as storage containers and DMS table spaces
    using files as containers has narrowed to the point that IBM now recommends using
    table spaces that rely on file containers. And in version 8.2, these types of
    table spaces can be configured to grow automatically, as needed.


    Therefore, to create a DMS table space that will stripe its data across four file
    systems and grow automatically if necessary, you would execute a CREATE TABLESPACE
    SQL statement that looks like this:'
  - '[PAGE 116]


    ```

    CREATE TABLESPACE my_ts BY DATABASE USING

    FILE ''/data2fs/mytsCtr2'' 1 M,

    FILE ''/data2fs/mytsCtr3'' 1 M,

    FILE ''/data2fs/mytsCtr4'' 1 M,

    AUTOTSIZE YES

    INCREASE SIZE 2 M

    MAXSIZE 100 M

    ```


    With DB2 8.2 and later, it is also possible to create a DB2 with automatic storage
    is used, you simply assign one or more automatic storage to the database and the
    DB2 Database Manager will build its tables across the pool of available storage.
    If, you want to create a database that uses automatic storage, stripes it across
    the file systems created on the RAID 5 protected disks shown in Figure 3, and
    stores its transaction logs and metadata on the RAID 1+0 protected disks, you
    could do so by executing a CREATE DATABASE command that looks something this:


    ```

    CREATE DATABASE my_db automatic STORAGE YES

    ON /data1fs,/data2fs, /data3fs, /data4fs

    DBPATH ON /logs

    ```


    In this example, each of the three table spaces for the resulting database (SYSPACE,
    USERSPACE, and TEMSPACE) would have four containers - a file on /data1fs, a file
    on /data2fs, a file on /data4fs - the database metadata and transaction logs would
    be stored on /logs. If you wanted to create additional table spaces, you could
    do so by executing a CREATE TABLESPACE SQL statement that looks something like:


    ```

    CREATE TABLESPACE my_ts

    ```


    The resulting table space (as well as any others that might be created), has four
    containers - a file on /data1fs, a file on /data2fs, a file on /data3fs and /data4fs.


    DB2 9.5 database deployed in a SAN environment will use either automatic storage
    or auto-resizing DMS file table spaces to use user data. Automatic storage, SMS,
    or fixed size DMS file table spaces should be used to store temporary data.


    # 3.6.2 Word about file system caching


    With operating systems, a typical read operation involves moving data from storage
    to the file system cache, and then copying the data from cache to the application
    buffer. Similarly, a write operation involves copying data from the application
    buffer to the file system cache, and then copying the data from cache to storage.
    Since the DB2 Database Manager manages its own data caching using pools, caching
    at the file system level is not needed if the size of the buffer pool is set appropriately.
    In some cases, caching at both the file system level and DB2 buffer causes performance
    degradation due to the CPU cycles incurred for double caching. Without this double
    caching, most file systems have a feature that disables the file cache. (On Linux
    and Unix, this is achieved by mounting the file system with the FILE_NO_BUFFERING
    flag. Some file systems such as JFS2 support enhanced, high-performing, Direct
    I/O known as Concurrent I/O or CIO).


    Prior to version 9.5 of DB2 LUW, use of file system caching was implied and could
    be disabled by specifying the NO FILE SYSTEM CACHING when creating a new table
    space, or by using the ALTER TABLESPACE statement to disable it. With Version
    9.5, the file system caching is disabled by default (NO FILE SYSTEM CACHING) when
    new table spaces'
