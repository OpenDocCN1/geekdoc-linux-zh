    ### 3.2.1 RAID 保护建议


    传统上，RAID 1 是 Symmetrix 存储环境中 RAID 保护的主要选择。因为与其他 RAID 实现相比，RAID 1 提供了最高的可用可用性和性能，而且最初，诸如
    Symmatrix Optimizer（通过非破坏性迁移超卷来减少对物理磁柱的争用）和动态镜像服务策略（通过优化从两个镜像的读取来提高读取性能）等功能仅适用于镜像（RAID
    1）卷。然而，随着 Enigity 操作系统 5670 版本的发布以及对 RAID 5 的支持，这些功能变得可用……虽然镜像存储仍然是 Symmetrix
    DMX 上推荐使用的 RAID 配置……


    使用 Symmetrix DMX 存储的应用程序的可用性和性能需求有助于决定使用合适的 RAID 级别。DB2 LUW 数据库可以部署在 RAID 1 保护磁盘、RAID
    5 保护磁盘、RAID 6 保护磁盘以及 RAID 1+0 保护磁盘上，或者这些保护的组合。关键任务数据库是 RAID 1 保护卷的候选对象，而用于开发、测试、QA
    和报告的数据库是 RAID 5 或 RAID 6 的良好候选对象。决策支持系统（DSS）数据库也是如此。在许多环境中，性能需求通常随着进行快速写入的需求而增长（数据仓库通常在非工作时间段加载，报告在给定的时间窗口内使用；另一方面，读取可以在数据仓库未加载的任何时间发生。）由于
    RAID 5 或 RAID 6 的写入没有惩罚（因为计算和写入校验数据的努力，写入会有轻微惩罚），这些类型的应用程序通常是 RAID 5 和 RAID 6
    存储部署的良好候选。


    除了写入性能惩罚外，磁盘故障是决定使用 RAID 1、RAID 5 还是 RAID 6 保护时必须考虑的另一个主要因素。当包含 RAID 5 或 RAID
    6 成员的磁盘时，有两个领域可能会影响——性能和数据可用性。只要 RAID 5 或 RAID 6 阵列以降级模式运行，性能就会受到负面影响。（在此期间，必须使用校验和
    RAID 阵列内其他磁盘磁柱上的数据信息来重建数据。）在重建过程中（即更换故障磁盘时发生），性能也会受到影响。如果多个驱动器同时故障，数据可用性可能会受到影响。这种事件在
    RAID 6 中概率较低，但在 RAID 5 中较高。


    ## 条带化


    尽管磁盘尺寸和速度近年来大幅增加，但主机技术并未跟上。因此，为了避免主机瓶颈，某些条带化是关键的。通常条带化可以在主机级别实现。使用何种形式的条带化取决于数据库。


    ### 3.3.1 主机条带化


    主机条带化涉及逻辑卷管理器。例如，在 HP-UX 中，可以使用如下命令创建卷：


    ```

    lvcreate -i 4 -L 1024 -n stripevol activevg

    ```


    在此示例中，在 activevg 上创建一个条带大小为4的卷。通常不建议在数据库环境中使用主机条带化，使用 SRDF/S 除外。对于此类卷，建议使用较小的条带大小（例如
    32 KB）。


    ### 3.3.2 存储阵列条带化（Symmet卷）


    主机条带化的替代方案是在 Symmetrix 层进行条带化。除了 RAID 5 和 RAID 6 发生的条带化外，相同 RAID 类型（RAID 1、RAID
    5 或 RAID 6）的单个 Symmetrix 卷可以组合成一个称为元卷（metamume）的虚拟化设备。创建元卷有很多原因，包括：


    - 创建大于 5670 和 5671 操作系统环境中可用的最大卷的设备（目前小于 31 GB）。

    - 减少呈现前端交换器或主机总线适配（HBA）的卷数量。元卷作为单个 LUN 呈现给 HBA，尽管它由大量卷组成。

    - 通过在更多物理磁柱上扩展 I/O 来提高 LUN 的性能。


    支持两种类型的元卷：连接和条带。两种类型都选择并组合形成通过前端交换器和 HBA 呈现给主机的单个 LUN。区别在于处理 I/O 的方式。对连接元卷的写入从元头开始，直到移动到下一个物理设备。另一方面，对条带化元卷的写入同时写入每个物理设备。第
    105 页的图 36 展示了由四个卷组成的连接元卷可能的样子；第 106 页的图 37 展示了由相同的四个卷组成的条带化元卷。


    ![](img/9d79d979aef40e6535a55c940991009e_106_png)


    图 36 连接元卷


