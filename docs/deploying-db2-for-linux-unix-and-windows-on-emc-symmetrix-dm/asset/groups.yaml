    ## 1.2.3 配置助手 (Configuration Assistant)


    配置助手是一个交互式 GUI 应用程序，允许用户配置客户端，以便其能够访问存储在远程 DB2 服务器上的数据库。为了访问另一台服务器/系统上的实例或数据库，必须首先在客户端工作站的节点目录中注册该系统，并将有关远程数据库的信息注册到数据库目录（同样位于客户端工作站上）中。配置助手提供了一种快速注册节点和数据库的方法，而无需了解执行这些任务时涉及的内在复杂性。由于配置助手维护了应用程序可以连接的数据库列表，在未安装全套
    GUI 工具的情况下，它可以作为控制中心（Control Center）的轻量级替代方案。


    通过配置助手，用户可以：


    - 注册新数据库。

    - 对现有数据库进行操作或取消注册。

    - 绑定应用程序。

    - 设置 DB2 环境/注册表变量。

    - 配置 DB2 数据库管理器实例。

    - 配置 ODBC/CLI 参数。

    - 导入和导出配置信息。

    - 修改密码。

    - 测试连接。


    第 27 页的图 5 显示了配置助手在 Windows XP 服务器上的外观。


