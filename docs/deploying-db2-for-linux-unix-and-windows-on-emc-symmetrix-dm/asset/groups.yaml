    ## 1.6 深入了解表空间


    早些时候，我们看到表空间用于控制数据的物理存储位置，并在数据库对象（如表、索引和视图）与一个或多个容器（如目录、文件或原始设备，即对象数据实际所在的地方）之间提供了一个间接层。数据以
    4 KB、8 KB、16 KB 或 32 KB 块（称为*页*，pages）的形式在容器与之间之间传输；当一个表空间跨越多个容器时，数据会以称为*区*（extents）的页为组，以轮询方式写入分配给该表空间的每个容器。这有助于在所有用到的容器之间平衡数据。图
    11 显示了页、区和表容器之间的关系。


    ![](img/9d79d979aef40e6535a55c940991009e_42_0.png)


    图 11 数据如何写入表空间容器


    > 注意：当使用多个容器存储一个表空间的数据时，每个容器能容的最大数据量由最小的容器决定。例如，如果一个表空间使用一个 10 MB（兆字节）的容器和另一个大小为
    12 MB 的容器，则第二个容器的 2 MB 将无法使用；该表空间可用的最大存储量将为 20 MB。因此，应尽可能保持容器相等。


    可以存在两种类型的表空间：系统管理空间（SMS）表空间和数据库管理空间（DMS）表空间。对于 SMS 表空间，只能使用目录容器进行存储，并由操作系统的文件管理器负责控制该空间的使用方式。SMS
    存储模型由许多文件组成（每个文件代表一个表、索引或长数据对象），这些文件存在于文件系统中——用户决定文件的位置，DB2 数据库管理器分配文件，而文件系统负责管理它们的增长。对于
    DMS 表空间，可以使用文件和/或设备容器进行存储，由 DB2 数据库管理器负责控制该空间的使用方式。在 DB2 9.5 中，DMS 表中对象的初始空间分配为两个区；SMS
    表中对象的初始空间分配为一个区。SMS 和 DMS 表空间之间的其他差异可见表 1。


    ## SMS 和 DMS 表空间之间的差异


    | SMS 表空间 | DMS 表空间 |

    |---|---|

    | 空间由操作系统的文件管理器分配和管理。 | 空间在指定时，由 DB2 数据库管理器分配和管理。 |

    | 只能使用目录容器进行存储；不能使用文件和设备容器。 | 可以使用文件或设备容器作为存储；不能使用目录容器。 |

    | 表空间创建后，无法添加额外的容器（使用 ALTERSPACE SQL 语句）。 | 表空间创建后，可以为其添加额外的容器。当添加新容器时，现有数据会自动在新的容器集中进行重新平衡，以保持最佳的
    I/O 效率。 |

    | 按照需要分配空间。 | 预分配空间。 |

    | 表空间创建后，无法更改容器的大小。 | 表空间创建后，可以增加或减少容器的大小。 |

    | 常规数据和长数据存储在同一个表空间中。 | 常规数据和长数据可以分散在多个空间中（常规数据可以位于表空间中，而长数据位于其他空间中）。 |

    | 表空间更容易创建和管理。 | 表访问速度略慢，但整体性能更好。 |


    SMS 和 DMS 表空间都根据它们旨在存储的数据类型进行分类，分为三类：常规、长和临时。常规数据和索引数据存储在常规表空间中，而长字段和大型对象数据存储在大型表空间中——前提是使用了表空间。临时表空间进一步分为系统临时或用户临时。系统临时空间用于存储执行某些操作时产生的数据（例如排序、重组表和创建索引），而用户临时空间用于存储特定的全局临时表。


    如果数据库启用了自动存储，就可以存在另一种类型的表空间——自动存储表空间。乍一看，自动存储表空间是 SMS 和 DMS 表空间的扩展：常规和大型表空间作为
    DMS 表空间创建；而系统和用户临时表空间作为 SMS 表空间创建。与 SMS 表空间不同，自动存储表空间不需要容器定义；DB2 数据库管理器会自动分配容器。


    ## 1.6.1 创建额外的表空间


    之前提到，当创建 DB2 数据库时，会创建一个名为 IBMDEFAULT 的缓冲池，并作为数据库初始化过程的一部分创建三个与之关联的表空间。这三个表空间对于小型数据库已经足够；然而，大型数据库通常由许多缓冲池和表空间对象组成。可以通过执行
    CREATE TABLE SQL 语句或使用表空间向导来创建额外的表空间，表空间向导可以通过从控制中心的表空间菜单中选择相应的操作来激活。图 11 显示了激活表空间向导必须选择的控制中心菜单项；第
    44 页的图 13 显示了创建表空间向导的第一页可能的样子。


    ![](img/9d79d979aef40e6535a55c940991009e_44_0.png)


    图 12 从控制中心调用创建表空间向导


    ![](img/9d79d979aef40e6535a55c940991009e_45_0.png)


    图 13 创建表空间向导的第一页


    ## 1.6.2 修改现有表空间


    由于 SMS 表空间依赖操作系统进行物理空间管理，在成功创建后很少需要修改。另一方面，必须密切监控 DMS 表空间，以确保用于存储的固定大小预分配文件或原始设备始终有可用空间满足数据库需求。当
    DMS 表空间的可用空间变得非常低（通常小于 10%）时，可以通过增加其一个或多个容器的大小或向其添加一个或多个容器来增加可用空间。通过执行 ALTER TABLESPACE
    SQL 语句，可以调整现有表的大小，为现有表空间提供新容器，并更改现有表空间的属性。还可以使用更改表空间对话框更改表空间，该对话框可以通过从控制中心的表空间菜单中选择相应的操作来激活。


