    SQL 会存储在内部。


    7. 初始化数据库的配置文件。


    数据库配置文件中的某些参数（如代码集、区域和排序顺序）将使用 CREATE DATABASE 命令或数据库创建向导的输入进行设置，其他则分配系统默认值。


    # Linux, UNIX 和 Windows 版 DB2 9.5 简介（*注：此处原文标题为 "Introduction to DB2 9.5 for Linux,
    and Windows"，根据上文推测补充了 UNIX）*


    除非另有说明，SYSCSPACE 和 USERSPACE1 是 DMS FILE 表空间，TEMSPACE1 是 SMS 表空间；这些每个表的特征可以作为
    CREATE DATABASE 命令或数据库创建向导的输入。


    8. 创建模式。


    模式用于在逻辑上分类和分组数据库中的其他对象。一旦创建了系统目录表和视图，将创建以下模式：SYSIBM、SYSCAT、SYSSTAT 和 SYSFSUN。名为
    SYSIBM 的特殊用户是每个模式的所有者。


    9. 将一组实用程序绑定到数据库。


    某些可用于数据库的 DB2 实用程序需要创建包。此类包通过绑定一组预定义的 DB2 绑定文件来创建（使用的绑定文件存储在数据库 db2bind.lst 中）。


    10. 向适当的用户授予权限。


    要连接并使用特定的数据库，用户必须拥有该数据库所需的权限。因此，除非另有说明，每当创建一个新数据库时，都会授予以下权限：


    - 数据库管理员 (DBADM) 权限以及 CONNECT、CREATAB、BINDADD、CREATE_NOT_FENCED、IMPLICIT_SCHEMA
    和 LOAD 权限授予创建数据库的用户。

    - 表空间 USSPACE1 的 USE 权限授予组

    - CONNECT、CREATAB、BINDADD 和 IMPLICIT_SCHEMA 权限授予组组

    - 每个系统目录表的 SELECT 权限授予 PUBLIC 组

    - SYSIBM 模式中找到的所有过程的 EXECUTE 权限授予 PUBLIC 组

    - SYSFUN 模式中所有函数的 EXECUTE WITH GRANT 权限授予 PUBLIC 组

    - 为每个成功绑定的实体 BIND 和 EXECUTE 权限授予 PUBLIC 组。


    11. 启用若干自动功能。


    为了方便管理，每当创建一个新数据库时，都会启用以下自动功能：


    - 自动维护（数据库备份、表和索引重组、数据访问优化和统计分析）

    - 自调优内存管理器（包缓存、锁定内存、排序内存、数据库共享内存和缓冲池内存）

    - 实用程序节流

    - 健康监器


    12. 启动配置顾问。


    配置顾问工具旨在根据您提供的数据库信息建议修改哪些配置参数，从而帮助您调整性能并平衡内存需求。在 DB2 9 中，每当您创建数据库时，都会调用配置顾问，除非通过将
    DB2_ENABLE_AUTONFIG_DEFAULT 注册表变量赋值为 NO 来更改默认行为。

