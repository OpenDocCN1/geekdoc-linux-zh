    # 2.1 引言


    EMC® 提供了许多支持 Symmetrix® 系统上应用环境的硬件和软件产品。以下重点介绍并讨论的产品已在适用于 Linux、Unix 和 Windows
    的 DB2 中使用/或经过测试。


    EMC Symmetrix — Symmetrix 系统具有高水平性能、数据完整性、可靠性和可用性。本章将对所使用的 EMC 产品进行技术概述。


    EMC Symmetrix — EMC 提供广泛的高端存储解决方案产品，旨在满足关键任务数据库和应用程序的需求。Symmetrix 系统是全冗余、高可用的存储处理器，提供非中断的组件更换和代码升级。


    EMC Infinity 环境 — 以前代 Symmetrix 系统之间的 Infinity 互操作性使其能够连接到大量的服务器类型、操作系统以及各种网络连接元件（从
    HBA 和驱动程序到交换机和磁带系统）。


    EMC Solutions Enabler — Solutions Enabler 是一个包含 SYMAPI 运行时库和 SYMLCI 命令接口的包。SYMAPI
    提供指向 Infinity 环境的接口。SYMLCI是一组可以从命令行或脚本中调用的命令。这些命令用于监控设备配置和状态，并对存储复内的设备和数据对象执行控制操作。


    - SRDF 组件扩展了 Solutions Enabler 的 SYMLCI 命令集，包含了专门管理 SRDF 的命令。


    EMC SRDF 一致性组 — SRDF 一致性组是相关 Symmetrix 设备的集合，协同维护数据完整性。一致性组中的设备可以跨多个 Symmetrix
    系统。


    EMC TimeFinder — TimeFinder 家族产品能够在单个 Symmetrix 系统实现基于 Linux 的复制。数据使用阵列资源从 Symmetrix
    设备复制，不占用 CPU 或 I/O。在创建副本时，源 Symmetrix 设备保持在线进行常规 I/O 操作。TimeFinder 家族拥有三个独立的软件产品：TimeFinder/Mirror、Clone
    和 TimeFinder/Snap：


