    Splitting a BCV pair is a TimeFinder/Mirror action that detaches the BCV from
    its standard and makes the standard ready. When splitting a BCV, the system must
    perform housekeeping tasks that may require a few milliseconds on a busy Symmetrix
    system. These tasks involve a series of steps that result in separation of the
    BCV:


    - I/O is suspended briefly to the standard device.

    - Write pending tracks for the standard device that have not yet been written
    to the BCV are duplicated in cache to be written to the BCV.

    - The BCV is split from the standard device.

    - The BCV device status is changed to ready.


