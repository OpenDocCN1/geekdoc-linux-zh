  - "[PAGE 144]\n\n# Glossary\n\nThis glossary contains terms related to disk storage\
    \ subsystems. Many of these terms are used in this book.\n\n# A\n\n+   - **actuator**\n\
    \  A set of access arms and their attached read/write heads, which move as an\
    \ independent component within a head and disk assembly (HDA).\n- **adapter**\n\
    \  Card that provides the physical interface between the director and disk devices\
    \ (SCSI adapter), director and parallel channels (Bus & Tag adapter), director\
    \ and serial adapter.\n- **alternate track**\n  A track designated to contain\
    \ data in place of a defective primary track. See also \"primary track.\"\n\n\
    # C\n\n+   - **cache**\n  Random access electronic storage used to retain frequently\
    \ used data for faster access by the channel.\n- **cache slot**\n  Unit of cache\
    \ equivalent to one track.\n- **channel director**\n  The component in the Symmetrix\
    \ subsystem that interfaces between the host channels and data storage. It transfers\
    \ data between the channel and cache.\n- **CKD**\n  Count Key Data, a data recording\
    \ format employing self-defining record formats in which each record is represented\
    \ by a count area that identifies the record and its format, an optional key area\
    \ that may be used to identify the data area contents, and a data area that contains\
    \ the user data for the record. CKD can also refer to a set of channel commands\
    \ that are accepted by a device that employs the CKD recording format.\n- **controller\
    \ ID**\n  Controller identification number of the director the disks are channeled\
    \ to for E. There is only one controller ID for Symmetrix.\n\n# D\n\n+   - **DASD**\n\
    \  Direct access storage device, a device that provides nonvolatile storage of\
    \ computer data and random access to that data.\n- **data availability**\n  Access\
    \ to any and all user data by the application."
  - '[PAGE 145]


    # Glossary


    +   **delayed fast write** There is no room in cache for the data presented by
    the write operation.


    +   **destage** The asynchronous write of new or updated data from cache to disk
    device.


    +   **device** A uniquely addressable part of the Symmetrix subsystem that consists
    of a set of access arms, the associated disk surfaces, and the electronic circuitry
    required to locate, read, and write data. See also "volume"


    +   **device address** The hexadecimal value that uniquely defines a physical
    I/O device on a channel path in an MVS environment. See also "unit address."


    +   **device number** The value that logically identifies a disk device in a string.


    +   **diagnostics** System level tests or firmware to inspect, detect, and correct
    failing components. These tests are comprehensive and self-invoking.


    +   **director** The component in the Symmetrix subsystem that allows Symmetrix
    to transfer data between the host channels and disk devices. See also "channel
    director"


    +   **disk director** The component in the Symmetrix subsystem that interfaces
    between cache and the disk devices.


    +   **dual-initiator** A Symmetrix feature that automatically creates a backup
    data path to the disk devices serviced directly by a disk director, if that director
    or the management hardware for which those devices fails.


    +   **dynamic sparing** A Symmetrix feature that automatically transfers data
    from a failing disk device to an available spare disk device without affecting
    data availability. This feature supports all non-mirrored devices in the Symmetrix
    subsystem.


    # E


    +   **ESCON** Enterprise Systems Connection, a set of IBM and vendor products
    that connect mainframe computers with each other and with attached storage, locally
    attached workstations, and other devices using optical fiber technology and dynamically
    modifiable switches called ESCON Directors. See also "ESCON director."


    +   **ESCON director** Device that provides a dynamic switching function and extended
    link path lengths (with XDF capability) when attaching an ESCON channel to a Symmetrix
    serial channel interface.


    # F


    +   **fast write** In Symmetrix, a write operation at cache speed that does not
    require immediate transfer of data. The data is written directly to cache and
    is available for later destaging.


    +   **FBA** Fixed Block Architecture, disk device data storage format using fixed-size
    data blocks.


    +   **frame** Data packet format in an ESCON environment. See also "ESCON."


    +   **FRU** Field Replaceable Unit, a component that is replaced or added by service
    personnel as a single entity.'
  - '[PAGE 146]


    # gatekeeper


    A small logical volume on a Symmetrix storage subsystem used to pass commands
    from a host to the Symmetrix storage subsystem. Gatekeeper devices are configured
    on standard Symmetrix disks.


    # GB


    Gigabyte, 10^9 bytes.


    # H


    # head and disk assembly


    A field replaceable unit in the Symmetrix subsystem containing the disk and actuator.


    # home address


    The first field on a CKD track that identifies the track and defines its operational
    status. The home address is written after the index point on each track. Also
    see "CKD."


    # hyper-volume extension


    The ability to define more than one logical volume on a single physical disk device
    making use of its full formatted capacity. These logical volumes are user-selectable
    in size. The minimum volume size is one cylinder and the maximum size depends
    on the disk device capacity and the emulation mode selected.


    # I


    # ID


    Identifier, a sequence of bits or characters that identifies a program, device,
    controller, or system.


    # IML


    Initial micro program loading.


    # index marker


    Indicates the physical beginning and end of a track.


    # index point


    The reference point on a disk surface that determines the start of a track.


    # I/O device


    An addressable input/output unit, such as a disk device.


    # K


    # K


    Kilobyte, 1024 bytes.


    # L


    # least recently used algorithm (LRU)


    The algorithm used to identify and make available the cache space by removing
    the least recently used data.


    # logical volume


    A user-defined storage device. In the Model 5200, the user can define a physical
    disk device as one or two logical volumes.


    # long miss


    Requested data is not in cache and is not in the process of being fetched.


    # longitude redundancy code (LRC)


    Exclusive OR (XOR) of the accumulated bytes in the data record.'
  - '[PAGE 147]


    # Glossary


    # M


    +   **MB** Megabyte, $10^6$ bytes.


    +   **mirroring** The Symmetrix maintains two identical copies of a designated
    volume on separate disks. Each volume automatically updates during a write operation.
    If one disk device fails, Symmetrix automatically uses the other disk device.


    +   **mirrored pair** A logical volume with all data recorded twice, once on each
    of two different physical devices.


    # P


    +   **physical ID** Physical identification number of the Symmetrix director for
    EREP usage. This value automatically increments by one for each director installed
    in Symmetrix. This number must be unique in the mainframe system. It should be
    an even number. This number is referred to as the SCU_ID.


    +   **primary track** The original track on which data is stored. See also "alternate
    track."


    +   **promotion** The process of moving data from a track on the disk device to
    cache slot.


    # R


    +   **read hit** Data requested by the read operation is in cache.


    +   **read miss** Data requested by the read operation is not in cache.


    +   **record zero** The first record after the home address.


    # S


    +   **scrubbing** The process of reading, checking the error correction bits,
    and writing corrected data back to the source.


    +   **SCSI adapter** Card in the Symmetrix subsystem that provides the physical
    interface between the disk director and the disk devices.


    +   **short miss** Requested data is not in cache, but is in the process of being
    fetched.


    +   **SSID** For 3990 storage control emulations, this value identifies the physical
    components of a logical DASD. The SSID must be a unique number in the host system.
    It should be an even number and start at a zero boundary.


    +   **stage** The process of writing data from a disk device to cache.


    +   **storage control unit** The component in the Symmetrix subsystem that connects
    Symmetrix to the host channels. It performs channel commands and communicates
    with the disk directors and cache. See also "channel director."


    +   **string** A series of connected disk devices sharing the same disk director.


    # U


    +   **unit address** The hexadecimal value that uniquely defines a physical I/O
    device on a channel path in an MVS environment. See also "device address."'
