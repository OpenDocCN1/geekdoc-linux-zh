    ## 1.6.3 Adding new containers to existing automatic storage table spaces


    Earlier, we saw that if a database is enabled for automatic storage spaces, the
    container-space-management characteristics of its table spaces are determined
    by the DB2 Database Manager. And although the ALTER TABLESPACE command can be
    used to add new containers to existing DMS table spaces, it cannot be used to
    add new containers to automatic storage spaces. So how can you add new storage
    to the collection of paths that are used for automatic storage table spaces once
    a database has been created? To perform this type of operation, you must use the
    ALTER DATABASE statement. The basic syntax for this statement is:


    ```

    ALTER DATABASE [DatabaseName]

    ADD STORAGE ''/[Container1]'', ...

    ```


    where:


    - *DatabaseName* — Identifies the database, by name, that is to have new containers
    added to its pool of containers that are used for automatic storage.

    - *Container* — Identifies one or more new storage locations (containers) that
    are to be added to the collection of storage locations that are used for automatic
    storage table spaces.


    Thus, if you wanted to add the storage locations /data/path1 and /data/path2 to
    a database named SAMPLE that is configured for automatic storage and resides on
    a UNIX system, you could do so by executing an ALTER DATABASE SQL statement that
    looks like this:


    ```

    ALTER DATABASE sample

    ADD STORAGE ''/data/path1'', ''/data/path2''

    ```


    ## 1.7 A closer look at transaction logging


    A transaction (also known as a unit of work) is a sequence of one or more SQL
    operations grouped together as a single unit, usually within an application process.
    The initiation and termination of a single transaction defines points of data
    consistency within a database; either the effects of all operations performed
    within a transaction are applied to the database and made permanent (committed),
    or the effects of all operations performed are backed out (rolled back), and the
    database is returned to the state it was before the transaction was initiated.


    In most cases, transactions are initiated the first time an executable SQL statement
    is executed after a connection to a database has been made or immediately after
    a preexisting transaction has been terminated. Instances can be implicitly terminated
    using a feature known as “automatic commit” (in which case each executable SQL
    statement is treated as a single transaction, and any changes made by that statement
    are applied to the database if the statement executes successfully or discarded
    if the statement fails), or they can be explicitly terminated by the COMMIT or
    the ROLLBACK SQL statement.


    Transaction logging is a process that is used to keep track of changes made to
    a database by transactions, as they occur. Each update or delete operation performed,
    the page containing the record to be updated/deleted is retrieved from storage
    and copied to the appropriate buffer pool where it is modified by the update/delete
    operation. (If a new record is created by an insertion, that record is created
    directly in the appropriate buffer pool.) Once the record has been modified (or
    inserted), a record reflecting the modification/insertion is written to the log
    buffer, which is itself a designated storage area in memory. (The actual amount
    of memory for the log buffer is controlled by the logdatabase configuration parameter.)
    If an insert operation is performed, a record containing the new row is written
    to the log buffer; if a delete operation is performed, a record containing the
    row’s original values is written to the log buffer; and if an update operation
    is performed, the original value is overwritten with the row’s new values, is
    written to the log buffer. (If no replacement has occurred, an Exclusive OR operation
    is performed using the “before” and “after” rows and the results are written to
    the log buffer.) These kinds of records, along with records that indicate whether
    the transactions were responsible for making the changes committed or rolled back,
    make up the majority of the records stored in the log buffer.


    Whenever buffer I/O pages are cleared (I/O page cleaners are special agents responsible
    for writing modified pages at predetermined intervals), the log buffer becomes
    full, or a transaction is terminated (by being committed or rolled back), all
    records in the log buffer are written immediately to one or more log files. This
    is done to minimize the number of log records that might get lost in a system
    failure. As soon as log records associated with a particular transaction are externalized
    to one or more log files, the effects of the transaction are recorded in the database,
    such as executed against the appropriate table space. The modified pages remain
    in memory, where they can be quickly accessed if necessary—eventually, they will
    be overwritten as newer pages are retrieved from storage. The transaction logging
    process can be seen in Figure 16 on page 48.


    # Introduction to DB2 9.5 for Linux, UNIX, Windows


    ```

    INSERT INTO table1

    VALUES (4096, ''CHICAGO'')

    UPDATE table1

    SET coll = 2048

    WHERE col2 = ''NEW YORK''

    COMMIT

    ```


    ![](img/9d79d979aef40e6535a55c940991009e_49_0.png)


    ![](img/9d79d979aef40e6535a55c940991009e_49_1.png)


    Figure 16 The transaction logging process


    Because multiple transactions may be working with a database at any point in time,
    a single log file may contain log records that belong to several different transactions.
    Therefore, to keep track of which log records belong to which transactions, every
    log record is assigned a special "transaction identifier" that ties it to the
    transaction that created it. By using transaction IDs, log records associated
    with a particular transaction can be written to one or more log files at any time,
    without impacting data consistency — eventually the execution of the COMMIT or
    ROLLBACK statement that terminates the transaction will be logged as well.


    Because log records are externally finalized and because changes made by a particular
    transaction are only externalized to the database when the transaction itself
    is successfully terminated, the ability to return a database to a consistent state
    after a failure occurs is guaranteed — when the database is restarted, log records
    are analyzed, and each record that has a corresponding COMMIT record is reapplied
    to the database; every record that does not have a corresponding COMMIT record
    is either ignored or backed out (which is why "before" and "after" information
    is recorded for all update operations.


    ## 1.8 Configuring a DB2 9.5 database environment


    Earlier, we saw that a DB2 database environment contains a set of system objects
    that are used to control how resources are allocated for a server, an instance,
    or database. Along with the comprehensive set of registry variables, DB2 uses
    an extensive array of configuration parameters to control how system resources
    are allocated and utilized by an instance and a database. Unfortunately, the default
    values provided for many of the registry variables and configuration parameters
    that make these system objects were produced with very simple systems in mind
    (The goal was for DB2 to run out of the box, on virtually any platform, not for
    DB2 to run optimally on the platform on which it installed.) Thus, even though
    the default values provided are sufficient to meet most needs, you can often improve
    overall system and application performance simply by changing the values of one
    or more registry variables and/or configuration parameters.


    ### 1.8.1 Configuring servers


    During normal operation, the behavior of the DB2 Database Manager is controlled,
    in part, by a collection of variables that define the DB2 operating environment.
    Some of these values are operating system environment variables, and others are
    DB2-specific system-level variables known as registry variables. Registry variables
    provide a way to centrally control the database environment. Three registry profiles
    are available, and each controls the database environment at a different level.
    The registry profiles are available as follows:


    - **The DB2 Global — Level Profile Registry.** All-machine-wide variable settings
    are kept in this registry; one global-level profile registry exists on each DB2
    workstation. If an environment variable is to be set for all instances, this profile
    registry is used.

    - **The DB2 Instance — Level Profile Registry.** The environment settings for
    a particular instance are kept in this registry; this is where the majority of
    the DB2 environment variables are. (Values defined in this profile registry override
    any corresponding settings in the global-level profile registry.)

    - **The DB2 Instance Node — Level Profile Registry.** This profile registry contains
    variable settings that are specific to a partition (node) in a multipartitioned
    database environment. (Values defined in this profile registry override any corresponding
    settings in the global-level and instance-level profile registries.)


    DB2 looks for environment variable values in the DB2 global-level profile registry
    first, then in the instance-level profile registry, and finally, in the instance
    node-level profile registry.(Additional values may be set in individual sessions,
    in which DB2 will see these values last.)


    A wide variety of registry variables are available, and they vary depending on
    the operating system being used. A complete listing can be found in Appendix B
    of the IBM DB2 Version 9.5, Tuning Database Performance documentation.


    So how do you determine which registry variables have been set? Or more importantly,
    how do you assign values to one or more variables? One way is by executing the
    db2set system command. The basic syntax for this command is:


    ```

    .db2set

    <Variable> = [Value]

    <-g -gl | -i [InstanceName]

    <-all

    ```

