    # 1.6.3 Adding new containers to existing automatic storage table spaces


    Earlier, we saw that if a database is enabled for automatic storage spaces, the
    container-space-management characteristics of its table spaces are determined
    by the DB2 Database Manager. And although the ALTER TABLESPACE command can be
    used to add new containers to existing DMS table spaces, it cannot be used to
    add new containers to automatic storage spaces. So how can you add new storage
    to the collection of paths that are used for automatic storage table spaces once
    a database has been created? To perform this type of operation, you must use the
    ALTER DATABASE statement. The basic syntax for this statement is:


    ```

    ALTER DATABASE [DatabaseName]

    ADD STORAGE ''/[Container1]'', ...

    ```


    where:


    +   * DatabaseName — Identifies the database, by name, that is to have new containers
    added to its pool of containers that are used for automatic storage.

    * Container — Identifies one or more new storage locations (containers) that are
    to be added to the collection of storage locations that are used for automatic
    storage table spaces.


    Thus, if you wanted to add the storage locations /data/path1 and /data/path2 to
    a database named SAMPLE that is configured for automatic storage and resides on
    a UNIX system, you could do so by executing an ALTER DATABASE SQL statement that
    looks like this:


    ```

    ALTER DATABASE sample

    ADD STORAGE ''/data/path1'', ''/data/path2''

    ```'
