    - **DB2 for i/OS**。DB2 for i/OS 利用了 System i 的按需能力（例如动态分区），来快速响应变化的工作负载，以确保动态环境下的业务连续性。与其他
    DB2 版本不同，DB2 for i/OS 是直接构建在操作系统中的。因此，其版本/发布命名将与 DB2 for i/OS 的版本/发布编号方案不同，而非
    DB2 for Linux、UNIX 和 Windows 的版本/发布方案。DB2 for i/OS 的当前级别是版本 6 发布 1（V6R1）。


