    \ -noprompt\n```\n\nThe following symmir query example command checks the progress\
    \ of a split on the composite group MyConGrp. The -bg option is used to query\
    \ the status of the background split:\n\n```\nsymmir -cg MyConGrp query -bg\n\
    ```\n\n## 2.6.3 TimeFinder restore operations\n\nA BCV device can be used to fully\
    \ or incrementally restore data on the standard volume. Like the full establish\
    \ operation, a full restore copies the entire contents of the BCV devices to the\
    \ standard devices. The devices upon which the restore operates may be defined\
    \ in a device group, composite group, or device file. For example:\n\n```\nsymmir\
    \ -g MyDevGrp -full restore -noprompt\nsymmir -cg MyConGrp -full restore -noprompt\n\
    symmir -f MyFile -sid 109 restore -noprompt\n```\n\nThe incremental restore process\
    \ accomplishes the same thing as the full restore process with a major time-saving\
    \ exception. The BCV copies to the standard device only new data that was updated\
    \ on the BCV device while the BCV pair was split. The data on the corresponding\
    \ tracks of the BCV device also overwrites any changed tracks on the standard\
    \ device. This maximizes the efficiency of the resynchronization process. This\
    \ process is useful, for example, if after testing or validating an updated version\
    \ of a database or a new application on the BCV device is complete, a user wants\
    \ to migrate and utilize a copy of the tested data or application on the production\
    \ standard device.\n\n> An incremental restore to a standard volume is only possible\
    \ when the two volumes have an existing TimeFinder relationship\n\n## 2.6.4 TimeFinder\
    \ consistent split\n\nTimeFinder consistent split allows you to split off a dependent-write\
    \ consistent, restartable image of an application without interrupting online\
    \ services. Consistent split helps to avoid inconsistencies and restart problems\
    \ that can occur when splitting an application-related BCV without quiescing or\
    \ halting the application. Consistent split is implemented using Ingenuity Consistency\
    \ Assist (ECA) feature. This functionality requires a TimeFinder/CF license.\n\
    \nDeploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX\n\n## 2.6.4.1\
    \ Ingenuity Consistency Assist\n\nThe Ingenuity Consistency Assist (ECA) feature\
    \ of the Symmetrix operating environment can be used to perform consistent split\
    \ operations across multiple heterogeneous environments. This functionality requires\
    \ a TimeFinder/GC license and uses the `consistent` option of the split command.\n\
    \nUsing ECA to consistently split BCV devices from the standards, a control host\
    \ with no database or a database host with a dedicated channel to gatekeeper devices\
    \ must be available. The dedicated channel cannot be used for serving other devices\
    \ or to freeze I/O. For example, to split a device group, execute:\n\n```\nsymmir\
    \ -g MyDevGrp split -consistent -noprompt\n```\n\nFigure 29 illustrates an ECA\
    \ split across three database hosts that access devices on a Symmetrix system.\n\
    \n![](img/9d79d979aef40e6535a55c940991009e_84_0.png)\n\nFigure 29\n\nDevice groups\
    \ or composite groups must be created on the controlling host for the target application\
    \ to be consistently split. Device groups can be created to include all of the\
    \ required devices for maintaining business continuity. For example, if a device\
    \ group is defined that includes all of the devices accessed by Hosts A, B, and\
    \ C (see Figure 29), all of the BCV pairs related to those hosts can be consistently\
    \ split with a single command.\n\nHowever, if a device group is defined that includes\
    \ only the devices accessed by Host A, then the BCV pairs related to Host A can\
    \ be split without affecting the other hosts. The solid vertical line in Figure\
    \ 29 represents the ECA holding of I/Os during an instant split process, creating\
    \ a dependent-write consistent image in the BCVs.\n\nFigure 30 on page 84 illustrates\
    \ the use of local consistent split with a database management system (DBMS).\n\
    \n# EMC Foundation Products\n\n![](img/9d79d979aef40e6535a55c940991009e_85_0.png)\n\
    \nFigure 30 ECA consistent split on a local Symmetrix system\n\nWhen a split command\
    \ is issued with ECA from the production host, a consistent database image is\
    \ created using the following sequence of events in Figure 30:\n\n1. The device\
    \ group, device file, or composite group identifies the standard devices that\
    \ hold the database.\n2. SYMAPI communicates to Symmetrix Ingenuity to validate\
    \ that all identified BCV pairs can split.\n3. SYMAPI communicates to Symmetrix\
    \ Ingenuity to open the ECA window (the time within Symmetrix Ingenuity where\
    \ the writes are deferred), the instant split is issued, and the writes are released\
    \ by closing the window.\n4. ECA suspends writes to the standard devices that\
    \ hold the database, the DBMS cannot write to the devices and subsequently waits\
    \ for these devices to become available before resuming any further write activity:\
    \ Read activity to the device is not affected unless attempting to read from a\
    \ device with a write queued against it.\n5. SYMAPI communicates to Symmetrix\
    \ Ingenuity to acknowledge the split. The BCVs now contain a consistent image\
    \ of the database.\n6. ECA releases writes to the standard devices that hold the\
    \ database, the DBMS can now write to the devices.\n[/content] (Wait, I will just\
