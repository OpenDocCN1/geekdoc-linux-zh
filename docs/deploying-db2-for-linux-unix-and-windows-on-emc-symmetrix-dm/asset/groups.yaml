    Introduction to DB2 9.5 for Linux, UNIX, and Windows


    # 1.5 Creating a DB2 9.5 database


    There are two ways to create a DB2 9.5 database: by using the Create Database
    Wizard or by using the `CREATE DATABASE` command. In its simplest form, the syntax
    for the `CREATE DATABASE` command is:


    ```

    CREATE [DATABASE | DB] [DatabaseName]

    ```


    where:


    +   * Database — Identifies a unique name that is be assigned to the database
    once it is created.

    * Can consist of only the characters a through z, A through Z, 0 through 9, #,
    $, and _ (underscore);

    * Cannot begin with a number;

    * Cannot begin with the letter sequences "SYS", "DBM", or "IBM";

    * Cannot be the same as the name already assigned to any database within the same
    instance.


    When this form of the `CREATE DATABASE` command is executed, the characteristics
    of the database created, such as the storage location and transaction logging
    method used, are determined by several predefined defaults. If you wish to change
    any of the default characteristics, you must use a more complex form of the `CREATE
    DATABASE` command.


    If you prefer using graphical user interfaces to typing long commands, you can
    use the Create Database Wizard to construct a DB2 9.5 database. (The Create Database
    Wizard is designed to collect information that defines the characteristics of
    a database—and then create a database that has those characteristics. These same
    characteristics can be specified through the various options that are available
    with the `CREATE DATABASE` command.) The Create Database Wizard is invoked by
    selecting the appropriate action from the Databases menu found in the Control
    Center. Figure 8 on page 35 shows the Control Center menu items that must be selected
    to activate the Create Database Wizard; Figure 9 on page 36 shows what the first
    page of the Create Database Wizard looks like when it is first initiated.


    34 Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX'
