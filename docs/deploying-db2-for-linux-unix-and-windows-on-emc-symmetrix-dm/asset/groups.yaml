    |

    | 4 KB | RAID 5 元卷 | 32 页; 64 页 | |

    | 8 KB | RAID 5 | 16 页; 32 页 | |

    | 8 KB | 元卷 | 120 页; 240 页 | 对于某些应用程序可能太大了。使用 120 或 60 可能会在磁盘层面产生一些排队。 |

    | 8 KB | RAID 5 元卷 | 16 页; 32 页 | |

    | 16 KB | RAID 5 | 8 页; 16 页 | |

    | 16 KB | 元卷 | 60 页; 120 页 | |

    | 16 KB | RAID 5 元卷 | 8 页; 16 页 | |

    | 32 KB | RAID 5 | 4 页; 8 页 | 对于大型数据仓库可能太小了。考虑使用 4 的倍数，如 8、16 或 32。 |

    | 32 KB | 元卷 | 30 页; 60 页 | |

    | 32 KB | RAID 5 元卷 | 4 页; 8 页 | |


