  mdcn: "\n\n## 1.4 构成 DB2 数据库环境的对象\n\nDB2 9.5 使用了逻辑和物理存储模型，这些模型由不同但相互相关的对象组成。存在四类对象，它们是：\n\
    \n- **系统对象。** 系统对象由注册表变量、实例配置文件和单个数据库配置文件组成。注册表变量在系统级别设置，并可以影响驻在特定服务器上的任何实例：实例配置文件（也称为\
    \ DB2 数据库管理器配置文件）在实例创建过程中创建并分配给单个实例。配置文件中的值控制了如何为特定实例分配资源，且对这些值的更改会影响受该实例控制的每一个数据库。同样，数据库配置文件在数据库创建过程中创建并分配给单个数据库。数据库配置中的值控制了如何为该特定数据库分配资源，对这些值的更改可能会影响性能和资源利用率。\n\
    \n- **恢复对象。** 恢复对象由事务日志文件和恢复历史文件组成。这些文件在创建数据库时自动创建。恢复日志文件与数据库备份映像和事务日志结合一起使用，以协调数据库操作。恢复历史文件包含有关每次执行的备份操作的信息，而事务日志则包含了最近执行的数据库操作记录。如果数据库从应用程序、用户或系统错误中恢复，可以重放事务日志文件中的事件，将数据库恢复到一致且稳定的状态，或者恢复到错误发生时间点之前的状态——即启用前滚恢复（roll-forward\
    \ recovery）。你无法直接修改事务日志文件或恢复历史文件；但你可以控制事务日志文件的物理存储位置。\n\n- **存储对象。** 存储对象控制数据的物理存储位置，以及在正常运行期间数据在存储和内存之间的移动方式。使用了三种类型的存储对象，它们是：\n\
    \n- **缓冲池（Buffer pools）。** 缓冲池是内存的一个区域，专门用于缓存从物理存储中读取的数据页。当需要数据来解析查询时，会在物理存储中定位数据页并将其传输到缓冲池，并在其中进行读取或修改。如果页面被修改，它最终会被复制回物理存储；但在所有数据库的连接终止之前，该空间将保持被占用。此外，每当检索页面时，DB2\
    \ 数据库管理器都会使用一组启发式算法来确定哪些页面将是需要的，并同时检索这些页面（这被称为预取）。页面滞留和预取是为了提高整体性能；存储在内存中的数据访问速度远比存储在磁盘上快。\n\
    \n- **容器（Containers）。** 容器是 DB2 数据库管理器保留访问权限的某种物理存储形式。容器可以是可能存在也可以不存在的目录、可能存在也可以不存在的固定大小预分配文件，可以是操作系统识别的物理（原始）设备。（在\
    \ Linux 和 UNIX 操作系统上，设备上的物理设备可以是任何使用字符接口的逻辑卷；在 Windows 系统上，可以是任何未格式化的分区或任何物理磁盘）。\n\
    \n- **表空间（Table spaces）。** 表空间用于控制数据的物理存储位置，并在数据库对象（如表、索引和视图）与实际存储对象一个或多个容器（即目录、文件或原始设备）之间提供一个间接层。单个表空间可以跨多个容器，但每个容器只能属于一个表空间。\n\
    \n- **数据（或数据库）对象。** 数据对象——又称为数据库对象——用于逻辑地存储和操作数据，并控制所有用户数据（以及某些系统数据）的组织方式。数据对象包括表、索引、视图、别名、模式、触发器、用户定义类型、用户定义函数和序列。\n\
    \nLinux、UNIX 和 Windows 版 DB2 9.5 简介\n\n## 1.5 创建 DB2 9.5 数据库\n\n创建 DB2 9.5 数据库有两种方法：使用创建数据库向导（Create\
    \ Database Wizard）或使用 `CREATE DATABASE` 命令。在 `CREATE DATABASE` 命令的最简单形式下，其语法如下：\n\
    \n```sql\nsql \nCREATE [DATABASE] [DatabaseName]\n```\n\n其中：\n\n- Database — 指定创建后分配给数据库的唯一名称\n\
    - 可以由 a-z、A-Z、0-9、$ 和 _（下划线）字符组成\n- 不能以数字开头\n- 不能以 \"SYS\"、\"DB\" 或 \"IBM\" 开头\n\
    - 不能与该实例内的任何数据库名称相同\n\n当执行此 `CREATE DATABASE` 命令时，数据库的特性（如存储位置）由默认值决定。如果你希望更改这些默认特性，必须使用更复杂的\
    \ `CREATE DATABASE` 命令。\n\n如果你倾向于使用图形用户界面，可以使用创建数据库向导来构建数据库（创建数据库向导设计用于收集信息，然后创建具有这些特性的数据库）。通过在控制中心（Control\
    \ Center）中选择相应的项目来启动创建数据库向导。第 35 页的图 8 显示了必须选择以激活创建数据库向导的控制中心菜单；第 36 页的图 9 显示了首次启动时创建数据库向导的界面。\n\
    \n34 在 Linux、UNIX 和 Windows 上部署 DB2\n\n## Linux、UNIX 和 Windows 版 DB2 9.5 简介\n\n\
    ![img/9d79d79aef40e6535a55940911009e_36_0.png] 图8 从控制中心调用创建数据库向导\n\n创建 9.5 数据库\
    \ 35\n\n![img/9d79d79aef40e6535a55940911009e_37_0.png] 图9\n\n创建数据库向导的第一部分\n\n\
    一旦显示数据库向导，你只需按照每个面板上显示的说明来定义要创建的数据库特性。当你为 DB2 数据库管理器提供了足够的信息时，向导右下角的“完成”按钮（见图\
    \ 9）将可用。点击此按钮后，将根据提供的信息创建数据库。\n\n## 5.1 创建 DB2 9.5 数据库时发生了什么\n\n无论如何启动过程，每当创建一个新的\
    \ DB2 9.5 数据库时，都会按顺序执行以下任务：\n\n- 1. 在相应位置创建所有所需的目录和子目录。每个 DB2 数据库的信息都存储在一个特殊的层次目录树中。该树的实际创建位置由\
    \ `CREATE DATABASE` 命令提供的信息决定——如果没有提供位置，则在与创建数据库的实例相关的 `dfpath` 数据库管理器配置参数所指定的位置创建。该树的根目录被分配为实例名称。该目录将包含一个对应分区的子目录。如果数据库是分区数据库，该目录将命名为\
