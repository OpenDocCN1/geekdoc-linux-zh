    example, if a device group is defined that includes all of the devices accessed
    by Hosts A, B, and C (see Figure 29), all of the BCV pairs related to those hosts
    can be consistently split with a single command.


    However, if a device group is defined that includes only the devices accessed
    by Host A, then the BCV pairs related to Host A can be split without affecting
    the other hosts. The solid vertical line in Figure 29 represents the ECA holding
    of I/Os during an instant split process, creating a dependent-write consistent
    image in the BCVs.


    Figure 30 on page 84 illustrates the use of local consistent split with a database
    management system (DBMS).'
  - '[PAGE 85]


    # EMC Foundation Products


    ![](img/9d79d979aef40e6535a55c940991009e_85_0.png)


    Figure 30 ECA consistent split on a local Symmetrix system


    When a split command is issued with ECA from the production host, a consistent
    database image is created using the following sequence of events in Figure 30:


    +   1. The device group, device file, or composite group identifies the standard
    devices that hold the database.

    2. SYMAPI communicates to Symmetrix Enginuity to validate that all identified
    BCV pairs can split.

    3. SYMAPI communicates to Symmetrix Enginuity to open the ECA window (the time
    within Symmetrix Enginuity where the writes are deferred), the instant split is
    issued, and the writes are released by closing the window.

    4. ECA suspends writes to the standard devices that hold the database, the DBMS
    cannot write to the devices and subsequently waits for these devices to become
    available before resuming any further write activity: Read activity to the device
    is not affected unless attempting to read from a device with a write queued against
    it.

    5. SYMAPI sends an instant split request to all BCV pairs in the specified device
    group and waits for the Symmetrix to acknowledge that the foreground split has
    occurred. SYMAPI then communicates with Symmetrix Enginuity to resume the write
    or close the ECA window.

    6. The application resumes writing to the production devices. BCV devices now
    contain a restartable copy of the production data that is consistent until the
    time of the instant split. The production application is unaware of the split
    or suspend/resume operation. When the application on the secondary host is started
    by the BCVs, there is no record of a successful shutdown. Therefore, the secondary
    application instance views the BCV copy as a crashed instance and proceeds to
    perform the normal crash recovery sequence to restart.


    When performing a consistent split, it is a good practice to issue host-based
    commands that commit any data that has not been written to disk before the split.
    For example on UNIX systems, the sync command can be run. From a database perspective,
    a checkpoint or equivalent should be executed.


    Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX'
  - '[PAGE 86]


    # 2.6.5 TimeFinder/Mirror reverse split


    BCVs can be mirrored to guard against data loss through physical device failures.
    A reverse split is applicable for a BCV that is configured to have two local mirrors.
    It is generally used to recover from an unsuccessful restore operation. When data
    is restored from the BCV to the standard device, any writes that occur while the
    standard is being restored alter the original copy of data on the BCVs primary
    mirror. If the original copy of BCV data is needed again at a later time, it can
    be restored to the primary mirror from the BCVs secondary mirror using a reverse
    split. For example, whenever logical correction is introduced to a database during
    a recovery process (following a BCV restore), both the standard device and the
    primary BCV mirror are left with corrupted data. In this case, a reverse split
    can restore the original BCV data from a BCVs secondary mirror to its primary
    mirror.


    This is particularly useful when performing a restore and immediately restarting
    processing on the standard devices when the process may be restarted many times.


    > Note: Reverse split is not available when protected restore is used to return
    the data from the BCVs to the standards.


    # 2.6.6 TimeFinder/Clone operations


    TimeFinder/Clone operations using SYMCLI can create up to 16 copies from a source
    device onto target devices. Unlike TimeFinder/Mirror, TimeFinder/Clone does not
    require the traditional standard-to-BCV pairing. Instead, TimeFinder/Clone allows
    any combination of source and target devices. For example, a BCV can be used as
    the source device, while another BCV can be used as the target device. Any combination
    of source and target devices can be used. Additionally, TimeFinder/Clone does
    not use the traditional mirror positions the way TimeFinder/Mirror does. Because
    of this, TimeFinder/Clone is a useful option when more than three copies of a
    source device are desired.


    Normally, one of the three copies is used to protect the data against hardware
    failure.


    The source and target devices must be the same emulation type (FBA or CKD). The
    target device must be equal in size to the source device. Copies of stripped or
    concatenated volumes can also be created providing the source, and target volumetaus
    must be identical in configuration. Once activated, the target device can be instantly
    accessed by a target''s host, even before the data is fully copied to the target
    device.


    TimeFinder/Clone copies are appropriate in situations where multiple copies of
    production data is needed for testing, backups, or report generation. Clone copies
    can also be used to reduce disk contention and improve data access by assigning
    users to copies of data rather than accessing the one production copy. A single
    source device may maintain as many as 16 relationships that can be a combination
    of BCVs, clones and snaps.'
- md: '

    ## 2.6.6.1 Clone copy sessions


    TimeFinder/Clone functionality is controlled via copy sessions, which pair the
    source and target devices. Sessions are maintained on the Symmetrix system and
    can be queried to verify the current state of the device pairs. A copy session
    must first be created to define and set up the TimeFinder/Clone devices. The session
    is then activated, enabling the target device to be accessed by its host. When
    the information is no longer needed, the session can be terminated. TimeFinder/Clone
    operations are controlled from the host using the symclone command to create,
    activate, and terminate the copy sessions.


    Figure 31 illustrates a copy session where the controlling host creates a TimeFinder/Clone
    copy of standard device DEV001 on target device DEV005, using the symclone command.


    ![](img/9d79d979aef40e6535a55c940991009e_87_0.png)


    - 1. symclone create

    - 2. symclone activate


    **Figure 31 Creating a copy session using the symclone command**


    The symclone command is used to enable cloning operations. The cloning operation
    happens in two phases: creation and activation. The creation phase builds bitmaps
    of the source and target that are used later during the activation or copy phase.
    The creation of a copy session pairing does not start copying of source volume
    to the target volume, unless the -precopy option is used.


    For example, to create clone sessions on all the standards and BCVs in the device
    group MyDevGrp, use the following command:


    ```

    symclone -g MyDevGrp create -noprompt

    ```


    The activation of the clone session enables the copying of the data. The data
    may start copying immediately if the -copy keyword is used. If the -copy keyword
    is not used, tracks are only copied when they are accessed from the target volume
    or when they are changed on the source volume.


    Activation of the clone session established in the previous create command can
    be accomplished using the following command.


    ```

    symclone -g MyDevGrp activate -noprompt

    ```


    ## 2.6.7 TimeFinder/Snap operations


    Symmetrix DMX arrays provide another technique to create copies of application
    data. The functionality, called TimeFinder/Snap, allows users to make pointer-based,
    space-saving copies of data simultaneously on multiple devices from a single source
    device. The data is available for instant access. TimeFinder/Snap allows data
    to be copied from a single source device to as many as 128 target devices and
    later. A source device can be either a Symmetrix standard device or a BCV controlled
    by TimeFinder/Mirror; with the exception being a BCV working in clone mode. The
    target device is a Symmetrix virtual device (VDEV) which consumes negligible physical
    storage through the use of pointers tracked data.


    The VDEV is a host-addressable Symmetrix device with special attributes created
    when the DMX system is configured. However, unlike a BCV which contains a full
    volume of data, a VDEV is a logical-device that has a space-saving way to create
    instant point-in-time copies. Updates to a source device after its activation
    with a virtual device cause the pre-update image of the changed tracks to be copied.
    The virtual device''s indirect pointer is then updated to point to the original
    track data on the source device, providing a point-in-time image of the volume.
    TimeFinder/Snap uses this copy-on-write technique to conserve disk space, since
    only changes to tracks on the source cause any incremental storage to be consumed.


    The synsnap create and synmap activate commands are used to create source/target
    Snap pair.


    Table 4 summarizes the differences between devices used in TimeFinder/Snap operations.


    | Device | Description |

    | :--- | :--- |

    | Virtual device | A logical-image that saves disk space through the use of pointers
    to track data that is immediately accessible after activation. Snap data uses
    a copy-on-write technique. |

    | Save device | A device that is not host-accessible but accessed only through
    the virtual devices that points to it. Save devices provide a pool of physical
    space to store snap copy to which virtual devices point. |

    | BCV | A full volume mirror that has valid data after synchronizing with its
    source device. It is accessible only when split from the source device that it
    is mirroring. |


    ### 2.6.7.1 Snap copy sessions


    TimeFinder/Snap functionality is managed via copy sessions, which pair the source
    and target devices. Sessions are maintained on the Symmetrix system and can be
    queried to verify the current state of the devices. A copy session must be created—a
    process which defines the Snap devices in the operation. On subsequent activation,
    the target virtual devices become accessible to its host. Unless the data is changed
    by the hosting virtual device, the virtual device always presents a frozen-in-time
    copy of the source device at the point of activation. The information is no longer
    needed, the session can be terminated.


    TimeFinder/Snap operations are controlled by the host using the synsnap command
    to create, activate, and restore the TimeFinder/Snap operations described in this
    section explain how to manage the devices participating in a copy session through
    SYMLCI.


    Figure 32 illustrates a virtual copy session where the controlling host creates
    a copy of standard device VDEV001 on target device VDEV005.


    Controlling host


    ![](img/9d79d979aef40e6535a55c940991009e_89_0.png)


    - 1. synmap create

    - 2. synmap activate


    ICO-IMG-000010


    **Figure 32 TimeFinder/Snap copy of a standard device to a target**


    The synmap command is used to enable cloning operations. The cloning operation
    happens in two phases: creation and activation. The creation phase builds bitmaps
    of the source and target that are used later during the activation or copy phase.
    The creation of a copy session pairing does not start copying of source volume
    to the target volume, unless the -precopy option is used.


    For example, to create clone sessions on all the standards and BCVs in the device
    group MyDevGrp, use the following command:


    ```

    synmap -g MyDevGrp create -noprompt

    ```


    The activation of the clone session enables the copying of the data. The data
    may start copying immediately if the -copy keyword is used. If the -copy keyword
    is not used, tracks are only copied when they are accessed from the target volume
    or when they are changed on the source volume.


    Activation of the clone session established in the previous create command can
