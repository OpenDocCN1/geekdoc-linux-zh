    # 1.4 Objects that make up a DB2 database environment


    DB2 9.5 uses both a logical and a physical storage model that is comprised of
    different, yet related, objects. Four types of objects exist. They are:


    +   * **System objects.** System objects consist of registry variables, instance
    configuration files, and individual database configuration files. Registry variables
    are set at the system level and can affect any instance that resides on a particular
    server: Instance configuration files (also known as DB2 Database Manager configuration
    files) are created and assigned to individual instances during the instance creation
    process. Values in an configuration file control how resources are allocated for
    that particular instance, and changes to them affect every database that falls
    under that instance''s control. Similarly, database configuration files are created
    and assigned to individual databases during the database creation process. Values
    in a database''s configuration file control how resources are allocated for that
    particular database and changes to them can impact performance and resource utilization.


    +   * **Recovery objects.** Recovery objects consist of transaction log files
    and recovery history files. These are automatically created when a database is
    created. Recovery log files are used together with database backup images and
    transaction logs, to coordinate database operations. The recovery history file
    contains information about every backup executed, while transaction logs contain
    records of recent database operations performed. In the event a database has been
    recovered from an application, user, or system error, events in the transaction
    log files can be replayed to return the database to a consistent and stable state,
    or to return the database to the state it was in up to the point in time that
    the error occurred – roll-forward recovery is enabled. You cannot modify transaction
    log files or recovery history files directly; however, you can control where transaction
    log files are physically stored.


    +   * **Storage objects.** Storage objects control where data is physically stored
    and how data moves between storage and memory during normal operation. Three types
    of storage objects are used. They are:


    +   * **Buffer pools.** A buffer pool is a section of memory that has been reserved
    for the sole purpose of caching data pages as they are read from physical storage.
    When data is needed to resolve a query, the data page is located in physical storage
    and transferred to a buffer pool, where it is read or modified. If the page is
    modified, it is eventually copied back to physical storage; however space remains
    occupied until all connections to the database are terminated. Furthermore, whenever
    a page is retrieved, the DB2 Database Manager uses a set of heuristic algorithms
    to determine which pages will be needed next and those pages are retrieved as
    well (this is referred to as prefetching). Page retention and prefetching are
    done to improve overall performance; data can be accessed much faster when it
    is stored in memory than when it is stored on disk.


    +   * **Containers.** A container is some form of physical storage that the DB2
    Database manager has reserved access to. A container can be a directory that may
    or may not exist, a fixed-size, preallocated file that may or may not exist, or
    a physical (raw) device that is recognized by the operating system. (On Linux
    and UNIX operating systems, a physical device on device may have any logical volume
    that uses a character interface; on Windows systems any unformatted partition
    or any physical disk).'
  - '[PAGE 34]


    +   **Table spaces.** Table spaces are used to control where data is physically
    stored and to provide a layer of indirection between database objects (such as
    tables, indexes, and views) and one or more containers (that is, directories,
    files, or raw devices) in which the object''s data actually resides. A single
    table space can span many containers, but each container can only belong to one
    table space.


    +   **Data (or database) objects.** Data objects — otherwise known as database
    objects — are used to logically store and manipulate data, as well as to control
    how all user data (and some system data) is organized. Data objects include tables,
    indexes, views, aliases, schemas, triggers, user-defined data types, user-defined
    functions, and sequences.'
