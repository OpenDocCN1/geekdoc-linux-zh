    SRM performance statistics commands allow users to retrieve statistics about a
    host''s CPU, disk, and memory.


    Table 9 lists the statistics command.


    Table 9 SRM statistics command


    | Command | Argument | Action |

    |---|---|---|

    | symhost | show | Displays host configuration information. |

    | stats | Displays performance statistics. |'
