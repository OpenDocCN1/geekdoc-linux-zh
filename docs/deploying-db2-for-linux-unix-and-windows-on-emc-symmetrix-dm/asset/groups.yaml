    # 2.5.8 SRDF/A (Asynchronous) operation


    SRDF Asynchronous (SRDF/A) operations are supported with EMC Solutions Enabler
    SMLCLI 5.3 and higher. Symmetrix DMX arrays running Enginuity 5670 code and higher
    support SRDF/A mode for SRDF devices. Asynchronous mode provides a dependent-write
    consistent, point-in-time image on the target (R2) devices, which are slightly
    behind the source (R1) device. SRDF/A session data is transferred to the Remote
    Symmetric array in predefined time cycles or delta sets. This functionality requires
    an SRDF/A license.


