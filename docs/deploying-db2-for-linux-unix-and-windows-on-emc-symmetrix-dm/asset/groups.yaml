    A BCV device can be fully or incrementally established. After configuration and
    initialization of a Symmetrix system, BCV devices contain no data. BCV devices,
    like standard devices, can have unique host addresses and can be online and ready
    to the host(s) to which they are connected. A full establish operation must be
    used the first time the standard devices are paired with the BCV devices. An incremental
    establish of a BCV device can be performed to resynchronize any data that has
    changed on the standard since the last establish operation.


    > Note: When BCVs are established, they are inaccessible to any host.


    Symmetrix systems allow up to four mirrors for each logical volume. The positions
    are commonly designated M1, M2, M3, and M4. An unprotected BCV can be the second,
    third, or fourth mirror position of the standard device. A host, however, logically
    views the Symmetrix M1/M2 mirrored devices as a single device.


    To assign a BCV as a mirror of a standard Symmetrix device, the socalled establish
    command is used. One method of establishing a BCV pair is to allow the standard/BCV
    device-pairing algorithm to arbitrarily create BCV pairs from multiple devices
    within a device group:


    ```

    symmir -g MyDevGrp establish

    ```


