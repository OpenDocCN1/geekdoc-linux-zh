- md: '

    ## 3.7.5 Space prefetch size


    When only one or just a few consecutive pages are retrieved from DB2 LU database,
    data is transferred from storage to memory one page at a time. When a large amount
    of data is needed, DB2 retrieves one or more additional pages from disk in anticipation
    that they will also be needed. This behavior is known as prefetching and the prefetching
    of index and data pages into memory can help performance by reducing I/O wait
    time.


    Like the extent, a table''s prefetch size is defined during the table space creation
    process; unlike the extent, a table''s prefetch size can be changed after the
    table space has been populated. When it comes to deciding on the best prefetch
    size to use, the best and most convenient way to do is let the DB2 Database Manager
    make the decision. This is done by assigning the table space prefetch size configuration
    parameter AUTOMATIC, or by assigning the value AUTOMATIC to the db_prefetch_size
    parameter when creating a new table space. For example, to create a DBMS space
    named _TBSP_ that the DB2 Database Manager will be responsible for determining
    the optimum prefetch size to use, you need to execute a CREATE TABLESPACE statement
    that looks like this:


    ```sql

    CREATE TABLESPACE my_tsp

    MANAGED BY DATABASE

    USING FILE ''/home/my_tsp.dat'' EXTENT 2M

    PREFETCHSIZE AUTOMATIC

    ```


    If a table is created in this manner, DB2 will determine the optimum prefetch
    size to use (and update that value periodically) by solving the following equation:


    - Prefetch size = Number of table space containers * Number of physical disks
    per container * Extent size


    The number of physical disks per container defaults to 1, unless a different value
    is specified through the DB2_PARALLEL_TO_registry variable.


    ## 3.7.6 Overhead


    Overhead refers to I/O overhead as well as disk latency time, which includes the
    disk seek time (in number of milliseconds) and is used to determine the cost of
    I/O during query optimization. For a database that was created using DB2 version
    9 or later, the default I/O controller and disk seek and latency time is 7.5 milliseconds.
    For a database that was migrated from a previous version of DB2 to version 9 or
    later, the default is 12.67 milliseconds.


    The following formula can be used to help estimate the overhead cost:


    > Overhead = Average seek time in milliseconds * (0.5 * Rotational latency)


    where 0.5 represents an overhead of half rotation and rotational latency is calculated
    in milliseconds for each full rotation, as follows:


    ```

    (1 / RPM) * 60 * 1000

    ```


    (Here you divide by rotations per minute to get meters per rotation, multiply
    by 60 seconds per minute, and finally, multiply by 1,000 milliseconds per second.)


    For example, if a drive is rated at 7,200 rpms, its rotational latency would be
    calculated as follows:


    ```

    (1 / 7200) * 60 * 1000 = 8.328 milliseconds

    ```


    Optimizing table space performance when storage containers reside on RAID devices


    If the average seek time for this disk is assumed to be 11 milliseconds, the overhead
    can be calculated as follows:


    ```

    Overhead = 11 + (0.5 * 8.328)

    = 15.164 milliseconds

    ```


    Table 12 shows suggested overhead values for Symmetrix DMX storage arrays.


    | Disk capacity | Overhead |

    |---|---|

    | 73 GB - 10,000 rpm | 8.6 ms |

    | 73 GB - 15,000 rpm | 5.6 ms |

    | 146 GB - 10,000 rpm | 8.6 ms |

    | 146 GB - 15,000 rpm | 5.6 ms |

    | 73 GB / 146 GB - Flash Drive | 0.0 ms |


    ## 3.7.7 Transfer rate


    Transfer rate refers to the time (in milliseconds) it takes to read one page into
    memory. This value is also used to determine the cost of I/O query optimization.
    For a database that was created using DB2 LU Version 9 or later, the default time
    to read one page into memory is 0.06 milliseconds. For a database that was migrated
    from a previous version of DB2 to Version 9 or later, the default is 0.18 milliseconds.


    If each table container is a physical disk, you can use the following formula
    to estimate the transfer cost in milliseconds per page:


    ```

    Transfer rate = (1 / Spec_rate) * 1000 / 1024000 * Page size

    ```


    (where Spec_rate represents the disk specification for the transfer rate, in MB
    per second, multiply by 1000 milliseconds per second, divide by 1,024,000 bytes
    per MB, and multiply by page size, in bytes.)


    For example, if the specification rate for a disk drive is 3 MB per second and
    a page size of 4K is used, the transfer rate can be calculated as:


    ```

    Transfer rate = (1 / 3) * 1000 / 1024000 * 4096

    = 13.3332 milliseconds per page

    ```


    If the table containers are not physical disks, but instead arrays of disks (such
    as RAID), then additional considerations must be taken into account when attempting
    to determine the appropriate transfer rate. If the array is relatively small you
    can multiply the disk specification transfer rate (Spec_rate) by the number of
    disks used, assuming that the bottleneck is at the disk level. However, if the
    number of disks in the array is large, the bottleneck may not be at the disk level,
    but at one of the other I/O subsystem components such as disk controllers, I/O
    busses, or the system bus. In this case, you cannot assume that the I/O throughput
    capability is the product of the disk specification transfer rate and the number
    of disks. Instead, you must measure the actual I/O rate in MB/s during a sequential
    scan and divide the result by the number of containers that make up the table
    space.


    For example, a measured sequential I/O rate of 100 MB per second for a table in
    a four container table space would imply 25 MB per second per container, or a
    transfer rate of (1/25) * 1000 / 1024000 * 4096 = 163.84 milliseconds per page.


    Table 13 shows suggested transfer rates for Symmetrical storage arrays.


    | Disk capacity | 4 KB page | 8 KB page | 16 KB page | 32 KB page |

    |---|---|---|---|---|

    | 73 GB - 10,000 rpm | 8.6 ms | 4.3 ms | 2.2 ms | 1.1 ms |

    | 73 GB - 15,000 rpm | 5.6 ms | 2.8 ms | 1.4 ms | 0.7 ms |

    | 146 GB - 10,000 rpm | 8.6 ms | 4.3 ms | 2.2 ms | 1.1 ms |

    | 146 GB - 15,000 rpm | 5.6 ms | 2.8 ms | 1.4 ms | 0.7 ms |

    | 73 GB / 146 GB - Flash Drive | 0.0 ms | 0.0 ms | 0.0 ms | 0.0 ms |

