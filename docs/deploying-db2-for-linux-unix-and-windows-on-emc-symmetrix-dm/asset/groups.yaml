    from the production hosts to a standard was not accepted until it was split from
    the BCV pair. Therefore, applications attempting to access a regular split would
    experience a short wait during a regular split. Once the split was complete, no
    further overhead was incurred.


    With Engineering version 5568, any split operation is an instant split. Regular
    split is still valid for earlier versions and for current applications that perform
    regular split operations. However, current applications that perform regular splits
    with Engineering version 5568 actually perform an instant split. It is no longer
    required because instant split mode has become the default behavior. It is beneficial
    to continue using the -instant flag with later Engineering versions, otherwise
    the default is to wait for the regular split to complete.


