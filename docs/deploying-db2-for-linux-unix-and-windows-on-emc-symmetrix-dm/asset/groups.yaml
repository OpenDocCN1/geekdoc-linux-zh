    \ DB2 来说通常不是好事。\n\n## 4.8 多分区组共享磁盘\n\n之前我们看到，在分区数据库环境中，并不限制每个表和表空间跨越所有分区。DB2 支持部分去聚集（partial\
    \ declustering），这意味着你可以将表空间分布在数据库子集上。用户可以通过分区组来确定数据分布在哪些以及多少数据库分区上。\n\n图 45 显示了一种布局，其中四个分区组拥有分配给数据库的物理磁盘的一部分。每个分区组跨每个磁盘，但每个磁盘可以分配给多个组。（给定的表空间分布在单个分区组上。）这样，特定的分区将处理给定的读取请求，生成的并行操作之间不会产生冲突。\n\
    \n![](img/9d79d979aef40e6535a55c940991009e_141_0.png)\n\n图 45 全共享磁盘——多分区组\n\n\
    在这样的配置下，有人认为由于只有数据库子集可以处理任何单个表扫描，DB2 提供的并行性降低了。同样也可以认为，磁盘本身决定了 I/O 并行性，由于每个分区组都可以访问每个磁盘，可以实现最大水平的并行。\n\
    \n## 4.9 多分区数据库共享磁盘\n\n在共享阵列上布局分区数据库的另一种解决方案是在分区数据库之间共享磁柱，但在同一个数据库内部共享磁柱。这一概念基于数据库在不同时间有峰值和低谷，并且即使位于同一组物理磁盘上的不同数据库之间也可能发生冲突，冲突不能归因于单个数据库的单个查询。图\
    \ 46 展示了此类配置看起来的样子。\n\n![](img/9d79d979aef40e6535a55c940991009e_142_0.png)\n\n\
    图 46 全共享磁盘——多数据库\n\n"
