    The synmap command is used to enable TimeFinder/Snap operations. The snap operation
    happens in two phases: creation and activation. The creation phase builds bitmaps
    of the source and target that are later used to manage the changes on the source
    volume to the target volume. To create a snap pairing does not copy the data from
    the source volume to the target volume. To create snap sessions on all the standards
    and BCVs in the device group MyDevGrp, we use the following command.


    ```

    synmap -g MyDevGrp create -noprompt

    ```


    The activation of a snap enables the protection of the source data tracks. When
    protected tracks are changed on the source volume, they are first copied into
    the save pool and the VDEV pointers are updated to point to the changed tracks
    in the save pool. When changes are changed on the VDEV, the data is written directly
    to the save pool and the VDEV pointers are updated in the same way.


    Activation of the snap session created in the previous create command can be accomplished
    using the following command.


    ```

    synmap -g MyDevGrp activate -noprompt

    ```'
