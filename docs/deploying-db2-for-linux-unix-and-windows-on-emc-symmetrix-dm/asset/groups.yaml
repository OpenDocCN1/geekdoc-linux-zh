    # DB2 9.5 for Linux, UNIX, and Windows Databases


    While reads can use cache as required to satisfy host requests (assuming free
    cache slots are available), the Symmetrix DMX limits the number of write operations
    that can be sent to a single device. This "writing-pending limit" is designed
    to prevent an application with high write rates to a single volume from consuming
    all of available storage array cache at expense of read/or write operations to
    other values. If the device writing-pending limit is reached, all write pending
    data for that device must be destaged before any new write requests are processed.
    This forced destaging to disk limits writes to that particular volume to physical
    disk speeds, which in turn significantly reduces performance.


    In addition to the writing-pending limits there are limits imposed at the storage
    subsystem level. When these limits are reached, the DMX operates as "priority
    degrade" mode. In this mode, destaging writes to disk is the highest priority
    tasks for the disk adapters; the result is a decrease in performance of both reads
    and writes from the host.


    The number of cache boards can also have a minor effect on performance. Comparing
    Symmetrix DMX arrays that have the same amount of cache, increasing the number
    of boards (for example, four cache boards with 16 GB each or two cache boards
    with 32 GB each) has a small positive effect on the performance in DSS applications.
    This is because of the increased number of paths between front-end directors and
    cache, and has the effect of improving overall throughput. However, configuring
    additional boards is helpful only in high-throughput environments such as for
    OLT workloads, where IOPS are more critical than throughout, additional cache
    directors provide no performance benefits. This is because the processing power
    of CPUs on each board limits the number of IOPS per port or director.


    ## 3.1.3 Back-end


    Advances in disk technologies have not kept up with technological advancements
    in other parts of the storage array, such as directors and bandwidth. Consequently,
    some bottlenecks in a Symmetrix DMX are directly attributable to disk drive limitations.
    To reduce or eliminate back-performance issues on the Symmetrix DMX, care should
    be taken to spread I/O over many back-end directors and physical spindles as possible
    (as opposed to allocating specific directors and spindles to individual applications).


    One of the most important things that can be done to ensure optimum back-performance
    is to handle the anticipated I/O load. Each physical disk is capable of performing
    a limited number of operations and all algorithms in the Symmetrix DMX Infinity
    operating environment will help reduce the number of reads and writes to disk,
    particularly to support random operations, which is still a limiting factor. If
    an insufficient number of physical disks are available to handle the I/O workload,
    performance will suffer. Therefore, the decision of how many disk spindles to
    use for a DB2 LU workload should be based on I/O performance requirements — not
    on anticipated storage capacity.


    Significant attention should also be given to balancing the I/O workload across
    all physical spindles. If available space I/O patterns are known in advance, contention
    can be minimized and performance can be improved by storing table sets that see
    a large amount of I/O on separate physical disks. However, because I/O patterns
    may change over time, balancing the I/O workload across all disks may still be
    the best solution. The Symmetrix Optimizer can also help reduce I/O contention
    between hypervolumes over a single physical spindle (Symmetrix Optimizer is an
    invaluable tool to help reduce contention on physical disk spindles should workload
    requirements change.) When used, Symmetrix Optimizer seeks I/O contention on individual
    hypervolumes and nondisruptively moves the hypervolumes to a new location on another
    disk if a contention situation is found.


    Where data is placed on a disk can also have an impact on performance. Because
    of the rotational properties of disks, tracks on the outer parts of a disk perform
    better than tracks near the center. And while algorithms in the Symmetrix DMX
    Engine operating environment smooth out of this variation, increases in performance
    can be achieved by directing high I/O to the outer parts of a disk. There is minimum
    movement associated with disk movement between hypervolumes on a spindle. Disk
    movement across platters (seek time) is a large source of latency in I/O performance.
    Placing hypervolumes that receive higher I/O activity in proximity of each other
    may reduce disk head movement, thereby increasing disk performance.


    ## 3.1.4 Other considerations


    Along with front-end connectivity, cache utilization, and the back-end configuration,
    there are some additional factors that can influence the choice of the layout
    to use for a given database configuration. These factors include:


    - Host bus adapters. A host bus adapter (HBA) is a circuit board and/or integrated
    circuit adapter that provides physical connectivity to a server and a storage
    device. (An HBA and its associated disk subsystems are sometimes referred to as
    a disk channel.) Because the HBA relieves the host microprocessor of both data
    storage and retrieval tasks, it can improve server performance. However, HBAs
    can become a bottleneck if an insufficient number of them are provisioned. When
    designing DB2 database systems, the amount of throughput required should be taken
    into consideration and a sufficient number of HBAs should be provisioned accordingly.


    - Host addressing limitations. On many host platforms, there is a limitation on
    the number of LUNs that can be addressed by a single HBA. For example, on AIX
    the maximum number of LUNs that can be presented is 512, while on other operating
    systems, the maximum number is 256. This limitation must be taken into account
    when designing a database storage infrastructure.


    ## 3.2 RAID


    Redundant Array of Independent Disks (RAID) technology provides protection from
    disk failure (through redundancy), substantial improvement in performance (by
    distributing information across disks), and high availability. There are many
    different levels in which RAID can be implemented:


    - RAID 1: RAID 1 is simply disk mirroring. A RAID 1 configuration consists of
    two disks and every write is written to both disks. The environment allows both
    copies of data to be read to satisfy requests that are not already in cache. If
    the disk fails, the mirror drive is used for recovery. RAID 1 offers high availability
    and performance, but because it doubles the number of spindles used, it is more
    costly.


    - RAID 5: RAID 5 provides protection by writing data in stripes across all spindles
    used in an array and calculating a parity value for each stripe, which is then
    stored with the data across all drives in the array. Parity is nothing more than
    a redundancy check that ensures data is protected without having to use duplicate
    disks; if any disk in the array fails, parity can be used in conjunction with
    the remaining drives to re-create the failed disk''s contents, thereby preventing
    data from being lost. RAID 5 offers good availability and performance at a lower
    cost than RAID 1.


    - RAID 6: RAID 6 is an extension of RAID 5 with dual parity. It provides protection
    by writing data in stripes across all spindles used in an array and calculating
    two parity values for each stripe, which are stored with the data across all the
    drives in the array. The goal of dual parity is to improve fault tolerance; RAID
    6 provides fault tolerance in the event two disk drives fail at the same time
    while RAID 5 can handle at most one failure. This makes RAID 6 groups more practical,
    especially for high availability systems.

