    # 重要


    切勿尝试修改此目录结构或存储其中的任何文件。此类操作可能会破坏一个或多个数据库或导致它们无法使用。


    系统会创建用于管理、监控和数据库恢复的文件。


    在分配了数据库令牌名称的子目录创建后，该目录中会创建以下文件：


    - db2rhist.asc — 此文件包含有关备份操作、恢复操作、表加载操作、表重组操作、空间分配以及类似的数据库更改的历史信息（即恢复历史文件）。

    - db2rhist.bak — 此文件是 db2rhist.asc 的备份副本。

    - SQLBP.1 — 此文件包含缓冲池信息。

    - SQLBP.2 — 此文件是 SQLBP.1 的备份副本。

    - SQLDBCON — 此文件包含数据库配置信息。

    - SQLDBCNF — 此文件包含用于确保数据库仅分配给 DB2 Manager 的一个实例的信息。

    - SQLOGCTL.LFH — 此文件包含有关活动事务日志文件的信息。恢复操作使用此文件中存储的信息来确定从日志回溯多远开始恢复过程。

    - SQLOGMIR.LFH — 这是 SQLCTL.LFH 的镜像副本。

    - SQLGSF.1 — 此文件包含与自动存储相关的存储路径。

    - SQLGSF.2 — 此文件是 SQLGSF.1 的备份副本。

    - SQLSPCS.1 — 此文件包含表空间信息。

    - SQLSPCS.2 — 此文件是 SQLSPCS.1 的备份副本。

    - SQLTMPLK — 此文件包含有关临时表空间的信息。


    创建两个子目录 DB2EVENT 和 SQLLOGDIR；并创建命名为 S0000000.LOG、S0000001.LOG 和 S0000002.LOG 的详细事件监器文件，存储在
    SQLLOGDIR 目录中。这三个文件用于在对数据库执行 SQL 操作时存储事务记录。


    为数据库创建一个缓冲池。


    在数据库创建过程中，会创建一个缓冲池并将其命名为 IBMDEFAULTBP。在默认情况下，在 Linux 和 UNIX 平台上，此缓冲池的大小为 1,000
    KB（千字节）页；在 Windows 平台上，此缓冲池的大小为 250 KB 页。此缓冲池（以及可能存在的任何其他缓冲池）实际使用的内存是在建立到数据库的第一个连接时分配的，并在所有到数据库的连接都终止时释放的。


    创建两个普通表空间和一个临时表空间。


    在创建缓冲池 IBMDEFAULTBP 之后，会创建三个表空间并将它们与该缓冲池关联。这三个表空间如下：


    - 一个名为 SYCSSPACE 的普通表空间，用于存储与数据库相关的系统目录表和视图

    - 一个名为 USERS1 的普通表空间，用于存储所有用户定义对象（如表、索引等）以及用户数据


    # Linux 和 Windows 版 DB2 9.5 简介


    - 一个名为 TEMPSPACE1 的系统临时表，用于数据排序、表重组和创建索引等操作的临时存储区域


    除非另有说明，SYSCSPACE 和 USERSPACE1 是 DMS FILE 表空间，TEMSPACE1 是 SMS 表空间；这些每个表的特征可以作为
    CREATE DATABASE 命令或数据库创建向导的输入。


    5. 创建系统目录表和视图。


    在创建表 SYSCSPACE 后，在该表内部构造了一组特殊的表，称为系统目录表。DB2 数据库管理器使用系统目录表来跟踪对象定义、数据库对象依赖关系、数据库对象权限、列数据类型、表约束和对象关系等信息。在创建系统目录表的同时，还会创建一组系统目录视图，这些视图通常用于访问存储在系统目录表中的数据。系统目录表和视图无法通过
    SQL 语句进行修改（但可以查看其内容）。相反，每当发生以下事件之一时，DB2 Manager 都会对其进行修改：


    - 创建、更改或删除数据库对象（如表、视图或索引）。

    - 授予或撤销授权或权限。

    - 为表收集统计信息。

    - 将包（Packages）绑定到数据库。


    在大多数情况下，当对象创建时，数据库对象的完整特征都存储在一个或多个系统目录表中。然而，在某些情况下（例如定义触发器和约束时），用于创建该对象的实际 DB2.5
    SQL 会存储在内部。


    6. 在系统和本地数据库目录（创建的系统或本地数据库目录）中对数据库进行编编。


