    此前，我们看到，如果数据库启用了自动存储空间，则其表空间的容器-空间-管理特性由 DB2 数据库管理器决定。虽然可以使用 `ALTER TABLESPACE`
    命令为现有的 DMS 表空间添加新容器，但它无法用于为自动存储空间添加新容器。那么，在数据库创建后，你如何向用于自动存储表空间的路径集合中添加新的存储呢？要执行此类操作，你必须使用
    `ALTER DATABASE` 语句。该语句的基本语法如下：


    ```

    ALTER DATABASE [DatabaseName]

    ADD STORAGE ''/[Container1]'', ...

    ```


    其中：


    - *DatabaseName* — 通过名称标识数据库，该数据库将在其用于自动存储的容器池中添加新容器。

    - *Container* — 标识一个或多个新的存储位置（容器），这些位置将添加到用于自动存储表空间的存储位置集合中。


    因此，如果你想为名为 SAMPLE 的、配置了自动存储且运行在 UNIX 系统上的数据库添加存储位置 `/data/path1` 和 `/data/path2`，可以通过执行如下所示的
    `ALTER DATABASE` SQL 语句来实现：


    ```

    ALTER DATABASE sample

    ADD STORAGE ''/data/path1'', ''/data/path2''

    ```


    ## 1.7 更深入地审视事务日志


    事务（也称为工作单元）是分组组合为单个单元的一个或多个 SQL 操作的序列，通常在应用程序过程中执行。事务的启动和终止定义了数据库内部数据一致性的点：要么事务内执行的所有操作的影响都应用于数据库并持久化（提交），要么执行的所有操作的影响都被撤销（回滚），数据库恢复到事务启动之前的状态。


    在大多数情况下，事务是在建立数据库连接后首次执行可执行 SQL 语句时启动的，或者在预存事务终止后立即启动。实例可以使用名为“自动提交”（automatic
    commit）的功能进行隐式终止（在这种情况下，每个可执行的 SQL 语句被视为单个事务，如果语句执行成功，则该语句的任何更改将应用于数据库；如果语句失败，则丢弃），也可以通过
    `COMMIT` 或 `ROLLBACK` SQL 语句显式终止。


    事务日志是一个用于跟踪事务在发生时对数据库所更改的过程。每执行一次更新或删除操作，包含要更新/删除记录的页面将从存储中检索并复制到相应的缓冲区池中，在那里由更新/删除操作进行修改。（如果通过插入创建了新记录，则该记录将直接在相应的缓冲区池中创建。）一旦记录被修改（或插入），反映该修改/插入的记录就会写入日志缓冲区，日志缓冲区本身是内存中的一个指定存储区域。（日志缓冲区的实际内存大小由
    `logdatabase` 配置参数控制。）如果执行了插入操作，则一个包含新行的记录将被写入日志缓冲区；如果执行了删除操作，则一个包含行原始值的记录将被写入日志缓冲区；如果执行了更新操作，则原始值被行的新值覆盖，并写入日志缓冲区。（如果没有发生替换，则将使用“之前”行和“之后”行执行异或（Exclusive
    OR）操作，并将结果写入日志缓冲区。）此类记录以及指示事务是负责提交还是回滚更改的记录，构成了日志缓冲区中存储的大部分记录。


    当缓冲区 I/O 页面被清除时（I/O 页面清理程序是负责按预定义间隔写入修改页面的特殊代理）、日志缓冲区变满，或事务终止（通过提交或回滚）时，日志缓冲区中的所有记录都会立即写入一个或多个日志文件。这样做是为了尽可能减少在系统故障时可能丢失的日志记录数量。一旦与特定事务相关的日志记录外部化到一个或多个日志文件中，事务的影响就会记录在数据库中，例如在相应的表空间上执行。修改后的页面保留在内存中，如有需要可以快速访问——最终，当从存储中检索到新的页面时，它们将被覆盖。事务日志过程可以参见第
    48 页的图 16。


