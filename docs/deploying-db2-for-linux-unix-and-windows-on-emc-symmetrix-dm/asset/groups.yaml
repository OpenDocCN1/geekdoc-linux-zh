    ## 2.6.7 TimeFinder/Snap 操作


    Symmetrix DMX 列提供了另一种创建应用程序数据副本的技术。这种名为 TimeFinder/Snap 的功能允许用户从单个源设备在多个设备上同时创建基于指针的节省空间的数据副本。数据可以被时访问。TimeFinder/Snap
    允许数据从一个源设备复制到多达 128 个目标设备。源设备可以是 Symmetrix 标准设备，也可以由 TimeFinder/Mirror 控制的 BCV；但工作在克隆模式下的
    BCV 除外。目标设备是 Symmetrix 虚拟设备（VDEV），通过使用跟踪数据的指针来消耗忽略不计的物理存储。


    VDEV 是一个主机可寻的 Symmetrix 设备，在配置 DMX 系统时创建具有特殊属性。然而，与包含完整数据卷的 BCV 不同，VDEV 是一种逻辑设备，具有一种节省空间的方法来创建即时时间点副本。虚拟设备激活后对源设备进行的更新会导致更改轨道的预更新镜像被复制。随后，虚拟设备的间接指针将更新为指向源设备上的原始轨道数据，从而提供卷的时间点镜像。TimeFinder/Snap
    使用这种写时复制（copy-on-write）技术来节省磁盘空间，因为只有源端轨道的更改会导致增量存储消耗。


    `synsnap create` 和 `synmap activate` 命令用于创建源/目标 Snap 对。


    表 4 总结了 TimeFinder/Snap 操作中使用的设备之间的差异。


    | 设备 | 描述 |

    | :--- | :--- |

    | 虚拟设备 (Virtual device) | 一种逻辑镜像，通过跟踪数据的指针节省磁盘空间，激活后即可立即访问。Snap 数据使用写时复制技术。 |

    | 保存设备 (Save device) | 一种主机不可访问的设备，仅通过指向它的虚拟设备访问。保存设备提供物理空间池，用于存储虚拟设备指向的 snap
    副本。 |

    | BCV | 完整卷镜像，在与其源设备同步后具有有效数据。仅在从镜像的源设备拆分时可访问。 |


