    ## 3.6 在 Symmetrix DMX 上部署 DB2 5 数据库的建议


    到为止，我们已经介绍了在 Symmetrix DMX 上设计 DB2 LUW 数据库布局时需要注意的一些，并看到了某些决策如何对数据库性能产生重大影响。但我们还没有回答这个问题：“在
    EMC Symmetrix DMX 存储上部署适用于 Linux、UNIX 和 Windows (DB2 LUW) 的 DB2 5 的最佳方法是什么？”


    在 SAN 环境中部署 DB2 数据仓库时，IBM 有一种特殊的配置被称为“平衡数据仓库”（Balanced Warehouse，以前称为“BCU”）。平衡仓库是一个经过良好定义、测试、练习和压力测试的配置，专门为数据仓库工作负载设计。数据仓库设计、服务器配置、LV
    设置、布线和存储配置都是根据非常严格的指南进行专门布局的。然而，平衡配置是基于 IBM 硬件和软件构建的——它没有考虑到 Symmetrix DMX 的特性。平衡仓库也没有解决
    OLTP 环境。以下建议同时适用于 OLTP 和 DSS 环境，是在审阅数据仓库文档并咨询 IBM DB2 专家后得出的。


    由于驱动器速度与 CPU 性能之间的差距，IBM 保守地估计需要 20 个头来保持一个 CPU（或内核）忙碌。这意味着，如果你的存储系统由 14 GB、15,000
    rpm 的磁盘驱动器组成，大约需要 3 TB 的存储空间给每个 CPU，除非你正在部署一个大型数据仓库，否则其中 50% 或更多将处于“浪费”，仅仅是为了确保数据库服务器不会成为
    I/O 瓶颈。大多数公司并不愿意这样做。


    DB2 的缓冲池技术在将频繁访问的数据和索引保留在内存中并将一次性访问数据排除在外方面表现出色；一次性数据备份镜像和输入文件不存储在缓冲池中。因此，DB2
    缓冲命中率通常在 90% 左右更高。未导致缓冲命中的请求需要存储子系统的 I/O。由于 Symmetrix DMX 具有极大的缓存能力（高达 25 GB），此类
    I/O 请求经常从缓存中满足，而不需要额外的 I/O。凭借 Enginity 运行环境中提供的所有复杂的 LRU 和高级预取算法，已测量出 OLTP 工作负载的缓存命中率为
    90%，而数据仓库和 DSS 工作负载的命中率通常为 60%。因此，在 Symmetrix DMX 中，缓存表现为 DB2 缓冲池的扩展。


    ### 3.6.1 典型的存储布局


    假设每个 CPU 需要 20 个头来防止数据库服务器成为 I/O 密集型，那么利用所有这些头的最佳方法是什么？为了回答这个问题，我们必须首先考虑用于保护数据的
    RAID 保护方案。根据 IBM DB2 专家的意见，一个好的经验法是：使用 RAID 5 技术保护表空间数据（用户数据、索引等）以及事务日志，并使用 RAID
    1 或 RAID 1+0 技术保护 DB2 元数据。由于推荐了两种不同的 RAID 技术，理想情况下，应该将 20 个头分为两组，每组都由不同的 RAID
    技术进行保护。


    一旦磁盘配置了 RAID 保护，则应在受 RAID 1/RAID 10 保护的磁盘组上创建一个高冗余的 LUN，而在受 RAID 5 保护的磁盘组上创建一个或多个额外的
    LUN。此外，在每个 LUN 上应创建一个（且仅创建一个）文件系统。图 38 显示了此类配置在 Symmetric DMX 上的外观。需要注意的是，此插图中描的柱可以代表物理头，也可以代表超卷（hypervolumes）。如果使用物理头（例如在专用的磁盘数据仓库环境中），建议为创建的每个
    LUN/文件系统使用连接元卷（concatenated metavolumes）。


    图 38 在 Symmetric DMX 上针对非分区 DB2 数据库或分区 DB2 数据库的单个数据库分区的示例存储布局建议


    在涉及数据条带时，建议使用两级条带——所用存储硬件提供的条带，以及 DB2 在数据跨越多个表空间容器或数据库分区时执行的条带。除了第 104 页第 3.3.1
    节中提到的外，应避免在主机端进行逻辑卷管理器条带化。


    因此，如果你想创建一个 DMS 表空间，将其数据跨越在图 38 所示受 RAID 5 保护的磁盘上创建的文件系统，你可以通过执行如下 CREATE TABLESPACE
    SQL 语句来实现：


    ```

    CREATE TABLESPACE my_t MANAGED BY DATABASE USING

    FILE ''/data1fs/myctr1'' 20000,

    FILE ''/data2fs/myctr2'' 20000,

    FILE ''/data3fs/myctr3'' 20000,

    FILE ''/data4fs/myctr4'' 20000

    ```


    在 DB2 for Linux、UNIX 和 Windows 早期，使用原始设备作为存储容器的 DMS 表空间性能可能比使用文件容器的 DMS 表空间更好。随着技术的提高，使用原始设备作为存储容器的
    DMS 表空间与使用文件作为容器的 DMS 表空间之间的性能差距已经缩小。因此，如果你想创建一个 DMS 表空间，将其数据跨越在图 38 所示受 RAID
    5 保护的磁盘上创建的文件系统，你可以通过执行如下 CREATE TABLESPACE SQL 语句来实现：


    ```

    CREATE TABLESPACE my_t MANAGED BY DATABASE USING

    FILE ''/data1fs/myctr1'' 20000,

    FILE ''/data2fs/myctr2'' 20000,

    FILE ''/data3fs/myctr3'' 20000,

    FILE ''/data4fs/myctr4'' 20000

    ```


    （注：OCR 文本在源文件中存在重复，此处已处理唯一内容）。


    ### 3.6.2 关于文件系统缓存的说明


    在操作系统中，典型的读取操作涉及将数据从存储移动到文件系统缓存，然后将数据从缓存拷贝到应用程序缓冲区。同样，写入操作涉及将数据从应用程序缓冲区拷贝到文件系统缓存，然后将数据从缓存拷贝到存储。由于
    DB2 数据库管理器使用池管理自己的数据缓存，如果缓冲池的大小设置当，则不需要文件系统级别的缓存。在某些情况下，在文件系统级和 DB2 缓冲区同时进行缓存会导致性能下降。在没有双重缓存的情况下，大多数文件系统都有禁用文件缓存的功能。（在
    Linux 和 Unix 上，这通过在挂载文件系统时使用 `FILE_NO_BUFFERING` 标志来实现。某些文件系统（如 JFS2）支持增强、高性能的直接
    I/O，称为并发 I/O 或 CIO）。


    在 DB2 LUW 9.5 版本之前，使用文件系统缓存是隐含的，可以通过创建新表空间时指定 `NO FILE SYSTEM CACHING` 来禁用它，或使用
    `ALTER TABLESPACE` 语句来禁用。在 9.5 版本中，创建新表空间时默认禁用文件系统缓存（`NO FILE SYSTEM CACHING`）。


