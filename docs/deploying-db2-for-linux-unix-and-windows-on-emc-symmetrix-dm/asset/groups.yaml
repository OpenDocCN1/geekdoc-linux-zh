    # 4.2 Creating a partitioned database


    Partitioned databases are created in the same way as nonpartitioned databases
    are created – by using the Create Database Wizard or by executing the CREATE DATABASE
    command. In a partitioned environment, the resulting database is automatically
    created across all database partitions defined in the db2nodes.cfg file. (The
    db2nodes.cfg file is used to define the database partition servers that participate
    in a DB2 instance.) However, when creating a partitioned database, you must decide
    which partition will act as the catalog for that partition, and then create the
    database directly from that partition or from a remote client that is attached.
    The database partition to which you attach and execute the CREATE DATABASE command
    (or invoke the Create Database Wizard) becomes the catalog partition for the new
    database. (The catalog partition is the database partition on which all system
    catalog tables are stored; all access to systems must go through this partition.)


    As with nonpartitioned databases, information about partitioned databases is stored
    in a special hierarchical directory tree. Where this directory tree is actually
    created by information provided with the CREATE DATABASE command — if no location
    information is specified, this directory tree is identified by the db2path DB2
    Database Manager configuration parameter associated with the instance where the
    database is created. The root directory of this hierarchical tree is assigned
    and contain a subdirectory that has been assigned a name corresponding to the
    partition’s node – this directory will be named NODEXXXX (where XXXX is the unique
    partition number assigned to the partition as designated in the db2nodes.cfg file).
    For example, for partition number 43, this directory would be NODE0043. The node-directory,
    in turn, will contain one subdirectory for each database that has been created,
    with one subdirectory that includes the default containers that are to be used
    to hold the database’s data.


    The name assigned to the subdirectory that holds the containers used to house
    the database’s data is the same as that specified for the database; the subdirectory
    that contains the base files for the database corresponds to the database name
    that is assigned to the database during the creation process (the subdirectory
    for the first database will be named SQL00001, the subdirectory for the second
    database will be named SQL00002, and so on). Figure 40 on page 132 illustrates
    how this directory hierarchy would look for a database that spans two partitions.'
