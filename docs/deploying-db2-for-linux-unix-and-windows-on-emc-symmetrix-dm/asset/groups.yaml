    12 Deploy DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX


    # Preface


    As part of an effort to improve and enhance the performance and capabilities of
    its product lines, EMC periodically releases revisions of its hardware and software.
    Therefore, some functions described in this document may not be supported by all
    versions of the software or hardware currently in-use. For the most up-to-date
    information on product features, refer to the product release notes.


    This document provides a high-level overview of DB2 9.5 for Linux, UNIX, and Windows
    (LUW) and a general description of EMC products and utilities that can be used
    to store and manage DB2 LUW databases. It also provides information on how to
    deploy a DB2 LUW database on an EMC Symmetric DMX to achieve optimum performance.
    While much of the content focused on single-partition databases, considerations
    for multipartition databases are also addressed.


    This document is written primarily for IT professionals who have some experience
    working with DB2 9.5 for Linux, UNIX, and Windows (LUW), and are planning on deploying
    one or more DB2 LUW databases on a Symmetric DMX. However, any individual who
    would like to learn the optimum way to deploy DB2 LUW databases on Symmetric DMX
    storage systems will benefit from the information found in this book.


    # Audience


    Readers of the document are expected to be familiar with the following topics:


    - Symmetric operating environments

    - DB2 for Linux, UNIX, and Windows operations and concepts


    Other EMC publications include:


    - Symmetric DMX-4 Product Guide

    - Symmetric Remote Data Facility (SRDF) Product Guide

    - EMC Solutions Enabler Symmetric SRDF CLI Product Guide

    - EMC Solutions Enabler Symmetric TimeFinder CLI Product Guide


    Other IBM publications include:


    - IBM DB2 Version 9.5, Tuning Database Performance


    For more DB2 reference material, refer to:


    ```

    http://publib.boulder.ibm.com/infocenter/db2luw/v95/index.jsp

    http://www.ibm.com/redb-

    ```


    # Related documentation


    Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetric DMX 13


    # Author’s publications include:


    - DB2 9 Fundamentals: Certification Study Guide

    - DB2 9 for Linux, UNIX, and Windows Database Administration: Certification Study
    Guide


    # Conventions used in this document


    EMC uses the following conventions for special notices.


    > Note: A note presents information that is important, but not hazard-related.


    # IMPORTANT


    An important notice contains information essential to operation of the software
    or hardware.


    # Typographical conventions


    EMC uses the following style conventions in this document:


    Normal


    Used in running (nonprocedural) text for:

    - Names of interface elements (such as names of windows, dialog boxes, buttons,
    fields, and menus)

    - Names of resources, attributes, pools, Boolean expressions, buttons, DQL statements,
    keywords, clauses, environment variables, functions, utilities

    - URL paths, filenames, directory names, computer names, filenames, links, groups,
    service keys, file systems, notifications


    Bold


    Used in running (nonprocedural) text for:

    - Names of commands, daemons, options, programs, processes, services, applications,
    utilities, kernels, notifications, system calls, man pages


    Used in procedures for:

    - Names of interface elements (such as names of windows, dialog boxes, buttons,
    fields, and menus)

    - What user specifically selects, clicks, presses, or types


    Used in all text (including procedures) for:

    - Full titles of publications referenced in text

    - Emphasis (for example a new term)

    - Variables


    Italic


    Used for:

    - System output, such as an error message or script

    - URLs, complete paths, filenames, prompts, and syntax when shown outside of running
    text


    Courier bold


    Used for:

    - Specific user input (such as commands)


    Courier italic


    Used in procedures for:

    - Variables on command line

    - User input variables


    # DB2 command/SQL statement syntax conventions


    Many examples of DB2 9 administrative commands and SQL statements can be found
    throughout this book. The following conventions are used whenever a DB2 command
    or SQL statement is presented:


    - [] Parameters or items shown inside of brackets are required and must be provided.

    - > Parameters or items shown inside angle brackets are optional and do not have
    to be provided.

    - Vertical bars are used to indicate that one (and only one) item in the list
    of items presented can be specified.

    - comma followed by three periods (ellipsis) indicate that multiple instances
    of the preceding parameter or item can be included in the DB2 command or SQL statement.


    The following examples illustrate each of these conventions:


    # Example 1


    ```

    REFRESH TABLE [TableName, ...]

    <INCREMENTAL | NON INCREMENTAL>

    ```


    In this example, at least one TableName value must be provided, as indicated by
    the brackets ({}), and more than one TableName value can be provided, as indicated
    by the comma-ellipsis ( , ...) characters that follow the TableName parameter.
    INCREMENTAL and NON INCREMENTAL are optional, as indicated by the angle brackets
    (<), and either one or the other can be specified, but not both, as indicated
    by the vertical bar (|).


    # Example 2


    ```

    CREATE SEQUENCE [SequenceName]

    <AS [SMALLINT | INTEGER | BIGINT | DECIMAL]>

    <START WITH [StartingNumber]>

    <INCREMENT BY [1 | Increment]>

    <NO MINVALUE | MINVALUE [MinValue]>

    <NO MAXVALUE | MAXVALUE [MaxValue]>

    <NO CYCLE | CYCLE>

    <NO CACHE | CACHE 20 [CacheValue]>

    <NO ORDER | ORDER>

    ```


    In this example, a SequenceName value must be provided, as indicated by the brackets
    ({}). However, everything else is optional, and in many cases, a list of available
    option values is provided (for example, NO CYCLE and CYCLE), however only one
    can be specified, as indicated by the vertical bar (|). In addition, when some
    options are provided (for example, START WITH, INCREMENT BY, MINVALUE, MAXVALUE,
    and CACHE), a corresponding value must be provided, as indicated by the brackets
    ({}) that follow the option.


    Note: SQL is not a case-sensitive language, but for command syntax is presented
    in uppercase while user-supplied elements such as table names and column names
    are presented in lowercase. However, the examples can be entered in any case.

