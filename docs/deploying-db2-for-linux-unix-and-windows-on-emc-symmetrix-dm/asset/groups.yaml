    # 1.1 DB2 系列


    DB2 是 DATABASE 2 的缩写，诞生于 1983 年的 MVS 系统。1987 年，DB2 作为 OS/2/1 扩展版上的数据库管理器进入个人电脑
    (PC) 世界；一年后，它作为 IBM AS/400 服务器的 SQL/400 出现。1992 年，DB2 成为 OS/2 上的独立产品（此时更名为 DB2/2），1993
    年，DB2 出现在 AIX 上（这引发了另一次更名，DB2/2 变为 DB2 for Common Servers）。1994 年，DB2 的新版本被引入
    HP-UX 和 Solaris，1995 年引入 Windows，1999 年引入 Linux。（在此期间，名称再次发生变化，DB2 for Common
    Servers 变为 DB2 通用数据库或 **DB2 UDB**）。


    DB2 9.5 是 IBM 针对分布式系统的数据管理软件的最新版本（随着此版本的发布又有了一个变化）。之前的 DB2 运行在多种平台（AIX, HP-UX,
    Linux, Solaris, Windows 和 z/OS）上，并提供多个版本——其中每个版本都是为了满足特定的业务需求而设计的。这些版本带有提供额外存储能力和高级连接的广泛附加套件，统称为
    DB2 系列。构成 DB2 系列核心的实体包括：


    - DB2 Everplace。DB2 Everplace 是一个占用极小（约 350 KB）的关系型数据库和高性能数据同步解决方案，允许企业级应用和数据扩展到个人数字助理
    (PDA)、手持计算机 (HPC) 和智能手机等移动设备。DB2 可以用作驻留在移动设备上的本地独立数据库，也可以在连接可用时从远程服务器访问信息。DB2
    Everplace 还可以嵌入到移动设备中以增加其功能。


    DB2 Everplace 提供两个版本：DB2 数据库版和 DB2 Everplace 企业版。DB2 Everplace 数据库版设计用于独立软件供应商
    (ISVs) 以及处理移动设备上存储的 DB2 Everplace 嵌入式应用程序。DB2 Everplace 企业版设计用于完整的数据中心 DB2 服务器，其功能足以管理移动设备与后端数据存储（如
    DB 9, Informix）之间的数据分发和同步。


    - DB2 Express。之前的 DB2 运行在多种平台（AIX, HP-UX, Linux, Solaris, Windows 和 z/OS）上，并提供多个版本——其中每个版本都是为了满足特定的业务需求而设计的。这些版本带有提供额外存储能力和高级连接的广泛附加套件，统称为
    DB2 系列。构成 DB2 系列核心的实体包括：

    （注：此处原文存在内容重复，已根据指令要求处理并翻译）


    - DB2 Express。DB2 Express 版本（或 Express）是一个入门级服务器，设计用于在具有两个 CPU（双核处理器被视为单个 CPU）、4
    GB 内存且运行支持的 Linux, Solaris 或 Windows 的微机上。DB2 Express 包含丰富的功能集，可以满足大多数需求；对于需要额外功能的环境，可以提供额外的附加组件。


    - DB2 Express-C。DB2 Express-C 是一个免费的入门级数据服务器，设计用于在具有两个 CPU、4 GB 内存且运行支持的 Linux
    或 Windows 的微机上。DB2 Express-C 旨在用于评估目的，以及 C++, Java, .NET, PHP 等应用程序。本质上，DB2 Express-C
    是 DB2 Express 的子集，作为 DB2 Express 的插件可用。


    # Linux、UNIX 和 Windows 版 DB2 9.5 简介


    **DB2 Personal 版**。DB2 Personal 版 (PE) 是一个单用户、全功能的关系型数据库系统，非常适合桌面或笔记本电脑部署。通过 DB2
    Personal，用户可以创建、操作和管理任意数量的本地数据库；受控数据库可以进行远程管理。运行 DB2 的 PC 可以作为远程客户端访问 DB2 Personal，但必须为每个访问
    DB2 Personal 的用户获取许可。


    **DB2 工作组版**。DB2 工作组版 (WSE) 是一个多用户客户端/服务器数据库管理系统，设计用于具有 4 个 CPU、16 GB 内存且运行以下任何操作系统：AIX,
    HP-UX, Solaris, Linux (32 位和 64 位)、Novell Enterprise Server 以及 Windows (32 位和
    64 位)。


    DB2 工作组版包含了 DB2 Express 的所有功能，并为较大的服务器提供了扩展性。因此，它是用户数量较少的小型业务环境和部门的理想数据服务器。


    **DB2 企业版**。DB2 企业版 (ESE) 是一个多用户、支持 Web 的客户端/服务器数据库管理系统，可以轻松处理高量交易处理、TB 级数据仓库以及来自
    SAP 等供应商的关键任务应用程序。它设计用于在任何规模的服务器（从一个到数百个 CPU）上运行，支持以下任何操作系统：AIX, HP-UX, Solaris,
    Linux (32 位和 64 位)、Novell Enterprise Server 以及 Windows (32 位和 64 位)。


    DB2 企业版包含了 DB2 工作组版的所有功能，以及处理高用户负载和提供 24x7x65 性所需的功能，包括：


    - 高可用灾难恢复 (HADR)

    - 数据分区

    - 表（范围）分区

    - 在线表和索引重组

    - 物化查询表

    - 多维数据聚类

    - 全查询并行

    - 连接连接器

    - DB2 控制器

    - 多平台服务器自动化 (TSA MP)


    DB2 企业版还配备了紧密集的连接产品 (DB2 Connect)，允许其使用分布式数据库架构 (DRDA) 协议参与异构网络。这允许最多 5 个用户与基于
    iSeries 和 2Series 的数据库、Informix 动态服务器 (IDS) 数据库以及 CICS、VSAM 和 IMS 等基础资源进行交互。


