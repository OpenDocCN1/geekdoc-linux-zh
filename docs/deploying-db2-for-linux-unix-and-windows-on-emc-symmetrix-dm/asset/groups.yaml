    only changes to tracks on the source cause any incremental storage to be consumed.


    The synsnap create and synmap activate commands are used to create source/target
    Snap pair.


    Table 4 summarizes the differences between devices used in TimeFinder/Snap operations.


    | Device | Description |

    | Virtual device | A logical-image that saves disk space through the use of pointers
    to track data that is immediately accessible after activation. Snap data uses
    a copy-on-write technique. |

    | Save device | A device that is not host-accessible but accessed only through
    the virtual devices that points to it. Save devices provide a pool of physical
    space to store snap copy to which virtual devices point. |

    | BCV | A full volume mirror that has valid data after synchronizing with its
    source device. It is accessible only when split from the source device that it
    is mirroring. |


    # 2.6.7.1 Snap copy sessions


    TimeFinder/Snap functionality is managed via copy sessions, which pair the source
    and target devices. Sessions are maintained on the Symmetrix system and can be
    queried to verify the current state of the devices. A copy session must be created—a
    process which defines the Snap devices in the operation. On subsequent activation,
    the target virtual devices become accessible to its host. Unless the data is changed
    by the hosting virtual device, the virtual device always presents a frozen-in-time
    copy of the source device at the point of activation. The information is no longer
    needed, the session can be terminated.


    TimeFinder/Snap operations are controlled by the host using the synsnap command
    to create, activate, and restore the TimeFinder/Snap operations described in this
    section explain how to manage the devices participating in a copy session through
    SYMLCI.'
