    在调用命令行处理器时，可以指定各种命令行选项；可以通过在系统提示符或命令行处理器提示符（当命令行处理器以交互输入模式运行时）执行命令 **LIST COMMAND
    OPTIONS** 来获取所有可用选项列表。


