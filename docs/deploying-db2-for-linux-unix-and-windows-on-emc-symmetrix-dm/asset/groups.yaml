    # Deploying DB2 9.5 for Linux, UNIX, and Windows Databases


    ![](img/9d79d979aef40e6535a55c940991009e_107_0.png)


    Figure 37 Striped metametrics


    It is possible to create metavolumes with up to 255 hypervolumes, although in
    practice metavolumes are usually created with 4 to 16 members. Currently, the
    only stripe size available for a metavol is 960 KB.


    In a data warehouse environment, metamolumes can be composed of RAID 5 or RAID
    6 hypervolumes, but it is recommended that the members be concatenated rather
    than striped. For OLTP environments striped metamolumes comprised of hypervolumes
    are protected using RAID 5 or RAID 6 are preferred over concatenated metamolumes.


    # 3.3.4 Database-based striping


    With DB2 LUW, database-based striping involves creating table spaces that span
    multiple storage containers. In Chapter 1 we see that table spaces are used to
    control where data is physically stored and to provide a layer of indirection
    between database objects (such as tables, indexes, and views) and one or more
    containers (i.e., directories, files, or raw devices) which the object''s data
    resides. Data is transferred to containers in 4 KB, 8 KB, 16 KB or 32 KB blocks
    (called pages) and when a table space spans multiple containers, data is written
    in groups of pages (called extents), in a round-robin fashion, each container
    used by that table space. Thus, data is striped across the containers; the stripe
    size used is one extent.


    # 3.3.4 Striping considerations


    When host-based striping is used, CPU cycles are required to manage the striping;
    this, in turn, affects performance. However the small impact on performance is
    offset by the fact that each device in a striped volume group maintains an I/O
    queue, potentially increasing performance over a Symmetrix metamol, which has
    only a single I/O queue on the host. However, in DB2 LUW environment, host-based
    striping is only recommended for storage transaction log files when synchronous
    SRDF is used, stripe sizes in the host can be tuned to smaller increments than
    is currently available with Symmetrix metam. It is important to note that adding
    more storage to an existing striped logical volume can require a significant amount
    of work - in some cases, the data must be backed up, and the logical volume must
    be reconfigured, and the data must be restored in order for a successful expansion.


    106 Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX'
  - '[PAGE 108]


    In many environments, customers have achieved high-performance back-end layouts
    on the Symmetrix DMX by allocating all of the storage needed as four-way striped
    metavolves. This approach guarantees that any volume presented to the host will
    be striped, and it reduces the chance for contention on any given disk spindle.


    One approach that is gaining popularity in DB2 LUW environments is the combined
    use of both database-based and array-based stripping. Known as double stripe,
    this configuration utilizes striped metavolves in the Symmetrix array, which are
    presented to a host where they are striped again at the database level. Such a
    configuration provides many advantages in database environments where read access
    is small and highly random in nature; I/O patterns are pseudo-random, access to
    data is spread across a large quantity of physical spindles, thereby decreasing
    the probability of contention on any given disk.


    Another way of double stripping is by combining RAID 5 or RAID 6 protection with
    Symmetrix metavolves. A RAID 5 hypervolume stripes data across either four or
    eight physical disks using a stripe size of 128 KB (256 KB for DMX-3 and later).
    Symmetrix metavolves stripe two or more hyperavolves with a stripe size of 960
    KB. However, when using this approach to perform double stripping, it is important
    to ensure that data members do not end up on the same physical spindles. Otherwise,
    performance can be adversely affected.


    It is also important to note that while it is possible to triple stripe data by
    combining host-based striping, RAID 5 or RAID 6 protection, and Symmetrix metavolves,
    EMC does not recommend its use, since such a configuration increases data complexity,
    and testing has shown that it can actually be detrimental to performance.


    Data can also be striped by combining host-based striping with database-based
    and storage-based striping. However, such a combination is not recommended except
    for the very largest of database configurations — this level of stripping will
    interfere with the Symmetrix''s prefetch algorithms unless interaction with the
    storage involves very large table and/or index scans that result in sequential
    access patterns to all disks in the three-layered stripe configuration.'
