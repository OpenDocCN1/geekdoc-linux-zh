    # 1.2.1 The Control Center


    Of the DB2 GUI tools available, the Control Center is the most important and versatile.
    The Control Center presents a clear, concise view of an entire system and serves
    as the central point for managing DB2 systems and performing common administration
    tasks. With the Control Center, users:


    +   * Create and delete instances.

    * Create and delete (drop) DB2 databases.

    * Catalog and uncatalog databases.

    * Configure instances and databases.

    * Create, alter, and drop buffer pools, table spaces, tables, views, indexes,
    aliases, triggers, schemas, and user-defined data types (UDIs).

    * Grant and revoke authorities and privileges.

    * Export, import, or load data.

    * Reorganize tables and collect table statistics.

    * Back up and restore databases and table spaces.

    * Replicate data between systems.

    * Manage database connections.

    * Monitor resources and track event as as they take place.

    * Analyze queries.

    * Schedule jobs to run unattended.


    The Control Center interface presents itself using one of three different views:


    +   * Basic. The basic view displays essential objects such as databases, tables,
    views, and stored procedures and limits the actions you can perform to those objects.
    This is the view you should use if you only want to perform core DB2 database
    operations.

