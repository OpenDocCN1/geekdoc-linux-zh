    # ## 1.8.2 Configuring instances


    Whenever an instance is created, a corresponding DB2 Database Manager configuration
    file is also created and initialized as per the instance creation process. Each
    DB2 Database Manager configuration file is made up of approximately 85 different
    parameter values, and most control the amount of system resources that are allocated
    to a single DB2 Database Manager instance.


    You can view the contents of the DB2 Database Manager configuration file for the
    current instance by executing the GET DATABASE MANAGER CONFIGURATION command.
    The syntax for this command is:


    ```

    GET [DATABASE MANAGER | DB MANAGER | DBM]

    [CONFIGURATION | CONFIG CFG]

    <SHOW DETAIL>

    ```


    Thus, if you wanted to view the contents of the DB2 Database Manager configuration
    file for the current instance, you could do so by executing the GET DATABASE CONFIGURATION
    command looks like this:


    ```

    GET DBM CFG

    ```


    Configuring a DB2 9.5 database environment'
  - '[PAGE 55]


    # Introduction to DB2 9.5 for Linux, UNIX, and Windows


    You can change the value assigned to a particular DB2 Database Manager configuration
    file parameter for the current instance by executing the UPDATE DATABASE MANAGER
    CONFIGURATION command. The syntax for this command is:


    ```

    UPDATE [DATABASE MANAGER | DB MANAGER | DBM]

    [CONFIGURATION | CONFIG | CFG]

    USING [Parameter] [Value]

    [Parameter] [Value] | AUTOMATIC |

    [Parameter] AUTOMATIC |

    [Parameter] MANUAL, ...]

    <IMMEDIATE | DEFERRED>

    ```


    where:


    +   * Parameter Identifies one or more DB2 Database Manager configuration parameters
    (by keyword) whose values are to be modified. (In many cases, the keyword for
    a parameter is the same as the parameter name itself.)

    * Value Identifies the new value or values that are to be assigned the DB2 Database
    Manager configuration parameter(s) specified.


    If the AUTOMATIC clause is specified, DB2 will automatically adjust the parameter
    value to reflect the current resource requirements. If a value is specified along
    with the AUTOMATIC clause, the value may influence the calculations performed.


    If the DEFERRED clause is specified the UPDATE DATABASE MANAGER CONFIGURATION
    command, changes made to the configuration file will not take effect until the
    instance is stopped and restarted. If neither clause is specified, all changes
    made to the DB2 Database Manager configuration file will take effect immediately—provided
    that requirements are met.


    So you wanted to limit the current instance so that the maximum number of applications
    that can be executing concurrently at any given point in time is 100, you could
    do so by executing an UPDATE DATABASE MANAGER CONFIGURATION command that looks
    like this:


    ```

    UPDATE DB2 CFG USING MAXAGENTS 100

    ```


    The contents of a DB2 Manager configuration file can also be viewed or altered
    using the DBM Configuration dialog box, which can be activated by the Configure
    Parameters action from the Instances menu in the Control Center. Figure 19 on
    page 55 shows the Control Center menu items that must be selected to activate
    the DBM Configuration dialog box; Figure 20 on page 56 shows how this dialog box
    might look after it has been activated.


