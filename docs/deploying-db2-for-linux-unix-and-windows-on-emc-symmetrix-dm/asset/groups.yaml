    部署 Linux、UNIX 和 Windows 上的 DB2 9.5


    可以创建包含多达 255 个超卷的元卷，尽管在实践中，元卷通常由 4 到 16 个成员组成。目前，元卷唯一可用的条带大小为 960 KB。


    在数据仓库环境中，元卷可以由 RAID 5 或 RAID 6 超卷组成，但建议对成员进行合并（concatenated）而非条带化（striped）。对于
    OLTP 环境，由超卷组成且受 RAID 5 或 RAID 6 保护的条带化元卷优于合并型元卷。


    ## 3.3.4. 基于数据库的条带


    在 DB2 LUW 中，基于数据库的条带涉及创建跨多个存储容器的表空间。在第 1 章中我们看到表空间用于控制数据的物理存储位置，并在数据库对象（如表、索引和视图）与存储数据的一个或多个容器（即目录、文件或原始设备）之间提供一个间接层。数据以
    4 KB、8 KB、16 KB 或 32 KB 块（称为页）传输到容器中，当表空间跨越多个容器时，数据以页组（称为区）为单位，以轮询方式写入该表空间所使用的每个容器中。因此，数据跨容器进行条带化；所使用的条带大小为一个区。


    ## 3.3.4. 条带考虑因素


    使用基于主机的条带化时，需要 CPU 周期来管理条带；这反过来会影响性能。然而，对性能的微小影响被以下事实抵消：条带化卷组中的每个设备都维护一个 I/O 队列，与在主机上仅有一个单个
    I/O 队列的 Symmetrix 元卷相比，可能会提高性能。然而在 DB2 LUW 环境中，仅在使用同步 SRDF 时建议对存储事务日志文件使用基于主机的条带，主机上的条带大小可以调整为比当前
    Symmetrix 元卷更小的增量。需要注意的是，向现有的条带化逻辑卷添加更多存储空间可能需要大量工作——在某些情况下，必须备份数据、重新配置逻辑卷并恢复数据才能实现成功扩展。


    在 EMC Symmetrix DMX 上部署适用于 Linux、UNIX 和 Windows 的 DB2


    在许多环境中，客户通过将所有所需的存储分配为四路条带化元卷，在 Symmetrix DMX 上实现了高性能的后端布局。这种方法确保了呈现给主机的任何卷都是条带化的，并减少了在特定磁盘磁柱上发生竞争的可能性。


    DB2 LUW 环境中一种正日益流行的方法是结合使用基于数据库和基于阵列的条带。这种配置被称为“双条带”（double stripe），它利用了 Symmetrix
    阵列中的条带化元卷，将其呈现给主机，然后在数据库级别再次对其进行条带化。这种配置在读取访问规模较小且具有高度随机性的数据库环境中具有许多优势；I/O 模式是伪随机的，数据访问分布在大量的物理磁柱上，从而降低了任何特定磁盘发生竞争的概率。


    双条带的另一种方法是将 RAID 5 或 RAID 6 保护与 Symmetrix 元卷结合。RAID 5 超卷使用 128 KB 的条带大小（DMX-3
    及后续版本为 256 KB）在四个或八个物理磁盘上对数据进行条带化。Symmetrix 元卷以 960 KB 的条带大小对两个或多个超卷进行条带化。然而，在使用这种方法执行双条带时，必须确保数据成员不会落到相同的物理磁柱上。否则，性能可能会受到不利影响。


    同样重要的是，虽然通通过结合基于主机的条带化、RAID 5 或 RAID 6 保护以及 Symmetrix 元卷来实现数据的三条带（triple stripe），但
    EMC 不建议使用这种配置，因为这种配置增加了数据的复杂性，且测试显示它实际上对性能有害。


    数据还可以通过结合基于主机的条带化与基于数据库及基于存储的条带来实现条带化。然而，除了最大的数据库配置外，否则不建议进行这种组合——这种级别的条带化会干扰
    Symmetrix 的预取算法，除非与存储的交互涉及非常大的表和/或索引扫描，从而导致三层条带配置中的所有磁盘上产生顺序访问模式。


    ## 3.4. 影响 DB2 数据库性能的布局考虑因素


    数据在磁盘磁柱上的物理放置可能会对 DB2 LUW 数据库性能产生重大影响。影响数据库性能的放置因素包括：


    - 物理磁柱上的超卷选择

    - 数据库文件跨超卷/磁柱的分布

    - I/O 数据是否连续存储在所使用的超卷/磁柱上（最小化寻道时间）

    - 文件跨物理磁柱和后端控制器的分布（以减少组件瓶颈）


    ### 3.4.1. 影响磁盘性能的特性


    有许多会影响磁盘性能的特性。具体而言，它们的特性是：


    - 驱动器定位（寻道时间）。这是执行机构将头从当前位置移动到新位置所需的时间。

    - 旋转（Rotational latency）。这是所需数据旋转到磁头下方的时间。

    - 接口速度。这是磁盘与主机之间的数据传输速率。

    - 面密度（Areal density）。这是磁盘表面可以存储的数据量。

    - 容量（Capacity）。指驱动器可以容的总存储卷。


