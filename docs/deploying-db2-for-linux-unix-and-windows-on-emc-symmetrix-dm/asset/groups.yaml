    +   5. The system catalog tables and views are created.


    After the table SYSCSPACE is created, a special set of tables, known as the system
    catalog tables, constructed within that table. The DB2 Database Manager uses the
    system catalog tables to keep track of information such as object definitions,
    database object dependencies, database object privileges, column data types, table
    constraints, and object relationships. A set of system catalog views is created
    along with the system catalog tables, and these views are typically used when
    accessing data stored in the system catalog tables. The system catalog tables
    and views cannot be modified with SQL statements (however, their contents can
    be viewed). Instead, they are modified by the DB2 Manager whenever one of the
    following events occurs:


    +   - A database object (such as a table, view, or index) is created, altered,
    or dropped.


    +   - Authorizations or privileges are granted or revoked.


    +   - Statistical information is collected for a table.


    +   - Packages are bound to the database.


    In most cases, the complete characteristics of a database object are stored in
    one or more system catalog tables when the object is created. However, in some
    cases, as when triggers and constraints are defined, the actual DB2.5 SQL used
    to create the object is stored inside.


    +   6. The database is cataloged in the system and local database directory (a
    system or local database directory created first if it does not exist).


    DB2 uses a set of special files to keep track of where databases are stored and
    to provide access to those databases. The information stored in these files is
    used like the information stored in an office-building is used, and is referred
    to as directories. Whenever a database is created, these directories are updated
    with the database''s name and alias. If specified, a comment and code set are
