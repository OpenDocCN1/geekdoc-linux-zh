    # 2.1 Introduction


    EMC® provides many hardware and software products that support application environments
    on Symmetrix® systems. The following products, which are highlighted and discussed,
    were used and/or tested with DB2 for Linux, Unix and Windows. This chapter provides
    a technical overview of the EMC products used in this book.


    EMC Symmetrix — EMC offers an extensive product line of high-end storage solutions
    targeted to meet the requirements of mission-critical databases and applications.
    The Symmetrix product line includes the DMX™ Direct Matrix architecture series.
    EMC Symmetrix is a fully redundant, high-availability storage processor, providing
    nondisruptive component replacements and code upgrades. The Symmetrix system feature
    high levels of performance, data integrity, reliability, and availability.


    EMC Infinity™ Operating Environment — Infinity interoperation between previous
    generations of Symmetrix systems and enables them to connect to a large number
    of server types, operating systems and storage products, and a broad selection
    of network connectivity elements and other devices, ranging from HBAs and drivers
    to switches and tape systems.


    EMC Solutions Enabler — Solutions Enabler is a package that contains the SYMAPI
    runtime libraries and the SYMLCI command line interface. SYMAPI provides the interface
    to the EMC Infinity operating environment. SYMLCI is a set of commands that can
    be invoked from the command line or within scripts. These commands can be used
    to monitor device configuration and status, and to perform control operations
    on devices and data objects within a storage complex.


    EMC Symmetrix Remote Data Facility (SRDF) — SRDF is a business continuity software
    solution that replicates and maintains a mirror image of data at the storage block
    level in a remote Symmetrix system. The SRDF component extends the SYMLCI set
    of Solutions Enabler to include commands that specifically manage SRDF.


    EMC SRDF consistency groups — An SRDF consistency group is a collection of related
    Symmetrix devices that are configured to act in union to maintain data integrity.
    Devices in consistency groups can be spread across multiple Symmetrix systems.


    EMC TimeFinder — TimeFinder is a family of products that enable LINUX-based replication
    within a single Symmetrix system. Data is copied from Symmetrix devices using
    array-based resources without using CPU or I/O. The source Symmetrix devices remain
    online for regular I/O operations while the copies are created. The TimeFinder
    family has three separate and distinct software products, TimeFinder/Mirror, Clone,
    and TimeFinder/Snap:


    +   - TimeFinder/Mirror enables users to configure specific, called business continuity
    volumes (BCVs), to create a mirror image of Symmetrix devices. Using BCVs, TimeFinder
    creates a point-in-time copy of data that can be repurposed. The TimeFinder/Mirror
    component extends the basic SYMLCI set of Solutions Enabler to include commands
    that specifically manage Symmetry BCVs and standard devices.


    +   - TimeFinder/Clone enables users to make copies of data simultaneously on
    multiple target devices from a single source device. The data is available immediately
    upon activation, even if the process has not completed. Data may be copied from
    a single source to as many as 16 target devices. A source device can be either
    a Symmetrix standard device or a TimeFinder BCV.'
- md: '

    -   TimeFinder/Snap enables users to configure special devices in the Symmetrix
    DMX array called virtual devices (VDEVs) and save area devices (SAVDEVs). These
    devices can be used to make pointer-based, space-saving copies of data simultaneously
    on multiple target devices from a single source device. The data is available
    to a target''s host immediately upon acquisition. Data may be copied from a single
    source device to as many as 128 VDEVs. A source device can be either a standard
    device or a TimeFinder BCV device. A target device is a VDEV, A SAVDEV is a virtual
    device that is used to hold the changing contents of the source or target device.


    EMC Change Tracker — EMC Change Tracker software measures changes to data on a
    Symmetrix volume or group of volumes. Change Tracker software is often used as
    a planning tool in the analysis and design of configurations that use the EMC
    TimeFinder or SRDF components to store data at remote sites.


    Solutions Enabler Storage Resource Management (SRM) component — The SRM component
    extends the basic SYMLCI command set of Solutions Enabler to include commands
    that allow users to systematically find and examine attributes of various objects
    on the host, within a specified relational database, or in the EMC enterprise
    storage. The SRM commands provide mapping support for relational databases, file
    systems, logical volumes and volume groups, as well as performance statistics.


    EMC PowerPath — PowerPath is host-based software that provides I/O path management.
    PowerPath operates with several storage systems, on several enterprise operating
    systems and provides failover and load balancing transparent to the host application
    and database.


    ## 2.2 EMC Symmetrix DMX


    All Symmetrix systems provide advanced data replication capabilities, full mainframe
    and open systems support, and flexible connectivity options, including Fibre Channel,
    FICON, ESCON, Gigabit Ethernet, and iSCSI.


    Interoperability between Symmetrix storage systems enables customers to migrate
    storage solutions from one generation to the next, protecting their investment
    even as their demands expand.


    The Symmetrix DMX enhanced cache director technology supports multiple global
    memory directors, allowing configurations comprised of hundreds of gigabytes of
    global memory. Refer to the appropriate EMC Symmetrix DMX Product Guide for information
    on the types of global memory devices available and the maximum amount of memory
    allowed.


    The Symmetrix on-board data integrity features include:


    - Continuous cache and on-disk data integrity checking and error detection/correction

    - Fault isolation

    - Nondisruptive hardware and software upgrades

    - Automatic diagnostics and phone-home capabilities


    At the software level, advanced integrity features ensure information is always
    protected and available. By choosing a mix of RAID 1 (mirroring), RAID 1+0, high-performance
    RAID 5 (3+1 and 7+1), and RAID 6 protection, users have the flexibility to choose
    the protection level most appropriate to the value and performance requirements
    of their information. The Symmetrix DMX is the latest generation of high-end storage
    solutions that EMC provides.


    From the perspective of the host operating system, a Symmetrix system appears
    to be multiple physical devices connected through one or more I/O controllers.
    The host operating system addresses each of these devices using a physical device
    name. Each physical device includes attributes, vendor ID, product ID, product
    ID, revision level, and serial ID. The host physical device maps to a Symmetrix
    device. In turn, the Symmetrix device is a virtual representation of a section
    of the physical disk called a hypervolume.


    ## 2.3 EMC Solutions Enabler base management


    The EMC Solutions Enabler kit contains all the base management software that provides
    a host with SYMAP1-shared libraries and the basic Symmetrix command line interface
    (SYMLCI). Other optional subcomponents in the Solutions Enabler (SYMLCI) series
    enable users to extend functionality of the Symmetrix systems. Three prime-components
    are:


    - Solutions Enabler SYMLCI SRDF, SRDF/CG, and SRDF/A

    - Solutions Enabler SYMLCI TimeFinder/Mirror, TimeFinder/CG, TimeFinder/Snap,
    TimeFinder/Clone

    - Solutions Enabler SYMLCI Storage Resource Management (SRM)


    These components are discussed later in this chapter.


    SYMLCI resides on a host system to monitor and control operations on Symmetrix
    storage arrays. SYMLCI commands are invoked from the host operating system command
    line or via scripts. SYMLCI commands invoke low-level channel to specialized devices
    on the Symmetrix called gatekeepers. Gatekeepers are very small devices carved
    from disks that act as SCSI targets for the SYMLCI commands.


    SYMLCI is used in single command line entries or in scripts to perform and control
    operations on devices and data objects toward the management of the storage complex.
    It also monitors device configuration and status of devices that make up the storage
    environment. To reduce the number of inquiries from the host to the database systems,
    configuration and status information is maintained in a host database file.


    Table 3 lists the SYMLCI base commands discussed in this book.


    Table 3 SYMLCI base commands (page 1 of 2)


    | Command | Argument | Description |

    |---|---|---|

    | symdg | create | Performs operations on a device group (dg) Creates an empty
    device group |

    | | delete | Deletes a group |

    | | rename | Renames a device group |

    | | release | Releases a device external lock associated with all devices in a
    device group |

    | | list | Displays a list of all device groups known to this host |

    | | show | Shows detailed information about a device group and any gatekeeper
    or BCV devices associated with the device group |

    | symcg | create | Performs operations on a composite group (cg) Creates an empty
    composite group |

    | | add | Adds a device to a composite group |

    | | remove | Removes a device from a composite group |

    | | delete | Deletes a composite group |

    | | rename | Renames a composite group |


    ## Table 3 SYMCLI base commands (page 2 of 2)


    | Command | Argument | Description |

    |---|---|---|

    | | release | Releases a device external lock associated with all devices in a
    composite group |

    | | hold | Hold devices in a composite group |

    | | unfold | Unhold devices in a composite group |

    | | list | Displays a list of all composite groups known to this host |

    | | show | Shows detailed information about a composite group, and any gatekeeper
    or BCV devices associated with the group |

    | symld | | Performs operations on a device in a group |

    | | add | Adds devices to a device group and assigns the device to a logical name
    |

    | | list | Lists all devices in a device group and any associated BCV devices
    |

    | | remove | Removes a device from a device group |

    | | rename | Renames a device in the device group |

    | | show | Shows detailed information about a device in the device group |

    | symbv | | Performs operations on BCV pairs |

    | | list | Lists BCV devices |

    | | associate | Associates BCV devices to a device group - required to perform
    operations on the BCV device

    | | disassemble | Disassociates BCV devices from a device group |

    | | associate -rdf | Associates remotely attached BCV devices to a SRDF device
    group |

    | | disassemble -rdf | Disassociates remotely attached BCV devices from an SRDF
    device group |

