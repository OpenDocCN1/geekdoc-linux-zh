    # EMC 基础产品


    处理完成。后台拆分继续拆分 BCV 对直到完成。当包含 -instant 选项或默认包含时，SYMLCI 在前台拆分后立即返回，允许在 BCV 对在后台进行拆分时执行其他操作。


    以下操作对 MyDevGrp 中的所有 BCV 对执行即时拆分，并允许 SYMLCI 在后台拆分进行时返回到服务器进程：


    ```

    symmir -g MyDevGrp split -instant -noprompt

    ```


    以下 symmir 查询示例命令检查复合组 MyConGrp 的拆分进度。-bg 选项用于查询后台拆分的状态：


    ```

    symmir -cg MyConGrp query -bg

    ```


    ## 2.6.3 TimeFinder 恢复Finder 恢复操作


    BCV 设备可用于在标准卷上进行全量或增量数据恢复。类似于全量建立操作，全量恢复会将 BCV 设备的全部内容复制到标准设备。执行恢复的设备可以在设备组、复合组或设备文件中定义。例如：


    ```

    symmir -g MyDevGrp -full restore -noprompt

    symmir -cg MyConGrp -full restore -noprompt

    symmir -f MyFile -sid 109 restore -noprompt

    ```


    增量恢复过程与全量恢复过程的效果相同，但有一个显著节省时间的例外。BCV 仅将 BCV 对进行拆分期间在 BCV 设备上更新的新数据复制到标准设备。BCV
    设备相应轨道上的数据还会覆盖标准设备上任何已更改的轨道。这最大化地提高了重同步过程的效率。此过程非常有用，例如，如果在 BCV 设备上完成对数据库更新版本或新应用程序的测试或验证，用户希望在标准设备上迁移并利用已测试的数据或应用程序副本。


    > 只有当两个卷存在 TimeFinder 关系时，才能对标准卷进行增量恢复。


    ## 2.6.4 TimeFinder 一致性拆分


    TimeFinder 一致性拆分允许你在不中断在线服务的情况下，拆分出应用程序的依赖写入且可重启的镜像。一致性拆分有助于避免在不静止或停止应用程序的情况下拆分应用程序相关的
    BCV 时可能出现的不性和重启问题。一致性拆分使用 Ingenuity 一致性辅助 (ECA) 功能实现。此功能需要 TimeFinder/CF 许可证。


    在 EMC Symmetrix DMX 上部署 Linux、UNIX 和 Windows DB2


    ## 2.6.4.1 Ingenuity 一致性辅助


    Symmetrix 操作系统的 Ingenuity 一致性辅助 (ECA) 功能可用于跨异构环境执行一致性拆分操作。此功能需要 TimeFinder/GC
    许可证，并使用 split 命令的 `consistent` 选项。


    使用 ECA 从标准设备一致拆分 BCV 设备时，必须有一个没有数据库的控制主机或具有专用网关通道的数据库主机。专用通道不能用于服务其他设备或冻结 I/O。例如，要拆分设备组，执行：


    ```

    symmir -g MyDevGrp split -consistent -noprompt

    ```


    图 29 展示了跨越三个访问 Symmetrix 系统设备的数据库主机的 ECA 拆分。


    ![](img/9d79d979aef40e6535a55c940991009e_84_0.png)


    图 29


    为了对目标应用程序进行一致性拆分，必须在控制主机上创建设备组或复合组。创建设备组可以包含维护业务连续性所需的所有设备。例如，如果定义的设备组包含了主机 A、B
    和 C 访问的所有设备（见图 29），则可以使用单个命令对这些主机相关的所有 BCV 对进行一致性拆分。


    然而，如果定义的设备组仅包含主机 A 访问的设备，则可以拆分与主机 A 相关的 BCV 对而不影响其他主机。图 29 中的实线垂直线表示在即时拆分过程中，
    ECA 对 I/O 的挂留，从而在 BCV 中创建依赖写入的一致镜像。


    第 84 页的图 30 展示了与数据库管理系统 (DBMS) 使用本地一致性拆分。


    # EMC 基础产品


    ![](img/9d79d979aef40e6535a55c940991009e_85_0.png)


    图 30 本地 Symmetrix 系统上的 ECA 一致性拆分


    当从生产主机带 ECA 发出 split 命令时，将按照图 30 中的事件序列创建一致的数据库镜像：


    1. 设备组、设备文件或复合组识别持有数据库的标准设备。

    2. SYMAPI 与 Symmetrix Ingenuity 通信以验证所有识别出的 BCV 对均可以拆分。

    3. SYMAPI 与 Symmetrix Ingenuity 通信打开 ECA 窗口（Symmetrix Ingenuity 中延迟写入的时间），发出即时拆分并通过关闭窗口释放写入。

    4. ECA 挂起对持有数据库的标准设备的写入，DBMS 无法向这些设备写入，随后等待这些设备可用后再恢复任何进一步写入活动：对设备的读取活动不受影响，除非尝试从具有写入队列的设备上进行读取。

    5. SYMAPI 与 Symmetrix Ingenuity 通信以确认拆分。BCV 现在包含数据库的一致镜像。

    6. ECA 释放对持有数据库的标准设备的写入，DBMS 现在可以向这些设备写入。


    (注：原文中存在大量重复的 OCR 错误，翻译时已进行去重处理。)

    '
