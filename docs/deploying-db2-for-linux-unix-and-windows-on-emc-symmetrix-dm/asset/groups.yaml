    - 对象详情窗（位于控制中心右下方），包含对象树或内容窗格中所选对象的详细信息。


    ### 1.2.2 命令编辑器


    命令编辑器是一个交互式 GUI ，用于生成、执行和操作 SQL 语句和 DB2 命令；处理输出结果；以及查看解释语句访问计划的图形表示。通过命令编辑器，用户可以：


    - 执行 SQL 语句

    - 查看 SQL 语句和 DB2 命令的执行结果，并查看查询产生的结果。

    - 将 SQL 语句和 DB2 命令的执行结果保存到外部文件。

    - 创建并保存 SQL 语句和 DB2 命令序列，以便由任务中心调用。（然后可以调度脚本文件在特定时间或频率运行）

    - 使用 SQL 助手工具构建复杂查询。

    - 在执行之前（或之后）检查 SQL 语句相关的执行计划和统计信息。


    ## DB2 9.5 版 Linux、UNIX 和 Windows 介绍


    图 4 显示了建立数据库连接后命令编辑器的样子。


    图 4


    # 命令编辑器


    如图 4 所示，命令编辑器由三个页面组成（通过标签页访问）：命令页、查询结果页和访问计划页。用户可以在命令页上输入并执行 SQL 语句或 DB2 命令、创建并保存脚本、运行现有脚本或调度任务。一旦执行查询，用户可以在查询结果页上查看结果（如果有的话）。在访问计划页上，用户可以查看在命令页上指定的任何可解释语句的访问计划。（如果在命令页上指定了多个
    SQL 语句，则仅为遇到的第一个语句创建访问计划。）

