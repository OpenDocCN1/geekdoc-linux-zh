    # Introduction to DB2 9.5 for Linux, Unix, and Windows


    **DB2 Personal Edition.** DB2 Personal Edition (PE) is a single-user, full function,
    relational database management system that is ideal for desktop or laptop-based
    deployments. Databases under its control can be managed remotely, for occasionally
    connected or remote office implementations that do not require multisuer capability.
    With DB2 Personal Edition a user can create, manipulate, and administer any number
    of local databases, however database must reside on a storage medium that is access
    by the PC that the DB2 software has installed on. Remote clients cannot access
    databases that are under DB2 Personal Edition''s control, but PCs running DB2
    Personal can act as remote clients and access data stored on other DB2 servers.
    DB2 Personal Edition can be deployed on any PC that is running Linux or Windows
    - however, you must acquire a license for each user that will access a database
    under its control.


    **DB2 Workgroup Server Edition.** DB2 Workgroup Server Edition (WSE) is a multifuer,
    client/server database management system designed to be used on microcomputers
    that have up to 4 CPUs, up to 16 GB of memory, and are running any of the following
    operating systems: AIX, HP-UX, Solaris, Linux (32-bit and 64-bit), Novell Enterprise
    Server, and Windows (32-bit and 64-bit).


    DB2 Workgroup Server Edition includes all the features of DB2 Express, providing
