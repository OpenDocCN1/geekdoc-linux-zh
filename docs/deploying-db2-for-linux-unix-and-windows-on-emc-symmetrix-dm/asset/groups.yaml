    # Deploying DB2 9.5 for Linux, UNIX, and Windows Databases


    To determine the transaction commit rate within a given period, execute the following
    query at the beginning and end of the desired monitoring window:


    ```

    SELECT (COMMIT_SQL_STMTS + ROLLBACK_SQL_STMTS)

    AS to_commit

    FROM TABLE (SNAPSHOT_DATABASE(''PROD'', -1))

    AS snapshot_database

    ```


    Subtract the results of the first query from the results of the second and divide
    by the number of seconds in the monitoring window. If the commit rate is less
    than one per second, a mincommit setting of 1 is recommended; if the commit rate
    is greater than three per second, assigning the mincommit configuration parameter
    a value greater than 1 may improve performance. The mincommit database configuration
    parameter has no effect on AIX version 5.2 and later, and beginning with DB2 version
    8.1, FixPack4, assigning the mincommit parameter value greater than 1 has no effect
    on DB2 execution.


    # 3.8.3 Temporary table replication


    Temporary tables are used primarily to store temporary data and intermediate results
    of complex SQL sorts, as well as to provide a storage area for the system to perform
    operations like sorts and data groupings. Changes made to data stored in temporary
    tables usually do not need to be copied to remote replication. And if the amount
    of data to be transmitted can be reduced without compromising database consistency,
    the bandwidth needed for remote replication can be decreased and performance gains
    can be realized.


    To prevent replicating changes to data stored in temporary table spaces, system
    temporary table spaces and user temporary table spaces should be isolated to LUNs
    that are not being replicated. These LUNs should be designed for temporary table
    data only and should not contain any information that is required at the remote
    site. One effect of not copying temporary table data to a remote site is that
    both the local and the remote sites will have temporary table spaces that are
    not being replicated which will have to be created. This is done by starting the
    database at the replication site in such a way that the temporary table spaces
    are in “Drop Pending” state and then creating every temporary table space expected.
    A database can be started such that or in “Drop Pending” state by executing a
    RESTART DATABASE command that looks like this:


    ```

    RESTART DATABASE (Alias) DROP PENDING TABLESPACES

    ( <TableName>, )

    ```


    where:


    +   - DBAlias — Identifies the database, by alias, that is to be started in “Database
    Pending” state.

    - TableName — Identifies one or more table spaces that are to be placed in “Drop
    Pending” state.


    If, you want to start a database named TEMPSPACE and put a temporary table name
    in “Drop Pending” state, you could do so by executing a RESTART DATABASE command
    that looks like this:


    ```

    RESTART DATABASE sample DROP PENDING TABLESPACES (tablespace)

    ```


    Once the database has been successfully started, you can re-create each table
    space that was placed in “Drop Pending” state by dropping it with the DROP SQL
    statement and re-creating it with the CREATE TABLESPACE statement.


