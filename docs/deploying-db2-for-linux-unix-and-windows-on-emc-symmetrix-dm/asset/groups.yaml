    one disk in the set is logically considered to be providing parity data only and
    therefore is not included in the calculations.)


    | RAID configuration | Metavolume count | DB2_PARALLEL_IO setting |

    |---|---|---|

    | RAID 1 | None | 1 |

    | RAID 1 | 4-way | 4 |

    | RAID 1 | 8-way | 8 |

    | RAID 5 (3+1) | None | 3 |

    | RAID 5 (3+1) | 4-way | 12 |

    | RAID 5 (3+1) | 8-way | 24 |

    | RAID 5 (7+1) | None | 7 |

    | RAID 5 (7+1) | 4-way | 28 |

    | RAID 6 | n-way | n - 2 |


    Table 10 DB2_PARALLEL_IO settings for various RAID configurations


    ### 3.7.2 The DB2_USE_PAGE_CONTAINER_TAG variable


    With DB LUW Version 7 earlier, whenever a DBMS table was created, a one-page tag
    was stored at the beginning of each container for identification purposes. The
    remaining pages were then available for storage and were grouped into extent-size
    blocks of data. And as we have just seen, when using RAID devices for table storage,
    it suggests that the table space be created with an extent size that is equal,
    or a multiple of, the RAID stripe. However, because the one-page container extent
    would not line up with the RAID stripes, it often caused I/O requests to access
    more physical disks than optimal. To eliminate this problem, the DB2_STRIPED_CONTAINERS
    registry variable was used to tell DB2 to use a full extent to store the identification
    tag in each table container. If this variable was set to ON, every table space
    created would store container tags.


    Beginning with DB LUW, Version 8.1 table space container tags are stored in full
    extents and the DB2_STRIPED_CONTAINERS registry variable is no longer available.
    However, a new variable, the DB2_USE_PAGE_CONTAINER_TAG registry variable exists
    in place and if this variable is set to ON, table space container tags will be
    written to a single page instead of a full extent. When anything other than RAID
    1 devices is used for table space storage containers, you should not enable this
    registry variable.


    ### 3.7.3 The NUM_IOSERVERS database configuration parameter


    I/O servers, all prefetched, are used on behalf of database agents to perform
    prefetch I/O and asynchronous I/O for utilities like the Backup utility and the
    Restore utility. The num_ioservers database configuration parameter is used to
    specify the number of I/O servers that can be in progress for a database at any
    given point in time (An I/O server waits until an I/O operation that initiated
    it is in progress.) Non-prefetch IOs are scheduled directly from database agents
    and as a result are not constrained by the value assigned to the num_ioservers
    database configuration.


    To fully exploit the I/O devices in a database that is using automatic storage,
    a good value to assign to this configuration parameter is the value AUTOMATIC.


    If you are not using automatic storage or the value AUTOMATIC is not recognized
    (as is the case with earlier versions of DB2), this configuration parameter should
    be assigned a number that is one or two more than the physical devices on which
    the database resides. It is better to configure a few additional I/O servers and
    not use them, than to configure enough since there is a minimal amount of overhead
    associated with each one; any unused I/O servers will remain idle. Unfortunately,
    a Symmetric DMS is not obvious to a DB2 LUW database, this number may not be.


    Each hypervolume presented to the host may be served by one or more head/disk
    arrays (HDAs) and multiple hypervolumes can be served by the same HDA. Understanding
    how the storage is laid out is imperative to assigning a meaningful value to the
    num_ioservers database configuration parameter.


    ### 3.7.4 Table size extent


    In Section 1.6, "A closer look at table spaces," we say that data is transferred
    to and from containers in 4 KB, 8 KB, 16 KB or 32 KB blocks called pages and when
    a table space spans multiple containers, data is written in groups of pages called
    extents, in a round-robin fashion, to each container assigned to that table space.
    Thus the extent for a table space is essentially the stripe size for the table
    space if more than one container is used. A table space''s extent is defined as
    part of the table space creation process, and cannot be changed without dropping
    and re- the table space. Therefore, it is important to choose the right size for
    a table space before it is populated with data.


    When deciding on an extent to use, the size and type of tables that will be stored
    in the table space should be taken into consideration.


    - A data object—This is where the regular column data is stored.

    - An index object—This is where all indexes defined on the table are stored.

    - A long field object—If the table has one or more LONG columns, this is where
    long field data is stored.

    - Two LOB objects—If the table has one or more LOB columns, then each object is
    used to store the LOB.


    Optimizing table space performance when storage reside on RAID devices


    | Page size | LUN configuration | Recommended extent size (DMX-2; DMX-3) | Comments
    |

    |---|---|---|---|

    | 4 KB | RAID 5 | 32 pages; 64 pages | N/A |

    | 4 KB | Metavolume | 240 pages; 480 pages | This may be too large for some applications.
    120 or 60 would work at the cost of some queuing at the disk level |

    | 4 KB | RAID 5 Metavolume | 32 pages; 64 pages | N/A |

    | 8 KB | RAID 5 | 16 pages; 32 pages | N/A |

    | 8 KB | Metavolume | 120 pages; 240 pages | This may be too large for some applications.
    120 or 60 would work at the cost of some queuing at the disk level |

    | 8 KB | RAID 5 Metavolume | 16 pages; 32 pages | N/A |

    | 16 KB | RAID 5 | 8 pages; 16 pages | N/A |

    | 16 KB | Metavolume | 60 pages; 120 pages | N/A |

    | 16 KB | RAID 5 Metavolume | 8 pages; 16 pages | N/A |

    | 32 KB | RAID 5 | 4 pages; 8 pages | This may be too small for large data warehouses.
    Consider using a multiple of 4 as 8, 16, or 32 |

    | 32 KB | Metavolume | 30 pages; 60 pages | N/A |

    | 32 KB | RAID 5 Metavolume | 4 pages; 8 pages | This may be too small for large
    data warehouses. Consider using a multiple of 4 as 8, 16, or 32 |

