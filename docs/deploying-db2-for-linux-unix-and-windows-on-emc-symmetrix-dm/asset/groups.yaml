    and the prefetch size of a table space is not AUTOMATIC, the degree of parallelism
    used by the table size is the prefetch size divided by the extent size. Thus,
    if the DB2_PARALLEL_IO registry variable has been set for a table space that has
    a prefetch size of 160 and an extent of 32 pages, each prefetch request will be
    broken into five-sized prefetch requests (160 /32=5).


    Note: If the DB2_PARALLEL_IO registry variable is set, and the prefetch size of
    a table space is AUTOMATIC, DB2 calculates the prefetch size using the following
    equation: prefetch size = number of containers * number of disks per container
    * extent size.


    Often, the DB2_PARALLEL_IO registry variable is assigned the asterisk (*) to indicate
    that every table space in the database is to parallel I/O. (The asterisk value
    implies that each table container used spans six disk spindles.) Such an assignment
    is made by executing a db2set command that looks something like this:


    ```

    db2set DB2_PARALLEL_IO=*

    ```


    However, this is not a correct setting to use when data is stored on a Symmetrix
    DMX array. When a DB2 LUW database is constructed on a Symmetrix DMX, the DB2_PARALLEL_IO
    registry variable should be set by executing a db2set command that looks more
    like this:


    ```

    db2set DB2_PARALLEL_IO*=[TS_ID]:[DisksPerCtr], . .

    ```


    where:


    +   * TS_ID - Identifies one or more individual table spaces, by their numeric
    type

    * DisksPerCtr - Identifies the number of physical disks used by each table space
    container that is assigned to the table space specified.


    Thus, if you wanted to set the DB2_PARALLEL_IO registry variable for a table space
    whose numeric ID is 1 to reflect that its storage containers reside on a RAID
    5+3+1 group (3 data spindles), you could do so by executing a db2set command that
    looks something like this:


    ```

    db2set DB2_PARALLEL_IO=1:3

    ```


    On the other hand, if you wanted to set the DB2_PARALLEL_IO registry variable
    for two table spaces whose numeric IDs are 1 and 3 to reflect that their storage
    containers reside on a RAID 1+0 group (4 data spindles, 4 mirrored disk spindles),
    you could do so by executing a db2set command that looks something like this:


    ```

    db2set DB2_PARALLEL_IO=1:4,3:4

    ```


    And finally, if you wanted to set the DB2_PARALLEL_IO registry variable to indicate
    that the storage containers for all table spaces reside on a RAID 5+7+1 group
    (7 data disk spindles), you could do so by executing a db2set command that looks
    something like this:


    ```

    db2set DB2_PARALLEL_IO=*:7

    ```'
