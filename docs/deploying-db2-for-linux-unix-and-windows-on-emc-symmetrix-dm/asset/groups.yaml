    # DB2 9.5 用于 Linux、Unix 和 Windows 数据库


    读取操作可以根据需要使用缓存来满足主机请求（假设有空闲缓存槽），但 Symmetrix DMX 限制了发送到单个设备的写入操作次数。这种“写入等待限制”旨在防止对单个卷具有高写入率的应用程序消耗所有可用存储阵列缓存，从而以牺牲其他卷的读取/或写入操作为代价。如果达到了设备的写入等待限制，则在处理任何新写入请求之前，必须将该设备的所有等待写入数据刷入磁盘（destaged）。这种强制刷入磁盘的操作将该特定卷的写入速度限制在物理磁盘速度上，这会显著降低性能。


    除了写入等待限制外，存储子系统级还施加了某些限制。当达到这些限制时，DMX 将以“优先级降级”模式运行。在这种模式下，将写入刷入磁盘是磁盘适配器的最高优先级任务；结果是主机读取和写入性能的下降。


    缓存板的数量也会对性能产生细微影响。在比较具有相同缓存量的 Symmetrix DMX 阵列时，增加板卡数量（例如，四块每块 16 GB 的缓存板或两块每块
    32 GB 的缓存板）对 DSS 应用的性能有微小的积极影响。这是因为前端直连接器与缓存之间的路径增加，具有提高整体吞吐量的效果。然而，配置额外的板卡对高吞吐量环境（如
    OLT 工作负载）有所帮助，而在 IOPS 比吞吐量更关键的环境中，额外的缓存直连接器无法提供性能收益。这是因为每个板卡上 CPU 的处理能力限制了每个端口或直连接器的
    IOPS数量。


    ## 3.1.3 后端


    磁盘技术的进步尚未跟上存储阵列其他部分（如直连接器和带宽）的发展。因此，Symmetrix DMX 中的某些瓶颈直接归因于驱动器的限制。为了减少或消除 Symmetrix
    DMX 后端性能问题，应注意将 I/O 分布在尽可能多的后端直连接器物理磁头上（而不是为特定应用程序分配特定的直连接器磁头）。


    确保最佳后端性能最重要的事项之一是处理预期的 I/O 负载。每个物理磁盘都能执行有限次数的操作，Symmetrix DMX Infinity 环境中的所有算法都将有助于减少对磁盘的读写次数，特别是支持随机操作，而随机操作仍然是一个限制因素。如果没有足够的物理磁盘来处理
    I/O 负载，性能将受到影响。因此，为 DB2 LU 工作负载使用多少磁盘磁头的决策应该基于 I/O 性能需求，而不是预期的存储容量。


    还应重点关注在所有物理磁头上平衡 I/O 负载。如果能预先知道可用空间的 I/O 模式，可以通过将产生大量 I/O 的表集存储在不同的物理磁盘上，最大限地减少冲突并提高性能。然而，由于
    I/O 模式可能会随时间变化，在所有磁盘上平衡 I/O 负载可能仍然是解决方案。Symmetrix Optimizer 还可以帮助减少单个物理磁头上超卷（hypervolumes）之间的
    I/O 冲突（如果工作负载需求发生，Symmetrix Optimizer 是帮助减少物理磁头冲突的宝贵工具）。使用时，Symmetrix Optimizer
    会寻找单个超卷上的 I/O 冲突，并在发现冲突情况时，非中断性地将超卷移动到另一块磁盘上的新位置。


    数据在磁盘上的放置位置也会影响性能。由于磁盘的旋转特性，磁盘外部分的磁道性能优于靠近中心的磁道。虽然 Symmetrix DMX Engine 环境中的算法可以平滑这种变化，但通过将高
    I/O 指向磁盘的外边缘可以提高性能。磁头上超卷之间的磁盘移动是最小的。跨越盘片的磁盘移动（寻道时间）是 I/O 性能延迟的大来源。将接收高 I/O 活动的超卷彼此靠近放置可能会减少磁头移动，从而提高磁盘性能。


    ## 3.1.4 其他考虑


    除了前端连接、缓存利用和后端配置外，还有一些额外因素会影响给定数据库配置的布局选择。这些因素包括：


    - 主机总线适配器。主机总线适配器（HBA）是一种电路板和/或集成电路适配器，为服务器和存储设备提供物理连接。（HBA 及其相关的磁盘子系统有时被称为磁盘通道。）由于
    HBA 减轻了主机微处理器处理数据存储和检索任务的负担，它可以提高服务器性能。但是，如果配置的 HBA 数量不足，它们 可能会成为瓶颈。在设计 DB2 数据库系统时，应考虑所需的吞吐量，并相应地配置数量的
    HBA。


    - 主机地址限制。在许多主机平台上，单个 HBA 可寻址的 LUN 数量受到限制。例如，在 AIX 上可以呈现的最大 LUN 数为 512，而在其他操作系统上，最大数为
    256。在设计数据库存储基础设施时必须考虑此限制。


    ## 3.2 RAID


    独立磁盘冗余阵列（RAID）技术提供了磁盘故障的保护（通过冗余）、性能的大幅提升（通过在磁盘间分布信息）以及高可用性。RAID 有多种不同的实现级别：


    - RAID 1：RAID 1 简单来说磁盘镜像。RAID 1 配置由两个磁盘组成，每次写入都会写入两个磁盘。环境允许读取两个数据副本以满足不在缓存中的请求。如果磁盘故障，则使用镜像驱动器进行恢复。RAID
    1 提供了高可用性和性能，但因为它双倍了使用的磁头数量，成本更高。


    - RAID 5：RAID 5 通过在阵列使用的所有磁头上条带化写入数据并为每个条带计算校验值来提供保护，然后将校验值存储在阵列中的所有驱动器中。校验值仅仅是一种冗余检查，确保在不使用重复磁盘的情况下保护数据保护；如果阵列中的任何磁盘发生故障，可以使用校验值结合剩余驱动器重新创建故障磁盘的内容，从而防止数据丢失。RAID
    5 提供了良好的可用性和性能，且成本比 RAID 1 低。


    - RAID 6：RAID 6 是 RAID 5 的扩展，具有双校验。它通过在阵列使用的所有磁头上条带化写入数据并为每个条带计算两个校验值来提供保护，并将这些校验值存储在所有驱动器中。双校验的目标是提高容错能力；RAID
    6 在两个磁盘驱动器同时故障时提供容错，而 RAID 5 最多只能处理一次故障。这使得 RAID 6 组更加实用，特别是对于高可用性系统。


    '
