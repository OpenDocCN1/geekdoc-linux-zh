    ## 2.5 EMC Symmetrix Remote Data Facility


    The Symmetrix Remote Data Facility (SRDF) component of EMC Solutions En extends
    the basic SYMCLI command set to enable users to manage SRDF, SRDF is a business
    continuity solution that provides a host-independent, mirrored storage solution
    for duplicating site data to one or more physically separated target Symmetrix
    systems. In basic terms, SRDF is a configuration of multiple symmetrix systems
    whose purpose is to maintain multiple copies of logical data in more than one
    location.


    SRDF replicates production or primary (source) site data to a secondary (target)
    site transparently to users, applications, databases, and host processors. The
    local SRDF device, known as the source (R1) device, is configured in a partner
    relationship with a remote target (R2) device. While the R2 device is mirrored
    to the remote host, after the R2 device synchronizes with its R1 device, the R2
    device can be split from the R1 device at any time, making the R2 device fully
    accessible again to its host. After the split, the target (R2) device contains
    valid data and is available for performing continuity tasks through its original
    data address.


    SRDF requires configuration of specific source Symmetrix volumes (R1) to be mirrored
    to target Symmetrix volumes (R2). if the primary site is no longer able to continue
    processing when SRDF is operating in synchronous mode, data at the secondary site
    is current up to the I/O Fraction. When primary systems are down, SRDF enables
    faster failover to the secondary copy of the data so that critical information
    becomes available in minutes. Business operations and related applications resume
    full functionality with minimal interruption.


    Figure 23 illustrates a basic SRDF configuration where connectivity between the
    two Symmetrix is provided using ESCON, Fibre Channel, or Gigabit Ethernet. The
    connection between the R1 and R2 volumes is through a logical grouping of devices
    called an RA group. The RA group is independent of the device and composite groups
    defined and discussed in Section 2.5.3, "SRDF device groups and composite groups,"
    on page 68.


    ![](img/9d79d979aef40e6535a55c940991009e_68_0.png)


    Figure 23 Basic synchronous SRDF configuration


    ### 2.5.1 SRDF benefits


    SRDF offers the following features and benefits:


    - High data availability

    - High performance

    - Flexible configurations

    - Host and application software transparency

    - Automatic recovery from a component or link failure

    - Significantly reduced recovery time after a disaster

    - Increased integrity of recovery procedures

    - Reduced backup and recovery costs

    - Reduced disaster recovery complexity, planning, testing, etc.

    - Support Business Continuance across and between multiple databases on multiple
    servers and Symmetrix systems.


    ### 2.5.2 SRDF modes of operation


    SRDF currently supports the following modes of operation:


    - Synchronous mode (SRDF/S) provides real-time mirroring of data between the source
    Symmetrix system(s) and the target Symmetrix system(s). Data is written simultaneously
    to the cache of both systems in real time before the application I/O is committed,
    ensuring the highest possible data availability. Data must be successfully stored
    in both the local and remote Symmetrix systems before acknowledgment is sent to
    the local host. This is used mainly for metropolitan area distances less than
    200 km.

    - Asynchronous mode (SRDF/A) maintains a dependent-write consistent copy of data
    at all times any distance with no application impact. Applications needing to
    replicate data across long distances have had limited options, SRDF/A delivers
    high-performance, extended-distance replication and reduced telecommunications
    cost, what averaging existing management capabilities with no host performance
    impact.

    - Adaptive copy mode transfers data from source devices to target devices regardless
    of order or consistency, and without host performance impact. This is especially
    useful when transferring large amounts of data during data center migrations,
    consolidations, and in data mobility environments. Adaptive copy mode is the data
    movement mechanism of the Symmetrix Automated Replication solution.


    ### 2.5.3 SRDF device groups and composite groups


    Applications running on Symmetrix systems normally involve a number of Symmetrix
    devices. Therefore, any Symmetrix operation must ensure all related devices are
    operated upon as a logical group. Defining device or composite groups achieves
    this.


    A device group or a composite group is a user-defined group of devices that SCLI
    commands can execute upon. Device groups are limited to a single Symmetrix system
    and RA group (a.k.a. SRDF group). A composite group, on the other hand, can span
    multiple Symmetrix systems and RA groups. The device or composite group type may
    contain R1 or R2 devices and may contain various device lists for standard, BCV,
    virtual, and remote BCV devices. The symdg/symld and symcg commands are used to
    create and manage device and composite groups, respectively.


    ### 2.5.4 SRDF consistency groups


    An SRDF consistency group is collection of devices defined by a composite group
    that has been enabled for consistency protection. Its purpose is to protect integrity
    for applications that span multiple RA groups and/or Symmetrix systems. The protected
    applications may configure multiple heterogeneous resource managers across multiple
    host operating systems.


    An SRDF consistency group uses PowerPath or EntityConsistency Assist (SRDF-ECA)
    to provide disastrous restart with zero data loss. Disaster restarts use these
    consistency groups provide remote restart with short recovery times. Zero data
    loss implies that all completed transactions at the beginning of a disaster will
    be available at the target.


    When the amount of data for an application becomes very large, the time and resources
    required for host-based software to protect, back up, or decision-support queries
    on these databases become critical factors. The time required to quiet or shut
    down the application for backup is no longer acceptable. SRDF consistency groups
    allow users to remotely mirror the largest data environments and atomically split
    dependent-consistent, restartable copies of applications in seconds without interruption
    to service.


    A consistency group is a composite of SRDF devices (R1 or R2) in union to maintain
    the integrity of applications across Symmetrix systems or multiple RA groups within
    a single Symmetrix. If source (R1) device, EMC-software intercepts writes from
    all R1 devices in the consistency group, halting all data flow to the target R2
    devices. This suspension, tripping the consistency group, ensures that a dependent-write
    consistent R2 copy of the database up to the point in time that the consistency
    group tripped.


    Tripping a consistency group can occur either automatically or manually. Scenarios
    in an automatic trip would occur include:


    - One or more R1 devices cannot propagate changes to their corresponding R2 devices

    - The R2 device fails

    - The SRDF directs on the R1 side or R2 side fail


    In an automatic trip, the Symmetrix system completes the writes to the R1 device,
    which indicates that the write did not propagate to the R2 device. EMC software
    intercepts the I/O and instructs the Symmetrix to suspend all R1 source devices
    in the consistency group from propagating any further writes to the R2 side. Once
    the suspension is complete, writes to all of the R1 devices in the consistency
    group continue normally, but they are not propagated to the target until SRDF
    mirroring resumes.


    An explicit trip occurs when the command symcli -cg suspend or split is invoked.
    Ordering or splitting the consistency group creates an on-demand, restartable
    copy of the database at the R2 target site. BCV devices are synchronized with
    the R2 devices are then split after the consistency group is tripped, creating
    a second dependent-write consistent copy of the data. During the explicit trip,
    SYMCLI issues the command to create the dependent-write consistent copy, but may
    require assistance from PowerPath or SRDF-ECA if I/O is received on one or more
    devices, or if the SYMCLI commands are abnormally terminated before the explicit
    trip.

    '
