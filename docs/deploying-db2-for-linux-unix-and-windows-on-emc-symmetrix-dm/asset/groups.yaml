    ## 2.7 EMC Storage Resource Management


    The Storage Resource Management (SRM) component of EMC Solutions Enabler extends
    the basic SYMCLI command set to include SRM commands that allow users to discover
    and examine various objects on a host.


    - SYMCLI commands support SRM in the following areas:

    - Data objects and files

    - Relational databases

    - File systems

    - Logical volumes and volume groups

    - Performance statistics


    SRM allows users to examine the mapping of storage devices and the characteristics
    of data files and objects. These commands allow the examination of relationships
    between extents and data files or objects, and how they are mapped on storage
    devices. SRM commands are used with TimeFinder and SRDF to create point-in-time
    copies for backup.


    Figure 33 outlines the process of how SRM commands are used with TimeFinder in
    a database environment.


    | Host | SRM | EMCC² Data | EMCC² |

    | :--- | :--- | :--- | :--- |

    | SYMAPI SYMCLI | ① SYMCLI Mapping Command | DEV 001 | BCV 001 |

    | DBMS | ② Invoke Database APIs identify devices | DEV 002 | BCV 002 |

    | PowerPath or ECA | ③ Map database metadata and the SYMCLI database | DEV 003
    | BCV 003 |

    | | ④ TimeFinder SPLIT | DEV 004 | BCV 004 |


    **Figure 33 SRM commands**


    EMC Solutions Enabler with a valid license for TimeFinder and SRM is installed
    on the host. In addition, the host must also have PowerPath or ECA, and be utilized
    with a supported DBMS system. As discussed in section TimeFinder split operations,
    when splitting a BCV, the system must perform housekeeping tasks that may require
    a few seconds on a Symmetrix system. These tasks involve a series of steps (shown
    in Figure 33) that result in the separation of the BCV from its paired standard:


    - 1. Using the SRM base mapping commands, first query the Symmetrix system to
    display the logical-to-physical mapping information about any physical device,
    logical volume, file, directory, and/or file system.

    - 2. Using the database mapping command, query the Symmetrix to display physical
    and logical database information.

    ```'
